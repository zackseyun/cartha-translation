source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: ta
  text: அந்தப் பெண் அவரிடம், “மேசியா—‘கிறிஸ்து’ என்று அழைக்கப்படுகிறவர்[a]—வருகிறார் என்று எனக்குத் தெரியும். அவர் வரும்போது, எல்லாவற்றையும் நமக்கு அறிவிப்பார்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில், செமித்தியப் பட்டப்பெயரான “மேசியா”வை “கிறிஸ்து என்று அழைக்கப்படுகிறவர்” என்ற கிரேக்கப் பட்டப்பெயரால் விளக்குகிறது. இரண்டுக்கும் “அபிஷேகம் செய்யப்பட்டவர்” என்பது பொருள்.
    reason: Μεσσίας மற்றும் χριστός ஆகியவற்றுக்கு இடையிலான மூலமொழி விளக்க உறவையும் அவற்றின் பொருள் தொடர்பையும் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  choice: அந்தப் பெண் அவரிடம் … என்றாள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடைக்கேற்ப இறந்தகாலமாகத் தருகிறது; சூழலில் குறிப்பிடப்பட்ட சமாரியப் பெண்ணையே குறிக்கிறது.
- source_word: Οἶδα
  choice: எனக்குத் தெரியும்
  rationale: அறிந்திருப்பதைத் தெரிவிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: Μεσσίας
  choice: மேசியா
  rationale: செமித்திய பட்டப்பெயரின் வழக்கிலுள்ள தமிழ் ஒலிபெயர்ப்பைத் தக்கவைத்து, யூத–சமாரிய எதிர்பார்ப்பின் சூழலைப் பாதுகாக்கிறது.
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: எதிர்கால நோக்குள்ள கிரேக்க நிகழ்காலத்தையும் வருகையின் எதிர்பார்ப்பையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ λεγόμενος χριστός
  choice: '[a] அடிக்குறிப்பில்: ‘கிறிஸ்து என்று அழைக்கப்படுகிறவர்’'
  rationale: Μεσσίας என்பதற்கு கிரேக்க வாசகர்களுக்காக χριστός என யோவான் தரும் விளக்கத்தைப் பாதுகாக்கிறது; தமிழில் இரண்டு ஒலிபெயர்ப்புகளையும் தொடர்ச்சியாக இடுவதால் ஏற்படும் தேவையற்ற குழப்பத்தை அடிக்குறிப்பு தெளிவாக்குகிறது.
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: அவர் வரும்போது
  rationale: எதிர்கால நிகழ்வைச் சுட்டும் நிபந்தனைத் தன்மையை இயல்பான தமிழில் தருகிறது; ἐκεῖνος-இன் சுட்டுவலிமை தனிப்பட்ட ‘அவர்’ மூலம் போதுமான அளவு வெளிப்படுகிறது.
- source_word: ἀναγγελεῖ ἡμῖν ἅπαντα
  choice: எல்லாவற்றையும் நமக்கு அறிவிப்பார்
  rationale: ἀναγγέλλω-வின் ‘தெரிவித்தல்/அறிவித்தல்’ பொருளையும் ἅπαντα-வின் முழுமையான பரப்பையும் கண்ணியமான, தெளிவான தமிழில் தருகிறது.
theological_decisions:
- issue: Μεσσίας மற்றும் χριστός ஆகிய இரு பட்டப்பெயர்களின் உறவு
  choice: முதன்மை உரையில் ‘மேசியா’ என்றும், மூலத்தின் விளக்கமான ‘கிறிஸ்து என்று அழைக்கப்படுகிறவர்’ என்பதை அடிக்குறிப்பிலும் தருதல்
  alternative: முதன்மை உரையில் ‘மேசியா—கிறிஸ்து என்று அழைக்கப்படுகிறவர்—’ என்று இரண்டையும் சேர்த்தல்
  rationale: இரண்டையும் ஒரே தமிழ்ச் சொல்லாக மாற்றி மூலத்தின் இருமொழி விளக்கத்தை அழிக்காமல், அவை இரு வேறு நபர்களைக் குறிக்கும் என்ற தவறான எண்ணத்தையும் உருவாக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. மரியாதைப் பன்மை அல்லாத உயர்திணை ஒருமை வினைமுற்றுகள் மேசியாவைக் குறிக்க இயல்பாகப் பயன்படுத்தப்பட்டுள்ளன.
