  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι, ὁ λαλῶν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/026.yaml
  text: Jesus said to her[a], “I am, the one speaking to you.”
translation:
  language: ta
  text: இயேசு அவளிடம், “நான்தான் உன்னிடம் பேசுகிறவன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்’ இயல்பாக உள்ளது.
- source_word: αὐτῇ
  choice: அவளிடம்
  rationale: பெண்பால் ஒருமை மறைமுகப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: Ἐγώ εἰμι
  choice: நானே அவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மேசியாவை இயேசு தாமே என்று அடையாளப்படுத்தும் சூழலைத் தமிழில் தெளிவாகத் தருகிறது; எனினும் ‘அவர்’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லை என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: ὁ λαλῶν σοι
  choice: உன்னோடு பேசிக்கொண்டிருப்பவன்
  rationale: உருபுடன் கூடிய நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியான செயற்பாட்டையும், இயேசுவுக்கும் பெண்ணுக்கும் இடையிலான உரையாடலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மேசியாவாகிய அடையாளத்தை முதன்மை உரையில் வெளிப்படையாக்க வேண்டுமா?
  choice: ‘நானே அவர்’ என்று சூழலில் மறைந்துள்ள அடையாளத்தைத் தமிழில் நிரப்புதல்
  alternative: ‘நான் இருக்கிறேன், உன்னோடு பேசிக்கொண்டிருப்பவன் நானே’
  rationale: யோவான் 4:25-ன் உடனடிச் சூழலில் ‘அவர்’ என்பது மேசியாவைக் குறிக்கிறது. தமிழ் மொழியில் வெறும் ‘நான் இருக்கிறேன்’ என்பது இருப்பை மட்டும் குறிக்கும் கூற்றாகத் தவறாகப் புரியக்கூடும். அதேவேளை, மூலத்தின் சுருக்கத்தையும் இறையியல் ஒலிவையும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பான, கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உன்னோடு’ என்பது ஒருமைச் சூழலுக்குப் பொருத்தமான இயல்பான வடிவம்; மரியாதைக் குறிப்பை மூலத்தில் இல்லாதபடி சேர்க்கவில்லை.
