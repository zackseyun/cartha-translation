  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: ta
  text: அந்த அரச அதிகாரி, இயேசு யூதேயாவிலிருந்து கலிலேயாவுக்கு வந்திருக்கிறார் என்று கேள்விப்பட்டபோது, அவரிடம் சென்று, இயேசு கீழே வந்து[b] தன் மகனைக் குணமாக்கும்படி அவரைக் கேட்டுக்கொண்டார்[a]; ஏனெனில் அந்த மகன் இறக்கவிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொடர்ந்து கேட்டுக்கொண்டிருந்தார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க மொழியிலுள்ள முற்றுப்பெறா வினை, வேண்டுகோள் தொடர்ந்து அல்லது மீண்டும் மீண்டும் செய்யப்பட்டதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘கீழே வந்து’ என்பது இரு இடங்களுக்கு இடையிலான உயர வேறுபாட்டை வெளிப்படுத்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: அவர்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அரச அலுவலரையே இது சுட்டுகிறது. தமிழில் தொடரும் கதையோட்டத்தில் மரியாதைப் பன்மையான ‘அவர்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀκούσας
  choice: கேள்விப்பட்டு
  rationale: 'இறந்தகாலப் பங்கேற்புச் சொல்லின் காலத்தொடர்பை இயல்பான தமிழில் காட்டுகிறது: செய்தியைக் கேட்டபின் அவர் இயேசுவிடம் சென்றார்.'
- source_word: ἥκει
  choice: வந்திருக்கிறார்
  rationale: வந்து சேர்ந்ததன் விளைவாக இப்போது அங்கே இருப்பதை ἥκω உணர்த்துகிறது; ‘வந்திருக்கிறார்’ அந்த நிறைவுநிலையைத் தமிழில் தக்கவைக்கிறது.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: யூதேயாவிலிருந்து கலிலேயாவுக்கு
  rationale: புறப்பட்ட இடத்தையும் சென்ற இடத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: அவரிடம் சென்றார்
  rationale: இயேசு இருந்த இடத்தை நோக்கிச் சென்ற இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἠρώτα
  choice: கேட்டுக்கொண்டார்
  rationale: ἐρωτάω என்பதன் வேண்டுகோள் பொருளை மிகைப்படுத்தாமல் தருகிறது. இறந்தகால முற்றுப்பெறா வினையின் தொடர்ச்சி அல்லது மீளச்செயல் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἵνα καταβῇ
  choice: கீழே வந்து
  rationale: வேண்டுகோளுக்குப் பின்வரும் நோக்கத்தை இயல்பாகத் தருவதோடு, καταβαίνω என்பதிலுள்ள உயரத்திலிருந்து கீழ்நோக்கிய இயக்கத்தையும் பாதுகாக்கிறது.
- source_word: ἰάσηται
  choice: குணமாக்கும்படி
  rationale: மகனின் உடல்நோயைக் குணப்படுத்த வேண்டும் என்ற வேண்டுகோளைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐτοῦ τὸν υἱόν
  choice: தன் மகனை
  rationale: மகன் அந்த அலுவலருடையவன் என்பதைத் தமிழ் தற்சுட்டுப் பெயரால் குழப்பமின்றித் தெரிவிக்கிறது.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: ஏனெனில் அவன் இறக்கவிருந்தான்
  rationale: μέλλω + வினையெச்சம் காட்டும் நெருங்கிய நிகழ்வை ‘இறக்கவிருந்தான்’ சுருக்கமாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘இறக்கவிருந்தான்’ என்பதன் எழுவாய்
  choice: அந்த மகன்
  alternative: இயேசு அல்லது அரச அலுவலர்
  rationale: அருகிலுள்ள பெயர்ச்சொல்லும் சூழலும் இறக்கவிருந்தது மகனே என்பதைத் தெளிவுபடுத்துகின்றன.
- issue: ἠρώτα என்பதிலுள்ள முற்றுப்பெறா காலத்தின் நுணுக்கம்
  choice: முதன்மை உரையில் ‘கேட்டுக்கொண்டார்’; தொடர்ச்சி அல்லது மீளச்செயலை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘தொடர்ந்து கேட்டுக்கொண்டிருந்தார்’ என்று முதன்மை உரையிலேயே வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க முற்றுப்பெறா காலம் தொடர்ந்த அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட வேண்டுகோளைக் குறிக்கக்கூடும்; ஆனால் அவ்வுணர்வை கட்டாயமாக்காது. ஆகவே உண்மையான இலக்கணத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதையும் எளிமையும் கொண்ட தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்புகள் தமிழில் தெளிவாக இருக்கும்படி நிறுத்தக்குறிகள் அமைக்கப்பட்டுள்ளன; இடப்பெயர்கள் பொதுவாக அறியப்பட்ட வேதாகமத் தமிழ் வடிவங்களில் தரப்பட்டுள்ளன.
