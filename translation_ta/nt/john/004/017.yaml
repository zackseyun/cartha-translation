source:
  edition: SBLGNT
  text: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν ⸀αὐτῷ· Οὐκ ἔχω ἄνδρα. λέγει αὐτῇ ὁ Ἰησοῦς· Καλῶς εἶπας ὅτι Ἄνδρα οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: ta
  text: அந்தப் பெண் அவரிடம், “எனக்குக் கணவர் இல்லை” என்று பதிலளித்தாள். இயேசு அவளிடம், “ ‘எனக்குக் கணவர் இல்லை’ என்று நீ சொன்னது சரிதான்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν
  choice: அந்தப் பெண் … என்று பதிலளித்தாள்
  rationale: கிரேக்கத்தில் உள்ள ‘பதிலளித்து சொன்னாள்’ என்ற இரட்டைச் சொல்லாக்கத்தை, இயல்பான நவீனத் தமிழ் கதைநடையில் ‘பதிலளித்தாள்’ எனச் சுருக்குவது முழுப் பொருளையும் காக்கிறது.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: எனக்குக் கணவர் இல்லை
  rationale: ἄνδρα என்பது ‘ஆண்’ அல்லது ‘கணவர்’ எனப் பொருள்படலாம்; அடுத்த வசனத்தில் வரும் திருமண வரலாற்றுச் சூழல் இங்கு ‘கணவர்’ என்பதையே சுட்டுகிறது. தமிழ் இயல்புக்கு ‘எனக்குக் … இல்லை’ ஏற்றது.
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: இயேசு அவளிடம் … என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடைக்கேற்ப இறந்தகாலத்தில் மொழிபெயர்த்துள்ளது.
- source_word: Καλῶς εἶπας
  choice: நீ சொன்னது சரிதான்
  rationale: இங்கு καλῶς என்பது அவளுடைய கூற்று உண்மையானது அல்லது சரியானது என்பதை உறுதிப்படுத்துகிறது. ‘நன்றாகச் சொன்னாய்’ என்பதைவிட ‘சரிதான்’ இச்சூழலில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: “எனக்குக் கணவர் இல்லை” என்று
  rationale: ὅτι அவள் சொன்னதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; இயேசு அவளுடைய சொற்களை மீண்டும் மேற்கோள் காட்டுவதைத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀνήρ என்பதன் சூழல்சார் பொருள்
  choice: கணவர்
  alternative: ஆண்
  rationale: யோவான் 4:18-இல் திருமண உறவுகளே வெளிப்படையாகப் பேசப்படுவதால் ‘கணவர்’ என்பது சூழலால் உறுதிப்படுத்தப்படும் பொருள்; இதனால் கூடுதல் இறையியல் விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான கதைநடை. கிரேக்கத்தின் மீளுரையைப் பாதுகாத்து, தமிழில் செயற்கையாக ஒலிக்கும் இரட்டை பேச்சு வினை மட்டும் இயல்பாக்கப்பட்டுள்ளது.
