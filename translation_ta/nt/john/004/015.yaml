revisions:
- from: அந்தப் பெண் அவரிடம், “ஆண்டவரே[a], எனக்கு இந்தத் தண்ணீரைக் கொடுங்கள்; நான் தாகமடையாமலும் தண்ணீர் எடுக்க இங்கே வராமலும் இருக்கட்டும்” என்றாள்.
  to: அந்தப் பெண் அவரிடம், “ஆண்டவரே[a], நான் தாகமடையாமலும் தண்ணீர் எடுக்க இங்கே வராமலும் இருக்கும்படி, எனக்கு இந்தத் தண்ணீரைக் கொடுங்கள்” என்றாள்.
  rationale: The revision replaces the volitive ‘இருக்கட்டும்’ with the purpose-oriented ‘இருக்கும்படி,’ preserving the force of ἵνα while retaining all lexical choices and the footnote’s stated ambiguity.
