id: JHN.4.15
reference: John 4:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: ta
  text: அந்தப் பெண் அவரிடம், “ஆண்டவரே[a], நான் தாகமடையாமலும் தண்ணீர் எடுக்க இங்கே வராமலும் இருக்கும்படி, எனக்கு இந்தத் தண்ணீரைக் கொடுங்கள்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா, எனக்கு இந்தத் தண்ணீரைக் கொடுங்கள்…”
    reason: κύριε என்பது இங்கு மரியாதையான ‘ஐயா’ என்ற அழைப்பாகவும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: λέγει
  choice: என்றாள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றாள்’ இயல்பாக உரையாடலை அறிமுகப்படுத்துகிறது.
- source_word: ἡ γυνή
  choice: அந்தப் பெண்
  rationale: சூழலில் குறிப்பிடப்படுவது சமாரியப் பெண்; ‘அந்தப் பெண்’ என்பது தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் ‘ஆண்டவர்’ என்ற அடிப்படைப் பொருளையும் யோவான் நற்செய்தியில் இருக்கக்கூடிய ஆழமான ஒலிப்பையும் காக்கிறது; உடனடி உரையாடலில் மரியாதை அழைப்பாக இருக்கக்கூடிய ‘ஐயா’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δός μοι
  choice: எனக்குக் கொடுங்கள்
  rationale: கட்டளைப் பொருளை நேரடியாகவும், மரியாதை அழைப்புக்கு ஏற்ற நவீனத் தமிழ் வினை வடிவிலும் தருகிறது.
- source_word: τοῦτο τὸ ὕδωρ
  choice: இந்தத் தண்ணீரை
  rationale: கிரேக்கம் இவ்வசனத்தில் ‘இந்தத் தண்ணீர்’ என்று மட்டுமே கூறுகிறது; ‘ஜீவத்தண்ணீர்’ என்ற முந்தைய சூழல் இங்கே சேர்க்கப்படவில்லை.
- source_word: ἵνα μὴ διψῶ
  choice: நான் தாகமடையாமலும்
  rationale: எதிர்மறை நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை இயல்பான தமிழில் காக்கிறது; இதை உறுதியான எதிர்கால வாக்குறுதியாக மாற்றவில்லை.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: இங்கே வராமலும்
  rationale: μηδέ-யின் இணை எதிர்மறையையும், ἐνθάδε என்பதன் இடச்சுட்டான ‘இங்கே’ என்பதையும் காக்கிறது; நிகழ்வு மீண்டும் மீண்டும் நடப்பதற்கான சாத்தியத்தை சூழல் வெளிப்படுத்துகிறது.
- source_word: ἀντλεῖν
  choice: தண்ணீர் எடுக்க
  rationale: கிரேக்க வினையின் பொருள் சூழலில் தண்ணீர் இறைப்பது அல்லது எடுப்பது; தமிழில் ‘தண்ணீர் எடுக்க’ என்பதே இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: சமாரியப் பெண் இயேசுவை κύριε என்று அழைப்பது
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இந்தச் சொல் வெறும் மரியாதை அழைப்பாகவும் ‘ஆண்டவர்’ என்ற ஆழமான பொருளுடனும் ஒலிக்கலாம். முதன்மை உரை இரண்டாவது சாத்தியத்தையும் திறந்தவையாக வைத்திருக்கிறது; உடனடி உரையாடலுக்குரிய மரியாதை அழைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாகமடையாமலும் … வராமலும்’ என்ற இணை அமைப்பு கிரேக்கத்தின் இரட்டை எதிர்மறை நோக்கை காக்கிறது; ‘இருக்கட்டும்’ என்பது வேண்டுகோளின் எதிர்பார்க்கப்படும் விளைவை இயல்பாக இணைக்கிறது.
