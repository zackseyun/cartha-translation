id: JHN.4.44
reference: John 4:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: ta
  text: ஏனெனில், ஒரு தீர்க்கதரிசி தன் சொந்த நாட்டில்[a] மதிப்பைப் பெறுவதில்லை என்று இயேசுவே சாட்சியளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் சொந்த பகுதியில்” அல்லது “தன் பிறந்த இடத்தில்.” கிரேக்கச் சொல் πατρίς ஒருவருடைய தாய்நாடு, சொந்தப் பகுதி அல்லது பிறந்த இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள நிகழ்வோடு இந்தக் கூற்றை விளக்க முறையில் இணைக்கும் γάρ என்பதன் உரையாடல் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: இயேசுவே
  rationale: αὐτός தரும் வலியுறுத்தலை இயல்பான தமிழில் ஏகாரத்தால் வெளிப்படுத்துகிறது.
- source_word: ἐμαρτύρησεν
  choice: சாட்சியளித்திருந்தார்
  rationale: யோவான் நூலில் முக்கியமான சாட்சி சார்ந்த சொல்லாட்சியைப் பாதுகாக்கிறது; இறந்தகால முன்னிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: προφήτης
  choice: ஒரு தீர்க்கதரிசி
  rationale: கட்டுரைச்சொல் இல்லாத ஒருமையைப் பொதுமொழிக் கூற்றாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: தனது சொந்த ஊரில்
  rationale: ἰδίᾳ என்பதன் ‘சொந்த’ என்ற வலியுறுத்தலையும், πατρίς என்பதன் பிறந்த இடம் அல்லது சொந்தப் பகுதி என்ற நெகிழ்வான பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: τιμὴν οὐκ ἔχει
  choice: மதிப்பு கிடைப்பதில்லை
  rationale: τιμή என்பதன் பெயர்ச்சொல் கருத்தைத் தக்கவைத்து, ஒருவர் தம் சொந்த இடத்தில் பிறரிடமிருந்து மதிப்பைப் பெறுவதில்லை என்ற பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘தனது சொந்த ஊர்’ என்பதன் புவியியல் குறிப்பு
  choice: யூதேயா, கலிலேயா அல்லது நாசரேத் என்று முதன்மை உரையில் குறிப்பாகத் தீர்மானிக்காமல் பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதனை யூதேயா, கலிலேயா அல்லது குறிப்பாக நாசரேத் என்று அடையாளப்படுத்துதல்.
  rationale: வசனம் புவியியல் இடத்தை வெளிப்படையாக அடையாளப்படுத்தாமல் ஒரு பொதுமொழிக் கூற்றைக் கூறுகிறது. எனவே உரையிலுள்ள விளக்கத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, தரமான, மரியாதைமிக்க தமிழ். ‘இயேசுவே’ என்பது மூலத்தின் வலியுறுத்தலை இயல்பாகத் தருகிறது; ‘சாட்சியளித்திருந்தார்’ யோவானின் சாட்சி சொல்லாட்சியைப் பேணுகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
