    reason: lexical_alternative
  revision_rationale: The revision avoids restricting πατρίς to a particular hometown while preserving the source’s unresolved geographical scope. It also uses a straightforward Tamil past tense for the Greek aorist. The emphatic “இயேசுவே,” the Johannine witness vocabulary, and the proverbial present statement are retained.
