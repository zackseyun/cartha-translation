id: JHN.4.54
reference: John 4:54
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: ta
  text: இது, இயேசு யூதேயாவிலிருந்து கலிலேயாவுக்கு வந்தபின் செய்த இரண்டாவது அடையாளமாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அற்புதம்.” யோவான் பொதுவாக “அடையாளம்” என்ற சொல்லைப் பயன்படுத்தி, அந்தச் செயலின் வல்லமையோடு அதன் பொருளையும் வலியுறுத்துகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: இதுவே
  rationale: சற்றுமுன் விவரிக்கப்பட்ட குணமாக்குதலைச் சுட்டுகிறது; ‘இதுவே’ என்பது அடையாளப்படுத்தும் நிறைவுணர்வை இயல்பாகத் தருகிறது.
- source_word: δὲ πάλιν δεύτερον
  choice: இரண்டாவது
  rationale: πάλιν மற்றும் δεύτερον சேர்ந்து முன்பு நிகழ்ந்த அடையாளத்துக்குப் பின் இதன் வரிசையை வலியுறுத்துகின்றன. தமிழில் ‘மீண்டும் இரண்டாவது’ என்பது இயல்பற்றதால், ‘இரண்டாவது’ என்பதே மீள்நிகழ்வையும் வரிசையையும் தெளிவாகக் காட்டுகிறது.
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: யோவான் நூலில் இச்சொல் வல்லமையான செயலை மட்டுமல்லாமல், அது சுட்டிக்காட்டும் வெளிப்பாட்டு அர்த்தத்தையும் கொண்டுள்ளது; ‘அற்புதம்’ என்பதைவிட ‘அடையாளம்’ அந்த இலக்கிய-இறையியல் செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: ἐποίησεν
  choice: செய்த
  rationale: σημεῖον என்பதுடன் வரும் ποιέω-வின் பொதுவான செயற்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐλθὼν
  choice: வந்தபின்
  rationale: இறந்தகால வினையெச்சத்தின் சூழல்சார் காலத் தொடர்பைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: யூதேயாவிலிருந்து கலிலேயாவுக்கு
  rationale: புறப்படும் இடத்தையும் சென்றடையும் திசையையும் நவீனத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: யோவான் நூலுக்குரிய σημεῖον சொற்பயன்பாடு
  choice: அடையாளம்
  alternative: அற்புதம்
  rationale: இயேசுவின் செயல் வெறும் வியத்தகு நிகழ்வு அல்லாமல் அவரைப் பற்றிய உண்மையைச் சுட்டுவதாக யோவான் அமைக்கிறார். ‘அடையாளம்’ அந்தத் திறந்த இலக்கிய-இறையியல் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. கிரேக்கச் சொல்வரிசையை அப்படியே பின்பற்றாமல், தமிழில் இயல்பாக ‘இதுவே’ என்பதை இறுதியில் வைத்து அடையாளப்படுத்தும் வலியுறுத்தல் காக்கப்பட்டுள்ளது.
