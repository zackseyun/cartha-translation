source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: ta
  text: ஆனால் ஒரு நேரம் வருகிறது; அது இப்போதே வந்திருக்கிறது. அப்போது உண்மையான வழிபாட்டாளர்கள் தந்தையை ஆவியிலும் உண்மையிலும்[a] வழிபடுவார்கள். ஏனெனில் தம்மை இவ்வாறு வழிபடுகிறவர்களையே தந்தை தேடுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசுத்த ஆவியிலும் உண்மையிலும்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கம், பரிசுத்த ஆவியால் ஆற்றலளிக்கப்படும் வழிபாட்டையோ, மனிதனின் ஆவியில் நிகழும் வழிபாட்டையோ, ஆவிக்குரிய நிஜத்தன்மை கொண்ட வழிபாட்டையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் இடத்தை மையப்படுத்திய வழிபாட்டைப் பற்றிய உரையாடலுடன் தெளிவான மாறுபாட்டைக் குறிக்கிறது.
- source_word: ἔρχεται ὥρα καὶ νῦν ἐστιν
  choice: ஒரு நேரம் வருகிறது; அது இப்போதே வந்துவிட்டது
  rationale: ὥρα என்பதன் காலக் கருத்தையும், எதிர்பார்க்கப்பட்ட அந்த நேரம் ஏற்கெனவே நிகழத் தொடங்கியுள்ளதைக் கூறும் νῦν ἐστιν என்பதன் நிகழ்கால நிறைவேற்றத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: உண்மையான வழிபாட்டாளர்கள்
  rationale: யோவானின் பயன்பாட்டில் உள்ள மெய்யான அல்லது நிஜமான என்ற தரப் பொருளைப் பாதுகாக்கிறது; பிரிவினை சார்ந்த பொருளைச் சேர்க்கவில்லை.
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: தந்தையை ... வழிபடுவார்கள்
  rationale: எதிர்கால வினையின் பொருளை நேரடியாகவும், τῷ πατρὶ என்ற கிரேக்க வேற்றுமையை இயல்பான தமிழ் செயப்படுபொருள் அமைப்பிலும் தருகிறது.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: ஆவியிலும் உண்மையிலும்
  rationale: இரு பெயர்ச்சொற்களையும் இணையாக வைத்துப் யோவானிய கருத்துச் செறிவைப் பாதுகாக்கிறது. πνεῦμα மனித ஆவியையா, தூய ஆவியையா, அல்லது ஆவிக்குரிய தன்மையையா குறிக்கிறது என்பதை முதன்மை உரை முடிவுசெய்யவில்லை.
- source_word: καὶ γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; கிரேக்க καί தரும் வலியுறுத்தல் வாக்கியத்தின் ‘இவ்வாறு ... அவர்களையே’ அமைப்பில் வெளிப்படுகிறது.
- source_word: ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν
  choice: தம்மை இவ்வாறு வழிபடுகிறவர்களையே தந்தை தேடுகிறார்
  rationale: τοιούτους என்பதன் ‘இத்தகையவர்’ என்ற பொருளையும், அத்தகையவர்கள் அவரை வழிபடுகிறவர்கள் என்பதையும் இயல்பான ஒரே தமிழ் தொடரில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐν πνεύματι என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘ஆவியில்’ என்று குறிப்பிட்டு, அது தூய ஆவியை மட்டுமே குறிக்கிறது எனத் தீர்மானிக்கவில்லை.
  alternative: ‘தூய ஆவியினால்’ அல்லது ‘உள்ளார்ந்த ஆவியோடு’
  rationale: கிரேக்கத்தில் πνεύματι என்பதற்கு முன் குறிப்புச் சுட்டு இல்லை; சூழலில் தூய ஆவியின் வல்லமை, மனித ஆவியின் உள்ளார்ந்த வழிபாடு, அல்லது ஆவிக்குரிய நிஜத்தன்மை ஆகியவை ஒன்றுக்கொன்று முற்றிலும் விலக்கப்படாமல் இருக்கலாம்.
- issue: ἀληθινοὶ προσκυνηταὶ என்பதன் வரம்பு
  choice: ‘உண்மையான வழிபாட்டாளர்கள்’ என்ற தரப்பொருள்
  alternative: ‘மெய்யான வழிபாட்டாளர்கள்’ அல்லது ‘நிஜமான வழிபாட்டாளர்கள்’
  rationale: குறிப்பிட்ட ஒரு சமயப் பிரிவை மட்டும் உண்மையானதாக அறிவிக்காமல், கடவுளின் வெளிப்பாட்டுக்கும் உண்மைக்கும் ஏற்ப வழிபடுகிறவர்களைக் குறிக்கும் யோவானிய மாறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘ஒரு நேரம்’ என்பது ὥρα-வின் காலப்பொருளை இயல்பாகத் தருகிறது; ‘இப்போதே வந்துவிட்டது’ என்பது எதிர்பார்க்கப்பட்ட நேரம் ஏற்கெனவே தொடங்கியிருப்பதைத் தெளிவாக்குகிறது. மரியாதைப் பிரதிப்பெயரான ‘தம்மை’ தந்தையைக் குறிக்கிறது.
