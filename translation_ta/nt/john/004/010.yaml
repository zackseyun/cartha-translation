  source_fidelity: 'கருத்தும் வினைநிலையும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன: நிபந்தனைக்கு மாறான விளைவு (‘கேட்டிருப்பாய்; கொடுத்திருப்பார்’) மற்றும் ὕδωρ ζῶν என்பதன் இரட்டைப் பொருள் இரண்டுமே தெளிவாக உள்ளன. ஆனால் தொடக்கத்தில் உள்ள ἀπεκρίθη … καὶ εἶπεν என்பதற்கு ‘அவளுக்குப் பதிலளித்து ... என்றார்’ என்பது தற்போதைய ‘அவளுக்கு மறுமொழியாக’ என்பதைவிட இயல்பாகவும் வெளிப்படையாகவும் அமையும்.'
  naturalness: ‘இயேசு அவளுக்கு மறுமொழியாக’ என்ற தொடர் இலக்கணத்துக்கு ஏற்றதாக இருந்தாலும் சற்றே செயற்கையாக ஒலிக்கிறது. ‘இயேசு அவளுக்குப் பதிலளித்து ... என்றார்’ என்பது நவீனத் தரத் தமிழில் இயல்பான கண்ணியமான நடை. அடிக்குறிப்பில் ‘ஓடிக்கொண்டிருக்கும் புதிய தண்ணீர்’ என்ற இணைவு இயல்பற்றது; மாற்றுகள் தனித்தனியாகத் தரப்பட வேண்டும்.
