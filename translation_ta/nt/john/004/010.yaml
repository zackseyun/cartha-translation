id: JHN.4.10
reference: John 4:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: ta
  text: இயேசு அவளுக்குப் பதிலளித்து, “கடவுளின் கொடையையும், ‘எனக்குக் குடிக்கக் கொடு’ என்று உன்னிடம் சொல்கிறவர் யார் என்பதையும் நீ அறிந்திருந்தால், நீ அவரிடம் கேட்டிருப்பாய்; அவர் உனக்கு ஜீவத்தண்ணீரைக்[a] கொடுத்திருப்பார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓடும் தண்ணீர்” அல்லது “நன்னீர்.” கிரேக்கச் சொற்றொடர் ஓடும் அல்லது சுத்தமான இயற்கைத் தண்ணீரைக் குறிக்கலாம்; “ஜீவத்தண்ணீர்” என்பது இங்கு உள்ள இரட்டைப் பொருளைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: மறுமொழியாக … என்றார்
  rationale: கிரேக்க மொழியின் இரட்டைச் சொற்கூற்றை இயல்பான நவீனத் தமிழில் ஒருங்கிணைத்து, இயேசு பதிலளித்தார் என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: கடவுளின் கொடை
  rationale: δωρεά என்பது இலவசமாக வழங்கப்படும் கொடையைக் குறிக்கிறது; தமிழில் ‘கொடை’ இயல்பாகவே அந்தக் கருத்தைத் தருவதால் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை. Genitive அமைப்பும் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: உன்னிடம் சொல்கிறவர் யார்
  rationale: பேசுகிறவரின் அடையாளத்துக்கு கிரேக்கம் தரும் அழுத்தத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான உணர்வும் ‘சொல்கிறவர்’ என்பதில் நிலைக்கிறது.
- source_word: Δός μοι πεῖν
  choice: எனக்குக் குடிக்கக் கொடு
  rationale: கட்டளை வினையும் குடித்தலைக் குறிக்கும் வினையெச்சமும் தமிழில் இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் தரப்படுகின்றன.
- source_word: ᾔτησας … ἔδωκεν ἄν
  choice: நீ … கேட்டிருப்பாய்; அவர் … கொடுத்திருப்பார்
  rationale: நிறைவேறாத நிபந்தனை மற்றும் அதன் விளைவைத் தமிழின் எதிர்நிலை இறந்தகால அமைப்பு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὕδωρ ζῶν
  choice: ஜீவத்தண்ணீர்
  rationale: இது தமிழில் அறியப்பட்ட பொருத்தமான சொற்றொடர்; உயிரளிக்கும் தண்ணீர் என்ற ஆழமான பொருளையும், ஓடும் அல்லது புதிய தண்ணீர் என்ற நேரடிப் பொருளையும் முற்றிலும் ஒன்றாகச் சுருக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ὕδωρ ζῶν என்பதன் நேரடிப் பொருளையும் ஆவிக்குரிய பொருளையும் காத்தல்
  choice: ஜீவத்தண்ணீர்
  alternative: ஓடும் தண்ணீர் / ஊற்றுத் தண்ணீர்
  rationale: சூழலில் இயேசுவின் சொல் இயற்கையான தண்ணீரைப் பற்றிய புரிதலுக்கும் ஆழமான இறையியல் பொருளுக்கும் இடமளிக்கிறது. ‘ஜீவத்தண்ணீர்’ அந்த இரட்டைப் பொருளை முன்கூட்டியே தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை; நிபந்தனை வாக்கியமும் இரட்டைப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
