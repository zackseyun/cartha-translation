source:
  edition: SBLGNT
  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: ta
  text: எனவே, அவன் எந்த நேரத்தில் உடல்நலம் தேறத் தொடங்கினான் என்று அவர்களிடம் கேட்டான். அதற்கு அவர்கள் அவனிடம், “நேற்று ஏழாம் மணி நேரத்தில்[a] காய்ச்சல் அவனைவிட்டு நீங்கியது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூரிய உதயத்திலிருந்து மணிநேரங்களைக் கணக்கிட்டால், ‘பிற்பகல் சுமார் ஒரு மணிக்கு’ என்றும் பொருள் கொள்ளலாம்; யோவான் இங்கு வேறுபட்ட நேரக் கணக்குமுறையைப் பயன்படுத்துகிறார் என்று சிலர் கருதுகின்றனர்.
    reason: நேரக் கணக்குமுறை குறித்த மாற்றுப் புரிதலைக் குறிப்பிடுகிறது; மூல உரை எந்த முறையை நோக்குகிறது என்பதைத் தெளிவுபடுத்தவில்லை.
lexical_decisions:
- source_word: ἐπύθετο
  choice: கேட்டான்
  rationale: தந்தை பணியாளர்களிடம் நேரத்தை விசாரிப்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய வசனத்தில் மகன் உயிருடன் இருப்பதாகக் கேட்டதன் தொடர்ச்சியாக எழும் விசாரணையைச் சுட்டுகிறது.
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: எந்த நேரத்தில் ... என்று அவர்களிடம்
  rationale: கிரேக்கத்தின் ‘அவர்களிடமிருந்து நேரத்தை விசாரித்தான்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: κομψότερον ἔσχεν
  choice: உடல்நலம் தேறினான்
  rationale: நோய்நிலையில் ஏற்பட்ட முன்னேற்றத்தை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது; முழுமையாகக் குணமானான் என்று மிகைப்படுத்தவில்லை.
- source_word: εἶπαν οὖν αὐτῷ
  choice: அதற்கு அவர்கள் அவனிடம் ... என்றார்கள்
  rationale: கேள்விக்கான பதிலாக வரும் கதைத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: நேற்று ஏழாம் மணி நேரத்தில்
  rationale: எந்த நேரக் கணக்குமுறை என்பதைக் கிரேக்கம் குறிப்பிடாததால், நவீன மணிநேரமாக மாற்றாமல் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: காய்ச்சல் அவனைவிட்டு நீங்கியது
  rationale: காய்ச்சலே இலக்கண எழுவாயாக உள்ள கிரேக்க அமைப்பையும் ‘விட்டுச் சென்றது’ என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘ஏழாம் மணி நேரம்’ என்பதன் நேரக் கணக்கீடு
  choice: முதன்மை உரையில் ‘ஏழாம் மணி நேரத்தில்’ என்று அப்படியே வைத்தல்
  alternative: சூரிய உதயத்திலிருந்து கணக்கிட்டால் சுமார் பிற்பகல் ஒரு மணி; யோவான் வேறு நேரக் கணக்கைப் பயன்படுத்தியதாகவும் சிலர் கருதுகின்றனர்
  rationale: வசனமே நேரக் கணக்குமுறையைத் தீர்மானிக்காததால், ஒரு நவீன நேரத்தைத் தேர்ந்தெடுத்து மூலத்தின் உண்மையான தெளிவின்மையை நீக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘உடல்நலம் தேறினான்’ என்பது பேச்சுவழக்குத் தன்மையையும் மருத்துவத் தொழில்நுட்பச் சொல்லாட்சியையும் தவிர்த்து நோய் குறைந்ததை இயல்பாகத் தெரிவிக்கிறது. ‘ஏழாம் மணி நேரம்’ என்ற வரலாற்றுச் சொல்லாட்சி அடிக்குறிப்புடன் பாதுகாக்கப்பட்டது.
