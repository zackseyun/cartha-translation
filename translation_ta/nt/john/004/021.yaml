revisions:
- from: இயேசு அவளிடம், “பெண்ணே[b], என்னை நம்பு[a]. ஒரு வேளை[c] வருகிறது; அப்போது இந்த மலையிலுமல்ல, எருசலேமிலுமல்ல, நீங்கள் தந்தையை வழிபடுவீர்கள்” என்றார்.
  to: இயேசு அவளிடம், “பெண்ணே[b], என்னை நம்பு[a]. ஒரு நேரம் வருகிறது; அப்போது இந்த மலையிலோ எருசலேமிலோ நீங்கள் தந்தையை வழிபடமாட்டீர்கள்” என்றார்.
