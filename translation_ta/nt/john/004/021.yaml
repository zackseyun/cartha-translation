review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Jesus' address, the plural future verb, the two locations, and worship of the Father. However, ‘ஒரு வேளை’ ordinarily means ‘perhaps/on one occasion’ in modern Tamil and therefore does not safely convey ἔρχεται ὥρα (‘an hour/a decisive time is coming’). The negative-location construction also needs recasting so that it unambiguously means that worship will occur in neither place.
  naturalness: Most of the Tamil is clear and modern. Replacing ‘ஒரு வேளை வருகிறது’ with ‘ஒரு நேரம் வருகிறது’ removes a serious idiomatic ambiguity. ‘இந்த மலையிலோ எருசலேமிலோ ... வழிபடாத’ is a natural Tamil way to express the Greek neither/nor scope.
  terminology: ‘பெண்ணே,’ ‘வழிபட,’ ‘தந்தையை,’ and ‘எருசலேம்’ are appropriate. ‘நேரம்’ is more natural than ‘வேளை’ in the main text here, while the footnote may note the Johannine thematic use of the Greek word without claiming an unnatural Tamil equivalent.
  issues:
  - severity: medium
    issue: ‘ஒரு வேளை’ is ambiguous in modern Tamil.
    rationale: In ordinary usage it commonly means ‘perhaps’ or ‘on one occasion,’ rather than a coming time. This can obscure the assertion that a decisive time is approaching.
  - severity: medium
    issue: The present negative construction can be read awkwardly as affirming worship after two detached negatives.
    rationale: Recasting it with ‘இந்த மலையிலோ எருசலேமிலோ ... வழிபடாத’ makes the scope of οὔτε ... οὔτε explicit and idiomatic.
  - severity: low
    issue: Footnote c uses ‘குறிப்புச் சுட்டு’ for the Greek article.
    rationale: ‘குறிப்பிடும் உருபு’ is clearer Tamil grammatical terminology and accurately explains that ὥρα lacks the definite article.
  revised_text: இயேசு அவளிடம், “பெண்ணே[b], என்னை நம்பு[a]. ஒரு நேரம் வருகிறது; அப்போது இந்த மலையிலோ எருசலேமிலோ நீங்கள் தந்தையை வழிபடமாட்டீர்கள்” என்றார்.
