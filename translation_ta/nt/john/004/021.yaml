source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: ta
  text: இயேசு அவளிடம், “பெண்ணே[b], என்னை நம்பு[a]. ஒரு நேரம் வருகிறது; அப்போது இந்த மலையிலோ எருசலேமிலோ நீங்கள் தந்தையை வழிபடமாட்டீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் சொல்வதை நம்பு.’ கிரேக்க வினைச்சொல் ஒருவருடைய கூற்றை நம்புவதையோ அந்த நபரையே நம்புவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இச்சூழலில் ‘பெண்ணே’ என்பது மரியாதையான அழைப்புமுறை; அவமதிப்பானது அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: என்னை நம்பு
  rationale: இது இயேசு சொல்வதை உண்மையென ஏற்றுக்கொள்வதையும் அவர்மீது நம்பிக்கை வைப்பதையும் குறிக்கக்கூடும். ‘என்னை நம்பு’ என்பதில் இந்த இரு சாத்தியங்களும் இயல்பாக நிலைக்கின்றன.
- source_word: γύναι
  choice: பெண்ணே
  rationale: மூலத்தின் நேரடி அழைப்புமுறையைப் பாதுகாக்கிறது. இச்சூழலில் இது மரியாதையற்ற சொல் அல்ல; அந்நிய நுணுக்கத்தை மொழிபெயர்ப்பில் சேர்க்காமல் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἔρχεται ὥρα
  choice: ஒரு வேளை வருகிறது
  rationale: ὥρα என்பதன் ‘வேளை’ என்ற உருவகத்தையும் யோவானில் மீண்டும் வரும் தீர்மானகரமான நேரம் என்ற கருப்பொருளையும் பாதுகாக்கிறது. பெயர்ச்சொல்லுக்கு இங்கு குறிப்புச் சுட்டு இல்லாததால் ‘ஒரு வேளை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: இந்த மலையில்
  rationale: பேச்சில் ஏற்கெனவே குறிப்பிடப்பட்ட சமாரியர்களின் புனித மலையைக் குறிக்கும் இடவியல் சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: ἐν Ἱεροσολύμοις
  choice: எருசலேமில்
  rationale: நகரைக் குறிக்கும் கிரேக்க இடவியல் சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: προσκυνήσετε
  choice: நீங்கள் வழிபடுவீர்கள்
  rationale: இரண்டாம் நபர் பன்மை எதிர்கால வடிவத்தைப் பாதுகாக்கிறது; இச்சூழலில் προσκυνέω குறிக்கும் சமயச் செயலை ‘வழிபடு’ இயல்பாகவும் முழுமையாகவும் தெரிவிக்கிறது.
- source_word: τῷ πατρί
  choice: தந்தையை
  rationale: யோவான் நற்செய்தியின் சூழலில் கடவுளைத் தந்தையாகக் குறிப்பிடுகிறது. நவீனத் தமிழில் இயல்பான உறவுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: οὔτε ... οὔτε
  choice: இந்த மலையிலுமல்ல, எருசலேமிலுமல்ல
  rationale: இரு வழிபாட்டு மையங்களையும் மறுக்கும் இணை அமைப்பைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: γύναι என்ற அழைப்பின் தொனி
  choice: ‘பெண்ணே’ என்று நேரடியாக மொழிபெயர்த்து, அதன் மரியாதையான தொனியை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘அம்மா’ அல்லது ‘மதிப்பிற்குரிய பெண்ணே’ என்று மென்மைப்படுத்துதல்
  rationale: மூலத்தில் இல்லாத பாசத்தையோ மரியாதைச் சிறப்பையோ சேர்க்காமல் சொல்வடிவத்தைப் பாதுகாக்கிறது; அதேவேளை தவறான கடுமையான வாசிப்பை அடிக்குறிப்பு தடுக்கிறது.
- issue: யோவானின் ὥρα கருப்பொருள்
  choice: பொதுவான ‘காலம்’ என்பதற்குப் பதிலாக ‘வேளை’ என்பதை வைத்திருத்தல்
  alternative: ‘ஒரு காலம் வருகிறது’
  rationale: கடவுளுடைய திட்டத்தில் வரவிருக்கும் தீர்மானகரமான நேரத்தைச் சுட்டும் யோவானின் மீளும் சொல்லாட்சியைப் பாதுகாத்து, அந்த வேளை எதைத் துல்லியமாகக் குறிக்கிறது என்பதை மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்காமல் விடுகிறது.
- issue: προσκυνήσετε என்ற பன்மை
  choice: ஒரு பெண்ணிடம் பேசினாலும் ‘நீங்கள்’ என்ற பன்மையைப் பாதுகாத்தல்
  alternative: ‘நீ’ என்ற ஒருமையாக மாற்றுதல்
  rationale: கிரேக்க வினைச்சொல் இரண்டாம் நபர் பன்மை; அது அந்தப் பெண்ணைத் தாண்டி அவளுடைய மக்களையும் உள்ளடக்கக்கூடும். இதை ஒருமையாக்குவது மூலத்தின் பரப்பைக் குறைக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பிதா’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘தந்தை’ தேர்ந்தெடுக்கப்பட்டது. இடங்களை மறுக்கும் ‘...லுமல்ல, ...லுமல்ல’ அமைப்பு கிரேக்கத்தின் οὔτε ... οὔτε எதிரிணையைத் தெளிவாகக் காட்டுகிறது; ‘நீங்கள்’ என்பது மூலத்தின் பன்மையைப் பாதுகாக்கிறது.
