  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: ta
  text: அந்தப் பெண் அவரிடம், “ஆண்டவரே[a], நீர் ஒரு தீர்க்கதரிசி என்பதை நான் உணர்கிறேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்கச் சொல்லான κύριε, “ஆண்டவரே” என்பதோடு மரியாதையான அழைப்பாகவும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: என்றாள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றாள்’ இயல்பாக உள்ளது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: பேச்சின் மறைமுகச் செயப்படுபொருளைக் குறிக்கும் தத்துவேற்றுமை; தமிழில் ‘அவரிடம்’ இயல்பான இணை.
- source_word: ἡ γυνή
  choice: அந்தப் பெண்
  rationale: சூழலில் சமாரியப் பெண்ணைக் குறிக்கிறது; ‘மனைவி’ அல்ல. முன்பே அறிமுகமான நபர் என்பதால் ‘அந்தப் பெண்’ பொருத்தமானது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதற்கான வழக்கமான வேதாகமத் தமிழ் இணை. இச்சூழலில் மரியாதை அழைப்பாகவும் இருக்கக்கூடிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: θεωρῶ
  choice: அறிகிறேன்
  rationale: இயேசு வெளிப்படுத்திய அறிவின் அடிப்படையில் ஏற்பட்ட உணர்தலையும் கண்டறிதலையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: அவள் அறிந்துகொண்டதன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: προφήτης
  choice: ஒரு தீர்க்கதரிசி
  rationale: உருபில்லாத பயனிலைப் பெயர்ச்சொல்; ‘அந்தத் தீர்க்கதரிசி’ என்று குறிப்பிட்ட அடையாளத்தைச் சேர்க்காமல், இயேசுவை ஒரு தீர்க்கதரிசியாக அவள் உணர்வதைத் தெரிவிக்கிறது.
- source_word: σύ
  choice: நீர்
  rationale: வலியுறுத்தப்பட்ட இரண்டாம் நபர் ஒருமைப் பெயர்ச்சொல். மரியாதை அழைப்புக்கு ஏற்ற தமிழ்ச் சுட்டுப்பெயர்.
theological_decisions:
- issue: இயேசுவை அழைக்கும் κύριε என்பதன் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இச்சூழலில் இது முழுமையான கிறிஸ்தவ அறிக்கையாக இல்லாமல் மரியாதை அழைப்பாக இருக்கலாம். முதன்மை உரையில் வழக்கமான ‘ஆண்டவரே’ வைக்கப்பட்டு, உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமக் கண்ணியமும் பேணப்பட்டுள்ளன. ‘நீர்’ என்பது இங்கு இயல்பான மரியாதை ஒருமை. மூலத்தின் சுருக்கமான உரையாடல் நடை காக்கப்பட்டுள்ளது.
