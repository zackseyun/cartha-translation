revisions:
- from: சமாரியாவிலிருந்து ஒரு பெண் தண்ணீர் மொள்ள வந்தாள். இயேசு அவளிடம்[a], “எனக்குக் குடிக்கத் தா” என்றார்.
  to: சமாரியாவிலிருந்து ஒரு பெண் தண்ணீர் மொள்ள வந்தாள். இயேசு அவளிடம்[a], “எனக்குக் குடிக்கத் தண்ணீர் கொடு” என்றார்.
  rationale: The revision retains the source’s sequence, indefinite reference, place expression, and historical-present narrative sense. It makes Jesus’ request idiomatic and suitably direct in modern standard Tamil, with ‘தண்ணீர்’ supplied only as the immediately implied object of ‘give me to drink.’
