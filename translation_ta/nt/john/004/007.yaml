review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the woman as coming from Samaria, her purpose of drawing water, and the two Greek historical presents with natural Tamil past-tense narration. The request, however, is too elliptical and uses an overly familiar imperative in Tamil.
  naturalness: ‘தண்ணீர் மொள்ள’ is accurate for drawing water from a well and is acceptable in modern standard narrative Tamil. ‘எனக்குக் குடிக்கத் தா’ is abrupt, colloquial, and pragmatically incomplete; supplying the contextually implicit ‘தண்ணீர்’ and using ‘கொடு’ gives a natural, direct request without changing its force.
  terminology: ‘சமாரியாவிலிருந்து ஒரு பெண்’ properly avoids adding an ethnic designation not explicitly stated in this verse. ‘இயேசு’ and ‘தண்ணீர் மொள்ள’ are appropriate. The historical-present footnote should use smoother Tamil.
  issues:
  - severity: medium
    issue: The expression ‘எனக்குக் குடிக்கத் தா’ is overly familiar and incomplete in modern standard Tamil.
    rationale: Greek Δός μοι πεῖν is a concise request, but Tamil normally requires a more idiomatic construction. ‘எனக்குக் குடிக்கத் தண்ணீர் கொடு’ makes the implied object explicit from the immediate context and preserves the direct request without importing theological or narrative content.
  - severity: low
    issue: The footnote wording ‘இன்னும் சொல்லுக்குச் சொல் முறையில்’ is unnatural.
    rationale: A clearer formulation should identify the literal present-tense forms while retaining the explanation of the Greek historical present.
  revised_text: சமாரியாவிலிருந்து ஒரு பெண் தண்ணீர் மொள்ள வந்தாள். இயேசு அவளிடம்[a], “எனக்குக் குடிக்கத் தண்ணீர் கொடு” என்றார்.
  revised_footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “வருகிறாள் … கூறுகிறார்”; கிரேக்கக் கதைநடையில் வரலாற்று நிகழ்கால வினைகள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s sequence, indefinite reference, place expression, and historical-present narrative sense. It makes Jesus’ request idiomatic and suitably direct in modern standard Tamil, with ‘தண்ணீர்’ supplied only as the immediately implied object of ‘give me to drink.’
