base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: ta
  text: சமாரியாவிலிருந்து ஒரு பெண் தண்ணீர் மொள்ள வந்தாள். இயேசு அவளிடம்[a], “எனக்குக் குடிக்கத் தண்ணீர் கொடு” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “வருகிறாள் … கூறுகிறார்”; கிரேக்கக் கதைநடையில் வரலாற்று நிகழ்கால வினைகள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: வந்தாள்
  rationale: கிரேக்கக் கதைநடையில் இது வரலாற்று நிகழ்காலமாக உள்ளது; இயல்பான நவீனத் தமிழில் இறந்தகால வினை கதையின் காலநிலையைத் தெளிவாக வழங்குகிறது.
- source_word: γυνὴ
  choice: ஒரு பெண்
  rationale: இச்சூழலில் அடையாளம் குறிப்பிடப்படாத பெண்ணைக் குறிக்கிறது; ‘மனைவி’ என்ற பொருள் இங்கு பொருந்தாது.
- source_word: ἐκ τῆς Σαμαρείας
  choice: சமாரியாவிலிருந்து
  rationale: ἐκ இடம் அல்லது மூலத்தைக் குறிக்கிறது. மூலத்தில் உள்ள ‘சமாரியாவிலிருந்து’ என்ற வடிவத்தைப் பேணி, இவ்வசனத்திலேயே ‘சமாரியப் பெண்’ என இன-சமய அடையாளத்தை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἀντλῆσαι ὕδωρ
  choice: தண்ணீர் மொள்ள
  rationale: கிணறு போன்ற நீர்நிலையிலிருந்து தண்ணீர் எடுப்பதை ‘மொள்ள’ என்பது இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது; இறுதிவினை நோக்கத்தைக் காட்டுகிறது.
- source_word: λέγει αὐτῇ
  choice: அவளிடம் … என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது; தமிழ்க் கதைநடைக்கு இயல்பாக இறந்தகாலத்தில் வழங்கப்பட்டுள்ளது.
- source_word: Δός μοι πεῖν
  choice: எனக்குக் குடிக்கத் தா
  rationale: கட்டளை வடிவிலுள்ள சுருக்கமான வேண்டுகோளை நேரடியாகப் பேணுகிறது. தமிழில் இயல்பாகவும், ‘நான் குடிக்கும்படி எனக்குக் கொடு’ என்ற மூல அமைப்பின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
theological_decisions:
- issue: ‘சமாரியா’ என்பதன் குறிப்பு
  choice: சமாரியாவிலிருந்து ஒரு பெண்
  alternative: சமாரியப் பெண்; சமாரியா நகரத்திலிருந்து ஒரு பெண்
  rationale: கிரேக்க உரை இவ்வசனத்தில் அவளை நேரடியாக ‘சமாரியப் பெண்’ என்று அழைக்காமல், ‘சமாரியாவிலிருந்து ஒரு பெண்’ என்கிறது. ஆகவே பரந்த சூழலிலுள்ள இன, சமய உட்பொருளை மொழிபெயர்ப்பு வரியிலேயே கூடுதலாகச் சேர்க்கவில்லை.
- issue: கிரேக்க வரலாற்று நிகழ்காலம்
  choice: தமிழில் இறந்தகாலக் கதைநடை
  alternative: ‘வருகிறாள் … கூறுகிறார்’ என்ற நிகழ்காலக் கதைநடை
  rationale: ἔρχεται, λέγει ஆகியவை வடிவில் நிகழ்காலமாக இருந்தாலும், கடந்த நிகழ்வை உயிரோட்டமாக விவரிக்கும் வரலாற்று நிகழ்காலங்கள். நவீனத் தமிழில் இறந்தகாலம் இயல்பானது; மூல வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தண்ணீர் மொள்ள’ என்பது கிணற்றிலிருந்து நீர் எடுப்பதற்கான பொதுவான, துல்லியமான சொற்றொடர். இயேசுவின் வேண்டுகோள் மூலத்தின் நேரடித் தன்மையைப் பேணும் வகையில் எளிமையாக அமைக்கப்பட்டுள்ளது.
