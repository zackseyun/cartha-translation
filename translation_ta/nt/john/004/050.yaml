  terminology: “உன் மகன் உயிரோடு இருக்கிறான்,” “அந்த மனிதர்,” “வார்த்தையை நம்பி,” and “புறப்பட்டுச் சென்றார்” are appropriate. The πιστεύω alternative should be anchored to the believing expression, not to the final departure clause.
