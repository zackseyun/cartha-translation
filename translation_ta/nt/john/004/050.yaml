base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: ta
  text: இயேசு அவரிடம், “போ; உன் மகன் உயிரோடு இருக்கிறான்” என்றார். இயேசு தன்னிடம் சொன்ன வார்த்தையை அந்த மனிதர் நம்பி[a] புறப்பட்டுச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு தன்னிடம் சொன்ன வார்த்தையில் நம்பிக்கை வைத்து, புறப்பட்டுச் சென்றார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορεύου
  choice: புறப்பட்டுப் போ
  rationale: திரும்பிச் செல்லும்படி கூறும் நேரடியான கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது; கதையின் நகர்வையும் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ υἱός σου
  choice: உன் மகன்
  rationale: υἱός என்பது பொதுவாகக் ‘குழந்தை’ என்பதல்ல, குறிப்பாக ‘மகன்’ என்பதைக் குறிக்கிறது.
- source_word: ζῇ
  choice: உயிரோடு இருக்கிறான்
  rationale: நிகழ்கால வினையான ζῇ-யின் ‘உயிருடன் இருக்கிறான்’ என்ற பொருளை இயல்பாகத் தருகிறது; எதிர்காலத்தில் உயிர்வாழ்வான் என்று மாற்றுவதில்லை.
- source_word: ἐπίστευσεν
  choice: நம்பி
  rationale: இங்கு இயேசு சொன்ன வார்த்தையை உண்மையென ஏற்றுக்கொண்டு அதன்மேல் நம்பிக்கை வைத்த பதிலைத் தெரிவிக்கிறது; ‘நம்பினார்’ என்ற பொருளைச் செயற்பாட்டு தொடராக இயல்பாக இணைக்கிறது.
- source_word: ὁ ἄνθρωπος
  choice: அந்த மனிதர்
  rationale: முந்தைய சூழலில் உள்ள பதவிப்பெயரை இவ்வசனத்துக்குள் கொண்டுவராமல், கிரேக்கத்தின் பொதுவான ἄνθρωπος என்பதையே மரியாதையான நவீன தமிழில் காக்கிறது.
- source_word: τῷ λόγῳ
  choice: வார்த்தையை
  rationale: இங்கு λόγος என்பது இயேசு கூறிய குறிப்பிட்ட கூற்றைக் குறிக்கிறது; அதைத் தொடர்ந்து வரும் உறவுச்சொற்றொடர் பொருளைத் தெளிவாக்குகிறது.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு தன்னிடம் சொன்ன
  rationale: ‘வார்த்தை’ என்பதை இயல்பான தமிழில் தெளிவாக வரையறுக்கிறது; αὐτῷ யாரைக் குறிக்கிறது என்பதையும் ‘தன்னிடம்’ மூலம் காட்டுகிறது.
- source_word: ἐπορεύετο
  choice: புறப்பட்டுச் சென்றார்
  rationale: அவர் இயேசுவின் வார்த்தையை நம்பியபின் பயணத்தைத் தொடங்கி மேற்கொண்ட கதையோட்டத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் வாக்குறுதிக்கான பதிலில் πιστεύω என்பதன் மொழிபெயர்ப்பு
  choice: நம்பி
  alternative: நம்பிக்கை வைத்து
  rationale: ‘நம்பி’ என்பது சொல்லப்பட்ட வார்த்தையை உண்மையென ஏற்ற பதிலைத் தெளிவாகத் தருகிறது; இதை இரட்சிக்கும் விசுவாசமா அல்லது அந்த வாக்கின்மீதான நம்பிக்கையா என்று உரை சொல்லாத வேறுபாட்டைத் தீர்மானித்துவிடாமல் விடுகிறது.
- issue: ζῇ என்பதன் நிகழ்கால வலிமை
  choice: உயிரோடு இருக்கிறான்
  alternative: பிழைத்திருக்கிறான்
  rationale: மகன் அப்போதே உயிருடன் இருப்பதாக இயேசு அறிவிப்பதைப் பாதுகாக்கிறது; குணமடைதல் என்ற சூழலார்ந்த கருத்தை முதன்மை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்ப்பதில்லை.
translation_notes:
  register: மரியாதை ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. இயேசுவின் கூற்று சுருக்கமாகவும் அதிகாரமிக்கதாகவும் வைக்கப்பட்டுள்ளது; ‘உயிரோடு இருக்கிறான்’ என்பது நவீன வாசகருக்கு இயல்பாகவும் மூலத்தின் நிகழ்காலத்துக்கு நெருக்கமாகவும் உள்ளது.
