source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: ta
  text: ஆகவே, அவர் மீண்டும் கலிலேயாவிலுள்ள கானாவுக்கு வந்தார்; அங்கே அவர் தண்ணீரைத் திராட்சரசமாக்கியிருந்தார். கப்பர்நகூமில் மகன் நோயுற்றிருந்த ஒரு அரசவை அதிகாரி அங்கே இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரசவை அதிகாரி” என்பதற்கு “அரசனின் அதிகாரி” அல்லது “பிரபு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அரசரோடு அல்லது அரசவையோடு தொடர்புடைய ஒருவரைக் குறிக்கிறது; அவரது துல்லியமான பதவியைச் சொல்லவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் உள்ள தொடர்ச்சியையும் அதன் விளைவாக இயேசு கலிலேயாவுக்குச் சென்றதையும் காட்டும் இணைப்புச் சொல்.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: கானாவுக்கு மறுபடியும் வந்ததை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: கலிலேயாவிலுள்ள கானா
  rationale: பிரதேசத்தைச் சுட்டும் கிரேக்க மரபுத்தொடரை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: தண்ணீரைத் திராட்சரசமாக்கியிருந்தார்
  rationale: சொல்லுக்குச் சொல் 'தண்ணீரைத் திராட்சரசமாகச் செய்தார்' என்ற பொருளைத் தெளிவான தமிழில் வழங்குகிறது; இந்நிகழ்வுக்கு முன் நடந்த செயல் என்பதையும் நிறைவுற்ற வினை வடிவம் காட்டுகிறது.
- source_word: βασιλικός
  choice: அரசவை அதிகாரி
  rationale: அரசரோடும் அரசவையோடும் தொடர்புடைய ஒருவரைக் குறிக்கிறது; அவரது துல்லியமான பதவியையோ சமூக வகுப்பையோ ஊகிக்கவில்லை.
- source_word: τις
  choice: ஓர்
  rationale: பெயர் குறிப்பிடப்படாத குறிப்பிட்ட ஒருவரை அறிமுகப்படுத்தும் கிரேக்க இடைச்சொல்லை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: υἱός
  choice: மகன்
  rationale: நோயுற்றவர் ஆண் பிள்ளை என்பதை மூலமொழி குறிப்பாகச் சொல்கிறது.
- source_word: ἠσθένει
  choice: நோயுற்றிருந்த
  rationale: இச்சூழலில் உடல்நலக் குறைவைத் துல்லியமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: Καφαρναούμ
  choice: கப்பர்நகூம்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: βασιλικός என்பவரின் அரசியல் அல்லது சமூக அடையாளம்
  choice: அரசவை அதிகாரி
  alternative: அரசனின் அதிகாரி; பிரபு
  rationale: மூலச்சொல் அரச அதிகாரத்தோடு அல்லது அரசவையோடு உள்ள தொடர்பைக் காட்டுகிறது; அவர் ஏரோது அந்திப்பாவின் அதிகாரிதான் என்ற வரலாற்று ஊகத்தையோ, அவர் பிரபுக்கள் வகுப்பைச் சேர்ந்தவர் என்ற சமூக ஊகத்தையோ வசனம் உறுதிப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கிய வரிசையை அப்படியே பின்பற்றாமல், மகன் கப்பர்நகூமில் இருந்தான் என்றும் அதிகாரி கானாவில் இருந்தான் என்றும் தெளிவாகத் தெரிவிக்கும் இயல்பான தமிழ் அமைப்பு தேர்ந்தெடுக்கப்பட்டது.
