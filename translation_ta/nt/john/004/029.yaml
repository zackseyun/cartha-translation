id: JHN.4.29
reference: John 4:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: ta
  text: “வாருங்கள், நான் செய்ததையெல்லாம் எனக்குச் சொன்ன ஒரு மனிதரைப் பாருங்கள். ஒருவேளை இவர்தான் மேசியாவோ?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர்தான் கிறிஸ்துவோ?”
    reason: χριστός என்ற கிரேக்கப் பட்டத்திற்கான மாற்று வழக்கமான வடிவம்.
lexical_decisions:
- source_word: Δεῦτε
  choice: வாருங்கள்
  rationale: பலரை நோக்கிய நேரடி அழைப்பை இயல்பான, மரியாதையான பன்மை வடிவில் வெளிப்படுத்துகிறது.
- source_word: ἴδετε
  choice: பாருங்கள்
  rationale: Δεῦτε என்பதோடு இணைந்த ‘வாருங்கள், ... பாருங்கள்’ என்ற நேரடி அழைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἄνθρωπον
  choice: ஒரு மனிதரை
  rationale: இயேசுவைக் குறிக்கும் ஒருமை ஆண்பால் நபரைக் கிரேக்கச் சொல் சுட்டுவதால், பொதுவான ‘ஒருவரை’ என்பதற்குப் பதிலாக மூலத்தின் வடிவைத் தக்கவைக்கிறது.
- source_word: ὃς εἶπέ μοι
  choice: என்னிடம் சொன்ன
  rationale: பின்வரும் செய்தியின் உள்ளடக்கத்துடன் λέγω + மறைமுகப் பொருள் தமிழில் இயல்பாக ‘என்னிடம் சொன்ன’ என்று அமைகிறது.
- source_word: πάντα ὅσα
  choice: எல்லாவற்றையும்
  rationale: அவள் செய்த காரியங்களின் முழுமையைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐποίησα
  choice: நான் செய்த
  rationale: அவளுடைய கடந்தகாலச் செயல்களைக் குறிக்கும் கிரேக்க இறந்தகாலத்தை இயல்பான தமிழ் தொடர்பெயர் அமைப்பில் தருகிறது.
- source_word: μήτι
  choice: ஒருவேளை ... ஓ?
  rationale: உறுதியான அறிவிப்பாக அல்லாமல், பிறரைச் சிந்திக்க அழைக்கும் தயக்கமும் சாத்தியமும் கலந்த கேள்வியின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: இங்கு χριστός ஒரு பெயராக அல்ல, யூத எதிர்பார்ப்பில் உள்ள அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாகப் பயன்படுகிறது; ‘மேசியா’ அந்தச் சூழலைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் இது பெயர்போன்ற பயன்பாடு அல்ல; எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டம். ஆகவே யூத மேசியா எதிர்பார்ப்பை வெளிப்படுத்தும் ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: μήτι கேள்வியின் தயக்கமான தன்மை
  choice: ஒருவேளை இவர்தான் மேசியாவோ?
  alternative: இவர்தான் மேசியா அல்லவா?
  rationale: μήτι வழக்கமாக எதிர்மறைப் பதிலை எதிர்பார்க்கக்கூடும்; ஆனால் இச்சூழலில் பெண் ஒரு முடிவைத் திணிக்காமல் சாத்தியத்தை ஆராய வருமாறு அழைக்கிறாள். ‘ஒருவேளை ... ஓ?’ அந்தத் திறந்த தயக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நேரடி உரைநடையிலும் வடிவமைக்கப்பட்டது. ‘வாருங்கள் ... பாருங்கள்’ என்ற அழைப்பின் உயிரோட்டமும், இறுதிக் கேள்வியின் தயக்கமான திறந்த தன்மையும் தக்கவைக்கப்பட்டுள்ளன.
