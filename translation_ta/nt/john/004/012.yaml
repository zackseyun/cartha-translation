review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the well, Jacob's personal drinking, his sons, and his livestock. However, the unqualified question “நீங்கள் பெரியவரா?” does not itself carry the negative answer expected by μή as clearly as Tamil can. The comparative also benefits from “மேலானவர்” rather than “பெரியவர்,” which can be heard as referring to age or size.
  naturalness: The prose is fluent modern standard Tamil. A negative rhetorical question ending in “அல்லவே?” is natural and communicates the challenging tone directly, without requiring readers to consult the footnote.
  terminology: “யாக்கோபு,” “கிணறு,” “மகன்கள்,” and “கால்நடைகள்” are appropriate. “மேலானவர்” better represents μείζων here as comparative greatness or superiority.
  issues:
  - severity: medium
    issue: The main question does not explicitly express the negative expectation of μή.
    rationale: 'Although the footnote explains it, Tamil has a natural negative-question form that preserves this semantic and rhetorical feature in the running text: “... அல்லவே?”'
  - severity: low
    issue: “பெரியவர்” may be understood as older or physically bigger.
    rationale: In this comparison of status, “மேலானவர்” more clearly conveys μείζων without introducing a possible age-related reading.
