reference: John 4:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: ta
  text: நம் தந்தை யாக்கோபைவிட நீங்கள் மேலானவர் அல்லவே?[a] அவர் நமக்குக் கிணற்றைக் கொடுத்தார்; அவரே அதிலிருந்து குடித்தார்; அவருடைய மகன்களும் கால்நடைகளும் அதிலிருந்து குடித்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் தந்தை யாக்கோபைவிட நீங்கள் மேலானவரா?” கிரேக்கத்தில் μή-யுடன் அமைந்த இந்தக் கேள்வி ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: நீங்கள் ... பெரியவரா?
  rationale: μή அறிமுகப்படுத்தும் கேள்வி ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கிறது. தமிழில் இயல்பான வினாவாக மொழிபெயர்த்து, σὺ-வின் வலியுறுத்தலை ‘நீங்கள்’ என்பதன் இடத்தால் வெளிப்படுத்துகிறது; எதிர்பார்க்கப்படும் எதிர்மறைப் பதிப்பு அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: μείζων
  choice: பெரியவர்
  rationale: இங்கு உடல் அளவை அல்ல, மேன்மை அல்லது தகுநிலையை குறிக்கிறது. ‘பெரியவர்’ என்பது தமிழில் ஒப்பீட்டுச் சூழலில் இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: நம் தந்தை யாக்கோபைவிட
  rationale: சமாரியப் பெண் முன்வைக்கும் மூதாதை உறவையும் மரியாதையையும், கிரேக்கத்தின் ‘எங்கள் தந்தை யாக்கோபு’ என்ற அமைப்பையும் காக்கிறது.
- source_word: ἔδωκεν ἡμῖν
  choice: நமக்குக் கொடுத்தார்
  rationale: இறந்தகால வரலாற்றுச் செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὸ φρέαρ
  choice: இந்தக் கிணற்றை
  rationale: φρέαρ இச்சூழலில் கிணற்றைக் குறிக்கிறது. தமிழில் உரையாடலில் சுட்டப்படும் அருகிலுள்ள கிணற்றுக்கு ‘இந்தக் கிணறு’ இயல்பானது.
- source_word: καὶ αὐτὸς
  choice: அவரே
  rationale: αὐτός தரும் வலியுறுத்தலை ‘-ஏ’ என்ற வலியுறுத்தல் இடைச்சொல் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἐξ αὐτοῦ
  choice: அதிலிருந்து
  rationale: முன்னர் குறிப்பிடப்பட்ட கிணற்றிலிருந்து குடித்ததை இயல்பாகக் குறிக்கிறது.
- source_word: ἔπιεν
  choice: குடித்தார் / குடித்தனர்
  rationale: கிரேக்க இறந்தகாலச் செயலைத் தமிழில் எளிய இறந்தகாலமாக வழங்குகிறது; யாக்கோபுக்கும் பின்னர் இணைக்கப்பட்ட பன்மை எழுவாய்களுக்கும் ஏற்ற வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: அவருடைய மகன்கள்
  rationale: υἱοί என்பதன் ஆண்பால் பன்மைப் பொருளை பொதுவான ‘பிள்ளைகள்’ என்று மாற்றாமல் காக்கிறது.
- source_word: τὰ θρέμματα αὐτοῦ
  choice: கால்நடைகள்
  rationale: வளர்க்கப்படும் வீட்டுவிலங்குகளைப் பரந்த வகையில் குறிக்கிறது; ‘மாடுகள்’ என்று தேவையின்றிக் குறுக்கவில்லை.
theological_decisions:
- issue: μή அறிமுகப்படுத்தும் எதிர்மறைப் பதிலை எதிர்பார்க்கும் வினாவின் வலிமை
  choice: ‘நம் தந்தை யாக்கோபைவிட நீங்கள் பெரியவரா?’ என்ற சொல்லாட்சியுடன், எதிர்பார்க்கப்படும் ‘இல்லை’ என்ற பதிலை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘நம் தந்தை யாக்கோபைவிட நீங்கள் பெரியவர் அல்லவே?’
  rationale: மூலத்தின் வினா வடிவத்தையும் பெண்ணின் சவாலான தொனியையும் முதன்மை உரையில் இயல்பாகக் காக்கிறது; μή தரும் எதிர்பார்ப்பை மறைக்காமல் அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்கள்’ என்பது இன்றைய வாசகர்களுக்கு இயல்பான மரியாதை ஒருமையாகவும், ‘நீர்’ என்பதைக் காட்டிலும் குறைவான தொன்மைநடையாகவும் உள்ளது. கலப்பு எழுவாயான மகன்களும் கால்நடைகளும் என்பதற்கு வாசிப்பில் மரியாதைக் குழப்பம் வராமல் இலக்கியப் பன்மை ‘குடித்தனர்’ பயன்படுத்தப்பட்டுள்ளது.
