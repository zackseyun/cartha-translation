translation:
  language: ta
  text: தேவன் ஆவியாயிருக்கிறார்[b]; அவரை வழிபடுகிறவர்கள் ஆவியிலும் உண்மையிலும்[a] வழிபட வேண்டும்.
  philosophy: optimal-equivalence
