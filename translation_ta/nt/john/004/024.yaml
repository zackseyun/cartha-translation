    text: அல்லது, ‘ஆவியானவரிலும் உண்மையிலும்.’ கிரேக்கச் சொற்றொடரை இவ்வாறு குறிப்பாகவும் புரிந்துகொள்ளலாம்; முதன்மை உரை அதன் பரந்த பொருளைப் பாதுகாக்கிறது.
    reason: alternative_reading
  - marker: b
    text: ‘தேவன் ஆவியாயிருக்கிறார்’ என்பது தேவனுடைய இயல்பைப் பற்றிய கூற்று; பல ஆவிகளுள் தேவனும் ஓர் ஆவி என்று இதற்குப் பொருள் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: ஆவியாயிருக்கிறார்
  rationale: கட்டுரையில்லாத பயனிலைப் பெயர்ச்சொல் தேவனுடைய இயல்பைப் பண்புரீதியாகக் கூறுகிறது. ‘ஒரு ஆவி’ என்று மொழிபெயர்த்தால், பல ஆவியினங்களில் தேவனும் ஒருவர் என்ற தவறான எண்ணம் தோன்றக்கூடும்.
- source_word: ὁ θεός
  choice: தேவன்
  rationale: இவ்வாக்கியத்தின் எழுவாய் ὁ θεός. நவீனத் தமிழில் கண்ணியமானதும் பரவலாகப் புரிந்துகொள்ளப்படுவதுமான இறைப்பெயராக ‘தேவன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: அவரை வழிபடுகிறவர்கள்
  rationale: கட்டுரையுடன் வரும் நிகழ்காலப் பங்கேற்புவினை, வழிபடுவோரை ஒரு பொதுவகுப்பாகக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அதன் பொதுவான, தொடர்ச்சியான பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν πνεύματι
  choice: ஆவியில்
  rationale: கட்டுரையில்லாத πνεύματι, ἀληθείᾳ என்பதுடன் இணையாக வருகிறது. ஆகவே பரிசுத்த ஆவியானவரை மட்டும் வெளிப்படையாகக் குறிப்பதாகக் குறுக்காமல், மூலத்தின் பரந்த பொருளை ‘ஆவியில்’ காக்கிறது.
- source_word: ἀληθείᾳ
  choice: உண்மையில்
  rationale: யோவானின் பயன்பாட்டில் ἀλήθεια உண்மை, மெய்மை, வெளிப்படுத்தப்பட்ட யதார்த்தம் ஆகிய நுணுக்கங்களைக் கொண்டிருக்கலாம். ‘உண்மை’ அவற்றை தேவையின்றிக் குறுக்காத இயல்பான தமிழ் சொல்.
- source_word: δεῖ προσκυνεῖν
  choice: வழிபட வேண்டும்
  rationale: δεῖ குறிப்பிடும் அவசியத்தையும் கடமையையும் ‘வேண்டும்’ தெளிவாகக் காக்கிறது; προσκυνεῖν என்பதற்கு இச்சூழலில் ‘வழிபட’ இயல்பான இணை.
theological_decisions:
- issue: ‘தேவன் ஆவி’ என்ற கூற்றின் பொருள்
  choice: தேவனுடைய இயல்பைப் பற்றிய பண்புரீதியான கூற்றாக ‘தேவன் ஆவியாயிருக்கிறார்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தேவன் ஓர் ஆவி’
  rationale: πνεῦμα கட்டுரையின்றி பயனிலையாகவும் ὁ θεός எழுவாயாகவும் அமைந்துள்ளதால், தேவன் பல ஆவியினங்களில் ஒருவர் என்று வகைப்படுத்துவதைவிட அவருடைய இயல்பை இக்கூற்று வெளிப்படுத்துகிறது.
- issue: ‘ஆவியிலும் உண்மையிலும்’ என்பதன் குறிப்பு
  choice: ஆவிக்குரிய மெய்நிலையும் உண்மையும் பண்பாக்கும் வழிபாடு என்ற பரந்த பொருள் பாதுகாக்கப்பட்டது.
  alternative: ‘ஆவியானவரிலும் உண்மையிலும்’; ‘உள்ளார்ந்த உணர்வோடும் நேர்மையோடும்’
  rationale: கட்டுரையில்லாத πνεύματι மற்றும் ἀληθείᾳ ஆகியவை பரந்த பொருளுக்கு இடமளிக்கின்றன. மூலவாக்கியம் தெளிவாகச் சொல்லாத அளவுக்கு இதை பரிசுத்த ஆவியானவரை மட்டும் குறிப்பதாகவோ, வெறும் உள்ளார்ந்த நேர்மையாகவோ சுருக்கவில்லை.
