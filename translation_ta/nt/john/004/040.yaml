  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: ta
  text: ஆகவே, சமாரியர்கள் அவரிடம் வந்தபோது, தங்களோடு தங்கும்படி அவரிடம் கேட்டுக்கொண்டிருந்தார்கள்[a], அவர் அங்கே இரண்டு நாட்கள் தங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களோடு தங்கும்படி அவரிடம் கேட்டார்கள்.” கிரேக்க இறந்தகாலத் தொடர்நிலை வினை, அவர்கள் தொடர்ந்து அல்லது மீண்டும் மீண்டும் கேட்டதைச் சுட்டிக்காட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: ஆகவே, ... வந்தபோது
  rationale: ὡς என்பதன் காலப் பொருளையும் οὖν என்பதன் தொடர்ச்சி/விளைவுக் கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: அவரிடம் வந்தபோது
  rationale: πρός உடன் வரும் இயக்கத்தை, ஒருவரை அணுகி வருதல் என்ற இயல்பான தமிழில் தருகிறது.
- source_word: οἱ Σαμαρῖται
  choice: சமாரியர்கள்
  rationale: இன/மக்கள் குழுவைக் குறிக்கும் நேரடியான, வழக்கமான தமிழ்ச் சொல்.
- source_word: ἠρώτων
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவமான imperfect குறிக்கக்கூடிய நீடித்த அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட வேண்டுகோளைப் பாதுகாக்கிறது.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: தங்களோடு தங்கும்படி
  rationale: μένω என்பதற்கு இயல்பான ‘தங்கு’ என்பதையும் παρά + dative குறிக்கும் அவர்களோடு இருப்பதையும் தெளிவாகத் தருகிறது.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: அவரும் அங்கே ... தங்கினார்
  rationale: முன்னுள்ள μεῖναι உடன் சொல் ஒற்றுமையைப் பேணுவதோடு ἐκεῖ என்பதை ‘அங்கே’ என வெளிப்படையாகக் காட்டுகிறது.
- source_word: δύο ἡμέρας
  choice: இரண்டு நாட்கள்
  rationale: கால நீட்சியைக் குறிக்கும் accusative-ஐ நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
