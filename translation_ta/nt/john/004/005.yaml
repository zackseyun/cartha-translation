base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: ta
  text: ஆகவே, அவர் சமாரியாவில் சீகார் எனப்படும் ஓர் ஊருக்கு வந்தார்.[a] அது யாக்கோபு தன் மகன் யோசேப்புக்குக் கொடுத்த நிலப்பகுதிக்கு[b] அருகில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு நகருக்கு.” கிரேக்கச் சொல் πόλις, சூழலுக்கேற்ப நகரத்தையோ ஊரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வயலுக்கு.” கிரேக்கச் சொல் χωρίον, வயல், சொத்து அல்லது நிலப்பகுதி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: வந்தார்
  rationale: கதைநடையில் இது வரலாற்று நிகழ்காலம்; இயல்பான தமிழ் கதைநடைக்காக இறந்தகாலத்தில் மொழிபெயர்க்கப்பட்டது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய சூழலிலிருந்து வரும் தொடர்ச்சியையும் விளைவையும் காட்டும் இணைப்பைத் தக்கவைக்கிறது.
- source_word: πόλιν
  choice: ஓர் ஊருக்கு
  rationale: πόλις என்பது சூழலுக்கேற்ப நகரத்தையோ ஊரையோ குறிக்கலாம்; சீகாரின் அளவை மிகைப்படுத்தாமல் இயல்பாகக் கூற ‘ஊர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τῆς Σαμαρείας
  choice: சமாரியாவில்
  rationale: அந்த ஊர் சமாரியா பகுதியில் அமைந்திருந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λεγομένην Συχὰρ
  choice: சீகார் எனப்படும்
  rationale: ஊரின் பெயரை அடையாளப்படுத்தும் கிரேக்கப் பங்கேற்புவினை அமைப்பின் இயல்பான தமிழ் வடிவம்.
- source_word: πλησίον
  choice: அருகில்
  rationale: இடவியல் அண்மையைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: χωρίου
  choice: நிலப்பகுதிக்கு
  rationale: χωρίον என்பது வயல், சொத்து அல்லது குறிப்பிட்ட நிலப்பகுதியைக் குறிக்கலாம்; ‘நிலப்பகுதி’ இந்தப் பொருள் வரம்பைத் தேவையின்றி சுருக்காது.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: யாக்கோபு ... கொடுத்த
  rationale: முதன்மை நிகழ்வுக்கு முன் நடந்த பின்னணி நிகழ்வை இயல்பான தமிழ் தொடர்பெச்ச அமைப்பில் தருகிறது.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: தன் மகன் யோசேப்புக்கு
  rationale: பெறுபவரையும் யாக்கோபுடனான உறவையும் தெளிவாகக் கூறும் இயல்பான தமிழ் சொல்வரிசை.
