  text: ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρείας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: ta
  text: அவர் சமாரியா வழியாகச் செல்ல வேண்டியிருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் சமாரியா வழியாகச் செல்வது அவசியமாயிருந்தது.” கிரேக்க மூலவாக்கியம் தேவையைத் தெரிவிக்கிறது; ஆனால் அந்தத் தேவைக்கான சரியான காரணத்தைக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: செல்ல வேண்டியிருந்தது
  rationale: δέω என்பதன் இறந்தகாலக் கதையாடல் வடிவம் தேவையை உணர்த்துகிறது. ‘வேண்டியிருந்தது’ என்பது அந்தத் தேவையை இயல்பான நவீனத் தமிழில் தருகிறது; அதன் காரணத்தை மட்டும் தீர்மானிப்பதில்லை.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் கதையின் முன்னேற்றத்தை மெதுவாக இணைக்கிறது. தமிழில் தனியான இணைப்புச்சொல் இல்லாமலேயே தொடர்ச்சி இயல்பாக வெளிப்படுகிறது.
- source_word: αὐτὸν
  choice: அவர்
  rationale: கிரேக்கத்தில் இது infinitive அமைப்பின் accusative subject ஆக இருந்தாலும், இயல்பான தமிழில் மரியாதை ஒருமை எழுவாயாக ‘அவர்’ என வழங்கப்படுகிறது.
- source_word: διέρχεσθαι
  choice: செல்ல
  rationale: διά உடன் வரும் διέρχομαι ஒரு பகுதியின் ஊடாகச் செல்வதைக் குறிக்கிறது. ‘வழியாகச் செல்ல’ என்பது புவியியல் நகர்வை இயல்பாகத் தெரிவிக்கிறது.
- source_word: διὰ τῆς Σαμαρείας
  choice: சமாரியா வழியாக
  rationale: Genitive உடன் διά ஓர் இடத்தின் ஊடாக அல்லது அந்த வழியாக நகர்வதைக் காட்டுகிறது. ‘சமாரியா வழியாக’ என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: ἔδει குறிப்பிடும் தேவையின் தன்மை
  choice: உண்மையான தேவையாக ‘வேண்டியிருந்தது’ என்று மொழிபெயர்த்து, அதன் காரணத்தைக் குறிப்பிடாமல் விடுதல்
  alternative: அது வெறும் புவியியல் அவசியம் அல்லது இயேசுவின் இறைப் பணியுடன் தொடர்புடைய தெய்வீக அவசியம் என்று வெளிப்படையாக விளக்குதல்
  rationale: இவ்வசனத்தின் கிரேக்கம் அவசியத்தைத் தெரிவிக்கிறது; ஆனால் அது எதனால் ஏற்பட்டது என்பதைத் தெளிவுபடுத்தவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான மற்றும் கண்ணியமான நடை. ‘அவர்’ என்பது இயேசுவைக் குறிக்கும் மரியாதை ஒருமை. கதையோட்டத்தில் δέ-க்கு தேவையற்ற ‘இப்போது’ அல்லது வலுவான ‘ஆனால்’ சேர்க்கப்படவில்லை.
