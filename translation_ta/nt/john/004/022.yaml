source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: ta
  text: நீங்கள் அறியாததை வழிபடுகிறீர்கள்; நாங்கள் அறிந்ததை வழிபடுகிறோம், ஏனெனில் மீட்பு யூதர்களிடமிருந்து வருகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூத மக்களிடமிருந்து’ என்றும் மொழிபெயர்க்கலாம். யோவானின் பிற சில இடங்களில் ‘யூதேயர்கள்’ என்பது பொருந்தக்கூடும்; ஆனால் இங்கு வழிபாடு மற்றும் மீட்பு வரலாறு தொடர்பாகச் சமாரியர்களோடு செய்யப்படும் வேறுபாட்டில் யூத மக்கள் குறிப்பிடப்படுகின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: வழிபடுகிறீர்கள் / வழிபடுகிறோம்
  rationale: இங்கு வினைச்சொல் உடல் வணக்கத்தையோ மரியாதை செலுத்துவதையோ மட்டும் குறிக்காமல், சமய வழிபாட்டைக் குறிக்கிறது. ‘வழிபடு’ என்பது இயல்பான நவீனத் தமிழ் இணை.
- source_word: ὃ
  choice: அறியாததை / அறிந்ததை
  rationale: நடுநிலை உறவுப்பெயரான ὃ-வைத் தனியே விரித்து மொழிபெயர்க்காமல், தமிழ் வாக்கிய அமைப்புக்கு இயல்பாக ‘-தை’ என்ற வடிவில் கொடுத்துள்ளது. ‘யாரை’ அல்லது ‘அவரை’ என்பது கிரேக்கத்தில் இல்லாத தனிப்பட்ட குறிப்பைச் சேர்க்கும்.
- source_word: οἴδατε / οἴδαμεν
  choice: அறியாத / அறிந்த
  rationale: வழிபாட்டின் பொருளைக் குறித்த அறிவை நேரடியாகத் தெரிவிக்கும் கூர்மையான எதிர்மறை–நேர்மறை வேறுபாட்டை ‘அறி’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: σωτηρία
  choice: மீட்பு
  rationale: σωτηρία இங்கு கடவுளின் இரட்சிக்கும் செயலைக் குறிக்கிறது. பொதுவாசகர்களுக்குப் புரியக்கூடிய, சமயச் சூழலிலும் இயல்பான தமிழ்ச் சொல்லாக ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டுள்ளது; இது வெறும் தற்காலிக விடுதலையாகக் குறுகாமல் சூழலால் பொருள் பெறுகிறது.
- source_word: ἐκ
  choice: இடமிருந்தே வருகிறது
  rationale: ἐκ மூலத்தையோ தோற்றுவாயையோ குறிக்கிறது. தமிழில் முழுமையான, இயல்பான கூற்றாக அமைய ‘வருகிறது’ சேர்க்கப்பட்டுள்ளது; ‘-ஏ’ கிரேக்கக் கூற்றின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களிடமிருந்து
  rationale: இச்சூழலில் சமாரியர்களுக்கு எதிராக யூத மக்கள் மற்றும் அவர்களோடு தொடர்புடைய மீட்பு வரலாறு குறிப்பிடப்படுகின்றன. ‘யூதேயர்கள்’ என்பது இங்கு தேவையற்ற புவியியல் குறுக்கத்தை ஏற்படுத்தக்கூடும்.
theological_decisions:
- issue: ‘மீட்பு யூதர்களிடமிருந்து வருகிறது’ என்பதன் பொருள்
  choice: மீட்பு வரலாற்றில் அதன் தோற்றுவாயும் வழிமுறையும் யூத மக்களோடு தொடர்புடையது என்ற கூற்றாக மொழிபெயர்த்தல்
  alternative: மேசியாவின் யூதப் பிறப்பை மட்டும் குறிக்கும் கூற்றாகவோ, யூத இன மேன்மையைக் கூறும் கூற்றாகவோ விளக்குதல்
  rationale: கிரேக்க வாசகம் மீட்பின் மூலத்தை யூதர்களோடு இணைக்கிறது; ஆனால் அது எவ்வாறு நிறைவேறுகிறது என்பதை இவ்வசனத்திலேயே விரிவாக்கவில்லை. ஆகவே மொழிபெயர்ப்பு வரலாற்று-இறையியல் கூற்றைப் பாதுகாத்து, இன மேன்மையையோ ஒரு குறுகிய விளக்கத்தையோ சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியக்கூடிய தமிழ். மூலத்தின் ‘நீங்கள்/நாங்கள்’ எதிர்நிலையும் ‘அறியாதது/அறிந்தது’ என்ற கூர்மையான வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
