source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: ta
  text: அந்த நேரத்தில் அவருடைய சீடர்கள் வந்தார்கள். அவர் ஒரு பெண்ணுடன் பேசிக்கொண்டிருந்ததைக் கண்டு அவர்கள் வியப்படைந்தார்கள். ஆனாலும், “என்ன தேடுகிறீர்கள்?”[a] என்றோ, “அவளுடன் ஏன் பேசுகிறீர்கள்?”[b] என்றோ ஒருவரும் கேட்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு என்ன வேண்டும்?”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவளுடன் என்ன பேசுகிறீர்கள்?” இங்கு அதன் பொருள், “அவளுடன் ஏன் பேசுகிறீர்கள்?” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: அந்த நேரத்தில்
  rationale: இது இடத்தைக் குறிக்காமல், நிகழ்ந்துகொண்டிருந்த உரையாடலின் அதே தருணத்தைக் குறிக்கும் இயல்பான காலவழக்காகும்.
- source_word: ἐθαύμαζον
  choice: வியப்படைந்தார்கள்
  rationale: சீடர்களின் தொடர்ந்த வியப்பை இறந்தகாலச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது; தேவையற்ற விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: μετὰ γυναικὸς
  choice: ஒரு பெண்ணுடன்
  rationale: Articular அல்லாத γυναικός இச்சூழலில் குறிப்பிடப்படாத ஒரு பெண்ணைக் குறிக்கிறது; ‘மனைவி’ என்ற பொருள் இங்கு பொருந்தாது.
- source_word: ἐλάλει
  choice: பேசிக்கொண்டிருந்தார்
  rationale: Imperfect வடிவம் அப்போது தொடர்ந்து நடந்துகொண்டிருந்த உரையாடலைக் காட்டுவதால், தொடர்நிலைத் தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: μέντοι
  choice: ஆனாலும்
  rationale: அவர்கள் வியந்தபோதிலும் கேள்விகளை வெளிப்படையாகக் கேட்கவில்லை என்ற முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: Τί ζητεῖς;
  choice: என்ன தேடுகிறாய்?
  rationale: ζητέω என்பதன் அடிப்படைப் பொருளான ‘தேடு’ என்பதையும், கூறப்படாமல் விடப்பட்டுள்ள செயப்படுபொருளின் திறந்த தன்மையையும் காக்கிறது.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: அவளுடன் ஏன் பேசுகிறீர்?
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘என்ன பேசுகிறீர்?’ என்றாலும், இச்சூழலில் τί கேள்வியின் இயல்பான நோக்கம் காரணத்தை விசாரிப்பதாகும். மரியாதைப் பன்மை இயேசுவிடம் கேட்கப்படும் கேள்விக்குப் பொருத்தமான நவீனத் தமிழ் நடை.
theological_decisions:
- issue: இயேசு ஒரு பெண்ணுடன் பேசியதைக் குறித்த சீடர்களின் வியப்பு
  choice: அவர்கள் வியந்ததாக மட்டும் மொழிபெயர்த்து, அதற்கான சமூக, இன அல்லது ஒழுக்கக் காரணத்தை வசனத்திற்குள் சேர்க்கவில்லை.
  alternative: யூதர்–சமாரியர் உறவு அல்லது ஆண்–பெண் சமூக மரபை வசனத்திலேயே விளக்கமாகச் சேர்த்தல்.
  rationale: கிரேக்க மூலவசனம் சீடர்களின் வியப்பைக் கூறுகிறதே தவிர, அதன் காரணத்தை வெளிப்படையாக விளக்கவில்லை. ஆகவே மூலத்தின் கட்டுப்பாடும் இறையியல் திறந்த தன்மையும் பாதுகாக்கப்பட்டன.
- issue: இரண்டு கேள்விகளின் மறைமுகப் பெறுநர்கள்
  choice: முதல் கேள்வியின் ‘நீ’ என்பதைத் தமிழில் வெளிப்படையாகச் சேர்க்காமல், இரண்டாவது கேள்வியில் இயேசுவுக்குரிய மரியாதை வினைமுற்றைப் பயன்படுத்தினோம்.
  alternative: முதல் கேள்வி பெண்ணிடமும் இரண்டாவது இயேசுவிடமும் கேட்கப்படுவதாகப் பெயர்ச்சொற்களைச் சேர்த்து முழுமையாக விளக்குதல்.
  rationale: கிரேக்கத்தில் பெறுநர்களின் பெயர்கள் வெளிப்படையாக இல்லை. தமிழின் இயல்பான வினைமுற்றுகள் சூழலை உணர்த்தினாலும், மூலத்தில் இல்லாத விளக்கப் பெயர்களைச் சேர்க்காமல் ambiguity இயன்றவரை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. இயேசுவைக் குறிக்கும் வினைமுற்றுகளில் மரியாதை நடை காக்கப்பட்டது. சமூகப் பின்னணி விளக்கத்தை முதன்மை உரையில் சேர்க்காமல், மூலத்தின் சுருக்கமும் பதற்றமும் பாதுகாக்கப்பட்டன.
