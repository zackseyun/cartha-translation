source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “என்னை அனுப்பியவரின் சித்தத்தைச் செய்து, அவருடைய பணியை நிறைவு செய்வதே என் உணவு” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்னை அனுப்பியவர்’ என்பது சூழலில் தந்தையாகிய கடவுளைக் குறிக்கிறது; ஆனால் கிரேக்க மூலத்தில் ‘தந்தை’ என்ற பட்டம் இங்கு வெளிப்படையாக இல்லை.
    reason: cross_reference
lexical_decisions:
- source_word: βρῶμά
  choice: உணவு
  rationale: சீடர்கள் நேரடியான உணவைப் பற்றிப் பேசும் சூழலில், இயேசுவின் உருவகத்தின் தாக்கத்தைத் தக்கவைக்க βρῶμα என்பதன் இயல்பான பொருளான ‘உணவு’ பயன்படுத்தப்பட்டது.
- source_word: Ἐμὸν βρῶμά ἐστιν ἵνα ποιήσω
  choice: நிறைவேற்றுவதே என் உணவு
  rationale: தமிழில் இயல்பான பெயரெச்சத் தொடரால் ἵνα உடன் வரும் செயல்-உள்ளடக்கம் வெளிப்படுத்தப்படுகிறது; அதே நேரத்தில் ‘என் உணவு’ என்ற உருவகம் அப்படியே பாதுகாக்கப்படுகிறது.
- source_word: τὸ θέλημα
  choice: விருப்பம்
  rationale: θέλημα என்பது அனுப்பியவரின் நோக்கமுள்ள சித்தம் அல்லது விருப்பத்தைக் குறிக்கிறது. சாதாரண நவீனத் தமிழில் தெளிவாகப் புரியும் ‘விருப்பம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τοῦ πέμψαντός με
  choice: என்னை அனுப்பியவரின்
  rationale: ஆள் குறிக்கும் கிரேக்கப் பெயரெச்சம் சுருக்கமான, இயல்பான தமிழ்ப் பெயரெச்சத் தொடராக வழங்கப்பட்டது; மூலத்தில் இல்லாத ‘தந்தை’ என்ற பட்டம் உரைக்குள் சேர்க்கப்படவில்லை.
- source_word: τελειώσω
  choice: முழுமைப்படுத்துவது
  rationale: τελειόω ஒரு செயலை வெறுமனே முடிப்பதை மட்டுமல்ல, அதன் நோக்கமுள்ள நிறைவுக்குக் கொண்டுவருவதையும் குறிக்கலாம்; ‘முழுமைப்படுத்து’ அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἔργον
  choice: செயல்
  rationale: ἔργον இங்கு அனுப்பியவர் இயேசுவிடம் ஒப்படைத்த செயற்பாட்டை அல்லது பணியைச் சுட்டுகிறது. ‘செயல்’ மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: இயேசு அவர்களிடம் … என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலம் நவீனத் தமிழ் கதைநடையில் இயல்பான இறந்தகாலமாக வழங்கப்பட்டது.
theological_decisions:
- issue: ‘என்னை அனுப்பியவர்’ யாரைக் குறிக்கிறது
  choice: உரையில் ‘என்னை அனுப்பியவர்’ என்று மறைமுகக் குறிப்பைத் தக்கவைத்தல்
  alternative: ‘என்னை அனுப்பிய தந்தை’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: யோவான் நற்செய்தியின் சூழல் தந்தையாகிய கடவுளைக் குறித்தாலும், இவ்வசனத்தின் கிரேக்கம் அந்தப் பட்டத்தை வெளிப்படையாகக் கூறவில்லை. ஆகவே மொழிபெயர்ப்பு அதை விளக்கமாக உரைக்குள் சேர்க்கவில்லை.
- issue: τελειώσω என்பதன் நுணுக்கம்
  choice: ‘முழுமைப்படுத்து’
  alternative: ‘முடித்து விடு’
  rationale: இச்சொல் ஒப்படைக்கப்பட்ட செயலை அதன் இலக்கான நிறைவுக்குக் கொண்டுவருதல் என்ற பொருளையும் தாங்குகிறது; ‘முழுமைப்படுத்து’ அந்த இறையியல் மற்றும் பணிசார் நுணுக்கத்தை முன்கூட்டியே குறுக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நேரடியான நடை பயன்படுத்தப்பட்டது. ‘என் உணவு’ என்ற மைய உருவகம் பாதுகாக்கப்பட்டுள்ளது. தமிழ் வாக்கிய இயல்புக்கேற்ப மேற்கோள் சொல்லைத் தொடர்ந்து பேச்சாளர் வினை அமைக்கப்பட்டது; அடிக்குறி குறியீடு மேற்கோள் வாக்கியத்திற்குப் பின் வைக்கப்பட்டது.
