translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திரும்பிச் சென்றார்’ என்பது பயணச் சூழலை இயல்பாகக் காட்டுகிறது; πάλιν என்பதிலுள்ள ‘மீண்டும்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
