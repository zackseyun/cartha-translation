  yaml_path: translation/nt/john/004/003.yaml
  text: he left Judea and went back to Galilee[a].
translation:
  language: ta
  text: அவர் யூதேயாவை விட்டுப் புறப்பட்டு, கலிலேயாவுக்குத் திரும்பிச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் கலிலேயாவுக்குச் சென்றார்.” πάλιν என்ற கிரேக்கச் சொல் “மீண்டும்” என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு அது திரும்பிச் செல்வதைக் குறிக்க வாய்ப்புள்ளதால் “திரும்பி” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: விட்டுப் புறப்பட்டு
  rationale: ἀφίημι இங்கு ஓர் இடத்தை விட்டுச் செல்வதைக் குறிக்கிறது. தமிழில் அடுத்த பயணவினையுடன் இயல்பாக இணைவதற்காக ‘விட்டுப் புறப்பட்டு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὴν Ἰουδαίαν
  choice: யூதேயாவை
  rationale: நற்செய்தி நூலின் புவியியல் சூழலில் குறிப்பிடப்படும் பிரதேசத்திற்கான வழக்கமான நவீனத் தமிழ்ப் பெயர்.
- source_word: ἀπῆλθεν
  choice: சென்றார்
  rationale: ἀπέρχομαι இங்கு ஓர் இடத்திலிருந்து மற்றோர் இடத்திற்குச் செல்வதைக் குறிக்கிறது; ‘சென்றார்’ இயல்பான, நேரடியான தமிழ் வடிவம்.
- source_word: πάλιν
  choice: திரும்பி
  rationale: இந்தப் பயணச் சூழலில் πάλιν வெறும் மறுமுறையைவிட முன்பு இருந்த இடத்திற்குத் திரும்பிச் செல்வதை இயல்பாகக் குறிக்கிறது.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவுக்கு
  rationale: εἰς இலக்கை நோக்கிய நகர்வைக் குறிக்கிறது; ஒரு பிரதேசத்திற்குச் செல்வதை நவீனத் தமிழில் ‘கலிலேயாவுக்கு’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
