id: JHN.17.9
reference: John 17:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: ta
  text: அவர்களுக்காக நான் வேண்டிக்கொள்கிறேன்[a]. உலகத்திற்காக நான் வேண்டிக்கொள்ளவில்லை; மாறாக, நீர் எனக்குத் தந்தவர்களுக்காக வேண்டிக்கொள்கிறேன்; ஏனெனில் அவர்கள் உம்முடையவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைப்பற்றி”; இச்சூழலில் கிரேக்க முன்னிடைச்சொல் “அவர்களுக்காக” அல்லது “அவர்களைப்பற்றி” என்ற இரு நுணுக்கங்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: வேண்டிக்கொள்கிறேன்
  rationale: அடிப்படைப் பொருள் ‘கேட்கிறேன்/வேண்டுகிறேன்’ என்பதாக இருந்தாலும், இங்கு பிதாவை நோக்கிய விண்ணப்பச் சூழலில் ‘வேண்டிக்கொள்கிறேன்’ என்பது இயல்பாகவும் பக்திசார் மிகைப்பில்லாமலும் உள்ளது; நிகழ்கால வினையையும் காக்கிறது.
- source_word: περὶ αὐτῶν
  choice: அவர்களுக்காக
  rationale: περί + மரபுவேற்றுமை ‘அவர்களைப்பற்றி’ என்றும், விண்ணப்பச் சூழலில் ‘அவர்களுக்காக’ என்றும் பொருள்படலாம். இங்கு பரிந்துபேசும் வேண்டுதலின் இயல்பைத் தெளிவாகக் காட்ட ‘அவர்களுக்காக’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: κόσμου
  choice: உலகம்
  rationale: யோவானின் சொல்லாட்சியிலுள்ள θεολογியச் செறிவையும் தெளிவின்மையையும் குறுக்காமல், κόσμος என்பதற்கு வழக்கமான ‘உலகம்’ பயன்படுத்தப்பட்டது.
- source_word: ὧν δέδωκάς μοι
  choice: நீர் எனக்குத் தந்தவர்கள்
  rationale: மனிதர்களைக் குறிக்கும் உறவுப்பெயரையும், பிதா குமாரனுக்குக் கொடுத்த செயல் இன்றும் விளைவுடையது என்ற நிறைவேற்றுக்கால நுணுக்கத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅτι σοί εἰσιν
  choice: ஏனெனில், அவர்கள் உம்முடையவர்கள்
  rationale: ὅτι-யின் காரணப் பொருளையும் σοί εἰσιν என்பதன் உறவு/உடைமைப் பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: ἐγὼ
  choice: நான்
  rationale: வெளிப்படையான கிரேக்கப் பிரதிப்பெயரின் வலியுறுத்தலையும் அடுத்துவரும் முரண்பாட்டு அமைப்பையும் காக்கிறது.
- source_word: ἀλλὰ
  choice: -க்காகவே
  rationale: οὐ ... ἀλλά என்ற வலுவான ‘அல்ல, மாறாக’ முரண்பாட்டைத் தமிழில் எதிர்மறை வாக்கியத்திற்குப் பின் ‘-க்காகவே’ என்ற இயல்பான வலியுறுத்தல் மூலம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐρωτῶ என்பதை வெளிப்படையான ஜெபச் சொல்லால் மொழிபெயர்ப்பதா
  choice: ‘வேண்டிக்கொள்கிறேன்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘கேட்கிறேன்’ அல்லது ‘ஜெபிக்கிறேன்’
  rationale: ‘கேட்கிறேன்’ தமிழில் தகவல் கேட்பதாகத் தவறாகப் புரியக்கூடும்; ‘ஜெபிக்கிறேன்’ என்பது கிரேக்கச் சொல்லைவிட குறிப்பான சமயச் சொல்லாகும். ‘வேண்டிக்கொள்கிறேன்’ விண்ணப்பச் சூழலையும் மூலச்சொல்லின் பொதுவான பொருளையும் சமநிலைப்படுத்துகிறது.
- issue: περὶ என்பதன் ‘பற்றி’/‘ஆக’ நுணுக்கம்
  choice: முதன்மை உரையில் ‘அவர்களுக்காக’
  alternative: ‘அவர்களைப்பற்றி’
  rationale: பிதாவிடம் செய்யப்படும் வேண்டுதலில் பரிந்துபேசும் பொருள் சூழலுக்கு மிக இயல்பானது; எனினும் கிரேக்க முன்னிடைச்சொல்லின் ‘குறித்து’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘உலகம்’ என்பதன் எல்லை
  choice: எந்த விளக்கக் குறுக்கீடும் இன்றி ‘உலகம்’ என்று வைக்கப்பட்டது
  alternative: ‘மனிதகுலம்’ அல்லது ‘நம்பாத உலக அமைப்பு’
  rationale: யோவானிய κόσμος பல நுணுக்கங்களைக் கொண்டது. ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்புக்குள் கொண்டுவராமல் மூலத்தின் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதை ஒருமை (‘நீர்’, ‘உம்முடையவர்கள்’) கொண்டு பிதாவை நோக்கிய உரை அமைக்கப்பட்டது. ‘வேண்டிக்கொள்கிறேன்’ என்பது சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையையும் மூலத்தின் விண்ணப்பத் தன்மையையும் இணைக்கிறது. தேவையற்ற மீளுரையைத் தவிர்க்க இரண்டாம் வாக்கியத்தின் எதிர்மறை/நேர்மறை இணைப்பில் வினை இயல்பாகப் பகிரப்பட்டுள்ளது.
