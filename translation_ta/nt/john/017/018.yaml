source:
  edition: SBLGNT
  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: ta
  text: நீர் என்னை உலகத்திற்குள் அனுப்பியதுபோல, நானும் அவர்களை உலகத்திற்குள் அனுப்பினேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: அனுப்பியதுபோல
  rationale: தந்தை இயேசுவை அனுப்பியதற்கும் இயேசு சீடர்களை அனுப்பியதற்கும் இடையிலான ஒப்புமையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐμὲ
  choice: என்னை
  rationale: ἀπέστειλας என்பதன் நேரடிச் செயப்படுபொருள்; கிரேக்கத்தின் வலியுறுத்தலை மிகைப்படுத்தாமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: ἀπέστειλας / ἀπέστειλα
  choice: அனுப்பியீர் / அனுப்பினேன்
  rationale: இரு வினைகளுக்கும் ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்துவது மூலத்தின் திட்டமிட்ட இணை அமைப்பையும் யோவானின் பணி சார்ந்த மொழியையும் காக்கிறது.
- source_word: εἰς τὸν κόσμον
  choice: உலகத்திற்குள்
  rationale: εἰς குறிக்கும் உள்ள்நோக்கிய இயக்கத்தையும் κόσμος என்ற யோவானிய முக்கியச் சொல்லின் இடவியல் மற்றும் இறையியல் ஒலிநயங்களையும் காக்கிறது.
- source_word: κἀγὼ
  choice: நானும்
  rationale: καὶ ἐγώ என்பதன் சேர்க்கைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; முதல் கூறுடனான இணைப்பையும் பேணுகிறது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: சூழலில் சீடர்களைக் குறிக்கிறது; மரியாதையும் இயல்பும் கொண்ட நவீனத் தமிழ்ச் சுட்டுப்பெயர்.
theological_decisions:
- issue: தந்தை மகனை அனுப்பியதற்கும் மகன் சீடர்களை அனுப்பியதற்கும் உள்ள பணி ஒப்புமை
  choice: இரு கூறுகளிலும் ‘அனுப்பு’ என்ற ஒரே வினையைப் பேணுதல்
  alternative: முதல் கூறில் ‘அனுப்புதல்’, இரண்டாவது கூறில் ‘பணியமர்த்துதல்’ அல்லது ‘அனுப்பிவைத்தல்’
  rationale: வசனம் நிலை அல்லது இயல்பில் முழு ஒற்றுமையை அல்ல, அனுப்புதலின் ஒப்புமையை வலியுறுத்துகிறது. ஒரே வினை மூலத்தின் இணை அமைப்பைக் காக்கிறது; அதேவேளையில் சீடர்களின் பணி மகனின் தனித்துவமான பணிக்கு எல்லா வகையிலும் சமம் என்று சேர்த்துரைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ஜெபத்தில் தந்தையை நோக்கிப் பேசுவதால் ‘நீர்’ மற்றும் அதற்கேற்ற ‘அனுப்பியீர்’ பயன்படுத்தப்பட்டுள்ளன. ‘உலகத்திற்குள்’ இருமுறை கூறப்பட்டு மூலத்தின் மீளுரையும் இணை அமைப்பும் பேணப்பட்டுள்ளன.
