  terminology: ‘அனுப்பியதுபோல … அனுப்பினேன்’ என ஒரே வினையைத் தொடர்ந்து பயன்படுத்துவது யோவானின் அனுப்புதல்/பணி மொழியைப் பாதுகாக்கிறது. ‘உலகம்’ κόσμος என்பதற்கான நிலையான, இறையியல் மேலதிக விளக்கமின்றிய பொருத்தமான இணைச்சொல். சீடர்களைக் குறிக்கும் ‘அவர்களை’ இயல்பான மரியாதைச் சுட்டுப்பெயராக உள்ளது.
