  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: ta
  text: அவர்கள் உலகத்தைச் சேர்ந்தவர்கள் அல்ல; நான் உலகத்தைச் சேர்ந்தவன் அல்லாததுபோல[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உலகத்திலிருந்து வந்தவர்கள் அல்ல.’ கிரேக்கச் சொற்றொடரில் உள்ள ἐκ என்பது மூலம், தோற்றம், அல்லது சார்ந்திருத்தல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: உலகத்திலிருந்து வந்தவர்கள்
  rationale: ἐκ என்பது மூலத்தையும் தோற்றத்தையும் சார்பையும் குறிக்கக்கூடும். தமிழில் வெறும் ‘உலகத்திலிருந்து அல்ல’ என்பது இயல்பற்றதாக இருப்பதால், ‘வந்தவர்கள்’ என்பதைச் சேர்ப்பது மூலத்திலிருந்து வருதல் என்ற கருத்தை இயல்பாக வெளிப்படுத்துகிறது; உடல்ரீதியாக உலகத்தைவிட்டு வெளியே இருப்பதாகப் பொருள் கொள்ளப்படுவதையும் தவிர்க்கிறது.
- source_word: κόσμου
  choice: உலகம்
  rationale: யோவானின் பயன்பாட்டில் κόσμος கடவுளுக்கு அந்நியமான மனித உலகைக் குறிக்கும் நுண்பொருளைக் கொண்டிருக்கலாம். எனினும், விளக்க விரிவாக்கமின்றி ‘உலகம்’ என்று வைத்திருப்பது மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- source_word: οὐκ εἰσὶν
  choice: அவர்கள் ... வந்தவர்கள் அல்ல
  rationale: எதிர்மறை நிகழ்காலக் கூற்றை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: καθὼς
  choice: அல்லாததுபோல
  rationale: சீடர்களுக்கும் இயேசுவுக்கும் இடையிலான ஒப்புமையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἐγὼ
  choice: நான்
  rationale: ஒப்புமையில் உள்ள வெளிப்படையான முதலாம் நபர் சுட்டுப்பெயரைத் தக்கவைக்கிறது.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου
  choice: நான் உலகத்திலிருந்து வந்தவன் அல்ல
  rationale: முதல் நபர் ஒருமையையும் எதிர்மறைக் கூற்றையும் காத்து, ἐκ-இன் மூலம் அல்லது தோற்ற நுண்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோவானின் இறையியலில் ‘உலகம்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் விளக்க விரிவாக்கமின்றி ‘உலகம்’ என்று தக்கவைத்தல்
  alternative: ‘உலக அமைப்பு’ அல்லது ‘வீழ்ச்சியடைந்த இக்கால ஒழுங்கு’
  rationale: இந்த வசனம் κόσμος என்பதன் பொருளை ஒரு குறிப்பிட்ட இறையியல் விளக்கத்துக்குள் மட்டுப்படுத்தவில்லை. எளிய சொல்லைத் தக்கவைப்பது யோவானிய பல்நுண்பொருளையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
- issue: ἐκ என்பதில் தோற்றமா சார்பா
  choice: முதன்மை உரையில் ‘உலகத்திலிருந்து வந்தவர்கள் அல்ல’; அடிக்குறிப்பில் சார்பு என்ற மாற்று நுண்பொருளைக் குறிப்பிடுதல்
  alternative: ‘உலகத்தைச் சேர்ந்தவர்கள் அல்ல’
  rationale: ἐκ நேரடியாக மூலம் அல்லது தோற்றத்தைக் குறித்தாலும், இச்சூழலில் சார்பையும் அடையாளத்தையும் உணர்த்தக்கூடும். முதன்மை உரை மூலச்சொல்லின் உருவகத்தை காக்கிறது; அடிக்குறிப்பு உண்மையான பொருள் விரிவை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. கிரேக்கத்தின் ஒப்புமை மற்றும் மீளுரைப்பைத் தக்கவைத்து, ‘உலகம்’ என்பதற்கு விளக்கச் சொற்களை முதன்மை உரையில் சேர்க்கவில்லை.
