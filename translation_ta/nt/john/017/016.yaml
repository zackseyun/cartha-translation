revisions:
- from: நான் உலகத்திலிருந்து வந்தவன் அல்லாததுபோல, அவர்களும் உலகத்திலிருந்து வந்தவர்கள் அல்ல[a].
  to: அவர்கள் உலகத்தைச் சேர்ந்தவர்கள் அல்ல; நான் உலகத்தைச் சேர்ந்தவன் அல்லாததுபோல[a].
  rationale: The revision uses ‘உலகத்தைச் சேர்ந்தவர்கள் அல்ல’ for both clauses to express the contextual force of ἐκ τοῦ κόσμου naturally and without implying that the disciples were not literally born in the world. It preserves the repeated phrase and comparison, while the footnote supplies the more literal source/origin-oriented alternative and notes the Greek ambiguity.
