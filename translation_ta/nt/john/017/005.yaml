source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: ta
  text: இப்போது, தந்தையே, உலகம் இருப்பதற்கு முன்பு[b] உம்முடன் எனக்கு இருந்த மகிமையோடு, உமது முன்னிலையில்[a] என்னை மகிமைப்படுத்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உம்மிடத்தில்’ அல்லது ‘உமக்கு அருகில்’; கிரேக்கச் சொற்றொடர் பிதாவுடனான அருகாமையை இன்னும் நேரடியாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உலகம் உண்டாவதற்கு முன்பு’ அல்லது ‘உலகம் தோன்றுவதற்கு முன்பு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: மகிமைப்படுத்துங்கள்
  rationale: யோவான் நற்செய்தியில் திரும்பத் திரும்ப வரும் ‘மகிமை/மகிமைப்படுத்துதல்’ என்ற சொற்தொடர்பைப் பாதுகாக்கிறது; ‘கனப்படுத்துங்கள்’ என்பதைவிட மூலத்தின் இறையியல் செறிவை நன்கு தக்கவைக்கிறது.
- source_word: παρὰ σεαυτῷ
  choice: உமது முன்னிலையில்
  rationale: παρά + தத்திவேற்றுமை அருகாமை அல்லது ஒருவருடைய முன்னிலையைக் குறிக்கலாம். இயல்பான நவீன தமிழில் அந்த உறவு மற்றும் இடநெருக்கத்தின் பொருளை இது தெரிவிக்கிறது.
- source_word: τῇ δόξῃ
  choice: மகிமையால்
  rationale: குறிப்பிடப்பட்ட மகிமையோடு அல்லது அதன் மூலம் மகிமைப்படுத்தப்பட வேண்டும் என்ற தத்திவேற்றுமையின் தொடர்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ᾗ εἶχον
  choice: எனக்கு இருந்த
  rationale: முன்னர் இயேசுவுக்கு உரியதாக இருந்த மகிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: உலகம் இருப்பதற்கு முன்பு
  rationale: இவ்வினையெச்சக் கட்டமைப்பு முந்திய காலத்தைச் சுட்டுகிறது. ‘இருப்பதற்கு முன்பு’ என்பது εἶναι என்பதன் இருப்பு சார்ந்த பொதுப் பொருளைப் பாதுகாக்கிறது; உலகம் எவ்வாறு தோன்றியது என்பதை மொழிபெயர்ப்பிலேயே மேலதிகமாக விளக்குவதில்லை.
- source_word: παρὰ σοί
  choice: உம்முடன்
  rationale: பிதாவுடனான அருகாமையையும் உறவையும் இயல்பாகக் காட்டுகிறது; முதல் παρά சொற்றொடருடன் கருத்து இணைப்பையும் தக்கவைக்கிறது.
- source_word: σύ, πάτερ
  choice: தந்தையே
  rationale: நேரடி அழைப்பைத் தெளிவாகவும் மரியாதையுடனும் தருகிறது. கிரேக்கத்தின் வலியுறுத்தப்பட்ட σύ என்பதற்காக தமிழில் இயற்கையற்ற கூடுதல் பிரதிப்பெயர் சேர்க்கப்படவில்லை.
- source_word: κόσμον
  choice: உலகம்
  rationale: யோவானில் κόσμος என்பதற்கான வழக்கமான, சூழலுக்கேற்ற தமிழ் இணைச்சொல்.
theological_decisions:
- issue: இந்த வசனத்தில் மகனின் முன்இருப்பு
  choice: உலகம் இருப்பதற்கு முன்பே இயேசு பிதாவுடன் கொண்டிருந்த மகிமையை நேரடியாகக் குறிப்பிடுதல்
  alternative: இந்த மகிமையை முன்குறிக்கப்பட்ட அல்லது எதிர்பார்க்கப்பட்ட மகிமையாக மட்டும் விளக்குதல்
  rationale: மூல கிரேக்கம் உலகின் இருப்புக்கு முந்திய காலத்தையும் அப்போது இயேசுவுக்கு பிதாவுடன் இருந்த மகிமையையும் நேரடியாக இணைக்கிறது. மொழிபெயர்ப்பு இதை மெலிதாக்காமலும் விரிவான கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் தருகிறது.
- issue: பிதாவுடன் பகிரப்பட்ட ‘மகிமை’யின் இயல்பு
  choice: ‘மகிமை’ என்ற சொல்லையே விளக்க விரிவாக்கமின்றித் தக்கவைத்தல்
  alternative: மாட்சிமை அல்லது கனம் என்று குறுகலாக விளக்குதல்
  rationale: இந்த இடத்தில் அந்த மகிமையின் இயல்பை வசனம் மேலும் வரையறுப்பதில்லை. ‘மகிமை’ என்பது யோவானின் சொற்தொடரையும் உள்ளார்ந்த இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான ஜெப நடையைப் பயன்படுத்துகிறது. ‘உம்முடன்/உமது’ என்பவை தந்தையிடம் உரையாடும் கண்ணியத்தைப் பேணுகின்றன; ‘மகிமை’ என்ற யோவானியச் சொல் நிலைநிறுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்புக் குறிகளும் அவை விளக்கும் சொற்றொடர்களின் அருகே முதன்மை உரையில் இடப்பட்டுள்ளன.
