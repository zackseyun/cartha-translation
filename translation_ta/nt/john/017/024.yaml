source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: ta
  text: தந்தையே,[a] அவர்கள் உலகம் படைக்கப்படுவதற்கு முன்பே நீர் என்னை நேசித்ததால் எனக்குத் தந்த என் மகிமையைக் காணும்படியாக, நீர் எனக்குத் தந்தவர்களும் நான் இருக்கும் இடத்திலேயே என்னோடு இருக்க வேண்டும் என்று விரும்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீர் எனக்குத் தந்தவர்கள்” என்பதற்கான கிரேக்கச் சொற்றொடர் சொல்லுக்குச் சொல் “நீர் எனக்குத் தந்தது” என்று உள்ளது; ஆனால் அது தந்தை மகனுக்குத் தந்த மக்களைத் தொகுப்பாகக் குறிக்கிறது. தொடர்ந்து வரும் கிரேக்கச் சொற்களும் பன்மையில் உள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: தந்தையே
  rationale: கடவுளை நேரடியாக விளிக்கும் சொல்லாக, மூலத்தில் இல்லாத ‘என்’ என்ற உடைமைச்சொல்லைச் சேர்க்காமல் இயல்பாகவும் மரியாதையாகவும் தருகிறது.
- source_word: ὃ δέδωκάς μοι
  choice: நீர் எனக்குத் தந்தவர்கள்
  rationale: ὃ என்பது இலக்கணப்படி நடுநிலை ஒருமையாக இருந்தாலும், தொடர்ந்து வரும் κἀκεῖνοι, ὦσιν ஆகிய பன்மை வடிவங்கள் அது தந்தையால் மகனுக்குக் கொடுக்கப்பட்ட மக்களைத் தொகுப்பாகக் குறிக்கிறது என்பதைக் காட்டுகின்றன.
- source_word: θέλω
  choice: விரும்புகிறேன்
  rationale: செபத்தின் சூழலில் வலுவான விருப்பத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; அதை கட்டளையாகவோ வெறும் எதிர்காலக் கூற்றாகவோ மாற்றவில்லை.
- source_word: ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: நான் எங்கே இருக்கிறேனோ அங்கே என்னோடு இருக்க வேண்டும்
  rationale: இயேசு இருக்கும் இடத்தில் அவர்களும் அவருடன் இருக்க வேண்டும் என்ற பொருளையும் κἀκεῖνοι-இன் சேர்க்கை வலியுறுத்தலையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: θεωρῶσιν
  choice: காண வேண்டும்
  rationale: பார்த்தல் அல்லது உற்றுநோக்குதல் என்ற பொருளை இங்கு தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὴν δόξαν τὴν ἐμὴν ἣν δέδωκάς μοι
  choice: நீர் எனக்குத் தந்த என் மகிமையை
  rationale: மகிமை மகனுடையது என்பதையும் தந்தை அதை அவருக்குத் தந்தார் என்பதையும் இரண்டையும் சுருக்கமின்றிப் பாதுகாக்கிறது.
- source_word: ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου
  choice: உலகம் படைக்கப்படுவதற்கு முன்பே நீர் என்னை நேசித்ததால்
  rationale: ὅτι-யின் காரணப் பொருளையும், படைப்புக்கு முந்திய காலக் குறிப்பையும் தெளிவாகப் பாதுகாக்கிறது; καταβολῆς κόσμου என்ற மரபுத்தொடரை நவீனத் தமிழில் புரியும்படி வழங்குகிறது.
theological_decisions:
- issue: உலகம் உருவாக்கப்படுவதற்கு முன்பே மகன் தந்தையின் அன்புக்குரியவராக இருந்தார் என்ற காலத்துக்கு முந்திய குறிப்பு
  choice: “உலகம் படைக்கப்படுவதற்கு முன்பே நீர் என்னை நேசித்ததால்” என்று நேரடியான காலக் கூற்றாகப் பாதுகாக்கப்பட்டது.
  alternative: இந்தக் குறிப்பை உருவகமாக்கும் அல்லது அதன் காலப் பொருளைத் தளர்த்தும் விளக்க மொழிபெயர்ப்பு
  rationale: கிரேக்க உரை படைப்புக்கு முந்திய தந்தையின் அன்பை நேரடியாகக் கூறுகிறது; கூடுதல் கோட்பாட்டு விளக்கமின்றி அந்தக் கூற்றையே மொழிபெயர்ப்பு தக்கவைக்கிறது.
- issue: செபத்தில் θέλω என்பதன் வலிமை
  choice: “விரும்புகிறேன்”
  alternative: “சித்தங்கொள்கிறேன்” அல்லது கட்டளைத் தொனியுடைய மொழிபெயர்ப்பு
  rationale: இது இயேசுவின் உண்மையான விருப்பத்தைத் தக்கவைத்தபடியே, செபத்தின் வேண்டுதல் சார்ந்த சூழலில் இல்லாத கட்டளை அல்லது தீர்ப்புத் தொனியைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமையான “நீர்” வடிவம் முழுவதும் பயன்படுத்தப்பட்டுள்ளது. நடை கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமானது; கிரேக்கத்தின் கூட்டுப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
