revisions:
- from: தந்தையே,[a] நீர் எனக்குத் தந்தவர்கள் நான் எங்கே இருக்கிறேனோ அங்கே என்னோடு இருக்க வேண்டும் என்று விரும்புகிறேன். உலகம் படைக்கப்படுவதற்கு முன்பே நீர் என்னை நேசித்ததால், நீர் எனக்குத் தந்த என் மகிமையை அவர்கள் காண வேண்டும்.
  to: தந்தையே,[a] அவர்கள் உலகம் படைக்கப்படுவதற்கு முன்பே நீர் என்னை நேசித்ததால் எனக்குத் தந்த என் மகிமையைக் காணும்படியாக, நீர் எனக்குத் தந்தவர்களும் நான் இருக்கும் இடத்திலேயே என்னோடு இருக்க வேண்டும் என்று விரும்புகிறேன்.
