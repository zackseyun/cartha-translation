  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: ta
  text: இப்போது அவர்கள், நீர் எனக்குக் கொடுத்தவை அனைத்தும் உம்மிடமிருந்து வந்தவை என்பதை அறிந்திருக்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν
  choice: இப்போது
  rationale: சீடர்களின் புரிதல் தற்போது எட்டியுள்ள நிலையைக் குறிக்கும் கால வினையடை.
- source_word: ἔγνωκαν
  choice: அறிந்திருக்கிறார்கள்
  rationale: γινώσκω என்பதன் நிறைவுக்கால வடிவம், முன்பு அறிந்துகொண்டதன் விளைவாக இப்போது நிலைத்திருக்கும் அறிவைக் குறிக்கிறது.
- source_word: πάντα ὅσα
  choice: அனைத்தும்
  rationale: முழுமையையும் உள்ளடக்கும் கிரேக்கச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தொடர்பு நுணுக்கம் ‘நீர் எனக்குக் கொடுத்த’ என்ற தொடரால் வெளிப்படுகிறது.
- source_word: δέδωκάς μοι
  choice: நீர் எனக்குக் கொடுத்த
  rationale: நிறைவுக்காலத்தின் தொடரும் முக்கியத்துவத்தைத் தமிழில் இயல்பாகச் சொல்லும் வடிவம்; μοι என்பது ‘எனக்கு’ என மறைமுகச் செயப்படுபொருளாக வழங்கப்பட்டுள்ளது.
- source_word: παρὰ σοῦ
  choice: உம்மிடமிருந்து
  rationale: παρά + பிறப்புவேற்றுமை இங்கு மூலம் அல்லது தோற்றத்தைக் குறிக்கிறது.
- source_word: εἰσιν
  choice: வந்தவை
  rationale: தமிழில் ‘உம்மிடமிருந்து உள்ளவை’ என்பது இயல்பற்றதால், மூலத்தைக் குறிக்கும் உறவை ‘வந்தவை’ என இயல்பாக வெளிப்படுத்துகிறது; இது இயக்க நிகழ்வை வலியுறுத்துவதல்ல.
theological_decisions:
- issue: பிதா மகனுக்குக் கொடுத்தவற்றுக்கும் அவற்றின் மூலத்துக்கும் உள்ள உறவு
  choice: ‘நீர் எனக்குக் கொடுத்த அனைத்தும் உம்மிடமிருந்து வந்தவை’ என்று மூலத்தைச் சுட்டும் கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நீர் எனக்குக் கொடுத்த அனைத்தும் உம்மிடமிருந்து வருகின்றன.’
  rationale: மகன் பெற்ற அனைத்திற்கும் பிதாவே மூலம் என்ற உரையின் கூற்றைத் தக்கவைக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இயேசு பிதாவை நோக்கிப் பேசுவதால் ‘நீர்/உம்மிடமிருந்து’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. நிறைவுக்காலத்தின் விளைவு நிலையை ‘அறிந்திருக்கிறார்கள்’ தக்கவைக்கிறது.
