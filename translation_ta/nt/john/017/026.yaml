source:
  edition: SBLGNT
  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: ta
  text: நீர் என்னை நேசித்த அன்பு அவர்களுக்குள் இருக்கவும், நானும் அவர்களுக்குள் இருக்கவும், உமது பெயரை[a] அவர்களுக்குத் தெரியப்படுத்தினேன்[b]; தெரியப்படுத்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘உமது பெயர்’ என்பது வெறும் அழைப்புப் பெயரை மட்டுமல்ல, தேவனின் வெளிப்படுத்தப்பட்ட அடையாளத்தையும் பண்பையும் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அவர்களுக்கு வெளிப்படுத்தினேன்; வெளிப்படுத்துவேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα / γνωρίσω
  choice: தெரியப்படுத்தினேன் / இனியும் தெரியப்படுத்துவேன்
  rationale: γνωρίζω என்பதன் ஒருவருக்கு ஒன்றை அறியச் செய்யும் பொருளையும், இறந்தகால–எதிர்கால இணை அமைப்பையும் இயல்பான தமிழில் காக்கிறது. ‘வெளிப்படுத்தினேன்’ என்பதும் சாத்தியம்; ஆனால் அது சற்று அதிக விளக்கப் பொருளைச் சேர்க்கலாம்.
- source_word: τὸ ὄνομά σου
  choice: உமது பெயரை
  rationale: ‘பெயர்’ என்ற மூல உருவகத்தை அப்படியே வைத்திருக்கிறது; ‘உமது தன்மை’ அல்லது ‘நீர் யார் என்பதை’ என்று உரைக்குள் விளக்கி மொழிபெயர்க்கவில்லை.
- source_word: ἵνα
  choice: இருப்பதற்காகவும் … இருப்பதற்காகவும்
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் ἵνα உட்கூற்றை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இரண்டு இணையான கூறுகளையும் ஒரே இலக்கண அமைப்பில் வைத்திருக்கிறது.
- source_word: ἡ ἀγάπη ἣν ἠγάπησάς με
  choice: நீர் என்னை நேசித்த அன்பு
  rationale: தந்தை மகனை நேசித்த அன்பைக் குறிக்கும் தொடர்பு வாக்கியத்தைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἐν αὐτοῖς
  choice: அவர்களுக்குள்
  rationale: ἐν என்பதன் நேரடியான உட்பொருளையும் யோவான் நற்செய்தியின் உள்ளுறைதல் கருத்தொலியையும் காக்கிறது; ‘அவர்களிடையே’ என்பதும் சூழல்படி சாத்தியம்.
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: நானும் அவர்களுக்குள் இருப்பதற்காகவும்
  rationale: கிரேக்கத்தில் இரண்டாம் கூறில் வினைச்சொல் விடுபட்டிருந்தாலும் தமிழில் தெளிவுக்காக ‘இருப்பதற்காகவும்’ மீண்டும் வழங்கப்பட்டுள்ளது; இரண்டு கூறுகளின் இணைநிலையும் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘உமது பெயர்’ என்பதன் யோவானியப் பொருள்
  choice: முதன்மை உரையில் ‘உமது பெயர்’ என்று அப்படியே வைத்தல்
  alternative: ‘உமது தன்மை’ அல்லது ‘நீர் யார் என்பதை’ என்று விரித்துரைத்தல்
  rationale: இது தேவனுடைய வெளிப்படுத்தப்பட்ட அடையாளத்தையும் பண்பையும் குறிக்கலாம்; எனினும் மூல உரையின் ‘பெயர்’ என்ற செறிவான உருவகத்தை மொழிபெயர்ப்பிலேயே தீர்த்து விடாமல் காக்கிறது.
- issue: தெய்வீக அன்புக்கும் கிறிஸ்துவின் உள்ளுறைதலுக்கும் உள்ள தொடர்பு
  choice: அன்பு அவர்களுக்குள் இருப்பதும் இயேசு அவர்களுக்குள் இருப்பதும் இணையான இரண்டு நோக்கங்களாக வழங்கப்படுகின்றன
  alternative: ஒன்று மற்றொன்றுக்குக் காரணம் என்று வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்கம் இரண்டையும் ஒருங்கிணைத்து வைக்கிறது; அவற்றுக்கிடையிலான இறையியல் தொடர்பை மேலும் விளக்கி அல்லது காரணப்படுத்தி தீர்மானிப்பதில்லை.
- issue: ἵνα உட்கூற்றின் நோக்கம்/விளைவு நிழல்
  choice: ‘இருப்பதற்காக’ என்று நோக்குச் சார்பாக மொழிபெயர்த்தல்
  alternative: ‘அதனால் … இருக்கும்’ என்று விளைவுச் சார்பாக மொழிபெயர்த்தல்
  rationale: இங்கு இயேசுவின் தெரியப்படுத்தும் செயலைத் தொடர்ந்து வரும் இலக்கைத் தெளிவாகக் காட்டுகிறது; அதேவேளை அந்த இலக்கு நிறைவேறும் விளைவு என்ற நிழலையும் முற்றிலும் நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவமான ‘உமது/நீர்’ பயன்படுத்தப்பட்டுள்ளது. ‘இவ்வாறு செய்கிறேன்’ என்பது கடந்தகாலத்தில் செய்ததும் எதிர்காலத்தில் தொடரப்போவதும் சேர்ந்த செயற்பாட்டைத் தமிழில் இணைக்கும் வகையில் பயன்படுத்தப்பட்டுள்ளது.
