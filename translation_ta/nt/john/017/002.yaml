  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: ta
  text: நீர் அவருக்கு எல்லா மனிதர்கள்மீதும் அதிகாரம் கொடுத்ததுபோல, நீர் அவருக்குக் கொடுத்துள்ள அனைவருக்கும் அவர் நித்திய வாழ்வைக் கொடுக்கும்படி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: கொடுத்தபடியே
  rationale: முந்தைய வசனத்தில் உள்ள வேண்டுகோளுக்கும் பிதா மகனுக்குக் கொடுத்த அதிகாரத்திற்கும் இடையிலான ஒப்புமை மற்றும் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἔδωκας
  choice: கொடுத்த
  rationale: இறந்தகாலத்தில் பிதா மகனுக்கு அதிகாரம் அளித்த செயலை எளிய இறந்தகால உணர்வுடன் தருகிறது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: வெறும் வல்லமையை அல்லாமல், அளிக்கப்பட்ட உரிமையையும் ஆளுகையையும் குறிக்கிறது.
- source_word: πάσης σαρκός
  choice: மனிதர்கள் அனைவர்மீதும்
  rationale: ‘எல்லா மாம்சமும்’ என்ற கிரேக்க வேதாகம மரபுத்தொடரின் மனிதகுலத்தைக் குறிக்கும் பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἵνα
  choice: கொடுக்கும்படியாக
  rationale: மகனுக்குக் கொடுக்கப்பட்ட அதிகாரத்தின் நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: πᾶν ὃ
  choice: அனைவருக்கும்
  rationale: கிரேக்கத்தில் நடுநிலை ஒருமைத் தொகுப்புச் சொற்றொடராக இருந்தாலும், பிதா மகனுக்குக் கொடுத்த மக்களையே இங்கு குறிக்கிறது; தமிழில் மனிதர்களைக் குறிக்கும் பன்மை வடிவம் இயல்பானது.
- source_word: δέδωκας
  choice: கொடுத்துள்ள
  rationale: முடிவுற்றும் தொடர்ந்து பொருந்தும் செயலைக் கிரேக்க நிறைவுக்காலத்திற்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: δώσῃ
  choice: கொடுக்கும்படியாக
  rationale: ἵνα என்பதுடன் வரும் நோக்கத்தைக் காட்டி, உறுதியைத் தேவையின்றி குறைக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: யோவான் நூலின் கருத்தில் முடிவில்லாத வாழ்வையும் வரவிருக்கும் காலத்திற்குரிய வாழ்வையும் உள்ளடக்கும் மரியாதையான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொற்றொடர்.
theological_decisions:
- issue: ‘மனிதர்கள் அனைவரும்’ என்பதன் பரப்பும், பிதா மகனுக்குக் கொடுத்தவர்கள் என்பதன் குறிப்பிட்ட குழுவும்
  choice: மகனின் அதிகாரம் மனிதர்கள் அனைவர்மீதும் இருப்பதையும், நித்திய வாழ்வு பிதா அவருக்குக் கொடுத்துள்ள அனைவருக்கும் கொடுக்கப்படுவதையும் தனித்தனியே தக்கவைத்தல்.
  alternative: இரண்டு சொற்றொடர்களையும் ஒரே பரப்பைக் குறிப்பதாக மாற்றுதல் அல்லது ஒரு குறிப்பிட்ட இறையியல் அமைப்புக்கு ஏற்றவாறு அவற்றின் பரப்பை விரிவாக்குதல்/குறுக்குதல்.
  rationale: கிரேக்க உரை உலகளாவிய அதிகாரத்தையும் பிதா மகனுக்குக் கொடுத்தவர்களுக்கு வாழ்வு கொடுப்பதையும் அருகருகே வைக்கிறது. அந்த இறையியல் இழுவிசையைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடையைப் பயன்படுத்துகிறது. பிதாவை நோக்கி ‘நீர்’ என்றும் மகனை ‘அவர்’ என்றும் குறிப்பிடுகிறது. வசனம் 1-இன் தொடர்ச்சியான ஒப்புமை-நோக்க அமைப்பைத் தக்கவைத்தபோதும், தமிழில் முழுமையான வாக்கியமாக ஒலிக்க இறுதியில் ‘செய்தீர்’ சேர்க்கப்பட்டுள்ளது.
