  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: ta
  text: உலகத்திலிருந்து நீர் எனக்குக் கொடுத்த மனிதர்களுக்கு உமது பெயரை வெளிப்படுத்தினேன்[a][b][c]. அவர்கள் உம்முடையவர்களாக இருந்தார்கள்; அவர்களை எனக்குக் கொடுத்தீர். அவர்கள் உமது வார்த்தையைக் கடைப்பிடித்திருக்கிறார்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உமது பெயரைத் தெரியப்படுத்தினேன்.”'
    reason: lexical_alternative
  - marker: b
    text: “உமது பெயர்” என்பது வெறும் அழைப்புப் பெயரை மட்டுமல்லாமல், தேவன் வெளிப்படுத்திய தமது அடையாளத்தையும் குணத்தையும் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “மனிதர்கள்” என்பது பொதுவாக “மக்கள்” என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு உடனடியாகக் குறிக்கப்படுகிறவர்கள் இயேசுவின் சீடர்கள்.
    reason: lexical_alternative
  - marker: d
    text: இதை “உமது வார்த்தைக்குக் கீழ்ப்படிந்திருக்கிறார்கள்” என்றும் பொருள்படுத்தலாம்; கிரேக்கம் இன்னும் நேரடியாக “உமது வார்த்தையைக் காத்திருக்கிறார்கள்” என்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: வெளிப்படுத்தினேன்
  rationale: φανερόω என்பது மறைந்திருந்ததை வெளிப்படச் செய்தல் அல்லது அறியச் செய்தல் எனப் பொருள்படும். ‘வெளிப்படுத்தினேன்’ என்பது தமிழில் இயல்பாக இருந்து, வெளிப்பாட்டின் வலிமையையும் காக்கிறது.
- source_word: τὸ ὄνομα
  choice: உமது பெயரை
  rationale: யோவானின் சூழலில் ‘பெயர்’ என்பது தேவனின் வெளிப்படுத்தப்பட்ட அடையாளத்தையும் குணத்தையும் உள்ளடக்குகிறது. ஆயினும் மூலத்தின் நேரடியான உருவகத்தை விளக்கவுரையாக மாற்றாமல் காக்க ‘பெயர்’ பயன்படுத்தப்படுகிறது.
- source_word: τοῖς ἀνθρώποις
  choice: மனிதர்களுக்கு
  rationale: ἄνθρωποι பொதுவாக மனிதர்கள் அல்லது மக்கள் என்று பொருள்படலாம். உடனடிச் சூழலில் இயேசுவின் சீடர்களே குறிக்கப்படுகிறார்கள்; ‘மனிதர்கள்’ மூலச்சொல்லைத் தெளிவாகக் காக்கிறது, பாலினத்தைத் தேவையின்றி உரையில் சேர்ப்பதில்லை.
- source_word: ἐκ τοῦ κόσμου
  choice: உலகத்திலிருந்து
  rationale: ἐκ என்பது உலகின் நடுவிலிருந்து அவர்களைத் தந்ததைச் சுட்டுகிறது. ‘உலகத்திலிருந்து’ இந்த உறவை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: σοὶ ἦσαν
  choice: அவர்கள் உம்முடையவர்களாக இருந்தார்கள்
  rationale: கிரேக்கத்தின் சுருக்கமான உடைமைப் பொருளைத் தெளிவாகவும் மரியாதையான தமிழிலும் காக்கிறது.
- source_word: τὸν λόγον σου
  choice: உமது வார்த்தையை
  rationale: λόγος என்பதற்கு வார்த்தை, செய்தி, போதனை ஆகிய பொருள்கள் இருக்கலாம். ‘வார்த்தை’ யோவானின் சொற்பயன்பாட்டோடு தொடர்பைக் காத்து, பொருளை அளவுக்கு மீறிக் குறுக்குவதில்லை.
- source_word: τετήρηκαν
  choice: கடைப்பிடித்திருக்கிறார்கள்
  rationale: τηρέω என்பது காத்தல், பற்றிக்கொள்ளுதல், கடைப்பிடித்தல் ஆகிய பொருள்களை உடையது. நிறைவேற்றுக் காலத்தின் தொடரும் விளைவை ‘கடைப்பிடித்திருக்கிறார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
