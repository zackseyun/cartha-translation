source:
  edition: SBLGNT
  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: ta
  text: அவர்களும் உண்மையில் புனிதப்படுத்தப்பட்டவர்களாக இருக்கும்படியாகவே, அவர்களுக்காக நான் என்னையே புனிதப்படுத்துகிறேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்னையே புனித நோக்கத்திற்காக அர்ப்பணிக்கிறேன்’ என்றும் பொருள் கொள்ளலாம். இங்கேயும் வசனத்தின் பிற்பகுதியிலும் ஒரே கிரேக்க வேர்ச்சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: அவர்களுக்காக
  rationale: ὑπέρ + genitive இங்கு சீடர்களின் நன்மைக்காக அல்லது அவர்கள் சார்பாகச் செய்யப்படும் செயலைக் குறிக்கிறது. ‘அவர்களுக்காக’ என்பது மாற்றீட்டுப் பொருளைத் தேவையின்றி வலியுறுத்தாமல், தமிழில் இயல்பாக இந்த விரிவைத் தக்கவைக்கிறது.
- source_word: ἁγιάζω … ἡγιασμένοι
  choice: புனிதப்படுத்துகிறேன் … புனிதப்படுத்தப்பட்டவர்களாக
  rationale: ஒரே கிரேக்க வேர்ச்சொல் இரு இடங்களிலும் வருவதால், தமிழிலும் ஒரே சொல்லைத் திரும்பப் பயன்படுத்தி அதன் இணைப்பைப் பாதுகாக்கிறது. முதல் இடத்தில் இது தன்னைப் புனித நோக்கத்திற்காக அர்ப்பணித்து ஒதுக்கிவைப்பதைக் குறிக்கலாம்; ‘புனிதப்படுத்து’ அந்தப் பொருளை முழுவதுமாக முன்கூட்டியே தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: ἐμαυτόν
  choice: என்னையே
  rationale: தற்சுட்டுப் பெயர்ச்சொல்லையும் அதிலுள்ள வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: … இருக்கும்படி
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα-வின் ஆற்றலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: καὶ αὐτοὶ
  choice: அவர்களும்
  rationale: καί தரும் சேர்த்துக்கொள்ளும் வலியுறுத்தலை ‘-உம்’ தக்கவைக்கிறது; αὐτοί-யின் இயல்பான தமிழ் வெளிப்பாடும் இதுவே.
- source_word: ὦσιν … ἡγιασμένοι
  choice: புனிதப்படுத்தப்பட்டவர்களாக இருக்கும்படி
  rationale: முற்றுப்பெற்ற புனிதப்படுத்தும் செயலின் விளைவாகத் தொடரும் நிலையைக் காட்டும் perfect passive participle மற்றும் subjunctive வடிவங்களின் கூட்டு ஆற்றலைப் பாதுகாக்கிறது.
- source_word: ἐν ἀληθείᾳ
  choice: உண்மையில்
  rationale: ἐν என்பதை நிலை அல்லது வட்டாரத்தைக் குறிக்கும் விதத்தில் இயல்பாக மொழிபெயர்க்கிறது. கிரேக்கத்தில் definite article இல்லாததால் ‘அந்த உண்மை’ போன்ற கூடுதல் திட்டவட்டத்தைச் சேர்க்கவில்லை; கருவிப் பொருளான ‘உண்மையால்’ என்பதையும் முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: இயேசு தம்மைப் புனிதப்படுத்துவதன் பொருள்
  choice: ‘புனிதப்படுத்துகிறேன்’ என்ற மூலச்சொல் இணைப்பை முதன்மை உரையில் வைத்துக்கொண்டு, புனித நோக்கத்திற்காகத் தம்மை அர்ப்பணித்து ஒதுக்கிவைக்கும் பொருளை அடிக்குறிப்பில் தெரிவிப்பது
  alternative: ‘என்னை அர்ப்பணிக்கிறேன்’ என்று மட்டும் மொழிபெயர்த்து, இரு ἁγιάζω வடிவங்களுக்கிடையிலான சொல் இணைப்பை மறைப்பது
  rationale: சூழலில் இந்தச் செயல் சீடர்களுக்காகவும் அவர்களுடைய புனிதப்படுத்துதலை நோக்கியும் உள்ளது. அர்ப்பணிப்பு சார்ந்த பொருள் வலுவாக இருந்தாலும், மூலத்தின் மீளுரையையும் அதன் பொருள் நெருக்கடியையும் முதன்மை உரை தக்கவைக்க வேண்டும்.
- issue: ἐν ἀληθείᾳ என்பதன் ஆற்றல்
  choice: ‘உண்மையில்’—புனிதப்படுத்துதல் நிகழும் வட்டாரம் அல்லது நிலை
  alternative: ‘உண்மையால்’—உண்மையைச் செயலின் கருவியாகக் காணுதல்; அல்லது ‘உண்மைக்குள்’—வட்டாரப் பொருளை இன்னும் வெளிப்படையாக்குதல்
  rationale: ἐν பல தொடர்புகளை ஏற்கக்கூடும்; இங்கு வட்டாரப் பொருள் இயல்பானது. ஆயினும் 17:17-இன் நெருங்கிய சூழல் கருவிப் பொருளையும் ஒலிக்கச் செய்வதால், அதை மொழிபெயர்ப்பில் முற்றாக நிராகரிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘புனிதப்படுத்து’ சற்றே சமயச் சொலாக இருந்தாலும், கிரேக்கத்தின் முக்கியமான சொல் மீளுரையைப் பாதுகாப்பதற்காக இரு இடங்களிலும் வைத்திருக்கப்பட்டுள்ளது. கடைசியில் சேர்க்கப்பட்ட ‘இப்படிச் செய்கிறேன்’ என்பது நீண்ட நோக்கத் தொடரை தமிழில் தெளிவாக்குகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
