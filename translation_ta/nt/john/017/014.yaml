id: JHN.17.14
reference: John 17:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: ta
  text: நான் உமது வார்த்தையை அவர்களுக்குக் கொடுத்திருக்கிறேன். அவர்கள் உலகத்திலிருந்து வந்தவர்கள் அல்லாததால் உலகம் அவர்களை வெறுத்தது; நான் உலகத்திலிருந்து வந்தவன் அல்லாததுபோலவே அவர்களும் அப்படியே இருக்கிறார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உலகத்தைச் சேர்ந்தவர்கள் அல்ல.” கிரேக்கச் சொற்றொடர் சொற்படியாக “உலகத்திலிருந்து” என்று கூறுகிறது; அது மூலத்தையோ சேர்ந்திருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: கொடுத்திருக்கிறேன்
  rationale: கிரேக்க நிறைவுக்காலம், கொடுத்து முடிக்கப்பட்ட செயலும் அதன் தொடரும் விளைவும் இருப்பதைக் காட்டுகிறது; தமிழில் ‘கொடுத்திருக்கிறேன்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λόγον
  choice: வார்த்தையை
  rationale: இங்கு λόγος என்பது இயேசுவின் வழியாகத் தந்தை அறிவித்த வார்த்தையைக் குறிக்கிறது. ‘வார்த்தை’ யோவான் நூலின் சொல்லாட்சியையும் இறையியல் ஒலிநயத்தையும் காக்கிறது; ‘செய்தி’ என்பது சற்றுக் கூடுதல் விளக்கமாகிவிடும்.
- source_word: κόσμος
  choice: உலகம்
  rationale: யோவானில் κόσμος பரந்த பொருள் கொண்டது; இச்சூழலில் கடவுளுக்கு எதிராக நிற்கும் மனித ஒழுங்கையும் குறிக்கிறது. ‘உலகம்’ அந்தப் பரப்பைச் சுருக்காமல் காக்கிறது; அதன் பகைமை சூழலிலேயே தெளிவாகிறது.
- source_word: ἐμίσησεν
  choice: வெறுத்தது
  rationale: கிரேக்க இறந்தகால வினை வடிவை எளிய தமிழிறந்தகாலமாக மொழிபெயர்ப்பது இயல்பானது; உலகத்தின் பகைமையை நேரடியாகத் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: அதனால்
  rationale: 'ὅτι இங்கு காரணத்தைத் தருகிறது: சீடர்கள் உலகத்திலிருந்து வந்தவர்கள் அல்ல என்பதே உலகம் அவர்களை வெறுப்பதற்கான காரணம். தமிழ் வாக்கிய அமைப்பில் காரணத் துணைவாக்கியத்தைத் தொடர்ந்து ‘அதனால்’ பயன்படுத்துவது தெளிவாகவும் இயல்பாகவும் உள்ளது.'
- source_word: ἐκ τοῦ κόσμου
  choice: உலகத்திலிருந்து வந்தவர்கள் / வந்தவன்
  rationale: ἐκ என்பது மூலத்தையோ தோற்றத்தையோ, சூழலுக்கேற்ப சேர்ந்திருப்பதையோ குறிக்கலாம். ‘உலகத்திலிருந்து வந்தவர்கள் அல்ல’ என்பது மூலமொழியின் ‘இருந்து’ என்ற உருவகத்தை காத்து, அதை வெறும் சமூகச் சேர்ந்திருப்பாக மட்டும் குறுக்காமல் விடுகிறது.
- source_word: καθὼς
  choice: அல்லாததுபோல
  rationale: இயேசுவுக்கும் சீடர்களுக்கும் உலகத்துடனான உறவில் வைக்கப்படும் நேரடியான ஒப்புமையை இந்த வடிவம் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: சீடர்களுக்கும் இயேசுவுக்கும் ‘உலகத்துடன்’ உள்ள உறவின் ஒப்புமை
  choice: ‘நான் உலகத்திலிருந்து வந்தவன் அல்லாததுபோல, அவர்களும் உலகத்திலிருந்து வந்தவர்கள் அல்ல’ என்று ஒப்புமையை நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘நான் உலகத்தைச் சேர்ந்தவன் அல்லாததுபோல, அவர்களும் உலகத்தைச் சேர்ந்தவர்கள் அல்ல’
  rationale: மாற்று வடிவம் இயல்பான தமிழாக இருந்தாலும், ἐκ என்பதிலுள்ள மூலம் மற்றும் சேர்ந்திருத்தல் ஆகிய இரு சாத்தியங்களையும் ‘சேர்ந்தவர்கள்’ என்று மட்டும் தீர்மானித்துவிடும். தேர்ந்த வடிவம் யோவான் முன்வைக்கும் தோற்றம்/சேர்ந்திருத்தல் சார்ந்த இறையியல் பதற்றத்தை மிகையாக விளக்காமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘உமது’ என்பது ஜெபச் சூழலுக்கேற்ற மரியாதை ஒருமையைத் தருகிறது. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், காரணமும் ஒப்புமையும் அப்படியே காக்கப்பட்டுள்ளன.
