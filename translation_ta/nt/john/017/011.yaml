reference: John 17:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: ta
  text: இனி நான் உலகத்தில் இல்லை; ஆனால் இவர்களோ உலகத்தில் இருக்கிறார்கள்; நானும் உம்மிடம் வருகிறேன். பரிசுத்த தந்தையே, நீர் எனக்குத் தந்த உமது பெயரில்[a][b] இவர்களைக் காத்தருளும்; நாம் ஒன்றாய் இருப்பதுபோல இவர்களும் ஒன்றாய் இருக்கும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது பெயரால் இவர்களைக் காத்தருளும்’ அல்லது ‘உமது பெயரின் மூலம் இவர்களைப் பாதுகாத்தருளும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் தளம், வழிமுறை அல்லது அதிகாரத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகள், ‘நீர் எனக்குத் தந்த உமது பெயரில் இவர்களைக் காத்தருளும்’ என்ற பொருளைத் தருகின்றன; வேறு சில பிரதிகள், ‘நீர் எனக்குத் தந்தவர்களை உமது பெயரில் காத்தருளும்’ என்ற பொருளில் புரிந்துகொள்ளப்படுகின்றன. இம்மொழிபெயர்ப்பு SBLGNT வாசகத்தைப் பின்பற்றுகிறது; அதில் ‘நீர் எனக்குத் தந்த’ என்பது ‘பெயர்’ என்பதைக் குறிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: இனி … இல்லை
  rationale: பேசுபவரின் தற்போதைய நிலையிலிருந்து ஒரு நிலை முடிவுறுவதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: κόσμος
  choice: உலகம்
  rationale: சீடர்கள் தொடர்ந்து இருக்கும் மனித வாழ்வின் பூமிக்குரிய தளத்தைச் சுட்டும் யோவானிய சொல்லாட்சியை மேலதிக விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: நானும் உம்மிடம் வருகிறேன்
  rationale: நிகழ்கால வினையின் சூழல்சார்ந்த முன்னோக்கிய பொருளையும், ‘வருகிறேன்’ என்ற மூல வினையின் நோக்குநிலையையும் காக்கிறது.
- source_word: πάτερ ἅγιε
  choice: பரிசுத்த தந்தையே
  rationale: அழைப்புவேற்றுமையையும், தந்தை என்ற நெருக்கத்தையும், பரிசுத்தம் என்ற தனித்துவத்தையும் இயல்பான மரியாதை நடையில் தருகிறது.
- source_word: τήρησον
  choice: காத்தருளும்
  rationale: காத்தல், பாதுகாத்தல், நிலைநிறுத்துதல் ஆகிய பரந்த பொருள் வரம்பை வைத்துக்கொண்டு, வேண்டுதலுக்கேற்ற கண்ணியமான தமிழை வழங்குகிறது.
- source_word: ἐν τῷ ὀνόματί σου
  choice: உமது பெயரில்
  rationale: ἐν என்பதிலுள்ள தளம், வழி, அதிகாரம் ஆகிய சாத்தியங்களை ஒரே விளக்கமாகச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: ᾧ δέδωκάς μοι
  choice: நீர் எனக்குத் தந்த
  rationale: சொல் ஒத்திசைவின்படி தொடர்புப்பெயர் ‘பெயர்’ என்பதைக் குறிப்பதாக SBLGNT வாசகத்தைப் பின்பற்றுகிறது.
- source_word: ἵνα ὦσιν ἓν
  choice: இவர்களும் ஒன்றாய் இருக்கும்படி
  rationale: ἵνα-வின் நோக்கத்தையும், நபர்களை ஒரே நபராகக் கலக்காமல் ஒற்றுமையைக் குறிக்கும் ἓν என்பதையும் வெளிப்படுத்துகிறது.
- source_word: καθὼς ἡμεῖς
  choice: நாம் ஒன்றாய் இருப்பதுபோல
  rationale: தந்தை–மகன் ஒற்றுமைக்கும் சீடர்களின் ஒற்றுமைக்கும் இடையிலான ஒப்புமையை அதன் தன்மையை மேலதிகமாக வரையறுக்காமல் காக்கிறது.
theological_decisions:
- issue: ‘உமது பெயரில் காத்தல்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘உமது பெயரில் … காத்தருளும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உமது பெயரால் காத்தருளும்’ அல்லது ‘உமது பெயரின் மூலம் பாதுகாத்தருளும்’.
  rationale: இச்சொற்றொடர் தளம், வழிமுறை, அதிகாரம் அல்லது வெளிப்படுத்தப்பட்ட தன்மை ஆகியவற்றை உணர்த்தக்கூடும். ‘பெயரில்’ என்பது இந்த இறையியல் செறிவை ஒரு பொருளாக மட்டும் குறுக்காமல் வைக்கிறது.
- issue: ‘நாம் ஒன்றாய் இருப்பதுபோல இவர்களும் ஒன்றாய்’ என்ற ஒப்புமையின் வலிமை
  choice: ஒற்றுமைக்கான உண்மையான ஒப்புமை அப்படியே வைக்கப்பட்டது; அதன் மேற்தத்துவத் தன்மை மொழிபெயர்ப்பில் வரையறுக்கப்படவில்லை.
  alternative: வெறும் ஒத்துழைப்பாகக் குறைத்தல் அல்லது சீடர்களுக்கும் தந்தை–மகனுக்கும் ஒரேவகையான இருப்பியல் ஒன்றிப்பை நேரடியாகக் கூறுதல்.
  rationale: மூலவுரை வலுவான ஒப்புமையை முன்வைக்கிறது; ஆனால் ஒற்றுமையின் இயல்பை இவ்வசனத்திலேயே முழுமையாக விளக்கவில்லை. ஆகவே அதன் இறையியல் அழுத்தமும் திறந்த தன்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான ஜெப நடையைப் பேண ‘உம்மிடம்’, ‘உமது’, ‘காத்தருளும்’ பயன்படுத்தப்பட்டன. ‘இவர்களோ’ என்பது இயேசு தம்முடன் இருக்கும் சீடர்களைக் குறிப்பதையும், ‘ஆனால்’ என்பதுடன் உள்ள மாறுபாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
