- issue: யோவானில் κόσμος என்பதன் பொருள்
  choice: உலகம்
  alternative: உலக மக்கள் / கடவுளிடமிருந்து விலகிய மனித உலகம்
  rationale: மூலச்சொல்லின் பல அடுக்குகளையும் இறையியல் பதற்றத்தையும் பிரதான உரை பாதுகாக்கிறது; ஒரு குறிப்பிட்ட விளக்கத்துக்குள் அதை அடைக்கவில்லை.
- issue: γινώσκω வினைகளின் இறந்தகாலத் தோற்றம் மற்றும் நிகழ்காலப் பொருத்தம்
  choice: அறிந்துகொள்ளவில்லை / அறிந்திருக்கிறேன் / அறிந்திருக்கிறார்கள்
  alternative: அறியவில்லை / அறிந்தேன் / அறிந்தார்கள்
  rationale: கிரேக்கத்தில் மூன்றும் aorist வடிவங்கள். தமிழில் ஒரே காலவடிவத்தை இயந்திரமாகப் பின்பற்றாமல், ஜெபச் சூழலில் நீடிக்கும் உறவுசார் அறிவையும் நிகழ்காலப் பொருத்தத்தையும் பிரதான உரை வெளிப்படுத்துகிறது; நேரடியான இறந்தகால மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: முதல் καὶ-யின் உரையோட்டத் தொடர்பு
  choice: என்றாலும்
  alternative: மேலும் / மற்றும்
  rationale: சூழல் விட்டுக்கொடுப்பு-எதிர்மறை உறவை வலியுறுத்துகிறது. இருப்பினும் கிரேக்கத்தில் வெளிப்படையான விட்டுக்கொடுப்பு இணைப்புச்சொல் இல்லாததால், நேரடி இணைப்பு மாற்றாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான ஜெபநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் ‘உம்மை/நீர்/அனுப்பினீர்’ என்ற மரியாதை ஒருமை ஒரே சீராகப் பின்பற்றப்பட்டுள்ளது. மிகப் பழமையான ‘ஓ’ போன்ற அழைப்பிடைச்சொற்களும் தேவையற்ற விளக்க விரிவாக்கங்களும் தவிர்க்கப்பட்டுள்ளன.
