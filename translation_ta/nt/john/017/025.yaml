  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: ta
  text: நீதியுள்ள தந்தையே, உலகம்[a] உம்மை அறியவில்லை என்றாலும், நான் உம்மை அறிந்திருக்கிறேன், நீர் என்னை அனுப்பினீர் என்று இவர்களும் அறிந்திருக்கிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யோவான் நூலில் ‘உலகம்’ என்பது படைக்கப்பட்ட உலகத்தை மட்டுமல்லாமல், கடவுளிடமிருந்து அந்நியப்பட்ட நிலையில் உள்ள மனிதகுலத்தையும் பல இடங்களில் குறிக்கிறது.
    reason: cross_reference
  - marker: b
    text: 'அல்லது: ‘நீதியுள்ள தந்தையே, உலகம் உம்மை அறியவில்லை; நானோ உம்மை அறிந்தேன்; நீர் என்னை அனுப்பினீர் என்று இவர்களும் அறிந்தார்கள்.’ கிரேக்கத்தில் ‘அறிதல்’ குறித்த மூன்று வினைகளும் aorist வடிவில் உள்ளன; பிரதான உரை ஜெபத்தின் சூழலுக்கேற்ப பிந்தைய இரு வினைகளைத் தமிழில் நிறைவுற்ற, நிகழ்காலப் பொருத்தமுள்ள வடிவில் வழங்குகிறது. முதல் இணைப்புச்சொல் கிரேக்கத்தில் நேரடியான இணைப்பாக உள்ளது; பிரதான உரையில் அதன் சூழல்சார் எதிர்மறைத் தொடர்பு ‘என்றாலும்’ என வெளிப்படுத்தப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: நீதியுள்ள தந்தையே
  rationale: விளிவேற்றுமையிலுள்ள நேரடி அழைப்பை இயல்பான தமிழில் தருகிறது. δίκαιος என்பதன் அறநெறி மற்றும் இறையியல் கனத்தை ‘நீதியுள்ள’ தக்கவைக்கிறது; அதை நீதித்துறை சார்ந்த நியாயம் என்ற பொருளுக்கு மட்டும் குறுக்கவில்லை.
- source_word: καὶ
  choice: என்றாலும்
  rationale: முதல் καὶ இங்கு உலகம் அறியாததையும் இயேசு அறிந்திருப்பதையும் எதிர்மறையாக இணைக்கும் விட்டுக்கொடுப்பு உறவை வெளிப்படுத்துகிறது. தமிழில் வெறும் ‘மற்றும்’ என்பதைவிட ‘என்றாலும்’ அந்த உரையோட்டத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὁ κόσμος
  choice: உலகம்
  rationale: யோவானின் பயன்பாட்டில் உள்ள படைப்புலகம், மனிதகுலம், கடவுளிடமிருந்து அந்நியப்பட்ட மனித ஒழுங்கு ஆகிய பல அடுக்குகளை ஒரு விளக்கச்சொல்லால் குறுக்காமல் பாதுகாக்கிறது.
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: அறிந்துகொள்ளவில்லை / அறிந்திருக்கிறேன் / அறிந்திருக்கிறார்கள்
  rationale: γινώσκω என்பதிலுள்ள அறிவுசார் மற்றும் உறவுசார் பொருளை ‘அறி’ தக்கவைக்கிறது. முதல் வினையில் ‘அறிந்துகொள்ளவில்லை’ உலகம் அவரை அறிதலுக்கு வராததைத் தெரிவிக்கிறது; அடுத்த இரண்டில் நிகழ்காலத் தொடர்புடைய நிறைவைத் தமிழின் ‘அறிந்திருக்கிறேன்/அறிந்திருக்கிறார்கள்’ இயல்பாகக் காட்டுகிறது.
- source_word: ἐγὼ δέ
  choice: நான்
  rationale: δέ-யின் எதிர்மறைத் தொடர்பு ஏற்கெனவே ‘என்றாலும்’ என்ற அமைப்பில் வெளிப்படுவதால், தேவையற்ற இரட்டிப்பைத் தவிர்த்து ‘நான்’ என வழங்கப்படுகிறது.
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: சூழலில் இயேசுவைப் பின்பற்றுவோரைக் குறித்தாலும், மூலத்தின் சுட்டுப்பெயரையே தக்கவைத்து ‘சீடர்கள்’ போன்ற விளக்கப்பெயரைச் சேர்க்கவில்லை.
- source_word: σύ με ἀπέστειλας
  choice: நீர் என்னை அனுப்பினீர்
  rationale: அனுப்பிய செயலை நேரடியாகக் கூறுகிறது; மரியாதை ஒருமை வடிவம் தந்தையை நோக்கிய ஜெபத்தின் கண்ணியமான தமிழ்நடைக்கு ஏற்றது.
