revisions:
- from: நீதியுள்ள தந்தையே, உலகம்[a] உம்மை அறிந்துகொள்ளவில்லை என்றாலும், நான் உம்மை அறிந்திருக்கிறேன்; நீர் என்னை அனுப்பினீர் என்று இவர்களும் அறிந்திருக்கிறார்கள்.[b]
  to: நீதியுள்ள தந்தையே, உலகம்[a] உம்மை அறியவில்லை என்றாலும், நான் உம்மை அறிந்திருக்கிறேன், நீர் என்னை அனுப்பினீர் என்று இவர்களும் அறிந்திருக்கிறார்கள்.[b]
