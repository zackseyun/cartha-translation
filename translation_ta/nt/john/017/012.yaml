source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: ta
  text: நான் அவர்களோடு இருந்தபோது, நீர் எனக்குக் கொடுத்துள்ள உமது பெயரில் அவர்களைக் காத்துவந்தேன்; அவர்களைப் பாதுகாத்தேன். அவர்களில் அழிவின் மகனை[b] தவிர, ஒருவனும் அழிந்துபோகவில்லை[a]. வேதவாக்கு நிறைவேறும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருவனும் தொலைந்துபோகவில்லை.’
    reason: lexical_alternative
  - marker: b
    text: ‘அழிவின் மகன்’ என்பது எபிரேய மொழிநடையை ஒத்த சொற்றொடர்; ‘அழிவுக்குரியவன்’ என்றும் பொருள் கொள்ளலாம்; மரபாக, ‘கேட்டின் மகன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: நான் அவர்களோடு இருந்தபோது
  rationale: ὅτε அறிமுகப்படுத்தும் காலத் துணைவாக்கியத்தையும், μετά என்பதன் நேரடியான ‘உடன்’ பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐτήρουν
  choice: காத்துவந்தேன்
  rationale: முற்றுப்பெறாமல் தொடர்ந்து நடந்த செயலைக் காட்டும் imperfect வினை வடிவத்தின் தொடர்ச்சித் தன்மையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι
  choice: நீர் எனக்குக் கொடுத்துள்ள உமது பெயரில்
  rationale: ‘பெயரில்’ என்ற மூல உருவகத்தையும், நடுநிலை ஒருமை உறவுப்பெயர் ‘பெயர்’ என்பதையே சுட்டுகிறது என்பதையும் காக்கிறது; perfect வினையின் தற்போதைய தொடர்பை ‘கொடுத்துள்ள’ வெளிப்படுத்துகிறது.
- source_word: καὶ ἐφύλαξα
  choice: அவர்களைப் பாதுகாத்தேன்
  rationale: τηρέω என்பதிலிருந்து φυλάσσω என்பதன் சொல்வேறுபாட்டைக் காக்க, ‘காத்தேன்’ என்பதை மீண்டும் பயன்படுத்தாமல் ‘பாதுகாத்தேன்’ என வழங்குகிறது.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: அவர்களில் ஒருவனும் அழிந்துபோகவில்லை
  rationale: ἀπόλλυμι என்பதன் கடுமையான ‘அழிதல்’ பொருளைத் தக்கவைக்கிறது; யோவான் நூலில் பொருந்தக்கூடிய ‘தொலைந்துபோதல்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: அழிவின் மகன்
  rationale: செமித்திய மரபிலான மூலச் சொற்றொடரை விளக்கமாக விரித்துத் தீர்மானிக்காமல், அதன் உருவத்தையும் இறையியல் இறுக்கத்தையும் காக்கிறது.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: வேதவாக்கு நிறைவேறும்படி
  rationale: ἵνα அமைப்பின் நோக்கம்/விளைவு சார்ந்த திறந்த நுணுக்கத்தை ‘நிறைவேறும்படி’ காக்கிறது; ஒருமையிலுள்ள குறிப்பிட்ட γραφή என்பதை ‘வேதவாக்கு’ இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: ᾧ δέδωκάς μοι என்பதன் தொடர்புறுப்பு
  choice: ‘நீர் எனக்குக் கொடுத்துள்ள உமது பெயர்’ என்று, உறவுத்தொடர் ‘பெயர்’ என்பதைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நீர் எனக்குக் கொடுத்தவர்கள்’ என்று சீடர்களைக் குறிப்பதாக வாசித்தல்.
  rationale: கொடுக்கப்பட்டுள்ள கிரேக்க உரையில் ᾧ என்பது நடுநிலை ஒருமை; ஆகவே அது நடுநிலை ஒருமையான ὀνόματι (‘பெயர்’) என்பதோடு இயல்பாக இயைகிறது, ஆண்பால் பன்மையான αὐτούς (‘அவர்கள்’) என்பதோடு அல்ல.
- issue: ὁ υἱὸς τῆς ἀπωλείας என்பதன் பொருள்
  choice: ‘அழிவின் மகன்’ என்ற செமித்திய வடிவம் முதன்மை உரையில் காக்கப்பட்டது.
  alternative: ‘அழிவுக்குரியவன்’ அல்லது மரபான ‘கேட்டின் மகன்’.
  rationale: இச்சொற்றொடரை முன்நியமனம் அல்லது இறுதி விதி பற்றிய முழுமையான கோட்பாட்டு வாக்கியமாக விரிக்காமல், அதன் இயல்பான இருபொருள்/இறையியல் இறுக்கத்தைத் தக்கவைக்கிறது.
- issue: ἵνα துணைவாக்கியத்தின் நோக்கம் அல்லது விளைவு
  choice: ‘நிறைவேறும்படி’ என்று இரு நுணுக்கங்களுக்கும் இடமளிக்கப்பட்டது.
  alternative: முழுக்க நோக்கமாக மட்டும் ‘நிறைவேற்றுவதற்காக’ அல்லது விளைவாக மட்டும் ‘அதனால் நிறைவேறியது’ என்று தெளிவுபடுத்துதல்.
  rationale: ἵνα உடன் வரும் subjunctive வடிவத்தின் நோக்கம்–விளைவு தொடர்பைத் தமிழில் தேவையின்றி ஒரே திசையில் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பிதாவை நோக்கிய உரையில் ‘நீர்/உமது’ என்ற மரியாதை ஒருமை காக்கப்பட்டுள்ளது. ‘பெயரில்,’ ‘அழிவின் மகன்’ போன்ற மூலத்தின் இறையியல் நிறைந்த உருவகங்கள் விளக்கிச் சுருக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
