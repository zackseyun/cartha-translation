id: JHN.17.22
reference: John 17:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: ta
  text: நீர் எனக்குக் கொடுத்திருக்கிற மகிமையை நான் அவர்களுக்குக் கொடுத்திருக்கிறேன்; நாம் ஒன்றாய் இருப்பதுபோல அவர்களும் ஒன்றாய் இருக்கும்படி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀγὼ
  choice: நான்
  rationale: καί + ἐγώ என்ற இணைவு முந்தைய கருத்துடன் தொடர்ச்சியை ஏற்படுத்துகிறது. தமிழில் வாக்கிய ஓட்டத்தால் அந்த இணைப்பு இயல்பாகத் தென்படுவதால் முதன்மை உரையில் ‘நான்’ என்று வழங்கப்பட்டுள்ளது; அதன் கூட்டல் வலியுறுத்தலை ‘நானும்’ எனப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: δόξαν
  choice: மகிமையை
  rationale: யோவான் நூலில் δόξα தெய்வீக மகிமை என்ற ஆழமான பொருளைத் தாங்குகிறது; ‘மரியாதை’ அல்லது ‘மாட்சிமை’ என்பவற்றைவிட ‘மகிமை’ இதைத் தெளிவாகவும் மரபொத்த வகையிலும் காக்கிறது.
- source_word: ἣν δέδωκάς μοι
  choice: நீர் எனக்குக் கொடுத்திருக்கிற
  rationale: δέδωκας என்ற நிறைவுநிலை வினையின் முடிந்த செயலும் தொடரும் விளைவும் தமிழின் ‘கொடுத்திருக்கிற’ என்ற வடிவில் இயல்பாக வெளிப்படுகின்றன. பிதாவை நோக்கிய மரியாதையான ஒருமைக்கு ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: δέδωκα αὐτοῖς
  choice: நான் அவர்களுக்குக் கொடுத்திருக்கிறேன்
  rationale: δέδωκα குறிக்கும் நிறைவேறியதும் நீடித்த விளைவுடையதுமான கொடையை ‘கொடுத்திருக்கிறேன்’ இயல்பாகக் காட்டுகிறது.
- source_word: ἵνα ὦσιν ἓν
  choice: அவர்களும் ஒன்றாய் இருக்கும்படி
  rationale: ἵνα-வின் நோக்கம் அல்லது விளைவு ‘இருக்கும்படி’ என்பதால் தெளிவாகிறது. ἓν என்ற நடுநிலை ஒருமை, ஒரே நபராகுதல் என்று அல்லாமல் ஒன்றுமையைச் சுட்டுவதால் ‘ஒன்றாய்’ என்று சுருக்கமாக வைக்கப்பட்டுள்ளது.
- source_word: καθὼς ἡμεῖς ἕν
  choice: நாம் ஒன்றாய் இருப்பதுபோல
  rationale: καθὼς குறிக்கும் ஒப்பீட்டை ‘இருப்பதுபோல’ தெளிவாகக் காட்டுகிறது; பிதா–மகன் ஒன்றுமையின் இயல்பை மேலதிகமாக விளக்காமல் கிரேக்கத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: விசுவாசிகளின் ஒன்றுமைக்கும் பிதா–மகன் ஒன்றுமைக்கும் இடையிலான ஒப்பீட்டின் இயல்பு
  choice: ‘நாம் ஒன்றாய் இருப்பதுபோல அவர்களும் ஒன்றாய் இருக்கும்படி’ என்று ஒப்பீட்டை நேரடியாக வழங்குதல்
  alternative: இதை உறவுசார், பணிசார், திருச்சபை அமைப்புசார் அல்லது தெய்வீக வாழ்வில் பங்கேற்கும் ஒன்றுமை என்று குறிப்பாக விளக்குதல்
  rationale: இவ்வசனம் உண்மையான ஒப்பீட்டை முன்வைக்கிறது; ஆனால் அதன் துல்லியமான இயல்பை இங்கே வரையறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு எந்த ஒரு பிற்கால இறையியல் விளக்கத்தையும் உட்புகுத்தாமல் அந்தத் தெளிவின்மையையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு நிறைவுநிலை வினைகளும் ‘கொடுத்திருக்கிற’ / ‘கொடுத்திருக்கிறேன்’ என ஒத்திசைவாக வழங்கப்பட்டுள்ளன. கடைசி நோக்க வாக்கியம் தமிழில் தனித்து தொங்காமல் இருக்க ‘இப்படிச் செய்தேன்’ சேர்க்கப்பட்டுள்ளது; இது ἵνα வாக்கியத்தின் நோக்க உறவை வெளிப்படுத்தும் இலக்கணத் தெளிவாக்கம் மட்டுமே.
