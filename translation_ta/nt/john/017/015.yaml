id: JHN.17.15
reference: John 17:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: ta
  text: அவர்களை உலகத்திலிருந்து எடுத்துக்கொள்ளும்படி நான் கேட்கவில்லை; தீயவனிடமிருந்து[a] அவர்களைக் காத்தருளும்படியே கேட்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமையிலிருந்து.” τοῦ πονηροῦ என்ற கிரேக்கத் தொடர் “தீயவன்” அல்லது “தீமை” என இருவிதமாகப் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: நான் கேட்கவில்லை / கேட்கிறேன்
  rationale: நிகழ்கால முதலாம் நபர் ஒருமை வடிவத்தின் உடனடி, தொடரும் வேண்டுதலை இயல்பான தமிழில் காட்டுகிறது; ‘ஜெபிக்கிறேன்’ என்பதைக் காட்டிலும் ‘கேட்கிறேன்’ என்பது மூலச் சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἄρῃς
  choice: எடுத்துக்கொள்ள
  rationale: இங்கு αἴρω என்பது அகற்றுதல் அல்லது எடுத்துச் செல்லுதல் என்ற பொருளில் வருகிறது; ἐκ τοῦ κόσμου என்பதுடன் ‘உலகத்திலிருந்து எடுத்துக்கொள்ள’ என்பது இயல்பாக அமைகிறது.
- source_word: κόσμου
  choice: உலகம்
  rationale: யோவான் எழுத்துகளில் κόσμος பல நுண்பொருள்களைக் கொண்டிருந்தாலும், இங்கு ‘உலகம்’ என்பது அதன் பரந்த பொருளையும் சூழல்சார் பதற்றத்தையும் முன்கூட்டியே குறுக்காமல் காக்கிறது.
- source_word: τηρήσῃς
  choice: காத்துக்கொள்ள
  rationale: τηρέω என்பதன் காத்தல், பாதுகாத்தல், பேணுதல் ஆகிய பொருள்களை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ
  choice: -இடமிருந்து
  rationale: τηρέω உடன் வரும் ἐκ, ஒருவரிடமிருந்து பாதுகாத்தல் என்ற பொருளைத் தருகிறது; தமிழில் ‘தீயவனிடமிருந்து’ என்பது இயல்பான இணைப்பு.
- source_word: τοῦ πονηροῦ
  choice: தீயவன்
  rationale: உருபுடன் வரும் இந்த ஒருமை பெயரடை ஆண்பாலாக ‘தீயவன்’ என்றும் நடுநிலையாக ‘தீமை’ என்றும் பொருள்படலாம். யோவான் பயன்பாட்டில் தனிப்பட்ட தீய சக்தியைக் குறிக்கும் வாசிப்பு வலுவாக இருப்பதால் ‘தீயவன்’ முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: τοῦ πονηροῦ என்பது தனிப்பட்ட ‘தீயவன்’ என்பதா அல்லது பொதுவான ‘தீமை’ என்பதா?
  choice: தீயவன்
  alternative: தீமை
  rationale: கிரேக்க வடிவம் இரு பொருள்களுக்கும் இடமளிக்கிறது. யோவான் எழுத்துகளின் பயன்பாடும் தெய்வீகப் பாதுகாப்பை வேண்டுகிற சூழலும் தனிப்பட்ட குறிப்பை ஓரளவு ஆதரிக்கின்றன; இருப்பினும் உண்மையான தெளிவின்மையைப் பாதுகாக்க ‘தீமை’ என்ற வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான ஜெப மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்கள்’ என்பது பிதாவை நோக்கிய மரியாதை ஒருமை; கருத்தின் எதிர்மறை–நேர்மறை முரணை தெளிவாக்க ‘என்றே’ பயன்படுத்தப்பட்டுள்ளது.
