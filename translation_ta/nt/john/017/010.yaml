  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: ta
  text: என்னுடையவை அனைத்தும் உம்முடையவை; உம்முடையவை என்னுடையவை. அவர்களில்[a] நான் மகிமைப்படுத்தப்பட்டிருக்கிறேன்.
