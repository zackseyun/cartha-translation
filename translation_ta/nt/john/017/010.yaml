    text: அல்லது, “அவர்கள் மூலமாக” அல்லது “அவர்கள் நடுவில்.” கிரேக்கத்தில் “அவர்களில்” என்று உள்ளது; சூழலில் அது இடம், வழிமுறை, அல்லது அவர்களிடம் வெளிப்படுதல் ஆகியவற்றைக் குறிக்கலாம்.
