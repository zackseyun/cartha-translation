lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: என்னுடையவை அனைத்தும்
  rationale: நபுஞ்சகப் பன்மையுடன் வரும் πᾶς, இயேசுவுக்குச் சொந்தமான அனைத்தையும் விரிவாகக் குறிக்கிறது. இந்தத் தமிழாக்கம் அதன் முழுமையான பரப்பையும் இயல்பாகத் தருகிறது.
- source_word: σά
  choice: உம்முடையவை
  rationale: உடைமையைக் குறிக்கும் σά என்பதைக் கூறுப்பயனிலையாகவும் பன்மைத் தன்மையுடனும் தெளிவாகத் தருகிறது; பிதாவை நோக்கிய மரியாதையான ஒருமையை ‘உம்’ காக்கிறது.
- source_word: τὰ σὰ ἐμά
  choice: உம்முடையவை என்னுடையவை
  rationale: முதல் கூறுக்கு இணையான சுருக்கமான அமைப்பில் பரஸ்பர உடைமையை நேரடியாகக் காக்கிறது.
- source_word: δεδόξασμαι
  choice: நான் மகிமைப்படுத்தப்பட்டிருக்கிறேன்
  rationale: முற்றுப்பெற்ற செயலும் அதன் தொடரும் விளைவும் சேர்ந்துள்ள perfect passive வடிவத்தைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: ἐν αὐτοῖς
  choice: அவர்கள் நடுவில்
  rationale: αὐτοῖς என்பது சூழலில் சீடர்களாகிய நபர்களைக் குறிக்கிறது. தமிழில் ‘அவர்களில்’ என்பது இயற்கையற்றதாகவும் உட்புகுந்திருப்பதுபோன்ற தவறான எண்ணத்தையும் தரக்கூடும்; ‘அவர்கள் நடுவில்’ ἐν என்பதன் இட/சமூகப் பொருளை இயல்பாக வெளிப்படுத்துகிறது. கருவி அல்லது வெளிப்பாட்டு நுணுக்கங்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
theological_decisions:
- issue: குமாரனுக்கும் பிதாவுக்கும் இடையிலான பரஸ்பர உடைமை
  choice: ‘என்னுடையவை அனைத்தும் உம்முடையவை; உம்முடையவை என்னுடையவை’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: இதைப் பகிரப்பட்ட உடைமை என்று அல்லாமல் வெறும் செயற்பாட்டு ஒத்துழைப்பாக மட்டும் மெலிதாக்குதல்
  rationale: கிரேக்கம் பரஸ்பர உடைமையை வெளிப்படையாகக் கூறுகிறது. அதை மெலிதாக்காமலும், வசனத்தில் இல்லாத பிற்காலக் கோட்பாட்டுச் சொற்களைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: ἐν αὐτοῖς என்பதன் பொருளும் வலிமையும்
  choice: இட/சமூக நுணுக்கத்தை ‘அவர்கள் நடுவில்’ என்று முதன்மை உரையில் தருதல்; பிற சாத்தியங்களை அடிக்குறிப்பில் காத்தல்
  alternative: ‘அவர்கள் மூலமாக’ என்ற கருவிப்பொருள்; ‘அவர்களில்’ என்ற நேரடி வடிவம்
  rationale: ἐν சூழலில் இடம், வழிமுறை, அல்லது வெளிப்பாடு ஆகிய நுணுக்கங்களை ஏற்கக்கூடும். இயல்பான தமிழுக்காக முதன்மை உரையில் ‘அவர்கள் நடுவில்’ பயன்படுத்தப்பட்டாலும், கிரேக்கத்தின் விரிந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
