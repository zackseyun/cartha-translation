  register: நவீன தரத் தமிழில், பிதாவை நோக்கிய மரியாதையான ஒருமைக்கு ‘உம்’ பயன்படுத்தப்பட்டுள்ளது. இணையான இரு உடைமைக் கூறுகளும் சுருக்கமாக வைக்கப்பட்டுள்ளன. ‘மகிமைப்படுத்தப்பட்டிருக்கிறேன்’ என்பது இறையியல் மரியாதையையும் கிரேக்க perfect passive வடிவத்தின் தொடரும் விளைவையும் காக்கிறது.
