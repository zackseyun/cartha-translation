  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: ἐδόξασα என்பதற்கு ‘மகிமைப்படுத்தினேன்’, ἐπὶ τῆς γῆς என்பதற்கு ‘பூமியில்’, τὸ ἔργον என்பதற்கு ‘வேலையை’, மற்றும் ἵνα ποιήσω என்பதற்கு ‘செய்யக் கொடுத்த’ என இயல்பாகத் தரப்பட்டுள்ளன. τελειώσας என்பதன் வழிமுறைப் பொருளை ‘நிறைவேற்றியதன் மூலம்’ தெளிவாகத் தருவது பாதுகாப்பானது. δέδωκάς-இன் நிறைவுக்கால நுணுக்கம் தமிழில் தொடர்புவினை வடிவத்தில் முழுமையாகக் குறிக்கப்படாவிட்டாலும், ‘நீர் எனக்குச் செய்யக் கொடுத்த’ என்பது இயல்பானதும் பொருளுக்கு உண்மையானதும் ஆகும்.'
