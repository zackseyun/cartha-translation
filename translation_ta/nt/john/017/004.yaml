source:
  edition: SBLGNT
  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: ta
  text: நீர் எனக்குச் செய்யக் கொடுத்த வேலையை நிறைவேற்றியதன் மூலம், பூமியில் உம்மை மகிமைப்படுத்தினேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீர் எனக்குச் செய்யக் கொடுத்த வேலையை நிறைவேற்றி, பூமியில் உம்மை மகிமைப்படுத்தினேன்.’
    reason: τελειώσας என்பதை வழிமுறையாகத் தெளிவுபடுத்தாமல், பங்கேற்புவினையின் வடிவுறவை நெருக்கமாகப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐδόξασα
  choice: மகிமைப்படுத்தினேன்
  rationale: யோவான் நூல்களில் δοξάζω கொண்டுள்ள இறையியல் செறிவையும், ஒருவரின் மகிமையை வெளிப்படுத்தி உயர்த்தும் பொருளையும் ‘மகிமைப்படுத்தினேன்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: ἐπί + genitive இங்குக் குறிக்கும் இடப்பொருளை நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: τελειώσας
  choice: நிறைவேற்றியதன் மூலம்
  rationale: 'அவோரிஸ்ட் பங்கேற்புவினை முதன்மை வினையின் வழிமுறையைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுவதைத் தெளிவாக்குகிறது: கொடுக்கப்பட்ட வேலையை நிறைவேற்றுவதன் மூலம் இயேசு பிதாவை மகிமைப்படுத்தினார்.'
- source_word: τὸ ἔργον
  choice: வேலையை
  rationale: ἔργον என்பதன் பொதுவான ‘வேலை/பணி’ பொருளை எளிய நவீனத் தமிழில் தருகிறது; இச்சூழலில் ஒப்படைக்கப்பட்ட செயலையும் குறிக்கிறது.
- source_word: δέδωκάς μοι
  choice: நீர் எனக்குக் கொடுத்த
  rationale: கிரேக்க நிறைவுக்கால வினையின் முடிந்த செயலும் தொடர்ந்து நிலவும் தொடர்பும் தமிழ்ச் சூழலில் இயல்பான இந்த வடிவில் வெளிப்படுகின்றன.
- source_word: ἵνα ποιήσω
  choice: செய்ய
  rationale: கொடுத்த வேலையின் நோக்கத்தைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐγώ σε
  choice: உம்மை ... மகிமைப்படுத்தினேன்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள முதலாம் நபர் எழுவாயை, தமிழில் வினைமுற்றே தெளிவாகக் காட்டுவதால் தனியாக ‘நான்’ சேர்க்கப்படவில்லை; ‘உம்மை’ மரியாதையும் நேரடி தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: τελειώσας என்ற பங்கேற்புவினைக்கும் பிதாவை மகிமைப்படுத்தியதற்கும் உள்ள உறவு
  choice: 'வழிமுறை: ஒப்படைக்கப்பட்ட வேலையை நிறைவேற்றியதன் மூலம் இயேசு பிதாவை மகிமைப்படுத்தினார்.'
  alternative: 'காலம் அல்லது உடன்நிகழ்ச்சி: ‘வேலையை நிறைவேற்றி, பூமியில் உம்மை மகிமைப்படுத்தினேன்.’'
  rationale: இலக்கண அமைப்பு, பங்கேற்புவினை முதன்மை வினை எவ்வாறு நிகழ்ந்தது என்பதை விளக்குவதாக இயல்பாக வாசிக்க இடமளிக்கிறது. அதேவேளை பங்கேற்புவினையின் சற்றே திறந்த உறவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்’, ‘உம்மை’ தேர்ந்தெடுக்கப்பட்டுள்ளன; சொற்சொல் கடினத்தன்மையைத் தவிர்த்து கிரேக்க வாக்கியத்தின் இறையியல் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
