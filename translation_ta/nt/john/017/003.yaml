language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: ta
  text: 'நித்திய வாழ்வு என்பது இதுதான்: ஒரே உண்மையான கடவுளாகிய உம்மையும், நீர் அனுப்பிய இயேசுவாகிய மெசியாவையும்[a] அவர்கள் அறிந்துகொள்வதே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபான மொழிபெயர்ப்பில், “இயேசு கிறிஸ்துவையும்.” கிரேக்கச் சொல்லான Χριστός ஒரு பட்டப்பெயராக (“மெசியா”) அல்லது சில சூழல்களில் பெயர்போன்ற அடையாளமாக (“கிறிஸ்து”) அமையலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: என்பது இதுதான்
  rationale: δέ-யின் இணைப்புத் தன்மையைத் தமிழில் தேவையற்ற எதிர்மறை அழுத்தமின்றி இயல்பாக வெளிப்படுத்தி, அடுத்து வரும் விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: ἡ αἰώνιος ζωὴ
  choice: நித்திய வாழ்வு
  rationale: யோவான் நூலில் வரும் நிலையான கருத்தைத் தக்கவைத்தபடி, இன்றைய பொதுத் தமிழில் இயல்பாகவும் புரியும்படியாகவும் உள்ளது; ‘ஜீவன்’ என்பதைக் காட்டிலும் ‘வாழ்வு’ பரவலாகப் புரியும்.
- source_word: ἵνα γινώσκωσι
  choice: அவர்கள் அறிந்துகொள்வதே
  rationale: ἵνα இங்கு நித்திய வாழ்வு எதில் அடங்கியுள்ளது என்பதை விளக்குகிறது. நிகழ்கால வினையின் தொடர்ச்சியான, உறவுசார் அறிதலை ‘அறிந்துகொள்வது’ இயல்பாக உணர்த்துகிறது.
- source_word: σὲ
  choice: உம்மை
  rationale: இயேசுவின் ஜெபத்தில் பிதாவைக் குறிக்கும் ஒருமை இரண்டாம் நபர் நேரடி செயப்படுபொருள்; மரியாதையான தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: ஒரே உண்மையான கடவுளாகிய
  rationale: μόνον மற்றும் ἀληθινόν ஆகிய இரண்டின் பொருளையும் தக்கவைத்து, ‘உம்மை’ என்பதற்கான விளக்க இணைப்பாகத் தமிழில் இயல்பாக அமைக்கிறது.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: தந்தையையும் அனுப்பப்பட்ட இயேசுவையும் கிரேக்க மூலத்தைப் போல இணையாக இணைக்கும் இயல்பான தமிழ் இணைப்புமுறை.
- source_word: ὃν ἀπέστειλας
  choice: நீர் அனுப்பிய
  rationale: இயேசுவைத் தந்தையின் அனுப்புதலுடன் அடையாளப்படுத்தும் உறவுச் சொற்றொடரை எளிய இறந்தகாலப் பொருளில் வழங்குகிறது.
- source_word: Ἰησοῦν Χριστόν
  choice: இயேசு மெசியாவை
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைக்கக்கூடியதால் ‘மெசியா’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘ஒரே உண்மையான கடவுள்’ என்பதற்கும் இயேசுவுக்கும் இடையிலான வாக்கிய உறவு
  choice: பிதாவை ‘ஒரே உண்மையான கடவுள்’ என்று நேரடியாக அழைத்து, இயேசுவை அவர் அனுப்பியவராக வேறுபடுத்தும் மூலவாக்கிய அமைப்பு அப்படியே தக்கவைக்கப்பட்டது.
  alternative: திரித்துவக் கோட்பாட்டை வெளிப்படையாக்க விளக்கச் சொற்களைச் சேர்த்தல், அல்லது பிதாவுக்கும் இயேசுவுக்கும் இடையிலான இலக்கண வேறுபாட்டை மங்கச் செய்தல்.
  rationale: இந்த வசனம் கொண்டிருக்கும் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தானாகத் தீர்க்கக்கூடாது; மூலத்தின் நேரடியான கூற்றை விரிவாக்கமோ குறைப்போ இன்றித் தர வேண்டும்.
- issue: Χριστόν என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் பட்டப்பெயரின் அர்த்தம் கேட்கப்படுவதால் ‘மெசியா’ முதன்மையாகத் தரப்படுகிறது; பெயர்போல் நிலைபெற்ற மரபான வடிவத்தின் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஜெப மொழிக்கேற்ற ‘உம்மை/நீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. திருச்சபை வழக்கில் உள்ள ‘நித்திய ஜீவன்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘நித்திய வாழ்வு’ தேர்ந்தெடுக்கப்பட்டது; வாக்கியம் dignified ஆகவும் எளிதில் வாசிக்கத்தக்கதாகவும் வைக்கப்பட்டுள்ளது.
