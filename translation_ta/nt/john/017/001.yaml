id: JHN.17.1
reference: John 17:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: ta
  text: 'இவற்றை இயேசு சொல்லி, தம் கண்களை வானத்தை நோக்கி உயர்த்தி, கூறினார்: “தந்தையே, வேளை வந்துவிட்டது. உமது மகனை மகிமைப்படுத்தும்; மகன் உம்மை மகிமைப்படுத்தும்படியாக.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: இவற்றை
  rationale: முந்தைய உரையில் இயேசு கூறிய பல காரியங்களைப் பின்னோக்கிச் சுட்டும் நடுநிலைப் பன்மைச் சுட்டுப்பெயரின் இயல்பைத் தக்கவைக்கிறது.
- source_word: ἐλάλησεν
  choice: சொன்னார்
  rationale: λαλέω என்பதன் ‘பேசினார்’ என்ற அடிப்படைப் பொருளை இங்கு தொடரும் நிகழ்வுரையோடு இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: அவர் தம் கண்களை ... உயர்த்தி
  rationale: கண்களை மேலே உயர்த்திய உடல்சார்ந்த செயலைத் தெளிவாகப் பாதுகாக்கிறது; முற்கால வினையெச்சம் முதன்மை வினைக்கு முன் நிகழும் துணைச் செயலாக இயல்பாக வழங்கப்படுகிறது.
- source_word: εἰς τὸν οὐρανόν
  choice: வானத்தை நோக்கி
  rationale: εἰς குறிக்கும் திசையைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: Πάτερ
  choice: தந்தையே
  rationale: ‘என்’ என்பதைச் சேர்க்காமல் நேரடி அழைப்பின் வடிவத்தைப் பாதுகாக்கிறது; நவீனச் செந்தமிழில் கண்ணியமான அழைப்பு.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: அந்த வேளை வந்துவிட்டது
  rationale: யோவான் நற்செய்தியில் முன்பே எதிர்பார்க்கப்பட்ட குறிப்பிட்ட வேளையைக் குறிக்கும் ἡ ὥρα என்பதையும், நிறைவுற்ற வருகையை உணர்த்தும் perfect வினையையும் பாதுகாக்கிறது.
- source_word: δόξασόν
  choice: மகிமைப்படுத்தும்
  rationale: δοξάζω என்பதில் உள்ள வெளிப்படுத்துதல், பெருமைப்படுத்துதல், மகிமை ஆகிய யோவானிய இறையியல் நிறைகளை ‘மகிமைப்படுத்து’ நன்கு தாங்குகிறது; மரியாதை ஒருமை ஏவல் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: σου τὸν υἱόν
  choice: உமது மகனை
  rationale: இரண்டாம் நபர் உரிமைத் தொடர்பை இயல்பாகக் காட்டுகிறது; தமிழில் தலைப்பெழுத்து வேறுபாடு இல்லாததால் சூழலே பட்டப்பெயர்சார் குறிப்பை வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: அப்போது
  rationale: தந்தை மகனை மகிமைப்படுத்துவதற்கும் மகன் தந்தையை மகிமைப்படுத்துவதற்கும் இடையிலுள்ள நோக்கம்/விளைவு உறவை நவீன தமிழில் இயல்பாக இணைக்கிறது; இதை வெறும் காலச்சொல்லாக மட்டும் அல்லாமல் நோக்குவிளைவு இணைப்பாக வாசிக்கச் சூழல் வழிகாட்டுகிறது.
- source_word: ὁ υἱὸς
  choice: மகன்
  rationale: முந்தைய ‘உமது மகன்’ என்பதிலிருந்து கிரேக்கத்தில் வரும் ‘மகன்’ என்ற எழுவாய் மாற்றத்தைத் தக்கவைக்கிறது; தமிழில் தேவையற்ற சுட்டடை சேர்க்கப்படவில்லை.
- source_word: δοξάσῃ σέ
  choice: உம்மை மகிமைப்படுத்துவார்
  rationale: ἵνα உடன் வரும் நோக்கம்/விளைவை வெளிப்படுத்துகிறது; தந்தையை நோக்கிய மரியாதைச் சுட்டுப்பெயரும் மகனுக்குரிய மரியாதை வினைமுற்றும் இயல்பான தமிழில் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: தந்தைக்கும் மகனுக்கும் இடையிலான பரஸ்பர மகிமைப்படுத்துதல்
  choice: “உமது மகனை மகிமைப்படுத்தும்; அப்போது மகன் உம்மை மகிமைப்படுத்துவார்” என்று விளக்க விரிவாக்கமின்றி வழங்கப்பட்டது.
  alternative: “உமது மகனுக்குப் பெருமை அளியும்; அவர் உமக்குப் பெருமை சேர்ப்பார்”
  rationale: ஒரே δοξάζω வினையை இரு இடங்களிலும் ஒரே சொல்லால் வழங்குவது வாக்கியத்தின் சமச்சீரையும் அதன் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது; பின்னாளைய கோட்பாட்டு மொழி எதுவும் உரைக்குள் சேர்க்கப்படவில்லை.
- issue: ἵνα குறிக்கும் உறவு
  choice: நோக்கம் மற்றும் விளைவு இரண்டிற்கும் இடமளிக்கும் வகையில் “அப்போது” என இயல்பாக இணைக்கப்பட்டது.
  alternative: “மகன் உம்மை மகிமைப்படுத்தும்படியாக”
  rationale: ἵνα நோக்கத்தையோ விளைவையோ, சில சூழல்களில் இரண்டின் நெருங்கிய இணைப்பையோ குறிக்கலாம். முதன்மை உரையில் இயல்பான தமிழ் முன்னுரிமை பெற்றாலும், காரண-நோக்கு உறவு அழிக்கப்படவில்லை.
- issue: ‘மகன்’ என்பதன் கிறிஸ்துவியல் பட்டப்பெயர்சார் பயன்பாடு
  choice: “உமது மகன்” மற்றும் பின்னர் “மகன்” என்ற வடிவங்கள் பாதுகாக்கப்பட்டன.
  alternative: “உமது குமாரன் ... அந்தக் குமாரன்”
  rationale: ‘மகன்’ என்பது நவீனத் தமிழில் நேரடியும் இயல்புமானது. தமிழ் எழுத்தில் ஆங்கிலத்தைப் போன்ற capitalization இல்லாததால், பட்டப்பெயர்சார் பொருள் சூழலால் தெரியவருகிறது; கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான வேதாகம நடையை நோக்கமாகக் கொண்டது. ‘தந்தையே’, ‘உமது’, ‘உம்மை’ ஆகியவை வழிபாட்டு சூழலுக்கு ஏற்ற மரியாதையையும் நேரடி அழைப்பையும் காக்கின்றன. ‘குமாரன்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘மகன்’ பயன்படுத்தப்பட்டது. வசனத்தின் கிரேக்க தொடரமைப்பை அப்படியே கடினமாக நகலெடுக்காமல், நிகழ்வின் வரிசையைத் தெளிவாக்க ‘பின்பு’ மற்றும் ‘இவ்வாறு’ சேர்க்கப்பட்டன; பொருள்சார் புதிய தகவல் சேர்க்கப்படவில்லை.
