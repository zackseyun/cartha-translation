source:
  edition: SBLGNT
  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: ta
  text: இவர்களுக்காக மட்டும் நான் வேண்டிக்கொள்வதில்லை; இவர்களுடைய வார்த்தையின்[a] மூலம் என்னில் நம்பிக்கை வைப்பவர்களுக்காகவும் வேண்டிக்கொள்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செய்தியின்.’
    reason: λόγος என்பதற்கு இச்சூழலில் ‘வார்த்தை’ என்றும் ‘செய்தி’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: ἐρωτῶ
  choice: வேண்டிக்கொள்கிறேன்
  rationale: பிதாவிடம் இயேசு முன்வைக்கும் வேண்டுதலைக் குறிக்கும் யோவானியச் சூழலில் இது இயல்பான தமிழ். ‘ஜெபிக்கிறேன்’ என்று மொழிபெயர்த்து வினையின் அடிப்படைப் பொருளுக்கு மேலான பக்திசார் நிறத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: περὶ τούτων
  choice: இவர்களுக்காக
  rationale: περί + மரபுவேற்றுமை இங்கு வேண்டுதலின் பொருளாக உள்ளவர்களைக் குறிக்கிறது. தமிழில் ‘இவர்களுக்காக’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘இவர்கள்’ என்பது முந்தைய சூழலிலுள்ள சீடர்களை மேலதிக விளக்கமின்றிச் சுட்டுகிறது.
- source_word: μόνον
  choice: மட்டும்
  rationale: வேண்டுதலின் வரம்பைக் கட்டுப்படுத்தும் μόνον என்பதற்கான இயல்பான நவீனத் தமிழ் இணை.
- source_word: ἀλλὰ καὶ
  choice: …க்காகவும்
  rationale: தமிழின் ‘மட்டும் … அல்ல; …வும்’ அமைப்பு கிரேக்கத்தில் உள்ள முரண்பாட்டையும் கூடுதல் விரிவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν πιστευόντων
  choice: நம்பிக்கை வைக்கிறவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்பெயரின் வினைத்தன்மையைப் பாதுகாக்கிறது; ‘விசுவாசிகள்’ என்ற நிலையான வகைப்பெயரை விட இது மூலத்திற்கு நெருக்கமானது.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: இவர்களுடைய வார்த்தையின் மூலம்
  rationale: διά காரணமாகிய வழிமூலத்தையும், λόγος என்பதன் ‘வார்த்தை/செய்தி’ பரப்பையும் வெளிப்படுத்துகிறது. ‘வார்த்தை’ யோவான் நூலின் சொல் ஒலியையும் மூலத்தின் ஒருமையையும் காக்கிறது.
- source_word: εἰς ἐμέ
  choice: என்மேல் நம்பிக்கை வைக்கிற
  rationale: πιστεύω + εἰς என்ற தனிப்பட்ட நம்பிக்கையைக் குறிக்கும் யோவானிய அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சொற்குச் சொல் ‘எனக்குள்’ என்பது இங்கு தவறாகப் புரியக்கூடும்.
theological_decisions:
- issue: உடனிருந்த சீடர்களைத் தாண்டி இயேசுவின் வேண்டுதல் விரிவடைவது
  choice: சீடர்களுடைய வார்த்தையின் மூலம் இயேசுவின்மேல் நம்பிக்கை வைக்கிற மற்றவர்களும் வேண்டுதலில் சேர்க்கப்படுகிறார்கள்.
  alternative: ஏற்கெனவே சீடர்களின் வார்த்தையால் நம்பத் தொடங்கிய ஒரு குறுகிய வட்டத்தினரை மட்டும் இது குறிக்கலாம்.
  rationale: τῶν πιστευόντων என்பது காலத்தைத் தெளிவாக வரையறுக்காத நிகழ்காலப் பங்கேற்பெயர். ஆகவே எதிர்காலத்தை வெளிப்படையாகச் சேர்க்காமல், பின்னர் நம்பப்போகிறவர்களையும் ஏற்கெனவே நம்புகிறவர்களையும் உள்ளடக்கக்கூடிய மூலத்தின் திறந்த நிலை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டிக்கொள்கிறேன்’ என்பது ஜெபச் சூழலை இயல்பாக உணர்த்துகிறது; ‘என்மேல் நம்பிக்கை வைக்கிறவர்கள்’ என்பது சமயக் குழுவுக்கே உரிய சொற்றொடரைத் தவிர்த்து தனிப்பட்ட நம்பிக்கையைத் தெளிவாக்குகிறது.
