source:
  edition: SBLGNT
  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: ta
  text: ஆனால் இப்போது நான் உம்மிடம் வருகிறேன்; அவர்கள் என் மகிழ்ச்சியைத் தங்களுக்குள் நிறைவாகக் கொண்டிருக்கும்படி, நான் இவற்றை உலகத்தில் பேசுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்களுக்குள்” என்பதை “அவர்களிடையே” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: ஆனால் இப்போது
  rationale: νῦν நிகழ்காலத் தருணத்தைக் குறிக்கிறது; δέ முந்திய கருத்திலிருந்து மென்மையான மாறுபாட்டைத் தருகிறது.
- source_word: πρὸς σὲ ἔρχομαι
  choice: நான் உம்மிடம் வருகிறேன்
  rationale: πρός உடன் வரும் நிகழ்கால ἔρχομαι பிதாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது. இறைமரியாதைக்கேற்ற ஒருமை வடிவமாக ‘உம்மிடம்’ பயன்படுத்தப்பட்டது.
- source_word: ταῦτα λαλῶ
  choice: இவற்றைப் பேசுகிறேன்
  rationale: λαλέω உரைத்தல் அல்லது பேசுதலைக் குறிக்கிறது; இவ்வடிவம் தமிழில் இயல்பாகவும் நிகழ்காலச் செயலைத் தெளிவாகவும் தருகிறது.
- source_word: ἐν τῷ κόσμῳ
  choice: நான் உலகத்தில் இருக்கும்போதே
  rationale: சொல்லுக்குச் சொல் ‘உலகத்தில்’ என்றாலும், இயேசு உலகத்தில் இருக்கும்போது இவற்றைப் பேசுகிறார் என்ற சூழல்சார் காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘உலகம்’ என்ற யோவானிய சொல் பாதுகாக்கப்படுகிறது.
- source_word: ἵνα ἔχωσιν
  choice: அவர்களுக்குள் … இருக்கும்படி
  rationale: ἵνα நோக்கத்தை அறிமுகப்படுத்துகிறது. தமிழ் வாக்கியத்தில் ‘இருக்கும்படி’ அந்த நோக்க உறவை இயல்பாகக் காட்டுகிறது.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: என் மகிழ்ச்சி
  rationale: வலியுறுத்தப்பட்ட உடைமை அமைப்பு இயேசுவுக்குரிய மகிழ்ச்சியைக் குறிக்கிறது; கூடுதல் விளக்கமின்றி ‘என் மகிழ்ச்சி’ இதைப் பாதுகாக்கிறது.
- source_word: πεπληρωμένην
  choice: நிறைவுபெற்றிருக்க
  rationale: πληρόω-வின் perfect passive participle மகிழ்ச்சி முழுமைக்குக் கொண்டுவரப்பட்டு அந்த நிலையில் இருப்பதைக் குறிக்கிறது. ‘நிறைவுபெற்றிருக்க’ நிறைவும் விளைவு நிலையும் இரண்டையும் தருகிறது.
- source_word: ἐν ἑαυτοῖς
  choice: அவர்களுக்குள்
  rationale: சீடர்களின் உள்ளார்ந்த அனுபவத்தைக் குறிக்கும் இயல்பான தமிழ். இதற்கு ‘அவர்களிடையே’ என்ற கூட்டுப் பொருளும் இலக்கண ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ‘என் மகிழ்ச்சி’ என்பதன் இயல்பு
  choice: இயேசுவுக்குரிய மகிழ்ச்சி சீடர்களுக்குள் முழுமையாக இருக்க வேண்டும்
  alternative: இயேசுவைப் பற்றிய சீடர்களின் மகிழ்ச்சி
  rationale: ἐμὴν என்ற உடைமைச் சொல் இயல்பாக இயேசுவின் சொந்த மகிழ்ச்சியைக் குறிக்கிறது. அதில் அவர்கள் எவ்வாறு பங்குபெறுகிறார்கள் என்பதை உரை விரிவாக விளக்காததால் மொழிபெயர்ப்பும் அதைத் தீர்மானித்து விரிவாக்கவில்லை.
- issue: ἐν ἑαυτοῖς என்பதன் வரம்பு
  choice: அவர்களுக்குள், அதாவது அவர்களின் உள்ளார்ந்த அனுபவத்தில்
  alternative: அவர்களிடையே, அதாவது சீடர் சமூகத்தின் நடுவில்
  rationale: பன்மை reflexive வடிவம் இரு நுணுக்கங்களையும் தாங்கக்கூடும். இச்சூழலில் மகிழ்ச்சியை ‘கொண்டிருப்பது’ உள்ளார்ந்த பொருளுக்கு ஆதரவளித்தாலும், மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டது. இயேசு பிதாவை நேரடியாக அழைப்பதால் ‘உம்மிடம்’ என்ற உயர்மரியாதை ஒருமை வடிவம் தேர்ந்தெடுக்கப்பட்டது. கிரேக்கத்தின் ஒரே நீளமான வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; நோக்க உறவு மாறாமல் காக்கப்பட்டது.
