id: JHN.17.23
reference: John 17:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: ta
  text: நான் அவர்களில் இருக்கிறேன்; நீர் என்னில் இருக்கிறீர். அவர்கள் ஒன்றாய் முழுமைப்படுத்தப்பட்டிருக்கும்படியாக[a], உலகம் நீர் என்னை அனுப்பினீர் என்றும், நீர் என்னை அன்புகூர்ந்ததுபோலவே அவர்களையும் அன்புகூர்ந்தீர் என்றும் அறிந்துகொள்ளும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒன்றாய் முழுமைப்படுத்தப்பட்டிருக்கும்படியாக” அல்லது “ஒன்றாய் நிறைவுக்குக் கொண்டுவரப்பட்டிருக்கும்படியாக.”
    reason: τετελειωμένοι என்பதில் முழுமைப்படுத்தப்படுதல் அல்லது நிறைவுக்குக் கொண்டுவரப்படுதல் ஆகிய நுணுக்கங்கள் உள்ளன.
lexical_decisions:
- source_word: ἐν αὐτοῖς / ἐν ἐμοί
  choice: அவர்களில் / என்னில்
  rationale: யோவான் நற்செய்தியில் முக்கியமான உள்ளுறைதல் மொழியைப் பாதுகாக்க, ἐν என்பதற்கு நேரடியாக ‘இல்’ பயன்படுத்தப்பட்டுள்ளது; ‘அவர்களிடையே’ என்பது இந்த பரஸ்பர உள்ளுறைதல் நுணுக்கத்தைத் தளர்த்தும்.
- source_word: τετελειωμένοι
  choice: முழுமைபெற்றிருக்க
  rationale: Perfect passive participle குறிக்கும், நிறைவேற்றப்பட்ட செயலின் விளைவாகத் தொடரும் நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. இது அறவே பாவமற்ற பரிபூரண நிலையை மட்டும் கட்டாயப்படுத்தாமல், நிறைவுக்குக் கொண்டுவரப்படுதல் என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: εἰς ἕν
  choice: ஒன்றாய்
  rationale: εἰς காட்டும் விளைவு அல்லது இலக்கான ஒருமையை இயல்பான தமிழில் தெரிவிக்கிறது; வெறுமனே ஏற்கெனவே உள்ள ஒரு நிலையை மட்டும் விவரிப்பதில்லை.
- source_word: γινώσκῃ
  choice: அறிந்துகொள்ள
  rationale: ἵνα-வுக்குப் பின் வரும் நிகழ்கால subjunctive-இன் நோக்கப் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: κόσμος
  choice: உலகம்
  rationale: யோவானின் வழக்கமான சொல்லாட்சியை விளக்கவுரை சேர்க்காமல் அப்படியே தக்கவைக்கிறது.
- source_word: ἀπέστειλας
  choice: அனுப்பினீர்
  rationale: பிதா மகனை அனுப்பிய செயலை எளிமையாகவும் யோவானின் பயன்பாட்டுக்கு ஒத்தவாறும் தெரிவிக்கிறது.
- source_word: ἠγάπησας
  choice: அன்புகூர்ந்தீர்
  rationale: இரு இடங்களிலும் ஒரே வினைச்சொல் திரும்ப வருவதைப் பாதுகாத்து, உயர்வான ஆனால் தற்போதைய பொதுத் தமிழுக்கு இயல்பான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: καθὼς
  choice: அன்புகூர்ந்ததுபோலவே
  rationale: ‘போலவே’ என்பது ஒப்பீட்டின் முழு வலிமையையும் மென்மைப்படுத்தாமல் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘நீர் என்னை அன்புகூர்ந்ததுபோலவே அவர்களையும் அன்புகூர்ந்தீர்’ என்ற ஒப்பீட்டின் வலிமை
  choice: ஒப்பீட்டைத் தளர்த்தாமல் ‘போலவே’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘என்னை அன்புகூர்ந்ததைப் போன்ற அன்பினால்’ போன்ற விளக்கமான அல்லது தளர்த்தப்பட்ட மொழிபெயர்ப்பு
  rationale: καθὼς உண்மையான ஒப்பீட்டை முன்வைக்கிறது. பிதா விசுவாசிகள்மீது கொண்ட அன்புக்கும் மகன்மீது கொண்ட அன்புக்கும் இடையிலான இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு தீர்த்துவிடவோ குறைக்கவோ கூடாது.
- issue: τετελειωμένοι என்பதன் சூழல்சார் பொருள்
  choice: ஒருமையை நோக்கிய நிறைவு என்ற பொருளில் ‘ஒன்றாய் முழுமைபெற்றிருக்க’ என்று வழங்குதல்
  alternative: அறவே பாவமற்ற பரிபூரணத்தை மட்டும் உணர்த்தும் மொழி அல்லது ‘ஒருமையில் நிறைவடைந்திருக்க’ என்ற அதிக விளக்கமான மொழி
  rationale: τελειόω நிறைவு அல்லது முழுமைக்குக் கொண்டுவருதலைக் குறிக்க முடியும். தேர்ந்த மொழி மாற்றத்தின் விளைவுநிலையைத் தக்கவைத்து, முழுமையான பாவமின்மையை வசனம் கூறுவதாக முன்கூட்டியே முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பிதாவை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘நீர்’ வடிவம் கடைப்பிடிக்கப்பட்டுள்ளது. வசனம் தனியாக வாசிக்கப்படும்போது இலக்கண நிறைவு பெற ‘இது நிகழ்கிறது’ சேர்க்கப்பட்டுள்ளது; இரு ἵνα நோக்கவாக்கியங்களும் ‘-ம்படியாகவும்’ என்ற இணை அமைப்பில் பாதுகாக்கப்பட்டுள்ளன.
