  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: ta
  text: ஏனெனில், நீர் எனக்குக் கொடுத்த வார்த்தைகளை நான் அவர்களுக்குக் கொடுத்திருக்கிறேன்[a]; அவர்களும் அவற்றைப் பெற்றுக்கொண்டார்கள், நான் உம்மிடமிருந்து வந்தேன்[b] என்பதை உண்மையாக அறிந்துகொண்டார்கள், நீரே என்னை அனுப்பினீர் என்று நம்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீர் எனக்குக் கொடுத்த உரைகளை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் உம்மிடமிருந்து புறப்பட்டு வந்தேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: வார்த்தைகள்
  rationale: பேசப்பட்ட சொற்கள் அல்லது உரைகள் என்ற பன்மை, தெளிவான பொருளைத் தக்கவைக்கிறது; ஒருமையான ‘செய்தி’ என்பதைவிட மூலத்தின் வடிவத்திற்கு நெருக்கமானது.
- source_word: ἔδωκάς ... δέδωκα
  choice: கொடுத்த ... கொடுத்திருக்கிறேன்
  rationale: முதல் வினையின் இறந்தகாலச் செயலும், இரண்டாம் வினையின் நிறைவுற்று இப்போதும் விளைவு கொண்ட நிலையுமாகிய வேறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἔλαβον
  choice: பெற்றுக்கொண்டு
  rationale: கொடுக்கப்பட்டவற்றைப் பெற்றுக்கொண்டார்கள் என்ற சூழல்சார் பொருளைத் தருகிறது; ‘ஏற்றுக்கொண்டார்கள்’ என்பதில் உள்ள கூடுதல் விளக்கப் பொருளைத் தவிர்க்கிறது.
- source_word: ἔγνωσαν ἀληθῶς
  choice: உண்மையாக அறிந்துகொண்டார்கள்
  rationale: ἀληθῶς என்பதன் ‘உண்மையாக’ என்ற வலியுறுத்தலையும், γινώσκω இங்கு குறிக்கும் அறிதலை அடைந்த நிகழ்வையும் பாதுகாக்கிறது.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: உம்மிடமிருந்து வந்தேன்
  rationale: தோற்றம் அல்லது புறப்பாட்டின் மூலத்தை இயல்பான நவீனத் தமிழில் கூறுகிறது; அதன் இறையியல் நிறையை மேலதிக விளக்கமின்றி திறந்தவாறே வைக்கிறது.
- source_word: ἐπίστευσαν
  choice: நம்பினார்கள்
  rationale: ὅτι உடன் வரும் கூற்றை உண்மையென்று நம்பியதை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἀπέστειλας
  choice: அனுப்பினீர்
  rationale: தந்தை இயேசுவை அனுப்பிய செயலை கூடுதல் கோட்பாட்டுச் சொல்லாக்கமின்றி நேரடியாகக் கூறுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: வசனத்தின் தொடக்கத்தில் முந்தைய கூற்றுக்கான விளக்கம் அல்லது காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: παρὰ σοῦ ἐξῆλθον என்பதில் இயேசுவுக்கும் தந்தைக்கும் இடையிலான உறவு
  choice: நான் உம்மிடமிருந்து வந்தேன்
  alternative: நான் உம்மிடமிருந்து புறப்பட்டு வந்தேன்
  rationale: ‘உம்மிடமிருந்து’ என்பது மூலத்தோற்றத்தைக் குறிக்கும் கூற்றைப் பாதுகாக்கிறது; அதனைப் பிற்காலக் கோட்பாட்டுச் சொற்களால் தீர்மானித்து விளக்குவதில்லை.
- issue: ὅτι தொடரில் πιστεύω என்பதன் பொருள்
  choice: என்று நம்பினார்கள்
  alternative: என்று விசுவாசித்தார்கள்
  rationale: இங்கு நம்பிக்கையின் பொருள் ஒரு கூற்றாக இருப்பதால், ‘நம்பினார்கள்’ என்பது தொடரமைப்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- issue: σύ என்பதன் வெளிப்படையான வலியுறுத்தல்
  choice: நீரே என்னை அனுப்பினீர்
  alternative: நீர் என்னை அனுப்பினீர்
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடம்பெறும் σύ தரும் வலியுறுத்தலை ‘நீரே’ என்று பாதுகாக்கிறது.
translation_notes:
  register: மரியாதை ஒருமையான ‘நீர்/உம்மிடமிருந்து/அனுப்பினீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. நடை நவீனமும் கண்ணியமானதும்; ‘கொடுத்திருக்கிறேன்’ கிரேக்க நிறைவேற்றுக் காலத்தின் தற்போதைய விளைவை இயல்பாக எடுத்துரைக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
