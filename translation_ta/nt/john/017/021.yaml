revisions:
- from: அவர்கள் எல்லாரும் ஒன்றாய் இருக்கும்படி[a]—தந்தையே, நீங்கள் என்னிலும் நான் உங்களிலும் இருப்பதுபோல—அவர்களும் நமக்குள் இருக்கும்படி[b], நீங்கள் என்னை அனுப்பினீர்கள் என்று உலகம் நம்பும்படி[c].
  to: அவர்கள் எல்லாரும் ஒன்றாக இருக்கும்படி[a]—தந்தையே, நீர் என்னில் இருப்பதுபோலவும் நான் உம்மில் இருப்பதுபோலவும்—அவர்களும் நம்மில் இருக்கும்படி[b], நீர் என்னை அனுப்பினீர் என்று உலகம் நம்பும்படி[c].
  rationale: The revision directly represents ἓν as “ஒன்றாக,” retains all three ἵνα purpose clauses, and uses respectful singular Tamil forms to reflect the Greek singular address to the Father. The repeated ἐν is rendered consistently with “என்னில் … உம்மில் … நம்மில்.” Footnote anchors and their respective functions are retained.
