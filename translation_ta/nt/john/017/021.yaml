source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: ta
  text: அவர்கள் எல்லாரும் ஒன்றாக இருக்கும்படி[a]—தந்தையே, நீர் என்னில் இருப்பதுபோலவும் நான் உம்மில் இருப்பதுபோலவும்—அவர்களும் நம்மில் இருக்கும்படி[b], நீர் என்னை அனுப்பினீர் என்று உலகம் நம்பும்படி[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் எல்லாரும் ஒன்றுபட்டிருக்கும்படி.” கிரேக்கத்தில் இன்னும் சொற்சார்பாக, “அவர்கள் எல்லாரும் ஒன்றாக இருக்கும்படி” என்று உள்ளது; இது ஒற்றுமையை ஒரு குறிப்பிட்ட அம்சத்திற்குள் குறுக்காமல் அதன் விரிவான பொருளைப் பாதுகாக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “என்னில்,” “உம்மில்,” “நம்மில்” என்று திரும்பத் திரும்ப வரும் சொற்றொடர், பரஸ்பர உள்ளிருப்பையும் பங்கேற்பையும் குறிக்கும் யோவானின் மொழிநடையைப் பிரதிபலிக்கிறது; இது வெறும் தொடர்பைவிட வலிமையானது.
    reason: cross_reference
  - marker: c
    text: அல்லது, “நம்பத் தொடங்கும்படி.” உலகம் நம்புவதைக் கிரேக்கம் குறிப்பிடுகிறது; நம்பத் தொடங்குவதா அல்லது நம்பிக்கையில் தொடர்வதா என்பதில் எது வலியுறுத்தப்படுகிறது என்பதை அது வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: இருக்கும்படி / நம்பும்படி
  rationale: மூன்று ἵνα நோக்கவாக்கியங்களின் தொடர்ச்சியைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: πάντες ἓν ὦσιν
  choice: அவர்கள் எல்லாரும் ஒன்றாய் இருக்கும்படி
  rationale: ἓν என்பதன் ‘ஒன்று’ என்ற திறந்த பொருளைப் பாதுகாத்து, ஒற்றுமையின் தன்மையை மொழிபெயர்ப்பிலேயே குறுகலாக வரையறுப்பதைத் தவிர்க்கிறது.
- source_word: καθὼς
  choice: இருப்பதுபோல
  rationale: நம்புகிறவர்களின் ஒன்றாயிருத்தலுக்கும் தந்தை–மகன் உறவுக்கும் இடையிலான ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πάτερ
  choice: தந்தையே
  rationale: நேரடி விளிப்பையும் அதன் உறவுசார், இறையியல் வலிமையையும் தக்கவைக்கிறது.
- source_word: ἐν ἐμοὶ ... ἐν σοί ... ἐν ἡμῖν
  choice: என்னிலும் ... உங்களிலும் ... நமக்குள்
  rationale: மூன்று இடங்களிலும் ἐν என்பதன் ‘உள்/இல்’ சார்ந்த பொருளைத் தக்கவைத்து, வெறும் உடனிருப்பு அல்லது தொடர்பு என்று பலவீனப்படுத்தாமல் யோவானின் பரஸ்பர உள்ளிருப்பு மொழியைப் பாதுகாக்கிறது.
- source_word: κόσμος
  choice: உலகம்
  rationale: யோவான் எழுத்துகளில் இறையியல் செறிவுடன் வரும் வழக்கமான சொல்லையும் அதன் பரந்த எல்லையையும் பாதுகாக்கிறது.
- source_word: πιστεύῃ
  choice: நம்பும்படி
  rationale: நம்பத் தொடங்குவதா அல்லது நம்பிக்கையில் தொடர்வதா என்பதைத் தனியே தீர்மானிக்காமல், கிரேக்க நிகழ்கால துணைவினையின் திறந்த தன்மையைத் தக்கவைக்கிறது.
- source_word: ἀπέστειλας
  choice: அனுப்பினீர்கள்
  rationale: கிரேக்க இறந்தகால வினையை இயல்பான தமிழ் இறந்தகாலமாக வழங்குகிறது.
theological_decisions:
- issue: நம்புகிறவர்களின் ஒன்றாயிருத்தலின் தன்மை
  choice: ‘ஒன்றாய்’ என்று மொழிபெயர்த்து, அதன் தன்மையை விளக்கிச் சேர்க்காமல் விடுதல்
  alternative: ‘ஒரே நோக்கில் ஒன்றுபட்டவர்களாய்’ அல்லது ‘ஐக்கியப்பட்டவர்களாய்’
  rationale: உரை இந்த ஒன்றாயிருத்தலை அமைப்புசார், ஒழுக்கசார், நோக்கசார் அல்லது இயல்புசார் ஒற்றுமை என்று குறுகலாக வரையறுக்கவில்லை; எனவே அதன் இறையியல் ஆழமும் இழுப்பும் பாதுகாக்கப்படுகின்றன.
- issue: தந்தை, மகன் மற்றும் நம்புகிறவர்கள் குறித்த ‘ἐν’ மொழி
  choice: ‘என்னிலும்’, ‘உங்களிலும்’, ‘நமக்குள்’ என்ற உள்ளிருப்பு மொழியைத் தக்கவைத்தல்
  alternative: ‘என்னோடு’, ‘உங்களோடு’, ‘நம்மோடு’ அல்லது ‘நம்முடன் இணைந்திருக்க’
  rationale: ‘உடன்’ என்ற சொல் வெறும் தொடர்பாகப் பொருளைக் குறைக்கக்கூடும்; மூலத்தின் பரஸ்பர உள்ளிருப்பு மற்றும் பங்கேற்பு சார்ந்த செறிவை ‘இல்/உள்’ மொழி சிறப்பாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தெய்வத்தை ஒருமையில் மரியாதையுடன் சுட்ட ‘நீங்கள்’ பயன்படுத்தப்பட்டது. மூன்று நோக்கவாக்கியங்களும் தக்கவைக்கப்பட்டுள்ளன; இடைப்பட்ட ஒப்புமை நீளமான வாக்கியத்தில் தெளிவாகத் தெரிய நீண்ட கோடுகளால் பிரிக்கப்பட்டுள்ளது.
