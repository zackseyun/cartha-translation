lexical_decisions:
- source_word: ἁγίασον
  choice: புனிதப்படுத்தும்
  rationale: ἁγιάζω என்பதன் இறந்தகாலச் செயப்பாட்டு ஏவல் வடிவம். சீடர்களை தேவனுக்கென அர்ப்பணித்துப் பரிசுத்தமாக்க வேண்டும் என்ற இரு நுணுக்கங்களையும் ‘புனிதப்படுத்தும்’ காக்கிறது; ஜெபத்தில் இயேசு பிதாவை மரியாதையுடன் விளிப்பதால் ‘-உம்’ வடிவம் பயன்படுத்தப்பட்டது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: இது சீடர்களைக் குறிக்கும் பன்மை நேர்முக வேற்றுமைப் பெயர்ப்பதிலி; நவீனத் தமிழில் மனிதர்களுக்குரிய இயல்பான வடிவம் ‘அவர்களை’.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: உண்மையில்
  rationale: ἐν உடன் வரும் வேற்றுமை வடிவம் இடநிலை (‘உண்மையில்’) மற்றும் கருவிநிலை (‘உண்மையால்’) ஆகிய இரு சாத்தியங்களையும் கொண்டுள்ளது. ‘உண்மையில்’ என்பது முதன்மையான இடநிலை வடிவத்தைப் பாதுகாக்கிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὁ λόγος ὁ σὸς
  choice: உம்முடைய வார்த்தை
  rationale: λόγος இங்கு தேவன் தெரிவித்த வார்த்தையைக் குறிக்கிறது. ὁ σὸς அதன் உரிமையை வலியுறுத்துகிறது. பிதாவை நேரடியாக விளிக்கும் சூழலில் ‘உம்முடைய’ என்பது இயல்பான மரியாதை ஒருமை.
- source_word: ἀλήθειά ἐστιν
  choice: உண்மை
  rationale: ἀλήθεια இங்கு சுட்டுச் சொல் இல்லாத பயனிலைப் பெயர்ச்சொல். ஆகவே ‘உண்மை’ எனப் பெயர்ச்சொல் வலிமையைப் பாதுகாப்பது, ‘உண்மையானது’ என்று பண்பாக மட்டும் சுருக்குவதைக் காட்டிலும் மூலத்துக்கு நெருக்கமானது.
theological_decisions:
- issue: ἐν τῇ ἀληθείᾳ என்பதை இடநிலையாகவா கருவிநிலையாகவா மொழிபெயர்ப்பது
  choice: உண்மையில்
  alternative: உண்மையால்
  rationale: கிரேக்க ἐν இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது. முதன்மை உரையில் நேரடி இடநிலையை வைத்துக் கொண்டு, கருவிநிலைச் சாத்தியத்தை அடிக்குறிப்பில் குறிப்பிடுவது உண்மையே அவர்கள் புனிதப்படுத்தப்படும் வெளி என்றும் வழிமுறை என்றும் இருக்கக்கூடிய பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- issue: இரண்டாம் வாக்கியத்தின் ἀλήθεια பண்புத்தன்மையா அல்லது திட்டவட்ட அடையாளமா
  choice: உம்முடைய வார்த்தை உண்மை
  alternative: உம்முடைய வார்த்தையே அந்த உண்மை
  rationale: பயனிலைப் பெயர்ச்சொல்லுக்கு கிரேக்கத்தில் சுட்டுச் சொல் இல்லை. ‘உண்மை’ என்பது அதன் பண்புத்தன்மை மற்றும் பெயர்ச்சொல் வலிமையைப் பாதுகாக்கிறது; ‘அந்த உண்மை’ அல்லது ‘உண்மையே’ எனச் சேர்ப்பது மூலத்தில் வெளிப்படையாகக் குறிக்கப்படாத திட்டவட்ட அடையாளத்தை வலுப்படுத்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஜெப நடையில் மொழிபெயர்க்கப்பட்டது. தேவனை நோக்கிய உரையில் மரியாதை ஒருமையான ‘உம்முடைய’ மற்றும் ‘புனிதப்படுத்தும்’ பயன்படுத்தப்பட்டுள்ளன. ‘புனிதப்படுத்தும்’ என்பது சபை வழக்கில் அறியப்பட்டிருந்தாலும், ‘பரிசுத்தப்படுத்தும்’ என்பதைவிட இன்றைய பொதுத்தமிழில் சற்றே எளிதாகப் புரியும் வடிவம்.
