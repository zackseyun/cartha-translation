source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: ta
  text: என் தேவனோ தமது செல்வத்திற்கேற்ப மகிமையில் மேசியாவாகிய இயேசுவில் உங்கள் ஒவ்வொரு தேவைகளையும் நிறைவேற்றுவார்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கிறிஸ்துவாகிய இயேசுவில்.”'
    reason: lexical_alternative
  - marker: b
    text: “தமது செல்வத்திற்கேற்ப” என்பது தேவன் வழங்குவதற்கான அளவுகோலைக் குறிக்கிறது; அது வெறுமனே அவரது செல்வத்திலிருந்து வருகிறது என்பதை மட்டும் அல்ல.
    reason: alternative_reading
  - marker: c
    text: “மகிமையில்” என்பதை “மகிமையாக” அல்லது “மகிமையுடன்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: என் தேவனோ
  rationale: δέ இங்கு முந்தைய கருத்துடன் மென்மையான தொடர்பையும், பிலிப்பியர்கள் பவுலின் தேவையைச் சந்தித்ததற்குப் பதிலாக அவர்களுடைய தேவையை தேவன் சந்திப்பார் என்ற நுட்பமான எதிர்நிலையையும் தருகிறது. தமிழின் ‘-ஓ’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πληρώσει
  choice: நிறைவு செய்வார்
  rationale: இங்கு πληρόω என்பது குறைவாக இருப்பதை வழங்கி நிரப்புதல் என்ற பொருளில் வருகிறது. ‘நிறைவு செய்வார்’ என்பது தேவைகளைச் சந்திக்கும் கருத்தை இயல்பாகத் தருகிறது; வெறுமனே ‘நிரப்புவார்’ என்பதைவிட தமிழில் தெளிவாக உள்ளது.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: உங்கள் ஒவ்வொரு தேவையையும்
  rationale: χρεία தேவை அல்லது அவசியத்தைக் குறிக்கிறது; πᾶσαν என்பதன் பகிர்ந்தளிக்கும் வலிமையை ‘ஒவ்வொரு’ பாதுகாக்கிறது.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: தமது செல்வத்திற்கேற்ப
  rationale: accusative உடன் κατά இங்கு மூலத்தை மட்டும் அல்ல, அளவுகோலையோ தரத்தையோ குறிக்கிறது. ஆகவே தேவனுடைய செல்வத்திலிருந்து ஒரு பகுதி என்பதற்குப் பதிலாக, அதற்கேற்ற அளவில் வழங்குதல் என்ற கருத்து பாதுகாக்கப்படுகிறது.
- source_word: ἐν δόξῃ
  choice: மகிமையில்
  rationale: இந்த முன்னிடைச்சொல் தொடரின் துல்லியமான தொடர்பு கிரேக்கத்தில் திறந்தே உள்ளது. விளக்கமாக மாற்றாமல் நேரடியான வடிவம் வைக்கப்பட்டுள்ளது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவில்
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுகிறது. ‘மேசியாவாகிய’ என்பது அதன் பொருளைத் தெரிவிக்கிறது; ‘இயேசுவில்’ என்பது ἐν என்பதையும் பவுலின் ஒன்றிப்பு மொழியையும் சுருக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ என்பதில் Χριστός-ஐ எவ்வாறு மொழிபெயர்ப்பது
  choice: மேசியாவாகிய இயேசுவில்
  alternative: கிறிஸ்துவாகிய இயேசுவில்
  rationale: இங்கு Χριστός பெயராக உறைந்து போன சொல்லைவிட பட்டத்தின் வலிமையைக் கொண்டுள்ளது. எனவே அதன் பொருளை முதன்மை உரையில் தருகிறோம்; பாரம்பரிய ஒலிபெயர்ப்பை அடிக்குறிப்பில் வைத்திருக்கிறோம்.
- issue: ἐν δόξῃ எந்தச் சொல்லோடு தொடர்புடையது
  choice: ‘மகிமையில்’ என்று தொடர்பைத் தீர்மானிக்காமல் வைத்தல்
  alternative: ‘மகிமையாக’ அல்லது ‘மகிமையுடன்’ என்று வினையடைப் பொருளில் எடுத்தல்
  rationale: இந்தத் தொடர் ‘செல்வம்’ என்பதையோ, தேவன் தேவையை நிறைவு செய்வதையோ எவ்வாறு துல்லியமாக வரையறுக்கிறது என்பது இலக்கணரீதியாக முழுமையாகத் தெளிவில்லை. முதன்மை உரை அந்த இறையியல் மற்றும் இலக்கணத் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைத்தும் மிகப் பழமையான சொற்களைத் தவிர்த்தும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘என் தேவனோ’ என்பது δέ-யின் மென்மையான எதிர்நிலையை இயல்பாகக் காட்டுகிறது. தொடர்ச்சியான முன்னிடைச்சொல் தொடர்களின் தெளிவின்மையை மிகையாகத் தீர்க்காமல் இருக்க காற்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன.
