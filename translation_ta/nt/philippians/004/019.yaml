- from: என் தேவனோ தமது செல்வத்திற்கேற்ப, மகிமையில், மேசியாவாகிய இயேசுவில் உங்கள் ஒவ்வொரு தேவையையும் நிறைவு செய்வார்.[a][b][c]
  to: என் தேவனோ தமது செல்வத்திற்கேற்ப மகிமையில் மேசியாவாகிய இயேசுவில் உங்கள் ஒவ்வொரு தேவைகளையும் நிறைவேற்றுவார்.[a][b][c]
