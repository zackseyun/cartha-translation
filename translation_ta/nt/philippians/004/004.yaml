  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: ta
  text: 'ஆண்டவருக்குள் எப்போதும் மகிழ்ந்திருங்கள்[a]. மீண்டும் சொல்வேன்[b]: மகிழ்ந்திருங்கள்!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவருக்குள் எப்போதும் களிகூருங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “மீண்டும் சொல்வேன்: மகிழ்ந்திருங்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: மகிழ்ச்சியாயிருங்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு ஏவல்வினையின் இரண்டாம் நபர் பன்மை வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. இரு இடங்களிலும் ஒரே சொல்லை வைத்து பவுலின் வலியுறுத்தும் மறுபடியுரையைப் பாதுகாக்கிறது.
- source_word: ἐν
  choice: -க்குள்
  rationale: ஆண்டவருடனான உறவு அல்லது அவரோடு இணைந்திருக்கும் நிலை என்ற பரப்பைத் திறந்தவாறு வைத்திருக்கிறது; ‘அவரால்’ அல்லது ‘அவரினிமித்தம்’ என்று பொருளைச் சுருக்கித் தீர்மானிக்கவில்லை.
- source_word: κυρίῳ
  choice: ஆண்டவர்
  rationale: பவுலின் பயன்பாட்டில் இங்கு கிறிஸ்துவைக் குறிக்கும் κύριος என்பதற்கான மரியாதைமிக்க, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ச்சியான கால வலிமையை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: வலியுறுத்தும் மறுபடியுரையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ἐρῶ
  choice: சொல்வேன்
  rationale: λέγω என்பதன் எதிர்கால வடிவத்தை நிகழ்காலமாக மாற்றாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐν κυρίῳ என்பதன் பொருள்
  choice: ஆண்டவருக்குள்
  alternative: ஆண்டவரால்; ஆண்டவரினிமித்தம்
  rationale: ஆண்டவருடனான உறவு, ஒன்றிப்பு அல்லது அவரைச் சார்ந்த வாழ்வுப் பரப்பு ஆகிய நுணுக்கங்களை ஒரே பொருளாகச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியத்தக்க, மரியாதைமிக்க அறிவுறுத்தல் நடை. கிரேக்கத்தின் மறுபடியுரையும் எதிர்கால வினைவடிவமும் பாதுகாக்கப்பட்டுள்ளன.
