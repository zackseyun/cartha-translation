  yaml_path: translation/nt/philippians/004/016.yaml
  text: because even in Thessalonica you sent for my need both once and twice[a].
translation:
  language: ta
  text: ஏனெனில், தெசலோனிக்கேயில்கூட என் தேவைக்காக ஒருமுறையும் இருமுறையும் அனுப்பினீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் வழக்கமான நடையில், “என் தேவைக்காக ஒன்றுக்கு மேற்பட்ட முறை அனுப்பினீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள கருத்துக்கு விளக்கம் அல்லது காரணம் தரும் இணைப்பாக இயல்பாக அமைகிறது.
- source_word: καὶ ἐν Θεσσαλονίκῃ
  choice: தெசலோனிக்கேயில் இருந்தபோதும்கூட
  rationale: ἐν என்பதன் இடப்பொருளைப் பேணுவதோடு, καὶ தரும் ‘அப்போதும்கூட’ என்ற வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ ἅπαξ καὶ δὶς
  choice: ஒருமுறையும் மறுமுறையும்
  rationale: சொற்றொடரின் வலியுறுத்தலையும் மீண்டும் செய்ததன் பொருளையும் இயல்பான, கண்ணியமான தமிழில் பேணுகிறது.
- source_word: εἰς τὴν χρείαν μοι
  choice: என் தேவைக்காக
  rationale: χρεία என்ற ஒருமை வடிவத்தை ‘தேவை’ என்று பேணி, அனுப்பப்பட்டது பவுலின் தேவையை நோக்கியது என்பதைக் காட்டுகிறது.
- source_word: ἐπέμψατε
  choice: அனுப்பினீர்கள்
  rationale: கிரேக்க வினைச்சொல்லில் வெளிப்படையாக இல்லாத ‘உதவி’ அல்லது ‘பொருள்’ போன்ற செயப்படுபொருளைச் சேர்க்காமல் அதன் திறந்த தன்மையைப் பேணுகிறது.
