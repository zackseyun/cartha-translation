id: PHP.4.7
reference: Philippians 4:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: ta
  text: எல்லாப் புரிதலையும் மிஞ்சுகிற தேவனுடைய சமாதானம், மெசியாவாகிய இயேசுவில்[a] உங்கள் இருதயங்களையும் உங்கள் எண்ணங்களையும் காக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து இயேசுவில்.”
    reason: Χριστός என்பதைக் ‘மெசியா’ என்ற பொருள்மொழிபெயர்ப்பாகவோ, மரபான ‘கிறிஸ்து’ என்ற வடிவிலோ வழங்கலாம்.
lexical_decisions:
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: இங்கு தேவன் அருளும் உள்ளார்ந்த அமைதியையும் முழுநலத்தையும் சுட்டும் வழக்கமான, வேதாகமப் பயன்பாட்டுக்கேற்ற தமிழ்ச் சொல்.
- source_word: τοῦ θεοῦ
  choice: தேவனுடைய
  rationale: கிரேக்கச் சொற்றொடரின் உடைமை வேற்றுமையை நேரடியாகப் பாதுகாக்கிறது; ‘தேவனிடமிருந்து’ என்று மூலத்தை மட்டும் விளக்கிப் பொருளைச் சுருக்கவில்லை.
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: எல்லாப் புரிதலையும் மிஞ்சுகிற
  rationale: ὑπερέχουσα என்பதன் ‘மேலோங்குதல்/மிஞ்சுதல்’ என்ற வலிமையையும், νοῦς இங்கு அறிவால் புரிந்துகொள்ளும் திறனைக் குறிப்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: φρουρήσει
  choice: காக்கும்
  rationale: எதிர்காலச் செயலைத் தெளிவாகக் காட்டுவதோடு, வினையின் காவல் அல்லது பாதுகாப்பு நிழற்பொருளையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: τὰς καρδίας ὑμῶν
  choice: உங்கள் இருதயங்களை
  rationale: உள்ளார்ந்த வாழ்வு, உணர்வுகள், ஆளுமையின் மையம் ஆகிய வேதாகம நிழற்பொருள்களை ‘இருதயம்’ தக்கவைக்கிறது.
- source_word: τὰ νοήματα ὑμῶν
  choice: உங்கள் எண்ணங்களை
  rationale: νοήματα என்பது மனம் என்ற உறுப்பைவிட எண்ணங்கள் அல்லது சிந்தனைகளைக் குறிக்கிறது; எனவே கிரேக்கப் பன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவில்
  rationale: Χριστός என்பதன் பட்டப்பெயர் வலிமையை ‘மெசியா’ என மொழிபெயர்த்து, ἐν என்பதன் ஒன்றிப்பிலும் வாழ்விடத்திலும் உள்ள உறவை ‘இயேசுவில்’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ என்ற பவுலின் சொற்றொடரில் Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவாகிய இயேசுவில்
  alternative: கிறிஸ்து இயேசுவில்
  rationale: இங்கு Χριστός வெறும் உறைந்த பெயராக மட்டுமல்லாமல் இயேசுவின் பட்டத்தையும் சுட்டுகிறது. ஆகவே பொருளை மொழிபெயர்க்கும் ‘மெசியா’ முதன்மை உரையில் வைக்கப்பட்டது; மரபான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: πάντα νοῦν என்பதன் பரப்பு
  choice: எல்லாப் புரிதலையும்
  alternative: ஒவ்வொரு மனதையும்
  rationale: சூழலில் தேவனுடைய சமாதானம் அறிவாற்றலால் முழுமையாகப் பற்றிக்கொள்ள முடியாதது என்பதே இயல்பான பொருள். இருப்பினும் கிரேக்கத்தில் νοῦς என்பதற்கு ‘மனம்’ என்ற சொற்பொருள் இருப்பதால் மொழிபெயர்ப்பு தேவையற்ற விளக்க விரிவைச் சேர்க்காமல் சுருக்கமாக வைக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. வசனத்தின் ஒரே நீண்ட வாக்கிய அமைப்பு காக்கப்பட்டுள்ளது; ‘இருதயங்கள்—எண்ணங்கள்’ என்ற இணைவும் எதிர்கால வினையும் மூலத்துக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன.
