  text: Nevertheless[b][a], you did well by sharing in my affliction.
translation:
  language: ta
  text: ஆனாலும்[a], என் துன்பத்தில் என்னோடு பங்குகொண்டதன் மூலம்[b] நீங்கள் நன்றாகச் செய்தீர்கள்.
