  to: எதைப் பற்றியும் கவலைப்படாதீர்கள்[a]. மாறாக, எல்லாவற்றிலும் நன்றியுடன் ஜெபத்தினாலும் வேண்டுதலினாலும் உங்கள் விண்ணப்பங்களைக் கடவுளிடம்[c] தெரியப்படுத்துங்கள்.
  rationale: ‘மன்றாட்டோடும்’ என்பதற்குப் பதிலாக ‘ஜெபத்தினாலும்’ பயன்படுத்தப்பட்டுள்ளது. இது προσευχή என்பதன் பொதுவான ‘ஜெபம்’ என்ற பொருளைத் தெளிவாகக் காட்டி, அதனுடன் வரும் δέησις-ஐ ‘வேண்டுதல்’ என வேறுபடுத்திப் பாதுகாக்கிறது. நன்றியுடனான ஜெபம் மற்றும் வேண்டுதல் என்ற மூலத் தொடர்பும், கோரிக்கைகளை கடவுளிடம் தெரிவிக்க வேண்டும் என்ற கட்டளையும் காக்கப்பட்டுள்ளன. குறிப்பு b-யின் சொற்பொருள் மாற்று செல்லுபடியாக இருந்தாலும், உரையில் அதன் குறியீடு இல்லை; எனவே அதை b குறியீட்டுடன் ‘வேண்டுதல்’ என்பதற்குப் பிறகு இணைக்க வேண்டும்.
