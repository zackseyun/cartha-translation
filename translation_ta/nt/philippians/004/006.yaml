base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: ta
  text: எதைப் பற்றியும் கவலைப்படாதீர்கள்[a]. மாறாக, எல்லாவற்றிலும் நன்றியுடன் ஜெபத்தினாலும் வேண்டுதலினாலும் உங்கள் விண்ணப்பங்களைக் கடவுளிடம்[c] தெரியப்படுத்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதைப் பற்றியும் மனக்கலக்கம் அடையாதீர்கள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கடவுளுக்கு முன்பாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: எதைப் பற்றியும் கவலைப்படாதீர்கள்
  rationale: மறுப்புக் கட்டளையுடன் வரும் μηδὲν என்பதன் முழுமையான பரப்பையும், μεριμνάω என்பதன் பதற்றம் கலந்த கவலை என்ற பொருளையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν παντὶ
  choice: எல்லாவற்றிலும்
  rationale: ஒவ்வொரு சூழலையும் உள்ளடக்கும் கிரேக்கச் சொற்றொடரின் விரிவான பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τῇ προσευχῇ
  choice: மன்றாட்டோடும்
  rationale: கடவுளை நோக்கிச் செய்யப்படும் பொதுவான ஜெபத்தை குறிக்கிறது; அடுத்துள்ள குறிப்பிட்ட வேண்டுதலிலிருந்து வேறுபாட்டையும் இயன்றவரை காக்கிறது.
- source_word: τῇ δεήσει
  choice: வேண்டுதலோடும்
  rationale: குறிப்பிட்ட தேவையை முன்வைத்து வேண்டுதல் செய்யும் δέησις என்பதன் பொருளை எளிய தமிழில் தருகிறது.
- source_word: μετ’ εὐχαριστίας
  choice: நன்றியுடன் கூடிய
  rationale: நன்றி செலுத்தும் மனப்பான்மையோடு மன்றாட வேண்டும் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: உங்கள் விண்ணப்பங்களை
  rationale: கடவுளிடம் கேட்கப்படும் குறிப்பிட்ட காரியங்களைக் குறிக்கிறது; முன்னுள்ள ‘வேண்டுதல்’ என்பதுடன் தேவையற்ற சொல் மீளலைத் தவிர்க்கிறது.
- source_word: γνωριζέσθω
  choice: தெரியப்படுத்துங்கள்
  rationale: கிரேக்கத்தின் மூன்றாம் நபர் இறைவேவலை தமிழில் இயல்பான நேரடிக் கட்டளையாக மாற்றுகிறது; வேண்டுகோள்கள் கடவுளிடம் முன்வைக்கப்பட வேண்டும் என்ற செயற்பாட்டைத் தெளிவாக வைக்கிறது.
- source_word: πρὸς τὸν θεόν
  choice: கடவுளிடம்
  rationale: πρός என்பதன் திசைநோக்கிய பொருளையும் ‘தெரியப்படுத்துதல்’ என்பதுடன் இயல்பான தமிழ் இணைப்பையும் தருகிறது.
theological_decisions:
- issue: கவலைப்பட வேண்டாம் என்ற கட்டளையின் பரப்பு
  choice: எதைப் பற்றியும் கவலைப்படாதீர்கள்
  alternative: எதற்காகவும் பதற்றமடையாதீர்கள்
  rationale: வசனம் எல்லா பொறுப்பான அக்கறையையும் தடை செய்கிறது என்று விரிவுபடுத்தாமல், μεριμνάω என்பதன் கவலை அல்லது மனக்கலக்கம் சார்ந்த பொருளையே மொழிபெயர்க்கிறது.
- issue: πρὸς τὸν θεόν என்பதன் உறவு
  choice: கடவுளிடம்
  alternative: கடவுளுக்கு முன்பாக
  rationale: தெரியப்படுத்தப்படும் விண்ணப்பங்களின் நோக்குநராகக் கடவுளைக் காட்டும் நேரடியான வாசிப்பை முதன்மைப்படுத்தி, இடநிலை அல்லது வழிபாட்டு நுணுக்கம் கொண்ட மாற்றை அடிக்குறிப்பில் வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. προσευχή மற்றும் δέησις இடையிலான பொதுவான மன்றாட்டு/குறிப்பிட்ட வேண்டுதல் வேறுபாடு தமிழில் இயன்றவரை காக்கப்பட்டுள்ளது; கிரேக்கச் செயலற்ற இறைவேவல் இயல்பான தமிழ் நேரடிக் கட்டளையாக வழங்கப்பட்டுள்ளது.
