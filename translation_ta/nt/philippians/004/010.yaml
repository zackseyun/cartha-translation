source:
  edition: SBLGNT
  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: ta
  text: கர்த்தருக்குள் நான் மிகவும் மகிழ்ந்தேன். ஏனெனில், என்மீது உங்களுக்கிருந்த அக்கறை இப்போது, ஒரு காலத்திற்குப் பிறகு, மீண்டும் துளிர்த்திருக்கிறது[a]. உண்மையில், நீங்கள் என்மீது அக்கறை கொண்டிருந்தீர்கள்[b]; ஆனால் அதற்கான வாய்ப்பு உங்களுக்குக் கிடைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “எனக்காக அக்கறை கொள்வதில் நீங்கள் மீண்டும் தழைத்தீர்கள்.”
    reason: மூல கிரேக்கத்தில் மீண்டும் மலர்வது அல்லது தழைப்பது பற்றிய உருவகம் உள்ளது; இயல்பான தமிழ் முதன்மை உரையில் ‘அக்கறை’ எழுவாயாக மாற்றப்பட்டுள்ளது.
  - marker: b
    text: அல்லது, “நீங்கள் என்னை நினைத்துக்கொண்டிருந்தீர்கள்.” கிரேக்க வினைச்சொல் நினைத்தல், ஒரு மனப்பாங்கைக் கொண்டிருத்தல், அல்லது அக்கறை கொள்ளுதல் என்று பொருள்படலாம்.
    reason: φρονέω என்பதிலுள்ள சொற்பொருள் வரம்பை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: Ἐχάρην
  choice: நான் மகிழ்ந்தேன்
  rationale: χαίρω என்பதன் இறந்தகால வினைச்செயலை நேரடியாகவும் இயல்பாகவும் தருகிறது; வெறும் மனநிறைவைவிட மகிழ்ச்சியின் வலிமையைக் காக்கிறது.
- source_word: ἐν κυρίῳ
  choice: கர்த்தருக்குள்
  rationale: பவுலின் வழக்கமான இறையியல் சொற்றொடரின் உறவு அல்லது செயல்படும் தளத்தைக் காக்கும் மரபான, புரிந்துகொள்ளத்தக்க தமிழ் வடிவம்.
- source_word: μεγάλως
  choice: மிகவும்
  rationale: மகிழ்ச்சியின் அளவை இயல்பான நவீன தமிழில் தெளிவாக வலியுறுத்துகிறது.
- source_word: ἤδη ποτὲ
  choice: இப்போது ஒருவழியாக
  rationale: ஒரு கால இடைவெளிக்குப் பின் அது மீண்டும் வெளிப்பட்டதைச் சொல்கிறது; பிலிப்பியரைப் பழிப்பதாகத் தேவையின்றி ஒலிக்காமல் ‘now at last’ என்ற நுணுக்கத்தைத் தருகிறது.
- source_word: ἀνεθάλετε
  choice: மீண்டும் துளிர்த்திருக்கிறது
  rationale: ‘மீண்டும் மலர்தல்/தழைத்தல்’ என்ற மூல உருவகத்தை இயல்பான தமிழில் காக்கிறது; தமிழில் வாக்கியம் இயல்பாக அமைய ‘அக்கறை’ எழுவாயாக அமைக்கப்பட்டுள்ளது.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: என்மீது உங்களுக்கிருந்த அக்கறை
  rationale: இங்கு φρονέω வெறும் நினைப்பை மட்டுமல்ல, பவுலை நோக்கிய செயற்படும் மனப்பாங்கையும் கவனத்தையும் குறிக்கிறது.
- source_word: ἐφ’ ᾧ
  choice: உண்மையில்
  rationale: அவர்களுக்கு அக்கறை இல்லாமல் போகவில்லை என்ற பவுலின் விளக்கத்தை தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: ἐφρονεῖτε
  choice: நீங்கள் என்மீது அக்கறை கொண்டிருந்தீர்கள்
  rationale: முந்தைய φρονεῖν உடன் பொருள் ஒற்றுமையைக் காத்து, அவர்கள் தொடர்ந்து கொண்டிருந்த மனப்பாங்கை வெளிப்படுத்துகிறது.
- source_word: ἠκαιρεῖσθε
  choice: அதற்கான வாய்ப்பு உங்களுக்குக் கிடைக்கவில்லை
  rationale: விருப்பமோ அக்கறையோ இல்லாததைக் குறிக்காமல், ஏற்ற சந்தர்ப்பம் இல்லாததையே தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ἐν κυρίῳ என்பதன் உறவு/தளப் பொருள்
  choice: கர்த்தருக்குள்
  alternative: கர்த்தரில்
  rationale: மகிழ்ச்சியை கர்த்தருடனான உறவுக்குள் அமைக்கும் பவுலின் மொழியைச் சுருக்கவோ வேறு காரணமாக விளக்கவோ செய்யாமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமத்திற்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘மீண்டும் துளிர்த்திருக்கிறது’ என்பது மூலத்தின் தாவர உருவகத்தை வாசகருக்கு இயல்பாகக் கொண்டு வருகிறது; ‘இப்போது ஒருவழியாக’ என்பது கால இடைவெளியை உணர்த்தினாலும் குற்றஞ்சாட்டும் தொனியைத் தவிர்க்கிறது.
