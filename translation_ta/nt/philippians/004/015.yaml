revisions:
- from: பிலிப்பியர்களே, நற்செய்தி அறிவிக்கப்பட்ட தொடக்கக் காலத்தில், நான் மக்கெதோனியாவைவிட்டுப் புறப்பட்டபோது, கொடுக்கல் வாங்கல் கணக்கில்[a] உங்களைத் தவிர வேறு எந்தத் திருச்சபையும் என்னோடு பங்குகொள்ளவில்லை என்பதை நீங்களும் நன்கு அறிந்திருக்கிறீர்கள்.
  to: மேலும், பிலிப்பியர்களே, நற்செய்தியின் தொடக்கத்தில், நான் மக்கெதோனியாவைவிட்டுப் புறப்பட்டபோது, கொடுக்கல் வாங்கல் கணக்கில்[a] உங்களைத் தவிர வேறு எந்தத் திருச்சபையும் என்னோடு பங்குகொள்ளவில்லை என்பதை நீங்களும் அறிந்திருக்கிறீர்கள்.
  rationale: The revision removes two additions to the source while preserving the discourse connective (“மேலும்”), the additive emphasis of καὶ ὑμεῖς (“நீங்களும்”), and the exclusive force of εἰ μὴ ὑμεῖς μόνοι through “உங்களைத் தவிர வேறு எந்தத் திருச்சபையும்.” It also leaves “the beginning of the gospel” unexpanded, preserving the Greek wording’s contextual ambiguity.
