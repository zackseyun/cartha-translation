reference: Philippians 4:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: ta
  text: மேலும், பிலிப்பியர்களே, நற்செய்தியின் தொடக்கத்தில், நான் மக்கெதோனியாவைவிட்டுப் புறப்பட்டபோது, கொடுக்கல் வாங்கல் கணக்கில்[a] உங்களைத் தவிர வேறு எந்தத் திருச்சபையும் என்னோடு பங்குகொள்ளவில்லை என்பதை நீங்களும் அறிந்திருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொடுப்பதும் பெற்றுக்கொள்வதும் பற்றிய காரியத்தில்.”
    reason: λόγος என்பது இங்கு ‘கணக்கு’ என்றும், பரந்த பொருளில் ‘காரியம்’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: Οἴδατε δὲ καὶ ὑμεῖς
  choice: நீங்களும் நன்கு அறிந்திருக்கிறீர்கள்
  rationale: οἶδα என்பதன் நிகழ்கால நிலைப்பொருளை இயல்பான தமிழில் தருகிறது; καὶ ὑμεῖς என்பதிலுள்ள சேர்த்தலும் வலியுறுத்தலும் ‘நீங்களும்’ என்பதில் வெளிப்படுகின்றன. δέ தனியாகக் கடுமையான எதிர்மறை இணைப்பாக மொழிபெயர்க்கப்படாமல் உரையின் தொடர்ச்சியில் இயல்பாக விடப்பட்டுள்ளது.
- source_word: Φιλιππήσιοι
  choice: பிலிப்பியர்களே
  rationale: விளிவேற்றுமை நேரடி அழைப்பை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: நற்செய்தி அறிவிக்கப்பட்ட தொடக்கக் காலத்தில்
  rationale: ‘நற்செய்தியின் தொடக்கத்தில்’ என்ற சொற்சார்ந்த வடிவம் தமிழில் தெளிவற்றதாக இருக்கலாம்; சூழலில் பவுலின் நற்செய்திப் பணியின் ஆரம்பக் கட்டத்தைக் குறிக்கும் வகையில், அதற்கு அதிகமான விளக்கத்தைச் சேர்க்காமல் இயல்பாக வழங்குகிறது.
- source_word: ὅτε ἐξῆλθον ἀπὸ Μακεδονίας
  choice: நான் மக்கெதோனியாவைவிட்டுப் புறப்பட்டபோது
  rationale: வெளியேறிச் சென்ற ஒருமுறை நிகழ்வை ‘புறப்பட்டபோது’ இயல்பாகக் காட்டுகிறது; ἀπό-வின் பிரிவுப் பொருள் ‘விட்டு’ என்பதால் வெளிப்படுகிறது.
- source_word: οὐδεμία μοι ἐκκλησία ἐκοινώνησεν
  choice: வேறு எந்தத் திருச்சபையும் என்னோடு பங்குகொள்ளவில்லை
  rationale: κοινωνέω-வின் கூட்டுப் பங்கேற்புப் பொருளையும் μοι-யின் உறவையும் பாதுகாக்கிறது; பொருளுதவி மட்டுமே என அளவுக்கு மீறிக் குறுக்காமல் நிதிசார் சூழலை அடுத்த சொற்றொடர் விளக்க அனுமதிக்கிறது.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: கொடுக்கல் வாங்கல் கணக்கில்
  rationale: λόγος இங்கு கணக்கு அல்லது பரிமாற்றப் பதிவு என்ற நிதிசார் நிழற்பொருளைக் கொண்டிருக்கலாம். ‘கொடுக்கல் வாங்கல்’ δόσεως καὶ λήμψεως என்ற இருதிசைப் பரிமாற்றத்தைச் சுருக்கமாகப் பாதுகாக்கிறது; பரந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: உங்களைத் தவிர
  rationale: விலக்கையும் ஒரே குழுவாகிய பிலிப்பியர்களின் தனித்தன்மையையும் இயல்பான தமிழில் தருகிறது; ‘நீங்கள் மட்டுமே’ என மீண்டும் கூறுவது தமிழில் தேவையற்ற இரட்டிப்பாக இருக்கும்.
theological_decisions:
- issue: ‘கொடுத்தலும் பெற்றுக்கொள்ளுதலும்’ யாருடைய பார்வையிலிருந்து கூறப்படுகிறது என்பது
  choice: கொடுக்கல் வாங்கல் கணக்கில்
  alternative: கொடுப்பதும் பெற்றுக்கொள்வதும் பற்றிய காரியத்தில்
  rationale: கிரேக்கச் சொற்றொடர் கணக்கியல் மொழியாகவும் பொதுவான பரிமாற்றப் பங்கேற்பாகவும் புரிந்துகொள்ளப்படலாம்; முதன்மை உரை கணக்கியல் நிழற்பொருளை வைத்திருக்கிறது, அடிக்குறிப்பு பரந்த வாசிப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான திருமுக நடையைப் பயன்படுத்துகிறது. ‘திருச்சபை’, ‘நற்செய்தி’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன. வாக்கியத்தின் நீளம் மூலத்தின் தர்க்க ஓட்டத்தைப் பாதுகாக்கிறது; அதேவேளையில் தமிழில் முக்கிய வினைச்சொல் இறுதியில் இயல்பாக அமைக்கப்பட்டுள்ளது.
