source:
  edition: SBLGNT
  text: τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: ta
  text: உங்கள் கனிவான பண்பு எல்லாருக்கும் தெரியட்டும்.[a] ஆண்டவர் அருகில் இருக்கிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “உங்கள் மென்மை,” “உங்கள் பொறுத்துக்கொள்ளும் பண்பு,” அல்லது “உங்கள் நியாயமான அணுகுமுறை.”
    reason: lexical_alternative
  - marker: b
    text: “ஆண்டவர் அருகில் இருக்கிறார்” என்பது ஆண்டவர் நம்முடன் நெருக்கமாக இருக்கிறார் என்பதையோ, அவரது வருகை நெருங்கியுள்ளது என்பதையோ, அல்லது இரண்டையுமோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: கனிவான பண்பு
  rationale: இச்சொல் வெறும் மென்மையான குணத்தை மட்டுமல்லாமல், பிறரைக் கருத்தில் கொண்டு நடந்துகொள்ளும், வற்புறுத்தாமல் விட்டுக்கொடுக்கும் கனிவான நடத்தையையும் குறிக்கிறது. ‘கனிவான பண்பு’ இந்த விரிவான அறநெறிப் பொருளை இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: γνωσθήτω
  choice: தெரியட்டும்
  rationale: இறந்தகாலச் செயப்பாட்டு ஏவல் வடிவத்தின் ‘அறியப்படட்டும்’ என்ற பொருளை, இயல்பான தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: πᾶσιν ἀνθρώποις
  choice: எல்லாருக்கும்
  rationale: பால் வேறுபாடின்றி அனைத்து மக்களையும் உள்ளடக்கும் கிரேக்கச் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் பட்டப்பெயர் சார்ந்த இறையியல் முக்கியத்துவத்தைப் பாதுகாக்கும் வழக்கமான, கண்ணியமான தமிழ் மொழிபெயர்ப்பு.
- source_word: ἐγγύς
  choice: அருகில்
  rationale: ஆண்டவர் உடனிருக்கிறார் என்ற இடம்சார் பொருளையும், அவரது வருகை நெருங்கியுள்ளது என்ற காலம்சார் பொருளையும் தீர்மானிக்காமல், கிரேக்கத்தின் பொருள் இருமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ὁ κύριος ἐγγύς என்பதன் பொருள்
  choice: ஆண்டவர் அருகில் இருக்கிறார்
  alternative: ஆண்டவர் நெருக்கத்தில் இருக்கிறார்; அல்லது ஆண்டவரின் வருகை நெருங்கியுள்ளது
  rationale: கிரேக்கத் தொடர் ஆண்டவரின் உடனிருப்பையும் அவரது வருகையின் நெருக்கத்தையும் குறிக்கக்கூடும். முதன்மை உரை எந்த ஒரு பொருளுக்கு மட்டும் இதைச் சுருக்காமல் அந்த இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கனிவான பண்பு’ என்பது ἐπιεικές என்பதன் பரந்த உறவுசார் அறநெறிப் பொருளைத் தக்கவைக்கிறது; ‘அருகில்’ என்பது இடம்சார் மற்றும் காலம்சார் பொருள் இருமையைப் பாதுகாக்கிறது.
