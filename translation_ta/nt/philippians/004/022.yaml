base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: ta
  text: பரிசுத்தவான்கள் அனைவரும் உங்களுக்கு வாழ்த்துத் தெரிவிக்கிறார்கள்; அவர்களுள் குறிப்பாகச் சீசரின் இல்லத்தைச் சார்ந்தவர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீசரின் இல்லத்திலிருந்து வந்தவர்கள்.” இச்சொற்றொடர் சீசரின் இல்லம், அதாவது பேரரசரின் இல்ல-நிர்வாக அமைப்புடன் தொடர்புடையவர்களைக் குறிக்கிறது; அவர்கள் சீசரின் குடும்ப உறவினர்களாகவே இருக்க வேண்டும் என்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: வாழ்த்துச் சொல்கிறார்கள்
  rationale: கடித முடிவில் ஒருவருக்கொருவர் வாழ்த்து தெரிவிப்பதைக் குறிக்கும் வழக்கமான வினை; நவீன தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: πάντες οἱ ἅγιοι
  choice: பரிசுத்தவான்கள் அனைவரும்
  rationale: பவுலின் கடிதங்களில் விசுவாசிகளைக் குறிக்கும் வழக்கமான பெயரடைச் சொல். ‘பரிசுத்தவான்கள்’ என்பது மூலச்சொல்லின் சொற்பொருளையும் இறையியல் நிறையையும் தக்கவைக்கிறது; இது தனிச்சிறப்புடைய ஒரு குறுகிய வகுப்பினரை மட்டும் குறிப்பதாகத் தீர்மானிப்பதில்லை.
- source_word: μάλιστα δὲ
  choice: குறிப்பாக
  rationale: பெரிய குழுவுக்குள் ஒரு பிரிவினருக்குத் தனி அழுத்தம் தருகிறது; δέ-யின் இணைப்புப் பணி தமிழில் நிறுத்தக்குறி மற்றும் தொடரமைப்பால் இயல்பாக வெளிப்படுகிறது.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: சீசரின் அரண்மனையைச் சேர்ந்தவர்கள்
  rationale: οἰκία இங்கு கட்டிடத்தை மட்டும் அல்லாமல் சீசரின் அரச குடும்ப நிர்வாகச் சூழலோடு தொடர்புடைய ‘household’-ஐக் குறிக்கிறது. ‘சேர்ந்தவர்கள்’ என்பது இரத்த உறவினர் என்று மிகைப்படுத்தாமல் தொடர்பை வெளிப்படுத்துகிறது; ‘அரண்மனை’ நவீன தமிழில் அந்த நிறுவனச் சூழலை இயல்பாகக் குறிக்கிறது.
- source_word: Καίσαρος
  choice: சீசரின்
  rationale: மூலத்தில் உள்ள வரலாற்றுச் சிறப்புடைய பேரரசுப் பட்டப்பெயரைப் பாதுகாக்கிறது; ‘பேரரசரின்’ என்று விளக்கமாக மாற்றவில்லை.
theological_decisions:
- issue: பவுலின் பயன்பாட்டில் ‘பரிசுத்தவான்கள்’ என்பதன் பொருள்
  choice: விசுவாசிகளைக் குறிக்கும் பெயராக ‘பரிசுத்தவான்கள்’ என்று மொழிபெயர்த்தல்
  alternative: கடவுளுடைய மக்கள் / விசுவாசிகள்
  rationale: இங்கு இந்தச் சொல் மிக உயர்ந்த பரிசுத்த நிலையை அடைந்த ஒரு தனிப்பட்ட வகுப்பினரை மட்டும் குறிக்கவில்லை; கிறிஸ்தவச் சமூகத்தைக் குறிக்கிறது. அதேவேளை, விளக்கவுரைப் பதிலீட்டுக்குப் பதிலாக பவுலின் சொல்லாட்சியும் அதன் இறையியல் அழுத்தமும் தக்கவைக்கப்படுகின்றன.
- issue: ‘சீசரின் οἰκία’ என்பவர்களின் அடையாளம்
  choice: சீசரின் அரண்மனை அமைப்போடு தொடர்புடையவர்கள் என்று திறந்த நிலையில் வைத்தல்
  alternative: சீசரின் இரத்த உறவினர்கள் / அரச குடும்பத்தினர் மட்டும்
  rationale: ἐκ τῆς Καίσαρος οἰκίας என்பது குடும்ப உறுப்பினர்கள், அடிமைகள், விடுதலை பெற்றவர்கள், பணியாளர்கள் அல்லது அதிகாரிகள் போன்ற பலவகைத் தொடர்பைக் கொண்டிருக்கலாம்; மூலவாக்கியம் அவர்களின் துல்லியமான நிலையைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் dignified ஆனால் எளிதில் புரியும் கடிதநடை பயன்படுத்தப்பட்டுள்ளது. ‘வாழ்த்துச் சொல்கிறார்கள்’ இயல்பான நவீன வழக்கு; ‘பரிசுத்தவான்கள்’ முக்கிய பவுலியச் சொல்லைத் தக்கவைக்கிறது. ‘சீசரின் அரண்மனை’ என்பது நிறுவன ரீதியான household கருத்தைத் தெளிவாகக் காட்டுகிறது; அடிக்குறிப்பு மூலத்தின் பரந்த தொடர்புப் பொருளை வெளிப்படுத்துகிறது.
