    text: அல்லது, “சீசரின் இல்லத்திலிருந்து வந்தவர்கள்.” இச்சொற்றொடர் சீசரின் இல்லம், அதாவது பேரரசரின் இல்ல-நிர்வாக அமைப்புடன் தொடர்புடையவர்களைக் குறிக்கிறது; அவர்கள் சீசரின் குடும்ப உறவினர்களாகவே இருக்க வேண்டும் என்பதில்லை.
