  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: ta
  text: எனக்கு வலிமையூட்டுகிறவர் மூலமாக எல்லாவற்றையும் செய்ய என்னால் முடியும்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாவற்றுக்கும் எனக்கு ஆற்றல் உண்டு.” சூழலில், நிறைவு அல்லது குறைவு உட்பட ஒவ்வொரு நிலையையும் எதிர்கொள்ளும் ஆற்றலே கருத்தாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க உரை, “எனக்கு வலிமையூட்டுகிறவர்” என்றே கூறுகிறது; இந்த வசனத்தில் “கிறிஸ்து” என்ற பெயர் வெளிப்படையாக இல்லை. எனினும், சூழல் அவரையே சுட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: இது ‘எல்லாவற்றையும்’ என்ற பரந்த பொருளைக் கொண்ட குற்றுவினை வேற்றுமை பன்மை வடிவம். சூழலில் பலவகையான வாழ்க்கை நிலைகள் குறிக்கப்படுகின்றன; ஆனாலும் மூலமொழியின் பரந்த பொருளை முதன்மை உரை தக்கவைக்கிறது.
- source_word: ἰσχύω
  choice: என்னால் முடியும்
  rationale: இந்த வினைச்சொல் வலிமையையும் செயலாற்றும் திறனையும் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும், தனிப்பட்ட தன்னம்பிக்கையை மட்டும் வலியுறுத்தாமலும் இதை ‘என்னால் முடியும்’ என்று மொழிபெயர்க்கலாம்.
- source_word: ἐν
  choice: மூலமாக
  rationale: சொல்லுக்குச் சொல் பொருள் ‘இல்’ என்றாலும், இங்குள்ள ஆளைக் குறிக்கும் பெயரெச்சத் தொடருடன் அது வலிமை கிடைக்கும் வழி அல்லது செயற்படுத்தும் ஆற்றலைக் குறிக்கிறது. ‘மூலமாக’ என்பது இதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: எனக்கு வலிமையூட்டுகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இந்த நிகழ்காலப் பெயரெச்சம், தொடர்ந்து வலிமை அளிக்கிற ஒருவரைக் குறிக்கிறது. மூலவசனத்தில் இல்லாத பெயரையோ பட்டத்தையோ சேர்க்காமல் அதன் வடிவத்தையும் பொருளையும் இது காக்கிறது.
theological_decisions:
- issue: ‘எனக்கு வலிமையூட்டுகிறவர்’ என்பவர் யார்?
  choice: முதன்மை உரையில் பெயரைச் சேர்க்காமல், மூலமொழியிலுள்ள பெயரெச்சத் தொடரையே தக்கவைத்தல்.
  alternative: ‘எனக்கு வலிமையூட்டுகிற கிறிஸ்துவின் மூலமாக’ என்று மொழிபெயர்த்தல்.
  rationale: உடனடி மற்றும் விரிந்த சூழல் இயேசு கிறிஸ்துவையே சுட்டுகிறது. எனினும், இந்த வசனத்தின் கிரேக்க உரையில் ‘கிறிஸ்து’ என்ற பெயர் வெளிப்படையாக இல்லை; ஆகவே அதை முதன்மை உரைக்குள் சேர்க்காமல் குறிப்பில் விளக்கப்படுகிறது.
- issue: ‘எல்லாவற்றையும்’ என்பதன் எல்லை
  choice: மூலமொழியின் பரந்த சொல்லாட்சியை முதன்மை உரையில் தக்கவைத்து, சூழலால் அதன் பயன்பாட்டை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ‘எல்லாச் சூழ்நிலைகளையும் எதிர்கொள்ள’ என்று சூழலுக்கேற்ப குறுகலாக மொழிபெயர்த்தல்.
  rationale: முந்தைய வசனங்களில் நிறைவிலும் குறைவிலும் வாழக் கற்றுக்கொண்டதைப் பவுல் கூறுவதால், இங்கு எந்த விருப்பத்தையும் சாதிக்க முடியும் என்பது கருத்தல்ல. அதேவேளை πάντα என்ற சொல்லின் பரப்பை முதன்மை உரையில் முற்றிலும் சுருக்காமல் வைத்திருக்க வேண்டும்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வலிமையூட்டுகிறவர்’ என்பது தொடர்ச்சியாக வலிமை அளிக்கும் செயலைத் தெரிவிக்கிறது. ‘எல்லாவற்றையும் செய்ய’ என்பது மூலத்தின் பரப்பைத் தக்கவைக்கிறது; அது எல்லையற்ற தனிப்பட்ட சாதனை என்று தவறாகப் புரியாதபடி சூழல் சார்ந்த விளக்கம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
