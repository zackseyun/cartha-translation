id: PHP.4.3
reference: Philippians 4:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: ta
  text: 'ஆம், உண்மையான உடன்தோழரே[a], உம்மையும் கேட்டுக்கொள்கிறேன்: இந்தப் பெண்களுக்கு உதவுவீராக[b]. இவர்கள் நற்செய்திப் பணியில் கிலேமெந்தோடும் என் மற்ற உடன் ஊழியர்களோடும் சேர்ந்து என்னுடன் போராடியவர்கள்; அவர்களுடைய பெயர்கள் வாழ்வின் புத்தகத்தில் உள்ளன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சார்பாக, “உண்மையான நுகத்தோழரே.” இதைச் சிலர் “சிசுகுஸ்” என்ற இயற்பெயராகவும் கருதுகின்றனர்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “துணைநில்லுங்கள்”; “உதவி செய்யுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: ஆம்
  rationale: பவுலின் உறுதிப்படுத்தும் நேரடியான மாறுதலை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐρωτῶ
  choice: கேட்டுக்கொள்கிறேன்
  rationale: தனிப்பட்ட வேண்டுகோளின் தொனியை இயல்பாகத் தருகிறது; கட்டளையின் வலிமையை மிகைப்படுத்தவில்லை.
- source_word: γνήσιε σύζυγε
  choice: உண்மையான என் உடன்தோழரே
  rationale: σύζυγος என்பதை இயற்பெயராக அல்லாமல், நம்பிக்கைக்குரிய உடன்பணியாளரைக் குறிக்கும் விளிப்பு என எடுத்துக்கொள்கிறது; γνήσιος என்பதையும் வெளிப்படையாகக் காக்கிறது.
- source_word: συλλαμβάνου
  choice: உதவுவீராக
  rationale: அவர்களோடு சேர்ந்து செயலில் துணைநிற்க வேண்டும் என்ற கட்டளையைத் தெளிவாகவும் மரியாதைமிக்க ஒருமை அழைப்பாகவும் தருகிறது.
- source_word: αὐταῖς
  choice: இந்தப் பெண்களுக்கு
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட எயோதியாளையும் சிந்திகேயாளையும் குறிக்கும் பெண்பால் பன்மையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: συνήθλησάν μοι
  choice: என்னோடு சேர்ந்து போராடிய
  rationale: συναθλέω என்பதிலுள்ள போட்டி அல்லது போராட்ட உருவகத்தைத் தக்கவைத்தபடி இயல்பான தமிழை வழங்குகிறது.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: நற்செய்திப் பணியில்
  rationale: சுருக்கமான கிரேக்கச் சொற்றொடரை நற்செய்தி சார்ந்த கூட்டு உழைப்பாகத் தமிழில் தெளிவாக்குகிறது; நோக்கத்தை மட்டும் குறிக்கும் வகையில் அதிகமாகச் சுருக்கவில்லை.
- source_word: συνεργῶν
  choice: உடன் ஊழியர்கள்
  rationale: பவுலோடு இணைந்து பணியாற்றியவர்களைக் குறிக்கும் பரிச்சயமான, dignified தமிழ்ச் சொற்றொடர்.
- source_word: βίβλῳ ζωῆς
  choice: வாழ்வின் புத்தகம்
  rationale: நிறுவப்பட்ட வேதாகம உருவகத்தை நேரடியாகவும் புரியக்கூடிய வகையிலும் தருகிறது.
theological_decisions:
- issue: γνήσιε σύζυγε என்பதன் பொருள்
  choice: பெயர் குறிப்பிடப்படாத ஓர் உண்மையான உடன்தோழருக்கான விளிப்பு
  alternative: ‘சூசுகோஸ்’ என்ற இயற்பெயர்; அல்லது இன்னும் சொற்சார்பாக ‘உண்மையான நுகத்தோழர்’
  rationale: γνήσιε என்ற பெயரடை பொதுப்பெயரான σύζυγε உடன் இயல்பாகப் பொருந்துகிறது. ஆயினும், இது இயற்பெயராக இருக்கக்கூடிய வாய்ப்பையும் மூல உருவகத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: ἐν τῷ εὐαγγελίῳ என்பதன் தொடர்பு
  choice: நற்செய்தி சார்ந்த பணியின் வெளியில் என்னோடு போராடினர்
  alternative: நற்செய்திக்காக என்னோடு போராடினர்
  rationale: கிரேக்க ἐν என்பதன் செறிவையும் பரந்த தொடர்பையும் முற்றிலும் நோக்கப் பொருளாக மாற்றாமல், வாசிக்கத்தக்க தமிழில் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஒருமை விளிப்பும் கட்டளையும் பயன்படுத்தப்பட்டுள்ளன. விளையாட்டுப் போட்டி சார்ந்த συναθλέω உருவகத்தை ‘போராடிய’ எனக் காத்து, ἐν τῷ εὐαγγελίῳ என்பதை இயல்பான ‘நற்செய்திப் பணியில்’ என வழங்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
