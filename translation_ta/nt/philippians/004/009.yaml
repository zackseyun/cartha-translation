  source_fidelity: திருத்தம் தேவை. கிரேக்கத்தில் ἐν ἐμοί (‘என்னில்/என்னிடத்தில்’) என்பது εἴδετε (‘கண்டீர்கள்’) என்பதோடு மட்டும் இணைகிறது. வரைவிலுள்ள ‘என்னிடமிருந்து’ கற்றல், பெறுதல், கேட்டல் ஆகிய மூன்று வினைகளுக்கும் கூடுதலாகப் பொருந்துமாறு அமைந்துள்ளது; மூலத்தில் அத்தகைய வெளிப்படையான இணைப்பு இல்லை. மேலும் καί இணைப்பை ‘அப்போது’ என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத கால/விளைவு நுணுக்கத்தைச் சேர்க்கிறது.
  naturalness: ‘நீங்கள் கற்றுக்கொண்டவற்றையும், பெற்றுக்கொண்டவற்றையும், கேட்டவற்றையும், என்னில் கண்டவற்றையும்’ என்ற இணைநிலைப் பட்டியல் நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘நடைமுறைப்படுத்துங்கள்’ தொடர்ச்சியான செயல்பாட்டை நன்கு வெளிப்படுத்துகிறது.
