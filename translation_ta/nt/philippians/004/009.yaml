  to: நீங்கள் கற்றுக்கொண்டவற்றையும், பெற்றுக்கொண்டவற்றையும், கேட்டவற்றையும், என்னில் கண்டவற்றையும் நடைமுறைப்படுத்துங்கள்[a]. சமாதானத்தின் கடவுள் உங்களோடு இருப்பார்.
  rationale: ‘என்னிடமிருந்து’ நீக்கப்பட்டதால், ‘என்னில்’ என்பது மூலம்போல ‘கண்டவற்றை’ என்ற கடைசி கூறோடு மட்டுமே இணைகிறது. ‘அப்போது’ நீக்கப்பட்டதால், அறிவுறுத்தலுக்குப் பின் வரும் கடவுளின் உடனிருப்பு வாக்குறுதி வெளிப்படையான நிபந்தனை அல்லது கால-விளைவு சூத்திரமாகாமல் காக்கப்படுகிறது. மாற்று விளக்கத்துக்கான b அடிக்குறிப்பு உரையில் உள்ளது; அது உரையின் அந்தச் சொற்றொடருக்கு நேரடியாகச் சுட்டப்படாததால் முதன்மை உரையில் [b] குறி இடப்படவில்லை.
