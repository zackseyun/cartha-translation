  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: ta
  text: நீங்கள் கற்றுக்கொண்டவற்றையும், பெற்றுக்கொண்டவற்றையும், கேட்டவற்றையும், என்னில் கண்டவற்றையும் நடைமுறைப்படுத்துங்கள்[a]. சமாதானத்தின் கடவுள் உங்களோடு இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இவற்றைச் செய்யுங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: வற்றை /வற்றையும்
  rationale: நடுநிலைப் பன்மை உறவுப்பெயரின் பொருளைத் தமிழில் தொடர்ச்சியான ‘வற்றையும்’ அமைப்பால் இயல்பாகவும் பன்மை உணர்வுடனும் தருகிறது.
- source_word: ἐμάθετε
  choice: கற்றுக்கொண்ட
  rationale: பவுலிடமிருந்து அவர்கள் கற்ற போதனையை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: παρελάβετε
  choice: பெற்றுக்கொண்ட
  rationale: போதனை அல்லது ஒப்படைக்கப்பட்ட மரபை ஏற்றுப் பெற்றல் என்ற பவுலின் பரந்த பயன்பாட்டை, ‘மரபு’ என்று மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἠκούσατε
  choice: கேட்ட
  rationale: வினைச்சொற்களின் இணைநிலையைச் சுருக்கமாகப் பேணுகிறது; ‘என்னிடமிருந்து’ என்பது தொடரின் தொடக்கத்தில் எல்லா வினைகளுடனும் இயல்பாகச் சம்பந்தப்படுகிறது.
- source_word: εἴδετε ἐν ἐμοί
  choice: என்னிடம் கண்ட
  rationale: பவுலிடமே காணப்பட்டதை கிரேக்கத்திற்கு நெருக்கமாகத் தருகிறது; ‘என் முன்மாதிரியில்’ அல்லது ‘என் வாழ்வில்’ என்று முதன்மை உரையில் விளக்கி விடவில்லை.
- source_word: ταῦτα πράσσετε
  choice: நடைமுறைப்படுத்துங்கள்
  rationale: ஒருமுறை செய்வதைவிடத் தொடர்ந்து வாழ்வில் கடைப்பிடிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: சமாதானத்தின் கடவுள்
  rationale: பவுலின் மரபான உருபுத் தொடரை விளக்கமாக மாற்றாமல் நேரடியாகப் பேணுகிறது.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: உங்களோடு இருப்பார்
  rationale: எதிர்காலத்தில் கடவுளின் உடனிருப்பைப் பற்றிய உறுதியை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: கீழ்ப்படிதலுக்கும் கடவுளின் உடனிருப்புக்கும் உள்ள உறவு
  choice: அறிவுறுத்தலைத் தொடர்ந்து வரும் வாக்குறுதியாக ‘அப்போது’ கொண்டு இணைக்கப்பட்டது; கடுமையான நிபந்தனைச் சூத்திரமாக மாற்றப்படவில்லை.
  alternative: ‘இவற்றைச் செய்தால் மட்டுமே’ என்று வெளிப்படையான காரண-நிபந்தனை உறவாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கத்தில் இரு கூறுகளும் καί மூலம் இணைக்கப்படுகின்றன; வெளிப்படையான ‘என்றால்’ நிபந்தனை இல்லை. தமிழில் ‘அப்போது’ அறிவுறுத்தல்–வாக்குறுதி ஓட்டத்தை இயல்பாக்கினாலும், இயந்திரத்தனமான காரணவியல் அல்லது கூடுதல் கோட்பாட்டுத் துல்லியத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நான்கு வினைகளின் இணைநிலைப் பட்டியல் காக்கப்பட்டுள்ளது. ‘என்னிடமிருந்து’ கற்றல், பெறுதல், கேட்டல் ஆகியவற்றோடு இயல்பாகப் பொருந்தும் வகையில் முன்வைக்கப்பட்டு, ‘என்னிடம் கண்ட’ என்பது ἐν ἐμοί என்பதன் தனித்த நுணுக்கத்தைப் பேணுகிறது. அடிக்குறிப்பு குறிகள் சம்பந்தப்பட்ட சொற்றொடருக்குப் பின் [b][a] என முதன்மை உரையில் இடப்பட்டுள்ளன.
