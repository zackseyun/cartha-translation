  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: ta
  text: நம்முடைய தேவனும் தந்தையுமானவருக்கு என்றென்றைக்கும்[a] மகிமை உண்டாவதாக. ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “யுகங்களின் யுகங்களுக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: இங்கு இது கூர்மையான முரண்பாட்டைக் காட்டாமல், நிறைவுப் புகழுரைக்குச் செல்லும் மென்மையான இணைப்பாக உள்ளது. தமிழில் தனியாக ‘ஆனால்’ அல்லது காலப்பொருள் தரும் ‘இப்போது’ என்று சேர்ப்பது பொருளை மிகைப்படுத்தும்; வாக்கியத் தொடர்ச்சியே இதன் பணியை இயல்பாகச் செய்கிறது.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: நம்முடைய தேவனும் தந்தையுமானவருக்கு
  rationale: ‘தேவன்’ மற்றும் ‘தந்தை’ ஆகிய இரு பெயர்களும் ஒரே நபரைக் குறிப்பதையும், ‘நம்முடைய’ என்பது இரண்டுக்கும் பொருந்துவதையும் இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: ἡ δόξα
  choice: மகிமை உண்டாவதாக
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லை. புகழுரையின் வாழ்த்துத் தன்மையைப் பாதுகாக்கத் தமிழில் ‘உண்டாவதாக’ சேர்க்கப்பட்டுள்ளது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றைக்கும்
  rationale: முடிவில்லாத காலத்தைச் சுட்டும் கிரேக்க மரபுத்தொடரை இயல்பான, மேன்மையான நவீன தமிழில் தருகிறது; சொல்லுக்குச் சொல்லான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: கிறிஸ்தவ வழிபாட்டுப் பயன்பாட்டில் நிலைபெற்றுள்ள ஒலிபெயர்ப்பு வடிவம்; உறுதிப்படுத்தும் நிறைவுச் சொல்லாக அதன் செயல்பாட்டைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வினைச்சொல் இல்லாத புகழுரை
  choice: மகிமை உண்டாவதாக
  alternative: மகிமை உரியது / மகிமை இருக்கிறது
  rationale: மூலக் கிரேக்க வாக்கியம் வினைச்சொல் இல்லாததால் இலக்கண ரீதியாக ஒன்றுக்கு மேற்பட்ட நிறைவுகள் சாத்தியம். சூழலில் இது இறைவனைப் போற்றும் நிறைவுப் புகழுரை என்பதால், வாழ்த்துப் பொருளுடைய ‘உண்டாவதாக’ தேர்ந்தெடுக்கப்பட்டது; இருப்பினும் உரிமை அல்லது நிலை குறிக்கும் வாசிப்புகள் முற்றிலும் மறுக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடியதாய் இருந்தும், நிறைவுப் புகழுரைக்கேற்ற கண்ணியமான நடையும் ஓசையும் பேணப்பட்டுள்ளன. ‘தேவனும் தந்தையுமானவர்’ என்பது ஒரே நபரைக் குறிக்கும் ஒருங்கிணைந்த சொல்லாக்கமாக அமைந்துள்ளது.
