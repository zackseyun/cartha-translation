base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: ta
  text: நான் நன்கொடையை நாடுகிறேன் என்பதல்ல; மாறாக, உங்கள் கணக்கில் பெருகும் பலனை நாடுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உங்கள் வரவாகப் பெருகும் பலன்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: நாடுகிறேன்
  rationale: செயற்பாட்டுடன் தேடுதல் அல்லது விரும்புதல் என்ற பொருளைத் தருகிறது; இருமுறை வரும் வினைச்சொல்லின் முரண்பாட்டையும் ஒரே சொல்லால் காக்கிறது.
- source_word: δόμα
  choice: நன்கொடை
  rationale: பிலிப்பியர்கள் பவுலுக்குக் கொடுத்த பொருளுதவியைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: καρπὸν
  choice: பலன்
  rationale: ‘கனி’ என்ற உருவகத்தையும் ‘விளைவு/பயன்’ என்ற கருத்தையும் தமிழில் இயல்பாகத் தாங்குகிறது; அதை வெறும் இலாபமாகச் சுருக்கவில்லை.
- source_word: πλεονάζοντα
  choice: பெருகும்
  rationale: தொடர்ந்து அதிகரித்தல் அல்லது மிகுதல் என்ற பங்கேற்புவினையின் இயக்கமுள்ள பொருளைக் காக்கிறது.
- source_word: εἰς λόγον ὑμῶν
  choice: உங்கள் கணக்கில்
  rationale: 4:15-இன் வணிகக் கணக்கியல் மொழியுடன் ஒத்திசைந்து, அவர்களுக்குச் சேர்க்கப்படும் வரவு என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: … என்பதல்ல; மாறாக, …
  rationale: பவுலின் விளக்கமளிக்கும் எதிர்மறை–நேர்மறை முரண்பாட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘பலன்’ மற்றும் ‘கணக்கு’ ஆகிய இரு உருவகங்களின் இணைவு
  choice: உங்கள் கணக்கில் பெருகும் பலன்
  alternative: உங்களுக்குக் கிடைக்கும் பெருகிய பயன்
  rationale: மூலத்தில் உள்ள வேளாண்மை மற்றும் கணக்கியல் உருவகங்களுக்கிடையிலான பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது; அந்தப் பலனின் துல்லிய இயல்பை தேவையற்ற வகையில் வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நாடுகிறேன்’ என்ற மீளுரைப்பும் மூலத்தின் சொல்லாட்சிசார் எதிர்மறையும் காக்கப்பட்டுள்ளன; ‘தானம்’ என்பதன் சமயச் சாயலைத் தவிர்க்க ‘நன்கொடை’ பயன்படுத்தப்பட்டுள்ளது.
