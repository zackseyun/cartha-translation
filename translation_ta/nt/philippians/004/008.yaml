reference: Philippians 4:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: ta
  text: இறுதியாக, சகோதரர்களே[a], எவையெல்லாம் உண்மையானவையோ, எவையெல்லாம் மதிப்புக்குரியவையோ, எவையெல்லாம் நீதியானவையோ, எவையெல்லாம் தூய்மையானவையோ, எவையெல்லாம் அன்புக்குரியவையோ, எவையெல்லாம் நற்பெயருக்குரியவையோ—ஏதேனும் நற்குணம் இருந்தால், ஏதேனும் பாராட்டு இருந்தால்—இவற்றைச் சிந்தியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளே”; கிரேக்கத்தில் “சகோதரர்கள்” என்ற சொல் விசுவாசச் சமூகத்தினர் அனைவரையும் அழைக்கப் பயன்படுத்தப்படலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: இறுதியாக
  rationale: முடிவுப் பகுதியை நோக்கி நகர்த்தும் உரையாடல் குறியீட்டின் இயல்பான தமிழாக்கம்.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க ஆண்பால் பன்மை அழைப்பின் வடிவத்தை முதன்மை உரையில் காத்து, அது விசுவாசக் குழுவினர் அனைவரையும் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: ὅσα
  choice: எவையெல்லாம்
  rationale: மீண்டும் மீண்டும் வரும் பகிர்வுநிலை உறவுப்பெயரின் பட்டியல் அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀληθῆ
  choice: உண்மையானவை
  rationale: உண்மை, நம்பகத்தன்மை ஆகிய பரந்த கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: σεμνά
  choice: மதிப்புக்குரியவை
  rationale: கண்ணியமும் ஒழுக்க மதிப்பும் உடையவற்றைக் குறிக்கும்; நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: δίκαια
  choice: நீதியானவை
  rationale: நேர்மையும் நியாயமும் உடையவற்றை இந்த ஒழுக்கப் பட்டியலில் சுருக்கமாகக் குறிக்கிறது.
- source_word: ἁγνά
  choice: தூய்மையானவை
  rationale: ஒழுக்க மற்றும் உள்ளார்ந்த தூய்மை இரண்டையும் உள்ளடக்கக்கூடிய பரந்த சொல்.
- source_word: προσφιλῆ
  choice: அன்புக்குரியவை
  rationale: அன்பையும் விருப்பத்தையும் எழுப்பும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὔφημα
  choice: நற்பெயருக்குரியவை
  rationale: நல்லவிதமாகப் பேசப்படுபவை அல்லது நல்ல மதிப்பைப் பெற்றவை என்ற பொருளைக் காக்கிறது; அடுத்து வரும் ἔπαινος என்பதோடு தேவையற்ற சொல் மறுபடிவைத் தவிர்க்கிறது.
- source_word: εἴ τις ἀρετὴ
  choice: நற்குணம் எதுவாயினும்
  rationale: ἀρετή என்பதன் ஒழுக்க மேன்மை அல்லது நற்குணம் என்ற சுருக்கமான பெயர்ச்சொல் தன்மையைப் பேணுகிறது.
- source_word: εἴ τις ἔπαινος
  choice: பாராட்டத்தக்கது எதுவாயினும்
  rationale: பாராட்டைப் பெறத் தகுதியான எதையும் குறிக்கும் கிரேக்கத் தொகுப்புரையின் இயல்பான தமிழாக்கம்.
- source_word: ταῦτα λογίζεσθε
  choice: அவற்றையே சிந்தித்துக்கொண்டிருங்கள்
  rationale: தொடர்ச்சியான, நோக்கமுள்ள மனக்கவனத்தை உணர்த்தும் நிகழ்காலக் கட்டளையின் வலிமையைத் தருகிறது.
theological_decisions:
- issue: ἀδελφοί என்பதன் பாலின வடிவமும் உள்ளடக்கிய பயன்பாடும்
  choice: முதன்மை உரையில் “சகோதரர்களே” என்று வைத்து, சமூகமெங்கும் உள்ள விசுவாசிகளை இது குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: “சகோதர சகோதரிகளே”
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை மறைக்காமல், பவுலின் சமூக அழைப்பில் உள்ளடக்கிய பயன்பாடு இருக்கக்கூடும் என்பதையும் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தில் திரும்பத் திரும்ப வரும் ὅσα என்ற பட்டியல் அமைப்பு “எவையெல்லாம்” மூலம் காக்கப்பட்டுள்ளது; இறுதிக் கட்டளை தொடர்ச்சியான சிந்தனைப் பழக்கத்தை உணர்த்துகிறது.
