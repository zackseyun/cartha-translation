  source_fidelity: 'மூலக் கிரேக்கத்தின் சொற்தொடரையும் பொருளையும் மொழிபெயர்ப்பு துல்லியமாகக் காக்கிறது: χάρις = “அருள்,” τοῦ κυρίου Ἰησοῦ Χριστοῦ = “ஆண்டவராகிய இயேசு கிறிஸ்துவின்,” மற்றும் μετὰ τοῦ πνεύματος ὑμῶν = “உங்கள் ஆவியோடு.” ஆசிவாழ்த்தில் கிரேக்கத்தில் வெளிப்படையாக இல்லாத வினைச்சொல்லை “இருப்பதாக” என வழங்குவது சரியானதும் தேவையானதும் ஆகும்.'
