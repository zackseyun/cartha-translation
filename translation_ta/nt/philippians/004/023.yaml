  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: ta
  text: ஆண்டவராகிய இயேசு கிறிஸ்துவின் அருள் உங்கள் ஆவியோடு இருப்பதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “ஆண்டவராகிய இயேசு கிறிஸ்துவின் அருள் உங்கள் அனைவரோடும் இருப்பதாக” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் ஆசிவாழ்த்துகளில் வழக்கமான இச்சொல், இறைவன் இலவசமாக அளிக்கும் தயவையும் அதன் இறையியல் செறிவையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: இங்கு இயேசுவுக்குரிய கிறிஸ்தியல் பட்டமாக வரும் κύριος என்பதற்கு மரியாதையும் அதிகாரப் பொருளும் கொண்ட நிலையான தமிழ் இணைச்சொல்.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு கிறிஸ்து
  rationale: இச்சூத்திர வாழ்த்தில் Χριστός பட்டப்பொருளைக் கொண்டிருந்தாலும், Ἰησοῦ உடன் நெருக்கமாக இணைந்து பெயர்போன்றும் செயல்படுகிறது; ‘இயேசு கிறிஸ்து’ என்பது நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் இருந்து அந்தப் பாரம்பரியப் பட்டத்தையும் காக்கிறது.
- source_word: μετὰ
  choice: -ஓடு
  rationale: ஆறாம் வேற்றுமையுடன் வரும் μετά இங்கு உடனிருத்தலைக் குறிக்கிறது; ‘ஆவியோடு’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: πνεύματος
  choice: ஆவி
  rationale: இங்கு பரிசுத்த ஆவியைக் குறிப்பது வெளிப்படையாக இல்லை; பெறுநர்களின் உள்ளார்ந்த மனித ஆவியைக் கூட்டாகக் குறிப்பதாகச் சிற்றெழுத்துப் பொருளில் மொழிபெயர்க்கப்படுகிறது.
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை உடைமைப்பெயர்; ‘உங்கள்’ அந்தப் பன்மையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதை ‘மேசியா’ எனப் பொருள்மொழிபெயர்ப்பதா அல்லது ‘கிறிஸ்து’ என வழங்குவதா
  choice: கிறிஸ்து
  alternative: மேசியா
  rationale: பவுலின் ‘ஆண்டவராகிய இயேசு கிறிஸ்து’ என்ற நிறைவு வாழ்த்துச் சூத்திரத்தில் Χριστός பட்டமாகவும் பெயருடன் நிலைபெற்ற அடையாளமாகவும் ஒலிக்கிறது. ‘கிறிஸ்து’ இந்த இருமுகத்தன்மையைத் தீர்த்துவிடாமல் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- issue: πνεύματος என்பது மனித ஆவியா அல்லது பரிசுத்த ஆவியா
  choice: பெறுநர்களின் மனித ஆவி; ‘ஆவி’
  alternative: பரிசுத்த ஆவி
  rationale: ὑμῶν என்ற உடைமை வடிவமும் பவுலின் ஆசிவாழ்த்துச் சூழலும் பெறுநர்களின் உள்ளார்ந்த ஆவியைச் சுட்டுகின்றன; எனினும் ‘ஆவி’ என்ற சொல் மூலத்தின் சுருக்கத்தையும் ஓரளவு திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கு ஏற்ற மரியாதையான ஆசிவாழ்த்து நடை பயன்படுத்தப்பட்டுள்ளது. ‘இருப்பதாக’ என்பது மூலத்தில் வினைச்சொல் வெளிப்படையாக இல்லாத ஆசிவாழ்த்துப் பொருளை இயல்பான தமிழில் நிறைவு செய்கிறது.
