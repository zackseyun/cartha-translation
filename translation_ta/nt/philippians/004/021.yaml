id: PHP.4.21
reference: Philippians 4:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: ta
  text: மேசியாவாகிய இயேசுவுக்குள்[a] இருக்கும் பரிசுத்தர் ஒவ்வொருவரையும் வாழ்த்துங்கள். என்னுடன் இருக்கும் சகோதரர்கள்[b] உங்களுக்கு வாழ்த்துச் சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து இயேசுவுக்குள்.”
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்கள்” என்பது இச்சூழலில் பவுலுடன் இருந்த ஆண்களும் பெண்களும் அடங்கிய சக விசுவாசிகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: வாழ்த்துங்கள்
  rationale: கடிதத்தின் நிறைவுப் பகுதியில் மற்றவர்களுக்கு வாழ்த்தைத் தெரிவிக்கும்படி கூறும் கட்டளையை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: πάντα ἅγιον
  choice: பரிசுத்தர் ஒவ்வொருவரையும்
  rationale: πᾶς உடன் வரும் ஒருமை வடிவின் பகிர்ந்தளிக்கும் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது; ἅγιος என்பதன் அர்ப்பணிக்கப்பட்ட அல்லது பரிசுத்தமான அடையாளத்தையும் காக்கிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவுக்குள்
  rationale: Χριστός இங்கு ஒரு பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என்ற பொருளை வெளிப்படையாகத் தருகிறது; ἐν என்பதன் ஒன்றிப்பையும் உறவுசார் பரப்பையும் ‘உள்ளே/உள்’ அமைப்பால் காக்கிறது.
- source_word: ἀσπάζονται
  choice: வாழ்த்துச் சொல்கிறார்கள்
  rationale: கடித வாழ்த்துச் சூழலில் நிகழ்கால வினையின் பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: என்னுடன் இருக்கும் சகோதரர்கள்
  rationale: σὺν ἐμοὶ என்பதையும் ἀδελφοί என்ற இலக்கண ஆண்பால் பன்மையையும் நேரடியாகக் காக்கும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: கிரேக்கச் சொல் இங்கு இயேசுவின் பட்டமாக இருப்பதை ‘மேசியா’ தெளிவாக்குகிறது; வழக்கமான திருச்சபைச் சொல்லான ‘கிறிஸ்து’ அடிக்குறிப்பில் மாற்றாகத் தரப்படுகிறது.
- issue: ἀδελφοί குறிக்கும் குழுவின் பாலின வரம்பு
  choice: சகோதரர்கள்
  alternative: சக விசுவாசிகள் / சகோதர சகோதரிகள்
  rationale: முதன்மை உரை கிரேக்கத்தின் இலக்கண ஆண்பால் பன்மையைப் பாதுகாக்கிறது; சூழலில் கலப்புப் பாலின விசுவாசிகள் அடங்கியிருக்கக்கூடிய சாத்தியத்தை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கடித நிறைவுக்கேற்ற மரியாதையும் எளிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தர் ஒவ்வொருவரையும்’ என்பது கிரேக்க ஒருமையின் பகிர்ந்தளிக்கும் வலிமையை இயல்பாகக் காக்கிறது; அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் உடனேயே வைக்கப்பட்டுள்ளன.
