id: PHP.4.1
reference: Philippians 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: ta
  text: ஆகவே, என் அன்புக்குரியவர்களும் நான் ஏங்குகிறவர்களுமான சகோதரர்களே[a], என் மகிழ்ச்சியும் கிரீடமுமானவர்களே[b], இவ்வாறே ஆண்டவருக்குள் உறுதியாக நில்லுங்கள், அன்புக்குரியவர்களே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பது கிரேக்க மொழியிலுள்ள ஆண்பால் வடிவத்தை மொழிபெயர்க்கிறது; இச்சூழலில் பவுல் ஆண்களை மட்டும் அல்ல, சபையிலுள்ள சக விசுவாசிகள் அனைவரையும் அழைத்துப் பேசுகிறார்.
    reason: cultural_note
  - marker: b
    text: அல்லது “வெற்றி மாலை”; கிரேக்கச் சொல், போட்டியில் வென்றவருக்கு வழங்கப்பட்ட மாலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய கருத்துகளிலிருந்து வரும் முடிவையும் அதனைத் தொடர்ந்து வரும் அறிவுறுத்தலையும் இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க மொழியின் ஆண்பால் அழைப்புவடிவத்தைப் பிரதிபலிக்கிறது; இங்கு முழுச் சபையாரும் உள்ளடங்குவர் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἀγαπητοὶ
  choice: அன்புக்குரிய
  rationale: பவுலின் ஆழ்ந்த பாசத்தைத் தக்கவைக்கிறது. வசனத்தின் முடிவில் வரும் அதே சொல்லும் மீண்டும் ‘அன்புக்குரியவர்களே’ என்று மொழிபெயர்க்கப்பட்டு வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐπιπόθητοι
  choice: நான் மிகவும் காண ஏங்கும்
  rationale: ஆழ்ந்த ஏக்கத்துக்குரியவர்கள் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘மிகவும்’ என்பது சொல்லின் தீவிரத்தை எடுத்துரைக்கிறது.
- source_word: χαρὰ
  choice: மகிழ்ச்சி
  rationale: பிலிப்பியர்களே பவுலின் மகிழ்ச்சி என்ற நேரடியான உருவகக் கூற்றைத் தக்கவைக்கிறது.
- source_word: στέφανος
  choice: கிரீடம்
  rationale: தமிழ் வேதாகம மற்றும் பொதுப் பயன்பாட்டில் புரிந்துகொள்ளத்தக்க சொல்லாகும்; வெற்றியாளருக்கு அளிக்கப்படும் மாலை என்ற குறிப்பான பின்னணி அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὕτως
  choice: இவ்வாறே
  rationale: உறுதியாக நிற்க வேண்டிய முறையைச் சுட்டும் வினையடைப் பொருளை வெளிப்படையாகப் பாதுகாக்கிறது; இது முந்தைய அறிவுறுத்தலை இயல்பாகச் சுட்டுகிறது.
- source_word: στήκετε
  choice: உறுதியாக நில்லுங்கள்
  rationale: தொடர்ந்து அசையாமல் நிலைத்திருக்க வேண்டும் என்ற கட்டளையின் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் இட/உறவு சார்ந்த சொற்றொடரை மேலதிக விளக்கமின்றி நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀδελφοί என்பதன் பிரதிநிதித்துவப் பரப்பு
  choice: முதன்மை உரையில் ஆண்பால் வடிவத்தைப் பிரதிபலிக்கும் ‘சகோதரர்களே’ வைக்கப்பட்டு, முழுச் சபையாரையும் குறிக்கும் சூழல்சார் உள்ளடக்கம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
  alternative: ‘சகோதர சகோதரிகளே’ அல்லது ‘உடன்பிறப்புகளே’
  rationale: மூலத்தின் ஆண்பால் அழைப்புவடிவத்தை மறைக்காமல் காக்கிறது; அதேவேளையில் நிருபம் முழுச் சபைக்கும் எழுதப்பட்டதால் பெண்களும் இதில் அடங்குவர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: ἐν κυρίῳ என்பதன் உறவியல் பொருள்
  choice: ‘ஆண்டவருக்குள்’ என்ற திறந்த, நேரடி வடிவம் வைக்கப்பட்டுள்ளது.
  alternative: ‘ஆண்டவரோடு ஒன்றிணைந்து’
  rationale: ஒன்றிப்பு என்ற விளக்கம் சாத்தியமானதாயினும், கிரேக்கச் சொற்றொடரிலுள்ள இட/உறவு சார்ந்த இறையியல் செறிவை ஒரே விளக்கமாகச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பவுலின் பாசமிகு அழைப்பும் ‘அன்புக்குரிய’ என்ற சொல்லின் மறுபடியும் வருதலும் தக்கவைக்கப்பட்டுள்ளன. நீண்ட அழைப்புத்தொடர் தமிழில் வாசிக்க இயலுமாறு அமைக்கப்பட்டாலும், மூலத்தின் தொடர்ச்சியான வலியுறுத்தல் சுருக்கப்படவில்லை.
