- from: ஆகவே, என் அன்புக்குரிய, நான் மிகவும் காண ஏங்கும் சகோதரர்களே[a], என் மகிழ்ச்சியும் கிரீடமும்[b] ஆனவர்களே, அன்புக்குரியவர்களே, இவ்வாறே ஆண்டவருக்குள் உறுதியாக நில்லுங்கள்.
