  to: தாழ்ந்த நிலையில் இருப்பது எப்படி என்பதையும் நான் அறிவேன்; நிறைவாக இருப்பது எப்படி என்பதையும் நான் அறிவேன். எந்தச் சூழ்நிலையிலும், எல்லாவற்றிலும், வயிறார உண்டிருப்பதற்கும் பசியோடு இருப்பதற்கும், நிறைவாக இருப்பதற்கும் குறைவுபடுவதற்குமான இரகசியத்தை நான் கற்றுக்கொண்டிருக்கிறேன்.[a]
