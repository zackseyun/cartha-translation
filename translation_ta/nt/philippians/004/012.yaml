id: PHP.4.12
reference: Philippians 4:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: ta
  text: தாழ்ந்த நிலையில் இருப்பது எப்படி என்பதையும் நான் அறிவேன்; நிறைவாக இருப்பது எப்படி என்பதையும் நான் அறிவேன். எந்தச் சூழ்நிலையிலும், எல்லாவற்றிலும், வயிறார உண்டிருப்பதற்கும் பசியோடு இருப்பதற்கும், நிறைவாக இருப்பதற்கும் குறைவுபடுவதற்குமான இரகசியத்தை நான் கற்றுக்கொண்டிருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்பொருளாக, “நான் தீட்சை பெற்றிருக்கிறேன்.” ஓர் இரகசியத்தைக் கற்றுக்கொண்டதைக் குறிக்கப் பவுல் தீட்சை சார்ந்த மொழியை உருவகமாகப் பயன்படுத்துகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: எப்படி என்பதையும் நான் அறிவேன்
  rationale: தொடரும் வினையெச்சங்களுடன் இது அனுபவத்தால் பெற்ற நடைமுறை அறிவைக் குறிக்கிறது; வெறும் தகவலறிவாகக் குறுக்கவில்லை.
- source_word: ταπεινοῦσθαι
  choice: தாழ்ந்த நிலையில் இருப்பது
  rationale: சூழ்நிலையால் தாழ்த்தப்பட்ட அல்லது வசதியற்ற நிலையில் இருப்பதைக் காட்டுகிறது; மனத்தாழ்மை என்ற பண்புக்கு மட்டும் பொருளைக் குறுக்காமல் passive/middle நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: περισσεύειν
  choice: நிறைவாக இருப்பது
  rationale: தேவைக்கு அதிகமாக அல்லது ஏராளமாகக் கொண்டிருக்கும் பரந்த பொருளைத் தக்கவைக்கிறது; பொருளாதாரச் செழிப்புக்கு மட்டும் வரையறுக்கவில்லை.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: எந்தச் சூழ்நிலையிலும், எல்லாவற்றிலும்
  rationale: இரண்டு கிரேக்கச் சொற்றொடர்களின் வலியுறுத்தலையும் தனித்தனியாகப் பேணி, இயல்பான தமிழில் முழுமையைக் காட்டுகிறது.
- source_word: μεμύημαι
  choice: இரகசியத்தை நான் கற்றுக்கொண்டிருக்கிறேன்
  rationale: தீட்சை பெறுதல் சார்ந்த உருவக மொழியைச் சூழலுக்கேற்ற வகையில், எல்லா நிலைகளிலும் வாழ்வதற்கான மறைபொருளைக் கற்ற அனுபவமாக வெளிப்படுத்துகிறது; சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: χορτάζεσθαι
  choice: வயிறார உண்பது
  rationale: πεινᾶν என்பதற்கு எதிரான உணவு சார்ந்த பொருளைத் தெளிவாகவும் நவீன தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πεινᾶν
  choice: பசியோடு இருப்பது
  rationale: வயிறார உண்பதற்கு நேரான, எளிய எதிரிணையாக கிரேக்கப் பொருளைப் பாதுகாக்கிறது.
- source_word: ὑστερεῖσθαι
  choice: குறைவுபடுவது
  rationale: தேவையானவை இல்லாத பற்றாக்குறையைப் பரந்த வகையில் குறிக்கிறது; பணத் தேவைக்கு மட்டும் பொருளைக் குறுக்கவில்லை.
theological_decisions:
- issue: μεμύημαι என்பதில் உள்ள தீட்சை மொழி
  choice: முதன்மை உரையில் ‘இரகசியத்தை ... கற்றுக்கொண்டிருக்கிறேன்’; அடிக்குறிப்பில் சொற்பொருள்
  alternative: ‘தீட்சை பெற்றிருக்கிறேன்’
  rationale: பவுல் எந்த ஒரு மதச் சடங்கு அல்லது மறைமரபுத் தீட்சையையும் போதிக்கிறார் என்று தவறாக உணர்த்தாமல், உருவகத்தின் பொருளை முதன்மை உரையில் தெளிவாக்கி அதன் தனித்துவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நிறைவாக இருப்பது / குறைவுபடுவது’ மற்றும் ‘வயிறார உண்பது / பசியோடு இருப்பது’ என்ற இணைகள் மூலத்தின் சமச்சீர் எதிர்மறை அமைப்பைப் பேணுகின்றன.
