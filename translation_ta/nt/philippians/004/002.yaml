  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: ta
  text: 'எயோதியாவிடமும் நான் வேண்டிக்கொள்கிறேன்; சிந்திகேயாவிடமும் நான் வேண்டிக்கொள்கிறேன்: ஆண்டவருக்குள் ஒரே மனப்பான்மையோடு இருக்கும்படி.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவருக்குள் ஒரே சிந்தையுள்ளவர்களாயிருக்கும்படி”; “ஆண்டவருக்குள் ஒருமனப்பட்டிருக்கும்படி” என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: எயோதியாள்
  rationale: பெயரை மொழிபெயர்க்காமல், கிரேக்க உச்சரிப்பைத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது; பெண் பெயர் என்பதைத் தெளிவாக்கத் தமிழ் வேற்றுமை அமைப்புக்கு ஏற்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: παρακαλῶ
  choice: நான் வேண்டிக்கொள்கிறேன்
  rationale: தனிப்பட்ட, அக்கறையுள்ள வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. இரு பெண்களிடமும் பவுல் தனித்தனியாக வேண்டுவதைக் காட்ட, வினைச்சொல்லின் மறுபடிப்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: Συντύχην
  choice: சிந்திகேயாள்
  rationale: தனிப்பெயரை அதன் கிரேக்க ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்த்துள்ளது; பெண் பெயர் என்பதைத் தெளிவாக்கத் தமிழ் வேற்றுமை அமைப்புக்கு ஏற்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: ஒரே மனப்பான்மை கொண்டிருங்கள்
  rationale: φρονέω என்பதிலுள்ள சிந்தனை, மனநிலை, அணுகுமுறை ஆகிய பரப்பைத் தக்கவைக்கிறது. வெறும் குறிப்பிட்ட விஷயத்தில் ‘உடன்படுங்கள்’ என்று பொருளைச் சுருக்காமல், பகிரப்பட்ட மனப்பாங்கைக் குறிக்கிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: ஒற்றுமை ஆண்டவருடனான உறவுக்குள் நிலைபெறுவதைச் சுட்டும் கிரேக்க சொற்றொடரின் உறவுசார் மற்றும் இறையியல் அடர்த்தியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: τὸ αὐτὸ φρονεῖν என்பது முழுமையான கருத்தொற்றுமையையா அல்லது பகிரப்பட்ட மனப்பான்மையையா குறிக்கிறது?
  choice: ஒரே மனப்பான்மை கொண்டிருங்கள்
  alternative: ஆண்டவருக்குள் ஒரே சிந்தையுள்ளவர்களாயிருங்கள்; ஆண்டவருக்குள் ஒருமனப்பட்டிருங்கள்
  rationale: சொற்றொடரின் மனம், சிந்தனை, அணுகுமுறை சார்ந்த அகலமான பொருளைத் தக்கவைத்து, எல்லா விவரங்களிலும் ஒரே கருத்து வேண்டும் என்ற தேவையற்ற விளக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. παρακαλῶ என்பதன் இருமுறை பயன்பாடு நோக்கத்துடன் தக்கவைக்கப்பட்டுள்ளது. பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன.
