source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: ta
  text: ஆனால், எல்லாவற்றையும் பெற்றுக்கொண்டேன்[a]; எனக்குத் தேவைக்கு அதிகமாக இருக்கிறது. எப்பாப்பிரோதீத்துவிடமிருந்து உங்களிடமிருந்து வந்தவற்றைப் பெற்றுக்கொண்டதால், நான் முழுமையாக நிறைவுபெற்றிருக்கிறேன். அவை நறுமணமிக்க வாசனையாகவும், ஏற்றுக்கொள்ளத்தக்க பலியாகவும், கடவுளுக்குப் பிரியமானதாகவும் இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாமும் என்னிடம் முழுமையாக இருக்கிறது”; அல்லது, “முழுத் தொகையையும் பெற்றுக்கொண்டேன்.”
    reason: ἀπέχω என்பதற்கு இந்தப் பொருளுதவிச் சூழலில் முழுமையாகக் கையில் இருப்பது அல்லது முழுப் பணத்தையும் பெற்றிருப்பது என்ற வணிக நிழற்பொருள் இருக்கலாம்.
lexical_decisions:
- source_word: ἀπέχω
  choice: பெற்றுக்கொண்டேன்
  rationale: பொருளுதவியின் சூழலில், கையில் முழுமையாகப் பெற்றிருப்பது அல்லது பெற்றதற்கான ஒப்புதல் அளிப்பது என்ற வணிக நிழற்பொருள் இருக்கலாம். முதன்மை உரையில் இயல்பான தமிழைத் தக்கவைத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் காட்டுகிறது.
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: பிலிப்பியர்கள் அனுப்பிய உதவி முழுவதையும் குறிக்கும் விரிவான சொல்லாக்கம்.
- source_word: περισσεύω
  choice: எனக்கு தேவைக்கு அதிகமாகவே இருக்கிறது
  rationale: வெறும் போதுமான நிலையைத் தாண்டிய மிகுதியை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πεπλήρωμαι
  choice: இப்போது நான் நிறைவாகப் பெற்றிருக்கிறேன்
  rationale: பெற்ற உதவியால் ஏற்பட்டுத் தொடரும் தற்போதைய நிறைவு நிலையை கிரேக்க நிறைவுற்ற காலம் வலியுறுத்துகிறது.
- source_word: δεξάμενος
  choice: பெற்றுக்கொண்டதால்
  rationale: பவுல் எவ்வாறு நிறைவடைந்தார் என்பதற்கான சூழ்நிலைக் காரணத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: παρὰ Ἐπαφροδίτου
  choice: எப்பாப்பிரோதீத்துவிடமிருந்து
  rationale: பரிசை நேரடியாகக் கொண்டு வந்த மனித மூலமாக எப்பாப்பிரோதீத்துவைக் குறிக்கிறது; அடுத்த சொற்றொடர் அதன் உண்மையான அனுப்புநர்கள் பிலிப்பியர்கள் என்பதைத் தெளிவாக்குகிறது.
- source_word: τὰ παρ’ ὑμῶν
  choice: நீங்கள் அனுப்பியவற்றை
  rationale: பிலிப்பியர்களிடமிருந்து வந்த பொருளுதவியை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: ὀσμὴν εὐωδίας
  choice: நறுமணமுள்ள வாசனை
  rationale: பழைய ஏற்பாட்டுப் பலி வழிபாட்டை எதிரொலிக்கும் மணமிக்க வாசனை உருவகத்தைத் தக்கவைக்கிறது.
- source_word: θυσίαν δεκτήν
  choice: ஏற்றுக்கொள்ளத்தக்க பலி
  rationale: பிலிப்பியர்களின் கொடையை கடவுள் ஏற்றுக்கொள்ளும் வழிபாட்டுப் பலியாகக் காட்டும் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: εὐάρεστον τῷ θεῷ
  choice: கடவுளுக்கு உகந்தது
  rationale: அந்தக் கொடை கடவுளுக்குப் பிரியமானது என்ற மதிப்பீட்டை தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: பிலிப்பியர்களின் பொருளுதவிக்கான பலி உருவகம்
  choice: “நறுமணமுள்ள வாசனை, ஏற்றுக்கொள்ளத்தக்க பலி, கடவுளுக்கு உகந்தது” என்ற வழிபாட்டு உருவக வரிசையைத் தக்கவைத்தல்
  alternative: உருவகத்தைத் தளர்த்தி, பொதுவான நன்றியறிதலாக அல்லது ‘கடவுள் மகிழ்ச்சியுடன் ஏற்கும் காணிக்கை’ என மொழிபெயர்த்தல்
  rationale: பவுல் இந்தக் கொடையை ஆலயப் பலி மொழியில் திட்டமிட்டே விவரிக்கிறார். வாசனை, பலி, கடவுளின் உகப்பு ஆகிய மூன்றையும் தக்கவைப்பது கூடுதல் கோட்பாட்டுக் கருத்துகளைச் சேர்க்காமல் அதன் இறையியல் வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் மிகுதி–நிறைவு இணைப்பு தெளிவாக்கப்பட்டுள்ளது; பலி சார்ந்த வழிபாட்டு உருவகம் சுருக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
