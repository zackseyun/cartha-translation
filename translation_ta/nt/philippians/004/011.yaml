id: PHP.4.11
reference: Philippians 4:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: ta
  text: எனக்குத் தேவை இருப்பதால் நான் இதைச் சொல்வதில்லை; ஏனெனில், நான் இருக்கும் எந்தச் சூழ்நிலையிலும் மனநிறைவுடன் இருக்கக் கற்றுக்கொண்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன்னிறைவு உடையவனாக இருக்க.’ கிரேக்கச் சொல் ஒருவருக்குத் தன்னிலேயே போதுமான தன்மை இருப்பதைக் குறிக்கலாம்; ஆனால் இங்கு சூழலுக்கேற்றவாறு ‘மனநிறைவுடன் இருக்க’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: எனக்கு ஏதாவது குறை இருப்பதால்
  rationale: இந்தச் சொற்றொடர் பற்றாக்குறை அல்லது தேவையின் காரணமாகப் பேசுவதைக் குறிக்கிறது. தமிழில் இயல்பாகவும், பவுல் தனிப்பட்ட பற்றாக்குறையால் இதைச் சொல்லவில்லை என்ற பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: λέγω
  choice: இதைச் சொல்லவில்லை
  rationale: நிகழ்கால வினையின் உடனடி உரையாடல் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘இதை’ என்பது முந்தைய கருத்தைக் குறிக்கிறது.
- source_word: ἔμαθον
  choice: கற்றுக்கொண்டேன்
  rationale: கற்றல் நிகழ்ந்து, அதன் விளைவு தற்போதும் தொடர்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν οἷς εἰμι
  choice: நான் எந்தச் சூழ்நிலையில் இருந்தாலும்
  rationale: இது வெறும் இடத்தைக் குறிக்காமல், ஒருவர் இருக்கும் பல்வேறு நிலைமைகளைக் குறிக்கும் சொற்றொடர். இந்தத் தேர்வு அதன் திறந்த, பொதுவான தன்மையைப் பாதுகாக்கிறது.
- source_word: αὐτάρκης
  choice: மனநிறைவுடன் இருக்க
  rationale: இச்சூழலில் கிடைப்பவற்றில் திருப்தியுடன் நிலைத்திருக்கும் கற்றுக்கொண்ட மனப்பாங்கை இது இயல்பாகத் தெரிவிக்கிறது. ‘தன்னிறைவு உடையவன்’ என்ற சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: αὐτάρκης என்பதில் உள்ள தத்துவ அல்லது தன்னிறைவு நுணுக்கம்
  choice: மனநிறைவுடன் இருக்க
  alternative: தன்னிறைவு உடையவனாக இருக்க
  rationale: உடனடி சூழலில் பவுல் மாறுபடும் நிலைமைகளிலும் கற்றுக்கொண்ட திருப்தியான மனநிலையை விவரிக்கிறார். பிரதான உரையில் ‘மனநிறைவு’ என்பது தன்னையே சார்ந்த முழுமையான சுயபோதுமையை மிகைப்படுத்தாமல் பொருளைத் தருகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. காரணவியல் தொடர்பை ‘ஏனெனில்’ பாதுகாக்கிறது; கிரேக்கத்தின் சுருக்கமான தொடர்புச் சொற்றொடர் இயல்பான தமிழுக்காக ‘எந்தச் சூழ்நிலையில் இருந்தாலும்’ என விரிக்கப்பட்டுள்ளது.
