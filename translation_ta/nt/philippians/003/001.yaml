source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: ta
  text: இறுதியாக[a], என் சகோதரர்களே[b], ஆண்டவரில் மகிழுங்கள். அதே காரியங்களை உங்களுக்கு எழுதுவது எனக்குச் சிரமமல்ல[c]; உங்களுக்கோ அது பாதுகாப்பளிப்பதாகும்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மற்றபடி” அல்லது “இனிமேல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்கள்” என்ற இந்த அழைப்பு சபை முழுவதையும், அதாவது சகோதரர்களையும் சகோதரிகளையும், குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “எனக்குத் தொந்தரவல்ல” அல்லது “எனக்குச் சலிப்பானதல்ல” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: “அது உங்களுக்குப் பாதுகாப்பாக அமையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: மற்றபடி
  rationale: இது உரையின் அடுத்த பகுதிக்குக் கொண்டுசெல்லும் இடைமாற்றுச் சொற்றொடர். கடிதம் இன்னும் தொடருவதால், முடிவைக் கட்டாயமாக உணர்த்தக்கூடிய “இறுதியாக” என்பதற்குப் பதிலாக “மற்றபடி” தேர்ந்தெடுக்கப்பட்டது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: கிரேக்க மூலத்தின் ஆண்பால் பன்மை வடிவத்தையும் நேரடி அழைப்பையும் காக்கிறது. இங்கு முழுச் சபையும் குறிக்கப்படுவதால் அதன் உள்ளடக்கும் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: χαίρετε
  choice: மகிழுங்கள்
  rationale: χαίρω என்பதன் பன்மை ஏவல் வடிவத்தை இயல்பான நவீனத் தமிழில் கட்டளையாகக் காக்கிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவரில்
  rationale: மகிழ்ச்சி ஆண்டவரோடுள்ள உறவில் நிலைகொண்டிருப்பதைச் சுருக்கமாகவும் இறையியல் விளக்கத்தை மிகைப்படுத்தாமலும் வெளிப்படுத்துகிறது.
- source_word: τὰ αὐτά
  choice: அதே காரியங்களை
  rationale: எவை மீண்டும் எழுதப்படுகின்றன என்பதைத் தெளிவுபடுத்தாமல், கிரேக்கத்தில் உள்ள குறிப்பின் பரந்த தன்மையையும் தெளிவின்மையையும் காக்கிறது.
- source_word: γράφειν
  choice: எழுதுவது
  rationale: இக்கட்டமைப்பில் கிரேக்க இறுவாயை இயல்பான தமிழ் தொழிற்பெயர் வடிவில் தருகிறது.
- source_word: οὐκ ὀκνηρόν
  choice: எனக்குச் சிரமமல்ல
  rationale: மீண்டும் எழுதுவது பவுலுக்குப் பாரமோ தயக்கத்தை உண்டாக்கும் செயலோ அல்ல என்ற கருத்தை இயல்பாகத் தருகிறது; “சலிப்பானதல்ல” என்ற நுணுக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: ἀσφαλές
  choice: உங்களுக்கோ அது பாதுகாப்பானது
  rationale: ἀσφαλές என்பதன் பாதுகாப்பு அல்லது உறுதி சார்ந்த நேரடிப் பொருளைக் காக்கிறது. μὲν…δὲ எதிரிணையை “எனக்கு… உங்களுக்கோ” என்று வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சபை முழுவதையும் நோக்கிய பாலினக் குறியுள்ள அழைப்பு
  choice: என் சகோதரர்களே
  alternative: என் சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் பன்மையை முதன்மை உரை காக்கிறது; அதேவேளையில் அழைப்பு சபையிலுள்ள ஆண்களையும் பெண்களையும் உள்ளடக்குகிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: மீண்டும் எழுதுவதன் பாதுகாப்புத் தன்மை
  choice: உங்களுக்கோ அது பாதுகாப்பானது
  alternative: அது உங்களுக்குப் பாதுகாப்பாக அமையும்
  rationale: மூலத்திலுள்ள பெயரடைப் பொருளை நேரடியாக வைத்திருந்து, பவுலின் மறுபடியான அறிவுறுத்தல் எவ்வாறு பாதுகாக்கிறது என்பதை உரையில் மேலதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. “ஆண்டவர்,” “மகிழுங்கள்” போன்ற பரவலாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. கிரேக்கத்தின் உரைமாற்றுச் சொற்றொடரிலுள்ள ambiguity, மீண்டும் எழுதப்படும் “அதே காரியங்கள்” என்பதன் குறிப்பிடப்படாத குறிப்பு, மேலும் μὲν…δὲ எதிரிணை ஆகியவை இயன்றவரை காக்கப்பட்டுள்ளன.
