  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: ta
  text: மேசியாவாகிய இயேசுவில் கடவுளின் மேல்நோக்கிய அழைப்பின் பரிசுக்காக, இலக்கை நோக்கித் தொடர்ந்து முன்னேறுகிறேன்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரலோக அழைப்பு” அல்லது “மேலிருந்து வரும் அழைப்பு.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “கிறிஸ்து இயேசுவில்”; Χριστός இங்கு ஒரு பட்டப்பெயராக இருப்பதால் “மேசியாவாகிய இயேசு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: இலக்கை நோக்கி
  rationale: ஓட்டப்பந்தய உருவகத்தில், கண்முன் உள்ள குறித்த இலக்கை நோக்கிய இயக்கத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: διώκω
  choice: தொடர்ந்து முன்னேறுகிறேன்
  rationale: இங்கு வினைச்சொல் தீவிரமாகப் பின்தொடர்வதையும் விடாமுயற்சியுடன் முன்னே செல்வதையும் குறிக்கிறது; சூழலின் ஓட்டப்பந்தய உருவகத்திற்கு இச்சொற்றொடர் பொருந்துகிறது.
- source_word: εἰς τὸ βραβεῖον
  choice: பரிசைப் பெறுவதற்காக
  rationale: εἰς இங்கு முயற்சியின் நோக்கத்தைச் சுட்டுகிறது. தமிழில் ‘பரிசைப் பெறுவதற்காக’ என்பது அந்த நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἄνω
  choice: மேல்நோக்கிய
  rationale: இடம் சார்ந்த ‘மேலே’ என்ற வலிமையையும் பந்தய உருவகத்தையும் காக்கிறது; அதே நேரத்தில் ‘மேலிருந்து வரும்’ அல்லது ‘பரலோக’ என்ற விளக்கங்களுக்கு இடமளிக்கிறது.
- source_word: κλήσεως τοῦ θεοῦ
  choice: கடவுள் விடுக்கும் ... அழைப்பின்
  rationale: இந்த அழைப்பு கடவுளிடமிருந்து வருகிறது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்க மரபுத்தொடரின் உறவையும் காக்கிறது.
- source_word: Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைத்திருப்பதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்படுகிறது; தமிழில் பெயருடன் இயல்பாக இணைய ‘மேசியாவாகிய இயேசு’ என வழங்கப்படுகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவில்
  rationale: ἐν என்பதன் ஒன்றிப்பைச் சுட்டும் பவுலின் மொழியைத் தீர்வுசெய்து விரிவாக்காமல் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ἄνω κλήσεως என்பதன் பொருள்
  choice: மேல்நோக்கிய அழைப்பு
  alternative: பரலோக அழைப்பு; மேலிருந்து வரும் அழைப்பு
  rationale: உடனடிச் சூழலிலுள்ள பந்தய உருவகத்தையும் மேல்நோக்கிய இயக்கத்தையும் முதன்மை உரை காக்கிறது. அழைப்பு பரலோகத்தைச் சார்ந்தது அல்லது மேலிருந்து வருகிறது என்ற பொருளை அடிக்குறிப்பு திறந்துவைக்கிறது.
- issue: ἐν Χριστῷ Ἰησοῦ என்பதன் உறவு
  choice: மேசியாவாகிய இயேசுவில்
  alternative: மேசியாவாகிய இயேசுவின் மூலமாக
  rationale: ‘இல்’ என்ற நேரடி வடிவம் ஒன்றிப்பு அல்லது உறவின் இறையியல் நிறையைத் தக்கவைக்கிறது; அதை வெறும் கருவி அல்லது வழிமுறை என்று குறுக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. ஓட்டப்பந்தய உருவகத்தை ‘இலக்கு’, ‘பரிசு’, ‘தொடர்ந்து முன்னேறுதல்’ ஆகிய சொற்கள் காக்கின்றன. ‘மேல்நோக்கிய’ என்பது சற்றே குறியீட்டு மொழியாக இருந்தாலும், மூலத்தின் உண்மையான இருபொருள் வாய்ப்பைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
