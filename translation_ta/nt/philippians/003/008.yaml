id: PHP.3.8
reference: Philippians 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: ta
  text: அதற்கும் மேலாக, என் ஆண்டவராகிய மேசியா இயேசுவைப் பற்றிய அறிவின் ஒப்பற்ற மதிப்பின் காரணமாக எல்லாவற்றையும் இழப்பு என்றே கருதுகிறேன். அவருக்காக எல்லாவற்றின் இழப்பையும் அனுபவித்தேன்; மேசியாவை ஆதாயமாகப் பெறும்படி அவற்றைக் குப்பை[a] என்றே கருதுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குப்பை’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் வலுவானது; அது ‘கழிவு’ அல்லது ‘சாணம்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: அதுமட்டுமல்ல
  rationale: முந்தைய கூற்றை மறுப்பதல்லாமல் அதைக் கடந்து வலுப்படுத்தும் உரையாடல் நகர்வை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: ἡγοῦμαι
  choice: கருதுகிறேன்
  rationale: ஆழ்ந்து மதிப்பிட்டு ஒரு முடிவுக்கு வருதல் என்ற பொருளைத் தருகிறது; இரு இடங்களிலும் ஒரே சொல்லால் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: πάντα / τὰ πάντα
  choice: எல்லாவற்றையும்
  rationale: கிரேக்கச் சொல்லின் விரிவான, முழுமையான வரம்பைப் பாதுகாக்கிறது.
- source_word: ζημίαν
  choice: இழப்பு
  rationale: இவ்வசனத்தில் தொடரும் ஆதாயம்–இழப்பு உருவகத்திற்கு ஏற்ற துல்லியமான சொல்.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: அறிந்திருப்பதன் ஒப்பற்ற மதிப்பின் காரணமாக
  rationale: ὑπερέχον என்பதிலுள்ள மற்ற அனைத்தையும் விஞ்சும் மதிப்பையும், γνώσεως என்பதிலுள்ள தனிப்பட்ட உறவுசார் அறிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மேசியா இயேசு
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைத்திருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: τοῦ κυρίου μου
  choice: என் ஆண்டவரான
  rationale: தனிப்பட்ட உரிமைத் தொடர்பையும் கிறிஸ்துவைப் பற்றிய κύριος சொல்லின் கனத்தையும் காக்கிறது.
- source_word: δι’ ὃν
  choice: அவருக்காக
  rationale: இழப்பிற்குக் காரணமான நபரையும் அவரை முன்னிட்டு ஏற்றுக்கொண்ட தியாக நோக்கையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἐζημιώθην
  choice: இழக்க நேரிட்டது
  rationale: வெறும் மனப்பான்மை மாற்றமல்ல, உண்மையில் இழப்பை அனுபவித்ததை கிரேக்கச் செயலப்பாட்டு வடிவுக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: σκύβαλα
  choice: குப்பை
  rationale: பயனற்ற கழிவைச் சுட்டும் வலுவான இகழ்ச்சித் தொனியை சாதாரண வாசகருக்குப் புரியும் நவீனச் சொல்லால் தருகிறது; இன்னும் கடுமையான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: மேசியாவை நான் ஆதாயமாக்கிக்கொள்ளும்படி
  rationale: ἵνα காட்டும் நோக்கத்தையும் κερδήσω தொடரும் ஆதாயம்–இழப்பு உருவகத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுலின் பயன்பாட்டில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் Χριστός பட்டப்பெயராகப் பொருள் தருவதால் அதன் பொருளை மொழிபெயர்க்கிறது; மரபான ஒலிபெயர்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: γνῶσις என்பதில் உள்ள அறிவின் தன்மை
  choice: மேசியா இயேசுவை அறிந்திருப்பது
  alternative: மேசியா இயேசுவைப் பற்றிய அறிவு
  rationale: கிரேக்கத் தொடரில் இரு வாசிப்புகளுக்கும் இடமிருந்தாலும், சூழலில் தனிப்பட்ட உறவுசார் அறிவு முன்னிலையில் உள்ளது; இதை ஒரு தனிப்பட்ட மறைஞானக் கோட்பாடாக விளக்காமல் இயல்பாக மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதவசனத்திற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டுள்ளது. ஆதாயம்–இழப்பு உருவகம் முழுவதும் காக்கப்பட்டுள்ளது; σκύβαλα சொல்லின் கடுமை முதன்மை உரையிலும் அடிக்குறிப்பிலும் தெளிவுபடுத்தப்பட்டுள்ளது.
