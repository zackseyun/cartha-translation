revisions:
- from: அதுமட்டுமல்ல, என் ஆண்டவரான மேசியா இயேசுவை[b] அறிந்திருப்பதன் ஒப்பற்ற மதிப்பின் காரணமாக எல்லாவற்றையும் இழப்பு என்றே கருதுகிறேன். அவருக்காக நான் எல்லாவற்றையும் இழக்க நேரிட்டது; மேசியாவை நான் ஆதாயமாக்கிக்கொள்ளும்படி அவற்றைக் குப்பை[a] என்றே கருதுகிறேன்.
  to: அதற்கும் மேலாக, என் ஆண்டவராகிய மேசியா இயேசுவைப் பற்றிய அறிவின் ஒப்பற்ற மதிப்பின் காரணமாக எல்லாவற்றையும் இழப்பு என்றே கருதுகிறேன். அவருக்காக எல்லாவற்றின் இழப்பையும் அனுபவித்தேன்; மேசியாவை ஆதாயமாகப் பெறும்படி அவற்றைக் குப்பை[a] என்றே கருதுகிறேன்.
  rationale: மூலத்தின் வலுப்படுத்தும் தொடக்கம், அறிவின் மேலான மதிப்பு, அனுபவிக்கப்பட்ட இழப்பு, தற்போதைய மதிப்பீடு, மற்றும் மேசியாவை ஆதாயமாகப் பெறும் நோக்கம் ஆகியவை தெளிவாகத் தொடரும் வகையில் உரை திருத்தப்பட்டுள்ளது. பெயர்ச்சொல்லான γνῶσις-ஐ ‘அறிவின்’ எனவும், κερδήσω-ஐ ஆதாயம் உருவகம் வெளிப்படும் வகையிலும் வழங்கியுள்ளேன். அடிக்குறிப்பு b உரையில் மேசியா இயேசுவுக்குப் பின் பொருத்தப்பட வேண்டும் என்பதால், உரையில் [b] குறியீடு சேர்க்கப்பட்டுள்ளது.
