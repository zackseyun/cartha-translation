reference: Philippians 3:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: ta
  text: 'மேலும், அவருக்குள் காணப்படவும், சட்டத்திலிருந்து வரும் என் சொந்த நீதியைக் கொண்டிராமல், மெசியாவின்மேல் கொண்ட நம்பிக்கையின் வழியாக[a] வரும் நீதியை—அதாவது, நம்பிக்கையை அடிப்படையாகக் கொண்ட கடவுளிடமிருந்து வரும் நீதியை[b]—கொண்டவனாக இருக்கவும் விரும்புகிறேன்.


    [a] அல்லது, “மெசியாவின் உண்மைத்தன்மையின் வழியாக.”


    [b] இங்கு இருமுறை வரும் “நீதி” என்பதை “நியாயம்” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மெசியாவின் உண்மைத்தன்மையின் வழியாக.”
    reason: πίστεως Χριστοῦ என்பதற்கான எழுவாய்நிலை உருபு வாசிப்பைப் பாதுகாக்கிறது.
  - marker: b
    text: இங்கு இருமுறை வரும் “நீதி” என்பதை “நியாயம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: δικαιοσύνη என்பதன் நியாயம் சார்ந்த சொற்பொருள் மாற்றைத் தருகிறது.
lexical_decisions:
- source_word: εὑρεθῶ
  choice: காணப்படவும்
  rationale: இறந்தகாலத் தோற்றமுடைய செயல்பாட்டு வாய்ப்பாட்டு வடிவத்தின் நோக்கம்/விளைவு நுட்பத்தையும், மூலத்தின் செயப்பாட்டு அமைப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள் இருப்பவனாக
  rationale: பவுலின் கிறிஸ்துவோடு ஒன்றிணைந்திருத்தல் குறித்த விரிவான மொழியை ஒரு குறிப்பிட்ட விளக்கமாகச் சுருக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: μὴ ἔχων
  choice: உடையவனாக இல்லாமல்
  rationale: பவுல் எத்தகைய நிலையில் காணப்பட விரும்புகிறார் என்பதை விளக்கும் பங்கேற்புவினைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: இச்சொல் இறைவனுக்கு முன்பான நேர்மை/ஏற்புடைய நிலை மற்றும் நியாயம் ஆகிய பொருள் பரப்பைக் கொண்டுள்ளது; பொதுவான, சுருக்கமான “நீதி” முதன்மை உரையில் பயன்படுத்தப்பட்டு, “நியாயம்” அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὴν ἐκ νόμου
  choice: சட்டத்திலிருந்து வரும்
  rationale: ἐκ குறிக்கும் மூலம் அல்லது தோற்றத்தைத் தெளிவாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: διὰ πίστεως Χριστοῦ
  choice: மெசியாவின்மேல் கொண்ட நம்பிக்கையின் வழியாக
  rationale: விவாதத்திற்குரிய πίστεως Χριστοῦ தொடருக்கு நோக்குநிலை உருபுப் பொருளை முதன்மை உரையில் தருகிறது; மெசியாவின் உண்மைத்தன்மை என்ற எழுவாய்நிலை மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைத்திருப்பதால், பெயர்போன்ற “கிறிஸ்து” என்பதற்குப் பதிலாக “மெசியா” பயன்படுத்தப்படுகிறது.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: கடவுளிடமிருந்து வரும் நீதி
  rationale: நீதியின் மூலமாகக் கடவுளை வலியுறுத்தும் மூலமொழியின் சுருக்கமான அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἐπὶ τῇ πίστει
  choice: நம்பிக்கையை அடிப்படையாகக் கொண்ட
  rationale: ἐπί உடன் நான்காம் வேற்றுமை இங்கு தெரிவிக்கும் அடிப்படை அல்லது ஆதார உறவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πίστεως Χριστοῦ என்பதன் உருபுத் தொடர்பு
  choice: மெசியாவின்மேல் கொண்ட நம்பிக்கை என்ற நோக்குநிலை வாசிப்பு
  alternative: மெசியாவின் உண்மைத்தன்மை என்ற எழுவாய்நிலை வாசிப்பு
  rationale: கிரேக்கத் தொடர் இரண்டு வாசிப்புகளுக்கும் இடமளிக்கிறது. முதன்மை உரை நம்பிக்கையின் நோக்காக மெசியாவைக் காட்டுகிறது; உண்மையான இலக்கண மற்றும் இறையியல் தெளிவின்மையை மறைக்காமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பவுலின் δικαιοσύνη என்பதன் பொருள்
  choice: முதன்மை உரையில் “நீதி”
  alternative: “நியாயம்”
  rationale: “நீதி” என்பது இச்சூழலில் வழக்கமான இறையியல் பொருளையும் பரந்த அறநெறிப் பொருளையும் தாங்குகிறது; கிரேக்கச் சொல்லின் நியாயம் சார்ந்த பொருள் பரப்பை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் நோக்க அமைப்பு தமிழில் முழுமையாகப் புரிய “விரும்புகிறேன்” இறுதியில் வெளிப்படையாகத் தரப்பட்டுள்ளது. “நம்பிக்கை” என்பது பொதுவாசகர்களுக்கு புரியும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; “மெசியா” பட்டப்பெயர் தன்மையைப் பாதுகாக்கிறது.
