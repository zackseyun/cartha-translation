revisions:
- from: 'மேலும், அவருக்குள் இருப்பவனாகக் காணப்படவும், சட்டத்திலிருந்து வரும் என் சொந்த நீதியை உடையவனாக இல்லாமல், மெசியாவின்மேல் கொண்ட நம்பிக்கையின் வழியாக வரும் நீதியை[a]—அதாவது, நம்பிக்கையை அடிப்படையாகக் கொண்ட கடவுளிடமிருந்து வரும் நீதியை[b]—உடையவனாக இருக்கவும் விரும்புகிறேன்.


    [a] அல்லது, “மெசியாவின் உண்மைத்தன்மையின் வழியாக வரும் நீதியை.”

    [b] இங்கு இருமுறை வரும் “நீதி” என்பதை “நியாயம்” என்றும் மொழிபெயர்க்கலாம்.'
