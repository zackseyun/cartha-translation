id: PHP.3.7
reference: Philippians 3:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: ta
  text: ஆனால், எனக்கு ஆதாயங்களாக இருந்தவை எவையாயினும், அவற்றை மேசியாவின் காரணமாக[a] இழப்பு என்று கருதியிருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின் காரணமாக.”
    reason: Χριστός என்பதற்கான பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு மாற்று.
  - marker: b
    text: அல்லது, “கணக்கிட்டிருக்கிறேன்.”
    reason: ἥγημαι என்பதில் உள்ள மதிப்பிடுதல் அல்லது கணக்கிடுதல் சார்ந்த மாற்றுப் பொருளையும், வசனத்தின் கணக்கியல் உருவகத்தையும் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் பவுல் குறிப்பிட்ட தன்னம்பிக்கைக்கான காரணங்களோடு உள்ள வலுவான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἅτινα
  choice: எவையாயினும்
  rationale: பவுல் முன்பு பட்டியலிட்ட அனைத்து முன்னுரிமைகளையும் உள்ளடக்கும் வரையறுக்கப்படாத தொடர்புச் சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: κέρδη
  choice: ஆதாயங்கள்
  rationale: கணக்கியல் உருவகத்தை இயல்பான தமிழில் தக்கவைத்து, முன்பு நன்மைகளாகக் கருதப்பட்ட பலவற்றைக் குறிக்கிறது.
- source_word: ἥγημαι
  choice: கருதியிருக்கிறேன்
  rationale: முடிவடைந்த மறுமதிப்பீட்டின் விளைவாக இப்போதும் நிலைத்திருக்கும் தீர்மானத்தை கிரேக்க நிறைவேற்றுக் காலம் உணர்த்துவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: διὰ τὸν Χριστόν
  choice: மேசியாவினிமித்தம்
  rationale: διά + accusative இங்கு காரணம் அல்லது ஒருவரை முன்னிட்டு நிகழும் செயலைக் குறிக்கிறது; Χριστός பட்டப்பெயராக இருப்பதால் அதன் பொருளை வெளிப்படுத்தும் ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ζημίαν
  choice: இழப்பு
  rationale: பன்மையான ‘ஆதாயங்கள்’ என்பதற்கு எதிராக ஒருமையில் வரும் கணக்கியல் எதிர்மறையைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστόν என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் Χριστός அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பெயரின் பொருளைத் தாங்குகிறது; எனவே பெயர்போன்ற ஒலிபெயர்ப்பை விட ‘மேசியா’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது. பரவலாக அறியப்பட்ட ‘கிறிஸ்து’ அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
- issue: διὰ τὸν Χριστόν என்பதிலுள்ள உறவு
  choice: மேசியாவினிமித்தம்
  alternative: மேசியாவின் காரணமாக / மேசியாவுக்காக
  rationale: கிரேக்கத் தொடர் காரணத்தையும் ஒருவரை முன்னிட்ட நோக்கத்தையும் சூழல்படி நெருக்கமாகக் கொண்டிருக்க முடியும். ‘நிமித்தம்’ இந்தச் சுருக்கமான பொருள் விரிவைத் தேவையின்றி குறுக்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஆதாயங்கள்—இழப்பு’ என்ற கணக்கியல் எதிர்மறையும், கிரேக்க நிறைவேற்றுக் காலம் உணர்த்தும் நிலைத்த மதிப்பீடும் பாதுகாக்கப்பட்டுள்ளன.
