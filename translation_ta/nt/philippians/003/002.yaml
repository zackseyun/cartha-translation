  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: ta
  text: நாய்களைக் குறித்து எச்சரிக்கையாக இருங்கள்; தீய வேலைக்காரர்களைக் குறித்து எச்சரிக்கையாக இருங்கள்; சிதைப்பைக் குறித்து எச்சரிக்கையாக இருங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில்: ‘சிதைப்பு.’ அடுத்த வசனத்தில் வரும் ‘விருத்தசேதனம்’ என்பதற்கு எதிராகப் பவுல் இந்த இகழ்ச்சியான சொல்லைப் பயன்படுத்துகிறார். ‘உடலை வெட்டிச் சிதைத்தல்’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: இது இங்கு ஆபத்தானவர்களைக் குறித்து விழிப்புடன் இருக்கும்படி கூறும் நிகழ்காலக் கட்டளை. ஒரே சொற்றொடரை மூன்று முறையும் பயன்படுத்துவது கிரேக்கத்தின் அவசரமான, வலியுறுத்தும் ஓசையைப் பாதுகாக்கிறது.
- source_word: τοὺς κύνας
  choice: நாய்களிடம்
  rationale: பவுலின் கடுமையான உருவகத்தை விளக்கிச் சீராக்காமல் அப்படியே வைத்திருக்கிறது; மூலத்தில் இல்லாத இழிவுப்படுத்தும் அடைமொழி எதுவும் சேர்க்கப்படவில்லை.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: தீய வேலைக்காரர்களிடம்
  rationale: κακούς என்பதன் அறநெறிசார் தீமையையும் ἐργάτας என்பதன் வழக்கமான ‘வேலைக்காரர்கள்’ என்ற பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: τὴν κατατομήν
  choice: ‘சிதைப்புக் கூட்டத்தாரிடம்’
  rationale: κατατομή என்பது நேரடியாக ‘சிதைப்பு/வெட்டிச் சிதைத்தல்’ என்னும் பெயர்ச்சொல். தமிழில் மனிதர்களைக் குறித்து எச்சரிக்கும் வாக்கியம் இயல்பாக அமைய ‘கூட்டத்தார்’ சேர்க்கப்பட்டுள்ளது; மேற்கோள்குறிகள் இது பவுல் அவர்களுக்கு இடும் இகழ்ச்சியான பெயர் என்பதை உணர்த்துகின்றன. அடுத்த வசனத்தின் περιτομή (‘விருத்தசேதனம்’) என்பதற்கு எதிராக அமைந்த கூர்மையான சொல்லாட்சியும் இயன்றவரை காக்கப்படுகிறது.
theological_decisions:
- issue: சுற்றியுள்ள விருத்தசேதனக் கருத்துடன் தொடர்புடைய κατατομή என்பதன் மொழிபெயர்ப்பு
  choice: நடுநிலையாக ‘விருத்தசேதனம்’ என்று மென்மையாக்காமல், இகழ்ச்சியான ‘சிதைப்புக் கூட்டத்தார்’ என்று மொழிபெயர்த்தல்
  alternative: உடலைச் சிதைப்பவர்கள்; போலி விருத்தசேதனத்தார்
  rationale: பவுல் வழக்கமான ‘விருத்தசேதனம்’ என்ற சொல்லைப் பயன்படுத்தாமல், அதற்கு ஒத்த ஒலியுடைய எதிர்மறைச் சொல்லைத் திட்டமிட்டுப் பயன்படுத்துகிறார். ‘போலி விருத்தசேதனம்’ என்பது கருத்தை விளக்கினாலும் மூலத்தில் இல்லாத ‘போலி’ என்பதைச் சேர்க்கும்; தேர்ந்த வடிவம் கடுமையையும் திட்டமிட்ட வேறுபாட்டையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் நேரடியான, கண்ணியமான எச்சரிக்கை நடையைக் கொண்டுள்ளது. மூன்று இணையான கூறுகளும் அசல் வசனத்தின் தாளத்தையும் தீவிரத்தையும் காக்கின்றன. ‘சிதைப்புக் கூட்டத்தார்’ என்பது கடுமையான மூல உருவகத்தை மறைக்காமல், சாதாரண வாசகருக்கும் மனிதக் குழுவைக் குறிக்கும் வகையில் இயல்பாக்குகிறது.
