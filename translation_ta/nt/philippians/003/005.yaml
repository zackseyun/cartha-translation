source:
  edition: SBLGNT
  text: περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: ta
  text: எட்டாம் நாளில் விருத்தசேதனம் செய்யப்பட்டவன், இஸ்ரவேல் வம்சத்தைச் சேர்ந்தவன், பென்யமீன் கோத்திரத்தைச் சேர்ந்தவன், எபிரெயர் வழிவந்த எபிரெயன்[a]; திருச்சட்டத்தைப் பொறுத்தவரை, ஒரு பரிசேயன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எபிரெயப் பெற்றோருக்குப் பிறந்த எபிரெயன்”; இது பவுலின் எபிரெய மரபையும் அடையாளத்தையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: எட்டாம் நாளில் விருத்தசேதனம் செய்யப்பட்டவன்
  rationale: சுருக்கமான கிரேக்கச் சொற்றொடரின் பொருளை இயல்பான தமிழில் தருவதோடு, யூத உடன்படிக்கையின் அடையாளத்தையும் தெளிவாகக் காக்கிறது.
- source_word: ἐκ γένους Ἰσραήλ
  choice: இஸ்ரவேல் மக்களில் பிறந்தவன்
  rationale: γένος இங்கு இனவழி அல்லது மக்கள் வழிவந்த அடையாளத்தைக் குறிக்கிறது; இத்தேர்வு பவுலின் இஸ்ரவேலியப் பிறப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φυλῆς Βενιαμίν
  choice: பென்யமீன் கோத்திரத்தைச் சேர்ந்தவன்
  rationale: இந்த மரபுத்தொடர் பவுலின் கோத்திர வழிமரபைக் குறிப்பிடுகிறது; நவீனத் தமிழில் நேரடியாகவும் தெளிவாகவும் உள்ளது.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: எபிரெயரிடமிருந்து பிறந்த எபிரெயன்
  rationale: ἐξ என்பதன் வழிவந்த அல்லது பெற்றோர்வழிப் பொருளையும், கிரேக்கத் தொடரின் வலியுறுத்தலையும் காக்கிறது; அதன் விரிவான சாத்தியப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατὰ νόμον
  choice: திருச்சட்டத்தைப் பொறுத்தவரை
  rationale: κατά இங்கு எந்த அம்சத்தைப் பற்றிப் பேசப்படுகிறது என்பதைக் குறிக்கிறது. νόμος என்பது இச்சூழலில் யூதத் திருச்சட்டத்தைக் குறிப்பதால், வெறும் பொதுவான ‘சட்டம்’ என்பதைக் காட்டிலும் தெளிவான தேர்வு.
- source_word: Φαρισαῖος
  choice: ஒரு பரிசேயன்
  rationale: யூத சமயப் பிரிவுக்கான தமிழில் நிலைபெற்ற பெயரைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: νόμος என்பது பொதுவான சட்டமா அல்லது மோசேயின் திருச்சட்டமா
  choice: திருச்சட்டம்
  alternative: சட்டம்
  rationale: பவுலின் யூத அடையாளச் சிறப்புகளைப் பட்டியலிடும் சூழல் மோசேயின் திருச்சட்டத்தைக் குறிக்கிறது. இருப்பினும் வசனத்தில் இல்லாத கூடுதல் விளக்கத்தைச் சேர்க்காமல் ‘மோசேயின்’ என்று விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பவுல் தன்னைப் பற்றிக் கூறும் இணைநிலைப் பட்டியலின் சுருக்கத்தையும் கண்ணியமான தொனியையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒவ்வொரு கூறிலும் ‘வன்’ வடிவம் பயன்படுத்தப்பட்டு தமிழில் பட்டியல் இயல்பாக இணைக்கப்பட்டுள்ளது.
