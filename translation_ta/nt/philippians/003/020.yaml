  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: ta
  text: ஏனெனில், நமது குடியுரிமை[a] பரலோகத்தில்[b] இருக்கிறது; அங்கிருந்தே இரட்சகராகிய ஆண்டவர் இயேசு மேசியாவை[c] நாமும் ஆவலுடன் எதிர்நோக்குகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குடிமக்கள் சமூகம்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “பரலோகங்களில்.”
    reason: source_form
  - marker: c
    text: அல்லது, “ஆண்டவர் இயேசு கிறிஸ்து.”
    reason: alternative_rendering
lexical_decisions:
- source_word: πολίτευμα
  choice: குடியுரிமை
  rationale: குடிமை சார்ந்த அடையாளத்தையும் உரிமைப்பட்ட நிலையையும் தெளிவாகக் காட்டுகிறது; இச்சூழலில் வரும் பூமிக்குரிய மனப்பான்மைக்கு எதிரான பரலோகச் சார்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν οὐρανοῖς
  choice: பரலோகத்தில்
  rationale: கிரேக்கத்தில் பன்மை வடிவம் இருந்தாலும், குறிக்கப்படும் தெய்வீக மண்டலத்தை நவீன தமிழில் ஒருமையான ‘பரலோகம்’ இயல்பாகக் குறிக்கிறது; மூலத்தின் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὑπάρχει
  choice: இருக்கிறது
  rationale: நிகழ்கால உண்மையான இருப்பை எளிமையாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐξ οὗ
  choice: அங்கிருந்தே
  rationale: முன்னர் குறிப்பிடப்பட்ட பரலோகத்திலிருந்து இரட்சகர் வருவார் என்னும் இடப்பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: σωτῆρα
  choice: இரட்சகர்
  rationale: கிறிஸ்தவத் தமிழில் நிலைபெற்றிருந்தாலும் பொதுவாகப் புரிந்துகொள்ளக்கூடிய சொல்; விடுதலையும் காப்பையும் உள்ளடக்கிய மூலச் சொல்லின் இறையியல் நிறையைப் பாதுகாக்கிறது.
- source_word: ἀπεκδεχόμεθα
  choice: ஆவலுடன் எதிர்பார்த்துக் காத்திருக்கிறோம்
  rationale: தொடர்ச்சியான காத்திருப்பையும் எதிர்நோக்கும் ஆவலையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டின் கிறிஸ்துவியல் பயன்பாட்டுக்கு ஏற்ற நிலையான தமிழ் இணைச்சொல்.
- source_word: Χριστόν
  choice: மேசியா
  rationale: இங்கு தனிப்பட்ட பெயரின் ஒரு பகுதியாக மட்டும் அல்லாமல், எதிர்பார்க்கப்படும் அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாகவும் செயல்படுவதால் அதன் பொருள் மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: κύριον Ἰησοῦν Χριστόν என்ற கிறிஸ்துவியல் அடைமொழித் தொடரை மொழிபெயர்த்தல்
  choice: ஆண்டவர் இயேசு மேசியா
  alternative: ஆண்டவர் இயேசு கிறிஸ்து
  rationale: Χριστός இச்சூழலில் வரவிருக்கும் இரட்சகரின் பட்டமதிப்பைத் தக்கவைத்திருப்பதால் ‘மேசியா’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது. வழக்கமான ‘கிறிஸ்து’ வடிவமும் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: σωτήρ என்பதன் பொருள்
  choice: இரட்சகர்
  alternative: மீட்பர்
  rationale: ‘இரட்சகர்’ காப்பு மற்றும் விடுதலை ஆகிய பரந்த பொருளைத் தக்கவைக்கிறது; ஒரு குறிப்பிட்ட மீட்புக் கோட்பாட்டுக்குள் சொல்லைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நமது’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது; ‘எதிர்பார்த்துக் காத்திருக்கிறோம்’ என்பது கிரேக்க வினையின் நீடித்த, ஆவலான எதிர்நோக்கை வெளிப்படுத்துகிறது. மூலத்தின் ஒரே வாக்கியம் தமிழின் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
