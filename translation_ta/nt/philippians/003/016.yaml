id: PHP.3.16
reference: Philippians 3:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πλὴν εἰς ὃ ἐφθάσαμεν, τῷ αὐτῷ ⸀στοιχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/016.yaml
  text: Only[a], let us keep in step with what we have attained.
translation:
  language: ta
  text: ஆயினும், நாம் எதுவரை வந்திருக்கிறோமோ, அதற்கேற்ப நடப்போமாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நாம் எதுவரை வந்திருக்கிறோமோ, அதே விதியின்படி நடப்போமாக” / “அதே நெறியைக் கடைப்பிடிப்போமாக.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πλήν
  choice: ஒன்றுமட்டும்
  rationale: இங்கு இந்தச் சொல் விதிவிலக்கைக் குறிக்காமல், பவுலின் அறிவுரையை ஒரு முக்கியக் கருத்துக்குள் வரையறுக்கிறது. “ஒன்றுமட்டும்” அந்தச் சுருக்கும் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: εἰς ὃ
  choice: எதுவரை
  rationale: அவர்கள் ஏற்கெனவே வந்து சேர்ந்துள்ள அளவை அல்லது நிலையைக் குறிக்கிறது; “எதுவரை” என்பது சென்றடைதல் என்ற உருவகத்தையும் தொடர்கிறது.
- source_word: ἐφθάσαμεν
  choice: வந்திருக்கிறோமோ
  rationale: ஏற்கெனவே எட்டிய நிலை தற்போது பொருத்தமுடையதாக இருப்பதை இச்சொல் இயல்பாகத் தெரிவிக்கிறது; ஆன்மிக நிறைவை முற்றிலும் அடைந்துவிட்டதாக மிகைப்படுத்துவதையும் தவிர்க்கிறது.
- source_word: τῷ αὐτῷ
  choice: அதற்கேற்ப
  rationale: கிரேக்கத்தில் விதி, நெறி போன்ற பெயர்ச்சொல் வெளிப்படையாக இல்லை. “அதற்கேற்ப” என்பது முன்பு வந்தடைந்த நிலையைச் சுட்டி, மறைந்துள்ள அளவுகோல் சார்ந்த பொருளை அதிகமாக விளக்கிச் சேர்க்காமல் தருகிறது.
- source_word: στοιχεῖν
  choice: தொடர்ந்து நடப்போமாக
  rationale: வரிசை அல்லது நெறிக்கு ஒத்திசைந்து நடப்பது என்ற உருவகப் பொருளைத் தக்கவைத்து, தொடர்ச்சியான வாழ்க்கை நடத்தைக்கான அறிவுரையாக நவீன தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: τῷ αὐτῷ என்பதுடன் “விதி” அல்லது “நெறி” என்ற பெயர்ச்சொல்லை வெளிப்படையாகச் சேர்ப்பதா
  choice: மூலவாக்கியத்தில் இல்லாத பெயர்ச்சொல்லை முதன்மை உரையில் சேர்க்காமல், “அதற்கேற்ப தொடர்ந்து நடப்போமாக” என்று மொழிபெயர்த்தல்
  alternative: “அதே விதியின்படி நடப்போமாக” அல்லது “அதே நெறியைக் கடைப்பிடிப்போமாக”
  rationale: கொடுக்கப்பட்டுள்ள குறுகிய கிரேக்க உரை அளவுகோலை மறைமுகமாகவே வைக்கிறது. வெளிப்படையான பெயர்ச்சொல்லைச் சேர்க்காத மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாத்து, பிற்கால விரிவான வாசகத்தின் தாக்கத்தை முதன்மை உரைக்குள் கொண்டுவராமல் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான அறிவுரை நடையில் அமைக்கப்பட்டுள்ளது. “நடப்போமாக” என்பது இணைந்த அழைப்பின் தொனியையும், வாழ்க்கை நடத்தைக்கான உருவகத்தையும் காக்கிறது.
