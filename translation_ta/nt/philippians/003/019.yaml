  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: ta
  text: அவர்களுடைய முடிவு அழிவு; அவர்களுடைய கடவுள் வயிறு[a]; அவர்களுடைய மகிமை அவர்களுடைய வெட்கத்தில் உள்ளது—அவர்கள் பூமிக்குரியவற்றின்மேல் மனதை வைத்திருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய பசியே அவர்களுடைய கடவுள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: முடிவு
  rationale: இச்சொல் அவர்களுடைய இறுதி நிலையையும் விளைவையும் சுருக்கமாகக் குறிக்கிறது; ‘விதி’ என்று மொழிபெயர்த்து கருத்தை மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: ἀπώλεια
  choice: அழிவு
  rationale: கடுமையான இறுதி விளைவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: κοιλία
  choice: வயிறு
  rationale: கிரேக்கத்தின் உறுதியான உடல் உருவகத்தை அப்படியே வைத்திருக்கிறது; அதை நேரடியாக ‘பசி’ அல்லது ‘இச்சை’ என்று விளக்கி உருவகத்தைச் சுருக்கவில்லை.
- source_word: δόξα
  choice: மகிமை
  rationale: மூலச்சொல்லின் நேரடிப் பொருளையும், வெட்கப்பட வேண்டியதில் மகிமை காணும் முரண்பாட்டு நயத்தையும் காக்கிறது.
- source_word: αἰσχύνη
  choice: வெட்கம்
  rationale: அவமானம் மற்றும் ஒழுக்க இழிவு ஆகிய இரு நிழற்பொருள்களுக்கும் இடமளிக்கும் சுருக்கமான சொல்.
- source_word: τὰ ἐπίγεια
  choice: பூமிக்குரியவற்றின்மேல்
  rationale: ‘பூமிக்குரியவை’ என்ற பன்மைப் பொதுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φρονοῦντες
  choice: மனதை வைத்திருப்பவர்கள்
  rationale: ஒரு கணநேரச் சிந்தனையை அல்லாமல், தொடரும் மனப்பாங்கையும் நோக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: ὧν ... ὧν
  choice: அவர்களுடைய ... அவர்களுடைய
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களைச் சுட்டும் திரும்பத் திரும்ப வரும் உறவுப்பெயரை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ‘அவர்களுடைய கடவுள் வயிறு’ என்ற உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் ‘வயிறு’ என்ற உறுதியான உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘அவர்களுடைய பசியே அவர்களுடைய கடவுள்’
  rationale: இது உணவு ஆசை, உடலின்ப நாட்டம் அல்லது பரந்த சுயஇச்சை ஆகியவற்றைக் குறிக்கக்கூடும். மூலத்தின் திட்டமிட்ட உருவகத்தை ஒரே விளக்கமாகச் சுருக்காமல் காக்கிறது.
- issue: ‘மகிமை அவர்களுடைய வெட்கத்தில்’ என்ற முரண்பாடு
  choice: ‘மகிமை’ மற்றும் ‘வெட்கம்’ ஆகிய இரு சொற்களும் நேரடியாகத் தக்கவைக்கப்பட்டன.
  alternative: ‘வெட்கப்பட வேண்டியவற்றைப் பற்றிப் பெருமைப்படுகிறார்கள்’
  rationale: மாற்று வாசகம் கருத்தை விளக்கினாலும், மூலத்தின் சுருக்கமான இறையியல் மற்றும் சொல்லாட்சிப் பதற்றத்தைத் தீர்த்து விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. அரைப்புள்ளிகள் கிரேக்கத்தில் தொடர்ச்சியாக வரும் மூன்று இணையான வருணனைகளைத் தெளிவாகப் பிரிக்கின்றன; இறுதி கோடு கடைசி பங்கேற்புச் சொற்றொடர் அவர்களைச் சுருக்கமாக வருணிப்பதை வெளிப்படுத்துகிறது.
