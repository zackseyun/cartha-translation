  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: ta
  text: 'சகோதரர்களே[a], நான் அதைக் கைப்பற்றிவிட்டதாகக் கருதவில்லை. ஆனால், ஒன்று: பின்னால் உள்ளவற்றை மறந்து, முன்னால் உள்ளவற்றை நோக்கி நீட்டிக்கொண்டு,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களே’ என்பது ஆண்பால் வடிவிலுள்ள கிரேக்க அழைப்புச் சொல்லான ἀδελφοί என்பதன் மொழிபெயர்ப்பு; பவுல் இதைப் பெண்களையும் உள்ளடக்கிய முழு விசுவாசச் சமூகத்தை அழைப்பதற்கு அடிக்கடி பயன்படுத்துகிறார்.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவமாகிய கிரேக்கச் சொல்லை நேர்மையாகப் பிரதிபலிக்கிறது; இச்சொல் பெண்களும் அடங்கிய முழு விசுவாசக் குழுவை அழைக்கப் பயன்படலாம் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: λογίζομαι
  choice: கருதவில்லை
  rationale: தன்னைப் பற்றிய மதிப்பீடு அல்லது கணிப்பைக் குறிக்கும் வினையின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: κατειληφέναι
  choice: அதைப் பற்றிக்கொண்டுவிட்டதாக
  rationale: பிடித்தல் அல்லது கைப்பற்றுதல் என்ற உருவகத்தைப் பாதுகாக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் உடனடி சூழலிலிருந்து தமிழில் ‘அதை’ என நிரப்பப்பட்டுள்ளது.
- source_word: ἓν δέ
  choice: ஆனால் ஒன்று
  rationale: ‘நான் செய்கிறேன்’ போன்ற சொல்லைச் சேர்க்காமல், கிரேக்கத்தின் திடீர், சுருக்கமான இடைமாற்றைப் பாதுகாக்கிறது.
- source_word: τὰ μὲν ὀπίσω
  choice: பின்னால் உள்ளவற்றை
  rationale: பன்மையையும் இடம் சார்ந்த பின்னோக்கிய உருவகத்தையும் தெளிவாக வைத்திருக்கிறது.
- source_word: ἐπιλανθανόμενος
  choice: மறந்து
  rationale: வினையின் அடிப்படைப் பொருளை மிகை விளக்கமின்றி இயல்பாகத் தருகிறது.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: முன்னால் உள்ளவற்றை
  rationale: ‘பின்னால் உள்ளவை’ என்பதற்கு இணையான எதிர்மறை அமைப்பை உருவாக்கி, முன்னோக்கிய திசையைப் பாதுகாக்கிறது.
- source_word: ἐπεκτεινόμενος
  choice: நோக்கி எட்டியவாறு
  rationale: முன்னோக்கித் தன்னை நீட்டி எட்டும் தொடர்ச்சியான செயலைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத தீவிரத்தைச் சேர்க்கவில்லை.
