source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: ta
  text: நான் ஏற்கெனவே அதைப் பெற்றுவிட்டேன்[a] அல்லது ஏற்கெனவே முழுமையாக்கப்பட்டுவிட்டேன்[b] என்று சொல்லவில்லை. மாறாக, எதற்காகக் கிறிஸ்து[c] என்னைப் பற்றிக்கொண்டாரோ, அதை ஒருவேளை நானும் பற்றிக்கொள்வேனோ என்று தொடர்ந்து நாடுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதை அடைந்துவிட்டேன்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் வினையின் பொருள் வெளிப்படையாகக் கூறப்படாமல், சுற்றியுள்ள சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஏற்கெனவே முழுமையானவனாகிவிட்டேன்’ அல்லது ‘ஏற்கெனவே நிறைவுபெற்றுவிட்டேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'கிரேக்கம்: கிறிஸ்தோஸ்; ‘மெசியா’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: அதைப் பெற்றுவிட்டேன்
  rationale: வினையின் பொருள் கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படவில்லை; முந்தைய சூழலில் உள்ள இலக்கைத் தமிழில் இயல்பாகச் சுட்டுவதற்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது. நிறைவுற்ற செயலை ‘பெற்றுவிட்டேன்’ தெரிவிக்கிறது.
- source_word: τετελείωμαι
  choice: முழுமையாக்கப்பட்டுவிட்டேன்
  rationale: இறந்தகாலத்தில் நிகழ்ந்து தற்போது விளைவைக் கொண்டுள்ள செயப்பாட்டு வடிவத்தை இது காக்கிறது; பிற்காலக் கோட்பாட்டு அர்த்தத்தைத் திணிக்காமல் நிறைவான நிலையைச் சுட்டுகிறது.
- source_word: διώκω
  choice: அந்த இலக்கை நோக்கி விடாமல் செல்கிறேன்
  rationale: தொடர்ந்து துரத்துதல் அல்லது நாடுதல் என்ற வலிமையை, இந்த இலக்கு சார்ந்த சூழலில் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: καταλάβω / κατελήμφθην
  choice: பற்றிக்கொள்ளக்கூடுமோ / பற்றிக்கொண்டாரோ
  rationale: ஒரே கிரேக்க வேரிலிருந்து வரும் செயப்பாட்டு–செய்வினைச் சொல்விளையாட்டை ‘பற்றிக்கொள்’ என்ற ஒரே தமிழ் வினை மூலம் காக்கிறது.
- source_word: ἐφ’ ᾧ
  choice: எதற்காக ... அதை
  rationale: இந்த இடத்தில் நோக்கம் அல்லது குறிக்கோளைக் குறிக்கும் வாசிப்பைத் தருகிறது; அதேவேளையில் அந்த நோக்கத்தின் உள்ளடக்கத்தை வசனம் தானாக வரையறுக்காததைத் திறந்தே வைக்கிறது.
- source_word: Χριστοῦ
  choice: கிறிஸ்து
  rationale: பவுலின் பயன்பாட்டில் பெயரைப் போலவும் பட்டத்தைப் போலவும் செயல்படக்கூடிய வழக்கமான வடிவம்; பட்டத்தின் ‘மெசியா’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: τετελείωμαι என்பது பாவமற்ற பரிபூரண நிலையைச் சுட்டுகிறதா
  choice: முழுமையாக்கப்பட்டுவிட்டேன்
  alternative: முழுமையானவனாகிவிட்டேன்
  rationale: பவுல் தாம் இன்னும் நிறைவான நிலையை அடையவில்லை என்று மறுக்கிறார்; அந்த நிலையைப் பிற்கால இறையியல் வகைகளால் வசனம் விளக்கவில்லை. செயப்பாட்டு மற்றும் விளைவு நிலை இரண்டையும் மொழிபெயர்ப்பு காக்கிறது.
- issue: ἐφ’ ᾧ என்பதன் தொடர்பு நோக்கமா அல்லது காரணமா
  choice: எதற்காகக் கிறிஸ்து என்னைப் பற்றிக்கொண்டாரோ
  alternative: ஏனெனில் கிறிஸ்துவால் நானும் பற்றிக்கொள்ளப்பட்டேன்
  rationale: சூழலில் பவுல் நாடும் குறிக்கோளுக்கும் கிறிஸ்து அவரைப் பற்றிக்கொண்டதற்கும் இடையிலான நோக்கத் தொடர்பு பொருத்தமாக உள்ளது; காரணவாசிப்பு சாத்தியமான மாற்றாக அங்கீகரிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘பற்றிக்கொள்’ என்ற மீள்பயன்பாடு மூலத்தின் சொல்விளையாட்டைக் காக்கிறது. ‘அந்த இலக்கு’ என்பது முந்தைய சூழலைத் தெளிவாக இணைக்கிறது; இலக்கின் இறையியல் உள்ளடக்கத்தை வசனத்துக்குள் கூடுதலாக வரையறுக்கவில்லை.
