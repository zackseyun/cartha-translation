translation:
  language: ta
  text: எப்படியாவது நான் இறந்தோரிலிருந்து உயிர்த்தெழுதலை அடையக்கூடுமானால்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “இறந்தோரின் நடுவிலிருந்து உயிர்த்தெழுதல்.”'
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க மூல உரையில் “இறந்தோரிலிருந்து” என்பதற்கான சில சொற்களின் வாசிப்பு கையெழுத்துப் பிரதிகளிடையே நிச்சயமற்றதாகக் குறிக்கப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: εἴ πως
  choice: எப்படியாவது … அடையக்கூடுமானால்
  rationale: ‘எப்படியாவது’ என்பது வழிமுறை குறித்த பணிவான நிச்சயமின்மையை இயல்பாக வெளிப்படுத்துகிறது; ‘அடையக்கூடுமானால்’ என்பது εἴ மற்றும் விதப்புமுறை வினையின் நிபந்தனைத் தொனியைப் பாதுகாக்கிறது.
- source_word: καταντήσω
  choice: நான் அடையக்கூடுமானால்
  rationale: இலக்கைச் சென்றடையும் உருவகப் பொருளை ‘அடை’ தெளிவாகத் தருகிறது; கிரேக்க இறந்தகால விதப்புமுறையின் இலக்கு நோக்கிய சாத்தியத் தொனியும் நிபந்தனை வடிவில் காக்கப்படுகிறது.
- source_word: εἰς
  choice: —ஐ
  rationale: தமிழில் ‘அடை’ வினை நேரடியாகச் செயப்படுபொருளை ஏற்கிறது; எனவே தனி முன்னிடைச்சொல் தேவையில்லை.
- source_word: ἐξανάστασιν
  choice: உயிர்த்தெழுதலை
  rationale: இந்த அரிய பெயர்ச்சொல்லின் தெளிவான அடிப்படைப் பொருள் ‘உயிர்த்தெழுதல்.’ செயற்கையான புதிய சொல்லை முதன்மை உரையில் திணிக்காமல், அதன் ‘வெளியே எழுதல்’ நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὴν ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: இது இயல்பான நவீனத் தமிழில் மூலத்தின் ‘இறந்தோரிலிருந்து/இறந்தோரின் நடுவிலிருந்து’ என்ற பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: ἐξανάστασις என்ற அரிய சொல் பொதுவான ἀνάστασις என்பதிலிருந்து கூர்மையாக வேறுபட்டு ஒரு தனிப்பட்ட உயிர்த்தெழுதலைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘இறந்தோரிலிருந்து உயிர்த்தெழுதல்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இறந்தோரின் நடுவிலிருந்து வெளியே உயிர்த்தெழுதல்’
  rationale: இச்சொல் இறந்தோரிலிருந்து உயிர்த்தெழுதலைத் தெளிவாகக் குறிக்கிறது; ஆனால் அதன் அரிய வடிவம் தனி வகையான உயிர்த்தெழுதலை கட்டாயமாக நிறுவுவதில்லை. ஆகவே வாசிக்க இயல்பான பொருள் முதன்மை உரையிலும், சாத்தியமான தனித்துவ நுணுக்கம் அடிக்குறிப்பிலும் வைக்கப்பட்டுள்ளது.
- issue: εἴ πως பவுல் உயிர்த்தெழுதல் குறித்தே சந்தேகப்படுவதாகக் காட்டுகிறதா?
  choice: ‘எப்படியாவது … அடையக்கூடுமானால்’ என்று நிபந்தனைத் தொனி பாதுகாக்கப்பட்டது.
  alternative: ‘நிச்சயமாக அடைவேன்’ அல்லது ‘அடைய வேண்டும்’
  rationale: மூலத்தின் பணிவான, நிபந்தனைக்குரிய மொழியை உறுதியான கூற்றாக மாற்றவில்லை; அதேவேளையில் அது கடவுளின் வாக்குறுதி குறித்த கோட்பாட்டுச் சந்தேகம் எனவும் விளக்கிச் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் முந்தைய வசனத்தின் வாக்கிய அமைப்பைத் தொடரும் சார்பு கூறாக இருப்பதால், மூலத்தில் உள்ள நிபந்தனைத் தொனியை ‘அடையக்கூடுமானால்’ எனப் பாதுகாத்துள்ளது. ‘தகுதியாகுதல்’ போன்ற மூலத்தில் இல்லாத இறையியல் கருத்து சேர்க்கப்படவில்லை.
