source:
  edition: SBLGNT
  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: ta
  text: அவர் நம்முடைய தாழ்நிலைக்குரிய உடலை[a], தமது மகிமைமிக்க உடலுக்கு[b] வடிவில் ஒத்ததாக மாற்றுவார். எல்லாவற்றையும்கூடத் தமக்குக் கீழ்ப்படுத்த அவரால் இயலுகிற செயலாற்றலின்படியே இதைச் செய்வார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “நம்முடைய தாழ்மைப்படுத்தலின் உடல்.”'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “தமது மகிமையின் உடல்.”'
    reason: lexical_alternative
  - marker: c
    text: 'வேறு வகையில்: “எல்லாவற்றையும்கூடத் தமக்குக் கீழ்ப்படுத்த அவரால் இயலுகிற செயலாற்றலின்படி.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: மாற்றுவார்
  rationale: உருவம் அல்லது நிலையின் உண்மையான மாற்றத்தைக் குறிக்கும் வினையை இயல்பான நவீனத் தமிழில் வலிமை குறையாமல் தெரிவிக்கிறது.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: நம்முடைய தாழ்நிலைக்குரிய உடல்
  rationale: சொல்லுக்குச் சொல் அமைப்பான ‘நம்முடைய தாழ்மைப்படுத்தலின் உடல்’ தமிழில் தெளிவற்றதாக இருக்கும்; இத்தேர்வு தற்போதைய இழிவான அல்லது தாழ்ந்த உடல் நிலையைக் கூறும் உறவை இயல்பாகப் பாதுகாக்கிறது.
- source_word: σύμμορφον
  choice: வடிவுக்கு ஒத்ததாக
  rationale: வெறும் பொதுவான ஒற்றுமையைவிட ஒரே வடிவுக்கு ஏற்ப அமையும் வலுவான தொடர்பைத் தெரிவிக்கிறது; ‘இணங்கியதாக’ என்பதைக் காட்டிலும் உடலைப் பற்றிய இச்சூழலில் தெளிவாக உள்ளது.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: தமது மகிமைக்குரிய உடல்
  rationale: ‘அவருடைய மகிமையின் உடல்’ என்ற கிரேக்கப் பெயர்ச்சொல் உறவை இயல்பான தமிழில் வெளிப்படுத்தி, மகிமையால் சிறப்பிக்கப்படும் உடல் என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: செயலாற்றலின்படி
  rationale: ἐνέργεια என்பது செயல்படும் பயனுள்ள வல்லமையைக் குறிக்கிறது; ‘வல்லமையால்’ மட்டும் என்பதைக் காட்டிலும் மூலத்தின் ‘செயல்பாடு/செயலாற்றல்’ நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: τοῦ δύνασθαι αὐτὸν
  choice: அவருக்கு வல்லமை அளிக்கும்
  rationale: கிறிஸ்துவின் செயல்வல்லமையை விளக்கும் infinitival அமைப்பை இயல்பான தமிழில் இணைக்கிறது; வல்லமை வெளியில் இருந்து வழங்கப்படுகிறது என்று கட்டாயமாக உணரப்படாதவாறு ‘அவரால் இயலச் செய்கிற’ என்ற கருத்தில் பயன்படுத்தப்படுகிறது.
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: எல்லாவற்றையும் தமக்குக் கீழ்ப்படுத்த
  rationale: ὑποτάσσω என்பதின் அதிகாரத்துக்குக் கீழாக்கும் வலிமையையும் τὰ πάντα என்பதின் முழுப் பரப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இப்போதைய உடல் தாழ்நிலைக்கும் வருங்கால மகிமைப்படுத்தலுக்கும் உள்ள தொடர்பு
  choice: விசுவாசிகளின் தற்போதைய தாழ்நிலைக்குரிய உடல், கிறிஸ்துவின் மகிமைக்குரிய உடலின் வடிவுக்கு ஒத்ததாக எதிர்காலத்தில் மாற்றப்படும் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உயிர்த்தெழுந்த உடல்’ என்று வெளிப்படையாகச் சேர்த்து விளக்கலாம்.
  rationale: கிரேக்கம் உடலின் எதிர்கால மாற்றத்தையும் கிறிஸ்துவின் உடலோடு வடிவொற்றுமையையும் தெளிவாகச் சொல்கிறது; ஆனால் உயிர்த்தெழுதலின் நடைமுறையை இவ்வசனத்தில் விரிவுபடுத்தவில்லை. ஆகவே கூடுதல் கோட்பாட்டு சொற்கள் சேர்க்கப்படவில்லை.
- issue: καί என்பதின் வலியுறுத்தல்
  choice: எல்லாவற்றையும் தமக்குக் கீழ்ப்படுத்தும் வல்லமை என்ற உச்சமான செயல் மூலம் வலியுறுத்தல் மறைமுகமாகத் தெரிவிக்கப்பட்டது.
  alternative: ‘எல்லாவற்றையுங்கூட’ அல்லது ‘எல்லாவற்றையும்கூட’ என்று καί-ஐ வெளிப்படையாக மொழிபெயர்க்கலாம்.
  rationale: இங்கு καί ‘கூட/உண்மையிலேயே’ என்ற வலியுறுத்தலைக் கொண்டிருக்கலாம். ‘எல்லாவற்றையும்கூட’ என்பது தமிழில் தேவையற்ற அல்லது செயற்கையான ஒலியைத் தரக்கூடும்; இருந்தும் அதன் நுணுக்கம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டது. ‘அவர்/தமது/தமக்கு’ என்ற மரியாதை ஒருமை தொடர்ந்து கையாளப்பட்டது. கிரேக்கத்தின் அடர்த்தியான ஒரே வாக்கியம் தமிழின் தெளிவுக்காக இரு வாக்கியங்களாக அமைக்கப்பட்டது; கருத்துத் தொடர்பு ‘இதைச் செய்வார்’ என்பதால் தக்கவைக்கப்பட்டது.
