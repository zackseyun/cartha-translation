id: PHP.3.4
reference: Philippians 3:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: ta
  text: நானே மாம்சத்திலும் நம்பிக்கை உடையவனாக இருந்தாலும், வேறு யாராவது மாம்சத்தில் நம்பிக்கை உடையவர் என்று நினைத்தால், நான் அதைவிட அதிகமாக நம்பிக்கை உடையவன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அதாவது, “மனிதத் தகுதிகளில் நம்பிக்கை வைப்பது” அல்லது “வெளிப்புற அந்தஸ்தில் நம்பிக்கை வைப்பது.” கிரேக்கில்: “மாம்சத்தில்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: ஆயினும்
  rationale: விட்டுக்கொடுக்கும் எதிர்மறைத் தொடர்பை இயல்பான, கண்ணியமான தமிழில் குறிக்கிறது.
- source_word: ἔχων πεποίθησιν
  choice: நம்பிக்கை வைக்கக்கூடியவனே
  rationale: பவுலுக்கே அத்தகைய நம்பிக்கைக்கான அடிப்படை இருப்பதாக அவர் கூறும் கருத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; தொடரும் ஒப்பீட்டுடனும் பொருந்துகிறது.
- source_word: ἐν σαρκί
  choice: மாம்சத்தில்
  rationale: மூலத்தின் உருவகச் சொல்லைத் தக்கவைத்து, உடன்வரும் பட்டியல் காட்டும் மனிதப் பின்னணி மற்றும் வெளிப்புறத் தகுதிகள் என்ற நுட்பத்தை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: δοκεῖ
  choice: நினைத்தால்
  rationale: ஒருவர் தம்மை அத்தகைய நம்பிக்கை உடையவராகக் கருதுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μᾶλλον
  choice: இன்னும் அதிகமாகவே
  rationale: பவுலின் வலியுறுத்தப்பட்ட ஒப்பீட்டுக் கூற்றைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: பிலிப்பியர் 3:4-இல் σάρξ என்பதன் பொருள்
  choice: முதன்மை உரையில் “மாம்சம்” என்பதைத் தக்கவைத்தல்; இங்கு அது மனிதப் பின்னணி, வெளிப்புற நிலை, சமயத் தகுதிகள் ஆகியவற்றைச் சார்ந்த நம்பிக்கையைக் குறிக்கிறது என அடிக்குறிப்பில் விளக்குதல்.
  alternative: “மனிதத் தகுதிகள்” அல்லது “வெளிப்புற அந்தஸ்து” என்று நேரடியாகப் பொருள் விரித்தல்; “பாவ இயல்பு” என்று மொழிபெயர்த்தல்.
  rationale: 3:5–6-இல் வரும் விருத்தசேதனம், வம்சம், திருச்சட்டப் பற்றுதல், வைராக்கியம் ஆகிய பட்டியல், இங்கு நெறிசார் ‘பாவ இயல்பு’ முதன்மையான பொருள் அல்ல என்பதைக் காட்டுகிறது. அதேவேளை மூல உருவகத்தை மாற்றாமல் அதன் சூழல் பொருளை விளக்குவது இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. “மாம்சம்” என்ற மரபான வேதாகமச் சொல்லை முதன்மை உரையில் வைத்தாலும், அதன் சூழல் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
