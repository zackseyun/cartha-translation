revisions:
- from: பக்திவைராக்கியத்தைப் பொறுத்தவரை, திருச்சபையைத் துன்புறுத்தியவன்; திருச்சட்டத்தில் உள்ள நீதியைப் பொறுத்தவரை,[a] குற்றஞ்சாட்ட முடியாதவனானேன்.
  to: ஆர்வத்தைப் பொறுத்தவரை, திருச்சபையைத் துன்புறுத்தினவன்; சட்டத்தில் உள்ள நீதியைப் பொறுத்தவரை,[a] குற்றஞ்சாட்ட முடியாதவனாக இருந்தேன்.
  rationale: The revision replaces an inaccurate and potentially opposite-sense expression for ζῆλος with natural modern Tamil “ஆர்வம்,” while retaining the contextual force through “திருச்சபையைத் துன்புறுத்தினவன்.” It preserves the repeated κατὰ structure, the participial retrospective force, and the qualified scope of Paul’s claimed blamelessness. The wording “சட்டத்தில் உள்ள நீதி” follows ἐν νόμῳ without adding an explicit adjective absent from the Greek, and the footnote accurately records the literal phrase.
  reviewer_model: gpt-5.6-terra
