  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: ta
  text: ஆர்வத்தைப் பொறுத்தவரை, திருச்சபையைத் துன்புறுத்தினவன்; சட்டத்தில் உள்ள நீதியைப் பொறுத்தவரை,[a] குற்றஞ்சாட்ட முடியாதவனாக இருந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: “சட்டத்தில்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: …ஐப் பொறுத்தவரை
  rationale: இங்கு κατά மதிப்பீட்டின் வகையை அறிமுகப்படுத்துகிறது. இருமுறை வரும் கிரேக்கச் சொல்லாட்சியின் இணை அமைப்பைத் தமிழிலும் இது இயல்பாகப் பாதுகாக்கிறது.
- source_word: ζῆλος
  choice: பக்திவைராக்கியம்
  rationale: பவுலின் முந்தைய சமயப்பற்றின் தீவிரத்தையும் அதனால் உந்தப்பட்ட செயலையும் இச்சொல் தெளிவாக உணர்த்துகிறது; வெறும் பொதுவான ஆர்வம் என்று மங்கச் செய்யவில்லை.
- source_word: διώκων
  choice: துன்புறுத்தியவன்
  rationale: இச்சூழலில் வினைச்சொல் வெறுமனே பின்தொடர்வதை அல்ல, விசுவாசிகளுக்கு எதிரான பகைமையான ஒடுக்குதலைக் குறிக்கிறது.
- source_word: ἐκκλησίαν
  choice: திருச்சபை
  rationale: இங்கு பொதுவான கூட்டத்தை அல்ல, கிறிஸ்துவை நம்பிய சமூகத்தைச் சுட்டுகிறது; அதற்கான வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் சொல் இது.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: δικαιοσύνη இங்கு திருச்சட்டத்தின் அளவுகோலின்படி மதிப்பிடப்படும் நேர்மையான நிலையைச் சுட்டுகிறது. தமிழ் வேதாகம மொழிநடையில் ‘நீதி’ இயல்பாகவும் இறையியல் பொருளைத் திறந்தவாறும் உள்ளது.
- source_word: ἐν νόμῳ
  choice: திருச்சட்டத்தில் உள்ள
  rationale: கிரேக்கத்தின் ‘சட்டத்தில்’ என்ற தள அல்லது வரம்புக் கருத்தை நேரடியாகப் பாதுகாக்கிறது. ‘சட்டத்துக்குக் கீழ்’ என்று மாற்றி உறவை மிகுதியாக விளக்குவதைத் தவிர்க்கிறது.
- source_word: γενόμενος
  choice: …ஆனேன்
  rationale: γενόμενος என்பதிலுள்ள நிகழ்வுற்ற அல்லது நிலையை அடைந்த கருத்தைத் தமிழில் இயல்பான நிறைவுற்ற வினையாகக் காட்டுகிறது.
- source_word: ἄμεμπτος
  choice: குற்றஞ்சாட்ட முடியாதவன்
  rationale: குறிப்பிட்ட மதிப்பீட்டு வரம்புக்குள் பழி சுமத்த இயலாத நிலையை இது தெரிவிக்கிறது; முழுமையான பாவமின்மையைத் தேவையின்றி உணர்த்தாது.
theological_decisions:
- issue: பவுல் கூறும் குற்றமின்மையின் வரம்பு
  choice: திருச்சட்டத்தில் உள்ள நீதியைப் பொறுத்தவரை பவுல் தம்மீது குற்றஞ்சாட்ட முடியாத நிலையைச் சொல்கிறார்.
  alternative: கடவுளுக்கு முன் தாம் முற்றிலும் பாவமற்றவர் என்று பவுல் கூறுகிறார்.
  rationale: ἄμεμπτος என்பது δικαιοσύνη τὴν ἐν νόμῳ என்பதோடு இலக்கண ரீதியாக இணைகிறது. ஆகவே இந்தக் கூற்று வரம்பற்ற அறநிறைவை அல்ல, திருச்சட்டத்தின் அளவுகோலுக்குட்பட்ட அவரது முந்தைய நிலையைக் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. κατά என்ற இரட்டைச் சொல்லாட்சியின் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது. ‘திருச்சட்டம்’ என்பது இங்கு νόμος குறிக்கும் மோசேயின் சட்டத்தைப் பொதுவான சட்டத்திலிருந்து வேறுபடுத்துகிறது.
