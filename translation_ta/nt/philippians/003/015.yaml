id: PHP.3.15
reference: Philippians 3:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: ta
  text: ஆகவே, நம்மில் முதிர்ச்சி அடைந்தவர்கள்[a] அனைவரும் இவ்வாறு சிந்திப்போமாக[b]; எதிலாவது நீங்கள் வேறுவிதமாகச் சிந்தித்தால், அதையும் கடவுள் உங்களுக்கு வெளிப்படுத்துவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிறைவடைந்தவர்கள்” அல்லது “பரிபூரணமானவர்கள்.” கிரேக்கச் சொல் முழுமையையும் குறிக்கலாம்; இச்சூழலில் அது ஆன்மிக முதிர்ச்சியைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்த மனப்பான்மையைக் கொண்டிருப்போமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ὅσοι
  choice: நம்மில் ... அனைவரும்
  rationale: குழுவை உள்ளடக்கிக் குறிப்பிடும் விரிவைத் தக்கவைத்து, தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: τέλειοι
  choice: முதிர்ச்சி அடைந்தவர்கள்
  rationale: இங்கு முழுமையான பாவமின்மையைக் காட்டிலும் ஆன்மிக முதிர்ச்சியே சூழலுக்கு ஏற்ற பொருள்; அதேவேளை ‘நிறைவடைந்தவர்கள்’ என்ற உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῦτο
  choice: இவ்வாறு
  rationale: முந்தைய வசனங்களில் விவரிக்கப்பட்ட சிந்தனைப்போக்கைச் சுட்டுவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: φρονῶμεν
  choice: சிந்திப்போமாக
  rationale: நிகழ்கால ஏவல் சார்ந்த துணைவினையின் கூட்டான அறிவுறுத்தலைப் பாதுகாக்கிறது; φρονέω என்பதன் சிந்தனை மற்றும் மனப்பாங்கு சார்ந்த பரப்பையும் தக்கவைக்கிறது.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: எதிலாவது நீங்கள் வேறுவிதமாகச் சிந்தித்தால்
  rationale: நிபந்தனையையும் எந்த விஷயத்திலும் மாறுபட்ட மனப்பாங்கு இருக்கலாம் என்ற திறந்த பரப்பையும் நேரடியாகக் காட்டுகிறது.
- source_word: καὶ τοῦτο
  choice: அதையும்
  rationale: மாறுபட்டுச் சிந்திக்கும் அந்த விஷயத்தைக்கூட கடவுள் வெளிப்படுத்துவார் என்ற தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἀποκαλύψει
  choice: வெளிப்படுத்துவார்
  rationale: தெய்வீக வெளிப்படுத்துதலின் வலிமையை மிகைப்படுத்தாமலும் குறைக்காமலும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: τέλειοι என்பதன் பொருள்
  choice: ஆன்மிக முதிர்ச்சி அடைந்தவர்கள்
  alternative: நிறைவடைந்தவர்கள் / பரிபூரணமானவர்கள்
  rationale: 3:12-ல் பவுல் தான் ஏற்கெனவே நிறைவடைந்துவிட்டதாக மறுக்கும் உடனடிச் சூழலில், இங்கு முழுமையான பாவமின்மையை வலியுறுத்துவது சாத்தியமில்லை. எனினும் τέλειοι என்பதிலுள்ள ‘நிறைவு’ சார்ந்த மொழிச் சாயலையும் பவுலின் நோக்கமுள்ள முன்னேற்றத்துடனான பதற்றத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: φρονῶμεν என்பதன் அறிவுறுத்தல் வலிமை
  choice: சிந்திப்போமாக
  alternative: இவ்வாறே சிந்திக்க வேண்டும் / இந்த மனப்பான்மையைக் கொண்டிருப்போமாக
  rationale: முதல் நபர் பன்மை ஏவல் சார்ந்த வடிவம் பவுலையும் வாசகர்களையும் ஒரே அறிவுறுத்தலுக்குள் சேர்க்கிறது; வெறும் கட்டளையாக மாற்றாமல் கூட்டான அழைப்பாகத் தரப்படுகிறது.
- issue: கடவுள் வெளிப்படுத்துவார் என்ற கூற்றின் பரப்பு
  choice: மாறுபட்டுச் சிந்திக்கப்படும் விஷயத்தையும் கடவுள் வெளிப்படுத்துவார்
  alternative: அவர்களுக்கு முழுச் சத்தியத்தையும் கடவுள் உடனடியாகத் தெளிவாக்குவார்
  rationale: மூலத்தில் வெளிப்படுத்துதலின் முறை, காலம், அளவு ஆகியவை விளக்கப்படவில்லை. ஆகவே அவற்றைச் சேர்க்காமல் கூற்றின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘சிந்திப்போமாக’ என்பது சற்றே உயர்ந்தாலும் இயல்பான கூட்டான அறிவுறுத்தல் வடிவம்; மூலத்தின் ஏவல் சார்ந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
