  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: ta
  text: ஏனெனில், தேவனுடைய ஆவியால் வழிபட்டு[a], மெசியாவாகிய இயேசுவில் பெருமை கொண்டு[b], மாம்சத்தில் நம்பிக்கை வைக்காத[c] நாம்தான் விருத்தசேதனத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கிரேக்கக் கையெழுத்துப் பிரதிகளில், “ஆவியில் தேவனை வழிபட்டு” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: “மெசியா” என்பது Χριστός (கிறிஸ்தோஸ்) என்ற பட்டப்பெயரின் பொருள்.
    reason: lexical_alternative
  - marker: c
    text: இங்கே “மாம்சம்” என்பது விருத்தசேதனம், பிறப்பு அல்லது மனித அந்தஸ்து போன்ற நம்பிக்கைக்கான உடல்சார்ந்த அல்லது மனித அடிப்படைகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: விருத்தசேதனத்தார்
  rationale: விருத்தசேதனம் என்ற உடன்படிக்கை அடையாளத்தை மறைமுகமாக்காமல், அந்த அடையாளத்தால் வரையறுக்கப்படும் மக்களைக் குறிக்கும் கிரேக்கப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது. ‘உண்மையாக விருத்தசேதனம் பெற்றவர்கள்’ என்று மொழிபெயர்த்து மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: πνεύματι θεοῦ
  choice: தேவனுடைய ஆவியால்
  rationale: SBLGNT வாசகத்தில் உள்ள θεοῦ என்பதற்கு இணங்க, மனிதனுடைய உள்ளார்ந்த ஆவியை அல்ல, தேவனுடைய ஆவியை வழிபாட்டின் செயலாற்றும் வழியாகக் குறிக்கிறது.
- source_word: λατρεύοντες
  choice: வழிபட்டு
  rationale: தேவனுக்குச் செலுத்தப்படும் சமயச் சேவையையும் பக்தியையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: καυχώμενοι
  choice: பெருமை கொண்டு
  rationale: 'பவுல் எதிரெதிராக வைக்கும் நம்பிக்கைக்கான அடிப்படைகளைப் பாதுகாக்கிறது: மனிதத் தகுதிகளில் அல்ல, மெசியாவாகிய இயேசுவில் பெருமை கொள்ளுதல்.'
- source_word: Χριστῷ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவில்
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளைப் பாதுகாத்து, தமிழில் இயல்பாக இயேசுவுடன் இணைக்கிறது.
- source_word: σαρκί
  choice: மாம்சத்தின் மேல்
  rationale: உடல், விருத்தசேதனம், மனிதப் பிறப்பு மற்றும் சமயத் தகுதிகள் ஆகியவற்றின் பொருள் வளத்தை ‘மாம்சம்’ பாதுகாக்கிறது; ‘பாவ இயல்பு’ என்று குறுக்கவில்லை.
- source_word: πεποιθότες
  choice: நம்பிக்கை வைக்காத
  rationale: மனிதத் தகுதிகள்மீது நிலையான சார்பை வைக்காத நிலையைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துடன் உள்ள விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இந்த வசனத்தில் σάρξ என்பதன் பொருள்
  choice: ‘மாம்சம்’ என்பது முதன்மையாக விருத்தசேதனம், பிறப்பு, சமய அந்தஸ்து போன்ற உடல்சார்ந்த மற்றும் மனிதத் தகுதிகளை நம்புவதைக் குறிக்கிறது.
  alternative: உள்ளார்ந்த ஒழுக்கக் கொள்கையாகிய ‘பாவ இயல்பு’.
  rationale: பிலிப்பியர் 3-ன் உடனடி சூழலில் பவுல் விருத்தசேதனம், இனப் பின்னணி, திருச்சட்டக் கடைப்பிடிப்பு, அந்தஸ்து ஆகியவற்றைப் பட்டியலிடுகிறார். எனவே பொருளை ‘பாவ இயல்பு’ என மட்டும் சுருக்காமல் ‘மாம்சம்’ என்று வைத்திருக்கிறது.
- issue: πνεύματι θεοῦ என்பதன் வலிமை
  choice: வழிபாட்டின் வழி அல்லது செயலாற்றும் ஆற்றலாக தேவனுடைய ஆவியைக் குறிக்கிறது.
  alternative: மனித ஆவியில் வழிபடுதல் அல்லது ஆவிக்குரிய முறையில் தேவனை வழிபடுதல்.
  rationale: SBLGNT வாசகமான θεοῦ, இந்தச் சொற்றொடரை தேவனுடைய ஆவியுடன் இயல்பாக இணைக்கிறது; இருப்பினும் ‘ஆவியால்’ என்பது வழி மற்றும் செயல்படும் வட்டம் ஆகிய இரண்டின் நுணுக்கத்தையும் ஓரளவு திறந்தவையாக வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நாம்தான்’ பவுலின் வலியுறுத்தலைத் தருகிறது; ‘விருத்தசேதனத்தார்’ மூலத்தின் உடன்படிக்கைச் சொல்லையும் அதன் திட்டமிட்ட முரண்பாட்டையும் பாதுகாக்கிறது. மூன்று அடிக்குறிப்பு அடையாளங்களும் தொடர்புடைய சொற்றொடர்களின் உடனே வைக்கப்பட்டுள்ளன.
