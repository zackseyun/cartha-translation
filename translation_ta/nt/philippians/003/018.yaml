source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: ta
  text: ஏனெனில் பலர்—அவர்களைப் பற்றி நான் உங்களிடம் பலமுறை சொல்லிவந்தேன்; இப்போதோ அழுதுகொண்டே சொல்கிறேன்—மெசியாவின்[a] சிலுவைக்குப் பகைவர்களாக வாழ்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்துவின்.’
    reason: Χριστός என்பதற்கான மரபுவழித் தமிழ் வடிவத்தை மாற்று மொழிபெயர்ப்பாகக் காட்டுகிறது.
lexical_decisions:
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இந்தப் பன்மை உரிச்சொல், குறிப்பிட்ட அடையாளத்தைச் சொல்லாமல் பல நபர்களைக் குறிக்கிறது; ‘பலர்’ என்பது நேரடியான இயல்பான தமிழ்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அல்லது விளக்கத்தை இந்த இணைப்புச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: περιπατοῦσιν
  choice: வாழ்கிறார்கள்
  rationale: இங்கு ‘நடத்தல்’ என்பது வாழ்க்கை முறையைக் குறிக்கும் உருவகம். நவீன தமிழில் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘வாழ்கிறார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: நான் உங்களிடம் பலமுறை சொல்லியிருக்கிறேன்
  rationale: πολλάκις உடன் வரும் இறந்தகாலத் தொடர்வினை, கடந்த காலத்தில் திரும்பத் திரும்பச் சொன்னதைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அந்த மீள்நிகழ்வையும் அதன் தற்போதைய தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: இப்போதோ அழுதுகொண்டே சொல்கிறேன்
  rationale: κλαίων என்பது பேசும் செயல் நடைபெறும் அதே நேரத்தில் பவுல் அழுவதைக் காட்டும் நிகழ்காலப் பெயரெச்சம்; ‘அழுதுகொண்டே’ அந்த ஒரேநேர நிகழ்வையும் உணர்ச்சி வலிமையையும் காக்கிறது.
- source_word: ἐχθροὺς
  choice: பகைவர்களாக
  rationale: சிலுவைக்கு எதிராக இருப்பவர்களை வலுவாகக் குறிக்கும் சொல்லாக ‘பகைவர்கள்’ பொருந்துகிறது; வாக்கியத்தில் பயனிலைத் தொடர்பை இயல்பாக்க ‘பகைவர்களாக’ என அமைக்கப்பட்டது.
- source_word: σταυροῦ
  choice: சிலுவை
  rationale: இது அறையப்பட்ட மரக்கருவியையும் அதனுடன் தொடர்புடைய மரணத்தையும் அதன் இறையியல் முக்கியத்துவத்தையும் குறிக்கும் நிறுவப்பட்ட நேரடி மொழிபெயர்ப்பு.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: இங்கு Χριστός அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டமாக இயங்குகிறது; ஆகவே அதன் பட்டப்பொருளைக் காக்க ‘மெசியா’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: τοῦ Χριστοῦ என்பதைக் பட்டமாகவா, பெயர்போன்ற மரபுச் சொல்லாகவா மொழிபெயர்ப்பது
  choice: மெசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இந்தச் சூழலில் Χριστός பெயராக மட்டுமே புரிந்துகொள்ளப்பட வேண்டிய கட்டாயம் இல்லை; ‘மெசியா’ அதன் பட்டப்பொருளை வெளிப்படுத்துகிறது. பரவலான தமிழ் மரபில் உள்ள ‘கிறிஸ்து’ மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: சிலுவைக்குப் பகைவர்கள் என்பது நபர்களின் வாழ்க்கை முறையையா அல்லது வெறும் கருத்து எதிர்ப்பையா குறிக்கிறது
  choice: பகைவர்களாக வாழ்கிறார்கள்
  alternative: சிலுவையை எதிர்க்கிறார்கள்
  rationale: περιπατοῦσιν வாழ்க்கை நடத்தையைக் குறிக்கிறது; எனவே கருத்தளவிலான எதிர்ப்பாக மட்டும் சுருக்காமல், அவர்களின் வாழ்வுமுறையும் சிலுவைக்கு எதிரான நிலையும் இணைந்தே வைக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு தெளிவாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் இடைச்செருகல் போன்ற உறவுத் தொடரை நீள்கோடுகளால் காத்து, தமிழில் வாசிக்கத்தக்க சொல் வரிசை பயன்படுத்தப்பட்டது. ‘நடக்கிறார்கள்’ என்ற சொல்லுக்கு பதில் உருவகப் பொருளை இயல்பாக வெளிப்படுத்த ‘வாழ்கிறார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
