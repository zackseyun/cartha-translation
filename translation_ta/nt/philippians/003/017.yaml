id: PHP.3.17
reference: Philippians 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: ta
  text: சகோதரர்களே[a], என்னைப் பின்பற்றுவதில் ஒன்றுசேருங்கள்; எங்களை முன்மாதிரியாகக் கொண்டிருப்பதுபோல, அவ்வாறு நடப்பவர்களைக் கவனியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளே”; கிரேக்கச் சொல் ஆண்பால் பன்மையில் இருந்தாலும், இங்கு முழுச் சபையையும் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: என்னைப் பின்பற்றுவதில் ஒன்றுசேருங்கள்
  rationale: Συμμιμηταί என்பதிலுள்ள கூட்டாகப் பின்பற்றும் பொருளையும், γίνεσθε என்பதிலுள்ள கட்டளை வலிமையையும் இயல்பான நவீனத் தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே[a]
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மை அழைப்பாக இருப்பதை முதன்மை உரை காக்கிறது; முழுச் சபையையும் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: σκοπεῖτε
  choice: கவனித்துக்கொண்டிருங்கள்
  rationale: தொடர்ந்து உற்றுக் கவனிக்க வேண்டும் என்ற நிகழ்காலக் கட்டளையின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὕτω περιπατοῦντας
  choice: இதே விதமாக நடப்பவர்களை
  rationale: περιπατέω என்பதன் ‘நடத்தையை/வாழ்க்கை முறையை’ குறிக்கும் உருவகத்தை ‘நடப்பவர்கள்’ எனக் காத்து, οὕτω என்பதை ‘இதே விதமாக’ என வழங்குகிறது.
- source_word: τύπον
  choice: முன்மாதிரியாக
  rationale: பின்பற்றத்தக்க வடிவம் அல்லது எடுத்துக்காட்டு என்ற τύπος சொல்லின் பொருளை இயல்பாகத் தருகிறது.
- source_word: ἡμᾶς
  choice: எங்களை
  rationale: மூலத்திலுள்ள பன்மைப் பெயர்ச்சொல்லைக் காத்து, பவுலுடன் அவருடைய உடனுழைப்பாளர்களும் அடங்கும் சாத்தியத்தைச் சுருக்காமல் விடுகிறது.
theological_decisions:
- issue: ἀδελφοί என்பதன் உள்ளடக்கும் பொருள்
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று வைத்து, முழுச் சபையையும் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் தெரிவிப்பது
  alternative: முதன்மை உரையிலேயே ‘சகோதர சகோதரிகளே’ என்று மொழிபெயர்ப்பது
  rationale: மூலச் சொல்லின் ஆண்பால் பன்மை வடிவத்தை மறைக்காமல் காக்கிறது; அதேவேளையில், சூழலில் அது ஆண்களையும் பெண்களையும் உள்ளடக்கிய முழுச் சபைக்கான அழைப்பாக இருப்பதையும் தெளிவுபடுத்துகிறது.
- issue: ἡμᾶς என்ற பன்மை
  choice: ‘எங்களை’ என்று பன்மையாகவே மொழிபெயர்ப்பது
  alternative: ‘என்னை’ என்று ஒருமையாக்குவது
  rationale: பவுல் முதலில் ‘என்னை’ என்று கூறியபோதும், பின்னர் திட்டவட்டமாகப் பன்மையைப் பயன்படுத்துகிறார்; அந்த உரைத் திருப்பத்தையும் உடனுழைப்பாளர்கள் சேர்க்கப்பட்டிருக்கக்கூடிய பொருளையும் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சபை வாசிப்புக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. ‘நடப்பவர்கள்’ மூலம் பவுலின் வாழ்க்கை-நடத்தை உருவகம் காக்கப்பட்டுள்ளது; ‘எங்களை’ என்ற மூலப் பன்மையும் அப்படியே வைக்கப்பட்டுள்ளது.
