  to: சகோதரர்களே[a], என்னைப் பின்பற்றுவதில் ஒன்றுசேருங்கள்; எங்களை முன்மாதிரியாகக் கொண்டிருப்பதுபோல, அவ்வாறு நடப்பவர்களைக் கவனியுங்கள்.
