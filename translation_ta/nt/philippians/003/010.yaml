  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: ta
  text: அவரை அறிந்துகொள்ளவும், அவருடைய உயிர்த்தெழுதலின் வல்லமையையும் அவருடைய பாடுகளில் பங்கேற்பையும்[a] அறிந்துகொள்ளவும், அவருடைய மரணத்திற்கு ஒத்தவனாகிக்கொண்டே இருக்கவும்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய பாடுகளில் ஐக்கியத்தையும்” அல்லது “அவருடைய பாடுகளில் பங்கையும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய மரணத்திற்கு ஒத்தவனாக மாறிக்கொண்டே இருக்கவும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: அறிந்துகொள்வதையும்
  rationale: இறந்தகால வினையெச்சத்தின் நோக்கப் பொருளையும், வெறும் தகவலறிவைத் தாண்டிய உறவு மற்றும் அனுபவ அறிவையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δύναμιν
  choice: வல்லமையையும்
  rationale: உயிர்த்தெழுதலில் வெளிப்பட்டு செயல்படும் திறனைத் தெளிவாகக் குறிக்கும் நிலையான தமிழ் சொல்.
- source_word: ἀναστάσεως
  choice: உயிர்த்தெழுதலின்
  rationale: இங்கு குறிப்பிடப்படும் இறந்தோரிலிருந்து எழுதல் என்ற நிகழ்வுக்கான துல்லியமும் பரவலாகப் புரிந்துகொள்ளப்படுவதுமான சொல்.
- source_word: κοινωνίαν
  choice: பங்கேற்பதையும்
  rationale: வெறும் உணர்வுபூர்வமான அனுதாபத்தையோ பொதுவான ஐக்கியத்தையோ அல்லாமல், கிறிஸ்துவின் பாடுகளில் உண்மையாகப் பங்குகொள்ளும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παθημάτων
  choice: பாடுகளில்
  rationale: கிறிஸ்துவை மையமாகக் கொண்ட துன்ப அனுபவங்களை நேரடியாகக் குறிக்கும், தமிழ் வேதாகம நடையில் அறியப்பட்ட சொல்.
- source_word: συμμορφιζόμενος
  choice: ஒத்தவனாகிக்கொண்டே
  rationale: நிகழ்காலப் பங்கேற்புவினை காட்டும் தொடர்ச்சியான மாற்றத்தைப் பாதுகாக்கிறது; செயப்படுபொருள் அல்லது இடைநிலை நுணுக்கத்தை அளவுக்கு மீறித் தீர்மானிக்காமல் விடுகிறது.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: அவருடைய மரணத்திற்கு
  rationale: συμμορφιζόμενος என்பதன் வேற்றுமைத் துணையை நேரடியாகக் காட்டி, கிறிஸ்துவின் மரணத்தோடு ஏற்படும் ஒப்புமையை மையப்படுத்துகிறது.
theological_decisions:
- issue: κοινωνίαν παθημάτων αὐτοῦ என்பதன் பொருள்
  choice: கிறிஸ்துவின் பாடுகளில் உண்மையாகப் பங்கேற்பது
  alternative: அவருடைய பாடுகளோடு பொதுவான ஐக்கியம் அல்லது அவற்றின்மீது அனுதாபம்
  rationale: சொற்றொடரும் பவுலின் விரிவான சூழலும் பங்கேற்பைச் சுட்டுகின்றன; எந்தக் குறிப்பிட்ட கோட்பாட்டு அமைப்பையும் புகுத்தாமல் அந்த நுணுக்கம் பாதுகாக்கப்படுகிறது.
- issue: συμμορφιζόμενος என்பதில் மாற்றத்தின் தன்மை
  choice: தொடர்ந்து அவருடைய மரணத்திற்கு ஒத்தவனாகுதல்
  alternative: வெளிப்புறச் செயலால் அவருடைய மரணத்திற்கு ஒப்பாக்கப்படுதல்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான தன்மை வெளிப்படுத்தப்படுகிறது; கிரேக்க வடிவத்தின் நடுநிலை/செயப்பாட்டு சாத்தியம் கடுமையாக முடிவுசெய்யப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியம் முந்தைய வசனத்தைச் சார்ந்த நோக்கக் கட்டமைப்பாக இருப்பதால், தமிழில் தனியாக வாசிக்க உதவும் வகையில் “நாடி ... இருக்கிறேன்” சேர்க்கப்பட்டுள்ளது; இருப்பினும் அறிதல், வல்லமை, பங்கேற்பு, மரணத்துக்கு ஒத்தவனாதல் என்ற மூல வரிசை பாதுகாக்கப்பட்டுள்ளது.
