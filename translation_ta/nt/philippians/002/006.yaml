translation:
  language: ta
  text: அவர் கடவுளின் வடிவில் இருந்தபோதிலும்[a], கடவுளோடு சமமாக இருப்பதைத் தன் நலனுக்காகப் பயன்படுத்திக்கொள்ளத்தக்க ஒன்றாகக் கருதவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் வடிவில் இருந்துகொண்டு.” ὑπάρχων என்பதை விட்டுக்கொடுப்புப் பொருளில் “இருந்தபோதிலும்” என்றும், நிலைமையைக் குறிக்கும் வகையில் “இருந்துகொண்டு” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பற்றிக்கொள்ளத்தக்க ஒன்றாக” அல்லது “கைப்பற்றத்தக்க ஒன்றாக.” ἁρπαγμός என்ற கிரேக்கச் சொல்லின் பொருள் குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μορφῇ θεοῦ
  choice: கடவுளின் வடிவில்
  rationale: μορφή என்பதன் ‘வடிவு’ என்ற வெளிப்பாட்டைத் தக்கவைத்து, அதை ‘இயல்பு’ போன்ற குறுகிய மெய்யியல் விளக்கமாக மாற்றாமல் கிரேக்கச் சொல்லாட்சியின் வலிமையையும் திறந்த தன்மையையும் காக்கிறது.
- source_word: ὑπάρχων
  choice: இருந்தபோதிலும்
  rationale: அடுத்த வசனத்தின் தம்மை வெறுமையாக்கும் செயலோடு உள்ள எதிர்மறைத் தொடர்பைக் காட்டும் விட்டுக்கொடுப்பு நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நிலைமையைக் குறிக்கும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἁρπαγμὸν
  choice: தமக்குச் சாதகமாகப் பயன்படுத்திக்கொள்ள வேண்டிய ஒன்று
  rationale: ἁρπαγμός விவாதத்திற்குரிய சொல். சூழலில் தன் நலனுக்காகப் பயன்படுத்தாதிருத்தல் என்ற பொருள் அடுத்த வசனத்தின் தன்னலமற்ற இறக்கத்தோடு நன்றாகப் பொருந்துகிறது; ‘பற்றிக்கொள்ள வேண்டிய ஒன்று’ என்ற சாத்தியமான மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἡγήσατο
  choice: கருதவில்லை
  rationale: ἡγέομαι என்பதன் மதித்தல் அல்லது எண்ணுதல் என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: கடவுளுக்குச் சமமாக இருப்பதை
  rationale: ‘கடவுளுக்குச் சமமாக இருத்தல்’ என்ற கிரேக்கப் பெயரெச்ச வினைமுற்றுத் தொடரை இயல்பாகவும் நேரடியாகவும் வழங்குகிறது.
theological_decisions:
- issue: ἐν μορφῇ θεοῦ என்பதன் கிறிஸ்துவியல் வலிமை
  choice: முதன்மை உரையில் ‘கடவுளின் வடிவில்’ எனத் தக்கவைத்தல்
  alternative: கடவுளின் இயல்பில்; இயல்பிலேயே கடவுளாக
  rationale: இவ்வசனத்தின் உயர்ந்த கிறிஸ்துவியலை மறைக்காமல், பவுலின் சொற்றொடரைப் பிற்காலக் கோட்பாட்டு சுருக்கத்தால் மாற்றாமல் காக்கிறது.
- issue: கடவுளுக்குச் சமமாக இருப்பதுடன் தொடர்புடைய ἁρπαγμός என்பதன் பொருள்
  choice: தமக்குச் சாதகமாகப் பயன்படுத்திக்கொள்ள வேண்டிய ஒன்று
  alternative: பற்றிக்கொள்ள வேண்டிய ஒன்று; கைப்பற்ற வேண்டிய ஒன்று
  rationale: உடனடிச் சூழல் தன் நலனை நாடுவதைவிடத் தன்னைத் தாழ்த்திக் கொடுப்பதை வலியுறுத்துவதால் ‘சாதகமாகப் பயன்படுத்துதல்’ என்ற பொருள் பொருத்தமாகிறது. ஆயினும் உண்மையான பொருள் ஐயத்தை மறைக்காமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
