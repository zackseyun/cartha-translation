  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வடிவு’ என்ற சொல் மூலத்தின் உருவகத் திறந்த தன்மையைப் பேணுகிறது; ἁρπαγμός குறித்த உண்மையான பொருள் ஐயம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
