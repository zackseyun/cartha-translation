lexical_decisions:
- source_word: Πάντα
  choice: எல்லாவற்றையும்
  rationale: இந்தப் பன்மை வடிவம் கட்டளையின் முழுமையான பரப்பைச் சுட்டுகிறது; ‘எல்லாவற்றையும்’ என்பது இயல்பான நவீனத் தமிழில் அதைப் பாதுகாக்கிறது.
- source_word: ποιεῖτε
  choice: செய்யுங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவத்தின் தொடர்ச்சியான அறிவுறுத்தலைத் தமிழின் மரியாதைமிக்க கட்டளை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: χωρὶς
  choice: இல்லாமல்
  rationale: இங்கு குறிப்பிடப்படும் மனப்பான்மைகளும் செயல்களும் நடத்தையில் இடம்பெறக்கூடாது என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: γογγυσμῶν
  choice: முணுமுணுப்பு
  rationale: அதிருப்தியை அடக்கமான குரலில் வெளிப்படுத்தும் குறைகூறலைக் குறிக்கிறது; ‘முணுமுணுப்பு’ எளிதில் புரியும் இயல்பான தமிழ்.
- source_word: διαλογισμῶν
  choice: வாக்குவாதம்
  rationale: இச்சூழலில் எதிர்த்துப் பேசும் சர்ச்சை அல்லது தகராறே முதன்மையான பொருளாகத் தெரிகிறது. எனினும், இச்சொல் வேறு சூழல்களில் எண்ணங்கள், ஐயப்பாடுகள் அல்லது கேள்விகளையும் குறிக்கக்கூடும் என்பதால் அந்த விரிவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: διαλογισμῶν என்பது உள்ளார்ந்த ஐயப்பாடுகளைக் குறிக்கிறதா அல்லது மனிதர்களுக்கிடையிலான வாக்குவாதத்தைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘வாக்குவாதம்’
  alternative: ‘ஐயப்பாடு’, ‘கேள்வி எழுப்புதல்’ அல்லது ‘சர்ச்சை’
  rationale: γογγυσμῶν உடன் இணைந்துள்ள அறிவுறுத்தல் சூழலில் எதிர்ப்பும் பிணக்கும் நிறைந்த வாதமே அதிகம் பொருந்துகிறது; ஆயினும் கிரேக்கச் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு உடனடியாகப் புரியும் அதேவேளையில் மரியாதையும் சுருக்கமும் கொண்ட கட்டளை நடையைப் பயன்படுத்துகிறது. ‘முணுமுணுப்போ வாக்குவாதமோ இல்லாமல்’ என்ற இணைப்பு, இரண்டு செயல்களையும் விலக்கும் கிரேக்க அமைப்பை இயல்பான தமிழில் தருகிறது.
