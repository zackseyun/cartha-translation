  text: Do everything without grumbling or arguing[b][a],
translation:
  language: ta
  text: எல்லாவற்றையும் முணுமுணுப்பும் வாக்குவாதமும் இல்லாமல் செய்யுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வாக்குவாதம்” என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் சில சூழல்களில் “ஐயப்பாடு,” “கேள்வி எழுப்புதல்,” அல்லது “சிந்தனை” என்றும் பொருள்படலாம்; இங்கு பிணக்கை உண்டாக்கும் வாதமே பெரும்பாலும் குறிக்கப்படுகிறது.
