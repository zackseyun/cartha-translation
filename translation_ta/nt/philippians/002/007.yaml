id: PHP.2.7
reference: Philippians 2:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ἑαυτὸν ἐκένωσεν μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: ta
  text: ஆனால் அவர் தம்மையே வெறுமையாக்கினார்[a]; அடிமையின் வடிவத்தை ஏற்று, மனிதர்களின் சாயலில் வந்தார்[b]; வெளித்தோற்றத்தில் மனிதராகக் காணப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம்மை ஒன்றுமில்லாதவராக்கினார்.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “மனிதர்களின் சாயலில் வந்தவராக.” இங்குள்ள “சாயல்” என்பது அவர் உண்மையில் மனிதர் அல்ல என்று பொருள்படாது.
    reason: source_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள வலுவான முரண்பாட்டை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: தம்மையே வெறுமையாக்கினார்
  rationale: κενόω என்பதன் ‘வெறுமையாக்குதல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; தெய்வீக பண்புகளை விட்டுவிட்டார் போன்ற விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை. ‘தம்மையே’ என்பது பிரதிபெயரின் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: μορφὴν δούλου λαβών
  choice: அடிமையின் வடிவத்தை ஏற்று
  rationale: μορφή என்பதற்கு ‘வடிவம்’ என்று மொழிபெயர்த்து சூழலிலுள்ள இணைநிலையைப் பாதுகாக்கிறது; δοῦλος என்பதன் கட்டுப்பட்ட அடிமை நிலையைக் ‘அடிமை’ தெளிவாகக் காட்டுகிறது; λαβών என்பதன் பங்கேற்பு அமைப்பை ‘ஏற்று’ இயல்பாக வழங்குகிறது.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: மனிதர்களின் சாயலில் வந்தார்
  rationale: ὁμοίωμα என்பதிலுள்ள ஒப்புமை அல்லது சாயல் கருத்தையும், γενόμενος என்பதிலுள்ள ஒரு நிலைக்கு அல்லது இருப்புக்கு வருதல் என்ற கருத்தையும் பாதுகாக்கிறது. இது உண்மையான மனிதத்தன்மையை மறுப்பதாகவோ, கிரேக்கம் கூறுவதைவிட வலுவாக முழு அடையாளத்தை வரையறுப்பதாகவோ இல்லை.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: வெளித்தோற்றத்தில் மனிதராகக் காணப்பட்டார்
  rationale: σχῆμα குறிக்கும் காணக்கூடிய தோற்றத்தை ‘வெளித்தோற்றம்’ எனத் தெரிவித்து, முன்புள்ள μορφήக்கு பயன்படுத்திய ‘வடிவம்’ என்பதிலிருந்து வேறுபடுத்துகிறது. ἄνθρωπος இங்கு பாலினத்தைக் குறிப்பதல்ல; ஆகவே ‘மனிதராக’ என்று தரப்பட்டுள்ளது.
theological_decisions:
- issue: ‘தம்மையே வெறுமையாக்கினார்’ என்பதன் கிறிஸ்தியல் பொருள்
  choice: கிரேக்க உருவகத்தை அப்படியே தக்கவைத்து, தொடர்ந்து வரும் பங்கேற்புச் சொற்றொடர்கள் அந்தத் தம்மை வெறுமையாக்குதலின் முறையை விளக்க அனுமதித்தல்.
  alternative: தம்மை ஒன்றுமில்லாதவராக்கினார்; அல்லது தெய்வீக பண்புகளைத் துறந்தார் என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: வசனம் தானே அடிமையின் வடிவத்தை ஏற்றதையும் மனிதர்களின் சாயலில் வந்ததையும் தொடர்ந்து கூறுகிறது. குறிப்பிட்ட கெனோசிஸ் கோட்பாட்டை உரைக்குள் புகுத்தாமல் அதன் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: ‘மனிதர்களின் சாயல்’ என்பதன் வலிமை
  choice: ὁμοίωμα என்பதன் சாயல் அல்லது ஒப்புமை மொழியைப் பாதுகாத்தல்.
  alternative: வெறும் மனிதத் தோற்றம் என்று பலவீனப்படுத்துதல்; அல்லது கிரேக்கத்தைவிட வலுவாக மனிதர்களோடு முழுமையான ஒரே தன்மை என்று கூறுதல்.
  rationale: பவுலின் சொற்களிலுள்ள நுட்பமான இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் வைத்திருக்கிறது; ‘சாயல்’ என்பது உண்மையான மனிதத்தன்மையை மறுப்பதாகப் புரிந்துகொள்ளப்படக் கூடாது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வடிவம்’ (μορφή), ‘சாயல்’ (ὁμοίωμα), ‘வெளித்தோற்றம்’ (σχῆμα) என்று மூன்று வேறுபட்ட கிரேக்கச் சொற்களின் நுணுக்கம் முடிந்தவரை தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன.
