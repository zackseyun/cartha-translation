source:
  edition: SBLGNT
  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: ta
  text: 'ஆனால், சோதனையில் நிரூபிக்கப்பட்ட அவருடைய பண்பை நீங்கள் அறிவீர்கள்[a]: ஒரு பிள்ளை தன் தந்தையுடன் பணியாற்றுவதுபோல[b], அவர் என்னோடு சேர்ந்து நற்செய்திக்காகப் பணியாற்றினார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சோதனையில் நிரூபிக்கப்பட்ட அவருடைய தகுதியை.” இச்சொல் சோதனையின் மூலம் உண்மையானது எனத் தெரியவந்த பண்பு அல்லது தகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “ஒரு தந்தையுடன் ஒரு பிள்ளை [பணியாற்றுவதுபோல].”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள மென்மையான மாறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δοκιμὴν αὐτοῦ
  choice: சோதனையில் நிரூபிக்கப்பட்ட அவருடைய பண்பை
  rationale: δοκιμή என்பது வெறும் ‘சான்று’ அல்ல; சோதனையின் வழியாக உண்மையானது எனத் தெரியவந்த பண்பை இங்கு குறிக்கிறது.
- source_word: γινώσκετε
  choice: நீங்கள் அறிவீர்கள்
  rationale: தீமோத்தேயுவைப் பற்றி பிலிப்பியர்கள் ஏற்கெனவே அறிந்திருப்பதை நிகழ்கால வினை நேரடியாகக் காட்டுகிறது.
- source_word: ὡς πατρὶ τέκνον
  choice: ஒரு பிள்ளை தன் தந்தையோடு இருப்பதுபோல
  rationale: τέκνον என்பதன் பாலினம் குறிப்பிடாத ‘பிள்ளை’ என்ற பொருளையும், தந்தை–பிள்ளை உறவு உவமையையும் பாதுகாக்கிறது; தமிழில் இயல்புக்காக ‘தன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: σὺν ἐμοὶ
  choice: என்னோடு சேர்ந்து
  rationale: பவுலுடன் இணைந்து செய்த பணியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐδούλευσεν
  choice: பணியாற்றினார்
  rationale: δουλεύω சொற்குடும்பத்தின் சேவைப் பொருளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; இங்கு ‘அடிமையாக உழைத்தார்’ என்பது தேவையற்ற அளவு சொற்பொருள் சார்ந்ததாக இருக்கும்.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: நற்செய்திக்காக
  rationale: அவர்களுடைய இணைந்த பணி நற்செய்தியை நோக்கியது என்பதைக் குறிக்கும் εἰς என்பதன் நோக்கப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தந்தை–பிள்ளை உவமையில் சேவையின் தொடர்பு
  choice: ‘ஒரு பிள்ளை தன் தந்தையோடு இருப்பதுபோல’ என்று உவமையைத் தனியே வைத்துப் பின்னர் ‘அவர் என்னோடு சேர்ந்து ... பணியாற்றினார்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒரு பிள்ளை தன் தந்தைக்குப் பணிசெய்வதுபோல அவர் எனக்குப் பணிசெய்தார்’
  rationale: மாற்று வடிவம் தீமோத்தேயு பவுலுக்கே பணிசெய்தார் என்று பொருளைத் திருப்பிவிடலாம். கிரேக்கத்தில் σὺν ἐμοὶ என்பது ‘என்னோடு சேர்ந்து’ என்றும், εἰς τὸ εὐαγγέλιον என்பது சேவை நற்செய்தியை நோக்கியது என்றும் கூறுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிள்ளை’ என்பது மூலத்தின் பாலினம் குறிப்பிடாத τέκνον என்பதைப் பாதுகாக்கிறது; ‘மகன்’ என்று குறிப்பாக்கப்படவில்லை. ‘நற்செய்தி’ என்பது εὐαγγέλιον என்பதற்கான தெளிவான, வழக்கமான தமிழ்ச் சொல்.
