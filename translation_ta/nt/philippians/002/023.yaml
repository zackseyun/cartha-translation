  text: Therefore[a], I hope to send him as soon as I see how things go with me.
translation:
  language: ta
  text: ஆகவே, என் நிலைமை எவ்வாறு உள்ளது என்பதை நான் தெளிவாக அறிந்தவுடனேயே, அவரை அனுப்புவேன் என்று நம்புகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον
  choice: அவரை
  rationale: உடனடியான சூழலில் தீமோத்தேயுவைக் குறிக்கும் சுட்டுப்பெயர்; தமிழில் மரியாதையுடனும் இயல்பாகவும் «அவரை» என வழங்கப்படுகிறது.
- source_word: μὲν οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவுசார் இடைமாற்றத்தை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: ἐλπίζω πέμψαι
  choice: அனுப்பலாம் என நம்புகிறேன்
  rationale: ἐλπίζω என்பதிலுள்ள நம்பிக்கை அல்லது எதிர்பார்ப்பின் நுணுக்கத்தைத் தக்கவைத்து, தமிழில் இயல்பாக அமைகிறது.
- source_word: ὡς ἂν ἀφίδω
  choice: தெரிந்தவுடனே
  rationale: பவுலின் நிலைமை எவ்வாறு முடியும் என்பதை அவர் அறிந்துகொள்ளும் எதிர்காலத் தருணத்தையும், அதனைத் தொடர்ந்து உடனே செயல்படுவதையும் தெரிவிக்கிறது.
- source_word: τὰ περὶ ἐμέ
  choice: என் நிலைமை என்னவாகும்
  rationale: பவுலைச் சார்ந்த காரியங்கள் அல்லது சூழ்நிலைகள் என்ற பொருளை, இச்சூழலில் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξαυτῆς
  choice: உடனே
  rationale: அறிந்ததும் தாமதமின்றி அனுப்பும் உடனடித் தன்மையை «தெரிந்தவுடனே» என்ற ஒருங்கிணைந்த சொல்லாக்கத்தில் தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. கிரேக்கத்தின் எதிர்கால நிபந்தனையும் உடனடித் தன்மையும் இயல்பான தமிழில் ஒருங்கிணைக்கப்பட்டுள்ளன.
