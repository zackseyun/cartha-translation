  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτο ⸀φρονεῖτε ἐν ὑμῖν ὃ καὶ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/005.yaml
  text: Have this mindset among yourselves[a], which was also in Messiah Jesus[b],
translation:
  language: ta
  text: மேசியா இயேசுவிலும் இருந்த இந்த மனப்பாங்கை உங்களிடையே கொண்டிருங்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியா இயேசுவில் நீங்களும் கொண்டிருக்கும் இந்த மனப்பாங்கை உங்களிடையே கொண்டிருங்கள்.”
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் “கிறிஸ்து”; Χριστός இங்கு ஒரு பட்டப்பெயராக இருப்பதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: இந்த
  rationale: அடுத்து விவரிக்கப்படும் மனப்பாங்கைச் சுட்டுகிறது; கிரேக்கத்தின் சுருக்கத்தையும் முன்னோக்கிய சுட்டுதலையும் காக்கிறது.
- source_word: φρονεῖτε
  choice: மனப்பாங்கு … இருக்கட்டும்
  rationale: இங்கு வெறும் சிந்தனைச் செயலை அல்லாமல் தொடர்ச்சியான மனநிலையையும் அணுகுமுறையையும் குறிக்கிறது; தமிழில் அறிவுறுத்தலின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையேயும்
  rationale: பன்மை வடிவமும் பிலிப்பியர் 2:1–4 இன் சமூகச் சூழலும் தனிநபருக்குள் என்பதைக் காட்டிலும் விசுவாசிகளின் நடுவில் என்ற பொருளை ஆதரிக்கின்றன.
- source_word: ὃ καὶ ἐν Χριστῷ Ἰησοῦ
  choice: மேசியா இயேசுவில் இருந்த
  rationale: சுருக்கமான கிரேக்கத் தொடர்பை, இயேசுவில் காணப்பட்ட மனப்பாங்கைக் குறிக்கும் முதன்மை வாசிப்பாக இயல்பான தமிழில் தருகிறது.
- source_word: Χριστῷ
  choice: மேசியா
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மேசியா’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: இறுதிக் கூற்று இயேசுவில் முன்மாதிரியாக இருந்த மனப்பாங்கைக் குறிக்கிறதா, அல்லது மேசியா இயேசுவோடு இணைந்திருப்பதால் விசுவாசிகள் கொண்டிருக்கும் மனப்பாங்கைக் குறிக்கிறதா?
  choice: 'முன்மாதிரி வாசிப்பு: ‘மேசியா இயேசுவில் இருந்த இந்த மனப்பாங்கு.’'
  alternative: 'பங்கேற்பு/இணைவு வாசிப்பு: ‘மேசியா இயேசுவில் நீங்கள் கொண்டிருக்கும் இந்த மனப்பாங்கை உங்களிடையே கொண்டிருங்கள்.’'
  rationale: அடுத்த வசனங்கள் மேசியாவின் தாழ்மையை விசுவாசிகளுக்கான முன்மாதிரியாக விரிக்கின்றன. எனினும் கிரேக்கம் சுருக்கமாக இருப்பதால், மேசியாவோடு இணைந்திருப்பதைக் குறிக்கும் வாசிப்பும் சாத்தியம்; அது அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க வேதாகம நடையிலும் அமைக்கப்பட்டுள்ளது. ‘உங்களிடையே’ என்பது சமூக நோக்கைத் தெளிவாக்குகிறது; ‘மனப்பாங்கு’ என்பது வெறும் எண்ணத்தைவிட நிலையான அணுகுமுறையை வெளிப்படுத்துகிறது.
