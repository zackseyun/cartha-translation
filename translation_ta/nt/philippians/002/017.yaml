  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: ta
  text: ஆனால், உங்கள் விசுவாசத்தின்[c] பலியின்மீதும் வழிபாட்டுப் பணியின்மீதும்[b] நான் பானபலியாக ஊற்றப்பட்டாலும்[a], நான் மகிழ்கிறேன்; உங்கள் அனைவரோடும் சேர்ந்து மகிழ்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் பானப்படையலாக ஊற்றப்பட்டாலும்.’
    reason: lexical_alternative
  - marker: b
    text: ‘வழிபாட்டுப் பணி’ என்பதை ‘சேவை’ அல்லது ‘ஊழியம்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் இங்கு வழிபாடு சார்ந்த மொழிநடையைத் தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உங்கள் உண்மைப்பற்றின்.’
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: பானபலியாக ஊற்றப்பட்டாலும்
  rationale: பலியோடு தொடர்புடைய பானப்படையல் ஊற்றப்படும் உருவகத்தைத் தெளிவாகவும் இயல்பான தமிழிலும் காக்கிறது; நிகழ்காலச் செயலின் சாத்தியத்தையும் ‘ஊற்றப்பட்டாலும்’ வெளிப்படுத்துகிறது.
- source_word: ἐπὶ
  choice: மீதும்
  rationale: பவுலின் உயிர், பிலிப்பியருடைய பலி மற்றும் வழிபாட்டுப் பணியின்மீது பானபலியாக ஊற்றப்படுவது என்ற வழிபாட்டு உருவகத்தைப் பேணுகிறது; ‘அதனுடன் கூடுதலாக’ என்ற நிழற்பொருளையும் முற்றிலும் நீக்கவில்லை.
- source_word: θυσίᾳ
  choice: பலி
  rationale: பலியிடுதல் சார்ந்த வழிபாட்டு மொழியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: λειτουργίᾳ
  choice: வழிபாட்டுப் பணி
  rationale: பொதுவான ‘சேவை’ என்பதைவிட, இச்சூழலில் பலியோடு இணைந்துள்ள வழிபாட்டு நிழற்பொருளைப் பாதுகாக்கிறது; குறிப்பிட்ட மதப்பிரிவின் குருத்துவப் பதவியைத் திணிக்கவில்லை.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இங்கு முதன்மையாக நம்பிக்கையைக் குறிக்கும் இயல்பான தேர்வு; ‘உண்மைப்பற்று’ என்ற சாத்தியத்தை அடிக்குறிப்பில் வைத்திருக்கிறது.
- source_word: χαίρω
  choice: நான் மகிழ்கிறேன்
  rationale: பிலிப்பியர் கடிதத்தில் திரும்பத் திரும்ப வரும் மகிழ்ச்சிக் கருத்தையும் நிகழ்கால அறிவிப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: συγχαίρω
  choice: உங்கள் அனைவரோடும் சேர்ந்து மகிழ்கிறேன்
  rationale: σύν கூறும் கூட்டுப் பங்கேற்பைத் தெளிவாகப் பேணி, ‘வாழ்த்துகிறேன்’ என்ற இச்சூழலுக்குப் பொருந்தாத பொருளைத் தவிர்க்கிறது.
- source_word: πᾶσιν ὑμῖν
  choice: உங்கள் அனைவரோடும்
  rationale: சமூகத்தினர் அனைவரையும் உள்ளடக்கும் வலியுறுத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுலின் சாத்தியமான மரணத்தைக் குறிக்கும் பலியிடுதல் உருவகம்
  choice: பிலிப்பியருடைய விசுவாசத்தின் பலி மற்றும் வழிபாட்டுப் பணியின்மீது தாம் பானபலியாக ஊற்றப்படுவதாகப் பவுல் உருவகமாகக் கூறுகிறார்.
  alternative: அவர்களுடைய பணியோடு இணைந்து தமது வாழ்வு செலவிடப்படுவதாக மட்டுமே பவுல் கூறுகிறார்; பலியிடுதல் சார்ந்த தீவிரப் பொருள் இல்லை.
  rationale: σπένδομαι, θυσία, λειτουργία ஆகிய மூன்று சொற்களும் ஒன்றாக வருவதால், பொதுவான சேவை மொழியாகத் தட்டையாக்காமல் வழிபாட்டு மற்றும் பலியிடுதல் உருவகத்தைப் பாதுகாப்பது பொருத்தமானது.
- issue: τῆς πίστεως என்பதன் பொருள்
  choice: ‘உங்கள் விசுவாசம்’ என்பது பிலிப்பியரின் நம்பிக்கையை முதன்மையாகக் குறிக்கிறது.
  alternative: இது அவர்களுடைய ‘உண்மைப்பற்றை’ அல்லது விசுவாச நிலைத்தன்மையைக் குறிக்கலாம்.
  rationale: πίστις என்பதற்கு இச்சூழலில் ‘விசுவாசம்’ இயல்பான முதன்மைப் பொருள்; ஆயினும் ‘உண்மைப்பற்று’ என்ற நியாயமான பொருள் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் மதிப்புமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிபாட்டுப் பணி’ என்பது பலியோடு இணைந்த கிரேக்க வழிபாட்டு நிழற்பொருளைத் தக்கவைத்தாலும், குறிப்பிட்ட திருச்சபை அமைப்பு அல்லது குருத்துவக் கோட்பாட்டைச் சுமத்தாத நடுநிலைச் சொல்லாக்கமாகும். ‘மகிழ்கிறேன்; ... சேர்ந்து மகிழ்கிறேன்’ என்ற மீளுரைத்தல் மூலத்தின் χαίρω/συγχαίρω சொல் தொடர்பைப் பாதுகாக்கிறது.
