source:
  edition: SBLGNT
  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: ta
  text: ஆகையால், கடவுளும் அவரை மிகவும் உயர்த்தி, எல்லாப் பெயருக்கும் மேலான பெயரை[b] அவருக்கு அருளிக் கொடுத்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அருளிக் கொடுத்தார்’ என்பதற்கு மாற்றாக, ‘வழங்கினார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பெயர்’ என்பது உச்சரிக்கப்படும் பெயரை மட்டுமல்லாமல் நிலை, பதவி அல்லது பட்டத்தையும் குறிக்கக்கூடும்; எந்தப் பெயர் குறிக்கப்படுகிறது என்பதை இந்த வசனம் இன்னும் வெளிப்படையாகச் சொல்லவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: ஆகையால், ... உம்
  rationale: διό என்பதன் முடிவுரைத் தொடர்பை ‘ஆகையால்’ என்றும், καί என்பதன் சேர்க்கைப் பொருளை ‘கடவுளும்’ என்பதிலுள்ள ‘உம்’ என்றும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் குறிப்பிட்டும் உள்ள எழுவாயை நவீனத் தமிழின் வழக்கமான இறைச்சுட்டுச் சொல்லால் தருகிறது.
- source_word: ὑπερύψωσεν
  choice: மிக உயர்வாக உயர்த்தி
  rationale: ὑπερ- முன்னொட்டின் தீவிரப்படுத்தும் வலிமையைத் தக்கவைக்கிறது; ‘மிக உயர்ந்த இடத்திற்கு உயர்த்தினார்’ என்று இடத்தை உரையில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐχαρίσατο
  choice: அருளிக் கொடுத்தார்
  rationale: வெறுமனே ‘கொடுத்தார்’ என்பதைக் காட்டிலும் χάρις சார்ந்த அருள்/தயவு நுண்பொருளை வெளிப்படுத்துகிறது; அதேவேளை தமிழில் இயல்பாக உள்ளது.
- source_word: τὸ ὄνομα
  choice: பெயரை
  rationale: மூலத்தில் உள்ள ‘பெயர்’ என்பதையே நேரடியாகக் காத்து, அதை ‘பட்டம்’ அல்லது ‘நிலை’ என்று முதன்மை உரையில் விளக்கித் தீர்மானிக்கவில்லை.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: எல்லாப் பெயருக்கும் மேலான பெயரை
  rationale: ὑπὲρ πᾶν ὄνομα என்பதன் ஒப்பீட்டு அமைப்பைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: ‘அந்தப் பெயர்’ எது என்பது
  choice: முதன்மை உரையில் ‘பெயர்’ என்றே வைத்து, அது எது என்று குறிப்பிடவில்லை.
  alternative: அதை ‘இயேசு’ என்ற பெயராகவோ, அடுத்த வசனங்களில் வெளிப்படும் ‘ஆண்டவர்’ என்ற தெய்வீகப் பட்டமாகவோ வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: இந்த வசனம் அந்தப் பெயரைத் தானாகவே குறிப்பிடாததால், பிலிப்பியர் 2:10–11 அடிப்படையிலான ஒரு விளக்கத்தை வசனம் 9-க்குள் கொண்டு வராமல் அதன் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மிக உயர்வாக உயர்த்தி’ என்ற சொற்றொடர் தமிழில் ஓரளவு வலியுறுத்தலுடனான மீளுரைப்பாக இருந்தாலும், ὑπερύψωσεν என்பதன் தீவிரத்தை இடம் அல்லது பதவி போன்ற விளக்கங்களைச் சேர்க்காமல் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்புக் குறிகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின் [a][b] என இடப்பட்டுள்ளன.
