- from: ஆகவே, ஆண்டவருக்குள் அவனை முழு மகிழ்ச்சியுடன் வரவேற்றுக்கொள்ளுங்கள்; அவனைப் போன்றவர்களை[a] மதிப்புக்குரியவர்களாகக் கருதுங்கள்.
  to: ஆகவே, ஆண்டவருக்குள் அவனை மிகுந்த மகிழ்ச்சியுடன் வரவேற்றுக் கொள்ளுங்கள்; அவனைப் போன்றவர்களை[a] மதிப்புக்குரியவர்களாகக் கருதுங்கள்.
