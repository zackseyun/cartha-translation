source:
  edition: SBLGNT
  text: προσδέχεσθε οὖν αὐτὸν ἐν κυρίῳ μετὰ πάσης χαρᾶς, καὶ τοὺς τοιούτους ἐντίμους ἔχετε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/029.yaml
  text: So welcome him in the Lord with all joy[a], and hold people like him in honor.
translation:
  language: ta
  text: ஆகவே, ஆண்டவருக்குள் அவனை மிகுந்த மகிழ்ச்சியுடன் வரவேற்றுக் கொள்ளுங்கள்; அவனைப் போன்றவர்களை[a] மதிப்புக்குரியவர்களாகக் கருதுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்படிப்பட்ட ஆண்களை.” இங்கு கிரேக்க மொழியில் ஆண்பால் பன்மைச் சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέχεσθε
  choice: வரவேற்றுக்கொள்ளுங்கள்
  rationale: வெறுமனே ஏற்றுக்கொள்வதைவிட அன்போடும் மகிழ்ச்சியோடும் வரவேற்பதை இந்தக் கட்டளை உணர்த்துகிறது; பவுலின் மேய்ப்புப் பாங்குக்கும் இது பொருந்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களிலிருந்து வரும் முடிவுறுத்தும் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலுக்குரிய செறிவான சொற்றொடரைப் பொருள் விரிவாக்கமின்றிப் பாதுகாத்து, ஆண்டவருடனான உறவையும் ஒன்றிப்பையும் திறந்த நிலையில் வைக்கிறது.
- source_word: μετὰ πάσης χαρᾶς
  choice: முழு மகிழ்ச்சியுடன்
  rationale: πᾶς தெரிவிக்கும் நிறைவையும் χαρά தெரிவிக்கும் மகிழ்ச்சியையும் இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: τοὺς τοιούτους
  choice: அவனைப் போன்றவர்களை
  rationale: எப்பாப்பிரோதீத்தை முன்மாதிரியாகக் கொண்டு, அவரைப் போன்ற வகையைச் சேர்ந்தவர்களை இந்தச் சொற்றொடர் சுட்டுகிறது. தமிழில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது; கிரேக்கத்தின் ஆண்பால் வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ἐντίμους ἔχετε
  choice: மதிப்புக்குரியவர்களாகக் கருதுங்கள்
  rationale: இப்படிப்பட்டவர்களை மதிப்பிற்குரியவர்களென எண்ணி அதற்கேற்ப நடத்த வேண்டும் என்ற பொருளை, வெறும் ‘மதியுங்கள்’ என்பதைக் காட்டிலும் மூலத்தின் அமைப்புக்கு நெருக்கமாகத் தெரிவிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்டவருக்குள்’ என்ற பவுலுக்குரிய இறையியல் செறிவுள்ள சொல்லாட்சி விளக்கிப் பரப்பப்படாமல் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் τοὺς τοιούτους என்பதற்கான தமிழாக்கத்தின் அருகே வைக்கப்பட்டுள்ளது.
