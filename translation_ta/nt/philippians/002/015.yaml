  source_fidelity: திருத்தம் தேவை. வரைவில் ἄμεμπτοι என்பதற்கான “குற்றஞ்சாட்டப்படாதவர்கள்” தேவையற்ற செயலற்ற நுணுக்கத்தைச் சேர்க்கிறது; “குற்றமற்றவர்கள்” மூலத்திற்கு நெருக்கமானது. ἀκέραιοι-க்கு “தூய உள்ளம் கொண்டவர்கள்” என்பது ‘உள்ளம்’ என்ற மூலத்தில் இல்லாத கூறைச் சேர்க்கிறது. மேலும் ἵνα γένησθε-யின் நோக்க/ஆகுதல் அமைப்பில் இருக்கும் பன்மை எதிர்பார்ப்பு, இறுதியில் உள்ள φαίνεσθε-யின் நிகழ்காலக் கூற்றிலிருந்து வேறுபடுத்தப்பட வேண்டும்.
