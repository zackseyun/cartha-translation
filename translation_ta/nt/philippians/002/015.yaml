id: PHP.2.15
reference: Philippians 2:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: ta
  text: நீங்கள் குற்றமற்றவர்களும் கபடமற்றவர்களும், கோணலும் நெறிபிறழ்வும் உள்ள தலைமுறையின் நடுவில்[a] களங்கமற்ற கடவுளின் பிள்ளைகளுமாக ஆகும்படியாக, அவர்களிடையே உலகத்தில் ஒளிச்சுடர்களைப் போல் பிரகாசிக்கிறீர்கள்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கோணலும் நெறிபிறழ்வும் உள்ள தலைமுறை” என்பது உபாகமம் 32:5-ஐ எதிரொலிப்பதாக இருக்கலாம்; அங்கே கடவுளின் பிள்ளைகள் ஒரு சீர்கெட்ட தலைமுறையோடு வேறுபடுத்திக் காட்டப்படுகிறார்கள்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “தோன்றுகிறீர்கள்.”
    reason: lexical_alternative
  - marker: c
    text: “ஒளிச்சுடர்கள்” என்பதற்கு “வான்சுடர்கள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γένησθε
  choice: ஆகும்படியாக
  rationale: ἵνα உணர்த்தும் நோக்கம் அல்லது விளைவைத் திறந்தவாறே வைத்துக் கொண்டு, γένησθε என்பதிலுள்ள ‘ஆகுதல்’ என்ற இயக்கத்தையும் தொடர்ச்சியான தமிழ் வாக்கிய அமைப்பில் பாதுகாக்கிறது.
- source_word: ἄμεμπτοι
  choice: குற்றஞ்சாட்டப்படாதவர்கள்
  rationale: ஒழுக்கக் குற்றம் சுமத்துவதற்கு இடமில்லாத நிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἀκέραιοι
  choice: தூய உள்ளம் கொண்டவர்கள்
  rationale: கலப்பற்ற தன்மை, நேர்மை, தீங்கற்ற தூய்மை ஆகிய கருத்துகளை வாசிக்க எளிதான ஒழுக்க மொழியில் தருகிறது; அடுத்துள்ள ἄμωμα என்பதோடு ஒரே சொல்லைத் திரும்பப் பயன்படுத்துவதைத் தவிர்க்கிறது.
- source_word: τέκνα θεοῦ
  choice: கடவுளின் பிள்ளைகள்
  rationale: τέκνα ஆண்பாலுக்கு மட்டும் உரியதல்ல; பாலினம் உள்ளடங்கிய குடும்ப உறவைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ἄμωμα
  choice: களங்கமற்ற
  rationale: முந்தைய ἄμεμπτοι என்பதிலிருந்து வேறுபட்ட களங்கம் அல்லது பழுது இல்லாமை என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: μέσον γενεᾶς σκολιᾶς καὶ διεστραμμένης
  choice: கோணலும் நெறிபிறழ்வும் உள்ள தலைமுறையின் நடுவில்
  rationale: μέσον என்பதின் ‘நடுவில்’ என்ற இடநிலையையும், σκολιᾶς மற்றும் διεστραμμένης ஆகிய இரு வலுவான ஒழுக்க வருணனைகளின் வேறுபாட்டையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐν οἷς
  choice: அவர்களிடையே
  rationale: γενεά என்பது இங்கு அந்தத் தலைமுறையைச் சேர்ந்த மக்களைக் குறிக்கிறது என்பதைக் காட்டும் இயல்பான தனிநபர் சார்ந்த தமிழ் வடிவம்.
- source_word: φαίνεσθε
  choice: பிரகாசிக்கிறீர்கள்
  rationale: φωστῆρες உடனான சூழலில் ஒளிவிடுதல் என்ற பொருள் இயல்பானது; ‘தோன்றுகிறீர்கள்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: φωστῆρες
  choice: ஒளிச்சுடர்கள்
  rationale: ஒளி தரும் பொருட்கள் அல்லது வான்சுடர்கள் என்ற பரந்த பொருளைத் தாங்கும் தெளிவான தமிழ் சொல்; ‘நட்சத்திரங்கள்’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: ἐν κόσμῳ
  choice: உலகத்தில்
  rationale: மனிதர்கள் வாழும் உலகம் என்ற சூழல்சார் பொருளை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘களங்கமற்ற’ என்பது ‘கடவுளின் பிள்ளைகள்’ என்பதோடு கொண்டுள்ள தொடர்பும் உபாகமம் 32:5-ன் எதிரொலியும்
  choice: ‘களங்கமற்ற கடவுளின் பிள்ளைகள்’ என்று நேரடியாக இணைத்து, பழைய ஏற்பாட்டு எதிரொலியை அடிக்குறிப்பில் மட்டும் சுட்டிக்காட்டுதல்
  alternative: ‘களங்கமற்ற’ என்பதை வசனத்தின் அனைத்து ஒழுக்க வருணனைகளுக்கும் பொதுவாக இணைத்தல்
  rationale: கிரேக்கச் சொற்றொடர் ἄμωμα என்பதை τέκνα θεοῦ உடன் இயல்பாக இணைக்கிறது. ‘கோணலும் நெறிபிறழ்வும் உள்ள தலைமுறை’ என்ற சொற்கள் உபாகமம் 32:5-ஐ நினைவூட்டினாலும், அந்த மேற்கோள் தொடர்பை முதன்மை உரையில் விளக்கமாகச் சேர்க்காமல் இருப்பது மூலத்தின் மறைமுகத் தன்மையைப் பாதுகாக்கிறது.
- issue: φαίνεσθε என்பதின் ‘பிரகாசிக்கிறீர்கள்’ / ‘தோன்றுகிறீர்கள்’ என்ற பொருள் வேறுபாடு
  choice: சூழலுக்கு ஏற்ற ‘பிரகாசிக்கிறீர்கள்’ என்பதை முதன்மை உரையில் பயன்படுத்துதல்
  alternative: ‘ஒளிச்சுடர்களைப் போல் தோன்றுகிறீர்கள்’
  rationale: φωστῆρες என்ற ஒளி உருவகத்துடன் ‘பிரகாசித்தல்’ வலுவாகப் பொருந்துகிறது; எனினும் φαίνομαι என்பதின் ‘தோன்றுதல்’ என்ற பொருளை அடிக்குறிப்பில் பாதுகாப்பது உண்மையான சொற்பொருள் தெளிவின்மையை மறைக்காமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் கருத்தைத் தொடரும் நோக்கக் கிளவியாக இருப்பதால், ‘ஆகும்படியாக’ என்ற தொடர்ச்சி வடிவம் வைக்கப்பட்டுள்ளது. ஒழுக்கத் தீவிரம் மெலிதாக்கப்படவில்லை; அதேவேளை சமகாலத்தில் தேவையற்ற வேறு பொருள்களை எழுப்பக்கூடிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
