source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: ta
  text: ஏனெனில், அவன் உண்மையாகவே மரணத்தை நெருங்கும் அளவுக்கு நோயுற்றிருந்தான்[a]. ஆனால் கடவுள் அவனுக்கு இரக்கம் காட்டினார்; அவனுக்கு மட்டுமல்ல, எனக்கும் இரக்கம் காட்டினார்; எனக்குத் துக்கத்தின்மேல் துக்கம் ஏற்படாதபடியாக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரணத்திற்கு அருகில்” அல்லது “மரணத்தின் விளிம்பில்.”
    reason: lexical_alternative
  - marker: b
    text: “துக்கத்தின்மேல் துக்கம்” என்பது ஒன்றின்மேல் ஒன்று கூடிவரும் துயரத்தைக் குறிக்கும் சொல்லமைப்பு.
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: நோயுற்றிருந்தான்
  rationale: இச்சூழலில் ἀσθενέω உடல் நோயைக் குறிக்கிறது. இறந்தகால நிகழ்வையும் தொடர்ந்து இருந்த நிலையையும் இயல்பான தமிழில் இச்சொல் வெளிப்படுத்துகிறது.
- source_word: παραπλήσιον θανάτῳ
  choice: சாவுக்கு அருகில் போகும் அளவுக்கு
  rationale: மரணம் நேர்ந்ததாகக் கூறாமல், மரணத்தை மிகவும் நெருங்கிய நிலையைக் காட்டுகிறது; நவீனத் தமிழிலும் தெளிவாக உள்ளது.
- source_word: ἠλέησεν
  choice: இரக்கம் காட்டினார்
  rationale: ἐλεάω என்பதிலுள்ள கருணைமிக்க செயற்பாட்டையும் இறையியல் நிறையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: அவன்மேல் மட்டுமல்ல, என்மேலும் இரக்கம் காட்டினார்
  rationale: முந்தைய வினையைத் தமிழில் மீண்டும் கூறுவது பொருளைத் தெளிவாக்கி, அவன்—நான் என்ற கிரேக்க எதிரிணையைப் பாதுகாக்கிறது.
- source_word: ἵνα μὴ
  choice: ஏற்படாதபடி
  rationale: தவிர்க்கப்பட்ட விளைவைச் சுட்டும் நோக்கப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: λύπην ἐπὶ λύπην
  choice: துக்கத்தின்மேல் துக்கம்
  rationale: மூலத்தின் சொல்லடுக்கையும் கூடி வரும் துயரத்தின் வலிமையையும் காக்கிறது.
- source_word: σχῶ
  choice: ஏற்பட
  rationale: தமிழில் துக்கத்தோடு இயல்பாக இணையும் வினையாக இருந்து, ‘பெறுதல்/கொண்டிருத்தல்’ என்ற மூலத்தின் பரந்த பொருளைச் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கடவுளின் இரக்கம் பவுல்மேலும் காட்டப்பட்டது என்பதன் பொருள்
  choice: எப்பாப்பிரோதித்துவைக் குணப்படுத்தியதன் மூலம் பவுலுக்கு மேலதிகத் துக்கம் ஏற்படாமல் செய்த இரக்கமாக உரையைத் திறந்தே வைத்தல்
  alternative: பவுலுக்குத் தனியாக நிகழ்ந்த வேறொரு இரக்கச் செயலாக விளக்குதல்
  rationale: கிரேக்க உரை இரக்கத்தின் பொருளாக இருவரையும் குறிப்பிடுகிறது; ஆனால் பவுல்மேலான இரக்கம் எவ்வாறு செயல்பட்டது என்பதை அடுத்த நோக்கவாக்கியம் சுட்டினாலும் முழுமையாக வரையறுக்கவில்லை. ஆகவே கூடுதல் கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாவு’ என்பது θάνατος என்பதற்கு இச்சூழலில் நேரடியும் இயல்புமான சொல்; ‘மரணம்’ என்பதைக் காட்டிலும் வாக்கியத்தில் குறைந்த செயற்கைத்தன்மை கொண்டது. மூலத்தின் ‘துக்கத்தின்மேல் துக்கம்’ என்ற வலியுறுத்தல் மொழிபெயர்ப்பிலும் பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
