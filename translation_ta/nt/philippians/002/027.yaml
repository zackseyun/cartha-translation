revisions:
- from: உண்மையாகவே, அவன் சாவுக்கு அருகில் போகும் அளவுக்கு நோயுற்றிருந்தான்[a]. ஆனால் கடவுள் அவன்மேல் இரக்கம் காட்டினார்; அவன்மேல் மட்டுமல்ல, என்மேலும் இரக்கம் காட்டினார். இதனால் எனக்குத் துக்கத்தின்மேல் துக்கம் ஏற்படாதபடி செய்தார்[b].
  to: ஏனெனில், அவன் உண்மையாகவே மரணத்தை நெருங்கும் அளவுக்கு நோயுற்றிருந்தான்[a]. ஆனால் கடவுள் அவனுக்கு இரக்கம் காட்டினார்; அவனுக்கு மட்டுமல்ல, எனக்கும் இரக்கம் காட்டினார்; எனக்குத் துக்கத்தின்மேல் துக்கம் ஏற்படாதபடியாக[b].
