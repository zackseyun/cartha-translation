  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: ta
  text: ஆனால், ஆண்டவர் இயேசுவில், தீமோத்தேயுவை விரைவில் உங்களிடம் அனுப்புவேன் என்று நம்புகிறேன்; உங்களைப் பற்றிய செய்திகளை அறிந்து நானும் மனமகிழ்வடையும்படியாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: நம்புகிறேன்
  rationale: பவுலின் தற்போதைய நம்பிக்கையையும் எதிர்பார்ப்பையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்திலிருந்து மென்மையான திருப்பத்தையோ வேறுபாட்டையோ குறிக்கிறது.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: ஆண்டவராகிய இயேசுவுக்குள்
  rationale: பவுலின் நம்பிக்கை ஆண்டவர் இயேசுவுடனான உறவிலும் அவரைச் சார்ந்தும் அமைந்துள்ளது என்பதைச் சொல்லும் மூலமொழி வடிவத்தைத் தக்கவைக்கிறது.
- source_word: Τιμόθεον
  choice: தீமோத்தேயு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ταχέως
  choice: விரைவில்
  rationale: இங்கு செயல் நடைபெறும் வேகத்தைவிட அது அண்மையில் நடைபெறும் என்ற காலப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: πέμψαι ὑμῖν
  choice: உங்களிடம் அனுப்புவேன்
  rationale: தமிழில் இயல்பான வாக்கிய அமைப்புக்காக நம்பிக்கையின் உள்ளடக்கம் எதிர்கால வினையாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἵνα
  choice: அதற்காகவே
  rationale: தீமோத்தேயுவை அனுப்புவதன் நோக்கத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: κἀγὼ
  choice: நானும்
  rationale: καί உடன் சேர்ந்துள்ள வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
- source_word: εὐψυχῶ
  choice: மனத்தெளிவு பெறுவதற்காக
  rationale: நல்ல மனநிலையடைதல், மனம் தேறுதல் என்ற பொருளைச் சூழலுக்கு ஏற்ற தற்போதைய தமிழில் தெரிவிக்கிறது.
- source_word: γνοὺς τὰ περὶ ὑμῶν
  choice: நீங்கள் எப்படி இருக்கிறீர்கள் என்பதை அறிந்து
  rationale: பிலிப்பியர்களின் நிலைமையை அறிதல் என்ற கிரேக்கச் சொற்றொடரின் சூழற்பொருளை இயல்பான தமிழில் தருகிறது; மேலும் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: ἐν κυρίῳ Ἰησοῦ என்பதிலுள்ள κύριος பட்டப்பெயர்
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: புதிய ஏற்பாட்டின் கிறிஸ்துவியல் பட்டப்பெயராக κύριος இங்கு இயேசுவைக் குறிக்கிறது; ‘ஆண்டவர்’ என்பது இயல்பானதும் சமயப்பிரிவு சாராததுமான தமிழ் இணை.
- issue: ἐν κυρίῳ Ἰησοῦ என்பதிலுள்ள ἐν உறவு
  choice: இயேசுவுக்குள்
  alternative: இயேசுவைச் சார்ந்து
  rationale: மூலத்தின் உறவுசார் மொழியையும் அதன் இறையியல் செறிவையும் விளக்கிப் பரப்பாமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; இரண்டாம் வாக்கியத்தில் ‘அவரை அனுப்ப விரும்புகிறேன்’ என்பது நோக்கத் தொடர்பைத் தெளிவாக்க மீண்டும் சொல்லப்பட்டுள்ளது.
