  terminology: ‘ஆண்டவர்’ κύριος என்ற கிறிஸ்துவியல் பட்டப்பெயரைத் தக்கவைக்கிறது; ‘தீமோத்தேயு’ நிலையான தமிழ் பெயர்வடிவமாகும். τὰ περὶ ὑμῶν என்பதற்கு முதன்மை உரையில் ‘உங்களைப் பற்றிய செய்திகளை’ என்று இயல்பாகத் தரப்பட்டு, நேரடிச் சொல்லாக்கம் அடிக்குறிப்பில் உள்ளது.
