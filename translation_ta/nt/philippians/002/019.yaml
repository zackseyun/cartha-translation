  source_fidelity: திருத்தம் தேவை. வரைவில் ἵνα-நோக்கத் தொடரானது இரண்டாவது தனி வாக்கியமாகப் பிரிக்கப்பட்டு, மூலத்தில் இல்லாத ‘அவரை அனுப்ப விரும்புகிறேன்’ என்ற விருப்ப வினை சேர்க்கப்பட்டுள்ளது. மேலும் ‘அதற்காகவே’ நோக்கத் தொடர்பைத் தவறாக வலுப்படுத்துகிறது. திருத்தப்பட்ட உரை அனுப்புதல், அறிதல், மனமகிழ்தல் ஆகிய மூலத் தொடர்பைத் தக்கவைக்கிறது.
