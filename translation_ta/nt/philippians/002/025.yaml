source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: ta
  text: ஆனால், என் சகோதரரும், என்னுடன் உழைப்பவரும், என்னுடன் போராடும் வீரருமான எப்பாப்பிரோதித்துவை—உங்கள் தூதரும்[a], என் தேவைக்குச் சேவை செய்பவருமான[b] அவரை—உங்களிடம் அனுப்புவது அவசியம் என்று கருதினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் அப்போஸ்தலர்”—அதாவது, உங்களால் அனுப்பப்பட்டவர்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “என் தேவைக்கான சேவையாளர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: அவசியம்
  rationale: ἡγησάμην என்பதுடன் இணைந்து, பவுல் அவ்வாறு செய்வது தேவை என்று மதிப்பிட்டதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἡγησάμην
  choice: என்று கருதினேன்
  rationale: இது வெறும் எண்ணத்தை அல்ல, பவுலின் மதிப்பீட்டையும் தீர்மானத்தையும் வெளிப்படுத்துகிறது.
- source_word: πέμψαι
  choice: அனுப்புவது
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள ‘அனுப்புதல்’ என்ற பொருளை மட்டும் தருகிறது; சூழலிலிருந்து ஊகிக்கக்கூடிய ‘திருப்பி அனுப்புதல்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἀδελφὸν
  choice: என் சகோதரர்
  rationale: விசுவாச உறவைக் குறிக்கும் குடும்பச் சொல்லை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: συνεργὸν
  choice: உடன் உழைப்பவர்
  rationale: பவுலோடு சேர்ந்து பணியாற்றியவரைக் குறிக்கிறது; ‘உழைப்பு’ என்ற அடிப்படைப் படிமத்தையும் காக்கிறது.
- source_word: συστρατιώτην
  choice: உடன் போர்வீரர்
  rationale: கிரேக்கத்தின் இராணுவ உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: ἀπόστολον
  choice: உங்கள் தூதர்
  rationale: இங்கு பிலிப்பியர்களால் அனுப்பப்பட்ட பிரதிநிதி என்ற சூழல்சார் பொருளைத் தருகிறது; ஒரு குறிப்பிட்ட திருச்சபைப் பதவியைத் தேவையின்றி முன்வைப்பதில்லை.
- source_word: λειτουργὸν
  choice: பணிசெய்பவர்
  rationale: எப்பாப்பிரோதித்து பவுலின் தேவைக்காகச் செய்த கண்ணியமான சேவையை நவீன வாசகருக்குத் தெளிவாகக் கூறுகிறது; நவீன திருச்சபைப் பதவியைக் குறிப்பதாக இல்லை.
- source_word: τῆς χρείας μου
  choice: என் தேவையில் எனக்கு
  rationale: எப்பாப்பிரோதித்துவின் பணி பவுலின் நடைமுறைத் தேவையை நோக்கியது என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀπόστολον என்பதைப் பதவிப் பொருளில் ‘அப்போஸ்தலர்’ என மொழிபெயர்ப்பதா, பரந்த பொருளில் ‘தூதர்’ என மொழிபெயர்ப்பதா
  choice: உங்கள் தூதர்
  alternative: உங்கள் அப்போஸ்தலர்; உங்களால் அனுப்பப்பட்ட பிரதிநிதி
  rationale: உடனடிச் சூழலில் எப்பாப்பிரோதித்து பிலிப்பியர்களால் பவுலிடம் அனுப்பப்பட்டவர். ஆகவே ‘தூதர்’ என்பது அனுப்பப்பட்ட பிரதிநிதி என்ற பொருளைக் காத்து, அதிகாரபூர்வ அப்போஸ்தலப் பதவியைத் தேவையின்றி இறக்குமதி செய்வதைத் தவிர்க்கிறது.
- issue: λειτουργὸν என்பது அதிகாரபூர்வ ஊழியப் பதவியைக் குறிக்கிறதா அல்லது தேவைக்காகச் சேவை செய்பவரைக் குறிக்கிறதா
  choice: என் தேவையில் எனக்குப் பணிசெய்பவர்
  alternative: என் தேவைக்கான பணியாளர்
  rationale: இங்கு சொல் எப்பாப்பிரோதித்துவின் சேவையைச் சுட்டுகிறது; ஒரு நவீன திருச்சபைப் பதவியை உறுதிப்படுத்தவில்லை. வாக்கிய அமைப்பில் உள்ள உறவையும் நோக்கத்தையும் மொழிபெயர்ப்பு தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் எப்பாப்பிரோதித்துவை விவரிக்கும் இணையான உறவுச் சொற்களைத் தமிழிலும் தொடர்ச்சியாக அமைத்து, ‘உடன் போர்வீரர்’ என்ற உருவகம் காக்கப்பட்டுள்ளது. இடைச்செருகலான விளக்கத் தொடரை நீண்ட கோடுகளால் பிரித்து வாசிப்புத் தெளிவு வழங்கப்பட்டுள்ளது.
