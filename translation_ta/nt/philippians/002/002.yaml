source:
  edition: SBLGNT
  text: πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: ta
  text: நீங்கள் ஒரே விதமாகச் சிந்தித்து, ஒரே அன்பைக் கொண்டவர்களாய், ஒரே உள்ளம் உடையவர்களாய்[a], ஒன்றையே சிந்தித்து[b], என் மகிழ்ச்சியை நிறைவாக்குங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உள்ளத்தில் ஒன்றுபட்டவர்களாய்”; சொற்படி, “ஒரே ஆன்மா உடையவர்களாய்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரே நோக்கில் கவனம் செலுத்தி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ
  choice: நிறைவாக்குங்கள்
  rationale: முற்றுப்பெறச் செய்தல் அல்லது முழு அளவுக்குக் கொண்டுவருதல் என்ற உருவகத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; இறந்தகால வினையேவலின் வலியுறுத்தலையும் காக்கிறது.
- source_word: μου τὴν χαρὰν
  choice: என் மகிழ்ச்சியை
  rationale: நேரடியான உடைமைத் தொடர்பையும் பவுலின் தனிப்பட்ட மகிழ்ச்சியையும் தெளிவாகத் தருகிறது.
- source_word: ἵνα
  choice: தமிழ் வாக்கிய அமைப்பில் முன்வரும் செயற்பாட்டு தொடர்களாக
  rationale: இங்கு ἵνα கட்டளை நிறைவேறும் உள்ளடக்கம் அல்லது வழியை அறிமுகப்படுத்துகிறது. தமிழில் ‘நீங்கள் … செய்து … என் மகிழ்ச்சியை நிறைவாக்குங்கள்’ என்ற அமைப்பு அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: ஒரே விதமாகச் சிந்தித்து
  rationale: φρονέω வெறும் அறிவுசார் எண்ணத்தை மட்டுமல்லாமல் மனப்பாங்கையும் நோக்கையும் குறிக்கக்கூடும். இத்தேர்வு அந்த விரிவை முற்றிலும் குறுக்காமல், நவீன தமிழில் வாசிக்க எளிதாக உள்ளது.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: ஒரே அன்பைக் கொண்டவர்களாய்
  rationale: பங்கேற்புச் சொல்லின் அமைப்பைத் தக்கவைத்தபடி, பகிரப்பட்ட ஒரே அன்பை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: σύμψυχοι
  choice: ஒரே உள்ளம் உடையவர்களாய்
  rationale: ψυχή சார்ந்த ‘உள்ளம்/உயிர்’ உருவகத்தை இயல்பான தமிழில் காக்கிறது; பொதுவான ‘ஒற்றுமையாய்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் வலிமையை நன்றாகத் தருகிறது.
- source_word: τὸ ἓν φρονοῦντες
  choice: ஒன்றையே சிந்தித்து
  rationale: முன்னர் வந்த φρονέω வினையுடன் சொற்பிணைப்பைத் தக்கவைத்து, ஒன்றுபட்ட சிந்தனை அல்லது நோக்கம் என்ற கருத்தைத் திறந்த நிலையில் வைக்கிறது.
theological_decisions:
- issue: இருமுறை வரும் φρονέω மொழியை எவ்வாறு வெளிப்படுத்துவது
  choice: ‘ஒரே விதமாகச் சிந்தித்து … ஒன்றையே சிந்தித்து’ என்று ஒரே வேர்ச்சொல்லை மீண்டும் பயன்படுத்துதல்
  alternative: ‘ஒரே மனப்பாங்குடையவர்களாய் … ஒரே நோக்கில் ஈடுபட்டு’
  rationale: மூலத்தில் உள்ள திரும்பச்சொல்லலையும் அதன் ஒற்றுமை அழைப்பையும் காக்கிறது; இதை நிறுவனம் சார்ந்த முழுமையான ஒரேமாதிரித்தன்மை என்ற கோட்பாட்டுக் கூற்றாகக் குறுக்கவில்லை.
- issue: σύμψυχοι குறிக்கும் ஒற்றுமையின் தன்மை
  choice: ‘ஒரே உள்ளம் உடையவர்களாய்’
  alternative: ‘உள்ளத்தில் ஒன்றுபட்டவர்களாய்’ அல்லது ‘ஒரே ஆவியுடையவர்களாய்’
  rationale: இந்தச் சொல் பகிரப்பட்ட அக வாழ்வு, உணர்வு, நோக்கம் ஆகியவற்றைச் சுட்டலாம். ‘உள்ளம்’ என்பது தமிழில் இயல்பாகவும் உருவகத்துக்கு நெருக்கமாகவும் உள்ளது; ‘ஆவி’ என்று மொழிபெயர்த்து குறிப்பிட்ட இறையியல் பொருளைத் திணிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் கட்டளை, பங்கேற்புச் சொற்களின் தொடர், φρονέω என்ற சொல்லின் மீள்பயன்பாடு ஆகியவை இயன்றவரை காக்கப்பட்டுள்ளன.
