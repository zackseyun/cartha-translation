  source_fidelity: மூல கிரேக்கத்தின் கட்டளை ‘πληρώσατέ’ மற்றும் அதன் உள்ளடக்கத்தை விளக்கும் ἵνα-தொடர் தமிழில் கருத்துநிலையாகச் சரியாக வெளிப்படுத்தப்பட்டுள்ளன. τὸ αὐτὸ φρονῆτε மற்றும் τὸ ἓν φρονοῦντες ஆகிய இரு வேறுபட்டாலும் தொடர்புடைய சொற்றொடர்களுக்கிடையிலான மீளுரையும் வேறுபாடும் ‘ஒரே விதமாகச் சிந்தித்து’ / ‘ஒன்றையே சிந்தித்து’ என்பதில் காக்கப்படுகின்றன. σύμψυχοι-யின் உருவகமும் ‘ஒரே உள்ளம் உடையவர்களாய்’ என்பதில் பொருத்தமாகத் தரப்பட்டுள்ளது.
