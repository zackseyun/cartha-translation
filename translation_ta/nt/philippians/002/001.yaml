source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: ta
  text: ஆகவே, மேசியாவில் ஏதேனும் ஊக்கம் இருந்தால், அன்பிலிருந்து ஏதேனும் ஆறுதல் இருந்தால், ஆவியானவரின் கூட்டுறவு ஏதேனும் இருந்தால்[a], உள்ளார்ந்த பாசமும் இரக்கமும் ஏதேனும் இருந்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவியானவரில் பங்குபெறுதல்”; சாத்தியம் குறைந்த இன்னொரு பொருள், “ஆவியில் கூட்டுறவு.”
    reason: κοινωνία πνεύματος என்பதில் πνεύματος குறிக்கும் நபரும் அதன் வேற்றுமை உறவும் ஓரளவு தெளிவற்றவையாக உள்ளன.
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவையும் தொடர்ச்சியையும் தெளிவாகக் காட்டுகிறது.
- source_word: παράκλησις
  choice: ஊக்கமளித்தல்
  rationale: ஆறுதலோடு வலுப்படுத்தும் பொருளைத் தருகிறது; அடுத்துள்ள παραμύθιον என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவில்
  rationale: ἐν என்பதன் அடிப்படை உறவு/சூழல் பொருளைக் காத்து, Χριστός என்பதைப் பட்டப்பெயரான ‘மேசியா’ என்று வழங்குகிறது.
- source_word: παραμύθιον
  choice: ஆறுதல்
  rationale: தேற்றும், ஆறுதலளிக்கும் பேச்சு அல்லது அனுபவத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἀγάπης
  choice: அன்பிலிருந்து
  rationale: ஆறுதல் அன்பிலிருந்து வருவதாகப் புரிந்துகொள்ளப்படும் மூலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κοινωνία
  choice: ஐக்கியம்
  rationale: உறவு, பகிர்வு, பங்கேற்பு ஆகியவற்றை உள்ளடக்கும் சமூகப் பொருளை இச்சூழலில் சுருக்கமாகத் தருகிறது.
- source_word: πνεύματος
  choice: ஆவியானவரின்
  rationale: இங்கு தூய ஆவியானவரே பெரும்பாலும் குறிக்கப்படுகிறார் என்ற வாசிப்பைத் தருகிறது; வேற்றுமை உறவின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: σπλάγχνα
  choice: உள்ளார்ந்த பாசம்
  rationale: உடலின் உள்ளுறுப்புகள் என்ற நேர்ப்பொருளுக்குப் பதிலாக, இங்கு நோக்கப்பட்டுள்ள ஆழ்ந்த, கனிவான நேசத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἰκτιρμοί
  choice: இரக்கம்
  rationale: பிறரின் துயரைக் கண்டு மனம் உருகும் கருணையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: πνεύματος என்பது தூய ஆவியானவரைக் குறிக்கிறதா, κοινωνία என்பதுடன் அதன் வேற்றுமை உறவை எவ்வாறு புரிந்துகொள்வது
  choice: ஆவியானவரின் ஐக்கியம்
  alternative: ஆவியானவரில் பங்குபெறுதல்; அல்லது, சாத்தியம் குறைவாக, உள்ளத்தின் ஐக்கியம்
  rationale: பவுலின் பயன்பாட்டிலும் இங்குள்ள கிறிஸ்தவ ஆசீர்வாதங்களின் தொடரிலும் தூய ஆவியானவரைக் குறிக்கும் வாசிப்பே அதிகம் சாத்தியமானது. ஆயினும், கிரேக்க வேற்றுமை உருபு ஐக்கியத்தின் துல்லியமான உறவைத் தீர்மானிக்காததால் மாற்று வாசிப்புகள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. கிரேக்க வாக்கியத்தின் தொடர்ச்சியான நிபந்தனை அமைப்பையும் அடுத்த வசனத்தை நோக்கிச் செல்லும் முடிவுறாத ஓட்டத்தையும் இறுதிக் காற்புள்ளி மூலம் காக்கிறது.
