  source_fidelity: மொழிபெயர்ப்பு μηδὲν-ன் முழுமையான மறுப்புக் கட்டளையையும், κατὰ ἐριθείαν / κατὰ κενοδοξίαν என்பவற்றின் உந்துதல் அல்லது நோக்கப் பொருளையும், τῇ ταπεινοφροσύνῃ என்பதன் முறையையும், ἡγούμενοι ὑπερέχοντας ἑαυτῶν என்பதன் ஒப்பீட்டு மதிப்பீட்டையும் நன்றாகக் காக்கிறது. “சுயநல நோக்கம்” என்பது ἐριθεία-வின் போட்டி/தன்னல உயர்வுநாடல் நுணுக்கத்தைச் சற்றுப் பொதுமைப்படுத்தினாலும், பொருளுக்கு உண்மையானதும் ஏற்றுக்கொள்ளத்தக்கதுமான மொழியாகும்.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “எதையும் செய்யாதீர்கள்” மற்றும் “மனத்தாழ்மையுடன் ... கருதுங்கள்” இயல்பான அறிவுறுத்தல் நடையாக உள்ளன. “மற்றவர்களை” இச்சபைச் சூழலில் ἀλλήλους-ன் பரஸ்பரக் கருத்தை போதுமான வகையில் வெளிப்படுத்துகிறது.
