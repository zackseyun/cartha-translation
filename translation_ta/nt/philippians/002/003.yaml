source:
  edition: SBLGNT
  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: ta
  text: சுயநல நோக்கத்தினாலோ வீண் பெருமையினாலோ[a] எதையும் செய்யாதீர்கள். மாறாக, மனத்தாழ்மையுடன் மற்றவர்களை உங்களைவிட மேலானவர்களாகக்[b] கருதுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெற்றுப் புகழாசையினாலோ.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களைவிட முக்கியமானவர்களாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: எதையும் செய்யாதீர்கள்
  rationale: எதுவும் செய்யக்கூடாது என்ற அறிவுறுத்தலை இயல்பான நவீனத் தமிழில் எதிர்மறைக் கட்டளையாக வெளிப்படுத்துகிறது.
- source_word: κατ’ ἐριθείαν
  choice: சுயநல நோக்கத்தினால்
  rationale: ἐριθεία குறிக்கும் தன்நல, போட்டி அல்லது குழுசார்ந்த உயர்வுநாடும் உள்நோக்கைத் தெளிவாக எடுத்துரைக்கிறது; κατά இங்கு காரணம் அல்லது உந்துதலைக் குறிக்கிறது.
- source_word: κατὰ κενοδοξίαν
  choice: வீண் பெருமையினால்
  rationale: κενοδοξία என்பதிலுள்ள வெறுமையான அல்லது ஆதாரமற்ற சுயமகிமையின் கருத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: மனத்தாழ்மையுடன்
  rationale: தாழ்மையான மனப்பாங்கைக் குறிக்கும் சொல்லின் முறையைக் குறிக்கும் தத்தியைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἀλλήλους
  choice: மற்றவர்களை
  rationale: சூழலில் சபை உறவுகளுக்குள் பரஸ்பரம் ஒருவரை ஒருவர் நோக்கும் கருத்தைச் சீரான தமிழில் தெரிவிக்கிறது.
- source_word: ἡγούμενοι
  choice: கருதுங்கள்
  rationale: ἡγέομαι என்பதன் சிந்தித்து மதிப்பிடுதல் அல்லது எண்ணுதல் என்ற அறிவுசார் பொருளைத் தக்கவைக்கிறது.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: உங்களைவிட மேலானவர்களாக
  rationale: ὑπερέχω என்பதன் ஒப்பீட்டு உயர்வு அல்லது மேன்மை என்ற கருத்தைக் காக்கிறது; பிறர் இயல்பிலேயே உயர்ந்தவர்கள் என்று தீர்மானிப்பதைவிட அவர்களை எவ்வாறு மதிக்க வேண்டும் என்பதில் கவனம் நிலைக்கிறது.
theological_decisions:
- issue: ὑπερέχοντας என்பதன் ஒப்பீட்டு வலிமை
  choice: உங்களைவிட மேலானவர்களாக
  alternative: உங்களைவிட முக்கியமானவர்களாக
  rationale: மூலச்சொல் ‘மேலாக இருத்தல்/மிஞ்சுதல்’ என்ற நேரடியான ஒப்பீட்டை அனுமதிக்கிறது. ‘மேலானவர்கள்’ அந்த வலிமையைப் பாதுகாக்கிறது; இதை மனித மதிப்பு அல்லது இருப்பியல் மேன்மை பற்றிய கோட்பாடாக விளக்காமல், ‘கருதுங்கள்’ என்ற மதிப்பீட்டு வினையோடு இணைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனத்தாழ்மை’ வேதாகமச் சூழலுக்கு ஏற்றதாய் இருந்தாலும் இன்றைய தமிழிலும் தெளிவாக உள்ளது; ‘மேலானவர்கள்’ என்ற மொழிபெயர்ப்பின் சாத்தியமான தவறான முழுமைப்படுத்தலை அடிக்குறிப்பு மாற்று வாசகம் சமநிலைப்படுத்துகிறது.
