source:
  edition: SBLGNT
  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: ta
  text: ஏனெனில், உங்களுக்குள் நீங்கள் விரும்பவும் செயல்படவும்[a] தமது நல்விருப்பத்திற்காக[b] செயலாற்றுபவர் கடவுள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விரும்புவதையும் செயல்படுவதையும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தமது நல்விருப்பத்தின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் விளக்க வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ ἐνεργῶν
  choice: செயலாற்றுகிறவர்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் நிகழ்கால வினையெச்சத்தின் தொடர்ச்சியான செயற்பாட்டைக் காக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களுக்குள்
  rationale: தனிநபர்களுக்குள் என்றும் விசுவாசிகளின் சமூகத்துக்குள் என்றும் புரிந்துகொள்ளக்கூடிய கிரேக்கத் தொடரின் பரப்பைத் திறந்தே வைக்கிறது.
- source_word: τὸ θέλειν
  choice: நீங்கள் விரும்பவும்
  rationale: நோக்கமுள்ள உள்ளார்ந்த விருப்பத்தை இயல்பான தமிழில் வெளிப்படுத்தி, அடுத்த வினையுடன் இணையான அமைப்பைக் காக்கிறது.
- source_word: τὸ ἐνεργεῖν
  choice: செயல்படவும்
  rationale: விருப்பத்தைத் தொடர்ந்து வரும் செயலைத் தெளிவாகக் காட்டுகிறது; ἐνεργῶν என்பதுடனான சொற்பொருள் தொடர்பையும் முடிந்தவரை காக்கிறது.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: தமது நல்விருப்பத்திற்காக
  rationale: ὑπέρ உடன் வரும் நோக்கம் அல்லது நன்மை சார்ந்த பொருளை ‘-க்காக’ மூலம் காக்கிறது. ‘தமது’ என்பது கடவுளைக் குறிக்கும் சூழலால் புரிந்துகொள்ளப்படும் உடைமையைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: இறைச் செயற்பாடும் மனித விருப்பமும் செயலும்
  choice: கடவுள் உங்களுக்குள் செயலாற்றுவதால் நீங்கள் விரும்பவும் செயல்படவும் செய்கிறீர்கள் என்ற இரட்டை வெளிப்பாட்டை மாற்றாமல் வைத்தல்
  alternative: விருப்பத்தையும் அதைச் செய்வதற்கான திறனையும் கடவுள் தருகிறார்
  rationale: மூலவாக்கியம் மனிதரின் விருப்பத்தையும் செயலையும் கடவுளின் செயற்பாட்டுடன் இணைக்கிறது. எந்த ஒரு கோட்பாட்டு முறையையும் திணிக்காமல் அந்த இறையியல் இறுக்கத்தை மொழிபெயர்ப்பு காக்கிறது.
- issue: ὑπέρ என்பதன் தொடர்பு
  choice: தமது நல்விருப்பத்திற்காக
  alternative: தமது நல்விருப்பத்தின்படி
  rationale: நோக்கம் அல்லது நலன் சார்ந்த முதன்மைப் பொருளை பிரதான உரையில் வைத்துக்கொண்டு, அளவுகோல் அல்லது ஒத்திசைவு சார்ந்த வாசிப்பை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுளே’ என்ற வலியுறுத்தல் கிரேக்க வாக்கியத்தில் கடவுள் செயற்படுகிறவர் என்பதற்குக் கொடுக்கப்படும் முன்னிலையை வெளிப்படுத்துகிறது; ‘உங்களுக்குள்’ என்பது தனிநபர் மற்றும் சமூக வாசிப்புகள் இரண்டையும் திறந்தே வைக்கிறது.
