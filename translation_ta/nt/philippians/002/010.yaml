translation:
  language: ta
  text: இயேசுவின் பெயருக்கு முன்பாக, பரலோகத்திலும் பூமியிலும் பூமிக்குக் கீழேயும் உள்ள ஒவ்வொருவரின் முழங்காலும் மடங்கும்படியாகவும்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசுவின் பெயரில் எல்லா முழங்கால்களும் மடங்கும்படியாகவும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: அதனால் ... வேண்டும்
  rationale: முந்தைய கூற்றிலிருந்து வரும் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் குறிக்கிறது; ἵνα என்பதன் நோக்கநிலையையும் காக்கிறது.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: இயேசுவின் பெயருக்கு முன்
  rationale: வணங்கி மண்டியிடும் சூழலில், இயேசுவின் பெயரும் அதனுடன் இணைந்துள்ள மேன்மையும் மரியாதையையும் எதிர்கொண்டு நிகழும் செயலை இயல்பாகத் தெரிவிக்கிறது; ‘இயேசுவின் பெயரில்’ என்ற பொருளும் இலக்கண ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πᾶν γόνυ
  choice: அனைவருடைய முழங்காலும்
  rationale: உலகளாவிய பணிவைக் காட்டும் முழங்கால் என்ற தெளிவான உடல் உருவகத்தைக் காக்கிறது; substantival genitives குறிக்கும் உயிர்களையும் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: κάμψῃ
  choice: மடங்க வேண்டும்
  rationale: ἵνα உடன் வரும் aorist subjunctive-இன் நோக்கம்/விளைவு சார்ந்த நுணுக்கத்தைத் தமிழில் தெரிவித்து, முழங்கால் மடக்கும் பணிவுச் செயலை நேரடியாகக் கூறுகிறது.
- source_word: ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: பரலோகத்தில் உள்ளவர்கள், பூமியில் உள்ளவர்கள், பூமிக்குக் கீழே உள்ளவர்கள்
  rationale: மூன்று substantival genitive பெயரடைகளையும் நபர்/உயிர் குழுக்களாக நேரடியாகப் பிரதிபலிக்கிறது; அவர்கள் யார் என்பதை தேவதூதர்கள், மனிதர்கள், இறந்தோர் அல்லது பேய்கள் என்று அளவுக்கு மீறி வரையறுக்கவில்லை.
theological_decisions:
- issue: ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων என்ற மும்மடங்கு சொற்றொடரின் வரம்பும் அடையாளமும்
  choice: பரலோகம், பூமி, பூமிக்குக் கீழ் ஆகிய அனைத்துத் தளங்களிலும் உள்ளவர்களை உள்ளடக்கும் பிரபஞ்சளாவிய பரப்பைத் தக்கவைத்தல்
  alternative: தேவதூதர்கள், மனிதர்கள், இறந்தவர்கள் அல்லது பேய்கள் என்று குழுக்களை வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: மூலவசனம் இயேசுவுக்குச் செலுத்தப்படும் உலகளாவிய பணிவை வலியுறுத்துகிறது; ஒவ்வொரு குழுவின் அடையாளத்தையும் அது கூறுவதைக் காட்டிலும் குறிப்பாக மொழிபெயர்ப்பது தேவையற்ற விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான நடை. ‘முழங்கால் மடங்க வேண்டும்’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது. கிரேக்க substantival genitive வடிவங்கள் வெறும் இடங்களாக அல்லாமல் ‘உள்ளவர்கள்’ என்று வெளிப்படுத்தப்பட்டுள்ளன; ஆனால் அந்த உயிர்களின் அடையாளம் விளக்கமாக நிர்ணயிக்கப்படவில்லை.
