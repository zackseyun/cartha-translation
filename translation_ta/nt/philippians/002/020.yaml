  text: For I have no one like him who will genuinely care about your welfare[b][a],
translation:
  language: ta
  text: ஏனெனில், உங்கள் நலனில்[b] உண்மையாக அக்கறை கொள்ளும், என்னோடு ஒத்த உள்ளம் கொண்டவர்[a] வேறு யாரும் என்னிடம் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒத்த உள்ளம் கொண்டவர்”; இன்னும் சொல்லுக்குச் சொல், “சமமான உள்ளம் கொண்டவர்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களைப் பற்றிய காரியங்களில் உண்மையாக அக்கறை கொள்ளும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் தீமோத்தேயுவை அனுப்ப விரும்புவதாகக் கூறியதற்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் பொருளைத் தக்கவைக்கிறது.
- source_word: οὐδένα ... ἔχω
  choice: வேறு யாரும் என்னிடம் இல்லை
  rationale: தமிழில் இயல்பாகவும் தெளிவாகவும் பவுலிடம் அத்தகைய மற்றொருவர் இல்லை என்ற கருத்தை வெளிப்படுத்துகிறது; சூழலில் உள்ள ஒப்பீட்டை ‘வேறு’ தெளிவாக்குகிறது.
- source_word: ἰσόψυχον
  choice: இவரைப் போன்ற உள்ளம் கொண்டவர்
  rationale: ஒரே உள்ளப்பாங்கும் அக்கறையும் கொண்டவரைக் குறிக்கும் அரிய கூட்டு அடைமொழியை இயல்பான தமிழில் தெரிவிக்கிறது. ‘இவர்’ என்பது சூழலில் கூறப்படும் தீமோத்தேயுவைக் குறிக்கிறது; சொல்லின் நேரடியான உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὅστις
  choice: அக்கறைகொள்ளும்
  rationale: கிரேக்க உறவுப்பெயர் அமைப்பைத் தமிழின் இயல்பான பெயரெச்சத் தொடரால் இணைக்கிறது.
- source_word: γνησίως
  choice: உண்மையாக
  rationale: போலியல்லாத, நேர்மையான அக்கறை என்ற பொருளை எளிய நவீன தமிழில் தருகிறது.
- source_word: τὰ περὶ ὑμῶν
  choice: உங்கள் நலனில்
  rationale: பிலிப்பியர்களைப் பற்றிய காரியங்கள், நிலைமை, நலன் ஆகியவற்றை உள்ளடக்கும் சொற்றொடரைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது; மேலும் நேரடியான வடிவம் அடிக்குறிப்பில் உள்ளது.
- source_word: μεριμνήσει
  choice: அக்கறைகொள்ளும்
  rationale: இங்கு கவலை அல்லது பதற்றம் அல்ல, நேர்மறையான மேய்ப்புப்பணி சார்ந்த கரிசனையே குறிக்கிறது. கிரேக்கத்தின் எதிர்கால நோக்கம் தமிழில் சூழலால் இயல்பாக உணரப்படும் பெயரெச்ச வடிவில் வழங்கப்படுகிறது.
