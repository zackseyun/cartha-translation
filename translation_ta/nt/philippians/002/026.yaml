  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: ta
  text: ஏனெனில், அவர் உங்கள் அனைவருக்காகவும் ஏங்கிக்கொண்டிருந்தார்; மேலும், அவர் நோயுற்றதை நீங்கள் கேள்விப்பட்டதால் மிகுந்த மனக்கலக்கத்தில் இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் அவர் நோயுற்றதை கேள்விப்பட்டதாக அவர் கேள்விப்பட்டதால்.”
    reason: அவருடைய மனக்கலக்கத்திற்கான உடனடி காரணம், பிலிப்பியர்கள் அவர் நோயுற்ற செய்தியைக் கேட்டது மட்டுமா, அல்லது அவர்கள் அதைக் கேட்டதாக எப்பாப்பிரோதீத்து கேள்விப்பட்டாரா என்பதைக் காட்டும் மாற்று இலக்கணப் புரிதல்.
lexical_decisions:
- source_word: ἐπειδὴ
  choice: ஏனெனில்
  rationale: எப்பாப்பிரோதீத்துவைத் திருப்பி அனுப்புவதற்கான காரணத்தை அறிமுகப்படுத்தும் சொல்லாக, கிரேக்கத்தின் காரணப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπιποθῶν ἦν
  choice: காண ஏங்கிக்கொண்டிருந்தார்
  rationale: நிகழ்காலப் பெயரெச்சமும் இறந்தகால εἰμί வினையும் சேர்ந்த அமைப்பு, கடந்த காலத்தில் தொடர்ந்த ஏக்கத்தைக் காட்டுகிறது. தமிழில் இயல்பாக இருக்க ‘காண’ சூழலுக்கேற்றவாறு வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: πάντας ὑμᾶς
  choice: உங்கள் அனைவரையும்
  rationale: πάντας என்பதன் ‘அனைவரும்’ என்ற வலியுறுத்தலைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀδημονῶν
  choice: மிகுந்த மனக்கலக்கத்தில் இருந்தார்
  rationale: இச்சொல் சாதாரணக் கவலையைவிட ஆழமான மனவேதனையையும் கலக்கத்தையும் குறிக்கிறது; அதனை மிகைப்படுத்தாமல் வலிமையாகத் தெரிவிக்கிறது.
- source_word: διότι
  choice: என்பதால்
  rationale: அவருடைய மனக்கலக்கத்திற்கான காரணத்தை இயல்பான தமிழில் இணைக்கிறது.
- source_word: ἠκούσατε
  choice: நீங்கள் கேள்விப்பட்டதால்
  rationale: இரண்டாம் நபர் பன்மை இறந்தகால வினையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὅτι ἠσθένησεν
  choice: அவர் நோயுற்றதை
  rationale: ἀσθενέω இச்சூழலில் உடல்நோயைக் குறிக்கிறது; இறந்தகால நிகழ்வைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
