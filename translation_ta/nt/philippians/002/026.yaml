- from: ஏனெனில், அவர் உங்கள் அனைவரையும் காண ஏங்கிக்கொண்டிருந்தார்; மேலும், அவர் நோயுற்றதை நீங்கள் கேள்விப்பட்டதால் மிகுந்த மனக்கலக்கத்தில் இருந்தார்.[a]
  to: ஏனெனில், அவர் உங்கள் அனைவருக்காகவும் ஏங்கிக்கொண்டிருந்தார்; மேலும், அவர் நோயுற்றதை நீங்கள் கேள்விப்பட்டதால் மிகுந்த மனக்கலக்கத்தில் இருந்தார்.[a]
  rationale: ‘காண’ என்ற மூலத்தில் இல்லாத குறிப்பை நீக்கி, ἐπιποθῶν ἦν என்பதன் தொடர்ச்சியான ஏக்கத்தை ‘உங்கள் அனைவருக்காகவும் ஏங்கிக்கொண்டிருந்தார்’ எனத் துல்லியமாகவும் இயல்பாகவும் வழங்கியுள்ளோம். மற்ற சொற்களும் காரணத் தொடர்பும் மூலத்திற்கும் ஆங்கில ஆய்வுக்குறிப்பிற்கும் ஏற்ப பாதுகாக்கப்பட்டுள்ளன.
