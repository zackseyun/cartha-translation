id: PHP.2.16
reference: Philippians 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: ta
  text: வாழ்வின் வார்த்தையை உறுதியாகப் பற்றிக்கொள்ளுங்கள்[a]; அப்பொழுது, மேசியாவின் நாளில்[b], நான் வீணாக ஓடவோ வீணாக உழைக்கவோ இல்லை என்று பெருமைகொள்ளும் வகையில் இருப்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாழ்வின் வார்த்தையை முன்வையுங்கள்” அல்லது “வாழ்வின் வார்த்தையை நீட்டிக் கொடுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: 'மரபான மொழிபெயர்ப்பு: “கிறிஸ்துவின் நாளில்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: வாழ்வின் வார்த்தை
  rationale: λόγος என்பதற்கு ‘வார்த்தை’ அல்லது ‘செய்தி’ எனப் பொருள் கொள்ளலாம். ‘வாழ்வின் வார்த்தை’ என்ற சுருக்கமான தொடர், வாழ்வை அளிக்கும் வார்த்தை மற்றும் வாழ்வைப் பற்றிய வார்த்தை ஆகிய இரு நுட்பங்களையும் திறந்தவையாக வைத்திருக்கிறது.
- source_word: ἐπέχοντες
  choice: உறுதியாகப் பற்றிக்கொள்ளுங்கள்
  rationale: ἐπέχω என்பதற்கு உறுதியாகப் பற்றிக்கொள்வது அல்லது பிறரிடம் நீட்டிக் கொடுப்பது என்ற இரு சாத்தியங்களும் உள்ளன. முந்தைய அறிவுறுத்தல்களின் ஓட்டத்தில் நிலைத்திருத்தல் முதன்மையாகத் தெரிகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: καύχημα ἐμοί
  choice: உங்களைக் குறித்து நான் பெருமைகொள்ள முடியும்
  rationale: καύχημα என்பது பெருமைகொள்வதற்கான காரணத்தையோ அடிப்படையையோ குறிக்கிறது. தமிழில் இயல்பாக இருக்கவும், பிலிப்பியர்கள் பவுலின் பெருமைக்கான காரணமாக இருப்பதையும் தெளிவாக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἡμέραν Χριστοῦ
  choice: மேசியாவின் நாளில்
  rationale: இங்கு Χριστός பட்டப்பெயருக்குரிய இறுதிக்கால அர்த்தத்தைத் தக்கவைத்துள்ளதால் ‘மேசியா’ என வழங்கப்படுகிறது.
- source_word: οὐκ εἰς κενὸν
  choice: வீணாக ... இல்லை
  rationale: பலனற்ற அல்லது பயனற்ற முயற்சியைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் இணை; இருமுறை வரும் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἔδραμον
  choice: ஓடினேன்
  rationale: பவுலின் ஊழிய முயற்சியை உருவகமாகச் சுட்டும் ஓட்டப் படிமம் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐκοπίασα
  choice: உழைத்தேன்
  rationale: கடுமையான முயற்சியை உணர்த்தும் κοπιάω என்பதற்கு எளிய, வலுவான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: இறுதிக்காலப் பட்டப்பெயர் தொடரில் Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: ἡμέραν Χριστοῦ என்ற தொடரில் அரசரான அபிஷேகம் பெற்றவரின் பட்டப்பெயர்த் தன்மை செயல்படுகிறது; ஆகவே ‘மேசியா’ முதன்மை உரையில் வைக்கப்பட்டு, மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கப் பங்கேற்பெச்சத்தின் அறிவுறுத்தல் வலிமை தமிழில் இயல்பாக வெளிப்பட ‘பற்றிக்கொள்ளுங்கள்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நோக்க/விளைவு உறவு ‘அப்போது’ மற்றும் ‘என்பதால்’ மூலம் தெளிவாக்கப்பட்டுள்ளது; ἐπέχοντες என்பதிலுள்ள உண்மையான சொற்பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
