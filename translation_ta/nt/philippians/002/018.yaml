  text: In the same way[a], you also rejoice and rejoice with me.
translation:
  language: ta
  text: அவ்வாறே[a] நீங்களும் மகிழுங்கள்; என்னோடு சேர்ந்து மகிழுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதேபோல் நீங்களும் மகிழ்ந்து, உங்கள் மகிழ்ச்சியை என்னோடு பகிர்ந்துகொள்ளுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: அவ்வாறே
  rationale: τὸ αὐτό இங்கு வினையடைத் தொடராக இருந்து, முந்தைய வசனத்தில் பவுல் கூறிய மகிழ்ச்சியைப் பின்னோக்கிச் சுட்டுகிறது. δέ தரும் தொடர்ச்சி/மென்மையான மாறுபாடு தமிழில் தனியாக வற்புறுத்தப்படாமல் இயல்பாகத் தொடரில் வெளிப்படுகிறது.
- source_word: χαίρετε
  choice: மகிழுங்கள்
  rationale: இது நிகழ்காலச் செயப்பாட்டு ஏவல்வினை, இரண்டாம் நபர் பன்மை. பிலிப்பியரில் மீண்டும் மீண்டும் வரும் மகிழ்ச்சி மொழியை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: συγχαίρετέ
  choice: சேர்ந்து மகிழுங்கள்
  rationale: συν- முன்னொட்டு பகிர்ந்துகொள்ளப்படும் மகிழ்ச்சியை உணர்த்துகிறது; ‘சேர்ந்து மகிழுங்கள்’ என்பது அந்தக் கூட்டு மகிழ்ச்சியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μοι
  choice: என்னோடு
  rationale: இடப்பொருள் வேற்றுமையில் உள்ள μοι, பவுலோடு சேர்ந்து மகிழ்வதைக் குறிக்கிறது; ‘என்னோடு’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
