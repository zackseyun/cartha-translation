source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: ta
  text: மேலும், ஒவ்வொரு நாவும் மேசியாவாகிய இயேசுவே ஆண்டவர்[a] என்று அறிக்கையிட வேண்டும், தந்தையாகிய கடவுளின் மகிமைக்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “இயேசு கிறிஸ்துவே ஆண்டவர்.”'
    reason: Χριστός என்பதற்கான மரபுவழி ஒலிபெயர்ப்பை வழங்குகிறது.
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: ஒவ்வொரு நாவும்
  rationale: உலகளாவிய அறிக்கையைச் சுட்டும் உடல் உறுப்புச் சொல்லுருவைத் தக்கவைத்தபடியே, தமிழில் புரியக்கூடிய இயல்பான வடிவமாக உள்ளது.
- source_word: ἐξομολογήσηται
  choice: அறிக்கையிட வேண்டும்
  rationale: வெளிப்படையாக ஒப்புக்கூறுதல் அல்லது அறிவித்தல் என்ற வினையின் பொருளையும், முந்தைய வசனத்துடன் இணைந்த நோக்கவாக்கியத்தில் வரும் துணைவினை மனநிலையையும் வெளிப்படுத்துகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் மரியாதை, அதிகாரம், வேதாகமப் பின்னொலி ஆகியவற்றை இயல்பாகத் தக்கவைக்கும் வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: Ἰησοῦς Χριστός
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός இங்கு பெயரின் ஒரு பகுதியாக மட்டும் அல்லாமல் பட்டமாகவும் செயல்படுவதால், அதன் பொருளை மொழிபெயர்த்து இயல்பான தமிழ் தொடராக வழங்குகிறது.
- source_word: εἰς δόξαν
  choice: மகிமைக்காக
  rationale: εἰς என்பதன் நோக்கம் அல்லது விளைவைச் சுட்டும் வலிமையை இவ்வழிபாட்டுச் சூழலில் தெளிவாகக் காட்டுகிறது.
- source_word: θεοῦ πατρός
  choice: தந்தையாகிய கடவுள்
  rationale: கிரேக்கச் சொற்றொடரின் உறவைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: கிறிஸ்தியல் அறிக்கையில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய இயேசு
  alternative: இயேசு கிறிஸ்து
  rationale: பட்டத்தின் பொருள் செயலில் இருப்பதை வெளிப்படுத்த ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது; தமிழில் பரவலாக அறியப்பட்ட மரபுவழி ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘ஆண்டவர்’ என்ற பயனிலையின் வலியுறுத்தல்
  choice: மேசியாவாகிய இயேசுவே ஆண்டவர்
  alternative: மேசியாவாகிய இயேசு ஆண்டவர்
  rationale: தமிழின் ‘-வே’ வலியுறுத்தல், இயேசுவே ஆண்டவர் என்ற அறிக்கையின் பயனிலைச் செறிவை இயல்பாக வெளிப்படுத்துகிறது; கிரேக்கத்தில் இல்லாத மேலதிக கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தனித்து வாசிக்கும்போது வாக்கியம் தெளிவாக இருக்க ‘அறிக்கையிட வேண்டும்’ என்றும், இறுதித் தொடரின் தொடர்பை வெளிப்படுத்த ‘இது … மகிமைக்காகும்’ என்றும் அமைக்கப்பட்டுள்ளது.
