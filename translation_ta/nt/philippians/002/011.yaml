  source_fidelity: 'முதன்மை அறிக்கையின் பொருள் கிரேக்க மூலத்துடன் பெரும்பாலும் ஒத்துள்ளது: πᾶσα γλῶσσα என்பதன் உருவகமும், ἐξομολογήσηται என்பதன் அறிக்கையிடுதல்/ஒப்புக்கூறுதல் வலிமையும், ‘ஆண்டவர்’ என்பதும் தக்கவைக்கப்பட்டுள்ளன. ஆனால் ‘இது ... மகிமைக்காகும்’ என்பது மூலத்தில் இல்லாத சுட்டுப்பெயரையும் தனி வினையையும் சேர்த்து, εἰς δόξαν என்பதை நோக்க/விளைவு தொடராக அல்லாமல் சுயாதீனக் கூற்றாக மாற்றுகிறது.'
  naturalness: ‘மேசியாவாகிய இயேசுவே ஆண்டவர்’ இயல்பாகவும் கண்ணியமான நவீனத் தமிழாகவும் உள்ளது. இறுதியில் ‘தந்தையாகிய கடவுளின் மகிமைக்காக’ என நேரடியாக இணைப்பது அதிகச் சுருக்கமாகவும் மூல வாக்கிய அமைப்புக்கு நெருக்கமாகவும் இருக்கும்.
