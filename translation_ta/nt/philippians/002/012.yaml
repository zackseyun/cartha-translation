  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: ta
  text: ஆகவே, என் அன்புக்குரியவர்களே, நீங்கள் எப்போதும் கீழ்ப்படிந்து வந்ததுபோல—நான் உங்களுடன் இருக்கும்போது மட்டுமல்ல, இப்போது நான் உங்களுடன் இல்லாதபோது இன்னும் அதிகமாக—பயத்தோடும் நடுக்கத்தோடும்[b] உங்கள் சொந்த இரட்சிப்பை வாழ்வில் செயல்படுத்துங்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வாழ்வில் செயல்படுத்துங்கள்” என்பது இரட்சிப்பைச் சம்பாதியுங்கள் என்று பொருளல்ல; அதை வாழ்க்கையில் நடைமுறைப்படுத்தி, அதன் விளைவுகளை நடத்தையில் வெளிப்படுத்துங்கள் என்பதாகும்.
    reason: alternative_reading
  - marker: b
    text: “பயத்தோடும் நடுக்கத்தோடும்” என்பது கடவுள்முன் ஆழ்ந்த பயபக்தியுடனும் தீவிரமான பணிவுடனும் இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
