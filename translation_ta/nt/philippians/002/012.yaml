- source_word: κατεργάζεσθε
  choice: வாழ்வில் செயல்படுத்துங்கள்
  rationale: இரட்சிப்பைச் சம்பாதியுங்கள் என்று கூறாமல், அதை நடைமுறையில் முழுமையாக வெளிப்படுத்தி நடத்திச் செல்லுங்கள் என்ற வினையின் செயற்பாட்டு வலிமையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: “உங்கள் சொந்த இரட்சிப்பை வாழ்வில் செயல்படுத்துங்கள்” என்பதன் பொருள்
  choice: இரட்சிப்பை வாழ்க்கையில் நடைமுறைப்படுத்தி, அதன் விளைவுகளை நடத்தையில் வெளிப்படுத்த வேண்டும் என்ற அறிவுறுத்தல்
  alternative: மனித முயற்சியால் இரட்சிப்பைச் சம்பாதிக்க வேண்டும் என்ற கட்டளை
  rationale: κατεργάζεσθε என்பது ஒன்றைச் செயல்படுத்துவது அல்லது அதன் விளைவை நிறைவேற்றுவது என்ற வலிமையைக் கொண்டது; அடுத்த வசனம் கடவுள் அவர்களுக்குள் செயல்படுவதைச் சொல்கிறது. எனினும் கட்டளையின் உண்மையான பொறுப்பையும் இறையியல் அழுத்தத்தையும் மொழிபெயர்ப்பு நீக்கவில்லை.
- issue: “பயத்தோடும் நடுக்கத்தோடும்” என்பதன் வலிமை
  choice: கடவுள்முன் ஆழ்ந்த பயபக்தி, தீவிரம், பணிவு ஆகியவற்றைக் கொண்ட நிலை
  alternative: வெறும் பீதியால் நடுங்குதல் அல்லது உணர்ச்சி வலிமையற்ற சாதாரண மரியாதை
  rationale: மூலச் சொற்றொடரின் பயம் மற்றும் தீவிரத்தை நேரடியாகக் காக்கிறது; அடிக்குறிப்பு அதன் சூழல்சார் நுணுக்கத்தை மட்டும் விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தின் ஒழுங்கு கோடுகளால் தெளிவாக்கப்பட்டுள்ளது. “இரட்சிப்பு,” “பயம்,” “நடுக்கம்” போன்ற இறையியல் நிறைமிக்க சொற்கள் தணிக்கப்படாமல் காக்கப்பட்டுள்ளன; “வாழ்வில் செயல்படுத்துங்கள்” என்பது தமிழில் ஏற்படக்கூடிய ‘சம்பாதித்தல்’ என்ற தவறான உடனுணர்வைக் குறைத்தபடியே கட்டளையின் வலிமையைப் பேணுகிறது.
