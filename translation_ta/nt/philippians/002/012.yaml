- source_word: μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου
  choice: நான் உங்களுடன் இருக்கும்போது மட்டுமல்ல, இப்போது நான் உங்களுடன் இல்லாதபோது இன்னும் அதிகமாக
