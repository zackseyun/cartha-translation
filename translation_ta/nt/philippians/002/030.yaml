id: PHP.2.30
reference: Philippians 2:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: ta
  text: ஏனெனில், மெசியாவின்[a] பணியின் காரணமாக[c] அவர் மரணத்தை நெருங்கினார்; எனக்குச் செய்த உங்கள் சேவையில் இருந்த குறைவை[b] நிறைவு செய்வதற்காகத் தன் உயிரைப் பணயம் வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ‘கிறிஸ்துவின்.’ கிரேக்கச் சொற்றொடர்: ‘கிறிஸ்துவின்/மெசியாவின் பணி.’'
    reason: alternative_reading
  - marker: b
    text: ‘குறைவு’ என்பது பிலிப்பியர்கள் தொலைவில் இருந்ததால் நேரில் செய்ய இயலாத சேவையைக் குறிக்கிறது; அவர்கள் மனமில்லாமல் இருந்ததாகக் குற்றஞ்சாட்டவில்லை.
    reason: cultural_note
  - marker: c
    text: இதனை ‘மெசியாவின் பணிக்காக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: மெசியாவின் பணியின் நிமித்தம்
  rationale: διά + வேற்றுமை உருபுடைய பெயர்த்தொடர் இங்கு காரணம் அல்லது நோக்கத்திற்காகச் செய்யப்படும் செயலைக் குறிக்கிறது. ‘பணியின் நிமித்தம்’ என்பது அந்தத் தொடர்பைப் பொருள் மாறாமல் இயல்பான தமிழில் தருகிறது.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டத்தின் பொருளைத் தாங்குவதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டது; பரவலாக அறியப்பட்ட ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: μέχρι θανάτου ἤγγισεν
  choice: மரணத்தை நெருங்கினார்
  rationale: அவர் மரணத்தின் விளிம்புவரை வந்ததை கிரேக்கச் சொற்றொடருக்கு நெருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: தன் உயிரைப் பணயம் வைத்தார்
  rationale: இங்கு ψυχή என்பது இவ்வுலக உயிரைக் குறிக்கிறது; வினையெச்சம் ஆபத்தைத் தெரிந்தே எதிர்கொண்டதைச் சொல்கிறது. ‘உயிரைப் பணயம் வைத்தார்’ என்பது அதன் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἵνα ἀναπληρώσῃ
  choice: நிறைவு செய்வதற்காக
  rationale: ἵνα நோக்கத்தைக் குறிக்கிறது; ἀναπληρόω இல்லாதிருந்த அல்லது குறைவாயிருந்த பகுதியை நிரப்புவதைக் குறிக்கிறது.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: உங்கள் பணியில் குறைவாயிருந்ததை
  rationale: ὑστέρημα நடைமுறையில் நிறைவேறாமல் இருந்த பகுதியைக் குறிக்கிறது; மனமின்மையையோ ஒழுக்கக் குற்றத்தையோ அவசியமாகக் குறிக்காது.
- source_word: τῆς πρός με λειτουργίας
  choice: எனக்கான உங்கள் பணி
  rationale: λειτουργία இச்சூழலில் பவுலுக்குச் செய்யப்பட்ட நடைமுறை உதவி அல்லது சேவையைக் குறிக்கிறது. ‘பணி’ என்பது சமயச் சடங்கு என்ற தேவையற்ற குறுகிய பொருளைத் தவிர்த்து விரிவைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பவுலின் சொற்றொடரில் Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: Χριστός என்பதன் பட்டப்பொருளை வெளிப்படையாகக் காக்க ‘மெசியா’ பயன்படுத்தப்பட்டது. தமிழ் கிறிஸ்தவ வழக்கில் நிலைபெற்ற ‘கிறிஸ்து’ மாற்று வடிவாக அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- issue: ‘உங்கள் குறைவு’ என்பதில் குற்றஞ்சாட்டும் பொருள் உள்ளதா?
  choice: நிறைவேறாமல் இருந்த நடைமுறைப் பகுதியை மட்டும் குறிக்கும் திறந்த மொழிபெயர்ப்பு
  alternative: பிலிப்பியர்களின் சேவைக் குறைபாடு அல்லது மனமின்மை
  rationale: சூழலில் எப்பாப்பிரோதீத்து அவர்கள் நேரில் செய்ய இயலாத சேவையை நிறைவு செய்தார். எனினும் மூலத்தின் ‘குறைவு’ என்ற சொல்லை உரையில் நீக்காமல் வைத்து, தவறான குற்றஞ்சாட்டும் வாசிப்பை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிரைப் பணயம் வைத்தார்’ என்பது வலிமையானதாயினும் இன்றைய தமிழில் இயல்பான சொற்றொடர். மூலத்தின் காரணம்/நோக்கம் சார்ந்த நுண்ணிய திறந்த தன்மையும் ‘குறைவு’ என்ற பதத்தின் இறையியல் மற்றும் உறவுசார் பதற்றமும் உரை மற்றும் அடிக்குறிப்புகள் வழியாகக் காக்கப்பட்டுள்ளன.
