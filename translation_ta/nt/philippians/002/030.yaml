  source_fidelity: 'மூலத்தின் முக்கிய கருத்துகள் அனைத்தும் காக்கப்பட்டுள்ளன: மெசியாவின் பணியோடு தொடர்புடைய காரணத்தால் எப்பாப்பிரோதீத்து மரணத்திற்கு அருகில் வந்தார்; தன் உயிரை ஆபத்தில் இட்டு, பிலிப்பியர்கள் பவுலுக்குச் செய்ய இயலாமல் இருந்த சேவையின் குறைவை நிரப்ப முயன்றார். ஆனால் ‘உங்கள் பணியில் குறைவாயிருந்ததை’ என்பது குறைவு பணியிலா, பிலிப்பியர்களிடமா என்பதைச் சிறிது மங்கலாக்குகிறது; πρός με λειτουργίας என்பதிலுள்ள ‘எனக்குச் செய்யப்பட்ட சேவை’ வெளிப்படையாக வர வேண்டும்.'
