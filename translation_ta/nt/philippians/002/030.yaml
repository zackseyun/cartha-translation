  terminology: ‘மெசியா’ என்பது Χριστός என்பதன் பட்டப்பொருளைத் தக்கவைக்கிறது; ‘கிறிஸ்து’ மாற்று அடிக்குறிப்பு பொருத்தமானது. λειτουργίαக்கு ‘சேவை’ இங்கு ‘பணி’யைவிட பவுலுக்கான நடைமுறை உதவியைக் குறிப்பாகவும் இயல்பாகவும் தெரிவிக்கிறது. ‘உயிரைப் பணயம் வைத்தார்’ παραβολευσάμενος τῇ ψυχῇ என்பதற்கு வலிமையான, பொருத்தமான மொழிபெயர்ப்பு.
