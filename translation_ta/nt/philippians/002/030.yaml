- from: ஏனெனில், மெசியாவின்[a] பணியின் நிமித்தம்[c] அவர் மரணத்தை நெருங்கினார்; எனக்கான உங்கள் பணியில் குறைவாயிருந்ததை[b] நிறைவு செய்வதற்காகத் தன் உயிரைப் பணயம் வைத்தார்.
  to: ஏனெனில், மெசியாவின்[a] பணியின் காரணமாக[c] அவர் மரணத்தை நெருங்கினார்; எனக்குச் செய்த உங்கள் சேவையில் இருந்த குறைவை[b] நிறைவு செய்வதற்காகத் தன் உயிரைப் பணயம் வைத்தார்.
  rationale: 'திருத்தம் பொருளை மாற்றாமல் இரண்டு இடங்களில் தெளிவையும் இயல்பையும் மேம்படுத்துகிறது: διὰ-வின் காரண உறவு ‘காரணமாக’ என நேரடியாகத் தரப்பட்டுள்ளது; மேலும் பவுலுக்குச் செய்யப்படும் பிலிப்பியரின் சேவையில் இருந்த நடைமுறைக் குறைவு தெளிவாகக் குறிப்பிடப்பட்டுள்ளது. அடிக்குறிப்புகள் எல்லாம் தத்தம் உரை-நங்கூரங்களுடன் பாதுகாக்கப்பட்டுள்ளன.'
