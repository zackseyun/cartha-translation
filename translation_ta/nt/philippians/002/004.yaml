base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: ta
  text: உங்களில் ஒவ்வொருவரும் தன் சொந்த நலன்களை மட்டும்[a] கவனிக்காமல், மற்றவர்களின் நலன்களையும் கவனிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: “ஒவ்வொருவரும் தங்களுக்குரியவற்றை மட்டும் கவனிக்காமல், மற்றவர்களுக்குரியவற்றையும் கவனித்து.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: கவனிக்க வேண்டும்
  rationale: σκοπέω என்பது ஒன்றின்மீது கவனத்தையும் அக்கறையையும் செலுத்துவதைக் குறிக்கிறது. முந்தைய வசனத்தின் அறிவுறுத்தலைத் தொடர்ந்து வரும் கிரேக்கப் பங்கேற்பு வடிவத்தின் அறிவுறுத்தல் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்த “கவனிக்க வேண்டும்” பயன்படுத்தப்பட்டது.
- source_word: τὰ ἑαυτῶν
  choice: தன் சொந்த நலன்களை
  rationale: இந்த நடுநிலைப் பன்மைத் தொடர் உடைமைகளை மட்டும் அல்லாமல் ஒருவருக்குரிய காரியங்கள், அக்கறைகள், நன்மை ஆகியவற்றையும் பரந்த வகையில் குறிக்கலாம். “நலன்கள்” சூழலுக்கேற்ற இயல்பான தமிழாக இருந்து அந்தப் பரந்த பொருளை உணர்த்துகிறது.
- source_word: ἕκαστοι
  choice: உங்களில் ஒவ்வொருவரும்
  rationale: ἕκαστοι குழுவிலுள்ள நபர்கள் ஒவ்வொருவரையும் தனித்தனியாகச் சுட்டும் பகிர்நிலைப் பொருளைக் கொண்டது; “உங்களில் ஒவ்வொருவரும்” அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ καὶ
  choice: மட்டும் ... மற்றவர்களின் ... -யும்
  rationale: இத்தொடர் எதிர்மறை வேறுபாட்டோடு சேர்த்தலையும் காட்டுகிறது. “மட்டும் ... -யும்” என்ற தமிழ் அமைப்பு, சொந்த நலன்களை முற்றிலும் புறக்கணிக்க வேண்டும் என்று கூறாமல் மற்றவர்களின் நலன்களையும் சேர்த்துக் கவனிக்க வேண்டும் என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: τὰ ἑτέρων
  choice: மற்றவர்களின் நலன்களை
  rationale: இத்தொடர் பிறருடைய உடைமைகளை மட்டும் அல்லாமல் அவர்களுக்குரிய காரியங்கள், அக்கறைகள், நன்மை ஆகியவற்றையும் குறிக்கிறது; “மற்றவர்களின் நலன்கள்” இதை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: சொந்த நலன்களைக் கவனிப்பதற்கும் பிறர் நலன்களைக் கவனிப்பதற்கும் உள்ள தொடர்பு
  choice: “மட்டும் ... நலன்களையும்” என்று மொழிபெயர்த்து, பிறர் நலனைச் சொந்த நலனுடன் சேர்த்துக் கவனிக்க வேண்டும் என்ற பொருளை வெளிப்படுத்துதல்
  alternative: சொந்த நலன்களை முற்றிலும் கவனிக்கக் கூடாது என்று பொருள்படும் வகையில் மொழிபெயர்த்தல்
  rationale: ἀλλὰ καί என்பதிலுள்ள καί (“மேலும்/கூட”) சொந்த நலனைக் கவனிப்பதை முழுமையாக மறுப்பதற்குப் பதிலாக, பிறர் நலனையும் கவனத்தில் சேர்க்கிறது. ஆகவே மூலத்தின் சமநிலையும் நெறியியல் அழுத்தமும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மதிப்புறு நடையிலும் அமைக்கப்பட்டது. “நலன்கள்” என்பது உடைமைகள் என்ற குறுகிய பொருளைத் தவிர்த்து, கிரேக்கத் தொடர்களின் பரந்த பொருளைக் காட்டுகிறது. முதன்மை உரையில் அறிவுறுத்தல் வலிமைக்காக “வேண்டும்” பயன்படுத்தப்பட்டாலும், அடிக்குறிப்பு கிரேக்கப் பங்கேற்பு அமைப்பின் மேலும் நேரடியான வடிவத்தைப் பதிவு செய்கிறது.
