source:
  edition: SBLGNT
  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: ta
  text: ஆகவே, நீங்கள் அவனை மீண்டும் காணும்போது மகிழவும், நானும் குறைந்த துயரத்துடன் இருக்கவும், அவனை மேலும் அதிக ஆவலுடன் அனுப்பினேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: இன்னும் அதிக ஆவலுடன்
  rationale: ஒப்பீட்டு வினையடை வெளிப்படுத்தும் அதிகரித்த ஆர்வத்தையும் முனைப்பையும் இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவு அல்லது தொடர்ச்சியைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἔπεμψα
  choice: அனுப்பினேன்
  rationale: இறந்தகால aorist வினையை எளிய இறந்தகாலமாக நேரடியாக வழங்குகிறது.
- source_word: ἵνα
  choice: -வும் … -வும்
  rationale: இரண்டு நோக்கங்களையும் தமிழில் இயல்பான இணைநிலை நோக்கக் கட்டமைப்பால் வெளிப்படுத்துகிறது.
- source_word: ἰδόντες
  choice: கண்டு
  rationale: χαρῆτε என்பதற்கான காலச்சூழலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: எப்பாப்பிரோதித்துவை மறுபடியும் காண்பதைக் குறிக்கும் நேரடியான இணைச்சொல்.
- source_word: χαρῆτε
  choice: மகிழவும்
  rationale: ἵνα கீழுள்ள நோக்கத்தைக் காத்து, பவுலின் மகிழ்ச்சி சார்ந்த சொல்லாட்சியையும் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: κἀγώ
  choice: நானும்
  rationale: καὶ ἐγώ என்பதன் இணைப்பு மற்றும் சேர்க்கைப் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἀλυπότερος
  choice: துயரம் குறைந்தவனாக
  rationale: ஒப்பீட்டுப் பொருளான ‘குறைவான துயரமுடையவன்’ என்பதை, கவலை என்று மட்டும் குறுக்காமல், இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὦ
  choice: இருக்கவும்
  rationale: εἰμί வினையின் subjunctive வடிவத்தையும் நோக்கக் கட்டமைப்பையும் தமிழில் இயல்பாக இணைக்கிறது.
