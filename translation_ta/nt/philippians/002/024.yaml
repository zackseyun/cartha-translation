  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/024.yaml
  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: ta
  text: ஆண்டவருக்குள், நானே கூட விரைவில் வருவேன் என்று நம்பிக்கை கொண்டிருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நானும் விரைவில் வருவேன் என்று ஆண்டவருக்குள் உறுதியாக நம்புகிறேன்.’
    reason: πέποιθα என்பதற்கு ‘உறுதியாக நம்புகிறேன்’ என்பதும், καὶ αὐτός என்பதற்கு வலியுறுத்தல் குறைவாகத் தெரிவிக்கும் ‘நானும்’ என்பதும் சாத்தியமான மாற்று.
lexical_decisions:
- source_word: πέποιθα
  choice: எனக்கு நம்பிக்கை உண்டு
  rationale: முற்றுப்பெற்ற வினை வடிவம் தற்போது நிலைத்திருக்கும் நம்பிக்கையைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் உறுதியை மிகைப்படுத்தாமலும் இதை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: —
  rationale: இது உரையோட்டத்தைத் தொடரும் மென்மையான இணைப்புச்சொல். தமிழில் தனியாக மொழிபெயர்க்காமல் விடுவது இயல்பான நடை.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் வழக்கமான சொற்றொடரையும், அவரது நம்பிக்கை ஆண்டவரைச் சார்ந்து நிலைகொண்டிருப்பதையும் காக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: பவுலின் நம்பிக்கையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ் இணைப்பு.
- source_word: καὶ αὐτὸς
  choice: நானும் … நேரில்
  rationale: καί என்பதன் ‘நானும்’ என்ற சேர்க்கைப் பொருளையும், αὐτός என்பதன் பவுலே தனிப்பட்ட முறையில் வருவார் என்ற வலியுறுத்தலையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: ταχέως
  choice: விரைவில்
  rationale: இங்கு பயண வேகத்தைவிட அண்மையான காலத்தைக் குறிக்கிறது.
- source_word: ἐλεύσομαι
  choice: வருவேன்
  rationale: கிரேக்க வினையின் எதிர்காலப் பொருளையும், பிலிப்பியரை நோக்கிய ‘வருதல்’ என்ற பார்வைநிலையையும் காக்கிறது.
- source_word: κυρίῳ
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் வேதாகமச் சொல்; இங்கு பவுலின் கிறிஸ்துவை மையமாகக் கொண்ட பயன்பாட்டுக்கும் பொருந்துகிறது.
theological_decisions:
- issue: பவுலின் நம்பிக்கைக்கும் ‘ஆண்டவருக்குள்’ என்பதற்கும் உள்ள உறவு
  choice: ஆண்டவருக்குள் எனக்கு நம்பிக்கை உண்டு
  alternative: நான் ஆண்டவரை நம்புகிறேன்
  rationale: பவுலின் எதிர்பார்ப்பு ஆண்டவரைச் சார்ந்து நிலைகொண்டுள்ளது என்பதைத் தெரிவிக்கிறது; அதேவேளையில் இது நேரடியான வெளிப்பாடு அல்லது நிபந்தனையற்ற உறுதி என்று உரை கூறாததைச் சேர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நேரில்’ என்பது αὐτός தரும் தனிப்பட்ட வருகை வலியுறுத்தலைத் தமிழில் தெளிவாக்குகிறது; அடிக்குறிப்பு மேலும் நேரடியான மாற்றை வழங்குகிறது.
