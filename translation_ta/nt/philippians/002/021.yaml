id: PHP.2.21
reference: Philippians 2:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் எல்லாரும் தங்களுக்குரியவற்றையே நாடுகிறார்கள்; மெசியாவாகிய இயேசுவுக்குரியவற்றை[a] அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு கிறிஸ்துவுக்குரியவற்றை.”
    reason: Χριστός என்பதைக் பட்டப் பொருளுடன் ‘மெசியா’ எனவோ, தமிழில் வழக்கமான பெயர்போன்ற வடிவில் ‘கிறிஸ்து’ எனவோ வழங்கக்கூடிய சொல்லாக்க மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: οἱ πάντες
  choice: அவர்கள் எல்லாரும்
  rationale: சுட்டப்படும் நபர்கள் அனைவரையும் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள பன்மைத் தொடரை இயல்பான தமிழில் வழங்குகிறது; கூட்டுமுழுமை வலியுறுத்தலையும் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: τὰ ἑαυτῶν
  choice: தங்களுக்குரியவற்றையே
  rationale: ஒருவருக்குச் சொந்தமான காரியங்கள் அல்லது நலன்கள் என்ற பரந்த பொருளைச் சுருக்காமல் காக்கிறது; ஏகார வலியுறுத்தல் எதிர்மறை ஒப்பீட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ζητοῦσιν
  choice: நாடுகிறார்கள்
  rationale: தேடுதல், விரும்பிப் பின்தொடர்தல், முன்னுரிமை கொடுத்தல் ஆகிய பொருள் பரப்பை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: மெசியாவாகிய இயேசுவுக்குரியவற்றை
  rationale: மீண்டும் வரும் நடுநிலைப் பன்மையின் மறைபொருளான ‘அவருக்குரியவை’ என்பதைக் காக்கிறது. Χριστός இங்கு பட்டமாக இருப்பதால் ‘மெசியா’ என்று வழங்கப்பட்டு, தமிழின் இயல்பான பெயர்-பட்ட அமைப்புக்காக ‘மெசியாவாகிய இயேசு’ என அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-ஐ எவ்வாறு வழங்குவது
  choice: மெசியாவாகிய இயேசு
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός என்பதன் பட்டப் பொருளை ‘மெசியா’ நேரடியாகக் காக்கிறது. தமிழில் வழக்கமான ‘இயேசு கிறிஸ்து’ என்ற பெயர்போன்ற வடிவம் அடிக்குறிப்பில் மாற்றாகத் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘தங்களுக்குரியவற்றையே … இயேசுவுக்குரியவற்றை அல்ல’ என்ற இணை அமைப்பு கிரேக்கத்தின் நேரடியான நெறி முரண்பாட்டைக் காக்கிறது; ‘நலன்கள்’ என்று மட்டும் குறுக்காமல் மூலத்தின் பரந்த பொருளும் பாதுகாக்கப்பட்டுள்ளது.
