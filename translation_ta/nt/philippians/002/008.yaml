language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐταπείνωσεν ἑαυτὸν γενόμενος ὑπήκοος μέχρι θανάτου, θανάτου δὲ σταυροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/008.yaml
  text: he humbled himself[b][a], becoming obedient to the point of death—even death on a cross.
translation:
  language: ta
  text: அவர் தம்மையே தாழ்த்தினார்; மரணம் வரைக்கும் கீழ்ப்படிந்தவரானார்—அதுவும் சிலுவை மரணம் வரைக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: தாழ்த்தினார்
  rationale: செயப்படுபொருள் குன்றா வினையின் செயற்பாட்டு வலிமையையும், தாமாக முன்வந்து தாழ்ந்ததையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἑαυτὸν
  choice: தம்மையே
  rationale: மூலத்தில் வெளிப்படையாக உள்ள தற்சுட்டுப் பெயரைத் தக்கவைத்து, அவர் தம்மைத் தாமே தாழ்த்தியதற்கு அழுத்தம் தருகிறது.
- source_word: γενόμενος
  choice: ஆகி
  rationale: முதன்மை வினையோடு பங்கேற்பு வினையை இயல்பாக இணைத்து, அவர் தம்மைத் தாழ்த்திய விதத்தை வெளிப்படுத்துகிறது; கால வரிசையைத் தேவையின்றி மிகத் துல்லியமாக்கவில்லை.
- source_word: ὑπήκοος
  choice: கீழ்ப்படிந்தவராகி
  rationale: கீழ்ப்படிதல் என்ற நேரடியான பொருளைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: μέχρι θανάτου
  choice: மரணம் வரைக்கும்
  rationale: அவருடைய கீழ்ப்படிதல் மரணம் வரை முழுமையாக நீண்டது என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘மரணமடையும் அளவுக்கு’ என்ற சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δὲ
  choice: அதுவும்
  rationale: பொதுவாக மரணம் என்பதிலிருந்து குறிப்பாக சிலுவை மரணம் என்பதற்கு உயர்த்திக் காட்டும் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σταυροῦ
  choice: சிலுவை மரணம்
  rationale: சுருக்கமான கிரேக்க உரையின் ‘சிலுவையின் மரணம்’ என்ற சொல்லமைப்பை இயல்பான தமிழில் வழங்கி, சிலுவையில் ஏற்பட்ட மரணத்தைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: θανάτου δὲ σταυροῦ என்ற இறுதித் தொடரின் வலிமை
  choice: ‘அதுவும் சிலுவை மரணம்’ என்ற வலியுறுத்தும் உச்சநிலை
  alternative: ‘ஆம், சிலுவை மரணம்’ அல்லது சொல்லுக்குச் சொல்லாக ‘சிலுவையின் மரணம்’
  rationale: இத்தொடர் மரணத்தை வெறுமனே மறுபடியும் கூறாமல், சிலுவை மரணத்தின் அதிர்ச்சியூட்டும் இழிவை உச்சமாக முன்வைக்கிறது. கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அந்தச் சொல்லாட்சியின் வலிமை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தம்மையே’ என்பது தன்னார்வத் தாழ்மைக்கு உரிய அழுத்தத்தைத் தருகிறது; ‘அதுவும்’ இறுதித் தொடரின் சொற்பொழிவு உச்சத்தை இயல்பாகக் காக்கிறது.
