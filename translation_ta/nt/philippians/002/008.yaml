    text: ‘மரணமடையும் அளவுக்கு’ என்றும் மொழிபெயர்க்கலாம்; அவருடைய கீழ்ப்படிதல் மரணத்தையே எதிர்கொள்ளும் அளவுக்கு நீண்டது என்பதே பொருள்.
    reason: lexical_alternative
