  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: ta
  text: நம்முடைய தந்தையாகிய கடவுளிடமிருந்தும் ஆண்டவராகிய இயேசு மேசியாவிடமிருந்தும் உங்களுக்கு அருளும் சமாதானமும் உண்டாவதாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்தில் வரும் χάρις என்பதன் உறவுசார் மற்றும் இறையியல் நிறையைப் பாதுகாக்கும் இயல்பான, நிலைபெற்ற தமிழ் சொல்.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: வாழ்த்து மற்றும் ஆசிமொழிச் சூழலில் இந்த வேற்றுமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: அமைதி, நல்வாழ்வு ஆகிய விரிந்த பொருளோசைகளைத் தாங்கும் நிலைபெற்ற தமிழ் வேதாகமச் சொல்.
- source_word: ἀπὸ
  choice: இடமிருந்தும்
  rationale: அருளும் சமாதானமும் வருகிற மூலத்தைத் தெளிவாகக் குறிக்கிறது; ஒரே ἀπό இரு இணைக்கப்பட்ட பெயர்த்தொடர்களையும் ஆளுவதால் தமிழில் இரண்டிலும் ‘இடமிருந்தும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: நம் தந்தையாகிய கடவுள்
  rationale: ‘கடவுள், அதாவது நம் தந்தை’ என்ற விளக்க appositional உறவை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் அதிகாரத்தையும் புதிய ஏற்பாட்டிலுள்ள கிறிஸ்தியல் நிறையையும் காக்கும் நிலைபெற்ற தமிழ் இணைச்சொல்.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மேசியா இயேசு
  rationale: Χριστός என்பதை வெறும் ஒலிபெயர்ப்பாக அல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்/மேசியா’ என்னும் பட்டப்பொருளுடன் வெளிப்படுத்துகிறது; இயல்பான தமிழுக்காக பட்டம் பெயருக்கு முன் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பவுலின் வாழ்த்தில் Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இந்த இடத்தில் Χριστός பெயரைப் போல நிலைபெற்றிருந்தாலும் அதன் பட்டப்பொருள் இன்னும் தெளிவாகக் காணப்படுகிறது. ஆகவே மூலச்சொல்லின் பொருளை வெளிப்படையாக்க ‘மேசியா’ முதன்மை உரையில் வைக்கப்பட்டு, மரபான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: ஒரே ἀπό கடவுளையும் இயேசுவையும் தொடர்புபடுத்துவது
  choice: இருவரிடமிருந்தும் அருளும் சமாதானமும் வருகின்றன என இணை அமைப்பைப் பாதுகாத்தல்
  alternative: இரண்டாவது பெயர்த்தொடரை வேறு இலக்கண உறவாக எடுத்தல்
  rationale: καί மூலம் இணைக்கப்பட்ட இரு ஆறாம் வேற்றுமைத் தொடர்களையும் ἀπό ஒரேவிதமாக ஆளுகிறது; இதைத் தமிழ் ‘இடமிருந்தும் … இடமிருந்தும்’ என்ற இணை வடிவில் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, அதே நேரத்தில் வழிபாட்டு மரியாதை கொண்ட நடை. மூலத்தில் வெளிப்படையாக இல்லாத வினைக்கு இணையான வாழ்த்துப் பொருளைத் தமிழில் இயல்பாக்க ‘உண்டாவதாக’ சேர்க்கப்பட்டுள்ளது. ‘ஆண்டவராகிய மேசியா இயேசு’ என்பது κύριος மற்றும் Χριστός ஆகிய இரு பட்டங்களையும் இயேசுவுடன் தொடர்புபடுத்துகிறது.
