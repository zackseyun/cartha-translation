id: PHP.1.22
reference: Philippians 1:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: ta
  text: ஆனால், நான் உடலில்[a] தொடர்ந்து வாழ்வது எனக்குப் பலனளிக்கும் பணி[b] என்றால்—எதைத் தேர்ந்தெடுப்பேன் என்பது எனக்குத் தெரியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாம்சத்தில்.” இங்கு பாவ இயல்பு அல்ல, உடலோடு கூடிய வாழ்வே குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “பணியின் பலன்”; அல்லது, “பலனுள்ள பணி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: தொடர்ந்து வாழ்வது
  rationale: இங்கு பவுல் தற்போதைய உலக வாழ்வு நீடிப்பதைக் குறிக்கிறார். வெறும் ‘வாழ்வது’ என்பதைவிட ‘தொடர்ந்து வாழ்வது’ சூழலுக்குரிய தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν σαρκί
  choice: உடலில்
  rationale: σάρξ இங்கு பாவ இயல்பைக் குறிக்காமல், உடலோடு கூடிய இவ்வுலக வாழ்வைக் குறிக்கிறது. தமிழில் ‘மாம்சத்தில்’ என்பது தவறாக ஒழுக்கவியல் பொருளைத் தூண்டக்கூடும் என்பதால், இயல்பான ‘உடலில்’ முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: καρπὸς ἔργου
  choice: பலனளிக்கும் பணி
  rationale: கிரேக்கச் சொற்றொடர் சுருக்கமானது. ‘பலனளிக்கும் பணி’ என்பது καρπός என்பதன் பலன் கருத்தையும் ἔργον என்பதன் பணி கருத்தையும் இயல்பான தமிழில் இணைக்கிறது; மேலும் சொற்சொல்லான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: αἱρήσομαι
  choice: தேர்ந்தெடுப்பேன்
  rationale: இரண்டு வாய்ப்புகளுக்கு இடையில் ஒன்றைத் தெரிவுசெய்வதே சூழலின் கருத்து; ‘தேர்ந்தெடுப்பேன்’ இதைத் தெளிவாகக் கூறுகிறது.
- source_word: οὐ γνωρίζω
  choice: எனக்குத் தெரியவில்லை
  rationale: γνωρίζω வேறு சூழல்களில் ‘தெரிவித்தல்’ எனப் பொருள்படலாம்; இங்கு அது பவுலின் நிச்சயமின்மையை வெளிப்படுத்துவதால், ‘எனக்குத் தெரியவில்லை’ பொருத்தமானது.
theological_decisions:
- issue: இந்த வசனத்தில் σάρξ என்பதன் பொருள்
  choice: உடலோடு கூடிய இவ்வுலக வாழ்வு (‘உடலில்’)
  alternative: பாவ இயல்பு; அல்லது சொற்சொல்லாக ‘மாம்சத்தில்’
  rationale: அருகிலுள்ள சூழல், உடலில் தொடர்ந்து வாழ்வதையும் புறப்பட்டுப் போய் கிறிஸ்துவுடன் இருப்பதையும் ஒப்பிடுகிறது. ஆகவே இங்கு σάρξ ஒழுக்கக் கேட்டை அல்ல, உடல் சார்ந்த இவ்வுலக இருப்பைக் குறிக்கிறது.
- issue: εἰ ... καὶ என்ற சுருக்கமான வாக்கிய அமைப்பு
  choice: நிபந்தனைத் தொடரின் சுருக்கத்தையும் அடுத்த கூற்றுடனான பதற்றத்தையும் கோடிட்டு காட்டுதல்
  alternative: ‘அப்படியானால்’ போன்ற விளக்கச் சொல்லைச் சேர்த்து காரணவிளைவு உறவை வெளிப்படையாக்குதல்
  rationale: கிரேக்கத்தில் நிபந்தனையின் முடிவு வெளிப்படையாக விரிவாக்கப்படவில்லை; மேலும் καί இங்கு தொடர்ச்சியையோ எதிர்நிலையையோ உணர்த்தக்கூடும். ஆகவே விளக்கமான முடிவைச் சேர்க்காமல் மூலத்தின் சுருக்கமும் உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மாம்சத்தில்’ என்ற சமயவழக்குச் சொல் முதன்மை உரையில் தவறான ஒழுக்கவியல் பொருளைத் தூண்டாதபடி ‘உடலில்’ என மொழிபெயர்க்கப்பட்டது. மூலத்தின் சுருக்கமான, ஓரளவு முடிவுறாத நிபந்தனை அமைப்பை கோடு மூலம் பாதுகாத்துள்ளோம்.
