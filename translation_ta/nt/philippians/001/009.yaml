- from: 'நான் வேண்டிக்கொள்வது இதுவே: உங்கள் அன்பு அறிவிலும்[a] எல்லா வகையான பகுத்துணர்விலும்[b] இன்னும் மென்மேலும் பெருக வேண்டும்.'
  to: 'இதையும் நான் வேண்டிக்கொள்கிறேன்: உங்கள் அன்பு அறிவிலும்[a] எல்லா வகையான பகுத்துணர்விலும்[b] இன்னும் மேலும் மேலும் பெருக வேண்டும்.'
