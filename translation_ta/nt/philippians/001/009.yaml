source:
  edition: SBLGNT
  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: ta
  text: 'இதையும் நான் வேண்டிக்கொள்கிறேன்: உங்கள் அன்பு அறிவிலும்[a] எல்லா வகையான பகுத்துணர்விலும்[b] இன்னும் மேலும் மேலும் பெருக வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அறிவோடு’; கிரேக்க முன்னிடைச்சொல் நெருங்கிய உடனிணைவைக் குறிக்கும் வகையிலும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எல்லா வகையான உள்ளுணர்விலும்’ அல்லது ‘எல்லா ஒழுக்கப் புரிதலிலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: நான் வேண்டிக்கொள்வது இதுவே
  rationale: καί இங்குப் பவுலின் முந்தைய உரையிலிருந்து அவரது வேண்டுதலுக்கு இயல்பான தொடர்ச்சியை அளிக்கிறது; τοῦτο என்பதன் சுட்டுப்பொருள் ‘இதுவே’ என்பதில் பாதுகாக்கப்படுகிறது. தமிழில் இயல்பான வாக்கிய அமைப்புக்காக வினையுடன் இணைக்கப்பட்டுள்ளது.
- source_word: προσεύχομαι
  choice: வேண்டிக்கொள்கிறேன் / வேண்டிக்கொள்வது
  rationale: நிகழ்கால வினையின் தொடர்ந்துவரும் வேண்டுதலை வெளிப்படுத்துகிறது. பிரதான உரையில் ‘நான் வேண்டிக்கொள்வது இதுவே’ என்பது இயல்பான நவீனத் தமிழாக உள்ளது.
- source_word: ἵνα
  choice: வேண்டும்
  rationale: வேண்டுதலின் உள்ளடக்கத்தையும் நோக்கத்தையும் தமிழில் இயல்பாகக் காட்ட வினைமுற்றின் இறுதியில் ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀγάπη
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான தெளிவான, பொதுவாகப் புரியும் தமிழ் இணைச்சொல்; சூழல் இதைவிடக் குறுகிய அல்லது சமயப் பிரிவுக்குரிய பொருளை வற்புறுத்தவில்லை.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον
  choice: இன்னும் மென்மேலும்
  rationale: ἔτι என்பதன் ‘இன்னும்’ என்ற தொடர்ச்சி உணர்வையும், μᾶλλον ... καὶ μᾶλλον என்பதன் மீண்டும் மீண்டும் அதிகரிக்கும் வலியுறுத்தலையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: περισσεύῃ
  choice: பெருக வேண்டும்
  rationale: அளவில் நிறைந்து தொடர்ந்து அதிகரிப்பதைக் குறிக்கிறது; ἵνα உடன் வரும் subjunctive-இன் வேண்டுதல் சார்ந்த நுணுக்கம் ‘வேண்டும்’ என்பதால் வெளிப்படுகிறது.
- source_word: ἐν ἐπιγνώσει
  choice: அறிவிலும்
  rationale: ἐν என்ற முன்னிடைச்சொல்லின் முதன்மையான ‘இல்’ தொடர்பைத் தக்கவைத்து, ἐπίγνωσις என்பதைச் சூழலை மீறி ‘முழுமையான அறிவு’ என்று மிகைப்படுத்தாமல் எளிய ‘அறிவு’ என வழங்குகிறது.
- source_word: πάσῃ αἰσθήσει
  choice: எல்லா வகையான பகுத்துணர்விலும்
  rationale: αἴσθησις இங்கு வெறும் புலனுணர்வை அல்லாமல் நடைமுறை அல்லது ஒழுக்கத் தளத்தில் சரியாக உணரும் திறனைக் குறிக்கிறது. πάσῃ என்பதன் பரந்த அளவை ‘எல்லா வகையான’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அன்புக்கும் அறிவு மற்றும் பகுத்துணர்வுக்கும் இடையிலான ἐν தொடர்பு
  choice: ‘அறிவிலும் ... பகுத்துணர்விலும்’ என்று இடம்/தளம் அல்லது சூழல் சார்ந்த தொடர்பைத் திறந்தவையாக வைத்தல்
  alternative: ‘அறிவோடும் ... பகுத்துணர்வோடும்’ என்று துணை அல்லது உடனிணைவு சார்ந்த தொடர்பாக மொழிபெயர்த்தல்
  rationale: கிரேக்க ἐν இவ்விரு நுணுக்கங்களையும் அனுமதிக்கலாம். பிரதான உரை அதன் நேரடி அமைப்பைத் தக்கவைக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது, இதனால் அன்பு அறிவினால் கட்டுப்படுத்தப்படுகிறதா, அறிவுடன் சேர்ந்து வளருகிறதா என்ற நுண்ணிய பதற்றம் தேவையின்றித் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வழிபாட்டு வாசிப்புக்கும் தனிப்பட்ட வாசிப்புக்கும் ஏற்ற நடை பயன்படுத்தப்பட்டுள்ளது. ‘மென்மேலும்’ என்பது உயர்நடையாக இருந்தாலும் பரவலாகப் புரியும் சொல்; கிரேக்கத்தின் மீளுரைத்த அதிகரிப்பு வலியுறுத்தலை இயல்பாக எடுத்துரைக்கிறது. அடிக்குறிப்பு குறிகள் உரிய சொற்றொடர்களுக்குப் பின் இடப்பட்டுள்ளன.
