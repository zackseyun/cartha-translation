  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: ta
  text: மேன்மையானவற்றை நீங்கள் ஆராய்ந்து ஏற்றுக்கொள்ளவும்[a], மெசியாவின் நாளுக்காகத் தூய்மையானவர்களாகவும் குற்றமற்றவர்களாகவும் இருக்கவும்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “முக்கியமானவற்றை ஆராய்ந்து ஏற்றுக்கொள்ளவும்,” “சிறந்தவற்றை ஆராய்ந்து ஏற்றுக்கொள்ளவும்”; இன்னும் சொல்லுக்கு நேராக, “வேறுபடுகிறவற்றைச் சோதித்தறியவும்.”'
    reason: lexical_alternative
  - marker: b
    text: '“குற்றமற்றவர்களாக” என்பதற்கு “இடறாதவர்களாக” அல்லது “பிறரை இடறச் செய்யாதவர்களாக” என்றும் பொருள் இருக்கலாம். மரபுவழி மொழிபெயர்ப்பு: “கிறிஸ்துவின் நாளுக்காக.”'
    reason: lexical_and_traditional_alternative
lexical_decisions:
- source_word: δοκιμάζειν
  choice: ஆராய்ந்து ஏற்றுக்கொள்ள
  rationale: இந்த வினை சோதித்தல், ஆராய்தல், சோதித்தறிந்த பின் ஏற்றுக்கொள்ளுதல் ஆகிய பொருள்களைத் தருகிறது. ‘ஆராய்ந்து ஏற்றுக்கொள்ள’ என்பது மதிப்பிட்டுத் தீர்மானிக்கும் செயலையும் அதன் நேர்மறையான முடிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ διαφέροντα
  choice: மேன்மையானவற்றை
  rationale: சொல்லுக்கு நேரான பொருள் ‘வேறுபடுகிறவை’ என்றாலும், இச்சூழலில் சிறந்தவை அல்லது அதிக முக்கியத்துவம் வாய்ந்தவை என்பதே பெரும்பாலும் குறிக்கப்படுகிறது. ‘மேன்மையானவற்றை’ என்பது அந்த ஒப்பீட்டு வலிமையைப் பாதுகாக்கிறது.
- source_word: εἰλικρινεῖς
  choice: தூயவர்களாக
  rationale: இச்சொல் தூய்மை, கபடமின்மை, உண்மைத்தன்மை ஆகிய கருத்துகளைத் தரலாம். ஒழுக்க வாழ்வைப் பற்றிய இச்சூழலிலும் அடுத்த சொல்லுடனான இணைப்பிலும் ‘தூயவர்களாக’ பொருத்தமாக உள்ளது.
- source_word: ἀπρόσκοποι
  choice: குற்றமற்றவர்களாக
  rationale: இது இடறாதவர்கள் அல்லது பிறர் இடறக் காரணமாகாதவர்கள் என்ற நுணுக்கங்களைக் கொண்டிருக்கலாம். இங்கு εἰλικρινεῖς என்பதுடன் இணைந்திருப்பதால், குறைசொல்ல இடமில்லாத வாழ்வை ‘குற்றமற்றவர்களாக’ தெளிவாக எடுத்துரைக்கிறது.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: மெசியாவின் நாளுக்காக
  rationale: εἰς இங்கு எதிர்நோக்கும் இலக்கைச் சுட்டுகிறது; ஆகவே ‘நாளுக்காக’ இயல்பானது. Χριστός இங்கு வரவிருக்கும் நாள் யாருக்குரியது என்பதைக் காட்டும் பட்டப்பெயராகச் செயல்படுவதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: εἰς ἡμέραν Χριστοῦ என்பதில் Χριστοῦ-ஐ மொழிபெயர்த்தல்
  choice: மெசியாவின் நாளுக்காக
  alternative: கிறிஸ்துவின் நாளுக்காக
  rationale: Χριστός இங்கு பெயரைப்போல மட்டும் இல்லாமல் பட்டப்பெயரின் பொருளுடன் வருவதால் ‘மெசியா’ என்று தரப்பட்டுள்ளது. பரிச்சயமான மரபுவழி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: ἀπρόσκοποι என்பதிலுள்ள செய்பவர்/பெறுபவர் நுணுக்கம்
  choice: குற்றமற்றவர்களாக
  alternative: இடறாதவர்களாக / பிறரை இடறச் செய்யாதவர்களாக
  rationale: கிரேக்கச் சொல் ஒருவர் தாமே இடறாமல் இருப்பதையோ பிறர் இடறக் காரணமாகாமல் இருப்பதையோ குறிக்கக்கூடும். முதன்மை உரையில் பரந்த ஒழுக்கக் கருத்தைத் தரும் ‘குற்றமற்றவர்களாக’ தேர்ந்தெடுக்கப்பட்டு, தெளிவாகத் தீராத நுணுக்கம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் நோக்கக் கட்டமைப்பைத் தொடரும் துணைவாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘ஆராய்ந்து ஏற்றுக்கொள்ள’ என்பது மூல வினையின் சோதனை மற்றும் அங்கீகாரம் ஆகிய இரு கூறுகளையும் காக்கிறது.
