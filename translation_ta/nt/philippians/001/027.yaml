review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal exhortation, the civic nuance in the note, the paired unity expressions, and the shared-struggle imagery. However, “அப்போது” makes the ἵνα clause sound primarily temporal (“then”), whereas it expresses the intended result/purpose of their conduct. The final genitive phrase is preserved formally but is not idiomatic enough in the current Tamil wording.
  naturalness: Most of the verse is clear modern standard Tamil. Recasting the purpose connection as “அப்போதுதான்” and using “நற்செய்தி சார்ந்த விசுவாசம்” produces a more natural sentence without deciding whether the genitive means faith in the gospel or faith characterized by the gospel.
  terminology: “மேசியா,” “நற்செய்தி,” “ஆவி,” “உள்ளம்,” and “விசுவாசம்” are appropriate in this register. “ஒரே ஆவியில்” appropriately retains the ambiguity of πνεύματι; the alternative reading is retained in a footnote. The alternative for faith in the gospel is adjusted to idiomatic Tamil.
  issues:
  - severity: medium
    issue: Purpose clause rendered as a temporal consequence
    rationale: '“அப்போது” normally means “then/at that time.” Greek ἵνα introduces the purpose or intended outcome: conduct yourselves in this way so that Paul may hear this report.'
  - severity: low
    issue: The expression “நற்செய்தியின் விசுவாசத்திற்காக” is awkward in Tamil
    rationale: Although close to the Greek wording, it is not an idiomatic Tamil noun phrase. “நற்செய்தி சார்ந்த விசுவாசத்திற்காக” retains the broad genitive relationship without forcing the alternative sense “faith in the gospel.”}],
