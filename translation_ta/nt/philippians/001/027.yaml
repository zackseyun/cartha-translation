source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: ta
  text: நீங்கள் மேசியாவின் நற்செய்திக்குத் தகுந்த விதத்தில் மட்டுமே வாழுங்கள்.[a] அப்போதுதான், நான் வந்து உங்களைப் பார்த்தாலும், தொலைவில் இருந்தாலும், நீங்கள் ஒரே ஆவியில்[b] உறுதியாக நின்று, ஒரே உள்ளத்தோடு[c] நற்செய்தி சார்ந்த விசுவாசத்திற்காக[d] ஒன்றிணைந்து போராடுகிறீர்கள் என்று உங்களைப் பற்றிக் கேள்விப்படுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கு, “குடிமக்களாக வாழுங்கள்” என்றும் பொருள் கொள்ளலாம்; கிரேக்க வினைச்சொல்லில் குடியுரிமை சார்ந்த உட்பொருள் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரே ஆவியானவரில்.”
    reason: alternative_reading
  - marker: c
    text: சொல்லர்த்தமாக, “ஒரே ஆன்மாவோடு”; அல்லது, “ஒரே மனதோடு.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “நற்செய்தியின்மீது வைக்கும் விசுவாசத்திற்காக.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: மட்டுமே
  rationale: முன்னிலைப்படுத்தப்பட்ட கிரேக்கச் சொல்லின் வலியுறுத்தலைத் தமிழில் இயல்பாகச் செயற்பாட்டுடன் இணைக்கிறது.
- source_word: ἀξίως
  choice: தகுந்த விதத்தில்
  rationale: வாழும் முறையை விளக்கும் வினையடையின் அறநெறிசார் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: πολιτεύεσθε
  choice: வாழுங்கள்
  rationale: சூழலில் பொதுவான நடத்தையையும் வாழ்க்கை முறையையும் தெளிவாகக் குறிக்கிறது; குடியுரிமை சார்ந்த உட்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: τοῦ εὐαγγελίου τοῦ Χριστοῦ
  choice: மேசியாவின் நற்செய்தி
  rationale: εὐαγγέλιον என்பதற்கான வழக்கமான ‘நற்செய்தி’யையும் Χριστός என்பதன் பட்டப்பெயர் தன்மையை ‘மேசியா’ என்றும் காக்கிறது.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: உங்களைப் பற்றிக் கேள்விப்படுவேன்
  rationale: கிரேக்க மரபுத்தொடரை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: στήκετε
  choice: உறுதியாக நின்று
  rationale: நிலைதளராமல் நிலைத்திருத்தல் என்ற பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ἐν ἑνὶ πνεύματι
  choice: ஒரே ஆவியில்
  rationale: சமூகத்தின் ஒருமைப்பாட்டைக் குறிக்கும் சாத்தியத்தை முன்னிலைப்படுத்தியும், பரிசுத்த ஆவியைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பில் திறந்துவைக்கிறது.
- source_word: μιᾷ ψυχῇ
  choice: ஒரே உள்ளத்தோடு
  rationale: ψυχήயின் பகிரப்பட்ட உள்ளார்ந்த நோக்கம் மற்றும் மனவொற்றுமையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συναθλοῦντες
  choice: ஒன்றிணைந்து போராடுகிறீர்கள்
  rationale: சேர்ந்து முயன்று போராடும் உருவகத்தையும் தொடர்ச்சியான செயற்பாட்டையும் காக்கிறது.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: நற்செய்தியின் விசுவாசத்திற்காக
  rationale: கிரேக்க உருபு மற்றும் பிறப்புவேற்றுமைத் தொடர்பைத் தீர்மானமாக விளக்காமல் அப்படியே காக்கிறது.
theological_decisions:
- issue: πνεύματι என்பது பகிரப்பட்ட மனித ஆவியைக் குறிக்கிறதா அல்லது பரிசுத்த ஆவியைக் குறிக்கிறதா
  choice: ஒரே ஆவியில்
  alternative: ஒரே ஆவியானவரில்
  rationale: அடுத்து வரும் ‘ஒரே உள்ளத்தோடு’ என்ற இணை அமைப்பு சமூக ஒருமைப்பாட்டை ஆதரிக்கிறது; இருப்பினும் பரிசுத்த ஆவியைக் குறிக்கும் வாசிப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: τῇ πίστει τοῦ εὐαγγελίου என்பதன் தொடர்பு
  choice: நற்செய்தியின் விசுவாசத்திற்காக
  alternative: நற்செய்தியில் வைக்கும் விசுவாசத்திற்காக
  rationale: இது நற்செய்தியால் வரையறுக்கப்படும் விசுவாசத்தையோ நற்செய்தியில் வைக்கும் விசுவாசத்தையோ குறிக்கலாம்; முதன்மை உரை கிரேக்கத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தின் குடியுரிமை உருவகம், πνεῦμα குறித்த இறையியல் தெளிவின்மை, τῇ πίστει τοῦ εὐαγγελίου என்ற தொடர்பின் பலவாய்ப்புகள் ஆகியவை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
