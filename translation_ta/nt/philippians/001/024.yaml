  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: ta
  text: ஆனால், மாம்சத்தில் தொடர்ந்து இருப்பது உங்களுக்காக மேலும் தேவையானது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உடலில் தொடர்ந்து வாழ்வது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: தொடர்ந்து இருப்பது
  rationale: பெயர்ச்சொல் தன்மையில் வரும் இந்த வினையெச்சத் தொடர், பவுல் இவ்வுலக வாழ்க்கையில் தொடர்ந்து இருப்பதைக் குறிக்கிறது; ‘தொடர்ந்து இருப்பது’ என்பது அதன் நீடித்திருத்தல் என்ற நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கிறிஸ்துவோடு இருக்கப் புறப்படுவதற்கான விருப்பத்துக்கும், இங்கே தொடர்ந்து வாழ வேண்டிய தேவைக்கும் இடையிலான முரண்பாட்டைக் காட்டுகிறது.
- source_word: ἐν τῇ σαρκὶ
  choice: மாம்சத்தில்
  rationale: மூலத்தின் உருவகத்தைப் பாதுகாத்து, இங்கு உடலோடு கூடிய இவ்வுலக வாழ்வைக் குறிக்கிறது; பாவ இயல்பைக் குறிக்கும் ஒழுக்கவியல் பொருள் அல்ல.
- source_word: ἀναγκαιότερον
  choice: அதிகத் தேவையானது
  rationale: ஒப்பீட்டுப் படிநிலையை மறைக்காமல் ‘மேலும் தேவையானது’ என்ற கிரேக்கப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: δι’ ὑμᾶς
  choice: உங்களுக்காக
  rationale: பிலிப்பியர்களின் நன்மையை நோக்கிய பயன் சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘உங்களால்’ எனும் காரணப் பொருளைத் தேவையின்றி முன்னிறுத்தவில்லை.
theological_decisions:
- issue: இவ்வசனத்தில் σάρξ என்பதன் பொருள்
  choice: உடலோடு கூடிய இவ்வுலக வாழ்வு (‘மாம்சத்தில்’)
  alternative: பாவ இயல்பு; அல்லது விரிவாக்கப்பட்ட ‘இந்த உலகில் உயிரோடு இருப்பது’
  rationale: சூழலில், கிறிஸ்துவோடு இருக்கப் புறப்படுவதையும் பிலிப்பியர்களின் நன்மைக்காக தற்போதைய உடல் வாழ்வில் தொடர்வதையும் பவுல் ஒப்பிடுகிறார். ஒழுக்கவியல் பொருளை இங்கே ஏற்றுவது சூழல் ஆதரிக்காத கருத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மாம்சத்தில்’ என்ற மூல உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்பட்டுள்ளது.
