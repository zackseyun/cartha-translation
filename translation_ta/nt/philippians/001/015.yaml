reference: Philippians 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: ta
  text: சிலர் பொறாமையினாலும் போட்டி மனப்பான்மையினாலும் மேசியாவை[a] அறிவிக்கிறார்கள்; மற்றவர்களோ நல்லெண்ணத்தினால் அறிவிக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்துவை.’ கிரேக்கப் பட்டம் Χριστός (கிறிஸ்தோஸ்).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: சிலர் … மற்றவர்களோ
  rationale: இரு வேறுபட்ட குழுக்களைச் சுட்டும் கிரேக்க மென்–தே அமைப்பை இயல்பான நவீன தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: διὰ φθόνον
  choice: பொறாமையினால்
  rationale: διά + accusative இங்கு காரணத்தையோ உள்நோக்கத்தையோ குறிக்கிறது; ‘பொறாமையினால்’ அதைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ἔριν
  choice: போட்டி மனப்பான்மையினால்
  rationale: சூழலில் ἔρις வெறும் வாக்குவாதத்தைவிட, பிறருடன் போட்டியிட்டு மேலோங்க முயலும் மனநிலையைக் குறிக்கிறது; இத்தேர்வு அந்த உறவுசார் போட்டிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: δι’ εὐδοκίαν
  choice: நல்லெண்ணத்தினால்
  rationale: பொறாமை மற்றும் போட்டி மனப்பான்மைக்கு எதிரான நல்ல உள்நோக்கத்தை εὐδοκία குறிக்கிறது; ‘நல்லெண்ணம்’ தேவையற்ற மிகைவிளக்கம் இன்றி அந்த நேர்மறைப் பொருளைத் தருகிறது.
- source_word: τὸν Χριστόν
  choice: மேசியாவை
  rationale: Χριστός இங்கு குறிப்பிட்ட பட்டமாக வருவதால், அதன் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப் பொருளைக் காட்ட ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: κηρύσσουσιν
  choice: அறிவிக்கிறார்கள்
  rationale: κηρύσσω என்பதன் பொதுவெளிப் பிரகடனப் பொருளை, நிறுவனமயமான ‘பிரசங்கிக்கிறார்கள்’ என்பதைக் காட்டிலும் இயல்பாகவும் பரவலாகவும் ‘அறிவிக்கிறார்கள்’ எடுத்துரைக்கிறது.
theological_decisions:
- issue: Χριστός என்பது பட்டமா அல்லது பெயர்போன்ற பயன்பாடா
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: τὸν என்ற உருபுடன் வரும் Χριστόν இவ்விடத்தில் பட்டப் பொருளைத் தெளிவாகத் தாங்குகிறது. இருந்தாலும் தமிழ் கிறிஸ்தவ வழக்கில் ‘கிறிஸ்து’ பரவலாக இருப்பதால் அது அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. பொறாமை, போட்டி மனப்பான்மை, நல்லெண்ணம் ஆகிய உள்நோக்கங்களின் மாறுபாடு தெளிவாக வைக்கப்பட்டுள்ளது; மூலத்தின் இரு குழுக்களுக்கிடையேயான எதிர்மறை–நேர்மறை ஒப்புமையும் பாதுகாக்கப்பட்டுள்ளது.
