  source_fidelity: மூலத்தின் μέν…δέ எதிர்மறை-ஒப்புமை ‘சிலர் … மற்றவர்களோ’ என்று தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது. διὰ + accusative-இன் காரண/உள்நோக்கப் பொருள் ‘பொறாமையினாலும்’, ‘போட்டி மனப்பான்மையினாலும்’, ‘நல்லெண்ணத்தினால்’ எனத் துல்லியமாகத் தரப்பட்டுள்ளது. τὸν Χριστόν மற்றும் κηρύσσουσιν ஆகியவை முறையே ‘மேசியாவை’ மற்றும் ‘அறிவிக்கிறார்கள்’ என பொருத்தமாக மொழிபெயர்க்கப்பட்டுள்ளன.
  naturalness: நடை நவீன பொதுத்தமிழில் இயல்பாகவும் வாசிக்கத் தெளிவாகவும் உள்ளது. இரண்டாம் உறுப்பில் வினைச்சொல்லை மீண்டும் இடுவது தமிழில் இயல்பானது; அது கருத்தைத் தெளிவாக்குகிறது.
  terminology: ‘மேசியா’ என்பது இவ்வசனத்தில் உருபுடன் வரும் Χριστός-இன் பட்டப்பொருளைச் சரியாகக் காட்டுகிறது. மாற்றாக வழக்கிலுள்ள ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘போட்டி மனப்பான்மை’ சூழலுக்குரிய ἔρις-இன் போட்டி/எதிர்ப்புணர்வை நன்றாக வெளிப்படுத்துகிறது.
