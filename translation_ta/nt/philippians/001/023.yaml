    reason: alternative_rendering
  revision_rationale: The revision preserves the Greek ambiguity of ἀναλῦσαι (‘to depart’) and does not introduce a doctrinal timeline or location for postmortem fellowship. It replaces an obligation-prone Tamil expression with a straightforward expression of desire, improves the idiom for Paul’s tension, and renders the intensified comparative as ‘far superior.’ Footnote markers remain attached to the corresponding translated expressions.
