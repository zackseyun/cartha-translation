source:
  edition: SBLGNT
  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: ta
  text: ஆனால் இந்த இரண்டிற்கும் இடையில் நான் திணறுகிறேன்; புறப்பட்டு[a] மேசியாவுடன்[b] இருக்க எனக்கு ஏக்கம் உள்ளது; ஏனெனில் அது மிகவும் மேலானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ‘இறந்து.’ சொல்லுக்குச் சொல்: ‘புறப்பட.’'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, ‘கிறிஸ்துவுடன்.’ கிரேக்கத்தில்: ‘மேசியாவுடன்.’'
    reason: alternative_rendering
lexical_decisions:
- source_word: συνέχομαι
  choice: நான் நெருக்கப்படுகிறேன்
  rationale: இரு பக்கங்களிலிருந்தும் அழுத்தப்பட்டு, அவற்றுக்கிடையில் கட்டுப்பட்டிருக்கும் நிலையை இந்தச் சொல் காட்டுகிறது. ‘நெருக்கப்படுகிறேன்’ என்பது அந்த அழுத்தத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐκ τῶν δύο
  choice: இந்த இரண்டிற்கும் இடையில்
  rationale: சொல்லுக்குச் சொல் ‘இந்த இரண்டிலிருந்து’ என்றாலும், சூழலில் இரண்டு மாற்று வாய்ப்புகளுக்கு இடையில் அழுத்தப்படுவதைக் குறிக்கிறது.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: வேண்டும் என்ற ஏக்கம் எனக்கு இருக்கிறது
  rationale: ἐπιθυμία என்ற பெயர்ச்சொல்லின் வலுவான விருப்பத்தை ‘ஏக்கம்’ காக்கிறது; பங்கேற்புவினைத் தொடரும் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: ἀναλῦσαι
  choice: புறப்பட்டு
  rationale: அடிப்படை உருவகமான ‘புறப்படுதல்’ என்பதைக் காத்து, அதை நேரடியாக ‘இறத்தல்’ என்று விரிவுபடுத்தாமல் விடுகிறது; சூழலில் இது இறப்பைக் குறிக்கும் மென்மையான வழக்காகும்.
- source_word: Χριστῷ
  choice: மேசியாவுடன்
  rationale: Χριστός இங்கு பட்டப்பெயர் சார்ந்த பொருளைக் கொண்டிருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது; உடனிருப்பை -உடன் என்ற உருபு தெளிவாகக் காட்டுகிறது.
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: ஏனெனில் அதுவே மிக மிகச் சிறந்தது
  rationale: பலப்படுத்தப்பட்ட ஒப்பீட்டின் வலிமையை ‘மிக மிக’ இயல்பாக வெளிப்படுத்துகிறது; ‘அதுவே’ பவுல் விரும்பிய புறப்பட்டு மேசியாவுடன் இருக்கும் நிலையைச் சுட்டுகிறது.
theological_decisions:
- issue: இறப்புக்குப் பிந்தைய மேசியாவுடனான உறவின் உட்குறிப்பு
  choice: புறப்பட்டு மேசியாவுடன் இருக்க வேண்டும்
  alternative: இறந்து உடனடியாகப் பரலோகத்திற்குச் சென்று மேசியாவுடன் இருக்க வேண்டும்
  rationale: கிரேக்க உரை வெளிப்படையாகச் சொல்வது புறப்படுதலையும் மேசியாவுடன் இருப்பதையும் மட்டுமே. காலவரிசை அல்லது ‘பரலோகம்’ பற்றிய கூடுதல் கோட்பாட்டுச் சொற்களை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருள்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός என்பதை அதன் அபிஷேகம் பெற்ற அரசர்/விடுவிப்பவர் என்ற பட்டப்பெயர் பொருளோடு ‘மேசியா’ என வழங்குகிறது; பரவலாக அறியப்பட்ட மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘நெருக்கப்படுகிறேன்’ என்பது உள்ளார்ந்த அழுத்தத்தை வெளிப்படுத்துகிறது; ‘புறப்பட்டு’ என்ற உருவகம் திட்டமிட்டு காக்கப்பட்டுள்ளது. இறப்புக்குப் பிந்தைய நிலையின் காலவரிசையை உரை கூறுவதைக் கடந்துச் செல்லாமல் வைத்திருக்கிறது.
