source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: ta
  text: அப்படியானால் என்ன? எவ்வகையிலாயினும், பாசாங்காகவோ உண்மையாகவோ, மெசியா[a] அறிவிக்கப்படுகிறார் என்பதுதான் முக்கியம்; அதில் நான் மகிழ்கிறேன். ஆம், மேலும் மகிழ்வேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆனால் நானும் மகிழ்வேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: அதனால் என்ன?
  rationale: பவுலின் சுருக்கமான வினாவையும், முந்தைய கருத்திலிருந்து அவர் எடுக்கும் முடிவுக்கான திருப்பத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πλὴν ὅτι
  choice: எப்படியாயினும்
  rationale: அறிவிப்போரின் நோக்கம் எதுவாக இருந்தாலும் முக்கியமானது மெசியா அறிவிக்கப்படுவதே என்ற கட்டுப்படுத்தும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παντὶ τρόπῳ
  choice: எல்லா விதத்திலும்
  rationale: கிரேக்கச் சொற்றொடரின் ‘ஒவ்வொரு முறையிலும்/எந்த விதத்திலானாலும்’ என்ற பரந்த பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: προφάσει
  choice: பாசாங்காக
  rationale: உண்மையற்ற வெளிப்பாட்டையோ நோக்கத்தையோ குறிக்கிறது; அதற்கு அப்பாற்பட்ட விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
- source_word: ἀληθείᾳ
  choice: உண்மையாக
  rationale: προφάσει என்பதற்கு எதிரான சுருக்கமான இணைச்சொல்லாக இருந்து, கிரேக்க முரண்பாட்டைக் காக்கிறது.
- source_word: Χριστὸς
  choice: மெசியா
  rationale: இங்கு அறிவிக்கப்படும் பட்டமாக Χριστός செயல்படுவதால், அதன் அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப் பொருளை ‘மெசியா’ காக்கிறது.
- source_word: καταγγέλλεται
  choice: அறிவிக்கப்படுகிறார்
  rationale: வினையின் செயப்பாட்டு வடிவத்தையும் பொதுவாக அறிவித்தல் என்ற கருத்தையும் காக்கிறது; நிகழ்காலம் தொடரும் செயலைச் சூழலில் உணர்த்துகிறது.
- source_word: ἐν τούτῳ
  choice: அதில்
  rationale: மெசியா அறிவிக்கப்படுகிறார் என்ற முந்தைய உண்மையோடு பவுலின் மகிழ்ச்சியை நேரடியாக இணைக்கிறது.
- source_word: χαίρω
  choice: நான் மகிழ்கிறேன்
  rationale: வெறும் மனநிறைவை விட கிரேக்க வினையின் மகிழ்ச்சி சார்ந்த வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: ஆம், இனியும் மகிழ்வேன்
  rationale: ἀλλά καί என்பதன் வலியுறுத்தலையும் எதிர்கால χαρήσομαι என்பதையும் இயல்பாக வெளிப்படுத்துகிறது; ‘இனியும்’ தற்போதைய மகிழ்ச்சி எதிர்காலத்திலும் தொடர்வதைச் சுட்டுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இந்த இடத்தில் Χριστός பெயரைப் போல அல்லாமல் அறிவிக்கப்படும் பட்டமாகச் செயல்படுகிறது. ஆகவே பட்டத்தின் பொருளை வெளிப்படுத்தும் ‘மெசியா’ முதன்மை உரையில் வைக்கப்பட்டது; வழக்கமான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாசாங்காகவோ உண்மையாகவோ’ என்ற இணை அமைப்பு மூலத்தின் திட்டமிட்ட முரண்பாட்டைக் காக்கிறது. வசனத்தின் இறுதியில் உள்ள எதிர்கால மகிழ்ச்சி தனி வாக்கியமாக வைக்கப்பட்டு அதன் வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
