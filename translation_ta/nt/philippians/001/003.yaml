  source_fidelity: மூலத்தின் Εὐχαριστῶ என்ற நிகழ்கால முதலாம் நபர் வினை ‘நன்றி செலுத்துகிறேன்’ எனத் துல்லியமாகத் தரப்பட்டுள்ளது. τῷ θεῷ μου-வின் உடைமைப் பொருளும், நன்றியைச் செலுத்தும் பெறுநரும் ‘என் கடவுளுக்கு’ என்பதில் பாதுகாக்கப்படுகின்றன. ἐπὶ πάσῃ τῇ μνείᾳ ὑμῶν-ஐ ‘உங்களை நினைக்கும்போதெல்லாம்’ என்பது இயல்பான கால/சந்தர்ப்பத் தமிழில் வழங்கி, ஒவ்வொரு நினைவுகூர்தலின் பகிர்வுப் பொருளைத் தக்கவைக்கிறது.
  naturalness: ‘உங்களை நினைக்கும்போதெல்லாம் என் கடவுளுக்கு நன்றி செலுத்துகிறேன்’ என்பது நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான, வாசிக்க இயல்பான வாக்கியம்.
