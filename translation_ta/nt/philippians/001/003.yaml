  yaml_path: translation/nt/philippians/001/003.yaml
  text: I thank my God at every remembrance of you,[a]
translation:
  language: ta
  text: உங்களை நினைக்கும்போதெல்லாம் என் கடவுளுக்கு நன்றி செலுத்துகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களைப் பற்றிய ஒவ்வொரு நினைவுக்காகவும் என் கடவுளுக்கு நன்றி செலுத்துகிறேன்.’
    reason: ἐπὶ πάσῃ τῇ μνείᾳ என்பதைக் காலச் சந்தர்ப்பமாகவோ நன்றிக்கான காரணமாகவோ புரிந்துகொள்ள முடியும்; மாற்று மொழிபெயர்ப்பு அதன் பெயர்ச்சொல் அமைப்பையும் ‘காக’ என்ற பொருளையும் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: நன்றி செலுத்துகிறேன்
  rationale: நிகழ்காலச் செயப்பாட்டு வினையின் முதலாம் நபர் ஒருமையைத் தக்கவைத்து, நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் நன்றியறிவித்தலை வெளிப்படுத்துகிறது.
- source_word: τῷ θεῷ μου
  choice: என் கடவுளுக்கு
  rationale: εὐχαριστέω என்பதுடன் வரும் கொடைவேற்றுமையைத் தமிழில் இயல்பான ‘என் கடவுளுக்கு’ என்று வழங்குகிறது; உடைமைப் பொருளும் தக்கவைக்கப்படுகிறது.
- source_word: ἐπὶ πάσῃ τῇ μνείᾳ
  choice: நினைக்கும்போதெல்லாம்
  rationale: ἐπὶ என்பதன் சந்தர்ப்பப் பொருளையும் πάσῃ என்பதன் ஒவ்வொரு முறை என்ற பகிர்வுப் பொருளையும் இயல்பான தமிழில் இணைக்கிறது. μνεία என்ற பெயர்ச்சொல் வினை வடிவில் வழங்கப்பட்டாலும் நினைவுகூர்தல் என்ற அடிப்படைப் பொருள் நிலைக்கிறது.
- source_word: ὑμῶν
  choice: உங்களை
  rationale: இரண்டாம் நபர் பன்மை உடையவர்களை நினைவுகூர்வதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்; ‘அனைவரையும்’ என்பதை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
