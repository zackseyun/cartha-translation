translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. ‘நினைக்கும்போதெல்லாம்’ என்பது சொற்சொற் கட்டமைப்பை விட இயல்பான தமிழை முன்னிறுத்தினாலும், கிரேக்கத்தின் தொடர்ச்சியான ஒவ்வொரு நினைவுச் சந்தர்ப்பத்தையும் தக்கவைக்கிறது; உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
