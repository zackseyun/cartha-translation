  text: πάντοτε ἐν πάσῃ δεήσει μου ὑπὲρ πάντων ὑμῶν, μετὰ χαρᾶς τὴν δέησιν ποιούμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/004.yaml
  text: always in every prayer of mine for all of you, praying with joy,
translation:
  language: ta
  text: உங்கள் அனைவருக்காகவும் நான் செய்யும் ஒவ்வொரு வேண்டுதலிலும் எப்போதும் மகிழ்ச்சியோடு வேண்டிக்கொள்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: காலத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: ἐν πάσῃ δεήσει μου
  choice: நான் செய்யும் ஒவ்வொரு வேண்டுதலிலும்
  rationale: πᾶς என்பதன் ‘ஒவ்வொரு’ என்ற விரிவையும், δέησις என்பதன் குறிப்பான மன்றாட்டு/வேண்டுதல் பொருளையும் காக்கிறது.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: உங்கள் அனைவருக்காகவும்
  rationale: ὑπέρ இங்கு நலனுக்காக அல்லது சார்பாகச் செய்யப்படும் வேண்டுதலைக் குறிக்கிறது; πάντων என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: μετὰ χαρᾶς
  choice: மகிழ்ச்சியோடு
  rationale: ‘மகிழ்ச்சியுடன்’ என்ற மூலப் பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: τὴν δέησιν ποιούμενος
  choice: வேண்டிக்கொள்கிறேன்
  rationale: சொல்லுக்கு சொல் ‘வேண்டுதலைச் செய்துகொண்டு’ என்பது தமிழில் செயற்கையாக இருக்கும்; நிகழ்காலப் பங்கேற்புச் சொல்லை வாக்கியத்தின் இலக்கணத் தேவைக்கேற்ப முதன்மை வினையாக இயல்பாக்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், ஜெபச் சூழலுக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. இந்தத் துணைவாக்கியம் அடுத்த வசனத்துடன் தொடரும் கிரேக்க வாக்கியத்தின் ஒரு பகுதி என்றாலும், கொடுக்கப்பட்ட வசன எல்லைக்குள் தமிழில் முழுமையான வாக்கியமாக வாசிக்கும்படி வடிவமைக்கப்பட்டது.
