source:
  edition: SBLGNT
  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: ta
  text: நான் மீண்டும் உங்களிடம் வருவதன் மூலம், என்னை முன்னிட்டு[b] மேசியாவாகிய இயேசுவில்[c] நீங்கள் கொள்ளும் பெருமிதம்[a] மேலும் பெருகும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீங்கள் கொள்ளும் பெருமிதம்’ என்பதற்கு ‘நீங்கள் பெருமிதம் கொள்வதற்கான காரணம்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘என்னை முன்னிட்டு’ என்பது சொல்லுக்குச் சொல் ‘என்னில்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘மேசியாவாகிய இயேசு’ என்பதை ‘கிறிஸ்து இயேசு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘மேசியாவாகிய இயேசுவில்’ மற்றும் ‘என்னை முன்னிட்டு’ என்ற சொற்றொடர்களின் தொடர்பை வேறுவிதமாகவும் புரிந்துகொள்ளலாம்.
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: …படி
  rationale: முந்தைய கூற்றிலிருந்து தொடரும் நோக்கம் அல்லது விளைவை உணர்த்தும் சார்பு வாக்கிய அமைப்பைத் தக்கவைக்கிறது.
- source_word: τὸ καύχημα ὑμῶν
  choice: நீங்கள் கொள்ளும் பெருமிதம்
  rationale: καύχημα என்பது பெருமிதம் கொள்ளும் செயலை மட்டுமல்ல, அதற்கான காரணம் அல்லது அடிப்படையையும் குறிக்கலாம். ‘பெருமிதம்’ என்ற சொல் அந்த அர்த்த விரிவை ஓரளவு திறந்தே வைக்கிறது.
- source_word: περισσεύῃ
  choice: இன்னும் பெருகும்படி
  rationale: அளவு மிகுதல் அல்லது அதிகரித்தலைக் குறிக்கும் வினையின் கருத்தையும், ἵνα-வுக்குப் பின் வரும் நோக்கம்/விளைவு சார்ந்த வினைநிலையையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவில்
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைக்கும் வகையில் ‘மேசியா’ என வழங்கப்படுகிறது; ἐν என்பதையும் ‘இயேசுவில்’ என்று நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐν ἐμοὶ
  choice: என்னைக் குறித்து
  rationale: சொல்லுக்குச் சொல் ‘என்னில்’ என்றாலும், இங்கு பவுல் அவர்களின் பெருமிதத்திற்கான காரணம் அல்லது தொடர்புப் பொருளாக இருப்பதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς
  choice: நான் மீண்டும் உங்களிடம் வந்து உங்களோடு இருப்பதன் மூலம்
  rationale: παρουσία என்பதில் வருகையும் அதன் விளைவான உடனிருப்பும் இணைந்துள்ளன. தமிழில் இரண்டையும் வெளிப்படுத்துவது இச்சூழலின் பொருளை தெளிவாகக் கடத்துகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός என்பதை வெறும் மரபுவழிப் பெயர்வடிவமாக அல்லாமல் ‘அபிஷேகம் பெற்றவர்/மேசியா’ என்ற பட்டப்பெயராக வாசிக்க இடமளிக்கிறது; அதேவேளை அடிக்குறிப்பில் பரவலான மாற்று வடிவம் தரப்படுகிறது.
- issue: பெருமிதத்தின் தொடர்பு
  choice: மேசியாவாகிய இயேசுவில் நீங்கள் கொள்ளும் பெருமிதம்; பவுலைக் குறித்து அது பெருகுதல்
  alternative: பவுலில் கொள்ளும் பெருமிதம் மேசியாவாகிய இயேசுவில் பெருகுதல்
  rationale: கிரேக்கத்தில் தொடர்ச்சியாக வரும் இரண்டு ἐν சொற்றொடர்களின் தொடர்பில் ஓரளவு தெளிவின்மை உள்ளது. முதன்மை உரை வழக்கமான பவுலிய ‘மேசியாவில் பெருமிதம்’ என்ற தொடர்பை முன்வைக்கிறது; மாற்று அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ἵνα காரணமாக வசனம் முந்தைய வசனத்தைச் சார்ந்த நோக்க வாக்கியமாக முடிவதைக் காட்ட ‘…படி’ என்ற முடிவு திட்டமிட்டு வைக்கப்பட்டுள்ளது. ‘பெருமிதம்’ எதிர்மறையான அகந்தை என்று கட்டாயப்படுத்தாமல், மகிழ்ச்சியோடு மேன்மை பாராட்டும் கருத்தையும் ஏற்கும் வகையில் பயன்படுத்தப்பட்டுள்ளது.
