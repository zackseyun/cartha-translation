reference: Philippians 1:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον ἀπὸ ⸀τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/005.yaml
  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: ta
  text: முதல் நாளிலிருந்து இன்றுவரை நற்செய்தியில் உங்கள் பங்கேற்பின் காரணமாக,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நற்செய்திக்காக.” கிரேக்கத் தொடர், அவர்களுடைய கூட்டுப் பங்கேற்பு நிகழும் தளத்தையோ அல்லது அதன் இலக்கு/நோக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: நீங்கள் பங்காளிகளாய் இருப்பதற்காக
  rationale: ἐπί + தரவு வேற்றுமை இங்கு சுற்றியுள்ள வாக்கியத்தில் பவுலின் நன்றிக்கான காரணத்தைக் காட்டுகிறது. κοινωνία வெறும் நட்புறவை அல்ல, செயலில் வெளிப்படும் பகிர்ந்த பங்கேற்பைக் குறிக்கிறது; ஆகவே இயல்பான தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: நற்செய்தியில்
  rationale: εἰς இங்கு அவர்களுடைய கூட்டுப் பங்கேற்பின் தளத்தையோ நோக்கத்தையோ குறிக்கலாம். முதன்மை உரையில் ‘நற்செய்தியில்’ என்பது அந்தத் தொடர்பைச் சுருக்கமாகப் பாதுகாக்கிறது; நோக்கப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εὐαγγέλιον
  choice: நற்செய்தி
  rationale: பவுலின் பயன்பாட்டில் கடவுளுடைய மீட்புச் செய்தியைக் குறிக்கும் நிலைபெற்ற, இயல்பான தமிழ் சொல்.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν
  choice: முதல் நாளிலிருந்து இன்றுவரை
  rationale: பங்கேற்பு தொடங்கிய காலத்தையும் அது பவுலின் தற்போதைய நேரம் வரை தொடர்ந்ததையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: εἰς τὸ εὐαγγέλιον என்பதன் தளம் அல்லது நோக்கம்
  choice: நற்செய்தியில்
  alternative: நற்செய்திக்காக
  rationale: கிரேக்கத் தொடர் பகிர்ந்த பங்கேற்பின் தளத்தையும் அதன் நோக்கத்தையும் குறிக்கக்கூடும். முதன்மை உரையில் ஒன்றைத் தேர்ந்தெடுத்தாலும், உண்மையான பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. இது முழு வாக்கியத்தின் ஒரு பகுதியாக இருப்பதால், அடுத்த வசனத்துடன் தொடர்வதைக் காட்ட இறுதியில் முற்றுப்புள்ளி வைக்கப்படவில்லை.
