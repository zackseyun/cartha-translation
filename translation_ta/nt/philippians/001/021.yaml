language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: ta
  text: ஏனெனில் எனக்கு வாழ்வது கிறிஸ்து[a]; இறப்பது ஆதாயம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியா.”
    reason: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த மாற்று மொழிபெயர்ப்பைச் சுட்டிக்காட்டுகிறது.
lexical_decisions:
- source_word: ἐμοὶ
  choice: எனக்கு
  rationale: தனிப்பட்ட நோக்கைக் காட்டும் வேற்றுமை வடிவத்தைத் தமிழில் இயல்பாகவும் நேரடியாகவும் எடுத்துரைக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: τὸ ζῆν
  choice: வாழ்வது
  rationale: பெயர்ச்சொல் போலச் செயல்படும் வினையெச்சப் பொருளை இயல்பான தமிழில் தருவதோடு, ‘இறப்பது’ என்பதுடனான இணை அமைப்பையும் காக்கிறது.
- source_word: Χριστὸς
  choice: கிறிஸ்து
  rationale: பவுலின் சுருக்கமான கூற்றில் பட்டமாகவும் பெயர் போன்ற பயன்பாடாகவும் புரிந்துகொள்ளக்கூடிய வழக்கமான தமிழ் வடிவம்.
- source_word: τὸ ἀποθανεῖν
  choice: இறப்பது
  rationale: மூலத்தின் பெயர்ச்சொல் சார்ந்த வினை வடிவத்தையும் ‘வாழ்வது’ என்பதுடனான சமச்சீர் அமைப்பையும் காக்கிறது.
- source_word: κέρδος
  choice: ஆதாயம்
  rationale: இங்கு குறிக்கப்படும் நன்மை அல்லது பயனை கண்ணியமான, இயல்பான தமிழில் எடுத்துரைக்கிறது; வெறும் வணிக இலாபமாகப் பொருளைச் சுருக்குவதில்லை.
theological_decisions:
- issue: Χριστός என்பதன் பட்டப்பெயர் மற்றும் பெயர் போன்ற பயன்பாட்டுக்கிடையிலான நுட்பம்
  choice: கிறிஸ்து
  alternative: மேசியா
  rationale: இவ்வசனத்தில் Χριστός பெயர் போன்ற வகையில் இயல்பாகச் செயல்படுகிறது; ‘கிறிஸ்து’ அந்த வழக்கைப் பாதுகாக்கிறது. ‘மேசியா’ என்ற மாற்று இங்கு கட்டாயப்படுத்த வேண்டிய தனிப் பொருள் வேறுபாட்டை உருவாக்கக்கூடும்.
translation_notes:
  register: சுருக்கமான மூல வாக்கியத்தின் சமச்சீர் அமைப்பையும் ஆழமான தனிப்பட்ட வலியுறுத்தலையும் காக்கும் நவீன, கண்ணியமான பொதுத்தமிழ். ‘எனக்கு வாழ்வது கிறிஸ்து’ என்ற செறிவான அடையாளக் கூற்று விளக்கிச் சிதைக்கப்படாமல் விடப்பட்டுள்ளது.
