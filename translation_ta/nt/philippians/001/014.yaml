reference: Philippians 1:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: ta
  text: 'சகோதரர்களில் பெரும்பாலானோர்[a], என் சங்கிலிகளின் காரணமாக ஆண்டவருக்குள் உறுதிபெற்று, அச்சமின்றி வார்த்தையைப் பேச இன்னும் அதிகமாகத் துணிகிறார்கள்.


    [a] “சகோதரர்களும் சகோதரிகளும்” என்றும் பொருள்படலாம்; இங்கு இச்சொல் சக விசுவாசிகளையும் பொதுவாகக் குறிப்பதாகத் தெரிகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களும் சகோதரிகளும்” என்றும் பொருள்படலாம்; இங்கு இச்சொல் சக விசுவாசிகளையும் பொதுவாகக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονας
  choice: பெரும்பாலானோர்
  rationale: திட்டமான சுட்டுச்சொல்லும் பகுதிப்பொருள் வேற்றுமையும் சேர்ந்துள்ளதால், வெறுமனே ‘அதிகமானோர்’ என்பதற்குப் பதிலாக ‘பெரும்பாலானோர்’ அல்லது ‘பெரும்பான்மையினர்’ என்ற பொருள் வருகிறது; இயல்பான தமிழுக்காக ‘பெரும்பாலானோர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀδελφῶν
  choice: சகோதரர்கள்
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மை. அதன் வடிவத்தை முதன்மை உரையில் காத்து, இங்கு உடன் விசுவாசிகளான பெண்களும் உட்படக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் வழக்கமான சொற்றொடரின் பரப்பையும் உறவுசார் நுணுக்கத்தையும் நேரடியாகக் காக்கிறது; இது ‘உறுதிபெற்று’ என்பதோடு இணைகிறது.
- source_word: πεποιθότας
  choice: உறுதிபெற்று
  rationale: நிகழ்ந்து முடிந்த ஒன்றின் விளைவாகத் தொடர்ந்து நிலவும் உறுதியை கிரேக்க நிறைவு வினையெச்சம் காட்டுகிறது; ‘உறுதிபெற்று’ என்பது அந்த மாற்றத்தையும் தற்போதைய நிலைப்பாட்டையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: τοῖς δεσμοῖς μου
  choice: என் சங்கிலிகளின் காரணமாக
  rationale: δεσμοί என்பதன் கண்முன் நிற்கும் ‘சங்கிலிகள்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; சூழலில் அவை பவுலின் சிறையிருப்பைக் குறிக்கின்றன. ‘காரணமாக’ என்பது இங்குள்ள காரணப் பொருளைத் தெளிவாக்குகிறது.
- source_word: περισσοτέρως
  choice: இன்னும் அதிகமாக
  rationale: ஒப்பீட்டு வினையடையின் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τολμᾶν
  choice: துணிகிறார்கள்
  rationale: அபாயத்தை எதிர்கொண்டு ஒரு செயலைச் செய்யும் துணிவான தீர்மானத்தைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: ἀφόβως
  choice: அச்சமின்றி
  rationale: பொதுவான ‘துணிவுடன்’ என்பதைவிட, பயம் இல்லாமையை மூலச்சொல்லுக்கு நெருக்கமாகக் காட்டுகிறது.
- source_word: τὸν λόγον
  choice: வார்த்தையை
  rationale: இங்கு நற்செய்திச் செய்தி கருத்தில் இருந்தாலும், கிரேக்க உரையில் இல்லாத ‘தேவனுடைய’ என்பதைச் சேர்க்காமல் τὸν λόγον என்பதன் திட்டமிட்ட சுருக்கத்தைப் பாதுகாக்கிறது.
- source_word: λαλεῖν
  choice: பேச
  rationale: λαλεῖν என்பது பொதுவாகப் பேசுதலைக் குறிக்கும்; ‘அறிவிக்க’ அல்லது ‘பிரசங்கிக்க’ என்பது மூலத்தைவிட வலுவான கருத்தைச் சேர்க்கக்கூடும்.
theological_decisions:
- issue: ἀδελφοί என்பதன் குறிப்பு எல்லை
  choice: முதன்மை உரையில் ‘சகோதரர்கள்’ என்று மொழிபெயர்த்து, பெண்கள் உட்பட்ட உடன் விசுவாசிகள் பொதுவாகக் குறிக்கப்படக்கூடும் என்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘சகோதர சகோதரிகள்’ அல்லது ‘உடன் விசுவாசிகள்’
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை உரையில் காக்கும் அதேவேளையில், சூழலில் கலப்புப் பாலின விசுவாசக் குழுவைக் குறிக்கும் சாத்தியத்தை மறைக்காமல் அடிக்குறிப்பு பதிவு செய்கிறது.
- issue: ἐν κυρίῳ என்பதன் தொடர்பு
  choice: ‘உறுதிபெற்று’ என்பதோடு இணைத்து ‘ஆண்டவருக்குள் உறுதிபெற்று’ என மொழிபெயர்த்தல்
  alternative: ‘ஆண்டவரால் உறுதிபெற்று’ அல்லது சங்கிலிகளோடு இணைத்துப் புரிதல்
  rationale: சொல் வரிசையும் பவுலின் வழக்கமான பயன்பாடும் ‘ஆண்டவருக்குள்’ என்பதை நம்பிக்கை அல்லது உறுதியின் பரப்பாகப் புரிந்துகொள்வதற்கு ஆதரவளிக்கின்றன; அதனை நேரடியாக வைத்ததால் காரணகர்த்தா என்ற கூடுதல் விளக்கம் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘சங்கிலிகள்’ என்ற கண்கூடான படிமம் காக்கப்பட்டது; ‘வார்த்தை’ என்ற சுருக்கமும் மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
