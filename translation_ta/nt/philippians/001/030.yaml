translation:
  language: ta
  text: நீங்கள் என்னில் கண்டதும், இப்போது என்னைப் பற்றி கேள்விப்படுவதுமான அதே போராட்டத்தை எதிர்கொள்கிறீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: போராட்டம்
  rationale: போட்டி, மோதல், துன்பத்தின் மத்தியில் மேற்கொள்ளும் கடும் முயற்சி ஆகியவற்றை உள்ளடக்கும் சொல்லின் பரந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔχοντες
  choice: ஈடுபட்டிருக்கிறீர்கள்
  rationale: தமிழில் ‘போராட்டத்தைக் கொண்டிருக்கிறீர்கள்’ என்பது இயல்பற்றதால், அதே போராட்டத்தில் பங்கேற்றிருக்கும் தொடர்நிலையை வெளிப்படுத்துகிறது.
- source_word: ἐν ἐμοί
  choice: என்னிடம் / எனக்கு இருப்பதாக
  rationale: இரு இடங்களிலும் பவுலின் சொந்த அனுபவத்தைக் குறிக்கிறது; முதல் இடத்தில் நேரில் கண்டதையும் இரண்டாவது இடத்தில் தற்போது கேள்விப்படுவதையும் இயல்பான தமிழில் வேறுபடுத்திக் கூறுகிறது.
theological_decisions:
- issue: பவுலின் போராட்டம் இப்போதும் தொடர்கிறதா?
  choice: இப்போதும் எனக்கு இருப்பதாக
  alternative: இப்போது என்னில் கேள்விப்படுகிற
  rationale: νῦν ἀκούετε ἐν ἐμοί என்பதன் சொற்பொருள் சுருக்கத்தைத் தமிழில் தெளிவுபடுத்தி, அவர்கள் தற்போது பவுலைப் பற்றிக் கேள்விப்படும் போராட்டம் அவரிடம் தொடர்கிறது என்பதை வெளிப்படுத்துகிறது; போராட்டத்தின் தன்மையை மேலதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. இது முந்தைய வசனத்தைத் தொடரும் பங்கேற்பு வினையெச்சக் கட்டமைப்பு என்பதால், தமிழில் முழு வாக்கியமாக இயல்பாக்கப்பட்டுள்ளது.
