  naturalness: «இதை உறுதியாக நம்புகிற நான்» என்பதற்குப் பதிலாக «இதில் உறுதியாய் இருப்பதால்» நவீன நிலையான தமிழில் இயல்பாகவும், perfect participle-இன் நிலைபெற்ற உறுதியையும் தக்கவைத்தும் உள்ளது. இரண்டு வினைகளையும் «தங்கியிருப்பேன் என்றும் ... தொடர்ந்து இருப்பேன் என்றும்» என அமைப்பது தெளிவானது.
