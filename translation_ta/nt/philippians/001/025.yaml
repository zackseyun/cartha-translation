source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: ta
  text: இதில் உறுதியாய் இருப்பதால், நான் தங்கியிருப்பேன் என்றும் உங்கள் அனைவருடனும் தொடர்ந்து இருப்பேன் என்றும் அறிவேன்; அது உங்கள் முன்னேற்றத்திற்கும் விசுவாசத்தின் மகிழ்ச்சிக்கும்[a] உதவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசத்தில் உள்ள மகிழ்ச்சிக்கும்” அல்லது “விசுவாசத்தினால் வரும் மகிழ்ச்சிக்கும்.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεποιθὼς
  choice: உறுதியாக நம்புகிற
  rationale: Perfect participle குறிக்கும் நிலைபெற்ற நம்பிக்கையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: μενῶ
  choice: நிலைத்திருந்து
  rationale: μένω என்பதன் ‘தங்கியிரு/நிலைத்திரு’ என்ற பொருளைப் பாதுகாத்து, அடுத்து வரும் கூட்டு வினையிலிருந்து வேறுபடுத்துகிறது.
- source_word: παραμενῶ
  choice: தொடர்ந்து இருப்பேன்
  rationale: வெறுமனே உயிரோடிருப்பதைவிட, அவர்களோடு தொடர்ந்து இருப்பதைக் குறிக்கும் கூட்டு வினையின் நுட்பத்தைத் தருகிறது.
- source_word: πᾶσιν ὑμῖν
  choice: உங்கள் அனைவரோடும்
  rationale: πᾶσιν என்பதை வெளிப்படையாகவும், dative-இன் உறவுசார் பொருளை ‘-ஓடும்’ என்பதாலும் காட்டுகிறது.
- source_word: προκοπὴν
  choice: முன்னேற்றம்
  rationale: முன்னோக்கிச் செல்லுதல் அல்லது வளர்ச்சி என்ற பொருளை தெளிவான பொதுத் தமிழில் தருகிறது.
- source_word: χαρὰν τῆς πίστεως
  choice: விசுவாசத்தின் ... மகிழ்ச்சி
  rationale: Genitive உறவை காரணவியல் விளக்கமாகச் சுருக்காமல், மூலத்தின் இலக்கணத் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இச்சூழலில் நம்பிக்கையுள்ள கிறிஸ்தவ வாழ்வைக் குறிக்கும் வழக்கமான, பொருத்தமான தமிழ்ச் சொல்.
theological_decisions:
- issue: χαρὰν τῆς πίστεως என்பதில் genitive-இன் பொருள்
  choice: விசுவாசத்தின் மகிழ்ச்சி
  alternative: விசுவாசத்தில் உண்டாகும் மகிழ்ச்சி / விசுவாசத்தினால் வரும் மகிழ்ச்சி
  rationale: மூலத் தொடர் உடைமை, தொடர்பு, அல்லது காரணம் போன்ற நுட்பங்களுக்கு இடமளிக்கிறது. முதன்மை உரை முறையாக நெருக்கமான அமைப்பை வைத்திருக்கிறது; இயல்பான மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இணையான இரண்டு கிரேக்க வினைகளின் வேறுபாட்டைக் காட்ட ‘நிலைத்திருந்து தொடர்ந்து இருப்பேன்’ பயன்படுத்தப்பட்டுள்ளது.
