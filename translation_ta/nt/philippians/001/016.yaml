  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: ta
  text: இவர்களோ அன்பினால் அப்படிச் செய்கிறார்கள்; நற்செய்திக்காக வாதாடுவதற்கு நான் நியமிக்கப்பட்டிருக்கிறேன் என்பதை அறிந்துகொண்டு செய்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ μὲν
  choice: இவர்களோ அப்படிச் செய்கிறார்கள்
  rationale: அடுத்த வசனத்தில் வரும் οἱ δέ என்பதுடன் உள்ள மாறுபாட்டை ‘இவர்களோ’ காட்டுகிறது. கிரேக்கத்தில் விடப்பட்டுள்ள செயல், முந்தைய சூழலிலிருந்து இயல்பாக நிரப்பப்பட்டு ‘அப்படிச் செய்கிறார்கள்’ எனத் தரப்பட்டுள்ளது.
- source_word: ἐξ ἀγάπης
  choice: அன்பினால்
  rationale: ἐξ என்பது இங்கு செயலின் நோக்குவிசையைச் சுட்டுகிறது; ‘அன்பினால்’ என்பது இதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: εἰδότες
  choice: அறிந்திருக்கிறார்கள்
  rationale: இந்தப் பங்கேற்புவினை அவர்களுடைய செயலுக்கான அறிவுசார் அடிப்படையைத் தருகிறது. தமிழில் தனி வினைமுற்றாக அமைப்பது கருத்துறவைத் தெளிவாகவும் இயல்பாகவும் வைத்திருக்கிறது.
- source_word: εἰς ἀπολογίαν
  choice: பாதுகாத்துப் பேசுவதற்காக
  rationale: ἀπολογία என்பது குற்றச்சாட்டுக்குப் பதிலளிக்கும் அல்லது காரணங்களுடன் ஆதரித்துப் பேசும் பாதுகாப்பைக் குறிக்கிறது. ‘பாதுகாத்துப் பேசுதல்’ அதன் சட்ட/வாதத் தன்மையை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: τοῦ εὐαγγελίου
  choice: நற்செய்தியை
  rationale: εὐαγγέλιον என்பதன் பொருளை வெளிப்படையாகவும் தமிழில் வழக்காகவும் ‘நற்செய்தி’ தெரிவிக்கிறது. ‘பாதுகாத்துப் பேசுதல்’ என்ற வினைத்தொடருடன் வேற்றுமை உருபு இயல்பாக மாற்றப்பட்டுள்ளது.
- source_word: κεῖμαι
  choice: நியமிக்கப்பட்டிருக்கிறேன்
  rationale: இங்கு κεῖμαι வெறும் உடல் இருப்பிடத்தைக் காட்டாமல் பவுலுக்கு அமைந்துள்ள பணி அல்லது நிலையைச் சுட்டுகிறது. ‘நியமிக்கப்பட்டிருக்கிறேன்’ அதன் இடப்பட்ட/ஒதுக்கப்பட்ட நிலையை இயல்பாகத் தருகிறது; சூழலில் வெளிப்படையாக இல்லாத செய்பவரைச் சேர்க்கவில்லை.
theological_decisions:
- issue: சிறைவாசச் சூழலில் κεῖμαι என்பதன் பொருள்
  choice: நியமிக்கப்பட்டிருக்கிறேன்
  alternative: இதற்காக இங்கே வைக்கப்பட்டிருக்கிறேன்
  rationale: முதன்மைத் தெரிவு பவுலின் தற்போதைய நிலைக்கு நற்செய்தியைப் பாதுகாக்கும் பணி உண்டு என்பதைத் தெரிவிக்கிறது. யார் நியமித்தார் என்பதை வெளிப்படையாகச் சொல்லாமல் இருப்பதால், மூலத்தில் உள்ள மறைமுகத்தன்மையும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீளமான பங்கேற்புவினை அமைப்பு தமிழின் இயல்புக்கேற்ப இரண்டு தொடர்புடைய கூறுகளாகத் தரப்பட்டுள்ளது. தேவையற்ற சமயக்குழுச் சொற்களும் செய்பவர் குறித்த விளக்கச் சேர்ப்புகளும் தவிர்க்கப்பட்டுள்ளன.
