id: PHP.1.11
reference: Philippians 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: ta
  text: இயேசு மேசியா[b]வின் வழியாக உண்டாகும் நீதியின்[a] கனியால் நிரம்பியவர்களாய், கடவுளுக்கு மகிமையும் புகழும் உண்டாகும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நியாயத்தின் கனி.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘இயேசு கிறிஸ்து’; இங்கே கிறிஸ்தோஸ் என்ற பட்டப்பெயர் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: நிறைந்தவர்களாகி
  rationale: நிறைவுற்ற நிலையைச் சுட்டும் perfect participle-இன் பொருளையும், முந்தைய வசனப் பகுதியுடன் தொடரும் பங்கேற்பு வடிவத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: καρπὸν
  choice: கனி
  rationale: ஒழுக்க மற்றும் ஆன்மிக விளைவைக் குறிக்கும் பவுலின் உருவகத்தை நேரடியாகக் காக்கும் வழக்கமான தமிழ் சொல்.
- source_word: δικαιοσύνης
  choice: நீதியின்
  rationale: δικαιοσύνη என்பதன் பரந்த பொருளைத் தக்கவைக்கிறது; இங்கு கனி நீதியால் வகைப்படுத்தப்படுகிறதா அல்லது நீதியே அந்தக் கனியா என்ற genitive உறவைத் திட்டவட்டமாக முடிவுசெய்யவில்லை.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா வழியாக உண்டாகும்
  rationale: Genitive உடன் வரும் διά, வழிமுறை அல்லது செயலாண்மையைக் குறிக்கிறது. ‘வழியாக உண்டாகும்’ என்பது அந்தக் கனி இயேசுவைச் சார்ந்திருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: Χριστός என்பதை வெறும் இரண்டாவது பெயராக அல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பொருளுடன் வழங்குகிறது.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: கடவுளுக்கு மகிமையும் புகழும் உண்டாகும்படி
  rationale: εἰς குறிக்கும் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘நீதியின் கனி’ என்பதன் பொருள்
  choice: இயேசு மெசியா வழியாக உண்டாகும், நீதியுடன் தொடர்புடைய ஒழுக்க/ஆன்மிகக் கனி
  alternative: நீதியே கனியாக இருப்பது; அல்லது நீதியாகக் கணக்கிடப்படும் கனி
  rationale: δικαιοσύνης என்ற genitive பலவாறு புரிந்துகொள்ளப்படலாம். ‘நீதியின் கனி’ என்ற சொற்றொடர் அந்தத் தெளிவின்மையைத் தக்கவைத்து, சூழலில் கிறிஸ்து வழியாக உருவாகும் வெளிப்படையான வாழ்வின் விளைவையும் உணர்த்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வாக்கியத்துடன் தொடரும் வசனத் துணுக்கு என்பதால் ‘நிறைந்தவர்களாகி’ என்றும், இறுதி நோக்கத்தை ‘உண்டாகும்படி’ என்றும் அமைக்கப்பட்டுள்ளது.
