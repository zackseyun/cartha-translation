revisions:
- from: இயேசு மெசியா[b] வழியாக உண்டாகும் நீதியின்[a] கனியால் நிறைந்தவர்களாகி, கடவுளுக்கு மகிமையும் புகழும் உண்டாகும்படி.
  to: இயேசு மேசியா[b]வின் வழியாக உண்டாகும் நீதியின்[a] கனியால் நிரம்பியவர்களாய், கடவுளுக்கு மகிமையும் புகழும் உண்டாகும்படி.
