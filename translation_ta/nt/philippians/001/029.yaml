revisions:
- from: ஏனெனில், மெசியாவின் பொருட்டு[a] உங்களுக்கு அருளப்பட்டிருப்பது, அவர்மேல் நம்பிக்கை வைப்பது[b] மட்டுமல்ல, அவருக்காகத்[c] துன்பப்படுவதும்கூட.
  to: ஏனெனில், மெசியாவின் பொருட்டு[a] அவர்மேல் நம்பிக்கை வைப்பதுமட்டுமல்லாமல்[b], அவருக்காகத்[c] துன்பப்படுவதும் உங்களுக்கு அருளப்பட்டிருக்கிறது.
  rationale: The revision retains every substantive element of the Greek while using a clearer Tamil clause order. ‘மெசியாவின் பொருட்டு’ remains positioned so that it can govern the full gift described by both believing and suffering, without forcing a narrower interpretation. ‘அருளப்பட்டிருக்கிறது’ retains the passive, graciously-given force without weakening the statement concerning suffering.
  reviewer_model: gpt-5.6-terra
