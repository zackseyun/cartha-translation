id: PHP.1.29
reference: Philippians 1:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: ta
  text: ஏனெனில், மெசியாவின் பொருட்டு[a] அவர்மேல் நம்பிக்கை வைப்பதுமட்டுமல்லாமல்[b], அவருக்காகத்[c] துன்பப்படுவதும் உங்களுக்கு அருளப்பட்டிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மெசியாவின் சார்பாக’ என்றும் மொழிபெயர்க்கலாம். ‘மெசியா’ என்பதற்குக் ‘கிறிஸ்து’ என்றும் கூறலாம்.
    reason: ὑπέρ என்பதன் பொருள் வரம்பையும் Χριστός என்ற பட்டத்தின் மாற்று வடிவத்தையும் காட்டுகிறது.
  - marker: b
    text: அல்லது ‘அவரை நம்புவது’.
    reason: πιστεύειν εἰς αὐτόν என்பது ஒருவர்மேல் நம்பிக்கை அல்லது விசுவாசம் வைப்பதைக் குறிக்கலாம்.
  - marker: c
    text: அல்லது ‘அவருடைய பொருட்டு’ / ‘அவருடைய சார்பாக’.
    reason: ὑπὲρ αὐτοῦ என்பதில் காரணம், நிமித்தம், சார்பு ஆகிய பொருள் நிழல்கள் உள்ளன.
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐχαρίσθη
  choice: அருளப்பட்டிருப்பது
  rationale: வெறுமனே அனுமதிக்கப்பட்டது என்பதல்லாமல், தயவாகக் கொடுக்கப்பட்ட பரிசு என்ற χαρίζομαι சொல்லின் நுணுக்கத்தைக் காக்கிறது.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: மெசியாவின் பொருட்டு
  rationale: பின்வரும் நம்பிக்கை வைத்தல், துன்பப்படுதல் ஆகிய இரண்டையும் மெசியாவுடன் தொடர்புபடுத்தும் தலைப்புத்தன்மையைத் தக்கவைக்கிறது. Χριστός இங்கு பட்டமாக இருப்பதால் ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: πιστεύειν εἰς αὐτόν
  choice: அவர்மேல் நம்பிக்கை வைப்பது
  rationale: ஒரு நபரிடம் விசுவாசமும் நம்பிக்கையும் வைப்பதைக் குறிக்கும் கிரேக்கத் தொடரைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: πάσχειν
  choice: துன்பப்படுவது
  rationale: கிரேக்க வினையின் நேரடியான பொருளை மென்மைப்படுத்தாமல் வழங்குகிறது.
- source_word: ὑπὲρ αὐτοῦ
  choice: அவருக்காக
  rationale: மெசியாவின் நிமித்தமாக அல்லது அவருடைய பொருட்டு துன்பப்படுதல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: நம்பிக்கை வைப்பதும் துன்பப்படுவதும் இரண்டுமே அருளப்பட்டவை என்று கூற வேண்டுமா
  choice: இரண்டையும் ‘அருளப்பட்டிருப்பது’ என்பதன் வரம்புக்குள் வைத்தல்
  alternative: துன்பம் வெறுமனே அனுமதிக்கப்பட்டது என மென்மைப்படுத்துதல் அல்லது நம்பிக்கை மட்டும் அருளப்பட்டது என அமைத்தல்
  rationale: கிரேக்க இலக்கணத்தில் நம்பிக்கை வைத்தலும் துன்பப்படுதலும் ஒரே ἐχαρίσθη வினையால் அருளப்பட்டவையாக முன்வைக்கப்படுகின்றன; இதிலுள்ள இறையியல் அழுத்தத்தையும் பதற்றத்தையும் மொழிபெயர்ப்பு மறைக்கக் கூடாது.
- issue: τὸ ὑπὲρ Χριστοῦ என்பதன் இலக்கண வரம்பு
  choice: ‘மெசியாவின் பொருட்டு’ என்பதை நம்பிக்கை வைத்தல் மற்றும் துன்பப்படுதல் ஆகிய இரண்டிற்கும் முன்னால் அமைத்தல்
  alternative: அதை நம்பிக்கை வைத்தலோடு மட்டும் அல்லது அருளும் செயலோடு மட்டும் இணைத்துப் புரிதல்
  rationale: கிரேக்கச் சொற்றொடர் பின்வரும் இரண்டு வினையெச்சங்களுக்கும் தலைப்பாகச் செயல்படக்கூடும்; தமிழ் அமைப்பு அந்தப் பரந்த வரம்பைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘அருளப்பட்டிருப்பது’ என்பது பரிசாக வழங்கப்பட்டதன் நுணுக்கத்தையும் அதன் தொடரும் விளைவையும் காட்டுகிறது. வாக்கிய அமைப்பு நம்பிக்கை வைத்தலும் துன்பப்படுதலும் ஒரே அருளின் கீழ் இருப்பதைத் தெளிவாகக் காக்கிறது.
