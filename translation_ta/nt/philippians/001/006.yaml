  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: ta
  text: 'இந்தக் காரியத்திலேயே எனக்கு உறுதியான நம்பிக்கை உண்டு: உங்களிடையே[a] ஒரு நல்ல செயலைத் தொடங்கியவர், மெசியா இயேசுவின் நாள்வரை[c] அதை முழுமையாக்குவார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்குள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மெசியா இயேசுவின் நாளில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: எனக்கு உறுதியான நம்பிக்கை உண்டு
  rationale: சூழலில் பவுலின் முதல் நபர் பார்வையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; வெறும் கருத்தாக அல்லாமல் உறுதியான நம்பிக்கையைக் குறிக்கிறது.
- source_word: αὐτὸ τοῦτο
  choice: இதைக் குறித்து
  rationale: கிரேக்கத் தொடரின் சுட்டுப்பொருளைத் தெளிவாக வைத்திருக்கிறது; வாக்கியத்தின் உறுதியான தொனியுடன் சேர்ந்து அதன் வலியுறுத்தலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὁ ἐναρξάμενος
  choice: தொடங்கியவர்
  rationale: செயலைத் தொடங்கிய தனிப்பட்ட செயற்பாட்டாளரைப் பாதுகாக்கிறது; அவர் கடவுள் என்பதை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: ὑμῖν என்பது பன்மை; பிலிப்பி திருச்சபைக்கான கூட்டுச் சூழலை இயல்பாக வெளிப்படுத்துகிறது. ‘உங்களுக்குள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔργον ἀγαθὸν
  choice: ஒரு நல்ல செயலை
  rationale: கிரேக்கச் சொல்லாட்சியை விரிவாக்கமின்றி நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπιτελέσει
  choice: அதை நிறைவேற்றி முடிப்பார்
  rationale: தொடங்கப்பட்ட செயலை வெற்றிகரமாக நிறைவுக்குக் கொண்டுவரும் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἄχρι ἡμέρας
  choice: நாள்வரை
  rationale: ἄχρι என்பதன் இயல்பான கால எல்லைப் பொருளைப் பாதுகாக்கிறது; நிறைவு அந்த நாளுடன் தொடர்புடையது.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மெசியா இயேசு
  rationale: Χριστός இங்கு பட்டப்பெயராக இருப்பதால் அதன் பொருளை ‘மெசியா’ என மொழிபெயர்க்கிறது; பாரம்பரிய ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: கடவுளுடைய செயல் தனிநபர்களுக்குள்ளா அல்லது விசுவாசக் கூட்டத்தினிடையேயா நடைபெறுகிறது என்பதன் பரப்பு
  choice: முதன்மை உரையில் ‘உங்களிடையே’ என்று கூட்டுச் சூழலை முன்னிறுத்துதல்
  alternative: ‘உங்களுக்குள்’ என்று மொழிபெயர்த்து தனிநபர் அல்லது உள்ளார்ந்த பொருளை அதிகம் முன்னிறுத்துதல்
  rationale: பன்மைப் பிரதிப்பெயரும் திருச்சபைக்கான கடிதச் சூழலும் கூட்டுப் பொருளுக்கு ஆதரவளிக்கின்றன; அதேவேளை தனிநபர் பயன்பாட்டை மறுக்காமல் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἄχρι ἡμέρας என்பது நிறைவு நிகழும் நாளைக் குறிக்கிறதா அல்லது அந்த நாள்வரையிலான கால எல்லையைக் குறிக்கிறதா
  choice: ‘நாள்வரை’ என்று மூலத்தின் கால எல்லையை நேரடியாக வைத்திருத்தல்
  alternative: ‘அந்த நாளில்’ என்று இறுதி நிறைவு நிகழும் தருணத்தை முன்னிறுத்துதல்
  rationale: ἄχρι என்பதன் முதன்மையான கால எல்லைப் பொருளை மாற்றாமல் பாதுகாக்கிறது; சூழலில் இறுதி நிறைவு அந்த நாளோடு தொடர்புடையதாக இருப்பதால் மாற்று வாசிப்பும் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிறைவேற்றி முடிப்பார்’ என்பது செயலின் நிறைவைத் தெளிவாக்குகிறது; ‘உங்களிடையே’ என்பது திருச்சபைச் சமூகத்தைக் குறிக்கும் பன்மைச் சூழலைப் பாதுகாக்கிறது.
