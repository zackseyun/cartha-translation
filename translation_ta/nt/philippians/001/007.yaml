id: PHP.1.7
reference: Philippians 1:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: ta
  text: உங்கள் அனைவரைக் குறித்தும் இவ்வாறு எண்ணுவது எனக்கு நியாயமானதே. ஏனெனில், உங்களை என் இதயத்தில் வைத்திருக்கிறேன்[a]. என் சங்கிலிகளிலும் நற்செய்திக்காக வாதாடுவதிலும் அதை உறுதிப்படுத்துவதிலும், நீங்கள் அனைவரும் என்னுடன் அருளில் பங்குபெறுகிறவர்களாக இருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் என்னை உங்கள் இதயத்தில் வைத்திருக்கிறீர்கள்.” கிரேக்கச் சொற்றொடரை இரு விதமாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: நியாயமானதே
  rationale: இங்கு பவுலின் மனப்பான்மை முறையானதும் நியாயமானதும் என்பதைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பாகவும் அறநெறிச் சாயலைக் காக்கவும் இச்சொல் உதவுகிறது.
- source_word: φρονεῖν
  choice: எண்ணுவது
  rationale: சிந்தனை மட்டுமன்றி நிலையான மனப்பான்மையையும் குறிக்கக்கூடிய சொல்லாக இருந்தாலும், இச்சூழலில் ‘இவ்வாறு எண்ணுவது’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: உங்கள் அனைவரைக் குறித்தும்
  rationale: φρονεῖν உடன் இது பிரதிநிதித்துவத்தை அல்ல, அவர்களைக் குறித்த பவுலின் எண்ணத்தைக் குறிக்கிறது.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: உங்களை என் இதயத்தில் வைத்திருக்கிறேன்
  rationale: இரு பெயர்ச்சொற்களும் வேற்றுமை உருபின்றி accusative வடிவில் இருப்பதால் இலக்கண இருபொருள் உண்டு. உடனடியான அன்புச் சூழலுடன் பொருந்தும் பாரம்பரிய வாசிப்பு முதன்மை உரையில் வைக்கப்பட்டு, மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δεσμοῖς
  choice: சிறைவிலங்குகளிலும்
  rationale: பவுலின் சிறையிருப்பை மட்டும் அல்லாமல் δεσμοί என்பதன் கண்கூடான சங்கிலி/விலங்கு உருவகத்தையும் காக்கிறது.
- source_word: ἀπολογίᾳ
  choice: பாதுகாத்து
  rationale: நற்செய்திக்கு எதிரான குற்றச்சாட்டுகளுக்கு விடையளித்து அதைப் பாதுகாப்பதைக் குறிக்கிறது; இணைந்த தமிழ் வினையெச்ச வடிவம் இயல்பானது.
- source_word: βεβαιώσει
  choice: உறுதிப்படுத்துவதிலும்
  rationale: நற்செய்தியின் உண்மையையும் நிலைப்பாட்டையும் நிறுவுதல் அல்லது வலுப்படுத்துதல் என்ற பொருளைக் காக்கிறது.
- source_word: συγκοινωνούς
  choice: என்னுடன் ... பங்குபெறுகிறவர்களாய்
  rationale: கூட்டுப் பங்கேற்பையும் பவுலுடன் பகிர்ந்த உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: χάριτος
  choice: அருளில்
  rationale: χάρις என்ற முக்கிய இறையியல் சொல்லை வழக்கமான தமிழ்ச் சொல்லான ‘அருள்’ மூலம் காக்கிறது; இங்கு பணி மற்றும் பாடுகளில் பகிரப்படும் கடவுளின் அருளைக் குறிக்கலாம்.
theological_decisions:
- issue: இதயத்தைப் பற்றிய சொற்றொடரின் இலக்கண இருபொருள்
  choice: உங்களை என் இதயத்தில் வைத்திருக்கிறேன்
  alternative: நீங்கள் என்னை உங்கள் இதயத்தில் வைத்திருக்கிறீர்கள்
  rationale: முதன்மை வாசிப்பு பவுலின் அன்பையும் அவர்களைக் குறித்த அவரது எண்ணத்தையும் இயல்பாகத் தொடர்கிறது. ஆனால் கிரேக்கத் தொடரை எதிர்திசையிலும் புரிந்துகொள்ள முடிவதால், உண்மையான இருபொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τῆς χάριτος உடன் συγκοινωνούς என்பதன் தொடர்பு
  choice: என்னுடன் அருளில் பங்குபெறுகிறவர்கள்
  alternative: எனக்குக் கிடைத்த அருளில் என்னுடன் பங்குபெறுகிறவர்கள்
  rationale: ‘அருள்’ எதைக் குறிப்பதாகும் என்பதை மூலவசனம் முழுமையாக விளக்கவில்லை. ஆகவே அது இரட்சிப்பு, ஊழியம், அல்லது பாடுகளோடு தொடர்புடைய அருள் என்று குறுக்காமல் பொதுவான வடிவம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வேதாகமத்திற்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘சிறைவிலங்குகள்’ மூலத்தின் கண்கூடான உருவகத்தைப் பாதுகாக்கிறது; நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
