reference: Philippians 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: ta
  text: 'மேசியா இயேசுவின் அடிமைகளாகிய பவுலும் தீமோத்தேயுவும், பிலிப்பியில் உள்ள மேசியா இயேசுவுக்குள் இருக்கும் பரிசுத்தமான அனைவருக்கும், மேற்பார்வையாளர்களையும் சேவையாளர்களையும் உட்பட:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: இச்சொல் சார்ந்திருக்கும் கட்டுப்பட்ட நிலையையும் ஒருவருக்குச் சொந்தமானவராகச் சேவை செய்வதையும் குறிக்கிறது; ‘ஊழியர்கள்’ அல்லது ‘பணியாளர்கள்’ என்பவை அந்த வலிமையைத் தணித்துவிடும்.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: மேசியா இயேசு
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாக இருப்பதால் அதன் பொருளை வெளிப்படுத்தும் ‘மேசியா’ பயன்படுத்தப்பட்டது; பெயர் வரிசையும் கிரேக்கத்தின்படியே வைக்கப்பட்டது.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: பரிசுத்தமானவர்கள் அனைவருக்கும்
  rationale: ‘பரிசுத்தவான்கள்’ என்ற மரபுச் சொல்லின் பாலினச் சாயலைத் தவிர்த்து, கடவுளுக்கெனப் பிரிக்கப்பட்ட விசுவாசிகளின் அடையாளத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியா இயேசுவுக்குள்
  rationale: இடத்தையும் மேசியாவுடன் உள்ள ஒன்றிப்பையும் ஒருங்கே சுட்டக்கூடிய பவுலின் ἐν சொல்லாட்சியை விளக்கவுரையாக்காமல் பாதுகாக்கிறது.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: பிலிப்பியில் இருக்கிற
  rationale: வினையெச்சத் தொடரை இயல்பான தமிழ் சார்புத் தொடராக மாற்றி, பிலிப்பியில் அவர்கள் இருப்பதை வெளிப்படையாக வைத்திருக்கிறது.
- source_word: σὺν
  choice: சேர்ந்து
  rationale: முழுச் சபையோடு குறிப்பிடப்பட்ட குழுக்களும் இணைந்திருப்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐπισκόποις
  choice: மேற்பார்வையாளர்கள்
  rationale: சொல்லின் கண்காணிப்பு அல்லது மேற்பார்வைப் பொருளை நேரடியாகத் தருகிறது; பிற்காலச் சபை அமைப்பைத் தேவையின்றி உரைக்குள் கொண்டுவரவில்லை.
- source_word: διακόνοις
  choice: திருப்பணியாளர்கள்
  rationale: மேற்பார்வையாளர்களுடன் இணைத்துச் சொல்லப்படும் அங்கீகரிக்கப்பட்ட சபைப் பணியைச் சுட்டுகிறது; பொதுவான வேலைக்காரர் என்ற பொருளிலிருந்து வேறுபடுத்துகிறது.
theological_decisions:
- issue: Χριστός என்பதைப் பட்டமாக மொழிபெயர்த்தல்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: மூலத்தில் இது வரலாற்றில் பெயர்போல் பயன்பட்டாலும் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டத்தன்மையைத் தாங்குகிறது; ‘மேசியா’ அந்தத் தன்மையைத் தெளிவாகக் காக்கிறது.
- issue: δοῦλοι என்பதன் உறவுநிலையை வெளிப்படுத்தல்
  choice: அடிமைகள்
  alternative: ஊழியர்கள் / பணியாளர்கள்
  rationale: பவுலும் தீமோத்தேயுவும் மேசியாவுக்குச் சொந்தமானவர்களாகவும் அவருக்கு முழுமையாகக் கட்டுப்பட்டவர்களாகவும் தங்களை அறிமுகப்படுத்தும் கூர்மையைத் தணிக்காமல் காக்கிறது.
- issue: ἐν Χριστῷ Ἰησοῦ என்பதிலுள்ள ἐν
  choice: மேசியா இயேசுவுக்குள்
  alternative: மேசியா இயேசுவில்
  rationale: தமிழில் சற்றுக் குறைவான வழக்காக இருந்தாலும், வெறும் தொடர்பு அல்லாமல் உள்ளார்ந்த ஒன்றிப்பைக் குறிக்கும் மூலத்தின் இறையியல் அழுத்தத்தைத் தெளிவாக வைத்திருக்கிறது.
- issue: ἐπισκόποις மற்றும் διακόνοις ஆகிய பணிப் பெயர்கள்
  choice: மேற்பார்வையாளர்கள் மற்றும் திருப்பணியாளர்கள்
  alternative: ஆயர்கள் மற்றும் டீக்கன்கள்
  rationale: முதல் நூற்றாண்டின் பணிகளை பிற்கால அமைப்புச் சொற்களால் முன்கூட்டியே வரையறுக்காமல், மூலச் சொற்களின் பணிசார் பொருளை முன்னிறுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கடிதத் தொடக்கமாக அமைக்கப்பட்டது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘எழுதுவது’ என்பது தமிழில் முகவரி தொடரை நிறைவு செய்யத் தேவையான குறைந்தபட்ச இலக்கணச் சேர்க்கை. ‘பரிசுத்தமானவர்கள்’ பாலினத்தைச் சுட்டாத, பொதுவாசகருக்குப் புரியும் வடிவம். ‘மேசியா இயேசுவுக்குள்’ என்பது திட்டமிட்ட வகையில் மூலத்தின் ஒன்றிப்பு மொழியை நெருக்கமாகக் காக்கிறது.
