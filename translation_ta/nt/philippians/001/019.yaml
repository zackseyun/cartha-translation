id: PHP.1.19
reference: Philippians 1:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: ta
  text: ஏனெனில், உங்கள் வேண்டுதலினாலும் இயேசு மேசியாவின் ஆவி அளிக்கும் உதவியினாலும்[b], இது எனக்கு விடுதலையாக[a] அமையும் என்று நான் அறிவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரட்சிப்பாக’ அல்லது ‘நியாயநிறுவலாக.’
    reason: alternative_reading
  - marker: b
    text: ‘ஆவி அளிக்கும் உதவி’ என்பதற்கு, ‘ஆவியின் வழங்குதல்’ என்றும் பொருள் கொள்ளலாம்; அதாவது ஆவியே வழங்கப்படுவதைக் குறிக்கக்கூடும்.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: οἶδα
  choice: நான் அறிவேன்
  rationale: முற்றுப்பெற்ற வடிவமான οἶδα இங்கு நிகழ்காலப் பொருளில் பவுலின் உறுதியை வெளிப்படுத்துகிறது; ‘நான் அறிவேன்’ என்பது இயல்பான, நேரடியான தமிழ்.
- source_word: τοῦτό
  choice: இது
  rationale: ஒருமைச் சுட்டுப்பெயர் பவுலின் தற்போதைய சூழ்நிலையை மொத்தமாகப் பின்னோக்கிச் சுட்டுகிறது; அதைப் தேவையின்றி விரிவுபடுத்தாமல் ‘இது’ என வைக்கப்படுகிறது.
- source_word: ἀποβήσεται εἰς
  choice: …ஆக முடியும்
  rationale: இச்சொற்றொடர் ஒரு விளைவு அல்லது முடிவைச் சுட்டுகிறது. ‘…ஆக முடியும்’ என்பது எதிர்கால விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: σωτηρίαν
  choice: விடுதலை
  rationale: சிறைவாசச் சூழலில் உடனடியான விடுதலை அல்லது சாதகமான முடிவு முன்னிலையில் உள்ளது. அதேவேளையில், சொல்லின் விரிவான ‘இரட்சிப்பு’ மற்றும் ‘நியாயநிறுவல்’ பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: δεήσεως
  choice: வேண்டுதல்
  rationale: δεήσεως என்பது குறிப்பான மன்றாட்டு அல்லது வேண்டுதலைக் குறிக்கிறது; ‘வேண்டுதல்’ நவீன தமிழில் தெளிவாகவும் மரியாதையான நடையிலும் உள்ளது.
- source_word: ἐπιχορηγίας
  choice: வழங்கும் உதவி
  rationale: இச்சொல் அளிக்கப்படும் ஆதரவு அல்லது போதுமான உதவியைச் சுட்டுகிறது. ‘வழங்கும் உதவி’ அதன் செயற்பாட்டு நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: இயேசு மேசியாவின் ஆவி
  rationale: மூலத்தின் உரிமை/தொடர்பு வேற்றுமையை நேரடியாகப் பாதுகாக்கிறது. Χριστός என்பதை தனிப்பெயராக அல்லாமல் ‘மேசியா’ என்ற பட்டமாக வழங்குகிறது.
theological_decisions:
- issue: சிறைவாசச் சூழலில் σωτηρίαν என்பதன் பொருள்
  choice: விடுதலை
  alternative: இரட்சிப்பு அல்லது நியாயநிறுவல்
  rationale: உடனடிச் சூழல் பவுலின் கட்டுகளையும் அவர் எதிர்பார்க்கும் முடிவையும் பற்றியது. ஆகவே ‘விடுதலை’ முதன்மைப் பொருளைத் தருகிறது; எனினும் சொல்லின் இரட்சிப்பியல் மற்றும் நியாயநிறுவல் சார்ந்த விரிவை அடிக்குறிப்பு திறந்தவையாக வைத்திருக்கிறது.
- issue: ἐπιχορηγίας τοῦ πνεύματος என்ற மரபுத்தொடரின் உறவு
  choice: ஆவி வழங்கும் உதவி
  alternative: ஆவியின் வழங்குதல் / ஆவியாகிய வழங்கல்
  rationale: தமிழில் வாசிக்க இயல்பாக இருக்கச் செய்பவர் சார்ந்த பொருள் முதன்மைப்படுத்தப்படுகிறது; இருப்பினும் மூலத்தின் வேற்றுமைத் தொடர்பில் உதவி ஆவியால் வழங்கப்படுகிறதா அல்லது ஆவியே வழங்கப்படுகிறாரா என்ற நுண்ணிய சாத்தியம் முழுமையாகத் தீர்மானிக்கப்படவில்லை என்பதை அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘மேசியா’ என்பது Χριστός என்ற பட்டத்தின் பொருளை வெளிப்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியத்தின் காரண–விளைவு அமைப்பு தமிழில் இயல்பாக மறுவரிசைப்படுத்தப்பட்டுள்ளது; முக்கியமான சொற்பொருள் மற்றும் இலக்கணத் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
