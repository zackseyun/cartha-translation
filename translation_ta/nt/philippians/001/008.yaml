id: PHP.1.8
reference: Philippians 1:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: ta
  text: ஏனெனில், மேசியா[a] இயேசுவின் கனிவான அன்போடு[b] உங்கள் அனைவரையும் நான் எவ்வளவு ஏங்குகிறேன் என்பதற்குக் கடவுளே என் சாட்சி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கிறிஸ்து இயேசுவின்.”'
    reason: alternative_reading
  - marker: b
    text: 'அல்லது: “மேசியா இயேசுவின் இரக்கத்தோடு.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: சாட்சி
  rationale: ‘கடவுளே என் சாட்சி’ என்பது பவுல் தமது நேர்மைக்கு உத்தரவாதமாகக் கடவுளை அழைக்கும் வலியுறுத்தலையும் கிரேக்க மரபுத்தொடரையும் இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திலுள்ள பவுலின் அன்புக் கூற்றுக்கு இந்த வசனம் காரணவிளக்கம் அளிப்பதை இணைப்புச் சொல் வெளிப்படுத்துகிறது.
- source_word: ὡς
  choice: எவ்வளவு
  rationale: பவுல் ஏங்குகிறார் என்ற உண்மையை மட்டும் அல்லாமல், அந்த ஏக்கத்தின் தீவிரத்தையும் இங்கு ὡς வலியுறுத்துகிறது.
- source_word: ἐπιποθῶ
  choice: ஏங்குகிறேன்
  rationale: ஆழமான தனிப்பட்ட விருப்பத்தையும் பாசத்தையும் நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: πάντας ὑμᾶς
  choice: உங்கள் அனைவருக்காகவும்
  rationale: πάντας என்பதன் முழுமையான வலியுறுத்தலைப் பேணுகிறது; தமிழ் வினைத்தொடரோடு இயல்பாக அமைய நான்காம் வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: σπλάγχνοις
  choice: கனிவான அன்போடு
  rationale: உள்ளுறுப்புகளை ஆழ்ந்த உணர்வுகளின் இருப்பிடமாகக் குறிப்பிடும் கிரேக்க உருவகத்தைச் சொற்சொல்லாக மொழிபெயர்க்காமல், அதன் ஆழ்ந்த பாசம் மற்றும் கனிவு ஆகிய பொருள்களை இயல்பான தமிழில் தருகிறது.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மேசியா இயேசுவின்
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாக உள்ள பொருளை ‘மேசியா’ வெளிப்படுத்துகிறது; மரபான ‘கிறிஸ்து இயேசு’ வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: பவுலின் Χριστοῦ Ἰησοῦ என்ற பட்டம்-பெயர் தொடரை மொழிபெயர்த்தல்
  choice: மேசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός என்பதன் பட்டப் பொருளை மொழிபெயர்ப்பில் வெளிப்படையாகப் பேண ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டுள்ளது. பவுலின் பயன்பாட்டில் இத்தொடர் பெயரைப் போல நிலைபெற்றிருப்பதால், மரபான மாற்று வடிவமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ என்பதில் பாசத்தின் தொடர்பு
  choice: மேசியா இயேசுவின் கனிவான அன்போடு
  alternative: மேசியா இயேசுவின் இரக்கத்தோடு
  rationale: இத்தொடர் பவுலின் சொந்த உணர்ச்சியை மேசியா இயேசுவுக்குரிய ஆழ்ந்த பாசத்துடன் இணைக்கிறது. ‘கனிவான அன்பு’ உணர்ச்சியின் ஆழத்தையும் உறவுசார் பாசத்தையும் பேணுகிறது; ‘இரக்கம்’ என்பதும் சாத்தியமான பொருளாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் வலியுறுத்தலை இயல்பான தமிழ்ச் சொல் வரிசையில் வெளிப்படுத்தி, ‘கடவுளே என் சாட்சி’ என்ற solemn appeal-ஐத் தெளிவாகப் பேணுகிறது.
