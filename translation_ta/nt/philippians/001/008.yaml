  to: ஏனெனில், மேசியா[a] இயேசுவின் கனிவான அன்போடு[b] உங்கள் அனைவரையும் நான் எவ்வளவு ஏங்குகிறேன் என்பதற்குக் கடவுளே என் சாட்சி.
