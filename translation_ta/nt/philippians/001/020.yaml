revisions:
- from: எனது ஆவலான எதிர்பார்ப்புக்கும் நம்பிக்கைக்கும் ஏற்ப, நான் எதிலும் அவமானத்திற்கு உள்ளாகாமல்[a], எப்போதும்போல இப்போதும் முழுத் துணிவோடு, வாழ்வினாலோ சாவினாலோ என் உடலில் மெசியா[b] பெருமைப்படுத்தப்படுவார்.
