id: PHP.1.20
reference: Philippians 1:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: ta
  text: எனது ஆவலான எதிர்பார்ப்புக்கும் நம்பிக்கைக்கும் ஏற்ப, எதிலும் நான் அவமானப்படுத்தப்படமாட்டேன்[a]; மாறாக, எப்போதும்போல இப்போதும் முழுத் துணிவுடன் என் உடலில் மெசியா பெருமைப்படுத்தப்படுவார்—வாழ்வினாலோ சாவினாலோ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் எதிலும் வெட்கப்படமாட்டேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: ஏற்ப
  rationale: பவுலின் ஆவலான எதிர்பார்ப்புக்கும் நம்பிக்கைக்கும் இசைவாக அடுத்து கூறுவது நிகழும் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀποκαραδοκίαν
  choice: ஆவலான எதிர்பார்ப்பு
  rationale: முன்நோக்கி மிகுந்த ஆவலுடன் எதிர்பார்க்கும் இந்த அரிய, வலுவான சொல்லின் உணர்வைப் பாதுகாக்கிறது.
- source_word: ἐλπίδα
  choice: நம்பிக்கை
  rationale: உறுதியான எதிர்நோக்கைக் குறிக்கும் பவுலின் வழக்கமான பயன்பாட்டுக்கு ஏற்றது.
- source_word: ἐν οὐδενὶ
  choice: எதிலும்
  rationale: எந்தச் சூழலிலும் அல்லது எந்த வகையிலும் என்ற முழுமையான மறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αἰσχυνθήσομαι
  choice: அவமானத்திற்கு உள்ளாகாமல்
  rationale: வெட்க உணர்வை மட்டும் அல்லாமல், பொது நிலையில் அவமானப்படுத்தப்படுதல் அல்லது தோல்வியடைந்ததாகக் காணப்படுதல் என்ற செயல்பாட்டு நுணுக்கத்தையும் தக்கவைக்கிறது.
- source_word: παρρησίᾳ
  choice: முழுத் துணிவோடு
  rationale: வெளிப்படையாகவும் அஞ்சாமலும் சாட்சி கொடுக்கும் கருத்தை இச்சூழலில் தெளிவாகக் காட்டுகிறது.
- source_word: μεγαλυνθήσεται
  choice: பெருமைப்படுத்தப்படுவார்
  rationale: ஒருவரின் பெருமை வெளிப்படச் செய்யப்படும் என்ற உருவகத்தையும் passive வடிவத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Χριστὸς
  choice: மெசியா
  rationale: இங்கு Χριστός வெறும் பெயராக அல்லாமல் இயேசுவின் பட்டமாகவும் பொருளுள்ள அடையாளமாகவும் செயல்படுவதால் அதன் பட்டப்பொருள் மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐν τῷ σώματί μου
  choice: என் உடலில்
  rationale: பவுலின் உடல்சார்ந்த வாழ்விலும் மரணத்திலும் மெசியா பெருமைப்படுத்தப்படுவார் என்ற தெளிவான, நேரடியான வடிவத்தைப் பாதுகாக்கிறது.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: வாழ்வினாலோ சாவினாலோ
  rationale: διά குறிக்கும் வழி அல்லது சாதனத்தையும் இரு மாற்றுகளின் இணையான அமைப்பையும் சுருக்கமான இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பவுலின் கடிதச் சூழலில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இவ்வசனத்தில் இயேசுவின் மெசியாப் பட்டத்தின் பொருள் இன்னும் கேட்கக்கூடியதாக உள்ளது; ஆகவே பெயர்வடிவமாக மட்டும் ஒலிபெயர்ப்பதைவிட பட்டப்பொருளைப் பாதுகாப்பது பொருத்தமானது.
- issue: αἰσχυνθήσομαι என்பதிலுள்ள அவமானத்தின் தன்மை
  choice: அவமானத்திற்கு உள்ளாகாமல்
  alternative: வெட்கப்படாமல்
  rationale: வடிவம் தனிப்பட்ட வெட்க உணர்வையோ வெளிப்படையான அவமானத்திற்கு உள்ளாக்கப்படுவதையோ குறிக்கக்கூடும். முதன்மை உரை பொது சாட்சியும் அதன் உறுதிப்படுத்தலும் சார்ந்த நுணுக்கத்தை முன்னிறுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு தெளிவாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் ‘அல்லாமல் …’ எதிர்மறை-நேர்மறை திருப்பமும், ‘எப்போதும்போல இப்போதும்’ என்ற கால வலியுறுத்தலும், வாழ்வு–சாவு இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
