source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: ta
  text: உங்களை எதிர்ப்பவர்களால் எந்த வகையிலும் மிரண்டுபோகாதீர்கள்[a]. இது அவர்களுக்கு அழிவின் அடையாளமாகவும்[b], உங்களுக்கோ மீட்பின் அடையாளமாகவும் இருக்கிறது; இதுவும் கடவுளிடமிருந்து வருகிறது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘திகிலடையாதீர்கள்’ அல்லது ‘அச்சுறுத்தலுக்கு இடங்கொடுக்காதீர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘அடையாளம்’ என்பதற்கு ‘சான்று’ அல்லது ‘அறிகுறி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘இது கடவுளிடமிருந்து வருகிறது’ என்பது குறிப்பாக மீட்பைக் குறிக்கலாம்; அல்லது முன் கூறப்பட்ட அடையாளம் முழுவதையும் விரிவாகக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: மிரண்டுபோகாதீர்கள்
  rationale: இந்த வினை திடுக்கிட்டு அஞ்சுவதையோ எதிரிகளால் அச்சுறுத்தப்படுவதையோ குறிக்கிறது. ‘மிரண்டுபோகாதீர்கள்’ என்பது எதிர்ப்பின் முன்னிலையில் அஞ்சாமல் இருப்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐν μηδενί
  choice: எந்த வகையிலும்
  rationale: ‘எதிலும்’ அல்லது ‘எந்த விதத்திலும்’ என்ற முழுமையான பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑπὸ τῶν ἀντικειμένων
  choice: உங்களை எதிர்ப்பவர்களால்
  rationale: ὑπό குறிக்கும் செய்பவரையும், ἀντίκειμαι என்பதிலுள்ள நேரடியான எதிர்ப்பையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: ἔνδειξις
  choice: அடையாளம்
  rationale: ஒரு நிலை வேறொரு உண்மையைச் சுட்டிக்காட்டும் சான்றாக அல்லது அறிகுறியாக இருப்பதை வாசிக்க எளிய தமிழில் தெரிவிக்கிறது; ‘சான்று’ என்ற அதிக வலுவான பொருளை கட்டாயப்படுத்தவில்லை.
- source_word: ἀπωλείας
  choice: அழிவு
  rationale: இச்சொல்லின் அழிவையும் இறுதிக் கேடையும் குறிக்கும் பரப்பைப் பாதுகாக்கிறது; தேவையற்ற கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: σωτηρίας
  choice: மீட்பு
  rationale: கடவுளுடைய காப்புச் செயலை இயல்பான பொதுத் தமிழில் தெரிவிக்கிறது; இச்சூழலில் வெறும் உடனடி விடுதலை என்ற பொருளுக்கு மட்டுப்படுத்துவதில்லை.
- source_word: καὶ τοῦτο ἀπὸ θεοῦ
  choice: இதுவும் கடவுளிடமிருந்தே வருகிறது
  rationale: τοῦτο என்பதற்கான முன்னிலையைத் தெளிவுபடுத்தாமல் வைத்து, அது குறிப்பாக மீட்பையோ அல்லது முன் கூறப்பட்ட அடையாளம் முழுவதையுமோ சுட்டலாம் என்ற மூலமொழியின் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: τοῦτο (‘இது’) என்பதன் சுட்டுப்பொருள்
  choice: ‘இதுவும் கடவுளிடமிருந்தே வருகிறது’ என்று பரந்த சுட்டுப்பொருளுடன் விடப்பட்டுள்ளது.
  alternative: ‘இது’ குறிப்பாக விசுவாசிகளின் மீட்பை மட்டும் சுட்டுகிறது; அல்லது அவர்களுடைய அஞ்சாமை வெளிப்படுத்தும் முழு அடையாளத்தையும் சுட்டுகிறது.
  rationale: கிரேக்க வாக்கியத்தில் ஒன்றுக்கு மேற்பட்ட சுட்டுப்பொருள் சாத்தியம் உள்ளது. ஆகவே உரை தீர்மானிக்காத இறையியல் தொடர்பை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- issue: ἀπωλείας மற்றும் σωτηρίας ஆகிய மரபுத்தொடர்களின் இணைநிலை
  choice: ‘அவர்களுக்கு அழிவின் அடையாளமாகவும், உங்களுக்கோ மீட்பின் அடையாளமாகவும்’ என்று இணை அமைப்பு வெளிப்படுத்தப்பட்டுள்ளது.
  alternative: ‘அவர்கள் அழிவடைவதற்கும் நீங்கள் மீட்கப்படுவதற்குமான சான்று’ என்று நிகழ்வுகளை வெளிப்படையாக விரித்துரைக்கலாம்.
  rationale: பெயர்ச்சொல் வடிவங்களையும் அவர்களுக்கு/உங்களுக்கு என்ற எதிரிணையையும் பாதுகாப்பது, அழிவும் மீட்பும் நிகழும் முறை அல்லது காலத்தை மொழிபெயர்ப்பிலேயே கூடுதலாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இரட்சிப்பு’ என்பதற்குப் பதிலாகப் பொதுத் தமிழில் இயல்பான ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டது. கிரேக்கத் தொடரின் எதிரிணை அமைப்பும் இறுதி ‘இது’ என்பதன் நோக்கமுள்ள தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
