id: PHP.1.12
reference: Philippians 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: ta
  text: சகோதரர்களே[a], எனக்கு நேரிட்டவை உண்மையில் நற்செய்தியின்[b] முன்னேற்றத்திற்கே வழிவகுத்திருக்கின்றன என்பதை நீங்கள் அறிந்துகொள்ள வேண்டும் என்று விரும்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதர சகோதரிகளே” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் “சகோதரர்களே” என்று இருந்தாலும், அது விசுவாசிகள் அனைவரையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “சுவிசேஷத்தின்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: நீங்கள் அறிந்துகொள்ள வேண்டும் என்று விரும்புகிறேன்
  rationale: அறிவிக்க முற்படும் பவுலின் தனிப்பட்ட விருப்பத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான உரையாடல் மாற்றத்தைக் குறிக்கிறது; தமிழில் தனியே ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது மூலத்தில் இல்லாத கால அல்லது வலுவான முரண்பாட்டுச் சாயலை ஏற்படுத்தலாம்.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை அழைப்பை முதன்மை உரையில் தக்கவைக்கிறது; முழுத் திருச்சபையையும் உள்ளடக்கும் சாத்தியம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: τὰ κατ’ ἐμὲ
  choice: எனக்கு நேரிட்டவை
  rationale: பவுலின் தற்போதைய சூழ்நிலைகளையும் அவருக்கு நிகழ்ந்தவற்றையும் இயல்பாகவும் விரிவான பொருளுடனும் குறிக்கிறது.
- source_word: μᾶλλον
  choice: உண்மையில் ... -க்கே
  rationale: எதிர்பார்ப்புக்கு மாறான விளைவை ‘உண்மையில்’ என்பதும் வலியுறுத்தும் ‘-க்கே’ என்பதும் சேர்ந்து இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: εἰς προκοπὴν
  choice: முன்னேற்றத்திற்கே வழிவகுத்திருக்கின்றன
  rationale: ஒரு நிகழ்வு தொடர்ந்து முன்னேற்றத்தை உண்டாக்கியிருப்பதைத் தெளிவாகக் காட்டுகிறது; பெயர்ச்சொல் அமைப்பையும் விளைவின் திசையையும் காக்கிறது.
- source_word: τοῦ εὐαγγελίου
  choice: நற்செய்தியின்
  rationale: εὐαγγέλιον என்பதன் அடிப்படைப் பொருளை பொதுவாசகர்களுக்கு நேரடியாகப் புரியும் தமிழில் தருகிறது; பாரம்பரிய மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐλήλυθεν
  choice: வழிவகுத்திருக்கின்றன
  rationale: கடந்த நிகழ்வுகளால் ஏற்பட்ட விளைவு இப்போதும் நிலவுவதை தமிழ் நிறைவு வினை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
