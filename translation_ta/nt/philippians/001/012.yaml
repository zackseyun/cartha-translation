translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘இப்போது’ சேர்க்கப்படவில்லை; μᾶλλον குறிக்கும் எதிர்பாராத விளைவு ‘உண்மையில்’ மற்றும் ‘-க்கே’ மூலம் காக்கப்பட்டுள்ளது.
