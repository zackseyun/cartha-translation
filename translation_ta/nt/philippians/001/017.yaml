source:
  edition: SBLGNT
  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: ta
  text: ஆனால் மற்றவர்களோ தன்னலம் நாடும் போட்டி மனப்பான்மையால் மேசியாவை[a] அறிவிக்கிறார்கள்; தூய நோக்கத்தோடு அல்ல; என் சிறைவாசத்துக்கு மேலும் துன்பம் உண்டாகும் என்று எண்ணி அறிவிக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கிறிஸ்துவை.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐριθείας
  choice: தன்னலம் நாடும் போட்டி மனப்பான்மை
  rationale: இச்சொல் வெறும் சுயநலத்தை மட்டுமல்லாமல், தன்னை முன்னிறுத்தும் போட்டி அல்லது கட்சிசார் நோக்கத்தையும் குறிக்கிறது. நவீனத் தமிழில் அந்த இரு கூறுகளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Χριστόν
  choice: மேசியா
  rationale: இங்கு இயேசுவின் மேசியா அடையாளமே அறிவிப்பின் பொருளாக இருப்பதால், பெயரைப் போல அல்லாமல் பட்டப்பெயரின் பொருள் முன்னிலையில் உள்ளது.
- source_word: καταγγέλλουσιν
  choice: அறிவிக்கிறார்கள்
  rationale: பொதுவெளியில் செய்தியைப் பிரகடனப்படுத்தும் பொருளைத் தருகிறது; முறையான பிரசங்கத்துக்கு மட்டும் வினையைச் சுருக்குவதில்லை.
- source_word: ἁγνῶς
  choice: தூய நோக்கத்தோடு
  rationale: இச்சூழலில் செயல் முறையின் தூய்மையைவிட உள்ளார்ந்த நோக்கத்தின் தூய்மையே குறிக்கப்படுகிறது.
- source_word: οἰόμενοι
  choice: எண்ணி
  rationale: அவர்களின் கருதுகோளையும் நோக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் தற்செயலான விளைவாகக் காட்டுவதில்லை.
- source_word: θλῖψιν ἐγείρειν
  choice: துன்பம் உண்டாக்க
  rationale: ‘துன்பத்தை எழுப்புதல்’ என்ற சொற்சொல் மொழிபெயர்ப்பு தமிழில் இயல்பற்றது. இந்தத் தேர்வு துன்பத்தை ஏற்படுத்தும் பகைநோக்கைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τοῖς δεσμοῖς μου
  choice: என் சிறைவாசத்தில்
  rationale: δεσμοί என்பதன் நேரடிப் பொருள் ‘சங்கிலிகள்’; இங்கு அது சிறையிருப்பை ஆகுபெயராகக் குறிக்கிறது. முதன்மை உரை நவீன வாசகருக்கு பொருளைத் தெளிவாக்குகிறது; நேரடிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்வசனத்தில் அறிவிக்கப்படும் நபரின் அபிஷேகம் பெற்ற அரசர்/மீட்பர் என்ற பட்டப்பொருள் முன்னிலையில் உள்ளது. இருப்பினும் ‘கிறிஸ்து’ என்ற மரபான ஒலிபெயர்ப்பும் சாத்தியம் என்பதால் அதை அடிக்குறிப்பில் தருகிறோம்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கிய அமைப்பு தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘அப்படிச் செய்கிறார்கள்’ என்பது அறிவிப்புச் செயலை மீண்டும் சுட்டி, οἰόμενοι கூறும் நோக்கத்தை இயல்பான தமிழில் இணைக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
