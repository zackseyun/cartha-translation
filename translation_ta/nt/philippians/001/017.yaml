  source_fidelity: திருத்தம் தேவை. ‘என் சிறைவாசத்தில் எனக்குத் துன்பம் உண்டாக்க’ என்பது துன்பம் சிறைவாசத்தின் காலத்தில் பவுலுக்கே ஏற்படுவதாகச் சொல்லலாம்; ஆனால் τοῖς δεσμοῖς μου என்பது பவுலின் கட்டுகள்/சிறைவாசத்துக்கே துன்பத்தைச் சேர்க்க அல்லது அதிகரிக்க நினைத்ததைக் குறிக்கிறது. ‘மேலும் துன்பம் உண்டாகும் என்று எண்ணி’ இதைத் தெளிவாகக் காட்டுகிறது.
