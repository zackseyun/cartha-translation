source:
  edition: SBLGNT
  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: ta
  text: இதன் விளைவாக, மேசியாவுக்குள் நான் சங்கிலிகளால் கட்டப்பட்டிருப்பது பேரரசுக் காவற்படை முழுவதிலும்[b] மற்ற அனைவரிடமும் வெளிப்படையாக அறியப்பட்டிருக்கிறது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியாவுக்காக நான் சங்கிலிகளால் கட்டப்பட்டிருக்கிறேன்.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “பிரைத்தோரியம் முழுவதிலும்”; இச்சொல் பேரரசுக் காவற்படையையோ, பேரரசுத் தலைமையகம் அல்லது ஆளுநரின் மாளிகையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: இதன் விளைவாக
  rationale: முந்தைய கூற்றின் விளைவை அறிமுகப்படுத்தும் தொடர்ச்சிப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοὺς δεσμούς μου
  choice: என் சங்கிலிகள்
  rationale: சொல்லின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது; இது பவுலின் சிறையிருப்பைக் குறிக்கும் ஆகுபெயராகவும் இயல்பாகப் புரிந்துகொள்ள முடியும்.
- source_word: φανεροὺς ... γενέσθαι
  choice: வெளிப்படையாகத் தெரியவந்துள்ளன
  rationale: முன்பு தெளிவாக அறியப்படாத ஒன்று பொதுவாகத் தெளிவானது என்ற விளைவுநிலையை வெளிப்படுத்துகிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவுக்குள் உள்ள
  rationale: ἐν என்பதன் அடிப்படை உறவுநிலைப் பொருளையும், சங்கிலிகளுக்கும் மேசியாவுக்கும் இடையிலான திட்டவட்டமாக விளக்கப்படாத தொடர்பையும் பாதுகாக்கிறது; காரணப்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Χριστῷ
  choice: மேசியா
  rationale: Χριστός என்பதை வெறும் பெயராக அல்லாமல் அபிஷேகம் செய்யப்பட்டவர் என்னும் பட்டமாகக் காட்டுகிறது.
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: பேரரசுக் காவற்படை முழுவதிலும்
  rationale: இச்சூழலில் πραιτώριον என்பது பேரரசுக் காவற்படையைக் குறிக்கும் வாய்ப்பு அதிகம்; இடம் அல்லது தலைமையகம் என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: மற்ற அனைவரிடமும்
  rationale: குறிப்பிடப்பட்ட காவற்படைக்கு அப்பால் உள்ள மற்ற எல்லாரையும் உள்ளடக்கும் கிரேக்கச் சொற்றொடரின் விரிவை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பவுலின் சங்கிலிகளுடன் ἐν Χριστῷ கொண்டுள்ள உறவு
  choice: மேசியாவுக்குள் உள்ள என் சங்கிலிகள்
  alternative: மேசியாவுக்காக நான் சங்கிலிகளில் கட்டப்பட்டிருக்கிறேன்
  rationale: கிரேக்கத்தில் உள்ள ‘மேசியாவுக்குள்’ என்ற உறவுநிலையையும் அதன் இறையியல் அழுத்தத்தையும் முதன்மை உரை பாதுகாக்கிறது. அது பவுல் மேசியாவுக்கான பற்றுறுதியால் சிறையில் இருப்பதைக் குறிக்கலாம் என்ற காரணப்பொருள் வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது; இவ்வாறு உண்மையான தெளிவின்மை தீர்த்துவைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சங்கிலிகள்’ என்ற உயிருள்ள மூல உருவகமும், ‘மேசியாவுக்குள்’ என்ற இறையியல் பதற்றமுள்ள சொற்றொடரும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
