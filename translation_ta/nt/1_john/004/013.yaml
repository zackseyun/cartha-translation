source:
  edition: SBLGNT
  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: ta
  text: இதனால்[a] நாம் அவரில் நிலைத்திருக்கிறோம்[b], அவரும் நம்மில் நிலைத்திருக்கிறார் என்பதை அறிந்துகொள்கிறோம்; ஏனெனில் அவர் தமது ஆவியிலிருந்து[c] நமக்குக் கொடுத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இதிலே’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடரின் மிக நேரடியான வடிவம் அதுவாகும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவரில் தங்கியிருக்கிறோம்’ என்றும் மொழிபெயர்க்கலாம். μένω என்ற கிரேக்க வினைச்சொல், தேவனோடு உள்ள உறவில் தொடர்ந்து இருப்பதைக் குறிக்கும் யோவானின் முக்கியச் சொல்லாகும்.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: ‘தமது ஆவியிலிருந்து.’ இது மூலத்தை வலியுறுத்துகிறது. ‘தமது ஆவியை’ என்பது இயல்பான மாற்று மொழிபெயர்ப்பு; ‘தமது ஆவியில் பங்கு’ என்ற கருத்தும் இங்கு இருக்கக்கூடும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: இதனால்
  rationale: யோவானின் வழக்கில் இது ஒன்றை அறிந்துகொள்வதற்கான அடிப்படை அல்லது சான்றை அறிமுகப்படுத்துகிறது. ‘இதனால்’ என்பது தமிழில் இயல்பாக அந்தக் கருவி/சான்றுப் பொருளை வெளிப்படுத்துகிறது.
- source_word: γινώσκομεν
  choice: அறிந்துகொள்கிறோம்
  rationale: நிகழ்கால வினை வடிவம் தொடரும் அறிதலையும் உறுதியையும் குறிக்கிறது; ‘அறிந்துகொள்கிறோம்’ அந்தச் செயற்பாட்டு நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν αὐτῷ μένομεν
  choice: நாம் அவரில் நிலைத்திருக்கிறோம்
  rationale: μένω என்பது யோவான் எழுத்துகளில் உறவில் தொடர்ந்து இருப்பதைக் குறிக்கும் முக்கியச் சொல். ‘நிலைத்திருக்கிறோம்’ அதன் தொடர்ச்சியையும் ஆழமான உறவையும் காக்கிறது.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: அவரும் நம்மில் நிலைத்திருக்கிறார்
  rationale: கிரேக்கத்தில் வினைச்சொல் மீண்டும் எழுதப்படாமல் முன் கூறிய μένομεν என்பதிலிருந்து புரிந்துகொள்ளப்படுகிறது. தெளிவான இயல்பான தமிழுக்காக அது இங்கே வெளிப்படையாக மீட்டுரைக்கப்படுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இரண்டாவது ὅτι, இந்த அறிவின் காரணம் அல்லது அடிப்படையை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அந்த விளக்கத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: தமது ஆவியிலிருந்து
  rationale: ἐκ மூலத்தைக் குறிக்கிறது. தமிழில் சற்றே இறுக்கமானதாக இருந்தாலும், ‘தமது ஆவியிலிருந்து’ என்பது ‘ஆவியைத் தந்தார்’ என்று எளிமைப்படுத்தாமல் மூலமொழியின் உண்மையான நுணுக்கத்தையும் திறந்த தன்மையையும் காக்கிறது.
- source_word: δέδωκεν ἡμῖν
  choice: நமக்குக் கொடுத்திருக்கிறார்
  rationale: கிரேக்க நிறைவுக்காலம் முடிந்த கொடையினுடைய தொடரும் விளைவை உணர்த்துகிறது; ‘கொடுத்திருக்கிறார்’ அந்த அம்சத்தைத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘தமது’ என்பதன் குறிப்பு மற்றும் ‘ஆவி’ என்பவரின் அடையாளம்
  choice: ‘தமது ஆவி’ என்பது தேவனுடைய பரிசுத்த ஆவியைக் குறிப்பதாகக் கொண்டு ‘ஆவி’ மரியாதைப் பெயராக எழுதப்பட்டது.
  alternative: பொதுவான ஆவிக்குரிய கொடை அல்லது மனப்பாங்கைக் குறிக்கும் ‘ஆவி’ எனப் புரிந்துகொள்ளுதல்.
  rationale: உடனடி சூழலில் தேவனும் விசுவாசிகளும் ஒருவரில் ஒருவர் நிலைத்திருப்பதற்குச் சான்றாக தேவன் அளித்த ஆவி குறிப்பிடப்படுகிறார். இது சூழலுக்கு அப்பாற்பட்ட கோட்பாட்டுச் சேர்க்கையின்றி தனிப்பட்ட தெய்வீகக் குறிப்பைத் தக்கவைக்கிறது.
- issue: யோவானின் பரஸ்பர நிலைத்திருத்தல் மொழி
  choice: இரு திசைகளிலும் ‘நிலைத்திருக்கிறோம்/நிலைத்திருக்கிறார்’ என்று வழங்கப்பட்டது.
  alternative: இரண்டாம் கூறில் வினையை விடுத்து ‘அவரும் நம்மில்’ என்று மட்டும் வழங்குதல்.
  rationale: கிரேக்கத்தின் இணை அமைப்பைத் தெளிவான தமிழில் வெளிப்படுத்த வினை மீட்டுரைக்கப்படுகிறது; தேவனும் விசுவாசிகளும் பரஸ்பரம் நிலைத்திருப்பது விரிவுரை இல்லாமல் காக்கப்படுகிறது.
- issue: ἐκ τοῦ πνεύματος αὐτοῦ என்பதிலுள்ள மூல/பகுதி நுணுக்கம்
  choice: ‘தமது ஆவியிலிருந்து நமக்குக் கொடுத்திருக்கிறார்’ என்று திறந்த வடிவில் வைக்கப்பட்டது.
  alternative: ‘தமது ஆவியை நமக்குக் கொடுத்திருக்கிறார்’ அல்லது ‘தமது ஆவியில் நமக்குப் பங்கு கொடுத்திருக்கிறார்.’
  rationale: முதல் மாற்று ἐκ என்பதைக் கழிக்கிறது; இரண்டாவது கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘பங்கு’ என்பதைச் சேர்க்கிறது. தேர்ந்த வடிவம் மூலத்தையும் அதன் சுருக்கமான தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நிலைத்திருக்கிறார்’ என்பது யோவானின் முக்கியச் சொல்லை ஒரேபோலக் காக்கிறது. கடைசிக் கூறின் கிரேக்கச் சுருக்கமும் மூல/பகுதி நுணுக்கமும் விளக்கவுரையால் நிரப்பப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
