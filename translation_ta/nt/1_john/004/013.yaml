  source_fidelity: மூலக் கிரேக்கத்தின் அமைப்பும் பொருளும் நன்றாகக் காக்கப்பட்டுள்ளன. Ἐν τούτῳ-க்கு ‘இதனால்’ சான்று/அடிப்படைப் பொருளைத் துல்லியமாகத் தருகிறது. μένω-வின் இரு தொடர்புடைய பயன்பாடுகளும் ‘நிலைத்திருக்கிறோம்/நிலைத்திருக்கிறார்’ எனச் சீராக மொழிபெயர்க்கப்பட்டுள்ளன. ἐκ τοῦ πνεύματος αὐτοῦ என்பதிலுள்ள மூல/பகுதிசார் நுணுக்கம் ‘தமது ஆவியிலிருந்து’ என்று தேவையற்ற விளக்கத்தைச் சேர்க்காமல் பாதுகாக்கப்படுகிறது; δέδωκεν-இன் நிறைவுக்கால உணர்வும் ‘கொடுத்திருக்கிறார்’ எனத் தக்கவைக்கப்படுகிறது.
  naturalness: நவீனத் தரத் தமிழில் நடை கண்ணியமாகவும் தெளிவாகவும் உள்ளது. ‘அவரும் நம்மில் நிலைத்திருக்கிறார்’ என மறைந்துள்ள வினையை வெளிப்படுத்துவது தமிழில் இயல்பாகவும் வாசிப்புக்கு உதவியாகவும் உள்ளது. இறுதிக் கூறில் பொருள் வெளிப்படையாகச் சொல்லப்படாத சுருக்கம் தமிழில் ஓரளவு செறிவானதாக இருந்தாலும், மூலத்தின் திறந்த மூல/பகுதிசார் சொல்லாக்கத்தை உண்மையாகப் பிரதிபலிக்கிறது; சூழலில் பொருள் புரியக்கூடியது.
  terminology: ‘ஆவி’ என்ற மரியாதைமிக்க சொல்லும், யோவானிய உறவுநிலைச் சொல்லாக ‘நிலைத்திருத்தல்’ என்பதும் பொருத்தமானவை. ‘தமது’ என்பது தேவனைச் சுட்டும் மரியாதை மற்றும் தொடர்பைத் தெளிவாகக் காட்டுகிறது. அடிக்குறிப்புகள் உரிய இடங்களில் இணைக்கப்பட்டு, மொழிபெயர்ப்பு மாற்றுகளையும் ἐκ-இன் நுணுக்கத்தையும் சமநிலையுடன் விளக்குகின்றன.
