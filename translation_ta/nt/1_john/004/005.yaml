  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: ta
  text: அவர்கள் உலகத்திலிருந்து வந்தவர்கள்; அதனால் அவர்கள் உலகத்திலிருந்தே பேசுகிறார்கள்[a]; உலகம் அவர்களுக்குச் செவிகொடுக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உலகம்’ என்பது இங்கு படைக்கப்பட்ட பிரபஞ்சத்தைக் குறிக்காமல், கடவுளுக்கு எதிராக நிற்கும் மனித சமூகத்தைக் குறிக்கிறது. கிரேக்கத்தில் ‘உலகத்திலிருந்து’ என்ற சொற்றொடர் இருமுறை வந்து, அவர்களின் இயல்புக்கும் பேச்சுக்கும் உலகமே மூலமென்பதை வலியுறுத்துகிறது. ‘உலகத்தைச் சேர்ந்தவர்கள்; உலகத்தைச் சேர்ந்தவற்றையே பேசுகிறார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: அவர்கள்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட பொய்த்தீர்க்கதரிசிகளைச் சுட்டுகிறது. அடுத்த வசனத்தின் ‘நாம்’ என்பதுடனான வேறுபாட்டை இயல்பாகப் பேணுகிறது; ‘அவர்களே’ என்று வலியுறுத்துவது தமிழில் தேவையற்ற மிகை வலியுறுத்தலாக அமையலாம்.
- source_word: ἐκ τοῦ κόσμου εἰσίν
  choice: உலகத்திலிருந்து வந்தவர்கள்
  rationale: ἐκ என்பது மூலம் அல்லது தோற்றத்தை வலியுறுத்துகிறது. வெறும் ‘உலகத்துக்குரியவர்கள்’ என்பதைவிட, அவர்களின் இயல்பின் ஊற்றைத் தெளிவாகக் காட்டுகிறது.
- source_word: κόσμος
  choice: உலகம்
  rationale: இங்கு படைக்கப்பட்ட பிரபஞ்சத்தைக் குறிக்காமல், கடவுளுக்கு எதிரான மனித ஒழுங்கைக் குறிக்கிறது. இருப்பினும் மூலத்தின் யோவானியச் சொல்லாட்சியையும் இறையியல் ஒலியையும் காக்க விரிவான விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: διὰ τοῦτο
  choice: அதனால்
  rationale: அவர்களின் தோற்றத்தையும் அவர்களின் பேச்சையும் காரணவிளைவாக இயல்பான நவீன தமிழில் இணைக்கிறது.
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: உலகத்திலிருந்து பேசுகிறார்கள்
  rationale: மூலத்தில் மீண்டும் வரும் ἐκ τοῦ κόσμου என்ற தொடரை ஒரே விதமாகப் பேணி, அவர்களின் செய்தியின் மூலத்தை வலியுறுத்துகிறது.
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: உலகமும் அவர்களுக்குச் செவிகொடுக்கிறது
  rationale: ἀκούει என்பது வெறுமனே ஒலி கேட்பதை அல்லாமல், ஏற்றுக்கொண்டு கவனிப்பதைக் குறிக்கிறது. ‘செவிகொடுக்கிறது’ அந்த உணர்வைச் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோவானியப் பயன்பாட்டில் κόσμος என்பதன் பொருள்
  choice: கடவுளுக்கு எதிராக நிற்கும் மனித ஒழுங்கு
  alternative: படைக்கப்பட்ட உலகம் அல்லது நடுநிலையான மனிதகுலம்
  rationale: சூழல் ‘கடவுளிடமிருந்து’ வந்தவர்களையும் ‘உலகத்திலிருந்து’ வந்தவர்களையும் எதிரெதிராக நிறுத்துகிறது. எனவே இது புவியையோ படைப்பையோ குறிக்காமல் ஆன்மீக-ஒழுக்கச் சார்பைக் குறிக்கிறது; ஆனால் விளக்கத்தை உரைக்குள் விரிவாக்காமல் ‘உலகம்’ என்ற சொல்லே வைக்கப்படுகிறது.
- issue: αὐτοὶ என்பதன் வலியுறுத்தல்
  choice: முதன்மை உரையில் ‘அவர்கள்’
  alternative: ‘அவர்களே’
  rationale: கிரேக்கத்தில் ஓரளவு வலியுறுத்தல் இருந்தாலும், தமிழில் ‘அவர்களே’ என்பது தேவைக்கு அதிகமான பிரத்தியேக வலியுறுத்தலைத் தரக்கூடும். அடுத்த வசனத்துடனான எதிர்மறை ஒப்புமை சூழலிலேயே தெளிவாகிறது.
