source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: ta
  text: கடவுளை ஒருவரும் ஒருபோதும் கண்டதில்லை. நாம் ஒருவருக்கொருவர் அன்புகூர்ந்தால், கடவுள் நம்மில் நிலைத்திருக்கிறார்; அவருடைய அன்பு[a] நம்மில் முழுமையாக்கப்பட்டிருக்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள்மீது நாம் கொண்ட அன்பு.” ‘அவருடைய அன்பு’ என்ற கிரேக்கச் சொற்றொடர், கடவுள் நம்மீது காட்டும் அன்பையோ கடவுள்மீது நாம் காட்டும் அன்பையோ குறிக்கக்கூடும்; இங்குள்ள சூழல் கடவுளுடைய அன்பையே அதிகமாக ஆதரிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நம்மில் நிறைவுபெற்றிருக்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: கண்டதில்லை
  rationale: θεάομαι என்பதன் ‘காணுதல்/உற்றுப் பார்த்தல்’ என்ற பொருளையும், πώποτε உடன் வரும் நிறைவேற்றுக் காலத்தின் தொடரும் விளைவையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πώποτε
  choice: ஒருபோதும்
  rationale: மறுப்புடன் சேர்ந்து ‘எந்தக் காலத்திலும் இல்லை’ என்ற வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐὰν ἀγαπῶμεν
  choice: நாம் … அன்புகூர்ந்தால்
  rationale: ἐάν + நிகழ்காலத் துணைவினை வடிவம் காட்டும் நிபந்தனையை, தேவையற்ற கால அல்லது நிகழ்வுமுறை விளக்கம் சேர்க்காமல் காக்கிறது.
- source_word: ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பர உறவைக் குறிக்கும் இயல்பான, பொதுவாகப் புரியும் தமிழ் வடிவம்.
- source_word: μένει
  choice: நிலைத்திருக்கிறார்
  rationale: யோவானின் எழுத்துகளில் முக்கியமான μένω என்பதன் தொடர்ந்திருத்தல் மற்றும் உறவுசார் இருப்பு ஆகிய நுணுக்கங்களைப் பாதுகாக்கிறது.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: அவருடைய அன்பு
  rationale: சொல்லமைப்பின் உடைமை/எழுவாய்சார் பொருளை நேரடியாகக் காக்கிறது; சூழலில் முதன்மையாகக் கடவுள் நம்மீது காட்டும் அன்பைக் குறிக்கிறது, ஆனால் வேற்றுமைத் தொகையின் இயல்பான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τετελειωμένη ἐστιν
  choice: முழுநிறைவு பெற்றிருக்கிறது
  rationale: முடிவுற்ற செயல் தற்போது தொடரும் நிலையில் இருப்பதைக் காட்டும் சுற்றுவழி நிறைவேற்றுக் கால அமைப்பைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; ‘முழுமை/நிறைவு’ என்ற τελειόω சொல்லின் கருத்தையும் காக்கிறது.
- source_word: ἐν ἡμῖν
  choice: நம்மில்
  rationale: இரு இடங்களிலும் ஒரேபோல் மொழிபெயர்க்கப்பட்டு, கடவுள் நம்மில் நிலைத்திருக்கும் யோவானிய கருத்தைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ἡ ἀγάπη αὐτοῦ என்பதிலுள்ள αὐτοῦ வேற்றுமைத் தொகையின் பொருள்
  choice: கடவுளுடைய அன்பு நம்மில் முழுநிறைவு பெறுகிறது
  alternative: கடவுள்மீது நாம் கொண்ட அன்பு நம்மில் முழுநிறைவு பெறுகிறது
  rationale: உடனடிச் சூழல் கடவுளின் முன்முயற்சியான அன்பை வலியுறுத்துகிறது (வச. 10–11); ஆகவே எழுவாய்சார்/உடைமைப் பொருள் முதன்மையாகத் தேர்ந்தெடுக்கப்படுகிறது. எனினும் இலக்கண ரீதியாக உண்மையான மாற்றுப் பொருள் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நிலைத்திருக்கிறார்’ என்பது யோவானிய μένω சொல்லின் தொடர்ச்சியான உறவுசார் நுணுக்கத்தைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் உடனேயே வைக்கப்பட்டுள்ளன.
