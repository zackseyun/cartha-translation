- from: கடவுளை ஒருவரும் ஒருபோதும் கண்டதில்லை. நாம் ஒருவருக்கொருவர் அன்புகூர்ந்தால், கடவுள் நம்மில் நிலைத்திருக்கிறார்; அவருடைய அன்பு[a] நம்மில் முழுநிறைவு பெற்றிருக்கிறது[b].
