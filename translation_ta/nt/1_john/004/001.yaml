source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: ta
  text: அன்புக்குரியவர்களே[a], ஒவ்வொரு ஆவியையும் நம்பாதீர்கள்; மாறாக, அந்த ஆவிகளைச் சோதித்துப் பாருங்கள்; அவை கடவுளிடமிருந்து வந்தவையா என்று பாருங்கள்[b]. ஏனெனில், பல பொய்த் தீர்க்கதரிசிகள் உலகத்திற்குள் புறப்பட்டுச் சென்றிருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அன்பான நண்பர்களே.” கிரேக்கச் சொல் நேரடியாக “அன்புக்குரியவர்களே” என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, தீர்க்கதரிசனக் கூற்றுகளுக்குப் பின்னுள்ள ஆவிக்குரிய மூலத்தைச் சோதியுங்கள்; பின்னர் வரும் பகுதி மனித முகவர்களாகிய “பொய்த் தீர்க்கதரிசிகளை” குறிப்பிடுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்பை வெளிப்படுத்தும் பன்மை விளி வடிவத்தை இயல்பான, கண்ணியமான தமிழில் தருகிறது; யோவானின் அன்பான அழைப்பையும் ἀγαπάω/ἀγάπη என்பவற்றுடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: παντὶ πνεύματι
  choice: ஒவ்வொரு ஆவியையும்
  rationale: மனிதப் போதகர்களாக மட்டும் குறுக்காமல், தீர்க்கதரிசன உரிமைகோரல்களுக்குப் பின்னுள்ள ஆவிக்குரிய மூலங்களைச் சுட்டும் மூலமொழியின் நேரடியான சொல்லாட்சியைப் பேணுகிறது.
- source_word: πιστεύετε
  choice: நம்பாதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளையின் பொதுவான தடையை இயல்பான தமிழ் எதிர்மறைக் கட்டளையாகத் தருகிறது.
- source_word: δοκιμάζετε
  choice: சோதித்துப் பாருங்கள்
  rationale: உண்மைத்தன்மையை ஆராய்ந்து கண்டறியும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ πνεύματα
  choice: அந்த ஆவிகள்
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆவிகளையே பன்மையில் மீண்டும் சுட்டுகிறது; இயற்கைக்கு அப்பாற்பட்ட மூலங்களைப் பற்றிய உரையின் திறந்த தன்மையைப் பேணுகிறது.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: கடவுளிடமிருந்து வந்தவையா என்று
  rationale: ἐκ என்பதன் மூலாதாரப் பொருளைத் தெளிவாகக் காட்டுகிறது. கிரேக்கத்தில் வினை ஒருமையில் இருந்தாலும், பன்மை முன்னிலைக்கான பகிர்வுப் பொருளைத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: பொய்த் தீர்க்கதரிசிகள் பலர்
  rationale: ψευδοπροφῆται என்பதற்கான துல்லியமான, வழக்கில் நிலைபெற்ற தமிழ் இணை.
- source_word: ἐξεληλύθασιν
  choice: புறப்பட்டுச் சென்றிருக்கிறார்கள்
  rationale: முடிவுற்றுச் தற்போது விளைவைக் கொண்டிருக்கும் நிறைவுக்கால அம்சத்தையும் ‘வெளியே/முன்னே சென்றல்’ என்ற இயக்க உருவகத்தையும் காக்கிறது.
- source_word: εἰς τὸν κόσμον
  choice: உலகத்திற்குள்
  rationale: மனிதர்கள் வாழும் உலகிற்குள் அவர்கள் சென்றிருப்பதை இயல்பாகத் தருகிறது; ‘உலக அமைப்பு’ போன்ற விளக்கச் சேர்க்கையைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘ஆவிகள்’ என்பதன் குறிப்பு
  choice: மனிதத் தீர்க்கதரிசிகள் வழியாக வெளிப்படும் கூற்றுகளுக்குப் பின்னுள்ள உண்மையான ஆவிகள் அல்லது ஆவிக்குரிய மூலங்கள்
  alternative: வெறும் மனிதப் போதகர்கள் அல்லது தனித்த தீர்க்கதரிசன உரைகள்
  rationale: உரை ‘ஆவிகள்’ என்பதையும் ‘பொய்த் தீர்க்கதரிசிகள்’ என்பதையும் வேறுபடுத்திக் கூறுகிறது. ஆகவே மனித முகவர்களுக்குப் பின்னுள்ள ஆவிக்குரிய மூலத்தைச் சோதிப்பது என்ற பதற்றத்தை மொழிபெயர்ப்பு காக்கிறது; அதேவேளை அதை விரிவான விளக்கத்தால் முடிவுறுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. ‘ஆவி’, ‘தீர்க்கதரிசி’ போன்ற வேதாகமத்தில் நிலைபெற்ற சொற்கள் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவுச் சொற்பயன்பாடுகள் தவிர்க்கப்பட்டுள்ளன.
