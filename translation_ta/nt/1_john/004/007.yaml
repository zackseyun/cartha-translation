source:
  edition: SBLGNT
  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: ta
  text: அன்புக்குரியவர்களே[a], நாம் ஒருவருக்கொருவர் அன்புகூருவோமாக. ஏனெனில் அன்பு கடவுளிடமிருந்து வருகிறது; அன்புகூருகிற ஒவ்வொருவரும் கடவுளிடமிருந்து பிறந்திருக்கிறார், கடவுளை அறிகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அருமை நண்பர்களே.” கிரேக்க அழைப்பு சொல்லுக்கு சொல் “அன்புக்குரியவர்களே” என்று பொருள்படும்; வசனம் முழுவதும் திரும்ப வரும் அன்புச் சொற்குடும்பத்தையும் இது எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: பன்மை விளிவேற்றுமையிலுள்ள அன்பான அழைப்பை இயல்பான தமிழில் வெளிப்படுத்துவதோடு, வசனம் முழுவதும் திரும்பத் திரும்ப வரும் ἀγαπ- அன்புச் சொற்குடும்பத்துடனான தொடர்பையும் காக்கிறது.
- source_word: ἀγαπῶμεν
  choice: நாம் ... அன்புகூருவோமாக
  rationale: முதல் நபர் பன்மை, நிகழ்காலத் தூண்டுதல் வினைமுற்றின் அழைப்புப் பொருளை dignified modern Tamil-இல் இயல்பாகத் தருகிறது; தொடர்ச்சியை வெளிப்படையாகச் சேர்த்து மிகைவிளக்கம் அளிக்கவில்லை.
- source_word: ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பரச் சுட்டுப்பெயரின் நேரான, இயல்பான தமிழ் இணை.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அழைப்பிற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ἡ ἀγάπη
  choice: அன்பு
  rationale: பொதுப்பொருளில் உள்ள பெயர்ச்சொல்லை நேரடியாகத் தருவதோடு, வசனத்தின் அன்புச் சொல் மறுமொழியையும் காக்கிறது.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: கடவுளிடமிருந்து வருகிறது
  rationale: ἐκ குறிக்கும் மூலத்தை இயல்பான தமிழில் தெளிவுபடுத்துகிறது; சொல்லுக்குச் சொல் 'இருக்கிறது' என்பதைக் காட்டிலும் தமிழில் மூலப்பொருளைச் சரியாக வெளிப்படுத்துகிறது.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: அன்புகூருகிற ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்புவினையின் பொதுவான வகைப்பாட்டுப் பொருளைக் காக்கிறது.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: கடவுளிடமிருந்து பிறந்திருக்கிறார்
  rationale: γεγέννηται என்பதன் நிறைவேற்றப்பட்ட செயலும் தொடரும் விளைவும் 'பிறந்திருக்கிறார்' என்பதில் வெளிப்படுகின்றன; ἐκ என்பதன் மூலப்பொருளும் காக்கப்படுகிறது.
- source_word: γινώσκει τὸν θεόν
  choice: கடவுளை அறிந்திருக்கிறார்
  rationale: நிகழ்காலத்தில் தொடரும், உறவுசார் அறிதலை இயல்பான தமிழில் தருகிறது; 'அறிந்துகொண்டார்' போன்ற தொடக்கநிலை நுணுக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: அன்பு, கடவுளிடமிருந்து பிறத்தல், கடவுளை அறிதல் ஆகியவற்றின் உறவு
  choice: அன்புகூருகிறவர் கடவுளிடமிருந்து பிறந்திருக்கிறார், கடவுளை அறிந்திருக்கிறார் என்ற யோவானின் இணைப்பை நேரடியாக மொழிபெயர்த்தல்
  alternative: இதைத் தொழில்நுட்பமான இரட்சிப்பொழுங்குக்கான இறுக்கமான சோதனையாகவோ, மறுபிறப்பிலிருந்து பிரிந்த வெறும் அறநெறிக் கூற்றாகவோ விளக்குதல்
  rationale: கிரேக்க உரை மூன்றையும் தெளிவாக இணைக்கிறது; மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தைக் காக்கிறது, ஆனால் பிற்காலப் பிரிவுசார் கோட்பாட்டு வரிசையைச் சேர்ப்பதில்லை.
- issue: ἀγαπ- சொற்குடும்பத்தின் மறுமொழி
  choice: அன்புக்குரியவர்களே / அன்புகூருவோமாக / அன்பு / அன்புகூருகிற என்று ஒரே சொற்குடும்பத்தைப் பயன்படுத்துதல்
  alternative: தொடக்க அழைப்பை 'அருமை நண்பர்களே' என்று மாற்றி சொல்விளையாட்டுத் தொடர்பை மறைத்தல்
  rationale: மூலத்தின் இலக்கிய மற்றும் இறையியல் வலியுறுத்தல் ἀγαπ- வேர் மீண்டும் மீண்டும் வருவதில் அமைந்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. 'அன்புகூருவோமாக' என்பது சற்று உயர்நடையாக இருந்தாலும் வேதாகமப் பொதுவாசிப்புக்கு இயல்பான கூட்டழைப்பைத் தெளிவாகக் காட்டுகிறது. 'கடவுள்' என்பது θεός என்பதற்கான நேரான, சமயப்பிரிவு சாராத பொதுத்தமிழ்ச் சொல்.
