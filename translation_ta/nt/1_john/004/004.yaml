source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: ta
  text: பிள்ளைகளே, நீங்கள் கடவுளிடமிருந்து வந்தவர்கள்; மேலும், அவர்களை வென்றிருக்கிறீர்கள். ஏனெனில் உங்களுக்குள் இருப்பவர் உலகத்தில் இருப்பவரைவிடப் பெரியவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களை’ என்பது முன்பு குறிப்பிடப்பட்ட எதிரிகளைக், குறிப்பாகப் பொய்த் தீர்க்கதரிசிகளைக் குறிக்கிறது. ‘உங்களுக்குள் இருப்பவர்’ மற்றும் ‘உலகத்தில் இருப்பவர்’ ஆகியோரின் அடையாளங்களை கிரேக்க உரை வெளிப்படையாகக் கூறவில்லை; சூழல் முதலாமவரைக் கடவுள் அல்லது அவரது ஆவி என்றும், இரண்டாமவரை உலகத்தின் பின்னால் செயல்படும் தீயவன் என்றும் உணர்த்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாக வரும் பன்மை முன்னிலைப்பெயரின் வலியுறுத்தலைத் தமிழில் இயல்பான சொல் வரிசையிலும் நேரடி அழைப்பிலும் காக்கிறது.
- source_word: ἐκ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து வந்தவர்கள்
  rationale: ἐκ குறிக்கும் மூலத்தையும், கடவுளோடு உள்ள சார்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘கடவுளுக்குரியவர்கள்’ என்று மாற்றி மூலக் கருத்தைச் சுருக்கவில்லை.
- source_word: τεκνία
  choice: பிள்ளைகளே
  rationale: யோவான் பயன்படுத்தும் குடும்பப் பாசமுள்ள அழைப்பை இயல்பாகக் காக்கிறது; ‘சிறு பிள்ளைகளே’ என்பது இன்றைய தமிழில் வயதைத் தேவையின்றி வலியுறுத்தும்.
- source_word: νενικήκατε
  choice: வென்றிருக்கிறீர்கள்
  rationale: முடிவுற்ற வெற்றியும் அதன் தொடரும் விளைவும் கொண்ட கிரேக்க நிறைவுக்காலத்தின் நுணுக்கத்தைத் தமிழின் ‘இருக்கிறீர்கள்’ அமைப்பு தக்கவைக்கிறது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட எதிரிகளையே சுட்டுகிறது; முதன்மை உரையில் அவர்களைப் பொய்த் தீர்க்கதரிசிகள் அல்லது ஆவிகள் என்று தேவையின்றி வெளிப்படையாக்கவில்லை.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: விசுவாசிகள் அவர்களை வென்றதற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: μείζων
  choice: பெரியவர்
  rationale: ஒப்பீட்டை வெறும் வலிமையாகக் குறுக்காமல், கிரேக்கச் சொல்லின் விரிவான ‘greater’ பொருளைக் காக்கிறது.
- source_word: ὁ ἐν ὑμῖν
  choice: உங்களுக்குள் இருப்பவர்
  rationale: தனிப்பட்ட ஒருவரைச் சுட்டும் கிரேக்க அமைப்பைக் காக்கிறது; அவர் கடவுளா அல்லது அவரது ஆவியா என்பதை முதன்மை உரையில் வெளிப்படையாகத் தீர்மானிக்கவில்லை.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: உலகத்தில் இருப்பவர்
  rationale: முந்தைய சொற்றொடருடன் இணையான அமைப்பைக் காத்து, உலகத்தின் பின்னால் செயல்படும் நபரின் அடையாளத்தை மறைமுகமாகவே விடுகிறது.
- source_word: κόσμῳ
  choice: உலகத்தில்
  rationale: யோவானிய சூழலில் கடவுளுக்கு எதிரான உலக ஒழுங்கின் நிழற்பொருள் இருந்தாலும், அடிப்படைச் சொல்லான ‘உலகம்’ என்பதையே மொழிபெயர்க்கிறது.
theological_decisions:
- issue: ‘உங்களுக்குள் இருப்பவர்’ மற்றும் ‘உலகத்தில் இருப்பவர்’ ஆகியோரின் அடையாளம்
  choice: இரு அடையாளங்களும் முதன்மை உரையில் மறைமுகமாகவே வைக்கப்பட்டுள்ளன.
  alternative: முதலாமவரைக் கடவுள் அல்லது பரிசுத்த ஆவி என்றும், இரண்டாமவரைச் சாத்தான் அல்லது தீயவன் என்றும் வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: சூழல் அந்த அடையாளங்களை வலுவாக உணர்த்தினாலும், கிரேக்க உரை இருவரையும் பெயரிடவில்லை. ஆகவே உரையின் இறையியல் எதிர்நிலையையும் சொல்லப்படாத நுணுக்கத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘பிள்ளைகளே’ என்ற அழைப்பு பாசத்தை இயல்பாக வெளிப்படுத்துகிறது. ‘கடவுள்’ பொதுவாகப் புரியும் சமயச் சார்பற்ற சொலாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது; மறைமுகமான நபர் அடையாளங்கள் விளக்கவுரையால் முதன்மை உரையில் நிரப்பப்படவில்லை.
