base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: ta
  text: 'இதனால் கடவுளுடைய ஆவியை நீங்கள் அறிந்துகொள்கிறீர்கள்: இயேசுவே மெசியா[a] மாம்சத்தில் வந்திருக்கிறார்[b] என்று[c] அறிக்கையிடும் ஒவ்வோர் ஆவியும் கடவுளிடமிருந்து வந்ததே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இயேசு கிறிஸ்து.’ கிரேக்க Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பொருளுள்ள பட்டம்; இங்கு அது ‘மெசியா’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘வந்தார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிறைவுநிலை வினையெச்சம், அவர் மாம்சத்தில் வந்த நிகழ்வின் தொடரும் முக்கியத்துவத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: இன்னும் சொல்லுக்குச் சொல் அமைப்பில், ‘மாம்சத்தில் வந்திருக்கிறவராகிய இயேசு மெசியாவை அறிக்கையிடும்.’
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: இதனால்
  rationale: ஆவிகளைப் பகுத்தறிவதற்கான அடையாளத்தை அறிமுகப்படுத்தும் தொடராக இருப்பதால், கருவிப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: γινώσκετε
  choice: நீங்கள் அறிந்துகொள்கிறீர்கள்
  rationale: இதை கட்டளையாக அல்லாமல் நிகழ்காலக் குறிப்பு வினையாகப் புரிந்துகொண்டு, அனுபவத்தின் மூலம் அடையாளம் காணும் பொருளைப் பாதுகாக்கிறது.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: கடவுளுடைய ஆவி
  rationale: கட்டுரையுடனான ஒருமை வடிவமும் சூழலும் கடவுளின் ஆவியைக் குறிப்பதால் இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: πᾶν πνεῦμα
  choice: ஒவ்வோர் ஆவியும்
  rationale: சோதிக்கப்படும் எந்த ஆவிக்கும் பொருந்தும் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁμολογεῖ
  choice: அறிக்கையிடும்
  rationale: வெளிப்படையாக ஒப்புக்கொண்டு அறிவிக்கும் யோவானியப் பயன்பாட்டின் வலிமையைத் தக்கவைக்கிறது.
- source_word: Ἰησοῦν Χριστόν
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதை பெயரின் ஒரு பகுதிபோல மட்டும் காட்டாமல், இயேசுவின் பட்டமாகவும் அதன் மெசியத் தன்மையுடனும் தருகிறது.
- source_word: ἐν σαρκὶ
  choice: மாம்சத்தில்
  rationale: இயேசுவின் உண்மையான உடல்சார்ந்த மனித வருகையை உறுதிப்படுத்தும் மூலமொழியின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἐληλυθότα
  choice: வந்திருக்கிறார்
  rationale: நிறைவுற்ற வினையெச்சத்தின் தொடரும் விளைவைத் தமிழின் நிறைவுநிலை வடிவால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: கடவுளிடமிருந்து வந்தது
  rationale: ἐκ குறிக்கும் தோற்றுவாய் அல்லது மூலத்தைத் தெளிவாகத் தருகிறது; தமிழில் ஆவியின் மூலத்தை இயல்பாகச் சொல்கிறது.
theological_decisions:
- issue: τὸ πνεῦμα τοῦ θεοῦ என்பது பரிசுத்த ஆவியைச் சிறப்பாகக் குறிக்கிறதா அல்லது கடவுளிடமிருந்து வரும் ஓர் ஆவியைப் பொதுவாகக் குறிக்கிறதா
  choice: கடவுளுடைய ஆவி
  alternative: கடவுளிடமிருந்து வரும் ஆவி
  rationale: ஒருமை, கட்டுரை, அடுத்துவரும் ‘ஒவ்வோர் ஆவியும்’ என்ற எதிர்நிலை ஆகியவை கடவுளின் ஆவியைச் சுட்டுகின்றன; பின்னாளைய தொழில்நுட்பச் சொற்களைச் சேர்க்காமல் இதைத் தருகிறது.
- issue: ἐν σαρκὶ ἐληλυθότα என்பதன் கிறிஸ்துவியல் வலிமை
  choice: மாம்சத்தில் வந்திருக்கிறார்
  alternative: மனிதராக வந்திருக்கிறார்
  rationale: உண்மையான மாம்ச வருகையை பலவீனப்படுத்தாமலும் மூலத்தில் இல்லாத பிற்காலத் தத்துவச் சொற்களைச் சேர்க்காமலும் கிரேக்கச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- issue: ὁμολογεῖ + இரண்டாம் வேற்றுமை பெயர் மற்றும் வினையெச்சத்தின் தொடரியல் உறவு
  choice: இயேசு மெசியா மாம்சத்தில் வந்திருக்கிறார் என்று அறிக்கையிடும்
  alternative: மாம்சத்தில் வந்திருக்கிற இயேசு மெசியாவை அறிக்கையிடும்
  rationale: தமிழில் தெளிவாகவும் இயல்பாகவும் ஒப்புரையைத் தருகிறது; கிரேக்கத் தொடரின் பெயரடைசார் அமைப்பு மாற்று வாசிப்பாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆவி’, ‘மாம்சம்’, ‘அறிக்கையிடுதல்’ போன்ற சொற்கள் உரையின் இறையியல் மற்றும் யோவானியத் தன்மையைப் பாதுகாக்கின்றன; வாக்கிய அமைப்பு மட்டும் இயல்பான தமிழுக்கேற்ப சீரமைக்கப்பட்டுள்ளது.
