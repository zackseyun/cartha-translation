source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: ta
  text: 'அன்பு இதில்தான் உள்ளது: நாம் கடவுளை அன்புகூர்ந்தோம் என்பதில் அல்ல; அவரே நம்மீது அன்புகூர்ந்து, நம்முடைய பாவங்களுக்காகப் பரிகாரப் பலியாக[a] தமது மகனை அனுப்பினார் என்பதில்தான் உள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரிகாரப் பலி” என்பதற்கு “சாந்திப்பலி” அல்லது “பாவநிவாரணப் பலி” என்றும் மொழிபெயர்க்கலாம். ἱλασμός என்ற கிரேக்கச் சொல், பாவங்கள் தொடர்பாக மகன் செய்யும் பரிகாரத்தைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: அன்பு என்பது இதில்தான் இருக்கிறது
  rationale: யோவானின் வரையறைசார் சொற்றொடரையும் அடுத்து வருவதைச் சுட்டும் அமைப்பையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: … என்பதில் அல்ல; … என்பதில்தான்
  rationale: அன்பின் காரணத்தை மட்டும் கூறுவதாக மாற்றாமல், அது எதில் வெளிப்படுகிறது என்பதை வரையறுக்கும் கிரேக்க எதிர்மறை–நேர்மறை முரணைத் தக்கவைக்கிறது.
- source_word: ἠγαπήκαμεν τὸν θεόν
  choice: நாம் கடவுளிடம் அன்புகூர்ந்தோம்
  rationale: மனிதர்களின் அன்பை இறைவனை நோக்கிய உறவுசார் செயலாகத் தெளிவாகக் கூறுகிறது; கிரேக்க நிறைவேற்றுக் காலத்தின் தொடர்விளைவைத் தமிழில் மிகைப்படுத்தாமல் சூழல் வழி விடுகிறது.
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: அவரே நம்மிடம் அன்புகூர்ந்து
  rationale: αὐτός என்பதன் வலியுறுத்தலையும் ‘நாம்’ என்பதற்கும் கடவுளுக்கும் உள்ள எதிர்மறை ஒப்புமையையும் ‘அவரே’ தெளிவாக்குகிறது.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: தமது மகனை அனுப்பினார்
  rationale: அனுப்புதல் மொழியையும் தந்தை–மகன் உறவையும் சுருக்கமாகவும் கண்ணியமாகவும் காக்கிறது.
- source_word: ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: நம்முடைய பாவங்களுக்கான பரிகாரப் பலியாக
  rationale: ἱλασμός குறிக்கும் பாவங்களைப் பலியால் தீர்க்கும் செயலை வாசிக்கத்தக்க தமிழில் தருகிறது; தணித்தல் அல்லது பாவநீக்கம் என்ற ஓரே கோட்பாட்டு விளக்கத்திற்குள் சொல்லைச் சுருக்கவில்லை.
theological_decisions:
- issue: ἱλασμός என்ற பாவநிவாரணம் சார்ந்த சொல்லின் மொழிபெயர்ப்பு
  choice: பரிகாரப் பலி
  alternative: சாந்திப்பலி; பாவநிவாரணப் பலி
  rationale: மகன் பலியாக அனுப்பப்பட்டு பாவங்களைச் செயல்திறனுடன் கையாளுகிறார் என்ற மையக் கருத்தை ‘பரிகாரப் பலி’ இயல்பாகக் கூறுகிறது. கிரேக்கச் சொல் தேவகோபத் தணித்தல் மற்றும் பாவநீக்கம் ஆகிய கருத்துகளுடன் தொடர்புடையதாகப் புரிந்துகொள்ளப்படுவதால், அவற்றில் ஒன்றை மட்டும் முதன்மை உரையில் தீர்மானமாகத் திணிக்காமல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடை. கடவுளைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘அன்பு என்பது இதில்தான் இருக்கிறது’ என்ற அமைப்பு மூலத்தின் வலியுறுத்தலையும் வரையறைத் தன்மையையும் காக்கிறது.
