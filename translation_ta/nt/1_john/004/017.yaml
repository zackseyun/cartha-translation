id: 1JN.4.17
reference: 1 John 4:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: ta
  text: இதனால்[a], அன்பு நம்மோடு[b] முழுமை பெற்றிருக்கிறது; நியாயத்தீர்ப்பு நாளில் நாம் துணிவுடன்[c] இருக்கும்படி. ஏனெனில், அவர்[d] எப்படியிருக்கிறாரோ, அப்படியே நாமும் இந்த உலகத்தில் இருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இதிலே’ அல்லது ‘இவ்விதத்தில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் வழிமுறை, விதம், அல்லது எந்த அம்சத்தில் அன்பு முழுமை பெறுகிறது என்பதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘நம்மிடையே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘உறுதியான நம்பிக்கையுடன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘அவர்’ என்பது பெரும்பாலும் இயேசுவைக் குறிக்கிறது; சிலர் இதை பொதுவாக தேவனைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: இதனால்
  rationale: இந்தச் சொற்றொடர் ‘இதிலே’, ‘இதனால்’, ‘இவ்விதத்தில்’ என்ற பொருள்களைத் தரக்கூடும். இங்கு பின்னர் வரும் காரணவாக்கியத்துடன் இயல்பாக இணைவதற்காக ‘இதனால்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τετελείωται
  choice: முழுமை பெற்றிருக்கிறது
  rationale: நிறைவேற்றப்பட்ட செயலும் அதன் தொடரும் விளைவும் சேர்ந்துள்ள கிரேக்க நிறைவுக்காலச் செயலப்பாட்டு வடிவத்தை இது வெளிப்படுத்துகிறது. அன்பில் முன்பு ஒழுக்கக் குறை இருந்தது என்று உணர்த்தாமல், அது குறிக்கப்பட்ட நிறைவை அடைந்ததைச் சொல்கிறது.
- source_word: ἡ ἀγάπη
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான இயல்பான, பரந்த தமிழ் இணை; அது தேவனுடைய அன்பா, விசுவாசிகளின் அன்பா என்பதை மொழிபெயர்ப்பு குறுக்கிவிடவில்லை.
- source_word: μεθ’ ἡμῶν
  choice: நம்மோடு
  rationale: μετά + genitive என்பதன் அடிப்படை ‘உடன்’ என்ற உறவுப்பொருளை நெருக்கமாகப் பாதுகாக்கிறது. ‘நம்மிடையே’ என்பது சூழலுக்கு ஏற்ற மாற்று; அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παρρησίαν
  choice: துணிவுடன்
  rationale: தேவனுக்கு முன்பாக அச்சமின்றி நிற்கும் நம்பிக்கையையும் வெளிப்படையான தைரியத்தையும் குறிக்கிறது. தமிழில் வாக்கியத்தோடு இயல்பாக இணைய வினையடை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: நியாயத்தீர்ப்பு நாளில்
  rationale: இறுதி நியாயத்தீர்ப்பைக் குறிக்கும் வழக்கமான வேதாகமச் சொற்றொடரை தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள துணிவுக்கான அடிப்படையை அறிமுகப்படுத்தும் காரணப்பொருளை வெளிப்படையாகக் காட்டுகிறது.
- source_word: καθὼς ἐκεῖνός ἐστιν
  choice: அவர் இருப்பதுபோலவே
  rationale: நிகழ்கால ‘இருக்கிறார்’ என்ற கருத்தையும் ஒப்பீட்டின் வலிமையையும் காக்கிறது. ἐκεῖνος என்பதன் குறிப்பிடுபவர் மூலத்தைப் போல பிரதிப்பெயராகவே விடப்படுகிறார்.
- source_word: καὶ ἡμεῖς ἐσμεν
  choice: நாமும் ... இருக்கிறோம்
  rationale: καθώς ... καί என்ற ஒப்புமை அமைப்பை இயல்பான தமிழில் ‘போலவே நாமும்’ என வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: இந்த உலகத்தில்
  rationale: தற்போதைய மனித வாழ்வின் உலகச் சூழலைக் குறிக்கும் κόσμος என்பதற்கான இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: ἐκεῖνος (‘அவர்’) என்பதன் குறிப்பிடுபவர்
  choice: முதன்மையாக இயேசு கிறிஸ்து/குமாரனைக் குறிக்கிறது; ஆனால் பெயரை உரையில் சேர்க்காமல் ‘அவர்’ என வைக்கப்பட்டது
  alternative: பொதுவாக தேவனைக் குறிக்கிறது
  rationale: 1 யோவானில் ἐκεῖνος பல இடங்களில் இயேசுவைச் சுட்டுகிறது; எனினும் இவ்வசனத்தில் பெயர் வெளிப்படையாக இல்லை. ஆகவே மூலத்தின் மறைமுகத்தன்மை பிரதிப்பெயரால் பாதுகாக்கப்பட்டு, சாத்தியமான குறிப்பிடுபவர்கள் அடிக்குறிப்பில் விளக்கப்படுகின்றனர்.
- issue: முழுமை பெற்ற அன்பின் தன்மை
  choice: விசுவாசிகளோடு தொடர்பில் அன்பு அதன் குறிக்கப்பட்ட நிறைவை அடைந்து, நியாயத்தீர்ப்பு நாளுக்கான துணிவை விளைவிக்கிறது
  alternative: தேவன்மீதான நமது அன்பு மட்டுமே ஒழுக்கரீதியாகப் பூரணமாகிறது; அல்லது நம்மீதான தேவனுடைய அன்பு மட்டுமே நிறைவை அடைகிறது
  rationale: கிரேக்க உரை அன்பின் திசையை ஒரே வகையாக வரையறுக்கவில்லை. ‘அன்பு நம்மோடு முழுமை பெற்றிருக்கிறது’ என்பது இந்த இறையியல் இழுபறியைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாக வாசிக்கக்கூடியதாயும், அதே நேரத்தில் நியாயத்தீர்ப்பு மற்றும் அன்பின் நிறைவு ஆகிய கருத்துகளுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘நம்மோடு’ என்பது வழக்கமான தமிழில் சற்றே செறிவான அமைப்பாக இருந்தாலும், மூலத்தின் உறவுப்பொருளையும் அதன் உண்மையான தெளிவின்மையையும் காக்கிறது; இயல்பான ‘நம்மிடையே’ அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
