id: 1JN.4.3
reference: 1 John 4:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: ta
  text: இயேசுவை அறிக்கையிடாத ஒவ்வோர் ஆவியும் கடவுளிடமிருந்து வந்ததல்ல.[a] இதுவே அந்திக்கிறிஸ்துவின் ஆவி.[b] அது வருகிறதென்று நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்; இப்பொழுதே அது உலகத்தில் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “இயேசு கிறிஸ்து மனிதராக வந்திருக்கிறார் என்று அறிக்கையிடாத” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “இது அந்திக்கிறிஸ்துவுக்குரியது.” கிரேக்கத்தில் “ஆவி” என்ற சொல் இங்கு மீண்டும் எழுதப்படாமல் உணர்த்தப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: ஒவ்வோர் ஆவியும்
  rationale: πᾶν என்பது இங்கு பகிர்நிலைப் பொருளில் ‘ஒவ்வொன்றும்’ என வருகிறது. சூழலில் பரிசுத்த ஆவியைக் குறிக்காமல், சோதிக்கப்பட வேண்டிய ஆவிக்குரிய தாக்கங்கள் அல்லது உரிமைக்கோரல்களைக் குறிக்கிறது.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: இயேசுவை அறிக்கையிடாத
  rationale: SBLGNT-யின் குறுகிய வாசகமான ‘இயேசுவை அறிக்கையிடுதல்’ என்பதையே பின்பற்றுகிறது. ὁμολογέω என்பதிலுள்ள வெளிப்படையான ஒப்புதல் மற்றும் பற்றுறுதி ஆகிய நுண்பொருள்களை ‘அறிக்கையிடு’ காக்கிறது.
- source_word: ἐκ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து வந்ததல்ல
  rationale: ἐκ மூலத்தையோ தோற்றத்தையோ குறிக்கிறது. தமிழில் முழுமையான இயல்பான வாக்கியமாக அமைய ‘வந்தது’ சேர்க்கப்பட்டுள்ளது; புதிய கருத்து எதுவும் சேர்க்கப்படவில்லை.
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: இதுவே அந்திக்கிறிஸ்துவின் ஆவி
  rationale: கிரேக்கத்தில் πνεῦμα இரண்டாம் முறை வெளிப்படையாக இல்லை என்றாலும், முந்தைய கூறிலிருந்து அது தெளிவாக உணர்த்தப்படுகிறது. இயல்பான தமிழுக்காக ‘ஆவி’ நிரப்பப்பட்டுள்ளது; மூலத்தின் சொல்லெச்சம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: அது வருகிறதென்று நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்
  rationale: ὃ இடைச்சொல் நடுநிலை ஒருமையில் இருப்பதால், ஆவியையே சுட்டும் ‘அது’ பயன்படுத்தப்பட்டுள்ளது. ‘அவன்’ என்று மொழிபெயர்த்து அந்திக்கிறிஸ்து என்ற நபரை நேரடி முன்னிலையாகத் தீர்மானிப்பது தவிர்க்கப்பட்டுள்ளது.
- source_word: ἤδη ἐν τῷ κόσμῳ ἐστίν
  choice: இப்பொழுதே அது உலகத்தில் இருக்கிறது
  rationale: ἤδη வலியுறுத்தும் தற்போதைய இருப்பை ‘இப்பொழுதே’ இயல்பாக வெளிப்படுத்துகிறது; κόσμος என்பதற்கு ‘உலகம்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: மறுக்கப்படும் அறிக்கையின் உரை வடிவம்
  choice: SBLGNT-யின் குறுகிய வாசகமான ‘இயேசுவை அறிக்கையிடாத’ என்பது முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
  alternative: ‘இயேசு கிறிஸ்து மனிதராக வந்திருக்கிறார் என்று அறிக்கையிடாத’ என்ற விரிவான கையெழுத்துப் பிரதிவாசகம்.
  rationale: விமர்சன மூலஉரை குறுகிய வாசகத்தை ஆதரிக்கிறது; முந்தைய வசனம் அறிக்கையின் கிறிஸ்துவியல் உள்ளடக்கத்தை ஏற்கெனவே கூறுகிறது. விரிவான பாரம்பரிய வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τὸ τοῦ ἀντιχρίστου என்பதிலுள்ள சொல்லெச்சத்தை எவ்வாறு வெளிப்படுத்துவது
  choice: இயல்பான தமிழுக்காக ‘அந்திக்கிறிஸ்துவின் ஆவி’ என்று மறைந்துள்ள பெயர்ச்சொல் வெளிப்படுத்தப்பட்டுள்ளது.
  alternative: சொல்லுக்குச் சொல் வடிவில் ‘இது அந்திக்கிறிஸ்துவுக்குரியது’.
  rationale: முந்தைய கூறிலுள்ள πνεῦμα தான் விடுபட்ட பெயர்ச்சொல் என்பது சூழலில் தெளிவு. அதை நிரப்புவது பொருளை மாற்றாமல் வாசிப்பைத் தெளிவாக்குகிறது; மூலத்தின் சொல்லெச்சம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: வரப்போகிறதன் இலக்கணச் சுட்டு
  choice: நடுநிலைச் சுட்டாக ‘அது வருகிறதென்று’ பயன்படுத்தப்பட்டுள்ளது.
  alternative: ‘அவன் வருகிறான் என்று’, இதனால் அந்திக்கிறிஸ்து என்ற நபர் நேரடியாகச் சுட்டப்படுவார்.
  rationale: ὃ என்பது நடுநிலை; எனவே மூலத்தின் இலக்கணத் தெளிவின்மையையும் ஆவியைக் குறிக்கும் சாத்தியத்தையும் காக்க ‘அது’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அறிக்கையிடு’, ‘ஆவி’, ‘அந்திக்கிறிஸ்து’ ஆகியவை யோவானின் கருத்தியல் தொடர்ச்சியைப் பேணும் வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
