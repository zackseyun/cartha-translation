source:
  edition: SBLGNT
  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: ta
  text: யார் இயேசு கடவுளின் மகன் என்று அறிக்கையிடுகிறாரோ, அவரில் கடவுள் நிலைத்திருக்கிறார்[a]; அவரும் கடவுளில் நிலைத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலைத்திருக்கிறார்’ என்பதற்குப் பதிலாக ‘தங்கியிருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தின் μένω (மெனோ) என்பது யோவானின் எழுத்துகளில் முக்கியமான சொல்; அது ‘நிலைத்திருத்தல்’ அல்லது ‘தங்கியிருத்தல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: யார் … அறிக்கையிடுகிறாரோ
  rationale: இது பொதுவாக எவரையும் குறிக்கும் வரையறையற்ற தொடர்பு வாக்கியம். ‘யார் … செய்கிறாரோ’ என்பது அதன் பொதுப்படுத்தும் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ὁμολογήσῃ
  choice: அறிக்கையிடுகிறாரோ
  rationale: யோவானின் சூழலில் இந்த வினை, இயேசுவைப் பற்றிய உண்மையை வெளிப்படையாக ஏற்று உரைப்பதைக் குறிக்கிறது. ‘அறிக்கையிடுதல்’ என்பது வெறும் மனதளவிலான ஒப்புதலைவிட அந்த வெளிப்படையான ஒப்புதலைத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: இயேசு கடவுளின் மகன்
  rationale: கிரேக்கத்தின் நேரடியான கிறிஸ்துவியல் உரிமைக்கூற்றை விளக்கச் சேர்க்கையின்றி இயல்பான தமிழில் தருகிறது.
- source_word: ἐν αὐτῷ μένει
  choice: அவரில் கடவுள் நிலைத்திருக்கிறார்
  rationale: μένω என்ற யோவானிய முக்கியச் சொல்லின் நீடித்த உறவுநிலையை ‘நிலைத்திருக்கிறார்’ காக்கிறது. αὐτῷ என்பதைக் பாலினப் பொதுமையுடன் ‘அவரில்’ என்று வழங்குகிறது.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: அவரும் கடவுளில் நிலைத்திருக்கிறார்
  rationale: கிரேக்கத்தில் இரண்டாம் பகுதியில் வினை விடுபட்டிருந்தாலும் அது முதல் பகுதியிலிருந்து புரிந்துகொள்ளப்படுகிறது. தமிழில் தெளிவும் இணை அமைப்பும் நிலைக்க வினை மீண்டும் வெளிப்படையாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: பரஸ்பர உள்ளிருப்பைக் குறிக்கும் மொழி
  choice: ‘அவரில் கடவுள் நிலைத்திருக்கிறார்; அவரும் கடவுளில் நிலைத்திருக்கிறார்’ என்ற இருதிசை அமைப்பை அப்படியே காத்தல்
  alternative: ‘அவரில் கடவுள் வாழ்கிறார்; அவரும் கடவுளோடு இணைந்திருக்கிறார்’
  rationale: மூலவசனம் கூறும் பரஸ்பர உறவையும் அதன் இறையியல் அழுத்தத்தையும் விளக்கமாகச் சுருக்காமலும் பிற்காலக் கோட்பாட்டு மொழியைச் சேர்க்காமலும் காக்கிறது.
- issue: ὁ υἱὸς τοῦ θεοῦ என்ற கிறிஸ்துவியல் பட்டம்
  choice: கடவுளின் மகன்
  alternative: கடவுளுடைய மகன்
  rationale: மூலத்தின் முழுமையான பட்டத்தையும் இயேசுவைப் பற்றிய வெளிப்படையான அறிக்கையையும் இயல்பான நவீன தமிழில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளையும் பொதுவான மனித நபரையும் குறிப்பிடும் இடங்களில் மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; பாலினம் தேவையின்றி சேர்க்கப்படவில்லை.
