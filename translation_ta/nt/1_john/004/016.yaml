id: 1JN.4.16
reference: 1 John 4:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: ta
  text: தேவன் நம்மில் கொண்டிருக்கும் அன்பை நாமும் அறிந்திருக்கிறோம், நம்பியுமிருக்கிறோம்.[a] தேவன் அன்பாக இருக்கிறார். அன்பில் நிலைத்திருப்பவன் தேவனில் நிலைத்திருக்கிறான்; தேவனும் அவனில்[b] நிலைத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நம்மில்” என்பது விசுவாசிகளின் உள்ளத்தில் அல்லது அவர்களிடையே என்று பொருள்படலாம். சூழலின் அடிப்படையில், “தேவன் நம்மீது வைத்திருக்கும் அன்பை” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “அவனில்” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் ஆண்பால் ஒருமையில் உள்ளது; இங்கே அது அன்பில் நிலைத்திருக்கும் எவரையும் பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: அறிந்திருக்கிறோம்
  rationale: நிகழ்காலத்தில் தொடரும் அறிதல் நிலையைக் குறிக்கும் கிரேக்க நிறைவுக்காலத்தின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πεπιστεύκαμεν
  choice: நம்பியுமிருக்கிறோம்
  rationale: முன்பு தொடங்கி இப்போதும் நிலைத்திருக்கும் நம்பிக்கையை நிறைவுக்கால நயத்துடன் காட்டுகிறது; καί என்பதையும் ‘-உம்’ தக்கவைக்கிறது.
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: தேவன் நம்மில் கொண்டிருக்கும்
  rationale: ἐν என்பதன் இடத்தைக் குறிக்கும் அடிப்படை நயத்தை ‘நம்மில்’ தக்கவைக்கிறது; அது விசுவாசிகளுக்குள் அல்லது அவர்களிடையே இருப்பதைத் தமிழிலும் திறந்த நிலையில் விடுகிறது.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: தேவன் அன்பாக இருக்கிறார்
  rationale: மூலத்தின் நேரடியான பயனிலைப் பெயர்ச்சொல் கூற்றை விரிவாக்கமின்றி இயல்பான தமிழில் தருகிறது.
- source_word: ὁ μένων
  choice: நிலைத்திருப்பவன்
  rationale: யோவானின் எழுத்துகளில் முக்கியமான μένω என்பதன் தொடர்ச்சி, உறவுநிலை, நிலைத்தன்மை ஆகியவற்றைக் காட்டுகிறது.
- source_word: ἐν τῇ ἀγάπῃ
  choice: அன்பில்
  rationale: அன்பை ஒரு நிலை அல்லது வாழ்வுத் தளமாகக் காட்டும் கிரேக்க அமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν τῷ θεῷ μένει
  choice: தேவனில் நிலைத்திருக்கிறான்
  rationale: பரஸ்பர உள்ளிருப்பின் கருத்தைத் தக்கவைத்து, μένω என்பதற்கு ஒரே சொல் வழக்கைப் பேணுகிறது.
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: தேவனும் அவனில் நிலைத்திருக்கிறார்
  rationale: αὐτῷ என்பதன் ஆண்பால் ஒருமை வடிவத்தையும் பரஸ்பர நிலைத்திருப்பையும் தக்கவைக்கிறது; தேவனைக் குறிக்கும் வினை மரியாதைப் பன்மையில் அமைந்துள்ளது.
theological_decisions:
- issue: ἐν ἡμῖν என்பதன் பொருள்
  choice: ‘நம்மில்’ என்ற இடப்பொருள் கொண்ட, திறந்த மொழிபெயர்ப்பு
  alternative: ‘நம்மீது’ அல்லது ‘நமக்காக’ என்று தேவன் நம்மிடம் காட்டும் அன்பாக விளக்குதல்
  rationale: ἐν என்பதன் நேரடியான இடப்பொருளைத் தக்கவைத்து, அன்பு விசுவாசிகளுக்குள் இருக்கிறதா அல்லது அவர்களிடையே வெளிப்படுகிறதா என்ற உண்மையான தெளிவின்மையைத் தீர்த்துவிடாமல் விடுகிறது.
- issue: αὐτῷ என்பதன் பிரதிநிதித்துவ ஆண்பால் ஒருமை
  choice: முதன்மை உரையில் ‘அவனில்’
  alternative: ‘அந்த நபரில்’ அல்லது ‘அவரில்’
  rationale: மூலத்தின் இலக்கண ஆண்பால் ஒருமையைத் தக்கவைக்கிறது; அது ‘அன்பில் நிலைத்திருப்பவன்’ என்பவனை மீண்டும் சுட்டுகிறது, ஒரு குறிப்பிட்ட ஆணுக்கு மட்டும் பொருந்துவதாகக் கட்டுப்படுத்தாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. தேவனைச் சுட்டும் வினைகளில் மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது; மனிதனைச் சுட்டும் பிரதிநிதித்துவ ஆண்பால் ஒருமை மூலவடிவத்திற்காகத் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
