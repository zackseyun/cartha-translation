source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: ta
  text: அன்புக்குரியவர்களே, கடவுள் நம்மை இவ்வாறு அன்புகூர்ந்தார் என்றால்[a], நாமும் ஒருவரையொருவர் அன்புகூர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுள் நம்மை இவ்வாறு அன்புகூர்ந்திருப்பதால்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் நிபந்தனை வடிவம் (“என்றால்”) இருந்தாலும், இச்சூழலில் அந்த நிபந்தனை உண்மை என்றே கருதப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: பன்மையில் நேரடியாக அழைக்கும் அன்பான சொல்லாகவும், இவ்வசனத்தின் ἀγαπάω என்ற ‘அன்புகூர்’ சொற்குடும்பத்துடனான தொடர்பைப் பேணுவதாகவும் உள்ளது.
- source_word: εἰ
  choice: என்றால்
  rationale: சூழலில் கூறப்படும் நிபந்தனை உண்மை என ஏற்கப்பட்டிருந்தாலும், கிரேக்கத்தின் நிபந்தனை வடிவத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: முந்தைய சூழலில் வெளிப்படுத்தப்பட்ட கடவுளின் அன்பின் விதத்தையும் அதன் அளவையும் சுட்டக்கூடிய இயல்பான தமிழ் சொல்.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: பொதுவான, இயல்பான நவீனத் தமிழில் θεός என்பதற்கான நேரடியான மொழிபெயர்ப்பு.
- source_word: ἠγάπησεν
  choice: அன்புகூர்ந்தார்
  rationale: இறந்தகாலச் செயலைத் தெரிவிப்பதோடு, வசனத்தில் திரும்பத் திரும்ப வரும் அன்பு சார்ந்த சொற்களின் தொடர்பையும் பேணுகிறது.
- source_word: ἡμᾶς
  choice: நம்மை
  rationale: முதல் நபர் பன்மை நேர்செயப்படுபொருளை இயல்பாகக் குறிக்கிறது.
- source_word: καὶ ἡμεῖς
  choice: நாமும்
  rationale: καί என்பதன் ‘உம்’ பொருளையும், வெளிப்படையாக இடப்பட்ட ἡμεῖς என்பதன் வலியுறுத்தலையும் சுருக்கமாகப் பேணுகிறது.
- source_word: ὀφείλομεν
  choice: வேண்டும்
  rationale: ஒழுக்கக் கடமையை இயல்பான தமிழில் தெரிவிக்கிறது; அளவுக்கு மீறிய கட்டளைத் தொனியைச் சேர்க்கவில்லை.
- source_word: ἀλλήλους
  choice: ஒருவரையொருவர்
  rationale: பரஸ்பரச் செயலைக் குறிக்கும் நிலையான தமிழ் வடிவம்.
- source_word: ἀγαπᾶν
  choice: அன்புகூர
  rationale: ὀφείλομεν என்பதுடன் இணையும் வினையெச்ச வடிவமாக இயல்பாக அமைந்து, முக்கியமான அன்புச் சொல்லைத் தொடர்ந்து பேணுகிறது.
theological_decisions:
- issue: εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς என்ற நிபந்தனைத் தொடரின் வலிமை
  choice: “கடவுள் நம்மை இவ்வாறு அன்புகூர்ந்தார் என்றால்” என்று நிபந்தனை வடிவத்தைப் பேணுதல்
  alternative: “கடவுள் நம்மை இவ்வாறு அன்புகூர்ந்திருப்பதால்” என்று காரணத் தொடராக மொழிபெயர்த்தல்
  rationale: சூழலில் கடவுளின் அன்பு உண்மை என்பது ஐயப்படுத்தப்படவில்லை; இருந்தாலும், கிரேக்கம் அறிவுரைக்கு வலிமை சேர்க்கும் நிபந்தனை வடிவையே பயன்படுத்துகிறது. அதைத் தக்கவைப்பது மூலத்தின் சொல்லமைப்பையும் அதன் சொல்லாட்சித் திண்மையையும் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “அன்புக்குரியவர்களே / அன்புகூர்ந்தார் / அன்புகூர” என்ற தொடர், மூலத்தில் உள்ள அன்புச் சொற்குடும்பத்தின் மீளுரைப்பைப் பேணுகிறது.
