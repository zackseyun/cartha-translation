source:
  edition: SBLGNT
  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: ta
  text: யாராவது, “நான் கடவுளை அன்புகூருகிறேன்” என்று சொல்லி, தன் சகோதரனை[a] வெறுத்தால், அவன் பொய்யன். ஏனெனில், அவன் பார்த்திருக்கிற தன் சகோதரனை அன்புகூராதவன், அவன் பார்க்காத கடவுளை அன்புகூர முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் சகோதரனையோ சகோதரியையோ.’ கிரேக்கத்தில் ‘சகோதரன்’ (ἀδελφός) என்ற ஆண்பால் ஒருமைச் சொல் உள்ளது; இச்சூழலில் அது பிரதிநிதித்துவப் பொருளில் பயன்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: யாராவது … என்று சொல்லி … வெறுத்தால்
  rationale: ἐάν மற்றும் இறந்தகால துணைவினை εἴπῃ பொதுவான நிபந்தனையை அறிமுகப்படுத்துகின்றன. தமிழில் ‘யாராவது … வெறுத்தால்’ என்பது அதன் வரையறுக்கப்படாத பொதுப் பொருளை இயல்பாகத் தருகிறது; ‘சொல்லி’ என்பது கிரேக்கத்தில் தொடரும் καί இணைப்பையும் காக்கிறது.
- source_word: Ἀγαπῶ / ἀγαπῶν / ἀγαπᾶν
  choice: அன்புகூருகிறேன் / அன்புகூராதவன் / அன்புகூர முடியாது
  rationale: வசனம் முழுவதும் திரும்பத் திரும்ப வரும் ἀγαπάω என்ற ஒரே சொல்லின் தொடர்பை ‘அன்புகூர்’ என்ற வினையால் தொடர்ந்து பேணுகிறது.
- source_word: τὸν θεόν
  choice: கடவுளிடம்
  rationale: தமிழில் ஒருவர்மீது அல்லது ஒருவரிடம் அன்புகூருதல் இயல்பான சொல்லாட்சி. ‘கடவுள்’ என்பது நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான பெயர்ப்பு.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: தன் சகோதரனை / தான் கண்டிருக்கிற சகோதரனிடம்
  rationale: ἀδελφός ஆண்பால் ஒருமை என்பதால் ‘சகோதரன்’ என்று நேரடியாகப் பெயர்க்கப்பட்டுள்ளது. αὐτοῦ எழுவாயையே சுட்டுவதால் தமிழில் ‘தன்/தான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μισῇ
  choice: வெறுத்தால்
  rationale: நிகழ்காலத் துணைவினையின் நிபந்தனைப் பொருளை எளிய தமிழ் நிபந்தனை வடிவம் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ψεύστης ἐστίν
  choice: அவன் பொய்யன்
  rationale: ψεύστης ஒரு பெயர்ச்சொல் சார்ந்த திட்டவட்டமான மதிப்பீடு; ஆகவே மென்மைப்படுத்தாமல் ‘பொய்யன்’ எனப் பெயர்க்கப்பட்டுள்ளது.
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: ஏனெனில் … அன்புகூராதவன்
  rationale: γάρ தரும் விளக்கக் காரணத்தை ‘ஏனெனில்’ வெளிப்படுத்துகிறது; பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினை ‘அன்புகூராதவன்’ என இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: ὃν ἑώρακεν / ὃν οὐχ ἑώρακεν
  choice: தான் கண்டிருக்கிற / தான் கண்டிராத
  rationale: ἑώρακεν என்பதன் நிறைவுற்ற செயலும் தற்போதைய தொடர்பும் ‘கண்டிருக்கிற’ என்பதில் காக்கப்படுகின்றன. எதிர்மறை இணை அமைப்பு ‘கண்டிராத’ என்று சுருக்கமாகத் தரப்பட்டுள்ளது.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: அன்புகூர முடியாது
  rationale: δύναται குறிப்பிடும் இயலாமை அல்லது சாத்தியமின்மையின் வலிமையை ‘முடியாது’ நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ἀδελφός என்பது இச்சூழலில் சக விசுவாசிகள் அனைவரையும் பிரதிநிதித்துவப்படுத்தக்கூடியதா?
  choice: முதன்மை உரையில் ‘சகோதரன்’
  alternative: ‘சகோதரன் அல்லது சகோதரி’; ‘சக விசுவாசி’
  rationale: கிரேக்கச் சொல் ஆண்பால் ஒருமையில் உள்ளது. அதன் வடிவத்தை முதன்மை உரை காக்கிறது; சூழலில் அது பிரதிநிதித்துவப் பொருளில் வரக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது. ‘சக விசுவாசி’ என்று பெயர்ப்பது சூழலை விளக்கமாகச் சேர்த்துவிடும்.
- issue: οὐ δύναται ἀγαπᾶν என்பதன் வலிமை
  choice: ‘கடவுளிடம் அன்புகூர முடியாது’
  alternative: ‘கடவுளிடம் அன்புகூர இயலாதவன்’
  rationale: யோவானின் வாதம் வெறும் நடைமுறைச் சிரமத்தை அல்ல, வலுவான ஒழுக்க-ஆவிக்குரிய இயலாமையை முன்வைக்கிறது. ‘முடியாது’ அந்த வலிமையை விளக்கவுரை சேர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வாசிக்கும்படி வடிவமைக்கப்பட்டுள்ளது. ‘அன்புகூர்’ என்ற ஒரே வேர்ச்சொல் மூன்றிடங்களிலும் பயன்படுத்தப்பட்டு மூலத்தின் சொல் மீட்சி காக்கப்பட்டுள்ளது. கிரேக்கத்தின் நேரடி வேற்றுமையை இயந்திரமாகப் பின்பற்றாமல், தமிழின் இயல்பான ‘கடவுளிடம்/சகோதரனிடம் அன்புகூருதல்’ என்ற அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
