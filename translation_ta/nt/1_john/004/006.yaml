source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: ta
  text: நாம் கடவுளிடமிருந்து வந்தவர்கள். கடவுளை அறிந்தவர் நமக்குச் செவிகொடுக்கிறார்[a]; கடவுளிடமிருந்து வராதவர் நமக்குச் செவிகொடுப்பதில்லை. இதன் மூலம் உண்மையின் ஆவியையும்[b][c] தவறின் ஆவியையும் நாம் அறிந்துகொள்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டு இடங்களிலும், “நாம் சொல்வதைக் கேட்கிறார் / கேட்பதில்லை” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் கேட்டலைக் குறிக்கலாம்; இங்கு அப்போஸ்தல சாட்சியை ஏற்றுச் செவிகொடுப்பது பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: “உண்மையின் ஆவி” என்பது யோவான் 14:17; 15:26; 16:13 ஆகிய இடங்களில் வரும் சொல்லாட்சியை எதிரொலிக்கிறது.
    reason: cross_reference
  - marker: c
    text: இச்சொற்றொடர் இங்கு பெரும்பாலும் பரிசுத்த ஆவியைக் குறிக்கிறது; எனினும், “உண்மையைச் சார்ந்த ஆவி” என்ற பொதுவான பொருளிலும் வாசிக்கப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து வந்தவர்கள் / கடவுளிடமிருந்து வராதவர்
  rationale: ἐκ என்பதன் மூலாதாரம் அல்லது தோற்றம் என்ற பொருளைத் தக்கவைக்க ‘கடவுளிடமிருந்து’ என மொழிபெயர்க்கப்பட்டது. முதல் வாக்கியத்தில் இயல்பான தமிழுக்காக ‘வந்தவர்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὁ γινώσκων τὸν θεόν
  choice: கடவுளை அறிந்தவர்
  rationale: பெயர்ச்சொல் தன்மையுடைய நிகழ்காலப் பங்கேற்புச் சொல்லின் பொதுவான, தொடர்ச்சியான பண்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀκούει ἡμῶν
  choice: நமக்குச் செவிகொடுக்கிறார்
  rationale: வெறுமனே ஒலியைக் கேட்பதைவிட, சாட்சியை ஏற்று கவனித்துக் கேட்பதே சூழலில் முன்னிலையாகிறது. ‘கீழ்ப்படிகிறார்’ என்று வலுப்படுத்தாமல் ஏற்றுக்கொள்ளும் கேட்பை இது காட்டுகிறது.
- source_word: ἐκ τούτου
  choice: இதைக் கொண்டே
  rationale: முன் கூறப்பட்ட அளவுகோலின் அடிப்படையில் அறிதல் அல்லது பகுத்தறிதல் என்ற யோவானிய கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γινώσκομεν
  choice: நாம் அறிந்துகொள்கிறோம்
  rationale: முந்தைய γινώσκων உடனான சொல் தொடர்பைப் பேணுவதோடு, இங்கு உள்ள பகுத்தறிந்து அடையாளம் காணும் நுண்பொருளையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: உண்மையின் ஆவி
  rationale: கிரேக்கத்தின் உறவைக் காட்டும் அமைப்பைத் தக்கவைக்கிறது. தமிழ் எழுத்தில் பெரிய எழுத்து வேறுபாடு இல்லாததால், இது தூய ஆவியைக் குறிப்பதா அல்லது பொதுவான ஆவிக்குரிய தாக்கத்தைக் குறிப்பதா என்ற நுண்ணிய தெளிவின்மையும் இயல்பாகத் தங்குகிறது.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: தவறின் ஆவி
  rationale: πλάνη என்பதன் தவறு, ஏமாற்றம், உண்மையிலிருந்து வழிதவறுதல் ஆகிய பொருள் வளத்தை ‘தவறு’ சுருக்கமாகத் தருகிறது; ‘உண்மை’ என்பதுடனான எதிரிணையையும் பேணுகிறது.
theological_decisions:
- issue: τὸ πνεῦμα τῆς ἀληθείας என்பது தூய ஆவியைக் குறிக்கிறதா
  choice: உண்மையின் ஆவி
  alternative: உண்மையைச் சார்ந்த ஆவி
  rationale: யோவான் நூல்களின் பயன்பாட்டிலும் ஆவிகளைச் சோதிக்கும் உடனடிச் சூழலிலும் இது தூய ஆவிக்கான பெயராக இருப்பது மிகச் சாத்தியம். இருப்பினும், மூலத்தில் உள்ள சொற்றொடரின் வடிவத்தையும் சாத்தியமான பொதுவான வாசிப்பையும் மொழிபெயர்ப்பு தக்கவைக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀκούει ἡμῶν என்பது கேட்பதையா அல்லது ஏற்றுக்கொண்டு செவிசாய்ப்பதையா குறிக்கிறது
  choice: நமக்குச் செவிகொடுக்கிறார்
  alternative: நாம் சொல்வதைக் கேட்கிறார்
  rationale: இங்கு அப்போஸ்தல சாட்சிக்கு ஒருவர் காட்டும் ஏற்புடைய பதிலே உண்மை மற்றும் தவறை அறியும் அளவுகோலாக உள்ளது. ‘செவிகொடுக்கிறார்’ இதைத் தெரிவிக்கிறது; ஆனால் ‘கீழ்ப்படிகிறார்’ என்ற அதிகப்படியான கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதாகப் புரியும், அதேவேளை கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கடவுளிடமிருந்து’ என்பது மூலாதாரத்தை வலியுறுத்துகிறது; ‘செவிகொடுக்கிறார்’ என்பது வெறும் கேட்டலுக்கும் கீழ்ப்படிதலுக்கும் நடுவிலான ஏற்புடைய கவனிப்பை வெளிப்படுத்துகிறது. தமிழ் எழுத்துமுறையில் capitalization இல்லாததால் ‘ஆவி’ என்ற வடிவமே பயன்படுத்தப்பட்டு, சாத்தியமான தூய ஆவி குறிப்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
