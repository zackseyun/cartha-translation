source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: ta
  text: 'மேலும், நமக்கு அவரிடமிருந்து இந்தக் கட்டளை உண்டு: கடவுளை அன்புகூருகிறவர் தன் சகோதரரையும் அன்புகூர வேண்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் சகோதரனையோ சகோதரியையோ அன்புகூர வேண்டும்.” கிரேக்கத்தில் “அவனுடைய சகோதரன்” என்று ஆண்பால் ஒருமை வடிவம் உள்ளது; இது சக விசுவாசி ஒருவரைப் பிரதிநிதித்துவமாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: கட்டளை
  rationale: யோவானின் பயன்பாட்டில் உள்ள அதிகாரமும் ஒழுக்கக் கடமையும் தெளிவாகத் தெரிவதுடன், நவீன தமிழில் இயல்பாக இருப்பதால் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀπ’ αὐτοῦ
  choice: அவரிடமிருந்து
  rationale: கிரேக்கத்தில் உள்ள சுட்டுப்பெயரைப் பாதுகாக்கிறது; உடனடி சூழலில் அது கடவுளைக் குறிக்கிறது என்றாலும், மூலத்தில் இல்லாத பெயரை உரைக்குள் சேர்க்கவில்லை.
- source_word: ἵνα
  choice: என்பதே / உரையின் அமைப்பில் பெருங்குடலுக்குப் பின் கட்டளையின் உள்ளடக்கம்
  rationale: இங்கு ἵνα கட்டளையின் நோக்கத்தைவிட அதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் பெருங்குடலைத் தொடர்ந்து வரும் கூற்று இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: கடவுளிடம் அன்புகூருகிறவர்
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்பின் பொதுவான ஒருமை அர்த்தத்தை, பாலினத்தைத் தேவையின்றி குறிப்பாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἀγαπᾷ
  choice: அன்புகூர வேண்டும்
  rationale: ἵνα உடன் வரும் நிகழ்காலத் துணைவினை வடிவம் கட்டளையிடும் கடமையைத் தெரிவிக்கிறது; ‘வேண்டும்’ அதனை மிகைப்படுத்தாமல் தெளிவாகக் காட்டுகிறது.
- source_word: ἀδελφὸν αὐτοῦ
  choice: தன் சகோதரரிடம்
  rationale: மூலத்தின் ஆண்பால் ஒருமை வடிவத்தைப் பிரதிபலிக்கிறது. சூழலில் சக விசுவாசியைப் பிரதிநிதித்துவமாகக் குறிக்கக்கூடிய விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καὶ
  choice: மேலும் / -உம்
  rationale: முதல் καί தொடர்ச்சியை ‘மேலும்’ எனவும், இரண்டாவது καί அன்பின் கூடுதல் பொருளை ‘-உம்’ எனவும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: அன்புகூரு
  rationale: ஒரே கிரேக்கச் சொல் குடும்பத்தின் யோவானிய கருத்துத் தொடர்ச்சியை இரு இடங்களிலும் ஒரே தமிழ் வினையால் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀδελφὸν αὐτοῦ என்பதிலுள்ள ஆண்பால் ஒருமை குறிப்பு
  choice: முதன்மை உரையில் ‘தன் சகோதரர்’ என்று வைத்து, பிரதிநிதித்துவமான உள்ளடக்கப் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘தன் சகோதரனிடமோ சகோதரியிடமோ’ அல்லது ‘தன் சக விசுவாசியிடம்’
  rationale: கிரேக்க வடிவம் ஆண்பால் ஒருமை; அதேவேளையில் அது விசுவாசக் குழுவைச் சேர்ந்த ஒருவரை பிரதிநிதித்துவமாகக் குறிக்கலாம். மூல வடிவத்தையும் விரிவான சூழற்பொருளையும் இரண்டையும் கலக்காமல் பாதுகாக்கிறது.
- issue: ἀπ’ αὐτοῦ என்பதின் முன்னிலைச் சுட்டு
  choice: ‘அவரிடமிருந்து’ என்று சுட்டுப்பெயராகவே வைத்தல்
  alternative: ‘கடவுளிடமிருந்து’
  rationale: உடனடி சூழலில் சுட்டுப்பெயர் கடவுளைக் குறித்தாலும், மூலத்தின் உரையோட்டத்தையும் அதன் சுட்டுப்பெயர் வடிவத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘அன்புகூரு’ என்பது வேதாகமச் சூழலுக்கு ஏற்ற கண்ணியத்தையும், வழக்கிலுள்ள ‘அன்பு செய்’ என்பதைக் காட்டிலும் இயல்பான வினைத் தொடர்பையும் தருகிறது. ‘சகோதரர்’ மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டு, மூலத்தின் ஒருமை வடிவம் காக்கப்பட்டது.
