  text: The one who does not love has not known God[a], because God is love.
translation:
  language: ta
  text: அன்பு செலுத்தாதவர் கடவுளை அறிந்ததில்லை[a]; ஏனெனில் கடவுள் அன்பே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அன்பு செலுத்தாதவர் கடவுளை அறியார்.” கிரேக்க வினை வடிவம், ஒருவர் கடவுளை அறியும் நிலைக்கு வந்திருக்கவில்லை என்பதையும் உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: அன்புகூராதவர்
  rationale: கட்டுரையுடன் வரும் நிகழ்காலப் பங்கேற்புவினை, அன்புகூராமையால் அடையாளப்படுத்தப்படும் ஒருவரைப் பொதுவாகக் குறிக்கிறது. ‘அன்புகூராதவர்’ என்பது இயல்பான தமிழில் இந்தப் பொதுமையையும் தொடர்ச்சியான பண்பையும் தருகிறது.
- source_word: ἀγαπῶν / ἀγάπη
  choice: அன்புகூராதவர் / அன்பு
  rationale: இரண்டும் ஒரே சொல்வேரைச் சேர்ந்தவை என்பதைத் தமிழிலும் ‘அன்பு’ என்ற சொல் வழியாகத் தெளிவாக வைத்திருக்கிறது.
- source_word: οὐκ ἔγνω
  choice: அறிந்துகொள்ளவில்லை
  rationale: இறந்தகால வினை வடிவம், கடவுளை உறவுமுறையில் அறியும் நிலைக்கு வந்திருக்கவில்லை என்ற விளைவைச் சூழலில் உணர்த்துகிறது. தமிழ் நிறைவுவினை வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν θεόν / ὁ θεὸς
  choice: கடவுளை / கடவுள்
  rationale: முறையே வினையின் நேர்செயப்படுபொருளையும் அடுத்த கூற்றின் எழுவாயையும் நேரடியாகக் குறிக்கின்றன.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக உள்ளது.
- source_word: ἀγάπη ἐστίν
  choice: அன்பாக இருக்கிறார்
  rationale: பெயர்ப் பயனிலையான ‘அன்பு’ என்பதன் வலிமையைத் தக்கவைத்தும், உயிருள்ள தனிப்பட்ட எழுவாயாகிய கடவுளுக்குப் பொருத்தமான மரியாதை வினைமுற்றைப் பயன்படுத்தியும் உள்ளது.
theological_decisions:
- issue: ‘கடவுள் அன்பாக இருக்கிறார்’ என்பதன் பொருள்
  choice: கடவுளை எழுவாயாகவும் அன்பைப் பயனிலையாகவும் வைத்துள்ளோம்.
  alternative: கடவுள் அன்புள்ளவர்; அன்பே கடவுள்
  rationale: மூலத்தில் ‘கடவுள்’ எழுவாய்; ‘அன்பு’ பெயர்ப் பயனிலை. ஆகவே இதை ‘அன்பே கடவுள்’ என்று தலைகீழாக்கவில்லை; ‘அன்புள்ளவர்’ என்று பெயர்ப் பயனிலையின் வலிமையையும் குறைக்கவில்லை. இந்தக் கூற்று கடவுளின் இயல்பைப் பற்றியது; அன்பை கடவுளுடன் முழுமையாகச் சமப்படுத்தும் தலைகீழ் வரையறை அல்ல.
- issue: கடவுளை அறிதலின் காலமும் உறவுசார் பொருளும்
  choice: அறிந்துகொள்ளவில்லை
  alternative: அறியார்; அறியவில்லை; புரிந்துகொள்ளவில்லை
  rationale: γινώσκω இங்கு வெறும் அறிவாற்றல் புரிதலைவிட உறவுசார் அறிதலைக் குறிக்கிறது. இறந்தகால வடிவத்தின் விளைவுநிலையை ‘அறிந்துகொள்ளவில்லை’ காக்கிறது; எளிய நிகழ்கால மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘அன்புகூராதவர்’ மூலம் பொதுவான ஒருமையும் தொடர்ச்சியான பண்பும் காக்கப்பட்டுள்ளன. ‘கடவுள் அன்பாக இருக்கிறார்’ என்பது தமிழ் இலக்கணத்தில் இயல்பாக இருக்க மரியாதை ஒருமையைப் பயன்படுத்துகிறது.
