  rationale: 'The revision makes only safe linguistic adjustments: it uses more contemporary Tamil for the generic loveless person, expresses the contextual perfect-result sense of οὐκ ἔγνω idiomatically, and restores the full force of the Greek predicate noun with ‘கடவுள் அன்பே.’ The causal relation and the footnote alternative are retained.'
