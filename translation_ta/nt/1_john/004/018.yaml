id: 1JN.4.18
reference: 1 John 4:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: ta
  text: அன்பில் பயம் இல்லை. மாறாக, நிறைவான அன்பு[a] பயத்தை வெளியே துரத்துகிறது[b]. ஏனெனில், பயத்திற்குத் தண்டனை உண்டு[c]. ஆனால் பயப்படுகிறவர் அன்பில் நிறைவாக்கப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிறைவான’ என்பதை ‘முழுமையான’ அல்லது ‘முதிர்ச்சியடைந்த’ என்றும் புரிந்துகொள்ளலாம்; இங்கு அன்பு தன் நோக்கத்துக்குரிய முழுநிலையை அடைவதே கருத்து.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘வெளியே எறிகிறது.’'
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: ‘பயத்திற்குத் தண்டனை உண்டு.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: பயம் / பயப்படுகிறவர்
  rationale: வசனம் முழுவதிலும் திரும்பத் திரும்ப வரும் ஒரே சொல்லின் தொடர்பைப் பேணுகிறது; நியாயத்தீர்ப்பையும் தண்டனையையும் எதிர்நோக்கும் அச்சம் என்ற சூழலுக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: ἀγάπῃ / ἀγάπη
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான இயல்பான நிலையான தமிழ் சொல்; வசனத்திலுள்ள மறுபயன்பாட்டையும் அப்படியே பேணுகிறது.
- source_word: τελεία
  choice: நிறைவான
  rationale: தன் நோக்கத்துக்குரிய முழுநிலையை அடைந்தது என்ற கருத்தைத் தெரிவிக்கிறது; பாவமற்ற பரிபூரண நிலை என்ற குறிப்பிட்ட கோட்பாட்டைத் திணிக்காமல், τετελείωται என்பதுடன் சொல்லியல் தொடர்பைப் பேணுகிறது.
- source_word: ἔξω βάλλει
  choice: வெளியே துரத்துகிறது
  rationale: வலுவாக வெளியேற்றுதல் என்ற உருவகத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: κόλασιν ἔχει
  choice: தண்டனையைத் தன்னுடன் கொண்டுள்ளது
  rationale: ‘தண்டனையைக் கொண்டுள்ளது’ என்ற கிரேக்க அமைப்புக்கு நெருக்கமாக இருந்து, பயத்துக்கும் தண்டனைக்கும் உள்ள உறவை விளக்கமாகத் தீர்மானிக்காமல் பேணுகிறது.
- source_word: ὁ δὲ φοβούμενος
  choice: ஆனால் பயப்படுகிறவர்
  rationale: பாலினம் சுட்டாத வகையில் substantival participle-ஐ இயல்பான தமிழில் தருகிறது.
- source_word: οὐ τετελείωται ἐν τῇ ἀγάπῃ
  choice: அன்பில் நிறைவாக்கப்படவில்லை
  rationale: perfect passive வடிவத்தின் விளைவுநிலையையும், τελεία/τελειόω ஆகியவற்றின் சொல்லியல் தொடர்பையும் பேணுகிறது.
theological_decisions:
- issue: ‘நிறைவான அன்பு’ மற்றும் ‘நிறைவாக்கப்படவில்லை’ என்பவற்றின் பொருள்
  choice: இரண்டு இடங்களிலும் ‘நிறைவு’ என்ற ஒரே சொல்வேரைப் பயன்படுத்துதல்
  alternative: ‘முதிர்ச்சியடைந்த அன்பு’ / ‘அன்பில் முதிர்ச்சியடையவில்லை’
  rationale: அன்பு தன் நோக்கத்துக்குரிய முழுநிலையை அடைவதையும், பயப்படுகிறவர் இன்னும் அந்த நிறைவுநிலைக்கு கொண்டுவரப்படாதிருப்பதையும் உரை பதற்றத்துடன் இணைக்கிறது. இதை வெறும் உணர்ச்சி முதிர்ச்சியாகவோ பாவமற்ற பரிபூரணத்தைக் குறிக்கும் கோட்பாடாகவோ தீர்மானிக்காமல் விடுகிறது.
- issue: பயத்துக்கும் தண்டனைக்கும் உள்ள உறவு
  choice: ‘பயம் தண்டனையைத் தன்னுடன் கொண்டுள்ளது’ என்று நேரடியான தொடர்பைப் பேணுதல்
  alternative: ‘பயம் தண்டனையை எதிர்பார்ப்பதால் உண்டாகிறது’ அல்லது ‘பயம் தண்டனையோடு தொடர்புடையது’
  rationale: கிரேக்கத்தின் சுருக்கமான ‘κόλασιν ἔχει’ என்பதை காரணவியல் விளக்கமாக விரிவாக்காமல், அதன் உண்மையான பொருள் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘நிறைவு’ என்ற சொல்வேர் இரு தொடர்புடைய கிரேக்க வடிவங்களிலும் திட்டமிட்டு பேணப்பட்டுள்ளது; ‘வெளியே துரத்துகிறது’ என்ற வினைச்சொல் மூலத்தின் வலுவான வெளியேற்ற உருவகத்தை இயல்பாகக் காட்டுகிறது.
