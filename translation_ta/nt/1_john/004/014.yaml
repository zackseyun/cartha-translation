source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: ta
  text: நாமும் கண்டிருக்கிறோம்; உலகத்தின் மீட்பராகப் பிதா மகனை அனுப்பியிருக்கிறார்[a] என்று சாட்சி கூறுகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, கிரேக்க அமைப்புக்கு நெருக்கமாக: “பிதா மகனை—உலகத்தின் மீட்பரை—அனுப்பியிருக்கிறார்.”'
    reason: σωτῆρα τοῦ κόσμου என்பது கிரேக்கத்தில் ‘மகனை’ விளக்கும் இணைப்பெயர் தொடர்; முதன்மை உரையின் ‘மீட்பராக’ என்பது அதன் இயல்பான தமிழாக்கம்.
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: நாமும்
  rationale: இணைப்புச் சொல்லையும் வெளிப்படையான பன்மைச் சுட்டுப்பெயரின் மிதமான வலியுறுத்தலையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: τεθεάμεθα
  choice: கண்டிருக்கிறோம்
  rationale: நிகழ்ந்து முடிந்த காணுதல் இப்போதும் முக்கியத்துவம் உடையதாக இருப்பதை கிரேக்க நிறைவுக்காலம் உணர்த்துகிறது; இத்தமிழ் வடிவம் அதையும் நேரில் கண்ட சாட்சியின் வலிமையையும் காக்கிறது.
- source_word: μαρτυροῦμεν
  choice: சாட்சி கூறுகிறோம்
  rationale: நிகழ்காலத்தில் தொடரும் சாட்சியளிப்பைத் தெளிவாகவும் பொதுவாகப் புரியும் முறையிலும் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: இது காரணத்தை அல்ல, சாட்சியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: ὁ πατήρ
  choice: பிதா
  rationale: யோவானின் தந்தை–மகன் உறவுச் சிறப்புப்பெயரைத் தக்கவைத்து, தமிழ் கிறிஸ்தவப் பயன்பாட்டில் கண்ணியமாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: ἀπέσταλκεν
  choice: அனுப்பியிருக்கிறார்
  rationale: அனுப்புதல் நிறைவேறியதையும் அதன் தொடரும் பொருத்தத்தையும் கிரேக்க நிறைவுக்காலத்துக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: τὸν υἱόν
  choice: மகனை
  rationale: கிரேக்கத்தில் உடைமைச் சுட்டுப்பெயர் இல்லாததால் ‘தமது மகனை’ என்று விரிவாக்காமல், பிதாவுடனான உறவுச் சிறப்புப்பெயரை நேரடியாகக் காக்கிறது.
- source_word: σωτῆρα
  choice: மீட்பராக
  rationale: σωτήρ என்பதன் இரட்சித்து விடுவிப்பவர் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; ‘-ஆக’ என்பது மகன் அனுப்பப்பட்ட பங்கைத் தெளிவாக்குகிறது.
- source_word: τοῦ κόσμου
  choice: உலகத்தின்
  rationale: யோவானியச் சொல்லாட்சியின் விரிந்த எல்லையைச் சுருக்காமல், கிரேக்க உடைமை வேற்றுமையை நேரடியாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ‘உலகத்தின் மீட்பர்’ என்பதன் எல்லை
  choice: ‘உலகத்தின் மீட்பர்’ என்ற விரிந்த யோவானியச் சொல்லாட்சியை அப்படியே வைத்தல்
  alternative: குறிப்பிட்ட ஒரு குழுவின் மீட்பர் அல்லது உலகத்தின் சாத்தியமான மீட்பர் என்று குறுக்குதல்
  rationale: கிரேக்க உரை மீட்பின் செயல்முறை அல்லது எல்லை குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டை இங்கு விளக்காமல், பட்டத்தையும் அதன் விரிந்த தொடர்பையும் நேரடியாகக் கூறுகிறது.
- issue: பிதா–மகன் உறவுமொழி
  choice: ‘பிதா’ மற்றும் ‘மகன்’ என்ற உறவுச் சிறப்புப்பெயர்களை வைத்தல்
  alternative: ‘பிதாவாகிய கடவுள் இயேசு கிறிஸ்துவை’ என்று விரிவாக்குதல்
  rationale: இவ்வசனம் பயன்படுத்தும் உறவுமொழியை மட்டும் மொழிபெயர்ப்பது, உரையில் இல்லாத பெயர்களையோ விளக்கங்களையோ சேர்ப்பதைத் தவிர்க்கிறது.
- issue: σωτῆρα என்பதன் இலக்கண உறவு
  choice: ‘உலகத்தின் மீட்பராக’ என்று பங்கு அல்லது நிலையை இயல்பான தமிழில் வெளிப்படுத்துதல்
  alternative: ‘மகனை—உலகத்தின் மீட்பரை—அனுப்பியிருக்கிறார்’ என்ற நேரடியான இணைப்பெயர் அமைப்பு
  rationale: கிரேக்கத்தில் σωτῆρα என்பது ‘மகனை’ விளக்கும் இணைப்பெயர் குற்றுவேற்றுமை. ‘-ஆக’ இயல்பான தமிழைத் தருகிறது; மேலும் நேரடியான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், ஆனால் வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிதா’ என்பது இங்கு யோவானின் உறவுச் சிறப்புப்பெயரைச் சுருக்கமாகக் காக்கிறது; ‘கண்டிருக்கிறோம் / அனுப்பியிருக்கிறார்’ ஆகிய வடிவங்கள் கிரேக்க நிறைவுக்காலத்தின் தொடரும் பொருத்தத்தை வெளிப்படுத்துகின்றன.
