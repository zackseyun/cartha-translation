translation:
  language: ta
  text: அவர் முதலில் நம்மை அன்புகூர்ந்ததால், நாம் அன்புகூருகிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “அவர் முதலில் நம்மை அன்புகூர்ந்ததால், நாம் அவரை அன்புகூருகிறோம்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: நாம்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள எழுவாயை இயல்பான தமிழில் ‘நாம்’ என்று தருகிறது; தேவையற்ற மிகை அழுத்தத்தைச் சேர்க்கவில்லை.
- source_word: ἀγαπῶμεν
  choice: அன்புகூருகிறோம்
  rationale: நிகழ்கால வினையை இயல்பாகத் தருவதோடு, சூழலில் திரும்பத் திரும்ப வரும் ἀγαπάω என்பதன் சொற்பிணைப்பையும் காக்கிறது. மூலத்தில் செயப்படுபொருள் இல்லாததால் தமிழிலும் அதைச் சேர்க்கவில்லை.
- source_word: ὅτι
  choice: -தால்
  rationale: இங்கு காரணத்தைக் குறிக்கும் ὅτι என்பதை இயல்பான தமிழ் காரண விகுதியாகத் தருகிறது.
- source_word: αὐτὸς
  choice: அவர்
  rationale: சூழலில் கடவுளைக் குறிக்கிறது; நவீன மரியாதைத் தமிழுக்கு ஏற்ற சுட்டுப்பெயர்.
- source_word: πρῶτος
  choice: முதலில்
  rationale: கடவுளுடைய அன்பு நமது அன்புக்கு முந்தியது என்ற கால முன்னுரிமையை நேரடியாகக் காக்கிறது.
- source_word: ἠγάπησεν
  choice: அன்புகூர்ந்தார்
  rationale: முடிவுற்ற இறந்தகாலச் செயலைத் தமிழ் இறந்தகாலத்தில் தருகிறது; ἀγαπῶμεν உடனான சொற்பிணைப்பையும் காக்கிறது.
- source_word: ἡμᾶς
  choice: நம்மிடம்
  rationale: தமிழில் ஒருவரை நோக்கிய அன்பை இயல்பாக வெளிப்படுத்த ‘நம்மிடம் அன்புகூர்ந்தார்’ எனத் தரப்பட்டுள்ளது; கிரேக்கத்தின் ‘நம்மை’ என்ற நேரடிச் செயப்படுபொருளின் பொருள் மாறவில்லை.
theological_decisions:
- issue: ‘நாம் அன்புகூருகிறோம்’ என்பதற்குச் செயப்படுபொருளைச் சேர்ப்பதா?
  choice: செயப்படுபொருளைச் சேர்க்காமல் ‘நாம் அன்புகூருகிறோம்’ என்று விடுதல்
  alternative: ‘நாம் அவரிடம் அன்புகூருகிறோம்’ அல்லது ‘நாம் கடவுளிடம் அன்புகூருகிறோம்’
  rationale: தரப்பட்ட SBLGNT வாசகத்தில் ἀγαπῶμεν என்பதற்குப் பின் வெளிப்படையான செயப்படுபொருள் இல்லை. ‘அவரிடம்’ என்பதைச் சேர்ப்பது வேறொரு கையெழுத்துப் பிரதிப் பாரம்பரியத்தைப் பின்பற்றும்; ஆகவே மூலத்தின் பரந்த பொருள் மற்றும் தெளிவின்மையை முதன்மை உரையில் காக்கிறோம்.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘அன்புகூருகிறோம்’ என்பது வேதாகமச் சூழலுக்கேற்றதாக இருந்தாலும் பொதுவாசகர்களுக்கும் புரியும்; இரு கிரேக்க வினைகளின் சொற்பிணைப்பைக் காக்க அதே வினை இருமுறையும் பயன்படுத்தப்பட்டுள்ளது.
