  to: 'இதில் கடவுளின் அன்பு நம்மிடையே[a] வெளிப்பட்டது: நாம் அவர் வழியாக வாழும்படி, கடவுள் தமது ஒரே மகனை[b] உலகத்திற்கு அனுப்பியிருக்கிறார்.'
  rationale: 'சிறிய ஆனால் பாதுகாப்பான திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன: ἐν τούτῳ-க்கு மூலத்திற்கு நெருக்கமான ‘இதில்’ பயன்படுத்தப்பட்டுள்ளது; εἰς τὸν κόσμον-க்கு இயல்பான ‘உலகத்திற்கு’ வழங்கப்பட்டுள்ளது; மேலும் இரு அடிக்குறிப்புகளும் முறையே ἐν ἡμῖν-இன் தெளிவின்மையையும் μονογενής-இன் பாரம்பரிய மாற்று வடிவத்தையும் துல்லியமாகக் காக்கும்படி திருத்தப்பட்டுள்ளன.'
