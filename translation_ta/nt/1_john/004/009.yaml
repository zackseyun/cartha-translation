  source_fidelity: 'முதன்மை உரை கிரேக்கத்தின் மையப் பொருளைச் சரியாகத் தருகிறது: கடவுளின் அன்பின் வெளிப்பாடு, அவரது μοναγενής மகனை உலகத்துக்கு அனுப்பியிருத்தல், மற்றும் அவர் மூலம் நாம் வாழும் நோக்கம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. எனினும், ἐν τούτῳ என்பதிலுள்ள சுட்டுதலுக்கு ‘இதில்தான்’ தேவையற்ற கட்டுப்படுத்தும் வலியுறுத்தலைச் சேர்க்கிறது; ‘இதில்’ மிக நெருக்கமானது. εἰς τὸν κόσμον என்பதற்கு ‘உலகத்திற்கு’ நவீனத் தமிழில் இயல்பாகவும் போதுமான துல்லியமாகவும் உள்ளது.'
  naturalness: ‘நாம் அவர் வழியாக வாழும்படி’ என்ற நோக்கத் தொடர் இயல்பானது. ஆனால் ‘உலகத்திற்குள் அனுப்பியிருக்கிறார்’ என்பதைக் காட்டிலும் ‘உலகத்திற்கு அனுப்பியிருக்கிறார்’ தமிழில் செம்மையாக ஒலிக்கிறது. அடிக்குறிப்பு அ-வில் ‘விசுவாசிகளுக்குள் ஏற்பட்ட வெளிப்பாடு’ என்பது அன்பு வெளிப்பட்டதைக் காட்டிலும் வெளிப்பாடு நிகழ்ந்ததைப் போலச் சொல்லுகிறது; இது திருத்தப்பட வேண்டும்.
  terminology: ‘கடவுள்,’ ‘அன்பு,’ ‘மகன்,’ ‘உலகம்,’ ‘வாழும்படி’ ஆகியவை நவீன நிலையான தமிழுக்கும் உரையின் கண்ணியமான பதிவுக்கும் ஏற்றவை. μονογενής-ஐ முதன்மை உரையில் ‘ஒரே மகன்’ என வழங்குவது பாதுகாப்பானது. பாரம்பரிய மாற்றாக ‘ஒரேபேறான மகன்’ என ஒருச்சொல்லாக எழுதுவது நிலையான வடிவம்; மேற்கோளில் வேற்றுமை உருபும் சேர்க்கப்பட வேண்டும்.
