id: 1JN.4.9
reference: 1 John 4:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: ta
  text: 'இதில் கடவுளின் அன்பு நம்மிடையே[a] வெளிப்பட்டது: நாம் அவர் வழியாக வாழும்படி, கடவுள் தமது ஒரே மகனை[b] உலகத்திற்கு அனுப்பியிருக்கிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நமக்குள்.” இந்தக் கிரேக்கச் சொற்றொடர் கடவுளின் அன்பு விசுவாசிகளுக்குள் வெளிப்பட்டதையோ, ஒரு சமூகமாக நம்மிடையே வெளிப்பட்டதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'பாரம்பரிய மொழிபெயர்ப்பு: “தமது ஒரேபேறான மகனை.” μονογενής என்ற கிரேக்கச் சொல் மகனின் தனித்துவத்தை வலியுறுத்துகிறது; “ஒரேபேறான” என்பது வரலாற்றுச் சபை மொழிவழக்கைப் பாதுகாக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: இதில்தான்
  rationale: பின்வரும் ὅτι கூற்று, கடவுளின் அன்பு எவ்வாறு வெளிப்பட்டது என்பதை விளக்குகிறது. ‘இதில்தான்’ என்பது கிரேக்கச் சுட்டுச் சொற்றொடரின் அமைப்பையும் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐφανερώθη
  choice: வெளிப்பட்டது
  rationale: φανερόω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம், மறைந்திருந்த ஒன்று காணத்தக்கதாக அல்லது அறியத்தக்கதாக ஆனதைக் குறிக்கிறது. ‘வெளிப்பட்டது’ இயல்பான தமிழில் அந்தப் பொருளைத் தருகிறது.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: கடவுளின் அன்பு
  rationale: சூழலில் இது கடவுளிடமிருந்து வெளிப்படும் அன்பைக் குறிக்கிறது; தமிழில் உடைமைத் தொடர் இதை இயல்பாக எடுத்துரைக்கிறது.
- source_word: ἐν ἡμῖν
  choice: நம்மிடையே
  rationale: கடவுளின் அன்பு விசுவாசிகளின் சமூகத்தின் நடுவில் அல்லது அவர்களிடத்தில் வெளிப்பட்டது என்ற இயல்பான சூழற்பொருளைத் தருகிறது. ‘நமக்குள்’ என்ற உட்புறப் பொருளும் கிரேக்கத்தில் சாத்தியமாதலால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: ὅτι
  choice: ':'
  rationale: கடவுளின் அன்பு எதில் வெளிப்பட்டது என்பதை அடுத்த கூற்று விளக்குகிறது. தமிழில் முக்காற்புள்ளி இந்த விளக்க உறவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: தமது ஒரே மகனை
  rationale: μονογενής இங்கு மகனின் ஒப்பற்ற, ஒரே தன்மையை வலியுறுத்துகிறது. ‘ஒரே மகன்’ என்பது தற்போதைய தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; வரலாற்றுச் சொல்வழக்கு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀπέσταλκεν
  choice: அனுப்பியிருக்கிறார்
  rationale: கிரேக்க நிறைவுநிலை வினை, நிறைவேறிய அனுப்புதலின் தொடரும் முக்கியத்துவத்தை உணர்த்துகிறது; ‘அனுப்பியிருக்கிறார்’ அதைத் தமிழில் காக்கிறது.
- source_word: εἰς τὸν κόσμον
  choice: உலகத்திற்குள்
  rationale: மகன் உலகத்துக்குள் அனுப்பப்பட்டார் என்ற இயக்கத்தையும் இலக்கையும் εἰς தெளிவாகக் குறிக்கிறது.
- source_word: ἵνα ζήσωμεν
  choice: நாம் ... வாழும்படி
  rationale: ἵνα உடன் வரும் வினை நோக்கத்தை வெளிப்படுத்துகிறது. ‘வாழும்படி’ அந்த நோக்க உறவை இயல்பான தமிழில் தருகிறது.
- source_word: δι’ αὐτοῦ
  choice: அவர் வழியாக
  rationale: διά உடன் வரும் பிறப்புமை உருபு வழிமுறை அல்லது இடைமுகத்தைக் குறிக்கிறது. ‘அவர் வழியாக’ என்பது வாழ்வு மகன் மூலமாகக் கிடைப்பதைத் தெளிவாகச் சொல்கிறது.
theological_decisions:
- issue: மகனைப் பற்றிய μονογενής என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘ஒரே மகன்’
  alternative: ‘ஒரே பேறான மகன்’ அல்லது ‘தனித்துவமான மகன்’
  rationale: இந்தச் சொல் மகனுக்கும் பிதாவுக்கும் உள்ள ஒப்பற்ற உறவையும் மகனின் தனித்தன்மையையும் வலியுறுத்துகிறது. பிறப்பித்தல் பற்றிய பிற்காலக் கோட்பாட்டு வடிவத்தைச் சொல்லின் நேரடிப் பொருளுக்குள் திணிக்காமல், வரலாற்று மொழிபெயர்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: ἐν ἡμῖν என்பதன் பரப்பு
  choice: ‘நம்மிடையே’
  alternative: ‘நமக்குள்’
  rationale: சூழலில் கடவுளின் அன்பு சமூகத்தின் நடுவில் வெளிப்பட்டது என்ற பொருள் இயல்பானது. அதேவேளையில், விசுவாசிகளுக்குள் அது வெளிப்பட்டது என்ற உட்புறப் பொருளையும் கிரேக்கம் அனுமதிப்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடியதாய் இருந்தாலும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘குமாரன்’ என்பதற்குப் பதில் தற்போதைய இயல்பான ‘மகன்’ பயன்படுத்தப்பட்டது. கிரேக்கத்தின் விளக்க அமைப்பை முக்காற்புள்ளி மூலம் காத்து, உண்மையான சொற்பொருள் தெளிவின்மைகள் அடிக்குறிப்புகளில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
