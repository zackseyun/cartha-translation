  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: ta
  text: சகோதரர்களே[a], உலகம் உங்களை வெறுத்தால் வியப்படையாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பது கிரேக்க மொழியிலுள்ள ஆண்பால் பன்மை வடிவத்தை மொழிபெயர்க்கிறது; இங்கே இது பெண்கள் உட்பட விசுவாசிகள் அனைவரையும் குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: வியப்படையாதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை வடிவம் ஒரு தடையைத் தெரிவிக்கிறது. ‘வியப்படையாதீர்கள்’ என்பது இச்சூழலில் இயல்பான நவீனத் தமிழில் ஆச்சரியப்பட வேண்டாம் என்ற பொருளைத் துல்லியமாகக் கொடுக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: இது ἀδελφός என்பதன் ஆண்பால் பன்மை விளிவடிவம். ‘சகோதரர்களே’ என்பது மூலத்தின் இலக்கண வடிவத்தையும் நேரடி அழைப்பையும் காக்கிறது; விசுவாசக் குழுவின் பெண்களும் இதில் அடங்கியிருக்கலாம் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: εἰ
  choice: -த்தால்
  rationale: εἰ என்னும் நிபந்தனை இடைச்சொல்லைத் தமிழின் இயல்பான நிபந்தனை விகுதியான ‘-த்தால்’ மூலம் வழங்குகிறது; அதை ‘எப்போது’ என்று உறுதிப்படுத்தி விளக்காமல் மூலத்தின் நிபந்தனைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: μισεῖ
  choice: வெறுத்தால்
  rationale: μισέω என்பதன் நிகழ்காலச் செயப்படிவம் வெறுப்பைத் தெரிவிக்கிறது. நிபந்தனை வாக்கிய அமைப்பில் ‘வெறுத்தால்’ என்பது தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ὁ κόσμος
  choice: உலகம்
  rationale: யோவானின் எழுத்துகளில் κόσμος கடவுளுக்கு எதிரான மனித ஒழுங்கைக் குறிக்கக்கூடும். ‘உலகம்’ என்ற நேரடி சொல் அதன் பரந்த இறையியல் நுணுக்கத்தைப் பாதுகாத்து, விளக்க உரையை மொழிபெயர்ப்புக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ἀδελφοί என்பதிலுள்ள பிரதிநிதித்துவ ஆண்பால் அழைப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று ஆண்பால் பன்மையைத் தக்கவைத்தல்
  alternative: ‘சகோதர சகோதரிகளே’ அல்லது ‘உடன்பிறப்புகளே’
  rationale: மூல கிரேக்கத்தின் ஆண்பால் பன்மை வடிவம் பாதுகாக்கப்படுகிறது. அதேவேளையில், இந்த அழைப்பு பெண்கள் உட்பட விசுவாசிகள் அனைவரையும் குறித்திருக்கலாம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: κόσμος என்பதன் யோவானிய இறையியல் பொருள்
  choice: விளக்க விரிவாக்கமின்றி ‘உலகம்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுளுக்கு எதிரான உலகம்’ அல்லது ‘உலக அமைப்பு’
  rationale: ‘உலகம்’ என்பது மூலச் சொல்லின் பரப்பையும் இறையியல் அழுத்தத்தையும் காக்கிறது. ‘கடவுளுக்கு எதிரான சமூகம்’ போன்ற விரிவாக்கம் சூழல் தரும் பொருளை முதன்மை உரையிலேயே தீர்மானித்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. தமிழின் இயல்பான சொல் வரிசைக்காக நிபந்தனைப் பகுதி முதலில் வைக்கப்பட்டுள்ளது.
