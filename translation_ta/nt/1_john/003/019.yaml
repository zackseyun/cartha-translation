  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: ta
  text: இதனால் நாம் உண்மையிலிருந்து வந்தவர்கள்[a] என்பதை அறிந்துகொள்வோம்; மேலும், அவர் முன்னிலையில் நம் இருதயத்தைத் தேற்றுவோம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் உண்மைக்குரியவர்கள்.”
