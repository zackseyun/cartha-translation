lexical_decisions:
- source_word: ἐν τούτῳ
  choice: இதனால்
  rationale: அடுத்து கூறப்படும் அறிவுக்கான வழி அல்லது அடிப்படையைச் சுட்டும் தொடராக இருப்பதால், தமிழில் இயல்பான காரணவழிப் பொருளைத் தருகிறது.
- source_word: γνωσόμεθα
  choice: அறிந்துகொள்வோம்
  rationale: எதிர்கால வினை வடிவத்தை இயல்பான நவீனத் தமிழில் தருகிறது; தேவையற்ற கூடுதல் நுண்பொருளைச் சேர்க்கவில்லை.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: நாம் உண்மையிலிருந்து வந்தவர்கள்
  rationale: ἐκ குறிக்கும் மூலம் அல்லது தோற்றத்தை வெளிப்படையாகப் பாதுகாக்கிறது; ‘உண்மைக்குரியவர்கள்’ என்ற உடைமை அல்லது சார்பு விளக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: அவருக்கு முன்பாக
  rationale: தேவனுடைய முன்னிலையில் என்ற உறவுநிலைப் பொருளைக் கொண்ட மூலத்தின் சுருக்கமான, மரியாதையான வடிவம்.
- source_word: πείσομεν
  choice: தேற்றுவோம்
  rationale: இருதயம் செயப்படுபொருளாக வரும் இச்சூழலில், வாதத்தால் சம்மதிக்கச் செய்வதைவிட உள்ளார்ந்த உறுதியும் அமைதியும் அளித்தல் இயல்பான பொருள்; எனினும் சொல்லின் அடிப்படை ‘இணங்கச் செய்தல்’ வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τὴν καρδίαν ἡμῶν
  choice: நம் இருதயத்தை
  rationale: கிரேக்கத்தில் உள்ள ஒருமையைப் பாதுகாக்கிறது; கூட்டுப் பொருளுடைய ‘நம்’ என்பதுடன் தமிழிலும் ஏற்றதாக உள்ளது.
theological_decisions:
- issue: ‘உண்மையிலிருந்து’ என்பதன் யோவானிய இறையியல் பொருள்
  choice: உண்மையிலிருந்து வந்தவர்கள்
  alternative: உண்மைக்குரியவர்கள்
  rationale: உண்மையுடனான மூலம் அல்லது தோற்ற உறவை உரை வெளிப்படுத்துகிறது; இதை ‘தேவனுடைய மக்கள்’ போன்ற வலுவான கோட்பாட்டு விரிவாக்கமாக மாற்றாமல் அதன் இறையியல் செறிவையும் திறந்த தன்மையையும் காக்கிறது.
- issue: இருதயத்தைச் செயப்படுபொருளாகக் கொண்ட πείσομεν என்பதன் பொருள்
  choice: நம் இருதயத்தைத் தேற்றுவோம்
  alternative: நம் இருதயத்தை இணங்கச் செய்வோம்
  rationale: உடனடிச் சூழல் தேவனுக்கு முன்பான உள்ளார்ந்த உறுதியைப் பற்றியது. ‘தேற்றுவோம்’ இயல்பான தமிழில் இதைத் தெரிவிக்கிறது; ஆனால் ‘இணங்கச் செய்வோம்’ என்ற முறையான வாய்ப்பை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘இருதயம்’ என்ற உருவகம் ‘மனசாட்சி’ என விளக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது; வசனம் அடுத்த வசனத்துடன் தொடர்வதை உணர்த்த இறுதியில் முற்றுப்புள்ளி வைக்கப்படவில்லை.
