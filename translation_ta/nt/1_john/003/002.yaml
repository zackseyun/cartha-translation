source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: ta
  text: '**1 யோவான் 3:2**


    அன்புக்குரியவர்களே, இப்போது நாம் கடவுளின் பிள்ளைகளாக இருக்கிறோம். நாம் என்னவாக இருப்போம் என்பது இன்னும் வெளிப்படுத்தப்படவில்லை. அவர் வெளிப்படுத்தப்பட்டால்[a][b], நாம் அவரைப் போல இருப்போம் என்பதை அறிந்திருக்கிறோம்; ஏனெனில், அவர் இருப்பது போலவே அவரைக் காண்போம்.


    [a] அல்லது, “அது வெளிப்படுத்தப்பட்டால்,” அதாவது நாம் என்னவாக இருப்போம் என்பது வெளிப்படுத்தப்பட்டால். கிரேக்கத்தில் இங்கு எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. சூழமைவு, இங்கே கிறிஸ்துவைக் குறிக்கும் “அவர்” என்பதற்குச் சாதகமாக உள்ளது.


    [b] பல மொழிபெயர்ப்புகள் இத்தொடரை, “அவர் வெளிப்படும்போது” என்று மொழிபெயர்க்கின்றன. கிரேக்கத்தில் இதன் நேரடியான பொருள், “அவர் வெளிப்படுத்தப்பட்டால்” என்பதாகும்; வசனத்தின் முற்பகுதியிலும் பயன்படுத்தப்பட்ட அதே வினைச்சொல்லே இங்கும் பயன்படுத்தப்பட்டுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது வெளிப்படுத்தப்பட்டால்,” அதாவது நாம் என்னவாக இருப்போம் என்பது வெளிப்படுத்தப்பட்டால். கிரேக்கத்தில் இங்கு எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. சூழமைவு, இங்கே கிறிஸ்துவைக் குறிக்கும் “அவர்” என்பதற்குச் சாதகமாக உள்ளது.
    reason: alternative_reading
  - marker: b
    text: பல மொழிபெயர்ப்புகள் இத்தொடரை, “அவர் வெளிப்படும்போது” என்று மொழிபெயர்க்கின்றன. கிரேக்கத்தில் இதன் நேரடியான பொருள், “அவர் வெளிப்படுத்தப்பட்டால்” என்பதாகும்; வசனத்தின் முற்பகுதியிலும் பயன்படுத்தப்பட்ட அதே வினைச்சொல்லே இங்கும் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: பன்மை விளிவேற்றில் வரும் அன்பான அழைப்பை இயல்பாகத் தருவதுடன், அன்பு என்ற சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: விசுவாசிகளின் தற்போதைய நிலைக்கும் இன்னும் வெளிப்படாத எதிர்கால நிலைக்கும் உள்ள கால வேறுபாட்டைக் காக்கிறது.
- source_word: τέκνα θεοῦ
  choice: கடவுளின் பிள்ளைகள்
  rationale: பால் வேறுபாட்டைச் சேர்க்காமல், கடவுளோடுள்ள பிள்ளை உறவை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: οὔπω ἐφανερώθη
  choice: இன்னும் வெளிப்படுத்தப்படவில்லை
  rationale: φανερόω என்பதன் இறப்புவினை வடிவையும், இதுவரை வெளிப்படுத்தப்படாத நிலையையும் காக்கிறது.
- source_word: τί ἐσόμεθα
  choice: நாம் என்னவாக இருப்போம்
  rationale: எதிர்காலத்தில் விசுவாசிகளின் நிலை அல்லது தன்மை என்னவாக இருக்கும் என்ற கேள்வியை நேரடியாகத் தருகிறது.
- source_word: οἴδαμεν
  choice: அறிந்திருக்கிறோம்
  rationale: கிரேக்க நிறைவுவடிவ வினையின் நிகழ்காலப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐὰν φανερωθῇ
  choice: அவர் வெளிப்படுத்தப்பட்டால்
  rationale: வெளிப்படையாகக் கூறப்படாத எழுவாயைச் சூழமைவின் அடிப்படையில் கிறிஸ்துவாகக் கொண்டு, நிபந்தனைத் தன்மையையும் இறப்புவினையையும் முந்தைய φανερόω உடனான சொல் தொடர்பையும் காக்கிறது.
- source_word: ὅμοιοι αὐτῷ
  choice: அவரைப் போல இருப்போம்
  rationale: ஒற்றுமையை அல்ல, உண்மையான ஒப்புமையைச் சுட்டுகிறது; இயல்பான தமிழிலும் உள்ளது.
- source_word: ὀψόμεθα αὐτὸν
  choice: அவரைக் காண்போம்
  rationale: எதிர்காலச் செயலும் நேரடி செயப்படுபொருளும் சுருக்கமாகவும் தெளிவாகவும் காக்கப்படுகின்றன.
- source_word: καθώς ἐστιν
  choice: அவர் இருப்பது போலவே
  rationale: அவருடைய உண்மையான நிலையை அப்படியே காண்பது என்ற ஒப்பீட்டு வலிமையைத் தருகிறது.
theological_decisions:
- issue: ἐὰν φανερωθῇ என்பதில் வெளிப்படையாகக் குறிப்பிடப்படாத எழுவாயின் குறிப்பு
  choice: எழுவாய் கிறிஸ்து எனக் கொண்டு, “அவர் வெளிப்படுத்தப்பட்டால்” என்று மொழிபெயர்க்கப்பட்டது.
  alternative: விசுவாசிகள் எதிர்காலத்தில் என்னவாக இருப்பார்கள் என்பதைக் குறிக்கும் வகையில், “அது வெளிப்படுத்தப்பட்டால்”; அல்லது விளக்கமாக, “அவர் வெளிப்படும்போது.”
  rationale: தொடர்ந்து வரும் “அவரைப் போல” மற்றும் “அவரைக் காண்போம்” என்பவை கிறிஸ்துவையே குறிப்பதாகச் சூழமைவு வலுவாக உணர்த்துகிறது. எனினும் கிரேக்கத்தில் எழுவாய் மறைந்திருப்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; ἐάν என்பதும் இறப்புவினை வடிவமும் பிரதான உரையில் காக்கப்பட்டுள்ளன.
- issue: விசுவாசிகளின் எதிர்கால ஒப்புமையின் இயல்பு
  choice: “அவரைப் போல இருப்போம்” என்பது கிறிஸ்துவுடனான ஒரே தன்மையையோ அடையாள ஒற்றுமையையோ அல்ல, உண்மையான ஒப்புமையைச் சொல்கிறது.
  alternative: “அவர் இருப்பது போலவே நாமும் ஆவோம்” போன்ற, சமத்துவம் அல்லது முற்றான ஒரே தன்மை எனப் புரிந்துகொள்ளப்படக்கூடிய வலுவான பரிமாற்றங்கள்.
  rationale: ὅμοιοι என்பது ஒப்புமையைக் குறிக்கிறது, முற்றான ஒருமையைக் குறிக்காது. ஆகவே வசனத்தின் வலுவான மாற்ற வாக்குறுதியும் படைப்பாளர்–படைப்பு வேறுபாடும் இரண்டும் தக்கவைக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. “அன்புக்குரியவர்களே,” “கடவுளின் பிள்ளைகள்,” “அறிந்திருக்கிறோம்” போன்ற சொற்கள் இயல்பையும் மூலத்தின் உறவுச் சாயலையும் காக்கின்றன. கிரேக்கத்தின் மறைந்த எழுவாய் மற்றும் ἐάν நிபந்தனைத் தன்மை பிரதான உரையிலும் அடிக்குறிப்புகளிலும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
