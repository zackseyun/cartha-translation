id: 1JN.3.11
reference: 1 John 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅτι αὕτη ἐστὶν ἡ ἀγγελία ἣν ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: ta
  text: 'ஏனெனில், தொடக்கத்திலிருந்து நீங்கள் கேட்ட செய்தி இதுதான்: நாம் ஒருவருக்கொருவர் அன்புகூர வேண்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் ஒருவருக்கொருவர் அன்புகூரும்படியாக” அல்லது “நாம் ஒருவருக்கொருவர் அன்புகூருவோமாக.”
    reason: ἵνα + துணைவினை அமைப்பு செய்தியின் உள்ளடக்கம், நோக்கம், அல்லது அழைப்பு என்ற நுட்பங்களை ஏற்கக்கூடும்.
lexical_decisions:
- source_word: Ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கருத்தை விளக்கும் இணைப்பாக ὅτι இங்கு செயல்படுவதால், ‘ஏனெனில்’ அதன் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἡ ἀγγελία
  choice: செய்தி
  rationale: ἀγγελία என்பது அறிவிக்கப்பட்ட அல்லது தெரிவிக்கப்பட்ட செய்தியைக் குறிக்கிறது; இச்சூழலில் ‘செய்தி’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: ἣν ἠκούσατε ἀπ’ ἀρχῆς
  choice: தொடக்கத்திலிருந்து நீங்கள் கேட்ட
  rationale: கிரேக்க இறந்தகால வினையின் நேரடியான பொருளையும், யோவானின் எழுத்துகளில் முக்கியமான ἀπ’ ἀρχῆς என்ற சொற்றொடரையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἵνα ἀγαπῶμεν
  choice: நாம் … அன்புகூர வேண்டும்
  rationale: ἵνα உடன் வரும் நிகழ்காலத் துணைவினை இங்கு செய்தியின் அறநெறி உள்ளடக்கத்தை எடுத்துரைக்கிறது. ‘வேண்டும்’ அதன் கடமையுணர்வைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; நோக்கம் அல்லது நேரடி அழைப்பு என்ற மாற்று நுட்பங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பரச் செயலைக் குறிக்கும் ἀλλήλους என்பதற்கான இயல்பான தமிழ் இணை; விசுவாசக் குழுவினரிடையேயான பரஸ்பர அன்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ἵνα ἀγαπῶμεν ἀλλήλους என்பதன் இலக்கணச் செயல்பாடு
  choice: செய்தியின் உள்ளடக்கமாக, ‘நாம் ஒருவருக்கொருவர் அன்புகூர வேண்டும்’
  alternative: ‘நாம் ஒருவருக்கொருவர் அன்புகூரும்படியாக’ அல்லது ‘நாம் ஒருவருக்கொருவர் அன்புகூருவோமாக’
  rationale: சூழலில் இது தொடக்கத்திலிருந்து கேட்ட செய்தியின் அறநெறி சார்ந்த சாராம்சத்தைச் சொல்கிறது. எனினும் ἵνα நோக்கத்தையும், துணைவினை அழைப்பின் நுட்பத்தையும் ஏற்கக்கூடியதால் அவை அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அன்புகூர வேண்டும்’ என்பது தெளிவான அறநெறிக் கடமையைச் சொல்கிறது; கிரேக்கத்தின் உண்மையான இலக்கண நுட்பம் அடிக்குறிப்பில் திறந்தவாறு வைக்கப்பட்டுள்ளது.
