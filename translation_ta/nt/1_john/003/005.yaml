  terminology: ‘வெளிப்பட்டார்,’ ‘பாவங்களை நீக்குவதற்காக,’ and ‘அவரில் பாவம் இல்லை’ are appropriate and do not impose a particular atonement theory. The respectful pronoun ‘அவர்/அவரில்’ is natural in context while retaining the source’s pronominal reference.
