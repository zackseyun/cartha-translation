id: 1JN.3.5
reference: 1 John 3:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: ta
  text: மேலும், அவர் பாவங்களை நீக்குவதற்காக[b] வெளிப்பட்டார்[a] என்பதும், அவரில் பாவம் இல்லை என்பதும் உங்களுக்குத் தெரியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தோன்றினார்.’ கிரேக்கச் சொல் ‘வெளிப்பட்டார்’ அல்லது ‘தோன்றினார்’ என்ற பொருளில் வரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பாவங்களைச் சுமந்து அகற்றுவதற்காக.’ கிரேக்க வினைச்சொல் ‘நீக்குதல்,’ ‘அகற்றுதல்,’ அல்லது ‘சுமந்து அகற்றுதல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: உங்களுக்குத் தெரியும்
  rationale: οἶδα நிறைவுக்கால வடிவில் இருந்தாலும், கொய்னே கிரேக்கத்தில் நிகழ்காலப் பொருளில் வழக்கமாகப் பயன்படுகிறது; தமிழில் இயல்பான நிகழ்கால அறிவைக் குறிக்கிறது.
- source_word: ἐκεῖνος
  choice: அவர்
  rationale: சொல்லளவில் ‘அந்த ஒருவர்’ எனப் பொருள்படலாம்; ஆனால் இச்சூழலில் இயேசு கிறிஸ்துவையே சுட்டுகிறது. ‘அவர்’ என்பது இயல்பாகவும் மரியாதையுடனும் உள்ளது.
- source_word: ἐφανερώθη
  choice: வெளிப்பட்டார்
  rationale: கிறிஸ்து வரலாற்றில் காணத்தக்கவராக வந்ததை இச்சொல் குறிக்கிறது. ‘வெளிப்பட்டார்’ என்பது கிரேக்கச் சொல்லின் வெளிப்பாடு/தோற்றம் ஆகிய கருத்துகளைத் தக்கவைக்கிறது.
- source_word: ἵνα
  choice: நீக்குவதற்காக
  rationale: ἵνα நோக்கத்தைக் குறிக்கிறது; தமிழின் ‘-வதற்காக’ அமைப்பு அந்த நோக்கப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ἁμαρτίας
  choice: பாவங்களை
  rationale: கிரேக்கத்தில் பன்மையாக இருப்பதால், தனித்தனி பாவச் செயல்களின் பன்மையை ‘பாவங்களை’ என்று தக்கவைக்கிறது.
- source_word: ἄρῃ
  choice: நீக்க
  rationale: αἴρω என்பதற்கு எடுத்தல், சுமத்தல்/சுமந்து செல்லுதல், அகற்றுதல் ஆகிய பொருள்கள் உண்டு. இங்கு ‘நீக்க’ என்பது பாவங்களை அகற்றும் நோக்கத்தைத் தெளிவாக்குகிறது; அதை ஒரு குறிப்பிட்ட பாவநிவாரணக் கோட்பாட்டுக்குள் மட்டுப்படுத்துவதில்லை.
- source_word: ἁμαρτία
  choice: பாவம்
  rationale: ஒருமையில் வரும் சொல்லை ‘பாவம்’ என நேரடியாக மொழிபெயர்ப்பது அவருடைய முழுமையான பாவமின்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: ἐν + வேற்றுமை வடிவின் நேரடியான யோவானியச் சொல்லாட்சியை ‘அவரில்’ தக்கவைக்கிறது.
theological_decisions:
- issue: ἐκεῖνος என்பதன் சுட்டுப்பொருள்
  choice: இயேசு கிறிஸ்துவைக் குறிக்கும் ‘அவர்’
  alternative: ‘அந்த ஒருவர்’ என்ற பொதுவான வடிவம்
  rationale: பாவங்களை நீக்குவதற்காக வெளிப்பட்டவரும் பாவம் இல்லாதவருமான இவர் உடனடிச் சூழலில் இயேசு கிறிஸ்துவே. பெயரைச் சேர்க்காமல் ‘அவர்’ என மொழிபெயர்ப்பது மூலத்தின் சுட்டுமுறையைப் பாதுகாக்கிறது.
- issue: பாவங்களுடன் αἴρω என்பதன் பொருள்
  choice: பாவங்களை நீக்குதல்
  alternative: பாவங்களைச் சுமந்து அகற்றுதல்
  rationale: முதன்மை உரை பாவங்களை அகற்றுவதை முன்னிறுத்துகிறது. ‘நீக்குதல்’ என்பது அந்த மையப்பொருளைக் காத்து, பாவநிவாரணத்தின் செயல்முறையைத் தேவையின்றி ஒரு குறிப்பிட்ட விளக்கமாக முடிவுசெய்யாது; சுமந்து அகற்றுதல் என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் தொடக்க இணைப்பை ‘மேலும்’ என்றும், இரண்டு ὅτι உட்பொருள்களையும் தமிழில் இணையான ‘என்பதும் ... என்பதும்’ அமைப்பாலும் வெளிப்படுத்துகிறது.
