  source_fidelity: 'Greek sense is accurately preserved: the readers know that he was manifested/appeared for the purpose of taking away sins, and that sin is not in him. The plural ‘பாவங்களை’ and singular ‘பாவம்’ correctly reflect the Greek distinction, and the purpose force of ἵνα is retained in ‘நீக்குவதற்காக.’'
