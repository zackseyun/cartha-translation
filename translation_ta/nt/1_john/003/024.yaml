source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: ta
  text: அவருடைய கட்டளைகளைக் கடைப்பிடிப்பவர் அவரில் நிலைத்திருக்கிறார்; அவரும் அப்படிப்பட்டவரில் நிலைத்திருக்கிறார்.[a] அவர் நம்மில் நிலைத்திருக்கிறார் என்பதை அவர் நமக்குக் கொடுத்த ஆவியினாலே[b] நாம் அறிந்துகொள்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலைத்திருக்கிறார்’ என்பதற்கு ‘தங்கியிருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். மூலச்சொல் தொடர்ந்திருக்கும் உறவுநிலையை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர் நமக்குக் கொடுத்த ஆவியிலிருந்து.’ கிரேக்க முன்னிடைச்சொல் வழிமுறையையும் மூலத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: கடைப்பிடிப்பவர்
  rationale: கட்டளைகளுக்குக் கீழ்ப்படிந்து அவற்றைத் தொடர்ந்து பின்பற்றுதல் என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘காக்கிறவர்’ என்பதைக் காட்டிலும் இச்சூழலில் தெளிவானது.
- source_word: τὰς ἐντολὰς
  choice: கட்டளைகளை
  rationale: யோவானியச் சூழலில் ἐντολή என்பதன் அதிகாரமுள்ள ஒழுக்க மற்றும் உடன்படிக்கை சார்ந்த வலிமையைப் பேணுகிறது.
- source_word: μένει
  choice: நிலைத்திருக்கிறார்
  rationale: இவ்வசனத்தில் மூன்று முறை வரும் யோவானிய முக்கியச் சொல்லின் தொடர்ச்சியான உறவுநிலையை ஒரே சொல்லால் பேணுகிறது.
- source_word: ἐν αὐτῷ / ἐν ἡμῖν
  choice: அவரில் / நம்மில்
  rationale: ἐν என்பதன் உள்ளுறையும் உறவைக் குறிக்கும் வடிவத்தை அதிக விளக்கமின்றி நேரடியாகப் பேணுகிறது.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: என்பதை ... நாம் அறிந்துகொள்கிறோம்
  rationale: அடுத்துவரும் ஆவியை, அறிதலின் அடிப்படை அல்லது வழிமுறையாக இயல்பான தமிழில் இணைக்கிறது.
- source_word: ἐκ τοῦ πνεύματος
  choice: ஆவியினாலே
  rationale: ἐκ இங்கு அறிதலுக்கான மூலம் அல்லது ஆதாரத்தைக் குறிக்கலாம்; ‘ஆவியினாலே’ என்பது தமிழில் இயல்பாக அந்த வழிமுறையை வெளிப்படுத்துகிறது, மாற்றுப் பொருள் அடிக்குறிப்பில் பேணப்படுகிறது.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: அவர் நமக்குக் கொடுத்த
  rationale: உறவுப்பெயரெச்சத் தொடரை இயல்பான தமிழ் பெயரெச்சத் தொடராக மாற்றி, ἔδωκεν என்பதன் இறந்தகால நிகழ்வைத் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: αὐτῷ / αὐτός மற்றும் ‘நம்மில் நிலைத்திருக்கிறார்’ என்பவற்றின் குறிப்பு
  choice: இறைவனைச் சுட்டும் ‘அவர்’ என்ற பிரதிப்பெயர் பேணப்பட்டுள்ளது; கட்டளைகளைக் கடைப்பிடிக்கும் நபரை வேறுபடுத்த ‘அப்படிப்பட்டவரில்’ பயன்படுத்தப்பட்டுள்ளது.
  alternative: ‘அவர்’ என்பதற்குப் பதிலாக நேரடியாக ‘இறைவன்’ என்று சேர்த்தல்; அல்லது இறுதி குறிப்பை கிறிஸ்துவோடு வெளிப்படையாக இணைத்தல்.
  rationale: மூலத்தில் பெயர்ச்சொல் அல்ல, பிரதிப்பெயரே உள்ளது. உடனடிச் சூழல் இறைவனை முதன்மைக் குறிப்பாகக் காட்டினாலும், பெயரைச் சேர்த்து யோவானிய இறையியல் நெருக்கத்தை அளவுக்கு மீறித் தீர்மானிக்காமல் மூல வடிவம் பேணப்படுகிறது.
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: தூய ஆவியைக் குறிக்கும் வகையில் ‘ஆவி’ மரியாதைச் சூழலில் பயன்படுத்தப்பட்டுள்ளது.
  alternative: மனித ஆவி அல்லது பொதுவான ஆன்மிக ஆற்றல் எனப் புரிந்துகொள்ளுதல்.
  rationale: ‘அவர் நமக்குக் கொடுத்த’ என்ற தொடரும் யோவானியச் சூழலும் இறைவனால் கொடுக்கப்பட்ட தூய ஆவியையே சுட்டுகின்றன; வசனத்தில் இல்லாத முழுப் பட்டமான ‘தூய ஆவி’ சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனுக்கான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ஒரே தொடரில் வரும் இரண்டு வேறுபட்ட நபர்களைக் குழப்பாமல் காட்ட ‘அப்படிப்பட்டவரில்’ எனச் சிறிதளவு வெளிப்படுத்தப்பட்டுள்ளது; மூலத்தின் பிரதிப்பெயர் சார்ந்த இறையியல் நெருக்கம் வேறு விதமாகத் தீர்க்கப்படவில்லை.
