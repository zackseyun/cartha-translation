source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: ta
  text: அவர்மேல் இந்த நம்பிக்கையை வைத்திருக்கும் ஒவ்வொருவரும்[a] தம்மைத் தூய்மைப்படுத்திக்கொள்கிறார்; அவர்[b] தூயவராக இருப்பதுபோலவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரில் இந்த நம்பிக்கையை வைத்திருக்கும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் நம்பிக்கையின் இலக்கையோ அது சார்ந்திருக்கும் ஆதாரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்’ என்பது சூழலில் பெரும்பாலும் மகன், அதாவது கிறிஸ்துவைக் குறிக்கிறது; ஆனால் கிரேக்க மூலத்தில் பெயருக்குப் பதிலாகச் சுட்டுப்பெயரே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: வைத்திருக்கும் ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையின் பொதுவான, தொடர்ச்சியான தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν ἐλπίδα ταύτην
  choice: இந்த நம்பிக்கையை
  rationale: ταύτην முந்தைய வசனத்தில் கூறப்பட்ட எதிர்பார்ப்பைச் சுட்டுகிறது; ἐλπίς இங்கு வெறும் ஆசையல்ல, உறுதியான எதிர்பார்ப்பு.
- source_word: ἐπ’ αὐτῷ
  choice: அவர்மேல்
  rationale: நம்பிக்கையின் இலக்கு அல்லது ஆதாரம் அவரே என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; ‘அவரில்’ என்பதும் சாத்தியம்.
- source_word: ἁγνίζει ἑαυτὸν
  choice: தம்மைத் தூய்மைப்படுத்திக்கொள்கிறார்
  rationale: ἁγνίζω என்பதன் தூய்மையாக்குதல் என்ற செயற்பொருளைத் தக்கவைத்து, ἑαυτὸν என்ற தன்மறுமைப் பெயர்ச்சொல்லையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καθὼς
  choice: இருப்பதுபோலவே
  rationale: இரு தரப்புக்கும் இடையிலான ஒப்புமையை வலியுறுத்தும் καθὼς என்பதன் பொருளை இயல்பாக அளிக்கிறது.
- source_word: ἐκεῖνος
  choice: அவர்
  rationale: சூழலில் கிறிஸ்து/மகனைச் சுட்டுவது மிக இயல்பானது; எனினும் மூலத்தில் இல்லாத பட்டத்தைச் சேர்க்காமல் பிரதிப்பெயரை வைத்திருக்கிறது.
- source_word: ἁγνός
  choice: தூயவர்
  rationale: ἁγνίζει உடனான சொற்பொருள் தொடர்பை ‘தூய்மைப்படுத்திக்கொள்கிறார் / தூயவர்’ என்ற இணைப்பால் பாதுகாக்கிறது.
theological_decisions:
- issue: αὐτῷ மற்றும் ἐκεῖνος என்பவற்றின் சுட்டுப்பொருள்
  choice: இரண்டையும் ‘அவர்’ என்று மொழிபெயர்த்து, பிரதிப்பெயர்களாகவே வைத்தல்
  alternative: ‘கிறிஸ்து’ அல்லது ‘மகன்’ என்று வெளிப்படையாகப் பெயரிடுதல்; அல்லது αὐτῷ பிதாவைக் குறிக்கிறது எனக் கொள்ளுதல்
  rationale: உடனடிச் சூழல் கிறிஸ்து/மகனை வலுவாகச் சுட்டினாலும், கிரேக்க உரை பெயரையோ பட்டத்தையோ தராமல் பிரதிப்பெயர்களையே பயன்படுத்துகிறது. எனவே சுட்டுப்பொருளை மொழிபெயர்ப்பிலேயே முடிவுசெய்யாமல் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: ἑαυτὸν என்ற ஆண்பால் ஒருமைத் தன்மறுமைப் பெயர்ச்சொல்
  choice: ஒவ்வொருவரும் … தம்மை
  alternative: தன்னை; தங்களை
  rationale: தமிழின் மரியாதை ஒருமை அமைப்பான ‘ஒவ்வொருவரும் … தம்மை … கொள்கிறார்’ பொதுவான பொருளையும் ஒருமை வடிவையும் இயல்பாகத் தக்கவைக்கிறது.
- issue: தம்மைத் தூய்மைப்படுத்திக்கொள்கிறார் என்ற மனிதச் செயற்பாடு
  choice: மூலத்தின் செயப்பாட்டு வினையை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘தூய்மைப்படுத்தப்படுகிறார்’ என்று இறைச் செயலை வெளிப்படையாக முன்னிறுத்துதல்
  rationale: ἁγνίζει செயப்பாட்டு வினையாக உள்ளது. அதன் இறையியல் தொடர்பை விளக்குவதற்காக மூலத்தில் இல்லாத செயப்பாட்டை மாற்றுவது தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘தூய்மைப்படுத்திக்கொள்கிறார் / தூயவர்’ என்பதால் கிரேக்கத்தின் ஒரே சொல் குடும்பத் தொடர்பு பாதுகாக்கப்படுகிறது. ‘அவர்மேல்’ என்பது நம்பிக்கையின் இலக்கை இயல்பாகக் காட்டுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
