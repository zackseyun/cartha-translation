  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் துல்லியமாக உள்ளன: ποιῶν என்பதன் தொடர்ச்சியான/பழக்கமான செயல் வலிமை, ἐκ τοῦ διαβόλου என்பதன் ஒழுக்க-ஆவிக்குரிய மூல அல்லது சார்பு உருவகம், ἀπ’ ἀρχῆς என்பதன் வரையறுக்கப்படாத காலக் குறிப்பு, மற்றும் ἵνα λύσῃ என்பதன் நோக்கமும் தீர்மானமான முறியடித்தல் பொருளும் பாதுகாக்கப்பட்டுள்ளன. “ஆதிமுதலே பாவம் செய்துவருகிறான்” என்பது சூழலிலுள்ள நீடித்த நிகழ்காலத்தை நன்றாக வெளிப்படுத்துகிறது.'
