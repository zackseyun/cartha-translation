source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: ta
  text: பாவத்தைத் தொடர்ந்து செய்கிறவன் பிசாசிடமிருந்து வந்தவன்[a]; ஏனெனில் பிசாசு ஆதிமுதலே பாவம் செய்துவருகிறான். பிசாசின் செயல்களை அழிப்பதற்காகவே[b] தேவனுடைய மகன் வெளிப்படுத்தப்பட்டார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவம் செய்கிறவன்.” கிரேக்கத்தில் நிகழ்காலப் பெயரெச்சம் பயன்படுத்தப்பட்டிருப்பதால், இது ஒரு தனிப்பட்ட செயலைவிட தொடர்ந்து நடைபெறும் அல்லது ஒருவரின் இயல்பான நடைமுறையாக உள்ள செயலைக் குறிக்கலாம். “பிசாசிடமிருந்து” என்பது சொல்லுக்குச் சொல் “பிசாசிலிருந்து”; இது ஒழுக்க-ஆவிக்குரிய மூலத்தையோ சார்பையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பிசாசின் செயல்களை அவிழ்த்தொழிப்பதற்காகவே.” கிரேக்க வினைச்சொல்லின் அடிப்படைப் பொருள் “அவிழ்ப்பது”; இங்கு அது முறியடிப்பது அல்லது அழிப்பது என்ற பொருளில் வருகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தோன்றினார்.” கிரேக்கச் சொல் தோன்றுதலையும் வெளிப்படுதலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: பாவத்தைத் தொடர்ந்து செய்கிறவன்
  rationale: நிகழ்காலப் பெயரெச்சம் தொடர்ந்து நடைபெறும் அல்லது ஒருவரின் இயல்பான நடைமுறையாக உள்ள செயலைக் குறிக்கிறது. ஒரு தனிப்பட்ட பாவச் செயலை மட்டும் குறிப்பதாகத் தவறாகப் புரிந்துகொள்ளாமல், கிரேக்கத்தின் தொடர்ச்சியான வலிமையை இச்சொற்றொடர் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ διαβόλου
  choice: பிசாசிடமிருந்து வந்தவன்
  rationale: ἐκ என்பது இங்கு ஒழுக்க மற்றும் ஆவிக்குரிய மூலத்தையோ சார்பையோ குறிக்கிறது. பிசாசிடமிருந்து நேரடியாகப் பிறந்தவன் என்ற பொருளை வலியுறுத்தாமல், மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ὁ διάβολος
  choice: பிசாசு
  rationale: இச்சூழலில் διάβολος என்பது சாத்தானைக் குறிக்கும் நிலைபெற்ற தனிப்பட்ட பெயராகச் செயல்படுகிறது; நவீனத் தமிழில் ‘பிசாசு’ தெளிவானதும் பரவலாக அறியப்பட்டதுமான மொழிபெயர்ப்பு.
- source_word: ἀπ’ ἀρχῆς
  choice: ஆதிமுதலே
  rationale: யோவானுக்குரிய பரந்த கால-இறையியல் ஒலிப்பைத் தக்கவைத்து, எந்தக் குறிப்பிட்ட தொடக்கத்தைக் குறிக்கிறது என்பதைத் தேவையின்றி வரையறுக்காமல் விடுகிறது.
- source_word: ἁμαρτάνει
  choice: பாவம் செய்துவருகிறான்
  rationale: ‘ஆதிமுதலே’ என்பதோடு இணைந்த நிகழ்கால வினை, கடந்த காலத்திலிருந்து தொடரும் இயல்பான செயலைக் குறிக்கிறது; ‘செய்துவருகிறான்’ அந்த நீடித்த தன்மையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: εἰς τοῦτο ... ἵνα λύσῃ
  choice: அழிப்பதற்காகவே
  rationale: εἰς τοῦτο அடுத்து வரும் ἵνα நோக்கக் கூற்றை முன்னோக்கிச் சுட்டுகிறது. ‘-தற்காகவே’ நோக்கத்தையும் வலியுறுத்தலையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ἐφανερώθη
  choice: வெளிப்படுத்தப்பட்டார்
  rationale: கிரேக்கச் செயலப்பாட்டு வடிவத்தையும், வெறும் கண்ணுக்குத் தோன்றுதலைவிட அடையாளமும் பணியும் வெளிப்படுவதைச் சுட்டும் யோவானின் மொழியையும் பாதுகாக்கிறது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: தேவனுடைய மகன்
  rationale: மூலத்தின் மகன் உறவையும் கிறிஸ்துவியல் பட்டத்தையும் நேரடியாகவும் மரியாதையான நவீனத் தமிழிலும் வழங்குகிறது.
- source_word: λύσῃ τὰ ἔργα τοῦ διαβόλου
  choice: பிசாசின் செயல்களை அழிப்பதற்கு
  rationale: λύω என்பதன் அடிப்படைப் பொருள் அவிழ்த்தல் என்றாலும், இங்கு பிசாசின் செயல்களை முறியடித்து ஒழிப்பதைக் குறிக்கிறது. ‘அழிப்பது’ தீர்மானமான செயலிழக்கச் செய்தலைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: யோவானின் பாவம் குறித்த நிகழ்கால மொழியின் வலிமை
  choice: தொடர்ச்சியான அல்லது குணவியல்பான பாவ நடைமுறையாக மொழிபெயர்த்தல்
  alternative: ஒரே ஒரு பாவச் செயலைச் செய்யும் எவரையும் குறிக்கும் முழுமையான கூற்று
  rationale: ποιῶν என்ற நிகழ்காலப் பெயரெச்சம் தொடரும் அல்லது பழக்கமான செயலை இயல்பாகக் குறிக்கிறது. இதை ‘தொடர்ந்து செய்கிறவன்’ எனக் கூறுவது, விசுவாசிகளும் பாவம் செய்கிறார்கள் என்று 1 யோவான் 1:8–2:2 ஒப்புக்கொள்வதுடன் உள்ள உண்மையான இறையியல் இழுபறியைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: ‘பிசாசிடமிருந்து’ என்பதன் பொருள்
  choice: ஒழுக்க-ஆவிக்குரிய மூலம் அல்லது சார்பு
  alternative: பிசாசிடமிருந்து சொல்லுக்குச் சொல் உடலியல் அல்லது இயல்பியல் பிறப்பு
  rationale: யோவானின் எதிர்மறை இருமைக் கட்டமைப்பில் இச்சொற்றொடர் ஒருவருடைய ஒழுக்க-ஆவிக்குரிய சார்பை விவரிக்கிறது; மொழிபெயர்ப்பு மூல உருவகத்தைத் தக்கவைக்கிறது, ஆனால் நேரடியான பிறப்பை கற்பிக்கவில்லை.
- issue: தேவனுடைய மகன் வெளிப்படுத்தப்பட்டதன் நோக்கம்
  choice: பிசாசின் செயல்களை அழித்தல் அல்லது அவிழ்த்தொழித்தல்
  alternative: பிசாசின் செயல்களை வெறுமனே வெளிச்சத்துக்குக் கொண்டுவருதல்
  rationale: ἵνα உடன் வரும் λύσῃ நோக்கத்தையும் தீர்மானமான முறியடிப்பையும் குறிக்கிறது. வசனம் கூறுவதைக் கடந்த பிற்காலக் கோட்பாட்டு விவரங்களைச் சேர்க்காமல் இப்பொருள் வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘பாவத்தைத் தொடர்ந்து செய்கிறவன்’ என்பது கிரேக்க நிகழ்காலத்தின் குணவியல்பான வலிமையைத் தெளிவாக்குகிறது. ‘ஆதிமுதலே’ மூலத்தின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடுகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
