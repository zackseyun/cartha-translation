lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: செய்கிற ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல் தன்மையுடன் வரும் நிகழ்காலப் பங்கேற்பு வடிவத்தின் பொதுவான பொருளை இது இயல்பான தமிழில் தருகிறது. சூழலில் தொடர்ச்சியான அல்லது ஒருவரின் இயல்பான நடத்தையைக் குறிக்கக்கூடும்; அதே நேரத்தில் ‘வழக்கமாகச் செய்கிற’ என்று பொருளை மிகையாகக் குறுக்கவில்லை.
- source_word: τὴν ἁμαρτίαν
  choice: பாவம்
  rationale: இங்கு ஒரு குறிப்பிட்ட பாவச்செயலை அல்லாமல், பாவத்தைப் பொதுவான வகையாகக் குறிக்கிறது; தமிழில் ‘பாவம்’ என்பது இயல்பான, தெளிவான பெயர்ப்பு.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: சட்டமீறலையும் செய்கிறார்
  rationale: ποιῶν/ποιεῖ ஆகிய இரு வடிவங்களின் வினை இணைப்பை ‘செய்கிற’/‘செய்கிறார்’ என்று தக்கவைக்கிறது. ‘சட்டமீறல்’ என்பது νόμος என்பதுடனான சொல்லுறவைப் பாதுகாத்து, எந்தக் குறிப்பிட்ட சட்டத் தொகுப்பை இங்கு யோவான் குறிக்கிறார் என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் விடுகிறது.
- source_word: ἀνομία
  choice: சட்டமீறல்
  rationale: ‘அக்கிரமம்’ என்பதைக் காட்டிலும் நவீன வாசகருக்கு வெளிப்படையானது; மேலும் νόμος (‘சட்டம்’) என்பதற்கான எதிர்நிலையைத் தக்கவைக்கிறது. ‘சட்டமின்மை’ என்பது சட்டமே இல்லாத நிலை என்று தவறாகப் புரியக்கூடியதால் தவிர்க்கப்பட்டது.
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: பாவம் என்பது சட்டமீறலே
  rationale: யோவான் கூறும் சுருக்கமான வரையறையை ‘என்பது’ மற்றும் வலியுறுத்தும் ‘-ஏ’ மூலம் இயல்பான தமிழில் நேரடியாகத் தருகிறது; இதை வெறும் விளைவாகவோ எடுத்துக்காட்டாகவோ மென்மைப்படுத்தவில்லை.
theological_decisions:
- issue: நிகழ்கால வினை வடிவங்கள் தனிப்பட்ட ஒரு செயலைக் குறிக்கின்றனவா, தொடரும் அல்லது இயல்பான நடத்தையைக் குறிக்கின்றனவா?
  choice: ‘பாவம் செய்கிற’ என்ற பொதுவான நிகழ்கால வடிவம்
  alternative: ‘பாவம் செய்வதை வழக்கமாகக் கொண்டிருக்கும்’ அல்லது ‘பாவம் செய்துவருகிற’
  rationale: உடனடிச் சூழலில் தொடரும் அல்லது ஒருவரின் இயல்பான நடத்தையைக் குறிக்கும் வாய்ப்பு உள்ளது. ஆனால் கிரேக்க நிகழ்கால வடிவத்தைத் தொழில்நுட்பமான ‘வழக்கச் செயல்’ என்று முழுமையாக முடிவுசெய்யாமல், தமிழின் பொதுவான நிகழ்காலம் அந்த நுணுக்கத்தையும் உண்மையான தெளிவின்மையையும் தக்கவைக்கிறது.
- issue: ἀνομία என்பது எந்தச் சட்டத்தை மீறுவதைக் குறிக்கிறது?
  choice: சட்டமீறல்
  alternative: தேவனுடைய சட்டத்தை மீறுதல்; நியாயப்பிரமாண மீறுதல்; அக்கிரமம்
  rationale: மூலச்சொல்லின் ‘சட்டம்’ சார்ந்த பொருளைத் தக்கவைத்தாலும், இது மோசேயின் சட்டத்தையா, தேவனுடைய சித்தத்தைப் பொதுவாகவா, வேறு விரிவான ஒழுக்கப் பொருளையா குறிக்கிறது என்பதை முதன்மை உரை தீர்மானிக்கவில்லை. ஆகவே பிரிவுசார் விளக்கத்தைச் சேர்க்காமல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘அக்கிரமம்’, ‘நியாயப்பிரமாணம்’ போன்ற பழைய அல்லது மரபுசார் சொற்களுக்கு மாறாக ‘சட்டமீறல்’ தேர்ந்தெடுக்கப்பட்டது. ஒருமை பொதுப்பொருளான ‘ஒவ்வொருவரும்’ என்பதுடன் மரியாதை/பொதுநிலை வினைமுற்றான ‘செய்கிறார்’ பயன்படுத்தப்பட்டுள்ளது.
