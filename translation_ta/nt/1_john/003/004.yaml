  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: ta
  text: பாவம் செய்கிற ஒவ்வொருவரும் சட்டமீறலையும் செய்கிறார்[a]; பாவம் என்பது சட்டமீறலே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவம் செய்துவருகிற ஒவ்வொருவரும்’ என்றும் பொருள் கொள்ளலாம். கிரேக்க நிகழ்கால வடிவங்கள் தொடரும் அல்லது ஒருவரின் இயல்பான நடத்தையைக் குறிக்கக்கூடும்; ‘செய்கிற’ என்ற பெயர்ப்பு அந்தச் சாத்தியத்தைத் தக்கவைத்தபடியே அதை மிகையாக வரையறுக்கவில்லை.
