id: 1JN.3.12
reference: 1 John 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: ta
  text: தீயவனிடமிருந்து வந்தவனான[a] காயீனைப் போல இருக்காதீர்கள். அவன் தன் சகோதரனைப் படுகொலை செய்தான்[b]. எதற்காக அவனைப் படுகொலை செய்தான்? தன் செயல்கள் தீயவையாகவும், தன் சகோதரனின் செயல்கள் நீதியானவையாகவும் இருந்ததால்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமையிலிருந்து வந்தவனான.” கிரேக்கச் சொற்றொடரை அருவமான தீமையைக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்; ஆனால் யோவானின் எழுத்துகளில் இது பொதுவாக ஆளுமையுள்ள தீயவனைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “கொன்றான்.” இங்குள்ள கிரேக்க வினைச்சொல் சாதாரணமாகக் கொல்வதைவிட வன்முறையான, கொடூரமான செயலை உணர்த்துகிறது; நேர்ப்பொருளில் பலியிடுவதற்காக வெட்டிக் கொல்வதற்கும் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: காயீனைப் போல இருக்காதீர்கள்
  rationale: முந்தைய வசனத்தின் அறிவுறுத்தலை இயல்பான தமிழில் தொடர்வதற்காக மறைந்திருக்கும் வினை வெளிப்படுத்தப்பட்டுள்ளது; எதிர்மறை ஒப்பீட்டின் வலிமை காக்கப்படுகிறது.
- source_word: ἐκ τοῦ πονηροῦ
  choice: தீயவனிடமிருந்து வந்தவனான
  rationale: ἐκ குறிக்கும் தோற்றம் அல்லது மூலத்தைப் பாதுகாக்கிறது. யோவானின் பயன்பாட்டில் τοῦ πονηροῦ பொதுவாக ஆளுமையுள்ள ‘தீயவனை’க் குறிப்பதால் அந்த வாசிப்பு முதன்மை உரையில் வைக்கப்பட்டுள்ளது; அருவமான ‘தீமை’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔσφαξεν
  choice: படுகொலை செய்தான்
  rationale: பொதுவான ‘கொன்றான்’ என்பதைவிட σφάζω வன்முறையையும் கொடூரத்தையும் தெளிவாக உணர்த்துகிறது. ‘வெட்டிக் கொன்றான்’ என்பது உரையில் குறிப்பிடப்படாத குறிப்பிட்ட கொலைமுறையைத் தமிழில் தேவையின்றி வலியுறுத்தக்கூடும்.
- source_word: χάριν τίνος
  choice: எதற்காக
  rationale: காரணத்தை வினவும் கிரேக்கச் சொற்றொடருக்கு இயல்பான, நேரடியான தமிழ் இணை.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: தன் செயல்கள் தீயவையாக இருந்தன
  rationale: ἔργα என்பதற்கு இச்சூழலில் ‘செயல்கள்’ என்பது பொதுமக்களுக்கு இயல்பாகவும் ஒழுக்கச்சார்ந்த பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: தன் சகோதரனின் செயல்கள் நீதியானவையாக இருந்தன
  rationale: கிரேக்கத்தில் இரண்டாம் கூறில் விடுபட்டுள்ள ‘செயல்கள்’ தமிழில் தெளிவுக்காக மீண்டும் கூறப்படுகிறது. δίκαια இங்குள்ள ஒழுக்கநெறி எதிர்மறையை வெளிப்படுத்த ‘நீதியானவை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: τοῦ πονηροῦ என்பது ஆளுமையுள்ள ‘தீயவனா’ அல்லது அருவமான ‘தீமையா’?
  choice: ஆளுமையுள்ள ‘தீயவன்’
  alternative: ‘தீமையிலிருந்து வந்தவன்’
  rationale: குறிப்பிட்ட உருபுடன் வரும் πονηρός யோவானிய எழுத்துகளில் பொதுவாக ஆளுமையுள்ள தீயவனைக் குறிக்கிறது. இருப்பினும் இலக்கண ரீதியிலான அருவமான வாசிப்பு முற்றிலும் நீக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் மதிப்புடைய நடையிலும் அமைக்கப்பட்டுள்ளது. முதல் வாக்கியத்தில் முந்தைய அறிவுறுத்தலிலிருந்து புரிந்துகொள்ளப்படும் ‘இருக்காதீர்கள்’ சேர்க்கப்பட்டு தமிழ் வாக்கியம் முழுமையாக்கப்பட்டுள்ளது. ‘தன்’ என்ற தற்சுட்டுப் பெயர் காயீனையே தொடர்ந்து சுட்டுகிறது.
