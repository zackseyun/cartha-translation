  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: ta
  text: சிறுபிள்ளைகளே[a], வார்த்தையினாலோ நாவினாலோ[b] அன்புகூராமல், செயலிலும் உண்மையிலும்[c] அன்புகூருவோமாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிள்ளைகளே’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள கிரேக்க அழைப்பு பாசத்தைக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பேச்சினாலோ’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் சொல்லர்த்தமாக ‘நாவினாலோ’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘செயலிலும் உண்மையிலும்’ என்பதில் ‘உண்மை’ என்பதை ‘மெய்ம்மை’ அல்லது ‘உண்மைத்தன்மை’ என்றும் புரிந்துகொள்ளலாம்; ஆனால் அது வெறும் மனப்பூர்வத்தை மட்டும் குறிக்காது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: சிறுபிள்ளைகளே
  rationale: அன்பும் குடும்ப நெருக்கமும் கொண்ட பன்மை விளிப்பைத் தக்கவைக்கிறது; மூலச்சொல்லின் சிறுமை/பாச நயத்தையும் வெளிப்படுத்துகிறது.
- source_word: μὴ ἀγαπῶμεν
  choice: அன்புகூராமல் … அன்புகூருவோமாக
  rationale: μή உடன் வரும் நிகழ்காலத் தன்மை வினைமுற்றின் முதல் நபர் பன்மை அறிவுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எதிர்மறை பகுதி ἀλλά-வின் நேர்மறை எதிர்மாற்றத்தோடு இணைக்கப்படுகிறது.
- source_word: λόγῳ
  choice: வார்த்தையினால்
  rationale: வாய்மொழி வெளிப்பாட்டைக் குறிக்கும் λόγος என்பதன் அடிப்படைச் சொல்லுணர்வைத் தக்கவைக்கிறது.
- source_word: μηδὲ τῇ γλώσσῃ
  choice: நாவினாலும்
  rationale: γλῶσσα என்பதன் நேரடியான ‘நா’ என்ற உருவகத்தைப் பாதுகாக்கிறது; இங்கு அது பேச்சைக் குறிக்கிறது.
- source_word: ἀλλὰ
  choice: மட்டுமே … அல்லாமல்
  rationale: வெறும் வாய்ச்சொல் அன்புக்கும் செயலில் வெளிப்படும் அன்புக்கும் இடையிலான வலுவான எதிர்மாற்றத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐν ἔργῳ
  choice: செயலில்
  rationale: ἔργον குறிக்கும் செயல் அல்லது நடைமுறை வெளிப்பாட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: καὶ ἀληθείᾳ
  choice: உண்மையிலும்
  rationale: ἀλήθεια என்பதன் விரிவான ‘உண்மை’ பொருளையும் யோவானிய இறையியல் எதிரொலியையும் தக்கவைக்கிறது; அதை ‘மனப்பூர்வம்’ என்று குறுக்கவில்லை.
theological_decisions:
- issue: ‘செயலிலும் உண்மையிலும்’ என்பதில் ‘உண்மை’ என்பதன் பொருள்
  choice: ‘உண்மை’ என்ற சொல்லைத் தக்கவைத்தல்
  alternative: மனப்பூர்வம்; மெய்ம்மைத் தன்மை
  rationale: இங்கு ἀλήθεια வெறும் உள்ளார்ந்த நேர்மையை மட்டும் குறிக்காமல், மெய்யான அன்பையும் கடவுளுடைய உண்மைக்கு இசைந்த அன்பையும் ஒருங்கே குறிக்கக்கூடும். ‘உண்மை’ இந்தப் பொருள் அழுத்தத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் பாசமுமுள்ள அறிவுறுத்தல் நடையைப் பயன்படுத்துகிறது. ‘நா’ என்ற மூல உருவகத்தையும் ‘உண்மை’ என்ற யோவானிய சொல்லையும் காக்கிறது; அதேவேளை ‘மட்டுமே’ என்பது வெறும் வாய்ச்சொல் அன்பை மறுக்கும் எதிர்மாற்றத்தைத் தமிழில் தெளிவாக்குகிறது.
