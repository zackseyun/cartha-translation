  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: ta
  text: இதனால் கடவுளின் பிள்ளைகளும் பிசாசின் பிள்ளைகளும் வெளிப்படையாகத் தெரிகிறார்கள்:[a] நீதியின்படி நடக்காத[b] எவரும் கடவுளிடமிருந்து வந்தவர் அல்ல; தன் சகோதரனுக்கு அன்பு செலுத்தாதவரும் கடவுளிடமிருந்து வந்தவர் அல்ல.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதில்” அல்லது “இதிலிருந்து” என்றும் மொழிபெயர்க்கலாம். இந்த வேறுபாடு எந்த அடிப்படையில் அறியப்படுகிறது என்பதை கிரேக்கச் சொற்றொடர் சுட்டக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “நீதி” என்பதற்கு “நியாயம்” என்றும் பொருள் இருக்கலாம். ஆனால் இச்சூழலில் கடவுளுக்கேற்ற நீதியான ஒழுக்க நடத்தை என்பதே பொருத்தமான பொருள்.
    reason: lexical_alternative
  - marker: c
    text: “தன் சகோதரன் அல்லது சகோதரிக்கு,” அதாவது ஒரு சக விசுவாசிக்கு, என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் ஆண்பால் ஒருமையில் “தன் சகோதரன்” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: இதனால்
  rationale: இந்த வேறுபாடு எதன் அடிப்படையில் அறியப்படுகிறது என்பதைச் சுட்டுகிறது. இயல்பான தமிழில் காரணம்/அடையாள அடிப்படையைத் தெரிவிக்கிறது; கிரேக்கத்தின் நுட்பமான பொருள் வேறுபாடுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: φανερά ἐστιν
  choice: வெளிப்படுகிறது
  rationale: கடவுளின் பிள்ளைகளுக்கும் பிசாசின் பிள்ளைகளுக்கும் இடையிலான வேறுபாடு அறியத்தக்கதாக அல்லது தெளிவாக இருப்பதைக் குறிக்கிறது.
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: கடவுளின் பிள்ளைகள் ... பிசாசின் பிள்ளைகள்
  rationale: மூலத்தின் குடும்ப உறவுச் சித்திரத்தையும் இரு குழுக்களுக்கிடையிலான கூர்மையான வேறுபாட்டையும் அப்படியே காக்கிறது.
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: நீதியைச் செயல்படுத்தாத எவரும்
  rationale: நிகழ்காலப் பங்கேற்புவினை ஒரே தனிச்செயலைவிட பண்பாகத் தொடரும் நடத்தையைக் குறிக்கிறது. ‘செயல்படுத்துதல்’ நீதியை நடைமுறையில் கடைப்பிடிக்கும் பொருளைத் தருகிறது.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து வந்தவர் அல்ல
  rationale: ἐκ என்பது தோற்றுவாய் அல்லது சார்பைச் சுட்டுகிறது. தமிழில் ‘கடவுளிடமிருந்து வந்தவர்’ என்பது மூலத்தின் தோற்றுவாய் நுட்பத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: தன் சகோதரனிடம் அன்புகூராதவர்
  rationale: மூலத்தின் ஆண்பால் ஒருமை வடிவத்தைப் பிரதான உரையில் காக்கிறது; சூழலில் சக விசுவாசியையும் உள்ளடக்கக்கூடிய பரந்த பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: καὶ
  choice: …அவரும் … அல்ல
  rationale: இரண்டாவது பங்கேற்புவினைக்கு முன் வந்த ‘கடவுளிடமிருந்து வந்தவர் அல்ல’ என்ற பயனிலையை கிரேக்கம் மறைமுகமாகப் பகிர்கிறது. தமிழில் அதை மீண்டும் கூறுவது தொடர்பைத் தெளிவாகவும் இயல்பாகவும் ஆக்குகிறது.
theological_decisions:
- issue: ஒழுக்க நடத்தையால் வெளிப்படும் குடும்ப/ஆவிக்குரிய அடையாளம்
  choice: கடவுளின் பிள்ளைகள் மற்றும் பிசாசின் பிள்ளைகள்
  alternative: கடவுளைச் சேர்ந்தவர்கள் மற்றும் பிசாசைச் சேர்ந்தவர்கள்
  rationale: τέκνα என்ற குடும்ப உறவுச் சொல்லை பொதுவான ‘சேர்ந்தவர்கள்’ என்று மென்மைப்படுத்தாமல் காக்கிறது; வசனத்தின் ஆவிக்குரிய பெற்றோர்/சார்பு உருவகமும் பதற்றமும் நிலைத்திருக்கின்றன.
- issue: δικαιοσύνην என்பதன் பொருள்
  choice: நீதி
  alternative: நீதியான நடத்தை / நேர்மை
  rationale: இங்கு கடவுளின் குணத்துக்கு ஏற்ற சரியான ஒழுக்க நடத்தையே முதன்மையாகக் குறித்தாலும், கிரேக்கச் சொல் ‘நீதி’ மற்றும் ‘நீதியான நிலை/நடத்தை’ ஆகிய பொருள் பரப்பைக் கொண்டது. சுருக்கமான ‘நீதி’ அந்தப் பரப்பை மிகையாகக் குறுக்காது.
- issue: ἀδελφός என்ற ஆண்பால் ஒருமை
  choice: தன் சகோதரன்
  alternative: தன் சகோதரன் அல்லது சகோதரி / சக விசுவாசி
  rationale: மூலத்தின் இலக்கண ஆண்பால் ஒருமையைப் பிரதான உரையில் காக்கிறது; யோவானின் பயன்பாட்டில் சக விசுவாசிகளைக் குறிக்கக்கூடிய சூழல் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில், மரியாதைமிக்கவும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதாகவும் வடிவமைக்கப்பட்டது. ‘பிள்ளைகள்’ என்ற யோவானிய குடும்ப உருவகமும் ‘கடவுளிடமிருந்து’ என்ற தோற்றுவாய் மொழியும் காக்கப்பட்டுள்ளன. கிரேக்கத்தில் மறைந்துள்ள இரண்டாம் பயனிலை தமிழில் தெளிவுக்காக மீண்டும் கூறப்பட்டுள்ளது.
