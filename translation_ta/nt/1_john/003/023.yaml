source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: ta
  text: 'அவருடைய கட்டளை இதுவே: அவர் நமக்குக் கட்டளை கொடுத்தபடியே, அவருடைய மகனாகிய இயேசு மேசியாவின்[b] பெயரின்மேல் நாம் நம்பிக்கை வைக்கவும்,[a] ஒருவரையொருவர் அன்புகூரவும் வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய மகனாகிய இயேசு மேசியாவின் பெயரை நம்பவும்.” இங்குள்ள சொற்றொடர், அந்தப் பெயரால் வெளிப்படும் நபர்மீது நம்பிக்கை வைப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இயேசு மேசியா” என்பதை “இயேசு கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்க Χριστός என்பதன் பொருள் “மேசியா,” அதாவது “அபிஷேகம் செய்யப்பட்டவர்.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  choice: கட்டளை
  rationale: அதிகாரத்துடன் கொடுக்கப்பட்ட ஆணை என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது. முதல் இடத்தில் ஒருமை காக்கப்பட்டுள்ளது; இறுதியில் அதே சொல்லின் வினை வடிவமான ‘கட்டளையிட்டபடியே’ இயல்பான தமிழ் நடைக்காகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἵνα πιστεύσωμεν
  choice: நாம் நம்பிக்கை வைக்கவும் … வேண்டும்
  rationale: ἵνα இங்கு கட்டளையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘வேண்டும்’ என்ற ஒரே நிறைவுடன் இணைக்கப்பட்ட இரண்டு கூறுகள் கட்டளையின் நோக்கத்தையும் துணைநிலையின் வலிமையையும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: πιστεύω τῷ ὀνόματι
  choice: பெயரில் நம்பிக்கை வைக்க
  rationale: வெறும் கூற்றை உண்மை என ஏற்றுக்கொள்வதைக் காட்டிலும், அந்தப் பெயரால் வெளிப்படும் நபர்மீது செலுத்தப்படும் விசுவாசம் அல்லது நம்பிக்கையை இச்சொற்றொடர் குறிக்கிறது. ‘பெயரில்’ என்பது யோவானிய மொழிநடையையும் காக்கிறது.
- source_word: τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ
  choice: அவருடைய மகனாகிய இயேசு மேசியா
  rationale: ‘மகன்’ என்ற உறவுமுறையையும், Ἰησοῦ Χριστοῦ என்பதில் இயேசுவை அடையாளப்படுத்தும் மேசியாப் பட்டத்தையும் தெளிவாகக் காக்கிறது. Χριστός இங்கு பெயர்போன்ற குடும்பப்பெயராக அல்ல, பட்டமாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: ஒருவரில் ஒருவர் அன்புகூரவும்
  rationale: பரஸ்பர அன்பைத் தெளிவாகவும் மரியாதையான நவீனத் தமிழ் நடையிலும் வெளிப்படுத்துகிறது.
- source_word: καθὼς ἔδωκεν ἐντολὴν ἡμῖν
  choice: அவர் நமக்குக் கட்டளையிட்டபடியே
  rationale: ‘அவர் நமக்குக் கட்டளை கொடுத்தபடியே’ என்ற சொற்சொல் அமைப்பு தமிழில் செயற்கையாக இருப்பதால், பெயர்ச்சொல்லை அதே வேர் கொண்ட இயல்பான வினை வடிவத்தில் வழங்குகிறது; καθὼς என்பதன் ஒப்புமைத் தொடர்பு ‘படியே’ மூலம் காக்கப்படுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός, ‘அவருடைய மகன் இயேசு’ என்பவரை அடையாளப்படுத்தும் பட்டமாகச் செயல்படுகிறது. ஆகவே அதன் பட்டப் பொருளை வெளிப்படுத்த ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது; வழக்கமான மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: πιστεύω τῷ ὀνόματι என்பதன் வலிமை
  choice: பெயரில் நம்பிக்கை வைக்க
  alternative: பெயரை நம்ப
  rationale: இது ஒரு பெயர்ச் சொல்லை உண்மை என ஏற்றுக்கொள்வது மட்டுமல்ல; அந்தப் பெயரால் வெளிப்படும் இயேசுவிடம் செலுத்தப்படும் நம்பிக்கையைக் குறிக்கிறது. ‘நம்பிக்கை வைக்க’ அந்த உறவுசார் வலிமையை வெளிப்படுத்துகிறது.
- issue: καθὼς கூறின் தொடர்பு
  choice: அன்புகூரவும் என்பதுடன் நெருக்கமாக இணைத்தல்
  alternative: நம்பிக்கை வைப்பதும் அன்புகூருவதுமாகிய முழுக் கட்டளையுடன் இணைத்தல்
  rationale: கிரேக்கச் சொல்வரிசையில் καθὼς கூறு ‘ஒருவரில் ஒருவர் அன்புகூரவும்’ என்பதற்குப் பின்னால் உடனடியாக வருகிறது; எனவே தமிழிலும் அந்த நெருக்கம் காக்கப்பட்டது. இருப்பினும் இலக்கண ரீதியாக விரிந்த தொடர்பை முற்றிலும் மறுக்கும் வகையில் விளக்கவுரை சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதையான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ஒரே கட்டளைக்குள் உள்ள இரண்டு இணைச் செயல்கள் தமிழில் ‘…வைக்கவும் … அன்புகூரவும் வேண்டும்’ என்ற சமநிலை அமைப்பில் தரப்பட்டுள்ளன. இறுதிக் கிரேக்கப் பெயர்ச்சொல் அமைப்பு தமிழில் செயற்கையாகாமல் இருக்க ‘கட்டளையிட்டபடியே’ என இயல்பாக்கப்பட்டுள்ளது.
