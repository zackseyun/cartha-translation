  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: ta
  text: அன்புக்குரியவர்களே, நம் இதயம்[c] நம்மைக் கண்டனம் செய்யாவிட்டால்[a], கடவுளுக்கு முன்பாக நமக்குத் துணிவு உண்டு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மைக் குற்றம் சாட்டாவிட்டால்” அல்லது “நம்மிடம் குறை காணாவிட்டால்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தைரியம்” அல்லது “கடவுளுக்கு முன்பாக உறுதியான நம்பிக்கை.”
    reason: lexical_alternative
  - marker: c
    text: இங்கு “இதயம்” என்பது ஒருவரின் உள்ளார்ந்த தன்மையை அல்லது ஒழுக்க உணர்வைக் குறிக்கிறது; இதை “மனச்சாட்சி” என்பதற்கு நெருக்கமான பொருளில் புரிந்துகொள்ளலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்போடு அழைக்கும் பன்மை விளிப்பை இயல்பான நவீனத் தமிழில் தருவதோடு, 1 யோவானில் தொடர்ந்து வரும் அன்பு சார்ந்த சொற்பிணைப்பையும் காக்கிறது.
- source_word: ἐὰν
