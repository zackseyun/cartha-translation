  rationale: Subjunctive உடன் வரும் நிபந்தனையைத் தமிழில் இயல்பான நிபந்தனை விகுதி மூலம் வெளிப்படுத்துகிறது.
- source_word: καρδία
  choice: இதயம்
  rationale: உள்ளார்ந்த ஒழுக்க உணர்வைக் குறிக்கும் சூழலானாலும், மூலத்தின் ‘இதயம்’ உருவகத்தைப் பாதுகாக்கிறது; ‘மனச்சாட்சி’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: நம்மைக் குற்றவாளிகளென்று தீர்ப்பளிக்காவிட்டால்
  rationale: καταγινώσκω என்பதிலுள்ள குற்றம் சாட்டுதல், எதிராகத் தீர்ப்பிடுதல் ஆகிய நீதித்துறைச் சாயல்களைத் தெளிவாகக் காக்கிறது.
- source_word: παρρησίαν
  choice: துணிவு
  rationale: கடவுளின் முன்னிலையில் வெளிப்படையாகவும் அச்சமின்றியும் நிற்கும் நிலையைச் சுருக்கமாகத் தெரிவிக்கிறது; வெறும் உளவியல் தன்னம்பிக்கையாக மாற்றவில்லை.
- source_word: πρὸς τὸν θεόν
  choice: கடவுளுக்கு முன்பாக
  rationale: கடவுளோடு தொடர்புடைய நிலை அல்லது அவரது சந்நிதியில் நிற்றல் என்ற கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: καρδία குறிக்கும் உள்ளார்ந்த இயல்பு
  choice: இதயம்
  alternative: மனச்சாட்சி
  rationale: ‘இதயம்’ என்பது யோவானின் உருவக மொழியைப் பாதுகாக்கிறது. இங்கு அது மனச்சாட்சியைப் போன்ற ஒழுக்க உணர்வோடு செயல்பட்டாலும், அதை அந்த ஒரே உளவியல் பிரிவாகச் சுருக்காமல் விடுகிறது.
- issue: கடவுளோடு தொடர்பில் παρρησίαν என்பதன் நுட்பம்
  choice: கடவுளுக்கு முன்பாக நமக்குத் துணிவு உண்டு
  alternative: கடவுளுக்கு முன்பாக நமக்கு உறுதியான நம்பிக்கை உண்டு
  rationale: ‘துணிவு’ என்பது கடவுளின் முன்னிலையில் அச்சமின்றி, வெளிப்படையாக அணுகும் நிலையைக் காக்கிறது; அளவுக்கு மீறிய தன்னுறுதியையோ மரியாதையற்ற துணிச்சலையோ வலியுறுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இருதயம்’ என்பதற்குப் பதில் இன்றைய வழக்கிலுள்ள ‘இதயம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. மூலத்தின் நிபந்தனை அமைப்பும் ‘இதயம்’ உருவகமும் காக்கப்பட்டுள்ளன.
