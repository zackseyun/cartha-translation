  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: ta
  text: தன் சகோதரனை[a] வெறுக்கிற ஒவ்வொருவனும் கொலைகாரன்; மேலும், எந்தக் கொலைகாரனுக்குள்ளும் நித்திய வாழ்வு நிலைத்திருப்பதில்லை[b] என்பதை நீங்கள் அறிவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘சகோதரன்’ என்பது சூழலின்படி சக விசுவாசியைக் குறிக்கக்கூடும்; கிரேக்கத்தில் இச்சொல் ஆண்பால் ஒருமையில் உள்ளது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அவனுக்குள் தங்கியிருப்பதில்லை.’ ‘நிலைத்திரு/தங்கியிரு’ என்று மொழிபெயர்க்கப்படும் μένω என்பது யோவானின் எழுத்துகளில் மீண்டும் மீண்டும் வரும் முக்கியச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: வெறுக்கிற ஒவ்வொருவனும்
  rationale: பெயரடையாக்கப்பட்ட நிகழ்காலப் பங்கேற்புவினை, வெறுப்பால் அடையாளப்படுத்தப்படும் பொதுவான வகுப்பைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அதன் பொதுப்படுத்தும் மற்றும் தொடர்ச்சியான இயல்பைப் பேணுகிறது.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: தன் சகோதரனை
  rationale: αὐτοῦ என்பதன் உடைமைத் தொடர்பைத் தமிழில் இயல்பாகக் காட்ட ‘தன்’ பயன்படுத்தப்பட்டுள்ளது. ἀδελφός ஆண்பால் ஒருமை என்பதால் ‘சகோதரன்’ எனப் பேணப்பட்டு, சூழலில் உள்ள சக விசுவாசி என்ற வாய்ப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ἀνθρωποκτόνος
  choice: கொலைகாரன்
  rationale: மனிதனைக் கொல்பவரைக் குறிக்கும் சொல்லின் வலிமையை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது; சொற்படி அமைந்த இயல்பற்ற வடிவம் தவிர்க்கப்படுகிறது.
- source_word: οἴδατε
  choice: நீங்கள் அறிவீர்கள்
  rationale: இரண்டாம் நபர் பன்மையைத் தெளிவாகவும் மரியாதையான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: எந்தக் கொலைகாரனுக்குள்ளும் … இல்லை
  rationale: கிரேக்கத்தின் மறுக்கப்பட்ட பொதுமையைத் தமிழில் இயல்பாகவும் குழப்பமின்றியும் ‘எந்த … உம் … இல்லை’ என்ற அமைப்பால் தருகிறது.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: யோவானியப் பயன்பாட்டின் காலநீட்சி மற்றும் இறையியல் நிறைவு ஆகிய இரண்டையும் பேணும், இன்றைய வாசகர்களுக்குப் புரியும் வடிவம்.
- source_word: ἐν αὐτῷ μένουσαν
  choice: அவனுக்குள் … நிலைத்திருப்பதில்லை
  rationale: ἐν αὐτῷ என்பதன் உள்ளுறைதலையும் μένω என்பதன் தொடர்ந்திருக்கும் பொருளையும் இயல்பான தமிழில் பேணுகிறது; ‘தங்கியிருத்தல்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘சகோதரன்’ என்பதன் பொருள் வரம்பு
  choice: மூலத்தின் ஆண்பால் ஒருமையை ‘தன் சகோதரன்’ என முதன்மை உரையில் பேணுதல்; சக விசுவாசியைக் குறிக்கும் சூழல்சார் பொருளை அடிக்குறிப்பில் கூறுதல்.
  alternative: சகோதரன் அல்லது சகோதரி; சக விசுவாசி
  rationale: உடனடிச் சூழல் விசுவாசச் சமூகத்துக்குள்ளான அன்பைப் பற்றியது; எனினும் கிரேக்கச் சொல் ஆண்பால் ஒருமையாக இருப்பதால் அதன் வடிவத்தையும் சாத்தியமான பிரதிநிதித்துவப் பயன்பாட்டையும் மொழிபெயர்ப்பு தீர்மானித்து விடாமல் பேணுகிறது.
- issue: யோவானிய μένω சொல்லின் மொழிபெயர்ப்பு
  choice: நிலைத்திரு
  alternative: தங்கியிரு
  rationale: தொடர்ந்து உள்ளிருக்கும் கருத்தை நவீன, dignified தமிழில் ‘நிலைத்திரு’ தெளிவாகத் தருகிறது; யோவானிய இலக்கியத்தில் மீண்டும் வரும் சொல்லின் மாற்றுப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: கொலைகாரனும் நித்திய வாழ்வும் பற்றிய கூற்றின் வலிமை
  choice: ‘எந்தக் கொலைகாரனுக்குள்ளும் நித்திய வாழ்வு நிலைத்திருப்பதில்லை’ என்ற திட்டவட்டமான பொதுமையைப் பேணுதல்.
  alternative: கொலை செய்தவர் ஒருபோதும் இரட்சிக்கப்பட முடியாது என்ற விளக்கவுரை
  rationale: வசனம் கூறும் நிகழ்கால நிலையை மட்டும் மொழிபெயர்த்து, மனந்திரும்புதல் அல்லது இறுதி இரட்சிப்பு பற்றிய கூடுதல் கோட்பாட்டு முடிவை உரைக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதவாக்கியத்துக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டுள்ளது. பாரம்பரியமாகப் பயன்படும் ‘ஜீவன்’ என்பதற்குப் பதில் இயல்பான ‘வாழ்வு’ தேர்ந்தெடுக்கப்பட்டது; ‘நித்திய’ என்பது நிலைபெற்ற இறையியல் சொற்தொடரையும் மூலத்தின் αἰώνιος கருத்தையும் பேணுகிறது.
