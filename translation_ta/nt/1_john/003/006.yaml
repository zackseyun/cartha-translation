id: 1JN.3.6
reference: 1 John 3:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: ta
  text: அவரில் நிலைத்திருக்கும் எவரும் தொடர்ந்து பாவம் செய்வதில்லை[a]; தொடர்ந்து பாவம் செய்கிற எவரும் அவரைக் கண்டதுமில்லை, அறிந்ததுமில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்சார்ந்து: “பாவம் செய்வதில்லை … பாவம் செய்கிற எவரும்.” கிரேக்க நிகழ்கால வடிவங்கள் தொடரும் அல்லது ஒருவரின் வழக்கமான நடத்தையைக் குறிப்பதாகவும் புரிந்துகொள்ளப்படலாம்; அதனால் முதன்மை உரையில் “தொடர்ந்து” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ
  choice: எவரும் / எவரும்
  rationale: பெயரடை உறுப்புடன் வரும் இந்த அமைப்பு குறிப்பிட்ட வகையில் உள்ள யாரையும் பொதுவாகவும் முழுமையாகவும் குறிக்கிறது. தமிழில் ‘எவரும்’ அதன் பொதுமையான வலிமையை இயல்பாகத் தருகிறது.
- source_word: ἐν αὐτῷ μένων
  choice: அவரில் நிலைத்திருக்கும்
  rationale: μένω யோவானின் எழுத்துகளில் தொடர்ந்திருத்தல் மற்றும் உறவுநிலையைக் குறிக்கும் முக்கியச் சொல். ‘நிலைத்திருக்கும்’ அந்தத் தொடர்ச்சியையும் ‘அவரில்’ என்ற மூலமொழியின் உறவு/இணைவு வடிவத்தையும் காக்கிறது.
- source_word: οὐχ ἁμαρτάνει
  choice: தொடர்ந்து பாவம் செய்வதில்லை[a]
  rationale: நிகழ்கால வினைவடிவம் இச்சூழலில் தொடரும் அல்லது இயல்பான நடத்தையைக் குறிக்கக்கூடும். ‘தொடர்ந்து’ என்பது அந்த அம்சத்தைத் தெளிவாக்குகிறது; அடிக்குறிப்பு மேலும் சொற்சார்ந்த வாசிப்பையும் பாதுகாக்கிறது.
- source_word: ὁ ἁμαρτάνων
  choice: தொடர்ந்து பாவம் செய்கிற எவரும்
  rationale: நிகழ்காலப் பெயரெச்சம் முதல் கூற்றுக்கு இணையாகத் தொடரும் அல்லது குணவியல்பான செயலைக் குறிக்கக்கூடும். ஒரே தனித்த பாவச்செயலை மட்டும் குறிப்பதாகப் புரிந்துகொள்ளாமல் இணைத்தொடரின் சமநிலையை இது காக்கிறது.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: அவரைக் கண்டதுமில்லை
  rationale: நிறைவுக்கால வடிவத்தின் விளைவுநிலையை இயல்பான தமிழில் இவ்வாறு தரலாம். மூலத்தில் இல்லாத ‘ஒருபோதும்’ என்பதைச் சேர்க்கவில்லை.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: அறிந்ததுமில்லை
  rationale: γινώσκω வெறும் அறிவுசார் தெரிதலைவிட உறவுசார் அறிதலையும் தாங்கக்கூடும். ‘அறிந்தது’ அந்தத் திறப்பை வைத்திருக்கிறது; ‘-துமில்லை’ οὐδὲ-யின் இணைந்த மறுப்பை இயல்பாகக் காட்டுகிறது.
- source_word: αὐτῷ / αὐτόν
  choice: அவரில் / அவரை
  rationale: கிரேக்க உரை இங்கு பெயரைத் தெளிவுபடுத்தாமல் ஆண்பால் பிரதிப்பெயரையே பயன்படுத்துகிறது. தமிழிலும் ‘அவர்’ வடிவம் காக்கப்பட்டு, ‘தேவன்’ அல்லது ‘கிறிஸ்து’ என்று மீறித் தீர்மானிக்கப்படவில்லை.
theological_decisions:
- issue: விசுவாசிகள் முற்றிலும் பாவமற்றவர்களாக இருப்பதையே வசனம் கற்பிக்கிறதா
  choice: நிகழ்கால வடிவங்கள் தொடரும் அல்லது குணவியல்பான பாவச்செயலைக் குறிப்பதாக முதன்மை உரையில் ‘தொடர்ந்து’ என மொழிபெயர்க்கப்பட்டுள்ளன; சொற்சார்ந்த சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
  alternative: ‘பாவம் செய்வதில்லை; பாவம் செய்கிற எவரும்’ என்று தொடர்ச்சியை வெளிப்படையாகச் சேர்க்காத சொற்சார்ந்த மொழிபெயர்ப்பு.
  rationale: 1 யோவான் 1:8–2:2 விசுவாசிகளின் பாவத்தின் உண்மையையும் கிறிஸ்துவின் பரிந்துபேசுதலையும் ஏற்றுக்கொள்ளும் நிலையில், இவ்வசனத்தின் கடுமையான ஒழுக்கக் கூற்றையும் தளர்த்தாமல் உள்ளார்ந்த வேதாகமத் தளர்வை இது காக்கிறது. அதேவேளை நிகழ்காலம் மட்டும் கட்டாயமாகத் தொடர்ச்சியைச் சொல்கிறது என்று கூறாமல் மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘அவர்’ என்பதன் குறிப்பு யார்
  choice: மூலத்தின் பிரதிப்பெயர் வடிவம் ‘அவர்’ எனவே வைக்கப்பட்டுள்ளது.
  alternative: ‘தேவன்’, ‘குமாரன்’ அல்லது ‘கிறிஸ்து’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: உடனடிச் சூழலில் தந்தையையும் குமாரனையும் பற்றிய மொழி இருப்பதால், மூலவசனம் தீர்மானிக்காததை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான வேதாகம நடையிலும் அமைக்கப்பட்டுள்ளது. ‘நிலைத்திருக்கும்’ என்பது யோவானின் முக்கியச் சொல்லை ஒருமைப்படுத்த உதவும். ‘அவரைக் கண்டதுமில்லை, அறிந்ததுமில்லை’ என்ற இணை அமைப்பு கிரேக்கத்தின் இரட்டை மறுப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
