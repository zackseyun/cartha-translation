  source_fidelity: மூலத்தின் πᾶς ὁ அமைப்பின் பொதுமை, ἐν αὐτῷ μένων என்பதன் தொடரும் உறவுநிலை, இரு நிகழ்கால வடிவங்களின் இணைநிலை, மற்றும் ἑώρακεν/ἔγνωκεν என்ற நிறைவுக்கால மறுப்புகள் அனைத்தும் நன்றாகக் காக்கப்பட்டுள்ளன. ‘தொடர்ந்து’ என்பது நிகழ்காலத்தின் சாத்தியமான வழக்க/தொடர்நிலைப் பொருளை வெளிப்படுத்துகிறது; அடிக்குறிப்பு சொற்சார்ந்த மாற்றுவாசிப்பையும் தக்கவைத்துள்ளது.
  naturalness: ‘அவரில் நிலைத்திருக்கும் எவரும்’ மற்றும் ‘அவரைக் கண்டதுமில்லை, அறிந்ததுமில்லை’ ஆகியவை நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளன. இணையான இரு கூற்றுகளும் தெளிவாக அமைந்துள்ளன.
  terminology: ‘நிலைத்திருக்கும்’ யோவானிய μένω சொல்லுக்குச் சூழலுக்கு ஏற்ற, நிலையான தேர்வாகும். ‘பாவம் செய்வது,’ ‘கண்டது,’ ‘அறிந்தது’ ஆகியவை பொருத்தமானவை. மூலத்தின் தெளிவுபடுத்தப்படாத பிரதிப்பெயர் ‘அவர்’ என்றே காக்கப்பட்டுள்ளது.
