id: 1JN.3.20
reference: 1 John 3:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: ta
  text: ஏனெனில், நம் இதயம் நம்மைக் குற்றஞ்சாட்டினால்[a], கடவுள் நம் இதயத்தைவிடப் பெரியவர்[b]; அவர் எல்லாவற்றையும் அறிந்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம் இதயம் நம்மைக் கண்டனம் செய்தால்’ அல்லது ‘நம்மிடம் குறை கண்டால்.’
    reason: lexical_alternative
  - marker: b
    text: ‘கடவுள் நம் இதயத்தைவிடப் பெரியவர்’ என்பது நம்மைப் பற்றிய முழு உண்மையை அவர் அறிந்திருப்பதைச் சுட்டக்கூடும்; அதன் உட்குறிப்பாக, நம்முடைய சுயகண்டனத்தின்மேல் அவருக்கு அதிகாரம் இருப்பதையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முதல் ὅτι, முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; தமிழில் ‘ஏனெனில்’ அதன் விளக்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐὰν
  choice: செய்தால்
  rationale: நிகழக்கூடிய நிபந்தனையைச் சுட்டும் ἐὰν என்பதன் இயல்பான தமிழ் வடிவம் நிபந்தனை வினையெச்சமான ‘செய்தால்’ ஆகும்.
- source_word: καταγινώσκῃ
  choice: கண்டனம் செய்தால்
  rationale: இந்த வினை ஒருவருக்கு எதிராகக் குற்றம் காணுதல், குற்றஞ்சாட்டுதல் அல்லது கண்டனம் செய்தல் என்ற நீதித்துறைச் சாயலைக் கொண்டது. உள்ளம் தன்னையே தீர்ப்பிடும் இச்சூழலில் ‘கண்டனம் செய்தால்’ பொருத்தமானது; மாற்றுச் சாயல்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ἡ καρδία / τῆς καρδίας ἡμῶν
  choice: நம் இதயம் / நம் இதயத்தைவிட
  rationale: καρδία என்பதை ‘மனச்சாட்சி’ என்று விளக்கிப் பெயர்க்காமல், உள்ளார்ந்த வாழ்வின் மையத்தைக் குறிக்கும் ‘இதயம்’ என்ற உருவகத்தைத் தக்கவைக்கிறது. ஒப்பீட்டு உருபுடன் வரும் மரபுத்தொடர் தமிழில் ‘நம் இதயத்தைவிட’ என இயல்பாகிறது.
- source_word: ὅτι
  choice: தனியே மொழிபெயர்க்கப்படாமல் வாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: இரண்டாம் ὅτι, ‘கடவுள் நம் இதயத்தைவிடப் பெரியவர்’ என்ற உறுதிப்பாட்டின் உள்ளடக்கத்தையோ அடிப்படையையோ அறிமுகப்படுத்துகிறது. தமிழில் அதை மீண்டும் தனிச்சொல்லாக மொழிபெயர்ப்பது செயற்கையாக இருப்பதால், வாக்கிய அமைப்பிலேயே அதன் தொடர்பு காக்கப்பட்டுள்ளது.
- source_word: μείζων
  choice: பெரியவர்
  rationale: ஒப்பீட்டின் தன்மை அறிவு, அதிகாரம் அல்லது இரக்கம் என்று ஒரே பொருளுக்குள் குறுக்கப்படவில்லை. அடுத்த கூற்று அறிவை முன்னிறுத்தினாலும், மூலத்தின் விரிவான பொருளை ‘பெரியவர்’ தக்கவைக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: θεός என்பதற்கான இயல்பான, பொதுவாகப் புரியக்கூடிய நவீனத் தமிழ் சொல்.
- source_word: γινώσκει πάντα
  choice: அவர் எல்லாவற்றையும் அறிந்திருக்கிறார்
  rationale: πάντα என்பதன் முழுமையான பரப்பை ‘எல்லாவற்றையும்’ காக்கிறது; நிகழ்கால γινώσκει என்பதைக் கடவுளின் நிலையான அறிவைக் காட்டும் இயல்பான தமிழில் ‘அறிந்திருக்கிறார்’ என வழங்குகிறது.
theological_decisions:
- issue: ‘கடவுள் நம் இதயத்தைவிடப் பெரியவர்’ என்பதன் பொருள்
  choice: இக்கூற்றை இரக்கம், அதிகாரம் அல்லது அனைத்தையும் அறிதல் ஆகியவற்றில் ஏதேனும் ஒன்றாக மட்டும் சுருக்காமல் விரிவாகவே மொழிபெயர்த்தல்.
  alternative: கடவுள் நம் கண்டிக்கும் மனச்சாட்சியைவிட இரக்கமுள்ளவர்; அல்லது அவரது தீர்ப்பு நம் சுயகண்டனத்தை மீறுகிறது; அல்லது நம்மைப் பற்றிய முழு உண்மையையும் அவர் அறிவார் என்று விளக்கிப் பெயர்த்தல்.
  rationale: μείζων என்ற ஒப்பீட்டுச் சொல் எந்த வகையில் ‘பெரியவர்’ என்று தனியே வரையறுக்கவில்லை. தொடர்ந்து வரும் ‘அவர் எல்லாவற்றையும் அறிந்திருக்கிறார்’ என்பது அறிவை முக்கியமாகச் சுட்டினாலும், ஒப்பீட்டின் இறையியல் அகலத்தை மொழிபெயர்ப்பு குறுக்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘இதயம்’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது; ‘மனச்சாட்சி’ என விளக்கிப் பெயர்க்கப்படவில்லை. ‘கண்டனம்’ நீதித்துறைச் சாயலைக் காக்கிறது; எளிய மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
