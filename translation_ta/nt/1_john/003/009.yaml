source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: ta
  text: தேவனிடமிருந்து பிறந்த ஒவ்வொருவரும் பாவம் செய்வதை வழக்கமாகக் கொள்வதில்லை[a]. ஏனெனில், தேவனுடைய வித்து[b] அவருக்குள் நிலைத்திருக்கிறது; தேவனிடமிருந்து பிறந்திருக்கிறபடியால், அவரால் தொடர்ந்து பாவம் செய்துகொண்டிருக்க முடியாது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, ‘பாவம் செய்வதில்லை.’ கிரேக்க நிகழ்காலச் சொற்றொடர் இச்சூழலில் தனிப்பட்ட ஒரே செயலைவிட தொடர்ந்து அல்லது வழக்கமாகப் பாவம் செய்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வித்து’ என்பது மூலமொழியிலுள்ள உருவகம். அது தேவனுடைய வார்த்தை, ஜீவன் அல்லது வேறு எதைக் குறிப்பாகச் சுட்டுகிறது என்பதை இவ்வசனம் வெளிப்படையாகக் கூறவில்லை.
    reason: metaphorical_ambiguity
  - marker: c
    text: இன்னும் நேரடியாக, ‘அவரால் பாவம் செய்ய முடியாது.’ இச்சூழலில் கிரேக்க நிகழ்கால வினைவடிவம் ‘தொடர்ந்து பாவம் செய்துகொண்டிருக்க’ என்ற பொருளைக் கொடுக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: தேவனிடமிருந்து பிறந்த ஒவ்வொருவரும்
  rationale: πᾶς என்பதன் பொதுவான, அனைவரையும் உள்ளடக்கும் பொருளையும், perfect participle காட்டும் பிறப்பின் நீடித்த விளைவையும் இச்சொற்றொடர் இயல்பான தமிழில் வெளிப்படுத்துகிறது. ἐκ என்பது இங்கு பிறப்பின் மூலத்தைச் சுட்டுவதால் ‘தேவனிடமிருந்து’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: பாவம் செய்வதையே வழக்கமாகக் கொள்வதில்லை
  rationale: ποιεῖ என்ற நிகழ்கால வினையும் பின்னர் வரும் ἁμαρτάνειν என்ற நிகழ்கால வினையெச்சமும் சூழலில் தொடர்ச்சியான அல்லது பண்பாகிவிட்ட பாவச் செயலைக் குறிக்கின்றன. ‘வழக்கமாகக் கொள்வதில்லை’ என்பது ஒரே ஒரு பாவச் செயலை முற்றிலும் மறுப்பதாகப் பொருள்படாமல் இந்தத் தொடர்ச்சியைக் காட்டுகிறது.
- source_word: σπέρμα αὐτοῦ
  choice: தேவனுடைய வித்து
  rationale: σπέρμα என்பதன் நேரடியான உருவகமான ‘வித்து’ தக்கவைக்கப்படுகிறது. அது தேவனுடைய வார்த்தையா, ஜீவனா, இயல்பா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை. αὐτοῦ என்பதன் சூழல்சார் முன்னிலை ‘தேவன்’ என்பதால் தமிழில் அது தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: ἐν αὐτῷ μένει
  choice: அவருக்குள் நிலைத்திருக்கிறது
  rationale: μένει என்பது தொடர்ந்து தங்கியிருப்பதைச் சுட்டுகிறது. ‘நிலைத்திருக்கிறது’ என்பது யோவானின் பயன்பாட்டின் நீடித்த தன்மையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: அவரால் தொடர்ந்து பாவம் செய்துகொண்டிருக்க முடியாது
  rationale: நிகழ்கால ἁμαρτάνειν சூழலில் தொடரும் செயலைக் குறிக்க வாய்ப்புள்ளதால் ‘தொடர்ந்து ... செய்துகொண்டிருக்க’ என வழங்கப்படுகிறது. அதேவேளை ‘முடியாது’ என்பது οὐ δύναται என்பதன் வலிமையைத் தக்கவைக்கிறது.
- source_word: ὅτι ἐκ τοῦ θεοῦ γεγέννηται
  choice: தேவனிடமிருந்து பிறந்திருக்கிறபடியால்
  rationale: Perfect γεγέννηται கடந்த பிறப்பின் தற்போதும் நீடிக்கும் நிலையைச் சுட்டுகிறது; ‘பிறந்திருக்கிறபடியால்’ என்பது அந்த விளைவையும் காரணத் தொடர்பையும் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இவ்வசனம் எந்த ஒரு தனிப்பட்ட பாவத்தையும் செய்ய இயலாத முழுமையான பாவமின்மையைச் சொல்கிறதா, அல்லது தொடர்ந்து பாவத்தில் வாழ்வது புதிய பிறப்புடன் பொருந்தாது எனச் சொல்கிறதா?
  choice: முதன்மை உரை தொடர்ந்து அல்லது வழக்கமாகப் பாவம் செய்வதை மறுக்கிறது.
  alternative: ‘பாவம் செய்வதில்லை; பாவம் செய்ய முடியாது’ என்று முற்றிலும் நேரடியாக வழங்கி, எந்த ஒரு பாவச் செயலுக்கும் முழுமையான இயலாமை எனப் புரிந்துகொள்ளுதல்.
  rationale: ποιεῖ, ἁμαρτάνειν ஆகிய நிகழ்கால வடிவங்களும் 1 யோவான் 1:8–2:1 இன் சூழலும் தொடரும் பாவப் பழக்கத்தை முதன்மையாகக் காட்டுகின்றன. இருப்பினும் கிரேக்கத்தின் நேரடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டு, உரையிலுள்ள இறையியல் அழுத்தம் மறைக்கப்படவில்லை.
- issue: ‘தேவனுடைய வித்து’ எதைக் குறிக்கிறது?
  choice: ‘வித்து’ என்ற உருவகம் விளக்கமின்றித் தக்கவைக்கப்படுகிறது.
  alternative: அதை ‘தேவனுடைய வார்த்தை,’ ‘தேவனுடைய ஜீவன்,’ அல்லது ‘தேவ இயல்பு’ என்று பொருள்விளக்கி மொழிபெயர்த்தல்.
  rationale: σπέρμα என்பதன் துல்லியமான உருவகக் குறிப்பு வசனத்தில் விளக்கப்படவில்லை. ஒரு குறிப்பிட்ட இறையியல் கருத்தை உரைக்குள் சேர்க்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்க ‘வித்து’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘வித்து,’ ‘நிலைத்திருக்கிறது’ ஆகியவை யோவானிய உருவகத்தையும் சொல் தொடர்பையும் காக்கின்றன. பாலைக் குறிப்பாக முன்னிறுத்தாமல் பொதுவான ஒருமை நபரைக் குறிக்க மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டது.
