revisions:
- from: அவர் நமக்காகத் தம் உயிரைக் கொடுத்ததிலிருந்தே அன்பு என்னவென்று அறிந்துகொண்டோம்.[a] ஆகவே, சகோதரர்களுக்காக நாமும் நம் உயிர்களைக் கொடுக்கக் கடமைப்பட்டிருக்கிறோம்.[b]
  to: 'இதன் மூலமாக[a] அன்பை அறிந்துகொண்டோம்: அவர் நமக்காகத் தம் உயிரை ஒப்புக்கொடுத்தார்; நாமும் சகோதரர்களுக்காக[b] நம் உயிர்களை ஒப்புக்கொடுக்கக் கடமைப்பட்டிருக்கிறோம்.'
  rationale: The revision removes the unsupported emphasis in “இதிலிருந்தே,” retains the source order and explanatory force of ἐν τούτῳ, avoids adding an explicit inferential connective for καί, and renders both occurrences of the ψυχή/τίθημι idiom consistently. Footnote a is relocated to the phrase it annotates and reduced to a genuine alternative to the revised main rendering.
