source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: ta
  text: 'இதன் மூலமாக[a] அன்பை அறிந்துகொண்டோம்: அவர் நமக்காகத் தம் உயிரை ஒப்புக்கொடுத்தார்; நாமும் சகோதரர்களுக்காக[b] நம் உயிர்களை ஒப்புக்கொடுக்கக் கடமைப்பட்டிருக்கிறோம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதிலே.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “சகோதரர்கள்”; இச்சூழலில் இது சகோதரிகளையும் உள்ளடக்கிய சக விசுவாசிகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: இதிலிருந்தே
  rationale: அன்பை அறிந்துகொள்வதற்கான அடிப்படையையோ வழியையோ இச்சொற்றொடர் சுட்டுகிறது. ‘இதிலிருந்தே’ என்பது தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் அந்தத் தொடர்பை வெளிப்படுத்துகிறது; மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἐγνώκαμεν
  choice: அறிந்துகொண்டோம்
  rationale: இறந்தகாலத்தில் ஏற்பட்ட அறிதலின் தற்போதைய விளைவை கிரேக்க நிறைவுக்காலம் உணர்த்துகிறது. ‘அறிந்துகொண்டோம்’ என்பது அந்தக் கண்டுணர்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை; இங்கு அன்பின் இயல்பு கிறிஸ்துவின் செயலால் விளக்கப்படுகிறது.
- source_word: ἐκεῖνος
  choice: அவர்
  rationale: யோவானின் சூழலில் இது இயேசுவைக் குறிக்கிறது. ‘அவர்’ மரியாதையான இயல்பான தமிழை வழங்குகிறது; பெயரை உரையில் சேர்த்து கிரேக்கத்தைவிட வெளிப்படையாக்கவில்லை.
- source_word: ὑπὲρ ἡμῶν
  choice: நமக்காக
  rationale: நமது நன்மைக்காகவும் நமது சார்பாகவும் செய்யப்பட்ட தன்னர்ப்பணத்தை வெளிப்படுத்துகிறது; குறிப்பிட்ட பரிகாரக் கோட்பாட்டை மொழிபெயர்ப்பில் திணிப்பதில்லை.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: தம் உயிரைக் கொடுத்தார்
  rationale: ψυχή இச்சொல்வழக்கில் ‘உயிர்’ எனப் பொருள்படும். ‘உயிரைக் கொடுத்தார்’ என்பது தன்னார்வத் தியாகத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கும் தமிழ் சொல்வழக்கு.
- source_word: ὀφείλομεν
  choice: கடமைப்பட்டிருக்கிறோம்
  rationale: இவ்வினைச்சொல் வலுவான ஒழுக்கக் கடமையைக் குறிக்கிறது. ‘கடமைப்பட்டிருக்கிறோம்’ என்பது வெறும் ஆலோசனையைவிட அந்தப் பொறுப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τῶν ἀδελφῶν
  choice: சகோதரர்களுக்காக
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மையை முதன்மை உரையில் பாதுகாக்கிறது. சூழலில் சக விசுவாசிகளான பெண்களும் உட்படலாம் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: τὰς ψυχὰς θεῖναι
  choice: நம் உயிர்களைக் கொடுக்க
  rationale: முந்தைய ψυχή/τίθημι சொல்வழக்குடன் பொருள் ஒற்றுமையைப் பேணுகிறது; பன்மை வடிவமும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ἐκεῖνος என்பதன் சுட்டுப்பொருள்
  choice: பெயரைச் சேர்க்காமல் ‘அவர்’ என்று மொழிபெயர்த்து, சூழல் இயேசுவைக் குறிக்க அனுமதித்தல்
  alternative: ‘இயேசு’ அல்லது ‘அந்த ஒருவர்’
  rationale: 1 யோவானின் உரையோட்டமும் உயிரைக் கொடுக்கும் யோவானிய சொல்வழக்கும் இயேசுவைச் சுட்டுகின்றன. ஆனால் கிரேக்கத்தில் பெயர் வெளிப்படையாக இல்லை; ஆகவே ‘அவர்’ என்பது கிறிஸ்துவியல் சுட்டுதலைப் பாதுகாத்தபடியே மூலத்தின் வடிவத்தையும் காக்கிறது.
- issue: ἀδελφῶν என்பதன் வரம்பு
  choice: முதன்மை உரையில் ‘சகோதரர்கள்’; உள்ளடக்கமான திருச்சபைச் சுட்டலை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘சகோதர சகோதரிகள்’ அல்லது ‘சக விசுவாசிகள்’
  rationale: கிரேக்கச் சொல் இலக்கண ரீதியாக ஆண்பால் பன்மை; இச்சூழலில் அது பெண்களையும் உள்ளடக்கிய சக விசுவாசிகளைக் கூட்டாகக் குறிக்கலாம். உரையில் பாலின வடிவத்தைப் பாதுகாத்து, அதன் சாத்தியமான உள்ளடக்கப் பரப்பை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அறிந்துகொண்டோம்’ நிறைவுற்ற அறிதலின் தொடரும் விளைவை உணர்த்துகிறது; ‘கடமைப்பட்டிருக்கிறோம்’ ஒழுக்கப் பொறுப்பின் வலிமையைப் பேணுகிறது. இரண்டு அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
