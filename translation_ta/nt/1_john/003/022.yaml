id: 1JN.3.22
reference: 1 John 3:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: ta
  text: நாம் எதைக் கேட்டாலும், அவரிடமிருந்து பெற்றுக்கொள்கிறோம்; ஏனெனில், அவருடைய கட்டளைகளைக் கடைப்பிடிக்கிறோம், அவர் பார்வையில்[a] பிரியமானவற்றைச் செய்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்கு முன்பாக.”
    reason: ἐνώπιον αὐτοῦ என்பதற்கான நேரடியான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: எதைக் கேட்டாலும்
  rationale: ὃ ἐὰν என்பது குறிப்பிட்ட வரம்பின்றி ‘எதை...ஆலும்’ என்ற பொருளைத் தருகிறது; αἰτῶμεν உடன் சேர்த்து இவ்வாறு மொழிபெயர்ப்பது இயல்பான தமிழ் நடையாகும்.
- source_word: αἰτῶμεν
  choice: கேட்டாலும்
  rationale: αἰτέω இங்கு வேண்டுதல் அல்லது மன்றாட்டு சூழலில் ‘கேள்’ என்று பொருள்படுகிறது.
- source_word: λαμβάνομεν
  choice: பெற்றுக்கொள்கிறோம்
  rationale: நிகழ்கால வினை இங்கு பொதுவாக நிகழ்வதைக் குறிக்கிறது; ‘பெற்றுக்கொள்கிறோம்’ என்பது மூலத்தின் செயப்படுபொருள் சார்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: ἀπ’ αὐτοῦ
  choice: அவரிடமிருந்து
  rationale: ἀπό உடன் வரும் உருபு பெறுதலின் மூலத்தைச் சுட்டுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இங்கு ὅτι, கேட்டதைப் பெறுவதற்கான காரணத்தை வெளிப்படையாக இணைக்கிறது.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: அவருடைய கட்டளைகளை
  rationale: ἐντολή என்பதன் யோவானிய சொற்பயன்பாட்டுத் தொடர்ச்சியையும் அதிகாரமுள்ள அறிவுறுத்தல் என்ற பொருளையும் ‘கட்டளைகள்’ காக்கிறது.
- source_word: τηροῦμεν
  choice: கடைப்பிடிக்கிறோம்
  rationale: τηρέω என்பது கட்டளைகளைப் பேணிக் கைக்கொள்ளுதல் அல்லது அவற்றின்படி நடத்தல் என்பதைக் குறிக்கிறது; நவீன தமிழில் ‘கடைப்பிடிக்கிறோம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τὰ ἀρεστὰ
  choice: பிரியமானவற்றை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலைப் பன்மை உரிச்சொல், கடவுளுக்குப் பிரியமான செயல்கள் அல்லது காரியங்களைப் பொதுவாகக் குறிக்கிறது.
- source_word: ἐνώπιον αὐτοῦ
  choice: அவர் பார்வையில்
  rationale: ἐνώπιον என்பது ‘முன்பாக’ அல்லது ‘பார்வையில்’ என்று பொருள்படும்; இச்சூழலில் ‘அவர் பார்வையில்’ இயல்பான தமிழாக இருந்து, அவரது மதிப்பீட்டில் பிரியமானவை என்ற தொடர்பையும் காக்கிறது.
- source_word: ποιοῦμεν
  choice: செய்கிறோம்
  rationale: ποιέω என்பதன் சாதாரண பொருளான ‘செய்’ என்பதை நேரடியாகத் தருகிறது; மூலத்தில் இல்லாத வழக்கமான நடைமுறை என்ற கூடுதல் நுணுக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ஜெபத்துக்குப் பதில் கிடைப்பதற்கும் கீழ்ப்படிதலுக்கும் உள்ள தொடர்பு
  choice: கேட்டதை அவரிடமிருந்து பெறுவதற்குக் கட்டளைகளைக் கடைப்பிடிப்பதும் அவருக்குப் பிரியமானவற்றைச் செய்வதும் காரணமாகக் கூறப்படும் தொடர்பை அப்படியே வைத்தல்
  alternative: இரண்டுக்கும் வெறும் தொடர்பு மட்டுமே உள்ளதுபோல் காரண வலிமையைக் குறைத்துக் கூறுதல்
  rationale: ὅτι தெளிவாகக் காரணத்தைக் குறிப்பிடுகிறது. ஆகவே வசனத்தின் இறையியல் பதற்றத்தை மென்மைப்படுத்தாமலும், அதேவேளையில் ஜெபத்துக்கான இயந்திரமயமான உத்தரவாதமாக விரிவாக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. காரணத் தொடர்பு தெளிவாக வைக்கப்பட்டுள்ளது; தேவையற்ற கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
