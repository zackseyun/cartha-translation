revisions:
- from: நாம் மரணத்திலிருந்து வாழ்வுக்குள் கடந்துவந்திருக்கிறோம் என்பதை அறிந்திருக்கிறோம்; ஏனெனில், சகோதரர்களிடம்[a] அன்புகூருகிறோம். அன்புகூராதவர் மரணத்திலேயே நிலைத்திருக்கிறார்.
  to: நாம் மரணத்திலிருந்து வாழ்வுக்குள் கடந்துவந்திருக்கிறோம் என்பதை அறிந்திருக்கிறோம்; ஏனெனில் சகோதரர்களை[a] அன்புகூருகிறோம். அன்புகூராதவர் மரணத்தில் தொடர்ந்து இருக்கிறார்.
