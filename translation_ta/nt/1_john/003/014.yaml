id: 1JN.3.14
reference: 1 John 3:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: ta
  text: நாம் மரணத்திலிருந்து வாழ்வுக்குள் கடந்துவந்திருக்கிறோம் என்பதை அறிந்திருக்கிறோம்; ஏனெனில் சகோதரர்களை[a] அன்புகூருகிறோம். அன்புகூராதவர் மரணத்தில் தொடர்ந்து இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதரர்களும் சகோதரிகளும்’; கிரேக்கத்தில் ‘சகோதரர்கள்’ என்று உள்ளது. இச்சூழலில் இது பொதுவாக அனைத்து சக விசுவாசிகளையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: அறிந்திருக்கிறோம்
  rationale: கொய்னே கிரேக்கத்தில் οἶδα நிகழ்கால நிலையை உணர்த்துகிறது. தமிழில் ‘அறிந்திருக்கிறோம்’ என்பது தற்போதைய உறுதியான அறிவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μεταβεβήκαμεν
  choice: கடந்துவந்திருக்கிறோம்
  rationale: நிறைவேற்றப்பட்ட மாற்றமும் அதன் தொடரும் விளைவும் உள்ள நிறைவுக்கால வினையின் பொருளையும், ஓர் இடத்திலிருந்து மற்றொன்றுக்குச் செல்லும் உருவகத்தையும் இச்சொல் காக்கிறது.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: மரணத்திலிருந்து வாழ்வுக்குள்
  rationale: ἐκ...εἰς என்பது ஒரு நிலையிலிருந்து வெளியேறி மற்றொரு நிலைக்குள் நுழைவதைக் குறிக்கிறது; ‘வாழ்வுக்குள்’ என்பது εἰς என்பதின் திசை மற்றும் நுழைவு உணர்வைக் காக்கிறது.
- source_word: ἀγαπῶμεν
  choice: அன்புகூருகிறோம்
  rationale: நிகழ்கால வினை தொடர்ச்சியான அல்லது இயல்பான பண்பைக் காட்டுகிறது. ‘அன்புகூருகிறோம்’ என்பது நவீனத் தமிழில் தெளிவானதும் கண்ணியமானதும் ஆகும்.
- source_word: τοὺς ἀδελφούς
  choice: சகோதரர்களிடம்
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மை என்பதால் முதன்மை உரையில் ‘சகோதரர்கள்’ காக்கப்படுகிறது; சூழலில் சக விசுவாசிகள் அனைவரையும் குறிக்கக்கூடிய பொருள் அடிக்குறிப்பில் தரப்படுகிறது. தமிழ் வினை வழக்கிற்கு ஏற்ப செயப்படுபொருள் ‘-ஐ’ என்பதற்குப் பதில் ‘-இடம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ μὴ ἀγαπῶν
  choice: அன்புகூராதவர்
  rationale: பெயர்ச்சொல் தன்மையுடைய நிகழ்காலப் பங்கேற்புவினை, அன்பில்லாமை பண்பாக உள்ள பொதுவகை நபரைக் குறிக்கிறது; இத்தமிழாக்கம் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: μένει
  choice: நிலைத்திருக்கிறார்
  rationale: யோவானின் எழுத்துகளில் முக்கியமான μένω, தொடர்ந்து அதே நிலையில் இருப்பதைக் குறிக்கிறது. ‘நிலைத்திருக்கிறார்’ அதன் தொடர்நிலைப் பொருளைக் காக்கிறது.
- source_word: ἐν τῷ θανάτῳ
  choice: மரணத்திலேயே
  rationale: மரணத்தின் எல்லைக்குள் தொடர்ந்து இருப்பதை உருவகமாகச் சொல்கிறது. ‘-லேயே’ அந்த நிலையிலேயே தொடர்வதை வலியுறுத்துகிறது; உருவகத்தை விளக்கி விரிவாக்கவில்லை.
theological_decisions:
- issue: ἀδελφοί என்பதின் சுட்டுப்பொருளும் பாலின வலிமையும்
  choice: முதன்மை உரையில் ‘சகோதரர்கள்’; எல்லா சக விசுவாசிகளையும் உள்ளடக்கக்கூடிய பொருள் அடிக்குறிப்பில்
  alternative: ‘சகோதர சகோதரிகள்’ அல்லது ‘சக விசுவாசிகள்’
  rationale: கிரேக்கம் இலக்கணப்படி ஆண்பால் பன்மை. அதே நேரத்தில், 1 யோவானின் சமூகச் சூழலில் இது பெண்கள் உட்பட சக விசுவாசிகள் அனைவரையும் குறிக்க வாய்ப்புள்ளது. முதன்மை உரை மூல வடிவைக் காக்கிறது; அடிக்குறிப்பு உள்ளடக்கப் பொருளைத் தெரிவிக்கிறது.
- issue: ‘மரணம்’ மற்றும் ‘வாழ்வு’ என்பவற்றின் தன்மை
  choice: விளக்க விரிவாக்கமின்றி ‘மரணம்’ மற்றும் ‘வாழ்வு’ என்றே வைத்தல்
  alternative: ‘ஆவிக்குரிய மரணம் மற்றும் நித்திய வாழ்வு’ அல்லது ‘மரணத்தின் ஆட்சியிலிருந்து வாழ்வின் ஆட்சிக்குள்’
  rationale: இச்சொற்கள் ஆழமான இறையியல் மாற்றத்தைக் குறித்தாலும், வசனம் அதைச் சுருக்கமான உருவகமாகவே கூறுகிறது. கிரேக்கம் தராத குறிப்பிட்ட விளக்கத்தைப் புகுத்தாமல் அதன் இறையியல் செறிவும் திறந்த தன்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடந்துவந்திருக்கிறோம்’ நிறைவுற்ற மாற்றத்தின் தொடரும் விளைவை வெளிப்படுத்துகிறது; ‘மரணம்/வாழ்வு’ உருவகம் விளக்கச் சேர்க்கையின்றி காக்கப்பட்டுள்ளது.
