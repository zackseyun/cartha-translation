id: 1JN.3.17
reference: 1 John 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: ta
  text: ஆனால், இவ்வுலகப் பொருள்களை உடைய ஒருவன், தேவையில் இருக்கும் தன் சகோதரனை[a] பார்த்தும், அவனுக்கு இரங்காதபடி தன் உள்ளத்தை மூடிக்கொண்டால்[b], கடவுளின் அன்பு[c] அவனில் எப்படி நிலைத்திருக்கிறது?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதரன் அல்லது சகோதரி.’ கிரேக்கத்தில் ‘சகோதரன்’ என்று உள்ளது; அது ஒரு சக விசுவாசியைப் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவனிடமிருந்து தன் இரக்கத்தை அடைத்துக்கொண்டால்.’ சொல்லுக்கு சொல், ‘அவனிடமிருந்து தன் உள்ளுறுப்புகளை மூடிக்கொண்டால்’; இது மனமார்ந்த இரக்கத்தைக் காட்ட மறுப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: ‘கடவுளின் அன்பு’ என்பது அவனில் இருக்கும் கடவுளுடைய அன்பையோ, அவன் கடவுள்மீது கொண்ட அன்பையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: இவ்வுலகப் பொருள்கள்
  rationale: βίος இங்கு வாழ்வதற்கான வசதிகள் அல்லது உடைமைகளைக் குறிக்கிறது. தேவையிலுள்ள சகோதரருக்கு உதவுவது பற்றிய சூழலில், ‘இவ்வுலகப் பொருள்கள்’ என்பது பொருளாதார வளங்களை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: θεωρῇ
  choice: பார்த்தும்
  rationale: θεωρέω என்பது கவனித்துப் பார்ப்பதைக் குறிக்கலாம். இங்கு தேவையை நேரடியாக அறிந்திருந்தும் செயல்படாத முரண்பாட்டை ‘பார்த்தும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀδελφὸν
  choice: சகோதரன்
  rationale: கிரேக்கச் சொல் ஆண்பால் ஒருமையில் உள்ளது. அதன் சொற்பொருள் பிரதான உரையில் காக்கப்பட்டு, சக விசுவாசியைக் பிரதிநிதித்துவமாகக் குறிக்கக்கூடிய பரந்த பயன்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: χρείαν ἔχοντα
  choice: தேவையில் இருக்கும்
  rationale: சொல்லுக்கு சொல் ‘தேவை உடையவனாக’ என்ற பொருளை, நவீனத் தமிழில் இயல்பாக ‘தேவையில் இருக்கும்’ என வழங்குகிறது.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: அவனுக்கு இரங்காதபடி தன் உள்ளத்தை மூடிக்கொண்டால்
  rationale: σπλάγχνα என்பதன் நேர்ப்பொருள் உள்ளுறுப்புகள்; மரபுத்தொடராக அது ஆழ்ந்த இரக்கத்தைக் குறிக்கிறது. தமிழ் வாசகருக்குப் புரியும்படி இரக்கத்தை வெளிப்படுத்தியபடியே, ‘உள்ளத்தை மூடுதல்’ என்ற உருவகத்தையும் இவ்வாக்கியம் காக்கிறது.
- source_word: πῶς
  choice: எப்படி
  rationale: πῶς எழுப்பும் சொல்லாட்சிக் கேள்வியை, ‘எப்படி’ என்பது கூடுதல் இயலாமைச் சொல்லைச் சேர்க்காமல் நேரடியாகக் காக்கிறது.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: கடவுளின் அன்பு
  rationale: τοῦ θεοῦ என்ற வேற்றுமைத் தொடர்பு கடவுள் காட்டும் அன்பையோ, மனிதன் கடவுள்மீது கொண்ட அன்பையோ குறிக்கக்கூடும். ‘கடவுளின் அன்பு’ இந்த இருபொருள் வாய்ப்பைத் தீர்க்காமல் காக்கிறது.
- source_word: μένει ἐν αὐτῷ
  choice: அவனில் நிலைத்திருக்கிறது
  rationale: μένω யோவானின் எழுத்துகளில் தொடர்ச்சியாக இருப்பதைச் சுட்டும் முக்கியச் சொல். ‘நிலைத்திருக்கிறது’ அதன் நீடித்திருக்கும் பொருளையும் தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: ‘கடவுளின் அன்பு’ என்பதிலுள்ள வேற்றுமைத் தொடர்பின் இருபொருள் வாய்ப்பு
  choice: கடவுளின் அன்பு
  alternative: கடவுள் அவன்மீது கொண்ட அன்பு; அல்லது அவன் கடவுள்மீது கொண்ட அன்பு
  rationale: கிரேக்கத் தொடர் இரு விளக்கங்களுக்கும் இடமளிக்கிறது; யோவானின் இறையியலில் கடவுளிடமிருந்து பெறப்படும் அன்பும் மனிதனால் வெளிப்படுத்தப்படும் அன்பும் நெருக்கமாக இணைகின்றன. ஆகவே பிரதான உரை எதையும் தனியாகத் தேர்ந்தெடுக்கவில்லை.
- issue: ἀδελφὸν என்பதன் பாலின வடிவமும் பிரதிநிதித்துவப் பயன்பாடும்
  choice: சகோதரன்
  alternative: சகோதரன் அல்லது சகோதரி; சக விசுவாசி
  rationale: மூலச்சொல் ஆண்பால் ஒருமையில் இருப்பதால் பிரதான உரையில் அதே வடிவம் காக்கப்படுகிறது. அது ஒரு சக விசுவாசியைப் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் சொல்லாட்சிக் கேள்வியும், ‘கடவுளின் அன்பு’ என்பதிலுள்ள திட்டமிட்ட இருபொருள் வாய்ப்பும் காக்கப்பட்டுள்ளன.
