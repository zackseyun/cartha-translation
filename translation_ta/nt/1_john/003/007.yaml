revisions:
- from: பிள்ளைகளே, யாரும் உங்களை ஏமாற்ற இடங்கொடுக்காதீர்கள்.[a] நீதியின்படி நடக்கிறவன் நீதிமான்; அவர்[b] நீதிமானாக இருப்பதுபோலவே இவனும் நீதிமான்.
  to: பிள்ளைகளே, யாரும் உங்களை ஏமாற்ற விடாதீர்கள்.[a] நீதியைச் செய்கிறவன் நீதிமானாக இருக்கிறான்; அவர்[b] நீதிமானாக இருப்பதுபோலவே.
  rationale: The revision gives the imperative a direct Tamil form, restores the source’s ‘doing righteousness’ wording, and leaves ἐκεῖνος open through “அவர்” without adding the deictic “இவனும்.” Footnote a remains anchored to the prohibition, footnote b to “அவர்,” and footnote c documents the justice/righteousness lexical alternative while preserving the main-text cognate relationship.
