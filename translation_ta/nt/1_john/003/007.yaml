source:
  edition: SBLGNT
  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: ta
  text: பிள்ளைகளே, யாரும் உங்களை ஏமாற்ற விடாதீர்கள்.[a] நீதியைச் செய்கிறவன் நீதிமானாக இருக்கிறான்; அவர்[b] நீதிமானாக இருப்பதுபோலவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாரும் உங்களை வழிதவறச் செய்ய விடாதீர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “அந்த ஒருவர்.” இது பெரும்பாலும் கிறிஸ்துவைக் குறிப்பதாகத் தெரிகிறது; சிலர் இதைக் கடவுளைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: பிள்ளைகளே
  rationale: ஆசிரியர் அன்போடும் குடும்ப நெருக்கத்தோடும் அழைக்கும் பன்மை விளி. தமிழில் இயல்பாகவும் கண்ணியமாகவும் ஒலிக்கும் “பிள்ளைகளே” அந்தத் தொனியைத் தருகிறது; “சிறுபிள்ளைகளே” என்பது வயதில் சிறியவர்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை உண்டாக்கலாம்.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: யாரும் உங்களை ஏமாற்ற இடங்கொடுக்காதீர்கள்
  rationale: μηδείς உடன் வரும் நிகழ்காலக் கட்டளை ஒரு தடையை வெளிப்படுத்துகிறது. தமிழ் மொழிநடையில் இயல்பாக இருக்கும்படி எதிர்மறைக் கட்டளை வடிவில் மொழிபெயர்க்கப்பட்டது; πλανάω என்பதிலுள்ள ஏமாற்றுதல் அல்லது வழிதவறச் செய்தல் என்ற பொருள் அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது.
- source_word: ὁ ποιῶν τὴν δικαιοσύνην
  choice: நீதியின்படி நடக்கிறவன்
  rationale: பெயர்ச்சொல்லாக்கப்பட்ட நிகழ்கால வினையெச்சம் தனியொரு செயலைவிட ஒருவரின் தொடர்ந்த வாழ்க்கை முறையைக் குறிக்கிறது. “நீதியின்படி நடக்கிறவன்” என்பது அந்தப் பழக்கமான ஒழுக்க நடத்தையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δίκαιός ἐστιν
  choice: நீதிமான்
  rationale: δίκαιος என்பதன் ஒழுக்க மற்றும் உறவு சார்ந்த பொருளை “நீதிமான்” சுருக்கமாகத் தருகிறது; முந்தைய “நீதி” என்பதுடனான சொல்லியல் தொடர்பையும் காக்கிறது.
- source_word: καθὼς
  choice: இருப்பதுபோலவே
  rationale: ஒப்பீட்டின் முழு வலிமையையும் இயல்பான தமிழில் காட்டும் வடிவம்.
- source_word: ἐκεῖνος
  choice: அவர்
  rationale: கிரேக்கச் சுட்டுப்பெயரைக் குறிப்பிட்ட பெயரால் நிரப்பாமல், இயல்பான மற்றும் மரியாதைக்குரிய தமிழ்ச் சுட்டுப்பெயராக வழங்குகிறது. இதனால் அது கிறிஸ்துவையா கடவுளையா குறிக்கிறது என்ற மூலத்தின் ஓரளவு திறந்த நிலை பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ἐκεῖνος என்பதன் குறிப்பு
  choice: முதன்மை உரையில் “அவர்” என்று குறிப்பைத் திறந்த நிலையில் வைத்தல்
  alternative: “கிறிஸ்து” அல்லது “கடவுள்” என்று வெளிப்படையாகப் பெயரிடுதல்
  rationale: உடனடியான யோவானியச் சூழலில் இது கிறிஸ்துவைக் குறிப்பதே இயல்பாகத் தோன்றினாலும், சிலர் இதைக் கடவுளைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள். மூலத்தில் இல்லாத தெளிவைச் சேர்க்காமல் இந்த இறையியல் நெருக்கடியைப் பாதுகாக்கிறது.
- issue: நீதியைச் செய்வதும் நீதிமானாக இருப்பதும் இடையிலான தொடர்பு
  choice: “நீதியின்படி நடக்கிறவன் நீதிமான்” என்ற நேரடியான கூற்றைப் பாதுகாத்தல்
  alternative: நீதியான நடத்தை நீதிமானாக இருப்பதற்கான சான்று மட்டுமே என்று விளக்கிச் சேர்த்தல்
  rationale: வசனம் நடத்தைக்கும் நீதிமானாக இருப்பதற்கும் இடையிலான உறவைத் திட்டவட்டமாகக் கூறுகிறது; அந்த உறவு காரணமா, விளைவா, சான்றா என்பதை மொழிபெயர்ப்பில் இறையியல் விளக்கத்தால் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. “பிள்ளைகளே” என்பது அன்பான குடும்ப அழைப்பை இயல்பாகத் தருகிறது. “நீதியின்படி நடக்கிறவன்” என்பது தொடர்ச்சியான வாழ்க்கை முறையைச் சுட்டுகிறது. இறுதி ஒப்பீட்டில் தமிழில் குறிப்பு தெளிவாக இருக்க “இவனும்” சேர்க்கப்பட்டுள்ளது; இது புதிய நபரை அறிமுகப்படுத்தாமல் முதற்பகுதியில் கூறப்பட்டவனை மீண்டும் சுட்டுகிறது.
