id: 1JN.3.1
reference: 1 John 3:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: ta
  text: 'தந்தை நமக்கு எத்தகைய அன்பைக் கொடுத்திருக்கிறார் என்று பாருங்கள்: நாம் கடவுளின் பிள்ளைகள் என்று அழைக்கப்படுவதற்காக! மேலும் நாம் அப்படியே இருக்கிறோம்[a]. இதனால்தான் உலகம் நம்மை அறியாது; ஏனெனில் அது அவரை அறியவில்லை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘மேலும் நாம் அப்படியே இருக்கிறோம்’ என்பது இல்லை.
    reason: textual_variant
  - marker: b
    text: ‘அவரை’ என்பது இந்த வசனத்தில் மிகவும் இயல்பாகத் தந்தையைக் குறிக்கிறது; யோவானியப் பரந்த சூழலை முன்னிட்டு, அது கிறிஸ்துவைக் குறிப்பதாகவும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: பாருங்கள்
  rationale: பன்மை கட்டளை வடிவிலுள்ள கவன ஈர்ப்பு அழைப்பை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: ποταπὴν ἀγάπην
  choice: எத்தகைய அன்பை
  rationale: அன்பின் அளவை மட்டும் அல்லாமல் அதன் தன்மையைக் குறித்த வியப்பை வெளிப்படுத்துகிறது.
- source_word: δέδωκεν
  choice: கொடுத்திருக்கிறார்
  rationale: கடந்த செயலும் அதன் தொடரும் விளைவும் கொண்ட கிரேக்க நிறைவுக்கால நுணுக்கத்தைத் தமிழில் காட்டுகிறது.
- source_word: τέκνα θεοῦ
  choice: கடவுளின் பிள்ளைகள்
  rationale: τέκνα பாலினம் உள்ளடக்கிய ‘பிள்ளைகள்’ என்பதைக் குறிக்கிறது; ‘மகன்கள்’ எனக் குறுக்கவில்லை.
- source_word: κληθῶμεν
  choice: அழைக்கப்பட வேண்டும்
  rationale: ἵνα உடன் வரும் நோக்கம்/விளைவு சார்ந்த செயலப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; தகுதி அல்லது கட்டளை என்ற பொருளை இங்கு வற்புறுத்தவில்லை.
- source_word: καὶ ἐσμέν
  choice: உண்மையிலேயே நாம் அப்படித்தான் இருக்கிறோம்
  rationale: ‘அழைக்கப்படுவது’ வெறும் பெயரளவு அல்ல என்ற கிரேக்கத்தின் வலியுறுத்தலை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: ὁ κόσμος
  choice: உலகம்
  rationale: யோவானியச் சூழலில் சிறப்புப் பொருள் இருந்தாலும், மூல உருவகச் சொல்லை விளக்கிப் பதிலிடாமல் வைத்திருக்கிறது.
- source_word: οὐ γινώσκει ... οὐκ ἔγνω
  choice: அறிந்துகொள்வதில்லை ... அறிந்துகொள்ளவில்லை
  rationale: γινώσκωவின் ‘அறிதல்/அடையாளம் கண்டுகொள்ளுதல்’ பரப்பைத் தக்கவைத்து, இரு கூறுகளின் சொல்லியல் இணைப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: αὐτόν என்பதன் சுட்டுப்பொருள்
  choice: முதன்மையாகத் தந்தையைக் குறிப்பதாக மொழிபெயர்ப்பு அமைக்கப்பட்டுள்ளது
  alternative: கிறிஸ்துவைக் குறிப்பதாகவும் யோவானியப் பரந்த சூழலில் சிலர் புரிந்துகொள்கிறார்கள்
  rationale: இந்த வசனத்தில் அண்மையிலுள்ள வெளிப்படையான முன்னிலைச் சொல் ‘தந்தை’; எனினும் ஆண்பால் ஒருமைப் பிரதிப்பெயர் தமிழில் ‘அவரை’ என இயல்பாகவே தெளிவற்றிருப்பதால், மூலத்தின் இறையியல் சாத்தியத்தைத் தீர்த்துவிடாமல் அடிக்குறிப்பில் பதிவு செய்கிறது.
- issue: καὶ ἐσμέν இடம்பெறுதல்
  choice: முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது
  alternative: சில கையெழுத்துப் பிரதிகளில் இச்சொற்கள் இல்லை
  rationale: SBLGNT இவற்றை உரையில் ஏற்றுள்ளது; விசுவாசிகள் பெயரளவில் மட்டும் அல்ல, உண்மையாகவே கடவுளின் பிள்ளைகள் என்ற வலியுறுத்தல் முக்கியமானது. உரை வேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இதனால்தான்’ காரணத் தொடர்பை இயல்பாகக் காட்டுகிறது; ‘அறிந்துகொள்’ என்ற ஒரே வினை இரு இடங்களிலும் பயன்படுத்தப்பட்டு மூலத்தின் இணைநிலையைப் பாதுகாக்கிறது.
