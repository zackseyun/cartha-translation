  to: 'தந்தை நமக்கு எத்தகைய அன்பைக் கொடுத்திருக்கிறார் என்று பாருங்கள்: நாம் கடவுளின் பிள்ளைகள் என்று அழைக்கப்படுவதற்காக! மேலும் நாம் அப்படியே இருக்கிறோம்[a]. இதனால்தான் உலகம் நம்மை அறியாது; ஏனெனில் அது அவரை அறியவில்லை[b].'
