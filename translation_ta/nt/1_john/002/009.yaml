source:
  edition: SBLGNT
  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: ta
  text: தான் ஒளியில் இருப்பதாகச் சொல்லுகிறவன், தன் சகோதரனை[a] வெறுத்தால், இப்போதுவரை இருளிலேயே இருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் சகோதரனையோ சகோதரியையோ.” கிரேக்க மொழியில் ஆண்பால் ஒருமையான “சகோதரன்” என்ற சொல் உள்ளது; இந்த நெறிசார் சூழலில் அது இருபாலரையும் பிரதிநிதித்துவமாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: சொல்லிக்கொண்டு … வெறுக்கிறவன்
  rationale: இலக்கணத்தில் பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்பு வடிவத்தை, ஒரு வகையான மனிதரைச் சுட்டும் இயல்பான தமிழ்த் தொடராக வழங்குகிறது; சொல்லும் நிலையையும் வெறுக்கும் நிலையையும் ஒரே நேரத்தில் காட்டுகிறது.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: ஒளியில் இருப்பதாக
  rationale: யோவானின் ஒளி உருவகத்தையும் ‘இருளில்’ என்பதுடனான நேரடி முரண்பாட்டையும் காக்கிறது.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: தன் சகோதரனை
  rationale: கிரேக்க மூலத்தின் ஆண்பால் ஒருமையைப் பிரதான உரையில் காக்கிறது. சூழலில் இது சக விசுவாசியைக் குறிக்கக்கூடும்; ஆனால் அந்த விளக்கத்தைப் பிரதான உரைக்குள் சேர்க்கவில்லை.
- source_word: μισῶν
  choice: வெறுக்கிறவன்
  rationale: தொடர்ந்து காணப்படும் அல்லது குணவியல்பாக உள்ள மனப்பாங்கை இயல்பான தமிழ் நிகழ்காலத்தில் தெரிவிக்கிறது.
- source_word: ἐν τῇ σκοτίᾳ
  choice: இருளில்
  rationale: ‘ஒளியில்’ என்பதற்கு இணையான யோவானிய உருவகத்தையும் நெறி மற்றும் ஆவிக்குரிய எதிர்மறை நிலையையும் காக்கிறது.
- source_word: ἕως ἄρτι
  choice: இப்போதுவரை
  rationale: கூற்று அவனுடைய உண்மை நிலையை மாற்றவில்லை என்பதைக் காட்டும், நிகழ்காலம் வரையிலான தொடர்ச்சியை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀδελφός என்ற ஆண்பால் ஒருமையைப் பிரதிநிதித்துவ நெறிக்கூற்றில் மொழிபெயர்த்தல்
  choice: சகோதரன்
  alternative: சகோதரன் அல்லது சகோதரி; சக விசுவாசி
  rationale: ‘சகோதரன்’ என்பது மூலத்தின் இலக்கணப் பாலையும் உறவுச் சொல்லையும் காக்கிறது. இந்நெறிக்கூற்றில் அது ஆண், பெண் இருபாலரையும் பிரதிநிதித்துவமாக உள்ளடக்கக்கூடும் என்பதால் அடிக்குறிப்பில் மாற்று வழங்கப்படுகிறது. ‘சக விசுவாசி’ என்பது சூழலுக்கு ஏற்றிருக்கலாம்; எனினும் அது மூலச் சொல்லின் உறவுப் படிமத்தை விளக்கமாக மாற்றிவிடும்.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒளி/இருள்’ என்ற யோவானிய இணை உருவகங்கள் விளக்கச் சேர்க்கையின்றி அப்படியே காக்கப்பட்டுள்ளன.
