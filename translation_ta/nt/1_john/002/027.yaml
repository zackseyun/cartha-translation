id: 1JN.2.27
reference: 1 John 2:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: ta
  text: நீங்களோ, அவரிடமிருந்து பெற்ற அபிஷேகம் உங்களில் நிலைத்திருக்கிறது. யாராவது உங்களுக்குக் கற்பிக்க வேண்டும் என்ற தேவை உங்களுக்கு இல்லை. மாறாக, அவருடைய அபிஷேகம் எல்லாவற்றைப் பற்றியும் உங்களுக்குக் கற்பிக்கிறது; அது உண்மையானது, பொய் அல்ல. அது உங்களுக்குக் கற்பித்தபடியே, அவரில் நிலைத்திருங்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சில கையெழுத்துப் பிரதிகளின்படி: “அது உங்களுக்குக் கற்பித்தபடியே, நீங்கள் அவரில் நிலைத்திருக்கிறீர்கள்.”'
    reason: textual_variant
  - marker: b
    text: “உங்களில் தங்கியிருக்கிறது” / “அவரில் தங்கியிருங்கள்” என்றும் மொழிபெயர்க்கலாம்; இந்த இரு இடங்களிலும் ஒரே கிரேக்க வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: அபிஷேகம்
  rationale: அபிஷேகம் செய்யப்படுவதையோ அதற்குப் பயன்படுத்தப்படும் பொருளையோ குறிக்கும் உருவகத்தை இது தக்கவைக்கிறது. இச்சூழலில் அது பரிசுத்த ஆவியையோ அவரது செயலையையோ சுட்டக்கூடும்; எனினும் மூலவசனம் அவ்வாறு நேரடியாக அடையாளப்படுத்தாததால், முதன்மை உரையில் உருவகம் பாதுகாக்கப்படுகிறது.
- source_word: ἀπ’ αὐτοῦ
  choice: அவரிடமிருந்து
  rationale: முந்தைய சூழலில் உள்ள ஆண்பால் ஒருமைச் சுட்டுப்பெயரைக் கூடுதல் விளக்கமின்றி பிரதிபலிக்கிறது.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: உங்களில் நிலைத்திருக்கிறது / அவரில் நிலைத்திருங்கள்
  rationale: யோவானின் எழுத்தில் மீண்டும் வரும் μένω என்ற வினையின் தொடர்பை ஒரே தமிழ் வேர்ச்சொல்லால் தக்கவைக்கிறது; இறுதி வடிவம் இங்கு கட்டளையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: யாராவது உங்களுக்குக் கற்பிக்க வேண்டும் என்ற தேவை உங்களுக்கு இல்லை
  rationale: கிரேக்க வாக்கியத்தின் வலிமையை மெலிவாக்காமலும், எல்லா மனித போதனையையும் நிராகரிக்கும் விளக்கத்தைச் சேர்க்காமலும் இயல்பான தமிழில் தருகிறது.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: கற்பிக்க / கற்பிக்கிறது / கற்பித்தது
  rationale: மூலத்தில் உள்ள சொல்லின் மறுபயன்பாட்டையும் வாதத்தின் ஒலியொற்றுமையையும் பாதுகாக்கிறது.
- source_word: περὶ πάντων
  choice: எல்லாவற்றையும் குறித்து
  rationale: சொற்றொடரின் பரந்த பொருளைச் சூழலுக்கு ஏற்ப முன்கூட்டியே குறுக்காமல் தக்கவைக்கிறது.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: அது உண்மையானது, பொய் அல்ல
  rationale: உண்மைக்கும் பொய்க்கும் இடையிலான யோவானிய எதிர்மறையை நேரடியாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: அது உங்களுக்குக் கற்பித்தபடியே
  rationale: அபிஷேகத்தின் முந்தைய கற்பித்தலுக்கும் இறுதிக் கட்டளைக்கும் உள்ள ஒப்பீட்டுத் தொடர்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: χρῖσμα என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘அபிஷேகம்’ என்ற உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘பரிசுத்த ஆவி’ அல்லது ‘பெற்றுக்கொண்ட நற்செய்தி’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: சூழல் ஆவியானவரின் அர்ப்பணித்து கற்பிக்கும் செயல்பாட்டைக் குறிக்கக்கூடும்; ஆனால் வசனம் பயன்படுத்தும் உருவகத்தை ஒரு குறிப்பிட்ட விளக்கமாக மாற்றாமல் பாதுகாப்பது மூலத்திற்கு நெருக்கமானது.
- issue: ‘யாராவது உங்களுக்குக் கற்பிக்க வேண்டும் என்ற தேவை இல்லை’ என்பதன் வலிமை
  choice: கூற்றை மெலிவாக்காமலும் முழுமையான கோட்பாட்டுக் கூற்றாக விரிவுபடுத்தாமலும் அப்படியே வழங்குதல்.
  alternative: மனித ஆசிரியர்கள் அனைவரையும் முற்றிலும் நிராகரிப்பதாகவோ, பிரிந்து சென்ற பொய்ப் போதகர்கள் மட்டும் தேவையில்லை என்று விளக்கிப் பெயர்ப்பதாகவோ கொடுத்தல்.
  rationale: கிரேக்கத்தின் நேரடியான கூற்றையும் அதன் சூழல் தீர்மானிக்க வேண்டிய பொருள் எல்லையையும் இரண்டையும் மொழிபெயர்ப்பு மதிக்கிறது.
- issue: இறுதி μένετε என்பதன் இலக்கண வலிமை
  choice: 'கட்டளை: ‘அவரில் நிலைத்திருங்கள்.’'
  alternative: 'கூற்று: ‘நீங்கள் அவரில் நிலைத்திருக்கிறீர்கள்.’'
  rationale: அச்சிடப்பட்ட SBLGNT உரை இச்சூழலில் இயல்பாகக் கட்டளையாகப் புரிகிறது; மாற்றுப் படிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: இறுதி αὐτῷ என்பதன் குறிப்பு
  choice: ஆண்பால் தனிப்பட்ட குறிப்பைத் தக்கவைத்து ‘அவரில்’ என மொழிபெயர்த்தல்.
  alternative: அபிஷேகத்தைக் குறிப்பதாகக் கொண்டு ‘அதில்’ என மொழிபெயர்த்தல்.
  rationale: கிரேக்க ஆண்பால் சுட்டுப்பெயரும் சூழலில் சாத்தியமான தனிப்பட்ட குறிப்பும் ‘அவரில்’ என்பதற்கு ஆதரவளிக்கின்றன; மொழிபெயர்ப்பு அதன் குறிப்பை மேலும் விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அபிஷேகம்’ என்ற பரவலாக அறியப்பட்ட சமயச் சொல் மூல உருவகத்தைத் தக்கவைக்கப் பயன்படுத்தப்பட்டது. நீளமான கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், அதன் கருத்துத் தொடர் மற்றும் மறுபயன்பாடுகள் பாதுகாக்கப்பட்டுள்ளன.
