id: 1JN.2.5
reference: 1 John 2:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: ta
  text: 'ஆனால் அவருடைய வார்த்தையைக் கடைப்பிடிக்கிற எவரிடத்தில்[a] தேவனுடைய அன்பு[b] உண்மையாகவே நிறைவடைந்திருக்கிறது. இதனால் நாம் அவரில் இருக்கிறோம் என்பதை அறிந்துகொள்கிறோம்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்சார்பாக, “இவரில்” அல்லது “இதில்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர், அவருடைய வார்த்தையைக் கடைப்பிடிக்கும் நபரையோ அந்தக் கடைப்பிடிப்பையே ஆதாரமாகவோ சுட்டக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: “தேவனுடைய அன்பு” என்பது தேவன் ஒருவரிடம் காட்டும் அன்பையோ, ஒருவர் தேவன்மீது கொண்ட அன்பையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: ஆனால் ... எவரிடத்தில்
  rationale: δέ முந்தைய கூற்றுடன் மென்மையான முரண்பாட்டைக் குறிக்கிறது; ὃς ... ἂν பொதுவான, வரையறையற்ற நிபந்தனையை—‘எவர் ... செய்கிறாரோ’—வெளிப்படுத்துகிறது.
- source_word: τηρῇ
  choice: கடைப்பிடிக்கிற
  rationale: τηρέω என்பதன் ‘காத்தல், கடைப்பிடித்தல், கீழ்ப்படிதல்’ என்ற பொருள் வரம்பை, வெறும் வெளிப்புறக் கீழ்ப்படிதலாகக் குறுக்காமல் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτοῦ τὸν λόγον
  choice: அவருடைய வார்த்தையை
  rationale: λόγος ஒருமையில் இருந்து, தேவன் அல்லது கிறிஸ்து அறிவித்ததைக் குறிக்கும் விரிவான யோவானிய சொல்லாட்சியைத் தக்கவைக்கிறது; αὐτοῦ என்பதையும் தீர்மானிக்காமல் ‘அவருடைய’ எனப் பாதுகாக்கிறது.
- source_word: ἀληθῶς
  choice: உண்மையாகவே
  rationale: கூற்றை வலியுறுத்தும் வினையடையின் ஆற்றலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐν τούτῳ
  choice: எவரிடத்தில்
  rationale: முன்னர் கூறப்பட்ட வார்த்தையைக் கடைப்பிடிக்கும் நபரையே சுட்டுவதாக முதன்மை உரை வாசிக்கிறது. கிரேக்கத்தின் ‘இதில்/இவரில்’ என்ற பரந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: தேவனுடைய அன்பு
  rationale: τοῦ θεοῦ என்ற வேற்றுமைத் தொடர்பை விளக்கித் தீர்க்காமல் வைத்திருப்பதால், தேவனிடமிருந்து வரும் அன்பு அல்லது தேவனை நோக்கிய அன்பு என்ற இரு சாத்தியங்களையும் தாங்குகிறது.
- source_word: τετελείωται
  choice: நிறைவடைந்திருக்கிறது
  rationale: நிறைவேற்றப்பட்ட செயல் தொடரும் நிலையைக் காட்டும் perfect passive வடிவத்தைத் தமிழில் இயல்பாக வெளிப்படுத்தி, ‘தன் இலக்கை எட்டுதல்/முழுமை அடைதல்’ என்ற பொருளையும் காக்கிறது.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: இதனால் ... அறிந்துகொள்கிறோம்
  rationale: அடுத்த கூற்றுக்கான ஆதாரம் அல்லது அடையாளத்தை அறிமுகப்படுத்தும் யோவானிய சூத்திரத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: நாம் அவரில் இருக்கிறோம் என்பதை
  rationale: ἐν αὐτῷ என்ற முக்கியமான யோவானிய உறவு/ஒன்றிப்பு மொழியை விளக்கி விரிவாக்காமல் ‘அவரில்’ என்று தக்கவைக்கிறது.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ என்பதிலுள்ள genitive உறவு
  choice: தேவனுடைய அன்பு
  alternative: தேவன் நம்மிடம் காட்டும் அன்பு; தேவன்மீது நாம் கொண்ட அன்பு
  rationale: கிரேக்கத் தொடர் இரு திசைகளிலும் பொருள்படக்கூடியது. முதன்மை உரை அதைத் தீர்மானிக்காமல் வைத்திருக்கிறது; சாத்தியங்கள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகின்றன.
- issue: முதல் ἐν τούτῳ என்பதன் சுட்டுப்பொருள்
  choice: வார்த்தையைக் கடைப்பிடிக்கும் நபரைச் சுட்டும் ‘எவரிடத்தில்’
  alternative: இதில்; இந்தக் காரியத்தில்; இவரில்
  rationale: உடனடியான இலக்கணச் சூழல் வார்த்தையைக் கடைப்பிடிக்கும் நபரைச் சுட்டலாம்; அதேவேளை, இது அந்தக் கடைப்பிடிப்பை ஆதாரமாகச் சுட்டுவதும் சாத்தியம். இயல்பான தமிழுக்காக நபர்சார் வாசிப்பு முதன்மை உரையில் இடம்பெற்று, மற்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வார்த்தை,’ ‘தேவனுடைய அன்பு,’ ‘அவரில்’ போன்ற யோவானிய சொற்றொடர்கள் தேவையற்ற விளக்கவுரையின்றித் தக்கவைக்கப்பட்டுள்ளன. வசன இறுதியிலுள்ள முக்காற்புள்ளி அடுத்த வசனத்தில் தொடரும் எண்ணத்தைக் காட்டுகிறது.
