reference: 1 John 2:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: ta
  text: அன்புக்குரியவர்களே, நான் உங்களுக்குப் புதிய கட்டளை ஒன்றை எழுதவில்லை; மாறாக, நீங்கள் தொடக்கத்திலிருந்தே கொண்டிருந்த பழைய கட்டளையையே எழுதுகிறேன். அந்தப் பழைய கட்டளை நீங்கள் கேட்ட செய்தியே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “வார்த்தையே”: “அந்தப் பழைய கட்டளை நீங்கள் கேட்ட வார்த்தையே.”'
    reason: λόγος என்பதற்கான அதிக நேரடியான சொற்பொருள் மாற்றைத் தருகிறது; முதன்மை உரையில் சூழலுக்கு இயல்பான ‘செய்தி’ பயன்படுத்தப்பட்டுள்ளது.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்பான பன்மை விளிப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துவதோடு, ἀγαπάω/ἀγάπη என்பவற்றுடனான சொற்பொருள் தொடர்பையும் யோவானின் கனிவான மேய்ப்புத் தொனியையும் காக்கிறது.
- source_word: ἐντολήν
  choice: கட்டளை
  rationale: யோவானின் எழுத்துகளில் இறையியல் முக்கியத்துவம் கொண்ட இச்சொல்லுக்கு நிலையான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: καινήν
  choice: புதிய
  rationale: παλαιός என்பதன் ‘பழைய’ என்ற நேரடி எதிர்மறை ஒப்பீட்டைக் காக்கிறது; தேவையற்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: γράφω
  choice: எழுதுகிறேன்
  rationale: கடிதம் எழுதும் தற்போதைய செயலை இயல்பான தமிழ் நிகழ்காலத்தில் தெரிவிக்கிறது.
- source_word: παλαιάν / παλαιά
  choice: பழைய
  rationale: ‘புதிய’ என்பதுடன் உள்ள நேரடி முரணையும், தொடக்கத்திலிருந்தே அறியப்பட்ட கட்டளை என்ற கருத்தையும் தெளிவாகக் காக்கிறது.
- source_word: εἴχετε
  choice: உங்களிடம் இருந்துவரும்
  rationale: இறந்தகாலத்தில் தொடர்ந்து உடைமையாக இருந்ததைக் காட்டும் imperfect வடிவை, தொடக்கத்திலிருந்து நீடிக்கும் நிலையாக இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπ’ ἀρχῆς
  choice: தொடக்கத்திலிருந்தே
  rationale: எந்தத் தொடக்கம் என்று குறிப்பாக வரையறுக்காமல், யோவானுக்குரிய சொற்றொடரின் அகலத்தையும் genuine ambiguity-யையும் காக்கிறது.
- source_word: λόγος
  choice: செய்தி
  rationale: இங்கு கேட்கப்பட்ட அறிவிப்பின் உள்ளடக்கத்தைக் குறிக்கும் பொருளை சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது; ‘வார்த்தை’ என்ற நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἠκούσατε
  choice: நீங்கள் கேட்ட
  rationale: வாசகர்கள் முன்னர் கேட்ட அறிவிப்பைக் குறிக்கும் aorist வடிவை எளிய இறந்தகாலப் பொருளில் தருகிறது.
theological_decisions:
- issue: ‘தொடக்கத்திலிருந்தே’ என்பதன் குறிப்பு
  choice: எந்தத் தொடக்கம் என்று விளக்காமல் அப்படியே வைக்கப்பட்டது
  alternative: உங்கள் கிறிஸ்தவ வாழ்வின் தொடக்கத்திலிருந்து; நற்செய்தி அறிவிக்கப்பட்ட தொடக்கத்திலிருந்து
  rationale: உடனடிச் சூழல் அவர்கள் முதலில் கேட்ட போதனையைக் குறிப்பதாகத் தோன்றினாலும், கிரேக்க உரை அதைத் தெளிவாக வரையறுக்கவில்லை. ஆகவே இறையியல் அல்லது வரலாற்று விளக்கம் மொழிபெயர்ப்புக்குள் சேர்க்கப்படவில்லை.
- issue: ‘பழைய கட்டளை’ மற்றும் கேட்ட λόγος ஆகியவற்றின் உறவு
  choice: ‘அந்தப் பழைய கட்டளை நீங்கள் கேட்ட செய்தியே’ என்று நேரடியாகச் சமப்படுத்தப்பட்டது
  alternative: அருகிலுள்ள வசனங்கள் அல்லது விரிவான இறையியலைக் கொண்டு கட்டளையின் உள்ளடக்கத்தை விளக்கிச் சேர்த்தல்
  rationale: கிரேக்க உரை பழைய கட்டளையை அவர்கள் கேட்ட λόγος உடன் நேரடியாக அடையாளப்படுத்துகிறது. அந்த உறவு விளக்கமோ இசைவாக்கமோ இன்றி காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கனிவும் கொண்ட கடிதத் தொனி. எளிதில் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘அன்புக்குரியவர்களே’ என்பது பாலினத்தைக் குறிப்பாக வரையறுக்காமல் பன்மைச் சபையினரை அணைக்கும் வடிவமாக உள்ளது.
