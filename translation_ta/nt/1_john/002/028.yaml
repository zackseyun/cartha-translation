reference: 1 John 2:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: ta
  text: இப்பொழுது, அன்புப் பிள்ளைகளே, அவரில் நிலைத்திருங்கள்; அவர் வெளிப்படுத்தப்பட்டால் நாம் துணிவுடன் இருக்கவும், அவரது வருகையின்போது வெட்கத்தால் அவரைவிட்டு விலகிப் பின்வாங்காமல் இருக்கவும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεκνία
  choice: அன்புப் பிள்ளைகளே
  rationale: அன்பும் குடும்ப உறவும் நிறைந்த அழைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. ‘சிறு பிள்ளைகளே’ என்பது குறுமைப் பொருளை நேரடியாகக் காட்டினாலும், இச்சூழலில் இயல்பற்றதாகவும் வயதை மட்டும் குறிப்பதாகவும் ஒலிக்கலாம்.
- source_word: μένετε
  choice: நிலைத்திருங்கள்
  rationale: யோவான் எழுத்துகளில் முக்கியமான தொடர்ச்சியான உறவைச் சுட்டும் μένω என்பதன் நீடித்திருத்தல் என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: யோவானுக்குரிய உறவுசார் உருவகத்தை விளக்கிச் சுருக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: φανερωθῇ
  choice: அவர் வெளிப்படுத்தப்பட்டால்
  rationale: வினையின் இறப்புவினை வடிவத்தையும் ἐὰν என்பதன் நிபந்தனைத் தன்மையையும் பாதுகாக்கிறது; இயல்பான மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: σχῶμεν παρρησίαν
  choice: நாம் நம்பிக்கையுடன் இருக்கவும்
  rationale: தேவனுக்கு முன்பாகத் திறந்த மனத்துடன் நிற்கும் துணிவையும் உறுதியையும் இயல்பான தமிழில் தெரிவிக்கிறது; ‘துணிச்சல்’ தேவையற்ற மோதல் நயத்தைத் தரக்கூடும்.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: வெட்கத்தால் அவரைவிட்டு விலகிப் பின்வாங்காமல் இருக்கவும்
  rationale: வெட்கம் என்ற உணர்வையும் ἀπό என்பதிலுள்ள அவரிடமிருந்து விலகும் நயத்தையும் ஒன்றாக வெளிப்படுத்துகிறது; இன்னொரு சாத்தியமான புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παρουσίᾳ
  choice: வருகையின்போது
  rationale: இறுதிக்காலச் சூழலில் கிறிஸ்துவின் எதிர்கால வருகையைத் தெளிவாகக் குறிக்கிறது; சொற்பொருளான ‘பிரசன்னம்’ இங்கு நிகழ்வின் நயத்தை மறைக்கக்கூடும்.
theological_decisions:
- issue: சுட்டுப்பெயர்களின் குறிப்பு மற்றும் இறுதிக்கால வெளிப்பாடு
  choice: ‘அவர்’ என்பது சூழலின்படி குமாரனாகிய இயேசு கிறிஸ்துவைக் குறிக்கிறது; வசனம் அவரது எதிர்கால வெளிப்பாட்டையும் வருகையையும் பேசுகிறது.
  alternative: குமாரனைத் தனியாகச் சுட்டாமல் தேவனைக் குறிக்கும் பொதுவான வாசிப்பு.
  rationale: உடனடிச் சூழல் குமாரனில் நிலைத்திருப்பதையும் அவர் வெளிப்படுவதையும் மையப்படுத்துகிறது. இருப்பினும் மொழிபெயர்ப்பு ‘இயேசு’ என்று பெயரைச் சேர்க்காமல் மூலத்தின் சுட்டுப்பெயரைப் பாதுகாக்கிறது.
- issue: வருகையின்போது ஏற்படும் வெட்கத்தின் நயம்
  choice: அவரது வருகையின்போது ஒருவர் வெட்கத்தால் அவரிடமிருந்து பின்வாங்கும் சாத்தியத்தைச் சொல்கிறது; இறுதித் தண்டனை என்று வெளிப்படையாகத் தீர்மானிக்கவில்லை.
  alternative: ‘அவருக்கு முன்பாக வெட்கப்படுதல்’ என்று மட்டும் புரிந்துகொள்ளுதல்.
  rationale: αἰσχυνθῶμεν என்பதுடன் ἀπ’ αὐτοῦ சேர்ந்திருப்பது வெட்கத்தோடு விலகும் நயத்தை ஆதரிக்கிறது; ஆனால் மாற்று வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. யோவானுக்குரிய ‘அவரில் நிலைத்திருங்கள்’ என்ற உறவுசார் மொழி பாதுகாக்கப்பட்டுள்ளது. இறப்புவினை, நிபந்தனை, வெட்கத்தால் விலகுதல் ஆகிய இடங்களிலுள்ள உண்மையான பொருள் நுணுக்கங்கள் உரையிலும் அடிக்குறிப்புகளிலும் தக்கவைக்கப்பட்டுள்ளன.
