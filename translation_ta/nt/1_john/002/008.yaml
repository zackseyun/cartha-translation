id: 1JN.2.8
reference: 1 John 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: ta
  text: மறுபடியும், நான் உங்களுக்கு ஒரு புதிய கட்டளையை எழுதுகிறேன். இது அவரிலும்[a] உங்களிலும் உண்மையாக உள்ளது; ஏனெனில் இருள் நீங்கிக்கொண்டிருக்கிறது, உண்மையான ஒளி ஏற்கெனவே ஒளிர்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது அதிலும் உங்களிலும் உண்மையாக உள்ளது”; இங்கு சுட்டுப்பெயர் அவரைக் குறிப்பதற்குப் பதிலாக அந்தக் கட்டளையை அல்லது முந்திய கருத்தைக் குறிப்பதாக எடுத்துக்கொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: முந்தைய வசனத்துடன் தொடர்புடைய புதுப்பிக்கப்பட்ட அல்லது மாறுபட்ட கூற்றைச் சுருக்கமாகக் குறிக்கிறது; கிரேக்கச் சொல்லின் உரையாடல் நெகிழ்வை மிகையாக விளக்காமல் காக்கிறது.
- source_word: ἐντολὴν καινὴν
  choice: ஒரு புதிய கட்டளையை
  rationale: καινός தரம் அல்லது இயல்பில் உள்ள புதுமையைச் சுட்டுகிறது; யோவானின் சொற்பயன்பாட்டுடன் ஒத்த இயல்பான தமிழ்.
- source_word: γράφω
  choice: எழுதுகிறேன்
  rationale: நிகழ்கால கிரேக்க வினையை, கடிதம் எழுதும் தற்போதைய செயலை இயல்பாக வெளிப்படுத்தும் தமிழில் தருகிறது.
- source_word: ὅ ἐστιν ἀληθὲς
  choice: இது ... உண்மையாக இருக்கிறது
  rationale: முந்திய கட்டளை அல்லது கருத்தை முழுமையாகச் சுட்டும் நடுநிலை உறவுப்பெயரின் பொருளைக் காக்கிறது; ἀληθές என்பதன் உண்மை மற்றும் மெய்த்தன்மை சார்ந்த நுணுக்கத்தையும் விடாமல் தருகிறது.
- source_word: ἐν αὐτῷ καὶ ἐν ὑμῖν
  choice: அவரிலும் உங்களிலும்
  rationale: αὐτῷ என்பதைக் சூழலில் கிறிஸ்துவைக் குறிக்கும் ஆண்பால் தனிப்பட்ட சுட்டுப்பெயராக எடுத்துக்கொள்கிறது; இரு இடங்களிலும் உள்ள இணையான ἐν அமைப்பையும் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்திய கூற்றுக்கான காரணத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἡ σκοτία παράγεται
  choice: இருள் நீங்கிக்கொண்டிருக்கிறது
  rationale: இருள் மறைந்து செல்லும் தொடர்ச்சியான நிகழ்வை நிகழ்நிலை வடிவில் இயல்பாகக் காட்டுகிறது.
- source_word: τὸ φῶς τὸ ἀληθινὸν
  choice: உண்மையான ஒளி
  rationale: யோவான் நூல்களில் முக்கியமான ஒளி–இருள் எதிர்மறையையும் ἀληθινός என்பதன் உண்மையான அல்லது மெய்யான என்ற நுணுக்கத்தையும் காக்கிறது.
- source_word: ἤδη φαίνει
  choice: ஏற்கெனவே ஒளிர்கிறது
  rationale: ஒளி இப்போதே செயல்படத் தொடங்கியிருப்பதை ἤδη தெளிவுபடுத்துகிறது; நிகழ்கால வினையின் தொடர்ச்சியையும் காக்கிறது.
theological_decisions:
- issue: αὐτῷ என்பதன் குறிப்பு
  choice: “அவரில்” என்று மொழிபெயர்த்து, கிறிஸ்துவைக் குறிப்பதாக முதன்மை உரையில் எடுத்துக்கொள்ளப்பட்டது.
  alternative: “அதில்” என்று மொழிபெயர்த்து, கட்டளையை அல்லது முந்திய கருத்தைச் சுட்டுவதாக எடுத்துக்கொள்ளலாம்.
  rationale: சூழலில் தனிப்பட்ட ஆண்பால் குறிப்பு கிறிஸ்துவைச் சுட்டுவது மிக இயல்பானது; எனினும் வடிவம் தரும் மாற்று வாய்ப்பை அடிக்குறிப்பில் வைத்திருப்பது மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. “நீங்கிக்கொண்டிருக்கிறது” மற்றும் “ஏற்கெனவே ஒளிர்கிறது” என்பவை நடைபெற்று வரும் இருள்–ஒளி மாற்றத்தின் கால நுணுக்கத்தை வெளிப்படுத்துகின்றன.
