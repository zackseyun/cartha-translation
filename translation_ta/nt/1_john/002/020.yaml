  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: ta
  text: ஆனால், நீங்கள் பரிசுத்தரிடமிருந்து அபிஷேகம் பெற்றிருக்கிறீர்கள்; நீங்கள் அனைவரும் அறிந்திருக்கிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறொரு பாடவேறுபாட்டின்படி, “நீங்கள் எல்லாவற்றையும் அறிந்திருக்கிறீர்கள்.” SBLGNT பாடம், “நீங்கள் அனைவரும் அறிந்திருக்கிறீர்கள்” என்பதை ஆதரிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: ஆனால்
  rationale: καί பொதுவாக ‘மற்றும்’ என்று பொருள்பட்டாலும், முந்தைய வசனத்தில் கூறப்பட்ட எதிர்க்கிறிஸ்துக்களுக்கும் இங்கு ‘நீங்கள்’ என்று வலியுறுத்தப்படுகிற வாசகர்களுக்கும் இடையிலான முரண்பாட்டை இச்சூழலில் குறிக்கிறது.
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: வெளிப்படையாக இடம்பெறும் கிரேக்கப் பதிலிப்பெயர் வலியுறுத்தலுடையது; ‘ஆனால், நீங்கள்’ என்ற அமைப்பு அந்த முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: χρῖσμα
  choice: அபிஷேகம்
  rationale: இச்சொல் அபிஷேகம் செய்வதையோ அபிஷேகப் பொருளையோ குறிக்கலாம். இங்கு உருவகத்தையும் அதன் இறையியல் ஆழத்தையும் காக்கும் வகையில் ‘அபிஷேகம்’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘பரிசுத்த ஆவி’ என்று விளக்கி மொழிபெயர்க்கப்படவில்லை.
- source_word: ἔχετε
  choice: பெற்றிருக்கிறீர்கள்
  rationale: சொல்லுக்குச் சொல் ‘உங்களுக்கு உண்டு’ என்பதாக இருந்தாலும், ἀπὸ τοῦ ἁγίου என்பதோடு சேர்ந்து அபிஷேகத்தின் மூலத்தை இயல்பான நவீன தமிழில் தெரிவிக்க ‘பெற்றிருக்கிறீர்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: பரிசுத்தரிடமிருந்து
  rationale: ‘பரிசுத்தமான ஒருவரிடமிருந்து’ என்ற பட்டப்பெயரைச் சுருக்கமாகவும் மரியாதையாகவும் தருகிறது; அவர் பிதாவா குமாரனா என்பதை மொழிபெயர்ப்பு குறிப்பாகத் தீர்மானிக்கவில்லை.
- source_word: καὶ
  choice: ;
  rationale: இரண்டாவது καί இரண்டு தொடர்புடைய கூற்றுகளை இணைக்கிறது. தமிழில் அரைப்புள்ளி அந்த இணைப்பை இயல்பாகக் காட்டுகிறது; தனியாக ‘மற்றும்’ சேர்ப்பது தேவையில்லை.
- source_word: οἴδατε
  choice: அறிந்திருக்கிறீர்கள்
  rationale: οἶδα அறிவையோ விழிப்புணர்வையோ குறிக்கிறது; இங்கு ‘அறிந்திருக்கிறீர்கள்’ என்பது நேரான, இயல்பான தமிழ் இணை.
- source_word: πάντες
  choice: நீங்கள் அனைவரும்
  rationale: SBLGNT பாடத்தில் πάντες எழுவாய் பன்மையாக இருப்பதால், ‘எல்லாவற்றையும்’ அல்ல, வாசகர்கள் அனைவரையும் குறிக்கும் ‘நீங்கள் அனைவரும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘பரிசுத்தர்’ யாரைக் குறிக்கிறார்?
  choice: பிதாவையோ குமாரனையோ குறிப்பாக அடையாளப்படுத்தாமல் ‘பரிசுத்தர்’ என்ற பட்டப்பெயர் காக்கப்பட்டுள்ளது.
  alternative: பரிசுத்த தேவன்; பரிசுத்த ஆவி; இயேசு கிறிஸ்து
  rationale: கிரேக்க மூலவாக்கியம் இதன் குறிப்பை வெளிப்படையாகத் தீர்மானிக்கவில்லை. எனவே உண்மையான இறையியல் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
- issue: χρῖσμα என்பதன் இறையியல் பொருள்
  choice: ‘அபிஷேகம்’ என்ற உருவக மொழி அப்படியே காக்கப்பட்டுள்ளது.
  alternative: பரிசுத்த ஆவி; ஆவியானவரின் அபிஷேகம்; அபிஷேக வரம்
  rationale: இந்த அபிஷேகம் பரிசுத்த ஆவியையோ அவரது செயலையோ குறிக்கலாம்; ஆனால் மூலவாக்கியம் χρῖσμα என்ற உருவகச் சொல்லையே பயன்படுத்துவதால், மொழிபெயர்ப்பு அதைக் குறிப்பிட்ட விளக்கமாக மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அபிஷேகம்’, ‘பரிசுத்தர்’ ஆகிய வேதாகமச் சொற்கள் மூலத்தின் உருவகத்தையும் தெளிவின்மையையும் காக்கின்றன.
