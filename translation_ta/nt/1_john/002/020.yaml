  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: முந்தைய வசனத்துடனான முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; χρῖσμα உருவகமாக ‘அபிஷேகம்’ எனவே உள்ளது; ἀπὸ τοῦ ἁγίου என்பது குறிப்பிட்ட அடையாளப்படுத்தல் இன்றி ‘பரிசுத்தரிடமிருந்து’ எனத் தரப்பட்டுள்ளது; SBLGNT-இன் πάντες வாசிப்புக்கு ஏற்ப ‘நீங்கள் அனைவரும்’ என மொழிபெயர்க்கப்பட்டுள்ளது. ‘பெற்றிருக்கிறீர்கள்’ என்பது ἔχετε (‘உண்டு/கொண்டிருக்கிறீர்கள்’) என்பதைக் காட்டிலும் பெறுதலைச் சற்றே முன்னிறுத்தினாலும், ‘பரிசுத்தரிடமிருந்து அபிஷேகம்’ என்ற தமிழ்ச் சொல்லமைப்பில் நிலையான உடைமையைக் குறிக்கும் இயல்பான, சூழலுக்கு ஏற்ற வெளிப்பாடாகும்; பொருளை மாற்றவில்லை.'
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘ஆனால், நீங்கள்’ என்ற தொடக்கம் வலியுறுத்தலையும் எதிர்மறைத் தொடர்பையும் இயல்பாகத் தருகிறது. அரைப்புள்ளி இரண்டாவது καί-யின் தொடர்பை போதுமான அளவு காட்டுகிறது; தமிழில் வெளிப்படையான இணைப்புச்சொல் கட்டாயமல்ல. ‘நீங்கள் அனைவரும் அறிந்திருக்கிறீர்கள்’ என்பது இவ்வசனத்தின் சுருக்கமான கிரேக்கப் பயன்பாட்டுக்கு ஏற்ற புரிந்துகொள்ளத்தக்க வெளிப்பாடாகும்.
