source:
  edition: SBLGNT
  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: ta
  text: அவர்[a] நீதியுள்ளவர் என்று நீங்கள் அறிந்தால், நீதியைக் கடைப்பிடிக்கிற ஒவ்வொருவரும் அவரிடமிருந்து[b] பிறந்திருக்கிறார் என்பதையும் அறிவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள ‘அவர்’ என்பது பிதாவாகிய கடவுளையோ குமாரனையோ குறிக்கலாம்; கிரேக்க உரை யாரைக் குறிக்கிறது என்பதை வெளிப்படையாகச் சொல்லவில்லை.
    reason: alternative_reading
  - marker: b
    text: ‘அவரிடமிருந்து’ என்பதற்கு ‘அவரிடத்து இருந்து’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொற்றொடர் பிறப்பின் மூலத்தைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: நீங்கள் அறிந்தால்
  rationale: நிபந்தனையைக் குறிக்கும் ἐὰν என்பதையும், அறிதலைக் குறிக்கும் οἶδα என்பதையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δίκαιός
  choice: நீதியுள்ளவர்
  rationale: இங்கு சொல்லப்படும் ஒழுக்க மற்றும் இறையியல் பண்பைத் தெளிவாகக் காட்டுவதோடு, δικαιοσύνη என்பதுடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: γινώσκετε
  choice: அறிவீர்கள்
  rationale: இவ்வடிவத்தை கட்டளையாக அல்லாமல் கூற்றைக் குறிக்கும் வினையாக எடுத்துக்கொள்கிறது; நிபந்தனை வாக்கியத்தின் இயல்பான ஓட்டத்தையும் காக்கிறது.
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: நீதியைக் கடைப்பிடிக்கிற ஒவ்வொருவரும்
  rationale: நிகழ்காலப் பங்கேற்பு வடிவம் சுட்டும் தொடர்ச்சியான அல்லது பண்பான நடத்தையை, வெறுமனே ஒரு செயலைச் செய்வதாக அல்லாமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐξ αὐτοῦ
  choice: அவரிடமிருந்து
  rationale: தோற்றம் அல்லது மூலத்தைச் சுட்டும் ἐξ என்பதையும் பிறப்பு உருவகத்தையும் தெளிவாகக் காக்கிறது.
- source_word: γεγέννηται
  choice: பிறந்திருக்கிறார்
  rationale: நிறைவேறிய பிறப்புச் செயலையும் அதன் தொடரும் விளைவையும் குறிக்கும் நிறைவுக்காலச் செயல்பாட்டு வலுவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: δίκαιός ἐστιν மற்றும் ἐξ αὐτοῦ என்பவற்றிலுள்ள பதிலிடுபெயரின் குறிப்பு
  choice: ‘அவர்/அவரிடமிருந்து’ என்று மட்டும் வைத்து, யாரைக் குறிக்கிறது என்பதை உரையில் குறிப்பிடாமல் விடுதல்
  alternative: பிதாவாகிய கடவுள் அல்லது குமாரன் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: உடனடிச் சூழலில் பிதாவையோ குமாரனையோ குறிக்கலாம்; கிரேக்க வசனம் பெயரை வெளிப்படையாகக் குறிப்பிடாததால் அந்த உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நீதியுள்ளவர்’ மற்றும் ‘நீதியைக் கடைப்பிடிக்கிற’ ஆகியவை தொடர்புடைய கிரேக்கச் சொற்களின் கருத்துத் தொடர்பைக் காக்கின்றன; பதிலிடுபெயரின் இறையியல் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்படுகிறது.
