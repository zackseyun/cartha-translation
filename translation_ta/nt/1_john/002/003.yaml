revisions:
- from: அவருடைய கட்டளைகளை நாம் கடைப்பிடித்தால், நாம் அவரை அறிந்துகொண்டிருக்கிறோம் என்பதை இதனால் அறிகிறோம்.[a]
  to: 'இதனால் நாம் அவரை அறிந்துகொண்டுள்ளோம் என்பதை அறிகிறோம்: அவருடைய கட்டளைகளை நாம் கடைப்பிடித்தால்.[a]'
  rationale: The revision replaces a progressive Tamil form with ‘அறிந்துகொண்டுள்ளோம்,’ which better represents the Greek perfect’s completed-and-continuing force without specifying the referent of αὐτόν. It retains the conditional relation, the commandment terminology, and the footnote anchor.
