id: 1JN.2.3
reference: 1 John 2:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: ta
  text: 'இதனால் நாம் அவரை அறிந்துகொண்டுள்ளோம் என்பதை அறிகிறோம்: அவருடைய கட்டளைகளை நாம் கடைப்பிடித்தால்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, ‘நாம் அவரை அறிந்திருக்கிறோம்’; கிரேக்க நிறைவுக்காலம் ‘அவரை அறிந்துகொண்டுள்ளோம்’ என்ற பொருளை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: இதனால்
  rationale: ஒரு காரியத்தை அறிந்துகொள்வதற்கான அடிப்படை அல்லது சான்றை அறிமுகப்படுத்தும் யோவானியச் சொற்றொடர்; ‘இதனால்’ என்பது இயல்பான தமிழில் அதன் சுட்டும் வலிமையைப் பாதுகாக்கிறது.
- source_word: γινώσκομεν
  choice: அறிகிறோம்
  rationale: தற்போதைய அறிதல் அல்லது உறுதியைக் குறிக்கும் நிகழ்கால வினை; ‘அறிகிறோம்’ நேரடியும் இயல்பானதும் ஆகும்.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: நாம் அவரை அறிந்துகொண்டிருக்கிறோம் என்பதை
  rationale: கிரேக்க நிறைவுக்காலம், அறிந்துகொள்ள வந்த நிகழ்வையும் அதன் தொடரும் விளைவையும் உணர்த்துகிறது; ‘அறிந்துகொண்டிருக்கிறோம்’ அந்த விளைவுநிலையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: கிரேக்கம் பெயரைக் குறிப்பிடாமல் பிரதிப்பெயரையே பயன்படுத்துகிறது. தேவனா கிறிஸ்துவா என்று மொழிபெயர்ப்பில் குறுக்கி நிர்ணயிக்காமல் அதே தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ἐὰν
  choice: -த்தால்
  rationale: நிபந்தனையை இயல்பான தமிழில் காட்டும் விகுதி; இங்கு ‘கடைப்பிடித்தால்’ என்று வினையுடன் இணைக்கப்பட்டுள்ளது.
- source_word: ἐντολάς
  choice: கட்டளைகளை
  rationale: யோவானியப் பயன்பாட்டிலுள்ள அதிகாரத்தையும் ஒழுக்கப் பாரத்தையும் காக்கும், நவீனத் தமிழில் புரியக்கூடிய சொல்லாக்கம்.
- source_word: τηρῶμεν
  choice: நாம் கடைப்பிடித்தால்
  rationale: τηρέω என்பதிலுள்ள காத்தல், தொடர்ந்து அனுசரித்தல், கீழ்ப்படிதல் ஆகிய நுணுக்கங்களை ‘கடைப்பிடி’ இயல்பாகத் தருகிறது; வெறும் வெளிப்புறக் கீழ்ப்படிதலாகச் சுருக்கவில்லை.
theological_decisions:
- issue: αὐτόν (‘அவரை’) என்பதன் குறிப்பு
  choice: மூலத்தைப் போலவே ‘அவரை’ என்ற பிரதிப்பெயரை வைத்திருத்தல்
  alternative: ‘தேவனை’ அல்லது ‘இயேசுவை/கிறிஸ்துவை’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: கிரேக்க உரை பிரதிப்பெயரையே பயன்படுத்துகிறது; 1 யோவானின் சூழலில் தேவனை அறிதலும் மகனுடனான உறவும் நெருக்கமாக அமைந்துள்ளன. வசனம் தானாகச் செய்யாத குறிப்பை மொழிபெயர்ப்பு தீர்மானிக்காமல் இறையியல் இழுவிசையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியக்கூடிய, மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை. முக்கிய வாக்கியத்தை முதலில் வைத்து, நிபந்தனையை இயல்பான தமிழ் வாக்கிய ஒழுங்கில் முன்னிலைப்படுத்தியுள்ளது.
