id: 1JN.2.17
reference: 1 John 2:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: ta
  text: உலகமும் அதன் ஆசையும் கடந்துபோய்க்கொண்டிருக்கின்றன[a]; ஆனால் கடவுளின் சித்தத்தைச் செய்கிறவர் என்றென்றும் நிலைத்திருக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடந்துபோகின்றன’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிகழ்கால வடிவம் உலகமும் அதன் ஆசையும் மறைந்துகொண்டிருக்கும் தொடர்ச்சியான நிலையைக் காட்டலாம்.
    reason: aspectual_alternative
  - marker: b
    text: ‘என்றென்றும் தங்கியிருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். ‘நிலைத்திருக்கிறார்’ என மொழிபெயர்க்கப்பட்ட கிரேக்க வினைச்சொல் யோவானின் எழுத்துகளில் ‘தங்கியிரு’ என்ற பொருளிலும் அடிக்கடி வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: உலகம்
  rationale: யோவானின் இச்சூழலில் இது படைக்கப்பட்ட உலகை மட்டும் குறிக்காமல், கடவுளுக்கு எதிரான மதிப்புகளாலும் ஆசைகளாலும் வகைப்படுத்தப்படும் மனித உலகையும் குறிக்கிறது. எனினும், மூலத்தின் பரந்த சொல்லாட்சியைச் சுருக்காமல் ‘உலகம்’ எனவே வைக்கப்பட்டுள்ளது.
- source_word: παράγεται
  choice: கடந்துபோய்க்கொண்டிருக்கின்றன
  rationale: நிகழ்கால வினையின் தொடரும் தன்மையையும் உலகத்தின் நிலையாமையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. இணைக்கப்பட்ட இரு எழுவாய்களுக்கு ஏற்ப தமிழில் பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπιθυμία
  choice: ஆசை
  rationale: இச்சூழலில் ஒழுங்குபிறழ்ந்த வலுவான விருப்பத்தைக் குறித்தாலும், பாலியல் பொருளுக்கு மட்டும் சுருக்கக்கூடிய ‘இச்சை’ போன்ற சொல்லைவிட ‘ஆசை’ பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: αὐτοῦ
  choice: அதன்
  rationale: இது ‘உலகம்’ என்பதையே சுட்டுகிறது; தமிழில் உயிரற்ற முன்னிலைச் சொல்லுக்குப் பொருத்தமான உரிமை வடிவம் ‘அதன்’ ஆகும்.
- source_word: ὁ δὲ ποιῶν
  choice: ஆனால் ... செய்கிறவர்
  rationale: கடவுளின் சித்தத்தைச் செய்வதால் அடையாளப்படுத்தப்படும் ஒருவரைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள பங்கேற்பு வினையை, பாலினம் குறிப்பிடாத மரியாதையான ஒருமை வடிவில் தருகிறது.
- source_word: θέλημα
  choice: சித்தம்
  rationale: கடவுளின் நோக்கத்தையும் விருப்பத்தையும் குறிக்கும் மரபாக நிலைபெற்ற, கண்ணியமான தமிழ்ச் சொல்; வெறும் தனிப்பட்ட விருப்பம் என்ற பொருளுக்குச் சுருக்குவதில்லை.
- source_word: μένει
  choice: நிலைத்திருக்கிறார்
  rationale: தொடர்ந்து இருப்பதையும் அழியாமல் நிலைப்பதையும் தெளிவாகத் தெரிவிக்கிறது; யோவானிய பயன்பாட்டில் உள்ள ‘தங்கியிரு’ என்ற கருத்தையும் முற்றிலும் தொழில்நுட்பச் சொல்லாக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: இச்சூழலில் முடிவில்லாத நீடிப்பைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: யோவானியச் சூழலில் κόσμος என்பதன் பொருள்
  choice: கடவுளுக்கு எதிரான ஆசைகளால் வகைப்படுத்தப்படும் நிலையற்ற உலகம்
  alternative: படைப்பாகிய பௌதிக உலகம் மட்டும்
  rationale: முந்தைய வசனத்தின் ஆசைகளும் பெருமையும் இங்கு ‘உலகம்’ என்பதன் ஒழுக்க-இறையியல் சூழலை நிர்ணயிக்கின்றன. இருப்பினும் விளக்கத்தை மொழிபெயர்ப்புக்குள் திணிக்காமல் பரந்த ‘உலகம்’ என்ற சொல் தக்கவைக்கப்பட்டுள்ளது.
- issue: μένει εἰς τὸν αἰῶνα என்பதன் வலிமை
  choice: கடவுளின் சித்தத்தைச் செய்கிறவர் என்றென்றும் நிலைத்திருப்பது
  alternative: நித்திய வாழ்வைப் பற்றிய விரிவான கோட்பாட்டு விளக்கம்
  rationale: கிரேக்கம் முடிவில்லாத நிலைத்திருப்பை நேரடியாகக் கூறுகிறது; அது எவ்வாறு நிகழ்கிறது என்பதை இவ்வசனம் விளக்காததால், கூடுதல் கோட்பாட்டு விவரங்கள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘சித்தம்’ போன்ற பரவலாக அறியப்பட்ட இறையியல் சொல்லாட்சி தக்கவைக்கப்பட்டாலும், பழமையான வாக்கிய அமைப்பு தவிர்க்கப்பட்டுள்ளது.
