  source_fidelity: மூலக் கிரேக்கத்தின் அமைப்பும் பொருளும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. «உலகமும் அதன் ஆசையும்» என்பது καὶ ὁ κόσμος ... καὶ ἡ ἐπιθυμία αὐτοῦ என்பதையும், «கடந்துபோய்க்கொண்டிருக்கின்றன» என்பது παράγεται என்பதன் நிகழ்காலத் தொடர்நிலையையும் இயல்பாக வெளிப்படுத்துகிறது. «கடவுளின் சித்தத்தைச் செய்கிறவர்» ὁ ποιῶν τὸ θέλημα τοῦ θεοῦ என்பதற்கு நேர்மையானது; «என்றென்றும் நிலைத்திருக்கிறார்» μένει εἰς τὸν αἰῶνα என்பதன் நீடித்த, முடிவற்ற வலிமையைப் பாதுகாக்கிறது.
  naturalness: நவீன நிலையான தமிழில் வாக்கியம் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. இணை எழுவாயான «உலகமும் அதன் ஆசையும்» உடன் பன்மை வினை «கடந்துபோய்க்கொண்டிருக்கின்றன» பயன்படுத்தியது தமிழுக்கு இயல்பானது. «சித்தம்», «நிலைத்திருக்கிறார்», «என்றென்றும்» ஆகியவை வேதாகமப் பதிவுக்கேற்றும் பொதுவாசகருக்குப் புரியக்கூடியவையும் ஆகும்.
  terminology: «உலகம்» κόσμος என்பதன் சூழலால் நிர்ணயிக்கப்படும் பரந்த யோவானிய பொருளைத் தேவையற்ற விளக்கமின்றித் தக்கவைக்கிறது. «ஆசை» ἐπιθυμίαவை பாலியல் விருப்பமாக மட்டும் குறுக்காமல் சரியாகத் தருகிறது. «சித்தம்» மற்றும் «நிலைத்திருக்கிறார்» முறையே θέλημα, μένει ஆகியவற்றுக்கு நிலையானவும் பொருத்தமானவும் தேர்வுகள். அடிக்குறிப்பு குறியீடுகள் பொருத்தமான இடங்களில் உள்ளன.
