  text: Ταῦτα ἔγραψα ὑμῖν περὶ τῶν πλανώντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/026.yaml
  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: ta
  text: உங்களை வழிதவறச் செய்கிறவர்களைக் குறித்து இவற்றை உங்களுக்கு எழுதியிருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களை ஏமாற்றுகிறவர்கள்’ அல்லது ‘உங்களைத் தவறாக வழிநடத்துகிறவர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அவர்கள் செய்யும் செயலைக் குறிக்கிறது; அவர்கள் உங்களை ஏற்கெனவே வழிதவறச் செய்துவிட்டார்கள் என்பதை அது கட்டாயமாகக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: இவற்றை
  rationale: இது பன்மை நடுநிலைச் சுட்டுப்பெயர்; முன்பு எழுதப்பட்ட கருத்துகளைச் சுட்டுவதால் ‘இவற்றை’ என்பது இயல்பானது.
- source_word: ἔγραψα
  choice: எழுதியிருக்கிறேன்
  rationale: இறந்தகால வினை வடிவம் நிறைவேறிய எழுத்துச் செயலைக் குறிக்கிறது; கடிதச் சூழலில் அதன் தற்போதைய தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்த ‘எழுதியிருக்கிறேன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: எழுதப்பட்டதின் பெறுநர்களைக் குறிக்கும் வேற்றுமைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: περὶ
  choice: குறித்து
  rationale: எழுதப்பட்டதன் பொருள் அல்லது தலைப்பை அறிமுகப்படுத்தும் முன்னிடைச்சொல்லின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: உங்களை வழிதவறச் செய்கிறவர்களை
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சம் அந்த நபர்களின் தொடரும் செயல்பாட்டை அடையாளப்படுத்துகிறது. ‘வழிதவறச் செய்’ என்பது πλανάω-வில் உள்ள பாதையிலிருந்து விலக்குதல் என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: πλανάω
  choice: வழிதவறச் செய்
  rationale: ஏமாற்றுதல் அல்லது தவறாக வழிநடத்துதல் என்ற பொருளுடன், சரியான பாதையிலிருந்து விலகச் செய்தல் என்ற மூல உருவகத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: πλανώντων என்பது ஏமாற்றுதல் வெற்றியடைந்ததைச் சொல்கிறதா அல்லது அதற்கான முயற்சியை மட்டும் சொல்கிறதா
  choice: உங்களை வழிதவறச் செய்கிறவர்கள்
  alternative: உங்களை வழிதவறச் செய்ய முயல்கிறவர்கள்
  rationale: கிரேக்க நிகழ்கால வினையெச்சம் எதிரிகளின் செயலை நேரடியாக விவரிக்கிறது; முயற்சி என்ற கருத்தை வெளிப்படையாகச் சேர்க்கவில்லை. அதேவேளை அந்தச் செயல் வாசகர்களிடம் வெற்றியடைந்துவிட்டது என்றும் கட்டாயப்படுத்தாது. இந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கடித நடையில் மொழிபெயர்க்கப்பட்டது. ‘வழிதவறச் செய்’ என்பது மூலமொழியின் உருவகத்தையும் எச்சரிக்கைத் தொனியையும் தக்கவைக்கிறது.
