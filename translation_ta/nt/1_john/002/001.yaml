  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘தந்தையிடம் நமக்காகப் பரிந்து பேசுகிறவர் நமக்கு இருக்கிறார்’ என்பது சிறிது மீளுரைப்பைப் போலத் தோன்றினாலும், கிரேக்கத்தின் ‘with/before the Father’ மற்றும் ‘we have’ ஆகிய இரண்டையும் தெளிவாகக் காக்கும் இயல்பான வடிவம்.
  terminology: ‘சிறு பிள்ளைகளே,’ ‘பாவம்,’ ‘மெசியா,’ மற்றும் ‘நீதியுள்ளவராகிய’ ஆகியவை பொருத்தமானவை. παράκλητος-க்கு முதன்மை உரையில் செயல்பாட்டு விளக்கமான ‘பரிந்து பேசுகிறவர்’ ஏற்றது; அடிக்குறிப்பு அதன் பரந்த சொற்பொருளைச் சரியாகக் காக்கிறது. Χριστός-க்கு ‘மெசியா’ என்பதும் வழங்கப்பட்ட கொள்கையுடனும் மூலத்தின் பட்டப்பெயர் நயத்துடனும் ஒத்துள்ளது.
