id: 1JN.2.1
reference: 1 John 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: ta
  text: என் சிறு பிள்ளைகளே, நீங்கள் பாவம் செய்யாதிருக்க இவற்றை உங்களுக்கு எழுதுகிறேன். ஆனால் யாராவது பாவம் செய்தால், தந்தையிடம் நமக்காகப் பரிந்து பேசுகிறவர் நமக்கு இருக்கிறார்[a]—நீதியுள்ளவராகிய இயேசு மெசியா[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரிந்து பேசுகிறவர்” என மொழிபெயர்க்கப்பட்ட παράκλητος என்ற கிரேக்கச் சொல், சூழலுக்கு ஏற்ப “வழக்குரைஞர்,” “உதவியாளர்,” “ஆலோசகர்,” அல்லது “ஆறுதலளிப்பவர்” என்ற விரிவான பொருள்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'மரபான மொழிபெயர்ப்பு: “இயேசு கிறிஸ்து.” Χριστός என்ற கிரேக்கப் பட்டம் “மெசியா” என்று பொருள்படலாம்; அல்லது “கிறிஸ்து” எனப் பெயரைப் போலவும் செயல்படலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: என் சிறு பிள்ளைகளே
  rationale: τεκνία என்பதிலுள்ள குடும்ப உறவையும் அன்பான சிறுமைப்பொருள் நயத்தையும் இயன்றவரை காக்கிறது; நவீன தமிழில் அன்பான மேய்ப்புப் பாங்கான விளிப்பாகவும் புரிகிறது.
- source_word: ταῦτα γράφω ὑμῖν
  choice: இவற்றை உங்களுக்கு எழுதுகிறேன்
  rationale: γράϕω என்ற நிகழ்காலத்தையும் ταῦτα என்பதன் குறிப்பிடப்படாத பன்மைச் சுட்டையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: நீங்கள் பாவம் செய்யாதிருக்க
  rationale: ἵνα உடன் வரும் நோக்கக் கூற்றைத் தெளிவாகத் தருகிறது; பாவமற்ற பரிபூரண நிலை ஏற்கெனவே அடைந்துவிட்டதாகக் கூறாமல் ஆசிரியரின் நோக்கத்தை மட்டும் தெரிவிக்கிறது.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: ஆனால் யாராவது பாவம் செய்தால்
  rationale: முந்தைய நோக்கத்துக்கும் இங்கு கருதப்படும் தவறுதலுக்கும் இடையிலான சூழல்சார் எதிர்மறைத் திருப்பை ‘ஆனால்’ காட்டுகிறது; நிபந்தனையை இயல்பான தமிழில் தருகிறது.
- source_word: παράκλητον
  choice: நமக்காகப் பரிந்து பேசுகிறவர்
  rationale: தந்தையிடம் இயேசு வகிக்கும் பிரதிநிதித்துவ மற்றும் பரிந்துரைச் செயல்பாட்டைச் சூழலுக்கேற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது; கிரேக்கச் சொல்லின் விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πρὸς τὸν πατέρα
  choice: தந்தையிடம்
  rationale: தந்தையின் முன்னிலையில் அவரை நோக்கிய அணுகலும் உறவுமாகிய πρός என்பதன் சூழல்சார் நயத்தைச் சுருக்கமாகத் தருகிறது.
- source_word: Ἰησοῦν Χριστὸν
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு இயேசுவைக் குறிக்கும் பட்டமாகப் புரிந்துகொள்ளப்பட்டு ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது; மரபான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δίκαιον
  choice: நீதியுள்ளவராகிய
  rationale: Ἰησοῦν Χριστόν உடன் இலக்கண ஒத்திசைவுள்ள δίκαιον என்ற பெயரடையைத் தமிழில் இயல்பான அடைமொழியாகத் தருகிறது; ‘நீதிமான்’ என்ற வேறு இறையியல் நயத்தைத் தேவையின்றி ஏற்றுவதில்லை.
theological_decisions:
- issue: ἵνα μὴ ἁμάρτητε என்பதில் பாவமற்ற பரிபூரணத்தைக் குறிக்கும் சாத்தியம்
  choice: 'ஆசிரியரின் நோக்கமாக மட்டும் மொழிபெயர்த்தல்: ‘நீங்கள் பாவம் செய்யாதிருக்க’'
  alternative: விசுவாசிகள் முழுமையாகப் பாவமற்றவர்களாவார்கள் என்று விளக்கிப் பெயர்த்தல்
  rationale: அடுத்த நிபந்தனைக் கூற்று பாவம் நிகழக்கூடிய சாத்தியத்தைத் தக்கவைக்கிறது. எனவே வசனத்திலுள்ள இறையியல் இழுபறியைத் தீர்த்துவிடாமல் இரு கூற்றுகளும் பாதுகாக்கப்படுகின்றன.
- issue: Χριστός என்ற சொல்லின் கிறிஸ்தியல் பயன்பாடு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு δίκαιον என்ற அடைமொழியுடன் வரும் அமைப்பு பட்டப்பெயர் நயத்தை ஆதரிக்கிறது. ஆயினும் Χριστός பெயர்போலவும் செயல்படக்கூடிய தெளிவின்மையை மரபான மாற்று வடிவத்துடன் அடிக்குறிப்பு காக்கிறது.
- issue: παράκλητος என்பதன் துல்லியமான பங்கு
  choice: நமக்காகப் பரிந்து பேசுகிறவர்
  alternative: வழக்குரைஞர் / உதவியாளர் / ஆலோசகர் / ஆறுதலளிப்பவர்
  rationale: இந்தச் சூழலில் ‘தந்தையிடம்’ என்பதால் பிரதிநிதித்துவம் மற்றும் பரிந்துரை முன்னிலைப்படுகின்றன. இருப்பினும் சட்டத் துறைக்கே பொருளைச் சுருக்காமல், சொல்லின் பரந்த பொருள் வரம்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அன்பான விளிப்பையும் கண்ணியமான திருமறைப் பாங்கையும் இணைக்கும் நடை. ‘சிறு பிள்ளைகளே’ மூலத்தின் அன்பான சிறுமைப்பொருள் நயத்தைத் தக்கவைக்கிறது. நீண்ட தொழில்நுட்பச் சொற்களை முதன்மை உரையில் தவிர்த்து, முக்கியமான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
