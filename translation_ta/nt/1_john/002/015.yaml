id: 1JN.2.15
reference: 1 John 2:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: ta
  text: உலகத்தின்மீதும் உலகத்தில் உள்ளவற்றின்மீதும் அன்பு வைக்காதீர்கள். ஒருவர் உலகத்தின்மீது அன்பு வைத்தால், தந்தையின் அன்பு[a] அவரிடம் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தந்தையின் அன்பு’ என்பது ‘தந்தையின்மேல் உள்ள அன்பு’ என்று பொருள்படலாம்; ‘தந்தை காட்டும் அன்பு’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது, ஆனால் அது இங்கு குறைவான சாத்தியம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπᾶτε
  choice: அன்பு வைக்காதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை ஒரு பொதுவான தடையையோ தொடரும் செயலை நிறுத்தும் அழைப்பையோ குறிக்கலாம். இங்கு அம்சத்தை மிகையாக விளக்காமல் இயல்பான பொதுத் தடையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κόσμον
  choice: உலகம்
  rationale: இங்கு κόσμος என்பது படைப்புலகை மட்டும் அல்லாமல், கடவுளுக்கு எதிரான மனித ஒழுங்கையும் விருப்பங்களின் வட்டத்தையும் சூழலில் குறிக்கிறது. எனினும் மூலத்தின் பரந்த பொருளையும் இறையியல் பதற்றத்தையும் காக்க ‘உலகம்’ என்ற வழக்கமான சொல் வைக்கப்பட்டுள்ளது.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: உலகத்தில் உள்ளவற்றின்மீதும்
  rationale: உலகத்திலுள்ள ஆசைக்குரியவை அல்லது பற்றுக்குரியவை அனைத்தையும் உள்ளடக்கும் வகையில், முதல் தடையுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: ἐάν τις ἀγαπᾷ
  choice: ஒருவர் ... அன்பு வைத்தால்
  rationale: τις என்பதன் வரையறுக்கப்படாத, யாரையும் உள்ளடக்கும் தன்மையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: தந்தையின் அன்பு
  rationale: τοῦ πατρός என்ற மரபுத்தொடரின் இலக்கணத் தெளிவின்மையைத் தீர்த்துவிடாமல் காக்கிறது; சூழலில் இது தந்தையின்மேல் ஒருவருக்குள்ள அன்பை அதிகமாகக் குறிக்கலாம்.
- source_word: ἐν αὐτῷ
  choice: அவரிடம் இல்லை
  rationale: கிரேக்க ஆண்பால் ஒருமை வடிவம் பொதுப்படையாகப் பயன்படுத்தப்பட்டுள்ளது. தமிழில் ‘ஒருவர் ... அவரிடம்’ என்பது ஒருமையையும் பொதுப்படையான குறிப்பையும் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: யோவானின் அறநெறிப் பயன்பாட்டில் ‘உலகம்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘உலகம்’ எனவே வைக்கப்பட்டது.
  alternative: உலக ஒழுங்கு; கடவுளுக்கு எதிரான உலக அமைப்பு
  rationale: வசனம் கடவுளின் படைப்பையோ மனிதர்களையோ நேசிக்கக்கூடாது என்று கூறாமல், கடவுளுக்கு எதிரான பற்றை எச்சரிக்கிறது. விளக்கமான விரிவாக்கம் சொல்லின் பரப்பை முன்கூட்டியே குறைத்துவிடும்.
- issue: ἡ ἀγάπη τοῦ πατρὸς என்பதில் உள்ள மரபுத்தொடரின் பொருள்
  choice: ‘தந்தையின் அன்பு’ என்று தெளிவின்மை காக்கப்பட்டது.
  alternative: தந்தையின்மேல் உள்ள அன்பு; தந்தை காட்டும் அன்பு
  rationale: உலகத்தின்மேல் வைக்கும் அன்புடன் செய்யப்படும் எதிர்மறை ஒப்பீடு, தந்தையின்மேல் உள்ள அன்பு என்ற பொருளை வலுப்படுத்துகிறது. இருப்பினும் கிரேக்க வடிவம் தந்தை காட்டும் அன்பு என்ற வாசிப்பையும் முற்றிலும் நீக்காததால், முதன்மை உரையில் அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அன்பு வை’ என்பது பொருளை இயல்பாகத் தருகிறது; ‘தந்தையின் அன்பு’ என்ற சொற்றொடர் மூலத்தின் உண்மையான இலக்கணத் தெளிவின்மையை நிலைநிறுத்துகிறது.
