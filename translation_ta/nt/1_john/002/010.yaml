id: 1JN.2.10
reference: 1 John 2:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῷ φωτὶ μένει, καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: ta
  text: தன் சகோதரனிடம் அன்புகூருகிறவர் ஒளியில் நிலைத்திருக்கிறார்; அவரில் இடறலுக்குக் காரணம் எதுவும் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் இடறுவதற்குக் காரணம் எதுவும் இல்லை.” கிரேக்கச் சொற்றொடர், இடறலுக்கான காரணம் அவருக்குள் இல்லை என்றோ, அவர் எதிர்கொள்ளும் இடறலுக்கான காரணம் இல்லை என்றோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: அன்புகூருகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையின் பொதுவான, தொடர்ச்சியான தன்மையை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: தன் சகோதரனிடம்
  rationale: மூலத்தின் ஆண்பால் ஒருமையைப் பாதுகாக்கிறது; αὐτοῦ-வின் தற்சுட்டுப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘தன்’ பயன்படுத்தப்பட்டுள்ளது. அன்பின் இலக்கைச் சுட்ட ‘-இடம்’ இயல்பானது.
- source_word: ἐν τῷ φωτὶ
  choice: ஒளியில்
  rationale: யோவானின் உருவகப் படிமத்தைச் சுருக்கமாகவும் இயல்பாகவும் அப்படியே பாதுகாக்கிறது.
- source_word: μένει
  choice: நிலைத்திருக்கிறார்
  rationale: μένω என்பதன் நீடித்திருத்தல் என்ற யோவானியச் சிறப்பை, பழமையான நடையின்றி நவீனத் தமிழில் தருகிறது.
- source_word: σκάνδαλον
  choice: இடறலுக்குக் காரணம்
  rationale: ‘இடறச் செய்யும் தடை/காரணம்’ என்ற உருவக மற்றும் ஒழுக்கப் பொருளைப் பாதுகாக்கிறது; வெறும் ‘குற்றம்’ என்று குறுக்கவில்லை.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: ஆண்பால் ஒருமைப் பிரதிப்பெயரை அன்புகூருகிறவரோடு நேரடியாக இணைக்கிறது; வேறு சாத்தியமான தொடரியல் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐκ ἔστιν
  choice: எதுவும் இல்லை
  rationale: இருப்பின்மையைத் தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் தெரிவிக்கிறது.
theological_decisions:
- issue: καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν என்ற இறுதிக் கூற்றின் பொருள்
  choice: அன்புகூருகிறவரில் இடறலுக்குக் காரணம் எதுவும் இல்லை.
  alternative: அவர் இடறுவதற்குத் தடை எதுவும் இல்லை என்பதல்ல; ‘அவர் இடறுவதற்குக் காரணம் எதுவும் இல்லை’ / ‘அவருக்கு இடறல் கல் இல்லை’ என்ற தொடர்புப் பொருளும் சாத்தியம்.
  rationale: ἐν αὐτῷ என்பதை ‘அவரில்’ என்றும், சூழல்சார் பொருளில் ‘அவருக்கு/அவரைப் பொறுத்தவரை’ என்றும் புரிந்துகொள்ள முடியும். முதன்மை உரை நேரடியான உள்ளார்ந்த ஒழுக்கப் பொருளைப் பாதுகாக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருளைத் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதும் கண்ணியமானதும். யோவானின் ‘ஒளி’ மற்றும் ‘நிலைத்திருத்தல்’ உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. ‘சகோதரன்’ என்பது மூலத்தின் ஆண்பால் ஒருமையைத் தக்கவைக்கிறது; இறுதிக் கூற்றின் உண்மையான தொடரியல் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
