source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: ta
  text: “அவரை நான் அறிந்திருக்கிறேன்”[a] என்று சொல்கிறவரும், அவருடைய கட்டளைகளைக் கடைப்பிடிக்காதவரும் பொய் சொல்பவர்; அவருக்குள் உண்மை இல்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவரை நான் அறிவேன்.” கிரேக்க நிறைவுக்கால வினை, முன்பு அறிந்துகொண்டதன் விளைவாக இப்போது நீடிக்கும் அறிவைக் காட்டக்கூடும்.'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு நெருக்கமாக: “இந்த நபருக்குள் உண்மை இல்லை.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: என்று சொல்லிக்கொண்டு … அவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல் பொதுவாக இப்படிக் கூறும் ஒருவரைக் குறிக்கிறது. தொடர்ந்தும் கட்டளைகளைக் கடைப்பிடிக்காத நிலைக்கு முரணான வாய்க்கூற்றைத் தமிழில் இயல்பாக வெளிப்படுத்த “சொல்லிக்கொண்டு” தேர்ந்தெடுக்கப்பட்டது.
- source_word: Ἔγνωκα
  choice: நான் அறிந்திருக்கிறேன்
  rationale: γινώσκω என்பதன் நிறைவுக்கால வடிவம், முன்பு அறிய வந்ததன் விளைவாக இப்போது நீடிக்கும் அறிவுறவைக் காட்டுகிறது. “அறிந்திருக்கிறேன்” அந்த நீடித்த நிலையைக் காக்கிறது; “அறிவேன்” என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: சூழலில் முன்பு குறிப்பிடப்பட்ட இறைவனைச் சுட்டும் நேரடிச் செயப்படுபொருள். இறைவனைத் தெளிவாகப் பெயரிட்டு விளக்காமல், மூலத்தின் சுட்டுப்பெயரைப் பாதுகாக்கிறது.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: அவருடைய கட்டளைகளை
  rationale: ἐντολή என்பதற்கு “கட்டளை” நேரான, யோவானின் எழுத்துகளில் பொருத்தமான இணை; உடைமைச் சுட்டும் அப்படியே காக்கப்பட்டது.
- source_word: μὴ τηρῶν
  choice: கடைப்பிடிக்காதவர்
  rationale: τηρέω என்பது இங்கு கட்டளைகளைப் பேணி அனுசரிப்பதைக் குறிக்கிறது. நிகழ்காலப் பங்கேற்புச் சொல்லின் வழக்கமான அல்லது தொடரும் செயலின்மையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ψεύστης
  choice: பொய்யர்
  rationale: இது பெயரடை அல்ல, ஒருவரை நேரடியாக வகைப்படுத்தும் பயனிலைப் பெயர்ச்சொல். “பொய்யர்” அந்தத் தார்மீகக் கூர்மையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐν τούτῳ
  choice: அவருக்குள்
  rationale: τούτῳ முன் விவரிக்கப்பட்ட நபரைச் சுட்டுகிறது. “அவருக்குள்” இயல்பான தமிழாகவும் யோவானின் அகநிலை மொழிப்பாங்கைத் தக்கவைத்தும் உள்ளது; இலக்கண ரீதியான மாற்று அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: உண்மை இல்லை
  rationale: எளிய மறுப்புக் கூற்றையும் “உண்மை” என்பதன் கருத்தியல், ஒழுக்க, ஆன்மிக விரிவையும் குறுக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: αὐτόν / αὐτοῦ என்பவற்றின் சுட்டுப்பொருள்
  choice: “அவரை / அவருடைய” என்ற சுட்டுப்பெயர்களாகவே வைக்கப்பட்டது; உடனடிச் சூழலில் இறைவனைக் குறிப்பதாகப் புரிகிறது.
  alternative: கிறிஸ்துவை இன்னும் குறிப்பாகச் சுட்டுவதாகப் புரிந்துகொள்ளுதல்.
  rationale: 1 யோவான் 2:3-இன் உடனடிச் சூழல் இறைவனைச் சுட்டுவதாக இயல்பாகத் தோன்றினாலும், இறைவனையும் மகனையும் யோவான் நெருக்கமாக இணைக்கிறார். பெயரைச் சேர்க்காமல் சுட்டுப்பெயரைப் பாதுகாப்பது இந்தத் தத்துவத் திணிவைத் தீர்த்துவிடாமல் வைக்கிறது.
- issue: யோவானின் “அறிதல்” மொழியின் வலிமை
  choice: “அறிந்திருக்கிறேன்” என்று, முன்பு அறிய வந்ததன் தொடரும் உறவுநிலையை வெளிப்படுத்துதல்.
  alternative: “அறிவேன்” என்று எளிய நிகழ்கால அறிவாக மொழிபெயர்த்தல்.
  rationale: Ἔγνωκα என்ற நிறைவுக்கால வடிவம் வெறும் தகவலறிவைக் காட்டிலும் தொடரும் அறிவுறவை உணர்த்தக்கூடும். அதேவேளை அந்த நுணுக்கத்தை அளவுக்கு மீறி விளக்காமல், மாற்றை அடிக்குறிப்பில் வைத்துள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “கடைப்பிடிக்காதவர்” என்பது கட்டளைகளைப் பேணி அனுசரித்தல் என்ற τηρέω-வின் பொருளை இயல்பாக வழங்குகிறது. “பொய்யர்” மூலத்தின் நேரடியான நெறித் தீர்ப்பைக் காக்கிறது; பாலினத்தை தேவையின்றி முன்னிறுத்தவில்லை.
