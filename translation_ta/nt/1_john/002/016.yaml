id: 1JN.2.16
reference: 1 John 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: ta
  text: ஏனெனில், உலகத்தில் உள்ள அனைத்தும்—மாம்சத்தின் ஆசை[a], கண்களின் ஆசை, வாழ்வின் ஆணவம்[b]—தந்தையிடமிருந்து வருவதல்ல; உலகத்திலிருந்து வருவது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாம்சத்தின் இச்சை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் வலுவான ஆசை, ஏக்கம் அல்லது இச்சையைக் குறிக்கலாம்; இது பாலியல் ஆசையை மட்டும் குறிப்பதல்ல. சில சூழல்களில் ‘மாம்சம்’ என்பது வீழ்ச்சியடைந்த மனித இயல்பை உருவகமாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வாழ்வின் பகட்டுப் பெருமை’ அல்லது ‘உலக வாழ்க்கையின் தம்பட்டம்’ என்றும் மொழிபெயர்க்கலாம். இந்தத் தொடர் ஒருவருடைய அந்தஸ்து, உடைமைகள், வாழ்வாதாரம் அல்லது வாழ்க்கைமுறை குறித்த ஆணவத்தை உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: உலகத்தில் உள்ள அனைத்தும்
  rationale: ஒருமை வடிவில் இருந்தாலும் கூட்டுமொத்தத்தைக் குறிக்கும் கிரேக்கத் தொடரின் விரிவையும் அமைப்பையும் காக்கிறது.
- source_word: κόσμῳ / κόσμου
  choice: உலகம் / உலகத்திலிருந்து
  rationale: கிரேக்கச் சொல்லை விளக்கவுரையாக ‘உலக அமைப்பு’ என்று குறுக்காமல், யோவானின் சூழல் தீர்மானிக்கும்படி ‘உலகம்’ என்ற பரந்த சொல்லையே வைத்திருக்கிறது.
- source_word: ἐπιθυμία
  choice: ஆசை
  rationale: வலுவான விருப்பம் அல்லது தீய வேட்கை ஆகிய இரண்டையும் சூழலுக்கேற்ப குறிக்கக்கூடிய பரந்த தமிழ்ச் சொல்; பாலியல் பொருளுக்கு மட்டும் இதைக் குறுக்கவில்லை.
- source_word: τῆς σαρκὸς
  choice: மாம்சத்தின்
  rationale: σάρξ என்பதன் உருவக மற்றும் இறையியல் அழுத்தத்தை ‘பாவ இயல்பு’ என்று முன்கூட்டியே விளக்கித் தீர்க்காமல் காக்கிறது.
- source_word: τῶν ὀφθαλμῶν
  choice: கண்களின்
  rationale: கிரேக்கப் பன்மையையும் உடைமைத் தொடர்பையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀλαζονεία τοῦ βίου
  choice: வாழ்வின் ஆணவம்
  rationale: ἀλαζονεία-வின் செருக்கான தம்பட்டம் மற்றும் போலிப் பெருமை ஆகிய நிழற்பொருள்களை ‘ஆணவம்’ தாங்குகிறது; βίος குறிக்கும் வாழ்க்கைமுறை, வாழ்வாதாரம் அல்லது உடைமைகள் ஆகிய பரப்பை ‘வாழ்வு’ திறந்தவாறு வைக்கிறது.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: தந்தையிடமிருந்து உண்டானதல்ல; உலகத்திலிருந்து உண்டானது
  rationale: ἐκ குறிக்கும் தோற்றுவாயைத் தெளிவாக்கி, தந்தைக்கும் உலகத்திற்கும் இடையிலான இணையான எதிர்மறை–நேர்மறை முரணைக் காக்கிறது.
theological_decisions:
- issue: ஒழுக்கச் சுமையுள்ள பட்டியலில் σάρξ என்பதன் பொருள்
  choice: மாம்சம்
  alternative: பாவ இயல்பு
  rationale: இங்கு ‘பாவ இயல்பு’ என்று மொழிபெயர்ப்பது குறிப்பிட்ட மனித இயல்பு விளக்கத்தை வசனத்துக்குள் கொண்டுவரும். ‘மாம்சம்’ மூல உருவகத்தையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது; சாத்தியமான உருவகப் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: κόσμος என்பதன் இறையியல் குறிப்பு
  choice: உலகம்
  alternative: கடவுளுக்கு எதிரான உலக அமைப்பு
  rationale: சூழலில் இது தந்தைக்கு எதிரான மனித ஒழுங்கைக் குறித்தாலும், விளக்கமான விரிவாக்கம் கிரேக்கச் சொல்லின் பரப்பைக் குறுக்கும்; ஆகவே மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: ἀλαζονεία τοῦ βίου என்பதன் தொடர்பு
  choice: வாழ்வின் ஆணவம்
  alternative: உடைமைகள் அல்லது வாழ்க்கை நிலையைக் குறித்த தம்பட்டம்
  rationale: βίος வாழ்க்கை, வாழ்வாதாரம், உடைமை, வாழ்க்கைமுறை ஆகியவற்றைத் தொடக்கூடும். முதன்மை உரை அவற்றில் ஒன்றை மட்டும் உறுதிசெய்யாமல், மாற்று நுணுக்கத்தை அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமத்திற்குரிய கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சம்’, ‘உலகம்’, ‘தந்தை’ போன்ற யோவானிய இறையியல் சொற்கள் விளக்கவுரையால் மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளன; நீண்ட பட்டியல் கோடுகளால் தெளிவுபடுத்தப்பட்டுள்ளது.
