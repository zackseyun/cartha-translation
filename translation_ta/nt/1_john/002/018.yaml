id: 1JN.2.18
reference: 1 John 2:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: ta
  text: பிள்ளைகளே, இது கடைசி வேளை. அந்திக்கிறிஸ்து[a] வருகிறான் என்று நீங்கள் கேள்விப்பட்டபடியே, இப்போதே அந்திக்கிறிஸ்துகள் பலர் தோன்றியிருக்கிறார்கள்[b]. இதிலிருந்து இது கடைசி வேளை என்று நாம் அறிந்துகொள்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்திக்கிறிஸ்து’ என்பதற்கு முன் கிரேக்கத்தில் குறிப்புச் சுட்டும் உருபு இல்லை. இருந்தாலும், முன்பே அறியப்பட்டு எதிர்பார்க்கப்பட்ட ஒருவரை இச்சொல் குறிக்கலாம்; தமிழில் இதைத் தனி உருபால் வேறுபடுத்த முடியாது.
    reason: alternative_reading
  - marker: b
    text: அல்லது ‘உருவாகியிருக்கிறார்கள்’ அல்லது ‘வந்திருக்கிறார்கள்.’ கிரேக்க நிறைவுநிலைக் கால வினை, அவர்கள் தோன்றி இப்போது இருக்கிறார்கள் என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: பிள்ளைகளே
  rationale: அன்பும் குடும்ப நெருக்கமும் கொண்ட அழைப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘சிறு’ என்ற பொருளைச் சேர்க்கவில்லை.
- source_word: ἐσχάτη ὥρα
  choice: கடைசி வேளை
  rationale: காலத்தைச் சுட்டும் உருவக மொழியை அப்படியே காத்து, அதைச் சரியாக அறுபது நிமிடங்களாகவோ குறிப்பிட்ட முடிவுக்காலக் கோட்பாடாகவோ குறுக்கவில்லை.
- source_word: καθὼς ἠκούσατε
  choice: நீங்கள் கேள்விப்பட்டபடியே
  rationale: வாசகர்கள் முன்பு பெற்ற போதனையோடு இப்போதைய நிலையை ஒப்பிடும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀντίχριστος
  choice: அந்திக்கிறிஸ்து
  rationale: யோவானின் எழுத்துகளில் வரும் தனித்துவமான சொல்லை ஒலிபெயர்ப்பாகக் காத்து, ‘எதிரானவன்’ அல்லது ‘பதிலாக நிற்பவன்’ என்ற ஒரே பொருளைத் திணிக்காமல் விடுகிறது.
- source_word: ἔρχεται
  choice: வருகிறான்
  rationale: எதிர்பார்க்கப்படும் வருகையைத் தெரிவிக்கும் கிரேக்க நிகழ்காலத்தின் எதிர்கால நோக்கை இயல்பான தமிழில் தருகிறது.
- source_word: καὶ νῦν
  choice: இப்போதே
  rationale: எதிர்பார்க்கப்பட்ட ஒருமைக்கும் ஏற்கெனவே நிலவும் பன்மைக்கும் இடையிலான அழுத்தமான மாறுபாட்டைக் காட்டுகிறது.
- source_word: ἀντίχριστοι πολλοὶ
  choice: அந்திக்கிறிஸ்துகள் பலர்
  rationale: ஒருமையில் வந்த அதே சொல்லுடனான சொற்பிணைப்பைக் காத்து, தற்போதுள்ள பல நபர்களைக் குறிக்கிறது.
- source_word: γεγόνασιν
  choice: தோன்றியிருக்கிறார்கள்
  rationale: அவர்கள் தோன்றி இப்போது இருக்கிறார்கள் என்ற கிரேக்க நிறைவுநிலைக் காலத்தின் தொடரும் விளைவைத் தமிழில் தெரிவிக்கிறது.
- source_word: ὅθεν γινώσκομεν
  choice: இதிலிருந்து ... நாம் அறிந்துகொள்கிறோம்
  rationale: முன் கூறப்பட்ட பல அந்திக்கிறிஸ்துகளின் தோற்றத்திலிருந்து செய்யப்படும் முடிவைத் தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: ‘கடைசி வேளை’ என்பதன் பொருள்
  choice: மூலத்தின் முடிவுக்கால முக்கியத்துவமுள்ள கால உருவகத்தை ‘கடைசி வேளை’ எனத் திறந்த நிலையில் வைத்தல்
  alternative: அதை உடனடியான ஒரு நேரப்புள்ளியாகவோ வெறும் நெருக்கடிக்கான பேச்சுவழக்காகவோ விளக்குதல்
  rationale: வசனம் தீர்மானமான இறுதிக்கட்டத்தை உணர்த்தினாலும், அதன் துல்லியமான கால அளவையோ முடிவுக்காலத் திட்டத்தையோ வரையறுக்கவில்லை.
- issue: ஒருமை ‘அந்திக்கிறிஸ்து’ மற்றும் பன்மை ‘அந்திக்கிறிஸ்துகள்’ இடையிலான தொடர்பு
  choice: எதிர்பார்க்கப்படும் ஒருமையையும் தற்போது தோன்றியுள்ள பன்மையையும் இரண்டையும் அப்படியே வைத்தல்
  alternative: ஒருமையை வெறும் பொதுவகையாக மட்டும் கொள்ளுதல் அல்லது குறிப்பிட்ட ஒரே நபர் என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாக நிர்ணயித்தல்
  rationale: யோவான் இந்த ஒருமை–பன்மை இழுபறியை நோக்கத்துடன் அருகருகே வைக்கிறார்; மொழிபெயர்ப்பு அதை ஒரு கோட்பாட்டு அமைப்புக்குள் கட்டாயமாகப் பொருத்தக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான மேய்ப்புப் பாணி காக்கப்பட்டுள்ளது. ‘பிள்ளைகளே’ குடும்ப நெருக்கத்தைத் தருகிறது. ‘அந்திக்கிறிஸ்து’ என்ற மரபான ஒலிபெயர்ப்பு, கிரேக்க ἀντί சொல்லின் பொருளை ஒரே திசையில் தீர்மானிக்காமல் பாதுகாக்கிறது. இரு அடிக்குறிப்பு குறிகளும் உரிய சொற்களுக்குப் பின்னர் முதன்மை உரையில் இடப்பட்டுள்ளன.
