source:
  edition: SBLGNT
  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: ta
  text: மகனை மறுதலிக்கிற எவரும் தந்தையையும் கொண்டிருப்பதில்லை; மகனை அறிக்கையிடுகிறவர் தந்தையையும் கொண்டிருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “மகனை அறிக்கையிடுகிறவர் தந்தையையும் கொண்டிருக்கிறார்” என்ற சொற்கள் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: மறுதலிக்கிற எவரும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை பொதுவான, அனைவரையும் உள்ளடக்கும் பொருளைக் கொண்டுள்ளது. ‘மறுதலிக்கிற எவரும்’ என்பது அதன் பொதுப்பட்ட வரம்பையும் தொடர்ச்சியான அல்லது பண்புவகைச் செயலையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἀρνούμενος
  choice: மறுதலிக்கிற
  rationale: கிறிஸ்துவைப் பற்றிய அறிக்கைச் சூழலில் ἀρνέομαι என்பது அவரை அல்லது அவருடைய அடையாளத்தை மறுப்பதைக் குறிக்கிறது. ‘மறுதலிக்கிற’ என்பது வெறும் கருத்து வேறுபாட்டை விட வலுவான இப்பொருளைக் காக்கிறது; அதேவேளை மூலத்தில் இல்லாத கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: τὸν υἱὸν
  choice: மகனை
  rationale: கிரேக்கம் ‘மகன்’ என்ற உறுதியான கிறிஸ்துவியல் பட்டத்தை மட்டுமே கொண்டுள்ளது. ‘தேவனுடைய மகன்’ என்று விரிவாக்காமல், மூலத்தின் சுருக்கத்தைக் காக்க ‘மகனை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: οὐδὲ
  choice: தந்தையையும் … இல்லை
  rationale: οὐδὲ முந்தைய மறுப்பைத் தந்தைக்கும் விரிவாக்குகிறது. தமிழில் ‘-யும் … இல்லை’ என்ற அமைப்பு ‘தந்தையையும் கொண்டிருப்பதில்லை’ என அந்த இணைந்த மறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν πατέρα ἔχει
  choice: தந்தையைக் கொண்டிருக்கிறார்
  rationale: ἔχω என்பதன் அடிப்படைப் பொருளான ‘கொண்டிரு’ தக்கவைக்கப்படுகிறது. இது உறவு அல்லது ஐக்கியத்தைக் குறிக்கலாம் என்றாலும், அதை ஒரு குறிப்பிட்ட விளக்கமாக மாற்றாமல் யோவானின் வலுவான சொல்லாட்சியே பாதுகாக்கப்படுகிறது.
- source_word: ὁ ὁμολογῶν
  choice: அறிக்கையிடுகிறவர்
  rationale: ὁμολογέω இங்கு மகனை வெளிப்படையாக ஏற்று அறிக்கையிடுவதைக் குறிக்கிறது. ‘அறிக்கையிடுகிறவர்’ என்பது வெறும் மனதளவிலான ஒப்புதலைவிட இந்த வெளிப்படையான அறிக்கைப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: καὶ
  choice: தந்தையையும்
  rationale: எதிர்மறை மற்றும் நேர்மறைக் கூற்றுகளின் சமநிலையில் καὶ என்பது ‘கூட/மேலும்’ என்ற பொருளைத் தருகிறது. தமிழின் ‘-யும்’ விகுதி, மகனை அறிக்கையிடுகிறவர் தந்தையையும் கொண்டிருக்கிறார் என்ற இணைப்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அச்சிடப்பட்ட கிரேக்க உரையில் அடைப்புக்குறியிடப்பட்ட இரண்டாம் கூற்று
  choice: ‘மகனை அறிக்கையிடுகிறவர் தந்தையையும் கொண்டிருக்கிறார்’ என்பதை முதன்மை உரையில் சேர்த்தல்
  alternative: சில கையெழுத்துப் பிரதிகளில் இல்லாததால் இரண்டாம் கூற்றை விடுதல்
  rationale: வழங்கப்பட்ட SBLGNT உரை இந்தக் கூற்றை உரையின் ஒரு பகுதியாக அச்சிட்டுள்ளது; அடைப்புக்குறிகள் உரை வேறுபாட்டைக் குறிக்கின்றன. ஆகவே அது முதன்மை உரையில் மொழிபெயர்க்கப்பட்டு, கையெழுத்துப் பிரதிகளின் வேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- issue: ‘தந்தையைக் கொண்டிருத்தல்’ என்பதன் உறவுசார் பொருள்
  choice: ‘தந்தையைக் கொண்டிருக்கிறார்’ என்ற மூல உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘தந்தையோடு ஐக்கியம் கொண்டிருக்கிறார்’ அல்லது ‘தந்தைக்கு உரியவராக இருக்கிறார்’ என்று விளக்கமாக விரித்தல்
  rationale: மகனை அறிக்கையிடுவதற்கும் தந்தையைக் கொண்டிருப்பதற்கும் இடையே பிரிக்க முடியாத தொடர்பை வசனம் வலியுறுத்துகிறது. அதை ஒரே குறிப்பிட்ட இறையியல் உறவாகத் தீர்மானிக்காமல், மூலத்தின் திட்டமிட்ட சொல்லாட்சியும் இறையியல் அழுத்தமும் காக்கப்பட்டுள்ளன.
