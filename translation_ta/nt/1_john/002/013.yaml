id: 1JN.2.13
reference: 1 John 2:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: ta
  text: தந்தையரே, தொடக்கமுதல் இருக்கிறவரை[a] நீங்கள் அறிந்திருக்கிறீர்கள் என்பதால் உங்களுக்கு எழுதுகிறேன்; இளைஞர்களே, தீயவனை நீங்கள் வென்றிருக்கிறீர்கள் என்பதால் உங்களுக்கு எழுதுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொடக்கமுதல் உள்ள ஒருவரை’ என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் பெரும்பாலும் குமாரனைக் குறிப்பதாகத் தோன்றினாலும், சிலர் இதைப் பொதுவாகக் கடவுளைக் குறிப்பதாகக் கருதுகிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: γράφω
  choice: எழுதுகிறேன்
  rationale: கடிதச் சூழலில் உள்ள நிகழ்கால வினையை இயல்பான நவீனத் தமிழில் நேரடியாகவும் உடனடித் தன்மையுடனும் வெளிப்படுத்துகிறது.
- source_word: πατέρες
  choice: தந்தையரே
  rationale: மூலத்தின் அழைப்புநிலைப் பன்மையையும் ‘தந்தையர்’ என்ற நேரடிப் பொருளையும் காக்கிறது; ‘முதியவர்கள்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: ἐγνώκατε
  choice: அறிந்திருக்கிறீர்கள்
  rationale: முன்னரே ஏற்பட்ட அறிதலும் அதன் தொடரும் விளைவும் அடங்கிய கிரேக்க நிறைவுக்காலத்தின் நுணுக்கத்தைப் பேணுகிறது.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: தொடக்கமுதல் இருக்கிறவரை
  rationale: குறிப்பிடப்படும் நபர் யார் என்பதை வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் பெயராக்கப்பட்ட சொற்றொடரையும் யோவானிய மொழிநடையையும் காக்கிறது.
- source_word: νεανίσκοι
  choice: இளைஞர்களே
  rationale: ஆண்பால் பன்மை அழைப்பை இயல்பான நவீனத் தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: νενικήκατε
  choice: வென்றிருக்கிறீர்கள்
  rationale: நிறைவேறிய வெற்றியும் அதன் தொடரும் விளைவும் அடங்கிய நிறைவுக்காலப் பொருளை இயல்பாகக் காக்கிறது.
- source_word: τὸν πονηρόν
  choice: தீயவனை
  rationale: ஆண்பால் ஒருமைச் சுட்டுடன் பெயராக்கப்பட்ட வடிவம் தனிப்பட்ட தீய எதிரியைக் குறிப்பதை வெளிப்படுத்துகிறது; ‘சாத்தான்’ என்ற பெயரை மூலத்தில் இல்லாதபடி சேர்க்கவில்லை.
theological_decisions:
- issue: ‘தொடக்கமுதல் இருக்கிறவர்’ என்பவர் யார்?
  choice: குறிப்பிடப்படும் நபரை உரையில் பெயரிட்டு விளக்காமல் மூலச் சொற்றொடரையே காத்தல்
  alternative: குமாரன்/மேசியா என்று வெளிப்படையாகக் குறிப்பிடுதல்; அல்லது பொதுவாகக் கடவுளைக் குறித்தல்
  rationale: யோவானியப் பயன்பாடு பெரும்பாலும் குமாரனைச் சுட்டினாலும், இவ்வசனம் அவரை நேரடியாகப் பெயரிடவில்லை. எனவே மூலத்திலுள்ள பொருள் நெருக்கடியும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
- issue: ‘தீயவன்’ என்பதன் பொருள்
  choice: தனிப்பட்ட தீய எதிரி
  alternative: கருத்துருவான தீமை
  rationale: சுட்டுடன் வரும் ஆண்பால் ஒருமை வடிவம் தனிப்பட்ட ஒருவரைக் குறிப்பதை வலுவாக ஆதரிக்கிறது; இருப்பினும் மூலத்தில் இல்லாத ‘சாத்தான்’ என்ற பெயர் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான கடிதநடை. மூலத்தின் இணை அமைப்பும் இறையியல் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
