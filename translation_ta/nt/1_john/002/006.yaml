id: 1JN.2.6
reference: 1 John 2:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: ta
  text: அவருக்குள் நிலைத்திருப்பதாகச் சொல்கிறவர், அவர் நடந்தபடியே தானும் நடக்கக் கடமைப்பட்டிருக்கிறார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்’ என்பது இங்கு இயேசுவைக் குறிக்கிறது. கிரேக்கத்தில் ἐκεῖνος (‘அந்த ஒருவர்’) என்ற வலியுறுத்திய சுட்டுப்பெயர் உள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘நடக்க’ என்பது ஒருவரின் வாழ்க்கை முறையையும் நடத்தையையும் குறிக்கும் வேதாகம உருவகம்; அதாவது, இயேசு வாழ்ந்தபடி வாழ வேண்டும்.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: சொல்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கப் பங்கேற்புவினையின் பொதுவான ஒருமைச் சுட்டுதலை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν αὐτῷ μένειν
  choice: அவருக்குள் நிலைத்திருப்பதாக
  rationale: μένω என்பதன் தொடர்தல், உறவில் நிலைத்திருத்தல் ஆகிய யோவானிய நுண்ணுணர்வுகளை ‘நிலைத்திரு’ காக்கிறது; infinitive, சொல்லப்படும் கூற்றின் உள்ளடக்கமாக ‘-தாக’ வடிவில் தரப்படுகிறது.
- source_word: ὀφείλει
  choice: கடமைப்பட்டிருக்கிறார்
  rationale: சட்டரீதியான கடன் என்ற பொருளைத் திணிக்காமல், இங்குள்ள அறநெறிக் கடமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καθὼς
  choice: -படியே
  rationale: முறை மற்றும் நெருங்கிய ஒப்புமையைக் குறிக்கும் ‘just as’ என்ற வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐκεῖνος
  choice: அவர்
  rationale: இங்கு இயேசுவைக் குறிக்கும் மரியாதை ஒருமைத் தமிழ்ப் பெயர்ப்பதிலி இயல்பானது. ‘அந்த ஒருவர்’ என்பது கிரேக்கச் சுட்டுவலிமையை வடிவரீதியாகக் காத்தாலும் நவீன தமிழில் செயற்கையாக ஒலிக்கும்; இதற்கான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: நடந்தார் ... நடக்க
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் வேதாகம உருவகத்தை மொழிபெயர்ப்பில் காக்கிறது; இறந்தகாலத்தையும் infinitive வடிவையும் பிரதிபலிக்கிறது.
- source_word: καὶ αὐτὸς
  choice: தானும்
  rationale: αὐτός தரும் எழுவாய் வலியுறுத்தலையும் καί தரும் சேர்க்கைப் பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
theological_decisions:
- issue: αὐτῷ மற்றும் ἐκεῖνος ஆகியவற்றின் குறிப்பு
  choice: இரண்டையும் ‘அவர்/அவருக்குள்’ என மொழிபெயர்த்து, உடனடிச் சூழலில் இயேசுவைக் குறிப்பதாகப் புரிந்துகொள்ளுதல்
  alternative: ἐκεῖνος என்பதை ‘அந்த ஒருவர்’ எனச் சுட்டுவலிமையுடன் மொழிபெயர்த்தல்
  rationale: 1 யோவான் 2-ன் சூழல் பின்பற்றப்பட வேண்டிய முன்மாதிரியாக இயேசுவைக் காட்டுகிறது. தமிழ் மரியாதை ஒருமை இயல்பாக அந்தக் குறிப்பைத் தருகிறது; கிரேக்கத்தின் வலியுறுத்தல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘நடத்தல்’ என்ற உருவகம்
  choice: ‘நடந்தபடியே ... நடக்க’ என்று உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘வாழ்ந்தபடியே ... வாழ’ என்று பொருளை நேரடியாக்குதல்
  rationale: περιπατέω புதிய ஏற்பாட்டில் ஒருவரின் வாழ்க்கை முறையைக் குறிக்கும் முக்கிய அறநெறி உருவகம். அதைத் தீர்த்து எழுதாமல் உரையிலேயே காப்பது மூலத்தின் இறையியல் மற்றும் இலக்கியத் தொடர்புகளைப் பாதுகாக்கிறது.
- issue: பொதுப்பொருளுடைய ஆண்பால் ஒருமை
  choice: ‘சொல்கிறவர் ... தானும்’ என்ற ஒருமை அமைப்பை வைத்தல்
  alternative: பன்மையாக அல்லது பாலினத்தை வெளிப்படையாகக் குறிப்பிடாத மறுவடிவில் மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தின் பிரதிநிதித்துவ ஒருமையைத் தமிழ் ‘-வர்’ இயல்பாகவும் மரியாதையுடனும் தருகிறது; அது ஆண்களுக்கு மட்டுமே பொருந்தும் என்று கட்டுப்படுத்துவதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘நிலைத்திரு’ யோவானியச் சொல் தொடர்ச்சியைப் பாதுகாக்கிறது. ‘நட’ என்ற வேதாகம உருவகம் உரையில் வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது. ‘அவர்’ இயேசுவுக்கான இயல்பான தமிழ் மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளது.
