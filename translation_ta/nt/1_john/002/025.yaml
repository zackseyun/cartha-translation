source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: ta
  text: 'மேலும், அவர் தாமே நமக்கு வாக்களித்த வாக்குறுதி இதுவே: நித்திய வாழ்வு[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நித்திய வாழ்வு.” கிரேக்கத்தில் திட்டவட்ட உருபு உள்ளது; ஆனால் தமிழில் “நித்திய வாழ்வு” என்பதே இங்கு இயல்பான நடை.
    reason: lexical_alternative
  - marker: b
    text: “அவர் தாமே” என்பது கிரேக்கத்தில் வலியுறுத்தப்பட்டுள்ளது. இங்கு அது பிதாவையா குமாரனையா குறிக்கிறது என்பதை வசனம் வெளிப்படையாக மீண்டும் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία / ἐπηγγείλατο
  choice: வாக்குறுதி / வாக்களித்த
  rationale: ஒரே சொல்வேரிலிருந்து வந்த கிரேக்கப் பெயர்ச்சொல்–வினைச்சொல் தொடர்பைத் தமிழிலும் இயன்றவரை காக்கிறது; அதேவேளையில் வாக்கியம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: αὐτός
  choice: அவர் தாமே
  rationale: கிரேக்கத்தில் உள்ள அழுத்தத்தைத் தமிழில் ‘தாமே’ இயல்பாக வெளிப்படுத்துகிறது; சுட்டப்படுபவர் யார் என்பதை மொழிபெயர்ப்பு கூடுதலாகத் தீர்மானிப்பதில்லை.
- source_word: ἡμῖν
  choice: நமக்கு
  rationale: முதல் நபர் பன்மை மறைமுகச் செயப்படுபொருளைத் தமிழில் நேராகவும் இயல்பாகவும் தருகிறது.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: யோவானின் எழுத்துகளில் முக்கியமான ζωή αἰώνιος என்ற சொற்றொடரை வழக்கமான, புரிந்துகொள்ள எளிதான தமிழில் தருகிறது. இது வாக்குறுதியின் உள்ளடக்கத்தை விளக்கும் இணைநிலைத் தொடராக உள்ளது.
- source_word: καὶ αὕτη ἐστίν
  choice: இதுதான்
  rationale: முந்தைய கருத்துடன் தொடர்ச்சியை வாக்கியச் சூழல் காட்டுவதால், தமிழில் இயல்பற்ற தொடக்க ‘மேலும்/மற்றும்’ என்பதைக் கட்டாயப்படுத்தாமல், சுட்டும் வலியுறுத்தலை ‘இதுதான்’ தெளிவாகத் தருகிறது.
theological_decisions:
- issue: αὐτός (‘அவர் தாமே’) என்பவர் பிதாவா அல்லது குமாரனா?
  choice: ‘அவர் தாமே’ என்று மட்டும் வைத்து, சுட்டப்படுபவரை வெளிப்படையாக அடையாளப்படுத்தவில்லை.
  alternative: ‘பிதா தாமே’ அல்லது ‘குமாரன் தாமே’ என்று வெளிப்படுத்துதல்.
  rationale: இந்த வசனத்தின் கிரேக்க உரை பெயரை மீண்டும் குறிப்பிடவில்லை. சூழலைப் பற்றிய விளக்கங்களில் வேறுபாடு இருப்பதால், மூலத்தில் நிலவும் தெளிவின்மையையும் இறையியல் அழுத்தத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நித்திய வாழ்வு’ என்பது திருவிவிலியச் சூழலில் பரவலாக அறியப்பட்டதுடன், ‘முடிவில்லாத வாழ்க்கை’ என்பதைக் காட்டிலும் யோவானிய கருத்தின் செறிவை நன்றாகக் காக்கிறது. ‘வாக்குறுதி / வாக்களித்த’ என்ற திட்டமிட்ட மீளுரைத்தல் மூலத்தின் சொல்வேர்த் தொடர்பைப் பிரதிபலிக்கிறது.
