  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: ta
  text: அவர்கள் நம்மிடமிருந்து வெளியேறினார்கள்; ஆனால் அவர்கள் நம்மைச் சேர்ந்தவர்கள் அல்ல. ஏனெனில், அவர்கள் நம்மைச் சேர்ந்தவர்களாக இருந்திருந்தால், நம்மோடு நிலைத்திருந்திருப்பார்கள்.[a] ஆனால் அவர்கள் எல்லாரும் நம்மைச் சேர்ந்தவர்கள் அல்ல என்பது வெளிப்படும்படி இவ்வாறு நடந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மோடு தொடர்ந்து இருந்திருப்பார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் வெளிப்படுத்தப்படும்படி” அல்லது “அவர்கள் யாரென்பது தெளிவாக்கப்படும்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: நம்மிடமிருந்து / நம்மைச் சேர்ந்தவர்கள்
  rationale: முதல் இடத்தில் சமூகத்திலிருந்து புறப்படுவதையும், பிற இடங்களில் அந்தச் சமூகத்துக்குரியவர்களாக இருப்பதையும் இச்சொற்றொடர் குறிக்கிறது. தமிழில் இயல்பாகவும் சூழலுக்கேற்றவாறும் இந்த இரு தொடர்புடைய வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ἐξῆλθαν
  choice: வெளியேறினார்கள்
  rationale: வெளியே செல்வது அல்லது புறப்படுவது என்ற வினையின் நேரடியான பொருளைத் தருகிறது; வினையிலேயே விசுவாசத் துரோகம் போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: அவர்கள் நம்மைச் சேர்ந்தவர்கள் அல்ல
  rationale: உறவு மற்றும் அடையாளத்தைச் சுட்டும் கிரேக்கச் சொற்றொடரைத் தமிழில் இயல்பாகத் தருகிறது; அவர்கள் உண்மையான விசுவாசிகளா என்பதைக் குறித்த பிற்கால இறையியல் சொல்லாட்சியைச் சேர்க்கவில்லை.
- source_word: εἰ γὰρ ἐξ ἡμῶν ἦσαν
  choice: ஏனெனில், அவர்கள் நம்மைச் சேர்ந்தவர்களாக இருந்திருந்தால்
  rationale: நிகழாத கடந்தகால நிபந்தனையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; முந்தைய வாக்கியத்தின் உறவுசார் மொழியையும் தொடர்கிறது.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: நம்மோடு நிலைத்திருந்திருப்பார்கள்
  rationale: நிகழாத நிபந்தனையின் விளைவைத் துல்லியமாகக் காட்டுவதோடு, யோவான் எழுத்துகளில் μένω என்பதற்குள்ள ‘நிலைத்திரு’ என்ற கருத்தொலியையும் காக்கிறது.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: ஆனால் … வெளிப்படும்படிக்கே இவ்வாறு நடந்தது
  rationale: கிரேக்கத்தில் உள்ள நோக்கம் அல்லது விளைவைக் குறிக்கும் இடைநிறுத்தப்பட்ட அமைப்பைத் தமிழில் முழுமையான வாக்கியமாக்குகிறது. φανερόω என்பதன் செயலப்பாட்டு கருத்தை ‘வெளிப்படும்படி’ காக்கிறது.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: அவர்கள் எல்லாரும் நம்மைச் சேர்ந்தவர்கள் அல்ல
  rationale: πάντες மீதுள்ள மறுப்பின் பரப்பை ‘எல்லாரும் … அல்ல’ என்று காத்து, மூலத்தின் பொது சமூக மொழியைத் தொடர்ந்து பயன்படுத்துகிறது.
theological_decisions:
- issue: ‘நம்மைச் சேர்ந்தவர்கள்’ என்பது காணக்கூடிய சமூக உறுப்புரிமையையா உண்மையான ஆவிக்குரிய நிலையையா குறிக்கிறது என்பதை மொழிபெயர்ப்பிலேயே தீர்மானித்தல்
  choice: ‘நம்மைச் சேர்ந்தவர்கள்’ என்ற உறவுசார் மொழியைத் தக்கவைத்தல்
  alternative: ‘அவர்கள் ஒருபோதும் உண்மையான விசுவாசிகளாக இருக்கவில்லை’ அல்லது ‘அவர்கள் உண்மையில் திருச்சபையைச் சேர்ந்தவர்கள் அல்ல’
  rationale: மூலவசனம் வெளியேறுதலுக்கும் உண்மையான சேர்ந்திருத்தலுக்கும் இடையே வேறுபாடு காட்டுகிறது; ஆனால் பிற்கால முறைப்படுத்தப்பட்ட இறையியல் பிரிவுகளைப் பயன்படுத்தவில்லை. ஆகவே மூலத்தின் இறையியல் அழுத்தமும் தெளிவுறாத எல்லையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நிலைத்திரு’ என்பது யோவானின் சொற்பயன்பாட்டை நினைவூட்டும் இலக்கியச் சொல்லாக இருந்தாலும் இன்றைய வாசகருக்குப் புரியக்கூடியது. கிரேக்கத்தின் ஒரே ἐξ ἡμῶν சொற்றொடருக்குத் தமிழ்ச் சூழலின்படி ‘நம்மிடமிருந்து’ மற்றும் ‘நம்மைச் சேர்ந்தவர்கள்’ பயன்படுத்தப்பட்டுள்ளன.
