id: 1JN.2.24
reference: 1 John 2:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: ta
  text: நீங்களோ, தொடக்கத்திலிருந்து கேட்டது உங்களுக்குள் நிலைத்திருக்கட்டும்.[a] தொடக்கத்திலிருந்து நீங்கள் கேட்டது உங்களுக்குள் நிலைத்திருந்தால்,[b] நீங்களும் மகனிலும் தந்தையிலும் நிலைத்திருப்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொடக்கத்திலிருந்து கேட்டது’ என்பது கிரேக்கத்தில் பொதுவாகச் சொல்லப்பட்டுள்ளது; இது மகனைப் பற்றிய தொடக்ககால அப்போஸ்தலச் செய்தியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நிலைத்திரு’ என்பது இவ்வசனம் முழுவதும் மீண்டும் வரும் ஒரே கிரேக்க வினையை மொழிபெயர்க்கிறது; இதை ‘தங்கியிரு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: நீங்களோ
  rationale: முன்னிலையில் வைக்கப்பட்டுள்ள வலியுறுத்தப்பட்ட பிரதிப்பெயரின் தலைப்புக் குறிக்கும் மற்றும் எதிர்மறை ஒப்பீட்டு நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: தொடக்கத்திலிருந்து கேட்டது
  rationale: ὃ என்பதைக் ‘செய்தி’ அல்லது ‘நற்செய்தி’ என்று விளக்கிச் சுருக்காமல், கிரேக்கத்தின் பொதுவான சார்புப்பெயர் அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἀπ’ ἀρχῆς
  choice: தொடக்கத்திலிருந்து
  rationale: யோவானின் எழுத்துகளில் காணப்படும் நிலையான சொல்லாட்சியையும் அதன் இறையியல் எதிரொலியையும் காக்கிறது.
- source_word: ἐν ὑμῖν μενέτω
  choice: உங்களுக்குள் நிலைத்திருக்கட்டும்
  rationale: நிகழ்கால கட்டளையின் தொடர்ச்சியான நிலைத்திருப்பை இயல்பான, கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: உங்களுக்குள் நிலைத்திருந்தால்
  rationale: ἐάν உடன் வரும் நிபந்தனையைத் தெளிவாகக் காட்டுவதோடு, μένω என்ற ஒரே வினையின் சொல்லிணைப்பையும் காக்கிறது.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: καί-இன் ‘கூட/உம்’ பொருளையும் வெளிப்படையாக உள்ள பிரதிப்பெயரின் வலியுறுத்தலையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: மகனுக்குள்ளும் தந்தைக்குள்ளும்
  rationale: இருமுறை வரும் ἐν என்பதின் இணையான உறவுசார் அமைப்பை இரு பெயர்களிலும் ‘உள்ளும்’ எனத் தக்கவைக்கிறது.
- source_word: μενεῖτε
  choice: நிலைத்திருப்பீர்கள்
  rationale: எதிர்காலக் குறிப்பு நேரடியாக மொழிபெயர்க்கப்பட்டு, வசனம் முழுவதும் மீளும் μένω வினையின் ஒருமைப்பாடு காக்கப்படுகிறது.
theological_decisions:
- issue: இறுதி உட்பிரிவிலுள்ள நிபந்தனை வாக்குறுதியின் இயல்பு
  choice: ‘நீங்களும் மகனுக்குள்ளும் தந்தைக்குள்ளும் நிலைத்திருப்பீர்கள்’ என்று எதிர்கால வினையை நேரடியாக வழங்குதல்
  alternative: இதை வெறும் அறிவுறுத்தலாகவோ, பிற்காலத் தத்துவ முறைமையிலுள்ள நிலைத்திருத்தலுக்கான நிரூபணமாகவோ விளக்குதல்
  rationale: கிரேக்கம், தொடக்கத்தில் கேட்டது அவர்களுக்குள் நிலைத்திருப்பதுடன் இணைந்த நிபந்தனை விளைவை முன்வைக்கிறது; குறிப்பிட்ட சமயப் பிரிவின் விளக்கத்தைச் சேர்க்காமல் அந்த இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
- issue: ‘தொடக்கத்திலிருந்து கேட்டது’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் பொதுவான சார்புப்பெயர் வடிவத்தைப் பேணுதல்
  alternative: ‘நற்செய்தி’ அல்லது ‘அப்போஸ்தலச் செய்தி’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: சூழல் மகனைப் பற்றிய தொடக்கப் பிரகடனத்தைச் சுட்டினாலும், மூல உரை பொருளை ὃ என்ற சார்புப்பெயரால் மட்டுமே குறிப்பிடுகிறது; எனவே முதன்மை உரை அதைவிடக் குறுக்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நிலைத்திரு’ என்ற சொல் μένω வினையின் மூன்று நிகழ்வுகளிலும் ஒரேபோலப் பயன்படுத்தப்பட்டு யோவானிய சொல்லிணைப்பு காக்கப்பட்டுள்ளது; ‘மகனுக்குள்ளும் தந்தைக்குள்ளும்’ என்பது கிரேக்கத்தின் இணையான ἐν அமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
