source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: ta
  text: நம்முடைய பாவங்களுக்கான பரிகாரப் பலி அவரே[a]; நம்முடைய பாவங்களுக்கு மட்டும் அல்ல, உலகம் முழுவதின் பாவங்களுக்கும்கூட.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோபநிவாரணப் பலி”; “பாவநிவாரணப் பலி” என்றும் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: அவரே
  rationale: αὐτός என்பதன் வலியுறுத்தும் பயன்பாட்டை இயல்பான தமிழில் காட்டுகிறது; இயேசுவின் தனிப்பட்ட பங்கை முன்னிறுத்துகிறது.
- source_word: ἱλασμός
  choice: பரிகாரம் செய்யும் பலி
  rationale: பாவத்தை நீக்குதல் மற்றும் கடவுளுடனான உறவைச் சீர்செய்தல் சார்ந்த பலியைக் குறிக்கும் சொல்லாக, தொழில்நுட்ப இறையியல் சொல்லாடலை மட்டும் சாராமல் பொதுவாசகருக்கும் புரியும்படி தருகிறது.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: நம்முடைய பாவங்களுக்காக
  rationale: ἱλασμός உடன் வரும் περί-யின் தொடர்பையும் நோக்கத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν ἡμετέρων
  choice: நம்முடைய பாவங்களுக்காக
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள ‘பாவங்கள்’ என்னும் பெயர்ச்சொல்லைத் தமிழில் தெளிவுக்காக மீண்டும் வழங்குகிறது.
- source_word: ὅλου τοῦ κόσμου
  choice: முழு உலகத்தின்
  rationale: ὅλου என்பதன் முழுமையான பரப்பைச் சுருக்காமல் காக்கிறது; எந்தக் குறிப்பிட்ட இறையியல் வரையறையையும் உட்புகுத்தவில்லை.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: மட்டுமல்ல ... -க்காகவும்
  rationale: கிரேக்கத்தின் இணைமுரண் அமைப்பை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘முழு உலகம்’ என்பதன் பரப்பு
  choice: ‘முழு உலகம்’ என்ற விரிவான சொற்றொடரை அப்படியே தக்கவைத்தல்
  alternative: ‘உலகெங்குமுள்ள சில மக்கள்’ அல்லது ‘உலகெங்குமுள்ள தேர்ந்தெடுக்கப்பட்டவர்கள்’ என்று குறுக்குதல்
  rationale: கிரேக்க உரை கூறும் பரப்பை மொழிபெயர்ப்பு குறுக்கக்கூடாது; நிலவும் இறையியல் இழுவிசையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: ἱλασμός என்பதற்கான பரிகாரச் சொல்லாட்சி
  choice: முதன்மை உரையில் ‘பரிகாரம் செய்யும் பலி’
  alternative: ‘கோபநிவாரணப் பலி’ அல்லது ‘பாவநிவாரணப் பலி’
  rationale: மூலச்சொல்லின் விவாதிக்கப்படும் அர்த்தப் பரப்பை ஒரே கோட்பாட்டுக்குள் அடைக்காமல், பலியையும் பரிகாரச் செயலையும் அணுகத்தக்க தமிழில் தெரிவிக்கிறது; முக்கிய மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகருக்குப் புரியும் தமிழ். ‘அவரே’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது. இரண்டாம் வாக்கியத்தில் ‘அந்தப் பலி’ என்று வெளிப்படையாக வழங்கியது, கிரேக்கத்தில் உள்ள விடுபட்ட கூறைத் தமிழில் தெளிவாக்குகிறது.
