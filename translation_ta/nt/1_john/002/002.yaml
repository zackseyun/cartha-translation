revisions:
- from: நம்முடைய பாவங்களுக்காகப் பரிகாரம் செய்யும் பலி அவரே[a]. நம்முடைய பாவங்களுக்காக மட்டுமல்ல, முழு உலகத்தின் பாவங்களுக்காகவும் அவரே அந்தப் பலி.
  to: நம்முடைய பாவங்களுக்கான பரிகாரப் பலி அவரே[a]; நம்முடைய பாவங்களுக்கு மட்டும் அல்ல, உலகம் முழுவதின் பாவங்களுக்கும்கூட.
  rationale: 'The revision renders the copular assertion and the intensive αὐτός naturally in Tamil, removes an unwarranted second intensive, and preserves the Greek contrast: not for our sins only, but also for those of the whole world. The lexical ambiguity of ἱλασμός remains available in the footnote without imposing a theological interpretation.'
