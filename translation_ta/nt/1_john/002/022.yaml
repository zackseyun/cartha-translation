revisions:
- from: இயேசு மெசியா அல்ல என்று மறுதலிப்பவனைத் தவிர வேறு யார் பொய்யன்? தந்தையையும் மகனையும் மறுதலிப்பவனே அந்திக்கிறிஸ்து[a][b].
  to: இயேசு மேசியா அல்ல என்று மறுதலிப்பவனைத் தவிர, பொய்யன் யார்? இவனே அந்திக்கிறிஸ்து[b]—தந்தையையும் மகனையும் மறுதலிப்பவன்.[a]
  rationale: The revision explicitly represents the demonstrative identification in οὗτός ἐστιν and retains the final participial phrase as an apposition. It also corrects the grammatical description in footnote b. “மேசியா” is adopted as the more usual modern Tamil spelling for the titular rendering, while the traditional “கிறிஸ்து” remains available in the note. Footnote anchors are placed directly after the terms they elucidate.
