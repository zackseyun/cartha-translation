id: 1JN.2.22
reference: 1 John 2:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: ta
  text: இயேசு மேசியா அல்ல என்று மறுதலிப்பவனைத் தவிர, பொய்யன் யார்? இவனே அந்திக்கிறிஸ்து[b]—தந்தையையும் மகனையும் மறுதலிப்பவன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கத்தில் ὁ χριστός என்று உள்ளது; இங்கு அது பெயராக அல்ல, பட்டமாகச் செயல்படுவதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் குறிப்பிடும் உருபுடன், சொல்லுக்கு சொல் “அந்த அந்திக்கிறிஸ்து” என்ற பொருளில் உள்ளது. யோவானின் கடிதங்களில், தந்தையையும் மகனையும் மறுதலிப்பதால் அடையாளம் காணப்படும் எதிர்ப்பாளர் வகையையும் இச்சொல் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: பொய்யன்
  rationale: ὁ என்ற குறிப்புச் சுட்டுடன் வரும் பெயர்ச்சொல், இச்சூழலில் பொய்யின் பிரதிநிதியாக அடையாளப்படுத்தப்படும் நபரைக் குறிக்கிறது; தமிழ் வினாவமைப்பில் ‘யார் பொய்யன்?’ என்பது இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: ἀρνούμενος
  choice: மறுதலிப்பவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான அல்லது குணாதிசயமான மறுப்பைத் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: இயேசு மெசியா அல்ல என்று
  rationale: ὅτι மறுதலிப்பின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. χριστός இங்கு பெயராக அல்ல, பட்டமாகச் செயல்படுவதால் அதன் யூத மெசிய எதிர்பார்ப்பு சார்ந்த பொருளைத் தெளிவாக்க ‘மெசியா’ பயன்படுத்தப்படுகிறது.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: இங்கு இது இயேசுவைப் பற்றிய பட்டமும் உரிமைக்கூற்றுமாக இருப்பதால், வெறும் பெயர்போல் ஒலிபெயர்க்காமல் அதன் பட்டப்பொருள் பாதுகாக்கப்படுகிறது.
- source_word: ἀντίχριστος
  choice: அந்திக்கிறிஸ்து
  rationale: தமிழ் கிறிஸ்தவச் சொல்வழக்கில் அறியப்பட்ட வடிவம்; கிரேக்க குறிப்புச் சுட்டின் அடையாளப்படுத்தும் வலிமை வாக்கிய அமைப்பில் பாதுகாக்கப்படுகிறது. இச்சொல் ஒரே இறுதிக்கால நபரை மட்டுமே குறிக்கிறதா அல்லது இத்தகைய எதிர்ப்பாளரின் வகையைக் குறிக்கிறதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: πατέρα
  choice: தந்தை
  rationale: ‘மகன்’ என்பதுடன் இணைந்து கடவுளாகிய தந்தையைத் தெளிவாகக் குறிக்கிறது; நவீனத் தமிழில் dignified and natural relational term.
- source_word: υἱόν
  choice: மகன்
  rationale: யோவானிய தந்தை–மகன் உறவை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: οὗτός ἐστιν
  choice: …வனே
  rationale: முன்பு விவரிக்கப்பட்ட நபரையே அடையாளப்படுத்தும் வலிமையைத் தமிழின் ஏகார வலியுறுத்தல் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கிறிஸ்தியல் அறிக்கை/மறுப்பு சூத்திரத்தில் Χριστός என்பதன் மொழியாக்கம்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு சொல் பெயர்போல் அல்ல, வாக்களிக்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாக உள்ளது. ‘மெசியா’ என்பது விவாதிக்கப்படும் உரிமைக்கூற்றை வெளிப்படுத்துகிறது; [a] மாற்று மரபுவழி வடிவத்தைக் குறிப்பிடுகிறது.
- issue: ἀντίχριστος என்பதன் குறிப்பு
  choice: அந்திக்கிறிஸ்து
  alternative: மெசியாவுக்கு எதிரானவன்
  rationale: மூலத்தின் சொல்லையும் அதன் குறிப்புத்தன்மையையும் பாதுகாக்கிறது; அதேவேளையில், இதை ஒரே குறிப்பிட்ட இறுதிக்கால நபராக மட்டும் சுருக்காமல் யோவானிய சூழலில் ஒரு வகை எதிர்ப்பாளரையும் குறிக்கக்கூடிய பதற்றத்தைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையைப் பயன்படுத்துகிறது. முதல் வாக்கியத்தின் கிரேக்க வினாவமைப்பும் இரண்டாம் வாக்கியத்தின் அடையாளப்படுத்தும் வலிமையும் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன; denominational interpretation சேர்க்கப்படவில்லை.
