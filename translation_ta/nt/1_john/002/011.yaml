id: 1JN.2.11
reference: 1 John 2:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: ta
  text: ஆனால், தன் சகோதரனை[a] வெறுக்கிறவன் இருளில் இருக்கிறான்; இருளில் நடக்கிறான்; அவன் எங்கே போகிறான் என்று அவனுக்குத் தெரியாது. ஏனெனில், இருள் அவனுடைய கண்களைக் குருடாக்கிவிட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதரனையோ சகோதரியையோ.’ கிரேக்கத்தில் ‘சகோதரன்’ என்று உள்ளது; இங்கு அது கிறிஸ்தவச் சமூகத்தைச் சேர்ந்த சக விசுவாசியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: வெறுக்கிறவன்
  rationale: நிகழ்காலப் பெயரெச்சம் ஒரு நபரைக் குறிக்கும் வகையில் பயன்படுத்தப்பட்டுள்ளது. ‘வெறுக்கிறவன்’ என்பது தொடரும் அல்லது குணநிலையான மனப்பாங்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀδελφὸν
  choice: சகோதரனை
  rationale: கிரேக்கச் சொல் ஆண்பால் ஒருமையில் இருப்பதால் அதன் வடிவம் முதன்மை உரையில் தக்கவைக்கப்படுகிறது; யோவானின் சூழலில் இது விசுவாசச் சமூகத்தைச் சேர்ந்த ஒருவரைக் குறிக்கக்கூடும் என்பதைக் காலடிக்குறிப்பு விளக்குகிறது.
- source_word: ἐν τῇ σκοτίᾳ
  choice: இருளில்
  rationale: ‘இருள்’ என்ற உருவகத்தை விளக்கவுரையாக மாற்றாமல் தக்கவைத்து, கிரேக்கத்தில் இருமுறை வரும் சொற்றொடரையும் தமிழில் இருமுறை வழங்குகிறது. தமிழில் பெயர்ச்சொல்லுக்கு தனி definite article இல்லாததால் ‘the’ தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: περιπατεῖ
  choice: நடக்கிறான்
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் வேதாகம உருவகத்தை ‘வாழ்கிறான்’ என்று வெளிப்படையாக விளக்காமல், ‘நடக்கிறான்’ எனத் தக்கவைக்கிறது.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: தான் எங்கே போகிறான் என்று அவனுக்குத் தெரியாது
  rationale: தற்போதைய இயக்கத்தைச் சுட்டும் மூலத்தின் படிமத்தை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: ἐτύφλωσεν
  choice: குருடாக்கிவிட்டது
  rationale: கடந்த செயலும் அதன் தொடரும் விளைவும் ஒருங்கே உணர்த்தப்படும் வகையில் கிரேக்க இறந்தகால வினை தமிழில் விளைவுநிலை கொண்ட வடிவில் தரப்படுகிறது.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: அவனுடைய கண்களை
  rationale: ‘கண்கள்’ என்ற மூலத்தின் தெளிவான உடல் உருவகத்தைச் சுருக்கி விளக்காமல் இயல்பான தமிழ் உடைமைத் தொடரால் வழங்குகிறது.
theological_decisions:
- issue: யோவானின் ஒளி–இருள் எதிர்மறையில் இருளின் அறநெறி மற்றும் ஆவிக்குரிய பொருள்
  choice: σκοτία என்பதை ‘இருள்’ என்று உருவகமாகவே மொழிபெயர்த்தல்
  alternative: தீமை; பாவ இருள்
  rationale: ‘இருள்’ என்ற யோவானிய உருவகம் பல அடுக்குப் பொருளையும் ஒளியுடனான எதிர்மறையையும் தக்கவைக்கிறது; அதை ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாகக் குறுக்கவில்லை.
- issue: ‘சகோதரன்’ என்பதன் குறிப்பிடம்
  choice: முதன்மை உரையில் ‘சகோதரன்’ என்று தக்கவைத்து, அதன் விரிவான குறிப்பை அடிக்குறிப்பில் விளக்குதல்
  alternative: சகோதரன் அல்லது சகோதரி; சக விசுவாசி
  rationale: மூலம் ஆண்பால் ஒருமையைப் பயன்படுத்துகிறது; அதே நேரத்தில், சூழலில் அது கிறிஸ்தவச் சமூகத்தின் சக விசுவாசியைக் குறிக்கும் பிரதிநிதிச் சொல்லாக இருக்கலாம். உரையின் வடிவமும் சாத்தியமான விரிவான குறிப்பும் இரண்டும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘இருளில்’ என்ற மறுபடியும் வரும் தொடர் மற்றும் ‘நடக்கிறான்,’ ‘கண்கள்’ ஆகிய உருவகங்கள் மூலத்தின் யோவானிய படிமங்களைப் பாதுகாக்கின்றன.
