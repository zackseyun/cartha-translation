id: 1JN.2.21
reference: 1 John 2:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: ta
  text: நான் உங்களுக்கு எழுதியது[a] நீங்கள் உண்மையை அறியாததால் அல்ல; மாறாக, நீங்கள் அதை அறிந்திருப்பதாலும், எந்தப் பொய்யும் உண்மையிலிருந்து வருவதில்லை என்பதாலும்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘எழுதினேன்’ என்ற எளிய இறந்தகால வடிவம் வருகிறது. கடிதச் சூழலை முன்னிறுத்தி, ‘எழுதியிருக்கிறேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: எழுதவில்லை … எழுதினேன்
  rationale: கிரேக்க இறந்தகால வினைச்சொல்லைத் தமிழில் இயல்பான எளிய இறந்தகாலமாக மொழிபெயர்க்கிறது. இரண்டாவது ‘எழுதினேன்’ கிரேக்கத்தில் மறைந்திருக்கும் கருத்தைத் தமிழில் தெளிவாக நிறைவு செய்கிறது.
- source_word: οἴδατε
  choice: அறிந்திருப்பது
  rationale: οἶδα குறிக்கும் நிலையான அறிவைத் தெரிவிக்கிறது; முன்வரும் ‘அறியாததால்’ என்பதுடன் உள்ள கூர்மையான முரண்பாட்டையும் காக்கிறது.
- source_word: τὴν ἀλήθειαν / τῆς ἀληθείας
  choice: உண்மை / உண்மையிலிருந்து
  rationale: இரு இடங்களிலும் ஒரே முக்கியச் சொல்லைப் பயன்படுத்தி யோவானின் பரந்த ‘உண்மை’ என்ற கருத்தைக் காக்கிறது; அதை ‘நற்செய்தி’ அல்லது ‘உண்மையான செய்தி’ என்று குறுக்கவில்லை.
- source_word: πᾶν ψεῦδος
  choice: எந்தப் பொய்யும்
  rationale: 'கிரேக்கத்தின் முழுமையான மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது: ஒரு பொய்கூட உண்மையைத் தன் மூலமாகக் கொண்டதல்ல.'
- source_word: ἐκ τῆς ἀληθείας οὐκ ἔστιν
  choice: உண்மையிலிருந்து வருவதில்லை
  rationale: ἐκ என்பதன் மூலம் அல்லது தோற்றம் என்ற பொருளை இயல்பாகக் காட்டுகிறது; பொய்க்கும் உண்மைக்கும் இடையிலான முரண்பாட்டை தேவையற்ற விரிவாக்கமின்றிக் காக்கிறது.
theological_decisions:
- issue: ‘உண்மை’ என்பதன் யோவானிய பொருள்
  choice: ‘உண்மை’ என்றே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உண்மையான செய்தி’ அல்லது ‘நற்செய்தியின் உண்மை’
  rationale: இச்சொல் இறையியல் ஆழம் உடையதாக இருக்கலாம்; ஆனால் இவ்வசனம் அதை ஒரு குறுகிய கோட்பாட்டு விளக்கமாக வரையறுக்கவில்லை.
- issue: பொய்க்கும் உண்மைக்கும் உள்ள தொடர்பு
  choice: ‘எந்தப் பொய்யும் உண்மையிலிருந்து வருவதில்லை’ என்று மூலத்தோற்றத்தின் அடிப்படையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எந்தப் பொய்யும் உண்மையைச் சேர்ந்ததல்ல’
  rationale: ἐκ முதன்மையாக மூலம் அல்லது தோற்றத்தைக் குறிக்கிறது. ஆகவே பொய் உண்மையிலிருந்து தோன்றாது என்ற பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: எழுதுவதற்கான காரணத்தை மறுத்துப் பின்னர் உறுதிப்படுத்தும் அமைப்பு
  choice: முதல் காரணம் மறுக்கப்பட்டு, உண்மையான காரணங்கள் ‘மாறாக’ என்பதன் மூலம் கொடுக்கப்பட்டன.
  alternative: ‘நான் எழுதியது நீங்கள் உண்மையை அறியாததால் அல்ல; நீங்கள் அதை அறிந்திருப்பதால்தான்’
  rationale: தேர்ந்த வடிவம் கிரேக்க வாக்கியத்தின் நேரடி எதிர்மறை அமைப்பை அதிகமாகக் காக்கிறது; அதேவேளை தமிழில் கருத்து முழுமையடைய இறுதியில் ‘எழுதினேன்’ சேர்க்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ்ச் சொற்களுடன் எளிதில் புரியும், மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘மாறாக’ எதிர்மறை-நேர்மறை முரண்பாட்டைத் தெளிவாக்குகிறது; இறுதியில் சேர்க்கப்பட்ட ‘எழுதினேன்’ கிரேக்கத்தில் சூழலால் புரிந்துகொள்ளப்படும் வினையைத் தமிழில் இயல்பாக நிறைவு செய்கிறது.
