source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: ta
  text: பிள்ளைகளே, நீங்கள் பிதாவை அறிந்திருக்கிறபடியால் உங்களுக்கு எழுதியிருக்கிறேன்.[a] தந்தையரே, தொடக்கத்திலிருந்தே இருப்பவரை நீங்கள் அறிந்திருக்கிறபடியால் உங்களுக்கு எழுதியிருக்கிறேன்.[b] இளைஞர்களே, நீங்கள் வலிமையுள்ளவர்களாக இருப்பதாலும், கடவுளுடைய வார்த்தை உங்களில் நிலைத்திருப்பதாலும்,[c] தீயவனை நீங்கள் வென்றிருப்பதாலும் உங்களுக்கு எழுதியிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனம் முழுவதிலும் ‘எழுதினேன்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க இறந்தகால வடிவம் எளிய கடந்தகாலமாக அமையலாம்; கடிதச் சூழலையும் இப்போது தொடரும் பொருத்தத்தையும் காட்ட இங்கே ‘எழுதியிருக்கிறேன்’ எனப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘தொடக்கத்திலிருந்தே இருப்பவர்’ என்பது யோவானியப் பயன்பாட்டில் முன்இருப்புடைய குமாரனைக் குறிக்க வாய்ப்புள்ளது; ஆனால் இவ்வசனம் அவரை வெளிப்படையாகப் பெயரிடவில்லை.
    reason: alternative_reading
  - marker: c
    text: ‘கடவுளுடைய வார்த்தை உங்களில் தங்கியிருக்கிறது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: எழுதியிருக்கிறேன்
  rationale: இறந்தகால வினைவடிவத்தை வெறும் ‘எழுதினேன்’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் கடிதச் சூழலில் எழுதி முடிக்கப்பட்ட செயலும் அதன் தற்போதைய பொருத்தமும் தமிழில் இயல்பாகத் தெரிய ‘எழுதியிருக்கிறேன்’ என வழங்கப்பட்டது.
- source_word: παιδία
  choice: பிள்ளைகளே
  rationale: அன்பும் குடும்ப உறவும் கொண்ட அழைப்பைச் சேர்க்கப்படாத விளக்கமின்றி இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγνώκατε
  choice: அறிந்திருக்கிறீர்கள்
  rationale: முன்பு ஏற்பட்ட அறிதலின் தொடரும் நிலையை கிரேக்க நிறைவுநிலை உணர்வுக்கு ஏற்றவாறு காட்டுகிறது; வாக்கிய அமைப்பில் ‘அறிந்திருக்கிறபடியால்’ என வருகிறது.
- source_word: τὸν πατέρα
  choice: பிதாவை
  rationale: யோவானியச் சூழலில் கடவுளைக் குறிக்கும் உறவுப்பெயராக இருப்பதால், தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் தெளிவான ‘பிதா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: πατέρες
  choice: தந்தையரே
  rationale: மூலத்தின் ஆண்பால் அழைப்பையும் பிள்ளைகள்–தந்தையர்–இளைஞர்கள் என்ற சொல்லாட்சித் தொடரையும் காக்கிறது.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: தொடக்கமுதல் இருப்பவரை
  rationale: குறிப்பிடப்படும் நபரை கிறிஸ்து அல்லது குமாரன் என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாக அடையாளப்படுத்தாமல், மூலத்தின் சுருக்கத்தையும் நிகழ்நிலை உணர்வையும் காக்கிறது.
- source_word: νεανίσκοι
  choice: இளைஞர்களே
  rationale: ஆண்பால் பன்மை அழைப்புக்கான இயல்பான நவீனத் தமிழ்; தந்தையருடனான வேறுபாட்டைக் காக்கிறது.
- source_word: ἰσχυροί
  choice: வலிமையுள்ளவர்கள்
  rationale: ஒழுக்க மற்றும் ஆன்மிகச் சூழலுக்கு ஏற்ற நேரடியான, இயல்பான இணைச்சொல்.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: கடவுளின் செய்தி பொதுவாகவா அல்லது அறிவிக்கப்பட்ட நற்செய்தி குறிப்பாகவா என்ற பரப்பைத் திறந்தவாறு வைத்திருக்கிறது.
- source_word: μένει
  choice: நிலைத்திருக்கிறது
  rationale: யோவானிய எழுத்துகளில் முக்கியமான தொடர்ந்திருத்தல் என்னும் கருத்தை நவீன, dignified தமிழில் வெளிப்படுத்துகிறது.
- source_word: νενικήκατε
  choice: வென்றிருக்கிறீர்கள்
  rationale: நிறைவேறிய வெற்றியின் தொடரும் விளைவைத் தமிழில் காட்டுகிறது; வாக்கியத்தில் ‘வென்றிருப்பதாலும்’ என வருகிறது.
- source_word: τὸν πονηρόν
  choice: தீயவனை
  rationale: கட்டுரையுடனான ஆண்பால் வடிவம் கருத்தரீதியான ‘தீமை’ என்பதைக் காட்டிலும் ஒரு தீய நபரைக் குறிக்கிறது; அவரை சாத்தான் என்று மொழிபெயர்ப்பிலேயே பெயரிடவில்லை.
theological_decisions:
- issue: ‘தொடக்கமுதல் இருப்பவர்’ என்பவரின் அடையாளம்
  choice: மூலத்தைப் போலவே ‘தொடக்கமுதல் இருப்பவர்’ என்று மறைமுகமாக வைக்கப்பட்டது.
  alternative: ‘கிறிஸ்து’ அல்லது ‘குமாரன்’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்; அல்லது பொதுவாகக் கடவுளைக் குறிப்பதாக எடுத்தல்.
  rationale: யோவானியப் பயன்பாடு முன்இருப்புடைய குமாரனை வலுவாகச் சுட்டக்கூடும்; எனினும் இவ்வசனம் அவரைப் பெயரிட்டு அடையாளப்படுத்தவில்லை. ஆகவே உண்மையான விளக்கத் திறப்பை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: மூன்று அழைப்புகளின் பாலினமும் உருவகத் தன்மையும்
  choice: παιδία என்பதை ‘பிள்ளைகளே’ என்றும், πατέρες/νεανίσκοι என்பவற்றை ‘தந்தையரே’/‘இளைஞர்களே’ என்றும் வழங்கப்பட்டது.
  alternative: மூன்றையும் சபையனைத்திற்குமான பாலினப் பொதுமைப்படுத்தப்பட்ட ஆன்மிக நிலைகளாக மொழிபெயர்த்தல்.
  rationale: மூலத்தில் முதல் சொல் பரந்த குடும்ப அழைப்பாகவும் மற்ற இரண்டும் ஆண்பால் வடிவங்களாகவும் உள்ளன. அவை வயது அல்லது ஆன்மிக முதிர்ச்சியின் உருவகங்களாக இருக்கலாம் என்றாலும், அந்த விளக்கத்தை மொழிபெயர்ப்பில் திணிக்காமல் சொல்வடிவ வேறுபாடு காக்கப்பட்டது.
- issue: ‘தீயவன்’ தனிப்பட்ட நபரா அல்லது கருத்தரீதியான தீமையா
  choice: தனிப்பட்ட நபரைக் குறிக்கும் ‘தீயவன்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தீமை’ என்று கருத்தரீதியாக மொழிபெயர்த்தல்.
  rationale: τὸν πονηρόν என்ற கட்டுரையுடனான ஆண்பால் குற்றுவினை வடிவம் இச்சூழலில் தனிப்பட்ட எதிரியையே சிறப்பாகக் குறிக்கிறது; ஆயினும் ‘சாத்தான்’ என்ற பெயர் மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பிதா’ தெய்வீக உறவுப்பெயராகவும் ‘தந்தையரே’ மனிதக் குழுவுக்கான அழைப்பாகவும் வேறுபடுத்தப்பட்டது. மூலத்தில் மூன்றுமுறை வரும் ἔγραψα என்ற மறுமொழி தமிழிலும் மூன்றுமுறை காக்கப்பட்டுள்ளது; காரணவாக்கியங்கள் தமிழின் இயல்புக்காக ‘-படியால்/ -தாலும்’ அமைப்பில் இணைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
