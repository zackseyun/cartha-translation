source:
  edition: SBLGNT
  text: Γράφω ὑμῖν, τεκνία, ὅτι ἀφέωνται ὑμῖν αἱ ἁμαρτίαι διὰ τὸ ὄνομα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: ta
  text: நான் உங்களுக்கு எழுதுகிறேன்[a], பிள்ளைகளே, ஏனெனில்[b] அவருடைய[c] பெயரின் நிமித்தம் உங்கள் பாவங்கள் மன்னிக்கப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் உங்களுக்கு எழுதுகின்றேன்.’ கிரேக்க நிகழ்காலத்தை எளிய நிகழ்காலமாகவும், கடிதம் எழுதிக்கொண்டிருக்கும் செயலைக் குறிக்கும் நிகழ்காலமாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் பாவங்கள் மன்னிக்கப்பட்டுள்ளன என்று.’ இச்சொல் எழுதுவதற்கான காரணத்தைக் காட்டுவதாக இருக்கலாம்; எழுதப்படும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாகவும் வாசிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘அவருடைய’ என்பது சூழலின்படி தேவனையோ இயேசுவையோ குறிப்பதாகப் புரிந்துகொள்ளப்படலாம்; கிரேக்க உரை இங்கே அதை வெளிப்படையாக அடையாளப்படுத்தவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: நான் உங்களுக்கு எழுதுகிறேன்
  rationale: கிரேக்க நிகழ்கால வினைச்சொல் கடிதம் எழுதும் தற்போதைய செயலை இயல்பான தமிழில் தெரிவிக்கிறது; இதை எளிய நிகழ்காலப் பொருளிலும் புரிந்துகொள்ள முடியும்.
- source_word: τεκνία
  choice: பிள்ளைகளே
  rationale: இது அன்பும் குடும்ப நெருக்கமும் கொண்ட அழைப்புச் சொல். ‘சிறு பிள்ளைகளே’ என்பது வயதைத் தேவையின்றி வலியுறுத்தக்கூடும்; ‘பிள்ளைகளே’ என்பது தமிழில் அன்பான அழைப்பாக இயல்பாக உள்ளது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள உரையோட்டத்தில் யோவான் எழுதுவதற்கான காரணத்தை இது அறிமுகப்படுத்துவதாகத் தெரிகிறது. எனினும், எழுதும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் ‘என்று’ என்ற வாசிப்பும் இலக்கணரீதியாக சாத்தியம்.
- source_word: ἀφέωνται
  choice: மன்னிக்கப்பட்டுள்ளன
  rationale: முற்றுப்பெற்ற மன்னிப்பும் அதன் தொடரும் விளைவும் ஆகிய இரண்டையும் கிரேக்க முற்றுநிகழ்காலச் செயப்பாட்டு வடிவத்துக்கு ஏற்ப தெரிவிக்கிறது.
- source_word: αἱ ἁμαρτίαι
  choice: உங்கள் பாவங்கள்
  rationale: ὑμῖν என்ற வேற்றுமை வடிவத்துடன் வரும் மன்னிப்பு மொழிநடையில் பாவங்கள் வாசகர்களுக்குரியவை என்பது தெளிவாகிறது; தமிழில் உடைமைச்சொல்லைப் பயன்படுத்துவது இயல்பானது.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: அவருடைய பெயரின் நிமித்தம்
  rationale: διά + குற்றுவேற்றுமை இங்கு காரணம் அல்லது அடிப்படையைச் சுட்டுகிறது. ‘பெயர்’ என்பதன் தனிநபர் மற்றும் வேதாகம முக்கியத்துவத்தைத் தக்கவைத்து, வெறும் புகழ் என்ற பொருளாகக் குறுக்காமல் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: ‘அவருடைய பெயர்’ என்பதில் ‘அவர்’ யாரைக் குறிக்கிறார்?
  choice: முதன்மை உரையில் ‘அவருடைய’ என்றே அடையாளத்தை வெளிப்படையாகக் குறிப்பிடாமல் வைக்கப்பட்டது.
  alternative: தேவன் அல்லது இயேசு கிறிஸ்து என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: இந்த வசனம் மட்டும் அந்தப் பிரதிப்பெயரின் குறியீட்டை வெளிப்படையாகக் கூறவில்லை. பரந்த சூழலைக் கொண்டு இருவிதமாகப் புரிந்துகொள்ளப்படுவதால், மூலத்தின் தெளிவின்மையும் இறையியல் இழுவிசையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பெயரின் நிமித்தம்’ என்ற சொற்றொடர் சற்றே வேதாகமத் தொனியுடையதாயினும் இயல்பாகப் புரியக்கூடியது; மூலத்தில் உள்ள ‘பெயர்’ என்ற கருத்தின் செறிவைப் பாதுகாக்கிறது. ‘பிள்ளைகளே’ என்பது வயதைக் காட்டுவதற்குப் பதிலாக அன்பான குடும்ப அழைப்பின் தொனியைத் தருகிறது.
