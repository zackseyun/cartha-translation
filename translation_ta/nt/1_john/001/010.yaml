source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: ta
  text: நாம் பாவம் செய்ததில்லை[a] என்று சொன்னால், அவரைப் பொய்யர் என்று கூறுகிறோம்; அவருடைய வார்த்தை[b] நமக்குள் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாம் பாவம் செய்யவில்லை.’ கிரேக்கத்தில் perfect கால வினை பயன்படுத்தப்பட்டுள்ளது; அது கடந்த செயலை அதன் தற்போதைய தொடர்புடன் முன்வைக்கிறது. ‘ஒருபோதும் பாவம் செய்ததே இல்லை’ என்பது மூலத்தில் உள்ளதைவிட அதிக வலியுறுத்தலாகும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவருடைய செய்தி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க λόγος என்பதற்கு ‘வார்த்தை’ அல்லது ‘செய்தி’ என்ற இரு பொருள்களும் வரலாம்; யோவானிய சொற்பயன்பாட்டைப் பாதுகாக்க ‘வார்த்தை’ தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: நாம் … என்று சொன்னால்
  rationale: ἐὰν உடன் வரும் subjunctive வினை நிபந்தனையைக் காட்டுகிறது. ‘சொன்னால்’ என்பது ‘உரிமைகோரினால்’ போன்ற கூடுதல் விளக்கத்தைச் சேர்க்காமல் இதை இயல்பான தமிழில் தருகிறது.
- source_word: οὐχ ἡμαρτήκαμεν
  choice: நாம் பாவம் செய்ததில்லை
  rationale: ἡμαρτήκαμεν என்பது perfect கால வினை. கடந்தகாலப் பாவத்தை மறுப்பதோடு அதன் தற்போதைய தொடர்பையும் சுட்டும் வகையில் ‘செய்ததில்லை’ தேர்ந்தெடுக்கப்பட்டது; ‘ஒருபோதும் பாவம் செய்ததே இல்லை’ என்று கிரேக்கத்தில் வெளிப்படையாக இல்லாத வலியுறுத்தல் சேர்க்கப்படவில்லை.
- source_word: ψεύστην
  choice: பொய்யர்
  rationale: ψεύστης என்பது ‘பொய் சொல்பவர்’ என்ற பெயர்ச்சொல். அதன் நேரடியான, தனிப்பட்ட குற்றச்சாட்டை மென்மைப்படுத்தாமல் ‘பொய்யர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ποιοῦμεν αὐτὸν
  choice: அவரைப் பொய்யராக்குகிறோம்
  rationale: Predicate accusative உடன் வரும் ποιέω இங்கு ஒருவரை அப்படிப்பட்டவராக ஆக்குவது அல்லது அறிவிப்பது என்ற பொருளில் உள்ளது. தமிழில் இச்சொற்றொடர் அதன் கூர்மையான வலிமையைத் தக்கவைக்கிறது.
- source_word: ὁ λόγος αὐτοῦ
  choice: அவருடைய வார்த்தை
  rationale: λόγος என்பதற்கு ‘வார்த்தை’, ‘செய்தி’, ‘போதனை’ ஆகிய பொருள்கள் இருக்கலாம். யோவானிய சொற்பயன்பாட்டையும் பரந்த பொருள் எதிரொலியையும் காக்க ‘வார்த்தை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: நமக்குள் இல்லை
  rationale: உள்ளார்ந்த தொடர்பைக் காட்டும் கிரேக்கச் சொல்லமைப்பு நேரடியாகப் பாதுகாக்கப்படுகிறது. ‘நமக்குள் தங்கியிருக்கவில்லை’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத உருவகத்தைச் சேர்க்கும்.
theological_decisions:
- issue: αὐτόν / αὐτοῦ என்பவற்றின் குறிப்பு
  choice: சூழலில் இவை கடவுளைக் குறிக்கின்றன; இருப்பினும் மூலத்தைப் போல பிரதிப்பெயர் தக்கவைக்கப்படுகிறது.
  alternative: முதன்மை உரையில் ‘கடவுளைப் பொய்யராக்குகிறோம்; கடவுளுடைய வார்த்தை’ என்று குறிப்பை வெளிப்படையாக்குதல்.
  rationale: 1 யோவான் 1:5–10 சூழலில் மறுக்கப்படுவது கடவுளின் சாட்சியே. ஆனால் கிரேக்கம் இங்கு பெயரை மீண்டும் சொல்லாமல் பிரதிப்பெயரைப் பயன்படுத்துவதால், மொழிபெயர்ப்பும் ‘அவர்/அவருடைய’ என்று வைத்து சூழல்சார் குறிப்பையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பொய்யராக்குகிறோம்’ என்ற நேரடியான சொல்லாட்சி மூலத்தின் கடுமையைத் தக்கவைக்கிறது; ‘நமக்குள்’ என்பது யோவானிய உள்ளார்ந்த மொழிநடையைப் பாதுகாக்கிறது.
