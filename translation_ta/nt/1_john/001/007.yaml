source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: ta
  text: ஆனால், அவரே ஒளியில் இருப்பதுபோல நாமும் ஒளியில் நடந்தால், ஒருவரோடொருவர் ஐக்கியம் கொண்டிருக்கிறோம்[a]; அவருடைய மகனாகிய இயேசுவின் இரத்தம் ஒவ்வொரு பாவத்திலிருந்தும்[b] நம்மைத் தூய்மைப்படுத்துகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருவருடன் ஒருவர்.’ ‘ஒருவரோடொருவர்’ என்பது விசுவாசிகளுக்கும் தேவனுக்கும் இடையிலான ஐக்கியத்தைக் குறிக்கிறது என்று சிலர் புரிந்துகொள்கிறார்கள். எனினும், பரஸ்பரப் பொருளுடைய கிரேக்கச் சொல், விசுவாசிகள் தங்களுக்குள் கொண்டிருக்கும் ஐக்கியத்தையே மிக இயல்பாகக் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘எல்லாப் பாவத்திலிருந்தும்.’ கிரேக்கச் சொற்றொடரைப் பகிர்வுப் பொருளில் ‘ஒவ்வொரு பாவத்திலிருந்தும்’ என்றும், கூட்டுப் பொருளில் ‘எல்லாப் பாவத்திலிருந்தும்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: ஆனால் ... நடந்தால்
  rationale: δέ முந்தைய வசனத்தில் கூறப்பட்ட இருளில் நடப்பதற்கு மாறான நிலையை அறிமுகப்படுத்துவதால், அதன் எதிர்மறைத் தொடர்பை இயல்பான தமிழில் ‘ஆனால்’ எனக் காட்டுகிறது; ἐὰν என்பதன் நிபந்தனை ‘நடந்தால்’ என்பதில் வெளிப்படுகிறது.
- source_word: ἐν τῷ φωτὶ
  choice: ஒளியில்
  rationale: யோவானின் உருவகத்தையும் உடனடியான சூழலில் ‘ஒளி’ பெற்றுள்ள கருத்துச் செறிவையும் விளக்கிச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: περιπατῶμεν
  choice: நாமும் ... நடந்தால்
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் மூலமொழியின் ‘நடத்தல்’ உருவகத்தை அப்படியே காக்கிறது. ஒப்பீட்டின் இயல்புக்காக தமிழில் ‘நாமும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: அவரே ஒளியில் இருப்பதுபோல
  rationale: αὐτός என்பதிலுள்ள மென்மையான வலியுறுத்தலை ‘அவரே’ பிரதிபலிக்கிறது; ὡς என்பதைக் ‘இருப்பதுபோல’ என மொழிபெயர்த்து, மூலத்தில் இருப்பதைவிடத் துல்லியமான சமத்துவத்தைத் திணிக்கவில்லை.
- source_word: κοινωνίαν ἔχομεν
  choice: ஐக்கியம் கொண்டிருக்கிறோம்
  rationale: κοινωνία குறிக்கும் பகிரப்பட்ட பங்கேற்பையும் உறவையும் இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; குறிப்பிட்ட சடங்கு சார்ந்த பொருளைச் சேர்க்கவில்லை.
- source_word: μετ’ ἀλλήλων
  choice: ஒருவரோடொருவர்
  rationale: பரஸ்பரத் தன்மையைக் காட்டும் ἀλλήλων என்பதற்கான இயல்பான தமிழ் இணை.
- source_word: τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ
  choice: அவருடைய மகனாகிய இயேசுவின் இரத்தம்
  rationale: ‘இரத்தம்’ என்பதைக் கூறுபொருளாக வைத்துக்கொண்டு, இயேசுவுக்கும் தேவனுக்கும் இடையிலான மகன் உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: καθαρίζει
  choice: தூய்மைப்படுத்துகிறது
  rationale: ஒழுக்க மற்றும் வழிபாட்டுத் தூய்மை ஆகிய இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது. நிகழ்கால வினை வடிவம் தொடரும் அல்லது வழக்கமான செயலை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: ஒவ்வொரு பாவத்திலிருந்தும்
  rationale: πάσης உடன் வரும் ஒருமை ἁμαρτίας என்பதன் பகிர்வுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; கூட்டு வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: μετ’ ἀλλήλων என்பதன் தொடர்பாளர்கள்
  choice: விசுவாசிகள் ஒருவரோடொருவர் கொண்டிருக்கும் பரஸ்பர ஐக்கியம்
  alternative: விசுவாசிகளுக்கும் தேவனுக்கும் இடையிலான ஐக்கியம்
  rationale: ἀλλήλων என்பது இயல்பாகப் பரஸ்பர மனித உறவைக் குறிக்கிறது. பரந்த சூழல் தேவனோடுள்ள ஐக்கியத்தையும் உள்ளடக்கினாலும், இந்தச் சொற்றொடரின் நேரடியான பரஸ்பரப் பொருள் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது; மாற்றுப் புரிதல் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- issue: καθαρίζει என்ற நிகழ்காலத்தின் வினைநோக்கு
  choice: தொடரும் அல்லது இயல்பாக நிகழும் தூய்மைப்படுத்தலை எளிய நிகழ்காலத்தில் கூறுதல்
  alternative: ஒருமுறை நிகழும் தூய்மைப்படுத்தல் அல்லது ‘தொடர்ந்து தூய்மைப்படுத்திக்கொண்டே இருக்கிறது’ என்ற வெளிப்படையான விரிவாக்கம்
  rationale: கிரேக்க நிகழ்காலம் இங்கு தொடரும் அல்லது இயல்பான செயலைச் சுட்டலாம். ‘தூய்மைப்படுத்துகிறது’ அதை இயல்பாகத் தெரிவிக்கிறது; ஆனால் மூலத்தை மீறி வினைநோக்கை மிகத் தெளிவாக நிர்ணயிப்பதில்லை.
- issue: ἀπὸ πάσης ἁμαρτίας என்பதன் பகிர்வு அல்லது கூட்டு பொருள்
  choice: ஒவ்வொரு பாவத்திலிருந்தும்
  alternative: எல்லாப் பாவத்திலிருந்தும் / பாவம் அனைத்திலிருந்தும்
  rationale: πάσης உடன் ஒருமையில் வரும் ἁμαρτίας பகிர்வாகவும் கூட்டாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை பகிர்வுப் பொருளைத் தருகிறது; மற்ற சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஒளியில் நடத்தல்’ என்ற யோவானிய உருவகம் விளக்கமாக மாற்றப்படாமல் காக்கப்பட்டுள்ளது. அடிக்குறி [a] ‘ஒருவரோடொருவர்’ என்பதற்குப் பின்னும், [b] ‘ஒவ்வொரு பாவத்திலிருந்தும்’ என்பதற்குப் பின்னும் பொருத்தமாக வைக்கப்பட்டுள்ளன.
