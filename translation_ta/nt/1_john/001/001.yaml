id: 1JN.1.1
reference: 1 John 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: ta
  text: ஆரம்பமுதல் இருந்ததையும்[a], நாங்கள் கேட்டதையும், எங்கள் கண்களால் கண்டதையும், நாங்கள் உற்றுப் பார்த்ததையும், எங்கள் கைகள் தொட்டதையும்—வாழ்வின் வார்த்தையைப்[b] பற்றி—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆரம்பமுதல் இருந்த ஒன்றையும்.’ கிரேக்கத்தில் நடுநிலை உறவுப்பெயர் உள்ளது. ஆகவே இது ‘அவர்’ என்று குமாரனை மட்டும் நேரடியாகக் குறிப்பிடாமல், அவரைக் குறித்த அப்போஸ்தலர் சாட்சியின் முழுமையையும் பரந்த வகையில் சுட்டக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: ‘வாழ்வின் வார்த்தை’ என்பது குமாரனைத் தனிப்பட்ட முறையில் குறிக்கக்கூடும்; இது யோவான் 1:1-ஐ நினைவூட்டுகிறது. அல்லது அவரைப் பற்றிய, வாழ்வை அளிக்கும் செய்தியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: இருந்ததையும் / கேட்டதையும் / கண்டதையும் / பார்த்ததையும் / தொட்டதையும்
  rationale: மீண்டும் மீண்டும் வரும் கிரேக்க நடுநிலை உறவுப்பெயரைத் தமிழில் ‘-தையும்’ என்ற நடுநிலைத் தொடர்களால் வெளிப்படுத்துகிறது. இது நேரடியாக ‘அவர்’ என்று தனிப்பட்ட ஆளைக் குறிப்பிடாமல், அப்போஸ்தலர் சாட்சியளிக்கும் முழு உண்மையையும் உள்ளடக்குகிறது.
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: ஆரம்பமுதல் இருந்தது
  rationale: இறந்தகாலத் தொடர்நிலையையும் யோவானிய ‘ஆரம்பம்’ மொழிநடையையும் எளிமையாகப் பாதுகாக்கிறது; தேவையற்ற விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ἀκηκόαμεν
  choice: நாங்கள் கேட்டது
  rationale: தமிழில் இயல்பான இறந்தகால வடிவம், கடந்த நிகழ்வை அடிப்படையாகக் கொண்ட நிலையான சாட்சியைச் சூழலின் மூலம் தெரிவிக்கிறது.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: எங்கள் கண்களால் கண்டது
  rationale: நேரில் கண்ட சாட்சியின் வலியுறுத்தலைப் பாதுகாக்க ‘எங்கள் கண்களால்’ என்பது வெளிப்படையாகத் தக்கவைக்கப்படுகிறது.
- source_word: ἐθεασάμεθα
  choice: உற்றுப் பார்த்தது
  rationale: வெறுமனே காண்பதைவிட கவனத்துடன் நோக்கியதைக் குறிக்கிறது; அதேவேளை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: எங்கள் கைகள் தொட்டது
  rationale: உடல்சார்ந்த, நேரடி அனுபவத்தைத் தெளிவாகப் பாதுகாக்கிறது. ‘தடவிப் பார்த்தது’ என்பதைக் காட்டிலும் ‘தொட்டது’ பொதுவானதும் அளவுக்கு மீறிய செயற்பாட்டைச் சுட்டாததும் ஆகும்.
- source_word: περὶ
  choice: பற்றிய
  rationale: அப்போஸ்தலர் சாட்சியின் பொருளை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் இணைப்பு.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: வாழ்வின் வார்த்தை
  rationale: λόγος என்பதன் ‘வார்த்தை/செய்தி’ பரப்பையும் யோவான் 1:1 உடனான சாத்தியமான தனிப்பட்ட எதிரொலியையும் முற்றிலும் ஒன்றாகத் தீர்மானிக்காமல் வைத்திருக்கிறது.
theological_decisions:
- issue: நடுநிலை உறவுப்பெயர்த் தொடர்களும் λόγος என்பதன் குறிபொருளும்
  choice: தொடக்கத்தை நடுநிலை ‘-தையும்’ வடிவங்களில் மொழிபெயர்த்து, τοῦ λόγου τῆς ζωῆς என்பதை ‘வாழ்வின் வார்த்தை’ என வழங்குதல்.
  alternative: ‘ஆரம்பமுதல் இருந்தவர்’ என்று தனிப்பட்ட ஆளாக வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது ‘வாழ்வளிக்கும் செய்தி’ என்று செய்தியை மட்டும் முன்னிறுத்துதல்.
  rationale: கிறிஸ்துவை மையமாகக் கொண்ட சூழல் தெளிவாக இருந்தாலும், கிரேக்கம் நடுநிலை உறவுப்பெயர்களைப் பயன்படுத்துகிறது. மேலும் λόγος என்பது குமாரனையும் அவரைப் பற்றிய அறிவிப்பையும் எதிரொலிக்கக்கூடும். ஆகவே மூலத்தில் உள்ள இறையியல் செறிவும் பதற்றமும் தீர்த்துவிடப்படாமல் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலவசனத்தின் தொடர்ச்சியான சாட்சித் தொடர்களும், அடுத்த வசனத்திற்குச் செல்லும் முடிவுறாத முன்னுரைப் பாங்கும் நீண்ட கோடுகளால் பாதுகாக்கப்பட்டுள்ளன. தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால் ‘Word’ என்ற தனிப்பெயராக்கச் சாத்தியம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
