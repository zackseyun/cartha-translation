revisions:
- from: ஆரம்பமுதல் இருந்ததையும்[a], நாங்கள் கேட்டதையும், எங்கள் கண்களால் கண்டதையும், நாங்கள் உற்றுப் பார்த்ததையும், எங்கள் கைகள் தொட்டதையும்—வாழ்வின் வார்த்தையைப்[b] பற்றியதையே—
  to: ஆரம்பமுதல் இருந்ததையும்[a], நாங்கள் கேட்டதையும், எங்கள் கண்களால் கண்டதையும், நாங்கள் உற்றுப் பார்த்ததையும், எங்கள் கைகள் தொட்டதையும்—வாழ்வின் வார்த்தையைப்[b] பற்றி—
