  yaml_path: translation/nt/1_john/001/004.yaml
  text: And we are writing these things so that our joy may be complete[a].
translation:
  language: ta
  text: மேலும், எங்களுடைய மகிழ்ச்சி முழுமையடையும்படி, இவற்றை நாங்கள் எழுதுகிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘எங்களுடைய மகிழ்ச்சி’ என்பதற்குப் பதிலாக ‘உங்கள் மகிழ்ச்சி’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: முந்தைய கருத்துடன் உள்ள தொடர்ச்சியைத் தமிழின் இயல்பான வாக்கிய ஓட்டமும் சூழலும் வெளிப்படுத்துகின்றன; தொடக்கத்தில் ‘மேலும்’ சேர்ப்பது இங்கு தேவையற்றதாகத் தோன்றும்.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: நடுநிலைப் பன்மைச் சுட்டுப்பெயரின் பன்மையையும், எழுதப்படும் கருத்துகளைக் குறிக்கும் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: γράφομεν
  choice: எழுதுகிறோம்
  rationale: நிகழ்கால வினைச்சொல்லை, கடிதம் எழுதும் தற்போதைய செயலைக் குறிக்கும் இயல்பான தமிழ் நிகழ்காலமாக வழங்குகிறது.
- source_word: ἡμεῖς
  choice: நாங்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடம்பெறும் முதல்நபர் பன்மைப் பெயர்ச்சொல்லைத் தக்கவைத்து, எழுத்தாளர்களை வலியுறுத்துகிறது.
- source_word: ἵνα
  choice: நிறைவடையும்படி
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவு என்ற இரு நிழல்களையும் இயல்பாக வெளிப்படுத்தும் தமிழ் அமைப்பு.
- source_word: χαρά
  choice: மகிழ்ச்சி
  rationale: யோவானியப் பயன்பாட்டில் ‘joy’ என்பதற்கான இயல்பான, கண்ணியமான நவீனத் தமிழ் இணை.
- source_word: ἡμῶν
  choice: நமது
  rationale: SBLGNT மூலப்பாடத்திலுள்ள முதல்நபர் பன்மை உடைமைப்பெயரை நேரடியாக மொழிபெயர்க்கிறது; ‘நமது’ என்பது வாசகரையும் சேர்த்துக்கொள்ளும் வகையில் புரிந்துகொள்ளப்படக்கூடியதாயினும், இங்கு சூழலில் ‘எங்களுடைய’ என்ற எழுத்தாளர் சார்ந்த பொருளைக் கொண்டுள்ளது.
- source_word: ᾖ πεπληρωμένη
  choice: நிறைவடையும்படி
  rationale: நிறைவு பெற்ற நிலையில் இருப்பதைச் சுட்டும் சுற்றுவழி வினையமைப்பைச் சுருக்கமான, இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἡ χαρὰ ἡμῶν என்பதிலுள்ள உடைமைப்பெயரின் பாடம்
  choice: நமது மகிழ்ச்சி
  alternative: உங்கள் மகிழ்ச்சி
  rationale: வழங்கப்பட்ட SBLGNT கிரேக்கப் பாடம் ἡμῶν (‘நமது/எங்களுடைய’) என்று வாசிக்கிறது. கையெழுத்துப் பிரதிகளில் காணப்படும் ‘உங்கள்’ என்ற குறிப்பிடத்தக்க மாற்றுப் பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கடித நடையைப் பயன்படுத்துகிறது. கிரேக்கச் சொல்வரிசையை அப்படியே பின்பற்றாமல், நோக்கத்தைக் குறிக்கும் துணைவாக்கியத்தை முன்வைத்து இயல்பான தமிழ் ஓட்டம் பெறப்பட்டுள்ளது.
