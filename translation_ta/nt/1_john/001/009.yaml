  to: நம் பாவங்களை நாம் ஒப்புக்கொண்டால், அவர் நம் பாவங்களை மன்னிக்கவும், எல்லா அநீதியிலிருந்தும் நம்மைத் தூய்மைப்படுத்தவும் உண்மையுள்ளவராகவும் நீதியுள்ளவராகவும்[a] இருக்கிறார்.
