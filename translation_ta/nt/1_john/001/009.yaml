id: 1JN.1.9
reference: 1 John 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: ta
  text: நம் பாவங்களை நாம் ஒப்புக்கொண்டால், அவர் நம் பாவங்களை மன்னிக்கவும், எல்லா அநீதியிலிருந்தும் நம்மைத் தூய்மைப்படுத்தவும் உண்மையுள்ளவராகவும் நீதியுள்ளவராகவும்[a] இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயமானவராகவும்.”
    reason: δίκαιος என்பதற்கு ‘நீதியுள்ளவர்’ என்பதுடன் ‘நியாயமானவர்’ என்பதும் சாத்தியமான பொருள்; இவ்வசனத்தில் இரண்டையும் உறுதியாகப் பிரித்தறிய முடியாததால் மாற்று சொல் வழங்கப்படுகிறது.
lexical_decisions:
- source_word: ἐὰν
  choice: -ஆல் (அறிக்கையிட்டால்)
  rationale: மூன்றாம் வகை நிபந்தனையின் நிபந்தனைத் தன்மையை இயல்பான தமிழில் காக்கிறது; ‘எப்போதெல்லாம்’ என்று தொடர்ச்சியை மிகைப்படுத்தவில்லை.
- source_word: ὁμολογῶμεν
  choice: நாம் அறிக்கையிட்டால்
  rationale: பாவங்களை வெளிப்படையாக ஒப்புக்கொள்வதைக் குறிக்கும் நிலைபெற்ற, கண்ணியமான வேதாகமத் தமிழ்; வெறும் மனதளவிலான ஏற்றுக்கொள்ளுதலைவிட வலுவானது.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: நம் பாவங்களை
  rationale: உடைமைப் பொருளையும் பன்மை வடிவையும் இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: πιστός
  choice: உண்மையுள்ளவர்
  rationale: கடவுளின் நம்பகத்தன்மையையும் தமது தன்மைக்கும் வாக்குக்கும் உண்மையாக இருப்பதையும் உள்ளடக்குகிறது.
- source_word: δίκαιος
  choice: நீதியுள்ளவர்
  rationale: ஒழுக்க நேர்மையையும் நீதிசார்ந்த சரியான தன்மையையும் அகலமாகக் காக்கிறது; குறுகிய நீதிமன்றப் பொருளுக்கு மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: ἵνα
  choice: மன்னிக்கவும் … தூய்மைப்படுத்தவும்
  rationale: ἵνα உடன் வரும் இரு இணை வினைகளையும் தமிழின் நோக்கம்/விளைவை உணர்த்தும் இயல்பான infinitive அமைப்பில் தருகிறது; நோக்கம் மற்றும் கருதப்பட்ட விளைவு இடையேயான நுட்பத்தை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: ἀφῇ
  choice: மன்னிக்க
  rationale: பாவச் சூழலில் ἀφίημι என்பதன் தெளிவான, வழக்கமான பொருள்.
- source_word: ἡμῖν τὰς ἁμαρτίας
  choice: நம் பாவங்களை மன்னிக்க
  rationale: தமிழில் ‘நமக்கு நம் பாவங்களை மன்னிக்க’ என்பது தேவையற்ற மீளுரையாக இருப்பதால், பயனாளிப் பொருள் இயல்பாக உள்ளடங்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: καθαρίσῃ
  choice: தூய்மைப்படுத்த
  rationale: மாசு அகற்றப்படும் உருவகத்தையும் ஒழுக்கத் தூய்மையையும் தெளிவாகக் காக்கிறது.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: எல்லா அநீதியிலிருந்தும்
  rationale: πάσης என்பதன் முழுமையையும் ἀδικία என்பதன் அகன்ற ஒழுக்க-இறையியல் பொருளையும் காக்கிறது.
theological_decisions:
- issue: கடவுளின் மன்னிப்புடன் தொடர்புடைய δίκαιος என்பதன் மொழிபெயர்ப்பு
  choice: நீதியுள்ளவர்
  alternative: நியாயமானவர்
  rationale: இவ்வசனம் மன்னிப்பையும் தூய்மைப்படுத்துதலையும் கடவுளின் குணத்துடன் இணைக்கிறது. ‘நீதியுள்ளவர்’ என்பது ஒழுக்க நேர்மையையும் நீதி நிறைவேற்றும் தன்மையையும் உள்ளடக்குகிறது; ‘நியாயமானவர்’ என்பதும் சாத்தியமான வாசிப்பு என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அறிக்கையிடுதல்,’ ‘பாவம்,’ ‘அநீதி,’ ‘தூய்மைப்படுத்துதல்’ ஆகியவை இச்சூழலின் ஒழுக்க மற்றும் இறையியல் தீவிரத்தை இயல்பாகக் காக்கின்றன. அடிக்குறிப்பு குறி அது விளக்கும் ‘நீதியுள்ளவர்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
