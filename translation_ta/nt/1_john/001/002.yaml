source:
  edition: SBLGNT
  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: ta
  text: வாழ்வு வெளிப்படுத்தப்பட்டது[a]; நாங்கள் அதைக் கண்டிருக்கிறோம், சாட்சி அளிக்கிறோம், பிதாவுடன் இருந்ததும் எங்களுக்கு வெளிப்படுத்தப்பட்டதுமான அந்த நித்திய வாழ்வை[b] உங்களுக்கு அறிவிக்கிறோம்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “தோன்றியது”; “வெளிப்படையாக்கப்பட்டது” (ἐφανερώθη).'
    reason: lexical_alternative
  - marker: b
    text: “நித்திய வாழ்வு” என்பது இலக்கணத்தில் ஒரு பொருளைக் குறிக்கும் பெயர்ச்சொல் தொடராக இருந்தாலும், இச்சூழலில் பிதாவுடன் இருந்து எங்களுக்கு வெளிப்படுத்தப்பட்ட குமாரனைத் தனிப்பட்ட முறையில் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: அந்த வாழ்வு / அந்த ... வாழ்வை
  rationale: கிரேக்க வரையறைச் சுட்டின் திட்டவட்டத்தையும், வெறும் கருத்தாக அல்லாமல் குமாரனோடு தொடர்புடைய குறிப்பிட்ட வாழ்வைக் குறிக்கும் சூழலையும் காக்கிறது.
- source_word: ἐφανερώθη
  choice: வெளிப்படுத்தப்பட்டது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும், முன்பு மறைந்திருந்த ஒன்று அறியத்தக்கதாக வெளிப்பட்டது என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἑωράκαμεν
  choice: நாங்கள் அதைக் கண்டிருக்கிறோம்
  rationale: நிறைவுற்ற நேரடி சாட்சிய அனுபவத்தின் தொடரும் முக்கியத்துவத்தை கிரேக்க நிறைவுக் காலத்திற்கு ஏற்றவாறு காக்கிறது.
- source_word: μαρτυροῦμεν
  choice: சாட்சி அளித்து
  rationale: நேரில் கண்டவர்களின் சான்றளிக்கும் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ἀπαγγέλλομεν
  choice: அறிவிக்கிறோம்
  rationale: சாட்சியளித்தல் என்பதிலிருந்து வேறுபட்ட அறிவித்தல்/தெரிவித்தல் பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: அந்த நித்திய வாழ்வை
  rationale: கிரேக்கத்தின் திட்டவட்டமான தொடரை இயல்பாகத் தருவதுடன், குறிப்பிட்ட தனிப்பட்ட மெய்ம்மையாக உள்ள வாழ்வைச் சுட்டுகிறது.
- source_word: ἥτις
  choice: '... இருந்ததும் ... வெளிப்படுத்தப்பட்டதுமான'
  rationale: இதன் இலக்கண முன்னிலைச் சொல் ‘வாழ்வு’ என்பதால், வெளிப்படையாக ‘அவர்’ என்று மாற்றாமல் தொடர்புப் பெயரெச்சத் தொடரால் கிரேக்கத்தின் வடிவத்தையும் தனிப்பட்ட சுட்டின் மறைபொருளையும் காக்கிறது.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: பிதாவுடன் இருந்ததும்
  rationale: உறவுசார் அண்மையை இயல்பாகக் கூறி, யோவானிய மொழிநடையிலுள்ள முற்பட்ட இருப்பின் குறிப்பை விரிவுரையின்றிக் காக்கிறது.
- source_word: ὑμῖν / ἡμῖν
  choice: உங்களுக்கு / எங்களுக்கு
  rationale: இரு மறைமுகச் செயப்படுபொருள்களையும் வெளிப்படையாகத் தருவதால் அப்போஸ்தல சாட்சியின் திசை தெளிவாகிறது.
theological_decisions:
- issue: ‘வாழ்வு’ என்பதை ஆளற்ற கருத்தாகவா, நேரடியாக ஒருவராகவா மொழிபெயர்ப்பது
  choice: அந்த வாழ்வு / அந்த நித்திய வாழ்வு
  alternative: அவர் / குமாரன்
  rationale: சூழலில் இது குமாரனைத் தனிப்பட்ட முறையில் குறித்தாலும், கிரேக்கம் ‘வாழ்வு’ என்ற பெயர்ச்சொல்லையே பயன்படுத்துகிறது. அதைத் தக்கவைத்தல் யோவானின் இறையியல் செறிவையும் உண்மையான மொழியியல் இழுப்பையும் பாதுகாக்கிறது.
- issue: πρὸς τὸν πατέρα என்பதில் முற்பட்ட இருப்பை எவ்வளவு வெளிப்படையாக்குவது
  choice: பிதாவுடன் இருந்தது
  alternative: பிதாவின் முன்னிலையில் இருந்தது
  rationale: பிதாவுடனான உறவையும் முற்பட்ட இருப்பையும் நேரடியாகக் காக்கிறது; விளக்கச் சொற்களால் கோட்பாட்டை விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமும் வாசிப்பின் இயல்பும் பேணப்பட்டுள்ளன. ‘ஜீவன்’ என்பதற்குப் பதிலாக பொதுமக்களுக்கு இயல்பான ‘வாழ்வு’ பயன்படுத்தப்பட்டது; divine title ஆக ‘பிதா’ தக்கவைக்கப்பட்டது. கிரேக்கத்தின் தொடர்ச்சியான ‘நாங்கள் கண்டிருக்கிறோம்—சாட்சி அளிக்கிறோம்—அறிவிக்கிறோம்’ என்ற சாட்சிய இயக்கம் தமிழ் வாக்கிய அமைப்பில் தெளிவாக்கப்பட்டுள்ளது.
