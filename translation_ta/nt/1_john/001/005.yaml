source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: ta
  text: 'நாங்கள் அவரிடமிருந்து கேட்டதும் உங்களுக்கு அறிவிப்பதுமான செய்தி இதுதான்: கடவுள் ஒளியாய் இருக்கிறார்; அவரில் இருள் எதுவுமே இல்லை.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: செய்தி
  rationale: பெறப்பட்டு பிறருக்கு அறிவிக்கப்படும் உள்ளடக்கத்தை இயல்பான நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἀκηκόαμεν
  choice: நாங்கள் ... கேட்டதும்
  rationale: கிரேக்க நிறைவுக்காலத்தின் முன்பு கேட்டதன் தற்போதைய தொடர்பை, தொடரும் வாக்கிய அமைப்புக்குள் இயல்பாகத் தருகிறது.
- source_word: ἀπ’ αὐτοῦ
  choice: அவரிடமிருந்து
  rationale: மூலத்தில் உள்ள ஆண்பால் பிரதிப்பெயரை அப்படியே வைத்திருந்து, அதன் முன்னிலையை விளக்கிப் பெயரிடுவதால் ஏற்படும் மேலதிக விளக்கத்தைத் தவிர்க்கிறது.
- source_word: ἀναγγέλλομεν
  choice: அறிவிக்கிறதுமான
  rationale: பெற்ற செய்தியை இப்போது வாசகர்களுக்குத் தெரிவிக்கும் நிகழ்காலச் செயலைக் காட்டுகிறது; ‘பிரகடனம் செய்கிறோம்’ என்பதைக் காட்டிலும் பொதுவான வாசகருக்கு இயல்பாக உள்ளது.
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: கடவுள் ஒளியாய் இருக்கிறார்
  rationale: ‘ஒளி’ என்ற உருவகத்தை விளக்கச் சொற்கள் சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது; குறிப்பிட்ட ஓர் ஒளியை அடையாளப்படுத்தும் பொருளையும் உருவாக்காது.
- source_word: σκοτία
  choice: இருள்
  rationale: யோவானின் மொழியில் உள்ள நேரடியான மற்றும் அறநெறி சார்ந்த உருவக ஒலிப்புகள் இரண்டையும் தக்கவைக்கிறது.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: இடவியல் மற்றும் உருவகத் திறப்பைச் சுருக்காமல் மூலத்தின் கூறை இயல்பாகத் தருகிறது.
- source_word: οὐδεμία
  choice: எதுவுமே இல்லை
  rationale: இருள் சிறிதளவும் இல்லை என்ற வலியுறுத்தப்பட்ட முழுமையான மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘கடவுள் ஒளி’ என்ற உருவகப் பயனிலை
  choice: கடவுள் ஒளியாய் இருக்கிறார்
  alternative: கடவுள் பரிசுத்தமான ஒளியாய் இருக்கிறார்
  rationale: ‘பரிசுத்தமான’ அல்லது ‘தூய’ போன்ற விளக்கச் சொற்களைச் சேர்க்காமல், மூலத்தின் செறிவான உருவகத்தையும் அதன் பரந்த இறையியல் பொருள் வாய்ப்பையும் பாதுகாக்கிறது.
- issue: ἀπ’ αὐτοῦ என்பதன் சுட்டுப்பொருள்
  choice: அவரிடமிருந்து
  alternative: இயேசுவிடமிருந்து
  rationale: சூழல் சுட்டுப்பொருளை உணர்த்தினாலும், மூலத்தில் பெயருக்குப் பதிலாகப் பிரதிப்பெயரே உள்ளது; மொழிபெயர்ப்பு அதைத் தீர்மானித்து விரிவாக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையைப் பயன்படுத்துகிறது. ‘நாங்கள்’ என்பது செய்தியைப் பெற்றுத் தெரிவிக்கும் குழுவையும் ‘உங்களுக்கு’ என்பது வாசகர்களையும் இயல்பாக வேறுபடுத்துகிறது. அடிக்குறிப்பு குறியீடு அது சார்ந்த ‘அறிவிக்கிறதுமான’ என்பதற்குப் பின்பே வைக்கப்பட்டுள்ளது.
