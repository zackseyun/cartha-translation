id: 1JN.1.3
reference: 1 John 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: ta
  text: நாங்கள் கண்டதையும் கேட்டதையும், நீங்களும் எங்களோடு ஐக்கியம்[a] கொள்ளும்படியாக, உங்களுக்கும் அறிவிக்கிறோம்; உண்மையில், எங்களுடைய ஐக்கியம் பிதாவோடும் அவருடைய மகனாகிய இயேசு மெசியாவோடும்[b] உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஐக்கியம்’ என்பதை ‘பகிர்வு,’ ‘ஒன்றிப்பு,’ அல்லது ‘பங்கேற்பு’ என்றும் மொழிபெயர்க்கலாம்; இங்கு அது பகிர்ந்த வாழ்வையும் உறவையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இயேசு கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க Χριστός என்பது ‘கிறிஸ்து’ என ஒலிபெயர்க்கப்படலாம் அல்லது அதன் பட்டப்பொருளை வெளிப்படுத்தும் வகையில் ‘மெசியா’ என மொழிபெயர்க்கப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: கண்டதையும் கேட்டதையும்
  rationale: ὃ என்பது முன்சூழலில் வெளிப்படுத்தப்பட்ட ‘வாழ்வை’ விரிவாகச் சுட்டுகிறது. தமிழில் தனியே ‘எதை’ என்று கூறுவதைவிட, இணை வினைச்சொற்களுடன் ‘கண்டதையும் கேட்டதையும்’ என்பது இயல்பாகவும் பொருளை நபராக மட்டும் குறுக்காமல் இருப்பதாகவும் உள்ளது.
- source_word: ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: நாங்கள் கண்டதையும் கேட்டதையும்
  rationale: இரு கிரேக்க வினைகளும் நிறைவுக்கால வடிவில் இருந்து சாட்சிகளின் கடந்த அனுபவத்தையும் அதன் தொடரும் முக்கியத்துவத்தையும் காட்டுகின்றன. தமிழ் சூழலில் இந்த இணை அமைப்பு அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: உங்களுக்கும் அறிவிக்கிறோம்
  rationale: ἀπαγγέλλομεν என்பது கண்டும் கேட்டும் அறிந்ததை அறிவித்தல் அல்லது அறிக்கையிடுதல். ‘அறிவிக்கிறோம்’ என்பது தற்போதைய, கண்ணியமான தமிழில் பொருத்தமானது; ‘உங்களுக்கும்’ என்பது καὶ-யின் சேர்த்தல் வலியுறுத்தலைக் காக்கிறது.
- source_word: ἵνα καὶ ὑμεῖς ... ἔχητε
  choice: இதனால் நீங்களும் ... கொண்டிருப்பீர்கள்
  rationale: ἵνα நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை அறிமுகப்படுத்துகிறது. ‘இதனால்’ இரண்டையும் கடுமையாகப் பிரிக்காமல் இயல்பாகத் தாங்குகிறது; ‘நீங்களும்’ καὶ ὑμεῖς என்பதன் வலியுறுத்தலைக் காக்கிறது.
- source_word: κοινωνία
  choice: ஐக்கியம்
  rationale: κοινωνία என்பது வெறும் நட்பு அல்லது சமூகச் சேர்க்கை அல்ல; பகிர்வு, பங்கேற்பு, உறவு ஆகிய பரிமாணங்களைக் கொண்டது. ‘ஐக்கியம்’ இச்சூழலில் விசுவாசிகளுக்கும் இறைவனுக்கும் இடையிலான பகிர்ந்த உறவைச் சுருக்காமல் தாங்குகிறது.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: உண்மையில், எங்களுடைய ஐக்கியம்
  rationale: καὶ ... δὲ இங்கு விளக்கத்தையும் வலியுறுத்தலையும் சேர்க்கிறது. ‘உண்மையில்’ அந்த வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μετὰ τοῦ πατρὸς
  choice: பிதாவோடும்
  rationale: யோவானியச் சூழலில் πατήρ கடவுளைக் குறிக்கும் உறவுப்பெயராக உள்ளது. ‘பிதா’ தமிழ் வேதாகம நடையில் அறியப்பட்டும் கண்ணியமானதாகவும் உள்ளது.
- source_word: μετὰ τοῦ υἱοῦ αὐτοῦ
  choice: அவருடைய மகனாகிய ... ஓடும்
  rationale: உடைமை மற்றும் பிதா–மகன் உறவு இரண்டையும் தெளிவாகக் காக்கிறது; μετὰ என்பதன் உறவுசார் ‘உடன்’ பொருள் இணைப்பு விகுதியால் வெளிப்படுகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகப் புரிந்துகொள்ளப்படுவதால் அதன் அபிஷேகம் செய்யப்பட்ட அரசர் என்ற பொருளைத் தாங்கும் ‘மெசியா’ பயன்படுத்தப்பட்டது; பாரம்பரிய ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: κοινωνία என்பதன் உறவு மற்றும் பங்கேற்பு சார்ந்த பரப்பு
  choice: ஐக்கியம்
  alternative: பகிர்வு; ஒன்றிப்பு; பங்கேற்பு
  rationale: இந்த வசனம் அப்போஸ்தலச் சாட்சிகளுடனான உறவையும் பிதா மற்றும் மகனுடனான உறவையும் ஒரே சொல்லால் இணைக்கிறது. ‘ஐக்கியம்’ அந்த இறையியல் அழுத்தத்தை வெறும் சமூகத் தொடர்பாகவோ சடங்குசார் கருத்தாகவோ குறுக்காமல் பாதுகாக்கிறது.
- issue: Χριστοῦ என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Ἰησοῦ Χριστοῦ என்பதில் Χριστός பட்டத்தின் பொருளைத் தக்கவைக்க ‘மெசியா’ பயன்படுத்தப்படுகிறது. தமிழ் மரபில் நிலைபெற்ற மாற்று வடிவமான ‘கிறிஸ்து’ அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: ἵνα-வின் நோக்கம்/விளைவு நுணுக்கம்
  choice: இதனால் ... கொண்டிருப்பீர்கள்
  alternative: நீங்கள் ... கொண்டிருக்கும்படியாக
  rationale: ἵνα பொதுவாக நோக்கத்தைக் குறித்தாலும் இங்கு அறிவிப்பின் எதிர்பார்க்கப்படும் விளைவையும் உணர்த்த முடியும். ‘இதனால்’ அந்த இரு நுணுக்கங்களையும் முற்றாக ஒன்றுக்குள் அடைக்காமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அறிவிக்கிறோம்,’ ‘ஐக்கியம்,’ ‘பிதா,’ ‘மெசியா’ ஆகியவை வேதாகமத் தன்மையைத் தக்கவைத்தாலும் தேவையற்ற தொன்மை நடையைத் தவிர்க்கின்றன. கிரேக்கத்தின் நீண்ட ஒரே வாக்கியம் தமிழின் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; தர்க்கத் தொடர்பு ‘இதனால்’ மற்றும் ‘உண்மையில்’ மூலம் காக்கப்பட்டுள்ளது.
