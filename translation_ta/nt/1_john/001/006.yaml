reference: 1 John 1:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: ta
  text: நாம் அவரோடு உறவு கொண்டிருக்கிறோம் என்று சொல்லி, இருளில்[a] நடந்தால், நாம் பொய் சொல்கிறோம்; உண்மையைக் கடைப்பிடிப்பதில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்த இருளில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘இருள்’ என்பதற்கு வரையறைச் சுட்டு உள்ளது; யோவானின் பயன்பாட்டில் இது கடவுளுக்கு எதிரான ஒழுக்க-ஆவிக்குரிய நிலையை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, ‘உண்மையைச் செய்வதில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: நாம் ... என்று சொல்லிக்கொண்டே ... நடந்தால்
  rationale: நிபந்தனைத் தன்மையை இயல்பான தமிழில் காக்கிறது. ‘உரிமை கோரினால்’ போன்ற கூடுதல் விளக்கப் பொருளைச் சேர்க்காமல், சொல்வதற்கும் வாழ்வதற்கும் இடையிலான முரண்பாட்டை ‘சொல்லிக்கொண்டே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κοινωνίαν ἔχομεν
  choice: உறவு கொண்டிருக்கிறோம்
  rationale: κοινωνία என்பதன் பங்கேற்பும் நெருங்கிய உறவும் சார்ந்த பொருளை, தற்கால வாசகர்களுக்குப் புரியும் இயல்பான தமிழில் தருகிறது. ‘ஐக்கியம்’ என்பதும் சாத்தியம்; ஆனால் அது சில வாசகர்களுக்கு சமயக் கலைச்சொல்லாகத் தோன்றலாம்.
- source_word: μετ’ αὐτοῦ
  choice: அவரோடு
  rationale: உடனிருப்பு அல்லது தொடர்பைக் குறிக்கும் μετά + genitive அமைப்பை நேரடியாகக் காட்டுகிறது; சூழலில் சுட்டப்படுபவர் கடவுள் என்றாலும், மூலத்திலுள்ள பதிலிப்பெயர் விரிவாக்கப்படவில்லை.
- source_word: ἐν τῷ σκότει
  choice: இருளில்
  rationale: யோவானின் எழுத்துகளில் உள்ள ஒழுக்க-ஆவிக்குரிய உருவகத்தைத் தக்கவைக்கிறது. கிரேக்க வரையறைச் சுட்டின் நுணுக்கம் தமிழில் இயல்பாகத் தெரியாததால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: περιπατῶμεν
  choice: நடந்தால்
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் மூல உருவகமான ‘நடத்தல்’ என்பதை விளக்கவுரையாக மாற்றாமல் காக்கிறது; நிபந்தனை வாக்கியத்துக்கேற்ற தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ψευδόμεθα
  choice: நாம் பொய் சொல்கிறோம்
  rationale: நிகழ்கால வினையின் நேரடியான வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: உண்மையைக் கடைப்பிடிப்பதில்லை
  rationale: சொல்லால் மட்டும் அல்லாமல் செயலிலும் உண்மைக்கு ஏற்ப வாழ்வதைச் சுட்டும் யோவானிய மொழிநடையை இயல்பான தமிழில் தருகிறது. மூலத்தின் சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இருள் என்ற ஒழுக்க-ஆவிக்குரிய உருவகம்
  choice: ‘இருளில் நடத்தல்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘பாவத்தில் வாழ்தல்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: யோவானின் பயன்பாட்டில் இருள் என்பது தீமை, பொய், கடவுளிடமிருந்து அந்நியப்படுதல் ஆகிய பல தொடர்புகளை உள்ளடக்கும் செறிவான உருவகம். அதை ஒரே கோட்பாட்டு விளக்கமாகச் சுருக்காமல் மூலத்தின் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. ‘உறவு’ என்பது ‘ஐக்கியம்’ என்ற சமயக் கலைச்சொல்லைவிடப் பொதுவாகப் புரியும் சொல்; ‘நடத்தல்,’ ‘இருள்’ ஆகிய வேதாகம உருவகங்கள் மட்டும் நோக்கத்துடன் தக்கவைக்கப்பட்டுள்ளன.
