- from: நாம் அவரோடு உறவு கொண்டிருக்கிறோம் என்று சொல்லிக்கொண்டே இருளில்[a] நடந்தால், நாம் பொய் சொல்கிறோம்; உண்மையைக் கடைப்பிடிப்பதில்லை[b].
  to: நாம் அவரோடு உறவு கொண்டிருக்கிறோம் என்று சொல்லி, இருளில்[a] நடந்தால், நாம் பொய் சொல்கிறோம்; உண்மையைக் கடைப்பிடிப்பதில்லை[b].
  rationale: சொல்லிக்கொண்டே என்பதற்குப் பதிலாக சொல்லி பயன்படுத்தப்பட்டுள்ளது; இதனால் மூலத்தின் ‘சொன்னால் ... நடந்தால்’ என்ற நிபந்தனைத் தொடர்பு கூடுதல் தொடர்ச்சிப் பொருளின்றி காக்கப்படுகிறது. முதல் அடிக்குறிப்பும் மூலத்தின் உருவகத்தை விளக்குவதில் நடுநிலையாகத் திருத்தப்பட்டுள்ளது.
