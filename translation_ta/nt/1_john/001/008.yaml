id: 1JN.1.8
reference: 1 John 1:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: ta
  text: நமக்குப் பாவம் இல்லை[a] என்று நாம் சொன்னால், நம்மையே ஏமாற்றிக்கொள்கிறோம்; உண்மை நமக்குள் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சற்று விளக்கமாக, ‘பாவத்தன்மை’; கிரேக்க மூலத்தில் சொல்லுக்குச் சொல் ‘பாவம்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: என்று நாம் சொன்னால்
  rationale: ἐὰν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் நிபந்தனையை அறிமுகப்படுத்துகிறது; நவீன தமிழில் ‘சொன்னால்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: நமக்குப் பாவம் இல்லை
  rationale: ἁμαρτίαν என்பது கட்டுரையில்லாத ஒருமை; தனிப்பட்ட ஒரு பாவச்செயலை அல்லாமல் பாவம் நம்மிடம் இருப்பதையே குறிக்கிறது. தமிழில் ‘நமக்குப் பாவம் இல்லை’ என்பது மூலத்தின் உடைமை சார்ந்த சொல்லமைப்பைப் பொருளுடன் தருகிறது.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: நம்மையே ஏமாற்றிக்கொள்கிறோம்
  rationale: தற்சுட்டுப் பெயர்ச்சொல்லுடன் πλανάω இங்கு தன்னையே தவறாக நம்பச் செய்வதைக் குறிக்கிறது; ‘நம்மையே’ என்பதிலுள்ள வலியுறுத்தல் ἑαυτούς என்பதைக் காக்கிறது.
- source_word: ἡ ἀλήθεια
  choice: உண்மை
  rationale: யோவானின் பயன்பாட்டில் இது மெய்மை, உண்மைத்தன்மை, கடவுளால் வெளிப்படுத்தப்பட்ட உண்மை ஆகிய ஒலிநயங்களை ஏந்தக்கூடும்; ‘உண்மை’ அவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்துவதில்லை.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: நமக்குள் இல்லை
  rationale: ἐν ἡμῖν என்பதன் உள்ளார்ந்த, தனிப்பட்ட பரிமாணத்தை இயல்பான தமிழில் ‘நமக்குள்’ பாதுகாக்கிறது.
theological_decisions:
- issue: ‘நமக்குப் பாவம் இல்லை’ என்பதில் ‘பாவம்’ குறிக்கும் பொருள்
  choice: ஒரு தனிப்பட்ட பாவச்செயலை அல்லாமல், ஒருவரிடம் பாவம் இருப்பதைச் சுட்டும் ஒருமை வடிவமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நாம் பாவம் செய்யவில்லை’ அல்லது ‘நம்மிடம் பாவத்தன்மை இல்லை’
  rationale: மூலத்தில் ἁμαρτίαν ἔχομεν (‘பாவத்தைக் கொண்டிருக்கிறோம்’) என்று உள்ளது; பாவம் செய்ததை மறுப்பதைக் கூறும் 1 யோவான் 1:10-இன் சொல்லாட்சியிலிருந்து இது வேறுபடுகிறது. ‘பாவத்தன்மை’ என்பது சாத்தியமான விளக்கமாக இருந்தாலும் மூலத்தைவிட விளக்கவுரை அதிகம்.
- issue: ‘உண்மை நமக்குள் இல்லை’ என்பதன் யோவானிய நுட்பம்
  choice: ‘கடவுளின் உண்மை’ அல்லது ‘உண்மைத்தன்மை’ என்று விரிவாக்காமல் சுருக்கமான மூலச் சொல்லாட்சி பாதுகாக்கப்பட்டது.
  alternative: ‘நாம் உண்மையில் வாழவில்லை’
  rationale: இந்தச் சொற்றொடர் வெளிப்படுத்தப்பட்ட தெய்வீக உண்மையையும் ஒருவரின் உள்ளார்ந்த உண்மைத்தன்மையையும் ஒருங்கே எதிரொலிக்கலாம்; விரிவாக்குவது மூலத்தில் நிலவும் பொருள் நெருக்கடியைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘நமக்குப் பாவம் இல்லை’ மற்றும் ‘உண்மை நமக்குள் இல்லை’ ஆகிய சுருக்கமான இணை அமைப்பு மூலத்தின் வலிமையையும் இறையியல் நுட்பத்தையும் காக்கிறது.
