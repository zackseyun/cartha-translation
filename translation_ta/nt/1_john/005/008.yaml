  text: τὸ πνεῦμα καὶ τὸ ὕδωρ καὶ τὸ αἷμα, καὶ οἱ τρεῖς εἰς τὸ ἕν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/008.yaml
  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: ta
  text: ஆவியும், தண்ணீரும், இரத்தமும்; இம்மூன்றும் ஒருமித்திருக்கின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்கு சொல் நெருக்கமாக, “இம்மூன்றும் ஒன்றை நோக்கி இருக்கின்றன” என்றும் மொழிபெயர்க்கலாம். இங்குக் கிரேக்கச் சொற்றொடர், இம்மூன்றின் சாட்சி ஒருமித்திருக்கிறது என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ஆவி
  rationale: உடனடியான சூழலில் இது தூய ஆவியைக் குறிப்பதாக மிக இயல்பாக உள்ளது. இருப்பினும், கிரேக்கச் சொல்லில் உள்ளதைவிட விளக்கத்தை அதிகரிக்காமல் ‘ஆவி’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால் சூழலே குறிப்பைத் தெளிவாக்குகிறது.
- source_word: τὸ ὕδωρ
  choice: தண்ணீர்
  rationale: கிரேக்கத்தின் உறுதியான, உருவகத்தை விளக்காமல் விடும் பெயர்ச்சொல் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: τὸ αἷμα
  choice: இரத்தம்
  rationale: கிரேக்கத்தின் நேரடியான பெயர்ச்சொல் பாதுகாக்கப்படுகிறது; அதன் துல்லியமான குறிப்பை வசனத்திலேயே விளக்கிச் சேர்க்கவில்லை.
- source_word: οἱ τρεῖς
  choice: இந்த மூன்றும்
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆவி, தண்ணீர், இரத்தம் ஆகிய மூன்றையும் இயல்பான தமிழில் கூட்டாகச் சுட்டுகிறது.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: ஒன்றில் இணைகின்றன
  rationale: εἰς τὸ ἕν என்பதன் ‘ஒன்றை நோக்கிய/ஒன்றில் கூடும்’ இயக்கத்தையும், சூழலில் மூன்று சாட்சிகளின் ஒத்திசைவையும் ஒரே நேரத்தில் உணர்த்துகிறது; வெறும் ‘ஒன்றாக இருக்கின்றன’ என்று கூறி இருப்பியல் ஒருமையைத் தேவையின்றி வலியுறுத்துவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: εἰς τὸ ἕν εἰσιν என்பது இருப்பியல் ஒருமையைக் குறிக்கிறதா அல்லது சாட்சியின் ஒருமித்த தன்மையைக் குறிக்கிறதா
  choice: சாட்சிகள் ஒன்றில் இணைகின்றன
  alternative: இந்த மூன்றும் ஒன்றாக இருக்கின்றன / இந்த மூன்றும் ஒருமித்திருக்கின்றன
  rationale: சுற்றியுள்ள வசனங்கள் இம்மூன்றையும் சாட்சிகளாக முன்வைப்பதால், அவை ஒரே முடிவில் கூடுகின்றன என்பதே இயல்பான பொருள். அதேவேளை ‘ஒன்றில் இணைகின்றன’ என்பது கிரேக்கத்தின் உருவத்தையும் ஒரு அளவு பாதுகாத்து, பிற்காலத் திரித்துவ வாசக வேறுபாட்டின் கருத்தை இந்த வசனத்தில் இறக்குமதி செய்யாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘சாட்சி அளிக்கின்றன’ என்பது முந்தைய வசனத்திலிருந்து தொடரும் கிரேக்க வாக்கியத்தின் மறைமுக வினையைத் தமிழில் முழுமையான வாக்கியமாக்குகிறது. ‘ஆவி’ என்பதில் தமிழில் எழுத்துரு வழியான capitalization வேறுபாடு இல்லாததால் ‘தூய’ என்ற விளக்கச் சொல்லைச் சேர்க்காமல் மூலத்தின் அளவு பாதுகாக்கப்பட்டுள்ளது.
