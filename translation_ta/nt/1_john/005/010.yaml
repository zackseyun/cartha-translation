id: 1JN.5.10
reference: 1 John 5:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: ta
  text: கடவுளின் மகன்மேல் நம்பிக்கை வைக்கிறவர் அந்தச் சாட்சியைத் தனக்குள்ளே கொண்டிருக்கிறார்[a]. கடவுளை நம்பாதவர் கடவுளைப் பொய்யர் எனக் கருதியிருக்கிறார்[b]; ஏனெனில், கடவுள் தமது மகனைப் பற்றிக் கொடுத்த சாட்சியை அவன் நம்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘தனக்குள்ளே’ என்பதற்குப் பதிலாக ‘அவருக்குள்’ என்று உள்ளது; அதை ‘மகனுக்குள்’ என்றும் புரிந்துகொள்ள முடியும்.
    reason: textual_variant
  - marker: b
    text: கிரேக்கத்தில் இன்னும் நேரடியாக, ‘அவரைப் பொய்யராக்கியிருக்கிறார்’ என்று உள்ளது. கடவுளின் சாட்சியை நிராகரிப்பது, கடவுள் பொய் சொல்கிறவர் எனக் கருதுவதற்குச் சமம் என்பது இதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: கடவுளின் மகன்மேல் நம்பிக்கை வைக்கிறவர்
  rationale: εἰς உடன் வரும் πιστεύω, மகனை நோக்கிய தனிப்பட்ட நம்பிக்கையைக் குறிக்கிறது. ‘மகன்மேல் நம்பிக்கை வைக்கிறவர்’ என்பது இந்தத் திசைநோக்கிய நம்பிக்கையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν μαρτυρίαν
  choice: அந்தச் சாட்சி
  rationale: μαρτυρία என்பது இங்கு கடவுள் அளித்த சாட்சியையும் அதன் உள்ளடக்கத்தையும் குறிக்கிறது. ‘சாட்சி’ யோவானின் சட்டவியல் சாயலையும் காக்கிறது.
- source_word: ἐν αὑτῷ
  choice: தனக்குள்ளே
  rationale: பிரதிபெயர் இயல்பாக முன்பு சொல்லப்பட்ட நம்பிக்கை வைக்கிறவரையே சுட்டுகிறது; அவருக்குள் அந்தச் சாட்சி இருப்பதை ‘தனக்குள்ளே’ தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: கடவுளை நம்பாதவர்
  rationale: இங்குள்ள வேற்றுமை அமைப்பு கடவுளுடைய சாட்சியை உண்மையென ஏற்காததைக் குறிக்கிறது; கடவுள் இருக்கிறார் என்ற பொதுவான நம்பிக்கையின்மையை மட்டும் குறிக்கவில்லை. அடுத்த காரணவாக்கியம் இதை உறுதிப்படுத்துகிறது.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: அவரைப் பொய்யராக்கியிருக்கிறார்
  rationale: மூலத்தின் நேரடியான, அதிர்ச்சியூட்டும் சொல்லாட்சியைப் பாதுகாக்கிறது. நிறைவுற்ற வினையின் தற்போதைய விளைவு ‘ஆக்கியிருக்கிறார்’ என்பதால் வெளிப்படுகிறது; அதன் கருத்துப்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: οὐ πεπίστευκεν
  choice: நம்பவில்லை
  rationale: தமிழில் எதிர்மறை இறந்தகால வடிவம் சூழலில் தொடரும் நம்பாமையை இயல்பாக வெளிப்படுத்துகிறது; ‘நம்ப மறுத்தார்’ என்று நோக்கத்தை அதிகமாகச் சேர்க்கவில்லை.
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ
  choice: கடவுள் தமது மகனைப் பற்றிக் கொடுத்த சாட்சி
  rationale: ‘தமது’ என்பது கடவுளையே உரிமையாளராகத் தெளிவாகச் சுட்டுகிறது. μαρτυρέω–μαρτυρία என்ற ஒரே சொல்வேரின் தொடர்பைத் தமிழில் இயல்பாகத் தர ‘சாட்சி கொடுத்த’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘தனக்குள்ளே இருக்கும் சாட்சி’ என்பதன் இடம்
  choice: சாட்சி நம்பிக்கை வைக்கிறவருக்குள்ளே உள்ளது
  alternative: வேறொரு பாடவேறுபாட்டின்படி சாட்சி மகனுக்குள் உள்ளது எனப் புரிந்துகொள்ளலாம்
  rationale: கொடுக்கப்பட்ட SBLGNT வாசகம் ἐν αὑτῷ என இருப்பதால், அது முன்பு குறிப்பிடப்பட்ட நம்பிக்கை வைக்கிறவரை இயல்பாகச் சுட்டுகிறது. அருகிலுள்ள வசனங்களிலிருந்து மேலதிக கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: ‘கடவுளை நம்பாதவர்’ என்பதன் பொருள்
  choice: கடவுள் தமது மகனைப் பற்றிக் கொடுத்த சாட்சியை உண்மையென ஏற்காதவர்
  alternative: கடவுள் இருப்பதையே பொதுவாக நம்பாதவர்
  rationale: ὅτι எனத் தொடங்கும் காரணவாக்கியம், இந்த நம்பாமை கடவுள் அளித்த சாட்சியை ஏற்காததே என்று வரையறுக்கிறது. ஆகவே பொதுவான இறைநம்பிக்கையின்மை என்று வசனம் குறுக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுள்’, ‘மகன்’, ‘சாட்சி’, ‘நம்பிக்கை வைக்கிறவர்’ ஆகியவை தேவையற்ற சமயக்குழுச் சிறப்புச் சொற்களைத் தவிர்த்து, மூலத்தின் சட்டவியல் மற்றும் உறவுசார் நுணுக்கங்களைப் பாதுகாக்கின்றன. இரண்டு பிரதான வாக்கியங்களின் இணை அமைப்பும் காரணத்தை அறிமுகப்படுத்தும் இறுதி வாக்கியமும் காக்கப்பட்டுள்ளன.
