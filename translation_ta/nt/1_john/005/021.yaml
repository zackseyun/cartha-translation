  source_fidelity: மூலக் கிரேக்கத்தின் அழைப்புவடிவமான «Τεκνία», கட்டளையான «φυλάξατε», தற்சுட்டுப் பொருளான «ἑαυτά», பிரிவைக் குறிக்கும் «ἀπό», மற்றும் «εἰδώλων» ஆகிய அனைத்தும் பொருளுக்கு உண்மையாக மொழிபெயர்க்கப்பட்டுள்ளன. «உங்களைக் காத்துக்கொள்ளுங்கள்» என்பது «guard yourselves» என்பதன் இயல்பான தமிழ் வெளிப்பாடாக இருந்து தற்சுட்டுப் பொருளைத் தக்கவைக்கிறது.
