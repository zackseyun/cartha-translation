  text: Τεκνία, φυλάξατε ἑαυτὰ ἀπὸ τῶν ⸀εἰδώλων.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/021.yaml
  text: Little children[a], guard yourselves from idols.
translation:
  language: ta
  text: பிள்ளைகளே[a], விக்கிரகங்களிலிருந்து உங்களைக் காத்துக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறு பிள்ளைகளே’ அல்லது ‘அன்புப் பிள்ளைகளே’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் யோவான் நேரடியாக அழைக்கும்போது பயன்படுத்தும் அன்பான சிறுமைப்பெயர் வடிவம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: பிள்ளைகளே
  rationale: τεκνίον என்பதன் அழைப்புவேற்றுமைப் பன்மை வடிவம்; யோவான் இதை அன்பும் மேய்ப்பருக்குரிய நெருக்கமும் கொண்ட நேரடி அழைப்பாகப் பயன்படுத்துகிறார். ‘பிள்ளைகளே’ என்பது தமிழில் இயல்பாக அந்தக் குடும்ப நெருக்கத்தைத் தருகிறது; ‘சிறு பிள்ளைகளே’ என்பது வாசகர்களின் வயதைத் தேவையின்றி வலியுறுத்தக்கூடும்.
- source_word: φυλάξατε
  choice: காத்துக்கொள்ளுங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை இறந்தகாலச் செயப்படுத்தும் கட்டளை வடிவம்; விழிப்புடன் தம்மைப் பாதுகாக்கும் உறுதியான அழைப்பைத் தெரிவிக்கிறது. ‘காத்துக்கொள்ளுங்கள்’ என்பது தமிழில் இயல்பாகவும் செயற்பாட்டுடனும் உள்ளது.
- source_word: ἑαυτὰ
  choice: உங்களைக்
  rationale: தற்சுட்டுப் பெயர்ச்சொல்லின் பொருளை, ‘காத்துக்கொள்ளுங்கள்’ என்ற தற்சுட்டு வினையுடன் இணைத்து இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘உங்களையே’ என வலியுறுத்துவது மூலத்தில் இல்லாத கூடுதல் அழுத்தத்தை ஏற்படுத்தலாம்.
- source_word: ἀπὸ
  choice: -இலிருந்து
  rationale: பிரிவு அல்லது விலகலைக் குறிக்கும் முன்னிடைச்சொல். ‘விக்கிரகங்களிலிருந்து’ என்பது அந்தப் பிரிவை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: εἰδώλων
  choice: விக்கிரகங்கள்
  rationale: εἴδωλον என்பது வழிபாட்டுக்குரிய சிலை அல்லது பொய்யான வழிபாட்டின் பொருளைக் குறிக்கிறது. ‘விக்கிரகங்கள்’ என்பது தமிழ்க் கிறிஸ்தவச் சூழலிலும் பொதுப் பயன்பாட்டிலும் தெளிவான இணைச்சொல்; ‘சிலைகள்’ என்பது வழிபாட்டுச் சார்பைத் தெளிவாக்காது, ‘பொய்த் தெய்வங்கள்’ என்பது மூலச்சொல்லை விளக்கி விரிவாக்கும்.
theological_decisions:
- issue: ‘விக்கிரகங்கள்’ என்பதன் பொருள் வரம்பு
  choice: மூலத்தில் உள்ள உறுதியான சொல்லைப் பின்பற்றி ‘விக்கிரகங்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுளின் இடத்தைப் பிடிக்கும் எதுவும்’ அல்லது ‘எல்லாப் பொய் வழிபாடும்’ என்று விரிவாக்குதல்
  rationale: கிரேக்கம் விக்கிரகங்களை நேரடியாகக் குறிப்பிடுகிறது. இச்சொல் மறைமுகமாக விரிவான சிலைவழிபாட்டு எச்சரிக்கையை உள்ளடக்கக்கூடும்; ஆனாலும் மொழிபெயர்ப்பு மூலவாக்கியத்தைவிட அதன் வரம்பை விரிவாக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நேரடி கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிள்ளைகளே’ என்ற அழைப்பு இயல்பான தமிழைத் தக்கவைத்தபடி மூலத்தின் குடும்ப நெருக்கத்தை வெளிப்படுத்துகிறது.
