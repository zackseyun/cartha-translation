base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: ta
  text: குமாரனை உடையவருக்கு வாழ்வு உண்டு[a]; தேவனுடைய குமாரனை உடையவராக இல்லாதவருக்கு வாழ்வு இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நித்திய வாழ்வு’; யோவானின் பயன்பாட்டில் இங்குள்ள ‘வாழ்வு’ என்பது குமாரனில் காணப்படும் வாழ்வைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: உடையவருக்கு
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்புவினை, குமாரனை உடையவர் என அடையாளப்படுத்தப்படும் ஒருவரைக் குறிக்கிறது. தமிழில் ‘உடையவருக்கு … உண்டு’ என்பது இயல்பாகவும், மூலத்தின் ஒருமை பொதுப்பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: τὸν υἱόν
  choice: குமாரனை
  rationale: முதல் கூறில் கிரேக்கம் ‘குமாரன்’ என்று மட்டும் சொல்வதால், இரண்டாம் கூறிலுள்ள முழுப் பட்டத்தோடு காணப்படும் வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: ἔχει
  choice: உண்டு
  rationale: ἔχω என்பதன் உடைமை/பங்குபெறுதல் கருத்தை, ‘உடையவருக்கு வாழ்வு உண்டு’ என்ற இயல்பான தமிழ் அமைப்பில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: τὴν ζωήν
  choice: வாழ்வு
  rationale: இவ்வசனம் ζωή என்பதை விரிவாக்காமல் கூறுகிறது. ‘வாழ்வு’ என்பது யோவானின் இறையியல் ஆழத்தைத் தக்கவைத்து, அதன் நித்திய தன்மையைச் சூழல் விளக்க அனுமதிக்கிறது.
- source_word: ὁ μὴ ἔχων
  choice: உடையவராக இல்லாதவருக்கு
  rationale: μή உடன் வரும் பங்கேற்புவினையின் மறுப்பைத் தெளிவாகக் காட்டுகிறது; அதேவேளையில் முதல் கூறோடு உள்ள எதிரிணை அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: தேவனுடைய குமாரனை
  rationale: மூலத்தில் வெளிப்படையாக உள்ள முழுக் கிறிஸ்துவியல் பட்டத்தையும் உடைமைத் தொடர்பையும் தெளிவாகக் காக்கிறது.
- source_word: οὐκ ἔχει
  choice: இல்லை
  rationale: வரையறுக்கப்பட்ட வினையை மறுக்கும் οὐκ என்பதைக் காட்டி, நேர்மறையான ‘உண்டு’ என்பதோடு வலுவான தமிழ் எதிரிணையை உருவாக்குகிறது.
theological_decisions:
- issue: யோவானின் பயன்பாட்டில் ‘வாழ்வு’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ζωή என்பதை ‘வாழ்வு’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: நித்திய வாழ்வு
  rationale: 1 யோவானில் ζωή பெரும்பாலும் குமாரனில் உள்ள நித்திய வாழ்வைக் குறித்தாலும், இவ்வசனம் ‘வாழ்வு’ என்றே கூறுகிறது. மூலத்தில் இல்லாத விளக்கச் சொல்லை உரைக்குள் சேர்க்காமல், அதன் முழுப் பொருளைச் சூழல் தெரிவிக்க விடுகிறது.
- issue: ஆண்பால் ஒருமையில் உள்ள பொதுப்பொருள் பங்கேற்புவினைகள்
  choice: ‘உடையவருக்கு / உடையவராக இல்லாதவருக்கு’ என்ற பொதுவான மனிதக் குறிப்பு
  alternative: அவன் / ஆண் சார்ந்த வெளிப்பாடு
  rationale: கிரேக்க வடிவம் இலக்கணப்படி ஆண்பால் ஒருமையாக இருந்தாலும், அதன் குறிப்பு பொதுவானது. தேர்ந்த தமிழ் வடிவம் பாலைக் குறுக்காமல் ஒருமை சார்ந்த பொதுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; சாதாரண வாசகருக்குப் புரியும் வகையில் ‘உண்டு/இல்லை’ என்ற தெளிவான எதிரிணை பயன்படுத்தப்பட்டுள்ளது. ‘மகன்’ என்பதற்குப் பதிலாக, தேவனுடனான தனித்துவ உறவைக் குறிக்கும் வேதாகமப் பட்டமாக நிலைபெற்ற ‘குமாரன்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
