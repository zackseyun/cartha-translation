id: 1JN.5.14
reference: 1 John 5:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: ta
  text: 'அவரிடம் நாம் கொண்டிருக்கும் உறுதியான நம்பிக்கை[a] இதுவே: அவருடைய விருப்பத்தின்படி நாம் எதையாவது கேட்டால், அவர் நமக்குச் செவிகொடுக்கிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துணிவு” அல்லது “நம்பிக்கையுறுதி.”
    reason: παρρησία என்பதற்கு நம்பிக்கையுடன் அணுகும் உறுதி, துணிவு, வெளிப்படையான தைரியம் போன்ற நெருங்கிய பொருள்கள் உள்ளன; இவ்வேண்டுதல் சூழலில் “உறுதியான நம்பிக்கை” தேர்ந்தெடுக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: παρρησία
  choice: உறுதியான நம்பிக்கை
  rationale: யோவானின் பயன்பாட்டிலும் இந்த வேண்டுதல் சூழலிலும், இச்சொல் தேவனுடைய முன்னிலையில் தயக்கமின்றி அணுகும் நம்பிக்கையுறுதியைக் குறிக்கிறது. நவீன தமிழில் “உறுதியான நம்பிக்கை” இயல்பாகவும் தெளிவாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: πρὸς αὐτόν
  choice: அவர் முன்னிலையில்
  rationale: πρός இங்கு ஒருவரை நோக்கிய உறவுநிலையையோ அவரது சந்நிதியில் இருப்பதையோ குறிக்கிறது. வேண்டுதலின் சூழலில் “அவர் முன்னிலையில்” என்பது மரியாதையான, இயல்பான தமிழாக அமைகிறது.
- source_word: ὅτι
  choice: 'இதுவே:'
  rationale: ὅτι இங்கு காரணத்தை அல்ல, நம்பிக்கையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் முந்தைய “இதுவே” என்பதையும் முக்காற்புள்ளியையும் பயன்படுத்துவது அந்த விளக்கத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: ἐάν τι αἰτώμεθα
  choice: நாம் எதைக் கேட்டாலும்
  rationale: ἐάν உடன் வரும் நிகழ்கால வினைமுறை ஒரு பொதுவான நிபந்தனையைத் தருகிறது; τι வேண்டுதலின் திறந்த பரப்பைத் தக்கவைக்கிறது. “எதைக் கேட்டாலும்” இதைச் செறிவாக வெளிப்படுத்துகிறது.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: அவருடைய விருப்பத்தின்படி
  rationale: κατά இங்கு ஒத்திசைவு அல்லது அளவுகோலைக் குறிக்கிறது. θέλημα என்பதற்கு “விருப்பம்” என்பது தேவன் விரும்புவது என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀκούει ἡμῶν
  choice: அவர் நமக்குச் செவிகொடுக்கிறார்
  rationale: இது தேவன் வேண்டுதலைக் கேட்டு கவனிப்பதைக் குறிக்கிறது. “செவிகொடுக்கிறார்” என்பது வெறுமனே ஒலி கேட்பதைவிட சூழலுக்குப் பொருத்தமானது; அதேவேளை வேண்டிய அனைத்தையும் உடனே அளிக்கிறார் என்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: வேண்டுதலைத் தேவன் கேட்பதன் பொருள்
  choice: “அவர் நமக்குச் செவிகொடுக்கிறார்” என்று மொழிபெயர்த்து, தேவன் வேண்டுதலைக் கேட்டு கவனிப்பதை மட்டும் கூறுதல்
  alternative: “அவர் நமக்குப் பதிலளிக்கிறார்” அல்லது “நாம் கேட்டதை அவர் அளிக்கிறார்”
  rationale: இந்த வசனம் தேவனுடைய விருப்பத்தின்படி செய்யப்படும் வேண்டுதலை அவர் கேட்கிறார் என்கிறது; ஒவ்வொரு வேண்டுதலும் உடனடியாக நிறைவேற்றப்படும் என்று தனியாக வாக்குறுதி அளிப்பதில்லை. அடுத்த வசனம் பெறுதல் பற்றிய எண்ணத்தை மேலும் வளர்க்கிறது; ஆகவே இங்கே உள்ள இறையியல் அழுத்தத்தைத் தீர்த்துவிடாமல் தக்கவைக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியக்கூடிய, மரியாதையும் வேதாகமத்திற்குரிய கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. “அவர் முன்னிலையில்” மற்றும் “செவிகொடுக்கிறார்” ஆகியவை சொற்சொற் கடினத்தைக் தவிர்த்தும் கிரேக்கத்தின் உறவு மற்றும் வேண்டுதல் சார்ந்த நுணுக்கத்தைத் தக்கவைத்தும் உள்ளன.
