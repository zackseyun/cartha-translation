  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: ta
  text: இதுவே சாட்சி:[a] கடவுள் நமக்கு நித்திய வாழ்வைக் கொடுத்திருக்கிறார்;[b] இந்த வாழ்வு அவருடைய மகனில் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சாட்சி’ என்பதற்கு ‘சான்றுரை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கொடுத்தார்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினை நிறைவேறிய செயலைக் குறிக்கிறது. ‘கொடுத்திருக்கிறார்’ என்பது அதன் தற்போதைய விளைவையும் தமிழில் வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: சாட்சி
  rationale: சாட்சி அளிக்கப்படுவதன் உள்ளடக்கத்தைக் குறிக்கும் யோவானிய சட்ட–சான்றுச் சூழலை இயல்பாக வெளிப்படுத்துகிறது. தமிழில் இது சாட்சி கூறும் நபரையும் குறிக்கக்கூடும் என்பதால் மாற்றுச் சொல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὅτι
  choice: ':'
  rationale: சாட்சியின் உள்ளடக்கத்தைத் தொடர்ந்து அறிமுகப்படுத்தும் ὅτι என்பதன் செயல்பாட்டைத் தமிழில் இயல்பாக முக்காற்புள்ளி வெளிப்படுத்துகிறது; தனியே ‘என்பதே’ என்று சேர்க்கத் தேவையில்லை.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: கால நீடிப்பையும் கடவுள் அளிக்கும் வாழ்வின் தன்மையையும் தக்கவைக்கும், யோவானிய பயன்பாட்டுக்கு ஏற்ற, பரவலாகப் புரிந்துகொள்ளப்படும் சொற்றொடர்.
- source_word: ἔδωκεν
  choice: கொடுத்திருக்கிறார்
  rationale: நிறைவேறிய கொடுத்தல் செயலையும் அதன் தற்போதைய விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; எளிய இறந்தகால வடிவம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: விளக்கச் சேர்க்கையின்றி மூலத்தின் எழுவாயை நவீன பொதுத்தமிழில் நேரடியாக வழங்குகிறது.
- source_word: ἡμῖν
  choice: நமக்கு
  rationale: முதலாம் நபர் பன்மை மறைமுகச் செயப்படுபொருளை இயல்பாகக் காட்டுகிறது; அதன் குறிப்பெல்லையை உரை கூறுவதைக் காட்டிலும் குறுக்கவோ விரிவாக்கவோ இல்லை.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: அவருடைய மகனில்
  rationale: ἐν என்பதன் ‘இல்’ பொருளையும், வாழ்வு மகனில் இருப்பதாகக் கூறும் யோவானிய செறிவையும் விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: υἱῷ
  choice: மகன்
  rationale: கடவுளுடன் தனித்த உறவில் உள்ள இயேசுவைக் குறிக்கும் உறவுப்பெயரை, பழமையான ‘குமாரன்’ என்பதற்குப் பதிலாகத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: இதுவே ... இந்த வாழ்வு
  rationale: மூலத்தில் மீண்டும் வரும் சுட்டுப்பெயரைத் தக்கவைத்து, சாட்சியையும் முன்பு குறிப்பிடப்பட்ட வாழ்வையும் இணைக்கிறது.
theological_decisions:
- issue: ἔδωκεν என்ற இறந்தகால வினையின் நிறைவேறிய செயலும் தற்போதைய விளைவும்
  choice: ‘கொடுத்திருக்கிறார்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘கொடுத்தார்’
  rationale: கடவுளின் கொடுத்தல் நிறைவேறிய செயல் என்பதையும் அதன் விளைவு இப்போது நிலைப்பதையும் தமிழ் நிறைவு வடிவம் வெளிப்படுத்துகிறது; வசனம் கூறுவதைத் தாண்டிய கோட்பாட்டு முடிவு இதில் சேர்க்கப்படவில்லை.
- issue: வாழ்வு ‘அவருடைய மகனில்’ இருப்பதன் பொருள்
  choice: ‘அவருடைய மகனில்’ என்ற செறிவான மூல வெளிப்பாடு அப்படியே தக்கவைக்கப்பட்டது
  alternative: ‘அவருடைய மகன் மூலமாக’
  rationale: மூலம் வாழ்வுக்கும் மகனுக்கும் உள்ள உறவை ‘ἐν’ என்ற சொல்லால் செறிவாகக் கூறுகிறது. ‘மூலமாக’ என்று விரிப்பது கருவி அல்லது வழிமுறை என்ற ஒரே பொருளுக்கு அதைச் சுருக்கிவிடும்.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுள்’, ‘மகன்’, ‘வாழ்வு’ ஆகிய இயல்பான சொற்கள் தேர்ந்தெடுக்கப்பட்டன; யோவானிய ‘மகனில்’ என்ற செறிவான சொற்றொடர் விளக்கமாக விரிக்கப்படாமல் பாதுகாக்கப்பட்டது.
