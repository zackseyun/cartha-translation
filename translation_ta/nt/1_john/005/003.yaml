revisions:
- from: ஏனெனில், கடவுள்மேல் நாம் கொண்டிருக்கும் அன்பு என்பது, அவருடைய கட்டளைகளைக் கடைப்பிடிப்பதே[a]. அவருடைய கட்டளைகள் பாரமானவை அல்ல.
  to: ஏனெனில், கடவுள்மேல் நாம் கொண்டிருக்கும் அன்பு என்பது அவருடைய கட்டளைகளைக் கடைப்பிடிப்பதே[a]; அவருடைய கட்டளைகள் சுமையாக இருப்பதில்லை.
  rationale: The revision changes only the rendering of βαρεῖαι and the punctuation linking the coordinated clauses. It preserves the source’s meaning, the contextually favored reading of the genitive, and the documented alternative reading.
