id: 1JN.5.3
reference: 1 John 5:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: ta
  text: ஏனெனில், கடவுள்மேல் நாம் கொண்டிருக்கும் அன்பு என்பது அவருடைய கட்டளைகளைக் கடைப்பிடிப்பதே[a]; அவருடைய கட்டளைகள் சுமையாக இருப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய அன்பு என்பது, அவருடைய கட்டளைகளைக் கடைப்பிடிப்பதே.” கிரேக்கத் தொடர் கடவுள்மேல் கொண்ட அன்பையோ கடவுளிடமிருந்து வரும் அன்பையோ குறிக்கலாம்; உடனடிச் சூழல் கடவுள்மேல் கொண்ட அன்பையே ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: என்பது
  rationale: முன்னோக்கி வரும் ἵνα உட்பிரிவை அன்பின் விளக்கமாகச் சுட்டுகிறது; தமிழில் ‘என்பது ... -தே’ என்ற அமைப்பு இயல்பாக இந்த விளக்கத் தொடர்பைக் காட்டுகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சக்தியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: கடவுள்மேல் நாம் கொண்டிருக்கும் அன்பு
  rationale: உடனடிச் சூழலில் விசுவாசிகள் கடவுளை நேசிப்பது அவருடைய கட்டளைகளைக் கடைப்பிடிப்பதில் வெளிப்படுகிறது; ஆகவே நோக்குநிலை உடைமைப் பொருள் இயல்பான தமிழில் வெளிப்படையாக மொழிபெயர்க்கப்படுகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἵνα
  choice: என்பது ... கடைப்பிடிப்பதே
  rationale: இங்கு நோக்கத்தைவிட, கடவுள்மேலான அன்பு எதில் அடங்கியுள்ளது என்பதை விளக்கும் உள்ளடக்கப் பயன்பாடு; தமிழ் பெயராக்க அமைப்பு அதை இயல்பாக வழங்குகிறது.
- source_word: ἐντολάς
  choice: கட்டளைகள்
  rationale: யோவானியப் பயன்பாட்டின் அதிகாரமும் நிலையான வேதாகமச் சொல்லாட்சியும் பாதுகாக்கப்படுகின்றன.
- source_word: τηρῶμεν
  choice: கடைப்பிடிப்பது
  rationale: கட்டளைகளைப் பேணிக் கீழ்ப்படிந்து நடப்பது என்ற τηρέω-வின் யோவானியப் பொருளை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: βαρεῖαι
  choice: பாரமானவை
  rationale: உடல் எடையை மட்டும் அல்லாமல் தாங்கக் கடினமான சுமை என்ற உருவகப் பொருளையும் தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ என்பதில் உள்ள உடைமை வேற்றுமையின் பொருள்
  choice: கடவுளை நோக்கிய விசுவாசிகளின் அன்பு
  alternative: கடவுளிடமிருந்து வரும் அல்லது கடவுள் காட்டும் அன்பு; அல்லது இரு பொருள்களையும் திறந்துவைக்கும் வாசிப்பு
  rationale: முந்தைய வசனமும் இவ்வசனத்தின் விளக்க உட்பிரிவும் கடவுளை நேசிப்பதை அவருடைய கட்டளைகளைக் கடைப்பிடிப்பதோடு இணைக்கின்றன. எனவே முதன்மை உரையில் நோக்குநிலைப் பொருள் தெளிவாகத் தரப்படுகிறது; கிரேக்கத்தின் உண்மையான மாற்றுவாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. ‘கடவுள்மேல் நாம் கொண்டிருக்கும் அன்பு’ என்பது முதன்மைப் பொருளை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது; ‘கட்டளைகளைக் கடைப்பிடிப்பது’ சட்டவாதத் தொனியைச் சேர்க்காமல் தொடர்ச்சியான கீழ்ப்படிதலைக் காட்டுகிறது.
