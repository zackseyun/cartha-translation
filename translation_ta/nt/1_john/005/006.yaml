source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: ta
  text: தண்ணீரினாலும் இரத்தத்தினாலும்[a] வந்தவர் இவரே—இயேசு மெசியா; தண்ணீரினால் மட்டும் அல்ல, தண்ணீரினாலும் இரத்தத்தினாலும் வந்தார். சாட்சியளிப்பவர் ஆவியானவர்; ஏனெனில் ஆவியானவரே உண்மை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தண்ணீர் மற்றும் இரத்தத்தின் வழியாக வந்தவர்’ என்றும் மொழிபெயர்க்கலாம். ‘தண்ணீரும் இரத்தமும்’ என்பது இயேசுவின் திருமுழுக்கையும் மரணத்தையும், அவரது பிறப்பையும் மரணத்தையும், அல்லது திருமுழுக்கு மற்றும் திருவிருந்து தொடர்பான உருவகத்தையும் குறிப்பதாகப் பலவாறு புரிந்துகொள்ளப்படுகிறது. கிரேக்கச் சொற்றொடர் எந்த விளக்கத்தையும் வெளிப்படையாகத் தேர்ந்தெடுக்கவில்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘ஆவியானவர் உண்மை என்று சாட்சியளிக்கிறார்.’ கிரேக்க ὅτι என்ற சொல் காரணத்தையோ சாட்சியின் உள்ளடக்கத்தையோ அறிமுகப்படுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: வந்தவர் இவரே
  rationale: சுட்டுப்பெயரின் வலியுறுத்தலையும் பெயரெச்சத்தின் வரலாற்றுச் செயலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: தண்ணீரினாலும் இரத்தத்தினாலும்
  rationale: διά + genitive குறிக்கும் வழி அல்லது ஊடகத்தைத் தமிழின் கருவிப்பொருள் வேற்றுமையால் தெரிவிக்கிறது; சொற்றொடரின் விவாதத்துக்குரிய பொருளை விளக்கிச் சுருக்கவில்லை.
- source_word: Ἰησοῦς Χριστός
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு இயேசுவை அடையாளப்படுத்தும் பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: தண்ணீரினால் மட்டும் அல்ல, தண்ணீரினாலும் இரத்தத்தினாலும் வந்தார்
  rationale: ‘மட்டும் அல்ல ... இரண்டினாலும்’ என்ற முரண்பாட்டைத் தெளிவாகப் பாதுகாக்கிறது; தமிழில் முழுமையான இயல்பான வாக்கியமாக அமைய ‘வந்தார்’ மீண்டும் வழங்கப்படுகிறது.
- source_word: τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν
  choice: சாட்சியளிப்பவர் ஆவியானவர்
  rationale: நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியான சாட்சிச் செயலைப் பாதுகாத்து, ஆவியானவரை வலியுறுத்துகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இங்கு ஆவியானவர் சாட்சியளிப்பதற்கான காரணத்தை அறிமுகப்படுத்தும் causal வாசிப்பு சூழலோடு நன்றாகப் பொருந்துகிறது; மாற்று content வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἡ ἀλήθεια
  choice: உண்மை
  rationale: predicate அடையாளப்படுத்தும் வலிமையை ‘ஆவியானவரே உண்மை’ என்ற தமிழ்ச் சொற்றொடர் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘ஆவி’ என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியானவரைக் குறிக்கும் வகையில் மரியாதைப் பன்மை வடிவமான ‘ஆவியானவர்’
  alternative: பொதுவான ‘ஆவி’
  rationale: யோவானியச் சூழலில் தெய்வீகச் சாட்சியளிப்பவர் பரிசுத்த ஆவியானவர் என்பது வலுவான குறிப்பு; ‘பரிசுத்த’ என்ற சொல்லை மூலத்தில் இல்லாததால் சேர்க்கவில்லை.
- issue: ‘தண்ணீரும் இரத்தமும்’ என்பதன் பொருள்
  choice: பொருள் விளக்கமின்றி மூல உருவகத்தைப் பாதுகாத்தல்
  alternative: இயேசுவின் திருமுழுக்கும் மரணமும்; பிறப்பும் மரணமும்; திருமுழுக்கு மற்றும் திருவிருந்து சார்ந்த அருளடையாளப் பொருள்
  rationale: கிரேக்க உரை இவற்றை விளக்காததால், விவாதத்துக்குரிய இறையியல் பொருளை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- issue: Χριστός என்பதன் செயல்பாடு
  choice: பட்டமாக ‘மெசியா’
  alternative: பெயர்போன்ற ‘கிறிஸ்து’
  rationale: இங்குள்ள apposition இயேசுவை மெசியா என்ற பதவியால் அடையாளப்படுத்துகிறது.
- issue: ὅτι என்பதன் தொடர்பு
  choice: 'காரணம்: ‘ஏனெனில்’'
  alternative: 'உள்ளடக்கம்: ‘... என்று’'
  rationale: காரண வாசிப்பு வாக்கிய ஓட்டத்துக்கு இயல்பானது; உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆவியானவர்’ என்ற மரியாதை வடிவம் தெய்வீகக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது. மூலத்தின் மீளுரையும் ‘மட்டும் அல்ல ... இரண்டினாலும்’ என்ற வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
