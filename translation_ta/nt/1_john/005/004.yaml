reference: 1 John 5:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: ta
  text: 'ஏனெனில், கடவுளிடமிருந்து பிறந்துள்ள ஒவ்வொருவரும்[a] உலகத்தை வெல்கிறார். உலகத்தை வென்ற வெற்றி இதுவே: நமது நம்பிக்கை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளிடமிருந்து பிறந்த அனைத்தும்.” கிரேக்கத் தொடர் நடுநிலை ஒருமை வடிவில் உள்ளது; அது கடவுளிடமிருந்து பிறந்தவர்களின் முழு வகுப்பையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நமது உண்மைப்பற்று.” கிரேக்கச் சொல் சூழலுக்கேற்ப ‘நம்பிக்கை,’ ‘நம்புதல்,’ அல்லது ‘உண்மைப்பற்று’ என்று பொருள்படலாம்; இங்கு முதன்மை உரை வழக்கமான ‘நம்பிக்கை’ என்ற பொருளைப் பின்பற்றுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச்சொல்லின் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πᾶν τὸ γεγεννημένον
  choice: பிறந்துள்ள ஒவ்வொருவரும்
  rationale: கிரேக்கத்தில் இத்தொடர் ஒருமை நடுநிலை வடிவில் இருந்தாலும், இச்சூழலில் கடவுளிடமிருந்து பிறந்தவர்களின் முழு வகுப்பையும் கூட்டாகக் குறிக்கிறது. ‘ஒவ்வொருவரும்’ என்பது ஆள்சார்ந்த குறிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: γεγεννημένον
  choice: பிறந்துள்ள
  rationale: நிறைவுற்ற பிறப்பு தொடர்ந்து விளைவைக் கொண்டிருப்பதை உணர்த்தும் perfect passive participle-ஐ, தற்போதும் நிலைக்கும் முடிவைச் சுட்டும் ‘பிறந்துள்ள’ என வழங்குகிறது.
- source_word: ἐκ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து
  rationale: ἐκ குறிக்கும் தோற்றுவாயை நேரடியாகப் பாதுகாக்கிறது; ஆன்மிகப் பிறப்பின் மூலமாகக் கடவுளைச் சுட்டுகிறது.
- source_word: νικᾷ
  choice: வெல்கிறார்
  rationale: தற்போதைய வெற்றியை இயல்பாகக் கூறுவதோடு, இதே வசனத்திலுள்ள νίκη மற்றும் νικήσασα ஆகிய சொற்களுடனான சொல்லுறவையும் ‘வெல்/வெற்றி/வென்ற’ வழியாகப் பாதுகாக்கிறது.
- source_word: τὸν κόσμον
  choice: உலகத்தை
  rationale: யோவானின் எழுத்துகளில் கடவுளுக்கு எதிரான உலக ஒழுங்கையும் குறிக்கக்கூடிய κόσμος என்பதன் உண்மையான பொருள் விரிவை விளக்கமின்றி அப்படியே பாதுகாக்கிறது.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: வெற்றி இதுவே
  rationale: சுட்டுப்பெயரின் வலியுறுத்தலையும் νίκη என்பதன் அடிப்படைப் பொருளையும் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡ νικήσασα
  choice: வென்ற
  rationale: aorist participle சுட்டும் நிறைவேறிய வெற்றியைச் சுருக்கமான தமிழ் பெயரெச்சமாக வழங்கி, ‘வெல்கிறார்’ என்பதுடனான சொல்லுறவைத் தக்கவைக்கிறது.
- source_word: ἡ πίστις ἡμῶν
  choice: நமது நம்பிக்கை
  rationale: πίστις என்பதற்கு இச்சூழலில் வழக்கமான ‘நம்பிக்கை’ பொருள் மிகவும் இயல்பானது; ἡμῶν என்பதன் உடைமைப் பொருளையும் ‘நமது’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: πᾶν τὸ γεγεννημένον என்பதன் குறிப்பு
  choice: 'ஆள்சார்ந்த, கூட்டான பொருள்: ‘கடவுளிடமிருந்து பிறந்துள்ள ஒவ்வொருவரும்’'
  alternative: வடிவத்துக்கு மிக நெருக்கமாக, ‘கடவுளிடமிருந்து பிறந்த அனைத்தும்’
  rationale: நடுநிலை ஒருமை வடிவம் ‘அனைத்தும்’ என மொழிபெயர்க்க இடமளித்தாலும், சூழல் கடவுளின் பிள்ளைகளாகப் பிறந்தவர்களைப் பற்றியது. ஆகவே முதன்மை உரையில் ஆள்சார்ந்த பொருள் தரப்பட்டு, வடிவரீதியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πίστις என்பதன் பொருள்
  choice: நம்பிக்கை
  alternative: உண்மைப்பற்று
  rationale: இவ்வசனத்தில் உலகத்தை வெல்லும் வெற்றியாக விசுவாசிகளின் நம்பிக்கை அடையாளப்படுத்தப்படுவது மிக இயல்பான வாசிப்பு. எனினும் πίστις சில சூழல்களில் ‘உண்மைப்பற்று’ என்றும் பொருள்படுவதால் அந்த வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: இயல்பான, நவீன நிலையான தமிழில் மரியாதையும் வேதாகமச் செறிவும் தக்கவைக்கப்பட்டுள்ளன. ‘கடவுளிடமிருந்து’ என்பது ஆன்மிகப் பிறப்பின் மூலத்தைத் தெளிவாக்குகிறது; ‘வெல்கிறார் / வெற்றி / வென்ற’ என்ற தொடர் கிரேக்க மூலத்திலுள்ள சொல்விளையாட்டைப் பாதுகாக்கிறது. ‘நம்பிக்கை’ பொதுவாசகருக்கு எளிதில் புரியும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
