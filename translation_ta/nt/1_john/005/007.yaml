lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துவதால், தமிழில் இயல்பாக அதன் விளக்கத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: τρεῖς
  choice: மூவர்
  rationale: சாட்சி அளிப்பவர்களைக் குறிக்கும் எண்ணுப்பெயராக, மனிதர்/தனிநபர் சார்ந்த மரியாதைமிக்க தமிழ் வடிவம் இயல்பாக உள்ளது.
- source_word: εἰσιν
  choice: இருக்கிறார்கள்
  rationale: நிகழ்கால இருப்பைக் குறிக்கும் இணைப்புவினையை, எழுவாயின் உயர்திணைப் பன்மைக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: οἱ μαρτυροῦντες
  choice: சாட்சி அளிக்கிறவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்பு வடிவத்தின் செயற்பாட்டு அர்த்தத்தைப் பாதுகாக்கிறது; வெறும் ‘சாட்சிகள்’ என்பதைவிட சாட்சி அளிக்கும் செயலைத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: 1 யோவான் 5:7-இன் உரை வடிவமும் Comma Johanneum எனப்படும் நீண்ட வாசகமும்
  choice: SBLGNT-இல் உள்ள குறுகிய கிரேக்க உரையை மட்டும் முதன்மை உரையில் மொழிபெயர்த்தல்
  alternative: 'பிற்காலக் கையெழுத்துப் பிரதிகளிலும் Textus Receptus/KJV மரபிலும் காணப்படும் ‘பரலோகத்தில்: பிதா, வார்த்தை, பரிசுத்த ஆவி; இம்மூவரும் ஒன்றாயிருக்கிறார்கள். பூமியில் சாட்சி அளிக்கிறவர்கள் மூவர்...’ என்ற நீண்ட வாசகம்'
  rationale: வழங்கப்பட்ட மூல உரை குறுகிய SBLGNT வாசகமாகும். நீண்ட திரித்துவ விரிவாக்கம் ஆரம்பகால கிரேக்கக் கையெழுத்துச் சான்றுகளில் இல்லை; ஆகவே அது முதன்மை உரையில் சேர்க்கப்படாமல், வரலாற்று முக்கியத்துவமுள்ள உரை வேறுபாடாக அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. அடுத்த வசனத்தோடு வாக்கியம் தொடர்வதைச் சுட்டுவதற்காக முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
