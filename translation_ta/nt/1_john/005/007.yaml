  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'பிற்காலக் கையெழுத்துப் பிரதிகள் சிலவற்றில், பொதுவாக Comma Johanneum என்று அழைக்கப்படும் நீண்ட வாசகம் சேர்க்கப்பட்டுள்ளது: “பரலோகத்தில்: பிதா, வார்த்தை, பரிசுத்த ஆவி; இம்மூவரும் ஒன்றாயிருக்கிறார்கள். பூமியில் சாட்சி அளிக்கிறவர்கள் மூவர் ...” இந்தச் சொற்றொடர் ஆரம்பகால கிரேக்கக் கையெழுத்துச் சான்றுகளில் இல்லை; SBLGNT உரையிலும் இடம்பெறவில்லை.'
