  text: οἴδαμεν ὅτι ἐκ τοῦ θεοῦ ἐσμεν, καὶ ὁ κόσμος ὅλος ἐν τῷ πονηρῷ κεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/019.yaml
  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: ta
  text: நாம் கடவுளிடமிருந்து வந்தவர்கள் என்றும், உலகம் முழுவதும் தீயவனின் ஆதிக்கத்தில் உள்ளது என்றும் அறிந்திருக்கிறோம்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, வடிவநெருக்கமாக, “உலகம் முழுவதும் தீயவனுக்குள் கிடக்கிறது.”
    reason: lexical_alternative
  - marker: b
    text: “தீயவன்” என்பதைச் சிலர் “தீமை” என்றும் புரிந்துகொள்ளலாம்; ஆனால் யோவானின் எழுத்துகளில் தனிப்பட்ட தீயவனைக் குறிக்கும் பொருளே அதிக வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: அறிந்திருக்கிறோம்
  rationale: οἶδα உறுதியான, நிலைபெற்ற அறிவைக் குறிக்கிறது. ‘அறிந்திருக்கிறோம்’ என்பது திருமுகத்தின் உறுதிப்பாட்டுத் தொனியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ θεοῦ ἐσμεν
  choice: கடவுளிடமிருந்து வந்தவர்கள்
  rationale: ἐκ இங்கு தோற்றுவாய் அல்லது சார்பைச் சுட்டுகிறது. ‘கடவுளிடமிருந்து வந்தவர்கள்’ என்பது மூலத்தின் பொருளைப் பேணுகிறது; இவ்வாக்கியத்தில் வெளிப்படையாக இல்லாத ‘கடவுளால் பிறந்தவர்கள்’ என்ற குறிப்பான கருத்தைச் சேர்ப்பதில்லை.
- source_word: ὁ κόσμος ὅλος
  choice: உலகம் முழுவதும்
  rationale: κόσμος என்பது இங்கு கடவுளுக்கு எதிரான உலக ஒழுங்கையும் மக்களுலகையும் குறிக்கக்கூடும்; ὅλος அதன் முழுமையை வலியுறுத்துகிறது. ‘உலகம் முழுவதும்’ இயல்பாகவும் விரிவைச் சுருக்காமலும் உள்ளது.
- source_word: ἐν τῷ πονηρῷ
  choice: தீயவனுக்குள்
  rationale: யோவானின் பயன்பாட்டில் substantivized πονηρός பெரும்பாலும் தனிப்பட்ட ‘தீயவனை’க் குறிக்கிறது. ἐν என்பதன் வடிவை நேரடியாகப் பேண ‘தீயவனுக்குள்’ என வழங்கப்படுகிறது; அதன் பொருளை ‘அதிகாரத்தின் கீழ்’ என்று முதன்மை உரையிலேயே தீர்மானிக்கவில்லை.
- source_word: κεῖται
  choice: கிடக்கிறது
  rationale: κεῖμαι என்பதன் படிமம் ‘கிடத்தல்/கிடத்தப்பட்டிருத்தல்’; இங்கு அது ஒரு நிலையில் இருப்பதை உணர்த்துகிறது. ‘கிடக்கிறது’ அந்த உருவகத்தைப் பேணுகிறது.
theological_decisions:
- issue: τῷ πονηρῷ என்பது தனிப்பட்ட தீயவனையா அல்லது கருத்துருவான தீமையையா குறிக்கிறது?
  choice: 'தனிப்பட்ட பொருள்: ‘தீயவன்’'
  alternative: 'கருத்துருவான பொருள்: ‘தீமை’'
  rationale: 1 யோவானில் ὁ πονηρός பொதுவாகத் தனிப்பட்ட தீயவனைக் குறிக்கிறது (2:13–14; 3:12; 5:18). இருப்பினும் வடிவம் கருத்துருவான ‘தீமை’ எனப் புரிந்துகொள்ளப்படுவதற்கான சாத்தியத்தை முற்றிலும் நீக்காததால் அது அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
- issue: ἐν τῷ πονηρῷ என்பதில் அதிகாரம் அல்லது கட்டுப்பாடு வெளிப்படையாகச் சேர்க்கப்பட வேண்டுமா?
  choice: முதன்மை உரையில் ‘தீயவனுக்குள்’ என்று வடிவநெருக்கமாக வழங்குதல்
  alternative: ‘தீயவனின் அதிகாரத்தின்கீழ்’
  rationale: ‘அதிகாரத்தின்கீழ்’ என்பது சூழலின் சாத்தியமான பொருளைத் தெளிவாக்கினாலும், கிரேக்கத்தில் ‘அதிகாரம்’ என்ற சொல் இல்லை. ஆகவே மூலத்தின் உருவகத்தையும் இறையியல் அழுத்தத்தையும் தீர்த்துவிடாமல் முதன்மை உரை பேணுகிறது; விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீயவனுக்குள் கிடக்கிறது’ என்பது வழக்குத் தமிழில் சற்றே செறிவானதாக இருந்தாலும், மூலத்தின் உருவகத்தையும் உண்மையான பொருள் இருமையையும் காக்கிறது; இயல்பான விளக்கம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
