  to: நாம் கடவுளிடமிருந்து வந்தவர்கள் என்றும், உலகம் முழுவதும் தீயவனின் ஆதிக்கத்தில் உள்ளது என்றும் அறிந்திருக்கிறோம்.[a][b]
  rationale: The revision replaces an opaque and potentially misleading literal Tamil spatial expression with a natural contextual rendering of ἐν τῷ πονηρῷ κεῖται. It does not add a named theological identification or resolve the personal/abstract question beyond the Greek and Johannine contextual probability. The form-close wording and the abstract alternative are both preserved in footnotes.
