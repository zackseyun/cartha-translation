source:
  edition: SBLGNT
  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: ta
  text: மேலும், நாம் எதைக் கேட்டாலும்[a] அவர் நமக்குச் செவிகொடுக்கிறார் என்று அறிந்திருக்கிறோம் என்றால், நாம் அவரிடம் கேட்டவை நம்மிடம் உள்ளன என்றும் அறிந்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் கேட்பது எதுவாயினும்.” கிரேக்கச் சொற்றொடர் வரையறுக்கப்படாத ‘எதுவாயினும்’ என்ற விரிவைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: அவர் நமக்குச் செவிகொடுக்கிறார்
  rationale: ஒருவருடைய வேண்டுதலைக் கேட்பதைக் குறிக்கும் இந்தக் கிரேக்கத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘பதிலளிக்கிறார்’ என்று மொழிபெயர்த்து வசனத்தின் முடிவை முன்கூட்டியே தீர்மானிக்கவில்லை.
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: நாம் எதைக் கேட்டாலும்
  rationale: ἐάν சேர்ந்த தொடர்புப்பெயர், கேட்கப்படும் எதையும் உள்ளடக்கும் வரையறுக்கப்படாத விரிவைத் தெரிவிக்கிறது; காலப்பொருளான ‘எப்போது கேட்டாலும்’ என்பதைவிட இது மூலத்துக்கு நெருக்கமானது.
- source_word: αἰτώμεθα
  choice: கேட்டாலும்
  rationale: இங்கு αἰτέω ஜெபத்தில் கேட்பதைக் குறிக்கிறது. ‘கேட்பது’ நவீன தமிழில் நேரடியும் இயல்பானதுமாக உள்ளது.
- source_word: ἔχομεν
  choice: நம்மிடம் உள்ளன
  rationale: நிகழ்கால ‘உண்டு/வைத்திருக்கிறோம்’ என்ற பொருளைப் பாதுகாக்கிறது; ‘பெற்றுக்கொண்டோம்’ என்று மாற்றி, மூலத்தில் வெளிப்படையாக இல்லாத பெறுதல் என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: τὰ αἰτήματα ἃ ᾐτήκαμεν
  choice: நாம் ... கேட்டவை
  rationale: தமிழில் ‘கேட்ட விண்ணப்பங்கள்’ என்பது செயற்கையாக ஒலிப்பதால், கேட்டவற்றைக் குறிக்கும் இயல்பான வடிவம் பயன்படுத்தப்பட்டுள்ளது; கேட்பதுக்கும் கேட்டவற்றுக்கும் உள்ள சொல் தொடர்பும் காக்கப்படுகிறது.
- source_word: ἀπ’ αὐτοῦ
  choice: அவரிடம்
  rationale: ஜெபத்தில் கோரிக்கை யாரை நோக்கிக் கேட்கப்பட்டது என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: οἴδαμεν
  choice: அறிந்திருக்கிறோம்
  rationale: யோவானின் எழுத்தில் மீண்டும் வரும் உறுதியான அறிவைத் தக்கவைக்கிறது; ‘நம்புகிறோம்’ அல்லது ‘உறுதியடைகிறோம்’ என்று விரிவாக்கவில்லை.
theological_decisions:
- issue: ἀκούει என்பது வேண்டுதலைக் கேட்பதை மட்டுமா, சாதகமாகப் பதிலளிப்பதையுமா குறிக்கிறது?
  choice: அவர் நமக்குச் செவிகொடுக்கிறார்
  alternative: அவர் நமக்குப் பதிலளிக்கிறார்
  rationale: மூலவசனம் முதலில் அவர் கேட்கிறார் என்று கூறி, அதிலிருந்து கேட்டவை நம்மிடம் உள்ளன என்ற முடிவுக்கு வருகிறது. ‘பதிலளிக்கிறார்’ என்பது இந்த இரு படிகளையும் ஒன்றாக்கி, கிரேக்கம் வெளிப்படையாகக் கூறுவதைவிட வலுவான முடிவைச் சேர்க்கும்.
- issue: ἔχομεν என்பதைப் பெறுதல் என்ற விளக்கத்துடன் மொழிபெயர்க்க வேண்டுமா?
  choice: நம்மிடம் உள்ளன
  alternative: நமக்குக் கிடைத்துவிட்டன
  rationale: ‘உள்ளன’ என்பது கிரேக்க நிகழ்கால வினையின் நேரடியான பொருளையும், வசனத்திலுள்ள இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது; நிறைவேறுதல் எவ்வாறு நிகழ்கிறது என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘செவிகொடுக்கிறார்’ என்பது ஜெபச் சூழலைத் தெளிவாக்கினாலும் ‘பதிலளிக்கிறார்’ என்ற மிகை விளக்கத்தைத் தவிர்க்கிறது. ‘நம்மிடம் உள்ளன’ என்ற சற்றே வலியுறுத்தப்பட்ட அமைப்பு, ἔχομεν என்பதிலுள்ள உடைமைப் பொருளையும் மூலத்தின் இறையியல் இழுவிசையையும் காக்கிறது.
