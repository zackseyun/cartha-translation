source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: ta
  text: 'மனிதர்களின் சாட்சியை[a] நாம் ஏற்றுக்கொள்கிறோம் என்றால், கடவுளின் சாட்சி அதைவிடப் பெரியது. ஏனெனில், இதுவே கடவுளின் சாட்சி: அவர் தமது மகனைக் குறித்து சாட்சி அளித்திருக்கிறார்[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் இங்கு ஆண்களை மட்டும் குறிக்காமல், மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_clarification
  - marker: b
    text: அல்லது, ‘தமது மகனைக் குறித்துச் சான்றளித்திருக்கிறார்.’
    reason: lexical_alternative
  - marker: c
    text: இறுதிக் கூற்றை, ‘ஏனெனில் அவர் தமது மகனைக் குறித்து சாட்சி அளித்திருக்கிறார்’ என்ற காரணப் பொருளிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: சாட்சி
  rationale: வசனம் முழுவதும் திரும்பத் திரும்ப வரும் நீதிமன்ற/ஆதாரச் சூழலுக்குரிய பொருளைத் தக்கவைத்தும், நவீனத் தமிழில் இயல்பாகவும் உள்ளது.
- source_word: ἀνθρώπων
  choice: மனிதர்களின்
  rationale: இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; கடவுளின் சாட்சிக்கு எதிராக மனிதச் சாட்சி நிறுத்தப்படுகிறது.
- source_word: λαμβάνομεν
  choice: ஏற்றுக்கொள்கிறோம்
  rationale: சாட்சியைப் பெற்றுக்கொள்வது மட்டுமல்ல, அதை ஏற்கும் சூழலையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்கச் சொல்லின் ‘பெறுதல்/ஏற்றுக்கொள்ளுதல்’ பொருள் வரம்புக்குள் உள்ளது.
- source_word: μείζων
  choice: அதைவிடப் பெரியது
  rationale: கடவுளின் சாட்சி மனிதர்களின் சாட்சியை விஞ்சுகிறது என்ற ஒப்பீட்டைத் தெளிவுபடுத்துகிறது.
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: இதுவே கடவுளின் சாட்சி
  rationale: சாட்சியைப் பற்றிய கிரேக்க மறுபடியுரைத்தலைப் பாதுகாத்து, αὕτη என்பதன் வலியுறுத்தலை ‘இதுவே’ என வெளிப்படுத்துகிறது.
- source_word: μεμαρτύρηκεν
  choice: சாட்சி அளித்திருக்கிறார்
  rationale: நிறைவேறிய செயலும் அதன் தொடர்ந்த முக்கியத்துவமும் உள்ள நிறைவுக்கால வினையின் நுட்பத்தை ‘அளித்திருக்கிறார்’ வெளிப்படுத்துகிறது.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: தமது மகனைக் குறித்து
  rationale: περί என்பதன் ‘குறித்து’ என்ற பொருளையும், எழுவாயான கடவுளையே சுட்டும் αὐτοῦ என்பதையும் இயல்பான மரியாதைத் தற்சுட்டுப் பெயரான ‘தமது’ மூலம் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀνθρώπων என்பதன் பொதுப்பொருள்
  choice: மனிதர்களின்
  alternative: ஆண்களின்
  rationale: கிரேக்க ஆண்பால் பன்மை வடிவம் இங்கு பாலினத்தால் வரையறுக்கப்படாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ‘மனிதர்களின்’ என்பது மனிதச் சாட்சிக்கும் கடவுளின் சாட்சிக்கும் இடையிலான எதிர்மறையைத் துல்லியமாகத் தருகிறது.
- issue: இரண்டாவது ὅτι என்பதன் இலக்கணப் பணி
  choice: கடவுளின் சாட்சியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் கூற்று
  alternative: ‘ஏனெனில் அவர் தமது மகனைக் குறித்து சாட்சி அளித்திருக்கிறார்’ என்ற காரணக் கூற்று
  rationale: αὕτη ἐστὶν ἡ μαρτυρία என்பதற்குப் பின் வரும் ὅτι, அந்தச் சாட்சி என்ன என்பதை விளக்கும் உள்ளடக்கக் கூற்றாக இயல்பாகப் புரிகிறது. எனினும் காரணப் பொருளும் இலக்கண ரீதியாகச் சாத்தியமானதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சாட்சி’ என்ற முக்கியச் சொல் வசனத்தின் சொல்லாட்சித் திரும்புரையைப் பாதுகாக்க ஒரேவிதமாகப் பயன்படுத்தப்பட்டுள்ளது; ‘தமது’ என்பது கடவுளைக் குறிக்கும் இயல்பான மரியாதைத் தற்சுட்டு வடிவம்.
