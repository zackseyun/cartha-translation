id: 1JN.5.18
reference: 1 John 5:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: ta
  text: கடவுளால் பிறந்த ஒவ்வொருவரும் தொடர்ந்து பாவம் செய்வதில்லை[a] என்று நாம் அறிவோம். மாறாக, கடவுளால் பிறந்தவர் அவரைக் காக்கிறார்[b]; தீயவன் அவரைத் தீண்டுவதில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொடர்ந்து பாவம் செய்வதில்லை’ என்பது கிரேக்க நிகழ்கால வினையின் தொடர்ச்சியான அல்லது வழக்கமான செயல் சார்ந்த பொருளை வெளிப்படுத்துகிறது. கடவுளால் பிறந்தவர் ஒருபோதும் எந்தப் பாவமும் செய்வதில்லை என்று இது கட்டாயமாகக் கூறுவதில்லை; 1 யோவான் 1:8–10; 2:1 ஆகியவற்றை ஒப்பிடுக.
    reason: aspect_and_cross_reference
  - marker: b
    text: ‘கடவுளால் பிறந்தவர்’ என்பது இயேசுவாகிய மகனைக் குறிக்கிறது என்றும், அவர் விசுவாசியைக் காக்கிறார் என்றும் பலர் புரிந்துகொள்கிறார்கள். வேறு சிலர் இதை விசுவாசி ‘தன்னைக் காத்துக்கொள்கிறார்’ என்று புரிந்துகொள்கிறார்கள்; சில கிரேக்கக் கையெழுத்துப் பிரதிகளிலும் ‘தன்னை’ என்ற வாசகம் உள்ளது.
    reason: alternative_reading_and_textual_variant
  - marker: c
    text: ‘தீண்டுதல்’ என்பது இங்கே தீங்கு செய்யும்படி ஒருவரைப் பற்றிக்கொள்ளுதல் என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: நாம் அறிந்திருக்கிறோம்
  rationale: οἶδα நிகழ்கால நிலையை உணர்த்தும் நிறைவுவடிவ வினை; தமிழில் உறுதியான தற்போதைய அறிவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: கடவுளால் பிறந்த ஒவ்வொருவரும்
  rationale: πᾶς ὁ என்பது ஒவ்வொருவரையும் தனித்தனியாக உள்ளடக்குகிறது; நிறைவுவடிவப் பெயரெச்சம் பிறப்பால் உண்டான தொடரும் நிலையைக் குறிக்கிறது. ‘கடவுளால் பிறந்த’ என்பது யோவானின் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: οὐχ ἁμαρτάνει
  choice: தொடர்ந்து பாவம் செய்வதில்லை
  rationale: நிகழ்கால வினையின் தொடர்ச்சியான அல்லது வழக்கமான செயல் சார்ந்த இயல்பை வெளிப்படுத்துகிறது; விசுவாசி ஒருபோதும் பாவமே செய்வதில்லை என்ற பொருளைத் தேவையின்றி திணிப்பதில்லை.
- source_word: ἀλλ’
  choice: மாறாக
  rationale: முந்தைய கூற்றுக்கும் அடுத்த பாதுகாப்புக் கூற்றுக்கும் இடையிலான வலுவான எதிர்மறை மாற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: கடவுளால் பிறந்தவர்
  rationale: இறந்தகாலப் பெயரெச்சத்தின் சொற்தொடரைப் பேணுகிறது; இது விசுவாசியையா அல்லது இயேசுவையா குறிக்கிறது என்ற உண்மையான தெளிவின்மையை முதன்மை உரை தீர்மானிக்கவில்லை.
- source_word: τηρεῖ αὐτόν
  choice: அவரைக் காக்கிறார்
  rationale: τηρέω என்பதன் காத்தல், பாதுகாத்தல் என்ற பொருளைத் தெளிவாகத் தருகிறது; αὐτόν என்பதை வேறொரு ஆண்பால் நபரைக் குறிக்கும் சுட்டுப்பெயராகப் பேணுகிறது.
- source_word: ὁ πονηρὸς
  choice: தீயவன்
  rationale: குறிப்புச் சுட்டியுடன் வரும் இச்சொல் யோவானின் பயன்பாட்டில் பொதுவாக அருவமான தீமையை அல்ல, தனிப்பட்ட தீயவனைச் சுட்டுகிறது.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: அவரைத் தீண்டுவதில்லை
  rationale: ἅπτομαι என்பதன் அடிப்படை ‘தொடு’ பொருளைப் பேணும் இலக்கியமான, புரிந்துகொள்ளத்தக்க தமிழ்; சூழலில் தீங்கு செய்யப் பற்றிக்கொள்ளுதல் என்ற நிழற்பொருளுக்கும் இடமளிக்கிறது.
theological_decisions:
- issue: οὐχ ἁμαρτάνει என்ற நிகழ்காலக் கூற்றின் பொருள்
  choice: தொடர்ந்து அல்லது வழக்கமாகப் பாவம் செய்வதை மறுக்கும் கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: கடவுளால் பிறந்தவர் எந்த ஒரு பாவமும் செய்வதில்லை என்ற முழுமையான கூற்று.
  rationale: கிரேக்க நிகழ்காலத்தின் தொடர்நிலை இயல்புக்கும் 1 யோவான் 1:8–10; 2:1 ஆகிய இடங்களில் விசுவாசிகளின் பாவம் ஒப்புக்கொள்ளப்படுவதற்கும் இது பொருந்துகிறது; அதேவேளை வசனத்தின் நெறிசார் வலிமையை நீக்கவில்லை.
- issue: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ என்பவரின் அடையாளம்
  choice: ‘கடவுளால் பிறந்தவர்’ என்று அடையாளத்தைத் தீர்மானிக்காமல் வைக்கப்பட்டது.
  alternative: இது தன்னைக் காத்துக்கொள்ளும் விசுவாசியைக் குறிக்கலாம்; அல்லது விசுவாசியைக் காக்கும் இயேசு கிறிஸ்து, கடவுளின் மகன், என்பவரைக் குறிக்கலாம்.
  rationale: கிரேக்கச் சொற்றொடர் இரு விளக்கங்களுக்கும் இடமளிக்கிறது. முதன்மை உரையில் ‘மகன்’ அல்லது ‘தான்’ என்பதைச் சேர்ப்பது மூலத்தில் உள்ள இறையியல் பதற்றத்தை முன்கூட்டியே தீர்த்துவிடும்.
- issue: αὐτόν மற்றும் αὐτοῦ ஆகிய சுட்டுப்பெயர்களின் குறிப்பு
  choice: இரண்டையும் பாதுகாக்கப்படும் நபரைக் குறிக்கும் ‘அவர்/அவரை’ வடிவங்களில் மொழிபெயர்க்கப்பட்டது.
  alternative: முதல் சுட்டுப்பெயரை தன்மறுப்பொருளில் ‘தன்னைக்’ என்று புரிந்துகொள்ளுதல்.
  rationale: SBLGNT உரையில் αὐτόν என்பது தன்மறுப்பெயர் அல்ல. எனவே ‘அவரை’ என்பது வடிவத்துக்கு நெருக்கமானது; ‘தன்னை’ என்ற பழமையான வாசிப்பு/விளக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கடவுள்’, ‘பாவம்’, ‘தீயவன்’ போன்ற பொதுவாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டன. செயற்பாட்டின் தொடர்நிலை வெளிப்படுமாறு ‘தொடர்ந்து’ சேர்க்கப்பட்டது; மூலத்தின் தெளிவின்மை இரண்டாம் வாக்கியத்தில் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டது.
