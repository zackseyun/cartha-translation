  naturalness: The Tamil is generally modern and readable. Reordering the sentence so that ‘except’ is overtly expressed produces a more natural, self-contained rhetorical question in formal modern Tamil.
  terminology: ‘உலகம்,’ ‘இயேசு,’ and ‘கடவுளின் மகன்’ are appropriate modern-standard Tamil renderings. ‘நம்புகிறவர்’ suitably retains the verbal, representative force of the Greek participle.
