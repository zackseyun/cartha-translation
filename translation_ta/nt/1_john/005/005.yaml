  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: ta
  text: இயேசு கடவுளின் மகன் என்று நம்புகிறவரைத் தவிர, உலகத்தை வெல்கிறவர் யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “உலகத்தை வெல்கிறவன் … நம்புகிறவன்.” கிரேக்கத்தில் ஆண்பால் ஒருமை நிகழ்காலப் பங்கேற்புகள் பொதுவான பிரதிநிதித்துவப் பொருளில் பயன்படுத்தப்பட்டுள்ளன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς δέ ἐστιν
  choice: யார்?
  rationale: δέ முந்தைய வசனத்துடன் மென்மையான தொடர்பை ஏற்படுத்துகிறது; தமிழில் தனியாக ‘மேலும்’ அல்லது ‘ஆனால்’ சேர்ப்பது இயல்பற்றதாக இருப்பதால், தொடர்ச்சியைச் சூழல் தாங்கும்படி நேரடியான வினாவாக மொழிபெயர்க்கப்பட்டது.
- source_word: ὁ νικῶν
  choice: வெல்கிறவர்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்புவினை; தொடர்ச்சியான அல்லது இயல்பான செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ‘வர்’ பொதுப்படையான ஒருமையாகச் செயல்படுகிறது.
- source_word: τὸν κόσμον
  choice: உலகத்தை
  rationale: யோவானின் பயன்பாட்டில் கடவுளுக்கு எதிரான உலக ஒழுங்கைச் சுட்டக்கூடும்; ஆனால் மூலத்தில் உள்ள ‘உலகம்’ என்பதைக் கருத்துவிரிவாக்கமின்றி வைத்திருக்கிறது.
- source_word: εἰ μὴ
  choice: …தானே?
  rationale: 'இந்த மறைமுக விடையுள்ள வினாவில் உள்ள விலக்கி வரையறுக்கும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது: வேறு யாருமல்ல, அப்படிப்பட்டவரே.'
- source_word: ὁ πιστεύων
  choice: நம்புகிறவர்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்புவினையின் செயற்பொருளையும் பண்புப்பொருளையும் காக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: நம்பிக்கையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணத்தைக் குறிக்கவில்லை.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: கடவுளின் மகன்
  rationale: இயேசுவின் அடையாளத்தைப் பற்றிய கிறிஸ்துவியல் பட்டத்தை நேரடியாகவும் இயல்பான தமிழிலும் காக்கிறது.
theological_decisions:
- issue: ὁ νικῶν மற்றும் ὁ πιστεύων என்ற ஆண்பால் ஒருமைப் பங்கேற்புவினைகளின் பிரதிநிதித்துவப் பயன்பாடு
  choice: வெல்கிறவர் / நம்புகிறவர்
  alternative: வெல்கிற ஆண் / நம்புகிற ஆண்; வெல்பவர் / விசுவாசி
  rationale: கிரேக்க வடிவங்கள் இலக்கணரீதியாக ஆண்பால் ஒருமையாக இருந்தாலும், பொதுவான பிரதிநிதித்துவப் பொருளைக் கொண்டவை. தமிழ் ‘வர்’ பாலினத்தை தேவையின்றிக் குறிப்பாக்காமல் ஒருமைப் பிரதிநிதித்துவத்தையும் வினைத் தன்மையையும் காக்கிறது.
- issue: ὁ υἱὸς τοῦ θεοῦ என்ற கிறிஸ்துவியல் அறிக்கை
  choice: கடவுளின் மகன்
  alternative: தேவனுடைய குமாரன்
  rationale: மூலத்தின் அடையாள அறிக்கையை விரிவாக்கவோ குறைக்கவோ செய்யாமல், நவீன பொதுத்தமிழில் தெளிவாகத் தருகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ். மறைமுக விடையுள்ள வினாவின் வலிமையை ‘யார்? … தானே?’ என்ற இயல்பான அமைப்பு காக்கிறது; ‘உலகம்’ என்பதன் யோவானிய இறையியல் நிழற்பொருள் விளக்கமாக உரைக்குள் சேர்க்கப்படவில்லை.
