id: 1JN.5.20
reference: 1 John 5:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: ta
  text: தேவனுடைய மகன் வந்திருக்கிறார் என்றும், உண்மையானவரை நாம் அறிந்துகொள்வதற்காக அவர் நமக்குப் புரிந்துகொள்ளும் ஆற்றலைத் தந்திருக்கிறார் என்றும் நாம் அறிவோம். நாம் உண்மையானவரில், அவருடைய மகனாகிய இயேசு மேசியாவில் இருக்கிறோம். இவரே உண்மையான தேவனும் நித்திய வாழ்வுமாய் ஆவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இவரே’ என்பது குறிப்பாக இயேசு மேசியாவைக் குறிக்கலாம்; ஆனால் சிலர் அது முந்தைய சொற்றொடரில் வரும் ‘உண்மையானவர்’, அதாவது பிதாவைக் குறிக்கிறது என்று புரிந்துகொள்கிறார்கள்.
    reason: οὗτός என்ற சுட்டுப்பெயரின் முன்சுட்டு குறித்து இரு இலக்கண-விளக்க வாய்ப்புகள் உள்ளன.
lexical_decisions:
- source_word: οἴδαμεν
  choice: நாம் அறிவோம்
  rationale: οἶδα வடிவத்தில் நிறைவுக்காலமாக இருந்தாலும், இங்கு நிலையான நிகழ்கால அறிவைத் தெரிவிக்கிறது.
- source_word: ἥκει
  choice: வந்திருக்கிறார்
  rationale: வந்து சேர்ந்த நிகழ்வையும் அதன் தற்போதைய விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δέδωκεν
  choice: தந்திருக்கிறார்
  rationale: கொடுக்கப்பட்ட வரம் தொடர்ந்து விளைவுடையதாக இருப்பதை நிறைவுக்காலத் தமிழ் வடிவம் காக்கிறது.
- source_word: διάνοιαν
  choice: புரிந்துகொள்ளும் திறனை
  rationale: வெறும் ‘மனம்’ என்பதைவிட, உண்மையை உணரும் ஆற்றல் என்ற சூழல்சார் பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: ἵνα γινώσκωμεν
  choice: நாம் அறிந்துகொள்வதற்காக
  rationale: ἵνα உடன் வரும் நோக்கப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது; தொடர்ச்சியான அறிதலுக்கான வாய்ப்பையும் மூடுவதில்லை.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: உண்மையானவரை / உண்மையானவரில்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் உரிச்சொல்லையும், இரு இடங்களிலுமுள்ள யோவானிய மறுபடியுரைத்தலையும் காக்கிறது.
- source_word: ἐσμὲν ἐν
  choice: நாம் ... இருக்கிறோம்
  rationale: ‘நிலைத்திருக்கிறோம்’ அல்லது ‘ஒன்றுபட்டிருக்கிறோம்’ என்ற விளக்கச் சேர்க்கைகள் இன்றி கிரேக்கத்தின் எளிய உறவுமொழியைப் பாதுகாக்கிறது.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: அவருடைய மகனாகிய ... மேசியாவில்
  rationale: உடைமை உறவையும், ‘இல்’ என்ற யோவானிய உறவுக் கூறையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἰησοῦ Χριστῷ
  choice: இயேசு மேசியா
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைக் கொண்டிருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: οὗτός
  choice: இவரே
  rationale: அருகிலுள்ள தனிநபரைக் குறிப்பதற்கான சுட்டுப்பெயரின் வலிமையைத் தமிழில் நேரடியாகக் காக்கிறது; அதன் முன்சுட்டு குறித்த ambiguity அடிக்குறிப்பில் விடப்படுகிறது.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: உண்மையான தேவன்
  rationale: கிரேக்கப் பயனையும் யோவானிய சொல்வழக்கையும் நேரடியாகவும் மரியாதையான தமிழிலும் வழங்குகிறது.
- source_word: ζωὴ αἰώνιος
  choice: நித்திய வாழ்வு
  rationale: யோவானிய இலக்கியத்தில் வழக்கமான கருத்தை, காலநீட்சி மற்றும் வாழ்வின் தன்மை ஆகிய இரண்டையும் தாங்கும் இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος என்பதில் οὗτός என்பதன் முன்சுட்டு
  choice: முதன்மை உரையில் ‘இவரே’ என்பது அருகிலுள்ள ‘இயேசு மேசியா’வைக் குறிப்பதாக இயல்பாக வாசிக்க இடமளிக்கப்பட்டுள்ளது.
  alternative: சிலர் ‘இவரே’ என்பதை முந்தைய ‘உண்மையானவர்’, அதாவது பிதா, என்பதைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
  rationale: இலக்கணரீதியாக அருகிலுள்ள தனிநபர் முன்சுட்டு இயேசு மேசியா என்பதே இயல்பான வாசிப்பு; ஆயினும் வரலாற்றில் விவாதிக்கப்பட்ட மாற்றுப் புரிதலை உரை மௌனமாக நீக்காமல் அடிக்குறிப்பில் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘தேவன்’, ‘மேசியா’, ‘நித்திய வாழ்வு’ ஆகியவை நிலையான தெய்வவியல் சொற்களாக வைக்கப்பட்டுள்ளன; கிரேக்கத்தின் ‘உண்மையானவர்’ மற்றும் ‘...இல் இருக்கிறோம்’ என்ற மறுபடியுரைத்தலும் உறவுமொழியும் பாதுகாக்கப்பட்டுள்ளன.
