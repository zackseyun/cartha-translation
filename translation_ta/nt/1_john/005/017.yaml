source:
  edition: SBLGNT
  text: πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/017.yaml
  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: ta
  text: எல்லா அநீதியும் பாவமே[a]; மரணத்திற்கு இட்டுச் செல்லாத பாவமும் உண்டு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாத் தவறான செயலும் பாவமே” அல்லது “எல்லா நீதியின்மையும் பாவமே.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மரணத்தில் முடிவடையாத பாவமும் உண்டு”; இன்னும் சொல் நெருக்கமாக, “மரணத்தை நோக்கியிராத பாவமும் உண்டு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: எல்லா
  rationale: கட்டுருபு இல்லாத ஒருமைச் சொல்லான ἀδικίαவுடன் சேர்ந்து, விதிவிலக்கற்ற முழுமையைக் குறிக்கிறது; ‘எல்லா’ என்பது இயல்பான தமிழில் அந்த விரிவைப் பேணுகிறது.
- source_word: ἀδικία
  choice: அநீதி
  rationale: தவறான செயல், நீதியின்மை, அநீதி ஆகிய பொருள் வாய்ப்புகளில், யோவானின் பரந்த அறநெறி மற்றும் இறையியல் கருத்தை ‘அநீதி’ சுருக்கமாகப் பேணுகிறது; இதை சமூக அநீதிக்கு மட்டும் மட்டுப்படுத்தவில்லை.
- source_word: ἁμαρτία
  choice: பாவம்
  rationale: இரு இடங்களிலும் ἁμαρτίαவின் வழக்கமானதும் சூழலுக்குப் பொருத்தமானதுமான தமிழ் இணைச்சொல்.
- source_word: καὶ
  choice: ; … உண்டு
  rationale: முதல் பொதுக்கூற்றுடன் அடுத்த தகுதிப்படுத்தும் கூற்றை இணைக்கிறது. தமிழில் அரைப்புள்ளியும் ‘உண்டு’ என்ற அமைப்பும் அந்த இணைப்பை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: οὐ πρὸς θάνατον
  choice: மரணத்திற்கு இட்டுச் செல்லாத
  rationale: πρὸς என்ற சொல்லின் திசை அல்லது விளைவு சார்ந்த பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; முந்தைய வசனத்தின் சொல்லாட்சியுடனும் பொருந்துகிறது.
- source_word: θάνατον
  choice: மரணம்
  rationale: மூலத்தில் மரணம் உடல்சார்ந்ததா, ஆவிக்குரியதா, இறுதித் தீர்ப்பைக் குறிப்பதா என்று விளக்கப்படாததால், எந்தத் தகுதிப்பெயரும் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘மரணத்திற்கு இட்டுச் செல்லாத பாவம்’ என்பதில் ‘மரணம்’ எதைக் குறிக்கிறது?
  choice: விளக்கத் தகுதிப்பெயர் சேர்க்காமல் ‘மரணம்’ என்றே மொழிபெயர்த்தல்
  alternative: உடல் மரணம்; ஆவிக்குரிய மரணம்; இறுதி ஆக்கினைத் தீர்ப்பு
  rationale: கிரேக்க மூலத்தில் θάνατον என்று மட்டுமே உள்ளது. அதன் இறையியல் பொருளை மொழிபெயர்ப்பிலேயே முடிவுசெய்யாமல், மூலத்தின் பொருள் திறப்பைப் பேணுகிறது.
- issue: ἀδικίαவின் அறநெறி மற்றும் இறையியல் பரப்பு
  choice: முதன்மை உரையில் ‘அநீதி’
  alternative: தவறான செயல்; நீதியின்மை
  rationale: இக்கூற்று சட்ட அல்லது சமூக அநீதியை மட்டும் பற்றியது அல்ல; பரந்த அறநெறிக் கூற்றாகும். ‘அநீதி’ அந்த விரிவையும் ‘நீதி’ சார்ந்த கருத்துத் தொடர்பையும் பேணுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அநீதி’, ‘பாவம்’, ‘மரணம்’ ஆகிய பரிச்சயமான இறையியல் சொற்கள் வைக்கப்பட்டுள்ளன; அதேவேளை ‘இட்டுச் செல்லாத’ என்பது πρὸς θάνατον என்பதன் திசை/விளைவு நுணுக்கத்தை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
