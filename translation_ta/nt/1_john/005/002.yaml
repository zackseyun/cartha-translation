id: 1JN.5.2
reference: 1 John 5:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν τούτῳ γινώσκομεν ὅτι ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ, ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ⸀ποιῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: ta
  text: நாம் கடவுளிடம் அன்புகூர்ந்து, அவருடைய கட்டளைகளைக் கடைப்பிடிக்கும்போது[a], கடவுளுடைய பிள்ளைகளிடம் அன்புகூருகிறோம் என்பதை இதனால் அறிந்துகொள்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூல கிரேக்கில் சொல்லுக்குச் சொல், “அவருடைய கட்டளைகளைச் செய்யும்போது”; “அவருடைய கட்டளைகளுக்குக் கீழ்ப்படியும்போது” என்றும் மொழிபெயர்க்கலாம். இங்கு வழக்கமாக ‘கடைப்பிடி’ என்று பொருள்படும் τηρέω அல்ல, ‘செய்’ என்று பொருள்படும் ποιέω என்ற வினைச்சொல் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: இதனால்
  rationale: ஒரு காரியத்தை அறிந்துகொள்வதற்கான அடையாளத்தையோ அடிப்படையையோ அறிமுகப்படுத்தும் யோவானிய சொற்றொடர். தமிழில் ‘இதனால்’ என்பது சுட்டுப்பொருளையும் இயல்பான நடையையும் காக்கிறது.
- source_word: γινώσκομεν
  choice: அறிந்துகொள்கிறோம்
  rationale: நிகழ்காலத்தில் தொடரும் அறிதல் அல்லது உணர்ந்தறிதலை வெளிப்படுத்துகிறது; ‘அறிந்துகொள்கிறோம்’ என்பது இங்கு இயல்பாக உள்ளது.
- source_word: ἀγαπῶμεν
  choice: அன்புகூருகிறோம்
  rationale: ἀγαπάω என்பதன் நிகழ்காலப் பொருளை dignified modern Tamil-இல் நேரடியாகத் தருகிறது.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: கடவுளுடைய பிள்ளைகள்
  rationale: τέκνα என்பதன் பாலினம் உள்ளடக்கிய குடும்ப உறவுப் பொருளை ‘பிள்ளைகள்’ இயல்பாகக் காக்கிறது.
- source_word: ὅταν
  choice: எப்போது ... அப்போது என்ற பொருளில் ‘-ும்போது’
  rationale: நிகழ்கால subjunctive உடன் வரும் கால-நிபந்தனைத் தொடர்பை தமிழின் ‘-ும்போது’ கட்டமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν θεὸν
  choice: கடவுளிடம்
  rationale: அன்பின் இலக்கை நவீனத் தமிழில் இயல்பாகக் குறிக்க ‘-ிடம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: அவருடைய கட்டளைகளைக் கடைப்பிடிக்கிறோம்
  rationale: ποιέω என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், கட்டளைகளுடன் ‘கடைப்பிடி’ என்பது தெளிவான, இயல்பான தமிழ்; மூலத்தின் குறிப்பான வினைச்சொல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: கடவுளுடைய பிள்ளைகளிடம் காட்டும் அன்புக்கும் கடவுளிடம் காட்டும் அன்புக்கும் உள்ள தொடர்பு
  choice: கடவுளிடம் அன்புகூருவதும் அவருடைய கட்டளைகளைக் கடைப்பிடிப்பதும், கடவுளுடைய பிள்ளைகளிடம் நாம் அன்புகூருவதை அறியும் அடையாளமாக வசனத்தின் சொற்களின்படியே வழங்கப்பட்டுள்ளது.
  alternative: இதை முற்றிலும் சான்றாகவோ, காரணமாகவோ, அன்பின் வரையறையாகவோ விளக்குதல்.
  rationale: கிரேக்க உரை இந்தத் தொடர்பைச் சுருக்கமாக முன்வைக்கிறது; அதன் தர்க்கத் தொடர்பை ஒரே இறையியல் விளக்கமாகத் தீர்மானிக்காமல் உள்ளார்ந்த அழுத்தத்தை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் முடிவில் வரும் அறிதலுக்கான அடிப்படை, தமிழில் தெளிவுக்காக முன்வைக்கப்பட்டுள்ளது; கருத்துத் தொடர்பு மாற்றப்படவில்லை.
