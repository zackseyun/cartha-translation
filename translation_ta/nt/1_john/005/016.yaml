  to: ஒருவர் தன் சகோதரன்[a] மரணத்திற்கு இட்டுச் செல்லாத பாவம் செய்வதைக் கண்டால், அவர் வேண்டிக்கொள்வார்; கடவுள் அந்தச் சகோதரனுக்கு வாழ்வைக் கொடுப்பார்[c]—அதாவது, மரணத்திற்கு இட்டுச் செல்லாத பாவம் செய்கிறவர்களுக்கு. மரணத்திற்கு இட்டுச் செல்லும் பாவம் உண்டு.[b] அதைக் குறித்து அவர் வேண்டிக்கொள்ள வேண்டும் என்று நான் சொல்லவில்லை.
  rationale: The revision preserves the source’s unresolved theological ambiguity and its restrained statement about requesting prayer. It corrects the singular/plural mismatch in the difficult dative explanatory phrase, removes unnecessary progressive force, clarifies that the life is given to the sinning brother, and corrects the explanatory footnote concerning the implicit Greek subject.
