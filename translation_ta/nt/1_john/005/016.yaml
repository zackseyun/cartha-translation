source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: ta
  text: ஒருவர் தன் சகோதரன்[a] மரணத்திற்கு இட்டுச் செல்லாத பாவம் செய்வதைக் கண்டால், அவர் வேண்டிக்கொள்வார்; கடவுள் அந்தச் சகோதரனுக்கு வாழ்வைக் கொடுப்பார்[c]—அதாவது, மரணத்திற்கு இட்டுச் செல்லாத பாவம் செய்கிறவர்களுக்கு. மரணத்திற்கு இட்டுச் செல்லும் பாவம் உண்டு.[b] அதைக் குறித்து அவர் வேண்டிக்கொள்ள வேண்டும் என்று நான் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரன்’ என்பது கிரேக்கத்தில் ஒருமை ஆண்பால் சொல்; இச்சூழலில் அது உடன் விசுவாசியைக் குறிக்க வாய்ப்புள்ளது.
    reason: cultural_note
  - marker: b
    text: இங்கு ‘மரணம்’ என்பது உடல் மரணமா, ஆவிக்குரிய மரணமா, இறுதித் தண்டனையா என்பதை கிரேக்க உரை குறிப்பிடவில்லை.
    reason: theological_ambiguity
  - marker: c
    text: கிரேக்கத்தில் ‘வாழ்வைக் கொடுப்பார்’ என்பதன் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; வேண்டுதலின் சூழலைக் கருத்தில் கொண்டு ‘கடவுள்’ என்பது வெளிப்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφὸν
  choice: சகோதரன்
  rationale: கிரேக்கச் சொல் ஒருமை ஆண்பாலில் உள்ளது; யோவானின் பயன்பாட்டில் இது பொதுவாக கிறிஸ்தவச் சமூகத்தைச் சேர்ந்த உடன் விசுவாசியைக் குறிக்கிறது. மூலத்தின் வடிவத்தை முதன்மை உரையில் காக்கிறது.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: பாவத்தைச் செய்துகொண்டிருப்பதை
  rationale: வினையெச்சத்துடன் அதே வேருடைய செயப்படுபொருள் வருவது பாவச் செயலைக் குறிப்பாகச் சுட்டுகிறது; தமிழில் இயல்பாகவும் தொடரும் செயலை உணர்த்துமாறும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μὴ πρὸς θάνατον
  choice: மரணத்திற்கு இட்டுச் செல்லாத
  rationale: πρός இங்கு முடிவு அல்லது திசையை உணர்த்துகிறது. மரணம் உடல் மரணமா, ஆவிக்குரிய மரணமா, இறுதித் தண்டனையா என்பதைத் தீர்மானிக்காமல் மூலத்தின் தெளிவின்மையைக் காக்கிறது.
- source_word: αἰτήσει
  choice: அவர் வேண்டிக்கொள்வார்
  rationale: எதிர்கால வினை வடிவத்தைப் பாதுகாக்கிறது; சூழலில் இது அவர் செய்ய வேண்டிய செயலைக் குறிக்கும் கட்டளைநயத்தையும் உடையதாக இருக்கலாம்.
- source_word: δώσει αὐτῷ ζωήν
  choice: கடவுள் அவனுக்கு வாழ்வைக் கொடுப்பார்
  rationale: கிரேக்கத்தில் கொடுப்பவரைக் குறிக்கும் எழுவாய் வெளிப்படையாக இல்லை. வேண்டுதலின் சூழலில் கடவுளே வாழ்வைக் கொடுப்பவர் என்பது வலுவாகக் குறிக்கப்படுவதால், தமிழின் தெளிவுக்காக ‘கடவுள்’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ζωήν
  choice: வாழ்வு
  rationale: யோவானின் எழுத்துகளில் இறைவனிடமிருந்து வரும் வாழ்வைச் சுட்டும் செறிவான சொல்; ‘ஆவிக்குரிய வாழ்வு’ என்று பொருளைச் சுருக்காமல் பொதுச் சொல்லே வைக்கப்பட்டுள்ளது.
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: அதாவது, மரணத்திற்கு இட்டுச் செல்லாத பாவங்களைச் செய்கிறவர்களுக்கு
  rationale: சிக்கலான பன்மை வேற்றுமைத் தொடரை விளக்கநிலையில் கோட்டுக்குப் பின் அமைத்து, அது வாழ்வு பெறுகிறவர்களை விளக்குவதாகக் காட்டுகிறது; பன்மையையும் காக்கிறது.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: மரணத்திற்கு இட்டுச் செல்லும் பாவம் உண்டு
  rationale: மூலத்தின் சுருக்கமான, கட்டுரைச்சொல் இல்லாத அமைப்பை நெருக்கமாகக் காக்கிறது; இது ஒரு குறிப்பிட்ட பாவமா அல்லது ஒரு வகைப் பாவமா என்பதை அதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: அதைக் குறித்து அவர் வேண்டிக்கொள்ள வேண்டும் என்று நான் சொல்லவில்லை
  rationale: இது அவ்வாறு வேண்டுவதைக் கட்டாயமாகத் தடை செய்கிறது என்று வலுப்படுத்தாமல், ஆசிரியர் அவ்வாறு வேண்டுமெனக் கூறவில்லை என்ற மூலத்தின் அளவான கூற்றைக் காக்கிறது.
theological_decisions:
- issue: ‘மரணத்திற்கு இட்டுச் செல்லும் பாவம்’ என்பதில் ‘மரணம்’ எதைக் குறிக்கிறது
  choice: உடல், ஆவிக்குரிய நிலை, அல்லது இறுதித் தண்டனை என்று குறிப்பிடாமல் ‘மரணம்’ என்றே வைத்தல்
  alternative: தெய்வீகத் தீர்ப்பாக வரும் உடல் மரணம்; ஆவிக்குரிய அல்லது நித்திய மரணம்; இறுதிக்காலத் தண்டனை
  rationale: இந்த வசனம் மரணத்தின் இயல்பை வரையறுக்கவில்லை; ஆகவே சர்ச்சைக்குரிய இறையியல் கேள்வியை மொழிபெயர்ப்பு தீர்த்து வைக்கவில்லை.
- issue: ‘வாழ்வைக் கொடுப்பார்’ என்பதன் எழுவாய்
  choice: கடவுளை வெளிப்படையான எழுவாயாகக் குறிப்பிடுதல்
  alternative: ‘அவர் அவனுக்கு வாழ்வைக் கொடுப்பார்’ என்று எழுவாயின் அடையாளத்தை வெளிப்படுத்தாமல் விடுதல்; வேண்டுகிறவரையே கொடுப்பவராகக் கொள்ளுதல்
  rationale: கிரேக்கத்தில் எழுவாய் மறைமுகமாக இருந்தாலும், வேண்டுதலுக்குப் பதிலாக வாழ்வைக் கொடுப்பவர் கடவுள் என்பதே சூழலில் வலுவாகப் புரிகிறது. இதை அடிக்குறிப்பில் வெளிப்படையாகக் குறிக்கப்படுகிறது.
- issue: மரணத்திற்கு இட்டுச் செல்லும் பாவத்திற்காக வேண்டுதல் தடைசெய்யப்படுகிறதா
  choice: ‘வேண்டிக்கொள்ள வேண்டும் என்று நான் சொல்லவில்லை’ என்ற அளவான கூற்றைப் பாதுகாத்தல்
  alternative: ‘அதற்காக வேண்டிக்கொள்ளாதே’ என்று நேரடித் தடையாக மொழிபெயர்த்தல்
  rationale: οὐ ... λέγω ἵνα என்ற அமைப்பு நேரடியாகத் தடை விதிப்பதைவிட, ஆசிரியர் அத்தகைய வேண்டுதலைக் கோரவில்லை என்று சொல்கிறது; இந்த வேறுபாடு காக்கப்பட்டுள்ளது.
translation_notes:
  register: இன்றைய பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வேண்டிக்கொள்வார்’ என்பது ஜெபச் சூழலைத் தெளிவாக்குகிறது; ‘வாழ்வு’, ‘மரணம்’, ‘பாவம்’ ஆகிய இறையியல் செறிவுள்ள சொற்களின் தெளிவின்மை தேவையின்றி குறுக்கப்படவில்லை. ஆண்பால் ஒருமை ‘சகோதரன்’ மூலவடிவத்தைப் பாதுகாக்கிறது; அதன் சூழல் சார்ந்த விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
