reference: 1 John 5:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: ta
  text: தேவனுடைய மகனின் பெயரில் நம்பிக்கை வைக்கிற உங்களுக்கு, நித்திய வாழ்வு உண்டு என்பதை நீங்கள் அறிந்துகொள்ளும்படி இவற்றை எழுதியிருக்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: இவற்றை
  rationale: நடுநிலைப் பன்மைச் சுட்டுப்பெயரின் வடிவத்தையும், கடிதத்தின் உள்ளடக்கத்தை அது சுட்டுவதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἔγραψα
  choice: எழுதியிருக்கிறேன்
  rationale: கடிதம் எழுதப்பட்டு வாசகர்களிடம் வந்து சேர்ந்துள்ள நிறைவுற்ற செயலை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἵνα εἰδῆτε
  choice: நீங்கள் அறிந்துகொள்வதற்காக
  rationale: ἵνα குறிக்கும் நோக்கத்தையும் εἰδῆτε குறிக்கும் உறுதியான அறிவையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: யோவானின் வழக்கிலுள்ள நிலையான இறையியல் சொல்லாட்சியைப் பாதுகாத்து, காலநீட்சியையும் தேவனுடனான வாழ்வின் தன்மையையும் சுட்டுகிறது.
- source_word: ἔχετε
  choice: உங்களுக்கு ... உண்டு
  rationale: நித்திய வாழ்வு இப்போதே அவர்களிடம் உள்ளது என்ற நிகழ்கால உடைமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοῖς πιστεύουσιν
  choice: நம்பிக்கை வைக்கிற உங்களுக்கு
  rationale: இதை ὑμῖν என்பதற்கு விளக்க இணைப்பாகக் கொண்டு, மூலத்தின் தொடர்ச்சியான செயற்பாட்டு நுணுக்கத்தையும் நேரடி அழைப்பையும் காக்கிறது.
- source_word: πιστεύουσιν εἰς
  choice: பெயரில் நம்பிக்கை வைக்கிற
  rationale: εἰς உடன் வரும் πιστεύω வெறும் கருத்தொப்புதலை விட ஒருவர்மீது சார்ந்திருக்கும் நம்பிக்கையை உணர்த்துவதால், இயல்பான தமிழில் அதைக் காட்டுகிறது.
- source_word: τὸ ὄνομα
  choice: பெயர்
  rationale: வெளிப்படுத்தப்பட்ட ஆளுமையையும் அதிகாரத்தையும் குறிக்கும் வேதாகமச் சொல்லாட்சியை விளக்கவுரையாக்காமல் காக்கிறது.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: தேவனுடைய மகன்
  rationale: கிரேக்க உரையின் கிறிஸ்துவியல் பட்டத்தையும் உரிமைத் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: τοῖς πιστεύουσιν என்ற சொற்றொடரின் இடமும் தொடரியல் தொடர்பும்
  choice: ὑμῖν என்பதுடன் இணைத்து, “தேவனுடைய மகனின் பெயரில் நம்பிக்கை வைக்கிற உங்களுக்கு” என்று மொழிபெயர்த்தல்
  alternative: உறுதியளிக்கும் உட்பிரிவுக்குப் பிறகு மீண்டும் விளக்கும் வகையில், “உங்களுக்கு நித்திய வாழ்வு உண்டு என்பதை நீங்கள் அறிந்துகொள்வதற்காக—தேவனுடைய மகனின் பெயரில் நம்பிக்கை வைக்கிறவர்களுக்கு—இவற்றை எழுதினேன்” என்று அமைத்தல்
  rationale: கிரேக்கச் சொல்வரிசை இரு தொடர்புகளுக்கும் இடமளிக்கிறது. முதன்மை உரையில் ὑμῖν என்பதற்கான விளக்க இணைப்பாக எடுத்துக்கொள்வது இயல்பான தமிழையும் கருத்தின் சாத்தியமான ஓட்டத்தையும் தருகிறது; உண்மையான சொல்வரிசைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. “நித்திய வாழ்வு,” “தேவனுடைய மகன்,” “பெயரில் நம்பிக்கை வைத்தல்” ஆகிய வேதாகமச் சொல்லாட்சிகள் இயல்பான நடையில் பாதுகாக்கப்பட்டுள்ளன; கிரேக்கச் சொல்வரிசையின் உண்மையான தொடரியல் தெளிவின்மை [a] அடிக்குறிப்பில் தரப்பட்டுள்ளது.
