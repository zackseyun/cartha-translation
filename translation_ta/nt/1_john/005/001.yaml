id: 1JN.5.1
reference: 1 John 5:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: ta
  text: இயேசுவே மெசியா[a] என்று நம்புகிற ஒவ்வொருவரும் கடவுளிடமிருந்து பிறந்திருக்கிறார்கள்[b]. பிறப்பித்தவரை அன்புகூருகிற ஒவ்வொருவரும் அவரிடமிருந்து பிறந்தவரையும் அன்புகூருகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கத்தில் Χριστός என்பது “அபிஷேகம் பெற்றவர்” என்ற பட்டம்.
    reason: alternative_reading
  - marker: b
    text: “பிறந்திருக்கிறார்கள்,” “பிறப்பித்தவர்,” “பிறந்தவர்” என்பவற்றுக்கு கிரேக்கத்தில் ஒரே வினைச்சொல்லின் வெவ்வேறு வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: நம்புகிற ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல் தன்மையுடைய நிகழ்காலப் பங்கேற்புவினையின் பொதுவான, தொடர்ச்சியான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: இயேசுவே மெசியா என்று
  rationale: ὁ χριστός இங்கு பெயராக அல்ல, வாக்களிக்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாக வருகிறது; தமிழின் வலியுறுத்தும் ‘ஏ’ விகுதி அடையாள அறிக்கையின் இயல்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: கடவுளிடமிருந்து பிறந்திருக்கிறார்
  rationale: ἐκ என்பதின் மூலாதாரப் பொருளையும், நிறைவுற்ற செயலும் அதன் தொடரும் விளைவும் கொண்ட perfect passive வடிவத்தையும் ‘பிறந்திருக்கிறார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: அன்புகூருகிற ஒவ்வொருவரும்
  rationale: பொதுவாக ஒருவரைச் சுட்டும் நிகழ்காலப் பங்கேற்புவினையைத் தெளிவாகவும் முதல் கூறுடன் இணையாகவும் தருகிறது.
- source_word: τὸν γεννήσαντα
  choice: பிறப்பித்தவரிடம்
  rationale: γεννάω என்பதின் செய்பாட்டு வடிவத்தையும், கடவுள் பிறப்பின் மூலமாக இருப்பதையும் காட்டுகிறது; ‘தந்தை’ என்று மூலத்தில் இல்லாத பட்டத்தைச் சேர்ப்பதில்லை.
- source_word: ἀγαπᾷ καὶ
  choice: அன்புகூருகிறார் ... -இடமும்
  rationale: καί தரும் ‘மேலும்/அவரிடமும்’ என்ற இணைப்புப் பொருளைத் தமிழில் பொருளின் வேற்றுமை உருபோடு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: அவரிடமிருந்து பிறந்தவரிடம்
  rationale: முன்னுள்ள γεννάω சொற்குடும்பத் தொடர்பையும் ἐξ αὐτοῦ குறிக்கும் மூலாதாரத்தையும் காக்கிறது; ‘அவருடைய பிள்ளை’ என்று விளக்கி வரம்பிடவில்லை.
theological_decisions:
- issue: γεννάω சொற்குடும்பம் குறிக்கும் கடவுளிடமிருந்து பிறத்தல்
  choice: ‘பிறந்திருக்கிறார் / பிறப்பித்தவர் / பிறந்தவர்’ என்ற ஒரே சொற்குடும்பத் தொடர்பை பயன்படுத்துதல்
  alternative: ‘கடவுளின் பிள்ளை / தந்தை / பிள்ளை’ என்று உறவுப்பெயர்களால் மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தின் பிறப்பித்தவர்–பிறந்தவர் இணைப்பைத் தெளிவாக வைத்துக்கொண்டு, மறுபிறப்பின் வரிசை அல்லது தன்மை குறித்து வசனம் சொல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் இருக்கிறது.
- issue: ὁ χριστός என்ற இயேசுவின் பட்டம்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இது பட்டத்தன்மையுள்ள அறிக்கை; ‘மெசியா’ என்பது அபிஷேகம் பெற்ற வாக்களிக்கப்பட்டவரைக் குறிக்கும் பொருளை வாசகருக்குக் காக்கிறது. வழக்கமான ‘கிறிஸ்து’ மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τὸν γεγεννημένον என்பவர் யார் என்பது
  choice: ‘அவரிடமிருந்து பிறந்தவர்’ என்று பொதுவான ஒருமையைப் பேணுதல்
  alternative: ‘கடவுளின் மற்ற பிள்ளைகள்’ அல்லது ‘இயேசு’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: மூலம் அந்த நபரை இங்கு மேலும் அடையாளப்படுத்தாமல் ஒருமைப் பங்கேற்புவினையைப் பயன்படுத்துகிறது; தமிழிலும் அந்த பரப்பைச் சுருக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அன்புகூருதல்’ யோவானின் கருத்துத் தொடருக்கு ஏற்ற இலக்கியத் தெளிவைத் தருகிறது; மிகப் பழமையான அல்லது சமயப் பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
