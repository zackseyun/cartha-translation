  source_fidelity: முதல் வாக்கியம் Πᾶς ὁ πιστεύων, ὅτι-உள்ளடக்கக் கூற்று, ἐκ τοῦ θεοῦ, மற்றும் perfect passive ஆகியவற்றைத் துல்லியமாகக் காக்கிறது. இரண்டாம் வாக்கியத்திலும் பிறப்பித்தவர்–பிறந்தவர் என்ற γεννάω சொற்குடும்ப இணைப்பு பாதுகாக்கப்பட்டுள்ளது. ஆனால் ἀγαπῶν/ἀγαπᾷ ஆகியவை நேரடிப் பொருளை ஏற்கின்ற வினைகள்; வரைவு அவற்றின் பொருள்களுக்கு இடப்பொருள் உருபான “-இடம்/-இடமும்” பயன்படுத்துகிறது. இதனால் ‘அவர்களிடம் அன்புகூருதல்’ என்ற இயல்பற்ற/சற்றே வேறுபட்ட கட்டமைப்பு உருவாகிறது. நேரடிப் பொருள் உருபான “-ஐ/-யையும்” தேவைப்படுகிறது.
  naturalness: “அன்புகூருகிற” என்பதுடன் “பிறப்பித்தவரை” மற்றும் “பிறந்தவரையும்” என்பவை நவீன நிலையான தமிழில் தெளிவான, இயல்பான வினை–பொருள் அமைப்பைத் தருகின்றன. “ஒவ்வொருவரும் … பிறந்திருக்கிறார்கள்” என்பது பொதுமைச் சுட்டலுக்கு இயல்பான மரியாதைப் பன்மை ஒத்திசைவை வழங்குகிறது.
  terminology: “மெசியா” பட்டத்தன்மையைப் பேணுகிறது; மாற்றாக “கிறிஸ்து” அடிக்குறிப்பில் சரியாகத் தரப்பட்டுள்ளது. “பிறந்திருக்கிறார்கள் / பிறப்பித்தவர் / பிறந்தவர்” ஒரே கிரேக்க வினைச்சொல் குடும்பத்தின் தொடர்பைச் சீராகக் காட்டுகின்றன; ‘தந்தை’ அல்லது ‘பிள்ளை’ போன்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
