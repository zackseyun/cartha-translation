    reason: lexical_alternative
  revision_rationale: The revision makes God’s agency in raising Jesus explicit through the correlative Tamil forms “தமது … அவரை … தாம்,” while retaining the verse’s connection to the preceding statement (“…செய்தீர்கள்”). It preserves the source’s restrained eschatological expression “the coming wrath” and the present, characterizing force of “the one who rescues.”
