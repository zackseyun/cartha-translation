revisions:
- from: மேலும், இறந்தோரிலிருந்து அவர் உயிர்த்தெழச் செய்த தமது மகனாகிய இயேசு வானத்திலிருந்து வரக் காத்திருக்கவும் செய்தீர்கள். வரவிருக்கும் கடுங்கோபத்திலிருந்து நம்மை மீட்கிறவர்[a] அவரே.
  to: மேலும், வானத்திலிருந்து தமது மகனாகிய இயேசுவுக்காகக் காத்திருக்கவும் செய்தீர்கள்; அவரை இறந்தோரிலிருந்து தாம் உயிர்த்தெழச் செய்தார். வரவிருக்கும் கடுங்கோபத்திலிருந்து நம்மை மீட்கிறவர் இயேசுவே.
  rationale: The revision makes God’s agency in raising Jesus explicit through the correlative Tamil forms “தமது … அவரை … தாம்,” while retaining the verse’s connection to the preceding statement (“…செய்தீர்கள்”). It preserves the source’s restrained eschatological expression “the coming wrath” and the present, characterizing force of “the one who rescues.”
