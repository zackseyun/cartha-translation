reference: 1 Thessalonians 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: ta
  text: மேலும், வானத்திலிருந்து தமது மகனாகிய இயேசுவுக்காகக் காத்திருக்கவும் செய்தீர்கள்; அவரை இறந்தோரிலிருந்து தாம் உயிர்த்தெழச் செய்தார். வரவிருக்கும் கடுங்கோபத்திலிருந்து நம்மை மீட்கிறவர் இயேசுவே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναμένειν
  choice: வரக் காத்திருக்கவும்
  rationale: எதிர்பார்ப்புடன் காத்திருக்கும் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது. வானத்திலிருந்து மகன் வருவார் என்பது கிரேக்கத் தொடரில் உள்ள கருத்திலேயே அடங்கியுள்ளது.
- source_word: υἱὸν αὐτοῦ
  choice: தமது மகன்
  rationale: கிறிஸ்துவுக்குரிய ‘மகன்’ என்னும் உறவுப்பெயரை விளக்கச் சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐκ τῶν οὐρανῶν
  choice: வானத்திலிருந்து
  rationale: கிரேக்கத்தில் பன்மை இருந்தாலும், இச்சூழலில் ஒருமையான ‘வானம்’ என்பதே இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: இறந்தோரிலிருந்து அவர் உயிர்த்தெழச் செய்த
  rationale: ἐκ τῶν νεκρῶν என்பதன் ‘இறந்தோரின் நடுவிலிருந்து’ என்ற நுண்பொருளைத் தக்கவைத்து, உயிர்த்தெழுதலை இயல்பாகச் சொல்கிறது.
- source_word: Ἰησοῦν
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்ற பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸν ῥυόμενον
  choice: மீட்கிறவர்
  rationale: நிகழ்காலப் பங்கேற்புவினையை இயல்பான பெயரெச்சத் தொடராகத் தருகிறது; இயேசுவை மீட்பவராக அடையாளப்படுத்தும் தொடர்ச்சியான தன்மையையும் காக்கிறது.
- source_word: ἐκ τῆς ὀργῆς
  choice: கடுங்கோபத்திலிருந்து
  rationale: ὀργή என்பதன் வலிமையை பொதுவான ‘கோபம்’ என்பதைவிடத் தெளிவாகக் காட்டுகிறது; அதை ‘தீர்ப்பு’ என்று விரிவுபடுத்தவில்லை.
- source_word: τῆς ἐρχομένης
  choice: வரவிருக்கும்
  rationale: நெருங்கிவரும் எதிர்காலக் கடுங்கோபத்தைக் குறிக்கும் பங்கேற்புவினையின் காலநோக்கைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ‘வரவிருக்கும் கடுங்கோபம்’ என்பதன் இயல்பு
  choice: அது இறுதித் தீர்ப்பா, இறுதிக்கால உபத்திரவமா, அல்லது பொதுவாக இறைவனுடைய கடுங்கோபமா என்று குறிப்பிடாமல் சொற்றொடரை அப்படியே வைத்தல்
  alternative: ‘வரவிருக்கும் தீர்ப்பு’ என்று மொழிபெயர்த்தல் அல்லது ஒரு குறிப்பிட்ட இறுதிக்கால நிகழ்வாக விளக்குதல்
  rationale: இவ்வசனம் அதன் குறிப்பிட்ட வடிவத்தைத் தானாக வரையறுக்கவில்லை. எனவே ஒரு தனிப்பட்ட இறுதிக்காலக் கோட்பாட்டைச் சேர்க்காமல் கிரேக்கத்தின் இறையியல் அழுத்தமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
- issue: ῥυόμενον என்னும் நிகழ்காலப் பங்கேற்புவினையின் காலவலிமை
  choice: ‘மீட்கிறவர்’
  alternative: ‘மீட்கப்போகிறவர்’ அல்லது ‘மீட்டுக்கொண்டிருக்கிறவர்’
  rationale: வரவிருக்கும் கடுங்கோபம் எதிர்கால நோக்கைக் கொடுத்தாலும், கிரேக்கம் செயலை வெளிப்படையாக எதிர்கால வினையாக மாற்றாமல் இயேசுவை மீட்பவராக அடையாளப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டுள்ளது. முந்தைய வசனத்தின் வாக்கிய அமைப்பைத் தொடரும் ἀναμένειν என்பதற்காக ‘காத்திருக்கவும் செய்தீர்கள்’ என இணைப்பு வெளிப்படுத்தப்பட்டுள்ளது. பழமையான ‘கோபாக்கினை’ தவிர்க்கப்பட்டு, ὀργή என்பதன் வலிமைக்காக ‘கடுங்கோபம்’ பயன்படுத்தப்பட்டுள்ளது.
