review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the recipients of thanksgiving, the constancy of thanksgiving, prayer, and the possible scope of ἀδιαλείπτως. However, its Tamil participial construction makes “remembering” the grammatical main action and “giving thanks” subordinate, whereas Εὐχαριστοῦμεν (“we give thanks”) is the Greek main verb and μνείαν ποιούμενοι is participial.
  naturalness: The wording is modern and readily understandable. Recasting the sentence so that “we give thanks” is the finite main clause produces a more faithful and equally natural Tamil sentence.
  terminology: “கடவுள்,” “நன்றி செலுத்துகிறோம்,” “ஜெபங்கள்,” and “நினைவுகூருகிறோம்” are appropriate modern-standard Tamil choices. “உங்கள் அனைவருக்காகவும்” is acceptable in this thanksgiving context and retains the inclusive force.
  issues:
  - severity: medium
    issue: Main-clause relationship is reversed.
    rationale: The draft says, in effect, “having given thanks … we remember,” making நினைவுகூருகிறோம் the main finite action. The Greek has “we give thanks” as the finite verb, with “making mention” as a participial accompanying action.
  revised_text: உங்கள் அனைவருக்காகவும் நாங்கள் எப்போதும் கடவுளுக்கு நன்றி செலுத்துகிறோம்; எங்கள் ஜெபங்களில் உங்களை இடைவிடாமல்[a] நினைவுகூருகிறோம்.
  revised_footnotes:
