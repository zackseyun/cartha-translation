translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபம்’ பரவலாகப் புரிந்துகொள்ளப்படும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; கிரேக்க வாக்கியத்தின் தொடர்ச்சியும் ἀδιαλείπτως என்பதன் தொடர்பு குறித்த தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
