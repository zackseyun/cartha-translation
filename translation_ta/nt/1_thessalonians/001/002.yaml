revisions:
- from: உங்கள் அனைவருக்காகவும் நாங்கள் எப்போதும் கடவுளுக்கு நன்றி செலுத்தி, எங்கள் ஜெபங்களில் உங்களை இடைவிடாமல்[a] நினைவுகூருகிறோம்.
  to: உங்கள் அனைவருக்காகவும் நாங்கள் எப்போதும் கடவுளுக்கு நன்றி செலுத்துகிறோம்; எங்கள் ஜெபங்களில் உங்களை இடைவிடாமல்[a] நினைவுகூருகிறோம்.
  rationale: The revision restores the Greek verbal hierarchy by making “நன்றி செலுத்துகிறோம்” the main verb and presenting remembrance in prayer as the accompanying statement. The footnote retains the syntactic ambiguity concerning the scope of ἀδιαλείπτως without forcing an interpretation.
