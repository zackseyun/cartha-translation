  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: ta
  text: உங்கள் அனைவருக்காகவும் நாங்கள் எப்போதும் கடவுளுக்கு நன்றி செலுத்துகிறோம்; எங்கள் ஜெபங்களில் உங்களை இடைவிடாமல்[a] நினைவுகூருகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இடைவிடாமல்” என்பது குறிப்பாக எங்கள் ஜெபங்களில் உங்களை நினைவுகூருவதைக் குறிக்கலாம்; அல்லது நன்றி செலுத்துவதை உள்ளடக்கிய முழுக் கூற்றுடனும் தொடர்புபடலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: நன்றி செலுத்தி ... நினைவுகூருகிறோம்
  rationale: நிகழ்கால முதலாம் நபர் பன்மையைத் தமிழில் இயல்பான தொடர்வாக்கியமாக அமைக்கிறது; நன்றி கடவுளை நோக்கியது என்பதையும் தெளிவாகக் காக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: நன்றியைப் பெறுபவரைக் குறிக்கும் வேற்றுமைப் பொருளை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: காலத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: περὶ πάντων ὑμῶν
  choice: உங்கள் அனைவருக்காகவும்
  rationale: περί என்பதன் தொடர்பு அல்லது அக்கறைப் பொருளையும் πάντων என்பதன் அனைவரையும் உள்ளடக்கும் வலியுறுத்தலையும் காக்கிறது.
- source_word: μνείαν ποιούμενοι
  choice: உங்களை ... நினைவுகூருகிறோம்
  rationale: ஜெபச் சூழலில் வரும் இந்த கிரேக்க மரபுத்தொடரின் பொருளை இயல்பாகத் தருகிறது. ‘குறிப்பிடுகிறோம்’ என்பது தமிழில் வெறும் வாய்மொழிக் குறிப்பாகத் தவறாகப் புரியக்கூடும்.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: எங்கள் ஜெபங்களில்
  rationale: ஜெபிக்கும் சூழல் அல்லது நேரத்தைக் குறிக்கும் கிரேக்கச் சொல்லாட்சியைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἀδιαλείπτως
  choice: இடைவிடாமல்
  rationale: தொடர்ந்து நிகழும் நிலையை வலுவாக வெளிப்படுத்துகிறது; கிரேக்கச் சொல்லின் வாக்கியத் தொடர்பில் உள்ள இருபொருள் வாய்ப்பை அடிக்குறிப்பில் காக்கிறது.
