source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: ta
  text: ஏனெனில், எங்கள் நற்செய்தி உங்களிடம் வெறும் வார்த்தையாக மட்டும் வரவில்லை; வல்லமையோடும், பரிசுத்த ஆவியோடும், மிகுந்த உறுதியோடும்[a] வந்தது. உங்கள் நன்மைக்காக நாங்கள் உங்களிடையே எப்படிப்பட்டவர்களாக இருந்தோம்[b] என்பது உங்களுக்கே தெரியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகுந்த முழு நிச்சயத்தோடும்” அல்லது “ஆழ்ந்த நம்பிக்கையோடும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களிடையே நாங்கள் எப்படிப்பட்டவர்களாக வெளிப்பட்டோம்.” “உங்கள் நன்மைக்காக” என்பதற்கு “உங்களுக்காக” அல்லது “உங்களால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: நற்செய்தி
  rationale: பவுலின் அறிவிப்பைக் குறிக்கும் நிறுவப்பட்ட, இயல்பான தமிழ் வேதாகமச் சொல்; சொல்லின் ‘நல்ல செய்தி’ என்ற அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: உங்களிடம் ... வந்தது
  rationale: இச்சூழலில் நற்செய்தி தெசலோனிக்கேயரைச் சென்றடைந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கத்தைச் சொற்சொல்லாக ‘உங்களுக்கு ஆனது’ என்று மாற்றுவதைத் தவிர்க்கிறது.
- source_word: ἐν λόγῳ μόνον
  choice: வெறும் வார்த்தையாக மட்டும்
  rationale: வாய்மொழி அறிவிப்பு மட்டுமே அல்ல என்பதையும், தொடர்ந்து வரும் வல்லமை மற்றும் பரிசுத்த ஆவியுடனான முரண்பாட்டையும் தெளிவாகக் காக்கிறது.
- source_word: ἐν δυνάμει
  choice: வல்லமையோடும்
  rationale: தொடர்ந்து வரும் ἐν தொடர்களின் இணை அமைப்பை தமிழில் ‘-ஓடும்’ எனக் காத்து, செயல்திறன் மிக்க தெய்வீக வல்லமையை உணர்த்துகிறது.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: பரிசுத்த ஆவியோடும்
  rationale: பவுலின் வழக்கிலும் இச்சூழலிலும் இச்சொற்றொடர் மனித ஆவிக்குரிய மனநிலையை அல்ல, பரிசுத்த ஆவியானவரைக் குறிக்கிறது.
- source_word: πληροφορίᾳ πολλῇ
  choice: மிகுந்த உறுதியோடும்
  rationale: முழு நிச்சயம், திடநம்பிக்கை, உறுதியான தாக்கம் ஆகிய பொருள் வரம்பை இயல்பான தமிழில் தருகிறது; அந்த உறுதி அறிவிப்பாளர்களிடமா, கேட்பவர்களிடமா, அல்லது நற்செய்தி வந்த விதத்திலா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
- source_word: καθὼς οἴδατε
  choice: என்பது உங்களுக்கே தெரியும்
  rationale: தெசலோனிக்கேயரின் நேரடி அறிவை உறுதிப்படுத்தும் καθώς என்பதன் வலியுறுத்தலை இயல்பான தமிழ் வாக்கிய முடிவில் வெளிப்படுத்துகிறது.
- source_word: οἷοι ἐγενήθημεν
  choice: நாங்கள் ... எப்படிப்பட்டவர்களாக இருந்தோம்
  rationale: இங்கு γίνομαι சூழலுக்கு ஏற்ப வெளிப்பட்ட குணத்தையும் நடத்தையையும் குறிக்கிறது. ‘ஆனோம்’ என்பதைவிட ‘இருந்தோம்’ இயல்பானது; ‘ஆண்கள்’ என்று வெளிப்படையாகச் சேர்க்காமல் பவுலையும் அவருடைய உடன் ஊழியர்களையும் துல்லியமாகக் குறிக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: அவர்களுடைய நடுவில் வாழ்ந்து நடந்துகொண்ட விதத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: δι’ ὑμᾶς
  choice: உங்கள் நன்மைக்காக
  rationale: διά + accusative இங்கு அவர்களுடைய பயன் அல்லது நலன் கருதிய நோக்கத்தைக் குறிக்கும் வாசிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πνεύματι ἁγίῳ என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியோடும்
  alternative: பரிசுத்தமான ஆவியோடு / ஆவிக்குரிய வல்லமையோடு
  rationale: பவுலின் பயன்பாட்டிலும், வெறும் வார்த்தைக்கு மாறாகச் செயல்படும் தெய்வீக வல்லமை குறித்த சூழலிலும், இது பரிசுத்த ஆவியானவரையே குறிக்கிறது.
- issue: πληροφορίᾳ πολλῇ என்பதன் பொருளும் அதன் உட்பொருள் சார்ந்தவரும்
  choice: மிகுந்த உறுதியோடும்
  alternative: முழு நிச்சயத்தோடும் / ஆழ்ந்த நம்பிக்கையோடும்
  rationale: கிரேக்கம் அந்த உறுதி யாரிடத்தில் இருந்தது என்பதை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே முதன்மை உரை அந்தத் தெளிவின்மையைத் திறந்தவாறே வைக்கிறது; அடிக்குறிப்பு முக்கிய மாற்றுப் பொருள்களைத் தருகிறது.
- issue: οἷοι ἐγενήθημεν என்பதன் மொழிபெயர்ப்பு
  choice: நாங்கள் எப்படிப்பட்டவர்களாக இருந்தோம்
  alternative: நாங்கள் எப்படிப்பட்டவர்கள் என்று நிரூபித்தோம் / நாங்கள் எப்படி நடந்துகொண்டோம்
  rationale: இது பவுலும் அவருடைய உடன் ஊழியர்களும் தெசலோனிக்கேயரிடையே வெளிப்படுத்திய குணத்தையும் நடத்தையையும் குறிக்கிறது. ‘இருந்தோம்’ இயல்பாகவும் விளக்கத்தை மிகைப்படுத்தாமலும் உள்ளது.
- issue: δι’ ὑμᾶς என்பதன் உறவு
  choice: உங்கள் நன்மைக்காக
  alternative: உங்களுக்காக / உங்களால்
  rationale: இச்சூழலில் பயன் அல்லது நோக்கத்தைச் சுட்டும் வாசிப்பு சிறப்பாகப் பொருந்தினாலும், கிரேக்க διά + accusative காரணத் தொடர்பையும் ஏற்கக்கூடியதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘நற்செய்தி,’ ‘வல்லமை,’ ‘பரிசுத்த ஆவி’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன. கிரேக்கத்தின் தொடர்ச்சியான ἐν அமைப்பு தமிழில் ‘வல்லமையோடும், பரிசுத்த ஆவியோடும், மிகுந்த உறுதியோடும்’ என்ற ஒத்திசைவால் பிரதிபலிக்கப்படுகிறது.
