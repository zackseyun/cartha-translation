reference: 1 Thessalonians 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: ta
  text: 'பவுலும் சில்வானுவும் தீமோத்தேயுவும், தந்தையாகிய கடவுளிலும் ஆண்டவராகிய இயேசு மேசியாவிலும்[b] இருக்கிற தெசலோனிக்கேயரின் சபைக்கு[a]: உங்களுக்கு அருளும் சமாதானமும் உண்டாவதாக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சபை’ என்பதற்கு ‘கூடிய சமூகம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க ἐκκλησία கூடி அமைந்த மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இயேசு கிறிஸ்து.’ கிரேக்க Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்,’ அதாவது ‘மேசியா’ என்ற பட்டம்; ‘கிறிஸ்து’ என்பது அதன் வழக்கமான ஒலிபெயர்ப்பு.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: பவுல்
  rationale: Παῦλος என்ற பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: Σιλουανὸς
  choice: சில்வானு
  rationale: மூலத்தில் உள்ள Σιλουανός என்ற முழுப் பெயரை நேரடியாகப் பிரதிபலிக்கிறது; வேறு கிரேக்க வடிவத்துடன் தொடர்புடைய ‘சீலா’ என்பதை இங்கு மாற்றீடாக இடவில்லை.
- source_word: Τιμόθεος
  choice: தீமோத்தேயு
  rationale: Τιμόθεος என்ற பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: ἐκκλησίᾳ
  choice: சபை
  rationale: கூடி அமைந்த விசுவாசிகளின் சமூகத்தைக் குறிக்கும் இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்; கட்டடத்தைக் குறிப்பதாக மட்டும் கொள்ளக்கூடாது.
- source_word: Θεσσαλονικέων
  choice: தெசலோனிக்கேயரின்
  rationale: தெசலோனிக்கா நகரைச் சேர்ந்த மக்களைக் குறிக்கும் பன்மை உடைமை வடிவத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐν
  choice: இல் / இருக்கிற
  rationale: சபை தந்தையாகிய கடவுளிலும் ஆண்டவர் இயேசு மேசியாவிலும் ‘இருப்பதாக’ கூறும் உறவையும் வாழ்வுத்தளத்தையும் பாதுகாக்கிறது; ‘சொந்தமான’ போன்ற விளக்கச் சொல்லால் அதன் பொருளைச் சுருக்கவில்லை.
- source_word: θεῷ πατρὶ
  choice: தந்தையாகிய கடவுள்
  rationale: கிரேக்கத்தில் ‘நமது’ என்பது இல்லாததால் அதைச் சேர்க்காமல், θεός மற்றும் πατήρ ஆகியவற்றின் விளக்கப்பெயர் உறவைத் தெளிவான தமிழில் தருகிறது.
- source_word: κυρίῳ
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டு κύριος என்பதற்கான இயல்பான, மதிப்புடைய நவீனத் தமிழ் இணை.
- source_word: Ἰησοῦ Χριστῷ
  choice: இயேசு மேசியா
  rationale: Ἰησοῦ என்ற பெயரையும், ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பொருள் உயிருடன் உள்ள Χριστός என்பதையும் வேறுபடுத்திப் பாதுகாக்கிறது.
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்தில் உள்ள χάρις என்பதன் கொடை, தயவு ஆகிய கருத்துகளை இயல்பான தமிழில் தருகிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: εἰρήνη என்பதன் அமைதி மற்றும் முழுநல வாழ்த்தின் வேதாகமத் தொனியைப் பாதுகாக்கிறது.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: உங்களுக்கு அருளும் சமாதானமும் உண்டாவதாக
  rationale: கிரேக்கத்தின் சுருக்கமான பெயர்ச்சொல் வாழ்த்தை தமிழில் முழுமையான, இயல்பான வாழ்த்தாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்வாழ்த்தில் Χριστός பட்டமாகத் தெளிவாகச் செயல்படுவதால் அதன் மேசியாப் பொருளை மறைக்காமல் ‘மேசியா’ என வழங்கப்பட்டது; பரவலான ஒலிபெயர்ப்பான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ காட்டும் உறவு
  choice: தந்தையாகிய கடவுளிலும் ஆண்டவராகிய இயேசு மேசியாவிலும் இருக்கிற சபை
  alternative: தந்தையாகிய கடவுளுக்கும் ஆண்டவராகிய இயேசு மேசியாவுக்கும் சொந்தமான சபை
  rationale: ἐν என்பதன் ‘இல்’ உறவை அப்படியே வைத்ததால் ஒன்றிப்பு, உறவு, வாழ்வுத்தளம் ஆகிய சாத்தியமான நுணுக்கங்கள் திறந்தவையாக இருக்கின்றன; அதை வெறும் உடைமையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதாகப் புரியும் அதே நேரத்தில் கடித வாழ்த்துக்கேற்ற மதிப்பும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. கிரேக்கத்தில் மீண்டும் வரும் καί-ஐ பெயர்களோடு ‘-உம்’ எனப் பாதுகாத்தோம். தமிழில் வாக்கியத் தொடர்பு தெளிவாக இருக்க ‘எழுதுவது’ சேர்க்கப்பட்டது; இது கடிதத் தொடக்கத்தில் மறைந்திருக்கும் செயலை வெளிப்படுத்தும் இயல்பாக்கம். ‘கர்த்தர்’ என்பதற்குப் பதில் இன்றைய பொதுத் தமிழில் தெளிவான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது.
