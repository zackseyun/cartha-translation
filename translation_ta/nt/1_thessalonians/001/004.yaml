  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவம் முதன்மை உரையில் காக்கப்படுகிறது; அது முழுச் சபையையும் உள்ளடக்கக்கூடிய பவுலின் வழக்கமான அழைப்பு என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அன்புகூரப்பட்ட’ என்பது செயப்பாட்டையும் நிலைத்த அன்பின் நிலையையும் காக்கிறது; ‘தேர்ந்தெடுக்கப்பட்டிருப்பதை’ என்பது கனமான பெயர்ச்சொல் அமைப்பைத் தவிர்த்து இயல்பான தமிழை வழங்குகிறது.
