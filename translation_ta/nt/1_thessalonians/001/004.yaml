  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே.’ கிரேக்கத்தில் ‘சகோதரர்கள்’ என்று உள்ளது; ஆனால் பவுலின் கடிதங்களில் இச்சொல் பெரும்பாலும் விசுவாசச் சமூகத்திலுள்ள ஆண்களையும் பெண்களையும் சேர்த்தே அழைக்கிறது.
