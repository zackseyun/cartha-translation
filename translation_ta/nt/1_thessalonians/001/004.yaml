lexical_decisions:
- source_word: εἰδότες
  choice: நாங்கள் அறிவோம்
  rationale: கிரேக்கத்தில் இது ‘அறிந்தவர்களாய்’ என்னும் பங்கேற்புவினை வடிவம்; முந்தைய வசனத்தோடு தொடரும் கருத்தை இயல்பான நவீனத் தமிழில் வினைமுற்றாக அளிக்கிறது. காரணப்பொருளைத் தெளிவாகச் சேர்க்காமல் மூலத்தின் தொடர்பு நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: ἀδελφοὶ
  choice: சகோதரர்களே
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மை. பவுலின் சபைமுகமான பயன்பாட்டில் இது விசுவாசச் சமூகமெங்கும் குறிக்கக்கூடும் என்பதால் அந்த உள்ளடக்கும் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: தேவனால் அன்புகூரப்பட்ட
  rationale: நிறைவுற்ற செயப்பாட்டு வடிவம், தேவனுடைய அன்பின் விளைவாக நிலைத்திருக்கும் நிலையைக் காட்டுகிறது. இத்தமிழாக்கம் செயப்பாட்டையும் தேவனைச் செய்பவராகவும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐκλογὴν ὑμῶν
  choice: நீங்கள் தேர்ந்தெடுக்கப்பட்டிருப்பதை
  rationale: ‘உங்கள் தேர்ந்தெடுப்பு’ என்ற சொல்லுக்குச் சொல் அமைப்பைவிட இது இயல்பான தமிழாகவும், அவர்கள் தேர்ந்தெடுக்கப்பட்ட நிலையைத் தெளிவாகவும் கூறுகிறது; தேர்ந்தெடுத்ததன் விரிவான இறையியல் முறைமையை உரைக்குள் புகுத்துவதில்லை.
theological_decisions:
- issue: ἐκλογή என்பதன் இறையியல் சுமையுள்ள பொருள்
  choice: நீங்கள் தேர்ந்தெடுக்கப்பட்டிருப்பதை
  alternative: உங்கள் தேர்ந்தெடுப்பு
