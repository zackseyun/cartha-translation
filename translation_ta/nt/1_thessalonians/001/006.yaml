revisions:
- from: நீங்களும் மிகுந்த துன்பத்தின் நடுவில் பரிசுத்த ஆவியால் உண்டான மகிழ்ச்சியோடு அந்த வார்த்தையை ஏற்றுக்கொண்டு, எங்களையும் ஆண்டவரையும் பின்பற்றி நடப்பவர்களானீர்கள்.[a]
  to: நீங்களும் மிகுந்த துன்பத்தின் நடுவில் பரிசுத்த ஆவியின் மகிழ்ச்சியோடு அந்த வார்த்தையை ஏற்றுக்கொண்டு, எங்களையும் ஆண்டவரையும் பின்பற்றுகிறவர்களானீர்கள்.[a]
  rationale: The revision removes an unnecessary expansion in the imitation expression and restores a source-close, deliberately open rendering of the Holy Spirit genitive in the main text. The footnote preserves the plausible source/causal nuance without presenting it as the only meaning.
