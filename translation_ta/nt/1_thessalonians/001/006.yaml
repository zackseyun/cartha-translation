source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: ta
  text: நீங்களும் மிகுந்த துன்பத்தின் நடுவில் பரிசுத்த ஆவியின் மகிழ்ச்சியோடு அந்த வார்த்தையை ஏற்றுக்கொண்டு, எங்களையும் ஆண்டவரையும் பின்பற்றுகிறவர்களானீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஆவியினால் வரும் மகிழ்ச்சியோடு.” கிரேக்கத் தொடர் இந்த மகிழ்ச்சியின் ஆதாரமாகப் பரிசுத்த ஆவியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ
  choice: பின்பற்றி நடப்பவர்கள்
  rationale: ஒருவரின் முன்மாதிரியைப் பின்பற்றி அதற்கேற்ப வாழ்வதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் பவுலின் பின்பற்றுதல் கருத்தைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἐγενήθητε
  choice: ஆனீர்கள்
  rationale: ஒரு புதிய நிலைக்கு வந்ததைக் குறிக்கும் வினைச்சொல்லின் பொருளைப் பாதுகாக்கிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவரை
  rationale: இங்கு இயேசுவைக் குறிக்கும் கிறிஸ்தியல் பட்டமாக κύριος பயன்படுத்தப்பட்டுள்ளது.
- source_word: δεξάμενοι
  choice: ஏற்றுக்கொண்டு
  rationale: அறிவிக்கப்பட்ட வார்த்தையை வரவேற்று ஏற்றுக்கொண்ட செயலை இயல்பான தமிழில் காட்டுகிறது; முதன்மை வினையுடன் தொடர்புடைய பங்கேற்பு வினையின் செயலையும் பாதுகாக்கிறது.
- source_word: τὸν λόγον
  choice: அந்த வார்த்தையை
  rationale: λόγος இங்கு அறிவிக்கப்பட்ட நற்செய்தியைக் குறிக்கிறது; ‘வார்த்தை’ என்பது பவுலின் சொல்லாட்சியையும் அதன் வேதாகம ஒலிப்பையும் பாதுகாக்கிறது.
- source_word: ἐν θλίψει πολλῇ
  choice: மிகுந்த துன்பத்தின் நடுவில்
  rationale: கடும் நெருக்கடி, ஒடுக்குதல், வேதனை ஆகியவற்றின் சூழலை நவீன தமிழில் தெளிவாகக் கூறுகிறது; தேவையற்ற இறுதிக்கால நுண்ணர்த்தத்தைச் சேர்ப்பதில்லை.
- source_word: μετὰ χαρᾶς πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியால் உண்டான மகிழ்ச்சியோடு
  rationale: மகிழ்ச்சியின் ஆதாரம் அல்லது அதை உருவாக்குபவர் பரிசுத்த ஆவி என்பதைக் சூழலுக்கு ஏற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது; கிரேக்க வேற்றுமை உறவின் மாற்று சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: χαρᾶς πνεύματος ἁγίου என்பதில் உள்ள உரிமை வேற்றுமை உறவு
  choice: பரிசுத்த ஆவியால் உண்டான மகிழ்ச்சி
  alternative: பரிசுத்த ஆவியின் மகிழ்ச்சி
  rationale: மிகுந்த துன்பத்துக்கு மத்தியிலும் காணப்பட்ட மகிழ்ச்சிக்கு ஆவியே ஆதாரம் அல்லது காரணம் என்பது சூழலில் அதிகம் பொருந்துகிறது. ஆயினும் கிரேக்கத் தொடர் உறவை மட்டும் கூறுவதால் மாற்று வாசிப்பு உண்மையான சாத்தியமாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: μιμηταὶ என்பதின் நெறியியல் கருத்து
  choice: எங்களையும் ஆண்டவரையும் பின்பற்றி நடப்பவர்கள்
  alternative: எங்களையும் ஆண்டவரையும் பின்பற்றிப் பின்பாவனை செய்பவர்கள்
  rationale: இது வெறும் குழு உறுப்பினர் அல்லது சீடர் என்ற பொதுப்பொருள் அல்ல; முன்மாதிரிக்கு ஏற்ப வாழ்வதைக் குறிக்கிறது. ‘பின்பற்றி நடப்பவர்கள்’ தமிழில் கண்ணியமாகவும் இயல்பாகவும் உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் முன்னேற்றத்தை இயல்பான தமிழுக்காகச் சற்றே மறுவரிசைப்படுத்தியுள்ளோம். ‘அந்த வார்த்தை’ என்பது முன் அறிவிக்கப்பட்ட நற்செய்திச் செய்தியைச் சுட்டுகிறது.
