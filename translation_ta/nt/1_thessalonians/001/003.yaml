source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: ta
  text: நம் கடவுளும் தந்தையுமானவரின் முன்னிலையில், விசுவாசத்தால்[a] விளைந்த உங்கள் செயலையும், அன்பினால் உண்டான கடின உழைப்பையும், நம் ஆண்டவராகிய இயேசு மெசியாவின்மேலுள்ள உங்கள் எதிர்நோக்கினால் உண்டான நிலைத்திருப்பையும் நினைவுகூருகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விசுவாசம்” என்பதற்கு “உண்மைத்தன்மை” அல்லது “நம்பிக்கை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύοντες
  choice: நினைவுகூருகிறோம்
  rationale: இது முந்தைய வசனத்தின் முதன்மை வினையோடு தொடரும் நிகழ்காலப் பங்கேற்புவினை. தமிழில் முழு வாக்கியமாக இயல்பாக அமைய, தொடர்ச்சியான நினைவுகூருதலைக் குறிக்கும் நிகழ்கால வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: ἔργου τῆς πίστεως
  choice: விசுவாசத்தால் விளைந்த உங்கள் செயல்
  rationale: மூலத்தின் பெயர்ச்சொல் தொடர்பு, விசுவாசத்திலிருந்து பிறக்கும் செயலைக் குறிக்கலாம். சொற்சொல்லான ஆனால் தெளிவில்லாத ‘விசுவாசத்தின் செயல்’ என்பதற்குப் பதிலாக, அந்த உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; πίστις என்பதிலுள்ள மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: κόπου τῆς ἀγάπης
  choice: அன்பினால் உண்டான கடின உழைப்பு
  rationale: κόπος என்பது சிரமமும் களைப்பும் நிறைந்த உழைப்பைக் குறிக்கிறது. ‘கடின உழைப்பு’ அதன் வலிமையைப் பேணுகிறது; அன்புக்கும் உழைப்புக்கும் உள்ள மூலமொழித் தொடர்பை ‘அன்பினால் உண்டான’ என இயல்பாகக் காட்டுகிறது.
- source_word: ὑπομονῆς τῆς ἐλπίδος
  choice: எதிர்நோக்கினால் உண்டான மனவுறுதி
  rationale: ὑπομονή அழுத்தத்தின் கீழும் நிலைத்திருக்கும் உறுதியைக் குறிக்கிறது. ‘மனவுறுதி’ வெறும் காத்திருப்பைக் காட்டிலும் அந்த நிலைத்தன்மையைத் தெளிவாக வழங்குகிறது; ἐλπίς இங்கு நம்பிக்கையோடு எதிர்பார்ப்பதைக் குறிக்கும் என்பதால் ‘எதிர்நோக்கு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: நம் ஆண்டவராகிய இயேசு மெசியாவின்மேல்
  rationale: மரபுத்தொடர் எதிர்நோக்கின் பொருளையோ தளத்தையோ குறிக்கிறது; ‘-வின்மேல் வைத்த’ என்பது அந்த உறவை இயல்பான தமிழில் காட்டுகிறது. Χριστός ஒரு பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என வழங்கப்பட்டது.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: நம் கடவுளும் தந்தையுமானவரின் முன்னிலையில்
  rationale: ἔμπροσθεν என்பதன் ‘முன்னிலையில்’ என்ற பொருளையும், ஒரே நபரை ‘கடவுள்’ என்றும் ‘தந்தை’ என்றும் குறிப்பிடும் நெருங்கிய இணைப்பையும் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: உண்மைத்தன்மை; நம்பிக்கை
  rationale: இச்சூழலில் செயலை உருவாக்கும் விசுவாசம் என்பது மிக இயல்பான வாசிப்பு. எனினும் πίστις ‘உண்மைத்தன்மை’ அல்லது ‘நம்பிக்கை’ என்றும் பொருள்படக்கூடியதால் அந்த உண்மையான சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து; அபிஷேகம் செய்யப்பட்டவர்
  rationale: இங்கு Χριστός இயேசுவுக்குரிய பட்டமாகச் செயல்படுகிறது. ‘மெசியா’ அந்தப் பட்டத் தன்மையைப் பேணுகிறது; தமிழில் பரிச்சயமான ‘கிறிஸ்து’ மற்றும் பட்டத்தின் விளக்கப் பொருள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: τοῦ κυρίου... என்ற மரபுத்தொடர் எதனுடன் இணைகிறது
  choice: மெசியாவின்மேல் வைத்த எதிர்நோக்கு
  alternative: நம் ஆண்டவர் இயேசு மெசியாவுக்குரிய எதிர்நோக்கு
  rationale: மரபுத்தொடரை எதிர்நோக்கின் பொருள் அல்லது தளமாகப் புரிவது சூழலில் மிகவும் இயல்பானது. உரையில் ‘-வின்மேல் வைத்த’ எனத் தெளிவாக்கப்பட்டாலும், மூலத்தின் மரபுத்தொடருக்குரிய தொடர்பை மிகையாக விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் ‘செயல்—கடின உழைப்பு—மனவுறுதி’ என்ற மூவகை அமைப்பு பாதுகாக்கப்பட்டு, அவை முறையே விசுவாசம், அன்பு, எதிர்நோக்கு ஆகியவற்றால் விளைவதை இயல்பான தமிழ் தொடரமைப்பில் வெளிப்படுத்தியுள்ளது.
