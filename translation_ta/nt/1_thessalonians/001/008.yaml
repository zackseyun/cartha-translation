reference: 1 Thessalonians 1:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: ta
  text: ஏனெனில், உங்களிடமிருந்து ஆண்டவரின் வார்த்தை முழங்கியுள்ளது—மக்கெதோனியாவிலும் அகாயாவிலும் மட்டுமல்ல; கடவுளை நோக்கிய உங்கள் நம்பிக்கை[a] எல்லா இடங்களிலும் பரவியுள்ளது. ஆகவே, நாங்கள் எதுவும் சொல்லத் தேவையில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள்மேல் நீங்கள் வைத்துள்ள நம்பிக்கை.” கிரேக்கச் சொற்றொடர் இன்னும் நேரடியாக, “கடவுளை நோக்கிய உங்கள் நம்பிக்கை” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήχηται
  choice: முழங்கியுள்ளது
  rationale: வலிமையாக ஒலித்துப் பரவுதல் என்ற செவிப்புல உருவகத்தையும், நிகழ்ந்து இப்போது விளைவு நீடிக்கும் நிறைவேற்றுக் காலத் தன்மையையும் காக்கிறது.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: ஆண்டவரின் வார்த்தை
  rationale: பவுலின் வழக்கமான சொற்றொடரை இயல்பான தமிழில் காக்கிறது; இது ஆண்டவருக்குரிய அல்லது ஆண்டவரைப்பற்றிய செய்தி என்ற கிரேக்க உரையின் சிறு திறந்தநிலையையும் முற்றிலும் மூடுவதில்லை.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: மக்கெதோனியாவிலும் அகாயாவிலும்
  rationale: பிரதேசப் பெயர்களின் நிலையான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது; ‘மட்டுமல்ல’ என்பதோடு இணைவதால் ‘-இலும்’ இயல்பாகிறது.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: எல்லா இடங்களிலும்
  rationale: παντί என்பதன் ஒவ்வொன்றையும் உள்ளடக்கும் பொருளையும் τόπῳ என்பதன் இடப்பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: கடவுளை நோக்கிய உங்கள் நம்பிக்கை
  rationale: πίστις என்பதற்கு ‘நம்பிக்கை’ என்றும் πρὸς என்பதன் திசைநோக்கிய பொருளுக்கு ‘நோக்கிய’ என்றும் வழங்கி, மூலத்தின் தனித்துவமான சொல்லமைப்பை காக்கிறது.
- source_word: ἐξελήλυθεν
  choice: பரவியுள்ளது
  rationale: சொல்லுக்குச் சொல் ‘வெளியே சென்றுள்ளது’ என்பது தமிழில் இயல்பற்றதால், பல இடங்களுக்குச் சென்றடைந்த தற்போதைய விளைவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: ஆகவே, நாங்கள் ... வேண்டியதில்லை
  rationale: ὥστε அறிமுகப்படுத்தும் விளைவைத் தெளிவான, இயல்பான தமிழ் வாக்கியமாகத் தருகிறது.
- source_word: λαλεῖν τι
  choice: எதுவும் சொல்ல
  rationale: ‘எதையாவது பேச’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பான தமிழ்; மூலத்தில் இல்லாத கூடுதல் வலியுறுத்தலைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: நம்பிக்கை
  alternative: நம்பகத்தன்மை; விசுவாசம்
  rationale: இங்கு தெசலோனிக்கேயர்கள் கடவுளை நோக்கித் தந்த நம்பிக்கையான பதிலே முதன்மையாகக் குறிக்கப்படுகிறது. ‘நம்பிக்கை’ நவீன பொதுத்தமிழில் இயல்பாகவும், குறிப்பிட்ட சமய மரபின் தனிச்சொல்லாகச் சுருங்காமலும் உள்ளது.
- issue: πρὸς τὸν θεόν என்ற உறவுச் சொற்றொடர்
  choice: கடவுளை நோக்கிய
  alternative: கடவுள்மேல் வைத்துள்ள
  rationale: ‘நோக்கிய’ என்பது πρὸς என்பதன் திசைநோக்கிய மொழிப்படிமத்தைப் பாதுகாக்கிறது. அதிகம் வழக்கிலுள்ள மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது; மூலத்தின் நுட்பம் அமைதியாகத் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நடை நவீன, கண்ணியமான பொதுத்தமிழில் அமைந்துள்ளது. கிரேக்க வாக்கியத்தில் ‘ஆண்டவரின் வார்த்தை முழங்கியது’ என்பதிலிருந்து ‘உங்கள் நம்பிக்கை பரவியது’ என்பதற்கு ஏற்படும் இலக்கணத் திருப்பத்தை முற்றிலும் சமப்படுத்தாமல், நீண்ட கோடும் அரைப்புள்ளியும் கொண்டு வாசிக்கத்தக்கவாறு காத்துள்ளது.
