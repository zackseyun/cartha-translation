source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: ta
  text: ஏனெனில், எங்களுடைய வருகை உங்களிடம் எப்படிப்பட்டதாக இருந்தது என்றும், உயிருள்ளவரும் உண்மையானவருமான கடவுளுக்குப் பணிசெய்வதற்காக நீங்கள் எவ்வாறு சிலைகளைவிட்டு கடவுளிடம் திரும்பினீர்கள் என்றும் அவர்களே எங்களைப்பற்றித் தெரிவிக்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: அவர்களே
  rationale: வெளியிலுள்ளவர்களே தாமாக இதைத் தெரிவிக்கிறார்கள் என்ற வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀπαγγέλλουσιν
  choice: தெரிவிக்கிறார்கள்
  rationale: நிகழ்காலத்தில் தொடர்ந்து செய்தியை எடுத்துரைக்கும் பொருளை, மிகை முறையின்றி வெளிப்படுத்துகிறது.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: உங்களிடம் எங்களுக்கு எப்படிப்பட்ட வரவேற்பு கிடைத்தது
  rationale: εἴσοδος என்பதன் நேரடிப் பொருள் ‘வருகை/நுழைவு’; இச்சூழலில் அந்த வருகையின் தன்மையையும் விளைவையும் ‘வரவேற்பு’ இயல்பாக உணர்த்துகிறது. நேரடி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: πῶς ἐπεστρέψατε
  choice: நீங்கள் எவ்வாறு … திரும்பினீர்கள்
  rationale: மனமாற்றத்தைக் குறிக்கும் திரும்புதல் உருவகத்தைப் பாதுகாக்கிறது; பிற்காலத் தொழில்நுட்ப இறையியல் சொல்லை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: சிலைகளைவிட்டு கடவுளிடம்
  rationale: ἀπό மற்றும் πρός காட்டும் விலகும் திசையையும் அணையும் இலக்கையும் தெளிவாகக் காக்கிறது.
- source_word: εἰδώλων
  choice: சிலைகள்
  rationale: வழிபாட்டுக்குரிய விக்கிரகங்கள் அல்லது பொய்த் தெய்வப் பிரதிநிதிகளைச் சுட்டும் நேரடியான, பொதுவாகப் புரியும் சொல்.
- source_word: δουλεύειν
  choice: பணிசெய்வதற்காக
  rationale: அர்ப்பணிப்புடன் சேவிப்பதைக் குறிக்கிறது; இச்சூழலில் ‘அடிமையாக இருப்பது’ என்று மிகைப்படுத்தாமலும் ‘வழிபடுவது’ என்று பொருளைக் குறுக்காமலும் உள்ளது.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: உயிருள்ள உண்மையான கடவுளுக்கு
  rationale: உயிரற்ற சிலைகளுக்கு எதிராக, கடவுள் உயிருள்ளவரும் உண்மையானவரும் என்பதைக் கூறும் இரு பெயரடைகளையும் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்க அல்லது ஆதாரத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ἐπεστρέψατε என்பதில் உள்ள மனமாற்ற மொழி
  choice: ‘நீங்கள் … கடவுளிடம் திரும்பினீர்கள்’
  alternative: ‘நீங்கள் … கடவுளிடம் மனமாற்றம் அடைந்தீர்கள்’ அல்லது ‘திருப்பப்பட்டீர்கள்’
  rationale: கிரேக்க வினை செயப்பாட்டு வடிவமல்ல; அது திரும்புதல் என்ற உருவகத்தைக் கொண்டுள்ளது. எனவே மனிதப் பதிலையும் இறைச் செயலையும் பற்றிய முறையியல் விவாதத்தை மொழிபெயர்ப்பில் தீர்மானிக்காமல், மூலத்தின் வடிவம் காக்கப்படுகிறது.
- issue: δουλεύειν என்பதன் அடிமைத்தனம்/சேவை நுணுக்கம்
  choice: ‘பணிசெய்வதற்காக’
  alternative: ‘அடிமையாக இருப்பதற்காக’ அல்லது ‘வழிபடுவதற்காக’
  rationale: இந்த மதச்சார்ந்த சூழலில் கடவுளுக்கான முழு விசுவாசமும் அர்ப்பணித்த சேவையும் முன்னிலையில் உள்ளன. ‘பணிசெய்’ என்பது அடிமைச் சொற்குடும்பத்தின் கடுமையை மிகைப்படுத்தாமலும் வழிபாட்டுக்கு மட்டும் சுருக்காமலும் பொருளைக் காக்கிறது.
- issue: ‘உயிருள்ள உண்மையான கடவுள்’ என்ற மாறுபாடு
  choice: சிலைகளுக்கு எதிராக கடவுளை ‘உயிருள்ள உண்மையானவர்’ என நேரடியாகக் கூறுதல்
  alternative: ‘உயிருள்ளவரும் மெய்யானவருமான கடவுள்’
  rationale: இரு பெயரடைகளையும் சமமாகக் காத்து, உயிரற்ற மற்றும் பொய்யான வழிபாட்டுப் பொருட்களுடனான மறைமுக எதிர்மறையை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியுமாறும் திருவிவிலிய உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கடவுள்’, ‘சிலைகள்’, ‘பணிசெய்’, ‘திரும்பு’ ஆகிய பொதுவான சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தில் உள்ள திசை, வலியுறுத்தல், மனமாற்ற உருவகம் ஆகியவை காக்கப்பட்டுள்ளன.
