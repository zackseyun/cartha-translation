source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: ta
  text: ஒருவர்மீதும் எல்லார்மீதும் நீங்கள் கொண்டுள்ள அன்பில் நீங்கள் பெருகி, மிகுந்து வழியும்படி ஆண்டவர் செய்வாராக[a]; அதுபோலவே நாங்களும் உங்கள்மீது அன்பில் பெருகி, மிகுந்து வழிகிறோம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒருவரை ஒருவர் நோக்கியும் எல்லாரையும் நோக்கியும் உள்ள அன்பில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் இறுதித் தொடர் நீள்வட்டமாக, சொல்லுக்குச் சொல் ‘அதுபோலவே நாங்களும் உங்களை நோக்கி’ என்று உள்ளது. முந்தைய தொடரிலுள்ள ‘அன்பில் பெருகி, மிகுந்து வழிதல்’ என்ற கருத்து இங்கே நிரப்பப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் குறிக்காமல், முந்தைய வேண்டுதலிலிருந்து இதற்குச் செல்லும் மென்மையான தொடர்ச்சியைக் குறிக்கிறது. தமிழில் வசனத்தை இயல்பாகத் தொடங்க தனி இணைப்புச்சொல் தேவையில்லை.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் தெய்வீக/கிறிஸ்துவியல் பட்டப்பெயர் தன்மையைப் பாதுகாக்கும், நவீனத் தமிழில் இயல்பான மரியாதைமிக்க சொல். குறிப்பிட்ட நபரை விளக்கிச் சேர்க்காமல் மூலத்தின் திறந்த தன்மை காக்கப்படுகிறது.
- source_word: πλεονάσαι
  choice: பெருகி
  rationale: இது வேண்டுதல் அமைப்பிலுள்ள இறந்தகால விருப்பவினை. ஆண்டவர் செய்பவராக இருப்பதால், ‘பெருகி ... செய்யுமாறு’ என்ற காரணவினை அமைப்பில் பொருள் வெளிப்படுகிறது.
- source_word: περισσεύσαι
  choice: நிரம்பி வழியுமாறு
  rationale: πλεονάζω உடன் இணைந்து மிகுதியை வலியுறுத்தும் இரண்டாவது வினை. ‘நிரம்பி வழிதல்’ அன்பின் மிகுதியை இயல்பான தமிழில் தெரிவித்து, முதல் வினையிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: τῇ ἀγάπῃ
  choice: அன்பில்
  rationale: அவர்கள் எந்தத் துறையில் பெருக வேண்டும் என்பதைச் சுட்டும் வேற்றுமையை ‘அன்பில்’ என்று நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: εἰς ἀλλήλους
  choice: ஒருவர்மீது ஒருவர் கொண்டிருக்கும்
  rationale: அன்பின் பரஸ்பர நோக்கை இயல்பான தமிழில் தெரிவிக்கிறது. εἰς என்பதன் நேரடியான ‘நோக்கி’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καὶ εἰς πάντας
  choice: எல்லார்மீதும் கொண்டிருக்கும்
  rationale: πάντας என்பதன் வரம்பை ‘எல்லா மனிதர்களும்’ அல்லது ‘எல்லா விசுவாசிகளும்’ என்று குறுக்காமல், அதன் பரந்த தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: அதுபோலவே நாங்களும் உங்கள்மீது அன்புகொண்டிருக்கிறோம்
  rationale: கிரேக்கத்தில் வினை விடுபட்டுள்ள நீள்வட்டத் தொடரை உடனடியான சூழலிலுள்ள ‘அன்பு’ மூலம் தமிழில் நிறைவு செய்கிறது; ‘நாங்களும்’ என்பது καί-ஐ பிரதிபலிக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பவரின் குறிப்பு
  choice: ‘ஆண்டவர்’ என்ற பட்டப்பெயர் மட்டும் பயன்படுத்தப்பட்டது.
  alternative: இது குறிப்பாக கிறிஸ்துவைக் குறிக்கிறது என்று வெளிப்படையாகச் சேர்த்தல்; அல்லது பொதுவாகக் கடவுளைக் குறிக்கும் வகையில் விரித்தல்.
  rationale: மூலத்தில் κύριος மட்டுமே உள்ளது. சூழல் அதன் குறிப்பை விளக்க உதவினாலும், மொழிபெயர்ப்பு வசனத்திலேயே அதைத் தீர்மானித்து விரித்துக் கூறக்கூடாது.
- issue: πάντας என்பதன் வரம்பு
  choice: ‘எல்லார்’ என்று பரந்த நிலையில் விடப்பட்டது.
  alternative: ‘எல்லா மனிதர்கள்’ அல்லது ‘எல்லா விசுவாசிகள்’ என்று வரம்பைத் தீர்மானித்தல்.
  rationale: இந்தச் சொல் யாரை எல்லாம் உள்ளடக்குகிறது என்பதை கிரேக்கம் இங்கே துல்லியமாக வரையறுக்கவில்லை; ஆகவே அதன் அகலமும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘பெருகி, நிரம்பி வழியுமாறு’ என்ற இரட்டைச் சொற்றொடர் மூலத்தின் வலியுறுத்தலைக் காக்கிறது; பழமையான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
