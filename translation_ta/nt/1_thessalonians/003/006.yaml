reference: 1 Thessalonians 3:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: ta
  text: ஆனால் இப்போதுதான் தீமோத்தேயு உங்களிடமிருந்து எங்களிடம் வந்து, உங்கள் விசுவாசத்தையும் அன்பையும்[a] பற்றிய நற்செய்தியை எங்களுக்குக் கொண்டுவந்தார். மேலும், நீங்கள் எப்போதும் எங்களை நல்ல விதத்தில் நினைவுகூர்ந்து, நாங்கள் உங்களைக் காண ஏங்குவதுபோல நீங்களும் எங்களைக் காண ஏங்குகிறீர்கள் என்று அவர் தெரிவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் உண்மைத்தன்மை.” கிரேக்கச் சொல் விசுவாசம், நம்பிக்கை அல்லது உண்மைத்தன்மை ஆகியவற்றைக் குறிக்கலாம்.
    reason: πίστιஸ் என்பதிலுள்ள ‘faithfulness’ என்ற மாற்று அர்த்த நுணுக்கத்தை மட்டும் பாதுகாக்கிறது; ‘அன்பு’ இந்த மாற்று வாசிப்பில் சேர்வதில்லை.
lexical_decisions:
- source_word: Ἄρτι
  choice: இப்போதுதான்
  rationale: தீமோத்தேயுவின் வருகை மிக அண்மையில் நிகழ்ந்ததையும், பவுலின் முந்தைய கவலையிலிருந்து தற்போதைய ஆறுதலுக்கான மாற்றத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கவலைக்கும் இப்போது கிடைத்த நற்செய்திக்கும் இடையிலான மென்மையான மாறுபாட்டைக் குறிக்கிறது.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: தீமோத்தேயு உங்களிடமிருந்து எங்களிடம் வந்து
  rationale: கிரேக்கத்தின் genitive absolute அமைப்பை இயல்பான தமிழ் வினையெச்சத் தொடராக வழங்குகிறது; இயக்கத்தின் மூலமும் இலக்கும் பாதுகாக்கப்படுகின்றன.
- source_word: εὐαγγελισαμένου
  choice: நற்செய்தியை எங்களுக்குக் கொண்டுவந்தார்
  rationale: இங்கு நற்செய்தி அறிவித்தல் என்ற தொழில்நுட்பப் பொருளைக் காட்டிலும் நல்ல செய்தியைத் தெரிவித்தல் என்பதே சூழலுக்குப் பொருந்துகிறது; அதேவேளை εὐαγγελίζομαι என்பதன் நற்செய்தி மொழித்தொடர்பையும் காக்கிறது.
- source_word: τὴν πίστιν
  choice: உங்கள் விசுவாசம்
  rationale: πίστις என்பதற்கான முதன்மையான, பரவலாகப் புரியக்கூடிய வேதாகமத் தமிழ் இணை இது; இச்சூழலில் நிலைத்த நம்பிக்கையைக் குறிக்கலாம், ஆனால் உண்மைத்தன்மை என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τὴν ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான இயல்பானதும் நிலையானதுமான தமிழ் இணை.
- source_word: μνείαν ἡμῶν ἀγαθὴν
  choice: எங்களை நல்ல விதத்தில் நினைவுகூர்ந்து
  rationale: சொல்லுக்குச் சொல் அமைந்த கடினமான ‘நல்ல நினைவு வைத்திருக்கிறீர்கள்’ என்பதற்குப் பதிலாக, சாதகமான நினைவு அல்லது மனப்பான்மை என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: காலத் தொடர்ச்சியை நேரடியாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: எங்களைக் காண ஏங்குகிறீர்கள்
  rationale: ἐπιποθέω குறிக்கும் ஆழமான அன்பார்ந்த விருப்பத்தின் வலிமையை ‘ஏங்குதல்’ இயல்பாகக் காட்டுகிறது.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: நாங்கள் உங்களைக் காண ஏங்குவதுபோல நீங்களும்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள வினையைத் தமிழில் மீளக் கூறி, இருதரப்பினரின் பரஸ்பர ஏக்கத்தைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: πίστις என்பது ‘விசுவாசம்’ அல்லது ‘உண்மைத்தன்மை’ என்ற இரு நுணுக்கங்களையும் கொள்ளக்கூடியது
  choice: உங்கள் விசுவாசம்
  alternative: உங்கள் உண்மைத்தன்மை
  rationale: சூழல் தெசலோனிக்கேயரின் தொடர்ந்த நம்பிக்கையை முதன்மையாகச் சுட்டுகிறது. எனினும், அவர்கள் நிலைத்திருக்கும் உண்மைத்தன்மை என்ற பொருள் சாத்தியமுள்ளதால் அதை அடிக்குறிப்பில் தருவது மூலத்தின் அர்த்த விரிவைச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நீண்ட ஒரே வாக்கிய அமைப்பு தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கருத்துகளின் தொடர்பு ‘மேலும்’ என்பதால் காக்கப்பட்டுள்ளது. ‘நற்செய்தி’ என்பது இங்கு தீமோத்தேயுவின் மகிழ்ச்சியான அறிக்கையைக் குறிக்கிறது; தனியாக சுவிசேஷப் பிரசங்கம் எனக் கட்டுப்படுத்தப்படவில்லை.
