- source_word: ζῶμεν
  choice: நாங்கள் வாழ்கிறோம்
  rationale: கிரேக்கத்தின் நேரடியான சொல்லாட்சியைப் பாதுகாக்கிறது; சூழலில் உள்ள உருவகமான உயிர்த்துடிப்பை முதன்மை உரையிலேயே விளக்கி முடிவுசெய்யவில்லை.
- source_word: ἐὰν
  choice: என்றால்
  rationale: நிபந்தனையைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: தெசலோனிக்கேய விசுவாசிகளை முன்னிறுத்தும் வெளிப்படையான பன்மை முன்னிலைப் பெயர் தக்கவைக்கப்படுகிறது.
- source_word: στήκετε
  choice: உறுதியாக நிலைத்து நிற்கிறீர்கள்
  rationale: στήκω என்பதன் உறுதியாக நிற்றல் அல்லது நிலைத்திருத்தல் என்ற தொடர்ச்சியான கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவரில்
  rationale: உறவு, ஒன்றிப்பு, வாழ்வின் வட்டாரம் ஆகிய பல நுணுக்கங்களையும் திறந்தவாறே வைத்திருக்கும் பவுலின் செறிவான சொல்லாட்சி பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ‘இப்போது நாங்கள் வாழ்கிறோம்’ என்ற கூற்றின் வலிமை
  choice: தெசலோனிக்கேயரின் உறுதியால் பவுலும் உடனுழைப்பாளர்களும் பெற்ற புதுப்பிக்கப்பட்ட ஊக்கத்தையோ உயிர்த்துடிப்பையோ குறிக்கக்கூடிய சொல்லாட்சியாக, நேரடி வடிவிலேயே மொழிபெயர்க்கப்பட்டது.
