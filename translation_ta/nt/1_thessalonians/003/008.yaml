translation:
  language: ta
  text: ஏனெனில்[a], இப்போது நாங்கள் வாழ்கிறோம்—நீங்கள் ஆண்டவரில் உறுதியாக நிலைத்துநிற்கிறீர்கள் என்றால்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏனெனில்’ என்று மொழிபெயர்க்கப்பட்டுள்ள சொல், சூழலுக்கேற்ப காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தலாம்; தமிழில் இந்த இணைப்பை வெளிப்படையாகச் சொல்லாமலும் மொழிபெயர்க்க முடியும்.
    reason: lexical_alternative
  - marker: b
    text: ‘நாங்கள் வாழ்கிறோம்’ என்பது வெறும் உடல் உயிர்வாழ்வை மட்டும் குறிக்காமல், மீண்டும் பெற்ற ஊக்கத்தையோ உயிர்த்துடிப்பையோ குறிக்கும் வலியுறுத்தலாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பாக இங்கு வருகிறது. தமிழில் ‘ஏனெனில்’ அதன் காரண–விளக்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: νῦν
