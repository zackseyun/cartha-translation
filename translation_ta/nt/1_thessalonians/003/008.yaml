  rationale: சூழல் உருவக அல்லது மிகைப்படுத்தப்பட்ட மேய்ப்புப் பேச்சைக் குறிப்பதாகத் தோன்றினாலும், ‘வாழ்கிறோம்’ என்ற கிரேக்கச் சொல்லின் திறந்த தன்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: ‘ஆண்டவரில்’ என்பதன் பொருள்
  choice: ஆண்டவருடனான உறவு அல்லது ஒன்றிப்பின் வட்டாரத்தில் நிலைத்திருத்தல் என்று பரந்தவாறே விடப்பட்டது.
  alternative: ‘ஆண்டவரோடு ஒன்றிப்பில்’ அல்லது ‘ஆண்டவருக்கு உண்மையுள்ளவர்களாக’ என்று விளக்கி மொழிபெயர்த்தல்.
  rationale: ஒரு குறிப்பிட்ட இறையியல் விளக்கத்துக்குள் சொற்றொடரைச் சுருக்காமல் பவுலின் செறிவான மொழியைத் தக்கவைக்கிறது.
