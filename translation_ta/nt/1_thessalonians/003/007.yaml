reference: 1 Thessalonians 3:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: ta
  text: இந்தக் காரணத்தினால், சகோதரர்களே[b], உங்களைக் குறித்து, எங்களுடைய எல்லா நெருக்கடிகளிலும் துன்பங்களிலும், உங்கள் விசுவாசத்தினால்[a] நாங்கள் ஆறுதல் அடைந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் உண்மைத்தன்மையினால்.” கிரேக்கச் சொல் விசுவாசம் நம்பிக்கை அல்லது உண்மைத்தன்மை ஆகியவற்றைக் குறிக்கலாம்; இங்கு தெசலோனிக்கேயர் தங்கள் விசுவாசத்தில் உறுதியாக நிலைத்திருந்ததையும் இது உள்ளடக்கியிருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “சகோதரர்களே” என்பது திருச்சபையினரை அழைக்க பவுல் வழக்கமாகப் பயன்படுத்தும் சொல்; விசுவாசிகளான ஆண்களும் பெண்களும் அடங்கிய முழுச் சமூகத்தையும் இது குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தீமொத்தேயுவின் நற்செய்தியோடு இந்த முடிவை இயல்பாக இணைக்கும் காரணவிளைவுத் தொடர்.
- source_word: παρεκλήθημεν
  choice: நாங்கள் ஆறுதல் அடைந்தோம்
  rationale: இங்கு παρακαλέω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம், துன்பத்தின் நடுவில் கிடைத்த தேற்றுதலையும் மனநிம்மதியையும் குறிக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க அழைப்புப் பன்மையின் உருவைத் தக்கவைக்கும் மரியாதையான, வழக்கமான தமிழாக்கம்; பவுலின் பயன்பாட்டில் இது முழுத் திருச்சபையையும் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐφ’ ὑμῖν
  choice: உங்களைக் குறித்து
  rationale: ஆறுதல் எந்த விடயத்தைப் பற்றியது என்பதைத் தெளிவாகக் காட்டுகிறது; தெசலோனிக்கேயர் நெருக்கடிக்குக் காரணம் என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: எங்களுடைய எல்லா நெருக்கடியிலும் துன்பத்திலும்
  rationale: ஆறுதல் கிடைத்த சூழ்நிலையைச் சுட்டி, துன்பத்தை விவரிக்கும் இரு தனித்த கிரேக்கப் பெயர்ச்சொற்களையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: ἀνάγκῃ
  choice: நெருக்கடி
  rationale: இச்சூழலில் வெறும் தேவை அல்லது கட்டாயம் என்பதைவிட அழுத்தமான இக்கட்டைக் குறிக்கிறது.
- source_word: θλίψει
  choice: துன்பம்
  rationale: அழுத்தம், ஒடுக்கம், வேதனை ஆகிய கருத்துகளைப் பொதுவாசகருக்குப் புரியும் நவீன தமிழில் தெரிவிக்கிறது.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: உங்கள் விசுவாசத்தின் மூலம்
  rationale: διά + உரிமை வேற்றுமை இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கிறது; அவர்களுடைய விசுவாசமே பவுலுக்கும் உடனிருந்தவர்களுக்கும் ஆறுதல் கிடைத்த வழி என்பதைக் காக்கிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: πίστις என்பதன் முதன்மைப் பொருளான நம்பிக்கை/விசுவாசத்தைத் தக்கவைக்கிறது; சூழலில் நிலைத்த உண்மைத்தன்மை என்ற நிழற்பொருளும் இருக்கலாம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தொடர்ந்து நிலைத்திருப்பதையும் உணர்த்தக்கூடிய சூழலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: விசுவாசத்தில் உண்மையாக நிலைத்திருத்தல் / உண்மைத்தன்மை
  rationale: தெசலோனிக்கேயரின் கடவுள்மீதான தொடர்ந்த நம்பிக்கையே முதன்மையாகக் குறிக்கப்படுகிறது; அது அவர்களுடைய நிலைத்தன்மையையும் உட்படுத்தக்கூடும். முதன்மைப் பொருளை மூலவாக்கியத்தில் வைத்து, உண்மைத்தன்மை என்ற சாத்தியமான நிழற்பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கச் சொற்றொடரின் தொடர்பைத் தெளிவாக்க “உங்களைக் குறித்து” என்பது துன்பச் சொற்றொடரிலிருந்து பிரிக்கப்பட்டுள்ளது; அதேவேளை மூலத்தின் கூறுகளும் இறையியல் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
