  source_fidelity: 'மூலத்தின் எல்லாக் கூறுகளும் மொழிபெயர்க்கப்பட்டுள்ளன: காரணத் தொடர்பு, அழைப்பு, ‘உங்களைக் குறித்து,’ துன்பத்தின் இரட்டைப் பெயர்கள், மற்றும் விசுவாசத்தின் வழியாகக் கிடைத்த ஆறுதல். ஆனால் “இதனால்” என்பதற்குப் பதில் “இந்தக் காரணத்தினால்” என்பது διὰ τοῦτο-வின் வெளிப்படையான காரணத் தொடர்பை நவீன தமிழில் இன்னும் துல்லியமாகக் காட்டுகிறது. மேலும் ἐπὶ πάσῃ-யில் உள்ள ‘எல்லா’ என்பதன் வீச்சை ‘எல்லா நெருக்கடிகளிலும் துன்பங்களிலும்’ என்று பன்மையாக்குவது இயல்பாகவும் தெளிவாகவும் அமையும்.'
