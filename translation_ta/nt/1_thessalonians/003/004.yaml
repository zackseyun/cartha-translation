revisions:
- from: ஏனெனில், நாங்கள் உங்களோடு இருந்தபோதே, நாங்கள் துன்பத்திற்கு உள்ளாகப் போகிறோம்[a] என்று உங்களிடம் முன்னரே தொடர்ந்து சொல்லிவந்தோம். அது அப்படியே நடந்தது; அதை நீங்கள் அறிவீர்கள்.
  to: ஏனெனில், நாங்கள் உங்களோடு இருந்தபோதுகூட, நாங்கள் துன்பத்திற்கு உள்ளாகப் போகிறோம்[a] என்று உங்களிடம் முன்கூட்டியே சொல்லிக்கொண்டே இருந்தோம். அது அப்படியே நடந்தது; இதை நீங்கள் அறிவீர்கள்.
