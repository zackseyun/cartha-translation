source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: ta
  text: ஏனெனில், நாங்கள் உங்களோடு இருந்தபோதுகூட, நாங்கள் துன்பத்திற்கு உள்ளாகப் போகிறோம்[a] என்று உங்களிடம் முன்கூட்டியே சொல்லிக்கொண்டே இருந்தோம். அது அப்படியே நடந்தது; இதை நீங்கள் அறிவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘துன்புறுவோம்’ அல்லது ‘இடுக்கணுக்கு ஆளாவோம்.’ கிரேக்க வினைச்சொல் நெருக்கடி, துயரம், அல்லது துன்புறுத்தலை அனுபவிப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில் ... இருந்தபோதே
  rationale: γάρ என்பதன் விளக்கக் காரணத் தொடர்பை ‘ஏனெனில்’ காட்டுகிறது; καί தரும் வலியுறுத்தலை ‘இருந்தபோதே’ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: நாங்கள் உங்களோடு இருந்தபோதே
  rationale: இது அவர்களுடைய முன்னிலையில், அவர்களோடு இருந்த காலத்தைக் குறிக்கிறது. ‘உங்களோடு’ நவீனத் தமிழில் இயல்பாகவும் உறவுசார் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: προελέγομεν
  choice: உங்களிடம் முன்னரே தொடர்ந்து சொல்லிவந்தோம்
  rationale: ‘முன்னரே’ என்பது முன்கூட்டிச் சொன்னதைப் பாதுகாக்கிறது; இறந்தகால imperfect வடிவத்தின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலை ‘தொடர்ந்து சொல்லிவந்தோம்’ வெளிப்படுத்துகிறது. ‘எச்சரித்தோம்’ என்பது மூல வினைச்சொல்லைவிடக் கூடுதல் விளக்கத்தைச் சேர்க்கும்.
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: நாங்கள் துன்பத்திற்கு உள்ளாகப் போகிறோம்
  rationale: μέλλομεν குறிக்கும் எதிர்பார்க்கப்பட்ட அல்லது நெருங்கிய நிகழ்வை ‘போகிறோம்’ தெரிவிக்கிறது. θλίβεσθαι என்பதன் செயப்படுபொருள் வடிவத்தையும், அழுத்தம், இடுக்கண், துன்பம் ஆகிய பரந்த பொருள் வரம்பையும் ‘துன்பத்திற்கு உள்ளாக’ காக்கிறது.
- source_word: καθὼς καὶ ἐγένετο
  choice: அது அப்படியே நடந்தது
  rationale: முன்னறிவிக்கப்பட்டதற்கும் நிகழ்ந்ததற்கும் உள்ள துல்லியமான ஒற்றுமையை ‘அப்படியே’ தெரிவிக்கிறது; கிரேக்க καί தரும் வலியுறுத்தலும் தமிழில் இயல்பாக இதில் அடங்குகிறது.
- source_word: καὶ οἴδατε
  choice: அதை நீங்கள் அறிவீர்கள்
  rationale: கிரேக்கத்தில் மறைமுகமாக உள்ள செயப்படுபொருள், முந்தைய நிகழ்வையே சுட்டுகிறது. தமிழில் தெளிவுக்காக ‘அதை’ வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது; καί-ன் இணைப்புத் தொடர்பு வாக்கிய அமைப்பால் காக்கப்படுகிறது.
theological_decisions:
- issue: θλίβεσθαι குறிக்கும் துன்பத்தின் இயல்பு
  choice: பொதுவான துன்பம் அல்லது இடுக்கணுக்கு உள்ளாதல்; துன்புறுத்தலும் இதில் அடங்கலாம், ஆனால் அதற்கு மட்டும் பொருளைக் குறுக்கவில்லை
  alternative: குறிப்பாகத் துன்புறுத்தப்படுதல்; அல்லது தொழில்நுட்பமான இறுதிக்கால ‘உபத்திரவம்’
  rationale: உடனடிச் சூழலில் எதிர்ப்பும் துன்பமும் இடம்பெற்றாலும், கிரேக்கச் சொல் அழுத்தம், இடுக்கண், துன்புறுத்தல் ஆகியவற்றை உள்ளடக்கும் பரந்த பொருள் கொண்டது. எனவே வசனம் வழங்காத தனிப்பட்ட அல்லது இறுதிக்காலப் பொருளை மொழிபெயர்ப்பு தீர்மானமாக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நாங்கள்’ என்பது எழுத்தாளர்களையும் அவர்களுடைய உடனுழைப்பாளர்களையும் குறிக்கும் வாசகர்-விலக்கு பன்மையாகப் பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், காரணத் தொடர்பும் முன்னறிவிப்பு–நிறைவேற்றம் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
