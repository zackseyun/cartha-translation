  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: ta
  text: நம்முடைய கடவுளும் தந்தையுமானவரே, நம்முடைய ஆண்டவராகிய இயேசுவும்[a], உங்களிடம் செல்லும் எங்கள் வழியை நேராக்குவாராக.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நம்முடைய கடவுளும் தந்தையுமானவர்’, ‘நம்முடைய ஆண்டவராகிய இயேசு’ என்ற இணை எழுவாய்களுடன், கிரேக்கத்தில் ‘நேராக்குவாராக’ என்பதற்கான வினைச்சொல் ஒருமையில் உள்ளது.
    reason: cross_reference
