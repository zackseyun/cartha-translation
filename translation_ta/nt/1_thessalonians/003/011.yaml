    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: அவரே
  rationale: αὐτός இங்கு வலியுறுத்தும் பொருளில் வருவதால், கடவுள் தாமே செயல்பட வேண்டும் என்ற வேண்டுதலை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான எதிர்மறை மாறுபாட்டை அல்ல, வேண்டுதலுக்கான மென்மையான உரைமாற்றத்தைக் குறிக்கிறது. தமிழில் கூடுதல் காலச்சொல் அல்லது செயற்கையான இணைப்புச்சொல் சேர்க்காமல் வாக்கிய மாற்றத்திலேயே இது இயல்பாக வெளிப்படுகிறது.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: நம்முடைய கடவுளும் தந்தையுமான
  rationale: கடவுள், தந்தை என்ற இரு பட்டங்களும் ஒரே நபரைக் குறிப்பதைத் தெளிவாகவும் கிரேக்க அமைப்புக்கு நெருக்கமாகவும் காக்கிறது.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: நம்முடைய ஆண்டவராகிய இயேசு
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என்றும், Ἰησοῦς என்பதற்கு ‘இயேசு’ என்றும் வழங்கி, ἡμῶν என்பதையும் வெளிப்படையாகக் காக்கிறது.
- source_word: κατευθύναι
  choice: நேராக்குவாராக
  rationale: பாதையை நேராக்குதல், தடைகளை அகற்றி பயணத்தைச் சாத்தியமாக்குதல் ஆகிய பொருள் நிழல்களைக் காக்கிறது; ‘-வாராக’ என்ற வடிவம் கிரேக்க இறந்தகால விருப்பவினையின் வேண்டுதல் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: எங்கள் வழி
  rationale: ὁδός என்பதிலுள்ள பாதை மற்றும் பயணவாய்ப்பு ஆகிய இரு பொருள் நிழல்களையும் ‘வழி’ காக்கிறது.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம் வருவதற்கான
  rationale: தெசலோனிக்கேயரிடம் செல்லும் திசையையும் பயண நோக்கத்தையும் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘நம்முடைய கடவுளும் தந்தையும்’ மற்றும் ‘நம்முடைய ஆண்டவர் இயேசுவும்’ இணை எழுவாய்களாக இருந்தும் கிரேக்கத்தில் வினைச்சொல் ஒருமையில் இருப்பது
  choice: இரு எழுவாய்களையும் வெளிப்படையாக வைத்து, ‘நேராக்குவாராக’ என்ற ஒருமை மரியாதை வினைவடிவைப் பயன்படுத்துதல்
  alternative: பன்மை வினைவடிவைப் பயன்படுத்துதல் அல்லது வாக்கியத்தை மாற்றியமைத்து ஒருமை அம்சத்தை மறைத்தல்
  rationale: கிரேக்க உரை தந்தையையும் ஆண்டவர் இயேசுவையும் ஒரே ஒருமை வினையுடன் இணைக்கிறது. அதன் இலக்கணத்திலும் இறையியல் அழுத்தத்திலும் உள்ள பதற்றத்தை விளக்கிச் சீர்செய்யாமல் தமிழிலும் இயன்ற அளவு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவரே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘நேராக்குவாராக’ பாதை உருவகத்தையும் வேண்டுதல் தன்மையையும் பாதுகாக்கிறது.
