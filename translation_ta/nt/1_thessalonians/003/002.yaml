id: 1TH.3.2
reference: 1 Thessalonians 3:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: ta
  text: நாங்கள் நம் சகோதரரும் மேசியாவின்[b] நற்செய்தியில் கடவுளின் சக பணியாளருமான[a] தீமோத்தேயுவை, உங்களை உறுதிப்படுத்தவும் உங்கள் விசுவாசத்தைக் குறித்து உங்களை ஊக்கப்படுத்தவும், அனுப்பினோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளோடு சேர்ந்து பணியாற்றுபவர்” என்றும் மொழிபெயர்க்கலாம். சில கையெழுத்துப் பிரதிகளில் “கடவுளின் ஊழியர்” என்பது போன்ற வேறு வாசகங்கள் உள்ளன.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் “கிறிஸ்து”; இங்கு பட்டப்பெயரின் பொருள் வலிமையாக இருப்பதால் “மேசியா” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: அனுப்பினோம்
  rationale: இறந்தகால நிகழ்வை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: Τιμόθεον
  choice: தீமோத்தேயு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: ἀδελφὸν ἡμῶν
  choice: நம் சகோதரர்
  rationale: விசுவாசிகளுக்கிடையிலான குடும்ப உறவு உருவகத்தையும் மூலத்தின் நெருக்கத்தையும் காக்கிறது.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: கடவுளின் சக பணியாளர்
  rationale: θεοῦ என்ற உரிமை வேற்றுமையையும் συνεργός என்பதன் வலுவான ‘சக பணியாளர்’ பொருளையும் மெலிதாக்காமல் காக்கிறது.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: மேசியாவின் நற்செய்திப் பணியில்
  rationale: ἐν குறிக்கும் பணித்தளத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ‘மேசியாவின் நற்செய்தி’ என்பது நற்செய்தி அவரிடமிருந்து வருகிறதா அல்லது அவரைப் பற்றியதா என்பதைத் தீர்மானிக்காமல் மூலத்தின் உறவைப் பேணுகிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: இங்கு Χριστός பட்டப்பெயர் வலிமையுடன் வருவதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εἰς τὸ στηρίξαι
  choice: உங்களை உறுதிப்படுத்தவும்
  rationale: நோக்கத்தைக் குறிக்கும் கட்டமைப்பையும் விசுவாசத்தில் நிலைப்படுத்தும் மேய்ப்புப் பொருளையும் தெளிவாகத் தருகிறது.
- source_word: παρακαλέσαι
  choice: உங்களை ஊக்கப்படுத்தவும்
  rationale: இச்சூழலில் ஆறுதல், அறிவுரை, உற்சாகம் ஆகிய பரப்புகளில் ஆதரவான மேய்ப்புப் பொருளை ‘ஊக்கப்படுத்த’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: உங்கள் விசுவாசத்தைக் குறித்து
  rationale: ὑπέρ என்பதன் ‘குறித்து/பொருட்டு’ என்ற சாத்தியங்களில், விசுவாசம் தொடர்பான ஊக்கத்தை இயல்பாகக் கூறுகிறது; நோக்கப் பொருளை மிகையாகத் தீர்மானிப்பதில்லை.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இங்கு தெசலோனிக்கேயரின் நம்பிக்கையையும் அதில் நிலைத்திருப்பதையும் குறிக்கும் வழக்கமான, பொருத்தமான தமிழ் சொல்.
theological_decisions:
- issue: συνεργὸν τοῦ θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளின் சக பணியாளர்
  alternative: கடவுளோடு சேர்ந்து பணியாற்றுபவர்; கடவுளின் ஊழியர்
  rationale: SBLGNT வாசகத்தின் வலுவான சொல்லாட்சியை இறையியல் சங்கடத்திற்காக ‘ஊழியர்’ என்று மெலிதாக்காமல் காக்கிறது. அதேவேளை வேறு புரிதலும் கையெழுத்துப் பிரதி வாசகங்களும் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: εὐαγγελίῳ τοῦ Χριστοῦ என்பதில் Χριστοῦ
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் Χριστός பட்டப்பெயராகச் செயல்படுவதால் ‘மேசியா’ பொருத்தமானது; பாரம்பரிய ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நற்செய்திப் பணியில்’ என்பது Timothy’s sphere of service என்பதைத் தெளிவாக்குகிறது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் அவை சார்ந்த சொற்றொடர்களுக்குப் பின்னர் அமைய வேண்டும்; [a] ‘கடவுளின் சக பணியாளர்’ என்பதற்குப் பின்னரும் [b] ‘மேசியா’ என்பதற்குப் பின்னரும் அமைய வேண்டும்.
