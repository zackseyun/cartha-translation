  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: ta
  text: நம் ஆண்டவராகிய இயேசு தம்முடைய பரிசுத்தமான அனைவரோடும் வருகையில், நம் கடவுளும் தந்தையுமானவரின் முன்னிலையில் உங்கள் உள்ளங்களைப் பரிசுத்தத்தில் குற்றமற்றவையாக அவர் உறுதிப்படுத்தும்படி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: உறுதிப்படுத்தும்படி
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் நோக்கம் அல்லது விளைவைத் தமிழ் வினையெச்ச அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰς καρδίας
  choice: உங்கள் உள்ளங்களை
  rationale: கிரேக்கத்தில் இது வெறும் உணர்ச்சிகளை அல்ல, அக மனிதரைச் சுட்டுகிறது; நவீன தமிழில் ‘உள்ளங்கள்’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: ἀμέμπτους ἐν ἁγιωσύνῃ
  choice: பரிசுத்தத்தில் குற்றமற்றவையாக
  rationale: ஒழுக்கரீதியாகப் பழிசுமத்த முடியாத நிலை மற்றும் பரிசுத்தத்தின் பண்பு ஆகிய இரண்டையும் காக்கிறது.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: நம் கடவுளும் தந்தையுமானவரின் முன்னிலையில்
  rationale: ‘கடவுள்’ மற்றும் ‘தந்தை’ என்ற இணைந்த அடையாளத்தையும், அவர் முன்னிலையில் நிற்பதையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ παρουσίᾳ
  choice: வரும்போது
  rationale: இறுதிக்காலச் சூழலில் παρουσία ஆண்டவரின் வருகையைக் குறிக்கிறது; தமிழில் காலவாக்கியமாக வழங்குவது இயல்பானது.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: தம்முடைய பரிசுத்தர் அனைவரோடும்
  rationale: ‘பரிசுத்தர்’ என்பது மனித விசுவாசிகளையோ தூதர்களையோ இருவரையுமோ குறிக்கக்கூடிய கிரேக்கச் சொல்லின் திட்டமிடப்படாத பரப்பை இயன்றவரை காக்கிறது.
theological_decisions:
- issue: ‘அவருடைய பரிசுத்தர் அனைவரும்’ என்பதன் குறிப்பு
  choice: அவர்கள் மனித விசுவாசிகளா, தேவதூதர்களா, இரு குழுக்களுமா என்பதை மூலவசனம் போலவே தீர்மானிக்காமல் விடுதல்
  alternative: ‘அவருடைய பரிசுத்த மக்கள் அனைவரோடும்’ அல்லது ‘அவருடைய தூதர்கள் அனைவரோடும்’
  rationale: ἁγίων என்ற சொல் இந்த இறுதிக்காலச் சூழலில் ஒன்றுக்கு மேற்பட்ட குறிப்பை அனுமதிக்கிறது; மொழிபெயர்ப்பு அந்த இறையியல் தெளிவின்மையைச் செயற்கையாகத் தீர்க்கக்கூடாது.
- issue: στηρίξαι என்பதின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்று வெளிப்படுத்துதல்
  alternative: எழுவாயைக் குறிப்பிடாமல் ‘உறுதிப்படுத்தும்படி’ என்று மட்டும் அமைத்தல்
  rationale: முந்தைய வசனத்தின் வேண்டுதலில் ஆண்டவரே செய்பவராக உள்ளார்; தமிழில் வாக்கியம் தெளிவாக இருக்க எழுவாய் வெளிப்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதை கொண்டாலும் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் நடையில் வடிவமைக்கப்பட்டது. ‘உள்ளங்கள்,’ ‘பரிசுத்தம்,’ ‘குற்றமற்ற’ போன்ற பரவலாக அறியப்படும் வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டன.
