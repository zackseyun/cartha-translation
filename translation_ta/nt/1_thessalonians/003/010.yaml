  text: night and day praying most earnestly to see your face and to supply what is lacking in your faith,[a]
translation:
  language: ta
  text: உங்களை நேரில் காணவும், உங்கள் விசுவாசத்தில் குறைவாக உள்ளவற்றைப் பூர்த்தி செய்யவும்[a] நாங்கள் இரவும் பகலும் மிகுந்த தீவிரத்தோடு மன்றாடுகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் விசுவாசத்தில் குறைவாக உள்ளவற்றை.’ கிரேக்கச் சொற்கள், அவர்களுடைய விசுவாசத்தில் இன்னும் வலுப்படுத்தப்படவோ நிறைவுபெறவோ வேண்டியவற்றை விரிவாகக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: இரவும் பகலும்
  rationale: காலத்தைக் குறிக்கும் இந்த மரபுத்தொடர், தொடர்ச்சியாக அல்லது மீண்டும் மீண்டும் செய்யப்படும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὑπερεκπερισσοῦ
  choice: மிகுந்த ஊக்கத்தோடு
  rationale: அளவுக்கு மிகுதியான தீவிரத்தை உணர்த்தும் அரிய வலியுறுத்தல் வினையடை; வேண்டுதலின் தீவிரத்தை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δεόμενοι
  choice: மன்றாடுகிறோம்
  rationale: இது ஆழ்ந்த வேண்டுதலைக் குறிக்கிறது. தமிழில் முழுமையான வாக்கியமாக இயங்குவதற்காக, சூழலில் உள்ள பன்மை எழுவாயை வெளிப்படுத்தி வினைமுற்றாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εἰς τὸ ἰδεῖν
  choice: காணவும்
  rationale: நோக்கத்தைத் தெரிவிக்கும் இக்கட்டமைப்பு தமிழில் நோக்க வினையெச்சமாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: உங்களை நேருக்கு நேர்
  rationale: சொல்லளவில் ‘உங்கள் முகத்தை’ என்றாலும், இங்கு தனிப்பட்ட நேரடிச் சந்திப்பைக் குறிக்கும் மரபுத்தொடர். ‘நேருக்கு நேர்’ என்பது அந்தச் சித்திரத்தையும் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: καταρτίσαι
  choice: நிறைவாக்கவும்
  rationale: ஒழுங்குபடுத்துதல், சரிசெய்தல், தகுதிப்படுத்துதல், முழுமைப்படுத்துதல் ஆகிய பொருள்களைக் கொள்ளக்கூடிய வினை. ‘குறைவாக இருப்பவை’ என்பதுடன் ‘நிறைவாக்குதல்’ இயல்பாக இணைகிறது; வளர்த்து வலுப்படுத்தும் நுண்பொருளையும் முற்றிலும் நீக்கவில்லை.
- source_word: τὰ ὑστερήματα
  choice: குறைவாக இருப்பவற்றை
  rationale: பன்மையில் உள்ள இச்சொல் குறைபாடுகள் அல்லது இன்னும் தேவைப்படுபவற்றைக் குறிக்கிறது. தமிழில் குற்றஞ்சாட்டும் தொனியின்றி அந்தப் பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: τῆς πίστεως ὑμῶν
  choice: உங்கள் விசுவாசத்தில்
  rationale: இங்கு தெசலோனிக்கேயரின் நம்பிக்கை அல்லது விசுவாச வாழ்வு மேலும் வளர வேண்டிய பகுதிகளைக் குறிக்கிறது; அவர்களிடம் விசுவாசமே இல்லை என்று பொருள்படாது.
theological_decisions:
- issue: πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இச்சூழலில் கடவுள்மீது கொண்ட நம்பிக்கையாகிய விசுவாசமே முதன்மைப் பொருள். ‘உண்மைத்தன்மை’ என்ற நடத்தை சார்ந்த பொருள் சாத்தியமான சொல்லகராதிப் பரப்பில் இருந்தாலும், இவ்வசனத்தின் உடனடிச் சூழலில் அது முதன்மையானதல்ல.
- issue: அவர்களுடைய விசுவாசத்தில் உள்ள ‘குறைவு’ என்பதன் தன்மை
  choice: குறைவாக இருப்பவற்றை நிறைவாக்குதல்
  alternative: இல்லாதவற்றை நிரப்புதல்; இன்னும் வலுப்படுத்த வேண்டியவற்றைச் சீராக்குதல்
  rationale: மூலச்சொற்கள் உண்மையான குறைவைச் சுட்டுகின்றன; ஆனால் முழுமையான விசுவாசமின்மையைக் கட்டாயப்படுத்துவதில்லை. உரையில் குறைவு என்ற வலிமை காக்கப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உங்கள் முகத்தைக் காண’ என்ற சொல்லளவிலான வடிவத்திற்குப் பதிலாக, நேரடிச் சந்திப்பைக் குறிக்கும் இயல்பான ‘உங்களை நேருக்கு நேர் காண’ பயன்படுத்தப்பட்டது. வேண்டுதலின் தீவிரமும் விசுவாசத்தில் இன்னும் தேவையான வளர்ச்சியைப் பற்றிய திறந்த நுண்பொருளும் காக்கப்பட்டுள்ளன.
