  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: ta
  text: இந்தத் துன்பங்களில்[b] எவரும் நிலைகுலையாமல் இருக்கும்படி[a]. ஏனெனில், இதற்காகவே நாம் நியமிக்கப்பட்டிருக்கிறோம்[c] என்பதை நீங்களே அறிவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலைகுலையாமல் இருக்கும்படி’ என்பதற்கு ‘கலக்கமடையாமல் இருக்கும்படி’ அல்லது ‘தடுமாறாமல் இருக்கும்படி’ என்றும் மொழிபெயர்க்கலாம். அரிதாக வரும் இந்த வினைச்சொல் வேறு சூழல்களில் ‘வஞ்சிக்கப்படுதல்’ அல்லது ‘முகஸ்துதியால் வசப்படுத்தப்படுதல்’ என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘துன்பங்கள்’ என்பதற்கு ‘நெருக்கடிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘நியமிக்கப்பட்டிருக்கிறோம்’ என்பதற்கு ‘விதிக்கப்பட்டிருக்கிறோம்’ அல்லது ‘வைக்கப்பட்டிருக்கிறோம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: எவரும் நிலைகுலைந்துபோகாதபடி
  rationale: முந்தைய வசனத்துடன் இணையும் நோக்கம்/விளைவைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள வினையெச்சத் தொடரை இயல்பான தமிழில் நோக்கத் தொடராக வழங்குகிறது. அரிதான σαίνεσθαι இச்சூழலில் துன்பங்களால் மனஉறுதி குலைவதைக் குறிக்க வாய்ப்புள்ளது; அதன் பிற சாத்தியமான பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: இந்தத் துன்பங்களால்
  rationale: θλῖψις அழுத்தம், நெருக்கடி, துன்பம் ஆகிய கருத்துகளைத் தருகிறது. σαίνεσθαι என்பதுடன் ἐν இங்கு சூழல் அல்லது காரணவழியைச் சுட்டுவதால், தமிழில் ‘துன்பங்களால்’ என்பது இயல்பாக உள்ளது.
- source_word: αὐτοὶ
  choice: நீங்களே
  rationale: வலியுறுத்தப்பட்ட αὐτοὶ என்ற பிரதிப்பெயரின் அழுத்தத்தை ‘நீங்களே’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முன்னுள்ள கூற்றிற்கான விளக்கக் காரணத்தை γάρ அறிமுகப்படுத்துகிறது.
- source_word: οἴδατε
  choice: அறிவீர்கள்
  rationale: வடிவில் நிறைவுக்காலமாக இருந்தாலும் οἶδα நிகழ்காலப் பொருளில் பயன்படுவதால் ‘அறிவீர்கள்’ பொருத்தமானது.
- source_word: εἰς τοῦτο
  choice: இதற்கென்றே
  rationale: முன்னர் குறிப்பிடப்பட்ட துன்பங்களைச் சுட்டும் தொடரின் நோக்கு/ஒதுக்கீட்டு நுணுக்கத்தை ‘இதற்கென்றே’ இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘இந்த நோக்கத்திற்காகவே’ என்று அதிகமாக விளக்கவில்லை.
- source_word: κείμεθα
  choice: நாம் நியமிக்கப்பட்டிருக்கிறோம்
  rationale: κεῖμαι என்பதன் அடிப்படைப் பொருள் ‘வைக்கப்பட்டிருத்தல்’; இத்தொடரில் அது ஒன்றிற்காக ஒதுக்கப்பட்ட அல்லது நியமிக்கப்பட்ட நிலையை உணர்த்துகிறது. செய்பவர் யார் என்பதை மூலவாக்கியம் வெளிப்படையாகக் கூறாததால் தமிழிலும் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: εἰς τοῦτο κείμεθα என்பதில் விசுவாசிகளுக்கும் துன்பத்திற்கும் உள்ள உறவு
  choice: இதற்கென்றே நாம் நியமிக்கப்பட்டிருக்கிறோம்
  alternative: இதற்கென்றே நாம் வைக்கப்பட்டிருக்கிறோம் / இதுவே நமக்கு விதிக்கப்பட்டுள்ளது
  rationale: துன்பம் விசுவாச வாழ்வில் எதிர்பாராத ஒன்று அல்ல, அவர்களுக்கு ஒதுக்கப்பட்ட அனுபவம் என்ற உரையின் வலிமையை ‘நியமிக்கப்பட்டிருக்கிறோம்’ காக்கிறது. அதேவேளை, செய்பவரை வெளிப்படையாகச் சேர்க்காமலும் ஒரு குறிப்பிட்ட முன்நியமனக் கோட்பாட்டை இறக்குமதி செய்யாமலும் மூலத்தின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. 3:3-இன் தொடக்க நோக்கத் தொடர் தனியாகத் தொங்காமல் இருக்க, முந்தைய வசனத்தில் வெளிப்படையாக உள்ள ‘நாங்கள் அவரை அனுப்பினோம்’ என்பது வாசிப்புத் தெளிவுக்காக இவ்வசனத்தில் நிறைவு கூறாக எடுத்துரைக்கப்பட்டுள்ளது; இது SBLGNT வசனப் பிரிப்பைக் காட்டிலும் வாக்கியத் தொடர்பை முன்னிறுத்தும் முடிவு. ‘உபத்திரவம்’ போன்ற மரபுவழிச் சொற்குப் பதிலாக பொதுவாகப் புரியும் ‘துன்பம்’ தேர்ந்தெடுக்கப்பட்டது.
