  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: ta
  text: உங்களைக் குறித்து, கடவுளுக்கு என்ன நன்றியை நாங்கள் திருப்பிச் செலுத்த முடியும்? நம் கடவுளின் முன்னிலையில் உங்களினிமித்தம் நாங்கள் மகிழும் எல்லா மகிழ்ச்சிக்காகவும்![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இயல்பான சொல்லாட்சியில், “உங்களுக்காகக் கடவுளுக்கு எவ்வளவு நன்றி சொன்னாலும் போதுமா?” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இன்னும் நேரடியாக, “உங்களைக் குறித்து கடவுளுக்கு என்ன நன்றியை நாங்கள் திருப்பிச் செலுத்த முடியும்?” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα … εὐχαριστίαν
  choice: என்ன நன்றியை
  rationale: வினாவுடன் கூடிய கிரேக்கச் சொற்றொடரின் நேரடியான வடிவத்தையும், தங்கள் நன்றி போதாது என்ற பவுலின் உணர்வையும் காக்கிறது.
- source_word: δυνάμεθα
  choice: நாங்கள் … முடியும்
  rationale: நிகழ்கால வினையின் திறன் சார்ந்த பொருளையும் சொல்லாட்சிக் கேள்வியின் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀνταποδοῦναι
  choice: திருப்பிச் செலுத்த
  rationale: பெற்றதற்குப் பதிலாகத் திருப்பிக் கொடுப்பது என்ற வினையின் உருவகப் பொருளைக் காக்கிறது; இது கடவுளிடம் ஒரு கடனை உண்மையில் தீர்ப்பதைக் குறிக்கவில்லை.
- source_word: περὶ ὑμῶν
  choice: உங்களைக் குறித்து
  rationale: περί + மரபுவேற்றுமை இங்கு குறிப்பு அல்லது தொடர்பைக் காட்டுகிறது; பின்னர் வரும் δι’ ὑμᾶς என்பதன் காரணப் பொருளிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: எல்லா மகிழ்ச்சிக்காகவும்
  rationale: நன்றி செலுத்துவதற்கான அடிப்படை அல்லது காரணமாக அந்த முழு மகிழ்ச்சியைக் காட்டுகிறது.
- source_word: ᾗ χαίρομεν
  choice: நாங்கள் மகிழ்கிற
  rationale: χαρά–χαίρομεν என்ற ‘மகிழ்ச்சி–மகிழ்தல்’ சொல் மீளலைத் தமிழிலும் இயன்றவரை காக்கிறது.
- source_word: δι’ ὑμᾶς
  choice: உங்களால்
  rationale: διά + குற்றுவேற்றுமை தரும் காரணப் பொருளைச் சுருக்கமான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: நம் கடவுளின் முன்னிலையில்
  rationale: கடவுளின் சந்நிதி என்ற இடவுருவகத்தை தெளிவாகவும் நவீனத் தமிழிலும் வழங்குகிறது.
theological_decisions:
- issue: கடவுளுக்கு நன்றியை ‘திருப்பிச் செலுத்துதல்’ என்ற சொல்லாட்சியின் பொருள்
  choice: கிரேக்கத்தில் உள்ள பதிலாகத் திருப்பிக் கொடுக்கும் உருவகத்தை ‘திருப்பிச் செலுத்த’ என்று காத்தல்
  alternative: ‘உங்களுக்காகக் கடவுளுக்கு எவ்வளவு நன்றி சொன்னாலும் போதுமா?’ என்று முற்றிலும் மரபுத்தமிழாக்குதல்
  rationale: ἀνταποδοῦναι என்ற வினை திருப்பிக் கொடுத்தல் அல்லது கைம்மாறு செய்தல் என்ற கருத்தைத் தெளிவாகக் கொண்டுள்ளது. சொல்லாட்சிக் கேள்வி, கடவுளுடன் வணிகப் பரிமாற்றம் இருப்பதாக அல்லாமல், போதுமான அளவு நன்றி செலுத்தத் தங்களால் இயலாது என்பதைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகிழ்கிற எல்லா மகிழ்ச்சி’ என்ற மூலத்தின் சொல் மீளல் தமிழில் ‘நாங்கள் மகிழ்கிற எல்லா மகிழ்ச்சி’ எனக் காக்கப்பட்டுள்ளது. ‘நம் கடவுள்’ என்பது பவுலும் வாசகர்களும் பகிரும் உறவை இயல்பாக வெளிப்படுத்துகிறது.
