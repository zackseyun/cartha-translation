- from: உங்களைக் குறித்து, நம் கடவுளின் முன்னிலையில் உங்களால் நாங்கள் மகிழ்கிற எல்லா மகிழ்ச்சிக்காகவும், கடவுளுக்கு என்ன நன்றியை நாங்கள் திருப்பிச் செலுத்த முடியும்?[a]
  to: உங்களைக் குறித்து, கடவுளுக்கு என்ன நன்றியை நாங்கள் திருப்பிச் செலுத்த முடியும்? நம் கடவுளின் முன்னிலையில் உங்களினிமித்தம் நாங்கள் மகிழும் எல்லா மகிழ்ச்சிக்காகவும்![a]
