id: 1TH.3.5
reference: 1 Thessalonians 3:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: ta
  text: இதனால்தான், என்னால் இனியும் பொறுத்துக்கொள்ள முடியாதபோது, உங்கள் விசுவாசத்தை[a] அறிந்துகொள்ள அனுப்பினேன்; சோதிக்கிறவன் ஒருவேளை உங்களைச் சோதித்துவிட்டானோ, எங்கள் உழைப்பு வீணாகிவிடுமோ[b] என்று அஞ்சினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் நம்பிக்கையை” அல்லது “உங்கள் உண்மைத்தன்மையை.” கிரேக்கச் சொல் சூழலுக்கேற்ப ஒன்றோடொன்று தொடர்புடைய இப்பொருள்களைக் கொண்டிருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “பயனற்றுப் போய்விடுமோ” அல்லது “ஒன்றுமில்லாமல் போய்விடுமோ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்தான்
  rationale: முந்தைய வசனங்களிலுள்ள காரணத்தைச் சுட்டும் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κἀγὼ
  choice: நான் (வினைமுற்றில் உட்பொருளாக)
  rationale: தமிழில் ‘அனுப்பினேன்’ என்பதே முதலாம் நபரைத் தெளிவாக்குகிறது; καί-இன் மெலிந்த வலியுறுத்தலைத் தனியே ‘நானும்’ என்று கூறுவது இங்கு தேவையில்லை.
- source_word: μηκέτι στέγων
  choice: என்னால் இனியும் பொறுத்துக்கொள்ள முடியாதபோது
  rationale: தாங்கும் ஆற்றல் எல்லையை எட்டியதை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἔπεμψα
  choice: அனுப்பினேன்
  rationale: மூலத்தில் அனுப்பப்பட்ட நபரின் பெயரோ செயப்படுபொருளோ இவ்வசனத்தில் இல்லை; ஆகவே சூழலிலிருந்து ‘தீமோத்தேயுவை’ என்று சேர்க்கவில்லை.
- source_word: εἰς τὸ γνῶναι
  choice: அறிந்துகொள்ள
  rationale: நோக்கத்தைக் குறிக்கும் கிரேக்க அமைப்பைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: τὴν πίστιν ὑμῶν
  choice: உங்கள் விசுவாசத்தை
  rationale: இங்கு πίστις தெசலோனிக்கேயரின் தொடர்ந்து நிலைக்கும் நம்பிக்கையை முதன்மையாகக் குறிக்கிறது; நம்பகத்தன்மை என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: μή πως
  choice: ஒருவேளை … -விட்டானோ … -விடுமோ என்று அஞ்சினேன்
  rationale: பவுலின் அச்சத்தையும் நிச்சயமின்மையையும் தமிழுக்குரிய ஐயவினை அமைப்பில் வெளிப்படுத்துகிறது; ‘அஞ்சினேன்’ என்பது மூலத்தில் உட்பொருளாக உள்ள apprehensive nuance-ஐ வெளிப்படையாக்குகிறது.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: சோதிக்கிறவன் ஒருவேளை உங்களைச் சோதித்துவிட்டானோ
  rationale: ஒரே வேர் கொண்ட participle மற்றும் finite verb ஆகியவற்றின் மீளுரையை ‘சோதிக்கிறவன்/சோதித்துவிட்டானோ’ என்று பாதுகாக்கிறது; சூழலில் தீய நோக்கமுள்ள சோதனை குறிக்கப்படுகிறது.
- source_word: εἰς κενὸν γένηται
  choice: வீணாகிவிடுமோ
  rationale: ‘பயனற்றதாக ஆகுதல்’ என்ற prospective பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ὁ κόπος ἡμῶν
  choice: எங்கள் உழைப்பு
  rationale: κόπος குறிக்கும் கடின முயற்சி மற்றும் வருத்தமிக்க உழைப்பின் எடையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுலின் பயன்பாட்டில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இச்சூழலில் நற்செய்தியை நம்பித் தொடர்ந்து நிலைத்திருப்பதே முதன்மையான பொருள். எனினும் ‘உண்மைத்தன்மை’ என்ற நுண்பொருளை முற்றிலும் விலக்காமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: ὁ πειράζων என்பவரின் அடையாளம்
  choice: சோதிக்கிறவன்
  alternative: சாத்தான்; சோதனைக்காரன்
  rationale: சூழல் சாத்தானைக் குறித்தாலும், மூல உரை இங்கு பெயரைப் பயன்படுத்தாமல் விளக்கப் பெயரெச்சத்தையே பயன்படுத்துகிறது; அதே மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
- issue: μή πως உடன் வரும் அச்சமும் நிகழ்வின் நிச்சயமின்மையும்
  choice: சோதித்துவிட்டானோ … வீணாகிவிடுமோ என்று அஞ்சினேன்
  alternative: சோதித்திருக்கக்கூடும்; உழைப்பு வீணாகியிருக்கக்கூடும்
  rationale: சோதனை நடந்திருக்குமோ என்ற பவுலின் அச்சத்தையும், அதன் விளைவாக உழைப்பு பயனற்றுப் போகுமோ என்ற எதிர்நோக்கிய கவலையையும் தீர்மானமாக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. நீளமான கிரேக்க வாக்கியத்தின் காரணம், நோக்கம், அச்சம் ஆகிய தொடர்புகள் அரைப்புள்ளி மற்றும் தமிழ் ஐயவினை அமைப்பால் தெளிவுபடுத்தப்பட்டுள்ளன.
