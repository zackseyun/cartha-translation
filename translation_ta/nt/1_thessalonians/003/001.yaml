lexical_decisions:
- source_word: Διὸ
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: μηκέτι
  choice: இனியும்
  rationale: பொறுமையின் எல்லை எட்டப்பட்டதையும், அதற்கு மேல் தொடர முடியாத நிலையையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: στέγοντες
  choice: பொறுத்துக்கொள்ள முடியாதபோது
  rationale: இச்சூழலில் தெசலோனிக்கேயரைப் பற்றிய கவலையால் ஏற்பட்ட மன அழுத்தத்தை இனி தாங்க முடியாத நிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: εὐδοκήσαμεν
  choice: மனமுவந்தோம்
  rationale: வெறும் நடைமுறை முடிவை மட்டுமல்லாமல், விருப்பத்தோடு ஏற்றுக்கொண்ட அல்லது சம்மதித்த நுண்பொருளையும் காக்கிறது.
- source_word: καταλειφθῆναι
  choice: விட்டுவிடப்படுவதற்கு
  rationale: கிரேக்கச் சொல்லின் இறந்தகாலச் செயப்பாட்டு முடிவிலி வடிவத்தைத் தமிழிலும் செயப்பாட்டுப் பொருளுடன் காக்கிறது; ‘பின்தங்கியிருக்க’ என்ற விளக்கத்தை முதன்மை உரைக்குள் கட்டாயப்படுத்தவில்லை.
- source_word: ἐν Ἀθήναις
  choice: அத்தேனையில்
  rationale: இடப்பொருளைத் தரும் வழக்கமான தமிழ் வடிவம்.
- source_word: μόνοι
  choice: நாங்கள் மட்டும்
  rationale: முதல் நபர் பன்மையையும், மற்ற தோழர்கள் இல்லாமல் இருப்பதையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: முதல் நபர் பன்மையின் குறிப்பு மற்றும் விரிந்த சூழலில் காணப்படும் ஒருமை–பன்மை இழுபறி
  choice: கிரேக்கத்தில் உள்ளபடியே ‘நாங்கள்’ மற்றும் ‘மட்டும்’ என்ற பன்மை வடிவங்கள் காக்கப்பட்டன.
  alternative: இதனை பவுலைக் குறிக்கும் கடிதவழிப் பன்மையாக விளக்கி, ‘நான் மட்டும் தங்க முடிவுசெய்தேன்’ என்று ஒருமையில் மொழிபெயர்ப்பது.
  rationale: εὐδοκήσαμεν, μόνοι ஆகியவை பன்மை வடிவங்கள். இவை பவுலை மட்டும் குறிக்கின்றனவா அல்லது ஊழியக் குழுவைக் குறிக்கின்றனவா என்ற வரலாற்றுக் கேள்வியை மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் இலக்கண வடிவத்தையும் அதன் இழுபறியையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘மனமுவந்தோம்’ என்பது εὐδοκήσαμεν என்பதிலுள்ள விருப்பம் அல்லது சம்மதத்தின் நுண்பொருளைக் காக்கிறது; அடிக்குறிப்பு அதன் முடிவெடுக்கும் பொருளை மாற்றாக வழங்குகிறது. செயப்பாட்டு வடிவமும் முதல் நபர் பன்மையும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
