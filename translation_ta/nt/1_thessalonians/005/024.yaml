  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: ta
  text: உங்களை அழைக்கிறவர் நம்பத்தக்கவர்; அவரும் அதைச் செய்வார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களை அழைக்கிறவர் உண்மையுள்ளவர்; அவரும் அதை நிறைவேற்றுவார்.”
    reason: πιστός என்பதற்கு ‘உண்மையுள்ளவர்’ என்பதும், ποιήσει என்பதற்கு ‘நிறைவேற்றுவார்’ என்பதும் சூழலுக்கேற்ற மாற்று மொழிபெயர்ப்புகள்.
lexical_decisions:
- source_word: πιστὸς
  choice: நம்பிக்கைக்குரியவர்
  rationale: இது எழுவாயின் நம்பகத்தன்மையையும் உறுதிப்பாட்டையும் குறிக்கும் பயனிலைப் பெயரடை. நவீன தமிழில் ‘நம்பிக்கைக்குரியவர்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ὁ καλῶν
  choice: அழைக்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையை இயல்பான தமிழில் வழங்குகிறது; தொடர்ந்து அழைப்பவராகிய கடவுளைக் குறிக்கிறது.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: இரண்டாம் நபர் பன்மை வேற்றுமைப் பொருளைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὃς καὶ
  choice: அவரே ...வும்
  rationale: அழைக்கிற அதே நபர்தான் செயல்படுத்தவும் செய்வார் என்ற தொடர்பையும் வலியுறுத்தலையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ποιήσει
  choice: இதையும் செய்து முடிப்பார்
  rationale: ποιέω என்பதன் பரந்த ‘செய்/நிறைவேற்று’ பொருளை எடுத்துரைக்கிறது. முந்தைய வசனத்தில் வேண்டப்பட்ட பரிசுத்தப்படுத்துதல் மற்றும் காத்தல் ஆகியவற்றை ‘இது’ சுட்டுகிறது; ‘செய்து முடிப்பார்’ எதிர்கால நிறைவேற்றத்தை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: ποιήσει என்பதன் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள்
  choice: ‘இதையும் செய்து முடிப்பார்’ என்று, முந்தைய வசனத்தில் பவுல் வேண்டிக்கொண்டதைச் சுட்டுதல்
  alternative: ‘அவர் செய்வார்’ அல்லது ‘அதை நிறைவேற்றுவார்’
  rationale: கிரேக்கத்தில் செயப்படுபொருள் கூறப்படவில்லை. தமிழில் அதன் சூழல் தொடர்பைத் தெளிவுபடுத்த ‘இது’ சேர்க்கப்படுகிறது; அது வசனம் 23-இன் பரிசுத்தப்படுத்துதல் மற்றும் குற்றமற்றவர்களாகக் காத்தல் ஆகியவற்றைச் சுட்டுகிறது, ஆனால் செயல்முறையை மேலதிகமாக வரையறுப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான நடை. ‘நம்பிக்கைக்குரியவர்’ பொதுவாசகர்களுக்கு தெளிவானது; அடிக்குறிப்பில் பாரம்பரியத் தெய்வவியல் ஒலியுடைய ‘உண்மையுள்ளவர்’ என்பதும் பாதுகாக்கப்பட்டுள்ளது.
