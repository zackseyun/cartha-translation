    reason: πιστός என்பதற்கு ‘உண்மையுள்ளவர்’ என்பதும், ποιήσει என்பதற்கு ‘நிறைவேற்றுவார்’ என்பதும் சூழலுக்கேற்ற மாற்று மொழிபெயர்ப்புகள்.
