  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: ta
  text: ஆனால் சகோதரர்களே[a], நீங்கள் இருளில் இல்லை; ஆகவே அந்த நாள்[b] ஒரு திருடனைப் போல உங்களை வந்துபிடிக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, அனைவரையும் உள்ளடக்கும் பொருளில், “சகோதர சகோதரிகளே.”
    reason: lexical_alternative
  - marker: b
    text: உடனடிச் சூழலில் இது கர்த்தருடைய நாளைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: ஆனால் … நீங்கள்
  rationale: δέ முந்தைய வசனங்களில் சொல்லப்பட்டவர்களுடன் உள்ள வேறுபாட்டைக் குறிக்கிறது; வெளிப்படையாக இடம்பெறும் ὑμεῖς, ‘நீங்கள்’ என்பதற்கு வலியுறுத்தல் தருகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை அழைப்பை நேரடியாகப் பாதுகாக்கிறது; முழுச் சபையையும் உள்ளடக்கும் பயன்பாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν σκότει
  choice: இருளில்
  rationale: ஒழுக்க மற்றும் ஆன்மிக அறியாமையைச் சுட்டும் உருவகத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: ἵνα
  choice: ஆகவே
  rationale: அவர்கள் இருளில் இல்லாததற்கும் அந்த நாள் அவர்களைப் பிடிக்காததற்கும் இடையிலான விளைவு சார்ந்த தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நோக்கம் அல்லது விளைவு என்ற நுண்வேறுபாட்டை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: ἡ ἡμέρα
  choice: அந்த நாள்
  rationale: முன்னுள்ள சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட நாளை இயல்பான தமிழில் சுட்டுகிறது; விரிவான இறையியல் அடையாளத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: ὡς κλέπτης
  choice: ஒரு திருடனைப் போல
  rationale: ὡς குறிக்கும் ஒப்புமையைத் தெளிவாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: καταλάβῃ
  choice: வந்துபிடிக்காது
  rationale: திடீரென வந்து ஒருவரைப் பிடித்தல் அல்லது எட்டிப்பிடித்தல் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; ‘எதிர்பாராதவிதமாக’ என்ற விளக்கத்தை வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: கலப்பு பாலினச் சபையிடம் ἀδελφοί என்ற அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது; அது முழுச் சபையையும் உள்ளடக்கக்கூடிய பொருளை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: ἡ ἡμέρα என்பதன் இறுதிக்காலக் குறிப்பு
  choice: அந்த நாள்
  alternative: கர்த்தருடைய நாள்
  rationale: உடனடிச் சூழல் இதைக் ‘கர்த்தருடைய நாள்’ என்று அடையாளப்படுத்தினாலும், இவ்வசனத்தின் கிரேக்கம் ‘அந்த நாள்’ என்று மட்டுமே கூறுகிறது; எனவே முழுச் சொற்றொடர் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இருள், நாள், திருடன் ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; ‘வந்துபிடிக்காது’ என்பது தமிழில் இயல்பான இயக்கத்தையும் திடீர் வருகையின் படிமத்தையும் தருகிறது.
