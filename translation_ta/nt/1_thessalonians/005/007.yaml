revisions:
- from: ஏனெனில், தூங்குகிறவர்கள் இரவில்தான் தூங்குகிறார்கள்; குடிபோதையில் ஆழ்கிறவர்களும் இரவில்தான் குடிபோதையில் ஆழ்கிறார்கள்.
  to: ஏனெனில், தூங்குகிறவர்கள் இரவில் தூங்குகிறார்கள்; குடிபோதையடைகிறவர்கள் இரவில் குடிபோதையடைகிறார்கள்.
  rationale: The revision removes the unsupported emphatic தான் and uses a direct, modern Tamil expression for becoming intoxicated. It retains the source’s literal analogy, generic formulation, temporal repetition, and parallel verbal structure.
