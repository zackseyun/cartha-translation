reference: 1 Thessalonians 5:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσιν, καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: ta
  text: ஏனெனில், தூங்குகிறவர்கள் இரவில் தூங்குகிறார்கள்; குடிபோதையடைகிறவர்கள் இரவில் குடிபோதையடைகிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான காரண இணைப்பாக இதைத் தருகிறது.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: தூங்குகிறவர்கள் ... தூங்குகிறார்கள்
  rationale: பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினையைப் பொதுவாகக் குறிப்பதுடன், மூலத்தின் சொல் மறுபடியையும் இணை அமைப்பையும் காக்கிறது.
- source_word: νυκτός
  choice: இரவில்தான்
  rationale: காலத்தைக் குறிக்கும் வினையடைப் பொருளை இயல்பான தமிழில் தருகிறது; ‘தான்’ இரவுக்கும் பகலுக்கும் இடையிலான சூழல்சார் எதிர்மறை ஒப்பீட்டை வெளிப்படுத்துகிறது.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: குடிபோதையில் ஆழ்கிறவர்கள் ... குடிபோதையில் ஆழ்கிறார்கள்
  rationale: போதையடையும் செயல் அல்லது நிலையைத் தெளிவாகத் தெரிவித்து, பங்கேற்புவினைக்கும் முற்றுவினைக்கும் இடையிலான மூலச் சொல் மறுபடியைத் தக்கவைக்கிறது.
- source_word: καί
  choice: -உம்
  rationale: இரு இணையான கூற்றுகளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
theological_decisions:
- issue: தூக்கம் மற்றும் குடிபோதையை நேரடியாகவா உருவகமாகவா மொழிபெயர்ப்பது
  choice: முதன்மை உரையில் ‘தூங்குகிறவர்கள்’, ‘குடிபோதையில் ஆழ்கிறவர்கள்’ என்ற நேரடிப் படிமங்களைத் தக்கவைத்தல்
  alternative: ஆவிக்குரிய விழிப்பின்மை மற்றும் ஒழுக்கச் சீர்கேடு என்று விளக்கி மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழலில் பவுல் சாதாரண இரவுநேர நடத்தையை ஆவிக்குரிய விழிப்புக்கான ஒப்புமையாகப் பயன்படுத்துகிறார். நேரடி மொழி அந்த ஒப்புமையையும் அதன் இறையியல் இழுவிசையையும் விளக்கத்தால் முன்கூட்டியே தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் இரு இணை வாக்கியங்களும் சொல் மறுபடியும் பாதுகாக்கப்பட்டுள்ளன.
