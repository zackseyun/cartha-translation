lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: இடைவிடாமல்
  rationale: இந்த வினையடை தொடர்ந்து அல்லது வழக்கமாகத் தளராது நடைபெறும் செயலைக் குறிக்கிறது. ‘இடைவிடாமல்’ என்பது கிரேக்கச் சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது; ஒவ்வொரு கணமும் வாயால் வேண்டுதல் செய்ய வேண்டும் என்று அவசியமாக மிகைப்படுத்துவதில்லை.
- source_word: προσεύχεσθε
  choice: வேண்டிக்கொள்ளுங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை நிகழ்காலக் கட்டளை வடிவம்; தொடர்ந்து பழக்கமாகச் செய்ய வேண்டிய செயலை வலியுறுத்துகிறது. ‘வேண்டிக்கொள்ளுங்கள்’ என்பது கூட்டத்தாரை நோக்கிய கட்டளையையும் ஜெபத்தின் பொருளையும் இயல்பாகத் தெரிவிக்கிறது; தொடர்ச்சியின் கருத்தை ‘இடைவிடாமல்’ ஏற்கெனவே தருகிறது.
theological_decisions:
- issue: கட்டளையின் நடைமுறைப் பொருள்
  choice: விடாமுயற்சியுடன் தொடர்ந்து வேண்டிக்கொள்ளும்படியான பொதுவான அறிவுரை
  alternative: ஒவ்வொரு கணமும் வெளிப்படையாகவும் இடையறாமலும் வேண்டுதல் செய்ய வேண்டும் என்ற சொற்பொருள் சார்ந்த வாசிப்பு
  rationale: நிகழ்காலக் கட்டளையுடன் ἀδιαλείπτως இணைவது, ஜெபத்தில் தொடர்ந்த அர்ப்பணிப்பையும் நிலையான விடாமுயற்சியையும் வலியுறுத்துகிறது. மொழிபெயர்ப்பு இந்த வலிமையையும் அதன் இயல்பான பதற்றத்தையும் காக்கிறது; குறிப்பிட்ட துறவியல் அல்லது சமயப்பிரிவுச் சார்ந்த விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான பன்மைக் கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபியுங்கள்’ என்பதற்குப் பதிலாக, பொதுவாகப் புரியும் தூய தமிழ்ச் சொல்லாக்கமான ‘வேண்டிக்கொள்ளுங்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
