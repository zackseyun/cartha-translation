source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: ta
  text: “சமாதானம், பாதுகாப்பு” என்று அவர்கள் சொல்லும்போது, கர்ப்பிணிக்குப் பிரசவ வேதனை வருவதுபோல, அப்போது திடீர் அழிவு அவர்கள்மேல் வரும்; அவர்கள் எவ்விதத்திலும் தப்பமாட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘எவ்விதத்திலும் தப்பமாட்டார்கள்’ என்பதற்கான கிரேக்கச் சொற்றொடர் வலியுறுத்தப்பட்ட மறுப்பைக் கொண்டுள்ளது; சொல்லுக்குச் சொல்: ‘ஒருபோதும் தப்பவே மாட்டார்கள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: என்று அவர்கள் சொல்லும்போது
  rationale: ὅταν உடன் வரும் நிகழ்காலத் துணைவினை எதிர்நோக்கிய காலச் சூழலைக் குறிக்கிறது. குறிப்பாகச் சொல்லப்படாத பன்மை எழுவாயை ‘அவர்கள்’ என்று அப்படியே வைத்திருக்கிறது.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: சமாதானம், பாதுகாப்பு
  rationale: εἰρήνη என்பதற்கு ‘சமாதானம்’ என்றும், ἀσφάλεια என்பதற்கு நவீனத் தமிழில் இயல்பான ‘பாதுகாப்பு’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது; இது பாதுகாப்பாக இருப்பதாகக் கூறும் பொது அறிவிப்பின் தொனியையும் காக்கிறது.
- source_word: αἰφνίδιος … ὄλεθρος
  choice: திடீர் அழிவு
  rationale: αἰφνίδιος நிகழ்வின் எதிர்பாராத திடீர்த் தன்மையையும், ὄλεθρος கடுமையான அழிவு அல்லது நாசத்தையும் குறிக்கிறது. அதன் இயல்பு அல்லது நீடிப்பைப் பற்றி வசனம் சொல்லாததை மொழிபெயர்ப்பு கூடுதலாக வரையறுக்கவில்லை.
- source_word: αὐτοῖς ἐφίσταται
  choice: அவர்கள்மேல் வந்துவிடும்
  rationale: அழிவு அவர்களைத் திடீரென வந்தடைவதை இயல்பான தமிழில் தெரிவிக்கிறது. ‘வந்துவிடும்’ என்பது திடீர் நிகழ்வையும் அதன் தவிர்க்க முடியாத தன்மையையும் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
- source_word: ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ
  choice: கர்ப்பிணிக்குப் பிரசவ வேதனை
  rationale: ‘கருப்பையில் கொண்டிருப்பவள்’ என்ற கிரேக்கச் சொல்லமைப்பை நவீனத் தமிழில் இயல்பாக ‘கர்ப்பிணி’ என்றும், ὠδίν என்பதைப் பிரசவத்துடன் தொடர்புடைய வேதனையாகவும் வழங்குகிறது.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: அவர்கள் எவ்விதத்திலும் தப்பமாட்டார்கள்
  rationale: οὐ μή உடன் வரும் துணைவினை எதிர்காலத்தைப் பற்றிய வலியுறுத்தப்பட்ட மறுப்பாகும். ‘எவ்விதத்திலும் … மாட்டார்கள்’ என்பது அந்த வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
theological_decisions:
- issue: இறுதிக்கால எச்சரிக்கையில் ὄλεθρος என்பதன் இயல்பு
  choice: ‘அழிவு’ என்று மொழிபெயர்த்து, அதன் முறை அல்லது காலநீடிப்பை வரையறுக்காமல் விடப்பட்டுள்ளது.
  alternative: ‘நாசம்’ அல்லது தீர்ப்பைக் கூடுதலாக விளக்கும் சொல்
  rationale: இந்த வசனம் உறுதியான தீர்ப்பை எச்சரிக்கிறது; ஆனால் ὄλεθρος என்ற சொல்லே அழித்தொழித்தல், முடிவில்லா தண்டனை போன்ற குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் தீர்மானிப்பதில்லை. எனவே உரையின் கடுமையும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான தொனியிலும் அமைக்கப்பட்டுள்ளது. மேற்கோளின் சுருக்கமான பொது அறிவிப்புத் தன்மையும், அதைத் தொடர்ந்து வரும் திடீர் தீர்ப்பின் தாக்கமும் காக்கப்பட்டுள்ளன.
