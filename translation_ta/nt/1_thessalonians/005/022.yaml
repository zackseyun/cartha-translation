lexical_decisions:
- source_word: ἀπέχεσθε
  choice: விலகியிருங்கள்
  rationale: நிகழ்கால நடுத்தர கட்டளைப் பன்மை வடிவம் தொடர்ந்து தவிர்த்து விலகியிருக்கும்படி அழைக்கிறது. ‘விலகியிருங்கள்’ என்பது இயல்பான நவீனத் தமிழில் கட்டளையின் வலிமையையும் தொடர்ச்சியையும் காக்கிறது.
- source_word: ἀπὸ
  choice: இலிருந்து
  rationale: ἀπέχω என்ற வினையுடன் வரும் பிரிவைக் குறிக்கும் பொருள்; ஒன்றிலிருந்து விலகி இருப்பதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: παντὸς
  choice: எல்லா
  rationale: εἴδους என்பதுடன் சேர்ந்து ‘ஒவ்வொரு வகை/எல்லா வகையான’ என்ற பொருளைத் தருகிறது; தமிழில் ‘எல்லா வகையான’ என்பது இயல்பான அமைப்பு.
- source_word: εἴδους
  choice: வகையான
  rationale: இச்சூழலில் வெளித்தோற்றத்தைவிட ‘வகை’ அல்லது ‘தன்மை வடிவம்’ என்பதே பொருத்தமான பொருள். ‘வகையான’ என்பது தீமையின் ஒவ்வொரு வகையையும் குறிக்கிறது.
- source_word: πονηροῦ
  choice: தீமை
  rationale: εἴδους என்பதை விளக்கும் ஒருமை உருபாக இருந்து ‘தீமையின் வகை’ என்ற பொருளைத் தருகிறது. ‘தீமை’ நேரடியானதும் பரவலாகப் புரிந்துகொள்ளப்படுவதுமான மொழிபெயர்ப்பு.
theological_decisions:
- issue: ἀπὸ παντὸς εἴδους πονηροῦ என்பதில் εἴδους என்ற சொல்லின் பொருள்
  choice: எல்லா வகையான தீமை
  alternative: தீமையின் ஒவ்வொரு வடிவம்; மரபுவழியாக, தீமையின் ஒவ்வொரு தோற்றம்
  rationale: இங்கு εἶδος என்பது வெறுமனே வெளித்தோற்றத்தைக் குறைப்பதைவிட ‘வகை’ அல்லது ‘வடிவம்’ என்று பொருள்படுவது அதிக வாய்ப்புள்ளது. ஆகவே, தீமையாகத் தோன்றும் எதையும் தவிர்க்க வேண்டும் என்ற கூடுதல் கருத்தை மூலவசனத்தில் திணிக்காமல் ‘எல்லா வகையான தீமை’ என மொழிபெயர்க்கப்பட்டுள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் சாதாரண வாசகர்களுக்கு உடனடியாகப் புரியக்கூடியதுமான கட்டளை வாக்கியம். பன்மை கட்டளை வடிவம் காக்கப்பட்டுள்ளது.
