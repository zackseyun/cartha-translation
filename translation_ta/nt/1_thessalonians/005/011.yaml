base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: ta
  text: ஆகவே, ஒருவரை ஒருவர் ஊக்கப்படுத்துங்கள்[a]; ஒருவரை ஒருவர் கட்டியெழுப்புங்கள்; நீங்கள் செய்து வருவதுபோலவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவரை ஒருவர் அறிவுறுத்துங்கள்”; παρακαλεῖτε என்ற சொல் இச்சூழலில் ஊக்கப்படுத்துதல் அல்லது வலியுறுத்தி அறிவுறுத்துதல் ஆகிய இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: παρακαλεῖτε
  choice: ஊக்கப்படுத்துங்கள்
  rationale: இந்தச் சூழலில் பரஸ்பரம் திடப்படுத்தும் பொருளை இயல்பாக வெளிப்படுத்துகிறது; இந்த வினைச்சொல்லில் உள்ள அறிவுறுத்தும் பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἀλλήλους
  choice: ஒருவரை ஒருவர்
  rationale: பரஸ்பரச் செயலைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: οἰκοδομεῖτε
  choice: கட்டியெழுப்புங்கள்
  rationale: கிரேக்க மூலத்திலுள்ள கட்டுமான உருவகத்தைத் தக்கவைத்தபடியே, ஒருவரை ஒருவர் வலுப்படுத்தும் கருத்தைத் தெளிவாகக் கூறுகிறது.
- source_word: εἷς τὸν ἕνα
  choice: ஒருவரை ஒருவர்
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் திணிக்காமல், ஒவ்வொருவரும் மற்றவருக்குச் செய்ய வேண்டிய பரஸ்பரச் செயலை இயல்பாகவும் வலியுறுத்தியும் தருகிறது.
- source_word: καθὼς καὶ ποιεῖτε
  choice: நீங்கள் செய்துவருவது போலவே
  rationale: ஒப்பீட்டையும், அவர்கள் இதைத் தற்போது தொடர்ந்து செய்கிறார்கள் என்ற பாராட்டையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன, பொதுவாகப் புரியக்கூடிய, கண்ணியமான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. “கட்டியெழுப்புங்கள்” என்பதன் மூலம் மூலமொழியின் உருவகம் தக்கவைக்கப்பட்டுள்ளது; இரு பரஸ்பரச் சொற்றொடர்களும் தனித்தனியாக மொழிபெயர்க்கப்பட்டுள்ளன.
