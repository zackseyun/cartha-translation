source:
  edition: SBLGNT
  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் அனைவரும் ஒளியின் மகன்களாகவும் பகலின் மகன்களாகவும் இருக்கிறீர்கள்.[a] நாம் இரவுக்குரியவர்களும் அல்ல, இருளுக்குரியவர்களும் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒளியின் பிள்ளைகளாகவும் பகலின் பிள்ளைகளாகவும்.” கிரேக்கத்தில் சொல்லுக்குச் சொல் “மகன்கள்” என்று உள்ளது. இது ஆண்களை மட்டும் குறிக்காமல், ஒளிக்கும் பகலுக்கும் உரியவர்களாக அல்லது அவற்றால் பண்புபெற்றவர்களாக இருப்பவர்களைக் குறிக்கும் ஒரு மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: அனைவரும்
  rationale: ὑμεῖς என்பதுடன் இணைந்து, ஒருவரையும் விலக்காத வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகப் பேணுகிறது.
- source_word: υἱοὶ
  choice: மகன்கள்
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மைச் சொல்லையும் ‘ஒளி/பகல் ஆகியவற்றுக்குரியவர்கள் அல்லது அவற்றால் பண்புபெற்றவர்கள்’ என்ற குடும்ப உருவகத்தையும் பேணுகிறது; அதன் உள்ளடக்கும் இடியோமப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: φωτός
  choice: ஒளியின்
  rationale: ஒளி என்ற மெய்யியல் மற்றும் ஒழுக்க உருவகத்தைப் பேணி, ‘மகன்கள்’ என்பதுடன் வரும் உறவுநிலை அமைப்பை நேரடியாகக் காட்டுகிறது.
- source_word: ἡμέρας
  choice: பகலின்
  rationale: ஒளியுடன் இணையும் உருவகத்தையும் இரவுக்கு எதிரான முரணையும் பேணுகிறது.
- source_word: οὐκ ἐσμὲν
  choice: நாம் ... அல்ல
  rationale: ‘நீங்கள்’ என்ற இரண்டாம் நபரிலிருந்து ‘நாம்’ என்ற முதல் நபர் பன்மைக்கு மூலத்தில் ஏற்படும் மாற்றத்தைச் சீராக்காமல் பேணுகிறது.
- source_word: νυκτός
  choice: இரவுக்குரியவர்கள்
  rationale: இரவின் ஆளுகை அல்லது அதனோடு சேர்ந்திருத்தல் என்ற உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: σκότους
  choice: இருளுக்குரியவர்கள்
  rationale: இரவு/பகல் மற்றும் இருள்/ஒளி ஆகிய எதிர்மறை உருவகங்களைப் பேணுவதோடு தமிழில் தெளிவான இணை அமைப்பை அளிக்கிறது.
theological_decisions:
- issue: υἱοὶ φωτός / υἱοὶ ἡμέρας என்பதில் உள்ள பாலினம் குறித்த குடும்ப உருவகம்
  choice: ஒளியின் மகன்கள்; பகலின் மகன்கள்
  alternative: ஒளியின் பிள்ளைகள்; பகலின் பிள்ளைகள்
  rationale: மூல கிரேக்கம் υἱοί (‘மகன்கள்’) என்று கூறுவதால் அந்தச் சொல்லுருவம் முதன்மை உரையில் பேணப்படுகிறது. இங்கு ஆண்களை மட்டும் குறிக்காமல், ஒளிக்கும் பகலுக்கும் உரியவர்களாக அல்லது அவற்றால் பண்புபெற்றவர்களாக இருப்போரைக் குறிக்கும் இடியோமம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: இரண்டாம் நபரிலிருந்து முதல் நபர் பன்மைக்கு மாறுதல்
  choice: நீங்கள் அனைவரும் ... நாம் ... அல்ல
  alternative: நீங்கள் அனைவரும் ... நீங்கள் ... அல்ல
  rationale: பவுல் தெசலோனிக்கேய விசுவாசிகளை நேரடியாக அழைப்பதிலிருந்து தன்னையும் உடனிருந்தோரையும் சேர்த்துக்கொள்ளும் மூலத்தின் நபர் மாற்றம் அப்படியே பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒளியின் மகன்கள் / பகலின் மகன்கள்’ என்ற சற்றே செறிவான வேதாகம உருவகம் மூலத்திற்கான நெருக்கத்திற்காகப் பேணப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
