    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: எல்லாவற்றிலும்
  rationale: ἐν என்பதுடன் வரும் παντί, நன்றி செலுத்துதல் நடைபெற வேண்டிய எல்லாச் சூழ்நிலைகளையும் குறிக்கிறது. தீமை உட்பட ஒவ்வொன்றுக்காகவும் நன்றி செலுத்த வேண்டும் என்ற பொருளைத் திணிக்காமல், கிரேக்கத்தின் சுருக்கத்தையும் உண்மையான பொருள் நுணுக்கத்தையும் இது காக்கிறது.
- source_word: εὐχαριστεῖτε
  choice: நன்றி செலுத்துங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை நிகழ்காலக் கட்டளை. தொடர்ந்து கடைப்பிடிக்க வேண்டிய செயலை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது; கிரேக்க வினையம்சத்தை அளவுக்கு மீறி விரித்துரைக்கவில்லை.
- source_word: τοῦτο
  choice: இதுவே
  rationale: உடனடியாக முன்வந்த நன்றி செலுத்தும் கட்டளையைச் சுட்டுகிறது. ‘இதுவே’ கிரேக்கத்தின் சுருக்கத்தைக் காத்து, வாக்கியத்தின் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முன்னுள்ள கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: θέλημα θεοῦ
  choice: கடவுளின் விருப்பம்
  rationale: இறைவன் விரும்புவதையும் நோக்குவதையும் குறிக்கும் உடைமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவுக்குள்
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த ‘மேசியா’ என்ற பொருளைக் காக்கிறது. ἐν என்பதையும் ‘உள்ளே/உடன் ஒன்றிப்பட்ட நிலையில்’ என்ற பவுலின் தொடர்பு மொழியை விளக்கவுரையாக்காமல் ‘-க்குள்’ எனத் தக்கவைக்கிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்கான
  rationale: கடவுளின் விருப்பம் தெசலோனிக்கேய விசுவாசிகளைச் சார்ந்தது அல்லது அவர்களை நோக்கியது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: Χριστῷ என்பதை பொருள் தரும் பட்டப்பெயராக மொழிபெயர்ப்பதா அல்லது மரபான ஒலிபெயர்ப்பைப் பயன்படுத்துவதா
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு Χριστός இன்னும் அர்த்தமுள்ள பட்டப்பெயராகச் செயல்படுவதால் ‘மேசியா’ அதன் யூத அபிஷேகம் பெற்ற அரசர் சார்ந்த பொருளைக் காக்கிறது. தமிழில் பெயருடன் இயல்பாக இணைக்க ‘மேசியாவாகிய இயேசு’ என வழங்கப்பட்டுள்ளது; மரபான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘எல்லாவற்றிலும்’ என்பது தீமைக்காகவும் நன்றி செலுத்தும்படி கட்டளையிடுகிறதா
  choice: எல்லாச் சூழ்நிலைகளின் நடுவிலும் நன்றி செலுத்துதல்
  alternative: ஒவ்வொன்றுக்காகவும் நன்றி செலுத்துதல்
  rationale: ἐν + பண்மை உருபிலான παντί இயல்பாகச் செயல் நடைபெறும் சூழலைக் குறிக்கிறது. ஆகவே தீமையையே நன்மை எனக் கருதி அதற்காக நன்றி செலுத்த வேண்டும் என்று வசனம் கட்டாயமாகச் சொல்வதாகப் பொருள் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எல்லாவற்றிலும்’ என்ற சுருக்கமான மூலவடிவம் முதன்மை உரையில் காக்கப்பட்டு, ஏற்படக்கூடிய தவறான புரிதல் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது. ‘மேசியாவாகிய’ என்பது பட்டப்பெயரின் பொருளை வெளிப்படுத்தும் இயல்பான தமிழ் இணைப்பாகும்.
