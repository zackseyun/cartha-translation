  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: ta
  text: எல்லாவற்றிலும்[a] நன்றி செலுத்துங்கள்; ஏனெனில், மேசியாவாகிய இயேசுவுக்குள்[b] உங்களுக்கான கடவுளின் விருப்பம் இதுவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “ஒவ்வொரு சூழ்நிலையிலும்.” கிரேக்கத்தில் “எல்லாவற்றிலும்” என்று உள்ளது. இது விசுவாசிகள் எந்தச் சூழ்நிலையிலும் நன்றி செலுத்த வேண்டும் என்பதைக் குறிக்கிறது; தீமைக்காகவே நன்றி செலுத்த வேண்டும் என்று அவசியமாகக் கூறவில்லை.'
