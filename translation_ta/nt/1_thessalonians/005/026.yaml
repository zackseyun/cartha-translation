  text: Greet all the brothers with a holy kiss[a][b].
translation:
  language: ta
  text: சகோதரர்கள் அனைவரையும் பரிசுத்த முத்தத்துடன் வாழ்த்துங்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அனைத்து சகோதர சகோதரிகளையும்”; “சகோதரர்கள்” என்பது முழு விசுவாசச் சமூகத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “பரிசுத்த முத்தம்” என்பது கிறிஸ்தவ ஐக்கியத்தையும் அன்பையும் வெளிப்படுத்தும், அக்காலப் பண்பாட்டில் அறியப்பட்ட அடையாளமாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை ஏவல் வடிவம்; சமூகச் சந்திப்பில் அன்புடன் வாழ்த்துதல் என்ற பொருளை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἀδελφοὺς
  choice: சகோதரர்கள்
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மை. அது விசுவாசக் குழுவினர் அனைவரையும் குறிக்கக்கூடும் என்ற உள்ளடங்கிய பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πάντας
  choice: அனைவரையும்
  rationale: குறிக்கப்படும் குழுவில் ஒருவரும் விடுபடக் கூடாது என்பதை வலியுறுத்துகிறது.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: பரிசுத்த முத்தத்தால்
  rationale: ἐν இங்கு வாழ்த்தும் முறை அல்லது அதனுடன் வரும் செயலைக் குறிக்கிறது; φίλημα என்பது குறிப்பாக ‘முத்தம்,’ ἁγίῳ என்பது அதை விசுவாசிகளின் பரிசுத்த உறவுக்குரியதாக வரையறுக்கிறது.
theological_decisions:
- issue: சபைச் சூழலில் ἀδελφοί என்பதன் பாலினம் மற்றும் குறிப்பு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரை பாதுகாக்கிறது; அதேவேளை முழு விசுவாசச் சமூகமும் குறிக்கப்படலாம் என்ற உண்மையான பொருள் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, மரியாதைக்குரிய ஏவல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த முத்தம்’ என்ற சொற்றொடர் மூலத்தின் மதச் சிறப்பையும் பண்பாட்டுத் தன்மையையும் பாதுகாக்கிறது; அதன் வரலாற்றுப் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
