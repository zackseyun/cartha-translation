source:
  edition: SBLGNT
  text: ⸀ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν ⸀τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: ta
  text: 'ஆண்டவரின் பெயரால் உங்களுக்குக் கடுமையாகக் கட்டளையிடுகிறேன்[a]: இந்தக் கடிதம் சகோதரர்கள் அனைவருக்கும் வாசிக்கப்படும்படி செய்யுங்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரைச் சாட்சியாக வைத்து உங்களுக்குக் கட்டளையிடுகிறேன்.” கிரேக்கச் சொற்றொடர் ஆண்டவரை அழைக்கப்படும் அதிகாரமாகக் கொண்டு பவுல் அவர்கள்மீது ஒரு தீவிரமான பொறுப்பைச் சுமத்துகிறார் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்கள்” என்பது பெண்களையும் உள்ளடக்கிய முழுச் சபையைக் குறிக்க வாய்ப்புள்ளது; கிரேக்கச் சொல் ஆண்பால் பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: ஆணையிட்டுக் கேட்டுக்கொள்கிறேன்
  rationale: ஒருவரை ஆணைக்குக் கட்டுப்படுத்தும் வலிமையான, பயபக்திக்குரிய வேண்டுகோளை இந்த வினைச்சொல் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் அதன் வலிமையைத் தக்கவைத்தும் இச்சொற்றொடர் அமைகிறது.
- source_word: τὸν κύριον
  choice: ஆண்டவரை முன்னிறுத்தி
  rationale: ஆண்டவரை ஆணையின் சாட்சியாகவும் அதிகாரமாகவும் அழைக்கும் பொருளைத் தருகிறது; ‘ஆண்டவர்மேல் ஆணையாக’ என்ற மாற்றுப் பொருளும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀναγνωσθῆναι
  choice: வாசித்துக் காட்டப்பட வேண்டும்
  rationale: செயப்பாட்டு இறந்தகால முடிவிலி வடிவத்தின் ‘வாசிக்கப்படுதல்’ என்ற பொருளையும், சபையாருக்கு உரக்க வாசிக்கும் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν ἐπιστολήν
  choice: இந்தக் கடிதம்
  rationale: தற்போது அனுப்பப்படும் இதே கடிதத்தைச் சூழல் சுட்டுகிறது; ‘நிருபம்’ என்பதைக் காட்டிலும் ‘கடிதம்’ பொதுவான நவீன தமிழ்.
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: சகோதரர்கள் அனைவருக்கும்
  rationale: கிரேக்க ஆண்பால் பன்மையை வடிவரீதியாகப் பாதுகாக்கிறது. இது பெண்களையும் உள்ளடக்கிய முழுச் சபையைக் குறிக்க வாய்ப்புள்ளதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: கலப்புப் பாலினச் சபைச் சூழலில் ἀδελφοῖς என்பதன் மொழிபெயர்ப்பு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்
  rationale: மூலத்தில் ஆண்பால் பன்மை உள்ளது; பவுலின் பயன்பாட்டில் அது பெண்கள் உட்பட முழு விசுவாசக் குழுவையும் குறிக்கக்கூடும். முதன்மை உரை இலக்கண வடிவத்தைப் பாதுகாத்து, உள்ளடக்கும் சாத்தியத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: τὸν κύριον என்பதற்கும் ἐνορκίζω என்பதற்கும் இடையிலான தொடர்பு
  choice: ஆண்டவரை முன்னிறுத்தி
  alternative: ஆண்டவர்மேல் ஆணையாக
  rationale: ஆண்டவர் சாட்சியாக அல்லது அதிகாரமாக அழைக்கப்படுகிறார் என்ற பொருளை முதன்மை உரை இயல்பான தமிழில் தருகிறது; கிரேக்கக் கட்டமைப்பின் ‘ஆண்டவரால்/ஆண்டவர்மேல் ஆணையாக’ என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: மரியாதையும் தீவிரமும் கொண்ட நவீன பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆணையிட்டுக் கேட்டுக்கொள்கிறேன்’ என்பது அரிதான சமயச் சொல்லான ‘ஆணையிடுகிறேன்/சத்தியப்படுத்துகிறேன்’ போன்றவற்றைத் தவிர்த்து மூலத்தின் வலிமையை வெளிப்படுத்துகிறது; ‘வாசித்துக் காட்டப்பட வேண்டும்’ பொதுக்கூட்ட வாசிப்பை இயல்பாக உணர்த்துகிறது.
