source:
  edition: SBLGNT
  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: ta
  text: யாரும் எவருக்கும் தீமைக்குப் பதிலாகத் தீமை திருப்பிச் செய்யாதபடி பார்த்துக்கொள்ளுங்கள்.[a] மாறாக, ஒருவருக்கொருவரிடமும் எல்லாரிடமும் எப்போதும் நன்மையை நாடுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாராவது எவருக்கும் தீமைக்குப் பதிலாகத் தீமை திருப்பிச் செய்துவிடாதபடி கவனமாயிருங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “ஒருவருக்கொருவர் ... எல்லார்” என்ற சொற்றொடர், சமூகத்தினரிடமிருந்து இன்னும் விரிந்த அனைவரிடமும் நன்மையை நாடும் நோக்கம் செல்லக் கூடும் என்பதைக் குறிக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: பார்த்துக்கொள்ளுங்கள்
  rationale: இது வெறுமனே பார்ப்பதைக் குறிக்காமல், ஒரு காரியம் நடக்காதபடி விழிப்புடன் கவனிக்கும் பன்மை ஏவலைக் குறிக்கிறது. ‘பார்த்துக்கொள்ளுங்கள்’ என்பது சமூகத்தின் பொறுப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μή τις
  choice: யாரும் ... செய்யாதபடி
  rationale: ὁρᾶτε என்பதுடன் சேர்ந்து, தடுக்கப்பட வேண்டிய செயலை இது அறிமுகப்படுத்துகிறது. இந்தத் தமிழ் அமைப்பு தடுப்பு நோக்கத்தையும் மூலத்தின் சிறு இலக்கணத் தெளிவின்மையையும் இயல்பாகக் காக்கிறது.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: தீமைக்குத் தீமை
  rationale: பழிவாங்குதலைக் குறிக்கும் செறிவான சொற்றொடரின் மீளுருவாக்கத்தையும் அதன் விரிந்த ஒழுக்கப் பொருளையும் இது காக்கிறது.
- source_word: τινι
  choice: எவருக்கும்
  rationale: செயலின் பெறுநரைக் குறிக்கும் காலவரையற்ற தத்தியை, விதிவிலக்கில்லாத விரிந்த நோக்குடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀποδῷ
  choice: திருப்பிச் செய்ய
  rationale: முன்னர் செய்யப்பட்ட தீமைக்குப் பதிலாக அதேபோன்ற செயலைச் செய்வது என்ற பதிலீட்டுப் பொருளை இது தெளிவாகக் காட்டுகிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: காலத்தைக் குறிக்கும் வினையடை இயல்பாகவும் நேரடியாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὸ ἀγαθὸν
  choice: நன்மையானதையே
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையை ‘நன்மையானது’ எனக் காட்டுகிறது; ‘-ஏ’ பின்னொட்டு தீமைக்கு மாறான நன்மையை நாட வேண்டும் என்ற வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: διώκετε
  choice: நாடுங்கள்
  rationale: விருப்பம் கொள்வதை மட்டும் அல்லாமல், நன்மையைத் தொடர்ந்து முனைப்புடன் தேடிச் செயல்படும் ஏவலை ‘நாடுங்கள்’ வெளிப்படுத்துகிறது.
- source_word: εἰς ἀλλήλους
  choice: ஒருவருக்கொருவரும்
  rationale: பரஸ்பர உறவில் நன்மை நோக்கிய செயலின் திசையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: καὶ εἰς πάντας
  choice: எல்லாருக்கும்
  rationale: நன்மை நோக்கிய செயலின் விரிந்த இலக்கைத் தெளிவாக வெளிப்படுத்துகிறது; ‘மக்கள்’ என்ற மூலத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் πάντας என்பதன் பரப்பைக் காக்கிறது.
theological_decisions:
- issue: கிறிஸ்தவ ஒழுக்கக் கடமையின் பரப்பு
  choice: ‘ஒருவருக்கொருவர்’ என்பதிலிருந்து ‘எல்லாருக்கும்’ என்று விரியும் அமைப்பை அப்படியே வைத்தல்
  alternative: ‘எல்லார்’ என்பது விசுவாசிகள் அனைவரை மட்டுமே குறிக்கிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: εἰς ἀλλήλους καὶ εἰς πάντας என்ற இணைப்பு, சமூகத்தின் உட்புற உறவிலிருந்து விரிந்த மனித வட்டத்திற்குச் செல்லலாம். ஆனால் ‘எல்லார்’ யார் என்பதை மொழிபெயர்ப்பிலேயே விளக்கித் தீர்மானிக்காமல், மூலத்தின் சொற்களையும் அதன் சாத்தியமான விரிவையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தீமைக்குத் தீமை’ என்ற மூலத்தின் சொல் மீளுருவாக்கம் காக்கப்பட்டுள்ளது; ‘நாடுங்கள்’ என்பது διώκετε என்பதன் முனைப்பான ஏவல் வலிமையை அளிக்கிறது. ‘எல்லாருக்கும்’ என்பதன் அடையாளத்தை முதன்மை உரை தீர்மானிக்காமல் விடுகிறது.
