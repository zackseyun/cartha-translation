  to: யாரும் எவருக்கும் தீமைக்குப் பதிலாகத் தீமை திருப்பிச் செய்யாதபடி பார்த்துக்கொள்ளுங்கள்.[a] மாறாக, ஒருவருக்கொருவரிடமும் எல்லாரிடமும் எப்போதும் நன்மையை நாடுங்கள்.[b]
  rationale: 'திருத்தம் இரண்டு இலக்குகளை நிறைவேற்றுகிறது: (1) εἰς ἀλλήλους καὶ εἰς πάντας என்ற இரட்டைத் திசையைத் தமிழில் ‘ஒருவருக்கொருவரிடமும் எல்லாரிடமும்’ என இயல்பாகவும் துல்லியமாகவும் காட்டுகிறது; (2) மூலத்தில் இல்லாத பிரத்தியேக வலியுறுத்தலை நீக்கி, ‘நன்மையை’ நாட வேண்டும் என்ற கட்டளையை வைத்திருக்கிறது. ‘பார்த்துக்கொள்ளுங்கள்’ மற்றும் ‘திருப்பிச் செய்யாதபடி’ ஆகியவை ὁρᾶτε μή τις ... ἀποδῷ என்ற தடுப்பு-விழிப்புணர்வு அமைப்பைத் தக்கவைக்கின்றன.'
