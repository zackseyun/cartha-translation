id: 1TH.5.2
reference: 1 Thessalonians 5:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: ta
  text: ஏனெனில், ஆண்டவருடைய நாள் இரவில் திருடன் வருவதுபோல் வரும் என்பதை நீங்களே மிக நன்றாக அறிந்திருக்கிறீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: நீங்களே
  rationale: வினைச்சொல்லிலேயே உள்ள இரண்டாம் நபர் எழுவாயை இந்த வலியுறுத்தும் பதிலிப்பெயர் சிறப்பித்துக் காட்டுகிறது; ‘நீங்களே’ அந்த வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இது தெளிவாகத் தருகிறது.
- source_word: ἀκριβῶς
  choice: மிக நன்றாக
  rationale: துல்லியமான அறிவைக் குறிக்கும் இச்சொல், οἴδατε என்பதுடன் சேர்ந்தபோது தமிழில் இயல்பாக ‘மிக நன்றாக அறிந்திருக்கிறீர்கள்’ என்று அமைகிறது.
- source_word: οἴδατε
  choice: அறிந்திருக்கிறீர்கள்
  rationale: οἶδα குறிக்கும் நிலையான அறிவை நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: ἡμέρα κυρίου
  choice: ஆண்டவருடைய நாள்
  rationale: இது வாராந்திர வழிபாட்டு நாளை அல்ல, ஆண்டவரின் இறுதிக்காலத் தலையீட்டுடன் தொடர்புடைய நிறுவப்பட்ட தீர்க்கதரிசனச் சொற்றொடரைக் குறிக்கிறது.
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: இரவில் திருடன் வருவதுபோல்
  rationale: எதிர்பாராத வருகையைச் சுட்டும் உவமையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் பாதுகாக்கிறது; ‘வருவது’ என்பது உவமையின் செயலை வெளிப்படையாக்குகிறது.
- source_word: οὕτως ἔρχεται
  choice: வரும்
  rationale: οὕτως காட்டும் உவமைசார்ந்த விதம் தமிழில் ‘வருவதுபோல் வரும்’ என்ற அமைப்பில் இயல்பாக உட்பொதிகிறது; நிகழ்கால வடிவத்தின் எதிர்கால நோக்கம் தமிழில் ‘வரும்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: ἡμέρα κυρίου என்ற இறுதிக்காலச் சொற்றொடர்
  choice: ஆண்டவருடைய நாள்
  alternative: ஆண்டவரின் வழிபாட்டு நாள்
  rationale: சூழல் தெய்வீகத் தலையீட்டின் நாளுடைய நேரத்தையும் திடீர் வருகையையும் பற்றியது; வாராந்திர வழிபாட்டு நாளைப் பற்றியது அல்ல. ஆகவே தீர்க்கதரிசனப் பின்னணியுள்ள சொற்றொடர் அப்படியே பாதுகாக்கப்படுகிறது.
- issue: ‘இரவில் திருடன் வருவதுபோல்’ என்ற உவமையின் வலிமை
  choice: திடீரெனவும் எதிர்பாராத விதமாகவும் நிகழும் வருகையைச் சுட்டும் உவமையாக மட்டும் வைத்தல்
  alternative: இரகசியமான வருகை அல்லது ஒரு குறிப்பிட்ட இறுதிக்கால நிகழ்ச்சி வரிசை என விரிவுபடுத்துதல்
  rationale: மூலவாக்கியம் திருடனைப் பற்றிய உருவகத்தை அளிக்கிறது; ஆனால் இரகசியம், காலக்கணிப்பு அல்லது குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டை வெளிப்படையாகக் கூறவில்லை. ஆகவே அந்தக் கூடுதல் கருத்துகள் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆண்டவர்’ என்பது κύριος என்பதற்கான இயல்பான மரியாதைச் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; ‘நீங்களே’ மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
