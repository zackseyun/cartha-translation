  source_fidelity: 'The translation accurately represents all major elements of the Greek: the emphatic αὐτοὶ (''நீங்களே''), explanatory γάρ (''ஏனெனில்''), precise knowledge (''மிக நன்றாக அறிந்திருக்கிறீர்கள்''), the eschatological expression ἡμέρα κυρίου (''ஆண்டவருடைய நாள்''), and the manner-and-arrival construction (''இரவில் திருடன் வருவதுபோல் வரும்''). The Tamil expansion of the nominal Greek simile into ''திருடன் வருவதுபோல்'' is necessary and does not add doctrinal content.'
  naturalness: The sentence is clear, idiomatic, and suitably dignified in modern standard Tamil. 'மிக நன்றாக அறிந்திருக்கிறீர்கள்' naturally communicates assured, precise knowledge. The phrase 'இரவில் திருடன் வருவதுபோல் வரும்' is readily understandable and preserves the unexpected-arrival image without overexplaining it.
  terminology: '''ஆண்டவருடைய நாள்'' is an appropriate established rendering for ἡμέρα κυρίου in this eschatological context and avoids confusion with a weekly worship day. ''ஆண்டவர்'' is a natural respectful rendering of κύριος. No terminology changes are needed.'
