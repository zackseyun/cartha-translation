reference: 1 Thessalonians 5:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: ta
  text: சமாதானத்தின் கடவுள்தாமே உங்களை முற்றிலும் பரிசுத்தமாக்குவாராக. உங்கள் ஆவியும் ஆன்மாவும் உடலும் முழுமையாக[a] நம் ஆண்டவராகிய இயேசு மெசியாவின்[b] வருகையின்போது குற்றமற்றவையாகக் காக்கப்படுவதாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆவி, ஆன்மா, உடல்” என்ற சொற்கள் மனித இயல்பை மூன்று தனித்த கூறுகளாகக் காட்டுகின்றனவா, அல்லது முழு மனிதரையும் வலியுறுத்துகின்றனவா என்பதில் விளக்கவுரையாளர்கள் வேறுபடுகின்றனர்.
    reason: lexical_alternative
  - marker: b
    text: மரபுவழியாக, “நம் ஆண்டவராகிய இயேசு கிறிஸ்துவின் வருகையின்போது” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης
  choice: சமாதானத்தின் கடவுள்தாமே
  rationale: αὐτός தரும் வலியுறுத்தலை ‘தாமே’ இயல்பாகப் பாதுகாக்கிறது; δέ இங்கு மென்மையான மாற்றத்தைக் குறிக்கும் என்பதால் தனியாக ஒரு காலச் சொல்லைச் சேர்க்கவில்லை. ‘சமாதானத்தின் கடவுள்’ என்ற பவுலின் சிறப்புப்பெயர் முறையாகத் தக்கவைக்கப்படுகிறது.
- source_word: ἁγιάσαι ὑμᾶς ὁλοτελεῖς
  choice: உங்களை முற்றிலும் பரிசுத்தமாக்குவாராக
  rationale: விருப்பம் அல்லது வேண்டுதலைக் குறிக்கும் optative வடிவத்தை ‘-வாராக’ வெளிப்படுத்துகிறது. ὁλοτελεῖς குறிக்கும் முழுமையை ‘முற்றிலும்’ இயல்பாகத் தருகிறது.
- source_word: ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: உங்கள் ஆவி, ஆன்மா, உடல் ஆகிய அனைத்தும்
  rationale: மூன்று கிரேக்கச் சொற்களின் வேறுபாட்டையும் வரிசையையும் காத்து, ὁλόκληρον குறிக்கும் முழுமையை ‘ஆகிய அனைத்தும்’ எனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀμέμπτως ... τηρηθείη
  choice: குற்றமற்றவையாகக் காக்கப்படுவனவாக
  rationale: இறைவேண்டுதலின் passive optative நுணுக்கத்தையும், குற்றஞ்சாட்ட முடியாத நிலை என்ற பொருளையும் காக்கிறது.
- source_word: ἐν τῇ παρουσίᾳ
  choice: வருகையின்போது
  rationale: பவுலின் இறுதிக்காலச் சூழலில் παρουσία ஆண்டவரின் வருகை அல்லது வந்து இருப்பதைக் குறிக்கிறது; ‘வருகையின்போது’ தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: நம் ஆண்டவராகிய இயேசு மெசியா
  rationale: Χριστός என்பதன் பட்டப்பெயர்ப் பொருளை ஒலிபெயர்ப்பாகிய ‘கிறிஸ்து’ என விடாமல் ‘மெசியா’ என்று தருகிறது; ‘ஆகிய’ தமிழ் தொடரை இயல்பாக்குகிறது.
theological_decisions:
- issue: ஆவி, ஆன்மா, உடல் என்ற மும்மை
  choice: மூன்று சொற்களையும் தனித்தனியாகத் தக்கவைத்து, ‘ஆகிய அனைத்தும்’ என்று முழுமையை வெளிப்படுத்துதல்
  alternative: இவற்றை ‘உங்கள் முழு ஆளுமை’ என்று ஒன்றிணைத்துப் பொருளுரைத்தல்
  rationale: மூலவாக்கியம் மூன்றையும் வெளிப்படையாகக் குறிப்பிடுகிறது; ஆனால் மனிதன் கட்டாயமாக மூன்று தனித்த கூறுகளால் ஆனவன் என்ற கோட்பாட்டைத் தீர்மானிக்கவில்லை. மொழிபெயர்ப்பு அந்தத் தெளிவையும் தீராத இறையியல் பதற்றத்தையும் காக்க வேண்டும்.
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பட்டப்பெயராகச் செயல்படுகிறது. எனவே அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது; மரபுவழி ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவேண்டுதலுக்குரிய ‘-வாராக’ வடிவத்துடன் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘கடவுள்தாமே’ என்பது αὐτός தரும் வலியுறுத்தலை இயல்பாகக் காட்டுகிறது. மும்மைச் சொற்றொடர் கோட்பாட்டுரீதியாக விளக்கித் தீர்க்கப்படாமல் அப்படியே பாதுகாக்கப்பட்டது.
