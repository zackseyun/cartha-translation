lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ஆவியானவரை
  rationale: இங்கே πνεῦμα என்பது அடுத்த வசனங்களில் வரும் தீர்க்கதரிசனங்களும் பகுத்தறிதலும் தொடர்புடைய சூழலில், பெரும்பாலும் பரிசுத்த ஆவியானவரைக் குறிக்கிறது. தமிழில் மரியாதையையும் தனிப்பட்ட செயற்பாட்டாளரையும் இயல்பாகக் காட்ட ‘ஆவியானவர்’ பயன்படுத்தப்பட்டது.
- source_word: μὴ
  choice: …ஆதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை ஒரு தடையை வெளிப்படுத்துகிறது; தமிழில் மரியாதைப் பன்மைத் தடை விகுதியான ‘ஆதீர்கள்’ இதை இயல்பாகத் தருகிறது.
- source_word: σβέννυτε
  choice: அணைத்துவிடாதீர்கள்
  rationale: σβέννυμι என்பதன் அடிப்படைப் பொருள் நெருப்பு அல்லது தீபத்தை அணைப்பது. ‘அணைத்துவிடாதீர்கள்’ அந்த உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது; ஆவியானவரின் செயல்பாட்டை ஒடுக்காதிருப்பதையும் உணர்த்துகிறது.
theological_decisions:
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியானவர்
  alternative: ஆவி; மனித ஆவி அல்லது ஆவிக்குரிய ஆர்வம்/வரம்
  rationale: உடனடி சூழலில் தீர்க்கதரிசனங்களை இகழாதிருப்பதற்கான அறிவுரை வருவதால், சபையில் செயல்படும் பரிசுத்த ஆவியானவரே பெரும்பாலும் குறிக்கப்படுகிறார். எனினும் கிரேக்கச் சொல்லின் பரந்த பொருள் காரணமாக மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘அணைத்துவிடுதல்’ என்ற தீ சார்ந்த மூல உருவகம் காக்கப்பட்டுள்ளது; சாத்தியமான பொருள் வேறுபாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
