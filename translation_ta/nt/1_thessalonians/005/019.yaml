    text: அல்லது, ‘பரிசுத்த ஆவியானவரை.’ கிரேக்கச் சொல் பொதுவாக ஆவியைக் குறிக்கலாம்; ஆனால் அடுத்து தீர்க்கதரிசனங்கள் குறிப்பிடப்படுவதால், இங்கே அது பெரும்பாலும் பரிசுத்த ஆவியைக் குறிக்கிறது.
