translation:
  language: ta
  text: ஆனால் எல்லாவற்றையும் சோதித்துப் பாருங்கள்[a]; நல்லதை உறுதியாகப் பற்றிக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எல்லாக் காரியங்களையும்.’ இந்தச் சூழலில், குறிப்பாகத் தீர்க்கதரிசன உரைகளை மதிப்பிட்டு ஆராய்வதும் இதில் அடங்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: நடுநிலைப் பன்மை குற்றுவேற்றுமை வடிவம் விரிவான பொருளைக் கொண்டது. தமிழில் ‘எல்லாவற்றையும்’ என்பது இயல்பாகவும் முழுமையான பரப்பைத் தக்கவைத்தும் உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய அறிவுறுத்தல்களோடு மென்மையான மாறுபாட்டையோ தொடர்ச்சி மாற்றத்தையோ குறிக்கிறது; சூழலில் ‘ஆனால்’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δοκιμάζετε
  choice: சோதித்துப் பாருங்கள்
  rationale: தொடர்ந்து ஆராய்ந்து உண்மைத்தன்மையையோ மதிப்பையையோ கண்டறியுமாறு கூறும் நிகழ்காலக் கட்டளையை, நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ καλὸν
  choice: நல்லதை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நடுநிலை ஒருமை அடைமொழியைச் சுருக்கமாகவும் இயல்பாகவும் மொழிபெயர்த்து, நல்லது எதுவோ அதைக் குறிக்கிறது.
- source_word: κατέχετε
  choice: உறுதியாகப் பற்றிக்கொள்ளுங்கள்
  rationale: சோதித்து அறிந்தபின் நல்லதைத் தொடர்ந்து கைவிடாமல் கடைப்பிடிக்கும் வலுவான பற்றுதலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தீர்க்கதரிசனத்தையும் பகுத்தறிதலையும் பற்றிய சூழலில் πάντα என்பதன் பரப்பு
  choice: ‘எல்லாவற்றையும்’ என்று விரிவாக மொழிபெயர்த்து, உடனடிச் சூழல் குறிப்பாகத் தீர்க்கதரிசன உரைகளைச் சோதிப்பதையும் உள்ளடக்க அனுமதிக்கப்பட்டது.
  alternative: ‘எல்லாத் தீர்க்கதரிசனங்களையும்’ அல்லது ‘சொல்லப்படும் எல்லாவற்றையும்’ என்று வரம்புபடுத்துதல்
  rationale: 20ஆம் வசனத்தின் உடனடிச் சூழலில் தீர்க்கதரிசனம் இருந்தாலும், கிரேக்க மூலத்தில் πάντα என்பதோடு அதை வரம்புபடுத்தும் பெயர்ச்சொல் இல்லை. ஆகவே மொழிபெயர்ப்பு அதன் விரிவான பொருளையும் இறையியல் இழுபறியையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சோதித்துப் பாருங்கள்’ என்பது வெறும் சோதனை அல்ல, மதிப்பிட்டு ஆராயும் பொருளையும் இயல்பாகத் தருகிறது; ‘உறுதியாகப் பற்றிக்கொள்ளுங்கள்’ κατέχετε என்பதன் தொடர்ச்சியான பற்றுதலை வெளிப்படுத்துகிறது.
