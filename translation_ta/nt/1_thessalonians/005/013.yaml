translation:
  language: ta
  text: அவர்களுடைய பணியின் காரணமாக, அன்புடன் அவர்களை மிக மிக உயர்வாக மதியுங்கள்.[a] உங்களுக்குள் சமாதானமாக இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அன்புடன் அவர்களை அளவுகடந்து உயர்வாக மதியுங்கள்.” கிரேக்க வினையடை வழக்கத்திற்கு மிஞ்சிய தீவிரம் உடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: மேலும் (தமிழ் வாக்கிய ஓட்டத்தில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இது முந்தைய வசனத்தின் அறிவுறுத்தலுடன் இச்சொற்றொடரை இணைக்கிறது. ஆனால் தனித்தமிழ் வாக்கியத்தில் கட்டாயமாக ‘மேலும்’ சேர்ப்பது இயல்பான ஓட்டத்தைத் தடுக்கக்கூடும்; தொடர்ச்சியை வாக்கிய அமைப்பே உணர்த்துகிறது.
- source_word: ἡγεῖσθαι
  choice: மதியுங்கள்
  rationale: இங்கு தலைமை வகிப்பது என்ற பொருள் அல்ல; ஒருவரை உயர்வாகக் கருதி மதிப்பிடுதல் என்பதே சூழலுக்குப் பொருந்துகிறது. ‘மதியுங்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: முந்தைய வசனத்தில் சபையாரிடையே உழைத்து வழிநடத்தி அறிவுறுத்துகிறவர்களையே இந்தப் பன்மைச் சுட்டுப்பெயர் குறிக்கிறது.
- source_word: ὑπερεκπερισσοῦ
  choice: மிக மிக உயர்வாக
  rationale: அரிதான இந்த வினையடை வழக்கத்திற்கு மிஞ்சிய தீவிரத்தை வலியுறுத்துகிறது. ‘மிக மிக உயர்வாக’ என்பது அந்த மிகுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν ἀγάπῃ
  choice: அன்புடன்
  rationale: அவர்களை எவ்வாறு மதிக்க வேண்டும் என்பதை இச்சொற்றொடர் குறிப்பிடுகிறது. ‘அன்புடன்’ என்பது ἀγάπη என்ற முக்கியக் கருத்தைத் தக்கவைத்து தமிழில் இயல்பாக உள்ளது.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: அவர்களுடைய பணியின் காரணமாக
  rationale: διά + வேற்றுமை உருபு இங்கு காரணத்தையோ அடிப்படையையோ குறிக்கிறது. ‘பணி’ என்பது ἔργον என்ற பெயர்ச்சொல்லின் தெளிவான பொருளைத் தக்கவைக்கிறது.
- source_word: εἰρηνεύετε
  choice: சமாதானமாக இருங்கள்
  rationale: நடந்துகொண்டிருக்கும் நிலை அல்லது தொடர்ச்சியான நடைமுறையை வலியுறுத்தும் கட்டளை இது. ‘சமாதானமாக இருங்கள்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐν ἑαυτοῖς
  choice: உங்களுக்குள்
  rationale: பன்மைத் தற்சுட்டுச் சொல் விசுவாசக் குழுவினரிடையே நிலவும் சமாதானத்தைக் குறிக்கிறது. ‘உங்களுக்குள்’ அந்தக் குழு சார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
