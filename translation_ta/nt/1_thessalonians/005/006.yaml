  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: ta
  text: ஆகவே, மற்றவர்கள் தூங்குவதுபோல் நாம் தூங்காமல், மாறாக விழித்திருந்து நிதானமாயிருப்போம்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விழிப்புடன் இருப்போம்.” கிரேக்க வினைச்சொல் விழித்திருப்பதையோ எச்சரிக்கையுடன் இருப்பதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மது மயக்கமின்றி இருப்போம்,” “தன்னடக்கத்துடன் இருப்போம்,” அல்லது “தெளிந்த மனத்துடன் இருப்போம்.” கிரேக்க வினைச்சொல் அடிப்படையில் மதுமயக்கமின்மையையும், விரிவான பொருளில் மன விழிப்பையும் கட்டுப்பாட்டையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் வலியுறுத்தப்பட்ட முடிவையும் அறிவுறுத்தலுக்கான இயல்பான மாற்றத்தையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: μὴ καθεύδωμεν
  choice: நாம் தூங்காமல்
  rationale: μή உடன் வரும் நிகழ்கால அறிவுறுத்தல் துணைவினையின் கூட்டுப் பொருளை இயல்பான தமிழில் தருகிறது; ஒழுக்க மற்றும் ஆன்மீக அலட்சியத்தைக் குறிக்கும் தூக்க உருவகத்தையும் அப்படியே காக்கிறது.
- source_word: ὡς οἱ λοιποί
  choice: மற்றவர்கள் தூங்குவதுபோல்
  rationale: சுற்றியுள்ள வசனங்களில் விசுவாசிகளுக்கு மாறாகக் குறிப்பிடப்படும் பிற மக்களை ‘மற்றவர்கள்’ எனத் தெளிவாகக் காட்டுகிறது; தமிழில் ஒப்பீட்டை முழுமையாக்க ‘தூங்குவது’ மீண்டும் சொல்லப்பட்டுள்ளது.
- source_word: ἀλλὰ
  choice: — ;
  rationale: எதிர்மறையான ‘தூங்காமல்’ என்பதிலிருந்து நேர்மறை அறிவுறுத்தலுக்கு மாறுவது தமிழ்ச் சொற்றொடர் அமைப்பிலேயே தெளிவாக இருப்பதால் தனியே ‘ஆனால்’ சேர்க்கப்படவில்லை; அரைப்புள்ளி இரு இணை அறிவுறுத்தல்களைப் பிரிக்கிறது.
- source_word: γρηγορῶμεν
  choice: விழித்திருப்போம்
  rationale: தூங்குதல்–விழித்திருத்தல் என்ற நேரடி எதிர்நிலையைப் பாதுகாக்கிறது; அதேவேளை சூழலில் உள்ள விழிப்புணர்வு என்ற பொருளையும் ஏற்கிறது.
- source_word: νήφωμεν
  choice: நிதானமாயிருப்போம்
  rationale: மது மயக்கமின்மை, தெளிந்த மனநிலை, தன்னடக்கம் ஆகிய தொடர்புடைய பொருள் நிழல்களைத் தமிழில் இயல்பாகத் தாங்குகிறது; பொருளை ஒரே அப்ஸ்ட்ராக்ட் நற்பண்பாகக் குறுக்கவில்லை.
theological_decisions:
- issue: தூக்கம்–விழிப்பு உருவகத்தின் தன்மை
  choice: ஒழுக்க மற்றும் ஆன்மீக அறிவுறுத்தலாகத் தூக்கம்–விழிப்பு உருவகத்தை முதன்மை உரையில் காத்தல்
  alternative: ஒழுக்க அலட்சியம்–ஆன்மீக விழிப்புணர்வு என்று நேரடியாகப் பொழிப்புரை செய்தல்
  rationale: முந்தைய சூழலில் வரும் இரவு, இருள், ஒளி ஆகிய பவுலின் உருவகத் தொடரை இது காக்கிறது; விளக்கத்தை மொழிபெயர்ப்புக்குள் திணிக்கவில்லை.
- issue: νήφω என்பதன் பொருள் பரப்பு
  choice: நிதானமாயிருப்போம்
  alternative: மது மயக்கமின்றி இருப்போம்; தன்னடக்கத்துடன் இருப்போம்; தெளிந்த மனத்துடன் இருப்போம்
  rationale: இந்த வினைச்சொல்லில் உள்ள நேரடி மதுவிலக்கு உணர்வையும், விரிவான மனத் தெளிவு மற்றும் கட்டுப்பாடு உணர்வையும் ஒரே பொருளாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.
