  register: நவீன பொதுத் தமிழில் எளிதில் புரியும், அதேவேளை வேதாகம அறிவுறுத்தலுக்கேற்ற கண்ணியமான பன்மைத் தூண்டல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தூங்காமல்—விழித்திருப்போம்’ என்ற உருவக எதிர்நிலை இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
