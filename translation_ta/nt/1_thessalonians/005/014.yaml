source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: ta
  text: 'மேலும், சகோதரர்களே[a], நாங்கள் உங்களிடம் வலியுறுத்திக் கேட்டுக்கொள்கிறோம்: ஒழுங்கின்றி நடப்பவர்களுக்குப் புத்திசொல்லுங்கள்[b]; மனந்தளர்ந்தவர்களை ஊக்கப்படுத்துங்கள்[c]; பலவீனமானவர்களுக்குத் துணைநில்லுங்கள்[d]; எல்லோரிடமும் பொறுமையாக இருங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதர சகோதரிகளே” என்றும் மொழிபெயர்க்கலாம்; பவுல் முழுச் சபையினரையும் அழைத்துப் பேசுகிறார்.
    reason: alternative_reading
  - marker: b
    text: “கட்டுப்பாடின்றி நடப்பவர்கள்,” “அடங்காதவர்கள்” அல்லது, இச்சூழலில், “வேலை செய்யாமல் இருப்பவர்கள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: “சோர்ந்துபோனவர்களைத் தேற்றுங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: “பலவீனமானவர்களை ஆதரியுங்கள்” அல்லது “அவர்களைப் பற்றிக்கொள்ளுங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: நாங்கள் உங்களை வலியுறுத்திக் கேட்டுக்கொள்கிறோம்
  rationale: அப்போஸ்தலரின் அக்கறையுள்ள, வலிமையான வேண்டுகோளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; வெறும் ஊக்குவித்தல் என்ற மென்மையான பொருளாகக் குறுக்கவில்லை.
- source_word: δέ
  choice: மேலும்
  rationale: இங்கு வலுவான முரண்பாட்டைக் காட்டாமல், முந்தைய அறிவுரைகளின் தொடர்ச்சியைக் குறிக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் காக்கிறது; முழுச் சபையையும் உள்ளடக்கும் சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: νουθετεῖτε
  choice: புத்திசொல்லுங்கள்
  rationale: தவறைத் திருத்தும் நோக்கில் அறிவுறுத்துதல் அல்லது எச்சரித்தல் ஆகிய இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀτάκτους
  choice: ஒழுங்கின்றி நடப்பவர்கள்
  rationale: ஒழுங்குக்கு அப்பாற்பட்டு அல்லது கட்டுப்பாடின்றி நடப்போர் என்ற பரந்த பொருளைக் காக்கிறது; சோம்பேறிகள் என்று மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: παραμυθεῖσθε
  choice: ஊக்கப்படுத்துங்கள்
  rationale: அன்பாகப் பேசி தேற்றுதல், மனவுறுதி அளித்தல் என்ற மேய்ப்புப் பணிசார் நுட்பத்தைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ὀλιγοψύχους
  choice: மனந்தளர்ந்தவர்கள்
  rationale: தைரியம் குன்றிய அல்லது சோர்வுற்றவர்களைக் குறிக்கும் சொல்லின் பொருளை தற்போதைய இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀντέχεσθε
  choice: துணைநில்லுங்கள்
  rationale: ஒருவரைப் பற்றிக்கொண்டு கைவிடாமல் ஆதரித்தல் என்ற வினையின் உறவுசார், நடைமுறை வலிமையை வெளிப்படுத்துகிறது.
- source_word: τῶν ἀσθενῶν
  choice: பலவீனமானவர்கள்
  rationale: உடல், மனம், ஒழுக்கம் அல்லது சமூக நிலை ஆகியவற்றில் எது பலவீனம் என்பதைத் தீர்மானிக்காமல் மூலத்தின் பரந்த பொருளைக் காக்கிறது.
- source_word: μακροθυμεῖτε
  choice: பொறுமையாக இருங்கள்
  rationale: மக்களிடம் நீடிய பொறுமையைக் கடைப்பிடிப்பதைக் குறிக்கும் தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: πρὸς πάντας
  choice: எல்லோரிடமும்
  rationale: கட்டளை யாரையும் விலக்காமல் அனைத்து மக்களிடமும் கடைப்பிடிக்கப்பட வேண்டும் என்ற உலகளாவிய நோக்கைத் தெரிவிக்கிறது.
theological_decisions:
- issue: சபையை அழைக்கும் ἀδελφοί என்பதன் உள்ளடக்கும் பொருள்
  choice: முதன்மை உரையில் “சகோதரர்களே” என்று மொழிபெயர்த்து, கலப்புப் பாலினச் சபையைக் குறிக்கும் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: “சகோதர சகோதரிகளே”
  rationale: மூலத்தின் இலக்கண வடிவத்தை மறைக்காமல் காக்கிறது; அதேவேளையில் பவுல் முழுச் சபையையும் அழைக்கிறார் என்ற சூழல்சார் பொருளையும் வாசகருக்குத் தெளிவுபடுத்துகிறது.
- issue: “பலவீனமானவர்கள்” என்பவர்களின் பலவீன வகை
  choice: பலவீனத்தின் தன்மையை வரையறுக்காமல் விடுதல்
  alternative: உடல்நலமற்றவர்கள் அல்லது விசுவாசத்தில் பலவீனமானவர்கள் என்று குறிப்பாக்குதல்
  rationale: τῶν ἀσθενῶν எந்த வகையான பலவீனத்தைக் குறிக்கிறது என்பதை இவ்வசனம் தெளிவாக நிர்ணயிக்கவில்லை; ஆகவே உடல் அல்லது ஆன்மீக பலவீனம் எனத் தீர்த்துவிடாமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் மேய்ப்புப் பணிக்குரிய அக்கறையும் கொண்ட நேரடியான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. “புத்திசொல்லுங்கள்” என்பது பொதுவாசகருக்குப் புரியும் திருத்தும் அறிவுரையையும், “துணைநில்லுங்கள்” என்பது கைவிடாமல் ஆதரிக்கும் செயலையும் இயல்பாகக் காட்டுகின்றன. மூல உரையின் நான்கு இணையான கட்டளைகள் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
