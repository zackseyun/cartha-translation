  source_fidelity: ‘எப்போதும்’ πάντοτε என்பதன் முழுமையான கால-அளவைக் கச்சிதமாகத் தருகிறது. ‘மகிழ்ச்சியாயிருங்கள்’ χαίρετε என்ற இரண்டாம் நபர் பன்மை நிகழ்காலக் கட்டளையின் அறிவுறுத்தல் தன்மையைப் பாதுகாக்கிறது. தமிழில் நிகழ்காலத் தொடர்நிலையைத் தனியே கட்டாயமாகக் குறிக்க வேண்டியதில்லை; அடிக்குறிப்பு அதைத் தகுந்தவாறு விளக்குகிறது.
