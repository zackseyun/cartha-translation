lexical_decisions:
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: இந்த வினையடை இடைவிடாத தன்மையையோ எல்லாக் காலங்களிலும் என்பதையோ குறிக்கிறது. ‘எப்போதும்’ என்பது அதன் முழுமையான வலிமையை இயல்பாகவும் சுருக்கமாகவும் தக்கவைக்கிறது.
- source_word: χαίρετε
  choice: மகிழ்ச்சியாயிருங்கள்
  rationale: இது χαίρω என்பதன் இரண்டாம் நபர் பன்மை, நிகழ்காலச் செயப்படுவினை கட்டளை வடிவம். ‘மகிழ்ச்சியாயிருங்கள்’ என்பது பன்மைக் கட்டளையையும் மகிழ்ச்சியைக் குறிக்கும் பொருளையும் நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; நிகழ்கால வடிவத்தின் தொடர்ச்சியான நுண்பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
