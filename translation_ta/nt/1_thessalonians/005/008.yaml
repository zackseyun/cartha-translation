revisions:
- from: நாமோ பகலைச் சேர்ந்தவர்களாக இருப்பதால், நிதானமாய் இருப்போமாக; விசுவாசத்தையும்[a] அன்பையும் மார்புக்கவசமாகவும், மீட்பின் எதிர்நோக்கைத் தலைக்கவசமாகவும்[b] அணிந்துகொள்வோமாக.
  to: நாமோ பகலைச் சேர்ந்தவர்களாக இருப்பதால், தெளிந்த மனதுடன் இருப்போமாக; விசுவாசம்[a] மற்றும் அன்பு என்னும் மார்புக்கவசத்தையும், மீட்பின் எதிர்நோக்கு என்னும் தலைக்கவசத்தையும் அணிந்துகொண்டு இருப்போமாக.
  rationale: The wording for νήφωμεν is changed to தெளிந்த மனதுடன் இருப்போமாக to retain its sober, clear-minded force without adding interpretation. அணிந்துகொண்டு இருப்போமாக expresses the participial relationship of ἐνδυσάμενοι naturally in Tamil. The armor is recast as ‘faith and love’ and ‘hope of salvation’ functioning as the respective items of armor. Footnote a is corrected to identify πίστις as the Greek source term. Footnote b remains a word-order alternative, but its anchor should be placed after தலைக்கவசத்தையும் in production.
