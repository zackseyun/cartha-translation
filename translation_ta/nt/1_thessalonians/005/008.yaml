id: 1TH.5.8
reference: 1 Thessalonians 5:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: ta
  text: நாமோ பகலைச் சேர்ந்தவர்களாக இருப்பதால், தெளிந்த மனதுடன் இருப்போமாக; விசுவாசம்[a] மற்றும் அன்பு என்னும் மார்புக்கவசத்தையும், மீட்பின் எதிர்நோக்கு என்னும் தலைக்கவசத்தையும் அணிந்துகொண்டு இருப்போமாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உண்மைத்தன்மை’. கிரேக்கச் சொல் πίστις, ‘விசுவாசம்,’ ‘நம்பிக்கை,’ அல்லது ‘உண்மைத்தன்மை’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: நாமோ
  rationale: δέ முந்தைய வசனங்களில் குறிப்பிடப்பட்டவர்களுடன் ஒரு முரண்பாட்டைக் குறிக்கிறது; தமிழ் மொழியில் ‘நாமோ’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡμέρας ὄντες
  choice: பகலைச் சேர்ந்தவர்களாக இருப்பதால்
  rationale: இது வெறும் பகல் நேரத்தில் இருப்பதைக் குறிக்காமல், ‘பகல்’ என்னும் உருவகத் தளத்தைச் சேர்ந்திருப்பதைக் குறிக்கிறது. காரணத் தொடர்பும் தமிழில் தெளிவாக வெளிப்படுகிறது.
- source_word: νήφωμεν
  choice: நிதானமாய் இருப்போமாக
  rationale: νήφω என்பதில் மதுமயக்கமின்மை, விழிப்புணர்வு, தன்னடக்கம் ஆகிய ஒலிப்புகள் உள்ளன. ‘நிதானமாய்’ என்பது உருவகத்தை அளவுக்கு மீறி விளக்காமல் தெளிந்த, கட்டுப்பாடுள்ள நிலையைக் குறிக்கிறது.
- source_word: ἐνδυσάμενοι
  choice: அணிந்துகொள்வோமாக
  rationale: கிரேக்கப் பங்கேற்புவினை முதன்மை அறிவுறுத்தலுடன் இணைந்த சூழ்நிலையையோ முறையையோ காட்டுகிறது. தமிழில் ஒருங்கிணைந்த அறிவுறுத்தலாக அமைப்பது இயல்பாகவும் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: θώρακα
  choice: மார்புக்கவசம்
  rationale: வெளிப்படையான படைக்கல உருவகத்தைக் காக்கும் நேரடியான, புரிந்துகொள்ளத்தக்க சொல்.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இங்கு அன்பு, எதிர்நோக்கு ஆகிய பண்புகளுடன் இணையும் πίστις என்பதற்கு ‘விசுவாசம்’ இயல்பான முதன்மைத் தெரிவாகும்; ‘உண்மைத்தன்மை’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἀγάπης
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: περικεφαλαίαν
  choice: தலைக்கவசம்
  rationale: படைக்கல உருவகத்திற்கான நேரடியான நவீனத் தமிழ் சொல்.
- source_word: ἐλπίδα σωτηρίας
  choice: மீட்பின் எதிர்நோக்கு
  rationale: σωτηρία குறிக்கும் மீட்பையும், ἐλπίς குறிக்கும் எதிர்காலத்தை நம்பிக்கையுடன் எதிர்நோக்கும் நிலையையும் வேறுபடுத்தித் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: படைக்கல உருவகத்தில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: உண்மைத்தன்மை; நம்பிக்கை/நம்புதல்
  rationale: அன்பும் எதிர்நோக்கும் சேர்ந்த பண்புத் தொடரில் ‘விசுவாசம்’ முதன்மை வாசிப்பாகப் பொருந்துகிறது; ஆனால் கிரேக்கச் சொல் ‘உண்மைத்தன்மை’ என்றும் பொருள்படக்கூடியதால் அந்தச் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: ἡμέρας ὄντες என்பதன் வலிமை
  choice: பகலைச் சேர்ந்தவர்களாக இருப்பதால்
  alternative: பகலுக்குரியவர்களாக இருப்பதால்
  rationale: இது நேரத்தை மட்டும் அல்ல, உருவகமான சார்பையும் அடையாளத்தையும் குறிக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அந்த உருவகம் காக்கப்படுகிறது.
- issue: ἐνδυσάμενοι என்பதன் தொடரியல் உறவு
  choice: முதன்மை அறிவுறுத்தலுடன் இணைந்த ‘அணிந்துகொள்வோமாக’
  alternative: அணிந்துகொண்டவர்களாய் நிதானமாய் இருப்போமாக
  rationale: பங்கேற்புவினை முன்நிகழ்வை மட்டும் கட்டாயப்படுத்தாமல், நிதானமாய் இருப்பதுடன் இணையும் முறையையோ சூழ்நிலையையோ காட்டலாம். இயல்பான தமிழுக்காக இணை அறிவுறுத்தல் பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரபுச் சொற்களுக்கும் பொதுவான புரிதலுக்கும் இடையில் சமநிலை காக்கப்பட்டுள்ளது. ‘நாமோ’, ‘இருப்போமாக’ ஆகியவை பவுலின் எதிர்மறை ஒப்பீட்டையும் கூட்டான அறிவுறுத்தலையும் கண்ணியமான நடையில் தருகின்றன; படைக்கல உருவகம் முழுமையாகத் தக்கவைக்கப்பட்டுள்ளது.
