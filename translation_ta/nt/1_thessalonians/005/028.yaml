  yaml_path: translation/nt/1_thessalonians/005/028.yaml
  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: ta
  text: நம்முடைய ஆண்டவராகிய இயேசு மேசியாவின் அருள் உங்களோடு இருப்பதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “உங்கள் அனைவரோடும் இருப்பதாக” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் நிறைவு ஆசீர்வாதங்களில் χάρις என்பது கடவுளின் தயவையும் அருள்செயலையும் குறிக்கிறது; தமிழில் இயல்பாகவும் இறையியல் செறிவுடனும் பயன்படும் இணைச்சொல் ‘அருள்’.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος இங்கு இயேசுவுக்குரிய பட்டமாக இருப்பதால், அதன் அதிகாரத்தையும் இறையியல் நிறையையும் காக்கும் வழக்கமான தமிழ்ச் சொல் ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: பெயர் தமிழின் நிலையான ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: Χριστός இங்கு இயேசுவுக்குரிய பட்டமாகப் புரிந்துகொள்ளப்பட முடிவதால், அதன் ‘அபிஷேகம் பெற்றவர்’ என்ற யூதப் பின்னணியை வெளிப்படுத்த ‘மேசியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: μεθ’ ὑμῶν
  choice: உங்களோடு இருப்பதாக
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாத ஆசீர்வாதச் சொற்றொடர் இது. தமிழில் அதன் விருப்பம் அல்லது வாழ்த்து சார்ந்த பொருளை இயல்பாக வெளிப்படுத்த ‘இருப்பதாக’ சேர்க்கப்பட்டது.
- source_word: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: நம்முடைய ஆண்டவராகிய இயேசு மேசியாவின் அருள்
  rationale: மூலத்தின் உரிமைத் தொடர்புச் சங்கிலி காக்கப்பட்டுள்ளது; ‘ஆகிய’ என்பது ஆண்டவர் என்ற பட்டத்தை இயேசுவுடன் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
theological_decisions:
- issue: Χριστοῦ என்ற சொல்லை பவுலின் நிறைவு ஆசீர்வாதத்தில் மொழிபெயர்த்தல்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பட்டமாகத் தன் பொருளைத் தக்கவைக்க முடிவதால் ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது. இருப்பினும் ‘கிறிஸ்து’ என்பது தமிழ்க் கிறிஸ்தவ வழக்கில் நிலைபெற்ற ஒலிபெயர்ப்பு; மூலச்சொல்லின் பயன்பாடு பெயர்போன்றதாகவும் உணரப்படலாம்.
- issue: வினைச்சொல் இல்லாத கிரேக்க ஆசீர்வாத வடிவம்
  choice: இருப்பதாக
  alternative: உங்களோடு
  rationale: மூலத்தில் εἴη அல்லது ἔστω போன்ற வினைச்சொல் எழுதப்படவில்லை; ஆனால் வாழ்த்துப் பொருள் மறைமுகமாக உள்ளது. தமிழில் முழுமையான, இயல்பான ஆசீர்வாத வாக்கியத்திற்காக ‘இருப்பதாக’ வழங்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், திருச்சபை வாசிப்புக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘உங்களோடு’ பன்மையைத் தக்கவைக்கிறது; ‘இருப்பதாக’ ஆசீர்வாதத்தின் இயல்பான தமிழ்ச் சொற்றொடரை வழங்குகிறது.
