  source_fidelity: 'மூல கிரேக்கத்தின் சொற்சங்கிலி துல்லியமாகக் காக்கப்பட்டுள்ளது: ἡ χάρις ‘அருள்’, τοῦ κυρίου ἡμῶν ‘நம்முடைய ஆண்டவராகிய’, Ἰησοῦ Χριστοῦ ‘இயேசு மேசியா’, μεθ’ ὑμῶν ‘உங்களோடு இருப்பதாக’ என்று பொருத்தமாக வழங்கப்பட்டுள்ளன. வினையில்லா ஆசீர்வாத வடிவத்தின் விருப்பப் பொருளை ‘இருப்பதாக’ இயல்பாக வெளிப்படுத்துகிறது.'
  naturalness: ‘நம்முடைய ஆண்டவராகிய இயேசு மேசியாவின் அருள் உங்களோடு இருப்பதாக’ என்பது நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான, திருச்சபை வாசிப்பிற்கும் ஏற்ற ஆசீர்வாத நடை. பன்மைச் சுட்டு ‘உங்களோடு’ மூலத்தின் ὑμῶν என்பதைக் காக்கிறது.
  terminology: ‘ஆண்டவர்’ κύριος என்பதன் நிலையான இறையியல் பட்டத்தையும், ‘மேசியா’ Χριστός என்பதன் பட்டப் பொருளையும் சரியாகத் தக்கவைக்கின்றன. ‘அருள்’ χάρις என்பதற்கான சுருக்கமான, பொருத்தமான தமிழ்ச் சொல்லாகும்.
