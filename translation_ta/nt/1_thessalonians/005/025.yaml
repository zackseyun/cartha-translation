translation:
  language: ta
  text: சகோதரர்களே[a], எங்களுக்காக ஜெபியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதரர்களே, சகோதரிகளே”; இந்த அழைப்பு சபையார் அனைவரையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: சகோதரர்களே
  rationale: ἀδελφός என்பதன் அழைப்புவேற்றுமைப் பன்மை ஆண்பால் வடிவத்தைத் தமிழில் இயல்பாகவும் நேரடியாகவும் பிரதிபலிக்கிறது. இது சபை முழுவதையும்—பெண்கள் உட்பட—குறிக்கக்கூடும் என்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: προσεύχεσθε
  choice: வேண்டிக்கொள்ளுங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவத்தின் ஜெபப் பொருளை நவீன, கண்ணியமான தமிழில் இயல்பாகக் கூறுகிறது. தொடர்ச்சியான செயலை வலியுறுத்தும் ‘தொடர்ந்து வேண்டிக்கொள்ளுங்கள்’ என்பது சாத்தியமானாலும், இச்சுருக்கமான வேண்டுகோளில் கிரேக்கம் அதைத் தனியாக வலியுறுத்தவில்லை.
- source_word: περὶ
  choice: -க்காக
  rationale: ἡμῶν உடன் இங்கு ஜெபத்தின் சார்புப் பொருளைக் காட்டுவதால், தமிழில் ‘எங்களுக்காக’ என்பது இயல்பான இணைப்பு.
- source_word: ἡμῶν
  choice: எங்கள்
  rationale: முதல் நபர் பன்மை உருபை எளிமையாகப் பிரதிபலிக்கிறது; பவுலையும் அவரது உடன் பணியாளர்களையும் குறிக்கும் எனத் தோன்றினாலும், மூலத்தில் இல்லாத விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: Ἀδελφοί என்ற ஆண்பால் அழைப்பு கலப்பு பாலினச் சபையைக் குறிக்கும் வாய்ப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூல கிரேக்கத்தின் இலக்கண ஆண்பால் வடிவத்தை முதன்மை உரையில் காக்கிறது; அதேவேளை, அழைப்பு சபையிலுள்ள ஆண்களையும் பெண்களையும் உள்ளடக்கியிருக்கலாம் என்ற பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான அன்பான அழைப்பின் கண்ணியத்தையும் நேரடித்தன்மையையும் காக்கும் நடை. ‘ஜெபியுங்கள்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியக்கூடிய ‘வேண்டிக்கொள்ளுங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
