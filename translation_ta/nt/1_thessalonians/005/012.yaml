  rationale: அவர்களுடைய தலைமை ஆண்டவரோடு உள்ள உறவிலும் அவருடைய ஆளுகைக்குட்பட்டும் நடைபெறுவதைத் திறந்த நிலையில் தக்கவைக்கிறது.
- source_word: νουθετοῦντας
  choice: உங்களுக்குப் புத்திசொல்கிறவர்களை
  rationale: νουθετέω-வின் திருத்தும் அறிவுரை, எச்சரிக்கை, போதனை ஆகிய மேய்ப்புப் பணிசார் கூறுகளை சாதாரண வாசகருக்குப் புரியும் கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀδελφοί என்ற சபை அழைப்பின் பாலினம் மற்றும் உள்ளடக்கம்
  choice: முதன்மை உரையில் ‘சகோதரர்களே’
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: மூலத்தின் ஆண்பால் வடிவத்தை முதன்மை உரையில் காக்கிறது; அதேவேளை இங்கு சபை முழுவதையும் நோக்கிய அழைப்பாக இருக்கக்கூடிய உள்ளடக்கப் பொருளை அடிக்குறிப்பு மறைக்காமல் தெரிவிக்கிறது.
- issue: εἰδέναι என்பதன் தலைவர்களுடனான உறவுசார் பொருள்
  choice: ‘மதித்துணரும்படி’
  alternative: ‘அறிந்துகொள்ளும்படி’ அல்லது ‘அங்கீகரிக்கும்படி’
  rationale: அவர்களுடைய உழைப்பையும் பொறுப்பையும் அறிந்து ஏற்றுக்கொண்டு மதிக்கும் பொருளைத் தருகிறது; கிரேக்கம் வெளிப்படையாகச் சொல்லாத கீழ்ப்படிதல் அல்லது அளவுமீறிய வணக்கத்தைச் சேர்க்காது.
- issue: προϊσταμένους ὑμῶν ἐν κυρίῳ என்பதன் அதிகாரம்/பராமரிப்பு நுணுக்கம்
  choice: ‘ஆண்டவருக்குள் உங்களை வழிநடத்தி’
  alternative: ‘ஆண்டவருக்குள் உங்கள்மேல் பொறுப்பாயிருந்து’
  rationale: தலைமை மற்றும் மேற்பார்வையைத் தக்கவைத்தபடியே குறிப்பிட்ட சபை ஆட்சிமுறையை உரைக்குள் இறக்குமதி செய்யவில்லை; மேலும் சொல்லளவுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மதித்துணருதல்’ என்பது அரிதான சொல்லாக்கமாக மாறாமல் εἰδέναι-யின் அறிதல் மற்றும் மதிப்பளித்தல் நுணுக்கங்களை ஒன்றாகத் தருகிறது. மூன்று அடிக்குறிப்பு குறிகளும் அவை சாரும் சொற்றொடர்களின் உடனருகில் முதன்மை உரையில் இடப்பட்டுள்ளன.
