  source_fidelity: προφητείας is an accusative plural, ‘prophecies.’ The draft’s ‘தீர்க்கதரிசன உரைகள்’ is a plausible contextual clarification, but ‘உரைகள்’ adds the specific sense ‘utterances/discourses’ to the main text rather than retaining the Greek term’s broader wording. The imperative and its negation are accurately conveyed by ‘இகழாதீர்கள்.’
  naturalness: ‘தீர்க்கதரிசனங்களை இகழாதீர்கள்’ is concise, idiomatic modern standard Tamil, and preserves the verse’s direct, dignified imperative register.
  terminology: ‘தீர்க்கதரிசனம்’ is the established and suitably broad equivalent for προφητεία. Keeping it in the main text avoids prematurely specifying the form of the prophecies. ‘தீர்க்கதரிசன உரைகள்’ is retained as a legitimate lexical/contextual alternative in the footnote.
