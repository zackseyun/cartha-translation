  text: Do not despise prophecies[a].
translation:
  language: ta
  text: தீர்க்கதரிசனங்களை[a] இகழாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீர்க்கதரிசன உரைகளை.’
    reason: προφητείας என்பதற்கான சூழல்சார் விரிவான மாற்று; கிரேக்கப் பன்மைச் சொல்லின் நேரடியான பொருள் ‘தீர்க்கதரிசனங்கள்’ என்பதே.
lexical_decisions:
- source_word: προφητείας
  choice: தீர்க்கதரிசன உரைகளை
  rationale: இது προφητεία என்பதன் பன்மை வேற்றுமை வடிவம்; இங்கு சபையில் வெளிப்படும் தீர்க்கதரிசனச் செய்திகளையோ உரைகளையோ குறிக்கிறது. ‘தீர்க்கதரிசன உரைகள்’ என்பது பன்மையையும் பேச்சு வெளிப்பாடுகளையும் இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது; ஒரு குறிப்பிட்ட பிற்காலக் கோட்பாட்டுக்குள் பொருளைச் சுருக்கவில்லை.
- source_word: μὴ
  choice: -ஆதீர்கள்
  rationale: நிகழ்காலக் கட்டளையுடன் வரும் வழக்கமான மறுப்பு. தமிழில் மரியாதை/பன்மை எதிர்மறைக் கட்டளையான ‘இகழாதீர்கள்’ என்பதில் இயல்பாக வெளிப்படுகிறது; ‘ஒருபோதும்’ போன்ற வலியுறுத்தலைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: ἐξουθενεῖτε
  choice: இகழாதீர்கள்
  rationale: ஒன்றை ஒன்றுமில்லாததாகக் கருதுதல், அலட்சியமாகத் தாழ்வாக மதித்தல், அவமதித்தல் என்ற வலுவை ‘இகழுதல்’ சுருக்கமாகக் காக்கிறது. ‘நிராகரிக்காதீர்கள்’ என்பது வெறும் மறுப்பாகப் பொருளைக் குறுக்கிவிடும்.
theological_decisions:
- issue: ஆரம்பக் கிறிஸ்தவச் சபைச் சூழலில் ‘தீர்க்கதரிசன உரைகள்’ என்பதன் பொருள்
  choice: சபையில் வெளிப்படும் தீர்க்கதரிசனப் பேச்சுகளைக் குறிக்கும் பரந்த சொல்லாட்சியை வைத்திருத்தல்
  alternative: தேவனிடமிருந்து வந்ததாகக் கூறப்படும் செய்திகள்; அல்லது ஒரு குறிப்பிட்ட பிற்கால வரமாக விளக்குதல்
  rationale: கிரேக்கச் சொல் தீர்க்கதரிசன வெளிப்பாடுகளைக் குறித்தாலும், அவை தொடர்கின்றனவா நின்றுவிட்டனவா என்ற பிற்காலப் பிரிவுசார் முடிவை வசனம் தானாக நிர்ணயிப்பதில்லை. ஆகவே அந்த இறையியல் பதற்றமும் பரந்த பொருளும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான கட்டளை வடிவம். ‘தீர்க்கதரிசன உரைகள்’ என்பது பொதுவாசகருக்குத் தெளிவாக இருக்கும்போது கிரேக்கப் பன்மையையும் சபைச் சூழலையும் காக்கிறது.
