translation:
  language: ta
  text: ஏனெனில், கடவுள் நம்மைக் கோபத்திற்காக நியமிக்கவில்லை; மாறாக, நம் ஆண்டவராகிய இயேசு மேசியாவின் வழியாக இரட்சிப்பைப் பெற்றுக்கொள்வதற்காக நியமித்தார்.
