lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுரைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், கிரேக்கத்தின் காரணப் பொருளையும் தமிழின் இயல்பான உரையோட்டத்தையும் காக்கிறது.
- source_word: ἔθετο
  choice: நியமித்தார்
  rationale: τίθημι இங்கு ஓர் இறுதி விளைவுக்காக வைத்தல் அல்லது நியமித்தல் என்ற பொருளைத் தருகிறது. ‘நியமித்தார்’ என்பது தேவையற்ற அளவில் முன்நிர்ணயக் கோட்பாட்டைச் சேர்க்காமல் அந்த நோக்கத்தை வெளிப்படுத்துகிறது.
- source_word: εἰς ὀργὴν
  choice: கோபத்திற்குள்ளாகும்படி
  rationale: ὀργή இங்கு இறுதிக்காலத் தெய்வீகக் கோபத்தைக் குறிக்கிறது. ‘கோபம்’ நேரடியான சொல்லாகும்; ‘தீர்ப்பு’ என்பது மூலச்சொல்லைவிட விரிவான விளக்கமாகிவிடும்.
- source_word: περιποίησιν
  choice: பெற்றுக்கொள்ளும்படி
  rationale: περιποίησις பெறுதல், உடைமையாக்குதல், காத்தல் போன்ற பொருள் வரம்பைக் கொண்டது. இச்சூழலில் இரட்சிப்பை அடையும் முடிவைக் குறிக்க ‘பெற்றுக்கொள்ளும்படி’ இயல்பான தமிழாக உள்ளது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன.
- source_word: σωτηρίας
  choice: இரட்சிப்பை
  rationale: பவுலின் பயன்பாட்டில் σωτηρία வழக்கமாக இறையியல் பொருளில் இரட்சிப்பைக் குறிக்கிறது; இங்கு ‘விடுதலை’ என்பதைவிட ‘இரட்சிப்பு’ சூழலுக்கு ஏற்றது.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: நம் ஆண்டவராகிய இயேசு மேசியா வழியாக
  rationale: διά + genitive வழிமுறை அல்லது முகமையைச் சுட்டுவதால் ‘வழியாக’ என மொழிபெயர்க்கப்பட்டது. Χριστός பெயருக்குப் பின் வந்தாலும் அர்த்தமுள்ள பட்டமாக இருப்பதால் ‘மேசியா’ என வழங்கப்பட்டது.
theological_decisions:
- issue: ἔθετο என்பதற்கு வலுவான முன்நிர்ணயப் பொருள் தர வேண்டுமா
  choice: நம்மை ... நியமிக்கவில்லை
  alternative: நம்மை ... முன்குறிக்கவில்லை
  rationale: வசனம் விசுவாசிகளுக்கான கடவுளின் நோக்கத்தையோ நியமனத்தையோ கூறுகிறது; ஆனால் ஒரு குறிப்பிட்ட முன்நிர்ணயக் கோட்பாட்டை அவசியப்படுத்தவில்லை. ‘நியமித்தார்’ உரையின் வலிமையைக் காத்தபடியே விவாதத்தைத் தீர்த்துவிடாமல் விடுகிறது.
- issue: Χριστοῦ என்பதை பட்டமாகவா, பெயர்போன்ற மரபுச் சொல்லாகவா வழங்குவது
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: Χριστός இங்கு இயேசுவின் அர்த்தமுள்ள பட்டமாகத் தொடர்ந்து செயல்படுகிறது. ஆகவே ‘மேசியா’ முதன்மை உரையில் இடம் பெறுகிறது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ὀργή என்பதில் யாருடைய கோபம் என்பது
  choice: கோபம்
  alternative: கடவுளின் கோபம்
  rationale: சூழலில் இது கடவுளின் இறுதிக்காலக் கோபமாகப் புரிந்துகொள்ளப்பட்டாலும், கிரேக்கத்தில் உரிமைச்சொல் வெளிப்படையாக இல்லை. எனவே முதன்மை உரை அதைச் சேர்க்காமல் மூலத்தின் சுருக்கத்தைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மாறாக’ எதிர்மறை–நேர்மறை முரணைத் தெளிவாக்குகிறது; இரண்டாம் பகுதியில் கிரேக்கத்தில் விடுபட்டுள்ள ἔθετο தமிழில் வாக்கிய நிறைவுக்காக ‘நியமித்தார்’ என மீண்டும் வழங்கப்பட்டுள்ளது.
