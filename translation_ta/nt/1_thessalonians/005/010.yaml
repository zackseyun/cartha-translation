source:
  edition: SBLGNT
  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: ta
  text: நாம் விழித்திருந்தாலும் தூங்கிக்கொண்டிருந்தாலும் அவரோடு சேர்ந்து வாழும்படி நமக்காக இறந்தவர் அவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் விழிப்புடன் இருந்தாலும் தூங்கிக்கொண்டிருந்தாலும்.” சுற்றியுள்ள வசனங்களில் வரும் விழிப்புடன் இருக்க வேண்டும் என்ற அறிவுறுத்தல் இங்கே எதிரொலிக்கலாம்; இருப்பினும், விசுவாசிகள் உயிரோடு இருந்தாலும் இறந்திருந்தாலும் என்பதே இங்கு பெரும்பாலும் குறிக்கப்படுவதாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: இறந்த அவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஆண்டவர் இயேசுவைக் குறிக்கும் இறந்தகாலப் பங்கேற்புவினையை, தமிழில் இயல்பான தொடர்புத் தொடராக வழங்குகிறது.
- source_word: περὶ ἡμῶν
  choice: நமக்காக
  rationale: இச்சூழலில் περί + பிறப்புவேற்றுமை ‘நமது சார்பாக/நமக்காக’ என்ற பொருளைத் தருகிறது; மூலத்தில் சொல்லப்பட்டதைத் தாண்டி பரிகாரத்தின் ஒரு குறிப்பிட்ட கோட்பாட்டைச் சேர்க்காமல் உள்ளது.
- source_word: ἵνα
  choice: வாழும்படி
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் ἵνα-வின் நோக்கத் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: γρηγορῶμεν
  choice: நாம் விழித்திருந்தாலும்
  rationale: சொல்லின் நேரடியான ‘விழித்திருத்தல்’ பொருளைத் தக்கவைத்து, உயிரோடிருத்தல் மற்றும் விழிப்புடன் இருத்தல் ஆகிய சாத்திய எதிரொலிகளைத் திறந்துவைக்கிறது.
- source_word: καθεύδωμεν
  choice: தூங்கிக்கொண்டிருந்தாலும்
  rationale: ‘விழித்திருத்தல்’ என்பதற்கு இயல்பான இணைமுரணாக இருந்து, உறக்கம் மரணத்தைக் குறிக்கும் உருவகமாகவும் நெறிசார் கவனக்குறைவைக் குறிக்கும் சொல்லாகவும் ஒலிக்கக்கூடிய தன்மையைப் பாதுகாக்கிறது.
- source_word: ἅμα σὺν αὐτῷ
  choice: அவரோடு ஒன்றாக
  rationale: ἅμα-வின் ‘ஒன்றாக’ என்ற கருத்தையும் σύν-ன் உடனிருப்பு/இணைவு கருத்தையும் தேவையற்ற சொல் மீளுரையின்றி வெளிப்படுத்துகிறது.
- source_word: ζήσωμεν
  choice: வாழும்படி
  rationale: ἵνα-வின் கீழுள்ள இறந்தகால வேண்டுநிலை வினையின் நோக்கப்பட்ட முடிவை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘விழித்திருந்தாலும் தூங்கிக்கொண்டிருந்தாலும்’ என்பதன் சூழல்சார் பொருள்
  choice: முதன்மையாக, விசுவாசிகள் உயிரோடிருந்தாலும் இறந்திருந்தாலும் என்பதைக் குறிக்கிறது; உருவகம் முதன்மை உரையில் அப்படியே வைக்கப்பட்டுள்ளது.
  alternative: 5:6–7-இன் அறிவுறுத்தலைத் தொடர்ந்து, நெறிசார் விழிப்புடனிருத்தல் அல்லது கவனமின்றி இருத்தல் என்பதைக் குறிக்கலாம்.
  rationale: 4:13–15-இல் ‘தூக்கம்’ இறந்த விசுவாசிகளுக்கான உருவகமாக வருகிறது; மேலும் இரு நிலையிலும் கிறிஸ்துவோடு வாழ்வது என்ற கூற்று உயிர்/மரணம் என்ற வேறுபாட்டுடன் சிறப்பாகப் பொருந்துகிறது. எனினும் அருகிலுள்ள விழிப்புக்கான அறிவுறுத்தலின் எதிரொலியை மொழிபெயர்ப்பு அழிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘விழித்திருத்தல்/தூங்குதல்’ என்ற மூல உருவகமும் அதன் உண்மையான பொருள் மயக்கமும் பாதுகாக்கப்பட்டுள்ளன.
