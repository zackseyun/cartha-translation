    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: குறித்து
  rationale: Περὶ புதிய பொருளை அறிமுகப்படுத்துகிறது; δέ உரையாடலில் தலைப்புமாற்றத்தைக் குறிக்கிறது. தமிழில் இயல்பான வாக்கிய அமைப்பில் ‘குறித்து’ இதைத் தெரிவிக்கிறது; மூலத்தில் இல்லாத காலப்பொருளுடைய ‘இப்போது’ சேர்க்கப்படவில்லை.
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: காலங்களையும் வேளைகளையும்
  rationale: χρόνος காலத்தின் நீட்சி அல்லது காலப்பகுதியையும், καιρός ஏற்ற அல்லது குறிக்கப்பட்ட வேளையையும் குறிக்கலாம். ‘காலங்களும் வேளைகளும்’ என்ற இணைச்சொல் இரண்டிற்கும் இடையிலான நுட்ப வேறுபாட்டை மிகையாக விளக்காமல் காக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: இது இலக்கணப்படி ஆண்பால் பன்மை விளிவடிவம். மூல வடிவம் முதன்மை உரையில் காக்கப்படுகிறது; முழு விசுவாசக் குழுவையும் உள்ளடக்கியிருக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: οὐ χρείαν ἔχετε
  choice: தேவை இல்லை
  rationale: தேவையின்மையைக் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑμῖν γράφεσθαι
  choice: உங்களுக்கு எதுவும் எழுதப்பட வேண்டிய
  rationale: செயப்பாட்டு infinitive-இன் எழுத்தாளர் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. ‘எழுதப்பட’ என்பது அந்தத் தெளிவின்மையைக் காக்கிறது; தமிழில் வாக்கியத்தை இயல்பாக்க ‘எதுவும்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: திருச்சபைக்கான பாலினக் குறியீடுள்ள அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: ἀδελφοί என்பதன் ஆண்பால் மூலவடிவம் முதன்மை உரையில் காக்கப்படுகிறது. அதேவேளை, பவுலின் இப்பயன்பாடு முழுச் சபையையும் குறிக்கக்கூடும் என்பதால் உள்ளடக்கிய பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: காலங்களும் வேளைகளும் என்ற இறுதிக்காலச் சொற்றொடர்
  choice: காலங்களையும் வேளைகளையும்
  alternative: காலப்பகுதிகளையும் குறிக்கப்பட்ட வேளைகளையும்
  rationale: மூலத்தின் இணைச்சொல் இறுதிக்காலச் சூழலைச் சுட்டினாலும், ஒவ்வொரு சொல்லின் பொருளையும் மிகத் துல்லியமாக முன்கூட்டியே நிர்ணயிக்காமல் அதன் இயல்பான விரிவையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் மூலத்தின் தலைப்புமாற்றத்தையும் செயப்பாட்டு அமைப்பையும் காக்கிறது; தேவையற்ற ‘இப்போது’ அல்லது வெளிப்படையான எழுத்தாளர் சேர்க்கப்படவில்லை.
