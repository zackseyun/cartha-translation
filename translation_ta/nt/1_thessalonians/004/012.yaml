base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: ta
  text: வெளியாரிடம் நீங்கள் கண்ணியமாக நடந்துகொள்ளவும், எதுவும் உங்களுக்குத் தேவைப்படாமல் இருக்கவும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாரையும் சார்ந்திருக்க வேண்டியிராமல் இருக்கவும்.” பிறரைச் சார்ந்திராதிருப்பதை இச்சொற்றொடர் வலியுறுத்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: -வும் … -வும்
  rationale: முந்தைய அறிவுறுத்தலின் நோக்கம் அல்லது விளைவைத் தொடர்ச்சியாகக் காட்டும் தமிழ்ச் சார்பு அமைப்பு; தனியாக ‘அதனால்’ என்று சேர்க்காமல் கிரேக்க வாக்கியத்தின் தொடர்ச்சியைப் பாதுகாக்கிறது.
- source_word: περιπατῆτε
  choice: நீங்கள் … நடந்துகொள்ளவும்
  rationale: பவுலின் உருவகமான ‘நடத்தல்’ இங்கு வாழ்க்கை முறையைக் குறிக்கிறது. ‘நடந்துகொள்ளுதல்’ என்பது அந்தப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: εὐσχημόνως
  choice: முறையாக
  rationale: பொருத்தமாகவும் கண்ணியமாகவும் நடந்துகொள்வதைக் குறிக்கிறது; ‘முறையாக’ என்பது பொருளை மிகைப்படுத்தாமல் சுருக்கமாகத் தருகிறது.
- source_word: πρὸς τοὺς ἔξω
  choice: வெளியில் இருப்பவர்களிடம்
  rationale: கிறிஸ்தவச் சமூகத்திற்கு வெளியே உள்ளவர்களுடனான நடத்தை இங்கு குறிக்கப்படுகிறது. ‘வெளியில் இருப்பவர்கள்’ என்ற சொற்றொடர் மூலத்தின் குழு வேறுபாட்டைப் பாதுகாக்கிறது; ‘அவிசுவாசிகள்’ போன்ற விளக்கச் சொல்லை இறக்குமதி செய்யவில்லை.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: எதுவும் உங்களுக்குத் தேவைப்படாமல் இருக்கவும்
  rationale: இலக்கண ரீதியாக ‘எதுவும் தேவைப்படாமல்’ என்பது முதன்மையான பொருள். சூழலில் பிறரைத் தேவையின்றிச் சார்ந்திராதிருப்பதும் உட்படலாம்; அந்த மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: μηδενὸς χρείαν ἔχητε என்ற இறுதிக் கூற்றின் பொருள்
  choice: ‘எதுவும் உங்களுக்குத் தேவைப்படாமல் இருக்கவும்’ என்று பொருள் அல்லது தேவையை மையப்படுத்துதல்
  alternative: ‘யாரையும் சார்ந்திருக்க வேண்டியிராமல் இருக்கவும்’ என்று நபர்களை மையப்படுத்துதல்
  rationale: μηδενός என்பது இங்கு ‘எதுவும்’ என்றும் ‘யாரும்’ என்றும் புரிந்துகொள்ளப்படக்கூடிய வடிவம். χρείαν ἔχειν உடன் ‘எதுவும் தேவைப்படாமல்’ என்பது இயல்பான முதன்மை வாசிப்பு; முந்தைய வசனத்தின் உழைப்புச் சூழல் மனிதர்களைச் சார்ந்திராதிருப்பதையும் சாத்தியமாக்குவதால் அதை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. இது முந்தைய வசனத்தைச் சார்ந்த நோக்கக் கூற்று என்பதால், தமிழிலும் வாக்கியம் ‘-வும் … -வும்’ என்ற தொடர்ச்சி வடிவில் வைக்கப்பட்டுள்ளது. ‘வெளியில் இருப்பவர்கள்’ என்பது மூலத்தின் மறைமுகக் குழுக் குறிப்பை அப்படியே வைக்கிறது.
