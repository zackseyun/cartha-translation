  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: ta
  text: அமைதியாக வாழ்வதை உங்கள் இலட்சியமாகக் கொள்ளவும்[a], உங்கள் சொந்த காரியங்களைக் கவனிக்கவும்[b], உங்கள் கைகளால் உழைக்கவும்; நாங்கள் உங்களுக்குக் கட்டளையிட்டபடியே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அமைதியாக இருப்பதை உங்கள் குறிக்கோளாகக் கொள்ளவும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் சொந்த காரியங்களில் ஈடுபடவும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: உங்கள் இலட்சியமாக்கிக்கொள்ளவும்
  rationale: இச்சொல் ஒன்றை மதிப்புக்குரிய குறிக்கோளாகக் கொண்டு அதற்காக ஆர்வத்துடன் முயல்வதைக் குறிக்கிறது. அமைதியான வாழ்வையே இலட்சியமாக்கும் கிரேக்கத்தின் வலிமையான, சற்றே முரண்தோன்றும் சொல்லாட்சியை இது இயல்பான தமிழில் காக்கிறது.
- source_word: ἡσυχάζειν
  choice: அமைதியாக வாழ்வதை
  rationale: இங்கு முழுமையான மௌனம் அல்ல, கலகமோ தேவையற்ற தலையீடோ இல்லாத அமைதியான வாழ்க்கைமுறையே கருத்தாக உள்ளது.
- source_word: πράσσειν τὰ ἴδια
  choice: உங்கள் சொந்த அலுவல்களைக் கவனிக்கவும்
  rationale: தனக்குரிய காரியங்களைச் செய்து கவனித்துக்கொள்வதைக் குறிக்கும் கிரேக்க மரபுத்தொடரை, கடுமையாகவோ இழிவாகவோ ஒலிக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἐργάζεσθαι
  choice: உழைக்கவும்
  rationale: வேலை செய்வது அல்லது உழைப்பது என்ற பரந்த பொருளைத் தருகிறது; கைகளால் செய்யும் வேலையுடன் தமிழில் இயல்பாக இணைகிறது.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: உங்கள் கைகளால்
  rationale: வேலை செய்யப் பயன்படுத்தப்படும் கருவியைச் சுட்டும் வேற்றுமைப் பொருளையும் ὑμῶν என்ற உடைமைச் சுட்டையும் நேரடியாகக் காக்கிறது.
- source_word: καθὼς
  choice: படியே
  rationale: முன்னர் வழங்கப்பட்ட அறிவுறுத்தலுடன் துல்லியமான ஒப்புமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: παρηγγείλαμεν
  choice: நாங்கள் உங்களுக்குக் கட்டளையிட்டோம்
  rationale: παραγγέλλω என்பதிலுள்ள அதிகாரமிக்க அறிவுறுத்தலின் வலிமையை ‘கட்டளையிட்டோம்’ காக்கிறது.
theological_decisions:
- issue: அப்போஸ்தலருடைய அறிவுறுத்தலின் நெறிசார் அதிகாரம்
  choice: ‘கட்டளையிட்டபடியே’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அறிவுறுத்தியபடியே’
  rationale: παραγγέλλω இங்கு சாதாரண ஆலோசனையைவிட அதிகாரமிக்க நெறிசார் உத்தரவைக் குறிக்கிறது; எந்தச் சமயப்பிரிவுக்குரிய தனிப்பட்ட பொருளையும் சேர்க்காமல் அந்த வலிமை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடையைப் பயன்படுத்துகிறது. ‘இலட்சியமாக்கிக்கொள்ளவும்’ என்பது φιλοτιμεῖσθαι என்ற சொல்லின் குறிக்கோள் மற்றும் ஆர்வமிக்க முயற்சி ஆகிய இரு கூறுகளையும் காக்கிறது. மூன்று இணைச் செயல்களும் ‘-வும்’ வடிவில் அமைக்கப்பட்டு கிரேக்கத் தொடரின் ஒத்திசைவு பேணப்பட்டுள்ளது.
