id: 1TH.4.13
reference: 1 Thessalonians 4:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: ta
  text: ஆனால், சகோதரர்களே,[a] நித்திரையடைந்தவர்களைக்[b] குறித்து நீங்கள் அறியாதிருக்க நாங்கள் விரும்பவில்லை; நம்பிக்கை இல்லாத மற்றவர்களைப் போல நீங்கள் துக்கப்படாதபடி இவ்வாறு சொல்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களே’ என்ற அழைப்பு இங்கு சபையார் அனைவரையும் நோக்கியதாகவும், ஆண்களோடு பெண்களையும் உள்ளடக்கியதாகவும் இருக்கக்கூடும்.
    reason: cultural_note
  - marker: b
    text: நேர்சொல்லாக, ‘உறங்கிக்கொண்டிருப்பவர்கள்’; இங்கு ‘நித்திரை’ என்பது இறந்த விசுவாசிகளைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ
  choice: ஆனால் ... நாங்கள் விரும்பவில்லை
  rationale: δέ இங்கு மென்மையான தொடர்பையோ எதிர்மறை மாறுதலையோ குறிக்கிறது; ‘ஆனால்’ உரையோட்டத்தில் இயல்பாக உள்ளது. θέλομεν என்பதன் விருப்பப் பொருளும் தக்கவைக்கப்படுகிறது.
- source_word: ὑμᾶς ἀγνοεῖν
  choice: நீங்கள் அறியாதிருக்க
  rationale: ἀγνοεῖν என்பது தகவல் அறியாமல் இருப்பதைக் குறிக்கிறது; இச்சொற்றொடர் குற்றஞ்சாட்டும் தொனியின்றி அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கச் சொல் ஆண்பால் பன்மை வடிவில் இருப்பதால் அது முதன்மை உரையில் தக்கவைக்கப்படுகிறது; முழுச் சபையையும் நோக்கிய அழைப்பாக இருக்கக்கூடிய அதன் பரப்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: περὶ τῶν κοιμωμένων
  choice: நித்திரையடைந்தவர்களைக் குறித்து
  rationale: κοιμωμένων என்பதில் உள்ள ‘உறக்கம்’ என்ற மரண உருவகத்தைத் தக்கவைக்கிறது; வெறுமனே ‘இறந்தவர்கள்’ என்று விளக்கிப் பதிலிடவில்லை.
- source_word: ἵνα μὴ λυπῆσθε
  choice: நீங்கள் துக்கப்படாதபடிக்கே இது
  rationale: ἵνα + subjunctive வெளிப்படுத்தும் நோக்கத்தைத் தெளிவாகக் காட்டுகிறது; துக்கமே முற்றிலும் தடைசெய்யப்படுகிறது என்று பொருள்கொள்ளாமல், அடுத்த ஒப்பீட்டோடு இணைக்கிறது.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: மற்றவர்களைப் போல
  rationale: நம்பிக்கை இல்லாத மீதமுள்ள மக்களோடு செய்யப்படும் ஒப்பீட்டைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: நம்பிக்கை இல்லாத
  rationale: ἐλπίδα என்பதன் எதிர்நோக்கும் நம்பிக்கைப் பொருளை நேரடியாகத் தருகிறது; மூலத்தின் சுருக்கமான பண்புப்பெயர் அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: முடிவுக்காலச் சூழலில் κοιμωμένων என்பதன் பொருள்
  choice: மரித்த விசுவாசிகளைக் குறிக்கும் ‘நித்திரையடைந்தவர்கள்’ என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: இறந்தவர்கள்
  rationale: பவுலின் உறக்க உருவகம் உயிர்த்தெழுதல் நம்பிக்கையோடு தொடர்புடைய இறையியல் நுண்மையைத் தாங்குகிறது; அடிக்குறிப்பு அதன் குறிப்பைத் தெளிவுபடுத்துகிறது.
- issue: ἀδελφοί என்பதன் பரப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று மொழிபெயர்த்து, சபையின் பெண்களும் இதில் உள்ளடங்கியிருக்கக்கூடும் என்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சகோதர சகோதரிகளே
  rationale: கிரேக்கத்தின் ஆண்பால் வடிவத்தை மறைக்காமல் தக்கவைத்து, பவுலின் சபைமுழுவதற்குமான பிரதிநிதித்துவப் பயன்பாட்டையும் வாசகருக்குத் தெளிவுபடுத்துகிறது.
- issue: துக்கப்பட வேண்டாமென்ற கூற்றின் வலிமை
  choice: நம்பிக்கையற்ற மற்றவர்களைப் போன்ற துக்கத்தையே மறுக்கும் வகையில் ஒப்பீட்டை இணைத்தல்
  alternative: எந்தத் துக்கமும் கொள்ளாதீர்கள் என்ற முழுமையான தடை
  rationale: ἵνα μὴ λυπῆσθε என்பது καθὼς καὶ οἱ λοιποί என்ற ஒப்பீட்டால் வரையறுக்கப்படுகிறது; ஆகவே பவுல் எல்லாத் துக்கத்தையும் அவசியம் மறுக்கிறார் என்று உரை தீர்மானிக்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நித்திரையடைந்தவர்கள்’ என்ற வேதாகம உருவகம் தக்கவைக்கப்பட்டாலும், அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது. வாக்கியத்தின் நீளத்தை இயல்பாக்க இறுதி நோக்குக் கூறு தனி வாக்கியமாக அமைக்கப்பட்டுள்ளது.
