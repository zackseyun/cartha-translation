- from: ஆனால் சகோதரர்களே,[a] நித்திரையடைந்தவர்களைக்[b] குறித்து நீங்கள் அறியாதிருக்க நாங்கள் விரும்பவில்லை. நம்பிக்கை இல்லாத மற்றவர்களைப் போல நீங்கள் துக்கப்படாதபடிக்கே இது.
  to: ஆனால், சகோதரர்களே,[a] நித்திரையடைந்தவர்களைக்[b] குறித்து நீங்கள் அறியாதிருக்க நாங்கள் விரும்பவில்லை; நம்பிக்கை இல்லாத மற்றவர்களைப் போல நீங்கள் துக்கப்படாதபடி இவ்வாறு சொல்கிறோம்.
