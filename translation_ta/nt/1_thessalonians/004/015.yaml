reference: 1 Thessalonians 4:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: ta
  text: 'ஏனெனில், ஆண்டவருடைய ஒரு வார்த்தையின்படி[a] இதை உங்களுக்குச் சொல்கிறோம்: ஆண்டவரின் வருகை[b]வரை உயிரோடு எஞ்சியிருக்கும் நாம், உறங்கிப்போனவர்களை[c] நிச்சயமாக முந்த மாட்டோம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆண்டவரின் வார்த்தையால்.’ கிரேக்கச் சொற்றொடர் ஆண்டவர் இயேசுவின் ஒரு கூற்றையோ, ஆண்டவரின் அதிகாரத்துடன் அளிக்கப்பட்ட ஒரு வெளிப்பாட்டையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘வருகை’ என்பதற்கான கிரேக்கச் சொல் παρουσία; இதை ‘இருப்பு’ அல்லது ‘வந்துசேருதல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘உறங்கிப்போனவர்கள்’ என்பது இறந்துபோன விசுவாசிகளைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: ஆண்டவரிடமிருந்து வந்த ஒரு வார்த்தையின் அடிப்படையில்
  rationale: ἐν என்பதன் அடிப்படை அல்லது அதிகாரம் சார்ந்த நுட்பத்தையும், இது இயேசுவின் நேரடிக் கூற்றா அல்லது ஆண்டவரின் அதிகாரத்தோடு அளிக்கப்பட்ட வெளிப்பாடா என்ற தெளிவின்மையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: παρουσίαν
  choice: வருகை
  rationale: இறுதிக்காலச் சூழலில் ஆண்டவரின் எதிர்கால வருகையைக் குறிக்கிறது. ‘வருகை’ என்பது இயல்பான நவீனத் தமிழ்; ‘வந்திருத்தல்’ என்ற பரந்த பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οἱ ζῶντες
  choice: உயிரோடு
  rationale: நிகழ்காலப் பங்கேற்புவினையின் பொருளை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: οἱ περιλειπόμενοι
  choice: எஞ்சியிருக்கும்
  rationale: குறிப்பிட்ட காலம்வரை இன்னும் உயிரோடு இருப்பவர்களைக் குறிக்கிறது; ‘தப்பிப் பிழைத்திருக்கும்’ என்ற தேவையற்ற விளக்கப் பொருளைத் தவிர்க்கிறது.
- source_word: οὐ μὴ φθάσωμεν
  choice: நிச்சயமாக முந்த மாட்டோம்
  rationale: οὐ μή என்ற வலியுறுத்தப்பட்ட மறுப்பையும், இங்கு φθάνω தரும் ‘முந்துதல்’ என்ற பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοὺς κοιμηθέντας
  choice: உறங்கிப்போனவர்களை
  rationale: இறந்த விசுவாசிகளைக் குறிக்கும் மூலமொழியின் உறக்க உருவகத்தைத் தக்கவைக்கிறது; வெறுமனே ‘இறந்தவர்கள்’ என்று விளக்கி உருவகத்தை நீக்கவில்லை.
- source_word: κύριος / κυρίου
  choice: ஆண்டவர்
  rationale: இவ்விறுதிக்காலச் சூழலில் இயேசுவைக் குறிக்கும் κύριος என்பதற்கான மரியாதைமிக்க, வழக்கமான தமிழ் இணைச்சொல்.
theological_decisions:
- issue: ‘ஆண்டவரிடமிருந்து வந்த ஒரு வார்த்தை’ என்று பவுல் குறிப்பிடுவதன் இயல்பு
  choice: அந்தக் கூற்றின் ஆண்டவர்சார்ந்த அதிகாரத்தைக் காட்டி, அது எவ்வாறு கிடைத்தது என்பதைத் தீர்மானிக்காமல் மொழிபெயர்க்கப்பட்டது.
  alternative: இயேசுவின் அறியப்பட்ட கூற்றின் மேற்கோள்; அல்லது பவுலுக்குக் கொடுக்கப்பட்ட தீர்க்கதரிசன வெளிப்பாடு.
  rationale: ἐν λόγῳ κυρίου என்பது ஆண்டவரின் அதிகாரத்தை உறுதிப்படுத்தினாலும், அந்த வார்த்தை கிடைத்த துல்லியமான முறையைத் தானாகவே குறிப்பிடவில்லை.
- issue: κοιμηθέντας என்பதன் பொருள்
  choice: இறந்த விசுவாசிகளுக்கான உறக்க உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘இறந்தவர்கள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: உயிர்த்தெழுதல் குறித்த நம்பிக்கையின் சூழலில் பவுல் மரணத்தை உறக்கமாகக் கூறுகிறார். உருவகத்தை வைத்திருப்பது மூலத்தின் இறையியல் நுணுக்கத்தைக் காக்கிறது.
translation_notes:
  register: மொழிநடை நவீன, பொதுநிலையான, மரியாதைமிக்க தமிழாக வைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் காரணவுரை, காலவரம்பு, வலியுறுத்தப்பட்ட மறுப்பு ஆகியவை தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன; அடிக்குறி குறிப்புகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே இடப்பட்டுள்ளன.
