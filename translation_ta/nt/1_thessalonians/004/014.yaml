source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: ta
  text: ஏனெனில், இயேசு இறந்து உயிர்த்தெழுந்தார் என்று நாம் நம்புகிறோம் என்றால், அவ்வாறே இயேசுவின் மூலமாகத் தூங்கிவிட்டவர்களையும்[a][b] கடவுள் இயேசுவோடு அழைத்துவருவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இறந்தவர்களையும்.’ இந்தச் சூழலில் விசுவாசிகளின் இறப்பைக் குறிக்க பவுல் ‘தூங்கிவிட்டவர்கள்’ என்ற உருவகத்தைப் பயன்படுத்துகிறார்.
    reason: lexical_alternative
  - marker: b
    text: ‘இயேசுவின் மூலமாக’ என்பதை ‘இயேசுவுக்குள்’ எனவும் புரிந்துகொள்ளலாம். அல்லது, கடவுள் அவர்களை இயேசுவின் மூலமாக அழைத்துவருவார் என்பதைக் குறிக்கும் வகையில் இச்சொற்றொடர் பிரதான வினையுடன் இணைவதாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ஏனெனில், ... நம்பினால்
  rationale: γάρ என்பதன் காரணவிளக்கத் தொடர்பையும் εἰ என்பதன் நிபந்தனைப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πιστεύομεν
  choice: நாம் நம்பினால்
  rationale: இயேசுவின் இறப்பையும் உயிர்த்தெழுதலையும் குறித்த பொதுவான விசுவாச அறிக்கையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦς ἀπέθανεν καὶ ἀνέστη
  choice: இயேசு இறந்து உயிர்த்தெழுந்தார்
  rationale: இரு இறந்தகால வினைகளையும் சுருக்கமான அறிக்கை நடையில் தருகிறது; ἀνέστη என்பது செயப்பாட்டு வடிவமல்ல என்பதால் ‘உயிர்த்தெழுப்பப்பட்டார்’ என்று மாற்றப்படவில்லை.
- source_word: οὕτως καὶ
  choice: அவ்வாறே
  rationale: இயேசுவின் இறப்பு–உயிர்த்தெழுதலுக்கும் இறந்த விசுவாசிகளைப் பற்றிய கடவுளின் வருங்காலச் செயலுக்கும் உள்ள ஒப்புமைத் தொடர்பைக் காக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: நவீனத் தரத் தமிழில் இயல்பான, பொதுவான நேரடி இணைச்சொல்.
- source_word: τοὺς κοιμηθέντας
  choice: தூங்கிவிட்டவர்களையும்
  rationale: இறந்தவர்களைக் குறிக்க பவுல் பயன்படுத்தும் ‘தூக்கம்’ என்ற உருவகத்தைச் சமப்படுத்தாமல் காக்கிறது; ‘விட்ட’ என்பது அந்நிலையில் இப்போது இருப்பதையும் உணர்த்துகிறது.
- source_word: διὰ τοῦ Ἰησοῦ
  choice: இயேசுவின் மூலமாக
  rationale: διά + மரபுவேற்றுமையின் வழிமுறை அல்லது செயற்பாட்டாளர் நிழலை நேரடியாகக் காக்கிறது; துல்லியமான தொடர்பு விவாதத்திற்குரியது என்பதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἄξει
  choice: அழைத்துவருவார்
  rationale: ἄγω என்பதன் வருங்காலச் செயலை இயல்பான தமிழில் தருகிறது; ஒருவரைத் தம்முடன் கூட்டிக்கொண்டு வருதல் என்ற சூழற்பொருளுக்கும் ஏற்றது.
- source_word: σὺν αὐτῷ
  choice: அவரோடு
  rationale: σύν என்பதன் உடனிருப்புப் பொருளைக் காக்கிறது; மரியாதைப் பயன்பாட்டிலுள்ள ஒருமைப் பதிலிப்பெயர் இங்கு இயேசுவைக் குறிக்கிறது.
theological_decisions:
- issue: κοιμηθέντας என்ற இறப்பு உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் ‘தூங்கிவிட்டவர்கள்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘இறந்தவர்கள்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: உண்மையான இறப்பையும் வரவிருக்கும் உயிர்த்தெழுதல் நம்பிக்கையையும் ஒரே நேரத்தில் சுமக்கும் பவுலின் மேய்ப்புப்பணி சார்ந்த உருவகத்தை இது காக்கிறது.
- issue: διὰ τοῦ Ἰησοῦ என்பதன் தொடர்பும் பொருளும்
  choice: ‘இயேசுவின் மூலமாக’ என்று மொழிபெயர்த்து, அது தூங்கிவிட்டவர்களுடன் நெருக்கமாக நிற்கும் கிரேக்கச் சொல் வரிசையைப் பின்பற்றுதல்
  alternative: ‘இயேசுவுக்குள் தூங்கிவிட்டவர்கள்’ அல்லது கடவுள் அவர்களை ‘இயேசுவின் மூலமாக’ அழைத்துவருவார் எனப் புரிதல்
  rationale: இச்சொற்றொடர் வழிமுறை/செயற்பாடு, கிறிஸ்துவுடனான இணைப்பு, அல்லது பிரதான வினையுடனான தொடர்பு எனப் பலவாறு புரிந்துகொள்ளப்படலாம். முதன்மை உரை διά என்பதன் வழக்கமான பொருளைத் தருகிறது; அடிக்குறிப்பு உண்மையான இலக்கணத் தெளிவின்மையை மறைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிர்த்தெழுந்தார்,’ ‘கடவுள்,’ ‘அவரோடு’ போன்ற சொற்கள் பொதுவாகப் புரிந்துகொள்ளக்கூடியவை. ‘தூங்கிவிட்டவர்கள்’ என்ற சற்றே அசாதாரணமான உருவகம் மூலத்தின் இறையியல் மற்றும் மேய்ப்புப்பணி நுணுக்கத்தைப் பாதுகாக்க நோக்கத்துடன் தக்கவைக்கப்பட்டுள்ளது.
