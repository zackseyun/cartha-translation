source:
  edition: SBLGNT
  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: ta
  text: ஏனெனில், அசுத்தத்தில் வாழ்வதற்காகக் கடவுள் நம்மை அழைக்கவில்லை; மாறாக, பரிசுத்தத்தில் வாழவே அழைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரிசுத்தமாக்குதலில்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பரிசுத்தமான நிலைமையையோ, பரிசுத்தமாக்கப்படும் செயல்முறையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; நவீனத் தமிழில் இயல்பான காரண இணைப்பாக உள்ளது.
- source_word: ἐκάλεσεν
  choice: அழைத்தார்
  rationale: கிரேக்க இறந்தகால வினையை எளிய இறந்தகாலமாகத் தருகிறது. கடவுளின் அழைப்பு என்ற வேதாகமச் சொல்லிணைப்பைத் தக்கவைத்து, அதன் இறையியல் செயல்முறையைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: அசுத்தத்தில் வாழ்வதற்காக
  rationale: ἐπί + வேற்றுமை உருபு இங்கு நோக்கம் அல்லது வாழ்க்கைச் சூழலைக் குறிக்கிறது. உடனடிச் சூழலில் பாலியல் ஒழுக்கக்கேட்டையும் உள்ளடக்கும் பரந்த அறநெறி அசுத்தத்தை ‘அசுத்தம்’ தக்கவைக்கிறது; ‘வாழ்வதற்காக’ என்பது தமிழில் நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ἁγιασμῷ
  choice: பரிசுத்தத்தில் வாழவே
  rationale: ἐν என்பது பரிசுத்தத்தால் வகைப்படுத்தப்படும் வாழ்க்கைச் சூழல் அல்லது முறையை உணர்த்துகிறது. ἁγιασμός குறிக்கும் நிலை மற்றும் பரிசுத்தமாக்கப்படும் நடைமுறை ஆகிய இரு சாத்தியங்களையும் முற்றாக ஒழிக்காமல், முதன்மைப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கடவுளின் ‘அழைப்பு’ என்பதன் பொருள்
  choice: பரிசுத்த வாழ்வுக்கான கடவுளின் உண்மையான அழைப்பு
  alternative: பொதுவான அழைப்பு அல்லது தொழில்நுட்பமான பொருளில் குறிப்பாக ‘செயல்திறனுள்ள அழைப்பு’
  rationale: வசனம் கடவுளின் அழைப்பை அறநெறி அறிவுறுத்தலின் அடிப்படையாக வைக்கிறது; ஆனால் அந்த அழைப்பு எவ்வாறு செயல்படுகிறது என்பதை வரையறுக்கவில்லை. ஆகவே ‘அழைத்தார்’ என்பதே தக்கவைக்கப்படுகிறது.
- issue: 'ἁγιασμός: நிலை அல்லது நடைமுறை'
  choice: முதன்மை உரையில் ‘பரிசுத்தத்தில் வாழ’
  alternative: ‘பரிசுத்தமாக்கப்படுவதில் வாழ’
  rationale: ἀκαθαρσία என்பதுடனான எதிரிணைப்பு பரிசுத்தமான வாழ்க்கை நிலை அல்லது வட்டத்தை முன்னிறுத்துகிறது; இருப்பினும் கிரேக்கப் பெயர்ச்சொல் பரிசுத்தமாக்கப்படும் நடைமுறையையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பில் ambiguity பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘அசுத்தம்’ மற்றும் ‘பரிசுத்தம்’ என்ற வேதாகமச் சொற்கள் எதிரிணையாகத் தக்கவைக்கப்பட்டுள்ளன; தமிழில் நோக்கம் தெளிவாக இருக்க ‘வாழ்வதற்காக/வாழவே’ சேர்க்கப்பட்டுள்ளது.
