  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: ta
  text: அதன்பின், உயிரோடிருக்கும், எஞ்சியிருக்கும் நாமும் அவர்களுடன் ஒரே நேரத்தில் சேர்ந்து, மேகங்களில் ஆண்டவரை ஆகாயத்தில் சந்திப்பதற்காக மேலே எடுத்துக்கொள்ளப்படுவோம்[a][b]. இவ்வாறே நாம் எப்போதும் ஆண்டவரோடு இருப்போம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திடீரெனப் பறித்தெடுக்கப்படுவோம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் திடீரான, வலிமைமிக்க செயலை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆண்டவருடனான சந்திப்புக்காக’ என்றும் மொழிபெயர்க்கலாம். இந்தச் சொற்றொடர் ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கலாம்; ஆனால் இந்தச் சந்திப்புக்கு அப்பாற்பட்ட நிகழ்வுகளின் விரிவான வரிசையை இவ்வசனம் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: அதன்பின்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கிறிஸ்துவுக்குள் இறந்தவர்களின் உயிர்த்தெழுதலைத் தொடர்ந்து நிகழும் அடுத்த கட்டத்தை இயல்பாகக் குறிக்கிறது.
- source_word: ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι
  choice: உயிரோடு எஞ்சியிருக்கும் நாமும்
  rationale: அந்த நேரம்வரை இறக்காமல் உயிருடன் இருப்பவர்களை இரு பங்கேற்புச் சொற்றொடர்களும் சேர்ந்து அடையாளப்படுத்துகின்றன. ‘எஞ்சியிருக்கும்’ என்பது ஆபத்திலிருந்து தப்பிப்பிழைத்தார்கள் என்ற தேவையற்ற பொருளைத் திணிக்காது.
- source_word: ἅμα σὺν αὐτοῖς
  choice: அவர்களோடு ஒன்றாக
  rationale: உயிர்த்தெழுந்த விசுவாசிகளுடன் ஒரே நிகழ்வில் இணைவதையும் உடனிருப்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἁρπαγησόμεθα
  choice: மேலே எடுத்துக்கொள்ளப்படுவோம்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, மேகங்களையும் ஆகாயத்தையும் நோக்கிய இயக்கத்தைத் தெளிவாக்குகிறது. மூல வினையின் திடீர், வலிமையான தன்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது; குறிப்பிட்ட இறுதிக்காலக் கோட்பாடு உரைக்குள் சேர்க்கப்படவில்லை.
- source_word: ἐν νεφέλαις
  choice: மேகங்களில்
  rationale: பன்மை வடிவத்தையும் காட்சியின் konkreteness-ஐயும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: ஆண்டவரைச் சந்திப்பதற்காக
  rationale: இயக்கத்தின் நோக்கத்தையும் சந்திப்பையும் இயல்பான தமிழில் கூறுகிறது; சந்திப்புக்குப் பின் நிகழும் விரிவான வரிசையைத் தீர்மானிக்கவில்லை.
- source_word: εἰς ἀέρα
  choice: ஆகாயத்தில்
  rationale: ἀήρ குறிக்கும் பூமிக்கு மேலுள்ள காற்றுமண்டல இடத்தை வாசிக்க எளிய, வழக்கமான தமிழில் தெரிவிக்கிறது.
- source_word: καὶ οὕτως
  choice: இவ்வாறே
  rationale: முன்னர் விவரிக்கப்பட்ட நிகழ்வுகளின் முறையையும் அதன் விளைவையும் சுருக்கமாக இணைக்கிறது.
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: நாம் எப்போதும் ஆண்டவரோடு இருப்போம்
  rationale: எதிர்கால உறுதியையும் ஆண்டவருடனான நீடித்த உடனிருப்பையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘ἁρπαγησόμεθα’ என்ற சொல்லை ‘எடுத்துக்கொள்ளப்படுதல்’ குறித்த இறுதிக்கால விவாதங்களின் நடுவில் மொழிபெயர்த்தல்
  choice: மேலே எடுத்துக்கொள்ளப்படுவோம்
  alternative: திடீரெனப் பறித்தெடுக்கப்படுவோம்
  rationale: மூலத்தின் செயப்பாட்டு வடிவத்தையும் திடீர் இயக்கத்தையும் தெரிவிக்கிறது; ஆனால் நிகழ்வின் காலவரிசை அல்லது தன்மை குறித்து எந்த ஒரு பிரிவுசார் ‘rapture’ அமைப்பையும் வசனத்துக்குள் இறக்குமதி செய்யவில்லை.
- issue: ‘εἰς ἀπάντησιν τοῦ κυρίου’ என்பதன் இறுதிக்காலப் பொருள்
  choice: ஆண்டவரைச் சந்திப்பதற்காக
  alternative: ஆண்டவருடனான சந்திப்புக்காக
  rationale: ஆண்டவரை எதிர்கொண்டு சந்திப்பதைத் தெளிவாகச் சொல்கிறது; பின்னர் அவர்கள் எந்தத் திசையில் செல்கிறார்கள் அல்லது அதற்குப் பின் நிகழ்வுகளின் வரிசை என்ன என்பதை வசனம் கூறாததால் அதைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆண்டவர்’ என்பது κύριος என்பதற்கான நிலையான பட்டப்பெயராகப் பயன்படுத்தப்பட்டுள்ளது. இறுதிக்காலக் கோட்பாட்டு சொற்கள் தவிர்க்கப்பட்டு, மூலத்தில் உள்ள வரிசையும் தீர்மானிக்கப்படாத அம்சங்களும் பாதுகாக்கப்பட்டுள்ளன.
