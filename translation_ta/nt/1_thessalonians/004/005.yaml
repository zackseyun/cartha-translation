lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: காம வேட்கையின் உணர்ச்சிவேகத்தில் அல்ல
  rationale: μὴ தொடரும் அறிவுறுத்தலின் முறையை மறுக்கிறது; ἐν என்பது நிலை அல்லது முறையைக் குறிக்கிறது. πάθος என்பதன் தீவிர உணர்ச்சி நுட்பத்தையும், பாலியல் ஒழுக்கச் சூழலில் ἐπιθυμία தரும் காம வேட்கை என்ற பொருளையும் தனித்தனியாகக் காக்கிறது.
- source_word: καθάπερ καὶ
  choice: போலவும்
  rationale: முந்தைய மறுப்போடு இணைந்து ஒப்பீட்டைக் காட்டும் இயல்பான தமிழ் வடிவம்; καί தரும் ‘மேலும்/வும்’ என்ற இணைப்புத் தன்மையையும் காக்கிறது.
- source_word: τὰ ἔθνη
  choice: பிற இனத்தார்
  rationale: பவுலின் பயன்பாட்டில் யூதரல்லாத மக்களைக் குறிக்கும் சொல்லை, இன்றைய தமிழில் இயல்பாகவும் இழிவுபடுத்தாமலும் வெளிப்படுத்துகிறது.
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: கடவுளை அறியாத
  rationale: பெயரெச்சத் தொடராக உள்ள கிரேக்கச் சொற்றொடரை அதே விளக்கச் செயல்பாட்டுடன் சுருக்கமாக வழங்குகிறது; தொடர்ந்து நிலவும் அறியாமையைக் குறிக்கிறது.
theological_decisions:
- issue: τὰ ἔθνη என்பதன் இன-சமயச் சுட்டு
  choice: பிற இனத்தார்
  alternative: புறவினத்தார்; பிற நாடுகள்; புறசமயத்தார்
  rationale: இங்கு யூதரல்லாத, கடவுளை அறியாத வெளிப்புற மக்களோடு ஒப்பீடு செய்யப்படுகிறது. ‘பிற இனத்தார்’ அடிப்படை இன-மக்கள் வகைப்பாட்டைக் காக்கிறது; ‘புறசமயத்தார்’ என்பது சமய விளக்கத்தை அதிகமாகச் சேர்க்கும்.
- issue: πάθει ἐπιθυμίας என்பதன் வலிமை
  choice: காம வேட்கையின் உணர்ச்சிவேகம்
  alternative: காம உணர்ச்சியின் வேட்கை; தீவிரமான காம ஆசை
  rationale: பாலியல் சூழலில் ஒழுங்கற்ற ஆசையைத் தெளிவுபடுத்துவதோடு, கிரேக்கத்தில் உள்ள இரண்டு பெயர்ச்சொற்களின் உறவையும் இயன்றவரை காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், முந்தைய வசனத்தின் வாக்கியத்தைத் தொடரும் மறுப்பு அமைப்பு காக்கப்பட்டுள்ளது. ‘உணர்ச்சிவேகம்’ தீவிரமான passion என்ற பொருளை dignified register-இல் தருகிறது; ‘பிற இனத்தார்’ இழிவான தொனியைத் தவிர்க்கிறது.
