revisions:
- from: காம வேட்கையின் உணர்ச்சிவேகத்தில் அல்ல[a]; கடவுளை அறியாத பிற இனத்தாரைப்[b] போலவும் அல்ல.
  to: காம ஆசையின் உணர்ச்சிவேகத்தில் அல்ல[a]; கடவுளை அறியாத புறவினத்தாரைப் போலவும் அல்ல[b].
  rationale: The revision improves modern Tamil idiom and makes the reference of τὰ ἔθνη appropriately specific. It preserves the Greek comparison, negation, and the sexual connotation of πάθει ἐπιθυμίας. Footnote alternatives distinguish lexical possibilities from the more interpretive religious rendering.
