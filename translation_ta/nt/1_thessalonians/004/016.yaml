  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: ta
  text: ஏனெனில், ஆண்டவர் தாமே கட்டளையிடும் முழக்கத்தோடும்[a], பிரதான தூதரின் குரலோடும், கடவுளின் எக்காளத்தோடும் வானத்திலிருந்து இறங்கி வருவார்; மேசியாவுக்குள் இறந்தவர்கள் முதலில் உயிர்த்தெழுவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கட்டளையோடு.” கிரேக்கச் சொல் அதிகாரமுள்ள அழைப்பையோ கட்டளையிடும் கூக்குரலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'மரபுவழி மொழிபெயர்ப்பு: “கிறிஸ்துவுக்குள் இறந்தவர்கள் முதலில் உயிர்த்தெழுவார்கள்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட ஆறுதலுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணவிளக்கத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτὸς ὁ κύριος
  choice: ஆண்டவர் தாமே
  rationale: αὐτός தரும் வலியுறுத்தலை ‘தாமே’ தெளிவாகக் காக்கிறது; κύριος என்பதற்கு மரியாதைமிக்க வழக்குத் தமிழான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐν κελεύσματι
  choice: கட்டளையிடும் முழக்கத்தோடு
  rationale: κέλευσμα என்பது அதிகாரமுள்ள கட்டளை, அழைப்பு அல்லது கட்டளையிடும் கூக்குரலைக் குறிக்கலாம். ‘முழக்கம்’ அதன் ஒலிப்பண்பையும் ‘கட்டளையிடும்’ அதன் அதிகாரப்பண்பையும் காக்கின்றன.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: பிரதான தூதரின் குரலோடு
  rationale: φωνή என்பதைக் ‘குரல்’ என்றும், ἀρχάγγελος என்பதைக் பொதுவாகப் புரியக்கூடிய ‘பிரதான தூதர்’ என்றும் நேரடியாக வழங்குகிறது. கிரேக்கத்தில் குறிப்பிட்ட ஒருவரைக் கட்டாயப்படுத்தும் உருபு இல்லாததால் தமிழிலும் கூடுதல் அடையாளம் சேர்க்கப்படவில்லை.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: கடவுளின் எக்காள முழக்கத்தோடு
  rationale: σάλπιγξ என்பது எக்காளத்தைக் குறிக்கிறது. தமிழில் இயல்பாக நிகழ்வின் ஒலியை உணர்த்த ‘முழக்கம்’ சேர்க்கப்பட்டுள்ளது; அது தனியான நான்காவது நிகழ்வை உருவாக்காமல் கருவியின் ஒலியைக் குறிப்பிடுகிறது.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: வானத்திலிருந்து இறங்கி வருவார்
  rationale: கீழ்நோக்கிய இயக்கத்தைத் தெளிவாகக் காக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: οἱ νεκροὶ ἐν Χριστῷ
  choice: மேசியாவுக்குள் இறந்தவர்கள்
  rationale: οἱ νεκροί என்பதைக் தமிழில் இயல்பாக ‘இறந்தவர்கள்’ என வழங்குகிறது. ἐν Χριστῷ குறிக்கும் மேசியாவுடனான உறவு அல்லது ஒன்றிப்பைத் தீர்மானித்து விளக்காமல் ‘மேசியாவுக்குள்’ எனக் காக்கிறது.
- source_word: ἀναστήσονται πρῶτον
  choice: முதலில் உயிர்த்தெழுவார்கள்
  rationale: உயிர்த்தெழுதலைக் குறிக்கும் எதிர்கால வடிவையும், அடுத்த வசனத்தில் உயிரோடிருப்பவர்களுக்கு முந்திய வரிசையைக் குறிக்கும் πρῶτον என்பதையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐν Χριστῷ என்பதிலுள்ள Χριστός சொல்லின் மொழிபெயர்ப்பு
  choice: மேசியாவுக்குள்
  alternative: கிறிஸ்துவுக்குள்
  rationale: Χριστός இங்கு அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டமாகச் செயல்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மேசியா’ முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது. பழக்கமான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν Χριστῷ குறிக்கும் உறவு
  choice: மேசியாவுக்குள்
  alternative: மேசியாவைச் சேர்ந்தவர்களாய்
  rationale: ‘சேர்ந்தவர்கள்’ என்பது உறவின் பொருளை விளக்கினாலும், கிரேக்க ἐν உருவகத்தின் உண்மையான சுருக்கத்தையும் இறையியல் நெருக்கத்தையும் ஓரளவு தீர்மானித்துவிடும். எனவே அதன் திறந்த தன்மை காக்கப்படுகிறது.
- issue: κέλευσμα என்பதன் துல்லிய நுணுக்கம்
  choice: கட்டளையிடும் முழக்கம்
  alternative: கட்டளை
  rationale: இந்தச் சொல் வெறும் உள்ளடக்கமாகிய கட்டளையையும் அதிகாரமுள்ள கூக்குரல் அல்லது அழைப்பையும் குறிக்கக்கூடும். ஒலிசார் சூழலில் ‘கட்டளையிடும் முழக்கம்’ இரு அம்சங்களையும் தாங்குகிறது; எளிய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: மொழிநடை நவீன, மரியாதைமிக்க, பொதுமக்களுக்கு விளங்கும் தரமான தமிழ். மூன்று ἐν சொற்றொடர்களின் இணை அமைப்பை ‘-தோடு’ வழியாகக் காத்து, நீண்ட கிரேக்க வாக்கியத்தை தமிழின் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளது. இரண்டாவது வாக்கியத்தின் ‘அப்போது’ கிரேக்க καί குறிக்கும் நிகழ்வுத் தொடரை இயல்பாக வெளிப்படுத்துகிறது.
