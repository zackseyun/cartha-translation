  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: ta
  text: ஏனெனில், மக்கெதோனியா முழுவதிலும் உள்ள சகோதரர்கள் அனைவரிடமும் நீங்கள் இதையே செய்துவருகிறீர்கள். ஆனால் சகோதரர்களே,[a] இதில் இன்னும் அதிகமாகப் பெருகும்படி உங்களை வேண்டிக்கொள்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “சகோதரர்களே” என்பது சக விசுவாசிகளைக் குறிக்கிறது; சபைகளிலிருந்த ஆண்களும் பெண்களும் இதில் உள்ளடங்கியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: உண்மையில்
  rationale: γάρ தரும் முந்தைய கூற்றுக்கான விளக்கத் தொடர்பையும் καί தரும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ποιεῖτε αὐτό
  choice: நீங்கள் இதையே செய்துவருகிறீர்கள்
  rationale: αὐτό முந்தைய வசனத்தில் கூறப்பட்ட சகோதர அன்பைச் சுட்டுகிறது; நிகழ்கால வினை வடிவத்தின் தொடர்ச்சியான நடைமுறையை ‘செய்துவருகிறீர்கள்’ காட்டுகிறது.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: சகோதரர்கள் அனைவரிடமும்
  rationale: εἰς இங்கு அன்புச் செயல் யாரை நோக்கியது என்பதைக் குறிக்கிறது; ‘அனைவரிடமும்’ என்பது தமிழில் இயல்பாக அந்த உறவுசார் திசையைத் தெரிவிக்கிறது.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: மக்கெதோனியா முழுவதிலும் உள்ள
  rationale: ὅλῃ என்பதன் முழுப் பரப்பையும், அங்குள்ள சக விசுவாசிகளை அடையாளப்படுத்தும் சொற்றொடரையும் தெளிவாகக் காக்கிறது.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: ஆனாலும் ... உங்களை வேண்டிக்கொள்கிறோம்
  rationale: δέ பாராட்டிலிருந்து மேலதிக அறிவுறுத்தலுக்கான மென்மையான மாறுதலைக் குறிக்கிறது; παρακαλοῦμεν இங்கு அன்பான, earnest வேண்டுகோள் அல்லது ஊக்குவிப்பு.
- source_word: περισσεύειν μᾶλλον
  choice: இதில் இன்னும் அதிகமாகப் பெருகும்படி
  rationale: περισσεύειν என்பதிலுள்ள மிகுதி அல்லது வளர்ச்சி உருவகத்தையும் μᾶλλον என்பதன் ஒப்பீட்டு வலிமையையும் காக்கிறது. ‘இதில்’ என்பது சூழலில் சகோதர அன்பைச் சுட்டினாலும் அதை விளக்கமாக மாற்றிப் பெயரிடுவதில்லை.
theological_decisions:
- issue: ἀδελφοὺς / ἀδελφοί என்பதன் கலப்பு பாலின சபைச் சூழல்
  choice: சகோதரர்கள் / சகோதரர்களே
  alternative: சகோதர சகோதரிகள் / சக விசுவாசிகள்
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் காக்கிறது; அதேவேளையில் பவுலின் பயன்பாட்டில் இது ஆண்களையும் பெண்களையும் உள்ளடக்கிய விசுவாசக் குடும்பத்தைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதையே செய்துவருகிறீர்கள்’ தொடரும் நடைமுறையையும், ‘இன்னும் அதிகமாகப் பெருகும்படி’ ஏற்கெனவே உள்ள அன்பு மேலும் வளர வேண்டும் என்ற வலியுறுத்தலையும் காக்கின்றன.
