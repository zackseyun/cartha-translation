translation:
  language: ta
  text: உங்களில் ஒவ்வொருவரும் தமக்குரிய பாத்திரத்தைப் பரிசுத்தத்தோடும் கண்ணியத்தோடும் பெற்றுக்கொள்ள அறிந்திருக்க வேண்டும்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκεῦος
  choice: பாத்திரம்
  rationale: இதன் அடிப்படை உருவகப் பொருளைத் தக்கவைக்கிறது. இச்சூழலில் இது ஒருவரின் உடலையோ மனைவியையோ குறிக்கலாம்; அந்தத் தெளிவின்மையை முதன்மை உரையில் தீர்த்துவிடவில்லை.
- source_word: κτᾶσθαι
  choice: பெற்றுக்கொள்ள
  rationale: நடுநிலை வினை வடிவத்தின் ‘பெறு/தனதாக்கிக்கொள்’ என்ற இயல்பான பொருளை அளிக்கிறது; ‘கட்டுப்படுத்திக்கொள்’ என்று மட்டும் பொருள் குறுக்கப்படுவதையும் தவிர்க்கிறது.
- source_word: ἁγιασμῷ
  choice: பரிசுத்தத்தோடு
  rationale: பாலியல் தூய்மையை உள்ளடக்கும் பரிசுத்த நிலை அல்லது நடத்தை என்ற கருத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τιμῇ
  choice: மதிப்போடு
  rationale: τιμή என்பதன் கண்ணியம், மரியாதை, மதிப்பு ஆகிய பொருள் வட்டத்தை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰδέναι
  choice: அறிந்திருக்க வேண்டும்
  rationale: முந்தைய வசனத்தின் நோக்கக் கட்டமைப்புடன் இணையும் infinitive-ஐ தமிழில் புரியத்தக்க கடமை/திறன் மொழியாக மாற்றுகிறது.
theological_decisions:
- issue: ‘தமக்குரிய பாத்திரம்’ எதைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘பாத்திரம்’ என்ற உருவகத்தைப் பாதுகாத்து, மாற்றுப் புரிதல்களை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘தன் உடலைக் கட்டுப்படுத்துதல்’ அல்லது ‘தனக்கென ஒரு மனைவியைப் பெறுதல்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: கிரேக்கத் தொடர் இரு விளக்கங்களுக்கும் இடமளிக்கிறது. ஏதேனும் ஒன்றை முதன்மை உரையில் தேர்ந்தெடுப்பது மூலத்திலுள்ள உண்மையான தெளிவின்மையையும் விளக்கவியல் பதற்றத்தையும் நீக்கிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்கவும் பொதுவாசகர்களுக்குப் புரியத்தக்கவுமான நடை. ‘தமக்குரிய’ என்பது பாலினத்தைத் தனியாகச் சுட்டாமல் ἑαυτοῦ-ன் பிரதிபெயர்ச் சார்பைத் தருகிறது. வசனம் முந்தைய வாக்கியத்துடன் இலக்கண ரீதியாக இணைந்திருப்பதை இறுதியிலுள்ள அரைப்புள்ளி உணர்த்துகிறது.
