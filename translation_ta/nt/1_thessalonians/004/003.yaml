    text: அல்லது, ‘உங்கள் பரிசுத்த வாழ்வு.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் porneia; முறைகேடான பாலியல் நடத்தையைக் குறிக்கும் பரந்த பொருளுடைய சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: சித்தம்
  rationale: கடவுளின் அதிகாரப்பூர்வமான விருப்பத்தையும் நோக்கத்தையும் குறிக்கும் இச்சூழலில், ‘சித்தம்’ என்பது நிலைபெற்ற, இயல்பான தமிழ் சொல்; வெறும் ஆசை என்ற பலவீனமான பொருளைத் தவிர்க்கிறது.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: நீங்கள் பரிசுத்தமடைய வேண்டும்
  rationale: ἁγιασμός குறிக்கும் அர்ப்பணிக்கப்பட்ட பரிசுத்த நிலையையும் அதில் வளர்வதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. பெயர்ச்சொல் அமைப்பு வினை அமைப்பாக மாற்றப்பட்டாலும், தொடர்ந்து வரும் அறநெறி விளக்கத்துடனான தொடர்பு காக்கப்படுகிறது.
- source_word: ἀπέχεσθαι
  choice: விலகியிருக்க வேண்டும்
  rationale: தொடர்ந்து தவிர்த்து வாழும் கருத்தை இயல்பாகத் தெரிவிக்கிறது; இவ்வினையெச்சம் பரிசுத்தமடைவதன் நடைமுறை உள்ளடக்கத்தை விளக்குவதால் ‘அதாவது’ சேர்க்கப்பட்டுள்ளது.
- source_word: πορνείας
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: πορνεία குறிக்கும் முறைகேடான பாலியல் நடத்தையின் பரந்த வரம்பை இச்சொற்றொடர் காக்கிறது; அதை ஒரு குறிப்பிட்ட வகை பாலியல் தவறாக மட்டும் சுருக்கவில்லை.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணம் அல்லது அடிப்படையை இவ்வசனம் அளிப்பதைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: அறநெறி அறிவுறுத்தலில் ἁγιασμός என்பதன் பொருள்
  choice: பரிசுத்த நிலையும் பரிசுத்த வாழ்வில் முன்னேறுதலும் திறந்திருக்குமாறு ‘பரிசுத்தமடைய வேண்டும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உங்கள் பரிசுத்தம்’ என்று பெயர்ச்சொல் வடிவில் மொழிபெயர்த்தல்.
  rationale: இச்சொல் வெறும் ஏற்கெனவே வழங்கப்பட்ட நிலையை மட்டுமோ, ஒரு படிப்படியான செயல்முறையை மட்டுமோ குறிப்பதாக மொழிபெயர்ப்பு தீர்மானிக்கவில்லை. அதைத் தொடர்ந்து வரும் பாலியல் தூய்மை குறித்த கூற்று அதன் அறநெறி உள்ளடக்கத்தை விளக்குகிறது.
- issue: πορνεία என்பதன் வரம்பு
  choice: பரந்த பொருளில் ‘பாலியல் ஒழுக்கக்கேடு’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ஒரு குறிப்பிட்ட வகையான முறைகேடான பாலுறவை மட்டும் குறிக்கும் குறுகிய சொல்.
  rationale: கிரேக்கச் சொல் முறைகேடான பாலியல் நடத்தையைப் பரந்த அளவில் குறிக்கக்கூடும்; ஆதார உரை கூறுவதைவிடக் குறுகிய சமய அல்லது பண்பாட்டு வரையறையை மொழிபெயர்ப்பில் புகுத்தாமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘சித்தம்’, ‘பரிசுத்தம்’ போன்ற நிலைபெற்ற சொற்கள் தக்கவைக்கப்பட்டுள்ளன; இலக்கணத் தெளிவுக்காக விளக்கவுரை கோடு பயன்படுத்தப்பட்டுள்ளது.
