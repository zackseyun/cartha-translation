  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: ta
  text: 'ஏனெனில், இதுவே கடவுளின் சித்தம்: உங்கள் பரிசுத்தமே[a]—அதாவது, நீங்கள் பாலியல் ஒழுக்கக்கேட்டிலிருந்து[b] விலகியிருக்க வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
