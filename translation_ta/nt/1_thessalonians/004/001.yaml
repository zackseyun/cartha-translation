id: 1TH.4.1
reference: 1 Thessalonians 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: ta
  text: ஆகவே, இறுதியாக, சகோதரர்களே[a], எங்களிடமிருந்து நீங்கள் எவ்வாறு நடந்து கடவுளுக்குப் பிரியமாயிருக்க வேண்டும் என்பதைப் பெற்றுக்கொண்டபடியே—நீங்கள் அவ்வாறே நடந்துவருகிறீர்கள்—மேலும் மேலும் முன்னேறும்படி, கர்த்தராகிய இயேசுவில் உங்களிடம் கேட்டுக்கொண்டு வலியுறுத்துகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; கிரேக்கத்தில் ‘சகோதரர்களே’ என்று உள்ளது. ஆண்பால் பன்மை வடிவம் கலப்புப் பாலினக் குழுவை அழைக்கவும் அடிக்கடி பயன்படுத்தப்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: ஆகவே, இறுதியாக
  rationale: οὖν என்பதன் முடிவுகூறும் தொடர்பையும் λοιπὸν என்பதன் புதிய இறுதி அறிவுரைப் பகுதிக்கான மாற்றத்தையும் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே[a]
  rationale: கிரேக்க ஆண்பால் பன்மையை முதன்மை உரையில் காக்கிறது; இது முழுச் சபையையும் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν
  choice: உங்களைக் கேட்டுக்கொண்டு வலியுறுத்துகிறோம்
  rationale: முதல் வினையின் பணிவான வேண்டுதலையும் இரண்டாம் வினையின் உறுதியான அறிவுறுத்தலையும் இயல்பான தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: கர்த்தராகிய இயேசுவில்
  rationale: ἐν என்பதன் உறவு அல்லது செயல்பாட்டுக் களத்தையும் κύριος என்பதன் கிறிஸ்துவுக்குரிய பட்டத்தையும் காக்கிறது.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν
  choice: எங்களிடமிருந்து நீங்கள் பெற்றுக்கொண்டபடியே
  rationale: அப்போஸ்தலரிடமிருந்து அறிவுறுத்தலைப் பெற்றுக்கொண்டதைக் குறிக்கும் παραλαμβάνω என்பதன் பொருளை மிகையாக விளக்காமல் தருகிறது.
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: எப்படி நடக்கவும் ... வேண்டும்
  rationale: περιπατεῖν என்பதன் வாழ்க்கை நடத்தையைக் குறிக்கும் நடை உருவகத்தைத் தக்கவைத்து, δεῖ என்பதன் ஒழுக்கக் கடமையை ‘வேண்டும்’ என வெளிப்படுத்துகிறது.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: கடவுளுக்குப் பிரியமாய் இருக்கவும்
  rationale: கடவுளைப் பிரியப்படுத்தும் வாழ்க்கையை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: நீங்கள் அப்படியே நடந்துவருகிறீர்கள்
  rationale: அவர்கள் ஏற்கெனவே அவ்வாறு வாழ்ந்துவருவதை அங்கீகரிக்கும் நிகழ்காலத் தொடர்ச்சியையும் நடை உருவகத்தையும் காக்கிறது.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: அதில் மேலும் மேலும் பெருகுங்கள்
  rationale: தற்போதைய நிலையைக் கடந்த தொடர்ச்சியான வளர்ச்சியை περισσεύω மற்றும் μᾶλλον இணைந்து உணர்த்துவதால், பெருக்கத்தின் உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தெசலோனிக்கேய விசுவாசிகளுக்கான பாலினம் குறித்த அழைப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என வைத்து, உள்ளடக்கிய பயன்பாட்டை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: ἀδελφοί இலக்கணரீதியாக ஆண்பால் பன்மை என்றாலும், சூழலில் முழு விசுவாசக் குழுவையும் குறிக்கக்கூடும்; உரையின் வடிவமும் சூழலின் பரப்பும் இரண்டும் பாதுகாக்கப்படுகின்றன.
- issue: இயேசுவைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: கர்த்தர்
  alternative: ஆண்டவர்
  rationale: இங்கு κύριος இயேசுவுக்குரிய கிறிஸ்துவியல் பட்டமாக வருகிறது; ‘கர்த்தர்’ அதை பலவீனப்படுத்தாமல் வெளிப்படுத்துகிறது.
- issue: கிறிஸ்தவ நடத்தையைக் குறிக்கும் περιπατεῖν உருவகம்
  choice: நடக்க
  alternative: வாழ
  rationale: ‘நடக்க’ என்பது பவுலின் வாழ்க்கை-நடத்தை உருவகத்தைப் பாதுகாக்கிறது; அருகிலுள்ள சூழலும் அதன் உவமைப் பொருளைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நீண்ட வாக்கியத் தொடர்பு முக்காற்புள்ளி மற்றும் இடைக்கோடுகள் மூலம் வாசிக்க எளிதாக்கப்பட்டுள்ளது; ‘நடக்க’ மற்றும் ‘பெருக’ ஆகிய மூல உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன.
