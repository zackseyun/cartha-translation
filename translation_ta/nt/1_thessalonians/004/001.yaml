- from: 'ஆகவே, இறுதியாக, சகோதரர்களே[a], கர்த்தராகிய இயேசுவில் உங்களைக் கேட்டுக்கொண்டு வலியுறுத்துகிறோம்: எப்படி நடக்கவும் கடவுளுக்குப் பிரியமாய் இருக்கவும் வேண்டும் என்பதை எங்களிடமிருந்து நீங்கள் பெற்றுக்கொண்டபடியே—நீங்கள் அப்படியே நடந்துவருகிறீர்கள்—அதில் மேலும் மேலும் பெருகுங்கள்.'
  to: ஆகவே, இறுதியாக, சகோதரர்களே[a], எங்களிடமிருந்து நீங்கள் எவ்வாறு நடந்து கடவுளுக்குப் பிரியமாயிருக்க வேண்டும் என்பதைப் பெற்றுக்கொண்டபடியே—நீங்கள் அவ்வாறே நடந்துவருகிறீர்கள்—மேலும் மேலும் முன்னேறும்படி, கர்த்தராகிய இயேசுவில் உங்களிடம் கேட்டுக்கொண்டு வலியுறுத்துகிறோம்.
