id: 1TH.4.8
reference: 1 Thessalonians 4:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: ta
  text: ஆகவே[a], இதைப் புறக்கணிக்கிறவர் மனிதரை அல்ல, தமது பரிசுத்த ஆவியை உங்களுக்குக் கொடுக்கிறவருமான கடவுளையே புறக்கணிக்கிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆகவே’ என்பதற்கு ‘எனவே’ அல்லது ‘அப்படியானால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘புறக்கணிக்கிறார்’ என்பதற்கு ‘நிராகரிக்கிறார்’ அல்லது ‘ஒதுக்கிவிடுகிறார்’ என்றும் மொழிபெயர்க்கலாம். ‘உங்களுக்குக்’ என்பதற்கு, கிரேக்கத்தின் நேரடியான திசைப்பொருளை வெளிப்படுத்தும் வகையில், ‘உங்களுக்குள்’ என்றும் மொழிபெயர்க்கலாம். ‘கொடுக்கிறவருமான’ என்பதில் உள்ள ‘-உமான’ கிரேக்க καί என்பதன் ‘மேலும்/அவரும்’ என்ற நுணுக்கத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: ஆகவே
  rationale: முந்தைய அறிவுறுத்தலிலிருந்து வரும் முடிவைக் குறிக்கும் காரணவிளைவு இணைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: புறக்கணிக்கிறவர் ... புறக்கணிக்கிறார்
  rationale: ἀθετέω என்பது அதிகாரமுள்ள அறிவுறுத்தலை நிராகரித்தல், மதிக்காமல் விடுதல், ஒதுக்கிவைத்தல் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு ‘புறக்கணிக்கிறார்’ என்பது தமிழில் அந்த விரிவைத் தக்கவைக்கிறது; ஒரே வினைச்சொல்லை இருமுறையும் பயன்படுத்துவது கிரேக்கத்தின் சொல்லிணைப்பையும் காக்கிறது.
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: மனிதரை அல்ல ... கடவுளையே
  rationale: ἄνθρωπον இங்கு பாலினம் சாராத பொதுமை ஒருமை. ‘மனிதரை’ என்பது அந்தப் பொதுமையைக் காத்து, ‘கடவுளையே’ என்பதில் எதிர்மறை வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν καὶ διδόντα
  choice: கொடுக்கிற
  rationale: பெயரெச்சமாக உள்ள நிகழ்காலப் பங்கேற்பைத் தமிழின் தொடர்பெயரெச்ச வடிவில் இயல்பாக வழங்குகிறது. καί தொடர்புடைய மாற்று வாசிப்பின் நுணுக்கம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: தமது பரிசுத்த ஆவியை
  rationale: இச்சொற்றொடர் கடவுளுடைய பரிசுத்த ஆவியைக் குறிக்கிறது. எழுவாய் கடவுள் என்பதால் மரியாதைத் தற்சுட்டான ‘தமது’ இயல்பானது; ‘பரிசுத்த ஆவி’ தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் தெளிவானதும் மாண்புடையதும் ஆகும்.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்கு
  rationale: εἰς என்பதன் அடிப்படைத் திசைப்பொருள் ‘உங்களுக்குள்’ என வழங்கப்படலாம்; ஆனால் δίδωμι உடன் தமிழில் ‘உங்களுக்குக் கொடுக்கிற’ என்பது இயல்பான பெறுநர் அமைப்பு. மூலத்தின் நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ‘தமது பரிசுத்த ஆவி’ என்பதன் குறிப்பு
  choice: கடவுள் விசுவாசிகளுக்குக் கொடுக்கும் பரிசுத்த ஆவியைக் குறிக்கும் தனிப்பட்ட குறிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஒரு தனிப்பட்டவராக அல்லாமல் பரிசுத்தமான மனப்பாங்கு அல்லது ஆவிக்குரிய வரமாகப் புரிந்துகொள்ளுதல்.
  rationale: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον என்ற சொற்கட்டும் பவுலின் சூழலும் கடவுளுடைய பரிசுத்த ஆவியையே இயல்பாகக் குறிக்கின்றன; இதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: ὁ ἀθετῶν என்பதன் பொதுமை
  choice: பாலினம் சாராத ‘புறக்கணிக்கிறவர்’ என வழங்கப்பட்டது.
  alternative: ஆண்பால் குறிப்புடைய ‘புறக்கணிக்கிறவன்’ அல்லது சொல்லுக்கு நெருக்கமான ‘புறக்கணிப்பவன்’.
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு ஆண்களை மட்டும் குறிக்காமல் பொதுவான பிரதிநிதிப் பொருளில் வருகிறது. தமிழ் மரியாதை ஒருமை இயல்பாக அந்தப் பொதுமையை வெளிப்படுத்துகிறது.
- issue: கடவுளைப் புறக்கணிப்பதற்கான வலியுறுத்தல்
  choice: ‘கடவுளையே புறக்கணிக்கிறார்’ என எதிர்மறை வலியுறுத்தல் வெளிப்படுத்தப்பட்டது.
  alternative: ‘கடவுளைப் புறக்கணிக்கிறார்’ என வலியுறுத்தல் உருபின்றி வழங்குதல்.
  rationale: οὐκ ... ἀλλά அமைப்பின் கூர்மையான எதிர்மறையைத் தமிழில் ‘அல்ல ... ஏ’ அமைப்பு தெளிவாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மாண்பான நடையில் வடிவமைக்கப்பட்டது. ‘புறக்கணிக்கிறவர்’ பாலினம் சாராத மரியாதை ஒருமையாகும். கிரேக்கத்தின் எதிர்மறை அமைப்பும் ஒரே வினைச்சொல்லின் மறுபயன்பாடும் தக்கவைக்கப்பட்டுள்ளன.
