- from: ஆகவே[a], இதைப் புறக்கணிக்கிறவர் மனிதரை அல்ல, தமது பரிசுத்த ஆவியை உங்களுக்குக் கொடுக்கிற கடவுளையே புறக்கணிக்கிறார்.[b]
  to: ஆகவே[a], இதைப் புறக்கணிக்கிறவர் மனிதரை அல்ல, தமது பரிசுத்த ஆவியை உங்களுக்குக் கொடுக்கிறவருமான கடவுளையே புறக்கணிக்கிறார்.[b]
  rationale: The revision explicitly retains καί by rendering God as ‘the one who also gives’ and replaces the inaccurate textual-variant claim in footnote b with genuine lexical/idiomatic alternatives. The source’s generic subject, emphatic not-man-but-God contrast, present participial description of God, and Holy Spirit terminology remain intact.
