reference: 1 Thessalonians 4:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: ta
  text: ஏனெனில், ஆண்டவராகிய இயேசுவின் மூலமாக[a] நாங்கள் உங்களுக்கு என்ன அறிவுறுத்தல்களைக் கொடுத்தோம் என்பது உங்களுக்குத் தெரியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவராகிய இயேசுவின் அதிகாரத்தினால்.”
    reason: διὰ τοῦ κυρίου Ἰησοῦ என்பது இடைமுகம் அல்லது வழிமுறையை மட்டுமல்லாமல், அவருடைய அதிகாரத்தின் பேரில் என்பதையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: οἴδατε
  choice: உங்களுக்குத் தெரியும்
  rationale: οἶδα இறந்தநிறை வடிவில் இருந்தாலும் கொய்னே கிரேக்கத்தில் நிகழ்காலப் பொருளைக் கொண்டது; நவீனத் தமிழில் இயல்பாக இவ்வாறு கூறப்படுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ ஆதாரத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: τίνας παραγγελίας
  choice: என்ன அறிவுறுத்தல்களை
  rationale: τίνας என்பதன் கேள்விப் பொருளையும் παραγγελία என்பதிலுள்ள அதிகாரமுள்ள வழிகாட்டுதல் என்ற நுணுக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐδώκαμεν ὑμῖν
  choice: நாங்கள் உங்களுக்குக் கொடுத்தோம்
  rationale: δίδωμι என்பதன் நேரடியான பொருளைக் காத்து, தமிழில் அறிவுறுத்தல்களோடு இயல்பாக அமைகிறது.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: ஆண்டவராகிய இயேசுவின் மூலமாக
  rationale: διά + genitive குறிக்கும் வழிமுறை அல்லது இடைமுகச் செயற்பாட்டை நேரடியாகக் காக்கிறது; அதிகாரத்தின் அடிப்படையில் என்ற சாத்தியமான நுணுக்கத்தை அடிக்குறிப்பு தருகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் வேதாகமச் சொல்லாக்கம்.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: பெயரின் நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: διὰ τοῦ κυρίου Ἰησοῦ என்பதன் பொருள் வலிமை
  choice: ஆண்டவராகிய இயேசுவின் மூலமாக
  alternative: ஆண்டவராகிய இயேசுவின் அதிகாரத்தினால்
  rationale: கிரேக்கத் தொடர் இடைமுகம் அல்லது வழிமுறையையும், சூழலில் அதிகாரத்தையும் சுட்டக்கூடும். முதன்மை உரை அதன் வடிவத்தையும் இறையியல் செறிவையும் குறுக்காமல் காக்கிறது; அதிகார நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘அறிவுறுத்தல்கள்’ என்பது அதிகாரமுள்ள போதனையை வெளிப்படுத்துகிறது; ஆனால் ‘கட்டளைகள்’ என்று பொருளைத் தேவையின்றி கடுமையாக்கவில்லை. அடிக்குறிப்பு குறியீடு உரையில் இடம்பெற்றுள்ளது.
