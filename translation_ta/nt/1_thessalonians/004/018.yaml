translation:
  language: ta
  text: ஆகவே, இந்த வார்த்தைகளால் ஒருவரையொருவர் ஊக்கப்படுத்துங்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வார்த்தைகளால் ஒருவரையொருவர் ஆறுதல்படுத்துங்கள்.” இங்கு பயன்படுத்தப்பட்டுள்ள வினைச்சொல் ஊக்கப்படுத்துதல், ஆறுதலளித்தல், அல்லது அறிவுறுத்துதல் என்ற பொருள்களைக் கொள்ளலாம்; இச்சூழலில் ஆறுதலூட்டும் உறுதிப்படுத்தல் குறிப்பாக வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் ஆண்டவரின் வருகையையும் இறந்த விசுவாசிகளின் உயிர்த்தெழுதலையும் குறித்து சொல்லப்பட்டவற்றிலிருந்து வரும் முடிவை இயல்பாகக் காட்டுகிறது.
- source_word: παρακαλεῖτε
  choice: ஊக்கப்படுத்துங்கள்
  rationale: இச்சொல் ஊக்கப்படுத்துதல், ஆறுதலளித்தல், அறிவுறுத்துதல் ஆகிய பொருள்களைக் கொள்ளலாம். இறந்தவர்களைக் குறித்த கவலையின் பின்னணியில் மேய்ப்புப் பணிக்குரிய உறுதியளிப்பை உள்ளடக்கிக்கொண்டே அதன் பரந்த பொருளை ‘ஊக்கப்படுத்துங்கள்’ தக்கவைக்கிறது.
- source_word: ἀλλήλους
  choice: ஒருவரையொருவர்
  rationale: கட்டளையின் பரஸ்பரத் தன்மையை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν
  choice: ஆல்
  rationale: இங்கு ஊக்கப்படுத்துவதற்கான கருவி அல்லது வழிமுறையைக் குறிக்கும் ἐν என்பதன் பொருளை ‘இந்த வார்த்தைகளால்’ என்ற இயல்பான தமிழ்த் தொடரில் வெளிப்படுத்துகிறது.
- source_word: τοῖς λόγοις τούτοις
  choice: இந்த வார்த்தைகள்
  rationale: பவுல் சற்றுமுன் எழுதிய குறிப்பிட்ட கூற்றுகளையே சுட்டுவதால், ‘இந்த வார்த்தைகள்’ என்பது நேரடியானதும் வெளிப்படையானதுமான மொழிபெயர்ப்பு.
