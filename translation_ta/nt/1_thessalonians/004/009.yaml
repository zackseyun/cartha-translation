source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: ta
  text: சகோதர அன்பைக் குறித்து[a] உங்களுக்கு எழுத வேண்டிய தேவை இல்லை[b]; ஏனெனில், ஒருவரையொருவர் அன்புகூர நீங்கள் கடவுளால் கற்பிக்கப்பட்டிருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் குறிப்பாக, ‘சக விசுவாசிகளிடையே உள்ள குடும்ப அன்பு’ என்றும் பொருள் கொள்ளலாம்; கிரேக்கச் சொல் விசுவாசக் சமூகத்திற்குள் குடும்ப உறவின் உருவகத்தைத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: எழுதுபவர் யார் என்பது கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படவில்லை; சூழலின்படி, ‘நாங்கள் உங்களுக்கு எழுத வேண்டிய தேவை இல்லை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: சகோதர அன்பைக் குறித்து
  rationale: περὶ புதிய பொருளை அறிமுகப்படுத்துவதைக் ‘குறித்து’ இயல்பாகக் காட்டுகிறது; δέ-யின் மென்மையான தொடர்ச்சி தமிழில் தனிக் காலச்சொல் சேர்க்காமல் வாக்கிய அமைப்பில் விடப்பட்டுள்ளது.
- source_word: φιλαδελφίας
  choice: சகோதர அன்பு
  rationale: திருச்சபைக்குள் குடும்ப உறவைப் போன்ற அன்பைக் குறிக்கும் சொல்லின் உருவகத்தையும், பின்னர் வரும் ἀγαπᾶν என்பதிலிருந்து அதன் சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: உங்களுக்கு யாரும் எழுத வேண்டியதில்லை
  rationale: γράφειν என்பதன் செய்பவர் கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படவில்லை. இயல்பான தமிழுக்காக ‘யாரும்’ சேர்க்கப்படுகிறது; ‘நாங்கள்’ என்று அளவுக்கு மீறிக் குறிப்பாக்கப்படவில்லை.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: ஏனெனில், நீங்கள் நீங்களே
  rationale: இரட்டைப் பதிலிப்பெயரால் தரப்படும் வலியுறுத்தலை ‘நீங்கள் நீங்களே’ காக்கிறது.
- source_word: θεοδίδακτοί
  choice: கடவுளால் கற்பிக்கப்பட்டிருக்கிறீர்கள்
  rationale: கடவுளே கற்பிப்பவர் என்ற தெய்வீக செயற்பாட்டைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: ஒருவரிலொருவர் அன்புகூரும்படி
  rationale: εἰς τό + infinitive கட்டமைப்பின் நோக்கம் அல்லது விளைவு சார்ந்த நெகிழ்வை ‘-ும்படி’ இயல்பாகத் தாங்குகிறது; பரஸ்பரத்தன்மையும் காக்கப்படுகிறது.
theological_decisions:
- issue: φιλαδελφία மற்றும் ἀγαπᾶν ஆகியவற்றுக்கிடையிலான சொல்வேறுபாடு
  choice: φιλαδελφία என்பதை ‘சகோதர அன்பு’ என்றும் ἀγαπᾶν என்பதை ‘அன்புகூர்’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் பொதுவாக ‘அன்பு’ என்று மொழிபெயர்த்தல்
  rationale: முதலாவது விசுவாசிகளிடையிலான குடும்பப் பாச உருவகத்தைத் தாங்குகிறது; இரண்டாவது பரந்த வினைச்சொல். பவுலின் சொல் மாறுபாட்டைச் சமப்படுத்தாமல் காக்கிறது.
- issue: γράφειν என்பதன் மறைமுக எழுவாய்
  choice: ‘யாரும் எழுத வேண்டியதில்லை’ என்று குறிப்பிடுதல்
  alternative: ‘நாங்கள் உங்களுக்கு எழுத வேண்டியதில்லை’
  rationale: சூழலில் பவுலும் உடன் அனுப்புநர்களும் இயல்பான எழுத்தாளர்களாக இருந்தாலும், கிரேக்க வினையெச்சத்தில் எழுவாய் வெளிப்படையாக இல்லை. ‘யாரும்’ என்பது இந்தத் தெளிவின்மையைத் தக்கவைத்தபடி தமிழில் இயல்பாக உள்ளது.
- issue: θεοδίδακτοι என்பதன் தெய்வீக செயற்பாடு
  choice: ‘கடவுளால் கற்பிக்கப்பட்டிருக்கிறீர்கள்’
  alternative: ‘கடவுளிடமிருந்து கற்றிருக்கிறீர்கள்’
  rationale: மூலச் சொல் கடவுளைக் கற்பிப்பவராகக் காட்டுகிறது; மாற்று வடிவம் மனிதர்கள் கற்றுக்கொண்ட செயலை முன்னிறுத்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டது. ‘சகோதர அன்பு’ என்ற வேதாகமப் பயன்பாடு தக்கவைக்கப்பட்டு, அது சக விசுவாசிகள் அனைவரையும் உள்ளடக்கும் குடும்ப உருவகம் என்பது அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
