source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: ta
  text: இந்தக் காரியத்தில்[a] ஒருவனும் வரம்பு மீறி, தன் சகோதரனை[b]ச் சுரண்டக் கூடாது. ஏனெனில், இவை அனைத்துக்கும் ஆண்டவர் பழிதீர்ப்பவர்; நாங்கள் உங்களிடம் முன்பே சொல்லியும் வலியுறுத்தி எச்சரித்தும் இருந்ததுபோலவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த விவகாரத்தில் தன் சகோதரனை மோசடி செய்யக் கூடாது.” கிரேக்க வினை மற்றொருவரைப் பயன்படுத்திக்கொள்வதையோ, அவருடைய இழப்பில் ஆதாயம் அடைவதையோ குறிக்கலாம். சிலர் இதைப் பொதுவான மோசடி என்று புரிந்துகொள்கிறார்கள்; ஆனால் சூழலில் இது பெரும்பாலும் பாலியல் ஒழுக்கக்கேட்டைக் குறித்த எச்சரிக்கையாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தன் சகோதரனை” என்பது ஆண்பால் ஒருமையிலுள்ள கிரேக்கச் சொற்றொடரின் மொழிபெயர்ப்பு. இது குறிப்பாக ஓர் உடன்விசுவாசியைக் குறிக்கக்கூடும்; எனினும் இந்த அறநெறி எச்சரிக்கை விசுவாசக் குழுவிலுள்ள மற்றவர்களுக்கும் பொருந்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: ஒருவனும் வரம்புமீறி … கூடாது
  rationale: ὑπερβαίνω என்பதிலுள்ள எல்லை மீறுதல் என்ற உருவகத்தையும், இங்கு தொடரும் அறநெறிக் கட்டளையின் பொதுவான தடையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πλεονεκτεῖν
  choice: சுரண்ட
  rationale: மற்றொருவரின் இழப்பில் தகாத ஆதாயம் அடைதல் அல்லது அவரைப் பயன்படுத்திக்கொள்ளுதல் என்ற பரந்த பொருளைத் தருகிறது; இதை பண மோசடியாக மட்டும் குறுக்கவில்லை.
- source_word: ἐν τῷ πράγματι
  choice: இந்தக் காரியத்தில்
  rationale: முந்தைய வசனங்களின் பாலியல் தூய்மை சார்ந்த சூழலைச் சுட்டுகிறது; அதேவேளையில் கிரேக்கத்தின் பொதுவான சொல்லைத் தேவையின்றி விரிவாக்கவில்லை.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: தன் சகோதரனை
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமை வடிவைத் துல்லியமாகக் காக்கிறது. இது உடன்விசுவாசியைக் குறிக்கக்கூடும் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: ἔκδικος κύριος
  choice: ஆண்டவர் பழிதீர்க்கிறவர்
  rationale: ἔκδικος என்பதிலுள்ள அநீதிக்குத் தக்க தண்டனை வழங்கும் நீதித்தீர்ப்பின் வலிமையைப் பாதுகாக்கிறது; κύριος என்பதற்கு நிலையான தமிழ்ச் சமய வழக்கான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: περὶ πάντων τούτων
  choice: இவை அனைத்தையும் குறித்து
  rationale: விவாதிக்கப்படும் எல்லா தவறுகளையும் உள்ளடக்கும் கிரேக்கச் சொற்றொடரின் பரந்த எல்லையை அப்படியே வைத்திருக்கிறது.
- source_word: προείπαμεν
  choice: முன்பே உங்களுக்குச் சொல்லி
  rationale: முன்னதாக அறிவித்தனர் என்ற காலக் கருத்தை தெளிவாகத் தருகிறது; அடுத்த வலியுறுத்தும் வினையோடு தேவையற்ற மறுபடிதலைத் தவிர்க்கிறது.
- source_word: διεμαρτυράμεθα
  choice: மிகக் கண்டிப்பாக எச்சரித்தோம்
  rationale: சாதாரணமாகச் சொல்வதைவிட வலிமையான, பொறுப்புடன் விடுக்கப்பட்ட எச்சரிக்கை என்ற வினையின் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘இந்தக் காரியம்’ என்பதன் சுட்டும் பொருளும் தவறின் தன்மையும்
  choice: முந்தைய வசனங்களின் பாலியல் தூய்மை பற்றிய அறிவுறுத்தலைத் தொடரும் எச்சரிக்கையாக வாசித்து, பொதுவான ஆனால் வலிமையான ‘சுரண்ட’ என்ற சொல்லைப் பயன்படுத்துதல்
  alternative: வணிகம் அல்லது பிற உறவுகளில் செய்யப்படும் மோசடியை மட்டும் குறிப்பதாக வாசித்தல்
  rationale: உடனடிச் சூழல் பரிசுத்தம், பாலியல் ஒழுக்கக்கேடு, உடலைப் பரிசுத்தத்துடன் ஆளுதல் ஆகியவற்றைப் பற்றியது. எனினும் πλεονεκτεῖν என்பதற்கு பொதுவான மோசடி அல்லது தகாத ஆதாயம் என்ற பொருளும் இருக்கக்கூடும்; ஆகவே முதன்மை வாசிப்பு உரையில் பிரதிபலித்தாலும் மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀδελφός என்பதன் மொழிபெயர்ப்பு
  choice: தன் சகோதரனை
  alternative: சகோதரனையோ சகோதரியையோ / உடன்விசுவாசியை
  rationale: மூலத்தில் ஆண்பால் ஒருமை இருப்பதால் அதே வடிவம் முதன்மை உரையில் காக்கப்படுகிறது. எச்சரிக்கையின் சமூகப் பயன்பாடு இன்னும் பரந்ததாக இருக்கலாம் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ἔκδικος κύριος என்பதிலுள்ள ஆண்டவரின் பங்கு
  choice: ஆண்டவர் பழிதீர்க்கிறவர்
  alternative: ஆண்டவர் நீதியான தண்டனை வழங்குகிறவர்
  rationale: மூலச்சொல்லின் பழிதீர்க்கும் நீதித்தீர்ப்பு வலிமையை மெலிதாக்காமல் காக்கிறது. இது கட்டுப்பாடற்ற தனிப்பட்ட பழிவாங்கல் அல்ல, தவறுக்கான ஆண்டவரின் நீதியான பதில் என்பதைச் சூழல் காட்டுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வரம்புமீறி’, ‘சுரண்ட’, ‘பழிதீர்க்கிறவர்’ ஆகிய சொற்கள் மூலத்தின் அறநெறி மற்றும் நீதித்தீர்ப்பு வலிமையைத் தக்கவைக்கின்றன. அடிக்குறி [a] தெளிவில்லாத ‘காரியம்/மோசடி’ தொடர்பையும், [b] ஆண்பால் ஒருமை வடிவையும் அதன் சாத்தியமான பரந்த பயன்பாட்டையும் விளக்குகின்றன.
