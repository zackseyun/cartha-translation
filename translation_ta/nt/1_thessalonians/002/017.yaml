id: 1TH.2.17
reference: 1 Thessalonians 2:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: ta
  text: ஆனால் சகோதரர்களே,[a] சிறிது காலம் உங்களைவிட்டுப் பிரிக்கப்பட்டிருந்த நாங்கள்—நேரில் மட்டுமே, உள்ளத்தால் அல்ல—மிகுந்த ஏக்கத்துடன் உங்கள் முகத்தைக் காண இன்னும் அதிக ஆவலுடன் முயன்றோம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பது பவுலின் அழைப்புமுறை; இச்சூழலில் பெண்கள் உட்பட விசுவாசிகள் அனைவரையும் இது குறிக்கக்கூடும்.
    reason: cultural_note
  - marker: b
    text: “பிரிக்கப்பட்டிருந்த” என்பதற்கான கிரேக்கச் சொல், இன்னும் சொல்லுக்குச் சொல்லாக “உங்களிடமிருந்து அனாதைகளாக்கப்பட்டிருந்த” என்று பொருள்படலாம்; இந்தப் பிரிவின் துயரத்தை அது உயிரோட்டமான ஓர் உருவகத்தால் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: ஆனால் ... நாங்கள்
  rationale: δέ காட்டும் மென்மையான மாறுபாட்டையும், Ἡμεῖς என்பதன் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை அழைப்பை முறையாகப் பேணுகிறது; சூழலில் முழு விசுவாசக் கூட்டத்தையும் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: உங்களைவிட்டுப் பிரிக்கப்பட்டிருந்த
  rationale: வினைச்சொல் அனாதையாக்கப்பட்ட அல்லது உறவை இழந்த துயரமான பிரிவின் உருவகத்தைத் தருகிறது. தமிழில் நேரடியாக ‘அனாதைகளாக்கப்பட்டு’ என்பது உறவின் திசையைத் தவறாக உணர்த்தக்கூடும்; ஆகவே கட்டாயமும் வேதனையும் கொண்ட பிரிவை இயல்பாகத் தரும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது, உருவகம் அடிக்குறிப்பில் காக்கப்பட்டது.
- source_word: πρὸς καιρὸν ὥρας
  choice: சிறிது காலம்
  rationale: சொல்லுக்குச் சொல் ‘ஒரு மணிநேரக் காலம்’ என்பதல்ல; குறுகிய காலத்தைக் குறிக்கும் கிரேக்கச் சொற்றொடரை இயல்பாகத் தருகிறது.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: நேரில் மட்டுமே, உள்ளத்தால் அல்ல
  rationale: உடல்சார்ந்த பிரிவுக்கும் நீடிக்கும் உள்ளார்ந்த பாசத்துக்கும் இடையிலான எதிர்மறையைத் தெளிவாகக் காக்கிறது.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: இன்னும் அதிக ஆவலுடன் முயன்றோம்
  rationale: περισσοτέρως என்பதன் ஒப்பீட்டு வலிமையையும், σπουδάζω என்பதில் உள்ள ஆவல் மற்றும் முயற்சி ஆகிய இரு நுணுக்கங்களையும் ஒன்றாகப் பேணுகிறது.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: உங்கள் முகத்தைக் காண
  rationale: ‘உங்களைக் காண’ என்று பொதுமைப்படுத்தாமல், மூலத்தின் தனிப்பட்டதும் உடல்சார்ந்ததுமான ‘முகம் காணுதல்’ மொழியைப் பேணுகிறது.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: மிகுந்த ஏக்கத்துடன்
  rationale: இங்கு ἐπιθυμία எதிர்மறையான இச்சையைக் குறிக்காமல், தீவிரமான அன்பார்ந்த விருப்பத்தைக் குறிக்கிறது; ‘ஏக்கம்’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀδελφοί என்ற பாலினம் குறிக்கப்பட்ட அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவம் முதன்மை உரையில் காக்கப்படுகிறது. அதே நேரம் பவுலின் பயன்பாட்டில் இது பெண்கள் உட்பட முழுச் சபையையும் குறிக்கக்கூடும் என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ἀπορφανισθέντες என்பதன் துயர உருவகம்
  choice: பிரிக்கப்பட்டிருந்த
  alternative: அனாதைகளாக்கப்பட்டிருந்த
  rationale: உருவகத்தைச் சொல்லுக்குச் சொல் தருவது, பவுலுக்கும் தெசலோனிக்கேயருக்கும் இடையிலான உறவைத் தமிழில் தவறாகப் புரியச் செய்யலாம். எனவே முதன்மை உரையில் வேதனையான பிரிவின் பொருள் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நேரில் மட்டுமே, உள்ளத்தால் அல்ல’ என்ற அமைப்பு மூலத்தின் சுருக்கமான எதிர்மறையைத் தெளிவாக்குகிறது. ‘ஆவலுடன் முயன்றோம்’ என்பது உணர்ச்சியையும் செயற்பாட்டையும் சேர்த்துக் காக்கிறது.
