revisions:
- from: யூதரல்லாதவர்கள் மீட்கப்படும்படி அவர்களிடம் நாங்கள் பேசுவதைத் தடுத்து, இவ்வாறு அவர்கள் எப்போதும் தங்கள் பாவங்களின் அளவை நிரப்புகிறார்கள். ஆனால் சினம் அவர்கள்மேல் கடைசியில்[a] வந்தடைந்துவிட்டது[b].
  to: யூதரல்லாதவர்கள் மீட்கப்படும்படி அவர்களிடம் நாங்கள் பேசுவதைத் தடுப்பதன் மூலம், அவர்கள் எப்போதும் தங்கள் பாவங்களின் அளவை நிரப்புகிறார்கள். ஆனால் சினம் அவர்கள்மேல் கடைசியில்[a] வந்தடைந்துவிட்டது[b].
  rationale: “இவ்வாறு அவர்கள்” என்பதற்குப் பதிலாக “தடுப்பதன் மூலம், அவர்கள்” என மாற்றப்பட்டுள்ளது. இதனால் பாவங்களை நிரப்புபவர்கள் யூதரல்லாதவர்கள் அல்ல, பேசுவதைத் தடுப்பவர்களே என்பது தமிழில் தெளிவாகிறது. εἰς τὸ ἀναπληρῶσαι-இன் விளைவுசார் தொடர்பும், ὀργή மற்றும் εἰς τέλος ஆகியவற்றின் விளக்கத் திறந்தநிலையும் பாதுகாக்கப்பட்டுள்ளன.
