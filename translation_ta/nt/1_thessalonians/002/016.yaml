base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: ta
  text: யூதரல்லாதவர்கள் மீட்கப்படும்படி அவர்களிடம் நாங்கள் பேசுவதைத் தடுப்பதன் மூலம், அவர்கள் எப்போதும் தங்கள் பாவங்களின் அளவை நிரப்புகிறார்கள். ஆனால் சினம் அவர்கள்மேல் கடைசியில்[a] வந்தடைந்துவிட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடைசியில்” என்பதற்கான கிரேக்கச் சொற்றொடரை “முழுமையாக,” “முற்றிலும்,” அல்லது “முடிவுவரை” என்றும் மொழிபெயர்க்கலாம் (εἰς τέλος).
    reason: lexical_alternative
  - marker: b
    text: “சினம்” என்பது பெரும்பாலும் இறைவனின் தீர்ப்பைக் குறிக்கிறது. ஆனால் இங்கு பவுல் நிகழ்கால வரலாற்றுத் தீர்ப்பையா, இறுதித் தீர்ப்பையா, அல்லது இரண்டையுமா குறிக்கிறார் என்பதைத் தெளிவுபடுத்தவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: தடுத்து
  rationale: முந்தைய விவரிப்பைத் தொடரும் நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான தடுக்கும் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சட்டபூர்வத் தடை என்று மிகையாகக் குறிப்பிடவில்லை.
- source_word: τοῖς ἔθνεσιν
  choice: யூதரல்லாதவர்கள்
  rationale: இங்கு அரசியல் நாடுகள் அல்ல, யூதரல்லாத மக்களே குறிக்கப்படுகின்றனர்; நவீன வாசகர்களுக்கு உடனடியாகப் புரியும் சொற்றொடர்.
- source_word: λαλῆσαι
  choice: பேசுவதை
  rationale: κωλυόντων என்பதனைச் சார்ந்த வினையெச்சத்தின் நேரடியான பொருளைப் பேணுகிறது; நற்செய்தி அறிவிப்பது என்ற உள்ளடக்கத்தைச் சூழல் வழங்குகிறது.
- source_word: ἵνα σωθῶσιν
  choice: மீட்கப்படும்படி
  rationale: நோக்கத்தையும் செயப்பாட்டு வடிவத்தையும் பேணுகிறது; மீட்பின் செய்பவர் யார் என்பதை மொழிபெயர்ப்பு கூடுதலாக நிர்ணயிக்கவில்லை.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: இவ்வாறு ... நிரப்புகிறார்கள்
  rationale: இந்தக் கட்டமைப்பின் விளைவு அல்லது தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது; பாவங்களை நிரப்புவது அவர்களின் உணர்வுபூர்வமான நோக்கம் என்று கூறவில்லை.
- source_word: ἀναπληρῶσαι ... τὰς ἁμαρτίας
  choice: தங்கள் பாவங்களின் அளவை நிரப்புகிறார்கள்
  rationale: பாவங்கள் முழுமையை எட்டும் வேதாகம உருவகத்தைத் தமிழில் தெளிவாக்குகிறது; மூலத்தில் வெளிப்படையாக இல்லாத தீர்ப்பின் குறிப்பிட்ட அளவைச் சேர்க்கவில்லை.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ந்து காணப்படும் செயல் முறையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἔφθασεν ἐπ’ αὐτοὺς
  choice: அவர்கள்மேல் ... வந்தடைந்துவிட்டது
  rationale: சினம் அவர்களை வந்தடைந்த நிறைவுற்ற செயலையும் அதன் தற்போதைய விளைவையும் இயல்பான தமிழில் தருகிறது.
- source_word: ὀργή
  choice: சினம்
  rationale: தெய்வீகத் தீர்ப்பைக் குறிக்கக்கூடிய சொல்லின் கனத்த தன்மையைப் பேணுகிறது; ஆயினும் 'இறைவனின்' என்று மூலத்தில் இல்லாததை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: εἰς τέλος
  choice: கடைசியில்
  rationale: காலரீதியான உச்சநிலையை இயல்பான தமிழில் தருகிறது; 'முழுமையாக' அல்லது 'முடிவுவரை' என்ற சாத்தியங்களைக் குறிப்பில் பேணுகிறது.
theological_decisions:
- issue: ὀργή என்பதன் குறிப்பு மற்றும் காலம்
  choice: தெய்வீகச் சினம் அல்லது தீர்ப்பைக் குறிக்கக்கூடிய கனமான சொல்லாக விடப்பட்டுள்ளது; அது எந்த நிகழ்வு என்று வரையறுக்கப்படவில்லை.
  alternative: ஏற்கெனவே நிகழ்ந்த குறிப்பிட்ட வரலாற்றுத் தீர்ப்பு, வரவிருக்கும் இறுதித் தீர்ப்பு, அல்லது நிகழ்காலமும் எதிர்காலமும் இணைந்த தீர்ப்பு.
  rationale: சினம் வந்தடைந்ததாக உரை கூறினாலும், அது எந்தத் தீர்ப்பு என்பதைப் பவுல் இங்கு வெளிப்படையாகச் சொல்லவில்லை; அந்த இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: εἰς τὸ ἀναπληρῶσαι என்பதன் பொருள் வலிமை
  choice: முந்தைய தடுக்கும் செயலின் தொடர்ச்சி அல்லது விளைவாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: 'நோக்கம்: ''தங்கள் பாவங்களை நிரப்புவதற்காக''.'
  rationale: எதிர்ப்பாளர்கள் தங்கள் பாவங்களின் அளவை நிரப்புவதையே உணர்வுபூர்வமாக நோக்கமாகக் கொண்டனர் என்று உரைக்கு மேல் ஒரு கருத்தைச் சேர்ப்பதைத் தவிர்க்கிறது; கிரேக்கக் கட்டமைப்பின் தொடர்பையும் பேணுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; எளிதில் புரியக்கூடியதாயினும் கண்ணியமான நடை. வசனம் முந்தைய வாக்கியத்தைத் தொடரும் கிரேக்க அமைப்பை ஆரம்ப வினையெச்சத்தால் பேணுகிறது. 'புறவினத்தார்' என்பதற்குப் பதிலாக சாதாரண வாசகர்களுக்குத் தெளிவான 'யூதரல்லாதவர்கள்' பயன்படுத்தப்பட்டுள்ளது.
