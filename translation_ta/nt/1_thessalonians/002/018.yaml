source:
  edition: SBLGNT
  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: ta
  text: ஏனெனில், நாங்கள் உங்களிடம் வர விரும்பினோம்—நானாகிய பவுல், ஒருமுறைக்கு மேல் வர விரும்பினேன்[a]—ஆனால் சாத்தான் எங்களைத் தடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “ஒருமுறை, இருமுறை”; அதாவது, ஒன்றுக்கு மேற்பட்ட முறை.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἠθελήσαμεν
  choice: நாங்கள் ... வர விரும்பினோம்
  rationale: θέλω வெளிப்படுத்தும் விருப்பத்தையும் பன்மை எழுவாயையும் தெளிவாகக் காக்கிறது.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: உங்களிடம் வர
  rationale: தெசலோனிக்கேயர்களை நோக்கிய வருகையை நேரடியாகக் கூறுகிறது; ‘சந்திக்க’ அல்லது ‘திரும்பி வர’ என்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐγὼ μὲν Παῦλος
  choice: குறிப்பாக, பவுலாகிய நான்
  rationale: ‘நாங்கள்’ என்ற பன்மையிலிருந்து பவுலைத் தனிப்படுத்தும் μέν-இன் வலியுறுத்தலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: ஒன்றுக்கு மேற்பட்ட முறை
  rationale: ‘ஒருமுறையும் இருமுறையும்’ என்ற மூலமொழி வழக்கின் பொருளை குழப்பமின்றி வழங்குகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐνέκοψεν
  choice: தடுத்தான்
  rationale: பாதையில் குறுக்கிட்டு முயற்சியைத் தடைசெய்தல் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது; காரணியை மறைக்காமல் வைத்திருக்கிறது.
- source_word: ὁ Σατανᾶς
  choice: சாத்தான்
  rationale: புதிய ஏற்பாட்டுத் தமிழில் நிலைபெற்றுள்ள தனிப்பட்ட பெயர்/பட்டப்பெயரைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் பயணத்திற்குத் தடையாகச் சாத்தான் செயல்பட்டது
  choice: சாத்தான் எங்களைத் தடுத்தான்
  alternative: எதிராளி எங்களைத் தடுத்தான்
  rationale: மூலவசனம் தடையைச் சாத்தானின் தனிப்பட்ட செயலாக நேரடியாகக் கூறுகிறது. அதைச் சூழ்நிலை சார்ந்த பெயரற்ற தடையாக மென்மைப்படுத்தாமலும், மூலச்சொல்லைக் கடந்த முழுமையான தீர்மானவாதமாக வலுப்படுத்தாமலும் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடைக்கோடுகள், பன்மையான ‘நாங்கள்’ என்பதிலிருந்து பவுல் தன்னைத் தனிப்படுத்திக் கூறும் வலியுறுத்தலைக் காக்கின்றன.
