revisions:
- from: ஏனெனில், நாங்கள் உங்களிடம் வர விரும்பினோம்—குறிப்பாக, பவுலாகிய நான் ஒன்றுக்கு மேற்பட்ட முறை[a] வர விரும்பினேன்—ஆனால் சாத்தான் எங்களைத் தடுத்தான்.
  to: ஏனெனில், நாங்கள் உங்களிடம் வர விரும்பினோம்—நானாகிய பவுல், ஒருமுறைக்கு மேல் வர விரும்பினேன்[a]—ஆனால் சாத்தான் எங்களைத் தடுத்தான்.
  rationale: The revision removes the added sense of ‘particularly,’ explicitly and naturally marks Paul’s shift from the plural ‘we’ to the singular, and refines the literal footnote while preserving the source idiom’s meaning and the original punctuation structure.
