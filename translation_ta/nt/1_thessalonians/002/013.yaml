source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: ta
  text: 'இதனால்தான் நாங்களும் கடவுளுக்கு இடைவிடாமல் நன்றி செலுத்துகிறோம்: எங்களிடமிருந்து நீங்கள் கேட்ட கடவுளுடைய வார்த்தையைப் பெற்றுக்கொண்டபோது, அதை மனிதர்களுடைய வார்த்தையாக அல்ல, அது உண்மையில் இருப்பதுபோலவே கடவுளுடைய வார்த்தையாக ஏற்றுக்கொண்டீர்கள்[a]. அந்த வார்த்தை விசுவாசிக்கிற உங்களுக்குள் செயல்பட்டுக்கொண்டிருக்கிறது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எங்களிடமிருந்து நீங்கள் கேட்ட கடவுளுடைய செய்தியை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர் சுருக்கமாக அமைந்துள்ளதால், தமிழில் அதை ஒன்றுக்கு மேற்பட்ட இயல்பான முறைகளில் விரித்துக் கூற முடியும்.
    reason: lexical_alternative
  - marker: b
    text: 'தொடர்புப்பெயர் கடவுளைக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்: ‘விசுவாசிக்கிற உங்களுக்குள் செயல்படுகிற கடவுள்.’'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்தான்
  rationale: முந்தைய சூழலுடன் உள்ள காரணத் தொடர்பை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: εὐχαριστοῦμεν ... ἀδιαλείπτως
  choice: நாங்களும் கடவுளுக்கு இடைவிடாமல் நன்றி செலுத்துகிறோம்
  rationale: நிகழ்காலத் தொடர்ச்சியையும் ἀδιαλείπτως என்பதன் மீண்டும் மீண்டும் தொடரும் தன்மையையும் காக்கிறது.
- source_word: παραλαβόντες
  choice: பெற்றுக்கொண்டபோது
  rationale: ஒப்படைக்கப்பட்ட செய்தியை ஏற்றுப் பெற்ற செயலைத் தெரிவித்து, வாக்கியத் தொடர்பை தமிழில் இயல்பாக்குகிறது.
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: எங்களிடமிருந்து நீங்கள் கேட்ட கடவுளுடைய வார்த்தையை
  rationale: சுருக்கமான கிரேக்கத் தொடரை இயல்பான தமிழில் விரித்து, அப்போஸ்தலர்களிடமிருந்து கேட்கப்பட்ட செய்தி கடவுளுடைய வார்த்தை எனும் அடுத்துவரும் முரண்பாட்டைக் காக்கிறது.
- source_word: ἐδέξασθε
  choice: ஏற்றுக்கொண்டீர்கள்
  rationale: வெறுமனே கேட்டுப் பெற்றதைவிட மனப்பூர்வமாக அங்கீகரித்து ஏற்றுக்கொண்ட பொருளை வெளிப்படுத்துகிறது.
- source_word: οὐ λόγον ἀνθρώπων
  choice: மனிதர்களுடைய வார்த்தையாக அல்ல
  rationale: ἀνθρώπων என்பதன் பொதுவான மனிதக் குறிப்பை பாலினச் சாய்வின்றி அளித்து, கடவுளுடைய வார்த்தையுடனான எதிர்மறை ஒப்புமையைப் பாதுகாக்கிறது.
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν
  choice: அது உண்மையில் இருப்பதுபோலவே
  rationale: இடைச்செருகல் போன்ற வலியுறுத்தலைப் பாதுகாத்து, செய்தியின் உண்மையான இயல்பைத் தெளிவுபடுத்துகிறது.
- source_word: λόγον θεοῦ
  choice: கடவுளுடைய வார்த்தையாக
  rationale: λόγος என்பதைக் ‘வார்த்தை’ எனத் தொடர்ந்து மொழிபெயர்த்து, மனித வார்த்தை–கடவுளுடைய வார்த்தை என்ற சொல்லாட்சிசார் எதிர்மறையை காக்கிறது.
- source_word: ὃς
  choice: அந்த வார்த்தை
  rationale: அருகிலுள்ள இயல்பான முன்னிலையான λόγος என்பதைக் குறிப்பதாக முதன்மை வாசிப்பைத் தெளிவாக்குகிறது; கடவுளைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: ἐνεργεῖται
  choice: செயல்பட்டுக்கொண்டும் இருக்கிறது
  rationale: தொடர்ந்து நிகழும் ஆற்றல்மிக்க செயல்பாட்டை வெளிப்படுத்துகிறது; நடுநிலை/செயப்பாட்டு வடிவத்தின் நுணுக்கத்தை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: τοῖς πιστεύουσιν
  choice: விசுவாசிக்கிற உங்களுக்குள்
  rationale: நிகழ்காலப் பங்கேற்பெயரின் தொடரும் விசுவாசத் தன்மையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ὃς என்ற தொடர்புப்பெயரின் முன்னிலை
  choice: ‘அந்த வார்த்தை ... செயல்படுகிறது’ என்று கடவுளுடைய வார்த்தையைக் குறிக்கும் வாசிப்பு
  alternative: ‘விசுவாசிக்கிற உங்களுக்குள் செயல்படுகிற கடவுள்’ என்று கடவுளைக் குறிக்கும் வாசிப்பு
  rationale: ὃς என்பது ஆண்பால் ஒருமையான λόγος என்பதுடன் இலக்கணத்தில் பொருந்துவதோடு உடனடியாக அதைப் பின்தொடர்கிறது. θεός என்பதும் இலக்கண ரீதியாகச் சாத்தியமானதால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: அப்போஸ்தலப் பிரசங்கத்தில் ‘கடவுளுடைய வார்த்தை’ என்பதன் வலிமை
  choice: செய்தியை நேரடியாக ‘கடவுளுடைய வார்த்தை’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுளுடைய செய்தி’ என்ற தளர்வான மொழிபெயர்ப்பு
  rationale: மூலத்தில் மனிதர்களுடைய λόγος மற்றும் கடவுளுடைய λόγος நேரடியாக எதிரெதிராக வைக்கப்படுகின்றன. ‘வார்த்தை’ அந்தச் சொல்லாட்சியையும் இறையியல் நிறையையும் காக்கிறது; வசனம் கூறுவதைத் தாண்டிய கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. ‘கடவுள்’, ‘வார்த்தை’, ‘விசுவாசிக்கிற’ ஆகிய சொற்கள் உரையின் இறையியல் மற்றும் சொல்லாட்சிசார் தொடர்புகளை காக்கின்றன. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; பொருள் தொடர்பு மாறவில்லை.
