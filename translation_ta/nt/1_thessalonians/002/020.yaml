reference: 1 Thessalonians 2:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμεῖς γάρ ἐστε ἡ δόξα ἡμῶν καὶ ἡ χαρά.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/020.yaml
  text: For you are our glory and joy[a].
translation:
  language: ta
  text: ஏனெனில், நீங்களே எங்கள் மகிமையும்[a] மகிழ்ச்சியுமாக இருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெருமை’ அல்லது ‘மாண்பு’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: நீங்களே
  rationale: வலியுறுத்துவதற்காக வெளிப்படையாகக் கூறப்பட்டுள்ள இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல்லை, இயல்பான தமிழில் ‘நீங்களே’ என்று வழங்குவது அதன் அழுத்தத்தைத் தெளிவாகக் காக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐστε
  choice: இருக்கிறீர்கள்
  rationale: நிகழ்காலக் குறிப்பு வினையான ‘இருத்தல்’ என்பதற்கான இயல்பான மரியாதைப் பன்மைத் தமிழ் வடிவம்.
- source_word: δόξα
  choice: மகிமை
  rationale: ‘மகிமை’ என்பது கிரேக்கச் சொல்லின் புகழ், மாண்பு, பெருமை ஆகிய பொருள் பரப்பையும் அதன் வலுவான சொல்லாட்சியையும் காக்கிறது; இச்சூழலில் தெசலோனிக்கேயர்கள் தூதர்களுக்கு மாண்பளிப்பவர்களாகவும் அவர்கள் பெருமிதம் கொள்ளும் காரணமாகவும் இருப்பதை இது வெளிப்படுத்துகிறது.
- source_word: ἡμῶν
  choice: எங்கள்
  rationale: முதலாம் நபர் பன்மை உடைமைப் பொருளை இயல்பாகக் குறிக்கிறது.
- source_word: χαρά
  choice: மகிழ்ச்சி
  rationale: χαρά குறிக்கும் மகிழ்வை நேரடியான, தற்போதைய பொதுத் தமிழில் வழங்குகிறது; செயலைக் குறிக்கும் சொல்லாக மாற்றாமல் பெயர்ச்சொல் தன்மையைக் காக்கிறது.
theological_decisions:
- issue: மனிதர்களைப் பற்றிய பவுலின் கூற்றில் δόξα என்பதன் மொழிபெயர்ப்பு
  choice: மகிமை
  alternative: பெருமை; மாண்பு
  rationale: இது ஒரு தொழில்நுட்பக் கோட்பாட்டுக் கூற்று அல்ல; தெசலோனிக்கேயர்கள் பவுலுக்கும் அவருடைய உடன் ஊழியர்களுக்கும் மகிமை மற்றும் மகிழ்ச்சியாக இருப்பதை உரைக்கிறது. ‘மகிமை’ மூலச்சொல்லின் பொருள் பரப்பையும் சொல்லாட்சியின் வலிமையையும் காக்கிறது; ‘பெருமை’ என்று மட்டும் மொழிபெயர்த்து சுயபாராட்டாகக் குறுக்கிவிடுவதில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை. ‘நீங்களே’ மூலத்தில் வெளிப்படையாக உள்ள வலியுறுத்தலைக் காக்கிறது; ‘மகிமையும் மகிழ்ச்சியுமாக’ என்ற இணை அமைப்பு கிரேக்க வாக்கியத்தின் சமநிலையையும் சுருக்கத்தையும் பேணுகிறது.
