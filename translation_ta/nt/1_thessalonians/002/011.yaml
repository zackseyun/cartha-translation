translation:
  language: ta
  text: நீங்கள் அறிந்திருக்கிறபடியே, ஒரு தகப்பன் தன் சொந்தப் பிள்ளைகளிடம் நடந்துகொள்வதுபோல், உங்கள் ஒவ்வொருவரிடமும் நாங்கள் நடந்துகொண்டோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான வடிவில்: “நீங்கள் அறிந்திருக்கிறபடியே, உங்கள் ஒவ்வொருவரையும், ஒரு தகப்பன் தன் சொந்தப் பிள்ளைகளைப் போல …” கிரேக்கத் தொடர் வினைச்சொல் விடுபட்ட அமைப்பில் உள்ளது; அதன் முழுப் பொருள் சுற்றியுள்ள வாக்கியத்திலிருந்து கிடைக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: தெரிந்தபடியே
  rationale: ஒப்பீட்டையும் தெசலோனிக்கேயரின் நேரடி அறிவுக்கான முறையீட்டையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: οἴδατε
  choice: உங்களுக்குத் தெரியும்
  rationale: வடிவில் நிறைவுக்காலமாக இருந்தாலும், இங்கு நிகழ்காலப் பொருளான ‘அறிந்திருக்கிறீர்கள்/தெரியும்’ என்பதே பொருத்தமானது.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: உங்கள் ஒவ்வொருவரையும்
  rationale: ஒவ்வொரு நபருக்கும் தனித்தனியாகக் காட்டப்பட்ட அக்கறையை வலியுறுத்தும் பகிர்வுப் பொருளைப் பாதுகாக்கிறது.
- source_word: ὡς πατὴρ
  choice: ஒரு தகப்பன் ... போல
  rationale: பெயர்ச்சொல்லின் பண்புசார் ஒப்பீட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τέκνα
  choice: பிள்ளைகளை
  rationale: பாலினத்தைக் குறிப்பாக வரையறுக்காத பரந்த குடும்ப உறவுச் சொல்லாக τέκνα என்பதைக் காட்டுகிறது.
- source_word: ἑαυτοῦ
  choice: தன் சொந்தப்
  rationale: பொதுவாகப் பிள்ளைகள் அல்ல, தகப்பனுடைய சொந்தப் பிள்ளைகள் என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: '[elliptical verbal idea from context]'
  choice: நாங்கள் நடத்தினோம்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள வினைச்செயலைச் சூழலிலிருந்து நிரப்புகிறது; அடுத்தடுத்த ஊக்குவித்தல், தேற்றுதல், வலியுறுத்துதல் ஆகியவற்றில் ஒன்றை மட்டும் முன்கூட்டியே தேர்ந்தெடுக்காமல் பரந்த பொருளைத் தருகிறது.
theological_decisions:
- issue: விடுபட்ட வினைச்செயலை நிரப்புதல்
  choice: ‘உங்கள் ஒவ்வொருவரையும் நாங்கள் நடத்தினோம்’ என்ற பரந்த வினைத்தொடரைப் பயன்படுத்துதல்
  alternative: துண்டான இலக்கண அமைப்பை அப்படியே விடுதல், அல்லது ‘அறிவுறுத்தினோம்’ போன்ற குறுகிய வினையை நிரப்புதல்
  rationale: மூலக் கிரேக்கத் தொடர் சூழலைச் சார்ந்த நீள்விடுபாடு கொண்டது. தமிழில் பொருள் தெளிவதற்காகப் பரந்த வினை தேவை; இது சுற்றியுள்ள பல்வேறு மேய்ப்புப் பணிகளை ஒன்றாகச் சுருக்கி, எந்த ஒரு செயலை மட்டும் இறுதியானதாக ஆக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தகப்பன்’ குடும்ப ஒப்புமையின் உயர்ந்த வேதாகமத் தொனியைத் தக்கவைக்கிறது; ‘பிள்ளைகள்’ பாலின வேறுபாடின்றி τέκνα என்பதைக் காட்டுகிறது. அடிக்குறி குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
