  to: ஏனெனில், எங்கள் வேண்டுகோள்[a] தவறிலிருந்தோ[b] அசுத்தத்திலிருந்தோ தோன்றியதல்ல; வஞ்சகத்தோடும் அல்ல.
  rationale: The revision retains the draft’s sound lexical choices while replacing the added and awkward ‘செய்யப்பட்டதும் அல்ல’ with an elliptical Tamil clause. This reflects the Greek sequence of two source denials (ἐκ/ἐξ) followed by a denial of deceitful manner (ἐν), without overspecifying how the appeal was made.
