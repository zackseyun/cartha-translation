  text: ἡ γὰρ παράκλησις ἡμῶν οὐκ ἐκ πλάνης οὐδὲ ἐξ ἀκαθαρσίας ⸀οὐδὲ ἐν δόλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/003.yaml
  text: For our appeal does not come from error or impurity or deceit[b][a],
translation:
  language: ta
  text: ஏனெனில், எங்கள் வேண்டுகோள்[a] தவறிலிருந்தோ[b] அசுத்தத்திலிருந்தோ தோன்றியதல்ல; வஞ்சகத்தோடும் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அறிவுரை” அல்லது “ஊக்கவுரை.” கிரேக்கச் சொல் சூழலுக்கேற்ப வேண்டுகோள், அறிவுரை, ஊக்குவிப்பு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வழிதவறுதலிலிருந்தோ” அல்லது “ஏமாற்றத்திலிருந்தோ.” இவ்வசனத்தின் இறுதியில் வரும் “வஞ்சகம்” திட்டமிட்ட சூழ்ச்சியை இன்னும் நேரடியாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλησις
  choice: வேண்டுகோள்
  rationale: இச்சூழலில் கேட்போரிடம் முன்வைக்கப்படும் மனமார்ந்த அழைப்பு அல்லது அறிவுறுத்தலைக் குறிக்கிறது. ஆறுதல் என்ற குறுகிய பொருளைத் தவிர்த்து, வேண்டுகோள் என்ற சொல் சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: πλάνης
  choice: தவறு
  rationale: ἐκ என்பதுடன் இது வேண்டுகோளின் மூலத்தைச் சுட்டுகிறது. அடுத்துவரும் δόλος திட்டமிட்ட வஞ்சகத்தைத் தெளிவாகக் குறிப்பதால், πλάνη என்பதற்கு தவறு என்று மொழிபெயர்ப்பது இரண்டிற்குமுள்ள வேறுபாட்டைக் காக்கிறது.
- source_word: ἀκαθαρσίας
  choice: அசுத்தம்
  rationale: ஒழுக்கக் களங்கத்தைக் குறிக்கும் பரந்த சொல்லாக இதை வைத்திருக்கிறது; மூலவசனம் குறிப்பிடாத பாலியல் சார்ந்த குறுகிய பொருளைச் சேர்ப்பதில்லை.
- source_word: δόλῳ
  choice: வஞ்சகம்
  rationale: திட்டமிட்ட ஏமாற்றத்தையும் சூழ்ச்சியையும் குறிக்கும் தெளிவான, நவீனத் தமிழ்ச் சொல்.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: …இலிருந்தோ …இலிருந்தோ; …தோடு
  rationale: ἐκ/ἐξ குறிக்கும் மூலம் அல்லது தோற்றத்தையும், ἐν குறிக்கும் செயல்முறையையும் வேறுபடுத்திக் காட்டுகிறது. இயல்பான தமிழுக்காக பிறந்ததல்ல மற்றும் செய்யப்பட்டதும் அல்ல என்ற வினைச்சொற்கள் நிரப்பப்பட்டுள்ளன.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை இவ்வசனம் தருகிறது என்பதைத் தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: ἀκαθαρσία என்பதன் பொருள் வரம்பு
  choice: அசுத்தம் என்று பரந்த வகையில் மொழிபெயர்த்தல்
  alternative: பாலியல் அசுத்தம்
  rationale: இந்தச் சொல் சில சூழல்களில் பாலியல் ஒழுக்கக்கேட்டைக் குறிக்கக்கூடும். ஆனால் இவ்வசனம் அதைக் குறிப்பாக வரையறுக்காததால், மூலமொழியின் பரந்த பொருள் காக்கப்படுகிறது.
- issue: πλάνη மற்றும் δόλος இடையேயான வேறுபாடு
  choice: தவறு மற்றும் வஞ்சகம் என்று வேறுபடுத்தல்
  alternative: இரண்டையும் ஏமாற்றம் சார்ந்த சொற்களால் மொழிபெயர்த்தல்
  rationale: πλάνη பொய்மை, தவறான நம்பிக்கை அல்லது வழிதவறுதலைக் குறிக்கலாம்; δόλος திட்டமிட்ட சூழ்ச்சியை இன்னும் நேரடியாகக் குறிக்கிறது. இரு சொற்களையும் ஒன்றாக்காமல் உரையின் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் மரியாதையான வேதாகம நடையிலும் அமைக்கப்பட்டுள்ளது. மூலத்திலுள்ள இரண்டு ἐκ/ἐξ தொடர்களின் மூலப்பொருளும் இறுதி ἐν தொடரின் செயல்முறைப் பொருளும் இயல்பான தமிழில் வேறுபடுத்தப்பட்டுள்ளன.
