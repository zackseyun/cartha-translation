source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: ta
  text: ஆனால், உங்களுக்குத் தெரிந்தபடி, பிலிப்பியில் நாங்கள் முன்பே துன்பப்பட்டு இழிவாக நடத்தப்பட்ட பின்பு[a], மிகுந்த போராட்டத்தின் நடுவில்[b] கடவுளுடைய நற்செய்தியை உங்களிடம் பேசுவதற்கு எங்கள் கடவுளில் துணிவுகொண்டோம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவமதிக்கப்பட்டு,” “அவமானகரமாக நடத்தப்பட்டு,” அல்லது “கொடுமையாக நடத்தப்பட்டு.” கிரேக்க வினை செருக்குடன் இழிவுபடுத்தி, பொதுவில் அவமானத்துக்குள்ளாக்கும் விதத்தில் நடத்தப்பட்டதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மிகுந்த மோதலின் நடுவில்,” “கடும் எதிர்ப்புகளுக்கு மத்தியில்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எங்கள் கடவுளில் துணிவுடன் பேசினோம்.” கிரேக்க வினையே துணிவுடன் பேசுதல் என்ற கருத்தை உள்ளடக்கலாம்; அதைத் தொடர்ந்து “பேசுவதற்கு” என்ற வினைமுற்றா வடிவம் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள வலுவான முரண்பாட்டை இயல்பான தமிழில் குறிக்கிறது.
- source_word: προπαθόντες
  choice: ஏற்கெனவே துன்பப்பட்டு
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த துன்பத்தையும் προ- முன்னொட்டின் முந்திய அனுபவ உணர்வையும் வெளிப்படுத்துகிறது.
- source_word: ὑβρισθέντες
  choice: அவமானமாக நடத்தப்பட்ட
  rationale: வெறும் வாய்மொழி இகழ்ச்சியைக் காட்டிலும், செருக்குடன் இழிவுபடுத்தி முறைகேடாக நடத்தப்பட்டதையும் உள்ளடக்கும் வினையின் பொருளைத் தருகிறது.
- source_word: καθὼς οἴδατε
  choice: உங்களுக்குத் தெரிந்தபடி
  rationale: தெசலோனிக்கேயரின் அறிவை நேரடியாகச் சுட்டும் இயல்பான இடைச்செருகல்.
- source_word: ἐν Φιλίπποις
  choice: பிலிப்பியில்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்புடன் இடவேற்றுமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπαρρησιασάμεθα
  choice: துணிவுகொண்டோம்
  rationale: வெளிப்படையாகவும் அஞ்சாமலும் பேசும் துணிவைக் குறிக்கிறது; தொடர்ந்து வரும் λαλῆσαι என்பதுடன் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: எங்கள் கடவுளில்
  rationale: துணிவு கடவுளோடுள்ள உறவின் வட்டத்திலோ அடிப்படையிலோ இருந்தது என்ற கிரேக்கத்தின் திறந்த பொருளைச் சுருக்காமல் காக்கிறது.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: உங்களிடம் பேசுவதற்கு
  rationale: λαλέω என்பதன் எளிய பேசுதல் பொருளையும் πρὸς ὑμᾶς என்பதன் முகவரியையும் இயல்பாகத் தருகிறது.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: கடவுளுடைய நற்செய்தி
  rationale: θεοῦ என்பதன் உடைமை அல்லது மூலத் தொடர்பைத் திறந்தவாறே வைத்துக்கொண்டு, சாதாரண வாசகருக்குப் புரியும் தற்போதைய தமிழைப் பயன்படுத்துகிறது.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: மிகுந்த போராட்டத்தின் நடுவில்
  rationale: ἀγών என்பதில் உள்ள போராட்டம், எதிர்ப்பு, கடுமையான முயற்சி ஆகிய பொருள் பரப்பை மிகையாகக் குறுக்காமல் சூழ்நிலையாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐν τῷ θεῷ ἡμῶν என்பதன் வலிமை
  choice: எங்கள் கடவுளில்
  alternative: எங்கள் கடவுளால்; எங்கள் கடவுள்மீது நம்பிக்கை கொண்டு
  rationale: கடவுளைச் செயலின் கருவியாக மட்டும் மாற்றாமல், அப்போஸ்தலரின் துணிவு கடவுளோடுள்ள உறவின் வட்டத்திலும் அடிப்படையிலும் இருந்தது என்ற திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: τοῦ θεοῦ என்ற属格த் தொடர்பு
  choice: கடவுளுடைய நற்செய்தி
  alternative: கடவுளிடமிருந்து வந்த நற்செய்தி; கடவுளைப் பற்றிய நற்செய்தி
  rationale: இந்த属格த்தை மூலம் அல்லது உள்ளடக்கம் என்று மட்டும் தீர்மானிக்காமல் கிரேக்க வடிவின் விரிந்த தொடர்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சுவிசேஷம்’ என்பதற்குப் பதில் வெளிப்படையான ‘நற்செய்தி’ தேர்ந்தெடுக்கப்பட்டது. ‘எங்கள் கடவுளில்’ சற்றே முறையானதாக இருந்தாலும், கிரேக்கத்தின் உறவு/வட்டப் பொருளை விளக்கவுரையால் குறுக்காமல் பாதுகாக்கிறது.
