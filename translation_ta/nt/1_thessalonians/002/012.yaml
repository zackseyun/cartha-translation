translation:
  language: ta
  text: உங்களை ஊக்கப்படுத்தியும், ஆறுதல் கூறியும், வலியுறுத்தியும், கடவுளுக்கு ஏற்ற விதத்தில் நீங்கள் நடந்துகொள்ளும்படி—அவர் உங்களைத் தமது அரசாட்சிக்கும் மகிமைக்கும் அழைக்கிறார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நடந்துகொள்ளுதல்’ என்பது ஒருவரின் வாழ்க்கை முறையைக் குறிக்கும் வேதாகம உருவகம்; ‘வாழும்படி’ அல்லது ‘வாழ்க்கை நடத்தும்படி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த மூன்று சொற்களையும் ‘அறிவுறுத்தியும், தேற்றியும், ஆணித்தரமாக அறிவுறுத்தியும்’ என்றும் மொழிபெயர்க்கலாம். அவை பவுலின் தந்தைக்குரிய பணியில் ஒன்றோடொன்று தொடர்புடைய ஊக்கம், ஆறுதல், தீவிரமான வேண்டுகோள் ஆகிய நுண்ணிய பொருள்களைத் தருகின்றன.
    reason: lexical_alternative
