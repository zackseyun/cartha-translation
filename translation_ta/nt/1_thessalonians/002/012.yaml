  rationale: கனிவாகப் பேசி தேற்றும் பொருளை வெளிப்படுத்தி, முதல் வினையிலிருந்து அதன் நுண்ணிய வேறுபாட்டைக் காக்கிறது.
- source_word: μαρτυρόμενοι
  choice: வலியுறுத்தியும்
  rationale: இங்கு வெறுமனே சாட்சியிடுதல் அல்லாமல், ஆணித்தரமாக வேண்டிக்கொள்ளுதல் அல்லது வற்புறுத்துதல் என்ற சூழல்சார் வலிமையைத் தருகிறது.
- source_word: εἰς τὸ περιπατεῖν
  choice: நீங்கள் நடந்துகொள்ளும்படி
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் கிரேக்கக் கட்டமைப்பையும், ‘நடத்தல்’ என்ற வாழ்க்கைமுறை உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἀξίως τοῦ θεοῦ
  choice: கடவுளுக்கு ஏற்ற விதத்தில்
  rationale: ஒருவரே கடவுளுக்குத் தகுதியானவர் என்ற தவறான பொருளைத் தவிர்த்து, வாழ்க்கை நடத்தும் விதமே கடவுளுக்கு ஏற்றதாக இருக்க வேண்டும் என்ற வினையடைப் பொருளைத் தெளிவாக்குகிறது.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: உங்களை அழைக்கிற
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் அம்சத்தை இயல்பான நிகழ்கால உறவுக்கூற்றாகக் காக்கிறது.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: தமது அரசாட்சிக்கும் மகிமைக்கும்
  rationale: ஒரே முன்னிடைச்சொல் இரு பெயர்களையும் ஆளுவதைப் பாதுகாத்து, ἑαυτοῦ என்பதன் தற்சுட்டுப் பொருளை ‘தமது’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: περιπατεῖν என்ற ‘நடத்தல்’ உருவகத்தை எவ்வாறு வழங்குவது
  choice: ‘நடந்துகொள்ளும்படி’ என உருவகத்தைத் தமிழில் இயல்பாகத் தக்கவைத்தல்
  alternative: ‘வாழும்படி’ அல்லது ‘வாழ்க்கை நடத்தும்படி’
  rationale: இது வேதாகமத்தின் நெறிவாழ்க்கை உருவகத்துடன் தொடர்பைக் காக்கிறது; அதேவேளை தமிழில் உடல் நடையை மட்டும் குறிக்காமல் நடத்தை என்ற பொருளையும் இயல்பாகத் தருகிறது.
- issue: τοῦ καλοῦντος என்பதில் கடவுளின் அழைப்பின் கால அம்சம்
  choice: ‘அழைக்கிற’ என்ற நிகழ்காலம்
  alternative: ‘அழைத்த’ அல்லது ‘அழைத்துக்கொண்டிருக்கிற’
  rationale: கிரேக்க நிகழ்காலப் பங்கேற்புவினையைப் பாதுகாக்கிறது; அழைப்பின் நேரம் அல்லது செயல்முறை குறித்த குறிப்பிட்ட கோட்பாட்டை உரைக்குள் சேர்ப்பதில்லை.
- issue: βασιλεία என்பதன் மொழிபெயர்ப்பு
  choice: ‘அரசாட்சி’
  alternative: ‘ராஜ்யம்’
  rationale: இச்சொல் ஆளுகையையும் ஆட்சித் தளத்தையும் உள்ளடக்கக்கூடியதால், அதன் பொருள் விரிவை நவீனத் தமிழில் இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் மூன்று பங்கேற்புவினைகள் தமிழில் வினையெச்சங்களாக அமைக்கப்பட்டுள்ளன; தனி வசனமாக வாசிக்கும்போது வாக்கியம் நிறைவடைய ‘செய்தோம்’ சேர்க்கப்பட்டுள்ளது. ‘தமது’ என்பது கடவுளைக் குறிக்கும் ἑαυτοῦ என்பதன் தற்சுட்டு வலியுறுத்தலை அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
