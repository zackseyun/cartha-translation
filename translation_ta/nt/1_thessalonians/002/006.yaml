  text: οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: ta
  text: மனிதர்களிடமிருந்து கௌரவத்தை நாடவும் இல்லை; உங்களிடமிருந்தோ மற்றவர்களிடமிருந்தோ அதை நாடவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: நாடுகிறவர்களாக
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான செயற்பொருளைத் தக்கவைக்கிறது; முந்திய சூழலில் உள்ள மறைமுக எழுவாயான ‘நாங்கள்’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: ἐξ ἀνθρώπων
  choice: மனிதர்களிடமிருந்து
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிக்கிறது; ‘மனிதர்களிடமிருந்து’ என்பது மூலத்தின் பொதுவான மனிதக் குறிப்பைத் தெளிவாக வழங்குகிறது.
- source_word: δόξαν
  choice: மகிமையை
  rationale: δόξα என்பதன் புதிய ஏற்பாட்டு சொல் தொடர்பைத் தக்கவைக்கிறது; இச்சூழலில் அது மனிதர்களிடமிருந்து வரும் கௌரவம் அல்லது பாராட்டைக் குறிக்கிறது, இதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: '...வும் ... இல்லை—...ஓ ...ஓ ... இல்லை'
  rationale: மூன்று எதிர்மறைக் கூறுகளையும் தமிழில் இயல்பான தொடர்புடன் காட்டுகிறது; முதல் οὔτε முந்திய வசனத்துடன் இணைவதையும், பின்வரும் இரு மூலங்களின் இணைப்பையும் தக்கவைக்கிறது.
- source_word: ἀφ’ ὑμῶν
  choice: உங்களிடமிருந்தோ
  rationale: தெசலோனிக்கேய விசுவாசிகளை நோக்கிய நேரடியான இரண்டாம் நபர் பன்மைக் குறிப்பைத் துல்லியமாக வழங்குகிறது.
- source_word: ἀπ’ ἄλλων
  choice: மற்றவர்களிடமிருந்தோ
  rationale: தெசலோனிக்கேயர்களைத் தவிர பிற மனிதர்களைக் குறிக்கும் ἄλλων என்பதைக் குறுகிய, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: நாடப்பட்ட δόξα என்பதன் தன்மை
  choice: மனிதர்களிடமிருந்து வரும் மகிமை அல்லது புகழ்
  alternative: மனித கௌரவம்; மனித பாராட்டு
  rationale: ἐξ ἀνθρώπων என்பது இதைத் தேவனுடைய மகிமையல்ல, மனிதர்களின் அங்கீகாரம் என்று தெளிவுபடுத்துகிறது. ‘மகிமை’ மூலச்சொல் தொடர்பைக் காக்கிறது; சாத்தியமான சூழல்சார் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. வசனம் முந்திய வாக்கியத்துடன் இலக்கண ரீதியாக இணைவதால் ‘நாங்கள் இருக்கவில்லை’ என எழுவாயும் வினையும் வெளிப்படுத்தப்பட்டுள்ளன; இறுதியில் ‘அதை நாடவில்லை’ என்பது தமிழில் பொருளை இயல்பாக நிறைவு செய்கிறது.
