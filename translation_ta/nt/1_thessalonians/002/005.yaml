source:
  edition: SBLGNT
  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: ta
  text: ஏனெனில், நாங்கள் ஒருபோதும் முகஸ்துதிப் பேச்சுடன் வந்ததில்லை[a]—உங்களுக்குத் தெரியும்—பேராசையை மறைக்கும் பாசாங்குடனும் வந்ததில்லை[b]. கடவுள் சாட்சி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முகஸ்துதியுடன்’; சொல்லர்த்தமாக, ‘முகஸ்துதியின் பேச்சில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பேராசைக்கான சாக்குப்போக்குடனும்’ அல்லது ‘பேராசையை மறைக்கும் போர்வையுடனும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: ஏனெனில், நாங்கள் ஒருபோதும் ... வந்ததில்லை
  rationale: γάρ முந்தைய வாதத்துடன் காரணத் தொடர்பை ஏற்படுத்துவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது. οὔτε ... ποτε என்பதின் வலியுறுத்தப்பட்ட கால மறுப்பு இயல்பான தமிழில் ‘ஒருபோதும் ... இல்லை’ எனத் தரப்படுகிறது.
- source_word: ἐν λόγῳ κολακείας
  choice: முகஸ்துதியான பேச்சுடன்
  rationale: λόγος இங்கு தனியொரு சொல்லை அல்ல, பேசும் முறையைக் குறிக்கிறது; κολακεία நேர்மையற்ற புகழ்ச்சியாகிய முகஸ்துதியைக் குறிக்கிறது. ἐν என்பதின் உடனிகழ்வு அல்லது முறை சார்ந்த பொருளை ‘-உடன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐγενήθημεν
  choice: வந்ததில்லை
  rationale: γίνομαι என்பதன் அடிப்படைப் பொருள் ‘ஆதல்’ என்றாலும், இச்சூழலில் தெசலோனிக்கேயரிடையே அவர்கள் எவ்வாறு வந்தார்கள் அல்லது தங்களை வெளிப்படுத்தினார்கள் என்பதைக் குறிக்கிறது. வருகைச் சூழலுக்கேற்ற இயல்பான தமிழாக ‘வந்ததில்லை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: καθὼς οἴδατε
  choice: உங்களுக்குத் தெரியும்
  rationale: வாசகர்களின் நேரடி அறிவைச் சான்றாக அழைக்கும் எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: ἐν προφάσει πλεονεξίας
  choice: பேராசையை மறைக்கும் பாசாங்குடன்
  rationale: πρόφασις என்பது சாக்கு, வெளித்தோற்றம் அல்லது உண்மையான நோக்கத்தை மறைக்கும் பாசாங்கைக் குறிக்கலாம். πλεονεξία பிறரிடமிருந்து மேலும் பெற விழையும் பேராசை. இவ்விரண்டின் தொடர்பைத் தெளிவான நவீன தமிழில் இத்தொடர் வெளிப்படுத்துகிறது.
- source_word: θεὸς μάρτυς
  choice: கடவுளே சாட்சி
  rationale: கடவுளை ஆணித்தரமான சாட்சியாக அழைக்கும் சுருக்கமான வாக்கியம். கிரேக்கத்தில் உடைமைச் சுட்டுப்பெயர் இல்லாததால் ‘எங்கள் சாட்சி’ என்று சேர்க்கப்படவில்லை; ‘-ஏ’ வலியுறுத்தலை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: பவுல் மறுக்கும் செயல்முறையும் உள்நோக்கமும்
  choice: பேச்சில் முகஸ்துதியையும், பாசாங்கின் பின்னால் மறைந்த பேராசையையும் வசனம் மறுக்கிறது.
  alternative: அனைத்து பேச்சுத் திறனையும் வசனம் கண்டிக்கிறது என்றோ, பணச் சுரண்டலை மட்டுமே குறிப்பிடுகிறது என்றோ விரிவுபடுத்துதல்.
  rationale: கிரேக்கம் குறிப்பாக κολακεία மற்றும் πλεονεξία ஆகியவற்றையே பெயரிடுகிறது. ஆகவே உரை எல்லா சொல்வன்மையையும் மறுப்பதாகவோ, பேராசையின் பொருளை பணத்திற்கு மட்டுமே குறுக்குவதாகவோ மொழிபெயர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘முகஸ்துதி’, ‘பாசாங்கு’, ‘பேராசை’ ஆகிய சொற்கள் மூலத்தின் ஒழுக்கநெறி சார்ந்த குற்றச்சாட்டுகளைத் தெளிவாக வைத்திருக்கின்றன. இடைக்கோடுகள் ‘உங்களுக்குத் தெரியும்’ என்ற சான்றழைப்பை முதன்மை மறுப்பு வாக்கியத்திலிருந்து தெளிவாகப் பிரிக்கின்றன.
