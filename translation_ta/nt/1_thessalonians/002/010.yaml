source:
  edition: SBLGNT
  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: ta
  text: 'நீங்கள் சாட்சிகள்; கடவுளும் சாட்சி: நம்புகிறவர்களாகிய உங்களிடம் நாங்கள் எவ்வாறு இறைப்பக்தியுடனும் நீதியுடனும் குற்றஞ்சாட்ட முடியாதவாறும் நடந்துகொண்டோம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: நீங்களும் சாட்சிகள்; கடவுளும் சாட்சி
  rationale: தெசலோனிக்கேயரை முதலில் நேரடியாகச் சாட்சிகளாக அழைத்து, பின்னர் கடவுளையும் சாட்சியாகக் குறிப்பிடும் கிரேக்கச் சொல்லமைப்பின் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: ὡς
  choice: எவ்வளவு
  rationale: தூதர்களின் நடத்தை எப்படிப்பட்டிருந்தது என்பதை வலியுறுத்தும் விதத்தில் அறிமுகப்படுத்துகிறது; தமிழில் சாட்சிக்கான வேண்டுகோளுடன் இயல்பாக இணைகிறது.
- source_word: ὁσίως
  choice: இறைப்பற்றுடன்
  rationale: கடவுளுக்கு முன்பான பக்தியும் அவருக்கேற்ற நடத்தையும் குறிக்கும் சொல்; வெறும் சடங்காசாரத்தையோ முழுமையான பாவமின்மையையோ உணர்த்தாமல், நவீன வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: δικαίως
  choice: நீதியுடன்
  rationale: ஒழுக்க ரீதியாகச் சரியான, நேர்மையான நடத்தையைக் குறிக்கிறது; சுற்றியுள்ள இரு வினையடைகளுடனும் இயல்பாக இணைகிறது.
- source_word: ἀμέμπτως
  choice: குற்றஞ்சாட்ட இடமில்லாமல்
  rationale: நியாயமான பழிக்கு இடங்கொடுக்காத நடத்தையைத் தெரிவிக்கிறது; பாவமே இல்லாத முழுநிறைவு என்ற கருத்தைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: ὑμῖν
  choice: உங்களிடம்
  rationale: அவர்களுடன் தொடர்புடைய விதத்தில் வெளிப்பட்ட நடத்தையைத் தமிழில் இயல்பாகக் குறிக்கிறது; ‘உங்கள் நடுவில்’ என்பதும் சூழலில் சாத்தியம்.
- source_word: τοῖς πιστεύουσιν
  choice: நம்புகிறவர்களாகிய
  rationale: நிகழ்காலப் பெயரெச்சத்தின் வினைத்தன்மையைத் தக்கவைத்து, இங்கு குறிப்பிடப்படுவோர் தெசலோனிக்கேய விசுவாசிகளே என்பதைத் தெளிவாக்குகிறது.
- source_word: ἐγενήθημεν
  choice: நடந்துகொண்டோம்
  rationale: மூன்று முறைவிளக்கச் சொற்களுடன் γίνομαι இங்கு அவர்களின் வாழ்க்கை நடத்தையைக் குறிப்பதால், சொற்சொல் ‘இருந்தோம்’ என்பதைவிடச் சூழலின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தூதர்களின் நடத்தையை விவரிக்கும் மூன்று ஒழுக்கப் பண்புகள்
  choice: அவர்கள் கடவுளுக்கும் விசுவாசிகளுக்கும் முன்பாக உண்மையில் எவ்வாறு நடந்துகொண்டார்கள் என்பதற்கான வலிமையான சாட்சிக் கூற்றாக மொழிபெயர்க்கப்பட்டது; ‘குற்றஞ்சாட்ட இடமில்லாமல்’ என்பது பழிக்குரிய ஆதாரம் இல்லாத நடத்தையைக் குறிக்கிறது.
  alternative: இதை வெறும் தற்காப்பு மொழியாகக் கொள்ளுதல், அல்லது முழுமையான பாவமின்மைக்கான கூற்றாகப் புரிந்துகொள்ளுதல்.
  rationale: மூலவசனம் மனித சாட்சிகளையும் கடவுளையும் அழைத்து அவர்களின் நடத்தையின் நேர்மையை உறுதிப்படுத்துகிறது. ஆனால் அது தத்துவார்த்தமான பாவமின்மையை வெளிப்படையாகக் கூறுவதில்லை; எனவே அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் மூன்று இணையான ஒழுக்க விளக்கங்களும் சாட்சிக்கான வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
