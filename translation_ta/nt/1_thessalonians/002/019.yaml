reference: 1 Thessalonians 2:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: ta
  text: ஏனெனில், எது எங்கள் நம்பிக்கை, மகிழ்ச்சி, அல்லது பெருமைப்படுதலின் கிரீடம்? நம்முடைய ஆண்டவர் இயேசுவின் வருகையின்போது அவருக்கு முன்பாக நீங்களும்தானே?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரது முன்னிலையில்’ அல்லது ‘அவர் வந்துசேரும்போது.’ παρουσίᾳ என்ற கிரேக்கச் சொல் பிரசன்னத்தையோ வந்தடைதலையோ குறிக்கலாம்; இச்சூழலில் அது ஆண்டவர் இயேசுவின் எதிர்கால வருகையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: யார்
  rationale: தொடர்ந்து வரும் ‘நீங்கள்’ மனிதர்களைக் குறிப்பதால், தமிழில் ‘யார்?’ என்பது இயல்பாகவும் கிரேக்கத்தின் இருபொருள் வாய்ப்பைச் சூழலுக்கேற்றவாறும் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துடன் உள்ள விளக்கத் தொடர்பை விடாமல் காக்கிறது.
- source_word: ἐλπὶς
  choice: நம்பிக்கை
  rationale: எதிர்நோக்கும் உறுதியைக் குறிக்கும் பவுலின் வழக்கமான சொல்லுக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: χαρὰ
  choice: மகிழ்ச்சி
  rationale: உணர்ச்சிசார் வலிமையை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: στέφανος καυχήσεως
  choice: பெருமைப்படுவதற்கான கிரீடம்
  rationale: στέφανος என்பதன் கௌரவம் அல்லது வெற்றியைக் குறிக்கும் கிரீட உருவகத்தையும், καύχησις என்பதன் பெருமைப்படுதல் சார்ந்த பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: நீங்களும்தானே?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் வினாவின் வலியுறுத்தலையும் καί என்பதன் ‘உம்/கூட’ நுணுக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἔμπροσθεν
  choice: முன்பாக
  rationale: ஒருவரின் முன்னிலையில் இருப்பதைக் குறிக்கும் கிரேக்கச் சொல்லைச் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான புதிய ஏற்பாட்டுத் தமிழ் இணை; கிறிஸ்துவைப் பற்றிய ஒப்புதலுக்கும் பொருந்துகிறது.
- source_word: παρουσίᾳ
  choice: வரும்போது
  rationale: இச்சூழலில் இயேசுவின் எதிர்கால வருகையைக் குறிக்கிறது; சொல்லின் ‘பிரசன்னம்/வந்தடைதல்’ பொருள் பரப்பை அடிக்குறிப்பு காக்கிறது.
theological_decisions:
- issue: இறுதிக்காலச் சூழலில் παρουσίᾳ என்பதன் மொழிபெயர்ப்பு
  choice: வரும்போது
  alternative: பிரசன்னமாகும்போது; வந்தடையும்போது
  rationale: இவ்வசனம் ஆண்டவர் இயேசுவின் எதிர்கால வருகையை நோக்குவதால் ‘வரும்போது’ என்பது நவீன தமிழில் தெளிவானது. எனினும் παρουσία என்பதில் பிரசன்னம் மற்றும் வந்தடைதல் ஆகிய நுணுக்கங்களும் உள்ளதால் அவை அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. கிரேக்க வாக்கியத்தின் விளக்கத் தொடர்பும், தொடர்ச்சியான மூன்று பெயர்ச்சொற்களும், உறுதியான பதிலை எதிர்பார்க்கும் சொல்லாட்சியும் காக்கப்பட்டுள்ளன.
