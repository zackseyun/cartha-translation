revisions:
- from: ஏனெனில், நமது நம்பிக்கையும் மகிழ்ச்சியும் பெருமைப்படுவதற்கான கிரீடமும் யார்? நமது ஆண்டவர் இயேசு வரும்போது[a] அவருக்கு முன்பாக நீங்களும்தானே?
  to: ஏனெனில், எது எங்கள் நம்பிக்கை, மகிழ்ச்சி, அல்லது பெருமைப்படுதலின் கிரீடம்? நம்முடைய ஆண்டவர் இயேசுவின் வருகையின்போது அவருக்கு முன்பாக நீங்களும்தானே?[a]
  rationale: The revision corrects the interrogative to match the impersonal Greek predicate nouns, clarifies the first-person possessive, and gives στέφανος καυχήσεως a more direct Tamil rendering. It retains the rhetorical question, the emphatic ‘you also,’ and the eschatological sense of παρουσία. The footnote continues to preserve the lexical alternatives without resolving them beyond the contextual future-coming sense.
  reviewer_model: gpt-5.6-terra
