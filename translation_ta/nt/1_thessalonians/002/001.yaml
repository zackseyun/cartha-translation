source:
  edition: SBLGNT
  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: ta
  text: ஏனெனில், சகோதரர்களே[a], நாங்கள் உங்களிடம் வந்தது வீணாக அமையவில்லை என்று நீங்களே அறிந்திருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளே”; கிரேக்கத்தில் “சகோதரர்களே” என்ற ஆண்பால் வடிவம் உள்ளது. இது பெரும்பாலும் விசுவாசக் குழுவில் உள்ள அனைவரையும் அழைக்கப் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: உங்களுக்கே
  rationale: தெசலோனிக்கேயரின் நேரடி அறிவை வலியுறுத்தும் intensive பயன்பாட்டை இயல்பான தமிழில் ‘உங்களுக்கே’ எனக் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான ஆதாரத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἴδατε
  choice: தெரியும்
  rationale: வடிவில் perfect ஆனாலும் நிகழ்காலப் பொருளான ‘அறிந்திருக்கிறீர்கள்/தெரியும்’ என்பதையே இங்கு தருகிறது; ‘உங்களுக்கே தெரியும்’ என்பது இயல்பான தமிழ்.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை அழைப்பை முதன்மை உரையில் தக்கவைக்கிறது; அது முழு விசுவாசக் குழுவையும் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: உங்களிடம் நாங்கள் வந்தது
  rationale: சொல்லுக்குச் சொல் ‘எங்கள் நுழைவு’ என்பதற்குப் பதிலாக, பவுலும் உடன் ஊழியர்களும் அவர்களிடம் வந்த நிகழ்வை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: என்பது
  rationale: அவர்கள் அறிந்திருக்கும் கருத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: οὐ κενὴ γέγονεν
  choice: வீண்போகவில்லை
  rationale: κενή என்பதிலுள்ள ‘வெறுமையானது, பயனற்றது’ என்ற கருத்தையும் γέγονεν குறிக்கும் நிறைவு பெற்ற நிகழ்வின் தொடரும் விளைவையும் சுருக்கமான இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கலப்பு விசுவாசக் குழுவை ἀδελφοί என்று அழைத்தல்
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவத்தை முதன்மை உரையில் தக்கவைக்கிறது; பவுலின் பயன்பாட்டில் பெண்களும் உட்பட்ட முழுச் சபையையும் இது அடிக்கடி குறிக்கும் என்பதைக் குறிப்பில் விளக்குவதால் பாலினம் சார்ந்த மூலத் தகவலும் பரந்த சுட்டும் இரண்டும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உங்களுக்கே’ என்ற வலியுறுத்தல் கிரேக்க Αὐτοὶ என்பதன் emphatic force-ஐ காக்கிறது; ‘வீண்போகவில்லை’ என்பது விளைவற்றதாகவும் அர்த்தமற்றதாகவும் இல்லை என்ற மூலத்தின் பரப்பை தேவையின்றி சுருக்காமல் இயல்பாக எடுத்துரைக்கிறது.
