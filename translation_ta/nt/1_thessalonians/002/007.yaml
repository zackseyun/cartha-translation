reference: 1 Thessalonians 2:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: ta
  text: மேசியாவின் அப்போஸ்தலர்களாக நாங்கள் உங்களுக்குப் பாரமாக இருந்திருக்க முடியும்[a]. ஆனாலும், நாங்கள் உங்கள் நடுவில் கனிவுள்ளவர்களாய் ஆனோம்; தன் சொந்தப் பிள்ளைகளை அன்புடன் பேணும் பாலூட்டும் தாயைப் போல[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “பாரமுள்ளவர்களாய் இருந்திருக்க முடியும்.” இதற்கு “எங்கள் அதிகாரத்தை வலியுறுத்தியிருக்க முடியும்” அல்லது “உங்களிடம் கோரிக்கைகளை வைத்திருக்க முடியும்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: “பாலூட்டும் தாய்” என்பதற்கு “செவிலித்தாய்” அல்லது “பால்தாய்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள படிமம் மென்மையான தாய்மைப் பராமரிப்பை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμενοι
  choice: செலுத்தியிருக்க முடியும்
  rationale: ἀλλά என்பதுடன் உள்ள சூழலில் இந்தப் பங்கேற்புவினை சலுகைப் பொருளைத் தருகிறது; தமிழில் ‘முடியும்’ என்ற அமைப்பு அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν βάρει εἶναι
  choice: எங்கள் செல்வாக்கை உங்கள்மேல் செலுத்த
  rationale: சொல்லுக்குச் சொல் ‘பாரமுள்ளவர்களாய் இருக்க’ என்றாலும், இங்கு அப்போஸ்தலருக்குரிய முக்கியத்துவம், அதிகாரம் அல்லது கோரிக்கையை முன்வைப்பது என்ற பரந்த பொருள் இருக்கலாம். இயல்பான தமிழுக்காக ‘செல்வாக்கைச் செலுத்த’ என மொழிபெயர்த்து, பிற சாத்தியங்களை அடிக்குறிப்பில் வைத்துள்ளோம்.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: மேசியாவின் அப்போஸ்தலர்களாக
  rationale: Χριστοῦ இங்கு பட்டப்பெயராகச் செயல்படுவதால் ‘மேசியா’ என்றும், ἀπόστολοι என்பதற்கு திருச்சபைச் சூழலில் பரவலாக அறியப்படும் ‘அப்போஸ்தலர்கள்’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: ஆனாலும் ... ஆனோம்
  rationale: முந்தைய சாத்தியத்துடன் உள்ள முரண்பாட்டை ‘ஆனாலும்’ காட்டுகிறது; γίνομαι என்பதன் நிகழ்தல்/ஆதல் வலிமையை ‘ஆனோம்’ காக்கிறது.
- source_word: ἤπιοι
  choice: மென்மையானவர்களாய்
  rationale: இச்சொல் சாந்தம், கனிவு, கடுமையின்மை ஆகியவற்றைக் குறிக்கிறது; ‘மென்மையானவர்களாய்’ என்பது நவீன தமிழில் இயல்பாகவும் தாய்மைப் படிமத்துக்கு ஏற்றதாகவும் உள்ளது.
- source_word: ἐν μέσῳ ὑμῶν
  choice: உங்கள் நடுவில்
  rationale: மூலத்தின் இடவியல் நயத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ὡς ἐὰν τροφὸς
  choice: பாலூட்டும் ஒரு தாய் ... போல
  rationale: τροφός என்பது குழந்தைக்குப் பாலூட்டி பராமரிக்கும் பெண்ணைக் குறிக்கலாம். அடுத்துள்ள ‘தன் சொந்தப் பிள்ளைகள்’ என்பதுடன் தாய்மைப் படிமம் தெளிவாக இருப்பதால் இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: θάλπῃ
  choice: பரிவுடன் பேணுவது
  rationale: வினைச்சொல்லின் அடிப்படைப் படிமம் சூடூட்டுதல்; விரிவான பொருள் அன்போடும் மென்மையோடும் பராமரித்தல். ‘பரிவுடன் பேணுதல்’ இரண்டாம் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: தன் சொந்தப் பிள்ளைகளை
  rationale: ἑαυτῆς தரும் தனக்கே உரியவை என்ற அழுத்தத்தை ‘தன் சொந்த’ காக்கிறது; τέκνα என்பதற்கு இயல்பான ‘பிள்ளைகள்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இச்சொல் இங்கு பெயரைப் போல அல்லாமல் பட்டமாகச் செயல்படுகிறது; ஆகவே ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது. வழக்கமான திருச்சபை வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: ἐν βάρει εἶναι என்பதன் பொருள்
  choice: எங்கள் செல்வாக்கை உங்கள்மேல் செலுத்த
  alternative: உங்களுக்குப் பாரமாக இருந்திருக்க / அதிகாரத்தை வலியுறுத்தியிருக்க / கோரிக்கைகளை வைத்திருக்க
  rationale: கிரேக்கச் சொற்றொடர் சொல்லுக்குச் சொல் ‘பாரத்தில் இருக்க’ என்று இருந்தாலும், நிதிச் சுமையை மட்டும் கட்டாயமாகக் குறிக்கவில்லை; அப்போஸ்தலருக்குரிய அதிகாரம் அல்லது முக்கியத்துவத்தைப் பயன்படுத்துவதையும் குறிக்கலாம். முதன்மை உரையில் இயல்பான பரந்த விளக்கம் தரப்பட்டு, உண்மையான பொருள் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τροφός என்பவரின் அடையாளம்
  choice: பாலூட்டும் ஒரு தாய்
  alternative: செவிலித்தாய் / பால்தாய்
  rationale: τροφός தொழில்முறை அல்லது மாற்றுப் பாலூட்டும் பெண்ணையும் குறிக்கக்கூடும்; ஆனால் ‘தன் சொந்தப் பிள்ளைகள்’ என்ற தொடரால் இங்கு தாய்மைப் பராமரிப்பு முன்னிலைப்படுகிறது. மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அப்போஸ்தலர்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டது. மூலத்தின் அன்பான தாய்மைப் படிமமும், ἐν βάρει εἶναι மற்றும் τροφός ஆகியவற்றின் பொருள் பரப்பும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன.
