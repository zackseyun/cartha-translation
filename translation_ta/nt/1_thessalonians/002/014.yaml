source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: ta
  text: சகோதரர்களே, மேசியாவாகிய இயேசுவில்[a] யூதேயாவில் இருக்கும் கடவுளுடைய திருச்சபைகளைப் போல நடந்துகொள்பவர்களாக நீங்கள் ஆனீர்கள். ஏனெனில், அவர்கள் யூதர்களிடமிருந்து[b] துன்பங்களை அனுபவித்ததுபோல, நீங்களும் உங்கள் சொந்த இனத்தாரிடமிருந்து அதே துன்பங்களை அனுபவித்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து இயேசுவில்.” கிரேக்க மொழியிலுள்ள Χριστός என்ற பட்டப்பெயரின் பொருளைப் பாதுகாக்க இங்கே “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “யூதேயர்களிடமிருந்து.” கிரேக்கச் சொல் சூழலுக்கேற்ப யூதர்களையோ யூதேயர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: பின்பற்றுகிறவர்களாக நீங்கள் ஆனீர்கள்
  rationale: μιμηταί என்பதன் ஒப்புமை சார்ந்த பொருளையும், ἐγενήθητε காட்டும் ‘ஆனீர்கள்’ என்ற மாற்றத்தையும் வெளிப்படையாகப் பாதுகாக்கிறது; ‘சீடர்களானீர்கள்’ போன்ற மிகைப்படுத்தப்பட்ட பொருளைத் தவிர்க்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: சபையாரை நேரடியாக அழைக்கும் கிரேக்க விளிவேற்றை இயல்பான, கண்ணியமான தமிழில் தருகிறது; சூழலில் இது முழுச் சபையையும் பிரதிநிதித்துவமாக அழைக்கிறது.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: கடவுளுடைய திருச்சபைகளை
  rationale: பவுலின் சபைச்சூழலில் ἐκκλησίαι என்பதற்கு ‘திருச்சபைகள்’ தெளிவான வழக்குச் சொல்; τοῦ θεοῦ என்ற உடைமை உறவையும் நேரடியாகக் காக்கிறது.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: யூதேயாவில் இருக்கும்
  rationale: திருச்சபைகளின் புவியியல் இருப்பிடத்தைச் சுட்டும் பங்கேற்புச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவில்
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த ‘மேசியா’ பொருளைத் தெளிவாகக் காத்து, ἐν என்பதன் உறவு/இணைவு மொழியை ‘இல்’ வழியாகத் திறந்தவாறே வைக்கிறது.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: அதே துன்பங்களை அனுபவித்தீர்கள்
  rationale: πάσχω குறிக்கும் துன்பத்தைத் தெளிவுபடுத்துவதோடு, τὰ αὐτά என்பதன் நேரடியான ஒப்புமையையும் காக்கிறது.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: உங்கள் சொந்த இனத்தாரிடமிருந்து
  rationale: συμφυλέται குறிக்கும் ஒரே மக்கள்/இனக் குழுவைச் சேர்ந்தவர்களை ‘இனத்தார்’ எனச் சுருக்கமாகத் தருகிறது; ἰδίων என்பதன் வலியுறுத்தலை ‘உங்கள் சொந்த’ காக்கிறது.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களிடமிருந்து
  rationale: இச்சூழலில் யூத மத-இன அடையாளத்தைக் குறிக்கும் வழக்கமான பொருளைத் தருகிறது; எல்லா யூதர்களையும் பொதுமைப்படுத்தும் விரிவாக்கம் எதையும் சேர்க்கவில்லை.
theological_decisions:
- issue: Χριστῷ என்பது பட்டப்பெயராகவா அல்லது பெயரின் நிலையான பகுதியாகவா மொழிபெயர்க்கப்பட வேண்டும்
  choice: மேசியாவாகிய இயேசுவில்
  alternative: கிறிஸ்து இயேசுவில்
  rationale: இத்தொடர் பவுலின் நிலையான பயன்பாடாக இருந்தாலும், Χριστός என்பதன் ‘அபிஷேகம் பெற்றவர்/மேசியா’ என்ற பட்டப்பெயர் சார்ந்த அர்த்தம் இன்னும் உணரத்தக்கது; முதன்மை உரை அதை வெளிப்படுத்துகிறது, வழக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τῶν Ἰουδαίων என்பதன் குறிப்பு எல்லை
  choice: யூதர்களிடமிருந்து
  alternative: யூதேயர்களிடமிருந்து
  rationale: யூதேயத் திருச்சபைகள் துன்பம் அனுபவித்த குறிப்பிட்ட மனிதர்களையே வசனம் சுட்டுகிறது; எல்லா யூதர்களையும் குறிக்கும் வகையில் உரையை விரிவுபடுத்தவில்லை. சொல்லின் புவியியல் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சபையில் வாசிக்க ஏற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிரேக்க வாக்கியத்தின் நீண்ட அமைப்பை இயல்புக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரித்தாலும், காரண உறவும் இரு தரப்பினரின் துன்ப ஒப்புமையும் முழுமையாகக் காக்கப்பட்டுள்ளன.
