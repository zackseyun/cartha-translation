id: 1TH.2.8
reference: 1 Thessalonians 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: ta
  text: இவ்வாறு, உங்கள்மீது ஆழ்ந்த ஏக்கம் கொண்டவர்களாய்[a], கடவுளுடைய நற்செய்தியை மட்டுமல்ல, எங்கள் சொந்த உயிர்களையும்[b] உங்களுடன் பகிர்ந்துகொள்ள மனமுவந்து விரும்பினோம்; ஏனெனில் நீங்கள் எங்களுக்கு அன்பானவர்களானீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள்மீது ஆழ்ந்த பாசம் கொண்டவர்களாய்” அல்லது “உங்களுக்காக ஏங்கியவர்களாய்.” ὁμειρόμενοι என்ற அரிதான கிரேக்கச் சொல் தீவிரமான பாசத்தையும் ஏக்கத்தையும் வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எங்கள் சொந்த ஆத்துமாக்களையும்” அல்லது “எங்களையே.” இங்கு “உயிர்கள்” என்பது அவர்கள் தங்களையே தனிப்பட்ட முறையிலும் தியாகத்தோடும் அளித்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: முந்தைய தாய்மைப் பராமரிப்பு உருவகத்தோடு இந்தச் செயல் நிகழ்ந்த விதத்தை இணைக்கிறது; கிரேக்க வினையடையின் இயல்பான தமிழாக்கம்.
- source_word: ὁμειρόμενοι ὑμῶν
  choice: உங்கள்மீது ஆழ்ந்த ஏக்கம் கொண்டவர்களாய்
  rationale: அரிதான இவ்வினையெச்சம் தீவிரமான பாசத்தையும் ஏக்கத்தையும் குறிக்கிறது. காரணப்பொருளை கட்டாயமாக்காமல், கிரேக்கத்தின் வினையெச்ச அமைப்பையும் உணர்ச்சி வலிமையையும் காக்கிறது.
- source_word: εὐδοκοῦμεν
  choice: விரும்பினோம்
  rationale: வெறும் சம்மதத்தை அல்ல, மனமுவந்த விருப்பத்தைத் தெரிவிக்கிறது; நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: μεταδοῦναι
  choice: பகிர்ந்துகொள்ள
  rationale: தமக்குரிய ஒன்றில் பிறருக்கும் பங்கு கொடுப்பதைக் குறிக்கிறது; நற்செய்திக்கும் உயிர்களுக்கும் ஒரேபோல் பொருந்துகிறது.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: கடவுளுடைய நற்செய்தி
  rationale: மூலத்தின் உரிமை/தொடர்பு வேற்றுமையை நேரடியாகக் காத்து, பொதுவாகப் புரியும் தமிழைப் பயன்படுத்துகிறது.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: எங்கள் சொந்த உயிர்கள்
  rationale: ψυχή இங்கு உடலிலிருந்து பிரிந்த ஆன்மாவைப் பற்றிய தொழில்நுட்பக் கூற்றாக அல்லாமல், உயிர் அல்லது முழுத் தன்னையே கொடுப்பதைக் குறிக்கிறது; ἑαυτῶν தரும் வலியுறுத்தலை ‘சொந்த’ காக்கிறது.
- source_word: διότι
  choice: ஏனெனில்
  rationale: அவர்களுடைய தன்னளிப்பிற்கான காரணத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: நீங்கள் எங்களுக்கு மிகவும் அன்பானவர்களாகிவிட்டீர்கள்
  rationale: γίνομαι குறிக்கும் உருவான நிலையை ‘ஆகிவிட்டீர்கள்’ காக்கிறது; ἀγαπητοί என்பதன் உறவுசார் பாசத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ψυχάς என்பதன் பொருள்
  choice: உயிர்கள்
  alternative: ஆத்துமாக்கள்; எங்களையே
  rationale: சூழல் அப்போஸ்தலர்களின் தனிப்பட்ட, தியாகமிக்க தன்னளிப்பைப் பற்றியது; மனிதன் உடல்-ஆத்துமா எனப் பிரிக்கப்படுவது குறித்த கோட்பாட்டுக் கூற்று அல்ல. ‘உயிர்கள்’ மூலச்சொல்லின் பரப்பைத் தக்கவைக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: ὁμειρόμενοι வினையெச்சத்தின் தொடர்பு
  choice: முறையையும் உடன்நிலையையும் திறந்தவாறு காக்கும் ‘ஆழ்ந்த ஏக்கம் கொண்டவர்களாய்’
  alternative: உங்களுக்காக ஏங்கியதால்
  rationale: கிரேக்க வினையெச்சத்தை வெளிப்படையாகக் காரணவாக்கியமாக மாற்றாமல், அதன் உணர்ச்சி வலிமையையும் இலக்கணத் தெளிவின்மையையும் காக்கிறது.
- issue: ἀγαπητοί என்பதன் உறவுசார் வலிமை
  choice: மிகவும் அன்பானவர்கள்
  alternative: எங்களால் நேசிக்கப்பட்டவர்கள்
  rationale: இங்கு முன்னிலைப்படுவது தெசலோனிக்கேயர்மீது ஊழியர்களுக்கு ஏற்பட்ட ஆழ்ந்த பாசம்; தேவையற்ற தொழில்நுட்ப அல்லது உடன்படிக்கைச் சிறப்புப் பொருளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ். பவுலும் உடனிருந்தவர்களும் பேசுவதால் பன்மை வடிவங்கள் காக்கப்பட்டுள்ளன. அரிதான வினையெச்சத்தின் பொருள் அடிக்குறிப்பில் விரிவுபடுத்தப்பட்டு, அதன் இலக்கணத் தொடர்பு முதன்மை உரையில் தேவையின்றி காரணமாகத் தீர்மானிக்கப்படவில்லை.
