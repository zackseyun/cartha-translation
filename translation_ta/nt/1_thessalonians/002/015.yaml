  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: ta
  text: அவர்கள் ஆண்டவராகிய இயேசுவையும் தீர்க்கதரிசிகளையும் கூடக் கொன்றார்கள்[a]; எங்களையும் விரட்டியடித்தார்கள்[b]. அவர்கள் கடவுளுக்குப் பிரியமில்லாதவர்களாகவும் எல்லா மக்களுக்கும் எதிரானவர்களாகவும் இருக்கிறார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவராகிய இயேசுவையும் தீர்க்கதரிசிகளையும் சாகடித்தார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “விரட்டியடித்தார்கள்” என்பதற்கு “வெளியேற்றினார்கள்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள வினை பொதுவான துன்புறுத்தலைவிட ஓர் இடத்திலிருந்து விரட்டியதைக் குறிப்பாக உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: இவ்வருணனை இலக்கணப்படி முந்தைய வசனத்தில் குறிப்பிடப்பட்ட குழுவையே தொடர்ந்து குறிக்கிறது; எல்லாக் காலங்களிலும் எல்லா யூத மக்களையும் பற்றிய பொதுவான கூற்றாக இதை வாசிக்கக் கூடாது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: கொன்றார்கள்
  rationale: இந்த இறந்தகால வினையெச்சம் ‘கொல்லுதல்/சாகடித்தல்’ எனப் பொருள்படும். நோக்கத்தைப் பற்றி மூலத்தில் இல்லாத கூடுதல் நெறித் தீர்ப்பைச் சேர்க்காமல், இயல்பான தமிழில் ‘கொன்றார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: κύριον Ἰησοῦν
  choice: ஆண்டவராகிய இயேசு
  rationale: κύριος இங்கு இயேசுவுக்குரிய கிறிஸ்துவியல் பட்டம். ‘ஆண்டவராகிய இயேசு’ என்பது நவீனத் தமிழில் தெளிவானதும் மரியாதையானதும் ஆகும்.
- source_word: τοὺς προφήτας
  choice: தீர்க்கதரிசிகள்
  rationale: அங்கீகரிக்கப்பட்ட இறைத்தூதர் மரபைக் குறிக்கும் வழக்கமான வேதாகமத் தமிழ்ச் சொல்; கிரேக்க வரையறைச் சுட்டின் குறிப்பிட்ட தன்மையைச் சூழல் வெளிப்படுத்துகிறது.
- source_word: ἐκδιωξάντων
  choice: துரத்திவிட்டார்கள்
  rationale: இவ்வினை வெறுமனே துன்புறுத்துவதைவிட ஓர் இடத்திலிருந்து விரட்டுதல் அல்லது வெளியேற்றுதல் என்ற குறிப்பான பொருளைக் கொண்டது. ‘துரத்திவிட்டார்கள்’ அந்த இயக்கத்தையும் முடிவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: கடவுளுக்குப் பிரியமாய் நடக்காமல்
  rationale: நிகழ்கால வினையெச்சத்தின் தொடர்ந்த வருணனைத் தமிழில் இயல்பாகக் காட்டுகிறது; கடவுளை மகிழ்விக்காத நடத்தை என்ற கருத்து பாதுகாக்கப்படுகிறது.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: எல்லா மனிதர்களுக்கும் எதிராக இருக்கிறார்கள்
  rationale: ἐναντίος என்பதன் எதிர்ப்பு சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது. ‘பகைவர்களாய்’ என்பது சாத்தியமானாலும் மூலத்தைவிட வலுவான உணர்ச்சி நிழலைத் தரக்கூடும்.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: அவர்கள் ... கொன்றார்கள்; ... துரத்திவிட்டார்கள். அவர்கள் ... நடக்காமல் ... எதிராக இருக்கிறார்கள்
  rationale: கிரேக்கத்தில் முந்தைய வசனத்தின் குழுவைத் தொடர்ந்து வருணிக்கும் வினையெச்சத் தொடர் உள்ளது. தமிழில் நீண்ட வினையெச்சச் சங்கிலியைத் தவிர்த்து இரண்டு வாக்கியங்களாக்கினாலும், ஒரே எழுவாயை மீண்டும் கொண்டு தொடர்பு பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: வினையெச்சத் தொடரால் குறிக்கப்படும் குழு
  choice: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட குறிப்பிட்ட குழுவைப் பற்றிய பவுலின் வருணனையாக வாசித்தல்
  alternative: எல்லாக் காலங்களிலும் எல்லா யூத மக்களையும் குறித்த பொதுவான கண்டனமாக வாசித்தல்
  rationale: τῶν என்ற பன்மை உடைமைவேற்றுமைச் சுட்டும் அதைத் தொடரும் வினையெச்சங்களும் 2:14-இன் முன்னிலையைக் இலக்கண ரீதியாகத் தொடர்கின்றன. வசனத்தின் கடுமையான சொல்லாட்சியை மென்மையாக்காமல், அது காலமெல்லாம் வாழும் முழு இனத்துக்கும் பொதுப்படுத்தப்படக் கூடாது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘ஆண்டவர்,’ ‘தீர்க்கதரிசி’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டன. கிரேக்கத்தின் குற்றச்சாட்டுத் தொடர் வலிமை பாதுகாக்கப்பட்டாலும், தமிழில் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
