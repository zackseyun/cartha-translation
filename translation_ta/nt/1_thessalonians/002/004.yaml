source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: ta
  text: ஆனால், நற்செய்தியை எங்களிடம் ஒப்படைக்கக் கடவுள் எங்களை ஏற்றுக்கொண்டிருப்பதுபோலவே நாங்கள் பேசுகிறோம்—மனிதர்களை மகிழ்விப்பவர்களாக அல்ல, எங்கள் இதயங்களைச் சோதிக்கிற கடவுளை மகிழ்விப்பவர்களாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொற்சுருக்கமாக, ‘மனிதர்களை மகிழ்விப்பவர்களாக அல்ல, கடவுளை’ என்று உள்ளது; இரண்டாம் ‘மகிழ்விப்பவர்களாக’ என்பது பொருளில் உள்ளடங்கியுள்ளது.
    reason: மூலமொழியின் சுருக்கமான எதிர்மறை ஒப்புமையை விளக்குதல்
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: எங்களைச் சோதித்து ஏற்றுக்கொண்டிருக்கிறபடியே
  rationale: வினையின் நிறைவுற்ற செயலும் அதன் தொடரும் விளைவும் வெளிப்படும்படி நிகழ்கால நிறைவு வடிவம் பயன்படுத்தப்பட்டுள்ளது. δοκιμάζω என்பதில் சோதனையும் அதன் சாதகமான முடிவும் அடங்குவதால், வெறும் ‘சோதித்தார்’ என்பதற்குப் பதில் ‘சோதித்து ஏற்றுக்கொண்டிருக்கிறார்’ என்ற பொருள் தரப்பட்டுள்ளது.
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: நற்செய்தியை எங்களிடம் ஒப்படைப்பதற்காக
  rationale: இங்கு πιστεύω என்பது நற்செய்தியை நம்புவது அல்ல; அதை நம்பிக்கையுடன் ஒருவரிடம் ஒப்படைப்பது. இயல்பான தமிழுக்காக கிரேக்கச் செயப்பாட்டு அமைப்பு செயவினை அமைப்பாக மாற்றப்பட்டுள்ளது.
- source_word: τὸ εὐαγγέλιον
  choice: நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் அடிப்படைப் பொருளையும் பவுலின் பயன்பாட்டிலுள்ள இறையியல் செறிவையும் தமிழில் நிலைபெற்ற ‘நற்செய்தி’ தக்கவைக்கிறது.
- source_word: οὕτως λαλοῦμεν
  choice: அப்படியே நாங்கள் பேசுகிறோம்
  rationale: கடவுளின் முந்தைய சோதித்து ஏற்றுக்கொள்ளுதலுக்கும் அவர்கள் பேசும் விதத்திற்கும் உள்ள தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: மனிதர்களை மகிழ்விப்பவர்களாக அல்ல
  rationale: ἀρέσκω என்பதின் பொருளையும் ὡς உடன் வரும் பங்கேற்பு அமைப்பையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀλλὰ θεῷ
  choice: கடவுளை மகிழ்விப்பவர்களாக
  rationale: கிரேக்கத்தில் இரண்டாம் பாதியில் ‘மகிழ்விப்பவர்கள்’ என்ற சொல் மறைமுகமாக விடப்பட்டுள்ளது. தமிழில் பொருள் முழுமையடைய அதை வெளிப்படையாகத் தர வேண்டியதால், அந்த விரிவு அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: τῷ δοκιμάζοντι
  choice: சோதிக்கிற
  rationale: நிகழ்காலப் பங்கேற்பு கடவுளின் தொடர்ந்த ஆய்வைச் சுட்டுகிறது. மேலும், வசனத்தின் தொடக்கத்திலுள்ள δοκιμάζω சொல்லுடனான சொற்பொருள் தொடர்பையும் ‘சோதிக்கிற’ தக்கவைக்கிறது.
- source_word: τὰς καρδίας ἡμῶν
  choice: எங்கள் இதயங்களை
  rationale: வேதாகம மானுடவியலில் உள்ளார்ந்த எண்ணங்கள், நோக்கங்கள், விருப்பங்கள் ஆகியவற்றின் மையத்தைக் குறிக்கும் ‘இதயம்’ என்ற உருவகத்தைச் சுருக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: மனிதர்களை மகிழ்விப்பதற்கும் கடவுளை மகிழ்விப்பதற்கும் இடையிலான சுருக்கமான கிரேக்க எதிர்மறை ஒப்புமை
  choice: தமிழில் புரிதலுக்காக இரண்டாம் பாதியில் மறைந்துள்ள ‘மகிழ்விப்பவர்களாக’ என்பதை வெளிப்படையாக வழங்கி, கிரேக்கத்தின் சுருக்கத்தை அடிக்குறிப்பில் குறிப்பது
  alternative: ‘மனிதர்களை மகிழ்விப்பவர்களாக அல்ல, கடவுளை’ என்று கிரேக்கச் சுருக்கத்தை நேரடியாகத் தக்கவைப்பது
  rationale: நேரடியான சுருக்கம் தமிழில் முற்றுப்பெறாத அல்லது தவறான வாக்கியமாகத் தோன்றும். விரிவாக்கம் புதிய இறையியல் கருத்தைச் சேர்க்காமல் கிரேக்கத்தில் இலக்கணரீதியாக உள்ளடங்கிய பொருளையே தெளிவாக்குகிறது; அடிக்குறிப்பு மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. செயப்பாட்டு கிரேக்கத் தொடரை தமிழின் இயல்புக்கேற்ற செயவினை அமைப்பாக மாற்றியுள்ளபோதிலும், கடவுளே சோதித்து ஏற்றுக்கொண்டு நற்செய்தியை ஒப்படைப்பவர் என்ற கருத்து காக்கப்பட்டுள்ளது. ‘இதயம்’, ‘நற்செய்தி’ போன்ற வேதாகமத்தில் நிலைபெற்ற சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
