  naturalness: வரைவு பெரும்பாலும் நவீன நிலையான தமிழில் இயல்பாக உள்ளது. எனினும், திருத்தப்பட்ட தொடக்கத் தொடர் தெளிவாகவும் சீராகவும் அமையும். எதிர்நிலையின் மறைந்த வினைப்பகுதியை «கடவுளை மகிழ்விப்பவர்களாக» என வெளிப்படுத்துவது தமிழில் இயல்பானதும் மூலப்பொருளுக்கு ஏற்புடையதும் ஆகும்.
