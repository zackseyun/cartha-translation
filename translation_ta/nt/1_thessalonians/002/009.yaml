source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: ta
  text: ஏனெனில், சகோதரர்களே[a], எங்கள் உழைப்பையும் கடும் பாடுபாட்டையும் நீங்கள் நினைவில் வைத்திருக்கிறீர்கள். உங்களில் எவருக்கும் பாரமாக இராதபடி இரவும் பகலும் வேலை செய்துகொண்டே, கடவுளுடைய நற்செய்தியை உங்களுக்கு அறிவித்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதர சகோதரிகளே’ என்றும் பொருள் கொள்ளலாம்; கிரேக்கத்தில் ‘சகோதரர்களே’ என்று இருந்தாலும், இங்கு அது சபை முழுவதையும் உள்ளடக்கி அழைக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: நீங்கள் நினைவில் வைத்திருக்கிறீர்கள்
  rationale: இது நிகழ்கால இரண்டாம் நபர் பன்மை வினை; கட்டளையாக அல்லாமல், தெசலோனிக்கேயரின் நினைவைச் சான்றாகக் கூறும் நிகழ்கால வாக்கியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க ஆண்பால் பன்மை அழைப்பை முதன்மை உரையில் காக்கிறது; சூழலில் முழுச் சபையையும் உள்ளடக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: κόπον καὶ μόχθον
  choice: கடின உழைப்பையும் பாடுகளையும்
  rationale: κόπος குறிக்கும் அயர்வூட்டும் உழைப்பையும் μόχθος குறிக்கும் அதன் கடுமை அல்லது துன்பத்தையும் வேறுபடுத்திக் காட்டும் இயல்பான தமிழ் இணைச்சொல் தொடர்.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: இரவும் பகலும்
  rationale: தொடர்ச்சியான கடுமுயற்சியை உணர்த்தும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் வடிவம்.
- source_word: ἐργαζόμενοι
  choice: வேலை செய்துகொண்டே
  rationale: முதன்மை அறிவிப்பு நிகழ்ந்த சூழலையும் ஒரே நேரத்தில் தொடர்ந்த உழைப்பையும் பங்கேற்புவினையின் அமைப்புடன் வெளிப்படுத்துகிறது.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: உங்களில் எவருக்கும் பாரமாக இராதபடி
  rationale: நோக்கத்தைக் குறிக்கும் கட்டமைப்பைத் தெளிவாகக் காக்கிறது; பொருளாதார அல்லது நடைமுறைச் சுமையைத் திணிக்காதிருப்பது என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: உங்களுக்கு அறிவித்தோம்
  rationale: κηρύσσω என்பதன் பொதுவாகவும் வெளிப்படையாகவும் அறிவிக்கும் பொருளையும் εἰς என்பதன் திசைநோக்கையும் இயல்பான தமிழில் தருகிறது.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: கடவுளுடைய நற்செய்தி
  rationale: εὐαγγέλιον என்பதைக் கருத்துத் தெளிவுள்ள நவீன தமிழில் தருவதோடு, τοῦ θεοῦ என்ற மரபுத்தொடரின் மூலம், உடைமை அல்லது உள்ளடக்கம் ஆகிய சாத்தியங்களைத் தேவையின்றி குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: ἀδελφοί என்பதன் உள்ளடக்கும் பயன்பாடு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று ஆண்பால் பன்மையைத் தக்கவைத்தல்
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: கிரேக்கச் சொல் இலக்கண வடிவில் ஆண்பால் பன்மை; ஆனால் அது முழுச் சபையையும் உள்ளடக்கி அழைக்கலாம். மூல வடிவை உரையில் காத்து, சாத்தியமான உள்ளடக்கும் பொருளை அடிக்குறிப்பில் குறிப்பிடுவது தெளிவையும் மூலநேர்மையையும் ஒருங்கிணைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏனெனில்’ மூலம் γάρ-இன் முந்தைய கருத்துடனான தொடர்பு காக்கப்பட்டுள்ளது; வாக்கிய அமைப்பு நீளமடையாமல் பங்கேற்புவினையின் தொடர்பும் தெளிவாக வைக்கப்பட்டுள்ளது.
