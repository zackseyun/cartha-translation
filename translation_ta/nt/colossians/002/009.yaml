translation:
  language: ta
  text: ஏனெனில், அவருக்குள் இறைத்தன்மையின் முழு நிறைவும் உடல் வடிவில் குடியிருக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருக்குள் இறைத்தன்மையின் முழு நிறைவும் உடல்பூர்வமாகக் குடியிருக்கிறது.’
    reason: σωματικῶς என்பதற்கான இயல்பான மாற்று மொழிபெயர்ப்பைக் காட்டுகிறது.
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக இருப்பதால், கிரேக்கத்தின் காரணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள்
  rationale: மேசியாவைக் குறிக்கும் நேரடியான இடப்பொருள் தொடர். கிரேக்கத்தில் இல்லாத ‘அவரில் மட்டுமே’ என்ற தனிப்படுத்தும் பொருள் சேர்க்கப்படவில்லை.
- source_word: κατοικεῖ
  choice: குடிகொண்டிருக்கிறது
  rationale: தற்காலிகமான இருப்பை அல்லாமல் நிலையான, தொடரும் வாசத்தை உணர்த்துகிறது; நிகழ்கால வினையின் நீடித்த தன்மையையும் காக்கிறது.
- source_word: πᾶν τὸ πλήρωμα
  choice: முழுநிறைவும்
  rationale: πᾶν மற்றும் குறிப்புச் சுட்டியுடன் வரும் πλήρωμα ஆகியவற்றின் முழுமை, மொத்தம் என்ற வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: τῆς θεότητος
  choice: இறைத்தன்மையின்
  rationale: θεότης என்பது வெறும் இறைசார்ந்த குணங்களையல்ல, இறைவனாக இருக்கும் முழு இயல்பைக் குறிக்கிறது. ‘இறைத்தன்மை’ நவீனத் தமிழில் புரியத்தக்கதாய் இருந்து அந்த வலிமையைக் காக்கிறது.
- source_word: σωματικῶς
  choice: உடலோடு
  rationale: இந்த வினையடை உடல்சார்ந்த முறையில் என்ற பொருளைக் கொடுக்கிறது. ‘உடலோடு’ என்பது சுருக்கமாகவும் இயல்பாகவும் இருந்து, அது ‘உடல் வடிவில்’ அல்லது ‘ஒரு உடலில்’ என்பதில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் கிரேக்கத்தின் செறிவைக் காக்கிறது.
theological_decisions:
- issue: θεότης மற்றும் σωματικῶς என்பவற்றின் கிறிஸ்துவியல் வலிமை
  choice: இறைத்தன்மையின் முழுநிறைவும் கிறிஸ்துவுக்குள் உடலோடு குடிகொண்டிருப்பதாக வசனம் கூறுகிறது.
  alternative: இறைசார்ந்த குணங்களோ அல்லது இறைவனின் பிரசன்னமோ மட்டும் கிறிஸ்துவில் இருப்பதாக வசனத்தை மெலிதாகப் புரிந்துகொள்வது.
  rationale: θεότης என்பது வெறும் தெய்வீகக் குணத்தைவிட இறைவனாக இருக்கும் இயல்பை வலுவாகக் குறிக்கிறது; σωματικῶς அந்தக் குடியிருப்பின் உடல்சார்ந்த தன்மையைத் தெரிவிக்கிறது. மொழிபெயர்ப்பு இந்த உயர்ந்த கிறிஸ்துவியல் கூற்றை மெலிதாக்காமலும் அதன் விளக்கத்தை அளவுக்கு மீறிக் குறுக்காமலும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘குடிகொண்டிருக்கிறது’ நிலையான வாசத்தையும், ‘முழுநிறைவும்’ முழுமையையும் தெளிவாக உணர்த்துகின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
