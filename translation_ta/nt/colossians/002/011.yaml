  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: ta
  text: அவருக்குள்[a] நீங்களும் கைகளால் செய்யப்படாத விருத்தசேதனத்தால்[b] விருத்தசேதனம் செய்யப்பட்டீர்கள்—மாம்சத்தின் உடலைக் களைந்துபோடுவதில்[c][d], மேசியாவின் விருத்தசேதனத்தில்[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரில்.” இங்குள்ள தொடர்புச் சுட்டுப்பெயர் முந்தைய சூழலில் குறிப்பிடப்படும் மேசியாவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கைகளின்றிச் செய்யப்பட்ட விருத்தசேதனத்தால்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மாம்சத்தின் உடலை முற்றிலும் கழற்றிப்போடுவதில்.” கிரேக்கச் சொல் உடையைக் கழற்றுவதுபோன்ற படிமத்தையும் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: d
    text: “மாம்சம்” என்பதை விளக்கமாக “பாவ இயல்பு” என்று புரிந்துகொள்ள வாய்ப்புள்ளது; ஆனால் கிரேக்கச் சொல்லின் பொருள் அகலத்தைப் பாதுகாக்க இங்கே அது நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: e
    text: அல்லது, “மேசியா செய்த விருத்தசேதனத்தால்,” “மேசியாவுக்குச் செய்யப்பட்ட விருத்தசேதனத்தில்,” அல்லது “மேசியாவுக்குரிய விருத்தசேதனத்தில்.” கிரேக்கத் தொடர் செய்பவர், உடையவர், அல்லது தொடர்பு ஆகியவற்றில் எதைக் குறிக்கிறது என்பது திறந்ததாக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அவருக்குள்
  rationale: தொடர்புச் சுட்டுப்பெயர் முந்தைய சூழலில் உள்ள மேசியாவைக் குறிக்கிறது. ‘அவருக்குள்’ என்பது மேசியாவுடன் ஒன்றிணைந்திருக்கும் கருத்தைப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: περιετμήθητε
  choice: விருத்தசேதனம் செய்யப்பட்டீர்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வினையாக உள்ள கிரேக்க வடிவத்தை நேரடியாகக் காட்டுகிறது; உருவகப் பொருளை விளக்கவுரையாக மாற்றாமல் விருத்தசேதன உருவகத்தையே தக்கவைக்கிறது.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: கைகளால் செய்யப்படாத விருத்தசேதனத்தால்
  rationale: வேற்றுமை உருபின் கருவிப் பொருளைத் தெளிவாகக் காட்டுகிறது; மனிதச் செயலுக்கும் கடவுளின் செயலுக்கும் இடையிலான வேதாகம எதிர்மறையைப் பாதுகாக்கிறது.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: களைந்துபோடுவதில்
  rationale: ἀπέκδυσις குறிக்கும் முற்றான கழற்றுதல் அல்லது அகற்றுதல் என்ற படிமத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: மாம்சத்தின் உடலை
  rationale: சிக்கலான கிரேக்கப் பிறப்புவேற்றுமைத் தொடரை அதிகமாக விளக்கித் தீர்மானிக்காமல் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: σαρκός
  choice: மாம்சத்தின்
  rationale: ‘பாவ இயல்பு’ என்று விளக்கமாகச் சுருக்காமல் பவுலின் ‘மாம்சம்’ என்ற சொல்லாட்சியையும் அதன் பொருள் அகலத்தையும் தக்கவைக்கிறது.
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: மேசியாவின் விருத்தசேதனத்தில்
  rationale: τοῦ Χριστοῦ என்பதை ஒரு திறந்த பிறப்புவேற்றுமைத் தொடராக வைத்திருக்கிறது; செய்பவர், உடையவர், அல்லது தொடர்புடையவர் என்ற சாத்தியங்களைத் தமிழ் சொற்றொடர் முன்கூட்டியே முடிவுசெய்வதில்லை.
theological_decisions:
- issue: ‘மேசியாவின் விருத்தசேதனம்’ என்பதன் பொருள்
  choice: ‘மேசியாவின் விருத்தசேதனம்’ என்ற திறந்த பிறப்புவேற்றுமை அமைப்பு
  alternative: ‘மேசியா செய்த விருத்தசேதனம்’; ‘மேசியாவுக்குச் செய்யப்பட்ட விருத்தசேதனம்’; ‘மேசியாவுக்குரிய விருத்தசேதனம்’
  rationale: τοῦ Χριστοῦ என்பது செய்பவர், உடையவர், அல்லது தொடர்பு ஆகிய பல உறவுகளைக் குறிக்கக்கூடும். மொழிபெயர்ப்பு அவற்றில் ஒன்றை மட்டும் கோட்பாட்டரீதியாகத் தேர்ந்தெடுக்காமல் கிரேக்கத்தின் மெய்யான தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: ‘மாம்சத்தின் உடல்’ என்பதன் பொருள்
  choice: ‘மாம்சத்தின் உடல்’ என்ற நெருக்கமான வடிவம்
  alternative: ‘மாம்சத்துக்குரிய உடல்’; ‘பாவ இயல்பின் உடல்’; ‘பாவமுள்ள மாம்ச உடல்’
  rationale: இந்தச் சொற்றொடர் பொருள்விளக்கத்திலும் உரைவரலாற்றிலும் சிக்கலானது. SBLGNT உரையில் இல்லாத விளக்கத்தைச் சேர்க்காமல், மனித உடல், மாம்சத்தால் பண்புபெற்ற இருப்பு, அல்லது பழைய மாம்ச வாழ்வு ஆகிய சாத்தியங்களுக்கு இடமளிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்,’ ‘மாம்சம்,’ ‘மேசியா’ ஆகிய சொற்கள் உரையின் உருவகத்தையும் இறையியல் திறந்தநிலையையும் காக்கின்றன. நீண்ட கிரேக்க வாக்கியத்தின் இணைப்பைத் தக்கவைக்க கோடு பயன்படுத்தப்பட்டுள்ளது; விளக்கமான துணைவாக்கியம் சேர்த்து பொருளை ஒருதலைப்பட்சமாக முடிவுசெய்யவில்லை.
