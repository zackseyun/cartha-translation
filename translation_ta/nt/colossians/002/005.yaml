id: COL.2.5
reference: Colossians 2:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: ta
  text: ஏனெனில், நான் உடலால் உங்களிடத்தில் இல்லாவிட்டாலும், ஆவியில்[a] உங்களோடு இருந்து, உங்கள் ஒழுங்கையும் மேசியாவின்மேல் உள்ள உங்கள் விசுவாசத்தின் உறுதியையும் கண்டு மகிழ்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆவியில்’ என்பது பவுலின் சொந்த ஆவியைக் குறிக்கலாம்; பரிசுத்த ஆவியால் அவர் அவர்களோடு இருப்பதையும் குறிக்கலாம்.
    reason: theological_ambiguity
lexical_decisions:
- source_word: τῇ σαρκί
  choice: உடலால்
  rationale: இங்கு σάρξ பாவ இயல்பைக் குறிக்காமல் பவுலின் உடல்சார்ந்த இல்லாமையைக் குறிக்கிறது. நவீன தமிழில் ‘உடலால்’ என்பது இந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: τῷ πνεύματι
  choice: ஆவியில்
  rationale: ‘உடலால்’ என்பதற்கு எதிரிணையாக இருந்து, உடல் சாராத பிரசன்னத்தைக் குறிக்கிறது. பரிசுத்த ஆவியா அல்லது பவுலின் சொந்த ஆவியா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
- source_word: χαίρων καὶ βλέπων
  choice: நான் மகிழ்ச்சியடைகிறேன்; ... காண்கிறேன்
  rationale: இரு நிகழ்காலப் பங்கேற்பு வினைகளின் ஒரேகாலத் தொடர்பு காக்கப்படுகிறது; தமிழில் இயல்பும் தெளிவும் பெற அவை முற்றுவினைகளாக மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: τάξιν
  choice: ஒழுங்கை
  rationale: சமூகத்தின் முறையான, பாராட்டத்தக்க அமைப்பைக் குறிக்கிறது; தேவையற்ற இராணுவச் சாயலைச் சேர்க்கவில்லை.
- source_word: στερέωμα
  choice: உறுதி
  rationale: திடநிலை அல்லது நிலைத்தன்மை என்ற உருவகத்தை விசுவாசத்துடன் இயல்பாக இணைக்கிறது.
- source_word: πίστεως
  choice: விசுவாசத்தின்
  rationale: πίστις என்பதன் முதன்மையான பொருளான ‘விசுவாசம்’ பிரதான உரையில் வைக்கப்பட்டுள்ளது; ‘விசுவாச உண்மை’ என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰς Χριστόν
  choice: மேசியாவின்மேல்
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது. εἰς விசுவாசத்தின் நோக்கை அல்லது இலக்கைச் சுட்டுவதால் ‘மேசியாவின்மேல்’ எனத் தரப்படுகிறது.
theological_decisions:
- issue: ‘உடலால் ... ஆவியில்’ என்பதில் ஆவியின் சுட்டுப்பொருள்
  choice: யாருடைய ஆவி என்பதை பிரதான உரையில் குறிப்பிடாமல் ‘ஆவியில்’ என்று வைத்தல்
  alternative: ‘என் ஆவியில்’ அல்லது ‘பரிசுத்த ஆவியினால்’
  rationale: உடல் சார்ந்த இல்லாமைக்கு எதிராகப் பவுலின் உடல் சாராத தனிப்பட்ட பிரசன்னமே உடனடிச் சூழலில் இயல்பான வாசிப்பு. ஆயினும், கிரேக்கத்தில் உடைமைச் சொல் இல்லாததால் பரிசுத்த ஆவியுடன் தொடர்புடைய வாசிப்பையும் முற்றாக நீக்காமல் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: Χριστόν என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் அது விசுவாசத்தின் இலக்காகிய பட்டத்தைத் தெளிவாகக் குறிக்கிறது; ஆகவே பட்டப் பொருள் வெளிப்படையாகத் தரப்படுகிறது.
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: விசுவாச உண்மை / பற்றுறுதி
  rationale: ‘மேசியாவின்மேல் உள்ள விசுவாசம்’ என்பது இக்கட்டமைப்பின் மிக இயல்பான வாசிப்பு. இருப்பினும் πίστης சொல்லுக்குரிய ‘விசுவாச உண்மை’ என்ற சாத்திய நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் உடல்–ஆவி எதிரிணை காக்கப்பட்டுள்ளதுடன், தமிழில் செயற்கையாகத் தோன்றும் பங்கேற்பு வினைக் கட்டமைப்பு இயல்பான முற்றுவினைகளாக அமைக்கப்பட்டுள்ளது.
