- from: ஏனெனில், நான் உடலால் உங்களைவிட்டு விலகியிருந்தாலும், ஆவியில்[a] உங்களோடு இருக்கிறேன். நான் மகிழ்ச்சியடைகிறேன்; உங்கள் ஒழுங்கையும், மேசியாவின்மேல் உள்ள உங்கள் விசுவாசத்தின்[b] உறுதியையும் காண்கிறேன்.
  to: ஏனெனில், நான் உடலால் உங்களிடத்தில் இல்லாவிட்டாலும், ஆவியில்[a] உங்களோடு இருந்து, உங்கள் ஒழுங்கையும் மேசியாவின்மேல் உள்ள உங்கள் விசுவாசத்தின் உறுதியையும் கண்டு மகிழ்கிறேன்.
