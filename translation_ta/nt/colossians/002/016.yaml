  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: ta
  text: ஆகையால், உணவு அல்லது பானம் குறித்தோ, பண்டிகை, அமாவாசை, அல்லது சபத்து நாட்கள் குறித்தோ யாரும் உங்களுக்குத் தீர்ப்பு வழங்க வேண்டாம்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, உணவு மற்றும் பானம் தொடர்பான விதிமுறைகளைக் குறித்து.
    reason: cultural_note
  - marker: b
    text: “பண்டிகை, அமாவாசை, சபத்து நாட்கள்” என்ற வரிசை யூதர்களின் வருடாந்தர, மாதாந்தர, வாராந்தர புனித நாள்காட்டியை எதிரொலிக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, “யாரும் உங்கள்மேல் தீர்ப்பு வழங்க வேண்டாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν τις
  choice: ஆகையால் ... யாரும் ... விடாதீர்கள்
  rationale: οὖν முந்தைய வாதத்திலிருந்து வரும் முடிவைக் குறிக்கிறது; Μὴ ... τις உடன் வரும் கட்டளைத் தொடர் இயல்பான தமிழில் ‘யாரும் ... விடாதீர்கள்’ என வழங்கப்படுகிறது.
- source_word: ὑμᾶς κρινέτω
  choice: உங்களைத் தீர்ப்பிட விடாதீர்கள்
  rationale: κρίνω இங்கு உணவு மற்றும் நாள்காட்டி அனுசரிப்புகளை அடிப்படையாகக் கொண்டு ஒருவரைக் குறித்துத் தீர்ப்பு வழங்குவதைக் குறிக்கிறது. ‘தீர்ப்பிட’ என்பது கண்டனம் என்ற பொருளை மிகைப்படுத்தாமல் நீதித்தீர்ப்பு சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: உணவு அல்லது பானம் குறித்தோ
  rationale: βρῶσις, πόσις ஆகியவை இச்சூழலில் உண்ணுதல், குடித்தல் என்ற செயல்களைவிட உணவு மற்றும் பானம் சார்ந்த அனுசரிப்பு வகைகளைக் குறிக்கின்றன. ‘குறித்தோ’ என்பது ἐν என்பதன் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν μέρει ἑορτῆς
  choice: பண்டிகை ... குறித்தோ
  rationale: ἐν μέρει என்பது இங்கு ‘ஒரு பகுதி’ அல்ல, ‘குறித்து / தொடர்பாக’ என்ற மரபுத்தொடர். ἑορτή ஒரு சமயப் பண்டிகையைக் குறிக்கிறது.
- source_word: νουμηνίας
  choice: அமாவாசை விழா
  rationale: νουμηνία மாதந்தோறும் புதிய நிலவின்போது கடைப்பிடிக்கப்பட்ட சமய அனுசரிப்பைக் குறிக்கிறது. தமிழில் ‘அமாவாசை விழா’ என்பது வெறும் வானியல் நிலையல்ல, அந்த அனுசரிப்பே குறிக்கப்படுவதைத் தெளிவாக்குகிறது.
- source_word: σαββάτων
  choice: ஓய்வுநாட்கள்
  rationale: σαββάτων என்பது கிரேக்கத்தில் பன்மை வடிவம்; வருடாந்தர, மாதாந்தர, வாராந்தர புனித நாள்காட்டித் தொடரில் வாராந்தர சபத்துகளைக் குறிக்கிறது. பொதுவாசகர்களுக்குப் புரியும் தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டு, பன்மையும் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பட்டியலிடப்பட்ட அனுசரிப்புகளின் நிலை
  choice: உணவு, பானம் மற்றும் புனித நாள்காட்டி அனுசரிப்புகள் தொடர்பாக மற்றவர்கள் விசுவாசிகளைத் தீர்ப்பிடக்கூடாது என்பதையே வசனம் நேரடியாகக் கூறுவதாக மொழிபெயர்த்தல்
  alternative: இந்த எல்லா அனுசரிப்புகளையும் வசனம் முற்றிலும் ஒழிக்கிறது எனத் தெளிவாக மொழிபெயர்த்தல்; அல்லது இது மனிதர் உருவாக்கிய தவவிதிகளை மட்டுமே குறிக்கிறது என வரையறுத்தல்
  rationale: கிரேக்க உரை இவ்விஷயங்களில் பிறர் தீர்ப்பிடுவதையே நேரடியாகத் தடுக்கிறது. அனுசரிப்புகள் முற்றிலும் செல்லாதவை என்றோ, குறிப்பிட்ட ஓர் வகை விதிகள் மட்டுமே நோக்கப்படுகின்றன என்றோ இவ்வசனம் தனியாகத் தீர்மானிக்கவில்லை; ஆகவே அந்த இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உணவு அல்லது பானத்தில்’ என்ற சொற்சொல் வடிவத்தைவிட ‘குறித்தோ’ இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘அமாவாசை விழா’ மாதாந்தர சமய அனுசரிப்பை வெளிப்படுத்துகிறது; ‘ஓய்வுநாட்கள்’ கிரேக்கப் பன்மையைப் பாதுகாக்கிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
