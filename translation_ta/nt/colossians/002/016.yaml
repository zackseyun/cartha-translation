  to: ஆகையால், உணவு அல்லது பானம் குறித்தோ, பண்டிகை, அமாவாசை, அல்லது சபத்து நாட்கள் குறித்தோ யாரும் உங்களுக்குத் தீர்ப்பு வழங்க வேண்டாம்.[a][b][c]
  rationale: மூலத்தில் இல்லாத ‘விழா’ நீக்கப்பட்டுள்ளது; σαββάτων-க்கு ‘சபத்து நாட்கள்’ பயன்படுத்தி வரலாற்று-சமயக் குறிப்பும் பன்மையும் பாதுகாக்கப்பட்டுள்ளன. கட்டளை வடிவம் நவீனத் தமிழில் இயல்பாக மாற்றப்பட்டுள்ளது. வசனம் இவ்வனுசரிப்புகள் பற்றித் தீர்ப்பிடுவதைத் தடுக்கிறதே அன்றி, அவற்றின் பரந்த இறையியல் நிலையைத் தனியாகத் தீர்மானிப்பதில்லை.
