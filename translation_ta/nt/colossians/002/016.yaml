  source_fidelity: 'முதன்மைச் செய்தி நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: οὖν-இன் முடிவுசார் தொடர்பும், உணவு/பானம் மற்றும் புனித நாள்காட்டி சார்ந்தவற்றின் அடிப்படையில் பிறர் தீர்ப்பிடக் கூடாது என்ற கட்டளையும் தெளிவாக உள்ளன. ஆனால் νουμηνίας என்பதற்கு ‘அமாவாசை விழா’ என மொழிபெயர்ப்பது மூலத்தில் இல்லாத ‘விழா’ என்ற சொல்லைச் சேர்க்கிறது; σαββάτων என்பதற்கு ‘ஓய்வுநாட்கள்’ என்பது சபத்து அடையாளத்தைப் பொதுமைப்படுத்துகிறது.'
  naturalness: ‘யாரும் உங்களைத் தீர்ப்பிட விடாதீர்கள்’ என்பது தமிழில், தீர்ப்பிடுபவரை வாசகர் அனுமதிக்கவோ தடுக்கவோ முடியும் என்ற சற்றே இயல்பற்ற செயப்படுநிலையை உருவாக்குகிறது. ‘யாரும் உங்களுக்குத் தீர்ப்பு வழங்க வேண்டாம்’ என்பது மூலக் கட்டளையை நவீனத் தரமான தமிழில் நேரடியாகத் தருகிறது.
