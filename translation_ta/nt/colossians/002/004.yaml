  text: ⸀τοῦτο λέγω ἵνα ⸀μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: ta
  text: நம்பவைக்கும் வாதத்தால் யாரும் உங்களை ஏமாற்றிவிடாதபடி நான் இதைச் சொல்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பத்தகுந்ததுபோல் தோன்றும் வாதத்தால்” அல்லது “நம்பத்தகுந்ததுபோல் தோன்றும் பேச்சால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο λέγω
  choice: நான் இதைச் சொல்கிறேன்
  rationale: τοῦτο என்ற ஒருமைச் சுட்டுப்பெயர் முந்தைய கூற்றையோ கருத்தோட்டத்தையோ சுட்டுகிறது; அதன் பரப்பை தேவையின்றி குறிப்பாக்காமல் ‘இதை’ என்று மொழிபெயர்க்கப்படுகிறது. λέγω என்பதன் நிகழ்கால நேரடித்தன்மையை ‘சொல்கிறேன்’ இயல்பாகத் தருகிறது.
- source_word: ἵνα μηδεὶς ὑμᾶς παραλογίζηται
  choice: யாரும் உங்களை ஏமாற்றிவிடாதபடி
  rationale: ἵνα இங்கு நோக்கத்தை அறிமுகப்படுத்துகிறது. παραλογίζηται என்பது தவறான காரணவாதத்தின் மூலம் வழிதவறச் செய்வதை அல்லது ஏமாற்றுவதை குறிக்கிறது; ‘ஏமாற்றிவிடாதபடி’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐν πιθανολογίᾳ
  choice: நம்பவைக்கும் வாதத்தால்
  rationale: ἐν இங்கு கருவி அல்லது முறையைக் குறிக்கிறது. πιθανολογία கேட்பவரை நம்பவைக்கக்கூடிய அல்லது உண்மையாகத் தோன்றக்கூடிய பேச்சு/வாதத்தைக் குறிக்கிறது. ‘நம்பவைக்கும் வாதம்’ அதன் தாக்கத்தைத் தெரிவிக்கிறது; அந்த வாதம் உண்மையானது என்று தீர்மானிப்பதில்லை.
theological_decisions:
- issue: παραλογίζηται ἐν πιθανολογίᾳ என்ற எச்சரிக்கையின் தன்மை
  choice: நம்பவைக்கும் வாதத்தின் மூலம் ஏமாற்றப்படுவதற்கு எதிரான பொதுவான எச்சரிக்கை
  alternative: இது குறிப்பாக ஒரு குறிப்பிட்ட பொய்த் தத்துவத்திற்கோ வெறும் சொல்வன்மைக்கோ எதிரான எச்சரிக்கை என்று மொழிபெயர்த்தல்
  rationale: இந்த வசனம் குறிப்பிட்ட கொள்கை அமைப்பை பெயரிடாமல், நம்பவைக்கும் வாதத்தால் ஏற்படும் ஏமாற்றத்தையே எச்சரிக்கிறது. ஆகவே சூழலைவிட அதிகமாகப் பொருளைக் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை. கிரேக்க வாக்கியத்தின் நோக்கத் தொடர்பு தமிழில் இயல்பாக அமைய வாக்கிய உறுப்புகளின் வரிசை மாற்றப்பட்டுள்ளது.
