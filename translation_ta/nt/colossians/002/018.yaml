source:
  edition: SBLGNT
  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: ta
  text: தாழ்மையிலும் தேவதூதர்களை வழிபடுவதிலும் விருப்பம் கொண்டு, தான் கண்டவற்றில் ஆழ்ந்து ஈடுபட்டு[c][b], தன் மாம்சத்தின் சிந்தையால் வீணாக இறுமாப்படைகிற எவனும் உங்களைப் பரிசிலிருந்து விலக்கிவிட இடங்கொடுக்காதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் ‘தான் கண்டவை’ என்பதற்குப் பதிலாக ‘தான் காணாதவை’ என்று உள்ளது; அதன்படி, ‘தான் காணாதவற்றைக் குறித்து விரிவாகப் பேசிக்கொண்டு’ என்பது போன்ற பொருள் கிடைக்கும்.
    reason: textual_variant
  - marker: c
    text: ‘ஆழ்ந்து ஈடுபட்டு’ என்பதற்கான கிரேக்க வினை அரிதானதும் பொருள் உறுதியாகத் தெரியாததுமாகும். இதனை ‘தான் கண்டவற்றில் தங்கியிருந்து’ என்றோ, ‘தான் கண்டவற்றுக்குள் நுழைந்து’ என்றோ மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβραβευέτω
  choice: உங்களைப் பரிசுக்குத் தகுதியற்றவர்கள் என்று தீர்ப்பளிக்க இடங்கொடுக்காதீர்கள்
  rationale: இந்த வினை நடுவர் ஒருவருக்கு எதிராகத் தீர்ப்பளித்து பரிசை இழக்கச் செய்வதைச் சுட்டுகிறது. தமிழில் ‘தகுதி நீக்கம்’ என்ற நிர்வாகச் சொல்லைவிட, பரிசுடன் உள்ள தொடர்பையும் தீர்ப்பின் தன்மையையும் இவ்வாக்கியம் தெளிவாகப் பாதுகாக்கிறது.
- source_word: θέλων ἐν
  choice: விருப்பம் கொண்டு
  rationale: பெயரிடப்பட்ட சமய நடைமுறைகளில் அந்த நபர் கொண்டுள்ள விருப்பம் அல்லது இன்பத்தை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் மனவுறுதியென மட்டும் பொருள் குறுக்கப்படவில்லை.
- source_word: ταπεινοφροσύνῃ
  choice: தாழ்மையில்
  rationale: அடிப்படைப் பொருளான ‘தாழ்மை’ பாதுகாக்கப்படுகிறது. சூழலில் அது போலியான அல்லது தன்னைத்தானே தாழ்த்தும் பக்தியாக இருக்கலாம் என்ற மதிப்பீடு மொழிபெயர்ப்புக்குள் கட்டாயமாகச் சேர்க்கப்படவில்லை.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: தேவதூதர்களை வழிபடுவதில்
  rationale: வேற்றுமைத் தொடர்பை வழிபாட்டின் இலக்காகத் தேவதூதர்கள் இருப்பதாக வாசிப்பது பொதுவானதும் சூழலுக்குப் பொருத்தமானதும். பிற இலக்கண வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: தான் கண்டவற்றில் ஆழ்ந்து ஈடுபட்டு
  rationale: அரிதான ἐμβατεύω என்ற வினையின், கண்டதாகக் கூறும் அனுபவங்களில் நுழைந்து அவற்றில் கவனம் செலுத்துதல் என்ற சாத்தியமான பொருளை, மிகையாக விளக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: εἰκῇ
  choice: வீணாக
  rationale: அந்த இறுமாப்பு ஆதாரமற்றதும் பயனற்றதும் என்பதைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: φυσιούμενος
  choice: இறுமாப்படைகிற
  rationale: ‘ஊதிப்பெருக்கப்படுதல்’ என்ற உருவகத்தின் சூழல்சார் பொருளான தற்பெருமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: νοὸς τῆς σαρκὸς αὐτοῦ
  choice: தன் மாம்சத்தின் சிந்தையால்
  rationale: νοῦς என்பதற்கு ‘சிந்தை’ என்றும் σάρξ என்பதற்கு ‘மாம்சம்’ என்றும் வழங்கி, பவுலின் சற்றுக் கடினமான மானிடவியல் சொற்றொடரையும் அதன் இறையியல் அழுத்தத்தையும் விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: θρησκείᾳ τῶν ἀγγέλων என்பதிலுள்ள வேற்றுமைத் தொடர்பு
  choice: தேவதூதர்களை நோக்கிய வழிபாடு
  alternative: தேவதூதர்கள் செலுத்தும் வழிபாடு; தேவதூதர்களோடு சேர்ந்து வழிபடுதல்
  rationale: இலக்கண அமைப்பு ஒன்றுக்கு மேற்பட்ட பொருளை அனுமதிக்கிறது. முதன்மை உரை சூழலுக்குப் பொருத்தமான பொதுவான வாசிப்பைத் தருகிறது; உறுதியற்ற தன்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
- issue: τῆς σαρκὸς αὐτοῦ என்பதில் σάρξ-ன் பொருள்
  choice: தன் மாம்சத்தின் சிந்தை
  alternative: தன் பாவ இயல்பின் சிந்தை; தன் உலகியலான சிந்தை
  rationale: ‘மாம்சம்’ என்ற சொல் பவுலின் கருத்திலுள்ள மானிடவியல் மற்றும் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது; ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை மூலச் சொல்லுக்குப் பதிலாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: ἃ ἑόρακεν என்ற உரை வேறுபாடு
  choice: தான் கண்டவை
  alternative: தான் காணாதவை
  rationale: SBLGNT முதன்மை உரையை மொழிபெயர்க்கிறது. ‘காணாதவை’ என்று வாசிக்கும் கையெழுத்துப் பிரதிகளின் சான்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்கத்தக்க நடையைப் பயன்படுத்துகிறது. வசனத்தின் நீண்ட பங்கேற்புச் சொற்றொடர் தமிழில் தெளிவாக அமைய, எச்சவினைத் தொடர்கள் முன்னிலும் முக்கிய எச்சரிக்கை இறுதியிலும் வைக்கப்பட்டுள்ளது. ‘மாம்சத்தின் சிந்தை’ இயல்பாகச் சற்றுக் கடினமாக இருந்தாலும், மூலத்தின் நோக்கமுள்ள இறையியல் பதற்றத்தைப் பாதுகாப்பதற்காகத் தக்கவைக்கப்பட்டுள்ளது.
