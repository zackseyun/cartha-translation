id: COL.2.12
reference: Colossians 2:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: ta
  text: திருமுழுக்கில் அவரோடு அடக்கம் செய்யப்பட்ட நீங்கள், இறந்தோரிலிருந்து அவரை எழுப்பிய கடவுளின் செயலாற்றல்மேல் கொண்ட விசுவாசத்தின்[b] வழியாக, அதிலேயே[a] நீங்களும் அவரோடு எழுப்பப்பட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதிலேயே’ என்பதற்குப் பதிலாக, இங்குள்ள தொடர்புப்பெயர் மேசியாவைக் குறிப்பதாக எடுத்தால், ‘அவரிலேயே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘விசுவாசம்’ என்பதற்கு ‘நம்புதல்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சில சூழல்களில் ‘உண்மைத்தன்மை’ என்ற பொருளையும் தரலாம்; ஆனால் இங்கு ‘விசுவாசம்’ என்பதே முதன்மையான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: அவரோடு அடக்கம் செய்யப்பட்ட நீங்கள்
  rationale: இறந்தகாலச் செயலின் நிறைவை உணர்த்தும் passive participle-ஐ இயல்பான தமிழில் பெயரெச்சத் தொடராகக் கொடுத்து, συν- என்பதன் ‘அவரோடு’ என்ற இணைப்பையும் காக்கிறது.
- source_word: ἐν τῷ βαπτισμῷ
  choice: திருமுழுக்கில்
  rationale: ἐν என்பதின் இடம்/வழிமுறை சார்ந்த நெகிழ்வை ‘-இல்’ காக்கிறது. βαπτισμός என்பதற்கு நவீனத் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் புரியக்கூடிய ‘திருமுழுக்கு’ பயன்படுத்தப்படுகிறது; ஒரு குறிப்பிட்ட சடங்கியல் கோட்பாட்டை மொழிபெயர்ப்பு திணிக்கவில்லை.
- source_word: ἐν ᾧ
  choice: அதிலேயே
  rationale: அருகிலுள்ள முன்னிடையான βαπτισμῷ-ஐச் சுட்டும் முதன்மையான இலக்கணத் தொடர்பைத் தக்கவைக்கிறது; καί தரும் ‘மேலும்/அதே சூழலில்’ என்ற அழுத்தத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συνηγέρθητε
  choice: அவரோடு எழுப்பப்பட்டீர்கள்
  rationale: aorist passive indicative-ஐ இறந்தகாலச் செயப்பாட்டு வடிவில் கொடுத்து, συν- என்பதிலுள்ள ‘உடன்’ என்ற பொருளை ‘அவரோடு’ மூலம் வெளிப்படுத்துகிறது.
- source_word: διὰ τῆς πίστεως
  choice: விசுவாசத்தின் வழியாக
  rationale: διά + genitive குறிக்கும் வழிமுறையை ‘வழியாக’ வெளிப்படுத்துகிறது. இச்சூழலில் πίστις-க்கு ‘விசுவாசம்’ முதன்மைப் பொருள்; ‘நம்பிக்கை/நம்புதல்’ என்பதும் சாத்தியமான மொழிபெயர்ப்பு.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: கடவுளின் செயலாற்றல்மீது
  rationale: πίστις உடன் வரும் genitive தொடரை தமிழில் இயல்பாக ‘...மீது வைத்த விசுவாசம்’ என அமைக்கிறது. ἐνέργεια என்பது வெறும் ஆற்றலை மட்டுமல்ல, செயல்படும் வல்லமையைக் குறிப்பதால் ‘செயலாற்றல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: அவரை இறந்தோரிலிருந்து எழுப்பிய
  rationale: கடவுளை விவரிக்கும் articular participle-ஐ இயல்பான தமிழ்ப் பெயரெச்சத் தொடராக அளிக்கிறது; ἐκ νεκρῶν என்பதன் உயிர்த்தெழுதல் மொழியை ‘இறந்தோரிலிருந்து’ எனத் துல்லியமாகக் காக்கிறது.
theological_decisions:
- issue: ἐν ᾧ என்பதன் முன்னிடை
  choice: திருமுழுக்கைச் சுட்டும் ‘அதிலேயே’
  alternative: மேசியாவைச் சுட்டும் ‘அவரிலேயே’
  rationale: உடனடியான இலக்கண முன்னிடை βαπτισμῷ என்பதால் முதன்மை உரையில் திருமுழுக்கே சுட்டப்படுகிறது. ஆயினும் வடிவியல் ரீதியாக ‘அவரில்’ என்ற புரிதல் சாத்தியமுள்ளதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: திருமுழுக்கும் உயிர்த்தெழுப்பப்படுதலும் இடையிலான தொடர்பு
  choice: திருமுழுக்கு, கிறிஸ்துவோடு அடக்கம் செய்யப்படுதல் மற்றும் எழுப்பப்படுதல், விசுவாசம் ஆகியவற்றை உரை கூறும் வலுவான தொடர்போடு வைத்தல்
  alternative: முழுக்க முழுக்க சடங்குசார் காரணவியல் அல்லது வெறும் அடையாளவியல் என்று விளக்குதல்
  rationale: கிரேக்க உரை இவற்றை நெருக்கமாக இணைக்கிறது; ஆனால் பிற்காலத் திருச்சபை மரபுகளின் குறிப்பிட்ட sacramental அல்லது symbolic கோட்பாட்டைத் தீர்மானிப்பதில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தையும் திறந்த நிலையையும் காக்கிறது.
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்புதல்; இங்கு வாய்ப்பு குறைவாக ‘உண்மைத்தன்மை’
  rationale: διὰ τῆς πίστεως என்ற அமைப்பிலும் கடவுளின் செயலாற்றலை நோக்கிய தொடர்பிலும் ‘விசுவாசம்’ முதன்மையான வாசிப்பு. ‘நம்புதல்’ பொருளையும் அடிக்குறிப்பு தெரிவிக்கிறது; ‘உண்மைத்தன்மை’ இச்சூழலில் குறைவாக இயல்பானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் உறவுகளைத் தெளிவாக வைத்திருக்க தமிழ்ச் சொல்வரிசை மாற்றப்பட்டுள்ளது. ‘திருமுழுக்கு’, ‘விசுவாசம்’, ‘எழுப்பப்பட்டீர்கள்’ ஆகியவை பரவலாக அறியப்படும் வேதாகமச் சொற்களாக இருப்பினும், எந்த ஒரு பிரிவின் தனிப்பட்ட கோட்பாட்டையும் உரைக்குள் சேர்க்கவில்லை. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
