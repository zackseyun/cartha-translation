source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: ta
  text: ஆட்சியாளர்களையும் அதிகாரங்களையும் ஆயுதம் களைந்து[a], அவர்களை வெளிப்படையாகக் காட்சிப்படுத்தினார்; அவரில்[b] அவர்களை வெற்றி ஊர்வலத்தில் நடத்திச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை உரித்தெடுத்து/களைந்து.”
    reason: ἀπεκδυσάμενος என்பதற்கு ‘ஆயுதம் களைதல்’ என்ற பொருளும், உடை அல்லது உரிமையை உரித்தெடுத்தல்/களைதல் என்ற உருவகப் பொருளும் சாத்தியமானவை.
  - marker: b
    text: “அவரில்” என்பது கிறிஸ்துவைக் குறிக்கலாம்; அல்லது, “அதில்/அதன் மூலம்” என்று மொழிபெயர்த்து, முந்தைய வசனத்தில் கூறப்படும் சிலுவையைக் குறிப்பதாகப் புரிந்துகொள்ளலாம்.
    reason: ἐν αὐτῷ-இல் உள்ள αὐτῷ என்பது இலக்கண ரீதியாக ஆண்பால் அல்லது அஃறிணைப் பாலாக இருக்கலாம். எனவே கிறிஸ்துவையோ, σταυρῷ (‘சிலுவை’) என்பதையோ சுட்டும் புரிதல் சாத்தியமாகிறது.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: ஆயுதமற்றவர்களாக்கி
  rationale: இச்சூழலில் பகைமை கொண்ட ஆட்சிகளையும் அதிகாரங்களையும் வலிமையிழக்கச் செய்ததைக் குறிக்கும் ‘disarmed’ என்ற பொருள் இயல்பாகப் பொருந்துகிறது; வினைச்சொல்லில் உள்ள ‘உரித்துப்போடுதல்’ என்ற உருவக நிழல் குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: ஆட்சியாளர்களையும் அதிகாரங்களையும்
  rationale: இரு சொற்களையும் தனித்தனியாகக் காத்து, இச்சூழலில் குறிப்பிடப்படும் ஆவிக்குரிய/விண்ணுலக அதிகார வல்லமைகளை ஒரு குறிப்பிட்ட கோட்பாட்டால் சுருக்காமல் விடுகிறது.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: அவர்களை அனைவருக்கும் முன்பாக அவமானத்துக்குள்ளாக்கினார்
  rationale: பொதுவில் வெளிப்படுத்திக் கேவலப்படுத்துதல் என்ற கூட்டு எண்ணத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: θριαμβεύσας αὐτούς
  choice: அவர்களை வெற்றி ஊர்வலத்தில் நடத்தினார்
  rationale: வெற்றிபெற்றவர் தோற்கடிக்கப்பட்டவர்களைப் பொதுவான வெற்றி ஊர்வலத்தில் கைதிகளாக நடத்திச் செல்லும் உருவகத்தைப் பாதுகாக்கிறது; வெறுமனே ‘வென்றார்’ என்று பலவீனப்படுத்தவில்லை.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: கொடுக்கப்பட்ட ஆலோசனை உரையின் ‘in him’ வாசிப்பைப் பின்பற்றுகிறது; அதேவேளையில் கிரேக்க வடிவம் ‘அதில்/அதன் மூலம்’ என்றும் புரிந்துகொள்ளப்படக்கூடியதால் அந்த உண்மையான தெளிவின்மை குறிப்பில் வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: ἐν αὐτῷ என்பதன் சுட்டுப்பொருள்
  choice: அவரில்—கிறிஸ்துவைக் குறிப்பதாக முதன்மை உரையில் மொழிபெயர்க்கப்பட்டது
  alternative: அதில்/அதன் மூலம்—முந்தைய வசனத்திலுள்ள சிலுவையைக் குறிப்பதாகப் புரிந்துகொள்ளலாம்
  rationale: αὐτῷ என்ற வடிவம் ஆண்பால் அல்லது அஃறிணை ஒருமையாக இருக்க முடியும். ஆகவே கிறிஸ்துவையும் சிலுவையையும் சார்ந்த இரு புரிதல்களும் இலக்கண ரீதியில் சாத்தியம்; முதன்மை உரை ஒன்றைத் தேர்ந்தெடுத்தாலும் மற்றதை மறைக்கவில்லை.
- issue: செயலின் எழுவாய்
  choice: முந்தைய வசனங்களின் தொடர்ச்சிப்படி தேவன் எனப் புரிந்துகொள்ளப்படுகிறது; ஆனால் இவ்வசனத்தில் பெயரைச் சேர்க்கவில்லை
  alternative: கிறிஸ்துவை எழுவாயாக வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்க வசனத்தில் எழுவாய் வெளிப்படையாக இல்லை. சூழல் அதை வழங்குவதால், விளக்கமாக ஒரு பெயரைச் சேர்த்து தெளிவின்மையைத் தீர்க்காமல் வினை வடிவை அப்படியே வைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘வெற்றி ஊர்வலம்’ என்ற சொற்றொடர் ரோம வெற்றி அணிவகுப்பின் உருவகத்தை விளக்கவுரை இன்றி உணர்த்துகிறது; தேவையற்ற சமயப் பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
