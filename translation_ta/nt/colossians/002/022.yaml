revisions:
- from: இவையெல்லாம் பயன்படுத்தப்படும்போதே அழிந்துபோகிறவை[a]—மனிதர்களின் கட்டளைகளையும் போதனைகளையும் அடிப்படையாகக் கொண்டவை[b].
  to: இவையெல்லாம் பயன்படுத்தப்படுவதால் அழிவுக்குரியவை[a]; மனிதர்களின் கட்டளைகளுக்கும் போதனைகளுக்கும் ஏற்ப உள்ளவை[b] அல்லவா?
  rationale: The revision preserves the perishable/consumable sense of εἰς φθορὰν τῇ ἀποχρήσει, renders κατά with the less interpretively loaded “ஏற்ப,” and restores the rhetorical-question form indicated by the source punctuation. The footnotes retain the legitimate lexical and intertextual information while avoiding overstatement.
