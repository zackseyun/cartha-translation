id: COL.2.22
reference: Colossians 2:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: ta
  text: இவையெல்லாம் பயன்படுத்தப்படுவதால் அழிவுக்குரியவை[a]; மனிதர்களின் கட்டளைகளுக்கும் போதனைகளுக்கும் ஏற்ப உள்ளவை[b] அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயன்படுத்தித் தீர்ப்பதில் அழிவுக்குரியவை.” கிரேக்கச் சொல் பயன்பாட்டில் நுகர்ந்து தீர்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மனிதர்களின் கட்டளைகளும் போதனைகளும்” என்பது ஏசாயா 29:13-ஐ எதிரொலிக்கக்கூடும். இந்த வசனம் 2:20-ல் தொடங்கும் கேள்வியின் ஒரு பகுதியாகும்.
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: இவையெல்லாம் … அழிந்துபோகிறவை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தொடக்கூடாத, சுவைக்கக்கூடாத, தீண்டக்கூடாத பொருட்களைச் சுட்டுகிறது. கிரேக்கப் பன்மையை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: εἰς φθοράν
  choice: அழிந்துபோகிறவை
  rationale: φθορά என்பது அழிவு, சிதைவு ஆகிய பொருள்களைத் தரலாம். இங்கு பயன்பாட்டில் தீர்ந்துபோகும் பொருட்களைப் பற்றிய சூழலில் ‘அழிந்துபோகிறவை’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: τῇ ἀποχρήσει
  choice: பயன்படுத்தப்படும்போதே
  rationale: ἀπόχρησις பயன்பாடு மட்டுமல்ல, பயன்படுத்தித் தீர்த்தல் அல்லது நுகர்தல் என்ற நுண்பொருளையும் கொண்டுள்ளது. ‘பயன்படுத்தப்படும்போதே’ என்பது பயன்பாட்டினூடே அவை அழிகின்றன என்ற தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κατὰ
  choice: அடிப்படையாகக் கொண்டவை
  rationale: இங்கு மனிதக் கட்டளைகளும் போதனைகளும் அந்த ஒழுங்குமுறைகளின் அளவுகோலும் மூலமும் என்பதைச் சூழலுக்கேற்ற தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐντάλματα
  choice: கட்டளைகள்
  rationale: அதிகாரபூர்வமான ஒழுங்குவிதிகள் என்ற பொருளைக் காக்கிறது; ஏசாயா 29:13-இன் சொல்லாட்சியையும் நினைவூட்டுகிறது.
- source_word: διδασκαλίας
  choice: போதனைகள்
  rationale: பிற்காலக் கோட்பாட்டு நுண்பொருளைத் திணிக்காமல், கற்பிக்கப்படும் கருத்துகள் அல்லது அறிவுரைகள் என்ற பொதுவான பொருளை வழங்குகிறது.
- source_word: τῶν ἀνθρώπων
  choice: மனிதர்களின்
  rationale: ἀνθρώπων இங்கு மனித மூலத்தைச் சுட்டி, கடவுளிடமிருந்து வருவதற்கு மாறானதை வலியுறுத்துகிறது. ‘மனிதர்களின்’ என்பது பாலின வரம்பில்லாத துல்லியமான நவீனத் தமிழ்.
theological_decisions:
- issue: துறவற ஒழுங்குவிதிகளுக்கும் அழிந்துபோகும் பொருட்களுக்கும் இடையிலான தொடர்பு
  choice: அழிந்துபோகிறவை என்பது முதன்மையாகத் தடைசெய்யப்பட்ட பொருட்களைக் குறிக்கிறது; அவற்றைப் பற்றிய ஒழுங்குவிதிகள் மனிதக் கட்டளைகளையும் போதனைகளையும் அடிப்படையாகக் கொண்டவை.
  alternative: இந்தக் கூற்றை, பயன்பாட்டில் அழியும் பொருட்களையே பற்றிக் கவலைப்படும் ஒழுங்குவிதிகளை இன்னும் கூர்மையாக நிராகரிப்பதாக வாசிக்கலாம்.
  rationale: ἅ என்ற இடைச்சொல் இயல்பாக முந்தைய பொருட்களைச் சுட்டுகிறது. அதேவேளையில், κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων என்பது அந்த விதிகளின் மனித மூலத்தை விமர்சிக்கிறது. மொழிபெயர்ப்பு இவ்விரு அழுத்தங்களையும் வைத்திருக்கிறது.
- issue: வசன முடிவிலுள்ள கேள்விக்குறியின் தொடர்பு
  choice: தனியாக வாசிக்கப்படும் வசனத்தில் விளக்கக் கூற்றாக வழங்கப்பட்டுள்ளது; இது 2:20-ல் தொடங்கிய வினாவின் ஒரு பகுதியாகப் புரிந்துகொள்ளப்பட வேண்டும்.
  alternative: வசனத்தின் முடிவில் நேரடியாகக் கேள்விக்குறி இடலாம்.
  rationale: SBLGNT நிறுத்தக்குறியீட்டின்படி 2:20–22 முழுவதும் ஒரு வினாவாக அமைகிறது. ஆனால் 2:22 மட்டும் தமிழில் துண்டாகக் கொடுக்கப்படும்போது கேள்விக்குறி அதன் சொந்தச் சொற்றொடரைத் தவறாக வினாவாக்கலாம்; ஆகவே தொடரமைப்பை அடிக்குறிப்பில் விளக்குவது இயல்பானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பயன்படுத்தப்படும்போதே’ என்பது பொருட்கள் பயன்பாட்டிலேயே தீர்ந்து அழியும் நுண்பொருளை இயல்பாகக் காட்டுகிறது. நீண்ட கோடு இரண்டாம் பகுதி முதல் பகுதியை விளக்கும் தன்மையைத் தெளிவாக்குகிறது.
