  rationale: கொடுக்கப்பட்ட குறுகிய கிரேக்க வாசகத்தில் Χριστοῦ என்பது 'மறைபொருள்' என்பதற்கு இயைபாக நிற்பதாகப் புரிந்துகொள்ள முடிகிறது. தமிழ் வாக்கியம் முற்றிலும் குழப்பமாகாமல் இருக்க ‘ஆகிய’ பயன்படுத்தப்பட்டுள்ளது; அதேவேளையில் வேறுபட்ட கையெழுத்துப் பிரதிகளின் விரிவான வாசகம் முதன்மை உரைக்குள் கொண்டுவரப்படவில்லை.
- issue: ἐπίγνωσις என்பதின் தீவிரப் பொருள்
  choice: முழுமையாக அறிந்துகொள்ளுதல்
  alternative: அறிந்துகொள்ளுதல்
  rationale: சொல் ஆழ்ந்த அல்லது நிறைவான அறிவைக் குறிக்கக்கூடியதால் அந்த நுணுக்கம் முதன்மை உரையில் தெரிவிக்கப்பட்டுள்ளது; இது மறைஞானம் போன்ற தனிப்பட்ட சமயக் கருத்தைச் சேர்ப்பதில்லை.
