  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதயங்கள்’, ‘செல்வம்’, ‘மறைபொருள்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியத்தின் இலக்கு அமைப்பு தமிழில் ‘அடையவும் … அறிந்துகொள்ளவும்’ என்று இயல்பாக்கப்பட்டுள்ளது.
