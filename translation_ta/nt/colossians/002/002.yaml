translation:
  language: ta
  text: அவர்களுடைய இதயங்கள் ஊக்கமடையவும்[a], அவர்கள் அன்பில் ஒன்றிணைக்கப்பட்டு, புரிந்துணர்வின் நிறைவான உறுதியின் எல்லாச் செல்வத்தையும் பெற்று, கடவுளின் மறைபொருளான மேசியாவைப் பற்றிய அறிவை அடையவும்[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆறுதலடையவும்” அல்லது “உறுதிப்படுத்தப்படவும்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் இங்கு உள்ளார்ந்த ஊக்கத்தையும் வலிமைப்படுத்துதலையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொல் ஆழ்ந்த அல்லது நிறைவான அறிவைக் குறிக்கக்கூடும்; எனவே “முழுமையான அறிவை அடையவும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்க வாசகம் சுருக்கமாக, “கடவுளின் மறைபொருள், மேசியா” என்று உள்ளது. இம்மொழிபெயர்ப்பு மேசியாவையே கடவுளின் மறைபொருளாக அடையாளப்படுத்தும் இயைபுறவாக இதைப் புரிந்துகொள்கிறது.
    reason: alternative_reading
  - marker: d
    text: சில கையெழுத்துப் பிரதிகளில் “கடவுளின், அதாவது பிதாவின், மற்றும் மேசியாவின் மறைபொருள்” என்பது போன்ற நீண்ட வாசகங்கள் உள்ளன. இங்கு கொடுக்கப்பட்டுள்ள கிரேக்க உரையின் குறுகிய வாசகமே பின்பற்றப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
  choice: ஊக்கமடையவும்
  rationale: இச்சூழலில் உள்ளார்ந்த ஆறுதல், உறுதிப்படுத்தல், ஊக்கம் ஆகியவற்றை உள்ளடக்கும் பரந்த பொருளை இது இயல்பாகத் தருகிறது.
