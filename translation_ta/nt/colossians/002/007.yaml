source:
  edition: SBLGNT
  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: ta
  text: அவரில் வேரூன்றியவர்களாகவும், அவரில் கட்டியெழுப்பப்பட்டு வருகிறவர்களாகவும், நீங்கள் கற்பிக்கப்பட்டபடியே விசுவாசத்தில்[a] உறுதிப்படுத்தப்பட்டு வருகிறவர்களாகவும், நன்றி செலுத்துதலில் பெருகுகிறவர்களாகவும் இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நம்பிக்கையில்’ என்றும் மொழிபெயர்க்கலாம்; ‘உண்மைத்தன்மையில்’ என்பதும் சொல்லளவில் சாத்தியம். இங்கே ‘நீங்கள் கற்பிக்கப்பட்டபடியே’ என்ற தொடர், அவர்கள் கற்பிக்கப்பட்ட விசுவாசத்தைக் குறிப்பதாகத் தோன்றுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: வேரூன்றப்பட்டவர்களாகவும்
  rationale: நிறைவேற்றப்பட்ட செயலும் அதன் தொடரும் விளைவும் அடங்கிய நிறைவுக்காலச் செயப்பாட்டு வினையெச்சத்தின் பொருளைப் பாதுகாக்கிறது; வேளாண்மை உருவகமும் தக்கவைக்கப்படுகிறது.
- source_word: ἐποικοδομούμενοι
  choice: கட்டியெழுப்பப்பட்டு வருகிறவர்களாகவும்
  rationale: தொடர்ந்து நடைபெறும் செயலைக் குறிக்கும் நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தையும் கட்டட உருவகத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: முந்தைய சூழலில் கிறிஸ்துவைக் குறிக்கும் ஆண்பால் ஒருமைப் பிரதிப்பெயரை, பெயர் அல்லது பட்டமாக விரித்துரைக்காமல் தக்கவைக்கிறது.
- source_word: βεβαιούμενοι
  choice: உறுதிப்படுத்தப்பட்டு வருகிறவர்களாகவும்
  rationale: ஒருவர் உறுதியானவராக ஆக்கப்படுதல் என்ற செயப்பாட்டுப் பொருளையும் தொடர்ந்து நடைபெறும் நிலையையும் தக்கவைக்கிறது.
- source_word: τῇ πίστει
  choice: விசுவாசத்தில்
  rationale: இடப்பொருள்/தளப்பொருள் கொண்ட ἐν என்ற முன்சொல் இங்கு முன் வினையெச்சத்திலிருந்து தொடர்வதாகப் புரிந்துகொள்ளப்படுகிறது. குறிப்புச் சுட்டியுடன் வரும் πίστις, அடுத்து வரும் கற்பித்தலைக் குறிக்கும் சொற்றொடரால், அவர்கள் கற்றுக்கொண்ட விசுவாசச் செய்தி அல்லது விசுவாசத்தின் தளத்தைக் குறிக்க வாய்ப்பு அதிகம்.
- source_word: καθὼς ἐδιδάχθητε
  choice: நீங்கள் கற்பிக்கப்பட்டபடியே
  rationale: καθώς என்பதன் ஒப்பீட்டு வலிமையையும், செயப்பாட்டு வடிவில் உள்ள முந்தைய போதனையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: περισσεύοντες
  choice: நிரம்பி வழிகிறவர்களாகவும்
  rationale: மிகுதியாக இருத்தல் அல்லது பொங்கி வழிதல் என்ற நிகழ்கால வினையெச்சத்தின் உயிரோட்டமுள்ள உருவகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν εὐχαριστίᾳ
  choice: நன்றி செலுத்துவதில்
  rationale: வெறும் மனநிலையான நன்றியுணர்வை விட, εὐχαριστία குறிக்கும் நன்றி தெரிவித்தலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τῇ πίστει என்பதன் பொருள்
  choice: கற்பிக்கப்பட்ட விசுவாசச் செய்தி அல்லது விசுவாசத் தளம்
  alternative: தனிப்பட்ட நம்பிக்கை; விசுவாசத்தால்; உண்மைத்தன்மையில்
  rationale: குறிப்புச் சுட்டியும் ‘நீங்கள் கற்பிக்கப்பட்டபடியே’ என்ற தொடரும், தனிப்பட்ட நம்பிக்கைச் செயலை மட்டும் விட கற்பிக்கப்பட்ட விசுவாசத்தின் உள்ளடக்கம் அல்லது தளத்தையே சுட்டுகின்றன. இருப்பினும் πίστις என்பதன் பொருள் வரம்பையும் வேற்றுமைத் தொடர்பின் சாத்தியமான வேறு புரிதல்களையும் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. கிரேக்க வாக்கியத்தின் வினையெச்சத் தொடர் முந்தைய வசனத்தின் கட்டளையைச் சார்ந்திருப்பதால், தமிழில் பொருள் முழுமையடைய இறுதியில் ‘இருங்கள்’ சேர்க்கப்பட்டுள்ளது. பழைய அல்லது குறிப்பிட்ட சபை மரபைச் சுட்டக்கூடிய ‘ஸ்தோத்திரம்’ என்பதற்குப் பதிலாக ‘நன்றி செலுத்துதல்’ பயன்படுத்தப்பட்டுள்ளது.
