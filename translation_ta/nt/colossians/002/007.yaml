  naturalness: ‘வேரூன்றப்பட்டவர்களாகவும்’ என்பதற்குப் பதில் ‘வேரூன்றியவர்களாகவும்’ நவீனத் தமிழில் இயல்பாகவும், நிறைவேறிய செயல் தொடரும் நிலையைத் தெளிவாகவும் காட்டுகிறது. ‘நன்றி செலுத்துவதில் நிரம்பி வழிகிறவர்களாகவும்’ என்பதற்குப் பதில் ‘நன்றி செலுத்துதலில் பெருகுகிறவர்களாகவும்’ என்பது தமிழில் குறைவான கனத்துடன் மூலத்தின் ‘மிகுதியாக இருத்தல்’ பொருளைத் தருகிறது.
