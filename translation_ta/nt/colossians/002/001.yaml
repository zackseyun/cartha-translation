revisions:
- from: 'நீங்கள் இதை அறிந்துகொள்ள வேண்டும் என்று விரும்புகிறேன்: உங்களுக்காகவும், லவோதிக்கேயாவில் இருப்பவர்களுக்காகவும், என் முகத்தை நேரில்[a] கண்டிராத மற்ற அனைவருக்காகவும் நான் எவ்வளவு பெரிய போராட்டத்தை மேற்கொண்டிருக்கிறேன்!'
  to: ஏனெனில், உங்களுக்காகவும் லவோதிக்கேயாவில் இருப்பவர்களுக்காகவும் என் முகத்தை நேரில் கண்டிராத அனைவருக்காகவும் நான் எவ்வளவு பெரிய போராட்டம் மேற்கொள்கிறேன் என்பதை நீங்கள் அறிய வேண்டும் என்று விரும்புகிறேன்.
  rationale: The revision retains the source’s explanatory γάρ, present-tense statement of Paul’s struggle, and inclusive “all who” without adding “other.” It keeps the natural Tamil rendering “நேரில்” for physical presence and retains the literal alternative in the footnote.
  reviewer_model: gpt-5.6-terra
