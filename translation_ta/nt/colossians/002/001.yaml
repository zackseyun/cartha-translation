id: COL.2.1
reference: Colossians 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: ta
  text: ஏனெனில், உங்களுக்காகவும் லவோதிக்கேயாவில் இருப்பவர்களுக்காகவும் என் முகத்தை நேரில் கண்டிராத அனைவருக்காகவும் நான் எவ்வளவு பெரிய போராட்டம் மேற்கொள்கிறேன் என்பதை நீங்கள் அறிய வேண்டும் என்று விரும்புகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: நீங்கள் இதை அறிந்துகொள்ள வேண்டும் என்று விரும்புகிறேன்
  rationale: θέλω ... εἰδέναι என்பதன் நேரடியான விருப்பத்தையும் அறிவித்தலையும் இயல்பான நவீனத் தமிழில் தருகிறது. γάρ முந்தைய கருத்துக்கான விளக்கத் தொடர்பைக் காட்டுகிறது; தமிழில் இரட்டைப்புள்ளியும் வாக்கிய ஓட்டமும் அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: ἡλίκον ἀγῶνα ἔχω
  choice: நான் எவ்வளவு பெரிய போராட்டத்தை மேற்கொண்டிருக்கிறேன்
  rationale: ἡλίκον போராட்டத்தின் அளவையும் தீவிரத்தையும் வலியுறுத்துகிறது. ἀγών இங்கு விளையாட்டுப் போட்டியைக் காட்டிலும் கடுமையான முயற்சியையும் மனப்போராட்டத்தையும் குறிக்கிறது; “மேற்கொண்டிருக்கிறேன்” என்பது தொடரும் ஈடுபாட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களுக்காக
  rationale: ὑπέρ இங்கு வாசகர்களின் நன்மைக்காகவும் அவர்கள் சார்பாகவும் மேற்கொள்ளப்படும் போராட்டத்தைக் குறிக்கிறது.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: லவோதிக்கேயாவில் இருப்பவர்களுக்காகவும்
  rationale: கட்டுரையுடன் வரும் இடவுருபுத் தொடர் மனிதர்களைக் குறிக்கும் பெயர்ச்சொல் பயன்பாட்டைக் கொண்டுள்ளது; இத்தமிழாக்கம் அதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: கண்டிராத மற்ற அனைவருக்காகவும்
  rationale: ὅσοι என்பதன் உள்ளடக்கும் விரிவை “அனைவரும்” பாதுகாக்கிறது. முன் குறிப்பிடப்பட்ட குழுக்களோடு இந்த விரிவான குழுவின் தொடர்பைத் தெளிவாக்க “மற்ற” சேர்க்கப்பட்டுள்ளது.
- source_word: τὸ πρόσωπόν μου ἐν σαρκί
  choice: என் முகத்தை நேரில்
  rationale: πρόσωπον என்பதன் “முகம்” என்ற உருவகத்தைப் பாதுகாத்தபடியே, ἐν σαρκί இங்கு குறிக்கும் உடல்ரீதியான நேரடி சந்திப்பை இயல்பான தமிழில் “நேரில்” எனத் தருகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மறைபொருள் அல்லது ஒழுக்கப் பொருள் இல்லாத சூழலில் σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: நேரில்
  alternative: மாம்சத்தில்
  rationale: ἐν σαρκί இங்கு பாவ இயல்பைக் குறிக்காமல், பவுலை உடல்ரீதியாக நேருக்கு நேர் பார்த்திருப்பதைக் குறிக்கிறது. “மாம்சத்தில் என் முகத்தைக் கண்டிராத” என்பது தமிழில் இயல்பற்றதுடன் தவறான இறையியல் தொடர்பையும் உருவாக்கக்கூடும்; ஆகவே கருத்து முதன்மை உரையில் இயல்பாகவும், சொற்சொல்லான வடிவம் அடிக்குறிப்பிலும் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் போராட்ட உருவகம் பாதுகாக்கப்பட்டுள்ளது; இறுதியில் உள்ள வியப்புணர்வு ἡλίκον என்பதன் தீவிரத்தை இயல்பாக வெளிப்படுத்துகிறது.
