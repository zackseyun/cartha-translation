lexical_decisions:
- source_word: Μὴ … μηδὲ … μηδὲ
  choice: …ஆதே …ஆதே …ஆதே
  rationale: கிரேக்கத் தொடரிலுள்ள மறுப்புக் கட்டளைகளின் குவியும் வலிமையை இயல்பான தமிழில் மூன்று இணையான எதிர்மறை வினை வடிவங்களால் வெளிப்படுத்துகிறது.
- source_word: ἅψῃ
  choice: பற்றாதே
  rationale: ἅπτω என்பதன் ‘தொடு/பற்றிக்கொள்’ என்ற பொருள் வரம்பைத் தக்கவைத்து, பின்னர் வரும் θίγῃς என்பதற்கான ‘தொடாதே’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: γεύσῃ
  choice: சுவைக்காதே
  rationale: γεύομαι என்பதன் நேரடியான ‘சுவை’ என்ற பொருளைத் தருகிறது; சூழலுக்காக ‘சாப்பிடாதே’ என்று விரிவாக்கவில்லை.
- source_word: θίγῃς
  choice: தொடாதே
  rationale: θιγγάνω என்பதன் பொதுவான ‘தொடு’ என்ற பொருளை இயல்பான தமிழில் அளிக்கிறது.
theological_decisions:
- issue: சூழலில் இத்தடைகளின் இயல்பு
  choice: விளக்கச் சொற்கள் சேர்க்காமல், மேற்கோள் போன்ற சுருக்கமான மூன்று விதிகளாக மொழிபெயர்த்தல்
  alternative: ‘இதைப் பற்றாதே, அதைச் சுவைக்காதே’ எனப் பொருட்களைச் சேர்த்தல் அல்லது மனிதக் கட்டளைகள் என்று இவ்வசனத்திலேயே வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க வசனம் பொருட்களைக் குறிப்பிடாமல் திடீரென மூன்று தடைகளை மட்டும் தருகிறது. அந்தச் சுருக்கத்தையும் விளக்கப்படாத இறையியல் அழுத்தத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, நேரடியான தடைமொழி பயன்படுத்தப்பட்டுள்ளது. ‘பற்று’ என்பது இங்கு உடலால் பற்றுதல்/கையாளுதல் என்ற பொருளில் வருகிறது; மனப்பற்று என்ற பொருளல்ல. மூலத்தின் மேற்கோள் போன்ற திடீர் நடை பாதுகாக்கப்பட்டுள்ளது.
