  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: ta
  text: இவையெல்லாம் வரவிருப்பவற்றின் நிழலாக இருக்கின்றன; ஆனால் உடலோ[a] மேசியாவுக்குரியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உடல்’ என்பதை இங்கு ‘மெய்ப்பொருள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅ
  choice: இவையெல்லாம்
  rationale: முந்தைய வசனத்தில் சொல்லப்பட்ட உணவு, பானம், பண்டிகை, அமாவாசை, ஓய்வுநாள் ஆகியவற்றைச் சுட்டுகிறது. இயல்பான தமிழில் அந்தப் பன்மைச் சுட்டுதலைத் தெளிவாக வைத்திருக்கிறது.
- source_word: σκιὰ
  choice: நிழல்
  rationale: வரவிருக்கும் காரியங்களுக்கும் அவற்றை முன்னறிவிக்கும் நடைமுறைகளுக்கும் இடையிலான உருவக உறவை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τῶν μελλόντων
  choice: வரவிருப்பவற்றின்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல்லின் எதிர்கால நோக்கை வைத்திருக்கிறது; அவை எவை என்பதை மொழிபெயர்ப்பிலேயே குறுக்கித் தீர்மானிக்கவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: நிழலுக்கும் உடலுக்கும் இடையிலான எதிர்மறை ஒப்பீட்டை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: இச்சொல்லின் முதன்மையான, உருவகத்தைப் பாதுகாக்கும் பொருள். ‘நிழல்—உடல்’ என்ற மூலமொழி எதிரிணையை நேரடியாக வைத்திருக்கிறது; ‘மெய்ப்பொருள்’ என்ற விளக்க மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவுக்குரியது
  rationale: Χριστός இங்கு பட்டமாக இருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது. கிரேக்க உரையின் சுருக்கமான உடைமை வேற்றுமையை இயல்பான தமிழில் ‘மேசியாவுக்குரியது’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: σῶμα என்பது σκιά என்பதற்கு எதிராக எதைக் குறிக்கிறது?
  choice: மூல உருவகத்தைத் திறந்த நிலையில் வைக்க ‘உடல்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மெய்ப்பொருள்’ என மொழிபெயர்த்து, மேசியாவில் காணப்படும் முழுமையான யதார்த்தத்தை வெளிப்படையாகக் காட்டலாம்.
  rationale: ‘மெய்ப்பொருள்’ என்பது சூழலில் சாத்தியமான விளக்கம் என்றாலும், ‘உடல்’ என்பதே மூலச்சொல்லை நேரடியாகப் பிரதிபலித்து அதன் உருவகத்தையும் விளக்கத் திறந்த நிலையையும் காக்கிறது.
- issue: τοῦ Χριστοῦ என்ற உடைமை வேற்றுமை
  choice: ‘மேசியாவுக்குரியது’ என உடைமை அல்லது தொடர்பைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மேசியாவின் உடல்’ எனப் பெயர்த்தால், திருச்சபையை மேசியாவின் உடலாகக் குறிப்பிடுவதாக வாசிக்கப்படலாம்.
  rationale: வாக்கியத்தின் ‘நிழல்—உடல்’ எதிரிணையையும் சுருக்கமான கிரேக்க அமைப்பையும் காக்கும் அதேவேளையில், ஒரு குறிப்பிட்ட திருச்சபையியல் விளக்கத்தை மொழிபெயர்ப்பிலேயே கட்டாயப்படுத்தாமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இவையெல்லாம்’ முந்தைய வசனத்துடனான தொடர்பைத் தெளிவாக்குகிறது; ‘நிழல்—உடல்’ என்ற மூல உருவகம் திட்டமிட்டு நிலைநிறுத்தப்பட்டுள்ளது.
