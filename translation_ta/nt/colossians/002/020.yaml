source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: ta
  text: 'உலகத்தின் அடிப்படை நியதிகளிலிருந்து[a] நீங்கள் கிறிஸ்துவோடு இறந்தீர்கள் என்றால், உலகத்தில் வாழ்கிறவர்களைப் போல் ஏன் விதிமுறைகளுக்கு உட்படுகிறீர்கள்[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உலகத்தின் அடிப்படை ஆவிக்குரிய சக்திகளிலிருந்து’; வேறொரு சாத்தியம், ‘உலகத்தின் அடிப்படைக் கூறுகளிலிருந்து.’
    reason: στοιχεῖα என்பதன் விவாதத்திற்குரிய மாற்றுப் பொருள்களைப் பாதுகாக்கிறது.
  - marker: b
    text: அல்லது, ‘ஏன் விதிமுறைகளால் கட்டுப்படுத்தப்படுகிறீர்கள்?’
    reason: δογματίζεσθε என்பதன் செயப்பாட்டு நுணுக்கத்தை மாற்று மொழிபெயர்ப்பாகக் காட்டுகிறது.
lexical_decisions:
- source_word: Εἰ
  choice: என்றால்
  rationale: நிபந்தனை வடிவத்தைத் தக்கவைக்கிறது; பவுல் இது உண்மை எனக் கருதிப் பேசினாலும், ‘ஏனெனில்’ என்று மாற்றி அவரது சொல்லாட்சியை முன்கூட்டியே தீர்மானிக்கவில்லை.
- source_word: ἀπεθάνετε
  choice: இறந்தீர்கள்
  rationale: இறந்தகாலத்தில் நிகழ்ந்த தீர்மானமான சம்பவத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: σὺν Χριστῷ
  choice: கிறிஸ்துவோடு
  rationale: Χριστός என்பதன் பட்டப்பெயர்ச் சாரத்தைத் தக்கவைத்தபடி, நவீனத் தமிழ்க் கிறிஸ்தவ மொழிநடையில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: உலகத்தின் அடிப்படை நியதிகளிலிருந்து
  rationale: ἀπό குறிக்கும் பிரிவை ‘இலிருந்து’ வெளிப்படுத்துகிறது. στοιχεῖα என்பதன் அடிப்படைக் கூறுகள், ஒழுங்கமைக்கும் நியதிகள், ஆவிக்குரிய சக்திகள் ஆகிய சாத்தியங்களை முற்றிலும் ஒரே பொருளாகக் குறுக்காமல், முதன்மை உரையில் ‘நியதிகள்’ என வழங்கி மாற்றுப் பொருள்களை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: τί
  choice: ஏன்
  rationale: இவ்வினாவிலுள்ள காரணம் கேட்கும் சொல்லாட்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: இன்னும் உலகத்தில் வாழ்கிறவர்களைப்போல்
  rationale: ὡς உடன் வரும் ஒப்பீட்டு அல்லது அனுமான நுணுக்கத்தைத் தெளிவான தமிழில் தருகிறது; ‘இன்னும்’ என்பது சூழலில் உள்ள முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: δογματίζεσθε
  choice: விதிமுறைகளுக்கு உட்படுகிறீர்கள்
  rationale: நடுநிலை/செயப்பாட்டு வடிவத்தின் முழு திசையையும் கடுமையாகத் தீர்மானிக்காமல், விதிகளின் ஆட்சிக்குள் இருப்பதை இயல்பாகக் காட்டுகிறது; செயப்பாட்டு மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: பவுலின் பயன்பாட்டில் στοιχεῖα என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘அடிப்படை நியதிகள்’
  alternative: ‘அடிப்படை ஆவிக்குரிய சக்திகள்’ அல்லது ‘அடிப்படைக் கூறுகள்’
  rationale: இந்தச் சொல் உலக ஒழுங்கின் தொடக்க நியதிகளையோ, அண்டம் சார்ந்த ஆவிக்குரிய சக்திகளையோ, அடிப்படைக் கூறுகளையோ குறிக்கக்கூடும். முதன்மைத் தேர்வு சூழலுக்கு ஏற்றதாக இருந்தாலும், விவாதத்திற்குரிய பிற பொருள்கள் அடிக்குறிப்பில் தக்கவைக்கப்படுகின்றன.
- issue: δογματίζεσθε என்பதிலுள்ள நடுநிலை அல்லது செயப்பாட்டு நுணுக்கம்
  choice: ‘விதிமுறைகளுக்கு உட்படுகிறீர்கள்’
  alternative: ‘விதிமுறைகளால் கட்டுப்படுத்தப்படுகிறீர்கள்’
  rationale: வாசகர்களின் பங்கேற்பையும் அவர்கள்மேல் விதிகள் செலுத்தும் கட்டுப்பாட்டையும் ஒரே நேரத்தில் திறந்துவைக்கும் வகையில் முதன்மை உரை அமைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் வரும் விதிமுறைகளை அறிமுகப்படுத்துவதால் இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
