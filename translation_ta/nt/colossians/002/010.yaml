  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: ta
  text: மேலும், அவருக்குள் நீங்கள் நிறைவாக்கப்பட்டிருக்கிறீர்கள்[a]; அவரே எல்லா ஆட்சிகளுக்கும் அதிகாரங்களுக்கும் தலை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிரப்பப்பட்டிருக்கிறீர்கள்” அல்லது “நிறைவுக்குக் கொண்டுவரப்பட்டிருக்கிறீர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “தலை” என்பது கிரேக்க மொழியின் உருவகத்தைத் தக்கவைக்கிறது; இங்கே அவர் எல்லா ஆட்சிகளுக்கும் அதிகாரங்களுக்கும் மேலானவர் என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: '[முந்தைய வாக்கியத்துடன் தொடரும் வகையில் தனியே மொழிபெயர்க்கப்படவில்லை]'
  rationale: தமிழில் வசனம் தனியாகத் தொடங்கும்போது ‘மேலும்’ அல்லது ‘மற்றும்’ என்று சேர்ப்பது இயல்பற்றதாக இருக்கும்; முந்தைய கருத்தின் தொடர்ச்சி வாக்கிய அமைப்பில் நிலைக்கிறது.
- source_word: ἐστὲ … πεπληρωμένοι
  choice: நிறைவாக்கப்பட்டிருக்கிறீர்கள்
  rationale: முற்றுப்பெற்ற செயலில் இருந்து தொடரும் தற்போதைய நிலையையும், πληρόω என்பதன் இறைச்செயப்பாட்டு வடிவத்தையும், முந்தைய வசனத்தின் ‘நிறைவு’ கருத்துத்தொடரையும் காக்கிறது.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள்
  rationale: கிறிஸ்துவோடு உள்ள இணைவு மற்றும் அவரில் பங்குபெறுதல் ஆகியவற்றைக் குறிக்கும் பவுலின் சுருக்கமான மொழியைத் தக்கவைக்கிறது.
- source_word: ὅς ἐστιν
  choice: அவரே
  rationale: முன்னர் குறிப்பிடப்பட்ட கிறிஸ்துவையே சுட்டுகிறது; தமிழில் உறவுப்பெயர் வாக்கியத்தை அப்படியே நகலெடுப்பதைவிட இது இயல்பாகவும் வலியுறுத்தலுடனும் உள்ளது.
- source_word: κεφαλή
  choice: தலை
  rationale: கிரேக்க உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; ‘ஆட்சியாளர்’ என்று விளக்கமாக மாற்றிவிடவில்லை.
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: எல்லா ஆட்சிக்கும் அதிகாரத்துக்கும்
  rationale: இணையாக வரும் இரு அதிகார வகைகளின் முழுமையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; பழமையான தொழில்நுட்பச் சொற்களைத் தவிர்க்கிறது.
theological_decisions:
- issue: கிறிஸ்துவுக்குள் விசுவாசிகள் பெறும் நிறைவின் பொருள்
  choice: விசுவாசிகள் கிறிஸ்துவுக்குள் நிறைவாக்கப்பட்டுள்ளார்கள் என்ற விரிவான கூற்றைத் தக்கவைத்தல்
  alternative: இரட்சிப்புக்குத் தேவையான எதுவும் குறைவில்லை என்று மட்டும் விளக்குதல்; அல்லது பாவமற்ற பரிபூரண நிலை என்று பொருள்படுத்துதல்
  rationale: மூலவாக்கியம் நிறைவின் இயல்பை இங்கு மேலும் வரையறுக்கவில்லை. ஆகவே பின்னைய கோட்பாட்டு முடிவை உரைக்குள் புகுத்தாமல், கிறிஸ்துவில் உள்ள நிறைவுடன் தொடர்புடைய பவுலின் கருத்து அகலமாகவே வைக்கப்படுகிறது.
- issue: அதிகாரங்கள்மீது κεφαλή என்பதன் வலிமை
  choice: ‘தலை’ என்ற உருவகத்தை வைத்து, கிறிஸ்துவின் மேலாதிக்கத்தை உணர்த்துதல்
  alternative: எல்லா ஆட்சிக்கும் அதிகாரத்துக்கும் ‘மூலம்’ என்று மொழிபெயர்த்தல்
  rationale: கொலோசெயர் சூழலில் ஆட்சிகளும் அதிகாரங்களும் தொடர்பாக மேலாதிக்கம் முதன்மையான பொருளாகத் தெரிகிறது; இருப்பினும் மூலத்தின் உருவகம் பிரதான உரையில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நிறைவாக்கப்பட்டிருக்கிறீர்கள்’ என்பது சற்றே செறிவான சொல்லாக்கமாக இருந்தாலும், இறைச்செயப்பாட்டையும் நிறைவு என்ற கருத்துத்தொடரையும் காக்கிறது. அடிக்குறிப்பு குறிகள் அனைத்தும் பிரதான உரையில் இடம்பெற்றுள்ளன.
