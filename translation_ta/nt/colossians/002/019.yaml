base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: ta
  text: மேலும், அவர் தலையை உறுதியாகப் பற்றிக்கொள்ளாமல் இருக்கிறார்; அந்தத் தலையிலிருந்தே முழு உடலும் மூட்டுகளாலும் தசைநார்களாலும் ஆதரவு பெற்று ஒன்றாக இணைக்கப்பட்டு, கடவுளிடமிருந்து வரும் வளர்ச்சியால் வளர்கிறது[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தலையை ஒட்டிக்கொள்ளாமல்.”
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “கடவுளின் வளர்ச்சியால்.” இந்தச் சொற்றொடர் கடவுளிடமிருந்து வரும் வளர்ச்சியைக் குறிக்கும் வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: பற்றிக்கொள்ளாமல்
  rationale: உறுதியான பிடிப்பையும் தொடர்ந்து நிலைத்திருப்பதையும் குறிக்கும் வினையின் உருவக வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: κεφαλήν
  choice: தலையை
  rationale: கிறிஸ்துவைக் குறிக்கும் உடல் உருவகத்தை நேரடியாகப் பேணுகிறது; தமிழில் தனிப்பெரும் எழுத்து வேறுபாடு இல்லாததால் சூழலே குறிப்பைத் தெளிவாக்குகிறது.
- source_word: ἐξ οὗ
  choice: அந்தத் தலையிலிருந்தே
  rationale: ஆண்பால் சார்புப்பெயர் முன் வரும் ‘தலை’யைக் குறிப்பதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πᾶν τὸ σῶμα
  choice: முழு உடலும்
  rationale: ஒரே உடலின் முழுமையைச் சுட்டும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: ἁφῶν
  choice: மூட்டுகளாலும்
  rationale: உடற்கூறு உருவகத்தில் இணையும் இடங்கள் அல்லது மூட்டுகள் என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: συνδέσμων
  choice: தசைநார்களாலும்
  rationale: உறுப்புகளைப் பிணைக்கும் அமைப்பைக் குறிக்கும் நவீன, எளிதில் புரியும் உடற்கூறு சொல்.
- source_word: ἐπιχορηγούμενον
  choice: தேவையானவற்றைப் பெற்று
  rationale: வழங்கப்படுதல், ஆதரிக்கப்படுதல் என்ற பரந்த செயப்பாட்டு பொருளைப் பேணுகிறது; ‘ஊட்டம்பெற்று’ என உணவூட்டலை மட்டும் மிகையாகக் குறிப்பதில்லை.
- source_word: συμβιβαζόμενον
  choice: ஒன்றாக இணைக்கப்பட்டு
  rationale: உடல் ஒருங்கிணைந்த முழுமையாகக் கொண்டுவரப்படுவதைக் காட்டும் இயல்பான செயப்பாட்டு வடிவம்.
- source_word: αὔξει
  choice: வளர்கிறது
  rationale: உடல் உருவகத்தையும் மூலத்தின் நிகழ்காலச் செயலையும் நேரடியாகப் பேணுகிறது.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: கடவுளுக்குரிய வளர்ச்சியுடன்
  rationale: τοῦ θεοῦ என்ற மரபுத்தொடரின் உண்மையான இலக்கணத் தெளிவின்மையை உடனே ‘கடவுளிடமிருந்து வரும்’ எனத் தீர்மானிக்காமல் பேணுகிறது; தமிழில் கடவுள் வளர்கிறார் என்ற தவறான பொருளையும் இயன்றவரை தவிர்க்கிறது.
theological_decisions:
- issue: τὴν αὔξησιν τοῦ θεοῦ என்பதில் உள்ள மரபுத்தொடரின் பொருள்
  choice: கடவுளுக்குரிய வளர்ச்சியுடன்
  alternative: கடவுளிடமிருந்து வரும் வளர்ச்சியுடன்
  rationale: கடவுளே வளர்கிறார் என்பது சூழலுக்குப் பொருந்தாது; இருப்பினும் கிரேக்க மரபுத்தொடர் மூலத்தை மட்டும் வெளிப்படையாக நிர்ணயிப்பதில்லை. ஆகவே பிரதான உரை கடவுளோடு வளர்ச்சிக்குள்ள உறவைத் திறந்தவாறு வைக்கிறது; அடிக்குறிப்பு இயல்பான மூலப் பொருளைச் சுட்டுகிறது.
