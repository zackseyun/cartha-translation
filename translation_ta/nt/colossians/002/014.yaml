- from: கட்டளைகளின் வடிவில்[b] நமக்கு எதிராக இருந்த கையெழுத்துக் கடன்பத்திரத்தை[a] அழித்துவிட்டு—அது நமக்கு விரோதமாக இருந்தது—அதைச் சிலுவையில் ஆணியடித்து, நடுவிலிருந்து அகற்றிவிட்டார்.
  to: நமக்கு எதிராகவும் நமக்கு விரோதமாகவும் இருந்த, கட்டளைகளில் அடங்கிய கையெழுத்துக் கடன்பத்திரத்தை[a][b] அழித்துவிட்டு, அதைச் சிலுவையில் ஆணியடித்து வழியிலிருந்து அகற்றிவிட்டார்.
  rationale: முக்கிய உரையில் ‘கட்டளைகளில் அடங்கிய’ என்பது கட்டளைகளுடனான தொடர்பை நேரடியாகச் சொன்னாலும், மோசேயின் சட்டம் அல்லது ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காது. அடிக்குறிப்பு மாற்று இலக்கண வாசிப்புகளைப் பாதுகாக்கிறது. இரண்டு எதிர்நிலைச் சொற்றொடர்களும் (καθ’ ἡμῶν; ὑπεναντίον ἡμῖν) ‘நமக்கு எதிராகவும் நமக்கு விரோதமாகவும்’ எனத் தனித்தனியாகக் காக்கப்பட்டுள்ளன.
