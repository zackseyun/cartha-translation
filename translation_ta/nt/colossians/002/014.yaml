source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: ta
  text: நமக்கு எதிராகவும் நமக்கு விரோதமாகவும் இருந்த, கட்டளைகளில் அடங்கிய கையெழுத்துக் கடன்பத்திரத்தை[a][b] அழித்துவிட்டு, அதைச் சிலுவையில் ஆணியடித்து வழியிலிருந்து அகற்றிவிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடன் ஒப்புதல் ஆவணம்,” “எழுத்துப்பூர்வப் பதிவு.” கிரேக்கச் சொல் கையால் எழுதப்பட்ட கடன் ஒப்புதலையோ சட்டப்பூர்வக் கடமைப்பத்திரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கட்டளைகளில்,” “கட்டளைகளால் அமைந்த,” அல்லது “கட்டளைகளோடு தொடர்புடைய.” இங்கு கிரேக்கச் சொற்றொடர், கடன்பத்திரம் கட்டளைகளில் வெளிப்பட்டிருந்தது, அவற்றால் அமைந்திருந்தது, அல்லது அவற்றுடன் தொடர்புடையது என்பதைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαλείψας
  choice: அழித்துவிட்டு
  rationale: எழுதப்பட்ட ஒன்றைத் துடைத்தழித்து செல்லாததாக்கும் பொருளையும், முதன்மை வினைக்கு முன்னோடு அல்லது உடனிகழ்வாக நிறைவேறிய செயலைக் குறிக்கும் இறந்தகாலப் பெயரெச்சத் தன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: χειρόγραφον
  choice: கையெழுத்துக் கடன்பத்திரம்
  rationale: கையால் எழுதப்பட்ட கடன் ஒப்புதல் அல்லது சட்டப்பூர்வக் கடமைப்பத்திரம் என்ற ஆவண மற்றும் கடப்பாட்டு உருவகங்கள் இரண்டையும் காக்கிறது.
- source_word: καθ’ ἡμῶν
  choice: நமக்கு எதிராக இருந்த
  rationale: ஆவணம் நமக்கு எதிராக நிற்கும் அல்லது செயல்படும் பொருளை நேரடியாகத் தெரிவிக்கிறது.
- source_word: τοῖς δόγμασιν
  choice: கட்டளைகளின் வடிவில்
  rationale: கடன்பத்திரத்துக்கும் கட்டளைகளுக்கும் உள்ள தொடர்பை வெளிப்படுத்துகிறது; அவை மோசேயின் சட்டமே என்று குறிப்பாக அடையாளப்படுத்தாமல் விடுகிறது. கிரேக்க வேற்றுமையின் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ὑπεναντίον ἡμῖν
  choice: அது நமக்கு விரோதமாக இருந்தது
  rationale: முந்தைய ‘எதிராக’ என்பதைக் காட்டிலும் வலுவான எதிர்நிலைத் தன்மையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: நடுவிலிருந்து அகற்றிவிட்டார்
  rationale: நிறைவேறி அதன் விளைவு தொடரும் செயலை ‘அகற்றிவிட்டார்’ காட்டுகிறது; ‘நடுவிலிருந்து’ என்பது கிரேக்க மரபுத்தொடரின் உருவகத்தைத் தேவையின்றி விளக்காமல் காக்கிறது.
- source_word: προσηλώσας αὐτὸ τῷ σταυρῷ
  choice: அதைச் சிலுவையில் ஆணியடித்து
  rationale: ஆணியால் சிலுவையோடு பொருத்திய செயலைத் தெளிவாகத் தருவதோடு, இச்செயல் அகற்றுதலின் வழிமுறையாக இருப்பதையும் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: χειρόγραφον τοῖς δόγμασιν என்பதன் பொருள்
  choice: கட்டளைகளின் வடிவில் நமக்கு எதிராக இருந்த கையெழுத்துக் கடன்பத்திரம்
  alternative: மோசேயின் சட்டமே; பாவங்களுக்கான கடன் ஒப்புதல்; சட்டப்பூர்வக் குற்றப்பத்திரிகை; கட்டளைகளால் ஏற்பட்ட கடன்பத்திரம்
  rationale: கிரேக்கம் ஆவணம், கடப்பாடு, கட்டளைகள் ஆகியவற்றை இணைக்கிறது; ஆனால் அவற்றின் சரியான தொடர்பை முழுமையாக வரையறுக்கவில்லை. மொழிபெயர்ப்பு கடன்-ஆவண உருவகத்தைக் காத்து, எந்த ஒரு குறிப்பிட்ட சட்டம், உடன்படிக்கை, அல்லது பாவக் கோட்பாட்டுடனும் அதைச் சமமாக்கவில்லை.
- issue: ἦρκεν என்பதன் மறைமுக எழுவாய்
  choice: தமிழில் ‘அகற்றிவிட்டார்’ என்ற ஆண்பால் ஒருமை வினைமுற்றால் கடவுளைச் சூழலிலிருந்து எழுவாயாக உணர்த்துதல்
  alternative: எழுவாயைக் குறிப்பிடாமல் செயலையே மட்டும் கூறுதல்
  rationale: முந்தைய சூழல் கடவுளைச் செய்பவராகக் காட்டுகிறது. தனிப் பெயரைச் சேர்க்காமல் தமிழ் வினைமுற்றின் வழியே எழுவாயை உணர்த்துவது மூலத்தைவிட அதிக விளக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: சிலுவையில் ஆணியடிக்கப்பட்டது எது?
  choice: கையெழுத்துக் கடன்பத்திரமே ‘அதை’ எனத் தொடர்கிறது
  alternative: கிறிஸ்து அல்லது கட்டளைகள் தனியே ஆணியடிக்கப்பட்டன என்று விளக்குதல்
  rationale: இரு αὐτό சுட்டுப்பெயர்களும் இலக்கணரீதியாக χειρόγραφον என்பதையே சுட்டுகின்றன; ஆகவே ஆவண உருவகம் தொடர்ந்து காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கையெழுத்துக் கடன்பத்திரம்’ ஆவண உருவகத்தைத் தெளிவாகக் காக்கிறது. நீண்ட கிரேக்க வாக்கியத்தின் ஓட்டம் முறியாமல் இருக்க பெயரெச்ச அமைப்புகள் தொடரப்பட்டுள்ளன; இடைக்கோடுகள் எதிர்நிலை விளக்கத்தைத் தெளிவாக்குகின்றன.
