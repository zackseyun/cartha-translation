  naturalness: «தாமே அமைத்துக்கொண்ட வழிபாடு» நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. இறுதியில் «சதையின் ஆசைகளைத் திருப்திப்படுத்துவதைத் தடுப்பதில்» என்பது «இச்சைநிறைவைத் தடுப்பதில்» என்பதைவிட வாசகருக்குத் தெளிவானது; இது தேர்ந்தெடுக்கப்பட்ட விளக்க வாசிப்பை மாற்றுவதில்லை.
