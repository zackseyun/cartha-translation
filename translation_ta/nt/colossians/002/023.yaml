source:
  edition: SBLGNT
  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: ta
  text: இவை தாமே அமைத்துக்கொண்ட வழிபாட்டிலும், தாழ்மையிலும், உடலைக் கடுமையாக நடத்துவதிலும் ஞானத்தின் தோற்றத்தைக் கொண்டிருக்கின்றன[a][b]; ஆனால் சதையின் ஆசைகளைத் திருப்திப்படுத்துவதைத் தடுப்பதில் இவற்றுக்கு எந்தப் பயனும் இல்லை[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “ஞானமுள்ளவை என்ற பெயரைப் பெற்றிருக்கின்றன.”'
    reason: lexical_alternative
  - marker: b
    text: “தாமே அமைத்துக்கொண்ட வழிபாடு” என்பதற்கு, “தாமே விதித்துக்கொண்ட வழிபாடு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இறுதித் தொடர் பொருள்படுத்தக் கடினமானது. இதை, “எந்த மரியாதையும் இல்லாமல், சதையைத் திருப்திப்படுத்துவதற்காக” என்றோ, “சதையின் ஆசைகளைத் திருப்திப்படுத்துவதற்கு எதிராக எந்தப் பயனும் இல்லாதவை” என்றோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: d
    text: இங்கு “சதை” என்பது வீழ்ச்சியடைந்த மனித இச்சைகளைக் குறிக்கக்கூடும்; ஆனால் அந்தச் சொல்லின் பொருள் இழுப்பு முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: இவை
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட மனிதக் கட்டளைகளையும் ஒழுங்குகளையும் இயல்பாகச் சுட்டுகிறது.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: ஞானத்தின் தோற்றத்தைக் கொண்டிருக்கின்றன
  rationale: λόγον ἔχειν என்பதன் புகழ், பெயர் அல்லது தோற்றம் என்ற கருத்தையும், μέν தரும் ஒப்புக்கொள்ளும் தொனியையும் வெளிப்படுத்துகிறது.
- source_word: ἐθελοθρησκίᾳ
  choice: தன்னிச்சையான வழிபாடு
  rationale: ஒருவரது சொந்த விருப்பத்தால் உருவாக்கப்பட்ட அல்லது தாமே விதித்த வழிபாட்டைக் குறிக்கும் அரிய சொல்லை, நவீனத் தமிழில் தெளிவாகவும் மதம் முழுவதையும் குற்றஞ்சாட்டாத வகையிலும் தருகிறது.
- source_word: ταπεινοφροσύνῃ
  choice: தாழ்மை
  rationale: சொல்லின் வழக்கமான பொருளைப் பாதுகாக்கிறது; இச்சூழலில் அதன் வெளிப்பகட்டான அல்லது துறவறத் தன்மையை வாசகச் சூழல் உணர்த்துகிறது.
- source_word: ἀφειδίᾳ σώματος
  choice: உடலைக் கடுமையாக நடத்துதல்
  rationale: உடலுக்கு இரக்கமின்றிக் கடுமை காட்டும் துறவற நடைமுறையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: இவற்றுக்கு எந்த மதிப்பும் இல்லை
  rationale: சிக்கலான தொடரை, இந்நடைமுறைகள் பயனற்றவை என்ற சூழல்சார்ந்த பொருளில் மொழிபெயர்க்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: πρὸς πλησμονὴν
  choice: இச்சைநிறைவைத் தடுப்பதில்
  rationale: இங்கு πρός தொடர்பு அல்லது எதிர்நிலையைக் காட்டுவதாகவும், πλησμονή நிறைவு அல்லது திருப்திப்படுத்துதலைக் குறிப்பதாகவும் புரிந்துகொண்டு, துறவற விதிகள் சதைசார்ந்த இச்சைகளை அடக்க இயலாததைத் தெளிவாக்குகிறது.
- source_word: τῆς σαρκός
  choice: சதையின்
  rationale: σάρξ என்ற இறையியல் பதத்தின் உருவகத் திண்மையையும் பொருள் இழுப்பையும் பாதுகாக்கிறது; அதை விளக்கமாக ‘பாவ இயல்பு’ என்று முடிவுசெய்யவில்லை.
theological_decisions:
- issue: οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός என்ற இறுதித் தொடரின் பொருள்
  choice: இந்தத் துறவற நடைமுறைகளுக்குச் சதையின் இச்சைநிறைவைத் தடுப்பதில் உண்மையான மதிப்பு இல்லை.
  alternative: ‘எந்த மதிப்பிலும் அல்ல, சதையின் நிறைவுக்காக’ அல்லது ‘சதையின் இச்சைநிறைவுக்கு எதிராக எந்த மதிப்பும் இல்லாதவை.’
  rationale: கிரேக்கத் தொடர் சுருக்கமாகவும் பலவாறு புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது. சூழலில் இவ்விதிகள் ஞானமாகத் தோன்றினாலும் சதைசார்ந்த இச்சைகளை அடக்க வல்லமையற்றவை என்பது பவுலின் கருத்தோட்டத்துக்கு ஏற்றது. இருப்பினும் மாற்று இலக்கணப் புரிதல்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்கத்தின் சிக்கலான இறுதித் தொடரை முதன்மை உரையில் தெளிவாகத் தந்தபோதும், அதன் உண்மையான மாற்றுப் பொருள்களை அடிக்குறிப்பில் பாதுகாக்கிறது. அடிக்குறி வரிசை உரையில் இயல்பான தொடர்புப்படி அமைக்கப்பட்டுள்ளது.
