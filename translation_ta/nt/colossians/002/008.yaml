id: COL.2.8
reference: Colossians 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: ta
  text: மனித மரபின்படியும் உலகத்தின் அடிப்படைக் கூறுகளின்படியும்[a] அமைந்து, மேசியாவின்படி[b] அமையாத தத்துவத்தையும் வெறுமையான வஞ்சகத்தையும் கொண்டு எவரும் உங்களைச் சிறைபிடித்துச் செல்லாதபடி எச்சரிக்கையாக இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உலகத்தின் மூல ஆவிக்குரிய சக்திகளின்படி.” கிரேக்கச் சொற்றொடர் அடிப்படைக் கூறுகள் அல்லது கோட்பாடுகளையோ, அண்டம்சார் ஆவிக்குரிய சக்திகளையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் “கிறிஸ்து”; இங்கு பட்டப்பெயர் உணர்வு முன்னிலையில் இருப்பதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவத்தின் எச்சரிக்கை வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: μή τις
  choice: எவரும் ... செல்லாதபடி
  rationale: சாத்தியமான ஆபத்தைக் குறித்து எச்சரிக்கும் கிரேக்க அமைப்பைத் தமிழின் இயல்பான எதிர்மறை நோக்க அமைப்பில் தருகிறது.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: உங்களைச் சிறைபிடித்துச் செல்ல
  rationale: கொள்ளைப் பொருளாகப் பிடித்துக்கொண்டு போதல் என்ற συλαγωγέω உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: தத்துவத்தையும் வெறுமையான வஞ்சகத்தையும் கொண்டு
  rationale: διά என்பதன் கருவி அல்லது வழிமுறைப் பொருளையும், இணைக்கப்பட்ட இரு பெயர்ச்சொற்களையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: மனித மரபின்படி
  rationale: κατά குறிக்கும் நெறி அல்லது அளவுகோலை இயல்பாகத் தெரிவிக்கிறது; ἀνθρώπων என்பதையும் பாலினப் பொதுமையுடன் தருகிறது.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: உலகத்தின் அடிப்படைக் கூறுகளின்படி
  rationale: στοιχεῖα என்பதன் அடிப்படைக் கூறுகள், தொடக்கக் கோட்பாடுகள், அண்டம்சார் ஆற்றல்கள் ஆகிய சாத்தியப் பொருள்களில் ஒன்றை அளவுக்கு மீறி உறுதிசெய்யாமல் ஓரளவு திறந்த நிலையில் வைக்கிறது.
- source_word: οὐ κατὰ Χριστόν
  choice: மெசியாவின்படி அமையாத
  rationale: κατά என்பதன் அளவுகோல் சார்ந்த பொருளைப் பாதுகாத்து, Χριστός என்பதன் பட்டப்பெயர் வலிமையை ‘மெசியா’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: στοιχεῖα τοῦ κόσμου என்பதன் பொருள்
  choice: உலகத்தின் அடிப்படைக் கூறுகள்
  alternative: உலகத்தின் மூல ஆவிக்குரிய சக்திகள்
  rationale: இச்சொற்றொடர் அடிப்படைக் கூறுகள் அல்லது கோட்பாடுகளையும், அண்டம்சார் ஆவிக்குரிய சக்திகளையும் குறிக்கக்கூடும். முதன்மை உரை ஒரு பொருளை முற்றாக முடிவுசெய்யாமல் வைக்கிறது; குறிப்பிடத்தக்க மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு மனித மரபுக்கும் உலகத்தின் கூறுகளுக்கும் எதிரான அளவுகோலாகப் பட்டப்பெயர் பயன்படுவதால், அதன் ‘அபிஷேகம் பெற்றவர்’ என்ற பட்டப்பெயர் உணர்வை ‘மெசியா’ தெளிவுபடுத்துகிறது; வழக்கமான ஒலிபெயர்ப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, கண்ணியமான பொதுவாசிப்பு நடை. நீண்ட கிரேக்க வாக்கியத்தின் கருத்துத் தொடர்பைத் தக்கவைத்தபடியே தமிழில் தெளிவாக வாசிக்க உருபுகளும் வினையெச்ச அமைப்பும் பயன்படுத்தப்பட்டுள்ளன. தொழில்நுட்பமான ‘தத்துவம்’ என்ற சொல் அசல் சொல்லின் பரப்பைச் சுருக்காமல் வைத்திருக்கிறது.
