  yaml_path: translation/nt/colossians/002/003.yaml
  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: ta
  text: அவருக்குள் ஞானம் மற்றும் அறிவின் பொக்கிஷங்கள் அனைத்தும் மறைந்திருக்கின்றன[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதில்’ என்றும் மொழிபெயர்க்கலாம்; உறவுப்பெயரின் முன்னிலை கிறிஸ்துவைத் தனிப்பட்ட முறையில் குறிப்பதாக இல்லாமல், விரிவாக ‘தேவனுடைய மறைபொருள்’ என்பதைக் குறிப்பதாக எடுத்துக்கொண்டால் இவ்வாறு வரும்.
    reason: alternative_reading
  - marker: b
    text: ‘சேமித்து வைக்கப்பட்டுள்ளன’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கப் பெயரடை மறைந்திருப்பதையோ பாதுகாப்பாக ஒதுக்கி வைக்கப்பட்டிருப்பதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அவருக்குள்
  rationale: வேற்றுமை உருபேற்ற ஒருமை உறவுப்பெயர், முந்தைய வசனத்தின் மிக அருகிலுள்ள ஆளைக் குறிக்கும் சொல்லான கிறிஸ்துவையே இயல்பாகச் சுட்டுகிறது. எனவே ஆளைக் குறிக்கும் ‘அவருக்குள்’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது; அதேவேளையில் விரிவான முன்னிலையாகிய ‘தேவனுடைய மறைபொருள்’ என்பதைக் குறிக்கும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πάντες οἱ θησαυροὶ
  choice: பொக்கிஷங்கள் அனைத்தும்
  rationale: கட்டுரையுடன் வரும் பன்மைச் சொல், ஒரு திட்டவட்டமான முழுத்தொகுப்பைக் குறிக்கிறது. ‘பொக்கிஷங்கள் அனைத்தும்’ என்பது பவுலின் முழுமையான கூற்றை இயல்பான தமிழில் தருகிறது.
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: ஞானம் மற்றும் அறிவின்
  rationale: σοφία, γνῶσις ஆகிய இரு தொடர்புடைய ஆனால் வேறுபட்ட கருத்துகளையும் ஒன்றாகக் கலக்காமல் ‘ஞானம்’ மற்றும் ‘அறிவு’ என்று நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἀπόκρυφοι
  choice: மறைந்திருக்கின்றன
  rationale: இந்தப் பெயரடை மறைக்கப்பட்டிருப்பதையோ கண்ணுக்குப் புலப்படாமல் வைக்கப்பட்டிருப்பதையோ குறிக்கலாம். ‘மறைந்திருக்கின்றன’ என்பது ரகசிய ஞானம் அல்லது பாதுகாப்பாகச் சேமித்துவைத்தல் என்ற விளக்கங்களில் ஒன்றை மட்டும் திணிக்காமல் மூலத்தின் திறந்த அர்த்தத்தைப் பாதுகாக்கிறது.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: மறைந்திருக்கின்றன
  rationale: εἰσιν உடன் வரும் பயனிலைப் பெயரடையைத் தமிழில் இயல்பான ஒருங்கிணைந்த பயனிலையாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: ἀπόκρυφοι என்பது மறைஞான இரகசியத்தையா, கிறிஸ்துவுக்குள் பாதுகாப்பாக வைக்கப்பட்டிருப்பதையா குறிக்கிறது?
  choice: எந்த ஓர் விளக்கத்தையும் திணிக்காமல் ‘மறைந்திருக்கின்றன’ என்று மொழிபெயர்த்தல்
  alternative: ‘சேமித்து வைக்கப்பட்டுள்ளன’ என்று மொழிபெயர்த்து பாதுகாப்பாக இருப்பதையும் கிடைக்கத்தக்கதையும் வலியுறுத்துதல்; அல்லது ‘இரகசியமாக உள்ளன’ என்று மொழிபெயர்த்து வெளியாரிடமிருந்து மறைக்கப்பட்டிருப்பதை வலியுறுத்துதல்
  rationale: சிறப்பு அறிவு பற்றிய கூற்றுகளுக்கு இந்த வசனம் பதிலளிக்கக்கூடும்; ஆனால் கிரேக்கப் பெயரடை மட்டும் அந்த இறையியல் நுட்பத்தைத் தீர்மானிப்பதில்லை. ஆகவே மூலத்திலுள்ள பதற்றமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவருக்குள்’ என்பது கிறிஸ்துவைக் குறிக்கும் இயல்பான தமிழாக்கம்; மாற்று இலக்கண வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
