    reason: Χριστός என்பதற்கான மரபான மாற்று மொழிபெயர்ப்பை வழங்குகிறது.
lexical_decisions:
- source_word: Ὡς οὖν
  choice: ஆகவே ... பெற்றுக்கொண்டபடியே
  rationale: οὖν முந்தைய கருத்திலிருந்து வரும் முடிவை ‘ஆகவே’ எனக் காட்டுகிறது; ὡς, முன்பு அவரைப் பெற்றுக்கொண்ட விதத்துக்கும் இப்போது தொடர வேண்டிய நடத்தைக்கும் உள்ள ஒப்புமையை ‘...படியே’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παρελάβετε
  choice: பெற்றுக்கொண்ட
  rationale: இறைத்தூதர் அறிவித்த செய்தியை ஏற்றுக்கொண்டதையும், இயேசுவையே வரவேற்றதையும் உள்ளடக்கக்கூடிய கிரேக்கச் சொல்லின் பரந்த பொருளை இது பாதுகாக்கிறது; ‘ஏற்றுக்கொண்ட’ என்று மட்டும் கூறி பொருளைச் சுருக்கவில்லை.
- source_word: τὸν Χριστὸν Ἰησοῦν τὸν κύριον
  choice: ஆண்டவராகிய மெசியா இயேசுவை
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைக் கொண்டிருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது. κύριος என்பதற்கு நிலைபெற்ற கிறிஸ்தவப் பட்டப்பெயரான ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது. தமிழ் மொழியின் இயல்பான தொடருக்காக ‘ஆண்டவராகிய’ முன்னால் வைக்கப்பட்டுள்ளது.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள்
  rationale: பவுலின் சுருக்கமான ஒன்றிப்பு/உறவு மொழியை விளக்கவுரையாக விரிக்காமல் பாதுகாக்கிறது. ‘அவரோடு இணைந்து’ என்பது சாத்தியமானாலும் கிரேக்கத்தின் உள்ளார்ந்த பொருள் வளத்தையும் தெளிவின்மையையும் அதிகமாகத் தீர்மானித்துவிடும்.
- source_word: περιπατεῖτε
  choice: தொடர்ந்து நடங்கள்
  rationale: நிகழ்காலக் கட்டளையின் தொடர்ச்சியான வலிமையை ‘தொடர்ந்து’ காட்டுகிறது; ‘நடங்கள்’ என்பதால் வாழ்க்கை நடத்தையைக் குறிக்கும் பவுலின் உருவகம் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: Χριστός என்பதைப் பவுலின் பட்டப்பெயர் தொடரில் மொழிபெயர்த்தல்
  choice: மெசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு Χριστός வெறும் பெயரின் பகுதியாக இல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பெயரின் வலிமையைத் தக்கவைத்துள்ளது. எனவே அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ முதன்மை உரையில் வைக்கப்பட்டு, மரபாக அறியப்பட்ட ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν αὐτῷ என்ற பவுலின் ஒன்றிப்பு மொழி
  choice: அவருக்குள்
  alternative: அவரோடு இணைந்து
  rationale: கிரேக்கம் உறவு, இருப்பிடம், ஒன்றிப்பு ஆகிய பொருள் நிழல்களைச் சுருக்கமாகத் தாங்குகிறது. அவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் தமிழ் உரையும் அந்த இறையியல் செறிவையும் இழுபறியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அவருக்குள் நடங்கள்’ என்பது அன்றாட வழக்கில் அரிதானாலும், மூலத்தின் பவுலிய உருவகத்தையும் இறையியல் செறிவையும் காக்கிறது; நிகழ்காலக் கட்டளையின் தொடர்ச்சியைத் தெளிவாக்க ‘தொடர்ந்து’ சேர்க்கப்பட்டுள்ளது.
