  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: ta
  text: ஆகவே, ஆண்டவராகிய மெசியா[a] இயேசுவை நீங்கள் ஏற்றுக்கொண்டபடியே, அவருக்குள் நடங்கள்.
  philosophy: optimal-equivalence
  footnotes:
