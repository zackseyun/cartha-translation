source:
  edition: SBLGNT
  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: ta
  text: உங்கள் அத்துமீறல்களிலும், உங்கள் மாம்சத்தின் விருத்தசேதனமற்ற நிலையிலும்[a] இறந்தவர்களாயிருந்த உங்களையும், நம்முடைய அத்துமீறல்கள் அனைத்தையும் நமக்கு மன்னித்து, அவர் அவரோடு சேர்த்து உயிர்ப்பித்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் மாம்சத்தின் விருத்தசேதனமற்ற நிலை” என்பது மிக நேரடியாக, அவர்களுடைய உடலில் விருத்தசேதனம் செய்யப்படாத நிலையைக் குறிக்கிறது; இந்தச் சூழலில் அதற்கு ஆன்மீக முக்கியத்துவமும் உள்ளது.
    reason: cultural_note
  - marker: b
    text: 'கிரேக்க உரை இங்கே “உங்களையும்” என்பதிலிருந்து “நமக்கு” என்று மாறுகிறது: “நம்முடைய அத்துமீறல்கள் அனைத்தையும் நமக்கு மன்னித்து.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: இறந்தவர்களாயிருந்த
  rationale: ὄντας என்ற பங்கேற்புவினை அமைப்பையும், அவர்கள் இருந்த மரண நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: உங்கள் அத்துமீறல்களிலும்
  rationale: ἐν என்பதன் இடம் அல்லது நிலை சார்ந்த படிமத்தைப் பாதுகாக்கிறது; இதை வெறும் காரணவாக்கியமாக மாற்றவில்லை. παράπτωμα என்பதற்கு ‘அத்துமீறல்’ என்பது தெளிவான, தற்போதைய தமிழ் இணை.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: உங்கள் மாம்சத்தின் விருத்தசேதனமற்ற நிலையிலும்
  rationale: ἀκροβυστία குறிக்கும் விருத்தசேதனம் செய்யப்படாத நிலையையும், σάρξ என்பதன் நேரடியான ‘மாம்சம்’ என்ற சொல்லையும் பாதுகாக்கிறது; ‘பாவ இயல்பு’ என்று விளக்கி முடிவுசெய்யவில்லை.
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: உங்களையும், அவர் அவரோடு சேர்த்து உயிர்ப்பித்தார்
  rationale: கூட்டாக உயிர்ப்பிக்கப்படுதல் என்ற συνεζωοποίησεν என்பதன் வலிமையையும், σὺν αὐτῷ என்பதிலுள்ள ‘அவரோடு’ என்ற இணைப்பையும் பாதுகாக்கிறது.
- source_word: χαρισάμενος
  choice: மன்னித்தார்
  rationale: χαρίζομαι இங்கு அருளுடன் மன்னித்தல் என்ற பொருளில் வருகிறது. தமிழில் தொடர்ச்சியான வாக்கியமாக அமைத்தது பங்கேற்புவினையின் தொடர்பை வாசிக்கத் தெளிவாக்குகிறது.
- source_word: ἡμῖν πάντα τὰ παραπτώματα
  choice: நம்முடைய அத்துமீறல்கள் அனைத்தையும் நமக்கு
  rationale: கிரேக்கத்தில் ‘உங்கள்/உங்களை’ என்பதிலிருந்து ‘நமக்கு’ என நிகழும் ஆளிட மாற்றத்தையும், எல்லா அத்துமீறல்களும் மன்னிக்கப்பட்டன என்ற முழுமையையும் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: τῆς σαρκὸς ὑμῶν என்பதில் σάρξ என்பதன் பொருள்
  choice: முக்கிய உரையில் ‘மாம்சம்’ என்ற நேரடியான சொல்லைப் பயன்படுத்தி, உடலின் விருத்தசேதனமற்ற நிலையை முதன்மையாகக் காட்டுதல்
  alternative: ‘பாவ இயல்பு’ என்று உருவகமாக மொழிபெயர்த்தல்
  rationale: உடனடியான சூழலில் விருத்தசேதன மொழி இருப்பதால் உடல் சார்ந்த பொருள் நேரடியானது; அதேவேளை ‘மாம்சம்’ என்பது ஆன்மீக எதிரொலியை முற்றிலும் நீக்காமல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: σὺν αὐτῷ என்பதிலுள்ள αὐτῷ யாரைக் குறிக்கிறது
  choice: ‘அவரோடு’ என்ற பிரதிப்பெயரை வைத்திருத்தல்; சூழலில் அது கிறிஸ்துவைக் குறிக்கிறது
  alternative: முக்கிய உரையிலேயே ‘கிறிஸ்துவோடு’ என்று பெயரைச் சேர்த்தல்
  rationale: 2:12-இன் அடக்கம் மற்றும் உயிர்த்தெழுதல் சூழல் கிறிஸ்துவைக் குறிக்கிறது; ஆயினும் மூலத்தின் பிரதிப்பெயரை வைத்திருப்பது உரையில் இல்லாத பெயரை நேரடியாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: ὑμᾶς என்பதிலிருந்து ἡμῖν என்பதற்கான ஆளிட மாற்றம்
  choice: ‘உங்களை’ என்பதிலிருந்து ‘நமக்கு’ எனும் மாற்றத்தைப் பாதுகாத்தல்
  alternative: முழுவதையும் ‘உங்களுக்கு’ என ஒருமைப்படுத்தல்
  rationale: மூல கிரேக்கத்தின் திட்டவட்டமான மாற்றம் திருத்தப்படாமல் இருக்க வேண்டும்; பவுல் தன்னையும் உள்ளடக்கி உரையை விரிவுபடுத்தியிருக்கலாம்.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ மற்றும் ‘மாம்சம்’ ஆகியவை வேதாகமச் சூழலின் துல்லியத்தையும் இறையியல் பதற்றத்தையும் காக்கும் வகையில் வைக்கப்பட்டுள்ளன; பண்பாட்டு விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
