source:
  edition: SBLGNT
  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: ta
  text: ஆனால் இப்போது, அவரது மாம்ச உடலில் மரணத்தின் வழியாக நீங்கள் ஒப்புரவாக்கப்பட்டுள்ளீர்கள்[a]; அவரது முன்னிலையில் உங்களைப் பரிசுத்தமானவர்களாகவும், களங்கமற்றவர்களாகவும்[b], குற்றஞ்சாட்டப்பட முடியாதவர்களாகவும் நிறுத்துவதற்காகவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் உங்களை ஒப்புரவாக்கியிருக்கிறார்.” கிரேக்க வினை செயப்பாட்டு வடிவத்தில் உள்ளது; செயற்படுத்துபவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
  - marker: b
    text: “களங்கமற்ற” என்பதை “பழுதற்ற” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் பலிக்குரிய குறைபாடின்மையையும் நினைவூட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: ஆனால் இப்போது
  rationale: முந்தைய பகுதியிலுள்ள அந்நியப்பட்ட நிலையையும் தற்போதைய ஒப்புரவு நிலையையும் எதிர்மறையாக இணைக்கும் கால மற்றும் மாறுபாட்டுச் சாயலைப் பாதுகாக்கிறது.
- source_word: ἀποκατηλλάγητε
  choice: நீங்கள் ஒப்புரவாக்கப்பட்டிருக்கிறீர்கள்
  rationale: கிரேக்க வினையின் இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் மறைமுகமாக உள்ள செயற்படுத்துபவரையும் வெளிப்படையாக நிர்ணயிக்காமல் பாதுகாக்கிறது; நிறைவேறிய செயலின் தற்போதைய விளைவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: அவரது சதையாலான உடலில்
  rationale: σάρξ என்பதை பாவ இயல்பு என விளக்காமல் உண்மையான மாம்ச உடலைக் குறிக்கும் பொருளில் தருகிறது; சொற்சொல்லான ‘சதையின் உடல்’ என்பதைக் காட்டிலும் தற்போதைய தமிழில் இயல்பாக உள்ளது.
- source_word: διὰ τοῦ θανάτου
  choice: மரணத்தின் வழியாக
  rationale: διά உடன் வரும் கருவி அல்லது வழிமுறைப் பொருளைப் பாதுகாக்கிறது; ‘அவரது’ என்பதைச் சேர்த்து மூலத்தில் இல்லாத குறிப்பைத் திணிப்பதில்லை.
- source_word: παραστῆσαι
  choice: நிறுத்துவதற்காக
  rationale: ஒருவரை மற்றொருவரின் முன்னிலையில் நிறுத்துதல் அல்லது சமர்ப்பித்தல் என்ற அடிப்படைப் படிமத்தையும் நோக்கத்தையும் காக்கிறது.
- source_word: ἁγίους
  choice: பரிசுத்தமானவர்களாக
  rationale: அர்ப்பணிக்கப்பட்ட நிலையும் ஒழுக்கத் தூய்மையும் உள்ளடங்கக்கூடிய வழக்கமான வேதாகமத் தமிழ்ச் சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: ἀμώμους
  choice: களங்கமற்றவர்களாக
  rationale: குறைபாடற்ற அல்லது பலிக்குரிய பழுதற்ற நிலையின் சாயலைக் காக்கிறது; அடுத்துள்ள சட்டவியல் சொல்லுடன் ஒன்றாகக் கலந்துவிடாமல் வேறுபடுத்துகிறது.
- source_word: ἀνεγκλήτους
  choice: குற்றஞ்சாட்டப்பட முடியாதவர்களாக
  rationale: குற்றச்சாட்டுக்கு உட்படுத்த முடியாதவர் என்ற நீதிமன்றச் சாயலைத் தெளிவாக வெளிப்படுத்தி, ἀμώμους என்பதிலிருந்து வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: κατενώπιον αὐτοῦ
  choice: அவரது முன்னிலையில்
  rationale: ‘அவர்’ என்பது தேவனையா கிறிஸ்துவையா குறிக்கிறது என்பதைத் தீர்மானிக்காமல் மூலத்தின் சுட்டுப்பெயர் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀποκατηλλάγητε என்ற செயப்பாட்டு வினையின் செயற்படுத்துபவர்
  choice: செயப்பாட்டு வடிவமாக ‘நீங்கள் ஒப்புரவாக்கப்பட்டிருக்கிறீர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவர் உங்களை ஒப்புரவாக்கியிருக்கிறார்’ என்று மறைமுகச் செயற்படுத்துபவரை வெளிப்படுத்தல்
  rationale: SBLGNT உரையிலுள்ள வினை இலக்கணரீதியாகச் செயப்பாட்டு வடிவத்தில் உள்ளது. சூழல் தெய்வீகச் செயலை உணர்த்தினாலும், முதன்மை உரையில் செயற்படுத்துபவரைச் சேர்க்காமல் இருப்பது உண்மையான இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: σάρξ என்பதன் பொருள்
  choice: உண்மையான உடல் சார்ந்த பொருளில் ‘சதை’
  alternative: ‘பாவ இயல்பு’
  rationale: இங்கு மரணமடையக்கூடிய அவரது உண்மையான மனித உடலே வலியுறுத்தப்படுகிறது; ஒழுக்கரீதியான ‘பாவ இயல்பு’ என்ற பொருளைச் சூழல் ஆதரிக்கவில்லை.
- issue: ἀμώμους மற்றும் ἀνεγκλήτους ஆகியவற்றின் வேறுபாடு
  choice: ‘களங்கமற்றவர்கள்’ மற்றும் ‘குற்றஞ்சாட்டப்பட முடியாதவர்கள்’
  alternative: ‘குற்றமற்றவர்கள்’ மற்றும் ‘கண்டிக்கப்படாதவர்கள்’
  rationale: முதல் சொலின் பலி அல்லது குறைபாடின்மைச் சாயலையும் இரண்டாவது சொலின் சட்டவியல் குற்றச்சாட்டு சாயலையும் தனித்தனியாகப் பாதுகாக்கிறது.
- issue: κατενώπιον αὐτοῦ என்பதிலுள்ள சுட்டுப்பெயரின் குறிப்பு
  choice: ‘அவரது முன்னிலையில்’ என்று குறிப்பைத் திறந்தவாறே வைத்தல்
  alternative: ‘தேவனுடைய முன்னிலையில்’ அல்லது ‘கிறிஸ்துவின் முன்னிலையில்’ என்று வெளிப்படுத்தல்
  rationale: கிரேக்க உரை பெயரை மீண்டும் கூறாமல் αὐτοῦ என்று மட்டுமே தருவதால், எந்தக் குறிப்பையும் மொழிபெயர்ப்பில் இறுதியாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒப்புரவாக்கப்பட்டிருக்கிறீர்கள்’ என்பது இலக்கணச் செயப்பாட்டை காக்கும் சற்றே முறையான சொற்றொடர். ‘சதையாலான உடல்’ என்பது உடல்மெய்மையைத் தெளிவுபடுத்துகிறது; ‘பாவ இயல்பு’ என்ற தேவையற்ற கோட்பாட்டு வாசிப்பைத் தவிர்க்கிறது. மூலத்தின் நீண்ட வாக்கிய அமைப்பு தமிழில் புரியுமாறு அரைப்புள்ளியால் ஒழுங்குபடுத்தப்பட்டுள்ளது.
