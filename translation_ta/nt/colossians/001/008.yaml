id: COL.1.8
reference: Colossians 1:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: ta
  text: அவர் ஆவியில் உள்ள உங்கள் அன்பையும் எங்களுக்குத் தெரிவித்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுடைய ஆவிக்குரிய அன்பை.”
    reason: ἐν πνεύματι என்பது பரிசுத்த ஆவியைக் குறிப்பதற்குப் பதிலாக, அன்பின் ஆவிக்குரிய தன்மை அல்லது களத்தைக் குறிக்கவும் வாய்ப்புள்ளது.
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: அவரே ... தெரிவித்தார்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் இறந்தகாலப் பங்கேற்புவினை முந்தைய வசனத்திலுள்ள எப்பாப்பிராவைக் குறிக்கிறது. தமிழில் தனி வாக்கியமாக அமைத்தால் இயல்பாகவும் தொடர்பு தெளிவாகவும் இருக்கும்; δηλόω இங்கு ‘தெரிவித்தல்/அறியச் செய்தல்’ எனப் பொருள்படும்.
- source_word: καὶ
  choice: -யும்
  rationale: எப்பாப்பிராவின் முந்தைய செயலைத் தொடர்ந்து அவர் செய்த இன்னொரு செயலையும் சேர்த்துக் கூறும் பொருளைத் தமிழின் இணைப்பும்மை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡμῖν
  choice: எங்களுக்குத்
  rationale: இது மறைமுகச் செயப்படுபொருளாக இருந்து, பவுலுக்கும் அவருடைய உடனுழைப்பாளர்களுக்கும் செய்தி தெரிவிக்கப்பட்டதைக் குறிக்கிறது.
- source_word: τὴν ὑμῶν ἀγάπην
  choice: உங்களுக்குள்ள அன்பை
  rationale: ἀγάπη என்பதற்கு இயல்பான ‘அன்பு’ பயன்படுத்தப்படுகிறது. ‘உங்களுக்குள்ள’ என்பது அந்த அன்பு கொலோசெயரிடத்தில் காணப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது; அதன் நோக்கத்தை உரையில் தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: ἐν πνεύματι
  choice: ஆவியில்
  rationale: கட்டுரைச் சொல் இல்லாவிட்டாலும் பவுலின் பயன்பாட்டில் இது பரிசுத்த ஆவியைக் குறிக்கக்கூடும். ‘ஆவியில்’ என்ற வடிவம் மூலத்தின் சுருக்கத்தையும் சாத்தியமான இருபொருளையும் ஓரளவு காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: πνεύματι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘ஆவியில்’ என வைத்து, பரிசுத்த ஆவியின் செயல்பாட்டுக் களத்திலுள்ள அன்பு என்ற அதிக சாத்தியமுள்ள பொருளை முன்னிறுத்துதல்
  alternative: ‘ஆவிக்குரிய அன்பு’ அல்லது ‘உள்ளத்தில்/ஆவியில் உள்ள அன்பு’
  rationale: சொற்றொடர் பரிசுத்த ஆவியைக் குறிக்கலாம்; அல்லது அன்பின் ஆவிக்குரிய தன்மை அல்லது மனப்பாங்கைக் குறிக்கலாம். முதன்மை உரை முதலாவது பொருளை ஏற்றாலும், மூலத்தில் உள்ள மெய்யான தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை. முந்தைய வசனத்திலுள்ள எப்பாப்பிராவைக் குறிக்கும் உறவை ‘அவரே’ தெளிவாக்குகிறது. ‘ஆவியில்’ என்ற சொல் திருச்சபை வழக்கில் புரியக்கூடியதாக இருப்பதோடு, அடிக்குறிப்பின் உதவியால் மூலத்தின் தெளிவின்மையும் பாதுகாக்கப்படுகிறது.
