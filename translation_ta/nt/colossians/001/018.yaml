  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தலை–உடல்’, ‘முதற்பேறானவர்’ ஆகிய மூல உருவகங்களும் இறையியல் செறிவும் காக்கப்பட்டுள்ளன. அடிக்குறி [a] ἀρχή-க்குப் பின்னரும் [b] πρωτεύων சார்ந்த சொற்றொடருக்குப் பின்னரும் பொருத்தமாக வைக்கப்பட்டுள்ளன.
