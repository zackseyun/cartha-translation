base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: ta
  text: அவரே திருச்சபையாகிய உடலின் தலை; அவரே தொடக்கம்[a], இறந்தோரிலிருந்து எழுந்த முதற்பேறானவர்; எல்லாவற்றிலும் அவரே முதலிடம் வகிப்பவராகும்படி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தொடக்கம்” என்பதற்கு “மூலம்” அல்லது “ஆட்சியாளர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எல்லாவற்றிலும் அவரே முதலிடம் வகிப்பவராகும்படி” என்பதற்கு “எல்லாவற்றிலும் அவரே முதன்மை பெறும்படி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: அவரே
  rationale: வலியுறுத்தப்பட்ட சுட்டுப்பெயரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; முதல் கூற்றிலும் இறுதி நோக்கக் கூற்றிலும் கிறிஸ்துவையே வலியுறுத்துகிறது.
- source_word: κεφαλή
  choice: தலை
  rationale: தலை–உடல் உருவகத்தை அப்படியே காக்கிறது; ‘அதிகாரி’ அல்லது ‘மூலம்’ என்று விவாதத்திற்குரிய ஓர் அர்த்தத்துக்குள் அதைக் குறுக்கவில்லை.
- source_word: σῶμα
  choice: உடல்
  rationale: சமூகமாக இணைந்த விசுவாசிகளைக் குறிக்கும் பவுலின் உருவகத்திற்கான நேரடியான, இயல்பான தமிழ் சொல்.
- source_word: ἐκκλησία
  choice: திருச்சபை
  rationale: இங்கு கிறிஸ்துவின் உடலாகிய தேவமக்களைக் குறிக்கும் நிலைபெற்ற நவீனத் தமிழ் வழக்கு.
- source_word: ἀρχή
  choice: தொடக்கம்
  rationale: அடுத்து வரும் உயிர்த்தெழுதல் சார்ந்த ‘முதற்பேறானவர்’ என்ற சொல்லுடன் இயல்பாக இணைகிறது; ‘மூலம்’ அல்லது ‘ஆட்சியாளர்’ என்ற சாத்திய அர்த்தங்களை அடிக்குறிப்பில் காக்கிறது.
- source_word: πρωτότοκος
  choice: முதற்பேறானவர்
  rationale: வரிசையையும் உயர்நிலையையும் சுட்டக்கூடிய மூலச்சொல்லின் வடிவத்தையும் வேதாகம எதிரொலியையும் காக்கிறது.
- source_word: ἐκ τῶν νεκρῶν
  choice: இறந்தோரிலிருந்து எழுந்த
  rationale: உயிர்த்தெழுதலைக் குறிக்கும் கிரேக்கச் சொற்றொடரைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἵνα γένηται
  choice: பெறும்படி … இருக்கிறார்
  rationale: நோக்கம் அல்லது விளைவு என்ற இரண்டிற்கும் இடமளிக்கும் ἵνα கட்டமைப்பைக் காக்கிறது; γένηται-யின் ‘நிலையை அடைதல்’ என்ற இயக்கம் ‘பெறும்படி’ என்பதில் வெளிப்படுகிறது.
- source_word: ἐν πᾶσιν
  choice: எல்லாவற்றிலும்
  rationale: நடுநிலைப் பன்மையின் பரந்த, அண்டளாவிய நோக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: πρωτεύων
  choice: முதன்மை பெற
  rationale: ‘முதல் இடத்தில் இருத்தல்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: கிறிஸ்து–உடல் உருவகத்தில் κεφαλή என்பதன் பொருள்
  choice: ‘தலை’ என்ற உருவகத்தை விளக்கமின்றி காத்தல்
  alternative: ‘அதிகாரி’ அல்லது ‘மூலம்’
  rationale: கிரேக்கம் அதிகாரம் அல்லது தோற்றுவாய் என்ற ஒரே விளக்கத்தை இங்கு வெளிப்படையாகத் தேர்ந்தெடுக்கவில்லை; எனவே உருவகத்தின் செறிவும் இறையியல் பதற்றமும் காக்கப்படுகின்றன.
- issue: உயிர்த்தெழுதல் சூழலில் ἀρχή என்பதன் பொருள்
  choice: ‘தொடக்கம்’
  alternative: ‘மூலம்’ அல்லது ‘ஆட்சியாளர்’
  rationale: ‘இறந்தோரிலிருந்து எழுந்த முதற்பேறானவர்’ என்ற இணைச் சொற்றொடர் புதிய உயிர்த்தெழுதல் ஒழுங்கின் தொடக்கத்தை முன்னிறுத்துகிறது; மற்ற சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- issue: πρωτότοκος ἐκ τῶν νεκρῶν என்பதன் வலிமை
  choice: ‘இறந்தோரிலிருந்து எழுந்த முதற்பேறானவர்’
  alternative: ‘இறந்தோரிலிருந்து முதலில் உயிர்த்தெழுந்தவர்’
  rationale: ‘முதற்பேறானவர்’ என்பது வெறும் காலவரிசையை மட்டும் அல்லாமல் நிலையிலும் முதன்மையிலும் உள்ள அர்த்தத் திறனை காக்கிறது; இதை ‘முதலில் உயிர்த்தெழுந்தவர்’ என்று மட்டும் சுருக்கவில்லை.
- issue: ἵνα γένηται-யின் நோக்கம்/விளைவு
  choice: ‘முதன்மை பெறும்படி’
  alternative: ‘முதன்மை பெற்றார்’
  rationale: கிரேக்கத் துணைவாக்கியத்தின் நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவு என்ற நுணுக்கத்தைத் தீர்மானமான நிகழ்வுக் கூற்றாக மாற்றாமல் காக்கிறது.
