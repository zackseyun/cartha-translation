source:
  edition: SBLGNT
  text: εὐχαριστοῦντες τῷ πατρὶ τῷ ἱκανώσαντι ⸀ὑμᾶς εἰς τὴν μερίδα τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/012.yaml
  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: ta
  text: ஒளியில் இருக்கும் பரிசுத்தவான்களின் சுதந்தரத்தில் பங்குபெற உங்களை[a] தகுதியுள்ளவர்களாக்கிய தந்தைக்கு நன்றி செலுத்திக்கொண்டு,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘உங்களை’ என்பதற்குப் பதிலாக ‘எங்களை’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: நன்றி செலுத்துகிறவர்களாக
  rationale: நிகழ்காலச் செயப்பாட்டு எச்சத்தின் தொடர்ச்சியான செயற்பாட்டையும், முந்தைய வசனத்துடன் தொடரும் வாக்கிய ஓட்டத்தையும் காக்கிறது.
- source_word: τῷ πατρὶ
  choice: தந்தைக்கு
  rationale: மூலத்தில் உள்ள உறவுப்பெயரை மட்டும் மொழிபெயர்க்கிறது; இவ்வசனத்தில் இல்லாத ‘தேவன்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἱκανώσαντι
  choice: தகுதியுள்ளவர்களாக்கிய
  rationale: ἱκανόω என்பதன் ‘தகுதிப்படுத்துதல், போதுமானவர்களாக்குதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; வெறும் அனுமதியைக் குறிப்பதில்லை.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: கொடுக்கப்பட்ட SBLGNT மூலவாசகத்தைப் பின்பற்றுகிறது; ‘எங்களை’ என்ற பாடவேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: சுதந்தரப் பங்கைப் பெறுவதற்கு
  rationale: μερίς என்பதன் ‘பங்கு’ என்ற கருத்தையும் κλῆρος என்பதன் சுதந்தரம்/ஒதுக்கப்பட்ட பங்கு என்ற பின்னணியையும் இணைத்து, εἰς என்பதன் நோக்கம் அல்லது விளைவு சார்ந்த நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῶν ἁγίων
  choice: பரிசுத்தவான்களுக்குரிய
  rationale: பவுலின் வழக்கில் தேவனுக்கென்று பிரித்தெடுக்கப்பட்ட மக்களைக் குறிக்கும் சொல்லைச் சுருக்கமாகவும் மரபுத் தொடர்புடனும் தருகிறது.
- source_word: ἐν τῷ φωτί
  choice: ஒளியில்
  rationale: ‘ஒளி’ என்ற உருவகத்தையும் அதன் இறையியல் செறிவையும் விளக்கிச் சுருக்காமல் அப்படியே காக்கிறது.
theological_decisions:
- issue: பொருள்படும் சுட்டுப்பெயரில் உள்ள பாடவேறுபாடு
  choice: உங்களை
  alternative: எங்களை
  rationale: கொடுக்கப்பட்ட கிரேக்க மூலத்தில் ὑμᾶς (‘உங்களை’) உள்ளது. சில கையெழுத்துப் பிரதிகளின் ἡμᾶς (‘எங்களை’) என்ற வாசகம் முக்கியமான பாடவேறுபாடாக அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ἐν τῷ φωτί என்பதன் தொடர்பு
  choice: ‘ஒளியில்’ என்பதை பரிசுத்தவான்களுக்குரிய சுதந்தரப் பங்கின் முழுக் கருத்துடன் தொடர்புபடுத்தும் திறந்த அமைப்பு
  alternative: ‘ஒளியில் இருக்கும் பரிசுத்தவான்கள்’ என்று நேரடியாக இணைத்தல்
  rationale: கிரேக்கத் தொடரின் இணைப்பில் ஓரளவு தெளிவின்மை உள்ளது. தமிழாக்கம் ஒளியைப் பரிசுத்தவான்களுக்கு மட்டும் கட்டுப்படுத்தாமல், அந்தப் பங்கு/சுதந்தரத்தின் சூழலாகவும் வாசிக்க இடமளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. இவ்வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சியாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; எச்சவினை அமைப்பும் காக்கப்பட்டுள்ளது.
