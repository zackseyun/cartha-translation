  terminology: “வல்லமை / வலிமை” மூலம் δύναμις / κράτος வேறுபாடு தக்கவைக்கப்படுகிறது. “அவருடைய மகிமையின் வலிமை” τῆς δόξης αὐτοῦ-வின் செறிந்த உரிமைத் தொடர்பை விளக்கப்பரப்பாமல் பாதுகாக்கிறது. “மகிழ்ச்சியோடு” என்பதன் மாற்றுத் தொடரியல் இணைப்பு அடிக்குறிப்பில் உரிய முறையில் குறிக்கப்படுகிறது.
