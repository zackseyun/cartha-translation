  source_fidelity: வரைவில் δύναμις/κράτος மற்றும் δόξா ஆகியவற்றின் வேறுபாடும், மகிமையுடனான உரிமைத் தொடர்பும் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் “உங்களுக்கு உண்டாகட்டும்” என்பது மூலத்தில் இல்லாத வேண்டுதல் வினைமுறையையும் மறைமுகப் பொருளையும் சேர்க்கிறது; δυναμούμενοι என்பது முந்தைய வசனத்தின் ஜெபத் தொடரைச் சார்ந்த நிகழ்கால இறைநிலைப் பங்கேற்பாகவே இருக்கிறது. “முழு மனவுறுதி” என்பது πᾶσαν ὑπομονήν என்பதிலுள்ள முழுமை/வகைநிறை பொருளைத் துல்லியமாகக் காட்டவில்லை.
