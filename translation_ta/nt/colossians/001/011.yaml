  to: எல்லா வல்லமையாலும் வலுப்படுத்தப்பட்டுக்கொண்டு, அவருடைய மகிமையின் வலிமைக்கு ஏற்ப, மகிழ்ச்சியோடு எல்லாவிதமான சகிப்புத்தன்மையையும் நீடிய பொறுமையையும் கொண்டிருக்கும்படி,[a]
