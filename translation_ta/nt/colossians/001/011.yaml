  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: ta
  text: எல்லா வல்லமையாலும் வலுப்படுத்தப்பட்டுக்கொண்டு, அவருடைய மகிமையின் வலிமைக்கு ஏற்ப, மகிழ்ச்சியோடு எல்லாவிதமான சகிப்புத்தன்மையையும் நீடிய பொறுமையையும் கொண்டிருக்கும்படி,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகிழ்ச்சியோடு” என்பதை அடுத்த வசனத்திலுள்ள “நன்றி செலுத்தி” என்பதுடன் இணைத்தும் புரிந்துகொள்ளலாம்.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει
  choice: எல்லா வல்லமையாலும்
  rationale: ἐν இங்கு கருவிப்பொருளில் வருவதால், வலுப்படுத்தப்படுவதற்கான வல்லமையை இயல்பான தமிழில் காட்டுகிறது; πᾶσα என்பதன் முழுமையான வலியுறுத்தலும் காக்கப்படுகிறது.
- source_word: δυναμούμενοι
  choice: வலுப்படுத்தப்பட்டு
  rationale: நிகழ்காலச் செயல்பாட்டு உணர்வுடைய இறைவினைப் பங்கேற்புச்சொல்; கடவுள் மறைமுகச் செய்பவராக இருந்து அவர்களைத் தொடர்ந்து வலுப்படுத்துகிறார் என்பதைச் சூழல் காட்டுகிறது.
- source_word: κατὰ τὸ κράτος τῆς δόξης αὐτοῦ
  choice: அவருடைய மகிமையின் வலிமைக்கு ஏற்ப
  rationale: κατά அளவு அல்லது தரநிலையைச் சுட்டுகிறது. κράτος என்பதற்கு ‘வலிமை’ என்றும் δόξα என்பதற்கு ‘மகிமை’ என்றும் தனித்தனியாக மொழிபெயர்த்து, கிரேக்கத்தின் அடர்த்தியான உரிமைத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: முழு மனவுறுதியும் ... உங்களுக்கு உண்டாகட்டும்
  rationale: εἰς நோக்கம் அல்லது விளைவைக் குறிக்கிறது. ὑπομονή சோதனைகளின் கீழ் நிலைத்திருப்பதைக் குறிப்பதால் ‘மனவுறுதி’ பொருத்தமானது; πᾶσαν என்பதற்கு இயல்பான தமிழில் ‘முழு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μακροθυμίαν
  choice: பொறுமை
  rationale: நீடிய பொறுமையை, குறிப்பாக மனிதர்களைச் சகித்துக்கொள்வதை, எளிய நவீன தமிழில் தெரிவிக்கிறது; ὑπομονή என்பதிலிருந்து வேறுபட்ட சொல்லாகவும் உள்ளது.
- source_word: μετὰ χαρᾶς
  choice: மகிழ்ச்சியோடு
  rationale: χαρά என்ற பெயர்ச்சொல்லின் பொருளைக் காத்து, மனவுறுதியும் பொறுமையும் எந்த மனநிலையோடு இருக்க வேண்டும் என்பதை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: இறைவல்லமைக்கும் கடவுளுடைய மகிமைக்கும் உள்ள தொடர்பு
  choice: அவருடைய மகிமையின் வலிமைக்கு ஏற்ப
  alternative: அவருடைய மகிமையான வல்லமைக்கு ஏற்ப
  rationale: ‘மகிமையின் வலிமை’ என்ற கிரேக்க உரிமைத் தொடரை விளக்கவுரையாக மாற்றாமல் காக்கிறது. இதனால் மகிமை வலிமையின் தன்மையா, அதனோடு தொடர்புடைய மூலமா என்ற அடர்த்தியும் ஓரளவு நிலைக்கிறது.
- issue: μετὰ χαρᾶς என்பதன் தொடரியல் இணைப்பு
  choice: மகிழ்ச்சியோடு என்பதை மனவுறுதி மற்றும் பொறுமையுடன் இணைத்தல்
  alternative: அடுத்த வசனத்தின் நன்றி செலுத்துதலுடன் இணைத்தல்
  rationale: நிறுத்தற்குறிகள் பிற்காலத் தொகுப்பாசிரியர் முடிவுகள்; கிரேக்கத் தொடர் இரு இணைப்புகளுக்கும் இடமளிக்கலாம். இவ்வசனத்தின் உடனடிச் சொல்வரிசை அதை மனவுறுதி மற்றும் பொறுமையுடன் இயல்பாக இணைக்கிறது; மாற்று இணைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்தின் தொடர்ச்சியை வெளிப்படுத்தும் வகையில் வினைமுற்று அமைக்கப்பட்டுள்ளது. ‘வல்லமை / வலிமை’ என்ற இரு சொற்கள் δύναμις / κράτος ஆகிய பவுலின் இணையான வலிமைச் சொற்களை வேறுபடுத்துகின்றன. ‘மனவுறுதி / பொறுமை’ என்பது ὑπομονή / μακροθυμία ஆகியவற்றின் வேறுபாட்டை சாதாரண வாசகருக்குப் புரியும் வகையில் காக்கிறது.
