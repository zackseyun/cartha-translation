  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: ta
  text: காலங்காலமாகவும் தலைமுறை தலைமுறையாகவும் மறைக்கப்பட்டிருந்த மறைபொருள்[a]—ஆனால் இப்போது அவருடைய பரிசுத்த மக்களுக்கு[b] வெளிப்படுத்தப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரகசியம்.” பவுலின் பயன்பாட்டில், “மறைபொருள்” என்பது முன்பு மறைக்கப்பட்டிருந்து இப்போது வெளிப்படுத்தப்பட்ட இறை நோக்கத்தைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய பரிசுத்தர்களுக்கு.” இது தேவனுக்கென்று பிரித்தெடுக்கப்பட்ட அவருடைய மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: மறைபொருள்
  rationale: முன்பு மறைக்கப்பட்டிருந்து இப்போது வெளிப்படுத்தப்பட்ட இறைத் திட்டம் என்ற பவுலின் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது; வெறும் இரகசியத் தகவல் என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: ἀποκεκρυμμένον
  choice: மறைக்கப்பட்டிருந்த
  rationale: முன்னர் மறைக்கப்பட்டதன் விளைவாகத் தொடர்ந்து இருந்த நிலையைச் சுட்டும் நிறைவு செயப்பாட்டு பங்கேற்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἀπὸ τῶν αἰώνων
  choice: காலங்காலமாக
  rationale: αἰῶνες என்பதன் யுகங்கள் அல்லது நீண்ட காலப்பகுதிகள் என்ற கருத்தை இயல்பான நவீனத் தமிழில் தருகிறது; ἀπό குறிக்கும் கடந்தகாலத் தொடக்கத்திலிருந்து நீண்ட மறைவைச் சூழலில் வெளிப்படுத்துகிறது.
- source_word: καὶ ἀπὸ τῶν γενεῶν
  choice: தலைமுறை தலைமுறையாகவும்
  rationale: முந்தைய சொற்றொடருடனான இணை அமைப்பையும் பல தலைமுறைகளாக நீடித்த மறைவையும் இயல்பாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘எல்லா’ என்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: νῦν δὲ
  choice: ஆனால் இப்போது
  rationale: முந்தைய மறைவுக்கும் தற்போதைய வெளிப்பாட்டுக்கும் இடையிலான வலுவான முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: ἐφανερώθη
  choice: வெளிப்படுத்தப்பட்டது
  rationale: இறைச் செயலை உணர்த்தும் செயப்பாட்டு வடிவைத் தக்கவைத்து, தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: அவருடைய பரிசுத்த மக்களுக்கு
  rationale: ἅγιοι என்பது தேவனுக்கென்று பிரித்தெடுக்கப்பட்ட விசுவாசிகளின் சமூகத்தைக் குறிப்பதைத் தெளிவாக்குகிறது; பிற்காலத்தில் தனிச்சிறப்புப் பெற்ற சிலரை மட்டும் குறிக்கும் பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: μυστήριον என்பதன் இறையியல் வலிமை
  choice: முன்பு மறைக்கப்பட்டிருந்து இப்போது வெளிப்படுத்தப்பட்ட இறை நோக்கத்தைக் குறிக்கும் ‘மறைபொருள்’
  alternative: இரகசியம்
  rationale: ‘இரகசியம்’ சாத்தியமான மொழிபெயர்ப்பாக இருந்தாலும், பவுலின் பயன்பாட்டில் காணப்படும் மறைக்கப்பட்டு பின்னர் வெளிப்படுத்தப்பட்ட இறைத் திட்டம் என்ற கருத்தை ‘மறைபொருள்’ சிறப்பாகப் பாதுகாக்கிறது.
- issue: ‘அவருடைய பரிசுத்த மக்கள்’ என்பவர்களின் அடையாளம்
  choice: தேவனுக்கென்று பிரித்தெடுக்கப்பட்ட விசுவாசிகளின் சமூகம்
  alternative: அவருடைய பரிசுத்தர்கள்
  rationale: பவுலின் வழக்கில் ἅγιοι என்பது விசுவாசிகள் அனைவரையும் குறிக்கிறது; சிறப்பான அல்லது அதிகாரபூர்வமாக அங்கீகரிக்கப்பட்ட சிலரை மட்டும் குறுக்குவதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘காலங்காலமாகவும் தலைமுறை தலைமுறையாகவும்’ என்பது கிரேக்க இணை அமைப்பைச் சொற்சொல்லாகக் கடினப்படுத்தாமல் அதன் இரட்டைக் காலவிரிவைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடுகள் உரையில் உரிய சொற்களுக்குப் பின்னர் இடம்பெற்றுள்ளன.
