  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother[b],
translation:
  language: ta
  text: கடவுளின் விருப்பத்தால் மெசியாவாகிய இயேசுவின்[a] அப்போஸ்தலனான பவுலும், நம் சகோதரனாகிய[b] தீமோத்தேயுவும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிறிஸ்துவாகிய இயேசு’ என்றும் மொழிபெயர்க்கலாம். Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டம்; இங்கு அதன் பட்டப்பொருளைப் பாதுகாக்க ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் சொற்பட ‘அந்தச் சகோதரன்’; கடிதத்தின் இத்தொடக்கத்தில் உள்ள பொதுவான விசுவாச உறவை இயல்பாகக் காட்ட ‘நம் சகோதரன்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: பவுல்
  rationale: Παῦλος என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: இங்கு இது வெறும் ‘தூதன்’ என்பதல்ல; பவுலின் அதிகாரப்பூர்வ அழைப்பையும் பணியையும் குறிக்கும் நிலைபெற்ற பட்டப்பெயர்.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவின்
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுகிறது. ‘மெசியா’ அந்தப் பட்டத்தின் பொருளாற்றலைத் தெளிவாக வைத்திருக்கிறது; ‘ஆகிய’ என்பது தமிழில் பட்டத்தையும் பெயரையும் இயல்பாக இணைக்கிறது.
- source_word: διὰ θελήματος θεοῦ
  choice: கடவுளின் திருவுளத்தின்படி
  rationale: διά உடன் வரும் இத்தொடர் பவுலின் அப்போஸ்தலப் பணி கடவுளுடைய விருப்பம் அல்லது தீர்மானத்தின் அடிப்படையில் அமைந்ததைச் சொல்கிறது. ‘திருவுளத்தின்படி’ என்பது இயல்பான, கண்ணியமான நவீனத் தமிழ்.
- source_word: Τιμόθεος
  choice: தீமோத்தேயு
  rationale: Τιμόθεος என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ὁ ἀδελφὸς
  choice: நம் சகோதரனாகிய
  rationale: கிரேக்கத்தில் சொற்பட ‘அந்தச் சகோதரன்’ என்று இருந்தாலும், கடிதத் தொடக்கத்தில் இது பவுலும் வாசகர்களும் பகிரும் விசுவாசக் குடும்ப உறவைக் குறிக்கிறது; தமிழில் ‘நம் சகோதரன்’ இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டப்பெயரின் மொழியாக்கம்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் Χριστός வெறும் பெயரின் பகுதியாக அல்லாமல் அபிஷேகம் செய்யப்பட்ட அரசர்/விடுதலையாளர் என்ற பட்டப்பொருளோடு நிற்கிறது. ஆகவே ‘மெசியா’ முதன்மை உரையில் வைக்கப்பட்டு, தமிழில் பரவலாக அறியப்பட்ட ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ὁ ἀδελφός என்பதன் உறவுப்பொருள்
  choice: நம் சகோதரன்
  alternative: அந்தச் சகோதரன்
  rationale: உறுப்புச் சொல்லை இயந்திரமாக மொழிபெயர்ப்பதைவிட, தொடக்க வாழ்த்தில் உள்ள பொதுவான விசுவாசக் குடும்ப உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இருப்பினும் சொற்படையான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடிதத் தொடக்கத்திற்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘திருவுளம்’ மற்றும் ‘அப்போஸ்தலன்’ ஆகியவை பரவலாகப் புரிந்துகொள்ளப்படும் வேதாகமச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன; பழமையான வினைமுற்றுகளும் தேவையற்ற சமயக்குழுச் சார்புகளும் தவிர்க்கப்பட்டுள்ளன.
