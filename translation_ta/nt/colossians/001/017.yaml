  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: ta
  text: அவரே எல்லாவற்றுக்கும் முன்பாக இருக்கிறார்[a]; எல்லாம் அவரில் ஒன்றாக நிலைத்திருக்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எல்லாவற்றுக்கும் முன்பாக’ என்பது எல்லாவற்றின்மேலும் அவருக்குள்ள மேன்மையையும் உட்குறிக்கலாம்; எனினும் கிரேக்கச் சொற்றொடர் முதன்மையாக முன்னிருப்பை வெளிப்படுத்துகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘எல்லாம் அவரில் நிலைபெற்றிருக்கின்றன’ அல்லது ‘எல்லாம் அவரில் ஒருங்கிணைந்து நிலைத்திருக்கின்றன.’
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: அவரே
  rationale: வாக்கியத்தில் வலியுறுத்தப்பட்டுள்ள சுட்டுப்பெயரின் அழுத்தத்தை இயல்பான தமிழில் ‘அவரே’ வெளிப்படுத்துகிறது; தேவையற்ற விரிவுரையைச் சேர்ப்பதில்லை.
- source_word: πρὸ πάντων
  choice: எல்லாவற்றுக்கும் முன்பாக
  rationale: πρό + பிறப்புவேற்றுமை இங்கு முதன்மையாக கால முன்னுரிமையைக் குறிக்கிறது. ‘எல்லாவற்றுக்கும் மேலாக’ என்பது தரநிலை அல்லது அதிகாரத்தை மட்டும் முன்னிறுத்தக்கூடும்.
- source_word: τὰ πάντα
  choice: எல்லாம்
  rationale: இச்சொற்றொடரின் விரிவான, அனைத்தையும் உள்ளடக்கும் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது; அதை ‘படைப்புகள்’ என்று தேவையின்றிக் குறுக்குவதில்லை.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: ἐν என்பதன் அடிப்படை உறவைப் பாதுகாத்து, ‘அவரால்’ அல்லது ‘அவர் மூலமாக’ என்று கருவிப்பொருளாக மட்டும் விளக்குவதைத் தவிர்க்கிறது.
- source_word: συνέστηκεν
  choice: ஒன்றிணைந்து நிலைத்திருக்கின்றன
  rationale: நிறைவுற்ற கால வினையின் விளைவாகத் தொடரும் தற்போதைய நிலையைத் தமிழில் தெளிவாகக் காட்டுகிறது; அனைத்தும் ஒழுங்காக ஒருங்கிணைந்து நிலைப்பதையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πρὸ πάντων என்பதில் கிறிஸ்துவுக்கும் அனைத்துப் படைப்புக்கும் உள்ள உறவு
  choice: ‘எல்லாவற்றுக்கும் முன்பாக’ என்று கால முன்னுரிமையை முதன்மை உரையில் வெளிப்படுத்துதல்
  alternative: ‘எல்லாவற்றுக்கும் மேலாக’ என்று மேன்மை அல்லது அதிகார நிலையைக் காட்டுதல்
  rationale: கிரேக்கச் சொற்றொடர் முதன்மையாக முன்னிருப்பைக் குறிக்கிறது. சூழலில் மேன்மையும் உட்பொருளாக இருக்கலாம்; ஆனால் அதை முதன்மை உரையில் மட்டும் பொருளாக மாற்றாமல் அடிக்குறிப்பில் குறிப்பிடுவது மூலத்தின் இறுக்கத்தைக் காக்கிறது.
- issue: συνέστηκεν என்பதன் பொருள் வலிமை
  choice: பிரபஞ்சம் ஒருங்கிணைந்து தொடர்ந்து நிலைத்திருத்தல்
  alternative: அனைத்தும் அவரில் அமைந்துள்ளன அல்லது அவரில் இருப்புப் பெற்றுள்ளன
  rationale: நிறைவுற்ற கால வடிவம் முன் நிகழ்ந்த செயலின் தொடரும் விளைவைச் சுட்டுகிறது. மொழிபெயர்ப்பு படைப்பின் ஒற்றுமை மற்றும் நிலைபேற்றைத் தெரிவிக்கிறது; அதன் இருப்பியல் நுணுக்கத்தை ஒரே விளக்கமாக முடிவுசெய்வதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அவரே’ மூலத்தின் வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது; அரைப்புள்ளி இரு இணை வாக்கியங்களின் நெருக்கமான தொடர்பைக் காட்டுகிறது.
