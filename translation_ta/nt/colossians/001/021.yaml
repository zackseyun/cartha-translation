source:
  edition: SBLGNT
  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: ta
  text: மேலும், ஒருகாலத்தில் அந்நியப்பட்டவர்களாகவும், மனதில் பகைமை கொண்டவர்களாகவும், தீய செயல்களில் ஈடுபட்டவர்களாகவும் இருந்த உங்களையும்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை மூலத்தின் அமைப்புக்கு நெருக்கமாக, “மனதில் பகைவர்களாகவும், தீய செயல்களில் இருந்தவர்களாகவும் இருந்த உங்களையும்” என்று மொழிபெயர்க்கலாம். மனதிலுள்ள பகைமைக்கும் தீய செயல்களுக்கும் இடையிலான தொடர்பை கிரேக்கச் சொற்றொடர் சுருக்கமாகக் கூறுகிறது; அது காரணத்தையா, செயல்படும் தளத்தையா, அல்லது வெளிப்பாட்டையா குறிக்கிறது என்பது தெளிவாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: மேலும் ... உங்களையும்
  rationale: முந்தைய வசனத்துடன் தொடரும் இணைப்பையும், அடுத்த வசனத்தில் நிறைவுபெறும் வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: ποτε ὄντας
  choice: ஒருகாலத்தில் ... இருந்த
  rationale: வாசகர்களின் முந்தைய நிலையை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: ἀπηλλοτριωμένους
  choice: அந்நியப்பட்டவர்களாக
  rationale: தேவனிடமிருந்து பிரிந்து, உறவுரீதியாக அந்நியமாகியிருந்த நிலையைக் குறிக்கும் நிறைவுற்ற செயப்பாட்டு வடிவத்தின் பொருளைக் காக்கிறது.
- source_word: ἐχθροὺς τῇ διανοίᾳ
  choice: மனதில் பகைமை கொண்டவர்களாக
  rationale: எழுத்துப்படியான ‘மனதில் பகைவர்கள்’ என்பதைக் காட்டிலும் இயல்பான தமிழில் உள்ளார்ந்த பகைநிலையை வெளிப்படுத்துகிறது.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: தீய செயல்கள் செய்துவந்த
  rationale: தீய செயல்கள் அவர்களின் முந்தைய வாழ்வில் தொடர்ந்து காணப்பட்டதைத் தெளிவான தமிழில் சொல்கிறது; கிரேக்கத்தின் சுருக்கமான தொடர்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔργοις
  choice: செயல்கள்
  rationale: இச்சூழலில் ‘கிரியைகள்’ என்பதைக் காட்டிலும் பொதுவாசகர்களுக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: πονηροῖς
  choice: தீய
  rationale: அச்சொல்லின் அறநெறிசார் தீமையை நேரடியாகவும் நடுநிலையாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: மனதிலுள்ள பகைமைக்கும் தீய செயல்களுக்கும் இடையிலான தொடர்பு
  choice: இரண்டையும் ஒருவரின் உள்ளார்ந்த நிலை மற்றும் வெளிப்புற நடத்தை என இயல்பான தமிழில் அருகருகே கூறுதல்
  alternative: “தீய செயல்களில் மனதில் பகைவர்களாக” என்று கிரேக்க அமைப்பை மிக நெருக்கமாகப் பின்பற்றுதல்
  rationale: ἐν என்ற முன்னிடைச்சொல் காரணம், தளம், அல்லது வெளிப்பாடு ஆகியவற்றில் எதைக் குறிக்கிறது என்பது உறுதியாக இல்லை. முதன்மை உரை காரணத் தொடர்பைச் சேர்க்காமல் இயல்பாக வாசிக்கிறது; அடிக்குறிப்பு மூலத்தின் இறுக்கமான அமைப்பையும் அதன் தெளிவின்மையையும் காட்டுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. இது அடுத்த வசனத்தில் நிறைவுபெறும் வாக்கியத் துணுக்கு என்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
