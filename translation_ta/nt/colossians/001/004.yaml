id: COL.1.4
reference: Colossians 1:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: ta
  text: மேசியா இயேசுவில் நீங்கள் கொண்டுள்ள விசுவாசத்தையும்[a], பரிசுத்தவான்கள் அனைவரிடமும் நீங்கள் கொண்டுள்ள அன்பையும் பற்றிக் கேள்விப்பட்டு,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியா இயேசுவில் நீங்கள் கொண்டுள்ள உண்மைத்தன்மை” அல்லது “மேசியா இயேசுவின்மேல் நீங்கள் வைத்துள்ள நம்பிக்கை.” கிரேக்கப் பெயர்ச்சொல்லான pistis, சூழலைப் பொறுத்து இத்தொடர்புடைய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: கேள்விப்பட்டு
  rationale: இறந்தகால வினையெச்சத்தின் தொடர்ச்சியை இயல்பான தமிழில் காக்கிறது; இதைத் தனியாகக் காரணவாக்கியமாக மாற்றாமல் முந்தைய வசனத்தோடு இணைக்கிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: மேசியா இயேசுவுடன் தொடர்புடைய நம்பிக்கையை இச்சூழலில் குறிக்கும் வழக்கமான வேதாகமச் சொல்; ‘நம்புதல்’ மற்றும் ‘உண்மைத்தன்மை’ ஆகிய தொடர்புடைய பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியா இயேசுவில்
  rationale: ἐν என்பதன் உறவுசார்/இடம்சார் அமைப்பை ‘இல்’ எனக் காக்கிறது; Χριστός என்பதைப் பட்டமாக ‘மேசியா’ என்று மொழிபெயர்த்து, Ἰησοῦ என்பதை ‘இயேசு’ என வழங்குகிறது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான தெளிவான, இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: ἣν ἔχετε
  choice: நீங்கள் கொண்டுள்ள
  rationale: அன்பு வாசகர்களிடம் தற்போது இருப்பதையும் நடைமுறையில் வெளிப்படுவதையும் குறிக்கும் சார்புத்தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: பரிசுத்தவான்கள் அனைவரிடமும்
  rationale: அன்பு யாரை நோக்கியது என்பதைத் தமிழில் இயல்பாகச் சொல்கிறது; ἅγιοι என்பதற்கான பவுலின் வழக்கமான அடையாளச் சொல்லைத் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστῷ என்பதைப் பட்டமாகவா அல்லது பெயர்போன்ற வடிவமாகவா வழங்குவது
  choice: மேசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு Χριστός, இயேசுவின் தனிப்பெயருடன் இணைந்த பட்டமாகச் செயல்படுவதால் அதன் பொருளை ‘மேசியா’ என்று மொழிபெயர்ப்பது பொருத்தமானது.
- issue: πίστις என்பதன் பொருள் நுணுக்கம்
  choice: விசுவாசம்
  alternative: நம்புதல்; உண்மைத்தன்மை
  rationale: உடனடிச் சூழலில் மேசியா இயேசுவுடன் தொடர்புடைய வாசகர்களின் விசுவாசமே முதன்மைப் பொருள். இருப்பினும் கிரேக்கச் சொல் தரக்கூடிய தொடர்புடைய பொருள் நுணுக்கங்கள் அடிக்குறிப்பில் விடப்படுகின்றன.
translation_notes:
  register: முந்தைய வசனத்தோடு இலக்கணத் தொடர்பைத் தக்கவைக்கும் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது. நடை நவீனமானதும் மரியாதைமிக்கதும் ஆகும்; ‘பரிசுத்தவான்கள்’ என்ற முக்கியச் சொல் நிலைநிறுத்தப்பட்டுள்ளது.
