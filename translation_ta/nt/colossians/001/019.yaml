  text: ὅτι ἐν αὐτῷ εὐδόκησεν πᾶν τὸ πλήρωμα κατοικῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/019.yaml
  text: For in him all the fullness was pleased to dwell[c][b][a],
translation:
  language: ta
  text: ஏனெனில்[a], முழு நிறைவும்[c] அவருக்குள் குடியிருக்க விரும்பியது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முழு நிறைவும் அவருக்குள் குடியிருக்க விரும்பியதால்’ என்றும் மொழிபெயர்க்கலாம். இந்த இணைப்புச்சொல் சூழலில் காரணத்தை அல்லது விளக்கத்தை ஒன்றுக்கு மேற்பட்ட விதத்தில் அறிமுகப்படுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: பல மொழிபெயர்ப்புகள் மறைந்திருப்பதாகக் கருதும் எழுவாயை வெளிப்படையாகச் சேர்த்து, ‘தேவன் தமது முழு நிறைவும் அவருக்குள் குடியிருக்க விரும்பினார்’ அல்லது ‘தந்தை விரும்பினார்’ என்று தருகின்றன. கிரேக்கத்தில் அந்த எழுவாய் நேரடியாகக் கூறப்படவில்லை.
    reason: alternative_reading
  - marker: c
    text: ‘முழு நிறைவு’ என்பது பொதுவாக தேவனுடைய முழு நிறைவைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது; கொலோசெயர் 2:9-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் குமாரனைப் பற்றிக் கூறப்பட்டவற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச்சொல்லாக இங்கு வருகிறது. தமிழில் அதன் விளக்கக் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள்
  rationale: இந்தப் பிரதிப்பெயர் உடனடி சூழலில் குமாரனைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘கிறிஸ்து’ அல்லது ‘மேசியா’ என்ற பட்டத்தைச் சேர்க்காமல் அதன் சொல்லமைப்பைப் பேணுகிறது.
- source_word: εὐδόκησεν
  choice: விரும்பியது
  rationale: இந்த வினைச்சொல் மனவிருப்பம், நல்விருப்பம் அல்லது உகந்த நோக்கத்தைத் தெரிவிக்கிறது. ‘விரும்பியது’ என்பது தமிழில் இயல்பாக இருந்து, மூலத்தில் வெளிப்படையாகக் கூறப்படாத ‘தேவன்’ அல்லது ‘தந்தை’ என்ற எழுவாயைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: πᾶν τὸ πλήρωμα
  choice: நிறைவு அனைத்தும்
  rationale: πᾶν என்பதன் முழுமையைக் குறிக்கும் வலிமையைப் பேணுவதோடு, மூலத்தில் இல்லாத ‘தேவனுடைய’ என்பதைச் சேர்க்காமல் இந்தச் சொற்றொடரின் இறையியல் செறிவையும் திறந்த நிலையையும் காக்கிறது.
- source_word: κατοικῆσαι
  choice: குடியிருக்க
  rationale: நிலையாகத் தங்கி வாழ்வதை அல்லது வாசம்பண்ணுவதை இந்த வினை குறிக்கிறது. ‘குடியிருக்க’ என்பது தெளிவான, இயல்பான, தற்போதைய தமிழ்ச் சொல்.
theological_decisions:
- issue: εὐδόκησεν என்பதன் மறைமுக எழுவாய்
  choice: முதன்மை உரையில் ‘நிறைவு அனைத்தும்’ என்பதை எழுவாயாக வாசிக்க இடமளித்து, ‘தேவன்’ அல்லது ‘தந்தை’ என்பதைச் சேர்க்கவில்லை.
  alternative: ‘தேவன் தமது நிறைவு அனைத்தும் அவருக்குள் குடியிருக்க விரும்பினார்’ அல்லது ‘தந்தை விரும்பினார்.’
  rationale: கிரேக்க வாக்கியத்தில் ‘தேவன்’ அல்லது ‘தந்தை’ என்று எழுவாய் நேரடியாக இல்லை; மேலும் πᾶν τὸ πλήρωμα என்பது வேற்றுமை வடிவில் எழுவாயாகவோ செயப்படுபொருளாகவோ அமையக்கூடியது. ஆகவே, பரவலான இறையியல் விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், மாற்று வாசிப்பை அடிக்குறிப்பில் தருவது மூலத்தின் பதற்றத்தைப் பேணுகிறது.
- issue: ‘நிறைவு’ என்பதன் குறிப்பு
  choice: ‘நிறைவு அனைத்தும்’ என்று விரிவாக்கமின்றி வைத்தல்.
  alternative: ‘தேவனுடைய நிறைவு அனைத்தும்’ அல்லது ‘அவருடைய நிறைவு அனைத்தும்.’
  rationale: சூழலும் கொலோசெயர் 2:9-உம் தேவனுடைய முழு நிறைவையே வலுவாகச் சுட்டினாலும், இவ்வசனத்தில் அதற்கான உரிய வேற்றுமைத் தொடர் வெளிப்படையாக இல்லை. எனவே பொருளின் இறையியல் கனத்தைப் பேணியபடியே மூலத்தில் இல்லாத சொற்களைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வாசம்பண்ண’ போன்ற பழைய வழக்கை விட ‘குடியிருக்க’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தில் உள்ள எழுவாய் மற்றும் ‘நிறைவு’ குறித்த உண்மையான தெளிவின்மை அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளது.
