source:
  edition: SBLGNT
  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: ta
  text: உங்களுக்காகக் கடவுளிடமிருந்து எனக்கு அளிக்கப்பட்ட பொறுப்பின்படி, கடவுளுடைய வார்த்தையை நிறைவேற்றுவதற்காக[a] நான் அந்தத் திருச்சபையின் பணியாளனானேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய வார்த்தையை முழுமையாக அறிவிப்பதற்காக”; அல்லது, “கடவுளுடைய வார்த்தையை முழுமைப்படுத்துவதற்காக.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: அந்தத் திருச்சபையின்
  rationale: பெண்பால் ஒருமை உறவுப்பெயர் முந்தைய வசனத்திலுள்ள ἐκκλησία (‘திருச்சபை’) என்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தொடர்பு தெளிவாகவும் இருக்க பெயர்ச்சொல் மீண்டும் சொல்லப்படுகிறது.
- source_word: ἐγενόμην
  choice: ஆனேன்
  rationale: ஊழியப் பங்கிற்குள் வந்ததை இயல்பாகக் காட்டுகிறது; வெளிப்படையான செயப்பாட்டு நியமிப்பை தேவையின்றி சேர்ப்பதில்லை.
- source_word: διάκονος
  choice: பணியாளன்
  rationale: சேவை செய்பவரைக் குறிக்கும் பொதுவான பொருளைத் தருகிறது; பிற்காலத் திருச்சபைப் பதவியான ‘உதவிக்காரர்’ அல்லது சமய வழக்குச் சொல்லான ‘ஊழியக்காரர்’ என்ற குறுகிய பொருளைத் திணிப்பதில்லை.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ
  choice: கடவுளின் நிர்வாகப் பொறுப்பின்படி
  rationale: οἰκονομία-வில் உள்ள ஒப்படைக்கப்பட்ட நிர்வாகம் அல்லது பொறுப்பு என்ற கருத்தைப் பாதுகாக்கிறது. τοῦ θεοῦ என்பதன் உறவை மிகக் குறுகிய வகையில் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: τὴν δοθεῖσάν μοι
  choice: எனக்கு அளிக்கப்பட்ட
  rationale: ஒப்படைக்கப்பட்ட பொறுப்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டி, மூலத்தின் செயப்பாட்டு வடிவத்தைப் பேணுகிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்காக
  rationale: பவுலுக்கு அளிக்கப்பட்ட பொறுப்பு வாசகர்களை நோக்கியதும் அவர்களது நலனுக்கானதும் என்பதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πληρῶσαι
  choice: நிறைவேற்றுவதற்காக
  rationale: ‘முழுமையாக அறிவித்தல்,’ ‘முழுமைப்படுத்தல்,’ ‘நிறைவேற்றல்’ ஆகிய நுணுக்கங்களுக்கிடையிலான மூலமொழியின் விரிவை ஓரளவு திறந்தே வைக்கிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தையை
  rationale: கடவுளிடமிருந்து வரும் அறிவிக்கப்பட்ட செய்தி என்ற பொருளையும் வேதாகமச் சொல் தொடர்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: πληρῶσαι τὸν λόγον τοῦ θεοῦ என்பதன் பொருள்
  choice: கடவுளுடைய வார்த்தையை நிறைவேற்றுவதற்காக
  alternative: கடவுளுடைய வார்த்தையை முழுமையாக அறிவிப்பதற்காக; கடவுளுடைய வார்த்தையை முழுமைப்படுத்துவதற்காக
  rationale: இச்சொற்றொடர் கடவுளுடைய வார்த்தையை முழுமையாக அறிவித்தல், அதன் நோக்கத்தை நிறைவேற்றுதல், அல்லது அதை முழுமைப்படுத்துதல் ஆகிய நுணுக்கங்களை ஏற்கக்கூடும். முதன்மை உரை இந்த இறையியல் அழுத்தத்தைத் தீர்த்துவிடாமல் பரந்த சொல்லாக்கத்தை வைத்திருக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; எளிதில் புரியும், கண்ணியமான நடை. கிரேக்க வாக்கிய வரிசையை அப்படியே பின்பற்றாமல், தமிழில் இயல்பான நோக்கம்–பொறுப்பு–முதன்மை வினை வரிசை பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சபை’ என்பது முந்தைய வசனத்துடனான தொடர்பைத் தெளிவாக்க மீண்டும் சொல்லப்பட்டுள்ளது.
