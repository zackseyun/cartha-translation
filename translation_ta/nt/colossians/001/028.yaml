  naturalness: ‘ஒவ்வொருவருக்கும் கற்பிக்கிறோம்’ இயல்பான தமிழ். எனினும் நோக்கத்தை நேரடியாக ‘... முன்நிறுத்துவதற்காக’ எனச் சொல்வது இவ்வசனத்தில் தெளிவாகவும் இயல்பாகவும் அமைகிறது. ‘முன்நிறுத்த’ என்பது παραστήσωμεν-ன் முன்னிலையில் நிறுத்துதல்/அர்ப்பணித்தல் என்ற உருவகத்தை ‘நிறுத்த’ என்பதைக் காட்டிலும் நன்றாகக் காக்கிறது.
  terminology: ‘அறிவிக்கிறோம்’, ‘எச்சரித்து’, ‘கிறிஸ்துவுக்குள்’, ‘முதிர்ச்சி அடைந்தவராக’ ஆகியவை ஏற்றவை. ‘முழு ஞானத்தோடு’ என்பதற்குப் பதிலாக ‘எல்லா ஞானத்தோடும்’ என்பது ἐν πάσῃ σοφίᾳ-யின் முழுமைத் தகுதியை நேரடியாகக் காட்டுகிறது; இங்கு அது எல்லா ஞானத்தையும் பயன்படுத்தி/முழு ஞானத்துடன் என்ற பொருளில் இயல்பாகப் புரியும்.
