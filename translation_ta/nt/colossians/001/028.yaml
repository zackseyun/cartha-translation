source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: ta
  text: அவரையே நாங்கள் அறிவிக்கிறோம்; ஒவ்வொருவரையும் எச்சரித்து, ஒவ்வொருவருக்கும் எல்லா ஞானத்தோடும் கற்பிக்கிறோம்; ஒவ்வொருவரையும் கிறிஸ்துவுக்குள் முதிர்ச்சி அடைந்தவராக முன்நிறுத்துவதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: அறிவிக்கிறோம்
  rationale: பொதுவாக வெளிப்படையாக அறிவித்தல் அல்லது பிரசித்தப்படுத்துதல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: νουθετοῦντες
  choice: எச்சரித்து
  rationale: தவறு அல்லது ஆபத்தை உணர்த்தி மனதில் பதியச் செய்யும் அறிவுறுத்தலைச் சுருக்கமாகக் காட்டுகிறது; ஆங்கில ஆலோசனை உரையின் ‘warning’ என்பதுடனும் ஒத்துள்ளது.
- source_word: πάντα ἄνθρωπον
  choice: ஒவ்வொருவரையும் / ஒவ்வொருவருக்கும்
  rationale: மூன்று முறை வரும் இந்தச் சொற்றொடரின் தனிநபர் ஒவ்வொருவரையும் உள்ளடக்கும் வலியுறுத்தலைத் தமிழில் பாதுகாக்கிறது; வேற்றுமை உருபு வினைக்கேற்ப மாறுகிறது.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: முழு ஞானத்தோடு
  rationale: πάσῃ என்பதன் முழுமை வலியுறுத்தலையும், ஞானம் போதித்தலின் முறையையோ சூழலையோ குறிக்கக்கூடிய நெகிழ்வையும் இயல்பாகத் தருகிறது.
- source_word: παραστήσωμεν
  choice: நிறுத்த
  rationale: ஒருவரை முன்வைத்தல் அல்லது முன்னிலையில் நிறுத்துதல் என்ற உருவகத்தைப் பாதுகாக்கிறது; இறுதி நிலையில் கடவுள்முன் நிறுத்தப்படுதல் என்ற பின்னணியையும் திறந்துவைக்கிறது.
- source_word: τέλειον
  choice: முதிர்ச்சி அடைந்தவராக
  rationale: இங்கு குற்றமற்ற பரிபூரணத்தைவிட வளர்ந்து முழுமையடைந்த நிலை என்ற கருத்து பொருத்தமானது; சாதாரண வாசகருக்கு தெளிவாக உள்ளது.
- source_word: ἐν Χριστῷ
  choice: கிறிஸ்துவுக்குள்
  rationale: ἐν என்பதன் ஒன்றிணைவு அல்லது உறவுசார் பரப்பைக் குறிக்கும் மொழியைத் தளர்த்தாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: τέλειον என்பதன் பொருள்
  choice: முதிர்ச்சி அடைந்தவராக
  alternative: பூரணமானவராக
  rationale: ‘பூரணமானவர்’ என்பது பாவமற்ற நிலை என எளிதில் மிகைப்படுத்திப் புரிந்துகொள்ளப்படலாம்; ‘முதிர்ச்சி அடைந்தவர்’ வளர்ச்சி மற்றும் முழுநிலையை வெளிப்படுத்துகிறது.
- issue: ἐν Χριστῷ என்பதன் உறவுசார் பொருள்
  choice: கிறிஸ்துவுக்குள்
  alternative: கிறிஸ்துவில்
  rationale: இரண்டும் சாத்தியம்; ‘கிறிஸ்துவுக்குள்’ என்பது ஒன்றிணைந்த வாழ்வுப் பரப்பை சற்று வெளிப்படையாகக் காட்டுகிறது, ஆனால் அதன் துல்லிய இறையியல் இயல்பை மேலும் வரையறுக்கவில்லை.
- issue: ἵνα உட்பிரிவின் நோக்கம்
  choice: இதன் மூலம் ... விரும்புகிறோம்
  alternative: '... நிறுத்துவதற்காக'
  rationale: ἵνα குறிக்கும் நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெற்றியின் உறுதியைச் சேர்க்காமல் அப்போஸ்தலப் பணியின் நோக்கமாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘ஒவ்வொருவரையும்’ என்ற மும்முறை வலியுறுத்தல் இயன்ற அளவு அப்படியே பாதுகாக்கப்பட்டுள்ளது. வாக்கிய ஓட்டத்திற்காக கிரேக்கத்தின் ஒரே நீண்ட வாக்கியம் இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
