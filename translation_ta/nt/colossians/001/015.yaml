revisions:
- from: அவர் கண்ணுக்குப் புலப்படாத கடவுளின் உருவம்; படைப்பனைத்திற்கும் முதற்பேறானவர்.[a]
  to: அவர் கண்ணுக்குப் புலப்படாத கடவுளின் உருவம், படைப்பு முழுவதற்கும் முதற்பேறானவர்.[a]
  rationale: Revision improves Tamil idiom and corrects the footnote’s awkward alternative while preserving the Greek wording and its disputed nuance. It does not impose the English audit trail’s interpretive ‘over’ rendering or the alternative reading that would make the Son explicitly part of creation.
