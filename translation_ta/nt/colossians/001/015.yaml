  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: ta
  text: அவர் கண்ணுக்குப் புலப்படாத கடவுளின் உருவம், படைப்பு முழுவதற்கும் முதற்பேறானவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘படைப்பு முழுவதற்கும் முதற்பேறானவர்’ என்று மொழிபெயர்க்கப்பட்ட கிரேக்கத் தொடர் பலவாறு புரிந்துகொள்ளப்படுகிறது. வேதாகமப் பயன்பாட்டில் ‘முதற்பேறானவர்’ என்பது காலவரிசையில் முதலில் பிறந்தவரை மட்டும் அல்லாமல், உயர்ந்த நிலை மற்றும் வாரிசுரிமையையும் குறிக்கலாம்; அடுத்த வசனங்களை ஒப்பிடுக.
    reason: மூல கிரேக்கத் தொடரின் இலக்கண உறவும் ‘முதற்பேறானவர்’ என்ற உருவகத்தின் பொருளும் விவாதத்திற்குரியவை என்பதைச் சுட்டுகிறது.
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: அவர் … ஆவார் / அவர் …
  rationale: ὅς முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மகனைக் குறிக்கிறது. தனி வசனமாக இயல்பாக வாசிக்கத் தமிழில் “அவர்” எனத் தொடங்கப்பட்டுள்ளது; நிகழ்கால இணைப்புவினையின் பொருள் பெயர்ப் பயனிலை அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: εἰκὼν
  choice: உருவம்
  rationale: இச்சொல் பிரதிநிதித்துவம், வெளிப்படுத்துதல் ஆகிய இரு சாத்தியங்களையும் தக்கவைக்கிறது; “சாயல்” அல்லது விளக்கமான விரிவுரையைவிட மூல உருவகத்துக்கு நெருக்கமானது.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: கண்ணுக்குப் புலப்படாத கடவுளின்
  rationale: ἀόρατος என்பதன் ‘காண இயலாத’ பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; மரியாதையும் தெளிவும் காக்க “கடவுள்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: πρωτότοκος
  choice: முதற்பேறானவர்
  rationale: பிறப்பு வரிசையோடு மட்டுமல்லாமல் நிலை, உரிமை, வாரிசுரிமை ஆகிய பின்னணிகளையும் தாங்கக்கூடிய மூல உருவகத்தை மொழிபெயர்க்கிறது; “முதன்மையானவர்” என்று மட்டும் கொடுத்தால் உருவகம் விளக்கமாகச் சுருங்கிவிடும்.
- source_word: πάσης κτίσεως
  choice: படைப்பனைத்திற்கும்
  rationale: முழுப் படைப்பையும் குறிக்கும் பரப்பைத் தெளிவாகத் தருகிறது. πρωτότοκος உடன் வரும் மரபுத்தொடரின் உறவை மிகையாகத் தீர்மானிக்காமல், தமிழில் இயல்பாகவும் சுருக்கமாகவும் அமைக்கிறது.
theological_decisions:
- issue: πρωτότοκος πάσης κτίσεως என்பது கிறிஸ்துவுக்கும் படைப்புக்கும் உள்ள உறவை எவ்வாறு குறிக்கிறது
  choice: படைப்பனைத்திற்கும் முதற்பேறானவர்
  alternative: படைப்பனைத்தின் முதற்பேறானவர்; படைப்பனைத்தின்மேலும் முதன்மையானவர்
  rationale: மூலத்தின் ‘முதற்பேறு’ உருவகத்தையும் அதன் இறையியல் அழுத்தத்தையும் காக்கிறது; அதேவேளை ‘முதன்மையானவர்’ என்று நேரடியாகப் பொருள் தீர்மானிப்பதையோ, அவர் படைப்பின் ஒரு பகுதி என்று வெளிப்படையாகச் சேர்ப்பதையோ தவிர்க்கிறது. அடுத்த வசனங்கள் இத்தொடரை விளக்குவதால், உள்ளார்ந்த பதற்றம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் மரியாதைமிக்க நடையைக் கடைப்பிடிக்கிறது. “கண்ணுக்குப் புலப்படாத” என்பது இயல்பான வழக்கு; அரைப்புள்ளி வசனத்தின் இரு இணையான கிறிஸ்துவியல் கூற்றுகளையும் தெளிவாகப் பிரிக்கிறது.
