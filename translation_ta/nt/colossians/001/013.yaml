  revision_rationale: 'The revision retains the verse’s source-text sequence and contrast: rescue from darkness’s authority and transfer into the Son’s kingdom. It replaces the potentially governmental and unnatural “மகனுடைய அரசு” with “மகனின் அரசாட்சி,” and uses the idiomatic Tamil expression “தமது அன்புக்குரிய மகன்.” The footnote preserves both the alternative interpretation and the literal Greek-style expression without imposing a doctrinal reading.'
