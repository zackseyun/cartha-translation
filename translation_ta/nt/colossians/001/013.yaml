    text: அல்லது, “தாம் நேசிக்கும் மகனின் அரசாட்சிக்குள்.” சொல்லுக்குச் சொல், “தமது அன்பின் மகனின் அரசாட்சிக்குள்.”
    reason: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ என்ற கிரேக்கத் தொடருக்கான இயல்பான மாற்றையும் சொல்லுக்குச் சொல் வடிவத்தையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἐρρύσατο
  choice: மீட்டு
  rationale: ῥύομαι என்பது ஆபத்து அல்லது பகைமைமிக்க அதிகாரத்திலிருந்து தீர்மானமாக மீட்பதைக் குறிக்கிறது; ‘மீட்டு’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἐξουσίας
  choice: அதிகாரத்திலிருந்து
  rationale: ἐξουσία என்பதன் நேரடிப் பொருள் அதிகாரம் அல்லது ஆளும் வல்லமை. ‘ஆளுகை’ அல்லது ‘ஆட்சிப்பரப்பு’ என்று விரிவுபடுத்தாமல் மூலத்தின் சொற்பொருள் காக்கப்படுகிறது.
- source_word: σκότους
  choice: இருளின்
  rationale: σκότος என்பதற்கு நேரான இணை ‘இருள்’; அதன் ஒழுக்க மற்றும் ஆவிக்குரிய உட்பொருள்கள் விளக்கிச் சேர்க்கப்படாமல் விடப்படுகின்றன.
- source_word: μετέστησεν
  choice: மாற்றினார்
  rationale: μεθίστημι என்பது ஓர் இடம் அல்லது ஆளுகையிலிருந்து மற்றொன்றுக்கு மாற்றுவதைக் குறிக்கிறது. ‘மாற்றினார்’ இரு அதிகாரப் பரப்புகளுக்கிடையேயான நகர்வைத் தக்கவைக்கிறது.
- source_word: βασιλείαν
  choice: அரசுக்குள்
  rationale: βασιλεία என்பது அரசாட்சி, ஆட்சி அல்லது அரசைக் குறிக்கலாம். εἰς மற்றும் மாற்றுதல் என்ற உருவகத்துடன் ‘அரசுக்குள்’ என்பது மகன் ஆளும் அரசுக்குள் கொண்டுசெல்லப்படுவதை இயல்பாகக் காட்டுகிறது.
- source_word: υἱοῦ
  choice: மகனுடைய
  rationale: υἱός என்பதன் நேரடிப் பொருள் ‘மகன்’; சூழலில் இது தனித்துவமான மகனைக் குறிக்கிறது.
- source_word: ἀγάπης
  choice: அன்பின்
  rationale: ἀγάπη என்பதற்கு ‘அன்பு’ பயன்படுத்தப்பட்டு, கிரேக்க வேற்றுமைத்தொகை முடிந்தவரை ‘தமது அன்பின் மகன்’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: தமது அன்பின் மகனுடைய
  rationale: ‘அவருடைய அன்பின் மகன்’ என்ற கிரேக்க அமைப்பைத் தமிழில் இயன்றவரை காக்கிறது. தந்தையே இங்கு செய்பவர் என்பதால் αὐτοῦ என்பதற்கு இயல்பான தற்சுட்டுப் பெயரடையான ‘தமது’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ என்ற வேற்றுமைத்தொகையின் பொருள்
  choice: தமது அன்பின் மகனுடைய
  alternative: தமது அன்புக்குரிய மகனுடைய; தாம் நேசிக்கும் மகனுடைய
  rationale: முதன்மை உரை கிரேக்கத்தின் ‘அவருடைய அன்பின் மகன்’ என்ற தனித்துவமான அமைப்பையும் அதன் இறையியல் நெருக்கத்தையும் பாதுகாக்கிறது. அது ‘அன்புக்குரிய மகன்’ அல்லது ‘அவர் நேசிக்கும் மகன்’ எனப் பொருள்படலாம் என்பதால், இயல்பான இரு விளக்கங்களும் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ராஜ்யம்’ என்பதற்குப் பதிலாக இன்றைய பொதுப் பயன்பாட்டிலுள்ள ‘அரசு’ தேர்ந்தெடுக்கப்பட்டுள்ளது; எனினும் ஆளுகை என்ற கருத்து சூழலில் நீடிக்கிறது. வாக்கியத்தின் எதிரெதிர் அமைப்பு—இருளின் அதிகாரத்திலிருந்து மகனுடைய அரசுக்குள்—தக்கவைக்கப்பட்டுள்ளது.
