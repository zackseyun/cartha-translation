revisions:
- from: அவர் நம்மை இருளின் அதிகாரத்திலிருந்து மீட்டு, தமது அன்பின் மகனுடைய அரசுக்குள் மாற்றினார்.[a]
  to: அவர் நம்மை இருளின் அதிகாரத்திலிருந்து மீட்டு, தமது அன்புக்குரிய மகனின் அரசாட்சிக்குள் மாற்றினார்.[a]
  rationale: 'The revision retains the verse’s source-text sequence and contrast: rescue from darkness’s authority and transfer into the Son’s kingdom. It replaces the potentially governmental and unnatural “மகனுடைய அரசு” with “மகனின் அரசாட்சி,” and uses the idiomatic Tamil expression “தமது அன்புக்குரிய மகன்.” The footnote preserves both the alternative interpretation and the literal Greek-style expression without imposing a doctrinal reading.'
  reviewer_model: gpt-5.6-terra
