  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் துல்லியமாக உள்ளன: καθὼς-இன் ஒப்புமை, எப்பாப்பிராவிடமிருந்து கற்றுக்கொண்டது, ‘எங்கள் அன்புக்குரிய சக அடிமை,’ ἡμῶν, மேசியாவின் διάκονος, மற்றும் ὑπὲρ ἡμῶν ஆகியவை காக்கப்பட்டுள்ளன. இருப்பினும், ‘கற்றுக்கொண்டபடியே’ என்பதற்குப் பதிலாக ‘கற்றுக்கொண்டதுபோல’ என்பது καθὼς-இன் ஒப்புமைத் தொடர்பை நவீன தமிழில் இயல்பாகக் காட்டுகிறது. πιστός இங்கு ‘உண்மையுள்ள’ என்பதைக் காட்டிலும் ‘நம்பிக்கைக்குரிய’ என வந்தால் பணிச் சூழலில் உள்ள நம்பகத்தன்மை தெளிவாகும்.'
