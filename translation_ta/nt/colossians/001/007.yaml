source:
  edition: SBLGNT
  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: ta
  text: எங்கள் அன்புக்குரிய சக அடிமையான[a] எப்பாப்பிராவிடமிருந்து நீங்கள் கற்றுக்கொண்டதுபோல, அவர் எங்கள் சார்பில்[b] மேசியாவின்[c] நம்பிக்கைக்குரிய பணியாளராக இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சக அடிமை’ என்பதற்கான கிரேக்கச் சொல் σύνδουλος; ஒரே எஜமானின் கீழ் மற்றொருவருடன் அடிமையாக இருப்பவரை நேரடியாகக் குறிக்கிறது. ‘சக பணியாளர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘எங்கள் சார்பில்’ என்பதை ‘எங்களுக்காக’ என்றும் புரிந்துகொள்ளலாம். சில கையெழுத்துப் பிரதிகளில் ‘உங்கள் சார்பில்’ அல்லது ‘உங்களுக்காக’ என்று உள்ளது.
    reason: textual_variant_and_lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் Χριστοῦ (கிறிஸ்தூ); இங்கு அது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டமாகப் பயன்படுவதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: கற்றுக்கொண்டபடியே
  rationale: முந்தைய கருத்துடன் ஒப்புமையையும் தொடர்பையும் ஏற்படுத்தும் ‘எப்படியோ/அப்படியே’ என்ற வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: எப்பாப்பிராவிடமிருந்து நீங்கள் கற்றுக்கொண்டபடியே
  rationale: ἀπό கற்றுக்கொண்ட செய்தியின் மனித மூலத்தைக் குறிக்கிறது; வினையின் இறந்தகால நிகழ்வும் தமிழில் தெளிவாக உள்ளது.
- source_word: τοῦ ἀγαπητοῦ συνδούλου ἡμῶν
  choice: எங்கள் அன்புக்குரிய சக அடிமையான
  rationale: σύνδουλος என்பது ஒரே எஜமானுக்குக் கீழுள்ள உடன் அடிமையைக் குறிக்கிறது. ‘சக அடிமை’ அதன் கட்டுப்பட்ட உடைமை உறவை மென்மையாக்காமல் காக்கிறது.
- source_word: πιστὸς
  choice: உண்மையுள்ள
  rationale: எப்பாப்பிராவின் நம்பகத்தன்மையையும் ஒப்படைக்கப்பட்ட பணியில் அவர் காட்டும் விசுவாசத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑπὲρ ἡμῶν
  choice: எங்கள் சார்பில்
  rationale: ὑπέρ இங்கு பிரதிநிதித்துவம் அல்லது பிறருக்காகச் செயல்படுதல் என்ற பொருளைக் கொண்டுள்ளது; ‘சார்பில்’ அதைச் சுருக்கமாகக் காக்கிறது.
- source_word: διάκονος
  choice: பணியாளர்
  rationale: இங்கு பிற்காலத் திருச்சபைப் பதவிப் பெயரை அவசியமாகக் குறிப்பதில்லை; மேசியாவுக்குச் செய்யும் சேவையைப் பொதுவாகக் குறிக்கிறது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு பெயரைப் போல மட்டுமல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: σύνδουλος என்பதிலுள்ள அடிமை உருவகம்
  choice: சக அடிமை
  alternative: சக பணியாளர் / உடன் ஊழியர்
  rationale: பவுலும் எப்பாப்பிராவும் ஒரே எஜமானுக்கு உரியவர்கள் என்ற உருவகத்தை மூலச்சொல் வெளிப்படுத்துகிறது. ‘பணியாளர்’ மட்டும் அந்த உறவின் வலிமையை மறைத்துவிடலாம்.
- issue: Χριστός என்பதன் பட்டப்பொருள்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் ஒருவருக்குச் சேவை செய்வதைச் சுட்டும் உரிமைத் தொடரில் Χριστός பட்டமாகத் தெளிவாகச் செயல்படுகிறது; ஆகவே அதன் பொருள் வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
- issue: ὑπὲρ ἡμῶν என்பதன் பொருளும் உரைவேறுபாடும்
  choice: எங்கள் சார்பில்
  alternative: எங்களுக்காக; சில கையெழுத்துப் பிரதிகளின்படி உங்களுக்காக / உங்கள் சார்பில்
  rationale: அச்சிடப்பட்ட SBLGNT உரையின் ἡμῶν ‘எங்கள்’ என்பதைக் கொண்டுள்ளது. ὑπέρ பிரதிநிதித்துவத்தையும் நன்மைக்காகச் செயல்படுதலையும் அனுமதிப்பதால் பிரதான உரையில் ‘சார்பில்’ வைக்கப்பட்டது; ὑμῶν என்ற முக்கிய உரைவேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் காக்கப்பட்டுள்ளன. ‘சக அடிமை’ திட்டமிட்டே கூர்மையான சொல்லாக வைக்கப்பட்டுள்ளது; மூலத்தின் எஜமான்–அடிமை உருவகத்தை ‘ஊழியர்’ என்று மென்மையாக்கவில்லை. ‘பணியாளர்’ என்பது διάκονος-ஐ தனிப்பட்ட திருச்சபைப் பதவியாகத் தீர்மானிக்காமல் சேவைப் பொருளில் வழங்குகிறது.
