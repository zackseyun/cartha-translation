  register: நவீன நிலையான தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘துன்பங்கள்’ மற்றும் ‘உபத்திரவங்கள்’ என்று வேறுபடுத்தி πάθημα/θλῖψις சொல் நுட்பம் காக்கப்பட்டுள்ளது. ‘மாம்சம்’ சற்று உயர்நடைச் சொல்லாக இருந்தாலும், பவுலின் உருவகத்தையும் உடல்சார்ந்த பொருளையும் துல்லியமாகப் பாதுகாக்கிறது.
