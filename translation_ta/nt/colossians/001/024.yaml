source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: ta
  text: இப்போது, உங்களுக்காக நான் அனுபவிக்கும் துன்பங்களில் மகிழ்கிறேன்; மேசியாவின்[a] உபத்திரவங்களில் உள்ள குறைவை[b], அவருடைய உடலாகிய சபைக்காக, என் மாம்சத்தில் நிரப்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் Χριστός; இதை “கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம். இங்கு அது பட்டப்பெயராக இருப்பதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “மேசியாவின் உபத்திரவங்களில் எஞ்சியிருப்பதை நிரப்புகிறேன்” என்றும் மொழிபெயர்க்கலாம். மேசியாவின் பாவநிவாரணச் செயலில் குறை இருந்தது என்று பவுல் கூறவில்லை; மேசியாவோடும் அவரது உடலாகிய சபையோடும் தொடர்புடைய துன்பங்களில் தான் பங்குபெறுவதை அவர் குறிப்பிடுகிறார்.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: இப்போது
  rationale: பவுலின் தற்போதைய சூழ்நிலையையும் மனநிலையையும் அறிமுகப்படுத்தும் இயல்பான காலக் குறிப்பு.
- source_word: χαίρω
  choice: மகிழ்கிறேன்
  rationale: நிகழ்கால வினையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: உங்களுக்காக நான் அனுபவிக்கும் துன்பங்களில்
  rationale: ἐν என்பதன் சூழ்நிலைப் பொருளையும் ὑπέρ என்பதன் நன்மைநோக்கிய பொருளையும் இயல்பான தமிழில் தருகிறது; முதல் நபர் சூழலிலிருந்து இவை பவுலின் துன்பங்கள் என்பது தெளிவாக்கப்படுகிறது.
- source_word: ἀνταναπληρῶ
  choice: நிறைவு செய்துவருகிறேன்
  rationale: குறைவாயிருப்பதை நிரப்புதல் அல்லது எஞ்சியிருப்பதை நிறைவேற்றுதல் என்ற உருவகத்தைப் பாதுகாக்கிறது; நிகழ்ந்துவரும் செயல் என்பதையும் காட்டுகிறது.
- source_word: τὰ ὑστερήματα
  choice: குறைவாயிருப்பதை
  rationale: மூலத்தின் வலுவான, சிந்தனைத் தூண்டும் சொல்லாட்சியை மென்மையாக்காமல் இயல்பான தமிழில் காக்கிறது.
- source_word: τῶν θλίψεων
  choice: உபத்திரவங்களில்
  rationale: முன்னுள்ள παθήματα என்பதற்கு பயன்படுத்திய ‘துன்பங்கள்’ என்பதிலிருந்து வேறுபடுத்தி, நெருக்குதல் மற்றும் வேதனை என்ற θλῖψις சொல்லின் நுட்பத்தைத் தக்கவைக்கிறது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் அதன் யூத மேசியா சார்ந்த பொருளை வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ σαρκί μου
  choice: என் மாம்சத்தில்
  rationale: பவுலின் உடல்சார்ந்த வாழ்வையும் துன்பத்தையும் குறிக்கும் σάρξ உருவகத்தை ‘பாவ இயல்பு’ என்று விளக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: அவருடைய உடலாகிய திருச்சபைக்காக
  rationale: ὑπέρ என்பதன் நன்மைநோக்கிய பொருளையும் ‘உடல்’ என்ற திருச்சபை உருவகத்தையும் காக்கிறது; அடுத்த அடையாளப்படுத்தும் கூறை தமிழில் இயல்பாக இணைக்கிறது.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: அவருடைய உடலாகிய திருச்சபை
  rationale: ‘அவருடைய உடல்’ என்பது திருச்சபை என்று உறவுப்பெயரெச்சத் தொடர் அடையாளப்படுத்துவதைச் சுருக்கமான இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘மேசியாவின் உபத்திரவங்களில் குறைவாயிருப்பது’ என்பதன் பொருள்
  choice: மூலத்தின் வலுவான சொல்லாட்சியை பிரதான உரையில் அப்படியே காத்து, இது மேசியாவோடும் அவரது உடலாகிய திருச்சபையோடும் தொடர்புடைய தொடரும் உபத்திரவங்களில் பவுல் பங்குபெறுவதைக் குறிக்கிறது என்று அடிக்குறிப்பில் விளக்குதல்.
  alternative: மேசியாவின் மீட்புக்குரிய துன்பங்களே ஏதோ குறைபாடுடையவை என்றும் பவுலின் துன்பங்கள் அவற்றைப் பூர்த்திசெய்கின்றன என்றும் பொருள்கொள்ளுதல்; அல்லது இது இறுதிக்கால மேசியா உபத்திரவங்களின் முன்குறிக்கப்பட்ட அளவை மட்டுமே குறிக்கிறது என்று வரையறுத்தல்.
  rationale: θλίψεις என்ற சொல்லும் ‘அவருடைய உடலாகிய திருச்சபைக்காக’ என்ற தொடர்பும் ஊழிய மற்றும் திருச்சபை சார்ந்த பங்கேற்பை ஆதரிக்கின்றன. அதேவேளையில், ‘குறைவாயிருப்பது’ என்ற மூலத்தின் இறுக்கத்தை மொழிபெயர்ப்பு நீக்கக்கூடாது.
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு Χριστός பட்டப்பெயரின் வலிமையைக் கொண்டிருப்பதால் ‘மேசியா’ அதன் பொருளை வெளிப்படையாகத் தருகிறது; பரவலான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
