  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: ta
  text: ஏனெனில், அவருக்குள் வானங்களில் உள்ளவையும் பூமியின்மேல் உள்ளவையும், காணப்படுகிறவையும் காணப்படாதவையும்—அரியணைகளானாலும், ஆட்சிகளானாலும், ஆட்சியாளர்களானாலும், அதிகாரங்களானாலும்—அனைத்தும் படைக்கப்பட்டன; அனைத்தும் அவர் மூலமாகவும் அவருக்காகவும் படைக்கப்பட்டுள்ளன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவருக்காகவும்” என்பதற்கு “அவரை நோக்கியும்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் படைப்பின் இலக்கை அல்லது நோக்கத்தைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக இயல்பாகவும் காரணப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள்
  rationale: பின்னர் வரும் δι’ αὐτοῦ என்பதிலிருந்து வேறுபடுத்தி, ἐν என்பதன் ‘அவருக்குள்’ என்ற வடிவத்தைப் பாதுகாக்கிறது; இதை ‘அவரால்’ என்று கருவிப் பொருளாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: ἐκτίσθη / ἔκτισται
  choice: படைக்கப்பட்டன / படைக்கப்பட்டிருக்கின்றன
  rationale: முதலாவது இறந்தகால நிகழ்வையும், இரண்டாவது நிறைவுற்று நிலைத்திருக்கும் படைப்புச் செயலையும் தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: τὰ πάντα
  choice: அனைத்தும்
  rationale: முழுமையான பரப்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: வானங்களில் உள்ளவையும்
  rationale: οὐρανοῖς என்பதன் பன்மையைப் பாதுகாத்து, தொடரின் தமிழ்ச் சொல்லமைப்புக்கு இயல்பாக உள்ளது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியின்மேல் உள்ளவையும்
  rationale: ἐπί உடைய இடப்பொருளை நேரடியாக வெளிப்படுத்தி, வானங்கள்–பூமி என்ற அகிலப் பரப்பைப் பாதுகாக்கிறது.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: காணப்படுகிறவையும் காணப்படாதவையும்
  rationale: பெயர்ச்சொல் செயலாற்றும் பெயரடைகளின் எதிர்மறை இணைப்பை தெளிவான நவீன தமிழில் தருகிறது.
- source_word: θρόνοι
  choice: அரியணைகள்
  rationale: அதிகார நிலைகளைச் சுட்டக்கூடிய உருவகத்தை விளக்கிக் குறுக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: κυριότητες
  choice: ஆட்சிகள்
  rationale: κυριότης என்பதன் ஆளுமை அல்லது ஆதிக்கப் பொருளை, புரிந்துகொள்ளத்தக்க தமிழில் தருகிறது; குறிப்பிட்ட விண்ணுலக வகைப்பாடாக வரையறுக்கவில்லை.
- source_word: ἀρχαὶ
  choice: ஆளுகைகள்
  rationale: ஆளும் முதன்மை அல்லது அதிகார அமைப்புகளைக் குறிக்கும் பொருளைத் தருகிறது; அடுத்துள்ள ἐξουσίαι என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: ἐξουσίαι
  choice: அதிகாரங்கள்
  rationale: அங்கீகரிக்கப்பட்ட அதிகாரம் அல்லது அதிகாரமுள்ள சக்திகள் என்ற நேரடிப் பொருளைத் தருகிறது.
- source_word: δι’ αὐτοῦ καὶ εἰς αὐτόν
  choice: அவர் மூலமாகவும் அவருக்காகவும்
  rationale: διὰ என்பதன் இடைமுறை அல்லது வழிமுறைப் பொருளையும், εἰς என்பதன் இலக்கு அல்லது நோக்கப் பொருளையும் வேறுபடுத்திப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν என்ற மூன்று சொற்றொடர்களில் குமாரனுக்கும் படைப்புக்கும் உள்ள உறவு
  choice: ‘அவருக்குள் ... அவர் மூலமாகவும் ... அவருக்காகவும்’ என்று வேறுபட்ட முன்னிடைச்சொற்களைப் பாதுகாத்தல்
  alternative: ‘அவரால் ... அவர் மூலமாக ... அவருக்காக’ அல்லது ‘அவரோடு ஒன்றிப்பட்டு ... அவர் மூலமாக ... அவரை நோக்கி’
  rationale: கிரேக்கம் மூன்று வேறுபட்ட உறவுகளை அடுக்குகிறது. அவற்றை ஒரே ‘அவரால்’ என்ற விளக்கமாகச் சுருக்காமல், உள்ளார்ந்த இறையியல் செறிவையும் தெளிவுபடுத்தப்படாத பரப்பையும் காக்கிறது.
- issue: ‘அரியணைகள், ஆட்சிகள், ஆளுகைகள், அதிகாரங்கள்’ என்பவற்றின் இயல்பு
  choice: படைக்கப்பட்ட அதிகார நிலைகள் அல்லது சக்திகளாகத் திறந்த நிலையில் மொழிபெயர்த்தல்
  alternative: அவற்றைத் தனிப்பட்ட தேவதூதர் அணிகளாகவோ மனித அரசியல் அமைப்புகளாகவோ வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: வசனம் இவற்றை படைக்கப்பட்ட ஒழுங்குக்குள் வைக்கிறது; ஆனால் இங்கே அவை விண்ணுலகச் சக்திகளா, பூமிக்குரிய ஆட்சிகளா என்று குறுக்கி வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கத்தின் ஒரே வாக்கிய அமைப்பை அரைப்புள்ளியுடன் காத்து, பட்டியலை நீள்கோடுகளால் தெளிவுபடுத்துகிறது. ‘அவருக்குள்’ என்பது தமிழில் சற்றே குறியீட்டுத்தன்மையுடையதாக இருந்தாலும், ἐν / διά / εἰς வேறுபாட்டை மறைக்காமல் இருப்பதற்காகத் திட்டமிட்டு வைக்கப்பட்டது.
