id: COL.1.2
reference: Colossians 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: ta
  text: 'கொலோசேயில் வாழும், மேசியாவில்[c] தூயவர்களும் உண்மையுள்ளவர்களுமான[a] சகோதரர்களுக்கு[b]: நம் தந்தையாகிய கடவுளிடமிருந்து உங்களுக்கு அருளும் சமாதானமும் உண்டாவதாக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்புகிறவர்களுமான.” கிரேக்கச் சொல் நம்புகிறவர்களையோ உண்மையுடன் நிலைத்திருப்பவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்கள்” என்பதே கிரேக்கச் சொல்வடிவம்; இச்சூழலில் பெண்கள் உட்படச் சபை முழுவதையும் பவுல் குறிப்பிட்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'பாரம்பரிய மொழிபெயர்ப்பு: “கிறிஸ்துவில்.” Χριστός என்ற கிரேக்கப் பட்டத்தின் பொருள் “மேசியா.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: கொலோசேயில் வாழும் ... சகோதரர்களுக்கு
  rationale: இடத்தைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பான தமிழ் முகவரியாகத் தருகிறது. ‘வாழும்’ என்பது அங்கே இருக்கும் பெறுநர்களைக் குறிக்கிறது; தேவையற்ற நகரம் போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ἁγίοις
  choice: தூயவர்களும்
  rationale: கடவுளுக்காகப் பிரித்துவைக்கப்பட்ட தூய்மை என்ற அடிப்படைப் பொருளைத் தருகிறது; பிற்காலச் சிறப்புப் பட்டமாகப் புரிந்துகொள்ளப்படக்கூடிய ‘புனிதர்கள்’ என்பதைத் தவிர்க்கிறது.
- source_word: πιστοῖς
  choice: உண்மையுள்ளவர்களுமான
  rationale: πιστός என்பதன் ‘உண்மையாய் நிலைத்திருப்பவர்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது. அது ‘நம்புகிறவர்’ என்றும் பொருள்படக்கூடியதால் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀδελφοῖς
  choice: சகோதரர்களுக்கு
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது. சூழலில் பெண்களும் உள்ளடங்கியிருக்க வாய்ப்புள்ளது என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவில்
  rationale: Χριστός இங்கு பட்டமாக இருப்பதால் அதன் பொருளான ‘மேசியா’ பயன்படுத்தப்படுகிறது. ‘-இல்’ வடிவம் பவுலின் ஒன்றிப்பைச் சுட்டும் உருவகத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: உங்களுக்கு அருளும் சமாதானமும் உண்டாவதாக
  rationale: கிரேக்கச் சொல் வரிசையையும் வாழ்த்தின் நோக்கத்தையும் இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது; தமிழில் தேவைப்படும் வாழ்த்து வினை சேர்க்கப்பட்டுள்ளது.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: நம் தந்தையாகிய கடவுளிடமிருந்து
  rationale: πατρὸς ἡμῶν என்பதை θεοῦ-க்கு விளக்கமாகப் புரிந்து, இணைப்புச்சொல் சேர்க்காமல் ‘நம் தந்தையாகிய கடவுள்’ எனத் தருகிறது.
theological_decisions:
- issue: πιστοῖς என்பதிலுள்ள நம்பிக்கை/உண்மைத்தன்மை இருபொருள்
  choice: உண்மையுள்ளவர்கள்
  alternative: நம்புகிறவர்கள்
  rationale: வசனம் இரண்டில் ஒன்றைத் தெளிவாகத் தேர்ந்தெடுக்க வற்புறுத்தவில்லை. முதன்மை உரையில் உண்மைத்தன்மை தரப்பட்டு, நம்பிக்கை சார்ந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ἀδελφοῖς என்பதின் இலக்கணப் பாலினமும் சமூகக் குறிப்பும்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்
  rationale: முதன்மை உரை கிரேக்க ஆண்பால் பன்மையைப் பிரதிபலிக்கிறது; அதே நேரத்தில் பவுல் முழுச் சபையையும், பெண்கள் உட்பட, குறிப்பிட்டிருக்கலாம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: ἐν Χριστῷ என்பதில் Χριστός-ஐ மொழிபெயர்த்தல்
  choice: மேசியாவில்
  alternative: கிறிஸ்துவில்
  rationale: Χριστός இங்கு பெயராக அல்ல, பட்டமாகச் செயல்படுவதால் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பொருளைத் தாங்கும் ‘மேசியா’ தேர்ந்தெடுக்கப்படுகிறது; பாரம்பரிய வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கடித-வாழ்த்து நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேசியாவில்’ என்ற சற்றே உருவகமான சொற்றொடர் பவுலின் ἐν Χριστῷ மொழியைத் தட்டையாக்காமல் காக்கிறது. ‘அருள்’, ‘சமாதானம்’ ஆகியவை பரவலாகப் புரிந்துகொள்ளப்படும் வேதாகமச் சொற்களாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளன.
