translation:
  language: ta
  text: உங்களுக்காகப் பரலோகங்களில்[a] சேமித்து வைக்கப்பட்டிருக்கும் நம்பிக்கையின் காரணமாகவே; அந்த நம்பிக்கையைப் பற்றி, சத்தியத்தின் வார்த்தையாகிய நற்செய்தியில் நீங்கள் முன்பே கேட்டீர்கள்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரலோகத்தில்.’ கிரேக்க மூலத்தில் ‘பரலோகங்கள்’ என்று பன்மையில் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘முன்பே கேட்டீர்கள்’ என்பதை ‘ஏற்கெனவே கேள்விப்பட்டீர்கள்’ அல்லது ‘முன்னதாகக் கேட்டீர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘சத்தியத்தின் வார்த்தை’ என்பதை ‘சத்தியத்தின் செய்தி’ என்றும் மொழிபெயர்க்கலாம். ‘நற்செய்தி’ என்பது அந்த வார்த்தை அல்லது செய்தியை அடையாளப்படுத்தும் விளக்கநிலைச் சேர்க்கை.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: நம்பிக்கையின் காரணமாகவே
  rationale: διά + accusative இங்கு முந்தைய வசனத்தில் கூறப்பட்ட விசுவாசத்துக்கும் அன்புக்கும் காரணம் அல்லது அடிப்படையைக் குறிக்கிறது. ἐλπίς என்பதற்கு இயல்பான ‘நம்பிக்கை’ பயன்படுத்தப்பட்டது.
- source_word: ἀποκειμένην ὑμῖν
  choice: உங்களுக்காகச் சேமித்து வைக்கப்பட்டிருக்கும்
  rationale: ἀπόκειμαι என்பது பாதுகாப்பாக வைத்திருத்தல் அல்லது ஒதுக்கி வைத்திருத்தல் என்ற பொருளுடையது; ὑμῖν பயன் சார்ந்த ‘உங்களுக்காக’ எனக் கொடுக்கப்பட்டது.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: பரலோகங்களில்
  rationale: மூலத்தில் உள்ள பன்மை வடிவத்தைத் தமிழிலும் இயன்றவரை பாதுகாக்கிறது.
- source_word: ἣν προηκούσατε
  choice: அந்த நம்பிக்கையைப் பற்றி ... நீங்கள் முன்பே கேட்டீர்கள்
  rationale: பெண்பால் ஒருமை சார்புப்பெயர் ἣν நேரடியாக ἐλπίδα என்பதையே சுட்டுகிறது. προακούω-வின் முன்பே கேட்டல் என்ற பொருளும் தெளிவாக வைக்கப்பட்டது.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
  choice: சத்தியத்தின் வார்த்தையாகிய நற்செய்தியில்
  rationale: λόγος என்பதன் ‘வார்த்தை/செய்தி’ பரப்பில் ‘வார்த்தை’ தேர்ந்தெடுக்கப்பட்டது; τοῦ εὐαγγελίου என்பதை விளக்கநிலைச் சேர்க்கையாகக் கொண்டு, நற்செய்தியே அந்தச் சத்தியத்தின் வார்த்தை எனக் காட்டுகிறது.
theological_decisions:
- issue: சார்புத் தொடரின் குறிப்பு
  choice: ‘அந்த நம்பிக்கையைப் பற்றி’ என்று ἣν-ஐ ‘நம்பிக்கை’ என்பதோடு நேரடியாக இணைத்தல்
  alternative: முழு நற்செய்திச் செய்தியையும் பொதுவாகக் குறிப்பதாக மொழிபெயர்த்தல்
  rationale: ἣν என்பது பெண்பால் ஒருமையாக ἐλπίδα என்பதுடன் இலக்கண ரீதியாக ஒத்துப்போகிறது; ஆகவே மூலத்தின் நேரடியான தொடர்பு பாதுகாக்கப்பட்டது.
- issue: οὐρανοῖς என்பதன் எண்ணிக்கை
  choice: ‘பரலோகங்களில்’ என்ற பன்மை
  alternative: ‘பரலோகத்தில்’ என்ற இயல்பான ஒருமை
  rationale: கிரேக்க மூலத்தின் பன்மையை மறைக்காமல் வைத்திருக்கிறது; தமிழ் வழக்கில் ஒருமையும் சாத்தியமென்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: τοῦ εὐαγγελίου என்பதன் தொடர்பு
  choice: ‘சத்தியத்தின் வார்த்தை’ என்பதை அடையாளப்படுத்தும் விளக்கநிலைச் சேர்க்கையாக ‘நற்செய்தி’
  alternative: ‘நற்செய்தியின் சத்திய வார்த்தை’ என உடைமைத் தொடர்பாக வாசித்தல்
  rationale: சொற்றொடரின் இயல்பான கிரேக்க அமைப்பில் ‘நற்செய்தி’ என்பது ‘சத்தியத்தின் வார்த்தை’யை மறுபெயரிட்டு அடையாளப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. வசனம் கிரேக்கத்தில் முந்தைய வாக்கியத்துடன் தொடர்வதால், தனியாக வாசிக்கத் தெளிவாக ‘இவை உண்டாயின’ சேர்க்கப்பட்டது; இது முந்தைய வசனத்தின் விசுவாசத்தையும் அன்பையும் சுட்டுகிறது.
