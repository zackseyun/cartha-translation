source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: ta
  text: இதனால் நாங்களும், இதைக் கேள்விப்பட்ட நாள் முதல், உங்களுக்காக ஜெபிப்பதையும், ஆவிக்குரிய[b] எல்லா ஞானத்தோடும் புரிந்துணர்வோடும் அவருடைய திருவுளத்தைப் பற்றிய அறிவால்[a] நீங்கள் நிரப்பப்பட வேண்டும் என்று வேண்டுவதையும் நிறுத்தவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முழுமையான அறிவு’ அல்லது ‘ஆழமான அறிவு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அதிக நிறைவு அல்லது ஆழம் கொண்ட அறிவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆவிக்குரிய’ என்பது இயல்பில் ஆவிக்குரியதையோ, ஆவியால் அருளப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: இதனால்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட கொலோசெயரின் விசுவாசத்தையும் அன்பையும் பற்றிய செய்தியைத் தொடர்ந்து வரும் காரணவிளைவு தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: καὶ ἡμεῖς
  choice: நாங்களும்
  rationale: καί தரும் சேர்த்துக் கூறும் வலியுறுத்தலையும் ἡμεῖς என்பதிலுள்ள வெளிப்படையான எழுவாயையும் காக்கிறது.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: இதைக் கேள்விப்பட்ட நாள் முதல்
  rationale: தொடர்ந்து நடைபெறும் ஜெபம் தொடங்கிய காலப்புள்ளியைத் தெளிவாகக் காட்டுகிறது; ‘இதை’ என்பது முந்தைய செய்தியைக் குறிக்கும் சூழல்சார் நிறைவு.
- source_word: οὐ παυόμεθα
  choice: நிறுத்தவில்லை
  rationale: கடந்த காலத்தில் தொடங்கி இன்றுவரை தொடரும் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களுக்காக
  rationale: அவர்களுடைய நன்மையை நோக்கிய ஜெபம் என்ற பொருளை நேரடியாகத் தருகிறது.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: ஜெபிப்பதையும் ... வேண்டுவதையும்
  rationale: பொதுவான ஜெபத்தையும் அதற்குள் இடம்பெறும் குறிப்பிட்ட விண்ணப்பத்தையும் தனித்தனியாகக் காத்து, இரண்டையும் ஒன்றாகச் சுருக்காமல் வழங்குகிறது.
- source_word: ἵνα πληρωθῆτε
  choice: நீங்கள் நிரப்பப்பட வேண்டும் என்று
  rationale: விண்ணப்பத்தின் உள்ளடக்கத்தையும் கிரேக்கச் செயலப்பாட்டு வடிவத்தையும் காக்கிறது; நிரப்புகிறவர் கடவுள் என்பது குறிப்பால் உணரப்பட்டாலும் உரையில் கூடுதலாகச் சேர்க்கப்படவில்லை.
- source_word: τὴν ἐπίγνωσιν
  choice: அறிவால்
  rationale: πληρόω உடன் வரும் அறிவை நிரப்பப்படும் உள்ளடக்கமாக இயல்பான தமிழில் காட்டுகிறது. ἐπίγνωσις என்பதில் இருக்கக்கூடிய ‘முழுமையான/ஆழமான அறிவு’ என்ற நுட்பம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: அவருடைய திருவுளத்தைப் பற்றிய
  rationale: கடவுள் விரும்புவதையும் நோக்குவதையும் குறிக்கும் θέλημα என்பதற்கு நவீனத் தமிழில் கண்ணியமானதும் தெளிவானதுமான வடிவம்.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: ஆவிக்குரிய எல்லா ஞானத்தோடும் புரிந்துணர்வோடும்
  rationale: ἐν என்பதன் உடனிகழ்வு அல்லது செயல்படும் தளம் சார்ந்த பொருளை ‘-ஓடும்’ வடிவில் இயல்பாகத் தருகிறது; πνευματικῇ என்பதை ஞானம், புரிந்துணர்வு இரண்டுக்கும் பொதுவாகச் சார்ந்ததாக வைத்திருக்கிறது.
- source_word: σοφίᾳ
  choice: ஞானம்
  rationale: நடைமுறை மற்றும் இறையியல் சார்ந்த அறிவார்ந்த வாழ்வுத்திறனைச் சுட்டும் நிலையான தமிழ் இணை.
- source_word: συνέσει
  choice: புரிந்துணர்வு
  rationale: கருத்துகளின் தொடர்பைப் பற்றிக்கொண்டு உணரும் திறனை ‘ஞானம்’ என்பதிலிருந்து வேறுபடுத்தியும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐπίγνωσις என்பதன் வலிமை
  choice: அறிவு
  alternative: முழுமையான அறிவு; ஆழமான அறிவு
  rationale: இச்சொல் அதிக நிறைவு அல்லது ஆழம் கொண்ட அறிவைக் குறிக்கலாம்; எனினும் அந்த வலிமையை முதன்மை உரையில் கட்டாயமாக்காமல், உண்மையான சொற்பொருள் வாய்ப்பை அடிக்குறிப்பில் வைத்திருக்கிறது.
- issue: πνευματικῇ என்பதன் குறிப்பு
  choice: ஆவிக்குரிய என்பது ஞானத்தையும் புரிந்துணர்வையும் வர்ணிக்கிறது; பரிசுத்த ஆவியை வெளிப்படையாகப் பெயரிடவில்லை
  alternative: ஆவியால் அருளப்படும் ஞானமும் புரிந்துணர்வும்
  rationale: கிரேக்கப் பெயரடை ஆவிக்குரிய இயல்பையோ ஆவியால் அளிக்கப்படுவதையோ குறிக்கலாம். மூலத்தின் சுருக்கத்தையும் திறந்த பொருள் வாய்ப்பையும் முதன்மை உரை காக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருவுளம்’, ‘ஞானம்’, ‘ஆவிக்குரிய’ போன்ற பரவலாக அறியப்படும் வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; வாக்கியத்தின் நீளம் கிரேக்க மூலத்தின் ஒருங்கிணைந்த ஜெப அமைப்பை பிரதிபலிக்கிறது.
