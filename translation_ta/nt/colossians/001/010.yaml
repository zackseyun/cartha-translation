source:
  edition: SBLGNT
  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: ta
  text: ஆண்டவருக்குத் தகுந்தவாறு வாழ்ந்து, எல்லாவிதத்திலும் அவருக்குப் பிரியமாய் இருக்கவும்,[a] ஒவ்வொரு நற்செயலிலும் கனி தந்து, கடவுளைப் பற்றிய அறிவில் வளரவும் வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “எல்லாவிதப் பிரியத்திற்காக.” யாருக்குப் பிரியமாய் என்பது கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் அது ஆண்டவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கடவுளைப் பற்றிய முழுமையான அறிவில் வளரவும்” என்றும் மொழிபெயர்க்கலாம். “கடவுளைப் பற்றிய அறிவினால் வளரவும்” என்பதும் இலக்கணப்படி சாத்தியம்.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: வாழ்ந்து
  rationale: கிரேக்கத்தில் உள்ள ‘நடத்தல்’ என்ற உருவகத்தின் பொருள் வாழ்க்கை நடத்தையைக் குறிக்கிறது; நவீன தமிழில் ‘வாழ்ந்து’ என்பது இயல்பாகவும் தெளிவாகவும் அதைப் conveys செய்கிறது.
- source_word: ἀξίως τοῦ κυρίου
  choice: ஆண்டவருக்குத் தகுந்தவாறு
  rationale: ἀξίως என்பதன் பொருத்தம் அல்லது தகுதிக்கேற்ற நடத்தை என்ற கருத்தையும், τοῦ κυρίου உடனான தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: எல்லாவிதத்திலும் அவருக்குப் பிரியமாய் இருக்கவும்
  rationale: சொல்லுக்கு சொல் அமைப்பு தமிழில் இயல்பற்றதாக இருக்கும். சூழலில் ஆண்டவரே மறைமுக இலக்கு என்பதால், பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; கிரேக்கத்தில் அந்தச் சுட்டுப்பெயர் வெளிப்படையாக இல்லை என்பதை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ
  choice: ஒவ்வொரு நற்செயலிலும்
  rationale: παντί என்பதன் பகிர்ந்தளிக்கும் ‘ஒவ்வொரு’ வலிமையையும், ἀγαθῷ என்பதன் ஒழுக்க நன்மையையும் பாதுகாக்கிறது.
- source_word: καρποφοροῦντες
  choice: கனிகொடுத்து
  rationale: பவுலின் பொதுவான கனி உருவகத்தையும் 1:6 உடனான சொல்லியல் எதிரொலியையும் காக்கிறது.
- source_word: αὐξανόμενοι
  choice: வளரவும்
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான வளர்ச்சியையும், கனிகொடுத்தல் உருவகத்துடன் அதன் இணைப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: கடவுளைப் பற்றிய அறிவில்
  rationale: இறைவனை அறிதல் என்ற உறவுசார் கருத்தை தமிழில் தெளிவாக்குகிறது. தத்தம்/கருவி வேற்றுமைச் சாத்தியத்தை மறைக்காமல், முதன்மை உரையில் ‘அறிவில்’ என்ற sphere/respect வாசிப்பைத் தேர்ந்தெடுக்கிறது.
theological_decisions:
- issue: ἀρεσκείαν என்பதன் வெளிப்படையாகக் கூறப்படாத இலக்கு
  choice: முதன்மை உரையில் ‘அவருக்குப் பிரியமாய்’ என்று ஆண்டவரைத் தெளிவுபடுத்துதல்
  alternative: ‘எல்லாவிதப் பிரியத்திற்காக’ என்று இலக்கை மறைமுகமாகவே வைத்தல்
  rationale: கிரேக்கத்தில் சுட்டுப்பெயர் இல்லை என்றாலும் உடனடி சூழலில் ‘ஆண்டவர்’ தெளிவான இலக்காக இருக்கிறார். சொல்லுக்கு சொல் மறைமுக அமைப்பு தமிழில் பொருள் மங்கச் செய்வதால், இயல்பான உரையில் இலக்கு வெளிப்படுத்தப்பட்டு, மூலத்தின் மறைமுகத் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐπίγνωσις என்பதன் பொருள் நுணுக்கம்
  choice: ‘அறிவு’
  alternative: ‘முழுமையான அறிவு’ அல்லது ‘ஆழ்ந்த அறிவு’
  rationale: ἐπίγνωσις ஆழமான அல்லது நிறைவான அறிவைக் குறிக்கக்கூடும்; ஆனால் இங்கு அந்த நுணுக்கத்தை கட்டாயமான தொழில்நுட்ப வேறுபாடாக மாற்றாமல், முதன்மை உரையை இயல்பாக வைத்துக் கொண்டு மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- issue: τῇ ἐπιγνώσει என்ற தத்தம் வேற்றுமையின் செயல்பாடு
  choice: 'அறிவின் பரப்பு அல்லது துறையாக: ‘அறிவில் வளர’'
  alternative: 'கருவியாக: ‘கடவுளைப் பற்றிய அறிவினால் வளர’'
  rationale: வளர்தல் உருவகத்துடன் ‘அறிவில்’ என்ற வாசிப்பு உடனடி தொடரமைப்புக்கு நன்கு பொருந்துகிறது; இருப்பினும் கிரேக்கத் தத்தம் வேற்றுமை கருவிப் பொருளையும் அனுமதிப்பதால் அது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘நடந்து’ என்ற எபிரேய-கிரேக்க வாழ்க்கை உருவகம் தமிழில் தவறாக நேரடி நடையைச் சுட்டக்கூடும் என்பதால் ‘வாழ்ந்து’ எனப் பொருளாக்கப்பட்டது; ‘கனிகொடுத்து’ என்ற தெளிவான வேதாகம உருவகம் மட்டும் பாதுகாக்கப்பட்டது. முந்தைய வசனத்திலிருந்து தொடரும் நோக்கம்/விளைவு அமைப்பை உணர்த்த இறுதியில் ‘வேண்டும்’ சேர்க்கப்பட்டுள்ளது.
