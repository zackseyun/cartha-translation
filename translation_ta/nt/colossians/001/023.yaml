  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: ta
  text: நீங்கள் விசுவாசத்தில் தொடர்ந்து நிலைத்திருந்து, அடித்தளமிடப்பட்டவர்களாகவும் உறுதியானவர்களாகவும் இருந்து, நீங்கள் கேட்ட நற்செய்தியின் நம்பிக்கையிலிருந்து விலகாமல் இருந்தால் உண்மையாகவே—அந்த நற்செய்தி வானத்தின் கீழுள்ள படைப்பு அனைத்திலும்[a] அறிவிக்கப்பட்டது; அதற்குப் பவுலாகிய நான் பணியாளன்[b] ஆனேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானத்தின் கீழுள்ள ஒவ்வொரு உயிரினத்திற்கும்.” κτίσις என்பதற்கு “படைப்பு” என்றும், சில சூழல்களில் “உயிரினம்” என்றும் பொருள் வரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஊழியன்.” διάκονος என்பதற்கு சூழலுக்கேற்ப “பணியாளன்” அல்லது “ஊழியன்” என்று பொருள் வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: இருந்தால் உண்மையாகவே
  rationale: நிபந்தனைப் பொருளைத் தெளிவாக வைத்துக்கொண்டு, γε தரும் வலியுறுத்தலையும் வெளிப்படுத்துகிறது; முந்தைய வசனத்தின் வாக்கியத்துடன் இயல்பாக இணைக்க இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: ἐπιμένετε τῇ πίστει
  choice: விசுவாசத்தில் தொடர்ந்து நிலைத்திருந்து
  rationale: நிகழ்கால வினையின் தொடர்ச்சிப் பொருளையும், τῇ πίστει என்பதன் ‘விசுவாசத்தில்’ என்ற இயல்பான பொருளையும் காக்கிறது.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: அஸ்திவாரமிடப்பட்டவர்களாகவும் உறுதியானவர்களாகவும்
  rationale: முதல் சொல்லிலுள்ள நிறைவு பெற்ற செயப்பாட்டு நிலையையும் அஸ்திவார உருவகத்தையும், அடுத்த சொல்லிலுள்ள நிலைத்த உறுதியையும் காக்கிறது.
- source_word: μὴ μετακινούμενοι
  choice: விலக்கப்படாமல்
  rationale: ஒரு நிலையான இடத்திலிருந்து அகற்றப்படும் செயப்பாட்டு இடமாற்றப் படிமத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: நற்செய்தி தரும் நம்பிக்கையிலிருந்து
  rationale: மரபுத்தொடரின் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நம்பிக்கை நற்செய்தியுடன் தொடர்புடையது அல்லது அதனால் உண்டாவது என்ற பொருளைத் தருகிறது.
- source_word: τοῦ κηρυχθέντος
  choice: அறிவிக்கப்பட்டது
  rationale: பொதுவாகப் பிரகடனம் செய்யப்பட்டதைக் குறிக்கும்; தேவையற்ற திருச்சபைச் சொல் நடையைத் தவிர்க்கிறது.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: வானத்தின் கீழுள்ள படைப்பு அனைத்திலும்
  rationale: κτίσις என்பதன் முதன்மையான ‘படைப்பு’ பொருளையும் ἐν என்பதன் ‘-இல்’ பொருளையும் நெருக்கமாகக் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: பவுலாகிய நான் அதற்குப் பணியாளன் ஆனேன்
  rationale: ஒப்புமைப் பெயர் நற்செய்தியைக் குறிப்பதையும், ἐγενόμην என்பதன் ‘ஆனேன்’ பொருளையும், διάκονος என்பதன் நிறுவனப் பதவி சாராத சேவைப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: εἴ γε என்பதன் நிபந்தனையும் விசுவாசத்தில் நிலைத்திருத்தலும்
  choice: “இருந்தால் உண்மையாகவே” என்று உண்மையான நிபந்தனையாக மொழிபெயர்க்கப்பட்டது.
  alternative: “நீங்கள் தொடர்ந்து நிலைத்திருப்பதால்” அல்லது இரட்சிப்பை இழக்கலாம் என்ற ஒரு குறிப்பிட்ட கொள்கையைத் தெளிவாக உட்புகுத்தும் மொழிபெயர்ப்பு.
  rationale: கிரேக்கம் நிலைத்திருப்பதை நிபந்தனையாக முன்வைக்கிறது; ஆனால் பரந்த இறையியல் விவாதத்தை இந்த வசனம் தனியே தீர்மானிக்கவில்லை. ஆகவே உள்ள பதற்றம் அப்படியே காக்கப்படுகிறது.
- issue: τῇ πίστει என்பதன் பொருள்
  choice: விசுவாசத்தில்
  alternative: உண்மைத்தன்மையில்; நம்பிக்கையில்
  rationale: இச்சூழலில் πίστις என்பது விசுவாசிகள் நிலைத்திருக்கும் விசுவாசத்தைக் அல்லது கிறிஸ்தவ விசுவாசத்தின் தளத்தைக் குறிக்கிறது; ‘உண்மைத்தன்மை’ இங்கு குறைவாகப் பொருந்துகிறது.
- issue: படைப்பெங்கும் நற்செய்தி அறிவிக்கப்பட்டது என்ற பரந்த கூற்று
  choice: “வானத்தின் கீழுள்ள படைப்பு அனைத்திலும் அறிவிக்கப்பட்டது” என்ற உலகளாவிய சொல்லாக்கம் காக்கப்பட்டது.
  alternative: அறியப்பட்ட உலகின் பல இடங்களில் அறிவிக்கப்பட்டது என்று கூற்றை மென்மையாக்குதல்.
  rationale: மூலத்தின் பரந்த, சாத்தியமான வலியுறுத்தல் அல்லது மிகைப்படுத்தல் மொழியை விளக்கத்தின் மூலம் குறுக்காமல் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தைத் தொடர்வதால், நிபந்தனைப் பகுதியை முதலில் வைத்து “இது நிறைவேறும்” என மறைமுகமாக முந்தைய கருத்துடன் இணைக்கப்பட்டது. ‘அஸ்திவாரம்’ உருவகத்தைத் தெளிவாகக் காக்கிறது; ‘நற்செய்தி’, ‘விசுவாசம்’, ‘நம்பிக்கை’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
