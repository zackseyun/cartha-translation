  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν, τὴν ἄφεσιν τῶν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/014.yaml
  text: in whom we have redemption[a], the forgiveness of sins.
translation:
  language: ta
  text: அவருக்குள் நமக்கு மீட்பு உண்டு[a]—பாவங்களின் மன்னிப்பு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீட்பு’ என்பதையும் ‘மன்னிப்பு’ என்பதையும் ‘விடுதலை’ என்றும் மொழிபெயர்க்கலாம். இங்கே இந்த மீட்பு எதில் அடங்கியுள்ளது என்பதை ‘பாவங்களின் மன்னிப்பு’ என்ற சொற்றொடரால் பவுல் குறிப்பிட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அவருக்குள்
  rationale: ஆண்பால் ஒருமை சார்புப்பெயர் முந்தைய வசனத்தில் கூறப்பட்ட அன்புக்குரிய மகனைக் குறிக்கிறது. ‘அவருக்குள்’ என்பது அவரோடுள்ள உறவையும் ஒன்றிப்பையும் காட்டும் இடப்பொருளைத் தக்கவைக்கிறது.
- source_word: ἔχομεν
  choice: நமக்கு ... உண்டு
  rationale: நிகழ்கால வினையின் எளிய, இயல்பான தமிழாக்கம்; இப்போதே பெற்றிருக்கும் பயனை கூடுதல் விளக்கமின்றி வெளிப்படுத்துகிறது.
- source_word: ἀπολύτρωσιν
  choice: மீட்பு
  rationale: விடுதலை அல்லது விலைகொடுத்து விடுவித்தல் என்ற பவுலின் சொல்லாட்சிச் செறிவைத் தக்கவைக்கும், தமிழ்க் கிறிஸ்தவப் பயன்பாட்டிலும் பொதுவாகப் புரியக்கூடிய சொல்.
- source_word: ἄφεσιν
  choice: மன்னிப்பு
  rationale: பாவங்களைப் பற்றிய சூழலில் ἄφεσις என்பதன் இயல்பான பொருள் ‘மன்னிப்பு’. இங்கு அது ‘மீட்பு’ என்பதற்கு இணைநிலை விளக்கமாக வருகிறது.
- source_word: τῶν ἁμαρτιῶν
  choice: பாவங்களின்
  rationale: மன்னிக்கப்படுபவற்றைப் பன்மையில் துல்லியமாகக் குறிக்கும் இயல்பான தமிழ் உடைமை வேற்றுமை வடிவம்.
theological_decisions:
- issue: ‘மீட்பு’ என்பதற்கும் ‘பாவங்களின் மன்னிப்பு’ என்பதற்கும் உள்ள உறவு
  choice: 'இரண்டாவது பெயர்த்தொடரை இணைநிலையில் வைத்து: ‘மீட்பு—பாவங்களின் மன்னிப்பு’ என்று மொழிபெயர்த்தல்.'
  alternative: ‘மீட்பு, அதாவது பாவங்களின் மன்னிப்பு’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கத்தில் τὴν ἄφεσιν τῶν ἁμαρτιῶν என்பது τὴν ἀπολύτρωσιν என்பதுடன் இணைநிலையில் உள்ளது. ‘அதாவது’ போன்ற மூலத்தில் இல்லாத விளக்கச் சொல்லைச் சேர்க்காமல் அந்த அடையாள உறவை நீள்கோடு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சுருக்கமானதும் கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. ‘அவருக்குள்’ மூலத்தின் உறவு/ஒன்றிப்பு சார்ந்த திறந்த பொருளைத் தக்கவைக்கிறது; இணைநிலை அமைப்பு விளக்கமாகத் தீர்மானிக்கப்படவில்லை.
