  rationale: கிரேக்கச் சொற்றொடர் ஒன்றோடொன்று தொடர்புடைய ஒன்றுக்கு மேற்பட்ட பொருள்நிழல்களை அனுமதிப்பதால், பிரதான உரை அவற்றில் ஒன்றை மட்டும் இறுதியாகத் தேர்ந்தெடுக்கவில்லை.
