base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: ta
  text: அது உங்களிடம் வந்திருக்கிறது[a]. உலகம் முழுவதிலும்[b] அது கனிகொடுத்து வளர்ந்து வருவதுபோலவே, நீங்கள் கடவுளின் அருளைக் கேட்டு, அதை உண்மையில்[d] அறிந்துகொண்ட நாள் முதல் உங்களிடையிலும்[c] அது கனிகொடுத்து வளர்ந்து வருகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது உங்களோடு இருக்கிறது” அல்லது “அது உங்களிடையே வந்தடைந்திருக்கிறது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முழு உலகிலும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உங்களுக்குள்ளும்.” கிரேக்கச் சொற்றொடர் சபைச் சமூகத்தையோ அவர்களுக்குள் நற்செய்தி செயல்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “உண்மையாக” அல்லது “சத்தியத்தில்.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: அது உங்களிடம் வந்திருக்கிறது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நற்செய்தியையே “அது” குறிக்கிறது. πάρειμι என்பதில் வருகையும் இப்போது உடனிருப்பதும் நிழலாடுகின்றன; இயல்பான தமிழில் “வந்திருக்கிறது” இரண்டையும் ஓரளவு தக்கவைக்கிறது.
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: உலகம் முழுவதிலும்
  rationale: κόσμος இங்கு படைப்புலகைத் தொழில்நுட்பமாகக் குறிப்பதல்ல; நற்செய்தியின் விரிவான பரவலை வலியுறுத்தும் பொதுவான உலகளாவிய சொற்றொடர்.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: கனிகொடுத்து வளர்ந்து வருகிறது
  rationale: நிகழ்காலப் பங்கேற்பு வடிவங்கள் தொடர்ந்து நடைபெறும் செயலைக் காட்டுகின்றன. “கனிகொடுத்து” என்பது மூலத்தின் வேளாண்மை உருவகத்தைத் தக்கவைக்கிறது.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: அதுபோலவே … உங்களிடையிலும்
  rationale: ஒப்பீட்டுக் கட்டமைப்பும் καί தரும் “மேலும்/கூட” என்ற தொடர்பும் தமிழில் இயல்பாக வெளிப்படுகின்றன. “உங்களிடையில்” என்பது சபைச் சமூகத்துக்குள் நிகழும் நற்செய்தியின் செயல்பாட்டைத் தெரிவிக்கிறது.
- source_word: ἀφ’ ἧς ἡμέρας
  choice: நாள் முதல்
  rationale: அவர்களிடையே நற்செய்தியின் செயல் தொடங்கிய காலப்புள்ளியை நேரடியாகக் குறிக்கிறது.
- source_word: ἠκούσατε
  choice: கேட்டு
  rationale: கிரேக்க இறந்தகால வினை, அவர்கள் கேட்ட நிகழ்வை மட்டும் கூறுகிறது; மூலத்தில் இல்லாத “முதன்முதலில்” என்பது சேர்க்கப்படவில்லை.
- source_word: ἐπέγνωτε
  choice: அறிந்துகொண்ட
  rationale: ἐπιγινώσκω வெறும் தகவல் அறிவைக் காட்டிலும் உணர்ந்து அறிதல் அல்லது மெய்யறிதல் என்ற நிழற்பொருளைக் கொண்டிருக்கலாம். “அறிந்துகொண்ட” என்பது அதை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: கடவுளின் அருள்
  rationale: “அருள்” என்பது χάρις என்பதன் பொருளை இயல்பான, புரிந்துகொள்ளத்தக்க நவீன தமிழில் தருகிறது; இறையியல் முக்கியத்துவத்தையும் தக்கவைக்கிறது.
- source_word: ἐν ἀληθείᾳ
  choice: உண்மையில்
  rationale: இது “உண்மையாக” என்ற விதத்தையோ “உண்மைக்குள்/சத்தியத்தில்” என்ற தளத்தையோ குறிக்கலாம். “உண்மையில்” அந்த நுண்ணிய தெளிவின்மையை ஓரளவு திறந்தவாறே வைக்கிறது.
