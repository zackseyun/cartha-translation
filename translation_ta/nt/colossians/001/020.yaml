  terminology: ‘ஒப்புரவாக்கவும்,’ ‘சமாதானத்தை ஏற்படுத்தி,’ ‘சிலுவையின் இரத்தம்,’ ‘பூமி,’ ‘வானங்கள்’ ஆகியவை மூலத்தின் கருத்துச்சுமையையும் கண்ணியமான பொதுநடையையும் தக்கவைக்கின்றன. ‘வானங்களில்’ மூல கிரேக்கப் பன்மையை நேரடியாகக் காட்டுகிறது.
