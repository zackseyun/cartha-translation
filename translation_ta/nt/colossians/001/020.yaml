  rationale: பூமியிலும் வானங்களிலும் உள்ளவை என்ற தொடர்ச்சி அண்டம்சார் பரப்பைக் காட்டுகிறது. இந்த ஒப்புரவு தனிப்பட்ட உயிர்களின் இறுதி இரட்சிப்புடன் எவ்வாறு தொடர்புடையது என்பதை வசனம் தானே வரையறுக்காததால் அந்த இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
- issue: εἰς αὐτόν என்பதன் சுட்டுப்பொருள்
  choice: கடவுள் குமாரன் மூலமாக எல்லாவற்றையும் தம்மோடு ஒப்புரவாக்குகிறார் என அமைக்கப்பட்டது.
  alternative: மேசியா எல்லாவற்றையும் தம்மோடு ஒப்புரவாக்குகிறார்.
  rationale: 19ஆம் வசனத்திலிருந்து தொடரும் நோக்கக் கட்டமைப்பில் கடவுளே மறைமுக எழுவாயாக இருப்பது அதிகம் சாத்தியம்; இருப்பினும் குமாரனின் வழியான செயல்பாடு தெளிவாக வைக்கப்படுகிறது.
- issue: ‘அவருடைய சிலுவையின் இரத்தம்’ என்பதன் பொருள்
