source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: ta
  text: அவர் மூலமாக எல்லாவற்றையும் தம்மோடு ஒப்புரவாக்கவும், அவருடைய சிலுவையின் இரத்தத்தினால் சமாதானத்தை ஏற்படுத்தி, அவர் மூலமாகவே[a] பூமியில் உள்ளவையோ வானங்களில் உள்ளவையோ ஒப்புரவாக்கவும் கடவுள் விரும்பினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் இரண்டாவது ‘அவர் மூலமாகவே’ இல்லை.
    reason: textual_variant
  - marker: b
    text: ‘அவர் மூலமாக’ என்பதற்குப் பதிலாக, இரு இடங்களிலும் ‘அவரால்’ என்றும் மொழிபெயர்க்கலாம். ‘எல்லாவற்றையும்’ என்பது கிரேக்க மூலத்தையும், தொடர்ந்து வரும் ‘பூமியில் உள்ளவையோ வானங்களில் உள்ளவையோ’ என்ற பரந்த சொல்லாட்சியையும் பின்பற்றுகிறது. இந்த ஒப்புரவு இறுதி இரட்சிப்புடன் எவ்வாறு தொடர்புடையது என்பதை இந்த வசனம் தனியாக வரையறுக்கவில்லை.
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: அவர் மூலமாக
  rationale: διά + genitive கருவி அல்லது முகமையைச் சுட்டுகிறது. ‘அவர் மூலமாக’ என்பது குமாரனின் இடைநிலைச் செயல்பாட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀποκαταλλάξαι
  choice: ஒப்புரவாக்கவும்
  rationale: உறவை மீண்டும் சீராக்குதல் அல்லது ஒப்புரவு ஏற்படுத்துதல் என்பதே வினையின் மையப் பொருள். முன்னொட்டின் வலிமையை ‘முழுமையாக’ என்று விளக்கிச் சேர்க்காமல் விடுகிறது.
- source_word: τὰ πάντα
  choice: எல்லாவற்றையும்
  rationale: சுற்றியுள்ள படைப்புச் சூழலுக்கும் பூமி–வானங்கள் என்ற விரிவுக்கும் ஏற்ற பரந்த, நடுநிலையான மொழிபெயர்ப்பு.
- source_word: εἰς αὐτόν
  choice: தம்மோடு
  rationale: 19ஆம் வசனத்திலிருந்து தொடரும் இலக்கணத்தில் கடவுளே மறைமுக எழுவாய் எனப் புரிந்துகொள்ளப்படுகிறது. ‘தம்மோடு’ ஒப்புரவின் உறவுசார் இலக்கைத் தெளிவாக்குகிறது.
- source_word: εἰρηνοποιήσας
  choice: சமாதானத்தை ஏற்படுத்தி
  rationale: வினையெச்சம் ஒப்புரவுக்கான வழி அல்லது அடிப்படையைச் சுட்டுகிறது; தற்போதைய தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: அவருடைய சிலுவையின் இரத்தத்தின் மூலம்
  rationale: மூலத்தில் உள்ள ‘இரத்தம்’ மற்றும் ‘சிலுவை’ ஆகிய இரு உறுதியான படிமங்களையும் சுருக்கவோ கோட்பாட்டுச் சொற்களால் மாற்றவோ செய்யாமல் காக்கிறது.
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: அவர் மூலமாகவே
  rationale: மீண்டும் வரும் சொற்றொடரின் வலியுறுத்தலை ‘வே’ மற்றும் இடைக்கோடுகள் மூலம் காட்டுகிறது; உரைவேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἴτε ... εἴτε
  choice: …வையோ …வையோ
  rationale: இரு தளங்களையும் உள்ளடக்கும் கிரேக்க இணைப்பை இயல்பான தமிழ் இணை அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: பூமியில் உள்ளவை
  rationale: வானங்களோடு உள்ள அண்டம்சார் எதிரிணையைத் தெளிவாகக் காக்கிறது.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: வானங்களில் உள்ளவை
  rationale: οὐρανοῖς என்பதன் பன்மையை ‘வானங்களில்’ என்று நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
