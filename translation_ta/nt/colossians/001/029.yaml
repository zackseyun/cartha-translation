source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: ta
  text: இதற்காகவே நானும் உழைத்து, என்னில் வல்லமையோடு செயல்படுகிற அவரது செயலாற்றலுக்கு ஏற்பப் போராடுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதற்காகவே” என்பதை “இந்த நோக்கத்திற்காகவே” அல்லது “அதற்காகவே” என்றும் மொழிபெயர்க்கலாம். “போராடுகிறேன்” என்பதற்கு “கடுமையாக முயல்கிறேன்” என்றும் பொருள் கொள்ளலாம். “அவரது” என்பது கடவுளையா கிறிஸ்துவையா குறிக்கிறது என்பதை கிரேக்க வாசகம் இங்கே வெளிப்படையாகக் குறிப்பிடவில்லை. கடைசிப் பகுதியை “என்னில் வல்லமையாகச் செயல்படுகிற அவரது செயலாற்றலுக்கு ஏற்ப” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_and_referential_alternatives
lexical_decisions:
- source_word: εἰς ὃ
  choice: இதற்காகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட ஊழிய நோக்கைத் திரும்பச் சுட்டுகிறது; ‘இதற்காகவே’ என்பது நோக்கத்தையும் பின்னோக்கிய தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: நானும்
  rationale: பவுலின் உழைப்பை முந்தைய கருத்துடன் இணைக்கும் சேர்க்கைப் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: κοπιῶ
  choice: உழைத்து
  rationale: களைப்பை உண்டாக்கும் கடின உழைப்பைக் குறிக்கும் வினையின் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: ἀγωνιζόμενος
  choice: போராடுகிறேன்
  rationale: கடுமையான முயற்சி அல்லது போட்டிசார் போராட்டம் என்ற நுண்பொருளைக் கொண்டுள்ளது; ‘உழைத்து’ என்பதைக் காட்டிலும் தீவிரமான இணைச் செயலை வெளிப்படுத்துகிறது.
- source_word: κατὰ
  choice: ஏற்ப
  rationale: பவுலின் போராட்டத்தின் அளவு அல்லது நெறி அவரது செயலாற்றலோடு ஒத்திருக்கிறது என்பதைக் காட்டுகிறது; வெறும் கருவிப் பொருளாகச் சுருக்கவில்லை.
- source_word: ἐνέργειαν
  choice: செயலாற்றலுக்கு
  rationale: விளைவுண்டாக்கும் இயக்கமுள்ள வல்லமையைத் தெரிவிக்கிறது; தொடர்ந்து வரும் ஒரே வேர் கொண்ட வினையுடன் தமிழிலும் பொருள் தொடர்பை வைத்திருக்கிறது.
- source_word: αὐτοῦ
  choice: அவரது
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமைப் பிரதிப்பெயரைப் பாதுகாத்து, அது கடவுளையா கிறிஸ்துவையா குறிக்கிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
- source_word: τὴν ἐνεργουμένην
  choice: செயல்படுகிற
  rationale: தொடர்ந்து நிகழும் செயல்பாட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; நடுநிலை/செயப்பாட்டு வடிவத்தின் துல்லியமான குரல் இங்கு சூழலால் தீர்மானிக்க முடியாததால் இயல்பான செயல்வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: ἐν ἐμοὶ
  choice: என்னில்
  rationale: ἐν என்பதன் நேரடியான இடப்பொருளைப் பாதுகாத்து, ‘என் மூலமாக’ என்று கருவிப் பொருளைச் சேர்க்கவில்லை.
- source_word: ἐν δυνάμει
  choice: வல்லமையோடு
  rationale: செயல்பாட்டின் வல்லமையான முறையை இயல்பான தமிழில் தெரிவிக்கிறது; δύναμις என்பதன் பெயர்ச்சொல் சார்ந்த பொருளையும் காக்கிறது.
theological_decisions:
- issue: αὐτοῦ (‘அவரது’) என்பதன் சுட்டுப்பொருள்
  choice: கடவுள் அல்லது கிறிஸ்து என்று பெயரிட்டு விளக்காமல் ‘அவரது’ என்ற பிரதிப்பெயரைத் தக்கவைத்தல்
  alternative: ‘கடவுளுடைய செயலாற்றல்’ அல்லது ‘கிறிஸ்துவின் செயலாற்றல்’
  rationale: இவ்வசனம் சுட்டுப்பொருளை வெளிப்படையாகப் பெயரிடவில்லை. ஆகவே மூலத்தில் உள்ள இறையியல் திறந்தநிலையை மொழிபெயர்ப்பு தீர்க்காமல் பாதுகாக்கிறது.
- issue: ἐνεργουμένην என்பதன் குரல்
  choice: தமிழில் இயல்பான ‘செயல்படுகிற’ என்று மொழிபெயர்த்தல்
  alternative: ‘செயல்படுத்தப்படுகிற’
  rationale: கிரேக்க வடிவம் நடுநிலை அல்லது செயப்பாட்டுப் பொருளை ஏற்கக்கூடும்; இங்கு செயலாற்றலே வல்லமையோடு இயங்குகிறது என்பது தெளிவாக இருப்பதால், இறையியல் காரணகர்த்தாவைப் புதிதாகச் சேர்க்காத இயல்பான தமிழ் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘செயலாற்றல்/செயல்படுகிற’ என்ற சொல் தொடர்பு ἐνέργεια/ἐνεργουμένην என்ற ஒரே கிரேக்க வேரின் எதிரொலியை ஓரளவு பாதுகாக்கிறது. வசனத்தின் நீண்ட ஒருங்கிணைந்த வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்கும்படி மாற்றப்பட்டாலும், உழைப்பு மனிதருடையது; அதற்கான அளவும் இயங்கும் வல்லமையும் ‘அவருடையது’ என்ற பதற்றம் காக்கப்பட்டுள்ளது.
