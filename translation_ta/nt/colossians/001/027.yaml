id: COL.1.27
reference: Colossians 1:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: ta
  text: இந்த மறைபொருளின் மகிமை நிறைந்த செல்வம் பிற இனத்தாரிடையே எவ்வளவு பெரிது என்பதைத் தம் மக்களுக்குத் தெரியப்படுத்தக் கடவுள் தீர்மானித்தார். அந்த மறைபொருள், உங்களுக்குள் இருக்கும் மெசியாவே[a]; அவரே மகிமைக்கான நம்பிக்கை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களிடையே இருக்கும் மெசியா’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் மெசியா விசுவாசிகளுக்குள் இருப்பதையோ அவர்களது சமூகத்தின் நடுவே இருப்பதையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: தம் மக்களுக்குத்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பரிசுத்த மக்களைச் சுட்டும் பன்மை உறவுப்பெயர். தனி வசனமாக வாசிக்கும்போதும் குறிப்பு தெளிவாக இருக்க ‘தம் மக்களுக்குத்’ என வழங்கப்பட்டது.
- source_word: ἠθέλησεν
  choice: விரும்பினார்
  rationale: θέλω என்பது விருப்பம் அல்லது மனவுறுதியைக் குறிக்கலாம். இங்கு கடவுளின் நோக்கமுள்ள விருப்பத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: γνωρίσαι
  choice: தெரியப்படுத்த
  rationale: γνωρίζω என்பதன் நேரடியான பொருள் ‘அறியச் செய்தல்’; ‘தெரியப்படுத்த’ என்பது நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: மகிமை நிறைந்த செல்வம் … எவ்வளவு பெரிது
  rationale: கிரேக்கத்தின் செறிவான சொற்றொடர் அந்தச் செல்வத்தின் அளவு அல்லது மேன்மையை வலியுறுத்துகிறது. சொல்லுக்குச் சொல் அமைப்பின் இயல்பின்மையைத் தவிர்த்து, ‘மகிமை நிறைந்த’ என்பது δόξης-இன் பண்பை வெளிப்படுத்துகிறது.
- source_word: μυστηρίου
  choice: மறைபொருள்
  rationale: μυστήριον என்பது புரியாத புதிரை அல்ல, முன்பு மறைக்கப்பட்டு இப்போது வெளிப்படுத்தப்பட்ட இறைத் திட்டத்தைக் குறிக்கிறது; ‘மறைபொருள்’ அந்தப் பவுலிய நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: பிற இனத்தாரிடையே
  rationale: இச்சூழலில் ἔθνη யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ என்பது நவீன வாசகருக்குத் தெளிவாக அந்த வேறுபாட்டைத் தெரிவிக்கிறது.
- source_word: Χριστὸς
  choice: மெசியா
  rationale: இங்கு Χριστός மறைபொருளின் உள்ளடக்கத்தை அடையாளப்படுத்தும் பட்டமாக வலுவாகச் செயல்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐν ὑμῖν
  choice: உங்களுக்குள் இருக்கும்
  rationale: ἐν பன்மை ‘நீங்கள்’ என்பதுடன் உள்ளார்ந்த இருப்பையோ சமூகத்தின் மத்தியிலுள்ள இருப்பையோ குறிக்கலாம். முதன்மை உரை நேரடியான உள்ளார்ந்த பொருளைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: மகிமைக்கான நம்பிக்கை
  rationale: சுருக்கமான கிரேக்க உடைமைத் தொடர்பை இயல்பான தமிழில் தக்கவைத்து, மெசியாவே எதிர்கால மகிமையின் நம்பிக்கை என்பதைத் தெரிவிக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இவ்விளக்கக் கூற்றில் அது பெயர்போல அல்லாமல் பட்டமாகச் செயல்படுகிறது; ஆகவே ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: ἐν ὑμῖν என்பதன் பொருள்
  choice: உங்களுக்குள்
  alternative: உங்களிடையே
  rationale: கிரேக்கம் விசுவாசிகளுக்குள் உள்ளார்ந்திருப்பதையும் அவர்களது சமூகத்தின் நடுவே இருப்பதையும் அனுமதிக்கிறது. முதன்மை உரை நேரடியான வாசிப்பை ஏற்று, மற்ற வாசிப்பை அடிக்குறிப்பில் வழங்குவதால் இறையியல் பதற்றம் தீர்த்துவிடப்படவில்லை.
- issue: ἡ ἐλπὶς τῆς δόξης என்பதிலுள்ள உடைமைத் தொடர்பு
  choice: மகிமைக்கான நம்பிக்கை
  alternative: மகிமையின் நம்பிக்கை
  rationale: ‘மகிமைக்கான’ என்பது எதிர்நோக்கப்படும் மகிமையை இயல்பான தமிழில் காட்டுகிறது; அந்த மகிமையின் இயல்பு அல்லது காலத்தை மேலும் வரையறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பவுலின் செறிவான இறையியல் மொழி முற்றிலும் எளிமைப்படுத்தப்படாமல், தமிழில் இயல்பாக வாசிக்குமாறு வாக்கியம் அமைக்கப்பட்டது.
