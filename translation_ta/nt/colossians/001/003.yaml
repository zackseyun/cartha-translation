id: COL.1.3
reference: Colossians 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: ta
  text: உங்களுக்காக வேண்டிக்கொள்ளும்போது, நம் ஆண்டவராகிய இயேசு மேசியாவின் தந்தையான கடவுளுக்கு நாங்கள் எப்போதும் நன்றி செலுத்துகிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: நாங்கள் நன்றி செலுத்துகிறோம்
  rationale: நன்றியை வெளிப்படுத்துதல் என்ற வினையின் பொருளை, கடிதத் தொடக்கத்திற்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: τῷ θεῷ πατρὶ
  choice: தந்தையான கடவுளுக்கு
  rationale: θεῷ மற்றும் πατρὶ ஆகியவை ஒரே நபரைக் குறிக்கும் இணைப்புப் பயன்பாட்டில் உள்ளன; தமிழில் உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τοῦ κυρίου ἡμῶν
  choice: நம் ஆண்டவராகிய
  rationale: κύριος என்பதன் பட்டப்பெயர் சார்ந்த பொருளை ‘ஆண்டவர்’ என்று காத்து, தொடரை இயல்பான தமிழாக்கமாக அமைக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைத்திருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ச்சியான அல்லது ஒவ்வொரு சந்தர்ப்பத்திலும் நிகழும் நன்றிசெலுத்தலை நேரடியாகக் குறிக்கிறது.
- source_word: περὶ ὑμῶν
  choice: உங்களுக்காக
  rationale: வேண்டுதல் சார்ந்த சூழலில் περί + வேற்றுமை உருபு, வேண்டுதலின் பயனாளிகளைச் சுட்டுவதால் தமிழில் ‘உங்களுக்காக’ என்பது இயல்பானது.
- source_word: προσευχόμενοι
  choice: வேண்டிக்கொள்ளும்போது
  rationale: நன்றிசெலுத்துதலுடன் ஒரே காலத்தில் நிகழும் வேண்டுதலைக் குறிக்கும் நிகழ்காலப் பங்கேற்பு வினையின் சூழ்நிலைப் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστός-ஐ மொழிபெயர்த்தல்
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இந்த நன்றியறிதல் பகுதியில் Χριστός பட்டப்பெயராகப் புரிந்துகொள்ளத்தக்கதாக இருப்பதால் அதன் பொருளை ‘மெசியா’ என்று வெளிப்படுத்துகிறது; பரவலான மரபு வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πάντοτε எதனுடன் முதன்மையாக இணைகிறது
  choice: நாங்கள் எப்போதும் நன்றி செலுத்துகிறோம்
  alternative: நாங்கள் எப்போதும் உங்களுக்காக வேண்டிக்கொண்டு நன்றி செலுத்துகிறோம்
  rationale: சொல் வரிசையும் முதன்மை வினையும் πάντοτε-ஐ நன்றிசெலுத்துதலுடன் இணைக்க அனுமதிக்கின்றன; அதேவேளை வேண்டுதல் எப்போது நடைபெறுகிறதோ அந்தச் சூழ்நிலையைப் பங்கேற்பு வினை விளக்குகிறது. கிரேக்கத்தில் இணைப்பு ஓரளவு நெகிழ்வுடையது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்கு விளங்கும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டிக்கொள்ளும்போது’ என்பது προσευχόμενοι-ன் ஒரேகாலச் சூழ்நிலையை இயல்பாகத் தருகிறது; ‘நம் ஆண்டவராகிய’ என்பது தமிழில் பெயர்–பட்டப்பெயர் தொடரைச் சீராக இணைக்கிறது.
