  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: ta
  text: பிள்ளைகளே, எல்லாவற்றிலும் உங்கள் பெற்றோருக்குக் கீழ்ப்படியுங்கள்; ஏனெனில் இது ஆண்டவருக்குள்[a] பிரியமாயிருக்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆண்டவருக்குள்’ என்பது, இது ஆண்டவருடனான ஒருவரின் உறவில் பிரியமாயிருக்கிறது என்று புரிந்துகொள்ளப்படலாம்; வெறுமனே ‘ஆண்டவருக்குப் பிரியமாயிருக்கிறது’ என்று மட்டும் பொருள்படுத்த வேண்டியதில்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘ஏற்புடையதாக இருக்கிறது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: பிள்ளைகளே
  rationale: τέκνα என்பது பாலின வேறுபாடின்றி பிள்ளைகளைக் குறிக்கும் பன்மை அழைப்புமுறை; நவீன தமிழில் நேரடியும் இயல்புமான அழைப்பு.
- source_word: ὑπακούετε
  choice: கீழ்ப்படியுங்கள்
  rationale: ὑπακούω இங்கு பெற்றோரின் அதிகாரத்துக்குச் செவிசாய்த்து இணங்குவதைக் கட்டளையாகக் கூறுகிறது; ‘கேளுங்கள்’ என்பதைவிட ‘கீழ்ப்படியுங்கள்’ அதன் வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοῖς γονεῦσιν
  choice: உங்கள் பெற்றோருக்கு
  rationale: γονεῦσιν என்பது தந்தை, தாய் ஆகிய இருவரையும் உள்ளடக்கும் ‘பெற்றோர்’; நேரடி அழைப்பில் கிரேக்கத்தில் உடைமைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும் தமிழில் ‘உங்கள்’ இயல்பாகத் தேவைப்படுகிறது.
- source_word: κατὰ πάντα
  choice: எல்லாவற்றிலும்
  rationale: κατά + பன்மை குற்றுவேற்றுமை இங்கு காலத்தை அல்ல, கீழ்ப்படிதலின் முழு விரிவை—‘எல்லா காரியங்களிலும்’—குறிக்கிறது.
- source_word: τοῦτο γὰρ
  choice: ஏனெனில், இது
  rationale: τοῦτο முந்திய கீழ்ப்படிதல் கட்டளையைச் சுட்டுகிறது; γάρ அதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: εὐάρεστόν ἐστιν
  choice: பிரியமானது
  rationale: εὐάρεστος மகிழ்வளிப்பதையோ ஏற்புடையதையோ குறிக்கிறது. ‘பிரியமானது’ வழிபாட்டு மரபில் புரிந்துகொள்ளக்கூடியதாயும், மதிப்பீட்டுச் சாயலைத் தக்கவைத்ததாகவும் உள்ளது; ‘ஏற்புடையது’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: ἐν என்பதன் உறவு/சூழல் சார்ந்த தெளிவின்மையைத் தக்கவைத்து, வழக்கமான பவுலின் சொற்றொடரை குறுகிய ‘ஆண்டவருக்கு’ என்று மாற்றாமல் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: ‘எல்லாவற்றிலும்’ என்ற கட்டளைக்கும் ‘ஆண்டவருக்குள்’ என்ற சொற்றொடருக்கும் உள்ள தொடர்பு
  choice: இரு சொற்றொடர்களையும் வெளிப்படையான விதிவிலக்கு சேர்க்காமல் தக்கவைத்து, ‘ஆண்டவருக்குள்’ என்பதை ‘பிரியமானது’ என்பதோடு அமைத்தல்
  alternative: ‘ஆண்டவரின் சித்தத்துக்கு ஒத்த காரியங்களில் மட்டும்’ என்று கட்டளையை வரையறுத்தல்; அல்லது ‘இது ஆண்டவருக்குப் பிரியமானது’ என்று ἐν என்பதைக் குறுகிய பயனிலைத் தொடர்பாக விளக்குதல்
  rationale: கிரேக்க வசனம் ‘எல்லாவற்றிலும்’ என்பதற்குப் பின் விதிவிலக்கை வெளிப்படையாகச் சேர்ப்பதில்லை. ἐν κυρίῳ என்பது ஆண்டவருடனான உறவு அல்லது அவருக்குள் உள்ள வாழ்வுச் சூழலைக் குறிக்கலாம்; அதை மொழிபெயர்ப்பிலேயே ஒரே விளக்கமாக முடிவுசெய்யாமல் இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், குடும்பத்தினருக்கான நேரடி அறிவுறுத்தலின் எளிமையும் வேதவாக்கியத்துக்குரிய கண்ணியமும் பேணப்பட்டுள்ளன. ‘ஆண்டவருக்குள்’ சற்றுக் குறியிடப்பட்ட பவுலின் மொழிநடையாக இருந்தாலும், மூலத்தின் உண்மையான உறவுசார் தெளிவின்மையைப் பாதுகாக்கிறது.
