revisions:
- from: 'மேசியாவின் வார்த்தை உங்களுக்குள்[a] நிறைவாகக் குடியிருக்கட்டும். எல்லா ஞானத்தோடும் ஒருவருக்கொருவர் போதித்து அறிவுறுத்துங்கள்; சங்கீதங்களாலும் துதிப்பாடல்களாலும் ஆவிக்குரிய பாடல்களாலும், உங்கள் இதயங்களில் அருளோடு[b] கடவுளுக்குப் பாடுங்கள்.


    [a] “உங்களிடையே” என்றும் மொழிபெயர்க்கலாம். கிரேக்க மொழியில் “உங்கள்” என்பது பன்மையில் இருப்பதால், மேசியாவின் வார்த்தை விசுவாசிகள் ஒவ்வொருவருக்குள்ளும் குடியிருப்பதையோ, சமூகம் முழுவதிலும் குடியிருப்பதையோ குறிக்கலாம்.


    [b] “நன்றியுணர்வோடு” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொற்றொடர் அருள், அருள்நயம், அல்லது நன்றி என்ற பொருள்களைத் தரக்கூடும்.'
  to: மேசியாவின் வார்த்தை உங்களுக்குள்[a] எல்லா ஞானத்தோடும் நிறைவாகக் குடியிருக்கட்டும். சங்கீதங்கள், துதிப்பாடல்கள், ஆவிக்குரிய பாடல்கள் மூலம் ஒருவருக்கொருவர் போதித்தும் அறிவுறுத்தியும், உங்கள் இதயங்களில் அருளோடு[b] கடவுளுக்குப் பாடுங்கள்.
  rationale: The revision places “சங்கீதங்கள், துதிப்பாடல்கள், ஆவிக்குரிய பாடல்கள் மூலம்” directly with “போதித்தும் அறிவுறுத்தியும்,” preserving the Greek syntactic relationship. It keeps “எல்லா ஞானத்தோடும்” close to the indwelling clause without asserting more than the Greek’s somewhat flexible attachment permits. Footnote a is technically corrected while retaining its intended interpretive ambiguity.
