source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: ta
  text: மேசியாவின் வார்த்தை உங்களுக்குள்[a] எல்லா ஞானத்தோடும் நிறைவாகக் குடியிருக்கட்டும். சங்கீதங்கள், துதிப்பாடல்கள், ஆவிக்குரிய பாடல்கள் மூலம் ஒருவருக்கொருவர் போதித்தும் அறிவுறுத்தியும், உங்கள் இதயங்களில் அருளோடு[b] கடவுளுக்குப் பாடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்களிடையே” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் “உங்களுக்குள்” என்பது பன்மை வடிவில் இருப்பதால், மேசியாவின் வார்த்தை விசுவாசிகள் ஒவ்வொருவருக்குள்ளும் குடியிருப்பதையோ, சமூகத்தில் முழுமையாகக் குடியிருப்பதையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “நன்றியுணர்வோடு” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொற்றொடர் அருள், அருள்நயம், அல்லது நன்றி என்ற பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: மேசியாவின் வார்த்தை
  rationale: λόγος என்பதன் விரிந்த பொருளை “வார்த்தை” தக்கவைக்கிறது; Χριστός இங்கு பட்டமாகச் செயல்படுவதால் “மேசியா” என மொழிபெயர்க்கப்படுகிறது. உடைமை வேற்றுமை, மேசியாவிடமிருந்து வரும் வார்த்தை அல்லது அவரைப் பற்றிய வார்த்தை என்ற இரு சாத்தியங்களையும் திறந்துவைக்கிறது.
- source_word: ἐνοικείτω
  choice: குடியிருக்கட்டும்
  rationale: தொடர்ந்து உள்ளே வசிக்கும் உருவகத்தையும் நிகழ்காலக் கட்டளையின் தொடர்ச்சியான தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களுக்குள்
  rationale: கிரேக்கச் சொற்றொடரை நேரடியாகப் பிரதிபலிக்கிறது. பன்மை வடிவத்திலுள்ள தனிநபர் மற்றும் சமூகப் பொருள் சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: πλουσίως
  choice: நிறைவாக
  rationale: வார்த்தை மிகுதியாகவும் முழுமையாகவும் குடியிருப்பதை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: எல்லா ஞானத்தோடும்
  rationale: ஞானம் வார்த்தையின் குடியிருப்போடும் அல்லது தொடர்ந்து வரும் பரஸ்பரப் போதனை மற்றும் அறிவுறுத்தலோடும் தொடர்புபடக்கூடிய கிரேக்கத் தொடரமைப்பை அதிகமாகக் குறுக்காமல் வழங்குகிறது.
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: ஒருவருக்கொருவர் போதித்து அறிவுறுத்துங்கள்
  rationale: பன்மைத் தற்சுட்டுப் பெயரின் பரஸ்பரச் செயல்பாட்டை இயல்பாகக் காட்டி, νουθετέω என்பதிலுள்ள திருத்தும் அறிவுரையின் நுணுக்கத்தையும் காக்கிறது.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: சங்கீதங்களாலும் துதிப்பாடல்களாலும் ஆவிக்குரிய பாடல்களாலும்
  rationale: மூன்று பாடல் வகைகளையும் தனித்தனியாகக் காத்து, πνευματικαῖς என்பதை அருகிலுள்ள “பாடல்கள்” என்பதோடு இணைக்கிறது.
- source_word: ἐν χάριτι
  choice: அருளோடு
  rationale: χάρις என்பதன் அடிப்படை வடிவத்தையும் அருள் சார்ந்த பொருளையும் காக்கிறது; சூழலில் சாத்தியமான “நன்றியுணர்வோடு” என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ᾄδοντες ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: உங்கள் இதயங்களில் ... கடவுளுக்குப் பாடுங்கள்
  rationale: உள்ளார்ந்த பாடுதலையும் பாடலின் பெறுநராகக் கடவுளையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு Χριστός பட்டமாக இருப்பதால் அதன் மேசியத் தன்மையை வெளிப்படையாகக் காக்கிறது; அதை வெறும் பெயராக மாற்றவில்லை.
- issue: ἐν ὑμῖν என்பதிலுள்ள தனிநபர் மற்றும் சமூகப் பொருள்
  choice: உங்களுக்குள்
  alternative: உங்களிடையே
  rationale: மூலத்தின் “உள்ளே” என்ற வடிவத்தை முதன்மை உரையில் காத்து, பன்மை காரணமாக உள்ள சமூகப் பொருளையும் அடிக்குறிப்பில் பதிவு செய்கிறது.
- issue: ἐν χάριτι என்பதன் பொருள்
  choice: அருளோடு
  alternative: நன்றியுணர்வோடு
  rationale: அருள் மற்றும் நன்றி ஆகிய இரு உண்மையான பொருள் சாத்தியங்களையும் ஒன்றை மறைத்து மற்றொன்றை மட்டும் உறுதிப்படுத்தாமல் முதன்மை உரை மற்றும் அடிக்குறிப்பு வழியாகக் காக்கிறது.
- issue: ἐν πάσῃ σοφίᾳ என்பதன் தொடரமைப்புத் தொடர்பு
  choice: எல்லா ஞானத்தோடும் என்ற சொற்றொடரை இரு வாக்கியங்களின் எல்லையில் வைத்தல்
  alternative: போதித்து அறிவுறுத்தும் செயலோடு மட்டும் வெளிப்படையாக இணைத்தல்
  rationale: இச்சொற்றொடர் முன் வரும் குடியிருத்தலையோ பின் வரும் போதனை-அறிவுறுத்தலையோ சாரலாம்; மொழிபெயர்ப்பு அந்தத் தொடர்பை தேவையின்றித் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “குடியிருக்கட்டும்,” “ஒருவருக்கொருவர்,” “இதயங்களில்” போன்ற சொற்கள் மூல உருவகத்தையும் சமூகச் சூழலையும் காக்கின்றன; மிகப் பழமையான அல்லது குறிப்பிட்ட சபைமரபுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
