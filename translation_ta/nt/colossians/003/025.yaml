  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: ta
  text: ஏனெனில், அநியாயம் செய்கிறவன் தான் செய்த அநியாயத்திற்கேற்பப் பெறுவான்[a]; பாரபட்சம் காட்டப்படுவதில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் செய்த அநியாயத்திற்குரியதைப் பெறுவான்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆள்பார்த்து நடத்துவது இல்லை.’ மூலச்சொல், ஒருவரின் முகத்தையோ வெளிப்புற அந்தஸ்தையோ பார்த்துப் பாரபட்சம் காட்டுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: ஏனெனில், அநியாயம் செய்கிறவன்
  rationale: γάρ முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்துவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது. பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை, அநியாயம் செய்யும் எவரையும் பொதுவாகக் குறிக்கிறது; ஒருமை வடிவமும் தொடர்ச்சியான பண்பும் காக்கப்பட்டுள்ளன.
- source_word: κομίσεται
  choice: திரும்பப் பெறுவான்
  rationale: இச்சூழலில் கொμίζω ஒருவர் செய்த செயலுக்கேற்றதைத் திரும்பப் பெறுவதைக் குறிக்கிறது. ‘திரும்பப் பெறுவான்’ என்பது தெய்வீகச் செய்பவரை உரையில் இல்லாதபடி வெளிப்படையாகச் சேர்க்காமல், கைம்மாறு கிடைக்கும் பொருளைக் காக்கிறது.
- source_word: ὃ ἠδίκησεν
  choice: தான் செய்த அநியாயத்தையே
  rationale: சார்புப்பெயரும் இறந்தகால வினையும் செய்யப்பட்ட அநியாயத்தை நேரடியாகச் சுட்டுகின்றன. ‘அநியாயத்தையே’ என்பது மூலத்தின் சொல் மீளுருவாக்கத்தையும், செய்ததே திரும்பக் கிடைக்கும் என்ற வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: பாரபட்சம் இல்லை
  rationale: προσωπολημψία என்பது ஒருவரின் வெளிப்புற நிலை அல்லது அந்தஸ்தைக் கருத்தில் கொண்டு பக்கச்சார்பாக நடத்துவதைக் குறிக்கிறது. ‘பாரபட்சம்’ நவீனத் தமிழில் தெளிவானதும் கண்ணியமானதும் ஆகும்.
theological_decisions:
- issue: தீர்ப்பின் கைம்மாறும் பாரபட்சமின்மையும்
  choice: அநியாயம் செய்கிறவன் செய்த அநியாயத்தையே திரும்பப் பெறுவான் என்ற பொதுவான எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது; அதன் காலமோ செயல்முறையோ குறிப்பிடப்படவில்லை.
  alternative: இதை இறுதிக்காலத் தீர்ப்புக்கு மட்டும் உரியதாகவோ, அடிமை–எஜமான் உறவுகளுக்கு மட்டும் வரையறுக்கப்பட்டதாகவோ மொழிபெயர்த்தல்.
  rationale: கிரேக்க வாக்கியம் கைம்மாறும் பாரபட்சமின்மையும் பற்றிய பரந்த கொள்கையைச் சொல்கிறது. சூழல் சமூக உறவுகளைத் தொட்டாலும், உரை தானாகக் கூறாத காலத்தையோ வரம்பையோ மொழிபெயர்ப்பு சேர்க்கவில்லை.
