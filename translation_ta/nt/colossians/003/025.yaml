  register: நவீன, பொதுநிலைத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எச்சரிக்கையின் கண்ணியமான தொனியும் கிரேக்கத்தின் பொதுவான ஒருமை அமைப்பும் காக்கப்பட்டுள்ளன; செயலை நிறைவேற்றுபவர் யார் என்பதை உரை வெளிப்படையாகக் கூறாததால் மொழிபெயர்ப்பிலும் சேர்க்கப்படவில்லை.
