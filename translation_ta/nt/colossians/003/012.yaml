  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: ta
  text: ஆகவே, கடவுளால் தேர்ந்தெடுக்கப்பட்டவர்களும்[a], பரிசுத்தரும், அன்புக்குரியவர்களுமாகிய நீங்கள், ஆழ்ந்த இரக்கத்தையும்[b], தயவையும், தாழ்மையையும், மென்மையையும்[c], பொறுமையையும் அணிந்துகொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளால் தெரிந்துகொள்ளப்பட்டவர்கள்.” இங்கு தேர்ந்தெடுப்பது கடவுள் என்பதை கிரேக்கத் தொடர் குறிப்பிடுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “இரக்கத்தின் உள்ளுறுப்புகள்”; இது உள்ளத்தின் ஆழத்திலிருந்து எழும் இரக்கத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடர்.
    reason: source_idiom
  - marker: c
    text: அல்லது, “சாந்தம்.” இச்சொல் பலவீனத்தை அல்ல, அடக்கத்துடன் கூடிய மென்மையைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: அணிந்துகொள்ளுங்கள்
