- source_word: ὡς ἐκλεκτοὶ τοῦ θεοῦ
  choice: கடவுளால் தேர்ந்தெடுக்கப்பட்டவர்களுமாகிய
  rationale: வாசகர்கள் தங்கள் அடையாளத்திற்கேற்ப வாழ வேண்டும் என்ற ὡς என்பதன் வலிமையையும், தேர்ந்தெடுப்பதில் கடவுளின் முன்முயற்சியையும் காக்கிறது.
- source_word: ἅγιοι καὶ ἠγαπημένοι
  choice: பரிசுத்தரும், அன்புக்குரியவர்களும்
  rationale: இரண்டு அடையாளப் பண்புகளையும் பெயரடைத் தன்மையுடன் தக்கவைக்கிறது; ἠγαπημένοι குறிக்கும் நிலையான அன்புறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: ஆழ்ந்த இரக்கம்
  rationale: சொல்லுக்கு சொல் ‘இரக்கத்தின் உள்ளுறுப்புகள்’ என்று மொழிபெயர்ப்பது தமிழில் இயல்பற்றது; உள்ளத்தின் ஆழத்திலிருந்து எழும் இரக்கம் என்ற கிரேக்க மரபுத்தொடரின் பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: χρηστότητα
  choice: தயவு
  rationale: பிறரிடம் நன்மையாகவும் கனிவாகவும் நடந்துகொள்ளும் நற்பண்பைக் குறிக்கும் சுருக்கமான, வழக்கமான தமிழ்ச்சொல்.
- source_word: ταπεινοφροσύνην
  choice: தாழ்மை
  rationale: தன்னைத் தாழ்வாக எண்ணும் மனப்பாங்கைக் குறிக்கும் நவீனத் தமிழின் இயல்பான நற்பண்புச் சொல்.
- source_word: πραΰτητα
  choice: சாந்தம்
  rationale: பலவீனத்தைக் குறிக்காமல், அடக்கத்துடன் கூடிய மென்மையான நடத்தை எனும் பொருளை வெளிப்படுத்துகிறது.
- source_word: μακροθυμίαν
  choice: பொறுமை
  rationale: குறிப்பாக பிறரிடம் நீண்டகாலம் பொறுத்திருக்கும் மனப்பாங்கை, பட்டியலுக்கு ஏற்ற எளிய தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐκλεκτοὶ τοῦ θεοῦ என்பதிலுள்ள தேர்ந்தெடுத்தல் மொழியை ஒரு குறிப்பிட்ட கோட்பாட்டு அமைப்பாக விரிவுபடுத்தாமல் மொழிபெயர்த்தல்
  choice: கடவுளால் தேர்ந்தெடுக்கப்பட்டவர்கள்
  alternative: கடவுளின் தெரிந்துகொள்ளப்பட்டவர்கள்
  rationale: வசனம் கடவுளின் தேர்வையும் விசுவாசிகளின் அடையாளத்தையும் உறுதிப்படுத்துகிறது; ஆனால் அந்தத் தேர்வின் முறை அல்லது வரிசையை விளக்கவில்லை. எனவே பொருளை மட்டும் நேரடியாகத் தக்கவைக்கிறது.
- issue: πραΰτης என்பதன் ஒழுக்கப் பொருளை நவீனத் தமிழில் வழங்குதல்
  choice: சாந்தம்
  alternative: மென்மை
  rationale: ‘சாந்தம்’ அடக்கத்துடனும் கட்டுப்பாட்டுடனும் நடக்கும் நற்பண்பைச் சுட்டுகிறது; வெறும் மென்மை அல்லது பலவீனம் என்ற எண்ணத்திற்குள் பொருளைக் குறுக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. நற்பண்புப் பட்டியலின் இணை அமைப்பும் ‘அணிந்துகொள்ளுங்கள்’ என்ற உடை உருவகமும் பாதுகாக்கப்பட்டுள்ளன; கிரேக்க மரபுத்தொடரின் உடல் சார்ந்த சொல்லாட்சி முதன்மை உரையில் இயல்பான தமிழாக்கமாகவும் அடிக்குறிப்பில் நேரடியான விளக்கமாகவும் வழங்கப்பட்டுள்ளது.
