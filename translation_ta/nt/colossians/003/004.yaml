source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: ta
  text: உங்கள் வாழ்வாகிய மெசியா[a] வெளிப்படும்போது, அப்போது நீங்களும் அவரோடு மகிமையில் வெளிப்படுவீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கப் பட்டப்பெயரான Χριστός என்பதை இருவிதமாகவும் வழங்கலாம்; “மெசியா” அதன் பட்டப்பெயர் சார்ந்த பொருளை வெளிப்படுத்துகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவரோடு மகிமையில் தோன்றுவீர்கள்.” இவ்வசனத்தின் முன்பகுதியிலும் இதே கிரேக்க வினைவேர் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: வெளிப்படும்போது
  rationale: எதிர்காலத்தில் நிகழும் என எதிர்பார்க்கப்படும் நிகழ்வை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான காலத் தொடர்பை ‘-ம்போது’ தெளிவாகக் காட்டுகிறது.
- source_word: ὁ Χριστός
  choice: மெசியா
  rationale: Χριστός இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயராக வருகிறது; ஒலிபெயர்ப்பான ‘கிறிஸ்து’ என்பதற்குப் பதிலாக அதன் பட்டப்பெயர் சார்ந்த பொருளை ‘மெசியா’ காக்கிறது.
- source_word: ἡ ζωὴ ὑμῶν
  choice: உங்கள் வாழ்வாகிய
  rationale: ‘உங்கள் வாழ்வு’ என்ற கிரேக்க இணைப்புரையை இயல்பான தமிழில் மெசியாவை அடையாளப்படுத்தும் பெயரடைத்தொடராக வழங்குகிறது; ‘உயிர்’ என்பதைக் காட்டிலும் இச்சூழலில் ‘வாழ்வு’ பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: φανερωθῇ / φανερωθήσεσθε
  choice: வெளிப்படும்போது / வெளிப்படுவீர்கள்
  rationale: ஒரே வேர்ச்சொல்லிலிருந்து வந்த இரு கிரேக்க வினைகளின் இணைநிலையை ஒரே தமிழ் வினையால் காக்கிறது. கிரேக்கச் செயப்பாட்டு வடிவம் இங்கு வெளிப்படையாகத் தெரியவருதலைக் குறிக்கிறது; தமிழில் ‘வெளிப்படு’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τότε καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: ‘-உம்’ என்பது καί தரும் உட்படுத்தலையும் வலியுறுத்தலையும் காட்டுகிறது; ‘வெளிப்படும்போது’ ஏற்கெனவே காலத் தொடர்பைக் காட்டுவதால் τότε-ஐ தனியே ‘அப்போது’ என்று மீண்டும் கூறுவது தமிழில் தேவையற்ற கனத்தை உண்டாக்கும்.
- source_word: σὺν αὐτῷ
  choice: அவரோடு
  rationale: மெசியாவுடன் உள்ள நெருங்கிய பங்கேற்பை இயல்பான, மரியாதையான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν δόξῃ
  choice: மகிமையில்
  rationale: மகிமை என்பது வெளிப்பாட்டின் சூழல் அல்லது நிலை என்ற கிரேக்கச் சொற்றொடரின் திறந்த பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστός என்பதைப் பட்டப்பெயராகவா, பெயர்போன்ற வடிவமாகவா வழங்குவது
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: உறுப்புடன் வரும் ὁ Χριστός இங்கு பட்டப்பெயர் வலிமையைக் கொண்டுள்ளது. ‘மெசியா’ அந்தப் பட்டத்தின் பொருளைத் தெரிவிக்கிறது; பரிச்சயமான மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: மெசியாவுக்கும் விசுவாசிகளின் வாழ்வுக்கும் உள்ள இணைப்புரை
  choice: உங்கள் வாழ்வாகிய மெசியா
  alternative: மெசியா, உங்கள் வாழ்வு
  rationale: கிரேக்கத்தில் உள்ள வலுவான அடையாளப்படுத்தலை விளக்கமாகத் தளர்த்தாமல், இயல்பான தமிழ் இலக்கணத்தில் காக்கிறது.
- issue: இரு φανερόω வடிவங்களுக்கிடையிலான இணைநிலை
  choice: இரண்டையும் ‘வெளிப்படு’ என்ற ஒரே வேரால் மொழிபெயர்த்தல்
  alternative: முதல் இடத்தில் ‘வெளிப்படுதல்’, இரண்டாவது இடத்தில் ‘தோன்றுதல்’
  rationale: மெசியாவின் வெளிப்பாட்டுக்கும் அவரோடு விசுவாசிகள் வெளிப்படுவதற்கும் உரை அமைக்கும் இறையியல் தொடர்பை ஒரே வினைவேர் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வாழ்வு’, ‘மகிமை’, ‘வெளிப்படு’ ஆகிய சொற்கள் பரந்த இறையியல் பொருளைச் சுருக்காமல் சாதாரண வாசகருக்கும் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளன.
