id: COL.3.15
reference: Colossians 3:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: ta
  text: மேசியாவின்[a] சமாதானம் உங்கள் இதயங்களில் ஆளட்டும்[b]. அந்தச் சமாதானத்திற்கே நீங்கள் ஒரே உடலில்[c] அழைக்கப்பட்டீர்கள். நன்றியுள்ளவர்களாக இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின்.” கிரேக்கச் சொல்லான Χριστός என்பதற்கு “அபிஷேகம் செய்யப்பட்டவர்” என்ற பட்டப்பொருள் உண்டு.
    reason: lexical_alternative
  - marker: b
    text: “நடுவராகத் தீர்மானிக்கட்டும்” என்றும் மொழிபெயர்க்கலாம். இச்சொல் போட்டியில் தீர்ப்பாளராக அல்லது நடுவராகச் செயல்படுவதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “ஒரே உடலாக” என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: பவுலின் பயன்பாட்டில் தேவனுடைய மீட்புச் செயலால் உண்டாகும் உறவு மற்றும் சமூக நல்லிணக்கத்தைச் சுட்டும் வழக்கமான, இயல்பான தமிழ் சொல்.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளைக் கொண்டதால், அதை வெறும் பெயராக ஒலிபெயர்க்காமல் ‘மேசியா’ என்று வழங்குகிறது.
- source_word: βραβευέτω
  choice: ஆளுகை செய்யட்டும்
  rationale: தீர்ப்பாளராக அல்லது நடுவராக முடிவுசெய்தல் என்ற உருவகப் பின்னணியுடன், சமாதானம் தீர்மானிக்கும் ஆளும் சக்தியாக இருக்கவேண்டும் என்ற கட்டளைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: உங்கள் இதயங்களில்
  rationale: உள்ளார்ந்த சிந்தனை, விருப்பம், மனப்பாங்கு ஆகியவற்றைக் குறிக்கும் வேதாகம உருவகத்தையும் கிரேக்கப் பன்மையையும் காக்கிறது.
- source_word: εἰς ἣν
  choice: அந்தச் சமாதானத்திற்கே
  rationale: உறவுப்பெயர் ‘சமாதானம்’ என்பதையே முன்சுட்டாகக் கொண்டிருப்பதைத் தெளிவாக்கி, καί தரும் வலியுறுத்தலையும் ‘-ஏ’ மூலம் வெளிப்படுத்துகிறது.
- source_word: ἐκλήθητε
  choice: அழைக்கப்பட்டீர்கள்
  rationale: தெய்வீக அழைப்பைக் குறிக்கும் இறந்தகால செயப்பாட்டு வடிவத்தை நேரடியாகக் காக்கிறது.
- source_word: ἐν ἑνὶ σώματι
  choice: ஒரே உடலில்
  rationale: ἐν + வேற்றுமை உருபின் இடம் அல்லது சமூகச் சூழல் சார்ந்த பொருளையும் பவுலின் உடல் உருவகத்தையும் விளக்கிச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: εὐχάριστοι γίνεσθε
  choice: நன்றியுள்ளவர்களாக இருங்கள்
  rationale: நன்றியுணர்வுடையவர்களாக தொடர்ந்து இருக்கும்படி கூறும் கட்டளையை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இச்சொல் அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளுடன் வருவதால் ‘மேசியா’ என்பதை முதன்மைப் பாடமாகக் கொண்டு, தமிழ் கிறிஸ்தவ வழக்கிலுள்ள ‘கிறிஸ்து’ என்பதை அடிக்குறிப்பில் மாற்றாக வைத்துள்ளது.
- issue: ‘ஒரே உடலில்’ என்பதன் பொருள்
  choice: திருச்சபை சார்ந்த கூட்டு ஒருமைப்பாட்டை உள்ளடக்கினாலும், ‘உடல்’ என்ற உருவகம் விரிவாக்கப்படவில்லை
  alternative: ‘ஒரே உடலாக’ அல்லது ‘ஒரே திருச்சபையில்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: இந்த உருவகம் சபையைக் குறிக்கக்கூடும்; ஆனால் மூலவசனம் அதை நேரடியாக விளக்காததால் அதன் இறையியல் செறிவும் திறந்த தன்மையும் காக்கப்படுகின்றன.
- issue: βραβευέτω என்பதன் உருவகம்
  choice: ஆளுகை செய்யட்டும்
  alternative: நடுவராகத் தீர்மானிக்கட்டும்
  rationale: சமாதானம் சமூகத்தின் உள்ளார்ந்த வாழ்வில் தீர்மானிக்கும் அதிகாரமாக இருக்க வேண்டும் என்ற கருத்தை முதன்மைப் பாடம் இயல்பாகக் கூறுகிறது; நடுவர் அல்லது தீர்ப்பாளர் உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘இதயங்கள்,’ ‘உடல்’ ஆகிய மூல உருவகங்கள் காக்கப்பட்டுள்ளன; ‘ஆளுகை செய்யட்டும்’ என்பது கட்டளையின் வலிமையையும் இயல்பான தமிழையும் சமநிலைப்படுத்துகிறது.
