revisions:
- from: 'ஆகவே, பூமிக்குரிய உங்கள் உறுப்புகளைச் சாகடித்துவிடுங்கள்[a]: பாலியல் ஒழுக்கக்கேடு, அசுத்தம், கட்டுப்பாடற்ற வேட்கை, தீய ஆசை, பேராசை[b] ஆகியவற்றை ஒழித்துவிடுங்கள். இந்தப் பேராசையே சிலைவழிபாடு.'
