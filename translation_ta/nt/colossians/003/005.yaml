  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: ta
  text: 'ஆகவே, பூமியின்மேல் உள்ள உறுப்புகளைச் சாகடித்துவிடுங்கள்[a]: பாலியல் ஒழுக்கக்கேடு, அசுத்தம், வேட்கை, தீய ஆசை, பேராசை[b]—இந்தப் பேராசையே சிலைவழிபாடு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “பூமியின்மேல் உள்ள உறுப்புகளை.” அல்லது, “உங்களிலுள்ள பூமிக்குரியவற்றை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பிறருடையதை விரும்புதல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: சாகடித்துவிடுங்கள்
  rationale: தீர்மானமான செயலைக் கோரும் இறந்தகால ஏவல் வடிவத்தின் வலிமையைத் தக்கவைக்கிறது; நவீனத் தமிழிலும் தெளிவாக உள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவுறுத்தலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: μέλη τὰ ἐπὶ τῆς γῆς
  choice: பூமிக்குரிய உங்கள் உறுப்புகள்
  rationale: ‘உறுப்புகள்’ என்ற உடல் சார்ந்த உருவகத்தைத் தக்கவைத்து, ἐπὶ τῆς γῆς என்பதன் பூமிக்குரிய தன்மையையும் தெரிவிக்கிறது. கிரேக்கத்தில் உடைமைப் பெயர் வெளிப்படையாக இல்லாவிட்டாலும், தமிழ் வாக்கியத்தில் குறிக்கப்படும் நபர்களோடு உறுப்புகளின் தொடர்பை இயல்பாகத் தெளிவுபடுத்த ‘உங்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: πορνείαν
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: πορνεία குறிக்கும் பரந்த பாலியல் தவறுகளை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἀκαθαρσίαν
  choice: அசுத்தம்
  rationale: பவுலின் ஒழுக்கவியல் பயன்பாட்டின் பரப்பைத் தக்கவைக்கும் சுருக்கமான சொல்.
- source_word: πάθος
  choice: கட்டுப்பாடற்ற வேட்கை
  rationale: இங்கு எதிர்மறையான, ஒழுங்கிழந்த தீவிர உணர்வைக் குறிக்கும் சூழலைத் தெளிவுபடுத்துகிறது; வெறும் ‘உணர்ச்சி’ என்ற நடுநிலைப் பொருளைத் தவிர்க்கிறது.
- source_word: ἐπιθυμίαν κακήν
  choice: தீய ஆசை
  rationale: κακήν என்பதன் ஒழுக்கரீதியான எதிர்மறைத் தகுதியை நேரடியாகத் தக்கவைக்கிறது.
- source_word: πλεονεξίαν
  choice: பேராசை
  rationale: மேலும் மேலும் பெறுவதற்கான அளவற்ற பற்றை சாதாரண நவீனத் தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: இந்தப் பேராசையே சிலைவழிபாடு
  rationale: பெண்பால் ஒருமை உறவுப்பெயரின் மிக இயல்பான முன்னிலையான πλεονεξίαν-ஐத் தெளிவாகச் சுட்டி, பவுலின் வலுவான அடையாளப்படுத்தலை மெலிதாக்காமல் வழங்குகிறது.
theological_decisions:
- issue: ‘சிலைவழிபாடு’ என்று கூறப்படுவதன் முன்னிலை
  choice: இது குறிப்பாக ‘பேராசை’யைக் குறிக்கிறது.
  alternative: முன்னுள்ள தீய செயல்களின் முழுப் பட்டியலையும் குறிக்கிறது.
  rationale: ἥτις என்ற பெண்பால் ஒருமை உறவுப்பெயர், அதற்கு உடனடியாக முந்திய பெண்பால் ஒருமைச் சொல்லான πλεονεξίαν உடன் மிக இயல்பாக இயைகிறது.
- issue: ‘பூமிக்குரிய உறுப்புகள்’ என்பதன் விளக்கம்
  choice: உடல்-உறுப்பு உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்.
  alternative: ‘உங்களிலுள்ள உலகப்பற்றானவை’ அல்லது ‘உங்கள் பூமிக்குரிய இயல்பு’ என்று முழுமையாக விளக்குதல்.
  rationale: மூலத்தில் μέλη, ‘உறுப்புகள்,’ என்ற சொல் வெளிப்படையாக உள்ளது; அதைச் சுருக்கமான கோட்பாட்டுச் சொல்லாக மாற்றாமல் உருவகத்தையும் அதன் பதற்றத்தையும் தக்கவைக்க வேண்டும்.
- issue: தீய செயல்களின் பட்டியலும் ‘உறுப்புகள்’ என்பதும் கொண்ட இலக்கணத் தொடர்பு
  choice: பட்டியலை ‘அவற்றை ஒழித்துவிடுங்கள்’ என்ற மீளுரைப்பால் உறுப்புகளின் விளக்கமாகத் தெளிவாக்குதல்.
  alternative: பட்டியலை நேரடியாக இருபுள்ளிக்குப் பின் வைத்து, இலக்கணத் தொடர்பை முழுமையாக மறைமுகமாக விடுதல்.
  rationale: கிரேக்கத்தில் உள்ள apposition-ஐ தமிழில் புரிந்துகொள்ள உதவுகிறது; பட்டியலை உறுப்புகளுக்கான தனித்த உடல் அங்கங்களாகத் தவறாக வாசிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘உறுப்புகள்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டாலும், பட்டியலின் தொடர்பு இயல்பான தமிழில் தெளிவுபடுத்தப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
