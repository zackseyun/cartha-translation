review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the decisive imperative, the vice list, and the identification of greed specifically as idolatry. However, it adds a second imperative (“ஒழித்துவிடுங்கள்”), whereas the Greek has one imperative followed by an appositional list. Its main rendering of τὰ ἐπὶ τῆς γῆς as “பூமிக்குரிய” also resolves the source’s spatial wording more interpretively than necessary.
  naturalness: The revised wording retains a dignified modern Tamil register while avoiding the syntactically unnecessary repeated command. “பூமியின்மேல் உள்ள உறுப்புகள்” is deliberately somewhat marked because it preserves Paul’s bodily-member metaphor and spatial expression.
  terminology: “பாலியல் ஒழுக்கக்கேடு,” “அசுத்தம்,” “வேட்கை,” “தீய ஆசை,” “பேராசை,” and “சிலைவழிபாடு” are suitable modern-standard Tamil renderings. “வேட்கை” is sufficiently direct for πάθος without adding the interpretive qualifier “கட்டுப்பாடற்ற.”
  issues:
  - severity: medium
    issue: 'The translation supplies a second imperative: “ஆகியவற்றை ஒழித்துவிடுங்கள்.”'
    rationale: Νεκρώσατε is the passage’s sole imperative. The vices are appositional to “members,” not a separately commanded object. The additional imperative makes the Tamil more explanatory but alters the source syntax and repeats the command.
  - severity: low
    issue: “பூமிக்குரிய” in the main text interprets τὰ ἐπὶ τῆς γῆς as an abstract adjectival phrase.
    rationale: The Greek more literally says “the members that are on the earth.” Retaining “பூமியின்மேல் உள்ள” in the main text better preserves the source metaphor; the interpretive alternative can remain in a footnote.
  - severity: low
    issue: “கட்டுப்பாடற்ற வேட்கை” expands πάθος.
    rationale: The negative vice-list context supplies the adverse sense. “வேட்கை” is more lexically restrained and does not add an explicit qualification absent from the word itself.
  revised_text: 'ஆகவே, பூமியின்மேல் உள்ள உறுப்புகளைச் சாகடித்துவிடுங்கள்[a]: பாலியல் ஒழுக்கக்கேடு, அசுத்தம், வேட்கை, தீய ஆசை, பேராசை[b]—இந்தப் பேராசையே சிலைவழிபாடு.'
