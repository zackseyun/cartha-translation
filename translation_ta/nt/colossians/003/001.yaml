review_pass:
  verdict: revise
  source_fidelity: The conditional εἰ οὖν and the imperative ζητεῖτε are represented well, as are τὰ ἄνω, the locative relative clause, and the Messiah's seated position at God's right hand. However, உயிரோடு (“alive”) is not stated by συνηγέρθητε and adds an explicit element beyond the Greek. The union/co-participation sense is adequately retained by மெசியாவுடன்.
  naturalness: The sentence is clear, dignified, and natural modern standard Tamil. Replacing உயிரோடு எழுப்பப்பட்டீர்கள் with மெசியாவுடன் எழுப்பப்பட்டீர்கள் is both more economical and closer to the source.
  terminology: மெசியா consistently renders Χριστός as a title, in line with the supplied audit trail. கடவுளின் வலப்பக்கத்தில் அமர்ந்திருக்கிறார் is a natural rendering of the established exaltation expression and preserves its imagery without overinterpreting it.
  issues:
  - severity: medium
    issue: உயிரோடு adds an element not explicitly present in συνηγέρθητε.
    rationale: The verb means “were raised together/with,” and its resurrection context may imply life, but the Greek does not contain an equivalent of “alive.” Tamil can express the passive raising and association with the Messiah without this addition.
  revised_text: எனவே, நீங்கள் மெசியாவுடன் எழுப்பப்பட்டீர்கள் என்றால்[a], மேலே உள்ளவற்றை நாடுங்கள்; அங்கே மெசியா கடவுளின் வலப்பக்கத்தில் அமர்ந்திருக்கிறார்.
