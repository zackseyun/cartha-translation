revisions:
- from: ஆகவே, நீங்கள் மெசியாவுடன் உயிரோடு எழுப்பப்பட்டீர்கள் என்றால்[a], மேலே உள்ளவற்றை நாடுங்கள்; அங்கே மெசியா கடவுளுடைய வலப்பக்கத்தில் அமர்ந்திருக்கிறார்.
  to: எனவே, நீங்கள் மெசியாவுடன் எழுப்பப்பட்டீர்கள் என்றால்[a], மேலே உள்ளவற்றை நாடுங்கள்; அங்கே மெசியா கடவுளின் வலப்பக்கத்தில் அமர்ந்திருக்கிறார்.
  rationale: The revision removes the added word உயிரோடு while retaining the Greek conditional form, the passive past raising, association with the Messiah, the plural openness of “the things above,” and the present seated position. The footnote remains anchored to the conditional clause and explains the viable contextual alternative without resolving the Greek condition into a statement in the main text.
  reviewer_model: gpt-5.6-terra
