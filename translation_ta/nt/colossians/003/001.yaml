id: COL.3.1
reference: Colossians 3:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: ta
  text: எனவே, நீங்கள் மெசியாவுடன் எழுப்பப்பட்டீர்கள் என்றால்[a], மேலே உள்ளவற்றை நாடுங்கள்; அங்கே மெசியா கடவுளின் வலப்பக்கத்தில் அமர்ந்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனவே, நீங்கள் மெசியாவுடன் எழுப்பப்பட்டிருப்பதால்.” கிரேக்கம் “என்றால்” என்ற நிபந்தனை வடிவத்தைக் கொண்டுள்ளது; ஆனால் சூழலில் அந்த நிபந்தனை உண்மை என்றே கருதப்பட்டிருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰ οὖν
  choice: ஆகவே, ... என்றால்
  rationale: εἰ என்பதன் நிபந்தனை வடிவத்தையும் οὖν என்பதன் முடிவுரைக் தொடர்பையும் இயல்பான தமிழில் காக்கிறது; சூழல் அந்த நிபந்தனை உண்மை எனக் கருதினாலும் அதை ‘நீங்கள் ... இருப்பதால்’ என்று தீர்மானமாக மாற்றவில்லை.
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: நீங்கள் மெசியாவுடன் உயிரோடு எழுப்பப்பட்டீர்கள்
  rationale: συνηγέρθητε என்பதன் இறந்தகாலச் செயலப்பாட்டு வடிவத்தையும், τῷ Χριστῷ காட்டும் இணைவையும் காக்கிறது. வெறும் ‘எழுப்பப்பட்டீர்கள்’ என்பதைவிட ‘உயிரோடு எழுப்பப்பட்டீர்கள்’ என்பது மரணத்திலிருந்து எழுப்புதலைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὰ ἄνω
  choice: மேலே உள்ளவற்றை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நடுநிலைப் பன்மையைப் பன்மையாகவே காக்கிறது; ‘பரலோக காரியங்கள்’ என்று விளக்கி மூலத்தின் விரிவைச் சுருக்கவில்லை.
- source_word: ζητεῖτε
  choice: நாடுங்கள்
  rationale: தொடர்ந்து நோக்கிச் செல்லும் தேடல் மற்றும் விருப்பத்தின் பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: οὗ
  choice: அங்கே
  rationale: ‘மேலே’ எனக் குறிக்கப்பட்ட இடத்தை இயல்பாக மீண்டும் சுட்டுகிறது.
- source_word: ὁ Χριστός
  choice: மெசியா
  rationale: Χριστός இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருளுடன் செயல்படுவதால், ஒலிபெயர்ப்பான ‘கிறிஸ்து’ என்பதற்குப் பதிலாக ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: கடவுளுடைய வலப்பக்கத்தில் அமர்ந்திருக்கிறார்
  rationale: அரச அதிகாரத்தையும் மேன்மையையும் குறிக்கும் வேதாகம உருவகத்தைப் பாதுகாத்து, நிகழ்காலத்தில் தொடரும் அமர்ந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: Εἰ என்ற நிபந்தனையின் வலிமை
  choice: ‘என்றால்’ என நிபந்தனை வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘நீங்கள் ... எழுப்பப்பட்டிருப்பதால்’
  rationale: இந்த வாதத்தில் பவுல் நிலைமையை உண்மையெனக் கருத வாய்ப்பிருந்தாலும், கிரேக்கத்தின் வெளிப்படையான நிபந்தனை வடிவத்தையும் அதன் சொற்பொழிவுத் தாக்கத்தையும் மொழிபெயர்ப்பு காக்கிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு உயிர்த்தெழுப்பப்பட்டவர்களுடனான இணைவும் உயர்த்தப்பட்ட அபிஷேகம் பெற்றவரின் நிலையும் பேசப்படுவதால் பட்டப்பொருள் உயிரோடு உள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உயிரோடு எழுப்பப்பட்டீர்கள்’ என்பது உயிர்த்தெழுதல் சார்ந்த συνεγείρω என்பதன் பொருளைத் தெளிவாக்குகிறது; ‘மேலே உள்ளவை’ என்ற திறந்த சொல்லாக்கம் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
