  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: ta
  text: தந்தையரே, உங்கள் பிள்ளைகளுக்குக் கோபமூட்டாதீர்கள்; அவர்கள் மனந்தளராதபடிக்கு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் ஊக்கமிழக்காதபடிக்கு.’
    reason: ἀθυμέω என்பதற்கான நெருக்கமான மாற்றுச் சொல்லாக்கம்; ‘மனந்தளருதல்’ மற்றும் ‘ஊக்கமிழத்தல்/துணிவிழத்தல்’ ஆகிய பொருள் நிழல்களைப் பிரதிபலிக்கிறது.
lexical_decisions:
- source_word: οἱ πατέρες
  choice: தந்தையரே
  rationale: πατέρες என்பதன் நேரடியான பொருள் ‘தந்தையர்’. குடும்ப ஒழுங்கைக் குறித்த இப்பகுதியில் குறிப்பிட்ட குடும்பப் பொறுப்புடையவர்களே தனித்தனியாக அழைக்கப்படுவதால், ‘பெற்றோரே’ என்று பொதுமைப்படுத்தாமல் மூலத்தின் பாலினக் குறிப்பைப் பேணுகிறது.
- source_word: μὴ ἐρεθίζετε
  choice: எரிச்சலூட்டாதீர்கள்
  rationale: ἐρεθίζω இங்கு பிள்ளைகளிடம் தீங்கான எதிர்வினையைத் தூண்டும் வகையில் நடந்துகொள்வதைக் குறிக்கிறது. ‘எரிச்சலூட்டாதீர்கள்’ என்பது நவீன தமிழில் இயல்பாகவும் எதிர்மறையான தூண்டுதலின் செயற்பொருளைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: τὰ τέκνα ὑμῶν
  choice: உங்கள் பிள்ளைகளுக்கு
  rationale: τέκνα என்பது ஆண், பெண் இருபாலரையும் உள்ளடக்கும் ‘பிள்ளைகள்’ என்ற பொதுச் சொல். தமிழ் வினை அமைப்புக்கு ஏற்றவாறு நான்காம் வேற்றுமையில் தரப்பட்டுள்ளது.
- source_word: ἵνα μὴ
  choice: அப்படிச் செய்தால் ... போகக்கூடும்
  rationale: ἵνα μή இங்கு தவிர்க்கப்பட வேண்டிய விளைவைச் சுட்டுகிறது. தமிழில் இயல்பான நிபந்தனை-விளைவு அமைப்பு நோக்கம்/விளைவு உறவைக் காட்டுகிறது; அதேவேளை அது தவிர்க்க முடியாத உறுதியான விளைவு என மிகைப்படுத்தாது.
- source_word: ἀθυμῶσιν
  choice: மனந்தளர்ந்து போகக்கூடும்
  rationale: ἀθυμέω என்பது துணிவு அல்லது ஊக்கம் குன்றி மனந்தளர்வதைக் குறிக்கிறது. ‘மனந்தளர்ந்து போகக்கூடும்’ என்பது உள்ளார்ந்த ஊக்க இழப்பையும் உருவாகும் நிலைமாற்றத்தையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: குடும்ப அறிவுரையில் πατέρες என்பதன் வரம்பு
  choice: குறிப்பாகத் தந்தையரை நோக்கிய அழைப்பு
  alternative: பொதுவாகப் பெற்றோரை நோக்கிய அழைப்பு
  rationale: கிரேக்க மூலத்தில் ‘தந்தையர்’ என்றே உள்ளது. இதன் நடைமுறைப் பொருத்தம் பிற பெற்றோருக்கும் இருக்கலாம்; எனினும் மொழிபெயர்ப்பு குறிப்பிட்ட அழைப்பைப் பொதுமைப்படுத்தாமல் பாதுகாக்கிறது.
- issue: ἵνα μή குறிக்கும் தொடர்பு
  choice: தவிர்க்கப்பட வேண்டிய விளைவு
  alternative: 'வெளிப்படையான நோக்கக் கூற்று: ‘அவர்கள் மனந்தளராதபடிக்கு’'
  rationale: இச்சூழலில் தந்தையரின் நடத்தையால் பிள்ளைகள் மனந்தளர்வது தவிர்க்கப்பட வேண்டும் என்ற நோக்கமும் விளைவும் நெருக்கமாக இணைந்துள்ளன. இயல்பான தமிழ் நடையில் விளைவு வடிவம் பயன்படுத்தப்பட்டாலும், காரணத் தொடர்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகருக்கு எளிதில் புரியும் dignified குடும்ப அறிவுரை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தந்தையரே’ மூலத்தின் குறிப்பிட்ட அழைப்பைத் தக்கவைக்கிறது; ‘பிள்ளைகள்’ இருபாலரையும் உள்ளடக்குகிறது. முதன்மை உரையின் [a] குறி தொடர்புடைய மாற்றுச் சொல்லாக்கத்தை அடிக்குறிப்புடன் இணைக்கிறது.
