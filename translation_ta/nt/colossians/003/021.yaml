  naturalness: ‘உங்கள் பிள்ளைகளுக்கு எரிச்சலூட்டாதீர்கள்’ இயல்பாகப் புரிந்தாலும், இச்சூழலில் ‘எரிச்சலூட்டுதல்’ தற்காலிகக் கோபத்தை மையப்படுத்தலாம். தொடர்ச்சியான தூண்டுதல் அல்லது மனவருத்தம் விளைவித்தலைக் குறிக்கும் மூலத்திற்கு ‘கோபமூட்டாதீர்கள்’ நவீன தமிழில் சுருக்கமாகவும் இயல்பாகவும் அமைகிறது. ‘அவர்கள் மனந்தளராதபடிக்கு’ என்பது இயல்பான, கண்ணியமான அறிவுரை நடை.
