  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: ta
  text: மேலும், நீங்கள் புதிய மனிதனை[a] அணிந்துகொண்டீர்கள்; அவன், அவனைப் படைத்தவரின் சாயலுக்கு ஏற்ப, அறிவை நோக்கிப்[b] புதுப்பிக்கப்பட்டு வருகிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புதிய ஆளுமையை.” கிரேக்கத்தில் இது முந்தைய வசனத்திலுள்ள “பழைய மனிதன்” என்பதற்கு எதிரிணையாக உள்ளது; ஆண் ஒருவரை மட்டும் குறிக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முழுமையான அறிவை நோக்கி” அல்லது “ஆழ்ந்த அறிவை நோக்கி.” கிரேக்கச் சொல் நிறைவான அல்லது ஆழமான அறிவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: அணிந்துகொண்டீர்கள்
  rationale: இறந்தகாலப் பங்கேற்புவினை முந்தைய சூழலுடன் இணைந்து நிறைவுற்ற செயலைக் குறிக்கிறது. ஆடையை அணியும் உருவகத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τὸν νέον
  choice: புதிய மனிதனை
  rationale: இங்கு νέον பெயர்ச்சொல்லாகப் பயன்பட்டு, முந்தைய வசனத்திலுள்ள ‘பழைய மனிதன்’ என்பதற்கு நேரான எதிரிணையாக உள்ளது. ‘மனிதன்’ என்பது இச்சூழலில் ஆண் ஒருவரை மட்டும் அல்லாமல் புதுப்பிக்கப்பட்ட மனித அடையாளத்தைக் குறிக்கிறது.
- source_word: ἀνακαινούμενον
  choice: புதுப்பிக்கப்பட்டு வருகிறான்
  rationale: நிகழ்காலச் செயப்பாட்டு பங்கேற்புவினை, தொடர்ந்து நடைபெறும் புதுப்பித்தலையும் அதைச் செய்பவர் மறைமுகமாக இருப்பதையும் காக்கிறது.
- source_word: εἰς ἐπίγνωσιν
  choice: அறிவை நோக்கி
  rationale: εἰς காட்டும் இலக்கு அல்லது முன்னேற்றத் திசையைத் தக்கவைக்கிறது. ἐπίγνωσις என்பதில் இருக்கக்கூடிய முழுமையான அல்லது ஆழ்ந்த அறிவு என்ற நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατ’ εἰκόνα
  choice: சாயலுக்கு ஏற்ப
  rationale: κατά இங்கு ஒத்தமைவு அல்லது அளவுகோலைக் குறிக்கிறது. இந்தச் சொற்றொடர் ஆதியாகமத்தின் சாயல் மொழியுடனான தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: தன்னைப் படைத்தவரின்
  rationale: படைப்பவரைத் தனிப்பட்டவராகக் காட்டி, αὐτόν என்பதன் முன்னிலையான ‘புதிய மனிதன்’ என்பதையும் தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: τὸν νέον என்பதன் மனிதவியல் பொருள்
  choice: புதிய மனிதன்
  alternative: புதிய ஆளுமை / புதிய தன்
  rationale: உடனடியான சூழலில் உள்ள ‘பழைய மனிதன்’–‘புதிய மனிதன்’ எதிரிணையையும், தனிநபர் மற்றும் கூட்டு மனிதகுலம் ஆகிய இரு பரிமாணங்களுக்கான வாய்ப்பையும் இது காக்கிறது. இது ஆண்களை மட்டும் குறிக்கும் சொல் அல்ல என்பதை அடிக்குறிப்பு விளக்குகிறது.
- issue: ἐπίγνωσις என்பதன் வலிமை
  choice: அறிவு
  alternative: முழுமையான அறிவு / ஆழ்ந்த அறிவு
  rationale: ‘முழுமையான’ என்பது சாத்தியமான நுட்பமாக இருந்தாலும் கிரேக்கச் சொல்லில் தனியாக வெளிப்படையாகச் சேர்க்கப்படவில்லை; ஆகவே முதன்மை உரை மிகைப்படுத்தாமல் இருந்து, மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- issue: εἰς என்பதன் இலக்கு சார்ந்த பொருள்
  choice: அறிவை நோக்கி
  alternative: அறிவில் / அறிவடையும்படி
  rationale: புதுப்பித்தல் நகரும் இலக்கை வெளிப்படுத்தி, அதை வெறும் தளமாகவோ அல்லது உறுதியான நோக்கவாக்கியமாகவோ மட்டும் முடிவுசெய்யாமல் கிரேக்கத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் மரியாதையும் எளிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அணிந்துகொள்’ என்ற ஆடை உருவகம், தொடர்ச்சியான செயப்பாட்டு புதுப்பித்தல், படைத்தவரின் சாயல் என்ற ஆதியாகமத் தொடர்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
