  text: In these things you too once walked[a], when you were living in them.
translation:
  language: ta
  text: இவற்றில்[a] நீங்களும் ஒரு காலத்தில் நடந்துகொண்டீர்கள்; அப்போது அவற்றில் வாழ்ந்துவந்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “எவற்றில் நீங்களும் ஒரு காலத்தில் நடந்துகொண்டீர்களோ, அப்போது அவற்றில் வாழ்ந்துவந்தீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: இவற்றில்
  rationale: பன்மை உறவுப்பெயர் முந்தைய வசனங்களில் கூறப்பட்ட தீய செயல்களைக் குறிக்கிறது. தமிழில் அதன் சுட்டுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘இவற்றில்’ என மொழிபெயர்க்கப்பட்டுள்ளது; கிரேக்கத்தின் ‘எவற்றில்’ என்ற நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: καὶ என்பதும் வலியுறுத்தப்பட்ட ὑμεῖς என்பதும் கொலோசெயரும் முன்பு அந்த வாழ்க்கை முறையில் பங்குகொண்டிருந்ததை எடுத்துக்காட்டுகின்றன. ‘நீங்களும்’ இந்த வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: περιεπατήσατε
  choice: நடந்துகொண்டீர்கள்
  rationale: περιπατέω இங்கு வாழ்க்கை நடத்தையைச் சுட்டும் உருவகமாக வருகிறது. ‘நடந்துகொண்டீர்கள்’ அந்தப் பவுலிய உருவகத்தைத் தக்கவைத்துக்கொள்வதோடு, பின்னர் வரும் ζάω என்பதிலிருந்து சொல்லியல் வேறுபாட்டையும் காக்கிறது.
- source_word: ποτε
  choice: ஒரு காலத்தில்
  rationale: ποτε குறிப்பிட்ட காலத்தைச் சொல்லாமல் முற்கால நிலையைச் சுட்டுகிறது. ‘ஒரு காலத்தில்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅτε
  choice: அப்போது
  rationale: முன்னைய நடத்தையையும் அக்கால வாழ்க்கை நிலையையும் இணைக்கும் காலக் குறிப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐζῆτε
  choice: வாழ்ந்துவந்தீர்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்த நிலையை imperfect வடிவம் சுட்டுவதால் ‘வாழ்ந்துவந்தீர்கள்’ எனத் தரப்பட்டுள்ளது. இது முந்தைய ‘நடந்துகொண்டீர்கள்’ என்ற உருவக வினையிலிருந்தும் வேறுபடுகிறது.
- source_word: ἐν τούτοις
  choice: இவற்றிலேயே
  rationale: τούτοις முந்தைய தீய செயல்களையே மீண்டும் சுட்டுகிறது. ‘இவற்றிலேயே’ என்பது அவர்கள் அத்தகைய செயல்களின் வட்டத்திற்குள் வாழ்ந்த நிலையை வெளிப்படுத்துகிறது; ஏகார வலியுறுத்தல் அந்தச் சூழலுடனான நெருங்கிய தொடர்பை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘நடந்துகொண்டீர்கள்’ என்பதற்கும் ‘வாழ்ந்துவந்தீர்கள்’ என்பதற்கும் இடையிலான உறவு
  choice: முன்னைய நடத்தை மற்றும் அவர்கள் இருந்த முன்னைய வாழ்க்கைச் சூழல் ஆகிய இரண்டையும் வேறுபடுத்திக் காட்டுதல்
  alternative: இரு வினைகளையும் ஒரே பொருளுடையவையாகக் கொண்டு இரண்டையும் ‘வாழ்ந்தீர்கள்’ என மொழிபெயர்த்தல்
  rationale: περιπατέω மற்றும் ζάω என்ற இரு வேறு கிரேக்க வினைகளின் வேறுபாட்டைக் காப்பது, பவுலின் அடுக்கான அறநெறி விளக்கத்தைத் தக்கவைக்கிறது; கூடுதல் கோட்பாட்டுக் கருத்து எதையும் இதில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நடந்துகொண்டீர்கள்’ என்ற உருவகம் மூலத்தின் பவுலிய சொல்லாட்சியைப் பாதுகாக்கிறது; ‘வாழ்ந்துவந்தீர்கள்’ தொடர்ச்சியான முற்கால நிலையை இயல்பாகக் காட்டுகிறது.
