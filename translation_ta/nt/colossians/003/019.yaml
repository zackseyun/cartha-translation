  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: ta
  text: கணவர்களே, உங்கள் மனைவிகளை அன்புகூருங்கள்; அவர்களிடம் மனக்கசப்பு கொள்ளாதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களிடம் கடுமையாக நடந்துகொள்ளாதீர்கள்.” கிரேக்க வினை மனக்கசப்பு அடைவதையோ கசப்புணர்வை வளர்த்துக்கொள்வதையோ குறிக்கலாம்; இச்சூழலில் அது கடுமையான அல்லது வெறுப்புணர்வான நடத்தையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: கணவர்களே
  rationale: ἀνήρ என்பது ‘ஆண்’ அல்லது ‘கணவன்’ என்று பொருள்படலாம். இங்குள்ள குடும்ப உறவுச் சூழலும் ‘மனைவிகள்’ என்ற தொடர்புடைய சொல்லும் ‘கணவர்கள்’ என்ற பொருளைத் தெளிவாக்குகின்றன; அழைப்புமுறையைத் தமிழ் இயல்புக்கு ஏற்ப ‘கணவர்களே’ என வழங்குகிறது.
- source_word: ἀγαπᾶτε
  choice: அன்புகூருங்கள்
  rationale: ἀγαπάω என்ற வினையின் அன்பு செலுத்துதல் என்னும் பொருளையும் கட்டளையின் வலிமையையும் இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: τὰς γυναῖκας
  choice: உங்கள் மனைவிகளிடம்
  rationale: γυνή என்பது ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள்படலாம்; பரஸ்பரக் குடும்ப அறிவுறுத்தலின் சூழலில் ‘மனைவிகள்’ என்பதே தேவை. கிரேக்கத்தில் கட்டுரை மட்டும் இருந்தாலும் உறவைக் காட்டத் தமிழில் ‘உங்கள்’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது. ‘அன்புகூரு’ என்பதுடன் ‘இடம்’ இயல்பாக வருவதால் ‘மனைவிகளிடம்’ என அமைக்கப்பட்டுள்ளது.
- source_word: μὴ πικραίνεσθε
  choice: மனக்கசப்புக்கொள்ளாதீர்கள்
  rationale: πικραίνω கசப்பு, மனக்கசப்பு அல்லது கசப்பான கடுமை ஆகியவற்றைக் குறிக்கலாம். நடுவின/செயப்பாட்டு வடிவத்தின் ‘கசப்படையாதீர்கள், மனக்கசப்புக்கொள்ளாதீர்கள்’ என்ற நுணுக்கத்தைப் பிரதான உரை காக்கிறது; நடத்தையில் கடுமையாக இருப்பது என்ற சூழல்சார் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πρὸς αὐτάς
  choice: அவர்கள்மீது
  rationale: πρός + accusative மனப்பாங்கு அல்லது செயலின் திசையைச் சுட்டுகிறது. ‘மனக்கசப்புக்கொள்ளாதீர்கள்’ என்பதுடன் ‘அவர்கள்மீது’ என்பது தெளிவான இயல்பான தமிழ் இணைப்பு.
theological_decisions:
- issue: குடும்ப அறிவுறுத்தலில் பாலினத்தையும் திருமண உறவையும் குறிக்கும் அழைப்பு
  choice: ‘கணவர்களே’ மற்றும் ‘உங்கள் மனைவிகள்’ என்ற பாலின-உறவு சார்ந்த சொல்லாக்கத்தைத் தக்கவைத்தல்
  alternative: ‘ஆண்களே’ மற்றும் ‘பெண்கள்’ போன்ற பொதுவான சொற்களைப் பயன்படுத்துதல்
  rationale: கிரேக்க உரை இச்சூழலில் திருமண உறவிலுள்ள ஆண்களை அவர்களுடைய மனைவிகள் தொடர்பாக நேரடியாக அழைக்கிறது; இதைப் பொதுவான ஆண்-பெண் அறிவுறுத்தலாக விரிவாக்குவது மூலத்தின் வரம்பை மாற்றிவிடும்.
- issue: πικραίνεσθε என்பதிலுள்ள உள்ளார்ந்த மனக்கசப்பும் வெளிப்படும் கடுமையும்
  choice: பிரதான உரையில் ‘மனக்கசப்புக்கொள்ளாதீர்கள்’ என்று சொல்லி சொற்பொருள் சார்ந்த நுணுக்கத்தைப் பாதுகாத்தல்
  alternative: ‘அவர்களிடம் கடுமையாக நடந்துகொள்ளாதீர்கள்’ என்று நடத்தையை மட்டும் முன்னிறுத்துதல்
  rationale: வினை கசப்பு அல்லது மனக்கசப்படைதலை நேரடியாகக் குறிக்கக்கூடியதுடன், இச்சூழலில் கடுமையான நடத்தையையும் உணர்த்தலாம். பிரதான உரையும் அடிக்குறிப்பும் சேர்ந்து இந்த உண்மையான பொருள் விரிவைத் தீர்த்துவிடாமல் காக்கின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கணவர்களே’ நேரடி அழைப்பையும், ‘அன்புகூருங்கள்’ கட்டளையின் தெளிவையும் காக்கின்றன. மூல வினையின் கசப்பு/கடுமை என்ற பொருள் பரப்பை பிரதான உரையும் அடிக்குறிப்பும் இணைந்து வெளிப்படுத்துகின்றன.
