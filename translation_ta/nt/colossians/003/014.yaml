  source_fidelity: மூலக் கிரேக்கத்தின் வாக்கியத் தொடர்பை மொழிபெயர்ப்பு நன்றாகக் காக்கிறது. வசனம் 12-இலிருந்து தொடரும் மறைமுகக் கட்டளை ‘அணிந்துகொள்ளுங்கள்’ எனத் தகுந்தவாறு நிரப்பப்பட்டுள்ளது. ἐπὶ πᾶσιν δὲ τούτοις என்பதன் முன்னுரிமை மற்றும் ஆடை-உருவக நுணுக்கம் ‘இவை எல்லாவற்றுக்கும் மேலாக’ என்பதில் உள்ளது. ‘நிறைவின் பிணைப்பு’ σύνδεσμος τῆς τελειότητος என்பதன் செறிவான, திறந்த பிறப்புவேற்றுமை உறவை மிகையாக விளக்காமல் காக்கிறது.
