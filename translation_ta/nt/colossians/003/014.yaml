id: COL.3.14
reference: Colossians 3:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: ta
  text: இவை எல்லாவற்றுக்கும் மேலாக[a] அன்பை அணிந்துகொள்ளுங்கள்; அதுவே நிறைவின் பிணைப்பு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இவை எல்லாவற்றின்மேலும்’; அல்லது, ‘இவை எல்லாவற்றோடும் கூடுதலாக.’
    reason: ἐπὶ πᾶσιν δὲ τούτοις என்பது ஆடை உருவகத்தில் மற்ற பண்புகளின்மேல் அன்பை அணிவதையோ, அன்பின் முதன்மையையோ, மற்றவற்றுடன் அதையும் சேர்ப்பதையோ உணர்த்தக்கூடும்.
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: இவை எல்லாவற்றுக்கும் மேலாக
  rationale: ἐπί + இடவேற்றுமை இங்கு முந்தைய ஆடை அணியும் உருவகத்தைத் தொடர்கிறது; மற்ற பண்புகள் அனைத்திற்கும் மேலாக அணியப்படுவதையும் அன்பின் முதன்மையையும் இந்தச் சொற்றொடர் காக்கிறது.
- source_word: τὴν ἀγάπην
  choice: அன்பை
  rationale: ἀγάπη என்பதற்கான இயல்பான, பொதுவாகப் புரியும் தமிழ் இணைச்சொல் ‘அன்பு’; இங்கு அது மற்ற பண்புகளை நிறைவு செய்யும் தலைசிறந்த பண்பாக வருகிறது.
- source_word: '[implicit verb from context: ἐνδύσασθε, v. 12]'
  choice: அணிந்துகொள்ளுங்கள்
  rationale: இந்த வசனத்தில் வினைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், வசனம் 12-இன் ἐνδύσασθε என்ற கட்டளை இங்கும் தொடர்கிறது. அதைத் தமிழில் சேர்ப்பது வாக்கியத்தை இயல்பாக்கி ஆடை உருவகத்தையும் காக்கிறது.
- source_word: ὅ
  choice: அதுவே
  rationale: ὅ நடுநிலை ஒருமையாக இருந்து, பெண்பால் ἀγάπη என்ற சொல்லை மட்டும் அல்லாமல் அன்பு என்ற முழுக் கருத்தையும் சுட்டுகிறது. ‘அதுவே’ அந்த விளக்கத் தொடர்பையும் வலியுறுத்தலையும் இயல்பாகத் தருகிறது.
- source_word: σύνδεσμος
  choice: பிணைப்பு
  rationale: σύνδεσμος ஒன்றாக இணைத்துப் பிடிப்பதைக் குறிக்கிறது. ‘பிணைப்பு’ சுருக்கமாகவும் இயல்பாகவும் இருந்து, அன்பு மற்ற பண்புகளை ஒன்றிணைக்கும் கருத்தைத் தெரிவிக்கிறது.
- source_word: τῆς τελειότητος
  choice: நிறைவின்
  rationale: τελειότης முழுமை, நிறைவு, முதிர்ச்சி ஆகிய தொடர்புடைய பொருள்களைக் கொண்டது. ‘நிறைவு’ நவீன தமிழில் இயல்பாக இருந்து, கிரேக்கப் பிறப்புவேற்றுமையின் துல்லிய உறவைத் தீர்மானித்துவிடாமல் அதன் பரப்பைக் காக்கிறது.
theological_decisions:
- issue: சύνδεσμος τῆς τελειότητος என்பதில் அன்புக்கும் நிறைவுக்கும் உள்ள உறவு
  choice: ‘நிறைவின் பிணைப்பு’ என்று கிரேக்கத்தின் செறிவான அமைப்பைத் தக்கவைத்தல்
  alternative: ‘நிறைவாக ஒன்றிணைக்கும் பிணைப்பு’ அல்லது ‘முதிர்ச்சிக்கு வழிநடத்தும் பிணைப்பு’
  rationale: τῆς τελειότητος என்ற பிறப்புவேற்றுமை, நிறைவுக்குரிய பிணைப்பு, நிறைவை உண்டாக்கும் பிணைப்பு, அல்லது அனைத்தையும் நிறைவாக ஒன்றிணைக்கும் பிணைப்பு என தொடர்புடைய பல நுணுக்கங்களை அனுமதிக்கிறது. ‘நிறைவின் பிணைப்பு’ அந்த இறையியல் மற்றும் இலக்கணத் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அணிந்துகொள்ளுங்கள்’ சுற்றியுள்ள ஆடை உருவகத்தைத் தொடர்கிறது; ‘நிறைவின் பிணைப்பு’ மூலத்தின் செறிவையும் பொருள் நெகிழ்வையும் காக்கிறது.
