- from: மேலே உள்ளவற்றிலேயே உங்கள் மனதைச் செலுத்துங்கள்[a]; பூமியில் உள்ளவற்றில் அல்ல[b].
  to: மேலே உள்ளவற்றில் உங்கள் மனதைச் செலுத்துங்கள்[a]; பூமியில் உள்ளவற்றில் செலுத்தாதீர்கள்[b].
  rationale: The revision removes the unexpressed exclusivity in '-இலேயே' and makes the negative imperative explicit in idiomatic Tamil. It retains the plural, spatial contrast and the broader mindset-orientation sense of φρονεῖτε. Footnote b is adjusted to be an alternative expression for the object phrase rather than repeating the negative particle already conveyed in the main text.
