  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: ta
  text: மேலே உள்ளவற்றில் உங்கள் மனதைச் செலுத்துங்கள்[a]; பூமியில் உள்ளவற்றில் செலுத்தாதீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலே உள்ளவற்றைப் பற்றிச் சிந்தியுங்கள்.” கிரேக்க வினைச்சொல் சிந்திப்பதை மட்டுமல்லாமல், ஒருவருடைய மனப்பாங்கையும் அக்கறையையும் ஒன்றின்மேல் செலுத்துவதையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பூமிக்குரியவற்றில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: மேலே உள்ளவற்றிலேயே
  rationale: ஆண்பால்/பெண்பால் சாராத பன்மை உருபுடன் வரும் ἄνω இங்கு பெயர்ச்சொல் போலச் செயல்பட்டு, மேலுலகுக்குரிய காரியங்களைக் குறிக்கிறது. ‘மேலே உள்ளவை’ என்பது பன்மையையும், பூமியில் உள்ளவற்றுடனான இடவியல் எதிர்மறை ஒப்புமையையும் காக்கிறது; ‘-இலேயே’ மனம் செலுத்தப்படும் இலக்கை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: φρονεῖτε
  choice: உங்கள் மனதைச் செலுத்துங்கள்
  rationale: φρονέω வெறும் சிந்தனையை மட்டுமல்லாமல், மனப்பாங்கு, நோக்கம், அக்கறை ஆகியவற்றை ஒரு திசையில் தொடர்ந்து செலுத்துவதையும் குறிக்கலாம். நிகழ்காலக் கட்டளையின் தொடர்ச்சியான மனநிலையை இந்தத் தமிழ் நடை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μὴ
  choice: அல்ல
  rationale: இரண்டாவது பொருளை மறுத்து, மேலே உள்ளவற்றுக்கும் பூமியில் உள்ளவற்றுக்கும் இடையிலான எதிர்மறை ஒப்புமையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: பூமியில் உள்ளவற்றில்
  rationale: கிரேக்கத்தின் பெயர்ச்சொல் சார்ந்த பன்மைக் கட்டமைப்பையும் τὰ ἄνω என்பதுடனான இணையான வடிவத்தையும் காக்கிறது. ‘பூமிக்குரியவை’ என்பதைவிட இடவியல் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: γῆς
  choice: பூமி
  rationale: ‘மேலே’ என்பதுடனான அண்டவியல் எதிர்மறை ஒப்புமையில் γῆ ஒரு குறிப்பிட்ட நாடு அல்லது நிலப்பகுதியை அல்ல, பூமியைக் குறிக்கிறது.
theological_decisions:
- issue: φρονεῖτε என்ற அறிவுறுத்தலின் தன்மை
  choice: மனப்பாங்கு, சிந்தனை, அக்கறை ஆகியவற்றை மேலே உள்ளவற்றை நோக்கித் தொடர்ந்து செலுத்தும் அறிவுறுத்தல்
  alternative: வானத்தைப் பற்றி அறிவார்ந்த முறையில் மட்டும் சிந்திக்கும்படியான குறுகிய கட்டளை
  rationale: φρονέω என்பதன் பொருள் வரம்பு சிந்தனைக்கு அப்பால் மனப்பாங்கையும் நோக்குநிலையையும் உள்ளடக்குகிறது. ‘உங்கள் மனதைச் செலுத்துங்கள்’ என்பது கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்க்காமல் இந்த விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைந்த கட்டளை நடை. ‘மேலே’—‘பூமியில்’ என்ற மூலத்தின் இடவியல் எதிர்மறை ஒப்புமை காக்கப்பட்டுள்ளது. முதன்மை உரையில் [a], [b] ஆகிய எல்லா அடிக்குறிப்புக் குறிகளும் இடம்பெற்றுள்ளன.
