base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: ta
  text: நீங்கள் சொல்லிலோ செயலிலோ எதைச் செய்தாலும்[a], அனைத்தையும் ஆண்டவராகிய இயேசுவின் பெயரில்[b] செய்யுங்கள்; அவர் வழியாகத் தந்தையாகிய கடவுளுக்கு நன்றி செலுத்திக்கொண்டே இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீங்கள் சொல்வதிலோ செய்வதிலோ.’
    reason: lexical_alternative
  - marker: b
    text: ‘பெயரில்’ என்பது ‘அதிகாரத்துக்கு உட்பட்டு’ அல்லது ‘அவரைப் பிரதிநிதித்துவப்படுத்தி’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: எதைச் செய்தாலும்
  rationale: இது வரையறுக்கப்படாத, அனைத்தையும் உள்ளடக்கும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: சொல்லிலோ செயலிலோ
  rationale: பேச்சையும் நடைமுறைச் செயலையும் எதிரிணையாகக் காட்டும் கிரேக்கச் சொற்றொடரின் சுருக்கத்தையும் சமநிலையையும் காக்கிறது.
- source_word: πάντα
  choice: அனைத்தையும்
  rationale: முந்தைய ‘எதைச் செய்தாலும்’ என்பதைத் தொகுத்து, விதிவிலக்கில்லாத முழுமையை வலியுறுத்துகிறது.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: ஆண்டவராகிய இயேசுவின் பெயரில்
  rationale: அதிகாரம், பிரதிநிதித்துவம், அடையாளப்படுத்தல் ஆகியவற்றை உள்ளடக்கக்கூடிய வேதாகமச் சொல்லாட்சியின் பரந்த பொருளைச் சுருக்காமல் காக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவராகிய
  rationale: இங்கு κύριος கிறிஸ்துவுக்குரிய பட்டமாக இருப்பதால், அதன் எடையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὐχαριστοῦντες
  choice: நன்றி செலுத்துங்கள்
  rationale: கிரேக்கத்தில் உடனிகழும் பங்கேற்பு வினையாக உள்ள கருத்தை, தமிழ் வாக்கியத்தில் இயல்பான exhortation ஆக இணைக்கிறது; ‘செய்து’ என்பதுடன் அதன் உடனிகழ்தல் தெளிவாகிறது.
- source_word: τῷ θεῷ πατρὶ
  choice: தந்தையாகிய கடவுளுக்கு
  rationale: πατρί என்பது θεῷ என்பதற்கு விளக்க இணைப்பாக வருவதைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: δι’ αὐτοῦ
  choice: அவர் வழியாக
  rationale: அருகிலுள்ள முன்னிலையான ஆண்டவர் இயேசுவையே சுட்டும் பிரதிப்பெயரையும், மத்தியஸ்தக் கருத்தையும் கூடுதல் விளக்கமின்றிக் காக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவராகிய இயேசுவின் பெயரில்’ என்பதன் பொருள் வீச்சு
  choice: ‘பெயரில்’ என்ற சொல்லாட்சியை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: ‘அதிகாரத்துக்கு உட்பட்டு’ அல்லது ‘அவரைப் பிரதிநிதித்துவப்படுத்தி’ என்று விரித்துரைத்தல்
  rationale: இந்தச் சொற்றொடர் அதிகாரம், பிரதிநிதித்துவம், அடையாளம் அல்லது பற்றுறுதி ஆகிய பல தொடர்புடைய கருத்துகளைத் தாங்கக்கூடும்; ஒரே விளக்கமாகக் குறுக்காமல் அதன் இறையியல் செறிவைக் காக்கிறது.
- issue: ‘அவர் வழியாக’ என்பதில் ‘அவர்’ யாரைக் குறிக்கிறது
  choice: ஆண்டவராகிய இயேசுவைக் குறிக்கும் பிரதிப்பெயராக வைத்தல்
  alternative: கிறிஸ்துவைக் குறிப்பிடாமல் பொதுவான தொடர்புச் சொல்லாகப் புரிதல்
  rationale: இலக்கணப்படி மிக அருகிலுள்ள முன்னிலை ‘ஆண்டவராகிய இயேசு’; பிரதிப்பெயரை அப்படியே வைத்ததால் மூலத்தின் வடிவமும் தந்தைக்குச் செலுத்தப்படும் நன்றியில் இயேசுவின் இடமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சொல்லிலோ செயலிலோ’ என்ற சுருக்கமான இணை கிரேக்கத்தின் சொல்லாட்சி–செயல் சமநிலையைப் பேணுகிறது; ‘பெயரில்’ என்ற வேதாகமச் சொல்லாட்சி விளக்கக் குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
