  text: δι’ ἃ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ⸂ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: ta
  text: இவற்றின் காரணமாகக் கடவுளின் கோபம் கீழ்ப்படியாமையின் மகன்கள்மேல்[a] வருகிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீழ்ப்படியாமையின் பிள்ளைகள்”; அதாவது, கீழ்ப்படியாமையால் அடையாளப்படுத்தப்படுகிறவர்கள்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் “கீழ்ப்படியாமையின் மகன்கள்மேல்” என்ற சொற்கள் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: δι’ ἃ
  choice: இவற்றின் காரணமாக
  rationale: διά உடன் வரும் ἃ காரணத்தைக் குறிக்கிறது. “இவை” என்பது முந்தைய வசனத்தில் பட்டியலிடப்பட்ட தீய செயல்களைப் பின்னோக்கிச் சுட்டுகிறது.
- source_word: ἔρχεται
  choice: வருகிறது
  rationale: நிகழ்கால வினை வடிவத்தையும் வரவிருக்கும் இறைத்தீர்ப்பின் உணர்வையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: கடவுளின் கோபம்
  rationale: ὀργή இங்கு பாவத்திற்கு எதிரான கடவுளின் நீதியான கோபத்தைக் குறிக்கிறது; “கோபம்” பொதுவாகப் புரியும் நேரடியான தமிழ் சொல்.
- source_word: ἐπὶ
  choice: மேல்
  rationale: வருகிற கோபத்தின் இலக்கை ἐπί குறிக்கிறது; தமிழில் “மகன்கள்மேல்” அந்தத் திசை மற்றும் இலக்கைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: கீழ்ப்படியாமையின் மகன்கள்
  rationale: மூலத்தின் செமித்திய மரபுத்தொடரையும் υἱούς என்பதன் ஆண்பால் வடிவத்தையும் தக்கவைக்கிறது. இது கீழ்ப்படியாமையால் பண்படையாளம் பெறுகிற மக்களைக் குறிக்கும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: “கீழ்ப்படியாமையின் மகன்கள்” என்ற மரபுத்தொடரை அப்படியே வைத்திருப்பதா அல்லது அதன் பொருளை உரையில் விரித்துச் சொல்வதா
  choice: “கீழ்ப்படியாமையின் மகன்கள்” என்று மூல மரபுத்தொடரை முதன்மை உரையில் தக்கவைத்தல்
  alternative: “கீழ்ப்படியாதவர்கள்” அல்லது “கீழ்ப்படியாமையால் பண்படையாளம் பெறுகிறவர்கள்”
  rationale: கிரேக்க உரையின் உருவகமிக்க ஆண்பால் மரபுத்தொடரை அழிக்காமல் வைத்திருக்கிறது; அதன் உள்ளடங்கிய பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας என்ற சொற்றொடரின் உரைநிலை
  choice: SBLGNT முதன்மை உரையைப் பின்பற்றி சொற்றொடரை உரையில் சேர்த்தல்
  alternative: சில பழமையான கையெழுத்துப் பிரதிகளைப் பின்பற்றி சொற்றொடரை விடுதல்
  rationale: வழங்கப்பட்ட மூலப் பதிப்பு இச்சொற்றொடரை உரையில் அச்சிடுகிறது; ஆயினும் அதன் முக்கியமான கையெழுத்துப் பிரதி வேறுபாடு அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. “கீழ்ப்படியாமையின் மகன்கள்” என்பது அன்றாடத் தமிழில் வழக்கமற்றிருந்தாலும், மூலத்தின் நோக்கமுள்ள மரபுத்தொடரைப் பாதுகாக்க முதன்மை உரையில் வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
