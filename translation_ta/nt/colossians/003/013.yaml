base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: ta
  text: ஒருவரை ஒருவர் பொறுத்துக்கொண்டு, ஒருவருக்கொருவர் மன்னியுங்கள்; யாருக்காவது மற்றொருவர்மீது ஏதாவது குறை இருந்தால்,[a] ஆண்டவர் உங்களை மன்னித்ததுபோல, நீங்களும் அப்படியே மன்னியுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாருக்காவது மற்றொருவர்மீது மனக்குறை இருந்தால்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் இறுதியில் வினைச்சொல் வெளிப்படையாக இல்லை; முன்சூழலிலிருந்து “நீங்களும் மன்னியுங்கள்” என்பது புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι
  choice: பொறுத்துக்கொள்ளுங்கள்
  rationale: தொடர்ந்து ஒருவரை ஒருவர் சகித்துத் தாங்கும் உறவுசார் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது. கிரேக்கப் பங்கேற்புவினை அறிவுறுத்தல் சூழலில் இருப்பதால் தமிழில் ஏவல் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ἀλλήλων
  choice: ஒருவரை ஒருவர்
  rationale: பரஸ்பரச் செயலைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: χαριζόμενοι
  choice: மன்னியுங்கள்
  rationale: இந்தச் சூழலில் குற்றத்தை மன்னிப்பதே முதன்மைப் பொருள். மூலச்சொல்லிலுள்ள அருள் காட்டும் நிழற்பொருள் சூழலால் உணரப்பட்டாலும், ‘மன்னியுங்கள்’ என்பதே தெளிவான வழக்குத் தமிழ்.
- source_word: ἑαυτοῖς
  choice: ஒருவருக்கொருவர்
  rationale: வடிவில் தற்சுட்டாக இருந்தாலும், இங்கு திருச்சபைச் சமூகத்தினருக்கிடையேயான பரஸ்பரச் செயலைக் குறிக்கிறது.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: ஒருவர்மீது ஒருவருக்கு ஏதாவது குறை இருந்தால்
  rationale: நிபந்தனையின் பொதுவான, குறிப்பிடப்படாத தன்மையையும் μομφή என்பதன் குறை அல்லது முறையீடு சார்ந்த பொருளையும் இயல்பாகத் தருகிறது.
- source_word: μομφήν
  choice: குறை
  rationale: குற்றச்சாட்டாக மிகைப்படுத்தாமல், ஒருவரைப் பற்றி நியாயமானதோ உணரப்பட்டதோ ஆன மனக்குறை அல்லது புகாரைக் குறிக்கக்கூடிய பொதுவான தமிழ் சொல்.
- source_word: καθὼς καὶ
  choice: மன்னித்ததுபோல
  rationale: ஆண்டவரின் மன்னிப்பையும் விசுவாசிகளின் மன்னிப்பையும் ஒப்பிடும் தொடர்பைத் தெளிவாகக் காக்கிறது; καί-யின் வலியுறுத்தல் தமிழில் வாக்கிய அமைப்பால் வெளிப்படுகிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான மரியாதைமிக்க, பரவலாகப் புரிந்துகொள்ளப்படும் கிறிஸ்தவத் தமிழ் பட்டப்பெயர்; யாரைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பிலேயே அளவுக்கு மீறி விளக்கவில்லை.
- source_word: ἐχαρίσατο
  choice: மன்னித்தார்
  rationale: முன்னுள்ள χαριζόμενοι உடன் உள்ள பொருள்சார் தொடர்பைக் காத்து, நிறைவேறிய மன்னிப்புச் செயலை நேரடியாகக் காட்டுகிறது.
- source_word: οὕτως καὶ ὑμεῖς
  choice: நீங்களும் அப்படியே செய்யுங்கள்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள செயலை முன்சூழலிலிருந்து நிறைவு செய்து, தமிழில் இயல்பான அறிவுறுத்தலாகத் தருகிறது; ‘மன்னியுங்கள்’ என்பதே உட்பொருள் என்பதை அடிக்குறிப்பு குறிப்பிடுகிறது.
theological_decisions:
- issue: ὁ κύριος என்பவர் யார்?
  choice: ‘ஆண்டவர்’ என்ற பட்டப்பெயரை மட்டும் பயன்படுத்தி, சூழலில் கிறிஸ்துவைக் குறிப்பதாக வாசிக்க இடமளித்தல்
  alternative: ‘கிறிஸ்து’ அல்லது ‘தேவன்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: கொலோசெயர் நிருபத்தின் சூழலில் இது கிறிஸ்துவைக் குறிப்பது மிக இயல்பானது; எனினும் கிரேக்கம் பெயரை வெளிப்படையாகச் சொல்லாததால் மொழிபெயர்ப்பு அந்தப் பட்டப்பெயரையே காக்கிறது.
- issue: இறுதிக் கூற்றில் வினைச்சொல் விடுபட்டிருத்தல்
  choice: தமிழின் இயல்புக்காக ‘செய்யுங்கள்’ என்று பொதுவான வினையை நிறைவு செய்தல்
  alternative: ‘நீங்களும் அப்படியே’ என்று வினையின்றி விடுதல் அல்லது ‘நீங்களும் மன்னியுங்கள்’ என்று நேரடியாக நிறைவு செய்தல்
  rationale: கிரேக்கத்தில் செயல் முன்சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது. ‘செய்யுங்கள்’ என்பது விடுபாட்டின் சுருக்கத்தை ஓரளவு காத்தபடி தமிழில் முழுமையான அறிவுறுத்தலை வழங்குகிறது; சேர்க்கப்பட்ட வினை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. கிரேக்கப் பங்கேற்புவினைகள் அறிவுறுத்தல் சூழலுக்கேற்ப தமிழ் ஏவல் வடிவங்களாக மாற்றப்பட்டன. ‘குறை’ என்பது மிகக் கடுமையான சட்டக் குற்றச்சாட்டை உணர்த்தாமல் மூலத்தின் பரந்த பொருளைக் காக்கிறது.
