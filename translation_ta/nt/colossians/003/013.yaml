revisions:
- from: ஒருவரை ஒருவர் பொறுத்துக்கொள்ளுங்கள்; ஒருவர்மீது ஒருவருக்கு ஏதாவது குறை இருந்தால், ஒருவருக்கொருவர் மன்னியுங்கள்.[a] ஆண்டவர் உங்களை மன்னித்ததுபோல, நீங்களும் அப்படியே செய்யுங்கள்.[b]
  to: ஒருவரை ஒருவர் பொறுத்துக்கொண்டு, ஒருவருக்கொருவர் மன்னியுங்கள்; யாருக்காவது மற்றொருவர்மீது ஏதாவது குறை இருந்தால்,[a] ஆண்டவர் உங்களை மன்னித்ததுபோல, நீங்களும் அப்படியே மன்னியுங்கள்.[b]
  rationale: The final ellipsis is completed with “மன்னியுங்கள்,” because forgiveness is the action directly paralleled with the Lord's forgiveness. The two initial reciprocal actions are joined with “பொறுத்துக்கொண்டு,” which is natural Tamil for the coordinated paraenetic participles while retaining the imperative force in “மன்னியுங்கள்.” The alternative lexical footnote has been aligned with the revised generic wording.
