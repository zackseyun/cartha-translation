  source_fidelity: The rendering of ἀπὸ κυρίου, ἀπολήμψεσθε, ἀνταπόδοσιν τῆς κληρονομίας, and τῷ κυρίῳ Χριστῷ is substantively faithful. ‘பணியாற்றுகிறீர்கள்’ correctly reflects δουλεύετε as a present indicative. However, ‘அறிந்தவர்களாய் இருங்கள்’ changes εἰδότες, a participle (‘knowing/as those who know’), into an explicit imperative (‘be knowing’).
