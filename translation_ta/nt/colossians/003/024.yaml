  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: ta
  text: ஆண்டவரிடமிருந்து உரிமைப்பேற்றின் கைம்மாறைப் பெறுவீர்கள் என்பதை அறிந்தவர்களாக, நீங்கள் ஆண்டவராகிய மேசியாவுக்குப்[b] பணியாற்றுகிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணியாற்றுகிறீர்கள்’ என்பதற்கான கிரேக்க வினை வடிவம் சுட்டுவினை; அது நேரடியான ‘பணியாற்றுங்கள்’ என்ற கட்டளைவினை அல்ல.
    reason: lexical_alternative
  - marker: b
    text: மரபுவழியாக, ‘ஆண்டவராகிய கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: அறிந்தவர்களாய் இருங்கள்
  rationale: இது முன் வசனத்தின் அறிவுறுத்தலைத் தொடர்ந்து வரும் பங்கேற்புவினை வடிவம். தமிழில் தனி வசனமாக வாசிக்கும்போது இயல்பாக அமைய இவ்வாறு வழங்கப்பட்டுள்ளது; காரணப் பொருளை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἀπὸ κυρίου
  choice: ஆண்டவரிடமிருந்து
  rationale: ἀπό + வேற்றுமை உருபு, கைம்மாறு வரும் மூலத்தைச் சுட்டுகிறது. கிறிஸ்துவைக் குறிக்கும் பட்டமாக κύριος என்பதற்கு ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀπολήμψεσθε
  choice: பெறுவீர்கள்
  rationale: எதிர்காலக் குறிப்பு வினை. திரும்பப் பெறுதல் என்ற நுண்பொருள் ‘கைம்மாறு’ என்பதன் மூலம் போதுமான அளவு வெளிப்படுகிறது.
- source_word: ἀνταπόδοσιν
  choice: கைம்மாறு
  rationale: செயலுக்குப் பதிலாகக் கிடைக்கும் பலன் அல்லது ஈடு என்ற பொருளை, நேர்மறையான இச்சூழலில் dignified modern Tamil-இல் இயல்பாகத் தருகிறது.
- source_word: τῆς κληρονομίας
  choice: உரிமைப்பேற்றின்
  rationale: κληρονομία என்பதன் வாரிசுரிமை சார்ந்த கருத்தை ‘உரிமைப்பேறு’ தெளிவாகக் காட்டுகிறது. கைம்மாறுக்கும் உரிமைப்பேற்றுக்கும் இடையிலான கிரேக்க வேற்றுமைத் தொடர்பை விரிவாக விளக்காமல் வைத்திருக்கிறது.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: ஆண்டவராகிய மேசியாவுக்கு
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையோடு வருவதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது; κύριος ‘ஆண்டவர்’ எனத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: δουλεύετε
  choice: பணியாற்றுகிறீர்கள்
  rationale: இது நிகழ்காலச் சுட்டுவினை, இரண்டாம் நபர் பன்மை. ஆகவே நேரடிக் கட்டளையாக அல்லாமல், அவர்கள் உண்மையில் யாருக்குப் பணியாற்றுகிறார்கள் என்பதை நினைவூட்டும் கூற்றாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστῷ என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சொற்றொடரில் Χριστός பெயரைப் போல மட்டும் அல்லாமல் அபிஷேகம் பெற்றவர் என்ற பட்டமாகச் செயல்படுகிறது. ஆகவே பட்டத்தின் பொருளை வெளிப்படுத்த ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: δουλεύετε என்பதன் வினைநிலை
  choice: 'சுட்டுவினை: ‘பணியாற்றுகிறீர்கள்’'
  alternative: 'கட்டளை: ‘பணியாற்றுங்கள்’'
  rationale: கிரேக்க வடிவம் நிகழ்காலச் சுட்டுவினை; கட்டளைவினை அல்ல. சூழல் அறிவுறுத்தலாக ஒலித்தாலும், மூல வடிவத்தின் இலக்கண வலிமை தக்கவைக்கப்பட்டுள்ளது.
- issue: ἀνταπόδοσιν τῆς κληρονομίας என்பதன் தொடர்பு
  choice: ‘உரிமைப்பேற்றின் கைம்மாறு’ என்ற சுருக்கமான வேற்றுமைத் தொடர்பு
  alternative: ‘உரிமைப்பேறாகிய கைம்மாறு’
  rationale: உரிமைப்பேறே கைம்மாறு என்று விளக்குவது சாத்தியம்; ஆனால் கிரேக்கத்தின் சுருக்கமான genitive தொடர்பை முழுமையாக ஒரே வகையில் தீர்மானிக்காமல் மொழிபெயர்ப்பு வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘உரிமைப்பேறு’ என்பது மதச்சார்பான பழைய ‘சுதந்தரம்’ என்பதைக் காட்டிலும் தெளிவானது. அடிமைச் சூழலை மிகையாகக் கடினப்படுத்தாமல் δουλεύετε என்பதற்கு ‘பணியாற்றுகிறீர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
