  terminology: ‘ஆண்டவர்,’ ‘மேசியா,’ ‘உரிமைப்பேறு,’ and ‘கைம்மாறு’ retain the draft’s respectful, source-oriented terminology. ‘மேசியா’ appropriately preserves the title sense of Χριστός; the alternative ‘கிறிஸ்து’ remains available in a footnote.
