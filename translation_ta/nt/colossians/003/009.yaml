  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: ta
  text: ஒருவருக்கொருவர் பொய் சொல்லாதீர்கள்; பழைய மனிதனை[b] அவனுடைய செயல்களோடு கழற்றிவிட்டதால்[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கழற்றிவிட்டு’ அல்லது ‘கழற்றிவிட்டவர்களாய்.’ கிரேக்கத்தில் இது பங்கேற்புவினை வடிவம்; இங்கு கட்டளைக்கான காரணத்தைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
