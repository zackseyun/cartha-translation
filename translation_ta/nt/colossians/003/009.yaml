    text: அல்லது, ‘பழைய சுயத்தை.’ ‘பழைய மனிதன்’ என்ற நேரடி மொழிபெயர்ப்பு அடுத்த வசனத்திலுள்ள ‘புதிய மனிதன்’ என்பதுடனான பவுலின் எதிரிணையைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: பொய் சொல்லாதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை வடிவத்தை இயல்பான தமிழ்த் தடையாகத் தருகிறது; இங்கு தொடர்ந்து நடந்துவரும் செயலை நிறுத்துமாறு வலியுறுத்த வேண்டிய கட்டாயம் இல்லை.
- source_word: εἰς ἀλλήλους
  choice: ஒருவரிடம் ஒருவர்
  rationale: பரஸ்பர உறவில் ஒருவருக்கொருவர் பொய் சொல்வதைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: ἀπεκδυσάμενοι
  choice: கழற்றிவிட்டதால்
  rationale: ஆடை கழற்றும் உருவகத்தையும் நிறைவுற்ற செயலையும் காக்கிறது; இச்செயல் கட்டளைக்கான காரணமாக அமைவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: பழைய மனிதனை
  rationale: அடுத்த வசனத்தின் ‘புதிய மனிதன்’ என்ற எதிரிணையுடன் உள்ள பவுலின் மனிதகுலம் சார்ந்த உருவகத் தொடர்பைக் காக்கிறது; ‘பழைய இயல்பு’ என்பது அதிக விளக்கமளிக்கும் மொழிபெயர்ப்பாகிவிடும்.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: அவனுடைய செயல்களோடு
  rationale: σύν என்பதன் உடனிணைவு பொருளையும், πρᾶξις என்பதன் நடத்தையில் வெளிப்படும் செயல்கள் என்ற பரந்த நெறிசார் பொருளையும் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: τὸν παλαιὸν ἄνθρωπον என்பதன் பொருள்
  choice: பழைய மனிதன்
  alternative: பழைய சுயம் / பழைய இயல்பு
  rationale: ஆதாமிய அல்லது பிரதிநிதித்துவ மனிதகுலம் பற்றிய சாத்தியமான ஒலிப்பையும் அடுத்த வசனத்தின் ‘புதிய மனிதன்’ என்ற எதிரிணையையும் மங்கச் செய்யாமல் மூல உருவகத்தைப் பாதுகாக்கிறது.
- issue: ἀπεκδυσάμενοι என்ற பங்கேற்புவினையின் தொடர்பு
  choice: காரணப் பொருளில் ‘கழற்றிவிட்டதால்’
  alternative: ‘கழற்றிவிட்டு’ என்ற உடனிகழ்வு அல்லது காலத் தொடர்பு
  rationale: சூழலில் விசுவாசிகளின் மாறிய நிலை இக்கட்டளைக்கு அடிப்படையாகத் தரப்படுவது சாத்தியமான முதன்மைப் பொருள்; ஆயினும் கிரேக்க வடிவத்தின் பிற தொடர்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில் நேரடியான, கண்ணியமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘கழற்றுதல்’ ஆடை உருவகத்தைத் தெளிவாக வைத்திருக்கிறது. வசனம் அடுத்த வசனத்துக்குத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
