id: COL.3.8
reference: Colossians 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: ta
  text: 'ஆனால் இப்போது நீங்களும் இவையெல்லாவற்றையும் களைந்துவிடுங்கள்: கோபம், சீற்றம், தீய மனப்பான்மை, அவதூறு, உங்கள் வாயிலிருந்து வரும் இழிவான பேச்சு.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: விட்டுவிடுங்கள்
  rationale: ஆடையைக் கழற்றி வைப்பதைப் போன்ற உருவகப் பொருளில், பட்டியலிடப்பட்ட தீய நடத்தைகளை முற்றிலும் கைவிட வேண்டும் என்ற கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὀργήν
  choice: கோபம்
  rationale: நிலைத்த அல்லது உள்ளார்ந்த கோபத்தைக் குறிக்கும் பொதுவான, தெளிவான தமிழ் சொல்.
- source_word: θυμόν
  choice: சீற்றம்
  rationale: ὀργή என்பதிலிருந்து வேறுபட்டு, வெடித்தெழும் கடும் சினத்தை உணர்த்துகிறது.
- source_word: κακίαν
  choice: தீமை
  rationale: தீய மனப்பான்மை அல்லது பிறருக்குத் தீங்கு நினைக்கும் குணம் ஆகிய பரப்பைத் திறந்தவாறு வைத்திருக்கிறது.
- source_word: βλασφημίαν
  choice: அவதூறு
  rationale: இச்சூழலில் மனிதர்களுக்கு எதிரான பழிதூற்றும் அல்லது இழிவுபடுத்தும் பேச்சைக் குறிக்க ஏற்றது; சொல்லை தேவதூஷணமாக மட்டும் சுருக்கவில்லை.
- source_word: αἰσχρολογίαν
  choice: ஆபாசப் பேச்சு
  rationale: இழிவான, வெட்கக்கேடான அல்லது அருவருப்பான பேச்சை சாதாரண வாசகருக்குத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: உங்கள் வாயிலிருந்து வரும்
  rationale: மூலத்தின் உடல் உறுப்பைக் குறிப்பிடும் சொல்லாட்சியைப் பேணிக்கொண்டே, தமிழில் பட்டியலின் இறுதி பேச்சுவகையுடன் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: βλασφημία என்பதன் இலக்கு
  choice: அவதூறு
  alternative: தேவதூஷணம்
  rationale: சுற்றியுள்ள மனித உறவுகளையும் வாய்மொழிப் பாவங்களையும் சார்ந்த பட்டியல் காரணமாக ‘அவதூறு’ பொருத்தமானது; கிரேக்கச் சொல் கொண்டிருக்கக்கூடிய பரந்த இழிவுபடுத்தும் பொருளையும் இது காக்கிறது.
- issue: ὀργή மற்றும் θυμός ஆகியவற்றின் வேறுபாடு
  choice: கோபம், சீற்றம்
  alternative: கோபம், கடுங்கோபம்
  rationale: இரண்டு கிரேக்கச் சொற்களையும் ஒன்றாக்காமல், பொதுவான கோபத்துக்கும் வெடித்தெழும் சினத்துக்கும் இடையிலான நுண்ணிய வேறுபாட்டைப் பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பன்மை மரியாதை/சபைமுழுவதையும் நோக்கும் கட்டளை நடையில் வடிவமைக்கப்பட்டது. மொழி எளிமையாகவும் கண்ணியமாகவும் உள்ளது; மூலத்தில் உள்ள தீய மனநிலைகளிலிருந்து தீய பேச்சுக்குச் செல்லும் பட்டியல் அமைப்பு பேணப்பட்டுள்ளது.
