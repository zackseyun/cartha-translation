revisions:
- from: 'ஆனால் இப்போது நீங்களும் இவை அனைத்தையும் விட்டுவிடுங்கள்: கோபம், சீற்றம், தீமை, அவதூறு, உங்கள் வாயிலிருந்து வரும் ஆபாசப் பேச்சு ஆகியவற்றை.'
  to: 'ஆனால் இப்போது நீங்களும் இவையெல்லாவற்றையும் களைந்துவிடுங்கள்: கோபம், சீற்றம், தீய மனப்பான்மை, அவதூறு, உங்கள் வாயிலிருந்து வரும் இழிவான பேச்சு.'
  rationale: The revision resolves the Tamil syntactic defect, retains the imperative force and comprehensive scope of τὰ πάντα, preserves the distinction between the two terms for anger, and uses wording for κακία and αἰσχρολογία that more closely reflects their contextual semantic range without imposing a doctrinal interpretation.
