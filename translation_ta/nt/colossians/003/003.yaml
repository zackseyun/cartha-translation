id: COL.3.3
reference: Colossians 3:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεθάνετε γάρ, καὶ ἡ ζωὴ ὑμῶν κέκρυπται σὺν τῷ Χριστῷ ἐν τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் இறந்துவிட்டீர்கள்; உங்கள் வாழ்வு மெசியாவுடன்[a] கடவுளில் மறைத்து வைக்கப்பட்டுள்ளது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவுடன்.” கிரேக்க மொழியிலுள்ள Χριστός என்ற பட்டத்தை “மெசியா” என்றும் “கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “மறைந்திருக்கிறது.” கிரேக்க நிறைவுக்காலம், முடிந்த ஒரு செயலால் ஏற்பட்டுத் தொடரும் தற்போதைய நிலையை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: நீங்கள் இறந்துவிட்டீர்கள்
  rationale: இறந்த செயலைக் குறிக்கும் இறந்தகால வினை; ‘விட்டீர்கள்’ என்பது விசுவாசிகளின் தீர்மானமான கடந்தகால மரணத்தை இயல்பான நவீனத் தமிழில் உணர்த்துகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: ἡ ζωὴ ὑμῶν
  choice: உங்கள் வாழ்வு
  rationale: ζωή என்பதற்கான இயல்பான தமிழ் வடிவம்; சூழலில் உள்ள இறையியல் பொருளை விளக்கமாகச் சேர்க்காமல் அசலின் சுருக்கத்தைப் பேணுகிறது.
- source_word: κέκρυπται
  choice: மறைத்து வைக்கப்பட்டுள்ளது
  rationale: நிறைவுற்ற செயலும் அதன் தொடரும் தற்போதைய நிலையும் உள்ள நிறைவுக்காலச் செயப்பாட்டு வடிவத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: σὺν τῷ Χριστῷ
  choice: மெசியாவுடன்
  rationale: σύν என்பதன் உடனிருப்பு/இணைவு வலிமையை ‘உடன்’ காக்கிறது; Χριστός இங்கு அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாக இருப்பதால் ‘மெசியா’ பயன்படுத்தப்படுகிறது.
- source_word: ἐν τῷ θεῷ
  choice: கடவுளில்
  rationale: ἐν குறிக்கும் இடம் அல்லது இருப்புத் தளத்தைப் பொழிப்புரையாக்காமல் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστῷ என்பதைப் பட்டமாகவா, பெயர்போன்ற வடிவமாகவா மொழிபெயர்ப்பது
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் Χριστός அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாகச் செயல்படுகிறது; ஆகவே அதன் பட்டப் பொருளைக் காக்க ‘மெசியா’ முதன்மை உரையில் இடம் பெறுகிறது.
- issue: κέκρυπται என்பதில் நிறைவுற்ற செயலை அல்லது தற்போதைய நிலையை முன்னிறுத்துவது
  choice: மறைத்து வைக்கப்பட்டுள்ளது
  alternative: மறைந்திருக்கிறது
  rationale: கிரேக்க நிறைவுக்காலச் செயப்பாட்டு வடிவம் கடந்த செயலும் அதனால் தொடரும் நிலையும் இரண்டையும் தாங்குகிறது; தேர்ந்த வடிவம் இரண்டையும் வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. காரண இணைப்பு, மரணத்தின் தீர்மானமான கடந்தகாலத் தன்மை, மறைக்கப்பட்ட வாழ்வின் தொடரும் நிலை, மெசியாவுடனான இணைவு, ‘கடவுளில்’ என்ற இருப்புத் தளம் ஆகியவை சுருக்கமாகப் பேணப்பட்டுள்ளன.
