  yaml_path: translation/nt/colossians/003/023.yaml
  text: Whatever you do[a], work from the soul, as for the Lord and not for men[c][b],
translation:
  language: ta
  text: நீங்கள் எதைச் செய்தாலும், மனிதர்களுக்காக[c] அல்ல, ஆண்டவருக்காக[b] செய்வதுபோல், முழு உள்ளத்தோடு[a] உழையுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனப்பூர்வமாக’ அல்லது ‘முழு மனதோடு’ என்றும் மொழிபெயர்க்கலாம்; சொல்லுக்குச் சொல், ‘ஆத்துமாவிலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: இந்த வீட்டு வேலைவிதிகளின் சூழலில் ‘ஆண்டவர்’ என்ற சொல்லில் ‘எஜமான்’ என்ற நிழற்பொருளும் இருக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: கிரேக்கச் சொல் இங்கு ஆண்களை மட்டும் அல்ல, மனிதர்களைப் பொதுவாகக் குறிக்கிறது; மனிதர்களை ஆண்டவருடன் ஒப்பிட்டு வேறுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: நீங்கள் எதைச் செய்தாலும்
  rationale: ἐάν உடன் வரும் தொடர்புப்பெயர் பொதுவான, வரையறுக்கப்படாத பொருளைச் சுட்டுகிறது. ‘நீங்கள் எதைச் செய்தாலும்’ என்பது அந்த விரிவையும் இயல்பான தமிழ்நடையையும் காக்கிறது.
- source_word: ἐκ ψυχῆς
  choice: முழு உள்ளத்தோடு
  rationale: சொல்லுக்குச் சொல் என்றால் ‘ஆத்துமாவிலிருந்து.’ இங்கு அந்தச் சொற்றொடர் உள்ளார்ந்த மனப்பூர்வத்தையும் முழுமையான ஈடுபாட்டையும் குறிக்கிறது. ‘முழு உள்ளத்தோடு’ என்பது நவீன தமிழில் இயல்பாகவும் மரியாதையான நடையிலும் அதைப் புரியவைக்கிறது; மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐργάζεσθε
  choice: உழையுங்கள்
  rationale: இது தொடர்ந்து முனைப்புடன் செயல்படும்படி கூறும் கட்டளை. வீட்டு வேலைவிதிகளின் சூழலில் ‘உழையுங்கள்’ என்பது முயற்சியுடன் வேலை செய்வதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὡς
  choice: செய்வதுபோல்
  rationale: செயலின் நோக்குநிலையையும் முறையையும் ஒப்புமையாக அறிமுகப்படுத்துகிறது. ஆண்டவருக்காகவே செய்கிறவர்களைப் போல உழைக்க வேண்டும் என்ற கருத்தை இது இயல்பான தமிழில் தருகிறது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவருக்காக
  rationale: κύριος என்பதன் முதன்மையான கிறிஸ்தவ பட்டப்பெயரை ‘ஆண்டவர்’ காக்கிறது. நான்காம் வேற்றுமை இங்கு செயல் யாருக்காகச் செய்யப்படுகிறது என்பதைத் தெரிவிக்கிறது.
- source_word: ἀνθρώποις
  choice: மனிதர்களுக்காக
  rationale: ἄνθρωποι என்பது இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களை பொதுவாகக் குறிக்கிறது; ஆண்டவருடன் மனிதர்களை எதிர்நிறுத்துகிறது. ஆகவே பாலின வரம்பில்லாத ‘மனிதர்கள்’ துல்லியமானது.
theological_decisions:
- issue: வீட்டு வேலைவிதிகளின் சூழலில் κύριος என்பதன் பொருள்
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: உடனடியான சூழல் அடிமைகளையும் எஜமான்களையும் பற்றியதாக இருந்தாலும், இவ்வசனத்தில் κύριος உயர்த்தப்பட்ட கிறிஸ்துவைக் குறிக்கும் பட்டப்பெயராக இயல்பாகப் புரிகிறது. அதேவேளையில் ‘எஜமான்’ என்ற சூழல்சார் நிழற்பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முழு உள்ளத்தோடு’ இயல்பான தமிழை முன்னிறுத்துகிறது; ψυχή என்பதன் நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. மூலத்தின் ஆண்டவர்–மனிதர்கள் எதிர்நிலை வாக்கிய அமைப்பில் தெளிவாக வைக்கப்பட்டுள்ளது.
