review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies δοῦλοι as enslaved persons, retains the scope of κατὰ πάντα, distinguishes the human masters from the Lord, and preserves the Lord-fearing motivation. A small revision makes the negated ‘eye-service’ phrase more explicitly a manner of obedience rather than sounding as though work itself is forbidden.
  naturalness: The wording is generally clear modern Tamil. ‘அவர்கள் பார்க்கும்போது மட்டும் வேலை செய்யாமல்’ is understandable, but ‘கண்காணிக்கும்போது மட்டும் பணிசெய்வதைத் தவிர்த்து’ more naturally conveys work performed merely under observation. ‘மனிதரை மகிழ்விப்பவர்களைப்போல்’ is retained as a natural equivalent of ‘people-pleasers.’
  terminology: ‘அடிமைகள்,’ ‘எஜமானர்கள்,’ ‘மாம்சத்தின்படி,’ and ‘ஆண்டவர்’ appropriately preserve the historical setting, Pauline wording, and the contrast between human masters and the Lord. ‘நேர்மையான உள்ளத்தோடு’ suitably renders ἁπλότητι καρδίας in this context.
  issues:
  - severity: low
    issue: The Tamil negative phrase can be read as a prohibition against working when the masters are present.
    rationale: 'Greek μὴ ἐν ὀφθαλμοδουλίαις qualifies the manner of obedience: it prohibits service done merely for appearances under observation. Recasting it as ‘not merely when being watched’ makes this relation explicit.'
