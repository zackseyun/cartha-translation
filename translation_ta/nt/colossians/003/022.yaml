source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: ta
  text: அடிமைகளே[a], மாம்சத்தின்படி உங்கள் எஜமானர்களுக்கு[b] எல்லாவற்றிலும் கீழ்ப்படியுங்கள். மனிதரை மகிழ்விப்பவர்களைப்போல், அவர்கள் கண்காணிக்கும்போது மட்டும் பணிசெய்வதைத் தவிர்த்து[c], ஆண்டவருக்குப் பயந்து, நேர்மையான உள்ளத்தோடு கீழ்ப்படியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“அடிமைகள்” (கிரேக்கம்: δοῦλοι) என்பதை “பணியாளர்கள்” அல்லது “கட்டுண்ட பணியாளர்கள்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் இச்சொல் பொதுவாக ஓர் எஜமானரின் அதிகாரத்தின்கீழ் அடிமைப்படுத்தப்பட்ட ஒருவரைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: “மாம்சத்தின்படி” என்பதை “இவ்வுலகில்” என்றும் புரிந்துகொள்ளலாம்; இந்த எஜமானர்களின் அதிகாரம் இவ்வுலக மனித உறவுகளுக்குள் வரம்புடையது என்பதை இச்சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அவர்கள் கண்காணிக்கும்போது மட்டும் பணிசெய்வது என்பது, கண்காணிக்கப்படுகிற நேரத்தில் மாத்திரம் நன்றாக உழைப்பதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: அடிமைகளே
  rationale: இந்த வீட்டுக்குடும்ப அறிவுரைச் சூழலில் δοῦλοι என்பது எஜமானரின் அதிகாரத்தின்கீழ் அடிமைப்படுத்தப்பட்டவர்களைக் குறிக்கிறது; ‘வேலையாட்கள்’ என்பது அந்தச் சமூக நிலையைத் தேவையின்றி மென்மையாக்கிவிடும்.
- source_word: ὑπακούετε κατὰ πάντα
  choice: எல்லாவற்றிலும் கீழ்ப்படியுங்கள்
  rationale: கட்டளை வடிவத்தையும் κατὰ πάντα என்பதன் விரிவான எல்லையையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: மாம்சத்தின்படி உங்கள் எஜமானர்களாக இருப்பவர்களுக்கு
  rationale: மனித எஜமானர்களுக்கும் பின்னர் வரும் தெய்வீகத் தலைப்பான ‘ஆண்டவர்’ என்பதற்கும் உள்ள வேறுபாட்டைத் தெளிவாக்கி, κατὰ σάρκα என்ற பவுலின் திட்டமிட்ட சொல்லாட்சியையும் பாதுகாக்கிறது.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: அவர்கள் பார்க்கும்போது மட்டும் வேலை செய்யாமல்
  rationale: கண்காணிக்கப்படும்போது மட்டுமே செய்யப்படும் சேவையைக் குறிக்கும் அரிய கூட்டுச்சொல்லின் பொருளை, செயற்கையான சொற்பெயர்ப்பின்றி நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: மனிதர்களை மகிழ்விப்பவர்களைப்போல்
  rationale: மனிதர்களின் அங்கீகாரத்தையே நாடும் இழிவான நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν ἁπλότητι καρδίας
  choice: நேர்மையான உள்ளத்தோடு
  rationale: ἁπλότης இங்கு அறிவுசார் எளிமையையல்ல, கபடமற்ற ஒருமுகமான நேர்மையைக் குறிக்கிறது.
- source_word: φοβούμενοι τὸν κύριον
  choice: ஆண்டவருக்குப் பயந்து
  rationale: ஆண்டவரைக் குறித்த வேதாகமப் ‘பயம்’ என்ற கருத்தை ‘மதித்து’ என்று மென்மையாக்காமல், பங்கேற்புவினையின் உந்துதல்/முறை சார்ந்த வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: அடிமைத்தனச் சூழலில் வழங்கப்படும் ஒழுக்க அறிவுரை
  choice: ‘அடிமைகள்—எஜமானர்கள்’ என்ற வரலாற்றுச் சமூக உண்மையை வெளிப்படையாக மொழிபெயர்த்து, மனித எஜமானர்களுக்கும் ஆண்டவருக்கும் உள்ள வேறுபாட்டைத் தக்கவைத்தல்
  alternative: நவீன வேலைவாய்ப்பு உறவாகத் தோன்றுமாறு ‘வேலையாட்கள்—முதலாளிகள்’ என்று மென்மையாக்குதல்
  rationale: கிரேக்கச் சொற்கள் பண்டைய அடிமைத்தன அமைப்பைச் சுட்டுகின்றன. அதை வேலைவாய்ப்பாக மாற்றுவது மூலவசனத்திலுள்ள வரலாற்று மற்றும் ஒழுக்கப் பதற்றத்தை மறைத்துவிடும்; இவ்வசனத்தை மொழிபெயர்ப்பது அந்த அமைப்பை ஆதரிப்பதாகவும் மாற்றப்படவில்லை.
- issue: κατὰ σάρκα என்பதன் வரம்பு
  choice: ‘மாம்சத்தின்படி’ என்று உரையில் தக்கவைத்து, அது இவ்வுலக மனித உறவின் வரம்பைக் குறிக்கலாம் என்று அடிக்குறிப்பில் விளக்குதல்
  alternative: உரையிலேயே ‘இவ்வுலக எஜமானர்கள்’ என்று முழுமையாக விளக்கிப் பெயர்த்தல்
  rationale: ‘மாம்சம்’ என்ற பவுலின் சொல்லையும் மனித அதிகாரம் இறுதியானது அல்ல என்ற உட்குறிப்பையும் தக்கவைத்து, அதன் பொருளை அடிக்குறிப்பு மூலம் வாசகருக்குத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதையும் நேரடியான கட்டளைத் தொனியும் காக்கப்பட்டுள்ளன. ‘அடிமைகள்’ என்ற வரலாற்றுத் துல்லியமான சொல் மென்மையாக்கப்படவில்லை; ‘மாம்சத்தின்படி’ என்ற மூலமொழியின் உண்மையான தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது. இரண்டாவது ‘கீழ்ப்படியுங்கள்’ தமிழில் எதிர்மறை/நேர்மறை மாறுபாட்டை இயல்பாக நிறைவு செய்ய மீளுரைக்கப்பட்டுள்ளது.
