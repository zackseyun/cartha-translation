revisions:
- from: அங்கே கிரேக்கன் என்றும் யூதன் என்றும், விருத்தசேதனம் என்றும் விருத்தசேதனமின்மை என்றும், அந்நிய மொழியினன் என்றும், சித்தியன் என்றும், அடிமை என்றும், விடுதலை பெற்றவன் என்றும் வேறுபாடு இல்லை; மாறாக, மெசியாவே எல்லாம், எல்லாரிலும் இருக்கிறார்.[a][b]
  to: அங்கே கிரேக்கன், யூதன், விருத்தசேதனம், விருத்தசேதனமின்மை, அந்நிய மொழி பேசுபவன், ஸ்கித்தியன், அடிமை, சுதந்திரமானவன் என்ற வேறுபாடு இல்லை; மாறாக, மெசியாவே எல்லாம்; அவர் அனைத்திலும் இருக்கிறார்.[a][b]
  rationale: The revision preserves the verse’s social-identity list and strong contrast while making the Tamil list more readable. It avoids implying that every free person was formerly enslaved and restores the deliberate openness of ἐν πᾶσιν in the main text, with the personal contextual reading retained in a footnote.
