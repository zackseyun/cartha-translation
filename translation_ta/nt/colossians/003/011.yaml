  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: ta
  text: அங்கே கிரேக்கன், யூதன், விருத்தசேதனம், விருத்தசேதனமின்மை, அந்நிய மொழி பேசுபவன், ஸ்கித்தியன், அடிமை, சுதந்திரமானவன் என்ற வேறுபாடு இல்லை; மாறாக, மெசியாவே எல்லாம்; அவர் அனைத்திலும் இருக்கிறார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அனைத்திலும்” என்பதற்கு, “அனைவரிலும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் சுருக்கமானது; சூழலில் புதுப்பிக்கப்பட்ட சமூகத்தின் உறுப்பினர்கள் குறிக்கப்படுவது இயல்பாகத் தோன்றுகிறது.
    reason: alternative_reading
  - marker: b
    text: 'கிரேக்கம்: “கிறிஸ்தோஸ்”; இங்கே பட்டத்தின் பொருளை வெளிப்படுத்த “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது. மரபாக, “கிறிஸ்து.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου οὐκ ἔνι
  choice: அங்கே ... வேறுபாடு இல்லை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட புதுப்பிக்கப்பட்ட மனித சமுதாயத்தின் சூழலைச் சுட்டுகிறது. பட்டியலிடப்படும் அடையாளங்கள் முற்றிலும் இல்லாதவை என்று அல்லாமல், அவை தீர்மானிக்கும் வேறுபாடாக நிலவுவதில்லை என்பதைக் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: கிரேக்கன் என்றும் யூதன் என்றும்
  rationale: Ἕλλην என்பதை பொதுவான ‘புறவினத்தான்’ என்று விரிவாக்காமல், மூலத்தின் குறிப்பிட்ட இன-பண்பாட்டு இணையைப் பாதுகாக்கிறது.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: விருத்தசேதனம் என்றும் விருத்தசேதனமின்மை என்றும்
  rationale: சமய மற்றும் உடன்படிக்கை அடையாளங்களாகப் பயன்படுத்தப்பட்டுள்ள மூலத்தின் கருத்துப்பெயர்களைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: βάρβαρος
  choice: அந்நிய மொழியினன்
  rationale: கிரேக்க மொழி பேசாதவரைக் குறித்த பண்டைய பண்பாட்டு சொல்லின் சூழல்பொருளைத் தருகிறது; நவீன தமிழில் ‘காட்டுமிராண்டி’ என மொழிபெயர்ப்பதால் ஏற்படும் தவறான கொடுமைச் சாயலைத் தவிர்க்கிறது.
- source_word: Σκύθης
  choice: சித்தியன்
  rationale: குறிப்பிட்ட பண்டைய இனப்பெயரை தமிழில் ஒலிபெயர்க்கிறது.
- source_word: δοῦλος, ἐλεύθερος
  choice: அடிமை, விடுதலை பெற்றவன்
  rationale: சமூக-சட்ட நிலையின் நேரடியான எதிர்மறையைத் தெளிவாக வெளிப்படுத்துகிறது; δοῦλος என்பதன் கட்டுப்பட்ட நிலையை ‘வேலைக்காரன்’ என மென்மையாக்கவில்லை.
- source_word: τὰ πάντα
  choice: எல்லாம்
  rationale: மெசியாவின் முழுமையான முக்கியத்துவத்தைச் சுருக்கமாகக் கூறுகிறது; மூலத்தில் இல்லாத மேற்பொருளியல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐν πᾶσιν
  choice: எல்லாரிலும்
  rationale: உடனடி சூழலில் புதுப்பிக்கப்பட்ட சமூகத்தின் பல்வேறு உறுப்பினர்கள் குறிக்கப்படுவதால் தனிநபர் சார்ந்த பொருள் இயல்பானது; கிரேக்கச் சொற்றொடரின் விரிவான சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Χριστός
  choice: மெசியா
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் அதன் பொருளைத் தமிழில் வழங்குகிறது; ‘கிறிஸ்து’ என்பது மரபான மாற்று என அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ἐν πᾶσιν என்பதன் வரம்பு
  choice: எல்லாரிலும்
  alternative: அனைத்திலும்
  rationale: உடனடி சூழல் இன, சமய, பண்பாட்டு மற்றும் சமூக வேறுபாடுகளைக் கொண்ட புதுப்பிக்கப்பட்ட மக்களைப் பற்றியது. எனினும், கிரேக்கம் சுருக்கமாகவும் இலக்கணரீதியாக விரிவாகவும் இருப்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு பட்டத்தின் பொருளை வெளிப்படுத்த ‘மெசியா’ பயன்படுத்தப்படுகிறது; பரவலாக அறியப்பட்ட பாரம்பரிய ஒலிபெயர்ப்பு அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: அடையாள வேறுபாடுகள் ‘இல்லை’ என்பதன் பொருள்
  choice: வேறுபாடு இல்லை
  alternative: இவர்கள் எவரும் இல்லை
  rationale: பவுல் அந்த மக்களின் இருப்பை மறுப்பதில்லை; புதிய மனிதனுக்குள் அந்த அடையாளங்கள் தீர்மானிக்கும் பிரிவினை நிலவாது என்பதே சூழல்பொருள். இதைச் சொல்லும்போது வசனத்தின் வலுவான மறுப்பு தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிதான நடை. பட்டியலின் இணை அமைப்பு ‘என்றும்’ என்பதால் தெளிவாக்கப்பட்டுள்ளது. ‘விருத்தசேதனம்’ போன்ற நிறுவப்பட்ட வேதாகமச் சொல் பாதுகாக்கப்பட்டாலும், βάρβαρος இன்றைய அவமதிப்புச் சாயலைத் தவிர்க்க சூழலுக்கு ஏற்றவாறு மொழிபெயர்க்கப்பட்டுள்ளது.
