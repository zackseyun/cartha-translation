  source_fidelity: மூலக் கிரேக்கத்தின் அழைப்புமுறை, கணவர்-மனைவி உறவுசார் பொருள், நிகழ்காலக் கட்டளை, மற்றும் ἐν κυρίῳ உடனான தகுதிக் குறிப்பு ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘கீழ்ப்பட்டு இருங்கள்’ என்பது ὑποτάσσεσθε என்பதன் கட்டளை மற்றும் தொடர்நிலை உணர்வைச் சரியாகத் தருகிறது; ‘இது ஆண்டவருக்குள் தகுந்ததாக இருக்கிறது’ என்பது ὡς ἀνῆκεν ἐν κυρίῳ என்பதைக் கூடுதல் விளக்கமின்றி நன்றாக வெளிப்படுத்துகிறது.
