  text: Αἱ γυναῖκες, ὑποτάσσεσθε ⸀τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: ta
  text: மனைவிகளே, உங்கள் கணவர்களுக்குக் கீழ்ப்பட்டு இருங்கள்[a]; இது ஆண்டவருக்குள் தகுந்ததாக இருக்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களை உங்கள் கணவர்களுக்குக் கீழ்ப்படுத்திக்கொள்ளுங்கள்’ எனவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆண்டவருக்குள் தகுந்ததாக இருந்தது’ எனவும் மொழிபெயர்க்கலாம்; கிரேக்க வினை வடிவம் இறந்தகாலமாக இருந்தாலும், இச்சூழலில் அது பொதுவான நிகழ்காலப் பொருளைக் கொண்டிருக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: மனைவிகளே
  rationale: இல்லற உறவுகளைக் குறித்த சூழலில், ἀνδράσιν என்பதோடு இணைந்து வருவதால், இது பொதுவாகப் பெண்களை அல்ல, மனைவிகளைக் குறிக்கிறது. அழைப்புமுறை தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ὑποτάσσεσθε
  choice: கீழ்ப்பட்டு இருங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவம் தொடர்ந்த மனப்பூர்வமான கீழ்ப்படிதலைக் குறிக்கிறது. ‘கீழ்ப்பட்டு இருங்கள்’ என்பது வலுக்கட்டாயமாகக் கீழ்ப்படுத்தப்படுதல் என்ற பொருளைத் தவிர்த்து, கிரேக்கச் சொல்லின் உறவுசார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀνδράσιν
  choice: உங்கள் கணவர்களுக்கு
  rationale: இல்லற அறிவுரையின் சூழலில் ἀνήρ என்பது ‘ஆண்’ என்பதைவிட ‘கணவர்’ என்பதைக் குறிக்கிறது. உறவைக் காட்ட ‘உங்கள்’ என்பது தமிழில் இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ὡς
  choice: இது … தகுந்ததாக
  rationale: ὡς இங்கு காரணத்தைக் காட்டாமல், அறிவுரைக்குரிய தகுதி அல்லது அளவுகோலை அறிமுகப்படுத்துகிறது. தனி வாக்கிய அமைப்பு அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀνῆκεν
  choice: தகுந்ததாக இருக்கிறது
  rationale: இது இலக்கண வடிவில் இறந்தகாலத் தோற்றமுடையதாக இருந்தாலும், இவ்வறிவுரைச் சூழலில் பொதுவான நிகழ்காலப் பொருளைக் கொண்ட மரபுவழிப் பயன்பாடாகப் புரிந்துகொள்ளப்படுகிறது. ‘தகுந்ததாக இருக்கிறது’ என்பது ஒழுக்கத் தகுதியை மிகைப்படுத்தாமல் தருகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: இந்தச் சொற்றொடர் அறிவுரையின் தகுதியை ஆண்டவருடனான உறவுக்குள் நிலைநிறுத்துகிறது. ‘ஆண்டவருக்குள்’ என்பது அதன் செறிவையும் இறையியல் வரம்பையும் காக்கிறது.
theological_decisions:
- issue: அறிவுரையின் வரம்பும் அடிப்படையும்
  choice: ‘இது ஆண்டவருக்குள் தகுந்ததாக இருக்கிறது’ என்று மொழிபெயர்த்து, அறிவுரை ஆண்டவருடனான உறவால் வரையறுக்கப்படுவதைப் பாதுகாத்தல்
  alternative: எந்த இறையியல் வரம்புமற்ற பொதுவான சமூக விதியாக மொழிபெயர்த்தல்; அல்லது ‘ஆண்டவருக்குள்’ என்பதை மனைவிகளை மட்டும் விளக்கும் தொடராக எடுத்தல்
  rationale: கிரேக்கத்தில் ἐν κυρίῳ என்பது தகுந்திருப்பதைக் கூறும் பகுதிக்குச் சேர்ந்துள்ளது. மொழிபெயர்ப்பு இதை விரிவான விளக்கமாக மாற்றாமல் பாதுகாக்கிறது; இதனால் வசனத்தில் உள்ள இறையியல் வரையறையும் பதற்றமும் நிலைக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான இல்லற அறிவுரையாக வடிவமைக்கப்பட்டுள்ளது. ‘கீழ்ப்பட்டு இருங்கள்’ என்பது புரிந்துகொள்ள எளிதாக இருந்தாலும், வலுக்கட்டாயத்தைக் குறிக்காத வகையில் தேர்ந்தெடுக்கப்பட்டது. ‘ஆண்டவருக்குள்’ என்ற சொற்றொடர் சுருக்கப்படாமல் வைக்கப்பட்டுள்ளது.
