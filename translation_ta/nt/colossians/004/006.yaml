source:
  edition: SBLGNT
  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: ta
  text: உங்கள் பேச்சு எப்போதும் அருளோடு[a], உப்பால் சுவையூட்டப்பட்டதாக[b] இருக்கட்டும்; ஒவ்வொருவருக்கும் எவ்வாறு பதிலளிக்க வேண்டும் என்பதை நீங்கள் அறியும்படி இருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கனிவானதாக.’ ‘அருளோடு’ என்பது கனிவு, தயவு, அல்லது நல்விருப்பத்தால் பண்புபெற்ற பேச்சைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உப்பால் சுவையூட்டப்பட்டதாக’ என்பது சுவையற்றதோ கேடு விளைவிப்பதோ அல்லாமல், சூழலுக்குப் பொருத்தமான, ஈர்ப்புள்ள, ஞானமான பேச்சைக் குறிக்கும் உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: λόγος
  choice: பேச்சு
  rationale: அறிவுரைச் சூழலில் இது ஒரு தனிப்பட்ட ‘சொல்’ அல்லது முறையான ‘செய்தி’ என்பதைக் காட்டிலும், விசுவாசிகளின் பேசும் முறையைக் குறிக்கிறது.
- source_word: ἐν χάριτι
  choice: அருள்நிறைந்ததாக
  rationale: பேச்சு கனிவும் தயவும் நல்விருப்பும் கொண்டதாக இருக்க வேண்டும் என்ற இயல்பான பொருளைத் தருகிறது; அதேவேளையில் χάρις என்பதன் விரிந்த ‘அருள்’ நயத்தையும் காக்கிறது.
- source_word: ἅλατι ἠρτυμένος
  choice: உப்பால் சுவையூட்டப்பட்டதாக
  rationale: பேச்சு பொருத்தமானதாகவும் ஈர்ப்புள்ளதாகவும் ஞானமுள்ளதாகவும் இருக்க வேண்டும் என்பதைக் குறிக்கும் மூல உருவகத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: εἰδέναι
  choice: அப்போது ... அறிந்திருப்பீர்கள்
  rationale: முன்னுள்ள அறிவுரையோடு தொடர்புடைய நோக்கம் அல்லது விளைவு என்ற இரு சாத்தியங்களையும் அளவுக்கு மீறித் தீர்மானிக்காமல், தமிழில் தெளிவான தொடர்பை உருவாக்குகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: சூழலுக்கு ஏற்ற கடமை அல்லது தகுதியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἑνὶ ἑκάστῳ
  choice: ஒவ்வொருவருக்கும்
  rationale: ஒவ்வொரு தனிநபருக்கும் பொருத்தமாகப் பதிலளிக்க வேண்டிய பகிர்ந்தளிக்கும் வலியுறுத்தலைக் காக்கிறது.
- source_word: ἀποκρίνεσθαι
  choice: பதிலளிக்க
  rationale: உரையாடல் சூழலில் ஒருவருக்குப் பதில் கூறுவதை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: காலத்தைச் சுட்டும் சொல்லின் முழுமையான பரப்பை நேரடியாகக் காக்கிறது.
