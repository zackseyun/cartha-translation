source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: ta
  text: அன்புக்குரிய சகோதரரும் உண்மையுள்ள ஊழியரும் ஆண்டவருக்குள் சக அடிமையுமான தீகிக்கு, என்னைப் பற்றிய எல்லாவற்றையும்[a] உங்களுக்கு அறிவிப்பார். அவர் உண்மையுள்ள ஊழியர்[b] மற்றும் சக அடிமை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைச் சார்ந்த காரியங்கள் அனைத்தையும்” அல்லது “என் நிலைமையை முழுவதுமாக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உண்மையுள்ள பணியாளர்.” கிரேக்கச் சொல்லான διάκονος என்பது ‘ஊழியர்,’ ‘பணியாளர்’ என்றும், சில சூழல்களில் திருச்சபையின் ஒரு குறிப்பிட்ட பணிப்பொறுப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “சக பணியாளர்” அல்லது “உடன் அடிமை.” கிரேக்கச் சொல்லான σύνδουλος, ஒரே எஜமானுக்குக் கீழ் பகிர்ந்துகொள்ளும் அடிமைச் சேவைநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: என்னைப் பற்றிய எல்லாவற்றையும்
  rationale: இந்தக் கிரேக்க மரபுத்தொடர் பவுலைப் பற்றிய செய்திகள், அவரது நிலைமை, செயல்பாடுகள் ஆகிய அனைத்தையும் பரந்த முறையில் குறிக்கிறது. ஒரு குறிப்பிட்ட பொருளுக்குள் இதைச் சுருக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: γνωρίσει ὑμῖν
  choice: உங்களுக்கு அறிவிப்பார்
  rationale: γνωρίζω என்பதன் எதிர்கால வடிவம் ‘தெரியப்படுத்துவார்’ அல்லது ‘அறிவிப்பார்’ என்று பொருள்படும். ‘அறிவிப்பார்’ என்பது இயல்பாகவும் மூலத்தின் கருத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: Τυχικὸς
  choice: தீகிக்கு
  rationale: தனிப்பெயர் நவீனத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபின்படி தரப்பட்டுள்ளது.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: அன்புக்குரிய சகோதரர்
  rationale: ἀγαπητός என்பதிலுள்ள பாசத்தையும் மதிப்பையும் ‘அன்புக்குரிய’ வெளிப்படுத்துகிறது; இங்கு ἀδελφός தீகிக்கு என்ற ஆணைக் குறிப்பதால் ‘சகோதரர்’ பொருத்தமானது.
- source_word: πιστὸς διάκονος
  choice: உண்மையுள்ள ஊழியர்
  rationale: πιστός இங்கு நம்பிக்கைக்குரிய அல்லது உண்மையுள்ள தன்மையைக் குறிக்கிறது. διάκονος பொதுவான பணியாளர் அல்லது ஊழியரைக் குறிக்கலாம்; இச்சூழலில் குறிப்பிட்ட திருச்சபைப் பதவி தெளிவாக இல்லாததால் ‘ஊழியர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: σύνδουλος
  choice: சக அடிமை
  rationale: σύνδουλος என்பது ஒரே எஜமானுக்குக் கீழ் அடிமைநிலையில் சேவை செய்வதைப் பகிர்ந்துகொள்பவரைக் குறிக்கிறது. ‘சக அடிமை’ அந்தப் பிணைக்கப்பட்ட சேவைநிலையை மறைக்காமல் சுருக்கமாகத் தருகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் வழக்கமான இச்சொற்றொடர் ஆண்டவரோடுள்ள உறவையும் அதற்குள் அமைந்த சேவைச் சூழலையும் குறிக்கிறது. இறையியல் நுட்பத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: σύνδουλος / δοῦλος சார்ந்த அடிமை மொழியின் மொழிபெயர்ப்பு
  choice: சக அடிமை
  alternative: சக பணியாளர்; உடன் அடிமை
  rationale: தீகிக்கு ஆண்டவருக்குச் சொந்தமான சேவைநிலையைப் பவுலோடு பகிர்கிறார் என்ற சொல்லின் வலிமையை ‘சக அடிமை’ பாதுகாக்கிறது. நவீன வாசகர்கள் ‘அடிமை’ என்பதோடு இணைக்கக்கூடிய எல்லா வரலாற்றுச் சார்புகளையும் கிரேக்கச் சொல் அவசியமாக முன்வைக்காது என்பதால் மென்மையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν κυρίῳ எந்தப் பாராட்டுச் சொற்களுடன் தொடர்புடையது
  choice: மூன்று பாராட்டுகளையும் உள்ளடக்கக்கூடிய வகையில் ‘ஆண்டவருக்குள்’ என்பதை அவற்றுக்கு முன் அமைத்தல்
  alternative: ‘சக அடிமை’ என்பதோடு மட்டும் நேரடியாக இணைத்தல்
  rationale: வாக்கிய இறுதியில் வரும் ἐν κυρίῳ அருகிலுள்ள σύνδουλος உடன் நெருக்கமாக இருந்தாலும், இணைக்கப்பட்ட பாராட்டுகள் அனைத்திற்கும் உரிய உறவுச் சூழலைக் குறிக்கக்கூடும். தமிழ் அமைப்பு அந்தப் பரந்த தொடர்பை அனுமதிக்கிறது; அதை ஒரு பட்டத்துக்கு மட்டும் கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஊழியர்’ தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் புரிந்துகொள்ளத்தக்கது; ஆனால் அதை ஒரு குறிப்பிட்ட திருச்சபைப் பதவியாக நிர்ணயிக்கவில்லை. ‘சக அடிமை’ சற்றுக் கடினமாக ஒலித்தாலும், மூலச் சொல்லின் பிணைக்கப்பட்ட சேவைநிலையைத் தெளிவாகப் பாதுகாக்கிறது.
