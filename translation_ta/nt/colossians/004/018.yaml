source:
  edition: SBLGNT
  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: ta
  text: இந்த வாழ்த்து என் சொந்தக் கையால் எழுதப்பட்டது—பவுல்[a]. என் சங்கிலிகளை நினைவில் கொள்ளுங்கள்[b]. அருள் உங்களோடு இருப்பதாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இறுதி வாழ்த்து.’ கிரேக்கச் சொல், கடிதத்தின் முடிவில் பவுல் தாமே தம் சொந்தக் கையால் எழுதிய வாழ்த்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் சிறைவாசத்தை’ அல்லது ‘என் கட்டுகளை.’ சொல்லர்த்தமாக, ‘என் சங்கிலிகளை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: வாழ்த்து
  rationale: கடிதத்தின் இறுதியில் பவுல் தாமே எழுதும் நிறைவு வாழ்த்தைக் குறிக்கிறது. ‘வாழ்த்து’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: பவுலாகிய நான் என் கைப்பட எழுதும்
  rationale: கிரேக்கத்தில் உள்ள சுருக்கமான பெயர்ச்சொல் தொடரைத் தமிழில் இயல்பான வாக்கியமாக்கி, இந்த இறுதி வாழ்த்து பவுலின் சொந்தக் கையெழுத்தில் இருப்பதைப் பாதுகாக்கிறது.
- source_word: μνημονεύετέ
  choice: நினைவில் கொள்ளுங்கள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ந்து நினைவுகூரும் நுணுக்கத்தைத் தரக்கூடும்; ‘நினைவில் கொள்ளுங்கள்’ அந்த வேண்டுகோளை இயல்பான தமிழில் போதுமான அளவு வெளிப்படுத்துகிறது.
- source_word: μου τῶν δεσμῶν
  choice: என் சங்கிலிகளை
  rationale: δεσμοί என்பதன் நேரடியான, காட்சிமிக்க பொருள் ‘சங்கிலிகள்’; இது சிறைவாசத்தைக் குறிக்கும் உருவகப் பயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: ἡ χάρις
  choice: அருள்
  rationale: பவுலின் வழக்கமான நிறைவு ஆசியில் வரும் χάρις என்பதற்கு ‘அருள்’ இயல்பான வேதாகமத் தமிழாகும்; மூலத்தில் வெளிப்படையாக இல்லாத உரிமையைக் காட்டும் சொல்லைச் சேர்க்கவில்லை.
- source_word: μεθ’ ὑμῶν
  choice: உங்களோடு இருப்பதாக
  rationale: வினைச்சொல் இல்லாத கிரேக்க ஆசியைத் தமிழில் இயல்பான வாழ்த்தாக வெளிப்படுத்த ‘இருப்பதாக’ சேர்க்கப்பட்டுள்ளது; μετάவின் ‘உடன்’ என்ற பொருள் ‘உங்களோடு’ என்பதில் நிலைக்கிறது.
theological_decisions:
- issue: வினைச்சொல் வெளிப்படையாக இல்லாத பவுலின் நிறைவு ஆசி
  choice: அருள் உங்களோடு இருப்பதாக
  alternative: அருள் உங்களோடு
  rationale: கிரேக்கத்தில் வினைச்சொல் இல்லை. ஆயினும் தமிழில் முழுமையான, இயல்பான ஆசியாக அமைய ‘இருப்பதாக’ வழங்கப்படுகிறது; இதனால் புதிய இறையியல் கருத்து எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் கைப்பட’ என்பது பவுலின் சொந்தக் கையெழுத்தை இயல்பாகக் காட்டுகிறது; ‘சங்கிலிகள்’ என்ற உருவகம் மூலத்துக்கு ஏற்ப தக்கவைக்கப்பட்டுள்ளது.
