id: COL.4.11
reference: Colossians 4:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: ta
  text: யுஸ்து என்று அழைக்கப்படும் இயேசுவும். விருத்தசேதனம் பெற்றவர்களில்[a] கடவுளுடைய அரசாட்சிக்காக உடன் உழைப்பவர்களாக இருக்கிறவர்கள் இவர்கள் மட்டுமே[c]; இவர்களே எனக்கு ஆறுதலாக ஆனார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதர்களில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இவர்கள் எனக்கு ஊக்கமாக ஆனார்கள்’; ‘இவர்கள் எனக்கு ஆறுதலாக இருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘கடவுளுடைய அரசாட்சிக்காக உடன் உழைப்பவர்களில் விருத்தசேதனம் பெற்றவர்கள் இவர்கள் மட்டுமே.’
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Ἰησοῦς ὁ λεγόμενος Ἰοῦστος
  choice: யுஸ்து என்று அழைக்கப்படும் இயேசு
  rationale: இரண்டு பெயர்களையும் வேறுபடுத்திக் காட்டி, இயேசு என்பவருக்கு யுஸ்து என்ற பெயரும் வழங்கப்பட்டிருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: விருத்தசேதனம் பெற்றவர்களில்
  rationale: இந்தச் சொற்றொடரின் யூத அடையாளப் பொருளை நேரடியாக ‘யூதர்கள்’ என்று தீர்மானித்துவிடாமல், அதன் உருவக அடிப்படையைத் தக்கவைக்கிறது; தமிழில் புரியும்படி ‘பெற்றவர்கள்’ என்று அமைக்கப்பட்டுள்ளது.
- source_word: οὗτοι μόνοι
  choice: இவர்கள் மட்டுமே
  rationale: குறிப்பிட்ட குழுவுக்குள் இவர்களே ஒரே உடன் பணியாளர்கள் என்ற வலியுறுத்தலைத் தெளிவாகக் காக்கிறது.
- source_word: συνεργοὶ
  choice: என்னுடன் பணியாற்றுகிறவர்கள்
  rationale: பவுலுடன் இணைந்து ஊழியம் செய்கிற பங்காளிகள் என்ற உறவுப்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: கடவுளுடைய அரசாட்சிக்காக
  rationale: εἰς என்பதன் நோக்கம் அல்லது சேவை சார்ந்த பொருளை ‘-க்காக’ என்பதாலும், βασιλεία என்பதன் ஆட்சி/அரசு சார்ந்த பொருளை ‘அரசாட்சி’ என்பதாலும் வெளிப்படுத்துகிறது.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: இவர்களே எனக்கு ஆறுதலாக ஆனார்கள்
  rationale: ἐγενήθησαν என்பதன் ‘ஆனார்கள்’ என்ற நிகழ்வுப் பொருளையும், παρηγορία என்பதன் முதன்மையான ‘ஆறுதல்’ பொருளையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ‘விருத்தசேதனத்தைச் சேர்ந்தவர்கள்’ என்பதன் அடையாளம்
  choice: யூதப் பின்னணியைச் சுட்டும் மூலமொழி உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘யூதர்கள்’ அல்லது ‘யூத விசுவாசிகள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழல் இவர்களை அரசாட்சிக்கான உடன் பணியாளர்களாகக் காட்டுவதால் அவர்கள் விசுவாசிகள் என்பது தெளிவாக இருந்தாலும், சொற்றொடர் ஒரு குறுகிய ‘விருத்தசேதனக் கட்சி’யைக் குறிக்கிறதா அல்லது பொதுவாக யூதப் பின்னணியினரைக் குறிக்கிறதா என்பதை மொழிபெயர்ப்பு தேவையின்றித் தீர்மானிக்கவில்லை.
- issue: μόνοι என்பதன் வரம்பு
  choice: விருத்தசேதனம் பெற்றவர்களுக்குள் இவர்கள் மட்டுமே பவுலின் உடன் பணியாளர்கள் என்ற தொடரமைப்பு
  alternative: பவுலுடைய எல்லா உடன் பணியாளர்களிலும் இவர்கள் மட்டுமே யூதர்கள் என்ற தொடரமைப்பு
  rationale: οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι என்ற கிரேக்கச் சொல் வரிசை முதலில் அந்தக் குழுவை முன்வைத்து, அதற்குள் ‘இவர்கள் மட்டுமே’ என்று வலியுறுத்துகிறது; மாற்று இலக்கணத் தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கடித இலக்கியத்தின் எளிமையும் காக்கப்பட்டுள்ளன. வசனம் முந்தைய பெயர்ப்பட்டியலின் தொடர்ச்சி என்பதால் தொடக்கத்தில் உள்ள καί-ஐ இயல்பாக இணைக்கவும், முழு வாக்கியத் தொடரில் வாழ்த்தின் கருத்தைத் தெளிவாக்கவும் ‘உங்களுக்கு வாழ்த்துச் சொல்கிறார்’ சேர்க்கப்பட்டுள்ளது; இது 4:10-ன் ஆளுகையிலுள்ள வாழ்த்துச் செயலை வெளிப்படுத்தும் சூழல்சார் நிரப்பல். ‘ஆறுதலாக ஆனார்கள்’ என்பது சற்றே நேரடி வடிவமாக இருந்தாலும் மூலத்தின் நிகழ்வுத்தன்மையைத் தக்கவைக்கிறது.
