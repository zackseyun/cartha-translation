reference: Colossians 4:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: ta
  text: அவருடன், உண்மையுள்ள, அன்புக்குரிய சகோதரரும் உங்களில் ஒருவருமான ஒனேசிமுவையும் அனுப்பினேன். இங்குள்ள அனைத்தையும் அவர்கள் உங்களுக்குத் தெரிவிப்பார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν Ὀνησίμῳ
  choice: ஒனேசிமுவையும் அவருடன் அனுப்பியிருக்கிறேன்
  rationale: σύν உடன்செல்லுதலைக் குறிக்கிறது; முந்தைய வசனத்திலுள்ள ἔπεμψα என்ற வினை இங்கும் தொடர்வதால், தனி வசனமாக இயல்பாக வாசிக்க அதைப் பொருளில் வெளிப்படுத்துகிறது.
- source_word: πιστῷ
  choice: உண்மையுள்ளவர்
  rationale: ஒனேசிமுவின் நம்பகத்தன்மையையும் விசுவாசமான பண்பையும் குறிக்கும் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀγαπητῷ
  choice: அன்புக்குரிய
  rationale: கிறிஸ்தவச் சகோதர உறவின் கனிவையும் மதிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀδελφῷ
  choice: சகோதரர்
  rationale: ஆண்பால் ஒருமையையும் உடன் விசுவாசி என்ற திருச்சபை உறவையும் விளக்கச் சொற்கள் சேர்க்காமல் காக்கிறது.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: உங்களில் ஒருவர்
  rationale: கொலோசெயர் சமூகத்தைச் சேர்ந்தவர் என்ற பொருளை இயல்பான தமிழில் தருகிறது; பிற சமூக நிலைகளை ஊகித்துச் சேர்ப்பதில்லை.
- source_word: πάντα ... τὰ ὧδε
  choice: இங்குள்ள அனைத்தையும்
  rationale: பவுல் இருக்கும் இடத்துக்குரிய காரியங்கள் அல்லது நிலவரம் அனைத்தையும் உள்ளடக்கும் கிரேக்கச் சொல்லாக்கத்தின் பொதுத்தன்மையைப் பாதுகாக்கிறது.
- source_word: γνωρίσουσιν
  choice: தெரிவிப்பார்கள்
  rationale: அறியச்செய்தல், தகவல் அளித்தல் என்ற பொருளைத் தெளிவாகவும் நவீன தமிழுக்கு இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ἀδελφῷ என்பதன் திருச்சபைச் சார்ந்த பொருள்
  choice: சகோதரர்
  alternative: விசுவாசத்தில் சகோதரர்
  rationale: சக விசுவாசியைக் குறிக்கும் உறவு சூழலில் தெளிவாக இருந்தாலும், மூலத்தில் இல்லாத விளக்கத்தை உரைக்குள் சேர்க்காமல் குடும்ப உறவுச் சொல்லை அப்படியே காக்கிறது.
- issue: ἐξ ὑμῶν என்பதன் வலிமை
  choice: உங்களில் ஒருவர்
  alternative: உங்கள் நடுவிலிருந்து வந்தவர்
  rationale: ஒனேசிமு கொலோசெயர் சமூகத்தைச் சேர்ந்தவர் என்பதைச் சொல்கிறது; பிலேமோன் நூலிலிருந்து சமூக அல்லது சட்ட நிலை குறித்த மேலதிக கருத்துகளை இங்கு இறக்குமதி செய்வதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கடிதத்திற்குரிய கண்ணியமும் சகோதர அன்பின் கனிவும் காக்கப்பட்டுள்ளன. இவ்வசனத்தின் தொடக்கம் முந்தைய வசனத்தின் வினையைச் சார்ந்திருப்பதால், தனியாகவும் தெளிவாக வாசிக்க “அனுப்பியிருக்கிறேன்” பொருளில் வெளிப்படுத்தப்பட்டுள்ளது.
