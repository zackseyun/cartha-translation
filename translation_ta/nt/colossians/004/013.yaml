  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: ta
  text: ஏனெனில், அவர் உங்களுக்காகவும் லவோதிக்கேயாவில் உள்ளவர்களுக்காகவும் எராப்போலியில் உள்ளவர்களுக்காகவும் மிகவும் பாடுபடுகிறார் என்று அவரைக் குறித்து நான் சாட்சி கூறுகிறேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மிகுந்த உழைப்பை மேற்கொள்கிறார்,’ ‘மிகுந்த அக்கறை கொண்டிருக்கிறார்,’ அல்லது ‘ஆழ்ந்த வேதனை அடைகிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் கடுமையான உழைப்பையும், இச்சூழலில் அதனுடன் தொடர்புடைய தீவிர அக்கறையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: நான் சாட்சி கூறுகிறேன்
  rationale: நிகழ்காலத் தன்மை கொண்ட பவுலின் நேரடியான சான்றுரையைத் தெளிவாகப் பாதுகாக்கிறது; தேவையற்ற சாத்தியப்பாட்டு நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் எப்பாப்பிராவைப் பற்றிக் கூறியதற்கான விளக்கத்தை இவ்வசனம் தருகிறது என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: αὐτῷ
  choice: அவருக்காக
  rationale: μαρτυρέω என்பதுடன் வரும் வேற்றுமை வடிவம், எப்பாப்பிராவுக்குச் சாதகமாக அல்லது அவர் சார்பாகச் சாட்சி கூறுவதை இங்கு குறிக்கலாம். ‘அவருக்காக’ என்பது அந்தச் சார்புணர்வைப் பாதுகாக்கிறது.
- source_word: ἔχει πολὺν πόνον
  choice: மிகவும் பாடுபடுகிறார்
  rationale: சொல்லுக்குச் சொல் அமைப்பான ‘மிகுந்த பாடுபாடு கொண்டிருக்கிறார்’ என்பது தமிழில் இயல்பற்றது. வலுவான உழைப்பு அல்லது கடுமையான முயற்சி என்ற அடிப்படைப் பொருளை இயல்பான வினைச்சொல் வடிவில் தருகிறது; உணர்ச்சிசார் அக்கறை என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களுக்காக
  rationale: கொலோசெய விசுவாசிகளின் நன்மைக்காகவும் அவர்கள்மீது கொண்ட அக்கறையாலும் எப்பாப்பிரா பாடுபடுவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: லவோதிக்கேயாவில் உள்ளவர்களுக்காக
  rationale: அந்நகரத்தில் உள்ள விசுவாசிகளைச் சுட்டும் கிரேக்கத் தொடரைத் தெளிவாகவும் சுருக்கமாகவும் மொழிபெயர்க்கிறது.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: எராப்போலியில் உள்ளவர்களுக்காக
  rationale: முந்தைய இடப்பெயர்த் தொடருடன் இணையான அமைப்பைப் பாதுகாத்து, நகரத்தின் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: எப்பாப்பிராவின் ஊழியத்துடன் தொடர்புடைய πόνος என்பதன் பொருள்
  choice: மிகவும் பாடுபடுகிறார்
  alternative: மிகுந்த அக்கறை கொண்டிருக்கிறார்; ஆழ்ந்த வேதனை அடைகிறார்; மிகுந்த உழைப்பை மேற்கொள்கிறார்
  rationale: உடனடி சூழல் எப்பாப்பிராவின் தீவிரமான ஜெபப் போராட்டத்தை எடுத்துக்காட்டுவதால் உணர்ச்சிசார் அக்கறையும் வேதனையும் சாத்தியம். எனினும் πόνος என்பதன் அடிப்படைப் பொருள் கடுமையான உழைப்பு அல்லது பாடுபாடு. முதன்மை உரை அந்தப் பரந்த பொருளைப் பாதுகாக்கிறது; குறுகிய உணர்ச்சிசார் விளக்கத்தைத் திணிக்கவில்லை.
- issue: μαρτυρῶ αὐτῷ என்பதில் சாட்சியின் திசை
  choice: அவருக்காக நான் சாட்சி கூறுகிறேன்
  alternative: அவரைக் குறித்து நான் சாட்சி கூறுகிறேன்
  rationale: தரப்பட்ட வேற்றுமை வடிவம் எப்பாப்பிராவுக்குச் சாதகமான அல்லது அவர் சார்பான சான்றுரையாகப் புரிந்துகொள்ளப்படலாம். ‘அவருக்காக’ என்பது அந்த நுணுக்கத்தைப் பாதுகாக்கிறது; அதே நேரத்தில் அடுத்துவரும் ὅτι தொடர் சாட்சியின் உள்ளடக்கத்தைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூன்று பயனாளிக் குழுக்களையும் இணைக்கும் கிரேக்க இணை அமைப்பு ‘உங்களுக்காகவும் … உள்ளவர்களுக்காகவும் … உள்ளவர்களுக்காகவும்’ எனப் பாதுகாக்கப்பட்டுள்ளது. ‘மிகுந்த பாடுபாடு கொண்டிருக்கிறார்’ என்ற செயற்கையான சொல்லுக்குச் சொல் அமைப்புக்கு பதிலாக இயல்பான ‘மிகவும் பாடுபடுகிறார்’ பயன்படுத்தப்பட்டுள்ளது.
