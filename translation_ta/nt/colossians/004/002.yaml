translation:
  language: ta
  text: ஜெபத்தில் விடாமுயற்சியுடன் நிலைத்திருங்கள்; நன்றியுணர்வுடன் அதில் விழிப்புடன் இருங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஜெபத்தில் விடாமுயற்சியுடன் தொடருங்கள்; அதில் நன்றியுணர்வுடன் விழிப்பாயிருங்கள்.”
    reason: ‘προσκαρτερεῖτε’ என்பதற்கான ‘விடாமுயற்சியுடன் தொடருங்கள்’ என்ற மாற்று வெளிப்பாட்டை வழங்குகிறது; ‘γρηγοροῦντες’ ஜெபத்தில் தொடரும் விழிப்பான கவனத்தைச் சுட்டுவதையும் காக்கிறது.
lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: ஜெபத்தில்
  rationale: குறிப்பிட்ட ஒரு ஜெபத்தை அல்ல, ஜெபம் என்னும் தொடர்ச்சியான நடைமுறையை இச்சொற்றொடர் குறிக்கிறது. தமிழில் ‘ஜெபத்தில்’ என்பது இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: προσκαρτερεῖτε
  choice: உறுதியாய் நிலைத்திருங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவம் இடைவிடாத பற்றுறுதியையும் விடாமுயற்சியையும் வலியுறுத்துகிறது. ‘உறுதியாய் நிலைத்திருங்கள்’ என்பது அந்தத் தொடர்ச்சியையும் கட்டளைத் தொனியையும் காக்கிறது.
- source_word: γρηγοροῦντες
  choice: விழிப்புடன் இருங்கள்
  rationale: இது உடல் ரீதியாக உறங்காமல் இருப்பதை மட்டும் அல்ல, கவனமான ஆன்மிக விழிப்பைக் குறிக்கிறது. தமிழில் ‘விழிப்புடன்’ என்பது தவறான சொற்பொருள் புரிதலைத் தவிர்த்து அந்தக் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: ἐν αὐτῇ
  choice: அதில்
  rationale: பெண்பால் சுட்டுப்பெயர் முன் வரும் ‘ஜெபம்’ என்பதையே இயல்பாகச் சுட்டுகிறது. ‘அதில்’ கிரேக்கத்தின் பின்னோக்குச் சுட்டும் அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἐν εὐχαριστίᾳ
  choice: நன்றியுணர்வுடன்
  rationale: ஜெபத்தில் நிலவும் மனப்பாங்கையோ அதனுடன் சேர்ந்த முறையையோ இச்சொற்றொடர் குறிக்கிறது. ‘நன்றியுணர்வுடன்’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
