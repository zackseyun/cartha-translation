- from: ஜெபத்தில் உறுதியாய் நிலைத்திருங்கள்; நன்றியுணர்வுடன் அதில் விழிப்புடன் இருங்கள்.[a]
  to: ஜெபத்தில் விடாமுயற்சியுடன் நிலைத்திருங்கள்; நன்றியுணர்வுடன் அதில் விழிப்புடன் இருங்கள்.[a]
  rationale: முதன்மை உரையில் ‘விடாமுயற்சியுடன்’ சேர்க்கப்பட்டுள்ளது; இது προσκαρτερεῖτε என்ற நிகழ்காலக் கட்டளையின் தொடர்ச்சியான நிலைத்திருப்பைத் துல்லியமாகக் காட்டுகிறது. மற்ற சொற்கள் மூலத்தின் பொருளையும் இயல்பான நவீன தமிழ் நடையையும் நன்கு காக்கின்றன. அடிக்குறிப்பு மூலத்தின் வரிசைக்கு நெருக்கமாகவும், ஆங்கில ஆய்வுத் தடத்தில் உள்ள செல்லத்தக்க மாற்றுடன் ஒத்ததாகவும் மறுவடிவமைக்கப்பட்டுள்ளது.
