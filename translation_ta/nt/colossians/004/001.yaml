base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: ta
  text: எஜமான்களே, உங்கள் அடிமைகளுக்கு நீதியையும் சமநீதியையும்[a] வழங்குங்கள்; உங்களுக்கும் பரலோகத்தில் ஓர் ஆண்டவர் இருக்கிறார் என்பதை அறிந்துகொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியையும் சமத்துவத்தையும்.” “சமநீதி” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் “சமத்துவம்” அல்லது “நியாயம்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: எஜமான்களே
  rationale: வீட்டு உறவுமுறைச் சூழலில், κύριοι என்பது அடிமைகள்மீது அதிகாரம் கொண்ட மனித எஜமான்களைக் குறிக்கிறது. ‘எஜமான்களே’ என்பது இயல்பான நேரடி அழைப்பாகும்.
- source_word: τὸ δίκαιον
  choice: நீதியானதை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட δίκαιον, நீதி அல்லது சரியானது என்பதைக் குறிக்கிறது. ‘நீதியானதை’ அதன் அறநெறி வலிமையைத் தெளிவாக வைத்திருக்கிறது.
- source_word: τὴν ἰσότητα
  choice: நியாயமானதை
  rationale: ἰσότης என்பதற்கு சமத்துவம், நியாயம், சமநீதியான நடத்தை ஆகிய பொருள்கள் உண்டு. இச்சூழலில் ‘நியாயமானதை’ என்பது இயல்பான தமிழில் சமநீதியான நடத்தையைக் காட்டுகிறது; ‘சமத்துவம்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῖς δούλοις
  choice: உங்கள் அடிமைகளுக்கு
  rationale: எஜமான்கள்–அடிமைகள் என்ற சமூக உறவு வெளிப்படையாக இருப்பதால், δοῦλοι என்பதன் கட்டுப்பட்ட சமூக நிலையை மென்மையாக்காமல் ‘அடிமைகள்’ என்று மொழிபெயர்க்கப்படுகிறது. உடைமையைக் குறிக்கும் சொல் கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும், தமிழ் உரையில் உறவைக் தெளிவாக்க ‘உங்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: παρέχεσθε
  choice: வழங்குங்கள்
  rationale: இந்தக் கட்டளை, உரிய மற்றும் நியாயமான நடத்தையை அளிக்க அல்லது உறுதிசெய்யுமாறு கூறுகிறது. ‘வழங்குங்கள்’ என்பது தற்போதைய மரியாதையான தமிழில் இயல்பானது.
- source_word: εἰδότες
  choice: அறிந்திருங்கள்
  rationale: கிரேக்கப் பெயரெச்சம் கட்டளைக்கான அடிப்படை விழிப்புணர்வைக் காட்டுகிறது. தமிழில் ‘அறிந்திருங்கள்’ அதன் தொடர்ந்த உணர்வையும் அறிவுறுத்தும் தொனியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ ὑμεῖς
  choice: உங்களுக்கும்
  rationale: மனித எஜமான்களும் தங்களுக்கு மேலான அதிகாரத்தின்கீழ் இருக்கிறார்கள் என்ற வலியுறுத்தலை ‘உங்களுக்கும்’ தக்கவைக்கிறது.
- source_word: κύριον
  choice: ஓர் எஜமான்
  rationale: ஒரே வசனத்தில் மனித κύριοι மற்றும் பரலோக κύριον இடையிலான சொல் தொடர்பைத் தமிழில் ‘எஜமான்’ மீளுரைப்பது தெளிவாகப் பாதுகாக்கிறது. பரலோகச் சூழல் அதன் இறையியல் குறிப்பை வெளிப்படுத்துகிறது.
- source_word: ἐν οὐρανῷ
  choice: பரலோகத்தில்
  rationale: ஒருமை οὐρανῷ என்பதற்கான இயல்பான, மரியாதையான நவீனத் தமிழ் வடிவம் ‘பரலோகத்தில்’ ஆகும்.
theological_decisions:
- issue: வீட்டு உறவுமுறைச் சூழலில் δοῦλοι என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள் / பணியாளர்கள்
  rationale: இங்கு எஜமான்கள் நேரடியாக எதிர்புறமாகக் குறிப்பிடப்படுவதால், கட்டுப்பட்ட அடிமை நிலை சமூக ரீதியாகத் தெளிவாக உள்ளது. ‘வேலைக்காரர்கள்’ அல்லது ‘பணியாளர்கள்’ என்பது அந்த உண்மையை மென்மையாக்கும்.
- issue: ἰσότητα என்பதன் பொருள்
  choice: நியாயமானதை
  alternative: சமத்துவத்தை / சமநீதியை
  rationale: இச்சொல் சமத்துவத்தையோ நியாயமான, சமநீதியான நடத்தையையோ குறிக்கலாம். முதன்மை உரையில் இயல்பான சூழல்சார் பொருளாக ‘நியாயமானதை’ பயன்படுத்தப்பட்டு, குறிப்பிடத்தக்க ‘சமத்துவம்’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: மனித மற்றும் பரலோக κύριος இடையிலான சொல் தொடர்பு
  choice: இரு இடங்களிலும் எஜமான் சார்ந்த சொல்
  alternative: மனிதர்களுக்கு ‘எஜமான்கள்’, பரலோகத்தவருக்கு ‘ஆண்டவர்’
  rationale: கிரேக்க உரை ஒரே κύριος சொல்லைப் பயன்படுத்தி, பூமிக்குரிய எஜமான்களும் பரலோக எஜமானின் அதிகாரத்தின்கீழ் இருப்பதைச் சொல்லாடல் மூலம் வலியுறுத்துகிறது. ‘எஜமான்’ என்பதை மீண்டும் பயன்படுத்துவது அந்த எதிரொலியைப் பாதுகாக்கிறது; ஆயினும் ‘ஆண்டவர்’ என்பது இறையியல் பட்டத்தை வெளிப்படையாக்கும் சாத்தியமான மாற்று.
