translation:
  language: ta
  text: வெளியார்களிடம்[a] ஞானத்துடன் நடந்துகொள்ளுங்கள்; தக்க வாய்ப்பை முழுமையாகப் பயன்படுத்திக்கொள்ளுங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெளியில் இருப்பவர்களிடம்’—அதாவது, விசுவாசச் சமூகத்திற்கு வெளியே இருப்பவர்களிடம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, ‘காலத்தை விலைகொடுத்து வாங்கிக்கொண்டு’; இதன் பொருள், கிடைக்கும் வாய்ப்பை முழுமையாகப் பயன்படுத்திக்கொள்வது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: ஞானத்துடன்
  rationale: ἐν என்ற முன்னிடைச்சொல் இங்கு நடக்க வேண்டிய முறையையோ வாழ்வின் பண்பையையோ குறிக்கிறது. ‘ஞானத்துடன்’ என்பது σοφία என்ற பெயர்ச்சொல்லின் நெறிசார் வலிமையைத் தக்கவைத்தபடி இயல்பான தமிழை வழங்குகிறது.
- source_word: περιπατεῖτε
  choice: நடந்துகொள்ளுங்கள்
  rationale: இச்சொல் உருவகமாக ஒருவரின் வாழ்க்கை நடத்தையைக் குறிக்கிறது. ‘நடந்துகொள்ளுங்கள்’ என்பது நடை உருவகத்தின் சுவட்டைத் தக்கவைத்து, இச்சூழலில் உறவுமுறை நடத்தையையும் தெளிவாகக் காட்டுகிறது.
- source_word: πρὸς τοὺς ἔξω
  choice: வெளியில் இருப்பவர்களிடம்
  rationale: πρός மற்றவர்களுடன் தொடர்புகொள்ளும் விதத்தையும் அவர்களை நோக்கிய நடத்தையையும் குறிக்கிறது; οἱ ἔξω என்பது விசுவாசச் சமூகத்திற்கு வெளியே இருப்பவர்களைக் குறிக்கும் வழக்குச் சொற்றொடர். ‘வெளியில் இருப்பவர்கள்’ மூலத்தின் உருவகத்தையும் அதன் எல்லைக் கருத்தையும் தக்கவைக்கிறது.
- source_word: τὸν καιρόν
  choice: தக்க வாய்ப்பை
  rationale: καιρός வெறும் கால ஓட்டத்தைவிட ஏற்ற தருணம் அல்லது வாய்ப்பைக் குறிக்கிறது. ‘தக்க வாய்ப்பு’ அந்தச் சூழ்நிலை சார்ந்த நுண்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐξαγοραζόμενοι
  choice: முழுமையாகப் பயன்படுத்திக்கொள்ளுங்கள்
  rationale: இங்கு வணிக உருவகம் மரபுத்தொடராகப் பயன்பட்டு, கிடைக்கும் வாய்ப்பைத் தவறவிடாமல் முழுமையாகப் பயன்படுத்துதல் என்ற பொருளைத் தருகிறது. தமிழில் ‘மீட்டுக்கொள்ளுதல்’ மீட்பியல் பொருளைத் தேவையின்றி தூண்டக்கூடும் என்பதால் அது முதன்மை உரையில் தவிர்க்கப்படுகிறது.
theological_decisions:
- issue: ἐξαγοραζόμενοι என்பதற்கு மீட்பியல் பொருள் ஏற்றப்படக்கூடிய சாத்தியம்
  choice: வெளியிலிருப்பவர்களிடம் ஞானமாக நடந்து, தக்க வாய்ப்பை முழுமையாகப் பயன்படுத்துமாறு கூறும் அறிவுரை
  alternative: ‘காலத்தை மீட்டுக்கொள்ளுங்கள்’ என்று சொற்சொல்லாக மொழிபெயர்த்து, ‘மீட்பு’ சார்ந்த இறையியல் கருத்தை ஒலிக்கச் செய்தல்
  rationale: இச்சூழலில் வினைச்சொல் பாவத்திலிருந்து அல்லது விலையிலிருந்து மீட்பதைப் பற்றியது அல்ல; சாதகமான தருணத்தைப் பற்றிக்கொண்டு நன்கு பயன்படுத்துவதைப் பற்றியது. ஆகவே உரை கூறாத மீட்பியல் கருத்து சேர்க்கப்படவில்லை; எனினும் கிரேக்கத்தின் சொற்சொல் உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஞானத்துடன் நடந்துகொள்ளுங்கள்’ என்பது பவுலின் நடை/வாழ்க்கை உருவகத்தை இயல்பாகத் தக்கவைக்கிறது. ‘வெளியில் இருப்பவர்கள்’ என்ற உண்மையான சமூக எல்லை உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் குறிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
