  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα φανερώσω αὐτὸ ὡς δεῖ με λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/004.yaml
  text: so that I may make it clear[b][a], as I ought to speak.
translation:
  language: ta
  text: நான் பேச வேண்டியபடி அதைத் தெளிவாக எடுத்துரைக்கும்படி.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதை வெளிப்படுத்தும்படி” அல்லது “அதைத் தெரியப்படுத்தும்படி” என்றும் மொழிபெயர்க்கலாம். “அதை” என்பது முந்தைய வசனத்தில் கூறப்பட்ட மறைபொருளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் அவசியமாகப் பேச வேண்டியபடி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: எடுத்துரைக்கும்படி
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα என்பதன் பொருளைத் தமிழில் இயல்பான நோக்கவினையெச்ச அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: φανερώσω
  choice: தெளிவாக எடுத்துரைக்க
  rationale: வெளிப்படுத்துதல், தெரியப்படுத்துதல் என்ற அடிப்படைப் பொருளையும், இச்சூழலில் செய்தியைத் தெளிவாக அறிவித்தல் என்ற நுணுக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: αὐτὸ
  choice: அதை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட மறைபொருளைச் சுட்டும் கிரேக்கப் பிரதிப்பெயரை, அதன் முன்னிலையை முதன்மை உரைக்குள் விரிவாக்காமல் பிரதிப்பெயராகவே காக்கிறது.
- source_word: ὡς
  choice: எப்படியோ, அப்படி
  rationale: பேச வேண்டிய முறை அல்லது தரத்தைச் சுட்டும் ὡς என்பதன் உறவை இயல்பான தமிழ் இணை அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: கடமை அல்லது அவசியத்தைத் தெரிவிக்கிறது; கிரேக்கத்தில் உள்ள கட்டாய நுணுக்கத்தைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: με
  choice: நான்
  rationale: δεῖ உடன் வரும் λαλῆσαι என்பதன் தர்க்கரீதியான எழுவாயைத் தமிழில் ‘நான்’ என்று இயல்பாக வழங்குகிறது.
- source_word: λαλῆσαι
  choice: பேச
  rationale: பொதுவான ‘பேசுதல்’ என்ற பொருளைத் தக்கவைக்கிறது; ‘பிரசங்கிக்க’ போன்ற அதிகச் சிறப்புப் பொருளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘அதை’ என்பதன் முன்னிலை
  choice: முதன்மை உரையில் ‘அதை’ என்ற பிரதிப்பெயரைத் தக்கவைத்தல்
  alternative: ‘கிறிஸ்துவின் மறைபொருளை’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க உரை αὐτό என்ற பிரதிப்பெயரையே பயன்படுத்துகிறது. அதன் முன்னிலை முந்தைய வசனத்திலிருந்து புரிந்தாலும், அதை முதன்மை உரையில் விரிவாக்குவது மூலத்தின் சொற்றொடரை விட விளக்கமாகிவிடும்.
- issue: δεῖ குறிக்கும் கடமை அல்லது அவசியம்
  choice: ‘வேண்டும்’
  alternative: ‘கடமைப்பட்டிருக்கிறேனோ’
  rationale: δεῖ கடமைக்கும் அவசியத்திற்கும் இடமளிக்கிறது. ‘வேண்டும்’ இரண்டையும் இயல்பாகத் தாங்கி, ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தைத் திணிக்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமான நடை. கிரேக்கத்தின் நோக்கம், பிரதிப்பெயர், கடமை/அவசியம் ஆகியவை காக்கப்பட்டுள்ளன; ‘எப்படிப்… அப்படி’ அமைப்பு ὡς குறிக்கும் முறையை இயல்பாக வெளிப்படுத்துகிறது.
