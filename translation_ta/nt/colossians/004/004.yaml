  rationale: The revision changes only the Tamil word order, so that the manner/standard clause (“நான் பேச வேண்டியபடி”) modifies the full action of making the referent clear. This is more natural Tamil and more closely reflects ὡς δεῖ με λαλῆσαι, while retaining the source pronoun and the purpose construction.
