- source_word: τὸ μυστήριον τοῦ Χριστοῦ
  choice: மெசியாவைப் பற்றிய மறைபொருள்
  rationale: μυστήριον என்பதை வெறும் இரகசியம் என்று அல்லாமல் வெளிப்படுத்தப்பட்ட தெய்வீக மறைபொருள் என்ற பவுலின் பயன்பாட்டுக்கு ஏற்றவாறு தருகிறது; Χριστός இங்கு பட்டமாக இருப்பதால் ‘மெசியா’ என வழங்கப்படுகிறது. Genitive-இன் இயல்பான விளக்கத் தொடர்பை ‘பற்றிய’ எனக் காட்டுகிறது.
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: அதற்காகவே நானும் கட்டப்பட்டிருக்கிறேன்
  rationale: διά + accusative என்பதன் காரணப்பொருளையும், perfect passive காட்டும் தொடரும் கட்டுண்ட நிலையையும் காக்கிறது; ‘சங்கிலியில்’ என்பது சாத்தியமான சூழல்சார் விளக்கம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பெயர்போல மங்காமல் பட்டமாகவும் பொருள்தாங்கியும் செயல்படுகிறது; ஆகவே ‘மெசியா’ மூலத்தின் பட்டப்பொருளை வெளிப்படுத்துகிறது.
- issue: θύραν τοῦ λόγου என்ற உருவகம்
  choice: வார்த்தையை அறிவிக்க ... ஒரு கதவைத் திறக்க
  alternative: செய்தியை அறிவிக்க ஒரு வாய்ப்பை அளிக்க
  rationale: பவுலின் ‘கதவு’ உருவகத்தைத் தக்கவைத்தபடியே அதன் நோக்கத்தைத் தமிழில் தெளிவாக்குகிறது; அதை முழுவதுமாக ‘வாய்ப்பு’ என்று விளக்கிவிடவில்லை.
- issue: τοῦ Χριστοῦ என்ற genitive தொடர்பு
  choice: மெசியாவைப் பற்றிய மறைபொருள்
  alternative: மெசியாவின் மறைபொருள்
  rationale: Genitive, மெசியாவை உள்ளடக்கமாகக் குறிக்கலாம் அல்லது அவருக்குரிய மறைபொருளைக் குறிக்கலாம். முதன்மை உரை இயல்பான தமிழில் உள்ளடக்கத் தொடர்பைத் தருகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் எளிமையும் கொண்ட நடை. வசனம் முந்தைய அறிவுறுத்தலைத் தொடர்வதால் இயல்பான தமிழ் கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘கதவு’ உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘வார்த்தை’ தனியே தெளிவற்றுப் போகாமல் அறிவித்தலோடு இணைக்கப்பட்டுள்ளது.
