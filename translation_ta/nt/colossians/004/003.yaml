  rationale: θύρα என்பதன் கதவு உருவகத்தைத் தக்கவைத்து, τοῦ λόγου என்பதன் அறிவிக்கப்படும் செய்தி சார்ந்த பொருளைத் தமிழில் புரியத்தக்கவாறு இணைக்கிறது.
