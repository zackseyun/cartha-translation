source:
  edition: SBLGNT
  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: ta
  text: அர்க்கிப்புவிடம், “நீ ஆண்டவருக்குள் பெற்றுக்கொண்ட ஊழியத்தை நிறைவேற்றும்படி அதில் கவனம் செலுத்து[a]” என்று சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரிடமிருந்து நீ பெற்றுக்கொண்ட ஊழியம்.”
    reason: ἐν κυρίῳ என்பது ஊழியத்தைப் பெற்றதன் சூழல் அல்லது ஆண்டவருடனான உறவைக் குறிக்கலாம்; சிலர் இதை ஊழியத்தின் மூலத்தைக் குறிக்கும் ‘ஆண்டவரிடமிருந்து’ என்று புரிந்துகொள்கின்றனர்.
lexical_decisions:
- source_word: εἴπατε
  choice: சொல்லுங்கள்
  rationale: சபையாரை நோக்கிய பன்மை கட்டளை வடிவத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: Ἀρχίππῳ
  choice: அர்க்கிப்பு
  rationale: தனிப்பெயர் கிரேக்க ஒலிப்புக்கு ஏற்ற நிலையான தமிழ் ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: Βλέπε
  choice: கவனமாயிரு
  rationale: தொடர்ந்து விழிப்புடன் கவனம் செலுத்த வேண்டும் என்ற நிகழ்காலக் கட்டளையின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διακονίαν
  choice: ஊழியம்
  rationale: ஒப்படைக்கப்பட்ட கிறிஸ்தவப் பணி அல்லது சேவையைச் சுட்டுகிறது; குறிப்பிட்ட திருச்சபைப் பதவியாக அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: παρέλαβες
  choice: பெற்றுக்கொண்ட
  rationale: தானாக ஏற்றுக்கொண்டதைக் காட்டிலும் ஒப்படைக்கப்பட்ட பொறுப்பைப் பெற்றுக்கொண்டது என்ற பொருளைக் காக்கிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: ἐν என்பதன் அடிப்படை உறவு அல்லது செயல்பாட்டுக் களப் பொருளைத் தக்கவைத்து, இதைத் திட்டவட்டமாக ‘ஆண்டவரிடமிருந்து’ என்று மாற்றவில்லை.
- source_word: ἵνα
  choice: நிறைவேற்றுவதற்கு
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα என்பதன் பொருளைத் தமிழ் வினையெச்ச அமைப்பில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: πληροῖς
  choice: நிறைவேற்று
  rationale: ஒப்படைக்கப்பட்ட ஊழியத்தை முழுமையாகச் செய்து முடித்தல் மற்றும் உண்மையுடன் செயல்படுத்துதல் ஆகிய பொருள் நிழல்களைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ἐν κυρίῳ என்பதன் பொருள் நுட்பம்
  choice: முதன்மை உரையில் ‘ஆண்டவருக்குள்’
  alternative: ‘ஆண்டவரிடமிருந்து’
  rationale: கிரேக்கத்தில் ἐν உள்ளது; ἀπό அல்லது παρά இல்லை. ஆகவே ஊழியம் ஆண்டவருடனான உறவுக்குள் பெற்றதா அல்லது அவரிடமிருந்து வந்ததா என்ற பொருள் நுட்பத்தைத் தீர்மானித்து விடாமல் முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சபை வாசிப்புக்கு ஏற்ற கண்ணியமான நடை. கட்டளையின் நேரடித்தன்மையும் ஊழியத்தின் கிறிஸ்தவச் சூழலும் காக்கப்பட்டுள்ளன.
