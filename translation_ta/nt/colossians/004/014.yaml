  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: ta
  text: அன்புக்குரிய மருத்துவரான லூக்காவும் தேமாவும் உங்களுக்கு வாழ்த்துத் தெரிவிக்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: வாழ்த்துத் தெரிவிக்கிறார்கள்
  rationale: கடிதங்களில் பயன்படுத்தப்படும் வாழ்த்துச் சூத்திரத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. கிரேக்கத்தில் வினை ஒருமையில் இருந்தாலும், லூக்காவும் தேமாவும் இணைந்த எழுவாயாக இருப்பதால் தமிழில் பன்மை வினை இயல்பானது.
- source_word: ὑμᾶς
  choice: உங்களுக்கு
  rationale: கொலோசெயிலுள்ள விசுவாசிகளை ஒரு குழுவாகக் குறிக்கும் இரண்டாம் நபர் பன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: Λουκᾶς
  choice: லூக்கா
  rationale: தமிழ் வேதாகம மரபில் நன்கு அறியப்பட்ட பெயர்ப்பெயர்ப்பு.
- source_word: ἰατρὸς
  choice: மருத்துவர்
  rationale: மருத்துவத் தொழிலைத் தெளிவாகக் குறிக்கும், இயல்பானதும் மரியாதையானதுமான நவீன தமிழ்ச் சொல்.
- source_word: ἀγαπητὸς
  choice: அன்புக்குரிய
  rationale: பவுலின் பாசத்தையும் மதிப்பையும் வெளிப்படுத்தும் ἀγαπητός என்பதன் வெம்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: καὶ
  choice: -வும் … -வும்
  rationale: லூக்காவையும் தேமாவையும் இணை எழுவாய்களாக இயல்பான தமிழில் இணைக்கிறது.
- source_word: Δημᾶς
  choice: தேமா
  rationale: தமிழ் வேதாகம மரபில் அறியப்பட்ட பெயர்ப்பெயர்ப்பு.
theological_decisions:
- issue: ‘அன்புக்குரிய’ என்ற அடைமொழியின் தொடர்பு
  choice: ‘அன்புக்குரிய மருத்துவர்’ என்ற முழுச் சொற்றொடரும் லூக்காவை மட்டும் விவரிக்கிறது.
  alternative: ‘அன்புக்குரிய’ என்பது தேமாவையும் சேர்த்து விவரிப்பதாக வாசித்தல்.
  rationale: கிரேக்கத்தின் Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς என்ற அமைப்பில், இரு சுட்டுப்பெயர்ச்சொல் தொடர்களும் லூக்காவுக்கே இணைநிலையில் அமைந்து அவரை விவரிக்கின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கடித நடையைப் பயன்படுத்துகிறது. ‘வைத்தியர்’ என்பதற்குப் பதில் இன்றைய பொதுவழக்கில் இயல்பான ‘மருத்துவர்’ தேர்ந்தெடுக்கப்பட்டது.
