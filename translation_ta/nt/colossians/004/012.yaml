id: COL.4.12
reference: Colossians 4:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: ta
  text: உங்களில் ஒருவரான எப்பாப்பிரா உங்களுக்கு வாழ்த்துத் தெரிவிக்கிறார். அவர் மேசியாவின் அடிமை. நீங்கள் கடவுளுடைய முழுத் திருவுளத்திலும் முதிர்ச்சியடைந்தவர்களாகவும் முழு உறுதியுள்ளவர்களாகவும் நிலைத்து நிற்கும்படி, அவர் தமது வேண்டுதல்களில் எப்போதும் உங்களுக்காகப் போராடிவருகிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: வாழ்த்துத் தெரிவிக்கிறார்
  rationale: கடித முடிவுரைகளில் வரும் வழக்கமான வாழ்த்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὁ ἐξ ὑμῶν
  choice: உங்களில் ஒருவரான
  rationale: எப்பாப்பிரா கொலோசெயர் சமூகத்தைச் சேர்ந்தவர் என்பதைக் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: இச்சொல் வெறும் பணியாளரை விட, மேசியாவுக்குச் சொந்தமான நிலையையும் முழுமையான கீழ்ப்படிதலையும் வலுவாகக் குறிக்கிறது.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός என்பதன் பட்டப்பெயர்ச் சிறப்பைத் தமிழில் பொருளுடன் பாதுகாக்கிறது; மூல உரையில் இங்கு இயேசு என்ற பெயர் இல்லை.
- source_word: ἀγωνιζόμενος
  choice: போராடிவருகிறார்
  rationale: தீவிர முயற்சி மற்றும் போராட்டம் என்ற வினையின் வலிமையை, வேண்டுதலின் சூழலில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐν ταῖς προσευχαῖς
  choice: தமது வேண்டுதல்களில்
  rationale: பன்மை வடிவம் உணர்த்தும் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் செய்யப்படும் வேண்டுதல்களைப் பாதுகாக்கிறது.
- source_word: ἵνα σταθῆτε
  choice: நிலைத்து நிற்கும்படி
  rationale: நிற்றல் என்ற மூல உருவகத்தைத் தக்கவைத்தபடி, சூழலில் உள்ள உறுதிநிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τέλειοι
  choice: முதிர்ச்சியடைந்தவர்களாக
  rationale: இங்கு பாவமற்ற பரிபூரணத்தை அவசியம் குறிக்காமல், ஆன்மிக முதிர்ச்சி அல்லது நிறைவைக் குறிக்கும் பவுலின் பயன்பாட்டுக்கு ஏற்றது.
- source_word: πεπληροφορημένοι
  choice: முழு உறுதிபெற்றவர்களாக
  rationale: முழுமையான உறுதி அல்லது நிச்சயம் பெற்ற நிலையை வெளிப்படுத்துகிறது; வேறொரு சாத்தியமான நிலைபெறுதல் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: கடவுளுடைய முழுத் திருவுளத்திலும்
  rationale: இச்சொற்றொடர் கடவுளின் திருவுளத்தின் முழுமையையோ அதன் எல்லா அம்சங்களையோ குறிக்கக்கூடிய அகலத்தைத் தேவையின்றி சுருக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: δοῦλος என்பதன் வலிமை
  choice: அடிமை
  alternative: ஊழியர்
  rationale: மேசியாவுக்குச் சொந்தமான நிலையும் முழு விசுவாசப் பற்றும் இங்கு முக்கியமானதால், மென்மைப்படுத்தப்பட்ட மாற்றுக்கு மாறாக மூலச்சொல்லின் வலிமை பாதுகாக்கப்பட்டது.
- issue: Χριστοῦ என்ற பட்டப்பெயர்
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: Χριστός என்பதன் அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயர்ப் பொருளைப் பாதுகாக்கிறது; மூல உரையில் இல்லாத இயேசு என்ற பெயர் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- issue: πεπληροφορημένοι என்பதன் பொருள்
  choice: முழு உறுதிபெற்றவர்களாக
  alternative: முழுமையாக நிலைபெற்றவர்களாக
  rationale: உறுதி அல்லது நிச்சயம் என்ற பொதுவான பொருள் முதன்மை உரையில் கொள்ளப்பட்டது; நிலைபெற்றிருத்தல் என்ற சாத்தியமும் விளக்கக் குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. “திருவுளம்” என்ற சொல் கடவுளின் சித்தத்தைச் சுட்டும் மரியாதைமிக்க வழக்குச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்கும்படி நீண்ட கிரேக்க வாக்கியம் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது.
