source:
  edition: SBLGNT
  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: ta
  text: லவோதிக்கேயாவில் உள்ள சகோதரர்களையும், நிம்பாவையும், அவளுடைய வீட்டிலுள்ள திருச்சபையையும் வாழ்த்துங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகள், “நிம்பாஸையும் அவனுடைய வீட்டிலுள்ள திருச்சபையையும்” என்ற வாசகத்தை ஆதரிக்கின்றன; வேறு சில, “அவர்களுடைய வீட்டிலுள்ள திருச்சபையையும்” என்ற வாசகத்தை ஆதரிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துங்கள்
  rationale: இது பன்மை இரண்டாம் நபருக்கான நேரடியான கட்டளை. கடிதச் சூழலில் ஒருவருக்கு வாழ்த்துத் தெரிவிப்பதைக் குறிக்கும் இயல்பான, சுருக்கமான நவீனத் தமிழ் சொல்.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: லவோதிக்கேயாவில் உள்ள சகோதரர்களை
  rationale: ἀδελφοὺς என்பதன் ஆண்பால் பன்மை வடிவத்தை ‘சகோதரர்கள்’ காக்கிறது; பவுலின் பயன்பாட்டில் இது பொதுவாக சக விசுவாசிகளைக் குறிக்கலாம். இடத்தைக் குறிக்கும் சொற்றொடர் இயல்பான தமிழில் ‘லவோதிக்கேயாவில் உள்ள’ என்று தரப்பட்டுள்ளது.
- source_word: Νύμφαν
  choice: நிம்பா
  rationale: SBLGNT-யின் Νύμφαν என்ற பெண்பால் பெயர் வடிவத்தைப் பின்பற்றுகிறது. ஆண்பால் ‘நிம்பாஸ்’ என்ற மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: அவளுடைய வீட்டிலுள்ள திருச்சபை
  rationale: κατ’ οἶκον என்ற மரபுத்தொடர் வீட்டில் அமைந்த அல்லது கூடிவந்த சபையைக் குறிக்கிறது. ‘வீட்டிலுள்ள’ என்பது ‘கூடுகிற’ என்ற விளக்கத்தை மூலத்தில் இல்லாமல் சேர்க்காமல், இயல்பாக இடப்பொருளைக் காக்கிறது; αὐτῆς என்பதன் பெண்பால் ஒருமையும் ‘அவளுடைய’ என்று தெளிவாகத் தரப்பட்டுள்ளது.
- source_word: ἐκκλησίαν
  choice: திருச்சபை
  rationale: பவுலின் கடிதச் சூழலில் கூடிவரும் கிறிஸ்தவ விசுவாசிகளின் சமூகத்தைக் குறிக்கும் வழக்கமான, மரியாதைக்குரிய தமிழ்ச் சொல்.
theological_decisions:
- issue: Νύμφαν என்ற பெயரின் பாலினமும் அதனுடன் தொடர்புடைய உரிமைப் பெயரும்
  choice: நிம்பா … அவளுடைய வீட்டிலுள்ள திருச்சபை
  alternative: நிம்பாஸ் … அவனுடைய வீட்டிலுள்ள திருச்சபை; அல்லது அவர்களுடைய வீட்டிலுள்ள திருச்சபை
  rationale: அச்சிடப்பட்ட SBLGNT வாசகத்தில் பெண்பால் ஒருமையான αὐτῆς (‘அவளுடைய’) உள்ளது; ஆகவே முதன்மை உரை பெண்பால் வாசகத்தை நேரடியாகப் பின்பற்றுகிறது. ஆண்பால் மற்றும் பன்மை மாற்று வாசகங்கள் உண்மையான பிரதிவேறுபாடுகள் என்பதால் அவை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைக்குரிய கடித நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் பட்டியல் அமைப்பைக் காக்க ‘-ஐயும்’ இணைப்புகள் பயன்படுத்தப்பட்டுள்ளன; பிரதிவேறுபாடு முதன்மை உரையில் தீர்த்துவைக்கப்படாமல் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
