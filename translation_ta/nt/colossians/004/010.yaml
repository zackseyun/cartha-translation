source:
  edition: SBLGNT
  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: ta
  text: என் உடன்கைதியான அரிஸ்தர்க்கு உங்களுக்கு வாழ்த்துத் தெரிவிக்கிறார். பர்னபாவின் ஒன்றுவிட்ட சகோதரரான மாற்கும்[a] உங்களுக்கு வாழ்த்துத் தெரிவிக்கிறார். (இவரைக் குறித்து நீங்கள் அறிவுறுத்தல்களைப் பெற்றிருக்கிறீர்கள்; அவர் உங்களிடம் வந்தால், அவரை வரவேற்றுக்கொள்ளுங்கள்[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘பர்னபாவின் சகோதரர் அல்லது சகோதரியின் மகனான மாற்கு.’ சில பழைய மொழிபெயர்ப்புகள் ἀνεψιός என்ற சொல்லை இவ்வாறு வழங்குகின்றன; ஆனால் கொய்னே கிரேக்கத்தில் ‘ஒன்றுவிட்ட சகோதரர்’ என்பதே துல்லியமான பொருள்.'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘அவரை ஏற்றுக்கொள்ளுங்கள்.’ கிரேக்க வினைச்சொல் ஒருவரை, குறிப்பாக விருந்தோம்பலுடன், ஏற்றுக்கொள்வதைக் குறிக்கலாம்; ‘வரவேற்றுக்கொள்ளுங்கள்’ என்பது அந்தப் பொருளை நவீனத் தமிழில் தெளிவாக்குகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: வாழ்த்துத் தெரிவிக்கிறார்
  rationale: கடிதத்தின் இறுதியில் மற்றொருவரின் வாழ்த்தைத் தெரிவிக்கும் வழக்கமான கிரேக்கப் பயன்பாட்டை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: συναιχμάλωτός
  choice: உடன்கைதி
  rationale: ஒருவருடன் சேர்ந்து சிறைப்பட்டிருப்பவரைக் குறிக்கும் கூட்டுச்சொல்லின் நேரடியான பொருளைப் பாதுகாக்கிறது; சிறைவாசம் நேரடியானதா உருவகமானதா என்பதை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
- source_word: ἀνεψιὸς
  choice: ஒன்றுவிட்ட சகோதரர்
  rationale: கொய்னே கிரேக்கத்தில் இச்சொல் பொதுவாக cousin என்ற குறிப்பான உறவைக் குறிக்கிறது. தமிழில் பாலினத்திற்கேற்ற, புரிந்துகொள்ளத்தக்க உறவுமுறைச் சொல்லாக இது தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐλάβετε ἐντολάς
  choice: நீங்கள் அறிவுறுத்தல்களைப் பெற்றிருக்கிறீர்கள்
  rationale: ἐντολή என்பதிலுள்ள அதிகாரப்பூர்வ வழிகாட்டுதலின் வலிமையை வைத்துக்கொண்டு, இச்சூழலில் அளவுக்கு மீறிய கடுமையை ஏற்படுத்தாத இயல்பான தமிழை வழங்குகிறது.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: அவர் உங்களிடம் வந்தால்
  rationale: ἐάν உடன் வரும் இறந்தகாலத் துணைவினையின் எதிர்கால நிபந்தனைப் பொருளைத் தெளிவான தமிழில் தருகிறது.
- source_word: δέξασθε αὐτόν
  choice: அவரை வரவேற்றுக்கொள்ளுங்கள்
  rationale: பயணத்திலும் விருந்தோம்பலிலும் ஒருவரை ஏற்றுக்கொண்டு உபசரிக்கும் δέχομαι என்பதன் உறவுசார் வலிமையை நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: συναιχμάλωτός μου என்பதில் பவுலுக்கும் அரிஸ்தர்க்குக்கும் உள்ள உறவின் தன்மை
  choice: என் உடன்கைதியான
  alternative: ஆண்டவரில் என்னுடன் சிறைப்பட்டவர்; துன்பத்தில் என் உடன் ஊழியர்
  rationale: சொல்லின் நேரடிப் பொருள் மட்டும் தரப்பட்டுள்ளது. இது உண்மையான சிறைவாசமா உருவகப் பயன்பாடா என்பதை வசனம் தெளிவுபடுத்தாததால் அந்தத் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாழ்த்து வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; அடைப்புக்குறிப்பிலுள்ள அறிவுறுத்தல் அப்படியே பாதுகாக்கப்பட்டுள்ளது. உறவுமுறைச் சொல்லின் துல்லியத்தையும் விருந்தோம்பல் சார்ந்த கட்டளையின் வலிமையையும் வெளிப்படுத்த அடிக்குறிப்புகள் சேர்க்கப்பட்டுள்ளன.
