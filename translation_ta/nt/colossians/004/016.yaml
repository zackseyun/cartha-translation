source:
  edition: SBLGNT
  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: ta
  text: இந்தக் கடிதம் உங்களிடையே வாசிக்கப்பட்டதும்[a], அது லவோதிக்கேயர்களின் திருச்சபையிலும் வாசிக்கப்படும்படி ஏற்பாடு செய்யுங்கள். லவோதிக்கேயாவிலிருந்து வந்த கடிதத்தை[b] நீங்களும் வாசியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘வாசிக்கப்பட்ட’ என்பது திருச்சபைக் கூட்டத்தில் அனைவரும் கேட்கும்படி வாசிக்கப்படுவதைக் குறிக்கக்கூடும்; ஆனால் ‘சத்தமாக’ அல்லது ‘பொதுவாக’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லை.
    reason: lexical_alternative
  - marker: b
    text: இந்தக் கடிதம் எது என்பது உறுதியாகத் தெரியவில்லை. கிரேக்கம் அது லவோதிக்கேயாவுடன் தொடர்புடைய கடிதம் என்று மட்டுமே கூறுகிறது; அது முதலில் லவோதிக்கேயர்களுக்கு எழுதப்பட்டது என்று கட்டாயமாகக் கூறவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: வாசிக்கப்பட்ட / வாசியுங்கள்
  rationale: ἀναγινώσκω என்பதன் அடிப்படைப் பொருள் ‘வாசி’. தொடக்கக் காலத் திருச்சபைச் சூழலில் இது கூட்டத்தின்முன் வாசிப்பதைக் குறிக்கக்கூடும்; ஆனால் ‘சத்தமாக’ அல்லது ‘பொதுவாக’ என்பது கிரேக்கத்தில் வெளிப்படையாகச் சொல்லப்படாததால் எளிய ‘வாசி’ என்பதே முதன்மை உரையில் வைக்கப்பட்டது.
- source_word: παρ’ ὑμῖν
  choice: உங்களிடையே
  rationale: παρά + dative இங்கு கொலோசெயர் சமூகத்தின் நடுவில் கடிதம் வாசிக்கப்படுவதைச் சுட்டுகிறது. ‘உங்களால்’ என்பதைக் காட்டிலும் ‘உங்களிடையே’ என்பது சமூக மற்றும் இடஞ்சார் பொருளை நன்கு தருகிறது.
- source_word: ἡ ἐπιστολή
  choice: இந்தக் கடிதம்
  rationale: குறிப்பிட்ட உருபு தற்போது கொலோசெயருக்கு அனுப்பப்படும் இதே கடிதத்தைச் சுட்டுகிறது. தமிழில் ‘இந்தக் கடிதம்’ என்பது அந்தச் சுட்டுதலை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: ποιήσατε ἵνα
  choice: வாசிக்கப்படும்படி பார்த்துக்கொள்ளுங்கள்
  rationale: ποιέω என்ற இறந்தகாலக் கட்டளை வினை ἵνα தொடருடன் சேர்ந்து, குறிப்பிட்ட செயல் நடைபெறுவதை உறுதிசெய்யும் கட்டளையாக உள்ளது. இந்தத் தமிழாக்கம் அதன் கட்டளை வலிமையையும் இயல்பான மொழிநடையையும் காக்கிறது.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: லவோதிக்கேயர்களின் திருச்சபையில்
  rationale: ἐκκλησία பவுலின் சூழலில் ‘திருச்சபை’ என்றும், Λαοδικέων அந்தச் சமூகத்தைச் சேர்ந்த மக்களைக் குறிக்கும் உரிமை/விளக்க வேற்றுமையாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: τὴν ἐκ Λαοδικείας
  choice: லவோதிக்கேயாவிலிருந்து வரும் கடிதம்
  rationale: கிரேக்கத்தில் ‘கடிதம்’ என்ற பெயர்ச்சொல் முன்சூழலிலிருந்து புரிந்துகொள்ளப்பட்டு விடப்பட்டுள்ளது. தமிழில் தெளிவுக்காக அதை வெளிப்படையாகச் சேர்த்தாலும், ἐκ என்பதன் இயல்பான ‘இலிருந்து’ என்ற திசைப்பொருள் காக்கப்பட்டது. ‘வரும்’ என்பது அது தற்போது லவோதிக்கேயாவில் இருந்து பெறப்பட வேண்டிய கடிதம் என்பதை இயல்பாகக் காட்டுகிறது; முதலில் அங்கே எழுதப்பட்டது அல்லது அங்கேயுள்ளவர்களுக்கு முகவரியிடப்பட்டது என்று தீர்மானிக்கவில்லை.
theological_decisions:
- issue: ‘லவோதிக்கேயாவிலிருந்து வரும் கடிதம்’ என்பதன் அடையாளம்
  choice: அது எந்தக் கடிதம் என்று அடையாளப்படுத்தாமல், லவோதிக்கேயாவுடனான அதன் உறவை மட்டும் மொழிபெயர்த்தல்
  alternative: லவோதிக்கேயர்களுக்கு பவுல் எழுதிய கடிதம்; லவோதிக்கேயாவிலிருந்து கொலோசெயுக்கு அனுப்பப்பட்ட கடிதம்; எபேசியர் உட்பட லவோதிக்கேயாவுடன் தொடர்புடைய சுற்றறிக்கைக் கடிதம்
  rationale: கிரேக்க உரை அந்த ஆவணத்தின் துல்லியமான அடையாளத்தையோ அதன் முதன்மை முகவரியையோ கூறவில்லை. எனவே எந்தக் கனோனிய அல்லது கனோனுக்கு அப்பாற்பட்ட கடிதத்துடனும் அதைச் சமமாக்காமல் வரலாற்று மற்றும் இறையியல் தெளிவின்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான திருச்சபை மொழிநடை பயன்படுத்தப்பட்டது. ‘திருச்சபை’, ‘கடிதம்’, ‘வாசியுங்கள்’ போன்ற பரவலாக அறியப்பட்ட சொற்கள் தேர்ந்தெடுக்கப்பட்டன; கிரேக்கத்தின் கட்டளைத் தொனியும் ஆவணத்தின் அடையாளம் குறித்த தெளிவின்மையும் காக்கப்பட்டன.
