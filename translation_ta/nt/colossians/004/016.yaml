revisions:
- from: இந்தக் கடிதம் உங்களிடையே வாசிக்கப்பட்ட பின்பு[a], இது லவோதிக்கேயர்களின் திருச்சபையிலும் வாசிக்கப்படும்படி பார்த்துக்கொள்ளுங்கள். அதுபோல, லவோதிக்கேயாவிலிருந்து வரும் கடிதத்தையும்[b] நீங்களும் வாசியுங்கள்.
  to: இந்தக் கடிதம் உங்களிடையே வாசிக்கப்பட்டதும்[a], அது லவோதிக்கேயர்களின் திருச்சபையிலும் வாசிக்கப்படும்படி ஏற்பாடு செய்யுங்கள். லவோதிக்கேயாவிலிருந்து வந்த கடிதத்தை[b] நீங்களும் வாசியுங்கள்.
  rationale: The revision removes the added prospective sense of ‘வரும்’ and the corresponding implication of future receipt in the footnote. It retains the Greek’s ellipsis by supplying ‘கடிதம்’ for clarity, while rendering ἐκ Λαοδικείας neutrally as ‘லவோதிக்கேயாவிலிருந்து வந்த.’ The imperative force of ποιήσατε ἵνα is retained with ‘வாசிக்கப்படும்படி ஏற்பாடு செய்யுங்கள்,’ and no historical identification of the Laodicean letter is imposed.
