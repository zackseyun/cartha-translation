  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ta
  text: 'இந்த நோக்கத்திற்காகவே அவரை உங்களிடம் அனுப்பினேன்: எங்கள் நிலவரத்தை நீங்கள் அறிந்துகொள்ளவும்[a], அவர் உங்கள் உள்ளங்களை ஊக்கப்படுத்தவும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “உங்கள் நிலவரத்தை நாங்கள் அறிந்துகொள்ளவும்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: அவரை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தீகிக்குவைக் குறிக்கும் ஆண்பால் ஒருமை உறவுப்பெயர்; தமிழில் மரியாதையும் இயல்பும் காக்க ‘அவரை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἔπεμψα
  choice: அனுப்பியதே
  rationale: இறந்தகால அனுப்புதல் செயலைக் காட்டுகிறது; ‘-தே’ என்பது தொடர்ந்து வரும் εἰς αὐτὸ τοῦτο என்பதன் அழுத்தத்தை இயல்பான தமிழில் முன்னிறுத்துகிறது.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம்
  rationale: அனுப்பப்படும் நபரின் இலக்கை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: εἰς αὐτὸ τοῦτο
  choice: இந்தக் குறிப்பிட்ட நோக்கத்திற்காகத்தான்
  rationale: αὐτὸ τοῦτο தரும் வலியுறுத்தலை ‘குறிப்பிட்ட’ மற்றும் ‘-தான்’ இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: ἵνα
  choice: அறிந்துகொள்ளவும் … ஊக்கப்படுத்தவும் வேண்டும்
  rationale: இரண்டு இணையான நோக்கங்களைத் தமிழ் வினையெச்சத் தொடராலும் ‘வேண்டும்’ என்பதாலும் தெளிவாகக் காட்டுகிறது.
- source_word: γνῶτε
  choice: நீங்கள் அறிந்துகொள்ளவும்
  rationale: ἵνα-வுடன் வரும் நோக்கப் பொருளைச் சுட்டுகிறது; ‘அறிந்துகொள்ள’ என்பது தகவலைப் பெற்றறியும் இச்சூழலுக்கு இயல்பானது.
- source_word: τὰ περὶ ἡμῶν
  choice: எங்கள் நிலை எப்படி இருக்கிறது என்பதை
  rationale: ‘எங்களைப் பற்றிய காரியங்கள்’ என்ற சொற்சொல் வடிவத்தைத் தவிர்த்து, பவுலும் அவரோடு இருப்போரும் உள்ள சூழ்நிலையைத் தனிப்பட்ட முறையில் தெரிவிக்கிறது.
- source_word: παρακαλέσῃ
  choice: ஊக்கப்படுத்தவும்
  rationale: παρακαλέω என்பதன் ஆறுதல், வலுப்படுத்துதல், ஊக்கமளித்தல் ஆகிய பரப்பை இச்சூழலில் மிகையாகக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: τὰς καρδίας ὑμῶν
  choice: உங்கள் உள்ளங்களை
  rationale: καρδία குறிக்கும் உள்ளார்ந்த மனம், உணர்வு, மனவுறுதி ஆகியவற்றை நவீன தமிழில் இயல்பாகத் தருகிறது; உடல் உறுப்பைக் குறிப்பதாகத் தவறாகப் புரிவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: நோக்கவாக்கியத்திலுள்ள பிரதிப்பெயர்கள் குறித்த பாட வேறுபாடு
  choice: SBLGNT பாடத்தின்படி ‘எங்கள் நிலை எப்படி இருக்கிறது என்பதை நீங்கள் அறிந்துகொள்ளவும்’ என்று முதன்மை உரையில் தரப்பட்டது.
  alternative: சில கையெழுத்துப் பிரதிகளில், ‘உங்கள் நிலை எப்படி இருக்கிறது என்பதை நாங்கள் அறிந்துகொள்ளவும்’ என்று உள்ளது.
  rationale: வழங்கப்பட்ட மூலப்பதிப்பின் γνῶτε τὰ περὶ ἡμῶν என்ற பாடம் முதன்மை உரையில் பின்பற்றப்படுகிறது. அறிவது யார், யாருடைய நிலை அறியப்படுகிறது என்பதையே மாற்றும் முக்கியமான மாற்றுப் பாடம் வெளிப்படைத்தன்மைக்காக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கையாளுகிறது. மூலத்தின் வலியுறுத்தலை ‘அனுப்பியதே … நோக்கத்திற்காகத்தான்’ என்றும், இரட்டை நோக்கத்தை ‘அறிந்துகொள்ளவும் … ஊக்கப்படுத்தவும்’ என்றும் தெளிவாக வைத்துள்ளது. ‘உள்ளங்கள்’ என்பது வேதாகமத்தின் உள்ளார்ந்த மனிதரைச் சுட்டும் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
