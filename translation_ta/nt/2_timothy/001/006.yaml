- from: இதன் காரணமாக, என் கைகளை உன்மேல் வைத்ததன் மூலம் உனக்குள் இருக்கிற கடவுளுடைய அருள்கொடையை மீண்டும் தழலவிடும்படி உனக்கு நினைவூட்டுகிறேன்.[a]
  to: இதன் காரணமாக, என் கைகளை உன் மீது வைத்ததன் மூலம் உனக்குள் இருக்கும் கடவுளுடைய அருள்கொடையை மீண்டும் சுடர்விடச் செய்யும்படி உனக்கு நினைவூட்டுகிறேன்.[a]
