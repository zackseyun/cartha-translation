    issue: Footnote alternative needs to correspond distinctly to the revised main rendering
    rationale: With “சுடர்விடச் செய்யும்படி” in the text, “கொழுந்துவிட்டு எரியச் செய்யும்படி” remains a useful alternate expression of the Greek fire metaphor.
