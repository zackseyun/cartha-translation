  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: ta
  text: இதன் காரணமாக, என் கைகளை உன் மீது வைத்ததன் மூலம் உனக்குள் இருக்கும் கடவுளுடைய அருள்கொடையை மீண்டும் சுடர்விடச் செய்யும்படி உனக்கு நினைவூட்டுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் கொழுந்துவிட்டு எரியச் செய்யும்படி.” கிரேக்க வினை, நெருப்பைத் தூண்டி மீண்டும் முழுத் தழலுடன் எரியச் செய்வதைக் குறிக்கும் உருவகத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: இதன் காரணமாக
  rationale: முந்தைய கருத்துடன் உள்ள காரணத் தொடர்பை இயல்பான நவீனத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀναμιμνῄσκω
  choice: உனக்கு நினைவூட்டுகிறேன்
  rationale: நிகழ்கால வினையின் நேரடியான பொருளையும், ஒருவரைச் செயலில் ஈடுபட நினைவூட்டும் அமைப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σε ἀναζωπυρεῖν
  choice: மீண்டும் தழலவிடும்படி
  rationale: அணையத் தொடங்கிய நெருப்பை மீண்டும் முழு வீச்சில் எரியச் செய்யும் கிரேக்க வினையின் உருவகத்தைத் தமிழில் உயிரோட்டமாகப் பாதுகாக்கிறது.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: கடவுளுடைய அருள்கொடை
  rationale: χάρισμα என்பதில் உள்ள அருளால் வழங்கப்பட்ட கொடை என்ற நுண்பொருளைத் தருகிறது; அதைக் குறிப்பிட்ட வகையான ஆன்மிக வரமாக அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: உனக்குள் இருக்கிற
  rationale: அந்தக் கொடை தீமோத்தேயுவில் தற்போது இருக்கிறது என்ற உறவுச் சொற்றொடரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: என் கைகளை உன்மேல் வைத்ததன் மூலம்
  rationale: கைகளை வைத்தல் என்ற செயலைத் தெளிவாக்கி, διά உடன் வரும் கருவி அல்லது வழிமுறைப் பொருளை ‘மூலம்’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுல் கைகளை வைத்த செயலின் மூலம் அருள்கொடை கிடைத்ததன் இயல்பு
  choice: என் கைகளை உன்மேல் வைத்ததன் மூலம்
  alternative: நான் உன்மேல் கைகளை வைத்தபோது
  rationale: ‘மூலம்’ என்பது διά + genitive காட்டும் வழிமுறை அல்லது இடையீட்டுத் தொடர்பைப் பாதுகாக்கிறது. அதேவேளையில், வசனம் கூறுவதைத் தாண்டி ஒரு விரிவான சடங்கு அல்லது திருச்சாதனக் கோட்பாட்டை இதில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ‘அருள்கொடை’ என்பது χάρισμα என்பதின் அருள் சார்ந்த நுண்பொருளைப் பாதுகாக்கிறது. நெருப்பு உருவகத்தை விளக்காமல் மொழிபெயர்ப்பிலேயே வைத்திருக்கிறது; மாற்று உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
