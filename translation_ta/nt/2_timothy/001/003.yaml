  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: ta
  text: இரவும் பகலும் என் வேண்டுதல்களில் உன்னை இடைவிடாமல் நினைவுகூருகிற நான், தூய மனச்சாட்சியுடன் என் முன்னோர்களின் வழியில் சேவிக்கும் கடவுளுக்கு[a][b] நன்றி செலுத்துகிறேன்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சேவிக்கும்” என்பதை “வழிபடும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் கடவுளுக்குச் செலுத்தப்படும் புனித சேவையையோ வழிபாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் முன்னோர்களின் வழியில்” என்பதற்கான கிரேக்கச் சொற்றொடர் இன்னும் சொற்சார்ந்த முறையில் “என் முன்னோர்களிடமிருந்து” என உள்ளது. இது முன்னோர்களின் நம்பிக்கையுடனும் இறைப்பணியுடனும் உள்ள தொடர்ச்சியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இன்னும் சொற்சார்ந்த முறையில், “என் வேண்டுதல்களில் உன்னைப் பற்றிய நினைவை இடைவிடாமல் கொண்டிருக்கிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: கடவுளுக்கு நன்றி செலுத்துகிறேன்
  rationale: கிரேக்க மரபுத்தொடர் நன்றியைத் தெரிவிப்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் நேரடியாகவும் இதே பொருளைத் தருகிறது.
- source_word: ᾧ λατρεύω
  choice: நான் பணிவிடை செய்யும்
  rationale: λατρεύω கடவுளுக்குச் செய்யப்படும் பக்தியுள்ள சேவையையும் வழிபாட்டையும் குறிக்கலாம். ‘பணிவிடை செய்யும்’ என்பது இந்த இரு கூறுகளையும் சாத்தியமான அளவு திறந்துவைக்கிறது.
- source_word: ἀπὸ προγόνων
  choice: என் முன்னோர்களைப் போலவே
  rationale: இது முன்னோர்களின் இறைநம்பிக்கையுடனும் இறைப்பணியுடனும் உள்ள தொடர்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: தூய மனச்சாட்சியோடு
  rationale: இச்சொற்றொடர் பணிவிடையின் முறையையோ உள்ளார்ந்த நெறிநிலையையோ குறிக்கிறது. ‘தூய மனச்சாட்சி’ நவீனத் தமிழில் தெளிவான இணை.
- source_word: ὡς
  choice: நினைவுகூர்ந்து
  rationale: தொடர்பை வெளிப்படையாகக் காரணமாகவோ காலமாகவோ மாற்றாமல், நன்றிசெலுத்துதலுடன் ஜெப நினைவுகூருதலைச் சூழ்நிலையாக இணைக்கும் வினையெச்ச அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀδιάλειπτον
  choice: இடைவிடாமல்
  rationale: தொடர்ச்சியான அல்லது தவறாத நினைவுகூருதலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὴν περὶ σοῦ μνείαν
  choice: உன்னை நினைவுகூர்ந்து
  rationale: சொற்சார்ந்த ‘உன்னைப் பற்றிய நினைவை உடையவனாக’ என்பதற்குப் பதிலாக, ஜெபச் சூழலில் இயல்பான தமிழைத் தருகிறது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: என் மன்றாட்டுகளில்
  rationale: δέησις குறிப்பாக வேண்டுதல் அல்லது விண்ணப்ப ஜெபத்தைக் குறிக்கும். ‘மன்றாட்டுகள்’ அந்தத் தன்மையைப் பொதுவான ‘ஜெபங்கள்’ என்பதைக் காட்டிலும் நுணுக்கமாகத் தக்கவைக்கிறது.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: இரவும் பகலும்
  rationale: தொடர்ச்சியான ஒழுங்கை உணர்த்தும் இயல்பான தமிழ் மரபுத்தொடர்.
theological_decisions:
- issue: ἀπὸ προγόνων என்பதில் பவுலுக்கும் அவரது யூத முன்னோர் மரபுக்கும் உள்ள உறவு
  choice: என் முன்னோர்களைப் போலவே
  alternative: என் முன்னோர்களிடமிருந்து தொடர்ந்து / என் முன்னோர்களின் வழியில்
  rationale: இறைவனைச் சேவிப்பதில் முன்னோர்களுடனான தொடர்ச்சியை இவ்வாசிப்பு காட்டுகிறது; அதேவேளையில் ஒரு குறிப்பிட்ட மரபியல் அல்லது சமயவியல் விளக்கத்தை வசனத்திற்குள் சேர்க்கவில்லை. மூலத்தின் சுருக்கமான வடிவத்திலுள்ள தெளிவின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: λατρεύω என்பதன் பொருள் எல்லை
  choice: பணிவிடை செய்யும்
  alternative: வழிபடும்
  rationale: இவ்வினைச்சொல் கடவுளுக்குரிய வழிபாட்டையும் புனித சேவையையும் குறிக்கக்கூடும். ‘பணிவிடை’ பரந்த பொருள் எல்லையைப் பேணுகிறது; ‘வழிபடும்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்பும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘மன்றாட்டுகள்’ ஜெபத்தின் வேண்டுதல் தன்மையைத் தக்கவைக்கிறது; ‘பணிவிடை’ சற்றே உயர்ந்த நடையாயினும் கடவுளுக்குரிய பக்திச் சேவையைத் தெளிவாகக் குறிக்கிறது. கிரேக்கத்தின் நீண்ட ஒரே வாக்கிய அமைப்பு தமிழிலும் இயல்பான வினையெச்சத் தொடர்புடன் பேணப்பட்டுள்ளது.
