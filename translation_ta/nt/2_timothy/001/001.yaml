id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: ta
  text: தேவனுடைய சித்தத்தின்படி மேசியாவாகிய இயேசுவின்[a] அப்போஸ்தலனான பவுல், மேசியாவாகிய இயேசுவில் உள்ள வாழ்வின் வாக்குறுதிக்கு ஏற்ப,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டு இடங்களிலும் ‘மேசியாவாகிய இயேசு’ என்பதற்குப் பதிலாக ‘கிறிஸ்து இயேசு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: பவுல்
  rationale: தனிப்பட்ட பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: பவுலின் அதிகாரப்பூர்வ பணியழைப்பைக் குறிக்கும் தொழில்நுட்பப் பொருளைப் பாதுகாக்கிறது; பொதுவான ‘தூதன்’ என்பதைக் காட்டிலும் குறிப்பானது.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைத் தக்கவைத்திருப்பதால், அதன் பொருளை மொழிபெயர்த்து இயல்பான தமிழில் இயேசுவோடு இணைக்கிறது.
- source_word: διὰ θελήματος θεοῦ
  choice: தேவனுடைய சித்தத்தின்படி
  rationale: பவுலின் அப்போஸ்தலப் பணி தேவனுடைய சித்தத்தால் அமைந்தது என்ற தெய்வீக அதிகாரத்தையும் மூலத்தின் உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατ’ ἐπαγγελίαν
  choice: வாக்குறுதிக்கு ஏற்ப
  rationale: κατά இங்குக் காட்டும் ஒத்திசைவு அல்லது இணக்க உறவைத் தீர்மானத்தை மிகைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவில் உள்ள வாழ்வு
  rationale: ‘வாழ்வு’ என்ற பொருளையும், ἐν குறிக்கும் மேசியாவுடனான உறவு அல்லது அவரில் காணப்படும் நிலை என்ற திறந்த பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இந்த வாழ்த்துரையில் Χριστός பட்டப்பெயராகப் புரிந்துகொள்ளப்படுவதால் ‘மேசியா’ என்று பொருள் மொழிபெயர்க்கப்பட்டது; தமிழில் வழக்கமான ‘கிறிஸ்து’ மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν Χριστῷ Ἰησοῦ என்பதன் உறவு
  choice: மேசியாவாகிய இயேசுவில் உள்ள
  alternative: மேசியாவாகிய இயேசுவின் மூலம் கிடைக்கும்
  rationale: ‘உள்ள’ என்பது மூலத்தின் இடவியல்/உறவியல் உருவகத்தையும் அதன் இறையியல் செறிவையும் பாதுகாக்கிறது; ‘மூலம் கிடைக்கும்’ என்று காரண உறவாக மட்டும் சுருக்கவில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலன்’ என்பது பரவலாக அறியப்பட்ட வேதாகமத் தொழில்நுட்பச் சொல் என்பதால் தக்கவைக்கப்பட்டது; ‘வாக்குத்தத்தம்’ என்பதைக் காட்டிலும் இன்றைய வாசகர்களுக்கு இயல்பான ‘வாக்குறுதி’ தேர்ந்தெடுக்கப்பட்டது.
