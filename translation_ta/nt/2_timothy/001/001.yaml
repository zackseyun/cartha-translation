  source_fidelity: 'மூலக் கிரேக்கத்தின் கூறுகள் அனைத்தும் தக்கவைக்கப்பட்டுள்ளன: பவுலின் அப்போஸ்தல அடையாளம், அது தேவனுடைய சித்தத்தால் அமைந்தது, மேலும் மேசியாவாகிய இயேசுவில் உள்ள வாழ்வின் வாக்குறுதியுடன் அதன் தொடர்பு ஆகியவை தெளிவாக உள்ளன. ‘மேசியாவாகிய இயேசுவின் அப்போஸ்தலனான’ என்பது Χριστοῦ Ἰησοῦ-வின் உடைமை/தொடர்புப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘வாக்குறுதிக்கு ஏற்ப’ κατ’ ἐπαγγελίαν-ஐப் பாதுகாக்கிறது.'
  naturalness: வாக்கியம் நவீன மரியாதைமிக்க பொதுத்தமிழில் இயல்பாக உள்ளது. தொடக்க வாழ்த்துரைக்குரிய முறையான நடை, மற்றும் மூலத்தில் உள்ள நிறைவுறாத வாக்கிய அமைப்பைச் சுட்டும் இறுதி காற்புள்ளி, இரண்டும் பொருத்தமானவை.
  terminology: ‘அப்போஸ்தலன்’ நிலைபெற்ற வேதாகமத் தொழில்நுட்பச் சொல்லாகச் சரியானது. Χριστός பட்டப்பெயரின் பொருளை ‘மேசியாவாகிய’ என வெளிப்படுத்தியிருப்பது திட்டக் கொள்கையோடும் மூலத்தின் பட்டப்பெயர் வலிமையோடும் ஒத்துள்ளது. மாற்று ‘கிறிஸ்து இயேசு’ அடிக்குறிப்பு இரு நிகழ்வுகளுக்கும் தெளிவாகப் பொருந்துகிறது.
