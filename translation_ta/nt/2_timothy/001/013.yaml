source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: ta
  text: நீ என்னிடமிருந்து கேட்ட ஆரோக்கியமான வார்த்தைகளின் மாதிரியை, மெசியா இயேசுவில்[c] உள்ள விசுவாசத்தோடும்[a] அன்போடும் பற்றிக்கொண்டிரு.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மைப்பற்றோடும் அன்போடும்.” “விசுவாசம்” என்பதற்கான கிரேக்கச் சொல் “உண்மைப்பற்று” அல்லது “நம்பிக்கை” என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மெசியா இயேசுவில் உள்ள விசுவாசத்தையும் அன்பையும் பற்றிய, நீ என்னிடமிருந்து கேட்ட ஆரோக்கியமான வார்த்தைகளின் மாதிரியைப் பற்றிக்கொண்டிரு.” கிரேக்கத் தொடரமைப்பின்படி, விசுவாசமும் அன்பும் தீமோத்தேயு அந்த மாதிரியைப் பற்றிக்கொள்ளும் விதத்தையோ, அவன் கேட்ட வார்த்தைகளின் உள்ளடக்கத்தையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: 'மரபுவழி மொழிபெயர்ப்பு: “கிறிஸ்து இயேசு.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: மாதிரி
  rationale: இந்தச் சொல் பின்பற்றத்தக்க வடிவம், வரைவு, அல்லது முன்மாதிரி என்ற பொருளைக் கொண்டது. “மாதிரி” என்பது அதன் வழிகாட்டும் தன்மையை மிகையாக விளக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔχε
  choice: பற்றிக்கொண்டிரு
  rationale: சொல்லுக்குச் சொல் அளவில் “வைத்திரு” என்றாலும், இங்குள்ள கட்டளை அப்போஸ்தலரிடமிருந்து பெற்ற மாதிரியைத் தொடர்ந்து உறுதியாகக் கடைப்பிடிப்பதைக் குறிக்கிறது.
- source_word: ὑγιαινόντων λόγων
  choice: நலமான வார்த்தைகள்
  rationale: ὑγιαίνω என்பதன் நலம்/ஆரோக்கியம் என்ற உருவகத்தை “நலமான” காக்கிறது; λόγοι என்பதற்கு “போதனை” என்று விளக்கிவிடாமல் “வார்த்தைகள்” என நெருக்கமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: நீ என்னிடமிருந்து கேட்ட
  rationale: παρά உடன் வரும் பிறப்புவேற்றுமை இங்கு மூலத்தைக் குறிக்கிறது; அதனால் “என்னிடமிருந்து” என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐν πίστει
  choice: விசுவாசத்தோடும்
  rationale: πίστις என்பதற்கு இங்கு முதன்மையாக “விசுவாசம்” தேர்ந்தெடுக்கப்பட்டுள்ளது. உடன் வேற்றுமை, மாதிரியைப் பற்றிக்கொள்ள வேண்டிய விதம் அல்லது சூழலை இயல்பான தமிழில் தெரிவிக்கிறது; “உண்மைப்பற்று” என்ற சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: καὶ ἀγάπῃ
  choice: அன்போடும்
  rationale: ἀγάπη என்பதன் நேரடியான, இயல்பான தமிழ் இணை “அன்பு.”
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: மெசியா இயேசுவில் உள்ள
  rationale: முன்னுள்ள விசுவாசம், அன்பு இரண்டையும் இந்தச் சொற்றொடர் சார்ந்ததாகப் புரிந்துகொள்ளப்படுகிறது. “இல் உள்ள” என்பது ἐν என்பதையும் அவற்றின் மெசியாவுடனான தொடர்பையும் கூடுதல் விளக்கமின்றிக் காக்கிறது.
- source_word: Χριστῷ Ἰησοῦ
  choice: மெசியா இயேசு
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைத்திருப்பதால் “மெசியா” என மொழிபெயர்க்கப்பட்டுள்ளது; மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ என்பதன் தொடர்பு
  choice: இந்தச் சொற்றொடர் தீமோத்தேயு அந்த மாதிரியைப் பற்றிக்கொள்ளும் விதம் அல்லது சூழலை—மெசியா இயேசுவில் உள்ள விசுவாசத்தோடும் அன்போடும்—குறிப்பதாக முதன்மை உரையில் கொள்ளப்பட்டுள்ளது.
  alternative: இது “நலமான வார்த்தைகளின்” உள்ளடக்கத்தை, அதாவது மெசியா இயேசுவில் உள்ள விசுவாசத்தையும் அன்பையும் பற்றிய வார்த்தைகளை, விவரிக்கலாம்.
  rationale: கிரேக்கத் தொடரமைப்பு இரு தொடர்புகளுக்கும் இடமளிக்கிறது. அறிவுறுத்தலின் ஓட்டம் முதன்மை வாசிப்பை ஆதரித்தாலும், தெளிவாக முடிவுசெய்ய முடியாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இந்தப் பவுலின் சொல்லிணைப்பில் Χριστός பட்டப்பெயரின் பொருளை இன்னும் கொண்டிருப்பதால் “மெசியா” தேர்ந்தெடுக்கப்பட்டுள்ளது; பழக்கமான மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. உரை கண்ணியமானதாயும் சாதாரண வாசகருக்குப் புரியத்தக்கதாயும் உள்ளது. “நலமான வார்த்தைகள்” கிரேக்கத்தின் நலம்/ஆரோக்கியம் உருவகத்தையும் λόγοι என்பதன் “வார்த்தைகள்” என்ற வடிவத்தையும் காக்கிறது; “பற்றிக்கொண்டிரு” கட்டளையின் தொடர்ச்சியான, உறுதியான தன்மையை வெளிப்படுத்துகிறது.
