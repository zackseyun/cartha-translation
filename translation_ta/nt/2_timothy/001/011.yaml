- from: அதற்காக நான் அறிவிப்பாளராகவும்[a] அப்போஸ்தலனாகவும் கற்பிப்பவராகவும் நியமிக்கப்பட்டேன்.
  to: அதற்காக நான் அறிவிப்பாளராகவும்[a] அப்போஸ்தலனாகவும் ஆசிரியராகவும் நியமிக்கப்பட்டேன்.
  rationale: Only the rendering of διδάσκαλος has been adjusted from the more periphrastic “கற்பிப்பவர்” to the idiomatic, parallel role-noun “ஆசிரியர்.” The antecedent of “அதற்காக” remains unspecified, as in the Greek and its context, and the footnote continues to identify “பிரசங்கி” as a viable alternative for κῆρυξ.
