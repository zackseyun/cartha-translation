id: 2TI.1.11
reference: 2 Timothy 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος καὶ ⸀διδάσκαλος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/011.yaml
  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: ta
  text: அதற்காக நான் அறிவிப்பாளராகவும்[a] அப்போஸ்தலனாகவும் ஆசிரியராகவும் நியமிக்கப்பட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிரசங்கியாகவும்.’ கிரேக்கச் சொல் அதிகாரப்பூர்வமாக ஒரு செய்தியைப் பொதுவில் அறிவிப்பவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: அதற்காக
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட நற்செய்தி அல்லது அதற்கான சாட்சியத்தைப் பின்னோக்கிச் சுட்டுகிறது. எதைச் சுட்டுகிறது என்பதைத் தேவையின்றி வெளிப்படையாக்காமல், நோக்கம் அல்லது தொடர்பு என்ற பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐτέθην
  choice: நியமிக்கப்பட்டேன்
  rationale: இங்கு τίθημι என்பதன் செயப்பாட்டு வடிவம், தொடர்ந்து வரும் பணிப் பொறுப்புகளுக்காக நியமிக்கப்படுதலைக் குறிக்கிறது; வெறுமனே ஓர் இடத்தில் வைக்கப்பட்டதை அல்ல.
- source_word: ἐγὼ
  choice: நான்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள எழுவாயைத் தமிழிலும் வைத்திருக்கிறது. ‘நானே’ என்று மொழிபெயர்ப்பது இச்சூழலில் மூலத்திலுள்ள அழுத்தத்தை அளவுக்கு மீறி வலுப்படுத்தக்கூடும்.
- source_word: κῆρυξ
  choice: அறிவிப்பாளர்
  rationale: அதிகாரப்பூர்வமாகவும் பொதுவெளியிலும் ஒரு செய்தியை அறிவிப்பவரைக் குறிக்கும் சொல்லின் அடிப்படைப் பொருளைக் காக்கிறது; பிற்காலத் திருச்சபைப் பதவிப் பொருளைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: பவுல் தன்னைப் பற்றிப் பயன்படுத்தும் அங்கீகரிக்கப்பட்ட பணிப்பெயரைப் பாதுகாக்கிறது; பொதுவான ‘தூதுவன்’ அல்லது ‘அனுப்பப்பட்டவன்’ என்பதைக் காட்டிலும் இச்சூழலுக்குத் துல்லியமானது.
- source_word: διδάσκαλος
  choice: கற்பிப்பவர்
  rationale: ‘ஆசிரியர்’ என்ற சொல் பள்ளிக்கூடச் சூழலை அதிகமாக நினைவூட்டலாம்; ‘போதகர்’ என்பது குறிப்பிட்ட திருச்சபைப் பதவியாகப் புரிந்துகொள்ளப்படலாம். ‘கற்பிப்பவர்’ மூலத்தின் பொதுவான பணிப்பொருளை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: κῆρυξ என்பதை மரபுவழித் திருச்சபைச் சொல்லான ‘பிரசங்கி’ என மொழிபெயர்ப்பதா, அல்லது அதன் அதிகாரப்பூர்வப் பொது அறிவிப்பு நுணுக்கத்தை வெளிப்படுத்துவதா
  choice: அறிவிப்பாளர்
  alternative: பிரசங்கி
  rationale: பவுலுக்கு ஒப்படைக்கப்பட்ட பணிகளின் பட்டியலில், இச்சொல் அதிகாரத்துடன் செய்தியைப் பொதுவாக அறிவிக்கும் பணியை முன்னிறுத்துகிறது. ‘பிரசங்கி’ என்பது பொருத்தமான மாற்றாக இருந்தாலும், பிற்காலத் திருச்சபைப் பணிப்பதவியைக் குறிக்கும் குறுகிய பொருளில் வாசிக்கப்படலாம்.
translation_notes:
  register: நவீன பொதுத்தமிழில், சுருக்கமானதும் கண்ணியமானதுமான நடையைப் பயன்படுத்துகிறது. மூன்று பணிகளையும் இணையான அமைப்பில் தருகிறது; ‘அதற்காக’ என்பது முந்தைய சூழலுக்கான சுட்டின் இயல்பான தெளிவின்மையைப் பாதுகாக்கிறது.
