  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: ta
  text: ஆகவே, நம்முடைய ஆண்டவரைப் பற்றிய சாட்சியைக் கண்டு வெட்கப்படாதே; அவருடைய கைதியாகிய என்னைக் கண்டும் வெட்கப்படாதே. மாறாக, கடவுளுடைய வல்லமைக்கு ஏற்ப[c] நற்செய்திக்காகத் துன்பத்தில் பங்குகொள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “நற்செய்தியோடு சேர்ந்து துன்பப்படு.” கிரேக்க வினைச்சொல் மற்றவர்களுடன் சேர்ந்து துன்பத்தை அனுபவிக்கும் கருத்தை உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கடவுளுடைய வல்லமையால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: ஆகவே, ... வெட்கப்படாதே
  rationale: οὖν முந்தைய கருத்திலிருந்து வரும் முடிவைச் சுட்டுகிறது; μή உடன் வரும் வினை தடை அல்லது அறிவுறுத்தலைத் தெரிவிக்கிறது.
- source_word: ἐπαισχυνθῇς
  choice: வெட்கப்படாதே
  rationale: அவமானம் கருதிப் பின்வாங்குதல் என்ற சமூக-ஒழுக்க வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: நம்முடைய ஆண்டவரைப் பற்றிய சாட்சி
  rationale: மரபணைத் தொடர்பை இங்கு ஆண்டவரைக் குறித்த சாட்சி என்ற objective genitive ஆகப் புரிந்துகொள்வது சூழலுக்கு ஏற்றது; மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: அவருடைய கைதியாகிய என்னைக் குறித்தும் வெட்கப்படாதே
  rationale: இரண்டாவது வெட்கத்தின் பொருளைத் தமிழில் வெளிப்படையாக்குகிறது; αὐτοῦ காட்டும் ஆண்டவருடனான உடைமை/தொடர்பை ‘அவருடைய கைதி’ பாதுகாக்கிறது.
- source_word: συγκακοπάθησον
  choice: துன்பத்தை என்னோடு பகிர்ந்துகொள்
  rationale: συν- முன்னொட்டு குறிக்கும் உடன் பங்கேற்பை வெளிப்படுத்துகிறது; சூழலில் பேசுபவரான பவுலுடன் சேர்ந்து துன்பப்படுதல் இயல்பாகப் புரிகிறது, ஆனால் அடிக்குறிப்பு வேறு கட்டமைப்பையும் பதிவு செய்கிறது.
- source_word: τῷ εὐαγγελίῳ
  choice: நற்செய்திக்காக
  rationale: கிரேக்க வேற்றுமைத் தொடர்பை இயல்பான தமிழில் நோக்கம்/காரணத் தொடர்பாக வெளிப்படுத்துகிறது; ‘நற்செய்தி’ ordinary modern Tamil-ல் தெளிவான சொல்.
- source_word: κατὰ δύναμιν θεοῦ
  choice: கடவுளுடைய வல்லமைக்கு ஏற்ப
  rationale: κατά என்பதன் அளவு, நியதி அல்லது ஒத்திசைவு சார்ந்த திறந்த பொருளை ‘ஏற்ப’ பாதுகாக்கிறது; அதனை வெறும் கருவியாக மட்டும் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: ‘சாட்சி’க்கும் ‘நம்முடைய ஆண்டவர்’ என்பதற்கும் இடையிலான தொடர்பு
  choice: ஆண்டவரைப் பற்றிய சாட்சி
  alternative: நம்முடைய ஆண்டவருடைய சாட்சி
  rationale: சூழலில் கிறிஸ்துவை மையமாகக் கொண்ட சாட்சியைக் குறித்து வெட்கப்பட வேண்டாம் என்பதே மிக இயல்பான வாசிப்பு; கிரேக்க மரபணையின் உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘அவருடைய கைதி’ என்பதன் வலிமை
  choice: அவருடைய கைதியாகிய நான்
  alternative: அவருக்காகக் கைதியான நான்
  rationale: αὐτοῦ தரும் உடைமை/சார்பு உறவை அப்படியே வைத்திருக்கிறது; சிறைப்பட்டதற்கான காரணத்தை மட்டும் எனச் சுருக்கி விடவில்லை.
- issue: சிரமத்தில் உடன் பங்கேற்பவர் யார்
  choice: என்னோடு துன்பத்தைப் பகிர்ந்துகொள்
  alternative: நற்செய்திக்காகத் துன்பத்தில் பங்குகொள்
  rationale: συγκακοπάθησον என்பதில் உள்ள கூட்டு பங்கேற்பு வலிமையைத் தமிழில் தெளிவாக்குகிறது. ‘என்னோடு’ என்பது உடனடி உரையாடல் சூழலால் பெறப்படுகிறது; மாற்று கட்டமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: κατὰ δύναμιν θεοῦ என்பதன் தொடர்பு
  choice: கடவுளுடைய வல்லமைக்கு ஏற்ப
  alternative: கடவுளுடைய வல்லமையால்
  rationale: வல்லமை அளவா, நியதியா, செயலாற்றும் அடிப்படையா என்ற கிரேக்கத்தின் நுண்மையான திறந்த தன்மையை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் கொண்ட ஒருமை அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத் தொடர்புகள் இயல்பான தமிழுக்காகத் தெளிவாக்கப்பட்டாலும், உண்மையான இலக்கண மற்றும் இறையியல் மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
