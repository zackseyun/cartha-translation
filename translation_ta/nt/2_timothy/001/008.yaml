- from: ஆகவே, நம்முடைய ஆண்டவரைப் பற்றிய சாட்சியைக் குறித்து[a] வெட்கப்படாதே; அவருடைய கைதியாகிய என்னைக் குறித்தும் வெட்கப்படாதே. மாறாக, கடவுளுடைய வல்லமைக்கு ஏற்ப[c] நற்செய்திக்காகத் துன்பத்தை என்னோடு பகிர்ந்துகொள்[b].
