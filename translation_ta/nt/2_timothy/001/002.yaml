id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ta
  text: 'அன்புக்குரிய பிள்ளையாகிய தீமோத்தேயுவுக்கு: தந்தையாகிய கடவுளிடமிருந்தும் நம் ஆண்டவராகிய மேசியா இயேசுவிடமிருந்தும்[a] அருளும் இரக்கமும் சமாதானமும் உண்டாவதாக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிறிஸ்து இயேசு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பட்டமான Χριστός என்பதற்கு ‘அபிஷேகம் செய்யப்பட்டவர்’ என்று பொருள்; இங்கு அதன் பொருளைப் பாதுகாக்க ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: அன்புக்குரிய
  rationale: அன்பையும் மதிப்பையும் வெளிப்படுத்தும் ἀγαπητός என்பதன் இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: τέκνῳ
  choice: பிள்ளை
  rationale: ஆண்பாலைக் குறிப்பாகச் சேர்க்காமல், ஆவிக்குரிய குடும்ப உறவைக் காட்டும் τέκνον உருவகத்தைப் பாதுகாக்கிறது.
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்துகளில் வரும் χάρις என்பதற்கான இயல்பான தமிழ் இறையியல் சொல்.
- source_word: ἔλεος
  choice: இரக்கம்
  rationale: அருளிலிருந்து தனியாக நிற்கும் ἔλεος என்பதன் நேரான பொருளைப் பாதுகாக்கிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: உறவு, நலவாழ்வு, உடன்படிக்கை ஆகிய பரிமாணங்களைத் தாங்கும் வழக்கமான வேதாகமத் தமிழ் சொல்.
- source_word: θεοῦ πατρὸς
  choice: தந்தையாகிய கடவுள்
  rationale: கிரேக்கத்தில் ‘நம்’ என்ற உரிச்சொல் இல்லாததால் அதைச் சேர்க்காமல், கடவுளைத் தந்தை எனக் குறிப்பிடும் அமைப்பைப் பாதுகாக்கிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாக இருப்பதால், பாரம்பரிய ஒலிபெயர்ப்பான ‘கிறிஸ்து’ என்பதற்குப் பதிலாக அதன் பட்டப்பொருளைச் சுட்டும் ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος குறிக்கும் அதிகாரத்தையும் கிறிஸ்தியல் முக்கியத்துவத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός இங்கு பெயரின் ஒரு பகுதியாக மட்டும் அல்லாமல் பட்டமாகவும் செயல்படுகிறது. எனவே அதன் பொருளை வெளிப்படுத்த ‘மேசியா’ முதன்மை உரையில் வைக்கப்பட்டு, பாரம்பரிய ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: வாழ்த்தின் வினைச்சொல்
  choice: உண்டாவதாக
  alternative: வினைச்சொல் இல்லாமல் பெயர்ச்சொற்களை மட்டும் வரிசைப்படுத்துதல்
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும் வாழ்த்தின் விருப்பப் பொருள் உட்கிடையாக உள்ளது; இயல்பான தமிழில் அதை ‘உண்டாவதாக’ என வெளிப்படுத்துவது பொருளை மாற்றாமல் வாக்கியத்தை நிறைவு செய்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான திருமுக வாழ்த்து நடையைப் பயன்படுத்துகிறது. ‘என்’ என்பதைச் சேர்க்காமல் மூலத்தின் வடிவம் காக்கப்பட்டுள்ளது; ‘பிதா’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘தந்தை’ பயன்படுத்தப்பட்டுள்ளது.
