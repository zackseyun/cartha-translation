revisions:
- from: உன்னிடம் உள்ள பாசாங்கற்ற விசுவாசத்தை நினைவுகூருகிறேன். அந்த விசுவாசம் முதலில் உன் பாட்டி லோவிசாளிடமும் உன் தாய் ஐனிக்கேயாளிடமும் குடியிருந்தது; அது உன்னிடமும் இருக்கிறது என்று நான் உறுதியாக நம்புகிறேன்.
  to: உன்னில் உள்ள பாசாங்கற்ற விசுவாசம் எனக்கு நினைவூட்டப்பட்டபோது, அது முதலில் உன் பாட்டி லோவிசாளிடமும் உன் தாய் ஐனிக்கேயாளிடமும் குடியிருந்தது; அது உன்னிலும் உள்ளது என்று நான் உறுதியாக நம்புகிறேன்.
  rationale: The opening participial clause is revised to express Paul’s having been reminded, rather than his independently recalling something. The rest preserves the Greek sequence, the indwelling metaphor of ἐνῴκησεν, the familial references, and the final confident persuasion without supplying an unstated repeated verb.
