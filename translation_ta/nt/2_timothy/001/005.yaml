id: 2TI.1.5
reference: 2 Timothy 1:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: ta
  text: உன்னில் உள்ள பாசாங்கற்ற விசுவாசம் எனக்கு நினைவூட்டப்பட்டபோது, அது முதலில் உன் பாட்டி லோவிசாளிடமும் உன் தாய் ஐனிக்கேயாளிடமும் குடியிருந்தது; அது உன்னிலும் உள்ளது என்று நான் உறுதியாக நம்புகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: நினைவுகூருகிறேன்
  rationale: சொல்லுக்கு சொல் வடிவில் ‘நினைவூட்டலைப் பெற்றதால்’ என்பது தமிழில் இயல்பற்றது; நினைவுக்கு வருதல்/நினைவுகூருதல் என்ற பொருளை இயல்பான நிகழ்காலத் தொடராக அளிக்கிறது.
- source_word: ἀνυποκρίτου πίστεως
  choice: பாசாங்கற்ற விசுவாசம்
  rationale: ἀνυπόκριτος என்பதன் போலியற்ற, உண்மையான தன்மையை நேரடியாகக் காக்கிறது.
- source_word: ἐνῴκησεν
  choice: குடியிருந்தது
  rationale: ‘உள்ளே வசித்தது’ என்ற உருவக வலிமையைப் பேணுகிறது; வெறுமனே ‘இருந்தது’ என்பதைக் காட்டிலும் மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: πέπεισμαι
  choice: உறுதியாக நம்புகிறேன்
  rationale: முழுமையான நம்பிக்கை அல்லது உறுதிப்பாட்டைக் குறிக்கும் perfect வடிவின் விளைவு நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μάμμῃ
  choice: பாட்டி
  rationale: தாய்வழியா தந்தைவழியா என்பதை கிரேக்கச் சொல் குறிப்பிடாததால் பொதுவான தமிழ் உறவுமுறைச் சொல் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: ‘விசுவாசம் உன்னிடமும் இருக்கிறது’ என்பதன் உறுதிப்பாடு
  choice: அது உன்னிடமும் இருக்கிறது என்று நான் உறுதியாக நம்புகிறேன்
  alternative: அது உன்னிடமும் குடியிருக்கிறது என்று நான் உறுதியாக நம்புகிறேன்
  rationale: καὶ ἐν σοί என்ற இறுதிப் பகுதியில் ἐνοικέω வினை வெளிப்படையாக மறுபடியும் வரவில்லை. அதன் கருத்து தொடர்ந்தாலும், தமிழில் வினையை அப்படியே நிரப்பாமல் மூலத்தின் சுருக்கத்தையும் பவுலின் உறுதியான நம்பிக்கையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் எளிய வாசிப்புத் தன்மையும் கொண்ட நடை. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் பரிச்சயமான ‘லோவிசாள்’, ‘ஐனிக்கேயாள்’ என ஒலிபெயர்க்கப்பட்டுள்ளன. தேவையற்ற விளக்கச் சேர்க்கைகளும் சமயப்பிரிவு சார்ந்த சொற்பயன்பாடுகளும் தவிர்க்கப்பட்டுள்ளன.
