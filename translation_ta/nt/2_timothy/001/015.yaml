id: 2TI.1.15
reference: 2 Timothy 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: ta
  text: 'இதை நீ அறிவாய்: ஆசியாவில் உள்ள அனைவரும் என்னைவிட்டு விலகிவிட்டார்கள்[b][a]; அவர்களில் பைகேலும் எர்மொகெனேயும் உள்ளனர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “ஆசியா” என்பது இன்றைய ஆசியக் கண்டத்தைக் குறிக்காமல், மேற்கு ஆசியா மைனரில் அமைந்திருந்த ரோம மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “என்னைக் கைவிட்டுவிட்டார்கள்.” கிரேக்கத்தில் இன்னும் சொற்படியாக, “என்னைவிட்டு விலகிவிட்டார்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας
  choice: உனக்குத் தெரியும்
  rationale: οἶδα இங்கு நிகழ்கால நிலைப்பொருளில் ஏற்கெனவே உள்ள அறிவைக் குறிக்கிறது. தமிழில் இயல்பாகவும் நேரடியாகவும் ‘உனக்குத் தெரியும்’ என வழங்கப்படுகிறது.
- source_word: τοῦτο ... ὅτι
  choice: 'இது உனக்குத் தெரியும்:'
  rationale: τοῦτο என்பதை ‘இது’ எனக் காத்து, தொடர்ந்து வரும் ὅτι உள்ளடக்க வாக்கியத்தை முக்காற்புள்ளி மூலம் இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: ἀπεστράφησάν με
  choice: என்னைவிட்டு விலகிவிட்டார்கள்
  rationale: ἀποστρέφω என்பதிலுள்ள ‘திரும்பி விலகுதல்’ என்ற உறவுசார் படிமத்தை இது காக்கிறது; ‘கைவிட்டார்கள்’ என்பது சாத்தியமான, ஆனால் சற்றுக் கூடுதல் விளக்கமளிக்கும் மாற்று.
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: ஆசியாவில் உள்ள அனைவரும்
  rationale: πάντες என்பதன் விரிவான வலிமையை மெலிதாக்காமல் காக்கிறது; சூழலால் வரையறுக்கப்படும் குழுவை இது குறிக்கலாம் என்பதையும் மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்கவில்லை.
- source_word: Ἀσίᾳ
  choice: ஆசியா
  rationale: புதிய ஏற்பாட்டுச் சூழலில் இது மேற்கு ஆசியா மைனரில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது. முதன்மை உரையில் வழக்கமான பெயர் வைக்கப்பட்டு, வரலாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὧν ἐστιν
  choice: அவர்களில் ... அடங்குவர்
  rationale: பெயரிடப்பட்ட இருவரும் முன்சொன்ன பெரிய குழுவைச் சேர்ந்தவர்கள் என்ற பகுதியுறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Φύγελος
  choice: பிகெல்
  rationale: கிரேக்கப் பெயரின் ஒலியை நவீனத் தமிழில் வாசிக்க ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
- source_word: Ἑρμογένης
  choice: எர்மொகெனேய்
  rationale: கிரேக்கப் பெயரின் ஒலியையும் தமிழ் வேற்றுமை உருபுகளை ஏற்கும் இயல்பையும் கருத்தில் கொண்டு எழுத்துப்பெயர்க்கிறது.
theological_decisions:
- issue: ‘ஆசியாவில் உள்ள அனைவரும்’ என்பதன் வரம்பு
  choice: πάντες என்பதன் விரிவான கூற்றை முதன்மை உரையில் அப்படியே காத்து, அதன் வரம்பைச் சூழலே நிர்ணயிக்க விடுதல்
  alternative: ஆசியாவிலுள்ள ஒவ்வொரு கிறிஸ்தவரும் என்ற முற்றிலும் வரம்பற்ற கூற்றாகவோ, அல்லது ‘பலர்’ என்று மெலிதாக்கியோ மொழிபெயர்த்தல்
  rationale: கிரேக்க πάντες சொல்லாட்சி ரீதியாக முழுமையைக் குறித்தாலும், கடிதச் சூழலில் பவுலுடன் தொடர்புடையவர்கள் அல்லது ஆதரவாளர்கள் என்ற வரையறுக்கப்பட்ட குழுவைக் குறிக்கலாம். மூலத்தின் பதற்றத்தையும் தெளிவின்மையையும் மொழிபெயர்ப்பு தீர்த்துவிடக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபருக்கான ‘உனக்கு’ வடிவம் மூலத்தின் தனிப்பட்ட முகவரியைப் பாதுகாக்கிறது. உரை கண்ணியமாகவும் சாதாரண வாசகர்களுக்கு தெளிவாகவும் வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொல்லாட்சிக்குப் பின் [b][a] என முதன்மை உரையில் இடம்பெற்றுள்ளன.
