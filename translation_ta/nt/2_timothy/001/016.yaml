id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: ta
  text: ஒனேசிப்போருவின் வீட்டாருக்கு ஆண்டவர் இரக்கம் அருள்வாராக! ஏனெனில், ஒனேசிப்போரு பலமுறை எனக்குப் புத்துணர்ச்சி அளித்தார்; என் சங்கிலியைக் குறித்து வெட்கப்படவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் சிறையிருப்பைக் குறித்து’; சொல்லுக்குச் சொல், ‘என் சங்கிலியைக் குறித்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: அருள்வாராக
  rationale: இறந்தகால விருப்பவினை வடிவம் ஒரு வேண்டுதல் அல்லது ஜெபவிருப்பத்தை வெளிப்படுத்துகிறது; தமிழில் ‘அருள்வாராக’ இதை இயல்பாகவும் மரியாதையுடனும் தெரிவிக்கிறது.
- source_word: ἔλεος
  choice: இரக்கம்
  rationale: தேவ உதவியும் கருணையும் தேவைப்படும் நிலையில் காட்டப்படும் அருளைச் சுட்டும் வழக்கமான, சூழலுக்கேற்ற தமிழ் சொல்.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: இது தெய்வீகப் பட்டமாக வருகிறது; மூலத்தில் குறிப்பிடப்படாத அதன் குறிப்பிட்ட நபரை மொழிபெயர்ப்பு தீர்மானிக்காமல் ‘ஆண்டவர்’ எனப் பாதுகாக்கிறது.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: ஒனேசிப்போருவின் குடும்பத்தாருக்கு
  rationale: οἶκος இங்கு கட்டிடத்தைவிட குடும்பம் அல்லது வீட்டார் என்ற சமூக அலகைக் குறிக்கிறது; ‘குடும்பத்தார்’ நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: πολλάκις
  choice: பலமுறை
  rationale: மீண்டும் மீண்டும் நிகழ்ந்த செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀνέψυξεν
  choice: புத்துணர்ச்சி அளித்தார்
  rationale: நிவாரணம், ஆறுதல், புதுத் தெம்பு அளித்தல் என்ற வினையின் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τὴν ἅλυσίν μου
  choice: என் சங்கிலி
  rationale: மூலத்தின் ஒருமை மற்றும் தெளிவான பிம்பத்தைத் தக்கவைக்கிறது; இது சிறையிருப்பைக் குறிக்கும் ஆகுபெயராக இருக்கலாம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: οὐκ ἐπαισχύνθη
  choice: வெட்கப்படவில்லை
  rationale: சமூக மற்றும் அறநெறி சார்ந்த வெட்க உணர்வை நேரடியாகவும் வலிமையாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: பவுலின் ஆசிவேண்டுதலில் ‘ஆண்டவர்’ யாரைக் குறிக்கிறது
  choice: குறிப்பிட்ட நபரைச் சேர்க்காமல் ‘ஆண்டவர்’ என்று மொழிபெயர்த்தல்
  alternative: பிதாவாகிய தேவன் என்று அல்லது ஆண்டவர் இயேசு என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: கிரேக்க உரை ὁ κύριος என்று மட்டுமே கூறுகிறது. ஆகவே வசனம் தீர்மானிக்காத குறிப்பை மொழிபெயர்ப்பு தீர்மானிக்காமல் இறையியல் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும், அதேவேளையில் கண்ணியமான வேதாகம நடையுடன் அமைக்கப்பட்டது. தனிநபரைக் குறிக்கும் மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன.
