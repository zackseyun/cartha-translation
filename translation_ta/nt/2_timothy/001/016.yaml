revisions:
- from: ஒனேசிப்போருவின் குடும்பத்தாருக்கு ஆண்டவர் இரக்கம் அருள்வாராக! ஏனெனில், அவர் பலமுறை எனக்கு புத்துணர்ச்சி அளித்தார்; என் சங்கிலியைக் குறித்து அவர் வெட்கப்படவில்லை.[a]
  to: ஒனேசிப்போருவின் வீட்டாருக்கு ஆண்டவர் இரக்கம் அருள்வாராக! ஏனெனில், ஒனேசிப்போரு பலமுறை எனக்குப் புத்துணர்ச்சி அளித்தார்; என் சங்கிலியைக் குறித்து வெட்கப்படவில்லை.[a]
  rationale: The revision clarifies that Onesiphorus—not his household—is the person who refreshed Paul and was not ashamed of Paul's chain. It also uses ‘வீட்டார்’ to retain the broader household sense of οἶκος. The prayerful optative, the unspecific divine title, and the chain/imprisonment lexical alternative are retained.
