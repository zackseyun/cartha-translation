id: 2TI.1.7
reference: 2 Timothy 1:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: ta
  text: ஏனெனில், கடவுள் நமக்குக் கோழைத்தனத்தின்[a] ஆவியைக் கொடுக்கவில்லை; மாறாக, வல்லமையும் அன்பும் தன்னடக்கமும்[b] கொண்ட ஆவியையே கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘அஞ்சும் மனநிலை.’ கிரேக்கச் சொல் சாதாரண பயத்தைவிடக் கோழைத்தனமான அச்சத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘நிதானமான தீர்மானம்’ அல்லது ‘சுயஒழுக்கம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ஏனெனில் ... கொடுக்கவில்லை
  rationale: γάρ முந்தைய வசனத்தின் அறிவுறுத்தலுக்கான காரணத்தைத் தொடர்வதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது; οὐ வினையை மறுக்கும் வடிவில் இயல்பான தமிழில் தரப்பட்டது.
- source_word: ἔδωκεν
  choice: கொடுக்கவில்லை ... கொடுத்தார்
  rationale: இறந்தகால வினை முதலில் மறுப்பு வாக்கியத்தில் தரப்பட்டு, எதிர்மறை ஒப்பீட்டைத் தமிழில் தெளிவாக்க இரண்டாம் பகுதியில் மறைமுகமாக உள்ள அதே வினை வெளிப்படையாக மீண்டும் கூறப்பட்டது.
- source_word: ἡμῖν
  choice: நமக்கு
  rationale: முதல் நபர் பன்மை மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: பொதுவான, நவீனத் தமிழ் வேதாகம நடைக்கு ஏற்ற இறைப்பெயர்.
- source_word: πνεῦμα
  choice: ஆவி
  rationale: மூலச்சொல்லின் ‘ஆவி’ மற்றும் உள்ளார்ந்த மனப்பாங்கு ஆகிய சாத்தியங்களை முழுமையாக ஒன்றாகத் தீர்மானிக்காமல் தக்கவைக்கிறது; ‘பரிசுத்த ஆவியானவர்’ என்று மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: δειλίας
  choice: கோழைத்தனம்
  rationale: சாதாரண அச்சத்தைவிட வெட்கத்துக்குரிய அஞ்சும் மனநிலையைக் குறிக்கும் சொல்லின் வலுவான எதிர்மறை நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: முன்னும் பின்னும் உள்ள ஆவியின் பண்புகளுக்கிடையிலான வலுவான எதிர்மறை ஒப்பீட்டை இயல்பாகக் காட்டுகிறது.
- source_word: δυνάμεως
  choice: வல்லமை
  rationale: δύναμις குறிக்கும் ஆற்றல் அல்லது செயலாற்றும் திறனைச் சுருக்கமாகவும் வழக்கமான வேதாகமத் தமிழிலும் தருகிறது.
- source_word: ἀγάπης
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான நேரடியான, நவீனத் தமிழ் இணைச்சொல்.
- source_word: σωφρονισμοῦ
  choice: தன்னடக்கம்
  rationale: சொல் குறிக்கும் சுயக்கட்டுப்பாட்டை எளிதில் புரியும் தமிழில் தருகிறது; தெளிந்த நிதானமான சிந்தனை மற்றும் ஒழுக்கம் என்ற விரிவான நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: கடவுள் கொடுக்கும் ஆவி அல்லது உள்ளார்ந்த மனப்பாங்கு என்று வாசிக்க இடமளித்தல்
  alternative: இது நேரடியாகப் பரிசுத்த ஆவியானவரைக் குறிக்கிறது என்று மொழிபெயர்த்தல்
  rationale: πνεῦμα என்பதுடன் வரும் பண்புசார் பிறப்புவேற்றுமைச் சொற்கள், எத்தகைய ஆவியை அல்லது மனப்பாங்கைக் கடவுள் கொடுக்கிறார் என்பதை விவரிக்கின்றன. எனினும் ‘ஆவி’ என்ற மொழிபெயர்ப்பு, பரிசுத்த ஆவியின் செயலை முற்றாக விலக்காமல் மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ஒரே ‘ஆவி’ சொல்லைத் தமிழில் இரு பகுதிகளுடனும் இயல்பாக இணைக்க ‘கொண்ட ஆவி’ என்றும், மறைந்துள்ள எதிர்மறை வினையைத் தெளிவாக்க ‘கொடுத்தார்’ என்றும் கூறப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் உரையில் உரிய சொற்களுக்குப் பின் இடம்பெற்றுள்ளன.
