- issue: Χριστῷ என்பது பட்டப்பெயரா அல்லது பெயரின் பகுதியாக நிலைபெற்ற வடிவமா
  choice: மெசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த அர்த்தத்தை மொழிபெயர்ப்பில் வெளிப்படையாகத் தக்கவைக்க ‘மெசியாவாகிய’ பயன்படுத்தப்பட்டுள்ளது; சபை மரபில் நிலைபெற்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: πρὸ χρόνων αἰωνίων என்பதன் காலவியல் நுணுக்கம்
  choice: நித்திய காலங்களுக்கு முன்பே
  alternative: காலம் தொடங்குவதற்கு முன்பே
  rationale: மூலத்தின் சொல் வடிவத்தையும் அதன் காலத்திற்கு முற்பட்ட இறையியல் அழுத்தத்தையும் அளவுக்கு மீறி விளக்காமல் பாதுகாக்கிறது.
