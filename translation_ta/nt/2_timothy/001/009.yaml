  rationale: சொற்றொடரின் அசாதாரணமான ‘நித்திய காலங்கள்’ என்ற வடிவைத் தக்கவைத்து, πρὸ என்பதைக் ‘முன்பே’ என வழங்குகிறது; ‘காலம் தொடங்குமுன்’ என்பது அதிக வழக்கான ஆனால் விளக்கமளிக்கும் மாற்று.
