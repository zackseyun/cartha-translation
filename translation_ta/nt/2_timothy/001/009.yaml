  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. கிரேக்க வாக்கியம் முந்தைய வசனத்துடன் இலக்கணரீதியாகத் தொடர்ந்தாலும், தனிவசன வாசிப்புத் தெளிவுக்காக முழு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. ‘நோக்கம்,’ ‘அருள்,’ ‘அழைப்பு’ ஆகிய முக்கிய சொற்கள் இறையியல் நிறையை இழக்காமல் எளிய மொழியில் வைக்கப்பட்டுள்ளன.
