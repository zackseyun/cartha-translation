  text: அவர் நம்மை இரட்சித்து, பரிசுத்தமான அழைப்பால்[a] அழைத்தார். இது நம்முடைய செயல்களின் அடிப்படையில் அல்ல; அவருடைய சொந்த நோக்கத்தின்படியும் அருளின்படியுமே நடந்தது. அந்த அருள், நித்திய காலங்களுக்கு முன்பே[b] மெசியாவாகிய இயேசுவில்[c] நமக்குக் கொடுக்கப்பட்டது.
