  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: ta
  text: அந்த நாளில்[b] ஆண்டவரிடமிருந்து[a] இரக்கத்தைக் கண்டடைய ஆண்டவர் அவனுக்கு அருள்வாராக—எபேசுவில் அவன் எவ்வளவு சேவை செய்தான்[c] என்பதை நீயே இன்னும் நன்றாக அறிவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆண்டவரிடத்தில்’ என்றும் மொழிபெயர்க்கலாம். ‘ஆண்டவரிடமிருந்து’ என்பது இரக்கம் ஆண்டவரிடமிருந்து வருவதை வலியுறுத்துகிறது; மற்றொரு புரிதல் ஆண்டவரின் முன்னிலையில் இரக்கம் கிடைப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்த நாள்’ என்பது வரவிருக்கும் தெய்வீக நியாயத்தீர்ப்பு அல்லது விடுவிப்பின் நாளைக் குறிக்கப் புதிய ஏற்பாட்டில் பொதுவாகப் பயன்படுத்தப்படும் ஒரு தொடர்.
    reason: cross_reference
  - marker: c
    text: ‘அவன் செய்த எல்லாச் சேவைகளையும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர் எபேசுவில் அவன் செய்த சேவையின் அளவையும் விரிவையும் தொகுத்துக் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: அருள்வாராக
  rationale: இறந்தகால விருப்ப வினைமுறை இங்கு ஒரு வேண்டுதல் அல்லது ஜெப வாழ்த்தை வெளிப்படுத்துகிறது; ‘அருள்வாராக’ என்பது இயல்பான, கண்ணியமான தமிழில் அதைப் பிரதிபலிக்கிறது.
- source_word: αὐτῷ
  choice: அவனுக்கு
  rationale: δῴη என்பதுடன் வரும் மறைமுகப் பெறுநரைக் குறிக்கும் வேற்றுமையை நேரடியாகக் காக்கிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் இணை; மூலத்தில் உள்ள குறிப்புச் சுட்டின் இயல்பையும் வெளிப்படுத்துகிறது.
- source_word: εὑρεῖν ἔλεος
  choice: இரக்கத்தைக் கண்டடைய
  rationale: கிரேக்க மொழிப்படிமத்தைப் பாதுகாக்கும் அதேவேளையில், நவீன தமிழிலும் புரிந்துகொள்ளக்கூடியதாக உள்ளது; ‘இரக்கத்தைப் பெற’ என்பது பொருள் சார்ந்த மாற்றாகும்.
- source_word: παρὰ κυρίου
  choice: ஆண்டவரிடமிருந்து
  rationale: παρά + பிறப்புவேற்றுமை இங்கு இரக்கத்தின் மூலத்தைச் சுட்டுவதாக இயல்பாகப் புரிகிறது. κύριος இருமுறை வருவதால், அந்த மீளுரையும் தமிழில் காக்கப்படுகிறது.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: அந்த நாளில்
  rationale: காலத்தைக் குறிக்கும் ἐν என்பதற்கான இயல்பான தமிழ் வடிவம்; இறுதிக்கால முக்கியத்துவத்தை மொழிபெயர்ப்பிலேயே விரிவுபடுத்தாமல் மூலத்தின் மரபுத்தொடரைப் பாதுகாக்கிறது.
- source_word: ὅσα
  choice: எவ்வளவாய்
  rationale: ஒநேசிப்போரு செய்த பணிவிடையின் அளவு அல்லது விரிவைச் சுருக்கமாகக் குறிக்கும் பன்மை உறவுப்பெயரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν Ἐφέσῳ
  choice: எபேசுவில்
  rationale: இடப்பொருளைத் தெளிவாகவும் வழக்கமாகவும் தருகிறது.
- source_word: διηκόνησεν
  choice: பணிவிடை செய்தான்
  rationale: διακονέω குறிக்கும் நடைமுறைச் சேவையைத் தெளிவாக வெளிப்படுத்துகிறது; குறிப்பிட்ட திருச்சபைப் பதவியைத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: βέλτιον σὺ γινώσκεις
  choice: நீ நன்றாக அறிவாய்
  rationale: தீமோத்தேயு இதை மேலும் முழுமையாக அறிந்திருப்பதை இயல்பான தமிழில் கூறுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘என்னைவிட’ என்பதைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: மீண்டும் வரும் ‘ஆண்டவர்’ என்பதன் குறிப்பு (ὁ κύριος ... παρὰ κυρίου)
  choice: இரு இடங்களிலும் ‘ஆண்டவர்’ என்றே மொழிபெயர்க்கப்படுகிறது; இரண்டாவது பயன்பாடு பிதாவையா கிறிஸ்துவையா குறிக்கிறது என்பது தீர்மானிக்கப்படவில்லை.
  alternative: முதல் ‘ஆண்டவர்’ கிறிஸ்து, இரண்டாவது ‘ஆண்டவர்’ பிதா; அல்லது இரண்டுமே கிறிஸ்துவைக் குறிக்கின்றன.
  rationale: கிரேக்க உரை இரு பயன்பாடுகளையும் வெளிப்படையாக வேறுபடுத்தவில்லை. எனவே மொழிபெயர்ப்பு இறையியல் தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: ‘அந்த நாள்’ என்பதன் இறுதிக்காலப் பொருள்
  choice: விளக்க விரிவாக்கமின்றி ‘அந்த நாளில்’ என்று தரப்படுகிறது.
  alternative: நியாயத்தீர்ப்பு நாள்; கடைசி நாள்; ஆண்டவரின் நாள்.
  rationale: இது வரவிருக்கும் தெய்வீக நியாயத்தீர்ப்பு அல்லது விடுவிப்பின் நாளைக் குறிக்க வாய்ப்புள்ளது; ஆனாலும் மூல உரை வழக்கமான ‘அந்த நாள்’ என்ற தொடரையே பயன்படுத்துவதால் அதுவே காக்கப்படுகிறது.
