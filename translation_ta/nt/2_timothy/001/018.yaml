  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஆண்டவர்’, ‘இரக்கம்’, ‘பணிவிடை’ ஆகிய சொற்கள் மரியாதைத் தொனியைக் காக்கின்றன; அதேவேளையில் உரை தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்களைத் தவிர்க்கிறது.
