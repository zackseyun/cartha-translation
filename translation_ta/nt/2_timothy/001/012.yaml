id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: ta
  text: இதன் காரணமாக நானும் இவற்றை அனுபவிக்கிறேன். ஆனாலும் நான் வெட்கப்படுவதில்லை. ஏனெனில், நான் யார்மீது நம்பிக்கை வைத்திருக்கிறேன்[a] என்பதை அறிவேன்; மேலும், என் பாதுகாப்பு வைப்பை[b] அந்த நாள்[c] வரை காத்துக்கொள்ள அவர் வல்லவர் என்று உறுதியாக நம்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் யாரை நம்பியிருக்கிறேன்”; “நான் யாரை நம்பியுள்ளேன்” என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் பாதுகாப்பு வைப்பு” என்பது பாதுகாப்புக்காக ஒருவரின் பராமரிப்பில் வைக்கப்பட்ட ஒன்றைக் குறிக்கும் சொல்லின் மொழிபெயர்ப்பு. இது பவுல் கடவுளிடம் ஒப்படைத்ததையோ, பவுலிடம் ஒப்படைக்கப்பட்டதையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அதாவது, கடவுளின் இறுதித் தீர்ப்பும் நீதிநிறைவேற்றமும் நிகழும் எதிர்கால நாள்.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: இதன் காரணமாக
  rationale: முந்தைய கருத்தோடு உள்ள காரணத் தொடர்பைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: καὶ ταῦτα πάσχω
  choice: நானும் இவற்றை அனுபவிக்கிறேன்
  rationale: πάσχω என்பதன் துன்பத்தை அனுபவித்தல் என்ற பொருளையும், ταῦτα என்பதன் குறிப்பிட்டுச் சொல்லாத தன்மையையும் காக்கிறது; ‘நானும்’ என்பது καί-யின் வலியுறுத்தலைத் தருகிறது.
- source_word: οὐκ ἐπαισχύνομαι
  choice: நான் வெட்கப்படுவதில்லை
  rationale: சூழலில் பவுலின் மனநிலையைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடர்; ‘அவமானப்படுத்தப்படவில்லை’ என்று வெளிப்புறச் செயற்பாடாக மாற்றுவதில்லை.
- source_word: οἶδα
  choice: அறிவேன்
  rationale: வடிவில் நிறைவுக்காலமாக இருந்தாலும் நிகழ்கால நிலை உணர்வைத் தரும் கிரேக்க வினையை இயல்பாக மொழிபெயர்க்கிறது.
- source_word: ᾧ πεπίστευκα
  choice: யாரிடம் நம்பிக்கை வைத்திருக்கிறேன்
  rationale: தனிப்பட்ட ஒருவர்மீது நிலைத்த நம்பிக்கை வைத்திருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்க நிறைவுக்காலத்தின் தொடரும் விளைவை ‘வைத்திருக்கிறேன்’ காக்கிறது.
- source_word: πέπεισμαι
  choice: உறுதியாக நம்புகிறேன்
  rationale: நிலைத்த உறுதியைக் குறிக்கும் நிறைவுக்காலச் செயப்பாட்டு வடிவத்தைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: δυνατός ἐστιν
  choice: அவர் வல்லவர்
  rationale: வெறும் சாத்தியத்தைவிட திறனையும் வல்லமையையும் வெளிப்படுத்தும் சுருக்கமான, கண்ணியமான மொழிபெயர்ப்பு.
- source_word: τὴν παραθήκην μου
  choice: என் ஒப்படைப்பை
  rationale: பாதுகாப்புக்காக வைக்கப்பட்ட பொருள் அல்லது பொறுப்பு என்ற உருவகத்தைச் சுருக்கமாகக் காத்து, அது பவுல் கடவுளிடம் ஒப்படைத்ததா அல்லது பவுலிடம் ஒப்படைக்கப்பட்டதா என்பதை முதன்மை உரையில் தீர்மானிக்காமல் விடுகிறது.
- source_word: φυλάξαι
  choice: காத்துக்கொள்ள
  rationale: ஒப்படைக்கப்பட்டதைப் பாதுகாத்து வைத்திருத்தல் என்ற பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: அந்த நாள் வரை
  rationale: எதிர்காலத்தின் குறிப்பிட்ட நாளை நோக்கிய காலவரம்பை இயல்பாகத் தருகிறது; அதன் இறுதிக்காலப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: ᾧ என்பதன் குறிப்பு மற்றும் δυνατός ἐστιν என்பதன் மறைமுக எழுவாய்
  choice: முதன்மை உரையில் பெயரைக் குறிப்பிடாமல் ‘யார்’ மற்றும் ‘அவர்’ என்று கிரேக்கத்தின் அளவிலான குறிப்பே வைக்கப்பட்டுள்ளது.
  alternative: ‘கடவுள்’ அல்லது ‘கிறிஸ்து இயேசு’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: சூழல் கடவுளை அல்லது கிறிஸ்துவில் அறியப்படும் கடவுளைச் சுட்டினாலும், இவ்வாக்கியக் கூறு பெயரைச் சொல்லவில்லை; ஆகவே மொழிபெயர்ப்பு கூடுதல் அடையாளத்தைச் சேர்க்கவில்லை.
- issue: παραθήκη μου என்பதன் பொருள்
  choice: ‘என் ஒப்படைப்பு’ என்ற உருவகமும் திசைத் தெளிவின்மையும் காக்கப்பட்டுள்ளது.
  alternative: பவுலிடம் ஒப்படைக்கப்பட்ட நற்செய்தி அல்லது பவுல் கடவுளிடம் ஒப்படைத்த தன் உயிர்/இரட்சிப்பு என்று குறிப்பாக்குதல்.
  rationale: μου என்னும் உருபு ஒப்படைப்பின் திசையைத் தனியாக நிர்ணயிக்கவில்லை. இரு முக்கிய வாசிப்புகளையும் சாத்தியமாக வைத்திருக்க முதன்மை உரை ஒன்றைத் தேர்ந்தெடுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘என் ஒப்படைப்பு’ என்பது தமிழில் சற்றே அடர்த்தியான உருவகமாக இருந்தாலும், மூலத்தின் உண்மையான இருபொருள் சாத்தியத்தைத் தீர்க்காமல் காக்க வேண்டியதால் பயன்படுத்தப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
