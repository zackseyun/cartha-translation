  text: τὴν καλὴν παραθήκην φύλαξον διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: ta
  text: நம்மில் குடியிருக்கும் பரிசுத்த ஆவியின் மூலம், உன்னிடம் ஒப்படைக்கப்பட்ட நல்ல பொக்கிஷத்தைக் காத்துக்கொள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘நல்ல ஒப்படைப்பை’ அல்லது ‘உன்னிடம் ஒப்படைக்கப்பட்ட நல்லதை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘நம்மில் குடியிருக்கும் பரிசுத்த ஆவியால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: உன்னிடம் ஒப்படைக்கப்பட்ட நல்ல பொக்கிஷத்தை
  rationale: παραθήκη என்பது பாதுகாப்பதற்காக ஒருவரிடம் ஒப்படைக்கப்பட்ட பொருளைக் குறிக்கிறது. தமிழில் ‘ஒப்படைப்பு’ என்பது இங்கு இயல்பாக இல்லாததால், ‘ஒப்படைக்கப்பட்ட ... பொக்கிஷம்’ என்று மொழிபெயர்ப்பது ஒப்படைக்கப்பட்ட மதிப்புமிக்க பொருள் என்ற உருவகத்தையும் காக்கிறது. ‘உன்னிடம்’ என்பது ஒருமை கட்டளையாலும் சூழலாலும் தெளிவாகும் பெறுநரை வெளிப்படுத்துகிறது; அந்தப் பொக்கிஷம் நற்செய்தியா ஊழியப் பொறுப்பா என்பதைத் தீர்மானிக்கவில்லை.
- source_word: καλὴν
  choice: நல்ல
  rationale: καλός இங்கு ஒப்படைக்கப்பட்டதன் உள்ளார்ந்த நன்மையையும் தகுதியையும் குறிக்கிறது. ‘நல்ல’ என்பது இயல்பானதும் பொருளை மிகைப்படுத்தாததும் ஆகும்.
- source_word: φύλαξον
  choice: காத்துக்கொள்
  rationale: இந்த இறந்தகால ஏவல் வடிவம் விழிப்புடன் பாதுகாக்கும் கட்டளையை அளிக்கிறது. ‘காத்துக்கொள்’ என்பது பாதுகாப்பையும் தொடர்ந்து பொறுப்புடன் வைத்திருப்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: διὰ πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியின் மூலம்
  rationale: διά + மரபுவேற்றுமை இங்கு வழிமுறை அல்லது செயலாற்றும் முகவரைக் குறிக்கலாம். ‘மூலம்’ இந்தத் திறந்த தன்மையை இயல்பாகப் பேணுகிறது.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: நம்மில் குடியிருக்கும்
  rationale: ἐνοικοῦντος தற்போதும் தொடரும் உள்ளுறைதலைக் குறிக்கிறது. ‘குடியிருக்கும்’ என்பது தொழில்நுட்பச் சொல்லாக்கமின்றி அந்த நிலையான இருப்பைத் தெரிவிக்கிறது; ἐν ἡμῖν என்பதையும் ‘நம்மில்’ என்று நேரடியாக வைத்திருக்கிறது.
theological_decisions:
- issue: ‘நல்ல ஒப்படைப்பு’ எதைக் குறிக்கிறது
  choice: ‘உன்னிடம் ஒப்படைக்கப்பட்ட நல்ல பொக்கிஷம்’ என்று பொதுவாகவே வைக்கப்பட்டது.
  alternative: தீமோத்தேயுவிடம் ஒப்படைக்கப்பட்ட நற்செய்தி அல்லது அவரது ஊழியப் பொறுப்பு என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: சூழல் அப்போஸ்தல நற்செய்திப் பொறுப்பைக் குறிப்பதாகத் தோன்றினாலும், கிரேக்கச் சொற்றொடர் அதன் குறிப்பிட்ட பொருளை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே முதன்மை உரை அதைத் தீர்மானிக்கவில்லை.
- issue: ‘நம்மில்’ என்பதன் வரம்பு
  choice: நம்மில்
  alternative: பவுலிலும் தீமோத்தேயுவிலும் மட்டும் அல்லது எல்லா விசுவாசிகளிலும் என்று வரம்பை வெளிப்படையாக நிர்ணயித்தல்.
  rationale: ἡμῖν என்பதன் வரம்பை கிரேக்க உரை இங்கே தெளிவாகக் குறுக்கவில்லை. அதனால் மூலப்பெயர்ப்பின் பன்மை வடிவமும் அதன் இறையியல் திறந்த தன்மையும் காக்கப்பட்டன.
- issue: பரிசுத்த ஆவியின் பங்கு
  choice: பரிசுத்த ஆவியின் மூலம்
  alternative: பரிசுத்த ஆவியால்
  rationale: διά + மரபுவேற்றுமை வழிமுறையையும் செயலாற்றும் முகவரையும் குறிக்க முடியும். ‘மூலம்’ என்பதை முதன்மை உரையில் வைத்து, ‘ஆவியால்’ என்பதை மாற்று வாசிப்பாகக் குறிப்பது இந்த நுணுக்கத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பொக்கிஷம்’ παραθήκη-யின் ஒப்படைக்கப்பட்ட மதிப்புமிக்க பொருள் என்ற உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது. ‘பரிசுத்த ஆவி’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல்லாக்கம்; ‘குடியிருக்கும்’ என்பது உள்ளுறைதலைத் தெளிவாகவும் தொழில்நுட்பமற்ற முறையிலும் தெரிவிக்கிறது.
