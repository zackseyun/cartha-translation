  yaml_path: translation/nt/2_timothy/001/017.yaml
  text: but when he was in Rome[a], he searched for me diligently and found me—
translation:
  language: ta
  text: ஆனால் அவர் ரோமில் இருந்தபோது[a], என்னை மிகுந்த முயற்சியுடன் தேடிக் கண்டுபிடித்தார்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் ரோமுக்கு வந்தபோது”; இன்னும் சொல்லுக்குச் சொல் வடிவில், “ரோமில் இருந்தவராக.” கிரேக்கச் சொற்றொடர் அவர் ரோமில் இருந்ததையோ அங்கு வந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய சூழலில் மற்றவர்களின் நடத்தைக்கு ஒநேசிப்போருவின் செயலை எதிர்மறை இணைப்பால் வேறுபடுத்துகிறது.
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: அவர் ரோமில் இருந்தபோது
  rationale: கிரேக்கப் பங்கேற்புவினை இங்கு ரோமில் இருத்தல் அல்லது அங்கு வந்தடைதல் என இயல்பாகப் புரிந்துகொள்ளப்படலாம்; முதன்மை உரை இடநிலையைத் தெளிவாகவும் கூடுதல் வருகைக் கருத்தைத் திணிக்காமலும் தருகிறது.
- source_word: σπουδαίως
  choice: மிகுந்த முயற்சியுடன்
  rationale: ஆர்வம், அக்கறை, தீவிரமான முயற்சி ஆகியவற்றைக் குறிக்கும் வினையடையின் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐζήτησέν με
  choice: என்னை ... தேடி
  rationale: ஒருவரைக் கண்டறிய நோக்கமுடன் தேடுவதைக் குறிக்கும் செயலை நேரடியாகத் தருகிறது.
- source_word: καὶ εὗρεν
  choice: கண்டுபிடித்தார்
  rationale: தேடலின் வெற்றிகரமான முடிவைத் தமிழில் இயல்பாகக் கூறுகிறது; முந்தைய ‘என்னை’ என்பதே இதற்கும் செயப்படுபொருளாக அமைகிறது.
