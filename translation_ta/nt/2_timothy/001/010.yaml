  - severity: low
    issue: The main name-title sequence is somewhat unnatural in Tamil.
    rationale: ‘மெசியா இயேசு’ is intelligible, but ‘இயேசு மெசியா’ more naturally expresses a personal name followed by an active title in modern Tamil.
