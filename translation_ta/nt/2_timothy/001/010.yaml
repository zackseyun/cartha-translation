id: 2TI.1.10
reference: 2 Timothy 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: ta
  text: ஆனால், அந்த அருள் இப்போது நம் மீட்பரான இயேசு மெசியாவின்[a] தோன்றுதலின் மூலம் வெளிப்படுத்தப்பட்டுள்ளது; அவர் மரணத்தை ஒழித்து, வாழ்வையும் அழியாமையையும் நற்செய்தியின் மூலம் வெளிச்சத்திற்குக் கொண்டுவந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இயேசு கிறிஸ்து.’ கிரேக்க Χριστός என்பது ‘மெசியா’ என்ற பட்டமாகவோ, ‘கிறிஸ்து’ என்ற பெயர்போன்ற அடையாளமாகவோ செயல்படலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘அழியாமை’ என்பதற்கு ‘மரணமின்மை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அழிவுக்கும் சிதைவுக்கும் உட்படாத தன்மையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: வெளிப்படுத்தப்பட்டுள்ளது
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கடவுளின் அருளைச் சுட்டும் இறந்தகாலச் செயப்பாட்டு வடிவத்தின் பொருளைப் பாதுகாக்கிறது; தமிழில் இயல்பான வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: ἐπιφανείας
  choice: தோன்றுதல்
  rationale: இயேசுவின் வரலாற்றுச் சார்ந்த வெளிப்படையான வருகையைக் குறிக்கும் இயல்பான, புரிந்துகொள்ளக்கூடிய தமிழ் சொல்.
- source_word: σωτῆρος
  choice: மீட்பர்
  rationale: விடுதலையையும் இரட்சிப்பையும் உள்ளடக்கும் கிறிஸ்துவியல் பட்டத்திற்குப் பொருத்தமான நிலையான தமிழ் சொல்.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மெசியா இயேசு
  rationale: Χριστός இங்கு இயேசுவின் பெயருடன் இணைந்திருந்தாலும், ‘நம் மீட்பர்’ என்பதற்குப் பின் வருவதால் அதன் பட்டத்தன்மை தெளிவாக உள்ளது; தமிழில் பட்டத்தைப் பெயருக்கு முன் வைப்பது இயல்பானது.
- source_word: καταργήσαντος
  choice: ஒழித்து
  rationale: மரணத்தின்மேல் நிகழ்ந்த தீர்மானமான வெற்றியை வலுவாகக் கூறுகிறது; மரணம் இப்போதே முற்றிலும் இல்லாமல் போயிற்று என்று காலநிலையை விரிவாகத் தீர்மானிக்காமல் கிரேக்கத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: θάνατον
  choice: மரணம்
  rationale: நேரடியான, இயல்பான இணைச்சொல்.
- source_word: φωτίσαντος
  choice: வெளிச்சத்திற்குக் கொண்டுவந்தார்
  rationale: முன்பு மறைந்திருந்ததை வெளிப்படுத்துதல் என்ற கிரேக்க உருவகத்தையும் அதன் இரு பொருட்களான வாழ்வு, அழியாமை என்பவற்றுடனான தொடர்பையும் பாதுகாக்கிறது.
- source_word: ζωὴν
  choice: வாழ்வு
  rationale: இரட்சிப்பு மற்றும் வருங்கால நிறைவு சார்ந்த பொருளை விரிவாக்காமல் தக்கவைக்கும் இயல்பான சொல்.
- source_word: ἀφθαρσίαν
  choice: அழியாமை
  rationale: சிதைவு அல்லது அழிவுக்கு உட்படாத தன்மையை எளிய, dignified நவீன தமிழில் தெரிவிக்கிறது; ‘மரணமின்மை’ என்ற பரவலான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: நற்செய்தியின் மூலம்
  rationale: διά உடன் வரும் கருவி அல்லது வழிமுறைப் பொருளைப் பாதுகாக்கிறது; ‘நற்செய்தி’ பொதுவாகப் புரியும் தமிழ் மொழிபெயர்ப்பு.
- source_word: μὲν ... δὲ
  choice: ஒழித்து, … வெளிச்சத்திற்குக் கொண்டுவந்தார்
  rationale: மரணத்தை ஒழித்தல் மற்றும் வாழ்வையும் அழியாமையையும் வெளிப்படுத்துதல் ஆகிய இணையான, எதிர்முகச் செயல்களைத் தமிழில் இயல்பான அமைப்பில் காட்டுகிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-வின் பட்டத்தன்மை
  choice: மெசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: ‘நம் மீட்பர்’ என்பதற்குப் பின் வருவதால் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற மெசியாப் பட்டத்தின் பொருள் இங்கு செயலில் உள்ளது; மாற்று மரபுவழிப் பெயருருவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: καταργήσαντος என்பது மரணத்தைப் பற்றி கூறும் வலிமை
  choice: மரணத்தை ஒழித்து
  alternative: மரணத்தை வலுவிழக்கச் செய்து
  rationale: கிரேக்கம் மரணத்தின் தீர்மானமான செயலிழப்பை வலுவாக அறிவிக்கிறது. ‘ஒழித்து’ அந்த வலிமையைத் தக்கவைக்கிறது; மரணம் இக்காலத்தில் முற்றிலும் காணப்படுவதில்லை என்ற கூடுதல் விளக்கத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: ἀφθαρσίαν என்பதன் பொருள்
  choice: அழியாமை
  alternative: மரணமின்மை
  rationale: முதன்மைச் சொல் அழிவுக்கும் சிதைவுக்கும் உட்படாத தன்மையைப் பாதுகாக்கிறது; முடிவில்லா உயிர்வாழ்வை மட்டும் வலியுறுத்தக்கூடிய ‘மரணமின்மை’ மாற்றாகக் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. முந்தைய வசனத்திலுள்ள ‘அருள்’ என்பதோடு இலக்கணத் தொடர்பு தெளிவுபடுத்தப்பட்டுள்ளது. கிரேக்கப் பங்கேற்புச் சொற்றொடர்கள் தமிழில் இயல்பான முறையில் இரண்டு வாக்கியங்களாக மாற்றப்பட்டுள்ளன; அவற்றின் கருத்தியல் இணைப்பு பாதுகாக்கப்பட்டுள்ளது.
