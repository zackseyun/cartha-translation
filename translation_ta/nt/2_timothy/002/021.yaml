id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: ta
  text: ஆகவே, ஒருவன் இவற்றிலிருந்து தன்னை முற்றிலும் தூய்மைப்படுத்திக்கொண்டால், அவன் மதிப்புக்குரிய பயன்பாட்டிற்கான பாத்திரமாக[a], பரிசுத்தமாக்கப்பட்டதாகவும்[b], எஜமானுக்குப் பயனுள்ளதாகவும், ஒவ்வொரு நற்செயலுக்கும் ஆயத்தமாக்கப்பட்டதாகவும் இருப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மதிப்புக்குரிய பாத்திரமாக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பரிசுத்தமானதாக” அல்லது “தனியே ஒதுக்கிவைக்கப்பட்டதாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: ஆகவே, ... என்றால்
  rationale: οὖν முந்தைய கருத்திலிருந்து வரும் முடிவைக் குறிக்கிறது; ἐὰν நிபந்தனையைக் குறிக்கிறது. இவ்விரண்டையும் இயல்பான தமிழில் தனித்தனியாக வெளிப்படுத்துகிறது.
- source_word: τις
  choice: ஒருவன்
  rationale: இங்கு இது குறிப்பிட்ட நபரை அல்ல, யாராக இருந்தாலும் என்ற பொதுவான ஒருமை நபரைக் குறிக்கிறது. தொடரும் தற்சுட்டுப் பெயருடன் இயல்பாக இணைகிறது.
- source_word: ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων
  choice: இவற்றிலிருந்து தன்னை முற்றிலும் தூய்மைப்படுத்திக்கொண்டால்
  rationale: ἐκκαθαίρω என்பதிலுள்ள முழுமையாக அகற்றித் தூய்மைப்படுத்தும் வலிமையையும், ἀπὸ τούτων என்பதிலுள்ள முந்தைய சூழலைச் சுட்டும் குறிப்பையும் காக்கிறது.
- source_word: σκεῦος
  choice: பாத்திரம்
  rationale: முந்தைய வசனத்தின் வீட்டுப் பாத்திர உருவகத்தைத் தொடர்ந்து காக்கிறது; ‘கருவி’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: εἰς τιμήν
  choice: மதிப்புக்குரிய பயன்பாட்டிற்கான
  rationale: முந்தைய வசனத்திலுள்ள மதிப்பான மற்றும் மதிப்பற்ற பயன்பாடுகளின் வேறுபாட்டை இயல்பான தமிழில் தெளிவாக்குகிறது; ‘மதிப்புக்கான’ என்ற நேரடி வடிவின் பொருளையும் அடிப்படையில் காக்கிறது.
- source_word: ἡγιασμένον
  choice: பரிசுத்தமாக்கப்பட்டவனாக
  rationale: முன்னர் நிகழ்ந்த பரிசுத்தமாக்கும் செயலின் விளைவாகத் தொடரும் நிலையைக் காட்டும் நிறைவேற்றப்பட்ட செயப்பாட்டு வடிவை வெளிப்படுத்துகிறது.
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: எஜமானுக்குப் பயனுள்ளவனாக
  rationale: εὔχρηστος என்பதன் பயன்படத்தக்க தன்மையையும், δεσπότης என்பதன் வீட்டின் மீது அதிகாரமுள்ள எஜமான் என்ற உருவகத்தையும் காக்கிறது.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: ஒவ்வொரு நற்செயலுக்கும் ஆயத்தமாக்கப்பட்டவனாக
  rationale: πᾶν என்பதன் முழு விரிவையும், ἡτοιμασμένον என்பதன் ஆயத்தப்படுத்தப்பட்ட நிலையைச் சுருக்காமல் தெரிவிக்கிறது.
theological_decisions:
- issue: பொதுவான ஒருமை நபரையும் தற்சுட்டுச் செயலையும் மொழிபெயர்த்தல்
  choice: ஒருவன் ... தன்னை ... அவன்
  alternative: யாராவது ... தம்மை ... அவர்
  rationale: கிரேக்கத்தின் பொதுவான ஒருமையையும் தன்னைத் தூய்மைப்படுத்தும் பொறுப்பையும் தெளிவாகக் காக்கிறது; குறிப்பிட்ட ஆண்களுக்கு மட்டுமே உரியதாகப் பொருள் கட்டுப்படுத்தப்படவில்லை.
- issue: ἡγιασμένον என்பதன் பரிசுத்தம் மற்றும் ஒதுக்கிவைத்தல் சார்ந்த பொருள்
  choice: பரிசுத்தமாக்கப்பட்டவனாக
  alternative: தனியே ஒதுக்கிவைக்கப்பட்டவனாக
  rationale: மூலச்சொல்லின் பரிசுத்தப்படுத்தப்பட்ட நிலையை நேரடியாகக் காக்கிறது; சேவைக்காக ஒதுக்கிவைக்கப்பட்ட நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: δεσπότης என்பதன் வீட்டுருவக அதிகார உறவு
  choice: எஜமான்
  alternative: ஆண்டவர் அல்லது உரிமையாளர்
  rationale: வீட்டுப் பாத்திர உருவகத்திற்குள் அதிகாரமுள்ளவரைக் குறிக்கும் சொல்லாக உள்ளது. இதை ஒரு குறிப்பிட்ட தெய்வீகப் பட்டமாக வெளிப்படையாக மாற்றாமல், சூழலில் உள்ள இறைச் சுட்டையும் மறைக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பாத்திரம்’ என்ற வீட்டுருவகம் தொடர்ச்சியாகக் காக்கப்பட்டுள்ளது. ஒரே நீண்ட வாக்கியத்தின் விளக்கப் பகுதிகளை நீண்ட கோடு மற்றும் இணைப்புச் சொற்கள் மூலம் வாசிக்க எளிதாக்கப்பட்டுள்ளது; கிரேக்கத்தின் நிபந்தனை, எதிர்கால விளைவு, மற்றும் நிறைவேற்றப்பட்ட நிலைகள் அனைத்தும் வெளிப்படுத்தப்பட்டுள்ளன.
