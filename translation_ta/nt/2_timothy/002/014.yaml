id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: ta
  text: இவற்றைத் தொடர்ந்து நினைவூட்டு. சொற்களைக் குறித்து வாக்குவாதம் செய்ய வேண்டாம் என்று ஆண்டவரின் முன்னிலையில் அவர்களுக்கு உறுதியாகக் கட்டளையிடு. அத்தகைய வாக்குவாதம் எந்தப் பயனுக்கும் அல்ல; அது கேட்கிறவர்களின் அழிவுக்கே வழிவகுக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எந்த நன்மையையும் தராது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: இவற்றை
  rationale: முந்தைய போதனைகளைப் பின்னோக்கிச் சுட்டும் நடுநிலைப் பன்மைச் சுட்டுப்பெயரின் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ὑπομίμνῃσκε
  choice: தொடர்ந்து நினைவூட்டு
  rationale: நிகழ்காலக் கட்டளையின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் செய்யும் செயற்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: διαμαρτυρόμενος
  choice: உறுதியாகக் கட்டளையிடு
  rationale: வினையெச்சத்தின் கடுமையான வலியுறுத்தல் மற்றும் பொறுப்புணர்வுடன் ஆணையிடும் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; சூழலிலிருந்து ‘அவர்களுக்கு’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: ஆண்டவரின் முன்னிலையில்
  rationale: தெய்வீகச் சாட்சியின் கீழ் பேசுவதைச் சுட்டும் சொற்றொடரைப் பாதுகாக்கிறது; κύριος என்பதன் குறிப்பிட்ட அடையாளத்தைத் தேவையின்றி குறுக்கவில்லை.
- source_word: μὴ λογομαχεῖν
  choice: சொற்களைக் குறித்து வாக்குவாதம் செய்ய வேண்டாம்
  rationale: சொற்களைப் பற்றிய பயனற்ற வாய்ச்சண்டை என்ற λογομαχέω-வின் இழிவான நிழற்பொருளை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: எந்தப் பயனும் இல்லை
  rationale: முற்றிலும் பயனற்றது என்ற மதிப்பீட்டைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: ἐπὶ καταστροφῇ
  choice: அழிவுக்குள்ளாக்கும்
  rationale: καταστροφή என்பதன் கடுமையையும், வாக்குவாதம் கேட்போருக்கு விளைவிக்கும் தீங்கான முடிவையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: τῶν ἀκουόντων
  choice: கேட்கிறவர்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நிகழ்கால வினையெச்சத்தின் தொடர்ச்சியான கேட்போர் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: κύριος என்பதன் குறிப்பு
  choice: ஆண்டவர்
  alternative: கடவுள்; ஆண்டவர் இயேசு
  rationale: கிரேக்க உரை ‘ஆண்டவர்’ என்று மட்டுமே கூறுகிறது. இயேசுவையோ கடவுளையோ குறிப்பாகச் சேர்த்து பொருளைச் சுருக்காமல், உரையிலுள்ள உண்மையான தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், திருச்சபை வாசிப்புக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கருத்துத் தொடர்பு காக்கப்பட்டுள்ளது.
