revisions:
- from: இவற்றைத் தொடர்ந்து நினைவூட்டு. சொற்களைக் குறித்து வாக்குவாதம் செய்ய வேண்டாம் என்று ஆண்டவரின் முன்னிலையில் அவர்களுக்கு உறுதியாகக் கட்டளையிடு. அத்தகைய வாக்குவாதத்தால் எந்தப் பயனும் இல்லை[a]; மாறாக, அது கேட்கிறவர்களை அழிவுக்குள்ளாக்கும்.
  to: இவற்றைத் தொடர்ந்து நினைவூட்டு. சொற்களைக் குறித்து வாக்குவாதம் செய்ய வேண்டாம் என்று ஆண்டவரின் முன்னிலையில் அவர்களுக்கு உறுதியாகக் கட்டளையிடு. அத்தகைய வாக்குவாதம் எந்தப் பயனுக்கும் அல்ல; அது கேட்கிறவர்களின் அழிவுக்கே வழிவகுக்கும்.[a]
