id: 2TI.2.9
reference: 2 Timothy 2:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: ta
  text: அதற்காக[a] நான் ஒரு குற்றவாளியைப் போலச் சங்கிலிகளில் கட்டப்பட்டிருக்கும் அளவுக்குத் துன்பப்படுகிறேன். ஆனால் கடவுளின் வார்த்தையோ கட்டப்பட்டிருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதில்” அல்லது “அதன் காரணமாக.” கிரேக்கச் சொற்றொடர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நற்செய்தியையே பெரும்பாலும் சுட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அதற்காக
  rationale: இந்தத் தொடர்புச் சொற்றொடர் முந்தைய வசனத்தில் கூறப்பட்ட நற்செய்தியைச் சுட்டி, பவுல் துன்பப்படுவதற்கான காரணத்தை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கத்தில் உள்ள இடம்/சூழல் சார்ந்த மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: κακοπαθῶ
  choice: துன்பப்படுகிறேன்
  rationale: நிகழ்காலத்தில் தொடரும் வேதனையையும் கடின அனுபவத்தையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μέχρι δεσμῶν
  choice: சங்கிலியிடப்படும் அளவுக்கு
  rationale: μέχρι குறிக்கும் எல்லையை ‘அளவுக்கு’ என்பது வெளிப்படுத்துகிறது; δεσμῶν என்பதன் சங்கிலி உருவகத்தையும் சிறைவாசச் சூழலையும் இது தக்கவைக்கிறது.
- source_word: ὡς κακοῦργος
  choice: ஒரு குற்றவாளியைப் போல
  rationale: நீதித்துறை மற்றும் சிறைவாசச் சூழலில் κακοῦργος என்பதன் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; ‘தீமை செய்பவன்’ என்ற பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: பவுல் சங்கிலியிடப்பட்டிருப்பதற்கும் கடவுளின் வார்த்தை கட்டப்படாதிருப்பதற்கும் இடையிலான வலுவான முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: கடவுளின் வார்த்தை
  rationale: λόγος என்பதைக் குறிப்பாக வேதாகமம் அல்லது நற்செய்தி என்று மட்டும் குறுக்காமல், கடவுளின் அறிவிக்கப்பட்ட செய்தியையும் உள்ளடக்கும் அதன் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: οὐ δέδεται
  choice: கட்டப்பட்டிருக்கவில்லை
  rationale: நிறைவுப்பாங்குடைய செயப்பாட்டு வடிவம் குறிக்கும் தற்போதைய நிலையைக் காத்து, பவுலின் சங்கிலிகளுடன் உள்ள கருத்துப்பூர்வமான முரண்பாட்டையும் தொடர்கிறது.
theological_decisions:
- issue: ‘கடவுளின் வார்த்தை’ என்பதன் இயல்பு
  choice: கடவுளின் வார்த்தை
  alternative: நற்செய்தி; வேதவாக்கியம்
  rationale: உடனடிச் சூழல் அறிவிக்கப்படும் நற்செய்தியைச் சிறப்பாகச் சுட்டினாலும், கிரேக்கச் சொற்றொடர் அதைவிடப் பரந்தது. ஆகவே எந்த ஒரு குறிப்பிட்ட பொருளுக்குள்ளும் அதைச் சுருக்காமல் மூலத்தின் பரப்பும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வார்த்தையோ’ என்பதிலுள்ள ‘-ஓ’ எதிர்மறை ஒப்பீட்டை இயல்பாக வலுப்படுத்துகிறது; சங்கிலி/கட்டுதல் என்ற மூல உருவகம் இரு வாக்கியங்களிலும் பாதுகாக்கப்பட்டுள்ளது.
