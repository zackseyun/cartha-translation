revisions:
- from: ஆனால், பரிசுத்தமற்ற வெற்றுப் பேச்சுகளைத் தவிர்த்துவிடு[a]. ஏனெனில், அவற்றில் ஈடுபடுகிறவர்கள் இறைப்பற்றின்மையில் மேலும் மேலும் முன்னேறுவார்கள்.
  to: ஆனால், இறைமரியாதையற்ற வெற்றுப் பேச்சுகளை விலக்கு[a]. ஏனெனில், அவர்கள் இறைப்பற்றின்மையில் மேலும் மேலும் முன்னேறுவார்கள்.
  rationale: The revision avoids introducing an explicit group of participants where the Greek retains an implicit plural subject, while retaining the footnoted alternative reading. It also strengthens the rendering of βεβήλους from a merely non-sacred sense to the intended irreverent/profane sense, without altering the verse’s meaning or register.
