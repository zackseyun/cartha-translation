id: 2TI.2.16
reference: 2 Timothy 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: ta
  text: ஆனால், இறைமரியாதையற்ற வெற்றுப் பேச்சுகளை விலக்கு[a]. ஏனெனில், அவர்கள் இறைப்பற்றின்மையில் மேலும் மேலும் முன்னேறுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இறைப்பற்றற்ற அரட்டை,’ ‘வீண் பிதற்றல்,’ அல்லது ‘உள்ளீடற்ற பேச்சு’ என்றும் மொழிபெயர்க்கலாம். ‘அவர்கள்’ என்பதன் குறிப்பு சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது; ‘இத்தகைய பேச்சுகள் இறைப்பற்றின்மையை மேலும் மேலும் வளர்க்கும்’ என்றும் சிலர் பொருள் கொள்கிறார்கள்.
    reason: βεβήλους மற்றும் κενοφωνίας என்பவற்றுக்கான சொற்பொருள் மாற்றுகளையும், προκόψουσιν என்ற பன்மை வினையின் உட்குறிப்பான எழுவாய் குறித்த விளக்கவியல் தெளிவின்மையையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: βεβήλους
  choice: பரிசுத்தமற்ற
  rationale: புனிதமானதற்கு எதிரான, இறைமரியாதையற்ற தன்மையை இது வெளிப்படுத்துகிறது; வெறும் ‘உலகத்துக்குரிய’ என்ற மெலிந்த பொருளைத் தவிர்க்கிறது.
- source_word: κενοφωνίας
  choice: வெற்றுப் பேச்சுகள்
  rationale: பொருளோ பயனோ இல்லாத பேச்சு என்ற சொல்லின் நேரடியான உருவகத்தையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: περιΐστασο
  choice: தவிர்த்துவிடு
  rationale: அத்தகைய பேச்சிலிருந்து விலகி நிற்குமாறு தீமொத்தேயுவுக்குக் கொடுக்கப்படும் நிகழ்கால நடுநிலை கட்டளையின் நடைமுறை வலிமையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐπὶ πλεῖον
  choice: மேலும் மேலும்
  rationale: ஒரு நிலை தொடர்ந்து அதிகரிப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: προκόψουσιν
  choice: முன்னேறுவார்கள்
  rationale: பொதுவாக நேர்மறையாகத் தோன்றும் ‘முன்னேற்றம்’ இங்கு தீய திசையில் நிகழ்வதை மூலத்தின் கூர்மையான முரணுடன் காக்கிறது.
- source_word: ἀσεβείας
  choice: இறைப்பற்றின்மை
  rationale: கடவுளை மதியாத மத-ஒழுக்க நிலையை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய அறிவுரையுடன் உள்ள எதிர்மறை மாறுபாட்டைக் குறிக்கிறது.
theological_decisions:
- issue: இது பயனற்ற பேச்சை மட்டும் குறிக்கிறதா, அல்லது இறைமரியாதையற்ற பேச்சையும் குறிக்கிறதா?
  choice: ‘பரிசுத்தமற்ற வெற்றுப் பேச்சுகள்’ என்று மொழிபெயர்த்து, அதன் வெறுமையையும் புனிதத்திற்கு எதிரான தன்மையையும் காத்தல்.
  alternative: ‘இறைப்பற்றற்ற அரட்டை’ அல்லது ‘வீண் பிதற்றல்’.
  rationale: βεβήλους மற்றும் κενοφωνίας ஆகிய இரு சொற்களும் சேர்ந்து, வெறும் பயனின்மையை மட்டுமல்லாமல் இறைமரியாதையற்ற தன்மையையும் காட்டுகின்றன; அத்தகைய பேச்சு அதிகமான ἀσέβεια நோக்கி இட்டுச் செல்கிறது.
- issue: προκόψουσιν என்பதன் மறைமுக எழுவாய் யார்?
  choice: தமிழில் தெளிவுக்காக ‘அவற்றில் ஈடுபடுகிறவர்கள்’ என்று வெளிப்படுத்தல்.
  alternative: ‘அவை இறைப்பற்றின்மையை மேலும் மேலும் வளர்க்கும்’ அல்லது எழுவாயை வெளிப்படுத்தாமல் விடுதல்.
  rationale: கிரேக்க வினை பன்மை எழுவாயைக் கோருகிறது; அருகிலுள்ள ‘வெற்றுப் பேச்சுகள்’ இலக்கணரீதியாக எழுவாயாக இருக்கக்கூடியபோதும், அடுத்த வசனத்தின் மனிதர்களைப் பற்றிய சூழல் பேசுகிறவர்களைக் குறிக்கும் வாசிப்பையும் ஆதரிக்கிறது. இயல்பான தமிழுக்காக மனித செய்பவர் வெளிப்படுத்தப்பட்டார்; குறிப்பில் மாற்று அமைப்பு தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகருக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம அறிவுரைக்கேற்ற கண்ணியமான கட்டளை நடையிலும் அமைக்கப்பட்டது. ‘பரிசுத்தமற்ற’ மற்றும் ‘இறைப்பற்றின்மை’ ஆகியவை வசனத்தின் மத-ஒழுக்க வலிமையைத் தக்கவைக்கின்றன.
