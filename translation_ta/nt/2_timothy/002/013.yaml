base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: ta
  text: நாம் விசுவாசமற்றவர்களாய் இருந்தால்[a], அவர் விசுவாசமுள்ளவராய்[b] நிலைத்திருக்கிறார்; தம்மையே மறுதலிக்க அவரால் முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாம் நம்பாமல் இருந்தால்’ அல்லது ‘நாம் உண்மையற்றவர்களாய் இருந்தால்.’ கிரேக்க வினைச்சொல் இந்த இரு பொருள்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நம்பத்தகுந்தவராய்.’ முந்தைய ‘விசுவாசமற்றவர்கள்’ என்பதுடனான சொல்லெதிர்மையைப் பாதுகாக்க ‘விசுவாசமுள்ளவர்’ என்பது முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν (ἀπιστέω)
  choice: விசுவாசமற்றவர்களாக இருந்தாலும்
  rationale: இந்த வினைச்சொல் ‘நம்பாமல் இருத்தல்’ என்றும் ‘உண்மையற்று இருத்தல்’ என்றும் பொருள்படக்கூடும். ‘விசுவாசமற்றவர்கள்’ என்பது இரு சாத்தியங்களையும் ஓரளவு திறந்துவைப்பதுடன், அடுத்து வரும் πιστός என்பதுடனான சொல்லெதிர்மையையும் காக்கிறது.
- source_word: πιστὸς
  choice: விசுவாசமுள்ளவராகவே
  rationale: ‘விசுவாசமுள்ளவர்’ என்பது அவர் உண்மைத்தவறாதவர் என்ற பொருளைத் தருவதோடு, ἀπιστοῦμεν என்பதற்கான தமிழாக்கத்துடன் உள்ள திட்டமிட்ட சொல்லெதிர்மையையும் பாதுகாக்கிறது. ‘நம்பத்தகுந்தவர்’ என்பதும் சாத்தியம்.
- source_word: μένει
  choice: நிலைத்திருக்கிறார்
  rationale: தொடர்ந்து மாறாமல் இருப்பதைக் காட்டும் இயல்பான, கண்ணியமான நவீனத் தமிழ் வடிவம்.
- source_word: ἀρνήσασθαι
  choice: மறுதலிக்க
  rationale: ἀρνέομαι என்பதன் வலுவான உறவுசார் மற்றும் ஒழுக்கப் பொருளை நேரடியாகத் தருகிறது; ‘தம்முடையவர் அல்ல என்று சொல்ல’ அல்லது ‘கைவிட’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: ἑαυτὸν
  choice: தம்மையே
  rationale: ἐκεῖνος என்பவரையே சுட்டும் தன்மறுமைப் பெயர்ச்சொல்லைத் தெளிவாகவும் வலியுறுத்தலுடனும் காட்டுகிறது.
- source_word: οὐ δύναται
  choice: அவரால் முடியாது
  rationale: வெறும் விருப்பமின்மையை அல்ல, இயலாமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: மனிதரின் விசுவாசமின்மையுடன் தொடர்புடைய கடவுளின் விசுவாசத்தின் பொருள்
  choice: மனிதரின் விசுவாசமின்மையிலும் அவர் தமது இயல்புக்கு மாறாக நடக்க முடியாததால் விசுவாசமுள்ளவராக நிலைத்திருக்கிறார் என்று வசனம் கூறுகிறது; இது இரட்சிப்பையா, வாக்குறுதிகளைக் காப்பதையா, நியாயத்தீர்ப்பையா முதன்மையாகக் குறிக்கிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
  alternative: அவர் தமது மக்களின் பலவீனத்தையும் மீறி அவர்களை இரட்சிக்க விசுவாசமுள்ளவர்; அல்லது விசுவாசத்துரோகத்தைப் பற்றிய நியாயத்தீர்ப்பு எச்சரிக்கைகள் உட்பட தமது வார்த்தையை நிறைவேற்ற விசுவாசமுள்ளவர்.
  rationale: கிரேக்க வாசகம் கடவுளின் மாறாத தன்மையை உறுதிப்படுத்துகிறது; ஆனால் அதன் குறிப்பிட்ட மேய்ப்பியல் அல்லது இறையியல் விளைவைத் தெளிவுபடுத்தவில்லை. எனவே மூலத்தில் உள்ள இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விசுவாசம்’ என்ற பரவலாக அறியப்படும் சொல், கிரேக்கத்தில் உள்ள ἀπιστέω/πιστός சொல்லுறவை தமிழிலும் வெளிப்படுத்துவதற்காகத் தேர்ந்தெடுக்கப்பட்டது. இரண்டாம் கூற்றை விளக்கமாக வாசிக்க இயலும் வகையில் அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; கிரேக்கத்தில் வெளிப்படையான ‘ஏனெனில்’ இல்லாததால் அது முதன்மை உரையில் சேர்க்கப்படவில்லை.
