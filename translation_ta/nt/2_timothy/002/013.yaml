  terminology: ‘விசுவாசமற்றவர்’ and ‘விசுவாசமுள்ளவர்’ suitably preserve the deliberate Greek lexical contrast while allowing the stated range of unbelief and unfaithfulness. ‘தம்மையே மறுதலிக்க’ is a strong, natural rendering of ἀρνήσασθαι ἑαυτόν.
