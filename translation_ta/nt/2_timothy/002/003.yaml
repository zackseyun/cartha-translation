  yaml_path: translation/nt/2_timothy/002/003.yaml
  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: ta
  text: மேசியாவாகிய இயேசுவின் நல்ல படைவீரனாகத் துன்பத்தில் பங்குகொள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியாவாகிய இயேசுவின் நல்ல படைவீரனாக என்னோடு துன்பத்தைச் சகித்துக்கொள்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “கிறிஸ்து இயேசு”; Χριστός இங்கு ஒரு பட்டமாகச் செயல்படுவதால், முதன்மை உரையில் “மேசியாவாகிய இயேசு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: துன்பத்தில் பங்குகொள்
  rationale: இது இரண்டாம் நபர் ஒருமை ஏவல் வினை. σύν- முன்னொட்டு, தனியாகத் துன்பப்படுவதைவிட மற்றவர்களோடு பொதுவாகத் துன்பத்தைப் பகிர்ந்துகொள்ளும் பொருளைத் தருகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘என்னோடு’ என்ற செயப்படுபொருளை முதன்மை உரையில் சேர்க்காமல், கூட்டு அனுபவத்தின் நுணுக்கத்தை இச்சொற்றொடர் காக்கிறது.
- source_word: ὡς
  choice: ஆக
  rationale: ஒப்புமையையும் ஒருவர் செயல்பட வேண்டிய நிலையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: καλὸς
  choice: நல்ல
  rationale: பாராட்டத்தக்க தகுதி அல்லது நேர்த்தியைச் சுட்டுகிறது; படைவீரன் என்ற சொல்லுடன் ‘நல்ல’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: στρατιώτης
  choice: படைவீரன்
  rationale: சாதாரணமாக ஒரு படைவீரனைக் குறிக்கும் சொல்; பவுலின் உருவகப் பயன்பாட்டையும் நேரடியாகக் காக்கிறது.
- source_word: Χριστοῦ
  choice: மேசியாவாகிய
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுகிறது. ‘மேசியா’ அதன் பொருளை மொழிபெயர்க்கிறது; ‘ஆகிய’ என்பது தமிழ் தொடரில் பட்டத்தையும் இயற்பெயரையும் தெளிவாக இணைக்கிறது.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: Ἰησοῦς என்ற இயற்பெயரின் வழக்கமான தமிழ் வடிவம்; உடைமைப் பொருள் முழுச் சொற்றொடரின் இறுதியில் வரும் ‘இன்’ விகுதியால் காட்டப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός இங்கு பட்டமும் Ἰησοῦς இயற்பெயரும் ஆகும். பட்டத்தின் பொருளை மொழிபெயர்த்து, பெயரை வழக்கமான தமிழ் வடிவில் வழங்குவது கிரேக்கத்தின் அமைப்பையும் கிறிஸ்தியல் சார்ந்த பட்டப் பொருளையும் காக்கிறது; மாற்று மரபுவழித் திருச்சபைச் சொல்லாட்சியாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான ஏவல் வாக்கியமாகவும் கண்ணியமான வேதாகம நடையிலும் அமைக்கப்பட்டுள்ளது. ‘பங்குகொள்’ கூட்டு அனுபவத்தை இயல்பாக வெளிப்படுத்துகிறது; ‘படைவீரன்’ உருவகத்தை நேரடியாகக் காக்கிறது.
