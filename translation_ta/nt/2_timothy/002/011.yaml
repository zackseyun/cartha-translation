  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος· εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: ta
  text: 'இந்தக் கூற்று நம்பத்தகுந்தது[a]: ஏனெனில், நாம் அவரோடு இறந்திருந்தால்[b], நாமும் அவரோடு வாழ்வோம்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வார்த்தை உண்மையுள்ளது” அல்லது “இந்த அறிக்கை நம்பகமானது.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “நாம் உடன் இறந்திருந்தால்.” கூட்டுவினையின் முன்னொட்டு ஒருவரோடு பகிர்ந்த மரணத்தைக் குறிக்கிறது; உடனிருப்பவர் வசனத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை, சூழலில் அவர் கிறிஸ்து.
    reason: lexical_alternative
  - marker: c
    text: “நாமும் அவரோடு வாழ்வோம்” என்பது கிறிஸ்துவோடு உயிர்த்தெழுதலின் வாழ்வையோ, அவருடைய வாழ்வில் இப்போதைய பங்கேற்பையோ, அல்லது இரண்டையுமோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: நம்பத்தகுந்தது
  rationale: λόγος என்பதைக் குறித்து நிற்கும் பெயரடை. கூறப்படுவது நம்பிக்கைக்குரியது, உறுதியானது என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὁ λόγος
  choice: இந்தக் கூற்று
  rationale: மேய்ப்பர் நிருபங்களில் πιστὸς ὁ λόγος என்பது சுருக்கமான, நினைவில் நிற்கும் ஓர் அறிவிப்பை அறிமுகப்படுத்தும் வழக்குச் சொற்றொடர். இங்கு ‘கூற்று’ என்பது ‘வார்த்தை’ என்பதைவிட அந்தப் பயன்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἰ γὰρ
  choice: ஏனெனில், … இறந்தோமானால்
  rationale: εἰ-யின் நிபந்தனையையும் γάρ-இன் விளக்கத் தொடர்பையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: συναπεθάνομεν
  choice: நாம் அவரோடு இறந்தோமானால்
  rationale: συν- முன்னொட்டு இன்னொருவரோடு பகிர்ந்த மரணத்தைக் குறிக்கிறது. சூழலின்படி மறைமுகமாக உள்ளவர் கிறிஸ்து என்பதால் ‘அவரோடு’ சேர்க்கப்பட்டுள்ளது; இறந்தோமானால் என்பது அஓரிஸ்ட் நிபந்தனையை மிகைப்படுத்தாமல் தருகிறது.
- source_word: καὶ
  choice: வாழவும்
  rationale: இரு உறுப்புகளுக்கிடையிலான இணைநிலையைத் தமிழின் ‘-வும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συζήσομεν
  choice: அவரோடு வாழவும் செய்வோம்
  rationale: எதிர்காலத்தையும் συν- குறிக்கும் பகிர்ந்த வாழ்வையும் தெளிவாகத் தருகிறது; வாழ்வின் கால அல்லது இறையியல் பரப்பை மொழிபெயர்ப்பு குறுக்கவில்லை.
theological_decisions:
- issue: συν- கூட்டுவினைகளில் மறைமுகமாக உள்ள உடனிருப்பவர்
  choice: இரண்டு வினைகளிலும் ‘அவரோடு’ என்று வழங்கி, கிறிஸ்துவைக் குறிப்பதாக வைத்தல்
  alternative: ‘நாம் இறந்தோமானால், வாழவும் செய்வோம்’ என்று உடனிருப்பவரை வெளிப்படுத்தாமல் விடுதல்
  rationale: வசனத்தில் தனி இடைப்பொருள் இல்லாவிட்டாலும், συν- முன்னொட்டு பகிர்ந்த பங்கேற்பை இயல்பாகக் குறிக்கிறது; சுற்றியுள்ள கிறிஸ்து மையச் சூழல் அதன் குறிப்பைத் தெளிவாக்குகிறது.
- issue: கிறிஸ்துவோடு வாழ்வதன் கால மற்றும் இறையியல் நுட்பம்
  choice: ‘அவரோடு வாழவும் செய்வோம்’ என்று பரந்த பொருளுடன் வழங்குதல்
  alternative: எதிர்கால உயிர்த்தெழுதல் வாழ்வாக மட்டும் அல்லது நிகழ்கால ஆவிக்குரிய வாழ்வாக மட்டும் விளக்குதல்
  rationale: συζήσομεν என்பது இலக்கணப்படி எதிர்காலம்; ஆயினும் இங்கு உயிர்த்தெழுதல் வாழ்வு, கிறிஸ்துவின் வாழ்வில் பங்கேற்பு, அல்லது இரண்டையும் ஒலிக்கச் செய்யலாம். மொழிபெயர்ப்பு அதை ஓர் ஒரே விளக்கத்துக்குள் குறுக்கவில்லை.
