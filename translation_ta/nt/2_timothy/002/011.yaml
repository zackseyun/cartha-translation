  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கூற்று’, ‘நம்பத்தகுந்தது’, ‘அவரோடு’ ஆகியவை இயல்பையும் மூலத்தின் சுருக்கமான பாடல் போன்ற சமநிலையையும் காக்கின்றன.
