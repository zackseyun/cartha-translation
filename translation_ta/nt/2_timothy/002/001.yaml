  source_fidelity: 'The Tamil accurately represents all elements of the Greek: the explicit and emphatic σύ (''நீ''), inferential οὖν (''ஆகவே''), affectionate vocative τέκνον μου (''என் பிள்ளையே''), present imperative ἐνδυναμοῦ (''வலிமை பெறு''), and the modifying phrase ''the grace that is in Messiah Jesus.'' ''அருளில்'' suitably retains the Greek ἐν expression without forcing either an exclusively instrumental or locative interpretation.'
