id: 2TI.2.1
reference: 2 Timothy 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: ta
  text: ஆகவே, என் பிள்ளையே, நீ மேசியாவாகிய[a] இயேசுவில் உள்ள அருளில் வலிமை பெறு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து இயேசு.” Χριστός என்பது “மேசியா,” அதாவது “அபிஷேகம் செய்யப்பட்டவர்” என்னும் பட்டப்பெயர்; “கிறிஸ்து” என்பது அதன் மரபுவழி வடிவம்.
    reason: alternative_rendering
  - marker: b
    text: அல்லது, “பலப்படு.” கிரேக்க வினை வலிமை பெறுவதைக் குறிக்கலாம்; “வலிமை பெறு” என்பது அந்தப் பெறுதல் சார்ந்த நுண்பொருளை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ
  choice: நீ
  rationale: கிரேக்கத்தில் வெளிப்படையாக வந்துள்ள முன்னிலைப்பெயரின் வலியுறுத்தலைத் தமிழிலும் காக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவு அல்லது தொடர்ச்சியை இயல்பான நவீனத் தமிழில் உணர்த்துகிறது.
- source_word: τέκνον μου
  choice: என் பிள்ளையே
  rationale: τέκνον என்பது பாலினத்தைச் சுட்டாமல் ‘பிள்ளை’ எனப் பொருள்படும்; அழைப்புவடிவம் பவுலின் அன்பான ஆன்மிக உறவையும் வெளிப்படுத்துகிறது.
- source_word: ἐνδυναμοῦ
  choice: வலிமை பெறு
  rationale: நடுநிலை/செயப்பாட்டு வடிவத்தின், வலிமை தானாக உருவாக்கப்படாமல் பெற்றுக்கொள்ளப்படுகிறது என்ற சாத்தியமான நுண்பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν τῇ χάριτι
  choice: அருளில்
  rationale: ἐν என்பதன் சூழல் மற்றும் கருவி ஆகிய இரு சாத்தியங்களையும் தேவையின்றிக் குறுக்காமல் வைத்திருக்கிறது.
- source_word: χάριτι
  choice: அருள்
  rationale: χάρις என்பதற்கான நிலையான தமிழ்ச் சொல்; கடவுளின் தயவையும் வலிமையளிக்கும் அருளையும் இச்சூழலில் உள்ளடக்க முடியும்.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவில் உள்ள
  rationale: அருள் இயேசுவில் இருப்பதாகக் கூறும் கிரேக்க அடைமொழித் தொடரை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: Χριστῷ
  choice: மேசியாவாகிய
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளை மொழிபெயர்க்கிறது; தமிழில் இயல்பாக இயேசுவுடன் இணைக்க ‘ஆகிய’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: Ἰησοῦς என்ற பெயரின் நிலையான தமிழ்வடிவம்.
theological_decisions:
- issue: ἐνδυναμοῦ என்பதில் வினைக்குரலும் செயலாற்றுபவரும்
  choice: வலிமை பெறு
  alternative: பலப்படு; உன்னை வலுப்படுத்திக்கொள்
  rationale: நடுநிலை/செயப்பாட்டு கட்டளைவடிவம் வலிமையைப் பெற்றுக்கொள்ளும் நுண்பொருளை அனுமதிக்கிறது. ‘உன்னை வலுப்படுத்திக்கொள்’ என்று மொழிபெயர்த்து சுயவலிமையைத் தேவையின்றி முன்னிறுத்துவதை இது தவிர்க்கிறது.
- issue: Χριστός என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மேசியா’ என்ற பட்டப்பெயர் சார்ந்த அர்த்தத்தை வெளிப்படுத்துகிறது; மரபுவழி ஒலிபெயர்ப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν τῇ χάριτι என்பதில் ἐν-ன் பொருள்
  choice: அருளில்
  alternative: அருளால்
  rationale: அருள் வலிமை பெறும் சூழலா அல்லது கருவியா என்ற பொருள் நுணுக்கத்தை ஒரே திசையில் தீர்மானிக்காமல் கிரேக்கத்தின் திறந்த தன்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘என் பிள்ளையே’ அன்பான அழைப்பை இயல்பாகக் காக்கிறது; ‘மேசியாவாகிய இயேசு’ பட்டப்பெயரின் பொருளைத் தெளிவாக்கினாலும் தேவையற்ற சமயப்பிரிவு சார்ந்த சொல்லாக்கத்தைத் தவிர்க்கிறது.
