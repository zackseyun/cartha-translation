  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: ta
  text: கடினமாக உழைக்கும் விவசாயி விளைச்சலில் ஒரு பங்கை முதலில் பெற வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உழைக்கும் விவசாயி விளைச்சலில் முதலில் பங்குபெற வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶντα
  choice: கடினமாக உழைக்கும்
  rationale: கொபியாவ் என்ற வினையின் நிகழ்காலப் பங்கேற்புவடிவம் தொடர்ச்சியான கடும் உழைப்பையும் முயற்சியையும் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இந்த வலிமையை இச்சொற்றொடர் தெளிவாகத் தருகிறது.
- source_word: γεωργὸν
  choice: விவசாயி
  rationale: நிலத்தைப் பயிரிடுபவரைக் குறிக்கும் பொதுவான, தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: தேவை அல்லது கடமையைக் குறிக்கும் கிரேக்கச் சொல்லின் வலிமையை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: இது உழைப்பதன் காலவரிசையை விட விளைச்சலில் பங்குபெறுவதற்கான முன்னுரிமையைக் குறிப்பதே தொடரமைப்புக்கு இயல்பான வாசிப்பு.
- source_word: τῶν καρπῶν
  choice: விளைச்சலில்
  rationale: வேளாண்மைச் சூழலில் καρποί என்பது தனிப்பட்ட கனிகளை மட்டும் அல்லாமல் நிலத்தின் உற்பத்தியையும் குறிக்கலாம். பகுதியைக் குறிக்கும் கிரேக்க வேற்றுமையைத் தமிழில் இடவேற்றுமையுடன் இயல்பாக இணைக்கிறது.
- source_word: μεταλαμβάνειν
  choice: பங்குபெற
  rationale: ஒரு முழுமையிலிருந்து பங்கைப் பெறுதல் அல்லது அதில் பங்கேற்றல் என்பதே வினையின் பொருள். ‘பங்குபெற’ என்பது இதைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: பழமொழி போன்ற கூற்றில் ‘முதலில்’ என்பதன் தொடர்பு
  choice: உழைப்பவரான விவசாயி விளைச்சலில் பங்குபெறுவதில் முன்னுரிமை பெற வேண்டும்.
  alternative: விவசாயி விளைச்சலை உண்பதற்கு முன் முதலில் உழைக்க வேண்டும்.
  rationale: கிரேக்கச் சொல்வரிசையும் தொடரமைப்பும் πρῶτον என்பதை μεταλαμβάνειν என்பதோடு இயல்பாக இணைக்கின்றன. எனவே உழைப்பு உணவுக்கு முன் நிகழ வேண்டும் என்பதைக் காட்டிலும், உழைப்பவர் அதன் பலனில் முதலில் பங்குபெற வேண்டும் என்பதே வலியுறுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘விவசாயி,’ ‘விளைச்சல்,’ ‘பங்குபெற’ ஆகியவை வேளாண்மை உருவகத்தையும் கிரேக்கத்தின் பகிர்வுப் பொருளையும் தெளிவாகக் காக்கின்றன.
