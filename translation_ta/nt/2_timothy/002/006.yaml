review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the hardworking farmer, the necessity expressed by δεῖ, and the priority expressed by πρῶτον. However, the emphatic suffix in “விவசாயியே” is not represented in the Greek, and “பங்குபெற” can sound somewhat less explicit than μεταλαμβάνειν’s sense of receiving/partaking of a portion.
  naturalness: The Tamil is generally clear and modern. Removing the unnecessary emphatic suffix and expressing the share directly produces a more idiomatic and precise sentence.
  terminology: “விவசாயி” and “விளைச்சல்” are suitable modern-standard Tamil agricultural terms. “விளைச்சலில் ஒரு பங்கை … பெற” clearly communicates participation in a portion of the produce without importing interpretation.
  issues:
  - severity: low
    issue: “விவசாயியே” adds emphasis not explicit in the Greek.
    rationale: The article τὸν identifies the farmer but does not by itself warrant the Tamil emphatic enclitic ஏ. Plain “விவசாயி” is closer to the source.
  - severity: medium
    issue: The main text leaves the partitive receiving sense somewhat implicit.
    rationale: μεταλαμβάνειν with τῶν καρπῶν means to partake of or receive a share of the produce. “விளைச்சலில் ஒரு பங்கை … பெற” makes this sense explicit and natural in Tamil.
  revised_text: கடினமாக உழைக்கும் விவசாயி விளைச்சலில் ஒரு பங்கை முதலில் பெற வேண்டும்.[a]
  revised_footnotes:
