revisions:
- from: கடினமாக உழைக்கும் விவசாயியே விளைச்சலில் முதலில் பங்குபெற வேண்டும்.[a]
  to: கடினமாக உழைக்கும் விவசாயி விளைச்சலில் ஒரு பங்கை முதலில் பெற வேண்டும்.[a]
  rationale: The revision removes an unwarranted emphatic nuance and renders the partitive force of μεταλαμβάνειν and τῶν καρπῶν more explicitly as receiving a share of the crop. “முதலில்” retains the priority of the farmer’s participation rather than suggesting merely that labor must occur before eating.
