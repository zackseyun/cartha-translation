source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: ta
  text: இறந்தோரிலிருந்து உயிர்த்தெழுப்பப்பட்டவரும் தாவீதின் வம்சத்திலிருந்து வந்தவருமான இயேசு மேசியாவை நினைவில் வைத்திரு—என் நற்செய்தியின்படி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்சொல்லாக, “என் நற்செய்திக்கு ஏற்ப” என்றும் மொழிபெயர்க்கலாம். “என் நற்செய்தி” என்பது பவுல் அறிவிக்கும் நற்செய்தியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: நினைவில் வைத்திரு
  rationale: நிகழ்காலக் கட்டளை வடிவம் தொடர்ந்து மனத்தில் நிறுத்திக்கொள்ளும் அறிவுறுத்தலைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் கட்டளை வலிமையுடனும் உள்ளது.
- source_word: Ἰησοῦν Χριστόν
  choice: இயேசு மேசியா
  rationale: Χριστός இங்கு தாவீதின் வம்சத்தோடு இணைந்து வரும் பட்டப்பெயராகத் தெளிவாகச் செயல்படுகிறது; ‘மேசியா’ அதன் பொருளை வெளிப்படுத்துகிறது.
- source_word: ἐγηγερμένον ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து உயிர்த்தெழுப்பப்பட்டவர்
  rationale: நிறைவுக் காலச் செயப்பாட்டு வினையெச்சம், இயேசு உயிர்த்தெழுப்பப்பட்டு அந்த நிலையில் இருப்பதைக் காட்டுகிறது; செயப்பாட்டு வடிவமும் பாதுகாக்கப்படுகிறது.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: தாவீதின் வம்சத்தில் பிறந்தவர்
  rationale: σπέρμα என்பதன் சொற்பொருள் ‘விதை’; இங்கு மரபுவழித் தோற்றத்தைக் குறிப்பதால் இயல்பான தமிழில் ‘வம்சத்தில் பிறந்தவர்’ என வழங்கப்படுகிறது.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: நான் அறிவிக்கும் நற்செய்தியின்படி
  rationale: ‘என் நற்செய்தி’ என்பது பவுல் அறிவிக்கும் நற்செய்தியைக் குறிக்கும். தமிழில் தவறாகத் தனிப்பட்ட வேறொரு நற்செய்தி எனப் புரியாதபடி, உடைமைத் தொடர்பின் சூழல்சார்ந்த பொருள் இயல்பாக வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: உயிர்த்தெழுதல் மற்றும் தாவீதின் வம்சம் ஆகிய மேசியாவுக்குரிய கூறுகளோடு வருவதால், இது பட்டப்பெயராகச் செயல்படுகிறது. ‘மேசியா’ அந்தப் பொருளை நேரடியாகத் தருகிறது.
- issue: ἐγηγερμένον என்பதன் செயப்பாட்டு மற்றும் நிறைவுக் கால வலிமை
  choice: உயிர்த்தெழுப்பப்பட்டவர்
  alternative: உயிர்த்தெழுந்தவர்
  rationale: கிரேக்கச் செயப்பாட்டு வடிவம் இயேசுவுக்கு நிகழ்த்தப்பட்ட உயிர்த்தெழுப்புதலைக் காட்டுகிறது; அதைத் தமிழிலும் பாதுகாக்கிறது.
- issue: ‘என் நற்செய்தி’ என்பதன் பொருள்
  choice: நான் அறிவிக்கும் நற்செய்தி
  alternative: என் நற்செய்தி
  rationale: μου என்ற உடைமைச் சொல்லை மறைக்காமல் அதன் சூழல்சார்ந்த பொருளை வழங்குகிறது; வேறுபட்ட தனிப்பட்ட நற்செய்தி என்ற தேவையற்ற உட்பொருளைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை அறிவுறுத்தல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இயேசு மேசியா’ என்பது தமிழில் பட்டப்பெயர் இணைப்பாக இயல்பாக உள்ளது. நீளமான கிரேக்க வினையெச்சத் தொடரை வாசிக்க எளிதாக்க ‘-வரும் ... -வருமான’ அமைப்பு பயன்படுத்தப்பட்டுள்ளது; இறுதி κατά தொடரின் தொடர்பு உண்மையான அளவில் சற்றுத் திறந்திருக்கும்படி கோடு இடப்பட்டுள்ளது.
