  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: ta
  text: உண்மையைவிட்டு விலகிப்போன இவர்கள்,[a] உயிர்த்தெழுதல் ஏற்கெனவே நடந்துவிட்டது[b] என்று சொல்லி, சிலருடைய விசுவாசத்தைச் சீர்குலைக்கிறார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையைக் குறித்து குறி தவறிவிட்டார்கள்” அல்லது “உண்மையிலிருந்து வழுவிவிட்டார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, எதிர்காலத்தில் நிகழவேண்டிய உயிர்த்தெழுதல் ஏற்கெனவே கடந்துவிட்டது என்று அவர்கள் கூறினார்கள்.
    reason: cross_reference
  - marker: c
    text: அல்லது, “சிலருடைய விசுவாசத்தைக் கவிழ்த்துப்போடுகிறார்கள்” அல்லது “நாசப்படுத்துகிறார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: இவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பொய்ப் போதகர்களைத் தொடர்ந்து சுட்டுகிறது; தமிழில் தனித்து இயல்பாக நிற்கும் தொடர்பாக்கம்.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: உண்மையைவிட்டு விலகிப்போய்
  rationale: ἀστοχέω என்பதன் ‘குறி தவறுதல்/நெறி விலகுதல்’ என்ற உருவகப் பொருளை, உண்மையிலிருந்து ஏற்பட்ட வழுவாக இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: λέγοντες
  choice: என்று சொல்லி
  rationale: அவர்கள் எவ்வாறு உண்மையிலிருந்து விலகினர் என்பதை விளக்கும் பங்கேற்பு வினை அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἀνάστασιν
  choice: உயிர்த்தெழுதல்
  rationale: இச்சூழலில் எதிர்கால உயிர்த்தெழுதலைக் குறிக்கும் வழக்கமான, இறையியல் ரீதியாக நடுநிலையான சொல்.
- source_word: ἤδη γεγονέναι
  choice: ஏற்கெனவே நடந்துவிட்டது
  rationale: γεγονέναι என்ற நிறைவுற்ற நிகழ்வையும் அதன் தற்போதைய பொருத்தத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἀνατρέπουσιν
  choice: சீர்குலைக்கிறார்கள்
  rationale: தொடர்ந்து நிகழும் பாதிப்பைத் தெரிவிக்கிறது; ‘முழுவதுமாக அழிக்கிறார்கள்’ என்று அளவுக்கு மீறாமல், விசுவாசத்தை நிலைகுலையச் செய்வதை வெளிப்படுத்துகிறது.
- source_word: τήν τινων πίστιν
  choice: சிலருடைய விசுவாசத்தை
  rationale: τινων என்பதன் வரையறுக்கப்படாத ‘சிலர்’ பொருளையும் πίστις என்பதன் வழக்கமான ‘விசுவாசம்’ பொருளையும் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: ‘உயிர்த்தெழுதல் ஏற்கெனவே நடந்துவிட்டது’ என்ற கூற்றின் பொருள்
  choice: எதிர்கால உயிர்த்தெழுதல் ஏற்கெனவே நிகழ்ந்துவிட்டதாக அவர்கள் கூறிய பொய்க் கூற்றை மட்டும் மொழிபெயர்த்தல்
  alternative: அது ஆன்மீக உயிர்த்தெழுதல் மட்டுமே என்றோ, எதிர்கால உடல் உயிர்த்தெழுதலை முற்றிலும் மறுத்ததாகவோ விரிவாக்குதல்
  rationale: இவ்வசனம் பொய்ப் போதனையின் முழு கோட்பாட்டு அமைப்பை விளக்கவில்லை; ஆகவே மூலத்தில் உள்ள கூற்றின் எல்லையை மீறாமல் அதன் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை / நம்புதல்
  rationale: இச்சூழலில் ‘விசுவாசம்’ என்பது இயல்பானதும் விளக்கத்தைத் திணிக்காததும் ஆகும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்க உறவுத்தொடரின் இரு வினைகளும் தமிழில் ஒரே எழுவாயின் கீழ் தொடருமாறு அமைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
