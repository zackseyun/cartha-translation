id: 2TI.2.4
reference: 2 Timothy 2:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: ta
  text: படைவீரனாகப் பணியாற்றுகிற எவரும், தன்னைப் படையில் சேர்த்தவரைப் பிரியப்படுத்தும்படி, அன்றாட வாழ்க்கையின் அலுவல்களில் சிக்கிக்கொள்வதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொதுமக்களின் தொழில்முயற்சிகளில்.’ கிரேக்கச் சொற்றொடர் இராணுவப் பணியையும் சாதாரண வாழ்க்கையின் அலுவல்களையும் வேறுபடுத்திக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: எவனும் ... இல்லை
  rationale: எவரும் விதிவிலக்கல்ல என்ற பொதுவான எதிர்மறைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: στρατευόμενος
  choice: படைவீரனாகப் பணியாற்றுகிற
  rationale: இராணுவப் பணியில் தொடர்ந்து ஈடுபட்டிருப்பதைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையின் பொருளையும் உருவகத்தையும் காக்கிறது.
- source_word: ἐμπλέκεται
  choice: சிக்கிக்கொள்வதில்லை
  rationale: ஒருவரின் செயல்சுதந்திரத்தைத் தடுக்கும் விதத்தில் பிணைந்துபோவதைச் சுட்டும் வலுவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: அன்றாட வாழ்க்கையின் அலுவல்களில்
  rationale: βίος குறிக்கும் சாதாரண வாழ்க்கையையும் πραγματείαις குறிக்கும் அலுவல்கள், தொழில்கள் அல்லது நடைமுறைச் செயல்பாடுகளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; இராணுவப் பணிக்கும் பொதுவாழ்க்கைக்கும் உள்ள வேறுபாடு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἵνα
  choice: இருக்கும்படி
  rationale: வாக்கியத்தின் நோக்கத்தைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்ப் பயன்பாடு.
- source_word: τῷ στρατολογήσαντι
  choice: தன்னைப் படையில் சேர்த்தவருக்கு
  rationale: கிரேக்கத்தில் இல்லாத குறிப்பிட்ட இராணுவப் பதவியைச் சேர்க்காமல், படையில் சேர்த்த நபரை நேரடியாகக் குறிக்கிறது.
- source_word: ἀρέσῃ
  choice: உகந்தவனாக இருக்க
  rationale: ‘பிரியப்படுத்துதல்/மகிழ்வித்தல்’ என்ற பொருளை இங்கு மேலதிகாரியின் அங்கீகாரத்தைப் பெறும் நோக்கில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: இராணுவ உருவகத்தின் எல்லை
  choice: படைவீரன் தன்னைப் படையில் சேர்த்தவருக்கு உகந்தவனாக இருப்பதற்காக அன்றாட வாழ்க்கையின் அலுவல்களில் சிக்கிக்கொள்ளாதவன் என்ற உருவகத்தை நேரடியாகப் பேணுதல்.
  alternative: இதை ஊழிய முன்னுரிமைகள் பற்றிய பொதுவான கட்டளையாக மொழிபெயர்ப்பிலேயே விரித்துரைத்தல், அல்லது ‘குடிமக்களின் தொழில்கள்’ என்று குறிப்பாக்குதல்.
  rationale: வசனம் இராணுவ உருவகத்தின் வழியாக அறிவுறுத்தினாலும், அதன் பயன்பாட்டை மொழிபெயர்ப்பே முன்கூட்டியே தீர்மானிக்கக் கூடாது. மூலத்தின் உருவகமும் அதன் இயல்பான பதற்றமும் அப்படியே காக்கப்படுகின்றன.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, எளிதில் புரியும் கண்ணியமான நடை. ‘படைவீரனாகப் பணியாற்றுகிற’ என்பது உருவகத்தைத் தெளிவாக வைத்திருக்கிறது; ‘சிக்கிக்கொள்வதில்லை’ மூலத்தின் உயிரோட்டமான படிமத்தைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
