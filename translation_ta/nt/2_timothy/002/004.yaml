  to: படைவீரனாகப் பணியாற்றுகிற எவரும், தன்னைப் படையில் சேர்த்தவரைப் பிரியப்படுத்தும்படி, அன்றாட வாழ்க்கையின் அலுவல்களில் சிக்கிக்கொள்வதில்லை.[a]
