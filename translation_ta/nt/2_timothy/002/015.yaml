  alternative: சத்தியத்தின் வார்த்தையைச் சரியாகப் போதிக்கிறவனாக; சத்தியத்தின் வார்த்தையை நேராக வெட்டுகிறவனாக
  rationale: இவ்வினையெச்சம் நற்செய்தியை முறையாகவும் துல்லியமாகவும் கையாளுவதைக் குறிக்கலாம்; போதித்தல் என்ற ஒரே ஊழியச் செயலுக்கு அதன் பொருளைக் குறுக்க வேண்டியதில்லை. முதன்மை உரை அகன்ற பொருளைத் தக்கவைக்கிறது; அதிக விளக்கமுள்ள வாசிப்பையும் சொல்லுக்குச் சொல்லான உருவகத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ஒருமை ஆண்பால் வடிவங்கள் தீமோத்தேயுவை நேரடியாகச் சுட்டும் கிரேக்க உரையைப் பின்பற்றுகின்றன. அரிய ‘நேராக வெட்டுதல்’ உருவகம் பிரதான உரையில் இயல்பாக மொழிபெயர்க்கப்பட்டு, அதன் உண்மையான பொருள் நெருக்கடியும் மாற்று வாசிப்பும் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன.
