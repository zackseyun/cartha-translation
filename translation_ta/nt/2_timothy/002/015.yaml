source:
  edition: SBLGNT
  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: ta
  text: கடவுள்முன் உன்னை அங்கீகரிக்கப்பட்டவனாக நிறுத்திக்கொள்ள முழு முயற்சி செய்; வெட்கப்பட வேண்டியதில்லாத பணியாளனாகவும், சத்தியத்தின் வார்த்தையைச் சரியாகக் கையாளுகிறவனாகவும்[a] இரு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சத்தியத்தின் வார்த்தையைச் சரியாகப் போதிக்கிறவனாக.” இன்னும் சொல்லுக்குச் சொல்லாக, “சத்தியத்தின் வார்த்தையை நேராக வெட்டுகிறவனாக.”
    reason: ὀρθοτομοῦντα என்ற அரிய வினையின் விளக்கப் பொருளையும் அதன் நேரடியான உருவகத்தையும் பாதுகாக்கும் சொற்பொருள் மாற்றுகள்.
lexical_decisions:
- source_word: σπούδασον
  choice: கருத்தாய் முயற்சி செய்
  rationale: இந்த இறந்தகால ஏவல் வடிவம் ஆர்வமும் தீவிர முயற்சியும் கொண்ட கட்டளையைத் தெரிவிக்கிறது. இச்சொற்றொடர் அதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: σεαυτὸν
  choice: உன்னை
  rationale: παραστῆσαι என்பதன் செயப்படுபொருளாக வரும் தன்மறியிடப் பதிலிப்பெயரின் நேரான தமிழ் வடிவம்.
- source_word: δόκιμον
  choice: அங்கீகரிக்கப்பட்டவனாக
  rationale: சோதனையில் தகுதியானவர் என நிரூபிக்கப்பட்டு ஏற்றுக்கொள்ளப்பட்ட நிலையை δόκιμος குறிக்கிறது. கடவுளின் மதிப்பீடு சார்ந்த உடனடிச் சூழலுக்கு ‘அங்கீகரிக்கப்பட்ட’ என்பது பொருந்துகிறது.
- source_word: παραστῆσαι
  choice: அவர்முன் நிறுத்துவதற்கு
  rationale: கடவுளின் மதிப்பீட்டுக்காக அல்லது பணிக்காக ஒருவர் தம்மை அவர்முன் நிறுத்தும் கருத்தை இயல்பான தமிழில் தருகிறது; நோக்கத்தைக் குறிக்கும் வினையெச்சத் தொடர்பும் காக்கப்படுகிறது.
- source_word: τῷ θεῷ
  choice: கடவுளால் … அவர்முன்
  rationale: παραστῆσαι உடன் வரும் வேற்றுமை வடிவம் ‘கடவுளிடம்/கடவுள்முன் சமர்ப்பித்தல்’ என்ற கருத்தைத் தருகிறது; δόκιμον உடன் இயல்பாகப் புரியும் கடவுளின் அங்கீகாரத்தையும் தமிழ் வாக்கியம் வெளிப்படுத்துகிறது.
- source_word: ἐργάτην
  choice: பணியாளனாக
  rationale: வேலை செய்பவர் என்ற உருவகத்தைத் தக்கவைத்து, இன்றைய வாசகர்களுக்குப் புரியும் பொதுவான சொல்லாக உள்ளது.
- source_word: ἀνεπαίσχυντον
  choice: வெட்கப்படத் தேவையில்லாத
  rationale: வெட்கப்படுத்தப்படாதவர் அல்லது வெட்கப்படுவதற்குக் காரணமில்லாதவர் என்ற பொருளைத் தருகிறது; வெறும் மனநிலையாகிய ‘வெட்கப்படாத’ என்பதைக் காட்டிலும் தகுதியான நிலையைத் தெளிவாகக் குறிக்கிறது.
- source_word: ὀρθοτομοῦντα
  choice: சரியாகக் கையாளுகிறவனாக
  rationale: சொல்லுக்குச் சொல்லாக ‘நேராக வெட்டுதல்’ என்ற அரிய உருவகத்தைக் கொண்ட இச்சொல், இச்சூழலில் செய்தியை முறையாகவும் துல்லியமாகவும் கையாளுவதைக் குறிக்கிறது. ‘சரியாகக் கையாளுதல்’ என்பது போதித்தல் மட்டும் என்று பொருளைக் குறுக்காமல் அதன் அகலத்தைப் பேணுகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: சத்தியத்தின் வார்த்தையை
  rationale: கிரேக்க உரையின் உரிமைத் தொடர்பையும் பவுலின் சொல்லாட்சியின் இறையியல் ஒலிப்பையும் காக்கிறது; நவீனத் தமிழிலும் புரிந்துகொள்ளக்கூடியது.
theological_decisions:
