revisions:
- from: எதிர்த்து நிற்பவர்களை மென்மையுடன் திருத்தி அறிவுறுத்த வேண்டும்; ஒருவேளை கடவுள் அவர்களுக்கு உண்மையை முழுமையாக அறிந்துகொள்வதற்கு வழிநடத்தும் மனந்திரும்புதலை அருளக்கூடும்.[a]
  to: எதிர்த்து நிற்பவர்களை மென்மையுடன் திருத்தி அறிவுறுத்த வேண்டும்; ஒருவேளை கடவுள் அவர்களுக்கு உண்மையை அறிந்துகொள்ள வழிவகுக்கும் மனந்திரும்புதலை அருளக்கூடும்.[a]
  rationale: The revision removes an unnecessary categorical amplification in the rendering of ἐπίγνωσις and adjusts the footnote so that its alternative preserves the Greek clause's cautious possibility. It retains the source's ambiguity about the object of opposition and its unsystematized presentation of divine agency in repentance.
