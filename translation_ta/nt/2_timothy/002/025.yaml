id: 2TI.2.25
reference: 2 Timothy 2:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε ⸀δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/025.yaml
  text: correcting those who oppose him with gentleness[a], in case God may grant them repentance leading to the knowledge of the truth[b],
translation:
  language: ta
  text: எதிர்த்து நிற்பவர்களை மென்மையுடன் திருத்தி அறிவுறுத்த வேண்டும்; ஒருவேளை கடவுள் அவர்களுக்கு உண்மையை அறிந்துகொள்ள வழிவகுக்கும் மனந்திரும்புதலை அருளக்கூடும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுள் அவர்களுக்கு மனந்திரும்புதலை அருளக்கூடும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: மென்மையுடன்
  rationale: இது செயல் நடைபெறும் விதத்தைக் குறிக்கிறது. ‘மென்மையுடன்’ என்பது πραΰτης என்பதிலுள்ள அடக்கமான, கடுமையற்ற அணுகுமுறையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: παιδεύοντα
  choice: திருத்தி அறிவுறுத்த வேண்டும்
  rationale: இங்கே தண்டிப்பதைவிட, தவறைத் திருத்தும் நோக்கமுள்ள போதனையே முன்னிலையில் உள்ளது. ‘திருத்தி அறிவுறுத்துதல்’ அந்தக் கல்வி மற்றும் சீர்திருத்த நுணுக்கங்களை இணைக்கிறது.
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: எதிர்த்து நிற்பவர்களை
  rationale: கிரேக்கப் பங்கேற்புவினை தங்களை எதிர்நிலையில் வைத்துக்கொள்பவர்களைக் குறிக்கிறது. எதிர்ப்பின் பொருள் மூலத்தில் வெளிப்படையாக இல்லை; ஆகவே தேவையற்ற ‘அவனை’ என்பதைக் கூட்டாமல் ambiguity காக்கப்படுகிறது.
- source_word: μήποτε
  choice: ஒருவேளை
  rationale: μήποτε உடன் வரும் subjunctive வடிவம் எச்சரிக்கையான சாத்தியத்தை வெளிப்படுத்துகிறது. ‘ஒருவேளை’ அந்த உறுதியற்ற தன்மையை இயல்பாகக் காக்கிறது.
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: கடவுள் அவர்களுக்கு … அருளக்கூடும்
  rationale: δίδωμι இச்சூழலில் வெறுமனே ‘கொடுப்பது’ அல்ல, கடவுள் வழங்கும் அருளைக் குறிக்கிறது. ‘அருளக்கூடும்’ என்பது கடவுளின் செயற்பாட்டையும் subjunctive சாத்தியத்தையும் காக்கிறது.
- source_word: μετάνοιαν
  choice: மனந்திரும்புதலை
  rationale: μετάνοια என்பது வெறும் அறிவுசார் ‘மனமாற்றம்’ என்பதைவிட, உள்ளநிலை மற்றும் திசைமாற்றத்தை உள்ளடக்கும் நிலைபெற்ற வேதாகமத் தமிழ்ச் சொல்.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: உண்மையை முழுமையாக அறிந்துகொள்வதற்கு வழிநடத்தும்
  rationale: εἰς இலக்கு அல்லது விளைவைக் குறிக்கிறது; ἐπίγνωσις சாதாரண அறிவைவிட ஆழமான அல்லது முழுமையான அறிதலைச் சுட்டுகிறது. இச்சொற்றொடர் இரண்டையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கடவுளின் செயற்பாடும் மனித மனந்திரும்புதலும்
  choice: மனந்திரும்புதலைக் கடவுள் அருளக்கூடும் என்று உரை கூறுவதை அப்படியே காத்தல்
  alternative: கடவுளின் செயற்பாட்டை நிர்ணயவாதமாக வலுப்படுத்துதல் அல்லது அதை மனித முயற்சியாகக் குறைத்தல்
  rationale: கிரேக்க உரை கடவுளையே மனந்திரும்புதலை வழங்குபவராகக் காட்டுகிறது; ஆனால் கடவுளின் அதிகாரத்துக்கும் மனிதப் பதிலுக்கும் உள்ள தொடர்பை இவ்வசனம் முறைப்படுத்தி விளக்கவில்லை. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தீர்க்காமல் காக்கிறது.
- issue: μήποτε என்பதின் உறுதியற்ற நுணுக்கம்
  choice: ‘ஒருவேளை … அருளக்கூடும்’
  alternative: ‘அருளும்படியாக’ என நோக்கத்தை மட்டும் காட்டுதல்
  rationale: μήποτε + subjunctive அமைப்பு நோக்கம்/விளைவு சார்ந்த எச்சரிக்கையான சாத்தியத்தைத் தரலாம். ‘ஒருவேளை’ அதன் தெளிவின்மையையும் contingency-யையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் இயல்பும் கொண்ட வேதாகம நடை. முந்தைய வசனத்திலிருந்து தொடரும் வாக்கியத் தொடர்பை வெளிப்படுத்த ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத எதிர்ப்பின் வெளிப்படையான பொருள் சேர்க்கப்படவில்லை.
