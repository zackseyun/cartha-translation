language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: ta
  text: இளமைக்குரிய ஆசைகளை விட்டு ஓடு[a]; தூய உள்ளத்திலிருந்து ஆண்டவரை நோக்கிக் கூப்பிடுகிறவர்களோடு சேர்ந்து நீதியையும்[b], விசுவாசத்தையும்[c], அன்பையும், சமாதானத்தையும் நாடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இளமைக்குரிய தீவிர விருப்பங்கள்.” கிரேக்கச் சொற்றொடர் பாலியல் இச்சையை மட்டும் அல்லாமல், இளமைப் பருவத்தின் தன்மையோடு தொடர்புடைய ஆசைகளைப் பரந்த அளவில் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “நீதி” என்பதற்கு இங்கு “நியாயம்” என்ற நுண்பொருளும் இருக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “நம்பகத்தன்மை.” கிரேக்கச் சொல் சூழலுக்கேற்ப விசுவாசம், நம்பிக்கை, அல்லது நம்பகத்தன்மையைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: இளமைக்குரிய ஆசைகள்
  rationale: இது இளமைப் பருவத்தின் தன்மையோடு தொடர்புடைய பலவகை ஆசைகளைக் குறிக்கக்கூடும்; பாலியல் இச்சைக்கு மட்டும் பொருளைச் சுருக்கவில்லை.
- source_word: φεῦγε
  choice: விட்டு ஓடு
  rationale: தொடர்ந்து விலகியோட வேண்டும் என்ற நிகழ்காலக் கட்டளையின் வலிமையையும், δίωκε என்பதுடனான எதிர்மறை இணைப்பையும் வெளிப்படுத்துகிறது.
- source_word: δίωκε
  choice: நாடு
  rationale: ஒழுக்க நற்பண்புகளை ஊக்கத்துடனும் தொடர்ந்து முயன்றும் அடையத் தேடுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: தமிழில் இது நேர்மை, நன்னெறி, சரியான உறவுநிலை ஆகியவற்றை உள்ளடக்கக்கூடிய பரந்த வேதாகமச் சொல்லாக உள்ளது; நியாயம் என்ற சட்ட/சமூக நுண்பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: πίστις என்பதற்கான வழக்கமான புதிய ஏற்பாட்டு மொழிபெயர்ப்பு; இச்சூழலில் நம்பகத்தன்மை என்ற நற்பண்புப் பொருளும் சாத்தியமானதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான நேரான, இயல்பான, புதிய ஏற்பாட்டின் சொல் தொடர்பைப் பேணும் மொழிபெயர்ப்பு.
- source_word: εἰρήνην
  choice: சமாதானம்
  rationale: நற்பண்புகளின் பட்டியலில் இயல்பாக அமையும், εἰρήνη என்பதற்கான நிலையான வேதாகமத் தமிழ் மொழிபெயர்ப்பு.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: ஆண்டவரைக் கூப்பிடுகிறவர்களோடு சேர்ந்து
  rationale: μετά குறிக்கும் உடனிணைப்பையும், ἐπικαλέω குறிக்கும் ஆண்டவரை நோக்கிக் கூப்பிடுதல்/வேண்டுதல் என்ற செயலையும் வெளிப்படுத்துகிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டில் κύριος என்பதற்கான இயல்பான, மரியாதைக்குரிய தமிழ் மொழிபெயர்ப்பு.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: தூய உள்ளத்திலிருந்து
  rationale: ἐκ குறிக்கும் மூலத்தைப் பேணுகிறது; καρδία இங்கு உடல் உறுப்பை அல்ல, உள்ளார்ந்த சிந்தனை மற்றும் நோக்கத்தின் மையத்தைச் சுட்டுவதால் 'உள்ளம்' இயல்பாக உள்ளது.
theological_decisions:
- issue: ‘இளமைக்குரிய ஆசைகள்’ என்பதன் பரப்பு
  choice: பாலியல் இச்சை உட்பட, இளமைக்குரிய பலவகை ஆசைகளை உள்ளடக்கும் பரந்த பொருள்
  alternative: முதன்மையாக அல்லது முற்றிலும் பாலியல் இச்சைகள்
  rationale: νεωτερικὰς ἐπιθυμίας என்ற சொற்றொடர் பாலியல் பொருளுக்கு மட்டும் வரையறுக்கப்படவில்லை; சூழலும் குணநடத்தையைப் பற்றிய பரந்த அறிவுரையை ஆதரிக்கிறது.
- issue: δικαιοσύνη என்ற பவுலின் நற்பண்புச் சொல்
  choice: முதன்மை உரையில் ‘நீதி’
  alternative: ‘நியாயம்’
  rationale: தமிழ் வேதாகம நடையில் ‘நீதி’ ஒழுக்கச் செம்மை மற்றும் சரியான உறவுநிலையைத் தாங்குகிறது; சட்ட/சமூக நியாய நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πίστις என்ற சொல்லின் பொருள்
  choice: முதன்மை உரையில் ‘விசுவாசம்’
  alternative: ‘உண்மைத்தன்மை’ அல்லது ‘நம்பிக்கை’
  rationale: இந்த நற்பண்புப் பட்டியலில் விசுவாசம் இயல்பான வாசிப்பு; இருப்பினும் நம்பகமாக இருப்பது என்ற ஒழுக்க நுண்பொருளை கிரேக்கம் அனுமதிப்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான ஒருமை கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘விட்டு ஓடு’ மற்றும் ‘நாடு’ என்பவை கிரேக்கத்தின் வலுவான எதிரிணைச் செயல்களைப் பேணுகின்றன. அனைத்து அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்களுக்கு உடனே பின் வைக்கப்பட்டுள்ளன.
