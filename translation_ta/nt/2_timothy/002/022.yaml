revisions:
- from: இளமைக்குரிய ஆசைகளைவிட்டு ஓடு[a]. தூய உள்ளத்திலிருந்து ஆண்டவரைக் கூப்பிடுகிறவர்களோடு சேர்ந்து, நீதியையும்[b] விசுவாசத்தையும்[c] அன்பையும் சமாதானத்தையும் நாடு.
  to: இளமைக்குரிய ஆசைகளை விட்டு ஓடு[a]; தூய உள்ளத்திலிருந்து ஆண்டவரை நோக்கிக் கூப்பிடுகிறவர்களோடு சேர்ந்து நீதியையும்[b], விசுவாசத்தையும்[c], அன்பையும், சமாதானத்தையும் நாடு.
  rationale: The revision preserves the Greek’s broad ethical sense and its imperative contrast while clarifying that the people in view invoke the Lord, rather than merely call or summon him. It also makes minor orthographic and lexical-footnote improvements without adding doctrinal interpretation.
