id: 2TI.2.17
reference: 2 Timothy 2:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ λόγος αὐτῶν ὡς γάγγραινα νομὴν ἕξει· ὧν ἐστιν Ὑμέναιος καὶ Φίλητος,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/017.yaml
  text: and their talk will spread like gangrene[a]. Among them are Hymenaeus and Philetus[b],
translation:
  language: ta
  text: அவர்களுடைய பேச்சு[a] அழுகல் நோயைப்போல் பரவும்[b]. அவர்களில் இமெனேயுவும் பிலேத்துவும் உள்ளனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய சொல்” அல்லது “அவர்களுடைய செய்தி.”
    reason: lexical_alternative
  - marker: b
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “தன் போக்கைக் கொண்டிருக்கும்” என மொழிபெயர்க்கலாம்; அழிவூட்டும் விதத்தில் அது பரவும் என்பதே இங்குள்ள பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: பேச்சு
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பயனற்ற, இறைபக்தியற்ற பேச்சையும் அடுத்த வசனத்தில் விளக்கப்படும் பொய்ப் போதனையையும் சூழல் சுட்டுவதால், தனி ‘சொல்’ என்பதைவிட அவர்கள் கூறிவரும் கருத்துகளைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: λόγος என்பதுடன் இணையும் உடைமைப் பொருளை நேரடியாகக் காட்டுகிறது.
- source_word: ὡς γάγγραινα
  choice: அழுகல் நோயைப்போல்
  rationale: γάγγραινα என்பது உடல் திசுக்களை அழித்து பரவும் gangrene நோயைக் குறிக்கிறது. ‘புற்றுநோய்’ என்று பொருள்விரிவாக்கம் செய்யாமல், நோயின் அழிவூட்டும் படிமத்தைத் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: νομὴν ἕξει
  choice: பரவும்
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘தன் போக்கை/மேய்ச்சலைக் கொண்டிருக்கும்’ என்ற படிமம் இருந்தாலும், அழுகல் நோயுடன் இணைந்த இச்சொற்றொடர் தொடர்ந்து அழிவூட்டும் விதத்தில் பரவுவதைக் குறிக்கிறது.
- source_word: ὧν ἐστιν
  choice: அவர்களில் ... உள்ளனர்
  rationale: முன்னர் குறிப்பிடப்பட்ட குழுவைச் சேர்ந்த இருவரை எடுத்துக்காட்டும் பகுதியுறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ὑμέναιος
  choice: இமெனேயு
  rationale: கிரேக்க ஆண்பால் பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: Φίλητος
  choice: பிலேத்து
  rationale: கிரேக்க ஆண்பால் பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
theological_decisions:
- issue: நோய் உருவகத்தின் பொருள்
  choice: தவறான போதனை ஒரு சமூகத்தில் அழிவூட்டும் விதத்தில் பரவுவதாக வசனம் சித்தரிக்கிறது.
  alternative: மருத்துவப் படிமத்தின் சொற்களை மட்டும் மிக நேரடியாகக் கொடுத்து, அதன் பரவும் தன்மையை வெளிப்படையாகச் சொல்லாமல் விடுதல்.
  rationale: ‘பரவும்’ என்பது νομὴν ἕξει என்ற சொற்றொடரின் சூழல்சார் பொருளைக் காட்டுகிறது; அதேவேளையில் நோய் உருவகத்தையும் அதன் எச்சரிக்கைத் தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அழுகல் நோய்’ மருத்துவப் படிமத்தைத் தக்கவைத்து, அரிதான தொழில்நுட்பச் சொல்லைத் தவிர்க்கிறது.
