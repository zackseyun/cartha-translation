  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: ta
  text: நாம் சகித்து நிலைத்திருந்தால், அவருடன் சேர்ந்து அரசாள்வோம்; நாம் அவரை மறுதலித்தால்[a], அவரும் நம்மை மறுதலிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் அவரை மறுத்து ஒதுக்கினால், அவரும் நம்மை மறுத்து ஒதுக்குவார்.”
    reason: ἀρνέομαι என்பது வாய்மொழியாக மறுப்பதை மட்டுமல்லாமல், ஒருவரைத் தனக்குரியவர் அல்ல என்று ஒதுக்குவதையும் குறிக்கலாம். இந்த மாற்று வாசகம் இரு உட்பிரிவுகளிலும் உள்ள அதே வினையின் மீளுரையையும் பரஸ்பரத் தொடர்பையும் காக்கிறது.
lexical_decisions:
- source_word: ὑπομένομεν
  choice: சகித்து நிலைத்திருந்தால்
  rationale: சோதனை அல்லது துன்பத்தின் மத்தியில் உறுதியாகத் தொடர்ந்து நிற்பதை ὑπομένω குறிக்கிறது. ‘சகித்து நிலைத்திருத்தல்’ என்பது வெறும் பொறுத்திருப்பதைவிட அதன் விடாமுயற்சியையும் நிலைத்தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: συμβασιλεύσομεν
  choice: அவருடன் சேர்ந்து அரசாள்வோம்
  rationale: சேர்ந்து அரசாளுதல் என்பதே கூட்டு வினையின் பொருள். சூழலில் உடன் அரசாளப்படுபவர் கிறிஸ்து என்பது தெளிவாக இருப்பதால் ‘அவருடன்’ என்று வெளிப்படுத்தப்பட்டுள்ளது; ‘அரசாள்வோம்’ அரசருக்குரிய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἀρνησόμεθα
  choice: அவரை மறுதலித்தால்
  rationale: ἀρνέομαι என்பது மறுத்தல், உறவை ஏற்க மறுத்தல், அல்லது தனக்குரியவர் அல்ல என்று ஒதுக்குதல் ஆகிய பொருள் பரப்பைக் கொண்டது. ‘மறுதலித்தல்’ எச்சரிக்கையின் தீவிரத்தையும் அடுத்த உட்பிரிவிலுள்ள சொல் மீளுரைப்பையும் காக்கிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘அவரை’ என்பது இணை அமைப்பும் சூழலும் தெளிவாக்கும் செயப்படுபொருளாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: κἀκεῖνος
  choice: அவரும்
  rationale: καὶ ἐκεῖνος என்பதன் சுருக்கமான இவ்வடிவம் பதிலளிக்கும் இணைத்தன்மையை வலியுறுத்துகிறது. ‘அவரும்’ என்பது தமிழில் இயல்பாக அந்தச் சமச்சீர் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ἀρνήσεται ἡμᾶς
  choice: நம்மை மறுதலிப்பார்
  rationale: முந்தைய உட்பிரிவில் உள்ள அதே ἀρνέομαι வினை மீண்டும் வருவதால், ‘மறுதலிப்பார்’ என்று அதே சொல்லை மீண்டும் பயன்படுத்துவது எச்சரிக்கையின் திட்டமிட்ட சொல்லிணைப்பையும் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: இரண்டாவது நிபந்தனை உட்பிரிவிலுள்ள எச்சரிக்கையின் தன்மை
  choice: ‘நாம் அவரை மறுதலித்தால், அவரும் நம்மை மறுதலிப்பார்’ என்று உண்மையான எச்சரிக்கையாக நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இதை இறுதி நியாயத்தீர்ப்புக்குப் பதிலாக வெகுமதி இழப்பை மட்டும் குறிக்கும் எச்சரிக்கையாகவோ, நடைமுறை வாய்ப்பில்லாத ஒரு கருதுகோளாகவோ விளக்கலாம்.
  rationale: கிரேக்கம் சமச்சீரான நிபந்தனை வாக்கியத்தை முன்வைக்கிறது; மறுதலிப்பவரை மறுதலிப்பது பற்றிய இயேசுவின் எச்சரிக்கை மரபையும் இது நினைவூட்டுகிறது. விசுவாசத்திலிருந்து விலகுதல், இறுதிவரை நிலைத்திருத்தல், வெகுமதி ஆகியவற்றைப் பற்றிய விவாதங்களில் ஒன்றை மொழிபெயர்ப்பே தீர்மானிக்காமல், மூலத்தின் தீவிரத்தையும் இறையியல் பதற்றத்தையும் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சகித்து நிலைத்திருந்தால்’ என்பது துன்பத்தின் மத்தியில் தொடரும் உறுதியைத் தெளிவாக்குகிறது; ‘அரசாள்வோம்’ அரசருக்குரிய உருவகத்தைப் பாதுகாக்கிறது. ‘மறுதலித்தால் / மறுதலிப்பார்’ என்ற மீளுரை கிரேக்கத்தின் சொல்லாட்சி சமச்சீரையும் எச்சரிக்கையின் வலிமையையும் காக்கிறது.
