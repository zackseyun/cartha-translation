id: 2TI.2.24
reference: 2 Timothy 2:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: ta
  text: ஆண்டவருடைய பணியாளர் வாக்குவாதம் செய்யக்கூடாது; மாறாக, எல்லாரிடமும் மென்மையானவராகவும், கற்பிக்கத் திறமையுள்ளவராகவும், தீங்கு செய்யப்பட்டாலும் பொறுமையுடன் இருப்பவராகவும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλον
  choice: பணியாளர்
  rationale: δοῦλος என்பதற்கு சூழலின்படி ‘அடிமை’ அல்லது ‘பணியாளர்’ என்று பொருள் வரலாம். இங்கு ஆண்டவருக்குச் சேவை செய்பவரிடம் எதிர்பார்க்கப்படும் நடத்தை முன்னிலைப்படுவதால், இயல்பான நவீனத் தமிழில் ‘பணியாளர்’ பொருத்தமானது.
- source_word: κυρίου
  choice: ஆண்டவருடைய
  rationale: κύριος என்பதன் வழக்கமான இறையியல் பொருளை ‘ஆண்டவர்’ தெளிவாகக் காட்டுகிறது; இறைமைச் சார்பை உடைமை வேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ δεῖ μάχεσθαι
  choice: வாக்குவாதம் செய்யக்கூடாது
  rationale: δεῖ கடமை அல்லது கட்டாயத்தை உணர்த்துகிறது; மறுப்புடன் சேர்ந்து ‘செய்யக்கூடாது’ என வருகிறது. இப்போதனைச் சூழலில் μάχεσθαι முதன்மையாக சண்டையிடும் வாதப்போக்கைக் குறிக்கிறது.
- source_word: ἤπιον εἶναι πρὸς πάντας
  choice: எல்லாரிடமும் மென்மையானவராக ... இருக்க வேண்டும்
  rationale: ἤπιος சண்டையிடும் போக்கிற்கு எதிரான மென்மையான நடத்தை குறிக்கிறது; πρὸς πάντας அதன் எல்லாரையும் உள்ளடக்கும் உறவுசார் பரப்பைக் காட்டுகிறது.
- source_word: διδακτικόν
  choice: கற்பிக்கத் திறமையுள்ளவராக
  rationale: διδακτικός கற்றுக்கொள்ளத் தயாராக இருப்பதையல்ல, கற்பிக்கத் தகுதியும் திறமையும் இருப்பதைக் குறிக்கிறது.
- source_word: ἀνεξίκακον
  choice: தீங்கு செய்யப்பட்டாலும் பொறுமையுடன் இருப்பவராக
  rationale: அரிதான இச்சொல், தனக்குச் செய்யப்படும் தீங்கைப் பழிவாங்காமல் பொறுத்துக்கொள்வதை உணர்த்துகிறது; வெறும் ‘பொறுமை’ என்பதைவிட இந்த மொழிபெயர்ப்பு சூழலைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ஊழிய அறிவுறுத்தல் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: பணியாளர்
  alternative: அடிமை
  rationale: இவ்வசனத்தின் மையம் சமூக அடிமை நிலை அல்ல; ஆண்டவருக்குச் சேவை செய்பவரின் நடத்தையே. எனவே ‘பணியாளர்’ இயல்பான முதன்மை வாசகம்; ‘அடிமை’ என்ற சொல்லை முதன்மைப்படுத்துவது இங்கு தேவையற்ற சமூகப் படிமத்தைச் சேர்க்கலாம்.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு κύριος கிறிஸ்தவ இறைமைப் பட்டமாகப் பயன்படுவதால் ‘ஆண்டவர்’ தெளிவானதும் மரபிலும் நவீனத் தமிழிலும் பொருத்தமானதும் ஆகும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் கடமை சார்ந்த அமைப்பும், சண்டையிடாமை—மென்மை—கற்பிக்கும் திறன்—தீங்கைப் பொறுத்தல் என்ற பண்புகளின் தொடரும் பாதுகாக்கப்பட்டுள்ளன.
