  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: ta
  text: ஆனால், அவை சண்டைகளை உண்டாக்குகின்றன என்பதை அறிந்துகொண்டு, முட்டாள்தனமான, கற்றறிவில்லாத சர்ச்சைகளைத் தவிர்த்துவிடு[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கேள்விகள்’ அல்லது ‘விவாதங்கள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் விசாரணைகளைக் குறிக்கக்கூடும். ஆனால் இங்கே நேர்மையான உண்மைத் தேடலைவிட முரண்பாட்டைத் தூண்டும் சர்ச்சைகளையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘பெற்றெடுக்கின்றன’ அல்லது ‘பிறப்பிக்கின்றன’; இங்கே சண்டைகள் ஏற்படக் காரணமாவதை உருவகமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: முட்டாள்தனமான
  rationale: அறிவும் விவேகமும் இல்லாத தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; தேவையற்ற இழிவான பேச்சுநடையைத் தவிர்க்கிறது.
- source_word: ἀπαιδεύτους
  choice: கற்றறிவில்லாத
  rationale: பயிற்சி அல்லது போதனை பெறாத நிலையைக் குறிக்கும் மூலச்சொல்லின் கருத்தை, வெறும் அறிவுத்திறன் குறைவு என்று மாற்றாமல் வாசிக்கத்தக்க தமிழில் தருகிறது.
- source_word: ζητήσεις
  choice: சர்ச்சைகள்
  rationale: இச்சூழலில் நேர்மையான விசாரணைகளைக் காட்டிலும் முரண்பாட்டைத் தூண்டும் கேள்வி விவாதங்களைக் குறிக்கிறது; ‘சர்ச்சைகள்’ அந்தச் சூழல் சார்ந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: παραιτοῦ
  choice: தவிர்த்துவிடு
  rationale: அவற்றில் ஈடுபட மறுத்து விலகியிருக்க வேண்டும் என்ற நடுநிலை ஏவலின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰδὼς
  choice: அறிந்திருக்கிறாயே
  rationale: தீமோத்தேயுவுக்கு ஏற்கெனவே தெரிந்த உண்மை இந்தக் கட்டளைக்கான அடிப்படை என்பதை உணர்த்துகிறது; கிரேக்க வினையெச்சத்தின் காரணத் தொடர்பையும் இயல்பாகக் கொண்டுவருகிறது.
- source_word: γεννῶσι
  choice: உண்டாக்குகின்றன
  rationale: ‘பெற்றெடுக்கின்றன’ என்ற உருவகத்தின் காரணவிளைவு பொருளை இயல்பான தமிழில் தருகிறது; சொற்பொருள் உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: μάχας
  choice: சண்டைகள்
  rationale: உடல் மோதல் மட்டுமல்லாமல் வாக்குவாதம் மற்றும் உறவுசார் மோதலையும் குறிக்கக்கூடிய பொதுவான, நேரடியான தமிழ்ச் சொல்.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய அறிவுறுத்தலுடன் உள்ள மென்மையான மாறுபாட்டைத் தெளிவாகக் குறிக்கிறது.
