  to: ஆனால், அவை சண்டைகளை உண்டாக்குகின்றன என்பதை அறிந்துகொண்டு, முட்டாள்தனமான, கற்றறிவில்லாத சர்ச்சைகளைத் தவிர்த்துவிடு[a][b].
