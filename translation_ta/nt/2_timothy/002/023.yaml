translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் கட்டளையைப் பாதுகாத்து, தெளிவான மற்றும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் உருவகத்தை முதன்மை உரையில் இயல்பாக்கி, அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாத்துள்ளது.
