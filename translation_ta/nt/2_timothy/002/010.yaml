id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: ta
  text: இதன் காரணமாக, தேர்ந்தெடுக்கப்பட்டவர்களுக்காக[a] நான் எல்லாவற்றையும் சகித்துக்கொள்கிறேன்; அவர்களும் மேசியாவாகிய இயேசுவில்[b] உள்ள மீட்பை நித்திய மகிமையுடன் பெறும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேர்ந்தவர்கள்.” கிரேக்கச் சொல் ἐκλεκτούς.
    reason: lexical_alternative
  - marker: b
    text: 'பாரம்பரிய மொழிபெயர்ப்பு: “கிறிஸ்து இயேசுவில்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதன் காரணமாக
  rationale: முந்தைய சூழலைப் பவுலின் சகிப்பின் காரணமாகச் சுட்டும் தொடரின் காரணப் பொருளை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: πάντα ὑπομένω
  choice: நான் எல்லாவற்றையும் தாங்கிக்கொள்கிறேன்
  rationale: πάντα என்பதன் முழுமையான பரப்பையும், ὑπομένω என்பதிலுள்ள துன்பத்தின் கீழ் நிலைத்து நிற்கும் சகிப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: தேர்ந்தெடுக்கப்பட்டவர்களுக்காக
  rationale: διά + வேற்றுமை வடிவம் இங்கு நன்மை அல்லது பொருட்டு என்ற கருத்தைத் தருகிறது; ἐκλεκτούς என்பதிலுள்ள தேர்வு மொழியை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: ἵνα καὶ αὐτοὶ
  choice: அவர்களும் ... பெற்றுக்கொள்ளும்படி
  rationale: ἵνα தரும் நோக்கத்தையும் καί தரும் ‘அவர்களும்’ என்ற சேர்க்கைப் பொருளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σωτηρίας τύχωσιν
  choice: மீட்பைப் பெற்றுக்கொள்ளும்படி
  rationale: τυγχάνω + பிறப்புவேற்றுமை தரும் பெறுதல் அல்லது அடைதல் என்ற பொருளைக் காக்கிறது; ‘மீட்பு’ என்பது σωτηρία-வின் தெளிவான, இன்றைய தமிழுக்குப் புரியும் இணைச்சொல்.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவில் உள்ள
  rationale: இடம் அல்லது ஒன்றிப்பைக் குறிக்கும் ἐν மொழியை ‘இயேசுவில்’ என்று காக்கிறது; Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளை ‘மேசியா’ என்று வெளிப்படுத்துகிறது.
- source_word: μετὰ δόξης αἰωνίου
  choice: நித்திய மகிமையுடன்
  rationale: μετά + பிறப்புவேற்றுமை தரும் உடனிணைவு கருத்தையும் αἰώνιος தரும் நிலையான காலப் பொருளையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: ἐκλεκτούς என்பதன் மொழிபெயர்ப்பு
  choice: தேர்ந்தெடுக்கப்பட்டவர்கள்
  alternative: தேர்ந்தவர்கள்
  rationale: மூலத்தில் உள்ள தேர்வு சார்ந்த இறையியல் பதற்றத்தை எந்தக் கோட்பாட்டு அமைப்பாலும் விளக்கித் தீர்க்காமல் நேரடியாகக் காக்கிறது.
- issue: Χριστῷ என்பது பட்டமா அல்லது பெயர்போன்ற வடிவமா
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இச்சூழலில் Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மேசியா’ என்ற பட்டப்பெயர் பொருள் இன்னும் செயல்படுவதால் அதைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது; பாரம்பரிய வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: μετὰ δόξης αἰωνίου என்பதன் தொடர்பு
  choice: மீட்பைப் ... நித்திய மகிமையுடன் பெற்றுக்கொள்ளுதல்
  alternative: நித்திய மகிமையோடு கூடிய மீட்பு
  rationale: இரண்டு வாசிப்புகளிலும் மகிமை மீட்புடன் இணைந்ததே; முதன்மை உரை கிரேக்கச் சொல் வரிசையையும் உடனிணைவு கருத்தையும் இயல்பாகக் காக்கிறது, அதை தனியான வெகுமதியாக மாற்றவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு அருகான, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; “இப்படிச் செய்கிறேன்” என்பது இரண்டாவது வாக்கியத்தின் நோக்கத் தொடர்பை முதல் வாக்கியத்துடன் தெளிவாக இணைக்கிறது. “இரட்சிப்பு” என்பதற்குப் பதில் பொதுவாகப் புரியும் “மீட்பு” பயன்படுத்தப்பட்டது; “நித்திய மகிமை” என்ற நிலைபெற்ற இறையியல் மொழிநடை காக்கப்பட்டது.
