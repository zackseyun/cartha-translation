id: 2TI.2.26
reference: 2 Timothy 2:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: ta
  text: அவர்கள் மனத்தெளிவு பெற்று, பிசாசின் கண்ணியிலிருந்து விடுபடக்கூடும். அவர்கள் அவனால் உயிரோடு சிறைபிடிக்கப்பட்டு[b], அவனுடைய விருப்பத்தைச் செய்யும்படி[a] வைக்கப்பட்டிருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்த ஒருவருடைய விருப்பத்தைச் செய்யும்படி’ என்றும் மொழிபெயர்க்கலாம். ‘அந்த ஒருவர்’ என்பது பிசாசை அல்ல, கடவுளைக் குறிப்பதாகச் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: ‘உயிரோடு சிறைபிடிக்கப்பட்டு’ என்பதற்கான கிரேக்க வினைச்சொல்லை பொதுவாக ‘சிறைபிடிக்கப்பட்டு’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் அது குறிப்பாக உயிருடன் பிடிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: மனத்தெளிவு பெற்று
  rationale: இவ்வினைச்சொல் நேரடியாக ‘மீண்டும் நிதானமடைதல்’ அல்லது ‘போதையிலிருந்து தெளிதல்’ என்ற உருவகப் பொருளைக் கொண்டது. இச்சூழலில் ஏமாற்றத்திலிருந்து தெளிவான சிந்தனைக்குத் திரும்புவதை இயல்பான நவீன தமிழில் இது தெரிவிக்கிறது.
- source_word: παγίδος
  choice: கண்ணி
  rationale: παγίς என்பது ஒருவரைச் சிக்கவைக்கும் கண்ணி அல்லது பொறியைக் குறிக்கிறது. பிசாசின் வஞ்சகத்தில் அகப்பட்டிருப்பதைச் சித்தரிக்கும் உருவகத்தை ‘கண்ணி’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: διαβόλου
  choice: பிசாசின்
  rationale: இங்கு διάβολος சாத்தானைக் குறிக்கும் தனிப்பட்ட பட்டப்பெயராக இருப்பதால், வழக்கமானதும் இயல்பானதுமான தமிழ் இணைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐζωγρημένοι
  choice: உயிரோடு சிறைபிடிக்கப்பட்டு
  rationale: ζωγρέω என்பது பொதுவாகப் பிடிப்பதை மட்டுமல்லாமல், குறிப்பாக உயிருடன் பிடிப்பதைக் குறிக்கிறது. நிறைவுற்ற செயப்பாட்டு வினையெச்சம், முன்பு பிடிக்கப்பட்டதால் தொடரும் நிலையையும் உணர்த்துகிறது.
- source_word: ὑπ’ αὐτοῦ
  choice: அவனால்
  rationale: இலக்கணப்படி மிக அருகிலுள்ள முன்னிடுபொருள் ‘பிசாசு’ என்பதால் பிரதிப்பெயர் பாதுகாக்கப்பட்டுள்ளது; பெயரைத் தேவையின்றி மீண்டும் கூறுவதும் தவிர்க்கப்பட்டுள்ளது.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: அவனுடைய விருப்பத்தைச் செய்யும்படி
  rationale: εἰς மற்றும் பெயராக்கப்பட்ட θέλημα சேர்ந்த இத்தொடர் நோக்கம் அல்லது விளைவைக் குறிக்கக்கூடும். சொல்லுக்குச் சொல் அமைப்பான ‘அவனுடைய விருப்பத்திற்காக’ என்பதைவிட, தமிழில் நோக்கத்தை இயல்பாக வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது; ἐκείνου யாரைக் குறிக்கிறது என்ற குழப்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: εἰς τὸ ἐκείνου θέλημα என்பதிலுள்ள ἐκείνου யாரைக் குறிக்கிறது
  choice: பிசாசைக் குறிக்கும் என முதன்மை உரையில் ‘அவனுடைய விருப்பத்தைச் செய்யும்படி’ என்று மொழிபெயர்த்தல்
  alternative: அது கடவுளைக் குறிக்கலாம்; அப்படியானால் கடவுளுடைய விருப்பத்தைச் செய்வதற்காக அவர்கள் மீட்கப்படுவது என்ற பொருள் அமையும்.
  rationale: முந்தைய தொடரிலுள்ள ‘அவனால்’ என்பதற்கும் மிக அருகிலுள்ள முன்னிடுபொருள் பிசாசே என்பதால், இவ்வாசிப்பு தொடரமைப்பில் இயல்பானது. எனினும், பிரதிப்பெயரின் குறிப்பு நீண்டகாலமாக விவாதிக்கப்பட்டிருப்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் நீண்ட தொடரைத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம்; இரண்டாம் வாக்கியத்தில் ‘வைக்கப்பட்டிருக்கிறார்கள்’ என்பது சிறைப்பட்ட நிலை தொடர்வதை இயல்பாகக் காட்டுகிறது. பிரதிப்பெயரின் இறையியல் சார்ந்த தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
