id: 2TI.2.20
reference: 2 Timothy 2:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: ta
  text: ஒரு பெரிய வீட்டில் தங்கம் மற்றும் வெள்ளியால் செய்யப்பட்ட பாத்திரங்கள் மட்டுமல்ல, மரத்தாலும் மட்பாண்டத்தாலும் செய்யப்பட்டவையும் உள்ளன; அவற்றில் சில மரியாதைக்காகவும், மற்ற சில அவமரியாதைக்காகவும் பயன்படுகின்றன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: ஒரு பெரிய வீட்டில்
  rationale: μέγας இங்கு வீட்டின் அளவையோ அந்தஸ்தையோ குறிக்கலாம். “பெரிய வீடு” என்பது அந்தப் படிமத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: σκεύη
  choice: பாத்திரங்கள்
  rationale: σκεῦος என்பது பயன்பாட்டுக்குரிய பொருள் அல்லது கொள்கலனைக் குறிக்கும் பரந்த சொல். வீட்டுப் படிமத்திலும் உருவகப் பொருளிலும் “பாத்திரங்கள்” நன்றாகப் பொருந்துகிறது.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: தங்கம் மற்றும் வெள்ளியால் செய்யப்பட்ட
  rationale: இந்தப் பெயரடைகள் பாத்திரங்கள் செய்யப்பட்ட பொருளைக் குறிக்கின்றன; தமிழில் பொருள் தெளிவாகத் தெரிய இவ்வாறு விரித்துரைக்கப்பட்டுள்ளது.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: மரத்தாலும் சுட்ட களிமண்ணாலும் செய்யப்பட்டவை
  rationale: ὀστράκινος என்பது சுடப்பட்ட களிமண் அல்லது மட்பாண்டப் பொருளால் செய்யப்பட்டதைக் குறிக்கிறது. “சுட்ட களிமண்” அதன் பொருள் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ ἃ μὲν ... ἃ δὲ ...
  choice: அவற்றில் சில ... வேறு சில ...
  rationale: μέν...δέ அமைப்பு இரண்டு வகைகளுக்கிடையேயான வேறுபாட்டைக் காட்டுகிறது; இந்தத் தமிழ் அமைப்பு அந்த முரணை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τιμήν
  choice: மரியாதைக்காக
  rationale: τιμή என்பதன் அடிப்படைப் பொருளான மரியாதை அல்லது கனம் காக்கப்படுகிறது; வெறும் பயன்பாட்டு வகையாக மட்டும் விளக்கப்படவில்லை.
- source_word: εἰς ἀτιμίαν
  choice: அவமரியாதைக்காக
  rationale: ἀτιμία என்பது τιμή என்பதற்கு எதிர்ச்சொல். “அவமரியாதை” மூலத்தின் நேரடியான முரணையும் அதன் மதிப்பு சார்ந்த அழுத்தத்தையும் காக்கிறது.
- source_word: δὲ (initial)
  choice: தனி இணைப்புச்சொல் சேர்க்கப்படவில்லை
  rationale: தொடக்க δέ மென்மையான தொடர்ச்சி அல்லது மாற்றத்தைக் குறிக்கிறது. இவ்வசனம் தமிழில் இயல்பாகத் தொடங்குவதால் “இப்போது” அல்லது வலுவான “ஆனால்” போன்ற சொல் தேவையின்றிச் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: τιμή/ἀτιμία என்பதை பயன்பாட்டு வகையாக விளக்குவதா, மரியாதை/அவமரியாதை என்ற மதிப்பு சார்ந்த எதிர்மறையாகக் காப்பதா
  choice: “மரியாதைக்காக ... அவமரியாதைக்காக” என்று மூலத்தின் கருத்தியல் எதிர்மறையை முதன்மை உரையில் காத்தல்
  alternative: “மரியாதைக்குரிய பயன்பாட்டிற்காக ... மரியாதையற்ற பயன்பாட்டிற்காக”
  rationale: வீட்டுப் பாத்திரங்களின் சூழல் பயன்பாட்டைக் குறிப்பதாக இருக்கலாம்; ஆயினும் பவுல் τιμή, ἀτιμία என்ற கருத்துப்பெயர்களையே பயன்படுத்துகிறார். அடுத்த வசனத்துடன் தொடர்புடைய உருவக மற்றும் இறையியல் பதற்றத்தை முன்கூட்டியே தீர்க்காமல் முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உருவகத்திற்கேற்ற கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. “பாத்திரங்கள்” உருவகப் பரப்பை காக்கிறது; “சுட்ட களிமண்” இன்றைய வாசகருக்குப் பொருள் தன்மையை விளக்குகிறது. எல்லா அடிக்குறிப்புக் குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் முதன்மை உரையில் இடப்பட்டுள்ளன.
