id: 2TI.2.5
reference: 2 Timothy 2:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: ta
  text: மேலும், ஒருவர் விளையாட்டுப் போட்டியில் போட்டியிட்டால், விதிமுறைப்படி[a] போட்டியிடாவிட்டால் அவருக்கு வெற்றிமகுடம் சூட்டப்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முறைப்படி.” கிரேக்கச் சொல் “சட்டபூர்வமான முறையில்” என்றும் பொருள்படலாம்; இங்கு போட்டியின் விதிகளுக்கு ஏற்ப போட்டியிடுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: விளையாட்டுப் போட்டியில் பங்கேற்றாலும் / போட்டியிடாவிட்டால்
  rationale: ἀθλέω பொதுவான முயற்சியை அல்ல, தடகள அல்லது விளையாட்டுப் போட்டியில் ஈடுபடுவதைச் சுட்டுகிறது. தமிழில் இயல்பாக இருக்கவும், இரு கிரேக்க வினை வடிவங்களின் சொல் தொடர்பைப் பேணவும் ‘போட்டி’ என்ற கருத்து இரு இடங்களிலும் வைக்கப்பட்டுள்ளது.
- source_word: τις
  choice: ஒருவர்
  rationale: பொதுவான, வரையறுக்கப்படாத ஒருவரைக் குறிக்கும் கிரேக்கப் பதத்திற்கு நவீனத் தமிழில் இயல்பான பாலினப் பொதுமை கொண்ட வடிவம்.
- source_word: στεφανοῦται
  choice: அவருக்கு வெற்றி மகுடம் சூட்டப்படாது
  rationale: வெற்றியாளருக்கு சூட்டப்படும் மாலை அல்லது மகுடத்தைச் சுட்டும் தடகள உருவகத்தைத் தெளிவாகப் பேணுகிறது; அதனை குறிப்பிட்ட ஆன்மிகப் பலனாக விளக்கவில்லை.
- source_word: νομίμως
  choice: விதிமுறைப்படி
  rationale: சட்டபூர்வமாக அல்லது முறையாக என்ற பரந்த பொருள் இருந்தாலும், இங்குள்ள போட்டிச் சூழலில் போட்டியின் விதிகளுக்கு ஏற்ப என்பதே இயல்பான பொருள். [a] அடிக்குறிப்பு அதன் பரந்த சொல்லியல் சாத்தியத்தைப் பதிவு செய்கிறது.
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய உருவகங்களுடன் இன்னொரு எடுத்துக்காட்டைச் சேர்க்கும் இணைப்புப் பொருளை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: மேலும்
  rationale: கடுமையான முரண்பாட்டைக் காட்டாமல் அடுத்த எடுத்துக்காட்டிற்கு மெல்ல நகர்த்தும் இடைமாற்றை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: மகுட உருவகத்தின் தன்மை
  choice: வெற்றியாளருக்கு மகுடம் சூட்டப்படும் விளையாட்டு உருவகத்தை மட்டும் பேணுதல்
  alternative: மகுடத்தை முடிவுக்காலப் பலன் அல்லது ஊழியத்திற்கான அங்கீகாரம் என்று வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க வசனம் பலனின் இறையியல் தன்மையைத் துல்லியமாக வரையறுக்கவில்லை. எனவே உரையில் இல்லாத குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் உருவகமும் அதன் பதற்றமும் பேணப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வெற்றி மகுடம்’ என்பது பண்டைய போட்டியில் வெற்றியாளருக்குச் சூட்டப்பட்ட மாலை/மகுட உருவகத்தைத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய கூற்றின் முடிவில் இடம்பெற்றுள்ளது.
