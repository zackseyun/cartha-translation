- from: மேலும், ஒருவர் விளையாட்டுப் போட்டியில் பங்கேற்றாலும், விதிமுறைப்படி போட்டியிடாவிட்டால் அவருக்கு வெற்றி மகுடம் சூட்டப்படாது.[a]
  to: மேலும், ஒருவர் விளையாட்டுப் போட்டியில் போட்டியிட்டால், விதிமுறைப்படி[a] போட்டியிடாவிட்டால் அவருக்கு வெற்றிமகுடம் சூட்டப்படாது.
