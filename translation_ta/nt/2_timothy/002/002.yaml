id: 2TI.2.2
reference: 2 Timothy 2:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: ta
  text: மேலும், பல சாட்சிகளின் முன்னிலையில் நீ என்னிடமிருந்து கேட்டவற்றை[a] நம்பிக்கைக்குரிய மனிதர்களிடம்[b] ஒப்படை; அவர்கள் மற்றவர்களுக்கும் கற்பிக்கத் திறனுள்ளவர்களாக இருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பல சாட்சிகள் முன்பாக.’ இந்தக் கிரேக்கச் சொற்றொடர் பல சாட்சிகள் இருந்தபோது பவுல் வெளிப்படையாகப் போதித்ததைக் குறிக்கலாம்; சாத்தியம் குறைவாக, ‘பல சாட்சிகள் வழியாக’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மனிதர்கள்’ என்பதற்கான கிரேக்கச் சொல் ஆண்பால் பன்மை இலக்கண வடிவத்தில் உள்ளது. இந்த வடிவம் பிரதிநிதித்துவமாகப் பயன்படுத்தப்பட்டு, ‘நம்பிக்கைக்குரிய மக்கள்’ அல்லது ‘நம்பிக்கைக்குரிய நபர்கள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: கேட்டவற்றை
  rationale: நடுநிலைப் பன்மை உறவுப்பெயர் தீமோத்தேயு கேட்ட போதனையின் உள்ளடக்கத்தைக் குறிக்கிறது; தமிழில் வினையோடு இணைந்த ‘வற்றை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἤκουσας
  choice: நீ ... கேட்ட
  rationale: இறந்தகாலச் செயலை எளிய தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: παρ’ ἐμοῦ
  choice: என்னிடமிருந்து
  rationale: ἀκούω என்பதோடு வரும் παρά + உரிமை வேற்றுமை, கேட்ட செய்தியின் மூலத்தைச் சுட்டுகிறது.
- source_word: διὰ πολλῶν μαρτύρων
  choice: பல சாட்சிகளின் முன்னிலையில்
  rationale: διά + உரிமை வேற்றுமை இங்கு பல சாட்சிகள் உடனிருந்த பொதுவான சூழலைக் குறிக்கும் வாய்ப்பு அதிகம்; கருவியாக ‘சாட்சிகள் வழியாக’ என்ற வாசிப்பும் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: ταῦτα
  choice: அவற்றை
  rationale: தமிழ் வாக்கிய அமைப்பில் ‘கேட்டவற்றை’ என்பதிலேயே சுட்டுப்பொருள் இயல்பாக ஒருங்கிணைகிறது; தனியே மீண்டும் கூறுவது தேவையற்ற கடினத்தன்மையை உண்டாக்கும்.
- source_word: παράθου
  choice: ஒப்படை
  rationale: ஒருவரின் பொறுப்பிலும் பாதுகாப்பிலும் போதனையை நம்பி வைப்பது என்ற பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πιστοῖς
  choice: நம்பிக்கைக்குரிய
  rationale: இங்கு போதனையை உண்மையுடன் தொடர்ந்து எடுத்துச் செல்லும் நம்பகத்தன்மையே முன்னிலை; அதேவேளை ‘விசுவாசமுள்ள’ என்ற சமய ஒலிவையும் முற்றிலும் மறுப்பதில்லை.
- source_word: ἀνθρώποις
  choice: மனிதர்களிடம்
  rationale: ἄνθρωπος பொதுவாக மனிதர்களைக் குறிக்கக்கூடியது. தமிழ் ‘மனிதர்கள்’ மூலச்சொல்லின் பொதுவான பொருளை இயல்பாகப் பாதுகாக்கிறது; ஆண்களைச் சிறப்பாகக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: குறிப்பிட்ட வகையினரை விளக்கும் உறவுத்தொடர் தமிழில் தனித் தொடராக இயல்பாக மாற்றப்பட்டுள்ளது.
- source_word: ἱκανοὶ ἔσονται
  choice: திறனுள்ளவர்களாக இருப்பார்கள்
  rationale: ἱκανός என்பதின் தகுதி அல்லது போதுமான திறன் என்ற பொருளையும், ἔσονται என்பதின் எதிர்காலக் குறிப்பையும் பாதுகாக்கிறது.
- source_word: καὶ ἑτέρους
  choice: மற்றவர்களுக்கும்
  rationale: καί இங்கு மேலும் பிறரையும் போதிப்பதைச் சுட்டுகிறது; தமிழின் ‘-உம்’ அதைப் பொருத்தமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πιστοῖς ἀνθρώποις என்பதன் பாலின வரம்பு
  choice: நம்பிக்கைக்குரிய மனிதர்கள்
  alternative: நம்பிக்கைக்குரிய ஆண்கள்
  rationale: ἄνθρωπος சொல் ஆண்பால் இலக்கண வடிவத்தில் இருந்தாலும் மனிதர்களைப் பொதுவாகக் குறிக்க முடியும். ஆகவே மூலத்தின் உண்மையான பரப்பைச் சுருக்காமல் பொதுவான தமிழ்ச் சொல் முதன்மை உரையில் பயன்படுத்தப்படுகிறது; ஆண்களைச் சிறப்பாகக் குறிக்கும் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட கிரேக்க உறவுத்தொடர் தமிழில் தெளிவுக்காக அரைப்புள்ளியால் இரு பகுதிகளாக அமைக்கப்பட்டுள்ளது; எதிர்கால வினை வடிவம் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
