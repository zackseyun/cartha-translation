  text: νόει ⸀ὃ λέγω· ⸀δώσει γάρ σοι ὁ κύριος σύνεσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/007.yaml
  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: ta
  text: நான் சொல்வதைச் சிந்தித்துப் பார்[a]; ஏனெனில் ஆண்டவர்[b] எல்லாவற்றிலும் உனக்குப் புரிதலைத் தருவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் சொல்வதைப் பற்றி யோசித்துப் பார்”; இந்த வினைச்சொல் “புரிந்துகொள்” என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “ஆண்டவர்” என்று மட்டுமே உள்ளது; இது குறிப்பாக ஆண்டவராகிய இயேசுவைக் குறிக்கிறதா அல்லது பொதுவாகக் கடவுளைக் குறிக்கிறதா என்பதில் கருத்து வேறுபாடு உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: கவனமாகச் சிந்தித்துப் பார்
  rationale: நிகழ்காலக் கட்டளை வடிவம் தீமோத்தேயுவைச் செயற்பாட்டுடன் சிந்திக்க அழைக்கிறது. ‘சிந்தித்துப் பார்’ என்பது இயல்பான நவீனத் தமிழில் கட்டளையின் வலிமையைத் தருகிறது; ‘கவனமாக’ என்பது மனதைச் செலுத்தும் பொருளை வெளிப்படுத்துகிறது. ‘புரிந்துகொள்’ என்பதும் சாத்தியம்; ஆனால் அடுத்ததாக ஆண்டவர் புரிதல் தருவார் என்ற வாக்குறுதியுடன் உள்ள வேறுபாட்டை இத்தேர்வு நன்றாகப் பேணுகிறது.
- source_word: ὃ
  choice: எதை / அதைக் (நான் சொல்வதை)
  rationale: நடுநிலை ஒருமை உறவுப்பெயர் பவுல் கூறும் கருத்தின் உள்ளடக்கத்தைக் குறிக்கிறது. தமிழில் ‘நான் சொல்வதை’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγω
  choice: நான் சொல்வது
  rationale: நிகழ்கால வினை இச்சூழலில் பவுலின் உடனடியான போதனையைக் குறிக்கிறது. பெயரெச்சத் தொடரான ‘நான் சொல்வதை’ தமிழில் இயல்பாக அமைகிறது.
- source_word: δώσει
  choice: தருவார்
  rationale: δίδωμι என்பதன் எதிர்கால வடிவம் நேரடியான வாக்குறுதியைத் தெரிவிக்கிறது. மரியாதை ஒருமையுடன் ‘தருவார்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: γάρ முந்தைய கட்டளைக்கான காரணத்தையோ அடிப்படையையோ அறிமுகப்படுத்துகிறது. ‘ஏனெனில்’ அந்தத் தொடர்பைத் தெளிவாகப் பேணுகிறது.
- source_word: σοι
  choice: உனக்கு
  rationale: இரண்டாம் நபர் ஒருமை மறைமுகச் செயப்படுபொருளைத் தமிழில் ‘உனக்கு’ நேரடியாகக் காட்டுகிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: ‘ஆண்டவர்’ என்பது κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் இணை. கிரேக்கம் இயேசுவையா அல்லது கடவுளையா குறிப்பாகச் சொல்கிறது என்பதை வெளிப்படையாகத் தீர்மானிக்காததால் மொழிபெயர்ப்பும் ‘ஆண்டவர்’ என்றே வைத்திருக்கிறது.
- source_word: σύνεσιν
  choice: புரிதலை
  rationale: σύνεσις என்பது புரிந்துகொள்ளும் திறன், உட்பார்வை, கருத்துணர்வு ஆகியவற்றைக் குறிக்கலாம். ‘புரிதல்’ பரந்த பொருளையும் பொதுவான வாசகருக்கான தெளிவையும் பேணுகிறது.
- source_word: ἐν πᾶσιν
  choice: எல்லாவற்றிலும்
  rationale: இந்தச் சொற்றொடரின் பரந்த, அனைத்தையும் உள்ளடக்கும் வரம்பை ‘எல்லாவற்றிலும்’ வடிவத்தையும் பொருளையும் நெருக்கமாகப் பேணுகிறது; இதை போதனை சார்ந்த விஷயங்களுக்கு மட்டும் சுருக்கவில்லை.
theological_decisions:
- issue: ὁ κύριος (‘ஆண்டவர்’) என்பதன் குறிப்பு
  choice: யாரென்று மேலும் குறிப்பாக்காமல் ‘ஆண்டவர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஆண்டவராகிய இயேசு’ அல்லது ‘கடவுள்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: கிரேக்க வசனம் ‘ஆண்டவர்’ என்பதற்கு அப்பால் குறிப்பைத் தெளிவுபடுத்தவில்லை. பவுலின் பயன்பாட்டில் இது இயேசுவைக் குறிக்கக்கூடும்; எனினும் வசனத்திலுள்ள மெய்யான தெளிவின்மையை மொழிபெயர்ப்பு தீர்த்துவிடக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பவுல் தீமோத்தேயுவிடம் பேசும் ஒருமை ‘நீ’ நடையும் ஆண்டவருக்கான மரியாதை ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. நடை கண்ணியமானதும் பொதுவான வாசகர்களுக்கு எளிதில் புரியக்கூடியதுமாக உள்ளது. முதன்மை உரையிலுள்ள [a], [b] குறிகள் தொடர்புடைய சொற்றொடர்களின் உடனேயே வைக்கப்பட்டுள்ளன.
