id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: ta
  text: 'ஆனாலும், கடவுளுடைய உறுதியான அடித்தளம் நிலைத்து நிற்கிறது; அதில் இந்த முத்திரை உள்ளது: “தமக்குரியவர்களை ஆண்டவர் அறிவார்”; மேலும், “ஆண்டவரின் பெயரைச் சொல்லுகிற[a] ஒவ்வொருவரும் அநீதியைவிட்டு விலகட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரின் பெயரை அழைக்கிற ஒவ்வொருவரும்.” “ஆண்டவரின் பெயரைச் சொல்லுதல்” என்பது அவரை அழைப்பதையோ அவருக்கான பற்றுறுதியை வெளிப்படையாக அறிக்கையிடுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: ஆனாலும்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட பொய்ப்போதனையின் பாதிப்புக்கு எதிராக வலுவான முரண்பாட்டையும் விட்டுக்கொடுக்கும் இணைப்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: στερεὸς θεμέλιος
  choice: உறுதியான அடித்தளம்
  rationale: நிலைத்தன்மையையும் அசைக்க முடியாத தன்மையையும் குறிக்கும் உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளுடைய
  rationale: உடைமை, தோற்றுவாய் அல்லது பண்புசார் தொடர்பு ஆகியவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் கிரேக்கப் பிறப்புவேற்றுமையின் விரிவைத் தக்கவைக்கிறது.
- source_word: ἕστηκεν
  choice: நிலைத்து நிற்கிறது
  rationale: நிறுவப்பட்டு தொடர்ந்து நிற்கும் நிலையை உணர்த்தும் நிறைவுக்கால வினையின் நிலைசார் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: அதில் இந்த முத்திரை உள்ளது
  rationale: அடையாளப்படுத்தும் அல்லது உறுதிப்படுத்தும் முத்திரை என்ற உருவகத்தைப் பாதுகாக்கிறது; தமிழில் அடித்தளத்தோடு தொடர்பை இயல்பாகத் தெரிவிக்கிறது.
- source_word: Ἔγνω
  choice: அறிவார்
  rationale: மேற்கோளில் நிலையான, காலங்கடந்த தெய்வீக அறிதலைக் குறிக்கும் பொருளைத் தமிழின் வழக்கமான நிகழ்கால வடிவில் தருகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: வேதாகமச் சூழலில் κύριος என்பதன் மரியாதைமிக்க, உடன்படிக்கை சார்ந்த ஒலிப்பைத் தக்கவைக்கிறது.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: தமக்குரியவர்களை
  rationale: அவருக்குச் சொந்தமானவர்கள் அல்லது அவரோடு அடையாளப்படுத்தப்பட்டவர்கள் என்ற உறவைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: Ἀποστήτω
  choice: விலகட்டும்
  rationale: அநீதியிலிருந்து தீர்மானமாகப் பிரிவதைக் கோரும் ஒருமை மூன்றாம் நபர் கட்டளையின் வலிமையைத் தக்கவைக்கிறது.
- source_word: ἀπὸ ἀδικίας
  choice: அநீதியைவிட்டு
  rationale: ἀδικία என்பதிலுள்ள ஒழுக்கக்கேடு, தவறு, நீதியின்மை ஆகிய பரந்த நெறிசார் பொருளை ஒரே சொல்லில் பாதுகாக்கிறது.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: ஆண்டவரின் பெயரைச் சொல்லுகிற ஒவ்வொருவரும்
  rationale: ‘பெயரைப் பெயரிடுகிறவர்’ என்ற மூலத்தின் சொல்லமைப்பைத் தமிழில் புரியத்தக்க வகையில் நெருக்கமாகத் தருகிறது; அழைத்தல் அல்லது பற்றுறுதியை அறிக்கையிடுதல் என்ற மரபுத்தொடர் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இரு முத்திரை வாசகங்களிலும் ‘ஆண்டவர்’ என்பவரின் குறிப்பு
  choice: இரு இடங்களிலும் ‘ஆண்டவர்’ என்றே மொழிபெயர்த்து, பிதாவா கிறிஸ்துவா என்பதை உரையில் குறிப்பாகத் தீர்மானிக்கவில்லை.
  alternative: இரண்டையும் பிதாவைக் குறிப்பதாகவோ, இரண்டையும் கிறிஸ்துவைக் குறிப்பதாகவோ, அல்லது இரு வாசகங்களிலும் வேறு வேறு குறிப்புகள் உள்ளதாகவோ விளக்கலாம்.
  rationale: கிரேக்க உரை κύριος என்று மட்டும் கூறுகிறது. பழைய வேதாகம மொழி கிறிஸ்தவச் சூழலில் பயன்படுத்தப்படுவதால் உருவாகும் அடுக்குள்ள இறையியல் குறிப்பை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதைமிக்க வேதாகம நடையைப் பயன்படுத்தியது. ‘முத்திரை,’ ‘அடித்தளம்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
