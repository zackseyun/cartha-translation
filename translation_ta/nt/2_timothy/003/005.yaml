  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: ta
  text: இறைப்பற்றின் வடிவத்தைக் கொண்டிருந்தாலும்[a], அதன் வல்லமையை மறுதலித்தவர்களிடமிருந்து விலகியிரு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: ‘இறைப்பற்றின் தோற்றம்.’ கிரேக்கச் சொல் வெளிப்புற வடிவத்தையோ வெளிப்பாட்டையோ வலியுறுத்தலாம்; ‘வல்லமை’ என்பதுடனான முரண்பாட்டைப் பேண ‘வடிவம்’ பயன்படுத்தப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: ‘இப்படிப்பட்டவர்களைத் தவிர்த்துவிடு’ அல்லது ‘இவர்களிடமிருந்து விலகியிரு.’ கிரேக்க வினைச்சொல் ஒருவர் தம்மையே இவர்களிடமிருந்து திருப்பிக்கொள்வதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: கொண்டிருந்தும்
  rationale: முந்தைய சூழலில் விவரிக்கப்படும் மனிதர்களைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையை இயல்பான தமிழில் தருகிறது; தொடர்ந்து வரும் முரண்பாட்டையும் தெளிவாக்குகிறது.
- source_word: μόρφωσιν
  choice: வடிவம்
  rationale: வெளிப்புறத் தோற்றம் அல்லது உருவமைப்பு என்ற பொருள் வரம்பைப் பேணுவதோடு, பின்னர் வரும் ‘வல்லமை’ என்பதுடனான முரண்பாட்டையும் மிகையாக விளக்காமல் காக்கிறது.
- source_word: εὐσεβείας
  choice: இறைப்பற்று
  rationale: தேவனை நோக்கிய பயபக்தி, அர்ப்பணிப்பு, அதற்கேற்ற வாழ்க்கை ஆகியவற்றை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது; வெறும் சடங்கு அல்லது சமயம் என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: அதன் வல்லமையை
  rationale: உண்மையான இறைப்பற்றுக்குரிய செயலாற்றும் ஆற்றலைக் குறிக்கும் மூலத்தின் பரந்த பொருளைப் பேணுகிறது; இதை அற்புதங்கள், ஒழுக்க மாற்றம் அல்லது வேறு ஓர் குறிப்பிட்ட செயல்பாடு என்று குறுக்கவில்லை.
- source_word: ἠρνημένοι
  choice: மறுதலித்தவர்களாக இருப்பார்கள்
  rationale: நிறைவுநிலைப் பங்கேற்புவினை சுட்டும், முன்பே மேற்கொள்ளப்பட்டு தொடரும் நிலையான மறுப்பைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ τούτους ἀποτρέπου
  choice: இப்படிப்பட்டவர்களைவிட்டு விலகியிரு
  rationale: தன்னையே அவர்களிடமிருந்து திருப்பிக்கொண்டு தொடர்ந்து விலகியிருக்க வேண்டும் என்ற நிகழ்கால இடைநிலை ஏவலின் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: வெளிப்புற இறைப்பற்றுக்கும் அதன் உள்ளார்ந்த செயலாற்றும் உண்மைக்கும் இடையிலான முரண்பாடு
  choice: ‘இறைப்பற்றின் வடிவம்’ என்றும் ‘அதன் வல்லமை’ என்றும் மொழிபெயர்த்து, மூலத்தில் உள்ள முரண்பாட்டைத் திறந்த நிலையில் பேணுதல்
  alternative: ‘இறைப்பற்றின் தோற்றம்’ அல்லது ‘சமயப்பற்றின் வேடம்’
  rationale: இவ்வசனம் வெளிப்புற மதத் தோற்றத்துக்கும் உண்மையான இறைப்பற்றின் செயலாற்றும் நிஜத்துக்கும் இடையிலான வேறுபாட்டை விமர்சிக்கிறது. ‘வல்லமை’ என்பதை அற்புதம், ஒழுக்க மாற்றம், அல்லது பரிசுத்த ஆவியின் செயல் என்ற ஒரே விளக்கத்துக்குள் மொழிபெயர்ப்பு கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைப்பற்று’ என்பது εὐσέβεια என்பதன் தேவனை நோக்கிய பக்தியையும் அதற்கேற்ற வாழ்வையும் உள்ளடக்கும்; ‘விலகியிரு’ தொடர்ச்சியான கட்டளையின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
