lexical_decisions:
- source_word: σὺ δὲ
  choice: ஆனால் நீயோ
  rationale: வெளிப்படையாக இடம்பெறும் σὺ முந்தைய வசனங்களில் கூறப்பட்டவர்களிலிருந்து தீமோத்தேயுவை வலியுறுத்தி வேறுபடுத்துகிறது; δὲ எதிர்மறையான திருப்பத்தைக் குறிக்கிறது.
- source_word: μένε ἐν οἷς
  choice: நீ ...வற்றிலும் ...வற்றிலும் நிலைத்திரு
  rationale: நிகழ்காலக் கட்டளை தொடர்ந்து நிலைத்திருக்குமாறு அழைக்கிறது. ἐν என்பதன் ‘உள்ளே/அவற்றில்’ என்ற உருவகத்தையும் ‘நிலைத்திரு’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἔμαθες
  choice: கற்றுக்கொண்டவற்றில்
  rationale: முன்னர் பெற்ற போதனையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπιστώθης
  choice: உறுதியாக நம்பியவற்றில்
  rationale: போதனையைக் கற்றதுடன் இணைந்து, அதைக் குறித்து ஏற்பட்ட நிலையான நிச்சயத்தை இயல்பான தமிழில் தெரிவிக்கிறது; செயப்பாட்டு வடிவத்தைச் சொற்குச் சொல் கடினமாக்காமல் அதன் பொருளைப் பாதுகாக்கிறது.
- source_word: εἰδὼς
  choice: அறிந்திருக்கிறாய்
  rationale: தீமோத்தேயுவிடம் ஏற்கெனவே உள்ள அறிவைத் தெரிவிக்கிறது. கிரேக்கப் பங்கேற்புவினையின் காரண அல்லது உடன்நிகழ்வு நுட்பத்தை மிகையாகத் தீர்மானிக்காமல் தமிழில் இயல்பான வாக்கியமாக்குகிறது.
- source_word: παρὰ τίνων
  choice: எவர்களிடமிருந்து
  rationale: παρά உடைமை வேற்றுமையுடன் மூலத்தைச் சுட்டுகிறது. SBLGNT-இன் பன்மை வாசகத்தை ‘எவர்களிடமிருந்து’ தெளிவாகப் பாதுகாக்கிறது; அந்த நபர்கள் யார் என்று வசனத்திற்கு அப்பால் குறிப்பிடவில்லை.
- source_word: ἔμαθες
  choice: கற்றுக்கொண்டாய்
  rationale: முதல் ‘கற்றுக்கொண்ட’ என்பதைக் குறிப்பிட்டுத் திரும்பச் சொல்வதைப் பாதுகாக்கிறது; ‘அவற்றை’ என்பது தமிழில் மறைந்துள்ள பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: παρὰ τίνων என்பதன் சுட்டுப்பொருள்
  choice: பன்மையாக ‘எவர்களிடமிருந்து’ என்று மொழிபெயர்த்து, அந்தப் போதகர்கள் யார் என்பதை முதன்மை உரையில் குறிப்பிடவில்லை.
  alternative: சில கையெழுத்துப் பிரதிகளின்படி ஒருமையாக ‘எவரிடமிருந்து’; இது பவுலைக் குறிப்பதாகப் புரிந்துகொள்ளப்படலாம்.
  rationale: SBLGNT பன்மை வாசகத்தைக் கொண்டுள்ளது; ஆனால் வசனமே அந்த நபர்களை அடையாளப்படுத்தவில்லை. ஆகவே பவுல், தீமோத்தேயுவின் தாய் அல்லது பாட்டி என விளக்கத்தை முதன்மை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: ἐπιστώθης என்பதன் பொருள்
  choice: ‘உறுதியாக நம்பியவற்றில்’ என்று, கற்ற போதனைகளைக் குறித்த தீமோத்தேயுவின் நிலையான நிச்சயத்தை வெளிப்படுத்தியது.
  alternative: ‘உனக்கு உறுதிப்படுத்தப்பட்டவற்றில்’ அல்லது ‘நிச்சயப்படுத்தப்பட்டவற்றில்.’
  rationale: இச்சூழலில் ‘கற்றுக்கொண்ட’ என்பதோடு இணைந்திருப்பதால், ஒப்படைக்கப்பட்ட பொறுப்பைவிட கற்றவற்றைப் பற்றிய உறுதியே பொருத்தமானது. எனினும் செயப்பாட்டு வடிவத்தின் மாற்றுப் புரிதலை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மறைநூலுக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘நீயோ’ வலியுறுத்தப்பட்ட மாறுபாட்டையும், ‘நிலைத்திரு’ தொடர்ந்த பற்றுறுதியையும் தக்கவைக்கின்றன. பன்மை வாசகம் ‘எவர்களிடமிருந்து’ என்பதால் வெளிப்படையாகிறது.
