  language: ta
  text: ஆனால், நீயோ கற்றுக்கொண்டவற்றிலும் உறுதியாக நம்பியவற்றிலும்[b] நிலைத்திரு; அவற்றை எவர்களிடமிருந்து கற்றுக்கொண்டாய் என்பதை அறிந்திருக்கிறாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் பன்மையான ‘எவர்களிடமிருந்து’ என்பதற்குப் பதிலாக ஒருமையான ‘எவரிடமிருந்து’ என்று உள்ளது; அது பெரும்பாலும் பவுலைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது. இங்கே பின்பற்றப்பட்டுள்ள பன்மை வாசகம் தீமோத்தேயு கற்றுக்கொண்ட பல நபர்களைக் குறிக்கக்கூடும்.
    reason: textual_variant
