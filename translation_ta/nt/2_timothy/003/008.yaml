source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: ta
  text: யந்நேயும் யம்பிரேயும் மோசேயை எதிர்த்ததுபோலவே[a], இவர்களும் உண்மையை எதிர்க்கிறார்கள். மனதில் சீர்கெட்டவர்கள்; விசுவாசத்தைப் பொறுத்தவரை தகுதியற்றவர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மோசேயை எதிர்த்து நின்றதுபோல’ ... ‘உண்மையை எதிர்த்து நிற்கிறார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘விசுவாசம்’ என்பது வெறும் தனிப்பட்ட நம்பிக்கையை மட்டுமல்லாமல், கிறிஸ்தவ விசுவாசத்தையோ அப்போஸ்தல செய்தியையோ குறிக்கக்கூடும்.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον
  choice: எதிர்த்ததுபோல
  rationale: ஒப்புமையை அறிமுகப்படுத்தும் கிரேக்கச் சொற்றொடரின் பொருளை இயல்பான தமிழில் ‘...போல’ எனத் தருகிறது.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான கருத்துத் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் ஒப்புமை அமைப்பே அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: யந்நேயும் யம்பிரேயும்
  rationale: கிரேக்கப் பெயர்களைத் தமிழில் ஒலிபெயர்த்து, இணைப்பை ‘-உம் ... -உம்’ மூலம் காட்டுகிறது.
- source_word: ἀντέστησαν / ἀνθίστανται
  choice: எதிர்த்ததுபோல / எதிர்க்கிறார்கள்
  rationale: 'இரு வினைகளின் நேர வேறுபாட்டையும் இணையான செயற்பாட்டையும் காக்கிறது: முன்னர் நிகழ்ந்த எதிர்ப்பு மற்றும் தற்போது தொடரும் எதிர்ப்பு.'
- source_word: Μωϋσεῖ
  choice: மோசேயை
  rationale: எதிர்த்தல் என்ற தமிழ் வினைக்கு ஏற்ற செயப்படுபொருள் வேற்றுமையுடன் வழக்கமான தமிழ் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: οὕτως καὶ οὗτοι
  choice: இவர்களும்
  rationale: முந்தைய ஒப்புமையின் தொடர்ச்சியாக ‘இவர்களும்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; சூழலில் குறிப்பிட்ட ஆண்களைக் குறிக்கிறது.
- source_word: τῇ ἀληθείᾳ
  choice: உண்மையை
  rationale: கிரேக்கத்தின் பரந்த இறையியல் பொருளைச் சுருக்காமல் ‘உண்மை’ என வைத்திருக்கிறது.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: மனம் சீர்கெட்ட மனிதர்கள்
  rationale: κατεφθαρμένοι குறிக்கும் சீரழிந்த நிலையைத் தெளிவாகத் தருகிறது; τὸν νοῦν என்பது எந்த வகையில் சீர்கெட்டவர்கள் என்பதைச் சுட்டுவதால் இயல்பான தமிழ் பெயரடைத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: ἀδόκιμοι
  choice: தகுதியற்றவர்கள்
  rationale: சோதனையில் ஏற்றுக்கொள்ளத்தக்கவர்களாக நிரூபிக்கப்படாத நிலையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: περὶ τὴν πίστιν
  choice: விசுவாசத்தைப் பொறுத்தவரை
  rationale: περί குறிக்கும் தொடர்பு அல்லது துறையைத் துல்லியமாகக் காட்டி, πίστις என்பதன் சாத்தியமான பொருள் அகலத்தை முதன்மை உரையில் காக்கிறது.
theological_decisions:
- issue: ‘உண்மை’ மற்றும் ‘விசுவாசம்’ என்பவற்றின் குறிப்பு
  choice: இரண்டையும் பரந்த பவுலிய சொற்களாக முதன்மை உரையில் வைத்தல்
  alternative: ‘உண்மை’ என்பதைப் பொதுவான ஒழுக்க உண்மையாகவும், ‘விசுவாசம்’ என்பதைத் தனிப்பட்ட நம்பிக்கையாகவும் வெளிப்படையாக விளக்குதல்
  rationale: சூழல் அப்போஸ்தல போதனையை எதிர்க்கும் போலிப் போதகர்களைப் பற்றியது; ஆயினும் கிரேக்க உரை இச்சொற்களை மேலும் குறுக்கவில்லை. ஆகவே தெளிவின்மையும் இறையியல் நிறையும் பாதுகாக்கப்படுகின்றன.
- issue: ἄνθρωποι என்பதன் பாலினக் குறிப்பு
  choice: ‘மனிதர்கள்’ என்று மொழிபெயர்த்து, ‘இவர்கள்’ மூலம் குறிப்பிட்ட குழுவைக் காட்டுதல்
  alternative: ‘ஆண்கள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழலில் ஆண் போலிப் போதகர்களைக் குறிக்கலாம்; இருப்பினும் ἄνθρωποι என்பதற்கான இயல்பான தமிழ் ‘மனிதர்கள்’. இது குறிப்பிட்ட நபர்களை நடுநிலைப்படுத்தாமல், தமிழில் தேவையற்ற கடினத்தையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம வாசிப்புக்கேற்ற செறிவும் உள்ள நடை. ஒப்புமைத் தொடர் இயல்பாக அமைக்கப்பட்டுள்ளது; கிரேக்கத்தில் தனியான காலச்சுட்டுச் சொல் இல்லாததால் தொடக்கத்தில் ‘இப்போது’ சேர்க்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
