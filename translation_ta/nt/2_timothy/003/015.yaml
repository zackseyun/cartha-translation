id: 2TI.3.15
reference: 2 Timothy 3:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: ta
  text: மேலும், பச்சிளங்குழந்தையாக இருந்த காலத்திலிருந்தே நீ புனித எழுத்துக்களை[a] அறிந்திருக்கிறாய்; அவை மெசியாவாகிய இயேசுவின்மேல் உள்ள விசுவாசத்தின் மூலம்[b] இரட்சிப்புக்காக உன்னை ஞானியாக்க வல்லவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்த வேத எழுத்துக்களை.’ கிரேக்கத்தில் சொல்லுக்குச் சொல் ‘புனித எழுத்துக்கள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மெசியாவாகிய இயேசுவின் உண்மைத்தன்மையின் மூலம்.’ எனினும், இங்கு ‘மெசியாவாகிய இயேசுவின்மேல் உள்ள விசுவாசத்தின் மூலம்’ என்பதே அதிக இயல்பான பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: பச்சிளம் பருவத்திலிருந்தே
  rationale: βρέφος மிக இளம் குழந்தையையோ பச்சிளங்குழந்தையையோ குறிக்கிறது. பொதுவான ‘குழந்தைப் பருவம்’ என்பதைக் காட்டிலும் மூலத்தின் வலுவான பொருளை இது காக்கிறது.
- source_word: ἱερὰ γράμματα
  choice: புனித எழுத்துக்கள்
  rationale: இச்சொற்றொடர் நேரடியாக ‘புனிதமான எழுத்துக்கள்/எழுத்தாக்கங்கள்’ எனப் பொருள்படும். பிற்காலத் தொழில்நுட்பச் சொல்லை தேவையின்றி திணிக்காமல், தீமோத்தேயு கற்ற வேத எழுத்துக்களைக் குறிக்கும் இயல்பான தமிழாக இது உள்ளது.
- source_word: οἶδας
  choice: அறிந்திருக்கிறாய்
  rationale: οἶδα வடிவில் நிறைவுக்காலமாக இருந்தாலும் நிகழ்காலப் பொருள் தருகிறது; ἀπὸ βρέφους என்பதுடன் சேரும்போது, சிறு பருவம் முதல் தொடரும் அறிவை ‘அறிந்திருக்கிறாய்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ δυνάμενά
  choice: அவை … வல்லவை
  rationale: பெயரெச்ச வினைச்சொல் ‘புனித எழுத்துக்கள்’ என்பதையே சுட்டுகிறது; அவற்றின் ஆற்றலைத் தெளிவாகக் காக்க இந்த அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: σε σοφίσαι
  choice: உன்னை ஞானமுள்ளவனாக்க
  rationale: σοφίζω இங்கு ஞானமுள்ளவனாக்குதல் அல்லது ஞானம் அளித்தல் என்று பொருள்படும்; தேர்ந்தெடுத்த சொற்றொடர் மூலத்தின் நேரடியான செயற்பொருளைக் காக்கிறது.
- source_word: εἰς σωτηρίαν
  choice: இரட்சிப்புக்காக
  rationale: εἰς இலக்கையையோ விளைவையையோ குறிக்கிறது; ‘இரட்சிப்புக்காக’ என்பது அந்த நோக்குப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: διὰ πίστεως
  choice: விசுவாசத்தின் மூலம்
  rationale: இச்சூழலில் πίστις என்பதற்கு ‘விசுவாசம்’ என்பதே இயல்பான பொருள்; διά குறிக்கும் வழிமுறையையும் ‘மூலம்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவின்மேல் உள்ள
  rationale: Χριστός இங்கு பட்டப்பெயராக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது. விசுவாசத்தின் பொருளைத் தமிழில் இயல்பாகக் காட்ட ἐν என்பது ‘இயேசுவின்மேல் உள்ள’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστῷ என்பதைப் பட்டப்பெயராகவா, பெயரின் பகுதியாகவா வழங்குவது
  choice: மெசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός என்பதன் பட்டப்பெயர்ப் பொருளை மறைக்காமல் ‘மெசியா’ என மொழிபெயர்ப்பது மூலத்தின் கிறிஸ்தியல் வலியுறுத்தலைக் காக்கிறது.
- issue: διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ என்பதில் πίστεως-ன் பொருள்
  choice: மெசியாவாகிய இயேசுவின்மேல் உள்ள விசுவாசத்தின் மூலம்
  alternative: மெசியாவாகிய இயேசுவின் உண்மைத்தன்மையின் மூலம்
  rationale: இலக்கணத்திலும் சூழலிலும் இயேசுவின்மேல் வைக்கப்படும் விசுவாசமே அதிக இயல்பான வாசிப்பு. இருப்பினும் ‘மெசியா இயேசுவின் உண்மைத்தன்மை’ என்ற குறைந்த சாத்தியமுள்ள வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பச்சிளம் பருவம்’ மூலத்தின் βρέφος என்ற வலுவான இளம்பருவக் குறிப்பைக் காக்கிறது; ‘புனித எழுத்துக்கள்’ மூலத்தின் சொற்பொருளைத் தக்கவைக்கிறது. இறையியல் தெளிவின்மையைத் தீர்த்துவிடாமல் மாற்று வாசிப்பு அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
