base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: ta
  text: ஆனால் தீய மனிதர்களும் ஏமாற்றுக்காரர்களும்[b] மேலும் மேலும் மோசமடைவார்கள்[a]; பிறரை ஏமாற்றிக்கொண்டும் தாங்களும் ஏமாற்றப்பட்டுக்கொண்டும் இருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லளவில், “மோசமானதை நோக்கி முன்னேறுவார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “ஏமாற்றுக்காரர்கள்” என்பதற்கான கிரேக்கச் சொல் மோசடிப் போலிகளைக் குறிக்கலாம்; சில சூழல்களில் மந்திரவாதிகள் அல்லது போலி வைத்தியர்கள் என்ற நிழற்பொருளும் அதற்கு உண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: தீய
  rationale: இது வெறும் தரக்குறைவை அல்ல, ஒழுக்கத் தீமையைக் குறிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் தீமோத்தேயுவைப் பற்றிச் சொல்லப்பட்டதற்கு மாறான நிலையை இயல்பாகக் காட்டுகிறது.
- source_word: ἄνθρωποι
  choice: மனிதர்கள்
  rationale: கிரேக்கச் சொல் இலக்கணத்தில் ஆண்பால் பன்மையாக இருந்தாலும், இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
- source_word: γόητες
  choice: ஏமாற்றுக்காரர்கள்
  rationale: மோசடிக்காரர்கள் அல்லது போலிகள் என்ற பொருளைத் தருகிறது; சூனியம் என்ற சாத்தியமான நிழற்பொருளைச் சூழல் உறுதிப்படுத்தாததால் அதை முதன்மை உரையில் மிகைப்படுத்தவில்லை.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: மேலும் மேலும் மோசமடைவார்கள்
  rationale: சொல்லளவில் ‘மோசமானதை நோக்கி முன்னேறுவார்கள்’; தமிழில் நிலை தொடர்ந்து கெடுவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πλανῶντες
  choice: பிறரை ஏமாற்றிக்கொண்டும்
  rationale: தொடரும் செயலைக் காட்டும் நிகழ்கால வினையெச்சத்தின் பொருளையும், செயப்படுபொருளைத் தமிழில் தெளிவாக்குவதையும் இணைக்கிறது.
- source_word: πλανώμενοι
  choice: தாங்களும் ஏமாற்றப்பட்டுக்கொண்டும்
  rationale: செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, ஏமாற்றுகிறவர்களே ஏமாற்றத்திற்கு உட்படுகிறார்கள் என்ற பதற்றத்தை நிலைநிறுத்துகிறது.
theological_decisions:
- issue: ἄνθρωποι என்பதன் ஆண்பால் இலக்கண வடிவம்
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: இங்கு குறிப்பு பாலினத்தால் வரையறுக்கப்படவில்லை; பொதுவாக மனிதர்களையே குறிக்கிறது.
- issue: γόητες என்பதன் பொருள் நுணுக்கம்
  choice: ஏமாற்றுக்காரர்கள்
  alternative: போலிகள் / மந்திரவாதிகள்
  rationale: சொல் மோசடிக்காரர்களைக் குறிக்கலாம்; சில பயன்பாடுகளில் மந்திரம் அல்லது போலி வைத்தியம் சார்ந்த நிழற்பொருளும் உண்டு. இச்சூழல் அத்தகைய மறைமாந்திரீகக் கூற்றைத் தெளிவாகக் கோராததால் பொதுவான மோசடிப் பொருள் தேர்ந்தெடுக்கப்பட்டது.
- issue: πλανώμενοι என்பதன் செயப்பாட்டு நிலை
  choice: ஏமாற்றப்பட்டுக்கொண்டும்
  alternative: வழிதவறிக்கொண்டும்
  rationale: யார் அவர்களை ஏமாற்றுகிறார்கள் என்பதை உரை குறிப்பிடாமல் விடுகிறது; செயப்பாட்டு வடிவம் அந்தத் திறந்த நிலையையும், அவர்கள் தாமே ஏமாற்றத்திற்கு உட்படுவதையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் வேதவசனத்துக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘மேலும் மேலும் மோசமடைவார்கள்’ என்பது கிரேக்கத்தின் எதிர்மறையான முன்னேற்ற உருவகத்தை இயல்பான தமிழில் தருகிறது. முதன்மை உரையில் உள்ள [a], [b] குறிகள் முறையே தொடர்புடைய சொற்றொடர்களோடு இணைக்கப்பட்டுள்ளன.
