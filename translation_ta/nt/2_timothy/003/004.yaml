theological_decisions:
- issue: தீய பண்புகளின் பட்டியலில் உள்ள சொல்லிணைகளின் எதிர்மறை இணைப்பையும் உருவகத்தையும் பாதுகாத்தல்
  choice: ‘கடவுளை நேசிப்பதைவிட இன்பத்தை நேசிப்பவர்கள்’ என்ற இணையான அமைப்பையும், ‘தற்பெருமையால் வீங்கிப்போனவர்கள்’ என்ற உருவகத்தையும் வைத்திருத்தல்
  alternative: ‘இன்ப விரும்பிகள்; கடவுள் விரும்பிகள் அல்ல’ என்றும், ‘கர்வம் கொண்டவர்கள்’ என்றும் மொழிபெயர்த்தல்
  rationale: இது தொழில்நுட்பமான கோட்பாட்டு கூற்று அல்ல, ஒழுக்கப் பண்புகளின் விளக்கம். தேர்ந்தெடுக்கப்பட்ட மொழிபெயர்ப்பு கிரேக்கத்தின் சொல்லிணை ஒற்றுமையையும் வீங்குதல் என்ற உருவகத்தையும் காக்கிறது; அதேவேளையில் μᾶλλον ἢ என்பதைக் கட்டாயமான முழு விலக்கலாக மாற்றுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், தீய பண்புகளின் பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கொடுக்கப்பட்ட கிரேக்கத் துணுக்கு முந்தைய வசனத்திலிருந்து தொடரும் பட்டியலாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்புக் குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
