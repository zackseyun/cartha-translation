id: 2TI.3.12
reference: 2 Timothy 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: ta
  text: மேலும், மேசியாவாகிய இயேசுவுக்குள் இறைபக்தியுடன் வாழ விரும்புகிற அனைவரும் துன்புறுத்தலுக்கு உள்ளாவார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ... δὲ
  choice: ஆம்
  rationale: இரு இணைப்புச் சொற்களும் இங்கு கடுமையான எதிர்மறையை அல்ல, முந்தைய கூற்றைத் தொடர்ந்து உறுதிப்படுத்தும் வலியுறுத்தலைக் காட்டுகின்றன. நவீன தமிழில் “ஆம்” அந்தத் தொடர்ச்சியையும் உறுதிப்படுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάντες οἱ θέλοντες
  choice: வாழ விரும்புகிற அனைவரும்
  rationale: பெயர்ச்சொல் நிலையில் வரும் உருபுடனான பங்கேற்புவினையின் பொதுமையான, அனைவரையும் உள்ளடக்கும் பொருளையும் θέλω என்பதன் விருப்பப் பொருளையும் காக்கிறது.
- source_word: ζῆν εὐσεβῶς
  choice: இறைபக்தியுடன் வாழ
  rationale: εὐσεβῶς என்பது இறைவனை மதித்து, அவருக்கேற்ற பக்தியுள்ள முறையில் வாழ்வதைக் குறிக்கும் வினையடையாகும். “இறைபக்தியுடன்” என்பது இயல்பான, நவீன, சமய-ஒழுக்கப் பொருளைத் தக்கவைக்கும் சொல்.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவுக்குள்
  rationale: ἐν குறிக்கும் உறவு/வாழ்வின் தளத்தை “உள்ளே” என்ற உருவகத்துடன் காக்கிறது; Χριστός என்பதை இங்கு பட்டப்பெயராகக் கொண்டு “மேசியா” என மொழிபெயர்க்கிறது.
- source_word: διωχθήσονται
  choice: துன்புறுத்தப்படுவார்கள்
  rationale: διώκω என்பதன் பகைமையான பொருளையும் எதிர்காலச் செயப்பாட்டு வடிவத்தையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: Χριστῷ என்பது பட்டப்பெயரா அல்லது பெயரைப் போன்ற மரபுவடிவமா
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இந்தச் சூழலில் Χριστός என்பதன் அபிஷேகம் பெற்றவர்/மேசியா என்ற பட்டப்பெயர்ப் பொருள் தெளிவாக உள்ளது. “மேசியாவாகிய” என்பது தமிழில் இயல்பாகவும் பட்டப்பெயரின் பொருளை வெளிப்படையாகவும் தருகிறது; பரிச்சயமான “கிறிஸ்து” வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν Χριστῷ Ἰησοῦ என்பதிலுள்ள ἐν-ன் உறவுப்பொருள்
  choice: மேசியாவாகிய இயேசுவுக்குள்
  alternative: மேசியாவாகிய இயேசுவோடு ஒன்றிணைந்து
  rationale: “ஒன்றிணைந்து” என்பது சாத்தியமான விளக்கம் என்றாலும், மூலத்தின் இடவுருவகத்தையும் அதன் பரந்த உறவுப்பொருள் சார்ந்த தெளிவின்மையையும் “உக்குள்” அதிகமாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. “தேவபக்தியாய்” போன்ற பழைய நடைக்கு மாற்றாக “இறைபக்தியுடன்” பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் உறுதியான எதிர்காலக் கூற்று மென்மைப்படுத்தப்படவில்லை.
