revisions:
- from: ஆம், மேசியாவாகிய இயேசுவுக்குள்[a] இறைபக்தியுடன் வாழ விரும்புகிற அனைவரும் துன்புறுத்தப்படுவார்கள்.
  to: மேலும், மேசியாவாகிய இயேசுவுக்குள் இறைபக்தியுடன் வாழ விரும்புகிற அனைவரும் துன்புறுத்தலுக்கு உள்ளாவார்கள்.
  rationale: The revision preserves the source's scope, future certainty, and relational wording while using a Tamil expression that specifically communicates persecution. The introductory connective is also made more idiomatic and faithful to the mild connective force of καὶ ... δέ. The existing alternative-rendering footnote remains appropriate.
  reviewer_model: gpt-5.6-terra
