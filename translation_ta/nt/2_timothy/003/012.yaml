  revision_rationale: The revision preserves the source's scope, future certainty, and relational wording while using a Tamil expression that specifically communicates persecution. The introductory connective is also made more idiomatic and faithful to the mild connective force of καὶ ... δέ. The existing alternative-rendering footnote remains appropriate.
