  source_fidelity: மூலக் கிரேக்கத்தின் ஆறு பன்மை பெயரடைகளும் வரிசையுடனும் பொருளுடனும் துல்லியமாகக் கொடுக்கப்பட்டுள்ளன. “இயல்பான குடும்பப் பாசம் இல்லாதவர்கள்” ἄστοργοι என்பதிலுள்ள குடும்ப/நெருங்கிய உறவுப் பாச நுணுக்கத்தைப் பாதுகாக்கிறது. “சமரசத்திற்கு இணங்காதவர்கள்” ἄσπονδοι என்பதன் சமாதானத்துக்கு வர விரும்பாமை என்ற பொருளைச் சரியாகத் தருகிறது. διάβολοι மனிதரைப் பற்றிய ‘அவதூறு பேசுகிறவர்கள்’ எனவே மொழிபெயர்க்கப்பட்டுள்ளது; இது இச்சூழலில் சரியானது. மீதமுள்ள சொற்களும் மூலத்தின் வலிமையையும் பட்டியல் அமைப்பையும் காக்கின்றன.
  naturalness: நவீன நிலையான தமிழில் வாசிப்பு இயல்பாகவும், தீய பண்புகளின் தொடர்ச்சிப் பட்டியலுக்கு ஏற்ற இணையான அமைப்புடனும் உள்ளது. ஒவ்வொரு கூறிலும் “-வர்கள்” அமைப்பைப் பயன்படுத்துவது தெளிவாக உள்ளது. இறுதிக் காற்புள்ளி, வசனம் அடுத்த தொடருடன் இலக்கண ரீதியாக இணைவதைச் சுட்டுகிறது.
  terminology: “தன்னடக்கம் இல்லாதவர்கள்,” “கொடூரமானவர்கள்,” மற்றும் “நன்மையை நேசிக்காதவர்கள்” ஆகியவை தெளிவான, அளவோடு அமைந்த தேர்வுகள். “நன்மையை வெறுக்கிறவர்கள்” என்பதை முதன்மை உரையில் ஏற்காமல் அடிக்குறிப்பு மாற்றாக வைத்திருப்பது ἀφιλάγαθοι என்பதன் மறுப்புப் பொருளை அளவுக்கு மீறாமல் காக்கிறது. διάβολοι பற்றிய அடிக்குறிப்பு, அதை பிசாசைக் குறிக்கும் சொலாகப் புரிந்துகொள்ளக் கூடாது என்பதைச் சரியாக விளக்குகிறது.
