base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/003.yaml
  text: without natural affection[a], irreconcilable, slanderous, without self-control, savage, without love for what is good[c][b],
translation:
  language: ta
  text: இயல்பான குடும்பப் பாசம் இல்லாதவர்கள், சமரசத்திற்கு இணங்காதவர்கள்[a], அவதூறு பேசுகிறவர்கள்[b], தன்னடக்கம் இல்லாதவர்கள், கொடூரமானவர்கள், நன்மையை நேசிக்காதவர்கள்[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமாதானப்படுத்த முடியாதவர்கள்”; அல்லது, “உடன்பாட்டை மீறுகிறவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள கிரேக்கச் சொல் “அவதூறு பேசுகிறவர்கள்” அல்லது “பொய்க் குற்றஞ்சாட்டுகிறவர்கள்” என்று பொருள்படும்; இது பிசாசைக் குறிப்பிடவில்லை.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நன்மையை வெறுக்கிறவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: இயல்பான குடும்பப் பாசம் இல்லாதவர்கள்
  rationale: στοργή குறிக்கும், குறிப்பாகக் குடும்பத்தினரிடமும் நெருங்கிய உறவினரிடமும் இயல்பாக எதிர்பார்க்கப்படும் பாசமின்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἄσπονδοι
  choice: சமரசத்திற்கு இணங்காதவர்கள்
  rationale: சமாதான உடன்பாட்டை ஏற்கவோ பேணவோ மனமில்லாத தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ஏற்கெனவே செய்த உடன்பாட்டை முறிப்பது என்ற பொருளுக்கு மட்டும் இதைக் கட்டுப்படுத்தவில்லை.
- source_word: διάβολοι
  choice: அவதூறு பேசுகிறவர்கள்
  rationale: தீய நோக்குடன் பிறர்மீது குற்றஞ்சாட்டி அவதூறு பேசுவோரைக் குறிக்கும் பன்மைச் சொல் இது; இச்சூழலில் பிசாசைக் குறிக்கும் பட்டப்பெயர் அல்ல.
- source_word: ἀκρατεῖς
  choice: தன்னடக்கம் இல்லாதவர்கள்
  rationale: ஆசைகளையும் உந்துதல்களையும் கட்டுப்படுத்த இயலாத தன்மையைத் தெளிவாகவும் பொதுவாகப் புரியும் தமிழிலும் தருகிறது.
- source_word: ἀνήμεροι
  choice: கொடூரமானவர்கள்
  rationale: அடங்காத, இரக்கமற்ற, மிருகத்தனமான நடத்தையைச் சுருக்கமாகவும் கண்ணியமான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: ἀφιλάγαθοι
  choice: நன்மையை நேசிக்காதவர்கள்
  rationale: நல்லவற்றின்மீது அன்பில்லாமையைச் சொல்லின் மறுப்புப் பொருளுக்கு நெருக்கமாகப் பாதுகாக்கிறது; செயலில் வெறுப்பதாக அளவுக்கு மீறி வலுப்படுத்தவில்லை.
theological_decisions:
- issue: தீமைகளின் பட்டியலில் διάβολοι என்பதன் பொருள்
  choice: பிசாசுகளைக் குறிக்காமல், அவதூறு பேசும் மனிதர்களைக் குறிக்கும் பொதுப் பெயரடைப் பொருள்
  alternative: பிசாசுகள்; பிசாசுத்தனமானவர்கள்
  rationale: இது பன்மை வடிவில் மற்ற மனிதத் தீய பண்புகளோடு வருவதால் நடத்தையைக் குறிக்கிறது. இதைப் ‘பிசாசுகள்’ என்று மொழிபெயர்த்தால் மனிதர்களின் ஒழுக்கப் பண்பை இருப்பியல் அடையாளமாக வாசிக்கச் செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், தீய பண்புகளின் தொடர்ச்சியான பட்டியல் வடிவம் பேணப்பட்டுள்ளது. ஒவ்வொரு கூறிலும் ‘வர்கள்’ பயன்படுத்தப்பட்டதால் வாசிப்புத் தெளிவும் இணையான அமைப்பும் கிடைக்கின்றன. வசனம் அடுத்த பகுதியுடன் தொடர்வதை உணர்த்த இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
