source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: ta
  text: துன்புறுத்தல்களையும், பாடுகளையும்—அந்தியோகியாவிலும் இக்கோனியாவிலும் லீஸ்திராவிலும் எனக்கு நேரிட்டவற்றையும்—நான் எத்தகைய துன்புறுத்தல்களைச் சகித்தேன்![a] அவை எல்லாவற்றிலிருந்தும் ஆண்டவர்[b] என்னை விடுவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் சகித்த துன்புறுத்தல்கள் எத்தகையவை!”
    reason: οἵους διωγμοὺς ὑπήνεγκα என்ற தொடரை வியப்புத் தொனியுடனோ பெயர்ச்சொல் மையமான பண்புசார் கூற்றாகவோ அமைக்க இயலும்.
  - marker: b
    text: இங்கு “ஆண்டவர்” என்பது ஆண்டவராகிய இயேசுவைக் குறிப்பதாக இருக்க வாய்ப்புள்ளது; எனினும் கிரேக்க மூலத்தில் “ஆண்டவர்” என்று மட்டுமே உள்ளது.
    reason: சுட்டப்படுபவரை மூல உரை பெயரிட்டு வெளிப்படையாகக் குறிப்பிடவில்லை.
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: துன்புறுத்தல்களையும் / துன்புறுத்தல்கள்
  rationale: ஒருவரின் நம்பிக்கை அல்லது பணியின் காரணமாக அவருக்கு எதிராக நிகழும் பகைமையான ஒடுக்குதலைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது கிரேக்கத்தின் மீளுரையைத் தக்கவைக்கிறது.
- source_word: παθήμασιν
  choice: பாடுகளையும்
  rationale: பலவகையான துன்ப அனுபவங்களை உள்ளடக்கும் அகன்ற பொருளை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: οἷά μοι ἐγένετο
  choice: எனக்கு நேரிட்டவற்றையும்
  rationale: முன்னர் குறிப்பிடப்பட்ட துன்புறுத்தல்களும் பாடுகளும் அந்த நகரங்களில் தனக்கு நிகழ்ந்தன என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: அந்தியோகியாவிலும் இக்கோனியாவிலும் லீஸ்திராவிலும்
  rationale: இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; ஒவ்வொரு பெயருடனும் இடப்பொருள் உருபை மீண்டும் வழங்குவது கிரேக்கத் தொடரின் ஓசையைக் காக்கிறது.
- source_word: οἵους διωγμοὺς
  choice: துன்புறுத்தல்கள் எத்தகையவை!
  rationale: οἵους என்பதிலுள்ள பண்புசார் வலியுறுத்தலையும் வியப்புத் தொனியையும் மிகையாக விரிவுபடுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: ὑπήνεγκα
  choice: நான் சகித்த
  rationale: அழுத்தத்தின் கீழ் தாங்கிக்கொண்டதைக் குறிக்கும் வினையின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐκ πάντων
  choice: அவை எல்லாவற்றிலிருந்தும்
  rationale: முன் குறிப்பிடப்பட்ட துன்புறுத்தல்களையும் பாடுகளையும் பின்னோக்கிச் சுட்டி, அவற்றிலிருந்து காப்பாற்றப்பட்டதைக் காட்டுகிறது.
- source_word: ἐρρύσατο
  choice: என்னைக் காப்பாற்றினார்
  rationale: ஆபத்திலிருந்து மீட்பது என்ற பொருளைத் தெளிவாகவும் பொதுமக்கள் புரியும் தமிழிலும் தருகிறது; இங்கு இல்லாத குறிப்பிட்ட மீட்பியல் நுண்பொருளைத் திணிக்கவில்லை.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்ற பட்டத்திற்கான இயல்பான வேதாகமத் தமிழ். மூலத்தில் இல்லாத ‘இயேசு’ என்ற பெயரை வசனத்தில் சேர்க்காமல் சுட்டப்படுபவரின் அடையாளத் திறப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்று குறிப்பிடப்படுபவர் யார்?
  choice: மூலத்தில் உள்ளபடியே ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘ஆண்டவர் இயேசு’
  rationale: பவுலின் பயன்பாட்டில் இது பெரும்பாலும் இயேசுவைக் குறிப்பதாக இருந்தாலும், இங்கு கிரேக்க உரை ὁ κύριος என்று மட்டுமே கூறுகிறது. ஆகவே மூலத்தில் இல்லாத பெயரைச் சேர்க்காமல் அதன் இயல்பான திறப்பை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளை கண்ணியமான நடை. வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால் தொடக்கத்தில் புதிய எழுவாய் அல்லது வினை சேர்க்கப்படவில்லை. நகரப் பெயர்களின் தொடரும் ‘துன்புறுத்தல்கள்’ என்ற மீளுரையும் மூலத்தின் அமைப்பை நெருக்கமாகப் பாதுகாக்கின்றன.
