  naturalness: ‘நான் சகித்த துன்புறுத்தல்கள் எத்தகையவை!’ என்பது இலக்கணத்தில் சாத்தியமானதாயினும், இச்சூழலின் வியப்புத் தொனியில் சற்றே செயற்கையாக ஒலிக்கிறது. நேரடி வினை அமைப்பு நவீன நிலையான தமிழில் இயல்பானது. மற்ற நடை மற்றும் இடப்பெயர் ஒலிபெயர்ப்புகள் ஏற்றவை.
