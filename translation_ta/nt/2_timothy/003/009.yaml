revisions:
- from: ஆனால், அவர்கள் அதற்குமேல் முன்னேற மாட்டார்கள்[a]. ஏனெனில், அவர்களுடைய மதியீனம் எல்லாருக்கும் வெளிப்படையாகும்; அந்த மனிதர்களுடைய மதியீனமும் அப்படியே வெளிப்பட்டது[b].
  to: ஆனால் அவர்கள் மேலும் முன்னேற மாட்டார்கள்[a]; ஏனெனில், அந்த மனிதர்களுடைய மதியீனம் வெளிப்பட்டதுபோல, இவர்களுடைய மதியீனமும் எல்லாருக்கும் வெளிப்படையாகும்[b].
  rationale: The revision replaces the context-dependent “அதற்குமேல்” with “மேலும்” and restructures the final comparison so that the prior manifestation of Jannes and Jambres’s folly is explicitly the model for the present opponents’ exposure. It retains the source’s future prediction, universal scope (“எல்லாருக்கும்”), and comparative force, while keeping the names confined to the footnote.
