id: 2TI.3.9
reference: 2 Timothy 3:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: ta
  text: ஆனால் அவர்கள் மேலும் முன்னேற மாட்டார்கள்[a]; ஏனெனில், அந்த மனிதர்களுடைய மதியீனம் வெளிப்பட்டதுபோல, இவர்களுடைய மதியீனமும் எல்லாருக்கும் வெளிப்படையாகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் மேலும் முன்னேற்றம் அடைய மாட்டார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட யன்னே, யம்பிரே ஆகியோருடைய மதியீனம்.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: முன்னேற மாட்டார்கள்
  rationale: προκόπτω என்பதன் முன்னேறுதல் அல்லது தொடர்ந்து செல்வது என்ற உருவகப் பொருளைப் பேணுகிறது; இங்கு குறிப்பிடப்படுவோரின் செயல் மேலும் பரவாது என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐπὶ πλεῖον
  choice: அதற்குமேல்
  rationale: ‘மேலும்’ அல்லது ‘இன்னும் அதிகமாக’ என்ற கிரேக்கத் தொடரின் பொருளை மறுப்புடன் இணைத்து இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄνοια
  choice: மதியீனம்
  rationale: அறிவுணர்வின்மை, புத்தியின்மை, மூடத்தனம் ஆகியவற்றை உள்ளடக்கும் ἄνοια என்பதன் அறிவுசார்-ஒழுக்கச் சாயலை dignified modern Tamil-ல் தருகிறது.
- source_word: ἔκδηλος
  choice: வெளிப்படையாகும்
  rationale: மறைந்திருந்தது தெளிவாக அறியப்படும் என்ற ‘evident/manifest’ பொருளை இயல்பாகக் கூறுகிறது.
- source_word: πᾶσιν
  choice: எல்லாருக்கும்
  rationale: தத்திவ் பன்மையின் பரந்த நோக்கை நேரடியான, வழக்கமான தமிழில் காட்டுகிறது.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: அந்த மனிதர்களுடைய மதியீனமும் அப்படியே வெளிப்பட்டது
  rationale: ἡ என்பது முன்சொல்லான ‘மதியீனம்’ என்பதைக் குறிக்கும் நீக்கவாக்கிய அமைப்பைத் தமிழில் தெளிவாக்குகிறது; ἐκείνων என்பதை முந்தைய வசனத்தில் உள்ளவர்களோடு இணைக்கிறது; καί-ஐ ‘-உம்’ மூலம் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ἐκείνων என்பதன் சுட்டுப்பொருள்
  choice: ‘அந்த மனிதர்கள்’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட யன்னேயையும் யம்பிரேயையும் சுட்டுகிறது.
  alternative: முன்னிருந்த பொய்ப் போதகர்களை பொதுவாகச் சுட்டுகிறது.
  rationale: உடனடி சூழலில் 3:8 யன்னே, யம்பிரே ஆகியோரைச் சொல்வதால் இந்தப் பின்னோக்கிய சுட்டு அவர்களையே இயல்பாகக் குறிக்கிறது. முதன்மை உரையில் பெயர்களைச் சேர்க்காமல் ‘அந்த மனிதர்கள்’ என வைத்துப் பொருளின் சுட்டுத்தன்மை பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘முன்னேற’ என்பது மூலத்தின் முன்னேற்ற உருவகத்தையும் அதன் சூழல்சார் எதிர்மறைத் தன்மையையும் பேணுகிறது. அனைத்து அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
