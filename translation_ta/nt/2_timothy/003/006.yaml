source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: ta
  text: ஏனெனில், இவர்களில் சிலர் வீடுகளுக்குள் ஊடுருவி, பாவங்களால் சுமைப்பட்டு[c], பலவகையான ஆசைகளால் இழுத்துச் செல்லப்படுகிற பலவீனமான பெண்களை[b]ச் சிறைப்பிடிக்கிறார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறைப்பிடிக்கிறார்கள்’ என்பதற்கான கிரேக்க வினைச்சொல், போரில் கைதிகளைக் கைப்பற்றும் உருவகத்தைக் கொண்டுள்ளது; இங்கு அவர்களைத் தங்கள் கட்டுப்பாட்டுக்குள் கொண்டுவருவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பலவீனமான பெண்கள்’ என்பதற்கான கிரேக்கச் சொல் சொல்லுக்குச் சொல் ‘சிறு பெண்கள்’ எனப் பொருள்படும், சிறுமைப்படுத்தும் இழிவுணர்வுள்ள வடிவம். இச்சூழலில் அது பெண்கள் அனைவரையும் அல்ல, எளிதில் இரையாகும் பெண்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பாவங்களால் பாரமேற்றப்பட்டு.’ குவிந்து கிடக்கும் பாவங்களின் பாரத்தை கிரேக்கச் சொல் உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: இவர்களில் சிலர்
  rationale: முன்பு விவரிக்கப்பட்டவர்களின் கூட்டத்தைச் சேர்ந்த சிலரை இது குறிக்கிறது. தமிழில் இயல்பான வாக்கிய அமைப்புக்காக ‘சிலர்’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: வீடுகளுக்குள் நைசாக நுழைந்து
  rationale: ἐνδύνοντες என்பதில் மறைவாக அல்லது சூழ்ச்சியாக உள்ளே நுழையும் இழிவு நயம் உள்ளது; ‘நைசாக நுழைந்து’ அதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: αἰχμαλωτίζοντες
  choice: சிறைப்பிடிக்கிறார்கள்
  rationale: போரில் ஒருவரைச் சிறைபிடிக்கும் அடிப்படை உருவகத்தையும், அவர்களைத் தங்கள் கட்டுப்பாட்டுக்குள் கொண்டுவரும் கருத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: γυναικάρια
  choice: பலவீனமான பெண்கள்
  rationale: இது γυνή என்பதன் இழிவுணர்வுள்ள சிறுமைப்படுத்தும் வடிவம். இச்சூழலில் எல்லாப் பெண்களையும் அல்ல, எளிதில் இரையாகும் ஒரு குறிப்பிட்ட பிரிவினரைக் குறிக்கிறது; ‘பலவீனமான பெண்கள்’ அந்தச் சூழல்சார் கருத்தைத் தெரிவிக்கிறது.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: பாவங்களால் சுமையுண்டு
  rationale: குவிந்த பாவங்களின் பாரம் தொடர்ந்து இருப்பதை நிறைவேற்றப்பட்ட செயப்பாட்டு வினையெச்சம் காட்டுகிறது; ‘சுமையுண்டு’ அந்தப் பார உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἀγόμενα
  choice: இழுத்துச் செல்லப்படுகிற
  rationale: வெளிப்புறத் தாக்கத்தால் வழிநடத்தப்படுதல் அல்லது கொண்டுசெல்லப்படுதல் என்ற செயப்பாட்டு நயத்தை இது தெளிவாகக் காட்டுகிறது.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: பலவகையான ஆசைகளால்
  rationale: ποικίλαις என்பதன் பலவகைத் தன்மையையும், ἐπιθυμίαις என்பதன் பரந்த ஆனால் இங்கு எதிர்மறையான ஆசை அல்லது வேட்கை உணர்வையும் எளிய தமிழில் தருகிறது.
theological_decisions:
- issue: γυναικάρια என்ற இழிவுணர்வுள்ள குறிப்பு
  choice: பலவீனமான பெண்கள்
  alternative: அற்பப் பெண்கள்; சிறுபெண்கள்; எளிதில் ஏமாறும் பெண்கள்
  rationale: மூலச்சொல்லின் கண்டன நயத்தை முற்றிலும் மறைக்காமல், அது பெண்கள் அனைவரைப் பற்றிய பொதுக்கூற்று எனத் தோன்றாதவாறு, இச்சூழலில் பொய்ப் போதகர்களுக்கு இரையாகும் குறிப்பிட்ட பெண்களின் பாதிப்புக்குள்ளாகும் நிலையைக் காட்டுகிறது. சொல்லின் சிறுமைப்படுத்தும் வடிவம் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
- issue: οἰκίας என்பதன் குடும்பச் சூழல்
  choice: வீடுகளுக்குள்
  alternative: குடும்பங்களுக்குள்; இல்லங்களுக்குள்
  rationale: மூலத்தின் இடவியல் பொருளை நேரடியாகப் பாதுகாக்கிறது; அதேவேளை இந்தச் சூழலில் வீட்டு வட்டாரத்திற்குள் ஊடுருவுவதை வாசகர் இயல்பாகப் புரிந்துகொள்ள முடியும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கண்டன நயமும் சமநிலைப்படுத்தப்பட்டுள்ளன. ‘நைசாக நுழைந்து’ என்பது மறைவான ஊடுருவலை இயல்பாகச் சொல்கிறது; ‘சிறைப்பிடிக்கிறார்கள்’ மூலத்தின் வலுவான உருவகத்தைப் பாதுகாக்கிறது. γυναικάρια-வின் கடினமான இழிவுணர்வு, பொதுவான பெண்விரோதக் கூற்றாக மாற்றப்படாமல் முதன்மை உரையிலும் அடிக்குறிப்பிலும் விளக்கப்பட்டுள்ளது.
