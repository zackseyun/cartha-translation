id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: ta
  text: நீயோ என் போதனை, வாழ்க்கைமுறை, நோக்கம், விசுவாசம்[a], நீடிய பொறுமை, அன்பு, தாங்கி நிற்கும் உறுதி ஆகியவற்றை உன்னிப்பாகப் பின்பற்றியிருக்கிறாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மைத்தன்மை.” இச்சூழலில் கிரேக்கச் சொல் “விசுவாசம்” அல்லது “உண்மைத்தன்மை” என்ற இரு பொருள்களிலும் அமையலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: நீயோ
  rationale: வலியுறுத்தப்பட்ட Σὺ என்பதையும், முந்தைய வசனங்களில் விவரிக்கப்பட்டவர்களுடன் δέ ஏற்படுத்தும் முரண்பாட்டையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: παρηκολούθησάς
  choice: உன்னிப்பாகப் பின்பற்றியிருக்கிறாய்
  rationale: παρακολουθέω இங்கு கூர்ந்து கவனித்து அறிந்திருப்பதையும் அதன்படி பின்பற்றுவதையும் குறிக்கலாம்; இத்தமிழாக்கம் இரு நுணுக்கங்களையும் இயன்றவரை தக்கவைக்கிறது.
- source_word: μου
  choice: என்
  rationale: தொடர்ந்து வரும் போதனை, வாழ்க்கைமுறை முதலிய அனைத்தையும் பவுலுக்குரியவையாக இயல்பாக இணைக்கிறது.
- source_word: διδασκαλίᾳ
  choice: போதனை
  rationale: திருச்சபைச் சூழலிலும் பொதுவழக்கிலும் புரியக்கூடிய, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἀγωγῇ
  choice: வாழ்க்கைமுறை
  rationale: ஒருவரின் நடத்தை மட்டுமல்லாமல் அவரது வாழும் விதத்தையும் குறிக்கும் ἀγωγή என்பதன் பரப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: προθέσει
  choice: நோக்கம்
  rationale: பவுலின் உறுதியான குறிக்கோள் அல்லது வாழ்வின் நோக்கம் என்ற பொருளை இயல்பாக வழங்குகிறது.
- source_word: πίστει
  choice: விசுவாசம்
  rationale: πίστις என்பதற்கான முதன்மையான இறையியல் சார்பற்ற மொழிபெயர்ப்பு; இங்கு ‘உண்மைத்தன்மை’ என்பதும் சாத்தியமாதலால் அதை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: μακροθυμίᾳ
  choice: நீடிய பொறுமை
  rationale: தூண்டுதல் அல்லது எதிர்ப்பின் மத்தியிலும் நீண்ட காலம் பொறுமையுடன் இருப்பதை வலியுறுத்தி, ὑπομονή என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: ἀγάπῃ
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான தெளிவான, இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் நவீனத் தமிழ் இணைச்சொல்.
- source_word: ὑπομονῇ
  choice: தாங்கி நிற்கும் உறுதி
  rationale: சோதனைகளின் கீழ் விட்டுவிடாமல் நிலைத்திருக்கும் பண்பை வெளிப்படுத்தி, ஏற்கெனவே வந்த μακροθυμία என்ற பொறுமையிலிருந்து வேறுபடுத்துகிறது.
theological_decisions:
- issue: பவுலின் பண்புகளின் பட்டியலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: உண்மைத்தன்மை
  rationale: இந்தச் சூழலில் கடவுள்மீதான விசுவாசம் அல்லது நம்பிக்கை என்றும், நம்பகமாக உண்மையுடன் இருத்தல் என்றும் பொருள் கொள்ள வாய்ப்புள்ளது. முதன்மைப் பொருளை உரையில் வைத்து, உண்மையான இரட்டைப் பொருள் வாய்ப்பை அடிக்குறிப்பில் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடியதாயும் திருவிவிலிய உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. பட்டியலின் ஓட்டம் இயல்பாக இருக்க ‘ஆகியவற்றை’ சேர்க்கப்பட்டுள்ளது; மூலத்தின் வலியுறுத்தலும் முரண்பாடும் ‘நீயோ’ என்பதால் பாதுகாக்கப்பட்டுள்ளன.
