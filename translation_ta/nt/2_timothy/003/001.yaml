  text: Τοῦτο δὲ γίνωσκε ὅτι ἐν ἐσχάταις ἡμέραις ἐνστήσονται καιροὶ χαλεποί·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: ta
  text: 'ஆனால் இதை அறிந்துகொள்: கடைசி நாட்களில் கடினமான காலங்கள் வரும்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘ஆபத்தான காலங்கள்’ அல்லது ‘தாங்குவதற்குக் கடினமான காலங்கள்.’ கிரேக்கப் பெயரடை கடினமான, ஆபத்தான அல்லது துயரமிக்க காலங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: இதை
  rationale: அடுத்து ὅτι மூலம் கூறப்படும் கருத்தை முன்னோக்கிச் சுட்டும் நடுநிலைச் சுட்டுப்பெயர்; தமிழில் ‘இதை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய சூழலிலிருந்து மென்மையான மாறுபாட்டை அல்லது கருத்து நகர்வைக் குறிக்கிறது; ‘ஆனால்’ அந்த எதிர்மறைத் திருப்பைப் பாதுகாக்கிறது.
- source_word: γίνωσκε
  choice: அறிந்துகொள்
  rationale: நிகழ்காலச் செயப்பாட்டு ஏவல், இரண்டாம் நபர் ஒருமை. தீமோத்தேயு இதைத் தெளிவாக உணர்ந்து மனத்தில் கொள்ள வேண்டும் என்ற அறிவுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: ὅτι
  choice: ':'
  rationale: அறிய வேண்டிய உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘இதை அறிந்துகொள்:’ என்ற முக்காற்புள்ளி அமைப்பு இயல்பாக அதே தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: கடைசி நாட்களில்
  rationale: இறுதிக்காலப் பொருள் கொண்ட நிலையான சொற்றொடரை அதன் காலவரம்பை மேலதிகமாக வரையறுக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐνστήσονται
  choice: வரும்
  rationale: எதிர்கால நடுவினை வடிவம் இங்கு ‘வந்துசேரும்’ அல்லது ‘நிகழ்வுக்கு வரும்’ என்ற பொருள் தருகிறது; காலங்களைப் பற்றி தமிழில் ‘வரும்’ என்பது இயல்பானது.
- source_word: καιροὶ
  choice: காலங்கள்
  rationale: வெறும் தொடர்காலத்தைக் காட்டிலும் குறிப்பிட்ட காலப்பகுதிகள் அல்லது சூழ்நிலைக் காலங்களைக் குறிக்கிறது; ‘காலங்கள்’ பொருளை இயல்பாகத் தருகிறது.
- source_word: χαλεποί
  choice: கடினமான
  rationale: χαλεπός என்பது சமாளிக்கக் கடினமான, ஆபத்தான, கொடிய அல்லது துயரமிக்க தன்மையைக் குறிக்கலாம். ‘கடினமான’ அதன் பரந்த அடிப்படைப் பொருளை நவீன தமிழில் தெளிவாக வழங்குகிறது; பிற நிழற்பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: ‘கடைசி நாட்கள்’ என்பதன் காலவரம்பு
  choice: ‘கடைசி நாட்களில்’ என்ற இறுதிக்காலச் சொற்றொடரை அப்படியே வைத்து, அதை கிறிஸ்துவின் வருகைக்கு உடனடியாக முந்திய குறுகிய காலமாக மட்டும் வரையறுக்கவில்லை.
  alternative: முடிவுக்கு முந்திய இறுதிக் காலப்பகுதி; அல்லது புதிய ஏற்பாட்டில் ஏற்கெனவே தொடங்கிய விரிந்த இறுதிக்காலம்.
  rationale: இச்சொற்றொடர் இரு விதமான இறுதிக்காலப் புரிதல்களுக்கும் இடமளிக்கிறது. குறிப்பிட்ட ஓர் இறுதிக்கால அமைப்பை மொழிபெயர்ப்பில் புகுத்தாமல், மூலத்தின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ஒருமை ஏவலை ‘அறிந்துகொள்’ என்று பாதுகாத்து, இறுதிக்காலச் சொற்றொடரின் விளக்கத் திறப்பைச் சுருக்காமல் வைத்துள்ளது.
