source:
  edition: SBLGNT
  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: ta
  text: ஒவ்வொரு வேதவாக்கியமும்[a] கடவுளால் மூச்சூட்டப்பட்டது; அது போதிப்பதற்கும், தவறைச் சுட்டிக்காட்டுவதற்கும், திருத்துவதற்கும், நீதியான[c] வாழ்வில் பயிற்றுவிப்பதற்கும் பயனுள்ளது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேதவாக்கியங்கள் அனைத்தும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க πᾶσα γραφή என்பதை ஒவ்வொரு வேதவாக்கியத்தையும் தனித்தனியாகக் குறிப்பதாகவோ, வேதவாக்கியங்கள் முழுவதையும் ஒன்றாகக் குறிப்பதாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘கடவுளால் மூச்சூட்டப்பட்ட ஒவ்வொரு வேதவாக்கியமும் போதிப்பதற்கும், தவறைச் சுட்டிக்காட்டுவதற்கும், திருத்துவதற்கும், நீதியான வாழ்வில் பயிற்றுவிப்பதற்கும் பயனுள்ளது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘நீதி’ என்பதற்கு சில பவுலின் சூழல்களில் ‘நியாயம்’ என்றும் பொருள் கொள்ளலாம்; இங்கு நேர்மையான வாழ்வில் ஒருவரை உருவாக்குவதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: ஒவ்வொரு வேதவாக்கியமும்
  rationale: πᾶσα என்பதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொரு’ நேரடியாகக் காட்டுகிறது. இச்சூழலில் γραφή பொதுவான எந்த எழுத்தையும் அல்ல, புனித வேதவாக்கியத்தைக் குறிக்கிறது. இதை ‘வேதவாக்கியங்கள் அனைத்தும்’ என்றும் புரிந்துகொள்ள முடியும் என்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: θεόπνευστος
  choice: கடவுளால் மூச்சூட்டப்பட்டது
  rationale: இக்கூட்டுச்சொல்லின் ‘கடவுள்’ மற்றும் ‘மூச்சு’ ஆகிய கூறுகளைத் தெளிவாக வைத்திருந்து, பிற்கால வேதஉந்துதல் கோட்பாடுகளை மொழிபெயர்ப்புக்குள் கொண்டு வராமல் அதன் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ὠφέλιμος
  choice: பயனுள்ளது
  rationale: கீழ்வரும் நான்கு நோக்கங்களுக்கும் உதவிகரமாகவும் நன்மை தருவதாகவும் இருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πρὸς διδασκαλίαν
  choice: போதிப்பதற்கு
  rationale: διδασκαλία என்பதிலுள்ள கற்பிக்கும் செயல் மற்றும் அறிவுறுத்தும் உள்ளடக்கம் இரண்டையும் எளிய, மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐλεγμόν
  choice: தவறைச் சுட்டிக்காட்டுவதற்கு
  rationale: தவறு அல்லது குற்றத்தை வெளிச்சத்துக்குக் கொண்டுவந்து உணர்த்தும் பொருளைத் தெரிவிக்கிறது; ‘கண்டிப்பதற்கு’ என்பதைக் காட்டிலும் இது தனிப்பட்ட வாய்மொழிக் கடிந்துகொள்ளலாகப் பொருளைச் சுருக்குவதில்லை.
- source_word: ἐπανόρθωσιν
  choice: திருத்துவதற்கு
  rationale: தவறானதை மீண்டும் சரியான நிலைக்குக் கொண்டுவருதல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: நீதியான வாழ்வில் பயிற்றுவிப்பதற்கு
  rationale: παιδεία குறிக்கும் தொடர்ச்சியான உருவாக்கம், பயிற்சி, ஒழுக்கக் கல்வி ஆகியவற்றை ‘பயிற்றுவித்தல்’ எடுத்துரைக்கிறது. இங்கு δικαιοσύνη நேர்மையான வாழ்வியல் உருவாக்கத்தைக் குறிப்பதால், தமிழில் இயல்புக்காக ‘வாழ்வில்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: δικαιοσύνῃ
  choice: நீதியான
  rationale: இச்சூழலில் ஒழுக்க நேர்மையும் செம்மையான வாழ்வும் முதன்மை. ‘நியாயம்’ என்ற தொடர்புடைய பொருள் சாத்தியமுள்ளதாயினும், இவ்வசனத்தில் அது குறைவாகப் பொருந்துவதால் அடிக்குறிப்பில் மட்டும் தரப்படுகிறது.
theological_decisions:
- issue: θεόπνευστος மற்றும் ὠφέλιμος ஆகிய இரண்டும் πᾶσα γραφή என்பதோடு கொண்டுள்ள தொடரியல் உறவு
  choice: ‘ஒவ்வொரு வேதவாக்கியமும் கடவுளால் மூச்சூட்டப்பட்டது; அது … பயனுள்ளது’ என்று இரு பெயரடைகளும் பயனிலைப் பொருளில் எடுக்கப்பட்டுள்ளன.
  alternative: ‘கடவுளால் மூச்சூட்டப்பட்ட ஒவ்வொரு வேதவாக்கியமும் … பயனுள்ளது.’
  rationale: இரு பெயரடைகளையும் இணையான பயனிலைகளாகக் கொள்வது தொடரின் ஓட்டத்திற்கும் அடுத்த வசனத்திற்கும் இயல்பாகப் பொருந்துகிறது. ஆனால் θεόπνευστος என்பதை அடைமொழியாகக் கொள்ளும் மாற்று தொடரியல் இலக்கணப்படி சாத்தியமானது; ஆகவே அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘வேதவாக்கியம்’, ‘போதித்தல்’, ‘திருத்துதல்’ போன்ற பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டன. θεόπνευστος என்பதன் மூச்சு உருவகத்தை மறைக்காமல் இருக்க ‘கடவுளால் மூச்சூட்டப்பட்டது’ தேர்ந்தெடுக்கப்பட்டது; இலக்கணத் தெளிவின்மைகள் அடிக்குறிப்புகளில் வைக்கப்பட்டன.
