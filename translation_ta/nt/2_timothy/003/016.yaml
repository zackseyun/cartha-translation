  terminology: “வேதவாக்கியம்,” “போதித்தல்,” “தவறைச் சுட்டிக்காட்டுதல்,” “திருத்துதல்,” and “பயிற்றுவித்தல்” are appropriate and distinguish the four stated functions well. “நீதியான வாழ்வு” properly reflects the moral-formative contextual force of δικαιοσύνη without excluding the lexical alternative documented in footnote c. The footnote anchors and their content correspond to the relevant textual issues.
