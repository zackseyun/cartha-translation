translation:
  language: ta
  text: தேவனுடைய மனிதர்[a] முழுத் தகுதி பெற்றவராகவும், ஒவ்வொரு நற்செயலுக்கும் முற்றிலும் ஆயத்தப்படுத்தப்பட்டவராகவும்[b] இருப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேவனுடைய மனிதர்” என்பது கிரேக்கத்தில் ஆண்பால் ஒருமையில் உள்ள, வேதாகமத்தில் அறியப்பட்ட ஓர் அடையாளச் சொல். இச்சூழலில் இது குறிப்பாக தேவ ஊழியரைக் குறிக்கக்கூடும்; வேதவசனத்தால் உருவாக்கப்படும் விசுவாசிகளுக்கும் இது விரிவாகப் பொருந்தலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “முழுமையாக ஆயத்தப்படுத்தப்பட்டவராக.” ἐξηρτισμένος என்ற சொல் முற்றிலும் தயாராக்கப்பட்ட அல்லது தேவையானவற்றால் பொருத்தப்பட்ட நிலையை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: இருப்பதற்காக
  rationale: முந்தைய வசனத்தின் கருத்திலிருந்து தொடரும் நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄρτιος
  choice: முழுத் தகுதியுள்ளவர்
  rationale: பணி செய்வதற்குத் தேவையான நிறைவும் தகுதியும் உடையவர் என்ற பொருளைக் காட்டுகிறது; பாவமற்ற பரிபூரணத்தைக் குறிக்கும் தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: தேவனுடைய மனிதர்
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமையையும், வேதாகமத்தில் அறியப்பட்ட அடையாளச் சொல்லையும் தக்கவைக்கிறது.
- source_word: πρὸς πᾶν ἔργον ἀγαθόν
  choice: ஒவ்வொரு நற்செயலுக்கும்
  rationale: πᾶν என்பதன் ஒவ்வொன்றையும் உள்ளடக்கும் வலிமையையும் ἀγαθόν என்பதன் அறநலப் பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐξηρτισμένος
  choice: முற்றிலும் ஆயத்தப்படுத்தப்பட்டவர்
  rationale: முழுமையாகத் தயாராக்கப்பட்ட அல்லது தேவையானவற்றால் பொருத்தப்பட்ட நிலையைச் சுட்டும் நிறைவேற்றப்பட்ட செயப்பாட்டு வினையெச்சத்தின் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ὁ τοῦ θεοῦ ἄνθρωπος என்பதிலுள்ள பாலினம் சார்ந்த ஒருமை
  choice: தேவனுடைய மனிதர்
  alternative: தேவனுக்குரியவர்
  rationale: இது கிரேக்கத்தில் ஆண்பால் ஒருமையாகவும், வேதாகமத்தில் நிலைபெற்ற அடையாளச் சொல்லாகவும் உள்ளது. சூழலில் முதன்மையாக தேவ ஊழியரைக் குறிக்கக்கூடும்; வேதவசனத்தால் உருவாக்கப்படும் விசுவாசிக்கும் விரிந்த பயன்பாடு இருக்கலாம். அந்த விரிவை முதன்மை உரையில் பாலினநடுநிலையாக்காமல் குறிப்பில் விளக்குகிறது.
- issue: ἄρτιος என்பதன் நிறைவு
  choice: முழுத் தகுதியுள்ளவர்
  alternative: முழுமையானவர்
  rationale: இந்தச் சொல் பணிக்குத் தகுந்த நிறைவைச் சுட்டுகிறது; பாவமற்ற பரிபூரண நிலை என்ற கோட்பாட்டுச் சார்ந்த மிகைப்படுத்தலைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. “தேவனுடைய மனிதர்” என்ற வேதாகம அடையாளச் சொல் தக்கவைக்கப்பட்டுள்ளது. “முழுத் தகுதியுள்ளவர்” மற்றும் “முற்றிலும் ஆயத்தப்படுத்தப்பட்டவர்” ஆகியவை ஒன்றுக்கொன்று தொடர்புடைய இரு கிரேக்கச் சொற்களின் வேறுபாட்டைக் காத்து, தேவையற்ற மறுபதிப்பைத் தவிர்க்கின்றன.
