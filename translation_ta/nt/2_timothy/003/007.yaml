  text: πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/007.yaml
  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: ta
  text: எப்போதும் கற்றுக்கொண்டே இருப்பவர்களாகவும், சத்தியத்தைப் பற்றிய அறிவை[a] ஒருபோதும் அடைய முடியாதவர்களாகவும் இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சத்தியத்தைப் பற்றிய முழுமையான அறிவை.” கிரேக்கச் சொல் இன்னும் நிறைவான அல்லது முழுமையான அறிவு என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ந்து நிகழும் செயலைக் குறிக்கும் வினையடை; μηδέποτε என்பதோடு உள்ள வலுவான முரண்பாட்டையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: μανθάνοντα
  choice: கற்றுக்கொண்டிருந்தும்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான கற்றலை வெளிப்படுத்துகிறது; அடுத்த எதிர்மறைக் கூற்றுடன் உள்ள விட்டுக்கொடுப்பு சார்ந்த தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: μηδέποτε
  choice: ஒருபோதும்
  rationale: πάντοτε என்பதற்கு எதிராக நிற்கும் வலுவான கால மறுப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰς ἐπίγνωσιν
  choice: அறிவை ... அடைய
  rationale: εἰς மற்றும் ἐλθεῖν இணைந்து அறிவை நோக்கிச் சென்று அதை அடையும் உருவகத்தைத் தருகின்றன; தமிழில் ‘அறிவை அடைய’ என்பது இயல்பானதும் பொருளுக்கு நெருக்கமானதும் ஆகும்.
- source_word: ἀληθείας
  choice: சத்தியத்தைப் பற்றிய
  rationale: ἐπίγνωσιν சார்ந்த உரிய வேற்றுமைப் பொருளைத் தெளிவாகக் காட்டுகிறது. பவுலின் பயன்பாட்டில் குறிப்பிட்ட இறைசார்ந்த உண்மையைக் குறிக்கும் வகையில் ‘சத்தியம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: δυνάμενα
  choice: முடியாதவர்களாக இருக்கிறார்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பெண்களோடு ஒத்துவரும் பன்மைப் பெண்பால் கருத்தைத் தமிழில் மனிதர்களைக் குறிக்கும் பொதுப் பன்மை வடிவில் தொடரச் செய்து, திறனின்மையைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: ἐπίγνωσις என்பதன் வலுப்படுத்தப்பட்ட அறிவு சார்ந்த நுண்பொருள்
  choice: அறிவு
  alternative: முழுமையான அறிவு
  rationale: இச்சொல் முழுமையான அல்லது ஆழ்ந்த அறிவைக் குறிக்கக்கூடும்; ஆயினும் இவ்வசனத்தின் முதன்மை முரண்பாடு இடைவிடாது கற்றும் சத்தியத்தை உண்மையாக அறியும் நிலையை அடைய இயலாமையே. ஆகவே முதன்மை உரையில் இயல்பான ‘அறிவு’ வைக்கப்பட்டு, வலுப்படுத்தப்பட்ட நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இத்துணுக்கு முந்தைய வசனத்தின் பெண்களைக் குறிக்கும் தொடர்ச்சி என்பதால் ‘அவர்களாக இருக்கிறார்கள்’ எனப் பன்மையில் முடிக்கப்பட்டுள்ளது; தனியாக வாசிக்கும் போதும் இலக்கணத் தெளிவு கிடைக்கிறது.
