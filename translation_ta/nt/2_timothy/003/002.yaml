source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: ta
  text: ஏனெனில், மக்கள் தங்களையே நேசிப்பவர்களாகவும், பணத்தை நேசிப்பவர்களாகவும், வீண்பெருமை பேசுகிறவர்களாகவும், அகந்தையுள்ளவர்களாகவும், பழித்துப் பேசுகிறவர்களாகவும்[a], பெற்றோருக்குக் கீழ்ப்படியாதவர்களாகவும், நன்றியில்லாதவர்களாகவும், புனிதமற்றவர்களாகவும் இருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவதூஷணம் பேசுகிறவர்கள்” அல்லது “வசைபாடுகிறவர்கள்.” கிரேக்கச் சொல் மனிதர்களையோ கடவுளையோ அவமதிக்கும் பேச்சைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: இருப்பார்கள்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; பட்டியலிலுள்ள எல்லாப் பண்புகளுக்கும் இறுதியில் இணையும் வினையாக அமைந்துள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணவிளக்க வலிமையைப் பாதுகாக்கிறது.
- source_word: οἱ ἄνθρωποι
  choice: மக்கள்
  rationale: இலக்கண வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், இங்கு குறிப்பு ஆண்களுக்கு மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிக்கிறது.
- source_word: φίλαυτοι
  choice: தங்களையே நேசிப்பவர்கள்
  rationale: தன்னையே மையப்படுத்தும் அன்பைக் குறிக்கிறது; அடுத்துள்ள ‘பணத்தை நேசிப்பவர்கள்’ என்பதுடனான சொல்லமைப்பு இணைப்பையும் காக்கிறது.
- source_word: φιλάργυροι
  choice: பணத்தை நேசிப்பவர்கள்
  rationale: ‘வெள்ளி/பணத்தை நேசிப்பவர்கள்’ என்ற கூட்டுச்சொல்லின் நேரடியான கருத்தையும் φίλαυτοι உடனான இணையான நடையையும் பாதுகாக்கிறது.
- source_word: ἀλαζόνες
  choice: வீண்பெருமை பேசுகிறவர்கள்
  rationale: தம்மைப் பற்றி ஆடம்பரமாகப் பெருமை பேசும் குணத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὑπερήφανοι
  choice: அகந்தையுள்ளவர்கள்
  rationale: எதிர்மறையான செருக்கும் மேட்டிமையும் கொண்ட மனப்பாங்கை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: βλάσφημοι
  choice: பழித்துப் பேசுகிறவர்கள்
  rationale: மனிதர்களையோ கடவுளையோ அவமதிக்கும் அல்லது இழிவாகப் பேசும் சொல்லின் பரந்த பொருளுக்கு இடமளிக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: பெற்றோருக்குக் கீழ்ப்படியாதவர்கள்
  rationale: பெற்றோரின் சொற்படி நடக்க மறுப்பதைத் தமிழில் வழக்கமான முறையில் தெரிவிக்கிறது.
- source_word: ἀχάριστοι
  choice: நன்றியில்லாதவர்கள்
  rationale: நன்றி உணர்வின்மையை எளிய, இயல்பான நவீனத் தமிழில் எடுத்துரைக்கிறது.
- source_word: ἀνόσιοι
  choice: புனிதமற்றவர்கள்
  rationale: புனிதம், இறைபற்று, பயபக்தி ஆகியவற்றுக்கு முரணான குணத்தைக் குறிக்கும் மூலச்சொல்லின் சமய-ஒழுக்க வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: οἱ ἄνθρωποι என்ற பொதுப்பொருளுடைய ஆண்பால் சொற்றொடர்
  choice: மக்கள்
  alternative: ஆண்கள்; மனிதர்கள்
  rationale: சூழலில் பாலின வரம்பு இல்லை; ஆகவே ஆண்களை மட்டும் குறிப்பதாகச் சுருக்காமல் பொதுவான மனிதக் குழுவைத் தெரிவிக்கிறது.
- issue: βλάσφημοι என்பதன் பொருள் வரம்பு
  choice: பழித்துப் பேசுகிறவர்கள்
  alternative: தேவதூஷணம் பேசுகிறவர்கள்; வசைபாடுகிறவர்கள்
  rationale: இச்சொல் மனிதர்களுக்கு எதிரான பழிப்பையும் கடவுளுக்கு எதிரான தூஷணத்தையும் குறிக்கக்கூடும். முதன்மை மொழிபெயர்ப்பு பேச்சின் அவமதிக்கும் தன்மையைப் பொதுவாக வைத்திருக்கிறது; குறிப்பிட்ட மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தீய குணங்களைக் குவிக்கும் பட்டியல் ஓசையைப் பாதுகாக்க ‘-வர்களாகவும்’ என்ற இணை அமைப்பு பயன்படுத்தப்பட்டுள்ளது. βλάσφημοι என்பதிலுள்ள உண்மையான பொருள் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
