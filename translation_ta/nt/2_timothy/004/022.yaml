  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: ta
  text: ஆண்டவர் உன் ஆவியோடு இருப்பாராக.[a] அருள் உங்கள் அனைவரோடும் இருப்பதாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில் ஒருமையிலிருந்து பன்மைக்கு மாற்றம் உள்ளது: ‘உன் ஆவியோடு’ (ஒருமை) … ‘உங்கள் அனைவரோடும்’ (பன்மை).'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: பவுலின் கடித நிறைவு வாழ்த்தில் இயேசுவைக் குறிக்கும் வழக்கமான மரியாதைப் பட்டமாகவும், கிரேக்கத்தின் திட்டமான குறிப்பை இயல்பாகவும் இது வெளிப்படுத்துகிறது.
- source_word: μετὰ
  choice: இருப்பாராக / இருப்பதாக
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், வாழ்த்தின் விருப்பப் பொருளை இயல்பான தமிழில் தெரிவிக்க இவ்வினை வடிவங்கள் தேவைப்படுகின்றன.
- source_word: πνεύματός
  choice: ஆவி
  rationale: ‘உன்’ என்ற ஒருமை உடைமைச்சொல்லுடன் வருவதால், இங்கு தீமோத்தேயுவின் மனித ஆவியைக் குறிக்கும் பொருளைத் தக்கவைக்கிறது; பரிசுத்த ஆவி என்று விரிவுபடுத்தப்படவில்லை.
- source_word: σου
  choice: உன்
  rationale: முதல் வாழ்த்து தீமோத்தேயுவைத் தனிப்பட்ட முறையில் நோக்குகிறது என்பதைக் காட்டும் ஒருமை வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் நிறைவு வாழ்த்துக்குரிய தெய்வீக கிருபை/அருள் என்னும் செறிவான பொருளை நவீன, கண்ணியமான தமிழில் இயல்பாகத் தருகிறது.
- source_word: ὑμῶν
  choice: உங்கள் அனைவரோடும்
  rationale: இரண்டாம் நபர் பன்மையை வெளிப்படையாகக் காட்டி, தீமோத்தேயுவிலிருந்து அவருடன் தொடர்புடைய பரந்த வாசகர் குழுவுக்கு வாழ்த்து விரிவதைக் காக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பவரின் குறிப்பு
  choice: பவுலின் நிறைவு வாழ்த்துச் சூழலில் ஆண்டவராகிய இயேசுவைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது; ஆனால் உரையில் ‘இயேசு’ என்று சேர்க்கப்படவில்லை.
  alternative: கடவுளை பொதுவாகக் குறிக்கும் பட்டமாகப் புரிந்துகொள்ளுதல்.
  rationale: பவுலின் கடித நிறைவுகளில் ‘ஆண்டவர்’ பொதுவாக இயேசுவைக் குறிக்கிறது. எனினும், மூலத்தின் சொல்லளவை மீறி குறிப்பைத் தீர்மானிக்காமல் ‘ஆண்டவர்’ என்ற பட்டமே வைக்கப்படுகிறது.
- issue: இரு வாக்கியங்களுக்கிடையிலான எண்ணிக்கை மாற்றம்
  choice: முதல் வாக்கியம் தீமோத்தேயுவை ஒருமையில் நோக்குகிறது; இரண்டாவது வாக்கியம் ஒரு பன்மைக் குழுவை நோக்குகிறது.
  alternative: இரண்டு வாக்கியங்களையும் தீமோத்தேயுவுக்கான வாழ்த்தாக மட்டும் தமிழாக்குதல்.
  rationale: கிரேக்கம் σου என்ற ஒருமையிலிருந்து ὑμῶν என்ற பன்மைக்கு தெளிவாக மாறுகிறது. தமிழிலும் ‘உன்’ மற்றும் ‘உங்கள் அனைவரோடும்’ என்பவற்றால் இந்த இலக்கிய மற்றும் கருத்தியல் வேறுபாடு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சுருக்கமானவும் கண்ணியமானவும் உள்ள கடித நிறைவு வாழ்த்து. ‘இருப்பாராக’ என்பது ஆண்டவருக்குரிய மரியாதை ஒருமையைத் தருகிறது; ‘இருப்பதாக’ என்பது அருளை மையப்படுத்திய இயல்பான வாழ்த்து வடிவம். ஒருமை–பன்மை மாற்றம் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
