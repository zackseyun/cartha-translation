  text: Ἄσπασαι Πρίσκαν καὶ Ἀκύλαν καὶ τὸν Ὀνησιφόρου οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/019.yaml
  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: ta
  text: பிரிஸ்காவுக்கும்[a] ஆக்கில்லாவுக்கும் ஒநேசிப்போருவின் வீட்டாருக்கும் வாழ்த்துச் சொல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ‘பிரிஸ்கா’ என்று உள்ளது; வேறு இடங்களில் இவர் ‘பிரிஸ்கில்லா’ என்றும் அழைக்கப்படுகிறார் (எடுத்துக்காட்டாக, அப்போஸ்தலர் 18:2, 18, 26).
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: வாழ்த்துச் சொல்
  rationale: ἀσπάζομαι என்பதன் இறந்தகால நடுவினை ஏவல் வடிவம், கடிதத்தின் முடிவில் வாழ்த்தைத் தெரிவிக்கும்படி இடப்படும் நேரடியான கட்டளையாக உள்ளது. ‘வாழ்த்துச் சொல்’ என்பது அதன் ஏவல் வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: Πρίσκαν
  choice: பிரிஸ்கா
  rationale: கிரேக்க மூலத்தில் சுருக்கப் பெயரான ‘பிரிஸ்கில்லா’ அல்ல, Πρίσκαν என்ற பெயரே உள்ளது; ஆகவே ‘பிரிஸ்கா’ என நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ἀκύλαν
  choice: ஆக்கில்லா
  rationale: Ἀκύλας என்ற ஆள்பெயரின் தமிழ் ஒலிபெயர்ப்பு; கிரேக்க இரட்டை மெய்யொலியை ‘க்கில்லா’ எனப் பிரதிபலிக்கிறது.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: ஒநேசிப்போருவின் வீட்டார்
  rationale: இங்கு οἶκος என்பது கட்டடத்தை மட்டும் அல்லாமல், அந்த இல்லத்துடன் தொடர்புடைய மனிதர்களைக் குறிக்கிறது. ‘வீட்டார்’ என்பது இரத்த உறவினருக்கு மட்டும் பொருளைக் குறுக்காமல், household என்ற சமூகப் பொருளை இயல்பான தமிழில் தருகிறது.
