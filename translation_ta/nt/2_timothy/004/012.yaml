revisions:
- from: தீகிக்குவையோ எபேசுவுக்கு அனுப்பினேன்.[a]
  to: தீகிக்குவை எபேசுவுக்கு அனுப்பினேன்.[a]
  rationale: The revision removes the misleading '-ஓ' while retaining the source clause's direct, natural Tamil wording. Since δέ may signal either continuation or mild contrast and Tamil need not mark it overtly here, the base text leaves it unmarked and the footnote preserves viable explicit alternatives.
