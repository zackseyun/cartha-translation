  yaml_path: translation/nt/2_timothy/004/012.yaml
  text: But I sent Tychicus to Ephesus[a].
translation:
  language: ta
  text: தீகிக்குவை எபேசுவுக்கு அனுப்பினேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆனால், தீகிக்குவை எபேசுவுக்கு அனுப்பினேன்’ அல்லது ‘தீகிக்குவையும் எபேசுவுக்கு அனுப்பினேன்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க இணைப்புச்சொல் δέ எளிய தொடர்ச்சியையோ மென்மையான மாறுபாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: தீகிக்குவை
  rationale: வினைச்சொல்லின் நேர்செயப்படுபொருளாக வரும் ஆண்பெயர்; தமிழில் நிலைபெற்ற வேதாகமப் பெயரெழுத்தாக்கத்தைப் பின்பற்றி, இரண்டாம் வேற்றுமை உருபுடன் வழங்கப்பட்டது.
- source_word: δὲ
  choice: -ஓ
  rationale: δέ இங்கு முந்தைய கூற்றிலிருந்து மென்மையான மாறுபாடு அல்லது தலைப்புமாற்றத்தைக் குறிக்கலாம். தமிழில் பெயருடன் இணையும் ‘-ஓ’ அந்த நுட்பத்தை இயல்பாக வெளிப்படுத்துகிறது; இருப்பினும் தொடர்ச்சியாகவும் புரிந்துகொள்ள முடியும்.
- source_word: ἀπέστειλα
  choice: அனுப்பினேன்
  rationale: ἀποστέλλω என்பதன் இறந்தகாலச் செயப்பாட்டு, தன்மை ஒருமை வடிவம். கிரேக்க இறந்தகால நிகழ்வை கூடுதல் காலவியல் விளக்கமின்றி இயல்பான தமிழில் தருகிறது.
- source_word: εἰς
  choice: -க்கு
  rationale: நகரப்பெயருடன் இலக்கைச் சுட்டும் εἰς என்பதற்கு தமிழின் நான்காம் வேற்றுமை ‘-க்கு’ இயல்பான இணை.
- source_word: Ἔφεσον
  choice: எபேசு
  rationale: இடப்பெயர் தமிழில் நிலைபெற்ற வேதாகமப் பெயரெழுத்தாக்கத்தின்படி வழங்கப்பட்டது; இலக்கைக் குறிக்க ‘-க்கு’ சேர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. δέ-யின் மெல்லிய உரையாடல் நுட்பத்தை ‘தீகிக்குவையோ’ எனக் காட்டி, அதன் உண்மையான மாற்று வாய்ப்புகளை அடிக்குறிப்பில் பாதுகாத்துள்ளோம்.
