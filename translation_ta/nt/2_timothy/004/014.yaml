source:
  edition: SBLGNT
  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: ta
  text: உலோகக் கைவினைஞனான அலெக்சந்தர்[a] எனக்குப் பல தீங்குகளைச் செய்தான்[b]. ஆண்டவர் அவனுடைய செயல்களுக்கு ஏற்ப அவனுக்குக் கைம்மாறு செய்வார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செம்புக் கொல்லனான அலெக்சந்தர்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “என்னிடம் பல தீமைகளைக் காட்டினான்.”
    reason: lexical_alternative
  - marker: c
    text: சில கையெழுத்துப் பிரதிகளில், “ஆண்டவர் அவனுடைய செயல்களுக்கு ஏற்ப அவனுக்குக் கைம்மாறு செய்வாராக” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: உலோகக் கைவினைஞன்
  rationale: இச்சொல் பொதுவாகச் செம்பு அல்லது வெண்கலம் உள்ளிட்ட உலோகங்களில் வேலை செய்பவரைக் குறிக்கலாம். எந்த உலோகம் என்பது உறுதியாக இல்லாததால், இயல்பான தமிழில் மிகைப்படுத்தாத பொதுப்பெயர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: எனக்குப் பல தீங்குகளைச் செய்தான்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘என்னிடம் பல தீமைகளைக் காட்டினான்’ என்றாலும், இச்சூழலில் அது அலெக்சந்தர் பவுலுக்குப் பலவிதத் தீங்கு செய்தான் என்பதைக் குறிக்கிறது. தேர்ந்தெடுக்கப்பட்ட வடிவம் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; சொற்படியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀποδώσει
  choice: கைம்மாறு செய்வார்
  rationale: எதிர்கால வினை வடிவம் தக்கவைக்கப்பட்டு, செயலுக்கேற்ற பதிலளிப்பு அல்லது நீதி வழங்குதல் என்ற பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்படுகிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: திட்டத்தின் வழக்கத்திற்கும் κύριος என்பதன் உறுதியான சமயப் பயன்பாட்டிற்கும் ஏற்ப மொழிபெயர்க்கப்பட்டது.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: அவனுடைய செயல்களுக்கு ஏற்ப
  rationale: ‘அவனுடைய கிரியைகளின்படி’ என்ற மரபுவழி வடிவத்தைவிட நவீனத் தமிழில் தெளிவாக இருந்து, செயல்களின் அடிப்படையிலான கைம்மாறு என்ற கருத்தை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ἀποδώσει என்பதை எதிர்கால உறுதிக்கூற்றாகவா அல்லது வேண்டுதலாகவா மொழிபெயர்ப்பது
  choice: ஆண்டவர் ... கைம்மாறு செய்வார்
  alternative: ஆண்டவர் ... கைம்மாறு செய்வாராக
  rationale: SBLGNT உரையிலுள்ள ἀποδώσει என்பது எதிர்காலக் குறிப்பு வினை; எனவே முதன்மை உரை வேண்டுதலாக அல்ல, வரவிருக்கும் தெய்வீகக் கைம்மாறு பற்றிய கூற்றாக அமைக்கப்பட்டது. சில கையெழுத்துப் பிரதிகளின் வேண்டுதல் வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயல்பற்ற கிரேக்கச் சொற்றொடர் தமிழில் பொருள்தெளிவுடன் வழங்கப்பட்டாலும், அதன் சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
