  source_fidelity: முதன்மை உரை SBLGNT-ஐ நம்பகமாகப் பிரதிபலிக்கிறது. χαλκεύς என்பதற்கு உலோகத்தின் வகையைத் தேவையின்றித் துல்லியப்படுத்தாமல் “உலோகக் கைவினைஞன்” எனத் தரப்பட்டுள்ளது. πολλά μοι κακὰ ἐνεδείξατο என்பதன் சூழல்சார்ந்த பொருள் “எனக்குப் பல தீங்குகளைச் செய்தான்” என இயல்பாகவும் சரியாகவும் வந்துள்ளது. ἀποδώσει எதிர்காலக் கூற்றாக “கைம்மாறு செய்வார்” என வழங்கப்பட்டுள்ளது; κατὰ τὰ ἔργα αὐτοῦ என்பதும் “அவனுடைய செயல்களுக்கு ஏற்ப” எனத் தக்கவைக்கப்பட்டுள்ளது.
