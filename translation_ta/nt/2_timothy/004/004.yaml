source:
  edition: SBLGNT
  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: ta
  text: அவர்கள் சத்தியத்திற்குச் செவிகொடுப்பதை விட்டுவிட்டு, கட்டுக்கதைகளின் பக்கம் திரும்பிப்போவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கட்டுக்கதைகள்’ என்பதற்கு ‘புனைகதைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: சத்தியம்
  rationale: கிரேக்க மொழியில் உள்ள வரையறைச் சுட்டை கருத்தில் கொண்டு, சூழலில் அறியப்பட்ட சத்தியத்தைக் குறிக்கும் வகையில் ‘சத்தியம்’ என மொழிபெயர்க்கப்பட்டது; இதை ‘நற்செய்தி’ அல்லது ‘சரியான போதனை’ என்று குறுக்கவில்லை.
- source_word: ἀκοὴν
  choice: செவிகொடுப்பது
  rationale: ἀκοή என்பது கேட்டல் அல்லது செவிகொடுக்கும் செயலைக் குறிக்கலாம். ‘செவிகொடுப்பது’ என்பது தமிழில் இயல்பாகவும், அவர்கள் வேண்டுமென்றே கேட்பதை நிறுத்தும் கருத்தைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀποστρέψουσιν
  choice: விட்டுவிடுவார்கள்
  rationale: ἀπὸ உடன் வரும் ‘திருப்பிவிடுதல்’ என்ற திசைமாற்றத்தை, ‘சத்தியத்திற்குச் செவிகொடுப்பதை விட்டுவிட்டு’ என்ற இயல்பான தமிழ் தொடரால் வெளிப்படுத்துகிறது.
- source_word: μύθους
  choice: கட்டுக்கதைகள்
  rationale: மெய்யல்லாத, புனையப்பட்ட அல்லது ஊகக் கதைகள் என்ற எதிர்மறைச் சூழல்சார்ந்த பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: ἐκτραπήσονται
  choice: திரும்பிப்போவார்கள்
  rationale: இடை/செயப்பாட்டு வடிவத்தின் முகவர் குறித்த தெளிவின்மையைத் தீர்மானிக்காமல், வேறொரு திசைக்குச் செல்லும் உட்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: …விட்டுவிட்டு, … பக்கம்
  rationale: சத்தியத்திலிருந்து விலகி கட்டுக்கதைகளை நோக்கிச் செல்லும் எதிர்நிலைத் திசைகளை தமிழில் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சூழலில் ‘சத்தியம்’ என்பதன் தன்மை
  choice: சத்தியம்
  alternative: சரியான போதனை; நற்செய்தியின் சத்தியம்
  rationale: சூழல் அப்போஸ்தல போதனையைச் சுட்டினாலும், மூலவசனம் விரிவான ἀλήθεια என்ற சொல்லையே பயன்படுத்துகிறது. ஆகவே அதன் இறையியல் பரப்பைச் சுருக்காமல் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு இயல்பாகவும் கண்ணியமாகவும் அமைந்த நடை. கிரேக்க உருவகத்தைச் சொற்சொல்லாக ‘கேள்வியைத் திருப்புதல்’ என்று கூறாமல், அதன் செயற்பொருளை ‘செவிகொடுப்பதை விட்டுவிடுதல்’ எனத் தெளிவுபடுத்துகிறது.
