id: 2TI.4.1
reference: 2 Timothy 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: ta
  text: 'கடவுளின் முன்னிலையிலும், உயிருள்ளவர்களையும் இறந்தவர்களையும் நியாயந்தீர்க்கவிருக்கும்[a] மேசியா இயேசுவின் முன்னிலையிலும், அவருடைய வெளிப்படுதலின் பேரிலும் அவருடைய அரசாட்சியின் பேரிலும்[b], நான் உனக்கு உறுதியாக ஆணையிடுகிறேன்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயந்தீர்ப்பார்.” μέλλω என்ற கிரேக்கச் சொல் வரவிருக்கும் செயலைக் குறிக்கலாம்; அது எவ்வளவு உடனடியாக நிகழும் என்பதை இங்கே துல்லியமாக நிர்ணயிக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய வெளிப்படுதலையும் அவருடைய அரசாட்சியையும்.” கிரேக்கத்தில் இந்தத் தொடர்பு இன்னும் மறைமுகமாக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: நான் உனக்கு உறுதியாக ஆணையிடுகிறேன்
  rationale: இந்தப் பணிப்புரைச் சூழலில் வினைச்சொல் வெறும் சாட்சியமளித்தலை அல்ல, மிகுந்த பொறுப்புடன் அளிக்கப்படும் ஆணையை உணர்த்துகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘உனக்கு’ என்பது அடுத்த வசனத்தின் ஒருமை கட்டளைகளால் சூழலிலிருந்து தெளிவாகிறது.
- source_word: ἐνώπιον
  choice: முன்னிலையில்
  rationale: கடவுளும் மேசியா இயேசுவும் காண்கிற சாட்சியான பிரசன்னத்தில் கூறப்படும் ஆணை என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: θεοῦ
  choice: கடவுள்
  rationale: நவீன நிலையான தமிழில் θεός என்பதற்கான தெளிவான, பொதுவாகப் புரியும் சொல்.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மேசியா இயேசு
  rationale: Χριστός இங்கு நீதிபதியான இயேசுவைக் குறிக்கும் பட்டப்பெயரின் வலிமையைத் தக்கவைக்கிறது; அதை வெறும் பெயரின் பகுதியாக மாற்றவில்லை.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: நியாயந்தீர்க்கவிருக்கிற
  rationale: μέλλω குறிக்கும் எதிர்கால நோக்கத்தையும் நெருங்கிய எதிர்பார்ப்பின் சாயலையும் முற்றிலும் அழிக்காமல், தமிழில் இயல்பாகத் தருகிறது.
- source_word: ζῶντας καὶ νεκρούς
  choice: உயிரோடிருக்கிறவர்களையும் இறந்தவர்களையும்
  rationale: இரு பெயரடைப் பயன்பாடுகளையும் மனிதர்களைக் குறிக்கும் இணையான தமிழ்ச் சொற்றொடர்களாகவும், நியாயத்தீர்ப்பின் முழு வீச்சைத் தக்கவைத்தும் மொழிபெயர்க்கிறது.
- source_word: ἐπιφάνειαν
  choice: வெளிப்படுதல்
  rationale: காணத்தக்க விதத்தில் தோன்றுதல் அல்லது வெளிப்படுதல் என்ற கருத்தைத் தருகிறது; ‘வருகை’ என்று மொழிபெயர்த்து கருத்தைத் தேவையின்றி குறுக்கவில்லை.
- source_word: βασιλείαν
  choice: அரசாட்சி
  rationale: βασιλεία என்பதில் உள்ள அரசரின் ஆட்சியையும் ஆளுகையையும் தெளிவாகக் காட்டுகிறது; இடத்தைக் குறிக்கும் ‘ராஜ்யம்’ என்ற புரிதலுக்கு மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: அவருடைய வெளிப்படுதலின் பேரிலும் அவருடைய அரசாட்சியின் பேரிலும்
  rationale: கிரேக்கத்தின் வேற்றுமை அமைப்பை ஆணையுறுதியை வலுப்படுத்தும் தொடராகப் புரிந்து, தமிழின் ‘பேரில்’ என்ற இயல்பான ஆணையுறுதி வடிவில் தருகிறது; நேரடியான இணைப்பு மாற்று வாசிப்பாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: மேசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இந்த நீதித்தீர்ப்பு விளக்கத்தில் அபிஷேகம் பெற்ற அரசர் என்ற பட்டப்பெயரின் கருத்து செயலிலுள்ளது. ‘மேசியா’ அதை வெளிப்படையாகத் தக்கவைக்கிறது.
- issue: μέλλω தரும் காலநிலைச் சாயல்
  choice: நியாயந்தீர்க்கவிருக்கிற
  alternative: நியாயந்தீர்க்கப்போகிற அல்லது நியாயந்தீர்ப்பவர்
  rationale: எளிய எதிர்காலமாகத் தட்டையாக்காமல், எதிர்நோக்கப்பட்ட நியாயத்தீர்ப்பின் நெருக்கம் அல்லது உறுதியைத் திறந்த நிலையில் வைக்கிறது.
- issue: வெளிப்படுதலும் அரசாட்சியும் ஆணையுடன் கொண்டுள்ள தொடரியல் உறவு
  choice: அவற்றின் பேரில் ஆணையிடுதல்
  alternative: ‘அவருடைய வெளிப்படுதலையும் அவருடைய அரசாட்சியையும்’ என்று நேரடியாக இணைத்தல்
  rationale: இரண்டு குற்றுவேற்றுமைச் சொற்களையும் மறைமுகமாகத் தொடரும் ஆணையுறுதியின் பொருட்களாகக் கொள்வது சூழலில் தெளிவான பொருளைத் தருகிறது; ஆயினும் கிரேக்கத்தின் சுருக்கமான அமைப்பு அனுமதிக்கும் அதிக மறைமுகமான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய முறையான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உறுதியாக ஆணையிடுகிறேன்’ என்பது திருச்சபை மரபுக்கே உரிய அரிதான சொல்லாட்சியைத் தவிர்த்து, நிகழ்வின் தீவிரத்தை வெளிப்படுத்துகிறது. ‘மேசியா’, ‘வெளிப்படுதல்’, ‘அரசாட்சி’ ஆகியவை மூலத்தின் பட்டப்பெயர் மற்றும் இறுதிக்காலப் பதற்றத்தை விளக்கவுரை செய்து தீர்த்துவிடாமல் காக்கின்றன.
