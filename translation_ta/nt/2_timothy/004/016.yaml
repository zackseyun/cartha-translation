id: 2TI.4.16
reference: 2 Timothy 4:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: ta
  text: என்னுடைய முதல் தற்காப்பு வாதத்தின்போது[a], எனக்கு ஆதரவாக யாரும் வந்து நிற்கவில்லை[b]; எல்லாரும் என்னைக் கைவிட்டார்கள். அது அவர்களுக்கு எதிராகக் கணக்கிடப்படாதிருப்பதாக[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்னுடைய முதல் விசாரணையின்போது’ அல்லது ‘நான் முதல்முறையாகச் சட்டப்பூர்வமாகத் தற்காப்பு அளித்தபோது.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘என்னுடன் உடனிருக்க யாரும் வந்து சேரவில்லை’; பவுலுக்கு ஆதரவாக யாரும் முன்னிலையாகவில்லை என்பதே பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அது அவர்கள்மேல் குற்றமாகச் சுமத்தப்படாதிருப்பதாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: தற்காப்பு வாதம்
  rationale: இது பொதுவான விளக்கத்தைக் குறிக்காமல், அதிகாரிகள்முன் அளிக்கப்படும் முறையான சட்டப்பூர்வத் தற்காப்பைக் குறிக்கிறது. ‘தற்காப்பு வாதம்’ நீதித்துறைச் சூழலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πρώτῃ
  choice: முதல்
  rationale: தற்காப்பின் முதல் கட்டம் அல்லது முதல் சந்தர்ப்பம் என்பதை நேரடியாகக் குறிக்கிறது; கிரேக்கத்தின் வரிசைச் சுட்டலைப் பாதுகாக்கிறது.
- source_word: παρεγένετο
  choice: வந்து நிற்கவில்லை
  rationale: வினைச்சொல் அடிப்படையில் ‘வந்து உடனிருந்தல்’ எனப் பொருள்படும். இச்சூழலில் பவுலுக்கு ஆதரவாக நீதிமன்றத்தில் முன்னிலையாவதைக் குறிக்கும் என்பதால், ‘ஆதரவாக ... வந்து நிற்கவில்லை’ என்பது உடனிருப்பையும் துணைநிற்பதையும் இயல்பாக எடுத்துரைக்கிறது.
- source_word: οὐδείς
  choice: யாரும் ... இல்லை
  rationale: எவருமே வரவில்லை என்ற முழுமையான மறுப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐγκατέλιπον
  choice: கைவிட்டார்கள்
  rationale: ஆபத்தான சூழலில் ஒருவரைத் தனியே விட்டுவிடுதல் என்ற பொருளை, பழமையான நடையின்றித் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: λογισθείη
  choice: கணக்கிடப்படாதிருப்பதாக
  rationale: குற்றமாக ஒருவருடைய கணக்கில் சேர்த்தல் என்ற கணக்கியல் மற்றும் நீதித்துறை உருவகத்தைப் பாதுகாக்கிறது; இறைவனை நோக்கிய விருப்பம் அல்லது வேண்டுதல் போன்ற optative நயத்தையும் வெளிப்படுத்துகிறது.
- source_word: μὴ αὐτοῖς λογισθείη
  choice: அது அவர்களுக்கு எதிராகக் கணக்கிடப்படாதிருப்பதாக
  rationale: கைவிட்ட செயல் அவர்களுடைய குற்றமாகக் கருதப்படக் கூடாது என்ற வேண்டுதல் போன்ற விருப்பத்தைத் தெளிவுபடுத்துகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்பொருளைத் தமிழின் இயல்புக்காக ‘அது’ எனச் சுட்டுகிறது.
theological_decisions:
- issue: பவுலைக் கைவிட்டவர்களைப் பற்றிய இறுதி வாக்கியத்தின் தொனி
  choice: அவர்களுடைய குற்றமாக அது கணக்கிடப்படாதிருக்க வேண்டும் என்ற வேண்டுதல் போன்ற விருப்பம்
  alternative: ‘அது அவர்களுக்கு எதிராகக் கணக்கிடப்பட வேண்டாம்’ என்ற மென்மையான அனுமதி அல்லது கட்டளைத் தொனி
  rationale: μή என்பதுடன் வரும் aorist passive optative ஆன λογισθείη இயல்பாக ஒரு விருப்பத்தையோ வேண்டுதலையோ வெளிப்படுத்துகிறது. மன்னிப்பின் மொழியுடனான ஒலிப்பை இது தக்கவைத்தாலும், கிரேக்கம் கூறுவதைவிட வலுவான கோட்பாட்டுக் கூற்றைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதித்துறைச் சூழல் தெளிவாகத் தெரியுமாறு dignified ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கைவிட்டார்கள்’ உணர்ச்சி மற்றும் சூழ்நிலை சார்ந்த abandonment-ஐ இயல்பாகக் காட்டுகிறது; இறுதி வாக்கியம் தீர்ப்பாக அல்லாமல் வேண்டுதல் போன்ற விருப்பமாக வைக்கப்பட்டுள்ளது.
