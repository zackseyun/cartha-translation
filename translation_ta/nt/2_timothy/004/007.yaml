source:
  edition: SBLGNT
  text: τὸν ⸂καλὸν ἀγῶνα⸃ ἠγώνισμαι, τὸν δρόμον τετέλεκα, τὴν πίστιν τετήρηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: ta
  text: நல்ல போராட்டத்தைப் போராடியிருக்கிறேன்; ஓட்டத்தை முடித்திருக்கிறேன்; விசுவாசத்தைக் காத்திருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசத்தில் நிலைத்திருந்திருக்கிறேன்”; அல்லது, “உண்மையாய் இருந்திருக்கிறேன்.” கிரேக்கத்தில் உள்ள τὴν πίστιν என்பது கிறிஸ்தவ விசுவாசத்தைக் குறிக்கலாம்; அல்லது ஒருவர் விசுவாசத்தில் நிலைத்திருந்ததையும் உண்மையாய் இருந்ததையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: நல்ல போராட்டத்தை
  rationale: ἀγών என்பது போராட்டம், போட்டி, மல்லாடல் ஆகிய பொருள்களைக் கொண்டது. இங்கு தொடரும் ஓட்டப் பந்தய உருவகத்துடனும் வாழ்க்கைப் போராட்டத்தின் வலிமையுடனும் இயல்பாகப் பொருந்துவதால் ‘போராட்டம்’ தேர்ந்தெடுக்கப்பட்டது; καλός என்பதற்கு ‘நல்ல’ என்பது நேரடியும் நிறுவப்பட்டதுமான இணை.
- source_word: ἠγώνισμαι
  choice: போராடியிருக்கிறேன்
  rationale: ἀγωνίζομαι என்பதன் நிறைவுக்கால வடிவம் முடிந்த செயலையும் அதன் தற்போதைய விளைவையும் உணர்த்துகிறது. ‘போராடியிருக்கிறேன்’ அந்த நிறைவுக்கால நுணுக்கத்தையும் மூன்று கூறுகளின் இணை அமைப்பையும் காக்கிறது.
- source_word: δρόμον
  choice: ஓட்டத்தை
  rationale: δρόμος என்பது ஓடும் பாதையையோ ஓட்டப் பந்தயத்தையோ குறிக்கலாம். தமிழில் ‘ஓட்டத்தை முடித்திருக்கிறேன்’ என்பது தடம் அல்லது பயணப்பாதை என்ற பொருளைத் திணிக்காமல் தடகள உருவகத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τετέλεκα
  choice: முடித்திருக்கிறேன்
  rationale: τελέω என்பதன் நிறைவுக்காலம் நோக்கமுள்ள முடிவை அடைந்ததைக் குறிக்கிறது. ‘முடித்திருக்கிறேன்’ சுருக்கமாகவும் இயல்பாகவும் அந்த நிறைவைத் தெரிவிக்கிறது.
- source_word: πίστιν
  choice: விசுவாசத்தை
  rationale: πίστις இங்கு ‘விசுவாசம்’ அல்லது ஒப்படைக்கப்பட்ட கிறிஸ்தவ விசுவாசம் என்ற பொருளைக் கொள்ளலாம்; நம்பிக்கைக்குரிய நிலைத்தன்மையையும் சுட்டக்கூடும். ‘விசுவாசம்’ வழக்கமான, இயல்பான தமிழ் இறையியல் சொல்லாக இருந்து மூலத்தின் தெளிவின்மையை ஓரளவு காக்கிறது.
- source_word: τετήρηκα
  choice: காத்திருக்கிறேன்
  rationale: τηρέω என்பது காத்தல், பாதுகாத்தல், கடைப்பிடித்தல் ஆகிய நுணுக்கங்களைக் கொண்டது. ‘காத்திருக்கிறேன்’ பாதுகாத்தல் மற்றும் உண்மையாய் நிலைத்திருத்தல் ஆகிய இரண்டிற்கும் இடமளிக்கிறது.
theological_decisions:
- issue: τὴν πίστιν என்பதன் பொருள்
  choice: விசுவாசத்தைக் காத்திருக்கிறேன்
  alternative: விசுவாசத்தில் நிலைத்திருந்திருக்கிறேன் / உண்மையாய் இருந்திருக்கிறேன்
  rationale: கிரேக்கச் சொற்றொடர் ஒப்படைக்கப்பட்ட கிறிஸ்தவ விசுவாசத்தைப் பாதுகாத்தல் என்பதையும் தனிப்பட்ட விசுவாசம் அல்லது விசுவாச உண்மையை நிலைநிறுத்தல் என்பதையும் அனுமதிக்கிறது. முதன்மை உரை பெயர்ச்சொல் அமைப்பையும் τηρέω-வின் ‘காத்தல்’ நுணுக்கத்தையும் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாய்வழியாகவும் தெளிவாக ஒலிக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் மூன்று இணையான நிறைவுக்கால வாக்கியக் கூறுகளும் ‘-இருக்கிறேன்’ வடிவால் பாதுகாக்கப்பட்டுள்ளன; போராட்டம் மற்றும் ஓட்டம் ஆகிய உருவகங்கள் நேரடியாக வைக்கப்பட்டுள்ளன.
