id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: ta
  text: ஏனெனில், தேமா இப்போதைய யுகத்தை[a] நேசித்து என்னைக் கைவிட்டான்; அவன் தெசலோனிக்கேக்குப் போனான். கிரெஸ்கே கலாத்தியாவிற்கும், தீத்து தல்மாத்தியாவிற்கும் சென்றனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்போதைய உலகத்தை.” கிரேக்கச் சொல் இன்னும் நேரடியாக இப்போதைய யுகம் அல்லது கால ஒழுங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான விளக்கமாக இவ்வாக்கியத்தை இணைக்கும் காரணத் தொடர்பை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: ἐγκατέλιπεν
  choice: என்னைக் கைவிட்டுவிட்டு
  rationale: ஒருவரைப் பின்னால் விட்டுச் செல்வதிலுள்ள கடுமையான, குற்றத்தன்மையுடைய நிழற்பொருளைக் காட்டுகிறது; அதேவேளையில் தேமா விசுவாசத்தையே முற்றிலும் துறந்தான் என்று வசனம் கூறாததை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- source_word: ἀγαπήσας
  choice: நேசித்து
  rationale: தேமா இப்போதைய காலத்தை நேசித்ததற்கும் பவுலைக் கைவிட்டதற்கும் இடையிலான தொடர்பைத் தெளிவாக வைத்துக்கொள்கிறது; அந்தத் தொடர்பை வெளிப்படையாகக் காரணவாக்கியமாக மாற்றாமல் கிரேக்கப் பங்கேற்புவினையின் சுருக்கத்தையும் காக்கிறது.
- source_word: τὸν νῦν αἰῶνα
  choice: இப்போதைய காலத்தை
  rationale: αἰών என்பதன் காலம் அல்லது யுகம் சார்ந்த பொருளை முன்னிறுத்துகிறது; பொருளுலகத்தைக் குறிக்கும் சொல்லாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: ἐπορεύθη
  choice: போனான் / போனார்கள்
  rationale: செல்லும் செயலை மிகைப்படுத்தாமல் இயல்பாகக் காட்டுகிறது. கிரெஸ்கே, தீத்து ஆகியோருக்கான வினை கிரேக்கத்தில் விடுபட்டிருந்தாலும் தமிழில் தெளிவுக்காக இறுதியில் பன்மையில் வழங்கப்பட்டுள்ளது.
- source_word: Θεσσαλονίκην
  choice: தெசலோனிக்கே
  rationale: கிரேக்க இடப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: Κρήσκης
  choice: கிரெஸ்கே
  rationale: கிரேக்க ஆள்பெயருக்கு அணுக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Γαλατίαν
  choice: கலாத்தியா
  rationale: கிரேக்க மண்டலப் பெயரின் தமிழில் வழக்கமான வடிவம்.
- source_word: Τίτος
  choice: தீத்து
  rationale: கிரேக்க ஆள்பெயரின் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு.
- source_word: Δαλματίαν
  choice: தல்மாத்தியா
  rationale: கிரேக்க மண்டலப் பெயருக்கு அணுக்கமான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: தேமா பவுலைவிட்டுச் சென்றது விசுவாசத்தை முற்றிலும் துறந்ததைக் குறிக்கிறதா, அல்லது குற்றத்தன்மையுடைய தனிப்பட்ட பிரிவை மட்டும் குறிக்கிறதா
  choice: “என்னைக் கைவிட்டுவிட்டு” என்று மொழிபெயர்த்து, செயலில் உள்ள எதிர்மறை ஒழுக்கத் தன்மையைத் தக்கவைத்தல்; விசுவாசத்துரோகம் என்று வெளிப்படையாகச் சேர்க்காதிருத்தல்.
  alternative: “விசுவாசத்தைத் துறந்து என்னைவிட்டுச் சென்றான்” என்று வலுவாக விளக்குதல்.
  rationale: தேமா இப்போதைய காலத்தை நேசித்ததால் பவுலைக் கைவிட்டான் என்று வசனம் கூறுகிறது; ஆனால் அவன் இறுதியாக விசுவாசத்தைத் துறந்தான் என்று நேரடியாகக் கூறவில்லை. ஆகவே மூலத்தில் உள்ள இறையியல் பதற்றம் தீர்த்துவைக்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. “நேசித்து” என்பது மூலத்தின் சுருக்கமான தொடர்பைத் தக்கவைக்கிறது; “ஏனெனில்” முந்தைய சூழலோடு உள்ள காரணத் தொடர்பைக் காட்டுகிறது.
