source:
  edition: SBLGNT
  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: ta
  text: நீ வரும்போது, நான் துரோவாவில் கார்ப்புவிடம் விட்டுவந்த மேலங்கியையும்[a], நூல்களையும்[b], குறிப்பாகத் தோலேடுகளையும் கொண்டுவா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலங்கி’ என்பதற்குப் பதிலாக, சிலர் இதைப் புத்தகங்களை வைக்கும் உறை அல்லது பொதியாகப் புரிந்துகொள்கிறார்கள். எனினும், கிரேக்கச் சொல்லின் வழக்கமான பொருள் வெளியே அணியும் ஓர் ஆடை என்பதே.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘சுருள்கள்’; கிரேக்கச் சொல் எழுதப்பட்ட சுருள்களையோ அதுபோன்ற எழுத்துப் பொருட்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: மேலங்கி
  rationale: இந்தச் சொல் பொதுவாக உடலுக்கு வெளியே அணியும் ஆடையைக் குறிக்கிறது. புத்தகங்களுக்கான உறை என்ற கருத்து முன்வைக்கப்பட்டிருந்தாலும், வழக்கமான பொருளான ‘மேலங்கி’ இச்சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: ἀπέλιπον
  choice: விட்டுவந்த
  rationale: முன்பு ஓர் இடத்தில் ஒன்றை விட்டுவந்ததைக் குறிக்கும் இறந்தகால வினை. ‘விட்டுவந்த’ என்பது தமிழில் சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: παρὰ Κάρπῳ
  choice: கார்ப்புவிடம்
  rationale: παρά உடன் வரும் வேற்றுமை வடிவம் இங்கு கார்ப்புவின் பொறுப்பில் அல்லது அவர் இருந்த இடத்தில் விட்டதைச் சுட்டுகிறது. ‘கார்ப்புவிடம்’ இரு நுணுக்கங்களையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: ἐρχόμενος
  choice: நீ வரும்போது
  rationale: இந்தப் பங்கேற்பு வினை, ‘கொண்டுவா’ என்ற கட்டளையுடன் காலத் தொடர்பைக் காட்டுகிறது. ‘நீ வரும்போது’ என்பது அதன் இயல்பான தமிழாக்கம்.
- source_word: φέρε
  choice: கொண்டுவா
  rationale: பேசுபவர் இருக்கும் இடத்துக்கு பொருட்களை எடுத்து வரும்படியான கட்டளையைத் தமிழில் ‘கொண்டுவா’ துல்லியமாகத் தெரிவிக்கிறது.
- source_word: τὰ βιβλία
  choice: நூல்கள்
  rationale: βιβλία என்பது நூல்கள் அல்லது சுருள்கள் போன்ற எழுதப்பட்ட ஆவணங்களைக் குறிக்கலாம். பொருளின் உடல் வடிவத்தைத் தீர்மானிக்காமல் பொதுவாகக் கூற ‘நூல்கள்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: μάλιστα
  choice: குறிப்பாக
  rationale: அடுத்து குறிப்பிடப்படும் பொருளுக்கு சிறப்பு முக்கியத்துவம் அளிப்பதை ‘குறிப்பாக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὰς μεμβράνας
  choice: தோலேடுகள்
  rationale: μεμβράνα என்பது எழுதுவதற்குப் பயன்படுத்தப்பட்ட பதப்படுத்தப்பட்ட விலங்குத் தோலைக் குறிக்கிறது. ‘தோலேடுகள்’ என்பது அந்தப் பொருளையும் ஆவணத் தன்மையையும் சுருக்கமாகத் தெரிவிக்கிறது.
