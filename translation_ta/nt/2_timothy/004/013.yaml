translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் நேரடியான கடித நடையும் காக்கப்பட்டுள்ளன. பொருட்களின் பழங்கால வடிவத்தை அளவுக்கு மீறித் தீர்மானிக்காமல் ‘நூல்கள்’ என்றும், எழுதப் பயன்படுத்தப்பட்ட தோல் ஆவணங்களைத் தெளிவாகக் காட்ட ‘தோலேடுகள்’ என்றும் வழங்கப்பட்டுள்ளது.
