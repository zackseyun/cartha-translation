  source_fidelity: மூலக் கிரேக்கத்தின் கட்டளைத் தொடரும் வலியுறுத்தலும் துல்லியமாகக் காக்கப்பட்டுள்ளன. «ஆனால் நீயோ» σὺ δέ-யின் முரண்பாட்டையும் வலியுறுத்தலையும் தருகிறது; «எல்லாவற்றிலும் மனத்தெளிவுடன் இரு», νῆφε ἐν πᾶσιν என்பதன் உருவகமான, பரந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது. κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, மற்றும் τὴν διακονίαν σου πληροφόρησον ஆகியவை முறையே துன்பத்தைத் தாங்குதல், நற்செய்தி அறிவிக்கும் பணியைச் செய்தல், ஊழியத்தை முழுமையாக நிறைவேற்றுதல் எனப் பொருத்தமாக மொழிபெயர்க்கப்பட்டுள்ளன.
