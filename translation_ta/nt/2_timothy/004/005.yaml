id: 2TI.4.5
reference: 2 Timothy 4:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: ta
  text: ஆனால் நீயோ, எல்லாவற்றிலும் மனத்தெளிவுடன் இரு[a]; துன்பத்தைச் சகித்துக்கொள்[b]; நற்செய்தி அறிவிப்பவரின் பணியைச் செய்; உன் ஊழியத்தை முழுமையாக நிறைவேற்று[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விழிப்புணர்வுடன் இரு,’ ‘நிதானமாக இரு.’ கிரேக்க வினைச்சொல் சொற்பொருளில் ‘மதுமயக்கமின்றி இரு’ எனப் பொருள்படலாம்; புதிய ஏற்பாட்டில் இது மனத்தெளிவையும், தன்னிலை இழக்காமையையும், நெருக்கடியின்கீழ் நிலைத்திருப்பதையும் உருவகமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘துன்பத்தை ஏற்றுக்கொள்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உன் ஊழியத்தை முழுமையாகச் செய்து முடி.’ கிரேக்க வினைச்சொல் ஒன்றை முழு நிறைவுக்குக் கொண்டுவரும் பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: ஆனால் நீயோ
  rationale: δέ காட்டும் முந்தைய வசனங்களுடனான முரண்பாட்டையும், வெளிப்படையாக இடம்பெறும் σὺ தரும் தனிப்பட்ட வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: νῆφε
  choice: மனத்தெளிவுடன் இரு
  rationale: இச்சொல் சொற்பொருளில் மதுவிலிருந்து தெளிந்திருப்பதைக் குறிக்கக்கூடும்; புதிய ஏற்பாட்டில் இது மனத்தெளிவு, தன்னிலை இழக்காமை, நெருக்கடியிலும் நிலைத்திருத்தல் ஆகிய உருவகப் பொருள்களில் வருகிறது. இச்சூழலில் ‘மனத்தெளிவுடன் இரு’ என்பது அந்த நடைமுறை வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: ἐν πᾶσιν
  choice: எல்லாவற்றிலும்
  rationale: இந்தச் சொற்றொடரின் விரிவான பொருளைக் காக்கிறது; அது எல்லாச் சூழ்நிலைகளையா எல்லா நேரங்களையா குறிப்பதாகத் தேவையின்றி வரையறுப்பதில்லை.
- source_word: κακοπάθησον
  choice: துன்பத்தைச் சகித்துக்கொள்
  rationale: துன்பத்தை அனுபவிப்பது மட்டுமல்லாமல், அதில் நிலைத்து நிற்பதையும் கட்டளை வடிவில் தெரிவிக்கிறது.
- source_word: ἔργον ποίησον
  choice: பணியைச் செய்
  rationale: கிரேக்க மொழியின் இயல்பான வினைத்தொடரைத் தெளிவான, நேரடியான தமிழில் தருகிறது.
- source_word: εὐαγγελιστοῦ
  choice: நற்செய்தி அறிவிப்பவரின்
  rationale: ஒரு குறிப்பிட்ட பதவிப்பெயரை உரையில் திணிக்காமல், நற்செய்தியை அறிவிக்கும் நபர் என்ற கிரேக்கச் சொல்லின் செயற்பாட்டுப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὴν διακονίαν σου
  choice: உன் ஊழியத்தை
  rationale: தீமோத்தேயுவிடம் ஒப்படைக்கப்பட்ட நற்செய்தி மற்றும் மேய்ப்புப் பொறுப்பைக் குறிக்கும் இச்சூழலில் ‘ஊழியம்’ பொருத்தமானது; இது பொதுவான சேவையைவிடச் சூழலின் தன்மையை நன்றாக வெளிப்படுத்துகிறது.
- source_word: πληροφόρησον
  choice: முழுமையாக நிறைவேற்று
  rationale: ஒப்படைக்கப்பட்ட ஊழியத்தை முழு அளவில் செய்து முடிக்க வேண்டும் என்ற வினைச்சொல்லின் வலிமையை வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: διακονία என்பதன் பொருள்
  choice: ஊழியம்
  alternative: சேவை
  rationale: உடனடிச் சூழல் தீமோத்தேயுவிடம் ஒப்படைக்கப்பட்ட நற்செய்தி அறிவிப்பு மற்றும் மேய்ப்புப் பொறுப்பைப் பற்றியது. ஆகவே ‘ஊழியம்’ சூழலுக்கு ஏற்றது; எனினும் இதை எந்தச் சபை மரபின் குறிப்பிட்ட பதவியாகவும் மொழிபெயர்க்கவில்லை.
- issue: εὐαγγελιστής என்பது பதவியா செயலா
  choice: நற்செய்தி அறிவிப்பவர்
  alternative: சுவிசேஷகர்
  rationale: கிரேக்கச் சொல் நற்செய்தியை அறிவிக்கும் ஒருவரைக் குறிக்கிறது. இங்கு அது ஒரு முறையான திருச்சபைப் பதவியையே கட்டாயமாகக் குறிக்கிறதா என்பது உறுதியல்ல; எனவே செயற்பாட்டை வெளிப்படுத்தும் மொழியாக்கம் அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பவுலின் நேரடியான தனிப்பட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நற்செய்தி அறிவிப்பவர்’ என்பது சாதாரண வாசகருக்குத் தெளிவாகவும், ஒரு குறிப்பிட்ட சமயப் பதவியை முன்கூட்டியே நிர்ணயிக்காததாகவும் உள்ளது.
