  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: ta
  text: நீயும் அவனைக் குறித்து எச்சரிக்கையாக இரு; ஏனெனில் அவன் நம்முடைய வார்த்தைகளை[a] மிகவும் எதிர்த்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நம்முடைய செய்தியை” அல்லது “நம்முடைய போதனையை.” கிரேக்கத்தில் “நம்முடைய வார்த்தைகளை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάσσου
  choice: எச்சரிக்கையாக இரு
  rationale: நிகழ்கால நடுவினை ஏவல் வடிவம், தீமோத்தேயு தொடர்ந்து தனிப்பட்ட எச்சரிக்கையுடன் இருக்க வேண்டும் என்பதைக் காட்டுகிறது. இயல்பான நவீனத் தமிழில் எச்சரிப்பின் வலிமையை இது தெளிவாகத் தருகிறது.
- source_word: λίαν
  choice: மிகவும்
  rationale: அடுத்து வரும் எதிர்த்தான் என்ற வினையின் தீவிரத்தை λίαν வலுப்படுத்துகிறது; மிகவும் என்பது இயல்பான தமிழில் அந்த அளவை வெளிப்படுத்துகிறது.
- source_word: ἀντέστη
  choice: எதிர்த்தான்
  rationale: ἀνθίστημι என்பதன் இறந்தகால வடிவம், ஒருவருக்கு அல்லது ஒன்றுக்கு எதிராக நிற்பதையோ எதிர்ப்பதையோ குறிக்கிறது. எதிர்த்தான் என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: நம்முடைய வார்த்தைகளை
  rationale: λόγοι என்பதற்குரிய அடிப்படைச் சொல்லாட்சியை வார்த்தைகள் பாதுகாக்கிறது; அதை செய்தி, போதனை, அல்லது நீதிமன்றச் சாட்சி என்று குறுக்காமல் மூலத்தின் விரிவை நிலைநிறுத்துகிறது. தமிழில் எதிர்த்தான் என்பதோடு இயல்பாக வருவதற்காக வேற்றுமை உருபு அமைக்கப்பட்டுள்ளது.
- source_word: ὃν
  choice: அவனைக் குறித்து
  rationale: உறவுப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அலெக்சாந்தரைக் குறிக்கிறது. எச்சரிக்கையாக இரு என்பதோடு அவனைக் குறித்து என்பது இயல்பான தமிழ் தொடரை உருவாக்குகிறது.
- source_word: καὶ σὺ
  choice: நீயும்
  rationale: καὶ என்பதும் வலியுறுத்தப்பட்ட σὺ என்பதும், பவுலுடன் தொடர்பாக தீமோத்தேயுவும் எச்சரிக்கையாக இருக்க வேண்டும் என்பதை வலியுறுத்துகின்றன.
theological_decisions:
- issue: “நம்முடைய வார்த்தைகள்” என்பதன் வரம்பு
  choice: பவுலும் அவருடைய உடன் ஊழியர்களும் பேசிய வார்த்தைகள் என்ற பொதுவான பொருளை வைத்திருத்தல்
  alternative: எங்கள் நீதிமன்றத் தற்காப்புச் சாட்சி; எங்கள் நற்செய்தி அறிவிப்பு; எங்கள் கோட்பாட்டுப் போதனை
  rationale: இந்தச் சொற்றொடர் எதிர்ப்பு நீதிமன்றத்திலா, பொதுவான ஊழியத்திலா, அல்லது கிறிஸ்தவப் போதனைக்கு எதிராகவா நிகழ்ந்தது என்பதைத் தனியாக வரையறுக்கவில்லை. ஆகவே ஒரு குறிப்பிட்ட சூழலைத் தேர்ந்தெடுக்காமல் மூலத்தின் நெகிழ்வும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாயும், வேதாகம வாசிப்பிற்கேற்ற கண்ணியமான தொனியுடனும் அமைக்கப்பட்டுள்ளது. மூலத்தின் பொருள் வரம்பைக் குறுக்கக்கூடிய தொழில்நுட்ப அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
