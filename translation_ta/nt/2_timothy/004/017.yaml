id: 2TI.4.17
reference: 2 Timothy 4:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: ta
  text: ஆனால் ஆண்டவர் என் அருகில் நின்று எனக்கு வலிமை அளித்தார். என் மூலமாக அறிவித்தல் முழுமையாக நிறைவேற்றப்படவும், பிற இனத்தார் அனைவரும் அதைக் கேட்கவும்[a] அவர் இப்படிச் செய்தார். மேலும், சிங்கத்தின் வாயிலிருந்து[b] நான் மீட்கப்பட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா நாடுகளும்” அல்லது “எல்லா மக்களினங்களும்.” கிரேக்கச் சொல் யூதரல்லாத மக்களையோ பல்வேறு நாடுகள் அல்லது மக்களினங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சிங்கத்தின் வாயிலிருந்து” என்பது உயிருக்கு ஆபத்தான சூழலிலிருந்து விடுவிக்கப்பட்டதைக் குறிக்கும் உருவகமாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: ஆனால் ஆண்டவர்
  rationale: δέ முந்தைய வசனத்துடனான முரண்பாட்டைச் சுட்டுவதால் ‘ஆனால்’ எனவும், κύριος வழக்கமான மரியாதைமிக்க இறையியல் சொல்லான ‘ஆண்டவர்’ எனவும் மொழிபெயர்க்கப்பட்டது.
- source_word: μοι παρέστη
  choice: என் அருகில் நின்று
  rationale: வெறும் இடச்சார்ந்த இருப்பை மட்டுமல்லாமல், ஆதரவாக உடனிருந்ததையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐνεδυνάμωσέν με
  choice: எனக்கு வலிமை அளித்தார்
  rationale: ἐνδυναμόω என்பதன் ‘வலுப்படுத்துதல்/ஆற்றலளித்தல்’ என்ற பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: ἵνα δι’ ἐμοῦ
  choice: என் மூலமாக … நிறைவேற்றப்படவும் … கேட்கவும்
  rationale: διά உடன் வரும் கருவி அல்லது முகமைப் பொருளையும், ἵνα காட்டும் நோக்கத்தையும் தமிழின் இணை வினை அமைப்பில் காக்கிறது.
- source_word: τὸ κήρυγμα
  choice: அறிவிப்பு
  rationale: அறிவிக்கப்படும் செய்தியையும் அறிவித்தல் நிகழ்வையும் உள்ளடக்கக்கூடிய பொதுவான சொல்லாக உள்ளது; மூலத்தில் இல்லாத ‘நற்செய்தி’ என்பதை நேரடியாகச் சேர்க்கவில்லை.
- source_word: πληροφορηθῇ
  choice: முழுமையாக நிறைவேற்றப்படவும்
  rationale: முழுமையாகச் செய்துமுடித்தல், முழுநிறைவு அடையச் செய்தல் ஆகிய பொருள் அகலத்தைப் பேணுகிறது; ‘முழுமையாக அறிவிக்கப்படுதல்’ என்ற ஒரே நுண்பொருளுக்கு இதைச் சுருக்கவில்லை.
- source_word: πάντα τὰ ἔθνη
  choice: பிற இனத்தார் அனைவரும்
  rationale: பவுலின் பணிச் சூழலில் யூதரல்லாத மக்களைக் குறிக்கும் சாத்தியமான பொருளை இயல்பாகத் தருகிறது; ‘எல்லா நாடுகளும்/மக்களினங்களும்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: ἐρρύσθην
  choice: நான் மீட்கப்பட்டேன்
  rationale: கொடிய ஆபத்திலிருந்து காப்பாற்றப்படுதல் என்ற ῥύομαι சொல்லின் வலுவான பொருளைக் காக்கிறது.
- source_word: ἐκ στόματος λέοντος
  choice: சிங்கத்தின் வாயிலிருந்து
  rationale: இது நேரடியான நிகழ்வா, உருவகமா என்பதைத் தீர்மானிக்காமல் மூலத்தின் தெளிவான உருவகப் படிமத்தை அப்படியே பேணுகிறது.
theological_decisions:
- issue: κύριος என்பவர் யாரைக் குறிக்கிறார்
  choice: ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: குறிப்பாக இயேசு; அல்லது பொதுவாகக் கடவுள்.
  rationale: சூழலில் உயிர்த்த ஆண்டவராகிய இயேசுவைக் குறிப்பதாகப் புரிந்துகொள்ள முடிந்தாலும், மூல உரை பெயரை வெளிப்படையாகச் சொல்லாததால் மொழிபெயர்ப்பும் அந்தத் திறந்த நிலையைக் காக்கிறது.
- issue: ‘சிங்கத்தின் வாயிலிருந்து’ என்பதன் பொருள்
  choice: கடும் ஆபத்திலிருந்து மீட்பைக் காட்டும் மூலப் படிமம் அப்படியே வைக்கப்பட்டது.
  alternative: நீரோவைக் குறிக்கும் உருவகம்; சாத்தானைக் குறிக்கும் உருவகம்; உண்மையான மிருகத் தண்டனையிலிருந்து தப்புதல்.
  rationale: இவற்றில் எதையும் உரை வெளிப்படையாக உறுதிப்படுத்தாததால், ஒரு குறிப்பிட்ட வரலாற்று அல்லது இறையியல் விளக்கத்தை மொழிபெயர்ப்பில் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே இடப்பட்டுள்ளன.
