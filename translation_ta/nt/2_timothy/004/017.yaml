  source_fidelity: மூலக் கிரேக்கத்தின் எதிர்மறை இணைப்பு (δέ), ஆண்டவரின் ஆதரவான உடனிருப்பு, வலிமையளித்தல், நோக்கத்தைக் குறிக்கும் ἵνα அமைப்பு, முழுமையாக்கப்படும் அறிவித்தல், எல்லா ἔθνη-யினரும் கேட்பது, மற்றும் ‘சிங்கத்தின் வாயிலிருந்து’ என்ற தீர்மானிக்கப்படாத படிமம் ஆகியவை வரைவு உரையில் பெரும்பாலும் நம்பகமாகக் காக்கப்பட்டுள்ளன. ஆயினும், κήρυγμα என்பதற்கு ‘அறிவிப்பு’ என்பது தமிழில் நிர்வாக அறிவிப்பைப் போன்ற உணர்வைத் தரலாம்; ‘அறிவித்தல்’ இச்சூழலில் இயல்பாகவும் மூலத்தின் செயல்/செய்தி பரப்பைக் காக்கும் வகையிலும் உள்ளது.
  naturalness: வாக்கியப் பிரிப்பு வாசிக்க எளிதானது. ‘அவர் இப்படிச் செய்தார்’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும் நோக்க உறவைத் தமிழில் தெளிவாக்குகிறது. ‘அறிவித்தல் முழுமையாக நிறைவேற்றப்படவும்’ என்ற திருத்தம் ‘அறிவிப்பு முழுமையாக நிறைவேற்றப்படவும்’ என்பதைக் காட்டிலும் நவீனத் தமிழில் இயல்பானது.
