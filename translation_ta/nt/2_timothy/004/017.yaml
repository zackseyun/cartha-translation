  to: ஆனால் ஆண்டவர் என் அருகில் நின்று எனக்கு வலிமை அளித்தார். என் மூலமாக அறிவித்தல் முழுமையாக நிறைவேற்றப்படவும், பிற இனத்தார் அனைவரும் அதைக் கேட்கவும்[a] அவர் இப்படிச் செய்தார். மேலும், சிங்கத்தின் வாயிலிருந்து[b] நான் மீட்கப்பட்டேன்.
  rationale: κήρυγμα-வின் பொருள்வளத்தையும் நவீன தமிழ் இயல்பையும் மேம்படுத்த ‘அறிவிப்பு’ என்பதற்குப் பதில் ‘அறிவித்தல்’ பயன்படுத்தப்பட்டது. சிங்கம் குறித்த அடிக்குறிப்பு, நேரடியான நிகழ்வு மற்றும் உருவக வாசிப்பு இரண்டிற்கும் உரை விட்டிருக்கும் திறந்த நிலையைக் காக்குமாறு மென்மையாக்கப்பட்டது. மற்ற சொற்களும் அடிக்குறிப்பு குறியீடுகளும் மூலத்திற்கும் வரைவு நோக்கத்திற்கும் ஏற்ப உள்ளன.
