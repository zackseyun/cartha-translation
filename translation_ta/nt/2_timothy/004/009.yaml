translation:
  language: ta
  text: என்னிடம் விரைவாக வர எல்லா முயற்சியும் செய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்னிடம் விரைவில் வர முழு முயற்சி செய்’ அல்லது ‘என்னிடம் சீக்கிரமாக வர உன்னால் முடிந்ததைச் செய்.’
    reason: Σπούδασον என்பது முழு அக்கறையுடன் முயற்சி செய்வதைக் குறிக்கலாம்; ταχέως என்பது ‘விரைவாக’ அல்லது ‘விரைவில்’ எனப் பொருள்படலாம். மாற்று மொழிபெயர்ப்புகள் இச்சொற்பொருள் வேறுபாடுகளைக் காட்டுகின்றன.
lexical_decisions:
- source_word: Σπούδασον
  choice: எல்லா முயற்சியும் செய்
  rationale: σπουδάζω என்பதன் இறந்தகாலச் செயப்பாட்டு ஏவல் வடிவம்; இது வெறும் வேகத்தை அல்ல, அக்கறையுடனும் ஊக்கத்துடனும் முழுமையாக முயல்வதைக் குறிக்கிறது. ‘எல்லா முயற்சியும் செய்’ என்பது அந்த ஏவலின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வேகத்தை மட்டும் குறிக்கும் சொல் பயன்படுத்தப்பட்டால் ταχέως உடனான வேறுபாடு மறைந்துவிடும்.
- source_word: ἐλθεῖν
  choice: வர
  rationale: ἔρχομαι என்பதன் இறந்தகால வினையெச்சப் பொருளுடைய infinitive வடிவம்; πρός με என்பதுடன், பேசுகிறவரை நோக்கிய இயக்கத்தைக் குறிப்பதால் ‘வர’ என்பது இயல்பான மொழிபெயர்ப்பு.
- source_word: πρός
  choice: என்னிடம் என்பதில் ‘-இடம்’
  rationale: με என்ற வேற்றுமை வடிவத்துடன் சேர்ந்து ஒருவரை நோக்கிய இயக்கத்தைக் குறிக்கிறது. தமிழில் ‘என்னிடம் வர’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: με
  choice: என்-/என்னை (என்னிடம்)
  rationale: முதலாம் நபர் ஒருமைச் சுட்டுப்பெயரின் accusative வடிவம்; πρός உடன் சேர்ந்துள்ளதால் தமிழில் ‘என்னிடம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ταχέως
  choice: விரைவாக
  rationale: ‘விரைவாக’ அல்லது ‘விரைவில்’ என்ற பொருளைத் தரும் வினையடை. இங்கு அவசரத்தையும் தாமதமின்றிச் செயல்பட வேண்டியதையும் உணர்த்த ‘விரைவாக’ தேர்ந்தெடுக்கப்பட்டது; காலத்தை முதன்மைப்படுத்தினால் ‘விரைவில்’ என்றும் மொழிபெயர்க்கலாம்.
