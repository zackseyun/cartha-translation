reference: 2 Timothy 4:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: ta
  text: வார்த்தையை அறிவி; சமயம் ஏற்றதாக இருந்தாலும் இல்லாவிட்டாலும் தயாராயிரு[a][b]; தவறைச் சுட்டிக்காட்டு, கண்டி, அறிவுறுத்து[c]; எல்லாப் பொறுமையுடனும் போதனையுடனும் இவற்றைச் செய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடனிருந்து செயல்படு,” “தீவிரமாக ஈடுபடு.” கிரேக்கக் கட்டளைச் சொல் ஆயத்தமாக இருப்பது, அருகில் நிற்பது, அல்லது காரியத்தை அவசர உணர்வுடன் முன்னெடுப்பது ஆகிய பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “காலம் சாதகமாக இருந்தாலும் இல்லாவிட்டாலும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஊக்குவி,” “வலியுறுத்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: பிரசங்கி
  rationale: பொதுவாகவும் அதிகாரபூர்வமாகவும் அறிவிப்பதைக் குறிக்கும் கட்டளை. நவீன தமிழ் கிறிஸ்தவப் பயன்பாட்டில் புரிந்துகொள்ளத்தக்கதாகவும் மூலத்தின் அறிவிப்புத் தன்மையைத் தக்கவைத்ததாகவும் உள்ளது.
- source_word: τὸν λόγον
  choice: வார்த்தையை
  rationale: இங்கு தீமோத்தேயு அறிவிக்க வேண்டிய அப்போஸ்தலச் செய்தியைக் குறிக்கிறது. “நற்செய்தி” அல்லது “வேதவசனம்” என்று வரம்புபடுத்தாமல் மூலத்திலுள்ள விரிவைத் தக்கவைக்கிறது.
- source_word: ἐπίστηθι
  choice: ஆயத்தமாயிரு
  rationale: செயல்படத் தயாராகவும் முன்நிற்கவும் வேண்டும் என்ற கட்டளையின் நடைமுறை வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தீவிரமாக ஈடுபடுதல் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: εὐκαίρως ἀκαίρως
  choice: காலம் வாய்த்தாலும் வாய்க்காவிட்டாலும்
  rationale: சூழ்நிலை ஏற்றதாகத் தோன்றினாலும் தோன்றாவிட்டாலும் என்ற சமச்சீரான எதிரிணையை இயல்பான தமிழில் தருகிறது.
- source_word: ἔλεγξον
  choice: தவறைச் சுட்டிக்காட்டு
  rationale: தவறை வெளிப்படுத்தி உணர்த்தும் திருத்தும் வலிமையை, அடுத்துள்ள கடுமையான கண்டிப்பிலிருந்து வேறுபடும் வகையில் காட்டுகிறது.
- source_word: ἐπιτίμησον
  choice: கடிந்துகொள்
  rationale: முந்தைய வினையைவிடக் கடுமையான கண்டிப்பைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: παρακάλεσον
  choice: அறிவுறுத்து
  rationale: சூழலில் வேண்டிக்கொள்ளுதல், ஊக்குவித்தல், வலியுறுத்துதல் ஆகிய பரப்பைக் கொண்ட சொல்லுக்கு இயல்பான தமிழ் தெரிவு; பிற நுணுக்கங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: முழுப் பொறுமையோடும்
  rationale: மக்களிடம் நீடிய பொறுமையுடன் நடந்துகொள்வதையும் πάσῃ என்பதன் முழுமையையும் வெளிப்படுத்துகிறது.
- source_word: καὶ διδαχῇ
  choice: போதனையோடும்
  rationale: திருத்துதல், கடிந்துகொள்ளுதல், அறிவுறுத்துதல் ஆகியவற்றுடன் இணைந்த கற்பித்தல் முறை அல்லது உள்ளடக்கத்தைப் பொதுவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: “வார்த்தை” என்பதன் வரம்பு
  choice: முதன்மை உரையில் “வார்த்தை” என்று மொழிபெயர்க்கப்பட்டது.
  alternative: “செய்தி,” “நற்செய்தி,” அல்லது “வேதவசனம்”
  rationale: உடனடிச் சூழல் வேதவாக்கியத்தை அடிப்படையாகக் கொண்ட அப்போஸ்தல அறிவிப்பைப் பற்றியதாக இருந்தாலும், λόγος என்ற சொல் இவ்வசனத்தில் வெளிப்படையாக “நற்செய்தி” அல்லது “வேதவசனம்” என்று குறுக்கப்படவில்லை. ஆகவே மூலத்தின் பரந்த பொருளும் இறையியல் நெருக்கடியும் தக்கவைக்கப்பட்டன.
- issue: ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ என்பதன் தொடர்பு
  choice: பொறுமையும் போதனையும் மூன்று திருத்தும்/ஊக்குவிக்கும் கட்டளைகளுக்கும் பொருந்துமாறு “இவற்றையெல்லாம் ... செய்” என அமைக்கப்பட்டது.
  alternative: அருகிலுள்ள “அறிவுறுத்து” என்ற கட்டளையுடன் மட்டும் இணைத்தல்
  rationale: கிரேக்கச் சொற்றொடரின் இறுதி இடம் இலக்கண ரீதியாக அருகிலுள்ள வினையோடும் தொடர்புகொள்ளலாம்; ஆனால் கட்டளைகளின் முழுத் தொடரையும் நடத்தும் விதத்தைக் குறிப்பதாக வாசிப்பது இயல்பானது. தமிழில் தேவையான இணைப்பைச் சேர்த்தாலும் புதிய இறையியல் உள்ளடக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. “பிரசங்கி” என்பது சூழலுக்கேற்ற பரிச்சயமான சமயச் சொல்; மற்ற பகுதிகளில் தேவையற்ற பழமொழிநடை மற்றும் சமயப்பிரிவு சார்ந்த விரிவாக்கங்கள் தவிர்க்கப்பட்டுள்ளன. கிரேக்கத்தின் தொடர் கட்டளைகளும் வாக்கியத் தீவிரமும் அரைப்புள்ளிகளாலும் நீண்ட கோட்டாலும் தக்கவைக்கப்பட்டுள்ளன.
