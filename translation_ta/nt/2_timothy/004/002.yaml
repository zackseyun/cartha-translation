revisions:
- from: 'வார்த்தையைப் பிரசங்கி; காலம் வாய்த்தாலும் வாய்க்காவிட்டாலும் ஆயத்தமாயிரு[a][b]; தவறைச் சுட்டிக்காட்டு, கடிந்துகொள், அறிவுறுத்து[c]—இவற்றையெல்லாம் முழுப் பொறுமையோடும் போதனையோடும் செய்.


    [a] அல்லது, “உடனிருந்து செயல்படு,” “தீவிரமாக ஈடுபடு.” கிரேக்கக் கட்டளைச் சொல் ஆயத்தமாக இருப்பது, அருகில் நிற்பது, அல்லது காரியத்தை அவசர உணர்வுடன் முன்னெடுப்பது ஆகிய பொருள்களைத் தரக்கூடும்.


    [b] அல்லது, “காலம் சாதகமாக இருந்தாலும் இல்லாவிட்டாலும்.”


    [c] அல்லது, “ஊக்குவி,” “வலியுறுத்து.”'
  to: வார்த்தையை அறிவி; சமயம் ஏற்றதாக இருந்தாலும் இல்லாவிட்டாலும் தயாராயிரு[a][b]; தவறைச் சுட்டிக்காட்டு, கண்டி, அறிவுறுத்து[c]; எல்லாப் பொறுமையுடனும் போதனையுடனும் இவற்றைச் செய்.
  rationale: 'திருத்தம் மூன்று கட்டளைகளின் வேறுபட்ட வலிமையைத் தெளிவாக்குகிறது: தவறை வெளிப்படுத்துதல், கண்டித்தல், அறிவுறுத்துதல். «எல்லாப் பொறுமையுடனும் போதனையுடனும்» என்பதை முழுக் கட்டளைத் தொடருக்கும் பொருந்துமாறு வைத்திருப்பது கிரேக்கத்தின் இயல்பான வாசிப்பைத் தக்கவைக்கிறது; அது இறையியல் விரிவாக்கம் அல்ல. அடிக்குறிப்பு அடையாளங்களும் அவற்றின் இடங்களும் பாதுகாக்கப்பட்டுள்ளன.'
