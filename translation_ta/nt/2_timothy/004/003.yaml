  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: ta
  text: ஏனெனில், நலமான போதனையை[a] அவர்கள் சகித்துக்கொள்ளாத காலம் வரும். மாறாக, தங்கள் சொந்த ஆசைகளுக்கு ஏற்ப, காதுகள் அரித்துக்கொண்டிருக்க, தங்களுக்காக ஆசிரியர்களைக் குவித்துக்கொள்வார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரோக்கியமான போதனையை” அல்லது “நலமான கோட்பாட்டை.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “அவர்களுடைய கேள்வி அரித்துக்கொண்டிருக்க.” “காதுகள் அரித்தல்” என்பது தாங்கள் விரும்புவதையே கேட்க வேண்டும் என்ற ஏக்கத்தைச் சித்தரிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: காலம்
  rationale: வரவிருக்கும் ஒரு குறிப்பிட்ட காலகட்டத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ὑγιαινούσης διδασκαλίας
  choice: ஆரோக்கியமான போதனை
  rationale: ‘ஆரோக்கியமாக இருத்தல்’ என்ற கிரேக்க உருவகத்தையும், சரியானதும் நலமானதுமான போதனை என்ற பொருளையும் காக்கிறது.
- source_word: οὐκ ἀνέξονται
  choice: சகித்துக்கொள்ளாத
  rationale: போதனையை ஏற்கவோ பொறுத்துக்கொள்ளவோ அவர்கள் மறுப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: தங்களுடைய சொந்த ஆசைகளுக்கு ஏற்ப
  rationale: ἐπιθυμίαι என்பதை பாலியல் இச்சையாக மட்டும் குறுக்காமல், அவர்களை வழிநடத்தும் சுயவிருப்பங்கள் என்ற விரிந்த பொருளில் தருகிறது.
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: தங்களுக்காக ஆசிரியர்களைக் குவித்துக்கொள்வார்கள்
  rationale: தங்களுக்கேற்ற ஆசிரியர்களை மிகுதியாகச் சேர்த்துக்கொள்ளும் செயலைக் குறிக்கும் ἐπισωρεύω என்ற வலுவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: அவர்களுடைய காதுகள் அரித்துக்கொண்டிருக்கும்
  rationale: கேட்க விரும்புவதையே கேட்கும் ஏக்கத்தைச் சித்தரிக்கும் கிரேக்க உருவகத்தை நேரடியாக வைத்திருக்கிறது; பங்கேற்புச் சொற்றொடரை கட்டாயமாகக் காரணப் பொருளாக்காமல் சூழ்நிலையாக அளிக்கிறது.
theological_decisions:
- issue: διδασκαλία என்பதன் மொழிபெயர்ப்பு
  choice: போதனை
  alternative: கோட்பாடு
  rationale: இச்சொல் சரியான கிறிஸ்தவ அறிவுறுத்தலைக் குறித்தாலும், கிரேக்கத்தில் இல்லாத கூடுதல் சமயத் தொழில்நுட்பத் தன்மையைச் சேர்க்காமல் பொதுவாகப் புரியும் ‘போதனை’ பயன்படுத்தப்பட்டுள்ளது.
- issue: κνηθόμενοι τὴν ἀκοήν என்பதன் தொடர்பு
  choice: சூழ்நிலையைக் காட்டும் தனி தொடராக மொழிபெயர்த்தல்
  alternative: ‘காதுகள் அரிப்பதால்’ என்று காரணமாக மொழிபெயர்த்தல்
  rationale: கிரேக்கப் பங்கேற்புச் சொல் காரணத்தைக் குறிக்கக்கூடும்; ஆனால் காரணத் தொடர்பை வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே அதன் உண்மையான இலக்கணத் திறந்தநிலை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ‘ஆரோக்கியம்’ மற்றும் ‘குவித்தல்’ உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; இறுதி பங்கேற்புச் சொற்றொடருக்கு தேவையற்ற காரணத் தொடர்பு சேர்க்கப்படவில்லை.
