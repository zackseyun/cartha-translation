    rationale: ‘அவர்களுடைய காதுகள் அரித்துக்கொண்டிருக்கும்’ turns κνηθόμενοι into a separate finite future statement. The Greek has a participle modifying the main action; Tamil can preserve this with ‘காதுகள் அரித்துக்கொண்டிருக்க’ without deciding that it is explicitly causal.
  - severity: medium
    issue: Footnote b gives an inaccurate and unnatural literal gloss.
    rationale: ‘கேள்வி அரிப்பெடுக்கிறது’ does not naturally represent τὴν ἀκοήν in this idiom and obscures the image. The note should identify ‘hearing’ as the literal lexical sense while explaining the idiomatic Tamil rendering ‘காதுகள் அரித்தல்.’
  - severity: low
    issue: ‘ஆரோக்கியமான போதனை’ is overly literal in this Tamil context.
    rationale: While it reflects the Greek health metaphor, ‘நலமான போதனை’ is the more natural modern Tamil expression for wholesome or sound teaching.
