base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: ta
  text: எரஸ்து கொரிந்துவில் தங்கினார்; ஆனால் நோயுற்றிருந்த துரோப்பீமுவை மிலேத்துவில் விட்டுவந்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துரோப்பீமு நோயுற்றிருந்தபோது அவரை மிலேத்துவில் விட்டுவந்தேன்.”
    reason: ἀσθενοῦντα என்ற பெயரெச்சத்தைத் துரோப்பீமுவின் அப்போதைய நிலையைக் குறிக்கும் காலத் தொடராகவும் தமிழில் இயல்பாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: Ἔραστος
  choice: எரஸ்து
  rationale: கிரேக்க ஆள்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: ἔμεινεν
  choice: தங்கினார்
  rationale: μένω என்பதன் இங்குள்ள இடம்சார் பொருளான ‘ஓர் இடத்தில் தங்கியிருத்தல்’ என்பதை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν Κορίνθῳ
  choice: கொரிந்துவில்
  rationale: நகரப் பெயருடன் வரும் ἐν என்பதன் இடப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: Τρόφιμον
  choice: துரோப்பீமுவை
  rationale: கிரேக்க ஆள்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; வாக்கியத்தில் செயப்படுபொருளாக இருப்பதால் ‘-வை’ உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: இரு பயணச் செய்திகளுக்கிடையே δέ குறிக்கும் மென்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: ἀπέλιπον
  choice: விட்டுவந்தேன்
  rationale: முதலாம் நபர் ஒருமை இறந்தகால வினையைத் தமிழில் இயல்பாகத் தருகிறது; பேசுபவர் அந்த இடத்திலிருந்து புறப்பட்டுவந்ததையும் சூழலுக்கேற்றவாறு உணர்த்துகிறது.
- source_word: ἐν Μιλήτῳ
  choice: மிலேத்துவில்
  rationale: நகரப் பெயருடன் வரும் ἐν என்பதன் இடப்பொருளைத் தருகிறது.
- source_word: ἀσθενοῦντα
  choice: நோயுற்றிருந்த
  rationale: துரோப்பீமுவை விளக்கும் நிகழ்காலப் பெயரெச்சத்தின் சூழல்சார் பொருளைத் தருகிறது; இங்கு பொதுவான ‘பலவீனமாக’ என்பதைக் காட்டிலும் உடல்நோய் பொருள் பொருத்தமானது.
