source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: ta
  text: ஏனெனில், நான் ஏற்கெனவே பானக் காணிக்கையாக ஊற்றப்படுகிறேன்[a]; என் புறப்பாட்டின் நேரம் வந்துவிட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் ஏற்கெனவே ஊற்றப்படுகிறேன்.’ கிரேக்க வினைச்சொல், பலியில் பானக் காணிக்கை ஊற்றப்படும் காட்சியை நினைவூட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விடுதலை’ அல்லது ‘அவிழ்ப்பு.’ இங்கு ‘புறப்பாடு’ என்பது மரணத்தைக் குறிக்கும் இயல்பான மறைமுகச் சொல்.
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: பானக் காணிக்கையாக ஊற்றப்பட்டுக்கொண்டிருக்கிறேன்
  rationale: பலியில் பானக் காணிக்கை ஊற்றப்படுவதை இவ்வினைச்சொல் குறிக்கிறது. பவுல் நெருங்கிவரும் தமது மரணத்தைப் பலியோடு தொடர்புடைய உருவகத்தில் கூறுவதால், அந்த உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: செயல் இப்போதே தொடங்கி நடைபெறுகிறது என்ற உணர்வைத் தருகிறது; மரணம் நெருங்கியிருப்பதாகப் பவுல் கூறும் சூழலுக்கு இது பொருந்துகிறது.
- source_word: καιρός
  choice: நேரம்
  rationale: பொதுவான காலத்தைவிட தீர்மானமான தருணத்தைக் குறிக்கிறது. தமிழில் ‘நேரம்’ இயல்பாக உள்ளது; வாக்கியச் சூழல் அதன் தீர்மானமான தன்மையை வெளிப்படுத்துகிறது.
- source_word: ἀναλύσεώς
  choice: புறப்பாடு
  rationale: இச்சொல்லுக்கு புறப்படுதல், விடுவித்தல், அவிழ்த்தல் ஆகிய பொருள் நிழல்கள் உண்டு. இங்கு மரணத்தைக் குறிக்கும் இயல்பான மறைமுகச் சொல்லாக ‘புறப்பாடு’ பொருந்துகிறது; மூலத்தின் உருவகத் திறப்பையும் தக்கவைக்கிறது.
- source_word: ἐφέστηκεν
  choice: வந்துவிட்டது
  rationale: வந்து தற்போது நெருங்கி நிற்கும் நிலையை நிறைவுக்கால வடிவம் உணர்த்துகிறது. ‘வந்துவிட்டது’ அந்த நிகழ்கால விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்தை விளக்கும் தொடர்பை வெளிப்படையாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: பவுலின் மரணத்தை உருவகமாக விவரித்தல்
  choice: நெருங்கிவரும் மரணத்தைப் பானக் காணிக்கையாக ஊற்றப்படுதல் என்றும் புறப்பாடு என்றும் பவுல் விவரிப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது மரணத்தைச் சுட்டாமல் பொதுவாக அவரது துன்பத்தை மட்டும் குறிக்கிறது என்று மொழிபெயர்த்தல்.
  rationale: σπένδομαι மற்றும் ἀνάλυσις ஆகியவற்றின் இணைவு நெருங்கிவரும் மரணத்தை வலுவாகச் சுட்டுகிறது. இருப்பினும், ‘நான் இறக்கப்போகிறேன்’ என்று விளக்கவுரையாக்காமல் மூலத்திலுள்ள பலி மற்றும் புறப்பாட்டு உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘பானக் காணிக்கை’ பலி உருவகத்தைத் தெளிவாகக் காட்டுகிறது; ‘ஊற்றப்பட்டுக்கொண்டிருக்கிறேன்’ நிகழ்காலச் செயலின் தொடர்ச்சியைப் பாதுகாக்கிறது. மூலத்தின் இரண்டு இணை வாக்கியங்களும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
