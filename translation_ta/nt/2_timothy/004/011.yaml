id: 2TI.4.11
reference: 2 Timothy 4:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: ta
  text: லூக்கா மட்டுமே என்னுடன் இருக்கிறார். மாற்குவை உன்னுடன் அழைத்துக்கொண்டு வா; ஏனெனில், அவன் ஊழியத்திற்காக[a] எனக்குப் பயனுள்ளவனாக இருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேவைக்காக.” கிரேக்கச் சொல் பொதுவாகச் சேவையைக் குறிக்கக்கூடும்; இங்கு அது ஊழியப் பணியைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: லூக்கா
  rationale: தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: μόνος
  choice: மட்டுமே
  rationale: லூக்கா ஒருவரே இப்போது பவுலுடன் இருப்பதை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: μετ’ ἐμοῦ
  choice: என்னுடன் இருக்கிறார்
  rationale: உடனிருத்தலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Μᾶρκον
  choice: மாற்குவை
  rationale: தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவத்தை வேற்றுமை உருபுடன் வழங்குகிறது.
- source_word: ἀναλαβὼν
  choice: அழைத்துக்கொண்டு
  rationale: மாற்குவைத் தன்னுடன் சேர்த்துக்கொண்ட பின் அழைத்து வர வேண்டும் என்ற முன்னோடி செயலைக் காட்டுகிறது.
- source_word: ἄγε μετὰ σεαυτοῦ
  choice: உன்னுடன் கூட்டிக்கொண்டு வா
  rationale: கட்டளைத் தொனியையும் தீமோத்தேயுவின் பயணத் துணையாக மாற்குவை அழைத்து வருவதையும் தெளிவாகக் காக்கிறது.
- source_word: γάρ μοι
  choice: ஏனெனில் ... எனக்கு
  rationale: முந்தைய கட்டளைக்கான காரணத்தையும் பவுலுக்கான பயனையும் வெளிப்படுத்துகிறது.
- source_word: εὔχρηστος
  choice: பயனுள்ளவராக
  rationale: ஒரு பணிக்குப் பொருத்தமானவர் அல்லது உதவக்கூடியவர் என்ற பொருளை மரியாதையான இயல்பான தமிழில் தருகிறது.
- source_word: εἰς διακονίαν
  choice: ஊழியத்திற்காக
  rationale: அப்போஸ்தலப் பணியின் சூழலில் διακονία என்பதன் சாத்தியமான பொருளைத் தருகிறது; அதன் பரந்த ‘சேவை’ பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: διακονία என்பதன் மொழிபெயர்ப்பு
  choice: ஊழியம்
  alternative: சேவை
  rationale: இங்கு மாற்கு பவுலுக்கு அப்போஸ்தலப் பணியில் உதவுவது சூழலுக்கு ஏற்றதாகத் தெரிகிறது. எனினும், கிரேக்கச் சொல் பொதுவான சேவையையும் குறிக்கக்கூடும் என்பதால் அந்த விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அழைத்துக்கொண்டு ... கூட்டிக்கொண்டு வா’ என்பது ἀναλαβών மற்றும் ἄγε ஆகிய இரு செயல்களையும் தனித்தனியாகக் காக்கிறது; ‘ஊழியம்’ என்பதன் பொருள் தேவையின்றி ஒரு பதவியாகக் குறுக்கப்படவில்லை.
