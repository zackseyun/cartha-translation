revisions:
- from: லூக்கா மட்டுமே என்னுடன் இருக்கிறார். மாற்குவை அழைத்துக்கொண்டு உன்னுடன் கூட்டிக்கொண்டு வா; ஏனெனில் ஊழியத்திற்காக அவர் எனக்குப் பயனுள்ளவராக இருக்கிறார்.[a]
  to: லூக்கா மட்டுமே என்னுடன் இருக்கிறார். மாற்குவை உன்னுடன் அழைத்துக்கொண்டு வா; ஏனெனில், அவன் ஊழியத்திற்காக[a] எனக்குப் பயனுள்ளவனாக இருக்கிறான்.
  rationale: The revision removes an unnatural duplication while retaining the imperative to bring Mark in Timothy's company. It also places the lexical-alternative footnote directly on the Tamil rendering of διακονίαν. No doctrinal or office-specific sense is added.
  reviewer_model: gpt-5.6-terra
