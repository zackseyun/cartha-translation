id: 2TI.4.21
reference: 2 Timothy 4:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: ta
  text: குளிர்காலத்துக்கு முன் வருவதற்கு எல்லா முயற்சியும் செய். யூபுலு, பூதேன்ஸ், லீனு, கிளவுதியா, மற்றும் சகோதரர்கள் அனைவரும் உனக்கு வாழ்த்துகள் தெரிவிக்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதரர்களும் சகோதரிகளும் அனைவரும்.” கிரேக்கத்தில் “சகோதரர்கள்” என்று உள்ளது; ஆனால் இச்சூழலில் அது விசுவாசிகளின் விரிவான குழுவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: முழு முயற்சி செய்
  rationale: σπουδάζω என்பதன் கட்டளை வடிவம் ஆர்வத்தோடும் அவசர உணர்வோடும் முயல்வதைக் குறிக்கிறது. ‘முழு முயற்சி செய்’ என்பது இதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: πρὸ χειμῶνος
  choice: குளிர்காலத்துக்குமுன்
  rationale: πρό + மரபுவேற்றுமை இங்கு ஒரு காலப்பகுதிக்கு முன்பாக என்பதைக் குறிக்கிறது. ‘குளிர்காலத்துக்குமுன்’ என்பது சுருக்கமான, இயல்பான காலக் குறிப்பு.
- source_word: ἐλθεῖν
  choice: வர
  rationale: இந்த வினையெச்சம் Σπούδασον என்பதன் நோக்கத்தை நிறைவு செய்கிறது; தீமொத்தேயு பவுலிடம் வருவதையே நேரடியாகக் குறிக்கிறது.
- source_word: Ἀσπάζεταί σε
  choice: உனக்கு வாழ்த்துத் தெரிவிக்கிறார்கள்
  rationale: கடிதச் சூழலில் ἀσπάζομαι என்பது ஒருவருக்கு வாழ்த்து அனுப்புதல் அல்லது தெரிவித்தல் என்று பொருள்படும். பல பெயர்களையும் இறுதிக் குழுவையும் சேர்த்து தமிழில் இயல்பாகப் பன்மையில் அமைக்கப்பட்டுள்ளது.
- source_word: Εὔβουλος
  choice: யூபுலு
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: Πούδης
  choice: புதேன்
  rationale: கிரேக்கத் தனிப்பெயரின் ஒலியை நவீன தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: Λίνος
  choice: லீனு
  rationale: கிரேக்கத் தனிப்பெயரின் நீண்ட உயிரொலியைப் பேணும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: Κλαυδία
  choice: கிலவுதியா
  rationale: தமிழ் வேதாகமப் பெயர் மரபை மதிக்கும், அதேவேளையில் பெண்பால் பெயரை கூடுதல் பாலினப் பின்னொட்டு இன்றி வழங்கும் ஒலிபெயர்ப்பு.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: சகோதரர்கள் அனைவரும்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் பேணுகிறது. எனினும், தொடக்கக் கிறிஸ்தவக் கடிதச் சூழலில் இது முழு விசுவாசிகள் குழுவையும் குறிக்கக்கூடும் என்பதால் உள்ளடக்கிய பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: கலப்புப் பாலின விசுவாசிகள் குழுவைக் குறிக்கக்கூடிய ἀδελφοί என்பதன் மொழிபெயர்ப்பு
  choice: சகோதரர்கள் அனைவரும்
  alternative: சகோதர சகோதரிகள் அனைவரும்; விசுவாசிகள் அனைவரும்
  rationale: கிரேக்க உரை இலக்கண ரீதியாக ஆண்பால் பன்மையைப் பயன்படுத்துவதால் அது முதன்மை உரையில் பேணப்படுகிறது. அதே நேரத்தில், கடித வாழ்த்துச் சூழலில் சொல் விரிந்த விசுவாசிகள் சமூகத்தைக் குறிக்கக்கூடிய உண்மையான பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், ஒருமை நெருக்கச் சுட்டான ‘உனக்கு’ மற்றும் நேரடியான கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளன. பழமையான ‘மாரிக்காலம்’, ‘ஜாக்கிரதைப்படு’, ‘வாழ்த்துதல் சொல்லுகிறார்கள்’ போன்ற நடைகள் தவிர்க்கப்பட்டு, கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான மொழிநடை தேர்ந்தெடுக்கப்பட்டுள்ளது.
