source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: ta
  text: ஒவ்வொரு தீய செயலிலிருந்தும் ஆண்டவர் என்னை விடுவிப்பார்; தமது பரலோக அரசுக்குள் என்னைப் பாதுகாப்பாகக் கொண்டுசேர்ப்பார்.[a] அவருக்கு என்றென்றும் மகிமை உண்டாவதாக.[b] ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது பரலோக அரசுக்குள் என்னை இரட்சிப்பார்.”
    reason: σώσει εἰς என்ற கிரேக்க அமைப்பின் நேரடியான மாற்றைச் சுட்டுகிறது; முதன்மை உரை இயல்பான தமிழில் பாதுகாப்பாகக் கொண்டுசேர்த்தல் என்ற கருத்தை வழங்குகிறது.
  - marker: b
    text: சொல்லுக்கு சொல், “யுகங்களின் யுகங்கள் வரை.”
    reason: εἰς τοὺς αἰῶνας τῶν αἰώνων என்ற கிரேக்க மரபுத்தொடரின் நேரடி வடிவத்தைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: ῥύσεταί
  choice: விடுவித்து
  rationale: ῥύομαι என்பது ஆபத்து அல்லது தீமையிலிருந்து மீட்பதை அல்லது விடுவிப்பதைக் குறிக்கிறது. ‘விடுவிப்பார்’ என்பது நவீன தமிழில் இயல்பாக இருந்தாலும், தொடரும் வினையுடன் இணைக்க ‘விடுவித்து’ என வழங்கப்பட்டுள்ளது.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: ஒவ்வொரு தீய செயலிலிருந்தும்
  rationale: παντός என்பதன் ‘ஒவ்வொரு/எல்லா’ பொருளையும், ἔργον என்பதன் செயல் அல்லது செய்கை என்ற பொருளையும், πονηροῦ என்பதன் ஒழுக்கத் தீமைப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: σώσει εἰς
  choice: பாதுகாப்பாகக் கொண்டுசேர்ப்பார்
  rationale: σώσει என்பதிலுள்ள இரட்சித்தல்/பாதுகாத்தல் கருத்தையும் εἰς என்பதிலுள்ள இலக்கை நோக்கிய நுழைவையும் இயல்பான தமிழில் ஒன்றாக வெளிப்படுத்துகிறது; இறுதி இரட்சிப்பை வெறும் உடல் ஆபத்திலிருந்து தப்புதலாகக் குறுக்கவில்லை.
- source_word: εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: தமது பரலோக அரசுக்குள்
  rationale: εἰς என்பதன் ‘உள்ளே’ என்ற இயக்கத்தை ‘அரசுக்குள்’ காக்கிறது. ἐπουράνιον என்பதற்கு ‘பரலோக’ என்றும், αὐτοῦ ஆண்டவரைக் குறிப்பதால் மரியாதைத் தற்சுட்டாக ‘தமது’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: ᾧ ἡ δόξα
  choice: அவருக்கே மகிமை உண்டாவதாக
  rationale: வினையற்ற கிரேக்கத் துதிமொழியின் மகிமைச் சாற்றும் வலிமையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும்
  rationale: சொல்லுக்கு சொல் ‘யுகங்களின் யுகங்களுக்குள்’ என்றாலும், முடிவில்லாத காலத்தைச் சுட்டும் கிரேக்க மரபுத்தொடருக்கு ‘என்றென்றும்’ இயல்பான தமிழ் இணையாகும்.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற ஒலிபெயர்ப்பு; உறுதிப்படுத்தும் வழிபாட்டு மொழியைப் பேணுகிறது.
theological_decisions:
- issue: நிகழ்கால விடுதலைக்கும் இறுதி இரட்சிப்புக்கும் உள்ள உறவு
  choice: தீய செயலிலிருந்து ஆண்டவர் விடுவிப்பதையும், பரலோக அரசுக்குள் பாதுகாப்பாகக் கொண்டுசேர்ப்பதையும் வேறுபடுத்திக் காட்டுகிறது; பவுல் உடல் மரணத்திலிருந்து நிச்சயமாகத் தப்புவார் என்று கூறவில்லை.
  alternative: ஆண்டவர் பவுலை உடல் மரணத்திலிருந்து விடுவிப்பார் என்று வாசித்தல்.
  rationale: ῥύσεταί மற்றும் σώσει என்ற இரு வினைகளும், ‘தமது பரலோக அரசுக்குள்’ என்ற இலக்கும் சேர்ந்து, தற்கால உடல் பாதுகாப்பை மட்டும் அல்லாமல் தீமையிலிருந்து காத்து இறுதி இலக்கை அடையச் செய்வதைக் காட்டுகின்றன. மொழிபெயர்ப்பு இந்த இறையியல் இழுபறியைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘பரலோக அரசு’ என்பது βασιλεία என்பதன் ஆட்சி/அரசு நுணுக்கத்தைப் பேணுகிறது. ‘பாதுகாப்பாகக் கொண்டுசேர்ப்பார்’ இயல்பான தமிழையும் σώσει εἰς என்பதன் பாதுகாப்பு மற்றும் இலக்கை நோக்கிய இயக்கத்தையும் இணைக்கிறது.
