id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: ta
  text: இனிமேல், நீதியின்[a] கிரீடம் எனக்காக வைக்கப்பட்டிருக்கிறது. அதை அந்த நாளில் நீதியுள்ள நீதிபதியாகிய ஆண்டவர் எனக்கு வழங்குவார்; எனக்கு மட்டுமல்ல, அவர் வெளிப்படுவதை நேசித்திருக்கிற அனைவருக்கும் கூட வழங்குவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நியாயத்தின் கிரீடம்.’ கிரேக்கச் சொல் ‘நீதி’ என்பதையும், சில சூழல்களில் ‘நியாயம்’ என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: இனிமேல்
  rationale: முந்தைய வசனத்தில் ஓட்டத்தை முடித்ததாகப் பவுல் கூறியதைத் தொடர்ந்து, இனி எதிரில் மீந்திருப்பதைச் சுட்டும் காலப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπόκειταί
  choice: வைக்கப்பட்டிருக்கிறது
  rationale: ஒதுக்கி வைக்கப்பட்டு இப்போது தயார் நிலையில் இருப்பதைக் குறிக்கும் வினையின் உருவகத்தையும் நிகழ்நிலை நுணுக்கத்தையும் காக்கிறது.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: நீதியின் கிரீடம்
  rationale: கிரேக்க உடைமைத் தொடர் கொண்டுள்ள பல்வேறு சாத்தியமான உறவுகளைத் தீர்மானிக்காமல் இயல்பாகப் பாதுகாக்கிறது.
- source_word: δικαιοσύνης
  choice: நீதி
  rationale: தமிழில் இச்சூழலில் தார்மீக நேர்மையையும் நியாயமான தீர்ப்பையும் உள்ளடக்கக்கூடிய சொல்லாக உள்ளது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀποδώσει
  choice: வழங்குவார்
  rationale: தகுந்ததை அளித்தல் என்ற பொருளையும் வெற்றிக் கிரீட உருவகத்தையும் இயல்பாக வெளிப்படுத்துகிறது; தண்டனை சார்ந்த 'திருப்பிச் செலுத்துதல்' என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் இணை; உரை குறிப்பிடாத விரிவாக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: அந்த நாளில்
  rationale: இறுதித் தீர்ப்புக்குரிய நாளைக் குறிக்கும் சொற்றொடரைத் தமிழில் இயல்பாகவும் அதன் இறுதிக்கால வலிமையுடனும் தருகிறது.
- source_word: ὁ δίκαιος κριτής
  choice: நீதியுள்ள நீதிபதி
  rationale: ஆண்டவரின் தீர்ப்பளிக்கும் குணத்தைத் தெளிவாகக் கூறும் பெயரடைத் தொடரை இயல்பான தமிழில் காக்கிறது.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: நேசித்திருக்கிற அனைவருக்கும்
  rationale: கடந்த காலத்தில் தொடங்கி தற்போதுவரை நிலைத்துள்ள மனப்பாங்கைச் சுட்டும் perfect participle-இன் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἐπιφάνειαν
  choice: வெளிப்படுவதை
  rationale: காணத்தக்க விதத்தில் தோன்றுதல் என்ற நேரடிப் பொருளைக் காக்கிறது; அதை விரிவான 'வருகை' என்ற கருத்துடன் ஒன்றாக்கவில்லை.
- source_word: αὐτοῦ
  choice: அவர்
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆண்டவரையே இயல்பாகச் சுட்டுகிறது.
theological_decisions:
- issue: ‘நீதியின் கிரீடம்’ என்பதன் பொருள்
  choice: கிரேக்க உடைமைத் தொடரைத் தீர்மானிக்காமல் ‘நீதியின் கிரீடம்’ என்று வைத்தல்
  alternative: நீதிக்காக வழங்கப்படும் கிரீடம்; நீதியே கிரீடமாக இருப்பது; நியாயத்தீர்ப்பு அல்லது குற்றமற்றவர் என உறுதிப்படுத்தப்படுதலின் கிரீடம்
  rationale: τῆς δικαιοσύνης என்ற உடைமைத் தொடர் இவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தவில்லை; எனவே உரையின் உண்மையான இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ‘ஆண்டவர்’ என்பவர் யார்
  choice: தலைப்பை ‘ஆண்டவர்’ என்றே வைத்து, சூழலில் இயேசு கிறிஸ்துவைக் குறிப்பதாகப் புரிந்துகொள்ளுதல்
  alternative: பொதுவாகக் கடவுளைக் குறித்தல்
  rationale: ‘அவர் வெளிப்படுவது’ என்ற உடனடிச் சூழலும் மேய்ப்பர் திருமுகங்களின் பயன்பாடும் கிறிஸ்துவை வலுவாகச் சுட்டுகின்றன; இருப்பினும் மொழிபெயர்ப்பு உரையில் பெயரை விரித்துச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்கேற்ப மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; ‘வழங்குவார்’ என்ற வினை இறுதி வாக்கியத்தில் மீண்டும் இடப்பட்டு பொருள் தெளிவாக்கப்பட்டுள்ளது.
