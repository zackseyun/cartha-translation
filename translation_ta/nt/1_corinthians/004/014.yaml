revisions:
- from: உங்களை வெட்கப்படுத்துவதற்காக[a] இவற்றை நான் எழுதவில்லை; மாறாக, என் அன்புக்குரிய பிள்ளைகளான உங்களை அறிவுறுத்துகிறேன்[b].
  to: உங்களை வெட்கப்படுத்துவதற்காக[a] இவற்றை நான் எழுதவில்லை; மாறாக, என் அன்பான பிள்ளைகளான உங்களை அறிவுறுத்துகிறேன்[b].
  rationale: A single lexical revision changes ‘அன்புக்குரிய’ to ‘அன்பான’ so that the Tamil unambiguously expresses the passive sense ‘beloved’ in ἀγαπητά. The source’s contrast, plural object, filial imagery, and pastoral corrective sense are otherwise retained.
