lexical_decisions:
- source_word: ἐντρέπων
  choice: வெட்கப்படுத்துவதற்காக
  rationale: οὐκ என்பதுடன் வரும் இச்சொல், அவர்களை அவமானத்துக்குள்ளாக்குவது பவுலின் நோக்கம் அல்ல என்பதைத் தெரிவிக்கிறது. ‘வெட்கப்படுத்துதல்’ என்பது கண்ணியம்–அவமானம் சார்ந்த வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: γράφω ταῦτα
  choice: இவற்றை நான் எழுதவில்லை
  rationale: γράφω என்பதன் நிகழ்காலக் கடித நடை தமிழில் இயல்பாக நிகழ்காலமாகவே தரப்பட்டுள்ளது; ταῦτα என்பதன் பன்மை ‘இவற்றை’ என்று காக்கப்பட்டுள்ளது.
- source_word: ἀλλ’
  choice: மாறாக
  rationale: எதிர்மறையான நோக்கத்துக்கும் நேர்மறையான மேய்ப்புப் பணிக்கும் இடையிலான தெளிவான முரண்பாட்டைக் காட்டுகிறது.
- source_word: ὡς τέκνα μου ἀγαπητὰ
  choice: என் அன்புக்குரிய பிள்ளைகளான உங்களை
  rationale: τέκνα பாலினத்தால் கட்டுப்படாத குடும்ப உறவைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்கும்படி ὡς குறிக்கும் உறவுசார் நிலை பெயரெச்சத் தொடராக வழங்கப்பட்டுள்ளது; ‘அன்புக்குரிய’ என்பது பவுலின் பாசத்தைக் காக்கிறது.
- source_word: νουθετῶν
  choice: அறிவுறுத்துகிறேன்
  rationale: இந்த வினை எச்சரிக்கை, திருத்தம், நன்னெறி வழிகாட்டுதல் ஆகியவற்றை உள்ளடக்குகிறது. ‘அறிவுறுத்துதல்’ தண்டனைத் தொனியின்றி அதன் திருத்தும் வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
