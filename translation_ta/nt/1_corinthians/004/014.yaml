  choice: ‘என் அன்புக்குரிய பிள்ளைகளான உங்களை அறிவுறுத்துகிறேன்’
  alternative: ‘என் அன்புக்குரிய பிள்ளைகளான உங்களை எச்சரிக்கிறேன்’
  rationale: அவமானப்படுத்துவதை மறுத்து அறிவுறுத்துவதை வலியுறுத்தும் அமைப்பு, கடுமையான கண்டனத்தைவிட அன்போடு செய்யப்படும் திருத்தத்தைக் காட்டுகிறது. அதேவேளை ‘அறிவுறுத்துகிறேன்’ என்பது νουθετῶν என்பதன் திருத்தும் ஆற்றலை மெலிதாக்கவில்லை.
