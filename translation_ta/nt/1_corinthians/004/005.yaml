source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: ta
  text: ஆகவே, காலம் வருவதற்கு முன், ஆண்டவர் வரும்வரை எதைக் குறித்தும் தீர்ப்பளிக்காதீர்கள். இருளில் மறைந்திருப்பவற்றை அவர் வெளிச்சத்திற்குக் கொண்டுவருவார்; இதயங்களின் நோக்கங்களையும் வெளிப்படுத்துவார்[a]. அப்போது ஒவ்வொருவருக்கும் கடவுளிடமிருந்து பாராட்டு கிடைக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நோக்கங்கள்” என்பதற்கு “எண்ணங்கள்,” “திட்டங்கள்,” அல்லது “உள்நோக்கங்கள்” என்றும் பொருள் கொள்ளலாம். ஆண்டவர் வரும்போது மறைந்திருப்பவற்றை வெளிப்படுத்தி அளிக்கும் இறுதி மதிப்பீட்டை இது குறிக்கிறது.
    reason: lexical_alternative_and_context
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: காலம் வருவதற்கு முன் எதைக் குறித்தும் தீர்ப்பளிக்காதீர்கள்
  rationale: πρὸ καιροῦ என்பதில் ‘நியமிக்கப்பட்ட’ என்பது வெளிப்படையாக இல்லாததால் அதைச் சேர்க்காமல், சரியான காலத்திற்கு முந்திய தீர்ப்பைத் தடுக்கிற கருத்தைத் தருகிறது; τι என்பதன் பரந்த பொருளையும் காக்கிறது.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: ஆண்டவர் வரும்வரை காத்திருங்கள்
  rationale: தமிழில் முழுமையான, இயல்பான கட்டளையாக அமைய ‘காத்திருங்கள்’ சூழலிலிருந்து தெளிவாக்கப்பட்டுள்ளது; கால எல்லையான ஆண்டவரின் வருகை மாறாமல் உள்ளது.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: இருளில் மறைந்திருப்பவற்றை அவர் வெளிச்சத்திற்குக் கொண்டுவருவார்
  rationale: வெளிப்படுத்துதல் என்ற உருவகப் பொருளையும் இருள்–வெளிச்சம் உருவகத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: இதயங்களின் நோக்கங்களையும் வெளிப்படுத்துவார்
  rationale: βουλαί என்பதன் திட்டங்கள், எண்ணங்கள், உள்நோக்கங்கள் ஆகியவற்றை உள்ளடக்கக்கூடிய பரந்த சொல்லாக ‘நோக்கங்கள்’ தேர்ந்தெடுக்கப்பட்டது; ‘இதயங்கள்’ என்ற வேதாகம உள்ளார்ந்த மனிதன் குறித்த உருவகம் காக்கப்பட்டது.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: ஒவ்வொருவருக்கும் உரிய பாராட்டு கடவுளிடமிருந்து கிடைக்கும்
  rationale: ἑκάστῳ என்பதன் பகிர்ந்தளிக்கும் தனிப்பட்ட பொருளை ‘ஒவ்வொருவருக்கும்’ தெரிவிக்கிறது; ἀπὸ τοῦ θεοῦ என்ற மூலத்தையும் தெளிவாகக் காக்கிறது. ‘உரிய’ என்பது ஒவ்வொருவருக்கான பாராட்டு என்ற தொடரை இயல்பாக்குகிறது; எல்லாரும் ஒரே அளவு பாராட்டைப் பெறுவர் என்று கூறவில்லை.
theological_decisions:
- issue: தீர்ப்பின் பரப்பும் காலமும்
  choice: ஆண்டவரின் வருகைக்கும் இறுதி வெளிப்படுத்தலுக்கும் முன் மனிதர் அளிக்கும் காலத்துக்கு முந்திய தீர்ப்பை வசனம் தடுக்கிறது.
  alternative: எல்லா வகையான பகுத்தறிதலையும் தீர்ப்பையும் முற்றிலும் தடை செய்கிறது.
  rationale: கிரேக்க வாக்கியம் தடையை ‘ஆண்டவர் வரும்வரை’ என்ற காலவரம்போடு இணைக்கிறது. மொழிபெயர்ப்பு தடையைப் பரந்ததாகவே வைத்தாலும், வேறு இடங்களிலுள்ள எல்லா பகுத்தறிதலையும் மறுக்கும் விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ὁ κύριος என்பவரின் அடையாளம்
  choice: ‘ஆண்டவர்’ என்பது வரவிருக்கும் நியாயாதிபதியான இயேசுவைக் குறிக்கிறது; பெயரை விளக்கமாகச் சேர்க்காமல் பட்டப்பெயர் மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: பொதுவாகக் கடவுளைக் குறிக்கும் பெயரிடப்படாத குறிப்பு.
  rationale: பவுலின் பயன்பாட்டிலும் வருகை சார்ந்த சூழலிலும் இயேசுவே இயல்பான குறிப்பு; ஆயினும் மூலத்தின் நேரடி சொல்லாட்சியைப் பாதுகாக்க ‘இயேசு’ என்று விரிவாக்கவில்லை.
- issue: ஒவ்வொருவருக்கும் கிடைக்கும் பாராட்டு
  choice: இறுதி மதிப்பீட்டில் கடவுளிடமிருந்து ஒவ்வொருவருக்கும் உரிய பாராட்டு வரும் என்ற நேர்முகமான சொல்லாட்சி காக்கப்பட்டது.
  alternative: சிலருக்கு மட்டுமே பாராட்டு கிடைக்கும், மற்றவர்களுக்கு இங்கு குறிப்பிடப்படாத கண்டனம் மட்டுமே கிடைக்கும் என்று வெளிப்படையாக மொழிபெயர்ப்பது.
  rationale: ἑκάστῳ என்ற சொல்லின் வியப்பூட்டும் பரந்த வடிவத்தையும் வசனத்தின் நேர்மறையான ἔπαινος சொல்லையும் குறுக்காமல் வைத்துள்ளது; அதன் துல்லியமான பகிர்வை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘தீர்ப்பளிக்காதீர்கள்,’ ‘ஆண்டவர்,’ ‘இதயங்கள்’ போன்ற சொற்கள் மூலத்தின் நீதித்துறை, கிறிஸ்துவியல், உள்ளார்ந்த மனிதன் சார்ந்த மொழியைப் பாதுகாக்கின்றன. ஒரே அடிக்குறி குறியீடு [a] முதன்மை உரையில் சரியான இடத்தில் இடம்பெற்றுள்ளது.
