review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the inferential opening, the Lord's future disclosure of what is hidden, the revealing of the hearts' purposes, and praise from God. However, “காத்திருங்கள்” introduces an additional imperative (‘wait’) that is not present in Greek; the temporal clause modifies the prohibition against judging.
  naturalness: The proposed revision uses clear, dignified modern standard Tamil and retains the original sentence relationship without an artificially added command.
  terminology: “ஆண்டவர்,” “தீர்ப்பளிக்காதீர்கள்,” “இதயங்கள்,” “நோக்கங்கள்,” and “கடவுள்” appropriately convey the source terms and maintain a suitable biblical register. Removing “உரிய” before “பாராட்டு” avoids adding the idea of deserved or fitting praise beyond the Greek wording.
  issues:
  - severity: medium
    issue: An added command appears in “ஆண்டவர் வரும்வரை காத்திருங்கள்.”
    rationale: ἕως ἂν ἔλθῃ ὁ κύριος is a temporal limit on μὴ ... κρίνετε (‘do not judge ... until the Lord comes’), not an independent imperative to wait. The added command can alter the force and scope of the verse.
  - severity: low
    issue: “ஒவ்வொருவருக்கும் உரிய பாராட்டு” adds ‘appropriate/deserved.’
    rationale: ὁ ἔπαινος γενήσεται ἑκάστῳ states that praise will come/be given to each person from God; “உரிய” is not required and can add an evaluative nuance not explicitly expressed.
