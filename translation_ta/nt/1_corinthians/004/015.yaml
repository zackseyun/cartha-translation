source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: ta
  text: கிறிஸ்துவில் உங்களுக்குப் பல்லாயிரக்கணக்கான[a] பாதுகாவலர்கள்[b] இருந்தாலும், தந்தைகள் பலர் இல்லை. ஏனெனில், கிறிஸ்து இயேசுவில் நற்செய்தியின் மூலம் நான் உங்களுக்குத் தந்தையானேன்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘பத்தாயிரம்’; இங்கு மிகப் பெரிய எண்ணிக்கையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கண்காணிப்பாளர்கள்’, ‘வழிகாட்டிகள்’. கிரேக்கச் சொல் முதன்மையாக வகுப்பறை ஆசிரியரைக் குறிக்காமல், ஒரு பிள்ளையைக் கண்காணித்து வழிநடத்தும் பொறுப்புடையவரைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: கிரேக்கத்தில் நேரடியாக, ‘நான் உங்களைத் தந்தையாகப் பெற்றேன்’ அல்லது ‘நான் உங்களைப் பிறப்பித்தேன்’ என்பதுபோன்ற தந்தை உருவகம். நற்செய்தியின் மூலம் அவர்கள் விசுவாசத்திற்கு வந்ததில் பவுலுக்கு இருந்த தந்தைக்குரிய பங்கை இது உருவகமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυρίους
  choice: பல்லாயிரக்கணக்கான
  rationale: இச்சொல்லின் நேரடிப் பொருள் ‘பத்தாயிரம்’ என்றாலும், இங்கு மிகப் பெரிய எண்ணிக்கையைச் சுட்டும் மரபுத்தொடராக வருகிறது. ‘பல்லாயிரக்கணக்கான’ என்பது அந்த வலியுறுத்தலையும் ‘தந்தைகள் பலர் இல்லை’ என்ற முரண்பாட்டையும் இயல்பாகத் தருகிறது.
- source_word: παιδαγωγοὺς
  choice: பாதுகாவலர்கள்
  rationale: கிரேக்க-ரோமச் சூழலில் παιδαγωγός என்பவர் முதன்மையாக வகுப்பறை ஆசிரியர் அல்ல; ஒரு பிள்ளையைக் கண்காணித்து, வழிநடத்தி, ஒழுங்குபடுத்தும் பொறுப்புடைய பாதுகாவலர். ‘பாதுகாவலர்கள்’ அந்தப் பரந்த சமூகப் பங்கைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: கிறிஸ்துவில் / கிறிஸ்து இயேசுவில்
  rationale: பவுலின் தனிச்சிறப்பான ἐν என்ற உறவு/இணைவு மொழியை விளக்கமாக விரிக்காமல் ‘-இல்’ மூலம் தக்கவைக்கிறது. Χριστός பட்டப்பெயராக இருந்தாலும், நவீனத் தமிழ் வேதாகம நடையில் நிலைபெற்ற ‘கிறிஸ்து’ பயன்படுத்தப்படுகிறது.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: நற்செய்தியின் மூலம்
  rationale: διά + உரிமை வேற்றுமை இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கிறது. ‘மூலம்’ என்பது நற்செய்தியே அவர்கள் விசுவாசத்திற்கு வந்த வழிமுறை என்ற கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: ἐγέννησα
  choice: உங்களுக்குத் தந்தையானவன் நானே
  rationale: γεννάω என்பதன் அடிப்படை உருவகம் ‘பெறுதல்/பிறப்பித்தல்’. முன்னுள்ள ‘தந்தைகள்’ என்பதோடு இணைந்து இது பவுலின் தந்தை உருவகத்தைச் சுட்டுகிறது. தமிழில் ‘உங்களைப் பெற்றெடுத்தேன்’ என்பது பெரும்பாலும் தாயின் பிரசவத்தை உணர்த்தக்கூடும்; ஆகவே உருவகத்தை இயல்பாகவும் தெளிவாகவும் தெரிவிக்க இவ்வாறு வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: கொரிந்தியர்களின் விசுவாசத் தொடக்கத்தில் பவுலின் தந்தை உருவகத்தை எவ்வாறு தருவது
  choice: ‘நற்செய்தியின் மூலம் உங்களுக்குத் தந்தையானவன் நானே’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘நான் உங்களைப் பெற்றெடுத்தேன்’ அல்லது ‘நான் உங்கள் ஆன்மீகத் தந்தையானேன்’
  rationale: முதல் மாற்று தமிழில் தாய்மையை முதன்மையாக உணர்த்தலாம்; இரண்டாவது மூலத்தில் இல்லாத ‘ஆன்மீக’ என்ற விளக்கத்தைச் சேர்த்து, தேவையற்ற சமயப் பதவிப் பொருளை உருவாக்கலாம். தேர்ந்த வடிவம் நற்செய்தியின் வழியாக அவர்களை விசுவாசத்திற்குக் கொண்டுவந்த பவுலின் தனித்துவமான பங்கைத் தெரிவிக்கிறது; ஆனால் அதற்கு அப்பாற்பட்ட திருச்சபை அல்லது அருளடையாளக் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. ‘கிறிஸ்துவில்’ என்ற பவுலின் சுருக்கமான உறவுமொழியும், ‘பாதுகாவலர்கள்—தந்தைகள்’ என்ற எதிர்மறை ஒப்புமையும் தக்கவைக்கப்பட்டுள்ளன. வாக்கிய அமைப்பு இயல்பான தமிழுக்கேற்ப இரு வாக்கியங்களாக வழங்கப்பட்டுள்ளது.
