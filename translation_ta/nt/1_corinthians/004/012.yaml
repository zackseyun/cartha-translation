id: 1CO.4.12
reference: 1 Corinthians 4:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: ta
  text: மேலும், எங்கள் சொந்தக் கைகளால் வேலை செய்து கடுமையாக உழைக்கிறோம். நாங்கள் பழித்துரைக்கப்படும்போது[a] ஆசீர்வதிக்கிறோம்; துன்புறுத்தப்படும்போது சகித்துக்கொள்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வசைசொற்களால் இகழப்படும்போது.”
    reason: λοιδορούμενοι என்பது பழித்துரைத்தல், வசைபாடுதல் ஆகிய நெருங்கிய அர்த்தங்களைக் கொண்டிருப்பதால் மாற்று மொழிபெயர்ப்பு தரப்படுகிறது.
lexical_decisions:
- source_word: κοπιῶμεν
  choice: கடுமையாக உழைக்கிறோம்
  rationale: வெறும் வேலை செய்வதை அல்லாமல், களைப்பை உண்டாக்கும் கடின உழைப்பை இந்தச் சொல் குறிக்கிறது.
- source_word: ἐργαζόμενοι
  choice: வேலைசெய்து
  rationale: எவ்வாறு கடுமையாக உழைக்கிறார்கள் என்பதை விளக்கும் பங்கேற்புவினையாக இருப்பதால், கையால் செய்யும் வேலையைக் குறிக்கும் இயல்பான சொல்லாக்கம் பயன்படுத்தப்பட்டது.
- source_word: ταῖς ἰδίαις χερσίν
  choice: எங்கள் சொந்தக் கைகளால்
  rationale: ἰδίαις தரும் தற்சார்பு மற்றும் தனிப்பட்ட கையுழைப்பின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: λοιδορούμενοι
  choice: பழித்துரைக்கப்படும்போது
  rationale: வாய்மொழியாக நிந்தித்தல் அல்லது வசைபாடுதல் என்ற செயப்பாட்டு அர்த்தத்தையும், இத்தொடரில் உள்ள சூழ்நிலைப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: εὐλογοῦμεν
  choice: ஆசீர்வதிக்கிறோம்
  rationale: தங்களுக்கு எதிரான பழிப்புக்குப் பதிலாக நன்மையை வேண்டிப் பேசுவதைச் சுட்டும் முக்கிய வேதாகமச் சொல்லைத் தக்கவைக்கிறது.
- source_word: διωκόμενοι
  choice: துன்புறுத்தப்படும்போது
  rationale: இங்கு வெறுமனே பின்தொடரப்படுதல் அல்ல, பகைமையுடன் துன்புறுத்தப்படுதல் என்பதே சூழலுக்குப் பொருந்துகிறது.
- source_word: ἀνεχόμεθα
  choice: சகித்துக்கொள்கிறோம்
  rationale: வெளிப்படையான செயப்படுபொருளைச் சேர்க்காமல், பகைமையான நடத்தையைப் பொறுத்துத் தாங்குதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தவறான நடத்தைக்கு அளிக்கப்படும் நெறிசார் பதில்
  choice: பழிப்புக்கு ஆசீர்வாதத்தாலும் துன்புறுத்தலுக்குச் சகிப்புத்தன்மையாலும் அப்போஸ்தலர்கள் பதிலளித்த நடத்தை பற்றிய விளக்கமாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை எல்லாருக்குமான வெளிப்படையான கட்டளையாக விரித்துரைத்தல்.
  rationale: கிரேக்க உரை அப்போஸ்தலர்களின் நடைமுறையைச் சுருக்கமான எதிரிணைகளாக விவரிக்கிறது; அதன் நெறிசார் வலிமையைப் பாதுகாத்தாலும், உரையில் இல்லாத கட்டளை வடிவம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. கிரேக்கத்தின் இரண்டு பங்கேற்புவினை–முதன்மைவினை இணைகளும் ‘…ப்படும்போது …கிறோம்’ என்ற ஒத்த அமைப்பில் பாதுகாக்கப்பட்டுள்ளன.
