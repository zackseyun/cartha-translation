source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: ta
  text: மேசியாவுக்காக[a] நாங்கள் மூடர்கள்; ஆனால் மேசியாவுக்குள்[b] நீங்கள் ஞானிகள். நாங்கள் பலவீனர்கள்; ஆனால் நீங்கள் வலிமையானவர்கள். நீங்கள் மதிக்கப்படுபவர்கள்; ஆனால் நாங்களோ அவமதிக்கப்படுபவர்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேசியாவின் நிமித்தம்’ அல்லது ‘மேசியாவின் காரணமாக’ என்றும் மொழிபெயர்க்கலாம். διὰ Χριστόν என்ற கிரேக்கச் சொற்றொடர் காரணத்தையோ நோக்கத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘மேசியாவில்’ என்றும் மொழிபெயர்க்கலாம். இது பவுல் வழக்கமாகப் பயன்படுத்தும் ἐν Χριστῷ என்ற சொற்றொடர்; ‘கிறிஸ்துவுக்குள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘மதிக்கப்படுபவர்கள்,’ ‘அவமதிக்கப்படுபவர்கள்’ என்பவை வெறும் உள்ளுணர்வைக் குறிக்காமல், பிறரின் பார்வையிலான பொது மதிப்பையும் அவமான நிலையையும் குறிக்கின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: மூடர்கள்
  rationale: கொரிந்தியர்களின் தன்னம்பிக்கைக்கு எதிராகப் பவுல் பயன்படுத்தும் கூர்மையான, நையாண்டியான பெயரடைப் பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: διὰ Χριστόν
  choice: மேசியாவுக்காக
  rationale: διά + accusative இங்கு காரணத்தையோ ஒருவரின் நிமித்தமாக இருப்பதையோ குறிக்கலாம்; ‘மேசியாவுக்காக’ தமிழில் இரண்டையும் ஓரளவு திறந்தவையாக வைத்திருக்கிறது.
- source_word: φρόνιμοι
  choice: ஞானிகள்
  rationale: μωροὶ என்பதற்கு நேரான எதிர்ச்சொல்லாக இருந்து, வசனத்தின் நையாண்டி நிறைந்த இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவில்
  rationale: பவுலின் சிறப்பான ἐν Χριστῷ சொல்லாட்சியை விளக்கவுரையாக மாற்றாமல், தமிழில் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: பலவீனர்கள் / வலிமையானவர்கள்
  rationale: உடல், சமூக நிலை, ஆற்றல் ஆகியவற்றில் எதையும் தேவையின்றிக் குறிப்பாக்காமல், கிரேக்க எதிரிணையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔνδοξοι / ἄτιμοι
  choice: மதிக்கப்படுகிறவர்கள் / அவமதிக்கப்படுகிறவர்கள்
  rationale: தனிப்பட்ட உள்ளுணர்வை விட பிறர் பார்வையிலான பொது மதிப்பும் அவமதிப்பும் இங்கு முன்னிலையாக இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἡμεῖς / ὑμεῖς
  choice: நாங்கள் / நீங்கள்
  rationale: கிரேக்கத்தில் வலியுறுத்தப்பட்டுள்ள இரு குழுக்களுக்கிடையேயான கூர்மையான வேறுபாட்டைத் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்வசனத்தின் இரு இடங்களிலும் பட்டப்பெயரின் கருத்தை வெளிப்படையாக வைத்திருக்க ‘மேசியா’ பயன்படுத்தப்பட்டது; அதை வெறும் தனிப்பெயராக மாற்றவில்லை.
- issue: ἐν Χριστῷ என்ற பவுலின் சொல்லாட்சி
  choice: மேசியாவில்
  alternative: மேசியாவுடன் ஒன்றிணைந்தவர்கள் என்ற முறையில்
  rationale: ஒன்றிப்பு, உறவு, பிரதிநிதித்துவம் போன்ற பல இறையியல் நுணுக்கங்களில் ஒன்றை மட்டும் தீர்மானிக்காமல், மூலத்தின் சுருக்கத்தையும் திறந்த பொருளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூன்று எதிரிணைகளின் நையாண்டியான தாளத்தைக் காக்க ‘நாங்கள்—நீங்கள்’ என்ற அமைப்பும், கடைசி பகுதியில் ‘நாங்களோ’ என்ற வலியுறுத்தலும் பயன்படுத்தப்பட்டன.
