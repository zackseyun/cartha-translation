id: 1CO.4.21
reference: 1 Corinthians 4:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί θέλετε; ἐν ῥάβδῳ ἔλθω πρὸς ὑμᾶς, ἢ ἐν ἀγάπῃ πνεύματί τε πραΰτητος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: ta
  text: உங்களுக்கு என்ன வேண்டும்? நான் பிரம்போடு உங்களிடம் வர வேண்டுமா, அல்லது அன்போடும் சாந்தமான மனப்பான்மையோடும்[a] வர வேண்டுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு விதமாக, “அன்போடும் சாந்தத்தின் ஆவியோடும்.” இங்குள்ள “ஆவி” என்பது பவுலின் சாந்தமான உள்ளநிலையைக் குறிக்கலாம்; சிலர் இதைப் பரிசுத்த ஆவியானவரின் செயலுக்கான மறைமுகக் குறிப்பாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: உங்களுக்கு என்ன வேண்டும்?
  rationale: நேரடியான வினாவாக உள்ள கிரேக்கச் சொற்றொடரின் சவாலான தொனியை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἐν ῥάβδῳ
  choice: பிரம்போடு
  rationale: ῥάβδος என்பதன் நேரடியான ‘பிரம்பு/கோல்’ உருவகத்தைப் பேணுகிறது. ‘தண்டனையோடு’ என்று மொழிபெயர்ப்பது உருவகத்தை விளக்கமாக மாற்றிவிடும்.
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: நான் ... உங்களிடம் வர வேண்டுமா
  rationale: ஆலோசனை வினாவாக வரும் aorist subjunctive-இன் பொருளையும் பவுலின் சொல்லாட்சியின் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἢ
  choice: அல்லது
  rationale: பவுல் வரக்கூடிய இரு முறைகளுக்கிடையிலான தெளிவான மாற்றுத் தேர்வைக் குறிக்கிறது.
- source_word: ἐν ἀγάπῃ
  choice: அன்போடும்
  rationale: ‘பிரம்போடு’ என்பதற்கு இணையான அமைப்பில் அன்பை அவர் வரும் விதமாகக் காட்டுகிறது.
- source_word: πνεύματί τε πραΰτητος
  choice: சாந்தமான மனப்பான்மையோடும்
  rationale: இச்சூழலில் πνεῦμα பவுலின் உள்ளார்ந்த மனப்பான்மை அல்லது அணுகுமுறையைக் குறிக்க வாய்ப்பு அதிகம். πραΰτης என்பதன் மென்மை, சாந்தம், கட்டுப்படுத்தப்பட்ட அணுகுமுறை ஆகிய நுணுக்கங்களை ‘சாந்தமான’ என்பது சுருக்கமாகத் தருகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: πνεύματί τε πραΰτητος என்பதில் πνεῦμα குறிக்கும் பொருள்
  choice: பவுலின் சாந்தமான மனப்பான்மை அல்லது அணுகுமுறை
  alternative: பரிசுத்த ஆவியானவரின் செயலால் உண்டாகும் சாந்தம் அல்லது ‘சாந்தத்தின் ஆவி’
  rationale: உடனடி சூழல் பவுல் வரக்கூடிய இரு விதங்களை—கடுமையான ஒழுங்குபடுத்துதல் அல்லது அன்பான சாந்தம்—எதிரெதிராக வைக்கிறது. கிரேக்கத்தில் இங்கு குறிப்பிட்ட சுட்டுரை இல்லாததால் பரிசுத்த ஆவியானவரை நேரடியாகக் குறிப்பிடுவதாகத் தீர்மானிப்பது தேவையற்ற குறிப்பாக்கமாகும். அதேவேளை, மாற்றுப் புரிதலை அடிக்குறிப்பு வெளிப்படையாகப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பிரம்பு’ என்ற கூர்மையான ஒழுங்குபடுத்தும் உருவகம் விளக்கமாக மாற்றப்படாமல் காக்கப்பட்டுள்ளது. ‘சாந்தமான மனப்பான்மை’ இயல்பான தமிழுக்காகத் தேர்ந்தெடுக்கப்பட்டாலும், πνεῦμα பற்றிய உண்மையான பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
