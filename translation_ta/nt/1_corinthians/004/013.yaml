source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: ta
  text: அவதூறாகப் பேசப்படும்போது[a], நாங்கள் வேண்டிக்கொள்கிறோம்; இன்றுவரை நாங்கள் உலகத்தின் குப்பையைப் போலவும், எல்லாவற்றின் அழுக்கைப் போலவும்[b] ஆகியிருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பழித்துப் பேசப்படும்போது, நாங்கள் வேண்டுகிறோம்.” கிரேக்க வினைச்சொல் “வேண்டிக்கொள்,” “வலியுறுத்து,” அல்லது “ஊக்குவி” என்று பொருள்படலாம்; இச்சூழலில் அது பழிவாங்காத பதிலைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “குப்பை,” “அழுக்கு” என்று மொழிபெயர்க்கப்பட்டுள்ள இரு கிரேக்கச் சொற்களும் அரிதானவையும் மிகவும் வலிமையானவையும் ஆகும். சுத்தம் செய்யும்போது வாரி, துடைத்து, அல்லது சுரண்டி அகற்றப்படும் கழிவை அவை நினைவூட்டக்கூடும்; இங்கு மிகக் கடுமையான சமூக இழிவை வலியுறுத்துகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: அவதூறாகப் பேசப்படும்போது
  rationale: செயப்பாட்டு நிகழ்காலப் பெயரெச்சம், தீங்கிழைக்கும் விதத்தில் ஒருவரைக் குறித்துப் பேசப்படுவதைக் குறிக்கிறது. காலப்பொருளுடன் மொழிபெயர்ப்பது தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: παρακαλοῦμεν
  choice: நாங்கள் கனிவாக வேண்டிக்கொள்கிறோம்
  rationale: இங்கு பழிவாங்கும் பதிலுக்கு மாறாக இணக்கமான வேண்டுகோள் அல்லது சமாதானமான பேச்சைக் குறிக்கிறது. ‘கனிவாக’ என்பது வினையின் சூழல்சார் நயத்தை வெளிப்படுத்துகிறது; கிரேக்கத்தில் தனி வினையடை இல்லை என்பதால் மாற்று பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὡς
  choice: போலவும்
  rationale: முழுமையான அடையாளப்படுத்தலைவிட ஒப்புமையை அறிமுகப்படுத்துகிறது.
- source_word: περικαθάρματα
  choice: குப்பை
  rationale: தூய்மைப்படுத்தும்போது அகற்றப்படும் கழிவு அல்லது வாரியெறியப்படும் பொருள் என்ற வலுவான இழிவுப் படிமத்தை, இன்றைய சாதாரண தமிழில் புரியக்கூடிய விதத்தில் தருகிறது.
- source_word: τοῦ κόσμου
  choice: உலகத்தின்
  rationale: உறவு அல்லது உடைமையைச் சுட்டும் பிறப்புவேற்றுமையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐγενήθημεν
  choice: ஆகியிருக்கிறோம்
  rationale: கடந்த நிகழ்வின் தற்போதைய விளைவு தொடர்வதை, இறுதியிலுள்ள ‘இன்றுவரை’ என்பதோடு இயல்பாக இணைக்கிறது.
- source_word: πάντων
  choice: எல்லாவற்றின்
  rationale: சொல்லின் பரந்த, பெரும்பாலும் நடுநிலைப் பன்மை அர்த்தத்தை மக்களுக்குள் மட்டும் குறுக்காமல் காக்கிறது.
- source_word: περίψημα
  choice: அழுக்கு
  rationale: துடைத்து அல்லது சுரண்டி அகற்றப்படும் அருவருப்பான எச்சம் என்ற அரிய சொல்லின் வலிமையையும் சமூக இழிவையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: ἕως ἄρτι
  choice: இன்றுவரை
  rationale: எழுதப்படும் தற்போதைய தருணம் வரையிலும் நிலை தொடர்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: περικαθάρματα / περίψημα என்ற இணை இழிவுச் சொற்களை எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘குப்பை’ / ‘அழுக்கு’ என்ற வலுவான சமூக இழிவுச் சொற்களாக மொழிபெயர்த்து, பலிப்பரிகாரப் பொருளை முதன்மை உரையில் சேர்க்காமல் விடுதல்
  alternative: ‘அசுத்தம்’ / ‘சுரண்டியெறியப்படும் கழிவு’ என்று இன்னும் சொற்படியான வடிவில் தருதல், அல்லது சுத்திகரிப்பு/பலியாடு சார்ந்த சாத்தியமான பின்னணியை உரையிலேயே வெளிப்படுத்துதல்
  rationale: உடனடிச் சூழல் அப்போஸ்தலர்கள் உலகத்தின் பார்வையில் அடைந்த அவமானத்தையும் புறக்கணிப்பையும் வலியுறுத்துகிறது. சுத்திகரிப்பு அல்லது பரிகாரப் பின்னொலி சாத்தியமாயினும் அது உறுதியான முதன்மைப் பொருள் அல்ல; ஆகவே அதை அடிக்குறிப்பில் மட்டும் குறிப்பிடுவது இறையியல் மிகைவைக் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான ஆனால் மூலத்தின் கடுமையைத் தணிக்காத நடை. இணை உருவகங்களைத் தெளிவாக வைத்துள்ளதுடன், அரிய கிரேக்கச் சொற்களின் சாத்தியமான சுத்திகரிப்பு பின்னணியை அடிக்குறிப்பில் பாதுகாக்கிறது.
