id: 1CO.4.3
reference: 1 Corinthians 4:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: ta
  text: ஆனால், உங்களாலோ மனிதரின் மதிப்பீட்டினாலோ நான் ஆராயப்படுவது எனக்கு மிகச் சிறிய காரியமே. ஆனால், நான் என்னையேகூட ஆராய்வதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμοὶ
  choice: எனக்கு
  rationale: இது தொடர்பைக் குறிக்கும் வேற்றுமை வடிவம்; பவுலின் தனிப்பட்ட கண்ணோட்டத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: மிகச் சிறிய காரியமே
  rationale: மிகக் குறைந்த முக்கியத்துவமுடையது என்ற பொருளை, மூலத்தின் வலியுறுத்தலைப் பாதுகாத்து இயல்பாகத் தருகிறது.
- source_word: ἵνα
  choice: —வதோ ... —வதோ
  rationale: எது மிகச் சிறிய காரியம் என்பதன் உள்ளடக்கத்தைத் தமிழில் இயல்பான பெயரெச்சத் தொழிற்பெயர் அமைப்பால் அறிமுகப்படுத்துகிறது.
- source_word: ἀνακριθῶ / ἀνακρίνω
  choice: ஆராய்வதோ / ஆராய்வதில்லை
  rationale: கவனமாக விசாரித்தல் அல்லது மதிப்பீடு செய்தல் என்ற பொருளைத் தருகிறது; இறுதித் தீர்ப்பு என்ற அளவுக்கு பொருளை மிகைப்படுத்தாமல், இரு இடங்களிலும் சொல்லிணைப்பைப் பாதுகாக்கிறது.
- source_word: ὑφ’ ὑμῶν
  choice: நீங்கள் என்னை
  rationale: செயப்படுபொருள் அமைப்பைத் தமிழில் இயல்பான செய்வினை வடிவில் மாற்றி, செய்பவர் ‘நீங்கள்’ என்பதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: மனித நீதிமன்றம் ஒன்று என்னை ஆராய்வதோ
  rationale: சொல்லளவில் ‘மனித நாள்’ என்றிருந்தாலும், சூழலில் மனிதர்களின் விசாரணை அல்லது மதிப்பீட்டைக் குறிக்கும் மரபுத்தொடராக இருப்பதால், நவீன வாசகருக்குத் தெளிவாக ‘மனித நீதிமன்றம்’ என வழங்கப்படுகிறது.
- source_word: ἀλλ’ οὐδὲ
  choice: சொல்லப்போனால், ... என்னையேகூட ... இல்லை
  rationale: எதிர்மறையான வலியுறுத்தலையும் ‘கூட’ எனும் அதிகரிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐμαυτὸν
  choice: என்னையே
  rationale: தற்சுட்டுப் பொருளையும் மூலத்தில் உள்ள வலியுறுத்தலையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀνθρωπίνης ἡμέρας என்பதன் பொருள்
  choice: மனித நீதிமன்றம்
  alternative: மனித நாள்; மனித மதிப்பீடு
  rationale: சுற்றியுள்ள பகுதியில் கர்த்தருடைய வருகையின்போது நிகழும் மதிப்பீட்டுக்கு எதிராக மனிதர்களின் விசாரணையைக் குறிக்கிறது. காலண்டர் நாளைப் பற்றிய கூற்றாக வாசிக்கப்படுவதைத் தவிர்க்க மரபுத்தொடரின் பொருள் உரையில் தரப்பட்டு, சொல்லளவிலான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀνακρίνω இறுதித் தீர்ப்பைக் குறிக்கிறதா
  choice: ஆராய்
  alternative: தீர்ப்பிடு; விசாரி
  rationale: இச்சொல் இங்கு கவனமான ஆய்வு அல்லது மதிப்பீட்டைக் குறிக்க முடியும்; இறுதித் தீர்ப்பு என்று தேவையின்றி உறுதிப்படுத்தாமல், வசனத்தின் இரு பயன்பாடுகளிலும் ஒரே சொல்லை வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஆராய்’ என்பது நீதிமன்றச் சூழலையும் தன்மதிப்பீட்டையும் இணைக்கும் வகையில் இரு இடங்களிலும் பயன்படுத்தப்பட்டுள்ளது; [a] குறி உரையில் இடம்பெற்றுள்ளது.
