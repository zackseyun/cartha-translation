  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: ta
  text: இந்நேரம்வரை நாங்கள் பசியோடும் தாகத்தோடும் இருக்கிறோம்; போதிய உடையின்றி இருக்கிறோம்[a]; அடிக்கப்படுகிறோம்; நிலையான தங்குமிடமின்றி அலைகிறோம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிர்வாணமாக இருக்கிறோம்.” கிரேக்கச் சொல் முற்றிலும் உடையில்லாத நிலையையோ போதிய உடையில்லாத நிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நிலையான இருப்பிடமின்றி இருக்கிறோம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: இந்த நேரம்வரைக்கும்
  rationale: ἄρτι என்பதன் ‘இப்போது/தற்போது’ என்ற வலியுறுத்தலையும், இந்நிலை தொடர்ந்து நீடிப்பதையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πεινῶμεν καὶ διψῶμεν
  choice: நாங்கள் பசியோடும் தாகத்தோடும் இருக்கிறோம்
  rationale: இரண்டு நிகழ்கால வினைகளும் தொடரும் பற்றாக்குறை நிலைகளைக் குறிப்பிடுகின்றன; இணை அமைப்பு தமிழில் இயல்பாக உள்ளது.
- source_word: γυμνιτεύομεν
  choice: போதிய உடையின்றி இருக்கிறோம்
  rationale: முற்றிலும் நிர்வாணமாக இருப்பதை மட்டும் அல்லாமல், தேவையான அளவு உடையில்லாத நிலையையும் இச்சொல் குறிக்கக்கூடும்; மொழிபெயர்ப்பு அந்தப் பொருள் வரம்பைப் பாதுகாக்கிறது.
- source_word: κολαφιζόμεθα
  choice: அடிக்கப்படுகிறோம்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவம் தொடர்ந்து அல்லது மீண்டும் நிகழும் உடல் வன்முறையைக் குறிக்கிறது; ‘அடிக்கப்படுகிறோம்’ தெளிவான, இயல்பான தமிழாகும்.
- source_word: ἀστατοῦμεν
  choice: நிலையான தங்குமிடமின்றி அலைகிறோம்
  rationale: நிலையற்றிருத்தல், ஓரிடத்தில் நிலையாகத் தங்காதிருத்தல் ஆகிய இரு நுணுக்கங்களையும் தாங்குகிறது; ‘வீடற்றவர்கள்’ என்பதைக் காட்டிலும் கிரேக்கச் சொல்லின் இயக்கம் சார்ந்த சாத்தியத்தையும் காக்கிறது.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: தொடர்ச்சியான இணைப்பு அமைப்பு
  rationale: மூலத்தின் குவியும் துன்பப் பட்டியலைத் தமிழில் இணைத்தொடர்களாலும் அரைப்புள்ளிகளாலும் தெளிவாகவும் வலிமையாகவும் வழங்குகிறது.
theological_decisions:
- issue: பவுலின் துன்ப விவரிப்பின் இயல்பு
  choice: அப்போஸ்தலர்கள் அனுபவித்துவரும் உண்மையான பற்றாக்குறையும் வன்முறையும் பற்றிய நேரடியான பட்டியல்
  alternative: முக்கியமாக மிகைப்படுத்தப்பட்ட சொல்லாட்சி
  rationale: தொடர்ச்சியான நிகழ்கால வினைகள் உணவு, உடை, தாக்குதல், தங்குமிடம் ஆகியவற்றைச் சார்ந்த நடைமுறைத் துன்பங்களை நேரடியாகக் கூறுகின்றன; மொழிபெயர்ப்பு அவற்றை மிகைப்படுத்தவோ மென்மைப்படுத்தவோ இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘போதிய உடையின்றி’ மற்றும் ‘நிலையான தங்குமிடமின்றி அலைகிறோம்’ என்பவை மூலச் சொற்களின் பொருள் அகலத்தைக் காக்கின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
