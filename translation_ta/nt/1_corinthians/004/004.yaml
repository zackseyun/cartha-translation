source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: ta
  text: ஏனெனில், எனக்கு எதிராக எதையும் நான் அறியவில்லை[a]. ஆனாலும், இதனால் நான் நீதிமானாகத் தீர்க்கப்படவில்லை[b]. என்னை ஆராய்பவர்[c] ஆண்டவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மனச்சாட்சியில் எனக்கு எதிரான எதையும் நான் உணரவில்லை” அல்லது “எனக்கு எதிராக எதையும் நான் அறியவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இதனால் நான் விடுவிக்கப்படவில்லை” அல்லது “குற்றமற்றவனாகத் தீர்க்கப்படவில்லை.” கிரேக்கச் சொல் நீதிமன்றத் தீர்ப்புச் சார்ந்த நுணுக்கத்தைக் கொண்டது; பவுல் வேறு இடங்களிலும் ‘நீதிமானாக்கப்படுதல்’ என்பதற்காக இதே சொல்லைப் பயன்படுத்துகிறார்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “என்னை நியாயந்தீர்ப்பவர்.” இதற்கான கிரேக்க வினைச்சொல் ஆராய்தல், விசாரித்தல், அல்லது நீதிசார் சூழலில் மதிப்பிடுதல் என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν ... ἐμαυτῷ σύνοιδα
  choice: எனக்கு எதிராக எதையும் நான் அறியவில்லை
  rationale: σύνοιδα என்பதன் மனச்சாட்சி சார்ந்த ‘தனக்கு எதிராக எதையும் அறியாதிருத்தல்’ என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இது பவுல் தன்னை முழுமையாகப் பாவமற்றவர் என அறிவிப்பதாக மிகைப்படுத்தாது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான விளக்கத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ
  choice: ஆனாலும், இதனால் ... இல்லை
  rationale: தன்னிடம் குற்றம் இருப்பதாக அறியாத நிலையே சாதகமான தீர்ப்புக்கான அடிப்படை அல்ல என்ற முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: δεδικαίωμαι
  choice: நான் குற்றமற்றவனாகத் தீர்க்கப்படவில்லை
  rationale: δικαιόω என்பதன் நீதிமன்றச் சூழலிலான தீர்ப்பு சார்ந்த பொருளைப் பாதுகாக்கிறது. ‘நீதிமானாக்கப்படவில்லை’ என்பது இச்சூழலில் பரந்த கோட்பாட்டு கருத்தைத் தேவையின்றி முன்னிறுத்தக்கூடும்.
- source_word: ὁ ... ἀνακρίνων με
  choice: என்னை ஆராய்ந்து தீர்ப்பவர்
  rationale: ἀνακρίνω என்பதில் உள்ள ஆராய்தல், மதிப்பிடுதல், நீதிசார் தீர்ப்பளித்தல் ஆகிய நுணுக்கங்களை ஒருங்கிணைக்கிறது; வெறும் இறுதித் தீர்ப்பு என்று மட்டும் சுருக்கவில்லை.
- source_word: κύριός
  choice: ஆண்டவரே
  rationale: கிரேக்க மூலத்தில் உள்ள κύριος என்பதைக் கூடுதல் அடையாள விரிவாக்கமின்றி மரியாதையான வழக்குத் தமிழில் தருகிறது; ‘ஏ’ வலியுறுத்தல் ὁ ... κύριός ἐστιν என்ற அமைப்பின் மையப்படுத்தலைப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: δεδικαίωμαι என்பதன் நீதிமன்ற மற்றும் இறையியல் நுணுக்கம்
  choice: குற்றமற்றவனாகத் தீர்க்கப்படவில்லை
  alternative: நீதிமானாக்கப்படவில்லை; விடுவிக்கப்படவில்லை; நியாயப்படுத்தப்படவில்லை
  rationale: உடனடிச் சூழல் ஊழியரை மதிப்பிடுவதையும் தீர்ப்பதையும் குறிக்கிறது. ஆகவே நீதிமன்றச் சாயலைக் காக்கும் மொழி தேர்ந்தெடுக்கப்பட்டது; அதேவேளை பவுலின் பரந்த ‘நீதிமானாக்குதல்’ கருத்தை முற்றிலும் பிரித்துவிடாமல் மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: κύριος என்பவரின் அடையாளம்
  choice: ஆண்டவர்
  alternative: ஆண்டவராகிய இயேசு
  rationale: இவ்வசனத்தின் கிரேக்க உரை κύριος என்று மட்டுமே கூறுகிறது. சூழலில் கிறிஸ்துவைக் குறிக்கக்கூடும் என்றாலும், மூலத்தில் வெளிப்படையாக இல்லாத அடையாளத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- issue: சுய மனச்சாட்சிக்கும் ஆண்டவரின் தீர்ப்புக்கும் இடையிலான உறவு
  choice: தனக்கு எதிராக எதையும் அறியாதது குற்றமற்ற தீர்ப்புக்கு ஆதாரம் அல்ல
  alternative: பவுல் முற்றிலும் பாவமற்றவர் என்று கூறுகிறார்
  rationale: οὐδὲν ... σύνοιδα மற்றும் ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι ஆகியவற்றின் பதற்றத்தை அப்படியே காக்கிறது; தனிப்பட்ட சுயமதிப்பீடு இறுதியான தீர்ப்பல்ல.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘எனக்கு எதிராக’ என்பது மனச்சாட்சி மற்றும் நீதிமன்றச் சாயலைக் காக்கிறது. ‘குற்றமற்றவனாகத் தீர்க்கப்படவில்லை’ என்பது சூழலுக்கேற்ற தெளிவை அளிக்கிறது; முக்கிய இறையியல் மாற்றுச் சொற்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
