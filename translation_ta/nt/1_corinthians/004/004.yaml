  to: ஏனெனில், எனக்கு எதிராக எதையும் நான் அறியவில்லை[a]. ஆனாலும், இதனால் நான் நீதிமானாகத் தீர்க்கப்படவில்லை[b]. என்னை ஆராய்பவர்[c] ஆண்டவரே.
