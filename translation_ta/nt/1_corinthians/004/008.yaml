base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: ta
  text: ஏற்கெனவே நீங்கள் முழுத் திருப்தி அடைந்துவிட்டீர்கள்; ஏற்கெனவே செல்வந்தர்களாகிவிட்டீர்கள்; எங்களைத் தவிர்த்து அரசர்களாக ஆட்சி செய்துவிட்டீர்கள். நீங்கள் உண்மையிலேயே ஆட்சி செய்திருந்தால் எவ்வளவு நன்றாயிருக்கும்![a] அப்படியானால் நாங்களும் உங்களோடு சேர்ந்து ஆட்சி செய்திருப்போமே.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “ஆ, நீங்கள் உண்மையிலேயே ஆட்சி செய்திருந்தால்!”'
    reason: ὄφελόν γε-வில் உள்ள நிறைவேறாத விருப்பத்தை இன்னும் சொல்லுக்குச் சொல்லாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: 'பவுல் நையாண்டியாகப் பேசுகிறார்: கொரிந்தியர்கள் ஏற்கெனவே முழு நிறைவும் செல்வமும் அரசாட்சியும் பெற்றுவிட்டவர்கள்போல் நடந்துகொண்டார்கள். ஆனாலும் அவர்கள் உண்மையாக ஆட்சி செய்ய வேண்டும் என்ற விருப்பமும் இங்கு ஒலிக்கிறது.'
    reason: சூழலில் நையாண்டியும் உண்மையான ஏக்கமும் ஒன்றோடொன்று கலந்திருப்பதை விளக்கும் இலக்கியக் குறிப்பு.
lexical_decisions:
- source_word: ἤδη
  choice: இப்போதே
  rationale: இரு கூற்றுகளின் தொடக்கத்திலும் வரும் கால வலியுறுத்தலையும் பவுலின் கூர்மையான நையாண்டியையும் தக்கவைக்கிறது.
- source_word: κεκορεσμένοι ἐστέ
  choice: நிறைவடைந்துவிட்டீர்கள்
  rationale: முழுமையாகத் திருப்தியடைந்த தற்போதைய நிலையைச் சுட்டும் வினையெச்சக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது; உடல் பசியை மட்டும் குறிக்கும் சொல்லாகச் சுருக்கவில்லை.
- source_word: ἐπλουτήσατε
  choice: செல்வந்தர்களாகிவிட்டீர்கள்
  rationale: செல்வம் பெற்ற நிலைக்கு வந்துவிட்டதாகச் சொல்லும் வினை வலிமையைப் பாதுகாக்கிறது.
- source_word: χωρὶς ἡμῶν
  choice: எங்களை விட்டே
  rationale: அப்போஸ்தலர்களைச் சாராமலும் அவர்களைப் புறந்தள்ளியும் கொரிந்தியர்கள் உயர்ந்துவிட்டதாக எண்ணும் உறவுசார் நையாண்டியைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ἐβασιλεύσατε
  choice: அரசர்களாக ஆட்சி செய்துவிட்டீர்கள் / ஆட்சி செய்திருந்தால்
  rationale: βασιλεύω என்பதன் அரசாட்சி உருவகத்தைப் பாதுகாக்கிறது. முதல் இடத்தில் ‘அரசர்களாக’ என்பது உருவகத்தைத் தெளிவாக்குகிறது; விருப்பக் கூற்றில் இயல்பான தமிழுக்காக ‘ஆட்சி செய்திருந்தால்’ என வழங்கப்படுகிறது.
- source_word: ὄφελόν γε
  choice: உண்மையிலேயே ஆட்சி செய்திருந்தால் எவ்வளவு நன்றாயிருக்கும்!
  rationale: நிறைவேறாத விருப்பத்தையும் γε தரும் வலியுறுத்தலையும் நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: அப்போது
  rationale: முந்தைய விருப்பம் உண்மையாக இருந்தால் அதன் விளைவாக நிகழ்ந்திருக்கும் பகிர்ந்த ஆட்சியை இயல்பான தமிழில் இணைக்கிறது.
- source_word: συμβασιλεύσωμεν
  choice: நாங்களும் உங்களோடு சேர்ந்து ஆட்சி செய்திருப்போமே
  rationale: συν- கூறின் ‘உடன்/சேர்ந்து’ பொருளையும் பகிர்ந்த அரசாட்சியையும் தெளிவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: முதல் மூன்று கூற்றுகளின் தொனி
  choice: நையாண்டியான உறுதிக்கூற்றுகளாக மொழிபெயர்த்தல்
  alternative: நேரடியான பாராட்டாக மொழிபெயர்த்தல்
  rationale: 4:7–13 சூழலில் கொரிந்தியர்களின் தன்னிறைவு எண்ணம் அப்போஸ்தலர்களின் துன்பத்தோடு முரண்படுத்தப்படுகிறது. எனவே சொற்களின் வெளிப்படையான கூற்றை வைத்துக்கொண்டே நையாண்டியை அடிக்குறிப்பில் விளக்குவது பொருத்தமானது.
- issue: ὄφελόν γε என்பதில் உள்ள விருப்பமும் நையாண்டியும்
  choice: நிறைவேறாத உண்மையான விருப்பமாக வெளிப்படுத்தல்
  alternative: முழுக்க நையாண்டியாக மட்டும் எடுத்தல்
  rationale: இக்கூற்று முந்தைய நையாண்டியைத் தொடர்ந்தாலும், அவர்கள் உண்மையாக ஆட்சி செய்யும் நிலை வந்தால் தாமும் அவர்களோடு ஆட்சி செய்யலாம் என்ற பவுலின் ஆழ்ந்த விருப்பத்தையும் உரை தாங்குகிறது; இரு பரிமாணங்களையும் அழிக்கவில்லை.
- issue: அரசாட்சி மொழியின் பொருள்
  choice: ‘ஆட்சி’ மற்றும் ‘அரசர்கள்’ என்ற அரசியல்-அரச உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘வெற்றி பெற்றீர்கள்’ அல்லது ‘உயர்ந்த நிலையை அடைந்தீர்கள்’ என்று பொதுமைப்படுத்தல்
  rationale: βασιλεύω மற்றும் συμβασιλεύω ஆகியவை வெளிப்படையாக அரசாட்சி உருவகத்தைக் கொண்டவை; சாத்தியமான இறுதிக்கால ஒலிநயத்தையும் உரையின் இறையியல் பதற்றத்தையும் பொதுவான வெற்றி மொழியாகத் தளர்த்தக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. ‘நிறைவடைந்துவிட்டீர்கள்—செல்வந்தர்களாகிவிட்டீர்கள்—அரசர்களாக ஆட்சி செய்துவிட்டீர்கள்’ என்ற ஏறுமுக வரிசை கிரேக்க உரையின் சொல்லாட்சிச் செறிவையும் நையாண்டியையும் பிரதிபலிக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
