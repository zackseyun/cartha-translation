id: 1CO.4.20
reference: 1 Corinthians 4:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: ta
  text: ஏனெனில், இறைவனுடைய அரசு பேச்சில்[a] அல்ல; வல்லமையில் உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சொல்லில்’ அல்லது ‘வார்த்தைகளில்’. இங்கு பேச்சுக்கும் வல்லமைக்கும் இடையே முரண்பாடு காட்டப்படுகிறது; வெறும் சொல்லாடலைக் காட்டும் நுணுக்கமும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ஏனெனில் ... அல்ல
  rationale: γάρ முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; οὐ கூற்றை மறுக்கிறது. தமிழில் இவ்விணைப்பை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: ἐν λόγῳ
  choice: வெறும் பேச்சில்
  rationale: λόγος இங்கு ‘சொல்’, ‘பேச்சு’ அல்லது ‘வார்த்தைகள்’ எனப் பொருள்படலாம். வல்லமையுடனான முரண்பாட்டில், பயனற்ற வெறும் பேச்சு என்ற கருத்தை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: இறைவனுடைய அரசு
  rationale: βασιλεία என்பது ஆட்சியையும் ஆளுகைக்குட்பட்ட அரசையும் குறிக்கக்கூடும். ‘அரசு’ இரு நுணுக்கங்களையும் தேவையின்றி ஒன்றாக மட்டுப்படுத்தாமல், நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: வல்லமையில் இருக்கிறது
  rationale: δύναμις என்பதன் அடிப்படைப் பொருள் ‘வல்லமை’. கிரேக்கத்தில் இரண்டாம் பகுதியில் விடப்பட்டுள்ள வினை தமிழில் முழுமையான இயல்பான வாக்கியத்திற்காக ‘இருக்கிறது’ என வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘பேச்சு’ மற்றும் ‘வல்லமை’ ஆகியவற்றுக்கிடையிலான முரண்பாட்டின் தன்மை
  choice: இறைவனுடைய அரசின் அடையாளமாக வெறும் பேச்சுக்கு எதிராகச் செயல்திறனுள்ள வல்லமை நிறுத்தப்படுகிறது; அந்த வல்லமை எவ்வகையானது என்பது இங்கு குறிப்பாக வரையறுக்கப்படவில்லை.
  alternative: அதை அற்புத அடையாளங்கள், மாற்றமடைந்த வாழ்க்கை மற்றும் திருச்சபை ஒழுங்கு, அப்போஸ்தல அதிகாரம், அல்லது ஆவியானவரின் செயல் ஆகியவற்றில் ஏதேனும் ஒன்றாக மட்டும் எடுத்துக்கொள்வது.
  rationale: கிரேக்க உரை δύναμις என்பதைப் பொதுவாகவே கூறுகிறது. மொழிபெயர்ப்பு அதன் இறையியல் திறந்தநிலையைப் பாதுகாக்க வேண்டும்; உரை கூறாத அளவுக்கு அதன் பொருளைக் குறுக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வெறும்’ என்பது λόγος என்பதன் அகராதிப் பொருள் அல்ல; சூழலில் உள்ள எதிர்மறை முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘இறைவன்’ மற்றும் ‘அரசு’ ஆகியவை தெளிவான, சமயப்பிரிவு சாராத சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
