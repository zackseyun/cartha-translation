source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: ta
  text: இதற்காகவே தீமோத்தேயுவை உங்களிடம் அனுப்பினேன். அவர் ஆண்டவருக்குள் என் அன்புக்குரிய, நம்பிக்கைக்குரிய பிள்ளை[a]. மேசியா இயேசுவுக்குள் உள்ள என் வழிகளை அவர் உங்களுக்கு நினைவூட்டுவார்[b]. நான் எங்கும் ஒவ்வொரு திருச்சபையிலும் போதிப்பதுபோலவே அவர் நினைவூட்டுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவருக்குள் என் அன்புக்குரிய, நம்பிக்கைக்குரிய மகன்.” கிரேக்கச் சொல் நேரடியாக “பிள்ளை” என்று பொருள்படும்; இச்சூழலில் “மகன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கிறிஸ்து இயேசுவுக்குள்.” கிரேக்கப் பட்டப்பெயரான Χριστός என்பதன் பொருளைப் பாதுகாக்க இங்கு “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதற்காகவே
  rationale: முந்தைய கருத்தை நோக்கிச் சுட்டும் காரணத் தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது; வே என்பது பவுல் தீமோத்தேயுவை அனுப்பிய நோக்கத்துக்கு உரிய அழுத்தத்தைத் தருகிறது.
- source_word: ἔπεμψα
  choice: அனுப்பினேன்
  rationale: இறந்தகாலச் செயலை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: Τιμόθεον
  choice: தீமோத்தேயு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்; வேற்றுமை உருபுடன் தீமோத்தேயுவை என வருகிறது.
- source_word: τέκνον
  choice: பிள்ளை
  rationale: பாலினத்தைத் தனியாகக் குறிப்பதில்லாத குடும்ப உறவு உருவகத்தைப் பாதுகாக்கிறது; இங்கு மகன் என்றும் பொருள்படலாம்.
- source_word: ἀγαπητὸν
  choice: அன்புக்குரிய
  rationale: பவுலின் பாசத்தையும் கண்ணியமான உறவுத் தொனியையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πιστὸν
  choice: உண்மையுள்ள
  rationale: நம்பிக்கைக்குரிய தன்மையையும் ஊழியத்தில் நிலைத்திருப்பதையும் உள்ளடக்கக்கூடிய சொல்லாக உள்ளது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் உறவு மற்றும் வாழ்வின் வட்டாரத்தைக் குறிக்கும் வழக்கைச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: ἀναμνήσει
  choice: நினைவூட்டுவார்
  rationale: எதிர்காலச் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὰς ὁδούς μου
  choice: என் வழிகளை
  rationale: பவுலின் வாழ்க்கை, நடத்தை, போதனை ஆகியவற்றை உள்ளடக்கும் உருவகத்தின் அகலத்தைத் தீர்மானித்துச் சுருக்காமல் காக்கிறது.
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: மேசியா இயேசுவுக்குள் உள்ள
  rationale: வழிகள் மேசியா இயேசுவோடு கொண்ட உறவினால் வரையறுக்கப்படுகின்றன என்பதை இலக்கண ரீதியாகப் பாதுகாக்கிறது; Χριστός இங்கு பட்டப்பெயரின் பொருளுடன் மொழிபெயர்க்கப்படுகிறது.
- source_word: καθὼς
  choice: அவற்றையே
  rationale: தீமோத்தேயு நினைவூட்டும் வழிகளுக்கும் பவுல் எல்லா இடங்களிலும் போதிப்பதற்கும் உள்ள ஒத்திசைவை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ
  choice: எங்கும் ஒவ்வொரு திருச்சபையிலும்
  rationale: இடத்தின் பரவலையும் ஒவ்வொரு சபையையும் குறிக்கும் இரு கிரேக்கக் கூறுகளையும் தனித்தனியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: மேசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός என்பதன் பட்டப்பெயர்ச் சார்ந்த பொருளை மேசியா தெளிவாகக் கடத்துகிறது; பரிச்சயமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: “என் வழிகள்” என்பதன் பொருள்
  choice: உருவகத்தை அப்படியே பாதுகாத்தல்
  alternative: என் வாழ்க்கைமுறை / என் நடத்தை / என் ஊழிய வழிமுறை
  rationale: சூழலில் இது பயணப் பாதைகளை மட்டும் குறிக்காது; பவுலின் வாழ்க்கை, நடத்தை, போதனை ஆகியவற்றை உள்ளடக்கலாம். அவற்றில் ஒன்றாக மட்டும் பொருளைக் குறுக்காமல் மூலத்தின் அகலத்தை மொழிபெயர்ப்பு காக்கிறது.
- issue: τέκνον என்ற உறவுச் சொல்
  choice: பிள்ளை
  alternative: மகன்
  rationale: தீமோத்தேயு ஆண் என்பது தெரிந்திருந்தாலும், கிரேக்கச் சொல் இயல்பாகப் பிள்ளை என்று பொருள்படும்; பவுலின் ஆன்மிகக் குடும்ப உருவகத்தைத் தேவையின்றி மேலும் குறிப்பாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. “ஆண்டவருக்குள்,” “மேசியா இயேசுவுக்குள்” ஆகிய பவுலின் செறிவான உறவுசார் சொற்றொடர்கள் விளக்கமாக விரிக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன. “திருச்சபை” என்பது ἐκκλησία என்பதற்கான பரவலாக அறியப்பட்ட கண்ணியமான தமிழ் வடிவமாகப் பயன்படுத்தப்பட்டுள்ளது.
