revisions:
- from: இதற்காகவே தீமோத்தேயுவை உங்களிடம் அனுப்பினேன். அவர் ஆண்டவருக்குள் என் அன்புக்குரிய, உண்மையுள்ள பிள்ளை[a]. மேசியா இயேசுவுக்குள் உள்ள என் வழிகளை அவர் உங்களுக்கு நினைவூட்டுவார்[b]. அவற்றையே நான் எங்கும் ஒவ்வொரு திருச்சபையிலும் போதிக்கிறேன்.
