source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: ta
  text: 'ஒருவர் எங்களை இவ்வாறு கருத வேண்டும்: மேசியாவின்[a] பணியாளர்களாகவும் கடவுளுடைய மறைபொருள்களின் நிர்வாகப் பொறுப்பாளர்களாகவும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «மேசியா» என்பது கிரேக்க «கிறிஸ்து» என்பதற்கிணையான பட்டம்; அதன் பொருள் «அபிஷேகம் செய்யப்பட்டவர்».
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: இவ்வாறே
  rationale: எந்த முறையில் பவுலையும் அவருடன் ஊழியம் செய்பவர்களையும் கருத வேண்டும் என்பதைச் சுட்டுகிறது; வலியுறுத்தும் demonstrative force-ஐ இயல்பான தமிழில் காக்கிறது.
- source_word: ἡμᾶς
  choice: எங்களை
  rationale: λογιζέσθω என்பதன் நேரடி செயப்படுபொருள்; சூழலில் பவுலையும் அவருடன் ஊழியம் செய்பவர்களையும் குறிக்கிறது.
- source_word: λογιζέσθω
  choice: கருத வேண்டும்
  rationale: நிகழ்காலக் கட்டளையின் நெறிப்படுத்தும் வலிமையை நவீன, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄνθρωπος
  choice: ஒருவர்
  rationale: இங்கு ஆண்பால் ஒருமைச் சொல் பொதுப்பொருளில் எந்த மனிதரையும் குறிக்கிறது; ‘ஒருவர்’ அந்தப் பொதுப்பொருளை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: ὑπηρέτας
  choice: பணியாளர்கள்
  rationale: δοῦλος போல அடிமை நிலையைச் சுட்டாமல், மேலதிகாரியின் கீழ் பணிபுரியும் சேவகரைக் குறிக்கிறது.
- source_word: Χριστοῦ
  choice: கிறிஸ்துவின்
  rationale: Χριστός என்ற பட்டத்திற்குத் தமிழில் நிலைபெற்றுள்ள ‘கிறிஸ்து’ என்பதைப் பயன்படுத்துகிறது; இது அபிஷேகம் செய்யப்பட்ட மேசியாவைக் குறிக்கிறது.
- source_word: οἰκονόμους
  choice: பொறுப்பாளர்கள்
  rationale: தமக்குச் சொந்தமல்லாதவற்றை ஒப்படைக்கப்பட்ட அதிகாரத்தின் கீழ் கவனித்து நடத்துபவர்களை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: μυστηρίων
  choice: மறைபொருள்கள்
  rationale: கடவுளுடைய மறைவான திட்டங்களையும் உண்மைகளையும் குறிக்கும் பவுலின் சொல்லை, அவை அனைத்தும் இன்னும் வெளிப்படாதவை என்று கூடுதலாக முடிவுசெய்யாமல் காக்கிறது.
- source_word: θεοῦ
  choice: கடவுளுடைய
  rationale: இந்த மறைபொருள்கள் கடவுளுக்குரியவை அல்லது அவரிடமிருந்து வருபவை என்ற இயல்பான உரிமை/மூலப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστοῦ என்ற பட்டத்தை மொழிபெயர்த்தல்
  choice: கிறிஸ்துவின்
  alternative: மேசியாவின்
  rationale: தமிழ்க் கிறிஸ்தவ வழக்கில் ‘கிறிஸ்து’ என்பது Χριστός என்ற பட்டத்தின் நிலைபெற்ற வடிவம். அதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மேசியா’ என்ற பட்டப்பொருளை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: ἄνθρωπος என்பதன் பொதுப்பொருள்
  choice: ஒருவர்
  alternative: ஒரு மனிதன்
  rationale: இங்கு சொல் ஆண்களை மட்டும் வரையறுக்கவில்லை; எந்த நபரும் பவுலையும் அவருடன் ஊழியம் செய்பவர்களையும் எவ்வாறு கருத வேண்டும் என்பதே கருத்து. ‘ஒருவர்’ இந்தப் பொதுப்பொருளைத் தெளிவாகத் தருகிறது.
- issue: μυστηρίων என்பதன் இறையியல் நுணுக்கம்
  choice: மறைபொருள்கள்
  alternative: இரகசியங்கள்
  rationale: ‘மறைபொருள்கள்’ என்பது மனிதர்களிடமிருந்து வேண்டுமென்றே மறைக்கப்பட்ட தகவல்கள் என்ற எண்ணத்தைத் தவிர்த்து, கடவுளுடைய மறைவான திட்டங்களும் உண்மைகளும் என்ற பவுலின் விரிவான பயன்பாட்டைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உக்கிராணக்காரர்’ போன்ற பழமையான சொல்லுக்கு மாற்றாக ‘பொறுப்பாளர்கள்’ என்றும், ‘இரகசியங்கள்’ என்பதற்குப் பதிலாக இறையியல் நுணுக்கத்தைத் திறந்தவாறே வைக்கும் ‘மறைபொருள்கள்’ என்றும் வழங்கப்பட்டுள்ளது.
