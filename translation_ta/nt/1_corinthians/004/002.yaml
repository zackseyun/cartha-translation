revisions:
- from: ஆகவே, ஒரு பொறுப்பாளர் நம்பிக்கைக்குரியவராகக் காணப்பட வேண்டும் என்பதே இங்கு எதிர்பார்க்கப்படுகிறது.[a][b]
  to: இந்த விஷயத்தில், மேலும், பொறுப்பாளர்களிடம் எதிர்பார்க்கப்படுவது என்னவென்றால், ஒருவர் நம்பிக்கைக்குரியவராகக் காணப்பட வேண்டும்.[a][b]
  rationale: This revision preserves ὧδε as a contextual expression, represents λοιπόν without adding an unnecessarily strong logical inference, and restores the plural reference of οἰκονόμοις while retaining the Greek’s indefinite singular τις. The footnotes are aligned with the revised wording and continue to mark the literal passive expression.
