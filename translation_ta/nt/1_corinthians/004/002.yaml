  text: ⸀ὧδε λοιπὸν ζητεῖται ἐν τοῖς οἰκονόμοις ἵνα πιστός τις εὑρεθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: ta
  text: இந்த விஷயத்தில், மேலும், பொறுப்பாளர்களிடம் எதிர்பார்க்கப்படுவது என்னவென்றால், ஒருவர் நம்பிக்கைக்குரியவராகக் காணப்பட வேண்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த விஷயத்தில்” என்பதற்குப் “இங்கு” என்றும், “மேலும்” என்பதற்குப் “இனி” அல்லது “ஆகவே” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லடிப்படையில், “பொறுப்பாளர்களிடத்தில் ஒருவர் நம்பிக்கைக்குரியவராகக் காணப்படுவது தேடப்படுகிறது”; அதாவது, அவர்களிடம் இதுவே எதிர்பார்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: இங்கு
  rationale: இது இடத்தைக் குறிப்பதாகவும், முந்தைய விவாதத்தைச் சார்ந்த ‘இந்த விஷயத்தில்’ என்ற உரையாடல் சார்ந்த பொருளிலும் அமையலாம். ‘இங்கு’ அந்தச் சுருக்கத்தையும் இயல்பான தமிழையும் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λοιπὸν
  choice: ஆகவே
  rationale: இங்கு இது வாதத்தை அடுத்த முடிவுக்கு நகர்த்தும் தொடர்புச்சொல். தமிழில் ‘ஆகவே’ முந்தைய வசனத்திலிருந்து வரும் தர்க்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; ‘மேலும்’ என்பதும் சாத்தியம்.
- source_word: ζητεῖται
  choice: எதிர்பார்க்கப்படுகிறது
  rationale: சொல்லடிப்படையில் ‘தேடப்படுகிறது’ என்றாலும், இந்த அமைப்பில் ஒப்படைக்கப்பட்ட பொறுப்பை வகிப்பவரிடம் கோரப்படுவது அல்லது எதிர்பார்க்கப்படுவது என்ற வழக்குப் பொருள் உள்ளது.
- source_word: οἰκονόμοις
  choice: பொறுப்பாளர்
  rationale: οἰκονόμος என்பது ஒப்படைக்கப்பட்ட வீட்டையோ வளங்களையோ நிர்வகிப்பவரைக் குறிக்கிறது. வழக்கொழிந்த சொற்களைத் தவிர்த்து, நம்பி ஒப்படைக்கப்பட்ட நிர்வாகப் பொறுப்பை ‘பொறுப்பாளர்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πιστός
  choice: நம்பிக்கைக்குரியவர்
  rationale: இங்கு தன்னிடம் ஒப்படைக்கப்பட்ட பொறுப்பை நம்பத்தகுந்த விதத்தில் நிறைவேற்றுபவரைக் குறிக்கிறது. ‘நம்பிக்கைக்குரியவர்’ என்பது விசுவாசம் மற்றும் நம்பகத்தன்மை ஆகிய தொடர்புடைய நிழற்பொருள்களைத் தக்கவைக்கிறது.
- source_word: τις
  choice: ஒரு
  rationale: கிரேக்கச் சொல் வரையறுக்கப்படாத ஒருமையைப் பயன்படுத்துகிறது. ‘ஒரு பொறுப்பாளர்’ என்பது ஆண்களுக்கு மட்டும் கட்டுப்படுத்தாமல் அதன் பிரதிநிதித்துவ ஒருமையை இயல்பான தமிழில் காக்கிறது.
- source_word: εὑρεθῇ
  choice: காணப்பட வேண்டும்
  rationale: செயப்பாட்டு வினை வடிவைத் தக்கவைத்து, ஆய்வு அல்லது மதிப்பீட்டின்போது ஒருவர் அவ்வாறு இருப்பது தெரியவர வேண்டும் என்ற கருத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பிரதிநிதித்துவ ஒருமையும் பாலினத் துல்லியமும்
  choice: ஒரு பொறுப்பாளர் நம்பிக்கைக்குரியவராகக் காணப்பட வேண்டும்
  alternative: ஒரு மனிதன் நம்பிக்கைக்குரியவனாகக் காணப்பட வேண்டும் / பொறுப்பாளர்கள் நம்பிக்கைக்குரியவர்களாகக் காணப்பட வேண்டும்
  rationale: கிரேக்கத்தில் வரையறுக்கப்படாத ஒருமையும் இலக்கண ஆண்பாலும் இருந்தாலும், கருத்து ஆண்களுக்கு மட்டும் உரியது அல்ல. தமிழாக்கம் பொதுவான ஒருமையைத் தக்கவைத்து, தேவையற்ற பாலினக் கட்டுப்பாட்டையும் மூலத்தின் ஒருமையைப் பன்மையாக்குவதையும் தவிர்க்கிறது.
- issue: ζητεῖται என்பதன் கோரிக்கை சார்ந்த பொருள்
  choice: எதிர்பார்க்கப்படுகிறது
  alternative: தேடப்படுகிறது / தேவைப்படுகிறது
  rationale: ‘தேடப்படுகிறது’ என்பது சொல்லடிப்படையான வடிவத்தைத் தரும்; ஆனால் சூழலில் பொறுப்பாளரிடம் என்ன எதிர்பார்க்கப்படுகிறது என்பதே கருத்து. ‘தேவைப்படுகிறது’ கடுமையான கட்டளையாக ஒலிக்கக்கூடும் என்பதால், மூலத்தின் பொறுப்புக் கோரிக்கையை இயல்பாகக் காட்ட ‘எதிர்பார்க்கப்படுகிறது’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வழக்கொழிந்த ‘உக்கிராணக்காரர்’ போன்ற சொற்களுக்கு மாற்றாக ‘பொறுப்பாளர்’ தேர்ந்தெடுக்கப்பட்டது. ‘ஆகவே … இங்கு’ என்ற அமைப்பு ὧδε λοιπὸν என்பதன் உரையாடல் மற்றும் முடிவுறுத்தும் தொடர்பை இயல்பான தமிழில் தருகிறது.
