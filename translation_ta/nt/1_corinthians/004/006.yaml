  to: சகோதரர்களே,[a] இவற்றை உங்கள் நன்மைக்காக எனக்கும் அப்பொல்லோவுக்கும் பொருத்திக் கூறியிருக்கிறேன்; எங்களைக் கொண்டு நீங்கள், “எழுதப்பட்டிருப்பதற்கு அப்பால் போகாதீர்கள்”[b] என்பதை கற்றுக்கொள்ளும்படியாகவும், உங்களில் யாரும் ஒருவருக்காக மற்றொருவருக்கு எதிராக இறுமாப்படையாதபடியாகவும் அவ்வாறு செய்தேன்.
