source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: ta
  text: சகோதரர்களே,[a] இவற்றை உங்கள் நன்மைக்காக எனக்கும் அப்பொல்லோவுக்கும் பொருத்திக் கூறியிருக்கிறேன்; எங்களைக் கொண்டு நீங்கள், “எழுதப்பட்டிருப்பதற்கு அப்பால் போகாதீர்கள்”[b] என்பதை கற்றுக்கொள்ளும்படியாகவும், உங்களில் யாரும் ஒருவருக்காக மற்றொருவருக்கு எதிராக இறுமாப்படையாதபடியாகவும் அவ்வாறு செய்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பதற்கான கிரேக்கச் சொல், ஆண்களும் பெண்களும் அடங்கிய ஒரு குழுவையும் அழைக்கப் பயன்படுத்தப்படலாம்.
    reason: cultural_note
  - marker: b
    text: கிரேக்கத் தொடர் வினைச்சொல் விடுபட்ட சுருக்கமான வடிவில், சொற்சொல்லாக “எழுதப்பட்டிருப்பதற்கு அப்பால் அல்ல” என உள்ளது; இது ஒரு வழக்குச் சொல் அல்லது முழக்கமாகவும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: இவற்றை
  rationale: பவுல் முன்பு விவாதித்த பல அம்சங்களைப் பின்னோக்கிச் சுட்டும் பன்மைச் சுட்டுப்பெயரைப் பாதுகாக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க ஆண்பால் பன்மை அழைப்பை நேரடியாகக் காக்கிறது; கலப்புப் பாலின விசுவாசக் குழுவையும் குறிக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: எனக்கும் அப்பொல்லோவுக்கும் பொருத்திக் கூறியிருக்கிறேன்
  rationale: முந்தைய விவாதத்தைப் பவுல் தன்னிடமும் அப்பொல்லோவிடமும் எடுத்துப் பொருத்திய சொல்லாட்சிசார் மாற்றத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δι’ ὑμᾶς
  choice: உங்கள் நன்மைக்காக
  rationale: διά + வேற்றுமை உருபின் பயன் அல்லது நோக்கப் பொருளைச் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: இதனால் ... எங்களிடமிருந்து நீங்கள் கற்றுக்கொள்வீர்கள்
  rationale: பவுலும் அப்பொல்லோவும் பாடம் கற்கும் முன்மாதிரிகள் என்பதைக் காட்டும் சுருக்கமான கிரேக்கத் தொடரைத் தெளிவான தமிழில் தருகிறது.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: “எழுதப்பட்டிருப்பதற்கு அப்பால் போகாதீர்கள்” என்பதை
  rationale: வினைச்சொல் வெளிப்படையாக இல்லாத கிரேக்கத் தொடரின் எச்சரிக்கைத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதன் சுருக்கமான வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டிருப்பது
  rationale: நிறைவு செயப்பாட்டு வடிவத்தின் தொடரும் நிலையைப் பாதுகாக்கும் இயல்பான தமிழ்; வேதவாக்கியத்தைச் சுட்டும் வழக்கையும் ஏற்றதாக உள்ளது.
- source_word: φυσιοῦσθε
  choice: இறுமாப்படைய
  rationale: ‘ஊதிப்பெருக்கப்படுதல்’ என்ற உருவகத்தின் சூழல்சார் பொருளான செருக்கை இயல்பாகத் தெரிவிக்கிறது; தமிழில் செயற்கையான சொற்சொல் உருவகத்தைத் தவிர்க்கிறது.
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: ஒருவரை ஆதரித்து மற்றொருவருக்கு எதிராக
  rationale: கொரிந்தியரிடையேயான குழுசார்பையும் அதனால் உருவாகும் எதிர்ப்பையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: τό· Μὴ ὑπὲρ ἃ γέγραπται என்ற வினைச்சொல் விடுபட்ட தொடரின் பொருள்
  choice: “எழுதப்பட்டிருப்பதற்கு அப்பால் போகாதீர்கள்” என்ற அறிவுறுத்தலாக மொழிபெயர்த்தல்
  alternative: “எழுதப்பட்டிருப்பதற்கு அப்பால் அல்ல” என்ற மிக நேரடியான வடிவம் அல்லது ஒரு முழக்கமாக எடுத்தல்
  rationale: இது அவர்கள் கற்றுக்கொள்ள வேண்டிய பாடமாகச் செயல்படுவதால் எச்சரிக்கைப் பொருள் சூழலில் இயல்பானது. இருப்பினும் கிரேக்கத்தின் சுருக்கமும் முழக்கமாக இருக்கக்கூடிய சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: φυσιοῦσθε என்பதன் உருவகத்தைத் தமிழில் கையாளுதல்
  choice: இறுமாப்படைய
  alternative: வீங்கிப்போக அல்லது செருக்கால் ஊதிப்பெருக்கப்பட
  rationale: பவுலின் உருவகம் மாற்று வடிவங்களில் தென்பட்டாலும் அவை இன்றைய தமிழில் இயல்பற்றதாகவோ உடல் நிலையைப் போலவோ கேட்கலாம்; ‘இறுமாப்படைய’ சூழலின் நெறி மற்றும் குழுசார்பு பொருளைத் துல்லியமாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பொருத்திக் கூறியிருக்கிறேன்’ என்பது சொல்லாட்சிசார் மாற்றத்தைத் தெளிவாக்குகிறது; ‘இறுமாப்படைய’ இயல்பான தமிழுக்காகத் தேர்ந்தெடுக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
