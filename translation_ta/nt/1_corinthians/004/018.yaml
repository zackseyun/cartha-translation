  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: ta
  text: நான் உங்களிடம் வரமாட்டேன் என்பதுபோல், சிலர் தற்பெருமையால் வீங்கிப்போயிருக்கிறார்கள்[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களிடம் வரமாட்டேன் என்பதுபோல், சிலர் ஆணவம் கொண்டிருக்கிறார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: தன்னைப் பெரிதாக எண்ணும் பெருமையைக் குறிக்க, ‘வீங்கிப்போதல்’ என்ற உருவகத்தைப் பவுல் 1 கொரிந்தியரில் திரும்பத் திரும்பப் பயன்படுத்துகிறார்; 1 கொரி 4:6, 4:19; 5:2; 8:1; 13:4 ஆகியவற்றை ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: என்பதுபோல்
  rationale: கொரிந்தியர்களில் சிலருடைய மனப்பான்மைக்குப் பின்னிருந்த, உண்மையல்லாத ஊகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: நான் உங்களிடம் வரமாட்டேன்
  rationale: ὡς என்பதுடன் இணைந்த இந்தப் பங்கேற்புவினை அமைப்பு, பவுல் நேரடியாகக் கூறும் உண்மையை அல்ல, அவர்கள் கொண்டிருந்த ஊகத்தைச் சுட்டுகிறது; முழு வினைமுற்றுத் தொடர் தமிழில் இயல்பாக உள்ளது.
- source_word: δέ
  choice: —
  rationale: இது மென்மையான தொடரிணைப்புச் சொல்; முந்தைய வசனத்திலிருந்து வரும் கருத்தோட்டத்தில் தமிழில் தனியே மொழிபெயர்க்காமல் விடுவது இயல்பாக உள்ளது.
- source_word: ἐφυσιώθησάν
  choice: தற்பெருமையால் வீங்கிப்போயிருக்கிறார்கள்
  rationale: φυσιόω என்பதிலுள்ள ‘வீங்குதல்’ என்ற பவுலின் தொடர்ச்சியான உருவகத்தைத் தக்கவைத்தும், அது அகந்தையைக் குறிக்கிறது என்பதை நவீன வாசகருக்குத் தெளிவாக்கியும் உள்ளது. நிகழ்ந்த மாற்றத்தின் விளைவாகத் தொடரும் நிலையையும் ‘போயிருக்கிறார்கள்’ காட்டுகிறது.
- source_word: τινες
  choice: சிலர்
  rationale: திருச்சபையிலுள்ள ஒரு பகுதியினரைச் சுட்டும் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: கொரிந்தியரின் பெருமையைப் பற்றிய பவுலின் கண்டனத்தை மொழிபெயர்த்தல்
  choice: ‘தற்பெருமையால் வீங்கிப்போயிருக்கிறார்கள்’ என்ற உருவகமுள்ள மொழிபெயர்ப்பு
  alternative: ‘ஆணவம் கொண்டிருக்கிறார்கள்’
  rationale: இது ஒரு குறிப்பிட்ட சமயக்கோட்பாட்டைத் தீர்மானிப்பதல்ல. மூலத்திலுள்ள ‘வீங்குதல்’ உருவகத்தையும் 1 கொரிந்தியரில் அதன் சொல்லாட்சித் தொடர்ச்சியையும் தக்கவைக்கிறது; ‘தற்பெருமையால்’ என்பது அதன் பொருளைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பான, கண்ணியமான நடை. ‘தற்பெருமையால் வீங்கிப்போதல்’ என்பது சாதாரண வாசகருக்குப் பொருளைத் தெளிவாக்குவதோடு, பவுலின் மூல உருவகத்தையும் காக்கிறது. அடிக்குறிப்புக் குறிகள் ஆங்கில ஆலோசனை உரையில் உள்ள வரிசைப்படி [b][a] என முதன்மை உரையில் வைக்கப்பட்டுள்ளன.
