id: 1CO.4.7
reference: 1 Corinthians 4:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: ta
  text: ஏனெனில், உன்னை மற்றவர்களிடமிருந்து வேறுபடுத்துகிறவர் யார்?[a] நீ பெற்றுக்கொள்ளாதது உன்னிடம் என்ன இருக்கிறது? நீ அதைப் பெற்றுக்கொண்டாயே, அப்படியானால் அதை பெற்றுக்கொள்ளாதது போல ஏன் பெருமை பேசுகிறாய்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன்னைத் தனித்து நிற்கச் செய்கிறவர் யார்?’ கிரேக்க வினைச்சொல் ‘வேறுபடுத்துதல்,’ ‘தனிப்படுத்துதல்,’ அல்லது ‘தனித்து நிற்கச் செய்தல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: ஏனெனில், உன்னை மற்றவர்களிடமிருந்து வேறுபடுத்துகிறவர் யார்?
  rationale: γάρ முந்தைய கண்டிப்புக்கான காரணத்தைத் தொடர்கிறது. διακρίνει என்பது இங்கு σε என்பதைக் கருமமாகக் கொண்டு, ஒருவரை மற்றவர்களிலிருந்து வேறுபடுத்துதல் அல்லது தனித்துக் காட்டுதல் என்ற பொருளைத் தருகிறது. தமிழில் ஒப்பீட்டுப் பொருள் தெளிவாக இருக்க ‘மற்றவர்களிடமிருந்து’ சேர்க்கப்பட்டுள்ளது; யார் அவனை மேம்பட்டவனாகத் தீர்ப்பளிக்கிறார் என்று பொருளைச் சுருக்கவில்லை.
- source_word: τί δὲ ἔχεις
  choice: நீ பெற்றுக்கொள்ளாதது உன்னிடம் என்ன இருக்கிறது?
  rationale: δὲ இங்கு மென்மையான தொடர்ச்சியைத் தருகிறது; அடுத்த வினாவைத் தமிழில் இணைப்புச்சொல் இல்லாமலேயே இயல்பாகத் தொடர முடிகிறது. ἔχεις என்பதற்கு ‘உன்னிடம் ... இருக்கிறது’ என்று இயல்பான நிகழ்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὃ οὐκ ἔλαβες
  choice: நீ பெற்றுக்கொள்ளாதது
  rationale: ἔλαβες இறந்தகாலத்தில் நிறைவு பெற்ற பெறுதலைக் குறிக்கிறது. ‘பெற்றுக்கொள்ளாதது’ என்பது மனிதனிடம் உள்ளவை அவனால் தானாக உருவாக்கப்பட்டவை அல்ல, பெற்றவை என்ற வாதத்தைத் துல்லியமாகக் காக்கிறது.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: நீ அதைப் பெற்றுக்கொண்டிருந்தால்
  rationale: εἰ உடன் வரும் καὶ, பெறுதல் உண்மையென வலியுறுத்துகிறது. தமிழின் நிபந்தனை வடிவமான ‘பெற்றுக்கொண்டிருந்தால்’ அந்த வலியுறுத்தலைச் சூழலில் இயல்பாகத் தருகிறது. ‘அதை’ என்பது முந்தைய வினாவில் குறிப்பிடப்பட்ட உடைமை அல்லது வரத்தைக் குறிக்கச் சேர்க்கப்பட்டுள்ளது.
- source_word: τί καυχᾶσαι
  choice: ஏன் பெருமை பேசுகிறாய்?
  rationale: καυχάομαι என்பதன் பவுலின் வழக்கமான கண்டனப் பொருளை ‘பெருமை பேசு’ இயல்பாக வெளிப்படுத்துகிறது; நிகழ்காலம் தொடர்ந்து காணப்படும் மனப்பான்மை அல்லது நடத்தையைச் சுட்டுகிறது.
- source_word: ὡς μὴ λαβών
  choice: பெற்றுக்கொள்ளாதவனைப் போல
  rationale: 'இந்தப் பங்கேற்பு வடிவம் உண்மைக்கு மாறான தோற்றம் அல்லது முறையைக் காட்டுகிறது: பெற்றிருந்தும் பெறாதவன் போலப் பெருமை பேசுதல். தமிழில் இது சுருக்கமாகவும் தெளிவாகவும் வழங்கப்பட்டுள்ளது.'
theological_decisions:
- issue: மனிதரின் மேன்மை மற்றும் பெற்ற வரங்கள் குறித்த பவுலின் கண்டனத்தின் பரப்பு
  choice: ஒருவரிடம் உள்ள வேறுபாடு, உடைமை அல்லது தகுதி எதுவாயினும் அது பெற்றதே அன்றி தானாக உருவானது அல்ல என்ற பொதுவான வலியுறுத்தலை மொழிபெயர்ப்பு காக்கிறது.
  alternative: இதை ஆவிக்குரிய வரங்கள் அல்லது ஊழியப் பொறுப்புகளுக்கு மட்டும் வரையறுத்தல்; அல்லது ஒவ்வொரு திறமை, அந்தஸ்து, ஆசீர்வாதம் அனைத்துக்கும் வெளிப்படையாக விரிவாக்குதல்.
  rationale: உடனடி சூழல் அப்போஸ்தல ஊழியம், பிரிவினைப் பெருமை, தற்பெருமை ஆகியவற்றைப் பற்றியது. ஆனால் வசனத்தின் சொற்கள் பொதுவானவை; ஆகவே மூல உரை அளிப்பதைவிடக் குறுகலாகவோ விரிவாகவோ பொருளை நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான மூன்று சொல்லாட்சிக் கேள்விகளின் கண்டன வலிமை காக்கப்பட்டுள்ளது. ‘மற்றவர்களிடமிருந்து’ என்பது தமிழில் διακρίνει என்பதன் ஒப்பீட்டுப் பொருளைத் தெளிவாக்குகிறது; அடிக்குறிப்பு அதன் உண்மையான சொற்பொருள் பரப்பைச் சுட்டுகிறது.
