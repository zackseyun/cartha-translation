  source_fidelity: முதல் இரண்டு வினாக்களும் மூலத்தின் பொருளைச் சரியாகக் காட்டுகின்றன. ஆனால் εἰ δὲ καὶ ἔλαβες என்பது உண்மையைக் கருதி முன்வைக்கும் வினா; ‘பெற்றுக்கொண்டிருந்தால்’ என்ற வடிவம் தமிழில் உண்மையற்ற அல்லது வெறும் நிபந்தனைப் பொருளை ஏற்படுத்தலாம். ‘பெற்றுக்கொண்டாயே’ என்பது வலியுறுத்தலையும் வினாவியல் ஓட்டத்தையும் நன்றாகக் காக்கும். ὡς μὴ λαβών என்பதிலுள்ள மறுக்கப்பட்ட பங்கேற்பு, ‘பெற்றுக்கொள்ளாதவனைப் போல’ என்பதைக் காட்டிலும் ‘பெற்றுக்கொள்ளாதது போல’ என முந்தைய ‘அது’வோடு இணைந்தால் துல்லியமாகும்.
  naturalness: ‘உன்னை மற்றவர்களிடமிருந்து வேறுபடுத்துகிறவர் யார்?’ மற்றும் ‘நீ பெற்றுக்கொள்ளாதது உன்னிடம் என்ன இருக்கிறது?’ ஆகியவை நவீனத் தரமான தமிழில் இயல்பானவை. மூன்றாவது வினாவில் ‘நீ அதைப் பெற்றுக்கொண்டாயே’ என்ற அமைப்பு பவுலின் கூர்மையான வினாவியல் வலியுறுத்தலைத் தெளிவாகவும் இயல்பாகவும் தரும்.
  terminology: ‘பெருமை பேசுகிறாய்’ என்பது καυχᾶσαι என்பதற்கு ஏற்ற, நடுநிலையான சொல். ‘பெற்றுக்கொள்’ தொடர்ந்து பயன்படுத்தப்படுவது ἔλαβες/λαβών என்பதன் மீளுரைப்பை பாதுகாக்கிறது. அடிக்குறிப்பில் ‘வேறுபட்டவனாகத் தீர்மானிப்பவர்’ என்பது διακρίνει என்பதற்குப் பொருத்தமற்ற அளவு நீதித்தீர்ப்பு நிழலைக் கொண்டுள்ளது; ‘தனித்து நிற்கச் செய்கிறவர்’ அல்லது ‘தனிப்படுத்துகிறவர்’ சிறந்த மாற்று.
