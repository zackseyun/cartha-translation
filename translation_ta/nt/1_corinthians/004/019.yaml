translation:
  language: ta
  text: ஆனால், ஆண்டவர் விரும்பினால், விரைவில் உங்களிடம் வருவேன்; பெருமையால் வீங்கியிருப்பவர்களின் பேச்சை அல்ல, வல்லமையை அறிந்துகொள்வேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறிந்துகொள்வேன்’ என்பது நேரில் வந்து ஆராய்ந்து உணர்வதைக் குறிக்கலாம். ‘பெருமையால் வீங்கியிருப்பவர்கள்’ என்பது அகந்தையால் ஊதிப்பெரிதானவர்களைச் சித்தரிக்கும் ஓர் உருவகம்; இதே சொல்லை பவுல் இக்கடிதத்தில் பலமுறை பயன்படுத்துகிறார்.
    reason: lexical_nuance_and_cross_reference
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: ஆனால் விரைவில் உங்களிடம் வருவேன்
  rationale: δέ முந்தைய கருத்துடன் மென்மையான மாறுபாட்டைக் காட்டுவதால் ‘ஆனால்’ எனவும், ταχέως இங்கு வருகையின் அண்மைக்காலத்தைச் சுட்டுவதால் ‘விரைவில்’ எனவும் மொழிபெயர்க்கப்பட்டது. πρὸς ὑμᾶς உடன் ἐλεύσομαι என்பது கொரிந்தியரை நோக்கிய வருகையைக் குறிக்கிறது.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: ஆண்டவர் விரும்பினால்
  rationale: நிபந்தனைத் தொடரின் இயல்பையும் ஆண்டவருடைய விருப்பத்தைச் சார்ந்திருப்பதையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; κύριος யாரைக் குறிப்பதாகும் என்பதை உரையைவிடக் குறிப்பாக்கவில்லை.
- source_word: γνώσομαι
  choice: அறிந்துகொள்வேன்
  rationale: தனிப்பட்ட வருகையின்போது உண்மை நிலையை ஆராய்ந்து தெரிந்துகொள்வதைச் சூழல் காட்டுகிறது; அதேவேளை கிரேக்க வினையின் அடிப்படைப் பொருளுக்கு அருகில் நிற்கிறது.
- source_word: τὸν λόγον
  choice: பேச்சை
  rationale: λόγος இங்கு δύναμις என்பதற்கு எதிராக மனிதர்களின் சொல் அல்லது பேச்சைக் குறிக்கிறது. ‘பேச்சு’ இயல்பான தமிழில் இந்த விரிவான எதிர்மறை ஒப்பீட்டைக் காக்கிறது.
- source_word: τῶν πεφυσιωμένων
  choice: பெருமையால் வீங்கியிருப்பவர்களின்
  rationale: φυσιόω என்பதன் ‘ஊதப்பட்டு வீங்குதல்’ என்ற உருவகத்தையும், நிறைவேற்றப்பட்ட வினை வடிவம் காட்டும் தொடரும் தற்போதைய அகந்தை நிலையையும் காக்கிறது.
- source_word: ἀλλὰ τὴν δύναμιν
  choice: அவர்களுடைய வல்லமையையே
  rationale: λόγος–δύναμις எதிர்மறை ஒப்பீட்டை ‘பேச்சு–வல்லமை’ எனக் காக்கிறது. தமிழில் உரிமைத் தொடர்பு தெளிவாக அமைய ‘அவர்களுடைய’ சேர்க்கப்பட்டது; வல்லமையின் தன்மை குறுகலாக விளக்கப்படவில்லை.
theological_decisions:
- issue: ὁ κύριος என்பவர் யார்?
  choice: ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘ஆண்டவராகிய இயேசு’ அல்லது ‘கடவுள்’ என்று குறிப்பாக்குதல்
  rationale: கிரேக்க உரை ὁ κύριος என்று மட்டுமே கூறுகிறது. பவுலின் பயன்பாட்டில் இது கிறிஸ்துவைக் குறிக்கக்கூடும்; ஆனால் இவ்வசனம் தனியாக அந்த அடையாளத்தை வெளிப்படையாகத் தீர்மானிக்கவில்லை.
- issue: λόγος மற்றும் δύναμις இடையிலான எதிர்மறை ஒப்பீடு
  choice: ‘பேச்சு’ மற்றும் ‘வல்லமை’ என்ற விரிவான எதிர்மறை ஒப்பீட்டை நிலைநிறுத்துதல்
  alternative: வல்லமையை அற்புத வல்லமை, அப்போஸ்தல அதிகாரம் அல்லது செயல்திறன் என்று குறிப்பாக்குதல்
  rationale: சூழல் வெறும் பெருமைப் பேச்சையும் மெய்யான வல்லமையையும் வேறுபடுத்துகிறது; ஆனால் அந்த வல்லமை எவ்வாறு வெளிப்படுகிறது என்பதை இவ்வசனம் மட்டும் குறுக்கிப் பொருள்கொள்ளச் சொல்லவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெருமையால் வீங்கியிருப்பவர்கள்’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘பேச்சு–வல்லமை’ என்ற சுருக்கமான இறையியல் பதற்றம் விளக்கி முடிவுசெய்யப்படவில்லை.
