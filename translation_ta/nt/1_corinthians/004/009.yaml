source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: ta
  text: ஏனெனில், கடவுள் அப்போஸ்தலர்களாகிய எங்களை மரணத்துக்குத் தீர்ப்பிடப்பட்டவர்களைப்போல்[a] கடைசி இடத்தில் காட்சிப்படுத்தினார் என்று நான் கருதுகிறேன்; ஏனெனில், நாங்கள் உலகத்துக்கும் வானதூதர்களுக்கும் மனிதர்களுக்கும்[c] ஒரு பொதுக்காட்சியாக[b] ஆகியிருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரிப்பதற்கெனக் குறிக்கப்பட்டவர்களைப்போல்.” கிரேக்கச் சொல் மரணத்துக்கென நியமிக்கப்பட்டவர்களைக் குறிக்கிறது; பொதுவெளி அரங்கக் காட்சியின் உருவகம் பின்னணியில் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதிக நேரடியாக, “ஒரு அரங்கமாக.” இங்கு பொருள், அனைவரும் பார்க்கும் ஒரு பொதுக்காட்சி என்பதாகும்.
    reason: lexical_alternative
  - marker: c
    text: “மனிதர்கள்” என்பது ஆண்களை மட்டும் அல்ல, வானதூதர்களுக்கு மாறாக மனிதர்களை பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: ஏனெனில் … என்று எனக்குத் தோன்றுகிறது
  rationale: முதல் நபரின் தனிப்பட்ட மதிப்பீட்டையும் γάρ குறிக்கும் முந்தைய கருத்துடனான விளக்கத் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: அப்போஸ்தலர்களாகிய எங்களை
  rationale: τοὺς ἀποστόλους என்பது ἡμᾶς என்பதைக் குறிப்பாக அடையாளப்படுத்தும் இணைப்புச் சொற்றொடர்; பவுல் குறிப்பிடுவது அப்போஸ்தலர்களாகிய தமது குழுவையே என்பதைத் தெளிவாக்குகிறது.
- source_word: ἐσχάτους
  choice: கடைசியானவர்களாக
  rationale: இறுதியிடத்திலும் தாழ்ந்த நிலையிலும் நிறுத்தப்பட்டவர்கள் என்ற சொல்லின் வலிமையைத் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: ἀπέδειξεν
  choice: காட்சிப்படுத்தினார்
  rationale: பின்வரும் அரங்கக் காட்சி உருவகத்துக்கு ஏற்ற பொதுமக்கள் முன்னிலையிலான வெளிப்படுத்துதலைக் குறிக்கிறது; கிரேக்க இறந்தகால வடிவத்தையும் பிரதிபலிக்கிறது.
- source_word: ὡς ἐπιθανατίους
  choice: மரணத்துக்குத் தீர்ப்பிடப்பட்டவர்களைப்போல்
  rationale: மரிப்பதற்கென நியமிக்கப்பட்ட அல்லது மரணத்துக்குக் குறிக்கப்பட்டவர்களைக் குறிக்கும் சொல்லை, சாத்தியமான அரங்கப் பின்னணியுடன் இயல்பாக வழங்குகிறது.
- source_word: θέατρον ἐγενήθημεν
  choice: நாங்கள் ஒரு பொதுக்காட்சியாக ஆகியிருக்கிறோம்
  rationale: θέατρον என்பதன் நேரடி ‘அரங்கம்’ என்ற வடிவத்தை விட, இங்கு பார்வைக்கு வைக்கப்பட்ட காட்சி என்ற உருவகப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: உலகத்துக்கும் வானதூதர்களுக்கும் மனிதர்களுக்கும்
  rationale: உலகளாவிய பார்வையாளர்களையும், வானதூதர்கள் மற்றும் மனிதர்கள் என்ற இணையான குறிப்புகளையும் மூலத்தின் வரிசையில் காக்கிறது.
theological_decisions:
- issue: ἀγγέλοις என்பதன் பொருள்
  choice: வானதூதர்கள்
  alternative: தூதர்கள் / செய்தியாளர்கள்
  rationale: ‘உலகம்’ மற்றும் ‘மனிதர்கள்’ என்பவற்றுடன் வரும் இச்சூழலில் இயற்கையான பொருள் விண்ணுலக ஆவிக்குரிய உயிர்கள்; உரைக்கு அப்பாற்பட்ட கொள்கை விளக்கம் சேர்க்கப்படவில்லை.
- issue: ἐσχάτους என்பதில் காலவரிசையா அல்லது தாழ்ந்த நிலையா
  choice: கடைசியானவர்களாக
  alternative: எல்லாருக்கும் கடைசியில்
  rationale: கிரேக்கச் சொல் இறுதியாக நிறுத்தப்படுதல் மற்றும் மிகத் தாழ்ந்த இடம் ஆகிய இரு நிழற்பொருள்களுக்கும் இடமளிக்கிறது; தமிழில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் ambiguity காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலர்,’ ‘வானதூதர்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. இரண்டு γάρ சொற்களும் ‘ஏனெனில்’ என்று வெளிப்படுத்தப்பட்டு வாதத்தின் விளக்கத் தொடர் பாதுகாக்கப்பட்டுள்ளது.
