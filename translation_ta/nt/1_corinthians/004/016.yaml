  text: παρακαλῶ οὖν ὑμᾶς, μιμηταί μου γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/016.yaml
  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: ta
  text: 'ஆகவே, நான் உங்களை அறிவுறுத்துகிறேன்: என்னைப் பின்பற்றுபவர்கள் ஆகுங்கள்[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைப் பின்பற்றுபவர்களாக இருங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: வேறொரு இடத்தில் பவுல், “நான் கிறிஸ்துவைப் பின்பற்றுவதுபோல, நீங்களும் என்னைப் பின்பற்றுகிறவர்களாக இருங்கள்” என்று கூறுகிறார் (1 கொரிந்தியர் 11:1).
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: வலியுறுத்துகிறேன்
  rationale: இங்கு ஆறுதலளித்தல் அல்லது சாதாரணமாக வேண்டிக்கொள்ளுதல் என்பதைக் காட்டிலும், பவுலின் தீவிரமான அறிவுறுத்தலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவையும் அறிவுறுத்தலுடனான தர்க்கத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: இது παρακαλῶ என்பதன் பன்மை நேர்செயப்படுபொருள்; தமிழில் மரியாதைப் பன்மை வடிவம் சூழலுக்கு இயல்பாக உள்ளது.
- source_word: μιμηταί
  choice: பின்பற்றுகிறவர்கள்
  rationale: ஒருவரின் நடத்தை அல்லது முன்மாதிரியைப் பார்த்து அதன்படி நடப்பவர்களைக் குறிக்கிறது. ‘போலச் செய்பவர்கள்’ என்பதைக் காட்டிலும் ‘பின்பற்றுகிறவர்கள்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: μου
  choice: என்னை
  rationale: μιμηταί உடனான தொடர்பை தமிழில் இயல்பாக ‘என்னைப் பின்பற்றுகிறவர்கள்’ என்று வெளிப்படுத்துகிறது; பவுலே உடனடி முன்மாதிரி என்பதைப் பாதுகாக்கிறது.
- source_word: γίνεσθε
  choice: ஆகுங்கள்
  rationale: γίνομαι வினையின் கட்டளை வடிவம் ஒரு நிலையை ஏற்றுக்கொள்வதையோ அதற்குள் வருவதையோ குறிக்கிறது; ஆகவே வெறும் ‘இருங்கள்’ என்பதைக் காட்டிலும் ‘ஆகுங்கள்’ துல்லியமானது.
theological_decisions:
- issue: பவுல் தன்னைப் பின்பற்றுமாறு கூறுவது, அதன் விரிவான கிறிஸ்து மையச் சூழலிலிருந்து பிரிக்கப்பட்டால் மிகைப்படுத்தப்படலாம்; இருப்பினும் இந்த வசனம் பவுலையே நேரடியான முன்மாதிரியாகக் குறிப்பிடுகிறது.
  choice: ‘என்னைப் பின்பற்றுகிறவர்களாக ஆகுங்கள்’ என்று நேரடியாக மொழிபெயர்த்தல்.
  alternative: ‘என் முன்மாதிரியைப் பின்பற்றுங்கள்.’
  rationale: கிரேக்க வாசகம் பவுலை உடனடி முன்மாதிரியாகத் தெளிவாக முன்வைக்கிறது. ‘என் முன்மாதிரியைப் பின்பற்றுங்கள்’ என்பது பொருளளவில் ஏற்றதாக இருந்தாலும், மூலத்தின் பெயர்ச்சொல் அமைப்பையும் கூர்மையான இறையியல் பதற்றத்தையும் ஓரளவு மென்மையாக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வலியுறுத்துகிறேன்’ தீவிரமான அப்போஸ்தல அறிவுறுத்தலை வெளிப்படுத்துகிறது; ‘பின்பற்றுகிறவர்களாக ஆகுங்கள்’ என்பது மூலத்தின் μιμηταί மற்றும் γίνεσθε ஆகிய இரண்டின் கூறுகளையும் முடிந்தவரை தெளிவாகப் பாதுகாக்கிறது.
