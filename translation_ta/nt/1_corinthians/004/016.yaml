revisions:
- from: ஆகவே, என்னைப் பின்பற்றுகிறவர்களாக ஆகுங்கள்[a][b] என்று உங்களை வலியுறுத்துகிறேன்.
  to: 'ஆகவே, நான் உங்களை அறிவுறுத்துகிறேன்: என்னைப் பின்பற்றுபவர்கள் ஆகுங்கள்[a][b].'
  rationale: The revision places Paul’s appeal first, as in the Greek, replaces the less precise வலியுறுத்துகிறேன் with அறிவுறுத்துகிறேன், and smooths the imperative into idiomatic modern Tamil. It preserves the explicit reference to Paul as the one to be imitated and retains both supplied footnote anchors and their intended functions.
