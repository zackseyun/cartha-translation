id: 1CO.14.30
reference: 1 Corinthians 14:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἄλλῳ ἀποκαλυφθῇ καθημένῳ, ὁ πρῶτος σιγάτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/030.yaml
  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: ta
  text: ஆனால், அமர்ந்திருக்கும் வேறொருவருக்கு ஏதாவது வெளிப்படுத்தப்பட்டால்[a], முதலில் பேசிக்கொண்டிருப்பவர் பேசுவதை நிறுத்தட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அமர்ந்திருக்கும் வேறொருவருக்கு ஒரு வெளிப்பாடு அருளப்பட்டால்.”
    reason: பெயர்ச்சொல்லை நேரடியாகக் கொண்டிராத கிரேக்க வினைச்சொல்லை, சூழலின் அடிப்படையில் ‘ஒரு வெளிப்பாடு’ என்று மொழிபெயர்க்கவும் முடியும்.
  - marker: b
    text: அதாவது, மற்றவர் பேசுவதற்காக முதலில் பேசிக்கொண்டிருப்பவர் தமது பேச்சை நிறுத்த வேண்டும்.
    reason: இச்சூழலில் ‘அமைதியாக இருத்தல்’ என்பது மற்றவருக்கு இடமளிக்க பேசுவதை நிறுத்துவதைக் குறிக்கிறது.
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: ஆனால், ... வெளிப்படுத்தப்பட்டால்
  rationale: ἐὰν நிபந்தனையையும் δὲ மிதமான மாறுபாடு அல்லது அடுத்த கட்டத்தையும் குறிக்கின்றன; தமிழில் ‘ஆனால் ... என்றால்’ என்ற அமைப்பு இவ்விரண்டையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἄλλῳ
  choice: வேறொருவருக்கு
  rationale: தற்போது பேசுபவரிலிருந்து வேறுபட்ட இன்னொரு பங்கேற்பாளரைத் தத்துவ ஒருமை வேற்றுமை வடிவம் குறிக்கிறது.
- source_word: ἀποκαλυφθῇ
  choice: ஏதாவது வெளிப்படுத்தப்பட்டால்
  rationale: ἀποκαλύπτω என்பதன் இறந்தகாலச் செயப்பாட்டு நிபந்தனை வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; ‘வெளிப்பாடு ஒன்று கொடுக்கப்பட்டால்’ என்று பெயர்ச்சொல்லைச் சேர்ப்பதைவிட, கிரேக்க வினைச்சொல்லின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: καθημένῳ
  choice: அமர்ந்திருக்கும்
  rationale: ἄλλῳ என்பதைக் குறிப்பிடும் நிகழ்காலப் பங்கேற்புப் பெயரெச்சம்; சபையில் அமர்ந்திருக்கும் மற்றொரு நபரைக் குறிக்கிறது.
- source_word: ὁ πρῶτος
  choice: முதலில் பேசிக்கொண்டிருப்பவர்
  rationale: சொல்லுக்கு நெருக்கமாக ‘முதலாமவர்’ என இருந்தாலும், சூழலில் ஏற்கெனவே பேசிக்கொண்டிருக்கும் முதல் நபரையே குறிக்கிறது; தமிழில் தெளிவுக்காக மறைமுகமாக உள்ள ‘பேசுபவர்’ வெளிப்படுத்தப்படுகிறது.
- source_word: σιγάτω
  choice: பேசுவதை நிறுத்தட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தின் வலிமையைப் பாதுகாத்து, இச்சூழலில் σιγάω என்பது நிரந்தர மௌனமல்ல, மற்றவர் பேச இடமளிக்க தற்போதைய பேச்சை நிறுத்துதல் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: சபைத் தீர்க்கதரிசனத்தில் வெளிப்படுத்தப்படும் நிகழ்வின் தன்மை
  choice: ‘ஏதாவது வெளிப்படுத்தப்பட்டால்’ என்று செயப்பாட்டு வடிவில் மொழிபெயர்த்து, செய்பவரை வெளிப்படையாகக் குறிப்பிடாமல் விடுதல்
  alternative: ‘தேவனிடமிருந்து வேறொருவருக்கு ஒரு வெளிப்பாடு கொடுக்கப்பட்டால்’
  rationale: சூழல் தெய்வீக வெளிப்பாட்டைக் குறிப்பதாக இருந்தாலும், இவ்வசனம் செய்பவராக தேவனை வெளிப்படையாகப் பெயரிடவில்லை. ஆகவே மூலத்தின் கட்டுப்பாடும் இறையியல் நெருக்கடியும் பாதுகாக்கப்படுகின்றன.
- issue: ὁ πρῶτος என்பவர் யார்
  choice: ‘முதலில் பேசிக்கொண்டிருப்பவர்’ என்று சூழல்சார் பொருளைத் தெளிவுபடுத்துதல்
  alternative: ‘முதலாமவர்’
  rationale: முந்தைய வசனங்களில் தீர்க்கதரிசிகள் ஒவ்வொருவராகப் பேசுவது பற்றிய ஒழுங்கு கூறப்படுகிறது. இருப்பினும் ‘தீர்க்கதரிசி’ என்பதை நேரடியாகச் சேர்க்காமல், உரையில் உள்ள சூழலளவிலேயே தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சபை வழிகாட்டுதலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மௌனமாயிருக்கட்டும்’ என்ற அதிக இலக்கியத் தொனிக்குப் பதிலாக ‘பேசுவதை நிறுத்தட்டும்’ என்பது சூழல்சார் பொருளையும் நடைமுறை அறிவுறுத்தலையும் தெளிவாக வழங்குகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
