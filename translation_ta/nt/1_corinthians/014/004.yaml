  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: ta
  text: ஒரு மொழியில் பேசுகிறவர் தன்னைக் கட்டியெழுப்புகிறார்; ஆனால் இறைவாக்குரைக்கிறவர் சபையைக் கட்டியெழுப்புகிறார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு மொழியில்’ என்பதற்கு ‘நாவில்’ என்றும் மொழிபெயர்க்கலாம். இவ்வதிகாரத்தின் சூழலில் இது ஆவிக்குரிய வரமாகிய மொழிப் பேச்சைக் குறிக்க வாய்ப்புள்ளது; ஆனால் அந்தப் பேச்சின் துல்லிய இயல்பு குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘சபை’ என்பதற்கு ‘திருச்சபை,’ ‘கூட்டம்’ அல்லது ‘விசுவாசிகளின் சமூகம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: பேசுகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பெயரெச்சத்தை இயல்பான தமிழில் பொதுவான ஒருவரைக் குறிக்கும் வகையில் மொழிபெயர்க்கிறது; இரண்டாம் கூறுடனான இணை அமைப்பையும் காக்கிறது.
- source_word: γλώσσῃ
  choice: வேறு மொழியில்
  rationale: γλῶσσα என்பதன் அடிப்படை மொழிப் பொருளைக் காக்கிறது; இச்சூழலில் இது ஆவிக்குரிய வரமாகிய மொழிப் பேச்சைக் குறிக்கக்கூடும் என்றாலும், அதன் துல்லிய இயல்பை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- source_word: ἑαυτὸν
  choice: தன்னையே
  rationale: ஒருமைத் தற்சுட்டுப் பெயர்ச்சொல்லையும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. தமிழில் இது பாலினத்தைக் குறிப்பிடாமல் பொதுவான நபரைக் குறிக்க முடியும்.
- source_word: οἰκοδομεῖ
  choice: வளரச்செய்கிறார்
  rationale: கட்டியெழுப்புதல் என்ற உருவகத்தின் சூழல்சார் பொருளான ஆவிக்குரிய வளர்ச்சியையும் உறுதிப்படுத்துதலையும் சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: ὁ δὲ προφητεύων
  choice: ஆனால் இறைவாக்குரைக்கிறவர்
  rationale: δέ காட்டும் மிதமான எதிர்மறை ஒப்பீட்டையும், பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பெயரெச்சத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκκλησίαν
  choice: திருச்சபையை
  rationale: பவுலின் சூழலில் கூடிவரும் கிறிஸ்தவ விசுவாசிகளின் சமூகத்தைக் குறிக்கும் வழக்கமான, கண்ணியமான தமிழ்ச் சொல்; மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: 1 கொரிந்தியர் 12–14ல் γλώσσῃ என்பதன் பொருள்
  choice: ‘வேறு மொழியில்’ என்று மொழிபெயர்த்து, ஆவியால் அருளப்படும் மொழிப் பேச்சைக் குறிக்கும் சூழலை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘அந்நிய பாஷையில்’ அல்லது ‘நாவில்’ என்று மொழிபெயர்த்து நிகழ்வின் இயல்பை மேலும் குறிப்பாக்குதல்
  rationale: உடனடிச் சூழல் ஆவிக்குரிய வரத்தைப் பற்றியது. இருப்பினும் அது அறியப்பட்ட மனித மொழியா அல்லது வேறுவகை மொழிப் பேச்சா என்பதை வசனம் தீர்மானிக்காததால், அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: ஆண்பால் ஒருமை வடிவங்களின் பொதுப்பொருள்
  choice: ‘பேசுகிறவர் … தன்னையே’ என்ற பாலினம் குறிப்பிடாத தமிழ் அமைப்பு
  alternative: ஆண்பாலை வெளிப்படையாகக் காட்டும் ‘பேசுகிறவன் … தன்னையே’
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு பிரதிநிதித்துவப் பொதுப்பொருளில் வருகிறது. தமிழ் மரியாதை ஒருமை மூலத்தின் ஒருமையையும் பொதுப்பொருளையும் இயல்பாகக் காக்கிறது; தேவையற்ற ஆண்பால் வரையறையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அந்நிய பாஷை’ என்ற பழைய வழக்கிற்கு மாற்றாக ‘வேறு மொழி’ பயன்படுத்தப்பட்டுள்ளது. ‘வளரச்செய்கிறார்’ என்பது கட்டியெழுப்புதல் உருவகத்தின் ஆவிக்குரிய பயனைத் தெளிவாகச் சொல்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
