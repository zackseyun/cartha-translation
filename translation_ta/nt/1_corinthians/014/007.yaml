source:
  edition: SBLGNT
  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: ta
  text: குழலோ யாழோ போன்ற ஒலி எழுப்பும் உயிரற்ற கருவிகள்கூட, சுரங்களில் வேறுபாட்டை ஏற்படுத்தாவிட்டால், குழலிலோ யாழிலோ இசைக்கப்படுவது எதுவென்று எப்படி அறிய முடியும்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμως
  choice: கூட
  rationale: உயிருள்ள பேச்சாளர்களிலிருந்து உயிரற்ற இசைக்கருவிகளுக்கு வலியுறுத்தலுடன் நகரும் ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ ἄψυχα φωνὴν διδόντα
  choice: ஒலி எழுப்புகிற உயிரற்ற கருவிகள்
  rationale: சொல்லளவில் ‘ஒலி கொடுக்கும் உயிரற்றவை’ என்ற பொருள்; சூழலில் அவை இசைக்கருவிகள் என்பதால், தமிழில் தெளிவாகவும் இயல்பாகவும் ‘கருவிகள்’ எனக் குறிப்பிடப்பட்டுள்ளது.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: குழலோ யாழோ
  rationale: αὐλός ஒரு ஊதுகருவி என்பதால் ‘குழல்’ பொருத்தமானது; κιθάρα பழங்கால நரம்பிசைக் கருவி என்பதால் பொதுவாசகருக்குப் புரியும் ‘யாழ்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; அதன் வரலாற்றுச் சிறப்புத்தன்மை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: சுரங்களை வேறுபடுத்தி ஒலிக்காவிட்டால்
  rationale: διαστολή குறிக்கும் வேறுபடுத்துதலையும், φθόγγοι குறிக்கும் இசை ஒலிகள் அல்லது சுரங்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πῶς γνωσθήσεται
  choice: எப்படி அறிந்துகொள்ள முடியும்?
  rationale: இசைக்கப்படுவதை அடையாளம் காணுதல் அல்லது அறிதல் என்ற சூழல்சார் பொருளை இயல்பான வினாவாக வழங்குகிறது.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: குழலில் அல்லது யாழில் இசைக்கப்படுவது
  rationale: இரு செயல்களையும் குறிக்கும் பெயராக்கப்பட்ட இறந்தகால வினையெச்சங்களின் செயப்பாட்டு பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
