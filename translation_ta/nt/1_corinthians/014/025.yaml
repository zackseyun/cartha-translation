source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: ta
  text: அவனுடைய இதயத்தில் மறைந்திருப்பவை வெளிப்படுகின்றன; அதனால் அவன் முகங்குப்புற விழுந்து கடவுளை வழிபட்டு, “உண்மையாகவே கடவுள் உங்கள் நடுவில் இருக்கிறார்”[a] என்று அறிவிப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உண்மையாகவே கடவுள் உங்களுக்குள் இருக்கிறார்.”'
    reason: ἐν ὑμῖν என்பது ‘உங்கள் நடுவில்’ என்றும் ‘உங்களுக்குள்’ என்றும் பொருள்படக்கூடியது.
lexical_decisions:
- source_word: τὰ κρυπτὰ τῆς καρδίας αὐτοῦ
  choice: அவனுடைய இதயத்தில் மறைந்திருப்பவை
  rationale: மனிதனின் உள்ளார்ந்த எண்ணங்களையும் நோக்கங்களையும் குறிக்கும் மறைவானவற்றை இயல்பான தமிழில் தெரிவிக்கிறது; ‘இதயம்’ என்ற வேதாகம மானுடவியல் சொல்லையும் தக்கவைக்கிறது.
- source_word: φανερὰ γίνεται
  choice: வெளிப்படுகின்றன
  rationale: மறைந்திருந்தவை வெளிப்படையாகவும் தெளிவாகவும் ஆகும் நிகழ்வை, மூலத்தின் நிகழ்கால வடிவத்துடன் இயல்பாகக் காட்டுகிறது.
- source_word: οὕτως
  choice: அப்போது
  rationale: இதயத்தின் மறைவானவை வெளிப்படுவதன் விளைவாக அடுத்த செயல் நிகழ்வதைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: முகங்குப்புற விழுந்து
  rationale: வணக்கத்திற்காகத் தரையில் முகம் படும்படி விழும் தெளிவான உடல் நிலையைச் சுருக்கமாகவும் உயிரோட்டமாகவும் காட்டுகிறது.
- source_word: προσκυνήσει τῷ θεῷ
  choice: கடவுளை வழிபட்டு
  rationale: இச்சூழலில் கடவுளை நோக்கிய மத வழிபாட்டைக் குறிக்கிறது; உடலைத் தாழ்த்தும் கூறு முந்தைய சொற்றொடரில் ஏற்கெனவே வெளிப்படுகிறது.
- source_word: ἀπαγγέλλων
  choice: என்று அறிவிப்பான்
  rationale: அவன் உணர்ந்த முடிவை வெளிப்படையாகத் தெரிவிப்பதைச் சொல்கிறது; ‘பிரசங்கிப்பான்’ போன்ற தேவையற்ற வலிமையைச் சேர்ப்பதில்லை.
- source_word: Ὄντως
  choice: உண்மையாகவே
  rationale: அவன் கூறும் முடிவின் நிச்சயத்தையும் மெய்ம்மையையும் வலியுறுத்துகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்கள் நடுவில்
  rationale: கூடியிருக்கும் சபையினரின் மத்தியில் கடவுள் இருப்பதை வெளியிலிருந்து வந்தவர் உணர்கிறார் என்ற உடனடிச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதி அறிக்கையில் ἐν ὑμῖν என்பதன் பொருள்
  choice: உங்கள் நடுவில்
  alternative: உங்களுக்குள்
  rationale: உடனடிச் சூழல் கூடியிருக்கும் சபையைப் பற்றியது என்பதால் கூட்டத்தின் மத்தியில் கடவுளின் பிரசன்னம் இருப்பதே முதன்மைப் பொருளாகத் தெரிகிறது. எனினும், கிரேக்கச் சொற்றொடர் உள்ளார்ந்திருத்தல் என்ற பொருளையும் ஏற்கக்கூடும்; அந்த உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதயம்’, ‘முகங்குப்புற’, ‘வழிபட்டு’ ஆகியவை மூலத்தின் உருவகத்தையும் செயற்படிமத்தையும் தக்கவைக்கின்றன; தனிப்பிரிவு சார்ந்த சொல்வழக்குகள் தவிர்க்கப்பட்டுள்ளன.
