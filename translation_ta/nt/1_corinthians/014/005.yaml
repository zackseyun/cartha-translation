revisions:
- from: நீங்கள் அனைவரும் மொழிகளில் பேச வேண்டும் என்று நான் விரும்புகிறேன்[a]; ஆனால் அதைவிட, நீங்கள் இறைவாக்கு உரைக்க வேண்டும் என்று விரும்புகிறேன். மொழிகளில் பேசுகிறவர் அதைப் பொருள் விளக்கினால் தவிர[b], அவரைவிட இறைவாக்கு உரைக்கிறவர் மேலானவர்; ஏனெனில் அப்போதுதான் திருச்சபை கட்டியெழுப்பப்படும்.
  to: நீங்கள் அனைவரும் மொழிகளில் பேசுவதை நான் விரும்புகிறேன்[a]; ஆனால், நீங்கள் இறைவாக்கு உரைப்பதை அதைவிட அதிகமாக விரும்புகிறேன். மொழிகளில் பேசுகிறவர் அதைப் பொருள் விளக்கினால் தவிர[b], அவரைவிட இறைவாக்கு உரைக்கிறவர் மேலானவர்; திருச்சபை கட்டியெழுப்புதலைப் பெறும்படியாக.
