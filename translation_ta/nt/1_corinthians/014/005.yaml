  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: ta
  text: நீங்கள் அனைவரும் மொழிகளில் பேசுவதை நான் விரும்புகிறேன்[a]; ஆனால், நீங்கள் இறைவாக்கு உரைப்பதை அதைவிட அதிகமாக விரும்புகிறேன். மொழிகளில் பேசுகிறவர் அதைப் பொருள் விளக்கினால் தவிர[b], அவரைவிட இறைவாக்கு உரைக்கிறவர் மேலானவர்; திருச்சபை கட்டியெழுப்புதலைப் பெறும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் நேரடியாக ‘நாவுகள்’ என்றும், பயன்பாட்டில் ‘மொழிகள்’ என்றும் பொருள்படும். இங்கு ‘மொழிகளில் பேசுதல்’ என்பது 1 கொரிந்தியர் 12–14இல் வரும் தனித்துவமான பேச்சைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வேறொருவர் பொருள் விளக்கினால் தவிர.’ கிரேக்கத்தில் உள்ள ஒருமை வினை மொழிகளில் பேசுகிறவரையே குறிக்கலாம்; இந்த அதிகாரத்தின் பரந்த சூழலில் வேறொருவர் பொருள் விளக்குவதையும் குறிக்க வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω
  choice: நான் விரும்புகிறேன்
  rationale: பவுலின் தனிப்பட்ட விருப்பத்தை நேரடியாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: πάντας ὑμᾶς
  choice: நீங்கள் அனைவரும்
  rationale: முழுத் திருச்சபையையும் உள்ளடக்கும் பன்மை அழைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: λαλεῖν γλώσσαις
  choice: மொழிகளில் பேச
  rationale: γλῶσσα என்பதன் ‘நா/மொழி’ சார்ந்த பொருளைத் தக்கவைத்தபடி, 1 கொரிந்தியர் 12–14 சூழலில் இயல்பாகப் புரியக்கூடிய வடிவம்; ‘அந்நிய’ என்பதை மூலத்தில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: μᾶλλον δὲ
  choice: ஆனால் அதைவிட
  rationale: மொழிகளில் பேசுவதை நிராகரிக்காமல், இறைவாக்கு உரைப்பதற்குப் பவுல் தரும் ஒப்பீட்டு முன்னுரிமையை வெளிப்படுத்துகிறது.
- source_word: ἵνα προφητεύητε
  choice: நீங்கள் இறைவாக்கு உரைக்க வேண்டும்
  rationale: προφητεύω என்பதை வெறும் எதிர்காலக் கணிப்பாகக் குறுக்காமல், தேவனிடமிருந்து வரும் செய்தியை உரைத்தல் என்ற பரந்த பொருளில் வழங்குகிறது.
- source_word: μείζων
  choice: மேலானவர்
  rationale: ஒப்பீட்டை வெளிப்படையாக வைத்திருக்கிறது; அடுத்த நோக்கவாக்கியம் அதன் சூழலைத் திருச்சபையின் கட்டியெழுப்புதலாக வரையறுக்க அனுமதிக்கிறது.
- source_word: διερμηνεύῃ
  choice: அதைப் பொருள் விளக்கினால்
  rationale: இந்த அதிகாரத்தில் புரியாத பேச்சின் பொருளைச் சபைக்குப் புரியுமாறு தெரிவிப்பதைக் குறிக்கிறது; ‘மொழிபெயர்த்தால்’ என்பதைவிட சூழலுக்கு ஏற்றது.
- source_word: ἡ ἐκκλησία
  choice: திருச்சபை
  rationale: இங்கு கூடிவந்துள்ள கிறிஸ்தவச் சமூகத்தைக் குறிக்கும் பரவலாக அறியப்பட்ட தமிழ் சொல்.
- source_word: οἰκοδομὴν λάβῃ
  choice: திருச்சபை கட்டியெழுப்பப்படும்
  rationale: சொற்படிமமான ‘கட்டியெழுப்புதல்’ என்பதைத் தக்கவைத்து, இயல்பான தமிழில் சபை ஆன்மீகப் பயன் பெறுவதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைவாக்கு உரைப்பவர் ‘மேலானவர்’ என்பதன் பொருள்
  choice: ‘மேலானவர்’ என்ற ஒப்பீட்டை முதன்மை உரையில் தக்கவைத்து, சபை கட்டியெழுப்பப்படுதல் என்ற உடனடிச் சூழல் அதன் செயல்பாட்டு நோக்கைக் காட்ட அனுமதித்தல்
  alternative: ஆவிக்குரிய தகுதி, பரிசுத்தம் அல்லது பதவியில் உயர்ந்தவர் என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: மூலவாக்கியம் μείζων என்ற வலுவான ஒப்பீட்டைப் பயன்படுத்துகிறது; ஆனால் அதன் நோக்கவாக்கியம் சபையின் கட்டியெழுப்புதலைச் சுட்டுகிறது. ஆகவே ஒப்பீட்டை மெலிதாக்காமலும், உரை கூறாத ஆன்மீகப் படிநிலையைச் சேர்க்காமலும் வழங்கப்படுகிறது.
- issue: διερμηνεύῃ என்ற ஒருமை வினையின் எழுவாய்
  choice: உடனடியாக முன் குறிப்பிடப்பட்ட மொழிகளில் பேசுகிறவரையே எழுவாயாகக் கொண்டு, ‘அவர் அதைப் பொருள் விளக்கினால்’ என்று மொழிபெயர்த்தல்
  alternative: ‘வேறொருவர் பொருள் விளக்கினால்’ அல்லது ‘பொருள் விளக்கம் அளிக்கப்பட்டால்’
  rationale: புதிய எழுவாய் குறிப்பிடப்படாததால், இலக்கணப்படி மொழிகளில் பேசுகிறவரே இயல்பான முன்னிலை. இருப்பினும் அதிகாரத்தின் பரந்த சூழலில் வேறொருவர் விளக்குவதற்கும் இடமிருப்பதால் அந்தச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பழமையான ‘பாஷை’ தவிர்க்கப்பட்டு ‘மொழி’ பயன்படுத்தப்பட்டது; ‘தீர்க்கதரிசனம் சொல்லுதல்’ எதிர்காலக் கணிப்பு என்ற குறுகிய எண்ணத்தைத் தரக்கூடும் என்பதால் ‘இறைவாக்கு உரைத்தல்’ தேர்ந்தெடுக்கப்பட்டது. δέக்கு காலச்சுட்டான ‘இப்போது’ சேர்க்கப்படவில்லை.
