    issue: Unwarranted restrictive emphasis in the first question
    rationale: உங்களிடமிருந்துதான் can imply ‘from you alone/indeed,’ whereas ἀφ’ ὑμῶν simply marks source. The Greek reserves explicit exclusivity for εἰς ὑμᾶς μόνους in the second question.
