  verdict: revise
  source_fidelity: The two rhetorical alternatives, source/origin (ἀφ’ ὑμῶν ... ἐξῆλθεν) and exclusive arrival (εἰς ὑμᾶς μόνους κατήντησεν), are retained. However, தான் in உங்களிடமிருந்துதான் adds an explicit restrictive/emphatic element not present in the first Greek clause; exclusivity is explicitly expressed only in the second clause by μόνους.
  naturalness: The Tamil is clear, modern, and suitably pointed for Paul’s rhetorical question. Removing தான் from the first clause makes the parallel questions more exact while remaining natural.
  terminology: கடவுளுடைய வார்த்தை is a sound, broad rendering of ὁ λόγος τοῦ θεοῦ and does not prematurely identify the referent as only the gospel or only prophetic speech. வந்து சேர்ந்ததா naturally renders the arrival sense of κατήντησεν.
