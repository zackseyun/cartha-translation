base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: ta
  text: அல்லது, கடவுளுடைய வார்த்தை உங்களிடமிருந்து புறப்பட்டதா?[a] அல்லது அது உங்களிடம் மட்டும்தான் வந்து சேர்ந்ததா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளுடைய வார்த்தை உங்களிடமிருந்து தோன்றியதா?”
    reason: lexical_alternative
  - marker: b
    text: “அது உங்களிடம் மட்டுமே வந்ததா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: தொடக்கத்தில் வரும் பிரிப்பைக் குறிக்கும் வினாவிடைத் துகளை நேரடியாகக் காட்டுகிறது; கேள்வியின் வடிவமே பவுலின் கூர்மையான கண்டனத்தை வெளிப்படுத்துகிறது.
- source_word: ἀφ’ ὑμῶν
  choice: உங்களிடமிருந்துதான்
  rationale: ἀπό உடன் வரும் ஆறாம் வேற்றுமை மூலத்தையோ தொடக்கத்தையோ குறிக்கிறது. ‘தான்’ என்பது கொரிந்தியர்களே அதன் மூலம் என்ற எண்ணத்தை வினாவால் மறுக்கும் அழுத்தத்தை இயல்பாகத் தருகிறது.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: இறைச்செய்தி, நற்செய்தி அல்லது அதிகாரமுள்ள போதனை எனக் குறிப்பாகச் சுருக்காமல், கிரேக்கச் சொற்றொடரின் பரப்பையும் முறையான நிறையையும் காக்கிறது.
- source_word: ἐξῆλθεν
  choice: புறப்பட்டதா
  rationale: ἐξέρχομαι என்பதன் ‘வெளியே செல்லுதல்/புறப்படுதல்’ என்ற உருவகத்தைப் பாதுகாத்து, தோற்றமடைந்ததா என்ற உட்பொருளையும் சூழலில் உணர்த்துகிறது.
- source_word: εἰς ὑμᾶς μόνους
  choice: உங்களிடம் மட்டும்தான்
  rationale: μόνους தரும் தனிப்படுத்தும் அழுத்தத்தை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: κατήντησεν
  choice: வந்து சேர்ந்ததா
  rationale: καταντάω என்பதன் ‘வந்து அடைதல்/சென்றடைதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; அவர்கள் மட்டுமே பெறுநர்கள் என்ற கருத்தைக் கேள்விக்குள்ளாக்குகிறது.
theological_decisions:
- issue: ‘கடவுளுடைய வார்த்தை’ என்பதன் குறிப்பு
  choice: குறிப்பிட்ட ஒரே தொழில்நுட்பப் பொருளாகச் சுருக்காமல் ‘கடவுளுடைய வார்த்தை’ என்று பொதுவாகவே வைக்கப்பட்டது.
  alternative: குறிப்பாக நற்செய்தி அல்லது சபைக்கூட்டத்தின் தீர்க்கதரிசன உரை என்று மொழிபெயர்த்தல்.
  rationale: சூழலில் இது நற்செய்தியையும் அப்போஸ்தல அறிவுறுத்தலையும் பரந்த வகையில் உள்ளடக்கக்கூடும். மூலத்தின் தெளிவின்மையையும் இறையியல் இழுவிசையையும் மொழிபெயர்ப்பு தீர்மானித்து விடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இரட்டை வினாவிலும் ‘தான்’ மூலம் மூலமும் ஒரே பெறுநர் என்ற உரிமைகோரலும் வலியுறுத்தப்பட்டுள்ளன; கண்டனத் தொனி மிகைப்படுத்தப்படவில்லை.
