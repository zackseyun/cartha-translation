source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: ta
  text: ஆனால் அவர்கள் எதையாவது கற்றுக்கொள்ள விரும்பினால், வீட்டில் தங்கள் சொந்தக் கணவர்களிடம் கேட்கட்டும்; ஏனெனில் ஒன்றுகூடிய சபையில்[b] ஒரு பெண்[a] பேசுவது வெட்கக்கேடானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மனைவி.” கிரேக்கச் சொல் சூழலின்படி “பெண்” அல்லது “மனைவி” எனப் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சபையில்” அல்லது “சபைக் கூட்டத்தில்.” கிரேக்கச் சொல் இங்கு ஒன்றுகூடிய சபையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: கற்றுக்கொள்ள
  rationale: μανθάνω என்பதன் நேரடியான பொருளான கற்றல் அல்லது அறிந்துகொள்ளுதலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐν οἴκῳ
  choice: வீட்டில்
  rationale: கிரேக்கச் சொற்றொடரின் இல்லச் சூழலையும் சபைக் கூடுகைக்கு எதிரான இட வேறுபாட்டையும் இயல்பாகக் காட்டுகிறது.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: தங்கள் சொந்தக் கணவர்களிடம்
  rationale: ἄνδρας என்பது ஆண்கள் அல்லது கணவர்கள் எனப் பொருள்படலாம்; ἰδίους என்ற உடைமை வலியுறுத்தலும் இல்லச் சூழலும் இங்கு ‘கணவர்கள்’ என்ற பொருளை உறுதிப்படுத்துகின்றன. ‘சொந்த’ என்பது ἰδίους என்பதன் வலியுறுத்தலைக் காக்கிறது.
- source_word: ἐπερωτάτωσαν
  choice: கேட்கட்டும்
  rationale: கேட்பது அல்லது விசாரிப்பது என்ற பொருளையும் கிரேக்கக் கட்டளை வினையின் வலிமையையும் தெளிவாகக் காக்கிறது.
- source_word: αἰσχρὸν
  choice: வெட்கக்கேடானது
  rationale: சமூகத்திலும் ஒழுக்கத்திலும் அவமானகரமாகக் கருதப்படுவதைக் குறிக்கும் αἰσχρός என்பதன் வலிமையைத் தக்கவைக்கிறது.
- source_word: γυναικὶ
  choice: ஒரு பெண்
  rationale: γυνή என்பது சூழலின்படி ‘பெண்’ அல்லது ‘மனைவி’ எனப் பொருள்படும். இங்கு உடைமைச் சுட்டு இல்லாத பொதுமை ஒருமை வடிவை ‘ஒரு பெண்’ என்று வழங்கி, ‘மனைவி’ என்ற சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: λαλεῖν
  choice: பேசுவது
  rationale: λαλέω என்பதன் பரந்த ‘பேசுதல்’ என்ற பொருளை எந்தக் குறிப்பிட்ட வகைப் பேச்சாகவும் சுருக்காமல் காக்கிறது.
- source_word: ἐν ἐκκλησίᾳ
  choice: கூடிய சபையில்
  rationale: ἐκκλησία இங்கு கூடிவந்த மக்களின் சபையைக் குறிக்கிறது. ‘கூடிய சபை’ என்பது வெறும் நிறுவனம் அல்லது கட்டடம் என்ற தவறான எண்ணத்தைத் தவிர்த்து, ஒன்றுகூடிய சமுதாயத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பெண்கள் பேசுவது குறித்த தடையின் வரம்பு
  choice: மூலவாக்கியம் குறிப்பிடும் ‘பேசுவது’ என்பதை எந்தக் குறிப்பிட்ட வகைப் பேச்சாகவும் சுருக்காமல் மொழிபெயர்த்தல்
  alternative: ஒழுங்கைக் குலைக்கும் கேள்விகள், தீர்க்கதரிசனங்களை மதிப்பிடுதல், அல்லது கொரிந்தியர்களின் மேற்கோள் ஆகியவற்றில் ஒன்றாக விளக்கி மொழிபெயர்த்தல்
  rationale: கிரேக்க வாக்கியம் பேச்சின் வகையையோ தடையின் துல்லியமான வரம்பையோ இங்கே குறிப்பிடவில்லை. ஆகவே விளக்கவுரைக்குரிய தீர்மானத்தை மொழிபெயர்ப்புக்குள் புகுத்தாமல் மூலத்தின் இறையியல் பதற்றம் காக்கப்படுகிறது.
- issue: γυνή/ἀνήρ என்பவை பெண்/ஆண் அல்லது மனைவி/கணவர் என்பதா
  choice: ἄνδρας என்பதை ‘கணவர்கள்’ என்றும் γυναικὶ என்பதை முதன்மை உரையில் ‘ஒரு பெண்’ என்றும் வழங்கி, ‘மனைவி’ என்ற மாற்றை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: இரண்டையும் முழுவதும் மனைவி/கணவர் என்றோ பெண்/ஆண்கள் என்றோ ஒரே விதமாக வழங்குதல்
  rationale: ‘தங்கள் சொந்தக் கணவர்கள்’ என்ற சொற்றொடரும் இல்லச் சூழலும் ἄνδρας என்பதற்கு மணவுறவுப் பொருளை வலுப்படுத்துகின்றன. ஆனால் γυναικὶ என்ற ஒருமை வடிவம் பொதுவாக ‘பெண்’ என்றும் சூழலின்படி ‘மனைவி’ என்றும் அமையலாம்; இந்த இருபொருள் வாய்ப்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் மரியாதைமிக்கதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கேட்கட்டும்’ கட்டளை வலிமையைத் தக்கவைக்கிறது; ‘கூடிய சபை’ என்பது கட்டடம் அல்லது நிறுவனம் என்பதைக் காட்டிலும் ஒன்றுகூடிய மக்களை முன்னிறுத்துகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
