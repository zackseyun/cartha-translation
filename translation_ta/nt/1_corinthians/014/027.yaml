base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: ta
  text: யாராவது நாவில் பேசினால், இருவர் அல்லது அதிகபட்சம் மூவர் பேசட்டும்; ஒவ்வொருவராகப் பேசட்டும்; ஒருவர் விளக்கமளிக்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γλώσσῃ
  choice: வேறொரு நாவில்
  rationale: γλῶσσα என்பதற்கு ‘நா’ அல்லது ‘மொழி’ என்று பொருள் வரலாம். 1 கொரிந்தியர் 12–14 அதிகாரங்களில் விவாதிக்கப்படும் ஆவிக்குரிய நிகழ்வைக் குறிக்கும் மரபான சொல்லாட்சியை ‘வேறொரு நாவில்’ தக்கவைக்கிறது; அது மனித மொழியா அல்லது வேறுவகைப் பேச்சா என்பதைத் தீர்மானிக்கவில்லை.
- source_word: τις
  choice: யாராவது
  rationale: குறிப்பிடப்படாத எந்த நபரையும் குறிக்கும் நிபந்தனைத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: λαλεῖ
  choice: பேசினால்
  rationale: εἴτε உடன் வரும் பொதுவான நிபந்தனை அமைப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: இருவர் அல்லது அதிகபட்சம் மூவர் மட்டும் பேசட்டும்
  rationale: பேசுவோரின் எண்ணிக்கையை இரண்டு அல்லது மிக அதிகமாக மூன்று என வரையறுக்கும் ஒழுங்குமுறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀνὰ μέρος
  choice: ஒவ்வொருவராகப் பேசட்டும்
  rationale: ஒரே நேரத்தில் அல்லாமல் தனித்தனியாக, முறைப்படி பேச வேண்டும் என்ற பகிர்ந்தளிக்கும் பொருளை வெளிப்படுத்துகிறது.
- source_word: εἷς
  choice: ஒருவர்
  rationale: எண்ணுப்பெயர் இங்கு பெயர்ச்சொல்லாகப் பயன்பட்டு, பொருள் விளக்கும் ஒரு நபரைக் குறிக்கிறது.
- source_word: διερμηνευέτω
  choice: பொருள் விளக்கட்டும்
  rationale: சபையார் புரிந்துகொள்ளும்படி அந்தப் பேச்சின் பொருளை எடுத்துரைக்க வேண்டும் என்பதைக் காட்டுகிறது; ‘மொழிபெயர்க்கட்டும்’ என்பது வெளிநாட்டு மனித மொழி என்ற முடிவைத் தேவையின்றி முன்வைக்கக்கூடும்.
theological_decisions:
- issue: ஆவிக்குரிய வரங்களின் சூழலில் γλώσσῃ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘வேறொரு நாவில்’ என்று வழங்கி, 1 கொரிந்தியர் 12–14 அதிகாரங்களில் பேசப்படும் நிகழ்வைக் குறிக்கச் செய்தல்; அந்தப் பேச்சு மனித மொழியா அல்லது பரவசப் பேச்சா என்பதைத் தீர்மானிக்காமல் விடுதல்.
  alternative: ‘வேறொரு மொழியில்’ என்று மொழிபெயர்த்தல்; அல்லது இதைத் திட்டவட்டமாக வெளிநாட்டு மனித மொழி என்றோ பரவசப் பேச்சு என்றோ விளக்குதல்.
  rationale: இவ்வசனம் அந்த நிகழ்வின் இயல்பைப் பற்றிய விரிவான இறையியல் விவாதத்தைத் தீர்ப்பதில்லை. ‘வேறொரு நாவில்’ என்பது பவுலின் சொல்லாட்சியோடு தொடர்பைத் தக்கவைத்து, உண்மையான பொருள் திறப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கட்டளையின் ஒழுங்குமுறைத் தன்மை ‘மட்டும்’ மற்றும் ‘ஒவ்வொருவராக’ என்பவற்றால் தெளிவாக்கப்பட்டுள்ளது; மூலத்தின் இறையியல் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
