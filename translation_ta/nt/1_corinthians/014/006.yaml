source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: ta
  text: இப்போது, சகோதரர்களே[a], நான் உங்களிடம் நாவுகளில்[b] பேசிக்கொண்டு வந்தால், வெளிப்படுத்துதலினாலோ, அறிவினாலோ, இறைவாக்கினாலோ, போதனையினாலோ உங்களிடம் பேசாவிட்டால், உங்களுக்கு என்ன பயன் அளிப்பேன்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; ‘சகோதரர்கள்’ என்பதற்கான கிரேக்கச் சொல் ஆண்களும் பெண்களும் அடங்கிய சபையைக் குறிக்கவும் பயன்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மொழிகளில் பேசிக்கொண்டு’; கிரேக்கச் சொல் ‘மொழிகள்’ என்றும் பொருள்படும். ஆனால் இச்சூழலில் அது 1 கொரிந்தியர் 12–14 முழுவதும் விவாதிக்கப்படும் ஆவிக்குரிய பேச்சு நிகழ்வைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: இப்போது
  rationale: பவுலின் வாதத்தில் அடுத்த கருத்துக்கு மாறுவதைக் குறிக்கிறது; δέ-யின் மென்மையான இணைப்பு/மாறுபாட்டைத் தமிழில் கட்டாயமாகத் தனியே சொல்லாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க ஆண்பால் பன்மை அழைப்பை வடிவரீதியாகப் பேணுகிறது; முழுச் சபையையும் உள்ளடக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: γλώσσαις λαλῶν
  choice: பல்வேறு நாவுகளில் பேசினாலும்
  rationale: 1 கொரிந்தியர் 12–14 இல் விவாதிக்கப்படும் ஆவிக்குரிய பேச்சு நிகழ்வைக் குறிக்கும் வழக்கமான வேதாகமச் சொல்லைத் தக்கவைக்கிறது; γλώσσαις என்பது பன்மை என்பதையும் ‘பல்வேறு’ தெளிவாக்குகிறது.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: உங்களுக்கு என்ன பயன் அளிப்பேன்?
  rationale: ὠφελέω என்பதன் உதவுதல்/பயனளித்தல் என்ற நடைமுறைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐὰν μὴ
  choice: பேசாவிட்டால்
  rationale: எதிர்மறை நிபந்தனையை இயல்பான தமிழ் வினைமுற்றாக அளிக்கிறது.
- source_word: λαλήσω
  choice: பேசாவிட்டால்
  rationale: முந்தைய λαλῶν உடனான சொற்பொருள் தொடர்ச்சியைப் பேணுகிறது.
- source_word: ἐν ἀποκαλύψει
  choice: வெளிப்படுத்துதல் மூலமாக
  rationale: ἐν என்பதன் கருவி அல்லது முறையைக் குறிக்கும் சாத்தியமான பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν γνώσει
  choice: அறிவு மூலமாக
  rationale: இணையான ἐν-தொடர்களின் அமைப்பையும் அறிவு என்ற பொருளையும் பேணுகிறது.
- source_word: ἐν προφητείᾳ
  choice: இறைவாக்கு உரைத்தல் மூலமாக
  rationale: προφητεία என்பதை வெறும் எதிர்காலக் கணிப்பாகச் சுருக்காமல், கடவுளிடமிருந்து வந்த செய்தியை உரைக்கும் செயலாக இயல்பாகக் காட்டுகிறது.
- source_word: ἐν διδαχῇ
  choice: போதனை மூலமாக
  rationale: διδαχή என்பதன் போதித்தல்/அறிவுறுத்தல் பொருளையும் பட்டியலின் இணை அமைப்பையும் பேணுகிறது.
theological_decisions:
- issue: சபையை நோக்கிய ἀδελφοί என்ற அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: முதன்மை உரை கிரேக்கத்தின் இலக்கண ஆண்பால் வடிவைத் தக்கவைக்கிறது; கலப்புப் பாலினச் சபையையும் இது குறிக்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: இவ்வதிகாரத்தில் γλώσσαις என்பதன் பொருள்
  choice: பல்வேறு நாவுகளில்
  alternative: பல்வேறு மொழிகளில்
  rationale: 1 கொரிந்தியர் 12–14 இல் விவாதிக்கப்படும் ஆவிக்குரிய பேச்சு நிகழ்வை மரபாகவும் சூழலுக்கேற்றவாறும் குறிக்கிறது; அந்த நிகழ்வின் இயல்பைப் பற்றிய இறையியல் விவாதத்தை மொழிபெயர்ப்பு தீர்மானித்துவிடவில்லை.
- issue: நான்கு ἐν-தொடர்களின் உறவு
  choice: … மூலமாகவோ
  alternative: … இல் / … உடன்
  rationale: இங்கே ἐν கருவி அல்லது முறையைக் குறிக்கலாம்; ‘மூலமாக’ என்பது பயனளிக்கும் பேச்சின் வழிகளைத் தெளிவாக்குகிறது, அதேவேளை மூலத்தின் சிறிய இலக்கணத் தெளிவின்மையை இறையியல் வகையில் மிகைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் நடையும் பேணப்பட்டுள்ளன. கிரேக்கத்தின் நீண்ட நிபந்தனை வாக்கிய அமைப்பு தமிழில் இயல்பாக மறுவரிசைப்படுத்தப்பட்டாலும், நான்கு இணை வழிகளும் கேள்வியின் வலியுறுத்தலும் தக்கவைக்கப்பட்டுள்ளன.
