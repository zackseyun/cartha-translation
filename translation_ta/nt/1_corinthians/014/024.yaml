id: 1CO.14.24
reference: 1 Corinthians 14:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: ta
  text: ஆனால், எல்லாரும் தீர்க்கதரிசனமாகப் பேசும்போது, நம்பாத ஒருவரோ அறிமுகமில்லாத ஒருவரோ[a] உள்ளே வந்தால், அவர் எல்லாராலும் குற்றம் உணர்த்தப்படுகிறார்; எல்லாராலும் ஆராயப்படுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெளியாளர்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அந்தக் கூடுகையின் நடைமுறைகளை அறியாத, அவற்றில் அறிமுகமில்லாத, அல்லது பேசும் குழுவைச் சாராத ஒருவரைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: எல்லாரும் / எல்லாராலும்
  rationale: கூடியிருப்பவர்களைக் குறிக்கும் உள்ளடக்கமான பொதுமையைத் தக்கவைத்து, கிரேக்கத்தில் வரும் மறுபடியும் கூறுதலையும் பாதுகாக்கிறது.
- source_word: προφητεύωσιν
  choice: தீர்க்கதரிசனமாகப் பேசும்போது
  rationale: இந்த அதிகாரத்தில் பவுல் பயன்படுத்தும் தீர்க்கதரிசனப் பேச்சு என்ற தனித்த வகையைத் தக்கவைக்கிறது; அதனை வெறும் தூண்டுதல் பெற்ற பேச்சாகக் குறுக்கவில்லை.
- source_word: ἄπιστος
  choice: நம்பாத ஒருவர்
  rationale: இச்சூழலில் விசுவாசிக்காத நபரைக் குறிக்கிறது; 'உண்மையற்றவர்' என்ற வேறு பொருளைத் தவிர்க்கிறது.
- source_word: ἰδιώτης
  choice: விவரம் அறியாத ஒருவர்
  rationale: கூட்டத்தின் பேச்சையும் நடைமுறையையும் பற்றிய உரிய புரிதலோ பங்கேற்போ இல்லாத நபர் என்ற பொருளை இயல்பான தமிழில் தருகிறது; அவர் கட்டாயமாக முற்றிலும் வெளியிலிருப்பவர் என்று முடிவுசெய்யவில்லை.
- source_word: ἐλέγχεται
  choice: குற்றம் உணர்த்தப்படுகிறார்
  rationale: கேட்கும் செய்தியால் ஒருவரின் உள்ளார்ந்த நிலை வெளிப்பட்டு, அவர் தமது குற்றத்தை உணரும்படி செய்யப்படுகிறார் என்ற ஒழுக்க மற்றும் நம்பவைக்கும் வலிமையைத் தருகிறது.
- source_word: ἀνακρίνεται
  choice: ஆராயப்படுகிறார்
  rationale: ஆராய்தல் அல்லது கூர்ந்து மதிப்பிடுதல் என்ற பொருளைப் பாதுகாக்கிறது; இறுதித் தண்டனைத் தீர்ப்பு என்ற அளவுக்கு பொருளை மிகைப்படுத்தவில்லை.
- source_word: ὑπὸ πάντων
  choice: எல்லாராலும்
  rationale: கிரேக்க மூலத்தில் இருமுறை வரும் சொற்றொடரை தமிழிலும் இருமுறை தக்கவைத்து அதன் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிலைக்கு மாறான சூழலை அறிமுகப்படுத்தும் எதிர்மறை இணைப்பை வெளிப்படுத்துகிறது.
- source_word: τις
  choice: ஒருவர்
  rationale: குறிப்பிடப்படாத ஏதோ ஒரு நபர் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: சபைக் கூடுகையின் சூழலில் ἰδιώτης என்பதன் பொருள்
  choice: விவரம் அறியாத ஒருவர்
  alternative: வெளியாளர்; கற்றறியாதவர்; சாதாரண உறுப்பினர்
  rationale: உடனடிச் சூழல் புரிந்துகொள்ளக்கூடிய பேச்சையும், அதைப் பற்றிய புரிதல் இல்லாதவர்மீது அது ஏற்படுத்தும் விளைவையும் பற்றியது. இந்தத் தேர்வு அந்தப் பொருளைத் தக்கவைத்து, அந்த நபர் கிறிஸ்தவக் கூடுகைக்கு முற்றிலும் வெளியிலுள்ளவர் என்று தீர்மானிப்பதைத் தவிர்க்கிறது. 'வெளியாளர்' என்பது சாத்தியமான மாற்றுப் பொருள் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு வாசிப்பிற்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் நிபந்தனை அமைப்பும் ‘எல்லாராலும்’ என்ற மறுபடியும் கூறுதலும் தக்கவைக்கப்பட்டுள்ளன.
