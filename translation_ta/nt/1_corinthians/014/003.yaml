  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: ta
  text: ஆனால் தீர்க்கதரிசனம் உரைப்பவர், மக்களிடம் அவர்களைக் கட்டியெழுப்பவும்[a], ஊக்குவிக்கவும்[b], ஆறுதல் அளிக்கவும்[c] பேசுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கட்டியெழுப்பவும்’ என்பதற்குப் பதிலாக, ‘வளர்ச்சியடையச் செய்யவும்’ அல்லது ‘வலுப்படுத்தவும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஊக்குவிக்கவும்’ என்பது παράκλησις என்பதன் மொழிபெயர்ப்பு; இதற்கு ‘அறிவுறுத்தவும்’ அல்லது சில சூழல்களில் ‘தேற்றவும்’ என்றும் பொருள் இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘ஆறுதல் அளிக்கவும்’ என்பது παραμυθία என்பதன் மொழிபெயர்ப்பு; இதற்கு ‘தேற்றவும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: ஆனால் தீர்க்கதரிசனம் உரைக்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல்லை இயல்பான தமிழில் நபரைக் குறிக்கும் தொடராக மொழிபெயர்க்கிறது. δέ முந்தைய வசனத்துடன் காட்டும் மென்மையான வேறுபாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: ἀνθρώποις
  choice: மக்களை
  rationale: இது ஆண்களை மட்டும் குறிக்காமல் பொதுவாக மனிதர்களை, அதாவது பேச்சைப் பெறுகிறவர்களை, குறிக்கிறது. தமிழில் நோக்கச் செயலமைப்புடன் ‘மக்களைக்’ என்பது இயல்பாக அமைகிறது.
- source_word: λαλεῖ
  choice: பேசுகிறார்
  rationale: λαλέω என்பதன் நிகழ்காலப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: οἰκοδομὴν
  choice: கட்டியெழுப்பவும்
  rationale: கட்டிடம் கட்டுதல் என்ற உருவகத்தின் வழியாக மக்களை ஆன்மீகமாக வளர்த்து வலுப்படுத்துதல் என்னும் பவுலின் பயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: παράκλησιν
  choice: ஊக்குவிக்கவும்
  rationale: இச்சொல்லுக்கு ஊக்குவித்தல், அறிவுறுத்துதல், தேற்றுதல் ஆகிய பொருள்கள் இருக்கலாம். அடுத்துள்ள παραμυθίαν என்பதிலிருந்து வேறுபாட்டைக் காக்க இங்கு ‘ஊக்குவிக்கவும்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: παραμυθίαν
  choice: ஆறுதலளிக்கவும்
  rationale: தேற்றும் அல்லது ஆறுதலளிக்கும் பேச்சைக் குறிக்கிறது; παράκλησιν என்பதுடன் ஒன்றாக்காமல் மூன்று விளைவுகளின் வரிசையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சபைக் கூடுகையில் ‘தீர்க்கதரிசனம் உரைத்தல்’ என்பதன் பொருள்
  choice: ‘தீர்க்கதரிசனம் உரைக்கிறவர்’ என்று அதன் பரந்த பொருளைத் தக்கவைத்தல்
  alternative: ‘பிரசங்கிக்கிறவர்’ அல்லது ‘எதிர்காலத்தை முன்னறிவிக்கிறவர்’ என்று குறுக்குதல்
  rationale: προφητεύων என்பதை ஒரு குறிப்பிட்ட பிரிவின் விளக்கத்திற்கேற்ப பிரசங்கமாகவோ எதிர்காலக் கணிப்பாகவோ வரையறுக்காமல், மூலத்தின் இறையியல் பரப்பையும் தெளிவுபடுத்தப்படாத தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், அதே நேரத்தில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள மூன்று பெயர்ச்சொற்கள், தமிழின் இயல்பான நோக்கவினை அமைப்பில் மூன்று இணையான வினையெச்சங்களாக வழங்கப்பட்டுள்ளன.
