  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: ta
  text: சகோதரர்களே[a], உங்கள் சிந்தனையில் குழந்தைகளாக ஆகாதீர்கள். மாறாக, தீமையில்[b] பச்சிளம் குழந்தைகளாக இருங்கள்; ஆனால் சிந்தனையில் முதிர்ச்சியடையுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; கிரேக்க மொழியில் ஆண்பால் பன்மையான ‘சகோதரர்களே’ என்பது முழுச் சபையாரையும் அழைக்கப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கயமையில்’; κακία என்ற கிரேக்கச் சொல் தீமை, கெட்ட தன்மை, அல்லது கயமை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: சகோதரர்களே
  rationale: சபையாரை நேரடியாக அழைக்கும் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் வெளிப்படையாக வைத்திருக்கிறது; சூழலில் இது சகோதரிகளையும் உள்ளடக்கலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: παιδία
  choice: குழந்தைகளாக
  rationale: பொதுவாகக் குழந்தைகளைக் குறிக்கும் சொல்லாக இருப்பதால் வயதை அளவுக்கு மீறிக் குறிப்பாக்காமல், பின்னர் வரும் ‘பச்சிளம் குழந்தைகள்’ மற்றும் ‘முதிர்ச்சியடைந்தவர்கள்’ என்ற முரணைத் தக்கவைக்கிறது.
- source_word: γίνεσθε
  choice: ஆகாதீர்கள் / ஆகுங்கள்
  rationale: γίνομαι என்பதன் ‘ஆகுதல்’ என்ற இயக்கப் பொருளையும் இரு கட்டளைகளின் சொல்லமைப்பு ஒற்றுமையையும் காக்கிறது.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: சிந்திப்பதில் / சிந்திப்பதிலோ
  rationale: φρήν இங்கு மனத்தின் சிந்திக்கும் அல்லது புரிந்துகொள்ளும் திறனைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பான வகையில் அந்தக் கருத்தைத் தெரிவிக்கிறது.
- source_word: τῇ κακίᾳ
  choice: தீமையில்
  rationale: κακία என்பதன் பரந்த அறநெறிப் பொருளான தீமை அல்லது கெட்ட தன்மையைத் தக்கவைக்கிறது; ‘கயமை’ என்ற குறுகிய மாற்றுப் பொருள் குறிப்பில் தரப்படுகிறது.
- source_word: νηπιάζετε
  choice: பச்சிளம் குழந்தைகளாக இருங்கள்
  rationale: குழந்தைப் பருவத்தின் மிக ஆரம்ப நிலையில் இருப்பதைப் போன்றிருங்கள் என்ற கட்டளையை வெளிப்படுத்தி, முதல் உட்பிரிவின் ‘குழந்தைகள்’ என்பதிலிருந்து நோக்கமுள்ள வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: τέλειοι
  choice: முதிர்ச்சியடைந்தவர்களாக
  rationale: இச்சூழலில் பாவமற்ற பரிபூரணத்தை அல்ல, சிந்தனையின் முழு வளர்ச்சியையும் முதிர்ச்சியையும் குறிக்கிறது.
- source_word: ἀλλὰ ... δὲ
  choice: மாறாக ... -லோ
  rationale: 'இரண்டு தொடர் முரண்களையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது: சிந்தனையில் குழந்தைத்தனம் வேண்டாம்; தீமையில் பச்சிளத்தனம் வேண்டும்; சிந்தனையில் முதிர்ச்சி வேண்டும்.'
theological_decisions:
- issue: பாலினம் குறிக்கப்பட்ட சபை அழைப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று வைத்து, அதன் உள்ளடக்கும் பயன்பாட்டைக் குறிப்பில் விளக்குதல்
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: Ἀδελφοί என்பது இலக்கணப்படி ஆண்பால் பன்மை என்றாலும், கலப்புப் பாலின சபையார் அனைவரையும் சூழலில் அழைக்கக்கூடும். முதன்மை உரை மூல வடிவத்தை மறைக்காமல், அதன் சூழல்சார் உள்ளடக்கத்தை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, ஆனால் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. ‘குழந்தைகள்—பச்சிளம் குழந்தைகள்—முதிர்ச்சியடைந்தவர்கள்’ என்ற மூலத்தின் வளர்ச்சிநிலை முரண் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
