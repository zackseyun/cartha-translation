  terminology: சபை அல்லது வழிபாட்டு அமைப்பைப் பற்றிய கூடுதல் விளக்கத்தை உரையில் சேர்க்காமல், மூலத்தின் பொதுவான கட்டளையை மொழிபெயர்ப்பு காக்கிறது. அடிக்குறிப்பு “தகுந்த முறையில்” என்பதற்கான செல்லத்தக்க சொல்லியல் மாற்றைத் தருகிறது; குறியீட்டு இணைப்பு சரியாக உள்ளது.
