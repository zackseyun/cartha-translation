  source_fidelity: “எல்லாம்” πάντα-வின் விரிவான பரப்பைத் தக்கவைக்கிறது. “ஆனால்” δέ-வின் மென்மையான மாறுபாடு/தொடர்ச்சி உணர்வை இயல்பாக வெளிப்படுத்துகிறது. “தகுந்த முறையில்” εὐσχημόνως என்பதிலுள்ள பொருத்தம், மரியாதைத்தன்மை ஆகிய நுணுக்கங்களைத் தருகிறது; “ஒழுங்கின்படி” κατὰ τάξιν என்பதிலுள்ள ஒழுங்கான ஏற்பாடு அல்லது வரிசை உணர்வைத் தனியாகப் பாதுகாக்கிறது. “நடைபெறட்டும்” γινέσθω-வின் மூன்றாம் நபர் கட்டளைத் தொனிக்கு ஏற்றது.
