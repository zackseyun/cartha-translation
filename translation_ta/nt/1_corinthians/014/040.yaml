  text: But let everything be done decently and in order[a].
translation:
  language: ta
  text: ஆனால், எல்லாம் தகுந்த முறையிலும் ஒழுங்கின்படியும் நடைபெறட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தகுந்த முறையில்” என்பதற்கு “முறையாக” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் பொருத்தமான அல்லது ஏற்ற விதத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: எல்லாம்
  rationale: நடுநிலைப் பன்மை வடிவத்தின் விரிவான பொருளை இயல்பான தமிழில் முழுமையாகக் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய விவாதத்திலிருந்து அதன் சுருக்கமான வழிகாட்டுதலுக்கு வரும் மென்மையான மாறுபாட்டை அல்லது திருப்பத்தை வெளிப்படுத்துகிறது.
- source_word: εὐσχημόνως
  choice: தகுந்த முறையில்
  rationale: சூழலுக்கு ஏற்ற, முறையான, மதிப்புக்குரிய விதத்தை இயல்பான நவீன தமிழில் குறிக்கிறது; வெறும் ஒழுங்கை மட்டும் குறிக்காமல், பொருத்தமான நடத்தையையும் தெரிவிக்கிறது.
- source_word: κατὰ τάξιν
  choice: ஒழுங்கின்படி
  rationale: சரியான ஏற்பாடு அல்லது வரிசைக்கு இணங்க நடைபெறுதல் என்ற பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: γινέσθω
  choice: நடைபெறட்டும்
  rationale: மூன்றாம் நபர் கட்டளை வினையின் பொதுவான வழிகாட்டும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சபைக் கூடுகையில் நிகழும் அனைத்தையும் உள்ளடக்குகிறது.
theological_decisions:
- issue: வழிபாட்டுச் சூழலில் பவுலின் கட்டளையின் பரப்பு
  choice: சபைக் கூடுகையில் அனைத்தும் தகுந்த விதத்திலும் ஒழுங்குடனும் நடைபெற வேண்டும் என்ற பொதுவான வழிகாட்டுதலாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஒரு நிலையான, குறிப்பிட்ட வழிபாட்டு முறையை விதிக்கும் குறுகிய சடங்கியல் கட்டளையாகவோ, உடனடிச் சூழலைத் தாண்டி எல்லா சபை நடைமுறைகளுக்கும் நேரடியாகப் பொருந்தும் முழுமையான விதியாகவோ வாசித்தல்.
  rationale: இவ்வசனம் சபைக் கூடுகையில் பேசுதல் மற்றும் ஒழுங்கு குறித்த உடனடி விவாதத்தைச் சுருக்குகிறது. கிரேக்கத்தின் பொதுத்தன்மை பாதுகாக்கப்பட்டு, எந்தச் சபைப் பிரிவுக்குரிய வழிபாட்டு அமைப்பும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. “தகுந்த முறையில்” மற்றும் “ஒழுங்கின்படி” என்பவை εὐσχημόνως, κατὰ τάξιν ஆகியவற்றின் வேறுபட்ட நுணுக்கங்களைப் பாதுகாக்கின்றன.
