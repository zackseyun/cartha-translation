lexical_decisions:
- source_word: σὺ
  choice: நீ
  rationale: இரண்டாம் நபர் ஒருமையைத் தெளிவாகவும் நேரடியாகவும் தக்கவைக்கிறது.
- source_word: μὲν γὰρ
  choice: என்பது உண்மைதான்
  rationale: γάρ தரும் விளக்கத் தொடர்பையும், μέν...ἀλλά அமைப்பிலுள்ள ஒப்புக்கொள்ளல்-முரண்பாட்டு நகர்வையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καλῶς
  choice: நன்றாகவே
  rationale: ‘நன்றாக’ அல்லது ‘முறையாக’ என்ற மதிப்பீட்டுப் பொருளைத் தருகிறது; ‘வே’ மூலத்தின் வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
- source_word: εὐχαριστεῖς
  choice: நன்றி செலுத்துகிறாய்
  rationale: சபைக் கூடுகையில் தேவனுக்கு நன்றி கூறுவதைச் சுட்டும் நிகழ்கால வினையாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முதற்கூற்றுக்கு மாறான முக்கியக் கருத்தை அறிமுகப்படுத்தும் எதிர்மறை இணைப்பை நேரடியாகத் தருகிறது.
- source_word: ὁ ἕτερος
  choice: மற்றவர்
  rationale: கூட்டத்தில் உள்ள இன்னொரு நபரை மிகையாக விளக்காமல் இயல்பாகக் குறிக்கிறது.
- source_word: οὐκ οἰκοδομεῖται
  choice: கட்டியெழுப்பப்படுவதில்லை
  rationale: οἰκοδομέω என்பதன் கட்டட உருவகத்தையும், ஒருவர் ஆன்மீகமாகப் பயனடைந்து வலுப்படுத்தப்படுதல் என்ற சூழற்பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: சபைச் சூழலில் οἰκοδομέω என்ற பவுலின் உருவகம்
  choice: கட்டியெழுப்பப்படுவதில்லை
  alternative: ஆன்மீக வளர்ச்சி அடைவதில்லை
  rationale: மூலத்தின் கட்டட உருவகத்தையும் ஆன்மீக வலுப்படுத்தல் என்ற விரிந்த பொருளையும் பாதுகாக்கிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான ஒருமை அழைப்பையும் பவுலின் உருவகத்தையும் காக்கும் கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் நடை. ‘என்பது உண்மைதான்; ஆனால்’ என்பது μέν...ἀλλά தரும் ஒப்புக்கொள்ளல்-முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
