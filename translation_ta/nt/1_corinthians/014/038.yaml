  text: But if anyone does not recognize this[b][a], he is not recognized.
translation:
  language: ta
  text: ஆனால், யாராவது இதை அங்கீகரிக்கவில்லை என்றால்[b], அவரும் அங்கீகரிக்கப்படுவதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “யாராவது அறியாதவராயிருந்தால், அவர் அறியாதவராகவே இருக்கட்டும்” என்று உள்ளது. இங்கே ஏற்றுக்கொள்ளப்பட்டுள்ள மூலபாடம், “யாராவது அங்கீகரிக்கவில்லை என்றால், அவர் அங்கீகரிக்கப்படுவதில்லை” என்று கூறுகிறது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “ஒப்புக்கொள்ளவில்லை ... ஒப்புக்கொள்ளப்படுவதில்லை.” சொல்லணி விளைவை உருவாக்க, கிரேக்கத்தில் ஒரே வினை செய்பாட்டு வடிவிலும் செயப்பாட்டு வடிவிலும் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: என்றால்
  rationale: நிபந்தனையை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அங்கீகாரத்துக்கு மாறான நிலையை அறிமுகப்படுத்தும் எதிர்மறைத் தொடர்பைப் பேணுகிறது.
- source_word: τις
  choice: யாராவது
  rationale: குறிப்பிடப்படாத எந்தவொரு நபரையும் பொதுவாகச் சுட்டும் ஒருமை வடிவம்.
- source_word: ἀγνοεῖ
  choice: அங்கீகரிக்கவில்லை
  rationale: முந்தைய வசனத்தின் கருத்தோடு தொடர்புடைய, வெறும் அறியாமையைவிட ஏற்றுக்கொள்ள அல்லது ஒப்புக்கொள்ள மறுக்கும் பொருளை வெளிப்படுத்துகிறது.
- source_word: ἀγνοεῖται
  choice: அங்கீகரிக்கப்படுவதில்லை
  rationale: அதே வினையின் செயப்பாட்டு வடிவத்தைப் பயன்படுத்தி, கிரேக்கத்தில் உள்ள செய்பாட்டு–செயப்பாட்டு சொல்லணி ஒற்றுமையையும் நிகழ்காலக் கூற்றையும் பேணுகிறது.
theological_decisions:
- issue: ἀγνοεῖται என்ற செயப்பாட்டு வினையின் பொருள்
  choice: அப்போஸ்தல அறிவுறுத்தலை அங்கீகரிக்காதவர் தாமும் அங்கீகரிக்கப்படுவதில்லை
  alternative: அவர் அறியப்படாதவர்; அல்லது, சில கையெழுத்துப் பிரதிகளின்படி, ‘அறியாதவனாகவே இருக்கட்டும்’
  rationale: SBLGNT உரையில் கட்டளை வடிவமல்ல, நிகழ்காலச் செயப்பாட்டு சுட்டுவினையே உள்ளது. செயலைச் செய்பவர் யார் என்பதைச் சேர்க்காமல், பரஸ்பர அல்லது நியாயத்தீர்ப்புக்குரிய விளைவைக் கொண்ட சொல்லணியை மொழிபெயர்ப்பு திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘அங்கீகரி’ என்பது இச்சூழலில் ஒப்புக்கொள்ளுதல்/ஏற்றுக்கொள்ளுதல் என்ற பொருளையும் கிரேக்க வினையின் இரு வடிவங்களுக்கிடையேயான ஒற்றுமையையும் காக்கிறது. ‘அவரும்’ என்பது எதிர்வினைத் தொடர்பை இயல்பாக உணர்த்துகிறது; செயப்பாட்டு வினையின் செய்பவர் யார் என்பது திட்டமிட்டு குறிப்பிடப்படவில்லை.
