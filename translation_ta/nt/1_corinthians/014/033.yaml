    rationale: Tamil “இருப்பதுபோலவே” requires a recoverable subject or referent, but the immediately preceding construction identifies God as a God of peace and does not supply a natural grammatical antecedent for “being.” An explicit “இந்த உண்மை” preserves the Greek’s elliptical comparative force and makes the connection intelligible.
