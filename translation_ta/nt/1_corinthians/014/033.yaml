source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: ta
  text: ஏனெனில், கடவுள் ஒழுங்கின்மையின் கடவுள் அல்ல; அமைதியின் கடவுள். இறைமக்களின் எல்லாத் திருச்சபைகளிலும் இந்த உண்மை காணப்படுவதுபோலவே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் குழப்பத்தின் கடவுள் அல்ல; அமைதியின் கடவுள்.” அல்லது, “இறைமக்களின் எல்லாத் திருச்சபைகளிலும் இந்த உண்மை காணப்படுவதுபோலவே.” சிலர் இத்தொடரை இந்த வசனத்துடன் அல்லாமல் அடுத்த வசனத்துடன் இணைக்கின்றனர். “இறைமக்கள்” என்பதைச் சொற்சார்ந்து “பரிசுத்தமானவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: ஒழுங்கின்மை
  rationale: சபை கூடுகையில் பேசுவதற்கான ஒழுங்கை வலியுறுத்தும் உடனடிச் சூழலில், குழப்பம் அல்லது நிலையின்மை என்பதைக் காட்டிலும் ‘ஒழுங்கின்மை’ பொருளைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἰρήνης
  choice: அமைதி
  rationale: ἀκαταστασία என்பதற்கு எதிராக, சபையில் நிலவும் ஒழுங்கான சமாதான நிலையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: கிரேக்கத்தில் குறிக்கப்படுவது திட்டவட்டமான ஒரே கடவுள்; தமிழில் ‘கடவுள்’ இயல்பான, தனிப்பட்ட பெயர்ச் சொல்லாக அமைகிறது.
- source_word: ὡς
  choice: இருப்பதுபோலவே
  rationale: எல்லாத் திருச்சபைகளிலும் காணப்படும் நிலையை ஒப்பீடாக அல்லது பொதுவழக்கிற்கான சுட்டாக அறிமுகப்படுத்தும் கிரேக்கச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἐκκλησίαις
  choice: திருச்சபைகள்
  rationale: உள்ளூர் கிறிஸ்தவ விசுவாசக் கூட்டங்களைக் குறிக்கும் நிறுவப்பட்ட, கண்ணியமான தமிழ் வழக்கு.
- source_word: τῶν ἁγίων
  choice: இறைமக்கள்
  rationale: பவுல் விசுவாசிகளை அழைக்கும் ‘பரிசுத்தமானவர்கள்’ என்ற கருத்தை, அவர்கள் இயல்பிலேயே புனிதர்கள் என்ற தவறான எண்ணத்தைத் தவிர்த்து, சாதாரண வாசகர்களுக்குத் தெளிவாகத் தெரிவிக்கிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய ஒழுங்கு சார்ந்த அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων என்ற தொடரின் இலக்கண இணைப்பு
  choice: 33ஆம் வசனத்தின் முடிவுடன் இணைக்கப்பட்டது
  alternative: 34ஆம் வசனத்தின் தொடக்கமாக இணைத்தல்
  rationale: வழங்கப்பட்ட SBLGNT உரையின் நிறுத்தக்குறியீடும் வாசிப்பும் இதை 33ஆம் வசனத்துடன் இணைக்கின்றன. எனினும் கிரேக்கச் சொற்றொடரின் இணைப்பு விவாதத்திற்குரியது என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான திருச்சபை நடையைப் பயன்படுத்துகிறது. ‘ஒழுங்கின்மை—அமைதி’ என்ற சூழல்சார் எதிர்மறை இணை பாதுகாக்கப்பட்டுள்ளது; விவாதத்திற்குரிய சொற்றொடர் இணைப்பு முதன்மை உரையில் தீர்மானிக்கப்பட்டாலும் அடிக்குறிப்பில் மாற்றாகத் தெளிவாக வைக்கப்பட்டுள்ளது.
