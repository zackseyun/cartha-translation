base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: ta
  text: ஆனால், மொழிபெயர்ப்பவர் இல்லாவிட்டால், அவர் சபையில்[a] மௌனமாக இருக்கட்டும்; தனக்குத்தானும் கடவுளிடமும் பேசட்டும்.
  philosophy: optimal-equivalence
