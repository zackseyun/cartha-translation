    text: அல்லது, ‘சபைக் கூட்டத்தில்’ அல்லது ‘கூடியிருக்கும் மக்களிடையே.’
    reason: ἐκκλησίᾳ என்பது இங்கு ஒரு கட்டிடத்தைவிடக் கூடியிருக்கும் விசுவாசிகளின் சபையைக் குறிக்கலாம் என்பதைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: διερμηνευτής
  choice: பொருள் விளக்கிச் சொல்பவர்
  rationale: பிறர் புரிந்துகொள்ளும்படி அந்நிய மொழிப் பேச்சின் பொருளை எடுத்துச் சொல்பவரைக் குறிக்கிறது. தமிழில் ‘மொழிபெயர்ப்பாளர்’ என்பதைவிட இச்சூழலில் இது தெளிவானது.
- source_word: σιγάτω
  choice: மௌனமாக இருக்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தின் வலிமையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: ἐν ἐκκλησίᾳ
  choice: சபையில்
  rationale: கூடியிருக்கும் கிறிஸ்தவச் சமூகத்தை இங்கு குறிக்கிறது. ‘சபையில்’ என்பது நவீன தமிழ் கிறிஸ்தவச் சூழலில் இயல்பாக இருந்தாலும், ‘சபைக் கூட்டத்தில்’ என்பதும் சாத்தியம்.
- source_word: ἑαυτῷ
  choice: தனக்குத்தானும்
  rationale: கூடியிருப்போரிடம் பொதுவாகப் பேசுவதற்கு மாறாக, பேச்சு தன்னிடமே இருப்பதை நேரடியாகக் காட்டுகிறது; ‘தனியாக’ போன்ற விளக்கச் சேர்க்கை தவிர்க்கப்பட்டுள்ளது.
- source_word: λαλείτω
  choice: பேசட்டும்
  rationale: தொடரும் கட்டளையை எளிய, நடுநிலையான தமிழில் வழங்குகிறது.
- source_word: τῷ θεῷ
  choice: கடவுளிடமும்
  rationale: அந்தப் பேச்சு கடவுளை நோக்கியதாக இருக்கலாம் என்பதை இயல்பான தமிழ் வேற்றுமை வடிவில் தெரிவிக்கிறது.
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: ஆனால் ... இல்லாவிட்டால்
  rationale: நிபந்தனையையும் முந்தைய கருத்துடனான எதிர்மறைத் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: சபைக் கூடுகையில் மௌனமாக இருக்க வேண்டும் என்ற கட்டளையின் வரம்பு
  choice: பொருள் விளக்கிச் சொல்பவர் இல்லாதபோது சபையாரை நோக்கிய பொதுப் பேச்சை நிறுத்த வேண்டும்; தனக்குத்தானும் கடவுளிடமும் பேசுவது முற்றிலும் தடைசெய்யப்படவில்லை.
  alternative: எந்த வகையிலும் பேசாமல் முற்றிலும் மௌனமாக இருக்க வேண்டும்; அல்லது சபையார் கேட்கும் வகையில் தொடர்ந்து பேசலாம்.
  rationale: ‘சபையில் மௌனமாக இருக்கட்டும்’ என்பதற்கும் ‘தனக்குத்தானும் கடவுளிடமும் பேசட்டும்’ என்பதற்கும் இடையிலான வேறுபாட்டை மொழிபெயர்ப்பு அப்படியே காக்கிறது; பேச்சின் ஒலியளவு அல்லது ஆவிக்குரிய வரங்களின் தொடர்ச்சி குறித்து உரை கூறாததைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பொருள் விளக்கிச் சொல்பவர்’ என்பது சூழலைத் தெளிவாக்குகிறது; கட்டளைகளுக்கு ‘இருக்கட்டும்/பேசட்டும்’ வடிவங்கள் மூலத்தின் வலிமையைக் காக்கின்றன. வழங்கப்பட்ட ஆங்கிலக் குறிப்பின் பொருள் ἐν ἐκκλησίᾳ என்பதுடன் தொடர்புடையதால் [a] குறி ‘சபையில்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
