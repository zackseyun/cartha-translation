reference: 1 Corinthians 14:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: ta
  text: இல்லையென்றால், நீ ஆவியில்[b] வாழ்த்துரை கூறினால், சிறப்பறிவு இல்லாதவரின் நிலையில் இருப்பவர்[a], உன் நன்றியுரையின்போது[c] எப்படி “ஆமென்” என்பார்? ஏனெனில், நீ சொல்வது அவருக்குப் புரியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிறப்பறிவு இல்லாதவர்” என்பதற்கான கிரேக்கச் சொல் (ἰδιώτης), “வெளியார்,” “சாதாரண நபர்,” அல்லது “கற்றறியாதவர்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஆவியில்” என்பதை “ஆவியால்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கம் இங்கு இன்னும் குறிப்பான ஒரு விளக்கத்தைக் கட்டாயப்படுத்தவில்லை.
    reason: alternative_reading
  - marker: c
    text: இங்கு “நன்றியுரை” என்பது நன்றி செலுத்தும் செயலைக் குறிக்கிறது; பிற்காலத்தில் உருவான “யூகரிஸ்ட்” என்ற தொழில்நுட்பச் சடங்குப் பெயரை அவசியமாகக் குறிக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: இல்லையென்றால், ... கூறும்போது
  rationale: முந்தைய வாதத்திலிருந்து எழும் நடைமுறை விளைவை அறிமுகப்படுத்தும் திருத்தும்/ஊகிக்கும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὐλογῇς
  choice: வாழ்த்துரை கூறு
  rationale: கூட்டு வழிபாட்டில் வாய்மொழியாகக் கடவுளைப் போற்றி வாழ்த்துவதைக் குறிக்கிறது; ஒருவருக்கு ஆசீர்வாதம் வழங்குதல் என்ற தவறான எண்ணத்தைத் தவிர்த்து, சொல்லின் ‘நன்றாகப் பேசுதல்/வாழ்த்துதல்’ என்ற பொருளைப் பேணுகிறது.
- source_word: πνεύματι
  choice: ஆவியில்
  rationale: வேற்றுமை உருபின் கருவிப்பொருள் அல்லது செயல்களப் பொருள் ஆகிய இரண்டையும் முழுமையாகத் தீர்மானிக்காமல், கிரேக்கத்தின் தெளிவின்மையைப் பேணுகிறது.
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: கற்றறியாதவரின் இடத்தில் இருப்பவர்
  rationale: சபையில் ஒரு குறிப்பிட்ட நிலையை அல்லது இடத்தை வகிப்பவர் என்ற உருவகத்தைப் பேணுகிறது; ἰδιώτης என்பதன் சிறப்பு அறிவு இல்லாதவர் என்ற சூழல்சார் பொருளையும் தெரிவிக்கிறது.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: எப்படி “ஆமென்” என்பார்?
  rationale: கூடியிருப்போர் ஒப்புதல் தெரிவிக்கும் வழிபாட்டு மறுமொழியான ‘ஆமென்’ என்பதைத் தக்கவைத்து, இயல்பான தமிழில் கேள்வியாக அமைக்கிறது.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: நீ செலுத்தும் நன்றிக்கு
  rationale: ஒருவர் கூறும் நன்றிக்கு ‘ஆமென்’ என்று ஒப்புதல் அளிப்பதை இயல்பாகத் தெரிவிக்கிறது; பிற்காலத் தொழில்நுட்பச் சடங்குப் பொருளைத் திணிக்கவில்லை.
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: நீ என்ன சொல்கிறாய் என்பது அவருக்குத் தெரியாதே
  rationale: அவர் ‘ஆமென்’ கூற முடியாததற்கான காரணத்தை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; இறுதியிலுள்ள ‘-தே’ காரண விளக்கத்தின் வலிமையைத் தருகிறது.
theological_decisions:
- issue: πνεύματι என்பது மனித ஆவியையா அல்லது பரிசுத்த ஆவியால் ஏவப்பட்ட பேச்சையா குறிக்கிறது
  choice: ஆவியில்
  alternative: தன் ஆவியால்; ஆவியானவரால்
  rationale: இவ்வசனம் குறிப்பிட்ட ஒரே இறையியல் விளக்கத்தை கட்டாயப்படுத்தவில்லை. பொதுவான வடிவம் மூலத்தின் திட்டமிட்ட தெளிவின்மையையும் இறையியல் பதற்றத்தையும் பேணுகிறது.
- issue: εὐχαριστίᾳ என்பதன் பொருள்
  choice: நீ செலுத்தும் நன்றி
  alternative: நற்கருணை / யூகரிஸ்ட்
  rationale: உடனடிச் சூழல், கூட்டு வழிபாட்டில் புரிந்துகொள்ளத்தக்க விதத்தில் நன்றி கூறுவதைப் பற்றியது. பிற்காலத்தில் உருவான சடங்குசார் தொழில்நுட்பப் பொருளை இங்கு சேர்க்கத் தேவையில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆமென்’ என்ற பரவலாக அறியப்பட்ட வழிபாட்டுச் சொல் அப்படியே வைக்கப்பட்டுள்ளது; கிரேக்கத்தில் உள்ள இறையியல் மற்றும் இலக்கணத் தெளிவின்மைகள் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
