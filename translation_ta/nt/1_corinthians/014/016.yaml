revisions:
- from: இல்லையென்றால், நீ ஆவியில்[b] வாழ்த்துரை கூறும்போது, கற்றறியாதவரின் இடத்தில் இருப்பவர்[a], நீ செலுத்தும் நன்றிக்கு[c] எப்படி “ஆமென்” என்பார்? நீ என்ன சொல்கிறாய் என்பது அவருக்குத் தெரியாதே.
  to: இல்லையென்றால், நீ ஆவியில்[b] வாழ்த்துரை கூறினால், சிறப்பறிவு இல்லாதவரின் நிலையில் இருப்பவர்[a], உன் நன்றியுரையின்போது[c] எப்படி “ஆமென்” என்பார்? ஏனெனில், நீ சொல்வது அவருக்குப் புரியாது.
  rationale: The revision clarifies the idiomatic Greek expression concerning the ἰδιώτης without narrowing it to a formal social category, improves the Tamil expression for spoken thanksgiving, and makes the final causal statement explicit. It retains the ambiguity of πνεύματι and avoids assigning εὐχαριστία a later sacramental technical sense.
