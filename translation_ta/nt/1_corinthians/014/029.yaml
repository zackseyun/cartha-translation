revisions:
- from: 'தீர்க்கதரிசிகளில் இருவரோ மூவரோ பேசட்டும்; மற்றவர்கள் சொல்லப்படுவதைப் பகுத்தறியட்டும்.[a]


    [a] “தீர்ப்பிடட்டும்” அல்லது “ஆராய்ந்து மதிப்பிடட்டும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல், தீர்க்கதரிசனமாகப் பேசப்படுவதைச் சீர்தூக்கிப் பார்ப்பதைக் குறிக்கலாம்.'
  to: இரண்டு அல்லது மூன்று தீர்க்கதரிசிகள் பேசட்டும்; மற்றவர்கள் அதைப் பகுத்தறியட்டும்.[a]
  rationale: The revision improves idiomatic modern Tamil while preserving the Greek’s imperative force, the unspecified identity of “the others,” and the contextual but unstated object of evaluation. No doctrinal or ecclesiological interpretation has been added.
