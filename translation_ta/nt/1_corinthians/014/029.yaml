  text: προφῆται δὲ δύο ἢ τρεῖς λαλείτωσαν, καὶ οἱ ἄλλοι διακρινέτωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/029.yaml
  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: ta
  text: இரண்டு அல்லது மூன்று தீர்க்கதரிசிகள் பேசட்டும்; மற்றவர்கள் அதைப் பகுத்தறியட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீர்ப்பிடட்டும்,” “ஆராய்ந்து மதிப்பிடட்டும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் தீர்க்கதரிசனப் பேச்சை ஆராய்ந்து சீர்தூக்கிப் பார்ப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: தீர்க்கதரிசிகளில்
  rationale: ‘தீர்க்கதரிசிகள்’ என்பது பெயர்ச்சொல்லின் நேரடி பொருள். ‘இருவரோ மூவரோ’ என்பதுடன் இயல்பான தமிழில் இணைய ‘தீர்க்கதரிசிகளில்’ என வடிவமைக்கப்பட்டது.
- source_word: δὲ
  choice: ;
  rationale: இங்கு δέ மென்மையான கருத்துமாற்றத்தைக் குறிக்கிறது. தமிழில் தனிச் சொல் சேர்க்காமல் அரைப்புள்ளி மூலம் அறிவுறுத்தலின் தொடர்ச்சி இயல்பாகக் காட்டப்படுகிறது.
- source_word: δύο ἢ τρεῖς
  choice: இருவரோ மூவரோ
  rationale: எண்ணிக்கையை நேரடியாகவும் இயல்பான தமிழ் இணைப்புடனும் வழங்குகிறது.
- source_word: λαλείτωσαν
  choice: பேசட்டும்
  rationale: மூன்றாம் நபர் பன்மை கட்டளை வடிவத்தின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: οἱ ἄλλοι
  choice: மற்றவர்கள்
  rationale: இவர்கள் மற்ற தீர்க்கதரிசிகளா, தலைவர்களா, சபையாரில் மற்றவர்களா என்பதை கிரேக்கம் குறிப்பிடாததால் பொதுவான சொல்லே பயன்படுத்தப்பட்டது.
- source_word: διακρινέτωσαν
  choice: சொல்லப்படுவதைப் பகுத்தறியட்டும்
  rationale: இச்சூழலில் தீர்க்கதரிசனப் பேச்சை ஆராய்ந்து சீர்தூக்கிப் பார்ப்பதே கருத்து. கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும் சூழலில் உட்கிடக்கும் பொருளை ‘சொல்லப்படுவதை’ என இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: ‘மற்றவர்கள்’ என்பவர்கள் யார்?
  choice: ‘மற்றவர்கள்’ என்று பொதுவாகவே வைக்கப்பட்டது.
  alternative: ‘மற்ற தீர்க்கதரிசிகள்’ அல்லது ‘சபையில் மீதமுள்ளவர்கள்’
  rationale: கிரேக்க மூலவாக்கியம் அந்தக் குழுவைத் தெளிவாக வரையறுக்கவில்லை. எனவே சபை ஒழுங்கைப் பற்றிய ஒரு குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்பில் திணிக்காமல் மூலத்தின் தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சபை வாசிப்புக்கு ஏற்ற கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான நடை. ‘பகுத்தறியட்டும்’ என்பது மதிப்பீட்டின் நுணுக்கத்தைக் காக்கிறது; ‘மற்றவர்கள்’ என்ற சொல் மூலத்தின் குறிப்பு-தெளிவின்மையைப் பாதுகாக்கிறது.
