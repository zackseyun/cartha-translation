  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: ta
  text: ஏனெனில், எல்லாரும் கற்றுக்கொள்ளவும் எல்லாரும் ஊக்கம் பெறவும், நீங்கள் எல்லாரும் ஒருவருக்குப் பின் ஒருவராக[a] இறைவாக்குரைக்க முடியும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு நேரத்தில் ஒருவர்.’
    reason: lexical_alternative
  - marker: b
    text: ‘ஊக்கம் பெற’ என்பதற்கு ‘அறிவுறுத்தப்பட’ அல்லது ‘ஆறுதல் பெற’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் சூழலுக்கேற்ப ஊக்கம், அறிவுரை, அல்லது ஆறுதல் என்ற பொருள்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: முடியும்
  rationale: இரண்டாம் நபர் பன்மையில் திறன் அல்லது சாத்தியத்தைக் குறிக்கிறது; ‘முடியும்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: καθ’ ἕνα
  choice: ஒருவருக்குப் பின் ஒருவராக
  rationale: சபையில் பலர் ஒரே நேரத்தில் அல்லாமல் வரிசையாகப் பேசுவதைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: πάντες
  choice: எல்லாரும்
  rationale: மூன்று முறை வரும் சொல்லின் வலியுறுத்தலையும் பரப்பையும் காக்கிறது; அதன் குறிப்பு எல்லையை மொழிபெயர்ப்பில் தேவையின்றிக் குறுக்கவில்லை.
- source_word: προφητεύειν
  choice: இறைவாக்குரைக்க
  rationale: பவுல் பயன்படுத்தும் தீர்க்கதரிசனப் பேச்சு என்ற கருத்தை விளக்கவுரையாகச் சுருக்காமல், தமிழில் நிலைபெற்ற வேதாகமச் சொல்லால் தருகிறது.
- source_word: ἵνα
  choice: அப்போது
  rationale: வரிசையான இறைவாக்குரைத்தலால் ஏற்படும் நோக்கம்/விளைவை இயல்பான தமிழில் இணைக்கிறது; கிரேக்கத்தில் நோக்கமும் விளைவும் ஒன்றோடொன்று நெருக்கமாக உள்ளன.
- source_word: μανθάνωσιν
  choice: கற்றுக்கொள்வார்கள்
  rationale: ἵνα-வுக்குப் பின் வரும் பொதுவான கற்றல் விளைவைத் தமிழில் இயல்பான வினை வடிவில் தெரிவிக்கிறது.
- source_word: παρακαλῶνται
  choice: ஊக்கம்பெறுவார்கள்
  rationale: செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; இச்சூழலில் ஊக்கம், அறிவுரை, ஆறுதல் ஆகிய பொருள் நிழல்களை உள்ளடக்கக்கூடிய பரந்த இயல்பான தேர்வு.
theological_decisions:
- issue: சபை அறிவுறுத்தலில் πάντες (‘எல்லாரும்’) என்பதன் குறிப்பு எல்லை
  choice: மூன்று இடங்களிலும் ‘எல்லாரும்’ என்று மொழிபெயர்த்து, முதலாவது பயன்பாடு யாரைச் சுட்டுகிறது என்பதை மேலும் குறுக்கவில்லை.
  alternative: ‘நீங்கள் எல்லாரும்’ என்பதை ‘இறைவாக்குரைப்பவர்கள் எல்லாரும்’ என்று வெளிப்படையாகக் குறுக்குதல்.
  rationale: முதலாவது πάντες இறைவாக்குரைக்கக்கூடியவர்களையும், பின்னைய இரண்டும் கூடிவந்தோரையும் சுட்டக்கூடும். கிரேக்கத்தின் பரந்த சொல்லாட்சியையும் மறுபடியும் வரும் வலியுறுத்தலையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: ἵνα கூறும் நோக்கம் அல்லது விளைவு
  choice: ‘அப்போது’ என்று கொடுத்து, ஒழுங்கான பேச்சின் எதிர்பார்க்கப்படும் விளைவை இயல்பாகத் தெரிவித்தல்.
  alternative: ‘எல்லாரும் கற்றுக்கொண்டு ஊக்கம்பெறுவதற்காக’ என்று நோக்கத்தை மட்டும் வெளிப்படையாக்குதல்.
  rationale: இச்சூழலில் நோக்கமும் விளைவும் நெருக்கமாகப் பின்னியுள்ளன; கிரேக்கத்தில் உள்ள சாத்தியமான இரு நிழல்களையும் மிகையாகத் தீர்மானிக்காமல் வாசிக்க வழிவிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சபை வாசிப்பிற்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. ‘இறைவாக்குரைக்க’ என்பது கருத்தைச் சுருக்காமல் துறைச்சொல்லைப் பாதுகாக்கிறது; குறிப்பு எல்லையையும் παρακαλέω என்பதன் பொருள் பரப்பையும் அடிக்குறிப்புகள் வெளிப்படுத்துகின்றன.
