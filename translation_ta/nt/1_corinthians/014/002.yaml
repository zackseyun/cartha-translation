id: 1CO.14.2
reference: 1 Corinthians 14:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: ta
  text: ஏனெனில், ஒரு மொழியில் பேசுகிறவர் மனிதர்களிடம் அல்ல, கடவுளிடமே பேசுகிறார். அவர் பேசுவதை யாரும் புரிந்துகொள்வதில்லை[a]; மாறாக, அவர் ஆவியில் மறைபொருள்களைப் பேசுகிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாரும் கேட்பதில்லை.” கிரேக்க வினைச்சொல் நேரடியாக “கேள்” என்றும், இச்சூழலில் உட்குறிப்பாக “புரிந்துகொள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஆவியில்” என்பது பரிசுத்த ஆவியையோ பேசுகிறவரின் சொந்த ஆவியையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: பேசுகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல்லின் பொதுமையான ஒருமையை இயல்பான தமிழில் காட்டுகிறது; தேவையின்றி பாலினத்தைக் குறிப்பிடவில்லை.
- source_word: γλώσσῃ
  choice: ஒரு மொழியில்
  rationale: ஒருமை வேற்றுமை வடிவத்தைப் பேணுகிறது. ‘அந்நிய பாஷை’ போன்ற மரபுசார் சொல்லையோ, ‘வேறொரு மொழி’ என்ற கூடுதல் விளக்கத்தையோ திணிக்காமல், இவ்வதிகாரத்தில் உள்ள மொழிப் பேச்சைக் குறிக்கிறது.
- source_word: ἀνθρώποις
  choice: மனிதர்களிடம்
  rationale: ஆண் பாலுக்கு மட்டும் உரியதல்லாத பொதுப் பன்மையைத் துல்லியமாகக் காட்டுகிறது.
- source_word: θεῷ
  choice: கடவுளிடமே
  rationale: λαλεῖ என்பதன் மறைமுகப் பொருளை இயல்பான தமிழில் தருகிறது; ‘அல்ல ... இடமே’ என்ற அமைப்பு கிரேக்க எதிர்மறை மாறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: ἀκούει
  choice: புரிந்துகொள்வதில்லை
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கேட்பது’ என்றாலும், இச்சூழலில் சொல்லப்படுவது விளங்காதிருப்பதே கருத்து. நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: πνεύματι
  choice: ஆவியில்
  rationale: இது பரிசுத்த ஆவியையோ பேசுகிறவரின் ஆவியையோ குறிக்கக்கூடிய கிரேக்கத் தெளிவின்மையைத் தமிழிலும் ஓரளவு பேணுகிறது.
- source_word: μυστήρια
  choice: மறைபொருள்களை
  rationale: பவுலின் பயன்பாட்டிலுள்ள இறையியல் ஆழத்தையும் வெளிப்படுத்தப்படாத அல்லது எளிதில் விளங்காத பொருள் என்ற நயத்தையும் பேணுகிறது.
- source_word: δὲ
  choice: மாறாக
  rationale: முந்தைய கூற்றுடன் உள்ள முரணையும் விளக்கத் தொடர்ச்சியையும் இயல்பான தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: πνεύματι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘ஆவியில்’
  alternative: ‘தமது ஆவியில்’ அல்லது ‘ஆவியானவரால்’
  rationale: கிரேக்க வேற்றுமை வடிவம் பரிசுத்த ஆவியையும் பேசுகிறவரின் ஆவியையும் குறிக்க இடமளிக்கிறது. ‘ஆவியில்’ என்பது எந்த ஒரு இறையியல் விளக்கத்தையும் முடிவாகத் திணிக்காமல் அந்தத் தெளிவின்மையைப் பேணுகிறது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அந்நிய பாஷை’ போன்ற பழைய அல்லது குறிப்பிட்ட திருச்சபை மரபுடன் தொடர்புடைய சொற்றொடர் தவிர்க்கப்பட்டது. வாக்கியத்தின் காரணவியல் ஓட்டமும் கிரேக்கத்தில் உள்ள இறையியல் தெளிவின்மையும் பேணப்பட்டுள்ளன.
