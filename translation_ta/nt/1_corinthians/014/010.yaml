  text: τοσαῦτα εἰ τύχοι γένη φωνῶν ⸀εἰσιν ἐν κόσμῳ, καὶ ⸀οὐδὲν ἄφωνον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/010.yaml
  text: There are perhaps many kinds of languages in the world[a], and none is without meaning.
translation:
  language: ta
  text: உலகத்தில் எத்தனையோ வகையான மொழிகள் இருக்கலாம்[a]; அவற்றில் எதுவும் பொருளற்றது அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உலகத்தில் எத்தனையோ வகையான ஒலிகள் இருக்கலாம்; அவற்றில் எதுவும் ஒலியற்றது அல்ல.”
    reason: φωνῶν என்பது ‘மொழிகள்,’ ‘குரல்கள்,’ அல்லது ‘ஒலிகள்’ என்றும், ἄφωνον என்பது சொற்பட ‘ஒலியற்றது’ அல்லது ‘குரலற்றது’ என்றும் பொருள்படலாம்; கிரேக்கச் சொல்லாடலின் தெளிவின்மையை இந்த மாற்று பாதுகாக்கிறது.
lexical_decisions:
- source_word: τοσαῦτα
  choice: எத்தனையோ
  rationale: எண்ணிக்கையைத் துல்லியமாகக் குறிப்பிடாமல் மிகுந்த வகைகள் இருப்பதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: εἰ τύχοι
  choice: இருக்கலாம்
  rationale: இந்த இடத்தில் இடைச்சொல் போன்று வரும் கிரேக்க மரபுத்தொடரின் ‘ஒருவேளை / இருக்கக்கூடும்’ என்ற மென்மையான தொனியை இயல்பான தமிழில் தருகிறது.
- source_word: γένη
  choice: வகையான
  rationale: பல்வேறு இனங்கள் அல்லது பிரிவுகள் என்ற பொருளைச் சூழலுக்கேற்ற எளிய தமிழில் தெரிவிக்கிறது.
- source_word: φωνῶν
  choice: மொழிகள்
  rationale: அடுத்த வசனத்தில் சொல்லின் பொருளை அறிதல் பற்றிப் பேசப்படுவதால், இங்கே மனிதர்கள் பயன்படுத்தும் மொழிகள் அல்லது பேச்சு வடிவங்கள் என்பதே சூழலுக்கு இயல்பான பொருள். ‘ஒலிகள்’ என்ற அகன்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐν κόσμῳ
  choice: உலகத்தில்
  rationale: κόσμος என்பதன் இச்சூழலுக்குரிய நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: οὐδὲν ἄφωνον
  choice: அவற்றில் எதுவும் பொருளற்றது அல்ல
  rationale: ἄφωνον என்பதன் சொற்பொருள் ‘ஒலியற்றது/குரலற்றது’ என்றாலும், மொழிகள் ஒவ்வொன்றும் அர்த்தம் தெரிவிக்கின்றன என்பதே வாதத்தின் சூழல்சார் நோக்கம். சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘இருக்கலாம்’ εἰ τύχοι என்பதன் தயக்கத் தொனியை வாக்கியத்துடன் இயல்பாக இணைக்கிறது; ‘எத்தனையோ’ பெரும் ஆனால் குறிப்பிடப்படாத எண்ணிக்கையை உணர்த்துகிறது.
