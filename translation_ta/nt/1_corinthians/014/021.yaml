id: 1CO.14.21
reference: 1 Corinthians 14:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: ta
  text: 'திருச்சட்டத்தில் இவ்வாறு எழுதப்பட்டுள்ளது: “வேற்று மொழி பேசுவோராலும், அந்நியர்களின் உதடுகளாலும் இந்த மக்களிடம் பேசுவேன்[a]; அப்படியும்கூட அவர்கள் எனக்குச் செவிகொடுக்க மாட்டார்கள்[b]” என்று ஆண்டவர் கூறுகிறார்.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேற்று மொழிகளாலும் மற்றவர்களின் உதடுகளாலும் இந்த மக்களிடம் பேசுவேன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் எனக்குக் கீழ்ப்படிய மாட்டார்கள்.”
    reason: lexical_alternative
  - marker: c
    text: இந்த மேற்கோள் ஏசாயா 28:11–12-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
  - marker: d
    text: இம்மேற்கோளில் பேசுபவர் இஸ்ரவேலின் தேவன். எபிரெயப் பின்னணியை வெளிப்படுத்த சில மொழிபெயர்ப்புகள் “கர்த்தர்” (LORD) என்று தருகின்றன; கிரேக்க உரையில் “ஆண்டவர்” என்பதற்குரிய κύριος உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: திருச்சட்டத்தில்
  rationale: பவுல் இங்கு ஏசாயாவை மேற்கோள் காட்டினாலும், νόμος என்பதை யூத மறைநூல் தொகுப்பை விரிவாகக் குறிக்கும் வழக்கில் பயன்படுத்துகிறார். ‘திருச்சட்டம்’ அந்த வேதாகமப் பயன்பாட்டை இயல்பாகத் தக்கவைக்கிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டுள்ளது
  rationale: வேதமேற்கோளை அறிமுகப்படுத்தும் கிரேக்க நிறைவு காலச் செயப்பாட்டு வாய்பாட்டின் இயல்பான தமிழாக்கம்.
- source_word: ἑτερογλώσσοις
  choice: வேற்று மொழிகள் பேசுவோரைக்கொண்டு
  rationale: ‘வேறுபட்ட மொழிகளையுடைய’ என்ற பொருளைத் தெளிவாக வெளிப்படுத்தி, சூழலில் வரும் மொழிகள் குறித்த விவாதத்துடனான தொடர்பையும் காக்கிறது.
- source_word: χείλεσιν ἑτέρων
  choice: அந்நியர்களின் உதடுகளைக்கொண்டு
  rationale: மேற்கோளின் ‘உதடுகள்’ என்ற உருவகத்தைத் தக்கவைத்து, ἑτέρων என்பது வேறு மொழி அல்லது இனத்தைச் சேர்ந்தவர்களைக் குறிப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λαλήσω
  choice: பேசுவேன்
  rationale: எளிய எதிர்கால வினையாகிய λαλήσω என்பதற்கு நேரடியான, இயல்பான இணை.
- source_word: τῷ λαῷ τούτῳ
  choice: இந்த மக்களிடம்
  rationale: λαός என்பதன் கூட்டுமக்கள் சார்ந்த பொருளையும், தமிழில் ‘பேசுதல்’ உடன் வரும் இயல்பான வேற்றுமையையும் காக்கிறது.
- source_word: οὐδ’ οὕτως
  choice: அப்படியும்கூட
  rationale: ‘இந்த முறையில்கூட இல்லை’ என்ற வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: εἰσακούσονταί μου
  choice: எனக்குச் செவிகொடுக்க மாட்டார்கள்
  rationale: வெறுமனே ஒலியைக் கேட்பதைவிட கவனித்துக் கேட்டு ஏற்றுக்கொள்ளுதல் அல்லது கீழ்ப்படிதல் என்ற εἰσακούω-வின் நுண்பொருளைத் தக்கவைக்கிறது.
- source_word: λέγει κύριος
  choice: என்று ஆண்டவர் கூறுகிறார்
  rationale: மேற்கோள் அறிமுகச் சூத்திரத்தின் நிகழ்காலத்தையும் κύριος என்பதன் வழக்கமான தமிழாக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: தெய்வீக உரையைக் கொண்ட மறைநூல் மேற்கோளில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / கர்த்தர்
  rationale: கிரேக்க மூலத்தில் κύριος என்றே உள்ளது; எபிரெயப் பின்னணியிலுள்ள இறைப்பெயரை முதன்மை உரைக்குள் மீளமைக்காமல், கிரேக்கத்துக்கு நேரான ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது. ஏசாயா மேற்கோளில் இஸ்ரவேலின் தேவன் பேசுகிறார் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மறைநூல் மேற்கோளின் உருவகமான ‘உதடுகள்’ பாதுகாக்கப்பட்டுள்ளது; ‘செவிகொடுக்க’ என்பது கேட்பதோடு ஏற்றுக்கொள்ளும் நுண்பொருளையும் தருகிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
