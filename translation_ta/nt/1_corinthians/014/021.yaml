  source_fidelity: 'முதன்மை மொழிபெயர்ப்பு கிரேக்க வாக்கியத்தின் பொருளைச் சரியாகக் கொண்டுள்ளது: வேற்றுமொழி/பிறரின் உதடுகள் வழியாகப் பேசுதல், ‘இந்த மக்கள்,’ அவர்கள் செவிகொடுக்காதிருத்தல், மற்றும் ‘ஆண்டவர் கூறுகிறார்’ ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘பேசுவோரைக்கொண்டும்’ மற்றும் ‘உதடுகளைக்கொண்டும்’ என்பவை கருவிப் பொருளைச் சொன்னாலும் இந்நடையில் இயல்பற்றவை. ‘-ஆலும்’ வடிவம் கிரேக்கத்தின் ἐν-கருவி அமைப்புக்கு நேராகவும் இயல்பாகவும் அமையும்.'
