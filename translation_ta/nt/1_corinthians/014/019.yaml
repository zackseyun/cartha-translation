source:
  edition: SBLGNT
  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: ta
  text: ஆனால், திருச்சபையில் மற்றவர்களுக்கும் கற்பிக்கும்படி, ஒரு மொழியில் பத்தாயிரம் வார்த்தைகள் பேசுவதைவிட, என் புரிதலோடு ஐந்து வார்த்தைகள் பேசவே நான் விரும்புகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் ‘நா’ அல்லது ‘மொழி’ என்று பொருள்படலாம். இங்கு அது 1 கொரிந்தியர் 12–14-இல் விவாதிக்கப்படும் பேச்சுவகையைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: திருச்சபையில்
  rationale: இங்கு கூடி வழிபடும் கிறிஸ்தவச் சமூகத்தைக் குறிக்கிறது. ‘திருச்சபையில்’ என்பது அந்தக் கூட்டுச் சூழலை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: θέλω
  choice: நான் விரும்புகிறேன்
  rationale: அடிப்படையில் ‘விரும்புகிறேன்’ என்று பொருள்படும்; தொடர்ந்து வரும் ஒப்பீட்டு அமைப்பு எதை மேலாக விரும்புகிறார் என்பதைத் தெளிவாக்குகிறது.
- source_word: πέντε λόγους
  choice: ஐந்து வார்த்தைகள்
  rationale: ‘பத்தாயிரம் வார்த்தைகள்’ என்பதற்கு எதிராக நிறுத்தப்பட்டுள்ள எண்ணியல் சொல்லாட்சியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τῷ νοΐ μου
  choice: என் அறிவோடு
  rationale: புரிந்துணர்ந்து பேசுவதைக் குறிக்கும் νοῦς என்பதன் மனம்/அறிவு சார்ந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் உணர்ச்சியற்ற அறிவாற்றல் என்ற குறுகிய பொருளைத் திணிக்கவில்லை.
- source_word: λαλῆσαι
  choice: பேசுவது
  rationale: பொதுக்கூட்டத்தில் வாய்மொழியாக வெளிப்படுத்துவதை இயல்பாகக் குறிக்கிறது.
- source_word: ἵνα καὶ ἄλλους κατηχήσω
  choice: மற்றவர்களுக்கும் கற்பிப்பதற்காக
  rationale: κατηχέω என்பதிலுள்ள வாய்மொழி அறிவுறுத்தல்/போதித்தல் கருத்தை எளிய நவீன தமிழில் தருகிறது; பிற்காலத் தொழில்நுட்பச் சமயப் பொருளைச் சேர்க்கவில்லை. καί என்பதன் சேர்க்கைப் பொருள் ‘-க்கும்’ மூலம் வெளிப்படுகிறது.
- source_word: μυρίους λόγους
  choice: பத்தாயிரம் வார்த்தைகள்
  rationale: மிகப் பெரிய எண்ணை மிகைப்படுத்திக் காட்டும் சாத்தியம் இருந்தாலும், ‘ஐந்து’ என்பதுடனான பவுலின் கூர்மையான எண்ணியல் முரணைப் பாதுகாக்க அடிப்படை எண்ணான ‘பத்தாயிரம்’ வைக்கப்பட்டுள்ளது.
- source_word: ἐν γλώσσῃ
  choice: ஒரு நாவில்
  rationale: γλῶσσα என்பதன் ‘நா’ மற்றும் ‘மொழி’ ஆகிய இரு சாத்தியங்களையும் முற்றாகத் தீர்மானிக்காமல், இந்த அதிகாரங்களில் விவாதிக்கப்படும் சிறப்புவகைப் பேச்சைக் குறிக்கும் சொல்லாட்சியைப் பாதுகாக்கிறது. தமிழில் ஏற்படக்கூடிய தெளிவின்மையை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: 1 கொரிந்தியர் 12–14இல் γλῶσσα என்பதன் பொருள்
  choice: ஒரு நாவில்
  alternative: ஒரு மொழியில்
  rationale: இது சாதாரண அயல்மொழியா, வேறுவகை ஆவிக்குரிய பேச்சா என்ற விவாதத்தை மொழிபெயர்ப்பே தீர்த்துவிடாமல், மூலச்சொல்லின் உருவகத்தையும் இப்பகுதியின் சொல்லாட்சியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், திருச்சபை வாசிப்புக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் அறிவோடு’ என்பது புரிந்துகொள்ளத்தக்க பேச்சின் கருத்தைத் தருகிறது; ‘ஒரு நாவில்’ என்ற சற்றே அசாதாரணமான வடிவம் மூலத்தின் உண்மையான பொருள் தெளிவின்மையைப் பாதுகாப்பதற்காக அடிக்குறிப்புடன் வைக்கப்பட்டுள்ளது.
