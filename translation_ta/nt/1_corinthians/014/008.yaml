  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. போர்ச் சூழலுக்குரிய ‘எக்காளம்’ மற்றும் ‘ஆயத்தப்படுத்திக்கொள்’ ஆகிய சொற்கள் மூலத்தின் உருவகத்தையும் நடுவினை நுணுக்கத்தையும் காக்கின்றன. எல்லா அடிக்குறிப்பு குறிப்பான்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
