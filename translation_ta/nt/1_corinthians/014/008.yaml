base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: ta
  text: ஏனெனில், எக்காளம் தெளிவில்லாத ஒலியை எழுப்பினால்,[a] போருக்காகத் தன்னை ஆயத்தப்படுத்திக்கொள்வார் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெளிவாக அறிய முடியாத ஒலியை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்தை விளக்கும் இணைப்பாக இருப்பதால், நவீன தமிழில் இயல்பான ‘ஏனெனில்’ பயன்படுத்தப்பட்டது.
- source_word: ἐὰν
  choice: எழுப்பினால்
  rationale: δῷ என்பதுடன் சேர்ந்த நிபந்தனை அமைப்பு தமிழில் ‘ஒலியை எழுப்பினால்’ என்று இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: ἄδηλον
  choice: தெளிவில்லாத
  rationale: அடையாளம் காணவோ புரிந்துகொள்ளவோ முடியாத, வேறுபடுத்தித் தெரியாத ஒலியைக் குறிக்கிறது; ‘தெளிவில்லாத’ என்பது பொருளை நேரடியாகக் காக்கிறது.
- source_word: φωνὴν
  choice: ஒலியை
  rationale: எக்காளத்தின் சூழலில் φωνή மனிதக் குரலை அல்ல, கருவி எழுப்பும் ஒலியைக் குறிக்கிறது.
- source_word: σάλπιγξ
  choice: எக்காளம்
  rationale: போர் அறிவிப்புகளுக்குப் பயன்படுத்தப்பட்ட ஊதுகருவிக்கான நிலைபெற்ற, கண்ணியமான தமிழ் சொல்.
- source_word: δῷ
  choice: எழுப்பினால்
  rationale: சொல்லுக்கு அடிப்படையில் ‘கொடுத்தால்’ என்றாலும், ஒலியுடன் தமிழில் ‘ஒலியை எழுப்புதல்’ என்பதே இயல்பான இணைச்சொல்.
- source_word: τίς
  choice: யார்
  rationale: விடை எதிர்பாராத வினாவை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: παρασκευάσεται
  choice: தன்னை ஆயத்தப்படுத்திக்கொள்பவர்
  rationale: எதிர்கால நடுவினை வடிவிலுள்ள ஒருவர் தம்மையே தயார்ப்படுத்தும் நுணுக்கத்தைத் தமிழில் வெளிப்படையாகக் காக்கிறது.
- source_word: εἰς πόλεμον
  choice: போருக்காக
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான ‘போருக்காக’ என்ற பொருளை முதன்மை உரையில் காக்கிறது; சூழலில் ‘போரிடுவதற்காக’ என்பதும் சாத்தியம்.
