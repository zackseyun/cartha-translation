source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: ta
  text: அதுபோலவே நீங்களும், நாவினால் தெளிவாகப் புரிந்துகொள்ளக்கூடிய பேச்சைப் பேசாவிட்டால்[a], பேசப்படுவது என்னவென்று எப்படித் தெரிந்துகொள்ள முடியும்? ஏனெனில், நீங்கள் காற்றை நோக்கிப் பேசுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெளிவான பேச்சைப் பேசாவிட்டால்” அல்லது “புரிந்துகொள்ளக்கூடிய செய்தியைத் தெரிவிக்காவிட்டால்.” கிரேக்கச் சொல், கேட்போர் அடையாளம் கண்டு புரிந்துகொள்ளக்கூடிய பேச்சை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: அதுபோலவே நீங்களும்
  rationale: முந்தைய எடுத்துக்காட்டுடன் பவுல் செய்யும் ஒப்பீட்டையும் கொரிந்தியர்களை நேரடியாக அழைப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ τῆς γλώσσης
  choice: நாவினால்
  rationale: ‘நா’ என்ற தெளிவான உடல் உருவகத்தைப் பாதுகாத்து, பேச்சை அதன்மூலம் வெளிப்படுத்துதல் என்ற பொருளையும் தருகிறது; இதை உடனே ‘மொழி’ என்று விளக்கிவிடவில்லை.
- source_word: εὔσημον λόγον
  choice: தெளிவாகப் புரிந்துகொள்ளக்கூடிய வார்த்தைகளை
  rationale: εὔσημος என்பதிலுள்ள தெளிவாக அடையாளம் கண்டு புரிந்துகொள்ளக்கூடிய தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது. λόγος இங்கு ஒரு தனிச் சொல்லை மட்டும் குறிக்காததால் பன்மைத் தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: δῶτε
  choice: பேசாவிட்டால்
  rationale: கிரேக்கத்தில் சொற்பொருளாக ‘கொடுத்தல்’ இருந்தாலும், தமிழில் ‘வார்த்தைகளைக் கொடுத்தல்’ இயல்பற்றது; சூழலில் நோக்கப்படும் வாய்மொழி வெளிப்பாட்டை ‘பேசுதல்’ தெளிவாகக் கூறுகிறது.
- source_word: πῶς γνωσθήσεται
  choice: எப்படித் தெரிந்துகொள்ள முடியும்?
  rationale: சொற்பொருளான ‘அறியப்படும்’ என்பதைக் காட்டிலும், கேட்போர் சொல்லப்பட்டதை உணர்வதே இங்குள்ள கருத்து என்பதை இயல்பாகத் தெரிவிக்கிறது; யார் தெரிந்துகொள்வார் என்பதைச் சேர்க்காமல் மூலத்தின் பொதுநிலையைப் பாதுகாக்கிறது.
- source_word: τὸ λαλούμενον
  choice: பேசப்படுவது என்னவென்று
  rationale: பெயர்ச்சொல் தன்மையுள்ள இறந்தகால வினையெச்சத்தின் செயல்பாட்டையும் செயப்பாட்டு நிலையையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: ஏனெனில், நீங்கள் காற்றை நோக்கிப் பேசுகிறவர்களாக இருப்பீர்கள்
  rationale: பயனற்றதும் புரிந்துகொள்ளப்படாததுமான பேச்சைக் குறிக்கும் ‘காற்றை நோக்கிப் பேசுதல்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது.
