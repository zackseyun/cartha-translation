  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நாவினால்’ மற்றும் ‘காற்றை நோக்கிப் பேசுதல்’ என்ற மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; εὔσημον λόγον என்பதன் பொருள் அடிக்குறிப்பில் மாற்று வடிவங்களுடன் விளக்கப்பட்டுள்ளது.
