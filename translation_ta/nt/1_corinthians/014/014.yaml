source:
  edition: SBLGNT
  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: ta
  text: ஏனெனில், நான் ஒரு மொழியில்[a] ஜெபித்தால், என் ஆவி ஜெபிக்கிறது; ஆனால் என் மனம்[b] கனிகொடாததாக உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு நாவில்.’ கிரேக்கச் சொல் ஒரு மனித மொழியைக் குறிக்கலாம்; இவ்வதிகாரம் முழுவதும் பேசப்படும் ஆவியால் வழங்கப்படும் பேச்சையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் புரிதல் கனிகொடாததாக உள்ளது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: ஏனெனில், … ஜெபித்தால்
  rationale: γάρ முந்தைய வாதத்துடன் விளக்கத் தொடர்பை ஏற்படுத்துவதால் ‘ஏனெனில்’ என்றும், ἐάν நிபந்தனையைக் குறிப்பதால் ‘-த்தால்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: προσεύχωμαι
  choice: நான் … ஜெபித்தால்
  rationale: ἐάν உடன் வரும் நிகழ்காலத் துணைவினை வடிவத்தின் நிபந்தனைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: γλώσσῃ
  choice: ஒரு மொழியில்
  rationale: γλῶσσα என்பது மனித மொழியையோ, இவ்வதிகாரத்தில் விவாதிக்கப்படும் ஆவியால் அருளப்படும் பேச்சையோ குறிக்கலாம். ‘ஒரு மொழியில்’ என்பது எண்ணைத் தக்கவைத்து, தமிழில் இயல்பாக இருந்து, அந்தத் தெளிவின்மையையும் இயன்றவரை பாதுகாக்கிறது.
- source_word: τὸ πνεῦμά μου
  choice: என் ஆவி
  rationale: ‘என்’ என்ற உடைமைச் சொல்லையும் πνεῦμα என்பதன் நேரடிப் பொருளையும் தக்கவைக்கிறது; இது பரிசுத்த ஆவியைக் குறிப்பதாக மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- source_word: προσεύχεται
  choice: ஜெபிக்கிறது
  rationale: கிரேக்க நிகழ்காலத்தைத் தெளிவான, இயல்பான தமிழ் நிகழ்காலமாக வழங்குகிறது.
- source_word: ὁ δὲ νοῦς μου
  choice: ஆனால் என் மனம்
  rationale: δέ காட்டும் எதிர்மறை ஒப்புமையை ‘ஆனால்’ வெளிப்படுத்துகிறது. νοῦς என்பதற்கு ‘மனம்’ என்பது நேரடியான விரிவுடைய இணைச்சொல்; ‘புரிந்துகொள்ளும் திறன்’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: ἄκαρπός ἐστιν
  choice: கனியற்றதாக இருக்கிறது
  rationale: ἄκαρπος என்பதிலுள்ள கனி உருவகத்தைப் பாதுகாத்து, அதை வெறுமனே ‘பயனற்றது’ என்று விளக்கிப் பொருள்கூறுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: τὸ πνεῦμά μου (‘என் ஆவி’) என்பதன் குறிப்பு
  choice: பேசுபவருடைய ஆவி என்ற நேரடியான வாசிப்பு
  alternative: பேசுபவருக்குள் செயல்படும் பரிசுத்த ஆவி
  rationale: ‘என்’ என்பதும் ‘என் மனம்’ என்பதுடனான எதிரிணையும் மனிதரின் ஆவியைக் குறிப்பதற்கு ஆதரவளிக்கின்றன. எனினும், மொழிபெயர்ப்பு கூடுதல் விளக்கத்தைச் சேர்க்காமல் ‘என் ஆவி’ என்றே வைத்து இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: γλώσσῃ குறிக்கும் பேச்சின் இயல்பு
  choice: ‘ஒரு மொழியில்’ என்று பொதுவாக மொழிபெயர்த்து குறிப்பு மூலம் பொருள் வரம்பை விளக்குதல்
  alternative: ‘அந்நிய மொழியில்’ அல்லது ‘ஆவியால் அருளப்பட்ட நாவில்’
  rationale: கிரேக்கச் சொல் மட்டும் அந்த மொழி மனித மொழியா அல்லது இவ்வதிகாரத்தின் சிறப்பான ஆவிக்குரிய பேச்சா என்பதை முழுமையாகத் தீர்மானிக்காது. ஆகவே மூலத்தில் இல்லாத ‘அந்நிய’ அல்லது விளக்கச் சொற்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அந்நிய பாஷை’ போன்ற பழைய அல்லது மரபுசார் சொற்றொடர்கள் தவிர்க்கப்பட்டன. ‘கனியற்றது’ என்ற உருவகம் பவுலின் சொற்படிமத்தைப் பாதுகாக்கிறது; ‘மனம்’ மற்றும் ‘ஆவி’ என்ற எதிரிணை விளக்கவுரையால் தீர்க்கப்படாமல் அப்படியே வைக்கப்பட்டுள்ளது.
