- from: ஏனெனில், நான் ஒரு மொழியில்[a] ஜெபித்தால், என் ஆவி ஜெபிக்கிறது; ஆனால் என் மனம்[b] கனியற்றதாக இருக்கிறது.
  to: ஏனெனில், நான் ஒரு மொழியில்[a] ஜெபித்தால், என் ஆவி ஜெபிக்கிறது; ஆனால் என் மனம்[b] கனிகொடாததாக உள்ளது.
  rationale: The revision retains the draft’s faithful main rendering and its restraint concerning the referent of ‘my spirit.’ It clarifies the lexical note for γλώσσῃ, completes the alternative for νοῦς, and makes the final predicate more natural without replacing Paul’s fruit metaphor with a merely explanatory term such as ‘பயனற்றது.’
