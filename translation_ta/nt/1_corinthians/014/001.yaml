reference: 1 Corinthians 14:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: ta
  text: அன்பைத் தொடர்ந்து நாடுங்கள்; ஆவிக்குரியவற்றை[a] ஆர்வத்துடன் விரும்புங்கள்; ஆனால் குறிப்பாக, தீர்க்கதரிசனம் சொல்லும்படி விரும்புங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆவிக்குரிய காரியங்களை.’ சூழலில் இது சபையில் ஆவியால் அளிக்கப்படும் வரங்கள் அல்லது வெளிப்பாடுகளை முக்கியமாகக் குறிக்கிறது. கிரேக்கச் சொற்றொடர் ‘வரங்கள்’ என்பதைவிடப் பரந்தது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆனால் குறிப்பாக’ என்பதற்கு, ‘அதற்கு மேலாக’ அல்லது ‘மாறாக’ என்றும் மொழிபெயர்க்கலாம். இங்கு தீர்க்கதரிசனம் சொல்லுவதற்குக் கொடுக்கப்படும் ஒப்பீட்டு முன்னுரிமையே வலியுறுத்தப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Διώκετε
  choice: தொடர்ந்து நாடுங்கள்
  rationale: διώκω என்பதில் தீவிரமாகவும் விடாமுயற்சியுடனும் பின்தொடரும் பொருள் உள்ளது. ‘தொடர்ந்து நாடுங்கள்’ என்பது அந்த நீடித்த செயற்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀγάπην
  choice: அன்பை
  rationale: ἀγάπη என்பதற்கான தெளிவான, நவீனத் தமிழ் இணை ‘அன்பு’; இது முந்தைய அதிகாரத்துடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: ζηλοῦτε
  choice: ஆர்வத்துடன் விரும்புங்கள்
  rationale: ζηλόω இங்கு தீவிரமான விருப்பத்தையும் ஆர்வத்தையும் குறிக்கும் கட்டளை. இந்தத் தமிழ் வடிவம் அதன் வலிமையை மிகைப்படுத்தாமல் இயல்பாகக் காட்டுகிறது.
- source_word: τὰ πνευματικά
  choice: ஆவிக்குரியவற்றை
  rationale: நடுநிலைப் பன்மை உருபுடைய இச்சொற்றொடர் ‘ஆவிக்குரியவை/ஆவிக்குரிய காரியங்கள்’ என்ற பரந்த பொருளுடையது. சூழல் ஆவியால் அளிக்கப்படும் வெளிப்பாடுகள் அல்லது வரங்களைச் சுட்டினாலும், மூலத்தில் இல்லாத ‘வரங்கள்’ என்பதை முதன்மை உரையில் சேர்க்காமல் அதன் உண்மையான பரப்பைத் தக்கவைக்கிறது.
- source_word: μᾶλλον δὲ
  choice: அதிலும் குறிப்பாக
  rationale: μᾶλλον முன்னுரிமையையோ அதிக வலியுறுத்தலையோ குறிக்கிறது; δέ தரும் முன்னேற்றம்/வேறுபாட்டையும் இணைத்து, தீர்க்கதரிசனத்திற்குக் கொடுக்கப்படும் சிறப்பு முன்னுரிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἵνα προφητεύητε
  choice: நீங்கள் தீர்க்கதரிசனம் சொல்ல வேண்டும் என்று
  rationale: ἵνα உடன் வரும் இறந்தகாலமல்லாத வாய்ப்பாட்டு வினை இங்கு விருப்பத்தின் உள்ளடக்கம் அல்லது நோக்கத்தைச் சொல்கிறது. ‘வேண்டும் என்று’ என்பது அதைத் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: προφητεύητε
  choice: தீர்க்கதரிசனம் சொல்ல
  rationale: ‘தீர்க்கதரிசனம் சொல்லுதல்’ என்பது நிலைபெற்ற வேதாகமத் தமிழ் வழக்கு; தேவையற்ற விளக்கத்தைச் சேர்க்காமல் மூலக் கருத்துப்பிரிவைத் தக்கவைக்கிறது.
theological_decisions:
- issue: τὰ πνευματικά என்பதன் பொருள் வரம்பு
  choice: ‘ஆவிக்குரியவற்றை’ என்று பரந்த வடிவில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆவிக்குரிய வரங்களை’ அல்லது ‘ஆவிக்குரிய காரியங்களை’
  rationale: 1 கொரிந்தியர் 12–14 அதிகாரங்களின் சூழல் ஆவியால் வழங்கப்படும் வரங்கள் மற்றும் சபைக் கூடுகையில் அவற்றின் வெளிப்பாடுகளை மையப்படுத்துகிறது. ஆயினும் கிரேக்கச் சொற்றொடர் ‘வரங்கள்’ என்பதைக் காட்டிலும் பரந்தது; ஆகவே முதன்மை உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது, சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: தீர்க்கதரிசனத்திற்குப் பவுல் தரும் முன்னுரிமை
  choice: ‘அதிலும் குறிப்பாக’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மாறாக’ அல்லது ‘அதற்கு மேலாக’
  rationale: இது தீர்க்கதரிசனத்திற்கு ஒப்பீட்டு முன்னுரிமை அளிக்கிறது; மற்ற ஆவிக்குரிய வெளிப்பாடுகளை மறுப்பதாகவோ தீர்க்கதரிசனம் மட்டுமே ஏற்றது எனவோ உரையைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டது. ‘அன்பு’, ‘ஆவிக்குரியவை’, ‘தீர்க்கதரிசனம் சொல்லுதல்’ ஆகியவை வேதாகமச் சூழலோடு பரிச்சயமான சொற்களாக இருந்தாலும், வாக்கிய அமைப்பு இயல்பான நடப்பு தமிழில் வைக்கப்பட்டுள்ளது.
