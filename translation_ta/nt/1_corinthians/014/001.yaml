revisions:
- from: அன்பைத் தொடர்ந்து நாடுங்கள். ஆவிக்குரியவற்றை[a] ஆர்வத்துடன் விரும்புங்கள்; அதிலும் குறிப்பாக, நீங்கள் தீர்க்கதரிசனம் சொல்ல வேண்டும் என்று விரும்புங்கள்.[b]
  to: அன்பைத் தொடர்ந்து நாடுங்கள்; ஆவிக்குரியவற்றை[a] ஆர்வத்துடன் விரும்புங்கள்; ஆனால் குறிப்பாக, தீர்க்கதரிசனம் சொல்லும்படி விரும்புங்கள்.[b]
  rationale: 'The revision removes the unwarranted ‘வேண்டும்’ while preserving Paul’s comparative emphasis: pursue love, desire spiritual things, and especially desire to prophesy. Semicolons keep the coordinated Greek imperatives and final specification closely connected. Footnote wording is lightly standardized for natural modern Tamil and continues to preserve the lexical breadth of τὰ πνευματικά and the comparative nuance of μᾶλλον δέ.'
