base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: ta
  text: சபைகளில் பெண்கள்[a] அமைதியாக இருக்கட்டும். ஏனெனில், அவர்கள் பேசுவதற்கு[b] அனுமதி இல்லை; மாறாக, சட்டமும்[c] சொல்வதுபோல அவர்கள் கீழ்ப்படிந்திருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனைவிகள்”; γυνή என்ற கிரேக்கச் சொல் சூழலைப் பொறுத்து “பெண்” அல்லது “மனைவி” என்று பொருள்படும்.
    reason: alternative_reading
  - marker: b
    text: எந்த வகையான பேச்சு இங்கு குறிக்கப்படுகிறது என்பதை இவ்வசனம் குறிப்பிடவில்லை; சுற்றியுள்ள சூழலின் அடிப்படையில் சிலர் இதை இன்னும் குறுகிய பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “திருச்சட்டம்”; பவுல் குறிப்பாக மோசேயின் சட்டத்தையோ, இன்னும் விரிவாக வேதவாக்கியத்தையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: பெண்கள்
  rationale: γυνή என்பதற்கு சூழலைப் பொறுத்து ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். இவ்வசனத்தில் கணவர்கள் வெளிப்படையாகக் குறிப்பிடப்படாததால், விரிவான பொருளான ‘பெண்கள்’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது; ‘மனைவிகள்’ என்பது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐκκλησίαις
  choice: சபைகளில்
  rationale: இங்கு ἐκκλησία என்பது கூடிவந்த கிறிஸ்தவச் சபைகளைக் குறிக்கிறது. ‘சபைகளில்’ என்பது தமிழில் இயல்பாகவும், உள்ளூர் கூடுகைகளைக் குறிக்கும் பன்மை வடிவைத் தக்கவைத்தும் உள்ளது.
- source_word: σιγάτωσαν
  choice: அமைதியாக இருக்கட்டும்
  rationale: நிகழ்காலக் கட்டளை வடிவம், கூறப்படும் சூழலில் பேசாமல் அமைதி காக்கும்படி சொல்கிறது. இதே அதிகாரத்தில் ஒழுங்குக்காக அமைதியாக இருப்பதைக் குறிக்கப் பயன்படுத்தப்பட்ட வினையின் பொருளையும் இச்சொற்றொடர் தக்கவைக்கிறது.
- source_word: ἐπιτρέπεται
  choice: அனுமதி இல்லை
  rationale: செயப்பாட்டு வடிவில் மறுக்கப்படும் அனுமதியைத் தெளிவான நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: λαλεῖν
  choice: பேசுவதற்கு
  rationale: λαλέω என்பது பொதுவாகப் பேசுதலைக் குறிக்கும் விரிவான வினை. எந்த வகையான பேச்சு என்று உரையே குறிப்பிடாததால், நடுநிலையான ‘பேசுவதற்கு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὑποτασσέσθωσαν
  choice: கீழ்ப்பட்டிருக்கட்டும்
  rationale: நிகழ்கால இடை/செயப்பாட்டு கட்டளை வடிவம் கீழ்ப்பட்டிருக்கும் நிலைப்பாட்டைக் குறிக்கிறது. ‘கீழ்ப்பட்டிருக்கட்டும்’ அதன் கட்டளைத் தன்மையையும் தொடர்நிலையையும் பாதுகாக்கிறது.
- source_word: νόμος
  choice: சட்டம்
  rationale: νόμος என்பதன் நேரடியான பொருள் ‘சட்டம்’. இது குறிப்பாக மோசேயின் சட்டத்தையா அல்லது வேதாகம அதிகாரத்தை இன்னும் விரிவாகவா குறிக்கிறது என்பதை முதன்மை உரை தீர்மானிக்காமல் விடுகிறது.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: சட்டமும் சொல்வதுபோல
  rationale: καθὼς என்பதன் ஒப்பீட்டுத் தன்மையையும் καί என்பதன் ‘மேலும்/உம்’ என்ற வலியுறுத்தலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: γυναῖκες என்பதன் குறிப்பு
  choice: சபைகளில் உள்ள பெண்கள்
  alternative: சபைகளில் உள்ள மனைவிகள்
  rationale: இந்தக் கிரேக்கச் சொல் பெண்களையோ மனைவிகளையோ குறிக்கலாம். உடனடிச் சூழலில் கணவர்கள் குறிப்பிடப்படாததால் ‘பெண்கள்’ முதன்மை உரையில் உள்ளது; குறுகிய மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: பேசக்கூடாது என்ற கட்டளையின் வரம்பு
  choice: எந்த வகையான பேச்சு என்று குறுக்காமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: இடையூறான பேச்சுக்கு மட்டும் அல்லது தீர்க்கதரிசனங்களை மதிப்பிடும் பேச்சுக்கு மட்டும் விதிக்கப்பட்ட கட்டுப்பாடு
  rationale: இவ்வசனத்தில் கிரேக்கம் ‘பேச’ என்று மட்டுமே கூறுகிறது. சுற்றியுள்ள சூழல் இதன் வரம்பை எவ்வாறு குறுக்குகிறது என்பது விவாதத்திற்குரியது; ஆகவே ஒரு குறிப்பிட்ட விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- issue: ὁ νόμος என்பதன் குறிப்பு
  choice: சட்டம்
  alternative: குறிப்பாக மோசேயின் சட்டம் அல்லது பொதுவாக வேதவாக்கியம்
  rationale: பவுல் குறிப்பாக எதைச் சுட்டுகிறார் என்பது விவாதத்திற்குரியது. ‘சட்டம்’ என்ற மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கட்டளைத் தொனியும், ‘பெண்கள்/மனைவிகள்’, பேசுதலின் வரம்பு, ‘சட்டம்’ என்பதன் குறிப்பு ஆகிய உண்மையான விளக்கத் தெளிவின்மைகளும் பாதுகாக்கப்பட்டுள்ளன.
