language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: ta
  text: ஆகவே, அந்த ஒலியின் பொருள்[a] எனக்குத் தெரியாவிட்டால், பேசுகிறவருக்கு நான் அந்நியனாக[b] இருப்பேன்; பேசுகிறவரும் எனக்கு அந்நியனாக இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த ஒலியின் வலிமை’; அதாவது, அந்த ஒலி தெரிவிக்கும் முக்கியத்துவம் அல்லது கருத்து.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘பார்பரோஸ்’; இங்கு பேச்சினால் அந்நியராக அல்லது புரிந்துகொள்ள முடியாதவராக இருப்பவரைக் குறிக்கிறது; நாகரிகமற்றவர் என்று அவசியம் பொருளல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν μὴ εἰδῶ
  choice: ஆகவே, ... எனக்குத் தெரியாவிட்டால்
  rationale: οὖν என்பதன் முடிவுரைத் தொடர்பையும் ἐὰν என்பதன் நிபந்தனையையும் இயல்பான தமிழில் காக்கிறது; οἶδα என்பதற்கு அடிப்படையான ‘தெரிதல்/அறிதல்’ பொருள் வழங்கப்பட்டுள்ளது.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: அந்த ஒலியின் பொருள்
  rationale: δύναμις என்பதன் நேரடிப் பொருள் ‘வலிமை/ஆற்றல்’ என்றாலும், இங்கு φωνή வெளிப்படுத்தும் கருத்து அல்லது பொருளைக் குறிக்கிறது. φωνή-க்கு ‘ஒலி’ என்பது குரல், இசைக்கருவி ஒலி, மொழியொலி ஆகியவற்றை உள்ளடக்கக்கூடியதாகவும் முந்தைய வசனங்களின் சூழலுக்கு ஏற்றதாகவும் உள்ளது. ‘அந்த’ என்பது முன்பு குறிப்பிடப்பட்ட ஒலியை இயல்பாகச் சுட்டுகிறது.
- source_word: τῷ λαλοῦντι
  choice: பேசுகிறவருக்கு
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: βάρβαρος
  choice: அந்நியன்
  rationale: இச்சூழலில் இச்சொல் நாகரிகமற்றவர் என்று இழிவுபடுத்தாமல், பேச்சால் புரிந்துகொள்ள முடியாத அயல்மொழியாளர் அல்லது அந்நியர் என்ற உறவுநிலைப் பொருளைக் குறிக்கிறது.
- source_word: ἐν ἐμοὶ
  choice: எனக்கு
  rationale: பரஸ்பரத் தொடர்பைக் காட்டும் இக்கட்டமைப்பில் ‘எனக்கு’ என்பது இயல்பான தமிழ் இணை; ‘என் பார்வையில்’ என்று தேவையின்றி விளக்கிப் பொருள்கொள்ளவில்லை.
