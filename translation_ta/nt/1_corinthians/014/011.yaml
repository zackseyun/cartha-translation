translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரு தரப்பினருக்கிடையேயான பரஸ்பர மொழிப்புரியாமையை அரைப்புள்ளி தெளிவாக இணைக்கிறது; பாலினச் சார்பைத் தவிர்க்க ‘பேசுகிறவர்’ பயன்படுத்தப்பட்டுள்ளது.
