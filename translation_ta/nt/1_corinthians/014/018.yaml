    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek comparison and thanksgiving while improving modern Tamil syntax. It replaces a potentially misleading literal plural ‘நாவுகளில்’ with the technical compound ‘நாவுமொழிகளில்’; the note preserves ‘மொழிகளில்’ as a genuine lexical alternative and avoids defining the disputed phenomenon.
