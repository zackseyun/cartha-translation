  yaml_path: translation/nt/1_corinthians/014/018.yaml
  text: I thank God that I speak in tongues more than all of you[a].
translation:
  language: ta
  text: உங்கள் எல்லாரையும்விட நான் நாவுமொழிகளில் அதிகமாகப் பேசுவதால், கடவுளுக்கு நன்றி செலுத்துகிறேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் எல்லாரையும்விட நான் மொழிகளில் அதிகமாகப் பேசுகிறேன்.’ கிரேக்கச் சொல் ‘மொழிகள்’ என்றும் பொருள்படும். ஆனால் 1 கொரிந்தியர் 12–14-இல் விவாதிக்கப்படும் நிகழ்வைக் குறிக்கும் வழக்கமான சொல்லாக அது இங்கு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: நன்றி செலுத்துகிறேன்
  rationale: நிகழ்காலச் செயப்பாட்டு வினையின் முதலாம் நபர் ஒருமையை இயல்பான, கண்ணியமான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: εὐχαριστέω என்பதுடன் வரும் வேற்றுமைத் தொடர்பைத் தமிழில் இயல்பாக ‘கடவுளுக்கு நன்றி செலுத்துகிறேன்’ என்று வழங்குகிறது.
- source_word: πάντων ὑμῶν μᾶλλον
  choice: உங்கள் எல்லாரையும்விட … அதிகமாக
  rationale: முழுக் குழுவோடும் செய்யப்படும் ஒப்பீட்டைத் தெளிவாகக் காக்கிறது; ஒவ்வொருவரைக் காட்டிலும் தனித்தனியாக என்ற கூடுதல் விளக்கத்தைத் திணிக்கவில்லை.
- source_word: γλώσσαις
  choice: நாவுகளில்
  rationale: 1 கொரிந்தியர் 12–14 அதிகாரங்களில் விவாதிக்கப்படும் நிகழ்வுக்கான கிரேக்கச் சொல்லின் தனித்துவத்தைப் பாதுகாக்கிறது. ‘மொழிகளில்’ என்பது சாத்தியமான பொருள் என்றாலும் நிகழ்வின் இயல்பை மனித மொழிகள் என்று முன்கூட்டியே தீர்மானிக்கக்கூடும்.
- source_word: λαλῶ
  choice: பேசுகிறேன்
  rationale: நிகழ்கால முதலாம் நபர் ஒருமையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: γλώσσαις என்பதைக் கரிஸ்ம வரங்கள் குறித்த சூழலில் மொழிபெயர்த்தல்
  choice: நாவுகளில்
  alternative: மொழிகளில்
  rationale: ‘நாவுகளில்’ என்பது 1 கொரிந்தியர் 12–14 இல் பேசப்படும் வரத்தைக் குறிக்கும் சொல்லாக இருந்து, அது அறியப்பட்ட மனித மொழிகளா, பரவசப் பேச்சா, அல்லது இன்னும் விரிந்த வகையா என்பதைத் தீர்மானிக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது. ‘மொழிகளில்’ என்ற சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அந்நிய பாஷைகள்’ அல்லது ‘அறியாத மொழிகள்’ போன்ற விளக்கச் சொற்கள் மூலத்தில் இல்லாத கருத்துகளைச் சேர்க்கக்கூடும் என்பதால் தவிர்க்கப்பட்டன. அடிக்குறி [a] முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
