source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: ta
  text: ஆகவே, என் சகோதரர்களே[a], இறைவாக்குரைக்க ஆர்வமாயிருங்கள்; மொழிகளில் பேசுவதைத் தடைசெய்யாதீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் சகோதர சகோதரிகளே” என்றும் பொருள் கொள்ளலாம்; கிரேக்கத்தில் “சகோதரர்களே” என்று இருந்தாலும், அது சபையினர் அனைவரையும் உள்ளடக்கி அழைக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “மொழிகளில் பேசுதல்” என்பதற்கான கிரேக்கச் சொல் நேரடியாக “நாவுகள்” என்றும் பொருள்படும்; இங்கு அந்தப் பேச்சின் துல்லியமான இயல்பு குறிப்பிடப்படவில்லை.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய விவாதத்திலிருந்து முடிவுரையான அறிவுறுத்தலை அறிமுகப்படுத்தும் காரணவிளைவுச் சொல்லின் தொகுப்புணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை விளியையும் μου என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது; இச்சொல் முழுச் சபையையும் உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ζηλοῦτε
  choice: ஆர்வமாயிருங்கள்
  rationale: தொடர்ச்சியான தீவிர விருப்பத்தையும் முயற்சியையும் கோரும் நிகழ்காலக் கட்டளையின் வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τὸ προφητεύειν
  choice: இறைவாக்குரைக்க
  rationale: இறைவனிடமிருந்து பெற்ற செய்தியை உரைத்தல் என்ற சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது; பெயர்ச்சொல் வடிவத்தைவிட வினையெச்ச வடிவம் தமிழில் இயல்பாக உள்ளது.
- source_word: μὴ κωλύετε
  choice: தடைசெய்யாதீர்கள்
  rationale: μή உடனான நிகழ்காலக் கட்டளையின் நேரடியான தடையைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: பல்வேறு மொழிகளில் பேசுவதை
  rationale: γλώσσαις என்பதன் பன்மையை வெளிப்படுத்தி, இவ்வதிகாரத்தில் விவாதிக்கப்படும் மொழிப்பேச்சை இயல்பான தமிழில் குறிக்கிறது; அதன் துல்லிய இயல்பை உரை தேவையின்றி தீர்மானிப்பதில்லை.
theological_decisions:
- issue: கலப்பு பாலினச் சபையை நோக்கிய ἀδελφοί என்ற விளியின் மொழிபெயர்ப்பு
  choice: என் சகோதரர்களே
  alternative: என் சகோதர சகோதரிகளே
  rationale: கிரேக்கத்தில் உள்ள ஆண்பால் வடிவத்தை முதன்மை உரை பாதுகாக்கிறது; அது முழுச் சபையையும் உள்ளடக்கி அழைக்கக்கூடும் என்ற சூழல்சார் வாய்ப்பு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: γλώσσαις என்பதன் பொருள்
  choice: பல்வேறு மொழிகளில்
  alternative: அந்நிய பாஷைகளில் / நாவுகளால்
  rationale: γλῶσσα என்பது நாவையோ மொழியையோ குறிக்கலாம்; இங்கு ‘பேசுதல்’ உடன் பன்மையில் வருவதால் மொழிப்பேச்சு என்ற பொருள் இயல்பானது. ‘பல்வேறு’ என்பது பன்மையைத் தெளிவாக்குகிறது; அவை மனித மொழிகளா அல்லது வேறு வகையா என்பதை மொழிபெயர்ப்பு முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு விளங்கும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்குரைக்க’ என்பது திருச்சபைச் சூழலுக்குரிய பொருளைத் துல்லியமாகவும் சுருக்கமாகவும் தருகிறது; ‘பாஷை’ போன்ற பழைய அல்லது குழுசார் சொல்லாட்சி தவிர்க்கப்பட்டுள்ளது.
