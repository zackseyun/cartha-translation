id: 1CO.14.37
reference: 1 Corinthians 14:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: ta
  text: தன்னைத் தீர்க்கதரிசி என்றோ ஆவிக்குரியவன் என்றோ ஒருவன் எண்ணினால், நான் உங்களுக்கு எழுதுகிறவை கர்த்தருடையவை[a] என்பதை அவன் உணர்ந்துகொள்ளட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களுக்கு எழுதுகிறவை கர்த்தரின் கட்டளை.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “கர்த்தருடையது/கர்த்தருடையவை” என்று உள்ளது; “கட்டளை” என்பது சூழலிலிருந்து விளக்கமாகக் கொள்ளப்படுகிறது.
    reason: மூலக் கிரேக்கத்தின் சுருக்கமான உடைமை வேற்றுமை அமைப்பையும், சூழலுக்கு ஏற்ற விளக்கமான மாற்று வாசிப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: δοκεῖ
  choice: எண்ணினால்
  rationale: இங்கு இந்தச் சொல் ஒருவன் தன்னைப் பற்றிக் கொண்டிருக்கும் எண்ணத்தையோ உரிமைகோரலையோ குறிக்கிறது. ‘எண்ணினால்’ என்பது பவுலின் திருத்தும் தொனியையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: προφήτης
  choice: தீர்க்கதரிசி
  rationale: ஆவிக்குரிய வரங்களும் தீர்க்கதரிசனப் பேச்சும் பற்றிய சூழலில், இது வழக்கமானதும் தெளிவானதும் ஆன தமிழ் இணைச்சொல்.
- source_word: πνευματικός
  choice: ஆவிக்குரியவன்
  rationale: ஆவியால் வரம்பெற்றவர் அல்லது ஆவியால் வழிநடத்தப்படுபவர் என்ற பரந்த பொருளை, கிரேக்கச் சொல்லைப் போலவே முழுமையாகத் தீர்மானிக்காமல் காக்கிறது.
- source_word: ἐπιγινωσκέτω
  choice: உணர்ந்துகொள்ளட்டும்
  rationale: கட்டளையின் வடிவத்தையும், பவுல் எழுதுவதன் அதிகாரத்தை அறிந்து ஏற்றுக்கொள்ள வேண்டிய கருத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἃ γράφω ὑμῖν
  choice: நான் உங்களுக்கு எழுதுகிறவை
  rationale: உறவுப்பெயரையும் நிகழ்கால வினையையும் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: κυρίου ἐστίν
  choice: கர்த்தருடையவை
  rationale: கிரேக்கத்தின் சுருக்கமான உடைமை வேற்றுமை அமைப்பை நேரடியாகக் காத்து, ‘கர்த்தரிடமிருந்து வந்தவை,’ ‘கர்த்தருக்குரியவை,’ அல்லது ‘கர்த்தரின் கட்டளை’ என்ற சூழல்சார் நுணுக்கங்களை முதன்மை உரையில் ஒன்றாக மட்டுப்படுத்தவில்லை.
theological_decisions:
- issue: κυρίου ἐστίν என்பதன் சுருக்கமான, தெளிவுபடுத்தப்படாத பொருள்
  choice: கர்த்தருடையவை
  alternative: கர்த்தரின் கட்டளை
  rationale: மூலத்தில் ‘கட்டளை’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லை. சூழல் கர்த்தரின் அதிகாரமுள்ள கட்டளையைக் குறிக்கலாம்; எனினும் ‘கர்த்தருடையவை’ என்பது மூலத்தின் உண்மையான சுருக்கத்தையும் பொருள் நெகிழ்வையும் காக்கிறது. விளக்கமான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τις ... προφήτης ... πνευματικός என்பவற்றின் பாலின வடிவம்
  choice: ஒருவன் ... அவன்
  alternative: ஒருவர் ... அவர்
  rationale: கிரேக்க உரை இலக்கண ரீதியாக ஆண்பால் ஒருமையில் இருப்பதால் அதைத் தமிழிலும் காக்கிறது; அதேவேளையில் நிபந்தனை அமைப்பு எந்தத் தனிநபரின் உரிமைகோரலையும் பொதுவாகச் சுட்டுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைப் பயன்படுத்துகிறது. ‘தீர்க்கதரிசி,’ ‘ஆவிக்குரியவன்,’ ‘கர்த்தர்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன. மூலத்தின் இறையியல் நெருக்கடியைத் தீர்த்துவிடாமல் ‘கர்த்தருடையவை’ என முதன்மை உரை அமைக்கப்பட்டுள்ளது.
