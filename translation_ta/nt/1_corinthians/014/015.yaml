id: 1CO.14.15
reference: 1 Corinthians 14:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: ta
  text: அப்படியானால், என்ன செய்வது? ஆவியோடு ஜெபிப்பேன்[a]; மனத்தோடும் ஜெபிப்பேன். ஆவியோடு துதிப் பாடல் பாடுவேன்[b]; மனத்தோடும் துதிப் பாடல் பாடுவேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆவியில்’ அல்லது ‘ஆவியால்’ என்றும் மொழிபெயர்க்கலாம். இங்கு ‘ஆவி’ என்பது குறிப்பாகப் பரிசுத்த ஆவியையா, பேசுகிறவரின் மனித ஆவியையா, அல்லது ஆவிக்குரிய வெளிப்பாட்டையா குறிக்கிறது என்பதை கிரேக்க உரை வெளிப்படையாகச் சொல்லவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘பாடுவேன்’ அல்லது ‘இசைப்பேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘மனத்தோடு’ என்பதற்கு ‘புரிந்துணர்வோடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: அப்படியானால், என்ன செய்வது?
  rationale: வாதத்தின் நடைமுறை முடிவு என்ன என்று கேட்கும் கிரேக்கச் சொல்லாட்சியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: προσεύξομαι
  choice: ஜெபிப்பேன்
  rationale: எதிர்கால வடிவத்தின் பொருளை நேரடியாகவும் வழிபாட்டுச் சூழலுக்கு இயல்பாகவும் தருகிறது.
- source_word: τῷ πνεύματι
  choice: ஆவியோடு
  rationale: வேற்றுமை உருபின் உடனிகழ்ச்சி அல்லது கருவிப் பொருளைத் தக்கவைத்து, இது பரிசுத்த ஆவியையா மனித ஆவியையா குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: τῷ νοΐ
  choice: மனத்தோடு
  rationale: புரிந்துகொள்ளும் அல்லது உணர்வுடன் சிந்திக்கும் திறனைக் குறிக்கும் νοῦς என்பதையும் πνεύμα என்பதுடனான இணை அமைப்பையும் காக்கிறது.
- source_word: ψαλῶ
  choice: துதிப் பாடல் பாடுவேன்
  rationale: இச்சூழலில் வழிபாட்டுக்குரிய பாடுதலைத் தெளிவாகக் காட்டுகிறது; வெறும் ‘பாடுவேன்’ என்பதைவிட ψάλλω என்பதின் துதிப் பொருளை வெளிப்படுத்துகிறது.
- source_word: δὲ καὶ
  choice: -த்தோடும்
  rationale: முதல் செயலுக்கு மாறாக அதனுடன் இரண்டாவதையும் சேர்க்கும் மென்மையான எதிரிணைவு மற்றும் கூடுதல் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: πνεῦμα என்பது ஆவி–மனம் என்ற எதிரிணைவில் யாரை அல்லது எதைச் சுட்டுகிறது?
  choice: முதன்மை உரையில் பொதுவாக ‘ஆவி’ என்று வழங்குதல்
  alternative: ‘பரிசுத்த ஆவி’ அல்லது ‘என் ஆவி’ என்று குறிப்பாக்குதல்
  rationale: இச்சொல் பரிசுத்த ஆவியையா, பேசுகிறவரின் மனித ஆவியையா, அல்லது ஆவிக்குரிய வெளிப்பாட்டையா குறிக்கிறது என்பதை கிரேக்க உரை வெளிப்படையாகத் தீர்மானிக்கவில்லை; ஆகவே இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ். ‘ஆவியோடு/மனத்தோடு’ என்ற இணை அமைப்பு மூலத்தின் சமச்சீரைத் தக்கவைக்கிறது; ‘ஜெபம்’ மற்றும் ‘துதிப் பாடல்’ வழிபாட்டுச் சூழலில் பரவலாகப் புரியக்கூடிய சொற்கள்.
