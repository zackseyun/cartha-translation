id: 1CO.14.12
reference: 1 Corinthians 14:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: ta
  text: அவ்வாறே நீங்களும், ஆவிக்குரிய வரங்களில்[a] ஆர்வமுள்ளவர்களாய் இருப்பதால், சபையைக் கட்டியெழுப்புவதற்காக மிகுதியாகப் பெருக நாடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொற்படி, “ஆவிகளின்” அல்லது “ஆவிக்குரியவற்றின்”; சூழல் ஆவிக்குரிய வரங்களையோ ஆவியின் வெளிப்பாடுகளையோ சுட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: அவ்வாறே நீங்களும்
  rationale: முந்தைய வசனங்களில் உள்ள ஒப்புமையைத் தொடர்ந்து, இதன் தொடர்பையும் முடிவுரைக்கும் தன்மையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐπεὶ
  choice: இருப்பதால்
  rationale: அடுத்து வரும் அறிவுறுத்தலுக்கான காரணத்தைச் சுட்டும் கிரேக்கச் சொல்லின் காரணப் பொருளைப் பாதுகாக்கிறது.
- source_word: ζηλωταί ἐστε
  choice: ஆர்வமுள்ளவர்களாய் இருப்பதால்
  rationale: ζηλωταί என்பதிலுள்ள தீவிர விருப்பத்தையும் ஆர்வத்தையும், எதிர்மறையான வெறியுணர்வை ஏற்படுத்தாமல் நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πνευμάτων
  choice: ஆவிக்குரிய வரங்களைப் பெற
  rationale: இது சொற்படி ‘ஆவிகளுக்காக’ அல்லது ‘ஆவிக்குரியவற்றுக்காக’ என்று சுருக்கமாக உள்ளது. 1 கொரிந்தியர் 12–14 அதிகாரங்களின் சூழலில் ஆவியின் வெளிப்பாடுகள் அல்லது வரங்களே குறிக்கப்படுவதால், முதன்மை உரையில் இயல்பாகத் தெளிவுபடுத்தப்பட்டுள்ளது; மூலத்தின் ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: திருச்சபையை வளர்த்தெடுப்பதற்காக
  rationale: οἰκοδομή என்பதன் கட்டியெழுப்புதல் என்ற உருவகத்தையும், சமூகத்தை வலுப்படுத்தும் பொருளையும் எளிய, மரியாதையான தமிழில் தருகிறது.
- source_word: ζητεῖτε
  choice: முயலுங்கள்
  rationale: நோக்கத்துடன் நாடி முயற்சி செய்யும்படியான கட்டளையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα περισσεύητε
  choice: அவற்றில் பெருக
  rationale: περισσεύω என்பதன் ‘மிகுதியாக இருத்தல்/பெருகுதல்’ என்ற வலிமையைப் பாதுகாக்கிறது. தமிழில் வாக்கியத் தொடர்புக்காக ‘அவற்றில்’ சேர்க்கப்பட்டாலும், அது முன் குறிப்பிடப்பட்ட ஆவிக்குரிய வரங்களையே சுட்டுகிறது.
theological_decisions:
- issue: πνευμάτων என்பதன் பொருள்
  choice: ஆவிக்குரிய வரங்கள்
  alternative: ஆவிக்குரியவை; ஆவிகள்
  rationale: அதிகாரங்களின் உடனடிச் சூழல் பரிசுத்த ஆவியின் வெளிப்பாடுகளையும் வரங்களையும், குறிப்பாக சபையின் வளர்ச்சிக்கான அவற்றின் பயன்பாட்டையும் பற்றியது. எனினும் கிரேக்கப் பன்மைச் சொல் இதைவிடச் சுருக்கமாகவும் ambiguity உடையதாகவும் இருப்பதால் மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- issue: ἵνα περισσεύητε என்பதில் பெருகுவதற்கான வெளிப்படையான பொருள்
  choice: முன்னர் குறிப்பிடப்பட்ட ஆவிக்குரிய வரங்களில் பெருகுதல் என்று தமிழில் தொடர்புபடுத்தப்பட்டது
  alternative: எதில் பெருக வேண்டும் என்பதை வெளிப்படுத்தாமல் ‘பெருக முயலுங்கள்’ என்று விடுதல்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை. ஆனால் தமிழில் ‘அவற்றில்’ என்பது இயல்பான பின்னிணைப்பை உருவாக்குகிறது; இதை திருச்சபையின் வளர்ச்சிக்குச் சேவை செய்யும் வரங்களின் மிகுதியைக் குறிக்கும் சூழல்சார் விளக்கமாக மட்டுமே எடுத்துக்கொள்ள வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டது. ‘திருச்சபை’ என்பது ἐκκλησία-வுக்கான பரவலாக அறியப்பட்ட சொல்; ‘வளர்த்தெடுப்பது’ சமூகத்தை கட்டியெழுப்பும் பவுலின் உருவகத்தை இயல்பாக எடுத்துரைக்கிறது. அடிக்குறிப்பு குறியீடு சம்பந்தப்பட்ட ambiguity உடைய சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
