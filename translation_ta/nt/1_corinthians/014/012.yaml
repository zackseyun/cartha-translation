revisions:
- from: அவ்வாறே நீங்களும், ஆவிக்குரிய வரங்களைப் பெற ஆர்வமுள்ளவர்களாய் இருப்பதால்[a], திருச்சபையை வளர்த்தெடுப்பதற்காக அவற்றில் பெருக முயலுங்கள்.
  to: அவ்வாறே நீங்களும், ஆவிக்குரிய வரங்களில்[a] ஆர்வமுள்ளவர்களாய் இருப்பதால், சபையைக் கட்டியெழுப்புவதற்காக மிகுதியாகப் பெருக நாடுங்கள்.
  rationale: The revision removes the unsupported idea of receiving gifts and avoids explicitly stating an object for “abound.” It retains the contextual rendering “spiritual gifts” in the main text, while preserving the compressed Greek alternatives in an accurately worded footnote. “சபையைக் கட்டியெழுப்புதல்” more closely preserves Paul’s building-up metaphor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:08:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft appropriately takes πνευμάτων contextually as spiritual gifts, but it adds two elements not stated in Greek: “பெற” (receive) and “அவற்றில்” (in them). The latter is especially problematic because περισσεύητε has no explicit object; the purpose is explicitly the church’s building up.'
  naturalness: The existing Tamil is generally clear and modern, but “வரங்களைப் பெற ஆர்வமுள்ளவர்களாய்” narrows the sense to acquiring gifts. The revision uses the more direct and natural “வரங்களில் ஆர்வமுள்ளவர்களாய்.”
  terminology: “ஆவிக்குரிய வரங்கள்” and “சபை” are suitable contextual and modern-standard renderings. “கட்டியெழுப்புதல்” retains the οἰκοδομή metaphor more directly than “வளர்த்தெடுத்தல்.” The footnote is corrected so that it reflects the Greek genitive sense (“of”), not Tamil “க்காக” (“for”).
  issues:
  - severity: medium
    issue: “பெற” is added to πνευμάτων.
    rationale: ζηλωταί πνευμάτων means being zealous/eager regarding spiritual gifts (or spiritual things/spirits); it does not specifically say that they are eager to receive them.
  - severity: medium
    issue: “அவற்றில்” supplies an object for περισσεύητε.
    rationale: The Greek does not state what the readers are to abound in. The contextual association with gifts may be inferred, but should not be made explicit in the main text.
  - severity: low
    issue: The footnote renders Greek alternatives with “ஆவிகளுக்காக / ஆவிக்குரியவற்றுக்காக.”
    rationale: The Greek expression is genitive and is better represented in Tamil as “ஆவிகளின்” or “ஆவிக்குரியவற்றின்,” avoiding an unwarranted ‘for’ relation.
  revised_text: அவ்வாறே நீங்களும், ஆவிக்குரிய வரங்களில்[a] ஆர்வமுள்ளவர்களாய் இருப்பதால், சபையைக் கட்டியெழுப்புவதற்காக மிகுதியாகப் பெருக நாடுங்கள்.
  revised_footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொற்படி, “ஆவிகளின்” அல்லது “ஆவிக்குரியவற்றின்”; சூழல் ஆவிக்குரிய வரங்களையோ ஆவியின் வெளிப்பாடுகளையோ சுட்டுகிறது.
    reason: alternative_reading
  revision_rationale: The revision removes the unsupported idea of receiving gifts and avoids explicitly stating an object for “abound.” It retains the contextual rendering “spiritual gifts” in the main text, while preserving the compressed Greek alternatives in an accurately worded footnote. “சபையைக் கட்டியெழுப்புதல்” more closely preserves Paul’s building-up metaphor.
