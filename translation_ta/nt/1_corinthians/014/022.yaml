review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the inferential ὥστε, the contrast between γλῶσσαι and προφητεία, and the two groups addressed. It also appropriately leaves the nature of the ‘sign’ unspecified in the main text. A small revision makes the repeated dative relation explicit and avoids the somewhat imprecise ‘நம்புகிறவர்களுக்காக இருக்கிறது.’
  naturalness: ‘நாவுகளில் பேசுதல்’ is understandable and established in church usage, but ‘நாவுகளில் பேசுவது’ is more idiomatic as the subject of a Tamil clause. Recasting the second half as ‘நம்பாதவர்களுக்கானது அல்ல, நம்புகிறவர்களுக்கானது’ is concise, natural, and clearly preserves the Greek contrast.
  terminology: ‘நாவுகளில் பேசுவது’ retains the conventional ecclesial equivalent for γλῶσσαι without deciding whether the utterances are human languages or another kind of speech. ‘இறைவாக்குரைத்தல்’ is an appropriate rendering of προφητεία in this context and does not reduce it to prediction. ‘அடையாளம்’ correctly remains interpretively neutral.
  issues:
  - severity: low
    issue: The second clause says ‘நம்புகிறவர்களுக்காக இருக்கிறது.’
    rationale: This is intelligible, but ‘for believers’ can sound purposive in Tamil and does not mirror the concise parallelism of the Greek as well as ‘நம்புகிறவர்களுக்கானது.’
  - severity: low
    issue: The subject phrase ‘நாவுகளில் பேசுதல்’ is slightly less idiomatic than a verbal noun ending in ‘-வது.’
    rationale: ‘நாவுகளில் பேசுவது’ reads more naturally in modern standard Tamil while retaining the established terminology.
