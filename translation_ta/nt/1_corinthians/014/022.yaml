  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: ta
  text: ஆகவே, நாவுகளில் பேசுவது[a] நம்புகிறவர்களுக்கு அல்ல, நம்பாதவர்களுக்கான ஓர் அடையாளமாக இருக்கிறது; ஆனால் இறைவாக்குரைத்தல் நம்பாதவர்களுக்கானது அல்ல, நம்புகிறவர்களுக்கானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மொழிகளில் பேசுவது.” கிரேக்கச் சொல் மொழிகளைக் குறிக்கலாம்; ஆனால் 1 கொரிந்தியர் 12–14 அதிகாரங்களில், அது குறிக்கும் பேச்சின் துல்லிய இயல்பு விவாதத்திற்குரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: αἱ γλῶσσαι
  choice: நாவுகளில் பேசுதல்
  rationale: 1 கொரிந்தியர் 12–14 அதிகாரங்களில் காணப்படும் வரத்தை அல்லது நடைமுறையைச் சுட்டுகிறது; அது அறியப்பட்ட மனித மொழிகளா அல்லது வேறுவகை உரையாடலா என்ற விவாதத்தைத் தீர்மானிக்காமல் தமிழில் புரியும்படி தருகிறது.
- source_word: εἰς σημεῖόν
  choice: ஓர் அடையாளமாக
  rationale: εἰς என்பதன் நோக்கம் அல்லது விளைவு சார்ந்த வலிமையை இயல்பாகத் தருகிறது; அந்த அடையாளம் சாதகமானதா அல்லது நியாயத்தீர்ப்புக்குரியதா என்பதைச் சேர்த்துச் சொல்லவில்லை.
- source_word: τοῖς πιστεύουσιν
  choice: நம்புகிறவர்களுக்கு
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நிகழ்காலப் பங்கேற்புச் சொல்லின் செயற்பாட்டு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: τοῖς ἀπίστοις
  choice: நம்பாதவர்களுக்கு
  rationale: πιστεύουσιν என்பதற்கு எதிரான ἀπίστοις என்ற சொல்லை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἡ δὲ προφητεία
  choice: ஆனால் இறைவாக்குரைத்தல்
  rationale: δὲ காட்டும் முரண்பாட்டை ‘ஆனால்’ தெரிவிக்கிறது; προφητεία இங்கு குறிக்கும் வரம் அல்லது செயலை, எதிர்காலத்தை முன்னறிவித்தல் என்று மட்டும் சுருக்காமல் ‘இறைவாக்குரைத்தல்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: χαρίσμα சார்ந்த சூழலில் γλῶσσαι என்பதன் பொருள்
  choice: நாவுகளில் பேசுதல்
  alternative: மொழிகளில் பேசுதல்; பரவசப் பேச்சு
  rationale: பவுல் குறிப்பிடும் நிகழ்வின் துல்லிய இயல்பு குறித்து மாறுபட்ட புரிதல்கள் உள்ளன. மொழிபெயர்ப்பு எந்த ஒரு சமயக்குழுவின் விளக்கத்தையும் முடிவாக ஏற்காமல் கிரேக்கச் சொல்லின் ambiguity-ஐப் பாதுகாக்கிறது.
- issue: நம்பாதவர்களுக்கான σημεῖον என்பதன் தன்மை
  choice: ஓர் அடையாளம்
  alternative: உறுதிப்படுத்தும் அடையாளம்; நியாயத்தீர்ப்பின் அடையாளம்
  rationale: முந்தைய ஏசாயா மேற்கோளின் வெளிச்சத்தில் இதை நியாயத்தீர்ப்பின் அடையாளமாகச் சிலர் புரிந்துகொள்கிறார்கள்; ஆனால் கிரேக்க மூலவசனம் ‘அடையாளம்’ என்று மட்டுமே கூறுவதால் முதன்மை உரை அதன் தன்மையை நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நாவுகளில் பேசுதல்’ என்பது திருச்சபைச் சூழலில் அறியப்பட்ட சொல்லாட்சியைப் பேணுகிறது; ‘இறைவாக்குரைத்தல்’ என்பது வெறும் எதிர்கால முன்னறிவிப்பு என்ற குறுகிய பொருளைத் தவிர்த்து, இச்சூழலில் உள்ள வரம் அல்லது செயலைக் காட்டுகிறது.
