revisions:
- from: ஆகவே, நாவுகளில் பேசுதல்[a] நம்புகிறவர்களுக்கு அல்ல, நம்பாதவர்களுக்கு ஓர் அடையாளமாக[b] இருக்கிறது; ஆனால் இறைவாக்குரைத்தல் நம்பாதவர்களுக்கு அல்ல, நம்புகிறவர்களுக்காக இருக்கிறது.
