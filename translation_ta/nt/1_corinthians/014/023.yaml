source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: ta
  text: ஆகையால், முழுத் திருச்சபையும் ஒரே இடத்தில் கூடி, எல்லாரும் நாவுகளில் பேசினால்[a], அறிமுகமில்லாதவர்களோ[b] நம்பாதவர்களோ உள்ளே வந்தால், நீங்கள் பைத்தியமாக இருக்கிறீர்கள் என்று அவர்கள் சொல்லமாட்டார்களா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மொழிகளில் பேசினால்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ‘நாவுகள்’ அல்லது ‘மொழிகள்’ என்று பொருள்படலாம்; இங்கு அது எந்த வகையான பேச்சைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பு மட்டும் கொண்டு முடிவுசெய்யாமல் ‘நாவுகளில்’ என்று தரப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது ‘வெளியாட்களோ.’ இந்தச் சொல் திருச்சபைக் கூட்டத்தில் நடப்பவற்றைப் பற்றி அறிமுகமோ புரிதலோ இல்லாதவர்களைக் குறிக்கலாம்; இங்கே அவர்கள் ‘நம்பாதவர்கள்’ என்பவர்களிலிருந்து தனியே குறிப்பிடப்படுகிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἡ ἐκκλησία ὅλη
  choice: திருச்சபை முழுவதும்
  rationale: கிறிஸ்தவ விசுவாசிகளின் முழுக் கூட்டத்தையும் குறிக்கும் பவுலின் பயன்பாட்டையும் ὅλη என்பதன் முழுமை வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: συνέλθῃ ... ἐπὶ τὸ αὐτό
  choice: ஒரே இடத்தில் கூடி
  rationale: ஒன்றுகூடுவதையும் ஒரே இடத்தில் இருப்பதையும் குறிக்கும் கிரேக்கச் சொற்றொடரின் இடவுணர்வைக் காக்கிறது.
- source_word: λαλῶσιν γλώσσαις
  choice: நாவுகளால் பேசினால்
  rationale: γλῶσσαι என்பதன் ‘நாவுகள்/மொழிகள்’ என்ற இருபொருள் வாய்ப்பையும், 1 கொரிந்தியர் 12–14இல் பேசப்படும் சிறப்பான ஆவிக்குரிய நிகழ்வையும் ‘மொழிகள்’ என்று மட்டும் முடிவுசெய்யாமல் திறந்த நிலையில் வைக்கிறது.
- source_word: ἰδιῶται
  choice: இவற்றை அறிந்திராதவர்கள்
  rationale: கூட்டத்தில் நடைபெறும் நடைமுறை அல்லது நிகழ்வு குறித்து அறிமுகமோ அறிவோ இல்லாதவர்களைச் சுட்டுகிறது; அடுத்ததாக வரும் ‘நம்பாதவர்கள்’ என்பதோடு இதை ஒன்றாக்குவதில்லை.
- source_word: ἄπιστοι
  choice: நம்பாதவர்கள்
  rationale: விசுவாசம் இல்லாதவர்களை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: οὐκ ἐροῦσιν ὅτι μαίνεσθε
  choice: உங்களுக்குப் பைத்தியம் பிடித்திருக்கிறது என்று அவர்கள் சொல்லமாட்டார்களா?
  rationale: உறுதியான ஆம் பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வியையும், μαίνεσθε என்பதன் ‘மதி மயங்கியிருத்தல்’ என்ற வலுவான கருத்தையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: 1 கொரிந்தியர் 14இல் γλώσσαι என்பதன் இயல்பு
  choice: முதன்மை உரையில் ‘நாவுகளால்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: மொழிகளில்; அந்நிய மொழிகளில்
  rationale: கிரேக்கச் சொல் நாவுகளையோ மொழிகளையோ குறிக்கலாம். இங்கு அது விவாதிக்கப்படும் ஆவிக்குரிய பேச்சு நிகழ்வுக்கான அடையாளச் சொல்லாக உள்ளது. ‘அந்நிய மொழிகள்’ என்பது அவை கட்டாயம் மனித மொழிகளே என்று தேவையின்றி முடிவுசெய்யக்கூடும்; ‘நாவுகளால்’ என்பது அந்த விளக்கத் திறந்தநிலையைக் காக்கிறது.
- issue: ἰδιῶται மற்றும் ἄπιστοι இடையிலான வேறுபாடு
  choice: ‘இவற்றை அறிந்திராதவர்கள்’ என்றும் ‘நம்பாதவர்கள்’ என்றும் தனித்தனியாக மொழிபெயர்க்கப்பட்டது.
  alternative: வெளியாட்கள் அல்லது நம்பாதவர்கள்
  rationale: இரு கிரேக்கச் சொற்களையும் ஒரே வகையினராகக் கலக்காமல், முதலாவது கூட்டத்தின் நடைமுறைகளை அறியாதவர்களையும் இரண்டாவது விசுவாசமில்லாதவர்களையும் குறிக்கக்கூடிய வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘திருச்சபை,’ ‘நம்பாதவர்கள்’ போன்ற பரவலாக அறியப்படும் சொற்கள் பயன்படுத்தப்பட்டன. γλώσσαι குறித்த விளக்கத் திறந்தநிலையைப் பாதுகாக்கும் பொருட்டு சற்றே முறையான ‘நாவுகளால்’ என்ற சொற்றொடர் அடிக்குறிப்புடன் வைக்கப்பட்டது.
