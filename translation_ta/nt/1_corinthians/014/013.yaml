translation:
  language: ta
  text: ஆகவே, ஒரு மொழியில்[a] பேசுகிறவர் தாம் விளக்கிச் சொல்லும்படி[b] ஜெபிக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல்லின் அடிப்படைப் பொருள் “நா.” இவ்வதிகாரத்தில், விளக்கம் தேவைப்படும் பேச்சைக் குறிக்க இந்தச் சொல் வழக்கமாகப் பயன்படுத்தப்படுகிறது. இதை “ஒரு நாவில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “அவர் விளக்கும்படி.” இங்குள்ள ஒருமை ஆண்பால் இலக்கண வடிவம், ஒரு மொழியில் பேசும் எவரையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
