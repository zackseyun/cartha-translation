- source_word: Διὸ
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து பெறப்படும் முடிவைச் சுட்டும் காரணவிளைவு இணைப்பாக இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ὁ λαλῶν
  choice: பேசுகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையின் பொதுப்படையான ஒருமையையும் தொடரும் செயல் நுணுக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: γλώσσῃ
  choice: ஒரு மொழியில்
  rationale: λαλέω என்பதுடன் வரும் ஒருமை வேற்றுமை வடிவத்தைத் தக்கவைக்கிறது. ‘மொழி’ என்பது நவீனத் தமிழில் இயல்பானது; இந்த அதிகாரத்தில் விளக்கம் தேவைப்படும் சிறப்புவகைப் பேச்சைக் குறிக்கும் தன்மையை அடிக்குறிப்பு காக்கிறது, அது மனித மொழியா வேறுவகைப் பேச்சா என்பதை முதன்மை உரை முன்கூட்டியே தீர்மானிக்கவில்லை.
- source_word: προσευχέσθω
  choice: ஜெபிக்கட்டும்
  rationale: மூன்றாம் நபர் நிகழ்காலக் கட்டளை வடிவத்தின் அறிவுறுத்தல் வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: ἵνα
  choice: -படி
  rationale: வேண்டுதலின் நோக்கம் அல்லது உள்ளடக்கம் என்ற இரு நுணுக்கங்களையும் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: διερμηνεύῃ
  choice: விளக்கிச் சொல்ல
  rationale: பேச்சை மற்றவர்கள் புரிந்துகொள்ளத்தக்கதாக உரைத்தல் என்பதே சூழலின் மையம். ‘மொழிபெயர்க்க’ என்பது பொருளை மிகக் குறுகலாக்கக்கூடும்; ‘விளக்கிச் சொல்ல’ என்பது இங்கு இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
theological_decisions:
- issue: γλώσσῃ என்பதன் பொருள்
  choice: ஒரு மொழியில்
  alternative: ஒரு நாவில் / வேற்றுமொழியில்
  rationale: கிரேக்கச் சொல் சொல்லுக்கு சொல் ‘நா’ என்றும், பயன்பாட்டில் ‘மொழி’ என்றும் பொருள்படும். ‘வேற்றுமொழி’ என்பது கண்டிப்பாக அறியப்பட்ட அந்நிய மனித மொழி என்ற முடிவைத் தூண்டலாம்; ‘ஒரு மொழியில்’ என்பதும் அடிக்குறிப்பும் சேர்ந்து இப்பகுதியின் தெளிவுபடுத்தல் தேவைப்படும் பேச்சையும் அதன் உண்மையான விளக்கத் திறப்பையும் காக்கின்றன.
- issue: விளக்குபவரின் அடையாளம்
  choice: தான் விளக்கிச் சொல்லும்படி
  alternative: யாராவது விளக்கிச் சொல்லும்படி
  rationale: கிரேக்க ஒருமை வினை வடிவத்தின் இயல்பான தொடர்பு மொழியில் பேசுகிற அதே நபரையே சுட்டுகிறது. ‘தான்’ இதை பாலின வேறுபாடின்றி இயல்பான தமிழில் காட்டுகிறது; வேறொருவர் விளக்க வேண்டும் என்ற கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளை வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபிக்கட்டும்’ என்பது தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்பட்டதும் கட்டளை நுணுக்கத்தைச் சுருக்கமாகக் காப்பதும் ஆகும். பாலினத்தைத் தேவையின்றி குறிப்பதைத் தவிர்க்க ‘பேசுகிறவர்’ மற்றும் ‘தான்’ பயன்படுத்தப்பட்டுள்ளன.
