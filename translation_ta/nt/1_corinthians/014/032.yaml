- from: தீர்க்கதரிசிகளின் ஆவிகள் தீர்க்கதரிசிகளுக்குக் கீழ்ப்படிகின்றன.[a]
  to: மேலும், தீர்க்கதரிசிகளின் ஆவிகள் தீர்க்கதரிசிகளுக்குக் கீழ்ப்பட்டிருக்கின்றன.[a]
