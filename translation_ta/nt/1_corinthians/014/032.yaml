  yaml_path: translation/nt/1_corinthians/014/032.yaml
  text: And the spirits of prophets are subject to prophets,[a]
translation:
  language: ta
  text: மேலும், தீர்க்கதரிசிகளின் ஆவிகள் தீர்க்கதரிசிகளுக்குக் கீழ்ப்பட்டிருக்கின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீர்க்கதரிசிகளுக்குரிய ஆவிகள் தீர்க்கதரிசிகளுக்குக் கீழ்ப்பட்டிருக்கின்றன.’ இச்சொற்றொடர் தீர்க்கதரிசிகளுடன் தொடர்புடைய ஆவிக்குரிய தூண்டுதலையோ செயல்பாட்டையோ குறிக்கலாம்; தீர்க்கதரிசனம் பேசுவதில் சுயக்கட்டுப்பாடு இருப்பதை இது வலியுறுத்துகிறது.
