lexical_decisions:
- source_word: καὶ
  choice: மேலும் (தமிழில் தனியே வெளிப்படுத்தப்படவில்லை)
  rationale: இது முந்தைய கூற்றுடன் இவ்வாக்கியத்தை இணைக்கும் சொல். தனி வசனமாக இயல்பான தமிழில் தொடக்க இணைப்புச்சொல் அவசியமில்லை; எனினும் அதன் தொடர்ச்சியான வாத ஓட்டம் சூழலில் நிலைக்கிறது.
- source_word: πνεύματα
  choice: ஆவிகள்
  rationale: மூலத்தின் பன்மையையும் அதன் உண்மையான பொருள் மயக்கத்தையும் காக்கிறது. இதை முதன்மை உரையிலேயே ‘தூண்டுதல்கள்’, ‘வாக்குகள்’ அல்லது ‘வரங்கள்’ என்று விளக்கிப் பெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: προφητῶν
  choice: தீர்க்கதரிசிகளின்
  rationale: பெயர்ச்சொல்லைச் சார்ந்த பன்மை உடைமை வேற்றுமையை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: προφήταις
  choice: தீர்க்கதரிசிகளுக்கு
  rationale: ὑποτάσσεται என்பதுடன் வரும் கீழ்ப்படிதலின் இலக்கைத் தெரிவிக்கிறது; ‘தீர்க்கதரிசிகளால்’ என்று கருவிப் பொருளாக்காமல் மூலத்தின் அமைப்பைக் காக்கிறது.
- source_word: ὑποτάσσεται
  choice: கீழ்ப்படிகின்றன
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் இருப்பதை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது. நடுநிலைப் பன்மை எழுவாயுடன் கிரேக்கத்தில் ஒருமை வினை வருவது வழக்கமானதால், தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ‘தீர்க்கதரிசிகளின் ஆவிகள்’ என்பதற்கும் தீர்க்கதரிசிகளின் கட்டுப்பாட்டிற்கும் உள்ள தொடர்பு
  choice: முதன்மை உரையில் ‘ஆவிகள்’ என்ற சொற்றொடரை அப்படியே வைத்துப், தீர்க்கதரிசனத்துடன் தொடர்புடைய ஆவிக்குரிய தூண்டுதல்கள் தீர்க்கதரிசிகளின் கட்டுப்பாட்டுக்கு அப்பாற்பட்டவை அல்ல என்ற சூழல் சார்ந்த பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: இது தீர்க்கதரிசிகளின் மனித ஆவிகள் மற்ற தீர்க்கதரிசிகளுக்குக் கீழ்ப்படிவதையோ, தீர்க்கதரிசனச் செய்திகளை மற்ற தீர்க்கதரிசிகள் மதிப்பிடுவதையோ குறிக்கலாம்
  rationale: கூடியிருக்கும் சபையில் ஒழுங்காகத் தீர்க்கதரிசனம் பேசுவது பற்றிய உடனடிச் சூழல் சுயக்கட்டுப்பாட்டை வலியுறுத்துகிறது. இருப்பினும், மூலச் சொற்றொடரின் பொருளை ஒரு குறிப்பிட்ட பின்னைய கோட்பாட்டுக்குள் சுருக்காமல் அதன் தெளிவின்மையை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சபை வாசிப்புக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தீர்க்கதரிசி’, ‘ஆவி’, ‘கீழ்ப்படிதல்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; விளக்கப் பொருள் முதன்மை உரைக்குள் திணிக்கப்படவில்லை.
