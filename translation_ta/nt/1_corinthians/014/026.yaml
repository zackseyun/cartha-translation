  terminology: “சகோதரர்களே” மற்றும் அதன் உள்ளடக்கப் பொருளை விளக்கும் அடிக்குறிப்பு பொருத்தமானவை. “சங்கீதம்,” “போதனை,” “வெளிப்பாடு” ஆகியன ஏற்றவை. γλῶσσαக்கு “நாவில் பேசுதல்” என்றும் ἑρμηνείαக்கு “விளக்கம்” என்றும் தருவது, நிகழ்வின் துல்லிய இயல்பைத் தீர்மானிக்காமல் சூழலுக்குரிய தொடர்பைத் தெளிவாக்குகிறது.
