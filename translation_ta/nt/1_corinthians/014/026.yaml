id: 1CO.14.26
reference: 1 Corinthians 14:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: ta
  text: அப்படியானால், சகோதரர்களே,[a] என்ன சொல்லலாம்? நீங்கள் ஒன்றுகூடும்போது, ஒவ்வொருவரிடமும் ஒரு சங்கீதம் இருக்கிறது, ஒரு போதனை இருக்கிறது, ஒரு வெளிப்பாடு இருக்கிறது, நாவில் பேசுதல் இருக்கிறது,[b] ஒரு விளக்கம் இருக்கிறது. எல்லாம் கட்டியெழுப்புதலுக்காக நடைபெறட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “சகோதரர்களே” என்பது ஆண்களையும் பெண்களையும் உள்ளடக்கிய சபையாரை பிரதிநிதித்துவமாகக் குறிப்பிடுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “மொழியில் பேசுதல்.” கிரேக்கச் சொல் நாவையோ மொழியையோ குறிக்கலாம்; இங்கு “நாவில் பேசுதல்” என்பது இந்த விவாதத்தில் பவுல் பயன்படுத்தும் சொல்லாட்சியைத் தக்கவைக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: அப்படியானால் என்ன சொல்லலாம்
  rationale: முந்தைய விவாதத்திலிருந்து நடைமுறை முடிவுக்கு நகர்த்தும் கிரேக்க வினாவின் சொல்லாட்சிச் செயல்பாட்டை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை அழைப்பைத் தக்கவைக்கிறது; கலந்த சபையாரை உள்ளடக்கி அழைக்கும் பிரதிநிதித்துவப் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὅταν συνέρχησθε
  choice: நீங்கள் ஒன்றுகூடும்போது
  rationale: சபையார் கூடிவரும் தொடர்ச்சியான சூழலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἕκαστος ... ἔχει
  choice: ஒவ்வொருவரிடமும் ... இருக்கிறது
  rationale: ஒவ்வொருவரின் பங்களிப்பையும் பகிர்ந்தளிக்கும் சொல்லின் வலிமையைப் பாதுகாத்து, தமிழில் இயல்பான உடைமைத் தொடராக அமைகிறது.
- source_word: ψαλμὸν
  choice: ஒரு சங்கீதம்
  rationale: பொதுவான ‘பாடல்’ என்பதைவிட கிரேக்கச் சொல்லின் குறிப்பிட்ட வழிபாட்டுப் பாடல் பொருளை நெருக்கமாகத் தக்கவைக்கிறது.
- source_word: διδαχὴν
  choice: ஒரு போதனை
  rationale: சபைக் கூடுகையில் வழங்கப்படும் கற்பித்தலைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ்ச் சொல்.
- source_word: ἀποκάλυψιν
  choice: ஒரு வெளிப்பாடு
  rationale: மறைந்திருந்த ஒன்று வெளிப்படுத்தப்படுதல் என்ற பொருளையும் பவுலின் சொற்பயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: γλῶσσαν
  choice: ஒரு நாவு
  rationale: ‘மொழி’ என்று தீர்மானிக்காமல், 1 கொரிந்தியர் 12–14 இல் விவாதிக்கப்படும் நிகழ்வின் தெளிவுபடுத்தப்படாத தன்மையையும் பவுலின் சொல்லாட்சியையும் காக்கிறது.
- source_word: ἑρμηνείαν
  choice: ஒரு விளக்கம்
  rationale: நாவில் பேசப்பட்டதைச் சபைக்கு விளங்கச் செய்யும் செயலை இயல்பான தமிழில் குறிக்கிறது; ‘மொழிபெயர்ப்பு’ என்று மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: எல்லாம் சபையின் வளர்ச்சிக்காக நடைபெறட்டும்
  rationale: οἰκοδομή என்பதன் கட்டியெழுப்புதல் உருவகத்தை, இங்கு நோக்கப்படும் சமூகமான சபையைத் தெளிவுபடுத்தி, புரிந்துகொள்ளத்தக்க தமிழில் வழங்குகிறது.
theological_decisions:
- issue: சபையாரை நோக்கிய பிரதிநிதித்துவ ஆண்பால் அழைப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று வைத்து, உள்ளடக்கும் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: கிரேக்கத்தின் இலக்கண வடிவத்தைப் பாதுகாக்கும்போதே, அந்த அழைப்பு ஆண்களையும் பெண்களையும் உள்ளடக்கிய சபையைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
- issue: இவ்வதிகாரத்தில் γλῶσσα என்பதன் பொருள்
  choice: ‘நாவு’
  alternative: ‘மொழி’
  rationale: இது அறியப்பட்ட மனித மொழியா, பரவசப் பேச்சா, அல்லது விரிவான வேறொரு வகையா என்பதை உரைக்கு அப்பால் தீர்மானிக்காமல், மூலத்தின் உண்மையான தெளிவின்மையைக் காக்கிறது.
- issue: οἰκοδομή என்பதன் இலக்கு
  choice: ‘சபையின் வளர்ச்சி’
  alternative: ‘கட்டியெழுப்புதல்’
  rationale: சூழலில் தனிநபர் அல்ல, கூடிவந்த சபை கட்டியெழுப்பப்படுவதே நோக்கம்; உருவகத்தின் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான சபைச் சொல்லாட்சி. பட்டியலின் மீளுரையை மூலத்தைப் போலவே வைத்துள்ளது; தொழில்நுட்பத் தெளிவின்மையைத் தீர்த்துவிடாமல் அடிக்குறிப்பில் மாற்று பொருள் தரப்பட்டுள்ளது.
