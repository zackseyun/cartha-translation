  to: அப்படியானால், சகோதரர்களே,[a] என்ன சொல்லலாம்? நீங்கள் ஒன்றுகூடும்போது, ஒவ்வொருவரிடமும் ஒரு சங்கீதம் இருக்கிறது, ஒரு போதனை இருக்கிறது, ஒரு வெளிப்பாடு இருக்கிறது, நாவில் பேசுதல் இருக்கிறது,[b] ஒரு விளக்கம் இருக்கிறது. எல்லாம் கட்டியெழுப்புதலுக்காக நடைபெறட்டும்.
  rationale: திருத்தம் γλῶσσαவைத் தமிழில் உடலுறுப்பாகப் புரிந்துகொள்ளும் இடரிலிருந்து காக்கிறது; அதேவேளை அது அறியப்பட்ட மனித மொழி அல்லது வேறு வகைப் பேச்சு என்று தீர்மானிக்கவில்லை. இறுதித் தொடரில் οἰκοδομήயின் கட்டியெழுப்புதல் உருவகம் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு அடையாளங்களும் உரையில் சரியான இடத்தில் உள்ளன.
