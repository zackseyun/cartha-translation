source:
  edition: SBLGNT
  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: ta
  text: ஏனெனில், உங்களிடையே பிரிவினைக் குழுக்களும்[a] இருக்க வேண்டியது அவசியம்; சோதனையில் தேறியவர்களும்[b] உங்களிடையே வெளிப்படும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிரிவுகள்,’ ‘தனிக் குழுக்கள்’ என்றும் மொழிபெயர்க்கலாம்; பிற்காலப் பயன்பாட்டில் ‘மதவிரோதக் கொள்கைகள்’ என்றும் பொருள்படும். இங்கு சபைக்குள் இருந்த பிரிவினைக் குழுக்களே பெரும்பாலும் குறிக்கப்படுகின்றன.
    reason: lexical_alternative
  - marker: b
    text: ‘அங்கீகரிக்கப்பட்டவர்கள்,’ ‘உண்மையானவர்கள்,’ அல்லது ‘சோதனையில் நிலைத்தவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: இருக்க வேண்டியது அவசியம்
  rationale: இது வலுவான அவசியத்தைத் தெரிவிக்கிறது; அந்த அவசியம் இறைத் திட்டத்தினாலா, நடைமுறைத் தவிர்க்கவியலாமையாலா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துடன் உள்ள விளக்கத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: καὶ αἱρέσεις
  choice: பிரிவினைக் குழுக்களும்
  rationale: இங்கு பிற்காலக் கோட்பாட்டுப் பொருளான ‘மதப்புரட்டுகள்’ என்பதைக் காட்டிலும், சபைக்குள் உருவாகும் எதிரெதிர் அணிகள் அல்லது குழுக்களே சூழலுக்குப் பொருந்துகின்றன. ‘உம்’ இரண்டாம் நிலைச் சேர்க்கையையும் காக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: சமூகத்திற்குள் நிகழ்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; வசனத்தின் இரு இடங்களிலும் மீளுரைக்கப்படுகிறது.
- source_word: ἵνα
  choice: அப்போதுதான்
  rationale: பிரிவினைக் குழுக்கள் இருப்பதற்கும் சோதனையில் தேறியவர்கள் வெளிப்படுவதற்கும் இடையிலான நோக்கம்/விளைவு உறவை இயல்பான தமிழில் காட்டுகிறது; இரண்டில் ஒன்றை மட்டும் கடுமையாகத் தீர்மானிக்கவில்லை.
- source_word: καὶ οἱ δόκιμοι
  choice: சோதனையில் தேறியவர்களும்
  rationale: δόκιμοι என்பதில் உள்ள சோதிக்கப்பட்டு உண்மையானவர்கள் அல்லது ஏற்கத்தக்கவர்கள் எனக் காணப்பட்டவர்கள் என்ற கருத்தைத் துல்லியமாகத் தெரிவிக்கிறது; καί என்பதற்கான ‘உம்’ என்பதையும் காக்கிறது.
- source_word: φανεροὶ γένωνται
  choice: வெளிப்படுவார்கள்
  rationale: முன்னர் தெளிவாக அறியப்படாதவர்கள் வெளிப்படையாகத் தெரியவரும் விளைவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: αἱρέσεις என்பதன் பொருள்
  choice: பிரிவினைக் குழுக்கள்
  alternative: பிரிவுகள்; தனிக் குழுக்கள்; பிற்காலப் பயன்பாட்டில் மதப்புரட்டுகள்
  rationale: உடனடிச் சூழல் கர்த்தருடைய இராப்போஜனத்தில் கொரிந்துச் சபைக்குள் இருந்த சமூகப் பிளவுகளைப் பற்றியது. ஆகவே பிற்காலக் கோட்பாட்டுச் சார்ந்த ‘மதப்புரட்டு’ என்ற கருத்தை வசனத்துக்குள் கொண்டு வராமல், உட்குழுப் பிரிவைக் குறிக்கும் சொல்லாட்சி தேர்ந்தெடுக்கப்பட்டது.
- issue: δεῖ என்பதிலுள்ள அவசியத்தின் தன்மை
  choice: அவசியத்தை வலுவாகக் கூறி, அதன் மூலத்தை விளக்காமல் விடுதல்
  alternative: இறைவனால் நிர்ணயிக்கப்பட்ட அவசியம்; நடைமுறையில் தவிர்க்க முடியாத நிலை
  rationale: கிரேக்க உரை அவசியத்தைக் கூறுகிறது; ஆனால் அது இறைநோக்கமா, மனிதச் சூழலில் தவிர்க்கவியலாததா, அல்லது இரண்டுமா என்பதை வெளிப்படையாக விளக்கவில்லை. அந்த இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ἵνα என்பதிலுள்ள நோக்கம் அல்லது விளைவு
  choice: அப்போதுதான்
  alternative: வெளிப்படும்படி; அதன் விளைவாக
  rationale: இணைப்பு நோக்கத்தையும் விளைவையும் சுட்டக்கூடியது. ‘அப்போதுதான்’ இயல்பான தமிழில் உறவைத் தெரிவிக்கிறது; கடுமையான காரணவியல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், சபை வாசிப்புக்கு ஏற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பிரிவினைக் குழுக்கள்’ என்பது அரசியல் கட்சிகள் என்ற தேவையற்ற எண்ணத்தைத் தவிர்த்தபடி உட்குழுப் பிளவைச் சுட்டுகிறது. வாக்கியத்தின் விளக்கத் தொடர்பும், இரு καί கூறுகளின் ‘உம்’ வலியுறுத்தலும் இயன்றவரை காக்கப்பட்டுள்ளன.
