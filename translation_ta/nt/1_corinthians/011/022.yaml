source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: ta
  text: ஏனெனில், உண்பதற்கும் குடிப்பதற்கும் உங்களுக்கு வீடுகள் இல்லையா? அல்லது கடவுளின் சபையை இகழ்ந்து, எதுவும் இல்லாதவர்களை அவமானப்படுத்துகிறீர்களா? உங்களிடம் நான் என்ன சொல்வது? உங்களைப் பாராட்டவா? இந்த விஷயத்தில் நான் உங்களைப் பாராட்டவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏழைகளை’ அல்லது ‘உணவு இல்லாதவர்களை’; கிரேக்கத்தில் நேரடியாக, ‘உடையாதவர்களை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: வீடுகள்
  rationale: தனிப்பட்ட இல்லங்களை, ஒன்றுகூடிய கடவுளின் சபையிலிருந்து வேறுபடுத்திக் காட்டும் பன்மை வடிவத்தைப் பேணுகிறது.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: உண்பதற்கும் குடிப்பதற்கும்
  rationale: பெயரெச்ச வினையெச்சங்களுடன் வரும் முன்னிடைச்சொல் குறிக்கும் நோக்கப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: கடவுளின் சபை
  rationale: இங்கு கடவுளுக்குரிய, ஒன்றுகூடிய விசுவாசிகளின் சமூகத்தைக் குறிக்கிறது; நிறுவன அமைப்பு என்ற பொருளைத் தேவையின்றி மிகைப்படுத்துவதில்லை.
- source_word: καταφρονεῖτε
  choice: இகழ்ந்து
  rationale: மதிப்பற்றதாகக் கருதி நடத்தும் கடுமையான கண்டனத் தொனியைச் சுருக்கமாகப் பேணுகிறது.
- source_word: καταισχύνετε
  choice: அவமானப்படுத்துகிறீர்களா
  rationale: பிறரை வெட்கத்திற்கும் அவமானத்திற்கும் உள்ளாக்குவதைக் குறிக்கும் வினையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: τοὺς μὴ ἔχοντας
  choice: எதுவும் இல்லாதவர்களை
  rationale: ‘இல்லாதவர்கள்’ என்ற கிரேக்கச் சொற்றொடரின் பொதுத்தன்மையைப் பேணுகிறது; ஏழைகள் அல்லது உணவில்லாதவர்கள் என்று முதன்மை உரையிலேயே பொருளைச் சுருக்கவில்லை.
- source_word: τί εἴπω ὑμῖν;
  choice: உங்களிடம் நான் என்ன சொல்வது?
  rationale: ஆலோசனைத் தன்மையுள்ள இறந்தகால துணைவினையின் சொல்லாற்றல் வினாவையும் பவுலின் திகைப்புக் கலந்த கண்டனத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: உங்களைப் பாராட்டவா?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் சொல்லாற்றல் வினாவின் நையாண்டித் தொனியைச் சுருக்கமாகப் பேணுகிறது.
- source_word: ἐν τούτῳ
  choice: இந்த விஷயத்தில்
  rationale: முன்பு விவாதிக்கப்பட்ட நடத்தையையே சுட்டுகிறது என்பதைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: οὐκ ἐπαινῶ
  choice: நான் உங்களைப் பாராட்டவில்லை
  rationale: முந்தைய வினாவில் வந்த அதே வேர்ச்சொல்லின் மறுமொழியை ‘பாராட்டு’ என்று மீண்டும் பயன்படுத்தி பவுலின் சொல்லாற்றல் அழுத்தத்தைப் பேணுகிறது.
theological_decisions:
- issue: ஆண்டவரின் இரவு உணவு சூழலில் ‘இல்லாதவர்கள்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘எதுவும் இல்லாதவர்கள்’ என்று பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஏழைகள்’ அல்லது ‘உணவு இல்லாதவர்கள்’
  rationale: உடனடிச் சூழல் பொருளாதார வசதி குறைந்த விசுவாசிகளை வலுவாகச் சுட்டினாலும், கிரேக்கச் சொற்றொடர் இதைவிடப் பொதுவானது. ஆகவே அதன் விரிவான பொருள் முதன்மை உரையில் பேணப்பட்டு, சூழல் தரும் குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. பவுலின் தொடர்ச்சியான சொல்லாற்றல் வினாக்களும் கூர்மையான கண்டனத் தொனியும் பேணப்பட்டுள்ளன.
