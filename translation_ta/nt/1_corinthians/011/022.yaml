    issue: The footnote gives ‘இல்லாதவர்களை’ as the literal Greek wording.
    rationale: In normal Tamil this can denote people who are absent, not ‘those who do not have.’ The Greek τοὺς μὴ ἔχοντας is substantival, ‘those not having’; the explanatory note should use a Tamil possessive expression that does not introduce the unrelated sense ‘absent.’
