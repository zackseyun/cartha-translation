revisions:
- from: 'அவ்வாறே, இரவு உணவுக்குப் பின்பு கிண்ணத்தையும் எடுத்து, அவர் கூறினார்: “இந்தக் கிண்ணமே என் இரத்தத்தில் உள்ள புதிய உடன்படிக்கை[a]. இதைக் குடிக்கும் போதெல்லாம்[b], என்னை நினைவுகூரும்படி இதைத் தொடர்ந்து செய்யுங்கள்.”'
  to: 'அவ்வாறே, இரவு உணவுக்குப் பின்பு கிண்ணத்தையும் எடுத்து, அவர் கூறினார்: “இந்தக் கிண்ணமே என் இரத்தத்தினாலான புதிய உடன்படிக்கை[a]. என்னை நினைவுகூரும்படி, இதைக் குடிக்கும் போதெல்லாம் இதைத் தொடர்ந்து செய்யுங்கள்.”'
  rationale: The revision corrects the Tamil expression for the covenant’s relation to Jesus’ blood, retaining the Greek statement’s theological openness while avoiding a spatial reading that the source does not intend. It also refines the footnote’s lexical explanation and preserves both original footnote anchors.
