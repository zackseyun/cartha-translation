reference: 1 Corinthians 11:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: ta
  text: 'அவ்வாறே, இரவு உணவுக்குப் பின்பு கிண்ணத்தையும் எடுத்து, அவர் கூறினார்: “இந்தக் கிண்ணமே என் இரத்தத்தினாலான புதிய உடன்படிக்கை[a]. என்னை நினைவுகூரும்படி, இதைக் குடிக்கும் போதெல்லாம் இதைத் தொடர்ந்து செய்யுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புதிய ஏற்பாடு’ என்றும் மொழிபெயர்க்கலாம். διαθήκη என்ற கிரேக்கச் சொல் ‘உடன்படிக்கை’ அல்லது ‘உயில்’ என்று பொருள்படலாம்; இங்கு வேதாகமப் பின்னணிக்கு ‘உடன்படிக்கை’ மிகவும் பொருத்தமானது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: அவ்வாறே … கிண்ணத்தையும்
  rationale: முந்தைய வசனத்தில் அப்பத்தைக் குறித்து செய்யப்பட்டதற்கும் இங்கு கிண்ணத்தைக் குறித்து செய்யப்படுவதற்கும் உள்ள ஒப்புமையை ὡσαύτως காட்டுகிறது; καί என்பதன் ‘கூட/உம்’ பொருள் ‘கிண்ணத்தையும்’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: τὸ ποτήριον
  choice: கிண்ணம்
  rationale: பொதுவாகப் புரியும் நேரடியான சொல். கிரேக்கத்தில் இல்லாத தனிப்பட்ட சடங்கு அல்லது திருச்சபைச் சொல்லாட்சியை இது புகுத்துவதில்லை.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: இரவு உணவுக்குப் பின்பு
  rationale: μετά உடன் வரும் வினையெச்ச அமைப்பு காலத்தைக் குறிக்கிறது—உணவருந்திய பின்பு. சூழலிலுள்ள உணவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λέγων
  choice: எடுத்து, அவர் கூறினார்
  rationale: λέγων நேரடியாக ‘கூறிக்கொண்டு/கூறி’ என்று பொருள்படும். முந்தைய இணையான செயலிலிருந்து புரிந்துகொள்ளப்படும் ‘எடுத்து’ என்பதைத் தமிழில் வாக்கியம் நிறைவாக அமைய வழங்குகிறது; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: ἡ καινὴ διαθήκη
  choice: புதிய உடன்படிக்கை
  rationale: எரேமியா 31 மற்றும் உடன்படிக்கையின் இரத்தம் பற்றிய வேதாகமப் பின்னணிக்கு ‘உடன்படிக்கை’ மிகப் பொருத்தமானது. ‘ஏற்பாடு’ என்ற மாற்றுச் சொல் இன்றைய வாசகருக்கு புதிய ஏற்பாட்டு நூற்பகுதியையே முதன்மையாக நினைவூட்டக்கூடும்.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: என் இரத்தத்தில் உள்ள
  rationale: ἐν என்பதன் ‘இல்’ வடிவத்தைத் தக்கவைத்து, ‘என் இரத்தத்தால் உறுதிப்படுத்தப்பட்ட’ போன்ற விளக்கத்தை மூலவாக்கியத்தில் சேர்க்காமல் விடுகிறது.
- source_word: τοῦτο ποιεῖτε
  choice: இதைத் தொடர்ந்து செய்யுங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவமும் அடுத்து வரும் ‘போதெல்லாம்’ என்ற தொடரும் மீண்டும் மீண்டும் கடைப்பிடிக்கப்படும் செயலைச் சுட்டுகின்றன.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: இதைக் குடிக்கும் போதெல்லாம்
  rationale: ஒவ்வொரு மீளும் சந்தர்ப்பத்தையும் குறிக்கும் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘இதை’ என்பது முன் குறிப்பிடப்பட்ட கிண்ணத்தைச் சார்ந்த மறைபொருளைத் தெளிவாக்குகிறது.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: என்னை நினைவுகூரும்படி
  rationale: ἀνάμνησις நினைவுகூரும் அல்லது நினைவாக அனுசரிக்கும் செயலைக் குறிக்கிறது. தமிழில் நோக்கத்தையும் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: திருவிருந்துச் சூழலில் διαθήκη என்பதன் பொருள்
  choice: உடன்படிக்கை
  alternative: ஏற்பாடு / உயில்
  rationale: பழைய ஏற்பாட்டின் உடன்படிக்கைப் பின்னணியும் இரத்தத்தோடு அதன் தொடர்பும் ‘உடன்படிக்கை’ என்பதையே வலுப்படுத்துகின்றன; எனினும் அந்தக் கிரேக்கச் சொல்லின் விரிந்த பொருளை அடிக்குறிப்பு குறிப்பிடுகிறது.
- issue: கிண்ணத்துக்கும் புதிய உடன்படிக்கைக்கும் இடையிலான தொடர்பு
  choice: “இந்தக் கிண்ணமே … புதிய உடன்படிக்கை” என்ற நேரடி அடையாளப்படுத்தலைத் தக்கவைத்தல்
  alternative: “இந்தக் கிண்ணம் புதிய உடன்படிக்கையை அடையாளப்படுத்துகிறது” அல்லது “இரத்தத்தால் உறுதிப்படுத்தப்பட்ட உடன்படிக்கை”
  rationale: கிரேக்க வாக்கியம் நேரடியாக ‘இருக்கிறது’ என்று கூறுகிறது. அதை வெறும் அடையாளம் என்றோ, சடங்கியல் இருப்பு என்றோ தீர்மானிக்காமல் மூலத்தின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, பொதுவாகப் புரியும், அதேவேளை கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கிண்ணம்’, ‘உடன்படிக்கை’, ‘நினைவுகூருதல்’ ஆகிய சொற்கள் தேவையற்ற சடங்கு சார்ந்த சொல்லாட்சியின்றி மூலத்தின் வேதாகமத் தொனியைத் தக்கவைக்கின்றன.
