  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: ta
  text: ஏனெனில், உண்ணும்போது ஒவ்வொருவரும் தமது சொந்த உணவை முன்கூட்டியே எடுத்துக்கொள்கிறார்கள்[a]; ஒருவரோ பசியோடு இருக்கிறார், மற்றொருவரோ குடிவெறி அடைகிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது சொந்த உணவை மற்றவர்களுக்கு முன்பே எடுத்துக்கொள்கிறார்கள்.” கிரேக்க வினை ஒன்றை முன்கூட்டியே எடுத்துக்கொள்வதையோ, மற்றவர்களுக்காகக் காத்திருக்காமல் முன்னேறுவதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒருவர் பசியோடு இருக்கிறார்; மற்றொருவரோ போதையில் இருக்கிறார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: பகிர்ந்துண்ண வேண்டிய கூட்டத்தில் தனித்தனி நபர்களின் செயலை வலியுறுத்தும் பகிர்வுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கண்டனத்திற்கான காரணத்தை இவ்வசனம் விளக்குவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὸ ἴδιον δεῖπνον
  choice: தமது சொந்த உணவை
  rationale: ἴδιον என்பதன் தனியுடைமை வலியுறுத்தலைப் பாதுகாக்கிறது; δεῖπνον என்பதை இச்சூழலில் இயல்பான பொதுச் சொல்லான ‘உணவு’ என்று மொழிபெயர்க்கிறது.
- source_word: προλαμβάνει
  choice: மற்றவர்களுக்காகக் காத்திராமல் ... முந்திக்கொண்டு உண்கிறார்கள்
  rationale: முன்னதாக எடுத்துக்கொள்வது அல்லது பிறருக்காகக் காத்திராமல் தொடர்வது என்ற வினையின் சூழல்சார் இரு நுணுக்கங்களையும் தெளிவான தமிழில் வெளிப்படுத்துகிறது; மாற்று வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν τῷ φαγεῖν
  choice: உண்ணும்போது
  rationale: ἐν உடன் வரும் பெயராக்கப்பட்ட வினையெச்சத்தின் காலப்பொருளை விளக்க விரிவாக்கமின்றி இயல்பாகத் தருகிறது.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: ஒருவர் ... மற்றொருவரோ
  rationale: இரு வேறுபட்ட விளைவுகளை இயல்பான தமிழ் இணைமுரண் அமைப்பில் காட்டுகிறது.
- source_word: πεινᾷ
  choice: பசியோடிருக்கிறார்
  rationale: பசியான நிலையில் இருப்பதை நேரடியாகக் குறிக்கிறது; காரணத்தை மேலதிகமாக ஊகிப்பதில்லை.
- source_word: μεθύει
  choice: குடிவெறி அடைகிறார்
  rationale: மது அருந்தி போதையடையும் உண்மையான நிலையை மென்மைப்படுத்தாமல், தற்கால மரியாதையான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பகிர்ந்துண்ணும் நிகழ்வில் தனிப்பட்ட உணவு
  choice: தமது சொந்த உணவை
  alternative: தனக்குரிய இரவு உணவை
  rationale: உரை தனியுடைமைக்கும் பகிராமைக்கும் இடையிலான முரண்பாட்டை வலியுறுத்துகிறது. ‘தமது’ என்பது தமிழில் ஒருமைப் பகிர்வுப் பொருளுடன் இயல்பாக இருந்து தேவையற்ற பாலினக் குறியீட்டைத் தவிர்க்கிறது.
- issue: கர்த்தருடைய இராப்போஜனத்தில் நிகழ்ந்த தவறின் தன்மை
  choice: குடிவெறி அடைகிறார்
  alternative: போதையில் இருக்கிறார்
  rationale: μεθύει உண்மையான மதுபோதையைக் குறிக்கிறது; அதை வெறும் அளவுக்கு மீறிய உணவுண்டல் என்று மென்மைப்படுத்தவில்லை. அதேவேளை செயல் நிகழ்வா அல்லது விளைவு நிலையா என்ற நுண்ணிய வேறுபாட்டை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘உண்ணும்போது’ மூலத்தின் கால அமைப்பைச் சுருக்கமாகப் பாதுகாக்கிறது. ‘மற்றவர்களுக்காகக் காத்திராமல்’ என்பது προλαμβάνει என்பதன் சூழல்சார் நுணுக்கத்தை வெளிப்படுத்துகிறது; அதன் உண்மையான lexical ambiguity அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
