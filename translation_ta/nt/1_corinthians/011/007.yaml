  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: ta
  text: ஏனெனில், ஆண் கடவுளின் சாயலும் மகிமையும் ஆக இருப்பதால், தன் தலையை மூடிக்கொள்ள வேண்டியதில்லை[b]; பெண்ணோ ஆணின் மகிமையாக இருக்கிறாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனத்தில் ‘ஆண் / பெண்’ என்பதற்குப் பதிலாக ‘கணவன் / மனைவி’ என்றும் மொழிபெயர்க்கலாம்; ἀνήρ, γυνή என்ற கிரேக்கச் சொற்கள் சூழலைப் பொறுத்து இரு பொருள்களையும் தரக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘தன் தலைக்கு முக்காடிட்டுக்கொள்ள’; கிரேக்கச் சொல் இன்னும் பொதுவாக ‘தலையை மூடிக்கொள்ள’ என்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ / ἡ γυνὴ / ἀνδρός
  choice: ஆண் / பெண் / ஆணின்
  rationale: இச்சூழலில் இச்சொற்கள் வழிபாடு மற்றும் படைப்பைச் சார்ந்த ஆண்–பெண் வேறுபாட்டைக் குறிக்கின்றன. ‘கணவன் / மனைவி’ என்பதும் சொற்பொருளளவில் சாத்தியம் என்பதால் அதை அடிக்குறிப்பில் தருகிறோம்.
- source_word: ὀφείλει
  choice: கூடாது
  rationale: இங்கு உள்ள ஒழுக்கநெறி சார்ந்த கடப்பாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெறும் ‘தேவையில்லை’ என்ற பலவீனமான பொருளைத் தவிர்க்கிறது.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: தன் தலையை மூடிக்கொள்ள
  rationale: மூடுதலின் குறிப்பிட்ட வடிவத்தைத் தீர்மானிக்காமல் கிரேக்கத்தின் பொதுவான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: εἰκὼν
  choice: சாயல்
  rationale: படைப்பைப் பற்றிய ஆதியாகம மொழியை நினைவூட்டும் வகையில் εἰκών என்பதன் வழக்கமான வேதாகமப் பொருளைப் பாதுகாக்கிறது.
- source_word: δόξα
  choice: மகிமை
  rationale: இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி, δόξα என்பதன் இறையியல் மற்றும் உறவுசார் செறிவைப் பாதுகாக்கிறது.
- source_word: ὑπάρχων
  choice: அவன் ... இருக்கிறான்
  rationale: முந்தைய கூற்றுக்கான காரணத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘ஏனெனில்’ அந்தக் காரணத் தொடர்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ἀνήρ/γυνή என்பவற்றை கணவன்/மனைவி என்றா, ஆண்/பெண் என்றா மொழிபெயர்ப்பது
  choice: ஆண்/பெண்
  alternative: கணவன்/மனைவி
  rationale: உடனடிச் சூழல் தலை மூடுதல் மற்றும் படைப்புத் தொடர்பான இறையியல் அடிப்படையில் ஆணையும் பெண்ணையும் எதிரிணையாகக் காட்டுகிறது. இருப்பினும் மணவுறவுப் பொருள் மொழியியல்படி சாத்தியமுள்ளதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘பெண் ஆணின் மகிமை’ என்ற சமச்சீரற்ற கூற்றை மென்மையாக்குவதா
  choice: பெண்ணோ ஆணின் மகிமையாக இருக்கிறாள்
  alternative: பெண் ஆணின் மகிமையைப் பிரதிபலிக்கிறாள்
  rationale: ἐστιν என்ற நேரடிக் கூற்றையும் δόξα என்ற சொல்லையும் விளக்கமாக மாற்றாமல் அப்படியே பாதுகாத்து, வசனத்தின் இறையியல் பதற்றத்தைத் தீர்த்து வைக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பெண்ணோ’ என்பது μὲν…δὲ எதிரிணையை இயல்பாகக் காட்டுகிறது. இறையியல் கூற்று மென்மையாக்கப்படவில்லை; மூடுதலின் வடிவமும் தேவையின்றி குறிப்பாக்கப்படவில்லை.
