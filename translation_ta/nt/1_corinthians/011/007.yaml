revisions:
- from: ஏனெனில், ஆண்[a] தன் தலையை மூடிக்கொள்ளக் கூடாது[b]; அவன் கடவுளின் சாயலாகவும் மகிமையாகவும் இருக்கிறான். பெண்ணோ ஆணின் மகிமையாக இருக்கிறாள்.
  to: ஏனெனில், ஆண் கடவுளின் சாயலும் மகிமையும் ஆக இருப்பதால், தன் தலையை மூடிக்கொள்ள வேண்டியதில்லை[b]; பெண்ணோ ஆணின் மகிமையாக இருக்கிறாள்.[a]
  rationale: ‘கூடாது’ என்பதற்குப் பதிலாக ‘வேண்டியதில்லை’ பயன்படுத்தப்பட்டுள்ளது; இது οὐκ ὀφείλει என்பதன் ஒழுக்கநெறிசார் பொருத்தம்/கடப்பாட்டு மறுப்பைத் துல்லியமாகத் தருகிறது. ‘ஆண் கடவுளின் சாயலும் மகிமையும் ஆக இருப்பதால்’ என்ற அமைப்பு ὑπάρχων-ன் காரணத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது. ‘பெண்ணோ ஆணின் மகிமையாக இருக்கிறாள்’ என்ற நேரடி கூற்று மாற்றமின்றி வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடுகள் அவை சுட்டும் சொற்களோடு பொருந்துமாறு இடமாற்றப்பட்டுள்ளன.
