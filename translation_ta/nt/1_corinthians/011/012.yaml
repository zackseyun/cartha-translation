id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: ta
  text: ஏனெனில், பெண் ஆணிலிருந்து வந்ததுபோலவே,[a] ஆணும் பெண்ணின் வழியாகப் பிறக்கிறான்; ஆனால் அனைத்தும் கடவுளிடமிருந்தே உண்டாகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இச்சூழலைப் பொதுவான ஆண்–பெண் உறவாக அல்லாமல், குறிப்பாகத் திருமண உறவாக எடுத்துக்கொண்டால், ‘மனைவி கணவனிலிருந்து வந்ததுபோலவே, கணவனும் மனைவியின் வழியாகப் பிறக்கிறான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ஏனெனில், ... போலவே
  rationale: γάρ முந்தைய வாதத்துடனான காரணத் தொடர்பையும், ὥσπερ ஒப்புமையையும் குறிக்கிறது; தமிழ் வாக்கிய அமைப்பில் இரண்டையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἡ γυνή
  choice: பெண்
  rationale: γυνή என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். படைப்பு மற்றும் மனிதப் பிறப்பு சார்ந்த விரிந்த சூழலில் பொதுவான ‘பெண்’ என்பது பொருத்தமானது.
- source_word: ἐκ τοῦ ἀνδρός
  choice: ஆணிலிருந்து
  rationale: ἐκ தோற்றுவாயை அல்லது மூலத்தைச் சுட்டுகிறது. இது பெண் ஆணிலிருந்து எடுக்கப்பட்ட படைப்பு நிகழ்வை நினைவூட்டுகிறது.
- source_word: ὁ ἀνήρ
  choice: ஆண்
  rationale: ἀνήρ என்பதற்கு ‘ஆண்’ அல்லது ‘கணவன்’ என்று பொருள் வரலாம். γυνή என்பதற்கு இணையான பொதுப்பொருள் இங்கு சிறப்பாகப் பொருந்துகிறது.
- source_word: διὰ τῆς γυναικός
  choice: பெண்ணின் வழியாக
  rationale: διά + மரபுவேற்றுமை வழிமுறை அல்லது இடைமுகத்தைக் குறிக்கிறது. ஆண் பெண்ணிலிருந்து பிறப்பதைச் சொல்வதோடு, ἐκ மற்றும் διά இடையிலான வேறுபாட்டையும் காக்கிறது.
- source_word: τὰ δὲ πάντα
  choice: ஆனால் அனைத்தும்
  rationale: δέ மனிதருக்கிடையிலான பரஸ்பர உறவிலிருந்து இறுதியான தெய்வீக மூலத்துக்கு மிதமான எதிர்மாற்றத்தை ஏற்படுத்துகிறது.
- source_word: ἐκ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து வருகின்றன
  rationale: ἐκ மூலத்தைச் சுட்டுகிறது. தமிழ் வாக்கியம் முழுமையாகவும் இயல்பாகவும் அமைய ‘வருகின்றன’ சேர்க்கப்பட்டுள்ளது; அனைத்திற்கும் இறுதி மூலம் கடவுளே என்ற கருத்து காக்கப்படுகிறது.
theological_decisions:
- issue: γυνή / ἀνήρ என்பவற்றின் பொருள்
  choice: பொதுவான ‘பெண்’ / ‘ஆண்’
  alternative: ‘மனைவி’ / ‘கணவன்’
  rationale: இந்த வசனம் படைப்பையும் சாதாரண மனிதப் பிறப்பையும் இணைப்பதால், திருமண உறவை மட்டும் குறிக்கும் பொருளைவிட பொதுவான ஆண்–பெண் பொருள் ஏற்றது. மூலச்சொற்களின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பெண் மற்றும் ஆணின் தோற்றத்துக்கிடையிலான உறவு
  choice: ἐκ என்பதை ‘இலிருந்து’ என்றும் διά என்பதை ‘வழியாக’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘இலிருந்து’ என்று ஒரே விதமாக மொழிபெயர்த்தல்
  rationale: படைப்பில் பெண் ஆணிலிருந்து வந்ததையும், பிறப்பில் ஆண் பெண்ணின் வழியாக வருவதையும் பவுல் திட்டமிட்டு வேறுபடுத்துகிறார். இவ்வேறுபாடு பரஸ்பரத் தொடர்பையும் இறுதியில் கடவுளே அனைத்திற்கும் மூலம் என்பதையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஆணிலிருந்து’ மற்றும் ‘பெண்ணின் வழியாக’ என்ற சொற்றொடர்கள் மூலத்தின் ἐκ / διά வேறுபாட்டைப் பாதுகாக்கின்றன. அடிக்குறி [a] அது விளக்கும் சொற்றொடருக்குப் பின் இடப்பட்டுள்ளது.
