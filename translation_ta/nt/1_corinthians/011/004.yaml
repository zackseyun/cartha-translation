source:
  edition: SBLGNT
  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: ta
  text: தலையில் ஏதோ ஒன்றை அணிந்துகொண்டு மன்றாடுகிற அல்லது இறைவாக்குரைக்கிற ஒவ்வோர் ஆணும் தன் தலையை அவமதிக்கிறான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “தலையை மூடிக்கொண்டு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கம் சொற்படியாக “தலையின்மேல்/தலையிலிருந்து கீழே ஏதோ ஒன்றை வைத்துக்கொண்டு” என்கிறது; அது எந்த வகையான தலையணியையோ மூடுபொருளையோ குறிப்பாகச் சொல்லவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “தன் தலை” என்பது சொற்பொருளில் அவனுடைய உடல் தலையைக் குறிக்கலாம்; அதேவேளை சுற்றியுள்ள வசனங்களில் வரும் உறவுசார் “தலை” என்ற கருத்தையும் எதிரொலிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: ஒவ்வோர் ஆணும்
  rationale: ἀνήρ என்பதற்கு சூழலைப் பொறுத்து ‘ஆண்’ அல்லது ‘கணவன்’ என்று பொருள் வரலாம். அடுத்த வசனத்தில் வரும் ‘ஒவ்வொரு பெண்ணும்’ என்பதற்கு இணையாக இங்கு பொதுவான ஆண் குறிப்பு இயல்பானது; கணவன் என்ற பொருளைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: προσευχόμενος
  choice: மன்றாடுகிற
  rationale: நடந்துகொண்டிருக்கும் இறைவேண்டல் செயலை நிகழ்காலப் பங்கேற்புவினை குறிக்கிறது. ‘மன்றாடுகிற’ என்பது வழிபாட்டுச் சூழலில் இயல்பாகவும் பொதுமக்களுக்கு விளங்குமாறும் உள்ளது.
- source_word: προφητεύων
  choice: இறைவாக்குரைக்கிற
  rationale: இது தீர்க்கதரிசனச் செய்தியை உரைக்கும் செயலைக் குறிக்கிறது. ‘இறைவாக்குரைக்கிற’ என்பது நவீன தமிழில் செயலைத் தெளிவாகத் தெரிவிக்கிறது; வெறுமனே எதிர்காலத்தைக் கணிப்பதாகக் குறுக்கவில்லை.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: தலையில் ஏதோ ஒன்றை அணிந்துகொண்டு
  rationale: கிரேக்கம் சொற்படியாகத் தலையின்மேல் அல்லது தலையிலிருந்து கீழே ஏதோ ஒன்றை வைத்திருப்பதைக் கூறுகிறது; குறிப்பிட்ட மூடுபொருளைச் சொல்லவில்லை. தமிழ் வாக்கியம் இயல்பாக இருக்க ‘அணிந்துகொண்டு’ பயன்படுத்தப்பட்டாலும், ‘ஏதோ ஒன்றை’ என்பது பொருளை மிகையாகக் குறிப்பதைத் தவிர்க்கிறது.
- source_word: καταισχύνει
  choice: அவமதிக்கிறான்
  rationale: வினைச்சொல் வெட்கம் அல்லது மதிப்புக்கேடு உண்டாக்குவதைக் குறிக்கிறது. ‘அவமதிக்கிறான்’ என்பது மரியாதை–அவமரியாதை சார்ந்த கருத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: தன் தலையை
  rationale: இது அவனுடைய உடல் தலையைக் குறிக்கலாம்; அதேவேளை 3ஆம் வசனத்தின் உறவுசார் ‘தலை’ என்ற பயன்பாட்டையும் எதிரொலிக்கலாம். ‘தன் தலையை’ இந்த இருபொருள் சாத்தியத்தைத் தீர்மானிக்காமல் காக்கிறது.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள κεφαλή என்பது உடல் தலையா அல்லது உறவுசார் உருவகத் ‘தலை’யா?
  choice: ‘தன் தலையை’ என்று இருபொருள் சாத்தியத்தையும் தக்கவைத்தல்
  alternative: ‘தன் உடல் தலையை’ அல்லது ‘தனக்குத் தலையாக இருப்பவரை’ என்று வெளிப்படையாகத் தீர்மானித்தல்
  rationale: பவுலின் சொற்றொடர் உடல் தலையையும் சுற்றியுள்ள சூழலில் வரும் உறவுசார் ‘தலை’ பயன்பாட்டையும் ஒரே நேரத்தில் எதிரொலிக்க அனுமதிக்கிறது. ஆகவே மூலத்தில் உள்ள இறையியல் அழுத்தத்தை முதன்மை உரை தீர்த்துவிடக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இறைவாக்குரைக்கிற’ என்பது திருச்சபைச் செயலைத் தெளிவுபடுத்துகிறது; ‘ஏதோ ஒன்றை’ என்பது கிரேக்கத்தில் மூடுபொருள் குறிப்பிடப்படாத தன்மையைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறிகள் முதன்மை உரையில் இடம்பெற்றுள்ளன.
