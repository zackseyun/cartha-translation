base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: ta
  text: ஆனால், கர்த்தரால் நாம் நியாயந்தீர்க்கப்படும்போது[a], உலகத்தோடு சேர்ந்து நாம் தண்டனைத் தீர்ப்புக்குள்ளாகாதபடி ஒழுக்கப்படுத்தப்படுகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கர்த்தரால் நியாயந்தீர்க்கப்பட்டுக்கொண்டிருக்கையில், நாம் ஒழுக்கப்படுத்தப்படுகிறோம்.” கிரேக்க மொழியிலுள்ள நிகழ்கால வடிவங்கள் தொடர்ந்து நடைபெறும் செயலை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: நாம் நியாயந்தீர்க்கப்படும்போது
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தைச் சூழலுக்கேற்ற காலப் பொருளில் மொழிபெயர்க்கிறது. κατακριθῶμεν என்பதிலிருந்து வேறுபாட்டைக் காக்க, இங்கு இறுதித் தண்டனைத் தீர்ப்பை முன்கூட்டியே சேர்க்கவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தின் எச்சரிக்கையுடன் உள்ள மிதமான முரணை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὑπὸ κυρίου
  choice: கர்த்தரால்
  rationale: ὑπό + உரிமை வேற்றுமை செய்பவரைக் குறிக்கிறது. κύριος என்பதற்கு கிறிஸ்தவத் தமிழ் வழக்கில் தெளிவாகவும் மரியாதையாகவும் உள்ள ‘கர்த்தர்’ பயன்படுத்தப்படுகிறது; ‘இயேசு’ என்று மூலத்தில் இல்லாததை விரிவாக்கவில்லை.
- source_word: παιδευόμεθα
  choice: கண்டித்துத் திருத்தப்படுகிறோம்
  rationale: παιδεύω என்பதிலுள்ள ஒழுக்கப்படுத்துதல், பயிற்றுவித்தல், திருத்துதல் ஆகிய நிவாரண நோக்கமுள்ள கூறுகளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; வெறும் தண்டனை என்ற பொருளாகக் குறுக்கவில்லை.
- source_word: ἵνα μὴ
  choice: …ஆகாதபடி
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவு என்ற இரு சாத்தியங்களையும் இயல்பான தமிழில் தாங்குகிறது.
- source_word: σὺν τῷ κόσμῳ
  choice: உலகத்தோடு சேர்ந்து
  rationale: σύν குறிக்கும் உடன்சேர்தலையும் ஒரே முடிவைப் பகிரும் கருத்தையும் தெளிவாகக் காக்கிறது.
- source_word: κατακριθῶμεν
  choice: நாம் தண்டனைத் தீர்ப்புக்குள்ளாகாதபடி
  rationale: κρίνω என்பதைக் காட்டிலும் வலுவான, பாதகமான தீர்ப்பு அல்லது கண்டனத் தீர்ப்பு என்ற பொருளை வெளிப்படுத்தி, முதல் கூறிலுள்ள நியாயந்தீர்த்தலுடன் உள்ள சொற்பொருள் வேறுபாட்டைக் காக்கிறது.
theological_decisions:
- issue: இப்போதைய தெய்வீக நியாயத்தீர்ப்புக்கும் இறுதித் தண்டனைத் தீர்ப்புக்கும் உள்ள தொடர்பு
  choice: கர்த்தரின் நியாயத்தீர்ப்பு திருத்தும் ஒழுக்க நடவடிக்கையாகவும், உலகத்துடன் தண்டனைத் தீர்ப்புக்குள்ளாவதைத் தவிர்க்கும் நோக்கமுடையதாகவும் மொழிபெயர்க்கப்பட்டது.
  alternative: இதை விசுவாசிகள் மற்றும் உலகம் என்ற இறுதிக்கால வேறுபாட்டை வலியுறுத்தாமல், பொதுவான தற்காலத் தண்டனையாக மட்டும் வாசிக்கலாம்.
  rationale: κρινόμενοι, παιδευόμεθα, κατακριθῶμεν ஆகியவற்றின் வேறுபாடும் ἵνα μὴ என்ற நோக்கக் கூறும் திருத்தும் நடவடிக்கையையும் பாதகமான இறுதித் தீர்ப்பையும் வேறுபடுத்துகின்றன. இருப்பினும் நிலைத்திருத்தல் அல்லது திருவிருந்து பற்றிய முழுமையான கோட்பாட்டை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரமான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடை. ‘நியாயந்தீர்க்கப்படுதல்’ மற்றும் ‘தண்டனைத் தீர்ப்புக்குள்ளாதல்’ என்ற வேறுபாடு மூலத்தின் κρίνω / κατακρίνω எதிர்மறையைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
