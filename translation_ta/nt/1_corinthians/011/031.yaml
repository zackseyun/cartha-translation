base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/031.yaml
  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: ta
  text: ஆனால், நாம் நம்மை நாமே நியாயந்தீர்த்துக்கொண்டிருந்தால்[a], நியாயந்தீர்க்கப்பட்டிருக்க மாட்டோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மை நாமே ஆராய்ந்துகொண்டிருந்தால்” அல்லது “நம்மை நாமே பகுத்தறிந்துகொண்டிருந்தால்.” கிரேக்க வினைச்சொல் மதிப்பிடுதல் அல்லது வேறுபடுத்திப் பார்த்தல் என்று பொருள்படலாம். அடுத்த கூறிலுள்ள “நியாயந்தீர்க்கப்பட்டிருக்க” என்பதுடனான சொல்லியல் தொடர்பைக் காக்க இங்கே “நியாயந்தீர்த்துக்கொண்டிருந்தால்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ஆனால், … இருந்தால்
  rationale: εἰ நிபந்தனையையும் δέ மிதமான எதிர்மறைத் திருப்பத்தையும் குறிக்கின்றன; இத்தமிழாக்கம் இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἑαυτοὺς
  choice: நம்மை நாமே
  rationale: வினையின் தன்மறிவுப் பொருளை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: διεκρίνομεν
  choice: நியாயந்தீர்த்திருந்தால்
  rationale: இங்கு தன்னைத்தானே பகுத்து மதிப்பிடுதல் என்ற பொருள் உள்ளது. அதேவேளை அடுத்துள்ள ἐκρινόμεθα என்பதுடனான சொற்பொருள் தொடர்பைக் காக்க ‘நியாயந்தீர்த்தல்’ பயன்படுத்தப்படுகிறது.
- source_word: οὐκ ἂν ἐκρινόμεθα
  choice: நாம் நியாயந்தீர்க்கப்பட்டிருக்க மாட்டோம்
  rationale: இறந்தகாலத்திற்கு எதிரான நிபந்தனையின் விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; κρίνω என்பதை ‘தண்டனைத்தீர்ப்பு’ அல்லது ‘ஆக்கினைத்தீர்ப்பு’ என்று வலுப்படுத்தாமல் விடுகிறது.
theological_decisions:
- issue: இரண்டாம் கூறு இறுதி ஆக்கினைத்தீர்ப்பையா அல்லது ஆண்டவரின் ஒழுங்குபடுத்தும் நீதித்தீர்ப்பையா குறிக்கிறது?
  choice: பொதுவாக ‘நியாயந்தீர்க்கப்பட்டிருக்க மாட்டோம்’ என்று மொழிபெயர்த்து, சூழலில் உள்ள ஒழுங்குபடுத்தும் நீதித்தீர்ப்பின் சாத்தியத்தைத் திறந்தே வைத்தல்
  alternative: ‘ஆக்கினைத்தீர்ப்புக்கு உள்ளாகியிருக்க மாட்டோம்’
  rationale: அடுத்த வசனம் ஆண்டவரின் நியாயத்தீர்ப்பையும் உலகத்தோடு ஆக்கினைத்தீர்ப்படைவதையும் வேறுபடுத்துகிறது. ஆகவே இவ்வசனமே இறுதி ஆக்கினைத்தீர்ப்பைத் தெளிவாகக் கூறுவதாக மொழிபெயர்க்கக் கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகமத்துக்குரிய கண்ணியமான நடையைப் பேணுகிறது. ‘நம்மை நாமே’ என்பது தெளிவான தன்மறிவுக் கட்டமைப்பு; இரு கிரேக்க வினைகளுக்கிடையிலான சொல்லாட்டத்தை முடிந்தவரை ஒரே தமிழ்ச் சொல்லால் காக்கிறது.
