source:
  edition: SBLGNT
  text: γυνὴ δὲ ἐὰν κομᾷ, δόξα αὐτῇ ἐστιν; ὅτι ἡ κόμη ἀντὶ περιβολαίου ⸀δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: ta
  text: ஆனால் ஒரு பெண்[a] நீண்ட கூந்தல் இருந்தால், அது அவளுக்கு மகிமையாக இருக்கிறதல்லவா? ஏனெனில் அவளுடைய கூந்தல் மூடுதலுக்குப் பதிலாக[b] அவளுக்குக் கொடுக்கப்பட்டுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனைவி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சூழலைப் பொறுத்து ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: ‘மூடுதலாக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க முன்னிடைச்சொல் ஒத்த தொடர்பையோ பதிலீட்டையோ தெரிவிக்க முடியும். ஆகவே கூந்தலே அந்த மூடுதலாகச் செயல்படுகிறதா, அல்லது ஒரு மூடுதலுடன் தொடர்புடையதாகக் கொடுக்கப்பட்டுள்ளதா என்பதை இச்சொற்றொடர் மட்டும் முடிவாகத் தீர்மானிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: ஒரு பெண்
  rationale: γυνή என்பது சூழலைப் பொறுத்து ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள்படலாம். இங்கு பொதுவான கூற்றாக இருப்பதால் ‘ஒரு பெண்’ என்பது இயல்பாகப் பொருந்துகிறது.
- source_word: κομᾷ
  choice: நீண்ட கூந்தல் வைத்திருந்தால்
  rationale: κομάω என்பது வெறுமனே முடி இருப்பதை அல்ல, முடியை நீளமாக வைத்திருப்பதைக் குறிக்கிறது. இத்தமிழாக்கம் அந்த நிலைப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δόξα
  choice: மகிமை
  rationale: δόξα இங்கு பெருமை அல்லது மதிப்பைக் கொண்டுவருவதைக் குறிக்கிறது. ‘மகிமை’ அதன் வலிமையையும் பவுலின் சொல்லாட்சித் தொடர்பையும் தக்கவைக்கிறது.
- source_word: κόμη
  choice: கூந்தல்
  rationale: κόμη தலையில் வளர்ந்த, குறிப்பாக நீண்ட தலைமுடியைக் குறிக்கலாம். முந்தைய வினைச்சொல் நீளத்தை ஏற்கெனவே தெரிவிப்பதால் இங்கு ‘கூந்தல்’ போதுமானது.
- source_word: ἀντί
  choice: பதிலாக
  rationale: ἀντί பதிலீட்டையோ ஒத்த தொடர்பையோ குறிக்கலாம். ‘பதிலாக’ அதன் இயல்பான வலிமையைத் தக்கவைக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: περιβολαίου
  choice: மூடிக்கொள்ளும் ஒன்று
  rationale: περιβόλαιον என்பது சுற்றிப் போர்த்திக்கொள்ளும் அல்லது மூடும் ஒன்றுக்கான பொதுச் சொல். ‘முக்காடு’ என்று குறிப்பாக்காமல் அதன் பரந்த பொருளை இச்சொற்றொடர் காக்கிறது.
- source_word: δέδοται
  choice: கொடுக்கப்பட்டுள்ளது
  rationale: முற்றுப்பெற்ற செயப்பாட்டு வடிவம், முன்பு கொடுக்கப்பட்டதன் விளைவாக இப்போது நிலவும் நிலையைக் காட்டுகிறது. ‘கொடுக்கப்பட்டுள்ளது’ செயப்பாட்டையும் விளைவு நிலையையும் காக்கிறது.
theological_decisions:
- issue: περιβόλαιον என்பது குறிப்பாக முக்காட்டைக் குறிக்கிறதா, மேலும் கூந்தலே இப்பகுதியில் கோரப்படும் தலை மூடுதலா?
  choice: குறிப்பிட்ட ‘முக்காடு’ என்பதற்குப் பதிலாக பொதுவான ‘மூடிக்கொள்ளும் ஒன்று’ என்று மொழிபெயர்த்தல்.
  alternative: ‘முக்காடு’ அல்லது ‘போர்த்திக்கொள்ளும் ஆடை’
  rationale: கிரேக்கச் சொல் ‘முக்காடு’ என்பதைவிடப் பரந்தது. பொதுவான மொழியாக்கம், கூந்தல் துணியாலான தலை மூடுதலுக்குப் பதிலா அல்லது அதனுடன் தொடர்புடைய இயற்கையான ஒப்புமையா என்ற விளக்கவியல் விவாதத்தை வசனத்திலேயே முடிவுசெய்யாமல் வைத்திருக்கிறது.
- issue: δόξα αὐτῇ ἐστιν என்பதன் நிறுத்தக்குறியும் வாக்கியத் தன்மையும்
  choice: சூழலுக்கேற்ற மறைமுக வினாவாக ‘அது அவளுக்கு மகிமையாக இருக்கிறதல்லவா?’ என்று மொழிபெயர்த்தல்.
  alternative: ‘அது அவளுக்கு மகிமையாக இருக்கிறது.’
  rationale: SBLGNT உரையில் உள்ள கிரேக்க வினாக்குறியும் 11:14–15இன் தொடர்ச்சியான சொல்லாட்சியும் வினாவை ஆதரிக்கின்றன. தமிழில் ‘அல்லவா?’ என்பது எதிர்பார்க்கப்படும் ஒப்புதலை இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையைப் பயன்படுத்துகிறது. ‘கூந்தல்’ பொதுவாகப் புரியும் இலக்கியத் தன்மையுள்ள சொல்; ‘மூடிக்கொள்ளும் ஒன்று’ என்பது ‘முக்காடு’ போன்ற அளவுக்கு மீறிய குறிப்பாக்கத்தைத் தவிர்க்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
