id: 1CO.11.28
reference: 1 Corinthians 11:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: ta
  text: ஆனால் ஒவ்வொருவரும் தம்மையே சோதித்தறியட்டும்; இவ்வாறே அப்பத்திலிருந்து உண்ணட்டும், கிண்ணத்திலிருந்து குடிக்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος
  choice: ஒவ்வொருவரும்
  rationale: இங்கு ஆண் பாலினத்தை மட்டும் குறிக்காமல் பொதுவாக ஒவ்வொரு மனிதரையும் குறிக்கும் ஒருமைச் சொல்; நவீனத் தமிழில் உள்ளடக்கத்தையும் தனிநபர் பொறுப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δοκιμαζέτω
  choice: சோதித்தறியட்டும்
  rationale: தன்னை ஆராய்ந்து, உண்மையான நிலையை அறிதல் அல்லது தகுதியைச் சோதித்தல் என்ற பொருள் பரப்பைத் தக்கவைக்கிறது.
- source_word: ἑαυτόν
  choice: தம்மையே
  rationale: செயலின் பொருள் அதே நபர்தான் என்பதை வலியுறுத்தும் மூலமொழியின் reflexive வடிவத்தைப் பேணுகிறது.
- source_word: οὕτως
  choice: இவ்வாறே
  rationale: வெறும் காலவரிசையான ‘அதன்பின்’ என்று குறுக்காமல், முன்னர் கூறிய சுயசோதனையுடன் தொடர்புடைய முறையைத் தக்கவைக்கிறது.
- source_word: ἐκ τοῦ ἄρτου / ἐκ τοῦ ποτηρίου
  choice: அப்பத்திலிருந்து / கிண்ணத்திலிருந்து
  rationale: மூலத்தின் ἐκ (‘இலிருந்து’) அமைப்பையும், ஆண்டவரின் இராப்போஜனச் செயல்களில் அப்பம் மற்றும் கிண்ணம் என்ற தெளிவான உருவகங்களையும் நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: ἄνθρωπος என்பதன் பாலின வரம்பு
  choice: ஒவ்வொருவரும்
  alternative: ஒரு மனிதன்
  rationale: மூலச்சொல் இந்தச் சூழலில் ஆண்களை மட்டும் வரையறுப்பதற்கான ஆதாரம் இல்லாமல் பொதுவாக மனிதரைச் சுட்டுகிறது; ஆகவே தமிழில் பாலினச் சிறப்பைச் சேர்க்கவில்லை.
- issue: οὕτως என்பதன் தொடர்பு
  choice: இவ்வாறே
  alternative: அதன்பின்
  rationale: சுயசோதனை முடிந்த பிறகு என்ற காலவரிசை மட்டும் அல்லாமல், அந்த முறையிலேயே பங்கேற்க வேண்டும் என்ற மூலத்தின் உண்மையான பொருள் விரிவைத் திறந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘உண்டு’ மற்றும் ‘குடிக்கட்டும்’ இயல்பான வினைத் தொடராகவும், ‘சோதித்தறியட்டும்’ சுயஆராய்ச்சியின் நோக்கத்தையும் வெளிப்படுத்துகிறது.
