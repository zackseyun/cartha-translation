review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inclusive, distributive sense of ἄνθρωπος, the reflexive object, and οὕτως as manner rather than merely sequence. However, its participial «உண்டு» (“having eaten/eating”) followed by a single imperative «குடிக்கட்டும்» does not fully preserve the Greek's two coordinated present imperatives, ἐσθιέτω ... πινέτω.
  naturalness: The wording is generally clear and suitably dignified in modern standard Tamil. Rendering both final verbs as parallel imperatives is more natural for public reading and avoids making eating appear merely preliminary to drinking.
  terminology: «ஒவ்வொருவரும்», «தம்மையே», «அப்பம்», and «கிண்ணம்» are appropriate. «சோதித்தறியட்டும்» is a defensible rendering of δοκιμαζέτω and should be retained; it preserves the sense of testing/examining oneself without importing a doctrinal criterion.
  issues:
  - severity: medium
    issue: The two Greek imperatives are not represented in parallel.
    rationale: ἐσθιέτω and πινέτω are coordinated commands. «உண்டு, ... குடிக்கட்டும்» makes the first a participial action and can suggest a temporal sequence. Tamil should use imperatives for both eating and drinking.
  revised_text: ஆனால் ஒவ்வொருவரும் தம்மையே சோதித்தறியட்டும்; இவ்வாறே அப்பத்திலிருந்து உண்ணட்டும், கிண்ணத்திலிருந்து குடிக்கட்டும்.
  revised_footnotes: []
  revision_rationale: The revision retains all of the draft's sound lexical and theological choices while restoring the source's parallel imperative structure in the final clause. No footnotes are needed.
