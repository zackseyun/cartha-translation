revisions:
- from: ஆனால், தலையை மூடிக்கொள்ளாமல்[b] மன்றாடுகிற அல்லது இறைவாக்குரைக்கிற ஒவ்வொரு பெண்ணும் தன் தலையை அவமதிக்கிறாள்[a]. ஏனெனில், அவள் தலை மழிக்கப்பட்டவளாக இருப்பதும் இதுவும் ஒன்றே.
  to: ஆனால், தலை மூடப்படாமல்[b] மன்றாடுகிற அல்லது இறைவாக்குரைக்கிற ஒவ்வொரு பெண்ணும் தன் தலையை அவமதிக்கிறாள்[a]. ஏனெனில், அது அவளுடைய தலை மழிக்கப்பட்டிருப்பதற்குச் சமமானதே.
