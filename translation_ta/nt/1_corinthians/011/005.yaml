source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: ta
  text: ஆனால், தலை மூடப்படாமல்[b] மன்றாடுகிற அல்லது இறைவாக்குரைக்கிற ஒவ்வொரு பெண்ணும் தன் தலையை அவமதிக்கிறாள்[a]. ஏனெனில், அது அவளுடைய தலை மழிக்கப்பட்டிருப்பதற்குச் சமமானதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மன்றாடுகிற அல்லது இறைவாக்குரைக்கிற ஒவ்வொரு மனைவியும் ... தன் கணவனை/தலையை அவமதிக்கிறாள்.’ கிரேக்கத்தில் γυνή என்பது ‘பெண்’ அல்லது ‘மனைவி’ என்றும், ‘தலை’ என்பது சுற்றியுள்ள சூழலின்படி நேரடியாகவோ உருவகமாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘மூடப்படாமல்’ என்பது எவ்வகையான தலை மறைப்பைக் குறிக்கிறது என்பதைத் தனியே குறிப்பிடவில்லை; பவுல் குறிப்பாக முக்காட்டைக் குறிக்கிறாரா அல்லது பொதுவாக மூடப்படாத தலையைக் குறிக்கிறாரா என்பதில் விளக்கங்கள் வேறுபடுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: பெண்
  rationale: γυνή என்பதற்கு சூழலைப் பொறுத்து ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். இங்கு ‘மன்றாடுகிற அல்லது இறைவாக்குரைக்கிற ஒவ்வொரு...’ என்ற பொதுவான அமைப்புக்கு ‘பெண்’ இயல்பாகப் பொருந்துகிறது; ‘மனைவி’ என்பது அடிக்குறிப்பில் மாற்றுப் பொருளாகத் தரப்படுகிறது.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: மன்றாடுகிற அல்லது இறைவாக்குரைக்கிற
  rationale: நிகழ்காலப் பங்கேற்புவினைகள் அந்தச் செயல்களில் ஈடுபட்டிருப்பதைக் காட்டுகின்றன. ‘மன்றாடுகிற’ என்பது இறைவனை நோக்கிய வேண்டுதலை இயல்பாகத் தெரிவிக்கிறது; ‘இறைவாக்குரைக்கிற’ என்பது προφητεύω-வின் செயல்பாட்டை சமயப்பிரிவு சார்ந்த கூடுதல் விளக்கமின்றி எடுத்துரைக்கிறது.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: தலையை மூடிக்கொள்ளாமல்
  rationale: தலை மூடப்படாத நிலையையே மொழிபெயர்க்கிறது; அது முக்காடா, வேறொரு தலை மறைப்பா, அல்லது தலைமுடி தொடர்பான நிலையா என்பதை மூலச்சொல் தனியே தீர்மானிக்காததால் குறிப்பிட்ட பொருளைச் சேர்க்கவில்லை.
- source_word: καταισχύνει
  choice: அவமதிக்கிறாள்
  rationale: இச்சொல்லிலுள்ள அவமானப்படுத்துதல், கண்ணியத்தைக் குலைத்தல் ஆகிய சமூகப் பொருள்களை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: தன் தலையை
  rationale: சொற்றொடரின் நேரடிப் பொருளைத் தக்கவைக்கிறது. இது உடல் தலையையா அல்லது சூழலில் உறவுசார் உருவகத் ‘தலை’யையா குறிக்கிறது என்பதை முதன்மை உரையில் தீர்மானிக்காமல் விடுகிறது.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτὸ
  choice: இதுவும் ஒன்றே
  rationale: இரண்டு நிலைகளையும் ஒன்றாகக் கருதும் கிரேக்கச் சொற்றொடரின் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: τῇ ἐξυρημένῃ
  choice: தலை மழிக்கப்பட்டவளாக இருப்பது
  rationale: மழித்த செயல் முடிந்ததன் விளைவாக நிலவும் நிலையைக் குறிக்கும் நிறைவுப் பங்கேற்புவினையின் நுணுக்கத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘தன் தலையை அவமதிக்கிறாள்’ என்பதில் இரண்டாவது κεφαλή-யின் பொருள்
  choice: முதன்மை உரையில் ‘தன் தலையை’ என்று பொருள் தெளிவுபடுத்தப்படாத வடிவில் வைத்தல்
  alternative: அவளுடைய உடல் தலை; அல்லது வாதத்தின் உறவுசார் கட்டமைப்பில் அவளுடைய கணவன்/ஆண் எனும் உருவகத் தலை
  rationale: கிரேக்கச் சொற்றொடர் நேரடியாக ‘அவளுடைய தலை’ என்கிறது; சுற்றியுள்ள வாதம் உருவகப் பொருளுக்கான வாய்ப்பையும் எழுப்புகிறது. ஆகவே மூலத்தில் உள்ள விளக்கவியல் இறுக்கத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: ἀκατακαλύπτῳ என்பதில் தலை மறைப்பின் தன்மை
  choice: ‘தலையை மூடிக்கொள்ளாமல்’ என்று பொதுவாக மொழிபெயர்த்தல்
  alternative: முக்காடு இல்லாமல்; அல்லது தலைமுடி மூடாத/விரித்த நிலையில்
  rationale: அடைமொழி மூடப்படாத நிலையைக் கூறுகிறதே தவிர, எந்த வகையான மறைப்பு என்பதைத் தனியே குறிப்பிடவில்லை. குறிப்பாக ‘முக்காடு’ என்று சேர்ப்பது மூலத்தைத் தாண்டிய விளக்கமாகிவிடும்.
translation_notes:
  register: நவீனச் செந்தமிழும் பொதுமக்களுக்கு எளிதில் புரியும் நடையும் இணைக்கப்பட்டுள்ளன. ‘இறைவாக்குரைக்கிற’ என்பது dignified ஆனாலும் புரிந்துகொள்ளத்தக்க சமயச் சொல்; ‘தலை மழிக்கப்பட்டவள்’ என்பது மூலத்தின் விளைவு-நிலையை இயல்பாக வெளிப்படுத்துகிறது. மூலத்தில் தீர்மானிக்கப்படாத திருமண நிலை, ‘தலை’ என்ற உருவகம், தலை மறைப்பின் வகை ஆகியவை முதன்மை உரையில் வலுக்கட்டாயமாகத் தீர்க்கப்படவில்லை.
