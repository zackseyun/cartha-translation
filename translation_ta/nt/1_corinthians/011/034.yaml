source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: ta
  text: ஒருவன் பசியாயிருந்தால், அவன் வீட்டில் சாப்பிடட்டும்; நீங்கள் தீர்ப்புக்குள்ளாக ஒன்றுகூடாதபடிக்கு. மீதமுள்ள காரியங்களை நான் வரும்போது ஒழுங்குபடுத்துவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινᾷ
  choice: பசியாயிருந்தால்
  rationale: நிகழ்காலத்தில் ஒருவருக்கு இருக்கும் பசி நிலையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐν οἴκῳ
  choice: வீட்டிலேயே
  rationale: சபைக் கூடுகையில் அல்லாமல் ஒருவருடைய இல்லத்தில் உண்பதைக் குறிப்பதால், ‘வீட்டிலேயே’ என்ற வலியுறுத்தல் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐσθιέτω
  choice: சாப்பிடட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வினையின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: εἰς κρίμα
  choice: நியாயத்தீர்ப்புக்கு
  rationale: κρίμα என்பது தீர்ப்பு அல்லது கண்டனத் தீர்ப்பு என்ற பரப்பைக் கொண்டது. உடனடிச் சூழலில் ஆண்டவரின் தண்டித்துத் திருத்தும் தீர்ப்பு பேசப்படுவதால், இறுதி ஆக்கினையைத் திட்டவட்டமாகச் சேர்க்காமல் ‘நியாயத்தீர்ப்பு’ அந்தப் பொருள் அகலத்தைக் காக்கிறது.
- source_word: συνέρχησθε
  choice: நீங்கள் ஒன்றுகூடுவது
  rationale: இப்பகுதி முழுவதிலும் சபையார் கூடிவருவதைக் குறிக்கும் வினைத்தொடர்பை ‘ஒன்றுகூடுவது’ காக்கிறது.
- source_word: Τὰ δὲ λοιπὰ
  choice: மற்ற காரியங்களைக் குறித்து
  rationale: இன்னும் கவனிக்க வேண்டிய நடைமுறை விஷயங்களைப் பவுல் தனது வருகைவரை ஒத்திவைப்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὡς ἂν ἔλθω
  choice: நான் வரும்போது
  rationale: வருங்காலத்தில் எதிர்பார்க்கப்படும் பவுலின் வருகையை இயல்பான தமிழில் தருகிறது; கிரேக்கத்தில் உள்ள துல்லியமற்ற காலத் தன்மையை அளவுக்கு மீறி வலியுறுத்தவில்லை.
- source_word: διατάξομαι
  choice: அறிவுறுத்துவேன்
  rationale: செய்ய வேண்டியவற்றைக் குறித்து ஒழுங்கான வழிமுறைகளை வழங்குதல் என்ற சூழல்சார் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கர்த்தருடைய இராப்போஜனக் கூடுகையைப் பற்றிய எச்சரிக்கையில் κρίμα என்பதன் பொருள்
  choice: இறுதி ஆக்கினை என்று வெளிப்படையாகக் கூறாமல், ‘நியாயத்தீர்ப்பு’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஆக்கினைத்தீர்ப்பு’ அல்லது பரந்த பொருளில் ‘தீர்ப்பு’
  rationale: அருகிலுள்ள 29–32 வசனங்கள் ஆண்டவரின் தற்போதைய தீர்ப்பையும் திருத்தும் தண்டனையையும் உலகத்தோடு வரும் இறுதி ஆக்கினையிலிருந்து வேறுபடுத்துகின்றன. ‘நியாயத்தீர்ப்பு’ மூலத்தின் இறையியல் அழுத்தத்தையும் பொருள் பரப்பையும் காக்கிறது.
- issue: τις என்ற பொதுவான ஒருமைச் சுட்டும் அதனுடன் வரும் ஒருமைக் கட்டளையும்
  choice: ‘ஒருவன் … அவன் … சாப்பிடட்டும்’ என்று ஒருமையைப் பேணுதல்
  alternative: ‘யாராவது … அவர்கள் சாப்பிடட்டும்’ அல்லது பாலினச் சுட்டில்லாத மறுவடிவம்
  rationale: கிரேக்கம் காலவரையற்ற ஒருமைச் சுட்டையும் மூன்றாம் நபர் ஒருமைக் கட்டளையையும் பயன்படுத்துகிறது. தமிழ் வடிவம் அந்த இலக்கண ஒருமையைத் தெளிவாகப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. மூலத்திலுள்ள இரண்டு வாக்கியங்களின் கருத்தோட்டத்தைத் தெளிவாக்க ‘அப்போது’ சேர்க்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில உரையில் [a] குறியீடு ‘hungry’ என்பதற்குப் பின் இருந்தாலும், அடிக்குறிப்பின் உள்ளடக்கம் κρίμα என்பதையே விளக்குவதால் தமிழில் அது ‘நியாயத்தீர்ப்புக்கு’ என்பதற்குப் பின் சரியாக இடப்பட்டுள்ளது.
