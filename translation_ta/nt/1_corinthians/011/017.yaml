source:
  edition: SBLGNT
  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: ta
  text: ஆனால், இந்த அறிவுறுத்தலை வழங்குகையில்[a] நான் உங்களைப் பாராட்டவில்லை. ஏனெனில், உங்கள் கூடிவருதல் நன்மையைவிடக் கேடே விளைவிக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «இந்த அறிவுறுத்தலை வழங்குகையில்» என்பதற்குப் பதிலாக, «இந்தக் கட்டளையை வழங்குகையில்» என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை அறிவுறுத்துதல், வழிகாட்டுதல், அல்லது கட்டளையிடுதல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: இதை
  rationale: அடுத்து பவுல் வழங்கவிருக்கும் அறிவுறுத்தலைச் சுட்டும் நடுநிலைச் சுட்டுப்பெயர்; தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய பகுதிக்கும் இங்கு தொடங்கும் கண்டிப்புக்கும் இடையிலான மிதமான முரண்பாட்டைக் காட்டுகிறது.
- source_word: παραγγέλλων
  choice: அறிவுறுத்தும்போது
  rationale: παραγγέλλω என்பதன் ‘அறிவுறுத்துதல், வழிகாட்டுதல், கட்டளையிடுதல்’ என்ற பொருள் வரம்பில், இச்சூழலில் அதிகாரத்தையும் இயல்பான தமிழ்நடையையும் சமநிலைப்படுத்துகிறது.
- source_word: οὐκ ἐπαινῶ
  choice: நான் உங்களைப் பாராட்டவில்லை
  rationale: ἐπαινέω என்பதன் நேரடியான ‘பாராட்டுதல்’ என்ற பொருளைத் தருவதோடு, 11:2-இல் உள்ள பாராட்டுதலுடனான மாறுபாட்டையும் தக்கவைக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: பவுல் ஏன் அவர்களைப் பாராட்டவில்லை என்பதற்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐκ εἰς τὸ κρεῖσσον
  choice: நன்மைக்காக அல்ல
  rationale: εἰς + ஒப்பீட்டுப் பெயரடை காட்டும் நோக்கம் அல்லது விளைவு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; அந்த இருபொருள் வாய்ப்பை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: ἀλλὰ εἰς τὸ ἧσσον
  choice: தீமைக்காகவே
  rationale: முந்தைய சொற்றொடருடன் உள்ள எதிர்மறை இணைப்பைச் சுருக்கமாகத் தக்கவைக்கிறது; ‘வே’ எதிர்மறை வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: συνέρχεσθε
  choice: நீங்கள் ஒன்றுகூடுவது
  rationale: சபையார் கூடிவருகிற சூழலைக் குறிக்கும் வினையின் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: παραγγέλλων என்பதிலுள்ள அதிகாரத் தொனி
  choice: அறிவுறுத்தும்போது
  alternative: கட்டளையிடும்போது
  rationale: இவ்வினை கட்டளையிடும் வலிமையையும் கொண்டிருக்கலாம். ஆனால் இங்கு அப்போஸ்தலரின் திருத்தும் வழிகாட்டுதலைத் தெரிவிக்க ‘அறிவுறுத்துதல்’ போதிய அதிகாரத் தொனியைத் தக்கவைத்து, தேவையற்ற கடுமையைச் சேர்க்காமல் உள்ளது.
- issue: εἰς τὸ κρεῖσσον / εἰς τὸ ἧσσον என்பதன் நோக்கம் அல்லது விளைவு
  choice: நன்மைக்காக அல்ல, தீமைக்காகவே
  alternative: நன்மையை விளைவிப்பதற்குப் பதிலாகத் தீமையை விளைவிக்கும்படி
  rationale: கிரேக்கச் சொற்றொடர் நோக்கத்தையோ விளைவையோ சுட்டக்கூடும். தேர்ந்தெடுத்த வடிவம் அந்தச் சுருக்கத்தையும் பதற்றத்தையும் தக்கவைக்கிறது; அவர்கள் தீமையை வேண்டுமென்றே நோக்கமாகக் கொண்டார்கள் என்று வெளிப்படையாகக் கூறுவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சபையில் வாசிக்க ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘நன்மை/தீமை’ என்ற நேரான எதிரிணை, மூலத்தின் ஒப்பீட்டு முரண்பாட்டை வாசகருக்கு எளிதாக எடுத்துரைக்கிறது.
