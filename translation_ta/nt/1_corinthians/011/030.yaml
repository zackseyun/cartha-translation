- from: இதனால்தான் உங்களிடையே பலர் பலவீனமாகவும் நோயுற்றவர்களாகவும் இருக்கிறார்கள்; கணிசமானோர் நித்திரையடைந்திருக்கிறார்கள்.[a]
  to: இதன் காரணமாக உங்களிடையே பலர் பலவீனமாகவும் நோயுற்றும் உள்ளனர்; கணிசமானோர் நித்திரையடைந்துள்ளனர்.[a]
