reference: 1 Corinthians 11:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: ta
  text: இதன் காரணமாக உங்களிடையே பலர் பலவீனமாகவும் நோயுற்றும் உள்ளனர்; கணிசமானோர் நித்திரையடைந்துள்ளனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “நித்திரையடைந்துள்ளனர்” என்பது இறப்பைக் குறிக்கும் உருவகம்; அதாவது, “இறந்திருக்கிறார்கள்” என்றும் பொருள்படும். இறப்பைக் குறிக்கப் பவுல் கிறிஸ்தவ வழக்கிலிருந்த உருவகத்தைப் பயன்படுத்துகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்தான்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட ஆண்டவரின் இராப்போஜன முறைகேட்டைக் காரணமாகச் சுட்டுகிறது; கிரேக்கத்தின் காரணத் தொடர்பை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: தனிநபரின் உள்ளார்ந்த நிலையை அல்ல, கொரிந்து திருச்சபைச் சமூகத்தில் காணப்பட்ட நிலையைச் சுட்டுகிறது.
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் அளவுச்சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀσθενεῖς
  choice: பலவீனமாக
  rationale: உடல் வலுக்குறைவைச் சுட்டுவதோடு, அடுத்து வரும் ἄρρωστοι என்பதிலிருந்து உள்ள சொற்பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: ἄρρωστοι
  choice: நோயுற்றவர்களாக
  rationale: நோய் அல்லது உடல்நலக்குறைவு என்ற பொருளைத் தெளிவாகத் தருகிறது; ἀσθενεῖς என்பதற்கான ‘பலவீனம்’ என்பதிலிருந்து வேறுபடுகிறது.
- source_word: κοιμῶνται
  choice: நித்திரையடைந்திருக்கிறார்கள்
  rationale: இறப்பைக் குறிக்கும் தொடக்ககாலக் கிறிஸ்தவ உருவகத்தை நேரடியாக ‘இறந்தார்கள்’ என்று தட்டையாக்காமல் காக்கிறது.
- source_word: ἱκανοί
  choice: கணிசமானோர்
  rationale: ஒரு குறிப்பிடத்தக்க எண்ணிக்கையினரைச் சுட்டுகிறது; πολλοὶ என்பதற்குப் பயன்படுத்திய ‘பலர்’ என்பதை இயந்திரமாக மீண்டும் கூறுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: κοιμῶνται என்பது நேரடியான உறக்கத்தையா அல்லது இறப்பைக் குறிக்கும் உருவகத்தையா சுட்டுகிறது?
  choice: இறப்பைக் குறிக்கும் உருவகமாகப் புரிந்து, முதன்மை உரையில் ‘நித்திரையடைந்திருக்கிறார்கள்’ என்று உருவகத்தையே காத்தல்
  alternative: ‘இறந்திருக்கிறார்கள்’ என்று பொருளை வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது நேரடியான உறக்கமாகப் புரிதல்
  rationale: பலவீனம், நோய், நித்திரை என்ற ஏறுமுக வரிசையும் தெய்வீக நியாயத்தீர்ப்பைப் பற்றிய உடனடிச் சூழலும் இறப்பைக் குறிக்கின்றன. எனினும் பவுலின் உருவகமும் அதன் இறையியல் தொனியும் முதன்மை உரையில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘நித்திரையடைந்திருக்கிறார்கள்’ என்பது சாதாரண பேச்சைவிட உயர்ந்த தொனியுடையதாயினும், வேதாகமச் சூழலில் புரிந்துகொள்ளத்தக்கதாகவும் மூலத்தின் மரண உருவகத்தைப் பாதுகாப்பதாகவும் உள்ளது.
