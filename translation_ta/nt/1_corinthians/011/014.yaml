revisions:
- from: இயற்கையே உங்களுக்குக் கற்பிக்கவில்லையா? ஓர் ஆண் நீண்ட தலைமுடி வைத்திருந்தால்[a], அது அவனுக்கு அவமதிப்பாக இருக்கிறது[b].
  to: ஓர் ஆண் தன் தலைமுடியை நீளமாக வைத்திருந்தால்[a], அது அவனுக்கு இழிவாகும் என்று இயற்கையே[b] உங்களுக்குக் கற்பிக்கவில்லையா?
  rationale: The revision restores the explicit ‘that’-clause relationship of ὅτι, uses an idiomatic Tamil expression for wearing long hair, sharpens the honor–dishonor term, and moves the interpretive footnote marker to its proper lexical anchor. It does not narrow the disputed meaning of φύσις.
