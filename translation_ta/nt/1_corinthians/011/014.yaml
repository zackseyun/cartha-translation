source:
  edition: SBLGNT
  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: ta
  text: ஓர் ஆண் தன் தலைமுடியை நீளமாக வைத்திருந்தால்[a], அது அவனுக்கு இழிவாகும் என்று இயற்கையே[b] உங்களுக்குக் கற்பிக்கவில்லையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் தலைமுடியை நீளமாக வளர்த்தால்” அல்லது “நீண்ட தலைமுடியுடன் இருந்தால்.” கிரேக்க வினைச்சொல் தலைமுடியை நீளமாக வைத்திருப்பதையோ நீண்ட தலைமுடியுடன் இருப்பதையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “இயற்கையே” என்பது படைக்கப்பட்ட ஒழுங்கை, பொதுவான மனித உணர்வை, அல்லது ஒரு பண்பாடு இயல்பாகப் பொருத்தமானது என்று கருதுவதைச் சுட்டலாம்; இங்கு கிரேக்க வாசகம் இதைவிடக் குறுகிய பொருளைத் தெளிவாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: கற்பிக்கவில்லையா?
  rationale: தொடரும் வாதத்திலுள்ள எதிர்மறை வினாவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘இயற்கையே’ என்பதிலுள்ள ‘-ஏ’ வலியுறுத்தல் οὐδὲ மற்றும் αὐτή ஆகியவற்றின் கூட்டு அழுத்தத்தையும் தாங்குகிறது.
- source_word: ἡ φύσις αὐτὴ
  choice: இயற்கையே
  rationale: φύσις என்பதைக் ‘இயற்கை’ என்று அகன்ற பொருளில் வைத்து, αὐτή தரும் வலியுறுத்தலை ‘-ஏ’ மூலம் காக்கிறது; உயிரியல் ஒழுங்கு, பொதுமனித உணர்வு, பண்பாட்டில் இயல்பெனக் கருதப்படுவது ஆகியவற்றில் ஒன்றாகக் குறுக்கவில்லை.
- source_word: διδάσκει ὑμᾶς
  choice: உங்களுக்குக் கற்பிக்க
  rationale: நிகழ்கால வினையின் போதிக்கும் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀνὴρ
  choice: ஓர் ஆண்
  rationale: இங்கு கணவன் என்ற குறிப்பான பொருளைவிட ஆண்–பெண் வேறுபாடே சூழலுக்குப் பொருந்துவதால் பாலினத்தைக் குறிப்பாக வெளிப்படுத்துகிறது.
- source_word: μὲν
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: அடுத்த வசனத்தில் நிறைவுபெறும் எதிரிணையின் முதல் பகுதியைச் சுட்டுகிறது; தமிழில் இவ்வசனத்துக்குள் அதை வெளிப்படையாகச் சேர்ப்பது செயற்கையாக இருக்கும்.
- source_word: ἐὰν κομᾷ
  choice: நீண்ட தலைமுடி வைத்திருந்தால்
  rationale: κομάω என்பது தலைமுடியை நீளமாக வைத்திருப்பதை அல்லது நீண்ட தலைமுடியுடன் இருப்பதைக் குறிக்கிறது; செயற்கையான சொற்றொடரைத் தவிர்த்து இரு நுணுக்கங்களையும் இயல்பாகத் தருகிறது.
- source_word: ἀτιμία αὐτῷ ἐστιν
  choice: அது அவனுக்கு அவமதிப்பாக இருக்கிறது
  rationale: மரியாதை–அவமரியாதைச் சூழலில் ἀτιμία என்பதன் பொருளையும் αὐτῷ என்ற தொடர்பையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: பவுலின் வாதத்தில் φύσις (‘இயற்கை’) என்பதன் பொருள்
  choice: ‘இயற்கையே’ என்று பொருளை அகன்றதாக வைத்தல்
  alternative: படைக்கப்பட்ட உயிரியல் ஒழுங்கு; இயல்பானதாக உணரப்படும் சமூக மரபு; உள்ளார்ந்த ஒழுக்க உணர்வு
  rationale: இந்த இடத்தில் கிரேக்கச் சொல் எதைக் குறிப்பாகக் குறிக்கிறது என்பதைத் தனியே வரையறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு ஒரு குறிப்பிட்ட இறையியல் அல்லது பண்பாட்டு விளக்கத்தைத் திணிக்காமல் மூலத்தின் பொருள் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குத் தெளிவான, கண்ணியமான நடை. வினாவை இரண்டு வாக்கியங்களாக அமைத்தது தமிழின் இயல்பான ஓட்டத்திற்காக; மூலத்தின் சொல்லாட்சியும் விளக்கத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
