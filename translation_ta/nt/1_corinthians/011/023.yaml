source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: ta
  text: 'ஏனெனில், நான் ஆண்டவரிடமிருந்து பெற்றதையும் உங்களுக்கும் ஒப்படைத்தேன்: ஆண்டவராகிய இயேசு, அவர் கையளிக்கப்படிக் கொண்டிருந்த இரவில்[a], அப்பத்தை எடுத்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபாக, “அவர் காட்டிக்கொடுக்கப்பட்ட இரவில்.”
    reason: παρεδίδετο என்பதற்கு இச்சூழலில் ‘துரோகம் செய்து காட்டிக்கொடுக்கப்பட்டார்’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: παρέλαβον
  choice: பெற்றுக்கொண்டேன்
  rationale: பவுல் போதனையை அல்லது மரபை ஆண்டவரிடமிருந்து பெற்றதைக் குறிக்கிறது; தொடர்ந்து வரும் ‘ஒப்படைத்தேன்’ என்பதுடன் பெறுதல்–ஒப்படைத்தல் என்ற தொடர்பையும் காக்கிறது.
- source_word: ἀπὸ τοῦ κυρίου
  choice: ஆண்டவரிடமிருந்து
  rationale: சொற்றொடரின் மூலத்தைக் குறிக்கும் இயல்பான பொருளை நேரடியாகத் தருகிறது; அடுத்த பகுதியில் ‘ஆண்டவராகிய இயேசு’ என்று அடையாளம் தெளிவாகிறது.
- source_word: παρέδωκα
  choice: ஒப்படைத்தேன்
  rationale: பெற்ற போதனையை மற்றவர்களிடம் கொடுத்ததைக் குறிக்கும் மரபுப் பரிமாற்ற மொழியைப் பேணுகிறது; அதே வேர் சொல்லின் பின்னைய செயலற்ற வடிவத்துடனான சொல்லிணைப்பும் ஓரளவு நிலைக்கிறது.
- source_word: ὅτι
  choice: என்பதையே / பின்வரும் இரட்டைப்புள்ளி
  rationale: தமிழில் உள்ளடக்க வாக்கியத்தை இயல்பாக அறிமுகப்படுத்த, ‘பெற்றுக்கொண்டதையே’ என்பதற்குப் பின் இரட்டைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ κύριος Ἰησοῦς
  choice: ஆண்டவராகிய இயேசு
  rationale: κύριος என்பதன் மரியாதை மற்றும் கிறிஸ்துவியல் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: அந்த இரவில்
  rationale: உறவுப்பெயரெச்சக் கட்டமைப்பைத் தமிழில் இயல்பான காலச் சொற்றொடராக வழங்குகிறது.
- source_word: παρεδίδετο
  choice: ஒப்புக்கொடுக்கப்பட்டுக்கொண்டிருந்த
  rationale: இறந்தகாலத் தொடர்நிலை செயலற்ற வடிவத்தைப் பேணி, ‘காட்டிக்கொடுக்கப்பட்டார்’ என்று யூதாசின் துரோகத்துக்கு மட்டும் பொருளைக் குறுக்காமல், ஒப்படைத்தல்/கையளித்தல் என்ற விரிந்த பொருள் வாய்ப்பை வைத்திருக்கிறது.
- source_word: ἔλαβεν ἄρτον
  choice: அப்பத்தை எடுத்தார்
  rationale: தமிழ் வேதாகம மற்றும் வழிபாட்டு நடையில் பரிச்சயமானதும், மூலத்தின் வினை–பொருள் அமைப்பைத் தெளிவாக வழங்குவதுமான மொழிபெயர்ப்பு.
theological_decisions:
- issue: παρεδίδετο என்பதன் மொழிபெயர்ப்பு
  choice: ஒப்புக்கொடுக்கப்பட்டுக்கொண்டிருந்த
  alternative: காட்டிக்கொடுக்கப்பட்ட இரவில்
  rationale: παραδίδωμι என்பது ஒப்புக்கொடுத்தல், கையளித்தல் அல்லது துரோகம் செய்து காட்டிக்கொடுத்தல் ஆகிய பொருள்களைச் சூழலுக்கேற்ப தரலாம். முதன்மை உரை அந்த விரிந்த பொருளையும் மனிதச் செயலுக்கும் மீட்புத் திட்டத்துக்கும் இடையிலான இறையியல் அழுத்தத்தையும் காக்கிறது; மரபான குறுகிய வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘ஆண்டவர்’, ‘அப்பம்’ போன்ற பரிச்சயமான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. மூலத்தின் பெறுதல்–ஒப்படைத்தல் தொடர்பும் παρεδίδετο-வின் பொருள் அகலமும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
