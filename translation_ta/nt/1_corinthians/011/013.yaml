source:
  edition: SBLGNT
  text: ἐν ὑμῖν αὐτοῖς κρίνατε· πρέπον ἐστὶν γυναῖκα ἀκατακάλυπτον τῷ θεῷ προσεύχεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: ta
  text: 'நீங்களே தீர்மானியுங்கள்: ஒரு பெண் தன் தலையை மூடிக்கொள்ளாமல் கடவுளிடம் மன்றாடுவது தகுந்ததா?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பகுதியின் விரிந்த சூழலில் γυνή என்பது திருமணப் பொருளில் எடுத்துக்கொள்ளப்பட்டால், “ஒரு மனைவி” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: நீங்களே
  rationale: கொரிந்தியர்கள் தங்கள் சொந்த மதிப்பீட்டைப் பயன்படுத்த வேண்டும் என்ற வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: κρίνατε
  choice: தீர்மானியுங்கள்
  rationale: மதிப்பிட்டு முடிவு செய்யும்படி கூறும் இறந்தகால ஏவல் வடிவத்தின் நேரடியான வலிமையைத் தமிழில் தெளிவாகக் கொண்டுவருகிறது.
- source_word: πρέπον ἐστὶν
  choice: தகுந்ததா?
  rationale: சமூக அல்லது ஒழுக்க மரபின்படி பொருத்தமாக இருப்பதைப் பற்றிய கேள்வியைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: γυναῖκα
  choice: ஒரு பெண்
  rationale: γυνή என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். இவ்வசனத்தில் கணவன் வெளிப்படையாகக் குறிப்பிடப்படாததால் பொதுவான ‘ஒரு பெண்’ முதன்மை உரையில் ஏற்றது; திருமணப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀκατακάλυπτον
  choice: தன் தலையை மூடிக்கொள்ளாமல்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘மூடப்படாத’ என்பதாகும்; உடனடியான சூழல் தலை மூடுதலைப் பற்றியதால், குறிக்கப்பட்டுள்ள ‘தலை’ என்பதைத் தமிழில் வெளிப்படையாக்குவது தெளிவளிக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளிடம்
  rationale: προσεύχομαι உடன் வரும் வேற்றுமை உருபு மன்றாட்டின் முகவரைக் குறிக்கிறது; ‘கடவுளிடம்’ என்பது இயல்பான தமிழாக்கம்.
- source_word: προσεύχεσθαι
  choice: மன்றாடுவது
  rationale: கடவுளை நோக்கி வேண்டுதல் செய்வதைக் குறிக்கும் வினையை மரியாதையான, பொதுவாகப் புரியும் நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: தலை மூடுதல் பற்றிய உரையாடலில் γυνή என்பதன் பொருள்
  choice: ஒரு பெண்
  alternative: ஒரு மனைவி
  rationale: இந்த வசனம் கணவனை வெளிப்படையாகக் குறிப்பிடாமல் பொதுவான வினாவாக அமைந்துள்ளது. ஆகவே தேவையற்ற திருமண வரம்பை முதன்மை உரையில் திணிக்காமல் ‘ஒரு பெண்’ எனத் தரப்பட்டு, சூழலில் சாத்தியமான ‘ஒரு மனைவி’ என்ற பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான சொல்லாட்சியுடனும் வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடையுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் சொல்லாட்சியை இயந்திரமாகப் பின்பற்றாமல் அதன் வலியுறுத்தலும் வினாவும் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளன.
