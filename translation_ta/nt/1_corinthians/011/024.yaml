language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: ta
  text: அவர் நன்றி செலுத்திய பின்பு, அப்பத்தைப் பிட்டு, “இது உங்களுக்காக உள்ள என் உடல்.[a] என்னை நினைவுகூருவதற்காக இதைத் தொடர்ந்து செய்யுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சில கையெழுத்துப் பிரதிகளில் ‘உங்களுக்காக’ என்பதற்குப் பின் ‘பிட்கப்படும்’ என்பது சேர்க்கப்பட்டுள்ளது: ‘இது உங்களுக்காகப் பிட்கப்படும் என் உடல்.’'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: நன்றி செலுத்திய பின்பு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பெயரெச்சத்தின் தொடர்ச்சிப் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἔκλασεν
  choice: அப்பத்தைப் பிட்டு
  rationale: வினைச்சொல் ‘பிட்டார்’ என்று பொருள்படும்; முந்தைய வசனச் சூழலில் உள்ள அப்பத்தைத் தமிழில் வெளிப்படையாகக் குறிப்பிடுவது செயலைத் தெளிவாக்குகிறது.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: இது ... என் உடல்
  rationale: கிரேக்கத்தின் நேரடியான இணைப்புக் கூற்றைப் பேணுகிறது; ‘இது என் உடலைக் குறிக்கிறது’ போன்ற விளக்கவுரையைச் சேர்த்து நற்கருணை குறித்த இறையியல் விவாதத்தைத் தீர்மானிப்பதில்லை.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: உங்களுக்காக உள்ள
  rationale: ὑπέρ உடன் வரும் பன்மை முன்னிலைப் பொருளின் நன்மை/சார்புப் பொருளைச் சுருக்கமாகப் பேணுகிறது; குறிப்பிட்ட பாவநிவாரணக் கோட்பாட்டைத் திணிக்கவில்லை.
- source_word: τοῦτο ποιεῖτε
  choice: இதைத் தொடர்ந்து செய்யுங்கள்
  rationale: நிகழ்காலக் கட்டளையின் வழக்கமான அல்லது மீண்டும் மீண்டும் செய்யும் வலிமையை இச்சூழலில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: என்னை நினைவுகூரும்படி
  rationale: ἀνάμνησις குறிக்கும் செயற்பாட்டுள்ள நினைவுகூருதலை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘இது என் உடல்’ என்ற நற்கருணைக் கூற்றின் பொருள்
  choice: இணைப்புக் கூற்றை நேரடியாக ‘இது ... என் உடல்’ என்று மொழிபெயர்த்தல்
  alternative: ‘இது என் உடலைக் குறிக்கிறது’ என்று குறியீட்டுப் பொருளை வெளிப்படையாகச் சேர்த்தல்
  rationale: மூலவாக்கியம் கிறிஸ்துவின் பிரசன்னத்தின் முறையை விளக்கவில்லை; எனவே திருவிருந்து குறித்த பிற்காலக் கொள்கை வேறுபாடுகளை மொழிபெயர்ப்பு தீர்மானிக்காமல் அதன் இறையியல் அழுத்தத்தைப் பேணுகிறது.
- issue: ὑπὲρ ὑμῶν என்பதன் வலிமை
  choice: உங்களுக்காக உள்ள
  alternative: உங்கள் சார்பாக உள்ள / உங்கள் நன்மைக்காக உள்ள
  rationale: பெறுநர்களின் நன்மையையும் அவர்களுக்காக இருப்பதையும் தெரிவிக்கிறது; ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத தொழில்நுட்பமான பாவநிவாரண விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனப் பொதுத்தமிழில் மரியாதையும் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பத்தை’ என்பது உடனடி சூழலிலிருந்து நிரப்பப்பட்ட செயப்படுபொருள். ‘இதைத் தொடர்ந்து செய்யுங்கள்’ என்பது மீளச்செய்யும் கட்டளையை இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்புக் குறியீடு அது சார்ந்த ‘உங்களுக்காக உள்ள என் உடல்’ என்ற வாசகத்துக்குப் பின் வைக்கப்பட்டுள்ளது.
