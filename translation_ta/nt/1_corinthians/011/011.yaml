id: 1CO.11.11
reference: 1 Corinthians 11:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πλὴν οὔτε ⸂γυνὴ χωρὶς ἀνδρὸς οὔτε ἀνὴρ χωρὶς γυναικὸς⸃ ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: ta
  text: ஆயினும், ஆண்டவருக்குள் பெண் ஆணிலிருந்து பிரிந்தவள் அல்ல; ஆணும் பெண்ணிலிருந்து பிரிந்தவன் அல்ல.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவருக்குள் மனைவி கணவனிலிருந்து பிரிந்தவள் அல்ல; கணவனும் மனைவியிலிருந்து பிரிந்தவன் அல்ல.” கிரேக்கச் சொற்கள் பெண்/ஆண் அல்லது மனைவி/கணவன் ஆகிய இரு பொருள்களையும் குறிக்கலாம். இக்கூற்று திருமணத்திற்கு மட்டும் வரையறுக்கப்படாமல் பொதுவாகத் தோன்றுவதால், முதன்மை உரையில் விரிந்த பொருள் தரப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: ஆயினும்
  rationale: முந்தைய வாதத்தை மறுக்காமல், அதைச் சமநிலைப்படுத்தும் திருப்பத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γυνή
  choice: பெண்
  rationale: இச்சொல் ‘மனைவி’ என்றும் பொருள்படலாம்; ஆனால் படைப்பு, வழிபாடு, ஆண்-பெண் பரஸ்பர உறவு ஆகியவற்றைப் பற்றிய விரிந்த சூழலில் ‘பெண்’ என்பது பொதுவான பொருளைச் சிறப்பாகத் தருகிறது.
- source_word: ἀνήρ
  choice: ஆண்
  rationale: இச்சொல் ‘கணவன்’ என்றும் பொருள்படலாம்; இங்கு பொதுவான ஆண்-பெண் உறவே முன்னிலையாக இருப்பதால் ‘ஆண்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: χωρὶς
  choice: விட்டுத் தனியாக
  rationale: பிரிவு அல்லது மற்றவரைச் சாராத தனிநிலையைச் சுட்டுகிறது; ‘விட்டுத் தனியாக இல்லை’ என்பது தமிழில் உறவுசார் நுணுக்கத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: ஆண்டவரோடு உள்ள ஒன்றிப்பு, உறவு அல்லது அவர் வரையறுக்கும் வாழ்வுத்தளம் என்ற பவுலின் வழக்கமான சொற்றொடரைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: οὔτε ... οὔτε
  choice: இல்லை; ... உம் ... இல்லை
  rationale: இரு சமச்சீரான மறுப்புகளையும் தமிழில் தெளிவாகவும் இணையான அமைப்பிலும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: γυνή / ἀνήρ என்பவற்றை ‘பெண்/ஆண்’ என்றா, ‘மனைவி/கணவன்’ என்றா மொழிபெயர்ப்பது
  choice: பெண்/ஆண்
  alternative: மனைவி/கணவன்
  rationale: உடனடி சூழல் படைப்பிலும் வழிபாட்டிலும் ஆண் மற்றும் பெண்ணைப் பற்றிப் பொதுவாகப் பேசுகிறது. இவ்வசனம் பரஸ்பரச் சார்பைச் சமநிலைப்படுத்தும் பொதுக் கூற்றாக இருப்பதால், விரிந்த பொருளான ‘பெண்/ஆண்’ தேர்ந்தெடுக்கப்படுகிறது; கிரேக்கத்தின் திருமணப் பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘ஆண்டவருக்குள்’ என்ற மரபார்ந்த பவுலியச் சொற்றொடர் தக்கவைக்கப்பட்டுள்ளது; ‘விட்டுத் தனியாக இல்லை’ என்பது χωρὶς என்பதிலுள்ள பிரிவு மற்றும் பரஸ்பரச் சார்பு ஆகிய இரு நுணுக்கங்களையும் மிகையாக விளக்காமல் வழங்குகிறது.
