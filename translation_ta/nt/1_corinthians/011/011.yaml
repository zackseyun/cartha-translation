revisions:
- from: ஆயினும், ஆண்டவருக்குள் பெண் ஆணைவிட்டுத் தனியாக இல்லை; ஆணும் பெண்ணைவிட்டுத் தனியாக இல்லை.[a]
  to: ஆயினும், ஆண்டவருக்குள் பெண் ஆணிலிருந்து பிரிந்தவள் அல்ல; ஆணும் பெண்ணிலிருந்து பிரிந்தவன் அல்ல.[a]
  rationale: The revision replaces a potentially directional expression (‘விட்டுத்’) with a direct and idiomatic expression of separateness (‘இலிருந்து பிரிந்தவர் அல்ல’). It preserves the source’s mutual parallelism, the broad woman/man sense, and the qualifying sphere ‘in the Lord,’ while retaining the viable marital alternative in the footnote.
