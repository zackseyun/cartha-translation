  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: ta
  text: இதன் காரணமாக, பெண் தன் தலையின்மேல் அதிகாரத்தைக் கொண்டிருக்க வேண்டும்[a]—தேவதூதர்களின் காரணமாக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, விளக்கமாக: “தன் தலையில் அதிகாரத்தின் அடையாளத்தை அணிந்திருக்க வேண்டும்.” கிரேக்க உரையில் “அதிகாரம்” என்றே உள்ளது; “அடையாளம்” அல்லது “தலைமூடி” என்று வெளிப்படையாக இல்லை.'
    reason: alternative_reading
  - marker: b
    text: 'அல்லது: “தூதர்களின் காரணமாக.” எனினும், இங்கு “தேவதூதர்கள்” என்பதே அதிக வாய்ப்புள்ள பொருள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதன் காரணமாக
  rationale: முந்தைய வாதத்திலிருந்து வரும் காரண–விளைவு தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ὀφείλει
  choice: வேண்டும்
  rationale: தார்மிகக் கடமை அல்லது தகுந்த கட்டாயம் என்ற பொருளை அளிக்கிறது; சட்டரீதியான முழுமையான கட்டளையாக மிகைப்படுத்தவில்லை.
- source_word: ἡ γυνὴ
  choice: பெண்
  rationale: இங்கு வரும் ஒருமை, பெண்களைப் பொதுவாகச் சுட்டும் பிரதிநிதித்துவப் பயன்பாடாகப் புரிகிறது. ‘மனைவி’ என்று மொழிபெயர்ப்பது சூழலைத் தேவையின்றிக் குறுக்கும்.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: கிரேக்கச் சொல் நேரடியாக ‘அதிகாரம்’ என்கிறது; ‘அதிகாரத்தின் அடையாளம்’ அல்லது ‘தலைமூடி’ என்ற சொற்கள் மூலத்தில் இல்லை.
- source_word: ἔχειν
  choice: கொண்டிருக்க
  rationale: வினையின் அடிப்படைப் பொருளான ‘வைத்திருக்க/கொண்டிருக்க’ என்பதைக் காக்கிறது; ‘அணிந்திருக்க’ என்பது சூழலிலிருந்து சேர்க்கப்படும் விளக்கம்.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: தன் தலையின்மேல்
  rationale: இடத்தைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பாகத் தருவதோடு, அதன் சரியான தொடர்பைப் பற்றி உரையே தெளிவுபடுத்தாத இடத்தைத் திறந்தவாறே வைக்கிறது.
- source_word: διὰ τοὺς ἀγγέλους
  choice: தேவதூதர்களை முன்னிட்டு
  rationale: διά + குற்றுவேற்றுமையின் காரணம் அல்லது பொருட்டு என்ற வலிமையைத் தருகிறது. இச்சூழலில் ἄγγελοι என்பது பரலோகத் தூதர்களைக் குறிக்கும் வாய்ப்பே அதிகம்.
theological_decisions:
- issue: ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς என்பதன் பொருள்
  choice: ‘தன் தலையின்மேல் அதிகாரத்தைக் கொண்டிருக்க’ என்ற மூலச் சொல்லமைப்பை முதன்மை உரையில் வைத்தல்
  alternative: ‘தன் தலையில் அதிகாரத்தின் அடையாளத்தை அணிந்திருக்க’ அல்லது ‘அதிகாரத்தின் அடையாளமாகத் தலைமூடி அணிந்திருக்க’
  rationale: ‘அடையாளம்’ அல்லது ‘தலைமூடி’ என்பதற்கான சொல் கிரேக்கத்தில் இல்லை. விவாதத்துக்குரிய பொருளை முதன்மை உரை தீர்மானித்துவிடாமல், விளக்கவுரைப் பொருளை அடிக்குறிப்பில் தருகிறது.
- issue: ἀγγέλους என்பதன் குறிப்பு
  choice: தேவதூதர்கள்
  alternative: மனிதத் தூதர்கள் / செய்தியாளர்கள்
  rationale: ἄγγελος இரு பொருள்களையும் கொள்ளக்கூடியது என்றாலும், தகுதிச்சொல் இல்லாத பன்மை பவுலின் எழுத்துகளில் பொதுவாகப் பரலோகத் தூதர்களையே குறிக்கிறது. அவர்கள் ஏன் இங்கு குறிப்பிடப்படுகிறார்கள் என்ற கோட்பாடு எதையும் மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: γυνή என்பதன் வரம்பு
  choice: பெண்
  alternative: மனைவி
  rationale: உடனடியான பகுதி ஆண்–பெண் உறவைப் பொதுவாக விவாதிக்கிறது; திருமண உறவுக்கு மட்டும் வசனத்தை வரையறுக்க மூல உரை கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கடினமான ‘தலையின்மேல் அதிகாரம்’ என்ற சொற்றொடர் விளக்கத்தால் மென்மையாக்கப்படாமல் காக்கப்பட்டு, பொதுவான விளக்கவுரை அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
