id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: ta
  text: நானும் மேசியாவைப்[a] பின்பற்றுவதுபோல, நீங்கள் என்னைப் பின்பற்றுபவர்களாகுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கிறிஸ்து.”'
    reason: Χριστός என்பதற்கான மரபான மாற்று வடிவம்.
lexical_decisions:
- source_word: μιμηταί
  choice: பின்பற்றுகிறவர்கள்
  rationale: இச்சொல் ஒருவரின் முன்மாதிரியைப் பார்த்து அவரைப் போல நடப்பவர்களைக் குறிக்கிறது. ‘பின்பற்றுகிறவர்கள்’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருந்து, வெறும் சீடராக இருப்பதைவிட நடைமுறை எடுத்துக்காட்டைப் பின்பற்றும் கருத்தை வெளிப்படுத்துகிறது.
- source_word: μου
  choice: என்னை
  rationale: μιμηταί என்பதுடன் வரும் உரிமை வேற்றுமையைத் தமிழில் இயல்பாக ‘என்னைப் பின்பற்றுகிறவர்கள்’ என்று செயப்படுபொருள் வடிவில் வழங்குகிறது.
- source_word: γίνεσθε
  choice: ஆகுங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவின் ‘ஆகுதல்’ அல்லது அந்த நிலையை ஏற்றுக்கொள்ளுதல் என்ற இயக்கத்தைப் பாதுகாக்கிறது; வெறுமனே ‘இருங்கள்’ என்பதைவிட மூலத்திற்கு நெருக்கமானது.
- source_word: καθὼς
  choice: போல
  rationale: பவுலைப் பின்பற்றுவதையும் அவர் மேசியாவைப் பின்பற்றுவதையும் இணைக்கும் ஒப்பீட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κἀγὼ
  choice: நானும்
  rationale: καί + ἐγώ என்பதிலுள்ள ‘நானும்’ என்ற சேர்க்கை வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுவதால் அதன் பட்டப்பொருளைத் தெரிவிக்கும் ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் Χριστός ஒரு பட்டமாகத் தெளிவாக இயங்குகிறது. எனவே பட்டப்பொருளை வெளிப்படுத்தும் ‘மேசியா’ முதன்மை உரையில் வைக்கப்பட்டு, தமிழ் கிறிஸ்தவ மரபில் பரிச்சயமான ‘கிறிஸ்து’ மாற்று வடிவமாகக் குறிப்பிடப்படுகிறது.
- issue: இறுதி கூறிலுள்ள விடுபட்ட μιμητής என்பதை வழங்குதல்
  choice: ‘பின்பற்றுவதுபோல’ என்று பொருளை இயல்பாக நிறைவு செய்தல்
  alternative: ‘நானும் மேசியாவுக்குரியவனாக இருப்பதுபோல’ போன்ற சொற்படியான வடிவம்
  rationale: καθὼς κἀγὼ Χριστοῦ என்பதில் முந்தைய μιμηταί கருத்து விடுபட்ட நிலையில் புரிந்துகொள்ளப்படுகிறது. தமிழில் அதை நிரப்பாமல் மொழிபெயர்த்தால் ‘மேசியாவுக்குச் சொந்தமானவன்’ என்ற தவறான பொருள் உருவாகலாம். எனவே ஒப்பீட்டின் உண்மையான பொருள் தெளிவாக வெளிப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் ஒப்பீட்டு அமைப்பைத் தமிழின் இயல்பான முன்வைக்கப்பட்ட துணைவாக்கியமாக மாற்றி, பவுலின் முன்மாதிரி மேசியாவைப் பின்பற்றுவதால் வரையறுக்கப்படுகிறது என்பதைத் தெளிவாக்குகிறது.
