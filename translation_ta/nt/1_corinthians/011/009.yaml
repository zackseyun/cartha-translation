reference: 1 Corinthians 11:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: ta
  text: ஏனென்றால், ஆண் பெண்ணுக்காகப்[a] படைக்கப்படவில்லை; மாறாக, பெண் ஆணுக்காகப் படைக்கப்பட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெண்ணின் காரணமாக / ஆணின் காரணமாக” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க முன்னிடைச்சொல் காரணத்தையோ நோக்கத்தையோ குறிக்கக்கூடும்; படைப்பை அடிப்படையாகக் கொண்ட வாதத்தைப் பிரதிபலிக்க இங்கு “-க்காக” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனென்றால்
  rationale: γάρ தரும் விளக்கக் காரணத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; καί தரும் மென்மையான வலியுறுத்தலைத் தனிச்சொல்லாகச் சேர்த்தால் தமிழ் நடை செயற்கையாகிவிடும்.
- source_word: ἐκτίσθη
  choice: படைக்கப்படவில்லை / படைக்கப்பட்டாள்
  rationale: κτίζω என்பதன் நேரடியான படைப்பு சார்ந்த பொருளைப் பாதுகாக்கிறது. இரண்டாம் கூறில் கிரேக்கத்தில் விடுபட்டுள்ள வினைச்சொல் தமிழின் இயல்புக்கும் தெளிவுக்கும் ஏற்ப நிரப்பப்பட்டுள்ளது.
- source_word: ἀνὴρ
  choice: ஆண்
  rationale: படைப்புக் குறிப்பில் இது கணவன் என்ற குறுகிய பொருளை விட ஆணைக் குறிக்கும் பொதுப்பொருளில் வருகிறது.
- source_word: γυνὴ
  choice: பெண்
  rationale: படைப்புக் குறிப்பில் இது மனைவி என்ற குறுகிய பொருளை விட பெண்ணைக் குறிக்கும் பொதுப்பொருளில் வருகிறது.
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: பெண்ணுக்காக / ஆணுக்காக
  rationale: διά + accusative இங்கு நோக்கம், நன்மை அல்லது காரணம் ஆகிய நிழற்பொருள்களைத் தரக்கூடும். “-க்காக” படைப்பை நோக்கிய வாதத்தில் நோக்கம்/சார்பை இயல்பாகக் காட்டி, இணையான இரு கூறுகளின் சமநிலையையும் காக்கிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: இரு கூறுகளுக்கிடையிலான வலுவான எதிர்மறை மாறுபாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀνήρ/γυνή என்பவற்றை ஆண்/பெண் எனவா, கணவன்/மனைவி எனவா மொழிபெயர்ப்பது
  choice: ஆண்/பெண்
  alternative: கணவன்/மனைவி
  rationale: “படைக்கப்பட்டது” என்ற படைப்புக் காலச் சுட்டு, குறிப்பிட்ட திருமண உறவை மட்டும் அல்லாமல் ஆதியாகமப் படைப்பில் ஆண் மற்றும் பெண்ணைக் குறிக்கிறது. ஆகவே திருமணத்திற்கே வரம்பிடாமல் மூலத்தின் பரப்பை காக்கிறது.
- issue: διά + accusative என்பதன் காரண அல்லது நோக்க நிழற்பொருள்
  choice: -க்காக
  alternative: -ன் காரணமாக
  rationale: சூழலில் படைப்பின் நோக்கம் அல்லது சார்பு முன்னிலையில் இருப்பதாகத் தெரிந்தாலும், கிரேக்கச் சொற்றொடர் காரணத்தையும் குறிக்க முடியும். முதன்மை உரை இயல்பான நோக்கப் பொருளைக் கொடுக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இணையான வாக்கிய அமைப்பு பாதுகாக்கப்பட்டு, தமிழில் இயல்பான பாலின இசைவுக்காக இரண்டாம் கூறில் “படைக்கப்பட்டாள்” வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
