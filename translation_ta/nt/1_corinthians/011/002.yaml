  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: ta
  text: நீங்கள் எல்லாவற்றிலும் என்னை நினைவில் வைத்திருப்பதாலும், நான் உங்களுக்குக் கையளித்தபடியே மரபுகளை[a] உறுதியாகப் பற்றிக்கொண்டிருப்பதாலும் உங்களைப் பாராட்டுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘போதனைகள்’ அல்லது ‘அறிவுறுத்தல்கள்’; கிரேக்கத்தில் ‘மரபுகள்,’ அதாவது கையளிக்கப்பட்டவை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: பாராட்டுகிறேன்
  rationale: புகழ்தல் அல்லது பாராட்டுதல் என்ற பொருளை நேரடியாகவும், இப்பகுதியின் நேர்மறையான தொனிக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் மென்மையான உரைமாற்றத்தைக் குறிக்கிறது; தமிழில் தனிச் சொல்லைச் சேர்க்காமல் வாக்கியத்தைத் தொடங்குவது இயல்பாகவும் பொருள் இழப்பின்றியும் உள்ளது.
- source_word: ὅτι
  choice: —தாலும் … —தாலும்
  rationale: பவுல் பாராட்டுவதற்கான காரணங்களைத் தமிழில் இயல்பான காரணவியல் அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: πάντα μου μέμνησθε
  choice: எல்லாவற்றிலும் என்னை நினைவில் வைத்திருப்பது
  rationale: πάντα என்பதன் விரிவான எல்லையைப் பாதுகாத்து, μέμνησθε குறிக்கும் தொடர்ந்த நினைவுகூருதலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: καθὼς παρέδωκα ὑμῖν
  choice: நான் உங்களிடம் ஒப்படைத்தபடியே
  rationale: பவுல் பெற்றதை அல்லது போதனையை அவர்களிடம் கையளித்ததையும், அவர்கள் அதே முறையில் அதைப் பேணுவதையும் வெளிப்படுத்துகிறது.
- source_word: τὰς παραδόσεις
  choice: மரபுகளை
  rationale: παράδοσις என்பதன் ‘கையளிக்கப்பட்டவை’ என்ற அடிப்படைத் தொடர்பைப் பாதுகாக்கிறது; இதை வெறும் பொதுவான போதனையாகக் குறுக்கிவிடுவதில்லை.
- source_word: κατέχετε
  choice: உறுதியாகக் கடைப்பிடிப்பது
  rationale: பெற்றவற்றைத் தக்கவைத்து அவற்றைப் பின்பற்றுதல் என்ற செயற்பாட்டுச் சார்ந்த பொருளை தெளிவான தற்போதைய தமிழில் தருகிறது.
theological_decisions:
- issue: சபைச் சூழலில் παραδόσεις என்பதன் மொழிபெயர்ப்பு
  choice: மரபுகள்
  alternative: போதனைகள்; அறிவுறுத்தல்கள்
  rationale: இங்கு பவுல் கொரிந்தியரிடம் கையளித்த அப்போஸ்தலச் செய்தி அல்லது நடைமுறைகள் குறிக்கப்படுகின்றன. ‘மரபுகள்’ என்பது கையளித்தல் என்ற மூலச்சொல் தொடர்பைப் பாதுகாக்கிறது; அதேவேளை பிற்கால குறிப்பிட்ட சமயப்பிரிவுகளின் மரபுக் கோட்பாட்டை வசனத்திற்குள் இறக்குமதி செய்வதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘மரபுகள்’ என்ற சொல் ஏற்படுத்தக்கூடிய தெளிவின்மையை அடிக்குறிப்பு விளக்குகிறது; மூலத்தின் இறையியல் பரப்பைச் சுருக்கவில்லை.
