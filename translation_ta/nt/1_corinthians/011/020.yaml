reference: 1 Corinthians 11:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: συνερχομένων οὖν ὑμῶν ἐπὶ τὸ αὐτὸ οὐκ ἔστιν κυριακὸν δεῖπνον φαγεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: ta
  text: ஆகவே[a], நீங்கள் ஒரே இடத்தில் கூடிவரும்போது, அது ஆண்டவருடைய இரவு உணவை உண்பதாக அமையாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகவே, நீங்கள் ஒரே இடத்தில் கூடிவரும்போது, நீங்கள் ஆண்டவருடைய இரவு உணவை உண்பதில்லை.” அவர்களுடைய நடத்தை காரணமாக, அவர்கள் உண்பது இனி ஆண்டவருடைய இரவு உணவு என்று அழைக்கத் தகுதியானதாக இல்லை என்பதை இது வலியுறுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: நீங்கள் ... கூடிவரும்போது
  rationale: 'ὑμῶν என்பதுடன் சேர்ந்த மரபுத்தொடர் காலப் பொருளைத் தருகிறது: ‘நீங்கள் கூடிவரும்போது.’ ‘கூடிவருதல்’ என்பது சமூகமாக ஒன்றுகூடும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.'
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் கண்டிக்கப்பட்ட பிரிவினைகளிலிருந்து வரும் முடிவை இது குறிக்கிறது; ‘ஆகவே’ அந்தத் தர்க்கத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: ἐπὶ τὸ αὐτό
  choice: ஒரே இடத்தில்
  rationale: இந்த மரபுத்தொடர் ஒரே இடத்தில் அல்லது ஒரே கூட்டமாகச் சேர்வதைக் குறிக்கிறது. ‘ஒரே இடத்தில்’ என்பது συνερχομένων ஏற்கெனவே தரும் கூடுதல் கருத்தை மீண்டும் சொல்லாமல் இடம் சார்ந்த நுணுக்கத்தைக் காக்கிறது.
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: அது ... உண்பதற்காக அல்ல
  rationale: 'சுருக்கமான கிரேக்கக் கட்டமைப்பின் இறைச்சியமான மதிப்பீட்டைத் தமிழில் இயல்பாகக் காக்கிறது: அவர்களுடைய கூடுகையும் நடத்தையும் ஆண்டவருடைய இரவு உணவை உண்பதாகத் தகுதிபெறவில்லை. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.'
- source_word: κυριακὸν
  choice: ஆண்டவருடைய
  rationale: ‘ஆண்டவருக்குரிய’ அல்லது ‘ஆண்டவருக்குச் சொந்தமான’ என்ற உடைமைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δεῖπνον
  choice: இரவு உணவு
  rationale: இச்சொல் மாலை அல்லது பிரதான உணவைக் குறிக்கிறது. தமிழில் ‘இரவு உணவு’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: κυριακὸν δεῖπνον
  choice: ஆண்டவருடைய இரவு உணவு
  rationale: கிரேக்கப் பெயரடை–பெயர்ச்சொல் இணைப்பின் ‘ஆண்டவருக்குரிய உணவு’ என்ற பொருளைக் காக்கும், தமிழ் கிறிஸ்தவப் பயன்பாட்டிலும் புரிந்துகொள்ளத்தக்க சொற்றொடர்.
theological_decisions:
- issue: பவுல் அந்த உணவை உண்ணும் சாத்தியத்தையே மறுக்கிறாரா, அல்லது அவர்களுடைய நடைமுறை ஆண்டவருடைய இரவு உணவாகத் தகுதிபெறவில்லை என்கிறாரா?
  choice: அவர்களுடைய கூடுகையும் நடத்தையும் காரணமாக, அவர்கள் உண்பதை ஆண்டவருடைய இரவு உணவு என்று முறையாகக் கூற முடியாது என்ற மதிப்பீட்டு வலிமை முதன்மை உரையில் காக்கப்படுகிறது.
  alternative: ‘நீங்கள் ஆண்டவருடைய இரவு உணவை உண்பதில்லை’ அல்லது ‘உங்களால் ஆண்டவருடைய இரவு உணவை உண்ண முடியாது.’
  rationale: அடுத்த வசனங்கள் (21–22) உணவின் இருப்பை அல்ல, அதை அவர்கள் உண்ணும் பிரிவினையான முறையையே கண்டிக்கின்றன. எனினும் οὐκ ἔστιν ... φαγεῖν என்ற சுருக்கமான கட்டமைப்பின் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இராப்போஜனம்’ போன்ற இன்றைய வழக்கில் குறைவான மரபுச்சொல்லுக்குப் பதிலாக ‘இரவு உணவு’ தேர்ந்தெடுக்கப்பட்டது; கிரேக்கத்தின் சுருக்கமும் இறையியல் பதற்றமும் முதன்மை உரை மற்றும் அடிக்குறிப்பு வழியாகக் காக்கப்பட்டுள்ளன.
