revisions:
- from: ஆகவே[a], நீங்கள் ஒரே இடத்தில் கூடிவரும்போது, அது ஆண்டவருடைய இரவு உணவை உண்பதற்காக அல்ல.
  to: ஆகவே[a], நீங்கள் ஒரே இடத்தில் கூடிவரும்போது, அது ஆண்டவருடைய இரவு உணவை உண்பதாக அமையாது.
  rationale: The revision replaces a Tamil purpose construction with an evaluative formulation. It preserves the Greek’s compressed syntax and the contextual implication that the Corinthians’ conduct prevents their shared meal from properly qualifying as the Lord’s supper. The footnote retains the viable, more explicit alternative without resolving the construction beyond the evidence.
  reviewer_model: gpt-5.6-terra
