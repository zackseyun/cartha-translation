id: 1CO.11.3
reference: 1 Corinthians 11:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: ta
  text: ஆனால், ஒவ்வொரு ஆணின் தலை மெசியா[a], பெண்ணின் தலை ஆண்[b], மெசியாவின் தலை கடவுள் என்பதை நீங்கள் அறிய வேண்டும் என்று நான் விரும்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “தலை” என்பது “தோற்றுமூலம்” அல்லது “அதிகாரம் உடையவர்” என்றும் புரிந்துகொள்ளப்படலாம்; கிரேக்க மொழியிலுள்ள உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள “பெண்,” “ஆண்” ஆகிய சொற்களை “மனைவி,” “கணவன்” என்றும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: ஆனால் ... நீங்கள் அறிந்திருக்க வேண்டும் என்று விரும்புகிறேன்
  rationale: பவுலின் தனிப்பட்ட நோக்கத்தையும், முந்தைய உரையிலிருந்து வரும் மென்மையான மாற்றத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: παντὸς ἀνδρὸς
  choice: ஒவ்வொரு ஆணுக்கும்
  rationale: ἀνήρ என்பதன் பொதுவான ‘ஆண்/மனிதன்’ பொருளை இங்கு தக்கவைக்கிறது; ‘கணவன்’ என்ற சாத்தியம் அடுத்த இணைச் சொல்லாக்கத்துடன் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κεφαλή
  choice: தலை
  rationale: மூலத்தின் உருவகச் சொல்லை விளக்கமாகத் தீர்மானிக்காமல் அப்படியே தக்கவைத்து, அதன் பொருள் குறித்த உண்மையான விளக்கவியல் பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: ὁ Χριστός
  choice: மெசியா
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: γυναικός / ὁ ἀνήρ
  choice: பெண்ணுக்கு / ஆண்
  rationale: இரு சொற்களும் பொதுவாகப் பெண் மற்றும் ஆண் என்பதைக் குறிக்கலாம்; திருமண உறவைக் குறிக்கும் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὁ θεός
  choice: கடவுள்
  rationale: θεός என்பதற்கான இயல்பான, நிலையான நவீனத் தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: மூன்று இணையான கூறுகளிலும் κεφαλή என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘தலை’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘மூலம்’ அல்லது ‘அதிகாரம் செலுத்துபவர்’
  rationale: கிரேக்கச் சொல் உருவகமாகவே உள்ளது; அதன் விவாதத்திற்குரிய பொருளை மொழிபெயர்ப்பிலேயே ஒருதலைப்பட்சமாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.
- issue: ἀνήρ / γυνή என்பதை ஆண்/பெண் என்றா கணவன்/மனைவி என்றா மொழிபெயர்ப்பது
  choice: முதன்மை உரையில் ‘ஆண்/பெண்’
  alternative: ‘கணவன்/மனைவி’
  rationale: வாக்கியத்தின் பொதுவான இணை அமைப்பு ஆண்/பெண் வாசிப்பை ஆதரிக்கிறது; எனினும் சொற்களுக்கும் சுற்றியுள்ள சூழலுக்கும் ஏற்ற திருமண வாசிப்பு அடிக்குறிப்பில் விடப்படுகிறது.
- issue: ‘மெசியாவுக்குத் தலை கடவுள்’ என்ற இறுதிக் கூறு
  choice: கூறை விரிவாக்காமலும் மெலிதாக்காமலும் நேரடியாக மொழிபெயர்த்தல்
  alternative: உறவை ‘செயல்பாட்டு ஒழுங்கு’ என்று குறிப்பாக விளக்கும் பொழிப்புரைகள்
  rationale: மூலத்தின் இறையியல் பதற்றத்தை அப்படியே வைத்திருந்து, குமாரனின் இயல்பைப் பற்றிய எந்த விளக்கத்தையும் மொழிபெயர்ப்புக்குள் இறக்குமதி செய்யாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் வகையில் இயல்பானதும் கண்ணியமானதும். மூலத்தின் மூன்று இணைக் கூறுகளும் சுருக்கமாகப் பாதுகாக்கப்பட்டுள்ளன; ‘தலை’ என்ற உருவகம் விளக்கிப் பொழிப்புரைக்கப்படவில்லை.
