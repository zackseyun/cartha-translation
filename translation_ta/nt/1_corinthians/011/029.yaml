source:
  edition: SBLGNT
  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: ta
  text: ஏனெனில், உடலை[a][b]ப் பகுத்தறியாமல் சாப்பிட்டுக் குடிக்கிறவன், தனக்கே தீர்ப்பாகச் சாப்பிட்டுக் குடிக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘உடல்’ என்பதற்குப் பதிலாக ‘கர்த்தருடைய உடல்’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: ‘உடலை வேறுபடுத்தி அறியாமல்’ என்றும் மொழிபெயர்க்கலாம். இது கர்த்தருடைய இராப்போஜனத்தின் முக்கியத்துவத்தை உணர்வதையோ, ஒன்றுகூடியுள்ள விசுவாசிகளாகிய உடலை உணர்வதையோ, இரண்டையுமோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: தீர்ப்பு
  rationale: இச்சொல் நீதித்தீர்ப்பு அல்லது நியாயத்தீர்ப்பைக் குறிக்கிறது. அடுத்துவரும் வசனங்களில் இறுதி ஆக்கினைத்தீர்ப்பை அல்ல, கடவுளின் தற்கால ஒழுக்கப்படுத்துதலைப் பற்றிப் பேசுவதால், ‘தீர்ப்பு’ என்பது பொருளை மிகைப்படுத்தாமல் தருகிறது.
- source_word: ἑαυτῷ
  choice: தன்மீது ... வரவழைக்கும்
  rationale: தன்மைச் சுட்டும் நான்காம் வேற்றுமை, சாப்பிட்டுக் குடிப்பவன் தனக்கே பாதகமான தீர்ப்பைச் சம்பாதித்துக்கொள்வதைத் தெரிவிக்கிறது; இந்தத் தமிழாக்கம் அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διακρίνων
  choice: தன்மையை உணர்ந்து
  rationale: சரியான வேறுபாட்டைக் கண்டறிதல், மதிப்பிடுதல், உணர்தல் ஆகிய பொருள் நிழல்களை இச்சொல் கொண்டுள்ளது. ‘தன்மையை உணர்ந்து’ என்பது வெறும் அறிதலைவிட ஆழமான மதிப்புணர்வைத் தருகிறது; அதேவேளை எதிலிருந்து வேறுபடுத்துவது என்பதைச் சேர்த்து விளக்கவில்லை.
- source_word: τὸ σῶμα
  choice: உடல்
  rationale: கிடைக்கக்கூடிய தொடக்ககால வாசகம் ‘உடல்’ என்று மட்டுமே உள்ளது. கிறிஸ்துவின் உடலா, விசுவாசிகளின் ஒன்றுகூடிய உடலா, அல்லது இரண்டுமா என்ற சூழல்சார் தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: சாப்பிட்டுக் குடிக்கிறவன்
  rationale: பெயர்ச்சொல் நிலையில் வரும் ஒருமை வினையெச்சத் தொடரை, பொதுவான ஒருமையாக நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: μὴ διακρίνων
  choice: உடலின் தன்மையை உணராமல்
  rationale: கிரேக்கத்தின் மறுப்புப் பொருளுள்ள வினையெச்ச அமைப்பைத் தமிழில் இயல்பான எதிர்மறை வினையெச்சமாகத் தருகிறது; அதை நிபந்தனை வாக்கியமாக மாற்றாமல் மூலத்தின் அமைப்பை நெருக்கமாகப் பேணுகிறது.
theological_decisions:
- issue: கர்த்தருடைய இராப்போஜனச் சூழலில் ‘உடல்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘உடல்’ என்ற தெளிவுபடுத்தப்படாத சொல்லையே வைத்தல்
  alternative: ‘கர்த்தருடைய உடல்’ அல்லது ‘விசுவாசிகளாகிய உடல்’ என்று குறிப்பாக்குதல்
  rationale: கிரேக்க உரை ‘உடல்’ என்று மட்டுமே சொல்கிறது. இயேசுவின் பலியுடனான விருந்தின் தொடர்பையும், கொரிந்தியர் ஒருவரையொருவர் அவமதித்ததையும் சூழல் உள்ளடக்குவதால், எந்த ஒரு பொருளையும் மட்டும் கட்டாயப்படுத்தாமல் இறையியல் பதற்றத்தைப் பாதுகாக்க வேண்டும்.
- issue: κρίμα என்பதன் வலிமை
  choice: தீர்ப்பு
  alternative: ஆக்கினைத்தீர்ப்பு
  rationale: 32ஆம் வசனத்தில் உலகத்தோடு ஆக்கினைத்தீர்ப்படையாதபடி விசுவாசிகள் ஒழுக்கப்படுத்தப்படுவதாகப் பவுல் கூறுகிறார். எனவே இறுதி அழிவை உணர்த்தக்கூடிய ‘ஆக்கினைத்தீர்ப்பு’ என்பதைவிட ‘தீர்ப்பு’ இங்கு பொருத்தமானது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சாப்பிட்டுக் குடிக்கிறவன்’ என்பது மூலத்தின் பொதுவான ஒருமையைக் காக்கிறது. ‘உடல்’ என்பதன் சுருக்கமும் பொருள் தெளிவின்மையும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறிகள் முதன்மை உரையில் [a], [b] என இடம்பெற்றுள்ளன.
