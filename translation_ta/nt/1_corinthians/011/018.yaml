id: 1CO.11.18
reference: 1 Corinthians 11:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: ta
  text: ஏனெனில், முதலாவதாக, நீங்கள் சபையாகக் கூடிவரும்போது உங்களிடையே பிளவுகள் இருப்பதாகக் கேள்விப்படுகிறேன்; அதை ஓரளவு நம்புகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον μὲν
  choice: முதலாவதாக
  rationale: வாதத்தில் முதல் குறிப்பை அறிமுகப்படுத்தும் சொற்றொடரின் உரையாடல் செயல்பாட்டைப் பேணுகிறது; நிறைவு பெறாத μέν...δέ அமைப்பைத் தமிழில் செயற்கையாகக் காட்டவில்லை.
- source_word: συνερχομένων ὑμῶν
  choice: நீங்கள் ... கூடிவரும்போது
  rationale: இறைமொழியின் genitive absolute அமைப்பை இயல்பான காலவினைத் தொடராகத் தருகிறது; இவ்வதிகாரத்தில் மீண்டும் வரும் ஒன்றுகூடுதலையும் பிரதிபலிக்கிறது.
- source_word: ἐν ἐκκλησίᾳ
  choice: சபையாக
  rationale: கட்டடத்தைக் குறிக்காமல், ஒன்றுகூடிய விசுவாசக் கூட்டத்தைக் குறிக்கும் சூழல்சார்ந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀκούω
  choice: கேள்விப்படுகிறேன்
  rationale: பவுல் மற்றவர்களிடமிருந்து பெற்ற செய்தியைக் குறிக்கும் இச்சூழலில், வெறும் ஒலியைக் ‘கேட்கிறேன்’ என்பதைக் காட்டிலும் அறிக்கைவழி அறிதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σχίσματα
  choice: பிளவுகள்
  rationale: சமூகத்துக்குள் ஏற்பட்ட பிரிவுகளைக் குறிக்கிறது; முறையாக அமைந்த கட்சிகள் என்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: ὑπάρχειν
  choice: இருப்பதாக
  rationale: பிளவுகள் அவர்களிடையே உள்ளன என்ற அறிவிக்கப்பட்ட நிலையைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: καὶ μέρος τι
  choice: ஓரளவு
  rationale: அந்தச் செய்தியை பவுல் வரையறுக்கப்பட்ட அளவிலேயே ஏற்றுக்கொள்கிறார் என்ற நுட்பத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: πιστεύω
  choice: நம்புகிறேன்
  rationale: சூழலில் முன் சொல்லப்பட்ட செய்தியே மறைமுகச் செயப்படுபொருள்; தமிழில் ‘அதை’ சேர்ப்பது தெளிவை அளிக்கிறது.
theological_decisions:
- issue: ἐκκλησία என்பதன் சூழல்சார்ந்த பொருள்
  choice: ஒன்றுகூடிய விசுவாசக் கூட்டத்தைக் குறிக்கும் ‘சபையாக’
  alternative: ‘சபையில்’ அல்லது ‘கூட்டத்தில்’
  rationale: இங்கு கவனம் கட்டடத்திலோ நிறுவன அமைப்பிலோ அல்ல; கர்த்தருடைய இராப்போஜனத்திற்காக கொரிந்தியர்கள் ஒன்றுகூடுவதில்தான். ‘சபையாக’ என்பது அவர்களின் கூட்டு அடையாளத்தையும் நிகழும் ஒன்றுகூடுதலையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்கு புரியும் வகையில் கண்ணியமான, இயல்பான நடை. ‘சபையாகக் கூடிவரும்போது’ என்பது கட்டட மையப் பொருளைத் தவிர்த்து, கூடிவந்த திரளைக் காட்டுகிறது.
