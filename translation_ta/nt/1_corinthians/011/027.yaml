  rationale: மூல கிரேக்கம் பிரிநிலை இணைப்பான ἢ என்பதையே பயன்படுத்துகிறது; வழிபாட்டு மரபுக்காக அதன் உரை வலிமை மாற்றப்படவில்லை.
- issue: ἔνοχος உடன் வரும் பிறப்புவேற்றுமையின் பொருள்
  choice: ஆண்டவரின் உடலையும் இரத்தத்தையும் பொறுத்தவரையில் குற்றவாளி என்ற தொடர்பு திறந்தவாறே வைக்கப்பட்டது.
  alternative: ஆண்டவரின் உடலையும் இரத்தத்தையும் அவமதித்தவர் அல்லது அவற்றைக் கொன்றவர் என்று குறிப்பாக விளக்குவது.
