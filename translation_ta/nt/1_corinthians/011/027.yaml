- source_word: ἢ
  choice: அல்லது
  rationale: கிரேக்கத்தின் பிரிநிலை இணைப்பை அப்படியே பேணுகிறது; அதை ‘மற்றும்’ என்று ஒத்திசைக்கவில்லை.
- source_word: πίνῃ τὸ ποτήριον
  choice: கிண்ணத்தைக் குடித்தாலோ
  rationale: கிண்ணம் அதன் உள்ளடக்கத்தைக் குறிக்கும் கிரேக்க ஆகுபெயர் வழக்கைப் பேணுகிறது; ‘கிண்ணத்திலிருந்து’ என்று மூலத்தில் இல்லாத விரிவைச் சேர்க்கவில்லை.
- source_word: τοῦ κυρίου
  choice: ஆண்டவரின்
  rationale: உடைமை அல்லது தொடர்பைக் குறிக்கும் வேற்றுமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; κύριος என்பதற்கான கண்ணியமான நவீனத் தமிழ் வடிவம்.
- source_word: ἀναξίως
  choice: தகாத முறையில்
  rationale: இது நபரின் உள்ளார்ந்த தகுதியை வரையறுக்கும் பெயரடை அல்ல; உண்ணுதல் அல்லது குடித்தல் நிகழும் முறையை விவரிக்கும் வினையடை என்பதைத் தெளிவாக்குகிறது.
- source_word: ἔνοχος ἔσται
  choice: குற்றவாளியாவார்
  rationale: குற்றப்பொறுப்பு அல்லது சட்டரீதியான பொறுப்புக்கு ஆளாதல் என்ற கடுமையான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος
  choice: உடலையும் இரத்தத்தையும் பொறுத்தவரையில்
  rationale: ἔνοχος உடன் வரும் பிறப்புவேற்றுமை எந்த ஒன்றைக் குறித்து குற்றப்பொறுப்பு உள்ளது என்பதைச் சுட்டலாம். இந்த வடிவம் அதன் துல்லியமான சட்ட நுணுக்கத்தை மிகையாகத் தீர்மானிக்காமல் தொடர்பைப் பேணுகிறது.
