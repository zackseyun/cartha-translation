  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: ta
  text: ஆகையால், எவராவது ஆண்டவரின் அப்பத்தைத் தகாத முறையில்[a] உண்டாலோ அல்லது ஆண்டவரின் கிண்ணத்தைக் குடித்தாலோ, அவர் ஆண்டவரின் உடலையும் இரத்தத்தையும் பொறுத்தவரையில் குற்றவாளியாவார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தகாத முறையில்” என்பது ஒரு வினையடையின் மொழிபெயர்ப்பு. அது ஒருவர் உள்ளார்ந்த முறையில் தகுதியுள்ளவரா என்பதை அல்ல, அவர் எவ்வாறு உண்கிறார் அல்லது குடிக்கிறார் என்பதையே விவரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “ஆண்டவரின் உடலுக்கும் இரத்தத்துக்கும் குற்றவாளியாவார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கக் கட்டமைப்பு ஆண்டவரின் உடலையும் இரத்தத்தையும் சார்ந்த குற்றப்பொறுப்பைக் குறிக்கிறது; அந்தத் தொடர்பைத் தெளிவாகவும் மிகையாக விளக்காமலும் காட்ட முதன்மை உரையில் “பொறுத்தவரையில்” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: ஆகையால்
  rationale: முந்தைய விவாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
