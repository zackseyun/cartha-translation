- issue: உண்ணுதல், குடித்தல் இவற்றுக்கு இடையிலான ἢ என்பதன் வலிமை
  choice: இரண்டு செயல்களில் எதையேனும் தகாத முறையில் செய்தால் எச்சரிக்கை பொருந்தும் வகையில் ‘அல்லது’ என்று மொழிபெயர்க்கப்பட்டது.
