source:
  edition: SBLGNT
  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: ta
  text: ஆனால், யாராவது வாதாட விரும்புகிறவராகத் தோன்றினால்[a], இப்படிப்பட்ட வழக்கம்[b] எங்களிடம் இல்லை; கடவுளுடைய திருச்சபைகளிடமும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சண்டைக்காரராக” அல்லது “சச்சரவில் நாட்டமுள்ளவராக.”
    reason: lexical_alternative
  - marker: b
    text: “இப்படிப்பட்ட வழக்கம்” என்பது வாதாடும் பழக்கத்தையோ, முந்தைய வசனங்களில் விவாதிக்கப்பட்ட நடைமுறையையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: தோன்றினால்
  rationale: இறந்துநிலை வினையுடன் வரும் கிரேக்கச் சொல்லமைப்பின் ‘இருப்பதாகத் தோன்றுதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; இது ஒருவரின் எண்ணமா அல்லது வெளிப்படும் மனப்பாங்கா என்பதைத் தீர்மானிக்கவில்லை.
- source_word: φιλόνεικος
  choice: வாதாட விரும்புகிறவர்
  rationale: சண்டை அல்லது சர்ச்சையில் ஈடுபட நாட்டமுள்ளவரைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருந்து, வெறும் கருத்து வேறுபாட்டை விட மோதல் நாட்டத்தை வெளிப்படுத்துகிறது.
- source_word: τοιαύτην
  choice: இப்படிப்பட்ட
  rationale: முன்னர் கூறப்பட்ட ஒரு வகையான நடைமுறையைச் சுட்டுகிறது; அதன் சரியான தொடர்பை அதிகமாகக் குறிப்பிட்டு ambiguity-ஐ நீக்காமல் பாதுகாக்கிறது.
- source_word: συνήθειαν
  choice: வழக்கம்
  rationale: பழக்கமாக அல்லது சமூகத்தில் நிலைபெற்ற நடைமுறையாக இருப்பதைத் தெரிவிக்கிறது; ‘நடைமுறை’ அல்லது ‘பழக்கம்’ என்பவற்றைக் காட்டிலும் இச்சூழலில் நிறுவப்பட்ட பொதுப் பயன்பாட்டை இயல்பாகக் குறிக்கிறது.
- source_word: οὐκ ἔχομεν
  choice: எங்களிடம் இல்லை
  rationale: கிரேக்கத்தின் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது; ‘நாங்கள் பின்பற்றுவதில்லை’ அல்லது ‘அனுமதிப்பதில்லை’ என்ற வலுவான விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: கடவுளுடைய திருச்சபைகள்
  rationale: இறைவனுக்குச் சொந்தமான விசுவாசக் கூட்டங்களைக் குறிக்கும் மரபான, கண்ணியமான தமிழ் வடிவம்; கிரேக்க உடைமைத் தொடர்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘இப்படிப்பட்ட வழக்கம்’ என்பதன் குறிப்பு
  choice: வாதாடும் வழக்கையா அல்லது முந்தைய வசனங்களில் விவாதிக்கப்பட்ட நடைமுறையையா குறிக்கிறது என்பதை மொழிபெயர்ப்பில் தீர்மானிக்காமல் பொதுவாக விடுதல்
  alternative: ‘வாதாடும் வழக்கம் எங்களிடம் இல்லை’ என்று வெளிப்படையாகக் குறிப்பிடுதல்; அல்லது முந்தைய தலைக்கவச நடைமுறையை நிராகரிப்பதே இல்லாத வழக்கம் என்று குறிப்பிடுதல்
  rationale: τοιαύτην συνήθειαν என்பது சுருக்கமானதும் சூழலில் பலவாறு புரிந்துகொள்ளக்கூடியதும் ஆகும். ஆகவே மூலத்தில் உள்ள உண்மையான விளக்கத் தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திருச்சபைகள்’ என்பது பவுலின் விசுவாசக் கூட்டங்களுக்கான சொல்லைப் பிரதிபலிக்கும் மரபான வடிவம். மூலத்தின் சுருக்கமும் கருத்துத் தெளிவின்மையும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
