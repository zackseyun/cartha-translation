  source_fidelity: மூலக் கிரேக்கத்தின் நிபந்தனை அமைப்பு, δοκεῖ-யின் ‘தோன்றுதல்’ என்ற திறந்த நுணுக்கம், φιλόνεικος-இன் வாத/சச்சரவு மனப்பாங்கு, மற்றும் τοιαύτην συνήθειαν என்பதன் திட்டமிட்ட தெளிவின்மை ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ‘எங்களிடம் இல்லை; கடவுளுடைய திருச்சபைகளிடமும் இல்லை’ என்பது οὐκ ἔχομεν … οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ என்பதற்கு பொருத்தமானது.
