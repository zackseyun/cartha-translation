reference: 1 Corinthians 11:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: ta
  text: ஆகவே, என் சகோதரர்களே[a], நீங்கள் சாப்பிடுவதற்காகக் கூடிவரும்போது, ஒருவருக்கொருவர் காத்திருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சகோதர சகோதரிகளே”; கிரேக்கத்தில் “சகோதரர்களே” என்று உள்ளது. இந்த ஆண்பால் வடிவம் பெண்களும் அடங்கிய முழுச் சபையினரையும் அழைக்க அடிக்கடி பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: ஆகவே
  rationale: முந்தைய கண்டிப்பிலிருந்து நடைமுறை முடிவை அறிமுகப்படுத்தும் ஊக இணைப்பின் தர்க்க வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: உடைமைப் பெயருடனான ஆண்பால் பன்மை விளியை வடிவத்துக்கு உண்மையாகவும் இயல்பான தமிழ் அழைப்பாகவும் தருகிறது; முழுச் சபையையும் குறிக்கும் உள்ளடக்கப் பயன்பாடு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: συνερχόμενοι
  choice: நீங்கள் ... கூடிவரும்போது
  rationale: கட்டளைக்குரிய சூழலைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்தை இயல்பான காலத் துணைவாக்கியமாகக் காட்டுகிறது.
- source_word: εἰς τὸ φαγεῖν
  choice: சாப்பிடுவதற்காக
  rationale: εἰς உடன் வரும் வினையெச்சப் பெயரின் நோக்கப் பொருளைத் தெளிவாகக் காக்கிறது; உணவு எது என்பதை மூலத்தைவிடக் கூடுதலாகக் குறிப்பிடவில்லை.
- source_word: ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பரச் சுட்டுப்பெயரின் பொருளை வழக்கமான நவீன தமிழில் தருகிறது.
- source_word: ἐκδέχεσθε
  choice: காத்திருங்கள்
  rationale: சிலர் மற்றவர்களுக்கு முன்பாகச் சாப்பிட்ட சூழலில், அனைவரும் சேர்ந்தபின் உணவைத் தொடங்குமாறு கூறும் நடைமுறைத் திருத்தமாக இது பொருந்துகிறது; 'வரவேற்றுக்கொள்ளுங்கள்' என்ற சாத்தியமான பொருளையும் சூழல் தீர்மானிப்பதையும் பதிவு செய்கிறது.
theological_decisions:
- issue: ἀδελφοί என்ற ஆண்பால் அழைப்பின் பிரதிநிதித்துவப் பயன்பாடு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று வைத்து, அது பெண்களையும் உள்ளடக்கிய முழுச் சபையைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: கிரேக்கச் சொல் இலக்கணத்தில் ஆண்பால் பன்மையாக இருந்தாலும், கலப்புப் பாலினச் சபையினருக்கான உள்ளடக்க அழைப்பாக அடிக்கடி பயன்படுகிறது. முதன்மை உரை மூல வடிவத்தைக் காக்கிறது; அதன் பரந்த குறிப்பு அடிக்குறிப்பில் தெளிவாகிறது.
- issue: ἐκδέχεσθε என்பதன் சூழல்சார் பொருள்
  choice: ‘காத்திருங்கள்’
  alternative: ‘ஏற்றுக்கொள்ளுங்கள்’ அல்லது ‘வரவேற்றுக்கொள்ளுங்கள்’
  rationale: 11:21-இல் ஒருவர் மற்றவருக்கு முன்பாக உண்பது குற்றமாகச் சுட்டப்படுவதால், இங்கே ‘ஒருவருக்கொருவர் காத்திருங்கள்’ என்பதே உடனடிச் சூழலுக்கு மிகவும் இயல்பானது; வினையின் வேறு சாத்தியமான நுண்பொருளை முற்றிலும் மறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் நடை. ‘சாப்பிடுவதற்காக’ என்பது இயல்பான பேச்சு-எழுத்து வழக்கைத் தருகிறது; ‘கூடிவரும்போது’ இந்த அதிகாரத்தில் மீளும் சபைக் கூடுகைச் சூழலைக் காக்கிறது.
