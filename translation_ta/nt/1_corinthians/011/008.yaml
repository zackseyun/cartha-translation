  rationale: The revision replaces “உண்டானவன்/உண்டானவள்” with “வந்தவன்/வந்தவள்” to represent the Greek source/origin relation more closely and naturally, without implying more than the text states. It retains the draft’s sound man/woman rendering and its alternative-reading footnote.
