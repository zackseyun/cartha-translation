id: 1CO.11.8
reference: 1 Corinthians 11:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀνὴρ ἐκ γυναικός, ἀλλὰ γυνὴ ἐξ ἀνδρός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: ta
  text: ஏனெனில் ஆண் பெண்ணிலிருந்து வந்தவன் அல்ல; மாறாக, பெண் ஆணிலிருந்து வந்தவள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கணவன் மனைவியிலிருந்து வந்தவன் அல்ல; மாறாக, மனைவி கணவனிலிருந்து வந்தவள்.” கிரேக்கச் சொற்கள் ‘ஆண்/பெண்’ என்றும் ‘கணவன்/மனைவி’ என்றும் பொருள்படலாம்; இங்கு படைப்பைப் பற்றிய விரிவான பொருள் முதன்மைப்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; தமிழில் வாதத் தொடரை இயல்பாக இணைக்கிறது.
- source_word: ἀνήρ / ἀνδρός
  choice: ஆண் / ஆணிலிருந்து
  rationale: இச்சூழலில் படைப்பின் தோற்ற ஒழுங்கே கருத்தாக இருப்பதால், ‘கணவன்’ என்பதைவிட பாலின வகையைக் குறிக்கும் ‘ஆண்’ பொருத்தமானது.
- source_word: γυνή / γυναικός
  choice: பெண் / பெண்ணிலிருந்து
  rationale: படைப்பைப் பற்றிய விரிந்த ஆண்–பெண் எதிரிணையைப் பாதுகாக்கிறது; ‘மனைவி’ எனக் குறுக்கவில்லை.
- source_word: ἐκ / ἐξ
  choice: இலிருந்து
  rationale: தோற்றம் அல்லது மூலம் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀλλά
  choice: மாறாக
  rationale: இரு கூற்றுகளுக்கிடையேயான வலுவான எதிர்மறை மாறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: ἐστιν
  choice: உண்டானவன் / உண்டானவள்
  rationale: கிரேக்கத்தில் எளிய ‘இருக்கிறான்/இருக்கிறாள்’ என்ற வினை இருந்தாலும், ἐκ உடனான தோற்றப் பொருளைத் தமிழில் தெளிவாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
theological_decisions:
- issue: ἀνήρ/γυνή என்பவற்றை ‘ஆண்/பெண்’ என்றா, ‘கணவன்/மனைவி’ என்றா மொழிபெயர்ப்பது
  choice: ஆண்/பெண்
  alternative: கணவன்/மனைவி
  rationale: பவுலின் கூற்று திருமண உறவை மட்டும் குறுக்காமல் படைப்புக் கதையிலுள்ள தோற்றத்தை அடிப்படையாகக் கொண்டுள்ளது. எனினும், கிரேக்கச் சொற்கள் இரு பொருள்களையும் கொள்ளக்கூடியவை என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தெளிவானதும் கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. ‘உண்டானவன்/உண்டானவள்’ என்பது மூலத்தின் தோற்றப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
