id: 1CO.11.26
reference: 1 Corinthians 11:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் இந்த அப்பத்தைச் சாப்பிட்டு, கிண்ணத்திலிருந்து குடிக்கும் ஒவ்வொரு முறையும்[a], ஆண்டவருடைய மரணத்தை அவர் வரும்வரை அறிவிக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த அப்பத்தைச் சாப்பிட்டு, கிண்ணத்திலிருந்து குடிக்கும்போதெல்லாம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: ஒவ்வொரு முறையும்
  rationale: குறிப்பிடப்படாத விதத்தில் மீண்டும் மீண்டும் நிகழும் செயலைக் குறிக்கிறது; ‘ஒவ்வொரு முறையும்’ என்பது அதன் தொடர்நிகழ்வுப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான விளக்க ஆதாரத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐσθίητε
  choice: சாப்பிட்டு
  rationale: ἐὰν உடன் வரும் நிகழ்கால துணைவினையின் காலவரையற்ற செயற்பாட்டைத் தமிழ் வினையெச்ச அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄρτον τοῦτον
  choice: இந்த அப்பத்தை
  rationale: ἄρτος என்பதற்கு இச்சூழலில் வழக்கமானதும் தெளிவானதுமான ‘அப்பம்’ பொருத்தமானது; τοῦτον என்பதன் சுட்டுப்பொருளை ‘இந்த’ பாதுகாக்கிறது.
- source_word: τὸ ποτήριον
  choice: அந்தக் கிண்ணத்திலிருந்து
  rationale: மூலத்தில் ‘இந்த’ என்ற சுட்டுப்பெயர் இல்லை; குறிப்பிட்ட கிண்ணத்தைச் சுட்டும் பெயர்ச்சொல் உருபைத் தமிழில் இயல்பாக ‘அந்தக்’ எனக் காட்டுகிறது. ‘கிண்ணத்திலிருந்து குடித்தல்’ என்பது தமிழில் இயல்பான சொல்லாட்சி.
- source_word: καταγγέλλετε
  choice: அறிவிக்கிறீர்கள்
  rationale: பொதுவாக அறிவித்தல் அல்லது பிரகடனம் செய்தல் என்ற வெளிப்படையான பொருளை, தேவையற்ற சமயத் தொழில்நுட்பச் சாயல் இன்றி வழங்குகிறது.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: ஆண்டவருடைய மரணத்தை
  rationale: மூலத்தின் உடைமைத் தொடர்பையும் சொற்றொடரின் ஆழ்ந்த தொனியையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: பவுலின் இச்சூழலில் κύριος என்பதற்கான நிலையான, கண்ணியமான தமிழ் இணைச்சொல்.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: ஆண்டவர் வரும்வரை
  rationale: கால எல்லையை இயல்பான தமிழில் தருகிறது; குழப்பத்தைத் தவிர்க்க, கிரேக்கத்தில் சூழலால் புரிந்துகொள்ளப்படும் எழுவாயைத் தமிழில் மீண்டும் கூறுகிறது.
theological_decisions:
- issue: ἄχρι οὗ ἔλθῃ என்பதில் மறைந்துள்ள எழுவாயின் குறிப்பு
  choice: வருபவர் ஆண்டவர் இயேசு என்பதை ‘ஆண்டவர் வரும்வரை’ என்று வெளிப்படுத்துதல்
  alternative: ‘அவர் வரும்வரை’
  rationale: முந்தைய சொற்றொடரில் உள்ள ‘ஆண்டவர்’ என்பதே மிக இயல்பான முன்னோடி; தமிழில் பெயரை மீண்டும் கூறுவது குறிப்பைத் தெளிவாக்குகிறது, ஆனால் கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: ஆண்டவருடைய இராப்போஜனம் குறித்த சொல்வடிவு
  choice: அப்பத்தைச் சாப்பிடுதல், கிண்ணத்திலிருந்து குடித்தல், ஆண்டவருடைய மரணத்தை அறிவித்தல் ஆகியவற்றை மட்டும் நேரடியாகக் கூறுதல்
  alternative: சடங்கு அல்லது நினைவுகூரல் சார்ந்த ஒரு குறிப்பிட்ட பிரிவின் விளக்கத்தைச் சேர்த்துப் பொழிப்புரை செய்தல்
  rationale: வசனம் இந்தச் செயல் ஆண்டவருடைய மரணத்தை அறிவிக்கிறது எனக் கூறுகிறது; ஆனால் முழுமையான திருவருட்சாதன அல்லது நினைவுவாத விளக்கத்தை வரையறுப்பதில்லை. ஆகவே அந்த இறையியல் இழுபறி தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் ‘இந்த அப்பம்’ என்றாலும் ‘கிண்ணம்’ என்பதற்கு சுட்டுப்பெயர் இல்லாத வேறுபாடு பாதுகாக்கப்பட்டுள்ளது; தமிழின் இயல்புக்காக ‘அந்தக் கிண்ணம்’ என வழங்கப்பட்டுள்ளது.
