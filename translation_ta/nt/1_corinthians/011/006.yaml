source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: ta
  text: ஏனெனில், ஒரு பெண் தலையை மூடிக்கொள்ளாவிட்டால், அவளும் தலைமுடியைக் கத்தரித்துக்கொள்ளட்டும்; ஆனால், தலைமுடியைக் கத்தரித்துக்கொள்வதோ தலையை மழித்துக்கொள்வதோ ஒரு பெண்ணுக்கு இழிவானது என்றால், அவள் தலையை மூடிக்கொள்ளட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனம் முழுவதிலும் ‘பெண்’ என்பதற்குப் பதிலாக ‘மனைவி’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல்லான γυνή, சூழலைப் பொறுத்து ‘பெண்’ அல்லது ‘மனைவி’ எனப் பொருள்படும்.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: தன் தலையை மூடிக்கொள்ளவில்லை / தன் தலையை மூடிக்கொள்ளட்டும்
  rationale: வினைச்சொல் ‘மூடுதல்’ அல்லது ‘முக்காடிடுதல்’ எனப் பொருள்படும். சூழல் தலை மூடுதலைக் குறிக்கிறது; குறிப்பிட்ட ஆடையைத் தீர்மானிக்காமல், தமிழில் இயல்பாக இருக்க ‘தலையை’ வெளிப்படையாகச் சேர்த்துள்ளோம்.
- source_word: γυνή
  choice: பெண்
  rationale: γυνή என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என இரு பொருள்கள் உண்டு. இவ்வசனத்தில் கணவன் வெளிப்படையாகக் குறிப்பிடப்படாததால், குறுகலற்ற ‘பெண்’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது; மற்ற வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: κειράσθω / τὸ κείρασθαι
  choice: தன் தலைமுடியை வெட்டிக்கொள்ளட்டும் / தலைமுடியை வெட்டிக்கொள்வதோ
  rationale: இது தலைமுடியை வெட்டுதல் அல்லது கத்தரித்தலைக் குறிக்கிறது. அடுத்து வரும் முழுமையாக மழித்தலிலிருந்து வேறுபாட்டைத் தக்கவைக்க ‘தலைமுடியை வெட்டிக்கொள்ளுதல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: καὶ
  choice: வாக்கியத்தின் விளைவுத் தொடரில் உட்பொருளாக வெளிப்படுத்தப்பட்டது
  rationale: καί இங்கு வாதத்தின் அடுத்த விளைவை இணைக்கிறது. தமிழில் ‘அவளும்’ என்று சேர்ப்பது தேவையற்ற ஒப்பீட்டுணர்வை ஏற்படுத்தக்கூடும் என்பதால், தொடர்ச்சியான கட்டளை அமைப்பே அதன் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αἰσχρόν
  choice: அவமானமாக
  rationale: இச்சொல் சமூக மரியாதை–அவமானப் பரிமாணத்தைக் கொண்டது. நவீன தமிழில் இயல்பாகவும் வலுவாகவும் அதைப் பிரதிபலிக்க ‘அவமானமாக’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ξυρᾶσθαι
  choice: தலையை மழித்துக்கொள்வதோ
  rationale: இந்த வினை மழித்தலைக் குறிக்கிறது. தமிழில் செயல் எதன்மேல் நிகழ்கிறது என்பதைத் தெளிவாக்க ‘தலையை’ சேர்த்துள்ளோம்; இது தலைமுடியை வெட்டுவதிலிருந்து உள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: γὰρ ... δὲ
  choice: என்றால் ... ஆனால்
  rationale: γάρ முந்தைய கருத்துக்கான காரணவிளக்கத்தைத் தருகிறது; வசனம் தனியாக வாசிக்கப்படும்போது தமிழில் ‘ஒரு பெண் ... என்றால்’ என்ற நிபந்தனை அமைப்பு இயல்பாக அதனை எடுத்துரைக்கிறது. δέ-க்கு ‘ஆனால்’ வாதத்தின் மாறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: γυνή என்பதைக் ‘பெண்’ என்றா ‘மனைவி’ என்றா மொழிபெயர்ப்பது
  choice: பெண்
  alternative: மனைவி
  rationale: உடனடி வசனத்தில் கணவன் குறிப்பிடப்படவில்லை; ஆகவே பொதுவான பொருளைச் சுருக்காமல் ‘பெண்’ என மொழிபெயர்க்கப்பட்டது. எனினும், விரிந்த சூழலில் ‘மனைவி’ என்பதும் இலக்கணரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: κατακαλύπτω குறிப்பிட்ட முக்காட்டைக் குறிக்கிறதா அல்லது பொதுவாகத் தலையை மூடுவதைக் குறிக்கிறதா
  choice: தன் தலையை மூடிக்கொள்ளுதல்
  alternative: முக்காடிட்டுக்கொள்ளுதல்
  rationale: கிரேக்க வினை மூடுதல் அல்லது முக்காடிடுதல் எனப் பொருள்படலாம். குறிப்பிட்ட ஆடை அல்லது முறையை உரையில் இறக்குமதி செய்யாமல், சூழலில் மறைந்துள்ள ‘தலை’ என்னும் பொருளை மட்டும் தெளிவாக்கும் பரந்த வாசகம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘முக்காடு’ போன்ற குறிப்பிட்ட ஆடைச்சொல்லைத் தவிர்த்து, மூலத்தின் பரந்த பொருளைத் தக்கவைக்க ‘தலையை மூடிக்கொள்ளுதல்’ பயன்படுத்தப்பட்டது. பிரதான உரையிலுள்ள [a] குறியீடு ‘பெண்/மனைவி’ என்ற உண்மையான சொற்பொருள் தெளிவின்மையைச் சுட்டுகிறது.
