  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: ta
  text: ஆகவே, உங்களுக்குள் வழக்குகள் இருப்பதே உங்களுக்கு ஏற்கெனவே முழுமையான தோல்வியே.[a][b] அதற்கு மாறாக, நீங்கள் ஏன் அநியாயத்துக்கு ஆளாகக்கூடாது? அதற்கு மாறாக, நீங்கள் ஏன் உரியதை இழக்கக்கூடாது?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தோல்வி’ என்பதற்குப் பதிலாக ‘இழப்பு’ அல்லது ‘பின்னடைவு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ἥττημα இத்தகைய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வழக்குகள்’ என்பதற்குப் பதிலாக ‘நீதிமன்ற வழக்குகள்’ அல்லது ‘சட்டத் தகராறுகள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு κρίματα என்பது நீதிமன்றத்திற்குக் கொண்டுசெல்லப்படும் தகராறுகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘உரியதை இழக்க’ என்பதற்குப் பதிலாக ‘ஏமாற்றப்பட்டு இழக்க’ அல்லது ‘பறிகொடுக்க’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ἀποστερεῖσθε ஏமாற்றப்படுதல், உரியதை இழத்தல், அல்லது வஞ்சித்துப் பறிக்கப்படுதல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: வழக்குகளின் முடிவு எதுவாக இருந்தாலும், அவை இருப்பதே தற்போதே தோல்வியாகிவிட்டது என்ற காலக் கருத்தைத் தக்கவைக்கிறது.
- source_word: μὲν οὖν
  choice: ஆகவே
  rationale: முந்தைய கண்டிப்பிலிருந்து பவுல் எடுக்கும் முடிவையும் உரையின் இயல்பான தொடர்ச்சியையும் நவீன தமிழில் தெளிவாகக் காட்டுகிறது; μὲν-இன் மென்மையான வலியுறுத்தலைத் தனியே மிகைப்படுத்தவில்லை.
- source_word: ὅλως
  choice: முற்றிலும்
  rationale: நிலைமையை முழுமையான தோல்வி என வலியுறுத்தும் வினையடைப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἥττημα
  choice: தோல்வி
  rationale: சட்ட வழக்கில் யார் வென்றாலும், விசுவாசிகளுக்குள் இத்தகைய வழக்குகள் இருப்பதே சமூகத்திற்கான தோல்வி என்ற கூர்மையான சொல்லாட்சியை வெளிப்படுத்துகிறது.
- source_word: ὑμῖν ἐστιν
  choice: உங்களுக்கு ... தான்
  rationale: இது அவர்களைக் குறித்த தோல்வி என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘அவமானம்’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: ὅτι
  choice: இருப்பதே
  rationale: தோல்வி எதில் அடங்குகிறது என்பதைத் தமிழின் பெயரெச்ச அமைப்பில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: κρίματα
  choice: வழக்குகள்
  rationale: நீதிமன்றத்திற்குக் கொண்டுசெல்லப்படும் தகராறுகளை இச்சூழலில் நேரடியாகவும் பொதுமக்களுக்குப் புரியும்படியும் குறிக்கிறது.
- source_word: μεθ’ ἑαυτῶν
  choice: உங்களுக்குள்
  rationale: சமூக உறுப்பினர்கள் ஒருவரோடொருவர் கொண்டுள்ள சட்டத் தகராறுகளைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: அதற்கு மாறாக, நீங்கள் ஏன் ... கூடாது?
  rationale: வழக்காடுவதற்குப் பதிலான பவுலின் ஒப்பீட்டுத் தன்மையுள்ள சொல்லாட்சிக் கேள்வியைத் தெளிவாகக் காக்கிறது.
- source_word: ἀδικεῖσθε
  choice: அநியாயத்துக்கு ஆளாக
  rationale: செயப்பாட்டு பொருளையும் அநீதியின் ஒழுக்கப் பரிமாணத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἀποστερεῖσθε
  choice: ஏமாற்றப்பட்டு இழக்க
  rationale: மற்றொருவரால் வஞ்சிக்கப்பட்டு உரியதை இழக்கும் செயப்பாட்டு கருத்தை வெளிப்படுத்துகிறது; பொருள் வெறும் மன ஏமாற்றம் எனப் புரியாதபடி ‘இழக்க’ என்பதையும் இணைக்கிறது.
theological_decisions:
- issue: விசுவாசிகளுக்குள் நடைபெறும் வழக்குகளைப் பற்றிய பவுலின் மதிப்பீடு
  choice: ἥττημα என்பதை ‘தோல்வி’ என்று மொழிபெயர்த்தல்
  alternative: ‘இழப்பு’ அல்லது ‘தவறு’
  rationale: வழக்குகளின் சட்ட முடிவைப் பொருட்படுத்தாமல், அவை இருப்பதே சமூகத்தின் தோல்வி எனப் பவுல் மதிப்பிடும் வலிமையை இது காக்கிறது; மூலத்தில் இல்லாத தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: அநியாயத்தையும் இழப்பையும் ஏற்றுக்கொள்வதற்கான சொல்லாட்சிக் கேள்விகள்
  choice: கட்டளையாக மாற்றாமல் கேள்விகளாகவே வைத்தல்
  alternative: ‘அநியாயத்தைச் சகித்துக்கொள்ளுங்கள்; இழப்பை ஏற்றுக்கொள்ளுங்கள்’ என்ற நேரடிக் கட்டளை
  rationale: மூலத்தின் கேள்வி வடிவத்தையும் அதன் சவாலான வலிமையையும் பாதுகாக்கிறது; இந்த ஒரே வசனத்திலிருந்து விரிவான ஒழுக்க அல்லது சட்ட விதியை உருவாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘உங்களுக்குள் வழக்குகள் இருப்பதே’ என்பது சட்டச் சூழலை இயல்பாகத் தெரிவிக்கிறது. இரு இறுதிக் கேள்விகளின் இணை அமைப்பும் மூலத்தின் சொல்லாட்சித் தாக்கமும் பாதுகாக்கப்பட்டுள்ளன.
