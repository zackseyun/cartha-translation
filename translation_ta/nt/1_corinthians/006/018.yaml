  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் கட்டளையின் வலிமையும் தக்கவைக்கப்பட்டுள்ளன. ‘பாலியல் ஒழுக்கக்கேடு’ என்பது பரந்த பொருளுடைய பதமாகத் தொடர்ந்து பயன்படுத்தப்பட்டுள்ளது; விவாதத்திற்குரிய ‘உடலுக்கு வெளியே’ என்ற சொற்றொடர் விளக்கிச் சீராக்கப்படவில்லை.
