source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: ta
  text: பாலியல் ஒழுக்கக்கேட்டை விட்டு ஓடுங்கள். ஒருவர் செய்யக்கூடிய ஒவ்வொரு பாவமும் உடலுக்கு வெளியே இருக்கிறது[a]; ஆனால் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுபவர் தன் சொந்த உடலுக்கு எதிராகப் பாவம் செய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “மனிதன்” என்ற சொல் உள்ளது; இங்கு அது மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: ἄνθρωπος என்பதன் பிரதிநிதித்துவமான பொதுப் பொருளைத் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: φεύγετε
  choice: விட்டு ஓடுங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவம் அவசரமான, தொடர்ச்சியான விலகலைக் கோருகிறது; தமிழில் ‘விட்டு ஓடுங்கள்’ அந்த வலிமையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πορνείαν
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: πορνεία முறைகேடான பாலியல் நடத்தையைப் பரந்த வகையில் குறிக்கிறது; ஒரு குறிப்பிட்ட வகைச் செயலுக்கு மட்டும் இதைச் சுருக்காமல் இந்தத் தேர்வு அதன் பரப்பைப் பாதுகாக்கிறது.
- source_word: πᾶν ἁμάρτημα
  choice: ஒவ்வொரு பாவமும்
  rationale: இந்தச் சொற்றொடரின் பொதுவான, முழுமையான வலிமையை நேரடியாகக் காட்டுகிறது.
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: ஒரு மனிதன் செய்யக்கூடிய
  rationale: ἄνθρωπος ஒருமை வடிவில் இருந்தாலும் இங்கு பொதுப் பிரதிநிதித்துவப் பொருள் கொண்டது; ‘ஒரு மனிதன்’ வடிவத்தையும் பொதுப் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: உடலுக்கு வெளியே இருக்கிறது
  rationale: மூலத்தின் இடவியல்/உருவகச் சொல்லாட்சியையும் அடுத்த கூற்றுடனான பதற்றத்தையும் விளக்கிச் சமப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: ὁ δὲ πορνεύων
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்பு வடிவத்தின் செயற்பாட்டு வலிமையைத் தக்கவைக்கிறது.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: தன் சொந்த உடலுக்கு எதிராகப் பாவம் செய்கிறான்
  rationale: εἰς என்பதன் சொல்லடியான ‘உள்ளே/நோக்கி’ என்பதை தமிழில் அப்படியே கொடுத்தால் தெளிவிழக்கும்; இச்சூழலில் ‘எதிராக’ என்பது பாவம் சொந்த உடலை நோக்கி இருப்பதை இயல்பாகத் தெரிவிக்கிறது. ‘தன் சொந்த’ என்பது ἴδιον என்பதன் வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: ἄνθρωπος என்பதன் பொதுப் பிரதிநிதித்துவப் பொருள்
  choice: ஒரு மனிதன்
  alternative: ஒருவர்
  rationale: மூலத்தில் ஒருமை மனிதர் குறிக்கும் பெயர்ச்சொல் பயன்படுத்தப்பட்டுள்ளது; ‘ஒரு மனிதன்’ அதைத் தக்கவைக்கும் அதேவேளையில் இங்கு மனிதர்களைப் பொதுவாகக் குறிப்பதை அடிக்குறிப்பு விளக்குகிறது.
- issue: ‘ஒவ்வொரு பாவமும் உடலுக்கு வெளியே’ என்ற கூற்றின் பொருள்
  choice: கூற்றை நேரடியாக மொழிபெயர்த்து அதன் விளக்கவியல் பதற்றத்தைத் தக்கவைத்தல்
  alternative: இதைக் கொரிந்தியரின் மேற்கோள் அல்லது தகுதிப்படுத்த வேண்டிய முழுமைக் கூற்று என்று முதன்மை உரையிலேயே விளக்குதல்
  rationale: கிரேக்க உரை கூற்றை நேரடியாக முன்வைக்கிறது; அது யாருடைய கூற்று அல்லது எந்த அளவில் முழுமையானது என்பதை மொழிபெயர்ப்பு தீர்மானித்து விடக்கூடாது.
