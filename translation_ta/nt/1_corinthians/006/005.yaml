source:
  edition: SBLGNT
  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: ta
  text: உங்களை வெட்கப்படுத்தவே இதைச் சொல்கிறேன். நிலைமை இப்படியா? உங்களிடையே தன் சகோதரனுக்கும் மற்றொருவருக்கும் இடையே தீர்ப்புச் சொல்லக்கூடிய ஞானமுள்ள ஒருவர்கூட[a] இல்லையா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொற்றொடர் ஆண்பால் ஒருமையில் உள்ளது; ஆனால் பவுல் முழுச் சபையையும் நோக்கிப் பேசுவதால், ‘ஞானமுள்ள ஒருவர்’ என்பது ஆணை மட்டும் குறிக்க வேண்டியதில்லை.
    reason: lexical_alternative
  - marker: b
    text: இங்கே ‘சகோதரன்’ என்பது உடன்பிறந்தவரை மட்டும் அல்ல, சக விசுவாசியைக் குறிக்கிறது; சூழலில் அது சபையிலுள்ள சகோதரனையோ சகோதரியையோ உள்ளடக்கலாம். ‘மற்றொருவர்’ என்பது மூல கிரேக்கத்தில் வெளிப்படையாக இல்லாமல், ‘இடையே’ என்ற சொல்லில் உணர்த்தப்படும் மறுதரப்பைத் தமிழில் தெளிவாக்குகிறது.
    reason: lexical_and_elliptical_clarification
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν λέγω
  choice: உங்களை வெட்கப்படுத்தவே இதைச் சொல்கிறேன்
  rationale: πρός + accusative இங்குப் பேச்சின் நோக்கத்தையும் கண்டிக்கும் வலிமையையும் காட்டுகிறது. தமிழில் இயல்பாகவும் நேரடியாகவும் அந்த வலிமையைப் பேணுகிறது.
- source_word: οὕτως
  choice: இல்லாத அளவுக்கு நிலைமை இருக்கிறதா?
  rationale: முந்தைய உரையிலிருந்து எழும் பவுலின் வியப்பும் கண்டனமும் கலந்த வினாவாக இதை வெளிப்படுத்துகிறது; வெறும் ‘இவ்வாறு’ என்பதைவிட சூழலில் இயல்பானது.
- source_word: οὐκ ἔνι ἐν ὑμῖν οὐδεὶς σοφὸς
  choice: உங்களிடையே ஞானமுள்ள ஒருவர்கூட இல்லாத அளவுக்கு
  rationale: சமூகத்தின் நடுவில் ஒருவரும் இல்லை என்ற வலியுறுத்தப்பட்ட மறுப்பை ‘ஒருவர்கூட’ தெளிவாகக் காட்டுகிறது. தமிழ் வடிவம் பாலினத்தைத் தனியே குறிக்காமல் ஒருமையைப் பேணுகிறது.
- source_word: ὃς δυνήσεται διακρῖναι
  choice: தீர்ப்புச் சொல்லக்கூடியவர்
  rationale: எதிர்கால திறனைத் தமிழில் இயல்பான திறன்வடிவில் தருகிறது; சட்டத் தகராறு சூழலில் διακρίνω என்பதன் தீர்மானம்/நடுவர் தீர்ப்பு சார்ந்த பொருளைப் பேணுகிறது.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: தன் சகோதரனுக்கும் மற்றொருவருக்கும் இடையே
  rationale: மூலத்தில் ‘இடையே’ என்பதற்குப் பின்னர் ஒரே தரப்பு மட்டும் வெளிப்படையாகக் கூறப்பட்டுள்ள நீக்கவாக்கியத்தை, தமிழில் புரியுமாறு இரண்டாம் தரப்பை ‘மற்றொருவர்’ என்று குறைந்தபட்சமாக நிரப்புகிறது. ‘சகோதரன்’ என்ற குடும்ப மொழி தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: கலப்புப் பாலினச் சபையில் ஆண்பால் ஒருமை வடிவங்கள்
  choice: ஞானமுள்ள ஒருவர் ... தன் சகோதரன்
  alternative: ஞானமுள்ள ஆண் ... சக விசுவாசி
  rationale: οὐδεὶς σοφός இலக்கணப்படி ஆண்பால் ஒருமையாக இருந்தாலும், நவீன தமிழின் ‘ஒருவர்’ இயல்பாக பாலினத்தைக் கட்டுப்படுத்தாது; எனவே சபை முழுவதையும் நோக்கிய பிரதிநிதித்துவப் பயன்பாட்டைச் செயற்கையாக ஆண்பாலாகச் சுருக்கவில்லை. ἀδελφός என்பதன் குடும்ப உருவகம் ‘சகோதரன்’ எனப் பேணப்பட்டு, அதன் சூழல்சார் விரிவு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ என்பதிலுள்ள நீக்கவாக்கியம்
  choice: தன் சகோதரனுக்கும் மற்றொருவருக்கும் இடையே
  alternative: தன் சகோதரர்களுக்கிடையே
  rationale: மூலத்தின் ஒருமை வடிவத்தைப் பன்மையாக்காமல் காக்கிறது; அதேவேளை ‘இடையே’ என்பதற்குத் தமிழில் தேவைப்படும் மறுதரப்பை வெளிப்படையாக்குகிறது. ‘மற்றொருவர்’ யார் என்பதை மேலதிகமாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்டனத்துடன் கூடிய சொல்லாட்சியை மரியாதையும் கண்ணியமும் குன்றாமல் வைத்துள்ளது. சட்டச் சூழலை உணர்த்த ‘தீர்ப்புச் சொல்ல’ பயன்படுத்தப்பட்டுள்ளது. இரண்டாவது வாக்கியம் இரண்டு தொடர்புடைய வினாக்களாக அமைக்கப்பட்டு, பவுலின் கூர்மையான வினாவுரைப் பலம் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
