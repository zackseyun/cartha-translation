source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: ta
  text: அல்லது, ஒரு விபச்சாரியோடு இணைகிறவன் அவளோடு ஒரே உடலாக இருக்கிறான் என்பது உங்களுக்குத் தெரியாதா? ஏனெனில், “இருவரும் ஒரே மாம்சமாவார்கள்” என்று அவர் சொல்லுகிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இருவரும் ஒரே மாம்சமாவார்கள்” என்பது ஆதியாகமம் 2:24-இலிருந்து எடுக்கப்பட்ட மேற்கோள். கிரேக்கத்தில் இதற்கு முன் நேரடியாக “அவர் சொல்லுகிறார்” என்று உள்ளது; அந்த ‘அவர்’ யார் என்பது இங்கே வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: முந்தைய வாதத்தைத் தொடர்ந்து மற்றொரு சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்துகிறது.
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாதா?
  rationale: பவுலின் வழக்கமான சொல்லாட்சிக் கேள்வியை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ὁ κολλώμενος
  choice: இணைகிறவன்
  rationale: κολλάομαι என்பதிலுள்ள சேர்தல் அல்லது பற்றிக்கொள்ளுதல் என்ற பொருளை, இங்குள்ள பாலுறவுச் சூழலில் தெளிவாக வெளிப்படுத்துகிறது; கிரேக்க நடுநிலை வடிவத்தின் செய்பவரைச் சார்ந்த நுணுக்கத்தையும் இயன்றவரை காக்கிறது.
- source_word: τῇ πόρνῃ
  choice: ஒரு விபச்சாரியோடு
  rationale: πόρνη என்பதன் குறிப்பான பொருள் பாலியல் தொழிலில் ஈடுபடும் பெண்; இங்குள்ள உறுப்பு பொதுப்படையானதால் தமிழில் ‘ஒரு’ இயல்பாக உள்ளது.
- source_word: ἓν σῶμά ἐστιν
  choice: அவளோடு ஒரே உடலாக இருக்கிறான்
  rationale: கிரேக்கத்தில் மறைமுகமாக உள்ள உறவை ‘அவளோடு’ எனத் தெளிவாக்கி, ἐστιν என்பதற்கேற்ப ‘இருக்கிறான்’ என்று மொழிபெயர்க்கிறது; ‘ஆகிறான்’ என மாற்றி விளக்கவில்லை.
- source_word: Ἔσονται γάρ
  choice: ஏனெனில் … ஆவார்கள்
  rationale: γάρ பவுலின் கூற்றுக்கான ஆதாரத்தை அறிமுகப்படுத்துகிறது; εἰμί + εἰς அமைப்பு இங்கு விளைவாக உருவாகும் நிலையைக் குறைப்பதால் ‘ஆவார்கள்’ இயல்பானது.
- source_word: φησίν
  choice: என்று அவர் சொல்லுகிறார்
  rationale: கிரேக்க ஒருமை வினையைப் பாதுகாக்கிறது; சொல்பவர் யார் என்பதை முதன்மை உரையில் அளவுக்கு மீறி குறிப்பாக்கவில்லை.
- source_word: οἱ δύο
  choice: இருவரும்
  rationale: ‘அந்த இருவர்’ என்பதைக் காட்டிலும் மேற்கோளில் இயல்பான தமிழாகவும் மூலத்தின் இருமையைத் தெளிவாகவும் தருகிறது.
- source_word: εἰς σάρκα μίαν
  choice: ஒரே மாம்சமாவார்கள்
  rationale: ஆதியாகம மேற்கோளின் σάρξ என்பதிலுள்ள உடல்சார்ந்த மற்றும் உறவுசார்ந்த ‘மாம்சம்’ உருவகத்தைப் பாதுகாக்கிறது; இதை வெறும் ‘உடல்’ என்று ஒற்றைப்படுத்தவில்லை.
theological_decisions:
- issue: திருமணத்திற்கு வெளியேயுள்ள பாலுறவுக்கு ஆதியாகமம் 2:24 மேற்கோள் எவ்வாறு பொருந்துகிறது
  choice: விபச்சாரியுடன் பாலுறவு கொள்பவனும் உண்மையான உடல்சார்ந்த ‘ஒரே மாம்ச’ இணைப்புக்குள் வருகிறான் என்ற பவுலின் வாதத்தை நேரடியாகக் காக்கிறது.
  alternative: மேற்கோளைத் திருமணத்திற்கு மட்டுமே உரியதாகக் கட்டுப்படுத்துதல் அல்லது இவ்வசனத்தில் சொல்லப்படாத முழுமையான திருமணக் கோட்பாட்டை மொழிபெயர்ப்பில் சேர்த்தல்.
  rationale: பவுல் ஆதியாகமம் 2:24-ஐ இச்சூழலுக்கு ஒப்புமையாகப் பயன்படுத்துகிறார். மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தைத் தக்கவைத்து, உரையில் இல்லாத முடிவுகளைச் சேர்க்காமல் இருக்க வேண்டும்.
- issue: φησίν என்பதன் சொல்லப்படாத எழுவாய்
  choice: ‘அவர் சொல்லுகிறார்’ என்று கிரேக்க ஒருமையைப் பாதுகாத்து, அடிக்குறிப்பில் மேற்கோளின் மூலத்தை அடையாளப்படுத்துகிறது.
  alternative: முதன்மை உரையிலேயே ‘வேதம் சொல்லுகிறது’ அல்லது ‘தேவன் சொல்லுகிறார்’ என்று எழுவாயைத் தீர்மானித்தல்.
  rationale: கிரேக்க உரை எழுவாயை வெளிப்படையாகக் குறிப்பிடவில்லை; ஆகவே அதன் உண்மையான தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைக்குரிய வேதாகம நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் கூற்றில் σῶμα என்பதற்கு ‘உடல்’, ஆதியாகம மேற்கோளிலுள்ள σάρξ என்பதற்கு அதன் தனித்த உருவகத்தைப் பாதுகாக்க ‘மாம்சம்’ பயன்படுத்தப்பட்டுள்ளது. ‘விபச்சாரி’ என்பது தற்போதைய தமிழில் சில வேளைகளில் பரந்த பாலியல் ஒழுக்கக்கேட்டையும் குறிக்கக்கூடும் என்றாலும், ‘பாலியல் தொழிலாளி’ என்பது நவீன சமூகப் பதமாக இருப்பதால் மூலச் சொல்லின் இச்சூழலுக்குரிய நெறிசார் தொனியை மாற்றக்கூடும்; ஆகவே ‘விபச்சாரி’ தேர்ந்தெடுக்கப்பட்டது.
