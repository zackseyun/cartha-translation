  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: ta
  text: அல்லது, உங்கள் உடல் உங்களுக்குள் இருக்கும் பரிசுத்த ஆவியின் ஆலயம் என்றும், கடவுளிடமிருந்து உங்களிடம் உள்ள அந்த ஆவி என்றும் உங்களுக்குத் தெரியாதா?[a] மேலும், நீங்கள் உங்களுக்கே சொந்தமானவர்கள் அல்லர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்குள் இருக்கும் பரிசுத்த ஆவி வாழும் ஆலயம்.”
    reason: ‘பரிசுத்த ஆவியின் ஆலயம்’ என்பதற்கான மாற்றுச் சொல்வரிசை. இது ஆவி உங்களுக்குள் இருப்பதையும் ஆலயத்துடனான தொடர்பையும் வெளிப்படுத்துகிறது.
  - marker: b
    text: கிரேக்கத்தில் ‘உடல்’ ஒருமையிலும் ‘உங்கள்’ பன்மையிலும் உள்ளன. இது ‘உங்களில் ஒவ்வொருவருடைய உடல்’ என்று பகிர்ந்துரைக்கும் பொருளிலோ, அனைவரையும் பிரதிநிதித்துவப்படுத்தும் ஒருமையாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: மூலமொழியின் ஒருமை–பன்மை அமைப்பால் உருவாகும் இருபொருள் வாய்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: முந்தைய வாதத்தைத் தொடர்ந்து கூர்மையான வினாவாக மாற்றும் பவுலின் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாதா?
  rationale: பவுல் வழக்கமாகப் பயன்படுத்தும் சொல்லாட்சிசார் வினாவை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τὸ σῶμα ὑμῶν
  choice: உங்கள் உடல்
  rationale: மூலத்தில் ‘உடல்’ ஒருமையிலும் ‘உங்கள்’ பன்மையிலும் இருப்பதை மாற்றாமல் பாதுகாக்கிறது.
- source_word: ναὸς
  choice: ஆலயம்
  rationale: ναός குறிக்கும் புனித ஆலயத்தின் உட்பகுதி/திருக்கோயில் கருத்தை, தமிழில் கண்ணியமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: உங்களுக்குள் இருக்கும் பரிசுத்த ஆவியின்
  rationale: ἐν ὑμῖν என்பதை இயல்பான தமிழில் தருவதோடு, இந்தச் சொற்றொடர் ‘ஆலயம்’ என்பதோடு தொடர்புடையது என்பதையும் தெளிவாக்குகிறது.
- source_word: οὗ ἔχετε ἀπὸ θεοῦ
  choice: அந்த ஆவியை நீங்கள் கடவுளிடமிருந்து பெற்றிருக்கிறீர்கள்
  rationale: தமிழில் தொடர்பைத் தெளிவாகக் காட்ட ‘அந்த ஆவியை’ என மீண்டும் குறிப்பிடுகிறது. ἔχετε என்பது நேரடியாக ‘உடையவர்களாய் இருக்கிறீர்கள்’ என்றாலும், ἀπὸ θεοῦ உடன் சேர்ந்து வருவதால் ‘பெற்றிருக்கிறீர்கள்’ என்பது இயல்பாக அந்த நிலையான உடைமையையும் மூலத்தையும் தெரிவிக்கிறது.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: மேலும், நீங்கள் உங்களுக்குச் சொந்தமானவர்கள் அல்ல
  rationale: தாங்களே தங்களுடைய உரிமையாளர்கள் அல்ல என்ற கிரேக்கத் தொடரின் உரிமை/சொந்தம் சார்ந்த பொருளை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: οὗ என்ற தொடர்புப்பெயரின் சுட்டுப்பொருள்
  choice: ‘அந்த ஆவியை’ என்று பரிசுத்த ஆவியைத் தனிப்பட்ட சுட்டுப்பொருளாகத் தெளிவுபடுத்துதல்
  alternative: ‘அதை’ என்று அஃறிணையாக மொழிபெயர்த்தல்
  rationale: οὗ என்பது ἁγίου πνεύματός என்பதையே சுட்டுகிறது. தமிழ் இலக்கணத்தில் கிரேக்கத்தின் பால்வேறுபாட்டை அப்படியே காட்ட இயலாததால், ‘அந்த ஆவியை’ என்பது சுட்டுப்பொருளைத் தெளிவாகக் காக்கிறது; தேவையற்ற கோட்பாட்டுச் சொற்களைச் சேர்ப்பதில்லை.
- issue: பன்மை வாசகர்களுடன் ஒருமை ‘உடல்’
  choice: ‘உங்கள் உடல்’ என்று ஒருமையைத் தக்கவைத்தல்
  alternative: ‘உங்கள் உடல்கள்’ என்று பன்மையாக்குதல்
  rationale: τὸ σῶμα ஒருமையிலும் ὑμῶν பன்மையிலும் உள்ளது. இது ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கிறதா அல்லது பிரதிநிதித்துவமாகக் குறிக்கிறதா என்ற உண்மையான இருபொருள் வாய்ப்பை மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான வேதாகம நடை. ‘ஆலயம்,’ ‘பரிசுத்த ஆவி,’ ‘சொந்தமானவர்கள்’ ஆகியவை துல்லியத்தையும் இயல்பையும் இணைக்கின்றன. வசனத்தின் இறுதிக் காற்புள்ளி, அடுத்த வசனத்தில் வாதம் தொடர்வதைப் பிரதிபலிக்கிறது.
