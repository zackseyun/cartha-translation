source:
  edition: SBLGNT
  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: ta
  text: திருடர்களும், பேராசைக்காரர்களும், குடிகாரர்களும், வசைபாடுகிறவர்களும், கொள்ளையடிப்பவர்களும்[a] கடவுளுடைய அரசில் உரிமைப் பங்கு பெறமாட்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிறருடையதைப் பறித்துக்கொள்கிறவர்களும்”; இச்சொல் கொள்ளையடித்தல் அல்லது வலுக்கட்டாயமாக அபகரித்தலைக் குறிக்கலாம்.
    reason: ἅρπαγες என்பதற்கான நெருக்கமான சொற்பொருள் மாற்றை வழங்குகிறது.
  - marker: b
    text: அதாவது, கடவுளுடைய அரசின் வாரிசுகளாகப் பங்கு பெறமாட்டார்கள்.
    reason: κληρονομήσουσιν என்பதில் உள்ள வாரிசுரிமை/உரிமைப் பங்கு உருவகத்தைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: κλέπται
  choice: திருடர்கள்
  rationale: பிறருடையதைத் திருடுகிறவர்களைக் குறிக்கும் இயல்பான, தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: πλεονέκται
  choice: பேராசைக்காரர்கள்
  rationale: மேலும் மேலும் பெறவேண்டும் என்ற அடங்காத ஆசையால் வகைப்படுத்தப்படுகிறவர்களை இயல்பான தமிழில் குறிக்கிறது.
- source_word: μέθυσοι
  choice: குடிகாரர்கள்
  rationale: ஒருமுறை குடித்தவர்களை அல்ல, குடிவெறியால் வாழ்க்கை வகைப்படுத்தப்படுகிறவர்களைக் குறிக்கும் பட்டியல் சொல்லின் வலிமையைப் பேணுகிறது.
- source_word: λοίδοροι
  choice: வசைபாடுகிறவர்கள்
  rationale: பொய்க்குற்றச்சாட்டுக்கு மட்டும் வரம்பிடாமல், பிறரை இழிவுபடுத்தும் அல்லது அவமதிக்கும் பேச்சை உள்ளடக்குகிறது.
- source_word: ἅρπαγες
  choice: பிறரைச் சுரண்டிப் பொருள் பறிக்கிறவர்கள்
  rationale: வன்முறைத் திருட்டுக்கு மட்டும் சுருக்காமல், பேராசையுடன் பிறரைச் சுரண்டி அவர்களுடையதை அபகரிக்கும் பரந்த பொருளைத் தெரிவிக்கிறது.
- source_word: βασιλείαν θεοῦ
  choice: கடவுளுடைய அரசு
  rationale: கடவுளின் ஆட்சியையும் அரசையும் குறிக்கும் நிலையான, புரிந்துகொள்ளக்கூடிய தமிழாக்கம்.
- source_word: κληρονομήσουσιν
  choice: உரிமையாகப் பெறமாட்டார்கள்
  rationale: வாரிசாகப் பெறுதல் என்ற உருவகத்தையும் எதிர்கால மறுப்பையும் இயல்பான தமிழில் பேணுகிறது.
theological_decisions:
- issue: தீயொழுக்கப் பட்டியலின் வலிமையும் அரசை உரிமையாகப் பெறுதல் என்ற மொழியும்
  choice: இந்தப் பெயர்ச்சொற்கள் அந்த நடத்தைகளால் வகைப்படுத்தப்படும் ஆட்களைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளன; ஆனால் ‘மனந்திரும்பாத’ போன்ற விளக்கச் சொல் மூலவசனத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
  alternative: இவை தனித்தனி செயல்களை ஒருமுறை செய்த எவரையும் நேரடியாகக் குறிக்கின்றன என்று மொழிபெயர்த்தல்.
  rationale: கிரேக்கத்தில் பன்மை ஆள்பெயர்ச்சொற்களாக அமைந்த தீயொழுக்கப் பட்டியல், இத்தகைய நடத்தையுடைய வகுப்பினரைச் சுட்டுகிறது. வசனத்தின் இறையியல் பதற்றத்தை விளக்கவுரை மூலம் தீர்க்காமல் பட்டியலையும் எதிர்கால அறிவிப்பையும் அப்படியே பேணுவது பொருத்தமானது.
- issue: βασιλείαν என்பதன் பொருள்
  choice: அரசு
  alternative: ஆட்சி
  rationale: ‘அரசு’ என்பது கடவுளின் ஆட்சிப்பரப்பும் அவர் ஆளும் நிலையும் ஆகிய இரு நிழற்பொருள்களுக்கும் இடமளிக்கிறது; ‘ஆட்சி’ மட்டும் பயன்படுத்தினால் பெறப்படும் பங்கின் உருவகம் மங்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான தீயொழுக்கப் பட்டியல் நடையைப் பயன்படுத்துகிறது. கிரேக்க மூலத்தில் உள்ள மறுப்பு தொடரைத் தமிழில் இயல்பாக ஒரே இறுதி மறுப்பு வினையால் நிறைவு செய்கிறது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் இடமாறியிருப்பதால், அடிக்குறிப்புகள் அவை விளக்கும் தமிழ்ச் சொற்றொடர்களின் அருகில் ஒழுங்குபடுத்தப்பட்டுள்ளன.
