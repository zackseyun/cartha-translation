  verdict: revise
  source_fidelity: The draft correctly conveys the adversative ἀλλά, the conflict between one brother and another, the forensic sense of κρίνεται, and the rhetorical force of καὶ τοῦτο. The revised wording retains the broad reference of ἐπὶ ἀπίστων without adding judges or secular courts to the main text.
  naturalness: ‘நீதிமன்றம் செல்கிறான்’ lacks the required case marking in standard Tamil. ‘நீதிமன்றத்திற்குச் செல்கிறான்’ is idiomatic and clear. ‘விசுவாசமில்லாதவர்கள்’ more naturally communicates Paul’s faith-community contrast than ‘நம்பிக்கையில்லாதவர்கள்,’ which can also suggest persons who are unreliable or lacking confidence.
  terminology: ‘சகோதரன்’ appropriately preserves the singular familial designation, with the note clarifying its representative church-community reference. ‘விசுவாசமில்லாதவர்கள்’ is a modern, comprehensible Christian-context equivalent of ἀπίστων and does not prejudge their specific civic or religious identity beyond the source.
