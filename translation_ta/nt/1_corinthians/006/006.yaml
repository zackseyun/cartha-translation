  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: ta
  text: ஆனால், சகோதரன்[b] சகோதரனுக்கு எதிராக நீதிமன்றத்திற்குச் செல்கிறான்—அதுவும் விசுவாசமில்லாதவர்களுக்கு முன்பாகவா[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விசுவாசமில்லாதவர்களின் முன்பாக.’ இது சபைக்கு வெளியே இருப்போர் நடத்தும் உலகியல் நீதிமன்றங்களைக் குறிக்கலாம்; ஆனால் கிரேக்க மூலத்தில் ‘விசுவாசமில்லாதவர்களுக்கு முன்பாக’ என்று மட்டுமே உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: மீண்டும் வரும் ‘சகோதரன்’ என்பது கிறிஸ்தவச் சமூகத்தைச் சேர்ந்த சக விசுவாசிகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட சபைக்குள்ளான தீர்ப்புக்கும் இங்கு நிலவும் நடைமுறைக்கும் இடையிலான வலுவான முரண்பாட்டைக் காட்டுகிறது.
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: சகோதரன் ... சகோதரனுக்கு
  rationale: கிரேக்கத்தின் மீளுரைப்பையும், சக விசுவாசிகளை குடும்ப உறவுச் சொல்லால் குறிப்பிடும் பவுலின் மொழியையும் காக்கிறது.
- source_word: μετὰ
  choice: எதிராக
  rationale: வழக்கு சார்ந்த இச்சூழலில், உடனிருப்பதை அல்ல, வழக்கிலுள்ள எதிர்நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κρίνεται
  choice: நீதிமன்றம் செல்கிறான்
  rationale: இவ்விடத்தில் வினைச்சொல் சட்ட வழக்கில் ஈடுபடுவதைக் குறிக்கிறது; சொல்லுக்குச் சொல் மொழிபெயர்ப்பான ‘தீர்ப்பிடப்படுகிறான்’ என்பதைவிட சூழலைத் தெளிவாகத் தருகிறது.
- source_word: καὶ τοῦτο
  choice: அதுவும்
  rationale: விசுவாசிகளுக்கிடையே வழக்கு நடப்பது மட்டுமல்லாமல், அது நம்பிக்கையில்லாதவர்களுக்கு முன்பாக நடப்பதைக் குறித்த பவுலின் அதிர்ச்சியையும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ ἀπίστων
  choice: நம்பிக்கையில்லாதவர்களுக்கு முன்பாக
  rationale: வழக்கு யாருக்கு முன் விசாரிக்கப்படுகிறது என்ற அமைப்பைத் தருகிறது; கிரேக்கத்தில் இல்லாத ‘நீதிபதிகள்’ என்பதை மூலவாக்கியத்தில் சேர்க்காமல் அதன் பொதுத்தன்மையைக் காக்கிறது.
theological_decisions:
- issue: சபைக்குள் பிரதிநிதித்துவப் பொருளில் வரும் ἀδελφός
  choice: சகோதரன்
  alternative: சக விசுவாசி; சகோதரனோ சகோதரியோ
  rationale: மூலத்தின் ஆண்பால் ஒருமையையும் பவுலின் குடும்ப உருவகத்தையும் காக்கிறது; இச்சொல் கிறிஸ்தவச் சமூக உறுப்பினர்களைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- issue: ἀπίστων என்பதன் வரம்பு
  choice: நம்பிக்கையில்லாதவர்கள்
  alternative: நம்பிக்கையில்லாத நீதிபதிகள்; புறத்தார்
  rationale: சபைக்கும் விசுவாசத்திற்கு வெளியே இருப்போருக்கும் இடையிலான வேறுபாட்டைக் காக்கிறது; கிரேக்கம் நேரடியாகக் கூறாத குறுகிய அடையாளத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. சட்டச் சூழலைத் தெளிவாக்க ‘நீதிமன்றம் செல்கிறான்’ பயன்படுத்தப்பட்டது; மூலத்தின் கேள்வித் தொனியும் ‘அதுவும்’ என்ற வலியுறுத்தலும் காக்கப்பட்டன.
