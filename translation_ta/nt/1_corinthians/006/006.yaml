    issue: Missing Tamil case suffix in ‘நீதிமன்றம் செல்கிறான்’.
    rationale: Movement toward a court requires the dative-directional form ‘நீதிமன்றத்திற்குச் செல்கிறான்’ in modern standard Tamil.
  - severity: low
    issue: ‘நம்பிக்கையில்லாதவர்கள்’ is semantically less precise in this Christian-context contrast.
    rationale: It can denote people lacking confidence or trustworthiness; ‘விசுவாசமில்லாதவர்கள்’ better represents ἀπίστων as those outside the believing community while retaining the source’s breadth.
