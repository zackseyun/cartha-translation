source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: ta
  text: உணவு வயிற்றுக்காக, வயிறு உணவுக்காக[a][b]—ஆனால் கடவுள் இவ்விரண்டையும் முடிவுக்குக் கொண்டுவருவார்.[c] உடலோ பாலியல் ஒழுக்கக்கேட்டுக்காக அல்ல, ஆண்டவருக்காக; ஆண்டவரும் உடலுக்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணவுகள் வயிற்றுக்காக, வயிறு உணவுகளுக்காக.” கிரேக்கத்தில் ‘உணவுகள்’ என்பது பன்மையில் உள்ளது; தமிழில் பொதுப்பொருளில் ‘உணவு’ என்று கூறுவது இயல்பானது.
    reason: lexical_alternative
  - marker: b
    text: “உணவு வயிற்றுக்காக, வயிறு உணவுக்காக” என்பது கொரிந்தியர்கள் பயன்படுத்திய ஒரு முழக்கம் என்றும், அதை மேற்கோள் காட்டிய பின் பவுல் திருத்துகிறார் என்றும் பலர் புரிந்துகொள்கிறார்கள். கிரேக்க உரை இதை வெளிப்படையாகக் குறிக்கவில்லை.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “கடவுள் இவ்விரண்டையும் அழித்துவிடுவார்.” καταργήσει என்பதற்கு ‘ஒழித்துவிடுவார்’ அல்லது ‘செயலற்றதாக்குவார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  choice: உணவு
  rationale: கிரேக்கத்தில் இச்சொல் பன்மையில் இருந்தாலும், பொதுவான உணவைக் குறிக்கும் பழமொழி போன்ற இக்கூற்றில் தமிழில் ஒருமைத் தொகுப்புப்பெயரான ‘உணவு’ இயல்பாக உள்ளது; பன்மை வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: κοιλίᾳ / κοιλία
  choice: வயிறு
  rationale: இங்கு உடலின் பசியையும் செரிமானத்தையும் குறிக்கிறது. ‘வயிறு’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: καταργήσει
  choice: முடிவுக்குக் கொண்டுவருவார்
  rationale: இவ்வினை அழித்து நிர்மூலமாக்குவதை மட்டும் கட்டாயமாகக் குறிக்காமல், ஒன்றின் செயலையோ நிலைப்பையோ முடிவுறச் செய்வதையும் குறிக்கலாம். உணவு–வயிறு ஏற்பாட்டின் தற்காலிகத்தன்மையை இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: ταύτην καὶ ταῦτα
  choice: இவ்விரண்டையும்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் வயிற்றையும், நடுநிலைப் பன்மைச் சுட்டுப்பெயர் உணவுகளையும் பின்னோக்கிச் சுட்டுகின்றன. தமிழில் இரண்டையும் இயல்பாகவும் சுருக்கமாகவும் ‘இவ்விரண்டையும்’ எனக் கூறலாம்.
- source_word: σῶμα
  choice: உடல்
  rationale: பவுலின் பயன்பாட்டிலுள்ள மெய்யான மனித உடலைத் தெளிவாகக் குறிக்கும் வழக்கமான தமிழ் சொல்; அதன் இறையியல் முக்கியத்துவத்தையும் குறைக்கவில்லை.
- source_word: πορνείᾳ
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: πορνεία குறிக்கும் பரந்த பாலியல் தவறுகளின் வகையை நவீன வாசகருக்குத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; அதைக் குறிப்பிட்ட ஒரே தவறாகச் சுருக்கவில்லை.
- source_word: κυρίῳ / κύριος
  choice: ஆண்டவர்
  rationale: இங்கு இயேசுவைக் குறிக்கும் κύριος என்பதன் அதிகாரத்தையும் கிறிஸ்துவியல் நிறையையும் காக்கும் வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: δὲ
  choice: ஆனால் / உடலோ
  rationale: முதல் இடத்தில் உணவு–வயிறு கூற்றுக்கும் கடவுளின் செயலுக்கும் இடையிலான எதிர்மறைத் திருப்பத்தை ‘ஆனால்’ காட்டுகிறது; அடுத்த இடத்தில் ‘உடலோ’ என்பது உடலை உணவு–வயிறு வகையிலிருந்து வேறுபடுத்தும் எதிர்நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தொடக்கக் கூற்று கொரிந்தியர்களின் முழக்கமா அல்லது பவுலின் சொந்தக் கூற்றா
  choice: கூற்றை நேரடியாக வழங்கி, அதை யார் கூறியது என்று உரையில் வெளிப்படையாகச் சேர்க்காமல் விடுதல்
  alternative: மேற்கோள் குறிகளுடன் கொரிந்தியர்களின் முழக்கமாகக் காட்டுதல் அல்லது ‘நீங்கள் சொல்கிறீர்கள்’ என்று சேர்த்தல்
  rationale: கிரேக்க மூலத்தில் பேச்சாளரை அடையாளப்படுத்தும் அறிமுகச் சொற்களோ மேற்கோள் குறிகளோ இல்லை. பலர் இதைக் கொரிந்திய முழக்கமாகப் புரிந்துகொண்டாலும், உரை அந்த விளக்கத்தை கட்டாயப்படுத்தாததால் அடிக்குறிப்பில் மட்டும் தெரிவிக்கப்படுகிறது. கோடும் ‘ஆனால்’ என்பதும் பவுலின் திருத்தும் திருப்பத்தை உணர்த்துகின்றன.
- issue: καταργήσει என்பது உணவுக்கும் வயிற்றுக்கும் நிகழ்வதை எவ்வாறு குறிக்கிறது
  choice: அவற்றின் நிலை அல்லது செயற்பாட்டை கடவுள் முடிவுக்குக் கொண்டுவருவார் என்று கூறுதல்
  alternative: கடவுள் அவற்றை அழித்துவிடுவார் அல்லது ஒழித்துவிடுவார் என்று கூறுதல்
  rationale: இவ்வினை முற்றான பொருளழிவை மட்டும் குறிக்க வேண்டியதில்லை. உணவு–வயிறு தொடர்பு நிரந்தரமானதல்ல என்ற கருத்தை, தேவையற்ற பொருளியல் அல்லது மேன்மெய்யியல் முடிவின்றி இத்தேர்வு காக்கிறது.
- issue: ‘ஆண்டவரும் உடலுக்காக’ என்ற சொற்றொடரின் பொருள்
  choice: கிரேக்கத்தின் சுருக்கமான பரஸ்பர அமைப்பை விரிவாக்காமல் அப்படியே காத்தல்
  alternative: ‘ஆண்டவர் உடலைக் கவனித்துக்கொள்கிறார்’ அல்லது ‘ஆண்டவர் உடலின் நன்மைக்காக இருக்கிறார்’ என்று விளக்குதல்
  rationale: ஆண்டவருக்கும் உடலுக்கும் உள்ள உறவின் துல்லிய இயல்பை கிரேக்கம் இங்கு விரித்துரைக்கவில்லை. விளக்கச் சொற்களைச் சேர்க்காமல் இருப்பது பவுலின் இறுக்கமான இணை அமைப்பையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. தொடக்கக் கூற்றின் முழக்கத் தன்மை குறித்து மூலத்தில் உள்ள தெளிவின்மையும், ‘ஆண்டவரும் உடலுக்காக’ என்ற சுருக்கமான இறையியல் பரஸ்பரத் தொடர்பும் தீர்த்துவிடப்படாமல் காக்கப்பட்டுள்ளன.
