review_pass:
  verdict: revise
  source_fidelity: The emphatic ‘நீங்களே,’ the contrast ‘ஆனால்,’ the two present-tense accusations, and the intensifying ‘அதுவும்’ accurately represent the Greek. However, ‘சகோதரர்களிடமே’ is locative (“among/at brothers”), whereas ἀδελφούς is the direct object of both verbs; Tamil ‘சகோதரர்களுக்கே’ better conveys that they are the persons being wronged and defrauded.
  naturalness: The draft is direct and idiomatic overall. Changing the final locative expression to the dative form makes the concluding rhetorical accusation more natural and precise in modern standard Tamil.
  terminology: ‘அநியாயம் செய்கிறீர்கள்’ suitably represents ἀδικεῖτε, and ‘ஏமாற்றிப் பறிக்கிறீர்கள்’ is an acceptable contextual rendering of ἀποστερεῖτε. ‘சகோதரர்கள்’ retains the masculine plural wording, while the footnote appropriately notes its potentially broader fellow-believer reference.
  issues:
  - severity: medium
    issue: ‘சகோதரர்களிடமே’ uses a locative case form.
    rationale: The Greek accusative ἀδελφούς functions as the object of ‘wrong’ and ‘defraud,’ not as a location. ‘சகோதரர்களுக்கே’ naturally marks those against whom the acts are committed and preserves the emphasis of καὶ τοῦτο.
  revised_text: ஆனால் நீங்களே அநியாயம் செய்கிறீர்கள், ஏமாற்றிப் பறிக்கிறீர்கள்—அதுவும் சகோதரர்களுக்கே[a].
