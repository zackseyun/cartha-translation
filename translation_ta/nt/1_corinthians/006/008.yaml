- from: ஆனால் நீங்களே அநியாயம் செய்கிறீர்கள், ஏமாற்றிப் பறிக்கிறீர்கள்—அதுவும் சகோதரர்களிடமே[a].
  to: ஆனால் நீங்களே அநியாயம் செய்கிறீர்கள், ஏமாற்றிப் பறிக்கிறீர்கள்—அதுவும் சகோதரர்களுக்கே[a].
