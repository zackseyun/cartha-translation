  yaml_path: translation/nt/1_corinthians/006/008.yaml
  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: ta
  text: ஆனால் நீங்களே அநியாயம் செய்கிறீர்கள், ஏமாற்றிப் பறிக்கிறீர்கள்—அதுவும் சகோதரர்களுக்கே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளுக்கே.” கிரேக்கத்தில் “சகோதரர்கள்” என்று உள்ளது; இச்சொல் சக விசுவாசிகள் அனைவரையும் விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுக்கு வலுவான முரண்பாட்டைக் குறிக்கும் இயல்பான தமிழ் இணைப்புச் சொல்.
- source_word: ὑμεῖς
  choice: நீங்களே
  rationale: கிரேக்கத்தில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ள வலியுறுத்தப்பட்ட முன்னிலையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀδικεῖτε
  choice: அநியாயம் செய்கிறீர்கள்
  rationale: நீதிக்குப் புறம்பாக நடப்பது அல்லது ஒருவருக்குத் தீங்கிழைப்பது என்ற பரந்த அறநெறிப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἀποστερεῖτε
  choice: ஏமாற்றிப் பறிக்கிறீர்கள்
  rationale: ஒருவருக்குரியதை மோசடியாக மறுத்தல் அல்லது பறித்தல் என்ற வினையின் பொருளையும் இப்பகுதியின் சட்ட, பொருளாதாரச் சூழலையும் வெளிப்படுத்துகிறது.
- source_word: καὶ τοῦτο
  choice: —அதுவும்
  rationale: குற்றத்தின் தீவிரத்தை உயர்த்திக் காட்டும் கிரேக்கச் சொல்லமைப்பின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἀδελφούς
  choice: சகோதரர்களிடமே
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் காக்கிறது; ‘-ஏ’ விகுதி, இப்படிச் செய்யப்படுவது சக விசுவாசிகளிடமே என்பதைக் கூர்மைப்படுத்துகிறது.
theological_decisions:
- issue: கலப்பு பாலின விசுவாசக் குழுவில் ἀδελφούς என்பதன் பொருள்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; சக விசுவாசிகள்
  rationale: மூலச் சொல் இலக்கணப்படி ஆண்பால் பன்மையாக இருந்தாலும், பவுலின் பயன்பாட்டில் அது கிறிஸ்தவச் சமூகத்தின் சக உறுப்பினர்களை விரிவாகக் குறிக்கலாம். ஆகவே மூல வடிவம் முதன்மை உரையில் வைக்கப்பட்டு, சூழலில் உள்ளடக்கப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், நேரடியான கண்டனத் தொனியுடனும் dignified பேச்சு வழக்குக்கு அண்மையான நடையுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட கோடு ‘அதுவும்’ என்ற சொல்லின் சொல்லாட்சித் தாக்கத்தைத் தெளிவாக்குகிறது.
