review_pass:
  verdict: approve
  source_fidelity: 'The Tamil faithfully renders all elements of the SBLGNT text: γάρ as a causal connective, ἠγοράσθητε with the passive purchase imagery, τιμῆς as the cost paid, δή with an appropriately inferential/exhortative transition, δοξάσατε as an imperative, and ἐν τῷ σώματι ὑμῶν as ‘in your body.’ It correctly does not include the longer-text addition concerning ‘spirit,’ which is absent from the supplied SBLGNT text.'
  naturalness: ‘ஏனெனில், நீங்கள் விலை கொடுத்து வாங்கப்பட்டீர்கள். ஆகவே, உங்கள் உடலில் கடவுளை மகிமைப்படுத்துங்கள்’ is clear, dignified modern standard Tamil. The singular ‘உடலில்’ with plural possessive ‘உங்கள்’ is natural and suitably reflects the Greek construction.
  terminology: ‘விலை கொடுத்து வாங்கப்பட்டீர்கள்’ preserves the commercial metaphor without importing a narrower doctrinal term. ‘மகிமைப்படுத்துங்கள்’ is an established and appropriate rendering of δοξάσατε. ‘கடவுள்’ is a standard general Tamil designation for God and fits the stated register.
