id: 1CO.6.20
reference: 1 Corinthians 6:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἠγοράσθητε γὰρ τιμῆς· δοξάσατε δὴ τὸν θεὸν ἐν τῷ σώματι ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் விலை கொடுத்து வாங்கப்பட்டீர்கள்[a]. ஆகவே[b], உங்கள் உடலில் கடவுளை மகிமைப்படுத்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் ஒரு விலைக்கு வாங்கப்பட்டீர்கள்.” கிரேக்கச் சொற்றொடர், வாங்குவதற்கான விலை செலுத்தப்பட்டதைக் குறிக்கும் உருவகத்தைத் தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “ஆகவே” என்பதற்கு “அப்படியானால்” என்றும் மொழிபெயர்க்கலாம்; அல்லது தனிச் சொல்லாக மொழிபெயர்க்காமல் விடலாம். கிரேக்கத் துகள் கட்டளைக்கு வலியுறுத்தலையும் அவசர உணர்வையும் சேர்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: வாங்கப்பட்டீர்கள்
  rationale: ἀγοράζω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம். சந்தையில் வாங்குதல் என்ற உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τιμῆς
  choice: விலை கொடுத்து
  rationale: வாங்குவதற்குச் செலுத்தப்பட்ட விலையைக் குறிக்கும் மரபுத்தொடரை இயல்பான தமிழில் தருகிறது; கொள்முதல் உருவகத்தையும் காக்கிறது.
- source_word: δοξάσατε
  choice: மகிமைப்படுத்துங்கள்
  rationale: δοξάζω என்பதன் கட்டளையையும் அதன் இறையியல் நிறையையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: δὴ
  choice: ஆகவே
  rationale: கூறப்பட்ட காரணத்திலிருந்து கட்டளைக்குச் செல்லும் முடிவுறுத்தும் வலிமையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: உங்கள் உடலில்
  rationale: ἐν என்பதன் இடம்/கருவி சார்ந்த விரிவைத் தேவையின்றி சுருக்காமல் வைக்கிறது; உடல் நடத்தையை வலியுறுத்தும் சூழலுக்கும் பொருந்துகிறது.
theological_decisions:
- issue: விலை கொடுத்து வாங்குதல் என்ற மீட்பு உருவகம்
  choice: “விலை கொடுத்து வாங்கப்பட்டீர்கள்” என்று கொள்முதல் உருவகத்தைத் தக்கவைத்தல்
  alternative: “விலை செலுத்தி மீட்கப்பட்டீர்கள்”
  rationale: மூலத்தில் சந்தை சார்ந்த வாங்குதல் மொழியே உள்ளது. “மீட்கப்பட்டீர்கள்” என்பது விளக்கத்தைச் சேர்த்து உருவகத்தை மாற்றக்கூடும்.
- issue: உடல் சார்ந்த ஒழுக்கம்
  choice: σῶμα என்பதை “உடல்” என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: “வாழ்வு” அல்லது “முழு ஆளுமை”
  rationale: உடலைச் சார்ந்த பாலியல் நடத்தை உடனடிச் சூழலாக இருப்பதால், குறிப்பான சொல்லை விரிவுபடுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “விலை கொடுத்து வாங்கப்பட்டீர்கள்” என்பது இயல்பான தமிழையும் மூலத்தின் கொள்முதல் உருவகத்தையும் இணைக்கிறது. பன்மை “உங்கள்” என்பதுடன் ஒருமை “உடல்” பயன்படுத்தப்பட்டிருப்பது, சமூகத்திலுள்ள ஒவ்வொருவரின் உடல் நடத்தையையும் குறிக்கும் மூல அமைப்பை இயல்பாகப் பிரதிபலிக்கிறது.
