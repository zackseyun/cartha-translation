  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: ta
  text: நாம் தேவதூதர்களை நியாயந்தீர்ப்போம் என்பது உங்களுக்குத் தெரியாதா? அப்படியானால், இவ்வாழ்க்கைக்குரிய காரியங்களைத் தீர்க்கிறோமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவ்வாழ்க்கைக்குரிய காரியங்களைப் பற்றிச் சொல்லவே வேண்டுமா?” அல்லது “இவ்வாழ்க்கைக்குரிய காரியங்கள் என்றால் சொல்லவே வேண்டியதில்லை.”
    reason: μήτιγε பெரியதிலிருந்து சிறியதற்குச் செல்லும் வாதத்தின் வலிமையைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத வினைச்செயல் சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாதா
  rationale: பவுல் திரும்பத் திரும்பப் பயன்படுத்தும் வலியுறுத்தும் வினா வடிவத்தை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: ὅτι
  choice: என்பது
  rationale: ‘தெரியாதா’ என்பதன் பொருள்-நிரப்பு வாக்கியத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: ἀγγέλους
  choice: தேவதூதர்களை
  rationale: இந்த இறுதிக்கால நியாயத்தீர்ப்புச் சூழலில் மனிதத் தூதர்கள் அல்ல, வானுலகத் தூதர்களே குறிக்கப்படுகின்றனர்; தமிழில் ‘தேவதூதர்கள்’ என்பது இதற்கான தெளிவான வழக்குச் சொல்.
- source_word: κρινοῦμεν
  choice: நாம் ... நியாயந்தீர்ப்போம்
  rationale: எதிர்காலக் காலத்தைத் தக்கவைத்து, தீர்ப்பளித்தல் அல்லது மதிப்பிடுதல் என்ற நீதிசார் பொருளை அளவுக்கு மீறி விளக்காமல் வெளிப்படுத்துகிறது.
- source_word: μήτιγε
  choice: அப்படியிருக்க ... எவ்வளவு எளிது
  rationale: பெரியதிலிருந்து சிறியதற்குச் செல்லும் வாதத்தின் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது. மூலத்தில் விடப்பட்டுள்ள வினைச்செயலைச் சூழலிலிருந்து ‘தீர்ப்பது’ என நிறைவு செய்கிறது.
- source_word: βιωτικά
  choice: இவ்வாழ்க்கைக்குரிய காரியங்கள்
  rationale: அன்றாட பூவுலக வாழ்க்கையைச் சார்ந்த விவகாரங்களைப் பொதுவாகக் குறிக்கிறது; சூழலிலுள்ள சட்டத் தகராறுகளுக்கு மட்டும் பொருளைச் சுருக்கவில்லை.
theological_decisions:
- issue: விசுவாசிகள் தேவதூதர்களை நியாயந்தீர்ப்பதன் தன்மை
  choice: ‘நாம் தேவதூதர்களை நியாயந்தீர்ப்போம்’ என்ற நேரடி சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘நாம் தேவதூதர்களை ஆள்வோம்’ அல்லது ‘விழுந்துபோன தேவதூதர்களுக்குத் தீர்ப்பளிப்போம்’
  rationale: இந்தத் தீர்ப்பின் முறை, எல்லை, அல்லது எந்த தேவதூதர்கள் குறிக்கப்படுகின்றனர் என்பதை வசனம் விளக்கவில்லை. ஆகவே ஒரு குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டை மொழிபெயர்ப்பில் புகுத்தாமல் மூலத்தின் இறையியல் இழுபறி தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நியாயந்தீர்ப்போம்’ என்பது நீதிசார் பொருளைத் தெளிவாகத் தக்கவைக்கும் பரவலாக அறியப்பட்ட வேதாகமத் தமிழ் வடிவம்; மற்ற வாக்கிய அமைப்பு இன்றைய இயல்பான தமிழில் வைக்கப்பட்டுள்ளது.
