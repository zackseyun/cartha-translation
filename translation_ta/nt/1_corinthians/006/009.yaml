source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: ta
  text: 'அல்லது, அநீதியுள்ளவர்கள் கடவுளுடைய அரசாட்சியைச் சுதந்தரிக்கமாட்டார்கள் என்பது உங்களுக்குத் தெரியாதா? ஏமாந்துபோகாதீர்கள்: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்களும், சிலைவழிபாட்டாளர்களும், திருமணத்துரோகம் செய்கிறவர்களும், மென்மையானவர்கள்[a], ஆண்களோடு பாலுறவு கொள்கிற ஆண்களும்[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மென்மையான ஆண்கள்,” “பெண்மைத் தன்மையுள்ள ஆண்கள்,” அல்லது இச்சூழலில் “ஆண் விபசாரிகள்” அல்லது ஆண்-ஆண் பாலுறவில் ஏற்கும் பங்காளிகள் என்றும் பொருள் கொள்ளலாம். μαλακοί என்ற சொல் மென்மை, பெண்மைத் தன்மை, ஒழுக்க பலவீனம் ஆகியவற்றையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “ஆண்களுடன் முறைகேடான பாலுறவில் ஈடுபடுகிற ஆண்கள்,” “ஓரினச்சேர்க்கையில் ஈடுபடுகிற ஆண்கள்,” அல்லது மரபுவழியாக “சோதோமியர்” என்றும் மொழிபெயர்க்கப்படுகிறது. ἀρσενοκοῖται என்பது அரிதானதும் விவாதத்திற்குரியதுமான சொல்; கிரேக்க லேவியராகமத்தின் சொல்லாட்சியோடு இதை பலர் தொடர்புபடுத்துகின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: அல்லது
  rationale: முந்தைய வாதத்தைத் தொடர்ந்து வரும் பவுலின் கூர்மையான வினாவை இயல்பாக இணைக்கிறது.
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாதா?
  rationale: அறிவை நினைவூட்டும் பவுலின் வழக்கமான சொல்லாட்சியை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἄδικοι
  choice: அநீதியுள்ளவர்கள்
  rationale: தனி செயல்களை மட்டும் குறுகச் சொல்லாமல், மூலத்தின் ஒழுக்க மற்றும் நீதிசார் வகைப்பாட்டைத் தக்கவைக்கிறது.
- source_word: θεοῦ βασιλείαν
  choice: கடவுளுடைய அரசு
  rationale: மூலத்தின் இறையாட்சிக் கருத்தைத் தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: κληρονομήσουσιν
  choice: உரிமையாகப் பெறமாட்டார்கள்
  rationale: சுதந்தரித்தல் என்ற உடன்படிக்கை மற்றும் இறுதிக்காலப் பின்னணியை, சாதாரண வாசகருக்கு இயல்பாகப் புரியும் வகையில் வெளிப்படுத்துகிறது.
- source_word: μὴ πλανᾶσθε
  choice: ஏமாந்துபோகாதீர்கள்
  rationale: செயப்பாட்டு எச்சரிக்கையையும் தவறாக வழிநடத்தப்படுதல் அல்லது தம்மை ஏமாற்றிக்கொள்ளுதல் என்ற திறந்த பொருளையும் காக்கிறது.
- source_word: πόρνοι
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்கள்
  rationale: பழமையான அல்லது அளவுக்கு மீறிக் குறுகிய சொல்லைத் தவிர்த்து, பரந்த பாலியல் தவறொழுக்கத்தைக் குறிக்கிறது.
- source_word: εἰδωλολάτραι
  choice: சிலைவழிபாட்டாளர்கள்
  rationale: நேரடியான, பொதுவாகப் புரியும் இணைச்சொல்.
- source_word: μοιχοὶ
  choice: விபசாரிகள்
  rationale: திருமண உறவை மீறும் பாலியல் செயலைக் குறிக்கும் மூலத்தின் குறிப்பிட்ட பொருளைத் தக்கவைக்கிறது.
- source_word: μαλακοὶ
  choice: மென்மையான ஆண்கள்
  rationale: சொல்லின் நேரடியான 'மென்மையானவர்கள்' என்ற பொருளைத் தக்கவைத்து, சர்ச்சைக்குரிய பாலியல் பொருளை முதன்மை உரையில் உறுதியாகத் தீர்மானிக்காமல் அடிக்குறிப்பில் விளக்குகிறது.
- source_word: ἀρσενοκοῖται
  choice: ஆண்களோடு பாலுறவு கொள்கிற ஆண்கள்
  rationale: நவீன அடையாள வகைகளைத் திணிக்காமல், ஆண்களுக்கிடையிலான பாலியல் செயலை விவரிப்பாகக் கூறுகிறது; அரிதான இச்சொல்லின் விவாதத்திற்குரிய வரம்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: μαλακοὶ மற்றும் ἀρσενοκοῖται ஆகிய சர்ச்சைக்குரிய சொற்களின் தொடர்பும் வரம்பும்
  choice: முதலாவதை 'மென்மையான ஆண்கள்' என்றும் இரண்டாவதை 'ஆண்களோடு பாலுறவு கொள்கிற ஆண்கள்' என்றும் தனித்தனியாக மொழிபெயர்த்து, மாற்று விளக்கங்களை அடிக்குறிப்புகளில் தருதல்
  alternative: இரண்டையும் முறையே ஆண்-ஆண் பாலுறவின் ஏற்கும் மற்றும் செயற்படும் பங்காளிகள் எனத் தெளிவுபடுத்துதல்; அல்லது 'பெண்மைத் தன்மையுள்ள ஆண்கள்', 'ஆண் விபசாரிகள்', 'ஓரினச்சேர்க்கையில் ஈடுபடுகிற ஆண்கள்' என மொழிபெயர்த்தல்
  rationale: μαλακοὶ என்பதற்கு மென்மை, ஆடம்பர வாழ்வு, பெண்மைத் தன்மை, ஒழுக்க பலவீனம் அல்லது இச்சூழலில் ஆண்-ஆண் பாலுறவின் ஒரு பங்கு எனப் பல விளக்கங்கள் உள்ளன. ἀρσενοκοῖται அரிதான சொல்; செப்துவஜிந்தாவின் லேவியராகமச் சொல்லாட்சியுடன் தொடர்புபடுத்தப்படுவது பொதுவானதாயினும் அதன் துல்லிய வரம்பு விவாதத்திற்குரியது. ஆகவே நவீன பாலியல் அடையாளப் பிரிவுகளைத் திணிக்காமல், உண்மையான தெளிவின்மையை அடிக்குறிப்புகளில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. வசனம் அடுத்த வசனத்தில் தொடரும் பட்டியலின் நடுப்பகுதியில் முடிவதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. சர்ச்சைக்குரிய சொற்களில் மிகைத் துல்லியத்தைத் தவிர்த்து, மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
