id: 1CO.6.2
reference: 1 Corinthians 6:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: ta
  text: அல்லது, பரிசுத்த மக்கள் உலகத்திற்குத் தீர்ப்பளிப்பார்கள் என்பது உங்களுக்குத் தெரியாதா? உலகம் உங்கள் மூலமாகத் தீர்ப்பிடப்படுமானால்[a], மிகச் சிறிய வழக்குகளைக்கூடத் தீர்ப்பதற்கு நீங்கள் தகுதியற்றவர்களா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களிடையே.” கிரேக்கச் சொற்றொடரை இன்னும் நேரடியாக இவ்வாறு மொழிபெயர்க்கலாம்; சூழலில் பரிசுத்த மக்கள் உலகத்தின் தீர்ப்பில் பங்கேற்பதே கருத்தாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மிகச் சிறிய நீதிமன்றங்களுக்குக்கூட.” கிரேக்கச் சொல் நீதிமன்றங்களையோ, தீர்ப்புக்குரிய வழக்குகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: முந்தைய வாதத்தைத் தொடர்ந்து மற்றொரு சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்துகிறது; பவுலின் கூர்மையான வாத ஓட்டத்தைப் பேணுகிறது.
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாதா
  rationale: பவுல் வழக்கமாகப் பயன்படுத்தும் சொல்லாட்சிக் கேள்வியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: οἱ ἅγιοι
  choice: பரிசுத்த மக்கள்
  rationale: தேவனுக்கெனப் பிரித்தெடுக்கப்பட்ட விசுவாசிகளைக் கூட்டாகக் குறிக்கிறது; ஒரு சிறப்புப் பட்டம் பெற்ற குறுகிய குழுவைக் குறிக்காமல், தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது.
- source_word: τὸν κόσμον
  choice: உலகத்திற்கு
  rationale: மனித உலகம் அல்லது பரந்த படைப்புலகம் தீர்ப்புக்குட்படுவதைக் குறிக்கும் சொல்லின் பரந்த தன்மையைப் பேணுகிறது.
- source_word: κρινοῦσιν
  choice: தீர்ப்பளிப்பார்கள்
  rationale: எதிர்காலத்தில் நிகழும் நியாயத்தீர்ப்பைத் தெளிவாகக் காட்டுகிறது; அதன் முறை அல்லது அதிகாரத்தின் அளவை மேலதிகமாக வரையறுக்கவில்லை.
- source_word: ἐν ὑμῖν
  choice: உங்கள் மூலமாக
  rationale: சூழலில் பரிசுத்த மக்கள் உலகத்தின் தீர்ப்பில் பங்கேற்பதை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கத்தின் ‘உங்களிடையே’ என்ற நேரடியான சாத்தியம் அடிக்குறிப்பில் பேணப்பட்டுள்ளது.
- source_word: κρίνεται
  choice: தீர்ப்பிடப்படுமானால்
  rationale: நிபந்தனை வாக்கியத்திலுள்ள நிகழ்காலச் செயப்பாட்டு வடிவத்தின் பொது அல்லது எதிர்கால நோக்கத்தைத் தமிழில் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: ἀνάξιοί ἐστε
  choice: நீங்கள் தகுதியற்றவர்களா
  rationale: தகுதி அல்லது பொருத்தம் இல்லாமையைச் சுட்டும் கிரேக்கச் சொல்லின் மதிப்பீட்டுத் தாக்கத்தையும் சொல்லாட்சிக் கேள்வியின் கூர்மையையும் பேணுகிறது.
- source_word: κριτηρίων ἐλαχίστων
  choice: மிகச் சிறிய வழக்குகளைக்கூடத் தீர்ப்பதற்கு
  rationale: சூழலில் அற்பமான நீதிவிவகாரங்களைக் கையாளும் தகுதியைக் கேட்பதாக இயல்பான தமிழில் தருகிறது; ‘மிகச் சிறிய நீதிமன்றங்கள்’ என்ற இடவியல் வாசிப்பையும் அடிக்குறிப்பில் பதிவு செய்கிறது.
theological_decisions:
- issue: ‘பரிசுத்த மக்கள்’ என்பவர்களின் அடையாளம்
  choice: இறுதிக்காலத் தீர்ப்பில் பங்கேற்கும் விசுவாசிகள், அதாவது தேவனுடைய மக்கள் அனைவரும்
  alternative: விசேஷமாகப் பரிசுத்தமான விசுவாசிகளைக் கொண்ட குறுகிய குழு
  rationale: பவுலின் வழக்கமான பயன்பாட்டில் οἱ ἅγιοι என்பது கிறிஸ்தவர்களைப் பொதுவாகக் குறிக்கிறது; குறிப்பிட்ட உயர்நிலைக் குழுவை இவ்வசனம் வரையறுக்கவில்லை.
- issue: பரிசுத்த மக்கள் உலகத்திற்குத் தீர்ப்பளிப்பதன் தன்மை
  choice: எதிர்கால நியாயத்தீர்ப்பில் உண்மையான பங்கேற்பு; அது எவ்வாறு நடைபெறும் என்பதை வரையறுக்காமல் விடுதல்
  alternative: வெறும் உவமையான ஒழுக்க மதிப்பீடு; அல்லது தனித்த, முழுமையான நீதித்துறை அதிகாரம்
  rationale: வசனம் பங்கேற்பை நேரடியாகக் கூறுகிறது; ஆனால் அதன் முறை, அளவு, அதிகார உறவு ஆகியவற்றை விளக்கவில்லை. மொழிபெயர்ப்பு இந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையில் dignified ஆனால் மிகப் பழமையான நடையின்றி வடிவமைக்கப்பட்டது. ‘பரிசுத்தவான்கள்’ என்பதற்குப் பதிலாக கூட்டுப் பொருளைத் தெளிவாக்க ‘பரிசுத்த மக்கள்’ பயன்படுத்தப்பட்டது. சொல்லாட்சிக் கேள்விகளின் கூர்மை பேணப்பட்டுள்ளது; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
