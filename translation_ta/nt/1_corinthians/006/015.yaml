id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: ta
  text: உங்கள் உடல்கள் மெசியாவின்[a] உறுப்புகள் என்பது உங்களுக்குத் தெரியாதா? அப்படியானால், மெசியாவின் உறுப்புகளை எடுத்து ஒரு பாலியல் தொழிலாளியின் உறுப்புகளாக ஆக்குவேனா? ஒருபோதும் அப்படி ஆகக்கூடாது![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின்.” கிரேக்கச் சொல்லான Χριστός, மொழிபெயர்க்கப்பட்ட பட்டப்பெயராக “மெசியா” என்றும், பெயர்போன்ற வடிவமாக “கிறிஸ்து” என்றும் செயல்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நிச்சயமாக இல்லை!” கிரேக்கத்தில் இது மிகவும் வலிமையான நிராகரிப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: உடல்கள்
  rationale: விசுவாசிகளின் மெய்யான உடல்சார்ந்த இருப்பைக் குறிக்கும் பன்மையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: μέλη
  choice: உறுப்புகள்
  rationale: ஒரு உடலுக்குரிய பாகங்கள் என்ற உருவகத்தையும், ஒருவரோடு இணைந்திருப்பது என்ற கருத்தையும் தமிழில் தக்கவைக்கிறது.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப் பொருளை வெளிப்படுத்துகிறது; ‘கிறிஸ்துவின்’ என்ற பெயர்போன்ற வாசிப்பும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἄρας
  choice: எடுத்து
  rationale: பவுல் வெறுத்து மறுக்கும் கற்பனையான செயலை அறிமுகப்படுத்தும் இறந்தகால வினையெச்சத்தின் இயல்பான தமிழ் வடிவம்.
- source_word: ποιήσω
  choice: ஆக்குவேனா
  rationale: கேள்விக்குரிய முதல் நபர் வினையின் ஆலோசனைத் தன்மையையும் அதிர்ச்சியூட்டும் சொல்லாட்சியையும் காக்கிறது.
- source_word: πόρνης
  choice: ஒரு பாலியல் தொழிலாளியின்
  rationale: இச்சூழலில் பெண்பால் பாலியல் தொழிலாளியைக் குறிப்பாகக் குறிக்கிறது; ‘விபச்சாரி’ என்பது விபச்சாரத்தோடு குழப்பத்தை ஏற்படுத்தலாம், ‘விலைமகள்’ இன்றைய பயன்பாட்டில் இழிவாகவோ பழமையாகவோ ஒலிக்கலாம்.
- source_word: μὴ γένοιτο
  choice: ஒருபோதும் அப்படி ஆகக்கூடாது
  rationale: வெறும் மறுப்பை விட வலிமையான, அருவருப்பான முடிவை முற்றிலும் நிராகரிக்கும் விருப்பநிலைச் சொல்லாற்றலைப் பாதுகாக்கிறது.
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாதா
  rationale: கேட்போர் ஏற்கெனவே அறிந்திருக்க வேண்டிய ஒன்றை நினைவூட்டும் பவுலின் சொல்லாட்சிக் கேள்வியை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: Χριστός என்பதன் பட்டப்பெயர் மற்றும் பெயர்போன்ற பயன்பாட்டுக்கிடையிலான தெளிவின்மை
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: மூலச்சொல்லின் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப் பொருளை முதன்மை உரையில் வெளிப்படுத்துகிறது; ‘கிறிஸ்து’ என்ற வழக்கமான பெயர்போன்ற வடிவத்தை அடிக்குறிப்பில் அளிப்பதால் மூலத்தின் உண்மையான இருவகைச் செயல்பாடும் மறைக்கப்படவில்லை.
- issue: விசுவாசிகளின் உடல்கள் மெசியாவின் μέλη எனப்படுவதன் உருவகம்
  choice: உறுப்புகள்
  alternative: உடல் பாகங்கள்
  rationale: உடலின் பாகங்கள் என்ற உருவகத்தையும் மெசியாவுக்குச் சொந்தமானவர்களாக இருப்பதையும் ஒரே சொல்லில் தக்கவைக்கிறது; ஒன்றிப்பின் இயல்பை உரை கூறுவதைக் கடந்துச் சித்தாந்த ரீதியாக வரையறுக்கவில்லை.
- issue: μὴ γένοιτο என்பதன் மறுப்பாற்றல்
  choice: ஒருபோதும் அப்படி ஆகக்கூடாது
  alternative: நிச்சயமாக இல்லை
  rationale: இது சாதாரண எதிர்மறைப் பதில் மட்டுமல்ல, எண்ணிப் பார்க்கப்பட்ட முடிவையே கடுமையாக நிராகரிக்கும் வெளிப்பாடு; தேர்ந்த வடிவம் அதன் வலிமையையும் விருப்பநிலை நயத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘பாலியல் தொழிலாளி’ என்பது πόρνη என்பதன் குறிப்பான பொருளைத் தெளிவாகத் தருகிறது; பழமையான அல்லது தேவையற்ற இழிவுணர்வுள்ள சொற்கள் தவிர்க்கப்பட்டுள்ளன. பவுலின் இரண்டு சொல்லாட்சிக் கேள்விகளும் இறுதியிலுள்ள கடுமையான மறுப்பும் பாதுகாக்கப்பட்டுள்ளன.
