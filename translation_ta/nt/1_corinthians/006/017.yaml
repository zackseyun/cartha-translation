  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: ta
  text: ஆனால் ஆண்டவரோடு இணைந்தவரோ, அவருடன் ஒரே ஆவியாக இருக்கிறார்[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னை ஆண்டவரோடு இணைத்துக்கொள்கிறவர்.” கிரேக்க வினைச்சொல் ஒருவர் தாமே இணைவதையோ, இணைக்கப்பட்ட நிலையில் இருப்பதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “ஒரே ஆவியாக இருக்கிறார்.” “அவருடன்” என்பது கிரேக்கத்தில் சூழலால் உணர்த்தப்பட்டிருப்பதால், தமிழில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: c
    text: “ஆவி” என்பதைச் சிலர் பரிசுத்த ஆவியைக் குறிப்பதாகப் புரிந்துகொள்ளலாம். எனினும், இச்சொற்றொடர் விசுவாசி ஆண்டவருடன் ஆவியில் ஒன்றுபட்டிருப்பதை இயல்பாகக் குறிக்கிறது. கிரேக்கக் கையெழுத்துப் பிரதிகளில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος
  choice: இணைந்திருப்பவர்
  rationale: κολλάομαι நெருக்கமாகச் சேர்தல் அல்லது பற்றிக்கொள்ளுதல் என்ற பொருளைத் தருகிறது. முந்தைய வசனத்திலுள்ள உடல்சார்ந்த இணைப்புக்கு எதிராக ஆண்டவருடனான நெருங்கிய இணைப்பை இச்சொல் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்க நடுநிலை/செயப்பாட்டு வடிவத்தின் தெளிவின்மையையும் ஓரளவு காக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: பவுலின் இப்பயன்பாட்டில் உயிர்த்தெழுந்த இயேசுவைக் குறிக்கும் வழக்கமான, இறையியல் நிறை கொண்ட தமிழ் சொல்.
- source_word: ἓν
  choice: ஒரே
  rationale: ἓν என்பது எண்ணிக்கையிலும் தன்மையிலும் ஒன்றாயிருப்பதை வலியுறுத்துகிறது; வெறும் மனஒற்றுமையை மட்டும் குறிக்கவில்லை.
- source_word: πνεῦμα
  choice: ஆவி
  rationale: இங்கு πνεῦμα என்பது ஆண்டவரோடு இணைந்த விசுவாசி ‘ஒரே ஆவி’யாய் இருப்பதை இயல்பாகக் குறிக்கிறது. தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால் மாற்று இறையியல் வாசிப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ὁ δὲ ... ἐστιν
  choice: ஆனால் ... இருப்பவரோ ... இருக்கிறார்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கப் பங்கேற்புவினையை இயல்பான ஒருமைத் தமிழில் தருகிறது; ‘ஆனால்’ மற்றும் ‘-ஓ’ முந்தைய வசனத்துடனான முரண்பாட்டை வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: ‘ஒரே ஆவி’ என்று சொல்லப்படும் இணைப்பின் இயல்பு
  choice: விசுவாசிக்கும் ஆண்டவருக்கும் இடையிலான உண்மையான ஆவிக்குரிய இணைப்பைச் சொல்வது; இருவரின் தனித்தன்மையையும் அழிக்காமல் காப்பது
  alternative: முழுமையான மறைஞான அடையாள ஒன்றிப்பு; அல்லது வெறும் மனப்பான்மை மற்றும் நோக்க ஒற்றுமை
  rationale: சூழலில் பவுல் முந்தைய வசனத்தின் உடல்சார்ந்த இணைப்பை ஆண்டவருடனான ஆவிக்குரிய இணைப்புடன் ஒப்பிடுகிறார். ‘அவருடன் ஒரே ஆவியாய்’ என்பது இணைப்பின் வலிமையைக் காத்தாலும், இருவரும் ஒரே தனிப்பட்ட இருப்பாகக் கலந்துவிடுகிறார்கள் என்று கூறாது.
- issue: கிரேக்கத்தில் வெளிப்படையாக இல்லாத தொடர்புச் சொல்லை வழங்குதல்
  choice: ‘அவருடன்’ என்பதைத் தெளிவுக்காகச் சேர்த்தல்
  alternative: ‘ஒரே ஆவியாய் இருக்கிறார்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: கிரேக்கச் சூழலில் ஆண்டவருடனான தொடர்பு உள்ளடங்கியுள்ளது. தமிழில் ‘அவருடன்’ என்பது அந்த உறவைத் தெளிவுபடுத்துகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
- issue: πνεῦμα என்பதன் சாத்தியமான குறிப்பு
  choice: விசுவாசி ஆண்டவருடன் ஆவியில் ஒன்றுபட்டிருப்பதாக வாசித்தல்
  alternative: இங்கு ‘ஆவி’ என்பது நேரடியாகப் பரிசுத்த ஆவியைக் குறிப்பதாக வாசித்தல்
  rationale: ἓν πνεῦμα என்ற சொற்றொடரும் முந்தைய வசனத்துடனான ஒப்புமையும் விசுவாசியின் ஆவிக்குரிய ஒன்றிப்பை முதன்மையாகச் சுட்டுகின்றன. இருப்பினும் கிரேக்கக் கையெழுத்துப் பிரதிகளில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால் மாற்று வாசிப்பை முற்றிலும் மறைக்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இணைந்திருப்பவர்’ நெருக்கமான ஒன்றிப்பைத் தெரிவிக்கிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன. ‘அவருடன்’ வாசிப்புத் தெளிவுக்காக வழங்கப்பட்டாலும், அதன் உள்ளடக்கப்பட்ட தன்மை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
