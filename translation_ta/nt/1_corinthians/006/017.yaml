revisions:
- from: ஆனால் ஆண்டவரோடு இணைந்திருப்பவரோ, அவருடன் ஒரே ஆவியாய் இருக்கிறார்[a][b][c].
  to: ஆனால் ஆண்டவரோடு இணைந்தவரோ, அவருடன் ஒரே ஆவியாக இருக்கிறார்[a][b][c].
  rationale: The revision makes a minor idiomatic improvement to the Tamil predicate construction and streamlines the participial expression. It preserves the original’s contrast, the close-union sense of κολλώμενος, the implicit relational complement clarified by ‘அவருடன்,’ and the interpretive openness of πνεῦμα.
