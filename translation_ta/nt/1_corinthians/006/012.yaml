id: 1CO.6.12
reference: 1 Corinthians 6:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: ta
  text: “எல்லாமே எனக்கு அனுமதிக்கப்பட்டவை”[a]; ஆனால் எல்லாமே பயனளிப்பதில்லை[b]. “எல்லாமே எனக்கு அனுமதிக்கப்பட்டவை”; ஆனால் நான் எதன் அதிகாரத்திற்கும் உட்படமாட்டேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, மேற்கோள் குறிகள் இல்லாமல்: எல்லாமே எனக்கு அனுமதிக்கப்பட்டவை. இந்தக் கூற்றைக் கொரிந்தியரின் முழக்கமாகப் பவுல் மேற்கோள் காட்டி, பின்னர் அதற்கு வரம்பு விதிக்கிறார் என்று பலர் புரிந்துகொள்கிறார்கள்.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, நன்மை தருவதில்லை; அல்லது, உதவியாக இருப்பதில்லை.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ஆனால் எதுவும் என்மேல் அதிகாரம் செலுத்த நான் விடமாட்டேன்; அல்லது, நான் எதற்கும் கட்டுப்பட மாட்டேன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: எல்லாவற்றையும் செய்ய எனக்கு அனுமதி உண்டு
  rationale: ἔξεστιν என்பது அனுமதிக்கப்பட்டிருப்பதைக் குறிக்கிறது. தமிழில் இயல்பான முழு வாக்கியமாக அமைய ‘செய்ய’ சேர்க்கப்பட்டுள்ளது; Πάντα என்பதன் விரிவான பொருளும் மீள்வடிவமும் காக்கப்பட்டுள்ளன.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: ஆனால் எல்லாமே பயனளிப்பதில்லை
  rationale: συμφέρει என்பது பயனுடையதாக அல்லது நன்மை தருவதாக இருப்பதைக் குறிக்கிறது. ‘பயனளிப்பதில்லை’ என்பது வணிக இலாபம் என்ற குறுகிய பொருளைத் தவிர்த்து, பொதுவான நன்மை/உதவி என்ற மதிப்பீட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος
  choice: ஆனால் எதுவும் என்னைத் தன் அதிகாரத்திற்குள் கொண்டுவர நான் விடமாட்டேன்
  rationale: ἐξουσιασθήσομαι என்பது அதிகாரத்திற்குக் கீழ்ப்படுத்தப்படுதல் அல்லது கட்டுப்படுத்தப்படுதல் என்ற வலிமையான பொருளுடைய எதிர்காலச் செயப்பாட்டு வடிவம். ‘நான் விடமாட்டேன்’ என்பது வெளிப்படையான ἐγώ தரும் அழுத்தத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; τινος இச்சூழலில் ‘எதுவும்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: Πάντα μοι ἔξεστιν என்ற மீளும் கூற்றை கொரிந்தியரின் முழக்கமாக மேற்கோள் குறிகளுக்குள் வைப்பதா
  choice: இரு இடங்களிலும் மேற்கோள் குறிகளுக்குள் வழங்கப்பட்டது
  alternative: மேற்கோள் குறிகள் இல்லாமல், பவுலின் சொந்தக் கூற்றாகவும் அதைத் தொடர்ந்து வரும் வரம்புகளுடன் வாசித்தல்
  rationale: இது கொரிந்தியரின் முழக்கத்தைப் பவுல் மேற்கோள் காட்டித் தகுதிப்படுத்துவதாகப் பலர் புரிந்துகொள்கிறார்கள். ஆனால் கிரேக்கக் கையெழுத்துப் பிரதிகளில் மேற்கோள் குறிகள் இல்லை; ஆகவே இது உரைத் தீர்மானம் அல்ல, விளக்கத் தீர்மானம். அந்த உண்மையான தெளிவின்மையை [a] அடிக்குறிப்பு பதிவு செய்கிறது.
- issue: ἐξουσιασθήσομαι என்பதிலுள்ள அதிகாரம்/கட்டுப்பாடு சார்ந்த சொல்லாட்டம்
  choice: என்னைத் தன் அதிகாரத்திற்குள் கொண்டுவர நான் விடமாட்டேன்
  alternative: நான் எதற்கும் அடிமையாக மாட்டேன்
  rationale: ‘அடிமை’ என்பது கருத்தைத் தெளிவாக்கினாலும், மூலத்தில் நேரடியாக இல்லாத அடிமைத்தனப் படிமத்தை வலுப்படுத்தக்கூடும். ‘அதிகாரத்திற்குள் கொண்டுவர’ என்பது ἐξουσιάζω என்பதன் அதிகாரம் செலுத்துதல் என்ற சொல்லியல் தொடர்பைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மேற்கோள் போன்ற மீள்வடிவம் காக்கப்பட்டுள்ளது. சட்ட மொழிச் சாயல் மிகாமல் ἔξεστιν என்பதற்கு ‘அனுமதி உண்டு’ என்றும், ἐξουσιασθήσομαι என்பதின் அதிகாரச் சாயலைக் காக்க ‘அதிகாரத்திற்குள் கொண்டுவர’ என்றும் வழங்கப்பட்டுள்ளது.
