  source_fidelity: முதல் கூற்று மூலத்தின் பரந்த Πάντα மற்றும் ἔξεστιν ஆகியவற்றை பெரும்பாலும் நன்றாகத் தருகிறது. இருப்பினும் ‘எல்லாவற்றையும் செய்ய’ என்பது மூலத்தில் இல்லாத செயல்-வினையைச் சேர்த்து, ‘எல்லாம்’ என்பதன் பரந்த தன்மையைச் சிறிது குறுக்குகிறது. இறுதி வாக்கியத்தில் ‘எதுவும் என்னைத் தன் அதிகாரத்திற்குள் கொண்டுவர நான் விடமாட்டேன்’ என்பது கருத்தில் சரியானதே; ஆனால் மூலத்தின் எதிர்காலச் செயப்பாட்டையும் ὑπό τινος-ன் ‘எதன் அதிகாரத்திற்கும் உட்படுதல்’ என்ற அமைப்பையும் நேரடியாகவும் இயல்பாகவும் தரலாம்.
