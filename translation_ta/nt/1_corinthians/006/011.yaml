source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: ta
  text: உங்களில் சிலர் முன்பு இப்படிப்பட்டவர்களாக இருந்தீர்கள். ஆனால் நீங்கள் கழுவப்பட்டீர்கள்[a]; ஆனால் புனிதமாக்கப்பட்டீர்கள்; ஆனால் ஆண்டவர் இயேசுவின் பெயரிலும் நம் கடவுளின் ஆவியிலும் நீதிமான்களாக்கப்பட்டீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீங்கள் உங்களைக் கழுவிக்கொண்டீர்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை நடுவினை வடிவில் உள்ளது; ஆனால் தொடர்ந்து வரும் செயப்பாட்டு வினைகளோடு சேர்த்து இதைக் கடவுளின் இரட்சிப்புச் செயலாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “இயேசுவின் பெயரால், நம் கடவுளின் ஆவியால்” என்றும் மொழிபெயர்க்கலாம். இவ்விரு சொற்றொடர்களிலும் கிரேக்கத்தில் ஒரே முன்னிடைச்சொல் பயன்படுத்தப்பட்டுள்ளது; அது இங்கு செயல் நிகழும் தளத்தையோ செயல்மூலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: உங்களில் சிலர் முன்பு இப்படிப்பட்டவர்களாகத்தான் இருந்தீர்கள்
  rationale: முந்தைய தீயொழுக்கப் பட்டியலைச் சுட்டும் ταῦτα என்பதன் வலிமையை இயல்பான தமிழில் ‘இப்படிப்பட்டவர்களாக’ எனக் காட்டுகிறது; ἦτε குறிக்கும் முந்தைய நிலையைத் தெளிவுபடுத்த ‘முன்பு’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀλλὰ (மும்முறை)
  choice: ஆனால் (மும்முறை)
  rationale: பவுல் வலியுறுத்தும் திடமான எதிர்மாற்றையும் மும்முறை வரும் சொல்லாட்சியின் ஓசையையும் காக்கிறது.
- source_word: ἀπελούσασθε
  choice: நீங்கள் கழுவப்பட்டீர்கள்
  rationale: வடிவம் நடுவினையாக இருந்தாலும், தொடர்ந்து வரும் இறைவினைப் பாங்கிலான வினைகளோடு சேர்ந்து இங்கு கழுவுதல் அவர்கள்மேல் நிகழ்ந்த மீட்புச் செயலாகப் புரிந்துகொள்ளப்படலாம். நடுவினை/தற்சுட்டுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἡγιάσθητε
  choice: புனிதமாக்கப்பட்டீர்கள்
  rationale: ἁγιάζω என்பதன் இறைவினைப் பாங்கையும் ‘புனிதமாக்குதல்’ என்ற இயல்பான, கண்ணியமான தமிழ் பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: ἐδικαιώθητε
  choice: நீதிமான்களாக்கப்பட்டீர்கள்
  rationale: δικαιόω என்பதன் பவுலிய நீதித்தீர்ப்பு/சரியான உறவு சார்ந்த பொருளைத் தக்கவைக்கும் மரபான தமிழ் வேதாகமச் சொல்லாக்கம்; ‘குற்றமற்றவர்கள் எனத் தீர்ப்பளிக்கப்பட்டீர்கள்’ என்பது சாத்தியமான விளக்க மொழிபெயர்ப்பு.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: நம் ஆண்டவராகிய இயேசுவின் பெயரில்
  rationale: ἐν என்பதிலுள்ள செயல்மூலம், அதிகாரம், தளம் ஆகிய நுட்பங்களைத் தீர்மானிக்காமல் ‘பெயரில்’ என்ற இயல்பான தமிழால் காக்கிறது.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: நம் கடவுளின் ஆவியில்
  rationale: மூலத்தின் இரண்டாவது ἐν-ஐ ‘ஆவியில்’ என நேரடியாக வழங்கி, செயல்மூலமா அல்லது செயல் நிகழும் தளமா என்ற உண்மையான நுட்பத் தெளிவின்மையைப் பாதுகாக்கிறது; ‘நம் கடவுளின் ஆவி’ இங்கு பரிசுத்த ஆவியைக் குறிக்கும் இயல்பான பவுலிய பயன்பாடு.
theological_decisions:
- issue: ἀπελούσασθε என்பதன் வினைக்குரலும் செயற்பாட்டாளரும்
  choice: ‘நீங்கள் கழுவப்பட்டீர்கள்’ என இறைவினைப் பொருளில் மொழிபெயர்த்தல்
  alternative: ‘நீங்கள் உங்களைக் கழுவிக்கொண்டீர்கள்’ என நடுவினை/தற்சுட்டுப் பொருளில் மொழிபெயர்த்தல்
  rationale: சுற்றியுள்ள ‘புனிதமாக்கப்பட்டீர்கள்’, ‘நீதிமான்களாக்கப்பட்டீர்கள்’ என்ற இறைவினை வடிவங்கள் கடவுளின் இரட்சிப்புச் செயல்களின் தொடரைச் சுட்டுவதால் இறைவினைப் பொருள் முதன்மைப்படுத்தப்படுகிறது; இருப்பினும் கிரேக்க நடுவினை வடிவத்தின் வாய்ப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: ἐν ... ἐν என்பவற்றின் உறவும் கருவிப்பொருளும்
  choice: ‘இயேசுவின் பெயரிலும் ... ஆவியிலும்’ என்று இரண்டிலும் ‘இல்’ உருபைப் பாதுகாத்தல்
  alternative: ‘இயேசுவின் பெயரால் ... ஆவியால்’ என்று செயல்மூலப் பொருளில் மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் இரு சொற்றொடர்களிலும் ἐν வருகிறது. தமிழ் ‘இல்’ உருபு செயலின் தளம்/இணைவு/செயல்மூலம் ஆகிய பொருட்களுக்கு இடமளித்து, மூலத்தின் இணை அமைப்பையும் நுட்பத் தெளிவின்மையையும் காக்கிறது.
- issue: πνεύματι என்பதன் குறிப்பு
  choice: நம் கடவுளின் ஆவி, அதாவது பரிசுத்த ஆவி எனப் புரிந்துகொள்ளும் மொழியாக்கம்
  alternative: பொதுவான ஆவிக்குரிய தளம்
  rationale: ‘நம் கடவுளின் ஆவி’ என்ற பவுலிய சொற்றொடர் இயல்பாகப் பரிசுத்த ஆவியைக் குறிக்கிறது; தமிழில் ‘ஆவி’ என வழங்குவது மூலத்துக்கு மேலாக பெயரடை ஒன்றைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘ஆனால்’ என்ற மும்முறை அமைப்பு மூலத்தின் வலியுறுத்தலைக் காக்கிறது. ‘புனிதமாக்கப்பட்டீர்கள்’, ‘நீதிமான்களாக்கப்பட்டீர்கள்’ ஆகியவை பவுலிய கருத்துச் சொற்களோடு தொடர்ச்சியைப் பேணுகின்றன; அரிதான சமயவழக்குச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
