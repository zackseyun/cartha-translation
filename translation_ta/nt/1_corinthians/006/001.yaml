source:
  edition: SBLGNT
  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: ta
  text: உங்களில் ஒருவன் மற்றொருவனுக்கு எதிராக ஒரு வழக்கு இருக்கும்போது, பரிசுத்தவான்களிடம் அல்லாமல் நீதியற்றவர்களிடம்[a] தீர்ப்புப் பெறச் செல்லத் துணிகிறானா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அநீதியுள்ளவர்களிடம்.” சில மொழிபெயர்ப்புகள் இதை விளக்கமாக “அவிசுவாசிகளிடம்” எனக் கூறுகின்றன; ஆனால் கிரேக்கத்தில் “நீதியற்றவர்கள்” என்றே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: செல்லத் துணிகிறானா?
  rationale: பவுலின் கண்டனத் தொனியுள்ள சொல்லாட்சிக் கேள்வியையும், τολμάω குறிக்கும் துணிகரமான செயற்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τις ὑμῶν
  choice: உங்களில் ஒருவன்
  rationale: τις என்னும் ஒருமையையும் ὑμῶν என்னும் பகுதிப் பொருளுடைய உருபையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: πρᾶγμα ἔχων
  choice: வழக்கு வைத்திருக்கும்போது
  rationale: சட்டச் சூழலில் πρᾶγμα என்பது நீதித்தீர்ப்புக்குரிய வழக்கு அல்லது விவகாரத்தைக் குறிக்கிறது; தமிழில் சட்டப் பொருளைத் தெளிவாகவும் மிகைப்படுத்தாமலும் தருகிறது.
- source_word: πρὸς τὸν ἕτερον
  choice: மற்றொருவனுக்கு எதிராக
  rationale: சட்டப் பிணக்கில் எதிர்தரப்பைக் குறிக்கும் πρός என்பதன் உறவு அல்லது எதிர்ப்பு நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: κρίνεσθαι
  choice: அதற்குத் தீர்ப்புப் பெற ... செல்ல
  rationale: செயப்பாட்டு வினையான κρίνεσθαι என்பதன் ‘தீர்ப்பளிக்கப்படுதல்’ என்ற நீதித்துறைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπὶ τῶν ἀδίκων
  choice: நீதியற்றவர்களிடம்
  rationale: ἀδίκων என்பதன் ஒழுக்க மற்றும் இறையியல் மதிப்பீட்டை ‘அவிசுவாசிகள்’ என்று விளக்கிப் பொருளாக்காமல் பாதுகாக்கிறது; நீதித்துறைச் சூழலிலுள்ள ἐπί தமிழில் ‘இடம்/முன்’ என்ற பொருளை இங்கு ‘-ிடம்’ என இயல்பாகக் கொள்கிறது.
- source_word: καὶ οὐχὶ
  choice: செல்லாமல்
  rationale: இரு குழுக்களுக்கிடையிலான கூர்மையான எதிர்மறை வேறுபாட்டை இயல்பான தமிழ் கேள்வி அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τῶν ἁγίων
  choice: பரிசுத்தவான்களிடம்
  rationale: ἅγιοι என்பதற்கான நிலைபெற்ற தமிழ் வேதாகமச் சொல்லைத் தக்கவைத்து, கடவுளுக்கெனப் பரிசுத்தமாக்கப்பட்ட மக்களைக் குறிக்கிறது.
theological_decisions:
- issue: ἀδίκων என்பதையும் ἁγίων என்பதையும் எதிரெதிராக மொழிபெயர்த்தல்
  choice: நீதியற்றவர்கள் ... பரிசுத்தவான்கள்
  alternative: அவிசுவாசிகள் ... விசுவாசிகள்
  rationale: கிரேக்கம் வெளிப்படையாக ஒழுக்க மற்றும் இறையியல் நிறமுள்ள சொற்களைப் பயன்படுத்துகிறது. அவற்றை ‘அவிசுவாசிகள்/விசுவாசிகள்’ என்று விளக்கமாக மாற்றாமல், பவுலின் சொல் தேர்வும் அதிலுள்ள இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
- issue: ἔχων என்னும் ஆண்பால் ஒருமை பிரதிநிதிப் பயன்பாடு
  choice: உங்களில் ஒருவன் ... வைத்திருக்கும்போது ... துணிகிறானா
  alternative: உங்களில் யாராவது ... வைத்திருக்கும்போது ... துணிகிறார்களா
  rationale: மூலத்தின் இலக்கண ஒருமையைத் தக்கவைக்கிறது; இங்கு ‘ஒருவன்’ பிரதிநிதியாகப் பொதுவாகப் பயன்படுத்தப்பட்டுள்ளது.
- issue: ஒரே கிரேக்கச் சொல்லாட்சிக் கேள்வியின் தமிழ் அமைப்பு
  choice: இரண்டு தொடர்புடைய கேள்விகளாக அமைத்தல்
  alternative: ஒரே நீண்ட கேள்வியாக அமைத்தல்
  rationale: மூலத்தின் ஒரே வினாவிலுள்ள எதிர்மறை மோதலை மாற்றாமல், சாதாரண நவீனத் தமிழில் தெளிவாகவும் வலிமையாகவும் வாசிக்க இரண்டு இணைந்த கேள்விகளாக அமைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘வழக்கு’, ‘தீர்ப்புப் பெற’ ஆகியவை நீதித்துறைச் சூழலைத் தெளிவாக்குகின்றன. ‘நீதியற்றவர்கள்’ மற்றும் ‘பரிசுத்தவான்கள்’ என்ற மூலத்தின் மதிப்பீட்டு மோதல் விளக்கிப் பொருளாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
