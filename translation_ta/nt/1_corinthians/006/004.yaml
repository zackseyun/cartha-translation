id: 1CO.6.4
reference: 1 Corinthians 6:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: ta
  text: ஆகவே, இந்த வாழ்க்கைக்குரிய வழக்குகள்[a] உங்களிடம் இருந்தால், சபையில் மதிப்பற்றவர்களாகக் கருதப்படுகிறவர்களை[b] நீதிபதிகளாக அமர்த்துகிறீர்களா?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அன்றாட வாழ்க்கைக்குரிய காரியங்கள்.” βιωτικὰ என்பது சாதாரண உலக வாழ்க்கை அல்லது குடிமை சார்ந்த விவகாரங்களைக் குறிக்கிறது; முழுத் தொடரை “இந்த வாழ்க்கைக்குரிய நீதிமன்றங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சபையில் இகழப்படுகிறவர்களை.” இச்சொற்றொடர் சபைக்குள் முக்கியமற்றவர்களாகக் கருதப்படுபவர்களையோ, சபையின் பார்வையில் எந்த மதிப்பும் இல்லாதவர்களையோ ஏளனமாகக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: 'சிலர் இவ்வாக்கியத்தை ஏளனமான கட்டளையாகப் புரிந்துகொள்கிறார்கள்: “சபையில் மதிப்பற்றவர்களாகக் கருதப்படுகிறவர்களையே நீதிபதிகளாக அமர்த்துங்கள்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: இந்த வாழ்க்கைக்குரிய
  rationale: சாதாரண உலக வாழ்க்கை, அன்றாட வாழ்வு, குடிமை சார்ந்த காரியங்கள் ஆகியவற்றைக் குறிக்கிறது. அறநெறி ரீதியான எதிர்மறைப் பொருள் தோன்றக்கூடிய ‘உலகப்பிரகாரமான’ என்பதைக் தவிர்க்கிறது.
- source_word: κριτήρια
  choice: வழக்குகள்
  rationale: இச்சொல் நீதிமன்றங்களையோ தீர்ப்புக்குரிய வழக்குகளையோ குறிக்கலாம். 6:1–6 சூழலில் விசுவாசிகளுக்கிடையிலான தகராறுகளைத் தீர்ப்பதற்குக் கொண்டுவரப்படும் வழக்குகள் என்பது இயல்பான தமிழ் வாசகத்தைத் தருகிறது; நிறுவனப் பொருளான ‘நீதிமன்றங்கள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐὰν ἔχητε
  choice: உங்களிடம் இருந்தால்
  rationale: கிரேக்கத்தின் நிபந்தனைக் கட்டமைப்பை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: τοὺς ἐξουθενημένους
  choice: மதிப்பற்றவர்களாகக் கருதப்படுகிறவர்களை
  rationale: ஒன்றுமில்லாதவர்களென எண்ணப்படுதல் அல்லது இகழப்படுதல் என்ற பொருளைத் தருகிறது. அவர்கள் சபைக்குள் அற்பமாகக் கருதப்படுபவர்களா அல்லது சபையின் பார்வையில் மதிப்பில்லாத வெளியாரா என்பதை முதன்மை உரை முடிவுசெய்யாமல் விடுகிறது.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: சபையில்
  rationale: சபைச் சமூகத்துக்குள் அல்லது சபையின் மதிப்பீட்டில் என்ற இரு தொடர்புகளையும் சுருக்கமாகத் திறந்துவைக்கிறது.
- source_word: τούτους καθίζετε
  choice: நீதிபதிகளாக அமர்த்துகிறீர்களா?
  rationale: καθίζω என்பதன் அடிப்படைப் பொருள் ‘அமரச் செய்தல்’; நீதித்துறைச் சூழலில் தீர்ப்பளிக்க அமர்த்துதல் என்று பொருள்படும். SBLGNT கேள்விக்குறியையும் பவுலின் கண்டனத் தொனியையும் இவ்வடிவம் காக்கிறது.
theological_decisions:
- issue: பவுலின் வாக்கியம் கேள்வியா அல்லது ஏளனக் கட்டளையா; ‘மதிப்பற்றவர்கள்’ யார்?
  choice: ‘நீதிபதிகளாக அமர்த்துகிறீர்களா?’ என்ற கண்டனக் கேள்வியாக மொழிபெயர்த்து, ‘சபையில் மதிப்பற்றவர்களாகக் கருதப்படுகிறவர்கள்’ என்பவர்களின் அடையாளத்தைத் திறந்துவைத்தல்
  alternative: ‘சபையில் மதிப்பற்றவர்களாகக் கருதப்படுகிறவர்களையே நீதிபதிகளாக அமர்த்துங்கள்’ என்ற ஏளனக் கட்டளையாக வாசித்தல்; அல்லது இச்சொற்றொடரைச் சபைக்கு வெளியேயுள்ள உலகியலான நீதிபதிகளை மட்டும் குறிக்கும் எனத் தெளிவுபடுத்துதல்
  rationale: கிரேக்கத் தொடரமைப்பு கடினமானது; இரு வாசிப்புகளும் பழமையானவை. SBLGNT-இன் நிறுத்தற்குறியும் 6:1–6 இன் கண்டனச் சூழலும் கேள்வி வாசிப்பை ஆதரிக்கின்றன. ஆனால் அடிக்குறிப்புகள் மாற்று வாசிப்பையும் நபர்களின் அடையாளம் குறித்த உண்மையான தெளிவின்மையையும் பாதுகாக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘சபை’, ‘நீதிபதி’, ‘வழக்கு’ போன்ற பரவலாக அறியப்பட்ட சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் சொல்லாட்சிச் சிக்கலும் ஏளனத் தொனியும் அடிக்குறிப்புகளோடு பாதுகாக்கப்பட்டுள்ளன.
