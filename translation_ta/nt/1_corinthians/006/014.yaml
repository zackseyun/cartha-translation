reference: 1 Corinthians 6:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: ta
  text: கடவுள் ஆண்டவரை உயிர்த்தெழச் செய்தார்; தமது வல்லமையால் நம்மையும் உயிர்த்தெழச் செய்வார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ;
  rationale: இங்கு δέ வலுவான எதிர்மறையைச் சுட்டாமல் பவுலின் வாதத்தை மென்மையாகத் தொடர்கிறது. தமிழில் தனிச்சொல் சேர்ப்பதைவிட அரைப்புள்ளி இயல்பாக அந்தத் தொடர்ச்சியைக் காட்டுகிறது.
- source_word: θεὸς
  choice: கடவுள்
  rationale: θεός என்பதற்கான இயல்பான நவீனத் தமிழ் இணை; உயிர்த்தெழச் செய்பவர் கடவுள் என்பதைத் தெளிவாக வைத்திருக்கிறது.
- source_word: τὸν κύριον
  choice: ஆண்டவரை
  rationale: இச்சூழலில் κύριος இயேசுவைக் குறிக்கும் கிறிஸ்துவியல் பட்டம்; தமிழில் நிலைபெற்ற மரியாதைமிக்க வடிவம் 'ஆண்டவர்'.
- source_word: ἤγειρεν
  choice: உயிர்த்தெழச் செய்தார்
  rationale: ἐγείρω இங்கு இறந்தோரிலிருந்து இயேசுவை எழுப்பிய கடவுளின் கடந்தகாலச் செயலைக் குறிக்கிறது. தமிழ் சொற்றொடர் உயிர்த்தெழுதல் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡμᾶς
  choice: நம்மையும்
  rationale: முதல் நபர் பன்மையின் உள்ளடக்கமான பொருளைத் தருகிறது; καί குறிக்கும் இணைப்பையும் '-உம்' இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξεγερεῖ
  choice: உயிர்த்தெழச் செய்வார்
  rationale: எதிர்கால வினையைத் தெளிவாகக் காட்டி, ஆண்டவரின் உயிர்த்தெழுதலுக்கும் நமது எதிர்கால உயிர்த்தெழுதலுக்கும் உள்ள இணையைப் பாதுகாக்கிறது.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: தமது வல்லமையால்
  rationale: διά + உரிய வேற்றுமை இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது. 'வல்லமையால்' என்பது கடவுளின் வல்லமையே உயிர்த்தெழுதலின் செயலாக்கும் வழி என்பதை இயல்பாகத் தெரிவிக்கிறது; 'தமது' என்பது எழுவாயான கடவுளையே திரும்பச் சுட்டுகிறது.
theological_decisions:
- issue: எதிர்கால வாக்கியத்தில் குறிப்பிடப்படும் உயிர்த்தெழுதல்
  choice: விசுவாசிகளின் எதிர்கால உடல் உயிர்த்தெழுதல்
  alternative: பொதுவான தெய்வீக நியாயநிறைவேற்றம் அல்லது உருவகமான ஆவிக்குரிய எழுப்புதல்
  rationale: உடலைப் பற்றிய உடனடிச் சூழலும் (1 கொரி 6:13–20), 'ஆண்டவரை உயிர்த்தெழச் செய்தார்' என்பதுடனான நேரான இணையும், உருவகப் பொருளைவிட உண்மையான எதிர்கால உயிர்த்தெழுதலை வலுவாக ஆதரிக்கின்றன. இருப்பினும் மொழிபெயர்ப்பு விளக்கச் சொற்களைச் சேர்க்காமல் மூலத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ஒரே வாக்கியத்தில் கடந்தகாலமும் எதிர்காலமும் இணையாகத் தெளிவாக நிற்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
