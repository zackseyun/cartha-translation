source:
  edition: SBLGNT
  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: ta
  text: ஏனெனில் மோசேயின் சட்டத்தில், “போரடிக்கும் மாட்டின் வாயைக் கட்டாதே”[a] என்று எழுதப்பட்டுள்ளது. மாடுகளைப் பற்றிக் கடவுளுக்கு அக்கறையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தானியத்தை மிதித்துப் போரடிக்கும் மாட்டின் வாயைக் கட்டாதே.”
    reason: ἀλοῶντα என்பதன் செய்முறையை ‘தானியத்தை மிதித்துப் போரடித்தல்’ என வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: ஏனெனில், மோசேயின் திருச்சட்டத்தில்
  rationale: ἐν என்ற முன்னிடைச்சொல்லின் பொருளையும் மோசேக்கும் திருச்சட்டத்துக்கும் இடையிலான உடைமைத் தொடர்பையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. γάρ என்பதற்கு ‘ஏனெனில்’ பயன்படுத்தப்பட்டு முந்தைய வாதத்துடனான காரணத் தொடர்பு காக்கப்படுகிறது.
- source_word: γέγραπται
  choice: என்று எழுதப்பட்டுள்ளது
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் நிறைவுற்ற செயப்பாட்டு வடிவத்தின் தொடரும் அதிகாரத் தன்மையைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: Οὐ κημώσεις
  choice: வாயைக் கட்டாதே
  rationale: சட்ட மேற்கோளிலுள்ள தடைப் பொருளை நேரடியான தமிழ் கட்டளை வடிவில் தருகிறது. மாட்டைப் போரடிக்க விடாமல் அதன் வாயை மூடும் செயலை ‘வாயைக் கட்டுதல்’ தெளிவாகக் குறிக்கிறது.
- source_word: βοῦν
  choice: மாட்டின்
  rationale: இச்சூழலில் உழைப்புக்குப் பயன்படுத்தப்படும் bovine விலங்கைக் குறிக்கும் பொதுவான, எளிதில் புரியும் தமிழ்ச் சொல். மேற்கோளின் வாக்கிய அமைப்புக்கேற்ப வேற்றுமை உருபுடன் தரப்பட்டுள்ளது.
- source_word: ἀλοῶντα
  choice: போரடிக்கும்போது
  rationale: நடந்துகொண்டிருக்கும் தானியப் பிரிப்பு வேலையைச் சுருக்கமாகவும் தமிழில் வழக்கமான வேளாண்மைச் சொல்லாலும் வெளிப்படுத்துகிறது. செய்முறையை விளக்கும் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: மாடுகளைப் பற்றிக் கடவுளுக்கு அக்கறையா?
  rationale: μή குறிக்கும் எதிர்மறைப் பதிலை எதிர்நோக்கும் வினாவை விளக்கவுரை சேர்க்காமல் இயல்பான தமிழ் வினாவாகக் காக்கிறது. ‘மட்டும்’ அல்லது ‘தான்’ போன்ற கிரேக்கத்தில் வெளிப்படையாக இல்லாத வரையறைச் சொற்கள் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: விலங்குகளைப் பற்றிய கடவுளின் அக்கறை குறித்த பவுலின் வினா
  choice: மாடுகளைப் பற்றிக் கடவுளுக்கு அக்கறையா?
  alternative: மாடுகளைப் பற்றித்தான் கடவுளுக்கு அக்கறையா?
  rationale: கிரேக்க மூலத்தின் சொல்லாட்சிப்படி வினா நேரடியாக வைக்கப்படுகிறது. ‘தான்’ என்பது ‘மாடுகளைப் பற்றி மட்டுமா?’ என்ற ஒப்பீட்டுப் பொருளைத் தெளிவுபடுத்தினாலும், அது மூலத்தில் வெளிப்படையாக இல்லை. இம்மொழிபெயர்ப்பு பவுலின் வாத வலிமையைக் காத்தபடியே, விலங்குகள் மீது கடவுளுக்கு அறவே அக்கறை இல்லை என்று தீர்மானித்துச் சொல்லாமல் உள்ள இறையியல் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சட்டம்’, ‘போரடித்தல்’ போன்ற வேதாகம மற்றும் வேளாண்மைச் சூழலுக்கேற்ற சொற்கள் பயன்படுத்தப்பட்டுள்ளன; வினாவின் மறைமுக வாதத் தன்மை விளக்கிப் பெரிதாக்கப்படவில்லை.
