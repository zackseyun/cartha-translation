id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: ta
  text: மற்றவர்கள் உங்கள்மீது உள்ள இந்த உரிமையில் பங்குபெறுகிறார்கள் என்றால்,[a] நமக்கு இன்னும் அதிக உரிமை இல்லையா? ஆனாலும், இந்த உரிமையை நாங்கள் பயன்படுத்திக்கொள்ளவில்லை. மாறாக, மேசியாவின்[b] நற்செய்திக்கு எந்தத் தடையும் ஏற்படுத்தாதபடி எல்லாவற்றையும் தாங்கிக்கொள்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தை ‘உங்கள் தொடர்பிலான இந்த உரிமை’ அல்லது ‘உங்களிடமிருந்து பெறுவதற்கான இந்த உரிமை’ என்றும் மொழிபெயர்க்கலாம். சூழலில், கொரிந்தியர்களிடமிருந்து பொருளாதார ஆதரவு பெறும் அப்போஸ்தலர்களின் உரிமை குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘கிறிஸ்துவின் நற்செய்தி.’ இங்கு Χριστός ஒரு பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: உரிமை
  rationale: இங்கு ἐξουσία என்பது அதிகாரம் செலுத்துவதைக் காட்டிலும், அப்போஸ்தலர்கள் பொருளாதார ஆதரவைப் பெறுவதற்கான நியாயமான உரிமையைக் குறிக்கிறது. நவீன தமிழில் ‘உரிமை’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: உங்களிடமிருந்து ஆதரவு பெறும் இந்த உரிமை
  rationale: ὑμῶν என்ற சொல்லின் தொடர்பு கிரேக்கத்தில் சுருக்கமாகவும் ஓரளவு தெளிவற்றதாகவும் உள்ளது. சூழலில் அது கொரிந்தியர்களிடமிருந்து ஆதரவு பெறும் உரிமையைச் சுட்டுகிறது; இதைத் தமிழில் புரியும்படி முதன்மை உரையில் வெளிப்படுத்தி, சொற்றொடரின் மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: μετέχουσιν
  choice: பங்குபெறுகிறார்கள்
  rationale: ஒரு உரிமையில் மற்றவர்களுக்கும் பங்கு இருப்பதை இந்தச் சொல் தெரிவிக்கிறது; ‘பங்குபெறுகிறார்கள்’ அதன் பங்கேற்புப் பொருளைப் பாதுகாக்கிறது.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: எங்களுக்கு இன்னும் அதிக உரிமை இல்லையா?
  rationale: பவுலின் வலியுறுத்தலுள்ள சொல்லாட்சிக் கேள்வியையும் μᾶλλον என்பதன் ஒப்பீட்டு வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐχρησάμεθα
  choice: பயன்படுத்திக்கொள்ளவில்லை
  rationale: தமக்குள்ள உரிமையைச் செயல்படுத்திக்கொள்ளாமல் விட்டதை χράομαι இங்கு குறிக்கிறது.
- source_word: πάντα στέγομεν
  choice: எல்லாவற்றையும் தாங்கிக்கொள்கிறோம்
  rationale: στέγω இங்கு ‘மூடுதல்’ என்பதைக் காட்டிலும் சிரமங்களையும் இழப்புகளையும் பொறுத்துத் தாங்குதல் என்ற சூழல்சார் பொருளைக் கொண்டுள்ளது.
- source_word: τινα ἐγκοπὴν δῶμεν
  choice: எந்தத் தடையும் ஏற்படுத்தாதபடி
  rationale: சொல்லுக்குச் சொல் ‘எந்தத் தடையையும் கொடுக்காதபடி’ என்பது தமிழில் இயல்பாக இல்லை. நோக்கத்தைக் குறிக்கும் ἵνα μή அமைப்பையும் ἐγκοπή என்பதன் தடையுணர்வையும் இந்த மொழியாக்கம் தெளிவாகக் காட்டுகிறது.
- source_word: εὐαγγελίῳ
  choice: நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் அடிப்படைப் பொருளையும் பவுலின் அறிவிப்புச் சூழலையும் தெளிவாகக் காட்டும், தமிழில் நிலைபெற்ற சொல்.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: இங்கு Χριστός பட்டமாகச் செயல்பட்டு, நற்செய்தி யாருக்குரியது அல்லது யாரைப் பற்றியது என்பதைச் சுட்டுகிறது; ‘மேசியா’ அதன் பட்டப் பொருளை வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: τῆς ὑμῶν ἐξουσίας என்பதன் தொடர்பு
  choice: உங்களிடமிருந்து ஆதரவு பெறும் உரிமை
  alternative: உங்கள் தொடர்பிலான உரிமை / உங்கள்மீது உள்ள உரிமை
  rationale: உடனடியான சூழல் அப்போஸ்தல ஊழியர்கள் உணவு உள்ளிட்ட பொருளாதார ஆதரவைப் பெறும் உரிமையைப் பற்றியது. இருப்பினும், கிரேக்கச் சொற்றொடரின் இலக்கணத் தொடர்பு சுருக்கமாக இருப்பதால் மாற்று வடிவங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- issue: Χριστοῦ என்பதன் மொழியாக்கம்
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இந்த இடத்தில் Χριστός பெயரைப் போல மட்டுமல்லாமல் பட்டமாகவும் ஒலிக்கிறது. ஆகவே மெசியானியப் பொருளை மறைக்காமல் ‘மேசியா’ பயன்படுத்தப்படுகிறது; தமிழ் மரபு வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: நற்செய்தியுடன் உள்ள உருபுத் தொடர்பு
  choice: மேசியாவின் நற்செய்தி
  alternative: மேசியாவைப் பற்றிய நற்செய்தி
  rationale: τοῦ Χριστοῦ என்பது நற்செய்தி மேசியாவுக்குரியது என்பதையும் அவரைப் பற்றியது என்பதையும் உள்ளடக்கக்கூடும். ‘மேசியாவின் நற்செய்தி’ அந்தத் தொடர்பைத் திட்டவட்டமாக ஒரே வகையில் முடிவுசெய்யாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உரிமை’, ‘ஆதரவு’, ‘தடை’, ‘தாங்கிக்கொள்கிறோம்’ போன்ற சொற்கள் இயல்பான நடையைத் தருகின்றன; மூலத்தின் சொல்லாட்சிக் கேள்வியும் இறையியல் சார்ந்த தொடர்புத் தெளிவின்மையும் தேவையான இடங்களில் பாதுகாக்கப்பட்டுள்ளன.
