  naturalness: ‘உங்கள்மீது உள்ள இந்த உரிமையில் பங்குபெறுகிறார்கள்’ மற்றும் ‘நமக்கு இன்னும் அதிக உரிமை இல்லையா?’ என்பது நவீன தரத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘எந்தத் தடையும் ஏற்படுத்தாதபடி எல்லாவற்றையும் தாங்கிக்கொள்கிறோம்’ என்பது நோக்க அமைப்பையும் தொடர்ச்சியான பொறுமையையும் நன்றாக வெளிப்படுத்துகிறது.
  terminology: ἐξουσίαக்கு ‘உரிமை’, εὐαγγέλιονக்கு ‘நற்செய்தி’, மற்றும் பட்டப் பொருளில் Χριστόςக்கு ‘மேசியா’ ஆகியவை பொருத்தமானவை. ‘மேசியாவின் நற்செய்தி’ என்ற உடைமைத் தொடர், மேசியாவுக்குரிய/மேசியாவைப் பற்றிய என்ற மூலத்தின் திறந்த தொடர்பைத் தேவையின்றி வரையறுக்கவில்லை.
