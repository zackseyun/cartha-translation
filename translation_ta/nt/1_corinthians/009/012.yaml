  revised_text: மற்றவர்கள் உங்கள்மீது உள்ள இந்த உரிமையில் பங்குபெறுகிறார்கள் என்றால்,[a] நமக்கு இன்னும் அதிக உரிமை இல்லையா? ஆனாலும், இந்த உரிமையை நாங்கள் பயன்படுத்திக்கொள்ளவில்லை. மாறாக, மேசியாவின்[b] நற்செய்திக்கு எந்தத் தடையும் ஏற்படுத்தாதபடி எல்லாவற்றையும் தாங்கிக்கொள்கிறோம்.
