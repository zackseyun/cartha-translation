  source_fidelity: மிகச் சரி. μὴ οὐκ அறிமுகப்படுத்தும் உடன்பாட்டு விடையை எதிர்பார்க்கும் வினா, ἔχομεν ἐξουσίαν என்பதன் ‘எங்களுக்கு உரிமை’ அமைப்பு, மற்றும் φαγεῖν καὶ πεῖν என்பதன் ‘சாப்பிடவும் குடிக்கவும்’ ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக இல்லாத பொருளாதார ஆதரவு முதன்மை உரையில் சேர்க்கப்படவில்லை.
  naturalness: ‘சாப்பிடவும் குடிக்கவும் எங்களுக்கு உரிமை இல்லையா?’ என்பது நவீன நிலையான தமிழில் இயல்பானதும் தெளிவானதுமான வினாவாக உள்ளது. பேச்சுவழக்காக மிகத் தாழாமல், பொதுவாசகர்களுக்கும் அணுகத்தக்க பதிவைத் தக்கவைக்கிறது.
  terminology: ἐξουσίαν என்பதற்கு ‘உரிமை’ சூழலுக்கேற்ற முதன்மைத் தெரிவாகும். மாற்றாக ‘அதிகாரம்’ என்பதை அடிக்குறிப்பு முறையாகப் பாதுகாக்கிறது; அது முதன்மைத் தெரிவின் சூழல்சார் ‘நியாயமான உரிமை’ பொருளை மாற்றவில்லை.
