source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν φαγεῖν καὶ ⸀πεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/004.yaml
  text: Do we not have the right to eat and drink?[a]
translation:
  language: ta
  text: சாப்பிடவும் குடிக்கவும் எங்களுக்கு உரிமை இல்லையா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாப்பிடவும் குடிக்கவும் எங்களுக்கு அதிகாரம் இல்லையா?” இங்கு “உரிமை” என்பது நியாயமான உரிமைகோரல் அல்லது சுதந்திரத்தைக் குறிக்கிறது; பவுலின் வாதச் சூழலில், இது பெரும்பாலும் ஊழியத்திற்கான பொருளாதார ஆதரவைப் பெறுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ
  choice: இல்லையா?
  rationale: இந்த இரட்டை எதிர்மறை அமைப்பு ‘எங்களுக்கு நிச்சயமாக உரிமை உண்டு’ என்ற உடன்பாட்டு விடையை எதிர்பார்க்கும் வினாவை உருவாக்குகிறது. தமிழில் ‘இல்லையா?’ என்பது அதன் வினா வடிவத்தையும் வலியுறுத்தலையும் இயல்பாகக் காக்கிறது.
- source_word: ἔχομεν
  choice: எங்களுக்கு ... உரிமை
  rationale: கிரேக்கத்தின் ‘நாம் கொண்டிருக்கிறோம்’ என்ற கருத்தைத் தமிழில் இயல்பாக ‘எங்களுக்கு ... உரிமை’ என்ற உடைமை அமைப்பில் வழங்குகிறது.
- source_word: ἐξουσίαν
  choice: உரிமை
  rationale: இங்கு ஆட்சி அதிகாரமோ வெறும் வல்லமையோ அல்ல, அப்போஸ்தல ஊழியத்துடன் தொடர்புடைய நியாயமான உரிமை அல்லது அங்கீகரிக்கப்பட்ட சுதந்திரமே குறிக்கப்படுகிறது.
- source_word: φαγεῖν
  choice: சாப்பிடவும்
  rationale: உண்ணும் செயலைக் குறிக்கும் வினையெச்ச வடிவமாக, பொதுவான நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: καὶ πεῖν
  choice: குடிக்கவும்
  rationale: இணைக்கப்பட்ட இரு செயல்களையும் தமிழில் சமச்சீராக ‘சாப்பிடவும் குடிக்கவும்’ என்று வழங்குகிறது.
theological_decisions:
- issue: அப்போஸ்தலரின் உரிமையின் எல்லை
  choice: பவுலும் அவரைப் போன்ற ஊழியர்களும் சாப்பிடவும் குடிக்கவும் உரிமையுடையவர்கள் என்ற பொதுவான மொழியை முதன்மை உரையில் காத்தல்
  alternative: அவர்கள் சேவை செய்கிறவர்களிடமிருந்து உணவு, பானம் உள்ளிட்ட பொருளாதார ஆதரவைப் பெறும் உரிமை என்று முதன்மை உரையிலேயே வெளிப்படையாகக் கூறுதல்
  rationale: 1 கொரிந்தியர் 9-ன் சூழல் ஊழியத்திற்கான பொருளாதார ஆதரவை வலுவாகச் சுட்டினாலும், இவ்வசனத்தின் கிரேக்க உரை ‘ஆதரவைப் பெறுதல்’ என்று நேரடியாகச் சொல்லவில்லை. ஆகவே முதன்மை உரையில் உள்ள சுருக்கத்தையும் சிறு தெளிவின்மையையும் காத்து, சூழல்சார் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் ‘சாப்பிடவும் குடிக்கவும்’ பயன்படுத்தப்பட்டுள்ளது. ‘உரிமை’ என்பது கண்ணியமானதும் இயல்பானதும் ஆகும்; ‘அதிகாரம்’ என்ற நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
