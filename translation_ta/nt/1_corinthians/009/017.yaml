revisions:
- from: ஏனெனில், நான் இதை மனமுவந்து செய்தால், எனக்கு வெகுமதி உண்டு; மனமில்லாமல் செய்தாலோ, ஒரு பொறுப்பு என்னிடம் ஒப்படைக்கப்பட்டுள்ளது.[a]
  to: ஏனெனில், நான் இதை விருப்பத்தோடு செய்தால் எனக்கு வெகுமதி உண்டு; விருப்பமின்றிச் செய்தால், ஒரு நிர்வாகப் பொறுப்பு எனக்கு நம்பி ஒப்படைக்கப்பட்டுள்ளது.[a]
  rationale: The revision preserves the Greek contrast between willing and unwilling action more precisely and restores the entrusted-administrative sense of οἰκονομία while retaining a natural modern Tamil register. It does not resolve the theological contrast between reward and entrusted duty.
  reviewer_model: gpt-5.6-terra
