id: 1CO.9.17
reference: 1 Corinthians 9:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: ta
  text: ஏனெனில், நான் இதை விருப்பத்தோடு செய்தால் எனக்கு வெகுமதி உண்டு; விருப்பமின்றிச் செய்தால், ஒரு நிர்வாகப் பொறுப்பு எனக்கு நம்பி ஒப்படைக்கப்பட்டுள்ளது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு பொறுப்பாண்மை எனக்கு நம்பி ஒப்படைக்கப்பட்டுள்ளது.”
    reason: οἰκονομίαν என்பதன் ‘பொறுப்பாண்மை’ அல்லது ஒப்படைக்கப்பட்ட நிர்வாகம் என்ற உருவகப் பொருளை வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἑκὼν
  choice: மனமுவந்து
  rationale: தன் விருப்பத்துடன், விரும்பிச் செயல்படுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; ἄκων என்பதுடனான நேரெதிர் வேறுபாட்டையும் காக்கிறது.
- source_word: τοῦτο πράσσω
  choice: நான் இதை ... செய்தால்
  rationale: சூழலில் பேசப்படும் நற்செய்திப் பணியை மிகையாக விளக்காமல், கிரேக்கத்தின் பொதுவான செயற்பாட்டு மொழியைப் பேணுகிறது.
- source_word: μισθὸν
  choice: வெகுமதி
  rationale: ஊதியம் அல்லது பிரதிபலன் என்ற பொருள் வரம்பைக் கொண்ட சொல்லை, இச்சூழலில் வெறும் சம்பளமாகக் குறுக்காமல் தெரிவிக்கிறது.
- source_word: ἄκων
  choice: மனமில்லாமல்
  rationale: விருப்பமின்றிச் செய்தல் என்ற பொருளை உணர்ச்சிசார் தயக்கம் போன்ற கூடுதல் நுணுக்கம் சேர்க்காமல் தருகிறது; ἑκὼν என்பதற்கு நேரெதிராக அமைகிறது.
- source_word: οἰκονομίαν
  choice: ஒரு பொறுப்பு
  rationale: ஒப்படைக்கப்பட்ட நிர்வாகப் பொறுப்பு என்ற கருத்தை நவீன வாசகருக்குத் தெளிவாகத் தருகிறது. 'பொறுப்பாண்மை' போன்ற செயற்கையான சொல்லைவிட இயல்பானது; இல்ல நிர்வாக உருவகம் தமிழில் நேரடியாகத் தெளிவாகாததால் அடிப்படைப் பொருள் முன்னிறுத்தப்படுகிறது.
- source_word: πεπίστευμαι
  choice: என்னிடம் ஒப்படைக்கப்பட்டுள்ளது
  rationale: நிறைவேற்றப்பட்ட ஒப்படைப்பும் அதன் தொடரும் நிலையும் கொண்ட perfect passive பொருளைப் பேணுகிறது.
theological_decisions:
- issue: இரண்டாம் கூறில் பவுலின் ஊழியத்தின் இயல்பு
  choice: அவர் மனமில்லாமல் செய்தாலும், ஒப்படைக்கப்பட்ட பொறுப்பின்கீழ் இருப்பதாகக் கூறுகிறார்.
  alternative: மனமில்லாமல் செய்தால் அவருக்கு வெகுமதி இல்லாமல் கடமை மட்டுமே உள்ளது; அல்லது இது கட்டாயமான பதவியைக் குறிக்கிறது.
  rationale: μισθὸν ἔχω என்பதற்கும் οἰκονομίαν πεπίστευμαι என்பதற்கும் இடையிலுள்ள வேறுபாட்டைத் தீர்த்துவிடாமல் காக்கிறது. விருப்பமுள்ள சேவைக்கும் ஒப்படைக்கப்பட்ட கட்டாயப் பொறுப்புக்கும் இடையிலான இறையியல் பதற்றம் அப்படியே விடப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. 'மனமுவந்து/மனமில்லாமல்' என்ற இணை ἑκὼν/ἄκων எதிர்மறையை இயல்பாகக் காக்கிறது; வாக்கியத்தின் இறையியல் பதற்றம் விளக்கிச் சீராக்கப்படவில்லை.
