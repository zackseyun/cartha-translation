id: 1CO.9.24
reference: 1 Corinthians 9:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: ta
  text: ஓட்டப்பந்தய அரங்கில்[a] ஓடுகிறவர்கள் எல்லாரும் ஓடுகிறார்கள்; ஆனால் ஒருவரே பரிசைப் பெறுகிறார் என்பது உங்களுக்குத் தெரியாதா? அதை நீங்கள் பெற்றுக்கொள்ளும்படி[b] அவ்வாறே ஓடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஓட்டப்பந்தயத் திடலில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல்லான στάδιον, ஓட்டம் நடைபெறும் அரங்கையோ தடத்தையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அதை வெல்லும்படி’ அல்லது ‘அதைக் கைப்பற்றும்படி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல்லான καταλάβητε என்பதற்கு ‘பெற்றுக்கொள்,’ ‘கைப்பற்று,’ அல்லது ‘அடை’ என்று பொருள் வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாதா?
  rationale: பவுல் பயன்படுத்தும் வலியுறுத்தும் வினா வடிவத்தையும் οἶδα என்பதன் அடிப்படைப் பொருளான ‘அறிதல்/தெரிதல்’ என்பதையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἐν σταδίῳ
  choice: ஓட்டப்பந்தய அரங்கில்
  rationale: στάδιον என்பது ஓட்டம் நடைபெறும் இடத்தைக் குறிக்கிறது. பொதுவாக ‘பந்தயத்தில்’ என்று மாற்றாமல், கண்முன் நிற்கும் தடகளக் காட்சியைத் தக்கவைக்கிறது.
- source_word: τρέχοντες ... τρέχουσιν
  choice: ஓடுகிறவர்கள் ... ஓடுகிறார்கள்
  rationale: τρέχω என்பதன் மீளுரைப்பைத் தக்கவைத்து, பவுலின் உயிரோட்டமான ஓட்ட உருவகத்தை வெளிப்படுத்துகிறது.
- source_word: πάντες μὲν ... εἷς δὲ
  choice: எல்லாரும் ... ஆனால் ஒருவரே
  rationale: μέν...δέ காட்டும் முரண்பாட்டைத் தெளிவான, இயல்பான தமிழில் அளிக்கிறது; εἷς என்பதன் ஒருமையை ‘ஒருவரே’ வலியுறுத்துகிறது.
- source_word: λαμβάνει
  choice: பெறுகிறார்
  rationale: வெல்லுதல் என்ற விளக்கப் பொருளைச் சேர்க்காமல், λαμβάνω என்பதன் நேரடியான பொருளை வழங்குகிறது.
- source_word: τὸ βραβεῖον
  choice: பரிசை
  rationale: விளையாட்டுப் போட்டியில் வெற்றியாளருக்குக் கிடைக்கும் பரிசைக் குறிக்கும் சுருக்கமான, பொதுவாகப் புரியும் சொல்.
- source_word: οὕτως
  choice: அவ்வாறே
  rationale: முன்னுள்ள ஓட்டப்பந்தயக் காட்சியைச் சுட்டி, அதற்கு ஒத்த குறிக்கோளோடு ஓடுமாறு கூறும் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τρέχετε
  choice: ஓடுங்கள்
  rationale: நிகழ்காலக் கட்டளையின் தொடர்ச்சியான செயல் நிழலைச் சூழல் உணர்த்துகிறது; ‘ஓடிக்கொண்டிருங்கள்’ என்ற கனமான வடிவத்தைவிட இது வலிமையும் இயல்பும் கொண்டது.
- source_word: ἵνα καταλάβητε
  choice: அதை நீங்கள் பெற்றுக்கொள்ளும்படி
  rationale: καταλαμβάνω என்பதற்கு ‘பெற்றுக்கொள்,’ ‘கைப்பற்று,’ ‘அடை’ ஆகிய பொருள்கள் உண்டு. இங்கு ‘அதை’ என்பது முன் குறிப்பிடப்பட்ட பரிசை இயல்பாகச் சுட்டுகிறது; ‘வெல்ல’ என்று மட்டும் தீர்மானிக்காமல் கிரேக்கச் சொல்லின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கிறிஸ்தவ விடாமுயற்சிக்குப் பயன்படுத்தப்படும் ஓட்டப்பந்தய உருவகம்
  choice: இரட்சிப்பு, தகுதி அல்லது வெகுமதி பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டைச் சேர்க்காமல், பரிசைப் பெறும் நோக்குடன் ஓடவேண்டும் என்ற போட்டி உருவகத்தையும் அறிவுறுத்தலையும் பாதுகாத்தல்.
  alternative: ‘வெற்றி பெறுவதற்காக ஓடுங்கள்’ என்று அதிக விளக்கத்துடன் மொழிபெயர்த்தல்.
  rationale: வசனம் ஒழுக்கமும் குறிக்கோளும் நிறைந்த முயற்சியை வலியுறுத்துகிறது; ஆனால் பரிசின் துல்லியமான இறையியல் தன்மையையோ, அதை ஒருவர் எவ்வாறு பெறுகிறார் என்பதையோ இங்கே வரையறுக்கவில்லை. ஆகவே அந்த இறையியல் இழுபறியை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் அதே நேரத்தில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஓட்டப்பந்தய அரங்கு,’ ‘பரிசு,’ ‘ஓடுங்கள்’ ஆகிய சொற்கள் மூலத்தின் தெளிவான தடகள உருவகத்தைத் தக்கவைக்கின்றன. வினா வடிவமும் இறுதி கட்டளையின் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
