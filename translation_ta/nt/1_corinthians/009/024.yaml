  source_fidelity: மூலக் கிரேக்கத்தின் வினாவடிவம் (Οὐκ οἴδατε), அரங்கில் ஓடுபவர்கள் அனைவரும் ஓடுதல், ஆனால் ஒருவரே பரிசைப் பெறுதல் என்ற μέν...δέ முரண்பாடு, மேலும் οὕτως τρέχετε ἵνα καταλάβητε என்ற நோக்கமுள்ள கட்டளை ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘அதை’ என்பது உடனே முன்னர் வந்த ‘பரிசை’ இயல்பாகச் சுட்டுகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘ஓட்டப்பந்தய அரங்கில்,’ ‘ஒருவரே பரிசைப் பெறுகிறார்,’ ‘அவ்வாறே ஓடுங்கள்’ ஆகியவை தெளிவானவை. ‘பெற்றுக்கொள்ளும்படி’ சற்றே முறையான வடிவமாக இருந்தாலும், வசனத்தின் அறிவுறுத்தல் நடைக்கு ஏற்றது.
  terminology: ‘ஓட்டப்பந்தய அரங்கில்’ στάδιον என்பதன் இடப்பொருளைத் தக்கவைக்கிறது; ‘பரிசு’ βραβεῖον என்பதற்கு பொருத்தமானது. καταλάβητε-க்கு ‘பெற்றுக்கொள்ள’ என்பதைப் பயன்படுத்தியிருப்பது ‘வெல்ல’ எனும் கூடுதல் விளக்கத்தைத் திணிக்காமல், பெறுதல்/அடைதல் என்ற பொருள் அகலத்தைப் பாதுகாக்கிறது. அடிக்குறிப்புகள் தொடர்புடைய இடங்களில் சரியாக இணைக்கப்பட்டுள்ளன.
