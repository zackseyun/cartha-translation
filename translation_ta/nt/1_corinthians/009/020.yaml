reference: 1 Corinthians 9:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: ta
  text: யூதர்களை ஆதாயப்படுத்துவதற்காக, யூதர்களுக்கு யூதனைப்போல் ஆனேன்[a]; சட்டத்திற்குக் கீழ்ப்பட்டவர்களை ஆதாயப்படுத்துவதற்காக, நானே சட்டத்திற்குக் கீழ்ப்பட்டவன் அல்ல என்றாலும், சட்டத்திற்குக் கீழ்ப்பட்டவர்களுக்கு சட்டத்திற்குக் கீழ்ப்பட்டவர்போல் ஆனேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆதாயப்படுத்த’ என்பதற்கு ‘வென்றுகொள்ள’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சட்டம்’ என்பது பெரும்பாலும் மோசேயின் சட்டத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: ஆனேன்
  rationale: γίνομαι என்பதன் இயல்பான அடிப்படைப் பொருளையும், வெவ்வேறு குழுக்களுக்கேற்ப பவுல் தம் நடத்தை அல்லது நிலைப்பாட்டை அமைத்துக்கொண்டதையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: யூதர்களுக்கு யூதனைப்போல்
  rationale: ὡς என்பதன் ஒப்புமை வலிமையைப் பாதுகாக்கிறது; பவுலின் இன அடையாளம் மாறியது என்று கூறாமல், அவர் ஏற்றுக்கொண்ட அணுகுமுறையைக் குறிக்கிறது.
- source_word: ἵνα ... κερδήσω
  choice: ஆதாயப்படுத்திக்கொள்ளும்படி
  rationale: κερδαίνω என்பதன் ‘ஆதாயம் அடைதல்’ என்ற உருவகத்தைத் தக்கவைத்தபடியே, மனிதர்களைத் தன் அறிவிப்பின் பக்கம் கொண்டுவரும் நோக்கைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῖς ὑπὸ νόμον
  choice: திருச்சட்டத்திற்குக் கீழ்ப்பட்டவர்களுக்கு
  rationale: ὑπό உடன் வரும் νόμος கட்டுப்பாடு அல்லது அதிகாரத்திற்கு உட்பட்ட நிலையைக் குறிக்கிறது. சூழலில் இது மோசேயின் சட்டத்தை மிக இயல்பாகச் சுட்டுவதால், பொதுத் தமிழ் வேதாகம நடையில் தெளிவான ‘திருச்சட்டம்’ பயன்படுத்தப்படுகிறது.
- source_word: ὡς ὑπὸ νόμον
  choice: திருச்சட்டத்திற்குக் கீழ்ப்பட்டவனைப்போல்
  rationale: கிரேக்கத்தின் சுருக்கமான ஒப்புமையை இயல்பான தமிழில் விரித்து, பவுல் உண்மையில் அந்த நிலைக்குக் கீழிருந்தார் என்று கூறாமல் அவருடைய தழுவிக்கொள்ளும் நடத்தையை வெளிப்படுத்துகிறது.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: நான் திருச்சட்டத்திற்குக் கீழ்ப்பட்டவன் அல்ல என்றாலும்
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் சமகாலத் தகுதிப்படுத்தலையும் முரண்பாட்டையும் இயல்பான தமிழில் தருகிறது; பவுலின் நிலையை கடந்தகாலத்திற்கு மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: αὐτὸς
  choice: நான்
  rationale: தமிழில் தனிப்பட்ட சுட்டுப்பெயரை வெளிப்படையாகச் சேர்ப்பது αὐτός தரும் தனிப்பட்ட வலியுறுத்தலைச் சூழலுக்கு ஏற்ற அளவில் காட்டுகிறது.
- source_word: νόμος
  choice: திருச்சட்டம்
  rationale: யூதர்களைப் பற்றிய உடனடி சூழலில் மோசேயின் சட்டமே பெரும்பாலும் குறிக்கப்படுகிறது. அதேவேளை ‘மோசேயின்’ என்று முதன்மை உரையில் சேர்க்காமல் மூலத்தின் சற்றே பரந்த சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுல் ‘திருச்சட்டத்திற்குக் கீழ்ப்பட்டவன் அல்ல’ என்று கூறுவதன் பொருள்
  choice: ‘நான் திருச்சட்டத்திற்குக் கீழ்ப்பட்டவன் அல்ல என்றாலும்’ என்று எந்த விளக்கத் தகுதியும் சேர்க்காமல் நேரடியாக மொழிபெயர்த்தல்.
  alternative: ‘நான் மோசேயின் சட்டத்திற்குக் கீழ்ப்பட்டவன் அல்ல என்றாலும்’ அல்லது அடுத்த வசனத்தின் மொழியை இணைத்து ‘தேவனுடைய சட்டமில்லாதவன் அல்ல’ என்று விளக்குதல்.
  rationale: இவ்வசனத்தின் கிரேக்கம் பவுல் சட்டத்திற்குக் கீழ் இல்லை என்று மட்டும் கூறுகிறது. அடுத்த வசனத்தை இங்கே புகுத்தாமலும், ‘சட்டம்’ என்பதன் எல்லையை முதன்மை உரையில் இறுக்காமலும் இருப்பது அதன் சொல்லாட்சியையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் மீளுரைப்பும் ஒப்புமை அமைப்பும் முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன; நீளமான இரண்டாம் கூறு தமிழில் தெளிவாகப் புரிய வினைச்சொல் மறுபடியும் வெளிப்படுத்தப்பட்டுள்ளது.
