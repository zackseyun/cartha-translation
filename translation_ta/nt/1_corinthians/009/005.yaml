source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: ta
  text: மற்ற அப்போஸ்தலர்களும், ஆண்டவரின் சகோதரர்களும், கேபாவும் செய்வதுபோல, விசுவாசியான மனைவியை[a] எங்களுடன் அழைத்துச் செல்ல எங்களுக்கு உரிமை இல்லையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “சகோதரியாகிய மனைவி”—அதாவது, சக விசுவாசியாகிய மனைவி.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: உரிமை
  rationale: இச்சூழலில் பவுல் பொதுவான அதிகாரத்தை அல்ல, அப்போஸ்தல ஊழியருக்குரிய நியாயமான உரிமையைப் பற்றிப் பேசுகிறார்.
- source_word: ἀδελφὴν γυναῖκα
  choice: விசுவாசியான மனைவி
  rationale: இரு பெயர்ச்சொற்களும் சேர்ந்து, விசுவாசக் குடும்பத்தைச் சேர்ந்த ஒரு சகோதரியாகவும் தன் மனைவியாகவும் இருப்பவரைக் குறிக்கின்றன. இயல்பான நவீன தமிழில் இதைத் தெளிவாகத் தெரிவிக்கிறது; கிரேக்கத்தின் சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: περιάγειν
  choice: எங்களுடன் அழைத்துச் செல்ல
  rationale: ஊழியப் பயணங்களில் ஒருவரைத் தம்முடன் கூட்டிச் செல்வதே இங்கு பொருள்; தமிழ் வாக்கியத்தில் உடன்செல்வதைத் தெளிவுபடுத்த ‘எங்களுடன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὡς καὶ
  choice: செய்வதுபோல
  rationale: மற்ற அப்போஸ்தலர்கள் முதலியோரின் நடைமுறையுடன் பவுலும் பர்னபாவும் ஒப்பிடப்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: மற்ற அப்போஸ்தலர்கள்
  rationale: λοιποί என்பது முன் குறிப்பிடப்பட்டவர்களைத் தவிர அதே வகையைச் சேர்ந்த மீதியுள்ளவர்களைக் குறிக்கிறது; ‘மற்ற’ என்பது இங்கு இயல்பான தமிழ்.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: ஆண்டவரின் சகோதரர்கள்
  rationale: கிரேக்கச் சொற்றொடரை நேரடியாகப் பாதுகாத்து, அவர்களின் துல்லியமான குடும்ப உறவைப் பற்றிய பிற்கால இறையியல் விவாதத்தை மொழிபெயர்ப்பில் தீர்மானிக்காமல் விடுகிறது.
- source_word: Κηφᾶς
  choice: கேபா
  rationale: மூல உரையில் பேதுரு என்பதற்குப் பதிலாக உள்ள செமித்தியப் பெயர் வடிவத்தைத் தமிழில் ஒலிபெயர்த்துப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவரின் சகோதரர்கள்’ என்போரின் உறவு
  choice: சொற்றொடரை ‘ஆண்டவரின் சகோதரர்கள்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: இயேசுவின் உடன்பிறந்த சகோதரர்கள் / மாற்றாந்தாய் வழிச் சகோதரர்கள் / நெருங்கிய உறவினர்கள்
  rationale: கிரேக்கச் சொற்றொடர் அவர்களை ஆண்டவரின் சகோதரர்கள் என அழைக்கிறது; ஆனால் உறவின் துல்லியமான தன்மையைத் தனியாகத் தீர்மானிப்பதில்லை. ஆகவே இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ἀδελφὴν γυναῖκα என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘விசுவாசியான மனைவி’
  alternative: ‘சகோதரியாகிய மனைவி’ அல்லது ‘ஒரு சகோதரியை மனைவியாக’
  rationale: சூழலில் இது வெறும் பெண் துணையாளரை அல்ல, விசுவாசக் குடும்பத்தைச் சேர்ந்த மனைவியைக் குறிக்கிறது. சொற்படியான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கேள்வியின் வலியுறுத்தல் ‘உரிமை இல்லையா?’ எனப் பாதுகாக்கப்பட்டுள்ளது; ‘ஆண்டவரின் சகோதரர்கள்’ என்ற சொற்றொடரின் இறையியல் தெளிவின்மை தீர்க்கப்படவில்லை.
