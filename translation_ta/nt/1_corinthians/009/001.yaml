source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: ta
  text: நான் சுதந்திரமானவன் அல்லவா? நான் ஓர் அப்போஸ்தலன் அல்லவா? நம் ஆண்டவராகிய இயேசுவை நான் கண்டதில்லையா? ஆண்டவரில் நீங்கள் என் பணி அல்லவா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύθερος
  choice: சுதந்திரமானவன்
  rationale: பவுல் தமக்குள்ள சுதந்திரத்தையும் உரிமையையும் வலியுறுத்துகிறார். ‘சுதந்திரமானவன்’ என்பது நேரடியானதும் இன்றைய வாசகர்களுக்குத் தெளிவானதுமான இணைச்சொல்.
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: இங்கு பொதுவான தூதரை அல்ல, பவுலின் அங்கீகரிக்கப்பட்ட அப்போஸ்தலப் பணிநிலையைச் சுட்டுவதால் புதிய ஏற்பாட்டில் நிலைபெற்ற தொழில்நுட்பச் சொல்லே பயன்படுத்தப்படுகிறது.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: நம் ஆண்டவராகிய இயேசு
  rationale: கிரேக்கத் தொடரின் உறவைத் தெளிவாகவும் இயல்பான தமிழ் சொல்லமைப்பிலும் தெரிவிக்கிறது; κύριος என்பதன் கிறிஸ்துவியல் பட்டம் ‘ஆண்டவர்’ என்று காக்கப்படுகிறது.
- source_word: ἑόρακα
  choice: கண்டதில்லையா
  rationale: கிரேக்க நிறைவுக்கால வினையின் தொடரும் முக்கியத்துவத்தைத் தமிழ் எதிர்மறை வினாவால் இயல்பாகத் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘உயிர்த்தெழுந்த’ என்ற விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ἔργον
  choice: நான் செய்த பணியின் பலன்
  rationale: கொரிந்திய விசுவாசிகள் பவுலின் அப்போஸ்தலப் பணியால் உருவானவர்கள் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘என் பணி’ என்று சொன்னால் தமிழில் ஏற்படும் கடினத்தன்மையைத் தவிர்க்கிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவரில்
  rationale: பவுலின் வழக்கமான தொடர்பு அல்லது செயல்பாட்டுக் களத்தைக் குறிக்கும் தொடரை மிகையாக விளக்காமல் சுருக்கமாகக் காக்கிறது.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: அல்லவா? / கண்டதில்லையா?
  rationale: உறுதியான ‘ஆம்’ என்ற பதிலை எதிர்பார்க்கும் தொடர்ச்சியான எதிர்மறை வினாக்களின் வாதநயத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவைக் கண்டதாகப் பவுல் கூறுவதன் பொருள்
  choice: பவுலின் அப்போஸ்தலத் தகுதிக்கு ஆதாரமாக இயேசுவைக் கண்ட நிகழ்வை எளிமையாகக் கூறுதல்
  alternative: உயிர்த்தெழுந்த இயேசுவைக் கண்டதாக மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழல் உயிர்த்தெழுந்த இயேசுவின் தரிசனத்தைக் குறிக்கிறது என்றாலும், கிரேக்க வசனம் ‘உயிர்த்தெழுந்த’ என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே அந்தச் சொல்லைச் சேர்க்காமல் மூலத்தின் இறையியல் இறுக்கமும் எளிமையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவசனத்திற்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. தொடர்ச்சியான நான்கு வினாக்களின் வாத வேகமும் காக்கப்பட்டுள்ளது.
