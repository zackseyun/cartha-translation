source:
  edition: SBLGNT
  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: ta
  text: போட்டியில் பங்கேற்கும் ஒவ்வொருவரும் எல்லாவற்றிலும் தன்னடக்கத்தைக் கடைப்பிடிக்கிறார்கள். அவர்களோ அழிந்துபோகும் வெற்றிமாலையைப் பெறுவதற்காக; நாமோ அழியாத ஒன்றைப் பெறுவதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἀγωνιζόμενος
  choice: பந்தயத்தில் போட்டியிடுகிற ஒவ்வொருவரும்
  rationale: ἀγωνιζόμενος என்ற சொல் உடனடிச் சூழலில் விளையாட்டுப் போட்டியைக் குறிக்கிறது; πᾶς உடன் சேர்ந்த ஒருமை அமைப்பின் அனைவரையும் உள்ளடக்கும் பொருளை ‘ஒவ்வொருவரும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάντα ἐγκρατεύεται
  choice: எல்லாவற்றிலும் தன்னடக்கத்தைக் கடைப்பிடிக்கிறார்கள்
  rationale: πάντα கட்டுப்பாட்டின் விரிந்த எல்லையைச் சுட்டுகிறது; ἐγκρατεύεται தொடர்ச்சியாகத் தன்னைக் கட்டுப்படுத்தும் நடைமுறையைக் குறிக்கிறது.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: அவர்களோ ... அப்படிச் செய்கிறார்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட போட்டியாளர்களை மீண்டும் சுட்டி, ἡμεῖς δέ உடனான எதிர்மறை ஒப்பீட்டைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἵνα ... λάβωσιν
  choice: பெறுவதற்காக
  rationale: ἵνα இங்கு நோக்கத்தைக் குறிக்கிறது; தமிழில் நோக்க உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φθαρτὸν στέφανον
  choice: அழிந்துபோகும் ஒரு வெற்றிமாலை
  rationale: στέφανος விளையாட்டுப் போட்டியில் வென்றவருக்கு அளிக்கப்பட்ட மாலையைக் குறிக்கிறது; ‘வெற்றிமாலை’ அந்த வரலாற்றுப் படிமத்தை ‘கிரீடம்’ என்பதைக் காட்டிலும் துல்லியமாகக் காக்கிறது. φθαρτός அதன் நிலையற்ற தன்மையைச் சொல்கிறது.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: நாமோ அழியாத ஒன்றைப் பெறுவதற்காகச் செய்கிறோம்
  rationale: கிரேக்கத்தில் στέφανον மற்றும் செயப்பாடு விடுபட்டுள்ளன; தமிழில் பொருள் தெளிவாக இருக்க அவை மறைமுகமாக நிரப்பப்பட்டாலும், வெகுமதியின் தன்மை ‘ஒன்று’ என்று வரையறுக்கப்படாமல் வைக்கப்படுகிறது.
theological_decisions:
- issue: வெகுமதி உருவகத்தின் தன்மை
  choice: நிலையற்ற வெற்றிமாலைக்கும் அழியாத ஒன்றுக்கும் இடையிலான பவுலின் ஒப்பீட்டை மட்டும் தக்கவைத்தல்
  alternative: அதை நித்திய வாழ்வு அல்லது பரலோக வெகுமதிகள் என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: இந்த வசனம் வெகுமதியின் துல்லியமான இறையியல் அடையாளத்தை விளக்காமல் விளையாட்டுப் போட்டி உருவகத்திலேயே பேசுகிறது; ஆகவே உரை அளிக்காத குறிப்பை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. மூலத்தில் தனியான காலக் குறியீடு இல்லாததால் தொடக்கத்தில் ‘இப்போது’ சேர்க்கப்படவில்லை. ‘அவர்களோ ... நாமோ’ என்பது μὲν ... δέ எதிர்மறை ஒப்பீட்டைத் தெளிவாகக் காட்டுகிறது.
