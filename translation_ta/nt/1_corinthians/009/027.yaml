source:
  edition: SBLGNT
  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: ta
  text: ஆனால், என் உடலைக் கடுமையாகக் கட்டுப்படுத்தி[a], அதை அடிமையாக்குகிறேன்[b]; மற்றவர்களுக்குப் பிரசங்கித்த பின், நானே ஒருவேளை தகுதி இழந்தவனாகிவிடக் கூடாதென்பதற்காக[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் உடலை அடித்து வருத்தி.’ கிரேக்க வினைச்சொல் சொல்லளவில் கண்ணுக்குக் கீழே தாக்குவதைக் குறிக்கிறது; இங்கு கடுமையான தன்னடக்கத்திற்கான உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதை அடிமை நிலையில் கொண்டுவருகிறேன்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘ஏற்கப்படாதவனாக’ அல்லது ‘சோதனையில் தேறாதவனாக.’ சூழலிலுள்ள விளையாட்டுப் போட்டி உருவகத்திற்கு ‘தகுதி இழந்தவன்’ என்பது பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: கடுமையாகக் கட்டுப்படுத்தி
  rationale: இந்த வினைச்சொல் சொல்லளவில் கண்ணுக்குக் கீழே தாக்குவதைக் குறிக்கலாம்; இங்கு விளையாட்டுப் போட்டி மற்றும் தன்னடக்கச் சூழலில் உடலைக் கடுமையாக ஒழுங்குபடுத்துவதை உருவகமாகக் குறிக்கிறது. தமிழில் இயல்பாகவும் உருவகத்தின் கடுமையை உணர்த்தும் வகையிலும் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: σῶμα
  choice: உடல்
  rationale: பவுல் குறிப்பாக உடலையே ஒழுங்குபடுத்தப்பட வேண்டிய பொருளாகக் குறிப்பிடுவதால், பொதுவான ‘தன்னை’ என்பதற்குப் பதிலாக நேரடியான பெயர்ச்சொல் தக்கவைக்கப்பட்டது.
- source_word: δουλαγωγῶ
  choice: அடிமையாக்குகிறேன்
  rationale: இந்த வினைச்சொல் ஒருவரை அடிமை நிலைக்குக் கொண்டுவருதல் அல்லது அடிமையாக ஆக்குதல் என்ற வலுவான பொருளைக் கொண்டது. ‘கட்டுப்பாட்டில் வைக்கிறேன்’ என்று மென்மைப்படுத்தாமல் அதன் உருவக வலிமை பாதுகாக்கப்பட்டது.
- source_word: μή πως
  choice: ஒருவேளை ... கூடாது
  rationale: எதிர்மறையான நோக்கத்தையும் அச்சத்துடன் கூடிய சாத்தியத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄλλοις
  choice: மற்றவர்களுக்கு
  rationale: κηρύξας என்பதுடன் வரும் வேற்றுமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κηρύξας
  choice: பிரசங்கித்த பின்
  rationale: இறந்தகாலப் பெயரெச்சம் பிரதான வினைக்கு முந்திய செயலைக் குறிக்கிறது; ‘பின்’ அந்தக் காலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀδόκιμος
  choice: தகுதி இழந்தவன்
  rationale: சோதனையில் அங்கீகாரம் பெறாத நிலையை இது குறிக்கிறது. சுற்றியுள்ள விளையாட்டுப் போட்டி உருவகத்துக்கும் பொருந்துவதோடு, இறுதி இரட்சிப்பு அல்லது ஊழியப் பலன் என்ற குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்பில் திணிக்காமல் எச்சரிக்கையின் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: γένωμαι
  choice: ஆகிவிடக் கூடாது
  rationale: μή πως உடன் வரும் இறந்தகால இடைநிலை வாய்ப்புவினையின் எதிர்பார்க்கப்படும் அச்சமூட்டும் விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களின் கருத்துடன் உள்ள வலுவான முரண்பாட்டை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: αὐτός
  choice: நானே
  rationale: மற்றவர்களுக்குப் பிரசங்கித்தவரான பவுலே தகுதி இழக்கும் சாத்தியம் குறித்த முரண்பாட்டை வலியுறுத்தும் கிரேக்கச் சொல்லின் அழுத்தம் பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: பவுல் ἀδόκιμος ஆகிவிடுவேன் என்று அஞ்சுவதன் பொருள்
  choice: ‘தகுதி இழந்தவன்’ என்று மொழிபெயர்த்து, விளையாட்டுப் போட்டி மற்றும் சோதனை சார்ந்த உருவகத்தைத் தக்கவைத்தல்
  alternative: இறுதியாக தேவனால் நிராகரிக்கப்படுதல்; அல்லது ஊழியத் தகுதி/பலன் மட்டும் இழத்தல்
  rationale: உடனடிச் சூழல் ஓட்டப்பந்தயம், தன்னடக்கம், பரிசு ஆகிய உருவகங்களைக் கொண்டுள்ளது. கிரேக்கச் சொல் எச்சரிக்கையின் தீவிரத்தை வெளிப்படுத்தினாலும், அது இரட்சிப்பின் இழப்பை மட்டுமே குறிக்கிறதா அல்லது ஊழியத் தகுதி/பலன் இழப்பை மட்டுமே குறிக்கிறதா என்பதைத் தீர்மானிப்பதில்லை. ஆகவே அந்த இறையியல் அழுத்தமும் தெளிவின்மையும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘அடிமையாக்குகிறேன்’ என்ற வலுவான உருவகம் மென்மைப்படுத்தப்படவில்லை; ‘தகுதி இழந்தவன்’ என்ற சொல் இறையியல் விவாதத்தை முன்கூட்டியே தீர்மானிக்காமல் மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
