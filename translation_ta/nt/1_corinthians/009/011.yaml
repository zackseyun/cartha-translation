id: 1CO.9.11
reference: 1 Corinthians 9:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: ta
  text: நாங்கள் உங்களிடையே ஆவிக்குரியவற்றை விதைத்திருக்கிறோம் என்றால், உங்களிடமிருந்து பொருள்சார்ந்தவற்றை அறுவடை செய்வது மிகையானதா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவ்வுலக வாழ்க்கைக்குரியவற்றை.” கிரேக்கத்தில் இது “ஆவிக்குரியவற்றை” உடல் அல்லது பொருள் வாழ்வைச் சார்ந்தவற்றுக்கு எதிராகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: ஆவிக்குரியவற்றை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலைப் பன்மை உருபின் பரந்த பொருளை இது காக்கிறது; ஆவிக்குரிய நன்மைகள் அல்லது ஊழியப் பயன்கள் என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: ἐσπείραμεν
  choice: விதைத்திருக்கிறோம்
  rationale: பவுலும் அவருடைய உடனுழைப்பாளர்களும் முன்பு செய்த ஊழியத்தை விதைத்தல் என்ற உருவகத்தோடும் அதன் தற்போதைய தொடர்போடும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: μέγα
  choice: மிகையானதா?
  rationale: இது பெரிய காரியமா என்ற சொல்லுக்குச் சொல் அமைப்பை விட, கோரப்படும் ஆதரவு அளவுக்கு மீறியதா அல்லது நியாயமற்றதா என்று கேட்கும் சொல்லாட்சிக் கேள்வியின் பொருளை இயல்பாகத் தருகிறது.
- source_word: τὰ σαρκικὰ
  choice: பொருள்சார்ந்தவற்றை
  rationale: இங்கு பாவமுள்ள மாம்ச நடத்தையைக் குறிக்காமல், உடல் மற்றும் அன்றாட வாழ்வுக்கான பொருள் ஆதரவைக் குறிக்கிறது; πνευματικὰ என்பதுடனான எதிரிணையையும் காக்கிறது.
- source_word: θερίσομεν
  choice: அறுவடை செய்வது
  rationale: எதிர்கால வினையின் கருத்தைத் தமிழ் சொல்லாட்சிக் கேள்வியில் இயல்பான வினைப்பெயர் அமைப்பால் வழங்கி, விதைத்தல்–அறுவடை செய்தல் உருவகத்தைத் தொடர்ந்து காக்கிறது.
- source_word: ὑμῶν
  choice: உங்களிடமிருந்து
  rationale: அறுவடை செய்யப்படும் பொருள் கொரிந்தியர்களிடமிருந்து வரும் என்பதைக் கிரேக்க வேற்றுமையின் இயல்பான தமிழ் வடிவில் தெரிவிக்கிறது.
- source_word: ἡμεῖς
  choice: நாங்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாக வரும் வலியுறுத்தப்பட்ட எழுவாயைத் தமிழில் காத்து, ஊழியம் செய்தவர்களுக்கும் அவர்களுக்குக் கிடைக்க வேண்டிய ஆதரவுக்கும் உள்ள தொடர்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: σαρκικὰ என்பது πνευματικὰ என்பதற்கு எதிரிணையாகக் கொள்ளப்படும் விதம்
  choice: ஊழியத்திற்கான பொருள் அல்லது உடல் வாழ்வு சார்ந்த ஆதரவு
  alternative: மாம்சத்துக்குரியவை அல்லது பாவமுள்ள நடத்தைகள்
  rationale: சூழலில் பவுல் அப்போஸ்தலர்கள் பொருளாதார ஆதரவைப் பெறும் உரிமையை ஆதரிக்கிறார். ஆகவே எதிரிணை ஆவிக்குரிய ஊழியத்துக்கும் இவ்வுலக வாழ்க்கைக்குரிய பொருள் ஆதரவுக்கும் இடையிலானது; பரிசுத்தத்துக்கும் பாவத்துக்கும் இடையிலானது அல்ல.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. “ஆவிக்குரியவை” மற்றும் “பொருள்சார்ந்தவை” என்ற பரந்த சொற்கள் கிரேக்கத்தின் திட்டமிட்ட பொதுமையைக் காக்கின்றன; விதைத்தல்–அறுவடை செய்தல் உருவகம் முழுமையாகத் தக்கவைக்கப்பட்டுள்ளது.
