id: 1CO.9.18
reference: 1 Corinthians 9:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: ta
  text: அப்படியானால், எனக்குக் கிடைக்கும் பலன் என்ன? நற்செய்தியை அறிவிக்கும்போது அதை இலவசமாக வழங்குவதும், நற்செய்திப் பணியில் எனக்குள்ள உரிமையை முழுமையாகப் பயன்படுத்தாமல் இருப்பதுமே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நற்செய்தியில் எனக்குள்ள உரிமையை முழுமையாகப் பயன்படுத்தாமல் இருப்பதுமே.”
    reason: ἐν τῷ εὐαγγελίῳ என்ற கிரேக்கச் சொற்றொடரை இன்னும் நெருக்கமாக மொழிபெயர்க்கும் மாற்று; அதன் பொருள் நற்செய்தி ஊழியத்தோடு தொடர்புடையதாக இருக்கலாம்.
lexical_decisions:
- source_word: μισθός
  choice: பலன்
  rationale: இங்கு நேரடியான கூலி அல்லது சம்பளம் மட்டுமல்லாமல், பவுல் தன் பணியில் பெறும் பிரதிபலனைக் குறிக்கிறது. கட்டணம் பெறாமல் அறிவிப்பதே தன் ‘பலன்’ என்று அவர் கூறும் சொல்லாட்சியையும் இது இயல்பாகத் தக்கவைக்கிறது.
- source_word: εὐαγγελιζόμενος
  choice: நற்செய்தியை அறிவிக்கும்போது
  rationale: முதன்மைச் செயலுடன் ஒரே நேரத்தில் நடைபெறும் அறிவித்தல் செயலைப் பங்கேற்புவினை குறிக்கிறது; தமிழில் இந்த வடிவம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀδάπανον
  choice: இலவசமாக
  rationale: செலவு அல்லது கட்டணம் இல்லாமல் என்பதே இச்சொல்லின் பொருள். இச்சூழலில் பவுல் ஊதியம் கோராமல் நற்செய்தியை வழங்குவதை ‘இலவசமாக’ தெளிவாகக் கூறுகிறது.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: அதை ... வழங்குவதும்
  rationale: சொல்லுக்குச் சொல் ‘நற்செய்தியை வைப்பது’ என்றாலும், இச்சூழலில் அதை மக்களுக்கு முன்வைப்பது அல்லது அளிப்பது என்ற இடியோமப் பொருள் உள்ளது. ‘வழங்குவது’ நவீன தமிழில் இயல்பானது.
- source_word: εὐαγγέλιον
  choice: நற்செய்தி
  rationale: இச்சொல்லின் அடிப்படைப் பொருளை நேரடியாகவும், தமிழ்க் கிறிஸ்தவ வழக்கிலும் பொதுவாகப் புரியும் வகையிலும் தெரிவிக்கிறது.
- source_word: καταχρήσασθαι
  choice: முழுமையாகப் பயன்படுத்தாமல்
  rationale: இந்த வினை இங்கு தனக்குள்ள நியாயமான உரிமையை முழு அளவில் பயன்படுத்துவதைக் குறிக்கிறது. தவறாகப் பயன்படுத்துதல் அல்லது சுரண்டுதல் என்ற எதிர்மறைப் பொருளைத் தேவையின்றி புகுத்தாமல் இருக்க இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐξουσίᾳ
  choice: உரிமை
  rationale: 1 கொரிந்தியர் 9-ன் சூழலில், ஊழியத்திற்கான பொருளாதார ஆதரவைப் பெற பவுலுக்குள்ள நியாயமான உரிமையே குறிப்பாகப் பேசப்படுகிறது; ஆகவே பரந்த ‘அதிகாரம்’ என்பதைக் காட்டிலும் ‘உரிமை’ துல்லியமானது.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: நற்செய்திப் பணியில்
  rationale: சொற்றொடர் சொற்படியாக ‘நற்செய்தியில்’ என்றாலும், இங்கு நற்செய்தியை அறிவிக்கும் பணி தொடர்பான உரிமையைக் குறிக்கிறது. தமிழில் பொருளை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்த ‘நற்செய்திப் பணியில்’ என விரிவாக்கப்பட்டது; நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: இச்சூழலில் பவுலின் ἐξουσία என்பதன் தன்மை
  choice: நற்செய்திப் பணியில் ஆதரவு பெறுவதற்கான பவுலின் நியாயமான உரிமை; அதை அவர் தாமாகவே முழுமையாகப் பயன்படுத்தவில்லை.
  alternative: பொதுவான அப்போஸ்தல அதிகாரம்; அல்லது அதிகாரத்தைத் தவறாகப் பயன்படுத்துதல்.
  rationale: சுற்றியுள்ள பகுதி பொருளாதார ஆதரவு பெற அப்போஸ்தலருக்குள்ள உரிமையை மீண்டும் மீண்டும் விவாதிக்கிறது. எனவே ‘உரிமை’ என்றும், தவறான பயன்பாட்டைக் குறிக்காமல் ‘முழுமையாகப் பயன்படுத்தாமல்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- issue: εὐαγγέλιον என்பதன் மொழிபெயர்ப்பு
  choice: நற்செய்தி
  alternative: சுவிசேஷம்
  rationale: ‘நற்செய்தி’ என்பது மூலச்சொல்லின் தெளிவான பொருளை நவீன நிலையான தமிழில் நேரடியாக வழங்குகிறது; அதே நேரத்தில் வழக்கமான கிறிஸ்தவப் பயன்பாட்டிலும் புரிந்துகொள்ளத்தக்கது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. கிரேக்கத்தின் சொல்லாட்சியை இயல்பான தமிழாக்கமாக்கியுள்ள போதும், ἐν τῷ εὐαγγελίῳ என்பதிலுள்ள சுருக்கத்தையும் சாத்தியமான பொருள் வேறுபாட்டையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
