source:
  edition: SBLGNT
  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: ta
  text: ஆனால், அதில் உடன் பங்குபெறுபவனாக ஆகும்படி, நற்செய்திக்காக நான் எல்லாவற்றையும் செய்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதில் பங்குபெறுவதற்காக” அல்லது “அதில் பங்காளியாக ஆவதற்காக.”
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: வேற்றுமை உருபுடன் வரும் நடுநிலைப் பன்மை இங்கு விரிவான முழுமையைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘எல்லாவற்றையும்’ அந்த விரிவைப் பாதுகாக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் மென்மையான எதிர்மறைத் தொடர்பை δέ குறிக்கிறது; சூழலில் ‘ஆனால்’ பொருத்தமானது.
- source_word: ποιῶ
  choice: நான் ... செய்கிறேன்
  rationale: நிகழ்கால வினை வடிவம் பவுலின் வழக்கமான, தொடர்ச்சியான செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: நற்செய்திக்காகவே
  rationale: διά + குற்றுவேற்றுமை காரணம், நோக்கம் அல்லது நலன் சார்ந்த உந்துதலைக் குறிக்கலாம். ‘-க்காகவே’ பவுலின் நோக்கத்தையும் வலியுறுத்தலையும் சுருக்கமாகக் காக்கிறது; εὐαγγέλιον என்பதற்கு புரிந்துகொள்ள எளிதான ‘நற்செய்தி’ பயன்படுத்தப்படுகிறது.
- source_word: ἵνα
  choice: '... ஆகும்படி'
  rationale: நோக்கத்தை அறிமுகப்படுத்தும் ἵνα-வின் பொருளை இயல்பான தமிழ் நோக்கவாக்கியமாகத் தருகிறது.
- source_word: συγκοινωνὸς
  choice: உடன்பங்காளி
  rationale: συν- கூறிலுள்ள ‘மற்றவர்களுடன் சேர்ந்து’ என்ற பகிர்வுணர்வையும் κοινωνός என்பதிலுள்ள பங்கேற்பையும் ‘உடன்பங்காளி’ காக்கிறது; பணி, பலன் அல்லது பரவல் என ஒன்றுக்குள் பொருளைச் சுருக்கவில்லை.
- source_word: αὐτοῦ
  choice: அதில்
  rationale: உடனடியாக முன்வரும் நடுநிலை ஒருமையான εὐαγγέλιον-ஐச் சுட்டுகிறது. தமிழில் ‘அதில்’ என்பது பங்கேற்புடன் இயல்பாக இணைகிறது.
- source_word: γένωμαι
  choice: நானும் ... ஆகும்படி
  rationale: γίνομαι என்பதன் ‘ஆகுதல்’ பொருளைத் தக்கவைக்கிறது; ‘நானும்’ என்பது συγκοινωνός-இன் உடன் பங்கேற்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நற்செய்தியில் பவுல் ‘உடன்பங்காளி’ ஆவதன் பொருள்
  choice: ‘அதில் நானும் உடன்பங்காளியாக’ என்று விரிவான பங்கேற்புப் பொருள் பாதுகாக்கப்படுகிறது.
  alternative: அதன் ஆசீர்வாதங்களில் பங்குபெறுதல்; அதன் பரவலில் பங்குபெறுதல்; நற்செய்திப் பணியில் கூட்டாளியாதல்.
  rationale: συγκοινωνός என்பது நற்செய்தியிலும் அதன் பலன்களிலும் அல்லது பணியிலும் பகிர்ந்து பங்கேற்பதை உள்ளடக்கக்கூடிய பரந்த சொல். குறிப்பிட்ட கோட்பாட்டு அல்லது ஊழியப் பொருளுக்குள் வசனம் சுருக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘நற்செய்தி’ பொதுவாகப் புரியும் சொலாகவும், ‘உடன்பங்காளி’ மூலத்தின் கூட்டு பங்கேற்பைத் தக்கவைக்கும் சொலாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளது. ‘வே’ பவுலின் நோக்க மையத்தை இயல்பாக வலியுறுத்துகிறது.
