source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: ta
  text: தன் சொந்தச் செலவில் படைவீரனாகப் பணியாற்றுபவன் எப்போதாவது யார்? திராட்சைத்தோட்டம் நடவு செய்து அதன் கனியை உண்ணாதவன் யார்? மந்தையை மேய்ப்பவன், அந்த மந்தையின் பாலிலிருந்து அருந்தாதவன் யார்?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் சொந்த ஊதியத்தைக் கொண்டு.” கிரேக்கச் சொல் படைவீரரின் ஊதியம் அல்லது உணவுப்பங்கைக் குறிக்கலாம்; படைவீரன் தன் பணிக்கான செலவைத் தானே ஏற்றுக்கொள்வதில்லை என்பதே இங்குள்ள கருத்து.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அந்த மந்தையின் பாலிலிருந்து உண்ணாதவன்.” பாலைக் குறிக்கும்போது தமிழில் இயல்பாக “அருந்து” என்று கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: படைவீரனாகப் பணியாற்றுகிறவன்
  rationale: இவ்வினைச்சொல் இராணுவப் பணியாற்றுவதைக் குறிக்கிறது; போர் செய்வதை மட்டும் குறிப்பதாகச் சுருக்காமல், தொழில்சார் ஒப்புமையை இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἰδίοις ὀψωνίοις
  choice: தன் சொந்தச் செலவில்
  rationale: ὀψώνιον என்பது முதலில் படைவீரருக்குரிய ஊதியம் அல்லது உணவுப்பங்கைக் குறித்தாலும், இங்கு ஒருவர் தமது இராணுவப் பணிக்கான செலவைத் தாமே ஏற்கிறார் என்ற பொருள் சூழலுக்கு ஏற்றது.
- source_word: ποτέ
  choice: எவனாவது உண்டா?
  rationale: வினாவுடன் சேர்ந்து ‘எப்போதாவது/யாராவது’ என்ற வலியுறுத்தலைத் தருகிறது; தமிழில் சொல்லுக்குச் சொல் ‘எப்போதாவது’ என்பதைக் காட்டிலும் இந்த வினா அமைப்பு இயல்பானது.
- source_word: φυτεύει ἀμπελῶνα
  choice: திராட்சைத்தோட்டத்தை நட்டு
  rationale: வேளாண்மை உருவகத்தை நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: அதன் கனியை
  rationale: καρπός இங்கு திராட்சைத்தோட்டம் தரும் விளைச்சலைக் குறிக்கிறது; ‘கனி’ மூல உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ποιμαίνει ποίμνην
  choice: மந்தையை மேய்த்து
  rationale: மந்தையைப் பேணிப் பராமரிக்கும் மேய்ப்புப் பணியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: அந்த மந்தையின் பாலிலிருந்து
  rationale: ἐκ என்பதன் மூல/பகுதிப்பொருளைத் தக்கவைத்து, மந்தை வழங்குவதிலிருந்து மேய்ப்பன் பயனடையும் கருத்தை வெளிப்படுத்துகிறது.
- source_word: ἐσθίει
  choice: உண்ணாதவன் / அருந்தாதவன்
  rationale: கிரேக்கத்தில் இரு இடங்களிலும் ‘உண்’ என்ற ஒரே வினைச்சொல் உள்ளது; பாலுடன் தமிழில் ‘அருந்து’ என்பதே இயல்பானதால் சூழலுக்கேற்ற மாற்றம் செய்யப்பட்டுள்ளது.
theological_decisions:
- issue: மீண்டும் வரும் τίς வினாக்களில் பொதுப்பொருளுடைய ஆண்பால் ஒருமை
  choice: ‘பணியாற்றுகிறவன்’, ‘உண்ணாதவன்’, ‘யார்’ எனப் பிரதிநிதித்துவ ஒருமையைப் பேணுதல்
  alternative: பாலினம் வெளிப்படாத பன்மை அமைப்பைப் பயன்படுத்துதல்
  rationale: கிரேக்க மூலத்தின் ஒருமைச் சொல்லமைப்பையும் தொடர்ச்சியான மூன்று சொல்லாட்சிக் கேள்விகளையும் தமிழில் இயல்பாகப் பேணுகிறது; இது ஆண்களுக்கு மட்டும் பொருந்தும் என்ற தனிப்பட்ட கோட்பாட்டு முடிவைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மூன்று சொல்லாட்சிக் கேள்விகளும் இணையான அமைப்பில் தரப்பட்டுள்ளன. ‘மந்தை’ சூழலால் ஆடு அல்லது பிற பால் தரும் கால்நடைக் கூட்டமாகத் திறந்தே உள்ளது; மூலத்தில் இல்லாத இனக்குறிப்பு சேர்க்கப்படவில்லை.
