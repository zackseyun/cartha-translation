source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: ta
  text: 'நான் மற்றவர்களுக்கு அப்போஸ்தலனாக இல்லாவிட்டாலும், உங்களுக்கோ நிச்சயமாக அப்போஸ்தலனாக இருக்கிறேன். ஏனெனில், ஆண்டவருக்குள் என் அப்போஸ்தலப் பணியின் முத்திரை[a] நீங்களே.


    [a] அல்லது, “சான்று” அல்லது “உறுதிப்படுத்தும் அடையாளம்.” கிரேக்கச் சொல் நேரடியாக “முத்திரை” எனப் பொருள்படுகிறது; ஒன்று உண்மையானது என்பதை உறுதிப்படுத்தும் உருவகத்தை இது தக்கவைக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சான்று” அல்லது “உறுதிப்படுத்தும் அடையாளம்.” கிரேக்கச் சொல் நேரடியாக “முத்திரை” எனப் பொருள்படுகிறது; ஒன்று உண்மையானது என்பதை உறுதிப்படுத்தும் உருவகத்தை இது தக்கவைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: பவுல் தம்மைக் குறித்துப் பயன்படுத்தும் சூழலில், இது வெறும் பொதுவான தூதுவரை அல்லாமல் அங்கீகரிக்கப்பட்ட அழைப்பையும் பணியையும் குறிக்கிறது; தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் உள்ள தொழில்நுட்பச் சொல்லைத் தக்கவைக்கிறது.
- source_word: ἀλλά γε
  choice: உங்களுக்கோ நிச்சயமாக
  rationale: ἀλλά தரும் முரண்பாட்டையும் γε தரும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: σφραγίς
  choice: முத்திரை
  rationale: உண்மைத்தன்மையை உறுதிப்படுத்தும் முத்திரை என்ற கிரேக்க உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; அதன் சான்றளிக்கும் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: ἀποστολή
  choice: அப்போஸ்தலப் பணி
  rationale: இங்கு பவுலின் அப்போஸ்தல நிலை, அழைப்பு, பொறுப்பு ஆகியவற்றை உள்ளடக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் தனிச்சிறப்பான உறவுநிலைச் சொற்றொடரைத் தக்கவைக்கிறது; அதை வெறுமனே ‘ஆண்டவரால்’ என்ற செயற்பாட்டுக் கருத்தாகக் குறுக்கவில்லை.
- source_word: ἄλλοις
  choice: மற்றவர்களுக்கு
  rationale: அப்போஸ்தலனாக இருப்பதன் தொடர்புநிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் அப்போஸ்தலத் தன்மை குறித்த கூற்றின் வலிமை
  choice: மற்றவர்களைப் பொறுத்தவரை தமது அப்போஸ்தலத் தன்மை மறுக்கப்படலாம் என்பதை நிபந்தனை வடிவில் கூறினாலும், கொரிந்தியர்கள் தமது அப்போஸ்தலப் பணியை உறுதிப்படுத்தும் சான்று என்று பவுல் வலியுறுத்துகிறார்.
  alternative: பவுல் கொரிந்தியர்களுக்கு மட்டுமே வரையறுக்கப்பட்ட பொருளில் அப்போஸ்தலன் என்று கூறுகிறார்.
  rationale: வசனத்தின் நிபந்தனை அமைப்பும் தற்காப்பு வாதமும் பவுலின் பணியை ஒரு சபைக்கு மட்டும் வரையறுப்பதில்லை; கொரிந்தியச் சபையின் இருப்பையே அவரது உரிமைக்கான உறுதிப்படுத்தலாக முன்வைக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலன்’ என்ற பரவலாக அறியப்பட்ட தொழில்நுட்பச் சொல் வைக்கப்பட்டு, ‘அப்போஸ்தலப் பணி’ மூலம் ἀποστολή என்பதன் பணி/அழைப்பு சார்ந்த பரப்பும் வெளிப்படுத்தப்பட்டுள்ளது.
