source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: ta
  text: அல்லது, அவர் நிச்சயமாகவே நமக்காக இதைச் சொல்கிறாரா? ஆம்[a], இது நமக்காகவே எழுதப்பட்டது. ஏனெனில், உழுகிறவர் நம்பிக்கையோடு உழ வேண்டும்; கதிரடிக்கிறவர் பங்குபெறும் நம்பிக்கையோடு கதிரடிக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிச்சயமாகவே” என்பதற்குப் பதிலாக “முற்றிலும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினையடை இந்த வினாவை வலுப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “பங்குபெறும் நம்பிக்கையோடு.” எதில் பங்குபெறுவது என்பது கிரேக்கத்தில் கூறப்படவில்லை; வேளாண் சூழலில் அது விளைச்சலைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντως
  choice: முழுக்க முழுக்க
  rationale: வினாவை வலுப்படுத்தும் கிரேக்க வினையடையின் முழுமை சார்ந்த பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘நிச்சயமாக’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் மாற்றுப் பொருள் தரப்படுகிறது.
- source_word: δι’ ἡμᾶς
  choice: நமக்காக
  rationale: διά + குற்றுவேற்றுமையின் பயன் அல்லது நிமித்தம் சார்ந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐγράφη
  choice: எழுதப்பட்டது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; வேதவாக்கைக் குறிக்கும் சூழலிலும் இயல்பாக உள்ளது.
- source_word: ὀφείλει
  choice: வேண்டும்
  rationale: கடமை அல்லது முறையான எதிர்பார்ப்பைத் தெரிவிக்கிறது; கட்டாயத்தை அளவுக்கு மீறி வலியுறுத்துவதில்லை.
- source_word: ἐπ’ ἐλπίδι
  choice: நம்பிக்கையோடு
  rationale: உழைப்பைத் தூண்டும் எதிர்பார்ப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: உழுகிறவர் ... உழ வேண்டும்
  rationale: பெயரெச்சத் தொடரையும் வினைச்சொல் இணைப்பையும் காத்து, பொதுவான உழைப்பாளியைக் குறிக்கிறது.
- source_word: ὁ ἀλοῶν
  choice: கதிரடிக்கிறவர்
  rationale: தானியத்தைப் பிரிக்கும் வேளாண் செயலைக் குறிக்கும் ἀλοάω என்பதற்கான தெளிவான, வழக்கிலுள்ள தமிழ் சொல்.
- source_word: τοῦ μετέχειν
  choice: பங்கு கிடைக்கும்
  rationale: ‘பங்குபெறுதல்’ என்ற கருத்தை இயல்பான தமிழில் தருகிறது; எதில் பங்கு என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாததால் அதை முதன்மை உரையில் நிரப்பவில்லை.
theological_decisions:
- issue: πάντως என்பதின் வலியுறுத்தல்
  choice: முழுக்க முழுக்க
  alternative: நிச்சயமாக / முற்றிலும்
  rationale: சொல் வினாவின் முழுமை சார்ந்த வலியுறுத்தலாகவோ உறுதிப்படுத்தும் வினையடையாகவோ புரியலாம். முதன்மை உரை முதல் சாத்தியத்தைப் பின்பற்றுகிறது; மற்ற சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
- issue: τοῦ μετέχειν என்பதன் மறைந்துள்ள பொருள்
  choice: பங்கு கிடைக்கும்
  alternative: விளைச்சலில் பங்குபெறுதல்
  rationale: கிரேக்கம் பங்கின் பொருளை வெளிப்படையாகச் சொல்லவில்லை. வேளாண் சூழல் விளைச்சலை உணர்த்தினாலும், genuine ambiguity-ஐக் காக்க முதன்மை உரையில் ‘விளைச்சல்’ சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதைமிக்க நடை. ‘உழுகிறவர் / கதிரடிக்கிறவர்’ என்ற இணை அமைப்பு கிரேக்கத்தின் ஒப்புமையைப் பேணுகிறது. மறைந்துள்ள ‘விளைச்சல்’ என்பதை உரையில் சேர்க்காமல் அடிக்குறிப்பில் விளக்குவதன் மூலம் மூலத்தின் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
