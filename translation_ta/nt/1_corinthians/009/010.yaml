    issue: πάντως is rendered ‘முழுக்க முழுக்க’.
    rationale: 'This can imply that the text speaks wholly/exclusively for ‘us.’ In context πάντως more plausibly supplies rhetorical certainty: ‘certainly/indeed.’ The English audit trail records an alternative interpretive decision, but source fidelity and idiomatic Tamil favor ‘நிச்சயமாகவே.’'
  - severity: medium
    issue: ‘பங்கு கிடைக்கும்’ renders τοῦ μετέχειν.
    rationale: The Greek infinitive means ‘to share/participate,’ whereas ‘பங்கு கிடைக்கும்’ makes the action passive (‘a share will be received’). ‘பங்குபெறும்’ preserves the active sense and leaves the object unstated, as in Greek.
