    reason: κατὰ ἄνθρωπον என்ற கிரேக்கச் சொற்றொடருக்கான இயல்பான மாற்று மொழிபெயர்ப்புகள்.
lexical_decisions:
- source_word: Μὴ
  choice: சொல்கிறேனா?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவை, தமிழில் சூழலால் இயல்பாக உணர்த்தும் வினா வடிவில் மொழிபெயர்க்கிறது; அடுத்துள்ள ‘அல்லது ... சொல்லவில்லையா?’ என்ற எதிர்மறை வினா அதன் நோக்கத்தை மேலும் தெளிவாக்குகிறது.
- source_word: κατὰ ἄνθρωπον
  choice: வெறும் மனிதக் கண்ணோட்டத்திலிருந்து
  rationale: மனிதராகப் பேசுவதை அல்ல, மனித அடிப்படையிலான பார்வையை மட்டும் சார்ந்து பேசுவதைக் குறிக்கும் சொற்றொடர்; திருச்சட்டத்தின் சாட்சியுடன் உள்ள வேறுபாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ταῦτα
  choice: இவற்றை / இவற்றையே
  rationale: முந்தைய வசனங்களில் பவுல் முன்வைத்த கருத்துகளைச் சுட்டும் பன்மை வடிவைப் பாதுகாக்கிறது; இரண்டாம் இடத்தில் ‘-ஏ’ ஒட்டு அதே கருத்துகளைத் திருச்சட்டமும் கூறுகிறது என்ற இணைப்பைத் தெளிவாக்குகிறது.
- source_word: λαλῶ
  choice: சொல்கிறேனா
  rationale: பவுல் தற்போது முன்வைக்கும் வாதத்தைக் குறிக்கும் நிகழ்காலத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἢ
  choice: அல்லது
  rationale: மனிதக் கண்ணோட்டம் மட்டுமே ஆதாரமா, திருச்சட்டமும் சாட்சி தருகிறதா என்ற மாற்று வினாவை அறிமுகப்படுத்துகிறது.
- source_word: καὶ
  choice: திருச்சட்டமும்
  rationale: ‘-உம்’ என்ற இணைப்பு, மனித பகுத்தறிவோடு திருச்சட்டமும் கூடுதல் சாட்சியாக இருப்பதை இயல்பாகக் காட்டுகிறது.
- source_word: ὁ νόμος
  choice: திருச்சட்டம்
  rationale: அடுத்த வசனத்தில் மேற்கோள் காட்டப்படும் உபாகமச் சட்டத்தை முன்னிட்டு, பொதுவான சட்டத்தை அல்ல மோசேயின் சட்டம் என்னும் வேதப்பகுதியைக் குறிக்கிறது.
- source_word: οὐ λέγει
  choice: சொல்லவில்லையா?
  rationale: உடன்பாடான பதிலை எதிர்பார்க்கும் கிரேக்க எதிர்மறை வினா அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘ὁ νόμος’ என்பதன் குறிப்பு
  choice: மோசேயின் திருச்சட்டம் எனப் புரியும்படி ‘திருச்சட்டம்’
  alternative: பொதுவான விதி அல்லது சட்டம் எனப் புரியக்கூடிய ‘சட்டம்’
  rationale: உடனடியான அடுத்த வசனம் உபாகமம் 25:4-ஐ மேற்கோள் காட்டுவதால், இங்கு குறிக்கப்படுவது வேதத்தின் திருச்சட்டப் பகுதியே; இதற்கு மேல் எந்தக் கோட்பாட்டுச் சிறப்புரையும் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
- issue: மனித வாதத்துக்கும் வேத அதிகாரத்துக்கும் இடையிலான உறவு
  choice: ‘வெறும்’ என்பதன் மூலம் மனிதக் கண்ணோட்டம் மட்டுமே ஆதாரம் என்ற கருத்தை மறுக்கும் வினாவாக வைத்தல்
  alternative: மனித சிந்தனைக்கு எந்த மதிப்பும் இல்லை என்று முழுமையாக மறுப்பதாக மொழிபெயர்த்தல்
  rationale: κατὰ ἄνθρωπον என்ற சொற்றொடரும் அடுத்துள்ள திருச்சட்டச் சாட்சியும், பவுலின் கருத்து மனித அடிப்படையை மட்டும் சார்ந்ததல்ல என்பதைக் காட்டுகின்றன; மனித பகுத்தறிவையே முற்றிலும் நிராகரிப்பதாக உரையை வலுப்படுத்தக் கூடாது.
translation_notes:
  register: நவீனத் தரமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் இரண்டு தொடர்புடைய வினாக்களும் ‘அல்லது’ மூலம் இணைக்கப்பட்டுள்ளன; வாதத்தின் சொல்லாட்சியும் திருச்சட்டத்தின் சாட்சியும் இடையிலான பதற்றம் தீர்த்துவிடப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
