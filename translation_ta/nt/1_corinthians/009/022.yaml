- from: பலவீனருக்கு நான் பலவீனனானேன்[a]; பலவீனரை ஆதாயப்படுத்திக்கொள்வதற்காக. எல்லாருக்கும் நான் எல்லாமானேன்; எப்படியாவது சிலரை மீட்பதற்காக[b].
  to: பலவீனருக்குப் பலவீனனானேன்[a], பலவீனரை வென்றுகொள்வதற்காக; எல்லாருக்கும் எல்லாமாகியிருக்கிறேன்; எப்படியாவது[b] சிலரை மீட்பதற்காக.
  rationale: The revision replaces an unnatural rendering of κερδαίνω with an idiomatic Tamil expression for winning people over, more clearly represents the Greek perfect γέγονα, and moves footnote b to the word it explains. It retains the source text’s rhetorical repetition, broad ambiguity concerning ‘the weak,’ and salvation language.
