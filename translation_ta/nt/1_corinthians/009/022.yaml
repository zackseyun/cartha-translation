  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: ta
  text: பலவீனருக்குப் பலவீனனானேன்[a], பலவீனரை வென்றுகொள்வதற்காக; எல்லாருக்கும் எல்லாமாகியிருக்கிறேன்; எப்படியாவது[b] சிலரை மீட்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனச்சாட்சியில் பலவீனமானவர்களுக்கு நான் பலவீனனானேன்.’ 1 கொரிந்தியரில் ‘பலவீனர்’ என்பது எளிதில் புண்படும் மனச்சாட்சியுடையவர்களைச் சிறப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘எப்படியாவது’ என்பதற்கு ‘எல்லா வகையிலும்’ என்றும் மொழிபெயர்க்கலாம்; இலக்கை அடைய இயன்ற வழிகளையெல்லாம் பயன்படுத்துவதை இச்சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: நான் பலவீனனானேன்
  rationale: γίνομαι என்பதன் இறந்தகால வடிவம், பவுல் ஊழியச் சூழல்களில் தன்னைத் தகவமைத்துக்கொண்ட செயலைக் குறிக்கிறது; ‘ஆனேன்’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: பலவீனருக்கு / பலவீனனானேன் / பலவீனரை
  rationale: மூலமொழியில் மூன்று முறை வரும் சொல்லின் மீளுரையைத் தமிழிலும் ‘பலவீனம்’ என்ற ஒரே சொல்வேரால் காத்துள்ளது. மனச்சாட்சியில் பலவீனமானவர்களை இது உள்ளடக்கலாம்; ஆனாலும் முதன்மை உரையில் பொருளை அவ்வளவாகக் குறுக்கவில்லை.
- source_word: κερδήσω
  choice: ஆதாயப்படுத்திக்கொள்வதற்காக
  rationale: κερδαίνω என்பதன் அடிப்படை ‘ஆதாயமாகப் பெறுதல்’; இங்கு மனிதர்களை நற்செய்திக்காக வென்றெடுக்கும் நோக்கம். ‘ஆதாயப்படுத்திக்கொள்’ உருவகத்தையும் பவுலின் நோக்கத்தையும் காக்கிறது.
- source_word: τοῖς πᾶσιν
  choice: எல்லாருக்கும்
  rationale: கிரேக்கத்தில் மனிதர்களைக் குறிக்கும் பன்மை தத்திவ வேற்றுமை; தமிழில் ‘எல்லாருக்கும்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: γέγονα
  choice: நான் எல்லாமானேன்
  rationale: நிறைவுக்கால வடிவம் உருவான நிலையின் தொடர்ச்சியை உணர்த்துகிறது. தமிழில் இயல்பான ‘ஆனேன்’ காலநுட்பத்தை முழுமையாக வேறுபடுத்தாவிட்டாலும், சூழலில் நிலையான ஊழிய அணுகுமுறையைத் தெரிவிக்கிறது.
- source_word: πάντα
  choice: எல்லாம்
  rationale: ‘எல்லாருக்கும் எல்லாம்’ என்பது மூலத்தின் சுருக்கமான, விரிவான சொல்லாட்சியையும் ஒத்திசைவையும் காக்கிறது.
- source_word: πάντως
  choice: எப்படியாவது
  rationale: இலக்கை அடைய இயன்ற பல வழிகளையும் முயல்வதை இயல்பான தமிழில் குறிக்கிறது; நெறியற்ற சமரசம் கட்டாயமாக உட்பொருளாகாது.
- source_word: τινὰς
  choice: சிலரை
  rationale: பவுல் அனைவரையும் குறித்து உரிமைகோராமல், சிலரை என்று அளவோடு கூறும் தன்மையைப் பாதுகாக்கிறது.
- source_word: σώσω
  choice: மீட்பதற்காக
  rationale: σῴζω இங்கு இரட்சிப்பு சார்ந்த பொருளைக் கொண்டது. நவீன தமிழில் ‘மீட்பு’ தெய்வீக இரட்சிப்பையும் அழிவிலிருந்து காப்பதையும் இயல்பாகத் தாங்குகிறது; பவுலின் கருவிசார் பங்கை உரை கூறும் வலிமையோடு விடுகிறது.
theological_decisions:
- issue: ‘பலவீனர்’ என்பதன் சூழல்சார் பொருள்
  choice: முதன்மை உரையில் ‘பலவீனர்’ என்று விரிவாகவே மொழிபெயர்த்தல்.
  alternative: ‘மனச்சாட்சியில் பலவீனமானவர்கள்’ அல்லது ‘வலிமையற்றவர்கள்’.
  rationale: 1 கொரிந்தியர் 8–10 அதிகாரங்களில் மனச்சாட்சியின் பலவீனம் முக்கியமான சூழலாக இருந்தாலும், இவ்வசனத்தின் சொல் பொதுவாகவும் சுற்றியுள்ள மக்கள் குழுக்களுக்கு இணையாகவும் உள்ளது. குறிப்பிட்ட விளக்கத்தை முதன்மை உரைக்குள் புகுத்தாமல் அடிக்குறிப்பில் தருவது ambiguity-ஐ காக்கிறது.
- issue: ‘மீட்பேன்’ என்ற வினையின் வலிமையும் செயற்பாட்டாளரும்
  choice: பவுலின் நோக்கத்தை ‘சிலரை மீட்பதற்காக’ என்று நேரடியாக வைத்தல்.
  alternative: ‘சிலர் மீட்பட உதவுவதற்காக’ அல்லது ‘இரட்சிப்புக்குள் கொண்டுவருவதற்காக’.
  rationale: σῴζω உண்மையான இரட்சிப்பு மொழி; அதை ‘உதவுதல்’ என்று மெலிதாக்குவது மூலத்தின் வலிமையைக் குறைக்கும். அதேவேளை, சூழல் பவுலை இறுதி இரட்சகராக அல்ல, நற்செய்திப் பணியில் கருவியாகக் காட்டுகிறது; அந்த இறையியல் விளக்கத்தை வினைக்குள் சேர்க்காமல் உரையின் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: πάντως என்பதன் எல்லை
  choice: ‘எப்படியாவது’ என்று மொழிபெயர்த்து, இயன்ற பல வழிகளைப் பயன்படுத்தும் நோக்கத்தைச் சுட்டுதல்.
  alternative: ‘எல்லா வகையிலும்’ அல்லது ‘என்ன விலை கொடுத்தாவது’.
  rationale: ‘என்ன விலை கொடுத்தாவது’ நெறியற்ற சமரசத்தையும் சுட்டக்கூடும்; அது கிரேக்கத்தால் கட்டாயப்படுத்தப்படவில்லை. ‘எப்படியாவது’ முயற்சியின் பரப்பைத் தருகிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. ‘எல்லாருக்கும் நான் எல்லாமானேன்’ என்ற சொற்றொடர் கிரேக்கத்தின் ஒத்திசைவும் கூர்மையும் காக்கப்படுகிறது. ‘ஆதாயப்படுத்திக்கொள்’ சற்றே இலக்கியத் தன்மை கொண்டாலும் 9:19–22 முழுவதும் திரும்ப வரும் κερδαίνω உருவகத்தை ஒரேமையாகக் காக்க உதவுகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
