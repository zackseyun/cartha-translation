lexical_decisions:
- source_word: οὕτως
  choice: அவ்வாறே
  rationale: முந்தைய எடுத்துக்காட்டுகளோடு ஒப்புமையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ
  choice: ஆண்டவரும்
  rationale: கிரேக்கத்தில் உள்ள சேர்க்கை வலியுறுத்தலைத் தமிழின் ‘-உம்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான நிலையான, மரியாதைக்குரிய தமிழ் இணை; உரையில் இல்லாத ‘இயேசு’ என்பதைச் சேர்க்காமல் மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: διέταξεν
  choice: கட்டளையிட்டார்
  rationale: வெறும் அறிவுறுத்தலை அல்ல, அதிகாரப்பூர்வமான ஆணையை இச்சூழலில் குறிக்கிறது.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: அறிவிக்கிறவர்கள்
  rationale: பெயர்ச்சொல் செயல்பாட்டிலுள்ள பங்கேற்புச் சொல்லை இயல்பான தமிழில் தருவதோடு, செய்தியைப் பொதுவாகப் பிரகடனப்படுத்தும் பொருளையும் காக்கிறது.
- source_word: τὸ εὐαγγέλιον
  choice: நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் பொருளைத் தெளிவாகவும் இன்றைய வாசகர்களுக்கு எளிதாகவும் வழங்குகிறது.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: நற்செய்தியால்
  rationale: நற்செய்தியோடு தொடர்புடைய பணியிலிருந்து வாழ்வாதாரம் கிடைப்பதைச் சுருக்கமாகக் குறிக்கிறது; அதேவேளையில் மூலத்தின் செறிவான சொல்லாட்சியை மிகையாக விரிவாக்கவில்லை.
- source_word: ζῆν
  choice: வாழ வேண்டும்
  rationale: கட்டளையின் நெறிப்படுத்தும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பவரின் குறிப்பு
  choice: உரையில் உள்ளபடியே ‘ஆண்டவர்’ என்று வைத்தல்; சூழலில் இது இயேசுவைக் குறிப்பதாக அதிக வாய்ப்புள்ளது
  alternative: ‘ஆண்டவராகிய இயேசு’ என்று வெளிப்படையாக விரிவாக்குதல் அல்லது பொதுவான தெய்வீகக் குறிப்பாகப் புரிதல்
  rationale: பவுலின் வாதத்தில் இயேசுவின் போதனை சுட்டப்படுவது இயல்பான புரிதல் என்றாலும், மூல உரை ‘ஆண்டவர்’ என்று மட்டுமே கூறுவதால் மொழிபெயர்ப்பு கூடுதல் பெயரைச் சேர்க்கவில்லை.
- issue: ‘நற்செய்தியால் வாழுதல்’ குறிக்கும் ஆதரவு
  choice: நற்செய்தியை அறிவிக்கும் பணியோடு தொடர்புடைய பொருளாதார வாழ்வாதாரம்
  alternative: நற்செய்தியிலிருந்து கிடைக்கும் ஆவிக்குரிய வாழ்வு
  rationale: சுற்றியுள்ள பகுதி ஊழியம் செய்பவர்கள் பொருளாதார ஆதரவு பெறும் உரிமையைப் பற்றியது. இருப்பினும், மூலத்தின் சுருக்கமான சொல்லாட்சியைப் பாதுகாக்க பிரதான உரையில் பொருளை மிகையாக விரிவாக்காமல், மாற்று விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவ்வாறே’ முந்தைய வாதத்துடனான தொடர்பைக் காக்கிறது; ‘நற்செய்தியால் வாழ வேண்டும்’ மூலத்தின் செறிவையும் சூழலின் வாழ்வாதாரப் பொருளையும் சமநிலைப்படுத்துகிறது.
