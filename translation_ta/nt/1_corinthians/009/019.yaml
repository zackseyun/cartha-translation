id: 1CO.9.19
reference: 1 Corinthians 9:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: ta
  text: ஏனெனில், நான் எல்லாரிடமிருந்தும் சுதந்திரமானவனாக இருந்தாலும், அதிகமானவர்களை வென்றெடுக்கும்படி எல்லாருக்கும் என்னையே அடிமையாக்கிக்கொண்டேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாருக்கும் என்னையே பணியாளனாக்கிக்கொண்டேன்.” கிரேக்கச் சொல் அடிமைத்தனத்தைக் குறிக்கும் வலிமையான மொழியைப் பயன்படுத்துகிறது; ‘சுதந்திரமானவன்’ என்பதுடனான முரணைக் காக்க முதன்மை உரையில் “அடிமையாக்கிக்கொண்டேன்” என்று தரப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλεύθερος … ἐκ πάντων
  choice: எல்லாரிடமிருந்தும் சுதந்திரமானவனாக
  rationale: யாருடைய கட்டுப்பாட்டிற்கும் உரிமைக்கோரலுக்கும் உட்படாத நிலையைத் தெரிவிக்கிறது; பின்னர் வரும் அடிமைத்தன உருவகத்துடனான முரணையும் காக்கிறது.
- source_word: πᾶσιν
  choice: எல்லாருக்கும்
  rationale: தன்னை யாருக்கு அடிமையாக்கிக்கொண்டார் என்பதைக் காட்டும் வேற்றுமையை இயல்பான தமிழில் தருகிறது; ‘எல்லாரிடமிருந்தும்—எல்லாருக்கும்’ என்ற இணை அமைப்பையும் பேணுகிறது.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: என்னையே அடிமையாக்கிக்கொண்டேன்
  rationale: δουλόω என்பதிலுள்ள அடிமைத்தனத்தின் வலிமையான உருவகத்தையும், இது பவுல் தாமாக ஏற்றுக்கொண்ட தாழ்ப்படுத்தல் என்பதையும் காக்கிறது.
- source_word: τοὺς πλείονας
  choice: அதிகமானவர்களை
  rationale: ‘கூடுமானவரை அனைவரையும்’ என்று மிகைப்படுத்தாமல், அதிக எண்ணிக்கையிலான மக்களைக் குறிக்கும் ஒப்பீட்டுப் பொருளைப் பேணுகிறது.
- source_word: κερδήσω
  choice: வென்றெடுக்கும்படி
  rationale: மக்களை உருவகமாகப் ‘பெறுதல்’ அல்லது ‘ஆதாயமாக்குதல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; யாருக்காக வென்றெடுக்கிறார் என்பதை மூலத்தில் இல்லாமல் சேர்ப்பதில்லை.
theological_decisions:
- issue: δουλόω என்ற அடிமைத்தன மொழியின் மொழிபெயர்ப்பு
  choice: அடிமையாக்கிக்கொண்டேன்
  alternative: பணியாளனாக்கிக்கொண்டேன்
  rationale: ‘சுதந்திரமானவன்’ என்பதற்கு எதிராகப் பவுல் திட்டமிட்டு பயன்படுத்தும் அடிமைத்தன உருவகம் இவ்வசனத்தின் வாதத்திற்கு மையமானது. ‘பணியாளன்’ என்பது அந்த முரணின் வலிமையைக் குறைக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘எல்லாரிடமிருந்தும்—எல்லாருக்கும்’ என்ற கிரேக்க இணை அமைப்பும், ‘சுதந்திரம்—அடிமைத்தனம்’ என்ற மைய முரணும் பாதுகாக்கப்பட்டுள்ளன.
