id: 1CO.9.15
reference: 1 Corinthians 9:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: ta
  text: ஆனால், இவற்றில் எதையும் நான் பயன்படுத்திக்கொள்ளவில்லை[a]. எனக்கு இப்படிச் செய்யப்பட வேண்டும் என்பதற்காகவும் இவற்றை நான் எழுதவில்லை. ஏனெனில், நான் சாவதே எனக்கு மேல்; அதை விட— என் பெருமையை யாரும் வெறுமையாக்க மாட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சூழலை வெளிப்படையாகக் கூறினால்: “இந்த உரிமைகளில் எதையும்.”'
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “விட—” என்பதற்குப் பின் வாக்கியம் முறிந்து, பின்னர் “என் பெருமையை யாரும் வெறுமையாக்க மாட்டார்கள்” என்று மீண்டும் தொடங்குகிறது. பொருளைச் சீராக்கி, “என் பெருமையை யாராவது வெறுமையாக்குவதைவிட நான் சாவதே மேல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: பயன்படுத்திக்கொள்ளவில்லை
  rationale: முன்பு விவரிக்கப்பட்ட உரிமைகளைத் தனக்காகப் பயன்படுத்திக்கொள்ளாத நிலையை நிறைவேற்றுக் கால வடிவம் சுட்டுகிறது. ‘பயன்படுத்திக்கொள்’ என்பது தவறாகப் பயன்படுத்துதல் என்ற எதிர்மறை நிழற்பொருளைச் சேர்க்காமல் நடுத்தர வினையின் தன்நலப் பயன்பாட்டு நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐδενὶ τούτων
  choice: இவற்றில் எதையும்
  rationale: கிரேக்கச் சொற்றொடரின் பொதுவான சுட்டைத் தக்கவைத்து, முந்தைய சூழலில் கூறப்பட்ட ஆதரவு பெறும் உரிமைகளைக் குறிக்கிறது. விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔγραψα ... ταῦτα
  choice: இவற்றை நான் எழுதவில்லை
  rationale: இறந்தகாலச் செயலை நவீன தமிழில் இயல்பாகக் கூறுகிறது; ‘இவை’ முந்தைய விவாதத்தைச் சுட்டுகிறது.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: எனக்கு இப்படிச் செய்யப்பட வேண்டும் என்பதற்காக
  rationale: ἵνα என்பதன் நோக்கப் பொருளையும், பவுல் தனக்காக அந்த ஏற்பாட்டைப் பெற எழுதவில்லை என்ற சுருக்கமான கிரேக்கப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: நான் சாவதே எனக்கு மேல்
  rationale: ‘நான் சாவதையே விரும்புவேன்’ என்று உளவியல் விருப்பமாக மட்டும் மாற்றாமல், ‘எனக்கு மேல்’ என்ற கிரேக்க மதிப்பீட்டையும் μᾶλλον தரும் ஒப்பீட்டையும் தக்கவைக்கிறது.
- source_word: τὸ καύχημά μου
  choice: என் பெருமை
  rationale: καύχημα இங்கு பெருமைப்படுவதற்கான காரணம் அல்லது ஆதாரத்தையும் குறிக்கலாம். ‘என் பெருமை’ சுருக்கமாகவும் தமிழில் இயல்பாகவும் இருந்து அந்த இரு நுணுக்கங்களையும் முழுமையாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: κενώσει
  choice: வெறுமையாக்க மாட்டார்கள்
  rationale: κενόω என்பதன் ‘வெறுமையாக்கு’ உருவகத்தைத் தக்கவைக்கிறது; இச்சூழலில் அவரது பெருமையைப் பொருளற்றதாக்குதல் அல்லது செல்லாததாக்குதல் என்ற கருத்தைத் தருகிறது.
theological_decisions:
- issue: ἤ என்பதற்குப் பின் வரும் முறிந்த வாக்கிய அமைப்பு
  choice: ‘விட—’ என்ற இடைமுறிவையும், பின்னர் ‘என் பெருமையை யாரும் வெறுமையாக்க மாட்டார்கள்’ என்ற மீள்தொடக்கத்தையும் முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘யாராவது என் பெருமையை வெறுமையாக்குவதைவிட நான் சாவதே மேல்’ என்று இலக்கணமாகச் சீராக்குதல்
  rationale: மூலத்தில் ἤ (‘விட’) என்பதற்குப் பின் ஒப்பீடு முடிக்கப்படாமல் வாக்கியம் முறிந்து, புதிய முழுக் கூற்றாகத் தொடர்கிறது. அந்த உணர்ச்சி தீவிரத்தையும் உண்மையான இலக்கணத் தடுமாற்றத்தையும் மொழிபெயர்ப்பு மறைக்கக்கூடாது.
translation_notes:
  register: நவீன தரத் தமிழில் மரியாதையும் உணர்ச்சி வலிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பயன்படுத்திக்கொள்ளவில்லை’, ‘எனக்குச் செய்யப்பட வேண்டும்’ போன்ற வடிவங்கள் சாதாரண வாசகர்களுக்குப் புரியும்படி உள்ளன. மூலத்தின் முறிந்த தொடரை நீண்ட கோட்டால் வெளிப்படுத்தி, அதைச் சீராக்காமல் பாதுகாத்துள்ளோம்.
