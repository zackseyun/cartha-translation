    rationale: ‘யாராவது என் பெருமையை வெறுமையாக்குவதைவிட— என் பெருமையை யாரும் வெறுமையாக்க மாட்டார்கள்’ imports the very completion that the Greek leaves unsaid, while also retaining the restart. The source breaks off immediately after ἤ ('than—').
