reference: 1 Corinthians 9:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ τοίνυν οὕτως τρέχω ὡς οὐκ ἀδήλως, οὕτως πυκτεύω ὡς οὐκ ἀέρα δέρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/026.yaml
  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: ta
  text: 'ஆகவே, நான் இவ்வாறே ஓடுகிறேன்: நோக்கமின்றி[a] அல்ல; இவ்வாறே குத்துச்சண்டை போடுகிறேன்: காற்றை அடிப்பவனைப் போல அல்ல.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தெளிவில்லாமல்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினையடை தெளிவின்மையையோ திட்டவட்டமான குறிக்கோள் இல்லாமையையோ குறிக்கலாம்; ஓட்டப்பந்தய உருவகத்தில் “நோக்கமின்றி” என்பது தெளிவான இலக்கு இல்லாமல் ஓடுவதைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: ஆகவே
  rationale: முந்தைய விளையாட்டு உவமையிலிருந்து பவுலின் தனிப்பட்ட செயல்பாட்டுக்கு வரும் முடிவுசார் மாற்றத்தைக் காட்டுகிறது.
- source_word: οὕτως
  choice: தெளிவான நோக்கத்துடன் / குறிபார்த்து
  rationale: இருமுறை வரும் சொல்லின் செய்முறை சார்ந்த வலியுறுத்தலை, ஒவ்வொரு விளையாட்டு உருவகத்துக்கும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τρέχω
  choice: ஓடுகிறேன்
  rationale: முந்தைய வசனங்களின் ஓட்டப்பந்தய உருவகத்தையும் நிகழ்காலத் தன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἀδήλως
  choice: குறிக்கோளின்றி
  rationale: ஓட்டப்பந்தயச் சூழலில் தெளிவான இலக்கு அல்லது திசை இல்லாத செயலை இயல்பாகக் குறிக்கிறது; தெளிவின்மை என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πυκτεύω
  choice: குத்துச்சண்டை போடுகிறேன்
  rationale: பொதுவான சண்டையைக் காட்டிலும் குறிப்பாகக் குத்துச்சண்டையைக் குறிக்கும் கிரேக்கச் சொல்லைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: ἀέρα δέρων
  choice: காற்றை அடிக்கிறவனைப் போல
  rationale: பலனின்றி குத்துவதைச் சித்தரிக்கும் கிரேக்க உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், விளையாட்டு உருவகங்கள் சாதாரண வாசகருக்குத் தெளிவாக இருக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளன. கிரேக்கத்தின் இணை அமைப்பு ‘...போல அல்ல’ என்ற இரட்டை வடிவில் பாதுகாக்கப்பட்டுள்ளது; அதேவேளை οὕτως என்பதன் பொருள் தமிழில் இயல்பாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
