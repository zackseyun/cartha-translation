id: 1CO.9.13
reference: 1 Corinthians 9:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: ta
  text: பரிசுத்தச் சேவை செய்கிறவர்கள் ஆலயத்திலிருந்து கிடைப்பவற்றை உண்கிறார்கள்[a]; பலிபீடத்தில் சேவை செய்கிறவர்கள் பலிபீடத்திலிருந்து தங்கள் பங்கைப் பெறுகிறார்கள்[b] என்பதை நீங்கள் அறியவில்லையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, ‘பரிசுத்தமான காரியங்களில் பணியாற்றுகிறவர்கள் ஆலயத்திலிருந்து வரும் பொருட்களை உண்கிறார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, ‘பலிபீடத்தின் அருகில் சேவை செய்கிறவர்கள் பலிபீடத்தோடு பங்குபெறுகிறார்கள்’; அதாவது, அங்கே செலுத்தப்படும் பலிகளிலிருந்து தங்கள் பங்கைப் பெறுகிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாதா?
  rationale: பவுல் வழக்கமாகப் பயன்படுத்தும் எதிர்பார்க்கப்பட்ட விடையைக் கொண்ட வினா வடிவத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: பரிசுத்தப் பணிகளைச் செய்கிறவர்கள்
  rationale: τὰ ἱερά என்பதன் ‘பரிசுத்தமானவை’ என்ற சொற்பொருளையும், சூழலில் அது குறிக்கும் ஆலயச் சேவையையும் இணைத்துக் காட்டுகிறது; ‘ஆலய ஊழியர்கள்’ என்று நிறுவனப் பொருளை மட்டும் முன்வைப்பதைத் தவிர்க்கிறது.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: ஆலயத்திலிருந்து கிடைப்பவற்றை உண்கிறார்கள்
  rationale: ἐσθίουσιν என்பதன் நேரடியான ‘உண்கிறார்கள்’ என்ற உருவகத்தைப் பாதுகாத்து, τὰ ἐκ τοῦ ἱεροῦ என்பதிலுள்ள பொருட்களைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἱεροῦ
  choice: ஆலயம்
  rationale: ἱερόν இங்கு உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் ஆலய வளாகம் அல்லது ஆலய அமைப்பைக் குறிப்பதால், பொதுவாகப் புரியும் ‘ஆலயம்’ பொருத்தமானது.
- source_word: παρεδρεύοντες
  choice: பணிபுரிகிறவர்கள்
  rationale: பலிபீடத்தின் அருகில் நியமிக்கப்பட்டு சேவை செய்வதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: θυσιαστηρίῳ
  choice: பலிபீடம்
  rationale: பலிகள் செலுத்தப்படும் altar என்பதற்கான துல்லியமான, வழக்கமான தமிழ் சொல்.
- source_word: συμμερίζονται
  choice: பங்கு பெறுகிறார்கள்
  rationale: ஒரு பங்கைப் பகிர்ந்து பெறுதல் அல்லது பங்குகொள்ளுதல் என்ற வினையின் மையப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பரிசுத்தச் சேவையிலிருந்து வாழ்வாதாரம் பெறுதல்
  choice: ஆலயப் பணியாளர்கள் ஆலயத்திலிருந்து கிடைப்பவற்றை உண்பதும், பலிபீடப் பணியாளர்கள் அதற்குரியவற்றில் பங்கு பெறுவதும் என மொழிபெயர்க்கப்பட்டது.
  alternative: இறுதி சொற்றொடரைச் சொற்படி ‘பலிபீடத்துடன் பங்குபெறுகிறார்கள்’ என்று மொழிபெயர்த்தல்.
  rationale: பரிசுத்தச் சேவை செய்கிறவர்கள் அந்தச் சேவையோடு தொடர்புடைய பலிப்பொருட்களிலிருந்து பங்கு பெறுகின்றனர் என்ற பவுலின் ஒப்புமையைத் தெளிவாக்குகிறது; அதேவேளையில் பிற்காலத் திருச்சபைப் பதவிகளையோ குறிப்பிட்ட ஊழிய அமைப்பையோ வசனத்திற்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பரிசுத்தப் பணிகள்,’ ‘ஆலயம்,’ ‘பலிபீடம்’ ஆகிய சொற்கள் வழிபாட்டுச் சூழலைத் தெளிவாக வைத்திருக்கின்றன; வினா வடிவம் பவுலின் வாதத் தொனியைப் பாதுகாக்கிறது.
