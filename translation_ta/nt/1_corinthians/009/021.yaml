base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: ta
  text: சட்டத்தின் கீழ் இல்லாதவர்களுக்கு, சட்டத்தின் கீழ் இல்லாதவனைப்போல் ஆனேன்[a]—நான் கடவுளின் சட்டத்துக்கு அப்பாற்பட்டவன் அல்ல, மேசியாவின் சட்டத்துக்கு உட்பட்டவன் என்றாலும்[b]—சட்டத்தின் கீழ் இல்லாதவர்களை வென்றெடுக்கும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சட்டமில்லாதவனைப்போல்’ என்றும் மொழிபெயர்க்கலாம். இங்கு மோசேயின் சட்டத்தின் கீழ் இல்லாதவர்களே குறிக்கப்படுகிறார்கள்; ஒழுக்கமற்றவர்கள் என்று அவசியமாகப் பொருளல்ல.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘மேசியாவின் சட்டத்துக்குள் இருப்பவன்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: சட்டத்தின் கீழ் இல்லாதவர்கள் / சட்டத்தின் கீழ் இல்லாதவன்
  rationale: இச்சூழலில் இச்சொல் ஒழுக்கக்கேடானவர்களைக் குறிப்பதல்ல; மோசேயின் சட்டத்தின் கீழ் இல்லாதவர்களைக் குறிக்கிறது. மூன்று இடங்களிலும் ஒரே கருத்தைத் தொடர்ந்து காட்டும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: ὡς
  choice: …போல்
  rationale: பவுல் தன்னை முற்றிலும் சட்டமற்றவனாக்கிக்கொண்டார் என்று அல்லாமல், அவர்களோடு பழகிய விதத்தை இது குறிக்கிறது.
- source_word: μὴ ὢν
  choice: அப்பாற்பட்டவன் அல்ல
  rationale: முந்தைய கூற்றை வரையறுக்கும் மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔννομος
  choice: உட்பட்டவன்
  rationale: ஒரு சட்டத்தின் ஆளுகைக்குள் அல்லது அதற்குக் கட்டுப்பட்ட நிலையில் இருப்பதைக் குறிக்கிறது; ἄνομος என்பதுடன் உள்ள எதிர்மறை வேறுபாட்டையும் தெளிவாக்குகிறது.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: இங்கு Χριστός பட்டப்பெயராகச் செயல்படுவதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: ἵνα κερδάνω
  choice: வென்றெடுக்கும்படி
  rationale: இது பொருளாதார ஆதாயத்தைக் குறிக்காமல், மக்களை நற்செய்தியின் பக்கம் கொண்டுவரும் நோக்கத்தைக் குறிக்கிறது.
theological_decisions:
- issue: இச்சூழலில் ἄνομος என்பதன் பொருள்
  choice: மோசேயின் சட்டத்தின் கீழ் இல்லாதவர்கள்
  alternative: ஒழுக்கமற்றவர்கள் அல்லது சட்டத்தை மீறுகிறவர்கள்
  rationale: முந்தைய வசனத்தில் சட்டத்தின் கீழ் இருப்பவர்களைப் பற்றிய குறிப்புக்கும் இவ்வசனத்தில் வரும் பவுலின் விளக்கத்துக்கும் ஏற்ப, உடன்படிக்கைச் சட்டத்தோடு உள்ள உறவே இங்கு முதன்மையாகக் குறிக்கப்படுகிறது.
- issue: ἔννομος Χριστοῦ என்பதன் வலிமை
  choice: மேசியாவின் சட்டத்துக்கு உட்பட்டவன்
  alternative: மேசியாவின் சட்டத்துக்குள் இருப்பவன்
  rationale: பவுல் கடவுளிடம் எந்தச் சட்டப் பொறுப்பும் இல்லாதவர் என்ற கருத்தை மறுத்து, மேசியாவோடு தொடர்புடைய சட்ட ஆளுகைக்குள் இருப்பதாகக் கூறுகிறார். கிரேக்கத் தொடரின் உறவுசார் நுட்பத்தை மாற்றாமல் ‘உட்பட்டவன்’ இயல்பான தமிழில் தெரிவிக்கிறது.
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு அது ஒருவரின் நிலையான பெயரைப்போல் அல்லாமல் அபிஷேகம் பெற்ற அரசரைக் குறிக்கும் பட்டமாகப் பயன்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் ‘ஆனேன்’ தமிழில் முழுமையான வாக்கியத்திற்காக வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. ‘சட்டம்’ என்ற சொல் மொழிபெயர்ப்பிலேயே ‘மோசேயின் சட்டம்’ என்று விரிவாக்கப்படாமல் வைக்கப்பட்டு, சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
