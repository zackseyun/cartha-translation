  yaml_path: translation/nt/1_corinthians/009/006.yaml
  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: ta
  text: அல்லது, வேலை செய்யாமல் இருப்பதற்கான உரிமை எனக்கும் பர்னபாவுக்கும் மட்டும்தான் இல்லையா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேலை செய்யாமல் இருப்பதற்கான அதிகாரம்’ அல்லது ‘உழைக்காமல் இருப்பதற்கான சுதந்திரம்’ என்றும் மொழிபெயர்க்கலாம். ஊழியத்தில் பொருளாதார ஆதரவு பெறுவதற்காகத் தன் வாழ்வாதாரத்துக்கான வேலையைச் செய்யாமல் இருக்கிற உரிமையே இங்கு குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: பவுலின் வாதத்தில் அடுத்த சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் இயல்பான வலிமையைப் பாதுகாக்கிறது.
- source_word: μόνος
  choice: மட்டும்தான்
  rationale: ‘எனக்கும் பர்னபாவுக்கும்’ என்ற இணைந்த எழுவாயைத் தனிப்படுத்தி, அவர்கள் இருவர் மட்டுமே விதிவிலக்கா என்ற வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: எனக்கும் பர்னபாவுக்கும்
  rationale: கிரேக்கத்தில் ‘நானும் பர்னபாவும்’ என்ற வரிசை இருந்தாலும், ‘உரிமை ... இல்லையா’ என்ற தமிழ் வாக்கிய அமைப்பில் நான்காம் வேற்றுமை வடிவம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: οὐκ ἔχομεν
  choice: இல்லையா?
  rationale: எதிர்மறை சொல்லாட்சிக் கேள்வியின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐξουσίαν
  choice: உரிமை
  rationale: இச்சூழலில் ஆட்சி செலுத்தும் அதிகாரத்தைவிட, ஊழியத்திற்கான பொருளாதார ஆதரவைப் பெறுவதற்குரிய நியாயமான உரிமையைக் குறிக்கிறது.
- source_word: μὴ ἐργάζεσθαι
  choice: வேலை செய்யாமல் இருப்பதற்கான
  rationale: தன் வாழ்வாதாரத்திற்காக வேலை செய்வதைத் தவிர்க்கும் உரிமை என்பதைக் கூடுதல் விளக்கத்தை மூலவசனத்துக்குள் சேர்க்காமல் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: இச்சூழலில் ἐξουσία குறிக்கும் உரிமை
  choice: தங்கள் வாழ்வாதாரத்திற்காக வேலை செய்யாமல், திருச்சபைகளின் பொருளாதார ஆதரவைப் பெறுவதற்கான அப்போஸ்தல உரிமை
  alternative: குறிப்பிட்ட பொருளாதாரப் பின்னணி இல்லாத பொதுவான அதிகாரம் அல்லது சுதந்திரம்
  rationale: 1 கொரிந்தியர் 9-ன் உடனடிச் சூழல் அப்போஸ்தலர்களின் உணவு, பானம், வாழ்வாதார ஆதரவு ஆகிய உரிமைகளையும், பவுல் அவற்றைத் தன்னார்வமாகப் பயன்படுத்தாததையும் பேசுகிறது. முதன்மை உரை ‘உரிமை’ மற்றும் ‘வேலை செய்யாமல் இருப்பது’ என்று மட்டும் கூறி, சூழல்சார் விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified சொல்லாட்சிக் கேள்வி வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘மட்டும்தான் இல்லையா?’ என்பது μόνος என்பதன் தனிப்படுத்தும் வலியுறுத்தலையும் οὐκ ἔχομεν என்பதன் எதிர்மறைக் கேள்வியையும் இயல்பாகத் தக்கவைக்கிறது.
