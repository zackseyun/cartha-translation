- from: என்னை ஆராய்கிறவர்களுக்கு நான் அளிக்கும் தற்காப்பு இதுவே:[a]
  to: என்னை ஆராய்கிறவர்களுக்கு[a] என் தற்காப்பு இதுவே.
  rationale: “நான் அளிக்கும்” என்பதற்குப் பதிலாக “என்” பயன்படுத்தப்பட்டுள்ளது; இது ἡ ἐμή என்ற எளிய உடைமைச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது. மாற்று வாசிப்பின் பொருளை மாற்றாமல், அடிக்குறிப்பு குறியீடு அதனுடன் தொடர்புடைய சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
