translation:
  language: ta
  text: என்னை ஆராய்கிறவர்களுக்கு[a] என் தற்காப்பு இதுவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைத் தீர்ப்பிடுகிறவர்களுக்கு முன்பாக என் தற்காப்பு இதுவே.”
    reason: ἀνακρίνω என்பதற்கு இச்சூழலில் ‘ஆராய்தல்’ அல்லது ‘தீர்ப்பிடுதல்’ என்ற பொருள் இருக்கலாம்; மேலும், தற்காப்பு அவர்களுக்கு அளிக்கப்படுகிறது என்பதற்குப் பதிலாக அவர்கள் முன்பாக வைக்கப்படுகிறது என்றும் தத்த வேற்றுமையைப் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: ἀπολογία
  choice: தற்காப்பு
  rationale: பவுலின் அப்போஸ்தலப் பணியையும் உரிமைகளையும் விமர்சனத்துடன் ஆராய்கிறவர்களுக்கு அவர் அளிக்கும் பதிலை இது குறிக்கிறது. ‘தற்காப்பு’ என்பது வருத்தம் தெரிவிக்கும் ‘மன்னிப்புக் கோரல்’ என்ற தவறான பொருளைத் தவிர்த்து, குற்றச்சாட்டு அல்லது விமர்சனத்திற்கு அளிக்கப்படும் விளக்கமான பதிலை இயல்பாகக் காட்டுகிறது.
- source_word: ἀνακρίνουσίν
  choice: ஆராய்கிறவர்களுக்கு
  rationale: இந்த வினைச்சொல் பவுலை விசாரணைக்கும் மதிப்பீட்டுக்கும் உட்படுத்துவோரைக் குறிக்கிறது. ‘ஆராய்கிறவர்கள்’ என்பது இறுதித் தீர்ப்பைக் குறிக்கும் வலுவான நீதித்துறைப் பொருளைத் திணிக்காமல், விமர்சனப்பூர்வமான பரிசீலனையைப் பாதுகாக்கிறது.
- source_word: Ἡ ἐμὴ
  choice: நான் அளிக்கும்
  rationale: தமிழில் ‘என்னுடைய தற்காப்பு’ என்பதைக் காட்டிலும் ‘நான் அளிக்கும் தற்காப்பு’ என்பது உரிமைத் தொடர்பை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது; மூலத்தின் பொருள் மாறுவதில்லை.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: என்னை ஆராய்கிறவர்களுக்கு
  rationale: வேற்றுமை வடிவம் தற்காப்புப் பதில் யாரை நோக்கி அளிக்கப்படுகிறது என்பதைக் காட்டுகிறது. ‘என்னை ஆராய்கிறவர்களுக்கு’ என்பது அந்த உறவைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: ἐστιν αὕτη
  choice: இதுவே
  rationale: ‘இதுவே’ என்பது அடையாளப்படுத்தும் வாக்கியத்தின் இயல்பான தமிழ் வடிவம். ஏகார விகுதி மூலத்தில் முன்னிலைப்படுத்தப்பட்டுள்ள சுட்டுப்பெயரின் வலியுறுத்தலைச் சுருக்கமாகக் காட்டுகிறது.
