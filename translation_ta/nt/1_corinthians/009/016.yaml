id: 1CO.9.16
reference: 1 Corinthians 9:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: ta
  text: ஏனெனில், நான் நற்செய்தியை அறிவித்தால்[a], பெருமை பேசுவதற்கு எனக்கு அடிப்படை இல்லை; கட்டாயம் என்மேல் உள்ளது. ஏனெனில், நான் நற்செய்தியை அறிவிக்காவிட்டால் எனக்கு ஐயோ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நற்செய்தியைப் பிரசங்கித்தால்”; இவ்வசனத்தில் வரும் இரு இடங்களுக்கும் இது பொருந்தும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: நற்செய்தியை அறிவித்தாலும் / நற்செய்தியை அறிவிக்காவிட்டால்
  rationale: இந்த வினைச்சொல் நற்செய்தியைப் பொதுவாக அறிவிப்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க, இரு இடங்களிலும் ஒரே சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: καύχημα
  choice: பெருமை பேசுவதற்கு ... அடிப்படை
  rationale: இச்சொல் பெருமை பேசுவதற்கான காரணம் அல்லது ஆதாரத்தைக் குறிக்கிறது. வெறும் ‘பெருமை’ என்று மொழிபெயர்த்தால் நற்பெயர் அல்லது மதிப்பு என்ற பொருள் தோன்றக்கூடும்; இத்தேர்வு பவுல் தன்னைப் பாராட்டிக்கொள்ள உரிய அடிப்படை இல்லை என்பதைக் காட்டுகிறது.
- source_word: ἀνάγκη
  choice: கட்டாயம்
  rationale: இது பவுல்மீது வந்துள்ள தவிர்க்க முடியாத கடமை அல்லது நிர்ப்பந்தத்தைக் குறிக்கிறது; அதன் மூலத்தை வசனம் வெளிப்படையாகக் கூறாததால் அது குறிப்பிடப்படவில்லை.
- source_word: ἐπίκειται
  choice: என்மேல் சுமத்தப்பட்டுள்ளது
  rationale: பவுல்மீது ஒன்று வைக்கப்பட்டு அவரை அழுத்துகிறது என்ற வினைச்சொல்லின் உருவகத்தையும், விதிக்கப்பட்ட கடமையின் உணர்வையும் இது தக்கவைக்கிறது.
- source_word: οὐαί
  choice: எனக்கு ஐயோ!
  rationale: வரவிருக்கும் கேடு அல்லது கடும் துயரைக் குறிக்கும் ஆழமான எச்சரிக்கைத் தொனியைத் தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: வசனம் முந்தைய வாதத்திற்குத் தரும் விளக்கத் தொடர்பைத் தொடக்கத்தில் வெளிப்படுத்துகிறது. பின்னர் வரும் γάρ தமிழின் இயல்புக்காக தனியாக மறுபடியும் மொழிபெயர்க்கப்படாமல், வாக்கியங்களின் காரணவியல் ஓட்டத்தில் வெளிப்படுகிறது.
theological_decisions:
- issue: பவுல் நற்செய்தியை அறிவிக்க வேண்டிய கட்டாயத்தின் தன்மை
  choice: ‘கட்டாயம் என்மேல் சுமத்தப்பட்டுள்ளது’ என்று, அதன் மூலத்தை வரையறுக்காமல் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுள் இந்தக் கடமையை எனக்குக் கொடுத்துள்ளார்’ அல்லது ‘உள்ளார்ந்த தூண்டுதல் என்னை வற்புறுத்துகிறது’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க மூலவசனம் கட்டாயம் பவுல்மீது இருப்பதாகக் கூறுகிறது; ஆனால் இவ்வசனத்திலேயே அது தெய்வீக அழைப்பா, உள்ளார்ந்த தூண்டுதலா, வேறு சூழ்நிலையா என்று வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே அந்த இறையியல் திறந்தநிலை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், பவுலின் வாதத் தொனியும் ‘எனக்கு ஐயோ!’ என்ற தீவிரமான எச்சரிக்கையும் காக்கப்பட்டுள்ளன. ‘பெருமை பேசுவதற்கு அடிப்படை’ என்பது பொருளைத் தெளிவாக்கும் இயல்பான சொற்றொடராகத் தேர்ந்தெடுக்கப்பட்டது.
