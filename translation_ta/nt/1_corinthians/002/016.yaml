  terminology: ‘ஆண்டவர்,’ ‘மனம்,’ and ‘மேசியா’ are appropriate. The lexical-alternative footnote for ‘கிறிஸ்துவின்’ is correctly anchored, and the Isaiah cross-reference is appropriate.
