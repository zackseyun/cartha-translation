id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: ta
  text: ஏனெனில், ஆண்டவருடைய[b] மனதை அறிந்து, அவருக்கு அறிவுரை கூறக்கூடியவர் யார்? ஆனால் நமக்கோ மேசியாவின்[a] மனம் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின் மனம்.”
    reason: lexical_alternative
  - marker: b
    text: பவுல் ஏசாயா 40:13-ஐ எதிரொலிக்கிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: τίς γὰρ
  choice: யார்?
  rationale: τίς எழுப்பும் சொல்லாட்சிக் கேள்வியைத் தமிழில் நேரடியாகத் தருகிறது. γὰρ முன் வாதத்தின் விளக்கத் தொடர்ச்சியைச் சுட்டுகிறது; ஆனால் தனி வசனத் தமிழில் இயல்பற்ற ‘ஏனெனில்’ என்பதைத் திணிக்காமல் கேள்வியின் வாதப் பிணைப்பு காக்கப்படுகிறது.
- source_word: ἔγνω νοῦν κυρίου
  choice: ஆண்டவருடைய மனதை அறிந்து
  rationale: νοῦς என்பதின் சிந்தனை, புரிதல், மனப்பாங்கு ஆகிய பரப்பை ‘மனம்’ இயல்பாகக் காக்கிறது. κύριος என்பதற்கு ‘ஆண்டவர்’ நவீனமும் மரியாதைமிக்கதுமான பொதுத் தமிழ் வடிவம்.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: அவருக்கு அறிவுரை கூறக்கூடியவர்
  rationale: இங்கு συμβιβάζω என்பது அறிவுறுத்துதல் அல்லது வழிகாட்டுதல் என்ற பொருளில் வருகிறது. தொடர்புப் பெயரெச்ச அமைப்பையும் சொல்லாட்சிக் கேள்வியின் கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்த ‘அறிவுரை கூறக்கூடியவர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἡμεῖς δὲ
  choice: ஆனால் நமக்கோ
  rationale: δὲ குறிக்கும் வலுவான முரண்பாட்டை ‘ஆனால்’ காட்டுகிறது; ‘நமக்கோ’ என்பதில் ἡμεῖς என்ற வலியுறுத்தப்பட்ட எழுவாயின் எதிர்மறை ஒப்பீட்டு அழுத்தம் வெளிப்படுகிறது.
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: மேசியாவின் மனம் இருக்கிறது
  rationale: ἔχομεν என்பதன் நேரடியான உடைமைப் பொருளை இயல்பான தமிழில் தருகிறது. Χριστός இங்கு பட்டப்பெயர் வலிமையுடன் இருப்பதால் ‘மேசியா’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: νοῦν Χριστοῦ என்பதில் Χριστοῦ-ஐ எவ்வாறு மொழிபெயர்ப்பது
  choice: மேசியாவின் மனம்
  alternative: கிறிஸ்துவின் மனம்
  rationale: Χριστός இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயர் வலிமையைத் தக்கவைக்க ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது. தமிழ் கிறிஸ்தவ வழக்கில் நிலைபெற்ற மாற்று வடிவம் அடிக்குறிப்பில் வழங்கப்படுகிறது; வசனத்தின் இறையியல் கூற்று மாற்றப்படவில்லை.
- issue: கர்த்தருக்கு மனிதர் அறிவுரை கூற முடியுமா என்ற சொல்லாட்சிக் கேள்வி
  choice: அறிந்து, அவருக்கு அறிவுரை கூறக்கூடியவர் யார்?
  alternative: அறிந்தவர் யார், அவருக்கு அறிவுரை கூறுவதற்கு?
  rationale: கிரேக்கத்தின் சொல்லாட்சிக் கேள்வியையும், ஆண்டவரின் மனதை முழுமையாக அறிந்து அவரை வழிநடத்த மனிதர் தகுதியற்றவர் என்ற பதற்றத்தையும் வெளிப்படையாகத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. ‘சிந்தை’ என்பதற்குப் பதிலாக இன்றைய இயல்பான ‘மனம்’ பயன்படுத்தப்பட்டது; ‘அறிவுரை கூறக்கூடியவர்’ என்பது கிரேக்கத் தொடர்பு வாக்கியத்தைத் தமிழில் தெளிவாக இணைக்கிறது.
