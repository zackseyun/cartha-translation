id: 1CO.2.2
reference: 1 Corinthians 2:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: ta
  text: ஏனெனில், உங்களிடையே இயேசுவாகிய மேசியாவைத் தவிர வேறு எதையும் அறிய வேண்டாம் என்று நான் தீர்மானித்தேன்—சிலுவையில் அறையப்பட்டவராகிய அவரையே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκρινά
  choice: தீர்மானித்திருந்தேன்
  rationale: இங்கு κρίνω நீதித்தீர்ப்பைக் குறிக்காமல், பவுலின் உறுதியான முன்தீர்மானத்தைக் குறிக்கிறது. இறந்தகாலச் சூழலை இயல்பாக வெளிப்படுத்த ‘தீர்மானித்திருந்தேன்’ பயன்படுத்தப்பட்டது.
- source_word: τι εἰδέναι
  choice: வேறெதையும் அறிந்திருப்பதில்லை
  rationale: οὐ ... εἰ μὴ என்னும் விலக்குக் கட்டமைப்புடன் சேர்ந்து, குறிப்பிடப்பட்ட ஒருவரைத் தவிர வேறு எதையும் தன் ஊழியத்தின் மையமாகக் கொள்ளாத தீர்மானத்தை இது வெளிப்படுத்துகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: கொரிந்தியர்களின் நடுவில் பவுல் இருந்ததும் பணியாற்றியதுமான உறவுசார் சூழலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: இது நிலையான விலக்குப் பயன்பாடு; தமிழில் ‘தவிர’ அதன் பொருளை நேரடியாகத் தருகிறது.
- source_word: Χριστόν
  choice: மேசியா
  rationale: இங்கு Χριστός இயேசுவின் பட்டமாகச் செயல்படுகிறது. நவீன தமிழில் இயல்பான பட்டப்பெயர் அமைப்புக்காக ‘இயேசுவாகிய மேசியா’ என்று வழங்கப்பட்டது.
- source_word: τοῦτον ἐσταυρωμένον
  choice: அதுவும் சிலுவையில் அறையப்பட்ட அவரை
  rationale: τοῦτον இயேசுவையே வலியுறுத்துகிறது; perfect passive participle அவர் சிலுவையில் அறையப்பட்டவர் என்ற நிலைத்த அடையாளத்தை முன்னிறுத்துகிறது. ‘அதுவும்’ அந்த வலியுறுத்தலை இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இந்த இடத்தில் சொல் வெறும் பெயரின் பகுதியாக அல்லாமல் இயேசுவின் அபிஷேகம் பெற்ற அரசர்/மீட்பர் பட்டத்தை முன்னிறுத்துகிறது. ஆகவே ‘மேசியா’ முதன்மை உரையில் வைக்கப்பட்டு, மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τοῦτον ἐσταυρωμένον என்பதிலுள்ள வலியுறுத்தல்
  choice: அதுவும் சிலுவையில் அறையப்பட்ட அவரை
  alternative: சிலுவையில் அறையப்பட்ட இயேசு மேசியாவை
  rationale: மூலத்தின் ‘இந்த ஒருவரையே—அவரும் சிலுவையில் அறையப்பட்டவராக’ என்ற செறிவையும், மேசியாவுக்கும் சிலுவைக்கும் இடையிலுள்ள இறையியல் பதற்றத்தையும் விளக்கிப் போக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சபை வாசிப்புக்கும் பொதுவாசிப்புக்கும் ஏற்ற கண்ணியமான நடை. பவுலின் உறுதியான தீர்மானமும் ‘அவரையே—அதுவும் சிலுவையில் அறையப்பட்டவரையே’ என்ற மூல வலியுறுத்தலும் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
