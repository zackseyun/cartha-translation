source:
  edition: SBLGNT
  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: ta
  text: இந்த யுகத்தின் ஆட்சியாளர்களில் எவரும் அந்த ஞானத்தை அறியவில்லை[a]. அவர்கள் அதை அறிந்திருந்தால், மகிமையின் ஆண்டவரைச் சிலுவையில் அறைந்திருக்க மாட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த யுகத்தின் ஆட்சியாளர்கள்” என்பது மனித அதிகாரிகளையோ, ஆவிக்குரிய வல்லமைகளையோ, அல்லது இரு தரப்பினரையுமோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: அந்த ஞானத்தை
  rationale: பெண்பால் ஒருமை உறவுப்பெயர் முந்தைய வசனத்தில் கூறப்பட்ட ஞானத்தைக் குறிக்கிறது. தமிழில் தனியாக உறவுப்பெயரைப் பயன்படுத்துவதைவிட அதன் முன்னிடுபொருளை மீண்டும் கூறுவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀρχόντων
  choice: ஆட்சியாளர்கள்
  rationale: ஆளும் அதிகாரம் செலுத்துபவர்களைக் குறிக்கிறது; மனித அதிகாரிகள், ஆவிக்குரிய வல்லமைகள், அல்லது இரு தரப்பினரையும் குறிக்கும் சாத்தியத்தை இச்சொல் முடிந்தவரை திறந்தே வைக்கிறது.
- source_word: αἰῶνος τούτου
  choice: இந்த யுகத்தின்
  rationale: αἰών என்பதன் காலகட்டம் அல்லது தற்போதைய ஒழுங்கு என்ற பொருளை ‘யுகம்’ காக்கிறது; ‘உலகம்’ என்று மொழிபெயர்த்து இடப்பரப்பு சார்ந்த பொருளாகக் குறுக்கவில்லை.
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: அறியவில்லை / அறிந்திருந்தால்
  rationale: γινώσκω என்பதன் அடிப்படைப் பொருளை நேரடியாகக் காக்கிறது. எதிர்நிகழ்வுக் கட்டமைப்பில் εἰ ... ἔγνωσαν என்பதை ‘அறிந்திருந்தால்’ என்று இயல்பான தமிழில் வழங்குகிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: κύριος என்ற பட்டத்தின் அதிகாரத்தையும் இறையியல் நிறையையும் காக்கும் நிலையான தமிழ் வடிவம்.
- source_word: δόξης
  choice: மகிமையின்
  rationale: δόξα என்பதற்கான நிலையான வேதாகமத் தமிழ் சொல்; அதன் இறையியல் ஒலிப்பையும் காக்கிறது.
- source_word: κύριον τῆς δόξης
  choice: மகிமையின் ஆண்டவர்
  rationale: மூலத்தின் உடைமை வேற்றுமை அமைப்பைத் தக்கவைத்து, அதை வெறுமனே ‘மகிமையுள்ள ஆண்டவர்’ என்ற பண்புப்பெயர் தொடராக மாற்றாமல் அதன் உயர்ந்த நடையைப் பாதுகாக்கிறது.
- source_word: ἐσταύρωσαν
  choice: சிலுவையில் அறைந்திருக்க மாட்டார்கள்
  rationale: சிலுவை மரணத்தின் வரலாற்றுச் சிறப்பை நேரடியாகத் தெரிவிக்கிறது; எதிர்நிகழ்வுக்கேற்ற வினை வடிவமும் தமிழில் இயல்பாக அமைந்துள்ளது.
theological_decisions:
- issue: ‘இந்த யுகத்தின் ஆட்சியாளர்கள்’ என்பவர்களின் அடையாளம்
  choice: மனித அல்லது ஆவிக்குரிய அடையாளத்தைத் தீர்மானிக்காமல் ‘இந்த யுகத்தின் ஆட்சியாளர்கள்’ என்று நடுநிலையாக மொழிபெயர்க்கப்பட்டது.
  alternative: மனித அரசியல் அல்லது சமய அதிகாரிகள் மட்டும்; அண்டம்சார் அல்லது தீய ஆவிக்குரிய வல்லமைகள் மட்டும்; அல்லது இரு நிலைகளையும் உள்ளடக்கிய குறிப்பு.
  rationale: கிரேக்கத் தொடர் இம்மூன்று புரிதல்களுக்கும் இடமளிக்கிறது. வசனம் தானாகத் தீர்க்காத பொருள் நெருக்கடியை முதன்மை உரை தீர்த்து வைக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யுகம்’, ‘மகிமையின் ஆண்டவர்’ ஆகியவை மூலத்தின் காலநிலை மற்றும் உயர்ந்த இறையியல் நடையைப் பாதுகாக்கின்றன; வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்கும் புரியும்படி இயல்பாக்கப்பட்டுள்ளது.
