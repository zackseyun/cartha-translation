id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: ta
  text: மனிதர்களில் ஒருவருக்குரியவற்றை[a], அவருக்குள் இருக்கும் அவரது ஆவியை[b] தவிர வேறு யார் அறிவார்? அவ்வாறே, கடவுளுக்குரியவற்றைக் கடவுளின் ஆவியைத் தவிர வேறு யாரும் அறிந்ததில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவருடைய எண்ணங்களை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த மனிதருக்குள் இருக்கும் ஆவியை.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: மனிதர்களில் / ஒருவருக்குரிய
  rationale: இங்கு ஆண் பாலினத்தை மட்டும் குறிக்காமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. தமிழில் இயல்பான பொதுமனிதக் குறிப்பை இச்சொற்கள் தருகின்றன.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: ஒருவருக்குரியவற்றை
  rationale: ஒருவரின் எண்ணங்கள் மட்டும் அல்லாமல் அவருடைய உள்ளார்ந்த காரியங்கள் அனைத்தையும் உள்ளடக்கக்கூடிய கிரேக்கத் தொடரின் பரந்த பொருளையும், பின்னர் வரும் ‘கடவுளுக்குரியவை’ என்ற இணை அமைப்பையும் காக்கிறது.
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: அவருக்குள் இருக்கும் அவரது ஆவி
  rationale: ஒருவருடைய ஆவியும் அது அவருக்குள் இருப்பதும் ஆகிய இரு கூறுகளையும் விளக்கச் சேர்க்காமல் நேரடியாகத் தருகிறது.
- source_word: οὕτως καὶ
  choice: அவ்வாறே
  rationale: மனிதரைப் பற்றிய முதல் கூற்றுக்கும் கடவுளைப் பற்றிய இரண்டாம் கூற்றுக்கும் இடையிலான ஒப்புமையை இயல்பாகக் குறிக்கிறது.
- source_word: ἔγνωκεν
  choice: அறிந்ததில்லை
  rationale: கிரேக்க நிறைவுக் காலத்தின் வடிவத்தைத் தமிழில் இயல்பாகப் பிரதிபலித்து, இதுவரை அறிந்திராத நிலையை வெளிப்படுத்துகிறது.
- source_word: τὰ τοῦ θεοῦ
  choice: கடவுளுக்குரியவற்றை
  rationale: ‘கடவுளின் எண்ணங்கள்’ என்று பொருளைக் குறுக்காமல் கிரேக்கத்தின் பரந்த பொருளையும் முதல் பாதியுடனான இணை அமைப்பையும் காக்கிறது.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: கடவுளின் ஆவி
  rationale: உடனடிச் சூழலில் கடவுளுடைய சொந்த ஆவியைக் குறிக்கிறது; தமிழில் பெரிய எழுத்து வேறுபாடு இல்லாததால் சூழலே அந்த தனிப்பட்ட குறிப்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: πνεῦμα τοῦ θεοῦ என்பது கடவுளுடைய தனிப்பட்ட ஆவியைக் குறிக்கிறதா அல்லது பொதுவான ‘கடவுளின் ஆவி’ என்ற பண்பை மட்டும் குறிக்கிறதா?
  choice: கடவுளின் ஆவி
  alternative: கடவுளிடமிருந்து வரும் ஆவி
  rationale: 1 கொரிந்தியர் 2-ன் உடனடிச் சூழலில் கடவுளின் ஆவியே கடவுளின் ஆழமான காரியங்களை ஆராய்ந்து வெளிப்படுத்துகிறார். ‘கடவுளிடமிருந்து வரும் ஆவி’ என்பது மூலத்தில் இல்லாத தோற்றக் கருத்தை முன்னிறுத்தக்கூடும்; ஆகவே உடைமைத் தொடர்பை நேரடியாகக் காக்கும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பாலினப் பொதுமையை வெளிப்படுத்த ‘ஒருவர்/அவர்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் மனிதர்–கடவுள் இணை அமைப்பும், முதல் வினையின் நிகழ்காலத்துக்கும் இரண்டாம் வினையின் நிறைவுக் காலத்துக்கும் இடையிலான வேறுபாடும் இயன்றவரை காக்கப்பட்டுள்ளன.
