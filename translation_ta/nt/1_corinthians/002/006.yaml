reference: 1 Corinthians 2:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: ta
  text: ஆயினும், முதிர்ந்தவர்களிடையே நாம் ஞானத்தைப் பேசுகிறோம்[a]. ஆனால், நாம் பேசும் இந்த ஞானம் இந்தக் காலத்தினுடைய ஞானமோ, ஒழிக்கப்பட்டுக்கொண்டிருக்கும்[b] இந்தக் காலத்தின் ஆட்சியாளர்களுடைய ஞானமோ அல்ல[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிறைவடைந்தவர்களிடையே”; இங்கு ஆன்மிக முதிர்ச்சி பெற்றவர்களைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அழிந்துவரும்,” “ஒழிக்கப்படும்,” அல்லது “செயலற்றதாக்கப்படும்.”
    reason: lexical_alternative
  - marker: c
    text: “இந்தக் காலத்தின் ஆட்சியாளர்கள்” என்பது மனித அதிகாரிகளையோ, ஆன்மிக வல்லமைகளையோ, அல்லது இரு தரப்பினரையுமோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Σοφίαν
  choice: ஞானம்
  rationale: σοφία என்பதற்கான இயல்பான, நிலைபெற்ற தமிழ் சொல். கிரேக்கத்தில் வலியுறுத்தலுக்காக மீண்டும் வருவதைக் கருத்தில் கொண்டு, தமிழிலும் இரு இடங்களிலும் ‘ஞானம்’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: ஆயினும் / ஆனால்
  rationale: முந்தைய சூழலோடு உள்ள முரண்பாட்டை ‘ஆயினும்’ வெளிப்படுத்துகிறது; இரண்டாவது δὲ-இன் எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் ‘ஆனால்’ காட்டுகிறது.
- source_word: λαλοῦμεν
  choice: பேசுகிறோம்
  rationale: λαλέω என்பதன் அடிப்படைப் பொருள் ‘பேசுதல்’; ‘அறிவிக்கிறோம்’ என்று வலுப்படுத்தாமல் மூலத்தின் பொதுவான வினையைப் பாதுகாக்கிறது.
- source_word: ἐν τοῖς τελείοις
  choice: முதிர்ச்சி பெற்றவர்களிடையே
  rationale: τέλειος இங்கு பாவமற்ற பரிபூரணத்தைக் காட்டுவதைவிட முழு வளர்ச்சி அல்லது ஆன்மிக முதிர்ச்சியைக் குறிப்பதாகத் தெரிகிறது. ἐν என்பதற்கு இச்சூழலில் ‘இடையே’ இயல்பானது.
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: இந்தக் காலத்தின் ஞானமோ ... அல்ல
  rationale: αἰών என்பதைக் κόσμος என்ற ‘உலகம்’ என்பதோடு ஒன்றாக்காமல், அதன் காலகட்டப் பொருளை ‘காலம்’ பாதுகாக்கிறது.
- source_word: ἀρχόντων
  choice: ஆட்சியாளர்கள்
  rationale: மனித அதிகாரிகளையோ ஆன்மிக வல்லமைகளையோ இரண்டையுமோ குறிக்கக்கூடிய பரந்த சொல்லாக வைக்கப்பட்டுள்ளது.
- source_word: τῶν καταργουμένων
  choice: ஒன்றுமில்லாமல் ஆக்கப்பட்டுவரும்
  rationale: καταργέω-வின் செயலற்றதாக்குதல் அல்லது ஒன்றுமில்லாமல் ஆக்குதல் என்ற வலிமையையும், நிகழ்கால இடைச்சொல்லின் தொடரும் செயலையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘இந்தக் காலத்தின் ஆட்சியாளர்கள்’ என்பவர்களின் அடையாளம்
  choice: மனிதர்களா ஆன்மிக வல்லமைகளா என்று வரையறுக்காமல் ‘ஆட்சியாளர்கள்’ எனப் பொதுவாக மொழிபெயர்த்தல்
  alternative: மனித அரசியல் அல்லது சமயத் தலைவர்கள் மட்டும்; ஆன்மிக வல்லமைகள் மட்டும்; அல்லது இரு தரப்பினரும்
  rationale: கிரேக்கச் சொற்றொடர் எந்த ஒரு விளக்கத்தையும் கட்டாயப்படுத்தவில்லை. ஆகவே விவாதத்திற்குரிய இறையியல் பொருளை முதன்மை உரை தீர்மானிக்காமல், மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் எதிர்மறை அமைப்பு இயல்பான தமிழுக்காக மறுசீரமைக்கப்பட்டாலும், ‘ஞானம்’ என்ற சொல்லின் மீளுரையும் மூலத்தின் கருத்தியல் வேறுபாடுகளும் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
