revisions:
- from: ஆயினும், முதிர்ச்சி பெற்றவர்களிடையே ஞானத்தைப் பேசுகிறோம்[a]. ஆனால் அது இந்தக் காலத்தின் ஞானமோ, ஒன்றுமில்லாமல் ஆக்கப்பட்டுவரும்[b] இந்தக் காலத்தின் ஆட்சியாளர்களுடைய ஞானமோ அல்ல[c].
  to: ஆயினும், முதிர்ந்தவர்களிடையே நாம் ஞானத்தைப் பேசுகிறோம்[a]. ஆனால், நாம் பேசும் இந்த ஞானம் இந்தக் காலத்தினுடைய ஞானமோ, ஒழிக்கப்பட்டுக்கொண்டிருக்கும்[b] இந்தக் காலத்தின் ஆட்சியாளர்களுடைய ஞானமோ அல்ல[c].
  rationale: மூலத்தின் இரு முறை வரும் «ஞானம்», «இந்தக் காலம்» என்ற கால-உலகப் பொருள், மற்றும் ஆட்சியாளர்களின் அடையாளத்தைப் பற்றிய தெளிவின்மை ஆகியவை தக்கவைக்கப்பட்டுள்ளன. திருத்தம் முதன்மையாக καταργουμένων-க்கு இயல்பான தமிழ் செயப்பாட்டு வடிவத்தை அளிக்கிறது; அது நிறைவேறிய அழிவாக அல்லாமல் நிகழ்ந்துகொண்டிருக்கும் ஒழிப்பாகவே அமைக்கப்பட்டுள்ளது.
