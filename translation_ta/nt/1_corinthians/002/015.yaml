  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: ta
  text: ஆனால் ஆவிக்குரியவர்[a] எல்லாவற்றையும் ஆராய்ந்து மதிப்பிடுகிறார்[b]; ஆனால் அவரோ எவராலும் ஆராய்ந்து மதிப்பிடப்பட முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆவிக்குரியவர்” என்பது கிரேக்கத்தில் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட ஒருமை ஆண்பால் பெயரடை; ஆவியால் தன்மைப்படுத்தப்பட்ட ஒருவரைப் பொதுப்படையாகக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “ஆராய்கிறார்,” “பகுத்தறிகிறார்,” அல்லது “தீர்ப்பிடுகிறார்” என்றும் மொழிபெயர்க்கலாம்; இவ்வசனத்தில் வரும் ἀνακρίνω என்ற வினையின் இரு பயன்பாடுகளுக்கும் இது பொருந்தும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνευματικὸς
  choice: ஆவிக்குரியவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட ஒருமை ஆண்பால் பெயரடை இது. ஆவியால் தன்மைப்படுத்தப்பட்ட ஒருவரை பொதுப்படையாகக் குறிக்கிறது; தமிழில் ‘அவர்’ என்பது பாலினத்தைத் தேவையின்றிக் கட்டுப்படுத்தாமல் மரியாதையுடனும் இயல்பாகவும் உள்ளது.
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: ஆராய்ந்து மதிப்பிடுகிறார் / ஆராய்ந்து மதிப்பிடுவதில்லை
  rationale: இச்சூழலில் வினைச்சொல் கவனமாக ஆராய்ந்து ஒரு மதிப்பீட்டுக்கு வருதலைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே சொற்றொடரைப் பயன்படுத்துவது மூலத்தின் சொல்லாட்சி மீளுரையைப் பாதுகாக்கிறது.
- source_word: τὰ πάντα
  choice: எல்லாவற்றையும்
  rationale: கிரேக்கத்தின் வரம்பிடப்படாத, விரிவான சொல்லாட்சியை இயல்பான தமிழில் அப்படியே வைத்திருக்கிறது.
- source_word: αὐτὸς
  choice: அவரையோ
  rationale: ‘-ஓ’ கூறுகளுக்கிடையிலான எதிர்மறை அழுத்தத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தனியே ‘அவரே’ என்று சேர்ப்பது செயப்பாட்டு வாக்கியத்தில் செயப்படுபொருளான நபர்மீது தவறான அழுத்தத்தை ஏற்படுத்தக்கூடும்.
- source_word: ὑπ’ οὐδενὸς
  choice: எவரும் … இல்லை
  rationale: கிரேக்கத்தின் முழுமையான மறுப்பை இயல்பான தமிழ் எதிர்மறை வாக்கிய அமைப்பில் காக்கிறது.
theological_decisions:
- issue: ஆவிக்குரியவரைப் பற்றிய பவுலின் கூற்றின் வரம்பு
  choice: ‘எல்லாவற்றையும்’ என்றும் ‘எவரும் … இல்லை’ என்றும் வரம்பிடப்படாத சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: முதன்மை உரையிலேயே ‘ஆவிக்குரிய காரியங்கள்’ என்று பொருளை வரம்பிடுதல்
  rationale: வசனம் கூற்றை வெளிப்படையாக வரம்பிடவில்லை; உடனடிச் சூழல் அதன் பொருளுக்கான சட்டகத்தை வழங்குகிறது. முதன்மை உரையில் வரம்பைச் சேர்ப்பது மூலத்தில் நிலவும் இறையியல் அழுத்தத்தை முன்கூட்டியே தீர்த்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் நடை. ‘ஆராய்ந்து மதிப்பிடுதல்’ என்பது வினையின் ஆய்வு மற்றும் மதிப்பீடு ஆகிய இரு நுணுக்கங்களையும் வெளிப்படுத்துகிறது; இரு கூறுகளிலும் அதையே மீண்டும் பயன்படுத்தி மூலத்தின் ஒற்றுமை காக்கப்பட்டுள்ளது.
