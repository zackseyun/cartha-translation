source:
  edition: SBLGNT
  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: ta
  text: என் பேச்சும் என் அறிவிப்பும் ஞானத்தின் வற்புறுத்தும் திறமையோடு இல்லாமல், ஆவியானவராலும் வல்லமையாலும் வெளிப்பட்ட சான்றோடு இருந்தன.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆவியினாலும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “ஞானத்தின் வசீகரிக்கும் சொற்களோடு இல்லாமல், ஆவியானவரும் வல்லமையும் காட்டிய சான்றோடு.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: λόγος
  choice: பேச்சு
  rationale: இங்கு பவுல் பேசும் முறையைக் குறிப்பிடுவதால், κήρυγμα என்பதிலிருந்து வேறுபடுத்தி இயல்பாகத் தருகிறது.
- source_word: κήρυγμα
  choice: பிரசங்கம்
  rationale: அறிவித்தல் அல்லது பிரகடனம் என்ற பொருளைத் தாங்கும், பொதுவாகப் புரியும் நவீனத் தமிழ் சொல்.
- source_word: πειθοῖ σοφίας
  choice: ஞானத்தின் வசீகரிக்கும் சொற்களால்
  rationale: கிரேக்கச் சொற்றொடரின் உரைவேறுபாடு மற்றும் சாத்தியமான பொருளை இயல்பான தமிழில் தருகிறது; ‘சொற்கள்’ என்பது உரையில் மறைமுகமாகப் புரிந்துகொள்ளக்கூடிய நிரப்புச் சொல்.
- source_word: ἀποδείξει
  choice: தெளிவாக வெளிப்படுத்துவதாய்
  rationale: வெறும் சொல்வன்மைக்கு எதிராக, காண்பித்தல் அல்லது சான்றாக வெளிப்படுத்துதல் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πνεύματος
  choice: ஆவியானவரை
  rationale: உடனடியான சூழலும் தொடரும் பகுதியும் கடவுளுடைய ஆவியைக் குறிப்பதை ஆதரிக்கின்றன; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: δυνάμεως
  choice: வல்லமையை
  rationale: Pauline பயன்பாட்டுக்கு ஏற்ற, தெளிவான மற்றும் வழக்கமான தமிழ் இணைச்சொல்.
theological_decisions:
- issue: πνεύματος என்பது தூய ஆவியானவரையா அல்லது ஆவி/ஆவிக்குரிய தன்மையையா குறிக்கிறது
  choice: ஆவியானவர்
  alternative: ஆவி
  rationale: 1 கொரிந்தியர் 2-ன் விரிவான வாதம் மனித ஞானத்தைக் கடவுளிடமிருந்து வரும் வெளிப்பாட்டுடன் ஒப்பிடுகிறது; இருப்பினும் இலக்கண ரீதியான மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀπόδειξις πνεύματος καὶ δυνάμεως என்பதிலுள்ள உருபுச் சம்பந்தம்
  choice: ஆவியானவரையும் வல்லமையையும் தெளிவாக வெளிப்படுத்துதல்
  alternative: ஆவியானவராலும் வல்லமையாலும் வழங்கப்பட்ட தெளிவான சான்று
  rationale: மூலத்தின் பிறப்புவேற்றுமைச் சொற்றொடர் வெளிப்படுத்தப்படும் பொருளையோ அதன் மூலத்தையோ குறிக்கக்கூடியதால், முதன்மை உரையில் ஒன்றைத் தேர்ந்து மாற்றை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. λόγος மற்றும் κήρυγμα ஆகியவை முறையே ‘பேச்சு’, ‘பிரசங்கம்’ என வேறுபடுத்தப்பட்டுள்ளன. கிரேக்கத்தின் இறையியல் மற்றும் இலக்கணத் தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
