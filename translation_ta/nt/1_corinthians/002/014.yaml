id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: ta
  text: ஆனால் இயல்பான மனிதர்[a] தேவனுடைய ஆவியின் காரியங்களை ஏற்றுக்கொள்வதில்லை. ஏனெனில், அவை அவருக்கு மூடத்தனமாக இருக்கின்றன; அவை ஆவிக்குரிய முறையில் பகுத்தறியப்படுபவைகள் என்பதால், அவரால் அவற்றை அறிந்துகொள்ள முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவிக்குரியவராக இல்லாத மனிதர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: இயல்பான
  rationale: இச்சூழலில் ψυχικός என்பது πνευματικός என்பதற்கு எதிர்மறையான ஒப்புமையாக வருகிறது. ஆவியால் உண்டாகும் பகுத்தறிதலுக்கு மாறாக, வெறும் மனித இயல்புக்குட்பட்ட நிலையைக் குறிக்கிறது; கிரேக்கச் சொல்லைவிட அதிகமான கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் இருக்க ‘இயல்பான’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἄνθρωπος
  choice: மனிதர்
  rationale: இலக்கண வடிவம் ஆண்பால் ஒருமையாக இருந்தாலும், இங்கு குறிப்பாக ஓர் ஆணை அல்ல, பொதுவாக ஒரு மனிதரைப் பிரதிநிதித்துவப்படுத்துகிறது. ‘மனிதர்’ அந்தப் பொதுப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: δέχεται
  choice: ஏற்றுக்கொள்வதில்லை
  rationale: δέχομαι என்பது வெறுமனே ஒன்றைப் பெற்றுக்கொள்வதை மட்டுமல்லாமல், அதை ஏற்றுக்கொள்வதையும் வரவேற்பதையும் குறிக்கலாம். இங்கு மறுப்பை வலியுறுத்துவதால் ‘ஏற்றுக்கொள்வதில்லை’ பொருத்தமானது.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: தேவனுடைய ஆவிக்குரியவற்றை
  rationale: இந்தச் சொற்றொடர் தேவனுடைய ஆவியோடு தொடர்புடைய அல்லது அவருக்குரிய காரியங்களைப் பரந்த முறையில் குறிக்கிறது. ‘ஆவிக்குரியவை’ என்பது அதன் திட்டமிட்ட பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: μωρία
  choice: மூடத்தனம்
  rationale: 1 கொரிந்தியரில் பவுல் தொடர்ந்து அமைக்கும் தேவ ஞானத்துக்கும் மனித மதிப்பீட்டுக்கும் இடையிலான முரண்பாட்டை ‘மூடத்தனம்’ தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: γνῶναι
  choice: அறிந்துகொள்ள
  rationale: γινώσκω இங்கு வெறும் தகவல் அறிவை மட்டுமல்லாமல், இவற்றின் உண்மையை உணர்ந்து அறிதலையும் குறிக்கலாம். ‘அறிந்துகொள்ள’ என்பது ‘அறிய’ என்ற அடிப்படைப் பொருளைப் பாதுகாத்தபடியே சூழலுக்கேற்ற புரிதலையும் வெளிப்படுத்துகிறது.
- source_word: πνευματικῶς
  choice: ஆவிக்குரிய விதத்தில்
  rationale: இந்த வினையடை பகுத்தறிதலின் முறை அல்லது தளத்தைக் குறிக்கிறது. ‘ஆவிக்குரிய விதத்தில்’ என்பது ‘ஆவியினால்’ என்று பொருளைத் திட்டவட்டமாக்காமல் கிரேக்கத்தின் நெகிழ்வைப் பாதுகாக்கிறது.
- source_word: ἀνακρίνεται
  choice: பகுத்தறியப்படுகின்றன
  rationale: ἀνακρίνω என்பதற்கு ஆராய்தல், மதிப்பிடுதல், பகுத்தறிதல் ஆகிய பொருள்கள் உள்ளன. இங்கு ஆவிக்குரிய உண்மைகளைச் சரியாக உணர்வதே மையமாக இருப்பதால் ‘பகுத்தறியப்படுகின்றன’ பொருத்தமானது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: ψυχικὸς ἄνθρωπος என்பதையும் ஆவிக்குரிய பகுத்தறிதலையும் எதிர்மறையாக ஒப்பிடுதல்
  choice: இயல்பான மனிதர்
  alternative: ஆவிக்குரியவராக இல்லாத மனிதர்; ஆவியைப் பெற்றிராத மனிதர்
  rationale: ‘இயல்பான மனிதர்’ என்பது வெறும் மனித இயல்புக்குட்பட்ட நிலையையும் ஆவிக்குரிய பகுத்தறிதலுடனான முரண்பாட்டையும் பாதுகாக்கிறது. ‘ஆவியைப் பெற்றிராதவர்’ என்று மொழிபெயர்ப்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாத ஒரு விளக்கத்தை நேரடியாக உரைக்குள் சேர்த்துவிடும்.
- issue: πνευματικῶς என்பதன் செயற்பாட்டு அல்லது கருவிப் பொருள்
  choice: ஆவிக்குரிய விதத்தில்
  alternative: ஆவியினால்
  rationale: கிரேக்க வினையடை முறை, தளம், அல்லது ஆவியோடு உள்ள தொடர்பைச் சுட்டலாம். ‘ஆவியினால்’ என்பது கருவிப் பொருளை மட்டும் உறுதிப்படுத்தக்கூடும்; ஆகவே மூலத்தின் உண்மையான பொருள் நெகிழ்வு பாதுகாக்கப்பட்டது.
- issue: οὐ δύναται γνῶναι என்பதில் மனிதரின் இயலாமை
  choice: அவரால் அவற்றை அறிந்துகொள்ள முடியாது
  alternative: அவரால் அவற்றைப் புரிந்துகொள்ள முடியாது
  rationale: இயலாமை குறித்த வலிமையான கூற்றைத் தளர்த்தாமல் வைத்ததோடு, γνῶναι என்பதன் அடிப்படை ‘அறிதல்’ பொருளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘மனிதர்’ என்பது இங்கு பொதுவான மனித நபரைக் குறிக்கிறது. ‘ஆவிக்குரிய விதத்தில்’ மற்றும் ‘பகுத்தறியப்படுகின்றன’ ஆகியவை மூலத்தின் இறையியல் அழுத்தத்தையும் சொற்பொருள் நெகிழ்வையும் மிகைப்படுத்தாமல் பாதுகாக்கின்றன.
