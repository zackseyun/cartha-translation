id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: ta
  text: சகோதரர்களே[a], நானும் உங்களிடம் வந்தபோது, கடவுளின் சாட்சியை[b] உங்களுக்கு அறிவித்துக்கொண்டு, மேலான சொல்வன்மையுடனோ ஞானத்துடனோ வரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பது சபையிலுள்ள பெண்கள் உட்பட சக விசுவாசிகள் அனைவரையும் பொதுவாகக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் “கடவுளின் மறைபொருள்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: நானும்
  rationale: καί என்பதன் இணைப்புப் பொருளையும், வெளிப்படையாக இடம்பெறும் ἐγώ என்பதன் மிதமான வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐλθὼν … ἦλθον
  choice: உங்களிடம் வந்தபோது … வரவில்லை
  rationale: வினையெச்சத்தையும் முதன்மை வினையையும் தமிழில் இயல்பான காலத் துணைவாக்கியமாகத் தருகிறது; மூலத்தின் மீளுரைப்பையும் தேவையான அளவு காக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவத்தை முதன்மை உரையில் காக்கிறது; கலப்பின விசுவாசக் கூட்டத்தையும் இது குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: மேலான பேச்சுத்திறனுடனோ ஞானத்துடனோ
  rationale: ὑπεροχή குறிக்கும் உயர்வு அல்லது மேம்பாட்டையும் λόγος இங்கு குறிக்கும் பேச்சாற்றலையும், உலகியலான சொல்வன்மை–ஞானம் என்ற எதிர்மறைச் சூழலை மிகையாக விளக்காமல் தெரிவிக்கிறது.
- source_word: καταγγέλλων
  choice: அறிவித்தேன்
  rationale: பொதுவாக அறிவித்தல் அல்லது பிரகடனம் செய்தல் என்ற வினையின் கருத்தை இயல்பான தமிழில் தருகிறது; தமிழில் வாக்கியத்தைச் சுமையாக்கும் தொடர்வினை அமைப்பைத் தவிர்க்கிறது.
- source_word: μαρτύριον
  choice: சாட்சி
  rationale: SBLGNT மூல வாசகமான μαρτύριον என்பதன் சான்று அல்லது சாட்சி என்ற பொருளைத் தருகிறது; மாற்று வாசகம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: இந்த உருபுத் தொடர்பு கடவுளிடமிருந்து வரும் சாட்சியா அல்லது கடவுளைப் பற்றிய சாட்சியா என்பதைத் தீர்மானிக்காமல், மூலத்தின் பொருள் நெகிழ்வை காக்கிறது.
theological_decisions:
- issue: μαρτύριον என்பதிலுள்ள மூலப்பாட வேறுபாடு
  choice: கடவுளின் சாட்சி
  alternative: கடவுளின் மறைபொருள்
  rationale: SBLGNT அச்சிட்டுள்ள வாசகம் μαρτύριον (‘சாட்சி’). μυστήριον (‘மறைபொருள்’) என்பது பொருளை மாற்றும் குறிப்பிடத்தக்க மாற்று வாசகம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுளின் சாட்சி’ என்ற தொடர் கிரேக்க உருபுத் தொடர்பிலுள்ள உண்மையான தெளிவின்மையைத் தீர்க்காமல் காக்கிறது; ‘மேலான பேச்சுத்திறன்’ சொல்லாட்சியின் ஆடம்பரமான அல்லது உயர்வாகக் கருதப்பட்ட தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
