source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: ta
  text: ஆனால் நாம் உலகத்தின் ஆவியைப் பெறவில்லை; மாறாக, கடவுளிடமிருந்து வரும் ஆவியையே[a] பெற்றிருக்கிறோம்; கடவுள் நமக்கு அருளாக வழங்கியவற்றை[b] நாம் அறிந்துகொள்வதற்காக.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலின்படி, இது பரிசுத்த ஆவியைக் குறிக்கலாம்.
    reason: theological_ambiguity
  - marker: b
    text: 'வேறு விதமாக: “இலவசமாகக் கொடுத்தவற்றை” அல்லது “பரிசாகக் கொடுத்தவற்றை.”'
    reason: lexical_alternative
  - marker: c
    text: 'வேறு விதமாக: “நாம் புரிந்துகொள்வதற்காக.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: ஆவி
  rationale: இரு இடங்களிலும் ஒரே கிரேக்கச் சொல்லின் ஒற்றுமையைப் பாதுகாக்கிறது. முதல் இடத்தில் அது உலகத்தின் தாக்கத்தையோ இயக்கும் மனப்பாங்கையோ குறிக்கிறது; இரண்டாவது இடத்தில் சூழல் கடவுளிடமிருந்து அளிக்கப்படும் தூய ஆவியைக் குறிப்பதாகத் தெரிகிறது.
- source_word: κόσμου
  choice: உலகம்
  rationale: இங்கு கடவுளுக்கு எதிராக நிற்கும் தற்போதைய மனித ஒழுங்கைக் குறிக்கும் இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் சொல்.
- source_word: ἐλάβομεν
  choice: பெற்றிருக்கிறோம்
  rationale: கடந்த காலத்தில் பெற்றுக்கொண்டதன் தற்போதைய விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து வரும்
  rationale: ἐκ குறிப்பிடும் மூலத்தைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: ἵνα εἰδῶμεν
  choice: நாம் அறிந்துகொள்வதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα வாக்கிய அமைப்பையும் οἶδα என்பதன் அறிவுசார் பொருளையும் காக்கிறது.
- source_word: χαρισθέντα
  choice: அருளாக வழங்கிய
  rationale: χαρίζομαι என்பதில் உள்ள கிருபையுடனும் பரிசாகவும் கொடுக்கும் நுண்பொருளை வெறும் ‘கொடுத்த’ என்பதைவிடத் தெளிவாகத் தருகிறது.
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: நமக்கு அருளாக வழங்கியவற்றை
  rationale: நடுநிலைப் பன்மையின் பரந்த குறிப்பைத் தக்கவைத்து, இதை குறிப்பிட்ட ஆவிக்குரிய வரங்களுக்கு மட்டும் வரையறுக்காமல் விடுகிறது.
theological_decisions:
- issue: πνεῦμα τὸ ἐκ τοῦ θεοῦ என்பது குறிப்பாகத் தூய ஆவியைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘கடவுளிடமிருந்து வரும் ஆவி’ என்று மொழிபெயர்த்து, அடிக்குறிப்பில் தூய ஆவி என்ற சூழல்சார் புரிதலைக் குறிப்பிடுதல்
  alternative: ‘கடவுளிடமிருந்து வரும் தூய ஆவி’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: உடனடியான சூழலில் இது தூய ஆவியைக் குறிப்பதே மிகவும் இயல்பு. எனினும், கிரேக்கத்தில் ‘தூய’ என்ற சொல் இங்கு வெளிப்படையாக இல்லை; மேலும் தமிழில் ஆங்கிலம்போல் பெரிய எழுத்தால் வேறுபடுத்த முடியாது. ஆகவே முதன்மை உரை மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு சூழல்சார் அடையாளத்தை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘நாமோ’ எதிர்மறை வேறுபாட்டை இயல்பாகக் காட்டுகிறது; நீண்ட கிரேக்க வாக்கியத்தின் நோக்கப்பகுதியைத் தெளிவாக்க நீள்கோடு பயன்படுத்தப்பட்டுள்ளது.
