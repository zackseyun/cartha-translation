id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: ta
  text: கடவுள் இவற்றை[a] ஆவியானவர் மூலமாக நமக்கு வெளிப்படுத்தியிருக்கிறார். ஏனெனில், ஆவியானவர் எல்லாவற்றையும், கடவுளின் ஆழங்களைக்கூட[b] ஆராய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றை”; கிரேக்கத்தில் நேரடிச் செயப்படுபொருள் வெளிப்படையாகச் சொல்லப்படவில்லை; முந்தைய சூழலிலிருந்து அது பெறப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “கடவுளின் ஆழமான காரியங்களைக்கூட.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκάλυψεν
  choice: வெளிப்படுத்தியிருக்கிறார்
  rationale: இறந்தகாலத்தில் நிகழ்ந்த வெளிப்பாடு இப்போது பெற்றிருக்கப்படும் நிலையைத் தமிழில் இயல்பாக உணர்த்துகிறது; கிரேக்க இறந்தகால வினையின் நிறைவு இயல்பையும் காக்கிறது.
- source_word: ἡμῖν
  choice: நமக்கு
  rationale: வெளிப்பாட்டைப் பெற்றவர்களைக் குறிக்கும் மறைமுகச் செயப்படுபொருளாக இங்கு வேற்றுமைப் பொருள் அமைகிறது.
- source_word: '[implicit object of ἀπεκάλυψεν]'
  choice: இவற்றை
  rationale: கிரேக்கத்தில் நேரடிச் செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய வசனத்தின் கருத்திலிருந்து அதைத் தெளிவாகவும் சுருக்கமாகவும் எடுத்துரைக்கிறது.
- source_word: διὰ τοῦ πνεύματος
  choice: ஆவியானவர் மூலமாக
  rationale: διά + உரிமை வேற்றுமை, வெளிப்பாடு நிகழ்ந்த வழிமுறை அல்லது இடைமுகச் செயலாற்றலைக் குறிக்கிறது.
- source_word: πνεῦμα
  choice: ஆவியானவர்
  rationale: தெய்வீக வெளிப்பாட்டையும் கடவுளின் ஆழங்களை அறிதலையும் கூறும் சூழல் தூய ஆவியையே வலுவாகச் சுட்டுகிறது; மரியாதைமிக்க ஆளுமைச் சொல்லாக்கம் தமிழில் இயல்பானது.
- source_word: ἐραυνᾷ
  choice: ஆராய்கிறார்
  rationale: ஆழமாகத் தேடி அறியும் செயற்பாட்டை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: கிரேக்கச் சொல்லின் விரிவான எல்லையை முழுமையாகக் காக்கிறது.
- source_word: καὶ
  choice: -க்கூட
  rationale: 'இங்கு καί உச்சநிலையை வலியுறுத்துகிறது: எல்லாவற்றுடன் குறிப்பாகக் கடவுளின் ஆழங்களையும் ஆராய்கிறார்.'
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: கடவுளின் ஆழங்கள்
  rationale: ‘ஆழம்’ என்ற உருவகத்தை விளக்கமாக மாற்றாமல், கிரேக்கப் பன்மையையும் நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: πνεῦμα என்பது தூய ஆவியையா அல்லது மனித ஆவியையா குறிக்கிறது?
  choice: இரு இடங்களிலும் தூய ஆவியைக் குறிக்கும் வகையில் ‘ஆவியானவர்’
  alternative: பொதுவான பொருளில் மனித ஆவி
  rationale: வெளிப்பாட்டைக் கடவுள் ஆவியின் மூலமாக அளிப்பதும், அந்த ஆவி கடவுளின் ஆழங்களைக்கூட ஆராய்வதும் மனித ஆவியைவிடத் தூய ஆவியையே தெளிவாகச் சுட்டுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆழங்கள்’ என்ற சற்றே செறிவான உருவகம் மூலத்தின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் காக்கிறது; அடிக்குறிப்பு இயல்பான மாற்றுச் சொல்லாக்கத்தை வழங்குகிறது.
