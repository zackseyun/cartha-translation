base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: ta
  text: ஆனால், மறைபொருளாகிய[a] கடவுளின் ஞானத்தை நாங்கள் பேசுகிறோம்; மறைக்கப்பட்டிருந்த அந்த ஞானத்தைக் கடவுள் யுகங்களுக்கு முன்பே[c] நமது மகிமைக்காக முன்குறித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறைவாக.” கிரேக்கத்தில் “மறைபொருள்” என்ற சொல் உள்ளது; பவுல் இதை முன்பு மறைக்கப்பட்டு, இப்போது வெளிப்படுத்தப்பட்ட கடவுளின் திட்டத்தைக் குறிக்க அடிக்கடி பயன்படுத்துகிறார்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முன்நியமித்தார்” அல்லது “முன்னதாகவே தீர்மானித்தார்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எல்லா யுகங்களுக்கும் முன்பே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: நாங்கள் பேசுகிறோம்
  rationale: λαλέω என்பதன் நேரடியான பொருளைத் தக்கவைத்து, முந்தைய கருத்துடன் பவுல் காட்டும் முரண்பாட்டை மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θεοῦ σοφίαν
  choice: கடவுளின் ஞானத்தை
  rationale: உடைமை வேற்றுமையை இயல்பான தமிழில் வழங்கி, இந்த ஞானம் கடவுளுக்குரியது என்பதைக் காக்கிறது.
- source_word: ἐν μυστηρίῳ
  choice: ஒரு மறைபொருளாக
  rationale: μυστήριον என்பது வெறும் புரியாத புதிரை அல்ல, முன்பு மறைக்கப்பட்டிருந்து வெளிப்படுத்தப்படும் கடவுளின் திட்டத்தைக் குறிக்கக்கூடிய பவுலின் சொல்லாட்சி. தமிழில் ‘மறைபொருள்’ அந்த நுணுக்கத்தைச் சுருக்கமாகக் காக்கிறது; ἐν என்பதன் பயன்பாடு இங்கு விதம் அல்லது தன்மையைக் குறிக்கக்கூடியதால் ‘-ஆக’ என வழங்கப்பட்டுள்ளது.
- source_word: τὴν ἀποκεκρυμμένην
  choice: மறைக்கப்பட்டிருந்த அந்த ஞானத்தை
  rationale: பெண்பால் ஒருமைச் செயப்படுபெயரெச்சம் ‘ஞானத்தை’ மீண்டும் சுட்டுகிறது. கிரேக்க நிறைவுநிலையின் விளைவைக் காட்ட ‘மறைக்கப்பட்டிருந்த’ என வழங்கப்பட்டுள்ளது.
- source_word: προώρισεν
  choice: முன்குறித்தார்
  rationale: கடவுளின் முந்தைய நிர்ணயத்தைச் சுருக்கமாகவும் வலிமையுடனும் வெளிப்படுத்துகிறது; அதன் இறையியல் விளைவுகளை மொழிபெயர்ப்பிலேயே விரித்துரைக்கவில்லை.
- source_word: πρὸ τῶν αἰώνων
  choice: காலங்களுக்கு முன்பே
  rationale: αἰῶνες என்பதன் பன்மை மற்றும் காலவெளி சார்ந்த சொல்லாட்சியைத் தக்கவைக்கிறது; ‘உலகம் தோன்றுமுன்’ என்ற விளக்கமளிக்கும் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: εἰς δόξαν ἡμῶν
  choice: நமது மகிமைக்காக
  rationale: εἰς என்பதன் நோக்கத் திசையையும் δόξα என்பதன் இறையியல் நிறையையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: προώρισεν என்பதிலுள்ள முன்னரே நிர்ணயித்தல் என்ற இறையியல் வலிமை
  choice: முன்குறித்தார்
  alternative: முன்னதாகவே தீர்மானித்தார் / முன்நியமித்தார்
  rationale: மூல வினைச்சொல் முன்கூட்டிய நிர்ணயத்தைக் கூறுகிறது. ‘முன்குறித்தார்’ அந்த வலிமையைப் பாதுகாக்கிறது; ஆனால் எந்தக் குறிப்பிட்ட சமயப்பிரிவின் முன்னறிவிப்பு அல்லது முன்நியமனக் கோட்பாட்டையும் உரைக்குள் சேர்ப்பதில்லை.
- issue: ἐν μυστηρίῳ என்பதன் பொருள்
  choice: ஒரு மறைபொருளாக
  alternative: மறைவாக / ஒரு இரகசியத்தில்
  rationale: இது பேசும் விதத்தையோ, மறைக்கப்பட்ட தெய்வீகத் திட்டத்தின் தன்மையையோ குறிக்கலாம். ‘மறைபொருள்’ பவுலின் சொல்லின் இறையியல் நுணுக்கத்தைக் காக்கிறது; அடிக்குறிப்பு உண்மையான சொற்பொருள் மாற்றைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘மறைபொருள்,’ ‘முன்குறித்தார்,’ ‘மகிமை’ ஆகிய சொற்கள் மூலத்தின் இறையியல் செறிவையும் தெளிவின்மையையும் தக்கவைக்கத் தேர்ந்தெடுக்கப்பட்டன.
