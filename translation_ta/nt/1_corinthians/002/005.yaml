id: 1CO.2.5
reference: 1 Corinthians 2:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: ta
  text: உங்கள் விசுவாசம் மனித ஞானத்தில் அல்ல, கடவுளின் வல்லமையில் இருக்கும்படியாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: நிலைத்திருக்கும்படியாகவே
  rationale: இது பவுலின் நோக்கத்தைக் குறிக்கும் ἵνα துணைவாக்கியத்தின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இறுதியில் வரும் ‘வே’ நோக்கத்திற்கான அழுத்தத்தையும் தருகிறது.
- source_word: ἡ πίστις ὑμῶν
  choice: உங்கள் விசுவாசம்
  rationale: இங்கு πίστις கொரிந்தியர்களின் நம்பிக்கையுள்ள பதிலைக் குறிக்கிறது; ‘விசுவாசம்’ நவீன வேதாகமத் தமிழில் தெளிவானதும் வழக்கமானதும் ஆகும்.
- source_word: μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων
  choice: மனித ஞானத்தில் அல்ல
  rationale: ἀνθρώπων இங்கு ஆண் பாலினத்தாரை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ‘மனித ஞானம்’ அந்த உள்ளடக்கிய பொருளைத் தமிழில் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: ἀλλ’ ἐν δυνάμει θεοῦ
  choice: கடவுளின் வல்லமையில்
  rationale: ἀλλά உருவாக்கும் நேரடியான முரண்பாட்டையும், ἐν என்பதின் அடித்தளம் அல்லது சார்பு என்ற நுணுக்கத்தையும் ‘அல்ல ... வல்லமையில்’ என்ற இணை அமைப்பு காக்கிறது.
- source_word: ᾖ ἐν
  choice: நிலைத்திருக்க
  rationale: ‘இருக்க’ என்பது மிக நேரடியான மாற்று; ஆனால் விசுவாசம் எதன்மீது சார்ந்துள்ளது அல்லது எதில் ஆதாரம் கொண்டுள்ளது என்பதே சூழலின் கருத்தாக இருப்பதால் ‘நிலைத்திருக்க’ இயல்பான தமிழில் அதனைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: விசுவாசம் ‘எதில்’ இருக்கிறது என்பதன் பொருள்
  choice: ‘நிலைத்திருக்க’ என்று மொழிபெயர்த்து, மனித ஞானத்துக்கு மாறாக கடவுளின் வல்லமையே விசுவாசத்தின் அடித்தளம் என்பதை வெளிப்படுத்துதல்
  alternative: ‘இருக்கும்படியாக’ என்று சொற்சொல்லாக மொழிபெயர்த்தல்
  rationale: இது விசுவாசம் மனிதத் தர்க்கத்தால் உருவாகிறது என்றோ, கடவுளின் வல்லமையில் ஆதாரம் கொண்டுள்ளது என்றோ உள்ள எதிர்மறை ஒப்புமையை இயல்பான தமிழில் காக்கிறது; கடவுளின் வல்லமை எவ்விதத்தில் செயல்படுகிறது என்பதை வசனம் கூறாததால் அதை மேலதிகமாக வரையறுக்கவில்லை.
- issue: ἀνθρώπων என்பதன் பாலின மற்றும் பொதுப்பொருள்
  choice: ‘மனித’
  alternative: ‘மனிதர்களின்’ அல்லது ‘ஆண்களின்’
  rationale: கிரேக்கப் பன்மை இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. ‘மனித ஞானம்’ பாலின வரம்பைத் தவிர்த்து மூலத்தின் உண்மையான பொதுப்பொருளை நேரடியாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் ‘மனித ஞானம் / கடவுளின் வல்லமை’ என்ற இணையான எதிர்மறை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
