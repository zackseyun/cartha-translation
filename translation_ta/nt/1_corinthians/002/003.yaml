base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/003.yaml
  text: And I was with you in weakness[a], in fear, and in great trembling,
translation:
  language: ta
  text: நானும் பலவீனத்திலும் பயத்திலும் மிகுந்த நடுக்கத்திலும் உங்களோடு இருந்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நானும் பலவீனத்திலும் பயத்திலும் மிகுந்த நடுக்கத்திலும் உங்களிடம் வந்தேன்.”
    reason: ἐγενόμην πρὸς ὑμᾶς என்ற கிரேக்கச் சொற்றொடர் பவுல் அவர்களோடு இருந்ததையோ அவர்களிடம் வந்ததையோ குறிக்கக்கூடும்.
lexical_decisions:
- source_word: κἀγώ
  choice: நானும்
  rationale: καί என்பதன் இணைப்புத் தன்மையையும் ἐγώ என்பதன் வெளிப்படையான தன்மைக் குறிப்பையும் இயல்பான தமிழில் காக்கிறது; தேவையற்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: ἐν ἀσθενείᾳ
  choice: பலவீனத்தில்
  rationale: ἀσθένεια உடல், மனம், சூழ்நிலை சார்ந்த பலவீனம் அல்லது வலுவின்மை ஆகியவற்றை உள்ளடக்கக்கூடும்; ‘பலவீனம்’ அந்தப் பரப்பைத் திறந்தவாறே வைக்கிறது.
- source_word: ἐν φόβῳ
  choice: பயத்தில்
  rationale: φόβος என்பதை ‘பயம்’ என்று நேரடியாக மொழிபெயர்த்து, அதை வெறும் பயபக்தி அல்லது எச்சரிக்கை என்று மென்மைப்படுத்தாமல் பவுல் கூறும் நிலையைக் காக்கிறது.
- source_word: ἐν τρόμῳ πολλῷ
  choice: மிகுந்த நடுக்கத்தில்
  rationale: τρόμος என்பதன் ‘நடுக்கம்’ என்ற பொருளையும் πολλῷ தரும் தீவிரத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: உங்களோடு இருந்தேன்
  rationale: கொரிந்தியரின் முன்னிலையில் பவுல் இருந்த நிலையைக் குறிக்கும் இயல்பான தமிழ். இச்சொற்றொடர் ‘உங்களிடம் வந்தேன்’ என்றும் புரிந்துகொள்ளக்கூடியதால் அந்த வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
