source:
  edition: SBLGNT
  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: ta
  text: 'இவற்றையும் நாங்கள் பேசுகிறோம்: மனித ஞானம் கற்பித்த சொற்களால் அல்ல, ஆவியானவர் கற்பித்த சொற்களால்; ஆவிக்குரியவற்றை ஆவிக்குரிய சொற்களால் விளக்குகிறோம்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவிக்குரியவர்களுக்கு ஆவிக்குரியவற்றை விளக்குகிறோம்.” கிரேக்கத்தில் πνευματικοῖς என்பதை மறைமுகமாகக் கொள்ளப்படும் “ஆவிக்குரிய சொற்களால்” எனவோ, “ஆவிக்குரியவர்களுக்கு” எனவோ எடுத்துக்கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: இவற்றையே
  rationale: முன்பு கூறப்பட்ட கடவுள் அருளியவற்றைச் சுட்டுகிறது; ஏ வலியுறுத்தல் καί உடன் வரும் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: λαλοῦμεν
  choice: நாங்களும் பேசுகிறோம்
  rationale: வாய்மொழியாக அறிவித்தல் என்ற λαλέωவின் பொருளையும், பவுலும் உடன் பணியாளர்களும் பேசுவதைச் சுட்டும் பன்மையையும் காக்கிறது.
- source_word: διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: மனித ஞானம் கற்றுக்கொடுத்த சொற்களால்
  rationale: ἐν என்பதன் கருவிப் பொருளையும், சொற்களின் கற்பித்தல் மூலமாக மனித ஞானம் இருப்பதையும் தெளிவாகத் தருகிறது.
- source_word: διδακτοῖς πνεύματος
  choice: ஆவியானவர் கற்றுக்கொடுத்த சொற்களால்
  rationale: முந்தைய λόγοις என்பதை இயல்பாக நிரப்பி, சூழலில் πνεῦμα பரிசுத்த ஆவியானவரைக் குறிக்கிறது என்பதை வெளிப்படுத்துகிறது.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: ஆவிக்குரியவற்றை ஆவிக்குரிய சொற்களால் விளக்குகிறோம்
  rationale: முந்தைய சொற்கள் பற்றிய எதிர்மறை–நேர்மறை ஒப்பீட்டோடு நன்கு இணைகிறது. எனினும் πνευματικοῖς ஆண்பால் நபர்களைக் குறிக்கக்கூடிய இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: πνεύματος என்பதன் குறிப்பு
  choice: ஆவியானவர்
  alternative: ஆவி அல்லது ஆவிக்குரிய மூலம்
  rationale: 1 கொரிந்தியர் 2-ன் உடனடிச் சூழல் மனித ஞானத்தை கடவுளின் ஆவியோடு எதிரெதிராக வைக்கிறது; ஆகவே தனிப்பட்ட பரிசுத்த ஆவியானவரே இயல்பான குறிப்பு.
- issue: πνευματικοῖς என்பதன் பாலினமும் இறுதி சொற்றொடரின் பொருளும்
  choice: ஆவிக்குரிய சொற்களால்
  alternative: ஆவிக்குரியவர்களுக்கு ஆவிக்குரியவற்றை விளக்குகிறோம்
  rationale: நடுநிலைப் பன்மையாகவும், முன் வந்த λόγοις என்பதன் மறைமுகத் தொடர்ச்சியாகவும் வாசிப்பது சொற்களைப் பற்றிய உடனடி வாதத்துக்கு ஏற்றது; ஆண்பால் நபர்களைக் குறிக்கும் வாசிப்பும் உண்மையான சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. “ஆவியானவர்” என்பது சூழலில் பரிசுத்த ஆவியைக் குறிக்கிறது. கிரேக்க இறுதி சொற்றொடரின் உண்மையான இலக்கணத் தெளிவின்மை முதன்மை உரையும் அடிக்குறிப்பும் சேர்ந்து பாதுகாக்கப்படுகிறது.
