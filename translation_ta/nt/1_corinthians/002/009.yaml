id: 1CO.2.9
reference: 1 Corinthians 2:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: ta
  text: 'ஆனால், எழுதப்பட்டிருக்கிறபடியே:

    “கண் காணாததும்,

    காது கேட்காததும்,

    மனிதனுடைய[a] இதயத்தில் தோன்றாததுமானவற்றை[b]—

    தம்மை நேசிக்கிறவர்களுக்காகக் கடவுள் ஆயத்தம் செய்திருக்கிறார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதன்” என்பது இங்கு ஆணை மட்டும் குறிக்காமல், மனிதர்கள் அனைவரையும் பொதுப்படையாகக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “மனித இதயத்தில் நுழையாதவை” அல்லது “எவருடைய எண்ணத்திலும் உதிக்காதவை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள எதிர்மறைத் தொடர்பை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: καθὼς γέγραπται
  choice: எழுதப்பட்டிருக்கிறபடியே
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் வழக்குச் சூத்திரத்தையும், எழுதப்பட்டவை தொடர்ந்து நிலைத்திருப்பதைக் காட்டும் நிறைவு நிலையையும் காக்கிறது.
- source_word: Ἃ ... ὅσα
  choice: கண் காணாததும் ... தோன்றாததுமானவற்றை
  rationale: முதல் தொடர்புப்பெயர் தொடரைத் தமிழில் ஒருங்கிணைந்த பெயரெச்சத் தொடராக அமைத்து, பின்னர் வரும் கடவுளின் செயலை அதன் முதன்மை வினையாகக் கொடுக்கிறது; கிரேக்கத்தின் மீளெடுக்கும் அமைப்பை தமிழில் கடினமாக்காமல் அதன் பொருளையும் கவித்துவ இணைப்பையும் காக்கிறது.
- source_word: ὀφθαλμὸς / οὖς
  choice: கண் / காது
  rationale: கிரேக்கத்தில் உள்ள ஒருமை பொதுப்படையான உறுப்புப்பெயர்களையும் அவற்றின் இணை அமைப்பையும் நேரடியாகக் காக்கிறது.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: மனிதனுடைய இதயத்தில் தோன்றாதது
  rationale: சொல்லுக்கு சொல் ‘மனிதனின் இதயத்தின்மேல் ஏறாதது’ என்ற உருவகத்தை இயல்பான தமிழில் ‘இதயத்தில் தோன்றாதது’ என வழங்குகிறது; ‘இதயம்’ என்பதைக் காத்து, அது எண்ணத்தில் உதிப்பதையும் உள்ளத்தில் எழுவதையும் குறிக்கக்கூடிய நெகிழ்வை விடுகிறது.
- source_word: ἡτοίμασεν
  choice: ஆயத்தம் செய்திருக்கிறார்
  rationale: கடவுள் செய்து முடித்த ஆயத்தம் தற்போதும் பொருத்தமுடையதாக இருப்பதை இயல்பான தமிழ் நிறைவு வினை வடிவில் வெளிப்படுத்துகிறது.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: தம்மை நேசிக்கிறவர்களுக்காக
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடரும் பண்பை இயல்பான தமிழ் தொடர்புப்பெயர் வடிவில் தருகிறது; ‘தம்மை’ என்பது எழுவாயான கடவுளையே திரும்பச் சுட்டுகிறது.
theological_decisions:
- issue: ἀνθρώπου என்ற ஒருமை பொதுப்படையான சொல்லின் மொழிபெயர்ப்பு
  choice: மனிதனுடைய
  alternative: மனித இதயத்தில் / ஒருவருடைய இதயத்தில்
  rationale: கிரேக்கத்தின் ஒருமை வடிவத்தை நெருக்கமாகக் காக்கிறது; இங்கு ஆண்களை மட்டும் அல்ல, மனிதர்கள் அனைவரையும் பொதுப்படையாகக் குறிக்கும் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: ‘இதயத்தில் ஏறவில்லை’ என்ற உருவகத்தின் பொருள்
  choice: இதயத்தில் தோன்றாதது
  alternative: இதயத்தில் நுழையாதது / எவருடைய எண்ணத்திலும் உதிக்காதது
  rationale: ‘இதயம்’ என்ற வேதாகமச் சொல்லாட்சியை மாற்றாமல் வைத்து, தமிழில் புரியாத சொல்லுக்கு சொல் உருவகத்தைத் தவிர்க்கிறது; எண்ணம், கற்பனை, உள்ளுணர்வு ஆகியவற்றில் ஒன்றை மட்டும் இறுக்கமாகத் தேர்ந்தெடுக்காமல் மூலத்தின் பொருள் நெகிழ்வைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. மேற்கோளின் கவித்துவ இணை அமைப்பைக் காட்ட வரிப்பிரிப்பு வைக்கப்பட்டுள்ளது; அரிதான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
