  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς φρονίμοις λέγω· κρίνατε ὑμεῖς ὅ φημι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/015.yaml
  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: ta
  text: விவேகமுள்ளவர்களிடம் பேசுகிறேன்; நான் சொல்வதை நீங்களே மதிப்பிடுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஞானமுள்ளவர்களிடம் பேசுகிறேன்” அல்லது “பகுத்தறிவுள்ளவர்களிடம் பேசுகிறேன்.”
    reason: φρονίμοις என்பதன் நடைமுறை ஞானம், விவேகம், நல்லுணர்வு ஆகிய பொருள் நிழல்களைக் காட்டும் சொல்லியல் மாற்று.
lexical_decisions:
- source_word: ὡς φρονίμοις
  choice: பகுத்தறிவுள்ளவர்களிடம் பேசுவதுபோல்
  rationale: ὡς இங்கு பவுல் தன் வாசகர்களை எத்தகையவர்களாகக் கருதிப் பேசுகிறார் என்பதைக் காட்டுகிறது; φρόνιμος நடைமுறை அறிவும் விவேகமும் உடையவரைக் குறிக்கிறது. ‘பகுத்தறிவுள்ளவர்கள்’ என்பது மிகைப்படுத்தாமல் அந்தப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: λέγω
  choice: பேசுகிறேன்
  rationale: முதல் கூறில், வாசகர்களை நோக்கிப் பேசும் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κρίνατε
  choice: தீர்மானியுங்கள்
  rationale: κρίνω இங்கு கூறப்பட்டதை ஆராய்ந்து மதிப்பிட்டு ஒரு முடிவுக்கு வருமாறு விடுக்கும் கட்டளையாக உள்ளது; ‘தீர்மானியுங்கள்’ அந்த மதிப்பீட்டுச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὑμεῖς
  choice: நீங்களே
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடப்பட்டுள்ள ὑμεῖς வலியுறுத்தலைக் கொண்டது; தமிழில் ‘நீங்களே’ அதைப் பாதுகாக்கிறது.
- source_word: ὅ φημι
  choice: நான் சொல்வதை
  rationale: உறவுப்பெயரான ὅ மற்றும் φημί ஆகியவற்றை இயல்பான, சுருக்கமான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: வாசகர்களைப் பற்றிய சொல்லாட்சியின் தன்மை
  choice: அவர்கள் பகுத்தறிந்து மதிப்பிடக் கூடியவர்கள் என பவுல் நேர்மறையாகவும் அளவோடும் அழைக்கிறார்
  alternative: இதை நையாண்டியாகவோ, அவர்களை முழுமையாக ஞானிகள் என்று பாராட்டுவதாகவோ வாசித்தல்
  rationale: வாக்கியம் பவுலின் வாதத்தை அவர்களே மதிப்பிடும்படி அழைக்கிறது. மூலத்தில் நையாண்டி வெளிப்படையாகக் குறிக்கப்படாததால் மொழிபெயர்ப்பு அதைக் கட்டாயப்படுத்தவில்லை; அதேவேளை ‘பகுத்தறிவுள்ளவர்கள்’ என்பது அவர்களின் எல்லா நடத்தைக்கும் ஒப்புதல் அளிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தின் வலியுறுத்தல் ‘நீங்களே’ என்பதால் காக்கப்பட்டுள்ளது; φρόνιμος என்பதன் நடைமுறை விவேகப் பொருள் ‘பகுத்தறிவுள்ளவர்கள்’ என வழங்கப்பட்டுள்ளது.
