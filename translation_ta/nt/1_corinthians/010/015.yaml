revisions:
- from: பகுத்தறிவுள்ளவர்களிடம் பேசுவதுபோல் பேசுகிறேன்; நான் சொல்வதை நீங்களே தீர்மானியுங்கள்.[a]
  to: விவேகமுள்ளவர்களிடம் பேசுகிறேன்; நான் சொல்வதை நீங்களே மதிப்பிடுங்கள்.[a]
  rationale: The revision removes the unsupported comparative-as-if implication and Tamil verbal repetition, while retaining the Greek’s direct address, practical-discernment characterization, and emphatic "you yourselves." It also uses an evaluative imperative that fits κρίνατε without requiring a particular conclusion.
  reviewer_model: gpt-5.6-terra
