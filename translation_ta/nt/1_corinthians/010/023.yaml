id: 1CO.10.23
reference: 1 Corinthians 10:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Πάντα ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. ⸁πάντα ἔξεστιν· ἀλλ’ οὐ πάντα οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: ta
  text: “எல்லாம் அனுமதிக்கப்பட்டவை”[a]; ஆனால் எல்லாம் நன்மை பயப்பதில்லை. “எல்லாம் அனுமதிக்கப்பட்டவை”; ஆனால் எல்லாம் கட்டியெழுப்புவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாம் சட்டப்படி உரியவை.” கிரேக்கச் சொற்றொடர் அனுமதிக்கப்பட்டதையோ சட்டப்படி உரியதையோ குறிக்கலாம். மேற்கோள் குறிகள், இது பவுல் வரம்பிட்டு மறுமொழி கூறும் கொரிந்தியரின் வாசகமாக இருக்கலாம் என்பதைக் காட்டுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: எல்லாவற்றையும்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலைப் பன்மை வடிவம்; அனுமதிக்கப்பட்ட செயல்கள் அனைத்தையும் உள்ளடக்கும் பரந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἔξεστιν
  choice: செய்ய அனுமதி உண்டு
  rationale: அனுமதிக்கப்பட்டது அல்லது சட்டப்படி ஏற்றது என்ற பொருளுடையது. தமிழில் வாக்கியத்தை முழுமையாக்க ‘செய்ய’ என்பது சூழலுக்கேற்றவாறு வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: இரண்டு கூற்றுகளுக்கிடையிலான நேரடியான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: συμφέρει
  choice: பயனளிப்பதில்லை
  rationale: நன்மை தருதல், உதவியாக அல்லது சாதகமாக இருத்தல் என்ற பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: οἰκοδομεῖ
  choice: கட்டியெழுப்புவதில்லை
  rationale: சமூகத்தையோ ஒருவரையோ வலுப்படுத்துதல் என்ற பவுலின் உருவகத்தைத் தக்கவைத்து, புரிந்துகொள்ளக்கூடிய தமிழில் வழங்குகிறது.
theological_decisions:
- issue: Πάντα ἔξεστιν என்பது கொரிந்தியரின் மேற்கோள் வாசகமா?
  choice: “எல்லாவற்றையும் செய்ய அனுமதி உண்டு” என்று மேற்கோள் குறிகளுடன் வழங்குதல்
  alternative: மேற்கோள் குறிகளின்றி பவுலின் நேரடிக் கூற்றாக வழங்குதல்
  rationale: இது பவுல் வரம்பிட்டு மறுமொழி கூறும் கொரிந்தியரின் வாசகமாக இருக்கலாம். பண்டைய கிரேக்கப் பிரதிகளில் நவீன மேற்கோள் குறிகள் இல்லாததால், இந்தப் புரிதல் உறுதியான உரை வேறுபாடு அல்ல; விளக்கத்திற்குரிய நிறுத்தக்குறித் தீர்மானம். அடிக்குறிப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. இருமுறை வரும் வாசகத்தின் சொல்லமைப்பு தக்கவைக்கப்பட்டுள்ளது; ‘கட்டியெழுப்புதல்’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளது.
