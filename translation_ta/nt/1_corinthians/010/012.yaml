  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: ta
  text: ஆகவே[a], தான் நிலைநின்றிருக்கிறான் என்று நினைப்பவன் விழாதபடி எச்சரிக்கையாக இருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனவே, தான் நிலைநின்றிருக்கிறான் என்று நினைப்பவன் விழாதபடி கவனமாக இருக்கட்டும்.”
    reason: 'சொல்லாக்க மாற்று: ὥστε என்பதற்கு ‘எனவே’ என்றும், βλεπέτω என்பதற்கு ‘கவனமாக இருக்கட்டும்’ என்றும் இயல்பாக மொழிபெயர்க்கலாம்.'
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய எச்சரிக்கை எடுத்துக்காட்டுகளிலிருந்து வரும் முடிவைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: ὁ δοκῶν
  choice: நினைக்கிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையின் ஒருமை பிரதிநிதித்துவத் தன்மையைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἑστάναι
  choice: தான் நிலைநிற்கிறதாக
  rationale: ἵστημι என்பதன் நிறைவுக்கால வினையெச்சம் குறிக்கும் நிலைத்திருக்கும் நிலையைக் காட்டுகிறது; ‘உறுதியாக’ போன்ற வெளிப்படாத வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: βλεπέτω
  choice: எச்சரிக்கையாக இருக்கட்டும்
  rationale: தொடர்ந்த விழிப்புணர்வைக் கோரும் நிகழ்காலக் கட்டளையின் எச்சரிக்கைத் தொனியை இயல்பான தமிழில் தருகிறது.
- source_word: μὴ πέσῃ
  choice: விழுந்துவிடாதபடி
  rationale: μή உடன் வரும் இறந்தகாலத் துணைவினை வெளிப்படுத்தும் எதிர்மறை நோக்கம் அல்லது எச்சரிக்கையைச் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: ‘விழுதல்’ என்பதன் தன்மை
  choice: ‘விழுந்துவிடாதபடி’ என்று பொதுவாகவே வைத்தல்
  alternative: பாவத்தில் விழாதபடி / நியாயத்தீர்ப்புக்கு உள்ளாகாதபடி / விசுவாசத்தைவிட்டு விலகாதபடி
  rationale: சூழல் இஸ்ரவேலரின் தோல்விகளால் வரும் எச்சரிக்கையைத் தருகிறது; ஆனால் πέσῃ எந்த ஒரு குறிப்பிட்ட விளைவையும் தனியே நிர்ணயிக்கவில்லை. ஆகவே மூலத்தின் இறையியல் பதற்றமும் பொருள் அகலமும் காக்கப்படுகின்றன.
- issue: பிரதிநிதித்துவ ஆண்பால் ஒருமை
  choice: ‘நினைக்கிறவன்’ என்ற ஆண்பால் ஒருமையை வைத்தல்
  alternative: நினைப்பவர் / நினைக்கிறவர்கள்
  rationale: கிரேக்கச் சொற்றொடர் இலக்கணத்தில் ஆண்பால் ஒருமையாக இருந்து பொதுவான பிரதிநிதியாகச் செயல்படுகிறது; தமிழ் வடிவம் அந்த அமைப்பை நேரடியாகப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் தெளிவாகவும் கண்ணியமாகவும் அமைந்த எச்சரிக்கைத் தொனி. ‘நிலைநிற்கிறதாக’ என்பது உருவகத்தின் திறந்த பொருளையும், ‘விழுந்துவிடாதபடி’ என்பது அதன் இறையியல் தெளிவின்மையையும் காக்கிறது.
