source:
  edition: SBLGNT
  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: ta
  text: நீங்களும் முறுமுறுக்க வேண்டாம்; அவர்களில் சிலர் முறுமுறுத்தார்கள், அழிப்பவனால் அழிக்கப்பட்டார்கள்; அப்படியே நீங்கள் இருக்க வேண்டாம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழிக்கும் தூதனால்.” கிரேக்க மூலத்தில் “அழிப்பவன்” என்றே உள்ளது; இது வனாந்தரத்தில் இஸ்ரவேலர்மீது வந்த தண்டனைகளில் அழிவை நிறைவேற்றியவரைக் குறிப்பதாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: நீங்களும் ... வேண்டாம்
  rationale: முந்தைய எச்சரிக்கைகளுடன் இந்தத் தடையை இணைக்கும் μηδέ என்பதன் தொடர்ச்சி வலிமையை இயல்பான தமிழில் ‘நீங்களும் ... வேண்டாம்’ என வெளிப்படுத்துகிறது.
- source_word: γογγύζετε
  choice: முறுமுறுக்க வேண்டாம்
  rationale: γογγύζω குறிக்கும் அதிருப்தியுடனான குறைகூறுதலை ‘முறுமுறுத்தல்’ துல்லியமாகவும் வேதாகமச் சூழலுக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: καθάπερ
  choice: '...துபோல'
  rationale: இஸ்ரவேலரின் முன்னுதாரணத்துடன் வாசகரை ஒப்பிடும் எச்சரிக்கைத் தன்மையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τινὲς αὐτῶν
  choice: அவர்களில் சிலர்
  rationale: பகுதியைக் குறிக்கும் கிரேக்கத் தொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது; முந்தைய சூழலில் குறிப்பிடப்பட்ட இஸ்ரவேலரில் சிலரைச் சுட்டுகிறது.
- source_word: ἐγόγγυσαν
  choice: முறுமுறுத்து
  rationale: நிகழ்காலக் கட்டளையில் பயன்படுத்திய அதே வேர்ச்சொல்லுடன் ஒத்திசைவைப் பேணுகிறது.
- source_word: ἀπώλοντο
  choice: அழிக்கப்பட்டனர்
  rationale: பின்வரும் செயற்படுத்துபவரைக் குறிக்கும் ὑπό தொடருக்கு ஏற்றபடி, வெளிப்புறச் செயலால் ஏற்பட்ட அழிவைச் செயப்பாட்டு வடிவில் தெரிவிக்கிறது.
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: அழிப்பவனால்
  rationale: கிரேக்கம் குறிப்பிடும் ‘அழிப்பவன்’ என்ற பெயரடைசார் பட்டத்தை மட்டும் பேணி, அந்த நபரை ‘தூதன்’ என்று மூலத்தைவிடத் திட்டவட்டமாக அடையாளப்படுத்துவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ὁ ὀλοθρευτής என்பவரின் அடையாளம்
  choice: அழிப்பவன்
  alternative: அழிக்கும் தூதன்
  rationale: மூலவாக்கியம் அழிவை நிறைவேற்றியவரை ஒரு பட்டத்தால் குறிப்பிடுகிறது; அவர் தூதன் என்று வெளிப்படையாகச் சொல்லவில்லை. ஆகவே அடையாளத்தின் தெளிவின்மையை முதன்மை உரை பேணுகிறது; விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை. ‘முறுமுறுத்தல்’ என்பது சாதாரண குறைகூறலைவிட அதிருப்தியுடன் தொடர்ந்து குறைகூறும் நுண்ணுணர்வைப் பேணுகிறது. ஒப்பீட்டு அமைப்பைத் தமிழில் இயல்பாக அமைய முன்வைத்து, இறுதியில் நேரடி தடையை வைத்துள்ளோம்.
