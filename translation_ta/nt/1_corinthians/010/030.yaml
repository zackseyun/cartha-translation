  text: εἰ ἐγὼ χάριτι μετέχω, τί βλασφημοῦμαι ὑπὲρ οὗ ἐγὼ εὐχαριστῶ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: ta
  text: நான் நன்றியுடன் உணவை உட்கொண்டால்,[a] நான் நன்றி செலுத்துகிற அதற்காக ஏன் பழித்துப் பேசப்படுகிறேன்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் கிருபையினால் உணவை உட்கொண்டால், நான் நன்றி செலுத்துகிற அதற்காக ஏன் பழித்துப் பேசப்படுகிறேன்?” χάριτι என்ற கிரேக்கச் சொல்லை “கிருபையினால்” என்றும் மொழிபெயர்க்கலாம். ஆனால் தொடர்ந்து வரும் “நன்றி செலுத்துகிறேன்” என்பதனால், இச்சூழலில் பலர் அதை “நன்றியுடன்” என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: நன்றியுடன்
  rationale: உணவைப் பற்றிய உடனடிச் சூழலும் தொடர்ந்து வரும் εὐχαριστῶ (‘நன்றி செலுத்துகிறேன்’) என்பதும், இங்கு மீட்புக்குரிய ‘கிருபையால்’ என்பதைக் காட்டிலும் நன்றியுணர்வுடன் பங்கெடுப்பதைக் குறிக்கின்றன. எனினும் மூலச்சொல்லின் ‘கிருபையால்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: μετέχω
  choice: உணவில் பங்கெடுக்கிறேன்
  rationale: μετέχω என்பதன் அடிப்படைப் பொருள் ‘பங்குகொள்’; இங்கு உணவு உண்ணும் சூழலைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்க ‘உணவில்’ சேர்க்கப்பட்டுள்ளது.
- source_word: βλασφημοῦμαι
  choice: பழித்துப் பேசப்படுகிறேன்
  rationale: இங்கு மனிதரான பவுலைப் பற்றிய தீய அல்லது கண்டனமான பேச்சே கருத்து; ‘தேவதூஷணம் செய்யப்படுகிறேன்’ என்பது தமிழில் தவறான இறையியல் உணர்வை உண்டாக்கும்.
- source_word: ὑπὲρ οὗ
  choice: எதற்காக ... அதற்காக
  rationale: பழிப்புக்கான காரணத்தையும் நன்றி செலுத்தப்படும் பொருளையும் இணைக்கும் கிரேக்கத் தொடர்பை இயல்பான தமிழ் இணைநிலை அமைப்பில் காக்கிறது.
- source_word: εὐχαριστῶ
  choice: நன்றி செலுத்துகிறேன்
  rationale: வினையின் நேரடியான பொருள் ‘நன்றி செலுத்துதல்’. நன்றி யாருக்குச் செலுத்தப்படுகிறது என்பது கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படாததால் ‘தேவனுக்கு’ என்று உரையில் சேர்க்கப்படவில்லை.
- source_word: ἐγὼ ... ἐγὼ
  choice: நான் ... நான்
  rationale: இருமுறை வெளிப்படையாக வரும் முதல் நபர் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் இரு வினைத்தொடர்களிலும் ‘நான்’ என்பதைக் கொண்டு பாதுகாக்கிறது.
- source_word: τί
  choice: ஏன்
  rationale: இந்த வினாவாக்கியத்தில் τί காரணத்தை வினவும் சொல்லாகப் பயன்படுகிறது; இயல்பான தமிழ் ‘ஏன்’ ஆகும்.
theological_decisions:
- issue: χάριτι என்பது உணவு உண்ணுதல் மற்றும் நன்றி செலுத்துதலுடன் கொண்டுள்ள பொருள்
  choice: நன்றியுடன்
  alternative: கிருபையால்
  rationale: அடுத்துள்ள ‘நன்றி செலுத்துகிறேன்’ என்பதும் உணவைப் பற்றிய சூழலும் நன்றியுணர்வு என்ற வாசிப்பை வலுப்படுத்துகின்றன. இருப்பினும் ‘கிருபையால்’ என்பது உண்மையான சொற்பொருள் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது; மீட்புக்குரிய கிருபை என்ற கருத்து உரைக்குள் கட்டாயமாக இறக்குமதி செய்யப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வினாவாக்கியம் பயன்படுத்தப்பட்டுள்ளது. ‘புசிக்கிறேன்’ போன்ற பழைய நடை தவிர்க்கப்பட்டு, சூழலைத் தெளிவாக்க ‘உணவில் பங்கெடுக்கிறேன்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் சொல்லியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
