id: 1CO.10.22
reference: 1 Corinthians 10:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἢ παραζηλοῦμεν τὸν κύριον; μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: ta
  text: அல்லது, நாம் ஆண்டவரைப் பொறாமைகொள்ளத் தூண்டுகிறோமா? நாம் அவரைவிட வலிமையானவர்கள் அல்லவே?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: எரிச்சலூட்டி, அவரைப் பொறாமைகொள்ளச் செய்கிறோமா
  rationale: வினைச்சொல் ஒருவரில் பொறாமை அல்லது தீவிரச் சினத்தைத் தூண்டுவதைக் குறிக்கிறது. இயல்பான தமிழில் அதன் காரணவினைப் பொருளையும் உணர்ச்சியின் தீவிரத்தையும் வெளிப்படுத்த இரு இணைந்த சொற்றொடர்கள் பயன்படுத்தப்பட்டன.
- source_word: τὸν κύριον
  choice: ஆண்டவருக்கு … அவரை
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் வேதாகமச் சொல் ‘ஆண்டவர்’; கிரேக்க உரையில் தனிப்பட்ட பெயர் இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: அவரைவிட வலிமையானவர்கள்
  rationale: ஒப்பீட்டுச் சொல்லின் நேரடியான பொருளையும் αὐτοῦ குறிக்கும் ஆண்டவரையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவரைப் பொறாமைகொள்ளச் செய்தல்’ என்ற மனித உணர்வை இறைவனுக்குப் பயன்படுத்தும் மொழி
  choice: மூலத்தில் உள்ள பொறாமை/சினம் சார்ந்த உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘ஆண்டவருக்குக் கோபமூட்டுகிறோமா?’ என்று பொதுமைப்படுத்தல்
  rationale: இது உபாகமம் 32:21-ஐ எதிரொலிக்கக்கூடும்; உடன்படிக்கை விசுவாசத்தை மீறுவதால் எழும் தனித்துவமான ‘jealousy’ கருத்தை வெறும் கோபமாகச் சுருக்காமல் பாதுகாக்க வேண்டும்.
- issue: μὴ தொடங்கும் எதிர்பார்ப்பு கொண்ட கேள்வி
  choice: ‘நாம் அவரைவிட வலிமையானவர்கள் அல்லவே?’
  alternative: ‘நிச்சயமாக நாம் அவரைவிட வலிமையானவர்கள் அல்ல’
  rationale: μὴ எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவைக் குறிக்கிறது. தமிழின் ‘அல்லவே?’ அதே வினாவுருவையும் வலியுறுத்தலையும் இயல்பாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. இரண்டு சொற்பொழிவுக் கேள்விகளும் மூலத்தின் எச்சரிக்கைத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
