  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: ta
  text: ஆகையால், என் அன்பானவர்களே, சிலைவழிபாட்டை விட்டு ஓடுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விக்கிரக வழிபாடு.”
