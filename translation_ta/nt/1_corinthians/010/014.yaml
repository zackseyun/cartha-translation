    text: அல்லது, “விக்கிரக வழிபாடு.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek’s logical connection, affectionate address, and urgent imperative while using a more economical and natural modern Tamil expression. The footnote is adjusted to provide a complete lexical alternative and retains the existing anchor.
