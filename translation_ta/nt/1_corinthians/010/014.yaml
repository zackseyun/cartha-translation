review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential force of Διόπερ, the affectionate plural vocative ἀγαπητοί μου, and the direct plural imperative. ‘சிலைவழிபாடு’ accurately renders εἰδωλολατρία in its broad sense of idol worship. However, ‘விலகி ஓடுங்கள்’ unnecessarily doubles the Greek’s single imperative φεύγετε and can sound stylistically heavy.
  naturalness: ‘ஆகையால், என் அன்புக்குரியவர்களே’ is understandable and appropriate, but ‘என் அன்பானவர்களே’ is more natural as a warm direct address in modern standard Tamil. ‘சிலைவழிபாட்டை விட்டு ஓடுங்கள்’ is concise, idiomatic, and retains the urgency of ‘flee from.’
  terminology: ‘சிலைவழிபாடு’ is a clear, neutral rendering of εἰδωλολατρία. The alternative ‘விக்கிரக வழிபாடு’ is valid, but the footnote should give the alternative term itself rather than an incomplete phrase ending in ‘-விட்டு.’
  issues:
  - severity: low
    issue: The verbal expression ‘விலகி ஓடுங்கள்’ duplicates the force of the one Greek imperative φεύγετε.
    rationale: The source has one urgent command, ‘flee,’ with ἀπό marking what is to be fled from. Tamil ‘விட்டு ஓடுங்கள்’ expresses this without adding a second near-synonymous action.
  - severity: low
    issue: The lexical-alternative footnote is phrased as ‘விக்கிரக வழிபாட்டைவிட்டு,’ which is not a self-contained alternative for the noun in the main text.
    rationale: Since the alternative concerns εἰδωλολατρία, the note should read ‘விக்கிரக வழிபாடு.’
  revised_text: ஆகையால், என் அன்பானவர்களே, சிலைவழிபாட்டை விட்டு ஓடுங்கள்.[a]
  revised_footnotes:
