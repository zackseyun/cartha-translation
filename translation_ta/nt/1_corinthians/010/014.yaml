revisions:
- from: ஆகையால், என் அன்புக்குரியவர்களே, சிலைவழிபாட்டைவிட்டு விலகி ஓடுங்கள்.[a]
  to: ஆகையால், என் அன்பானவர்களே, சிலைவழிபாட்டை விட்டு ஓடுங்கள்.[a]
  rationale: The revision preserves the Greek’s logical connection, affectionate address, and urgent imperative while using a more economical and natural modern Tamil expression. The footnote is adjusted to provide a complete lexical alternative and retains the existing anchor.
  reviewer_model: gpt-5.6-terra
