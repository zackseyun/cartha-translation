lexical_decisions:
- source_word: Διόπερ
  choice: ஆகையால்
  rationale: முந்தைய வாதத்திலிருந்து முடிவை எடுத்துரைக்கும் காரணவிளைவுத் தொடர்பை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἀγαπητοί μου
  choice: என் அன்புக்குரியவர்களே
  rationale: அன்பும் நெருக்கமும் கொண்ட பவுலின் நேரடி அழைப்பை, பன்மை விளியுடன் கண்ணியமான இயல்புத் தமிழில் தக்கவைக்கிறது.
- source_word: φεύγετε
  choice: விலகி ஓடுங்கள்
  rationale: இரண்டாம் நபர் பன்மைக்கான நிகழ்காலக் கட்டளையின் அவசரத்தையும் ஆபத்திலிருந்து தப்பிச் செல்லும் வலிமையையும் வெளிப்படுத்துகிறது; வெறுமனே ‘விலகுங்கள்’ என்பதைக் காட்டிலும் தீவிரமானது.
- source_word: ἀπὸ
  choice: விட்டு
  rationale: φεύγω என்பதுடன் வரும் பிரிவைத் தெரிவிக்கும் முன்னிடைச்சொல்லின் பொருளைத் தமிழில் ‘விலகி ஓடுங்கள்’ என்ற வினைத்தொடருடன் இயல்பாக இணைக்கிறது.
- source_word: τῆς εἰδωλολατρίας
  choice: சிலைவழிபாடு
  rationale: εἰδωλολατρία குறிக்கும் சிலைகள் அல்லது விக்கிரகங்களுக்கு செலுத்தப்படும் வழிபாடு மற்றும் சேவையை சாதாரண வாசகருக்குத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: தடையின் தன்மை
  choice: சிலைவழிபாட்டையும் அதனுடன் தொடர்புடைய நடைமுறைகளில் பங்கேற்பதையும் விட்டு முற்றிலும் விலகுமாறு கூறும் நேரடிக் கட்டளை
  alternative: சிலைகள்மீதான உள்ளார்ந்த பக்தியை மட்டும் தவிர்க்குமாறு கூறும் குறுகிய எச்சரிக்கை
  rationale: உடனடியான சூழலில் பவுல் பிறதெய்வ வழிபாட்டு விருந்துகளிலும் சடங்குகளிலும் பங்கேற்பதை எச்சரிக்கிறார். εἰδωλολατρία என்ற சொல் உள்ளார்ந்த மனப்பாங்கை மட்டும் அல்லாமல் சிலைவழிபாடு என்ற பரந்த நடைமுறையைக் குறிக்கிறது; எனவே மொழிபெயர்ப்பு அதைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; அன்பான அப்போஸ்தல அழைப்பையும் அவசரமான கட்டளையையும் இணைக்கும் கண்ணியமான, பொதுவாசகருக்குப் புரியக்கூடிய நடை. அடிக்குறிப்பு குறி பிரதான உரையில் இடம்பெற்றுள்ளது.
