id: 1CO.10.19
reference: 1 Corinthians 10:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί οὖν φημι; ὅτι ⸂εἰδωλόθυτόν τί ἐστιν, ἢ ὅτι εἴδωλόν⸃ τί ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/019.yaml
  text: What then am I saying? That food sacrificed to idols is anything[b][a], or that an idol is anything?
translation:
  language: ta
  text: அப்படியானால் நான் என்ன சொல்கிறேன்? சிலைகளுக்குப் பலியிடப்பட்ட உணவு ஏதாவது முக்கியத்துவம் உடையது என்றா, அல்லது ஒரு சிலை ஏதாவது முக்கியத்துவம் உடையது என்றா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί οὖν φημι
  choice: அப்படியானால், நான் என்ன சொல்கிறேன்?
  rationale: οὖν என்பதன் முடிவுரைத்தொடர்பையும், φημί என்பதன் நிகழ்கால முதல் நபர் வினாவையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ὅτι
  choice: என்றா
  rationale: பவுல் சொல்வதாகக் கருதப்படக்கூடிய கருத்தின் உள்ளடக்கத்தைத் தமிழின் மேற்கோள் வினா அமைப்பில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: εἰδωλόθυτόν
  choice: சிலைகளுக்குப் பலியிடப்பட்ட உணவு
  rationale: புறசமயப் பலியோடு தொடர்புடைய உணவைச் சுட்டும் சொல்லை, 1 கொரிந்தியர் 8–10 அதிகாரங்களின் உண்ணுதல் சார்ந்த சூழலுக்கேற்ற தெளிவான தமிழில் தருகிறது.
- source_word: τί ἐστιν
  choice: ஏதோ ஒன்றாகும்
  rationale: அது உண்மையான இருப்போ முக்கியத்துவமோ கொண்டதா என்ற கிரேக்கச் சொற்றொடரின் சுருக்கமான, வேண்டுமென்றே தீர்மானிக்கப்படாத வினாத்தன்மையைப் பாதுகாக்கிறது.
- source_word: ἢ
  choice: அல்லது
  rationale: இரண்டு இணையான வினாக்கூறுகளையும் எளிய பிரிப்பிடைச் சொல்லால் இணைக்கிறது.
- source_word: εἴδωλον
  choice: ஒரு சிலை
  rationale: இச்சூழலில் வழிபாட்டுக்குரியதாகக் கருதப்படும் உருவத்தைக் குறிக்கிறது; ‘சிலை’ என்பது இயல்பான நவீனத் தமிழ், மேலும் சூழல் அதன் விக்கிரகப் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: சிலைகளுக்கோ அவற்றுக்குப் பலியிடப்பட்ட உணவுக்கோ உண்மையான இருப்பு அல்லது ஆன்மிக முக்கியத்துவம் உண்டு என்று பவுல் கூறுகிறாரா?
  choice: இரண்டு கூறுகளையும் ‘ஏதோ ஒன்றாகும் என்றா?’ என்னும் மறைமுக மறுப்பைக் கொண்ட வினாக்களாக வழங்குதல்.
  alternative: ‘உண்மையான தெய்வீக இருப்பு உண்டென்றா?’ அல்லது ‘ஆன்மிக வல்லமை உண்டென்றா?’ என்று வெளிப்படையாக விளக்குதல்.
  rationale: மூலத்தின் τί ἐστιν திட்டமிட்டு சுருக்கமாகவும் பொருள்விரிவுக்கு இடமளிப்பதாகவும் உள்ளது. தெய்வீக இருப்பு, ஆன்மிக வல்லமை, அல்லது உள்ளார்ந்த முக்கியத்துவம் என்று முதன்மை உரையிலேயே குறிப்பிட்டுவிடாமல் அதன் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான வினா நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஏதோ ஒன்றாகும்’ என்ற சுருக்கமான தொடர், மூலத்தின் சொல்லாட்சி மற்றும் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
