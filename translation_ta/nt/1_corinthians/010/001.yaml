  terminology: ‘சகோதரர்களே,’ ‘நம் தந்தையர்,’ ‘மேகத்தின் கீழ்,’ and ‘கடலின் வழியாகக் கடந்துசென்றார்கள்’ appropriately preserve the familial, Exodus, and rhetorical language of the Greek. The footnote responsibly explains the potentially mixed-congregation reference of ἀδελφοί without altering the masculine plural wording in the text.
