id: 1CO.10.1
reference: 1 Corinthians 10:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: ta
  text: 'ஏனெனில், சகோதரர்களே[a], நீங்கள் அறியாமல் இருப்பதை நான் விரும்பவில்லை: நம் தந்தையர் அனைவரும் மேகத்தின் கீழ் இருந்தார்கள்; அனைவரும் கடலின் வழியாகக் கடந்துசென்றார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; ‘சகோதரர்கள்’ என்பதற்கான கிரேக்கச் சொல் ஆண்களும் பெண்களும் சேர்ந்த சபையினரைக் குறிக்கவும் பயன்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: நீங்கள் அறியாமல் இருப்பதை நான் விரும்பவில்லை
  rationale: கிரேக்கத்தின் எதிர்மறை வடிவத்தையும் பவுலின் வழக்கமான சொற்றொடரின் வலியுறுத்தலையும் காக்கிறது; ‘நீங்கள் அறிந்துகொள்ள வேண்டும்’ என நேர்மறையாக மாற்றவில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்தோடு இவ்வசனத்தை இணைக்கும் விளக்கத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை அழைப்பை இயல்பான தமிழ் விளிவடிவத்தில் காக்கிறது; முழுச் சபையையும் உள்ளடக்கும் பயன்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: οἱ πατέρες ἡμῶν
  choice: நம் தந்தையர்
  rationale: கொரிந்திய விசுவாசிகளை இஸ்ரவேலின் வரலாற்றோடு குடும்ப உறவுமுறையில் இணைக்கும் பவுலின் சொல்வடிவத்தை ‘முன்னோர்கள்’ எனப் பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: வசனத்தில் இருமுறை வரும் πάντες என்பதன் சொல்லாட்சிசார் வலியுறுத்தலை இரண்டு இடங்களிலும் காக்கிறது.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: மேகத்தின் கீழ் இருந்தார்கள்
  rationale: யாத்திராகம நிகழ்வின் மேகத்தைக் குறிக்கும் உருவகத்தை மேலதிக விளக்கமின்றி நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: கடலின் வழியாகக் கடந்துசென்றார்கள்
  rationale: διά என்பதன் ‘வழியாக’ என்ற இயக்கத்தையும் διέρχομαι என்பதன் கடந்து செல்லும் பொருளையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: கலப்பு பாலினத்தினரைக் கொண்ட சபைக்கு ἀδελφοί என்ற அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: முதன்மை உரையில் கிரேக்க ஆண்பால் பன்மை வடிவம் காக்கப்படுகிறது; சூழலில் அது முழுச் சபையையும் குறிக்கக்கூடியது என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: ‘நம் தந்தையர்’ என்பதில் புறவின விசுவாசிகளையும் இஸ்ரவேலின் வரலாற்றோடு இணைத்தல்
  choice: நம் தந்தையர்
  alternative: நம் முன்னோர்கள்
  rationale: பவுலின் குடும்பமுறைச் சொல்லையும் கொரிந்திய விசுவாசிகளை இஸ்ரவேலின் கதையோடு இணைக்கும் இறையியல் மற்றும் சொல்லாட்சிசார் பதற்றத்தையும் பொதுமைப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘அறியாமல் இருப்பதை நான் விரும்பவில்லை’ என்ற எதிர்மறை அமைப்பும், இருமுறை வரும் ‘அனைவரும்’ என்பதும், ‘நம் தந்தையர்’ என்ற குடும்பமுறை மொழியும் மூலத்தின் சொல்லாட்சிக்காக நோக்கத்துடன் காக்கப்பட்டுள்ளன.
