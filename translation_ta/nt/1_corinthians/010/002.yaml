lexical_decisions:
- source_word: πάντες
  choice: அனைவரும்
  rationale: இங்கு குறிப்பிடப்படும் இஸ்ரயேலர் அனைவரையும் கூட்டாகக் குறிக்கிறது; சுற்றியுள்ள வசனங்களில் பவுல் மீண்டும் மீண்டும் வலியுறுத்தும் ‘அனைவரும்’ என்ற கருத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: εἰς τὸν Μωϋσῆν
  choice: மோசேக்குள்
  rationale: கிரேக்கத்தின் வழக்கத்திற்கு மாறான ‘மோசேக்குள்’ என்ற அமைப்பையும் திருமுழுக்கு மொழியுடனான உருவக ஒப்புமையையும் இது தக்கவைக்கிறது; ‘மோசேயுடன் அடையாளப்படுத்தப்பட்டார்கள்’ என்று பொருளை ஒரே விளக்கமாகச் சுருக்கவில்லை.
- source_word: ἐβαπτίσαντο
  choice: திருமுழுக்கு பெற்றார்கள்
  rationale: நடுநிலை வினை வடிவத்தை இயல்பான தமிழில் பெறுபாட்டு உணர்வுடன் தருகிறது; ‘தாங்களே திருமுழுக்கு செய்துகொண்டார்கள்’ என்று நடுநிலை வடிவத்தை அளவுக்கு மீறி அழுத்துவதையும், வெறும் ‘மூழ்கினார்கள்’ என்று சூழலைத் தவறாகக் குறுக்குவதையும் தவிர்க்கிறது.
- source_word: ἐν τῇ νεφέλῃ
  choice: மேகத்தில்
  rationale: ἐν என்பதன் ‘இல்’ உணர்வையும் யாத்திராகம மேகக் காட்சியையும் தக்கவைக்கிறது; இடம், சூழல், கருவி அல்லது தொடர்பு ஆகிய சாத்திய நுணுக்கங்களைத் தீர்மானித்து விடவில்லை.
- source_word: ἐν τῇ θαλάσσῃ
  choice: கடலில்
  rationale: ‘கடல் வழியாக’ என்று διά-வின் பொருளை இறக்குமதி செய்யாமல், பவுலின் ἐν என்ற சொல்லாட்சியையும் ‘மேகத்தில்’ என்பதுடனான இணை அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: இஸ்ரயேலர் ‘மோசேக்குள் திருமுழுக்கு பெற்றார்கள்’ என்பதன் பொருள்
  choice: உருவக மற்றும் பிரதிநிதித்துவ மொழியை விளக்கித் தீர்மானிக்காமல் ‘மோசேக்குள்’ எனத் தக்கவைத்தல்
  alternative: ‘மோசேயுடன் அடையாளப்படுத்தப்பட்டார்கள்’ அல்லது ‘மோசேயின் தலைமையை ஏற்றார்கள்’
  rationale: இஸ்ரயேலரின் வெளியேற்ற அனுபவத்துக்கும் கிறிஸ்தவத் திருமுழுக்குக்கும் இடையே பவுல் உருவாக்கும் ஒப்புமை பல அடுக்குகள் கொண்டது. மொழிபெயர்ப்பு அதை ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாகச் சுருக்காமல் அதன் இறையியல் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மோசேக்குள்’ என்பது தமிழில் வழக்கமற்றதாக இருந்தாலும், மூலத்தின் திட்டமிட்ட வழக்கமின்மையையும் இறையியல் தெளிவின்மையையும் காக்கிறது. ‘திருமுழுக்கு’ என்பது திருச்சபைச் சூழலில் பரவலாக அறியப்படும் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; எந்த ஓர் திருமுழுக்கு முறையையும் தனியாக வலியுறுத்தவில்லை.
