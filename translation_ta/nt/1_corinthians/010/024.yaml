id: 1CO.10.24
reference: 1 Corinthians 10:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μηδεὶς τὸ ἑαυτοῦ ζητείτω ἀλλὰ τὸ τοῦ ⸀ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: ta
  text: ஒருவரும் தன் நலனைத் தேடாமல், மற்றவருடைய நலனைத் தேடட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “ஒருவரும் தனக்குரியதைத் தேடாமல், மற்றவருக்குரியதைத் தேடட்டும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς
  choice: ஒருவரும் ... தேடாமல்
  rationale: எதிர்மறை பொதுப்பொருள் கொண்ட μηδείς, கட்டளை வினையுடன் சேர்ந்து அனைவருக்கும் பொருந்தும் தடையைத் தெரிவிக்கிறது. தமிழில் ‘ஒருவரும் ... தேடாமல்’ என்பது அடுத்துள்ள நேர்மறைக் கட்டளையோடு இயல்பாக இணைகிறது.
- source_word: ζητείτω
  choice: தேடட்டும்
  rationale: ζητέω என்பதன் ‘தேடு, நாடு’ என்ற விரிந்த பொருளைத் தக்கவைக்கிறது; பொருள் சார்ந்த அல்லது உணர்ச்சி சார்ந்த முயற்சியாக மட்டும் இதைக் குறுக்கவில்லை.
- source_word: τὸ ἑαυτοῦ
  choice: தன் நலனை
  rationale: கிரேக்கத்தில் ‘தனக்குரியதை’ என்ற பொருளுடைய நீள்விடுபாடு உள்ளது. சூழலில் தனக்கான ஆதாயத்திற்கு மாறாக மற்றவரின் பயனை நாடுதல் பேசப்படுவதால், ‘நலனை’ என்பது பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ
  choice: -ஆமல் ... தேடட்டும்
  rationale: கிரேக்கத்தின் எதிர்மறை–நேர்மறை முரண்பாட்டைத் தமிழில் இயல்பான ‘தேடாமல் ... தேடட்டும்’ அமைப்பு வெளிப்படுத்துகிறது; தனியான ‘ஆனால்’ தேவையில்லை.
- source_word: τὸ τοῦ ἑτέρου
  choice: மற்றவருடைய நலனை
  rationale: ἕτερος இங்கு தன்னிலிருந்து வேறான மற்றொரு நபரைக் குறிக்கிறது. முன் தொடரில் நிரப்பப்பட்ட ‘நலன்’ என்பதையே இங்கும் வெளிப்படையாகக் கூறுவது தெளிவையும் இணை அமைப்பையும் தருகிறது.
theological_decisions:
- issue: τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου ஆகிய நீள்விடுபாடுகளில் மறைந்துள்ள பெயர்ச்சொல்லை நிரப்புதல்
  choice: ‘தன் நலனை ... மற்றவருடைய நலனை’ என்று பொருளை வெளிப்படுத்துதல்
  alternative: ‘தனக்குரியதை ... மற்றவருக்குரியதை’ என்று சொற்சொல்லாக மொழிபெயர்த்தல்
  rationale: மூல கிரேக்கம் பொருளை மறைமுகமாக விட்டாலும், 1 கொரிந்தியர் 10:23–33 சூழல் தன் ஆதாயத்திற்குப் பதிலாக மற்றவரின் பயனை நாடுவதைச் சுட்டுகிறது. ‘நலன்’ என்பது அந்த அறநெறிப் பொருளைத் தெளிவாக்குகிறது; அதேவேளை சொற்சொல்லான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, சுருக்கமான, கண்ணியமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. பாலினத்தைக் குறிப்பிடாத ‘ஒருவரும்’, ‘மற்றவர்’ ஆகிய சொற்கள் கிரேக்கத்தின் பொதுப்பொருளைத் தக்கவைக்கின்றன.
