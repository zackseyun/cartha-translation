  naturalness: ‘ஒருவரும் தன் நலனைத் தேடாமல், மற்றவருடைய நலனைத் தேடட்டும்’ என்பது நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான அறிவுறுத்தல் நடையாக உள்ளது. எதிர்மறையைத் தொடர்ந்து நேர்மறைக் கட்டளையாக அமைந்துள்ள சொற்றொடர் இயல்பானது.
  terminology: ‘ஒருவரும்’, ‘தன்’, ‘மற்றவர்’ ஆகியவை பாலினப் பொதுப்பொருளை நன்கு காக்கின்றன. ‘நலன்’ இரு இணைத் தொடர்களிலும் ஒரேவகையில் பயன்படுத்தப்பட்டிருப்பது கிரேக்கத்தின் இணை அமைப்பைத் தெளிவுபடுத்துகிறது. அடிக்குறிப்பு மூலத்தில் உள்ள சொற்சொல்லான திறந்த பொருளைச் சரியாகப் பாதுகாக்கிறது.
