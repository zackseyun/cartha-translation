revisions:
- from: மாம்சத்தின்படி உள்ள இஸ்ரவேலைக் கவனியுங்கள்:[a] பலிகளைச் சாப்பிடுகிறவர்கள் பலிபீடத்தில் பங்குபெறுகிறவர்கள் அல்லவா?[b]
  to: மாம்சத்தின்படியான இஸ்ரவேலைக் கவனியுங்கள்:[a] பலிகளை உண்பவர்கள் பலிபீடத்தோடு பங்குடையவர்கள் அல்லவா?[b]
  rationale: The revision improves Tamil idiom and religious register while retaining the source's rhetorical form and its intentionally marked «according to the flesh» language. It also renders κοινωνοί τοῦ θυσιαστηρίου as participation in relation to the altar, rather than a spatial participation inside it. The alternatives preserve the main viable renderings without deciding wider theological questions.
  reviewer_model: gpt-5.6-terra
