language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: ta
  text: மாம்சத்தின்படியான இஸ்ரவேலைக் கவனியுங்கள்:[a] பலிகளை உண்பவர்கள் பலிபீடத்தோடு பங்குடையவர்கள் அல்லவா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயற்கை வம்சத்தைச் சேர்ந்த இஸ்ரவேல்” அல்லது “உடல்சார்ந்த இஸ்ரவேல்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பலிபீடத்தில் பங்குபெறுகிறவர்கள்” அல்லது “பலிபீடத்தின் பங்காளிகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: கவனியுங்கள்
  rationale: வெறும் பார்வையை அல்ல, பவுலின் வாதத்தில் சிந்தனையுடன் கவனம் செலுத்தும்படி அழைக்கும் பன்மை ஏவலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: மாம்சத்தின்படி உள்ள இஸ்ரவேல்
  rationale: σάρξ என்பதன் நேரடி உருவகத்தைத் தக்கவைத்து, இங்கு இயற்கை அல்லது இனவழி இஸ்ரவேலைக் குறிக்கும் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது; ‘பாவ இயல்பு’ என்ற பொருளை இறக்குமதி செய்யவில்லை.
- source_word: οὐχ ... εἰσίν;
  choice: அல்லவா?
  rationale: உடன்பாட்டான பதிலை எதிர்பார்க்கும் கிரேக்க மறுப்புவினாவின் இயல்பான தமிழ் வடிவம்.
- source_word: οἱ ἐσθίοντες
  choice: சாப்பிடுகிறவர்கள்
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்கால வினையெச்சத்தின் தெளிவான, இயல்பான மொழிபெயர்ப்பு; செயலை நேரடியாகத் தக்கவைக்கிறது.
- source_word: τὰς θυσίας
  choice: பலிகளை
  rationale: பலியிடப்பட்ட காணிக்கைகளைக் குறிக்கும் சுருக்கமான, வழக்கமான தமிழ் சொல்.
- source_word: κοινωνοὶ
  choice: பங்குபெறுகிறவர்கள்
  rationale: உண்மையான பங்கையும் தொடர்பையும் குறிக்கிறது; வழிபாட்டு ஐக்கியத்தை அளவுக்கு மீறி விளக்காமல் தெரிவிக்கிறது.
- source_word: τοῦ θυσιαστηρίου
  choice: பலிபீடத்தில்
  rationale: κοινωνοί உடன் வரும் உறவுச் சொற்றொடரை இயல்பான தமிழில் பங்கேற்பின் வட்டமாக வெளிப்படுத்துகிறது; பலிபீடத்தையே பொருளாகப் பகிர்வது என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘மாம்சத்தின்படி உள்ள இஸ்ரவேல்’ என்பதன் பொருள்
  choice: இயற்கை அல்லது இனவழி வம்சத்தைச் சேர்ந்த இஸ்ரவேல்
  alternative: வெளிப்புற அடையாளங்களின்படி பார்க்கப்படும் இஸ்ரவேல்
  rationale: இச்சூழலில் பலியுணவு நடைமுறையிலிருந்து ஒப்புமை கூறப்படுவதால், சொற்றொடர் இயற்கை வம்சத்தைக் குறிப்பது மிகவும் இயல்பு. ஆயினும் இஸ்ரவேலுக்கும் திருச்சபைக்கும் இடையிலான விரிவான கோட்பாட்டுச் சிக்கலை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- issue: பலிபீடத்துடன் தொடர்புடைய κοινωνοί
  choice: பலிபீடத்தில் பங்குபெறுகிறவர்கள்
  alternative: பலிபீடத்தோடு பங்காளிகளாக இருப்பவர்கள்
  rationale: பலியுணவை உண்பது பலிபீடம் பிரதிநிதித்துவப்படுத்தும் பலிவழிபாட்டில் உண்மையான பங்கேற்பை உருவாக்குகிறது என்ற வாதத்தைத் தக்கவைக்கிறது; தொடர்பின் துல்லிய இயல்பை மிகையாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட வாதநடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சத்தின்படி’ என்ற பவுலின் திட்டமிட்ட சொற்றொடர் அதன் இறையியல் பதற்றத்துடன் தக்கவைக்கப்பட்டு, அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
