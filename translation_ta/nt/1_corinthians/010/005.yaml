base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: ta
  text: ஆனாலும், அவர்களில் பெரும்பாலானவர்களிடம் கடவுள் பிரியமாயிருக்கவில்லை; ஏனெனில் அவர்கள் பாலைநிலத்தில் வீழ்த்தப்பட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாலைநிலத்தில் கீழே விழுந்து கிடந்தார்கள்” அல்லது “பாலைநிலத்தில் வீழ்ந்துபோனார்கள்.”
    reason: κατεστρώθησαν என்பதன் ‘வீழ்த்தப்படுதல்/கீழே பரந்து கிடத்தல்’ என்ற படிமத்தையும் சாத்தியமான மாற்று மொழிபெயர்ப்புகளையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனாலும்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட அனைவருக்கும் பொதுவான சிறப்புரிமைகளுக்கும் இங்கு வரும் எதிர்மறையான முடிவுக்கும் இடையிலான வலுவான முரண்பாட்டைக் காட்டுகிறது.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: அவர்களில் பெரும்பாலானவர்கள்மீது ... இல்லை
  rationale: கிரேக்க மொழியின் அளவுசார் பொருளான ‘அவர்களில் பெரும்பாலானவர்கள்’ என்பதைக் காத்து, εὐδοκέω என்பதுடன் இயல்பான தமிழில் அமைகிறது.
- source_word: ηὐδόκησεν
  choice: மகிழ்ச்சியடையவில்லை
  rationale: ‘மகிழ்ச்சி கொள்ளுதல், மனநிறைவு அடைதல்’ என்ற பொருளை இயல்பாகத் தருகிறது; ‘அங்கீகரிக்கவில்லை’ என்று மட்டும் சுருக்கி விளக்கவில்லை.
- source_word: ὁ θεός
  choice: கடவுள்
  rationale: எழுவாயை நேரடியாகவும் நவீனத் தமிழில் பொதுவாகப் புரியும் விதத்திலும் மொழிபெயர்க்கிறது.
- source_word: κατεστρώθησαν
  choice: வீழ்த்தப்பட்டார்கள்
  rationale: வனாந்தரத்தில் அவர்கள் மரணத் தீர்ப்புக்கு உள்ளாகிக் கீழே வீழ்ந்ததைக் காட்டும் வினையின் செயப்பாட்டு வடிவத்தையும் கடுமையையும் காக்கிறது; உடல்கள் பரப்பப்பட்டன என்ற மூலப் படிமத்தையும் முற்றிலும் இழக்கவில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: கடவுள் மகிழ்ச்சியடையாததற்கான விளக்கச் சான்றை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: பாலைநிலத்தில்
  rationale: யாத்திராகமப் பயணத்தின் மக்கள் குடியிருப்பற்ற வறண்ட நிலப்பகுதியைக் குறிக்கிறது; வெறும் மணற்பாலைவனம் என்ற தேவையற்ற குறுக்கத்தைக் தவிர்க்கிறது.
theological_decisions:
- issue: κατεστρώθησαν விவரிக்கும் தீர்ப்பின் தன்மை
  choice: வனாந்தரப் பயணத்தின்போது இஸ்ரவேலர்கள் கடவுளுடைய தீர்ப்பினால் வீழ்த்தப்பட்டதைக் குறிக்கும் வகையில் மொழிபெயர்த்தல்
  alternative: தீர்ப்பின் அம்சத்தை முன்னிறுத்தாமல், அவர்கள் பாலைநிலத்தில் கிடத்தப்பட்டார்கள் அல்லது சிதறிக் கிடந்தார்கள் என்று மொழிபெயர்த்தல்
  rationale: பவுலின் சூழல் இஸ்ரவேலரின் தோல்விகளையும் அதன் விளைவான கடவுளுடைய தீர்ப்பையும் கொரிந்தியருக்கு எச்சரிக்கையாக முன்வைக்கிறது. ‘வீழ்த்தப்பட்டார்கள்’ என்பது அந்த எச்சரிக்கை வலிமையைத் தருகிறது; அதே நேரத்தில் யார் நேரடியாக வீழ்த்தினார் என்று மூலத்தை மீறிச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பெரும்பாலானவர்கள்’ என்ற அளவுசார் கருத்தும், கடவுளுடைய மகிழ்ச்சியின்மை மற்றும் பாலைநிலத் தீர்ப்பு ஆகியவற்றுக்கிடையிலான காரணத் தொடர்பும் காக்கப்பட்டுள்ளன. ‘பாலைநிலம்’ என்பது யாத்திராகமச் சூழலில் மனிதர் குடியிராத வறண்ட நிலத்தை இயல்பாகக் குறிக்கத் தேர்ந்தெடுக்கப்பட்டது.
