source:
  edition: SBLGNT
  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: ta
  text: இறைச்சிச் சந்தையில் விற்கப்படும் எதையும், மனச்சாட்சியின் பொருட்டு எந்த விசாரணையும் செய்யாமல்[a] சாப்பிடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதையும் ஆராயாமல்” அல்லது “எந்தக் கேள்வியும் கேட்காமல்”; இறைச்சியின் பின்னணியை விசாரிக்க வேண்டாம் என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: விற்கப்படும் எதையும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நடுநிலைத் தொடர், விற்கப்படுகிற அனைத்தையும் உள்ளடக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν μακέλλῳ
  choice: இறைச்சிச் சந்தையில்
  rationale: μάκελλον என்பது பொதுவான சந்தையை அல்ல, குறிப்பாக இறைச்சி விற்கும் சந்தையைக் குறிக்கிறது.
- source_word: ἐσθίετε
  choice: சாப்பிடுங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை நிகழ்காலக் கட்டளை; தமிழில் நேரடியான, இயல்பான கட்டளையாக வழங்கப்பட்டுள்ளது.
- source_word: μηδὲν ἀνακρίνοντες
  choice: எந்த விசாரணையும் செய்யாமல்
  rationale: ἀνακρίνω என்பதற்கு விசாரித்தல், ஆராய்தல், கேள்வி எழுப்புதல் ஆகிய பொருள்கள் உண்டு. இங்கு இறைச்சியின் பின்னணியை ஆராய வேண்டாம் என்பதே சூழல்சார் கருத்து; அந்தப் பரப்பைச் சுருக்காமல் இத்தொடர் காக்கிறது.
- source_word: διὰ τὴν συνείδησιν
  choice: மனச்சாட்சியின் பொருட்டு
  rationale: διά + accusative இங்கு காரணம் அல்லது நோக்கத்தை உணர்த்துகிறது. யாருடைய மனச்சாட்சி என்பதைச் சேர்க்காமல், கிரேக்க மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘மனச்சாட்சி’ என்பது யாருடையது?
  choice: ‘மனச்சாட்சி’ என்று பொதுவாகவே வழங்குதல்
  alternative: ‘உங்கள் மனச்சாட்சி’ அல்லது ‘மற்றவருடைய மனச்சாட்சி’ என்று குறிப்பாக வழங்குதல்
  rationale: இவ்வசனத்தின் கிரேக்க உரை ‘மனச்சாட்சி’ என்று மட்டுமே கூறுகிறது. அடுத்துவரும் சூழல் விளக்கும்வரை அதன் சுட்டுப்பொருளை மொழிபெயர்ப்பில் முன்கூட்டியே தீர்மானிக்காமல் இருப்பது மூலத்தின் இறையியல் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘இறைச்சிச் சந்தை’ வரலாற்றுச் சூழலைத் தெளிவாகக் காட்டுகிறது; ‘மனச்சாட்சி’ யாருடையது என்பது குறிப்பிடப்படாமல் மூலத்தின் தெளிவின்மை காக்கப்பட்டுள்ளது.
