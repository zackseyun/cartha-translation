revisions:
- from: அவர்கள் அனைவரும் ஒரே ஆன்மிக உணவைச் சாப்பிட்டார்கள்.[a]
  to: மேலும், அவர்கள் அனைவரும் ஒரே ஆன்மிக உணவை உண்டார்கள்.[a]
  rationale: The revision explicitly represents καὶ with ‘மேலும்,’ retains the source’s unqualified ‘spiritual food’ as ‘ஆன்மிக உணவு,’ and uses a formal yet current verbal form. The footnote retains the lexical alternative and the likely manna allusion while expressing typological significance without imposing a predictive or sacramental interpretation.
