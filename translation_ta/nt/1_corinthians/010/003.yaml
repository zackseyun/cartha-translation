  text: and all ate the same spiritual food[a]
translation:
  language: ta
  text: மேலும், அவர்கள் அனைவரும் ஒரே ஆன்மிக உணவை உண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயற்கைக்கு அப்பாற்பட்ட உணவு.” இந்தச் சொற்றொடர் வனாந்தரத்தில் கிடைத்த மன்னாவைக் குறிப்பதாக இருக்கலாம்; இச்சூழலில் இதற்கு முன்மாதிரிப் பொருளும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -உம்
  rationale: முந்தைய கூற்றுடன் இவ்வசனத்தை இணைக்கும் தொடர் இணைப்பைத் தமிழில் இயல்பாகக் காட்ட, எழுவாயோடு சேரும் ‘-உம்’ பயன்படுத்தப்பட்டது.
- source_word: πάντες
  choice: அவர்கள் அனைவரும்
  rationale: இஸ்ரவேல் மக்களின் முழுக் குழுவையும் வலியுறுத்துகிறது; தமிழில் எழுவாயைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τὸ αὐτὸ
  choice: ஒரே
  rationale: அனைவரும் அடையாளத்தில் ஒன்றான அதே உணவை உண்டார்கள் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: πνευματικὸν
  choice: ஆன்மிக
  rationale: பவுலின் πνευματικός என்ற சொல்லின் பரந்த பொருளைத் தக்கவைத்து, ‘அற்புதமான’ என்ற குறுகிய விளக்கத்தையோ ‘ஆவியால் கொடுக்கப்பட்ட’ என்ற விளக்கத்தையோ மூலவாக்கியத்திற்குள் சேர்க்காமல் விடுகிறது.
- source_word: βρῶμα
  choice: உணவு
  rationale: பொதுவாக உண்ணப்படும் உணவைக் குறிக்கும் நேரடியான, தற்போதைய தமிழ்ச் சொல்.
- source_word: ἔφαγον
  choice: சாப்பிட்டார்கள்
  rationale: கடந்தகாலச் செயலை இயல்பான நவீனத் தமிழில் நேரடியாகக் கூறுகிறது.
theological_decisions:
- issue: வனாந்தரச் சூழலில் ‘ஆன்மிக உணவு’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘ஆன்மிக உணவு’ என்று வைத்தல்
  alternative: ‘தேவன் கொடுத்த மன்னா’, ‘ஆவியால் கொடுக்கப்பட்ட உணவு’, அல்லது கர்த்தருடைய இராப்போஜனத்தின் முன்குறிப்பு என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இது வனாந்தரத்தில் இஸ்ரவேலருக்குக் கிடைத்த மன்னாவைக் குறிப்பதாக இருக்கலாம்; சுற்றியுள்ள பகுதியில் முன்மாதிரிப் பொருளும் இருக்கிறது. ஆயினும் மூலச்சொல் கொண்டுள்ள பரப்பையும் இறையியல் இழுப்பையும் தீர்த்துவிடாமல் ‘ஆன்மிக உணவு’ தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆன்மிக’ என்பது பொதுவாகப் புரியக்கூடியதுடன் πνευματικός என்பதன் நோக்கமுள்ள பொருள் அகலத்தையும் காக்கிறது.
