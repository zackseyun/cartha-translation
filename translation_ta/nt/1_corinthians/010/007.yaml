source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: ta
  text: அவர்களில் சிலர் இருந்ததுபோல, நீங்களும் சிலைவழிபாட்டாளர்களாக ஆகாதீர்கள். எழுதப்பட்டிருப்பதுபோல, “மக்கள் உண்ணவும் குடிக்கவும் உட்கார்ந்தார்கள்; பின்னர் விளையாட எழுந்தார்கள்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηδὲ
  choice: ஆகாதீர்கள்
  rationale: முந்தைய எச்சரிக்கைகளைத் தொடரும் தடைச்சொல்லின் வலிமை, தமிழில் எதிர்மறை ஏவல் வினையால் இயல்பாக வெளிப்படுகிறது.
- source_word: εἰδωλολάτραι
  choice: சிலைவழிபாட்டுக்காரர்கள்
  rationale: சிலைகளை வழிபடுபவர்களைக் குறிக்கும் கிரேக்கப் பெயர்ச்சொல்லை, பொதுவாகப் புரியும் நவீன தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: γίνεσθε
  choice: ஆகாதீர்கள்
  rationale: வெறுமனே அப்படிப்பட்டவர்களாய் இருக்க வேண்டாம் என்பதற்குப் பதிலாக, அந்த நிலைக்கு மாறிவிட வேண்டாம் என்ற γίνομαι வினையின் இயக்கத்தைப் பாதுகாக்கிறது.
- source_word: καθώς τινες αὐτῶν
  choice: அவர்களில் சிலரைப்போல
  rationale: வனாந்தர இஸ்ரவேலரில் சிலருடைய எடுத்துக்காட்டுடன் செய்யப்படும் ஒப்பீட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὥσπερ γέγραπται
  choice: எழுதப்பட்டிருப்பதுபோல
  rationale: எழுதி நிலைத்திருக்கும் வேதவாக்கைக் குறிக்கும் வழக்கமான மேற்கோள் அறிமுகத்தையும் perfect வினையின் தொடரும் நிலையையும் தருகிறது.
- source_word: Ἐκάθισεν ὁ λαὸς
  choice: மக்கள் ... உட்கார்ந்தார்கள்
  rationale: கூட்டாகக் குறிக்கப்படும் ὁ λαός என்பதையும், உண்பதற்காக அமர்ந்த நிகழ்வையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φαγεῖν καὶ πεῖν
  choice: உண்ணவும் குடிக்கவும்
  rationale: இணையான இரு நோக்க infinitive-களையும் நேரடியாகவும் சமச்சீராகவும் மொழிபெயர்க்கிறது.
- source_word: ἀνέστησαν
  choice: எழுந்தார்கள்
  rationale: உட்கார்ந்த நிலையிலிருந்து எழுந்த அடுத்த நிகழ்வை மேற்கோளின் கதைநகர்வோடு நேரடியாகத் தருகிறது.
- source_word: παίζειν
  choice: விளையாட
  rationale: வினையின் அடிப்படைச் சொல்லர்த்தத்தை முதன்மை உரையில் பாதுகாக்கிறது; விக்கிரக விருந்துடன் தொடர்புடைய களியாட்ட நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: யாத்திராகமம் 32:6 மேற்கோளில் உள்ள παίζειν என்பதன் பொருளை எவ்வளவு வெளிப்படையாக விளக்குவது
  choice: முதன்மை உரையில் “விளையாட” என்று வைத்து, சூழலுக்குரிய “களியாட்டத்தில் ஈடுபட” என்ற பொருளை அடிக்குறிப்பில் தருதல்
  alternative: “களியாட” அல்லது “களியாட்டத்தில் ஈடுபட” என்று முதன்மை உரையிலேயே மொழிபெயர்த்தல்
  rationale: παίζειν என்பதன் அடிப்படை அர்த்தமும் யாத்திராகம மேற்கோளின் சொல்வடிவமும் பாதுகாக்கப்படுகின்றன. அதேவேளை, பொற்கன்றைச் சுற்றிய சிலைவழிபாட்டு விருந்தோடு தொடர்புடைய களியாட்டப் பொருளை வாசகர் அறிய அடிக்குறிப்பு உதவுகிறது; உரையின் தெளிவின்மையைத் தேவையின்றித் தீர்மானிப்பதை இது தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதைப் பன்மை ஏவல் பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் எளிய கதைநடை பாதுகாக்கப்பட்டு, παίζειν என்பதிலுள்ள சூழல்சார் நிழற்பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
