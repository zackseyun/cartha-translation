revisions:
- from: ஆண்டவருடைய கிண்ணத்திலும் பேய்களின் கிண்ணத்திலும் நீங்கள் குடிக்க முடியாது; ஆண்டவருடைய மேசையிலும் பேய்களின் மேசையிலும் நீங்கள் பங்குகொள்ள முடியாது.[a]
  to: ஆண்டவருடைய கிண்ணத்திலிருந்தும் பேய்களின் கிண்ணத்திலிருந்தும் நீங்கள் குடிக்க முடியாது; ஆண்டவருடைய மேசையிலும் பேய்களின் மேசையிலும் நீங்கள் பங்குகொள்ள[a] முடியாது.
  rationale: The revision corrects the Tamil case construction required by ‘drink’ and replaces an inaccurate footnote alternative with a natural lexical alternative for μετέχειν. It preserves the Greek parallelism, the categorical force of ‘cannot,’ and the text’s unexpanded cultic imagery.
