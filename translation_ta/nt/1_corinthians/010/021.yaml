id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: ta
  text: ஆண்டவருடைய கிண்ணத்திலிருந்தும் பேய்களின் கிண்ணத்திலிருந்தும் நீங்கள் குடிக்க முடியாது; ஆண்டவருடைய மேசையிலும் பேய்களின் மேசையிலும் நீங்கள் பங்குகொள்ள[a] முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவருடைய மேசையிலும் பேய்களின் மேசையிலும் நீங்கள் பங்கேற்க முடியாது.”
    reason: μετέχειν என்பதற்கு ‘பங்குகொள்ளுதல்’ அல்லது ‘பங்கேற்றல்’ என மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: நீங்கள் முடியாது
  rationale: திரும்பத் திரும்ப வரும் கிரேக்கச் சொற்றொடரின் திட்டவட்டமான இயலாமை அல்லது பொருந்தாமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ποτήριον
  choice: கிண்ணம்
  rationale: குடிக்கும் பாத்திரத்தைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியும் தமிழ்ச் சொல்; சூழலிலுள்ள பங்கேற்பு சார்ந்த உட்பொருளை விளக்கமாகச் சேர்க்காமல் தக்கவைக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான இயல்பான, கண்ணியமான நவீனத் தமிழ் இணை; இரண்டு இணை வாக்கியங்களிலும் ஒரே சீராகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: πίνειν
  choice: குடிக்க
  rationale: δύνασθε என்பதுடன் வரும் வினையெச்சத்தின் எளிய மற்றும் இயல்பான தமிழ் வடிவம்.
- source_word: δαιμονίων
  choice: பேய்கள்
  rationale: தனிப்பட்ட தீய ஆவிக்குரிய சக்திகளைக் குறிக்கும் δαιμόνια என்பதன் வெளிப்படையான தமிழ் இணை; ‘தீய ஆவிகள்’ என்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: τραπέζης
  choice: மேசை
  rationale: விருந்து மற்றும் வழிபாட்டுப் பங்கேற்பு ஆகிய இரண்டின் உருவகத்தையும் திறந்த நிலையில் வைத்திருக்கும் நேரடி இணை; ‘பலிபீடம்’ போன்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: μετέχειν
  choice: பங்குகொள்ள
  rationale: உண்மையான பங்கேற்பையும் பகிர்வையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெறும் உட்கொள்ளுதலாக அர்த்தத்தைச் சுருக்கவில்லை.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: கிரேக்கத்தின் இணைப்பையும் இரு தரப்புகளுக்கிடையிலான கூர்மையான இணைநிலையையும் தமிழின் இயல்பான இணைப்புமுறையில் காட்டுகிறது.
theological_decisions:
- issue: ஆண்டவருடைய மேசையிலும் பேய்களின் வழிபாட்டிலும் பங்கேற்பதற்கிடையிலான உறவு
  choice: இரண்டிலும் பங்கேற்பது திட்டவட்டமாகப் பொருந்தாதது
  alternative: இது வெறும் வலியுறுத்தப்பட்ட அறிவுரை மட்டுமே
  rationale: இருமுறை வரும் οὐ δύνασθε திட்டவட்டமான இயலாமை அல்லது பொருந்தாமையை முன்வைக்கிறது. ‘முடியாது’ என்பது அதைப் பாதுகாக்கிறது; அதற்கான கோட்பாட்டு காரணத்தை மொழிபெயர்ப்பு கூடுதலாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இணை அமைப்பும் இருமுறை வரும் திட்டவட்டமான மறுப்பும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற சமயப் பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
