source:
  edition: SBLGNT
  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: ta
  text: ஆனால் யாராவது உங்களிடம், “இது பலியாகப் படைக்கப்பட்டது[a]” என்று சொன்னால், அதை உண்ணாதீர்கள்; அதைத் தெரிவித்தவருக்காகவும் மனச்சாட்சிக்காகவும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது பலியிடப்பட்ட உணவு.” கிரேக்கச் சொல் பலியாகப் படைக்கப்பட்ட ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, உங்கள் சொந்த மனச்சாட்சியை அல்ல, மற்றவருடைய மனச்சாட்சியை முன்னிட்டு; அடுத்த வசனத்தைப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: ஆனால் யாராவது உங்களிடம் ... என்று சொன்னால்
  rationale: ἐὰν + subjunctive நிபந்தனைச் சூழலைக் குறிக்கிறது; τις என்பதன் வரையறையற்ற பொருளை ‘யாராவது’ இயல்பாகத் தருகிறது. δέ முந்தைய கருத்துடன் உள்ள வேறுபாட்டை ‘ஆனால்’ எனக் காட்டுகிறது.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: இது பலியாகப் படைக்கப்பட்டது
  rationale: ἱερόθυτος என்பது வழிபாட்டுச் சூழலில் பலியாகப் படைக்கப்பட்ட ஒன்றைக் குறிக்கிறது. மூலச்சொல்லில் இல்லாத ‘சிலை’ அல்லது ‘விக்கிரகம்’ என்பதை முதன்மை உரையில் சேர்க்காமல், தமிழ் வழக்கில் தெளிவாக வினை வடிவில் தரப்படுகிறது.
- source_word: μὴ ἐσθίετε
  choice: அதை உண்ணாதீர்கள்
  rationale: μή உடன் வரும் நிகழ்கால கட்டளைத் தொடர் தடையைத் தெரிவிக்கிறது. உணவைச் சுட்டும் செயப்படுபொருள் தமிழில் இயல்புக்காக ‘அதை’ என வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: அதைத் தெரிவித்தவரை முன்னிட்டு
  rationale: διά + accusative இங்கு அந்த நபரைக் கருத்தில் கொண்டு அல்லது அவருடைய நலனை முன்னிட்டு விலகியிருக்க வேண்டும் என்பதைக் குறிக்கிறது. μηνύσαντα என்பதற்கு ‘தெரிவித்தவர்’ இயல்பான, துல்லியமான இணை.
- source_word: καὶ τὴν συνείδησιν
  choice: மனச்சாட்சியை முன்னிட்டும்
  rationale: சுருக்கமாக உள்ள கிரேக்க இணைப்பை முந்தைய διά சொற்றொடருடன் சேர்த்து வாசிக்கும்படி ‘முன்னிட்டும்’ என்று தருகிறது; மனச்சாட்சி யாருடையது என்பதை முதன்மை உரை வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: τὴν συνείδησιν என்பது யாருடைய மனச்சாட்சியைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘மனச்சாட்சி’ என்று மட்டும் வைத்து, அடுத்த வசனத்தின் அடிப்படையில் அது தெரிவித்த மற்றவருடைய மனச்சாட்சி என அடிக்குறிப்பில் விளக்குதல்
  alternative: உண்பவருடைய மனச்சாட்சி; அல்லது யாருடையது என்று தீர்மானிக்காத பொதுவான குறிப்பு
  rationale: கிரேக்க வசனம் இங்கே உரிமையாளரை வெளிப்படையாகக் குறிப்பிடவில்லை; அடுத்த வசனம் ‘உன்னுடையதல்ல, மற்றவருடையது’ என்று தெளிவுபடுத்துகிறது. ஆகவே பவுலின் கருத்தோட்டத்தையும் இவ்வசனத்தின் சுருக்கத்தையும் முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உண்ணாதீர்கள்’ வேதாகம உரைக்கேற்ற முறையான நடையைக் காக்கிறது; மூலத்தில் இல்லாத ‘விக்கிரகம்’ என்ற விளக்கத்தை முதன்மை உரை தவிர்க்கிறது.
