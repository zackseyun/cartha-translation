lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: இடறல் உண்டாக்காதவர்களாக
  rationale: இந்தச் சூழலில் பிறர் தடுமாறவோ புண்படவோ காரணமாகாத நடத்தையை இந்தச் சொல் குறிக்கிறது. ‘குற்றமற்றவர்களாக’ என்பதைக் காட்டிலும் உறவுசார் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; அதேவேளையில் ‘இடறல்’ என்ற வேதாகமச் சிந்தனையையும் காக்கிறது.
- source_word: γίνεσθε
  choice: இருங்கள்
  rationale: நிகழ்காலக் கட்டளைத் தொனி தொடர்ச்சியான நடத்தைக்கான அறிவுறுத்தலைக் குறிக்கிறது. நவீன தமிழில் ‘இருங்கள்’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: Ἰουδαίοις
  choice: யூதர்களுக்கும்
  rationale: இங்கு யூதேயாவில் வசிப்பவர்களை மட்டும் அல்லாமல், இன-சமயக் குழுவான யூத மக்களைக் குறிக்கிறது.
- source_word: Ἕλλησιν
  choice: கிரேக்கர்களுக்கும்
  rationale: மூலச்சொல்லின் நேரடிப் பொருள் ‘கிரேக்கர்கள்.’ பவுலின் சூழலில் இது யூதரல்லாதவர்களை விரிவாகக் குறிக்கக்கூடும் என்றாலும், மூலத்தின் குறிப்பிட்ட சொல்லை முதன்மை உரையில் காக்கிறது.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: தேவனுடைய திருச்சபைக்கும்
  rationale: பவுலின் பயன்பாட்டில் ἐκκλησία விசுவாசிகளின் கூடிவரும் சமூகத்தைக் குறிக்கிறது. ‘தேவனுடைய திருச்சபை’ என்பது இயல்பானதும் நிலைபெற்றதுமான தமிழ் வடிவம்.
theological_decisions:
- issue: பவுலின் ஒழுக்க அறிவுறுத்தலில் குறிப்பிடப்படும் குழுக்கள்
  choice: யூதர்கள், கிரேக்கர்கள், தேவனுடைய திருச்சபை ஆகிய மூன்று குழுக்களையும் தனித்தனியாகக் குறிப்பிட்டு, அவர்களில் எவருக்கும் இடறல் உண்டாக்காதிருக்குமாறு அறிவுறுத்துவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கிரேக்கர்கள்’ என்பதை எல்லா யூதரல்லாதவர்களையும் குறிக்கும் ‘புறவினத்தார்’ என்று பொதுமைப்படுத்துதல்; அல்லது வசனத்தை முதன்மையாக நற்செய்திப் பணிக்கான உத்தியாக விளக்குதல்.
  rationale: வசனம் மூன்று குழுக்களையும் வெளிப்படையாகப் பெயரிடுகிறது. மொழிபெயர்ப்பு அவற்றை விரிவாக்காமலும் குறுக்காமலும் காக்கிறது; அறிவுறுத்தலின் ஒழுக்கத் தொனியையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கட்டளைத் தொனி பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மூன்று இணையான மறைமுகச் செயப்படுபொருட்களும் ‘-க்கும்’ என்ற இணைப்பால் தெளிவாகக் காக்கப்பட்டுள்ளன.
