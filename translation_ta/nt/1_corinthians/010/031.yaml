revisions:
- from: ஆகவே, நீங்கள் உண்டாலும் குடித்தாலும், வேறு எதைச் செய்தாலும், எல்லாவற்றையும் கடவுளுடைய மகிமைக்காகச் செய்யுங்கள்.
  to: ஆகவே, நீங்கள் உண்டாலும் குடித்தாலும், எதைச் செய்தாலும், எல்லாவற்றையும் கடவுளுடைய மகிமைக்காகச் செய்யுங்கள்.
  rationale: The revision removes the unsupported word “வேறு” while preserving the Greek correlative structure, the generic scope of eating, drinking, and doing, the totality of πάντα, and the purposive force of εἰς δόξαν θεοῦ.
