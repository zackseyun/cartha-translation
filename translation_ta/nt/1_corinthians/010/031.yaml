id: 1CO.10.31
reference: 1 Corinthians 10:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: ta
  text: ஆகவே, நீங்கள் உண்டாலும் குடித்தாலும், எதைச் செய்தாலும், எல்லாவற்றையும் கடவுளுடைய மகிமைக்காகச் செய்யுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: …ஆலும் …ஆலும் …ஆலும்
  rationale: மாற்று நிகழ்வுகளை இணைக்கும் கிரேக்கத் தொடரை இயல்பான தமிழ் இணைப்புமுறையில் காட்டுகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய விவாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἐσθίετε
  choice: நீங்கள் உண்டாலும்
  rationale: நிகழ்கால வினை இங்கு வழக்கமான அல்லது பொதுவான செயலைக் குறிக்கிறது; நிபந்தனைத் தோற்றமுள்ள தமிழ் வடிவம் Εἴτε தொடரின் ‘whether’ பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πίνετε
  choice: குடித்தாலும்
  rationale: ἐσθίετε போலவே பொதுவான செயலைக் குறிக்கிறது; எழுவாய் முந்தைய வினையிலிருந்து இயல்பாகத் தொடர்கிறது.
- source_word: τι
  choice: வேறு எதை
  rationale: உண்பது, குடிப்பது ஆகியவற்றைத் தாண்டிய எந்தச் செயலையும் உள்ளடக்கும் விரிவைத் தமிழில் தெளிவாக்குகிறது.
- source_word: ποιεῖτε
  choice: செய்தாலும் / செய்யுங்கள்
  rationale: ஒரே கிரேக்க வினை முதலில் பொதுவான செயலைக் குறித்தும், பின்னர் கட்டளைத் தன்மையுள்ள அறிவுறுத்தலாகவும் வருகிறது; தமிழ் இலக்கணத்திற்கேற்ப இரு வடிவங்களில் தரப்பட்டுள்ளது.
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: முழுமையான, அனைத்தையும் உள்ளடக்கும் பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: εἰς δόξαν
  choice: மகிமைக்காக
  rationale: εἰς இங்கு நோக்கம் அல்லது இலக்கைச் சுட்டுவதால், ‘மகிமைக்காக’ அந்தப் பொருளை நேரடியாகத் தருகிறது.
- source_word: θεοῦ
  choice: கடவுளுடைய
  rationale: உடைமை வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்தி, மகிமை கடவுளுக்குரியது என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: பவுலின் அறிவுறுத்தலின் பரப்பு
  choice: உண்பதும் குடிப்பதும் உட்பட ஒருவர் செய்யும் அனைத்தும் கடவுளுடைய மகிமையை நோக்கமாகக் கொண்டிருக்க வேண்டும் என்ற விரிவான நெறி.
  alternative: உணவு மற்றும் பானம் குறித்த உடனடிப் பிரச்சினைகளுக்கு மட்டும் வரையறுக்கப்பட்ட அறிவுறுத்தல்.
  rationale: குறிப்பிட்ட செயல்களிலிருந்து ‘வேறு எதைச் செய்தாலும்’ என்றும் ‘எல்லாவற்றையும்’ என்றும் வசனம் விரிவடைகிறது. ஆகவே உடனடிச் சூழல் உணவு, பானம் பற்றியதாக இருந்தாலும், சொற்றொடரின் பரப்பு அதைவிட விரிவானது.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீன நிலையான தமிழ். ‘மகிமை’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; வாக்கியத்தின் மூன்று மாற்று நிலைகளும் கிரேக்கச் சொல்லமைப்பை மிகைப்படுத்தாமல் தமிழில் தெளிவாகப் பிரதிபலிக்கின்றன.
