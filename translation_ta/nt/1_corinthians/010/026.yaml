  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: ta
  text: ஏனெனில், பூமியும் அதில் நிறைந்துள்ள அனைத்தும் ஆண்டவருடையவை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சங்கீதம் 24:1-லிருந்து மேற்கோள். இன்னும் சொல்லுக்குச் சொல்லாக, “பூமியும் அதன் நிறைவும் ஆண்டவருடையவை.”
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: ஆண்டவருடையவை
  rationale: τοῦ κυρίου என்ற உடைமை வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. κύριος என்பதன் இறையியல் நிறையையும் சங்கீத மேற்கோளின் தன்மையையும் ‘ஆண்டவர்’ காக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான வேதவசன அடிப்படையை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: γῆ
  choice: பூமி
  rationale: சங்கீத மேற்கோளில் τὸ πλήρωμα αὐτῆς என்பதுடன் இணைந்திருப்பதால், இங்கு ‘நிலம்’ என்பதைவிட உலகளாவிய பொருளுடைய ‘பூமி’ பொருத்தமானது.
- source_word: πλήρωμα
  choice: அதில் நிறைந்துள்ள அனைத்தும்
  rationale: பூமியை நிரப்பியுள்ளவற்றின் மொத்தத்தையும் குறிக்கும் சொல்லை நவீன வாசகருக்கு இயல்பாகவும் தெளிவாகவும் வழங்குகிறது; ‘நிறைவு’ என்ற சொல்லுக்குச் சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: αὐτῆς
  choice: அதில்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் γῆ-ஐக் குறிக்கிறது; தமிழில் இடப்பொருள் தொடர்பை ‘அதில்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சங்கீத மேற்கோளில் இறையியல் நிறையுடைய κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர்
  rationale: பவுலின் கிரேக்க உரையில் உள்ள κύριος என்பதைக் காக்கும் அதேவேளையில், எபிரெய உரையிலுள்ள தெய்வீகப் பெயரைத் தனியாக இங்கு இறக்குமதி செய்யாமல், நவீன பொதுத்தமிழில் இயல்பாக வழங்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. வசனத்தின் வேதமேற்கோள் தன்மை காக்கப்படுகிறது; πλήρωμα என்பதன் சற்று செறிவான சொல்லுக்குச் சொல்லான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
