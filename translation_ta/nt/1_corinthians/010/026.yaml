  source_fidelity: மூலக் கிரேக்கத்தின் விளக்க இணைப்பான γάρ, உடைமைப் பொருளுடைய τοῦ κυρίου, உலகளாவிய பொருளில் γῆ, மற்றும் ‘பூமியை நிரப்புவது/அதிலுள்ள அனைத்தும்’ என்ற τὸ πλήρωμα αὐτῆς ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘அதில் நிறைந்துள்ள அனைத்தும்’ என்பது இச்சூழலில் πλήρωμα-வின் இயல்பான நவீனத் தமிழ் வெளிப்பாடாகும்.
