  terminology: κύριος என்பதற்கு ‘ஆண்டவர்’ என்பது திட்டத்தின் நடைமுறைக்கும் நவீன பொதுத்தமிழுக்கும் ஏற்றது. ‘பூமி’ என்பது சங்கீத மேற்கோளின் அண்டமுழுதுமான குறிப்பைச் சரியாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு சங்கீதம் 24:1 என்ற மேற்கோளையும் ‘நிறைவு’ என்ற நெருக்கமான மாற்றையும் முறையாகக் குறிக்கிறது.
