source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: ta
  text: நாமும் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட வேண்டாம்; அவர்களில் சிலர் அவ்வாறு ஈடுபட்டார்கள், ஒரே நாளில் இருபத்து மூவாயிரம் பேர் விழுந்தார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறந்தார்கள்” அல்லது “அடித்து வீழ்த்தப்பட்டார்கள்.” கிரேக்க மூலத்தில் “விழுந்தார்கள்” என்று உள்ளது; நியாயத்தீர்ப்பினால் ஏற்பட்ட மரணத்தைக் குறிக்க இச்சொல் பொதுவாகப் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எண்ணாகமம் 25:9 இருபத்து நாலாயிரம் பேர் இறந்ததாகக் கூறுகிறது. பவுல் இங்கு “ஒரே நாளில்” இருபத்து மூவாயிரம் பேர் விழுந்தார்கள் என்கிறார். அந்நாளில் இறந்தவர்களின் எண்ணிக்கையையும் மொத்த எண்ணிக்கையையும் இது வேறுபடுத்தக்கூடும்; எனினும் இம்மொழிபெயர்ப்பு இரு எண்ணிக்கைகளையும் ஒத்திசைக்காமல் பவுலின் சொற்களை அப்படியே பாதுகாக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: நாமும் ... வேண்டாம்
  rationale: μηδέ முந்தைய எச்சரிக்கைகளோடு இதை இணைக்கும் எதிர்மறை அறிவுறுத்தல். தமிழில் இயல்பான தொடராக ‘நாமும் ... வேண்டாம்’ என வழங்கப்பட்டுள்ளது.
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட
  rationale: πορνεύω பாலியல் ஒழுக்கமற்ற நடத்தையில் ஈடுபடுவதைக் குறிக்கிறது. பழமையான அல்லது மிகக் குறுகிய சொல்லைத் தவிர்த்து, இரு வினை வடிவங்களிலும் ஒரே சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: καθώς
  choice: போல
  rationale: இஸ்ரவேலரின் உதாரணத்துடன் ஒப்பிடும் καθώς என்பதன் இயல்பான தமிழ் இணை.
- source_word: τινες αὐτῶν
  choice: அவர்களில் சிலர்
  rationale: வனாந்தரத் தலைமுறையைச் சேர்ந்த சிலரை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἔπεσαν
  choice: விழுந்தார்கள்
  rationale: πίπτω என்பதன் அடிப்படை உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் நியாயத்தீர்ப்பினால் இறந்தார்கள் என்பது உட்கருத்து. தெளிவான மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: μιᾷ ἡμέρᾳ
  choice: ஒரே நாளில்
  rationale: குறிப்பிட்ட ஒரே நாளுக்குள் நிகழ்ந்ததையும் நியாயத்தீர்ப்பின் தீவிரத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: இருபத்து மூவாயிரம்
  rationale: கிரேக்க மூலத்தில் உள்ள எண்ணை மாற்றமின்றி எழுத்தில் வழங்குகிறது.
theological_decisions:
- issue: எண்ணாகமம் 25:9-இல் உள்ள எண்ணிக்கையுடனான தொடர்பு
  choice: பவுலின் உரையில் உள்ள ‘இருபத்து மூவாயிரம்’ என்பதை மாற்றாமல் வைத்தல்
  alternative: ‘இருபத்து நாலாயிரம்’ என்று எண்ணாகமத்துடன் ஒத்திசைத்தல் அல்லது இரு எண்ணிக்கைகளையும் விளக்கத்தின் மூலம் ஒன்றுபடுத்துதல்
  rationale: 1 கொரிந்தியர் கிரேக்க உரை தெளிவாக இருபத்து மூவாயிரம் என்கிறது. மொழிபெயர்ப்பு அந்த உரையைப் பாதுகாக்க வேண்டும்; எண்ணிக்கை வேறுபாட்டை அமைதியாக ஒத்திசைக்கக் கூடாது. சாத்தியமான விளக்கம் அடிக்குறிப்பில் மட்டும் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பாலியல் ஒழுக்கக்கேடு’ என்பது πορνεύω என்பதன் பரப்பை தேவையின்றிக் குறுக்காமல் வழங்குகிறது. ‘விழுந்தார்கள்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டு, அதன் மரணப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
