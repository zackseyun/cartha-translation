  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: ta
  text: இவை அவர்களுக்கு முன்மாதிரிகளாக[a] நிகழ்ந்தன; ஆனால், யுகங்களின் முடிவுகள்[c] வந்தடைந்துள்ள நமக்கு அறிவுறுத்தலாக[b] அவை எழுதப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “மாதிரிகளாக,” “அடையாள முன்மாதிரிகளாக”; இந்த நிகழ்வுகள் பிற்கால விசுவாசிகளுக்குப் படிப்பினை தரும் வடிவங்களாக இருந்தன என்று பவுல் காட்டுகிறார்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “நம்மைக் கண்டித்துத் திருத்துவதற்காக” அல்லது “நம்மை எச்சரிப்பதற்காக”; கிரேக்கச் சொல் திருத்தும் போதனையையும் எச்சரிக்கையையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “யுகங்களின் முடிவு”; கிரேக்கத்தில் “யுகங்களின் முடிவுகள்” என்று பன்மையில் உள்ளது; இங்கு அந்தப் பன்மை சொல்லாட்சி பாதுகாக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: முன்மாதிரிகளாக
  rationale: அந்த நிகழ்வுகள் பிற்கால விசுவாசிகளுக்குப் படிப்பினை தரும் வடிவங்கள் அல்லது மாதிரிகளாகச் செயல்பட்டன என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; தொழில்நுட்பமான ‘மாதிரிவகையில்’ போன்ற சொற்றொடரைத் தவிர்க்கிறது.
- source_word: συνέβαινεν
  choice: நிகழ்ந்தன
  rationale: கடந்தகாலத்தில் நடந்தவற்றைத் தெளிவாகக் குறிக்கிறது. கிரேக்க வினையின் ஒருமை வடிவத்தைச் சொற்சொல்லாகப் பின்பற்றாமல், ‘இவை’ என்பதற்கேற்ப இயல்பான தமிழ் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐκείνοις
  choice: அவர்களுக்கு
  rationale: முந்தைய சூழலில் கூறப்பட்ட வனாந்தரத் தலைமுறையினரை இயல்பாகச் சுட்டுகிறது.
- source_word: ἐγράφη
  choice: அவை எழுதப்பட்டன
  rationale: முன்னர் குறிப்பிடப்பட்ட நிகழ்வுகள் எழுத்தில் பதிவு செய்யப்பட்டதைத் தமிழில் தெளிவாகக் காட்டுகிறது; கிரேக்கத்தில் வினை ஒருமையாக இருந்தாலும் பொருள் சார்ந்த தமிழ் பன்மை இயல்பானது.
- source_word: πρὸς νουθεσίαν ἡμῶν
  choice: நம்மை அறிவுறுத்துவதற்காக
  rationale: νουθεσία என்பதில் உள்ள போதனை, திருத்தம், எச்சரிக்கை ஆகிய நுணுக்கங்களை ‘அறிவுறுத்துதல்’ பரந்த முறையில் தாங்குகிறது.
- source_word: εἰς οὓς
  choice: வந்தடைந்திருக்கிற நம்மை
  rationale: அந்த இறுதிக்கால உண்மை நம்மை நோக்கி வந்து சேர்ந்துள்ளது என்ற திசை மற்றும் விளைவு சார்ந்த உணர்வை இயல்பான தமிழில் இணைக்கிறது.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: யுகங்களின் முடிவுகள்
  rationale: τέλη, αἰώνων ஆகிய இரண்டின் பன்மையையும் காத்து, பவுலின் இரட்சிப்பு-வரலாற்றுச் சொல்லாட்சியை ஒருமையாகச் சுருக்காமல் விடுகிறது.
- source_word: κατήντηκεν
  choice: வந்தடைந்திருக்கிற
  rationale: நிகழ்ந்து முடிந்த வருகையின் தற்போதைய தொடர்பை கிரேக்க நிறைவுக்கால வினை உணர்த்துவதால், தமிழின் நிறைவுநிலை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: τὰ τέλη τῶν αἰώνων என்ற பவுலின் இரட்சிப்பு-வரலாற்றுச் சொற்றொடர்
  choice: யுகங்களின் முடிவுகள் வந்தடைந்திருக்கிற
  alternative: யுகங்களின் முடிவு வந்தடைந்திருக்கிற / யுகங்களின் நிறைவு வந்தடைந்திருக்கிற
  rationale: கிரேக்கத்தின் பன்மையை அப்படியே காத்து, இறுதிக்காலம் பற்றிய பவுலின் உள்ளார்ந்த இறையியல் பதற்றத்தை ஒருமை அல்லது ‘நிறைவு’ என்ற விளக்கச் சொல்லால் தீர்த்துவிடாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘யுகம்’ என்பது αἰών என்பதன் கால-வரலாற்று உணர்வைத் தக்கவைக்கிறது. வாக்கிய அமைப்பு இயல்பான தமிழுக்காகச் சற்றே மறுவரிசைப்படுத்தப்பட்டாலும், எதிர்மறை இணைப்பு, நோக்கம், இறுதிக்காலப் பன்மை ஆகியவை காக்கப்பட்டுள்ளன.
