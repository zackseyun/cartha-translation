id: 1CO.10.6
reference: 1 Corinthians 10:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: ta
  text: இவை நமக்கு எடுத்துக்காட்டுகளாயின; நாம் தீயவற்றை விரும்புகிறவர்களாக இருக்காதபடி, அவர்களும் அவற்றை விரும்பியதுபோலவே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நமக்கு மாதிரிகளாயின.”
    reason: τύποι என்பதற்கு ‘எடுத்துக்காட்டுகள்’ என்பதோடு ‘மாதிரிகள்’ என்ற பொருளும் உண்டு; மூலத்தின் சொற்பொருள் பரப்பைப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Ταῦτα
  choice: இவை
  rationale: முன்னர் விவரிக்கப்பட்ட வனாந்தர நிகழ்வுகளைச் சுட்டும் நடுநிலைப் பன்மைச் சுட்டுப்பெயர்; நிகழ்வுகள் என்று விரித்துரைக்காமல் மூலத்தின் பொதுமையைப் பாதுகாக்கிறது.
- source_word: δὲ
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு உரையோட்டத்தின் மாற்றத்தைக் குறிக்கும் மென்மையான இணைப்புச்சொல்; தமிழில் இயல்பான வாக்கியத் தொடரில் அதன் செயல்பாடு வெளிப்படுவதால் ‘ஆனால்’ என வலுவான முரண்பாட்டைச் சேர்க்கவில்லை.
- source_word: τύποι
  choice: எடுத்துக்காட்டுகள்
  rationale: இச்சூழலில் முந்தைய நிகழ்வுகள் விசுவாசிகளுக்கான ஒழுக்க எச்சரிக்கை முன்னுதாரணங்களாக அமைகின்றன. ‘மாதிரிகள்’ என்பதும் சாத்தியம்; ‘அடையாள வகைகள்’ போன்ற தொழில்நுட்ப இறையியல் பொருளை தேவையின்றி இறக்குமதி செய்யாமல் ‘எடுத்துக்காட்டுகள்’ தெளிவாக உள்ளது.
- source_word: ἡμῶν
  choice: நமக்கு
  rationale: τύποι உடனான உரிய தொடர்பை இயல்பான தமிழில் ‘நமக்கு எடுத்துக்காட்டுகள்’ என்று தருகிறது.
- source_word: ἐγενήθησαν
  choice: ஆயின
  rationale: அவை இத்தகைய எடுத்துக்காட்டுகளாக ஆனது அல்லது செயல்படத் தொடங்கியது என்ற γίνομαι வினையின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: εἰς τὸ μὴ εἶναι ἡμᾶς
  choice: நாம் ... இருக்காதபடி
  rationale: நோக்கம் அல்லது விளைவு என்ற இரு நிழல்களுக்கும் இடமளிக்கும் இயல்பான தமிழ் அமைப்பு; ἐπιθυμητάς என்பது நபர்களைக் குறிக்கும் பெயர்ச்சொல் என்பதால் ‘விரும்புகிறவர்களாக’ என்ற கூறைத் தக்கவைக்கிறது.
- source_word: ἐπιθυμητὰς κακῶν
  choice: தீயவற்றை விரும்புகிறவர்களாக
  rationale: ἐπιθυμητάς என்பதன் நபரைக் குறிக்கும் வடிவத்தையும் κακῶν என்பதன் விருப்பத்திற்குரிய பொருட்களையும் வெளிப்படுத்துகிறது; பாலியல் பொருளுக்கு மட்டும் சுருக்கக்கூடிய ‘இச்சிக்கிறவர்கள்’ என்பதைத் தவிர்க்கிறது.
- source_word: καθὼς κἀκεῖνοι ἐπεθύμησαν
  choice: அவர்கள் அவற்றை விரும்பியதுபோலவே
  rationale: καθὼς இன் ஒப்பீட்டையும் κἀκεῖνοι இன் ‘அவர்களும்’ என்ற சேர்க்கை உணர்வையும் சூழலுக்கேற்ற தமிழில் தருகிறது; ‘அவற்றை’ என்பது முன்னுள்ள ‘தீயவற்றை’ தெளிவாக மீண்டும் சுட்டுகிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் வனாந்தர அனுபவங்களுடன் τύποι என்பதன் தொடர்பு
  choice: ஒழுக்க எச்சரிக்கை தரும் ‘எடுத்துக்காட்டுகள்’
  alternative: மாதிரிகள்; வகைமுன்னடையாளங்கள்
  rationale: உடனடியான சூழல் சபையை எச்சரித்து நடத்தையைத் திருத்துவதை வலியுறுத்துகிறது. தொழில்நுட்பமான வகைமையியல் கோட்பாட்டைச் சேர்க்காமல், கிரேக்கச் சொல்லின் மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: ἐπιθυμέω சார்ந்த விருப்ப மொழியின் பரப்பு
  choice: விரும்புதல்
  alternative: இச்சித்தல்; பேராசைப்படுதல்
  rationale: இங்கு குறிப்பது பாலியல் இச்சை மட்டும் அல்ல, பரந்த தீய நாட்டம். ஆகவே பொருளைத் தேவையின்றி குறுக்காமல் அறநெறிசார் தீவிரத்தைத் தக்கவைக்கிறது.
- issue: εἰς τὸ அமைப்பில் நோக்கமா விளைவா
  choice: ‘இருக்காதபடி’ என்று இரு நிழல்களுக்கும் இடமளித்தல்
  alternative: இருக்கக்கூடாது என்பதற்காக; அதன் விளைவாக இருக்காமல்
  rationale: கிரேக்க அமைப்பு நோக்கம் அல்லது விளைவு என்ற நெருங்கிய பொருள் நிழல்களை ஏற்கக்கூடும்; தமிழ் மொழிபெயர்ப்பு ஒன்றை மட்டும் வற்புறுத்தாமல் எச்சரிக்கையின் செயல்பாட்டைத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தீயவற்றை விரும்புகிறவர்களாக’ என்பது சற்றே விரிவானதாக இருந்தாலும், கிரேக்கத்தில் உள்ள நபரைக் குறிக்கும் ἐπιθυμητάς வடிவத்தைத் தக்கவைக்கிறது. மூலத்தில் வாக்கியத் தொடக்கத்தில் வெளிப்படையான ‘இப்போது’ இல்லை; δὲ மென்மையான உரையோட்டக் குறியீடாக இருப்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
