base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: ta
  text: அவிசுவாசிகளில் ஒருவர் உங்களை விருந்துக்கு அழைத்து, நீங்கள் செல்ல விரும்பினால், உங்கள் முன் பரிமாறப்படும் எதையும் சாப்பிடுங்கள். மனச்சாட்சியின் பொருட்டு[b] எதையும் விசாரிக்காதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எதையும் ஆராயாமல்’ அல்லது ‘எந்த விசாரணையும் செய்யாமல்’ என்றும் மொழிபெயர்க்கலாம். உணவின் பின்னணி அல்லது அது எங்கிருந்து வந்தது என்பதை விசாரிக்க வேண்டாம் என்பதே இங்குள்ள கருத்து.
    reason: lexical_alternative
  - marker: b
    text: ‘மனச்சாட்சி’ என்பது யாருடையது என்பதை இவ்வசனம் தனியே குறிப்பிடவில்லை. அடுத்த வசனத்தில் பவுல் ‘மற்றவருடைய மனச்சாட்சி’ என்று தெளிவுபடுத்துகிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: அவிசுவாசிகளில்
  rationale: கிறிஸ்துவில் விசுவாசம் கொள்ளாத மக்களைக் குறிக்கும் பவுலின் குழு வேறுபாட்டைச் சுருக்கமாகக் காக்கிறது; தேவையற்ற பகைமைத் தொனியைச் சேர்ப்பதில்லை.
- source_word: καλεῖ
  choice: விருந்துக்கு அழைத்து
  rationale: உணவுச் சூழலில் καλέω என்பது பொதுவாக ‘அழை’ என்பதைக் காட்டிலும் விருந்துக்கு அழைப்பதைக் குறிக்கிறது; ‘விருந்துக்கு’ என்பது தமிழில் சூழலை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: θέλετε πορεύεσθαι
  choice: நீங்களும் போக விரும்பினால்
  rationale: அழைப்பை ஏற்றுச் செல்வதற்கான விருப்பத்தை இயல்பான நிபந்தனை வடிவில் வெளிப்படுத்துகிறது.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: உங்கள் முன் பரிமாறப்படும் எதையும்
  rationale: உணவாக முன்வைக்கப்படுவதைக் குறிக்கும் பங்கேற்பு வடிவத்தையும் πᾶν என்பதன் விரிவான பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐσθίετε
  choice: சாப்பிடுங்கள்
  rationale: பொதுவான அறிவுறுத்தலாக உள்ள நிகழ்காலக் கட்டளையை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: μηδὲν ἀνακρίνοντες
  choice: அதைப் பற்றி எதையும் விசாரிக்காதீர்கள்
  rationale: உணவின் பின்னணி அல்லது மூலத்தை ஆராய வேண்டாம் என்ற நடைமுறைப் பொருளைத் தருகிறது; வெறுமனே கேள்வி கேட்பதையெல்லாம் தடைசெய்வதாக மிகைப்படுத்துவதில்லை.
- source_word: διὰ τὴν συνείδησιν
  choice: மனச்சாட்சியின் பொருட்டு
  rationale: διά உடன் வரும் காரணம் அல்லது கருத்தில் கொள்ளுதல் என்ற தொடர்பைக் காக்கிறது; மனச்சாட்சி யாருடையது என்பதை இவ்வசனத்திலேயே தீர்மானிக்கவில்லை.
theological_decisions:
- issue: இச்சூழலில் συνείδησις என்பதன் குறிப்பு
  choice: ‘மனச்சாட்சி’ என்று பொதுவாகவே வைத்து, அது யாருடைய மனச்சாட்சி என்பதை அடுத்த வசனத்தின் விளக்கத்திற்கே விடுதல்
  alternative: இது விசுவாசியின் சொந்த மனச்சாட்சி என்று அல்லது மற்றவரின் மனச்சாட்சி என்று இவ்வசனத்திலேயே குறிப்பாக்குதல்
  rationale: கிரேக்க வாசகம் இங்கு சுருக்கமாகவும் குறிப்பு தெளிவற்றதாகவும் உள்ளது; அடுத்த வசனம் வேறொருவரின் மனச்சாட்சியை வெளிப்படையாகக் குறிப்பிடுகிறது. ஆகவே அந்த இறையியல் அழுத்தத்தையும் இயல்பான தெளிவின்மையையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. ‘விருந்துக்கு’ என்பது உணவுச் சூழலை இயல்பாக வெளிப்படுத்துகிறது. இரு அடிக்குறி குறியீடுகளும் அவை விளக்கும் இறுதி அறிவுறுத்தலுக்குப் பின் வைக்கப்பட்டுள்ளன.
