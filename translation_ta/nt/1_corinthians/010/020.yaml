id: 1CO.10.20
reference: 1 Corinthians 10:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: ta
  text: இல்லை; மாறாக, அவர்கள் பலியிடுபவற்றைப் பேய்களுக்குப் பலியிடுகிறார்கள்; கடவுளுக்கல்ல. பேய்களுடன் பங்காளிகளாக நீங்கள் ஆகுவதை நான் விரும்பவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேய்களுடன் பங்கேற்பவர்களாக” அல்லது “பேய்களுடன் பங்குகொள்பவர்களாக.”
    reason: κοινωνός என்ற சொல் பகிர்வு, பங்கேற்பு, கூட்டுறவு ஆகிய தொடர்புடைய நுணுக்கங்களைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: இல்லை; ... மாறாக என்ற கருத்தோட்டம்
  rationale: முந்தைய வசனத்திலிருந்து எழக்கூடிய தவறான புரிதலைப் பவுல் திருத்துகிறார். தமிழில் இயல்பாக அந்தத் திருத்தும் எதிர்மறை வலிமையைத் தொடக்கத்திலுள்ள “இல்லை” வெளிப்படுத்துகிறது.
- source_word: ἃ θύουσιν
  choice: அவர்கள் பலியிடுகிறவற்றை
  rationale: நடுநிலைப் பன்மை உறவுப்பெயர் பலிப்பொருட்களைப் பொதுவாகக் குறிக்கிறது; தேவையற்ற விளக்கத்தைச் சேர்க்காமல் பொருளைத் தக்கவைக்கிறது.
- source_word: θύουσιν
  choice: பலியிடுகிறார்கள்
  rationale: வழிபாட்டுச் சூழலில் θύω என்பது பலியாகச் செலுத்துவதைக் குறிக்கிறது; “பலியிடு” அதன் சடங்குசார் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: δαιμονίοις
  choice: பேய்களுக்கு
  rationale: புதிய ஏற்பாட்டுச் சூழலில் δαιμόνιον தீய ஆவிக்குரிய உயிரினங்களைக் குறிக்கிறது. நவீனத் தமிழில் “பேய்கள்” இயல்பானதும் பரவலாகப் புரிந்துகொள்ளப்படுவதுமான சொல்.
- source_word: καὶ οὐ θεῷ
  choice: கடவுளுக்கு அல்ல
  rationale: இங்கு θεῷ மெய்யான ஒரே கடவுளைக் குறிக்கிறது; பேய்களுடனான நேரடியான வேறுபாட்டை மொழிபெயர்ப்பு காக்கிறது.
- source_word: οὐ θέλω δὲ
  choice: நான் விரும்பவில்லை
  rationale: δέ இங்கு கருத்தைத் தொடர்ந்து முன்னெடுக்கிறது. தமிழில் தனியாக இணைப்புச்சொல் சேர்க்காமலேயே இரண்டாவது வாக்கியம் இயல்பான தொடர்ச்சியை அளிக்கிறது.
- source_word: κοινωνοὺς
  choice: பங்குகொள்கிறவர்கள்
  rationale: κοινωνός உண்மையான பங்கேற்பையும் தொடர்பையும் குறிக்கிறது. “பங்குகொள்கிறவர்கள்” திருச்சபைச் சிறப்புச்சொல்லைத் திணிக்காமல் அந்தப் பங்கேற்பின் கனத்தை வெளிப்படுத்துகிறது.
- source_word: τῶν δαιμονίων
  choice: பேய்களோடு
  rationale: κοινωνός உடன் வரும் உரிமை வேற்றுமையைத் தமிழில் உறவு அல்லது பங்கேற்பாக “பேய்களோடு” என்பது இயல்பாகத் தெரிவிக்கிறது.
- source_word: γίνεσθαι
  choice: ஆகுவதை
  rationale: γίνομαι ஏற்கெனவே இருக்கும் நிலையை அல்ல, அந்த நிலைக்குள் வருவதை வலியுறுத்துகிறது; “ஆகுவதை” இதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பிறதெய்வ வழிபாட்டுப் பலிகளின் இயல்பு
  choice: அந்தப் பலிகள் பேய்களுக்கே செலுத்தப்படுகின்றன, கடவுளுக்கு அல்ல
  alternative: இது விக்கிரக விருந்துகளின் சமூகப் பொருளைப் பற்றிய உருவகமான கூற்று மட்டுமே
  rationale: “பேய்களுக்கே ... கடவுளுக்கு அல்ல” என்ற வெளிப்படையான வேறுபாட்டை மென்மைப்படுத்தாமலும் அதற்கு அப்பால் ஊகம் சேர்க்காமலும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: κοινωνοὺς τῶν δαιμονίων என்பதன் வலிமை
  choice: பேய்களுடன் உண்மையான பங்கேற்புத் தொடர்பு
  alternative: விக்கிரக வழிபாட்டாளர்களுடனான வெறும் சமூகத் தொடர்பு அல்லது பேய்களுக்கான முழுமையான விசுவாச உறுதி
  rationale: சுற்றியுள்ள வசனங்களில் κοινωνία உண்மையான பங்கேற்பைக் குறிக்கிறது. “பேய்களோடு பங்குகொள்கிறவர்கள்” அந்தக் கனத்தைத் தக்கவைக்கிறது; அதேவேளையில் முழுமையான வழிபாட்டு விசுவாசம் என்று மிகைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “பேய்கள்,” “பலியிடுகிறார்கள்,” “பங்குகொள்கிறவர்கள்” என்பவை சாதாரண வாசகர்களுக்குப் புரியக்கூடியவையாகவும் மூலத்தின் வழிபாட்டு மற்றும் பங்கேற்புச் சார்ந்த வலிமையைத் தக்கவைக்கக்கூடியவையாகவும் உள்ளன.
