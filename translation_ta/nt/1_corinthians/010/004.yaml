  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய வேறுபாடுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: πάντες τὸ αὐτό என்பதன் ‘அனைவரும் ஒரே,’ aorist ἔπιον என்பதன் ‘குடித்தார்கள்,’ imperfect ἔπινον என்பதன் ‘குடித்துக்கொண்டிருந்தார்கள்,’ மற்றும் நிகழ்காலப் பங்கேற்புவினை ἀκολουθούσης என்பதன் தொடர்நிலை ‘பின்தொடர்ந்துகொண்டிருந்த’ ஆகியவை முறையாக வெளிப்படுகின்றன. பெயரில்லா genitive πέτραக்கு ‘ஒரு கற்பாறை’ என்பதும், பின்னர் article உடைய ἡ πέτραக்கு ‘அந்தக் கற்பாறை’ என்பதும் மூலத்தின் குறிப்புத்தன்மை வேறுபாட்டை நன்கு காட்டுகின்றன. இறுதிச் சமன்பாட்டுக் கூற்று விளக்கமாகச் சுருக்கப்படாமல் நேரடியாகவே உள்ளது.'
  naturalness: நவீனத் தரத் தமிழில் நடை கண்ணியமாகவும் தெளிவாகவும் உள்ளது. ‘ஆவிக்குரிய பானம்,’ ‘கற்பாறை,’ ‘மெசியா’ ஆகியவை இச்சூழலுக்கு ஏற்ற நிலையான வேதாகமச் சொல்லாட்சிகள். ‘குடித்தார்கள்’ மற்றும் ‘குடித்துக்கொண்டிருந்தார்கள்’ ஆகியவை ஒரே வாக்கியத்தில் வருவது கிரேக்க வினைநிலை வேறுபாட்டை நோக்கமுடன் காப்பதால் இயல்புக்கேடாக இல்லை.
  terminology: πνευματικός என்பதற்கு ‘ஆவிக்குரிய’ என்று பயன்படுத்தியிருப்பது பொருளை ‘அற்புதமான’ அல்லது ‘அடையாளமான’ எனக் குறுக்காமல் பாதுகாக்கிறது. Χριστός பட்டவகையில் உள்ளதால் ‘மெசியா’ பொருத்தமானது. ‘கற்பாறை’ πέτραவின் பாறை/பெருங்கல் உணர்வையும் உருவக வலிமையையும் காக்கிறது.
