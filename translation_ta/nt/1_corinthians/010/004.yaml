reference: 1 Corinthians 10:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: ta
  text: அனைவரும் ஒரே ஆவிக்குரிய பானத்தைக் குடித்தார்கள்; ஏனெனில், அவர்களைப் பின்தொடர்ந்துகொண்டிருந்த ஆவிக்குரிய ஒரு கற்பாறையிலிருந்து அவர்கள் குடித்துக்கொண்டிருந்தார்கள்[a]. அந்தக் கற்பாறையோ மெசியாவாக இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பின்தொடர்ந்துகொண்டிருந்த’ என்பதற்கு ‘பின்தொடர்ந்த’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பங்கேற்புவினை தொடர்ச்சியான செயற்பாங்கைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘கிறிஸ்து.’ இங்கு Χριστός ஒரு பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: ஆவிக்குரிய பானம்
  rationale: πνευματικός என்பதன் இறையியல் நிறையையும் முந்தைய வசனத்தின் ‘ஆவிக்குரிய உணவு’ என்பதுடனான இணைப்பையும் காக்கிறது; ‘அற்புதமான’ அல்லது ‘அடையாளமான’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: ἔπιον
  choice: குடித்தார்கள்
  rationale: வனாந்தரத் தலைமுறையினர் அனைவரும் பகிர்ந்த அனுபவத்தைத் தொகுத்துக் கூறும் இறந்தகால வினையாக இயல்பாக அமைகிறது.
- source_word: ἔπινον
  choice: குடித்துக்கொண்டிருந்தார்கள்
  rationale: கிரேக்க imperfect வினையின் தொடர்ச்சியான அல்லது மீண்டும் நிகழ்ந்த செயற்பாங்கைக் காத்து, முன்னுள்ள aorist வினையிலிருந்து வேறுபடுத்துகிறது.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: அவர்களைப் பின்தொடர்ந்துகொண்டிருந்த ஆவிக்குரிய ஒரு கற்பாறையிலிருந்து
  rationale: பெயர்ச்சொல்லுக்கு article இல்லாததால் ‘ஒரு’ என மொழிபெயர்க்கப்பட்டுள்ளது; நிகழ்காலப் பங்கேற்புவினையின் தொடர்நிலையை ‘பின்தொடர்ந்துகொண்டிருந்த’ வெளிப்படுத்துகிறது.
- source_word: πέτρα
  choice: கற்பாறை
  rationale: πέτρα என்பது சிறு கல்லை அல்ல, பாறையைக் குறிக்கிறது; ‘கற்பாறை’ தமிழில் உருவக வலிமையையும் தெளிவாகக் காக்கிறது.
- source_word: ἡ πέτρα δὲ ἦν
  choice: அந்தக் கற்பாறையோ ... இருந்தது
  rationale: δέ தரும் மெல்லிய மாற்றத்தையும் விளக்கத் தொடரையும் ‘-யோ’ இயல்பாக வெளிப்படுத்துகிறது; முன்பு குறிப்பிடப்பட்ட கற்பாறையை ‘அந்த’ அடையாளப்படுத்துகிறது.
- source_word: ὁ Χριστός
  choice: மெசியா
  rationale: இங்கு Χριστός ஒரு பெயர்போன்ற வடிவத்தைவிட பட்டமாகவும் முன்னடையாள அடையாளப்படுத்தலாகவும் செயல்படுவதால் ‘மெசியா’ பொருத்தமானது.
- source_word: πάντες τὸ αὐτὸ
  choice: அனைவரும் ஒரே
  rationale: முழுக் குழுவினருக்கும் பொதுவாயிருந்த ஒரே அனுபவத்தைப் பற்றிய பவுலின் வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: ‘அந்தக் கற்பாறை மெசியாவாக இருந்தது’ என்ற அடையாளக் கூற்று
  choice: கிரேக்கத்தின் நேரடியான சமன்பாட்டு வாக்கியத்தை ‘அந்தக் கற்பாறையோ மெசியாவாக இருந்தது’ என்று காத்தல்
  alternative: ‘அந்தக் கற்பாறை மெசியாவைக் குறித்தது’
  rationale: ἡ πέτρα δὲ ἦν ὁ Χριστός என்பது நேரடியான அடையாளக் கூற்று. அதை வெறும் குறியீடாகச் சுருக்காமலும், பொருள்பாறையும் நபரும் எந்த விதத்தில் தொடர்புடையவர்கள் என்று உரைக்கு அப்பால் விளக்காமலும் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: பானத்தையும் கற்பாறையையும் விவரிக்கும் πνευματικός என்பதன் பொருள்
  choice: ஆவிக்குரிய
  alternative: அற்புதமான; அடையாளமான
  rationale: பவுலின் சொல்லையே தக்கவைத்து, தெய்வீக ஏற்பாடு, ஆவியின் தளம், முன்னடையாள முக்கியத்துவம் ஆகியவற்றுள் ஒன்றை மட்டும் தீர்மானித்து விடாமல் உண்மையான பொருள் அகலத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘ஆவிக்குரிய,’ ‘கற்பாறை,’ ‘மெசியா’ ஆகியவை பொதுவாசகருக்குப் புரியக்கூடிய வேதாகமச் சொல்லாட்சிகள். ἔπιον/ἔπινον வேறுபாடு ‘குடித்தார்கள்’/‘குடித்துக்கொண்டிருந்தார்கள்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
