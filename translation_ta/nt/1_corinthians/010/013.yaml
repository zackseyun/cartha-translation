  naturalness: திருத்தப்பட்ட சொற்றொடர் நவீன நிலையான தமிழில் நேரடியானதும் இயல்பானதும் ஆகும். “மனிதருக்குப் பொதுவான” என்பது ἀνθρώπινος என்பதன் மனிதகுல-பொதுப் பொருளைத் தெளிவாகத் தருகிறது. “சோதனையோடு சேர்த்து” என்பது “சோதனையோடுகூட” என்பதைக் காட்டிலும் சற்று இயல்பாக வாசிக்கிறது.
  terminology: ‘சோதனை’ என்பது πειρασμός-இன் பரந்த, சூழலுக்கேற்ற தேர்வாகும்; அடிக்குறிப்பு பாவத்திற்கான தூண்டுதல் மற்றும் சோதித்தல் என்ற மாற்றுகளைப் பாதுகாக்கிறது. ‘நம்பிக்கைக்குரியவர்,’ ‘அனுமதிக்கமாட்டார்,’ ‘தாங்கிக்கொள்ள,’ மற்றும் ‘மீளும் வழி’ ஆகியவை கண்ணியமான நவீன தமிழ் நடையிலும் மூலத்தின் கருத்திலும் பொருந்துகின்றன.
