  revised_text: மனிதருக்குப் பொதுவானதைத் தவிர, வேறெந்த சோதனையும் உங்களைப் பற்றிக்கொள்ளவில்லை.[a] ஆனால் கடவுள் நம்பிக்கைக்குரியவர். உங்களால் தாங்க முடிவதற்கு அதிகமாக நீங்கள் சோதிக்கப்பட அவர் அனுமதிக்கமாட்டார்; மாறாக, நீங்கள் அதைத் தாங்கிக்கொள்ளும்படி, சோதனையோடு சேர்த்து அதிலிருந்து மீளும் வழியையும் ஏற்படுத்துவார்.[b][c]
