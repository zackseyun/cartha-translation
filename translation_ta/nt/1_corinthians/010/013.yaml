  revision_rationale: மூலத்தின் εἰ μὴ ἀνθρώπινος என்ற கட்டுப்பாட்டை ‘வேறெந்த சோதனையும்’ என்பதோடு நேரடியாக இணைத்து, சோதனையின் மனிதருக்குப் பொதுவான தன்மையைத் தெளிவாக்கினேன். இதனால் பொருள் மாற்றமின்றி வாசிப்புத் தெளிவு மேம்படுகிறது. σύν-இன் உடனிருப்பு பொருளை இயல்பாகத் தர ‘சோதனையோடு சேர்த்து’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு அடையாளங்களும் அவற்றின் சொற்சார் மாற்றுகளும் பாதுகாக்கப்பட்டுள்ளன.
