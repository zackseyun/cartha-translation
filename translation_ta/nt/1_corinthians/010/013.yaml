id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: ta
  text: மனிதருக்குப் பொதுவானதைத் தவிர, வேறெந்த சோதனையும் உங்களைப் பற்றிக்கொள்ளவில்லை.[a] ஆனால் கடவுள் நம்பிக்கைக்குரியவர். உங்களால் தாங்க முடிவதற்கு அதிகமாக நீங்கள் சோதிக்கப்பட அவர் அனுமதிக்கமாட்டார்; மாறாக, நீங்கள் அதைத் தாங்கிக்கொள்ளும்படி, சோதனையோடு சேர்த்து அதிலிருந்து மீளும் வழியையும் ஏற்படுத்துவார்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனித இயல்புக்குரிய சோதனையைத் தவிர” அல்லது “மனிதர்கள் பொதுவாக அனுபவிக்கும் சோதனையைத் தவிர.”
    reason: lexical_alternative
  - marker: b
    text: இவ்வசனத்தில் “சோதனை / சோதிக்கப்பட” என்பவற்றை “பாவத்துக்கான தூண்டுதல் / தூண்டப்பட” அல்லது “சோதித்தல் / சோதிக்கப்பட” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அதிலிருந்து மீளும் வழி” என்பதை “தப்பும் வழி” அல்லது “அதன் முடிவு” என்றும் மொழிபெயர்க்கலாம். கடவுள் ஏற்படுத்தும் இந்த வழி, சோதனையைத் தாங்கிக்கொள்ள உதவுகிறது என்பதே வாக்கியத்தின் வலியுறுத்தல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: சோதனை / சோதிக்கப்பட
  rationale: இச்சொற்கள் பாவத்துக்கான தூண்டுதலையும் பொதுவான சோதித்தல் அல்லது நெருக்கடியையும் குறிக்கலாம். தமிழில் ‘சோதனை’ இந்த இரு பரிமாணங்களுக்கும் இடமளிக்கிறது; ‘தூண்டுதல்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἴληφεν
  choice: பற்றிக்கொள்ளவில்லை
  rationale: λαμβάνω என்பதன் நிறைவுற்ற வடிவம் சோதனை வாசகர்களை வந்தடைந்து பிடித்துக்கொண்ட அனுபவத்தைச் சுட்டுகிறது. ‘பற்றிக்கொள்’ இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: மனிதருக்கு ஏற்படக்கூடிய ... தவிர
  rationale: ἀνθρώπινος என்பது மனித இயல்புக்குரிய அல்லது மனிதர்கள் அனுபவிக்கக்கூடிய ஒன்றைக் குறிக்கிறது; சோதனை தனித்துவமானதோ மனித ஆற்றலுக்கு அப்பாற்பட்டதோ அல்ல என்பதைக் காட்டுகிறது.
- source_word: πιστός
  choice: நம்பிக்கைக்குரியவர்
  rationale: கடவுளின் உறுதியான நம்பகத்தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘உண்மையுள்ளவர்’ என்பதும் சாத்தியம்.
- source_word: ἐάσει
  choice: அனுமதிக்கமாட்டார்
  rationale: ἐάω என்பதன் ‘அனுமதி அளித்தல்’ என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: உங்களால் தாங்க முடிவதற்கு அதிகமாக
  rationale: கிரேக்கத்தில் ‘உங்களால் முடிவதற்கு அப்பால்’ என்று சுருக்கமாக இருந்தாலும், இறுதி வாக்கியத்தின் ὑπενεγκεῖν அடிப்படையில் தமிழில் ‘தாங்க’ சேர்ப்பது இயல்பும் தெளிவும் தருகிறது.
- source_word: ποιήσει
  choice: ஏற்படுத்துவார்
  rationale: ποιέω அடிப்படையில் ‘செய்வார்/உண்டாக்குவார்’ எனப் பொருள்படும்; ἔκβασις உடன் கடவுள் ஒரு மீள்வழியை உண்டாக்குவார் என்ற கருத்தை ‘ஏற்படுத்துவார்’ இயல்பாகத் தருகிறது.
- source_word: σὺν τῷ πειρασμῷ
  choice: சோதனையோடுகூட
  rationale: சோதனையும் கடவுள் ஏற்படுத்தும் வழியும் ஒன்றோடொன்று இணைந்திருப்பதை σύν துல்லியமாகக் குறிக்கிறது.
- source_word: ἔκβασιν
  choice: அதிலிருந்து மீளும் வழி
  rationale: ἔκβασις வெளியேறும் வழி, தப்பும் வழி, அல்லது விளைவு எனப் பொருள்படலாம். அடுத்துள்ள ‘தாங்கிக்கொள்ள’ என்பதோடு முரண்படாமல், சோதனையை வெறுமனே தவிர்த்துவிடுதல் அல்ல அதைக் கடந்து மீளுதல் என்ற பொருளை இத்தேர்வு தருகிறது.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: நீங்கள் அதைத் தாங்கிக்கொள்ளும்படி
  rationale: இக்கூற்று நோக்கம் அல்லது விளைவைக் குறிக்கிறது. ὑποφέρω என்பதன் அழுத்தத்தின் கீழ் நிலைத்து நிற்றல் என்ற பொருளை ‘தாங்கிக்கொள்’ தருகிறது.
theological_decisions:
- issue: πειρασμός என்பது பாவத்தூண்டுதலா, சோதித்தலா?
  choice: முதன்மை உரையில் பரந்த பொருளுடைய ‘சோதனை’ பயன்படுத்தப்பட்டது.
  alternative: ‘பாவத்துக்கான தூண்டுதல்’ அல்லது ‘சோதித்தல்’
  rationale: உடனடிச் சூழலில் பாவ ஆசையும் சிலைவழிபாடும் பற்றிய எச்சரிக்கை இருப்பதால் ஒழுக்கப் பரிமாணம் வலுவாக உள்ளது. எனினும் கிரேக்கச் சொல் நெருக்கடி அல்லது சோதித்தலையும் குறிக்க முடிவதால், தமிழில் இரண்டிற்கும் இடமளிக்கும் சொல்லும் அடிக்குறிப்பும் பயன்படுத்தப்பட்டன.
- issue: கடவுள் அளிக்கும் ἔκβασις சோதனையை உடனடியாக அகற்றுகிறதா?
  choice: ‘அதிலிருந்து மீளும் வழி’ என்று மொழிபெயர்த்து, அது தாங்குவதற்காக அளிக்கப்படுகிறது என்பதைத் தெளிவாக வைத்திருக்கிறது.
  alternative: ‘தப்பும் வழி’ அல்லது ‘முடிவு’
  rationale: வசனத்தின் இறுதிப்பகுதி அந்த வழியின் நோக்கம் தாங்கிக்கொள்வது எனக் கூறுகிறது. ஆகவே சோதனையை உடனடியாக அகற்றுவதாகவோ வெறும் தப்பித்தலாகவோ கருத்தைத் தீர்மானிக்காமல் மூலத்தின் இறுக்கம் பாதுகாக்கப்படுகிறது.
- issue: கடவுளின் πιστός என்ற பண்பு
  choice: ‘நம்பிக்கைக்குரியவர்’
  alternative: ‘உண்மையுள்ளவர்’
  rationale: இங்கு கடவுள் தமது மக்களின் சோதனையை வரையறுத்து, தாங்கும் வழியை ஏற்படுத்துவார் என்ற அவரது நம்பகத்தன்மையே வலியுறுத்தப்படுகிறது; தனிப்பட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘சோதனை’ என்ற சொல் வசனத்தின் ஒழுக்க மற்றும் நெருக்கடி சார்ந்த இரு சாத்தியங்களையும் இயல்பாகத் தாங்குகிறது. வாக்கிய அமைப்பு கிரேக்கத்தின் எதிர்மறை–நேர்மறை மாறுபாட்டை (‘ஆனால்’, ‘மாறாக’) பாதுகாக்கிறது.
