- from: அவர்களில் சிலர் அவரைச் சோதித்துப் பார்த்து, பாம்புகளால்[b] அழிக்கப்பட்டதுபோல, நாமும் மெசியாவை[a] சோதித்துப் பார்க்க வேண்டாம்.
  to: நாமும் மெசியாவை[a] சோதித்துப் பார்க்க வேண்டாம்; அவர்களில் சிலர் அவரைச் சோதித்துப் பார்த்து, பாம்புகளால்[b] அழிக்கப்பட்டார்கள்.
