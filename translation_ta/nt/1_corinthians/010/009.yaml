id: 1CO.10.9
reference: 1 Corinthians 10:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: ta
  text: நாமும் மெசியாவை[a] சோதித்துப் பார்க்க வேண்டாம்; அவர்களில் சிலர் அவரைச் சோதித்துப் பார்த்து, பாம்புகளால்[b] அழிக்கப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “மெசியா” என்பதற்குப் பதிலாக “ஆண்டவர்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “சர்ப்பங்களால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: நாமும் ... வேண்டாம்
  rationale: முந்தைய எச்சரிக்கைகளின் தொடர்ச்சியாக வரும் தடை என்பதையும், முதல் நபர் பன்மை அறிவுறுத்தலையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐκπειράζωμεν
  choice: சோதித்துப் பார்க்க வேண்டாம்
  rationale: ஒருவரை முறையற்ற விதத்தில் சோதனைக்கு உட்படுத்துதல் என்ற எதிர்மறை நுணுக்கத்தைத் தருகிறது; ‘சோதிக்கத் தூண்டுதல்’ போன்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: τὸν Χριστόν
  choice: மெசியாவை
  rationale: Χριστός இங்கு பட்டமாக இருப்பதால் அதன் பொருளைத் தரும் ‘மெசியா’ பயன்படுத்தப்பட்டது; தனிப்பெயர்போல ‘கிறிஸ்து’ என்று ஒலிபெயர்க்கப்படவில்லை.
- source_word: καθώς
  choice: '...துபோல'
  rationale: வனாந்தரத் தலைமுறையின் நிகழ்வுக்கும் வாசகர்களுக்கான எச்சரிக்கைக்கும் இடையிலான ஒப்புமையை இயல்பாக இணைக்கிறது.
- source_word: τινες αὐτῶν
  choice: அவர்களில் சிலர்
  rationale: வனாந்தரத்தில் இருந்த இஸ்ரவேலர்களில் சிலரைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἐπείρασαν
  choice: அவரைச் சோதித்துப் பார்த்து
  rationale: வரலாற்றில் நிகழ்ந்த சோதித்தலைக் குறிக்கிறது; ‘அவரை’ என்பது முந்தைய உட்பொருளான மெசியாவைத் தெளிவுபடுத்துகிறது.
- source_word: ὑπὸ τῶν ὄφεων
  choice: பாம்புகளால்
  rationale: ὄφις என்பதற்கான இயல்பான நவீனத் தமிழ்; ‘சர்ப்பங்கள்’ என்ற உயர்நடை மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀπώλλυντο
  choice: அழிக்கப்பட்டதுபோல
  rationale: செயப்பாட்டு அமைப்பையும் அழிவின் தீவிரத்தையும் காக்கிறது. கிரேக்க இறந்தகாலத் தொடர்நிலையின் நுணுக்கத்தைத் தமிழில் மிகக் கடினமாக்காமல் சூழல் சார்ந்த நிகழ்வாகத் தருகிறது.
theological_decisions:
- issue: τὸν Χριστόν என்பதன் வாசகமும் சுட்டுப்பொருளும்
  choice: மெசியாவை
  alternative: ஆண்டவரை; கிறிஸ்துவை
  rationale: SBLGNT மூலவாசகம் Χριστόν என்று இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டது. இது வனாந்தரத்தில் இஸ்ரவேலர் சோதித்தவருடன் மெசியாவை இணைக்கும் பவுலின் வலுவான கூற்றைத் தீர்த்துவிடாமல் காக்கிறது. ‘ஆண்டவர்’ என்ற முக்கியமான கையெழுத்துப் பிரதி வேறுபாடு அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகமத்துக்கேற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. கிரேக்க வாக்கிய வரிசையை அப்படியே பின்பற்றாமல், ஒப்புமையை முதலில் வைத்து தமிழில் தெளிவான எச்சரிக்கை வாக்கியமாக அமைக்கப்பட்டுள்ளது.
