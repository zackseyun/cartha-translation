  source_fidelity: The draft accurately preserves the two parallel rhetorical questions, the blessing/bless verbal echo, κοινωνία as participatory sharing, and the titular rendering of Χριστός as “மேசியா.” The locative Tamil phrasing “இரத்தத்தில்/உடலில் பங்குபெறுதல்” naturally expresses participation in the genitive construction without deciding sacramental debates.
