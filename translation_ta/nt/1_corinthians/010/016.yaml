reference: 1 Corinthians 10:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: ta
  text: நாம் ஆசீர்வதிக்கும் ஆசீர்வாதக் கிண்ணம், மேசியாவின் இரத்தத்தில் பங்குபெறுதல் அல்லவா? நாம் உடைக்கும் அப்பம், மேசியாவின் உடலில் பங்குபெறுதல் அல்லவா?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பங்குகொள்ளுதல்”; மரபாக, “ஐக்கியம்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “கிறிஸ்து” (Χριστός); இங்கு அது பட்டப்பெயராக இருப்பதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது. மரபாக, “கிறிஸ்து.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον τῆς εὐλογίας
  choice: ஆசீர்வாதக் கிண்ணம்
  rationale: ‘கிண்ணம்’ என்பது இயல்பான நவீனத் தமிழ்; ‘ஆசீர்வாதக்’ என்பது εὐλογίας என்பதையும் உணவு/வழிபாட்டுப் பின்னணியின் திறந்த தன்மையையும் காக்கிறது.
- source_word: ὃ εὐλογοῦμεν
  choice: நாம் ஆசீர்வதிக்கும்
  rationale: εὐλογία / εὐλογοῦμεν என்ற பெயர்ச்சொல்–வினைச்சொல் மீளுருவை முடிந்தவரை காக்கிறது; ‘நன்றி செலுத்தும்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: οὐχὶ
  choice: அல்லவா?
  rationale: உடன்பாடான பதிலை எதிர்பார்க்கும் கிரேக்க வினாவின் வடிவத்தையும் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: κοινωνία
  choice: பங்குபெறுதல்
  rationale: வெறும் சமூக உறவைக் காட்டாமல் உண்மையான பங்கேற்பை உணர்த்துகிறது; பிந்தைய திருச்சபைத் தொழில்நுட்பச் சொல்லால் விளக்கத்தை முன்கூட்டியே முடிவுசெய்யாது.
- source_word: τοῦ αἵματος
  choice: இரத்தத்தில்
  rationale: கிரேக்கப் பொருளின் பலி மற்றும் உடன்படிக்கை சார்ந்த வலிமையை விளக்கச் சேர்க்கையின்றிக் காக்கிறது; κοινωνία உடன் இயல்பான தமிழ் வேற்றுமை உருபைப் பயன்படுத்துகிறது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὸν ἄρτον
  choice: அப்பம்
  rationale: வேதாகம மற்றும் பொதுத் தமிழ் வழக்கில் புரியக்கூடிய இயல்பான சொல்; இவ்வசனம் கட்டாயப்படுத்தாத ‘ஒரே அப்பம்’ என்ற குறிப்பைச் சேர்க்கவில்லை.
- source_word: ὃν κλῶμεν
  choice: நாம் பிட்டுக்கொள்ளும்
  rationale: சடங்கின் தெளிவான செயலை இயல்பான தமிழில் காக்கிறது.
- source_word: τοῦ σώματος
  choice: உடலில்
  rationale: நேரடியான மொழிபெயர்ப்பு; நற்கருணை மற்றும் கிறிஸ்தியல் சார்ந்த பொருளை ஒரு குறிப்பிட்ட கோட்பாட்டுக்குள் சுருக்கவில்லை.
theological_decisions:
- issue: திருவிருந்து சார்ந்த சூழலில் κοινωνία என்பதன் பொருள்
  choice: பங்குபெறுதல்
  alternative: பங்குகொள்ளுதல்; ஐக்கியம்
  rationale: மேசியாவின் இரத்தத்திலும் உடலிலும் உண்மையான பங்கேற்பை உணர்த்துகிறது; ஆனால் அந்தப் பங்கேற்பு நிகழும் முறையைப் பற்றிய பிரிவுசார் விவாதத்தை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயர் சார்ந்த பொருள் செயலிலுள்ளது; மரபான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இரு இணையான சொல்லாட்சிகளும் வினாவடிவமும் காக்கப்பட்டுள்ளன. ‘ஆசீர்வாதக் கிண்ணம் / ஆசீர்வதிக்கும்’ என்ற மீளுரு திட்டமிட்டு வைக்கப்பட்டுள்ளது; திருவிருந்தின் செயல்முறையைப் பற்றிய பிரிவுசார் விளக்கம் சேர்க்கப்படவில்லை.
