base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: ta
  text: ஒரே அப்பம்[a] இருப்பதால், பலராகிய நாம் ஒரே உடலாய் இருக்கிறோம்; ஏனெனில் நாம் அனைவரும் அந்த ஒரே அப்பத்தில் பங்குகொள்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரே அப்பம்” என்பதை இரண்டு இடங்களிலும் “ஒரே முழு அப்பம்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ἄρτος ஒரு முழு அப்பத்தைக் குறிக்கவும் முடியும்; இது பலர் ஒரே அப்பத்தில் பங்குகொள்வது என்ற உருவகத்தை மேலும் தெளிவாக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: இருப்பதால்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் சொல்லின் காரணப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εἷς ἄρτος
  choice: ஒரே அப்பம்
  rationale: ἄρτος என்பதன் ‘அப்பம்/ரொட்டி’ என்ற உணவுப் பொருளையும், ஒன்றே என்பதன் வலியுறுத்தலையும் காக்கிறது; இச்சூழலில் ‘அப்பம்’ கண்ணியமானதும் பரவலாகப் புரியக்கூடியதும் ஆகும்.
- source_word: ἓν σῶμα
  choice: ஒரே உடல்
  rationale: σῶμα என்பதற்கான நேரான மொழிபெயர்ப்பு; சமூக ஒற்றுமையையும் திருவிருந்துச் சூழலின் இறையியல் செறிவையும் விளக்கிச் சுருக்காமல் காக்கிறது.
- source_word: οἱ πολλοί
  choice: பலராகிய நாம்
  rationale: பலர் என்ற பன்மைக்கும் ‘ஒரே உடல்’ என்ற ஒருமைக்கும் இடையிலான முரண்நயத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: அடுத்த உட்பிரிவு முந்தைய கூற்றை விளக்கும் காரணமாக இருப்பதைத் தெளிவுபடுத்துகிறது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: குழுவின் ஒவ்வொருவரும் பகிர்ந்துகொள்ளும் பங்கேற்பை வலியுறுத்துகிறது.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: அந்த ஒரே அப்பத்திலிருந்து
  rationale: ἐκ குறிக்கும் மூலத்திலிருந்து பகிர்ந்துகொள்ளுதல் என்ற நுணுக்கத்தையும், அப்பத்தின் ஒருமையையும் காக்கிறது.
- source_word: μετέχομεν
  choice: பங்குபெறுகிறோம்
  rationale: உண்மையான பகிர்ந்த பங்கேற்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெறும் உண்ணுதலாகவோ பிற்காலச் சபைக் கோட்பாடாகவோ பொருளைச் சுருக்குவதில்லை.
theological_decisions:
- issue: ஒரே அப்பத்துக்கும் ஒரே உடலுக்கும் உள்ள உறவு
  choice: ஒரே அப்பத்திலிருந்து அனைவரும் பங்குபெறுவதையும் விசுவாசிகள் ஒரே உடலாய் இருப்பதையும் பவுல் இணைப்பதுபோலவே மொழிபெயர்ப்பு இணைக்கிறது.
  alternative: அப்பத்தை ஒற்றுமையின் வெறும் அடையாளமாக மட்டும் வாசித்தல்; அல்லது அப்பத்தின் வழியாகவே அந்த ஒற்றுமை நிகழ்த்தப்படுகிறது என்று மேலும் குறிப்பாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க உரை அப்பத்தில் பகிர்ந்து பங்கேற்பதற்கும் பலர் ஒரே உடலாய் இருப்பதற்கும் காரணத் தொடர்பை அமைக்கிறது; ஆனால் பிற்காலத் திருவிருந்து கோட்பாடுகளில் ஒன்றை மொழிபெயர்ப்பே தீர்மானிக்கவில்லை. ஆகவே அந்த இறையியல் அழுத்தமும் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பங்குபெறுகிறோம்’ என்பது திருவிருந்து சார்ந்த ஒலிநயத்தை வைத்துக்கொண்டு பழமையான அல்லது குறிப்பிட்ட திருச்சபை மரபுக்குரிய சொற்களைத் தவிர்க்கிறது. அடிக்குறி குறியீடு மாற்று மொழிபெயர்ப்புக்குரிய இரு நிகழ்வுகளையும் உள்ளடக்கும் வகையில் வாக்கிய முடிவில் இடப்பட்டுள்ளது.
