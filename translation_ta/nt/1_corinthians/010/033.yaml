source:
  edition: SBLGNT
  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: ta
  text: அதுபோலவே நானும், எல்லாவற்றிலும் எல்லாரையும் பிரியப்படுத்துகிறேன்[a]; என் சொந்த நன்மையை நாடாமல், பலருடைய நன்மையையே நாடுகிறேன்[b], அவர்கள் மீட்கப்படும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாவற்றிலும் எல்லாருக்கும் ஏற்றபடி நடக்கிறேன்.” கிரேக்கத்தில் நேரடியாக, “எல்லாவற்றிலும் எல்லாரையும் பிரியப்படுத்துகிறேன்” என்று உள்ளது; இங்கு பிறருடைய நன்மைக்காக விரிவாகப் பொருந்திச் செல்லுதல் கருத்தாகும்.
    reason: lexical_alternative
  - marker: b
    text: '“நன்மை” என்பதை “பயன்” அல்லது “சாதகம்” என்றும் மொழிபெயர்க்கலாம்: “என் சொந்தப் பயனை அல்ல, பலருடைய பயனையே நாடுகிறேன்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: அதுபோலவே நானும்
  rationale: முந்தைய அறிவுறுத்தலோடு பவுலின் சொந்த முன்மாதிரியை ஒப்பிடும் தொடர்பையும் κἀγώ என்பதிலுள்ள ‘நானும்’ என்ற வலியுறுத்தலையும் இயல்பாகக் காக்கிறது.
- source_word: πάντα πᾶσιν ἀρέσκω
  choice: எல்லாவற்றிலும் எல்லாருக்கும் உகந்தவனாக இருக்கிறேன்
  rationale: கிரேக்கச் சொற்றொடரின் விரிவான பொருந்திச் செல்லுதலைக் காக்கிறது. ‘எல்லாரையும் மகிழ்விக்கிறேன்’ என்பது மனித அங்கீகாரத்தை நாடுதல் என்று தவறாகப் புரியக்கூடும்; ‘உகந்தவனாக’ என்பது பிறருடைய நன்மைக்காக அவர்களைக் கருத்தில் கொண்டு நடப்பதை இச்சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: μὴ ζητῶν
  choice: நாடாமல்
  rationale: தற்போதைய வினையெச்சத்தின் முறை அல்லது நோக்கத்தைத் தமிழில் சுருக்கமாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: என் சொந்த நன்மையை
  rationale: σύμφορον என்பதன் ‘பயன், நன்மை, சாதகம்’ என்ற பொருள்களில், எதிர்வரும் பலருடைய நன்மையுடன் இயல்பான இணைப்பை ஏற்படுத்த ‘நன்மை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: பலருடைய நன்மையை நாடி
  rationale: கிரேக்கத்தில் விடுபட்டிருக்கும் σύμφορον என்பதைத் தமிழில் தெளிவுக்காக மீட்டுரைக்கிறது; ‘பலர்’ என்ற மூலத்தின் வரம்பை ‘அனைவர்’ அல்லது பொதுவான ‘பிறர்’ என்று மாற்றவில்லை.
- source_word: ἵνα σωθῶσιν
  choice: அவர்கள் மீட்கப்படும்படி
  rationale: ἵνα கூறும் நோக்கத்தையும் σωθῶσιν என்பதன் இறையியல் சார்ந்த இரட்சிப்பு அர்த்தத்தையும் செயப்பாட்டு வடிவையும் காக்கிறது; செய்பவரை மொழிபெயர்ப்பில் கூடுதலாகக் குறிப்பிடவில்லை.
theological_decisions:
- issue: σωθῶσιν என்பதன் பொருள்
  choice: அவர்கள் மீட்கப்படும்படி
  alternative: அவர்கள் காப்பாற்றப்படும்படி / உதவி பெறும்படி
  rationale: இங்கு பவுலின் சுவிசேஷ நோக்கமுள்ள சூழல், வெறும் சமூக உதவி அல்லது உடல் பாதுகாப்பை விட இரட்சிப்பு சார்ந்த பொருளை ஆதரிக்கிறது. அதேவேளை, செய்பவர் யார் என்பதைத் தமிழில் சேர்க்காமல் கிரேக்கச் செயப்பாட்டு வடிவம் காக்கப்படுகிறது.
- issue: ἀρέσκω என்பதில் பிறரைப் பிரியப்படுத்துவதன் தன்மை
  choice: எல்லாருக்கும் உகந்தவனாக இருக்கிறேன்
  alternative: எல்லாரையும் மகிழ்விக்கிறேன் / எல்லாருடைய அங்கீகாரத்தையும் நாடுகிறேன்
  rationale: அடுத்துவரும் ‘என் சொந்த நன்மையை நாடாமல், பலருடைய நன்மையை நாடி’ என்ற பகுதி இதைத் தன்னலமற்ற பொருந்திச் செல்லுதலாக வரையறுக்கிறது; கொள்கையை விட்டுக்கொடுப்பதாகவோ மனித அங்கீகாரத்தை நாடுவதாகவோ மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ஒப்பீட்டு அமைப்பு, ‘பலர்’ என்ற சொல், இரட்சிப்பு நோக்கம் ஆகியவை காக்கப்பட்டுள்ளன. அடிக்குறிகள் [a], [b] முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
