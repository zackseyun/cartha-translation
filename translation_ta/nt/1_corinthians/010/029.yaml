id: 1CO.10.29
reference: 1 Corinthians 10:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: ta
  text: நான் குறிப்பிடுவது உங்கள் சொந்த மனச்சாட்சியை அல்ல; மற்றவருடைய மனச்சாட்சியையே[a]. ஏனெனில், என் சுதந்திரம் வேறொருவரின் மனச்சாட்சியால் ஏன் தீர்ப்பிடப்படுகிறது?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “தனது சொந்த மனச்சாட்சியை அல்ல, மற்றவருடையதை.” சூழல், “உங்கள் சொந்த மனச்சாட்சியை அல்ல, மற்றவருடையதை” என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த வினாவை பவுலின் சொந்த வாதவினாவாகவும், அல்லது அவர் எடுத்துரைக்கும் ஓர் எதிர்ப்பாகவும் புரிந்துகொள்ளலாம். கிரேக்கத்தில் பேச்சாளர் மாறுவதைச் சுட்டும் வெளிப்படையான மேற்கோள் குறிகள் இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν / συνειδήσεως
  choice: மனச்சாட்சி
  rationale: ஒருவரின் செயல்களை ஒழுக்க அடிப்படையில் மதிப்பிடும் உள்ளார்ந்த உணர்வைக் குறிக்கும் பவுலின் வழக்கமான சொல்லாட்சிக்கு நவீனத் தமிழில் இயல்பானதும் துல்லியமானதும் ‘மனச்சாட்சி’ ஆகும்.
- source_word: δὲ λέγω
  choice: நான் சொல்வது
  rationale: இங்கு புதிய கருத்தைத் தொடங்காமல் முந்தைய வசனத்தின் பொருளை பவுல் தெளிவுபடுத்துகிறார். ‘நான் சொல்வது’ என்பது அந்த விளக்கத் தன்மையை இயல்பாகக் காட்டுகிறது; மூலத்தில் இல்லாத காலச் சுட்டுச் சொல்லைச் சேர்ப்பதில்லை.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: உங்கள் சொந்த மனச்சாட்சியை அல்ல, மற்றவருடைய மனச்சாட்சியையே
  rationale: கிரேக்க வடிவம் சொற்சொல்லாக ‘அவனுடைய சொந்த ... அல்ல, மற்றவருடையது’ என இருந்தாலும், சூழலில் கொரிந்திய வாசகரின் மனச்சாட்சிக்கும் மற்றவரின் மனச்சாட்சிக்கும் உள்ள வேறுபாடே நோக்கமாகத் தெரிகிறது. தமிழில் எதிர்மறை அமைப்பையும் வலியுறுத்தலையும் தெளிவாகத் தருகிறது.
- source_word: ἱνατί γὰρ
  choice: ஏனெனில் ... ஏன்
  rationale: γάρ முந்தைய விளக்கத்துடன் காரணத் தொடர்பை ஏற்படுத்துகிறது; ἱνατί வினாவூட்டும் ‘ஏன்’ என்ற பொருளைத் தருகிறது. தமிழ் வாக்கிய ஒழுங்குக்கேற்ப இரண்டும் பிரித்து அமைக்கப்பட்டுள்ளன.
- source_word: ἐλευθερία
  choice: சுதந்திரம்
  rationale: அனுமதிக்கப்பட்ட செயலைச் செய்வதற்கான உரிமை அல்லது விடுதலையை இங்கு குறிக்கிறது. ‘சுதந்திரம்’ நவீனத் தமிழில் தெளிவான, சமயப் பிரிவுச் சாய்வற்ற சொல்.
- source_word: κρίνεται
  choice: தீர்ப்பிடப்பட வேண்டும்
  rationale: κρίνω என்பதன் விரிந்த ‘மதிப்பிட்டு தீர்ப்பு வழங்குதல்’ என்ற பொருளைத் தக்கவைக்கிறது; ‘குற்றவாளியாகத் தீர்க்கப்படுதல்’ என்ற அதிகக் குறிப்பிட்ட பொருளைத் திணிப்பதில்லை. கேள்வியின் இயல்பைத் தமிழில் வழங்க ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: வேறொருவரின் மனச்சாட்சியால்
  rationale: தீர்ப்பிடும் காரணியாக மற்றொருவரின் மனச்சாட்சியைக் குறிப்பிடும் செயப்பாட்டு அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: முதல் கூறிலுள்ள உடைமைச் சுட்டின் குறிப்பு
  choice: ‘உங்கள் சொந்த மனச்சாட்சி’ என்று, கொரிந்திய வாசகரைக் குறிப்பதாக முதன்மை உரையில் வழங்கப்பட்டது.
  alternative: ‘அவனுடைய சொந்த மனச்சாட்சி அல்ல, மற்றவருடையது’ என்று கிரேக்க வடிவத்தைச் சொற்சொல்லாக வழங்கலாம்.
  rationale: ἑαυτοῦ மூன்றாம் நபர் ஒருமை வடிவில் இருந்தாலும், முந்தைய வசனத்தின் நேரடி அறிவுறுத்தல் மற்றும் இவ்வசனத்தின் தெளிவுபடுத்தும் செயல்பாடு வாசகரின் மனச்சாட்சியையும் மற்றவரின் மனச்சாட்சியையும் எதிர்காட்டுகின்றன. உண்மையான வடிவியல் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: இரண்டாம் கூறிலுள்ள வினாவின் பேச்சாளர் மற்றும் செயல்பாடு
  choice: மேற்கோள் குறியீடுகள் இன்றி சொல்லாட்சியை ஒரு திறந்த வினாவாக வைத்தல்.
  alternative: இதைப் பவுலின் சொந்த வாதவினாவாகவோ, அவர் எடுத்துரைக்கும் கொரிந்தியரின் எதிர்ப்பாகவோ வெளிப்படையாகக் குறிக்கலாம்.
  rationale: கிரேக்கத்தில் பேச்சாளர் மாறுவதைச் சுட்டும் வெளிப்படையான குறியீடு இல்லை. ஆகவே எந்த ஒரு விளக்கத்தையும் முதன்மை உரையில் திணிக்காமல், இரு சாத்தியங்களையும் அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘மனச்சாட்சி’, ‘சுதந்திரம்’, ‘தீர்ப்பிடப்படுதல்’ ஆகியவை துல்லியத்தையும் இயல்பையும் சமநிலைப்படுத்துகின்றன. மூலத்தின் உடைமைச் சுட்டு மற்றும் வாதவினாவின் பேச்சாளர் குறித்த உண்மையான தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
