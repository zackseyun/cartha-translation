  source_fidelity: மூலக் கிரேக்கத்தின் நிபந்தனைத் தொடரான εἴ τις οὐ φιλεῖ τὸν κύριον, அதன் தீர்ப்புரைக்கும் கட்டளை ἤτω ἀνάθεμα, மற்றும் தீர்மானிக்கப்படாத அரமேய வடிவமான Μαράνα θά ஆகிய அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘சாபத்திற்குள்ளாகட்டும்’ என்பது ἀνάθεμα-வின் கடுமையான தீர்ப்புப் பொருளைச் சரியாகத் தருகிறது.
  naturalness: ‘யாராவது ஆண்டவரை நேசிக்காவிட்டால், அவர் சாபத்திற்குள்ளாகட்டும்’ என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமான வேதாகமப் பதிவுக்கு ஏற்றதாகவும் உள்ளது. ‘மரானா தா’ ஒலிபெயர்ப்பு வாசிப்புக்கு ஏற்றது.
  terminology: ‘ஆண்டவர்’ κύριον என்பதற்கான நிலையான பொருத்தமான கிறிஸ்தவத் தமிழ் பயன்பாடாகும். ‘நேசிக்க’ φιλεῖ-யின் தனிப்பட்ட அன்பு என்ற பொருளை அதிகப்படுத்தாமலும் குறைக்காமலும் தருகிறது. ‘அனாத்தேமா’ மற்றும் அரமேயச் சொற்றொடருக்கான அடிக்குறிப்புகள் தேவையான மாற்றுப் புரிதல்களைப் பாதுகாக்கின்றன.
