  text: εἴ τις οὐ φιλεῖ τὸν ⸀κύριον, ἤτω ἀνάθεμα. ⸂Μαράνα θά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: ta
  text: யாராவது ஆண்டவரை நேசிக்காவிட்டால், அவர் சாபத்திற்குள்ளாகட்டும்.[a] மரானா தா.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, மரபுவழக்கில்: ‘அனாத்தேமா’; அதாவது, சாபத்தின்கீழ் இருக்கட்டும்.'
    reason: lexical_alternative
  - marker: b
    text: அரமேயம். இதற்கு ‘எங்கள் ஆண்டவரே, வாரும்!’ அல்லது ‘எங்கள் ஆண்டவர் வந்திருக்கிறார்’ என்று பொருள் இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: நேசிக்காவிட்டால்
  rationale: இங்கு φιλέω ஆண்டவர்மீது கொள்ளும் தனிப்பட்ட அன்பைக் குறிக்கிறது. ‘நேசி’ என்பது அதன் பொருளை இயல்பான நவீனத் தமிழில் அளவுக்கு மீறி விளக்காமல் தெரிவிக்கிறது.
- source_word: κύριον
  choice: ஆண்டவரை
  rationale: பவுலின் இந்தச் சூழலில் κύριος இயேசுவைக் குறிக்கும் பட்டப்பெயர். ‘ஆண்டவர்’ அதன் கிறிஸ்துவியல் நிறையையும் புதிய ஏற்பாட்டுப் பயன்பாட்டையும் காக்கிறது.
- source_word: ἤτω
  choice: உள்ளாகட்டும்
  rationale: εἰμί என்பதன் நிகழ்காலக் கட்டளை வடிவம் இங்கு விருப்புறுத்தும் அல்லது தீர்ப்புரைக்கும் வலிமையுடன் வருகிறது. ‘உள்ளாகட்டும்’ நவீனத் தமிழில் அந்த வலிமையை இயல்பாகக் காட்டுகிறது.
- source_word: ἀνάθεμα
  choice: சாபத்திற்குள்ளாகட்டும்
  rationale: ἀνάθεμα என்பது அழிவுக்கு ஒப்புக்கொடுக்கப்பட்ட அல்லது சாபத்தின்கீழ் உள்ள நிலையைக் குறிக்கிறது. ‘சாபத்திற்குள்ளாகட்டும்’ அதன் கடுமையான தீர்ப்புத் தொனியைத் தெளிவாகத் தெரிவிக்கிறது; ஒலிபெயர்ப்பான ‘அனாத்தேமா’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Μαράνα θά
  choice: மரானா தா
  rationale: இது கிரேக்க எழுத்துகளில் பாதுகாக்கப்பட்ட அரமேயச் சொற்றொடர். அதன் சொற்பிரிப்பும் துல்லியமான பொருளும் விவாதத்திற்குரியவை என்பதால், மூல வடிவத்தை ஒலிபெயர்த்து முதன்மை உரையில் வைத்துப் பிரதான பொருள் வாய்ப்புகளை அடிக்குறிப்பில் தருவது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: Μαράνα θά என்ற அரமேயச் சொற்றொடரின் பொருள்
  choice: முதன்மை உரையில் ‘மரானா தா’ என்று ஒலிபெயர்த்தல்
  alternative: ‘எங்கள் ஆண்டவரே, வாரும்!’ அல்லது ‘எங்கள் ஆண்டவர் வந்திருக்கிறார்.’
  rationale: சொற்றொடர் உரைப்பாடளவில் நிலையானதாக இருந்தாலும், அரமேயத்தில் அதை எவ்வாறு பிரித்துப் புரிந்துகொள்வது என்பது விவாதத்திற்குரியது. ஒலிபெயர்ப்பு அதன் வழிபாட்டு அல்லது உணர்ச்சிமிக்க இயல்பைப் பாதுகாத்து, தீர்மானிக்க முடியாத பொருளை வலுக்கட்டாயமாகத் தீர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் வசனத்தின் கடுமையான, கண்ணியமான தொனி காக்கப்பட்டுள்ளது. ‘யாராவது ... அவர்’ என்பது பாலினத்தை முன்னிறுத்தாத இயல்பான பொதுக்குறிப்பாகப் பயன்படுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்புக் குறிகளும் உரையில் சேர்க்கப்பட்டுள்ளன.
