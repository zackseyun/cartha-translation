reference: 1 Corinthians 16:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: θύρα γάρ μοι ἀνέῳγεν μεγάλη καὶ ἐνεργής, καὶ ἀντικείμενοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: ta
  text: ஏனெனில், ஒரு பெரிய, பயன்மிக்க கதவு எனக்குத் திறந்திருக்கிறது[a]; எதிர்ப்பவர்களும் பலர் இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு பெரிய, பயன்மிக்க வாய்ப்பு எனக்குக் கிடைத்திருக்கிறது.” ஊழியத்திற்கான ஒரு வாய்ப்பைக் குறிக்கப் பவுல் “கதவு” என்பதை உருவகமாகப் பயன்படுத்துகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: கதவு
  rationale: இச்சொல்லின் நேரடிப் பொருளான ‘கதவு’ என்பதையே வைத்து, ஊழியத்திற்கான வாய்ப்பைக் குறிக்கும் பவுலின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வசனங்களில் பவுல் கூறிய பயணத் திட்டத்திற்கான காரணத்தை இவ்விடைச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: μοι
  choice: எனக்கு
  rationale: திறக்கப்பட்ட கதவு பவுலுக்குரியதாக அல்லது அவருக்காக அமைந்ததாக இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀνέῳγεν
  choice: திறந்திருக்கிறது
  rationale: முன்பு திறக்கப்பட்டதன் விளைவாக இப்போதும் திறந்த நிலையில் இருப்பதைக் குறிக்கும் நிறைவுற்ற வினையின் அம்சத்தைத் தமிழில் வெளிப்படுத்துகிறது; செய்பவரைத் தேவையின்றி குறிப்பிடவில்லை.
- source_word: μεγάλη
  choice: பெரிய
  rationale: கதவின் உருவகத்தைத் தக்கவைத்தபடி, அந்தத் திறப்பின் அளவையும் முக்கியத்துவத்தையும் தெரிவிக்கிறது.
- source_word: ἐνεργής
  choice: பயன்மிக்க
  rationale: இந்தச் சூழலில் ஊழியத்திற்கு விளைவளிக்கக்கூடிய அல்லது பயனுள்ளதாக இருக்கும் திறப்பை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ἀντικείμενοι
  choice: எதிர்ப்பவர்கள்
  rationale: பவுலையும் அவரது பணியையும் எதிர்த்து நிற்பவர்களைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள பங்கேற்பு வினையைத் தெளிவாகவும் மிகைப்படுத்தாமலும் தருகிறது.
- source_word: πολλοί
  choice: பலர்
  rationale: எதிர்ப்பவர்களின் எண்ணிக்கை அதிகம் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ஊழிய வாய்ப்பைக் குறிக்கும் ‘கதவு’ உருவகம்
  choice: ‘வாய்ப்பு’ என்று விளக்கமாக மாற்றாமல் ‘கதவு’ என்ற உருவகத்தை முதன்மை உரையில் வைத்தல்
  alternative: ஒரு பெரிய, பயன்மிக்க வாய்ப்பு எனக்குக் கிடைத்திருக்கிறது
  rationale: மூல உரை பவுலுக்கே உரிய பரிச்சயமான உருவகத்தைப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது மூலத்தின் காட்சியமைப்பையும், ஊழிய வாய்ப்பு என்ற உட்பொருளை வாசகர் சூழலிலிருந்து உணர்வதற்கான இடத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. ‘கதவு’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘திறந்திருக்கிறது’ என்பது நிறைவுற்ற வினையின் தொடரும் நிலையைக் காட்டுகிறது. இரண்டாவது καί என்பதற்கு விளக்கமான முரண்பாட்டைச் சேர்க்காமல் ‘எதிர்ப்பவர்களும்’ என்று இணைப்புத் தன்மை தக்கவைக்கப்பட்டுள்ளது.
