  text: ἐὰν δὲ ⸂ἄξιον ᾖ⸃ τοῦ κἀμὲ πορεύεσθαι, σὺν ἐμοὶ πορεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/004.yaml
  text: And if it is worthwhile for me to go also, they will go with me.
translation:
  language: ta
  text: நானும் செல்வது பொருத்தமானதாக இருந்தால்[a], அவர்கள் என்னுடன் செல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நானும் செல்வது ஏற்புடையதாக இருந்தால்.” கிரேக்கச் சொற்றொடர், சூழ்நிலைக்கேற்ப எது பொருத்தமானது, ஏற்புடையது அல்லது பயனுள்ளது என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: இருந்தால்
  rationale: ἐάν நிபந்தனையை அறிமுகப்படுத்துகிறது; δέ இங்கு மென்மையான தொடரிணைப்பாக இருப்பதால், தமிழில் தனியாக ‘ஆனால்’ அல்லது ‘மேலும்’ என்று சேர்க்காமல் இயல்பான நிபந்தனை வாக்கியமாக வழங்கப்பட்டுள்ளது.
- source_word: ἄξιον ᾖ
  choice: பொருத்தமானதாக இருந்தால்
  rationale: இது ஒருவரின் ஒழுக்கத் தகுதியைக் குறிக்காமல், சூழ்நிலையில் ஒரு செயல் ஏற்புடையதா அல்லது செய்யத் தக்கதா என்பதைக் குறிக்கும் ஆளில்லா சொற்றொடர்.
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: நானும் போவது
  rationale: τοῦ உடனான வினையெச்ச வடிவம் பரிசீலிக்கப்படும் செயலின் உள்ளடக்கத்தைத் தருகிறது; κἀμέ-யின் சேர்க்கைப் பொருளை ‘நானும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σὺν ἐμοὶ
  choice: என்னுடன்
  rationale: σύν உடன் வரும் இவ்வடிவம் உடன்செல்லுதலை நேரடியாகக் குறிக்கிறது.
- source_word: πορεύσονται
  choice: போவார்கள்
  rationale: எதிர்காலத்தில் பிரதிநிதிகள் செல்வதைக் குறிக்கிறது; முந்தைய ‘போவது’ என்பதுடனான மூலத்தின் வினைச்சொல் மீளுருவாக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: பவுல் பிரதிநிதிகளுடன் செல்வது குறித்த நிபந்தனையின் பொருள்
  choice: தானும் செல்வது சூழ்நிலைக்குப் பொருத்தமானதாக இருந்தால், பிரதிநிதிகள் தன்னுடன் செல்வார்கள் என்று பவுல் கூறுகிறார்.
  alternative: காணிக்கை போதிய முக்கியத்துவம் உடையதாக இருந்தால் பவுல் செல்வார்; அல்லது பவுல் செல்லத் தகுதியுள்ளவராக இருந்தால் செல்வார்.
  rationale: ἄξιον என்பது இங்கு ஆளில்லா பயன்பாடு; தொடர்ந்து வரும் வினையெச்சத் தொடர், மதிப்பிடப்படுவது பவுலின் ஒழுக்கத் தகுதி அல்ல, அவர் செல்வது என்ற செயலே என்பதைக் காட்டுகிறது. ‘பொருத்தமானது’ என்பது நடைமுறைச் சூழலைக் காட்டுவதோடு, ‘செய்யத் தக்கது’ என்ற நுண்பொருளையும் அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடை. ‘பொருத்தமானதாக’ என்பது நிர்வாக அல்லது திருச்சபைச் சிறப்புமொழியைத் தவிர்த்து, சூழ்நிலை சார்ந்த கிரேக்கப் பொருளை இயல்பாகத் தருகிறது; அடிக்குறிப்பு உண்மையான சொற்பொருள் அகலத்தைப் பாதுகாக்கிறது.
