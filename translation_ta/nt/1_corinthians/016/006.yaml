language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πρὸς ὑμᾶς δὲ τυχὸν ⸀παραμενῶ ἢ ⸀καὶ παραχειμάσω, ἵνα ὑμεῖς με προπέμψητε οὗ ἐὰν πορεύωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/006.yaml
  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: ta
  text: ஒருவேளை நான் உங்களோடு தங்குவேன்; அல்லது குளிர்காலத்தைக்கூட உங்களோடு கழிப்பேன். நான் எங்கு செல்ல வேண்டியிருந்தாலும், நீங்கள் என்னை வழியனுப்பும்படியாக இவ்வாறு செய்வேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் பயணத்திற்கு உதவுவீர்கள்.’ கிரேக்க வினைச்சொல், புறப்படும் பயணியுடன் சிறிதுதூரம் செல்வதையோ, அவருக்குத் தேவையான பொருளுதவி செய்வதையோ உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: உங்களோடு
  rationale: தங்குதல் என்ற வினையுடன் πρός + வேற்றுமை உருபு நபர்களின் உடனிருப்பைக் குறிக்கிறது; நவீன தமிழில் ‘உங்களோடு’ இயல்பாக உள்ளது.
- source_word: δὲ
  choice: (தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை)
  rationale: இது முந்தைய பயணத் திட்டத்தை மென்மையாகத் தொடரும் இடைச்சொல். தமிழில் வாக்கியத் தொடர்ச்சியும் சொல் வரிசையும் அதன் பணியை இயல்பாக ஏற்கின்றன; ‘ஆனால்’ என்பது தேவையற்ற வலுவான முரண்பாட்டை உண்டாக்கும்.
- source_word: τυχὸν
  choice: ஒருவேளை
  rationale: பவுலின் திட்டம் உறுதியானதல்ல, சாத்தியமானது என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: παραμενῶ
  choice: சிறிதுகாலம் தங்கலாம்
  rationale: παραμένω என்பது தொடர்ந்து தங்கியிருப்பதைக் குறிக்கிறது. அடுத்துள்ள ‘குளிர்காலத்தைக் கழித்தல்’ என்ற நீண்ட தங்குதலோடு காணப்படும் உயர்வை இயல்பான தமிழில் காட்ட ‘சிறிதுகாலம்’ சூழல்சார் மறைபொருளாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ἢ καὶ παραχειμάσω
  choice: குளிர்காலத்தைக்கூட உங்களோடு கழிக்கலாம்
  rationale: ἢ καὶ இரண்டாவது சாத்தியத்தை வலுப்படுத்துகிறது; παραχειμάσω என்பது ஓரிடத்தில் குளிர்காலத்தைக் கழிப்பதைத் துல்லியமாகக் குறிக்கிறது.
- source_word: ἵνα
  choice: அப்போது
  rationale: முதன்மை வாக்கியத்தில் கூறப்பட்ட தங்குதலின் நோக்கமான அடுத்த செயலை இயல்பான தமிழில் இணைக்கிறது; நோக்கச் சார்பு சூழலில் தெளிவாகத் தங்குகிறது.
- source_word: προπέμψητε
  choice: நீங்கள் என்னை வழியனுப்பலாம்
  rationale: பயணச் சூழலில் προπέμπω ஒருவரை அனுப்பிவைத்தல், சிறிதுதூரம் உடன்செல்லுதல், அல்லது அடுத்த பயணத்திற்குத் தேவையான உதவியை வழங்குதல் ஆகிய நிழற்பொருள்களைக் கொண்டிருக்கலாம். ‘வழியனுப்பலாம்’ அடிப்படைப் பொருளை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: οὗ ἐὰν πορεύωμαι
  choice: நான் எங்கு சென்றாலும்
  rationale: ἐάν உடன் வரும் சார்பு அமைப்பு செல்லும் இடம் இன்னும் தீர்மானிக்கப்படாதது என்பதைக் காட்டுகிறது; ‘எங்கு சென்றாலும்’ தமிழில் அந்த வரையறுக்கப்படாத இலக்கை இயல்பாகத் தெரிவிக்கிறது.
