translation:
  language: ta
  text: கர்த்தராகிய இயேசுவின் அருள் உங்களோடு இருப்பதாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் ஆசிவாழ்த்துகளில் இறைவனிடமிருந்து வரும் கருணைமிக்க தயவையும் ஆசீர்வாதத்தையும் குறிக்கும் நிலைபெற்ற, இயல்பான தமிழ்ச் சொல்.
- source_word: κύριος
  choice: கர்த்தர்
  rationale: புதிய ஏற்பாட்டில் இயேசுவுக்குரிய பட்டத்தின் கிறிஸ்துவியல் வலிமையைக் காக்கும், தமிழ் வேதாகம மொழிநடையில் நன்கு அறியப்பட்ட இணைச்சொல்.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: μεθ’ ὑμῶν
  choice: உங்களோடு இருப்பதாக
  rationale: கிரேக்கத்தில் வினையின்றி நிற்கும் ‘உங்களோடு’ என்ற ஆசிவாழ்த்து வடிவத்தின் உள்ளார்ந்த விருப்பப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: கர்த்தராகிய இயேசுவின்
  rationale: மூலத்தின் உரிய வேற்றுமைத் தொடர்பைத் தக்கவைத்து, ‘கர்த்தர்’ என்பது இயேசுவுக்குரிய பட்டம் என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: வெளிப்படையான வினைச்சொல் இல்லாத ஆசிவாழ்த்து வடிவம்
  choice: ‘இருப்பதாக’ என்பதை வழங்குதல்
  alternative: ‘கர்த்தராகிய இயேசுவின் அருள் உங்களோடு.’
  rationale: கிரேக்க வாக்கியம் வினையின்றி இருந்தாலும், இது ஆசிவாழ்த்தாகச் செயல்படுகிறது. ‘இருப்பதாக’ என்பது அந்த மறைமுக விருப்பப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் வழிபாட்டு வாசிப்பிற்கு ஏற்றதுமான ஆசிவாழ்த்து. ‘அருள்’ மற்றும் ‘கர்த்தர்’ ஆகியவை பொதுவாக அறியப்பட்ட வேதாகமச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன.
