  source_fidelity: மூல கிரேக்கத்தின் ἡ χάρις τοῦ κυρίου Ἰησοῦ μεθ’ ὑμῶν என்ற ஆசிவாழ்த்து அமைப்பு துல்லியமாகப் பிரதிபலிக்கப்படுகிறது. χάρις ‘அருள்’ என்றும், τοῦ κυρίου Ἰησοῦ ‘கர்த்தராகிய இயேசுவின்’ என்றும், μεθ’ ὑμῶν என்பதன் மறைமுக ஆசிவாழ்த்துப் பொருள் ‘உங்களோடு இருப்பதாக’ என்றும் சரியாக வழங்கப்பட்டுள்ளன. மூலத்தில் இல்லாத ‘கிறிஸ்து’ சேர்க்கப்படவில்லை.
