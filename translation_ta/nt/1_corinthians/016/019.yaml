id: 1CO.16.19
reference: 1 Corinthians 16:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: ta
  text: ஆசியாவின்[a] திருச்சபைகள் உங்களுக்கு வாழ்த்துத் தெரிவிக்கின்றன. ஆக்கில்லாவும் பிரிஸ்காவும்[b], அவர்களுடைய வீட்டிலுள்ள திருச்சபையுடன் சேர்ந்து, ஆண்டவருக்குள் உங்களுக்கு மிகவும் உளமார வாழ்த்துத் தெரிவிக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “ஆசியா” என்பது இன்றைய ஆசியக் கண்டத்தை அல்ல, ஆசியா மைனரின் மேற்குப் பகுதியில் அமைந்திருந்த ரோம மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: கிரேக்க உரையில் “பிரிஸ்கா” என்று உள்ளது; வேறு இடங்களில் இவர் “பிரிஸ்கில்லா” என்றும் அழைக்கப்படுகிறார் (எடுத்துக்காட்டாக, அப்போஸ்தலர் 18:2, 18, 26; ரோமர் 16:3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: வாழ்த்துச் சொல்கின்றன / வாழ்த்துச் சொல்கிறார்கள்
  rationale: ἀσπάζομαι என்பதன் வழக்கமான பொருள் வாழ்த்துதல் அல்லது வாழ்த்துகளைத் தெரிவித்தல். நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘வாழ்த்துச் சொல்’ பயன்படுத்தப்பட்டது; இரண்டாம் வாக்கியத்தில் πολλὰ தரும் வலியுறுத்தல் தனியாக மொழிபெயர்க்கப்பட்டது.
- source_word: αἱ ἐκκλησίαι
  choice: திருச்சபைகள்
  rationale: பவுலின் பயன்பாட்டில் ἐκκλησία பொதுவாக உள்ளூர் கிறிஸ்தவ விசுவாசிகளின் கூடுகையைக் குறிக்கிறது. ‘திருச்சபைகள்’ என்பது தமிழில் தெளிவான, பரவலாகப் புரிந்துகொள்ளப்படும் பன்மை வடிவம்.
- source_word: τῆς Ἀσίας
  choice: ஆசியாவின்
  rationale: கிரேக்கத்தின் சுருக்கமான இடப்பெயர் வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது. இது இன்றைய ஆசியக் கண்டத்தைக் குறிக்காமல் ரோம மாகாணத்தைக் குறிக்கிறது என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என மொழிபெயர்க்கப்பட்டது. ‘ஆண்டவருக்குள்’ என்பது கிறிஸ்துவோடுள்ள உறவையும் விசுவாசக் கூட்டுறவின் சூழலையும் குறிக்கும் பவுலின் சொற்றொடரின் இறையியல் செறிவைப் பாதுகாக்கிறது.
- source_word: πολλὰ
  choice: மிகுந்த அன்புடன்
  rationale: ἀσπάζεται என்பதுடன் வினையடைபோல் வரும் πολλὰ வாழ்த்தின் வலிமையையும் உளமார்ந்த தன்மையையும் கூட்டுகிறது. தமிழில் சொற்சொல்லான ‘மிகுதியாக’ இயல்பற்றதாக இருப்பதால், அதன் சூழல்சார் வலிமை ‘மிகுந்த அன்புடன்’ எனத் தரப்பட்டது.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: ஆக்கில்லாவும் பிரிஸ்காவும்
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன. இவ்வசனத்தின் கிரேக்க உரையில் Πρίσκα என்ற குறும் பெயர்வடிவம் இருப்பதால் ‘பிரிஸ்கா’ பயன்படுத்தப்பட்டது; வேறு இடங்களில் காணப்படும் ‘பிரிஸ்கில்லா’ என்ற வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: அவர்களுடைய வீட்டிலுள்ள திருச்சபையுடன் சேர்ந்து
  rationale: κατ’ οἶκον என்பது வீட்டை மையமாகக் கொண்ட கூடுகையைக் குறிக்கிறது. ‘வீட்டிலுள்ள திருச்சபை’ என்பது மூலத்தின் சுருக்கத்தைக் காத்து, அது வீட்டில் கூடும் சபை என்பதை இயல்பாக உணர்த்துகிறது; ‘கூடுகிற’ என்பதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: வீட்டுச் சூழலில் ἐκκλησία என்பதன் பொருள்
  choice: ‘அவர்களுடைய வீட்டிலுள்ள திருச்சபை’ என்பது ஆக்கில்லா மற்றும் பிரிஸ்காவின் வீட்டில் கூடும் உள்ளூர் கிறிஸ்தவ விசுவாசிகளின் கூட்டத்தைக் குறிக்கிறது
  alternative: அவர்களுடைய குடும்பத்தையே அல்லது ஓர் நிறுவன அமைப்பையே குறித்தல்
  rationale: பவுலின் வழக்கமான சொற்பயன்பாடும் κατ’ οἶκον என்ற தொடரும் இதை வெறும் குடும்பமாக அல்லாமல் வீட்டில் கூடும் விசுவாசிகளின் சபையாகப் புரிந்துகொள்ள ஆதரிக்கின்றன. ஆயினும் மூலத்தில் இல்லாத ‘கூடுகிற’ என்ற வினை முதன்மை உரையில் சேர்க்கப்படவில்லை.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இந்தப் பவுலிய சொற்றொடரில் ‘ஆண்டவர்’ என்பது ஒப்புதல் சார்ந்த மற்றும் உறவு சார்ந்த வலிமைகளைப் பாதுகாக்கிறது; ‘எஜமான்’ இச்சூழலில் பொருளை தேவையின்றிக் குறுக்கிவிடும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவான வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வாழ்த்துச் சொல்’, ‘மிகுந்த அன்புடன்’ ஆகியவை இயல்பான தமிழ் வழக்கைத் தருகின்றன; ‘ஆண்டவருக்குள்’ மற்றும் ‘திருச்சபை’ ஆகியவை பவுலிய இறையியல் மற்றும் சபைச் சூழலைப் பாதுகாக்கின்றன. தனிப்பெயர்கள் மூல கிரேக்க வடிவங்களை நெருக்கமாகப் பின்பற்றுகின்றன.
