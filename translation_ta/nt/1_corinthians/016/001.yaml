source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: ta
  text: பரிசுத்தவான்களுக்கான[a] பணச் சேகரிப்பைக் குறித்து, கலாத்தியாவின் திருச்சபைகளுக்கு நான் அறிவுறுத்தியதுபோலவே நீங்களும் செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைமக்களுக்கான.”
    reason: ἅγιοι என்பதன் சமூகப் பொருளை நவீன வாசகருக்கு இயல்பாக விளக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: குறித்து
  rationale: பவுல் ஒரு புதிய பொருளை அறிமுகப்படுத்தும் கடித நடை மாற்றத்தை இயல்பான தமிழில் காட்டுகிறது; மூலத்தில் இல்லாத காலப் பொருளுடைய ‘இப்போது’ என்பதைச் சேர்க்கவில்லை.
- source_word: λογείας
  choice: பணச் சேகரிப்பு
  rationale: இச்சொல் பணம் திரட்டுவதைக் குறிக்கிறது. ‘சேகரிப்பு’ மட்டும் பொதுவாகத் தோன்றக்கூடும் என்பதால், சூழலைத் தெளிவாக்க ‘பணச்’ சேர்க்கப்பட்டது; வழிபாட்டுச் சடங்கு சார்ந்த ‘காணிக்கை’ என்ற மிகைக் குறிப்பைத் தவிர்க்கிறது.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: பரிசுத்தவான்களுக்கான
  rationale: εἰς பயனாளிகளைச் சுட்டுகிறது; ἅγιοι என்பதற்கான பவுலின் வழக்கமான சமூக அடையாளத்தை ‘பரிசுத்தவான்கள்’ தக்கவைக்கிறது.
- source_word: διέταξα
  choice: நான் அறிவுறுத்தியபடியே
  rationale: அதிகாரத்துடன் வழிமுறை கொடுத்ததை உணர்த்துகிறது; ‘கட்டளையிட்டேன்’ என்பதிலுள்ள தேவையற்ற கடுமையைத் தவிர்க்கிறது.
- source_word: ἐκκλησίαις
  choice: திருச்சபைகளுக்கு
  rationale: பவுலின் பயன்பாட்டில் கிறிஸ்தவ விசுவாசிகளின் உள்ளூர் சபைகளைக் குறிக்கிறது; தமிழில் நிலைபெற்ற பொதுவான சொல்.
- source_word: Γαλατίας
  choice: கலாத்தியாவிலுள்ள
  rationale: புவியியல் பெயரின் நிலையான தமிழ் ஒலிபெயர்ப்புடன், அப்பகுதியில் உள்ள திருச்சபைகள் என்ற உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: நீங்களும் செய்யுங்கள்
  rationale: ஒப்புமையையும் aorist imperative-இன் நேரடியான அறிவுறுத்தல் வலிமையையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: நிதி உதவிச் சூழலில் ἅγιοι என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்தவான்கள்
  alternative: இறைமக்கள்
  rationale: பவுல் விசுவாசிகளை அழைக்கும் தனித்துவமான சொல்லையும் அதன் இறையியல் தொடர்ச்சியையும் காக்கிறது; பின்னாளைய புனிதர் பட்டமளிப்பு கருத்தை இங்கு நோக்கமாகச் சேர்ப்பதில்லை. வாசகருக்கான மாற்று இயல்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆனால் எளிதில் புரியும் நடை. புதிய பொருளைத் தொடங்குவதை இரட்டைப்புள்ளி தெளிவாக்குகிறது. ‘பரிசுத்தவான்கள்’ என்ற மரபான பவுலியச் சொல் முதன்மை உரையில் காக்கப்பட்டு, ‘இறைமக்கள்’ அடிக்குறிப்பில் வழங்கப்பட்டது.
