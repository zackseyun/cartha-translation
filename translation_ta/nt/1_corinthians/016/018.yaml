  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் என் ஆவியையும் உங்கள் ஆவியையும் புத்துணர்வூட்டினார்கள். ஆகவே, இப்படிப்பட்டவர்களை மதியுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மதியுங்கள்’ என்பதற்கு ‘அங்கீகரியுங்கள்’ அல்லது ‘அறிந்துகொள்ளுங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இச்சொற்றொடர் ஆண்பால் பன்மை வடிவில் உள்ளது; இங்கு அது சற்றுமுன் குறிப்பிடப்பட்ட ஆண்களையே குறிப்பாகச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: புத்துணர்வு அளித்தார்கள்
  rationale: இங்கு வினைச்சொல் உடல்சார்ந்த ஓய்வைக் குறிக்காமல், உள்ளார்ந்த நிம்மதியையும் புதுப்பிக்கப்பட்ட வலிமையையும் உருவகமாகக் குறிக்கிறது. ‘புத்துணர்வு அளித்தார்கள்’ என்பது அந்தப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திலுள்ள வேண்டுகோளுக்கான காரணத்தை γάρ அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதன் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: πνεῦμα
  choice: ஆவி
  rationale: இங்கு πνεῦμα பரிசுத்த ஆவியைக் குறிப்பதல்ல; பவுலின் உள்ளார்ந்த மனநிலை அல்லது ஆன்மிக உள்ளத்தைக் குறிக்கிறது. ‘ஆவி’ பவுலின் சொல்லாட்சியையும் இயல்பான இருபொருள் சாத்தியத்தையும் காக்கிறது.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: என் ஆவிக்கும் உங்கள் ஆவிக்கும்
  rationale: τὸ ὑμῶν என்பதற்குப் பின் விடுபட்டுள்ள πνεῦμα தமிழில் இயல்பாக நிரப்பப்பட்டுள்ளது. இரு தரப்பினரின் உள்ளார்ந்த புத்துணர்வையும் இணை அமைப்பு தெளிவாக்குகிறது.
- source_word: ἐπιγινώσκετε
  choice: மதித்துணருங்கள்
  rationale: இங்கு வினைச்சொல் வெறுமனே அடையாளம் காண்பதைவிட, இப்படிப்பட்டவர்களின் மதிப்பையும் பணியையும் உணர்ந்து உரிய அங்கீகாரம் கொடுப்பதைச் சுட்டுகிறது. ‘மதித்துணருங்கள்’ அந்த விரிந்த பொருளை அளவுக்கு மீறி ‘கனப்படுத்துங்கள்’ என்று மாற்றாமல் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: οὖν முந்தைய கூற்றிலிருந்து வரும் நடைமுறைத் தீர்மானத்தை அறிமுகப்படுத்துகிறது; ‘ஆகவே’ அந்தத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: τοὺς τοιούτους
  choice: இப்படிப்பட்டவர்களை
  rationale: இந்தச் சொற்றொடர் உடனடி சூழலில் முன்பு குறிப்பிடப்பட்ட ஸ்தேவான், பொர்த்துனாத்து, அகாயக்கு ஆகிய ஆண்களைக் குறிக்கிறது. தமிழின் பன்மை மரியாதை வடிவான ‘வர்களை’ பாலினத்தை வெளிப்படையாகக் குறிப்பிடாமலிருந்தாலும் குறிப்பிட்ட அந்த நபர்களைக் குறிக்க இயல்பாக அமைகிறது; அடிக்குறிப்பு இதை விளக்குகிறது.
theological_decisions:
- issue: τοὺς τοιούτους என்பதன் பாலினக் குறிப்பு
  choice: முதன்மை உரையில் ‘இப்படிப்பட்டவர்களை’; அடிக்குறிப்பில் குறிப்பிட்ட ஆண்கள் என்பது விளக்கம்
  alternative: ‘இப்படிப்பட்ட ஆண்களை’
  rationale: கிரேக்க வடிவமும் உடனடி சூழலும் முன்பு பெயரிடப்பட்ட ஆண்களையே குறிக்கின்றன. ஆயினும் நவீன தமிழில் ‘இப்படிப்பட்ட ஆண்களை’ என்பது தேவையற்ற வலியுறுத்தலாகவும் இயல்பற்றதாகவும் ஒலிக்கலாம். ‘இப்படிப்பட்டவர்களை’ குறிப்பிட்ட நபர்களைக் குறிக்கும் இயல்பான தமிழாக இருந்து, அடிக்குறிப்பு மூலத்தின் பாலினத் துல்லியத்தைக் காக்கிறது.
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: மனிதரின் ‘ஆவி’ அல்லது உள்ளார்ந்த நிலை
  alternative: பரிசுத்த ஆவி
  rationale: ‘என்’ மற்றும் ‘உங்கள்’ என்ற உடைமை அமைப்பும், மனிதர்கள் அதற்குப் புத்துணர்வு அளித்ததாகக் கூறப்படுவதும், இங்கு தனிநபர் மற்றும் சபையாரின் உள்ளார்ந்த நிலையே குறிக்கப்படுவதை ஆதரிக்கின்றன. மொழிபெயர்ப்பு ‘ஆவி’ என்ற சொல்லைத் தக்கவைத்து பவுலின் உருவகத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதாகப் புரியும், அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆவி’ என்ற பவுலின் உருவகம் பாதுகாக்கப்பட்டு, ‘புத்துணர்வு அளித்தார்கள்’ மூலம் அதன் சூழல்சார் பொருள் தெளிவாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘மதித்துணருங்கள்’ என்ற சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
