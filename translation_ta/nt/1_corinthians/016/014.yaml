  yaml_path: translation/nt/1_corinthians/016/014.yaml
  text: Let all that you do be done in love[a].
translation:
  language: ta
  text: நீங்கள் செய்வதெல்லாம் அன்போடு செய்யப்படட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொறாக, “உங்களுக்குரிய அனைத்தும் அன்பில் ஆகட்டும்.”
    reason: πάντα ὑμῶν என்பதன் சொற்சொறான, திறந்த உறவை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: πάντα
  choice: எல்லாம்
  rationale: நடுநிலைப் பன்மையான πάντα அனைத்தையும் உள்ளடக்கும் விரிவைத் தருகிறது; ‘எல்லாம்’ என்பது தமிழில் இயல்பாகவும் முழுமையாகவும் அதை வெளிப்படுத்துகிறது.
- source_word: ὑμῶν
  choice: நீங்கள் செய்வது
  rationale: πάντα என்பதுடன் வரும் ὑμῶν சொல்லுக்கு ‘உங்களுடைய அனைத்தும்’ என்பது சொற்சொறான வடிவம். சூழலில் கொரிந்தியர்களிடமிருந்து வெளிப்படும் செயல்கள் குறிக்கப்படுவதால், மறைந்துள்ள செயற்பொருளை ‘நீங்கள் செய்வது’ என்று இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν ἀγάπῃ
  choice: அன்பில்
  rationale: ἐν என்பது முறை அல்லது செயல்படும் சூழலைக் குறிக்கலாம். ‘அன்பில்’ என்ற வடிவம் கிரேக்கக் கட்டமைப்பையும் அதன் பரப்பையும் காத்து, ‘அன்புடன்’ என்ற சாத்தியமான பொருளையும் உள்ளடக்குகிறது.
- source_word: γινέσθω
  choice: நடைபெறட்டும்
  rationale: γίνομαι என்பதன் மூன்றாம் நபர் ஒருமை நிகழ்காலக் கட்டளை வடிவம் இது. ‘நடைபெறட்டும்’ என்பது ‘ஆகட்டும்/நிகழட்டும்’ என்ற அறிவுறுத்தும் வலிமையை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத ποιέω (‘செய்’) என்ற வினையை நேரடியாகச் சேர்ப்பதையும் தவிர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான அறிவுறுத்தலாக வடிவமைக்கப்பட்டது. ‘அன்பில்’ என்பது மூலத்தின் ἐν அமைப்பைத் தக்கவைக்கிறது; ‘அன்புடன்’ என்று மட்டும் குறுக்கி விளக்கவில்லை.
