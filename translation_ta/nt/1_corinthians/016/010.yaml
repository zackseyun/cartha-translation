source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: ta
  text: தீமோத்தேயு வந்தால், அவர் உங்களிடையே அச்சமின்றி இருக்கும்படி பார்த்துக்கொள்ளுங்கள்.[a] ஏனெனில், என்னைப் போலவே அவரும் ஆண்டவருடைய பணியைச் செய்துவருகிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் உங்களுடன் அச்சமின்றி இருக்கும்படி.” கிரேக்கச் சொற்றொடர், அவர் உங்களிடையே அச்சமற்ற நிலையில் இருப்பதை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏனெனில், நானும் செய்வதுபோல் அவரும் ஆண்டவருடைய பணியைச் செய்கிறார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ ἔλθῃ Τιμόθεος
  choice: தீமோத்தேயு வந்தால்
  rationale: ἐάν உடன் வரும் இறந்தகாலத் தோற்றமுடைய துணைவினை வடிவம் எதிர்காலத்தில் நிகழக்கூடிய நிபந்தனையைக் குறிக்கிறது. δέ இங்கு மென்மையான உரைமாற்றத்தைத் தருகிறது; தமிழில் தனியே இணைப்புச்சொல் சேர்க்காமல் நிபந்தனை வாக்கியத்தின் ஓட்டத்தில் இயல்பாக வெளிப்படுகிறது.
- source_word: βλέπετε ἵνα
  choice: இருக்கும்படி பார்த்துக்கொள்ளுங்கள்
  rationale: βλέπετε என்பது வெறுமனே பார்ப்பதை அல்ல, ஒன்றை உறுதிசெய்யும் செயற்பாட்டுக் கவனத்தை வலியுறுத்தும் கட்டளை. ἵνα உடன் சேர்ந்த நோக்கம்/விளைவு தமிழில் ‘இருக்கும்படி’ என இயல்பாக வருகிறது.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: அவர் உங்களிடையே அச்சமின்றி இருக்கும்படி
  rationale: ἀφόβως என்பதன் ‘அச்சமின்றி’ என்ற பொருளையும், γένηται πρὸς ὑμᾶς என்பதன் அவர்களிடையே இருக்கும் நிலை/உறவையும் காக்கிறது. ‘பாதுகாப்பாக உணரும்படி’ என்று மொழிபெயர்த்து உள்ளுணர்வை மட்டும் குறிப்பதாகச் சுருக்கவில்லை.
- source_word: τὸ γὰρ ἔργον κυρίου ἐργάζεται
  choice: ஏனெனில், அவரும் ஆண்டவருடைய பணியைச் செய்துவருகிறார்
  rationale: γάρ காரணத்தை அறிமுகப்படுத்துகிறது. ஒரே வேர்ச்சொல்லை மீண்டும் பயன்படுத்தும் ἔργον–ἐργάζεται அமைப்பு தமிழில் சொற்சொல்லாகக் கடினமாக இருப்பதால், தொடர்ந்த செயலை உணர்த்தும் ‘பணியைச் செய்துவருகிறார்’ என வழங்கப்பட்டுள்ளது.
- source_word: κυρίου
  choice: ஆண்டவருடைய
  rationale: κύριος என்பதன் வழக்கமான, கண்ணியமான தமிழ் இணை. மூலத்தில் குறிப்பிடப்படாத பெயரைச் சேர்க்கவில்லை.
- source_word: ὡς κἀγώ
  choice: என்னைப் போலவே ... அவரும்
  rationale: κἀγώ என்பது καὶ ἐγώ, ‘நானும்’ என்பதாகும். தமிழின் இயல்பான சொல்வரிசைக்காக ஒப்பீடு முன்னே கொண்டு வரப்பட்டு, தீமோத்தேயுவும் பவுலைப் போல அதே பணியைச் செய்கிறார் என்ற கருத்து காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: κυρίου என்பதில் ‘ஆண்டவர்’ யாரைக் குறிக்கிறது?
  choice: மூலத்தைப் போலவே ‘ஆண்டவர்’ என்று மட்டும் வைக்கப்பட்டுள்ளது.
  alternative: ‘ஆண்டவராகிய இயேசு’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: பவுலின் பயன்பாட்டில் இயேசுவைக் குறிப்பது மிகவும் சாத்தியமானதாயினும், இவ்வசனத்தின் கிரேக்க உரை κύριος என்று மட்டுமே கூறுகிறது. ஆகவே மொழிபெயர்ப்பு அதற்கு மேல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அச்சமின்றி’ என்பது மூலத்தின் தெளிவைத் தக்கவைக்கிறது; ‘செய்துவருகிறார்’ நிகழ்ந்துவரும் பணியை இயல்பாக உணர்த்துகிறது. ‘அவர்’ என்ற மரியாதை ஒருமை தீமோத்தேயுவைக் குறிக்கிறது.
