  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες. ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: ta
  text: சகோதரர்கள் அனைவரும் உங்களுக்கு வாழ்த்துச் சொல்கிறார்கள்.[a] பரிசுத்த முத்தத்தோடு ஒருவரையொருவர் வாழ்த்துங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகள் அனைவரும் உங்களுக்கு வாழ்த்துச் சொல்கிறார்கள்.” இங்கே “சகோதரர்கள்” என்பது சக விசுவாசிகள் அனைவரையும் கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பரிசுத்த முத்தம்” என்பது விசுவாசிகளிடையே வழக்கிலிருந்த, பரிசுத்தத்தையும் பரஸ்பர உறவையும் வெளிப்படுத்திய ஒரு வாழ்த்து முறை.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: வாழ்த்துச் சொல்கிறார்கள்
  rationale: கடிதச் சூழலில் வாழ்த்தைத் தெரிவிப்பதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: சகோதரர்கள் அனைவரும்
  rationale: கிரேக்கச் சொற்றொடரின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் காக்கிறது; இது சக விசுவாசிகள் அனைவரையும் உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀσπάσασθε
  choice: வாழ்த்துங்கள்
  rationale: நேரடியான கட்டளையை இயல்பான தமிழில் தருகிறது; வசனத்தின் முதல் வினையுடன் சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: ἀλλήλους
  choice: ஒருவரையொருவர்
  rationale: பரஸ்பரச் செயலைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: பரிசுத்த முத்தத்தோடு
  rationale: வாழ்த்தின் முறை அல்லது வழிமுறையை வெளிப்படுத்தி, முத்தம் என்ற உடல் சார்ந்த வாழ்த்தையும் அதன் பரிசுத்தத் தன்மையையும் காக்கிறது.
theological_decisions:
- issue: சபைச் சூழலில் ἀδελφοί என்பதன் பொருள்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; சக விசுவாசிகள்
  rationale: மூலத்தின் இலக்கண ஆண்பால் பன்மையை முதன்மை உரையில் காக்கிறது. அதேவேளை, கலப்புப் பாலின விசுவாசிகள் குழுவை இது கூட்டாகக் குறிக்கக்கூடிய உண்மையான பொருள் வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. “வாழ்த்துச் சொல்கிறார்கள்” என்பது கடித வாழ்த்தைத் தெளிவாக்குகிறது; “பரிசுத்த முத்தம்” என்ற மரபுச் சொற்றொடர் மூலத்தின் பண்பாட்டு மற்றும் இறையியல் நிறையைத் தக்கவைக்கிறது.
