source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: ta
  text: சகோதரரான அப்பொல்லோவைப் பொறுத்தவரை,[a] அவர் சகோதரர்களோடு உங்களிடம் வரும்படி நான் அவரை மிகவும் வற்புறுத்திக் கேட்டுக்கொண்டேன். ஆனால், அவர் இப்போது வருவதற்கு எவ்வித விருப்பமும் இருக்கவில்லை;[b] அவருக்குச் சாதகமான வாய்ப்பு கிடைக்கும்போது வருவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் சகோதரரான அப்பொல்லோவைப் பொறுத்தவரை.” கிரேக்கத்தில் வெளிப்படையான உடைமைப் பதிலிப்பெயர் இல்லாமல் “சகோதரரான” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் இப்போது வரச் சிறிதும் விரும்பவில்லை.” கிரேக்கத்தில் இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக, “இப்போது வருவது அவருடைய விருப்பமாக இருக்கவில்லை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: சகோதரனாகிய அப்பொல்லோவைப் பொறுத்தவரை
  rationale: Περὶ δὲ புதிய பொருளை அறிமுகப்படுத்தும் கடித நடையை இயல்பான தமிழில் தருகிறது. τοῦ ἀδελφοῦ என்பதில் வெளிப்படையான உடைமைப் பெயர் இல்லாததால் ‘நம்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: πολλὰ παρεκάλεσα αὐτόν
  choice: நான் அவரை மிகவும் வற்புறுத்திக் கேட்டுக்கொண்டேன்
  rationale: πολλὰ வேண்டுகோளின் தீவிரத்தை வலுப்படுத்துகிறது; παρακαλέω இச்சூழலில் வற்புறுத்திக் கேட்டுக்கொள்ளுதல் என்ற பொருளைத் தருகிறது.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν
  choice: அவர் மற்ற சகோதரர்களோடு உங்களிடம் வரும்படி
  rationale: ἵνα உரைப்பது வேண்டுகோளின் உள்ளடக்கம். குறிப்பிட்ட ஆண் பயணத் தோழர்களைக் குறிக்கும் வாய்ப்பு உள்ளதால் ἀδελφῶν என்பதை ‘சகோதரர்கள்’ எனத் துல்லியமாக வைத்திருக்கிறது; ‘மற்ற’ என்பது அப்பொல்லோவும் சகோதரன் என முன்பு அழைக்கப்பட்டதுடன் இயல்பாக இணைக்கிறது.
- source_word: καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ
  choice: ஆனால் இப்போது வருவது அவருடைய விருப்பமாகவே இருக்கவில்லை
  rationale: πάντως உடன் வரும் மறுப்பின் வலிமையை ‘-வே ... இல்லை’ வெளிப்படுத்துகிறது. θέλημα என்ற பெயர்ச்சொல்லையும் அப்பொல்லோவைக் குறிக்கும் இயல்பான உடைமையையும் பாதுகாக்கிறது.
- source_word: ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ
  choice: வாய்ப்புக் கிடைக்கும்போது அவர் வருவார்
  rationale: εὐκαιρέω ஏற்ற அல்லது சாதகமான வாய்ப்பு கிடைப்பதைக் குறிக்கிறது; வெறும் தனிப்பட்ட வசதி என்ற எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: οὐκ ἦν θέλημα என்பதன் எழுவாயும் பொருளும்
  choice: இப்போது வருவது அப்பொல்லோவின் விருப்பமாக இருக்கவில்லை
  alternative: இப்போது அவர் வருவது கடவுளுடைய விருப்பமாக இருக்கவில்லை
  rationale: மிக அருகிலுள்ள இயல்பான குறிப்பு அப்பொல்லோதான். கடவுளுடைய சித்தம் என்று மாறுவதற்கான அறிகுறி உடனடி சூழலில் இல்லை; அப்படித் தருவது மூலத்தில் சொல்லப்படாத இறையியல் கருத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான கடிதநடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பொல்லோ’ என்ற பெயர் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் நீளமான வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், எதிர்மறைத் தொடர்பும் கருத்தோட்டமும் பாதுகாக்கப்பட்டுள்ளன.
