lexical_decisions:
- source_word: Ὁ ἀσπασμός
  choice: இந்த வாழ்த்து
  rationale: உறுதியான சுட்டுடன் வரும் சொற்றொடரைச் சூழலுக்கு இயல்பாகவும், கடிதத்தின் நிறைவுப் பகுதியில் பவுல் இப்போது எழுதும் வாழ்த்தைக் குறிப்பதாகவும் மொழிபெயர்க்கிறது.
- source_word: τῇ ἐμῇ χειρί
  choice: என் சொந்தக் கையால் எழுதுகிறேன்
  rationale: சொல்லளவில் ‘என் கையால்’ என்பதைக் குறித்தாலும், தமிழில் செயப்பாடு இல்லாமல் அமைந்தால் இயல்பற்றதாகும்; கடிதச் சூழலில் கைப்பட எழுதுவதே பொருள் என்பதால் ‘எழுதுகிறேன்’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: Παύλου
  choice: பவுலாகிய நான்
  rationale: மூலத்தில் ‘பவுலின்’ என்ற உரிய பெயர் தொடர்பு வடிவில் இருந்து, இந்த வாழ்த்து பவுலின் சொந்தக் கையால் எழுதப்பட்டது என்பதை அடையாளப்படுத்துகிறது; தமிழில் நேரடிப் பேச்சுச் சூழலுக்கு இயல்பாக முதல் நபரில் வழங்கப்படுகிறது.
