source:
  edition: SBLGNT
  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: ta
  text: ஸ்தேவானா, பொர்த்துனாத்து, அகாயிக்கு ஆகியோரின் வருகையால் நான் மகிழ்கிறேன். ஏனெனில், உங்களிடமிருந்து குறைவாயிருந்ததை[a] இவர்கள் ஈடு செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் இங்கே இல்லாதிருந்த குறையை.” கொரிந்தியர்கள் பவுலுடன் நேரில் இருக்க முடியாத குறையை இந்த மூவரின் வருகை ஈடு செய்ததாக அவர் குறிப்பிட்டிருக்கலாம்; இது அவர்களிடம் ஒழுக்கக் குறை இருந்ததாக அவசியம் பொருள்படாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: நான் மகிழ்கிறேன்
  rationale: நிகழ்காலத் தன்மை கொண்ட பவுலின் நேரடியான தனிப்பட்ட மகிழ்ச்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான எதிர்மறையை அல்ல, மென்மையான உரைத் தொடர்ச்சியையே குறிக்கிறது; தனி இணைப்புச்சொல் இல்லாமலேயே தமிழ் ஓட்டத்தில் அந்தத் தொடர்ச்சி இயல்பாக அமைகிறது.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: வந்திருப்பதைக் குறித்து
  rationale: παρουσία இங்கு இறுதிக்காலத் தொழில்நுட்பப் பொருளில் அல்லாமல், மூவரின் வருகையையும் உடனிருப்பையும் குறிக்கிறது. ‘வந்திருப்பது’ இவ்விரு நுணுக்கங்களையும் இயல்பாக இணைக்கிறது.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: ஸ்தெவானா, பொர்த்துனாத்து, அகாய்க்கு ஆகியோர்
  rationale: ஆள்பெயர்கள் கிரேக்க உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டு, மூவரும் எழுவாயாகத் தெளிவுபடுத்தப்பட்டுள்ளனர்.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: பவுல் மகிழ்வதற்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: உங்கள் சார்பில் குறைவாயிருந்ததை
  rationale: ὑστέρημα என்பதன் ‘குறைவு/குறைவாயிருப்பது’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; அது கொரிந்தியர்களின் உடல்ரீதியான இல்லாமையையா அல்லது அவர்களிடமிருந்து கிடைக்காமல் இருந்த வேறொன்றையா குறிக்கிறது என்பதை மூலத்தைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: முன்னர் பெயரிடப்பட்ட மூவரைச் சுட்டும் வலியுறுத்தலுள்ள அண்மைச் சுட்டுப்பெயரை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ἀνεπλήρωσαν
  choice: நிறைவு செய்தார்கள்
  rationale: குறைவாயிருந்ததை நிரப்புதல் அல்லது பூர்த்திசெய்தல் என்ற வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: τὸ ὑμέτερον ὑστέρημα என்பதன் குறிப்பான பொருள்
  choice: முதன்மை உரையில் ‘உங்கள் சார்பில் குறைவாயிருந்ததை’ என்று திறந்த நிலையில் வைக்கப்பட்டது.
  alternative: ‘நீங்கள் இங்கே இல்லாத குறையை’ என்று அவர்களது உடல்ரீதியான இல்லாமையை மட்டும் குறிப்பதாக மொழிபெயர்த்தல்.
  rationale: சூழலில் கொரிந்தியர்களின் தனிப்பட்ட இல்லாமையே பெரும்பாலும் கருத்தாக இருக்கலாம்; எனினும் கிரேக்கச் சொற்றொடர் பொதுவாக ‘உங்கள் சார்பில் குறைவாயிருந்தது’ எனக் கூறுவதால், முதன்மை உரை அந்த உண்மையான பொருள் நெகிழ்வைப் பாதுகாக்கிறது; சாத்தியமான சூழல் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘குறைவாயிருந்ததை… நிறைவு செய்தார்கள்’ என்ற இணைப்பு கிரேக்கச் சொல்லாட்சியின் உருவகத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் மிகச் சாத்தியமான சூழல்பொருளை விளக்குகிறது.
