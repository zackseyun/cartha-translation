  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: ta
  text: விழிப்புடன் இருங்கள்; விசுவாசத்தில் உறுதியாக நில்லுங்கள்; துணிவுடன் நடந்துகொள்ளுங்கள்[a]; வலிமை பெறுங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லடிப்படையில்: “ஆண்களைப் போல் நடந்துகொள்ளுங்கள்”; இங்கு வழக்குப் பொருள் “துணிவாயிருங்கள்.”'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “வலிமைப்படுத்தப்படுங்கள்.” கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவில் உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: விழிப்புடன் இருங்கள்
  rationale: γρηγορέω என்பதன் நிகழ்காலக் கட்டளை தொடர்ந்து விழிப்புடனும் எச்சரிக்கையுடனும் இருப்பதை வலியுறுத்துகிறது. நவீனத் தமிழில் இச்சொற்றொடர் இயல்பாக அந்தக் கட்டளை வலிமையைத் தருகிறது.
- source_word: στήκετε
  choice: உறுதியாக நில்லுங்கள்
  rationale: στήκω இங்கு உடலளவில் நிற்பதைவிட அசையாத உறுதிப்பாட்டைக் குறிக்கிறது.
- source_word: ἐν τῇ πίστει
  choice: விசுவாசத்தில்
  rationale: கட்டுரைச் சொல்லுடன் வரும் இத்தொடர் கிறிஸ்தவ விசுவாசத்தைச் சார்ந்த நிலைப்பாட்டைச் சுட்டலாம். தமிழில் ‘விசுவாசத்தில்’ என்பது அதன் பரப்பையும் தனிப்பட்ட நம்பிக்கையின் சாயலையும் தேவையின்றி முற்றாகப் பிரிக்காமல் வைத்திருக்கிறது.
- source_word: ἀνδρίζεσθε
  choice: துணிவுடன் நடந்துகொள்ளுங்கள்
  rationale: வினைச்சொல் சொல்லடிப்படையில் ஆண் சார்ந்த உருவகத்தைக் கொண்டிருந்தாலும், இச்சூழலில் அதன் வழக்குப் பொருள் துணிவுடன் செயல்படுதல். இயல்பான நவீனத் தமிழுக்காக வழக்குப் பொருள் முதன்மை உரையில் தரப்பட்டு, சொல்லடிப்படையான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κραταιοῦσθε
  choice: வலிமை பெறுங்கள்
  rationale: நிகழ்காலப் புறப்பாட்டு வடிவத்தின் வலிமைப்படுத்தப்படுதல் அல்லது வலிமை அடைதல் என்ற நுணுக்கத்தை, செயப்படுபொருள் தன்மையை முற்றாக அழிக்காமல் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசத்தில்
  alternative: விசுவாச நெறியில்
  rationale: τῇ πίστει என்ற கட்டுரைச் சொல் கிறிஸ்தவ விசுவாசத்தின் உள்ளடக்கம் அல்லது பரப்பைச் சுட்டுவதை ஆதரிக்கிறது. எனினும், தமிழில் ‘விசுவாசத்தில்’ என்பது பவுலின் சொல்லில் இருக்கக்கூடிய தனிப்பட்ட நம்பிக்கை மற்றும் பகிரப்பட்ட விசுவாசம் ஆகிய நுணுக்கங்களைத் தேவையின்றி பிரிக்காமல் பாதுகாக்கிறது.
- issue: ἀνδρίζεσθε என்பதிலுள்ள பாலின உருவகம்
  choice: துணிவுடன் நடந்துகொள்ளுங்கள்
  alternative: ஆண்களைப் போல் நடந்துகொள்ளுங்கள்
  rationale: கிரேக்கச் சொல்லின் உருவாக்கம் ஆண் சார்ந்தது; ஆனால் அதன் நடைமுறை அழைப்பு துணிவுக்கானது. சபை முழுவதற்கும் விடுக்கப்படும் அறிவுரையை நவீனத் தமிழில் தவறாகக் குறுக்காமல் கூறி, மூல உருவகத்தை அடிக்குறிப்பில் வெளிப்படையாகப் பதிவு செய்கிறது.
- issue: κραταιοῦσθε என்பதன் செயப்படுபொருள் வடிவம்
  choice: வலிமை பெறுங்கள்
  alternative: வலிமைப்படுத்தப்படுங்கள்
  rationale: ‘வலிமை பெறுங்கள்’ என்பது இயல்பான தமிழாக இருந்து, வலிமை வெறும் சுயமுயற்சியால் உருவாக்கப்படுவதாகத் தீர்மானிக்காமல் செயப்படுபொருள் நுணுக்கத்தையும் திறந்த நிலையில் வைத்திருக்கிறது.
translation_notes:
  register: குறுகிய தொடர் கட்டளைகளின் வேகத்தையும் சமநிலையையும் காக்க அரைப்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன. நடை நவீனமானதும் மரியாதைமிக்கதும் சபையில் பொதுவாசிப்புக்கு ஏற்றதுமாக உள்ளது.
