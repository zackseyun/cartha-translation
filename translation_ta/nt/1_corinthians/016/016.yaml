translation:
  language: ta
  text: நீங்களும் இப்படிப்பட்டவர்களுக்குக் கீழ்ப்படிய வேண்டும்[a]; உடன் உழைத்துக் கடுமையாக உழைக்கிற ஒவ்வொருவருக்கும் கீழ்ப்படிய வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நீங்களும் இப்படிப்பட்டவர்களுக்கு உட்பட்டிருங்கள்.”'
    reason: lexical_alternative
  - marker: b
    text: “உடன் உழைத்து” என்பதை “ஒத்துழைத்து” அல்லது “சக ஊழியராக இருந்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: வேண்டும்
  rationale: முந்தைய வசனத்தில் தொடங்கிய பவுலின் வேண்டுகோளின் உள்ளடக்கத்தைத் தொடர்கிறது. தமிழில் இயல்பாக அந்த வேண்டுகோளின் நோக்கத்தையும் வலியுறுத்தலையும் ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: கொரிந்தியர்களும் அதே முறையில் நடந்துகொள்ள வேண்டும் என்ற உள்ளடக்கத்தையும் அழுத்தத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὑποτάσσησθε
  choice: கீழ்ப்படிந்து நடக்க வேண்டும்
  rationale: தாங்களாகவே தங்களை ஒழுங்குக்கும் அங்கீகரிக்கப்பட்ட பணியாளர்களின் வழிநடத்துதலுக்கும் உட்படுத்தும் கருத்தை இயல்பான தமிழில் தருகிறது; எல்லையற்ற அடிமைத்தனத்தையோ முழுமையான அதிகாரத்தையோ உட்புகுத்துவதில்லை.
- source_word: τοῖς τοιούτοις
  choice: இப்படிப்பட்டவர்களுக்கு
  rationale: முந்தைய சூழலில் கூறப்பட்ட ஸ்தெவானாவின் குடும்பத்தாரைப் போன்ற சேவையில் தங்களை அர்ப்பணித்த ஒரு வகை மக்களைக் குறிக்கிறது; பாலினத்தைத் தேவையின்றிக் குறிப்பதில்லை.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: உடன் பணியாற்றுகிற ஒவ்வொருவருக்கும்
  rationale: சேவையில் மற்றவர்களோடு சேர்ந்து செயல்படுகிற பங்கேற்புச் செயலைப் பாதுகாக்கிறது. கிரேக்கத்தில் உடன் பணியாற்றுவது யாருடன் என்பது வெளிப்படையாகக் கூறப்படாததால் தமிழிலும் அது நிர்ணயிக்கப்படவில்லை.
- source_word: καὶ κοπιῶντι
  choice: கடுமையாக உழைக்கிற
  rationale: κοπιάω குறிக்கும் சிரமமிக்க, அயராத உழைப்பை சாதாரண ‘வேலை செய்கிற’ என்பதைக் காட்டிலும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: கட்டளையிடப்படும் கீழ்ப்படிதலின் தன்மை
  choice: இங்கு முன்பு குறிப்பிடப்பட்டவர்களைப் போன்ற அங்கீகரிக்கப்பட்ட கிறிஸ்தவப் பணியாளர்களிடம் மனமுவந்து பணிந்து ஒத்துழைக்குமாறு அழைப்பு விடுக்கப்படுகிறது.
  alternative: அனைத்துச் சூழல்களிலும் பொருந்தும் எல்லையற்ற படிநிலை அதிகாரத்திற்குக் கீழ்ப்படியும் கட்டளை.
  rationale: உடனடிச் சூழல் ஸ்தெவானாவின் குடும்பத்தாரையும் அவர்களோடு உழைப்பவர்களையும் பற்றியது. ஆகவே வசனத்தின் வலிமையைப் பாதுகாத்தபடியே, அது கூறாத முழுமையான அல்லது நிறுவனமயமான அதிகாரக் கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: συνεργοῦντι என்பதன் தொடர்பு
  choice: மற்றவர்களோடு உடன் பணியாற்றுகிறவர் என்று திறந்த நிலையில் வைக்கப்பட்டது.
  alternative: குறிப்பாக பவுலின் சக பணியாளர் அல்லது ஸ்தெவானாவோடு பணியாற்றுகிறவர் என்று நிர்ணயித்தல்.
  rationale: கிரேக்கப் பங்கேற்பு வினைச்சொல் ஒத்துழைப்பைக் குறித்தாலும், யாருடன் பணியாற்றுகிறார் என்பதை இவ்வசனம் வெளிப்படையாகக் குறிப்பிடவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, சபை வாசிப்புக்கு ஏற்ற நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சியாக இருப்பதால் ἵνα தனியான இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படாமல், ‘வேண்டும்’ என்ற வேண்டுகோள் வடிவில் வெளிப்படுத்தப்பட்டுள்ளது. இரண்டாவது கூறில் தமிழின் தெளிவுக்காக ‘அவ்வாறே செய்ய வேண்டும்’ சேர்க்கப்பட்டுள்ளது; இது கிரேக்கத்தில் பகிர்ந்து நிற்கும் ὑποτάσσησθε என்ற வினையின் பொருளையே மீட்டுரைக்கிறது.
