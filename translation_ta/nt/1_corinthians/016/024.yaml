  source_fidelity: மூலத்தின் வினையற்ற நிறைவு-வாழ்த்து தொனியை ‘இருப்பதாக’ துல்லியமாக வெளிப்படுத்துகிறது. ‘உங்கள் அனைவரோடும்’ என்பது πάντων ὑμῶν என்பதன் முழுமையான உள்ளடக்கத்தையும், ‘மேசியா இயேசுவுக்குள்’ என்பது ἐν Χριστῷ Ἰησοῦ என்பதையும் பாதுகாக்கிறது.
  naturalness: நவீனத் தரத் தமிழில் கண்ணியமான கடித நிறைவாக இயல்பாக உள்ளது. சொல் வரிசை தெளிவாகவும் வாழ்த்துத் தொனிக்கு ஏற்றதாகவும் உள்ளது.
  terminology: ἀγάπηக்கு ‘அன்பு’, Χριστόςக்கு பட்டப்பெயர் பொருளைத் தக்கவைக்கும் ‘மேசியா’, மற்றும் Ἰησοῦக்கு ‘இயேசு’ ஆகியவை ஒருமையாகவும் கொடுக்கப்பட்ட மொழிபெயர்ப்புக் கொள்கையுடனும் பொருந்துகின்றன. மாற்று ‘கிறிஸ்து இயேசு’ குறித்த அடிக்குறிப்பு சரியாக உள்ளது.
