  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ ἀγάπη μου μετὰ πάντων ὑμῶν ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: ta
  text: மேசியா இயேசுவுக்குள் உங்கள் அனைவரோடும் என் அன்பு இருப்பதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கிறிஸ்து இயேசுவுக்குள்.” கிரேக்கப் பட்டப்பெயரான Χριστός என்பதை அதன் பொருளை வெளிப்படுத்தும் “மேசியா” என்றும், பாரம்பரியமாக “கிறிஸ்து” என்றும் வழங்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: அன்பு
  rationale: தன்னலமற்ற, ஆழமான அன்பைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: μου
  choice: என்
  rationale: பவுலின் தனிப்பட்ட அன்பைத் தெரிவிக்கும் எளிய உடைமைப்பெயர்.
- source_word: μετὰ
  choice: இருப்பதாக
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லை; கடித நிறைவு வாழ்த்தின் விருப்பத் தொனியைத் தமிழில் இயல்பாகக் காட்ட இந்த வினைச்சொல் சேர்க்கப்படுகிறது.
- source_word: πάντων ὑμῶν
  choice: உங்கள் அனைவரோடும்
  rationale: சபையிலுள்ள ஒருவரையும் விலக்காமல் எல்லாரையும் உள்ளடக்கும் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐν
  choice: உள்ளே / உள்பட்ட உறவில்
  rationale: பவுலின் ‘கிறிஸ்துவுக்குள்’ என்ற உறவு மற்றும் ஆளுகைச் சூழலை மிகையாக விளக்காமல் ‘-க்குள்’ என்ற வடிவில் தக்கவைக்கிறது.
- source_word: Χριστῷ Ἰησοῦ
  choice: மேசியா இயேசு
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளை வெளிப்படையாகக் காட்ட ‘மேசியா’ என்றும், Ἰησοῦ என்பதை ‘இயேசு’ என்றும் வழங்குகிறது.
theological_decisions:
- issue: Χριστῷ Ἰησοῦ என்ற சொற்றொடரில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு Χριστός பட்டப்பெயரின் பொருளைத் தாங்குவதால் ‘மேசியா’ என்று வழங்கப்பட்டுள்ளது; பாரம்பரியமான ‘கிறிஸ்து’ என்பதும் சாத்தியமான மாற்று.
- issue: வினைச்சொல் இல்லாத நிறைவு வாழ்த்து
  choice: என் அன்பு இருப்பதாக
  alternative: என் அன்பு இருக்கிறது
  rationale: மூலத்தில் வெளிப்படையான வினைச்சொல் இல்லை. கடிதத்தின் இறுதி வாழ்த்து அல்லது விருப்பத் தொனிக்கு ‘இருப்பதாக’ பொருத்தமானது; ‘இருக்கிறது’ எனத் தீர்மானமாக்குவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கடிதத்தின் கண்ணியமான நிறைவு வாழ்த்துத் தொனி பேணப்பட்டுள்ளது. ‘உங்கள் அனைவரோடும்’ என்பது முழுச் சபையையும் உள்ளடக்கும் பன்மையைத் தெளிவாக்குகிறது.
