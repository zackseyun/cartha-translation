source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: ta
  text: ஏனெனில், இப்போது வழியாகச் செல்லும்போது உங்களைப் பார்க்க நான் விரும்பவில்லை[a]. ஆண்டவர் அனுமதித்தால், உங்களோடு சிறிது காலம் தங்கியிருக்க நம்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடந்து செல்லும் வழியில்” அல்லது “போகும் வழியில்.”
    reason: ἐν παρόδῳ என்பது பயணத்தின் இடையில் நிகழும் தற்காலிகமான, வழியிலான சந்திப்பைக் குறிக்கிறது; இவை அதன் இயல்பான சொற்பொருள் மாற்றுகள்.
lexical_decisions:
- source_word: οὐ θέλω
  choice: நான் விரும்பவில்லை
  rationale: பவுலின் தனிப்பட்ட விருப்பத்தையும் நோக்கத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; வலுவான மறுப்பாக மாற்றவில்லை.
- source_word: ἄρτι
  choice: இப்போது
  rationale: தற்போதைய நேரத்தையோ சூழலையோ குறிக்கும் சொல்லின் சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: ἐν παρόδῳ
  choice: வழிப்போக்கில்
  rationale: வேறொரு இடத்திற்குச் செல்லும் வழியில் செய்யப்படும் குறுகிய சந்திப்பைக் குறிக்கிறது. சொற்றொடரின் சுருக்கத்தையும் தற்காலிகத் தன்மையையும் காக்கிறது; மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἰδεῖν
  choice: பார்க்க
  rationale: கிரேக்க வினையின் நேரடிப் பொருளைக் காக்கிறது; இச்சூழலில் சந்திக்க அல்லது வருகை தரும் உட்பொருளும் தமிழில் இயல்பாகப் புரிகிறது.
- source_word: ἐλπίζω
  choice: நம்புகிறேன்
  rationale: உறுதியான முடிவாக அல்லாமல் எதிர்பார்ப்புடன் கூடிய நம்பிக்கையை வெளிப்படுத்துகிறது.
- source_word: χρόνον τινά
  choice: சிறிது காலம்
  rationale: குறிப்பிடப்படாத, ஆனால் ஓரளவு நீடிக்கும் காலத்தை இயல்பாகக் குறிக்கிறது.
- source_word: ἐπιμεῖναι
  choice: தங்கியிருக்கலாம்
  rationale: அவர்களோடு தொடர்ந்து இருப்பதைக் குறிக்கிறது. ἐλπίζω என்பதுடன் இணைந்து தமிழில் இயல்பான எதிர்பார்ப்பு வடிவத்தை உருவாக்குகிறது.
- source_word: πρὸς ὑμᾶς
  choice: உங்களோடு
  rationale: மக்களுடன் தங்குதல் என்ற சூழலில் உடனிருப்பையும் உறவுச் சார்ந்த இருப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: ஆண்டவர் அனுமதித்தால்
  rationale: ஆண்டவருடைய சித்தத்துக்கும் அதிகாரத்துக்கும் உட்பட்ட நிபந்தனையைத் தெளிவாகவும் மரியாதையான நடையிலும் காக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: தமிழ் வேதாகம நடையில் தெய்வீக κύριος என்பதற்கான இயல்பான மரியாதைச் சொல்; இங்கு இயேசுவா பிதாவாகிய தேவனா என்பதை மொழிபெயர்ப்பு கூடுதலாகத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பதன் குறிப்பு
  choice: ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்த்து, குறிப்பிட்ட நபரைச் சேர்க்காமல் விடுதல்
  alternative: ‘ஆண்டவர் இயேசு’ அல்லது ‘தேவன்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: கிரேக்க மூலத்தில் κύριος மட்டுமே உள்ளது. ஆகவே இயேசுவையோ பிதாவாகிய தேவனையோ மொழிபெயர்ப்பில் சேர்த்து ambiguity-ஐத் தீர்ப்பதற்குப் பதிலாக மூலத்தின் திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதையான வேதாகம நடை. கிரேக்க வாக்கியத்தின் காரணத் தொடர்பும் நிபந்தனையும் காக்கப்பட்டுள்ளன; தமிழின் இயல்புக்காக இரு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
