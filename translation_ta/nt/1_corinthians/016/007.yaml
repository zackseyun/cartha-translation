revisions:
- from: ஏனெனில், இப்போது வழிப்போக்கில் உங்களைப் பார்க்க நான் விரும்பவில்லை[a]. ஆண்டவர் அனுமதித்தால், உங்களோடு சிறிது காலம் தங்கியிருக்கலாம் என்று நம்புகிறேன்.
  to: ஏனெனில், இப்போது வழியாகச் செல்லும்போது உங்களைப் பார்க்க நான் விரும்பவில்லை[a]. ஆண்டவர் அனுமதித்தால், உங்களோடு சிறிது காலம் தங்கியிருக்க நம்புகிறேன்.
  rationale: “வழியாகச் செல்லும்போது” ἐν παρόδῳ-வின் வழியிலான, தற்காலிகமான வருகை என்ற பொருளை நவீன தமிழில் தெளிவாகக் கொடுக்கிறது. “தங்கியிருக்க நம்புகிறேன்” கிரேக்கத்தின் 'I hope to remain' என்ற நேரடியான எதிர்பார்ப்பை, தேவையற்ற சாத்தியக் குறிப்பு இல்லாமல் காக்கிறது. ஆண்டவரின் குறிப்பு மூலத்தைப் போலவே திறந்ததாக விடப்பட்டுள்ளது.
