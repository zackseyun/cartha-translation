    text: அல்லது, “மக்கெதோனியா வழியாகச் செல்லும்போது.” ὅταν என்பதுடன் வரும் கிரேக்க ஆரிஸ்ட் துணைவினை, பவுலின் வருகைக்கு முன் அந்த வழிப்பயணம் நிறைவடைவதைக் குறிக்கலாம்; எளிமையாக ‘செல்லும்போது’ என்றும் மொழிபெயர்க்கலாம்.
