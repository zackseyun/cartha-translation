translation:
  language: ta
  text: ஆனால், நான் மக்கெதோனியா வழியாகக் கடந்து சென்ற பின்பு[a] உங்களிடம் வருவேன்; ஏனெனில், நான் மக்கெதோனியா வழியாகச் செல்லவிருக்கிறேன்.
  philosophy: optimal-equivalence
