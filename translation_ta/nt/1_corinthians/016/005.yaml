lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: வருவேன்
  rationale: எதிர்கால நோக்கத்தைத் தெரிவிக்கும் வினை; πρὸς ὑμᾶς என்பதால், கொரிந்தியர்களை நோக்கிய வருகையை இயல்பாகக் குறிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய பயணத் திட்டத்திலிருந்து வரும் மென்மையான மாற்றம் அல்லது வேறுபாட்டைக் குறிக்கிறது; இங்கு கடுமையான எதிர்மறைப் பொருள் இல்லை.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம்
  rationale: மனிதர்களை நோக்கிய இயக்கத்தைக் குறிக்கும் πρός என்பதற்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ὅταν ... διέλθω
  choice: கடந்து சென்ற பின்பு
  rationale: எதிர்காலத்தில் பவுல் கொரிந்தியரிடம் வருவதற்கு முன் மக்கெதோனியா வழிப் பயணம் நிறைவடையும் வரிசையைத் தெளிவாகக் காக்கிறது.
- source_word: Μακεδονίαν
  choice: மக்கெதோனியா
  rationale: ரோம மாகாணப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: பவுல் எப்போது வருவார் என்பதற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க இணைப்பை வெளிப்படுத்துகிறது.
- source_word: διέρχομαι
  choice: வழியாகச் செல்லவிருக்கிறேன்
  rationale: நிகழ்கால வடிவம் இச்சூழலில் தற்போது நடைபெறும் பயணத்தைவிட உறுதிசெய்யப்பட்ட எதிர்காலப் பயணத் திட்டத்தைக் குறிக்கிறது; தமிழ் வாசகருக்கு அந்த நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
