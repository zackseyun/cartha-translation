revisions:
- from: வாரந்தோறும் முதல் நாளில்[a], உங்களில் ஒவ்வொருவரும் தாம் செழிப்படைந்ததற்கு ஏற்றபடி சிறிது எடுத்து, தம்மிடத்தில் தனியாகச் சேர்த்து வைக்கட்டும்[b]. அப்போது, நான் வரும்போது நன்கொடைகள் திரட்ட வேண்டியிருக்காது.
  to: வாரந்தோறும் முதல் நாளில்[a], உங்களில் ஒவ்வொருவரும் தமக்குக் கிடைக்கும் செழிப்புக்கு ஏற்ப ஒதுக்கி, தம்மிடத்தில் சேமித்து வைக்கட்டும்[b][c]; நான் வரும்போது சேகரிப்புகள் நடக்காதபடிக்கு.
  rationale: The revision removes the unwarranted “small” amount, expresses the instruction to set aside and accumulate funds in idiomatic modern Tamil, and renders the final clause as collections not taking place upon Paul's arrival. Footnote c has been added to preserve the source clause's idiomatic proportional sense, while footnote b continues to preserve the ambiguity of παρ’ ἑαυτῷ.
