translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தம்மிடத்தில்’ என்ற வடிவம் மூலத்தின் இட/தனிப்பட்ட சேமிப்பு குறித்த தெளிவின்மையைத் தக்கவைக்கிறது; ‘நன்கொடைகள்’ என்பது இச்சூழலின் பணச் சேகரிப்பைக் குறிக்கிறது.
