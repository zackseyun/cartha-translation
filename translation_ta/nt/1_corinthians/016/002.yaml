base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: ta
  text: வாரந்தோறும் முதல் நாளில்[a], உங்களில் ஒவ்வொருவரும் தமக்குக் கிடைக்கும் செழிப்புக்கு ஏற்ப ஒதுக்கி, தம்மிடத்தில் சேமித்து வைக்கட்டும்[b][c]; நான் வரும்போது சேகரிப்புகள் நடக்காதபடிக்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாரத்தின் முதல் நாளில்.” இங்குள்ள கிரேக்கச் சொற்றொடர் வாரந்தோறும் தொடர்ந்து செய்யப்படும் நடைமுறையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, “தன்னிடத்தில்” அல்லது “தன்னுடன்.” ஒவ்வொருவரும் தொகையைத் தனிப்பட்ட முறையில், ஒருவேளை வீட்டிலேயே, ஒதுக்கிச் சேமிக்க வேண்டும் என்பது இதன் பொருளாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எவ்வாறு செழிப்படைந்தாரோ அதற்கு ஏற்ப.” ஒவ்வொருவரும் தமக்குக் கிடைத்த செழிப்பின் அளவுக்கு ஏற்ப ஒதுக்க வேண்டும் என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: வாரந்தோறும் முதல் நாளில்
  rationale: κατά உடனான இச்சொற்றொடர் பகிர்நிலைப் பொருளில் தொடர்ந்து நிகழும் வாராந்திர நடைமுறையைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἕκαστος ὑμῶν
  choice: உங்களில் ஒவ்வொருவரும்
  rationale: அறிவுரை கேட்போர் அனைவருக்கும் தனித்தனியாகப் பொருந்துவதை நேரடியாகக் காட்டுகிறது.
- source_word: παρ’ ἑαυτῷ
  choice: தம்மிடத்தில் தனியாக
  rationale: சொற்றொடரின் ‘தன்னிடத்தில்/தன்னுடன்’ என்ற பொருளைப் பாதுகாக்கிறது; இது வீட்டிலேயே வைத்தல் அல்லது தனிப்பட்ட முறையில் ஒதுக்கிவைத்தல் எனப் புரிந்துகொள்ளப்படக்கூடியதால் இடத்தை மிகத் துல்லியமாக நிர்ணயிக்கவில்லை.
- source_word: τιθέτω θησαυρίζων
  choice: சிறிது எடுத்து ... சேர்த்து வைக்கட்டும்
  rationale: நிகழ்காலக் கட்டளையின் தொடர்ச்சியையும், காலப்போக்கில் சேமித்துச் சேர்க்கும் பங்கேற்புவினையின் நுணுக்கத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: தாம் செழிப்படைந்ததற்கு ஏற்றபடி
  rationale: ஒருவருக்குக் கிடைத்த செழிப்பின் அளவுக்கு ஏற்ப ஒதுக்க வேண்டும் என்ற நிபந்தனை சார்ந்த, அளவு நிர்ணயிக்கப்படாத பொருளை இயல்பாகத் தருகிறது.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: அப்போது, நான் வரும்போது நன்கொடைகள் திரட்ட வேண்டியிருக்காது
  rationale: வாரந்தோறும் ஒதுக்கிவைப்பதன் நோக்கம் பவுல் வந்தபின் கடைசி நேரத்தில் நிதி திரட்டுவதைத் தவிர்ப்பதே என்பதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
