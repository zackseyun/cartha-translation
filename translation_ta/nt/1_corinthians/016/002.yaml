review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the recurring first-day practice, individual participation, proportionality to prosperity, and the purpose of avoiding collections at Paul's arrival. However, “சிறிது எடுத்து” introduces the unsupported idea that the amount must be small. The source calls for setting aside an unspecified amount in proportion to one's prosperity. “நன்கொடைகள் திரட்ட” can also suggest soliciting donations rather than the occurrence of collections.
  naturalness: The Tamil is generally clear and suitably modern, but “அப்போது, நான் வரும்போது” is awkwardly redundant. The revised wording is smoother while retaining the purpose relationship.
  terminology: “சேகரிப்புகள்” accurately represents λογεῖαι as collections. “தமக்குக் கிடைக்கும் செழிப்புக்கு ஏற்ப” naturally conveys the idiomatic, potentially ambiguous ὅ τι ἐὰν εὐοδῶται without specifying a source or exact amount of prosperity.
  issues:
  - severity: medium
    issue: “சிறிது எடுத்து” adds a limitation absent from the Greek.
    rationale: ὅ τι ἐὰν εὐοδῶται indicates whatever is in keeping with one's prosperity, not necessarily a small amount. The addition can distort the instruction's scope.
  - severity: low
    issue: The proportional-prosperity clause lacks a corresponding explanatory footnote anchor.
    rationale: Because εὐοδῶται is idiomatic and may be rendered either more literally or as proportional giving, an anchored note preserves the lexical nuance reflected in the audit trail.
  - severity: low
    issue: “நன்கொடைகள் திரட்ட வேண்டியிருக்காது” is less exact for λογεῖαι γίνωνται.
    rationale: The Greek refers to collections taking place, rather than necessarily to an anticipated need to solicit donations. “சேகரிப்புகள் நடக்காதபடிக்கு” is more direct.
  revised_text: வாரந்தோறும் முதல் நாளில்[a], உங்களில் ஒவ்வொருவரும் தமக்குக் கிடைக்கும் செழிப்புக்கு ஏற்ப ஒதுக்கி, தம்மிடத்தில் சேமித்து வைக்கட்டும்[b][c]; நான் வரும்போது சேகரிப்புகள் நடக்காதபடிக்கு.
