language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἐπιμενῶ δὲ ἐν Ἐφέσῳ ἕως τῆς πεντηκοστῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/008.yaml
  text: But I will stay in Ephesus until Pentecost[a].
translation:
  language: ta
  text: ஆனால், பெந்தெகொஸ்தே பண்டிகை வரை எபேசுவில் தங்கியிருப்பேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வாரங்களின் பண்டிகை வரை.’
    reason: πεντηκοστή என்பது யூத நாட்காட்டியின் ‘வாரங்களின் பண்டிகை’ என்பதற்கான கிரேக்கப் பெயர்; இந்தப் பின்னணிப் பெயரை மாற்றாகக் காட்டுகிறது.
lexical_decisions:
- source_word: ἐπιμενῶ
  choice: தங்கியிருப்பேன்
  rationale: ἐπιμένω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம்; பயணத் திட்டச் சூழலில் ஒரு குறிப்பிட்ட காலம்வரை ஓரிடத்தில் தொடர்ந்து இருப்பதைக் குறிக்கிறது. ‘தங்கியிருப்பேன்’ என்பது இன்றைய தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய பயணத் திட்டத்துடன் மென்மையான முரண்பாட்டையோ மாற்றத்தையோ δέ குறிக்கிறது. அதனை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν Ἐφέσῳ
  choice: எபேசுவில்
  rationale: ἐν + வேற்றுமை வடிவம் இங்கு நேரடியான இடப்பொருளைத் தருகிறது; Ἔφεσος என்ற நகரப்பெயர் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: பெந்தெகொஸ்தே பண்டிகைவரை
  rationale: ἕως ஒரு குறிப்பிட்ட காலப்புள்ளிவரை நீடிப்பதைக் குறிக்கிறது. πεντηκοστή என்பதற்கு புதிய ஏற்பாட்டுத் தமிழில் அறியப்பட்ட ‘பெந்தெகொஸ்தே’ என்ற பெயருடன் ‘பண்டிகை’ சேர்க்கப்படுவது சாதாரண வாசகருக்கு அதன் பொருளைத் தெளிவாக்குகிறது; எபிரெயப் பின்னணியை வெளிப்படுத்தும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. பயணத் திட்டத்தின் நேரடியான தொனியும் மூலத்தின் மென்மையான இணைப்பு/முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன.
