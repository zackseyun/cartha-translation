id: 1CO.16.15
reference: 1 Corinthians 16:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: ta
  text: 'சகோதரர்களே[a], நான் உங்களிடம் வேண்டிக்கொள்கிறேன்: ஸ்தேவானாவின் வீட்டார் அகாயாவின் முதற்கனிகள்[b] என்பதையும், அவர்கள் பரிசுத்தவான்களுக்குச் சேவை செய்வதற்குத் தங்களை அர்ப்பணித்தார்கள் என்பதையும் நீங்கள் அறிவீர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; கிரேக்கத்தில் ‘சகோதரர்களே’ என்று உள்ளது. இது முழுச் சபையையும் உள்ளடக்கி அழைக்கும் பொதுவான முறை.
    reason: lexical_alternative
  - marker: b
    text: ‘முதற்கனிகள்’ என்பது அகாயாவில் முதலில் விசுவாசித்தவர்களைக் குறிக்கலாம்; அதேவேளையில், கடவுளுக்கென ஒதுக்கப்பட்ட முதல் பங்கு என்ற உருவகத்தையும் காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: நான் உங்களிடம் வேண்டிக்கொள்கிறேன்
  rationale: இது சாதாரண வேண்டுகோளைவிட வலுவான, மனமார்ந்த வேண்டுதலைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: δὲ
  choice: தனி சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: δέ இங்கு மென்மையான உரைமாற்றத்தைக் குறிக்கிறது. தமிழில் வாக்கிய ஓட்டமே அந்த மாற்றத்தை இயல்பாக உணர்த்துவதால் ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது தேவையற்ற பொருளை உருவாக்கலாம்.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க மூலத்தின் ஆண்பால் அழைப்புமுறையைப் பாதுகாக்கிறது; இது முழுச் சபையையும் உள்ளடக்கக்கூடிய வழக்கமான அழைப்பு என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: οἴδατε
  choice: நீங்கள் அறிவீர்கள்
  rationale: முற்றுவினை வடிவம் இங்கு நிகழ்காலப் பொருளில் உள்ளது; நேரடியான இயல்பான தமிழ்.
- source_word: οἰκίαν Στεφανᾶ
  choice: ஸ்தேவானாவின் வீட்டார்
  rationale: οἰκία என்பது கட்டிடத்தை மட்டும் அல்லாமல் குடும்பத்தாரையும் விரிவான இல்லக் குழுவையும் குறிக்கலாம்; ‘வீட்டார்’ அந்த சமூகப் பொருளை இயல்பாகத் தருகிறது.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: அகாயாவின் முதற்கனிகள்
  rationale: ἀπαρχή என்பதன் உருவகத்தையும், கடவுளுக்கென ஒதுக்கப்பட்ட முதல் பங்கு என்ற சாத்தியமான நுண்ணுணர்வையும் காக்கிறது; வெறும் ‘முதலில் விசுவாசித்தவர்கள்’ என்று விளக்கிப் பொருளைச் சுருக்கவில்லை.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: பரிசுத்தவான்களுக்குச் சேவை செய்வதற்கு
  rationale: διακονίαவின் பரந்த சேவைப் பொருளைத் தருகிறது; பிற்காலத் திருச்சபைப் பதவி சார்ந்த கருத்தைத் தேவையின்றி புகுத்தவில்லை.
- source_word: ἔταξαν ἑαυτούς
  choice: தங்களை அர்ப்பணித்தார்கள்
  rationale: ஒரு பணிக்குத் தங்களைத் திட்டமிட்டு ஒப்படைத்த நிலையான ஈடுபாட்டைக் குறிக்கிறது; அதிகாரப்பூர்வமாகத் தாங்களே நியமித்துக்கொண்டார்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: சபையை நோக்கிய ἀδελφοί என்ற அழைப்பின் மொழிபெயர்ப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: முதன்மை உரையில் மூலத்தின் ஆண்பால் வடிவம் பாதுகாக்கப்படுகிறது; கலந்த பாலினச் சபையையும் இது உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- issue: ἀπαρχὴ τῆς Ἀχαΐας என்பதன் பொருள்
  choice: அகாயாவின் முதற்கனிகள்
  alternative: அகாயாவில் முதலில் விசுவாசித்தவர்கள்
  rationale: பவுலின் உருவகத்தையும் அர்ப்பணிப்புச் சார்ந்த சாத்தியமான நுண்ணுணர்வையும் காக்கிறது; காலவரிசைப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: οἰκία என்ற ஒருமைச் சமூகப் பெயருக்கும் பின்னுள்ள பன்மைச் சுட்டுக்கும் இடையிலான தொடர்பு
  choice: வீட்டார் ... அவர்கள்
  alternative: குடும்பம் ... அது
  rationale: கிரேக்கத்தில் οἰκία ஒருமையாக இருந்தாலும் ἑαυτούς பன்மை அந்த இல்லத்தினரைத் தனிநபர்களின் குழுவாகக் குறிக்கிறது; தமிழில் ‘வீட்டார் ... அவர்கள்’ இந்த இயல்பான கூட்டு உணர்வைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பரிசுத்தவான்கள்’ மற்றும் ‘முதற்கனிகள்’ போன்ற வேதாகமத் தத்துவச் சொற்கள் மூல உருவகத்தையும் பதற்றத்தையும் காக்கப் பயன்படுத்தப்பட்டுள்ளன; தேவையான விளக்கம் அடிக்குறிப்புகளில் தரப்பட்டுள்ளது.
