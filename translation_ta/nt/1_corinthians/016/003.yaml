source:
  edition: SBLGNT
  text: ὅταν δὲ παραγένωμαι, οὓς ⸀ἐὰν δοκιμάσητε δι’ ἐπιστολῶν, τούτους πέμψω ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: ta
  text: நான் வந்ததும், நீங்கள் ஏற்றுக்கொள்ளும் நபர்களை, கடிதங்கள் மூலம் உங்கள் நன்கொடையை[a] எருசலேமுக்குக் கொண்டுபோக அனுப்புவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் அருளான கொடையை.” இங்குள்ள கிரேக்கச் சொல் “அருள்” என்றும் பொருள்படும்; இந்தச் சூழலில் அது எருசலேமுக்கு அனுப்பப்படும் நன்கொடையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: நான் வந்ததும்
  rationale: ὅταν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் எதிர்காலத்தில் நிகழும் வருகையைச் சுட்டுகிறது. தமிழ் வழக்கில் ‘வந்ததும்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; δέ இங்கு மென்மையான தொடரிணைப்பு என்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: நீங்கள் தகுதியானவர்கள் என்று ஏற்றுக்கொள்கிறவர்கள்
  rationale: δοκιμάζω என்பது ஆராய்ந்து தகுதியானவர் என ஏற்றுக்கொள்வதைக் குறிக்கலாம். பிரதிநிதிகளைத் தேர்ந்தெடுக்கும் இச்சூழலில் வெறும் ‘அங்கீகரிக்கிறவர்கள்’ என்பதைவிட இந்த மொழியாக்கம் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δι’ ἐπιστολῶν
  choice: கடிதங்களைக் கொடுத்து
  rationale: διά உடன் ஆறாம் வேற்றுமை இங்கு வழிமுறை அல்லது உடன்செல்லும் ஆவணங்களைக் குறிக்கிறது. கடிதங்கள் எந்த வகையானவை என்று கிரேக்கம் வெளிப்படையாகக் கூறாததால் ‘பரிந்துரைக் கடிதங்கள்’ என்று விரிவாக்கப்படவில்லை.
- source_word: τούτους πέμψω
  choice: அவர்களை அனுப்புவேன்
  rationale: τούτους முன்பு குறிப்பிடப்பட்டு ஏற்றுக்கொள்ளப்பட்டவர்களை வலியுறுத்தி மீண்டும் சுட்டுகிறது. தமிழில் ‘அவர்களை’ என வெளிப்படையாகக் கூறுவது வாக்கியத்தைத் தெளிவாக்குகிறது.
- source_word: ἀπενεγκεῖν
  choice: கொண்டுபோக
  rationale: இறுவினையெச்சம் அனுப்புவதன் நோக்கத்தைக் குறிக்கிறது. கொரிந்திலிருந்து எருசலேமுக்குச் செல்லும் பார்வையில் ‘கொண்டுபோக’ என்பது இயல்பானது.
- source_word: τὴν χάριν ὑμῶν
  choice: உங்கள் நன்கொடை
  rationale: இப்பகுதியின் சூழலில் χάρις எருசலேமிலுள்ள பரிசுத்தவான்களுக்காகச் சேகரிக்கப்பட்ட பொருளுதவியைக் குறிக்கிறது. ‘நன்கொடை’ concrete contribution-ஐத் தெளிவாகக் கூறுகிறது; χάρις என்பதிலுள்ள அருள்/தாராள மனப்பான்மை நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமுக்கு
  rationale: நகரத்தை நோக்கிய இலக்கைத் தமிழில் இயல்பாகக் குறிக்கும் வடிவம்.
theological_decisions:
- issue: சேகரிப்பு குறித்த சூழலில் χάρις என்பதன் பொருள்
  choice: எருசலேம் விசுவாசிகளுக்கான பொருளுதவி அல்லது நன்கொடை
  alternative: அருள்; அருளான கொடை; தாராளச் செயல்
  rationale: 1 கொரிந்தியர் 16-ன் உடனடிச் சூழல் பரிசுத்தவான்களுக்கான பணச் சேகரிப்பைப் பற்றியது. எனவே இங்கு ஒரு கருத்தியல் ‘அருள்’ என்பதற்குப் பதிலாக நன்கொடை முதன்மைப் பொருள்; ஆயினும் கிரேக்கச் சொல்லின் அருள் மற்றும் தாராளம் சார்ந்த நிழற்பொருள் முற்றிலும் நீக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடிதங்களின் தன்மையை ஊகிக்காமல் மூலத்தின் பொதுவான சொல்லாக்கம் காக்கப்பட்டுள்ளது.
