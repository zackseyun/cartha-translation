source:
  edition: SBLGNT
  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: ta
  text: ஆகையால், யாரும் அவனை அற்பமாகக் கருத வேண்டாம். அவன் என்னிடம் வரும்படி, அவனைச் சமாதானத்தோடு வழியனுப்புங்கள். ஏனெனில், சகோதரர்களுடன்[b] அவனை எதிர்பார்த்துக்கொண்டிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: இது பவுல் சகோதரர்களுடன் சேர்ந்து தீமோத்தேயுவை எதிர்பார்க்கிறார் என்றும், தீமோத்தேயு சகோதரர்களுடன் வருவதை அவர் எதிர்பார்க்கிறார் என்றும் பொருள்படலாம்.
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: μή τις οὖν
  choice: ஆகையால், யாரும் ... வேண்டாம்
  rationale: μή உடன் வரும் aorist subjunctive தடைப் பொருளைத் தருகிறது; οὖν முந்தைய கருத்திலிருந்து வரும் முடிவுறு தொடர்பை ‘ஆகையால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξουθενήσῃ
  choice: அற்பமாகக் கருத
  rationale: ஒருவரை மதிப்பற்றவராக எண்ணுதல் அல்லது இகழ்தல் என்ற வலுவான பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: προπέμψατε
  choice: வழியனுப்புங்கள்
  rationale: அடுத்த பயணத்திற்குத் தேவையான உதவியுடன் ஒருவரை அனுப்பிவைப்பது என்ற பயணச் சூழலுக்குரிய பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ἐν εἰρήνῃ
  choice: சமாதானத்தோடு
  rationale: அமைதியான, தடையற்ற, நல்லுறவுடனான புறப்பாட்டைக் குறிக்கும் மூலமொழி வடிவத்தை நெருக்கமாகப் பேணுகிறது.
- source_word: ἵνα ἔλθῃ πρός με
  choice: அவன் என்னிடம் வரும்படி
  rationale: ἵνα உடன் வரும் subjunctive காட்டும் நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκδέχομαι
  choice: எதிர்பார்த்துக்கொண்டிருக்கிறேன்
  rationale: தொடர்ந்து காத்திருக்கும் எதிர்பார்ப்பை present வடிவத்தின் தொடர்நிலைக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: சகோதரர்களுடன்
  rationale: ἀδελφῶν என்பதன் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் பேணுகிறது; அது விரிவான விசுவாசிகள் அல்லது உடன் ஊழியர்கள் குழுவைக் குறிக்கக்கூடிய வாய்ப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: ἀδελφῶν என்பது ஆண்களை மட்டுமா அல்லது கலப்புப் பாலின கிறிஸ்தவக் குழுவையா குறிக்கிறது
  choice: சகோதரர்களுடன்
  alternative: சகோதர சகோதரிகளுடன்
  rationale: கிரேக்கச் சொல் இலக்கணரீதியாக ஆண்பால் பன்மை. முதன்மை உரை அதனைத் தீர்மானித்து விரிவுபடுத்தாமல் பேணுகிறது; கலப்புக் குழுவைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் கொடுக்கப்படுகிறது.
- issue: μετὰ τῶν ἀδελφῶν என்பதன் தொடர்பு யாருடன் இணைகிறது
  choice: சகோதரர்களுடன் அவனை எதிர்பார்த்துக்கொண்டிருக்கிறேன்
  alternative: அவன் சகோதரர்களுடன் வருவதை எதிர்பார்த்துக்கொண்டிருக்கிறேன் / சகோதரர்களுடன் சேர்ந்து அவனை எதிர்பார்த்துக்கொண்டிருக்கிறேன்
  rationale: கிரேக்கத் தொடரில், சகோதரர்கள் பவுலுடன் காத்திருக்கிறார்களா அல்லது தீமோத்தேயுவுடன் வருகிறார்களா என்பது முற்றிலும் வெளிப்படையாக இல்லை. தமிழ் வடிவம் அந்தத் தொடர்பை அளவுக்கு மீறித் தீர்மானிக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வழியனுப்புங்கள்’ பயண உதவியின் உட்பொருளைக் கொண்ட இயல்பான சொல்லாகும்; ‘சமாதானத்தோடு’ வேதாகமச் சூழலுக்குரிய கருத்தைத் தெளிவாகப் பேணுகிறது.
