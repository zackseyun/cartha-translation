source:
  edition: SBLGNT
  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: ta
  text: ஆனால், நீங்கள் கவலைகளின்றி இருக்க வேண்டும் என்று நான் விரும்புகிறேன். திருமணமாகாத ஆண்[a] ஆண்டவருக்குரிய காரியங்களில் அக்கறை கொள்கிறான்; ஆண்டவரை எப்படிப் பிரியப்படுத்தலாம் என்பதிலும் அக்கறை கொள்கிறான்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமணமாகாதவர்.” கிரேக்கத்தில் ஆண்பால் ஒருமை வடிவம் (“திருமணமாகாத ஆண்”) உள்ளது; எனினும் சுற்றியுள்ள பகுதியில் பவுல் திருமணமாகாத மற்றும் திருமணமான ஆண்கள், பெண்கள் ஆகியோரின் நிலைகளை விரிவாகப் பேசுகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: ஆனால் ... நான் விரும்புகிறேன்
  rationale: θέλω விருப்பத்தை நேரடியாகக் குறிக்கிறது. δέ முந்தைய கருத்திலிருந்து மென்மையான மாறுபாட்டைக் காட்டுவதால் ‘ஆனால்’ இயல்பாகப் பொருந்துகிறது.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: நீங்கள் கவலைகளிலிருந்து விடுபட்டிருக்க வேண்டும்
  rationale: ἀμέριμνος என்பது கவலை அல்லது மனதைப் பிரிக்கும் அக்கறையின்றி இருப்பதைக் குறிக்கிறது. இத்தமிழாக்கம் முழுமையான அக்கறையின்மையை உணர்த்தாமல், கவலைகளிலிருந்து விடுதலையை வெளிப்படுத்துகிறது.
- source_word: ὁ ἄγαμος
  choice: திருமணமாகாத ஆண்
  rationale: கிரேக்கத்தில் இது ஆண்பால் ஒருமை வடிவம். உடனடியான சூழலிலும் ஆண், பெண் நிலைகள் தனித்தனியாகப் பேசப்படுவதால் அந்த இலக்கணப் பாலினம் முதன்மை உரையில் தக்கவைக்கப்படுகிறது.
- source_word: μεριμνᾷ
  choice: அக்கறைகொள்கிறான்
  rationale: இந்த வினைச்சொல் ‘கவலைப்படுதல்’ அல்லது ‘அக்கறைகொள்ளுதல்’ என்று பொருள்படலாம். ஆண்டவருக்குரிய காரியங்களைப் பற்றிய நேர்மறையான கவனத்தை இங்கு ‘அக்கறைகொள்கிறான்’ இயல்பாகத் தெரிவிக்கிறது; அதேவேளை ἀμέριμνος உடனான சொற்பொருள் தொடர்பும் மறையவில்லை.
- source_word: τὰ τοῦ κυρίου
  choice: ஆண்டவருக்குரிய காரியங்கள்
  rationale: ஆண்டவரைச் சார்ந்தவை அல்லது அவருக்குரிய செயல்பாடுகள் அனைத்தையும் உள்ளடக்கும் கிரேக்கச் சொற்றொடரின் பரந்த பொருளை இது தக்கவைக்கிறது.
- source_word: κυρίου / κυρίῳ
  choice: ஆண்டவர் / ஆண்டவருக்கு
  rationale: κύριος என்பதற்கான மரியாதைமிக்க, வழக்கமான புதிய ஏற்பாட்டுத் தமிழ் இணை ‘ஆண்டவர்’; இங்குள்ள பக்திசார் இறையியல் வலிமையையும் அது தக்கவைக்கிறது.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: ஆண்டவருக்கு எப்படிப் பிரியமாய் இருக்கலாம்
  rationale: πῶς முறையையோ நோக்கத்தையோ அறிமுகப்படுத்துகிறது; ἀρέσῃ என்ற subjunctive வடிவத்தின் சாத்திய அல்லது நோக்க நுணுக்கத்தை ‘இருக்கலாம்’ தக்கவைக்கிறது.
theological_decisions:
- issue: திருமணமாகாதவரைக் குறிக்கும் ஆண்பால் ஒருமை வடிவம்
  choice: முதன்மை உரையில் ‘திருமணமாகாத ஆண்’ என்று ஆண்பால் ஒருமையைத் தக்கவைத்தல்
  alternative: ‘திருமணமாகாதவர்’ அல்லது ‘திருமணமாகாத ஒருவர்’
  rationale: ὁ ἄγαμος என்பது ஆண்பால் ஒருமை; அடுத்துள்ள வசனங்கள் ஆண் மற்றும் பெண் நிலைகளைத் தனித்தனியாக எடுத்துரைக்கின்றன. எனவே மூலத்தின் வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, விரிந்த சூழலை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘கவலை’ மற்றும் ‘அக்கறை’ என்ற சொற்கள் ἀμέριμνος/μεριμνάω இடையிலான பதற்றத்தை இயல்பான தமிழில் வேறுபடுத்திக் காட்டுகின்றன. வசனம் தொடர்வதைக் காட்ட இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது.
