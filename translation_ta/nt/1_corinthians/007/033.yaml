  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: ta
  text: ஆனால், திருமணம் செய்தவன் உலகத்திற்குரிய காரியங்களைக் குறித்தும், தன் மனைவியை எப்படி மகிழ்விப்பது என்பதைக் குறித்தும் அக்கறை கொள்கிறான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உலகக் காரியங்களைக் குறித்து’ அல்லது ‘உலக வாழ்க்கையின் அலுவல்களைக் குறித்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: ஆனால் திருமணம் செய்தவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலப் பங்கேற்புவினை, சுற்றியுள்ள சூழலில் திருமணமாகாத ஆணுக்கு மாறாகத் திருமணம் செய்த ஆணைக் குறிக்கிறது. ‘திருமணம் செய்தவன்’ கிரேக்கத்தின் ஆண்பால் ஒருமையையும் செயற்பாட்டு வடிவத்தையும் இயல்பாகக் காக்கிறது.
- source_word: μεριμνᾷ
  choice: அக்கறைகொள்கிறான்
  rationale: இந்த வினை கவலை, கரிசனை அல்லது அக்கறை ஆகிய பொருள்களைத் தரலாம். இங்கு அவசியமாகப் பாவமான பதற்றம் குறிக்கப்படாததால், நடுநிலையான ‘அக்கறைகொள்கிறான்’ பொருத்தமானது.
- source_word: τὰ τοῦ κόσμου
  choice: உலகத்திற்குரிய காரியங்கள்
  rationale: இந்தச் சொற்றொடர் சாதாரண உலக வாழ்க்கையைச் சேர்ந்த காரியங்கள் அல்லது பொறுப்புகளைக் குறிக்கிறது. ‘உலகத்திற்குரிய’ என்பது அவற்றைத் தானாகவே ஒழுக்கரீதியாகத் தீயவை எனக் காட்டாமல் மூலத்தின் உறவுப்பொருளைக் காக்கிறது.
- source_word: πῶς ἀρέσῃ
  choice: எப்படி மகிழ்விப்பது என்று
  rationale: πῶς உடன் வரும் இறந்தகாலத் துணைவினை, அவனுடைய அக்கறையின் உள்ளடக்கத்தை—மனைவியை எவ்வாறு மகிழ்விப்பது என்பதை—வெளிப்படுத்துகிறது. இந்தத் தமிழ் வடிவம் இயல்பானதும் நோக்கத்தைத் தெளிவாகக் காட்டுவதுமாகும்.
- source_word: τῇ γυναικί
  choice: தன் மனைவியை
  rationale: திருமணச் சூழலில் γυνή என்பது தெளிவாக ‘மனைவி’ என்று பொருள்படுகிறது. கிரேக்கத்தில் உடைமை வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் இருக்க ‘தன்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: κόσμος என்பதற்கு இங்கு ஒழுக்கரீதியாக எதிர்மறையான பொருள் கொடுக்க வேண்டுமா?
  choice: ‘உலகத்திற்குரிய காரியங்கள்’ என்று நடுநிலையாக மொழிபெயர்த்தல்
  alternative: ‘உலக இச்சைக்குரிய காரியங்கள்’ அல்லது ஒழுக்கரீதியாகத் தீய ‘உலகக் காரியங்கள்’ என்று மொழிபெயர்த்தல்
  rationale: சூழலில் பவுலின் கருத்து திருமண வாழ்க்கையின் நடைமுறைப் பொறுப்புகளுக்கும் ஆண்டவருக்கான பிளவுபடாத அர்ப்பணிப்புக்கும் இடையிலான வேறுபாடு; திருமணத்தையோ சாதாரண பொறுப்புகளையோ முழுமையாகக் கண்டிப்பது அல்ல. நடுநிலை மொழியாக்கம் இந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அக்கறைகொள்கிறான்’ என்பது தேவையற்ற எதிர்மறை உணர்வைத் தவிர்க்கிறது; ‘உலகத்திற்குரிய காரியங்கள்’ மூலத்தின் திட்டமிட்ட நடுநிலையைக் காக்கிறது.
