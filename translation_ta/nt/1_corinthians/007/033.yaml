  to: ஆனால், திருமணம் செய்தவன் உலகத்திற்குரிய காரியங்களைக் குறித்தும், தன் மனைவியை எப்படி மகிழ்விப்பது என்பதைக் குறித்தும் அக்கறை கொள்கிறான்[a].
