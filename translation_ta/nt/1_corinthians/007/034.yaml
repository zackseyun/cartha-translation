source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: ta
  text: அவன் மனம் பிளவுபட்டிருக்கிறது. திருமணமாகாத பெண், அதாவது கன்னிப்பெண்,[a] உடலிலும் ஆவியிலும் பரிசுத்தமாயிருப்பதற்காக ஆண்டவருக்குரிய காரியங்களைக் குறித்து அக்கறை கொள்கிறாள். ஆனால் திருமணமான பெண், தன் கணவனை எப்படி மகிழ்விப்பது என்று உலகத்துக்குரிய காரியங்களைக் குறித்து அக்கறை கொள்கிறாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமணமாகாத பெண்ணும் கன்னிப்பெண்ணும் ஆண்டவருக்குரிய காரியங்களைக் குறித்து அக்கறை கொள்கிறார்கள்.” கிரேக்கத் தொடரை, இரண்டாவது சொல் முதலாவதை விளக்குவதாக அல்லாமல், இரண்டு வகைப் பெண்களைக் குறிப்பிடுவதாகவும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: அவனுடைய அக்கறை பிளவுபட்டிருக்கிறது
  rationale: முந்தைய வசனத்தில் திருமணமான ஆணைப் பற்றிய கருத்து தொடர்வதால் மறைந்துள்ள எழுவாய் சூழலிலிருந்து தெளிவாக்கப்படுகிறது. நிறைவு வினையின் தொடரும் விளைவையும், அக்கறைகள் பிளவுபடுகின்றன என்ற உருவகத்தையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: γυνὴ ἡ ἄγαμος
  choice: திருமணமாகாத பெண்
  rationale: திருமணமான பெண்ணுடன் வரும் எதிர்மறை ஒப்பீட்டில் γυνή என்பது ‘பெண்’ என்றும் ἄγαμος என்பது திருமணம் ஆகாத நிலை என்றும் இயல்பாகப் பொருள்படுகின்றன.
- source_word: παρθένος
  choice: கன்னிப்பெண்
  rationale: கிரேக்கச் சொல்லின் கன்னித்தன்மை குறித்த குறிப்பை பொதுவான ‘இளம்பெண்’ என்று தளர்த்தாமல், நவீன தமிழில் தெளிவாகக் காக்கிறது.
- source_word: μεριμνᾷ
  choice: அக்கறைகொள்கிறாள்
  rationale: இங்கு பாவமான கவலை அல்ல, கவனம் செலுத்தும் அக்கறையே கருத்து; அதனால் ‘கவலைப்படுகிறாள்’ என்பதைவிட இது சூழலுக்கு ஏற்றது.
- source_word: τὰ τοῦ κυρίου
  choice: ஆண்டவருக்குரிய காரியங்கள்
  rationale: ‘ஆண்டவருக்குரியவை’ என்ற அமைப்பைக் காத்து, பின்னர் வரும் உலகத்துக்குரிய காரியங்களுடனான இணையான எதிர்மறையை வெளிப்படுத்துகிறது.
- source_word: ἵνα ᾖ ἁγία
  choice: பரிசுத்தமாயிருப்பதற்காக
  rationale: ἵνα உடன் வரும் நோக்கப் பொருளையும், ἁγία என்பதன் வெளிப்படையான பரிசுத்த மொழியையும் காக்கிறது.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: உடலிலும் ஆவியிலும்
  rationale: பரிசுத்தம் எந்த இரு தளங்களில் கூறப்படுகிறது என்பதை இயல்பான தமிழ் இணை அமைப்பில் தெரிவிக்கிறது; மனித இயல்பைப் பற்றிய கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
- source_word: ἡ δὲ γαμήσασα
  choice: ஆனால் திருமணமான பெண்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் இறந்தகாலப் பங்கேற்பை, தற்போதைய திருமண நிலையைக் குறிக்கும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: τὰ τοῦ κόσμου
  choice: உலகத்துக்குரிய காரியங்கள்
  rationale: ஆண்டவருக்குரிய காரியங்கள் என்ற முந்தைய சொற்றொடருடன் அமைப்பியல் ஒற்றுமையைக் காக்கிறது; தேவையற்ற எதிர்மறை ஒழுக்கத் தீர்ப்பைச் சேர்ப்பதில்லை.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: தன் கணவனை எப்படி மகிழ்விப்பது
  rationale: திருமணச் சூழலில் ἀνήρ என்பது கணவனைக் குறிக்கிறது; அக்கறையின் உள்ளடக்கத்தை இயல்பான தமிழ் மறைமுகக் கேள்வியாக வழங்குகிறது.
theological_decisions:
- issue: திருமணமாகாத பெண்ணும் கன்னிப்பெண்ணும் இரண்டு தனித்தனி வகைகளா, அல்லது இரண்டாவது சொல் முதலாவதை விளக்குகிறதா?
  choice: விளக்கநிலைத் தொடர்பாக ‘திருமணமாகாத பெண், அதாவது கன்னிப்பெண்’ என்று முதன்மை உரையில் வழங்கப்பட்டது.
  alternative: ஒருங்கிணைக்கப்பட்ட இரண்டு வகைகளாக ‘திருமணமாகாத பெண்ணும் கன்னிப்பெண்ணும்’ என்று வாசிக்கலாம்.
  rationale: கிரேக்கத் தொடரமைப்பு சுருக்கமானதும் இருவிதமாகப் புரிந்துகொள்ளக்கூடியதும் ஆகும். ஒருமை வினைச்சொல் ஒருங்கிணைந்த எழுவாயை ஆதரிப்பதால் விளக்கநிலை வாசிப்பு முதன்மை உரையில் தெளிவாக அமைகிறது; இருப்பினும் செல்லத்தக்க மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘அக்கறைகொள்கிறாள்’, ‘ஆண்டவருக்குரிய’, ‘பரிசுத்தம்’ ஆகிய சொற்கள் மூலத்தின் மறுமொழி அமைப்பையும் இறையியல் நிறையையும் காக்கின்றன. முதல் வாக்கியத்தின் மறைந்த எழுவாய் முந்தைய வசனச் சூழலிலிருந்து ‘அவன்’ எனத் தெளிவாக்கப்பட்டுள்ளது.
