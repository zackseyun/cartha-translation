id: 1CO.7.1
reference: 1 Corinthians 7:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: ta
  text: 'நீங்கள் எழுதியவற்றைக் குறித்து: ஒரு ஆண் ஒரு பெண்ணைத் தொடாமல் இருப்பது நல்லது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெண்ணைத் தொடுவது” என்பது இங்கு பாலுறவைக் குறிக்கும் மறைமுகச் சொல்லாக இருக்கலாம்.
    reason: Clarifies the probable sexual euphemism while preserving the source wording and its ambiguity in the main text.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: நீங்கள் எழுதியவற்றைக் குறித்து
  rationale: περὶ δέ introduces a new topic concerning what the Corinthians wrote. Tamil does not require an added temporal word equivalent to English “now.”
- source_word: καλόν
  choice: நல்லது
  rationale: Directly represents the evaluative sense “good,” without expanding it to “better” or “right.”
- source_word: ἀνθρώπῳ
  choice: ஒரு ஆண்
  rationale: In this contrast with γυναικός, the referent is a male person; “ஒரு ஆண்” is natural and precise in modern Tamil.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: ஒரு பெண்ணைத் தொடாமல் இருப்பது
  rationale: Preserves the source expression “not to touch a woman,” including its likely euphemistic force, rather than replacing it in the main text with an interpretation.
theological_decisions:
- issue: Whether Paul is stating his own maxim or quoting/paraphrasing the Corinthians’ letter
  choice: Leave the statement unmarked as in the Greek text
  alternative: Place “ஒரு ஆண் ஒரு பெண்ணைத் தொடாமல் இருப்பது நல்லது” in quotation marks as a Corinthian slogan
  rationale: The Greek has no quotation marks and permits debate over the statement’s voice. The translation should not settle that genuine ambiguity.
- issue: Whether γυνή means “woman” or “wife” here
  choice: பெண்
  alternative: மனைவி
  rationale: The broader wording “woman” preserves the lexical range and fits the idiom without prematurely restricting the reference to marriage.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் இல்லாத காலச்சுட்டுச் சொல்லைத் தொடக்கத்தில் சேர்க்கவில்லை; வசனத்தின் சுருக்கமும் கருத்துத் தெளிவும் காக்கப்பட்டுள்ளன.
