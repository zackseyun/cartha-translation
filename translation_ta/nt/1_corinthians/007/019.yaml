- source_word: τήρησις
  choice: கடைப்பிடிப்பது
  rationale: கட்டளைகளைத் தொடர்ந்து காத்து நடப்பது அல்லது அனுசரிப்பது என்ற பெயர்ச்சொல் கருத்தை இயல்பான தமிழில் தருகிறது; பொதுவான ‘கீழ்ப்படிதல்’ என்று விரிவாக்கவில்லை.
- source_word: ἐντολῶν θεοῦ
  choice: கடவுளின் கட்டளைகள்
  rationale: θεοῦ என்ற உரிமைத் தொடர்பையும் ἐντολῶν என்ற உறுதியான பன்மையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: விருத்தசேதனத்தையும் விருத்தசேதனம் செய்யப்படாத நிலையையும் பவுல் மதிப்பிடுவது
