- source_word: οὐδέν ἐστιν
  choice: ஒன்றுமல்ல
  rationale: கிரேக்கத்தில் இருமுறை வரும் வலிமையான, சுருக்கமான மதிப்பீட்டைத் தமிழிலும் அதேபோல் மீண்டும் கூறுகிறது; ‘எந்த மதிப்பும் இல்லை’ என்பது சாத்தியமான விளக்கமுறை மாற்று.
- source_word: ἀκροβυστία
  choice: விருத்தசேதனம் செய்யப்படாதிருப்பது
  rationale: ‘விருத்தசேதனம் செய்யாமை’ என்பதைக் காட்டிலும் இயல்பான நவீனத் தமிழில் நிலையைத் தெளிவாகக் கூறி, περιτομή என்பதுடனான எதிர்மறை இணைப்பைப் பாதுகாக்கிறது.
- source_word: ἀλλά
