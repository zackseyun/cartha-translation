  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: ta
  text: ஆனால், நீ திருமணம் செய்துகொண்டாலும், பாவம் செய்யவில்லை; கன்னிப்பெண் திருமணம் செய்துகொண்டாலும், அவளும் பாவம் செய்யவில்லை. எனினும், இப்படிப்பட்டவர்களுக்கு உடல்சார்ந்த வாழ்க்கையில்[a] துன்பம் உண்டாகும்; நானோ உங்களை அந்தத் துன்பத்திலிருந்து விலக்க விரும்புகிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘மாம்சத்தில்’. இது ‘பாவ இயல்பை’ குறிப்பதல்ல; திருமணத்துடன் தொடர்புடைய இவ்வுலக அல்லது உடல்சார்ந்த வாழ்க்கைத் துன்பங்களைக் குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் உங்களை விட்டுவைக்கிறேன்’ அல்லது ‘நான் உங்களுக்கு இரக்கம் காட்டுகிறேன்.’ பவுல் திருமணத்தோடு தொடர்புடைய இந்தத் துன்பத்திலிருந்து அவர்களை விலக்க விரும்புவதைத் தெரிவிக்கிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: நீ திருமணம் செய்துகொண்டாலும்
  rationale: ἐάν உடன் வரும் இறந்தகாலத் துணைவினை எதிர்காலச் சாத்திய நிபந்தனையைத் தெரிவிக்கிறது. நவீன தமிழில் ‘திருமணம் செய்துகொண்டாலும்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἥμαρτες
  choice: பாவம் செய்யவில்லை
  rationale: திருமணம் செய்துகொள்ளும் செயல் பாவமல்ல என்ற அறநிலைத் தீர்ப்பைத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἡ παρθένος
  choice: கன்னிப்பெண்
  rationale: παρθένος என்பதன் பாலியல் நிலையைக் குறிக்கும் அடிப்படைப் பொருளைப் பாதுகாக்கிறது; பொதுவான ‘திருமணமாகாத பெண்’ என்று விரிவாக்கவில்லை.
- source_word: γήμῃ
  choice: திருமணம் செய்துகொண்டாலும்
  rationale: முந்தைய வினையுடன் உள்ள இணை அமைப்பையும் நிபந்தனைத் தன்மையையும் காக்கிறது.
- source_word: θλῖψιν
  choice: துன்பத்தை
  rationale: அழுத்தம், இடுக்கண், வேதனை ஆகிய பொருட்களை உள்ளடக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்; இங்கு தேவையின்றி இறுதிக்காலத் ‘உபத்திரவம்’ என்ற குறிப்பிட்ட கருத்தைத் திணிக்காது.
- source_word: τῇ σαρκὶ
  choice: உடல் சார்ந்த வாழ்வில்
  rationale: σάρξ இங்கு ‘பாவ இயல்பு’ என்பதைக் காட்டாமல், மனிதர்களின் உடல்சார்ந்த இவ்வுலக வாழ்க்கைச் சூழலைக் குறிக்கிறது. ‘மாம்சத்தில்’ என்ற சொல்லின் சாத்தியமான தவறான இறையியல் பொருளைத் தவிர்த்து, கிரேக்கத்தின் உடல்சார்ந்த குறிப்பைப் பாதுகாக்கிறது.
- source_word: οἱ τοιοῦτοι
  choice: இப்படிப்பட்டவர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட திருமணம் செய்துகொள்பவர்களைச் சுட்டுகிறது; அதைக் கூடுதலாகக் குறுக்காமல் பொதுவான குறிப்பைத் தக்கவைக்கிறது.
- source_word: φείδομαι
  choice: உங்களைக் காக்க விரும்புகிறேன்
  rationale: φείδομαι என்பதிலுள்ள ஒருவரைத் துன்பத்திலிருந்து விலக்கி வைக்கும் அல்லது அவர்மீது இரக்கம் காட்டும் மேய்ப்புப் பண்பு நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; நிகழ்கால வடிவத்தின் சுருக்கத்தால் உள்ள நுண்ணிய தெளிவின்மையை அடிக்குறிப்பு காட்டுகிறது.
theological_decisions:
- issue: τῇ σαρκί என்பதில் σάρξ-இன் பொருள்
  choice: பாவ இயல்பு அல்லாமல் உடல் சார்ந்த இவ்வுலக வாழ்க்கை
  alternative: ‘மாம்சத்தில்’; அல்லது ‘பாவ இயல்பில்’
  rationale: திருமணத்தோடு தொடர்புடைய நடைமுறை மற்றும் உடல்சார்ந்த இடுக்கண்களைப் பவுல் எச்சரிக்கிறார்; மனிதப் பாவ இயல்பைப் பற்றிய மானிடவியல் கூற்றை இங்கு முன்வைக்கவில்லை. எனவே உடல்சார்ந்த குறிப்பைப் பாதுகாத்து, ‘பாவ இயல்பு’ என்ற விளக்கத்தைத் திணிக்கவில்லை.
- issue: φείδομαι என்பதன் மேய்ப்புப் பண்பு நோக்கம்
  choice: உங்களைக் காக்க விரும்புகிறேன்
  alternative: ‘உங்களை விட்டுவைக்கிறேன்’; அல்லது ‘உங்களைக் காக்கிறேன்’
  rationale: கிரேக்க நிகழ்காலம் நேரடியான ‘நான் உங்களை விட்டுவைக்கிறேன்/காக்கிறேன்’ என்ற பொருளையும், சூழலில் பவுலின் பாதுகாக்கும் நோக்கத்தையும் அனுமதிக்கிறது. தமிழில் நோக்கம் இயல்பாகத் தெரிவிக்கப்படுகிறது; மாற்று நேரடி மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
