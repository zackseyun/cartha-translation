  source_fidelity: 'முக்கியக் கருத்து மூலத்துக்கு ஏற்ப உள்ளது: திருமணம் பாவமல்ல; திருமணம் செய்பவர்களுக்கு θλῖψις உண்டாகும்; பவுலின் நோக்கம் அவர்களை அதிலிருந்து காப்பதே. ஆனால் φείδομαι என்பதற்கு ‘காக்க விரும்புகிறேன்’ என்பது நிகழ்கால வினையின் நேரடித்தன்மையைத் தளர்த்தி, ‘காப்பது’ என்ற கூடுதல் நுணுக்கத்தையும் ஏற்றுகிறது. ‘துன்பத்திலிருந்து விலக்க விரும்புகிறேன்’ என்பது சூழலுக்கு ஏற்றது; இருப்பினும் மூலத்தின் நேரடி ‘நான் உங்களை விட்டுவைக்கிறேன் / spare you’ என்பதையும் அடிக்குறிப்பில் தர வேண்டும். மேலும் τῇ σαρκί என்பது ‘உடல்சார்ந்த வாழ்வில்’ என விளக்கப்படலாம்; ஆனால் ‘உடல்சார்ந்த வாழ்க்கையில்’ என்பது குறைவாகச் சுற்றிச் சொல்லி மூலத்தின் ambiguity-யைக் காக்கிறது.'
