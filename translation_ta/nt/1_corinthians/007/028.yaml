revisions:
- from: ஆனால், நீ திருமணம் செய்துகொண்டாலும் பாவம் செய்யவில்லை; கன்னிப்பெண் திருமணம் செய்துகொண்டாலும் அவள் பாவம் செய்யவில்லை. எனினும், இப்படிப்பட்டவர்கள் உடல் சார்ந்த வாழ்வில்[a] துன்பத்தை அனுபவிப்பார்கள்; நானோ உங்களைக் காக்க விரும்புகிறேன்[b].
  to: ஆனால், நீ திருமணம் செய்துகொண்டாலும், பாவம் செய்யவில்லை; கன்னிப்பெண் திருமணம் செய்துகொண்டாலும், அவளும் பாவம் செய்யவில்லை. எனினும், இப்படிப்பட்டவர்களுக்கு உடல்சார்ந்த வாழ்க்கையில்[a] துன்பம் உண்டாகும்; நானோ உங்களை அந்தத் துன்பத்திலிருந்து விலக்க விரும்புகிறேன்[b].
  rationale: φείδομαι-யின் ‘spare’ பொருளைச் சூழலுக்கு ஏற்பத் துன்பத்திலிருந்து விலக்குதல் எனத் தெளிவுபடுத்தி, நேரடியான மாற்றுகளை அடிக்குறிப்பில் வைத்துள்ளேன். σάρξ தொடர்பான விளக்கத்தை முதன்மை உரையில் அளவோடு வைத்து, அதன் சொல்லுக்குச் சொல் வடிவத்தையும் பாவ இயல்பு அல்லாத பொருளையும் அடிக்குறிப்பில் பாதுகாத்துள்ளேன். சிறிய நிறுத்தக்குறி மற்றும் நடை திருத்தங்களும் செய்யப்பட்டுள்ளன.
