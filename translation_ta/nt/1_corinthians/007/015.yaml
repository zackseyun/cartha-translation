  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: ta
  text: ஆனால், விசுவாசமில்லாதவர்[a] பிரிந்துபோகிறாரானால், அவர் பிரிந்துபோகட்டும். அத்தகைய சூழ்நிலைகளில் சகோதரனோ சகோதரியோ அடிமைப்படுத்தப்பட்டவர் அல்ல[b]. ஆனால், தேவன் நம்மை[c] சமாதானத்தில் அழைத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: திருமணச் சூழலில் இது ‘விசுவாசமில்லாத வாழ்க்கைத்துணை’ என்பதைக் குறிக்கிறது. கிரேக்கத்தில் சொல்லர்த்தமாக ‘விசுவாசமில்லாதவர்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கட்டுப்பட்டவர் அல்ல.’ இங்குள்ள கிரேக்க வினைச்சொல் ‘அடிமைப்படுத்துதல்’ (δουλόω) என்பதிலிருந்து வந்தது; பொதுவாக ‘கட்டுதல்’ என்பதற்குப் பயன்படுத்தப்படும் வினைச்சொல் அல்ல.
    reason: lexical_alternative
  - marker: c
    text: சில கையெழுத்துப் பிரதிகளில் ‘நம்மை’ என்பதற்குப் பதிலாக ‘உங்களை’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: விசுவாசமில்லாதவர்
  rationale: இது பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெயரடை; திருமணச் சூழலில் விசுவாசமில்லாத வாழ்க்கைத்துணையைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘வாழ்க்கைத்துணை’ என்பதை முதன்மை உரையில் சேர்க்காமல், தமிழில் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: χωρίζεται / χωριζέσθω
  choice: பிரிந்துபோகிறாரானால் / அவர் பிரிந்துபோகட்டும்
  rationale: இரண்டு வடிவங்களிலும் உள்ள ஒரே வினைச்சொல்லின் தொடர்பைப் பேணுகிறது; சட்டபூர்வ மணவிலக்கா அல்லது உடல்ரீதியான பிரிவா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை. கட்டளை வடிவம் இங்கு பிரிவை வற்புறுத்தாமல் அனுமதிக்கும் தன்மையைக் கொண்டுள்ளது.
- source_word: οὐ δεδούλωται
  choice: அடிமையாக்கப்பட்டிருக்கவில்லை
  rationale: δουλόω என்பதன் அடிப்படைப் பொருள் ‘அடிமையாக்குதல்’; வழக்கமான ‘கட்டுதல்’ என்பதற்கான δέω என்ற வினை இங்கு இல்லை. நிறைவுற்ற செயலின் தொடரும் நிலையை இறந்தகால வினையெச்ச அமைப்பு வெளிப்படுத்துகிறது.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: சகோதரனோ சகோதரியோ
  rationale: விசுவாசக் குடும்பத்தைச் சேர்ந்த ஆண் அல்லது பெண் இருவரையும் பவுல் தனித்தனியாகக் குறிப்பிடுவதைத் தெளிவாகப் பேணுகிறது.
- source_word: ἐν τοῖς τοιούτοις
  choice: அத்தகைய சூழ்நிலைகளில்
  rationale: முன்னர் விவரிக்கப்பட்டதைப் போன்ற நிலைகளைச் சுட்டும் பன்மைச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐν δὲ εἰρήνῃ
  choice: ஆனால் ... சமாதானத்தில்
  rationale: ἐν என்பதன் பரப்பு அல்லது நிலை சார்ந்த பொருளைப் பேணி, திருமண முரண்பாட்டுக்கு எதிரான ‘சமாதானம்’ என்ற கருத்தைத் தெளிவாக வைக்கிறது.
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: தேவன் நம்மை ... அழைத்திருக்கிறார்
  rationale: நிறைவுற்ற அழைப்பின் தொடரும் விளைவை கிரேக்க நிறைவுக்காலத்திற்கு ஏற்றவாறு ‘அழைத்திருக்கிறார்’ என்று தருகிறது; SBLGNT-இன் ἡμᾶς (‘நம்மை’) வாசகம் பின்பற்றப்படுகிறது.
theological_decisions:
- issue: οὐ δεδούλωται என்பது திருமண முறிவு அல்லது மறுமணத்துக்கு எவ்வளவு விடுதலை அளிக்கிறது?
  choice: ‘அடிமையாக்கப்பட்டிருக்கவில்லை’ என்று சொற்பொருளுக்கு நெருக்கமாக மொழிபெயர்த்து, அந்த விடுதலையின் முழு வரம்பை வரையறுக்காமல் விடப்பட்டுள்ளது.
  alternative: ‘கட்டுப்பட்டவரல்ல’ என்பதை மறுமணத்துக்கான தொழில்நுட்ப அனுமதியாகப் புரிந்துகொள்ளுதல்; அல்லது பிரிந்துபோகிறவரை வற்புறுத்திப் பின்தொடர வேண்டியதில்லை என்று மட்டும் புரிந்துகொள்ளுதல்.
  rationale: வசனம் விசுவாசி ‘அடிமையாக்கப்பட்டிருக்கவில்லை’ என்று கூறினாலும், அதன் எல்லா நடைமுறை விளைவுகளையும் வெளிப்படையாக வரையறுப்பதில்லை. ஆகவே பிரிவுசார் கோட்பாட்டு முடிவு உரைக்குள் சேர்க்கப்படவில்லை.
- issue: ὁ ἄπιστος என்பதன் சூழல்சார் குறிப்பு
  choice: முதன்மை உரையில் ‘விசுவாசமில்லாதவர்’; சூழலில் அது விசுவாசமில்லாத வாழ்க்கைத்துணையைக் குறிக்கிறது.
  alternative: ‘விசுவாசமில்லாத வாழ்க்கைத்துணை’ என்று விளக்கத்தை உரைக்குள்ளேயே சேர்த்தல்.
  rationale: திருமணச் சூழல் குறிப்பைத் தெளிவாக்குகிறது; ஆயினும் கிரேக்கச் சொற்றொடர் ‘வாழ்க்கைத்துணை’ என்று வெளிப்படையாகச் சொல்லாததால் அந்த விளக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரிந்துபோகிறாரானால் ... பிரிந்துபோகட்டும்’ என்ற மறுபயன்பாடு கிரேக்க வினைச்சொல் தொடர்பைப் பேணுகிறது. மரியாதைப் பன்மை வினை வடிவம் பாலினத்தைத் தேவையின்றி நிர்ணயிக்காமல் இயல்பான தமிழை வழங்குகிறது; ‘சமாதானத்தில்’ என்பது மூலத்தின் திட்டமிட்ட நெருக்கத்தைப் பேணுகிறது.
