  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: ta
  text: ஒவ்வொருவரும் தாம் எந்த அழைப்பில்[a] அழைக்கப்பட்டாரோ, அதிலேயே நிலைத்திருக்கட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழைப்பு’ என்பதற்கு இங்கே ‘நிலைமை,’ ‘வாழ்க்கை நிலை,’ அல்லது ‘சமூக நிலை’ என்ற பொருளும் இருக்கலாம். கிரேக்கத்தில் ‘அழைப்பு’ என்ற சொல் பயன்படுத்தப்பட்டு, அதே வசனத்திலுள்ள ‘அழைக்கப்பட்டார்’ என்பதோடு சொல் தொடர்பு ஏற்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘ஒவ்வொருவர்’ என்பதற்கான சொல் இலக்கணப்படி ஆண்பால் ஒருமை வடிவத்தில் உள்ளது; இங்கு அது பிரதிநிதித்துவமாகப் பயன்படுத்தப்பட்டு, இந்த அறிவுரை ஒவ்வொரு நம்பிக்கையாளருக்கும் பொருந்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: பகிர்வுப் பொருளுடைய ஒருமையை இயல்பான நவீனத் தமிழில் காட்டுகிறது; அறிவுரை ஒவ்வொரு நம்பிக்கையாளருக்கும் தனித்தனியாகப் பொருந்துவதைப் பாதுகாக்கிறது.
- source_word: κλήσει
  choice: அழைப்பில்
  rationale: κλῆσις என்பதன் நேரடிப் பொருளான ‘அழைப்பு’ என்பதைக் காத்து, அதே வசனத்திலுள்ள ἐκλήθη (‘அழைக்கப்பட்டார்’) என்பதுடனான சொல் தொடர்பையும், இறை அழைப்புக்கும் வாழ்க்கை நிலைக்கும் இடையிலான பொருள் இறுக்கத்தையும் பாதுகாக்கிறது.
- source_word: ᾗ ἐκλήθη
  choice: எந்த அழைப்பில் அழைக்கப்பட்டாரோ
  rationale: ἐν என்பதோடு அமைந்த தொடர்புப்பெயர் கட்டமைப்பை ‘எந்த ... -ஆரோ’ என்ற இயல்பான தமிழில் தருகிறது. செய்பவர் வெளிப்படையாகக் கூறப்படாத இறைச்செயப்பாட்டு வடிவத்தையும் அப்படியே விடுகிறது.
- source_word: ἐν ταύτῃ
  choice: அதிலேயே
  rationale: முன்னர் கூறப்பட்ட அழைப்பைச் சுட்டும் ταύτῃ என்பதையும், ἐν என்பதையும் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; ‘-ஏ’ அழுத்தத்தைக் காக்கிறது.
- source_word: μενέτω
  choice: நிலைத்திருக்கட்டும்
  rationale: தற்போதைய நிலையில் தொடர்ந்து இருப்பதைக் குறிக்கும் நிகழ்காலக் கட்டளை வலிமையைப் பாதுகாக்கும், கண்ணியமான இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: இச்சூழலில் κλῆσις என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘அழைப்பு’ என்பதை வைத்திருத்தல்
  alternative: நிலைமை; வாழ்க்கை நிலை; சமூக நிலை
  rationale: உடனடிச் சூழல் விருத்தசேதனம், அடிமைநிலை போன்ற வாழ்க்கைச் சூழல்களைப் பற்றியதாக இருந்தாலும், κλήσει—ἐκλήθη என்ற திட்டமிட்ட சொல் தொடர்பு இறைவனுடைய அழைப்பையும் ஒருவர் அழைக்கப்பட்டபோதைய நிலையையும் ஒன்றோடொன்று இணைக்கிறது. ‘அழைப்பு’ இந்த இருபொருள் இறுக்கத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- issue: ஆண்பால் ஒருமை வடிவத்தின் பிரதிநிதித்துவப் பயன்பாடு
  choice: தமிழில் இயல்பான ‘ஒவ்வொருவரும் ... அழைக்கப்பட்டாரோ’ என்ற வடிவத்தைப் பயன்படுத்தி, கிரேக்க வடிவத்தை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘ஒவ்வொருவனும் ... அழைக்கப்பட்டானோ’ என்று வெளிப்படையான ஆண்பால் ஒருமையைப் பயன்படுத்துதல்
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு ஒவ்வொரு நம்பிக்கையாளரையும் பிரதிநிதித்துவமாகக் குறிக்கிறது. நவீனத் தமிழில் ‘ஒவ்வொருவரும்’ அதே பகிர்வு மற்றும் பிரதிநிதித்துவப் பொருளை இயல்பாகத் தருகிறது; வெளிப்படையான ஆண்பால் வடிவம் பெண்களை விலக்குவது போன்ற தவறான எண்ணத்தை உண்டாக்கக்கூடும். மூலத்தின் இலக்கண வடிவம் அடிக்குறிப்பில் வெளிப்படையாகத் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அழைப்பு/அழைக்கப்பட்டார்’ என்ற சொல் தொடர்பு பாதுகாக்கப்பட்டுள்ளது. ‘நிலைத்திருக்கட்டும்’ கட்டளையின் தொடர்ச்சிப் பொருளை இயல்பாகத் தருகிறது.
