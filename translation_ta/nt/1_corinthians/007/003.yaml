  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: ta
  text: கணவன் தன் மனைவிக்குத் தாம்பத்தியக் கடமையை நிறைவேற்றட்டும்[a]; அவ்வாறே மனைவியும் தன் கணவனுக்கு நிறைவேற்றட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘அவளுக்குச் செலுத்த வேண்டிய கடனை’ அல்லது ‘அவளுக்குரியதை.’ இச்சூழலில் இது கணவனும் மனைவியும் ஒருவருக்கொருவர் நிறைவேற்ற வேண்டிய தாம்பத்தியக் கடமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ γυναικί
  choice: தன் மனைவிக்கு
  rationale: திருமணத்தைப் பற்றிய உடனடிச் சூழலில் γυνή என்பது பொதுவாகப் பெண்ணை அல்ல, மனைவியைக் குறிக்கிறது. தமிழில் உறவை இயல்பாகத் தெளிவுபடுத்த ‘தன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὁ ἀνήρ
  choice: கணவன்
  rationale: γυνή என்பதற்கு இணையான திருமணச் சூழலில் ἀνήρ என்பது ‘ஆண்’ என்பதைவிட ‘கணவன்’ எனப் பொருள்படுகிறது.
- source_word: τὴν ὀφειλήν
  choice: செலுத்த வேண்டிய கடமையை
  rationale: ὀφειλή என்பது அடிப்படையில் செலுத்த வேண்டியது, கடன் அல்லது கடமை என்பதைக் குறிக்கிறது. சூழல் தாம்பத்திய உறவைக் குறித்தாலும், மூலச்சொல்லைவிட அதிகமாக வெளிப்படையாகக் கூறாமல் அதன் கடமை சார்ந்த பொருளை இத்தொடர் காக்கிறது.
- source_word: ἀποδιδότω
  choice: செலுத்தட்டும்
  rationale: நிகழ்காலக் கட்டளை வடிவத்தின் தொடர்ச்சியான கடப்பாட்டையும், ‘கொடுக்க வேண்டியதைச் செலுத்துதல்’ என்ற ἀποδίδω வினையின் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ὁμοίως δὲ καί
  choice: அதுபோல ...வும்
  rationale: கணவன், மனைவி இருவருக்கும் ஒரேபோலப் பொருந்தும் பரஸ்பரத் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ὀφειλή குறிக்கும் திருமணக் கடமையை எவ்வளவு வெளிப்படையாக மொழிபெயர்ப்பது
  choice: முதன்மை உரையில் ‘செலுத்த வேண்டிய கடமை’ என்று தருதல்
  alternative: ‘தாம்பத்தியக் கடமை’ அல்லது ‘அவளுக்குரியதை’
  rationale: வசனத்தின் சூழல் பாலுறவு சார்ந்த தாம்பத்தியக் கடப்பாட்டைக் குறிக்கிறது; எனினும் ὀφειλή என்ற சொல் தானாகவே அந்தக் கருத்தை வெளிப்படையாகக் குறிப்பிடுவதில்லை. ஆகவே மூலத்தின் பரந்த ‘கடன்/கடமை’ உருவகத்தையும், இருவருக்குமான சமமான கடப்பாட்டையும் காத்து, சூழல் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையைப் பயன்படுத்துகிறது. இணையான இரு வாக்கிய உறுப்புகளின் மூலம் மூலத்தில் உள்ள பரஸ்பரச் சமநிலை பாதுகாக்கப்பட்டுள்ளது; ‘செலுத்தட்டும்’ என்பது கடன்/கடமை என்ற உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
