id: 1CO.7.2
reference: 1 Corinthians 7:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: ta
  text: ஆனால் பாலியல் ஒழுக்கக்கேடுகள்[a] காரணமாக, ஒவ்வோர் ஆணும் தனக்கே உரிய மனைவியைக் கொண்டிருக்கட்டும்; ஒவ்வொரு பெண்ணும் தனக்கே உரிய கணவனைக் கொண்டிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘பாலியல் ஒழுக்கக்கேடு’ (ஒருமை). கிரேக்க மூலத்தில் ‘பாலியல் ஒழுக்கக்கேடுகள்’ என்று பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: ஆனால் ... காரணமாக
  rationale: διά + குற்றுவேற்றுமை காரணத்தைக் குறிக்கிறது; δέ முந்தைய கருத்திலிருந்து மென்மையான மாறுபாட்டை அல்லது நகர்வைக் காட்டுகிறது. ‘ஆனால் ... காரணமாக’ இரண்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τὰς πορνείας
  choice: பாலியல் ஒழுக்கக்கேடுகள்
  rationale: πορνεία என்பது பாலியல் ஒழுக்கமற்ற நடத்தையைப் பரந்த பொருளில் குறிக்கிறது. மூலத்தில் உள்ள பன்மையை ‘ஒழுக்கக்கேடுகள்’ காக்கிறது; குறுகிய அல்லது பழமையான சொல்லைத் தவிர்க்கிறது.
- source_word: ἕκαστος
  choice: ஒவ்வோர் ஆணும்
  rationale: பெண்பால் ἑκάστη என்பதுடன் அமைந்த இணைநிலையும், மனைவி/கணவன் என்ற சொற்களும் இங்கு ஆண் நபரையே குறிக்கின்றன.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: தனக்கே உரிய மனைவியை
  rationale: திருமண இணைச்சூழலில் γυνή என்பதற்கு ‘மனைவி’ என்பதே இயல்பான பொருள். ἑαυτοῦ காட்டும் தனிப்பட்ட உரிமை/உறவை ‘தனக்கே உரிய’ வெளிப்படுத்துகிறது.
- source_word: ἐχέτω
  choice: கொண்டிருக்கட்டும்
  rationale: மூன்றாம் நபர் நிகழ்காலக் கட்டளை வடிவின் அறிவுறுத்தும் வலிமையை இது காக்கிறது. ‘திருமணம் செய்துகொள்ளட்டும்’ அல்லது ‘தாம்பத்தியக் கடமையை நிறைவேற்றட்டும்’ என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: καὶ ἑκάστη
  choice: ஒவ்வொரு பெண்ணும்
  rationale: முதல் கூறிலுள்ள பகிர்ந்தளிக்கும் அமைப்புக்கு இணையாகப் பெண்பால் வடிவைத் தெளிவாக வழங்குகிறது.
- source_word: τὸν ἴδιον ἄνδρα
  choice: தனக்கே உரிய கணவனை
  rationale: திருமணச் சூழலில் ἀνήρ என்பது ‘கணவன்’ என்று பொருள்படும்; ἴδιον காட்டும் தனிப்பட்ட உறவை ‘தனக்கே உரிய’ காக்கிறது.
theological_decisions:
- issue: இந்த வசனம் பாலியல் பாவத்தைத் தவிர்ப்பதற்காகத் திருமணம் செய்யுமாறு கூறுகிறதா, அல்லது திருமண உறவைப் பற்றிய அறிவுறுத்தலா?
  choice: மூலத்தின் ‘கொண்டிருக்கட்டும்’ என்ற நேரடியான அறிவுறுத்தலைக் காத்து, ஒவ்வோர் ஆணும் பெண்ணும் தமக்கே உரிய வாழ்க்கைத்துணையைக் கொண்டிருப்பதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘திருமணம் செய்துகொள்ளட்டும்’ அல்லது ‘தாம்பத்தியக் கடமைகளை நிறைவேற்றட்டும்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கத்தில் திருமணம் செய்துகொள்வதற்கோ தாம்பத்திய உறவுக்கோ உரிய தனிப்பட்ட வினைச்சொல் இல்லை; ἐχέτω என்பது ‘கொண்டிருக்கட்டும்’ என்பதே. ஆகவே பரந்த விளக்கத் தீர்மானத்தை மொழிபெயர்ப்புக்குள் புகுத்தாமல், மூலத்தின் பொருள் இறுக்கத்தையும் சாத்தியமான மறைபொருளையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பாலியல் ஒழுக்கக்கேடுகள்’ என்பது πορνεία என்பதன் பரந்த பொருளையும் மூலத்தின் பன்மையையும் காக்கிறது. இணையான ஆண்–பெண் கூறுகள் தமிழிலும் சமச்சீராக வைக்கப்பட்டுள்ளன.
