  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: ta
  text: சகோதரர்களே[b], ஒவ்வொருவரும் தாம் எந்த நிலையில் அழைக்கப்பட்டாரோ, அதே நிலையில் கடவுளோடு[a] நிலைத்திருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளுக்கு முன்பாக’ அல்லது ‘கடவுளின் முன்னிலையில்.’
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சகோதரர்களே’ என்பது பெண்களையும் உட்படுத்தி, சபையார் அனைவரையும் அழைக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: பகிர்ந்தளிக்கும் ஒருமை அர்த்தத்தைத் தெளிவாகக் காக்கிறது; அறிவுரை சபையிலுள்ள ஒவ்வொரு நபருக்கும் தனித்தனியாகப் பொருந்துகிறது.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: எந்த நிலையில் ... அதே நிலையில்
  rationale: மீண்டும் வரும் ἐν உடன் தொடர்புப்பெயரும் சுட்டுப்பெயரும் ஒருவரின் வாழ்நிலை அல்லது சமூகச் சூழ்நிலையைக் குறிக்கின்றன. ‘எந்த நிலையில் ... அதே நிலையில்’ என்பது கிரேக்க அமைப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ἐκλήθη
  choice: அழைக்கப்பட்டாரோ
  rationale: இறைவினைப் புலப்படுத்தாத கிரேக்கச் செயப்பாட்டு வடிவம் காக்கப்படுகிறது. சூழலில் அழைத்தவர் கடவுள் என்பது இயல்பாகப் புரிந்தாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘கடவுளால்’ என்பது சேர்க்கப்படவில்லை.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: சபையாரை நேரடியாக அழைக்கும் ஆண்பால் பன்மை வடிவத்தைச் சொற்பொருளுக்கு நெருக்கமாகக் காக்கிறது. இங்கு பெண்களும் உட்பட்ட முழுச் சபையும் குறிக்கப்படுவதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: μενέτω
  choice: நிலைத்திருக்கட்டும்
  rationale: தற்போதைய நிலையில் தொடர்ந்து இருப்பதைக் குறிக்கும் கட்டளைப் பொருளைத் தருகிறது; சுற்றியுள்ள பகுதியின் மீளும் கருத்தோடும் ஒத்திருக்கிறது.
- source_word: παρὰ θεῷ
  choice: கடவுளோடு
  rationale: παρά + வேற்றுமை உருபு நெருக்கத்தையோ உறவையோ குறிக்கலாம். ‘கடவுளோடு’ என்பது சுருக்கமான இயல்பான தமிழ்; ‘கடவுளுக்கு முன்பாக’ அல்லது ‘கடவுளின் முன்னிலையில்’ என்ற சாத்தியங்களும் அடிக்குறிப்பில் காக்கப்படுகின்றன.
theological_decisions:
- issue: ‘அழைக்கப்பட்டார்’ என்பதில் கடவுளின் செயற்பாட்டை வெளிப்படையாகச் சேர்ப்பதா
  choice: ‘கடவுளால்’ என்று சேர்க்காமல் செயப்பாட்டு வடிவத்தைத் தக்கவைத்தல்
  alternative: கடவுளால் அழைக்கப்பட்டார்
  rationale: பவுலின் சூழல் கடவுளின் அழைப்பை வலுவாக உணர்த்துகிறது; எனினும் கிரேக்க உரை செய்பவரைப் பெயரிடவில்லை. ஆகவே உள்ளார்ந்த பொருளை வாசகர் சூழலிலிருந்து உணரும்படி மூலத்தின் மறைமுகத்தன்மை காக்கப்படுகிறது.
- issue: கலப்பு பாலினச் சபைக்கு உரிய ἀδελφοί என்பதன் மொழிபெயர்ப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் பன்மை வடிவம் பிரதிநிதித்துவப் பொருளில் காக்கப்படுகிறது; அது பெண்களையும் உட்படுத்தும் சபைமுழுவதற்கான அழைப்பு என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: παρὰ θεῷ என்பதிலுள்ள உறவியல் அல்லது முன்னிலைப் பொருள்
  choice: கடவுளோடு
  alternative: கடவுளுக்கு முன்பாக / கடவுளின் முன்னிலையில்
  rationale: சொற்றொடர் கடவுளுடனான உறவில் வாழ்வதை அல்லது கடவுளின் முன்னிலையில் இருப்பதைச் சுட்டலாம். பிரதான உரையில் சுருக்கமான உறவியல் மொழிபெயர்ப்பு தரப்பட்டு, உண்மையான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘தாம் ... அழைக்கப்பட்டாரோ’ என்ற அமைப்பு ஒவ்வொருவரையும் மரியாதையுடன் குறிப்பிடுகிறது; தேவையற்ற பாலினச் சுட்டலைச் சேர்க்காமல் கிரேக்க ஒருமைத் தனிப்பயன்பாட்டை இயல்பாகக் காக்கிறது.
