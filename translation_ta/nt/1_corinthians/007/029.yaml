id: 1CO.7.29
reference: 1 Corinthians 7:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: ta
  text: 'சகோதரர்களே[a], நான் சொல்வது இதுதான்: காலம் சுருக்கப்பட்டுள்ளது[b]. ஆகவே, இனிமேல் மனைவியுள்ளவர்கள்கூட மனைவி இல்லாதவர்களைப்போல் இருக்க வேண்டும்,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பது ἀδελφοί என்ற கிரேக்க ஆண்பால் பன்மைச் சொல்லின் மொழிபெயர்ப்பு; சூழலுக்கு ஏற்ப இது ஆண்களும் பெண்களும் அடங்கிய சக விசுவாசிகளைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “குறிக்கப்பட்ட காலம் குறுகிவிட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: நான் சொல்வது இதுதான்
  rationale: பவுல் அடுத்து விளக்கப்போகும் கருத்தை அறிமுகப்படுத்தும் சொற்றொடராக, இயல்பான நவீனத் தமிழில் தரப்பட்டுள்ளது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க ஆண்பால் பன்மை வடிவை நேரடியாகப் பேணுகிறது; சூழலில் இது ஆண்களும் பெண்களும் அடங்கிய சக விசுவாசிகளை அழைக்கக்கூடும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ὁ καιρός
  choice: காலம்
  rationale: வெறும் கால அளவை மட்டுமல்லாமல் தீர்மானமான அல்லது குறிக்கப்பட்ட காலத்தையும் குறிக்கக்கூடிய καιρός என்பதன் சுருக்கமான, இயல்பான மொழிபெயர்ப்பு.
- source_word: συνεσταλμένος ἐστίν
  choice: சுருக்கப்பட்டுள்ளது
  rationale: சுருக்கப்பட்டதன் விளைவாக இப்போது நிலவும் நிலையைக் காட்டும் கிரேக்க நிறைவுநிலைச் சுற்றுவடிவைத் தக்கவைக்கிறது.
- source_word: τὸ λοιπὸν
  choice: இனிமேல்
  rationale: மீதமுள்ள காலத்தில் பின்பற்ற வேண்டிய வாழ்க்கை முறையை அறிமுகப்படுத்தும் காலப்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἵνα
  choice: ஆகவே … இருக்க வேண்டும்
  rationale: காலம் சுருக்கப்பட்டிருப்பதையும் தொடர்ந்து வரும் நடைமுறை அறிவுறுத்தலையும் இணைக்கிறது; நோக்கமா விளைவா என்பதை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: மனைவியுள்ளவர்கள்
  rationale: இங்கு γυναῖκας என்பது பொதுவாகப் பெண்களை அல்ல, மனைவிகளைச் சுட்டுகிறது; கிரேக்கச் சொல்லமைப்புடன் நெருக்கமாக உள்ளது.
- source_word: ὡς μὴ ἔχοντες
  choice: மனைவி இல்லாதவர்களைப்போல்
  rationale: ஒப்புமையின் கூர்மையை மென்மைப்படுத்தாமல், தமிழில் குறிப்பு தெளிவாக இருக்க ‘மனைவி’ மீண்டும் சொல்லப்பட்டுள்ளது.
theological_decisions:
- issue: திருமணத்தைப் பற்றிய பவுலின் அறிவுறுத்தலின் மேய்ப்பியல் மற்றும் இறையியல் வலிமை
  choice: மனைவியுள்ளவர்கள் மனைவி இல்லாதவர்களைப்போல் இருக்க வேண்டும் என்று கூற்றை நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘திருமணப் பற்றில்லாமல் வாழ வேண்டும்’ என்று விளக்கமாக மென்மைப்படுத்துதல்
  rationale: இவ்வசனம் சாதாரண சமூக நிலைகளை அவசரமான காலச் சூழலில் ஒப்புமையாகப் பின்னிறுத்துகிறது. திருமணக் கடமைகளை ஒழிப்பதாகவும் வெறும் மனப்பற்றின்மையாகவும் மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் இறையியல் இழுபறியைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனத்தின் கூர்மையான திருமண ஒப்புமையும், காலம் ‘சுருக்கப்பட்டுள்ளது’ என்ற நிறைவுநிலைத் தாக்கமும் பேணப்பட்டுள்ளன.
