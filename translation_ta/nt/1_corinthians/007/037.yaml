- from: ஆனால், எவனொருவன் எந்தக் கட்டாயமும் இல்லாமல்[a], தன் சொந்த விருப்பத்தின்மேல் அதிகாரம் உள்ளவனாய், தன் இருதயத்தில் உறுதியாக நின்று, தன் கன்னியை அப்படியே வைத்திருக்கத் தன் இருதயத்தில் தீர்மானித்திருக்கிறானோ, அவன் நன்றாகச் செய்வான்.[b]
  to: ஆனால், தன் இருதயத்தில் உறுதியாக நிலைத்திருந்து, எந்தக் கட்டாயமும் இல்லாமல்[a], தன் சொந்த விருப்பத்தின்மேல் அதிகாரம் உடையவனாய், தன் இருதயத்தில் இதைத் தீர்மானித்திருக்கிறவனோ—தன் கன்னியை வைத்திருக்க[b]—அவன் நன்றாகச் செய்வான்.
  rationale: திருத்தம் மூலத்தின் கூறுவரிசையை இயன்றவரை மீட்டெடுக்கிறது; ‘அப்படியே’ என்ற மூலத்தில் இல்லாத, தமிழில் முன்னோக்குச் சுட்டி தேவைப்படும் சொல்லை நீக்குகிறது; மேலும் விவாதத்துக்குரிய ‘தன் கன்னி’ சொற்றொடருக்கே அடிக்குறிப்பு b-ஐ நேரடியாக இணைக்கிறது. மகள் அல்லது நிச்சயிக்கப்பட்ட பெண் என்ற எந்த விளக்கமும் முதன்மை உரையில் திணிக்கப்படவில்லை.
