id: 1CO.7.37
reference: 1 Corinthians 7:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: ta
  text: ஆனால், தன் இருதயத்தில் உறுதியாக நிலைத்திருந்து, எந்தக் கட்டாயமும் இல்லாமல்[a], தன் சொந்த விருப்பத்தின்மேல் அதிகாரம் உடையவனாய், தன் இருதயத்தில் இதைத் தீர்மானித்திருக்கிறவனோ—தன் கன்னியை வைத்திருக்க[b]—அவன் நன்றாகச் செய்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்தத் தேவையும் இல்லாமல்.”
    reason: ἀνάγκη என்பதற்கு ‘தேவை’ என்றும் ‘கட்டாயம்/நிர்ப்பந்தம்’ என்றும் பொருள் கொள்ளலாம்.
  - marker: b
    text: “தன் கன்னி” என்பது அவனுடைய கன்னி மகளையோ, அவனுக்கு மணமுடிக்க நிச்சயிக்கப்பட்ட கன்னியையோ குறிக்கலாம்; கிரேக்கச் சொற்றொடரின் குறிப்பு விவாதத்துக்குரியது.
    reason: τὴν ἑαυτοῦ παρθένον என்பதிலுள்ள உண்மையான குறிப்பு-தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: தன் இருதயத்தில் உறுதியாக நின்று
  rationale: நிலைபெற்ற, உறுதியான உள்ளத் தீர்மானத்தைத் தெரிவிக்கும் சொற்றொடர்; கிரேக்கத்தின் நிறைவேற்றுக் கால நுணுக்கத்தையும் ἑδραῖος என்பதன் உறுதித்தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: μὴ ἔχων ἀνάγκην
  choice: எந்தக் கட்டாயமும் இல்லாமல்
  rationale: ἀνάγκη இங்கு தேவை, நிர்ப்பந்தம், கட்டாயம் ஆகிய பொருள்களை ஏற்கக்கூடும். சூழலில் சுதந்திரமாக முடிவெடுப்பதற்கு எதிரான கட்டாயம் என்பதே தெளிவாக இருப்பதால் இத்தேர்வு செய்யப்பட்டது.
- source_word: ἐξουσίαν ... ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: தன் சொந்த விருப்பத்தின்மேல் அதிகாரம் உள்ளவனாய்
  rationale: ἐξουσία என்பதன் அதிகாரம் அல்லது உரிமை என்ற பொருளையும், θέλημα என்பதன் விருப்பம் அல்லது சித்தம் என்ற பொருளையும் அளவுக்கு மீறி விளக்காமல் காக்கிறது.
- source_word: κέκρικεν
  choice: தீர்மானித்திருக்கிறானோ
  rationale: ஏற்கெனவே எடுத்து நிலைபெற்றுள்ள முடிவை நிறைவேற்றுக் காலம் குறிக்கிறது; தமிழ் வினை வடிவம் அந்தத் தொடர்நிலையை வெளிப்படுத்துகிறது.
- source_word: τηρεῖν
  choice: அப்படியே வைத்திருக்க
  rationale: τηρέω என்பதன் ‘காத்தல்/தொடர்ந்து அதே நிலையில் வைத்திருத்தல்’ என்ற பொருளைத் தருகிறது; திருமணமாகாமல் என்ற விளக்கத்தை மூலத்தில் இல்லாதவாறு நேரடியாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: தன் கன்னியை
  rationale: παρθένος என்பதன் நேரடியான பொருளைக் காத்து, அது மகளையா அல்லது மணமுடிக்க நிச்சயிக்கப்பட்ட பெண்ணையா குறிக்கிறது என்ற விவாதத்தை முதன்மை உரையில் தீர்மானிக்காமல் விடுகிறது.
- source_word: καλῶς ποιήσει
  choice: அவன் நன்றாகச் செய்வான்
  rationale: செயல் பாராட்டத்தக்கது அல்லது சரியானது என்பதைத் தெரிவிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான, கண்ணியமான தமிழ் இணை.
theological_decisions:
- issue: τὴν ἑαυτοῦ παρθένον என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘தன் கன்னியை’ என்று தெளிவுபடுத்தாமல் வைத்தல்
  alternative: ‘தன் கன்னி மகளை’ அல்லது ‘தனக்கு மணமுடிக்க நிச்சயிக்கப்பட்ட கன்னியை’
  rationale: இந்தச் சொற்றொடர் தந்தை அல்லது பாதுகாவலரின் முடிவைக் குறிக்கிறதா, மணமுடிக்க நிச்சயிக்கப்பட்ட ஆணின் முடிவைக் குறிக்கிறதா என்பது கிரேக்கத்தில் விவாதத்துக்குரியது. எந்த ஓர் விளக்கத்தையும் உரைக்குள் இறக்காமல் உண்மையான தெளிவின்மையை அடிக்குறிப்பில் காட்டுகிறது.
- issue: τηρεῖν என்பதில் திருமணமாகாத நிலை உட்பொருளா
  choice: ‘அப்படியே வைத்திருக்க’ என்று மொழிபெயர்த்தல்
  alternative: ‘திருமணம் செய்யாமல் வைத்திருக்க’
  rationale: சூழல் திருமணமாகாத நிலையைச் சுட்டினாலும், அந்தச் சொல் மூலத்தில் வெளிப்படையாக இல்லை. ஆகவே தேவையற்ற விளக்க விரிவாக்கத்தைத் தவிர்த்து, வாசிக்கத்தக்க அளவில் நிலையைச் சுட்டும் மொழி பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகமத்துக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. நீளமான கிரேக்க வாக்கியத்தின் நிபந்தனை அமைப்பு தமிழில் இயல்பாக அமைய ‘எவனொருவன் ... அவன்’ வடிவம் பயன்படுத்தப்பட்டது. ‘இருதயம்’ என்ற வேதாகம உருவகம் இருமுறையும் காக்கப்பட்டது; குறிப்பு தெளிவில்லாத ‘தன் கன்னி’ விளக்கமாக மாற்றப்படவில்லை.
