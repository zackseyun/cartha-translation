  naturalness: ‘தன் இருதயத்தில் உறுதியாக நிலைத்திருந்து’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘தன் கன்னியை வைத்திருக்க’ என்பது திட்டமிட்ட நேரடி மொழியாக இருப்பதால் சற்றே அசாதாரணமாகத் தோன்றினாலும், இங்கு மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது; அடிக்குறிப்பு வாசகருக்கு தேவையான விளக்கத்தை அளிக்கிறது.
