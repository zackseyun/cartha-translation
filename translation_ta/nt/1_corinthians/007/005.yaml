review_pass:
  verdict: revise
  source_fidelity: The reciprocal prohibition, qualified mutually agreed temporary exception, purpose of prayer, renewed coming together, and causal connection with Satan's temptation are substantially represented. However, ‘சோதிக்கக்கூடும்’ can naturally mean neutral testing in Tamil and does not adequately convey πειράζῃ here, which denotes temptation toward sin. ‘உங்களுடைய தன்னடக்கமின்மையைப் பயன்படுத்தி’ also adds an instrumental nuance where διὰ τὴν ἀκρασίαν more directly states the reason/circumstance.
  naturalness: The Tamil is generally clear and suitably restrained for the marital context. A semicolon better joins the prohibition to its tightly qualified exception, and ‘சிறிது காலத்துக்கு’ is more idiomatic for a limited period.
  terminology: ‘ஜெபம்,’ ‘சாத்தான்,’ and ‘தன்னடக்கமின்மை’ are appropriate modern Christian Tamil terms. ‘பாவம் செய்யத் தூண்டக்கூடும்’ clarifies the contextually required sense of Satan's tempting without making the marital implication unnecessarily explicit.
  issues:
  - severity: medium
    issue: ‘சோதிக்கக்கூடும்’ is ambiguous for πειράζῃ.
    rationale: In this context Satan is not neutrally testing but tempting believers toward sin. Tamil should make that sense explicit.
  - severity: low
    issue: ‘உங்களுடைய தன்னடக்கமின்மையைப் பயன்படுத்தி’ over-specifies the force of διὰ.
    rationale: The Greek directly gives their lack of self-control as the reason/circumstance for temptation. ‘தன்னடக்கமின்மையின் காரணமாக’ preserves this without adding a means/instrument nuance.
  - severity: low
    issue: The punctuation and temporal expression can more closely reflect the restricted exception.
    rationale: The exception modifies the prohibition; joining it with a semicolon and using ‘சிறிது காலத்துக்கு’ improves flow and precision.
  revised_text: ஒருவருக்கொருவர் மறுக்காதீர்கள்; ஆனால், இருவரும் ஒருமனப்பட்டு, ஜெபத்தில் ஈடுபடுவதற்காகச் சிறிது காலத்துக்கு வேண்டுமானால் விலகியிருக்கலாம். அதன்பின் மீண்டும் ஒன்றுசேருங்கள்; அப்போது, உங்கள் தன்னடக்கமின்மையின் காரணமாகச் சாத்தான் உங்களைப் பாவம் செய்யத் தூண்டக்கூடாது.
  revised_footnotes:
  - marker: a
    text: அல்லது, ‘இருவரின் சம்மதத்துடன்.’
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, ‘மீண்டும் ஒன்றாக இருங்கள்’; இச்சொற்றொடர் கணவன் மனைவியாக இணைந்த வாழ்க்கையை மீண்டும் தொடருவதைக் குறிக்கிறது.
    reason: lexical_alternative
