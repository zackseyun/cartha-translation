revisions:
- from: ஒருவருக்கொருவர் மறுக்காதீர்கள். ஆனால், இருவரும் ஒருமனப்பட்டு[a], சிறிது காலம் ஜெபத்தில் ஈடுபடுவதற்காக வேண்டுமானால் விலகியிருக்கலாம். அதன்பின் மீண்டும் ஒன்றுசேருங்கள்[b]. இல்லையெனில், உங்களுடைய தன்னடக்கமின்மையைப் பயன்படுத்தி சாத்தான் உங்களைச் சோதிக்கக்கூடும்.
  to: ஒருவருக்கொருவர் மறுக்காதீர்கள்; ஆனால், இருவரும் ஒருமனப்பட்டு, ஜெபத்தில் ஈடுபடுவதற்காகச் சிறிது காலத்துக்கு வேண்டுமானால் விலகியிருக்கலாம். அதன்பின் மீண்டும் ஒன்றுசேருங்கள்; அப்போது, உங்கள் தன்னடக்கமின்மையின் காரணமாகச் சாத்தான் உங்களைப் பாவம் செய்யத் தூண்டக்கூடாது.
  rationale: The revision retains the source's modest reference to resumed marital union and its qualified, mutually consensual temporary abstinence for prayer. It distinguishes Satanic temptation from neutral testing and renders the final causal phrase without adding an instrumental interpretation. Footnote markers should be placed after ‘ஒருமனப்பட்டு[a]’ and ‘ஒன்றுசேருங்கள்[b]’ in typesetting.
  reviewer_model: gpt-5.6-terra
