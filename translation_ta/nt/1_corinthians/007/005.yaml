id: 1CO.7.5
reference: 1 Corinthians 7:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: ta
  text: ஒருவருக்கொருவர் மறுக்காதீர்கள்; ஆனால், இருவரும் ஒருமனப்பட்டு, ஜெபத்தில் ஈடுபடுவதற்காகச் சிறிது காலத்துக்கு வேண்டுமானால் விலகியிருக்கலாம். அதன்பின் மீண்டும் ஒன்றுசேருங்கள்; அப்போது, உங்கள் தன்னடக்கமின்மையின் காரணமாகச் சாத்தான் உங்களைப் பாவம் செய்யத் தூண்டக்கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: மறுக்காதீர்கள்
  rationale: திருமணச் சூழலில், வாழ்க்கைத்துணைக்குக் கிடைக்க வேண்டிய நெருக்கத்தை வழங்காமல் இருப்பதைக் குறிக்கிறது. ‘மறுக்காதீர்கள்’ என்பது வணிக மோசடி என்ற தவறான நிழற்பொருளைத் தவிர்த்து, மூலத்தின் அறநெறி வலிமையைப் பேணுகிறது.
- source_word: ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: கணவன், மனைவி இருவருக்கும் சமமாகப் பொருந்தும் பரஸ்பரக் கட்டளையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰ μήτι ἂν
  choice: வேண்டுமானால்
  rationale: முழுமையான விதிவிலக்கை அறிவிப்பதற்குப் பதிலாக, நிபந்தனைக்குட்பட்ட சாத்தியமான விதிவிலக்கை இச்சொல் நடை காட்டுகிறது.
- source_word: ἐκ συμφώνου
  choice: இருவரும் ஒருமனப்பட்டு
  rationale: ஒருதலைப்பட்சமான முடிவல்லாமல், இரு வாழ்க்கைத்துணைகளின் பரஸ்பர ஒப்புதலைத் தெளிவாகக் காட்டுகிறது.
- source_word: πρὸς καιρόν
  choice: சிறிது காலம்
  rationale: விலகியிருப்பது வரையறுக்கப்பட்ட தற்காலிகக் காலத்திற்கு மட்டுமே என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: σχολάσητε
  choice: ஈடுபடுவதற்காக
  rationale: ஒரு செயலுக்காகத் தம்மை விடுவித்து அதில் கவனம் செலுத்தும் பொருளைத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: τῇ προσευχῇ
  choice: ஜெபத்தில்
  rationale: ஜெபம் என்னும் நடைமுறையில் கவனம் செலுத்துவதை இயல்பான நவீன கிறிஸ்தவத் தமிழில் குறிக்கிறது.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: மீண்டும் ஒன்றுசேருங்கள்
  rationale: திருமண வாழ்க்கையையும் உடலுறவையும் மீண்டும் தொடரும் உட்பொருளை, மூலத்தில் உள்ள மரியாதையான மறைமுக நடையைப் பேணி வழங்குகிறது.
- source_word: πειράζῃ
  choice: சோதிக்கக்கூடும்
  rationale: சாத்தான் பாவத்திற்கு இழுக்கும் சோதனையைச் சுட்டுகிறது; தமிழில் ‘சோதித்தல்’ சூழலால் இந்த எதிர்மறைப் பொருளைப் பெறுகிறது.
- source_word: Σατανᾶς
  choice: சாத்தான்
  rationale: தனிப்பட்ட பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: ἀκρασίαν
  choice: தன்னடக்கமின்மை
  rationale: குறிப்பாக பாலியல் சூழலில் தன்னைக் கட்டுப்படுத்த இயலாத நிலையைக் குறிக்கும் சுருக்கமான, தெளிவான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: πάλιν ἐπὶ τὸ αὐτὸ ἦτε என்பது உடலுறவை மீண்டும் தொடங்குவதை வெளிப்படையாகச் சொல்ல வேண்டுமா, அல்லது பொதுவாக மீண்டும் ஒன்றுசேர்வதாக மொழிபெயர்க்க வேண்டுமா?
  choice: ‘மீண்டும் ஒன்றுசேருங்கள்’ என்று மொழிபெயர்த்து, திருமண மற்றும் பாலியல் உட்பொருளைச் சூழல் உணர்த்தும்படி விடப்பட்டது.
  alternative: ‘மீண்டும் உடலுறவு கொள்ளுங்கள்’ அல்லது ‘மீண்டும் ஒன்றாக இருங்கள்.’
  rationale: கிரேக்கச் சொற்றொடர் திருமண இணைவை, பெரும்பாலும் உடலுறவையும், சுட்டினாலும் அதை மரியாதையான மறைமுக மொழியில் கூறுகிறது. அதே மறைமுகத்தன்மையைத் தமிழ் மொழிபெயர்ப்பு பேணுகிறது.
- issue: ὁ Σατανᾶς என்பதை ஒரு தனிப்பட்ட தீய ஆளைக் குறிக்கும் பெயராக வழங்குவதா, அல்லது பொதுவான ‘எதிரி’ என்று வழங்குவதா?
  choice: ‘சாத்தான்’ என்ற தனிப்பட்ட பெயராக வழங்கப்பட்டது.
  alternative: ‘எதிரி.’
  rationale: இங்கு பவுலின் பயன்பாடு ஓர் அருவமான எதிர்ப்புச் சக்தியையல்ல, சாத்தான் எனப்படும் தனிப்பட்ட ஆளையே குறிக்கிறது.
- issue: சாத்தானின் சோதனைக்கும் தன்னடக்கமின்மைக்கும் இடையிலான διὰ தொடர்பை எவ்வாறு காட்டுவது?
  choice: ‘உங்களுடைய தன்னடக்கமின்மையைப் பயன்படுத்தி’ என்று காரணத்தையும் வாய்ப்பையும் உள்ளடக்கிய வகையில் வழங்கப்பட்டது.
  alternative: ‘உங்களுடைய தன்னடக்கமின்மையின் காரணமாக.’
  rationale: διὰ τὴν ἀκρασίαν காரணத்தைக் காட்டலாம்; இச்சூழலில் அந்தக் குறைபாடு சாத்தானின் சோதனைக்கு வாய்ப்பாக அமைகிறது. தேர்ந்த நடை மனிதப் பொறுப்பையும் சாத்தானின் செயலையும் ஒன்றை ஒன்று நீக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதையான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. திருமண உடலுறவைப் பற்றிய மூலத்தின் மறைமுகமான கண்ணியமான நடை பேணப்பட்டுள்ளது; அதேவேளையில் பரஸ்பர ஒப்புதல் தெளிவுபடுத்தப்பட்டுள்ளது.
