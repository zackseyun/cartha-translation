id: 1CO.7.9
reference: 1 Corinthians 7:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: ta
  text: ஆனால், அவர்கள் தன்னடக்கத்தைக் கடைப்பிடிக்காவிட்டால், அவர்கள் திருமணம் செய்துகொள்ளட்டும்; ஏனெனில், எரிவதைவிட[a] திருமணம் செய்துகொள்வது நல்லது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் வெறுமனே, “எரிவதைவிட” என்று உள்ளது. இச்சூழலில் இது பெரும்பாலும் பாலியல் வேட்கையால் எரிவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: தங்களைக் கட்டுப்படுத்திக்கொள்ள
  rationale: இச்சொல் தன்னடக்கத்தைக் கடைப்பிடிப்பதைக் குறிக்கிறது; சுற்றியுள்ள பாலியல் மற்றும் திருமணச் சூழலில், இயல்பான நவீன தமிழில் இதைத் தெளிவாகச் சொல்கிறது.
- source_word: γαμησάτωσαν
  choice: அவர்கள் திருமணம் செய்துகொள்ளட்டும்
  rationale: மூன்றாம் நபர் பன்மை கட்டளை வடிவத்தின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: κρεῖττον
  choice: நல்லது
  rationale: ஒப்பீட்டுப் பொருளில் ‘மேலானது’ என்றும் கூறலாம்; இவ்வாக்கிய அமைப்பில் ‘...விட ... நல்லது’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: γαμῆσαι
  choice: திருமணம் செய்துகொள்வது
  rationale: கிரேக்க இறப்பில்லா வினை வடிவத்தின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: πυροῦσθαι
  choice: எரிந்துகொண்டிருப்பது
  rationale: கிரேக்கத்தில் வெளிப்படையாக இருப்பது ‘எரிதல்’ என்ற உருவகம் மட்டுமே. பாலியல் வேட்கை என்பது உடனடிச் சூழலால் வலுவாக உணர்த்தப்பட்டாலும், அதை முதன்மை உரையில் சேர்க்காமல் உருவகத்தையும் அதன் மறைபொருளையும் தக்கவைக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள மென்மையான மாறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: πυροῦσθαι என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘எரிந்துகொண்டிருப்பது’ என்ற உருவகத்தைத் தக்கவைத்தல்; அடிக்குறிப்பில் பாலியல் வேட்கையைக் குறிப்பிடுதல்
  alternative: ‘காம வேட்கையால் எரிவது’ என்று முதன்மை உரையிலேயே வெளிப்படுத்துதல்; அல்லது நியாயத்தீர்ப்பில் எரிதல் என்று புரிந்துகொள்ளுதல்
  rationale: தன்னடக்கம் மற்றும் திருமணம் பற்றிய உடனடிச் சூழல் பாலியல் வேட்கையையே பெரிதும் சுட்டுகிறது. எனினும், கிரேக்கச் சொல் அந்தப் பொருளை நேரடியாகச் சேர்க்காமல் ‘எரிதல்’ என்ற உருவகமாக உள்ளது; ஆகவே அதன் உண்மையான சொற்பொருள் சார்ந்த மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தங்களைக் கட்டுப்படுத்திக்கொள்ள’ என்பது இயல்பான மொழிநடையையும் தன்னடக்கம் என்ற கருத்தையும் இணைக்கிறது; ‘எரிந்துகொண்டிருப்பது’ மூலத்தின் உருவகத்தையும் மறைமுகத்தன்மையையும் பாதுகாக்கிறது.
