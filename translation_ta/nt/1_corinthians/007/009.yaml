  verdict: revise
  source_fidelity: The draft correctly preserves the third-person plural imperative ('let them marry') and the deliberately unqualified metaphor πυροῦσθαι ('to burn'). However, 'தங்களைக் கட்டுப்படுத்திக்கொள்ள முடியாவிட்டால்' adds an ability/inability nuance not directly stated by ἐγκρατεύονται, which denotes exercising self-control.
  naturalness: The register is generally clear and modern. 'தன்னடக்கத்தைக் கடைப்பிடிக்காவிட்டால்' is more idiomatic and closer in force than the longer reflexive expression. 'எரிவதைவிட' is natural, concise, and retains the Greek metaphor without introducing an unnecessary continuous aspect.
  terminology: '''தன்னடக்கம்,'' ''திருமணம் செய்துகொள்ளட்டும்,'' and ''எரிவது'' appropriately convey the key terms. The footnote should not begin with ''அல்லது'' when the main text already has the direct, literal wording; it should instead explain the contextual implication.'
  issues:
  - severity: medium
    issue: The phrase 'முடியாவிட்டால்' introduces inability.
    rationale: The Greek says 'if they do not exercise self-control,' not explicitly 'if they are unable to control themselves.' The revised wording maintains the source's less specified formulation.
  - severity: low
    issue: The footnote's opening 'அல்லது' is ill-fitted to the main text.
    rationale: The main text already translates πυροῦσθαι as 'to burn.' The note is explanatory, identifying the likely contextual sense, rather than offering a textual alternative to a more explicit main rendering.
