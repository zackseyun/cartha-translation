reference: 1 Corinthians 7:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: ta
  text: ஆகவே, தனக்குரிய கன்னிப் பெண்ணைத் திருமணம் செய்துகொடுப்பவர் நல்லது செய்கிறார்; அவளைத் திருமணம் செய்துகொடுக்காதவர் அதைவிட நல்லது செய்வார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் கன்னியான வருங்கால மனைவியைத் திருமணம் செய்துகொள்பவர் நல்லது செய்கிறார்; அவளைத் திருமணம் செய்துகொள்ளாதவர் அதைவிட நல்லது செய்வார்.” அந்தப் பெண் அவருடைய கன்னி மகள் என்பது மற்றொரு பொதுவான விளக்கம். இங்குள்ள கிரேக்க வினைச்சொல் இயல்பாகவே “திருமணம் செய்துகொடுத்தல்” என்று பொருள்படுவதால், முதன்மை உரை அந்தப் பொருளைப் பேணுகிறது; ஆனால் அந்தப் பெண்ணுக்கும் அவருக்கும் உள்ள துல்லியமான உறவைக் குறிப்பிடாமல் விடுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து பெறப்படும் முடிவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: γαμίζων
  choice: திருமணம் செய்துகொடுப்பவர்
  rationale: γαμίζω என்பதன் காரணவினைப் பொருளான ‘திருமணம் செய்துகொடுத்தல்’ என்பதைப் பேணுகிறது; அதை γαμέω என்ற ‘திருமணம் செய்தல்’ என்பதோடு ஒன்றாக்கவில்லை.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: தனக்குரிய கன்னிப் பெண்ணை
  rationale: παρθένος என்பதன் ‘கன்னிப் பெண்’ என்ற பொருளையும் ἑαυτοῦ காட்டும் அவருடனான உறவையும் பேணுகிறது; அந்தப் பெண் மகளா, பாதுகாப்பில் உள்ளவரா, மணவுறுதி செய்யப்பட்டவரா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
- source_word: καλῶς ποιεῖ
  choice: நல்லது செய்கிறார்
  rationale: செயல் நல்லது என்ற மதிப்பீட்டை இயல்பாகத் தெரிவிக்கிறது; இதை முழுமையான கட்டளையாக மாற்றவில்லை.
- source_word: μὴ γαμίζων
  choice: அவளைத் திருமணம் செய்துகொடுக்காதவர்
  rationale: முந்தைய γαμίζων என்பதுடன் ஒரே காரணவினைப் பொருளைப் பேணுகிறது; ‘அவளை’ என்பது முந்தைய செயப்படுபொருளைத் தமிழில் தெளிவாகத் தொடர்கிறது.
- source_word: κρεῖσσον ποιήσει
  choice: அதைவிட நல்லது செய்வார்
  rationale: κρεῖσσον என்பது ஒப்பீட்டுப் படி என்பதால் ‘மிகச் சிறந்தது’ என்று மிகைப்படுத்தாமல், இரண்டு தெரிவுகளுக்கிடையிலான ஒப்பீட்டைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘தனக்குரிய கன்னிப் பெண்’ என்பவர் யார், γαμίζω எந்தப் பொருளில் வருகிறது?
  choice: முதன்மை உரையில் γαμίζω என்பதன் காரணவினைப் பொருளான ‘திருமணம் செய்துகொடுத்தல்’ பேணப்படுகிறது; அந்தக் கன்னிப் பெண்ணுடனான துல்லியமான உறவு குறிப்பிடப்படவில்லை.
  alternative: ‘தன் கன்னியான மணவுறுதி செய்யப்பட்ட பெண்ணைத் திருமணம் செய்துகொள்பவர் நல்லது செய்கிறார்; அவளைத் திருமணம் செய்துகொள்ளாதவர் அதைவிட நல்லது செய்வார்.’ மற்றொரு பொதுவான விளக்கம், அந்தப் பெண் அவருடைய கன்னி மகள் என்பதாகும்.
  rationale: 1 கொரிந்தியர் 7:36–38 ஒரு நன்கு அறியப்பட்ட விளக்கச் சிக்கலைக் கொண்டுள்ளது. γαμίζω பொதுவாக ‘திருமணம் செய்துகொடுத்தல்’ என்ற காரணவினைப் பொருளை ஆதரிக்கிறது; ஆனால் கன்னிப் பெண்ணின் சமூக உறவு விவாதத்திற்குரியது. ஆகவே கிரேக்கம் நேரடியாகக் கூறுவதைவிடக் கூடுதலான ஒரு குறிப்பிட்ட குடும்ப அல்லது சமூக அமைப்பை முதன்மை உரை திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தனக்குரிய’ என்பது உரிமைப் பொருளை அளவுக்கு மீறி வலியுறுத்தாமல் உறவைக் குறிக்கிறது; ‘திருமணம் செய்துகொடுத்தல்’ காரணவினையை இயல்பான தமிழில் பேணுகிறது.
