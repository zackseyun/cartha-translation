id: 1CO.7.25
reference: 1 Corinthians 7:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: ta
  text: கன்னிப் பெண்களைக் குறித்து[a], ஆண்டவரிடமிருந்து எனக்கு எந்தக் கட்டளையும் இல்லை. ஆனால், ஆண்டவரால் இரக்கம் பெற்று நம்பிக்கைக்குரியவனாக[c] இருக்கிற நான், என் கருத்தைச் சொல்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “திருமணமாகாத பெண்கள்”; சூழலைச் சிலர் புரிந்துகொள்வதன்படி, “கன்னியராகிய மகள்கள்.” கிரேக்க மொழியில் “கன்னியர்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “என் மதிப்பீட்டை” அல்லது “என் ஆலோசனையை.” ஆண்டவரிடமிருந்து வந்த நேரடிக் “கட்டளை”க்கும் தான் பரிசீலித்துச் சொல்லும் கருத்துக்கும் இடையே பவுல் வேறுபாடு காட்டுகிறார்.
    reason: alternative_reading
  - marker: c
    text: அல்லது “உண்மையுள்ளவனாக.” கிரேக்கச் சொல் “உண்மையுள்ள” அல்லது “நம்பிக்கைக்குரிய” என்ற இரு பொருள்களையும் தரலாம்; இங்கு ஆண்டவரின் இரக்கத்தால் தான் நம்பகமான வழிகாட்டியாக இருப்பதைப் பவுல் சுட்டுவதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: குறித்து
  rationale: ஒரு புதிய பொருளை அறிமுகப்படுத்தும் பவுலின் வழக்கமான சொற்றொடர். மூலத்தில் காலத்தைக் குறிக்கும் ‘இப்போது’ என்ற தனிச்சொல் இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: τῶν παρθένων
  choice: கன்னிப் பெண்கள்
  rationale: παρθένος என்பதன் அடிப்படைப் பொருள் கன்னி, பொதுவாகத் திருமணமாகாத இளம் பெண். சூழலில் யாரைக் குறிக்கிறது என்பது விவாதத்திற்குரியதால் முதன்மைப் பொருளை உரையில் வைத்திருக்கிறது.
- source_word: ἐπιταγὴν κυρίου
  choice: ஆண்டவரிடமிருந்து ... கட்டளை
  rationale: ἐπιταγή என்பது ஆணை அல்லது கட்டளை. ‘ஆண்டவரிடமிருந்து’ என்பது அந்தக் கட்டளையின் மூலத்தையும் அதிகாரத்தையும் தெளிவாக்குகிறது.
- source_word: γνώμην δὲ δίδωμι
  choice: ஆனால் ... என் கருத்தைச் சொல்கிறேன்
  rationale: γνώμη என்பது சிந்தித்துத் தெரிவிக்கப்படும் கருத்து அல்லது மதிப்பீடு. இயல்பான தமிழுக்காக δίδωμι என்பதைக் ‘சொல்கிறேன்’ என மொழிபெயர்த்தாலும், நேரடியான ஆண்டவரின் கட்டளைக்கும் பவுலின் பரிசீலித்த கருத்துக்கும் உள்ள வேறுபாடு காக்கப்படுகிறது.
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: ஆண்டவரால் இரக்கம் பெற்று
  rationale: நிறைவேற்றப்பட்ட செயப்பாட்டு வினையெச்சம், பவுல் ஆண்டவரிடமிருந்து இரக்கம் பெற்றுள்ள நிலையைச் சுட்டுகிறது.
- source_word: πιστὸς εἶναι
  choice: நம்பிக்கைக்குரியவனாக இருக்கிற
  rationale: πιστός என்பதற்கு ‘உண்மையுள்ள’ அல்லது ‘நம்பிக்கைக்குரிய’ என இரு பொருள்கள் இருக்கலாம். இங்கு தன் கருத்தை வழங்குவதற்கான நம்பகத்தன்மையைப் பவுல் சுட்டுவதால் ‘நம்பிக்கைக்குரியவன்’ இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ஆண்டவரின் நேரடிக் கட்டளைக்கும் பவுலின் கருத்துக்கும் உள்ள உறவு
  choice: இந்த விஷயத்தில் ஆண்டவரிடமிருந்து நேரடிக் கட்டளை தன்னிடம் இல்லை என்று பவுல் கூறி, அதே சமயம் ஆண்டவரின் இரக்கத்தால் நம்பிக்கைக்குரியவனாகத் தனது கருத்தை வழங்குகிறார்.
  alternative: இது அதிகாரமற்ற தனிப்பட்ட அபிப்பிராயம் மட்டுமே; அல்லது இயேசுவின் அறியப்படாத ஒரு கட்டளையைப் பவுல் மறைமுகமாக மேற்கோள் காட்டுகிறார்.
  rationale: ἐπιταγή மற்றும் γνώμη இடையிலான வேறுபாட்டை மொழிபெயர்ப்பு காக்கிறது. பவுலின் வார்த்தைகளை நேரடியான ஆண்டவரின் கட்டளையாக உயர்த்தாமலும், வெறும் தனிப்பட்ட அபிப்பிராயமாகத் தாழ்த்தாமலும் மூலத்தின் இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கன்னிப் பெண்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் இருந்தாலும், சூழல் சார்ந்த மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன. ‘என் கருத்தைச் சொல்கிறேன்’ என்பது தமிழில் இயல்பான வடிவம்; அது சாதாரண, யோசிக்காத அபிப்பிராயம் என்ற எண்ணத்தை உண்டாக்காமல் இருக்க விளக்க அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
