source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: ta
  text: ஏனெனில், அடிமையாக இருந்தபோது ஆண்டவருக்குள் அழைக்கப்பட்டவர் ஆண்டவரின் விடுதலை பெற்றவர்[a]; அதுபோலவே, சுதந்திரராக இருந்தபோது அழைக்கப்பட்டவர் மெசியாவின் அடிமை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆண்டவரின் சுதந்திரமானவர்.’ கிரேக்கச் சொல் பொதுவாகச் சுதந்திரமான ஒருவரை அல்ல, அடிமைத்தனத்திலிருந்து விடுவிக்கப்பட்ட ஒருவரைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: அடிமை
  rationale: இச்சொல் கட்டுப்பட்ட சமூக நிலையைச் சுட்டுகிறது. பவுல் அமைக்கும் ‘அடிமை—விடுதலை பெற்றவர்’ என்ற கூர்மையான முரண்பாட்டைப் பாதுகாக்க, மென்மையான ‘ஊழியர்’ என்பதற்குப் பதிலாக ‘அடிமை’ பயன்படுத்தப்பட்டது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் பயன்பாட்டில் காணப்படும் ஆண்டவருடனான ஒன்றிப்பையும் அவர் ஆளுகைக்குட்பட்ட வாழ்வின் தளத்தையும் தீர்மானித்துவிடாமல் பாதுகாக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: κληθεὶς
  choice: அழைக்கப்பட்டவர்
  rationale: இறை அழைப்பைக் குறிக்கும் இறந்தகாலச் செயப்பாட்டு வினையெச்சத்தின் பொருளைப் பாதுகாக்கிறது; தமிழில் இரு இணையான பகுதிகளிலும் இயல்பாக அமைகிறது.
- source_word: ἀπελεύθερος
  choice: விடுதலை பெற்றவர்
  rationale: பொதுவாகச் சுதந்திரமான ஒருவரை அல்ல, அடிமைத்தனத்திலிருந்து விடுவிக்கப்பட்டவரை இச்சொல் குறிப்பாகக் குறிக்கிறது. ‘விடுதலை பெற்றவர்’ என்பது அந்த முன்நிலையையும் மாற்றத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κυρίου
  choice: ஆண்டவரின்
  rationale: உரிமை அல்லது உறவைக் காட்டும் கிரேக்க உடைமை வேற்றுமையை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ὁμοίως
  choice: அதுபோலவே
  rationale: வசனத்தின் இரண்டு எதிரிணையான பகுதிகளுக்கிடையேயுள்ள சமச்சீரான ஒப்புமையைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἐλεύθερος
  choice: சுதந்திரராக
  rationale: சட்டத்திலும் சமூக நிலையிலும் அடிமையல்லாதவரைக் குறிக்கும் சொல்லாக இருந்து, ‘அடிமை’ என்பதுடனான எதிர்மறை இணைப்பைப் பாதுகாக்கிறது.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός இங்கு அபிஷேகம் செய்யப்பட்ட அரசருக்குரிய பட்டமாகச் செயல்படுவதால், பட்டத்தின் பொருளைத் தெளிவாகக் காட்ட ‘மெசியா’ பயன்படுத்தப்பட்டது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இங்கு வெறும் மனித எஜமானைக் காட்டிலும் உயர்த்தப்பட்ட இயேசுவுக்குரிய இறையியல் எடையுள்ள பட்டமாக இருப்பதால் ‘ஆண்டவர்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: சமூக நிலைக்கும் மெசியாவுடனான உறவுக்கும் இடையிலான முரண்பாடு
  choice: அடிமையாக அழைக்கப்பட்டவர் ஆண்டவரின் விடுதலை பெற்றவர்; சுதந்திரராக அழைக்கப்பட்டவர் மெசியாவின் அடிமை என்ற கூர்மையான தலைகீழ் மாற்றத்தைப் பாதுகாத்தல்
  alternative: δοῦλος என்பதை ‘ஊழியர்’ என மென்மைப்படுத்துதல் அல்லது ἀπελεύθερος என்பதைப் பொதுவான ‘சுதந்திரமானவர்’ எனக் கூறுதல்
  rationale: உலகியலான சமூக நிலையை ஆண்டவர் தம்மோடு கொண்டுவரும் புதிய உறவு சார்பாக்குகிறது என்பதே பவுலின் நோக்கமுள்ள முரண்பாடு. இரு சொற்களில் எதையும் மென்மைப்படுத்துவது அதன் வலிமையைக் குறைக்கும்.
- issue: Χριστοῦ என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு Χριστός அபிஷேகம் செய்யப்பட்ட அரசருக்குரிய பட்டமாகச் செயல்படுகிறது. ‘மெசியா’ அந்தப் பட்டத்தன்மையை வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: ἐν κυρίῳ என்பதன் உறவு சார்ந்த தெளிவின்மை
  choice: ஆண்டவருக்குள்
  alternative: ஆண்டவரால் அல்லது ஆண்டவருக்குச் சொந்தமானவராக
  rationale: கிரேக்கச் சொற்றொடர் ஒன்றிப்பு, வாழ்வின் தளம் அல்லது உறவு ஆகிய நுணுக்கங்களைத் தாங்கக்கூடும். ‘ஆண்டவருக்குள்’ அவற்றில் ஒன்றை மட்டும் இறுதியாகத் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதவாக்கியத்துக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அடிமை’ என்ற கடினமான சொல் நோக்கமுடன் இருமுறையும் தக்கவைக்கப்பட்டது; பாலினத்தைத் தேவையின்றி முன்வைக்காமல் கிரேக்க ஒருமை பிரதிநிதித்துவமாக மொழிபெயர்க்கப்பட்டது.
