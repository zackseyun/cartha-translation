source:
  edition: SBLGNT
  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: ta
  text: ஆனால், அவள் அப்படியே இருந்தால், என் கருத்தின்படி இன்னும் மகிழ்ச்சியாக இருப்பாள்[a]. எனக்கும் கடவுளின் ஆவி உண்டு என்று நினைக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இன்னும் ஆசீர்வதிக்கப்பட்டவளாக இருப்பாள்’ என்றும் மொழிபெயர்க்கலாம். μακαριωτέρα என்ற கிரேக்க ஒப்பீட்டுச் சொல் அதிக மகிழ்ச்சியையும் அதிக ஆசீர்வாதம் பெற்ற நிலையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: இன்னும் மகிழ்ச்சியாக
  rationale: μακάριος என்பதன் ஒப்பீட்டு வடிவம். இங்கு பவுல் நடைமுறை சார்ந்த மேய்ப்புப் பரிந்துரையில் இரு நிலைகளை ஒப்பிடுவதால், இயல்பான நவீனத் தமிழில் ‘இன்னும் மகிழ்ச்சியாக’ என்பது முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது; ‘இன்னும் ஆசீர்வதிக்கப்பட்டவளாக’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐὰν οὕτως μείνῃ
  choice: அவள் அப்படியே இருந்தால்
  rationale: μένω என்பது ‘நிலைத்திரு/அப்படியே இரு’ என்றும், οὕτως என்பது முன்பு பேசப்பட்ட கணவனை இழந்த நிலையில் தொடர்வதையும் சுட்டுகிறது. சூழல் தருவதைவிட அதிகமாக விளக்காமல் பின்னோக்கிய சுட்டலைப் பேணுகிறது.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: என் கருத்தின்படி
  rationale: γνώμη இங்கு சிந்தித்து வழங்கப்படும் கருத்தையோ மதிப்பீட்டையோ குறிக்கிறது. ‘என் கருத்தின்படி’ என்பது இது ஆண்டவரிடமிருந்து நேரடியாக மேற்கோள் காட்டப்படும் கட்டளை அல்ல, பவுலின் பரிசீலித்த அறிவுரை என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δοκῶ
  choice: நினைக்கிறேன்
  rationale: δοκέω இங்கு பணிவான சொல்லமைப்பில் உண்மையான உறுதியை வெளிப்படுத்துகிறது. ‘நினைக்கிறேன்’ அதன் சொல்லாட்சிப் பணிவைப் பேணுகிறது; தேவையற்ற ஐயத்தையும் சேர்ப்பதில்லை.
- source_word: κἀγὼ
  choice: எனக்கும்
  rationale: κἀγώ என்பது ‘நானும்’ அல்லது ‘எனக்கும்’ என்ற சேர்க்கை அழுத்தத்தைக் கொண்டது. தமிழில் அடுத்துள்ள ‘உண்டு’ என்பதோடு ‘எனக்கும்’ இயல்பாக இணைந்து, மற்றவர்களுடன் ஒப்பிடும் உட்குறிப்பைப் பேணுகிறது.
- source_word: πνεῦμα θεοῦ
  choice: கடவுளின் ஆவி
  rationale: பவுலின் பயன்பாட்டிலும் இச்சூழலிலும் இச்சொற்றொடர் பொதுவான ஆன்மிக மனப்பான்மையை அல்ல, கடவுளின் பரிசுத்த ஆவியையே சுட்டுகிறது. மூலத்தின் வடிவத்தையும் குறிப்பையும் ‘கடவுளின் ஆவி’ நேரடியாகப் பேணுகிறது.
- source_word: ἔχειν
  choice: உண்டு
  rationale: δοκῶ என்பதன் நிரப்பியாக வரும் ἔχειν எளிமையாக ‘கொண்டிருத்தல்’ என்று பொருள்படும். ‘எனக்கும் ... உண்டு’ என்பது தமிழில் நேரடியும் இயல்பானதுமாக உள்ளது.
theological_decisions:
- issue: πνεῦμα θεοῦ என்பது பரிசுத்த ஆவியைக் குறிக்கிறதா அல்லது பொதுவான ஆன்மிக மனப்பான்மையைக் குறிக்கிறதா?
  choice: ‘கடவுளின் ஆவி’ என்று மொழிபெயர்த்து, பரிசுத்த ஆவியைக் குறிக்கும் தனிப்பட்ட குறிப்பைப் பேணுதல்.
  alternative: ‘கடவுளிடமிருந்து ஒரு ஆவி’ அல்லது ‘தெய்வீக ஆன்மிகப் புரிதல்’.
  rationale: பவுலின் வழக்கமான பயன்பாட்டில் πνεῦμα θεοῦ என்பது கடவுளின் ஆவியைக் குறிக்கிறது. இங்கு தனது அறிவுரைக்கு ஆவியால் வழிநடத்தப்பட்ட நியாயத்தன்மை உண்டு என்று பவுல் கூறுகிறார்; அதேவேளையில் இதை ஆண்டவரின் நேரடிக் கட்டளை என்று உரை மிகைப்படுத்தவில்லை.
- issue: δοκῶ ... πνεῦμα θεοῦ ἔχειν என்பதில் பவுலின் கூற்றின் வலிமை
  choice: சொல்லாட்சியில் பணிவானதாயிருந்தாலும், ஆவியால் வழிநடத்தப்படும் அதிகாரத்தைப் பற்றிய உண்மையான கூற்றாகப் பேணுதல்.
  alternative: தனக்குக் கடவுளின் ஆவி இருக்கிறதா என்ற ஐயத்தை பவுல் வெளிப்படுத்துகிறார் எனப் புரிதல்; அல்லது எதிராளிகளுக்கான நையாண்டி மறுப்பு எனத் தெளிவுபடுத்துதல்.
  rationale: δοκῶ பணிவாக ஒலிக்கலாம்; ஆனால் சூழலில் பவுல் ஆவியின் இருப்பைப் பற்றி ஐயப்படவில்லை. ‘நினைக்கிறேன்’ என்பது மூலத்தின் சொல்லாட்சிப் பணிவை வைத்துக்கொண்டு, கூற்றை வெறும் சந்தேகமாக மாற்றாமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்படியே’ என்பது முந்தைய சூழலில் கூறப்பட்ட கணவனை இழந்த நிலையைச் சுட்டுகிறது; உரையில் இல்லாத ‘விதவையாக’ போன்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை. ‘எனக்கும் ... உண்டு’ என்ற அமைப்பு κἀγώ-வின் சேர்க்கை அழுத்தத்தை இயல்பாகப் பேணுகிறது.
