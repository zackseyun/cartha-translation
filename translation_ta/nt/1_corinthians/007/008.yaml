id: 1CO.7.8
reference: 1 Corinthians 7:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λέγω δὲ τοῖς ἀγάμοις καὶ ταῖς χήραις, καλὸν ⸀αὐτοῖς ἐὰν μείνωσιν ὡς κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: ta
  text: 'திருமணமாகாதவர்களுக்கும்[a] விதவைகளுக்கும் நான் சொல்கிறேன்: அவர்கள் என்னைப் போலவே தொடர்ந்து இருந்தால், அது அவர்களுக்கு நல்லது.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திருமணமாகாத ஆண்களுக்கும்.’ கிரேக்கச் சொல் இங்கு ஆண்பால் பன்மை வடிவில் உள்ளது; ஆனால் அது பொதுவாகத் திருமணமாகாதவர்களைக் குறித்தும் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘நானும் இருப்பதுபோல.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: நான் சொல்கிறேன்
  rationale: δέ இங்கு மெல்லிய தொடர்பைக் காட்டுகிறது; தமிழில் தேவையற்ற எதிர்மறைத் தொனியையோ காலத்தைக் குறிக்கும் ‘இப்போது’ என்பதையோ சேர்க்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: τοῖς ἀγάμοις
  choice: திருமணமாகாதவர்களுக்கும்
  rationale: ἄγαμος என்பது திருமணமாகாத நிலையைக் குறிக்கிறது. கிரேக்க வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், சூழலில் அது பொதுவாகப் பயன்படுத்தப்பட்டிருக்கக்கூடிய வாய்ப்பை இந்தத் தேர்வு திறந்தே வைக்கிறது.
- source_word: ταῖς χήραις
  choice: விதவைகளுக்கும்
  rationale: χήρα என்பது கணவனை இழந்த பெண்ணை, அதாவது விதவையை, குறிப்பாகக் குறிக்கிறது.
- source_word: καλὸν αὐτοῖς
  choice: அது அவர்களுக்கு நல்லது
  rationale: καλόν இங்கு ‘நல்லது’ அல்லது ‘தகுந்தது’ என்ற விரிந்த பொருளைக் கொண்டுள்ளது; ‘மேலானது’ என்ற ஒப்பீட்டுப் பொருளை மூலச்சொல் கட்டாயப்படுத்தவில்லை.
- source_word: ἐὰν μείνωσιν
  choice: அவர்கள் ... தொடர்ந்து இருந்தால்
  rationale: μένω என்பது நீடித்திருத்தல் அல்லது அதே நிலையில் தொடர்ந்திருத்தல் எனப் பொருள்படும்; இங்கு திருமணமாகாத நிலையில் தொடர்வது சூழலால் உணர்த்தப்படுகிறது.
- source_word: ὡς κἀγώ
  choice: என்னைப் போலவே
  rationale: κἀγώ என்பது καὶ ἐγώ (‘நானும்’) என்பதன் சுருக்கம். ‘என்னைப் போலவே’ என்பது தமிழில் இயல்பாக இருந்து பவுலின் தற்போதைய நிலையை ஒப்புமையாகக் காட்டுகிறது.
theological_decisions:
- issue: ἀγάμοις என்பதன் வரம்பு
  choice: பொதுவான ‘திருமணமாகாதவர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘திருமணமாகாத ஆண்கள்’ என்று மொழிபெயர்த்தல்
  rationale: வடிவம் ஆண்பால் பன்மையாக இருந்தாலும் அது ஆண்களை மட்டும் குறிக்கிறதா அல்லது பிரதிநிதித்துவப் பன்மையா என்பது உறுதியாக இல்லை. பொதுவான மொழிபெயர்ப்பு இந்த உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது; அடிக்குறிப்பு வடிவியல் மாற்றைத் தெரிவிக்கிறது.
- issue: καλὸν என்பதன் மதிப்பீட்டு வலிமை
  choice: ‘நல்லது’
  alternative: ‘மேலானது’ அல்லது ‘சிறந்தது’
  rationale: கிரேக்கத்தில் இங்கு ஒப்பீட்டு வடிவம் இல்லை. ஆகவே திருமணமாகாமல் இருப்பது திருமணத்தைவிட கட்டாயமாக மேலானது என்ற வலுவான முடிவை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘தொடர்ந்து இருந்தால்’ என்பது அதே திருமணமாகாத நிலையில் நிலைத்திருப்பதைச் சூழலின் வழியாக உணர்த்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘திருமணமாகாமல்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
