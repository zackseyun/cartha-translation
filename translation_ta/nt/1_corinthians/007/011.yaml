id: 1CO.7.11
reference: 1 Corinthians 7:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: ta
  text: ஆனால் அவள் பிரிந்துபோனால்[a], திருமணம் செய்துகொள்ளாமல் இருக்கட்டும்; அல்லது தன் கணவருடன் சமரசம் செய்துகொள்ளட்டும். மேலும், கணவன் தன் மனைவியை விவாகரத்து செய்யக்கூடாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆனால் அவள் பிரிந்துபோனாலும்கூட” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கத் தொடர் சற்றே விட்டுக்கொடுக்கும் நுணுக்கத்தைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “தன் மனைவியை அனுப்பிவிடக்கூடாது” என்றும் மொழிபெயர்க்கலாம். திருமணச் சூழலில் இவ்வினை பொதுவாக விவாகரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: ஆனால் ... பிரிந்துபோனால்
  rationale: δὲ எதிர்மறைத் திருப்பத்தைச் சுட்டுகிறது; ἐὰν நிபந்தனையைத் தருகிறது. καί-இன் சாத்தியமான விட்டுக்கொடுக்கும் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: χωρισθῇ
  choice: பிரிந்துபோனால்
  rationale: χωρίζω இங்கு வாழ்க்கைத்துணையிடமிருந்து பிரிவதைக் குறிக்கிறது. சட்டரீதியான விவாகரத்தாக மட்டும் பொருளைக் குறுக்காமல், கிரேக்க வினையின் இடை/செயப்பாட்டு சாத்தியத்தையும் அளவுக்கு மீறித் தீர்மானிக்காமல் இச்சொல் இயல்பாகத் தருகிறது.
- source_word: μενέτω ἄγαμος
  choice: திருமணம் செய்துகொள்ளாமல் இருக்கட்டும்
  rationale: μένω-வின் தொடர்ந்திருத்தல் என்ற பொருளையும் ἄγαμος-இன் திருமணமாகாத நிலை என்ற பொருளையும் நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καταλλαγήτω
  choice: ஒப்புரவாகட்டும்
  rationale: செயப்பாட்டு கட்டளையான இச்சொல், கணவருடன் உறவு சீராவதையும் மீண்டும் இணக்கத்திற்கு வருவதையும் சுருக்கமாகவும் இறையியல் பொருளை மிகைப்படுத்தாமலும் தருகிறது.
- source_word: τῷ ἀνδρί
  choice: தன் கணவருடன்
  rationale: திருமணச் சூழலில் ἀνήρ என்பது ‘கணவர்’ என்று பொருள்படும்; தமிழில் உறவை இயல்பாகத் தெளிவுபடுத்த ‘தன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἄνδρα γυναῖκα μὴ ἀφιέναι
  choice: கணவன் தன் மனைவியை விவாகரத்து செய்யக்கூடாது
  rationale: ἀνήρ மற்றும் γυνή இங்கு முறையே கணவன், மனைவி எனப் பொருள்படுகின்றன. μὴ ἀφιέναι தடை/அறிவுறுத்தலைக் குறிக்கிறது; திருமணச் சூழலில் ἀφίημι வாழ்க்கைத்துணையை அனுப்பிவிடுதல், அதாவது விவாகரத்து செய்தல் என்ற வலிமையைக் கொண்டது.
theological_decisions:
- issue: χωρισθῇ மற்றும் ἀφιέναι ஆகிய இரு வேறு வினைகளையும் ஒரே தமிழ்ச் சொல்லால் மொழிபெயர்க்கலாமா?
  choice: முதலாவதை ‘பிரிந்துபோனால்’ என்றும் இரண்டாவதை ‘விவாகரத்து செய்யக்கூடாது’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘விவாகரத்து’ அல்லது இரண்டையும் பொதுவாக ‘பிரிதல்’ என்று மொழிபெயர்த்தல்
  rationale: பவுல் இரு வேறு கிரேக்க வினைகளைப் பயன்படுத்துகிறார். அந்த வேறுபாட்டைப் பாதுகாப்பது, χωρισθῇ மீது சட்டரீதியான துல்லியத்தைத் திணிக்காமல் இருப்பதோடு, ἀφιέναι-இன் திருமண முறிவு சார்ந்த வலிமையையும் தெளிவாகத் தருகிறது.
- issue: χωρισθῇ-இன் செய்பவர்/செயப்படுபவர் நுணுக்கம்
  choice: ‘அவள் பிரிந்துபோனால்’ என்று இயல்பான, அதிகம் தீர்மானிக்காத வடிவைப் பயன்படுத்துதல்
  alternative: ‘அவள் பிரிக்கப்பட்டால்’ அல்லது ‘அவள் விட்டுச் சென்றால்’
  rationale: இவ்வடிவம் இலக்கணரீதியாக இடை அல்லது செயப்பாட்டு நுணுக்கத்தை ஏற்கக்கூடும். சூழலில் மனைவியே உரையாடலின் பொருள்; ஆனால் பிரிவுக்கான காரணத்தையோ சட்டநிலையையோ வசனம் வெளிப்படையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒப்புரவு’ உறவு மீண்டும் சீராவதைச் சுருக்கமாகக் குறிக்கிறது; ‘விவாகரத்து’ நவீன வாசகருக்கு திருமணச் சூழலைத் தெளிவுபடுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் தொடர்புடைய சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
