reference: 1 Corinthians 7:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: ta
  text: எல்லா மனிதர்களும் என்னைப் போலவே இருக்க வேண்டும் என்று நான் விரும்புகிறேன். ஆனாலும், ஒவ்வொருவருக்கும் கடவுளிடமிருந்து அவரவருக்குரிய வரம் உண்டு—ஒருவருக்கு இவ்விதம், மற்றொருவருக்கு அவ்விதம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντας ἀνθρώπους
  choice: எல்லா மனிதர்களும்
  rationale: ἄνθρωπος இங்கு மனிதர்களை பொதுவாகக் குறிக்கிறது; நவீனத் தமிழில் பாலினத்தைத் தேவையின்றிக் குறுக்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: θέλω
  choice: விரும்புகிறேன்
  rationale: பவுலின் தனிப்பட்ட விருப்பத்தை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὡς καὶ ἐμαυτόν
  choice: என்னைப் போலவே
  rationale: உடனுள்ள திருமணம் மற்றும் தன்னடக்கம் பற்றிய சூழலில் பவுலின் நிலையைச் சுட்டுகிறது; அந்த நிலை என்ன என்பதை வசனத்திற்குள் கூடுதலாக விளக்கவில்லை.
- source_word: ἴδιον ἔχει χάρισμα ἐκ θεοῦ
  choice: கடவுளிடமிருந்து தமக்குரிய வரத்தைப் பெற்றிருக்கிறார்கள்
  rationale: ἴδιον என்பதின் தனிப்பட்ட உரிமை/ஒதுக்கீட்டு நுணுக்கத்தையும் χάρισμα என்பதின் அருள்வரப் பொருளையும் இயல்பான தமிழில் தருகிறது; கிரேக்க நிகழ்காலமான ἔχει-ன் நிலையான உடைமையை ‘பெற்றிருக்கிறார்கள்’ வெளிப்படுத்துகிறது.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: ஒருவருக்கு ஒருவிதமாகவும், மற்றொருவருக்கு வேறுவிதமாகவும்
  rationale: இருவருக்கும் மாறுபட்ட வரங்கள் உள்ளன என்ற எதிரிணையைப் பாதுகாக்கிறது; அவை திருமணம் அல்லது மணமின்மை என்று உரையிலேயே வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘என்னைப் போலவே’ என்பதன் குறிப்பிட்ட பொருள்
  choice: அதை விளக்கச் சேர்க்காமல் திறந்தவாறே வைத்தல்
  alternative: ‘திருமணம் செய்யாமல் என்னைப் போலவே’ என்று வெளிப்படுத்துதல்
  rationale: உடனடி சூழல் மணமின்மையையோ தன்னடக்கத்தையையோ சுட்டலாம்; ஆனால் இந்த வசனம் அதைக் குறிப்பாகப் பெயரிடாததால் மூலத்தின் சுருக்கத்தையும் சாத்தியமான நுணுக்கத்தையும் பாதுகாக்கிறது.
- issue: ‘வரம்’ எதைக் குறிக்கிறது
  choice: வரத்தின் வகைகளை பொதுவாகவே வைத்தல்
  alternative: திருமண வரம் மற்றும் மணமின்மை வரம் என்று தெளிவுபடுத்துதல்
  rationale: மூலம் ‘ஒருவருக்கு இவ்விதம், மற்றொருவருக்கு அவ்விதம்’ என்றே கூறுகிறது; குறிப்பிட்ட வகைகளைச் சேர்ப்பது விளக்கவுரையாகிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘ஆனாலும்’ δέ/ἀλλά உருவாக்கும் மாறுபாட்டை இயல்பாகக் காட்டுகிறது. பாலினம் சாராத ‘மனிதர்கள்’ என்பது மூலத்தின் பொதுவான பயன்பாட்டுக்கு ஏற்றது.
