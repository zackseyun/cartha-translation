revisions:
- from: நீ அடிமையாக இருந்தபோது அழைக்கப்பட்டாயா? அதைக் குறித்து கவலைப்படாதே. ஆனால் நீ விடுதலை பெற முடியுமானால், அந்த வாய்ப்பைப் பயன்படுத்திக்கொள்.[a]
  to: நீ அடிமையாக இருந்தபோது அழைக்கப்பட்டாயா? அதைக் குறித்து கவலைப்படாதே. ஆனால், உன்னால் விடுதலை பெற முடிந்தாலும்கூட, அந்த வாய்ப்பைப் பயன்படுத்திக்கொள்வதே மேல்.[a]
  rationale: The revision makes the force of μᾶλλον explicit in natural modern Tamil. It retains the draft’s primary construal that the implied object is the opportunity for freedom, while the anchored footnote preserves the longstanding alternative construal without resolving the ambiguity doctrinally.
