id: 1CO.7.21
reference: 1 Corinthians 7:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: ta
  text: நீ அடிமையாக இருந்தபோது அழைக்கப்பட்டாயா? அதைக் குறித்து கவலைப்படாதே. ஆனால், உன்னால் விடுதலை பெற முடிந்தாலும்கூட, அந்த வாய்ப்பைப் பயன்படுத்திக்கொள்வதே மேல்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் தற்போதைய நிலையையே பயன்படுத்திக்கொள்வதே மேல்,” அதாவது, நீ இருக்கும் நிலையிலேயே இரு. “பயன்படுத்திக்கொள்” என்பதற்கான செயப்படுபொருள் கிரேக்கத்தில் கூறப்படாததால், இச்சொற்றொடர் இரு விதமாகவும் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: அடிமை
  rationale: இச்சூழலில் இது வெறும் பணியாளரை அல்ல, மற்றொருவரின் உடைமையாகக் கட்டுப்பட்டிருந்த சமூக நிலையைக் குறிக்கிறது; விடுதலை பெறுதல் பற்றிய அடுத்த சொற்றொடரும் இதை உறுதிப்படுத்துகிறது.
- source_word: ἐκλήθης
  choice: அழைக்கப்பட்டாயா
  rationale: இறைவனால் அழைக்கப்பட்டதைக் குறிக்கும் பவுலின் வழக்கமான பயன்பாட்டைத் தக்கவைக்கிறது; மூலத்தில் இல்லாத ‘இறைவனால்’ அல்லது ‘விசுவாசத்திற்கு’ என்ற விளக்கத்தை வசனத்தில் சேர்க்கவில்லை.
- source_word: μή σοι μελέτω
  choice: அதைக் குறித்து கவலைப்படாதே
  rationale: அக்கறை அல்லது மனக்கலக்கம் கொள்ள வேண்டாம் என்ற மேய்ப்புப் பண்புள்ள வலியுறுத்தலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐλεύθερος γενέσθαι
  choice: விடுதலை பெற
  rationale: அடிமை நிலையிலிருந்து சுதந்திர நிலைக்கு மாறுவதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: μᾶλλον χρῆσαι
  choice: அந்த வாய்ப்பைப் பயன்படுத்திக்கொள்
  rationale: χρῆσαι என்பதன் பொருள் ‘பயன்படுத்திக்கொள்’; அதன் செயப்படுபொருள் கிரேக்கத்தில் கூறப்படவில்லை. உடனடி சூழலில் விடுதலை பெறும் வாய்ப்பே குறிக்கப்படுவது இயல்பாக இருப்பதால் அது முதன்மை வாசிப்பாகத் தரப்படுகிறது; மாற்று விளக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: μᾶλλον χρῆσαι என்பதிலுள்ள விளக்கத் தெளிவின்மை
  choice: விடுதலை பெறும் வாய்ப்பு கிடைத்தால் அதைப் பயன்படுத்திக்கொள்ளும்படி பவுல் ஊக்குவிக்கிறார்.
  alternative: அடிமையாகிய தற்போதைய நிலையையே பயன்படுத்திக்கொள்; அதாவது, இருக்கும் நிலையிலேயே தொடர்ந்து இரு.
  rationale: χρῆσαι என்பதற்கான செயப்படுபொருள் மூலத்தில் வெளிப்படையாக இல்லை. முந்தைய உடனடி சொற்றொடர் விடுதலை பெறும் வாய்ப்பைச் சுட்டுவதால் முதன்மை வாசிப்பு அதனை எடுத்துக்கொள்கிறது. ஆயினும், தற்போதைய நிலையையே பயன்படுத்துவது என்ற வாசிப்புக்கும் நீண்ட விளக்க மரபு இருப்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான ஒருமை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அடிமை’ என்பது வரலாற்றுச் சமூக நிலையைக் குறிப்பதற்காக நேரடியாகப் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் மறைந்துள்ள செயப்படுபொருளால் உண்டாகும் உண்மையான விளக்கத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
