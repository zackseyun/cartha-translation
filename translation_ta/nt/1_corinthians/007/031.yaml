id: 1CO.7.31
reference: 1 Corinthians 7:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: ta
  text: உலகத்தைப் பயன்படுத்துகிறவர்கள், அதை முழுமையாகப் பயன்படுத்தாதவர்களைப் போல இருக்கட்டும்[a]. ஏனெனில், இவ்வுலகத்தின் தோற்றம்[b] கடந்துபோய்க் கொண்டிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதை முழு அளவில் பயன்படுத்தாதவர்களைப் போல’; இந்த வினைச்சொல் ‘அதைத் தவறாகப் பயன்படுத்தாதவர்களைப் போல’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வெளிப்புற வடிவம்’ அல்லது ‘அமைப்பு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι (χράομαι)
  choice: பயன்படுத்துகிறவர்கள்
  rationale: உலகத்தின் பொருட்களுடனும் அமைப்புடனும் ஈடுபடுவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; பொதுவான ‘பயன்படுத்து’ என்ற பொருளையும் காக்கிறது.
- source_word: τὸν κόσμον
  choice: உலகத்தை
  rationale: இங்கு படைப்புலகை மட்டும் அல்லாமல் தற்போதைய சமூக, பொருள்சார் உலக ஒழுங்கையும் குறிக்கக்கூடிய மூலச்சொல்லின் பரப்பைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: ὡς μὴ καταχρώμενοι
  choice: அதை முழுமையாகப் பயன்படுத்தாதவர்களைப்போல்
  rationale: χράομαι / καταχράομαι ஆகியவற்றுக்கிடையிலான சொல்விளையாட்டையும் வலுப்படுத்தப்பட்ட பொருளையும் காக்கிறது; ‘தவறாகப் பயன்படுத்துதல்’ என்ற ஒரே பொருளுக்குள் வசனத்தைச் சுருக்கவில்லை.
- source_word: παράγει
  choice: கடந்துபோய்க்கொண்டிருக்கிறது
  rationale: நடைபெற்றுக்கொண்டிருக்கும் நிலையற்ற மாற்றத்தை நிகழ்காலத் தொடர்வினை வடிவில் வெளிப்படுத்துகிறது.
- source_word: τὸ σχῆμα τοῦ κόσμου τούτου
  choice: இவ்வுலகத்தின் இப்போதைய வடிவம்
  rationale: σχῆμα என்பதன் வடிவம் அல்லது தற்போதைய அமைப்பு என்ற பொருளையும் τούτου என்பதன் ‘இவ்வுலகம்’ என்ற சுட்டையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: καταχρώμενοι என்பது χρώμενοι என்பதோடு கொண்டுள்ள தொடர்பு
  choice: உலகத்தைப் பயன்படுத்தினாலும் அதை முழுமையாகப் பயன்படுத்தாதவர்களைப்போல் வாழ வேண்டும் என்ற அழைப்பு
  alternative: உலகத்தைத் தவறாகப் பயன்படுத்தக்கூடாது என்ற ஒழுக்கக் கண்டனம்
  rationale: இரு வினைகளுக்கிடையிலான சொல்விளையாட்டு, உலக வாழ்வில் ஈடுபட்டாலும் அதில் முழுமையாக ஆழ்ந்துவிடாத பதற்றத்தை முன்வைக்கிறது. ‘துஷ்பிரயோகம்’ என்று மட்டும் மொழிபெயர்ப்பது பொருளைத் தேவையின்றி குறுக்கும்.
- issue: σχῆμα என்பதன் பொருள்
  choice: இவ்வுலகத்தின் நிலையற்ற தற்போதைய வடிவம் அல்லது அமைப்பு
  alternative: உலகத்தின் வெளித்தோற்றம் மட்டும் அல்லது அதன் அடிப்படை இயல்பு
  rationale: இச்சொல் உலகத்தின் சாராம்சத்தைவிட அதன் தற்போதைய அமைப்பைக் குறிக்கிறது; படைப்பே தீயது என்று கூறாமல் அதன் தற்போதைய ஒழுங்கின் நிலையாமையைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தொடரின் முந்தைய வசனங்களில் உள்ள அறிவுறுத்தல் அமைப்பைத் தமிழில் நிறைவு செய்ய ‘இருக்கட்டும்’ சேர்க்கப்பட்டுள்ளது; மூலத்தில் அது சூழலிலிருந்து புரிந்துகொள்ளப்படும் விடுபட்ட வினையாக உள்ளது.
