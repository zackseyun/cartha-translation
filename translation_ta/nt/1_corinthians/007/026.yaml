source:
  edition: SBLGNT
  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: ta
  text: ஆகவே, இப்போது நிலவும் நெருக்கடியின் காரணமாக[a], ஒருவர்[b] தாம் இருக்கும் நிலையிலேயே இருப்பது[c] நல்லது என்று நான் கருதுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்போது நிலவும் கட்டாய நிலையினால்”; ἀνάγκη என்ற சொல் நெருக்கடி, கட்டாயம் அல்லது தவிர்க்க முடியாத தேவை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு மனிதன்.” கிரேக்கச் சொல் பொதுவாக ஒரு நபரைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், “இவ்வாறு இருப்பது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: நான் கருதுகிறேன்
  rationale: பவுலின் தனிப்பட்ட, சிந்தித்துத் தரப்படும் மதிப்பீட்டை வெளிப்படுத்துகிறது; முழுமையான கட்டளையாக மாற்றவில்லை.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய விவாதத்திலிருந்து வரும் முடிவுத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: நல்லது என்று
  rationale: கிரேக்க முடிவிலி வாக்கிய அமைப்பை இயல்பான தமிழில் கருத்துரைக் கட்டமைப்பாக வழங்குகிறது; καλόν என்பதன் மதிப்பீட்டுப் பொருளை ‘நல்லது’ எனக் காக்கிறது.
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: இப்போது நிலவும் நெருக்கடியின் காரணமாக
  rationale: ἐνεστῶσαν என்பது தற்போது நிலவுவதைச் சுட்டுகிறது; ἀνάγκη என்பதிலுள்ள அவசர அழுத்தம், இடுக்கண், கட்டாய நிலை ஆகிய பொருள் வாய்ப்புகளில் சூழலுக்கு ஏற்ற ‘நெருக்கடி’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: ὅτι
  choice: என்று
  rationale: பவுல் கருதும் கருத்தின் உள்ளடக்கத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: καλὸν
  choice: நல்லது
  rationale: வசனத்தில் மீண்டும் வரும் அதே மதிப்பீட்டுச் சொல்லைத் தக்கவைத்து, ‘பயனுள்ளது’ அல்லது ‘தகுந்தது’ எனப் பொருளைச் சுருக்கவில்லை.
- source_word: ἀνθρώπῳ
  choice: ஒருவர்
  rationale: ἄνθρωπος இங்கு பொதுவாக எந்த மனிதரையும் குறிக்கக்கூடும். நவீன தமிழில் ‘ஒருவர்’ இயல்பாகவும் பாலினத்தைத் தேவையின்றிக் குறுக்காமலும் உள்ளது.
- source_word: τὸ οὕτως εἶναι
  choice: இப்போது இருக்கிற நிலையிலேயே இருப்பது
  rationale: சொல்லுக்கு சொல் ‘இவ்வாறு இருப்பது’ என்றாலும், சூழலில் ஒருவரின் தற்போதைய திருமண நிலையைத் தொடர்வதைக் குறிக்கிறது. ‘இப்போது இருக்கிற நிலையிலேயே இருப்பது’ அந்தக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது; திருமண நிலை என்று உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: பவுலின் கூற்றின் தன்மை
  choice: தற்போது நிலவும் நெருக்கடியை முன்னிட்டு பவுல் தரும் சூழ்நிலை சார்ந்த மதிப்பீடாக மொழிபெயர்க்கப்பட்டது.
  alternative: திருமணத்திற்கு எதிரான எல்லாக் காலத்திற்குமான கட்டளை அல்லது விருப்பத் தீர்ப்பாகப் புரிந்துகொள்வது.
  rationale: ‘நான் கருதுகிறேன்’ என்பதும் ‘இப்போது நிலவும் நெருக்கடியின் காரணமாக’ என்பதும் சூழ்நிலை சார்ந்த ஆலோசனையைச் சுட்டுகின்றன. அதேவேளையில், உரை கூறுவதைத் தாண்டி அதன் வரம்பை விளக்கவுரையாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இப்போது’ இருமுறை வருவது சிறிய மீளுரையாக இருந்தாலும், ἐνεστῶσαν என்பதன் தற்போதைய காலச்சுட்டையும் οὕτως என்பதன் சூழல் சார்ந்த தற்போதைய நிலையையும் தெளிவாக வேறுபடுத்திக் காக்கிறது.
