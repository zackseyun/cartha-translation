reference: 1 Corinthians 7:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: ta
  text: ஒரு பெண்ணுக்கு நம்பிக்கை இல்லாத கணவன் இருக்க, அவன் அவளுடன் வாழச் சம்மதித்தால், அவள் தன் கணவனை விட்டுப் பிரியக்கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் தன் கணவனை விவாகரத்து செய்யக்கூடாது.” ‘விடுதல்’ அல்லது ‘அனுப்பிவிடுதல்’ என்று நேரடியாக மொழிபெயர்க்கக்கூடிய கிரேக்க வினைச்சொல், இங்கு திருமண உறவை முடிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ εἴ τις
  choice: ஒரு பெண்ணுக்கு
  rationale: இது ஒரு பொதுவான நிபந்தனைச் சூழலை அறிமுகப்படுத்துகிறது. திருமண உறவு அடுத்துள்ள ‘கணவன்’ என்பதால் தெளிவாகிறது; நவீன தமிழில் ‘ஒரு பெண்ணுக்கு ... கணவன் இருந்து’ என்பது இயல்பானது.
- source_word: ἄνδρα ἄπιστον
  choice: நம்பிக்கை இல்லாத கணவன்
  rationale: இங்கு ἀνήρ திருமணச் சூழலில் ‘கணவன்’ என்று பொருள்படுகிறது. ἄπιστος கிறிஸ்தவ நம்பிக்கையைப் பகிராதவரைக் குறிக்கிறது; ‘விசுவாசமற்ற’ என்பது திருமணத் துரோகத்தைக் குறிக்கும் தவறான எண்ணத்தை உண்டாக்கக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: οὗτος συνευδοκεῖ
  choice: அவன் ... சம்மதித்தால்
  rationale: οὗτος முன் குறிப்பிடப்பட்ட கணவனைக் குறிக்கிறது; συνευδοκεῖ மனமுவந்த ஒப்புதலைக் குறிக்கிறது. ‘சம்மதித்தால்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: அவளுடன் வாழ
  rationale: தொடர்ந்து ஒரே இல்லத்தில் திருமண வாழ்வு வாழ்வதைக் குறிக்கும் இயல்பான தமிழ் நடை.
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: அவள் தன் கணவனை விட்டுப் பிரியக்கூடாது
  rationale: ἀφίημι என்பதற்கு ‘விடுதல்/அனுப்பிவிடுதல்’ என்ற அடிப்படைப் பொருள் உண்டு; இத்திருமணச் சூழலில் உறவை முடிப்பது நோக்கமாக உள்ளது. ‘விட்டுப் பிரிதல்’ கிரேக்கத்தின் உருவகத்தைத் தக்கவைத்தபடியே திருமணப் பிரிவைத் தெரிவிக்கிறது; ‘விவாகரத்து செய்யக்கூடாது’ என்று சட்டரீதியாக மட்டும் மிகத் துல்லியப்படுத்துவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: கலப்பு நம்பிக்கையுள்ள திருமணத்தில் ἀφιέτω என்பதன் செயல்பரப்பு
  choice: ‘தன் கணவனை விட்டுப் பிரியக்கூடாது’ என்று மொழிபெயர்த்தல்
  alternative: ‘தன் கணவனை விவாகரத்து செய்யக்கூடாது’
  rationale: பவுலின் அறிவுரை, நம்பிக்கை இல்லாத துணை தொடர்ந்து சேர்ந்து வாழ விரும்பும்போது திருமண உறவை முடிக்க வேண்டாம் என்பதாகும். ‘விட்டுப் பிரியக்கூடாது’ என்பது மூலச்சொல்லின் அகலத்தையும் திருமணச் சூழலையும் காக்கிறது; குறிப்பிட்ட நவீன சட்ட நடைமுறையை மட்டும் உரையில் ஏற்றுவதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘நம்பிக்கை இல்லாத’ என்பது ‘விசுவாசமற்ற’ என்பதில் தோன்றக்கூடிய திருமணத் துரோகப் பொருளைத் தவிர்க்கிறது. ‘விட்டுப் பிரியக்கூடாது’ மூலத்தின் சொல்லாட்சியையும் திருமண உறவை முடிக்கும் சூழலையும் இணைக்கிறது.
