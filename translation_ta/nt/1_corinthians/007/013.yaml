  verdict: revise
  source_fidelity: The draft correctly represents the married woman, her unbelieving husband, his willingness to continue living with her, and the instruction not to end the marital relationship. “விட்டுப் பிரியக்கூடாது” appropriately preserves the less legally specific force of ἀφιέτω in this context.
  naturalness: The opening “ஒரு பெண்ணுக்கு ... கணவன் இருந்து” is not idiomatic modern standard Tamil for this conditional construction. Recasting it with “இருக்க” makes the two linked conditions clear and natural without altering the sense.
  terminology: “நம்பிக்கை இல்லாத கணவன்,” “அவளுடன் வாழச் சம்மதித்தால்,” and “தன் கணவனை விட்டுப் பிரியக்கூடாது” are clear, suitably dignified, and contextually accurate. The footnote responsibly gives the more specific alternative “விவாகரத்து செய்யக்கூடாது.”
