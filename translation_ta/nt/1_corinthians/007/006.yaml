source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω κατὰ συγγνώμην, οὐ κατ’ ἐπιταγήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: ta
  text: ஆனால், இதை நான் ஒரு சலுகையாக[a] சொல்கிறேன்; கட்டளையாக அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அனுமதியாக” அல்லது “இடமளிக்கும் விதத்தில்.”
    reason: συγγνώμη என்ற சொல்லின் இச்சூழலுக்குரிய மாற்றுப் பொருள்களைத் தருகிறது.
lexical_decisions:
- source_word: τοῦτο
  choice: இதை
  rationale: சூழலில் உடனடியாகப் பேசப்பட்ட கருத்தைச் சுட்டுகிறது; அது முந்தையதையா அடுத்ததையா குறிக்கிறது என்பதைத் தேவையின்றி வரையறுக்காமல் கிரேக்கச் சுட்டுப்பெயரின் இயல்பை காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: மென்மையான மாறுபாட்டைக் குறிக்கிறது; சலுகைக்கும் கட்டளைக்கும் இடையிலான எதிர்மறையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγω
  choice: சொல்கிறேன்
  rationale: நிகழ்கால வினையின் நேரடியான, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: κατὰ συγγνώμην
  choice: ஒரு சலுகையாக
  rationale: இது கட்டாயமான உத்தரவு அல்ல, அனுமதிக்கப்பட்ட இடமளிப்பு என்பதைச் சூழலுக்கு ஏற்றவாறு தெரிவிக்கிறது; ‘மன்னிப்பு’ என்ற வேறு பொருளைத் தவிர்க்கிறது.
- source_word: οὐ κατ’ ἐπιταγήν
  choice: கட்டளையாக அல்ல
  rationale: அதிகாரபூர்வமான உத்தரவு என்ற பொருளைக் காத்து, முந்தைய சொற்றொடருடனான தெளிவான முரணை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் கூற்று தனிப்பட்ட அனுமதியா, அல்லது குறைந்த நிலை தெய்வீகக் கட்டளையா
  choice: இது ஒரு சலுகை, கட்டாயமான கட்டளை அல்ல என்று பவுல் வெளிப்படையாக வேறுபடுத்திக் கூறுவதை மொழிபெயர்ப்பு காக்கிறது.
  alternative: இது நேரடிக் கட்டளை அல்லாவிட்டாலும், அப்போஸ்தல அறிவுரையாக மறைமுக அதிகாரம் கொண்டிருக்கலாம்.
  rationale: வசனம் சலுகைக்கும் கட்டளைக்கும் இடையே தெளிவான வேறுபாட்டை அமைக்கிறது. அதற்கு அப்பால் பவுலின் அதிகாரத்தை உயர்த்தியோ குறைத்தோ விளக்காமல், உரையிலுள்ள இறையியல் அழுத்தத்தை அப்படியே விட்டிருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கத்தின் சுருக்கமான எதிர்மறை அமைப்பை இயல்பான தமிழில் அரைப்புள்ளியுடன் காத்துள்ளது.
