reference: 1 Corinthians 7:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: ta
  text: மனைவிக்குத் தன் சொந்த உடலின்மேல் அதிகாரம் இல்லை; மாறாக, கணவனுக்கே உண்டு. அதுபோலவே, கணவனுக்கும் தன் சொந்த உடலின்மேல் அதிகாரம் இல்லை; மாறாக, மனைவிக்கே உண்டு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிகாரம் செலுத்துவதில்லை.” கிரேக்க வினைச்சொல் அதிகாரத்தைக் கொண்டிருப்பதையோ அதைச் செலுத்துவதையோ குறிக்கலாம்; இங்கே அந்த அதிகாரம் கணவன் மனைவி இருவருக்கும் பரஸ்பரமாகக் கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: மனைவி
  rationale: திருமண உறவும் பரஸ்பரத் தாம்பத்தியக் கடமைகளும் பேசப்படும் உடனடிச் சூழலில், இது பொதுவாக ‘பெண்’ என்பதல்லாமல் ‘மனைவி’ என்பதைக் குறிக்கிறது.
- source_word: ἀνήρ
  choice: கணவன்
  rationale: γυνή என்பதுடன் திருமணச் சூழலில் இணையாக வருவதால், பொதுவான ‘ஆண்’ என்பதைவிட ‘கணவன்’ என்பது துல்லியம்.
- source_word: ἰδίου σώματος
  choice: தன் சொந்த உடலின்மேல்
  rationale: ἴδιος ஒருவருக்கே உரியதைக் குறிப்பாக வலியுறுத்துகிறது; ‘தன் சொந்த உடல்’ அந்த உடைமைச் சுட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐξουσιάζει
  choice: அதிகாரம் ... இல்லை / ... உண்டு
  rationale: இவ்வினைச்சொல் அதிகாரம் கொண்டிருப்பதையோ அதைப் பயன்படுத்துவதையோ குறிக்கலாம். ‘அதிகாரம் உண்டு’ என்பது இருதரப்புக்கும் சமமாக அமைந்துள்ள உரையின் சட்ட-உறவியல் வலிமையை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἀλλά
  choice: மாறாக
  rationale: தன் உடலின்மேல் அதிகாரம் இல்லாதவர் மற்றும் அந்த அதிகாரம் உள்ள துணைவர் ஆகியோருக்கிடையிலான கூர்மையான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁμοίως δὲ καὶ
  choice: அதுபோலவே
  rationale: இரண்டாம் கூற்றை முதல் கூற்றுக்கு நேரான பரஸ்பர இணையாக அமைத்து, பவுலின் சமச்சீர் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: திருமண உறவில் அதிகாரத்தின் தன்மை
  choice: இரு துணைவர்களுக்கும் பரஸ்பரமாக அமைந்த அதிகாரமாக நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘தன் உடல் தனக்கே உரியதல்ல’ என்று மென்மையாக்குதல் அல்லது ‘ஒருவரின் உடலை மற்றவர் கட்டுப்படுத்துகிறார்’ என்று வலுப்படுத்துதல்
  rationale: கிரேக்க உரை மனைவியையும் கணவனையும் முற்றிலும் இணையான கூற்றுகளில் வைக்கிறது. ஆகவே ஒருதலைப்பட்சப் படிநிலையையோ வற்புறுத்தலையோ சேர்க்காமலும், அதிகாரம் குறித்த மொழியை வெறும் உடைமைக்கருத்தாகக் குறைக்காமலும் பரஸ்பர அமைப்பைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் இரண்டு இணையான கூறுகளும் பரஸ்பர வலியுறுத்தலும் காக்கப்பட்டுள்ளன; ‘உண்டு’ என்பதில் உள்ள வலியுறுத்தலைத் தெளிவாக்க ‘-க்கே’ பயன்படுத்தப்பட்டுள்ளது.
