source:
  edition: SBLGNT
  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: ta
  text: ஒருவர் விருத்தசேதனம் செய்யப்பட்ட நிலையில் அழைக்கப்பட்டாரா? அவர் அதன் அடையாளங்களை மறைக்கவோ மாற்றியமைக்கவோ முயல வேண்டாம்[a]. ஒருவர் விருத்தசேதனம் செய்யப்படாத நிலையில் அழைக்கப்பட்டாரா? அவர் விருத்தசேதனம் செய்துகொள்ள வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்று மொழிபெயர்ப்பு: “அவர் விருத்தசேதனம் செய்யப்படாதவராக ஆக வேண்டாம்”—அதாவது, விருத்தசேதனத்தின் அடையாளங்களை மறைக்கவோ மாற்றியமைக்கவோ முயல வேண்டாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: விருத்தசேதனம் செய்யப்பட்ட நிலையில்
  rationale: நிறைவேற்றப்பட்ட விருத்தசேதனத்தின் தொடரும் நிலையைக் கிரேக்க நிறைவேற்றுக் காலப் பெயரெச்சம் குறிக்கிறது; தமிழில் இச்சொற்றொடர் அந்த நிலையைக் தெளிவாகத் தருகிறது.
- source_word: ἐκλήθη / κέκληταί
  choice: அழைக்கப்பட்டாரா
  rationale: இங்கு καλέω என்பது கடவுளின் அழைப்பைக் குறிக்க வாய்ப்புள்ளது. ஆனால் விளக்கமாக ‘விசுவாசியானாரா’ என்று மாற்றாமல், மூலத்தின் ‘அழைக்கப்பட்டார்’ என்ற சொல்லாட்சியே இரு வாக்கியங்களிலும் காக்கப்படுகிறது.
- source_word: ἐπισπάσθω
  choice: அதன் அடையாளங்களை நீக்க முயல வேண்டாம்
  rationale: விருத்தசேதனத்தின் உடல் அடையாளத்தை மறைக்கவோ மாற்றவோ முயல்வதை வினைச்சொல் குறிக்கிறது. இயல்பான தமிழுக்காக பொருள் தெளிவாக்கப்பட்டு, நேரடியான மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν ἀκροβυστίᾳ
  choice: விருத்தசேதனம் செய்யப்படாத நிலையில்
  rationale: அழைக்கப்பட்டபோது ஒருவர் இருந்த உடல் மற்றும் சமூக-சமய நிலையைக் குறிக்கும் சொற்றொடர்; இத்தமிழாக்கம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: περιτεμνέσθω
  choice: விருத்தசேதனம் செய்துகொள்ள வேண்டாம்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை வடிவத்தின் தடையை, தமிழில் நேரடியான அறிவுறுத்தலாகத் தருகிறது.
theological_decisions:
- issue: இரு வாக்கியங்களிலும் ‘அழைக்கப்பட்டார்’ என்பதன் பொருள்
  choice: ஒருவர் இருந்த நிலையிலேயே கடவுளால் கிறிஸ்தவ வாழ்வுக்கு அழைக்கப்பட்டார்
  alternative: பொதுவான ஓர் அழைப்பு மட்டுமே
  rationale: 1 கொரிந்தியர் 7-ன் உடனடிச் சூழலில் பவுல், கடவுளின் அழைப்பு வந்தபோது விசுவாசி இருந்த நிலையைக் குறித்து பேசுகிறார். எனினும், இந்தப் பொருளை மொழிபெயர்ப்பிலேயே ‘மனந்திரும்பினார்’ அல்லது ‘விசுவாசியானார்’ என்று விரிவாக்காமல் மூலத்தின் இறையியல் நெகிழ்வு காக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல் என்பதால் தக்கவைக்கப்பட்டுள்ளது; ἐπισπάομαι மட்டும் தெளிவுக்காக இயல்பாக விரித்துரைக்கப்பட்டு, அதன் சொற்சொல்லான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
