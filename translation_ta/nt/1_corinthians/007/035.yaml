id: 1CO.7.35
reference: 1 Corinthians 7:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: ta
  text: இதை உங்களுடைய சொந்த நன்மைக்காகவே சொல்கிறேன்; உங்கள் கழுத்தில் கண்ணி மாட்டுவதற்காக அல்ல, மாறாகத் தகுந்த ஒழுக்கத்திற்காகவும் ஆண்டவருக்குக் கவனம் சிதறாமல் அர்ப்பணிப்புடன் இருப்பதற்காகவும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: நன்மை
  rationale: ஒருவருக்குப் பயனும் நலனும் அளிப்பதைக் குறிக்கும் சொல்லை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: βρόχον
  choice: கண்ணி
  rationale: கட்டுப்பாடு என்ற பொதுமைப்படுத்தலைத் தவிர்த்து, மூலத்தின் நேரடியான ‘கண்ணி/சுருக்கு’ உருவகத்தைப் பாதுகாக்கிறது; ‘கழுத்தில் ... மாட்டுவது’ தமிழில் அதன் கட்டுப்படுத்தும் வலிமையைத் தெளிவாக்குகிறது.
- source_word: εὔσχημον
  choice: தகுந்த ஒழுக்கம்
  rationale: சூழலுக்கேற்ற, கண்ணியமான நடத்தை என்ற பொருளை வெளிப்படுத்துகிறது; வெறும் வெளித்தோற்றமாகக் குறுக்கவில்லை.
- source_word: εὐπάρεδρον
  choice: பற்றுறுதியுடன் இருப்பது
  rationale: ஆண்டவருக்கு அருகில் நிலைத்திருத்தல் அல்லது அர்ப்பணிப்புடன் சேவித்தல் ஆகிய கருத்துகளை இயல்பாகத் தருகிறது; அடுத்துள்ள ἀπερισπάστως உடன் சேர்ந்து ஒருமுகமான அர்ப்பணிப்பைக் குறிக்கிறது.
- source_word: ἀπερισπάστως
  choice: கவனம் சிதறாமல்
  rationale: வேறு திசைக்கு இழுக்கப்படாத, சிதறாத நிலையை நேரடியாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: பவுலின் அறிவுரையின் நோக்கமும் அதிகாரத்தின் எல்லையும்
  choice: ‘உங்கள் கழுத்தில் கண்ணி மாட்டுவதற்காக அல்ல’ என்று உருவகத்துடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உங்களைக் கட்டுப்படுத்துவதற்காக அல்ல’
  rationale: திருமணம் அல்லது திருமணமின்மை குறித்து கட்டாய விதியை விதிப்பதாகப் பவுலின் அறிவுரையை மாற்றாமல், அவர் மறுக்கும் கட்டுப்பாட்டை மூல உருவகத்தின் தீவிரத்துடன் பாதுகாக்கிறது.
- issue: ஆண்டவரிடத்திலான εὐπάρεδρον என்பதன் துல்லிய நிழல்
  choice: ‘ஆண்டவரிடம் பற்றுறுதியுடன் இருப்பது’
  alternative: ‘ஆண்டவருக்குப் பணிவிடை செய்வது’ அல்லது ‘ஆண்டவருக்கு அருகில் அமர்ந்திருப்பது’
  rationale: சொல்லில் உள்ள நிலையான அண்மை/அர்ப்பணிப்பு கருத்தைத் தக்கவைத்து, இதனை ஒரு குறிப்பிட்ட ஊழிய வடிவத்திற்கோ உடல் நிலையிற்கோ மட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. கிரேக்க வாக்கியத்தின் ‘அல்ல... மாறாக...’ எதிர்மறை–நேர்மறை அமைப்பு பாதுகாக்கப்பட்டுள்ளது. δέ தனியாக ‘இப்போது’ என மொழிபெயர்க்கப்படாமல், தமிழின் இயல்பான வாக்கிய ஓட்டத்தில் விடப்பட்டுள்ளது.
