id: 1CO.7.14
reference: 1 Corinthians 7:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: ta
  text: ஏனெனில், நம்பாத கணவன் தன் மனைவியினால் பரிசுத்தமாக்கப்பட்டிருக்கிறான்[b]; நம்பாத மனைவியும் அந்தச் சகோதரனினால்[a] பரிசுத்தமாக்கப்பட்டிருக்கிறாள். இல்லையென்றால், உங்கள் பிள்ளைகள் அசுத்தமானவர்கள்; ஆனால் இப்போதோ அவர்கள் பரிசுத்தமானவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்தச் சகோதரன்” என்பது இங்கு நம்பிக்கை கொண்ட கணவனைக் குறிக்கலாம். பவுல் சக விசுவாசியை வழக்கமாக “சகோதரன்” என்று அழைக்கிறார்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “பரிசுத்தமாக்கப்பட்டிருக்கிறான்” என்பது நம்பிக்கை கொண்ட துணையுடனும் குடும்பத்துடனும் உள்ள உறவில் தனிப்படுத்தப்பட்ட அல்லது அர்ப்பணிக்கப்பட்ட நிலையைக் குறிக்கிறது; அது அவசியமாக அந்த நபரின் தனிப்பட்ட இரட்சிப்பைக் குறிக்காது.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: பரிசுத்தமாக்கப்பட்டிருக்கிறான் / பரிசுத்தமாக்கப்பட்டிருக்கிறாள்
  rationale: இறந்தகாலச் செயல் உண்டாக்கிய தற்போதைய நிலையை உணர்த்தும் perfect passive வடிவத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இதைத் தனிப்பட்ட இரட்சிப்பு என்று உரையிலேயே முடிவுசெய்யவில்லை.
- source_word: ἄπιστος
  choice: நம்பாத
  rationale: திருமணச் சூழலில் கிறிஸ்துவை நம்பாத துணையைக் குறிக்கிறது; ‘நம்பிக்கைக்குரியவர் அல்ல’ என்ற வேறு பொருளைத் தவிர்த்து, எளிய நவீன தமிழில் தருகிறது.
- source_word: ἐν
  choice: -இனால்
  rationale: இங்கு திருமண உறவின் வாயிலாக அல்லது அந்த உறவுக்குள் ஏற்படும் நிலையைச் சுட்டும் உறவு/கருவிப் பொருளை இயல்பான தமிழில் தருகிறது; காரணத்தின் துல்லிய இயல்பை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: ἀνήρ / γυνή
  choice: கணவன் / மனைவி
  rationale: உடனடிச் சூழல் திருமணத்தைப் பற்றியது என்பதால் பொதுவான ‘ஆண் / பெண்’ என்பதற்குப் பதிலாக உறவைக் குறிக்கும் சொற்கள் பொருத்தமானவை.
- source_word: ἀδελφῷ
  choice: அந்தச் சகோதரனினால்
  rationale: கிரேக்கத்தில் ‘கணவன்’ என்பதற்குப் பதிலாக குறிப்பாக ‘சகோதரன்’ என்று இருப்பதைப் பாதுகாக்கிறது; அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐπεὶ ἄρα
  choice: இல்லையென்றால்
  rationale: முந்தைய கூற்று உண்மையல்லாவிட்டால் ஏற்படும் விளைவை அறிமுகப்படுத்தும் தர்க்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀκάθαρτα
  choice: அசுத்தமானவர்கள்
  rationale: வழிபாட்டு மற்றும் உடன்படிக்கைச் சார்ந்த ஒலிப்பைத் தக்கவைக்கும் ‘அசுத்தம்’ என்ற சொல்லைப் பயன்படுத்துகிறது.
- source_word: νῦν δὲ
  choice: ஆனால் இப்போதோ
  rationale: கற்பனையான எதிர்நிலைக்கு மாறாக உண்மையில் நிலவும் தற்போதைய நிலையைச் சுட்டும் முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: ἅγια
  choice: பரிசுத்தமானவர்கள்
  rationale: ἡγίασται என்பதுடன் உள்ள சொற்பொருள் தொடர்பைத் தக்கவைத்து, மூலத்தின் இறையியல் நிறையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: நம்பாத துணை ‘பரிசுத்தமாக்கப்பட்டிருக்கிறார்’ என்பதன் பொருள்
  choice: மூலத்தின் பரிசுத்த மொழியை அப்படியே தக்கவைத்து, திருமண மற்றும் குடும்ப உறவுக்குள் அமைந்த தனிப்படுத்தப்பட்ட நிலையாக அடிக்குறிப்பில் விளக்குதல்
  alternative: நம்பும் ஒருவரை மணந்ததால் நம்பாத துணை தனிப்பட்ட முறையில் இரட்சிக்கப்பட்டார் என்று மொழிபெயர்த்தல்
  rationale: இந்த வசனத்தின் வாதம் திருமண உறவையும் பிள்ளைகளின் அசுத்தம்/பரிசுத்தம் என்ற நிலையையும் பற்றியது. தனிப்பட்ட இரட்சிப்பைத் தெளிவாகச் சேர்ப்பது மூலத்தைவிட அதிகமாகக் கூறிவிடும்.
- issue: ἀδελφῷ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘அந்தச் சகோதரன்’ என்பதைத் தக்கவைத்தல்
  alternative: ஒத்த அமைப்புக்காக நேரடியாக ‘நம்பும் கணவன்’ என்று மாற்றுதல்
  rationale: மூல கிரேக்கம் இரண்டாம் உட்பிரிவில் ἀνήρ என்பதற்குப் பதிலாக ἀδελφός என்கிறது. பவுலின் வழக்கில் இது சக விசுவாசியைக் குறிக்கக்கூடும்; அந்த விளக்கம் அடிக்குறிப்பில் தரப்பட்டாலும் மூலத்தின் வேறுபாடு உரையில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமத்துக்குரிய கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘பரிசுத்தம்/அசுத்தம்’ என்ற மூலச் சொல் இணைவும் ‘சகோதரன்’ என்ற எதிர்பாராத சொல்லாட்சியும் பாதுகாக்கப்பட்டுள்ளன.
