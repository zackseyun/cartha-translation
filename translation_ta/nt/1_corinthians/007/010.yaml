source:
  edition: SBLGNT
  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: ta
  text: 'திருமணமானவர்களுக்கு நான் கட்டளையிடுகிறேன்—நான் அல்ல, ஆண்டவர்தான்: மனைவி தன் கணவனைவிட்டுப் பிரியக் கூடாது[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் கணவனை விவாகரத்து செய்யக் கூடாது.” கிரேக்க வினைச்சொல் திருமணப் பிரிவைக் குறிக்கலாம்; இச்சூழலில் அது விவாகரத்தையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: திருமணமானவர்களுக்கு
  rationale: γεγαμηκόσιν என்பது திருமண உறவில் இருப்பவர்களைக் குறிக்கிறது; தமிழில் “திருமணமானவர்களுக்கு” என்பது தத்திவ் முகவரிப் பொருளை இயல்பாகத் தெரிவிக்கிறது. δὲ இங்கு மென்மையான உரைமாற்றத்தைச் சுட்டுகிறது; தனியான இணைப்புச்சொல்லைச் சேர்க்காமல் தமிழ்ச் சொற்றொடரின் ஓட்டத்தில் அது வெளிப்படுகிறது.
- source_word: παραγγέλλω
  choice: நான் இந்தக் கட்டளையைக் கொடுக்கிறேன்
  rationale: அதிகாரபூர்வமான அறிவுறுத்தலைக் குறிக்கும் வினை. “இந்தக் கட்டளையைக் கொடுக்கிறேன்” என்பது அடுத்து வரும் கட்டளையின் உள்ளடக்கத்தை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: நான் அல்ல, ஆண்டவரே கொடுக்கிறார்
  rationale: மூலத்தின் வலியுறுத்தப்பட்ட எதிர்மறை ஒப்பீட்டைத் தக்கவைக்கிறது. தமிழில் தெளிவுக்காக முன் வந்த “கொடுக்கிறார்” என்ற வினை பொருத்தமாக மீண்டும் வழங்கப்பட்டுள்ளது.
- source_word: γυναῖκα
  choice: மனைவி
  rationale: திருமணச் சூழலும் ἀνήρ என்பதுடனான இணைப்பும் இங்கு γυνή என்பதற்கு “மனைவி” என்ற பொருளை உறுதிப்படுத்துகின்றன.
- source_word: ἀπὸ ἀνδρὸς
  choice: தன் கணவனைவிட்டு
  rationale: திருமணச் சூழலில் ἀνήρ என்பது “கணவன்”; தமிழ் உறவுப் பயன்பாட்டில் “தன்” என்பது உறவை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: μὴ χωρισθῆναι
  choice: பிரிந்துபோகக் கூடாது
  rationale: χωρίζω என்பதன் திருமணப் பிரிவு சார்ந்த அடிப்படைப் பொருளைத் தக்கவைக்கிறது; அதை நவீன சட்டரீதியான “விவாகரத்து” என்ற ஒரே பொருளுக்குள் முன்கூட்டியே சுருக்கவில்லை.
theological_decisions:
- issue: “நான் அல்ல, ஆண்டவர்” என்பதன் பொருள்
  choice: இந்தக் கட்டளை ஆண்டவரிடமிருந்து வந்ததாக உள்ள உரைநிலை வேறுபாட்டை நேரடியாகத் தக்கவைத்தல்
  alternative: பவுல் தன் சொற்களுக்கு அதிகாரம் இல்லை என்று மறுப்பதாக விளக்குதல்
  rationale: மூலவாக்கியத்தின் எதிர்மறை ஒப்பீட்டை மொழிபெயர்ப்பு காக்கிறது; தூண்டுதல் அல்லது அப்போஸ்தல அதிகாரம் பற்றிய கூடுதல் முடிவை வசனத்திற்குள் புகுத்தவில்லை.
- issue: திருமணச் சூழலில் χωρισθῆναι என்பதன் பரப்பு
  choice: பிரிந்துபோகக் கூடாது
  alternative: விவாகரத்து செய்யக் கூடாது
  rationale: இச்சொல் திருமணப் பிரிவைக் குறிக்கிறது; அதன் சட்ட, சமூக பரப்பு சூழலில் திறந்தவாறே இருக்கும்படி பொதுவான “பிரிந்துபோ” என்ற சொல்லாட்சி தேர்ந்தெடுக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் எளிதில் புரியும், கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “ஆண்டவரே” என்பது மூலத்தின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது. இறுதியிலுள்ள நீண்ட கோடு அடுத்த வசனத்தில் வாக்கியம் தொடர்வதைக் காட்டுகிறது.
