  terminology: “அடிமைகள்” faithfully conveys δοῦλοι in this ownership-and-allegiance context. “மனிதர்கள்” correctly represents ἀνθρώπων inclusively rather than restricting the reference to males. The footnote supplies a natural Tamil relational alternative without altering the meaning.
