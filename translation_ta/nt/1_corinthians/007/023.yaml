  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τιμῆς ἠγοράσθητε· μὴ γίνεσθε δοῦλοι ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: ta
  text: நீங்கள் விலை கொடுத்து வாங்கப்பட்டீர்கள்; மனிதர்களின் அடிமைகளாக[a] ஆகாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதர்களுக்கு அடிமைகளாக.” கிரேக்கத்தில் உடைமைத் தொடர்பு உள்ளது; இங்குள்ள “மனிதர்கள்” என்பது ஆண்களை மட்டும் அல்ல, மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμῆς
  choice: விலை கொடுத்து
  rationale: ἀγοράζω என்பதுடன் வரும் இந்தச் சொல், வாங்குவதற்குச் செலுத்தப்பட்ட விலையைக் குறிக்கிறது. அதன் அளவையோ யார் செலுத்தினார் என்பதையோ வசனம் வெளிப்படையாகக் கூறாததால், அவற்றைச் சேர்க்காமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: ἠγοράσθητε
  choice: வாங்கப்பட்டீர்கள்
  rationale: இது இறந்தகாலச் செயப்பாட்டு வினை, இரண்டாம் நபர் பன்மை. வாங்குதல் என்ற வாணிக உருவகத்தையும் செயப்பாட்டு அமைப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: μὴ γίνεσθε
  choice: ஆகாதீர்கள்
  rationale: γίνομαι என்பதன் ‘ஆதல்/ஆகுதல்’ என்ற இயக்கநிலையைப் பாதுகாக்கிறது; வெறும் ‘இராதீர்கள்’ என்று நிலைமையை மட்டும் சொல்லவில்லை.
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: இச்சூழலில் உரிமை, கட்டுப்பாடு, எஜமானத்துவம் ஆகியவை மையமாக இருப்பதால், ‘ஊழியர்கள்’ அல்லது ‘பணியாளர்கள்’ என்பதைக் காட்டிலும் ‘அடிமைகள்’ கிரேக்கச் சொல்லின் வலிமையைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ἀνθρώπων
  choice: மனிதர்களின்
  rationale: இது ஆண்களை மட்டும் குறிக்காமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. கிரேக்க உரையின் உடைமைத் தொடர்பைத் தமிழிலும் வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: δοῦλοι ἀνθρώπων என்பதில் உள்ள உரிமை மற்றும் கீழ்ப்படிதல் உருவகம்
  choice: மனிதர்களின் அடிமைகளாக
  alternative: மனிதர்களுக்குப் பணியாளர்களாக
  rationale: முந்தைய ‘வாங்கப்பட்டீர்கள்’ என்பதுடன் உரிமை மற்றும் எஜமானத்துவ உருவகம் தொடர்கிறது. ஆகவே மென்மையான ‘பணியாளர்கள்’ என்பதைவிட ‘அடிமைகள்’ மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது; அதேவேளை மனித அதிகாரத்திற்கான எல்லா முறையான கீழ்ப்படிதலையும் இவ்வசனம் மறுக்கிறது என்று விளக்கிச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘விலை கொடுத்து வாங்கப்பட்டீர்கள்’ என்ற நடை வாணிக உருவகத்தை இயல்பாக வைத்திருக்கிறது. ‘மனிதர்களின் அடிமைகளாக ஆகாதீர்கள்’ என்பதில் சிறிய சொல் மீளல் இருந்தாலும், δοῦλοι மற்றும் γίνεσθε ஆகிய இரண்டின் தனித்தனி பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
