- from: மனைவியே, நீங்கள் உங்கள் கணவனை மீட்பீர்களா என்பது உங்களுக்கு எப்படித் தெரியும்?[a] அல்லது கணவனே, நீங்கள் உங்கள் மனைவியை மீட்பீர்களா என்பது உங்களுக்கு எப்படித் தெரியும்?
  to: ஏனெனில், மனைவியே, உங்கள் கணவனை நீங்கள் மீட்பீர்களா என்பது உங்களுக்கு எப்படித் தெரியும்?[a] அல்லது, கணவனே, உங்கள் மனைவியை நீங்கள் மீட்பீர்களா என்பது உங்களுக்கு எப்படித் தெரியும்?
  rationale: ‘ஏனெனில்’ சேர்க்கப்பட்டு γάρ-இன் விளக்கத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது. வாக்கிய வரிசை சிறிது சீரமைக்கப்பட்டு, வினைச்சொல்லின் செய்பவர் (‘நீங்கள்’) தெளிவாக வைக்கப்பட்டுள்ளது. மற்றபடி மூலத்தின் இணையான அமைப்பு, எதிர்கால வடிவம், மற்றும் ‘மீட்பது’ என்ற திறந்த இரட்சிப்பு சார்ந்த சொல் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு முதன்மை மொழிபெயர்ப்பின் எதிர்காலத்தன்மையை மாற்றாமல், இயல்பான மாற்றுச் சொல்லாக்கத்தை மட்டும் வழங்குகிறது.
