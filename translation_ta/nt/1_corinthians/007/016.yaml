review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two parallel rhetorical questions, the marital vocatives, the future form of σώσεις, and the salvific breadth of ‘save.’ However, it omits γάρ (‘for’), which marks this verse as grounding the preceding statement and should be represented.
  naturalness: The respectful plural forms and vocatives are natural modern standard Tamil. ‘...மீட்பீர்களா என்பது உங்களுக்கு எப்படித் தெரியும்?’ is clear and suitably retains the indirect-question force. Placing ‘ஏனெனில்’ at the opening gives a natural enough connection to the preceding context.
  terminology: ‘மீட்பீர்கள்’ appropriately retains the theological and semantic openness of σῴζω without reducing it to preserving the marriage or explicitly converting someone. ‘மனைவியே/கணவனே’ and ‘கணவன்/மனைவி’ are contextually exact.
  issues:
  - severity: medium
    issue: The explanatory conjunction γάρ is not represented.
    rationale: The Greek begins τί γὰρ οἶδας, explicitly connecting the rhetorical question to the preceding argument. Tamil can preserve this with ‘ஏனெனில்’ without altering the question’s sense.
