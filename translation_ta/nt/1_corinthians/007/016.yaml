reference: 1 Corinthians 7:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: ta
  text: ஏனெனில், மனைவியே, உங்கள் கணவனை நீங்கள் மீட்பீர்களா என்பது உங்களுக்கு எப்படித் தெரியும்?[a] அல்லது, கணவனே, உங்கள் மனைவியை நீங்கள் மீட்பீர்களா என்பது உங்களுக்கு எப்படித் தெரியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் இயல்பாக, “உங்கள் கணவனை ஒருவேளை நீங்கள் மீட்பீர்களா என்று உங்களுக்கு எப்படித் தெரியும்?” என்றும் சொல்லலாம். கிரேக்கத்தில் மறைமுகக் கேள்விக்குள் எதிர்கால வினைச்சொல் (“மீட்பீர்கள்”) பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: என்பது உங்களுக்கு எப்படித் தெரியும்?
  rationale: τί + οἶδας என்ற வினாவைத் தமிழில் இயல்பாக ‘எப்படித் தெரியும்?’ என்று வழங்குகிறது. γάρ முந்தைய கருத்தை ஆதரிக்கும் இணைப்பாக இருந்தாலும், இங்கு தனி வசனமாக இயல்பான தமிழில் வெளிப்படையாக மொழிபெயர்த்தால் கடினமாக இருக்கும்; கேள்வியின் தொடர்ச்சியே அதன் விளக்கத் தொடர்பை உணர்த்துகிறது.
- source_word: γύναι
  choice: மனைவியே
  rationale: γυνή என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம்; திருமணச் சூழலில் ‘மனைவி’ என்பதே குறிப்பான பொருள். விளி வேற்றுமையை ‘-யே’ வெளிப்படுத்துகிறது.
- source_word: ἄνερ
  choice: கணவனே
  rationale: ἀνήρ என்பதற்கு ‘ஆண்’ அல்லது ‘கணவன்’ என்று பொருள் வரலாம்; இங்குள்ள திருமணச் சூழல் ‘கணவன்’ என்பதைக் கோருகிறது. இது விளி வடிவில் தரப்பட்டுள்ளது.
- source_word: σώσεις
  choice: மீட்பீர்கள்
  rationale: எதிர்கால வினை வடிவைத் தக்கவைத்தபடி σῴζω என்பதன் இரட்சிப்பு சார்ந்த வலிமையை ‘மீட்பீர்கள்’ வெளிப்படுத்துகிறது; அதை ‘நம்பிக்கைக்குக் கொண்டுவருவீர்கள்’ போன்ற விளக்கவுரையாகக் குறுக்கவில்லை.
- source_word: τὸν ἄνδρα
  choice: உங்கள் கணவனை
  rationale: குறிப்பிடப்படும் வாழ்க்கைத்துணை உறவை இயல்பான தமிழில் உடைமைச் சொல்லுடன் வெளிப்படுத்துகிறது.
- source_word: τὴν γυναῖκα
  choice: உங்கள் மனைவியை
  rationale: குறிப்பிடப்படும் வாழ்க்கைத்துணை உறவை இயல்பான தமிழில் உடைமைச் சொல்லுடன் வெளிப்படுத்துகிறது.
- source_word: ἢ
  choice: அல்லது
  rationale: இரண்டு இணையான சொல்லாட்சிக் கேள்விகளுக்கிடையிலான மாற்றை எளிமையாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: திருமணச் சூழலில் ‘மீட்பது’ என்பதன் பொருள்
  choice: ‘மீட்பீர்கள்’ என்ற இரட்சிப்பு வலிமையுள்ள சொல்லை அப்படியே வைத்தல்
  alternative: ‘நம்பிக்கைக்குக் கொண்டுவருவீர்கள்’ அல்லது ‘திருமணத்தைக் காப்பாற்றுவீர்கள்’ என்று விளக்குதல்
  rationale: σῴζω என்ற சொல் பவுலின் பயன்பாட்டில் பொதுவாக இரட்சிப்பு சார்ந்த வலிமை கொண்டது. விசுவாசமுள்ள வாழ்க்கைத்துணை விசுவாசமற்ற துணையின் மீது ஏற்படுத்தக்கூடிய விளைவே உடனடிச் சூழல். அதன் பொருளைத் திருமணப் பாதுகாப்பு என்று சுருக்காமலும் குறிப்பிட்ட ஒரு செயல்முறையாக விளக்காமலும் மூலத்தின் இறையியல் அழுத்தத்தையும் திறந்த தன்மையையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமையான ‘நீங்கள்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு இணையான கேள்விகளும் விளி வடிவங்களும் பாதுகாக்கப்பட்டுள்ளன; மொழிநடை இயல்பாகவும் கண்ணியமாகவும் வைக்கப்பட்டுள்ளது.
