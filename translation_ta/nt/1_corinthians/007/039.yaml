revisions:
- from: ஒரு மனைவி, தன் கணவன் உயிரோடிருக்கும் காலமெல்லாம் கட்டுப்பட்டிருக்கிறாள். ஆனால் அவளுடைய கணவன் இறந்துவிட்டால்[a], தான் விரும்புகிறவரைத் திருமணம் செய்துகொள்ள அவளுக்கு உரிமை உண்டு; ஆனால் அவர் ஆண்டவருக்குள் இருப்பவராக மட்டுமே இருக்க வேண்டும்[b].
  to: ஒரு மனைவி தன் கணவன் உயிரோடிருக்கும் காலமெல்லாம் பிணைக்கப்பட்டிருக்கிறாள். ஆனால், அவளுடைய கணவன் இறந்துவிட்டால்[a], அவள் விரும்புகிறவரைத் திருமணம் செய்துகொள்ள அவளுக்குச் சுதந்திரம் உண்டு; ஆனால் ஆண்டவருக்குள் மட்டுமே[b].
  rationale: The revision removes an interpretive expansion from the main text and restores the compact ambiguity of μόνον ἐν κυρίῳ. It also renders ἐλευθέρα ἐστίν as freedom rather than entitlement, while retaining the draft’s clear treatment of κοιμηθῇ (‘dies’) with the source euphemism documented in footnote a.
