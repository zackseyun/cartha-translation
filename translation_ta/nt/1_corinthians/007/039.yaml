source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: ta
  text: ஒரு மனைவி தன் கணவன் உயிரோடிருக்கும் காலமெல்லாம் பிணைக்கப்பட்டிருக்கிறாள். ஆனால், அவளுடைய கணவன் இறந்துவிட்டால்[a], அவள் விரும்புகிறவரைத் திருமணம் செய்துகொள்ள அவளுக்குச் சுதந்திரம் உண்டு; ஆனால் ஆண்டவருக்குள் மட்டுமே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லளவில்: “தூங்கிவிட்டால்.” கிரேக்கத்தில் இது மரணத்தைக் குறிக்கும் வழக்கமான மென்மையான சொற்பயன்பாடு.'
    reason: lexical_alternative
  - marker: b
    text: “ஆண்டவருக்குள்” என்பது பொதுவாக, ஆண்டவருக்குச் சொந்தமான ஒருவரை, அதாவது சக விசுவாசியை மட்டுமே மணந்துகொள்ள வேண்டும் என்று புரிந்துகொள்ளப்படுகிறது. இந்தச் சொற்றொடர் ஆண்டவருக்கு ஏற்ற விதத்தில் திருமணம் செய்துகொள்ள வேண்டும் என்ற விரிவான நுட்பத்தையும் கொண்டிருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: ஒரு மனைவி
  rationale: திருமண உறவைப் பற்றிய இச்சூழலில் பொதுவான ‘பெண்’ என்பதைவிட ‘மனைவி’ என்பதே பொருத்தமானது; பின்னர் ‘அவளுடைய கணவன்’ என்று தெளிவாக வருகிறது.
- source_word: δέδεται
  choice: கட்டுப்பட்டிருக்கிறாள்
  rationale: நிறைவுக்காலச் செயப்பாட்டு வடிவம் தொடர்ந்து நிலவும் பிணைப்பைக் குறிக்கிறது. இச்சொல் திருமண உறவின் கட்டுப்பாட்டைத் தெரிவிக்கிறது; கிரேக்கத்தில் இல்லாத ‘சட்டத்தால்’ என்பதைச் சேர்ப்பதில்லை.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: உயிரோடிருக்கும் காலமெல்லாம்
  rationale: கணவன் உயிருடன் இருக்கும் முழுக் கால அளவையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἀνήρ
  choice: கணவன்
  rationale: திருமணச் சூழலில் ἀνήρ என்பது பொதுவாக ‘ஆண்’ அல்ல, ‘கணவன்’ என்று பொருள்படுகிறது.
- source_word: κοιμηθῇ
  choice: இறந்துவிட்டால்
  rationale: சொல்லளவில் ‘தூங்கிவிட்டால்’ என்றாலும், இங்கு மரணத்தைக் குறிக்கும் வழக்கமான மென்மையான சொற்பயன்பாடு. தவறான புரிதலைத் தவிர்க்க இயல்பான தமிழ் முதன்மை உரையில் பொருள் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐλευθέρα ἐστίν
  choice: அவளுக்கு உரிமை உண்டு
  rationale: முந்தைய திருமணப் பிணைப்பிலிருந்து விடுதலையாகி மறுமணம் செய்யும் சுதந்திரத்தைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: தான் விரும்புகிறவரைத் திருமணம் செய்துகொள்ள
  rationale: புதிய துணையைத் தேர்ந்தெடுக்கும் சுதந்திரத்தையும் திருமணம் செய்துகொள்ளுதல் என்ற பொருளையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: μόνον ἐν κυρίῳ
  choice: ஆனால் அவர் ஆண்டவருக்குள் இருப்பவராக மட்டுமே இருக்க வேண்டும்
  rationale: μόνον என்பதன் கட்டுப்படுத்தும் வலிமையையும் ἐν κυρίῳ என்ற பவுலின் முக்கிய சொற்றொடரையும் காக்கிறது. தமிழில் அது யாரைக் கட்டுப்படுத்துகிறது என்பதைத் தெளிவாக்கினாலும், அதன் விளக்கத்தை அடிக்குறிப்பில் திறந்தவாறு வைக்கிறது.
theological_decisions:
- issue: மறுமண அறிவுறுத்தலில் ‘ஆண்டவருக்குள்’ என்பதன் பொருள்
  choice: ‘அவர் ஆண்டவருக்குள் இருப்பவராக மட்டுமே இருக்க வேண்டும்’ என்று மூலச் சொற்றொடரை முதன்மை உரையில் பாதுகாத்தல்
  alternative: ‘விசுவாசி ஒருவரை மட்டுமே’ அல்லது ‘ஆண்டவருக்கான அர்ப்பணிப்புக்கு ஏற்ற முறையில் மட்டுமே’
  rationale: ἐν κυρίῳ என்பது சுருக்கமான, இறையியல் முக்கியத்துவமுள்ள சொற்றொடர். சக விசுவாசியை மணத்தல் என்பது பொதுவான புரிதலாயினும், அதை மட்டும் மூலவாக்கியம் வெளிப்படையாக விரித்துரைக்கவில்லை; ஆகவே முதன்மை உரை அந்த நெருக்கடியையும் பரப்பையும் காக்கிறது.
- issue: மரணத்துக்கான மென்மையான உருவகச் சொல்
  choice: முதன்மை உரையில் ‘இறந்துவிட்டால்’; அடிக்குறிப்பில் ‘தூங்கிவிட்டால்’ என்ற மூல உருவகம்
  alternative: முதன்மை உரையிலேயே ‘தூங்கிவிட்டால்’
  rationale: κοιμηθῇ மரணத்தைக் குறிக்கும் வழக்கமான மென்மையான சொல். நவீன தமிழில் ‘தூங்கிவிட்டால்’ என்பது நேரடி உறக்கமாகத் தவறாகப் புரியக்கூடும்; ஆகவே தெளிவான பொருள் உரையில் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘கட்டுப்பட்டிருக்கிறாள்’ உறவுப் பிணைப்பை வெளிப்படுத்துகிறது; ‘உரிமை உண்டு’ விடுதலையையும் மறுமணச் சுதந்திரத்தையும் தெளிவாக்குகிறது. கிரேக்கத்தின் மரண உருவகம் அடிக்குறிப்பில் காக்கப்பட்டு, ‘ஆண்டவருக்குள்’ என்ற இறையியல் செறிவுள்ள சொற்றொடர் மிகையாக விளக்கப்படாமல் முதன்மை உரையில் நிலைநிறுத்தப்பட்டுள்ளது.
