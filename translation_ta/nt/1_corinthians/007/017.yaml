  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: ta
  text: ஆனால், ஆண்டவர் ஒவ்வொருவருக்கும் எவ்வாறு பங்கிட்டுள்ளாரோ, தேவன் ஒவ்வொருவரை எவ்வாறு அழைத்துள்ளாரோ, அவ்வாறே ஒவ்வொருவரும் நடக்கட்டும்[a]. இவ்வாறே எல்லாத் திருச்சபைகளிலும் நான் கட்டளையிடுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நடக்கட்டும்’ என்பது ஒருவரின் வாழ்க்கை முறையைக் குறிக்கும் பொதுவான வேதாகம உருவகம்; ‘வாழட்டும்’ அல்லது ‘தன் வாழ்க்கையை நடத்தட்டும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: ஆயினும்
  rationale: இங்கு இது நேரான நிபந்தனையாக அல்லாமல், முந்தைய விவாதத்துக்குப் பின் பொதுவான வழிகாட்டும் நெறியை அறிமுகப்படுத்தும் எதிரிடைத் திருப்பமாக வருகிறது. ‘ஆயினும்’ என்பது அந்த உரையோட்டத்தை இயல்பாகத் தருகிறது.
- source_word: ἑκάστῳ / ἕκαστον
  choice: ஒவ்வொருவருக்கும் / ஒவ்வொருவரை / ஒவ்வொருவரும்
  rationale: மூலத்தில் மீண்டும் வரும் பகிர்ந்தளிக்கும் தன்மையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காக்கிறது; இறுதி ‘ஒவ்வொருவரும்’ என்பது தமிழின் இலக்கணத்துக்குத் தேவையான எழுவாய்.
- source_word: ἐμέρισεν
  choice: பகிர்ந்தளித்திருக்கிறபடி
  rationale: ஆண்டவர் ஒவ்வொருவருக்கும் அளித்துள்ள பங்கு அல்லது வாழ்க்கைச் சூழலைக் குறிக்கக்கூடிய μερίζω என்பதன் விரிவை ‘பகிர்ந்தளி’ காக்கிறது; நிறைவுற்ற செயலின் தொடரும் விளைவை வினைவடிவம் வெளிப்படுத்துகிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: பவுலின் சூழலில் κύριος என்பதற்குரிய நிலையான, மரியாதையான தமிழ் வடிவம்.
- source_word: κέκληκεν
  choice: அழைத்திருக்கிறபடி
  rationale: நிறைவுற்ற அழைப்பின் தொடரும் விளைவை கிரேக்க நிறைவேற்றுக் காலத்துக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: ὁ θεός
  choice: தேவன்
  rationale: θεός என்பதற்கான நிலையான வேதாகமத் தமிழ் வடிவம்; ‘ஆண்டவர்’ என்ற முந்தைய பட்டத்துடன் உள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: οὕτως
  choice: அப்படியே / இவ்வாறே
  rationale: முதலாவது சொல் தனிநபரின் வாழ்க்கை முறையையும், இரண்டாவது பவுலின் எல்லாத் திருச்சபைகளுக்குமான ஒரே வழிமுறையையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: περιπατείτω
  choice: நடக்கட்டும்
  rationale: வாழ்க்கை நடத்தையைச் சுட்டும் பவுலின் ‘நடத்தல்’ உருவகத்தை மொழிபெயர்ப்பில் காக்கிறது.
- source_word: διατάσσομαι
  choice: கட்டளையிடுகிறேன்
  rationale: திருச்சபைகளில் நடைமுறையை அதிகாரபூர்வமாக ஒழுங்குபடுத்தும் வினையின் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: எல்லாத் திருச்சபைகளிலும்
  rationale: உள்ளூர் கிறிஸ்தவச் சபைகளைக் குறிக்கும் பவுலின் பயன்பாட்டைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ மற்றும் ‘தேவன்’ என்ற இரு குறிப்புகளின் உறவு
  choice: இரு பட்டங்களையும் தனித்தனியே காத்தல்
  alternative: இரண்டையும் ஒரே பட்டமாக மாற்றி ஒருமைப்படுத்துதல்
  rationale: இணையான சொற்றொடர்களில் மூலமே இரண்டு வேறுபட்ட இறைக் குறிப்புகளைப் பயன்படுத்துகிறது; அவற்றின் உறவை மொழிபெயர்ப்பு தீர்மானிக்காமல் அப்படியே விடுகிறது.
- issue: περιπατείτω என்பதிலுள்ள வாழ்க்கை உருவகம்
  choice: ‘நடக்கட்டும்’ என்று உருவகத்தைக் காத்தல்
  alternative: ‘வாழட்டும்’ அல்லது ‘வாழ்க்கை நடத்தட்டும்’ என்று பொருளை மட்டும் வெளிப்படுத்துதல்
  rationale: இது பவுலின் பரவலான வாழ்க்கை-நடத்தை உருவகம். அடிக்குறிப்பு அதன் பொருளை விளக்குவதால், முதன்மை உரையில் உருவகத்தைக் காக்க முடிகிறது.
- issue: அழைக்கப்பட்ட நிலையும் ஆண்டவர் பகிர்ந்தளித்த பங்கும்
  choice: அவற்றை குறிப்பிட்ட சமூக நிலையாக விளக்காமல் பொதுவாக வைத்தல்
  alternative: திருமண நிலை, சமூக அந்தஸ்து அல்லது தொழில் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: உடனடி சூழல் பல வாழ்க்கைச் சூழல்களைப் பேசினாலும், இந்த வசனத்தின் சொற்கள் பொதுவானவை; மொழிபெயர்ப்பு அவற்றை ஓர் ஒற்றை வகைக்குள் சுருக்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் பொதுவாசிப்பிற்கான தெளிவும் காக்கப்பட்டுள்ளன. ‘ஆயினும்’ உரையோட்டத் திருப்பை இயல்பாகக் காட்டுகிறது. ‘நடக்கட்டும்’ என்ற வேதாகம உருவகம் அடிக்குறிப்பின் உதவியுடன் காக்கப்பட்டுள்ளது; பாலினத்தால் கட்டுப்படுத்தப்படாத ‘ஒவ்வொருவரும்’ பயன்படுத்தப்பட்டுள்ளது.
