revisions:
- from: ஆயினும், ஆண்டவர் ஒவ்வொருவருக்கும் பகிர்ந்தளித்திருக்கிறபடியும்[a], தேவன் ஒவ்வொருவரை அழைத்திருக்கிறபடியும், ஒவ்வொருவரும் அப்படியே நடக்கட்டும்[b]. இவ்வாறே எல்லாத் திருச்சபைகளிலும் நான் கட்டளையிடுகிறேன்.
  to: ஆனால், ஆண்டவர் ஒவ்வொருவருக்கும் எவ்வாறு பங்கிட்டுள்ளாரோ, தேவன் ஒவ்வொருவரை எவ்வாறு அழைத்துள்ளாரோ, அவ்வாறே ஒவ்வொருவரும் நடக்கட்டும்[a]. இவ்வாறே எல்லாத் திருச்சபைகளிலும் நான் கட்டளையிடுகிறேன்.
  rationale: 'The revision restores the Greek comparative pattern and retains the repeated individual emphasis: the Lord’s allotment and God’s call provide the stated pattern for each person’s conduct. Footnote markers are reassigned so that the life-conduct note remains attached to ‘நடக்கட்டும்,’ while the lexical alternative for ἐμέρισεν is anchored to ‘பங்கிட்டுள்ளாரோ.’ No theological interpretation of the respective referents or of the allotted circumstance has been added.'
