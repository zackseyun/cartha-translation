  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: ta
  text: அழுகிறவர்கள் அழாமல் இருப்பதுபோலும், மகிழ்கிறவர்கள் மகிழாமல் இருப்பதுபோலும், வாங்குகிறவர்கள் தமக்கென உடைமையாகக் கொண்டிராமல் இருப்பதுபோலும் இருக்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அழாதவர்களைப்போலும் … மகிழாதவர்களைப்போலும் … உடைமை கொண்டிராதவர்களைப்போலும்.’ கிரேக்கத்தில் ‘...அல்லாதது போல’ என்ற அமைப்பு மீண்டும் மீண்டும் வருகிறது. இவை உண்மையில் நிகழ்வதையே மறுப்பதற்காக அல்ல; அவற்றின் நடுவில் ஒருவர் எவ்வாறு வாழ வேண்டும் என்பதைக் காட்டுவதற்காகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: அழுகிறவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது; ‘துக்கப்படுகிறவர்கள்’ என்பதைவிட அழுகை என்னும் வெளிப்படையான செயலைப் பாதுகாக்கிறது.
- source_word: ὡς μὴ κλαίοντες
  choice: அழாதவர்களைப் போல
  rationale: ὡς μή + பங்கேற்புவினை உண்மையில் அவர்கள் அழவில்லை என்று மறுப்பதல்ல; அழுகையை எவ்வாறு அணுக வேண்டும் என்ற வாழ்க்கைநிலையைக் குறிக்கிறது. சுருக்கமான கிரேக்க இணைநிலையைத் தமிழ் இயல்புடன் தக்கவைக்கிறது.
- source_word: χαίροντες
  choice: மகிழ்கிறவர்கள்
  rationale: χαίρω என்பதன் பொதுவான பவுலியப் பொருளான மகிழ்தலை, இன்றைய வாசகருக்கு இயல்பான உயர்நடையில் தெரிவிக்கிறது.
- source_word: ὡς μὴ χαίροντες
  choice: மகிழாதவர்களைப் போல
  rationale: முந்தைய ὡς μή அமைப்புடன் இணையான சொல்லமைப்பையும் பவுலின் வலியுறுத்தும் ஒத்திசைவையும் பாதுகாக்கிறது.
- source_word: ἀγοράζοντες
  choice: வாங்குகிறவர்கள்
  rationale: அன்றாட வணிகப் பெறுதலைக் குறிக்கும் நேரடியான, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: κατέχοντες
  choice: உடைமை கொண்டிருப்பவர்கள்
  rationale: இச்சூழலில் κατέχω என்பது வெறுமனே பிடித்திருப்பதைக் காட்டிலும், வாங்கியதைத் தனக்குரிய நிலையான உடைமையாகக் கொண்டிருப்பதைக் குறிக்கிறது.
- source_word: καὶ
  choice: மேலும் / -வும்
  rationale: மீண்டும் வரும் καὶ தொடர்களைத் தமிழில் தொடக்க ‘மேலும்’ மற்றும் இணைநிலை ‘-வும்’ விகுதிகள் மூலம் தாளநயத்துடன் இணைக்கிறது.
theological_decisions:
- issue: மீண்டும் வரும் ὡς μή (‘...அல்லாதவர்களைப் போல’) அமைப்பின் பொருள்
  choice: அழுகை, மகிழ்ச்சி, வாங்குதல் ஆகியவை நிகழ்வதை மறுக்காமல், அவற்றை இறுதியானவை அல்லது முழுமையாகத் தம்மைக் கட்டுப்படுத்துபவை எனக் கருதாத வாழ்க்கைநிலையை உரை வலியுறுத்துகிறது.
  alternative: இந்தச் செயல்களையே முற்றிலும் தவறானவை எனக் கருதும் கடுமையான துறவற வாசிப்பு; அல்லது சுற்றியுள்ள முடிவுக்காலச் சூழலைப் புறக்கணிக்கும் முற்றிலும் உளவியல் சார்ந்த வாசிப்பு.
  rationale: 1 கொரிந்தியர் 7:26, 31 ஆகியவற்றின் சூழல் ‘தற்போதைய நெருக்கடி’யையும் ‘இவ்வுலகத்தின் தோற்றம் கடந்துபோகிறது’ என்பதையும் எடுத்துரைக்கிறது. ὡς μή + பங்கேற்புவினை முழுமையான மறுப்பை அல்ல, வாழும் முறையையோ மனநிலையையோ குறிக்கிறது; ஆகவே மொழிபெயர்ப்பு துறவறத் தடையைச் சேர்க்காமல் உரையின் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று இணைத் தொடர்களிலும் ‘-வும்’ மற்றும் ‘...வர்களைப் போல’ என்பவை மீண்டும் வருவதால் மூலத்தின் தாளநயமும் சொல்லிணைவும் காக்கப்படுகின்றன. முந்தைய வசனத்திலிருந்து தொடரும் அறிவுறுத்தல் தமிழில் முழுமையான வாக்கியமாகத் தெளிவதற்காக ‘இருக்கட்டும்’ சேர்க்கப்பட்டுள்ளது.
