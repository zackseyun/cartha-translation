- from: மேலும், அழுகிறவர்கள் அழாதவர்களைப் போலவும்[a], மகிழ்கிறவர்கள் மகிழாதவர்களைப் போலவும், வாங்குகிறவர்கள் உடைமை கொண்டிராதவர்களைப் போலவும் இருக்கட்டும்.
  to: அழுகிறவர்கள் அழாமல் இருப்பதுபோலும், மகிழ்கிறவர்கள் மகிழாமல் இருப்பதுபோலும், வாங்குகிறவர்கள் தமக்கென உடைமையாகக் கொண்டிராமல் இருப்பதுபோலும் இருக்கட்டும்.[a]
  rationale: திருத்தம் ὡς μὴ + பங்கேற்புவினை அமைப்பைத் தமிழில் இயல்பான வினைநிலையாகத் தருகிறது; மூன்று தொடர்களின் இணைநிலையையும் காக்கிறது. κατέχοντες என்பதன் உடைமைப் பற்றுதல் நுணுக்கம் ‘தமக்கென உடைமையாகக் கொண்டிராமல்’ என்பதில் வெளிப்படுகிறது. அடிக்குறிப்பு மூல இலக்கண அமைப்பைத் துல்லியமாக விளக்குமாறு திருத்தப்பட்டுள்ளது; செயல்கள் தாமே மறுக்கப்படுகின்றன என்ற பொருள் சேர்க்கப்படவில்லை.
