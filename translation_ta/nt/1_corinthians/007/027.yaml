base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: ta
  text: நீ மனைவியுடன் பிணைக்கப்பட்டிருக்கிறாயா? விடுதலையைத் தேடாதே[a]. மனைவியிடமிருந்து விடுவிக்கப்பட்டிருக்கிறாயா? மனைவியைத் தேடாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, பொருளை விளக்கமாக: “உனக்குத் திருமணமாகியிருக்கிறதா? விவாகரத்தை நாடாதே. விவாகரத்து செய்தவரா? மனைவியைத் தேடாதே.” கிரேக்க மூலத்தில் இன்னும் சொல்லுக்குச் சொல்லாக “பிணைக்கப்பட்டிருத்தல்,” “விடுதலை,” “விடுவிக்கப்பட்டிருத்தல்” என்ற சொற்கள் வருகின்றன.'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: பிணைக்கப்பட்டிருக்கிறாயா
  rationale: δέω என்பதன் நிறைவேற்றப்பட்ட நிலையைச் சுட்டும் வடிவம்; திருமணப் பிணைப்பை வெளிப்படுத்தும் உருவகத்தையும், தொடர்ந்து வரும் λύσιν/λέλυσαι ஆகியவற்றுடனான எதிரிணையையும் காக்கிறது.
- source_word: γυναικί
  choice: மனைவியுடன்
  rationale: திருமணச் சூழலில் γυνή என்பது பொதுவாக ‘பெண்’ அல்ல, ‘மனைவி’ என்பதைக் குறிக்கிறது; தமிழ் வழக்கில் ‘மனைவியுடன் பிணைக்கப்பட்டு’ என்பது இயல்பான இணைவு.
- source_word: ζήτει
  choice: தேடாதே
  rationale: ζητέω என்பதன் தேடுதல்/நாடுதல் பொருளையும் தடை கட்டளையின் வலிமையையும் நேரடியாகக் காக்கிறது.
- source_word: λύσιν
  choice: விடுதலையை
  rationale: கட்டிலிருந்து அவிழ்த்தல் அல்லது விடுவித்தல் என்ற λύσις-இன் பொருளைக் காக்கிறது; ‘விவாகரத்து’ என்று மொழிபெயர்த்து கிரேக்கத்தைவிடக் குறுகலாக வரையறுக்கவில்லை.
- source_word: λέλυσαι
  choice: விடுவிக்கப்பட்டிருக்கிறாயா
  rationale: λύω என்பதன் விளைவுநிலை தொடர்வதைச் சுட்டுகிறது; முதல் வாக்கியத்தின் ‘பிணைக்கப்பட்டிருக்கிறாயா’ என்பதற்கு இணையான எதிரிணையைத் தக்கவைக்கிறது.
- source_word: ἀπὸ γυναικός
  choice: மனைவியிடமிருந்து
  rationale: ἀπό-வின் பிரிதல் பொருளை ‘இடமிருந்து’ இயல்பாகத் தருகிறது; சூழலுக்கேற்ப γυνή ‘மனைவி’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: γυναῖκα
  choice: மனைவியை
  rationale: இங்கு தேடப்படுவது திருமணத் துணை என்பதால் ‘பெண்ணை’ என்பதைக் காட்டிலும் ‘மனைவியை’ என்பது சூழலுக்கு துல்லியமானது.
theological_decisions:
- issue: வசனத்தை வெளிப்படையான ‘திருமணம்/விவாகரத்து’ சொற்களால் தருவதா, அல்லது பவுலின் பிணைப்பு/விடுதலை உருவகத்தைத் தக்கவைப்பதா
  choice: முதன்மை உரையில் ‘பிணைக்கப்பட்டு’ மற்றும் ‘விடுவிக்கப்பட்டு’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உனக்குத் திருமணமாகியிருக்கிறதா? விவாகரத்தை நாடாதே. விவாகரத்தானவனா? மனைவியைத் தேடாதே.’
  rationale: கிரேக்கம் திருமணம் மற்றும் விவாகரத்துக்கான மிகத் தெளிவான சட்டச் சொற்களைப் பயன்படுத்தாமல் δέω/λύω என்ற பிணைத்தல்/விடுவித்தல் மொழியைப் பயன்படுத்துகிறது. உருவகத்தைத் தக்கவைப்பது மூலத்திற்கு வெளிப்படையாக இருந்து, விவாகரத்து, துணை மரணம், அல்லது வேறு பிரிவு ஆகியவற்றுள் ஒன்றை மட்டும் தேவையின்றித் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை முன்னிலையைப் பயன்படுத்தும் நேரடியான கேள்வி–கட்டளை நடையில் வடிவமைக்கப்பட்டது. ‘பிணைக்கப்பட்டிருக்கிறாயா/விடுவிக்கப்பட்டிருக்கிறாயா’ என்ற சற்றே உயர்ந்த ஆனால் புரிந்துகொள்ளக்கூடிய சொற்கள், மூலத்தின் உருவகத்தையும் நிறைவேற்றப்பட்ட நிலையின் தொடர்ச்சியையும் காக்கின்றன.
