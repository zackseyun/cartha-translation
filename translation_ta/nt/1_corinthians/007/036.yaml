id: 1CO.7.36
reference: 1 Corinthians 7:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: ta
  text: ஆனால் ஒருவன் தன்னுடைய கன்னிப்பெண்ணிடம்[a] தகாத விதத்தில் நடந்துகொள்வதாக எண்ணினால், அவள் இளமைப்பருவத்தைக் கடந்துவிட்டிருந்தால், அப்படியே ஆக வேண்டியிருந்தால், அவன் தான் விரும்புவதைச் செய்யட்டும்; அவன் பாவம் செய்வதில்லை. அவர்கள் திருமணம் செய்துகொள்ளட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்கு நிச்சயிக்கப்பட்ட கன்னிப்பெண்ணிடம்/தன் வருங்கால மனைவியிடம்.” மரபாக இது “தன் கன்னி மகளிடம்” என்றும் புரிந்துகொள்ளப்பட்டுள்ளது. கிரேக்கச் சொற்றொடர் தெளிவற்றது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: தகாத விதத்தில் நடந்துகொள்வதாக
  rationale: தகுதியற்ற அல்லது முறையற்ற நடத்தையைக் குறிக்கும் வினைச்சொல்லை, ஒழுக்கக்கேட்டை அளவுக்கு மீறி வலியுறுத்தாமல் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: தன்னுடைய கன்னிப்பெண்ணிடம்
  rationale: παρθένος என்பதன் அடிப்படைப் பொருளான ‘கன்னிப்பெண்’ என்பதையும் αὐτοῦ தரும் உடைமைத் தொடர்பையும் வைத்திருக்கிறது; அந்தப் பெண் நிச்சயிக்கப்பட்டவளா அல்லது மகளா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
- source_word: ὑπέρακμος
  choice: இளமைப்பருவத்தைக் கடந்துவிட்டிருந்தால்
  rationale: இளமையின் உச்சம் அல்லது மலர்ச்சிப் பருவத்தைக் கடந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; குறிப்பிட்ட நவீன வயதுவரம்பைச் சேர்ப்பதில்லை.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: அப்படியே ஆக வேண்டியிருந்தால்
  rationale: ὀφείλει என்பதிலுள்ள தேவை அல்லது கடமை உணர்வையும் γίνεσθαι என்பதின் பொதுவான ‘ஆகுதல்/நிகழ்தல்’ பொருளையும் காக்கிறது; தேவை எதனால் வந்தது என்பதைச் சேர்த்துக் கூறுவதில்லை.
- source_word: ὃ θέλει ποιείτω
  choice: அவன் தான் விரும்புவதைச் செய்யட்டும்
  rationale: மூன்றாம் நபர் கட்டளை வடிவின் அனுமதிக்கும் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: οὐχ ἁμαρτάνει
  choice: அவன் பாவம் செய்வதில்லை
  rationale: செயல் பாவமானதல்ல என்ற அறநெறி அனுமதியை நேரடியாகத் தருகிறது.
- source_word: γαμείτωσαν
  choice: அவர்கள் திருமணம் செய்துகொள்ளட்டும்
  rationale: இரண்டு தரப்பினரையும் குறிக்கும் மூன்றாம் நபர் பன்மைக் கட்டளையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ‘தன்னுடைய கன்னிப்பெண்’ (παρθένον αὐτοῦ) என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் ‘தன்னுடைய கன்னிப்பெண்’ என்று வைத்து கிரேக்கத்தின் தெளிவின்மையைப் பாதுகாத்தல்
  alternative: அவனுக்கு நிச்சயிக்கப்பட்ட கன்னிப்பெண்/வருங்கால மனைவி; அல்லது அவன் பொறுப்பிலுள்ள கன்னி மகள்
  rationale: இச்சொற்றொடர் ஒரு ஆணுக்கும் அவனுக்கு நிச்சயிக்கப்பட்ட பெண்ணுக்கும் இடையேயான தொடர்பையோ, ஒரு தந்தை அல்லது பாதுகாவலருக்கும் அவன் பொறுப்பிலுள்ள கன்னி மகளுக்கும் இடையேயான தொடர்பையோ குறிக்கலாம். மூலமொழி இதைத் தீர்மானிக்காததால் முதன்மை உரையும் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் சுருக்கமும் விளக்கப்படாத தேவையும் பாதுகாக்கப்பட்டுள்ளன; ‘கன்னிப்பெண்’ யார் என்ற உண்மையான பொருள் தெளிவின்மை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
