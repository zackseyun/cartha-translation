revisions:
- from: 'மற்றவர்களுக்கோ நான் சொல்கிறேன்—கர்த்தர் அல்ல: ஒரு சகோதரனுக்கு நம்பாத மனைவி இருந்து, அவள் அவனோடு வாழச் சம்மதித்தால், அவன் அவளை விவாகரத்து செய்யக் கூடாது.[a]'
  to: 'மற்றவர்களிடம் நான் சொல்கிறேன்—கர்த்தர் அல்ல, நானே: ஒரு சகோதரனுக்கு விசுவாசியல்லாத மனைவி இருந்தால், அவள் அவனோடு வாழச் சம்மதித்தால், அவன் அவளை விவாகரத்து செய்யக்கூடாது.[a]'
  rationale: The revision resolves the Tamil ambiguity in the parenthetical “I—not the Lord,” preserves the emphatic contrast through «நானே», and replaces an awkward conditional phrase with idiomatic modern Tamil. It retains the source’s gender-specific «சகோதரன்», the wife’s consent to shared residence, and the marital sense of the final prohibition. The footnote continues to preserve the lexical range of ἀφίημι without weakening the contextual rendering “divorce.”
