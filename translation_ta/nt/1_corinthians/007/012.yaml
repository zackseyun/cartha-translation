review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the remaining addressees, the case of a male believer with an unbelieving wife, her willingness to cohabit, and the prohibition against ending the marriage. However, «நான் சொல்கிறேன்—கர்த்தர் அல்ல» is structurally ambiguous in Tamil and does not clearly preserve the Greek emphasis, “I—not the Lord—say.”
  naturalness: The conditional phrase «ஒரு சகோதரனுக்கு நம்பாத மனைவி இருந்து» is less idiomatic than «ஒரு சகோதரனுக்கு விசுவாசியல்லாத மனைவி இருந்தால்». The revised wording is natural modern standard Tamil while retaining a suitably dignified biblical register.
  terminology: «விசுவாசியல்லாத» clearly denotes one who does not share Christian faith and avoids the possible ambiguity of «நம்பாத». «விவாகரத்து செய்யக்கூடாது» appropriately gives the marital force of ἀφίημι; the footnote supplies closer lexical alternatives.
  issues:
  - severity: medium
    issue: The parenthetical attribution is ambiguous.
    rationale: «நான் சொல்கிறேன்—கர்த்தர் அல்ல» can be parsed awkwardly as though “I” is being identified as not the Lord. Greek λέγω ἐγώ, οὐχ ὁ κύριος emphasizes that Paul, rather than the Lord, is giving this instruction. Reordering to «கர்த்தர் அல்ல, நானே» makes the contrast explicit without adding an interpretive claim about authority.
  - severity: low
    issue: The expression for an unbelieving wife is somewhat unnatural and potentially broad.
    rationale: «நம்பாத மனைவி இருந்து» is not the smoothest conditional construction, and «நம்பாத» may be heard generally as “untrusting.” «விசுவாசியல்லாத மனைவி இருந்தால்» is idiomatic and contextualizes ἄπιστος as lack of Christian faith.
  revised_text: 'மற்றவர்களிடம் நான் சொல்கிறேன்—கர்த்தர் அல்ல, நானே: ஒரு சகோதரனுக்கு விசுவாசியல்லாத மனைவி இருந்தால், அவள் அவனோடு வாழச் சம்மதித்தால், அவன் அவளை விவாகரத்து செய்யக்கூடாது.[a]'
