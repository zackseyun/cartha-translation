  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: ta
  text: 'மற்றவர்களிடம் நான் சொல்கிறேன்—கர்த்தர் அல்ல, நானே: ஒரு சகோதரனுக்கு விசுவாசியல்லாத மனைவி இருந்தால், அவள் அவனோடு வாழச் சம்மதித்தால், அவன் அவளை விவாகரத்து செய்யக்கூடாது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளை விட்டுவிடக்கூடாது” அல்லது “அவளை அனுப்பிவிடக்கூடாது.” கிரேக்க வினைச்சொல்லை இன்னும் நேரடியாக “விட்டுவிடுதல்” அல்லது “அனுப்பிவிடுதல்” என்று மொழிபெயர்க்கலாம்; இங்கு அது திருமண உறவை முடிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: மற்றவர்களுக்கோ
  rationale: முந்தைய அறிவுறுத்தலில் குறிப்பிடப்படாத மீதமுள்ளவர்களைக் குறிக்கிறது; δέ-யின் மென்மையான மாற்றத்தையும் ‘-ஓ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: நான் சொல்கிறேன்—கர்த்தர் அல்ல
  rationale: ἐγώ என்பதன் வலியுறுத்தலை வெளிப்படையான ‘நான்’ காக்கிறது; இடைச்செருகல் தன்மையை நீண்ட கோடுகள் காட்டுகின்றன.
- source_word: ἀδελφὸς
  choice: ஒரு சகோதரன்
  rationale: இங்கு மனைவியுடன் எதிரிணையாகக் குறிப்பிடப்படும் ஆண் விசுவாசியை பாலினத் துல்லியத்துடன் குறிக்கிறது.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: நம்பாத மனைவி இருந்து
  rationale: திருமண உறவைக் குறிக்கும் கிரேக்கச் சொற்றொடரை இயல்பான தமிழில் தருகிறது; ἄπιστος என்பதை மணவுறவில் உண்மையற்றவள் என்று தவறாகப் புரிந்துகொள்ளாமல், விசுவாசிக்காதவள் என்ற பொருளில் ‘நம்பாத’ என வழங்குகிறது.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: அவள் … சம்மதித்தால்
  rationale: சேர்ந்து வாழும் ஏற்பாட்டுக்கு அவள் மனப்பூர்வமாக ஒப்புக்கொள்வதைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: அவனோடு வாழ
  rationale: பகிர்ந்த குடும்ப வாழ்வை நவீன, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: அவன் அவளை விவாகரத்து செய்யக் கூடாது
  rationale: திருமணச் சூழலில் ἀφίημι குறிக்கும் உறவை முடித்தலைத் தெளிவாக்குகிறது; சொல்லின் நேரடி மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: ‘நான் சொல்கிறேன்—கர்த்தர் அல்ல’ என்ற பவுலின் கூற்று
  choice: இயேசுவின் பூவுலக ஊழியத்தின்போது அவர் நேரடியாகக் கூறிய போதனைக்கும், இங்கு பவுல் அளிக்கும் அறிவுறுத்தலுக்கும் உள்ள வேறுபாட்டை மட்டும் மொழிபெயர்ப்பில் காக்கிறது.
  alternative: இது அதிகாரமற்ற பவுலின் தனிப்பட்ட கருத்து என்று வெளிப்படையாக விளக்குவது.
  rationale: மூலவாக்கியம் உருவாக்கும் வேறுபாட்டையும் இறையியல் பதற்றத்தையும் காக்கிறது; பவுலின் அதிகாரம் அல்லது ஏவுதல் குறித்து மொழிபெயர்ப்பே கூடுதல் தீர்ப்பளிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நம்பிக்கையற்ற’ என்பது நம்பத்தகாதவள் என்ற பொருளைத் தரக்கூடும் என்பதால் ‘நம்பாத’ தேர்ந்தெடுக்கப்பட்டது; ‘விவாகரத்து’ என்பது இச்சூழலின் திருமணப் பொருளைத் தெளிவாக்குகிறது.
