  naturalness: ‘அப்படிப்பட்டவனைச் சாத்தானிடம் ஒப்புக்கொடுக்க வேண்டும்’ நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. ‘ஆவி இரட்சிக்கப்படும்படி’ என்பது வேதாகமச் சூழலுக்கு ஏற்ற, தெளிவான நடை; இவ்வசனத்தின் சூழலில் உடைமைப்பெயர் இன்றியும் குறிப்பு இயல்பாகப் புரிகிறது.
