- from: அப்படிப்பட்டவனைச் சாத்தானிடம் ஒப்புக்கொடுக்க வேண்டும்; அவனுடைய மாம்சம் அழிவதற்காக[a], ஆண்டவரின் நாளில் அவனுடைய ஆவி மீட்கப்படும்படி.[b]
  to: அப்படிப்பட்டவனைச் சாத்தானிடம் ஒப்புக்கொடுக்க வேண்டும்; மாம்சத்தின் அழிவுக்காக[a], ஆவி ஆண்டவரின் நாளில் இரட்சிக்கப்படும்படி.[b]
  rationale: திருத்தப்பட்ட உரை παραδοῦναι, εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ, ἐν τῇ ἡμέρᾳ τοῦ κυρίου ஆகியவற்றின் அமைப்பையும் பொருளையும் காக்கிறது. மூலத்தில் இல்லாத உடைமைப்பெயர்கள் நீக்கப்பட்டதால் ‘மாம்சம்’ மற்றும் ‘ஆவி’ குறித்த மூலத்தின் கட்டுப்படுத்தப்பட்ட தெளிவின்மை தக்கவைக்கப்படுகிறது. சுவடி வேறுபாட்டுக்கான அடிக்குறிப்பு அதன் உரிய இணைப்பிடமான ‘ஆண்டவரின் நாளில்’ என்பதன் பின் வைக்கப்பட்டுள்ளது.
