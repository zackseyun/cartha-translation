base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: ta
  text: அப்படிப்பட்டவனைச் சாத்தானிடம் ஒப்புக்கொடுக்க வேண்டும்; மாம்சத்தின் அழிவுக்காக[a], ஆவி ஆண்டவரின் நாளில் இரட்சிக்கப்படும்படி.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாம்சத்தின் அழிவு’ என்பது கடுமையான உடல்சார் தண்டனையைச் சுட்டலாம்; அல்லது பாவமிக்க, மாம்சத்திற்குரிய மனப்போக்கின் அழிவை உருவகமாகச் சுட்டலாம்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் ‘ஆண்டவரின்’ என்பதற்குப் பதிலாக ‘நம்முடைய ஆண்டவர் இயேசுவின்’ அல்லது ‘ஆண்டவர் இயேசுவின்’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: ஒப்புக்கொடுக்க வேண்டும்
  rationale: சபையார் மேற்கொள்ள வேண்டிய நடவடிக்கையை இயல்பான நவீனத் தமிழில் வலுவாகக் காட்டுகிறது; ஒருவரை மற்றொருவரின் அதிகாரத்திற்கு ஒப்படைக்கும் பொருளையும் தக்கவைக்கிறது.
- source_word: τὸν τοιοῦτον
  choice: அப்படிப்பட்டவனை
  rationale: குறிப்பிட்ட குற்றவாளியைக் குறிக்கும்போதே கிரேக்கச் சொற்றொடரின் வகைப்படுத்தும் தொனியையும் தக்கவைக்கிறது.
- source_word: Σατανᾷ
  choice: சாத்தானிடம்
  rationale: தமிழில் வழக்கிலுள்ள பெயர்வடிவம்; ஒப்புக்கொடுத்தலின் பெறுநரைத் தெளிவாகக் குறிக்கிறது.
- source_word: εἰς ὄλεθρον τῆς σαρκός
  choice: அவனுடைய மாம்சம் அழிவதற்காக
  rationale: ὄλεθρος என்பதன் கடுமையான ‘அழிவு’ பொருளையும் σάρξ என்பதன் திட்டமிட்ட தெளிவின்மையையும் தக்கவைக்கிறது. தமிழ் வாக்கியத்தில் இயல்புக்கும் குறிக்கப்படுகிற நபருடனான தொடர்புக்கும் ‘அவனுடைய’ சேர்க்கப்பட்டது; இது பொருளை உடலுக்கு மட்டும் கட்டுப்படுத்துவதில்லை.
- source_word: ἵνα
  choice: மீட்கப்படும்படி
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ πνεῦμα
  choice: அவனுடைய ஆவி
  rationale: கிரேக்கத்தில் தனிப்பட்ட உடைமைப்பெயர் இல்லாவிட்டாலும், தமிழில் ‘ஆவி’ மட்டும் எனக் கூறுவது இங்கு செயற்கையாகவும் தெளிவற்றதாகவும் இருக்கும்; சூழல் அந்த மனிதனின் ஆவியைக் குறிக்கிறது. இதனை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: σωθῇ
  choice: மீட்கப்படும்படி
  rationale: இறையியல் சார்ந்த ‘save’ என்ற பொருளை நவீனத் தமிழில் இயல்பாக வழங்கி, இறுதியில் நிகழ வேண்டிய நோக்கத்தையும் காக்கிறது.
- source_word: ἐν τῇ ἡμέρᾳ τοῦ κυρίου
  choice: ஆண்டவரின் நாளில்
  rationale: கிரேக்கத்தின் இறுதிக்காலச் சொற்றொடரைச் சுருக்கமாகவும் வழக்கமான வேதாகமத் தமிழிலும் தருகிறது; மூல உரையில் இல்லாத ‘இயேசு’ என்பதைச் சேர்க்கவில்லை.
