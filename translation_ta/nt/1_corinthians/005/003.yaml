base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: ta
  text: ஏனெனில், நான் உடலால் அங்கே இல்லாவிட்டாலும், ஆவியில் அங்கே இருப்பவனாக[b], அங்கே இருப்பதுபோலவே, இப்படிப்பட்ட செயலைச் செய்தவனுக்கு ஏற்கெனவே தீர்ப்பளித்துவிட்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏற்கெனவே முடிவு செய்துவிட்டேன்.”
    reason: lexical_alternative
  - marker: b
    text: “ஆவியில் அங்கே இருப்பவனாக” என்பது பெரும்பாலும் பவுலின் சொந்த ஆவியைக் குறிக்கிறது; பரிசுத்த ஆவியைக் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ஆகவே
  rationale: முந்தைய வசனத்துடன் உள்ள விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; தமிழ் வாக்கிய ஒழுங்குக்கேற்ப இரண்டாம் வாக்கியத்தின் தொடக்கத்தில் அமைக்கப்பட்டுள்ளது.
- source_word: ἀπὼν τῷ σώματι
  choice: உடலால் அங்கே இல்லாவிட்டாலும்
  rationale: உடல் சார்ந்த வராமையைக் குறிக்கிறது; மரணம் அல்லது உடலைவிட்டு பிரிந்த நிலை என்ற எண்ணத்தைத் தவிர்க்க ‘அங்கே’ சேர்க்கப்பட்டுள்ளது.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: ஆவியில் அங்கே இருக்கிறேன்
  rationale: உடல்–ஆவி என்ற கிரேக்க எதிர்மறை இணைப்பைப் பாதுகாக்கிறது; ‘ஆவி’ பவுலின் ஆவியா தூய ஆவியா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
- source_word: ἤδη κέκρικα
  choice: ஏற்கெனவே தீர்ப்பளித்துவிட்டேன்
  rationale: முடிவுக்கு வந்த தீர்ப்பு தொடர்ந்து செல்லுபடியாக இருப்பதை நிறைவுவினை வடிவம் வெளிப்படுத்துகிறது.
- source_word: ὡς παρὼν
  choice: நான் அங்கே இருப்பதுபோலவே
  rationale: உடலால் அங்கே இருந்தால் எப்படித் தீர்ப்பாரோ அதேபோல் தீர்த்ததாகக் கூறும் ஒப்பீட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: τὸν ... κατεργασάμενον
  choice: செய்தவனை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பங்கேற்புவினையை சுருக்கமாகவும் இயல்பாகவும் தருகிறது; கிரேக்கத்தில் இல்லாத ‘மனிதன்’ என்பதைச் சேர்க்கவில்லை.
- source_word: οὕτως τοῦτο
  choice: இப்படிப்பட்ட செயலை
  rationale: τοῦτο சுட்டும் செயலும் οὕτως காட்டும் அதிர்ச்சியூட்டும் தன்மையும் தமிழில் ஒருங்கே வெளிப்படுகின்றன.
theological_decisions:
- issue: ‘ஆவியில் அங்கே இருக்கிறேன்’ என்பதன் பொருள்
  choice: மூல உரையின் ‘ஆவியில்’ என்ற திறந்த சொற்றொடரைப் பாதுகாத்தல்
  alternative: ‘என் ஆவியில் அங்கே இருக்கிறேன்’ அல்லது ‘தூய ஆவியால் அங்கே இருக்கிறேன்’
  rationale: σώματι–πνεύματι என்ற உடல்–ஆவி எதிர்மறை அமைப்பு பவுலின் சொந்த ஆவியைக் குறிக்க வாய்ப்புள்ளது; ஆயினும் மொழிபெயர்ப்பில் ‘என்’ அல்லது ‘தூய’ என்று சேர்ப்பது மூலத்தில் உள்ள இறையியல் திறந்தநிலையைத் தேவையின்றி முடிவுசெய்யும்.
- issue: κρίνω என்பதன் ஒழுங்காற்று வலிமை
  choice: தீர்ப்பளித்துவிட்டேன்
  alternative: முடிவு செய்துவிட்டேன்
  rationale: சபை ஒழுங்காற்றுச் சூழலில் நீதித்தீர்ப்பு சார்ந்த வலிமையைப் பாதுகாக்கிறது; வெறும் தனிப்பட்ட முடிவு என்ற அளவுக்குச் சொற்றொடரை மெலிதாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது; வாதத் தொடர்பும் உடல்–ஆவி எதிர்மறையும் காக்கப்பட்டன. அனைத்து அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
