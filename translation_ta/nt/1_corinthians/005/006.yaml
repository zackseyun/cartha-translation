review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the Greek syntax and sense: the Corinthians'' boasting is negatively evaluated, followed by the rhetorical question and the proverbial image that a small amount of leaven affects all the dough. The metaphor is appropriately left unexplained. “புளித்த மாவு” is a defensible rendering of ζύμη in its ancient baking sense.'
  naturalness: “நீங்கள் பெருமைபாராட்டுவது” is understandable but less idiomatic in modern standard Tamil than “நீங்கள் பெருமை பேசுவது.” The revised question also removes an unnecessary pause after the subject and uses a more natural connective before the embedded statement.
  terminology: “புளித்த மாவு,” “பிசைந்த மாவு முழுவதையும்,” and “புளிக்க வைக்கிறது” preserve the concrete baking terminology and the lexical relationship between ζύμη and ζυμοῖ. No theological interpretation is added.
  issues:
  - severity: low
    issue: Less natural expression for καύχημα
    rationale: “பெருமைபாராட்டுவது” is comprehensible, but “பெருமை பேசுவது” is the more customary modern Tamil expression for boast/boasting in this rebuking context.
  - severity: low
    issue: Slightly awkward sentence flow
    rationale: The comma after “புளித்த மாவு” and the construction “செய்கிறது என்பது” make the rhetorical question less fluid than necessary in modern Tamil.
