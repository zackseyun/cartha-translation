id: 1CO.5.6
reference: 1 Corinthians 5:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: ta
  text: நீங்கள் பெருமை பேசுவது நல்லதல்ல. சிறிதளவு புளித்த மாவு பிசைந்த மாவு முழுவதையும் புளிக்க வைக்கிறது என்று உங்களுக்குத் தெரியாதா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாவுப் பிண்டம் முழுவதையும்.”
    reason: φύραμα என்பதற்கான சொல்-நெருக்கமான மாற்று. முதன்மை உரையில் உள்ள “பிசைந்த மாவு” நவீன வாசகருக்குத் தெளிவான பொருளைத் தருகிறது.
lexical_decisions:
- source_word: καλὸν
  choice: நல்லதல்ல
  rationale: இங்கு καλός கொரிந்தியர்களின் பெருமைபாராட்டுதலை ஒழுக்க மற்றும் நடைமுறை அடிப்படையில் மதிப்பிடுகிறது; “நல்லதல்ல” என்பது நேரடியான, இயல்பான தமிழ்.
- source_word: καύχημα
  choice: பெருமைபாராட்டுவது
  rationale: இந்தப் பெயர்ச்சொல் பெருமை பேசும் செயலை அல்லது அதற்கான காரணத்தைக் குறிக்கலாம். இச்சூழலின் கண்டிக்கும் தொனிக்கு செயப்பெயர் வடிவமான “பெருமைபாராட்டுவது” இயல்பாகப் பொருந்துகிறது.
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாதா?
  rationale: பவுலின் சொல்லாட்சியிலுள்ள வினாவடிவத்தைப் பாதுகாத்து, நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: μικρὰ ζύμη
  choice: சிறிதளவு புளித்த மாவு
  rationale: ζύμη என்பது மாவைப் புளிக்கச் செய்யப் பயன்படுத்தப்படும் புளித்த மாவைக் குறிக்கிறது. “சிறிதளவு” அதன் குறைந்த அளவையும் பழமொழித் தன்மையையும் காக்கிறது.
- source_word: ὅλον τὸ φύραμα
  choice: பிசைந்த மாவு முழுவதையும்
  rationale: φύραμα என்பது கலந்து பிசையப்பட்ட மாவுத் தொகுதியைக் குறிக்கிறது; “பிசைந்த மாவு முழுவதையும்” என்பது அதன் பொருளையும் ὅλον என்பதன் முழுமையையும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ζυμοῖ
  choice: புளிக்கச் செய்கிறது
  rationale: ζύμη உடனான மூலச்சொல் தொடர்பையும், மாவு முழுவதிலும் புளிப்பு பரவும் செயற்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: புளித்த மாவு உருவகத்தின் பொருள்
  choice: உருவகத்தை விளக்கிச் சேர்க்காமல் அப்படியே வைத்தல்
  alternative: “சிறிதளவு பாவம் சபை முழுவதையும் கெடுக்கிறது” என்று பொருளை விரித்துரைத்தல்
  rationale: வசனம் பழமொழி வடிவிலான உருவகத்தையே கூறுகிறது; அதன் ஒழுக்கப் பயன்பாட்டைச் சூழல் விளக்குகிறது. மொழிபெயர்ப்பு அதைத் தனியே தீர்மானித்து விரிவாக்காமல், மூலத்திலுள்ள உருவகத்தையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்டிக்கும் தொனியையும் பவுலின் வினாவடிவத்தையும் காக்கும் கண்ணியமான நடை. பழமையான அல்லது தெளிவற்ற சமையல் சொற்களுக்குப் பதிலாக எளிதில் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மாற்றுச் சொல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
