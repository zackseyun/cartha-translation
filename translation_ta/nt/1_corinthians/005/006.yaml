revisions:
- from: நீங்கள் பெருமைபாராட்டுவது நல்லதல்ல. சிறிதளவு புளித்த மாவு, பிசைந்த மாவு முழுவதையும்[a] புளிக்கச் செய்கிறது என்பது உங்களுக்குத் தெரியாதா?
  to: நீங்கள் பெருமை பேசுவது நல்லதல்ல. சிறிதளவு புளித்த மாவு பிசைந்த மாவு முழுவதையும் புளிக்க வைக்கிறது என்று உங்களுக்குத் தெரியாதா?[a]
  rationale: The revision improves idiomatic modern Tamil while retaining the source’s rhetorical form, proverbial metaphor, and scope. The footnote remains anchored to “பிசைந்த மாவு முழுவதையும்” and supplies the traditional lexical alternative without altering the meaning.
