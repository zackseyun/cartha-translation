  source_fidelity: மூலக் கிரேக்கத்தின் பொருள் பெரும்பாலும் துல்லியமாக உள்ளது. τοὺς ... ἔξω என்பது சமூகத்திற்கு வெளியே இருப்பவர்களையும், κρίνει நிகழ்கால வினையையும், ἐξάρατε என்ற தீர்மானமான கட்டளையையும் நன்றாக வெளிப்படுத்துகிறது. ஆனால் SBLGNT-இல் κρίνειக்கு பின் கேள்விக்குறி உள்ளது; தமிழில் உறுதிக் கூற்றாக்கி, மாற்று வாசிப்பை மட்டும் அடிக்குறிப்பில் வைப்பது மூலப் பதிப்பின் நிறுத்தக்குறியைப் போதிய அளவு பிரதிபலிக்கவில்லை. கேள்வி வடிவத்தைப் பாதுகாப்பது பாதுகாப்பானது.
  naturalness: ‘ஆனால் வெளியே இருப்பவர்களைத் தேவன் நியாயந்தீர்க்கிறார்’ இலக்கணமாகவும் இயல்பாகவும் உள்ளது. கேள்வி வடிவத்தில் ‘வெளியே இருப்பவர்களைத் தேவன் நியாயந்தீர்ப்பது அல்லவா?’ என்பது நவீனப் பொதுத்தமிழில் தெளிவாகவும் இயல்பாகவும் அமையும். ‘அந்தத் தீயவனை உங்களிடையிலிருந்து அகற்றுங்கள்’ இயல்பானது; ‘உங்கள் நடுவிலிருந்து’ என்பதும் சிறப்பாக இயங்கும்.
  terminology: ‘நியாயந்தீர்ப்பது’ மற்றும் ‘அகற்றுங்கள்’ வேதாகமப் பதிவிற்கேற்ற, புரியக்கூடிய சொற்கள். τὸν πονηρόν இங்கு உடனடிச் சூழலில் குறிப்பிட்ட ஆணைக் குறிக்கிறது; ‘அந்தத் தீயவனை’ பொருத்தமானது. அடிக்குறிப்பு a-இல் ‘வெளியாட்கள்’ சில சமகாலப் பயன்பாடுகளில் வேறு சமூக/புவியியல் நுணுக்கங்களைத் தரக்கூடியதால் ‘வெளியில் இருப்பவர்கள்’ என்ற மாற்று சிறந்தது.
