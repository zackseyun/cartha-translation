  text: τοὺς δὲ ἔξω ὁ θεὸς ⸀κρίνει; ⸀ἐξάρατε τὸν πονηρὸν ἐξ ὑμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: ta
  text: ஆனால் வெளியே இருப்பவர்களைத் தேவன் நியாயந்தீர்ப்பது அல்லவா? அந்தத் தீயவனை உங்கள் நடுவிலிருந்து அகற்றுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தப் பொல்லாதவனை உங்கள் நடுவிலிருந்து துரத்திவிடுங்கள்.’ இந்தச் சொற்கள் உபாகமத்தில் உடன்படிக்கைச் சமூகத்திலிருந்து தீமையை அகற்றும்படி வரும் கட்டளை வடிவத்தை எதிரொலிக்கின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: வெளியே இருப்பவர்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இந்தச் சொற்றொடர், திருச்சபைச் சமூகத்திற்கு வெளியே இருப்பவர்களைக் குறிக்கிறது. சமூகத்தின் உள்ளே/வெளியே என்ற தொடர்புப் பொருளைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் சமூகத்தின் உள்ளே இருப்பவர்களை நியாயந்தீர்ப்பதற்கும் இங்கே வெளியே இருப்பவர்களைத் தேவன் நியாயந்தீர்ப்பதற்கும் இடையிலுள்ள மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: κρίνει
  choice: நியாயந்தீர்க்கிறார்
  rationale: கிரேக்கத்தில் நிகழ்கால வினையாக இருப்பதைப் பாதுகாக்கிறது; சூழலை முன்னிட்டு எதிர்காலமாக மாற்றவில்லை.
- source_word: ἐξάρατε
  choice: அகற்றுங்கள்
  rationale: ஒருமுறை தீர்மானமாகச் செய்ய வேண்டிய செயலைக் கட்டளையிடுகிறது. பிற்காலத் திருச்சபை நடைமுறைக்குரிய தொழில்நுட்பச் சொல்லைச் சேர்க்காமல், சமூகத்திலிருந்து நீக்குவதைக் தெளிவாகச் சொல்கிறது.
- source_word: τὸν πονηρὸν
  choice: அந்தத் தீயவனை
  rationale: ஒருமை ஆண்பால் வடிவமும் உடனடிச் சூழலில் குறிப்பிடப்பட்டுள்ள குறிப்பிட்ட ஆணும் தமிழில் வெளிப்படுகின்றனர். சுட்டுப்பொருளைக் காட்ட ‘அந்த’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: உங்களிடையிலிருந்து
  rationale: சமூகத்தின் நடுவிலிருந்து ஒருவரை அகற்றுதல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: திருச்சபை ஒழுங்கு நடவடிக்கை குறித்த கட்டளையின் இயல்பு
  choice: சபைக்கு வெளியே இருப்பவர்களின் நியாயத்தீர்ப்பைத் தேவனிடம் விட்டுவிட்டு, தவறு செய்த அந்த ஆணைத் தங்கள் சமூகத்திலிருந்து அகற்றும்படி சபையாருக்குக் கட்டளையிடுகிறது.
  alternative: முறையான சமூக விலக்கலைக் குறிப்பாகச் சொல்லாமல், சமூகத்திலிருந்து தீமையைப் பொதுவாக அகற்றும் கட்டளையாக வாசிக்கலாம்.
  rationale: 1 கொரிந்தியர் 5-ன் சூழல் சபைக்குள்ளிருந்த ஒரு குறிப்பிட்ட பாலியல் ஒழுக்கக்கேட்டையும், உள்ளே இருப்பவர்களுக்கும் வெளியே இருப்பவர்களுக்கும் இடையிலான வேறுபாட்டையும் பேசுகிறது. இருப்பினும், கிரேக்கத்தில் இல்லாத பிற்காலத் திருச்சபைத் தொழில்நுட்பச் சொற்கள் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
- issue: κρίνει என்பதின் காலமும் வாக்கிய நிறுத்தமும்
  choice: ‘தேவன் நியாயந்தீர்க்கிறார்’ என்ற நிகழ்காலக் கூற்றாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘தேவன் நியாயந்தீர்ப்பார் அல்லவா?’ என்ற எதிர்காலப் பொருளுள்ள வினாவாகவும் புரிந்துகொள்ளலாம்.
  rationale: κρίνει என்பது வடிவில் நிகழ்காலம். கொடுக்கப்பட்ட கிரேக்கப் பதிப்பின் கேள்விக்குறி ஆசிரியரின் நிறுத்தக்குறித் தீர்மானமாக இருக்கலாம்; சூழலும் சொல்வரிசையும் இதைத் தேவனின் வழக்கமான செயலைக் கூறும் உறுதிக் கூற்றாக இயல்பாக வாசிக்க அனுமதிக்கின்றன. மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: இயல்பான, நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நியாயந்தீர்க்கிறார்’ வேதாகமப் பயன்பாட்டில் அறிமுகமானதாயிருந்தாலும் பொதுவாகப் புரியும் சொல். ‘அகற்றுங்கள்’ என்பது தெளிவான கட்டளை; அதே நேரத்தில் குறிப்பிட்ட திருச்சபை மரபின் நடைமுறைச் சொல்லைத் திணிக்காது.
