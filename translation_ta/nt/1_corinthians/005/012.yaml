    text: அல்லது, “வெளியே இருப்பவர்களை நான் ஏன் தீர்க்க வேண்டும்?”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, திருச்சபைச் சமூகத்திற்குள் இருப்பவர்கள்.
