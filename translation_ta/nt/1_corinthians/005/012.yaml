lexical_decisions:
- source_word: τί γάρ μοι
  choice: எனக்கு என்ன வேலை?
  rationale: இந்தக் கிரேக்க மரபுத்தொடர், ஒரு காரியம் பேச்சாளருக்கு என்ன சம்பந்தம் அல்லது அக்கறை என்பதைக் கேட்கிறது. தமிழில் இயல்பான வினாவாக இதைத் தருகிறது; γάρ சூழலோடு இணைக்கும் விளக்கத் தொடர்பு தமிழில் வாக்கிய ஓட்டத்தால் வெளிப்படுகிறது.
- source_word: τοὺς ἔξω
  choice: வெளியே இருப்பவர்கள்
  rationale: வெறும் இடத்தைக் குறிப்பிடாமல், திருச்சபைச் சமூகத்திற்கு வெளியே உள்ளவர்களைக் குறிக்கிறது. எதிர்வரும் ‘உள்ளே இருப்பவர்கள்’ என்பதுடனான இணையான முரண்பாட்டையும் காக்கிறது.
- source_word: κρίνειν
  choice: தீர்ப்பது
  rationale: சூழலில் சமூக ஒழுங்கு நடவடிக்கை சார்ந்த மதிப்பீடு அல்லது தீர்ப்பைக் குறிக்கிறது. ‘தீர்ப்பது’ என்பது பொருளின் அகலத்தையும் சூழலின் தீவிரத்தையும் காக்கிறது.
- source_word: οὐχὶ
  choice: -த்தானே
  rationale: உடன்பாடான பதிலை எதிர்பார்க்கும் கிரேக்க வினாவை இயல்பான தமிழ் வலியுறுத்தல் வினாவாக வெளிப்படுத்துகிறது.
- source_word: τοὺς ἔσω
  choice: உள்ளே இருப்பவர்கள்
  rationale: திருச்சபைச் சமூகத்திற்குள் உள்ளவர்களைக் குறிக்கிறது; ‘வெளியே இருப்பவர்கள்’ என்பதற்கான நேரான இணைச்சொல்லாக உள்ளது.
- source_word: ὑμεῖς κρίνετε
  choice: நீங்கள் தீர்க்க வேண்டும்
  rationale: இலக்கண வடிவம் நிகழ்காலக் குறிப்பாக இருந்தாலும், சூழலில் பொறுப்பைக் குறிக்கும் வலிமை உள்ளது. ‘வேண்டும்’ அந்தக் கடமை உணர்வைத் தருகிறது; இது வினா வடிவுக்குள் வைக்கப்பட்டதால் கட்டளையாக மிகைப்படுத்தப்படவில்லை.
theological_decisions:
- issue: பவுலின் ‘வெளியே/உள்ளே’ வேறுபாடு திருச்சபை ஒழுங்கு நடவடிக்கையின் எல்லையைக் குறிக்கிறதா
  choice: திருச்சபைக்கு வெளியே உள்ளவர்களுக்கும் அதன் சமூகத்திற்குள் உள்ளவர்களுக்கும் இடையிலான வேறுபாட்டை மொழிபெயர்ப்பில் நேரடியாகக் காத்தல்
  alternative: எல்லா வகையான அறநெறித் தீர்ப்பையும் குறித்த பொதுவான தடை அல்லது அனுமதியாக விரிவுபடுத்துதல்
  rationale: 1 கொரிந்தியர் 5:9–13 சூழல் திருச்சபைக்குள் ஒழுங்கு நடவடிக்கையைப் பற்றியது. வசனம் கூறுவதைக் கடந்த விரிவான கோட்பாட்டைச் சேர்க்காமல், உள்ளே/வெளியே என்ற பதற்றத்தை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகருக்கு இயல்பான நடையில் வடிவமைக்கப்பட்டது. ‘வெளியே/உள்ளே’ என்ற மூலத்தின் இணை முரண்பாடு பாதுகாக்கப்பட்டுள்ளது; ‘எனக்கு என்ன வேலை?’ என்பது மரபுத்தொடரின் இயல்பான தமிழ் வெளிப்பாடு.
