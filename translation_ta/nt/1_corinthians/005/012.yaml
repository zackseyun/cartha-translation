  text: வெளியே இருப்பவர்களைத் தீர்ப்பதற்கும் எனக்கும் என்ன தொடர்பு? உள்ளே இருப்பவர்களைத்தானே நீங்கள் தீர்க்க வேண்டும்?[a][b]
  philosophy: optimal-equivalence
  footnotes:
