  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: ta
  text: ஆகையால், பழைய புளிப்புமாவுடனோ, தீய மனப்பான்மையும் தீமையும் என்னும் புளிப்புமாவுடனோ அல்லாமல், கபடமின்மையும் உண்மையும் என்னும் புளிப்பில்லா அப்பத்துடன் நாம் பண்டிகையைக் கொண்டாடுவோமாக.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பண்டிகையைக் கொண்டாடுவோமாக” என்பதை “பண்டிகையை அனுசரிப்போமாக” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் முந்தைய வசனத்திலுள்ள பஸ்காப் பண்டிகை உருவகத்தைத் தொடர்ந்து பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொல்லளவில், “கபடமின்மையும் உண்மையும் ஆகிய புளிப்பில்லாதவற்றுடன்” என்று உள்ளது. பஸ்கா உருவகத்தைத் தெளிவாக்க “அப்பம்” என்பது மொழிபெயர்ப்பில் சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வசனத்தின் வாதத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἑορτάζωμεν
  choice: நாம் பண்டிகையைக் கொண்டாடுவோமாக
  rationale: நிகழ்கால ஏவல் பொருளுடைய துணைவினையின் ‘நாம் ... செய்வோமாக’ என்ற வலியுறுத்தலைத் தக்கவைத்து, முந்தைய வசனத்தின் பஸ்காப் பண்டிகை உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ζύμῃ παλαιᾷ
  choice: பழைய புளிப்புமாவோடு
  rationale: ζύμη என்பதன் புளிக்கச் செய்யும் மாவு என்ற நேரடிப் பொருளையும் பஸ்கா உருவகத்தையும் ‘புளிப்புமாவு’ தெளிவாகத் தக்கவைக்கிறது.
- source_word: κακίας
  choice: தீய எண்ணம்
  rationale: இச்சூழலில் தீய மனப்பாங்கு அல்லது பிறருக்குத் தீங்கு நினைக்கும் தன்மையைக் குறிக்கிறது; அடுத்துள்ள πονηρία என்பதிலிருந்து வேறுபாட்டையும் பேணுகிறது.
- source_word: πονηρίας
  choice: பொல்லாப்பு
  rationale: ஒழுக்கரீதியான தீமையையும் பொல்லாத நடத்தையையும் குறிக்கும் இயல்பான தமிழ்ச் சொல்; κακία உடன் உள்ள பொருள் வேறுபாட்டை ஓரளவு தக்கவைக்கிறது.
- source_word: ἀλλ’ ἐν ἀζύμοις
  choice: மாறாக ... புளிப்பில்லா அப்பத்தோடு
  rationale: ἀζύμοις என்பது சொல்லளவில் ‘புளிப்பில்லாதவற்றோடு’ என்றாலும், பஸ்காச் சூழலில் ‘அப்பம்’ என்பதை வெளிப்படையாகச் சேர்ப்பது உருவகத்தைத் தமிழில் புரியத்தக்கதாக ஆக்குகிறது.
- source_word: εἰλικρινείας
  choice: நேர்மை
  rationale: கலப்பற்ற தூய நோக்கம், வஞ்சனையற்ற தன்மை ஆகியவற்றை பொதுவான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀληθείας
  choice: உண்மை
  rationale: மூலத்தின் நேரடிப் பொருளை இயல்பாகத் தக்கவைத்து ‘நேர்மை’ என்பதுடன் பொருத்தமான இணையாக அமைகிறது.
theological_decisions:
- issue: பவுலின் அறிவுரையிலுள்ள பஸ்கா/பண்டிகை உருவகம்
  choice: ‘பண்டிகையைக் கொண்டாடுவோமாக’ என்றும் ‘புளிப்பில்லா அப்பம்’ என்றும் மொழிபெயர்த்து உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘நாம் கொண்டாடுவோமாக’ என்று பொதுவாகக் கூறுதல்; அல்லது ‘நேர்மையும் உண்மையும் ஆகிய புளிப்பில்லாதவற்றோடு’ என்று சொல்லுதல்
  rationale: முந்தைய வசனம் கிறிஸ்துவைப் பஸ்காப் பலியாகக் குறிப்பிடுவதால், பண்டிகை மற்றும் புளிப்பில்லா அப்பம் பற்றிய மொழி பவுலின் தொடர்ச்சியான உருவகத்தைப் பாதுகாக்கிறது. ‘அப்பம்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும் சூழலால் உணரப்படும் பெயர்ச்சொல்; இதனை அடிக்குறிப்பில் வெளிப்படுத்துவது ambiguity-ஐ மறைக்காமல் வாசிப்பை இயல்பாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கொண்டாடுவோமாக’ என்ற வடிவம் வேதாகம அறிவுரைக்கேற்ற உயர்வானதாயினும் இயல்பான கூட்டழைப்பைத் தருகிறது. உருவகத்தின் மீளுருவாக்கத்திற்காக ‘புளிப்புமாவு’ மற்றும் ‘புளிப்பில்லா அப்பம்’ திட்டமிட்டு வைக்கப்பட்டுள்ளன.
