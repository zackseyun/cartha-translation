revisions:
- from: ஆகவே, பழைய புளிப்புமாவோடும் அல்ல, தீய எண்ணம் மற்றும் பொல்லாப்பு என்னும் புளிப்புமாவோடும் அல்ல, மாறாக நேர்மையும் உண்மையும் என்னும் புளிப்பில்லா அப்பத்தோடு நாம் பண்டிகையைக் கொண்டாடுவோமாக.[a][b]
