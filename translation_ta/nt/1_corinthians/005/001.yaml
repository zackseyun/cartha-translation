id: 1CO.5.1
reference: 1 Corinthians 5:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: ta
  text: 'உங்களிடையே பாலியல் ஒழுக்கக்கேடு இருப்பதாக உண்மையாகவே கேள்விப்படப்படுகிறது; அது யூதரல்லாதோரிடையில்கூட[a] இல்லாத வகையான பாலியல் ஒழுக்கக்கேடு: ஒருவன் தன் தந்தையின் மனைவியை வைத்திருக்கிறான்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இனங்களிடையில்கூட.” சில மொழிபெயர்ப்புகள் “புறவினத்தாரிடையில்கூட” என வழங்குகின்றன.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “தன் தந்தையின் மனைவியை வைத்திருப்பது”; அதாவது, தன் தந்தையின் மனைவியுடன் பாலியல் உறவில் இருப்பது. அவள் அவனுடைய சிற்றன்னையாக இருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: உண்மையிலேயே
  rationale: இங்கு அளவைக் குறிக்காமல், பவுலின் அதிர்ச்சியையும் வலியுறுத்தலையும் வெளிப்படுத்துகிறது.
- source_word: ἀκούεται
  choice: செய்தி பரவுகிறது
  rationale: சபையைப் பற்றிய விஷயம் கேள்விப்படப்படுவதையும் பொதுவாக அறிக்கையிடப்படுவதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: கொரிந்து விசுவாசக் குழுவுக்குள் இது நிகழ்வதைத் தெளிவாகக் காட்டுகிறது.
- source_word: πορνεία
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: தவறான பாலியல் நடத்தையைக் குறிக்கும் பரந்த சொல்லாகவும், நவீனத் தமிழில் தெளிவாகவும் உள்ளது.
- source_word: τοιαύτη πορνεία
  choice: இல்லாத அளவிலான பாலியல் ஒழுக்கக்கேடு
  rationale: அந்தக் குற்றத்தின் அசாதாரணமான, அதிர்ச்சியூட்டும் தன்மையைத் தமிழில் இயல்பாக வலியுறுத்துகிறது.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: பிற இனத்தாரிடையிலும் இல்லாத
  rationale: ἔθνη என்பதன் அடிப்படை இன/மக்கள் சார்ந்த பொருளைப் பேணுகிறது; இழிவுணர்வு கொண்ட சொல்லைச் சேர்ப்பதில்லை.
- source_word: ὥστε
  choice: ':'
  rationale: பின்வரும் சொற்றொடர் அந்த ஒழுக்கக்கேடு என்ன என்பதை விளக்குவதால், தமிழில் முக்காற்புள்ளி இயல்பாக அமைகிறது.
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: தன் தந்தையின் மனைவியை
  rationale: ‘சிற்றன்னை’ என்று விளக்கமாகச் சுருக்காமல், கிரேக்கத்தின் உறவுமுறைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: ἔχειν
  choice: வைத்திருக்கிறான்
  rationale: கிரேக்கத்தில் உள்ள திட்டமிட்ட மறைமுகச் சொல்லாட்சியின் சுருக்கத்தைப் பேணுகிறது; பாலியல் உறவு குறித்த பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
theological_decisions:
- issue: ἔθνεσιν என்பதை எவ்வாறு மொழிபெயர்ப்பது
  choice: பிற இனத்தார்
  alternative: யூதரல்லாதோர் / புறவினத்தார்
  rationale: இது இன-மத வேறுபாட்டைக் குறிக்கும் சொல்லாக இருப்பதால், மதிப்பீட்டுத் தொனி மிகாமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது; மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: பெண்ணை ‘சிற்றன்னை’ என்று குறிப்பதா
  choice: தன் தந்தையின் மனைவி
  alternative: தன் சிற்றன்னை
  rationale: மூலத்தில் தனிப்பட்ட உறவுமுறைச் சொல் இல்லை. ‘தந்தையின் மனைவி’ என்பது தேவையற்ற கூடுதல் துல்லியத்தைச் சேர்க்காமல் தெளிவாக உள்ளது.
- issue: ἔχειν என்பதிலுள்ள மறைமுகப் பொருள்
  choice: வைத்திருக்கிறான்
  alternative: பாலியல் உறவு வைத்திருக்கிறான் / சேர்ந்து வாழ்கிறான்
  rationale: மூலத்தின் சுருக்கமான, மறைமுகமான சொல்லாட்சியை முதன்மை உரையில் பேணி, அதன் சூழல்சார் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான ஆனால் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் அதிர்ச்சித் தொனி ‘உண்மையிலேயே’ மற்றும் ‘இல்லாத அளவிலான’ என்பவற்றால் வெளிப்படுகிறது. மூலத்தின் மறைமுகச் சொல்லாட்சியும் உறவுமுறைத் தெளிவின்மையும் முதன்மை உரையில் பாதுகாக்கப்பட்டு, தேவையான விளக்கம் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளது.
