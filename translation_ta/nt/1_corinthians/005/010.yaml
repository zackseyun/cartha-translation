source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: ta
  text: இவ்வுலகத்தைச் சேர்ந்த பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்களையோ, பேராசைக்காரர்களையும் பிறருடையதைப் பறித்துக்கொள்கிறவர்களையோ[a], சிலைவழிபாட்டாளர்களையோ முற்றிலும் தவிர்க்க வேண்டும் என்று நான் சொல்லவில்லை.[b] அப்படியானால், நீங்கள் உலகத்தைவிட்டே வெளியேற வேண்டியிருக்குமே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பிறருடையதைப் பறித்துக்கொள்கிறவர்கள்” என்பதற்கான கிரேக்கச் சொல், கொள்ளையடிப்பவர்களையோ அச்சுறுத்திப் பணம் பறிப்பவர்களையோ சுரண்டலின் மூலம் பிறர் உடைமையை அபகரிப்பவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: திருச்சபைக்கு வெளியே ஒழுக்கக்கேட்டில் வாழும் எல்லாரையும் விசுவாசிகள் தவிர்க்க வேண்டும் என்று தாம் கூறவில்லை எனப் பவுல் தெளிவுபடுத்துகிறார்; இதன் குறிப்பிட்ட பயன்பாட்டை 1 கொரிந்தியர் 5:11-ல் காண்க.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: முற்றிலும் தவிர்க்க வேண்டும் என்று நான் சொல்லவில்லை
  rationale: முந்தைய அறிவுறுத்தலின் எல்லையைப் பவுல் தெளிவுபடுத்துகிறார். தமிழில் தனி வசனமாக இயல்பாகப் புரிய, முந்தைய வசனத்திலுள்ள ‘தொடர்பு வைத்துக்கொள்ளாதீர்கள்’ என்ற கருத்து இங்கு வெளிப்படையாகக் கொண்டுவரப்பட்டுள்ளது; πάντως என்பதன் முழுமையான விலக்கல் என்ற வலியுறுத்தலும் காக்கப்பட்டுள்ளது.
- source_word: πόρνοις
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்கள்
  rationale: பொதுவான ‘ஒழுக்கக்கேடானவர்கள்’ என்பதைவிட, சொல்லின் பாலியல் சார்ந்த குறிப்பைத் தெளிவாகவும் நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: τοῦ κόσμου τούτου
  choice: இவ்வுலகத்தைச் சேர்ந்த
  rationale: இங்கு κόσμος என்பது திருச்சபைக்கு வெளியேயுள்ள மனிதச் சமுதாயத்தைக் குறிக்கிறது; ‘இவ்வுலகத்தைச் சேர்ந்த’ என்பது அந்த உறவை இயல்பாகக் காட்டுகிறது.
- source_word: πλεονέκταις
  choice: பேராசைக்காரர்கள்
  rationale: மேலும் மேலும் பெற விரும்பும், பிறரைச் சுரண்டும் தன்மையையும் உள்ளடக்கக்கூடிய சொல்லுக்கு பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் நேரடியான இணை.
- source_word: ἅρπαξιν
  choice: பிறருடையதைப் பறித்துக்கொள்கிறவர்கள்
  rationale: வலுக்கட்டாயமாகவோ சுரண்டலின் மூலமாகவோ பிறரிடமிருந்து எடுத்துக்கொள்ளும் விரிந்த பொருளைத் தக்கவைக்கிறது; ‘திருடர்கள்’ அல்லது ‘கொள்ளையர்கள்’ என்ற குறுகிய பொருளுக்குள் அடக்கவில்லை.
- source_word: εἰδωλολάτραις
  choice: சிலைவழிபாட்டாளர்கள்
  rationale: சிலைகளைத் தெய்வமாக வழிபடுகிறவர்களைக் குறிக்கும் தெளிவான, வழக்கிலுள்ள தமிழ் சொல்.
- source_word: ἐπεὶ
  choice: அப்படியானால்
  rationale: முந்தைய கூற்றை முழுமையாக எடுத்துக்கொண்டால் ஏற்படும் விளைவை அறிமுகப்படுத்தும் அனுமானத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὠφείλετε
  choice: வேண்டியிருக்குமே
  rationale: வடிவில் இறந்தகாலக் குறிப்புடைய வினையாக இருந்தாலும், இங்கு நிபந்தனை சார்ந்த நடைமுறை அவசியத்தை உணர்த்துகிறது; தமிழ் வாக்கிய முடிவு அந்த எதிர்மறை விளைவின் அபத்தத்தையும் மென்மையாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: உலகத்தைவிட்டே வெளியேற
  rationale: அத்தகைய அனைவரையும் தவிர்ப்பதற்கு உலகையே விட்டு வெளியேற வேண்டும் என்ற கூர்மையான, நோக்கமுள்ள மிகைப்படுத்தலைக் காக்கிறது.
theological_decisions:
- issue: சுற்றியுள்ள சமூகத்திலிருந்து பிரிந்து வாழ வேண்டும் என்ற கட்டளையின் எல்லை
  choice: திருச்சபைக்கு வெளியே ஒழுக்கக்கேட்டில் வாழும் எல்லாரிடமிருந்தும் முற்றிலும் விலக வேண்டும் என்று தாம் சொல்லவில்லை எனப் பவுல் தெளிவுபடுத்துகிறார்.
  alternative: ஒழுக்கக்கேட்டில் வாழும் எல்லா மனிதர்களுடனும் சமூகத் தொடர்பை முற்றிலும் துண்டிக்க வேண்டும் என்று பவுல் கட்டளையிடுகிறார்.
  rationale: அந்த இரண்டாவது பொருள் உண்மையானால் உலகத்தைவிட்டே வெளியேற வேண்டியிருக்கும் என்று வசனமே கூறுகிறது. ஆகவே திருச்சபைக்கு வெளியேயுள்ளவர்களிடமிருந்து முழுமையான சமூக விலகலை மொழிபெயர்ப்பு புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ordinary readers புரிந்துகொள்ளும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தனி வசனமாக வாசிக்கும்போது முந்தைய வசனத்துடன் உள்ள தொடர்ச்சி தெளிவாக இருக்க ‘தவிர்க்க வேண்டும் என்று நான் சொல்லவில்லை’ எனச் சூழலிலிருந்து தேவையான வினை வெளிப்படுத்தப்பட்டுள்ளது. பட்டியலின் நேர்மையும், முடிவிலுள்ள கூர்மையான விளைவும் காக்கப்பட்டுள்ளன.
