review_pass:
  verdict: revise
  source_fidelity: 'The main sense is retained: the imperative to remove the old leaven, the purpose of becoming a new dough/batch, the present designation as unleavened, and Messiah''s sacrificial death in Passover imagery. However, «புதிதாகப் பிசைந்த» introduces the more specific idea “freshly kneaded,” whereas νέον means “new.” «அப்போது» can also make the purpose clause sound merely temporal.'
  naturalness: The proposed revision uses an explicit Tamil purpose construction and retains a dignified, modern standard register. «புதிய பிசைந்த மாவு» is a natural way to express a new batch of dough without adding “freshly.”
  terminology: «மேசியா», «பஸ்கா», and «பலியிடப்பட்டார்» appropriately preserve the titular, Passover, and sacrificial senses. The supplied «ஆட்டுக்குட்டி» is permissible as an interpretive clarification if the note makes clear that it is not explicit in Greek. The footnote's claimed word-for-word wording should be corrected so it does not obscure that Χριστός identifies the one sacrificed.
  issues:
  - severity: medium
    issue: «புதிதாகப் பிசைந்த மாவாக» over-specifies νέον.
    rationale: νέον means “new,” not specifically “freshly kneaded.” Although φύραμα is dough/batch, the adverb «புதிதாக» modifies the kneading and therefore adds a detail absent from the source.
  - severity: low
    issue: «அப்போது» weakens the purpose force of ἵνα.
    rationale: The Greek expresses intended result/purpose (“so that you may be”), rather than simply what happens afterward in time. «இருக்கும்படி» represents this more directly.
  - severity: low
    issue: The footnote's “word-for-word” formulation is syntactically misleading.
    rationale: The Greek reads literally along the lines of “for our Passover, Messiah, was sacrificed,” with Messiah identifying the sacrificed Passover. The note should not present «நமது பஸ்கா பலியிடப்பட்டது—மேசியா» as a literal rendering.
