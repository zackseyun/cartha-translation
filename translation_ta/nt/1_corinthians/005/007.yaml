revisions:
- from: பழைய புளிப்புமாவை முற்றிலும் அகற்றுங்கள்; அப்போது, நீங்கள் புளிப்பில்லாதவர்களாக இருப்பதுபோலவே, புதிதாகப் பிசைந்த மாவாக இருப்பீர்கள். ஏனெனில் நமது பஸ்கா ஆட்டுக்குட்டியாகிய மேசியா பலியிடப்பட்டார்.[a]
  to: நீங்கள் புளிப்பில்லாதவர்களாக இருப்பதுபோலவே புதிய பிசைந்த மாவாக இருக்கும்படி, பழைய புளிப்புமாவை முற்றிலும் அகற்றுங்கள். ஏனெனில் நமது பஸ்கா ஆட்டுக்குட்டியாகிய மேசியா பலியிடப்பட்டார்.[a]
  rationale: «புதிய பிசைந்த மாவு» νέον φύραμα என்பதன் “new dough/batch” பொருளைக் காக்கிறது; «புதிதாகப் பிசைந்த» என்ற கூடுதல் கால/செயல் நுணுக்கத்தை நீக்குகிறது. «இருக்கும்படி» ἵνα-வின் நோக்கப் பொருளைத் தெளிவாகக் காட்டுகிறது. அடிக்குறிப்பு கிரேக்கத்தின் சுருக்கமான appositional அமைப்பையும், «ஆட்டுக்குட்டி» என்பது சூழலிலிருந்து வழங்கப்பட்ட சொல் என்பதையும் துல்லியமாக விளக்குகிறது.
