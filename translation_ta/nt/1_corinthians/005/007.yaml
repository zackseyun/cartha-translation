source:
  edition: SBLGNT
  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: ta
  text: நீங்கள் புளிப்பில்லாதவர்களாக இருப்பதுபோலவே புதிய பிசைந்த மாவாக இருக்கும்படி, பழைய புளிப்புமாவை முற்றிலும் அகற்றுங்கள். ஏனெனில் நமது பஸ்கா ஆட்டுக்குட்டியாகிய மேசியா பலியிடப்பட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “நமது பஸ்காவாகிய மேசியா பலியிடப்பட்டார்.” இங்குள்ள “பஸ்கா” என்பது பஸ்கா ஆட்டுக்குட்டியையோ பஸ்காப் பலியையோ குறிக்கலாம்; “ஆட்டுக்குட்டி” என்ற சொல் கிரேக்கத்தில் வெளிப்படையாக இல்லை.'
    reason: மூலத்திலுள்ள சுருக்கமான, பலவாறு புரிந்துகொள்ளக்கூடிய πάσχα பயன்பாட்டைப் பாதுகாத்தல்
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: முற்றிலும் அகற்றுங்கள்
  rationale: இறந்தகால வினைமுறை வடிவிலுள்ள பன்மை கட்டளை; முழுமையாக நீக்கிவிட வேண்டும் என்ற வலிமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: παλαιὰν ζύμην
  choice: பழைய புளிப்புமாவை
  rationale: பஸ்கா மற்றும் புளிப்பில்லா அப்பம் சார்ந்த உருவகத் தொடர்ச்சியைப் பாதுகாக்கிறது; வெறும் ‘ஈஸ்ட்’ என்பதைக் காட்டிலும் சூழலுக்குப் பொருத்தமானது.
- source_word: ἵνα ἦτε νέον φύραμα
  choice: அப்போது ... புதிதாகப் பிசைந்த மாவாக இருப்பீர்கள்
  rationale: ἵνα கூறும் நோக்கம் அல்லது விளைவை ‘அப்போது’ இயல்பாக வெளிப்படுத்துகிறது. φύραμα என்பது பிசைந்த மாவுத்திரள்; தமிழில் எளிதாகப் புரிய ‘புதிதாகப் பிசைந்த மாவு’ என வழங்கப்படுகிறது.
- source_word: καθώς ἐστε ἄζυμοι
  choice: நீங்கள் புளிப்பில்லாதவர்களாக இருப்பதுபோலவே
  rationale: நடத்தை குறித்த கட்டளைக்கும் ஏற்கெனவே உள்ள அடையாள நிலைக்கும் இடையிலான திட்டமிட்ட பதற்றத்தைத் தீர்த்துவிடாமல், καθώς என்பதன் ஒப்பீட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: τὸ πάσχα ἡμῶν
  choice: நமது பஸ்கா ஆட்டுக்குட்டி
  rationale: கிரேக்கத்தில் நேரடியாக ‘நமது பஸ்கா’ என்றாலும், ἐτύθη என்னும் பலியிடுதல் வினையாலும் சூழலாலும் பஸ்காப் பலி அல்லது ஆட்டுக்குட்டி குறிக்கப்படுகிறது. தமிழில் குறிப்பு தெளிவாக இருக்க ‘ஆட்டுக்குட்டி’ சேர்க்கப்பட்டுள்ளது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐτύθη
  choice: பலியிடப்பட்டார்
  rationale: θύω வினையின் இறந்தகாலச் செயப்பாட்டு வடிவம்; பலியாகக் கொல்லப்பட்டதைக் ‘பலியிடப்பட்டார்’ தெளிவாகவும் மரியாதையுடனும் தெரிவிக்கிறது.
- source_word: Χριστός
  choice: மேசியா
  rationale: இங்கு பஸ்காப் பலியுடன் இணைக்கப்பட்ட பட்டப்பெயர் உணர்வு முன்னிலையில் இருப்பதால், பெயர்போன்ற ‘கிறிஸ்து’ என்பதற்குப் பதில் ‘மேசியா’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: πάσχα என்பதையும் மேசியாவையும் இணைத்து மொழிபெயர்த்தல்
  choice: நமது பஸ்கா ஆட்டுக்குட்டியாகிய மேசியா
  alternative: நமது பஸ்காவாகிய மேசியா; நமது பஸ்காப் பலியாகிய மேசியா
  rationale: மூலத்தில் ‘ஆட்டுக்குட்டி’ என்ற சொல் வெளிப்படையாக இல்லை. எனினும் ‘பலியிடப்பட்டார்’ என்பதும் பஸ்காச் சூழலும் பலிக்குரிய ஆட்டுக்குட்டியைச் சுட்டுகின்றன. வாசகருக்குத் தெளிவாக முதன்மை உரையில் அதை வெளிப்படுத்தி, மூலத்தின் சுருக்கமான வடிவத்தையும் அதன் விரிவான பொருள் வாய்ப்பையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: Χριστός என்பதன் பட்டப்பெயர் உணர்வு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: பஸ்கா சார்ந்த மீட்பு மற்றும் பலி உருவகத்தில் Χριστός பட்டப்பெயராகச் செயல்படுவது முன்னிலையில் உள்ளது; ஆகவே ‘மேசியா’ பொருத்தமானது.
- issue: கட்டளைக்கும் தற்போதைய அடையாளத்திற்கும் உள்ள பதற்றம்
  choice: அகற்றுங்கள் ... நீங்கள் புளிப்பில்லாதவர்களாக இருப்பதுபோலவே
  alternative: நீங்கள் புளிப்பில்லாதவர்கள் என்பதால் அகற்றுங்கள்
  rationale: கிரேக்க உரை அவர்கள் பழைய புளிப்பை அகற்ற வேண்டும் என்றும் அதே வேளையில் அவர்கள் புளிப்பில்லாதவர்கள் என்றும் கூறுகிறது. இந்த இறையியல் மற்றும் சொற்பொழிவுப் பதற்றத்தை காரணவிளக்கமாகச் சீராக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘புளிப்புமாவு’, ‘புதிதாகப் பிசைந்த மாவு’ ஆகியவை ஒரே மாவு உருவகத்தை இயல்பாகத் தொடர்கின்றன. சொற்றொடர் அமைப்பு கிரேக்கத்தின் கட்டளை—நோக்கம்—தற்போதைய அடையாளம்—பஸ்காப் பலி என்ற நகர்வை முடிந்தவரை காக்கிறது.
