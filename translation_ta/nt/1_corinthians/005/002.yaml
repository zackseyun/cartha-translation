id: 1CO.5.2
reference: 1 Corinthians 5:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: ta
  text: நீங்களோ பெருமையால் வீங்கிப்போயிருக்கிறீர்கள்! அதற்குப் பதிலாக, இந்தச் செயலைச் செய்தவன் உங்கள் நடுவிலிருந்து அகற்றப்படும்படி[a] நீங்கள் துக்கம் கொண்டிருக்க வேண்டாமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் நடுவிலிருந்து எடுத்துக்கொள்ளப்படும்படி.” இந்தச் சூழலில், இது பெரும்பாலும் சபையின் ஒழுங்கு நடவடிக்கையால் அந்த நபர் சபையிலிருந்து நீக்கப்படுவதைக் குறிக்கிறது.
    reason: ἀρθῇ என்பதற்கான சொற்பொருள் மாற்றையும், உடனடியான சூழல் சுட்டும் ஒழுங்கு நடவடிக்கையையும் தெரிவிக்கிறது; முதன்மை உரையில் செய்பவரையோ நடவடிக்கையின் துல்லிய வடிவத்தையோ நிர்ணயிக்கவில்லை.
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: பெருமையால் வீங்கிப்போயிருக்கிறீர்கள்
  rationale: நிலைத்துவிட்ட தற்போதைய நிலையை உணர்த்தும் perfect passive வடிவத்தையும், பெருமையால் ‘வீங்குதல்’ என்ற பவுலின் உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὐχὶ μᾶλλον
  choice: மாறாக ... வேண்டாமா?
  rationale: அவர்களின் தற்போதைய மனப்பான்மைக்கு எதிராக அவர்கள் காட்டியிருக்க வேண்டிய பதிலை வலியுறுத்தும் கண்டனத் தொனியுள்ள வினாவைக் காக்கிறது.
- source_word: ἐπενθήσατε
  choice: துக்கப்பட்டிருக்க
  rationale: பொதுவான வருத்தத்தைவிட வலுவான புலம்பல் அல்லது துக்க உணர்வை வெளிப்படுத்துகிறது; சபையாரின் கூட்டு மனவேதனையையும் அனுமதிக்கிறது.
- source_word: ἵνα ἀρθῇ
  choice: அகற்றப்படும்படி
  rationale: ἵνα உடன் வரும் passive subjunctive வடிவத்தின் நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவைக் காட்டுகிறது; செய்பவர் யார் என்பதைச் சேர்க்காமல் மூலத்தின் பொதுமையைப் பாதுகாக்கிறது.
- source_word: ἐκ μέσου ὑμῶν
  choice: உங்கள் நடுவிலிருந்து
  rationale: சமூகத்தின் மத்தியிலிருந்து நீக்கப்படுதல் என்ற பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: இந்தச் செயலைச் செய்தவன்
  rationale: குற்றத்தைச் செய்த நபரை அடையாளப்படுத்தும் substantival participle வடிவத்தையும், ἔργον என்பதன் தீவிரத்தையும் சுருக்கமான தமிழில் காக்கிறது.
theological_decisions:
- issue: குற்றம் செய்தவனை நோக்கி மேற்கொள்ள வேண்டிய நடவடிக்கையின் இயல்பு
  choice: உங்கள் நடுவிலிருந்து அகற்றப்படும்படி
  alternative: தேவனால் எடுத்துக்கொள்ளப்படும்படி; சபை உறவிலிருந்து நீக்கப்படும்படி
  rationale: ἀρθῇ என்பது செய்பவரை வெளிப்படையாகக் குறிப்பிடாத passive வடிவம். உடனடி சூழல் சபை ஒழுங்கு நடவடிக்கையைச் சுட்டினாலும், மொழிபெயர்ப்பு ‘சபைநீக்கம்’ என்ற விளக்கச் சொல்லை நேரடியாகப் புகுத்தாமல் மூலத்தின் அளவிலான பொதுமையையும் இறையியல் இழுபறியையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கண்டனத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘பெருமையால் வீங்கிப்போயிருக்கிறீர்கள்’ என்பது பவுலின் உருவகத்தைப் பாதுகாக்கிறது; ஆச்சரியக்குறி முதல் கூற்றின் அதிர்ச்சியையும், இறுதி வினா கண்டனமிக்க rhetorical question-ஐயும் வெளிப்படுத்துகிறது. அடிக்குறி குறியீடு அது விளக்கும் ‘அகற்றப்படும்படி’ என்பதற்குப் பின்பு வைக்கப்பட்டுள்ளது.
