id: 1CO.5.11
reference: 1 Corinthians 5:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: ta
  text: ஆனால் இப்போது, சகோதரர் என்று அழைக்கப்படுபவர் ஒருவர் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுபவராகவோ, பேராசைக்காரராகவோ, சிலை வழிபாட்டாளராகவோ, பழித்துப் பேசுபவராகவோ, குடிகாரராகவோ, பிறருடையதைப் பறித்துக்கொள்பவராகவோ இருந்தால், அவருடன் பழக வேண்டாம் என்று உங்களுக்கு எழுதினேன். அப்படிப்பட்டவருடன் சேர்ந்து சாப்பிடக்கூட வேண்டாம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: ஆனால் இப்போது ... எழுதினேன்
  rationale: கிரேக்க இறந்தகால வடிவமான ἔγραψα என்பதை நிகழ்காலமாக மாற்றாமல் ‘எழுதினேன்’ என்று வைத்துள்ளோம்; νῦν δέ தரும் தற்போதைய விளக்கம்/திருத்தத்தின் மாறுபாட்டை ‘ஆனால் இப்போது’ வெளிப்படுத்துகிறது.
- source_word: μὴ συναναμίγνυσθαι
  choice: அவருடன் பழக வேண்டாம்
  rationale: நெருக்கமான சமூகத் தொடர்பில் கலந்திருப்பதைத் தவிர்ப்பது என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: சகோதரர் என்று அழைக்கப்படும் ஒருவர்
  rationale: அந்த நபர் உண்மையில் சகோதரரா என்ற கேள்வியைத் தீர்மானிக்காமல், ‘என்று அழைக்கப்படுகிற’ என்ற மூலத்தின் தெளிவற்ற தன்மையைப் பாதுகாக்கிறது.
- source_word: πόρνος
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்
  rationale: சொல்லின் பரந்த பாலியல் ஒழுக்கக்கேட்டு அர்த்தத்தை நவீன வாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: πλεονέκτης
  choice: பேராசைக்காரர்
  rationale: அளவுக்கு மீறிப் பெற விரும்பும் பேராசை என்ற முதன்மைப் பொருளை நேரடியாகக் காட்டுகிறது.
- source_word: εἰδωλολάτρης
  choice: சிலைவழிபாட்டுக்காரர்
  rationale: விக்கிரகங்கள் அல்லது சிலைகளை வழிபடுகிறவர் என்ற வழக்கமான பொருளை எளிய தமிழில் தருகிறது.
- source_word: λοίδορος
  choice: பழித்துப் பேசுகிறவர்
  rationale: வெறும் கடுமையான பேச்சை விட, பிறரை இழிவுபடுத்தி வசைபாடும் தொடர்ச்சியான நடத்தையை வெளிப்படுத்துகிறது.
- source_word: μέθυσος
  choice: குடிகாரர்
  rationale: மது அருந்துவதை மட்டும் அல்லாமல், குடிப்பழக்கத்தால் அடையாளப்படுத்தப்படும் நபரைச் சுட்டுகிறது.
- source_word: ἅρπαξ
  choice: பிறரைச் சுரண்டுகிறவர்
  rationale: பலவந்தமாகவோ அநியாயமாகவோ பிறரிடமிருந்து எடுத்துக்கொள்ளும் நபரைச் சுட்டும் சொல்லின் பரப்பை, ‘திருடன்’ அல்லது ‘மோசடிக்காரன்’ என்று குறுக்காமல் வழங்குகிறது.
- source_word: τῷ τοιούτῳ μηδὲ συνεσθίειν
  choice: அப்படிப்பட்டவருடன் சேர்ந்து சாப்பிடக்கூட வேண்டாம்
  rationale: μηδέ தரும் வலியுறுத்தலுடன், ஒன்றாக உணவருந்துவதையும் தவிர்க்க வேண்டும் என்ற நேரடிப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘சகோதரர்’ எனப்படுபவரின் உண்மையான விசுவாச நிலை
  choice: சகோதரர் என்று அழைக்கப்படும் ஒருவர்
  alternative: சகோதரராகிய ஒருவர்
  rationale: ὀνομαζόμενος அவருக்குக் கொடுக்கப்படும் பெயர் அல்லது உரிமைகோரலைக் குறிக்கிறது; அவருடைய உண்மையான ஆன்மீக நிலையை மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்கவில்லை.
- issue: ஒன்றாக உண்பதற்கான தடை எந்த வகை உணவைக் குறிக்கிறது
  choice: சேர்ந்து சாப்பிடக்கூட வேண்டாம்
  alternative: திருவிருந்து உட்கொள்ளக்கூட வேண்டாம்
  rationale: συνεσθίειν பொதுவாக ஒன்றாக உண்பதைக் குறிக்கிறது. இதைத் திருவிருந்துக்கு மட்டும் கட்டுப்படுத்துவது மூலத்தில் வெளிப்படையாக இல்லாத சமய விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியக்கூடிய, அதேவேளை கண்ணியமான நடை. பட்டியலின் இணையான அமைப்பும் இறுதியிலுள்ள வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
