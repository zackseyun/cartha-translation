review_pass:
  verdict: revise
  source_fidelity: The verse’s conditional scope, the qualified expression ‘called a brother,’ the catalogue of conduct, and the climactic prohibition of eating together are all represented. However, ἅρπαξ denotes a person who seizes or takes what belongs to others—such as a robber, extortioner, or swindler—more specifically than the broad ‘one who exploits others.’
  naturalness: The Tamil is clear and appropriately modern. The revised wording retains its readable register while using a more concrete, source-near expression for the final catalogue item.
  terminology: ‘சகோதரர் என்று அழைக்கப்படுபவர்,’ ‘பாலியல் ஒழுக்கக்கேடு,’ ‘பேராசைக்காரர்,’ ‘சிலை வழிபாட்டாளர்,’ ‘பழித்துப் பேசுபவர்,’ and ‘குடிகாரர்’ are suitable renderings in this context. ‘பிறருடையதைப் பறித்துக்கொள்பவர்’ better represents ἅρπαξ without restricting it to one particular legal mechanism.
  issues:
  - severity: medium
    issue: ‘பிறரைச் சுரண்டுகிறவர்’ is too broad for ἅρπαξ.
    rationale: The Greek term concerns predatory acquisition or seizure of another’s property, not every form of exploitation. A rendering referring to taking what belongs to others preserves the semantic core while avoiding an overly narrow choice such as only ‘swindler’ or only ‘robber.’
  revised_text: ஆனால் இப்போது, சகோதரர் என்று அழைக்கப்படுபவர் ஒருவர் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுபவராகவோ, பேராசைக்காரராகவோ, சிலை வழிபாட்டாளராகவோ, பழித்துப் பேசுபவராகவோ, குடிகாரராகவோ, பிறருடையதைப் பறித்துக்கொள்பவராகவோ இருந்தால், அவருடன் பழக வேண்டாம் என்று உங்களுக்கு எழுதினேன். அப்படிப்பட்டவருடன் சேர்ந்து சாப்பிடக்கூட வேண்டாம்.
  revised_footnotes: []
