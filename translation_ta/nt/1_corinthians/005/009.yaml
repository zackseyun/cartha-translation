theological_decisions:
- issue: “அந்தக் கடிதம்” எதைக் குறிக்கிறது
  choice: கொரிந்தியர்களுக்குத் தெரிந்த ஒரு குறிப்பிட்ட கடிதம் என்று மொழிபெயர்த்து, அது எந்தக் கடிதம் என்பதைத் திறந்த நிலையில் வைத்தல்
