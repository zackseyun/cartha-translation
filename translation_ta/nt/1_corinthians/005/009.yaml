  rationale: ἐν τῇ ἐπιστολῇ என்பது குறிப்பிட்ட கடிதத்தைக் குறித்தாலும், அந்தக் கடிதத்தின் வரலாற்று அடையாளத்தைத் தனியாகத் தீர்மானிப்பதில்லை. ஆகவே மூலத்தின் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. “வேசித்தனம் செய்கிறவர்கள்” போன்ற குறுகிய அல்லது பழமையான சொல்லாக்கத்தைத் தவிர்த்து, மூலத்தின் பரந்த பாலியல்-நெறிப் பொருளை “பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்கள்” எனத் தருகிறது. அடிக்குறி குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
