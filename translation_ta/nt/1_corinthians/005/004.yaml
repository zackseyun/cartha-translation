source:
  edition: SBLGNT
  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: ta
  text: நம்முடைய ஆண்டவராகிய இயேசுவின் பெயரில்[a], நீங்கள் ஒன்றுகூடியிருக்கும்போதும் என் ஆவி உங்களோடு இருக்கும்போதும், நம்முடைய ஆண்டவராகிய இயேசுவின் வல்லமையோடு,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் ஒன்றுகூடியிருக்கும்போதும், என் ஆவி உங்களோடு இருக்கும்போதும்.” கிரேக்கத்தில் சற்றுச் சுருக்கமான வேற்றுமைத் தனிநிலைக் கட்டமைப்பு உள்ளது.
    reason: சுருக்கமான கிரேக்க இலக்கணக் கட்டமைப்பிற்கான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: பெயரில்
  rationale: இது ஒருவரின் அதிகாரத்தின்கீழ் அல்லது அவரைப் பிரதிநிதித்துவப்படுத்திச் செயல்படுவதைக் குறிக்கக்கூடிய வழக்குச் சொற்றொடர். மூலத்தின் வடிவத்தையும் அதிகாரம் என்ற உட்பொருளையும் ஒருங்கே காக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டில் இயேசுவுக்குரிய பட்டத்தின் கிறிஸ்துவியல் நிறையைக் காக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: συναχθέντων ὑμῶν
  choice: நீங்கள் ஒன்றுகூடியிருக்கும்போது
  rationale: இறந்தகாலச் செயலெச்சத்துடன் அமைந்த genitive absolute கட்டமைப்பு, சபை கூடும் நேரத்தைக் குறிக்கும் இயல்பான காலவாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: என் ஆவியும் உங்களோடு இருக்க
  rationale: கிரேக்கத்தில் சுருக்கமாக விடப்பட்டுள்ள கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பவுலின் உடல்சாராத பங்கேற்பை அதன் தன்மை என்னவென்று விளக்காமல் காக்கிறது.
- source_word: σὺν
  choice: உடன்
  rationale: உடனிருத்தல் அல்லது இணைந்து செயல்படுதல் என்ற எளிய பொருளைக் காக்கிறது; இங்கு அடுத்த சொல்லுடன் சேர்ந்து ‘வல்லமையோடு’ என அமைந்துள்ளது.
- source_word: δυνάμει
  choice: வல்லமை
  rationale: வெறும் முறையான அதிகாரம் என்பதைக் காட்டிலும், இந்த நடவடிக்கையில் செயல்படும் ஆற்றலைக் குறிக்கிறது.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: நம்முடைய ஆண்டவராகிய இயேசுவின்
  rationale: உடைமை, மூலம் ஆகிய நுணுக்கங்களில் ஒன்றை மட்டும் தீர்மானிக்காமல் கிரேக்க உரையின் விரிவான தொடர்பைக் காக்கிறது.
theological_decisions:
- issue: சபைக் கூடுகையில் பவுலின் ஆவி உடனிருப்பதன் தன்மை
  choice: ‘என் ஆவியும் உங்களோடு இருக்க’ என்று, உடல்சாராத பங்கேற்பை உறுதிப்படுத்தும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: இதைப் பவுலின் மனப்பாங்கு அல்லது நோக்கம் மட்டுமே எனப் புரிந்துகொள்ளலாம்; அல்லது இன்னும் வலுவான மறைஞான உடனிருப்பாகப் புரிந்துகொள்ளலாம்.
  rationale: உரை பவுலின் உடல்சாராத பங்கேற்பைக் கூறுகிறது; ஆனால் அது எவ்வாறு நிகழ்கிறது என்பதை வரையறுப்பதில்லை. மொழிபெயர்ப்பு அந்த இறையியல் இழுவிசையைத் தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சபை வாசிப்புக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலவாக்கியம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; ‘ஆண்டவராகிய இயேசு’, ‘ஆவி’, ‘வல்லமை’ போன்ற சொற்கள் மரபார்ந்த பொருள் நிறையைக் காத்தபடியே இன்றைய வாசகருக்குப் புரியும் வடிவில் உள்ளன.
