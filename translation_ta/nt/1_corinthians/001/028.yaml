source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: ta
  text: கடவுள் உலகத்தின் உயர்குடிப் பிறப்பில்லாதவற்றையும் இகழப்பட்டவற்றையும், இல்லாதவற்றையும், இருப்பவற்றைச் செயலற்றதாக்குவதற்காகத் தேர்ந்தெடுத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγενῆ
  choice: தாழ்ந்த குடிப்பிறப்புடையவற்றை
  rationale: இந்தச் சொல் உயர்குடிப் பிறப்போ சமூக மதிப்போ இல்லாதவற்றைக் குறிக்கிறது. இத்தேர்வு அதன் சமூக-நிலை சார்ந்த பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐξουθενημένα
  choice: இகழப்பட்டவற்றை
  rationale: மதிப்பற்றவையாகக் கருதப்பட்டு அவமதிக்கப்பட்டவற்றை நிறைவேற்றப்பட்ட செயப்பாட்டு வடிவம் சுட்டுகிறது; இச்சொல் அந்த நிராகரிப்பின் வலிமையைச் சுருக்கமாகத் தருகிறது.
- source_word: τὰ μὴ ὄντα
  choice: இல்லாதவற்றை
  rationale: பவுலின் அதிர்ச்சியூட்டும் பரந்த சொல்லாட்சியை முறையாகப் பாதுகாத்து, நேரடியான இல்லாமைக்கும் சமூகத்தில் ஒன்றுமில்லாதவர்களாகக் கருதப்படுவதற்கும் இடையிலான பதற்றத்தைத் திறந்தவாறு வைக்கிறது.
- source_word: τὰ ὄντα
  choice: இருப்பவற்றை
  rationale: “இல்லாதவை” என்பதுடனான சமச்சீரான எதிர்மறை இணையைப் பாதுகாக்கிறது; அதை வெறும் சமூக அந்தஸ்தாகக் குறுக்கவில்லை.
- source_word: καταργήσῃ
  choice: ஒன்றுமில்லாமல் ஆக்குவதற்காக
  rationale: ஒன்றைச் செயலற்றதாகவோ பயனற்றதாகவோ ஆக்கும் பொருளை வெளிப்படுத்துகிறது; முழுமையாக அழித்தொழித்தல் என்ற கருத்தை அவசியமின்றி புகுத்தாமல் கிரேக்கச் சொற்றொடரின் விளைவைத் தருகிறது.
- source_word: ἐξελέξατο
  choice: தேர்ந்தெடுத்தார்
  rationale: கடவுளின் நோக்கமுள்ள தெரிவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அருகிலுள்ள வசனங்களில் திரும்ப வரும் வினையையும் ஏற்றவாறு பிரதிபலிக்கிறது.
theological_decisions:
- issue: τὰ μὴ ὄντα / τὰ ὄντα என்பவற்றை சமூகப் பிரிவுகளாக மட்டும் விளக்குவதா, அல்லது அவற்றின் நேரடி இருப்பியல் எதிர்மறையைப் பாதுகாப்பதா?
  choice: “இல்லாதவை” / “இருப்பவை” என்ற நேரடி எதிர்மறை பாதுகாக்கப்பட்டது.
  alternative: “ஒன்றுமில்லாதவர்களாகக் கருதப்படுபவர்கள்” / “மதிப்புள்ளவர்களாகக் கருதப்படுபவர்கள்” என்று சமூக அந்தஸ்தை வெளிப்படையாகக் கூறுதல்.
  rationale: சூழல் உலகின் பார்வையிலான சமூக மதிப்பைப் பற்றியது என்றாலும், பவுலின் மொழி அதைவிடப் பரந்ததும் கூர்மையானதும் ஆகும். நேரடி எதிர்மறை, சமூக வலிமையையும் இறையியல் பதற்றத்தையும் குறுக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை பயன்படுத்தப்பட்டது. நடுநிலைப் பன்மை வடிவங்கள் கிரேக்கத்தின் τὰ அமைப்பைத் தக்கவைக்கின்றன. நீண்ட நோக்கவாக்கியத்தைத் தெளிவாக்க “அவர் அவ்வாறு செய்தார்” சேர்க்கப்பட்டுள்ளது; இது புதிய கருத்தைச் சேர்க்காமல் ἵνα சார்ந்த நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
