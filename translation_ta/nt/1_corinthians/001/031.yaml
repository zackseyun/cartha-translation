review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the citation’s central injunction, but it reverses the Greek clause order and renders ἵνα as the independent past-tense assertion “இது நிகழ்ந்தது” (“this happened”). This changes the purpose/result connection to the preceding context and adds a past event not present in the Greek.
  naturalness: “பெருமை பாராட்டுகிறவர் ஆண்டவரில் பெருமை பாராட்டட்டும்” is clear, modern, and suitably dignified Tamil. The revised wording keeps the verse’s dependent, context-linking form without supplying an artificial independent predicate.
  terminology: “ஆண்டவர்” is an appropriate modern-standard Tamil rendering of κυρίῳ. “பெருமை பாராட்டுகிறவர் / பெருமை பாராட்டட்டும்” preserves the repeated καυχάομαι wording naturally. The added emphatic suffix in “ஆண்டவரிலேயே” is not required by the source, so it has been removed.
  issues:
  - severity: high
    issue: ἵνα is rendered as “இது நிகழ்ந்தது.”
    rationale: ἵνα introduces the purpose/result clause and does not say “this happened.” The supplied past-tense assertion both adds meaning and obscures that this verse grammatically depends on the preceding statement.
  - severity: medium
    issue: The citation formula and quotation are placed before the purpose/result connection in a way that reverses the source’s structure.
    rationale: The Greek has “so that, just as it is written …” The revision retains the dependent “என்பதற்காக” construction and presents the written citation as its scriptural grounding.
  - severity: low
    issue: “ஆண்டவரிலேயே” adds emphasis not explicitly marked in the Greek.
    rationale: ἐν κυρίῳ is adequately and more closely rendered “ஆண்டவரில்”; the theological focus remains intact without added emphasis.
  revised_text: எழுதப்பட்டிருக்கிறபடியே, “பெருமை பாராட்டுகிறவர் ஆண்டவரில் பெருமை பாராட்டட்டும்” என்பதற்காக.
  revised_footnotes: []
  revision_rationale: The revision removes the added past-tense statement, restores ἵνα as a dependent purpose/result expression (“என்பதற்காக”), and preserves the citation formula, repeated boasting language, imperative force, and “in the Lord” phrasing in modern standard Tamil. As in the Greek, the verse remains syntactically connected to the preceding verse.
