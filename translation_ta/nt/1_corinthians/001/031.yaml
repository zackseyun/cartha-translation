revisions:
- from: “பெருமை பாராட்டுகிறவர் ஆண்டவரிலேயே பெருமை பாராட்டட்டும்” என்று எழுதப்பட்டிருக்கிறபடியே இது நிகழ்ந்தது.
  to: எழுதப்பட்டிருக்கிறபடியே, “பெருமை பாராட்டுகிறவர் ஆண்டவரில் பெருமை பாராட்டட்டும்” என்பதற்காக.
  rationale: The revision removes the added past-tense statement, restores ἵνα as a dependent purpose/result expression (“என்பதற்காக”), and preserves the citation formula, repeated boasting language, imperative force, and “in the Lord” phrasing in modern standard Tamil. As in the Greek, the verse remains syntactically connected to the preceding verse.
  reviewer_model: gpt-5.6-terra
