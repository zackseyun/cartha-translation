reference: 1 Corinthians 1:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα καθὼς γέγραπται· Ὁ καυχώμενος ἐν κυρίῳ καυχάσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: ta
  text: எழுதப்பட்டிருக்கிறபடியே, “பெருமை பாராட்டுகிறவர் ஆண்டவரில் பெருமை பாராட்டட்டும்” என்பதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: இது நிகழ்ந்தது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட செயலின் நோக்கம் அல்லது விளைவைக் குறிக்கிறது; தமிழில் தனித்து வாசிக்கும்போது தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καθὼς γέγραπται
  choice: என்று எழுதப்பட்டிருக்கிறபடியே
  rationale: வேத மேற்கோள் சூத்திரத்தையும், எழுதப்பட்ட வார்த்தையின் தொடரும் நிலைத்தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ὁ καυχώμενος
  choice: பெருமை பாராட்டுகிறவர்
  rationale: பெயர்ச்சொல் தன்மையுள்ள பங்கேற்பு வடிவத்தை பாலினப் பொதுமையுடன் வழங்குகிறது; καυχάομαι என்பதன் பெருமைப்படுதல்/மேன்மை பாராட்டுதல் சார்ந்த பொருளைக் காக்கிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவரிலேயே
  rationale: ἐν என்பதன் ‘இல்’ உறவையும், பெருமையின் உரிய மையம் ஆண்டவர் என்பதையும் ‘ஏ’ வலியுறுத்தலால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καυχάσθω
  choice: பெருமை பாராட்டட்டும்
  rationale: மூன்றாம் நபர் கட்டளை வடிவத்தின் அனுமதி அல்லாத அறிவுறுத்தல் வலிமையைத் தமிழ் வியங்கோள் வடிவில் காக்கிறது.
theological_decisions:
- issue: மேற்கோளிலுள்ள கட்டளையின் வலிமை
  choice: பெருமை பாராட்டட்டும்
  alternative: பெருமை பாராட்ட வேண்டும்
  rationale: கிரேக்க மூன்றாம் நபர் கட்டளை வடிவத்துக்கு நேரடியான, dignified தமிழ் வியங்கோள் வடிவத்தைப் பயன்படுத்துகிறது; அதை அவசியத்தைச் சுட்டும் உரையாக மிகைப்படுத்தவில்லை.
- issue: κυρίῳ என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர்
  rationale: நவீன தரத் தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ள பொதுப் பெயரைப் பயன்படுத்தி, எந்தத் தனிப்பிரிவு சொல்வழக்கையும் முன்னிறுத்தவில்லை.
- issue: ἵνα-வின் நோக்கம்/விளைவு நுணுக்கம்
  choice: இது நிகழ்ந்தது
  alternative: இதனால்
  rationale: முந்தைய சூழலிலிருந்து வரும் நோக்கம் அல்லது விளைவு என்ற உண்மையான தெளிவின்மையை ஒரு பக்கம் மட்டும் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் வேத மேற்கோளுக்குரிய செறிவும் காக்கப்பட்டுள்ளன. வசனம் முந்தைய வாக்கியத்தைச் சார்ந்த ἵνα உடன் தொடங்குவதால், தமிழில் முழுமையான வாக்கியமாக அமைய ‘இது நிகழ்ந்தது’ சேர்க்கப்பட்டுள்ளது.
