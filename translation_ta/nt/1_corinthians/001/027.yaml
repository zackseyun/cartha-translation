source:
  edition: SBLGNT
  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: ta
  text: ஆனால், ஞானிகளை வெட்கமடையச் செய்வதற்காக உலகத்தின் மூடத்தனமானவற்றைத் தேவன் தேர்ந்தெடுத்தார்; வலிமையானவற்றை வெட்கமடையச் செய்வதற்காக உலகத்தின் பலவீனமானவற்றைத் தேவன் தேர்ந்தெடுத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள வலுவான முரண்பாட்டை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: உலகத்தின் மூடத்தனமானவற்றை
  rationale: மூடத்தனமானவை எனப் பொருள்படும் நடுநிலைப் பன்மை பெயரடை பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டிருப்பதைப் பாதுகாக்கிறது; மனிதர்களை மட்டும் குறிக்கிறது என்று தேவையின்றி வரையறுக்கவில்லை.
- source_word: ἐξελέξατο
  choice: தேர்ந்தெடுத்தார்
  rationale: தேவனுடைய நோக்கமுள்ள தெரிவைத் தெளிவாகவும் மரியாதையான நடையிலும் எடுத்துரைக்கிறது.
- source_word: ἵνα καταισχύνῃ
  choice: வெட்கமடையச் செய்வதற்காக
  rationale: ἵνα என்பதன் நோக்கப் பொருளையும் καταισχύνῃ என்பதன் ‘வெட்கத்திற்கு உட்படுத்துதல்’ என்ற செயப்பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: τοὺς σοφούς
  choice: ஞானிகளை
  rationale: ஆண்பால் பன்மை பெயரடை பெயர்ச்சொல்லாக வந்துள்ளதால், ஞானமுள்ள மனிதர்களைக் குறிக்கும் வகையில் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: உலகத்தின் பலவீனமானவற்றை
  rationale: மீண்டும் வரும் நடுநிலைப் பன்மை பெயரடையின் விரிவான, வரையறுக்கப்படாத குறிப்பைப் பாதுகாக்கிறது.
- source_word: τὰ ἰσχυρά
  choice: வலிமையானவற்றை
  rationale: கிரேக்க நடுநிலைப் பன்மையைப் பாதுகாத்து, பலவீனமானவற்றுடன் உள்ள சொல்லாட்சிசார் எதிரிணையைத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: நடுநிலைப் பன்மைச் சொற்களின் குறிப்பு மனிதர்களா, பொருட்களா என்பது
  choice: ‘மூடத்தனமானவற்றை’, ‘பலவீனமானவற்றை’, ‘வலிமையானவற்றை’ என்று விரிவாகவே வைக்கப்பட்டது.
  alternative: ‘மூடர்கள்’, ‘பலவீனர்கள்’, ‘வலிமையானவர்கள்’ என்று மனிதர்களாக மட்டும் மொழிபெயர்த்தல்.
  rationale: மூலத்தில் இவை நடுநிலைப் பன்மை பெயரடைகள்; அவற்றை மனிதர்களுக்கு மட்டும் வரையறுப்பது மூலத்தின் உண்மையான விரிவையும் சொல்லாட்சிசார் பதற்றத்தையும் குறைக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. மூலத்தின் இரு இணையான கூறுகளும் அவற்றின் நோக்க அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
