  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: ta
  text: கிறிஸ்புவுக்கும் காயுவுக்கும் தவிர, உங்களில் எவருக்கும் நான் திருமுழுக்கு அளிக்கவில்லை என்பதற்காக நன்றி செலுத்துகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: நன்றி செலுத்துகிறேன்
  rationale: நிகழ்கால நன்றியுணர்வை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத நன்றியின் பெறுநரைச் சேர்க்கவில்லை.
- source_word: ὅτι
  choice: என்பதற்காக
  rationale: இங்கு பவுலின் நன்றிக்கான உள்ளடக்கத்தையும் அடிப்படையையும் இயல்பான தமிழில் இணைக்கிறது; ‘என்று’ மட்டும் பயன்படுத்துவதைவிட வாக்கிய உறவைத் தெளிவாக்குகிறது.
- source_word: οὐδένα ὑμῶν
  choice: உங்களில் யாருக்கும் ... இல்லை
  rationale: மறுக்கப்பட்ட செயப்பொருளை நவீன தமிழில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐβάπτισα
  choice: திருமுழுக்குக் கொடுக்கவில்லை
  rationale: βαπτίζω என்பதற்கான பரவலாக அறியப்படும் தமிழ் வேதாகமச் சொல்லாட்சியைப் பயன்படுத்துகிறது; சடங்கின் முறையைப் பற்றிய பிரிவுசார் முடிவைத் திணிக்கவில்லை.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: விலக்குக் கட்டமைப்பின் பொருளைச் சுருக்கமாகவும் துல்லியமாகவும் காட்டுகிறது.
- source_word: Κρίσπον
  choice: கிறிஸ்பு
  rationale: கிரேக்கப் பெயரின் ஒலியைத் தமிழில் அடையாளம் காணத்தக்க வகையில் எழுத்துப்பெயர்க்கிறது; வேற்றுமை உருபு வாக்கியத்திலேயே இணைக்கப்படுகிறது.
- source_word: Γάϊον
  choice: காயு
  rationale: கிரேக்கப் பெயரை வழக்கமான தமிழ் ஒலிப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கிறது; வேற்றுமை உருபு வாக்கியத்திலேயே இணைக்கப்படுகிறது.
theological_decisions:
- issue: βαπτίζω என்ற சொல்லின் மொழிபெயர்ப்பு சடங்கின் முறையைத் தீர்மானிக்குமா?
  choice: திருமுழுக்குக் கொடு
  alternative: மூழ்கடித்தல்
  rationale: மூலச்சொல்லின் கிறிஸ்தவச் சடங்கு சார்ந்த பொருளைத் தெரிவிக்கிறது; தெளித்தல், ஊற்றுதல், முழுமையாக மூழ்கடித்தல் ஆகிய முறைகளில் ஒன்றை இந்த வசனம் தனியாக நிர்ணயிப்பதாகக் காட்டுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கச் சொல்வரிசையை அப்படியே பின்பற்றாமல், விதிவிலக்கான இரு பெயர்களை முதலில் வைத்து தமிழ் வாக்கிய ஓட்டத்தை இயல்பாக்கியுள்ளது.
