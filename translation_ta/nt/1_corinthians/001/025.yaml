id: 1CO.1.25
reference: 1 Corinthians 1:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: ta
  text: ஏனெனில், கடவுளின் மூடத்தனம் மனிதர்களைவிட ஞானமிக்கது; கடவுளின் பலவீனம் மனிதர்களைவிட வலிமைமிக்கது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: கடவுளின் மூடத்தனம்
  rationale: கிரேக்கத்தின் திட்டமிட்ட முரணும் அதிர்ச்சியூட்டும் சொல்லாட்சியும் மென்மையாக்கப்படாமல் பாதுகாக்கப்படுகின்றன.
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: மனிதர்களின் ஞானத்தைவிட ஞானமானது
  rationale: ஒப்பீட்டின் பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது; ἀνθρώπων பாலினம் சாராத ‘மனிதர்கள்’ என்று தரப்படுகிறது.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: கடவுளின் பலவீனம்
  rationale: முதல் அரைப்பகுதியுடன் உள்ள இணை அமைப்பையும் இறையியல் பதற்றத்தையும் அப்படியே பாதுகாக்கிறது.
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: மனிதர்களின் வலிமையைவிட வலிமையானது
  rationale: கிரேக்க ஒப்பீட்டை தெளிவாகவும் இணைநடையுடனும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘கடவுளின் மூடத்தனம்’ மற்றும் ‘கடவுளின் பலவீனம்’ என்ற முரண்பாட்டு மொழி
  choice: சொல்லாட்சியை நேரடியாகப் பாதுகாத்தல்
  alternative: ‘மூடத்தனமாகத் தோன்றும் கடவுளின் செயல்’ மற்றும் ‘பலவீனமாகத் தோன்றும் கடவுளின் செயல்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலவாக்கியம் ‘தோன்றுகிறது’ அல்லது ‘செயல்’ என்பதை வெளிப்படையாகச் சொல்லவில்லை. விளக்கத்தை உரைக்குள் சேர்க்காமல், பவுலின் திட்டமிட்ட இறையியல் முரணையும் வாசகருக்கான பதற்றத்தையும் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இரண்டு இணையான கூறுகளின் சமநிலை காக்கப்பட்டுள்ளது. ‘மனிதர்கள்’ என்பது பாலினத்தை உள்ளடக்கும் பொதுப்பெயராகப் பயன்படுத்தப்பட்டுள்ளது.
