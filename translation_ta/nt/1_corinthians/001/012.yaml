revisions:
- from: 'நான் சொல்வது இதுதான்: உங்களில் ஒவ்வொருவரும், “நான் பவுலைச் சேர்ந்தவன்” என்றோ, “நான் அப்பொல்லோவைச் சேர்ந்தவன்” என்றோ, “நான் கேபாவைச் சேர்ந்தவன்” என்றோ, “நான் மெசியாவைச் சேர்ந்தவன்[a]” என்றோ சொல்கிறீர்கள்.'
  to: 'நான் சொல்வது இதுதான்: உங்களில் ஒவ்வொருவரும் இவ்வாறு சொல்கிறீர்கள்: “நான் பவுலைச் சேர்ந்தவன்,” அல்லது “நான் அப்பொல்லோவைச் சேர்ந்தவன்,” அல்லது “நான் கேபாவைச் சேர்ந்தவன்,” அல்லது “நான் மெசியாவைச் சேர்ந்தவன்[a].”'
  rationale: The revision retains the draft’s source-faithful lexical choices but improves the Tamil presentation of the four parallel slogans. It does not decide the disputed rhetorical status of the final Christ/Messiah slogan beyond the verse itself.
