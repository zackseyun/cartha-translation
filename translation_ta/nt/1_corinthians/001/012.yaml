id: 1CO.1.12
reference: 1 Corinthians 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: ta
  text: 'நான் சொல்வது இதுதான்: உங்களில் ஒவ்வொருவரும் இவ்வாறு சொல்கிறீர்கள்: “நான் பவுலைச் சேர்ந்தவன்,” அல்லது “நான் அப்பொல்லோவைச் சேர்ந்தவன்,” அல்லது “நான் கேபாவைச் சேர்ந்தவன்,” அல்லது “நான் மெசியாவைச் சேர்ந்தவன்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் கிறிஸ்துவைச் சேர்ந்தவன்.”
    reason: Χριστός என்பதற்கான மரபான தமிழ் ஒலிபெயர்ப்பை வழங்குகிறது.
lexical_decisions:
- source_word: λέγω δὲ τοῦτο ὅτι
  choice: 'நான் சொல்வது இதுதான்:'
  rationale: பவுல் தாம் கூறுவதை விளக்கத் தொடங்கும் தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ὅτι அறிமுகப்படுத்தும் உள்ளடக்கத்தை முக்காற்புள்ளி காட்டுகிறது.
- source_word: ἕκαστος ὑμῶν
  choice: உங்களில் ஒவ்வொருவரும்
  rationale: ἕκαστος என்பதன் தனித்தனியாகச் சுட்டும் வலிமையையும் ὑμῶν என்பதன் பன்மை இரண்டாம் நபர் உறவையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: λέγει
  choice: சொல்கிறீர்கள்
  rationale: கிரேக்க நிகழ்காலம் காட்டும் தொடரும் நடைமுறையைத் தக்கவைக்கிறது; தமிழில் ‘உங்களில் ஒவ்வொருவரும்’ என்பதோடு கருத்துப்படி இரண்டாம் நபர் பன்மை வினை இயல்பாக அமைகிறது.
- source_word: Ἐγὼ μέν εἰμι Παύλου / Ἐγὼ δὲ Ἀπολλῶ / Ἐγὼ δὲ Κηφᾶ / Ἐγὼ δὲ Χριστοῦ
  choice: “நான் பவுலைச் சேர்ந்தவன்” என்றோ ... “நான் மெசியாவைச் சேர்ந்தவன்” என்றோ
  rationale: εἰμί உடன் வரும் உரிமை அல்லது சார்பைக் காட்டும் பிறப்புவேற்றுமையை, பிரிவுசார் பற்றுதலை மிகைப்படுத்தாமல், இயல்பான தமிழில் ‘சேர்ந்தவன்’ எனத் தெரிவிக்கிறது. μέν/δέ தொடரின் மாறுபட்ட கோஷங்கள் ‘என்றோ’ என்ற இணைப்பால் தெளிவாகின்றன.
- source_word: Κηφᾶ
  choice: கேபா
  rationale: பவுல் இங்கு Πέτρος என்பதற்குப் பதிலாகப் பயன்படுத்தும் Κηφᾶς என்ற பெயரையே தமிழில் ஒலிபெயர்க்கிறது.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: Χριστός இங்கு பட்டமாக இருப்பதால் அதன் பொருளை ‘மெசியா’ என வழங்குகிறது; மரபான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பிரிவுசார் கோஷத்தில் Χριστοῦ என்பதன் மொழியாக்கம்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός என்பதன் பட்டத்தன்மையை முதன்மை உரை வெளிப்படுத்துகிறது. தமிழில் பரவலாக அறியப்பட்ட மரபான ஒலிபெயர்ப்பை மாற்று வடிவமாக அடிக்குறிப்பில் வைத்திருப்பதால் பொருளையும் மரபையும் வேறுபடுத்திக் காண முடிகிறது.
- issue: பவுல் கண்டிக்கும் நான்காவது கூற்றின் தன்மை
  choice: மற்ற மூன்று கூற்றுகளோடு இணையான கோஷமாகவே மொழிபெயர்த்தல்
  alternative: ‘மெசியாவைச் சேர்ந்தவன்’ என்ற கூற்றை பவுலின் அங்கீகரிக்கப்பட்ட நிலைப்பாடாக விளக்குதல்
  rationale: கிரேக்க தொடரமைப்பு நான்கு கூற்றுகளையும் இணையாக வைக்கிறது; இவ்வசனம் மட்டும் நான்காவது கூற்றின் நோக்கத்தைத் தீர்மானிக்காததால் விளக்கவுரையை முதன்மை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. மீண்டும் மீண்டும் வரும் பிரிவுசார் கோஷங்களின் வலிமையைப் பாதுகாக்க ஒரே வாக்கிய வடிவம் நான்கு முறையும் வைக்கப்பட்டுள்ளது. ‘சேர்ந்தவன்’ என்பது மூலத்தின் உரிமை/சார்பு நுணுக்கத்தை இயல்பாகக் காட்டுகிறது; இது மேற்கோள் கோஷத்தின் ஒருமை வடிவமாக இருப்பதால் அப்படியே காக்கப்பட்டுள்ளது.
