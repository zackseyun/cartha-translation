id: 1CO.1.11
reference: 1 Corinthians 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: ta
  text: 'ஏனெனில், என் சகோதரர்களே,[a] உங்களைப் பற்றி குளோயியைச் சேர்ந்தவர்கள் எனக்குத் தெரிவித்திருக்கிறார்கள்: உங்களிடையே சச்சரவுகள் இருக்கின்றன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சகோதர சகோதரிகளே.” கிரேக்கத்தில் “சகோதரர்களே” என்று உள்ளது; அது விசுவாசிகள் அனைவரையும் உள்ளடக்கி அழைக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: எனக்குத் தெரிவித்திருக்கிறார்கள்
  rationale: கிடைத்த தகவல் பவுலுக்குத் தெரியப்படுத்தப்பட்டது என்பதே கிரேக்கச் செயலப்பாட்டு வடிவின் கருத்து. தமிழில் தகவலின் மூலத்தை இயல்பாகக் கூறுவதற்காக செயப்பாட்டு அமைப்புக்குப் பதிலாக இயல்பான வினைவடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: περὶ ὑμῶν
  choice: உங்களைப் பற்றி
  rationale: இந்த முன்னிடைச்சொற்றொடரின் இயல்பான நவீனத் தமிழ் இணை.
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: கிரேக்க மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் தக்கவைக்கிறது; சபை முழுவதையும் உள்ளடக்கும் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὑπὸ τῶν Χλόης
  choice: குலோவேயைச் சேர்ந்தவர்கள்
  rationale: குலோவேயுடன் தொடர்புடையவர்களைக் குறிக்கிறது; அவர்கள் அவளுடைய வீட்டார் என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: ἔριδες
  choice: சச்சரவுகள்
  rationale: ஒருவருக்கொருவர் இடையிலான மோதல்களையும் வாக்குவாதங்களையும் குறிக்கும் இயல்பான சொல்; சூழலில் வரும் விரிவான ‘பிரிவுகள்’ என்ற கருத்துடன் இதைக் கலக்கவில்லை.
- source_word: ἐν ὑμῖν εἰσιν
  choice: உங்களிடையே ... இருக்கின்றன
  rationale: கிரேக்க இருப்புக் கட்டமைப்பை இயல்பான தமிழில் நேராக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கலப்பு பாலின விசுவாசக் குழுவை நோக்கி வரும் ἀδελφοί என்பதன் மொழிபெயர்ப்பு
  choice: என் சகோதரர்களே
  alternative: என் சகோதர சகோதரிகளே
  rationale: கிரேக்கச் சொல் இலக்கணத்தில் ஆண்பால் பன்மையாக இருந்தாலும் முழு விசுவாசக் குழுவையும் உள்ளடக்கக்கூடும். மூல வடிவம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் உள்ளடக்கப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘குலோவேயைச் சேர்ந்தவர்கள்’ என்பது ‘குலோவேயின் வீட்டார்’ என்ற தேவையற்ற குறிப்பாக்கத்தைத் தவிர்க்கிறது; ‘சச்சரவுகள்’ என்பது ἔριδες என்பதன் பன்மையையும் தனிநபர்களுக்கிடையிலான மோதல் கருத்தையும் காக்கிறது.
