  text: καθὼς τὸ μαρτύριον τοῦ Χριστοῦ ἐβεβαιώθη ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/006.yaml
  text: just as the testimony about Messiah was confirmed among you[b][a],
translation:
  language: ta
  text: மேசியாவைப் பற்றிய சாட்சி உங்களிடையே உறுதிப்படுத்தப்பட்டது போலவே[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேசியாவின் சாட்சி.’
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘உங்களுக்குள் உறுதிப்படுத்தப்பட்டது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: போலவே
  rationale: முந்திய கூற்றுடன் உள்ள ஒப்புமையையும் தொடர்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μαρτύριον
  choice: சாட்சி
  rationale: அறிவிக்கப்பட்ட செய்தியையும் அதற்குரிய சான்றுப் பொருளையும் உள்ளடக்கும் கிரேக்கச் சொல்லின் பொருளை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவைப் பற்றிய
  rationale: இங்கு மேசியாவைச் சார்ந்த அப்போஸ்தல அறிவிப்பைக் குறிக்கும் நோக்குநிலை வேற்றுமையாகப் புரிந்துகொள்ளப்பட்டுள்ளது; Χριστός என்பதன் பட்டப்பெயர் சார்ந்த வலிமையை ‘மேசியா’ காக்கிறது.
- source_word: ἐβεβαιώθη
  choice: உறுதிப்படுத்தப்பட்டது
  rationale: உறுதியாக்கப்படுதல் அல்லது நிலைநாட்டப்படுதல் என்ற இறந்தகாலச் செயப்பாட்டு வினையின் பொருளைத் துல்லியமாக வழங்குகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: பன்மையில் அழைக்கப்படும் கொரிந்தியர் சமூகத்தின் நடுவில் சாட்சி உறுதியானது என்ற இயல்பான சூழற்பொருளை வழங்குகிறது.
theological_decisions:
- issue: τοῦ Χριστοῦ என்பதிலுள்ள பிறப்புவேற்றுமையின் பொருள்
  choice: ‘மேசியாவைப் பற்றிய சாட்சி’ என்ற நோக்குநிலைப் பொருள்
  alternative: ‘மேசியாவின் சாட்சி’—மேசியா அளித்த சாட்சி அல்லது அவருக்குரிய சாட்சி
  rationale: சூழலில், கொரிந்தியரிடையே உறுதிப்படுத்தப்பட்ட இயேசுவைப் பற்றிய அப்போஸ்தல சாட்சியே முதன்மையாகத் தோன்றுகிறது. இருப்பினும் கிரேக்கத் தொடர் வேறு பொருளுக்கும் இடமளிப்பதால் அது அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- issue: ἐν ὑμῖν என்பதின் எல்லை
  choice: ‘உங்களிடையே’ என்ற சமூகப் பொருள்
  alternative: ‘உங்களுக்குள்’—அவர்களின் உள்ளார்ந்த அனுபவத்தில்
  rationale: பன்மைச் சமூகத்தை நோக்கிய சூழலில் கூட்டத்தினரிடையே நிகழ்ந்த உறுதிப்படுத்தல் இயல்பானது; உள்ளார்ந்த பொருளும் கிரேக்கத்தில் சாத்தியமானதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மதிப்புடைய நடையைக் கையாள்கிறது. வசனம் முந்திய வாக்கியத்துடன் தொடர்வதால் தமிழின் இயல்புக்கேற்ப ‘போலவே’ இறுதியில் வைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள இரு உண்மையான பொருள் மயக்கங்களும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
