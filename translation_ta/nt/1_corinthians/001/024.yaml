  source_fidelity: The translation accurately represents αὐτοῖς δὲ τοῖς κλητοῖς as ‘அழைக்கப்பட்டவர்களான … க்கும்,’ retains the Jew–Greek pairing, and renders the predicative expressions Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν faithfully as Messiah being God’s power and God’s wisdom. The supplied Tamil copula makes the Greek’s elliptical relation readable without adding a doctrinal claim beyond the source and its immediate syntax.
