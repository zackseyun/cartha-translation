id: 1CO.1.24
reference: 1 Corinthians 1:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: ta
  text: ஆனால் அழைக்கப்பட்டவர்களான யூதர்களுக்கும் கிரேக்கர்களுக்கும், மேசியா கடவுளின் வல்லமையும் கடவுளின் ஞானமுமாக இருக்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλητοῖς
  choice: அழைக்கப்பட்டவர்களான
  rationale: இது பெயர்ச்சொல்லாகச் செயல்படும் பெயரடை. கடவுளால் அழைக்கப்பட்டவர்களாக அடையாளப்படுத்தப்படும் குழுவைக் குறிக்கும் அதன் வினைச்சொல் சார்ந்த பொருளை இத்தேர்வு இயல்பான தமிழில் காக்கிறது.
- source_word: Ἰουδαίοις
  choice: யூதர்களுக்கும்
  rationale: ‘கிரேக்கர்கள்’ என்பதுடன் வரும் பவுலின் வழக்கமான இன-சமய எதிரிணையில், ‘யூதர்கள்’ என்பதே தெளிவான பொருள்.
- source_word: Ἕλλησιν
  choice: கிரேக்கர்களுக்கும்
  rationale: மூலத்தில் உள்ள குறிப்பான சொல்லையே காக்கிறது; ‘பிற இனத்தார்’ என்ற விரிவான விளக்கப் பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: Χριστόν
  choice: மேசியா
  rationale: இங்கு Χριστός ஒரு பட்டமாகச் செயல்படுவதால், அதன் பொருளை வெளிப்படுத்தும் ‘மேசியா’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: θεοῦ δύναμιν
  choice: கடவுளின் வல்லமை
  rationale: θεοῦ என்ற உரிமை வேற்றுமையையும் δύναμις என்பதன் சக்தி/வல்லமைப் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: θεοῦ σοφίαν
  choice: கடவுளின் ஞானம்
  rationale: மூலத்தில் மீண்டும் வரும் θεοῦ என்ற அமைப்பைத் தமிழிலும் மீட்டுரைத்து, இணையான சொற்றொடர் அமைப்பைக் காக்கிறது.
- source_word: implicit copula / verbless predicate relation
  choice: மேசியா … வல்லமையும் … ஞானமுமாக இருக்கிறார்
  rationale: முந்தைய வசனத்தின் வாக்கிய அமைப்பைச் சார்ந்துள்ள கிரேக்க நீக்கத்தை, தனித்து வாசிக்க இயல்பாக இருக்கத் தமிழில் இணைப்புவினையால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கிறிஸ்துவைக் குறிக்கும் Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு சொல் வெறும் பெயராக அல்லாமல் பட்டமாகச் செயல்படுகிறது. ஆகவே அதன் பட்டப் பொருளைத் தமிழில் வெளிப்படுத்துவது மூலத்தின் கருத்தைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. யூதர்–கிரேக்கர் என்ற மூல எதிரிணையும் ‘கடவுளின்’ என்ற மீட்டுரைப்பும் காக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பின் குறியீடும் உரையும் ஒன்றுக்கொன்று பொருந்தாததால், மூலக் கிரேக்கத்தில் ஆதாரம் இல்லாத அடிக்குறிப்பு சேர்க்கப்படவில்லை.
