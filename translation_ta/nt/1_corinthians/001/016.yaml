base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: ta
  text: ஸ்தேவானாவின் வீட்டாருக்கும் நான் திருமுழுக்குக் கொடுத்தேன்[a]. அதற்கு மேல், வேறு யாருக்காவது நான் திருமுழுக்குக் கொடுத்தேனா என்று எனக்குத் தெரியாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஸ்தேவானாவின் வீட்டுக்கும்.” கிரேக்கச் சொல் ஒரு கட்டிடத்தை மட்டும் அல்லாமல், அந்த இல்லத்தைச் சேர்ந்த வீட்டுச் சமூகத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதற்கு மேல் வேறு யாருக்காவது நான் திருமுழுக்குக் கொடுத்தேனா என்பது எனக்குத் தெரியாது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: திருமுழுக்குக் கொடுத்தேன்
  rationale: இவ்வினைச்சொல் திருமுழுக்கு அளித்த செயலைக் குறிக்கிறது. ‘திருமுழுக்குக் கொடுத்தேன்’ என்பது நவீனத் தமிழில் இயல்பாகவும், ஒரு குறிப்பிட்ட நிறைவேற்றும் முறையைத் தேவையின்றி முன்னிறுத்தாமலும் உள்ளது.
- source_word: δὲ καὶ
  choice: -க்கும் ...
  rationale: δέ இங்கு மென்மையான தொடர்ச்சியையும் καί சேர்த்தலையும் குறிக்கின்றன. ‘வீட்டாருக்கும்’ என்ற அமைப்பு முன்பு கூறப்பட்டவர்களோடு ஸ்தேவானின் வீட்டாரையும் சேர்க்கிறது.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: ஸ்தேவானுடைய வீட்டார்
  rationale: οἶκος இங்கு கட்டிடத்தை மட்டும் அல்லாமல், ஒரே இல்லத்தைச் சேர்ந்த குடும்பத்தார் மற்றும் பிற உறுப்பினர்களையும் உள்ளடக்கக்கூடிய வீட்டுச் சமூகத்தைக் குறிக்கிறது. ‘வீட்டார்’ அந்த விரிவை இயல்பாகப் பேணுகிறது.
- source_word: λοιπὸν
  choice: அதற்கு மேல்
  rationale: இப்போது குறிப்பிடப்பட்ட விதிவிலக்கைத் தாண்டி மீதமுள்ளதை λοιπόν சுட்டுகிறது. ‘அதற்கு மேல்’ பவுலின் நினைவுகூரும் ஓட்டத்தில் இயல்பாக உள்ளது.
- source_word: οὐκ οἶδα
  choice: எனக்குத் தெரியாது
  rationale: கிரேக்கம் நேரடியாக அறிவின்மையைச் சொல்கிறது. சூழலில் நினைவின்மை உட்பொருளாக இருந்தாலும், ‘தெரியாது’ மூலச் சொல்லுக்கு நெருக்கமானது.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: வேறு யாருக்காவது நான் திருமுழுக்குக் கொடுத்தேனா என்று
  rationale: εἰ இங்கு மறைமுகக் கேள்வியாக, கூடுதலாக வேறு எவருக்கும் திருமுழுக்கு அளித்தாரா என்ற ஐயத்தை வெளிப்படுத்துகிறது. தமிழில் ‘-ஆ என்று’ இதை இயல்பாகத் தருகிறது.
