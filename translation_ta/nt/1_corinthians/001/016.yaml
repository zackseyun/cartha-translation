translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் திடீர் நினைவுகூரல் மற்றும் உறுதியின்மை பேணப்பட்டுள்ளன; ‘வீட்டார்’ என்பது οἶκος என்பதன் சமூக அலகு சார்ந்த விரிவைத் தக்கவைக்கிறது.
