source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: ta
  text: மேசியா[a] பிரிக்கப்பட்டிருக்கிறாரா? பவுல் உங்களுக்காகச் சிலுவையில் அறையப்பட்டாரா? அல்லது நீங்கள் பவுலின் பெயரில் திருமுழுக்கு பெற்றீர்களா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கிறிஸ்து”.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “பவுலின் பெயருக்குள்”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: பிரிக்கப்பட்டிருக்கிறாரா
  rationale: நிறைவேற்றப்பட்ட ஒரு செயல் தொடரும் நிலையைச் சுட்டும் கிரேக்க perfect passive வடிவத்தை இது இயல்பான தமிழில் காக்கிறது; சபையின் கட்சிப் பிரிவைப் பற்றிய கண்டனத்தையும் உருவகத்தின் கூர்மையையும் மென்மைப்படுத்தவில்லை.
- source_word: ὁ Χριστός
  choice: மேசியா
  rationale: இங்கு definite article உடன் வருவதால் பட்டப்பெயரின் பொருள் முன்னிலையில் உள்ளது. ஆகவே ‘அபிஷேகம் பெற்றவர்’ என்ற பட்டப்பொருளைக் கொண்ட ‘மேசியா’ பயன்படுத்தப்படுகிறது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μὴ
  choice: வினா வடிவத்தில் மறைமுகமாக வெளிப்படுத்தப்பட்டது
  rationale: μὴ எதிர்மறையான பதிலை எதிர்பார்க்கும் சொல்லாட்சிவினாவைக் குறிக்கிறது. தமிழில் கூடுதல் விளக்கச் சொல் சேர்க்காமல் வினா வடிவமே அந்த எதிர்பார்ப்பை இயல்பாக உணர்த்துகிறது.
- source_word: ἐσταυρώθη
  choice: சிலுவையில் அறையப்பட்டாரா
  rationale: கிரேக்க aorist passive வடிவத்தின் நேரடியான, தெளிவான தமிழ் மொழிபெயர்ப்பு.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களுக்காக
  rationale: ஒருவரின் நன்மைக்காக அல்லது அவர் சார்பாகச் செய்யப்பட்டதைத் தெரிவிக்கும் ὑπέρ என்பதன் விசாலமான பொருளை, தேவையற்ற கோட்பாட்டு விரிவாக்கமின்றி இயல்பாகக் காக்கிறது.
- source_word: εἰς τὸ ὄνομα Παύλου
  choice: பவுலின் பெயருக்குள்
  rationale: εἰς என்பதன் திசை அல்லது இணைவு சார்ந்த ‘உள்/நோக்கி’ என்ற நுட்பத்தை முற்றிலும் ‘பெயரில்’ என்று சமப்படுத்தாமல் காக்கிறது. இது தமிழில் சற்று குறியீட்டு மொழியாக இருந்தாலும் சூழலில் புரிந்துகொள்ளத்தக்கது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐβαπτίσθητε
  choice: நீங்கள் திருமுழுக்குப் பெற்றீர்களா
  rationale: செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, இன்றைய தமிழ் கிறிஸ்தவப் பயன்பாட்டில் தெளிவாகவும் கண்ணியமாகவும் புரியும் சொற்றொடரைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: ὁ Χριστός என்பதைப் பவுலின் சொல்லாட்சிவினாவில் மொழிபெயர்த்தல்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: definite article பட்டப்பெயர் சார்ந்த வாசிப்பை ஆதரிக்கிறது. ‘மேசியா’ அந்தப் பட்டத்தின் பொருளை வெளிப்படுத்துகிறது; பரவலாக அறியப்பட்ட மரபான வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: εἰς τὸ ὄνομα என்ற திருமுழுக்கு மொழிநடையின் உறவுப் பொருள்
  choice: பெயருக்குள்
  alternative: பெயரில்
  rationale: முதன்மை வாசகம் εἰς என்பதன் திசை/இணைவு நுட்பத்தைத் திறந்தவாறே வைக்கிறது; ‘பெயரில்’ என்பது இயல்பான தமிழ் மாற்றாகக் கொடுக்கப்படுகிறது. இதன்மூலம் குறிப்பிட்ட ஒரு திருமுழுக்குக் கோட்பாட்டை உரைக்குள் இறக்குமதி செய்வது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூன்று சொல்லாட்சிவினாக்களின் கூர்மை காக்கப்பட்டுள்ளது. ‘திருமுழுக்கு’ என்பது தெளிவான நவீனச் சொலாகத் தேர்ந்தெடுக்கப்பட்டது; ‘பெயருக்குள்’ என்பது மூலத்தின் εἰς நுட்பத்தை வெளிப்படுத்தும் நோக்கில் திட்டமிட்டு வைத்திருக்கப்படுகிறது.
