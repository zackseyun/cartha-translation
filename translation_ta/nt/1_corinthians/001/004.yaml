translation:
  language: ta
  text: மேசியாவாகிய இயேசுவில்[a] உங்களுக்குக் கொடுக்கப்பட்ட கடவுளின் அருளுக்காக, உங்களைக் குறித்து என் கடவுளுக்கு எப்போதும் நன்றி செலுத்துகிறேன்.
