lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: நன்றி செலுத்துகிறேன்
  rationale: நிகழ்கால வினையின் தொடர்ச்சியான நன்றியுணர்வை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῷ θεῷ μου
  choice: என் கடவுளுக்கு
  rationale: கிரேக்க மூன்றாம் வேற்றுமையையும் வெளிப்படையான தன்மைப் பெயரடையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: காலத்தைக் குறிக்கும் பரந்த பொருளை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: περὶ ὑμῶν
  choice: உங்களைக் குறித்து
  rationale: περί என்பதன் ‘உங்களைப் பற்றிய/உங்களைக் குறித்த’ பொருளைத் தெளிவாக வைத்திருக்கிறது; ‘உங்களுக்காக’ என்று மாற்றி அதன் தொடர்புப் பொருளைச் சுருக்கவில்லை.
- source_word: ἐπὶ τῇ χάριτι
  choice: அருளுக்காக
  rationale: நன்றியின் காரணம் அல்லது அடிப்படையை இங்கு இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: χάριτι
  choice: அருள்
  rationale: கடவுளின் இலவசமான தயவையும் கொடையையும் குறிக்கும் பவுலின் பயன்பாட்டுக்கு ஏற்ற, பரவலாகப் புரியப்படும் சொல்.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: மூலத்தின் உடைமை/மூலாதார நுட்பத்தை மிகையாகத் தீர்மானிக்காமல் பெயரெச்சத் தொடர்பாகப் பாதுகாக்கிறது.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: உங்களுக்குக் கொடுக்கப்பட்ட
  rationale: இறந்தகாலச் செயப்பாட்டு எச்சத்தின் பொருளைப் பாதுகாத்து, கொடுப்பவராகக் கடவுள் மறைமுகமாக இருப்பதையும் விடுகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவில்
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த ‘மேசியா’ பொருளை வெளிப்படுத்தி, ἐν என்பதையும் ‘-இல்’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்பதை மொழிபெயர்ப்பதா அல்லது ஒலிபெயர்ப்பதா
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்/மேசியா’ என்ற பட்டப்பெயர்; இங்கு அந்தப் பொருளை வாசகருக்குத் தெளிவாக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. பரிச்சயமான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையில் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் நன்றிக்கான காரணம் தெளிவாக இருக்கச் சொல் வரிசை தமிழுக்கேற்ப மாற்றப்பட்டது; மூலத்தின் பொருள் தொடர்புகள் பாதுகாக்கப்பட்டன.
