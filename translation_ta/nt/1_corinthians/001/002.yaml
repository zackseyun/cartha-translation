  to: 'கொரிந்தில் இருக்கும் கடவுளுடைய திருச்சபைக்கு, அதாவது மேசியாவாகிய இயேசுவில்[a] பரிசுத்தமாக்கப்பட்டவர்களும் அழைக்கப்பட்ட பரிசுத்தவான்களாகிய[b] உங்களுக்கும், ஒவ்வோர் இடத்திலும்—அவர்களுடையதிலும் நம்முடையதிலும்[c]—நம் ஆண்டவராகிய இயேசு மேசியாவின் பெயரை அழைத்து வேண்டிக்கொள்கிற அனைவருக்கும்:'
  rationale: The revision corrects the Tamil place-name form, renders the church-members relationship as an apposition, and replaces a worship-specific expression with a faithful rendering of calling upon the Lord’s name. It retains the source ambiguity concerning ‘theirs and ours’ in both the main text and footnote, and preserves the project’s Messiah terminology.
