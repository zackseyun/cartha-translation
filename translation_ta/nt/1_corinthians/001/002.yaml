id: 1CO.1.2
reference: 1 Corinthians 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: ta
  text: 'கொரிந்தில் இருக்கும் கடவுளுடைய திருச்சபைக்கு, அதாவது மேசியாவாகிய இயேசுவில்[a] பரிசுத்தமாக்கப்பட்டவர்களும் அழைக்கப்பட்ட பரிசுத்தவான்களாகிய[b] உங்களுக்கும், ஒவ்வோர் இடத்திலும்—அவர்களுடையதிலும் நம்முடையதிலும்[c]—நம் ஆண்டவராகிய இயேசு மேசியாவின் பெயரை அழைத்து வேண்டிக்கொள்கிற அனைவருக்கும்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேசியாவாகிய இயேசுவில்’ என்பதை மரபாக ‘கிறிஸ்து இயேசுவில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அழைக்கப்பட்ட பரிசுத்தவான்கள்’; மரபாக, ‘பரிசுத்தவான்களாக இருக்க அழைக்கப்பட்டவர்கள்.’'
    reason: lexical_alternative
  - marker: c
    text: ‘அவர்களுடையதிலும் நம்முடையதிலும்’ என்பது ஒவ்வோர் இடத்தையும் குறிக்கலாம்; அல்லது ‘அவர்களுக்கும் நமக்கும் ஆண்டவராகிய’ இயேசுவைக் குறிக்கலாம். கிரேக்க வாக்கிய அமைப்பு சுருக்கமாக இருப்பதால் இரு தொடர்புகளும் முன்வைக்கப்பட்டுள்ளன.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: திருச்சபை
  rationale: கடவுளுக்குரிய விசுவாசிகளின் சமூகத்தைச் சுட்டும், நவீனத் தமிழில் இயல்பாகவும் மரியாதைக்குரியதாகவும் உள்ள திருச்சபைச் சொல்.
- source_word: ἡγιασμένοις
  choice: தூயவர்களாக்கப்பட்டவர்கள்
  rationale: நிறைவேற்றப்பட்ட செயலும் அதன் தொடரும் விளைவும் கொண்ட perfect passive participle-ஐச் செயப்படுவினையாகப் பாதுகாக்கிறது; தூய்மை அவர்களே அடைந்தது அல்ல, அவர்களுக்குச் செய்யப்பட்டதாகக் காட்டுகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவுக்குள்
  rationale: ἐν என்பதன் உறவு/ஒன்றிப்பு நுட்பத்தை ‘உக்குள்’ பாதுகாக்கிறது; Χριστός என்பதை வெறும் பெயர்போல் அல்லாமல் ‘மேசியா’ என்ற பட்டமாக வெளிப்படுத்துகிறது.
- source_word: κλητοῖς ἁγίοις
  choice: அழைக்கப்பட்ட தூய மக்கள்
  rationale: இரு பெயரடைகளைக் கொண்ட கிரேக்க அமைப்பை முடிந்தவரைத் தக்கவைத்து, ‘தூயவர்களாவதற்கு அழைக்கப்பட்டவர்கள்’ என்ற நோக்கப் பொருளைத் தேவையின்றி திணிக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: பெயரைத் தொழுதுகொள்கிறவர்கள்
  rationale: பெயரை அழைத்து வேண்டுதல், விசுவாச அறிக்கை, வழிபாடு ஆகிய நுட்பங்களைத் தமிழில் அறியப்பட்ட வேதாகமச் சொல்லாட்சியால் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: அதிகாரம், உரிமை, விசுவாச அறிக்கை ஆகிய κύριος என்பதன் நுட்பங்களுக்கு ஏற்ற நிலையான தமிழ் இணை.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: ஒவ்வோர் இடத்திலும்—அவர்களுடையதிலும் நம்முடையதிலும்
  rationale: சுருக்கமான கிரேக்க மரபுத்தொடரையும் αὐτῶν καὶ ἡμῶν எதனுடன் தொடர்புபடுகிறது என்ற தெளிவின்மையையும் கோடுகளால் ஓரளவு காக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்வாழ்த்துரையில் இது இயேசுவின் மீட்பருக்குரிய பட்டத்தைத் தொடர்ந்து சுமக்கிறது; எனவே பொருளை வெளிப்படுத்தும் ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது. பரவலான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: κλητοῖς ἁγίοις என்பதன் தொடர்பு
  choice: அழைக்கப்பட்ட தூய மக்கள்
  alternative: தூய மக்களாக இருக்க அழைக்கப்பட்டவர்கள்
  rationale: மூலத்தில் நோக்கத்தைக் குறிக்கும் வினையெச்சத் தொடர் இல்லை; ‘அழைக்கப்பட்ட’ மற்றும் ‘தூய’ என்ற இரு விளக்கங்களின் இறுக்கமான தொடர்பை மொழிபெயர்ப்பு காக்கிறது.
- issue: αὐτῶν καὶ ἡμῶν என்பதன் இணைப்பு
  choice: இடத்துடன் தொடர்புபடுத்தப்பட்டது
  alternative: ‘அவர்களுக்கும் நமக்கும் ஆண்டவர்’ என்று ஆண்டவருடன் தொடர்புபடுத்துதல்
  rationale: சொல் வரிசையில் ‘இடம்’ அருகில் இருப்பதால் முதன்மை உரை அதனுடன் இணைக்கிறது; எனினும் கிரேக்கத்தின் சுருக்கமான அமைப்பு மற்ற வாசிப்புக்கும் இடமளிப்பதால் அடிக்குறிப்பில் அது பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் திருமுக வாழ்த்துரையின் செறிவும் காக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியத்தின் இணைநிலைத் தொடர்களை தெளிவாக்க கோடுகள் பயன்படுத்தப்பட்டுள்ளன; ஆனால் மூலத்தில் உள்ள இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
