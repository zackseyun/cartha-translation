id: 1CO.1.9
reference: 1 Corinthians 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: ta
  text: கடவுள் உண்மையுள்ளவர். அவர்மூலம்[a] நீங்கள் அவருடைய மகனும் நம் ஆண்டவருமான இயேசு மெசியாவுடனான ஐக்கியத்திற்கு[b] அழைக்கப்பட்டீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரால்.”
    reason: διά + genitive இங்கு கடவுளை அழைப்பின் செயற்பாட்டாளராகவோ வழிமுறையாகவோ குறிக்கலாம்.
  - marker: b
    text: “ஐக்கியம்” என்பதற்கு “பங்கேற்பு” அல்லது “பகிர்வு” என்றும் பொருள் கொள்ளலாம்.
    reason: கிரேக்க κοινωνία உறவுசார் ஐக்கியத்தையும் பகிர்ந்த பங்கேற்பையும் குறிக்கிறது.
  - marker: c
    text: கிரேக்கத்தில் Χριστός; “மெசியா” என்பது “அபிஷேகம் செய்யப்பட்டவர்” என்ற பொருளுடைய பட்டம்.
    reason: Χριστός என்ற பட்டத்தின் பொருளை விளக்குகிறது.
lexical_decisions:
- source_word: πιστὸς
  choice: உண்மையுள்ளவர்
  rationale: கடவுளின் நம்பகத்தன்மையையும் மாறாத உண்மைத்தன்மையையும் குறிக்கும் இயல்பான, மரியாதையான தமிழ் சொல்.
- source_word: δι’ οὗ
  choice: அவராலேயே
  rationale: διά + genitive இங்கு அழைத்தவராகிய கடவுளின் செயற்பாட்டைச் சுட்டுகிறது; வலியுறுத்தும் கிரேக்க அமைப்பை ‘-ஏ’ ஓரளவு தக்கவைக்கிறது.
- source_word: ἐκλήθητε
  choice: அழைக்கப்பட்டீர்கள்
  rationale: இறையியல் பொருளை மிகைப்படுத்தாமல், பவுலின் ‘அழைப்பு’ சொல்லாட்சியையும் இறந்தகாலச் செயலையும் காக்கிறது.
- source_word: κοινωνίαν
  choice: ஐக்கியத்தில் பங்குபெற
  rationale: κοινωνία என்பதிலுள்ள உறவுசார் ஐக்கியம் மற்றும் செயற்பாட்டுப் பங்கேற்பு ஆகிய இரு நுணுக்கங்களையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: அவருடைய மகனுடன்
  rationale: κοινωνία சார்ந்த genitive-ஐ தமிழில் இயல்பான உடனிணைவு பொருளில் ‘-உடன்’ என்று வழங்குகிறது.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: Χριστός இங்கு இயேசுவுக்குரிய பட்டமாக இருப்பதால் அதன் பொருளைத் தெரிவிக்கும் ‘மெசியா’ பயன்படுத்தப்படுகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, கிறிஸ்துவியல் பட்டத்தின் மரியாதையைத் தக்கவைக்கும் தமிழ் வடிவம்.
theological_decisions:
- issue: Χριστοῦ என்பதை பெயர்போல் ‘கிறிஸ்து’ என ஒலிபெயர்ப்பதா, பட்டமாக ‘மெசியா’ என மொழிபெயர்ப்பதா?
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Ἰησοῦ Χριστοῦ என்ற பழக்கமான தொடரிலிருந்தாலும், Χριστός-இன் பட்டப் பொருள் இங்கு தொடர்ந்து செயல்படுகிறது; ஆகவே பட்டத்தின் பொருளைத் தெளிவாகத் தருகிறது.
- issue: κοινωνίαν என்பதை வெறும் உறவாகவா அல்லது பங்கேற்பாகவா வழங்குவது?
  choice: ஐக்கியத்தில் பங்குபெற
  alternative: ஐக்கியம் கொள்ள
  rationale: மகனுடனான உறவையும் அவரில் கிடைக்கும் பகிர்ந்த பங்கேற்பையும் ஒன்றை மட்டும் தேர்ந்தெடுத்து சுருக்காமல் இரண்டையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘அவருடைய மகனும் நம் ஆண்டவருமான’ என்ற அமைப்பு இயேசுவை இரு தொடர்புகளிலும் தெளிவாக அடையாளப்படுத்துகிறது. இருப்பினும் கடைசியில் தனியாக வந்த “மெசியா[c]” என்பது நடையின் இயல்பை குலைக்கக்கூடும்; குறியீட்டை இயேசு மெசியா[c] என்ற இடத்திலேயே இணைத்துப் பதிப்பிக்க வேண்டும்.
