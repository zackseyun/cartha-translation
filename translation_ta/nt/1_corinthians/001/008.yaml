  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: ta
  text: அவரே உங்களை இறுதிவரை உறுதியாக நிலைநிறுத்துவார்[a]; நம்முடைய ஆண்டவராகிய இயேசு மேசியாவின்[c] நாளில் குற்றமற்றவர்களாக[b] இருப்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உறுதிப்படுத்துவார்’ அல்லது ‘பலப்படுத்துவார்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘குற்றஞ்சாட்டப்பட முடியாதவர்களாக’ அல்லது ‘கண்டனத்துக்கு இடமில்லாதவர்களாக.’
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் ‘கிறிஸ்து’; அந்தப் பட்டத்தின் பொருளைப் பாதுகாக்க இங்கு ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: உறுதிப்படுத்தி … இருக்கச் செய்வார்
  rationale: இந்த எதிர்கால வினை ஒருவரை நிலைபெறச் செய்வதையும் உறுதியாகக் காப்பதையும் குறிக்கிறது. தமிழில் வாக்கியத்துடன் இயல்பாக இணைய, தொடர்வினை அமைப்பில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἕως τέλους
  choice: இறுதிவரை
  rationale: காலத்தின் இறுதி எல்லைவரையிலான நீடிப்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀνεγκλήτους
  choice: குற்றமற்றவர்களாக
  rationale: குற்றச்சாட்டுக்கு ஆளாகாத நிலையை பொதுவாசகர்களுக்குத் தெளிவான தமிழில் தருகிறது; சொல்லின் நீதிமன்றச் சார்ந்த நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: நாளில்
  rationale: எதிர்கால நியாயத்தீர்ப்பு நாளைக் குறிக்கும் வேதாகமச் சொல்லாட்சியை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, மரியாதைமிக்க தமிழ் இணை; இங்கு இயேசுவின் பட்டமாகப் பொருந்துகிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: Χριστός என்பதன் பட்டப்பொருளை ‘கிறிஸ்து’ என்ற ஒலிபெயர்ப்பால் மறைக்காமல், ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற மேசியப் பொருளைக் காக்கிறது.
theological_decisions:
- issue: ὃς (‘அவர்’) என்பதன் குறிப்பு
  choice: முந்தைய வசனத்தின் ‘நம் ஆண்டவராகிய இயேசு மேசியா’ என்பவரைக் குறிக்கும் வகையில் ‘அவரே’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: முந்தைய விரிந்த சூழலில் குறிப்பிடப்படும் கடவுளைக் குறிக்கிறது எனக் கொள்ளலாம்.
  rationale: இலக்கணப்படி மிக அருகிலுள்ள ஆண்பால் ஒருமை முன்னிலை ‘நம் ஆண்டவராகிய இயேசு மேசியா’ என்பதே. ஆகவே உடனடி தொடரமைப்பை முதன்மைப்படுத்தினோம்.
- issue: ἀνεγκλήτους என்பதற்கும் βεβαιώσει என்பதற்கும் உள்ள தொடர்பு
  choice: உறுதிப்படுத்துவதன் விளைவாக அவர்கள் அந்த நாளில் குற்றமற்றவர்களாக இருப்பார்கள் என்பதைக் காட்டும் தமிழ் வாக்கிய அமைப்பு பயன்படுத்தப்பட்டது.
  alternative: ‘உங்களை இறுதிவரை உறுதிப்படுத்துவார்—அந்த நாளில் குற்றமற்றவர்களாய்’ என்று தொடர்பைத் தளர்வாக விடலாம்.
  rationale: மூலத்தில் ἀνεγκλήτους என்பது ὑμᾶς உடன் நிலை/விளைவைக் காட்டுகிறது. தமிழ் வாசிப்பில் அந்த இலக்கணத் தொடர்பைத் தெளிவாக்க ‘இருக்கச் செய்வார்’ பயன்படுத்தப்பட்டது; தனிப்பட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகமச் செறிவும் காக்கப்பட்டுள்ளன. ‘அவரே’ முந்தைய வசனத்துடனான தொடர்பைத் தக்கவைக்கிறது. ‘இறுதிவரை’, ‘உறுதிப்படுத்தி’, ‘குற்றமற்றவர்களாக’ ஆகியவை சாதாரண வாசகருக்கு எளிதில் புரியும் சொற்கள்; சட்டநுட்பமும் மாற்று மொழிபெயர்ப்புகளும் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
