id: 1CO.1.21
reference: 1 Corinthians 1:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: ta
  text: ஏனெனில், கடவுளின் ஞானத்தில் உலகம் ஞானத்தின் மூலம் கடவுளை அறிந்துகொள்ளாததால், அறிவிப்பின் மூடத்தனத்தின்[a][b] மூலம் விசுவாசிக்கிறவர்களைக் காப்பாற்ற கடவுள் விரும்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிரசங்கிப்பதன் மூடத்தனத்தின் மூலம்.”
    reason: alternative_reading
  - marker: b
    text: அதாவது, அறிவிக்கப்பட்ட செய்தியை உலகம் மூடத்தனம் என்று கருதுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: ஏனெனில் … அறிந்துகொள்ளாததால்
  rationale: γάρ முந்தைய வாதத்துடன் விளக்கத் தொடர்பை ஏற்படுத்துவதையும், ἐπειδή காரணச் சூழலை அறிமுகப்படுத்துவதையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: கடவுளின் ஞானத்தில்
  rationale: ἐν என்பது இங்கு சூழல், வரம்பு அல்லது ஏற்பாடு ஆகிய நுணுக்கங்களைத் தரக்கூடும்; அவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கும் ஒப்புமையான மொழிபெயர்ப்பு.
- source_word: οὐκ ἔγνω
  choice: அறிந்துகொள்ளவில்லை
  rationale: γινώσκω என்பதிலுள்ள அறிவுசார் மற்றும் உறவுசார் விரிவைத் தக்கவைக்கிறது; வாக்கியத்தில் காரணவினையெச்சமாக ‘அறிந்துகொள்ளாததால்’ என வருகிறது.
- source_word: ὁ κόσμος
  choice: உலகம்
  rationale: மனிதகுலத்தையும் அதன் உலகிய ஒழுங்கையும் பிரதிநிதித்துவப்படுத்தும் பவுலின் பயன்பாட்டை விளக்கச் சேர்க்கையின்றி காக்கிறது.
- source_word: διὰ τῆς σοφίας
  choice: ஞானத்தின் மூலம்
  rationale: διά + மரபுவேற்றுமை குறிப்பிடும் வழிமுறை அல்லது சாதனத்தை நேரடியாக வெளிப்படுத்துகிறது; ‘தனது ஞானம்’ என்று மூலத்தில் இல்லாத உடைமையைக் கூட்டவில்லை.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: கடவுள் மனமுவந்தார்
  rationale: வெறும் தீர்மானத்தைவிடத் தெய்வீக நல்விருப்பத்தை வெளிப்படுத்துகிறது; அதேவேளை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: அறிவிப்பின் மூடத்தனத்தின் மூலம்
  rationale: κήρυγμα முதன்மையாக அறிவிக்கப்பட்ட செய்தியைக் குறிக்கிறது; ‘அறிவிப்பு’ என்ற சொல் செய்தியையும் அதை அறிவிக்கும் செயலையும் ஓரளவு திறந்த நிலையில் வைக்கிறது. மூலத்தின் எதிர்மறைத் தோற்றத்தை மென்மைப்படுத்தாமல் ‘மூடத்தனம்’ எனக் காக்கிறது.
- source_word: σῶσαι
  choice: காப்பாற்ற
  rationale: σῴζω என்பதன் மீட்பு சார்ந்த பொருளை பொதுவாகப் புரியும் நவீனத் தமிழில் தருகிறது; தேவையற்ற சமயக்குழு சார்ந்த சொல்வழக்கைத் தவிர்க்கிறது.
- source_word: τοὺς πιστεύοντας
  choice: விசுவாசிக்கிறவர்களை
  rationale: நிகழ்காலப் பங்கேற்புவினையின் பெயர்ச்சொல் பயன்பாட்டை இயல்பாகக் காட்டுகிறது; மூலத்தை மீறிய கோட்பாட்டு நுணுக்கம் எதையும் சேர்க்கவில்லை.
theological_decisions:
- issue: διὰ τῆς μωρίας τοῦ κηρύγματος என்பதன் பொருள்
  choice: முதன்மையாக மூடத்தனம் என்று தோன்றும் அறிவிக்கப்பட்ட செய்தி; ஆனால் அறிவிக்கும் செயலையும் முற்றிலும் விலக்காத மொழிபெயர்ப்பு
  alternative: பிரசங்கிக்கும் செயல் அல்லது முறைதான் மூடத்தனமானது
  rationale: κήρυγμα பொதுவாக அறிவிக்கப்படும் செய்தியைக் குறித்தாலும், இச்சூழலில் பொது அறிவிப்புச் செயலின் நிழற்பொருளும் இருக்கலாம். ‘அறிவிப்பு’ இரு பரிமாணங்களையும் தக்கவைக்கிறது; ‘மூடத்தனம்’ என்பது கடவுளின் மதிப்பீடு என்று விளக்கிச் சொல்லாமல் பவுலின் திட்டமிட்ட இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கடவுளின் ஞானத்தில்’ என்ற சற்றே செறிவான அமைப்பு, ἐν என்பதன் உண்மையான தெளிவின்மையைத் தீர்த்துவிடாமல் காக்கிறது. இரு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் ‘அறிவிப்பின் மூடத்தனம்’ என்ற தொடரிலேயே வைக்கப்பட்டுள்ளன.
