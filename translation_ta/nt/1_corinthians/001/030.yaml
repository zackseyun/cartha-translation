reference: 1 Corinthians 1:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: ta
  text: ஆனால், அவரிடமிருந்தே நீங்கள் மேசியாவாகிய இயேசுவுக்குள் இருக்கிறீர்கள். அவரே நமக்குக் கடவுளிடமிருந்து வந்த ஞானமும், நீதியும்[a], பரிசுத்தமாக்குதலும், மீட்பும் ஆனார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயம்.”
    reason: δικαιοσύνη என்பதன் பொருள் பரப்பில் நீதியான நிலையும் நியாயமும் அடங்குவதால் மாற்றுப் பொருள் தரப்படுகிறது.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: அவரிடமிருந்தே
  rationale: ἐξ என்பதன் மூலாதாரம் அல்லது தோற்றம் என்ற பொருளைப் பாதுகாத்து, விசுவாசிகள் மேசியாவுக்குள் இருப்பது கடவுளிடமிருந்தே வருகிறது என்பதை வலியுறுத்துகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவுக்குள்
  rationale: ἐν என்பதற்கான பவுலின் உறவுசார் உருவகத்தை விளக்கவுரையால் குறுக்காமல் ‘உள்ளே’ என்ற வடிவில் காக்கிறது; Χριστός பட்டப்பெயராக இருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐγενήθη
  choice: ஆனார்
  rationale: γίνομαι என்பதன் ‘ஆனார்’ என்ற நேரடியான பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: σοφία
  choice: ஞானம்
  rationale: உலக ஞானத்துக்கும் கடவுளின் ஞானத்துக்கும் இடையிலான உடனடிச் சூழலோடு பொருந்தும் நேரடியான சொல்.
- source_word: ἀπὸ θεοῦ
  choice: கடவுளிடமிருந்து வந்த
  rationale: கடவுளே மூலாதாரம் என்ற பொருளைக் காக்கிறது; தமிழ் வாக்கியத்தில் இது மிக அருகிலுள்ள ‘ஞானம்’ என்பதுடன் தெளிவாக இணைந்தாலும், தொடர்ந்து வரும் பெயர்ச்சொற்களுடனான தொடர்பை முற்றாகத் துண்டிக்கவில்லை.
- source_word: δικαιοσύνη
  choice: நீதி
  rationale: δικαιοσύνη என்பதன் நீதியான நிலை மற்றும் நியாயம் ஆகிய பொருள் பரப்பைச் சுருக்காமல் வழங்கும் இயல்பான தமிழ் சொல்.
- source_word: ἁγιασμός
  choice: தூய்மையாக்குதல்
  rationale: புனிதமாக்கப்படும் செயல் அல்லது நிலையை சாதாரண வாசகருக்குப் புரியும் தற்போதைய தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπολύτρωσις
  choice: மீட்பு
  rationale: விடுவித்தல் மற்றும் விலை கொடுத்து மீட்டல் ஆகிய பின்னணியைத் தாங்கும் நிலையான, தெளிவான தமிழ் சொல்.
theological_decisions:
- issue: ‘கடவுளிடமிருந்து வந்த ஞானம்’ என்பதற்கும் தொடர்ந்து வரும் மூன்று பெயர்ச்சொற்களுக்கும் உள்ள தொடர்பு
  choice: ‘கடவுளிடமிருந்து வந்த’ என்பது இலக்கண ரீதியில் ‘ஞானம்’ என்பதோடு மிக நெருக்கமாக வைக்கப்பட்டு, நீதி, தூய்மையாக்குதல், மீட்பு ஆகியவை அதே தொடரில் இணைக்கப்பட்டுள்ளன.
  alternative: ‘கடவுளிடமிருந்து’ என்பது நான்கு பெயர்ச்சொற்களையும் சமமாக மாற்றியுரைக்கிறது; அல்லது கடைசி மூன்றும் ஞானத்துக்கு விளக்கமான இணைப்பெயர்கள்.
  rationale: கிரேக்கத் தொடரின் நெருக்கத்தையும் பட்டியலின் திறந்த தொடர்பையும் காக்கிறது; பெயர்ச்சொற்களுக்கிடையிலான துல்லியமான இறையியல் உறவை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மேசியாவாகிய இயேசு’ பட்டப்பெயரின் பொருளைத் தெளிவாக்குகிறது; ‘இயேசுவுக்குள்’ பவுலின் மூல உருவகத்தைப் பாதுகாக்கிறது. பட்டியலின் கிரேக்கத் தொடரை மிகையாக மறுசீரமைக்காமல் இரண்டு தமிழ் வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு அளிக்கப்பட்டுள்ளது.
