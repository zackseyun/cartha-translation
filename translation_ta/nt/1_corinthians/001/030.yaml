revisions:
- from: ஆனால், அவரிடமிருந்தே நீங்கள் மேசியாவாகிய இயேசுவுக்குள் இருக்கிறீர்கள். அவரே நமக்குக் கடவுளிடமிருந்து வந்த ஞானமும், நீதியும்[a], தூய்மையாக்குதலும், மீட்பும் ஆனார்.
  to: ஆனால், அவரிடமிருந்தே நீங்கள் மேசியாவாகிய இயேசுவுக்குள் இருக்கிறீர்கள். அவரே நமக்குக் கடவுளிடமிருந்து வந்த ஞானமும், நீதியும்[a], பரிசுத்தமாக்குதலும், மீட்பும் ஆனார்.
  rationale: Only the rendering of ἁγιασμός has been revised. ‘பரிசுத்தமாக்குதல்’ conveys sanctification/making holy rather than mere purification, while retaining the draft’s syntax and its deliberate openness concerning the relation of ‘கடவுளிடமிருந்து’ to the coordinated nouns.
  reviewer_model: gpt-5.6-terra
