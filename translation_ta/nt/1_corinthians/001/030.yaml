  revision_rationale: Only the rendering of ἁγιασμός has been revised. ‘பரிசுத்தமாக்குதல்’ conveys sanctification/making holy rather than mere purification, while retaining the draft’s syntax and its deliberate openness concerning the relation of ‘கடவுளிடமிருந்து’ to the coordinated nouns.
