source:
  edition: SBLGNT
  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: ta
  text: ஆகவே, நம் ஆண்டவராகிய இயேசு கிறிஸ்து வெளிப்படுவதை நீங்கள் ஆவலோடு எதிர்பார்த்திருக்கையில், எந்த அருள்கொடையிலும் குறைவுபடாமல் இருக்கிறீர்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அருள்கொடை” என்பதற்கு “வரம்” அல்லது “ஆவிக்குரிய வரம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இயேசு கிறிஸ்து வெளிப்படுவதை” என்பதற்கு “மேசியாவாகிய இயேசு தோன்றுவதை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_and_title_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட கடவுளின் அருளால் விளைந்த முடிவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὑστερεῖσθαι
  choice: குறைவுபடாமல் இருக்கிறீர்கள்
  rationale: எதிலும் பற்றாக்குறையின்றி இருப்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: எந்த அருள்கொடையிலும்
  rationale: χάρισμα என்பதில் உள்ள அருளால் அளிக்கப்படும் கொடை என்ற பொருளைத் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது; வெறும் ‘வரம்’ என்பதைவிட மூலச்சொல்லின் அருள் சார்ந்த நுணுக்கம் தெளிவாகிறது.
- source_word: ἀπεκδεχομένους
  choice: ஆவலோடு எதிர்பார்த்திருக்கையில்
  rationale: தொடர்ந்து, மிகுந்த எதிர்பார்ப்புடன் காத்திருக்கும் பங்கேற்பு வினையின் தீவிரத்தையும் காலத் தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: ἀποκάλυψιν
  choice: வெளிப்படுவதை
  rationale: ἀποκάλυψις என்பதன் வெளிப்படுத்துதல் அல்லது வெளிப்படுதல் என்ற நேரடிப் பொருளை இயல்பான தமிழில் தருகிறது; இறுதிக்காலத் தோற்றத்தைக் குறிக்கும் சூழலுக்கும் பொருந்துகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டில் κύριος என்பதற்கான நிலையான, மரியாதைமிக்க தமிழாக்கம்.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு கிறிஸ்து
  rationale: இச்சூழலில் Χριστός தனியாக வலியுறுத்தப்படும் பட்டமாக அல்லாமல், இயேசுவின் பெயரோடு நிலைபெற்ற பெயர் போன்ற இணைப்பாக வருகிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-ஐ எவ்வாறு மொழிபெயர்ப்பது
  choice: இயேசு கிறிஸ்து
  alternative: மேசியாவாகிய இயேசு
  rationale: இங்கே சொற்றொடர் பெயர் போன்ற நிலையான அடையாளமாகச் செயல்படுகிறது; மேசியா என்ற பட்டத்தைத் தனியே முன்னிறுத்தவில்லை. இருப்பினும் அதன் பட்டப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀποκάλυψις என்பதன் இறுதிக்காலச் சுட்டு
  choice: வெளிப்படுதல்
  alternative: வருகை / தோன்றுதல்
  rationale: மூலச்சொல்லின் ‘வெளிப்படுத்துதல், வெளிப்படுதல்’ என்ற கருத்தைத் தக்கவைத்து, அது தோற்றத்தையா வருகையையா குறிக்கிறது என்பதை உரையில் தேவையின்றி ஒரே விதமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘அருள்கொடை’ மூலம் χάρισμα என்பதன் அருள் சார்ந்த நுணுக்கம் காக்கப்பட்டுள்ளது; ‘வெளிப்படுதல்’ மூலம் இறுதிக்கால வெளிப்பாட்டின் பொருள் தேவையின்றி குறுக்கப்படவில்லை.
