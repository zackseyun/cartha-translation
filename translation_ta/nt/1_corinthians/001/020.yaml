source:
  edition: SBLGNT
  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: ta
  text: ஞானி எங்கே? மறைநூல் அறிஞர் எங்கே? இந்தக் காலத்தின் வாதக்காரர் எங்கே?[a] உலகத்தின் ஞானத்தைக் கடவுள் முட்டாள்தனமாக்கவில்லையா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தக் காலம்’ என்பதற்கான கிரேக்கச் சொல், பின்னர் வரும் ‘உலகம்’ என்பதற்கான கிரேக்கச் சொல்லிலிருந்து வேறுபட்டது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘உலகத்தின் ஞானம் முட்டாள்தனம் என்று கடவுள் காட்டவில்லையா?’
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: எங்கே?
  rationale: அடுத்துவரும் பெயர்ச்சொற்களுடன் இணைந்து சவால்விடும் சொல்லாட்சிக் கேள்வியாக இருப்பதால், இயல்பான தமிழில் ‘எங்கே?’ என வழங்கப்பட்டது.
- source_word: σοφός
  choice: ஞானி
  rationale: ஆண்பால் ஒருமை வடிவத்தைத் தமிழில் இயல்பாகவும், ஒரு வகையினரைப் பிரதிநிதித்துவப்படுத்தும் பொதுப்பொருளுடனும் காட்டுகிறது.
- source_word: γραμματεύς
  choice: வேத அறிஞர்
  rationale: ‘எழுத்தர்’ என்பது இச்சூழலில் நவீன வாசகருக்குத் தவறான தொழில்சார் பொருளைக் கொடுக்கக்கூடும்; வேத எழுத்துக்களில் தேர்ச்சி பெற்றவரைக் குறிக்கும் வரலாற்றுப் பொருளை ‘வேத அறிஞர்’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: συζητητής
  choice: வாதக்காரர்
  rationale: விவாதித்து எதிர்வாதம் செய்பவரைக் குறிக்கும் சொல்லைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: τοῦ αἰῶνος τούτου
  choice: இந்தக் காலத்தின்
  rationale: αἰών என்பதைக் ‘காலம்’ என்றும், பின்னுள்ள κόσμος என்பதைக் ‘உலகம்’ என்றும் வேறுபடுத்திப் பாதுகாக்கிறது.
- source_word: οὐχὶ
  choice: '...வில்லையா?'
  rationale: ஆம் என்ற பதிலை எதிர்பார்க்கும் கிரேக்க சொல்லாட்சிக் கேள்வியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐμώρανεν
  choice: முட்டாள்தனமாக்கவில்லையா
  rationale: வினையின் காரணவினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது; ‘முட்டாள்தனம் என்று காட்டவில்லையா’ என்பதும் சாத்தியமான விளக்கம்.
- source_word: σοφίαν
  choice: ஞானத்தை
  rationale: உலகம் ஞானம் என்று உரிமைகோரும் ஒன்றை பவுல் எதிர்மறையாக மதிப்பிடும் முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: κόσμου
  choice: உலகத்தின்
  rationale: κόσμος என்பதற்கான இயல்பான இணை; αἰών என்பதிலிருந்து சொற்பொருள் வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: ஒரே வசனத்தில் αἰών மற்றும் κόσμος ஆகியவற்றை வேறுபடுத்துதல்
  choice: αἰών என்பதை ‘காலம்’ என்றும் κόσμος என்பதை ‘உலகம்’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘உலகம்’ என்று மொழிபெயர்த்தல்
  rationale: மூலத்தில் இரண்டு வேறுபட்ட கிரேக்கச் சொற்கள் உள்ளன; அவற்றை வேறுபடுத்துவது தற்போதைய காலத்துக்கும் உலகத்தின் ஞானத்துக்கும் இடையிலான சொல்லாட்சித் தொடர்பைச் சீராகப் பாதுகாக்கிறது.
- issue: ἐμώρανεν என்பதன் காரணவினை மற்றும் வெளிப்படுத்தும் பொருள்
  choice: ‘முட்டாள்தனமாக்கவில்லையா?’ என்ற காரணவினை வடிவத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘முட்டாள்தனம் என்று காட்டவில்லையா?’
  rationale: கிரேக்க வினையின் நேரடியான காரணவினைப் பலத்தை முதன்மை உரை காக்கிறது; சூழலில் அது உலக ஞானத்தின் உண்மை இயல்பை வெளிப்படுத்துவதையும் குறிக்கக்கூடும் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தொடர்ச்சியான சொல்லாட்சிக் கேள்விகளின் கூர்மையைப் பாதுகாக்கும் கண்ணியமான நடை. ‘வேத அறிஞர்’ வரலாற்றுச் ‘scribe’ என்பதன் பணியை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது. ‘இந்தக் காலம்’ மற்றும் ‘உலகம்’ எனும் வேறுபாடு திட்டமிட்டு வைக்கப்பட்டுள்ளது; அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
