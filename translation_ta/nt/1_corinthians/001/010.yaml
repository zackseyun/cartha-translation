id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: ta
  text: 'சகோதரர்களே[a], நம் ஆண்டவராகிய இயேசு மெசியாவின்[b] பெயரால் உங்களை வேண்டிக்கொள்கிறேன்: நீங்கள் எல்லாரும் ஒரே காரியத்தையே பேசுங்கள்; உங்களிடையே பிளவுகள்[c] இருக்கக்கூடாது. மாறாக, ஒரே மனதிலும் ஒரே கருத்திலும்[e] ஒன்றிணைக்கப்பட்டிருங்கள்[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதர சகோதரிகளே’ என்றும் பொருள் கொள்ளலாம்; கிரேக்க ஆண்பால் பன்மை வடிவம் இங்கு விசுவாசக் குழுமம் முழுவதையும் குறிக்கக்கூடும்.
    reason: cultural_note
  - marker: b
    text: மரபாக, ‘கிறிஸ்து.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பிரிவினைகள்’ அல்லது ‘கட்சிப்பிரிவுகள்.’
    reason: lexical_alternative
  - marker: d
    text: அல்லது, ‘சீர்செய்யப்பட்டிருங்கள்,’ ‘மீண்டும் பொருத்தப்பட்டிருங்கள்.’
    reason: lexical_alternative
  - marker: e
    text: அல்லது, ‘ஒரே தீர்மானத்தில்,’ ‘ஒரே உறுதியான நிலைப்பாட்டில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: வேண்டிக்கொள்கிறேன்
  rationale: இங்கு பவுல் வெறும் கட்டளையிடாமல், மேய்ப்பருக்குரிய அக்கறையோடு வலியுறுத்தி வேண்டுகிறார். ‘வேண்டிக்கொள்கிறேன்’ என்பது அந்தத் தொனியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மை. ஆகவே முதன்மை உரையில் அதைப் பிரதிபலித்து, சபை முழுவதையும் உள்ளடக்கும் பயன்பாட்டை அடிக்குறிப்பில் குறிப்பிட்டுள்ளோம்.
- source_word: διὰ τοῦ ὀνόματος
  choice: பெயரால்
  rationale: διά + ஆறாம் வேற்றுமை இங்கு இயேசுவின் அதிகாரத்தை அடிப்படையாகக் கொண்ட வேண்டுகோளைக் குறிக்கிறது. ‘பெயரால்’ என்பது தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் அதிகாரத்தையும் புதிய ஏற்பாட்டின் இயேசுவைப் பற்றிய அறிக்கையையும் ‘ஆண்டவர்’ தெளிவாக எடுத்துரைக்கிறது.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுகிறது. ‘மெசியா’ அதன் பட்டத்தன்மையைப் பாதுகாக்கிறது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: நீங்கள் எல்லாரும் ஒரே காரியத்தையே பேசுங்கள்
  rationale: சொல்லளவில் உள்ள ‘அதே ஒன்றைப் பேசுதல்’ என்ற வலியுறுத்தலைப் பாதுகாக்கிறது; அதை வெறுமனே ‘ஒத்துக்கொள்ளுங்கள்’ என்று கருத்தாக்கவில்லை.
- source_word: σχίσματα
  choice: பிளவுகள்
  rationale: சபைக்குள் உண்டாகும் பிரிவையும் உறவு முறிவையும் சாதாரண வாசகர்களுக்கு தெளிவாகத் தெரிவிக்கும் இயல்பான சொல்.
- source_word: κατηρτισμένοι
  choice: முழுமையாக ஒன்றிணைக்கப்பட்டிருங்கள்
  rationale: καταρτίζω என்பது சரியாகப் பொருத்துதல், சீர்செய்தல் அல்லது மீட்டமைத்தல் என்ற பொருள்களைத் தருகிறது. பிளவுகள் பற்றிய இச்சூழலில், அதன் விளைவுநிலையையும் மறுபடியும் இணைக்கப்படுதலையும் இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: νοῒ
  choice: மனம்
  rationale: νοῦς என்பது சிந்திக்கும் மனம் அல்லது புரிதலைக் குறிக்கிறது. ‘மனம்’ சுருக்கமாகவும் γνώμη என்பதிலிருந்து வேறுபட்டதாகவும் உள்ளது.
- source_word: γνώμῃ
  choice: கருத்து
  rationale: γνώμη என்பது கருத்து, மதிப்பீடு, தீர்மானம் அல்லது உறுதியான நிலைப்பாட்டைக் குறிக்கலாம். இங்கு ‘கருத்து’ அந்தப் பரப்பை தேவையின்றிக் குறுக்காமல் இயல்பான தமிழை வழங்குகிறது.
theological_decisions:
- issue: Χριστός என்ற கிறிஸ்தியல் பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பெயரின் ஒரு பகுதியாக மட்டும் மங்கிவிடாமல் பட்டத்தன்மையுடன் உள்ளது. ஆகவே பொருளுள்ள பட்டமாக ‘மெசியா’ என்று மொழிபெயர்த்து, மரபான வடிவத்தை அடிக்குறிப்பில் வைத்துள்ளோம்.
- issue: ἀδελφοί என்ற பாலினம் குறிக்கப்பட்ட அழைப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’; உள்ளடக்கிய பயன்பாடு அடிக்குறிப்பில்
  alternative: சகோதர சகோதரிகளே
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரை வெளிப்படுத்துகிறது; அதேவேளை பவுல் விசுவாசக் குழுமம் முழுவதையும் நோக்கிப் பேசும் சூழலையும் அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: ஒற்றுமைக்கான வேண்டுகோளின் தன்மை
  choice: ஒரே காரியத்தைப் பேசுதல், பிளவின்றி முழுமையாக ஒன்றிணைக்கப்படுதல்
  alternative: எல்லா விஷயங்களிலும் தனிப்பட்ட கருத்து வேறுபாடே இல்லாமல் இருத்தல்
  rationale: உரை சபையின் பிரிவினைக்கு எதிராக ஒருமனத்தையும் ஒரே கருத்தையும் கோருகிறது. ஆனால் ஒவ்வொரு துணை விஷயத்திலும் முழுமையான கருத்து ஒரேமையைத் திணிக்கிறது என்று உரையை விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரு வாக்கியங்களாக அமைக்கப்பட்டாலும், வேண்டுகோள், பிளவின்மை, ஒன்றிணைவு ஆகிய தர்க்கத் தொடர் பாதுகாக்கப்பட்டுள்ளது. ‘இப்போது’ போன்ற மூலத்தில் இல்லாத காலக் குறிப்பு சேர்க்கப்படவில்லை.
