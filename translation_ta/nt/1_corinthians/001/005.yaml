translation:
  language: ta
  text: ஏனெனில், நீங்கள் அவரில் எல்லா வகையிலும், எல்லாப் பேச்சிலும் எல்லா அறிவிலும், வளப்படுத்தப்பட்டீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் வரும் நன்றியறிவித்தலுக்கான காரணத்தை இவ்வாக்கியம் தருவதால், காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν παντὶ
  choice: எல்லாவற்றிலும்
  rationale: நபுஞ்சக ஒருமை வடிவிலுள்ள இந்த விரிவான சொற்றொடர் முழுமையைக் குறிக்கிறது; அடுத்து வரும் பேச்சும் அறிவும் அதன் குறிப்பான விளக்கங்களாக அமைகின்றன.
- source_word: ἐπλουτίσθητε
  choice: செல்வமுள்ளவர்களாக்கப்பட்டீர்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் செல்வத்தின் உருவகத்தையும் காக்கிறது; அவர்கள் தாமே செல்வந்தரானார்கள் என்பதற்குப் பதிலாக வேறொருவரால் வளப்படுத்தப்பட்டார்கள் என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள்
  rationale: ἐν என்பதன் ஒன்றிப்பின் அல்லது வாழ்வுத்தளத்தின் பொருளைத் தக்கவைத்து, கிறிஸ்துவுடனான ஒன்றிப்பைக் குறிக்கும் பவுலின் மொழியை காரணம் அல்லது கருவி என்ற பொருளாக மாற்றாமல் காக்கிறது.
- source_word: ἐν παντὶ λόγῳ
  choice: எல்லாப் பேச்சிலும்
  rationale: γνῶσις என்பதுடன் இணையும் சூழலில் λόγος வாய்மொழி வெளிப்பாடு அல்லது பேசும் திறனைக் குறிப்பதாகத் தெரிகிறது; தமிழில் இத்தேர்வு சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: πάσῃ γνώσει
  choice: எல்லா அறிவிலும்
  rationale: γνῶσις என்பதன் பரந்த அறிவுப் பொருளையும், 'எல்லாப் பேச்சிலும்' என்பதுடனான இணை அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: ἐν αὐτῷ என்பதன் உறவு
  choice: அவருக்குள்
  alternative: அவரால் / அவர் மூலமாக
  rationale: இங்கு ἐν என்பது கருவியைவிட கிறிஸ்துவுக்குள் இருக்கும் நிலை அல்லது அவருடனான ஒன்றிப்பைக் குறிக்கும் வாய்ப்பு அதிகம்; எனவே அந்தத் தத்துவப் பதற்றத்தை விளக்கவுரையால் மாற்றாமல் நேரடியாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பும் கண்ணியமும் உள்ள நடை. கிரேக்கத்தின் செயப்பாட்டு வடிவமும் செல்வ உருவகமும் பாதுகாக்கப்பட்டுள்ளன. இரட்டை கோடுகள் 'எல்லாவற்றிலும்' என்பதைக் 'எல்லாப் பேச்சிலும் எல்லா அறிவிலும்' என்பது விளக்குவதைத் தெளிவாக்குகின்றன.
