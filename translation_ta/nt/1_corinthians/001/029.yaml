  to: எந்த மாம்சமும் கடவுளுக்கு முன்பாகப் பெருமை பாராட்டாதபடி[a].
  rationale: The revision preserves the draft’s faithful rendering of the telic negative clause and its deliberate retention of ‘மாம்சம்’ for σάρξ. It corrects the literal Greek gloss in the footnote and makes a minor orthographic improvement without altering meaning.
