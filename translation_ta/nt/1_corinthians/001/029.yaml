  text: so that no flesh may boast before God[a].
translation:
  language: ta
  text: எந்த மாம்சமும் கடவுளுக்கு முன்பாகப் பெருமை பாராட்டாதபடி[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “எந்த மனிதரும் கடவுளுக்கு முன்பாகப் பெருமை பாராட்டாதபடி.” சொல்லுக்குச் சொல்: “எல்லா மாம்சமும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: -ஆதபடி
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் இணைப்பைத் தமிழில் இயல்பான எதிர்மறை நோக்கத் தொடராகக் காட்டுகிறது.
- source_word: μὴ καυχήσηται
  choice: பெருமைபாராட்டாதபடி
  rationale: எதிர்மறையுடன் வரும் நோக்கவாக்கியத்தின் துணைநிலை வினையை இயல்பாகவும் அதன் தடுப்பு நோக்கைத் தக்கவைத்தும் மொழிபெயர்க்கிறது.
- source_word: πᾶσα σὰρξ
  choice: எந்த மாம்சமும்
  rationale: மறுப்பின் கீழ் உள்ள πᾶσα என்பதன் உலகளாவிய விலக்கை ‘எந்த ... உம்’ எனக் காட்டி, பவுலின் ‘மாம்சம்’ என்ற உருவக மொழியையும் தக்கவைக்கிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: கடவுளின் முன்னிலையில் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: பவுலின் பயன்பாட்டில் σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: மாம்சம்
  alternative: மனிதர்
  rationale: இங்கு σάρξ என்பது ‘பாவ இயல்பு’ என்னும் உள்ளார்ந்த நெறிக் கோட்பாட்டைக் குறிக்காமல், கடவுளுக்கு முன்பாக நிற்கும் பலவீனமான மனிதகுலத்தைக் குறிக்கிறது. ‘மாம்சம்’ என்பது பவுலின் சொல்லாட்சியையும் அதன் கருத்துச் செறிவையும் காக்கிறது; அடிக்குறிப்பு இயல்பான பொருளை விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான வேதாகம நடை. மூலத்தின் சுருக்கமான நோக்கவாக்கிய அமைப்பும் ‘மாம்சம்’ என்ற பவுலின் சொல்லாட்சியும் பாதுகாக்கப்பட்டுள்ளன.
