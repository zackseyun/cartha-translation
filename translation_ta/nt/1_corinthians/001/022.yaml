translation:
  language: ta
  text: ஏனெனில், யூதர்கள் அடையாளங்களைக் கேட்கிறார்கள்[a]; கிரேக்கர்களோ ஞானத்தைத் தேடுகிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அடையாளங்கள்” என்பதை “அற்புத அடையாளங்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கிரேக்கர்கள்” என்பதை விரிவான பொருளில் “பிற இனத்தார்” என்று மொழிபெயர்க்கலாம். ஆனால் ஞானத்தைப் பற்றிய குறிப்பினால், பவுல் கிரேக்கப் பண்பாட்டுச் சூழலைக் குறிப்பாக மனதில் வைத்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδή
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், இயல்பான தமிழில் காரணப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: இங்கு கிரேக்கர்களுடன் ஒப்பிடப்படும் யூத சமய-பண்பாட்டுக் குழுவைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: கிரேக்கச் சொல்லின் பரந்த பொருளை நேரடியாகப் பாதுகாக்கிறது; சூழலில் அற்புத அடையாளங்கள் என்ற நுண்பொருளும் சாத்தியமாகவே உள்ளது.
- source_word: αἰτοῦσιν
  choice: கேட்கிறார்கள்
  rationale: வினையின் நிகழ்காலத் தொடர்ச்சியையும், தேவையின்றி ‘வற்புறுத்துகிறார்கள்’ என்று வலுப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: Ἕλληνες
  choice: கிரேக்கர்கள்
  rationale: ‘ஞானம்’ என்பதுடனான பண்பாட்டு சொல்லாட்சியைப் பாதுகாக்கிறது; ‘பிற இனத்தார்’ என்பதைவிட மூலத்தின் குறிப்பான சொல்லுக்கு நெருக்கமானது.
- source_word: σοφίαν
  choice: ஞானம்
  rationale: சொல்லின் பரந்த கருத்தளவைப் பாதுகாக்கும் நேரான, மரியாதைமிக்க தமிழ் இணைச்சொல்; அதைத் தத்துவ ஞானம் என்று தேவையின்றி குறுக்கவில்லை.
- source_word: ζητοῦσιν
  choice: தேடுகிறார்கள்
  rationale: நிகழ்காலச் செயலை இயல்பான தமிழில் வெளிப்படுத்தி, கிரேக்க வினையின் பொருளை நெருக்கமாகக் காக்கிறது.
