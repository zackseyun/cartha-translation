translation:
  language: ta
  text: ஆனால் நாங்களோ சிலுவையில் அறையப்பட்ட மெசியாவை[a] அறிவிக்கிறோம்; அவர் யூதர்களுக்கு இடறற்கல்லாகவும், பிற இனத்தாருக்கு மடமையாகவும்[b] இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிலுவையில் அறையப்பட்ட கிறிஸ்துவை.”
    reason: alternative_reading
  - marker: b
    text: “பிற இனத்தார்” என்பதற்கான கிரேக்கச் சொல் நேரடியாக “இனங்கள்” அல்லது “தேசங்கள்” என்று பொருள்படும்; இங்கு யூதர்களுக்கு மாறாக யூதரல்லாதவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: அறிவிக்கிறோம்
  rationale: அதிகாரப்பூர்வமாகவும் வெளிப்படையாகவும் பிரகடனம் செய்வதைக் குறிக்கும் கிரேக்க வினையின் வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: Χριστὸν
  choice: மெசியாவை
  rationale: இங்கு இது இயேசுவின் பெயரின் ஒரு பகுதியாக அல்லாமல், அறிவிக்கப்படும் அவரது அபிஷேகம் பெற்ற அரசர் என்ற பதவியை வலியுறுத்துகிறது.
- source_word: ἐσταυρωμένον
  choice: சிலுவையில் அறையப்பட்ட
  rationale: நிறைவேற்றப்பட்ட சிலுவை மரணத்தையும் அதன் தொடர்ந்த முக்கியத்துவத்தையும் இயல்பான தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: Ἰουδαίοις
  choice: யூதர்களுக்கு
  rationale: யூதர்–பிற இனத்தார் என்ற இன-மத எதிரிணையைத் தெளிவாகக் காட்டுகிறது.
- source_word: σκάνδαλον
  choice: இடறல்
  rationale: தடுமாறச் செய்யும் பொருள் என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; வெறும் ‘மனவருத்தம்’ அல்லது ‘அவமதிப்பு’ என்று தட்டையாக்கவில்லை.
- source_word: ἔθνεσιν
  choice: பிற இனத்தாருக்கு
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘இனங்கள்/தேசங்கள்’; இங்கு யூதர்களுக்கு மாறான யூதரல்லாத மக்களைக் குறிக்கும் சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
- source_word: μωρίαν
  choice: மடமை
  rationale: இவ்வதிகாரத்தில் மீண்டும் வரும் ‘மூடத்தனம்/மடமை’ என்ற கருத்துத் தொடர்பைப் பாதுகாக்கும் dignified Tamil noun.
theological_decisions:
- issue: Χριστός என்பதைப் பதவிப்பெயராகவா, பெயர்போன்ற வடிவமாகவா மொழிபெயர்ப்பது
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: அப்போஸ்தலர் அறிவிக்கும் செய்தியின் உள்ளடக்கமும் இயேசுவைப் பற்றிய மெசியா உரிமையும் இங்கு முன்னிலைப்படுவதால், பதவிப்பெயரை வெளிப்படையாகக் காட்டுவது பொருத்தமானது.
- issue: ἐσταυρωμένον என்பதன் perfect participle நுணுக்கம்
  choice: சிலுவையில் அறையப்பட்ட மெசியா
  alternative: சிலுவையில் அறையப்பட்டு இருப்பவரான மெசியா
  rationale: தமிழில் இயல்பான பெயரெச்சத் தொடர் முடிந்த செயலைத் தெளிவாகக் காட்டுகிறது; மிக விரிவாக மொழிபெயர்த்து மூலத்தின் செறிவை இழக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் dignified நடையில் மொழிபெயர்க்கப்பட்டது. μὲν…δὲ எதிரிணை ‘யூதர்களுக்கு… பிற இனத்தாருக்கு…’ என்ற இணை அமைப்பில் பாதுகாக்கப்பட்டுள்ளது; தமிழில் முழுமையான வாக்கியமாக இயல்புற ‘அவர்… இருக்கிறார்’ சேர்க்கப்பட்டுள்ளது.
