base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ta
  text: நம் தந்தையாகிய கடவுளிடமிருந்தும் ஆண்டவராகிய இயேசு மெசியாவிடமிருந்தும் உங்களுக்குக் கிருபையும் சமாதானமும் உண்டாவதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “ஆண்டவராகிய இயேசு கிறிஸ்துவிடமிருந்தும்.”'
    reason: Χριστός என்பதற்கான மரபுவழி தமிழ் மாற்றுவடிவம்.
lexical_decisions:
- source_word: χάρις
  choice: கிருபை
  rationale: பவுலின் வாழ்த்துரையில் இச்சொல்லுக்குள்ள இறையியல் செறிவையும் தமிழ் கிறிஸ்தவ வழக்கில் அதன் அறிமுகத்தையும் காக்கிறது; ‘தயவு’ என்பதைக் காட்டிலும் இங்கு பொருத்தமானது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: வாழ்த்துரையில் வரும் கொடைவேற்றுமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: உறவு நலன், முழுமையான நல்வாழ்வு ஆகிய விரிந்த எதிரொலிகளைக் கொண்ட வழக்கமான வேதாகமச் சொல்லாக்கம்.
- source_word: ἀπὸ
  choice: இடமிருந்தும்
  rationale: கிருபையும் சமாதானமும் வரும் மூலத்தைத் தெளிவாகக் குறிக்கிறது; ஒரே கிரேக்க முன்னிடைச்சொல் தந்தையையும் இயேசுவையும் இணைத்து ஆளுவதைத் தமிழிலும் பகிர்ந்த அமைப்பால் காக்கிறது.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: நம் தந்தையாகிய கடவுள்
  rationale: கிரேக்கத்தில் ‘கடவுள்’ மற்றும் ‘நம் தந்தை’ ஒரே நபரைக் குறிக்கும் இணைப்பை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் பட்டப்பெயர் வலிமையையும் நிலைபெற்ற தமிழ் வேதாகம வழக்கையும் காக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் ‘அபிஷேகம் பெற்றவர்/மெசியா’ என்ற பட்டப்பெயர் பொருளை மொழிபெயர்க்கிறது; தமிழில் பெயருடன் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: கிருபையும் சமாதானமும் தந்தையிடமிருந்தும் இயேசுவிடமிருந்தும் வரும் ஒருங்கிணைந்த மூல உறவைப் பாதுகாப்பது
  choice: ‘இடமிருந்தும்’ என்ற இணை வடிவத்தை இருவருடனும் பயன்படுத்தி, ஒரே மூலக் கட்டமைப்பாக மொழிபெயர்த்தல்
  alternative: இரு தனித்த வாக்கியத் தொடர்களாகப் பிரித்தல் அல்லது இரண்டாவது மூல உறவை மெலிதாக்குதல்
  rationale: கிரேக்கத்தில் ஒரே ἀπό, ‘நம் தந்தையாகிய கடவுள்’ மற்றும் ‘ஆண்டவராகிய இயேசு மெசியா’ ஆகிய இருவரையும் ஒருங்கிணைக்கிறது. மேலதிக கோட்பாட்டு விளக்கம் சேர்க்காமல் அந்த இலக்கணத் தொடர்பைத் தமிழ் வெளிப்படுத்துகிறது.
- issue: Χριστός என்பதைக் பட்டப்பெயராகவா மரபுவழிப் பெயராக்கமாகவா வழங்குவது
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் Χριστός என்பதன் பட்டப்பெயர் தன்மை இன்னும் உணரத்தக்கது. ‘மெசியா’ அதன் பொருளை வெளிப்படையாகப் பாதுகாக்கிறது; பரவலான மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வாழ்த்துரை நடை. ‘உண்டாவதாக’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத வினையைத் தமிழின் ஆசிவாழ்த்து அமைப்புக்குத் தேவையான அளவில் மட்டும் நிறைவு செய்கிறது. ‘நம்’ என்பது ἡμῶν என்பதன் உள்ளடக்கிய இயல்பைச் சுருக்கமாகத் தருகிறது.
