source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: ta
  text: ஏனெனில், மெசியா[a] என்னைத் திருமுழுக்கு அளிக்க அனுப்பவில்லை; நற்செய்தியை அறிவிக்கவே அனுப்பினார்—பேச்சின் ஞானத்தோடு[b] அல்ல; மெசியாவின் சிலுவை வெறுமையாக்கப்படாமல் இருக்கும்படி[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் Χριστός (கிறிஸ்தோஸ்); பாரம்பரியமாக, ‘கிறிஸ்து.’ இதன் பொருள் ‘அபிஷேகம் பெற்றவர்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சொல்வன்மையுள்ள ஞானத்தோடு’; இன்னும் சொல்லுக்குச் சொல்லாக, ‘சொல்லின் ஞானத்தில்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பயனற்றதாக்கப்படாமல் இருக்கும்படி’ அல்லது ‘அதன் வல்லமையை இழக்காதபடி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: மெசியா / மெசியாவின்
  rationale: Χριστός என்பதை வெறும் பெயராக அல்லாமல், ‘அபிஷேகம் பெற்றவர்’ என்ற பொருளுடைய பட்டமாக வெளிப்படுத்துகிறது; இரு இடங்களிலும் ஒரே வடிவம் வைக்கப்பட்டுள்ளது.
- source_word: βαπτίζειν
  choice: திருமுழுக்குக் கொடுக்க
  rationale: தமிழ்க் கிறிஸ்தவ வழக்கில் இயல்பாகவும் தெளிவாகவும் உள்ள சொல்லைத் தேர்ந்தெடுத்து, சடங்கின் முறையைப் பற்றிய தேவையற்ற குறுகிய விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: εὐαγγελίζεσθαι
  choice: நற்செய்தியை அறிவிக்க
  rationale: வினைச்சொல்லின் அறிவிப்பு சார்ந்த பொருளை எளிய, நவீன தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: σοφίᾳ λόγου
  choice: பேச்சின் ஞானத்தோடு
  rationale: λόγος இங்கு பேச்சு அல்லது சொல்லாற்றலைக் குறிக்கக்கூடும் என்ற திறந்த பொருளைத் தக்கவைத்து, வெறும் ‘சொல்வன்மை’ என்று மிகையாக விளக்கவில்லை.
- source_word: κενωθῇ
  choice: வெறுமையாக்கப்படாதபடிக்கு
  rationale: κενόω என்பதன் உருவகமிக்க ‘வெறுமையாக்கு’ பொருளையும் செயப்பாட்டு வடிவத்தையும் தக்கவைக்கிறது; ‘வல்லமையற்றதாக’ என்பது விளக்கமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: σταυρὸς
  choice: சிலுவை
  rationale: பவுலின் பயன்பாட்டுக்கு ஏற்ற, நிலைபெற்ற நேரடி தமிழ் இணைச்சொல்.
theological_decisions:
- issue: Χριστός என்பதை பாரம்பரிய ஒலிபெயர்ப்பாகவா அல்லது பொருளுள்ள பட்டமாகவா வழங்குவது
  choice: மெசியா
  alternative: கிறிஸ்து; அபிஷேகம் பெற்றவர்
  rationale: இங்கு பட்டத்தன்மையை வாசகருக்குப் புலப்படுத்த ‘மெசியா’ பயன்படுத்தப்படுகிறது; பாரம்பரிய ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘சிலுவை வெறுமையாக்கப்படுதல்’ என்பதன் பொருளை உரையிலேயே விளக்குவதா
  choice: வெறுமையாக்கப்படுதல் என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: சிலுவை பயனற்றதாக அல்லது வல்லமையற்றதாக ஆக்கப்படுதல்
  rationale: மூலத்தின் திட்டமிட்ட உருவகத்தையும் அதன் இறையியல் அழுத்தத்தையும் முன்கூட்டியே ஒரே விளக்கமாகக் குறுக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையில் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் ‘அல்ல… மாறாக…’ என்ற எதிர்மறை–நேர்மறை அமைப்பு இயல்பான தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், காரணத் தொடர்பும் இறுதி நோக்கமும் தக்கவைக்கப்பட்டுள்ளன.
