id: 1CO.1.26
reference: 1 Corinthians 1:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: ta
  text: 'சகோதரர்களே,[a] உங்கள் அழைப்பைச் சிந்தித்துப் பாருங்கள்: மனித மதிப்பீட்டின்படி ஞானமுள்ளவர்கள் உங்களில் பலர் இல்லை; வலிமைமிக்கவர்கள் பலர் இல்லை; உயர்குடியில் பிறந்தவர்கள் பலர் இல்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்று பவுல் இங்கு சபையார் அனைவரையும் அழைக்கிறார்; விசுவாசமுள்ள பெண்களும் இதில் அடங்குவர்.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: கவனியுங்கள்
  rationale: இவ்வடிவம் கட்டளையாகவோ குறிப்பாகவோ புரிந்துகொள்ளப்படலாம். சூழலில் பவுல் வாசகர்கள் தங்கள் நிலையைச் சிந்தித்துப் பார்க்குமாறு தூண்டுவதால், இயல்பான தமிழில் கட்டளைத் தொனியைத் தக்கவைக்கிறது.
- source_word: κλῆσιν ὑμῶν
  choice: நீங்கள் அழைக்கப்பட்டபோது எப்படிப்பட்டவர்களாக இருந்தீர்கள்
  rationale: κλῆσις என்பது தேவனுடைய அழைப்பைக் குறிக்கிறது. தொடர்ந்து வரும் சமூக நிலைப் பட்டியல் அந்த அழைப்பு நிகழ்ந்தபோது அவர்கள் எப்படிப்பட்டவர்கள் என்பதைக் கவனிக்கச் செய்கிறது; தமிழில் 'உங்கள் அழைப்பு' என்பது தொழில் அல்லது பணி என்ற தவறான பொருளைத் தரக்கூடும் என்பதால் கருத்து தெளிவாக்கப்பட்டுள்ளது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கச் சொல்லின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் தக்கவைத்து, முழுச் சபையையும் உள்ளடக்கும் பயன்பாட்டை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: οὐ πολλοὶ σοφοὶ κατὰ σάρκα
  choice: மனித மதிப்பீட்டின்படி ஞானமுள்ளவர்கள் உங்களில் பலர் இல்லை
  rationale: κατὰ σάρκα இங்கு உடல்சதையை நேரடியாகக் குறிக்காமல் மனித உலகின் மதிப்பீட்டைக் குறிக்கிறது. 'உங்களில்' என்பது கிரேக்கத்தில் சூழலால் உணர்த்தப்படும் தொடர்பை தமிழில் தெளிவாக்குகிறது.
- source_word: δυνατοί
  choice: வலிமைமிக்கவர்கள்
  rationale: சமூக அல்லது செல்வாக்குச் சக்தியை மிகையாகக் குறிப்பாக்காமல் சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: εὐγενεῖς
  choice: உயர்குடிப் பிறந்தவர்கள்
  rationale: உயர்ந்த சமூக மரபில் பிறந்தவர்களைக் குறிக்கும் சொல்லின் குறிப்பிட்ட பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: κλῆσις என்பதன் இறையியல் குறிப்பு
  choice: தேவனுடைய அழைப்பு என்ற பொருளைச் சூழல்மூலம் வெளிப்படுத்துதல்
  alternative: உங்கள் அழைப்பைக் கவனியுங்கள்
  rationale: இது தொழில், ஊழியம் அல்லது சமூக அழைப்பு அல்ல; தேவன் விசுவாசிகளை அழைத்த நிகழ்வையும் அந்நேரத்தில் அவர்களுடைய நிலையையும் குறிக்கிறது. எனினும் 'தேவன்' என்ற சொல் மூலத்தில் வெளிப்படையாக இல்லாததால் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- issue: κατὰ σάρκα என்பதன் பொருள்
  choice: மனித மதிப்பீட்டின்படி
  alternative: மாம்சத்தின்படி
  rationale: இங்கு பவுலின் ஒழுக்கவியல் சார்ந்த 'மாம்சம்' என்ற கருத்தைத் திணிக்காமல், மனித சமூகத்தின் அளவுகோல் என்ற சூழல்சார் பொருளை வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சபை வாசிப்புக்கு ஏற்ற கண்ணியமான நடையும் சாதாரண வாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. மூன்று முறை வரும் οὐ πολλοὶ என்ற வலியுறுத்தல் 'பலர் இல்லை' எனத் திரும்பத் திரும்பக் காக்கப்பட்டுள்ளது.
