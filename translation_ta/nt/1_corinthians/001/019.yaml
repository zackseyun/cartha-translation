id: 1CO.1.19
reference: 1 Corinthians 1:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: ta
  text: 'ஏனெனில், இவ்வாறு எழுதப்பட்டிருக்கிறது: “ஞானிகளின் ஞானத்தை அழிப்பேன்; பகுத்தறிவாளர்களின் புரிதலை நிராகரிப்பேன்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒதுக்கிவிடுவேன் / செல்லாததாக்குவேன்.”
    reason: ἀθετήσω என்பதற்கு நிராகரித்தல், ஒதுக்குதல், செல்லாததாக்குதல் ஆகிய தொடர்புடைய பொருள்கள் இருக்கின்றன.
lexical_decisions:
- source_word: γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: நிறைவேற்றப்பட்டு இன்றும் நிலவும் எழுத்துச் சான்றைச் சுட்டும் நிறைவுக்காலச் செயலற்ற வடிவத்தையும், வேத மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான ஆதாரத்தை அல்லது விளக்கத்தை இந்த மேற்கோள் வழங்குகிறது என்பதைக் காட்டுகிறது.
- source_word: Ἀπολῶ
  choice: அழிப்பேன்
  rationale: ἀπόλλυμι என்பதன் நேரடியான அழித்தல் அல்லது இல்லாமலாக்குதல் என்ற வலிமையை, கிரேக்கத்தைவிட மிகைப்படுத்தாமல் தருகிறது.
- source_word: σοφίαν τῶν σοφῶν
  choice: ஞானிகளின் ஞானத்தை
  rationale: மூலத்தில் உள்ள ஒரே வேர்ச்சொல்லின் சொல்லாடலையும் இணைநிலையையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: σύνεσιν τῶν συνετῶν
  choice: விவேகிகளின் விவேகத்தை
  rationale: புரிந்துகொள்ளும் மற்றும் பகுத்தறியும் திறன் என்ற பொருளையும், மூலத்தில் உள்ள பெயர்ச்சொல்–நபர்பெயர் வேரொற்றுமையையும் பாதுகாக்கிறது.
- source_word: ἀθετήσω
  choice: ஒதுக்கித் தள்ளுவேன்
  rationale: நிராகரித்தல், செல்லாததாக்குதல், ஒதுக்குதல் ஆகிய பொருள் எல்லையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; வெறும் கவனிக்காமை என்ற மெலிந்த பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் மனித ஞானத்துக்கும் கடவுளின் செயலுக்கும் இடையிலான முரண்பாட்டை வெளிப்படுத்துதல்
  choice: “அழிப்பேன்” மற்றும் “ஒதுக்கித் தள்ளுவேன்” என்ற நேரடியான எதிர்கால வினைகளைப் பயன்படுத்துதல்
  alternative: “முறியடிப்பேன்” அல்லது “பயனற்றதாக்குவேன்” போன்ற விளக்கமளிக்கும் சொற்களைப் பயன்படுத்துதல்
  rationale: கிரேக்க உரையின் வலிமையையும் இரண்டு வினைகளுக்கிடையிலான வேறுபாட்டையும் காக்கிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேத மேற்கோளுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. “ஞானிகளின் ஞானம் / விவேகிகளின் விவேகம்” என்ற இணை அமைப்பு மூலத்தின் சொல்லிசையையும் வாத வலிமையையும் காக்கிறது.
