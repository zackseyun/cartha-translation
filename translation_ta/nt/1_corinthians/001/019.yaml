  to: 'ஏனெனில், இவ்வாறு எழுதப்பட்டிருக்கிறது: “ஞானிகளின் ஞானத்தை அழிப்பேன்; பகுத்தறிவாளர்களின் புரிதலை நிராகரிப்பேன்.[a]”'
