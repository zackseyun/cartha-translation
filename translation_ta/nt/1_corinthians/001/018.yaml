id: 1CO.1.18
reference: 1 Corinthians 1:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: ta
  text: ஏனெனில், சிலுவையைப் பற்றிய செய்தி[a] அழிந்துகொண்டிருப்பவர்களுக்கு மடமையாக இருக்கிறது; ஆனால் காப்பாற்றப்படுகிற நமக்கோ[b] அது கடவுளின் வல்லமையாக இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிலுவையின் வார்த்தை.”
    reason: lexical_alternative
  - marker: b
    text: “காப்பாற்றப்படுகிற நமக்கு” என்ற கிரேக்கச் சொல்லாக்கம், இரட்சிப்பை இங்கு தொடரும் யதார்த்தமாக முன்வைக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: செய்தி
  rationale: இங்கு தனிப்பட்ட ஒரு சொல்லை அல்ல, சிலுவையைப் பற்றிப் பறைசாற்றப்படும் உள்ளடக்கத்தைக் குறிக்கிறது. எனவே நவீன தமிழில் இயல்பான “செய்தி” பயன்படுத்தப்பட்டது; “வார்த்தை” என்ற நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: σταυροῦ
  choice: சிலுவையைப் பற்றிய
  rationale: “சிலுவை” என்ற மூல உருவகத்தை அப்படியே காத்து, அந்தச் சிலுவையைப் பற்றிய அறிவிப்பே கருத்து என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: ἀπολλυμένοις
  choice: அழிந்துகொண்டிருப்பவர்களுக்கு
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் நிலையைப் பாதுகாக்கிறது. “அழிந்தவர்கள்” என்று முடிவுற்ற நிலையாகவோ, “தொலைந்தவர்கள்” என்று பலவீனமாகவோ மாற்றவில்லை.
- source_word: μωρία
  choice: மடமை
  rationale: அறிவற்றதாகவும் பொருளற்றதாகவும் தோன்றும் ஒன்றைக் குறிக்கும் மூலச்சொல்லுக்கு இயல்பான, கண்ணியமான நவீனத் தமிழ் இணை.
- source_word: σῳζομένοις
  choice: காப்பாற்றப்பட்டு வருகிற
  rationale: மூலத்தின் நிகழ்காலச் செயப்பாட்டு வடிவத்தில் உள்ள தொடரும் மீட்பு யதார்த்தத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δύναμις θεοῦ
  choice: கடவுளின் வல்லமை
  rationale: மூலத்தின் வலிமையான இறையியல் எதிர்மறை ஒப்பீட்டையும் உடைமைத் தொடர்பையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: σῳζομένοις என்பதில் இரட்சிப்பின் காலநிலை
  choice: காப்பாற்றப்பட்டு வருகிற நமக்கு
  alternative: காப்பாற்றப்பட்ட நமக்கு
  rationale: நிகழ்காலப் பங்கேற்புவினை இரட்சிப்பை இங்கு தொடரும் நிகழ்நிலை யதார்த்தமாக முன்வைக்கிறது. அதை முடிவுற்ற கடந்தகால நிகழ்வாக மட்டும் சுருக்காமல் பவுலின் இறையியல் இழுவிசை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “காப்பாற்றப்பட்டு வருகிற” என்பது செயப்பாட்டு நிலையையும் தொடர்ச்சியையும் காக்கிறது; “இரட்சிக்கப்படுகிற” என்ற சமயவழக்குச் சொல்லைவிட பொதுத் தமிழுக்கு அணுக்கமானது.
