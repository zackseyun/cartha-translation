  to: ஏனெனில், சிலுவையைப் பற்றிய செய்தி[a] அழிந்துகொண்டிருப்பவர்களுக்கு மடமையாக இருக்கிறது; ஆனால் காப்பாற்றப்படுகிற நமக்கோ[b] அது கடவுளின் வல்லமையாக இருக்கிறது.
