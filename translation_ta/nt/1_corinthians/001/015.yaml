- from: ஒருவரும், நீங்கள் என் பெயருக்குள் திருமுழுக்குப் பெற்றீர்கள் என்று சொல்லாதபடிக்கு[a].
  to: நீங்கள் என் பெயருக்குள்[a] திருமுழுக்குப் பெற்றீர்கள் என்று யாரும் சொல்லாதபடிக்கு.
  rationale: This revision retains the Greek εἰς in the main text as பெயருக்குள், without reducing it to the idiomatic but less textually explicit பெயரில். It improves modern Tamil flow by using யாரும் in its natural position and moves the note marker to the phrase to which the lexical alternative applies. No doctrinal interpretation has been added.
