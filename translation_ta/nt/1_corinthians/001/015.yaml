  yaml_path: translation/nt/1_corinthians/001/015.yaml
  text: so that no one may say that you were baptized into my name[a].
translation:
  language: ta
  text: நீங்கள் என் பெயருக்குள்[a] திருமுழுக்குப் பெற்றீர்கள் என்று யாரும் சொல்லாதபடிக்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பெயரில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: என்று சொல்லாதபடிக்கு
  rationale: ἵνα இங்கு நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவை அறிமுகப்படுத்துகிறது; எதிர்மறை μή உடன் சேர்ந்து வரும் அமைப்பைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: μή τις
  choice: ஒருவரும் ... சொல்லாதபடிக்கு
  rationale: எதிர்மறை வரையறையற்ற எழுவாயைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: εἴπῃ
  choice: சொல்ல
  rationale: ἵνα-வுக்குப் பின் வரும் இறந்தகாலத் தோற்றமுடைய subjunctive வடிவத்தின் எதிர்நோக்கிய செயலைத் தமிழ் வினையெச்ச அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς
  choice: பெயருக்குள்
  rationale: εἰς என்பதன் அடிப்படை ‘உள்ளே/நோக்கி’ என்ற இயக்கத்தையும், திருமுழுக்கின் மூலம் ஒருவரோடு அடையாளப்படுத்தப்படுதல் என்ற உறவுசார் நுணுக்கத்தையும் பாதுகாக்கிறது.
- source_word: τὸ ἐμὸν ὄνομα
  choice: என் பெயர்
  rationale: உடைமை அமைப்பை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἐβαπτίσθητε
  choice: நீங்கள் ... திருமுழுக்குப் பெற்றீர்கள்
  rationale: செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. ‘திருமுழுக்கு’ என்பது இச்சூழலில் வழக்கமான, கண்ணியமான வேதாகமச் சொல்; ஒரு குறிப்பிட்ட நடைமுறையை விளக்கமாகச் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: திருமுழுக்குச் சூழலில் εἰς τὸ ἐμὸν ὄνομα என்பதன் மொழிபெயர்ப்பு
  choice: என் பெயருக்குள்
  alternative: என் பெயரில்
  rationale: εἰς என்பதன் நேரடியான ‘உள்ளே’ என்ற உறவுசார் வலிமையை முதன்மை உரை பாதுகாக்கிறது. ‘என் பெயரில்’ என்பது இயல்பானதும் சாத்தியமானதும் ஆகையால் அடிக்குறிப்பில் வைக்கப்படுகிறது; இதனால் இறையியல் நுணுக்கம் ஒரே விளக்கமாகத் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை. இது முந்தைய வசனத்துடன் இலக்கண ரீதியாகத் தொடரும் நோக்கக் கூறு என்பதால் வசனம் துணை வாக்கியமாகவே வைக்கப்பட்டுள்ளது.
