source:
  edition: SBLGNT
  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: ta
  text: கடவுளின் சித்தத்தினால் மெசியாவாகிய இயேசுவின்[a] அப்போஸ்தலனாக அழைக்கப்பட்ட பவுலும், நம் சகோதரன் சொஸ்தேனேயும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து இயேசுவின்.”
    reason: Χριστός என்பதற்கு ‘மெசியா’ என்ற பொருள் மொழிபெயர்ப்போ, தமிழ்க் கிறிஸ்தவ வழக்கில் நிலைபெற்ற ‘கிறிஸ்து’ என்ற வடிவமோ இச்சூழலில் பயன்படுத்தப்படலாம்.
lexical_decisions:
- source_word: Παῦλος
  choice: பவுல்
  rationale: தமிழில் பரவலாக நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: κλητὸς ἀπόστολος
  choice: அப்போஸ்தலனாக அழைக்கப்பட்ட
  rationale: κλητός என்பதன் ‘அழைக்கப்பட்ட’ என்ற பொருளையும், ἀπόστολος குறிக்கும் அதிகாரப்பூர்வ ஊழிய நிலையையும் இயல்பான தமிழில் இணைக்கிறது; ‘இருக்கும்படி’ போன்ற மூலத்தில் இல்லாத சொற்கள் சேர்க்கப்படவில்லை.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவின்
  rationale: Χριστός இங்கு இயேசுவின் மெசியா பதவியைக் குறிக்கும் பட்டமாக இருப்பதை ‘மெசியாவாகிய’ தெளிவாகக் காட்டுகிறது; கிரேக்கச் சொல்வரிசையும் உரிமை வேற்றுமையும் காக்கப்படுகின்றன.
- source_word: διὰ θελήματος θεοῦ
  choice: கடவுளின் விருப்பத்தின்படி
  rationale: கடவுளின் சித்தமே பவுலின் அழைப்புக்கான நிர்ணய அடிப்படை என்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: Σωσθένης
  choice: சொஸ்தேனே
  rationale: கிரேக்கப் பெயரின் ஒலிக்கு நெருக்கமான, தமிழில் அறியப்பட்ட பெயர் வடிவம்.
- source_word: ὁ ἀδελφὸς
  choice: நம் சகோதரன்
  rationale: கிரேக்கத்தில் உடைமைப்பெயர் இல்லாவிட்டாலும், கடித வாழ்த்துச் சூழலில் உள்ள ὁ ἀδελφός என்பதை இயல்பான உள்ளடக்கும் தமிழில் ‘நம் சகோதரன்’ என்று வழங்குகிறது; ஆண்பால் குடும்பச் சொல்லும் காக்கப்படுகிறது.
theological_decisions:
- issue: பவுலின் வாழ்த்துரையில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு Χριστός வெறும் பெயரின் பகுதியாக அல்லாமல் இயேசுவின் அபிஷேகம் பெற்ற அரசர்/மெசியா பதவியைக் குறிக்கிறது. ஆகவே பிரதான உரையில் ‘மெசியா’ வைக்கப்பட்டு, மரபான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: κλητὸς என்பதற்கும் அப்போஸ்தலப் பணிக்கும் உள்ள தொடர்பு
  choice: அப்போஸ்தலனாக அழைக்கப்பட்ட
  alternative: அழைக்கப்பட்ட அப்போஸ்தலன்
  rationale: பவுல் பெற்ற அழைப்பு அவருடைய அப்போஸ்தலப் பணியை நோக்கியது என்பதைத் தமிழ் வாக்கிய அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது; அழைப்பு மனிதரிடமிருந்து அல்ல, கடவுளின் விருப்பத்தின்படி வந்தது என்ற பதற்றமும் தொடர்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘அப்போஸ்தலன்’ என்பது தொழில்நுட்பப் பதவிப் பொருளைக் காக்கிறது; ‘திருத்தூதர்’ போன்ற குறிப்பிட்ட திருச்சபை மரபுடன் அதிகமாக தொடர்புபடும் வடிவம் தவிர்க்கப்பட்டது. வசனம் அடுத்த வசனத்திற்குத் தொடரும் கடிதத் தொடக்கம் என்பதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
