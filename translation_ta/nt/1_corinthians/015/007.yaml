translation:
  language: ta
  text: பின்பு அவர் யாக்கோபுக்குத் தோன்றினார்[a]; அதன்பின் அப்போஸ்தலர்கள் அனைவருக்கும் தோன்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்சொல்லாக: “அவர் யாக்கோபால் காணப்பட்டார் … அப்போஸ்தலர்கள் அனைவராலும் காணப்பட்டார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: பின்பு
  rationale: உயிர்த்தெழுந்தவரின் தோற்றங்களைக் கூறும் வரிசையில் அடுத்த நிகழ்வைக் குறிக்கும் இயல்பான காலவரிசைச் சொல்.
- source_word: ὤφθη
  choice: அவர் ... தோன்றினார்
  rationale: ὁράω என்பதன் இறந்தகாலச் செயலப்பாட்டு வடிவம் இங்கு உயிர்த்தெழுந்தவரின் தோற்றத்தைக் குறிக்கும் மரபுத்தொடராகப் பயன்படுகிறது. தமிழில் ‘தோன்றினார்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; சொற்சொல்லான செயலப்பாட்டு வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἰακώβῳ
  choice: யாக்கோபுக்கு
  rationale: ὤφθη என்பதுடன் வரும் வேற்றுமை வடிவம், அவர் யாருக்குத் தோன்றினார் என்பதைக் குறிக்கிறது. Ἰάκωβος என்ற பெயர் தமிழில் வேதாகம வழக்கிற்கேற்ப ‘யாக்கோபு’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: εἶτα
  choice: அதன்பின்
  rationale: அடுத்தடுத்த நிகழ்வுகளின் வரிசையைத் தொடர்ந்து காட்டுகிறது. முதல் காலவரிசைச் சொல்லுடன் குழப்பமின்றி இயல்பான தமிழை வழங்க ‘அதன்பின்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀποστόλοις
  choice: அப்போஸ்தலர்கள்
  rationale: இச்சூழலில் பொதுவான தூதுவர்களை அல்ல, அதிகாரப்பூர்வமாக அனுப்பப்பட்ட உயிர்த்தெழுதல் சாட்சிகளைக் குறிக்கிறது; நிலைபெற்ற தொழில்நுட்பப் பொருளை ‘அப்போஸ்தலர்கள்’ காக்கிறது.
- source_word: πᾶσιν
  choice: அனைவருக்கும்
  rationale: அப்போஸ்தலர்கள் எனப்படும் குழுவின் முழுமையையும் வலியுறுத்தும் நேரடியான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: யாக்கோபுக்கும் ‘அப்போஸ்தலர்கள் அனைவருக்கும்’ உள்ள தொடர்பும், அந்தக் குழுவின் வரம்பும்
  choice: ‘அப்போஸ்தலர்கள் அனைவருக்கும்’ என்று உரையை நேரடியாக மொழிபெயர்த்து, அந்தக் குழுவில் யார் அடங்கினர் என்பதை வரையறுக்காமல் விடுதல்.
  alternative: இது குறிப்பாக பன்னிருவரைக் குறிக்கிறது என்று மொழிபெயர்த்தல்; அல்லது பன்னிருவரைவிட விரிவான, அனுப்பப்பட்ட சாட்சிகளின் குழு என்று விளக்குதல்.
  rationale: கிரேக்க உரை இக்குழுவின் துல்லியமான உறுப்பினர்களை வரையறுப்பதில்லை. யாக்கோபுக்கான தோற்றத்திற்கும் பின்னர் ‘அப்போஸ்தலர்கள் அனைவருக்கும்’ ஏற்பட்ட தோற்றத்திற்கும் பவுல் காட்டும் வேறுபாட்டைத் தீர்த்துவிடாமல் அப்படியே காக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தோன்றினார்’ தெளிவுக்காக இரண்டாவது கூறிலும் மீண்டும் சேர்க்கப்பட்டுள்ளது. மூலத்தின் செயலப்பாட்டு வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
