reference: 1 Corinthians 15:50
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: ta
  text: 'சகோதரர்களே[a], நான் இதைச் சொல்கிறேன்: சதையும் இரத்தமும்[b] கடவுளின் அரசாட்சியை மரபுரிமையாகப் பெற முடியாது; அழிவுக்குட்பட்டது அழிவற்ற நிலையை மரபுரிமையாகப் பெறாது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதர சகோதரிகளே’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் ‘சகோதரர்களே’ என்று இருந்தாலும், அது முழுச் சபையையும் உள்ளடக்கி அழைக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சதையும் இரத்தமும்’ என்பது தற்போதைய மரணத்திற்குட்பட்ட மனித வாழ்நிலையைக் குறிக்கும் மரபுத்தொடர்; உடல் உயிர்த்தெழுதலை மறுக்கும் கூற்று அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: நான் சொல்வது இதுதான்
  rationale: பவுலின் நேரடியான விளக்க நடையை இயல்பான நவீனத் தமிழில் தருகிறது. δέ-யின் இடைமாற்றத் தன்மை வாக்கிய ஓட்டத்தில் வெளிப்படுவதால் தனியே காலத்தைக் குறிக்கும் சொல்லோ வலுவான எதிர்மறை இணைப்போ சேர்க்கப்படவில்லை.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை அழைப்பைத் தக்கவைக்கிறது; சூழலில் முழுச் சபையையும் உள்ளடக்கக்கூடிய பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: σὰρξ καὶ αἷμα
  choice: சதையும் இரத்தமும்
  rationale: மூல உருவகத்தின் சொற்களையும் அதன் மனித மரணநிலையைக் குறிக்கும் மரபுத்தொடரையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: βασιλείαν θεοῦ
  choice: கடவுளின் அரசு
  rationale: இறையாட்சியைக் குறிக்கும் மூலத் தொடரை தெளிவான, நவீனத் தமிழில் தருகிறது.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: உரிமையாகப் பெற
  rationale: κληρονομέω என்பதிலுள்ள சுதந்தரமாக அல்லது உரிமையாகப் பெறும் கருத்தைத் தக்கவைத்து, இரு இடங்களிலும் இணையான சொல்லாட்சியைப் பயன்படுத்துகிறது.
- source_word: ἡ φθορά
  choice: அழிவுக்குட்பட்டது
  rationale: உயிர்த்தெழுதல் சூழலில் சிதைவும் அழிவும் அடையும் தற்போதைய நிலையைக் குறிக்கிறது; வெறும் ஒழுக்கக்கேடு என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: τὴν ἀφθαρσίαν
  choice: அழியாமை
  rationale: φθορά என்பதற்கு எதிரான, சிதைவு அல்லது அழிவுக்கு உட்படாத நிலையைத் துல்லியமாகக் காட்டுகிறது; இதை ἀθανασία என்பதற்குரிய ‘மரணமின்மை’ என்று கலக்கவில்லை.
theological_decisions:
- issue: ‘சதையும் இரத்தமும்’ என்பதற்கும் உடல் உயிர்த்தெழுதலுக்கும் உள்ள தொடர்பு
  choice: தற்போதைய மரணத்திற்கும் அழிவிற்கும் உட்பட்ட மனித வாழ்நிலையைக் குறிக்கும் மரபுத்தொடர்
  alternative: பௌதிக உடலே கடவுளின் அரசுக்குள் செல்ல முடியாது என்ற வாசிப்பு
  rationale: உடலைக் கைவிடுவதை அல்ல, அழிவுக்குட்பட்ட உடல் அழியாததாக மாற்றப்படுவதை உடனடி சூழல் விளக்குகிறது. ஆகவே மொழிபெயர்ப்பு மூல மரபுத்தொடரைப் பாதுகாக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀδελφοί என்ற அழைப்பின் பாலினமும் பரப்பும்
  choice: முதன்மை உரையில் ‘சகோதரர்களே’; முழுச் சபையையும் உள்ளடக்கக்கூடிய பயன்பாட்டை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘சகோதர சகோதரிகளே’ என்று முதன்மை உரையிலேயே விரிவாக்குதல்
  rationale: கிரேக்க ஆண்பால் வடிவத்தை மறைக்காமல் தக்கவைக்கிறது; அதேவேளை பவுலின் அழைப்பு கலப்புப் பாலினச் சபையைக் குறிக்கக்கூடும் என்பதை வாசகருக்குத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பழைய சமய வழக்குச் சொற்களான ‘மாம்சம்’, ‘ராஜ்யம்’ என்பவற்றுக்கு பதில் சூழலுக்கேற்ற ‘சதை’, ‘அரசு’ பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் இணையான எதிர்மறைக் கட்டமைப்பும் ‘அழிவுக்குட்பட்டது—அழியாமை’ என்ற கருத்து மோதலும் பாதுகாக்கப்பட்டுள்ளன.
