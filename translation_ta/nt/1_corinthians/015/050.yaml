  source_fidelity: மூலத்தின் இரட்டை மறுப்பும், ‘சதையும் இரத்தமும்’ என்ற மரபுத்தொடரும், அழிவுக்குட்பட்டதற்கும் அழிவின்மைக்கும் உள்ள எதிர்நிலையும் சரியாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘கடவுளின் அரசு’ என்பது βασιλείαν θεοῦ என்பதற்கு நவீனத் தமிழில் அரசாங்கம் என்ற குறுகிய பொருளைத் தரக்கூடும். ‘கடவுளின் அரசாட்சி’ மூலத்தின் பரந்த அரசுரிமை/ஆட்சி-வட்டப் பொருளைச் சிறப்பாகத் தருகிறது. κληρονομέω-வின் மரபுரிமைக் கூறும் வெளிப்படையாக இருக்க வேண்டும்.
  naturalness: ‘சகோதரர்களே, நான் இதைச் சொல்கிறேன்’ என்பது மூலத்தின் அழைப்பையும் விளக்கத் தொடக்கத்தையும் தமிழில் இயல்பாக இணைக்கிறது. ‘மரபுரிமையாகப் பெற’ என்பது இவ்வசனத்தில் ‘உரிமையாகப் பெற’ என்பதைவிடத் துல்லியமானது; ‘அழிவற்ற நிலை’ என்பது ἀφθαρσία என்ற பெயர்ச்சொல்லின் கருத்தைத் தெளிவாகத் தருகிறது.
