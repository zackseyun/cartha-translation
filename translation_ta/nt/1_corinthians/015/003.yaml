source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: ta
  text: 'ஏனெனில், நான் பெற்றுக்கொண்டதையே மிகவும் முக்கியமானதாக உங்களிடம் ஒப்படைத்தேன்: வேதவசனங்களின்படி[b] மெசியா[a] நம் பாவங்களுக்காக இறந்தார்,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்து.’ Χριστός என்ற கிரேக்கப் பட்டப்பெயர் இங்கு ‘மெசியா’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘வேதவசனங்களுக்கு ஏற்ப.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: ஒப்படைத்தேன்
  rationale: பெற்றுக்கொண்ட போதனையை அதிகாரபூர்வமாக மற்றவர்களிடம் கொண்டு சேர்ப்பதைக் குறிக்கும் παραδίδωμι என்பதன் மரபுப் பரிமாற்ற உணர்வைப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் γάρ என்பதன் இணைப்புப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν πρώτοις
  choice: முதன்மையானதாக
  rationale: காலவரிசையில் முதலில் என்பதைக் காட்டிலும், அப்போஸ்தலச் செய்தியில் இதற்கு உள்ள முதன்மையான முக்கியத்துவத்தை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὃ καὶ παρέλαβον
  choice: நானும் பெற்றுக்கொண்டதையே
  rationale: பவுல் தாம் பெற்றுக்கொண்ட செய்தியையே பிறரிடம் ஒப்படைத்தார் என்ற இணையான அமைப்பையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: Χριστὸς
  choice: மெசியா
  rationale: இந்த அறிக்கைத் தொகுப்பில் Χριστός பட்டப்பெயரின் வலிமையுடன் வருவதால், அதன் யூத மெசியானியப் பொருளை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: ἀπέθανεν
  choice: இறந்தார்
  rationale: இறந்த நிகழ்வைச் சுட்டும் இறந்தகால வினையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: நம் பாவங்களுக்காக
  rationale: ὑπέρ என்பதன் ‘நிமித்தமாக/சார்பாக’ என்ற பரந்த மீட்பியல் பொருளைத் தக்கவைத்து, குறிப்பிட்ட பாவநிவாரணக் கோட்பாட்டை உரையில் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: κατὰ τὰς γραφάς
  choice: வேதவசனங்களின்படி
  rationale: வேதவசனங்களோடு ஒத்துப்போதல் அல்லது அவற்றில் கூறப்பட்டபடி நிகழ்தல் என்ற κατάவின் பொருளையும் γραφάς என்பதன் பன்மையையும் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இது அறிக்கை வடிவில் பட்டப்பெயராகத் தெளிவாகச் செயல்படுகிறது; ஆகவே ‘மெசியா’ அதன் அபிஷேகம் பெற்ற அரசர் என்ற பின்னணியைப் பாதுகாக்கிறது. தமிழில் வழக்கமான ‘கிறிஸ்து’ என்பதும் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν என்பதன் இறையியல் வீச்சு
  choice: நம் பாவங்களுக்காக
  alternative: நம் பாவங்களின் நிமித்தமாக
  rationale: கிரேக்கச் சொற்றொடரின் மீட்பியல் கூற்றை உறுதியாகத் தருகிறது; ஆனால் அது தனியே வரையறுக்காத ஒரு குறிப்பிட்ட பாவநிவாரண விளக்கத்தைத் திணிக்கவில்லை.
- issue: ἐν πρώτοις என்பதன் முக்கியத்துவம் அல்லது காலவரிசை
  choice: முதன்மையானதாக
  alternative: முதலில்
  rationale: இச்சூழலில் செய்தியின் அடிப்படை முக்கியத்துவமே முதன்மையாகத் தெரிகிறது; இருப்பினும் கிரேக்கத் தொடருக்கு காலவரிசை நிழலும் இருக்கக்கூடும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒப்படைத்தேன்—பெற்றுக்கொண்டேன்’ என்ற இணைச்சொல் அமைப்பு மரபுப் பரிமாற்றக் கருத்தைப் பாதுகாக்கிறது. மூலவாக்கியம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
