id: 1CO.15.42
reference: 1 Corinthians 15:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: ta
  text: 'இறந்தோரின் உயிர்த்தெழுதலும் இப்படியே: அழிவுக்குரிய நிலையில் விதைக்கப்படுகிறது[a]; அழிவற்ற நிலையில் எழுப்பப்படுகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழியக்கூடியதாக விதைக்கப்படுகிறது; அழியாததாக எழுப்பப்படுகிறது.”
    reason: φθορά / ἀφθαρσία என்ற சொற்களுக்கு “அழிவுக்குரிய நிலை / அழிவற்ற நிலை” என்பதற்குப் பதிலாக “அழியக்கூடியது / அழியாதது” என்ற சொற்பொருள் மாற்றும் சாத்தியமாகும்.
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: உயிர்த்தெழுதலும் இப்படியே
  rationale: முந்தைய விதை உவமையிலிருந்து வரும் ஒப்பீட்டையும் முடிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: இறந்தோரின் உயிர்த்தெழுதல்
  rationale: கிரேக்க உரையின் உருபுச் சார்பைத் துல்லியமாகப் பேணி, இறந்தோரின் உடல் சார்ந்த உயிர்த்தெழுதலைக் குறிக்கிறது.
- source_word: σπείρεται
  choice: விதைக்கப்படுகிறது
  rationale: விதை உவமையையும் கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும் அடுத்துள்ள ‘எழுப்பப்படுகிறது’ என்பதுடனான இணை அமைப்பையும் பேணுகிறது.
- source_word: ἐν φθορᾷ
  choice: அழிவுக்குரிய நிலையில்
  rationale: φθορά இங்கு தற்போதைய உடலின் அழியக்கூடிய தன்மையைக் குறிக்கிறது; ‘அழிவில்’ என்பதைவிட இது நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: ἐγείρεται
  choice: எழுப்பப்படுகிறது
  rationale: உயிர்த்தெழுதல் சூழலில் உள்ள செயப்பாட்டு வடிவத்தைப் பேணுகிறது; தானாக எழுகிறது என்று பொருளை மாற்றுவதில்லை.
- source_word: ἐν ἀφθαρσίᾳ
  choice: அழிவில்லாத நிலையில்
  rationale: φθορά என்பதற்கு நேர்மாறான ἀφθαρσίαவை இயல்பான தமிழில் வெளிப்படுத்தி, இரு நிலைகளுக்கிடையிலான எதிர்மறை இணைப்பைப் பேணுகிறது.
theological_decisions:
- issue: பவுலின் எதிர்மறை இணைப்பில் உயிர்த்தெழும் உடலின் இயல்பு
  choice: ‘விதைக்கப்படுகிறது ... எழுப்பப்படுகிறது’ என்ற உடல் சார்ந்த விதை உவமையையும் செயப்பாட்டு வினைகளையும் தக்கவைத்தல்
  alternative: ‘உடல் அடக்கம் செய்யப்படுகிறது ... அழிவற்றதாக உயிர்த்தெழுகிறது’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: சூழலில் பவுல் விதை உவமையின் மூலம் இறந்தோரின் உடல் உயிர்த்தெழுதலை வலியுறுத்துகிறார். உடலின் தொடர்ச்சியையும் மாற்றத்தையும் உரை விளக்கிச் சுருக்காமல், உவமை தானே வெளிப்படுத்த அனுமதிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. பாரம்பரியமான ஆனால் இன்றைய வாசகருக்கு மங்கலாக இருக்கக்கூடிய ‘கேடு/அகேடு’ போன்ற சொற்கள் தவிர்க்கப்பட்டன; கிரேக்கத்தின் இணை அமைப்பும் விதை உவமையும் காக்கப்பட்டன.
