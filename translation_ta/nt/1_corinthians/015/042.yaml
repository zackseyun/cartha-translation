  to: 'இறந்தோரின் உயிர்த்தெழுதலும் இப்படியே: அழிவுக்குரிய நிலையில் விதைக்கப்படுகிறது[a]; அழிவற்ற நிலையில் எழுப்பப்படுகிறது.'
