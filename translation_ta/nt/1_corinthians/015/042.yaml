review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the comparative transition, the genitive phrase “resurrection of the dead,” the paired passive verbs, and the agricultural metaphor. “விதைக்கப்படுகிறது ... எழுப்பப்படுகிறது” correctly reflects σπείρεται ... ἐγείρεται without adding an explicit subject or replacing the metaphor with burial language.
  naturalness: 'The sentence is clear and natural in modern standard Tamil. A small lexical refinement improves the elevated but accessible contrast: “அழிவற்ற நிலையில்” is more idiomatic and more directly denotes imperishability/incorruptibility than “அழிவில்லாத நிலையில்.”'
  terminology: “உயிர்த்தெழுதல்” and the passive “எழுப்பப்படுகிறது” are appropriate resurrection terminology. The paired expressions “அழிவுக்குரிய நிலையில் / அழிவற்ற நிலையில்” retain the Greek antithesis φθορά / ἀφθαρσία without importing moral connotations of “corruption.”
  issues:
  - severity: low
    issue: “அழிவில்லாத நிலையில்” is slightly less idiomatic and can sound like a merely temporary absence of destruction.
    rationale: ἀφθαρσία denotes an enduring quality of imperishability/incorruptibility. “அழிவற்ற நிலையில்” more naturally and precisely conveys this quality while preserving the contrast with “அழிவுக்குரிய நிலையில்.”
