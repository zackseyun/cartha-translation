source:
  edition: SBLGNT
  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: ta
  text: அதன்பின் அவர் ஒரே நேரத்தில் ஐந்நூற்றுக்கும் மேற்பட்ட சகோதரர்களுக்குத் தோன்றினார்[a]. அவர்களில் பெரும்பாலோர் இன்றுவரை உயிரோடு இருக்கிறார்கள்; சிலரோ நித்திரையடைந்துவிட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளுக்குத்.” கிரேக்க மூலத்தில் “சகோதரர்களுக்கு” என்று உள்ளது; தொடக்கக் கிறிஸ்தவப் பயன்பாட்டில் இச்சொல் சில நேரங்களில் விசுவாசிகளின் பரந்த சமூகத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவர்கள் இறந்துவிட்டார்கள். உயிர்த்தெழுதல் பற்றிய நம்பிக்கையின் வெளிச்சத்தில், மரணத்தைப் பவுல் ‘உறக்கம்’ என்று குறிப்பிடுகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: அதன்பின்
  rationale: உயிர்த்தெழுந்த கிறிஸ்து தோன்றிய நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: ὤφθη
  choice: அவர் ... தோன்றினார்
  rationale: உயிர்த்தெழுதலுக்குப் பிந்தைய காட்சியளித்தலைக் குறிக்கும் இச்சூழலில், செயலற்ற வடிவத்தின் நிகழ்வுப்பொருளை இயல்பான தமிழில் தருகிறது; முந்தைய சூழலிலிருந்து எழுவாய் கிறிஸ்து என்பது தெளிவு.
- source_word: ἐπάνω πεντακοσίοις
  choice: ஐந்நூற்றுக்கும் மேற்பட்ட
  rationale: எண்ணுடன் வரும் ἐπάνω என்பதன் ‘அதற்கும் மேல்’ என்ற பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: ἀδελφοῖς
  choice: சகோதரர்களுக்கு
  rationale: கிரேக்க மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் தக்கவைக்கிறது; இது பரந்த விசுவாசிகள் சமூகத்தையும் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐφάπαξ
  choice: ஒரே நேரத்தில்
  rationale: ஐந்நூற்றுக்கும் மேற்பட்டோருக்கு ஒரே சந்தர்ப்பத்தில் நிகழ்ந்த தோற்றத்தை, வெறும் ‘ஒருமுறை’ என்பதிலிருந்து வேறுபடுத்தித் தெளிவுபடுத்துகிறது.
- source_word: ἐξ ὧν οἱ πλείονες
  choice: அவர்களில் பெரும்பாலோர்
  rationale: பகுதிப்பொருளையும் பெரும்பான்மையையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: μένουσιν ἕως ἄρτι
  choice: இன்றுவரை உயிரோடு இருக்கிறார்கள்
  rationale: μένω என்பதன் தொடர்ந்திருத்தல் என்ற பொருளைச் சூழலுக்கு ஏற்ப தெளிவாக்குகிறது; இவர்கள் பவுலின் காலம் வரை உயிருடன் இருந்தனர் என்பதே கருத்து.
- source_word: τινὲς δὲ
  choice: சிலரோ
  rationale: பெரும்பாலோருக்கும் சிலருக்கும் இடையிலான மென்மையான முரண்பாட்டைத் தமிழின் ‘-ஓ’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκοιμήθησαν
  choice: மரண உறக்கமடைந்துவிட்டார்கள்
  rationale: மரணத்தைக் ‘உறக்கம்’ எனக் கூறும் உருவகத்தைத் தக்கவைத்தபடி, நவீன தமிழ் வாசகருக்கு அதன் பொருளை உடனடியாகத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ἀδελφοῖς என்பது ஆண்களை மட்டும் குறிக்கிறதா அல்லது கலப்பின விசுவாசிகள் குழுவையும் உள்ளடக்குகிறதா
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்
  rationale: மூலத்தின் ஆண்பால் பன்மையை உரையில் தக்கவைக்கிறது; தொடக்கக் கிறிஸ்தவப் பயன்பாட்டில் இது பரந்த விசுவாசிகள் சமூகத்தைக் குறிக்கக்கூடிய உண்மையான வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: உயிர்த்தெழுதல் பற்றிய சூழலில் ἐκοιμήθησαν என்ற உறக்க உருவகம்
  choice: மரண உறக்கமடைந்துவிட்டார்கள்
  alternative: இறந்துவிட்டார்கள்
  rationale: பவுலின் உயிர்த்தெழுதல் வாதத்துடன் ஒலிக்கும் ‘உறக்கம்’ உருவகத்தை அழிக்காமல், தமிழில் அதன் மரணப் பொருளையும் தெளிவாகத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உயிரோடு இருக்கிறார்கள்’ என்பது சூழலிலுள்ள μένουσιν என்பதன் மறைபொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘மரண உறக்கம்’ என்பது மூல உருவகத்தையும் தெளிவையும் இணைக்கிறது.
