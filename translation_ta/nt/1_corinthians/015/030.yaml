  text: Why are we also in danger every hour?[a]
translation:
  language: ta
  text: நாமும் ஏன் ஒவ்வொரு மணிநேரமும் ஆபத்தில் இருக்கிறோம்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “நாமும் ஒவ்வொரு மணிநேரமும் ஆபத்தில் இருப்பதில் என்ன இருக்கிறது?” சூழலில் இதன் பொருள், “நாமும் ஏன் ஒவ்வொரு மணிநேரமும் ஆபத்தில் இருக்கிறோம்?” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: ஏன்
  rationale: இச்சொல் அடிப்படையில் ‘என்ன’ என்று பொருள்படலாம்; ஆனால் உயிர்த்தெழுதல் இல்லையென்றால் இத்தகைய ஆபத்தை ஏற்கக் காரணம் என்ன என்பதைக் கேட்கும் சொல்லாட்சிக் கேள்வியாக இங்கு வருவதால் ‘ஏன்’ என்பது வாதத்தின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: -உம் (நாமும்)
  rationale: முந்தைய எடுத்துக்காட்டுகளோடு பவுலும் அவரது உடன் ஊழியர்களும் சேர்க்கப்படுகிறார்கள் என்பதைத் தமிழில் இணைப்புப் பின்னொட்டு இயல்பாகக் காட்டுகிறது.
- source_word: ἡμεῖς
  choice: நாம்
  rationale: வெளிப்படையாக உள்ள முதலாவது நபர் பன்மைச் சுட்டுப்பெயர் தக்கவைக்கப்படுகிறது; καὶ என்பதன் சேர்க்கைப் பொருளுடன் ‘நாமும்’ என அமைக்கப்பட்டுள்ளது.
- source_word: κινδυνεύομεν
  choice: ஆபத்தில் இருக்கிறோம்
  rationale: உயிரையே பணயம் வைப்பதாகக் கூடுதல் விளக்கம் சேர்க்காமல், ஆபத்துக்கு உட்பட்டிருப்பதைக் கிரேக்கத்திற்கு நெருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: πᾶσαν ὥραν
  choice: ஒவ்வொரு மணிநேரமும்
  rationale: தொடர்ச்சியாக ஆபத்தை எதிர்கொள்வதைக் குறிக்கும் மூலமொழியின் நேரச்சொற்றொடரைத் தமிழில் நெருக்கமாகப் பாதுகாக்கிறது; ‘எப்போதும்’ என்பதைவிட வடிவத்திலும் பொருளிலும் துல்லியமானது.
theological_decisions:
- issue: உயிர்த்தெழுதல் குறித்த பவுலின் வாதத்தில் உள்ள சொல்லாட்சிக் கேள்வியின் வலிமை
  choice: இறந்தோர் உயிர்த்தெழுவதில்லை என்றால் அப்போஸ்தலர்கள் தொடர்ந்து ஆபத்தை எதிர்கொள்வது ஏன் எனக் கேட்கும் சொல்லாட்சிக் கேள்வியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒவ்வொரு மணிநேரமும் நாம் ஆபத்தில் இருப்பது என்ன?’ என்று τί என்பதைக் ‘என்ன’ என நேரடியாக அமைத்தல்.
  rationale: கிரேக்க இலக்கணமும் உடனடிச் சூழலும் தகவல் கோரும் கேள்வியைவிட, உயிர்த்தெழுதல் இல்லையெனில் இத்தகைய ஆபத்தின் பொருள் அல்லது காரணம் என்ன என்பதை வலியுறுத்தும் வாதக் கேள்வியை ஆதரிக்கின்றன. கூடுதல் கோட்பாட்டு முடிவைச் சேர்க்காமல் அதன் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஒவ்வொரு மணிநேரமும்’ என்பது மூலத்தின் πᾶσαν ὥραν என்ற வலியுறுத்தலைத் தக்கவைக்கிறது; ‘ஆபத்தில் இருக்கிறோம்’ என்பது மிகை விளக்கமின்றி κινδυνεύομεν என்பதைக் காட்டுகிறது.
