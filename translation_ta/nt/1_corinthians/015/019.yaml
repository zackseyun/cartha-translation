id: 1CO.15.19
reference: 1 Corinthians 15:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: ta
  text: இந்த வாழ்க்கையில் மட்டுமே நாம் மெசியாவில் நம்பிக்கை வைத்திருக்கிறோம் என்றால், எல்லா மனிதர்களையும்விட நாம் அதிகம் இரங்கத்தக்கவர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: என்றால்
  rationale: நிபந்தனையை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: இந்த வாழ்க்கைக்காக
  rationale: நம்பிக்கை தற்போதைய வாழ்க்கையோடு மட்டுப்படுத்தப்படுவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்கத்தின் சொற்சார்ந்த ‘இந்த வாழ்க்கையில்’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν Χριστῷ
  choice: மெசியாவில்
  rationale: Χριστός இங்கு பட்டப்பெயராக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது; பவுலின் முக்கியமான ἐν Χριστῷ அமைப்பைப் பாதுகாக்க ‘-வில்’ நிலைவேற்றுமை தக்கவைக்கப்படுகிறது.
- source_word: ἠλπικότες ἐσμὲν
  choice: நம்பிக்கை வைத்திருக்கிறோம்
  rationale: சுற்றுவழிப் பூர்த்திநிலைக் கட்டமைப்பு, கடந்தகாலத்தில் தொடங்கி தற்போதும் நிலைக்கும் நம்பிக்கையைச் சுட்டுவதால் இத்தமிழ் வினைத்தொடர் பொருத்தமானது.
- source_word: μόνον
  choice: மட்டுமே
  rationale: நம்பிக்கையின் வரம்பு இந்த வாழ்க்கை மட்டுமே என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: ἐλεεινότεροι
  choice: அதிகம் இரங்கத்தக்கவர்கள்
  rationale: இரக்கத்திற்குரியவர் என்ற பொருளையும் கிரேக்க ஒப்பீட்டுப் படிநிலையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: πάντων ἀνθρώπων
  choice: எல்லா மனிதர்களையும்விட
  rationale: பாலின வரம்பின்றி மனிதர்கள் அனைவரையும் குறிக்கும் பொதுப்பொருளையும் ஒப்பீட்டு அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: பவுலின் ἐν Χριστῷ தொடரில் Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவில்
  alternative: கிறிஸ்துவில்
  rationale: Χριστός என்பதன் பட்டப்பெயர்ப் பொருளை ‘மெசியா’ வெளிப்படுத்துகிறது; அதேவேளை ‘-வில்’ என்பதைத் தக்கவைத்து பவுலின் இறையியல் முக்கியத்துவமுள்ள தொடரை விரிவுரை செய்யாமல் பாதுகாக்கிறது.
- issue: கிறிஸ்தவ நம்பிக்கையைப் பற்றிய நிபந்தனை வாக்கியத்தின் வரம்பு
  choice: நம்பிக்கை இந்த வாழ்க்கைக்காக மட்டுமே இருந்தால் என்பதாக மொழிபெயர்த்தல்
  alternative: இந்த வாழ்க்கையில் மட்டுமே நாம் மெசியாவில் நம்பிக்கை வைத்திருந்தால்
  rationale: உயிர்த்தெழுதல் குறித்த சுற்றுப்பகுதியின் வாதத்தைப் பாதுகாக்கிறது; இருப்பினும் மறுமை குறித்து வசனம் வெளிப்படையாகச் சொல்லாத கூடுதல் கோட்பாட்டை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மெசியாவில்’ என்ற சுருக்கமான பவுலியத் தொடர் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது; ‘இரங்கத்தக்கவர்கள்’ என்பது அவமதிப்பை அல்ல, இரக்கத்திற்குரிய நிலையைக் குறிக்கிறது.
