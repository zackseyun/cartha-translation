  text: εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: ta
  text: ஆனால், இறந்தோரின் உயிர்த்தெழுதல் இல்லையென்றால், மேசியாவும்கூட[a] உயிர்த்தெழுப்பப்பட்டிருக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவும்கூட.” Χριστός என்ற கிரேக்கப் பட்டத்தை “கிறிஸ்து” என்றும் “மேசியா” என்றும் மொழிபெயர்க்கலாம்; இங்கு பட்டத்தின் பொருளை வெளிப்படுத்த “மேசியா” பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உயிர்த்தெழுந்திருக்கவில்லை.” கிரேக்க வினைச்சொல் செயலப்பாட்டு வடிவில் உள்ளது (“உயிர்த்தெழுப்பப்பட்டிருக்கவில்லை”); செயலைச் செய்தவர் யார் என்று வெளிப்படையாகக் கூறாமலேயே இது தேவனுடைய செயலைச் சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ஆனால், … இல்லையென்றால்
  rationale: εἰ நிபந்தனையையும் δέ முந்தைய கருத்திலிருந்து வரும் மென்மையான எதிர்மறைத் திருப்பத்தையும் குறிக்கின்றன; இச்சொற்றொடர் அவற்றை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀνάστασις νεκρῶν
  choice: இறந்தோரின் உயிர்த்தெழுதல்
  rationale: ἀνάστασις என்பதன் ‘உயிர்த்தெழுதல்’ என்ற பொருளையும், νεκρῶν என்பது இறந்தவர்களை ஒரு வகுப்பாகக் குறிக்கும் பன்மை உருபையும் காக்கிறது.
- source_word: οὐκ ἔστιν
  choice: இல்லையென்றால்
  rationale: உயிர்த்தெழுதல் என்ற ஒன்று இல்லை எனக் கருதும் நிபந்தனையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οὐδὲ
  choice: …வும் … இல்லை
  rationale: முந்தைய நிபந்தனையிலிருந்து வரும் ‘அப்படியானால் அவரும்கூட இல்லை’ என்ற வலியுறுத்தப்பட்ட முடிவைத் தமிழின் இணைப்பும்மை அமைப்பில் காட்டுகிறது.
- source_word: Χριστὸς
  choice: மேசியா
  rationale: Χριστός இங்கு அபிஷேகம் செய்யப்பட்டவர் என்னும் பட்டமாகச் செயல்படுவதால், அதன் பொருளைத் தக்கவைக்கும் ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐγήγερται
  choice: உயிர்த்தெழுப்பப்பட்டிருக்கவில்லை
  rationale: 'ἐγείρω வினையின் நிறைவுக்காலச் செயலப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது: நிகழ்ந்த செயலும் அதன் தொடரும் விளைவும் வெளிப்படுகின்றன; செயலைச் செய்தவர் மூலத்தில் கூறப்படாததால் தமிழிலும் சேர்க்கப்படவில்லை.'
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அது பெயரைப் போன்ற வடிவத்தைவிட அபிஷேகம் செய்யப்பட்டவர் என்னும் பட்டத்தின் வலிமையைக் கொண்டுள்ளது; ‘மேசியா’ அந்தப் பட்டப் பொருளை வெளிப்படுத்துகிறது. பரவலான ‘கிறிஸ்து’ வாசிப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐγήγερται என்பதன் செயலப்பாட்டு வடிவம்
  choice: உயிர்த்தெழுப்பப்பட்டிருக்கவில்லை
  alternative: உயிர்த்தெழுந்திருக்கவில்லை
  rationale: கிரேக்கச் செயலப்பாட்டு வடிவத்தைப் பாதுகாத்து, மேசியாவுக்கு நிகழ்த்தப்பட்ட செயலாக உயிர்த்தெழுதலை முன்வைக்கிறது; அதைச் செய்தவர் தேவன் என்று வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் மறைமுகத்தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் நிபந்தனை சார்ந்த தர்க்கமும், உயிர்த்தெழுப்பியவர் வெளிப்படையாகக் குறிப்பிடப்படாத செயலப்பாட்டு அமைப்பும் காக்கப்பட்டுள்ளன.
