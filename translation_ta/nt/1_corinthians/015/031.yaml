  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: ta
  text: நான் ஒவ்வொரு நாளும் சாகிறேன்—நம் ஆண்டவராகிய மெசியா இயேசுவில் உங்களைக் குறித்து நான் கொண்டிருக்கும் பெருமையை வைத்து ஆணையாகச் சொல்கிறேன்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “நாள்தோறும் நான் சாகிறேன்.”
    reason: lexical_alternative
  - marker: b
    text: “உங்களைக் குறித்து நான் கொண்டிருக்கும் பெருமை எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாக” அல்லது “உங்கள் பெருமையை வைத்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இது ஆணை போன்ற உறுதியுரை; ‘பெருமை’ என்ற சொல்லைச் சுற்றியுள்ள தொடரின் இலக்கண உறவு விவாதத்திற்குரியது.
    reason: alternative_reading
  - marker: c
    text: 'மரபுவழி மொழிபெயர்ப்பு: “கிறிஸ்து இயேசு.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: ஒவ்வொரு நாளும்
  rationale: ‘ஒவ்வொரு நாளும்’ அல்லது ‘நாள்தோறும்’ என்று பொருள்படும் காலவினையடைத் தொடர். மீண்டும் மீண்டும் நிகழ்வதைக் காட்டும் இயல்பான நவீனத் தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀποθνῄσκω
  choice: சாகிறேன்
  rationale: நிகழ்காலச் செயப்பாட்டு வினையின் நேரடியான, உயிரோட்டமுள்ள பொருளைத் தக்கவைக்கிறது. ‘மரணத்தை எதிர்கொள்கிறேன்’ என்பது சாத்தியமான சூழற்பொருள் என்றாலும் அதிக விளக்கமாகிவிடும்.
- source_word: νὴ
  choice: வைத்து ஆணையாகச் சொல்கிறேன்
  rationale: உறுதியுரை அல்லது ஆணைச் சூத்திரத்தில் வரும் இத்துகள். கிரேக்கத்தின் ‘இதன்மேல் ஆணை’ என்ற வலிமையை இயல்பான தமிழில் வெளிப்படுத்த வினைச்சொல் சேர்க்கப்பட்டது.
- source_word: τὴν ὑμετέραν καύχησιν
  choice: உங்களைக் குறித்து எனக்குள்ள பெருமையை
  rationale: καύχησις என்பது ‘பெருமை பாராட்டுதல்’ அல்லது ‘பெருமைக்கான காரணம்’ எனப் பொருள்படலாம். தொடர்ந்து வரும் ‘எனக்குள்ள’ என்ற உறவுத்தொடர், பவுலுக்கு கொரிந்தியர்களைக் குறித்து உள்ள பெருமை என்ற புரிதலை ஆதரிக்கிறது; எனினும் வேறு தொடரியல் புரிதல்கள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன.
- source_word: ἣν ἔχω
  choice: எனக்குள்ள
  rationale: ‘நான் கொண்டிருக்கிற’ என்பதற்குச் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மெசியா இயேசுவில்
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைக் கொண்டிருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டது. பவுலின் முக்கியமான ‘இல்’ மொழிநடையைத் தக்கவைக்க ‘இயேசுவில்’ என்று தரப்பட்டது.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: நம் ஆண்டவராகிய
  rationale: κύριος என்பதற்கு மரியாதையும் ஆட்சியுரிமையும் கொண்ட ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது; ἡμῶν இயல்பாக ‘நம்’ எனத் தரப்பட்டது.
theological_decisions:
- issue: Χριστῷ என்பதைப் பட்டப்பெயராக மொழிபெயர்ப்பதா, மரபுவழிப் பெயர்போன்ற வடிவில் தருவதா
  choice: மெசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இச்சொல் பவுலின் பயன்பாட்டில் பட்டப்பெயரின் பொருளைத் தக்கவைத்துள்ளதால் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது; பரவலான மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: καύχησις என்பதுடன் ὑμετέραν இணையும் விதம்
  choice: பவுலுக்கு கொரிந்தியர்களைக் குறித்து உள்ள பெருமை
  alternative: கொரிந்தியர்களுடைய பெருமை அல்லது ‘உங்களில்’ பவுலுக்கு உள்ள பெருமை
  rationale: ‘எனக்குள்ள’ என்ற உறவுத்தொடர், அது பவுல் கொண்டுள்ள பெருமை என்பதை வலுவாகச் சுட்டுகிறது. இருப்பினும் கிரேக்கத் தொடரின் உரிமை/தொடர்புப் பொருள் விவாதத்திற்குரியது என்பதால் மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
- issue: νὴ தொடங்கும் உறுதியுரையின் வடிவம்
  choice: பெருமையை வைத்து ஆணையாகச் சொல்கிறேன்
  alternative: அந்தப் பெருமை எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாக
  rationale: மூலத்தின் ஆணை போன்ற வலிமையைத் தக்கவைத்து, தமிழில் புரியும்படி வெளிப்படையான உறுதியுரை பயன்படுத்தப்பட்டது; ஒப்பீட்டு வடிவம் சாத்தியமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாய்வழியாகவும் தெளிவாகப் புரியும் நடை. பவுலின் திடமான ‘நான் சாகிறேன்’ என்ற சொல்லாட்சி மென்மைப்படுத்தப்படவில்லை. கிரேக்க ஆணைச் சூத்திரம் தமிழில் இயல்பாக இருக்கத் தேவையான அளவு மட்டும் வெளிப்படுத்தப்பட்டுள்ளது; அதன் தொடரியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
