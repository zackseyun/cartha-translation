source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: ta
  text: ஏனெனில், நான் அப்போஸ்தலர்களில் மிகத் தாழ்ந்தவன்; அப்போஸ்தலன் என்று அழைக்கப்படுவதற்குத் தகுதியற்றவன்; ஏனெனில் நான் கடவுளின் திருச்சபையைத் துன்புறுத்தினேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்போஸ்தலன் என்று அழைக்கப்படுவதற்குப் பொருத்தமற்றவன்” அல்லது “தகுதியில்லாதவன்.”
    reason: ἱκανός என்பது தகுதி, பொருத்தம், போதுமான தன்மை ஆகிய தொடர்புடைய பொருள்களைக் கொள்ளக்கூடும்; இச்சூழலில் நெறிசார் பாத்திரத்தன்மையும் பணிக்கான தகுதியும் ஒன்றோடொன்று பின்னியுள்ளன.
lexical_decisions:
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறியதற்கான விளக்கத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐλάχιστος
  choice: மிகச் சிறியவன்
  rationale: உடல் அளவை அல்ல, அப்போஸ்தலர்களிடையே பவுல் தன்னைக் குறித்து கூறும் தாழ்ந்த நிலையைக் குறிக்கிறது; தமிழில் இயல்பான ஒப்புமை வடிவம்.
- source_word: ἀπόστολος / ἀποστόλων
  choice: அப்போஸ்தலன் / அப்போஸ்தலர்கள்
  rationale: இங்கு பொதுவான தூதர்களை அல்ல, அங்கீகரிக்கப்பட்ட அப்போஸ்தலர் குழுவைக் குறிக்கும் தொழில்நுட்பப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἱκανός
  choice: தகுதியற்றவன்
  rationale: ἱκανός என்பதிலுள்ள ‘தகுதியுடைய/போதுமான/பொருத்தமான’ என்ற பொருள் வரம்பைப் பாதுகாக்கிறது; துன்புறுத்திய தனது கடந்தகாலத்தை முன்னிட்டு பவுல் கூறும் தாழ்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καλεῖσθαι
  choice: என்று அழைக்கப்படுவதற்கு
  rationale: கிரேக்கத்தின் செயப்பாட்டு வினை அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: διότι
  choice: துன்புறுத்தியதால்
  rationale: பவுல் ஏன் தகுதியற்றவர் என்று கருதுகிறார் என்பதற்கான காரணத் தொடர்பைத் தமிழின் காரண விகுதி தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐδίωξα
  choice: துன்புறுத்தினேன்
  rationale: விசுவாசிகளுக்கு எதிரான பவுலின் முந்தைய பகைமையான செயல்களைக் குறிக்கும் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: கடவுளின் திருச்சபை
  rationale: விசுவாசிகளின் சமூகத்தைச் சுட்டும் பவுலின் பயன்பாட்டையும், τοῦ θεοῦ என்ற உடைமைத் தொடர்பையும் காக்கிறது.
- source_word: ὃς
  choice: தகுதியற்றவன்
  rationale: கிரேக்க உறவுப்பெயர் பவுலையே மீண்டும் சுட்டுகிறது; தமிழில் தேவையற்ற ‘அவனாகிய நான்’ போன்ற வடிவத்தைத் தவிர்த்து, ஒரே வாக்கியத்தின் தொடர்ச்சியில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: பவுலின் அப்போஸ்தலத்துவத்தைப் பற்றிய கூற்றின் இயல்பு
  choice: பவுல் தன்னை அப்போஸ்தலர்களுக்குள் ஒருவராகச் சேர்த்துக்கொண்டபடியே, அந்தப் பெயருக்குத் தான் தகுதியற்றவன் எனத் தாழ்மையுடன் கூறுகிறார்.
  alternative: பவுல் தன் அப்போஸ்தலத்துவத்தையே முற்றிலும் மறுக்கிறார்; அல்லது சமூக நிலையில் மட்டும் தாழ்ந்தவர் என்று கூறுகிறார்.
  rationale: ‘அப்போஸ்தலர்களில்’ என்பது அவர் அந்தக் குழுவைச் சேர்ந்தவர் என்பதை உறுதிப்படுத்துகிறது; ‘தகுதியற்றவன்’ என்பது கடவுளின் திருச்சபையைத் துன்புறுத்தியதுடன் இணைந்த தாழ்மையை வெளிப்படுத்துகிறது. இரண்டிற்குமிடையிலான இறையியல் பதற்றம் தீர்த்துவிடப்படாமல் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடவுள்’ என்பது பிரிவுசார் தனிச்சாயலைத் தவிர்க்கவும், ‘திருச்சபை’ என்பது இங்கு விசுவாசிகளின் சமூகத்தைக் குறிக்கும் நிலைபெற்ற சொலாகவும் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட உறவுப்பெயர் அமைப்பு தமிழில் இயல்பாக இருக்க அரைப்புள்ளியுடன் ஒரே வாக்கியமாக வடிவமைக்கப்பட்டுள்ளது.
