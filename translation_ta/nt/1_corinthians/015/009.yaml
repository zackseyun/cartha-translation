- from: ஏனெனில், அப்போஸ்தலர்களில் நானே மிகச் சிறியவன்; கடவுளின் திருச்சபையைத் துன்புறுத்தியதால், அப்போஸ்தலன் என்று அழைக்கப்படுவதற்குத் தகுதியற்றவன்.[a]
  to: ஏனெனில், நான் அப்போஸ்தலர்களில் மிகத் தாழ்ந்தவன்; அப்போஸ்தலன் என்று அழைக்கப்படுவதற்குத் தகுதியற்றவன்; ஏனெனில் நான் கடவுளின் திருச்சபையைத் துன்புறுத்தினேன்.[a]
  rationale: மூலத்தில் உள்ள ἐλάχιστος-இன் நிலை/மதிப்பீட்டுப் பொருளை உடலளவுப் பொருளிலிருந்து வேறுபடுத்த “மிகத் தாழ்ந்தவன்” என மாற்றப்பட்டது. மேலும், கிரேக்கத்தில் διότι அறிமுகப்படுத்தும் காரணக் கூற்று உறவுப்பகுதிக்குப் பின் வருவதால், தமிழிலும் அதை இறுதியில் வைத்துத் தர்க்கத் தொடர்பு தெளிவாக்கப்பட்டது. அடிக்குறிப்பின் மாற்றுச்சொல் நவீனத் தமிழுக்கு இயல்பாக திருத்தப்பட்டது.
