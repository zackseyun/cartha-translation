  source_fidelity: 'கருத்து முழுமையாக மூலக் கிரேக்கத்துடன் ஒத்துள்ளது: γάρ-இன் விளக்கத் தொடர்பு, அப்போஸ்தலர்களில் பவுலின் இடம், அழைக்கப்படத் தகுதியின்மை, மற்றும் கடவுளின் திருச்சபையை அவர் துன்புறுத்தியதே அதற்குக் காரணம் என்பன காக்கப்பட்டுள்ளன. ஆனால் “மிகச் சிறியவன்” என்பது தமிழில் உடல் அளவையும் முதன்மையாகச் சுட்டக்கூடும்; இங்கு ἐλάχιστος குறிக்கும் ஒப்பீட்டுத் தாழ்நிலையை இன்னும் தெளிவாகத் தரலாம்.'
