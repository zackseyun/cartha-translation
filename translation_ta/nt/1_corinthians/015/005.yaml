reference: 1 Corinthians 15:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅτι ὤφθη Κηφᾷ, εἶτα τοῖς δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/005.yaml
  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: ta
  text: மேலும், அவர் கேபாவுக்கு[b] காட்சியளித்தார்[a]; பின்னர் பன்னிருவருக்கும்[c] காட்சியளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேபாவால் காணப்பட்டார்.” கிரேக்க வினை இலக்கணப்படி செயப்பாட்டு வடிவில் உள்ளது; ஆனால் உயிர்த்தெழுதலுக்குப் பிந்தைய காட்சிகளைச் சொல்லும் இடங்களில் அது பொதுவாக “காட்சியளித்தார்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: கேபா என்பது பேதுருவுக்கு வழங்கப்பட்ட அரமேயப் பெயர்.
    reason: cross_reference
  - marker: c
    text: “பன்னிருவர்” என்பது இயேசுவின் அப்போஸ்தலர் குழுவுக்கான நிலைபெற்ற பெயர்; எல்லா நேரங்களிலும் அந்தக் குழுவில் சரியாகப் பன்னிரண்டு பேர் இருந்தார்கள் என்று இது அவசியமாகக் குறிக்காது.
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: காட்சியளித்தார்
  rationale: ὁράω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் இது. உயிர்த்தெழுதல் காட்சிகளைச் சொல்லும் இச்சூழலில், இயல்பான நவீன தமிழில் ‘காட்சியளித்தார்’ என்பது அதன் பொருளைத் தெளிவாகத் தருகிறது. இலக்கண வடிவுக்கு நெருக்கமான ‘காணப்பட்டார்’ என்பது அடிக்குறிப்பில் மாற்றாக வைக்கப்பட்டுள்ளது.
- source_word: Κηφᾷ
  choice: கேபாவுக்கு
  rationale: Κηφᾶς என்ற பெயரின் நான்காம் வேற்றுமை வடிவம். கிரேக்க உரையில் உள்ள பெயரைப் ‘பேதுரு’ என்று மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: εἶτα
  choice: பின்னர்
  rationale: சாட்சிகளின் வரிசையில் அடுத்த நிகழ்வைக் குறிக்கிறது. ‘பின்னர்’ காலமுறைத் தொடரை இயல்பாகப் பாதுகாக்கிறது.
- source_word: τοῖς δώδεκα
  choice: பன்னிருவருக்கும்
  rationale: இயேசுவின் அப்போஸ்தலர் குழுவுக்கான நிலைபெற்ற குழுப்பெயரை அப்படியே பாதுகாக்கிறது; ‘பதினொருவர்’ என்ற வரலாற்று ஒத்திசைவை உரைக்குள் கொண்டுவரவில்லை.
- source_word: καὶ ὅτι
  choice: மேலும்
  rationale: முந்தைய வசனங்களில் தொடரும் உள்ளடக்கக் கூற்றைத் தமிழில் இயல்பாக இணைக்கிறது. தமிழில் ‘என்பதையும்’ என்று வெளிப்படையாகச் சேர்ப்பது இந்த வசனத்தை மட்டும் வாசிக்கும்போது செயற்கையான தொங்கும் அமைப்பை உருவாக்கும்; ‘மேலும்’ தொடர்ச்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுந்தவரின் காட்சி பற்றிய மொழி
  choice: காட்சியளித்தார்
  alternative: காணப்பட்டார்
  rationale: இந்த வினை இயேசு உயிர்த்தெழுந்த பின் காணப்பட்ட நிகழ்வை உறுதிப்படுத்துகிறது; ஆனால் அந்தக் காட்சியின் முறையை விளக்கவில்லை. ‘காட்சியளித்தார்’ வரலாற்றுக் கூற்றைப் பாதுகாத்து, தேவையற்ற விளக்கத்தைச் சேர்க்காது.
- issue: யூதாஸ் இல்லாதபோதும் ‘பன்னிருவர்’ என்று குறிப்பிடுதல்
  choice: பன்னிருவருக்கும்
  alternative: அப்போஸ்தலர்களுக்கும் / பதினொருவருக்கும்
  rationale: கிரேக்க உரை நிலைபெற்ற குழுப்பெயரான τοῖς δώδεκα என்பதையே பயன்படுத்துகிறது. வேறு பகுதிகளோடு ஒத்திசைக்க அதை ‘பதினொருவர்’ என்று மாற்றாமல் அப்படியே மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘காட்சியளித்தார்’ என்பது ‘தரிசனமானார்’ என்பதைக் காட்டிலும் இன்றைய வாசகர்களுக்கு இயல்பானது. மூலத்தில் வினை ஒருமுறை மட்டுமே வந்தாலும், தமிழில் பொருள் தெளிவாகவும் இயல்பாகவும் இருக்க இரண்டாவது உறுப்பிலும் அது மீண்டும் வழங்கப்பட்டுள்ளது.
