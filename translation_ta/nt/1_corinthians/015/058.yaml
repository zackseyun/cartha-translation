source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: ta
  text: ஆகவே, என் அன்புக்குரிய சகோதரர்களே[a], உறுதியானவர்களாகவும் அசைக்க முடியாதவர்களாகவும் ஆகுங்கள். ஆண்டவருடைய பணியில் எப்போதும் பெருகிச் செயல்படுங்கள். ஆண்டவருக்குள் உங்கள் உழைப்பு வீணானதல்ல என்பதை அறிந்தவர்களாய் இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் ἀδελφοί; சூழலைப் பொறுத்து, பெண்கள் உட்பட சக விசுவாசிகள் அனைவரையும் கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: ஆகவே
  rationale: முந்தைய உயிர்த்தெழுதல் வாதத்திலிருந்து வரும் முடிவுரையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: என் அன்புக்குரிய சகோதரர்களே
  rationale: உறவுமுறையையும் அன்பான நேரடி அழைப்பையும் காக்கிறது; இச்சூழலில் முழுத் திருச்சபையையும் உள்ளடக்கும் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἑδραῖοι γίνεσθε
  choice: உறுதியானவர்களாக ... ஆகுங்கள்
  rationale: γίνεσθε என்பதன் ‘ஆகுங்கள்’ என்ற இயக்கமுள்ள கட்டளைப் பொருளையும், ἑδραῖοι என்பதன் நிலைத்த உறுதியையும் காக்கிறது.
- source_word: ἀμετακίνητοι
  choice: அசைக்க முடியாதவர்களாக
  rationale: நிலையிலிருந்து நகர்த்தப்படாத உறுதியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: περισσεύοντες
  choice: மிகுதியாக ஈடுபடுங்கள்
  rationale: தொடர்ந்து அளவுக்கு மிகுதியாகச் செயல்படும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது; வெறும் ‘சிறந்து விளங்குங்கள்’ எனக் குறுக்கவில்லை.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: ஆண்டவருடைய பணியில்
  rationale: ἔργον என்பதன் பரந்த செயல்/பணி பொருளைக் காக்கிறது; குறிப்பிட்ட ஊழியப் பதவிக்குள் மட்டும் சுருக்கவில்லை.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: காலத் தொடர்ச்சியை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἰδότες
  choice: அறிந்திருக்கிறீர்களே
  rationale: ஏற்கெனவே நிலைபெற்ற அறிவைச் சுட்டும் perfect participle-இன் உணர்வையும், exhortation-க்கு அடிப்படையான காரணத் தொடர்பையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ὁ κόπος ὑμῶν
  choice: நீங்கள் படும் பாடு
  rationale: κόπος குறிக்கும் களைப்பூட்டும் கடின உழைப்பை ‘பணி’ என்பதைக் காட்டிலும் வலிமையாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἔστιν κενὸς
  choice: வீண்போகாது
  rationale: பலனற்றதாகவோ பயனற்றதாகவோ இராது என்ற சூழல் பொருளைச் செம்மையான தமிழ் வழக்கில் தெரிவிக்கிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் விரிவான உறவு/ஒன்றிப்பு சார்ந்த மொழியை விளக்கக் குறுக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀδελφοί என்பதன் பாலின மற்றும் உள்ளடக்கப் பரப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று மொழிபெயர்த்து, பெண்களையும் உள்ளடக்கக்கூடிய கூட்டுப்பயன்பாட்டை அடிக்குறிப்பில் குறிப்பிட்டல்
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மை; அதேவேளை இக்கடிதச் சூழலில் முழுத் திருச்சபையையும் குறிக்கிறது. வடிவும் சூழல் பரப்பும் இரண்டையும் இம்முறை பாதுகாக்கிறது.
- issue: இறுதியிலுள்ள ἐν κυρίῳ எதனுடன் தொடர்புபடுகிறது
  choice: ‘ஆண்டவருக்குள் நீங்கள் படும் பாடு’ என உழைப்பைத் தகுதிப்படுத்துதல்
  alternative: ‘ஆண்டவரால் உங்கள் பாடு வீண்போகாது’
  rationale: இச்சொற்றொடர் விசுவாசிகளின் உழைப்பை ஆண்டவருடனான உறவுக்குள் அமைப்பதாக இயல்பாகப் புரிகிறது; காரண அல்லது கருவிப் பொருளைத் தேவையின்றி நிர்ணயிக்கவில்லை.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இச்சூழலில் இயேசுவைக் குறிக்கும் மரியாதைமிக்க, நிலையான தமிழ் வேதாகமப் பயன்பாடு; ‘எஜமான்’ இங்கு தேவையற்ற எஜமானர்–அடிமை நிழற்பொருளை முன்னிறுத்தலாம்.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ். ‘உறுதியானவர்களாகவும் அசைக்க முடியாதவர்களாகவும்’ என்ற இணை அமைப்பு கிரேக்கத்தின் இரு வலியுறுத்தல்களையும் காக்கிறது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; தர்க்கத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
