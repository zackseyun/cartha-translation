review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential force, beloved address, firmness, constancy, continual service, and the assurance that labor in the Lord is not futile. However, ‘நீங்கள் படும் பாடு’ can primarily suggest suffering rather than κόπος, which denotes arduous labor; and the final rhetorical ‘அறிந்திருக்கிறீர்களே’ changes the participial grounding into a question-like assertion.
  naturalness: The Tamil is generally clear and modern. A more direct rendering of κόπος as ‘உழைப்பு’ and a non-rhetorical participial construction are more natural and precise in this exhortation.
  terminology: ‘ஆண்டவர்,’ ‘ஆண்டவருக்குள்,’ and the retained masculine-form address with an explanatory footnote are appropriate. ‘பணியில் ... பெருகிச் செயல்படுங்கள்’ more fully represents abounding in the Lord’s work than ‘மிகுதியாக ஈடுபடுங்கள்.’
  issues:
  - severity: medium
    issue: ‘நீங்கள் படும் பாடு’ for ὁ κόπος ὑμῶν
    rationale: This expression may be understood chiefly as hardship or suffering. κόπος emphasizes wearying, strenuous labor; ‘உங்கள் உழைப்பு’ is direct and maintains the intended sense.
  - severity: medium
    issue: ‘அறிந்திருக்கிறீர்களே’ for εἰδότες
    rationale: The enclitic ‘-ஏ’ gives a rhetorical ‘you know, do you not?’ effect not present in the Greek participle. The participle should function as the basis for the exhortation without adding a question-like nuance.
  - severity: low
    issue: ‘மிகுதியாக ஈடுபடுங்கள்’ for περισσεύοντες ἐν τῷ ἔργῳ
    rationale: It is acceptable, but ‘பெருகிச் செயல்படுங்கள்’ better retains the sense of abounding while keeping the work itself in view.
  revised_text: ஆகவே, என் அன்புக்குரிய சகோதரர்களே[a], உறுதியானவர்களாகவும் அசைக்க முடியாதவர்களாகவும் ஆகுங்கள். ஆண்டவருடைய பணியில் எப்போதும் பெருகிச் செயல்படுங்கள். ஆண்டவருக்குள் உங்கள் உழைப்பு வீணானதல்ல என்பதை அறிந்தவர்களாய் இருங்கள்.
