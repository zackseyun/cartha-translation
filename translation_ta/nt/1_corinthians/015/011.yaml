  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: ta
  text: எனவே, நானோ அவர்களோ, நாங்கள் இவ்வாறே அறிவிக்கிறோம்; நீங்கள் இவ்வாறே நம்பினீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: …ஆக இருந்தாலும் …ஆக இருந்தாலும்
  rationale: இரு மாற்றுகளையும் முன்வைக்கும் இணை அமைப்பை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உயிர்த்தெழுதல் சாட்சிகளைப் பற்றிய உரையிலிருந்து வரும் முடிவுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐγὼ / ἐκεῖνοι
  choice: நான் / அவர்கள்
  rationale: பவுலையும் முன்னர் குறிப்பிடப்பட்ட மற்ற அப்போஸ்தலர்களையும் நேரடியாக வேறுபடுத்துகிறது; மூலத்தில் இல்லாத விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: οὕτως
  choice: இவ்வாறே
  rationale: முன்னர் சுருக்கிக் கூறப்பட்ட செய்தியையும் அதன் முறையையும் சுட்டும் மூலத்தின் பொருள் விரிவைத் தக்கவைக்கிறது; இருமுறை ஒரே விதமாக மொழிபெயர்ப்பதால் இணை அமைப்பும் நிலைக்கிறது.
- source_word: κηρύσσομεν
  choice: நாங்கள் அறிவிக்கிறோம்
  rationale: பொதுவாகப் பிரகடனம் செய்வதைக் குறிக்கும் வினையின் பொருளை, சாதாரண வாசகருக்குப் புரியும் கண்ணியமான தமிழில் வழங்குகிறது.
- source_word: ἐπιστεύσατε
  choice: நீங்கள் நம்பினீர்கள்
  rationale: கொரிந்தியர்கள் கடந்த காலத்தில் நம்பிய செயலை நேரடியாகத் தெரிவிக்கிறது; நம்பிக்கையின் பொருளை மூலத்தைவிட அதிகமாக விளக்குவதில்லை.
theological_decisions:
- issue: அப்போஸ்தலர்களின் அறிவிப்பிலுள்ள ஒருமைப்பாட்டின் வரம்பு
  choice: பவுலாக இருந்தாலும் மற்ற அப்போஸ்தலர்களாக இருந்தாலும், இங்கு சுருக்கப்பட்ட அதே செய்தியையே அவர்கள் அறிவித்தார்கள்; கொரிந்தியர்களும் அதையே நம்பினார்கள்.
  alternative: இது செய்தியின் உள்ளடக்கத்தைவிட அறிவித்த விதத்தை முதன்மையாகக் குறிக்கிறது.
  rationale: இருமுறை வரும் οὕτως செய்தியின் உள்ளடக்கத்தையும் முறையையும் குறிக்கக்கூடும். எனவே ‘இவ்வாறே’ என்ற மொழிபெயர்ப்பு அந்த உண்மையான நுண்பொருள் விரிவைத் திறந்தவாறே வைத்திருந்து, உரை கூறாத விரிவான திருச்சபைக் கோட்பாட்டைச் சேர்க்காமல் அப்போஸ்தல சாட்சியின் ஒருமைப்பாட்டைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான நடையில் மூலத்தின் சுருக்கத்தையும் ‘இவ்வாறே … இவ்வாறே’ என்ற இணை ஒலியையும் தக்கவைக்கிறது.
