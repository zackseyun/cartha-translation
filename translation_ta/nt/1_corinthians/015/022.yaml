id: 1CO.15.22
reference: 1 Corinthians 15:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: ta
  text: ஏனெனில், ஆதாமுக்குள் அனைவரும் இறப்பதுபோலவே, மெசியாவுக்குள்ளும் அனைவரும் உயிர்ப்பிக்கப்படுவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவுக்குள்.” கிரேக்கப் பட்டப்பெயரான Χριστός என்பதை “கிறிஸ்து” என்றும் வழங்கலாம்; இங்கு அதன் பொருளை வெளிப்படுத்த “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: எப்படி ... ஓ
  rationale: ὥσπερ என்பதன் ஒப்பீட்டுத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது. γάρ முன் சூழலுடன் காரணவிளக்கத் தொடர்பைத் தருகிறது; தனியே ‘ஏனெனில்’ என்று சேர்ப்பது தமிழில் வாக்கியத்தைச் சற்றுக் கடினமாக்குவதால், தொடரின் விளக்கத் தன்மை கட்டமைப்பிலேயே வெளிப்படுகிறது.
- source_word: ἐν τῷ Ἀδὰμ
  choice: ஆதாமுக்குள்
  rationale: ἐν என்பதன் சுருக்கமான பிரதிநிதித்துவ அல்லது கூட்டிணைவு நுணுக்கத்தைத் தீர்மானித்து விளக்காமல் பாதுகாக்கிறது; ‘ஆதாமினால்’ என்பது கருவிப் பொருளைத் தேவையின்றி முன்னிறுத்தும்.
- source_word: πάντες
  choice: அனைவரும்
  rationale: இரு இடங்களிலும் வரும் πάντες என்பதன் பரந்த, வரையறுக்கப்படாத வடிவையும் இணை அமைப்பையும் அப்படியே காக்கிறது.
- source_word: ἀποθνῄσκουσιν
  choice: இறக்கிறார்கள்
  rationale: நிகழ்கால வடிவத்தின் பொதுவான அல்லது நிலையான உண்மையை இயல்பான தமிழ் நிகழ்காலத்தில் தருகிறது.
- source_word: οὕτως καὶ
  choice: அப்படியே
  rationale: முதல் பாதியின் ஒப்பீட்டோடு இரண்டாம் பாதியை இணைத்து, ‘அதேபோலவும்’ என்ற கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ Χριστῷ
  choice: மெசியாவுக்குள்
  rationale: Χριστός இங்கு பட்டப்பெயராக இருப்பதால் அதன் பொருளை ‘மெசியா’ என்று தருகிறது; ἐν என்பதையும் முதல் பாதியுடன் இணையாக ‘-க்குள்’ என்று பாதுகாக்கிறது.
- source_word: ζῳοποιηθήσονται
  choice: உயிர்ப்பிக்கப்படுவார்கள்
  rationale: எதிர்காலச் செயலப்பாட்டு வடிவத்தையும், உயிரைப் பெறச் செய்யும் செயல் அவர்கள்மேல் நிகழ்வதையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இரு பகுதிகளிலும் ‘அனைவரும்’ என்பதன் வரம்பு
  choice: இரு இடங்களிலும் எந்த விளக்கக் கட்டுப்பாடும் சேர்க்காமல் ‘அனைவரும்’ என்று வைத்தல்
  alternative: இரண்டாவது ‘அனைவரும்’ என்பதை ‘விசுவாசிகள் அனைவரும்’ எனக் குறுக்குதல், அல்லது இரண்டும் முற்றிலும் ஒரே வரம்பைக் குறிக்கின்றன என்று விளக்குதல்
  rationale: கிரேக்க உரை πάντες ... πάντες என்ற திட்டமிட்ட இணை அமைப்பைக் கொண்டுள்ளது; இந்த வசனத்திலேயே அதன் இறையியல் வரம்பை மேலும் வரையறுக்கவில்லை. ஆகவே உள்ள பதற்றமும் தெளிவின்மையும் மொழிபெயர்ப்பில் பாதுகாக்கப்படுகின்றன.
- issue: Χριστός என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός ஒரு பட்டப்பெயராகச் செயல்பட்டு ஆதாமுடன் இணையாக நிற்கிறது. ‘மெசியா’ அதன் பட்டப்பெயர்ச் சார்ந்த பொருளை வெளிப்படுத்துகிறது; பரவலாக அறியப்பட்ட ‘கிறிஸ்து’ மாற்று வடிவமாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானவும் பொதுவாசகர்களுக்குப் புரியக்கூடியவுமான நடை. ‘ஆதாமுக்குள் / மெசியாவுக்குள்’ என்ற இணை அமைப்பு பவுலின் சுருக்கமான மொழியையும் அதன் விளக்கப்படாத இறையியல் நுணுக்கத்தையும் காக்கிறது.
