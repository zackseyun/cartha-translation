    issue: The inferential particle ἄρα is not explicitly represented.
    rationale: 'The conditional construction supplies some inferential flow, but ἄρα specifically draws the conclusion: “then/therefore.” Adding “அப்படியானால்” preserves Paul’s logical argument.'
  - severity: low
    issue: “நாங்கள் பறைசாற்றுவது” changes the noun phrase τὸ κήρυγμα ἡμῶν into a verbal relative expression.
    rationale: It is intelligible, but “எங்கள் அறிவிப்பு” more directly preserves the source’s nominal parallel with “உங்கள் விசுவாசம்.”
