source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: ta
  text: மேசியா[a] உயிர்த்தெழுப்பப்பட்டிருக்கவில்லை என்றால், அப்படியானால் எங்கள் அறிவிப்பு வெறுமையானது[b]; உங்கள் விசுவாசமும்[c] வெறுமையானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது ‘கிறிஸ்து’. கிரேக்கச் சொல்: கிறிஸ்தோஸ் (Christos).'
    reason: alternative_reading
  - marker: b
    text: ‘வெறுமையானது’ என்பதற்குப் பதிலாக, இவ்வசனத்தின் இரு இடங்களிலும் ‘பயனற்றது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘உங்கள் விசுவாசம்’ என்பதற்குப் பதிலாக ‘நீங்கள் வைத்திருக்கும் நம்பிக்கை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: மேசியா
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளை வெளிப்படுத்துகிறது; உயிர்த்தெழுதல் குறித்த பவுலின் வாதத்தில் மேசியாவின் அடையாளமும் பணியும் தொடர்ந்து முன்னிலையில் உள்ளன.
- source_word: ἐγήγερται
  choice: உயிர்த்தெழுப்பப்பட்டிருக்கவில்லை
  rationale: ἐγείρω என்பதன் நிறைநிலைச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. செயப்படுபொருளின் தற்போதைய விளைவையும் மறைமுகமான செயற்பாட்டாளரையும் தமிழில் இயன்றவரை வெளிப்படுத்துகிறது.
- source_word: ἄρα
  choice: என்றால் (வாக்கிய அமைப்பில் விளைவுறவாக)
  rationale: நிபந்தனையிலிருந்து வரும் தர்க்கரீதியான முடிவை இயல்பான தமிழ் நிபந்தனை–விளைவு அமைப்பில் தெரிவிக்கிறது; தனியாக ‘அப்படியானால்’ சேர்ப்பது தேவையற்ற கனத்தை உண்டாக்கும்.
- source_word: τὸ κήρυγμα ἡμῶν
  choice: நாங்கள் பறைசாற்றுவது
  rationale: κήρυγμα என்பதன் பொதுவெளி அறிவிப்பு/பறைசாற்றல் சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; இதை ஒரு பிரசங்க நிகழ்வாக மட்டும் குறுக்கவில்லை.
- source_word: κενὸν / κενὴ
  choice: வெறுமையானது
  rationale: உள்ளடக்கம், ஆதாரம் அல்லது செல்லுபடியாகும் தன்மை இல்லாமையை எளிய நவீன தமிழில் தெரிவிக்கிறது. இரண்டு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி பவுலின் இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἡ πίστις ὑμῶν
  choice: உங்கள் விசுவாசம்
  rationale: இங்கு கொரிந்தியர்களின் நம்பும் பதிலைக் குறிக்கிறது. ‘விசுவாசம்’ என்பது சூழலுக்குப் பொருத்தமானதும் பரவலாகப் புரிந்துகொள்ளப்படுவதுமான சொல்.
theological_decisions:
- issue: உயிர்த்தெழுதல் வினையின் வடிவமும் செயற்பாட்டாளரும்
  choice: உயிர்த்தெழுப்பப்பட்டிருக்கவில்லை
  alternative: உயிர்த்தெழுந்திருக்கவில்லை
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, இயேசுவை உயிர்த்தெழுப்பிய செயற்பாட்டாளரை மொழிபெயர்ப்பு வெளிப்படையாக நிர்ணயிக்காமல் விடுகிறது; அதே நேரத்தில் நிறைநிலையின் தொடரும் விளைவும் தக்கவைக்கப்படுகிறது.
- issue: Χριστός பட்டப்பெயரா அல்லது பெயர்போன்ற வடிவமா
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் மேசியா என்னும் பட்டப்பெயரின் அர்த்தத்தை வெளிப்படையாகத் தக்கவைக்கிறது; மரபான ‘கிறிஸ்து’ என்பதும் சாத்தியமான மொழிபெயர்ப்பு என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பறைசாற்றுவது’ என்பது பொது அறிவிப்பின் கருத்தை இயல்பாகக் கொண்டுவருகிறது. கிரேக்கத்தின் நிபந்தனை அமைப்பும், ‘வெறுமையானது’ என்ற இருமுறைத் திருப்பமும், செயப்பாட்டு உயிர்த்தெழுதல் மொழியும் பாதுகாக்கப்பட்டுள்ளன.
