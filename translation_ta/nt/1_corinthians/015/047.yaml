base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: ta
  text: முதல் மனிதன் பூமியைச் சேர்ந்த புழுதியாலானவன்[a]; இரண்டாம் மனிதன் பரலோகத்தைச் சேர்ந்தவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியைச் சேர்ந்த, புழுதியானவன்.” ‘புழுதியாலானவன்’ என்பதற்கான கிரேக்கச் சொல் ஆதாம் மண்ணின் புழுதியிலிருந்து படைக்கப்பட்டதை நினைவூட்டுகிறது.
    reason: ἐκ γῆς (‘பூமியிலிருந்து/பூமியைச் சேர்ந்த’) மற்றும் χοϊκός (‘புழுதியான/புழுதியாலான’) ஆகியவற்றின் நெருங்கிய பொருள் தொடர்பையும் ஆதியாகமப் படைப்பு எதிரொலியையும் விளக்குகிறது.
lexical_decisions:
- source_word: πρῶτος
  choice: முதல்
  rationale: ஆதாம்–கிறிஸ்து ஒப்பீட்டின் முதல் உறுப்பைக் குறிக்கும் வரிசைச் சொல்; இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἄνθρωπος
  choice: மனிதன்
  rationale: இங்கு முதலில் ஆதாமையும் பின்னர் கிறிஸ்துவையும் பிரதிநிதித்துவ முறையில் குறிக்கிறது; பவுலின் இணை அமைப்பைத் தக்கவைக்க இரு இடங்களிலும் ‘மனிதன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐκ γῆς
  choice: பூமியிலிருந்து வந்தவன்
  rationale: ἐκ என்பது மூலத்தையும் தோற்றத்தையும் குறிக்கிறது. இவ்வடிவம் பூமியிலிருந்து உருவாக்கப்பட்ட ஆதாமைப் பற்றிய படைப்பு நிகழ்வின் எதிரொலியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: χοϊκός
  choice: புழுதியால் ஆனவன்
  rationale: χοϊκός என்பது புழுதியால் அல்லது மண்ணால் ஆன தன்மையைக் குறிக்கிறது; ஆதாம் புழுதியிலிருந்து படைக்கப்பட்டதை நினைவூட்டும் பொருளைத் தெளிவாகக் கொண்டுவருகிறது.
- source_word: δεύτερος
  choice: இரண்டாம்
  rationale: முதல் மனிதனுக்கு எதிரிணையாக நிற்கும் இரண்டாவது பிரதிநிதி மனிதனைக் குறிக்கிறது; மூலத்தின் இணை அமைப்பு காக்கப்படுகிறது.
- source_word: ἐξ οὐρανοῦ
  choice: பரலோகத்திலிருந்து வந்தவர்
  rationale: பரலோக மூலத்தைக் குறிக்கிறது. ‘வானம்’ என்பதைவிட ‘பரலோகம்’ இச்சூழலின் தெய்வீக, அப்பாற்பட்ட பொருளைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘இரண்டாம் மனிதன்’ என்பதன் கிறிஸ்துவியல் பொருள்
  choice: ‘இரண்டாம் மனிதன்’ என்ற மூலச் சொல்லாட்சியை மட்டும் தக்கவைத்து, ‘கிறிஸ்து’ என்று வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘இரண்டாம் மனிதனாகிய கிறிஸ்து பரலோகத்திலிருந்து வந்தவர்.’
  rationale: சூழல் இரண்டாம் மனிதனை கிறிஸ்துவாக அடையாளப்படுத்தினாலும், இவ்வசனத்தின் கிரேக்க உரை அவரைப் பெயரிட்டு குறிப்பிடவில்லை. ஆகவே ஆதாம்–கிறிஸ்து முன்மாதிரி ஒப்பீட்டை விளக்கச் சொற்கள் சேர்க்காமல் தக்கவைக்கிறது.
- issue: இரண்டாம் கூறில் வெளிப்படையான வினைச்சொல் இல்லாமை
  choice: தமிழில் இயல்பாக அமைய ‘பரலோகத்திலிருந்து வந்தவர்’ என்று வழங்கப்பட்டுள்ளது.
  alternative: ‘இரண்டாம் மனிதன் பரலோகத்தைச் சேர்ந்தவர்.’
  rationale: கிரேக்கத்தில் இணைப்பு வினை வெளிப்படையாக இல்லை. தமிழில் முழுமையான கூறாக அமைய ‘வந்தவர்’ பயன்படுத்தப்படுகிறது; இது பரலோக மூலத்தை வெளிப்படுத்துகிறது, ஆனால் மூலத்தில் இல்லாத மேலதிக நிகழ்வு விவரத்தைச் சேர்ப்பதில்லை.
- issue: இரண்டாம் மனிதனுக்கான மரியாதைப் பன்மை
  choice: ‘வந்தவர்’
  alternative: ‘வந்தவன்’
  rationale: தமிழில் கிறிஸ்துவைக் குறிப்பிடும்போது இயல்பாகப் பயன்படும் மரியாதை வடிவம் இது. அடையாளத்தை உரைக்குள் பெயரிட்டு விரிவுபடுத்தாமல், dignified modern Tamil register-ஐ காக்கிறது.
