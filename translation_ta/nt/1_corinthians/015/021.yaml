base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: ta
  text: ஏனெனில், ஒரு மனிதன் வழியாக மரணம் வந்ததால், அதுபோலவே ஒரு மனிதன் வழியாக இறந்தோரின் உயிர்த்தெழுதலும் வந்தது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரு இடங்களிலும் ‘ஒரு மனிதனால்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க முன்னிடைச்சொல் கருவி அல்லது செயற்பாட்டாளரைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சூழலில் இந்த இரு மனிதர்கள் ஆதாமும் மெசியாவும் என பவுல் அடையாளப்படுத்துகிறார் (15:22, 45 பார்க்க).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: ஏனெனில் ... வந்ததால்
  rationale: ἐπειδήயின் காரணப் பொருளையும் γάρ-இன் விளக்கத் தொடர்பையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: δι’ ἀνθρώπου
  choice: ஒரு மனிதன் வழியாக
  rationale: διά + வேற்றுமை உருபின் வழிமுறை அல்லது செயற்பாட்டாளர் சார்ந்த பொருளைத் திறந்தவாறே வைத்திருக்கிறது; கிரேக்கத்தில் எண்ணுப்பெயர் இல்லாததால் ‘ஒரே மனிதன்’ என்று விரிவுபடுத்தவில்லை.
- source_word: θάνατος
  choice: மரணம் வந்தது
  rationale: கிரேக்க வாக்கியம் வினையில்லாதது; தமிழில் இயல்புக்காக ‘வந்தது’ சேர்க்கப்பட்டு, மரணம் மனிதன் வழியாக நிகழ்வுலகில் நுழைந்ததைக் காட்டுகிறது.
- source_word: καὶ
  choice: வழியாகவே
  rationale: இரண்டாம் கூற்றின் இணையான தொடர்பை ‘-வே’ வலியுறுத்தல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνάστασις νεκρῶν
  choice: இறந்தோரின் உயிர்த்தெழுதல்
  rationale: இறந்தவர்கள் உண்மையாக உயிர்த்தெழுவதை நேரடியாகவும் தமிழில் வழக்கமான வேதாகமச் சொல்லாட்சியுடனும் தெரிவிக்கிறது.
- source_word: δι’ ἀνθρώπου
  choice: ஒரு மனிதன் வழியாக
  rationale: மரணம் மற்றும் உயிர்த்தெழுதல் பற்றிய பவுலின் திட்டமிட்ட இணை அமைப்பைப் பாதுகாக்க முதல் கூற்றின் சொல்லாட்சியே மீண்டும் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: ஆதாமுக்கும் கிறிஸ்துவுக்கும் இடையிலான பிரதிநிதித்துவ முரண்
  choice: இரு கூற்றுகளிலும் ‘ஒரு மனிதன்’ என்று வைத்து, பெயர்களை முதன்மை உரையில் சேர்க்கவில்லை.
  alternative: ‘ஆதாம் வழியாக ... கிறிஸ்து வழியாக’ அல்லது ‘ஒரே மனிதன் வழியாக’
  rationale: சூழல் அந்த இருவரையும் அடையாளப்படுத்தினாலும், இந்த வசனத்தில் பெயர்களோ ‘ஒரே’ என்ற எண்ணுப்பெயரோ இல்லை. ஆகவே மூலத்தின் சுருக்கமான இணை அமைப்பும் மறைமுகத் தன்மையும் பாதுகாக்கப்படுகின்றன.
- issue: உயிர்த்தெழுதலின் இயல்பு
  choice: ‘இறந்தோரின் உயிர்த்தெழுதல்’
  alternative: ‘மரணத்திற்குப் பிந்தைய வாழ்வு’ அல்லது ‘ஆவிக்குரிய உயிர்த்தெழுதல்’
  rationale: 1 கொரிந்தியர் 15-ன் வாதத்திற்கேற்ப, உயிர்த்தெழுதலைத் தெளிவற்ற மறுமை வாழ்வாகவோ வெறும் ஆன்மிக அனுபவமாகவோ மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான நடை. ‘ஒரு மனிதன் வழியாக’ என்ற மீளுரைப்பால் கிரேக்கத்தின் திட்டமிட்ட இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
