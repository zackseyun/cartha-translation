id: 1CO.15.35
reference: 1 Corinthians 15:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐρεῖ τις· Πῶς ἐγείρονται οἱ νεκροί, ποίῳ δὲ σώματι ἔρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: ta
  text: ஆனால், “இறந்தவர்கள் எப்படி உயிர்த்தெழுப்பப்படுகிறார்கள்? எப்படிப்பட்ட உடலுடன் அவர்கள் வருகிறார்கள்?” என்று ஒருவர் சொல்வார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறந்தவர்கள் எப்படி உயிர்த்தெழுகிறார்கள்?” கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவில் உள்ளது; சொல்லர்த்தமாக, “உயிர்த்தெழுப்பப்படுகிறார்கள்.” இது கடவுளின் செயல்பாட்டை மறைமுகமாகக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: ஆனால்
  rationale: எதிர்பார்க்கப்படும் கேள்விக்குத் திரும்பும் முரண்பாட்டு இடைமாற்றத்தை இயல்பாகக் குறிக்கிறது.
- source_word: ἐρεῖ τις
  choice: என்று ஒருவர் கேட்கலாம்
  rationale: சொல்லர்த்தமாக ‘ஒருவர் சொல்வார்’ என்றாலும், இங்கு கற்பனையான உரையாடுபவர் கேள்வி எழுப்புவதை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Πῶς
  choice: எப்படி
  rationale: செயல்முறை அல்லது சாத்தியம் பற்றிய கேள்வியை நேரடியாகத் தருகிறது.
- source_word: ἐγείρονται
  choice: உயிர்த்தெழுப்பப்படுகிறார்கள்
  rationale: கிரேக்க வினையின் செயப்பாட்டு வடிவத்தைப் பேணி, உயிர்த்தெழுதலில் மறைமுகமாகத் தோன்றும் தெய்வீக செயலாண்மையை வெளிப்படையாகச் சேர்க்காமல் விடுகிறது.
- source_word: οἱ νεκροί
  choice: இறந்தவர்கள்
  rationale: மனிதர்களைக் குறிக்கும் பெயர்ச்சொல்லாக்கப்பட்ட அடைமொழிக்கு இயல்பான, தெளிவான தமிழாக்கம்.
- source_word: ποίῳ ... σώματι
  choice: எப்படிப்பட்ட உடலுடன்
  rationale: ‘எந்த உடல்’ என்பதைக் காட்டிலும், உடலின் வகை அல்லது தன்மை பற்றிய ποίῳ என்பதன் கேள்வித் தன்மையைத் துல்லியமாகப் பேணுகிறது.
- source_word: δὲ
  choice: '?'
  rationale: தமிழில் அடுத்த கேள்வியைத் தனி வினாவாக இணைப்பதன் மூலம் மென்மையான தொடர்ச்சி வெளிப்படுகிறது; தனியான இணைப்புச்சொல் தேவையில்லை.
- source_word: ἔρχονται
  choice: அவர்கள் வருகிறார்கள்
  rationale: ‘வருகிறார்கள்’ என்பது ἔρχονται என்பதன் உருவகத்தைப் பேணுகிறது; ‘தோன்றுகிறார்கள்’ அல்லது மீண்டும் ‘உயிர்த்தெழுகிறார்கள்’ என்று விளக்கமளித்து விடவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் குறித்த செயப்பாட்டு வடிவமும் செயலாண்மையும்
  choice: இறந்தவர்கள் எப்படி உயிர்த்தெழுப்பப்படுகிறார்கள்?
  alternative: இறந்தவர்கள் எப்படி உயிர்த்தெழுகிறார்கள்?
  rationale: ἐγείρονται என்பது செயப்பாட்டு வடிவம். அதை முதன்மை உரையில் பேணுவது, செய்பவர் யார் என்பதை வசனம் வெளிப்படையாகச் சொல்லாமலேயே தெய்வீக செயலாண்மையின் சாத்தியத்தைத் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ்ச் சாயலுள்ள பொதுநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதையும் தெளிவும் பேணப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறியீடு முழுக் கேள்வித் தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
