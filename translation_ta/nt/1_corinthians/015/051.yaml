  text: 'இதோ, நான் உங்களுக்கு ஒரு மறைஉண்மையைச் சொல்கிறேன்: நம்மில் அனைவரும் உறங்கிவிடப் போவதில்லை[a]; ஆனால் நாம் எல்லாரும் மாற்றப்படுவோம்[b].'
