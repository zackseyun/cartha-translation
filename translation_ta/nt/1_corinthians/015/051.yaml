- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்க உரையாடல் குறியைச் சுருக்கமாகவும் கண்ணியமாகவும் தக்கவைக்கிறது.
- source_word: μυστήριον
  choice: மறைஉண்மை
  rationale: வெறும் புரியாத புதிரை அல்ல, முன்பு மறைந்திருந்து இப்போது வெளிப்படுத்தப்படும் இறைஉண்மையைப் பவுலின் பயன்பாட்டுக்கு ஏற்றவாறு குறிக்கிறது.
- source_word: ὑμῖν λέγω
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியான அழைப்பையும் அறிவிப்பின் இயல்பான தமிழ்நடையையும் காக்கிறது.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: நாம் எல்லாரும் உறங்கிவிட மாட்டோம்
  rationale: οὐ என்பதன் மறுப்பு πάντες என்பதோடு சேர்ந்து ‘எல்லாரும் அல்ல’ என்ற பொருளைத் தருகிறது. உயிர்த்தெழுதலின் பின்னணியில் மரணத்தைக் குறிக்கும் ‘உறக்கம்’ என்ற உருவகத்தையும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: ஆனால் நாம் எல்லாரும் மாற்றப்படுவோம்
  rationale: ἀλλάσσω குறிக்கும் இறுதிக்கால உருமாற்றத்தை நேரடியாகச் சொல்கிறது; δέ இரு கூற்றுகளுக்கிடையிலான மாறுபாட்டைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: உயிர்த்தெழுதல் சூழலில் ‘உறங்குதல்’ என்பதன் பொருள்
  choice: உடல் மரணத்தைக் குறிக்கும் உருவகமாக ‘உறங்குதல்’ தக்கவைக்கப்பட்டது.
