- issue: வாக்கியத்தின் உரைவேறுபாடு
  choice: SBLGNT மூலவாசகத்தின்படி ‘நாம் எல்லாரும் உறங்கிவிட மாட்டோம்; ஆனால் நாம் எல்லாரும் மாற்றப்படுவோம்’ என முதன்மை உரையில் தரப்பட்டது.
  alternative: ‘நாம் எல்லாரும் உறங்கிவிடுவோம்; ஆனால் நாம் எல்லாரும் மாற்றப்பட மாட்டோம்’ என்ற பொருளைத் தரும் குறிப்பிடத்தக்க வேறுபட்ட வாசகம்.
  rationale: கொடுக்கப்பட்ட கிரேக்க மூலத்தை நேரடியாகப் பின்பற்றியபடியே, பொருளில் முக்கிய தாக்கம் ஏற்படுத்தும் கையெழுத்துப் பிரதிகளின் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
