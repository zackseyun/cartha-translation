  terminology: “திருமுழுக்கு” is an appropriate, broadly intelligible Tamil rendering for βάπτισμα/βαπτίζω in this register. “இறந்தவர்களின் சார்பாக” consistently renders the selected minimally interpretive sense of ὑπέρ, while the footnote responsibly preserves alternatives.
