theological_decisions:
- issue: ‘இறந்தவர்களின் சார்பாக’ பெறப்படும் திருமுழுக்கின் பொருள்
  choice: குறிப்பிட்ட வரலாற்று நடைமுறையையோ கோட்பாட்டையோ அங்கீகரிக்காமல், ‘இறந்தவர்களின் சார்பாகத் திருமுழுக்குப் பெறுகிறவர்கள்’ என்று குறைந்த விளக்கத்துடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இறந்தவர்களுக்காக,’ ‘இறந்தவர்களின் நிமித்தமாக,’ அல்லது ‘இறந்தவர்களின்மேல்’ திருமுழுக்குப் பெறுதல்
  rationale: இந்த வசனத்தின் துல்லியமான நடைமுறை உறுதியற்றதும் பலவாறு விளக்கப்பட்டதுமாகும். பவுல் அதை உயிர்த்தெழுதல் குறித்த தமது வாதத்தில் பயன்படுத்துகிறார்; மொழிபெயர்ப்பு எந்தச் சபை மரபின் விளக்கத்தையும் உரைக்குள் சேர்க்காமல் மூலத்தின் பதற்றத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புமிக்க நடையிலும் வடிவமைக்கப்பட்டது. βαπτίζω என்பதற்கு பரவலாகப் புரிந்துகொள்ளக்கூடிய ‘திருமுழுக்குப் பெறுதல்’ பயன்படுத்தப்பட்டது. கடினமான கிரேக்க வாக்கியத்தின் மீளுரையும் வாத வினாக்களும் முடிந்தவரை காக்கப்பட்டுள்ளன.
