  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: ta
  text: அப்படி இல்லையென்றால்[a], இறந்தவர்களின் சார்பாகத் திருமுழுக்கு பெறுகிறவர்கள் என்ன செய்வார்கள்? இறந்தவர்கள் அறவே உயிர்த்தெழுப்பப்படுவதில்லை என்றால், அவர்களின் சார்பாக அவர்கள் ஏன் திருமுழுக்கு பெறுகிறார்கள்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இறந்தவர்களுக்காக,’ ‘இறந்தவர்களின் நிமித்தமாக,’ அல்லது—இதற்கான வாய்ப்பு குறைவாக இருந்தாலும்—‘இறந்தவர்களின்மேல்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க முன்னிடைச்சொல்லை ஒன்றுக்கு மேற்பட்ட விதத்தில் புரிந்துகொள்ள முடியும்; பவுல் குறிப்பிடும் துல்லியமான நடைமுறை என்ன என்பதும் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: அப்படியில்லையென்றால்
  rationale: முந்தைய வாதத்திலிருந்து எழும் எதிர்விளைவை அறிமுகப்படுத்தும் சொல்லாக இங்கு வருகிறது; பவுலின் வாத மாற்றத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τί ποιήσουσιν
  choice: என்ன செய்வார்கள்
  rationale: ποιέω என்பதன் பரந்த பொருளையும், விடை குறிப்பிடப்படாத வினாவின் வலிமையையும் குறுக்காமல் காக்கிறது.
- source_word: οἱ βαπτιζόμενοι
  choice: திருமுழுக்குப் பெறுகிறவர்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தைத் தொடர்ந்து அல்லது வழக்கமாக நடைபெறும் செயலாகக் காட்டுகிறது; அந்த நடைமுறை சரியானதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: இறந்தவர்களின் சார்பாக
  rationale: ὑπέρ உடன் வரும் ஆறாம் வேற்றுமையின் இயல்பான பிரதிநிதித்துவப் பொருளைத் தருகிறது; பிற சாத்தியமான பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: εἰ ὅλως
  choice: … என்றால் … அறவே
  rationale: ὅλως தரும் வலியுறுத்தலை இயல்பான தமிழ் சொல் வரிசையில் ‘அறவே’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: இறந்தவர்கள் அறவே உயிர்த்தெழுப்பப்படுவதில்லை
  rationale: கிரேக்கத்தின் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, உயிர்த்தெழுதலை உண்டாக்கும் செய்பவரை உரை வெளிப்படையாகக் குறிப்பிடாத நிலையையும் காக்கிறது.
- source_word: τί καὶ
  choice: ஏன்
  rationale: இந்தத் தொடர்ச்சியான வாத வினாவில் τί καὶ என்பதன் இயல்பான கேள்வி வலிமையைத் தமிழில் தருகிறது; ‘அப்படியானால்’ என்ற தொடர்பு முன் நிபந்தனையால் ஏற்கெனவே தெளிவாகிறது.
