id: 1CO.15.41
reference: 1 Corinthians 15:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: ta
  text: சூரியனுடைய மகிமை வேறு[a], சந்திரனுடைய மகிமை வேறு, நட்சத்திரங்களுடைய மகிமை வேறு; ஏனெனில், மகிமையில் ஒரு நட்சத்திரம் மற்றொரு நட்சத்திரத்திலிருந்து வேறுபடுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனம் முழுவதிலும் ‘ஒளிச்சிறப்பு’ அல்லது ‘பிரகாசம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் δόξα இங்கு காணக்கூடிய ஒளிப்பொலிவைக் குறிக்கலாம்; ஆனால் சுற்றியுள்ள பவுலின் வாதத்தில் மீண்டும் வரும் சொல்லை ‘மகிமை’ பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: வேறு
  rationale: மீண்டும் மீண்டும் வரும் ἄλλη, சூரியன், சந்திரன், நட்சத்திரங்கள் ஆகியவற்றின் மகிமைகளுக்கிடையிலான வேறுபாட்டைக் குறிக்கிறது. தமிழில் இணையான அமைப்புடன் ‘வேறு’ என்று திரும்பக் கூறுவது இயல்பாகவும் வலியுறுத்தலுடனும் உள்ளது.
- source_word: δόξα
  choice: மகிமை
  rationale: இங்கு காணக்கூடிய ஒளிச்சிறப்பையும் பொலிவையும் குறித்தாலும், உயிர்த்தெழுதல் பற்றிய சுற்றியுள்ள வாதத்தில் பவுல் பயன்படுத்தும் முக்கியச் சொல்லுடனான தொடர்பை ‘மகிமை’ காக்கிறது.
- source_word: ἡλίου
  choice: சூரியனுடைய
  rationale: δόξα-வைச் சார்ந்த உரிமை வேற்றுமையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: σελήνης
  choice: சந்திரனுடைய
  rationale: சூரியனைப் பற்றிய முந்தைய சொற்றொடருக்கு இணையாக, δόξα-வைச் சார்ந்த உரிமை வேற்றுமையை வெளிப்படுத்துகிறது.
- source_word: ἀστέρων
  choice: நட்சத்திரங்களுடைய
  rationale: பன்மை உரிமை வேற்றுமையைப் பாதுகாத்து, சூரியன்–சந்திரன்–நட்சத்திரங்கள் என்ற மும்மையையும் நிறைவு செய்கிறது.
- source_word: ἀστὴρ ... ἀστέρος
  choice: ஒரு நட்சத்திரம் மற்றொரு நட்சத்திரத்திலிருந்து
  rationale: ஒரே வகைக்குள்ளும் வேறுபாடு இருப்பதைச் சொல்லும் ஒருமை-ஒருமை ஒப்பீட்டைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் γάρ-ன் பணியைத் தெளிவாகக் காட்டுகிறது.
- source_word: διαφέρει
  choice: வேறுபடுகிறது
  rationale: வேறுபாட்டைக் குறிக்கும் வினையின் பொருளைப் பாதுகாக்கிறது; ‘மேலானது’ என்று மொழிபெயர்த்து ஆதாரத்தில் வெளிப்படையாக இல்லாத உயர்வு-தாழ்வைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐν δόξῃ
  choice: மகிமையில்
  rationale: ஒரு நட்சத்திரம் மற்றொன்றிலிருந்து எந்த வகையில் வேறுபடுகிறது என்பதைச் சுட்டுகிறது; δόξα என்ற சொல்லின் திரும்பக் கூறுதலையும் காக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் பற்றிய வாதத்திலுள்ள விண்ணுலக ஒப்புமையில் δόξα-வை மொழிபெயர்த்தல்
  choice: மகிமை
  alternative: ஒளிச்சிறப்பு / பிரகாசம்
  rationale: உடனடிச் சூழலில் விண்பொருட்களின் காணக்கூடிய ஒளிச்சிறப்பு குறிக்கப்பட்டாலும், உயிர்த்தெழுந்த உடல்களைப் பற்றிய பரந்த வாதத்தில் உள்ள சொல்லியல் மற்றும் இறையியல் தொடர்பை ‘மகிமை’ காக்கிறது. அடிக்குறிப்பு இங்குள்ள காட்சிப்புலப் பொருள் நிழலைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூன்று இணையான சொற்றொடர்களின் மீளுருவாக்கம் கிரேக்கத்தின் சொல்லாட்சிச் சமநிலையைப் பாதுகாக்கிறது; இறுதி ஒப்பீடு தமிழில் தெளிவாக இருக்க ‘ஒரு ... மற்றொரு ...’ என்ற வடிவில் வழங்கப்பட்டுள்ளது.
