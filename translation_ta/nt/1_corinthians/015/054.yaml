id: 1CO.15.54
reference: 1 Corinthians 15:54
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: ta
  text: 'ஆனால் அழிவுக்குரிய இந்த உடல் அழியாமையை அணிந்துகொள்ளும்போதும், சாவுக்குரிய இந்த உடல் சாவாமையை அணிந்துகொள்ளும்போதும், அப்போது எழுதப்பட்டுள்ள வாக்கு[a] நடந்தேறும்[b]: “மரணம் வெற்றியில் விழுங்கப்பட்டது.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எழுதப்பட்டுள்ள கூற்று.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நிறைவேறும்.” கிரேக்க வினைச்சொல் இன்னும் நேரடியாக “நிகழும்” அல்லது “நடந்தேறும்” என்று பொருள்படும்.
    reason: alternative_reading
  - marker: c
    text: ஏசாயா 25:8-இலிருந்து மேற்கோள்; பவுல் மேற்கோளிடும் கிரேக்க மரபின் சொல்வடிவத்தை இது பிரதிபலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: அழிவுக்குரிய
  rationale: அழிந்து சிதையும் தற்போதைய உடலின் நிலையைக் குறிக்கிறது; எதிர்ச்சொல்லான ‘அழியாமை’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: ἐνδύσηται
  choice: அணிந்துகொள்ளும்
  rationale: பவுல் பயன்படுத்தும் ஆடை அணியும் உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது; நடுவினை வடிவின் நுணுக்கத்தையும் இயன்றவரை வெளிப்படுத்துகிறது.
- source_word: ἀφθαρσίαν
  choice: அழியாமை
  rationale: அழிவு அல்லது சிதைவுக்கு உட்படாத நிலையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: θνητὸν
  choice: சாவுக்குரிய
  rationale: சாவுக்கு உட்பட்ட தற்போதைய உடலைக் குறிக்கிறது; ‘சாவாமை’ என்பதோடு தெளிவான எதிரிணையை உருவாக்குகிறது.
- source_word: ἀθανασίαν
  choice: சாவாமை
  rationale: மரணமற்ற நிலையைக் குறிக்கும் நேரடியான, எளிதில் புரியும் தமிழ் வடிவம்.
- source_word: γενήσεται
  choice: நடந்தேறும்
  rationale: γίνομαι என்பதன் ‘நிகழும்/நடக்கும்’ பொருளைப் பாதுகாக்கிறது; மூலத்தில் நேரடியாக இல்லாத ‘நிறைவேறும்’ என்ற வேதவாக்கு-நிறைவேற்ற மொழியை முதன்மை உரையில் சேர்ப்பதில்லை.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: எழுதப்பட்டுள்ள வாக்கு
  rationale: எழுத்தில் பதிவு செய்யப்பட்ட மேற்கோளைக் குறிக்கிறது; λόγος என்பதற்கு ‘வாக்கு’ என்று நெருக்கமாகவும் தமிழில் கண்ணியமாகவும் மொழிபெயர்க்கிறது.
- source_word: Κατεπόθη
  choice: விழுங்கப்பட்டது
  rationale: செயப்பாட்டு வடிவத்தையும் முழுமையாக ஒழித்துவிடும் வலுவான உருவகத்தையும் பாதுகாக்கிறது; மறைமுகச் செய்பவரைத் தீர்மானிப்பதில்லை.
- source_word: εἰς νῖκος
  choice: வெற்றியில்
  rationale: νῖκος என்பதன் ‘வெற்றி’ என்ற பொருளைக் காத்து, மரணத்தின் முழுத் தோல்வியை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: γενήσεται என்பதை வேதமேற்கோளுடன் தொடர்புபடுத்தி மொழிபெயர்த்தல்
  choice: நடந்தேறும்
  alternative: நிறைவேறும்
  rationale: எழுதப்பட்ட வாக்கு உண்மையாகும் கருத்து சூழலில் இருந்தாலும், γίνομαι என்பதில் இல்லாத வலுவான ‘நிறைவேற்றம்’ என்ற தொழில்நுட்ப நுணுக்கத்தை முதன்மை உரையில் திணிக்காமல் இருக்கிறது.
- issue: Κατεπόθη என்ற இறந்தகால வினையின் எதிர்கால முடிவுக்காலச் சூழல்
  choice: விழுங்கப்பட்டது
  alternative: விழுங்கப்பட்டுவிட்டது
  rationale: மேற்கோளின் இறந்தகால செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, எதிர்காலத் தருணத்தில் மரணத்தின் தோல்வி நிறைவேறிய உண்மையாக அறிவிக்கப்படுவதையும் வாசகர் உணர இடமளிக்கிறது.
- issue: φθαρτόν மற்றும் θνητόν ஆகிய பெயரடைப் பெயர்ச்சொற்களின் குறிப்பு
  choice: ‘இந்த உடல்’ என்று வெளிப்படுத்தப்பட்டது
  alternative: ‘அழிவுக்குரிய இது’ மற்றும் ‘சாவுக்குரிய இது’
  rationale: உடனடியான சூழல் உடலின் உயிர்த்தெழுதலைப் பற்றியது; தமிழில் வெறும் ‘இது’ இயல்பற்றதாக இருப்பதால் மறைந்துள்ள குறிப்பைத் தெளிவாக்குகிறது, ஆனால் வேறு வகையான உடல் குறித்த கொள்கை விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘அழிவுக்குரிய/அழியாமை’ மற்றும் ‘சாவுக்குரிய/சாவாமை’ என்ற இணைகள் பவுலின் எதிர்மறை அமைப்பைப் பாதுகாக்கின்றன. ‘அணிந்துகொள்ளுதல்’ என்ற ஆடை உருவகமும், இறுதி மேற்கோளின் செயப்பாட்டு வடிவமும் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளன.
