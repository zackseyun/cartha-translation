  yaml_path: translation/nt/1_corinthians/015/008.yaml
  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: ta
  text: எல்லாரிலும் கடைசியாக, காலத்துக்கு ஒவ்வாதவாறு பிறந்தவனைப் போன்ற எனக்கும் அவர் தோன்றினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: ‘கருச்சிதைவைப் போன்ற’ அல்லது ‘கலைந்த கருவைப் போன்ற.’ பவுல் இங்கு தன்னைத் தாழ்த்திக் கூறும் கடுமையான ஓர் உருவகத்தைப் பயன்படுத்துகிறார்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον ... πάντων
  choice: எல்லாருக்கும் கடைசியாக
  rationale: ἔσχατον என்பது வினையடைப் பொருளில் வந்து, முன்பு குறிப்பிடப்பட்ட சாட்சிகளின் வரிசையில் பவுலுக்கு ஏற்பட்ட தோற்றம் கடைசியில் நிகழ்ந்ததைத் தெரிவிக்கிறது.
- source_word: δὲ
  choice: (தனி இணைப்புச்சொல் இடப்படவில்லை)
  rationale: தமிழில் முந்தைய பட்டியலின் தொடர்ச்சியைச் சொல் வரிசையே இயல்பாகக் காட்டுகிறது; ‘ஆனால்’ என்பது மூலத்தில் இல்லாத வலுவான முரண்பாட்டை உண்டாக்கும்.
- source_word: ὡσπερεὶ
  choice: போன்ற
  rationale: ஏறத்தாழ ஒப்பிடும் பொருளை இயல்பான தமிழில் தருகிறது; உருவகத்தை நேரடியான அடையாளக் கூற்றாக மாற்றவில்லை.
- source_word: τῷ ἐκτρώματι
  choice: காலந்தவறிப் பிறந்த ஒருவனை
  rationale: ἔκτρωμα என்பதன் இயல்பற்ற, தாழ்வுபடுத்தும் பிறப்பு உருவகத்தை வாசிக்கத்தக்க தமிழில் காக்கிறது. அதன் இன்னும் நேரடியான, கடுமையான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὤφθη
  choice: அவர் தோன்றினார்
  rationale: உயிர்த்தெழுந்த கிறிஸ்துவின் காட்சியளிப்பைக் குறிக்கும் இச்சூழலில் கிரேக்க இறந்தகாலச் செயப்பாட்டு வடிவத்தை இயல்பாகவும் தெளிவாகவும் எடுத்துரைக்கிறது.
- source_word: κἀμοί
  choice: எனக்கும்
  rationale: καί + ἐμοί என்பதன் சேர்க்கைப் பொருளைக் காத்து, பவுலையும் முந்தைய சாட்சிகளின் வரிசையில் இணைக்கிறது.
theological_decisions:
- issue: பவுலின் தன்னைத் தாழ்த்தும் ἐκτρώματι என்ற உருவகம்
  choice: முதன்மை உரையில் ‘காலந்தவறிப் பிறந்த ஒருவன்’ என்று வைத்து, நேரடியான பொருளை அடிக்குறிப்பில் தருதல்
  alternative: ‘கருச்சிதைந்த பிண்டம்’ அல்லது ‘கலைந்த கரு’
  rationale: உருவகத்தின் இயல்பற்ற தன்மையையும் தாழ்வுணர்வையும் காக்கிறது; அதேவேளையில் பவுலின் அப்போஸ்தலத்துவத்தைப் பற்றிய எந்த ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தையும் வசனத்துக்குள் புகுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. மூல உருவகத்தின் அதிர்ச்சியூட்டும் சொற்சார்ந்த வலிமை மறைக்கப்படாமல் அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
