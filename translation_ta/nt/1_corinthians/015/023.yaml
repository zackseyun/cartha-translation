id: 1CO.15.23
reference: 1 Corinthians 15:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: ta
  text: 'ஆனால் ஒவ்வொருவரும் தமக்குரிய வரிசையில் உயிர்த்தெழுவார்கள்: முதற்கனியாக மேசியா[a]; அதன் பிறகு, அவர் வருகையின்போது[b] மேசியாவுக்குரியவர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘கிறிஸ்து’. கிரேக்கப் பட்டமான Χριστός என்பதற்கு ‘அபிஷேகம் பெற்றவர்’ என்று பொருள்.
    reason: alternative_reading
  - marker: b
    text: ‘வருகை’ என்பதற்கான கிரேக்கச் சொல் παρουσία; இதை ‘உடனிருப்பு’ அல்லது ‘வந்தடைதல்’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் அது அவரது எதிர்கால வருகையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட உயிர்த்தெழுதலைச் சார்ந்து, ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் பகிர்வுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: தமக்குரிய வரிசையில்
  rationale: τάγμα என்பது ஒழுங்கமைந்த வரிசை அல்லது நிலையைச் சுட்டலாம்; இங்கு உயிர்த்தெழுதலின் நிகழ்வுமுறையைக் குறிப்பதால் ‘வரிசை’ பொருத்தமானது. ‘தமக்குரிய’ என்பது பாலினம் சுட்டாமல் இயல்பாக உள்ளது.
- source_word: ἀπαρχὴ
  choice: முதற்கனி
  rationale: அறுவடையின் முதல் பகுதியை இறைவனுக்குச் செலுத்தும் வேதாகமப் படிமத்தையும், பின்னர் வரவிருப்பவற்றுக்கான தொடக்கமும் உறுதியும் என்ற உட்பொருளையும் காக்கிறது.
- source_word: Χριστός
  choice: மேசியா
  rationale: இங்கு பெயரைப் போல அல்லாமல் ‘அபிஷேகம் பெற்றவர்’ என்ற பட்டப்பொருள் முன்னிலையில் இருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: οἱ τοῦ Χριστοῦ
  choice: மேசியாவுக்குரியவர்கள்
  rationale: உடைமை அல்லது சார்பை உணர்த்தும் இறைவேற்றுமையைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: παρουσίᾳ
  choice: வருகையின்போது
  rationale: இச்சூழலில் மேசியாவின் எதிர்கால வருகையைக் குறிக்கிறது; அதே நேரத்தில் கிரேக்கச் சொல்லின் ‘உடனிருப்பு/வந்தடைதல்’ சார்ந்த பரப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்பதைப் பட்டமாக மொழிபெயர்ப்பதா அல்லது வழக்கமான பெயர்வடிவமாக மொழிபெயர்ப்பதா
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: உயிர்த்தெழுதலின் வரிசையில் மேசியாவையும் அவருக்குரியவர்களையும் பவுல் வேறுபடுத்துவதால், அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருள் இங்கு தெளிவாக உள்ளது.
- issue: παρουσία என்பதற்கு தொழில்நுட்பமான இறுதிக்காலச் சொல்லைப் பயன்படுத்துவதா
  choice: வருகை
  alternative: உடனிருப்பு அல்லது வந்தடைதல்
  rationale: எதிர்கால நிகழ்வை இச்சூழல் சுட்டினாலும், அதற்கு மேலான குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டை உரைக்குள் சேர்க்காமல் பொதுவான ‘வருகை’ பயன்படுத்தப்பட்டது.
- issue: மூலத்தில் வெளிப்படையாக இல்லாத உயிர்த்தெழுதல் வினையைத் தமிழில் சேர்ப்பதா
  choice: உயிர்த்தெழுவார்கள்
  alternative: வினையில்லாத பட்டியலாக விடுதல்
  rationale: முந்தைய சூழலிலிருந்து வினை தெளிவாகப் பெறப்படுகிறது. தமிழில் முழுமையான, இயல்பான வாக்கியமாக அமைய இதை வெளிப்படுத்துவது பொருளை மாற்றாமல் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. வேளாண்-வழிபாட்டு உருவகத்தைப் பாதுகாக்க ‘முதற்கனி’ வைக்கப்பட்டுள்ளது; ‘உயிர்த்தெழுவார்கள்’ என்பது முந்தைய வசனத்தின் தெளிவான சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
