review_pass:
  verdict: revise
  source_fidelity: The passive-present sequence and the two balanced contrasts are retained. However, “அவமதிப்புக்குரிய நிலையில்” means ‘in a state deserving contempt’ and adds a nuance not expressed by ἀτιμίᾳ (‘dishonor’).
  naturalness: The concise parallel clauses are natural in modern standard Tamil. “இழிவில்” is more direct and idiomatic here than the longer circumlocution.
  terminology: “மகிமையில்,” “பலவீனத்தில்,” “வல்லமையில்,” and the passive “எழுப்பப்படுகிறது” appropriately preserve the source terminology, contrast, and unstated agency. “இழிவில்” better represents ἀτιμίᾳ without suggesting that the body merits contempt.
  issues:
  - severity: medium
    issue: “அவமதிப்புக்குரிய நிலையில்” over-specifies ἀτιμίᾳ.
    rationale: The Tamil expression denotes being worthy of contempt, whereas the Greek denotes the condition of dishonor. The added ‘deserving’ sense should not be introduced.
  revised_text: இழிவில் விதைக்கப்படுகிறது; மகிமையில் எழுப்பப்படுகிறது. பலவீனத்தில் விதைக்கப்படுகிறது; வல்லமையில் எழுப்பப்படுகிறது.
