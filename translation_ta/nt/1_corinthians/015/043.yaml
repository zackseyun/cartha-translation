id: 1CO.15.43
reference: 1 Corinthians 15:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: ta
  text: இழிவில் விதைக்கப்படுகிறது; மகிமையில் எழுப்பப்படுகிறது. பலவீனத்தில் விதைக்கப்படுகிறது; வல்லமையில் எழுப்பப்படுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: விதைக்கப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, சுற்றியுள்ள விதை–உடல் உருவகத்தையும் பாதுகாக்கிறது. தமிழில் மறைமுக எழுவாயைச் சேர்க்காமலேயே முந்தைய சூழலிலுள்ள உடலைக் குறிக்க முடிகிறது.
- source_word: ἀτιμίᾳ
  choice: அவமதிப்புக்குரிய நிலையில்
  rationale: δόξῃ என்பதுடனான எதிர்மறை இணைப்பைப் பாதுகாக்கிறது; வெறும் உள்ளார்ந்த வெட்கம் என்று பொருளைக் குறுக்காமல், மதிப்பும் மாண்பும் அற்ற நிலையைக் குறிக்கிறது.
- source_word: ἐγείρεται
  choice: எழுப்பப்படுகிறது
  rationale: உயிர்த்தெழுதல் சூழலில் ἐγείρω என்பதற்குரிய இயல்பான பொருளைத் தருகிறது. செயப்பாட்டு வடிவம் காக்கப்படுவதால், மறைமுகமான இறைச் செயலாற்றல் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: δόξῃ
  choice: மகிமையில்
  rationale: உயிர்த்தெழுதல் சூழலில் சொல்லின் விரிவான இறையியல் நிறையையும், ἀτιμίᾳ என்பதுடனான எதிரிணையையும் தக்கவைக்கிறது.
- source_word: ἀσθενείᾳ
  choice: பலவீனத்தில்
  rationale: உடலின் நிலையின்மையையும் இயலாமையையும் உள்ளடக்கக்கூடிய நேரடியான சொல்; δυνάμει என்பதுடனான முரணையும் தெளிவாகக் காட்டுகிறது.
- source_word: δυνάμει
  choice: வல்லமையில்
  rationale: வெறும் உடல் வலிமையைவிட விரிவான ஆற்றலைக் குறித்து, பவுலின் பயன்பாட்டுக்கேற்றவாறு உயிர்த்தெழுந்த வாழ்வின் ஆற்றலையும் உள்ளடக்குகிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் மொழியில் வினைவகையும் செயலாற்றுபவரும்
  choice: “எழுப்பப்படுகிறது” என்ற செயப்பாட்டு வடிவத்தைப் பயன்படுத்தி, செயலாற்றுபவராகிய கடவுளை முதன்மை உரையில் வெளிப்படையாகப் பெயரிடவில்லை.
  alternative: “கடவுள் எழுப்புகிறார்”
  rationale: கிரேக்க மூலத்தில் செயப்பாட்டு வினை உள்ளது. அதைப் பாதுகாப்பது பவுல் கூறாத விளக்கத்தை உரைக்குள் சேர்க்காமல், மறைமுகமான இறைச் செயலாற்றலை மறைமுகமாகவே வைக்கிறது.
- issue: மறைமுக எழுவாயின் குறிப்பு
  choice: தமிழில் எழுவாயை மீண்டும் குறிப்பிடாமல், உடனடியான சூழலிலுள்ள உடலையே மறைமுக எழுவாயாக விட்டுள்ளது.
  alternative: “உடல் விதைக்கப்படுகிறது… உடல் எழுப்பப்படுகிறது”
  rationale: கிரேக்கத்தில் எழுவாய் வெளிப்படையாக மீண்டும் கூறப்படவில்லை. தமிழிலும் சூழலிலிருந்து அதை இயல்பாகப் புரிந்துகொள்ள முடிவதால், தேவையற்ற விரிவாக்கம் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமப் பாங்கும் கொண்ட சுருக்கமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் இரு இணையான எதிர்மறை வாக்கிய அமைப்புகளும், செயப்பாட்டு வினைகளும், நிகழ்கால வடிவங்களும் பாதுகாக்கப்பட்டுள்ளன.
