id: 1CO.15.27
reference: 1 Corinthians 15:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: ta
  text: ஏனெனில், “அனைத்தையும் அவருடைய கால்களுக்குக் கீழ்ப்படுத்தினார்.” ஆனால், “அனைத்தும் கீழ்ப்படுத்தப்பட்டுள்ளன” என்று சொல்லும்போது, அனைத்தையும் அவருக்குக் கீழ்ப்படுத்தியவர் அதில் அடங்கவில்லை என்பது தெளிவு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அனைத்தையும் அவருக்குக் கீழ்ப்படுத்தியவரைத் தவிர” என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: அனைத்தையும் / அனைத்தும்
  rationale: இவை குறிப்பாக எல்லா மனிதர்களையும் மட்டுமல்லாமல் படைக்கப்பட்ட அனைத்தையும் விரிவாகக் குறிக்கும் நடுநிலைப் பன்மை வடிவங்கள். சங்கீதம் 8-ன் எதிரொலியையும் இந்தத் தேர்வு காக்கிறது.
- source_word: ὑπέταξεν
  choice: கீழ்ப்படுத்தினார்
  rationale: ஒருவரின் அதிகாரத்தின்கீழ் கொண்டுவருதல் என்ற வினையின் வலிமையை இயல்பான தமிழில் தருகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத எழுவாயை மொழிபெயர்ப்பிலும் பெயரிட்டுச் சேர்க்கவில்லை.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: அவருடைய கால்களுக்குக் கீழ்
  rationale: ஆட்சி மற்றும் அடக்கத்தைக் குறிக்கும் வேதாகம உருவகத்தை நேரடியாகக் காத்து, சங்கீத மேற்கோளுடனான தொடர்பைத் தக்கவைக்கிறது.
- source_word: ὅταν δὲ εἴπῃ
  choice: ஆனால் … என்று சொல்லும்போது
  rationale: கிரேக்க வாக்கியத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. தமிழிலும் அதை ‘அவர்’ அல்லது ‘வேதவாக்கியம்’ என்று தீர்மானிக்காமல் இயல்பாக விடுகிறது.
- source_word: ὑποτέτακται
  choice: கீழ்ப்படுத்தப்பட்டுள்ளன
  rationale: முடிந்த செயலும் அதன் தொடரும் விளைவு நிலையுமாகிய கிரேக்க நிறைவுக்காலப் பொருளையும், செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: δῆλον
  choice: தெளிவு
  rationale: வாசகர் உணரவேண்டிய தர்க்கரீதியான முடிவை எளிய, நேர்த்தியான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: அனைத்தையும் அவருக்குக் கீழ்ப்படுத்தியவர் அதில் அடங்கவில்லை
  rationale: ἐκτός குறிக்கும் விதிவிலக்கை இயல்பான தமிழில் தெளிவுபடுத்துகிறது; கீழ்ப்படுத்தியவர் ‘அனைத்தும்’ என்பதில் சேர்க்கப்படவில்லை என்ற தர்க்கத்தைப் பாதுகாக்கிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: அனைத்தும் யாருக்குக் கீழ்ப்படுத்தப்பட்டனவோ அவரைக் குறிக்கும் வேற்றுமைப் பொருளை நேரடியாகத் தருகிறது; சூழலில் இவர் மகன்/மேசியா.
theological_decisions:
- issue: மகனுக்கும் அனைத்தையும் கீழ்ப்படுத்தியவருக்கும் இடையிலான உறவு
  choice: அனைத்தையும் மகனுக்குக் கீழ்ப்படுத்தியவர், ‘அனைத்தும்’ என்பதில் அடங்கவில்லை என்று வசனம் வெளிப்படையாகக் கூறுகிறது.
  alternative: “அனைத்தையும் அவருக்குக் கீழ்ப்படுத்தியவரைத் தவிர” என்று சுருக்கமாக மொழிபெயர்த்தல்.
  rationale: உரை கூறும் விதிவிலக்கையும் இருவருக்கிடையிலான வேறுபாட்டையும் காக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம மேற்கோளின் உருவகமும் காக்கப்பட்டுள்ளன. ‘சொல்லும்போது’ என்பதில் கிரேக்கத்தில் வெளிப்படையாக இல்லாத எழுவாய் தீர்மானிக்கப்படாமல் விடப்பட்டுள்ளது; ‘அடங்கவில்லை’ என்பது விதிவிலக்கின் தர்க்கத்தை வாசிக்க எளிதாக்குகிறது.
