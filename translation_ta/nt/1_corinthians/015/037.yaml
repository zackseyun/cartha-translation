id: 1CO.15.37
reference: 1 Corinthians 15:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: ta
  text: நீ விதைப்பதோ, உருவாகவிருக்கும் உடலை நீ விதைப்பதில்லை; மாறாக, ஒருவேளை கோதுமையினுடையதோ அல்லது வேறு ஏதாவது ஒன்றினுடையதோ ஆன வெறும் விதைமணியைத்தான் விதைக்கிறாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεις
  choice: விதைக்கிறாய்
  rationale: வேளாண்மைச் செயலை நேரடியாகக் குறிக்கும் சொல்; உயிர்த்தெழுதல் குறித்த பவுலின் விதை உருவகத்தையும் தெளிவாகப் பேணுகிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: இப்பகுதியின் உயிர்த்தெழுதல் விவாதத்தில் முக்கியமான பவுலின் சொல்லாட்சியைத் தளர்த்தாமல் நேரடியாகக் கொடுக்கிறது.
- source_word: τὸ γενησόμενον
  choice: உருவாகப்போகும்
  rationale: இனி இருப்புக்கு வரவிருப்பதைச் சுட்டுகிறது; வெறுமனே தாவர வளர்ச்சியாகக் குறுக்காமல் எதிர்கால நோக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γυμνὸν κόκκον
  choice: வெறும் விதைமணி
  rationale: γυμνὸν என்பதன் அலங்காரமற்ற, இன்னும் எதிர்கால உடலைப் பெறாத நிலையை ‘வெறும்’ என்பதும், κόκκον என்பதன் தனித்த விதை அல்லது தானிய மணி உணர்வை ‘விதைமணி’ என்பதும் சேர்ந்து தெரிவிக்கின்றன.
- source_word: εἰ τύχοι
  choice: …யோ …யோ
  rationale: இங்கு இது கடுமையான நிபந்தனையைக் காட்டாமல் சாத்தியமான உதாரணங்களை அறிமுகப்படுத்துகிறது; தமிழின் மாற்றுத் தேர்வு அமைப்பு அந்தச் சார்பின்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σίτου
  choice: கோதுமை
  rationale: சூழலில் பொதுவான தானியத்தைக் காட்டிலும் குறிப்பாகக் கோதுமையைச் சுட்டுவது இயல்பானது.
- source_word: τινος τῶν λοιπῶν
  choice: வேறு ஏதாவது ஒரு வகை
  rationale: ‘மீதியுள்ளவற்றில் ஏதாவது ஒன்று’ என்ற கிரேக்கப் பொருளைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: விதைக்கும் விதைக்கும் உயிர்த்தெழுந்த உடலுக்கும் இடையிலான தொடர்பு
  choice: ‘உடல்’ என்ற சொல்லையும் அது இனி உருவாகும் என்ற எதிர்கால நோக்கையும் பேணி, உருவகத்தை அதற்கு மேல் விளக்கவில்லை.
  alternative: ‘பின்னர் வளரும் செடி’ என்று முழுவதும் தாவரவியல் மொழியில் மாற்றிக் கூறுதல்.
  rationale: வசனம் தொடர்ச்சியையும் மாற்றத்தையும் உள்ளடக்கும் விதை உருவகத்தைப் பயன்படுத்துகிறது. மொழிபெயர்ப்பு σῶμα என்பதை ‘உடல்’ என்றே வைத்திருப்பதால் உயிர்த்தெழுதல் விவாதத்துடனான தொடர்பு காக்கப்படுகிறது; ஆனால் வசனம் கூறாத கோட்பாட்டு விவரங்கள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘வெறும் விதைமணி’ என்பது இயல்புத்தன்மையையும் மூலத்தின் γυμνὸν κόκκον என்ற உருவகத் துல்லியத்தையும் சமநிலைப்படுத்துகிறது.
