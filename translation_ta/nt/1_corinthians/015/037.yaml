review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the central contrast accurately: what is sown is not the future body but a bare seed. However, the rendering of εἰ τύχοι as a simple either/or construction does not clearly express its contingent, illustrative force (“perhaps” / “it may be”).'
  naturalness: The sentence is generally understandable, but “கோதுமையோ வேறு ஏதாவது ஒரு வகையோ சேர்ந்த” is syntactically awkward as a modifier of “விதைமணி.” A finite, parallel construction is clearer and more natural in modern standard Tamil.
  terminology: “உடல்,” “விதைக்கிறாய்,” “கோதுமை,” and “வெறும் விதைமணி” are suitable and preserve the resurrection-related vocabulary and agricultural imagery. “உருவாகவிருக்கும்” provides a more idiomatic future-oriented expression than the draft’s more colloquial “உருவாகப்போகும்.”
  issues:
  - severity: medium
    issue: The contingent force of εἰ τύχοι is not explicit.
    rationale: The Greek introduces wheat or another kind as a possible example, not merely as two alternatives. “ஒருவேளை” preserves this nuance without turning the phrase into a strict condition.
  - severity: low
    issue: The final seed phrase is awkwardly constructed in Tamil.
    rationale: “வேறு ஏதாவது ஒரு வகையோ சேர்ந்த” is less natural and can momentarily obscure what is being qualified. Recasting it with “கோதுமையினுடையதோ ... ஒன்றினுடையதோ ஆன” makes the relationship clear while retaining the Greek’s open-ended reference to another kind.
  revised_text: நீ விதைப்பதோ, உருவாகவிருக்கும் உடலை நீ விதைப்பதில்லை; மாறாக, ஒருவேளை கோதுமையினுடையதோ அல்லது வேறு ஏதாவது ஒன்றினுடையதோ ஆன வெறும் விதைமணியைத்தான் விதைக்கிறாய்.
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek word order and contrast as far as natural Tamil permits, retains σῶμα as “உடல்,” renders γυμνὸν κόκκον as “வெறும் விதைமணி,” and explicitly represents εἰ τύχοι with “ஒருவேளை.” It does not add an interpretation of the seed metaphor or the resurrection body.
