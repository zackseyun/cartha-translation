revisions:
- from: நீ விதைப்பது, உருவாகப்போகும் உடலை அல்ல; கோதுமையோ வேறு ஏதாவது ஒரு வகையோ சேர்ந்த வெறும் விதைமணியைத்தான் விதைக்கிறாய்.
  to: நீ விதைப்பதோ, உருவாகவிருக்கும் உடலை நீ விதைப்பதில்லை; மாறாக, ஒருவேளை கோதுமையினுடையதோ அல்லது வேறு ஏதாவது ஒன்றினுடையதோ ஆன வெறும் விதைமணியைத்தான் விதைக்கிறாய்.
  rationale: The revision preserves the Greek word order and contrast as far as natural Tamil permits, retains σῶμα as “உடல்,” renders γυμνὸν κόκκον as “வெறும் விதைமணி,” and explicitly represents εἰ τύχοι with “ஒருவேளை.” It does not add an interpretation of the seed metaphor or the resurrection body.
