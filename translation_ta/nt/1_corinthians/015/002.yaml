reference: 1 Corinthians 15:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: ta
  text: அதன் மூலமாகவே நீங்கள் இரட்சிக்கப்படுகிறீர்கள்[a], நான் உங்களுக்கு நற்செய்தியாக அறிவித்த செய்தியை நீங்கள் உறுதியாகப் பற்றிக்கொண்டிருந்தால்—நீங்கள் வீணாக நம்பியிருந்தாலொழிய[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் மூலமாகவே நீங்கள் இரட்சிக்கப்பட்டு வருகிறீர்கள்.” கிரேக்க நிகழ்காலத்தைத் தொடரும் நிகழ்வாகவோ பொதுவான நிகழ்காலமாகவோ மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “நான் உங்களுக்கு எந்தச் செய்தியில்/எந்தச் செய்தியால் நற்செய்தி அறிவித்தேனோ, அதைப் பற்றிக்கொண்டிருந்தால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: அதன் மூலமாகவே
  rationale: διά + genitive இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கிறது; முந்தைய வசனத்தில் கூறப்பட்ட நற்செய்தியைச் சுட்டும் தொடர்பையும் ‘அதன்’ தெளிவாகத் தக்கவைக்கிறது. καί என்பதன் வலியுறுத்தலை ‘வே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σῴζεσθε
  choice: மீட்கப்பட்டு வருகிறீர்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் தொடரும் அம்சத்தை இயல்பான தமிழில் காட்டுகிறது; இரட்சிப்பு குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிக்கவில்லை.
- source_word: τίνι λόγῳ
  choice: நான் உங்களுக்கு நற்செய்தியாக அறிவித்த செய்தியை
  rationale: λόγος இச்சூழலில் அறிவிக்கப்பட்ட செய்தியின் உள்ளடக்கத்தைக் குறிக்கிறது. தமிழில் நிபந்தனை வாக்கியத்துடன் இயல்பாக இணையும்படி சுட்டுப் பொருள் வெளிப்படையாக அமைக்கப்பட்டுள்ளது.
- source_word: εὐηγγελισάμην
  choice: நற்செய்தியாக அறிவித்த
  rationale: வினைச்சொல்லில் உள்ள ‘நல்ல செய்தியை அறிவித்தல்’ என்ற பொருளை வெளிப்படையாகக் காக்கிறது.
- source_word: κατέχετε
  choice: உறுதியாகப் பற்றிக்கொண்டிருந்தால்
  rationale: தொடர்ந்து பற்றியிருத்தல் அல்லது காத்துக்கொள்ளுதல் என்ற பொருளையும் நிபந்தனைத் தன்மையையும் பாதுகாக்கிறது.
- source_word: ἐκτὸς εἰ μὴ
  choice: இல்லையென்றால்
  rationale: முந்தைய நிபந்தனை நிறைவேறாத விதிவிலக்கை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: εἰκῇ
  choice: வீணாக
  rationale: பலனற்ற, பயனில்லாத நம்பிக்கை என்ற எச்சரிக்கையைச் சுருக்கமாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐπιστεύσατε
  choice: நீங்கள் நம்பினீர்கள்
  rationale: அவர்கள் நற்செய்தியை ஏற்றபோது நிகழ்ந்த நம்பும் செயலை எளிய இறந்தகாலத்தில் தருகிறது.
theological_decisions:
- issue: σῴζεσθε என்பதிலுள்ள இரட்சிப்பின் கால அம்சம்
  choice: தொடரும் நிகழ்வாக ‘மீட்கப்பட்டு வருகிறீர்கள்’
  alternative: பொதுவான நிகழ்காலமாக ‘மீட்கப்படுகிறீர்கள்’
  rationale: கிரேக்க நிகழ்காலச் செயப்பாட்டு வடிவத்தின் தொடரும் சாத்தியத்தைத் தமிழில் காக்கிறது; இரட்சிப்பு முற்றிலும் முடிந்ததா அல்லது தொடர்கிறதா என்ற விரிவான கோட்பாட்டு விவாதத்தை மொழிபெயர்ப்பு தீர்த்துவைக்கவில்லை.
- issue: εἰ κατέχετε என்ற நிபந்தனை
  choice: உண்மையான நிபந்தனையாக ‘உறுதியாகப் பற்றிக்கொண்டிருந்தால்’
  alternative: உண்மையான விசுவாசத்திற்கான சான்றாகவோ, நிறைவேறியதாகக் கருதப்படும் சொல்லாட்சியாகவோ விளக்குதல்
  rationale: பவுல் கூறும் நிபந்தனையை அப்படியே வைத்திருக்கிறது; நிலைத்திருத்தல் அல்லது இரட்சிப்பின் உறுதி பற்றிய எந்தப் பிரிவுசார் விளக்கத்தையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்குரிய செறிவும் காக்கப்பட்டுள்ளன. ‘மீட்கப்பட்டு வருகிறீர்கள்’ என்பது தொடரும் அம்சத்தை இயல்பாகக் காட்டுகிறது; ‘நற்செய்தியாக அறிவித்த செய்தி’ என்பது εὐαγγελίζομαι மற்றும் λόγος இரண்டின் வேறுபாட்டையும் தெளிவாக வைத்திருக்கிறது.
