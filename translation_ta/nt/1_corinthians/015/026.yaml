translation:
  language: ta
  text: ஒழிக்கப்படும் கடைசி எதிரி மரணம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழிக்கப்படும் கடைசி எதிரி மரணம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατος
  choice: கடைசி
  rationale: ஒரு வரிசையில் இறுதியாக இருப்பதை இயல்பாகக் குறிக்கிறது; பவுல் விவரிக்கும் முடிவுக்கால நிகழ்வுகளின் வரிசையையும் காக்கிறது.
- source_word: ἐχθρὸς
  choice: எதிரி
  rationale: பகைமை கொண்ட ஆற்றலைக் குறிக்கிறது; மரணத்தை எதிரியாக உருவகப்படுத்தும் கிரேக்கச் சொல்லாட்சியைத் தெளிவாகப் பேணுகிறது.
- source_word: καταργεῖται
  choice: ஒழிக்கப்படும்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவம் சூழலில் உறுதியான எதிர்கால நிகழ்வைச் சுட்டுகிறது. ‘ஒழிக்கப்படும்’ என்பது முடிவுக்குக் கொண்டுவரப்படுதல் அல்லது வல்லமை இழக்கச் செய்யப்படுதல் என்ற பொருள் வரம்பைப் பேணுகிறது; குறிப்பிட்ட ஒரு மெய்யியல் விளக்கத்தைத் திணிப்பதில்லை.
- source_word: ὁ θάνατος
  choice: மரணம்
  rationale: குறிப்பிட்டதும் உருவகப்படுத்தப்பட்டதுமான இறுதி எதிரியைச் சுட்டுகிறது; தமிழில் ‘மரணம்’ என்பதே இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: மரணத்தின் தோல்வியைக் குறிக்கும் καταργεῖται என்பதன் மொழிபெயர்ப்பு
  choice: ஒழிக்கப்படும்
  alternative: அழிக்கப்படும்
  rationale: இச்சொல் மரணம் எதிரியாக முடிவுக்குக் கொண்டுவரப்படுவதையோ செயலற்றதாக்கப்படுவதையோ குறிக்கிறது. ‘ஒழிக்கப்படும்’ இந்தப் பொருள் விரிவைத் தக்கவைக்கிறது; மரணத்தின் முடிவைப் பற்றிய தேவையற்ற மெய்யியல் வரையறையைச் சேர்ப்பதில்லை. பாரம்பரியமும் செல்லத்தக்கதுமான ‘அழிக்கப்படும்’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் வலியுறுத்தலையும் மரணம் ஓர் எதிரியாக உருவகப்படுத்தப்படுவதையும் காக்கிறது.
