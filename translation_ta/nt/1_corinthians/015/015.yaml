source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: ta
  text: அப்படியானால், நாங்களும் கடவுளைப் பற்றிப் பொய்சாட்சி சொன்னவர்களாகக் காணப்படுகிறோம்[a]. ஏனெனில், கடவுள் மெசியாவை[b] உயிர்த்தெழுப்பினார் என்று நாங்கள் கடவுளுக்கு எதிராகச் சாட்சி சொன்னோம்; இறந்தவர்கள் உயிர்த்தெழுப்பப்படுவதில்லை என்றால், அவர் மெசியாவை உயிர்த்தெழுப்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுளைப் பற்றிப் பொய்சாட்சி சொன்னவர்கள்’ என்பதற்கான கிரேக்கத் தொடரை ‘கடவுளுக்கு எதிராகப் பொய்சாட்சி சொன்னவர்கள்’ என்றும் புரிந்துகொள்ளலாம். அடுத்து வரும் ‘கடவுளுக்கு எதிராக’ என்ற தொடர் அந்த வலுவான நுண்ணுணர்வை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘கிறிஸ்து’; இங்கு அது பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: காணப்படுவோம்
  rationale: ஒருவர் எத்தகையவர் என்று நிரூபிக்கப்படுவதைக் குறிக்கும் கிரேக்கச் செயலப்பாட்டு வடிவத்தை இயல்பான தமிழில் தருகிறது; வாதத்தின் நிபந்தனை விளைவுக்கேற்ப எதிர்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: δὲ καὶ
  choice: அப்படியானால் ... வும்
  rationale: முந்தைய கூற்றிலிருந்து வரும் தர்க்க விளைவையும், அதனுடன் சேரும் மேலும் கடுமையான முடிவையும் வெளிப்படுத்துகிறது.
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: கடவுளைப் பற்றிப் பொய்சாட்சி சொன்னவர்கள்
  rationale: τοῦ θεοῦ என்பதை சாட்சியின் பொருளாகப் புரிந்துகொள்கிறது. தமிழில் ‘கடவுளின் பொய்சாட்சிகள்’ என்பது கடவுளுக்குச் சொந்தமான சாட்சிகள் என்ற தவறான பொருளைத் தரக்கூடும் என்பதால் தெளிவாக்கப்பட்டுள்ளது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐμαρτυρήσαμεν
  choice: சாட்சி சொன்னோம்
  rationale: ஏற்கெனவே அளிக்கப்பட்ட அப்போஸ்தலச் சாட்சியைச் சுட்டுவதோடு, நீதிமன்றச் சாட்சியின் நுண்ணுணர்வையும் காக்கிறது.
- source_word: κατὰ τοῦ θεοῦ
  choice: கடவுளுக்கு எதிராகச்
  rationale: κατά + genitive என்பதன் வழக்கமான ‘எதிராக’ என்ற வலுவான பொருளைத் தக்கவைக்கிறது. உயிர்த்தெழுதல் இல்லை என்ற கருதுகோளின்படி, கடவுள் செய்யாத செயலை அவருக்குச் சுமத்துவது அவருக்கு எதிரான சாட்சியாகும்.
- source_word: ἤγειρεν
  choice: உயிர்த்தெழுப்பினார்
  rationale: இங்கு கடவுள் மெசியாவை மரணத்திலிருந்து எழுப்பிய செயலைக் குறிக்கும் இறந்தகால வினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὸν Χριστόν
  choice: மெசியா
  rationale: கட்டுரையுடன் வரும் Χριστός இச்சூழலில் பெயரைப்போல அல்லாமல் பட்டமாகச் செயல்படுகிறது; எனவே அதன் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப் பொருளைச் சுமக்கும் ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὃν οὐκ ἤγειρεν
  choice: அவர் உயிர்த்தெழுப்பாத மெசியாவை
  rationale: முந்தைய ‘உயிர்த்தெழுப்பினார்’ என்ற வினையுடன் உள்ள சொல்லாட்சித் தொடர்பையும் எதிர்மறை வாதத்தின் கூர்மையையும் காக்கிறது.
- source_word: εἴπερ ἄρα
  choice: என்பது உண்மையானால்
  rationale: வாதத்திற்காக முன்வைக்கப்படும் நிபந்தனை உண்மையென்றால் ஏற்படும் விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: இறந்தவர்கள் உயிர்த்தெழுப்பப்படுவதில்லை
  rationale: இறந்தவர்கள் பொதுவாகக் குறிக்கப்படுகின்றனர்; செயலப்பாட்டு வடிவம் உயிர்த்தெழுதல் அவர்கள்மீது நிகழ்த்தப்படும் செயல் என்ற கிரேக்க வடிவத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் பட்டப் பொருள்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: பவுலின் உயிர்த்தெழுதல் வாதத்தில் இச்சொல் பட்டமாகச் செயல்படுவதால் பொருளை மொழிபெயர்க்கும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது; பழக்கமான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: κατὰ τοῦ θεοῦ என்பதன் வலிமை
  choice: கடவுளுக்கு எதிராக
  alternative: கடவுளைப் பற்றி
  rationale: κατά உடன் genitive வரும்போது இயல்பாக வரும் எதிர்நிலைப் பொருளையும், கடவுள் செய்யாததைச் செய்தார் என்று கூறுவதன் கடுமையையும் முதன்மை வாசகம் காக்கிறது. ‘பற்றி’ என்ற சாத்தியம் முற்றிலும் மறைக்கப்படாமல் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- issue: ψευδομάρτυρες τοῦ θεοῦ என்ற genitive உறவு
  choice: கடவுளைப் பற்றிப் பொய்சாட்சி சொன்னவர்கள்
  alternative: கடவுளுக்கு எதிராகப் பொய்சாட்சி சொன்னவர்கள்
  rationale: முதல் தொடர் சாட்சியின் பொருளைச் சுட்டுவதாக எடுத்துக்கொள்ளப்பட்டுள்ளது; அடுத்துள்ள κατὰ τοῦ θεοῦ அதன் எதிர்நிலைத் தீவிரத்தை வெளிப்படுத்துகிறது. கிரேக்கத் தொடரின் சாத்தியமான இரு நுண்ணுணர்வுகளும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வாதத்தின் தீவிரமும் காக்கப்பட்டுள்ளன. ‘உயிர்த்தெழுப்பப்படுதல்’ என்ற செயலப்பாட்டு வடிவம் சற்றே முறையானதாயினும், மூலத்தின் இறையியல் மற்றும் இலக்கண அழுத்தத்தைத் தக்கவைக்கிறது. ‘சாட்சி சொன்னோம்’ என்பது ordinary modern Tamil usage while retaining forensic force.
