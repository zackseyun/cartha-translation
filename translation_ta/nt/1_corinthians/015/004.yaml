lexical_decisions:
- source_word: ἐτάφη
  choice: அடக்கம் செய்யப்பட்டார்
  rationale: θάπτω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தை இயல்பான நவீனத் தமிழில் தருகிறது; கல்லறை அல்லது அடக்க முறையை மூலத்தில் இல்லாத அளவுக்கு குறிப்பாக்கவில்லை.
- source_word: ἐγήγερται
  choice: உயிருடன் எழுப்பப்பட்டிருக்கிறார்
  rationale: ἐγείρω என்பதன் நிறைவுநிலைச் செயப்பாட்டு வடிவத்தைப் பேணுகிறது. நிகழ்ந்து முடிந்த உயிர்த்தெழுப்புதலையும் அதன் தொடரும் நிலையையும் ‘எழுப்பப்பட்டிருக்கிறார்’ வெளிப்படுத்துகிறது; இச்சூழலில் உயிர்த்தெழுதல் குறிக்கப்படுவதை ‘உயிருடன்’ தெளிவாக்குகிறது.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்க வேற்றுமை வடிவத்தின் நேரடியான, இயல்பான தமிழ் இணை; மூலத்தில் இல்லாத ‘பிறகு’ என்பதைச் சேர்க்கவில்லை.
- source_word: κατὰ τὰς γραφάς
  choice: வேதவாக்குகளின்படி
  rationale: அங்கீகரிக்கப்பட்ட புனித எழுத்துகளின் சாட்சியோடு ஒத்திசைவு அல்லது நிறைவேற்றத்தைக் குறிக்கும் பவுலின் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὅτι
  choice: என்றும்
  rationale: அறிக்கைத் தொடரின் ஒவ்வொரு உள்ளடக்கக் கூறையும் இணைக்கும் ὅτι-யின் மீளுருவாக்கத்தையும் அறிக்கையிடும் ஓசையையும் தமிழில் பேணுகிறது.
- source_word: καὶ
  choice: அவர் … என்றும்
  rationale: இணைப்புச் சொல்லான καὶ-யின் தொடர்ச்சியைத் தமிழ் வாக்கிய அமைப்புக்கு ஏற்ற ‘என்றும்’ வடிவில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் வினையின் காலநிலையும் செயப்பாட்டு வடிவமும்
  choice: உயிருடன் எழுப்பப்பட்டிருக்கிறார்
  alternative: உயிருடன் எழுப்பப்பட்டார்
  rationale: ἐγήγερται என்பது நிறைவுநிலைச் செயப்பாட்டு வினை. தேர்ந்த வடிவம் கடந்த நிகழ்வையும் அதன் தொடரும் விளைவையும் வெளிப்படுத்துவதோடு, எழுப்பப்பட்டவர் என்ற செயப்பாட்டு அமைப்பையும் காக்கிறது.
- issue: ‘வேதவாக்குகள்’ என்பதன் குறிப்பு
  choice: வேதவாக்குகளின்படி
  alternative: புனித எழுத்துகளின்படி
  rationale: γραφή என்பதன் பன்மை இங்கு பொதுவான எழுத்துகளை அல்ல, ஏற்கப்பட்ட புனித நூல்களைச் சுட்டுகிறது. எந்தக் குறிப்பிட்ட வசனத்தையோ நூற்பட்டியலையோ மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது. கிரேக்க அறிக்கைத் தொடரின் ‘என்றும் … என்றும்’ அமைப்பு பேணப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் ‘அடக்கம் செய்யப்பட்டார்’ என்பதற்குப் பின் உள்ள [a] குறிப்பு மூலக் கிரேக்கத்துடன் பொருந்தாததால் எடுத்துக்கொள்ளப்படவில்லை; பொருத்தமான நிறைவுநிலை மாற்று மட்டும் குறிக்கப்பட்டுள்ளது.
