  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ποῦ σου, θάνατε, τὸ ⸂νῖκος; ποῦ σου, θάνατε, τὸ κέντρον⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/055.yaml
  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: ta
  text: “மரணமே, உன் வெற்றி எங்கே?[a] மரணமே, உன் கொடுக்கு எங்கே?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் முதற் கூறு, “மரணமே, உன் கொடுக்கு எங்கே?” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: எங்கே
  rationale: இகழ்ச்சிச் சவால் தொனியுடைய நேரடியான வினாவை இயல்பான நவீனத் தமிழில் தருகிறது; மூலத்தில் இல்லாத கூடுதல் வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: σου
  choice: உன்
  rationale: இரண்டாம் நபர் ஒருமை உரிமைப்பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: θάνατε
  choice: மரணமே
  rationale: மரணத்தை ஆளுருவாக்கி நேரடியாக அழைக்கும் கிரேக்க விளிவேற்றுமையின் கவித்துவ வலிமையைப் பாதுகாக்கிறது.
- source_word: νῖκος
  choice: வெற்றி
  rationale: வெற்றி அல்லது வெற்றிகொள்ளுதல் என்ற பொருளைத் தெளிவாகத் தருகிறது; SBLGNT முதற் கூறில் νῖκος என வாசிக்கிறது.
- source_word: κέντρον
  choice: கொடுக்கு
  rationale: குத்தும் முனை அல்லது கொடுக்கு என்ற சொல்லின் இச்சூழலுக்குரிய உருவகப் பொருளைத் தருகிறது; அடுத்த வசனத்தில் விளக்கப்படும் மரணத்தின் தீங்கிழைக்கும் ஆற்றலுக்கும் பொருந்துகிறது.
theological_decisions:
- issue: முதற் கூறின் விமர்சன மூலபாட வாசகம்
  choice: νῖκος என்பதைக் ‘வெற்றி’ என்று முதன்மை உரையில் மொழிபெயர்த்தல்
  alternative: சில கையெழுத்துப் பிரதிகளின்படி முதற் கூறிலும் ‘கொடுக்கு’ என்று மொழிபெயர்த்தல்
  rationale: கொடுக்கப்பட்ட SBLGNT மூலபாடத்தில் νῖκος உள்ளது; ஆகவே ‘வெற்றி … கொடுக்கு’ என்ற இணை அமைப்பைப் பாதுகாப்பது மூலமொழி முன்னுரிமைக்கு ஏற்றது. இது முந்தைய வசனத்தில் மரணம் வெற்றியில் விழுங்கப்பட்டதாகக் கூறப்படுவதுடனும் தொடர்புடையது; வேறுபட்ட வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சுருக்கமான, கவித்துவமிக்க, சவால் விடுக்கும் தொனி. ‘மரணமே’ என்ற நேரடி அழைப்பு இரு கூறுகளிலும் பாதுகாக்கப்பட்டுள்ளது.
