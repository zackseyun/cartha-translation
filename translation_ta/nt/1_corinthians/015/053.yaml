  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: ta
  text: ஏனெனில், அழிவுக்குரிய இந்த உடல் அழியாமையை அணிந்துகொள்ள வேண்டும்[a]; மரணத்துக்குட்பட்ட இந்த உடல் மரணமின்மையை அணிந்துகொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்பாக: “அழிவுக்குரியது அழியாமையை அணிந்துகொள்ள வேண்டும்; மரணத்துக்குட்பட்டது மரணமின்மையை அணிந்துகொள்ள வேண்டும்.” இந்த வசனத்தின் கிரேக்க மூலத்தில் “உடல்” என்ற சொல் வெளிப்படையாக இடம்பெறவில்லை; ஆனால் சூழல் உடலைக் குறிப்பது தெளிவு.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: வேண்டும்
  rationale: உயிர்த்தெழுதலில் இந்த மாற்றம் நிகழ்வது அவசியம் என்பதை இயல்பான, வலுவான தமிழில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திற்கான விளக்கத் தொடர்பைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: அழிவுக்குரிய இந்த உடல்
  rationale: φθαρτός என்பது அழிவுக்கும் சிதைவுக்கும் உட்பட்டதைக் குறிக்கிறது. கிரேக்கத்தில் ‘உடல்’ வெளிப்படையாக இல்லாவிட்டாலும், உடலின் உயிர்த்தெழுதலைப் பற்றிய சூழல் அதன் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: ἐνδύσασθαι
  choice: அணிந்துகொள்ள
  rationale: ஆடை அணியும் உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἀφθαρσίαν
  choice: அழியாமை
  rationale: φθαρτός என்பதுடனான அழிவு–அழியாமை எதிரிணையைச் சுருக்கமாகவும் தெளிவாகவும் தக்கவைக்கிறது.
- source_word: καὶ
  choice: ;
  rationale: இரண்டு இணையான கூற்றுகளையும் நெருக்கமாக இணைக்கத் தமிழில் அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; அதன் இணைப்புப் பொருள் தொடரமைப்பில் வெளிப்படுகிறது.
- source_word: τὸ θνητὸν τοῦτο
  choice: சாவுக்குரிய இந்த உடல்
  rationale: θνητός என்பது மரணத்திற்கு உட்பட்டதைக் குறிக்கிறது. ‘சாவுக்குரிய’ என்பது அடுத்துவரும் ‘சாவாமை’ என்பதுடன் மூலத்தின் எதிரிணையை வெளிப்படுத்துகிறது.
- source_word: ἀθανασίαν
  choice: சாவாமை
  rationale: மரணத்திற்கு இனி உட்படாத நிலையைத் தெளிவாகக் குறைத்து, ‘சாவுக்குரிய’ என்பதுடன் சொல்லியல் எதிரிணையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இந்த வசனத்தில் σώμα இல்லாவிட்டாலும் ‘உடல்’ என்று சேர்த்தல்
  choice: ‘அழிவுக்குரிய இந்த உடல்’, ‘சாவுக்குரிய இந்த உடல்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அழிவுக்குரியது அழியாமையை அணிந்துகொள்ள வேண்டும்; சாவுக்குரியது சாவாமையை அணிந்துகொள்ள வேண்டும்’
  rationale: 1 கொரிந்தியர் 15:42–54 உடலின் உயிர்த்தெழுதலையும் மாற்றத்தையும் பற்றிய சூழல் என்பதால், தமிழில் குறிப்புப் பொருளைத் தெளிவாக்க ‘உடல்’ சேர்க்கப்படுகிறது. கிரேக்கத்தின் அதிக முறையான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐνδύσασθαι என்ற ஆடை உருவகம்
  choice: ‘அணிந்துகொள்ள வேண்டும்’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘பெற்றுக்கொள்ள வேண்டும்’ அல்லது ‘மாற்றப்பட வேண்டும்’
  rationale: பவுலின் உருவக மொழியையும், அழிவுக்குரியது/சாவுக்குரியது தொடர்ந்து மாற்றம் பெறுகிறது என்ற பதற்றத்தையும் விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடை. ‘அழிவுக்குரிய/அழியாமை’ மற்றும் ‘சாவுக்குரிய/சாவாமை’ என்ற இணைகள் மூலத்தின் சமச்சீர் எதிரிணையையும், ‘அணிந்துகொள்ள’ என்பது அதன் ஆடை உருவகத்தையும் தக்கவைக்கின்றன.
