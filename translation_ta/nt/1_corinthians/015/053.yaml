review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys γάρ as an explanation, δεῖ as necessity, the two parallel substantival adjectives, and the clothing metaphor of ἐνδύσασθαι. Supplying ‘உடல்’ is justified by the immediate resurrection-body context and is appropriately disclosed in the footnote.
  naturalness: ‘சாவுக்குரிய’ can be understood as ‘deserving death’ or ‘liable to death’ and is less idiomatic here than ‘மரணத்துக்குட்பட்ட.’ ‘மரணமின்மை’ is a clear, dignified modern-standard Tamil rendering of ἀθανασία and forms a natural contrast with it.
  terminology: Retain ‘அழிவுக்குரிய/அழியாமை’ for the φθαρτός/ἀφθαρσία contrast. Revise the θνητός/ἀθανασία pair to ‘மரணத்துக்குட்பட்ட/மரணமின்மை’ for precision and unambiguous contemporary usage.
  issues:
  - severity: medium
    issue: ‘சாவுக்குரிய’ is potentially ambiguous in modern Tamil.
    rationale: It may suggest being worthy of death rather than being mortal. The Greek θνητόν denotes that which is subject to death.
  - severity: low
    issue: ‘சாவாமை’ is less formal and less natural in this elevated prose context.
    rationale: ‘மரணமின்மை’ accurately expresses ἀθανασία (‘immortality’) in standard Tamil and pairs clearly with ‘மரணத்துக்குட்பட்ட.’
