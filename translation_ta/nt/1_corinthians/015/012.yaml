id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: ta
  text: ஆனால் மேசியா இறந்தோரிலிருந்து உயிர்த்தெழுப்பப்பட்டிருக்கிறார் என்று அறிவிக்கப்படுகிறார் என்றால், இறந்தோரின் உயிர்த்தெழுதல் இல்லை என்று உங்களுள் சிலர் எப்படிச் சொல்லுகிறார்கள்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்து.’ கிரேக்க Χριστός என்பதற்கு ‘மேசியா’ அல்லது ‘கிறிஸ்து’ என்று மொழிபெயர்க்கலாம்; இங்கு அது ஒரு பட்டப்பெயராகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_rendering
lexical_decisions:
- source_word: Χριστὸς
  choice: கிறிஸ்து
  rationale: தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் மரியாதைமிக்க வடிவம்; இது இங்கு மேசியா என்னும் பட்டத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: κηρύσσεται
  choice: அறிவிக்கப்படுகிறபோது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் தொடரும் பொதுப் பிரகடனப் பொருளைப் பாதுகாக்கிறது; εἰ δέ அமைப்பை இயல்பான தமிழ் நிபந்தனைச் சூழலாக வெளிப்படுத்துகிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: பன்மையான ‘இறந்தவர்கள்’ என்ற பொருளையும் உயிர்த்தெழுதல் மொழிநடையையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἐγήγερται
  choice: உயிர்த்தெழுப்பப்பட்டிருக்கிறார்
  rationale: நிறைவுற்ற செயலும் அதன் தொடரும் விளைவும் கொண்ட perfect passive வடிவத்தைப் பாதுகாக்கிறது; அவரை எழுப்பியவர் வாக்கியத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
- source_word: πῶς
  choice: எப்படிச் சொல்லலாம்
  rationale: முரண்பாட்டைச் சுட்டும் வினாவியல் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν ὑμῖν τινες
  choice: உங்களுள் சிலர்
  rationale: கொரிந்துச் சமூகத்துக்குள்ளேயே உள்ள ஒரு பகுதியினரைத் துல்லியமாகக் குறிக்கிறது.
- source_word: ἀνάστασις νεκρῶν
  choice: இறந்தோரின் உயிர்த்தெழுதல்
  rationale: பொதுவான இறந்தோர் உயிர்த்தெழுதலைக் குறிக்கும் genitive அமைப்பைப் பாதுகாக்கிறது.
- source_word: οὐκ ἔστιν
  choice: இல்லை
  rationale: இங்கு உள்ள இருப்பை மறுக்கும் கூற்றைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: Χριστός என்பதன் பட்டப்பெயர்ச் சார்பு
  choice: முதன்மை உரையில் ‘கிறிஸ்து’; அடிக்குறிப்பில் ‘மேசியா’ என்ற பொருள்
  alternative: ‘மேசியா’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: தமிழில் ‘கிறிஸ்து’ நன்கு நிலைபெற்ற வடிவம்; அதே நேரத்தில் மூலச்சொல்லின் பட்டப்பெயர்ப் பொருள் மறையாமல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐγήγερται என்ற செயப்பாட்டு வடிவம்
  choice: ‘உயிர்த்தெழுப்பப்பட்டிருக்கிறார்’
  alternative: ‘உயிர்த்தெழுந்திருக்கிறார்’
  rationale: கிரேக்க perfect passive வடிவத்தையும் செய்பவர் வெளிப்படையாகச் சொல்லப்படாத நிலையையும் காக்கிறது; கடவுளே செய்பவர் என்ற கருத்தை உரைக்குள் கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், பவுலின் வாதத்தின் மரியாதைமிக்க இறையியல் தொனியைப் பாதுகாக்கும் வகையிலும் அமைக்கப்பட்டது.
