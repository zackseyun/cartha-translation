revisions:
- from: கிறிஸ்து இறந்தோரிலிருந்து உயிர்த்தெழுப்பப்பட்டிருக்கிறார் என்று அறிவிக்கப்படுகிறபோது,[a] இறந்தோரின் உயிர்த்தெழுதல் இல்லை என்று உங்களுள் சிலர் எப்படிச் சொல்லலாம்?
  to: ஆனால் மேசியா இறந்தோரிலிருந்து உயிர்த்தெழுப்பப்பட்டிருக்கிறார் என்று அறிவிக்கப்படுகிறார் என்றால், இறந்தோரின் உயிர்த்தெழுதல் இல்லை என்று உங்களுள் சிலர் எப்படிச் சொல்லுகிறார்கள்?[a]
  rationale: The revision restores the conditional force of εἰ δέ, represents the present λέγουσιν directly, and renders Χριστός as the title ‘மேசியா’ in the main text. The perfect passive resurrection wording and the ambiguity concerning the unstated agent are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:08:56Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the perfect passive ‘has been raised’ and the general resurrection. However, அறிவிக்கப்படுகிறபோது (‘when ... is proclaimed’) changes εἰ δέ (‘but/now if’) from a conditional premise to a temporal clause. Its எப்படிச் சொல்லலாம் (‘how can [they] say?’) slightly shifts the present indicative λέγουσιν (‘[they] say’) into potential wording.
  naturalness: The revised conditional wording is natural modern standard Tamil. Using எப்படிச் சொல்லுகிறார்கள் preserves the rhetorical question without introducing an unwarranted modal nuance.
  terminology: மேசியா renders Χριστός as a title in accordance with the audit trail, while the footnote supplies the familiar alternative கிறிஸ்து. உயிர்த்தெழுப்பப்பட்டிருக்கிறார் appropriately retains the Greek perfect passive without specifying the agent.
  issues:
  - severity: medium
    issue: Conditional εἰ δέ is rendered temporally as அறிவிக்கப்படுகிறபோது.
    rationale: The source poses an ‘if’ premise, not an event occurring ‘when’; Tamil should use என்றால்.
  - severity: low
    issue: λέγουσιν is rendered சொல்லலாம்.
    rationale: The source has a present assertion, ‘say,’ rather than ‘can say.’ The rhetorical force is retained by எப்படிச் சொல்லுகிறார்கள்?
  - severity: low
    issue: Main-text கிறிஸ்து leaves the title sense untranslated despite the stated title-rendering policy.
    rationale: Χριστός is used as a title here; மேசியா preserves that sense, with கிறிஸ்து supplied as a familiar alternative in a footnote.
  revised_text: ஆனால் மேசியா இறந்தோரிலிருந்து உயிர்த்தெழுப்பப்பட்டிருக்கிறார் என்று அறிவிக்கப்படுகிறார் என்றால், இறந்தோரின் உயிர்த்தெழுதல் இல்லை என்று உங்களுள் சிலர் எப்படிச் சொல்லுகிறார்கள்?[a]
