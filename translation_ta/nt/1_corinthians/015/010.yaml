reference: 1 Corinthians 15:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: ta
  text: ஆனால் கடவுளுடைய அருளால், நான் என்னவாக இருக்கிறேனோ அதுவாக இருக்கிறேன். என்னை நோக்கிய அவரது அருள் வீண்போகவில்லை[a]. மாறாக, அவர்கள் எல்லாரையும்விட நான் அதிகமாக உழைத்தேன். ஆயினும், நான் அல்ல; என்னுடன் இருந்த கடவுளுடைய அருளே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்சொல்லாக, “வெறுமையாக ஆகவில்லை”; அல்லது “பயனற்றுப் போகவில்லை.”
    reason: κενή என்பதற்கு ‘வெறுமையானது,’ ‘பலனற்றது,’ ‘வீணானது’ என்ற ஒன்றோடொன்று தொடர்புடைய பொருள்கள் உள்ளன.
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: ஆனால் கடவுளுடைய அருளால்
  rationale: χάριτι என்ற வேற்றுமை வடிவத்தின் கருவிப் பொருளை ‘அருளால்’ இயல்பாக வெளிப்படுத்துகிறது; δέ முந்தைய வசனத்துடன் தரும் மென்மையான மாறுபாட்டை ‘ஆனால்’ காக்கிறது.
- source_word: εἰμι ὅ εἰμι
  choice: நான் என்னவாக இருக்கிறேனோ அதுவாக இருக்கிறேன்
  rationale: பவுலின் தற்போதைய நிலையும் அடையாளமும் கடவுளுடைய அருளால் அமைந்தவை என்பதைச் சொல்லும் மூலமொழியின் திட்டமிட்ட மறுபடிவத்தை இயன்றவரை காக்கிறது.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: எனக்கு அவர் அருளிய அருள்
  rationale: εἰς ἐμέ என்பதிலுள்ள பவுலை நோக்கிய திசைப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘அருள்’ என்ற பவுலின் மையச் சொல்லையும் தக்கவைக்கிறது.
- source_word: οὐ κενὴ ἐγενήθη
  choice: வீண்போகவில்லை
  rationale: κενός என்பதிலுள்ள ‘வெறுமையானது, பலனற்றது, வீணானது’ என்ற பொருள் வரம்பில், அருள் செயல்விளைவற்றதாக இருக்கவில்லை என்பதை இயல்பாகக் கூறுகிறது; உருவகத்தின் நேர்சொல் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: மாறாக, அவர்கள் எல்லாரையும்விட நான் அதிகமாக உழைத்தேன்
  rationale: κοπιάω குறிக்கும் கடின உழைப்பை ‘உழைத்தேன்’ தெரிவிக்கிறது; ஒப்பீட்டையும் ἀλλά-வின் வலுவான மாறுபாட்டையும் தெளிவாகக் காக்கிறது.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: ஆனாலும், உழைத்தது நான் அல்ல; ... கடவுளுடைய அருளே
  rationale: பவுலின் உண்மையான உழைப்பை மறுக்காமல், அதன் தீர்மானிக்கும் ஆற்றல் கடவுளுடைய அருளே என்ற அடுத்த கூற்றின் அழுத்தத்தை ‘அருளே’ மூலம் காக்கிறது.
- source_word: ἡ σὺν ἐμοί
  choice: என்னுடன் இருந்த
  rationale: σύν என்பதன் ‘உடன்’ என்ற நேர்பொருளைத் தக்கவைத்து, இந்தத் தொடர் ‘கடவுளுடைய அருள்’ என்பதையே விளக்குகிறது என்பதைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: பவுலின் உழைப்புக்கும் கடவுளுடைய அருளுக்கும் உள்ள உறவு
  choice: பவுல் உண்மையாக உழைத்தார் என்பதையும், அதே வேளையில் அந்த உழைப்பின் பயனுள்ள ஆற்றல் கடவுளுடைய அருளே என்பதையும் உரை ஒன்றாகப் பேணுகிறது.
  alternative: இதை ‘கடவுளும் நானும் சேர்ந்து உழைத்தோம்’ என்று கூட்டுச் செயலாகத் தீர்மானித்துக் கூறுதல்; அல்லது பவுலின் உழைப்பை வெறும் தோற்றமாக்கும் வகையில் அருளை மட்டும் வலியுறுத்துதல்.
  rationale: கிரேக்கம் ‘நான் அதிகமாக உழைத்தேன்’ என்றும் ‘நான் அல்ல, கடவுளுடைய அருளே’ என்றும் இரண்டையும் வெளிப்படையாகக் கூறுகிறது. பிற்கால இறையியல் அமைப்பொன்றுக்குள் இழுத்துச் செல்லாமல் அந்த இழுவிசையை மொழிபெயர்ப்பு காக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வழிபாட்டு மரியாதையையும் சாதாரண வாசகர்களுக்கான தெளிவையும் இணைக்கும் நடை. ‘கிருபை’ என்பதற்குப் பதிலாக இன்றைய பொதுவழக்கில் எளிதில் புரியும் ‘அருள்’ பயன்படுத்தப்பட்டது. மூலத்தின் வலியுறுத்தலையும் இறையியல் இழுவிசையையும் காக்க அரைக்காற்புள்ளியும் ‘அருளே’ என்ற அழுத்த வடிவமும் பயன்படுத்தப்பட்டன.
