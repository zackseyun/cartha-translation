revisions:
- from: ஆனால் கடவுளுடைய அருளால், நான் என்னவாக இருக்கிறேனோ அதுவாக இருக்கிறேன். எனக்கு அவர் அருளிய அருள் வீண்போகவில்லை[a]. மாறாக, அவர்கள் எல்லாரையும்விட நான் அதிகமாக உழைத்தேன். ஆனாலும், உழைத்தது நான் அல்ல; என்னுடன் இருந்த கடவுளுடைய அருளே.
  to: ஆனால் கடவுளுடைய அருளால், நான் என்னவாக இருக்கிறேனோ அதுவாக இருக்கிறேன். என்னை நோக்கிய அவரது அருள் வீண்போகவில்லை[a]. மாறாக, அவர்கள் எல்லாரையும்விட நான் அதிகமாக உழைத்தேன். ஆயினும், நான் அல்ல; என்னுடன் இருந்த கடவுளுடைய அருளே.
  rationale: 'The revision removes the added sense of God actively bestowing grace and renders εἰς ἐμέ as grace directed toward Paul. It also restores the concise personal contrast of the final Greek clause while retaining the source''s deliberate tension: Paul truly labored, yet God''s grace is credited as the effective agent. The footnote remains correctly anchored to “வீண்போகவில்லை” and preserves the lexical alternatives.'
