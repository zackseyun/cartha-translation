id: 1CO.15.28
reference: 1 Corinthians 15:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: ta
  text: ஆனால், அனைத்தும்[a] அவருக்குக் கீழ்ப்படுத்தப்படும்போது, அப்போது மகன் தாமே அனைத்தையும் அவருக்குக் கீழ்ப்படுத்தியவருக்கு கீழ்ப்படுத்தப்படுவார்; அதனால் கடவுள் எல்லாவற்றிலும் எல்லாமுமாய் இருப்பார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எல்லாமும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் τὰ πάντα என்ற சொற்றொடர் மீண்டும் மீண்டும் வந்து, பவுலின் வாதத்திலுள்ள அனைத்தையும் உள்ளடக்கும் பரப்பை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கடவுள் எல்லாரிலும் எல்லாமுமாய் இருப்பார்’ என்றும் பொருள் கொள்ளலாம். கிரேக்கச் சொற்றொடர் சுருக்கமானது; சொல்லுக்கு நெருக்கமாக அது ‘அனைத்திலும் அனைத்தும்’ என அமைகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ஆனால், ... கீழ்ப்படுத்தப்படும்போது
  rationale: ὅταν என்பதன் காலப் பொருளை ‘-போது’ என்றும், δέ குறிக்கும் மென்மையான மாறுபாடு அல்லது கருத்துத் தொடர்ச்சியை ‘ஆனால்’ என்றும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑποταγῇ / ὑποταγήσεται
  choice: கீழ்ப்படுத்தப்படும்போது / கீழ்ப்படுத்தப்படுவார்
  rationale: இரு வடிவங்களின் செயப்பாட்டு நிலையையும் ஒரே தமிழ் வேர்ச்சொல் மூலம் காத்து, பவுலின் சொல் மீளுருவாக்கத்தைத் தெளிவுபடுத்துகிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: சூழலில் இது மகனைக் குறிக்கிறது; பெயரை விளக்கமாகச் சேர்க்காமல் மூலத்தின் பிரதிப்பெயர் அமைப்பைக் காக்கிறது.
- source_word: τὰ πάντα
  choice: அனைத்தும் / அனைத்தையும்
  rationale: நடுநிலைப் பன்மையின் அனைத்தையும் உள்ளடக்கும் பரப்பைத் தமிழில் இயல்பாகக் காட்டி, வசனத்திலுள்ள மீளுருவாக்கத்தையும் காக்கிறது.
- source_word: τότε
  choice: அப்போது
  rationale: நிகழ்வுகளின் தொடரில் அடுத்த கட்டத்தைச் சுட்டும் கால வினையடையை நேரடியாக வழங்குகிறது.
- source_word: αὐτὸς ὁ υἱὸς
  choice: மகன் தாமே
  rationale: αὐτός தரும் தனிப்பட்ட வலியுறுத்தலை மரியாதையும் இயல்பும் கொண்ட தமிழ் வடிவில் வெளிப்படுத்துகிறது.
- source_word: τῷ ὑποτάξαντι
  choice: கீழ்ப்படுத்தியவருக்கு
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலச் செயவெச்சத்தின் பொருளையும் திசைவேற்றுமையையும் சுருக்கமாகக் காக்கிறது.
- source_word: ἵνα ᾖ
  choice: இதனால் ... இருப்பார்
  rationale: ἵνα இங்கு நோக்கம் அல்லது விளைவு என்ற இரண்டிற்கும் இடமளிக்கலாம்; ‘இதனால்’ என்பது அந்த தொடர்பை இயல்பான தமிழில் காட்டுகிறது, ஒன்றை மட்டும் கடுமையாக நிர்ணயிக்கவில்லை.
- source_word: πάντα ἐν πᾶσιν
  choice: எல்லாவற்றிலும் எல்லாமுமாய்
  rationale: சுருக்கமான கிரேக்கச் சொற்றொடரின் பரந்த, பிரபஞ்சளாவிய வலிமையையும் ‘அனைத்தும்’ சார்ந்த சொல் மீளுருவாக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: மகன் கீழ்ப்படுத்தப்படுவதற்கும் அனைத்தையும் அவருக்குக் கீழ்ப்படுத்தியவருக்கும் உள்ள உறவு
  choice: மகன் தாமே கீழ்ப்படுத்தப்படுவார் என்று மூலத்தின் செயப்பாட்டு வடிவை நேரடியாக மொழிபெயர்த்தல்
  alternative: சாராம்சத்தில் தாழ்ந்தவர் அல்ல என்றோ, இது பணிசார்ந்த கீழ்ப்படிதல் மட்டுமே என்றோ உரைக்குள்ளேயே விளக்கிச் சேர்த்தல்
  rationale: வசனம் கூறும் இறுதிக்காலக் கீழ்ப்படுத்துதலை மறைக்காமலும், அதன் மேல் பிற்காலக் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும், உரையின் உண்மையான இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: τὰ πάντα மற்றும் πάντα ἐν πᾶσιν என்பவற்றின் பரப்பு
  choice: ‘அனைத்தும்’ மற்றும் ‘எல்லாவற்றிலும் எல்லாமுமாய்’ என்ற விரிவான சொற்களைப் பயன்படுத்துதல்
  alternative: இறுதிச் சொற்றொடரை ‘எல்லாரிலும் எல்லாமுமாய்’ என்று மனிதர்களுக்கு மட்டும் உரியதாகத் தெளிவுபடுத்துதல்
  rationale: πᾶς சொற்குடும்பத்தின் மீளுருவாக்கமும் பிரபஞ்சளாவிய பரப்பும் நிலைத்திருக்கின்றன; அதேவேளை மாற்று இலக்கணப் புரிதல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘கீழ்ப்படுத்தப்படுதல்’ என்ற சற்றே முறையான சொல், மூலத்தின் செயப்பாட்டு வடிவத்தையும் வசனத்தின் முக்கிய சொல் மீளுருவாக்கத்தையும் காக்கத் தேர்ந்தெடுக்கப்பட்டது. ‘மகன் தாமே’ என்பது αὐτός தரும் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
