source:
  edition: SBLGNT
  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: ta
  text: சரியானபடி விழித்துத் தெளிவடையுங்கள்[a]; தொடர்ந்து பாவம் செய்யாதீர்கள்[b]. ஏனெனில் சிலருக்குக் கடவுளைப் பற்றிய அறியாமை இருக்கிறது. உங்களுக்கு வெட்கமாக இருக்கும்படி இதைச் சொல்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சரியானபடி போதை தெளியுங்கள்.” இவ்வினைச்சொல் சொல்லர்த்தமாகப் போதை தெளிவதைக் குறிக்கிறது; இங்கு அது உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பாவம் செய்யாதீர்கள்” அல்லது “பாவம் செய்வதை நிறுத்துங்கள்.” நிகழ்காலக் கட்டளை தொடரும் அல்லது வழக்கமான செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: தெளிந்த மனநிலைக்கு வாருங்கள்
  rationale: வினைச்சொல் நேரடியாகப் போதை தெளிவதைக் குறித்தாலும், இங்கு உருவகமாக மயக்கத்திலிருந்து விழித்துத் தெளிவான சிந்தனைக்கு வருமாறு வலியுறுத்துகிறது. தமிழில் உருவகப் பொருளையும் கட்டளையின் தீர்மானமான வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δικαίως
  choice: முறைப்படி
  rationale: கட்டளையைத் தகுந்த அல்லது சரியான விதத்தில் நிறைவேற்ற வேண்டும் என்ற வினையடைப் பொருளைத் தருகிறது; இங்கு தேவையற்ற கனமான இறையியல் பொருளை ஏற்றாமல் நெறிசார் அழுத்தத்தையும் காக்கிறது.
- source_word: μὴ ἁμαρτάνετε
  choice: தொடர்ந்து பாவம் செய்யாதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை தொடரும் அல்லது வழக்கமான செயலைத் தடைசெய்யும் நுணுக்கத்தைக் கொண்டிருக்கலாம். இந்த மொழிபெயர்ப்பு அந்த நுணுக்கத்தை வெளிப்படுத்துகிறது; ஆனால் மாற்று வாசிப்பையும் அடிக்குறிப்பில் காக்கிறது.
- source_word: ἀγνωσίαν θεοῦ
  choice: கடவுளைப் பற்றிய அறிவே இல்லை
  rationale: ἀγνωσία என்பது அறியாமை அல்லது அறிவின்மையைக் குறிக்கிறது; θεοῦ இங்கு கடவுளைக் குறித்த அறிவின்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘அறிவே இல்லை’ என்பது கிரேக்கப் பெயர்ச்சொல்லின் வலுவான கண்டனத் தொனியைத் தருகிறது.
- source_word: τινες
  choice: சிலர்
  rationale: கேட்போருள் அல்லது அவர்களோடு தொடர்புடைய ஒரு பகுதியினரைச் சுட்டும் இயல்பான தமிழ் இணை.
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: உங்களுக்கு வெட்கம் உண்டாகவே
  rationale: கேட்போரின் வெட்கத்தை நோக்கிய விளைவு அல்லது நோக்கத்தைப் பாதுகாக்கிறது; பவுலின் கண்டனத் தொனியும் தெளிவாகிறது.
- source_word: λαλῶ
  choice: இதைச் சொல்கிறேன்
  rationale: முந்தைய கண்டனத்தைச் சுட்டும் உரையாடல் செயல்பாட்டை இயல்பான தமிழில் அளிக்கிறது.
theological_decisions:
- issue: δικαίως என்பதன் நெறிசார் வலிமை
  choice: முறைப்படி
  alternative: நீதியாய் / சரியாக
  rationale: இது நெறிசார் கண்டனம் என்றாலும், δικαίως இங்கு தெளிந்த மனநிலைக்கு வருமாறு கூறும் கட்டளையை வினையடையாகத் தகுந்த விதத்தில் வரையறுக்கிறது. ‘முறைப்படி’ என்பது ‘நீதி’ குறித்த தொழில்நுட்ப பவுலிய பொருளைத் தேவையின்றி புகுத்தாமல் மூலத்தின் வலிமையைப் பாதுகாக்கிறது.
- issue: μὴ ἁμαρτάνετε என்பதன் செயற்பாங்கு
  choice: தொடர்ந்து பாவம் செய்யாதீர்கள்
  alternative: பாவம் செய்யாதீர்கள் / பாவம் செய்வதை நிறுத்துங்கள்
  rationale: நிகழ்காலக் கட்டளையின் தொடர்ச்சி அல்லது பழக்கச் செயல் நுணுக்கம் சாத்தியம்; ஆனால் அது கட்டாயமான ஒரே விளக்கம் அல்ல. முதன்மை உரை அந்த நுணுக்கத்தை வெளிப்படுத்துகிறது, அடிக்குறிப்பு உண்மையான மாற்றுகளைப் பதிவு செய்கிறது.
- issue: ἀγνωσίαν θεοῦ என்பதிலுள்ள உறவு
  choice: கடவுளைப் பற்றிய அறிவே இல்லை
  alternative: கடவுளை அறியாதவர்களாய் இருக்கிறார்கள் / கடவுளைக் குறித்த அறியாமை கொண்டிருக்கிறார்கள்
  rationale: இறை அறிவின் தன்மை குறித்து மேலதிக கோட்பாட்டைத் தீர்மானிக்காமல், கடவுளைக் குறித்த அறிவின்மையைக் கிரேக்கம் கூறும் அளவிலேயே வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கண்டனத் தொனி பயன்படுத்தப்பட்டது. ‘தெளிந்த மனநிலை’ உருவகத்தை விளக்குகிறது; ‘தொடர்ந்து’ என்பது நிகழ்காலக் கட்டளையின் சாத்தியமான செயற்பாங்கைத் தருகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
