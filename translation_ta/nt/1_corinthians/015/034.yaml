- from: முறைப்படி தெளிந்த மனநிலைக்கு வாருங்கள்[a]; தொடர்ந்து பாவம் செய்யாதீர்கள்[b]. ஏனெனில் சிலருக்குக் கடவுளைப் பற்றிய அறிவே இல்லை. உங்களுக்கு வெட்கம் உண்டாகவே இதைச் சொல்கிறேன்.
  to: சரியானபடி விழித்துத் தெளிவடையுங்கள்[a]; தொடர்ந்து பாவம் செய்யாதீர்கள்[b]. ஏனெனில் சிலருக்குக் கடவுளைப் பற்றிய அறியாமை இருக்கிறது. உங்களுக்கு வெட்கமாக இருக்கும்படி இதைச் சொல்கிறேன்.
