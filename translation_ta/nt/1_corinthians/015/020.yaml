  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: ta
  text: ஆனால் இப்போதோ, இறந்தோரிலிருந்து மெசியா உயிர்த்தெழுப்பப்பட்டிருக்கிறார்; நித்திரையடைந்தவர்களின்[b] முதற்பலனாக[a] இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முதற்பலன்’ என்பது அறுவடையில் முதலில் கிடைக்கும் பகுதியை இறைவனுக்குச் செலுத்தும் வழக்கை நினைவூட்டுகிறது; வரவிருக்கும் முழு அறுவடைக்கு அது முன்னுறுதியாகவும் அமைகிறது.
    reason: cultural_note
  - marker: b
    text: ‘நித்திரையடைந்தவர்கள்’ என்பது இறந்தவர்களைக் குறிக்கும் உருவகம்; குறிப்பாக உயிர்த்தெழுதலைப் பற்றிய சூழலில் இவ்வாறு கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: ஆனால் இப்போதோ
  rationale: முந்தைய கற்பனை மறுப்புக்கு எதிராக, உயிர்த்தெழுதல் உண்மை என்பதை வலுவாகத் திருப்பிக் கூறுகிறது.
- source_word: Χριστὸς
  choice: மெசியா
  rationale: இச்சூழலில் Χριστός பெயரைப் போல அல்லாமல், அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளுடன் பயன்படுகிறது.
- source_word: ἐγήγερται
  choice: உயிர்த்தெழுப்பப்பட்டிருக்கிறார்
  rationale: கிரேக்க நிறைவேற்றுச் செயப்பாட்டு வடிவம், நிறைவேறிய செயலையும் அதன் தொடரும் நிலையையும் காட்டுகிறது; செய்பவரை வசனத்திலேயே வெளிப்படையாகக் குறிப்பிடாமல் விடுகிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: பன்மையிலுள்ள νεκρῶν என்பதைக் கருத்துத் தெளிவுடன் எடுத்துரைத்து, இறந்தவர்களின் நடுவிலிருந்து உயிர்த்தெழுப்பப்பட்டார் என்ற பொருளைப் பேணுகிறது.
- source_word: ἀπαρχὴ
  choice: முதற்பலன்
  rationale: அறுவடையின் முதல் பகுதியை இறைவனுக்குச் செலுத்தும் உருவகத்தையும், பின்னர் வரவிருக்கும் முழு அறுவடையின் முன்னுறுதியையும் குறிக்கிறது.
- source_word: τῶν κεκοιμημένων
  choice: நித்திரையடைந்தவர்களின்
  rationale: இறந்தவர்களைக் குறிக்கும் நித்திரை உருவகத்தைத் தட்டையாக்காமல் பேணுகிறது; உயிர்த்தெழுதல் சூழலில் இது இயல்பாகப் புரிகிறது.
theological_decisions:
- issue: உயிர்த்தெழுதலின் வினைக்குரலும் செயற்பாட்டாளரும்
  choice: உயிர்த்தெழுப்பப்பட்டிருக்கிறார்
  alternative: உயிர்த்தெழுந்திருக்கிறார்
  rationale: செயப்பாட்டு வடிவத்தைப் பேணி, தெய்வீகச் செயற்பாட்டை மறைக்காமலும், இவ்வசனம் குறிப்பிடாத செயற்பாட்டாளரை வெளிப்படையாகச் சேர்க்காமலும் உள்ளது.
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அது பிரதிநிதித்துவமும் இறையியல் வலியுறுத்தலும் கொண்ட பட்டமாகச் செயல்படுவதால், அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்படுகிறது.
- issue: ἀπαρχή உருவகத்தின் பொருள்
  choice: முதற்பலன்
  alternative: முதல் விளைச்சல்
  rationale: மெசியாவின் உயிர்த்தெழுதல் காலவரிசையில் முதலானது மட்டுமல்ல, தொடர்ந்து உயிர்த்தெழப்போகிறவர்களுக்கான முன்னுறுதியும் என்பதைக் குறிக்கும் வழிபாட்டு-அறுவடை உருவகத்தைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘உயிர்த்தெழுப்பப்பட்டிருக்கிறார்’ என்பது சிறிது நீளமானதாயினும் கிரேக்க நிறைவேற்றுச் செயப்பாட்டு வினையின் காலநிலை மற்றும் குரலைத் துல்லியமாகப் பேணுகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் அமைக்கப்பட்டுள்ளன.
