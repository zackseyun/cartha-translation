  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: ta
  text: வானத்துக்குரிய உடல்களும் உண்டு, பூமிக்குரிய உடல்களும் உண்டு[a]; ஆனால் வானத்துக்குரியவற்றின் மகிமை ஒருவகை, பூமிக்குரியவற்றின் மகிமை வேறுவகை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானுலக உடல்களும் பூவுலக உடல்களும்.”
    reason: ‘வானத்துக்குரிய’ மற்றும் ‘பூமிக்குரிய’ என்பவற்றுக்கான சற்றே இலக்கியமான சொல்லாக்க மாற்று.
lexical_decisions:
- source_word: σώματα
  choice: உடல்கள்
  rationale: ‘உடல்கள்’ என்பது சொல்லின் பரந்த பொருளை இயல்பாகக் காக்கிறது; இவ்விடத்தில் வான்கோள்கள், உயிரினங்கள் அல்லது உயிர்த்தெழுந்த உடல்கள் என்று பொருளைத் தேவையின்றிக் குறுக்கவில்லை.
- source_word: ἐπουράνια
  choice: வானத்துக்குரிய
  rationale: வானத்தைச் சேர்ந்த அல்லது வானுலகுக்குரிய என்ற பொருளைத் தருகிறது; வெறும் வானியல் பொருட்களாக மட்டும் சுருக்காமல் மூலத்தின் பொருள் விரிவைக் காக்கிறது.
- source_word: ἐπίγεια
  choice: பூமிக்குரிய
  rationale: பூமியில் உள்ள அல்லது பூமியைச் சேர்ந்த என்ற பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்தி, ‘வானத்துக்குரிய’ என்பதுடன் தெளிவான இணையை உருவாக்குகிறது.
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: இரு வகை உடல்கள் இருப்பதையும் அவற்றின் மகிமை வேறுபடுவதையும் இணைக்கும் எளிய எதிர்மறைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἑτέρα ... ἑτέρα
  choice: ஒருவகை ... வேறுவகை
  rationale: இரண்டுக்கும் இடையிலான தன்மை அல்லது வகை வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δόξα
  choice: மகிமை
  rationale: இச்சூழலில் உள்ள ஒளிச்சிறப்பு அல்லது மேன்மை என்ற நிழற்பொருளையும், பவுலின் விரிந்த இறையியல் சொற்பயன்பாட்டையும் ஒருங்கே காக்கிறது.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: வானத்துக்குரியவற்றின் ... பூமிக்குரியவற்றின்
  rationale: முன்னர் வந்த ‘உடல்கள்’ என்பதைத் தமிழில் இயல்பாக மறைமுகமாகச் சுட்டி, கிரேக்கத்தின் சுருக்கமான அமைப்பைப் பேணுகிறது.
theological_decisions:
- issue: ‘வானத்துக்குரிய உடல்கள்’ மற்றும் ‘பூமிக்குரிய உடல்கள்’ என்பவற்றின் குறிப்பு
  choice: எதைக் குறிக்கின்றன என்று வரையறுக்காமல் பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வான்கோள்கள் மற்றும் நிலவுலக உடல்கள்’ அல்லது ‘வானுலக உயிர்கள் மற்றும் பூவுலக உயிர்கள்’ என்று குறிப்பாக்குதல்.
  rationale: மூலத்தில் σώματα (‘உடல்கள்’) என்றே உள்ளது. ஆகவே இதைத் தேவதூதர்களாகவோ வானியல் கோள்களாகவோ மட்டும் குறுக்காமல், பலவகை உடல் இருப்புகளையும் அவற்றின் வேறுபட்ட மகிமையையும் பற்றிய பவுலின் ஒப்புமையிலுள்ள தெளிவின்மையையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘மகிமை’ என்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டாலும், ‘ஒருவகை ... வேறுவகை’ என்ற நடை வசனத்தை எளிதில் புரிந்துகொள்ள உதவுகிறது.
