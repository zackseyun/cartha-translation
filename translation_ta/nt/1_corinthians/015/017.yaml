- from: ஆனால் மேசியா உயிர்த்தெழுப்பப்படவில்லை என்றால்[a], உங்கள் விசுவாசம் பயனற்றது[b]; நீங்கள் இன்னும் உங்கள் பாவங்களிலேயே இருக்கிறீர்கள்.
  to: ஆனால் மேசியா உயிர்த்தெழுப்பப்படவில்லை என்றால்[a], உங்கள் விசுவாசம் பயனற்றது[b]; நீங்கள் உங்கள் பாவங்களில் இன்னும் இருக்கிறீர்கள்.
