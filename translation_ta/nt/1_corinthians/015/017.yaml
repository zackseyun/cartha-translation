id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: ta
  text: ஆனால் மேசியா உயிர்த்தெழுப்பப்படவில்லை என்றால்[a], உங்கள் விசுவாசம் பயனற்றது[b]; நீங்கள் உங்கள் பாவங்களில் இன்னும் இருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேசியா’ என்பதற்குப் பதிலாக ‘கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘வீணானது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: மேசியா
  rationale: Χριστός இங்கு இயேசுவின் மேசியா என்ற பட்டத்தையும் இறையியல் பங்கையும் முன்னிறுத்துவதால், மரபுவழிப் பெயர்வடிவமான ‘கிறிஸ்து’ என்பதற்குப் பதிலாக ‘மேசியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐγήγερται
  choice: உயிர்த்தெழுப்பப்படவில்லை
  rationale: Perfect passive வடிவத்தையும் உயிர்த்தெழுதல் நிகழ்வின் தொடரும் விளைவையும் இயன்றவரை காக்கிறது; செயலைச் செய்தவர் யார் என்று கிரேக்கம் வெளிப்படையாகக் கூறாததால் தமிழிலும் சேர்க்கப்படவில்லை.
- source_word: ματαία
  choice: பயனற்றது
  rationale: இந்தச் சூழலில் நம்பிக்கை எந்தப் பயனையும் விளைவிக்காது என்ற கருத்தை இயல்பான நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இங்கு கொரிந்தியர்களின் நம்பும் பதிலையே குறிக்கிறது; அவர்களுடைய விசுவாசத்தன்மையை அல்ல.
- source_word: ἔτι
  choice: இன்னும்
  rationale: மாறாமல் தொடரும் நிலையைக் குறிக்கும் கிரேக்கச் சொல்லின் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: உங்கள் பாவங்களிலேயே
  rationale: பாவங்களுடன் தொடர்புடைய தொடரும் நிலையைச் சுட்டும் ἐν அமைப்பைத் தக்கவைத்து, -ஏ வலியுறுத்தலால் ἔτι உடன் வரும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வாதத்துடன் உள்ள முரண்பாட்டைத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் சொல்லாக்கமும் செய்பவரும்
  choice: உயிர்த்தெழுப்பப்படவில்லை
  alternative: உயிர்த்தெழவில்லை
  rationale: கிரேக்க வினையின் passive வடிவத்தைப் பாதுகாத்து, மறைமுகமாகத் தெரியும் தெய்வீகச் செயலை வெளிப்படையாக ‘தேவன்’ என்று விரிவாக்காமல் விடுகிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்வசனத்தில் இது வெறும் பெயர்போல அல்லாமல் அபிஷேகம் பெற்றவருக்கான பட்டமாக இறையியல் வாதத்தில் செயல்படுவதால் ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: பாவங்களில் இருத்தல்
  choice: உங்கள் பாவங்களிலேயே இருக்கிறீர்கள்
  alternative: உங்கள் பாவங்களின் கீழ் இருக்கிறீர்கள்
  rationale: கிரேக்கத்தின் இடவியல் உருவகத்தைத் தக்கவைத்து, குற்றம், ஆட்சி அல்லது விளைவு ஆகியவற்றில் ஒன்றை மட்டும் விளக்கமாகத் தேர்ந்தெடுத்து மற்ற சாத்தியங்களை ஒழிக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உயிர்த்தெழுப்பப்படவில்லை’ என்ற passive வடிவம் சற்றே முறையானதாக இருந்தாலும், மூலத்தின் இலக்கண வடிவத்தையும் கூறப்படாத செய்பவரையும் பாதுகாக்கிறது. ‘உங்கள் பாவங்களிலேயே’ என்பது கிரேக்கத்தின் திறந்த உருவகத்தையும் வலியுறுத்தலையும் தக்கவைக்கிறது.
