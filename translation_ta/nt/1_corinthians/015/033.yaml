translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பழமொழியின் சுருக்கமான எச்சரிக்கைத் தொனியைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டது. மேற்கோள் குறிகள் இவ்வாக்கியம் ஒரு பழமொழி அல்லது மேற்கோள் போன்று அமைந்திருப்பதைத் தெளிவாக்குகின்றன.
