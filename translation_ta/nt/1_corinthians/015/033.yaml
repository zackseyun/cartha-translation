  text: μὴ πλανᾶσθε· φθείρουσιν ἤθη χρηστὰ ὁμιλίαι κακαί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/033.yaml
  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: ta
  text: 'ஏமாறாதீர்கள்: தீய சகவாசம் நல்ல ஒழுக்கங்களைக் கெடுக்கும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீய உரையாடல்கள் நல்ல ஒழுக்கங்களைக் கெடுக்கும்.” கிரேக்கச் சொல் சகவாசத்தையோ உரையாடலையோ குறிக்கலாம்; இச்சூழலில் “சகவாசம்” என்ற பரந்த பொருள் பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: ஏமாந்துபோகாதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை வடிவத்தின் எச்சரிக்கையை இயல்பான நவீன தமிழில் தருகிறது; ஒருவர் தம்மைத்தாமே ஏமாற்றுகிறாரா அல்லது பிறரால் ஏமாற்றப்படுகிறாரா என்பதைத் தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: φθείρουσιν
  choice: கெடுத்துவிடும்
  rationale: நல்ல ஒழுக்கம் சீரழிவதைத் தெளிவாகவும் பழமொழிக்கேற்ற இயல்புடனும் குறிக்கிறது; ‘அழித்துவிடும்’ என்பதைக் காட்டிலும் அளவானது.
- source_word: ἤθη
  choice: ஒழுக்கங்கள்
  rationale: ἤθη என்பதன் பன்மையையும், வெறும் சமூக மரியாதை முறைகளல்லாமல் நெறிசார் பழக்கங்களையும் பண்புகளையும் குறிக்கும் பொருளையும் காக்கிறது.
- source_word: χρηστὰ
  choice: நல்ல
  rationale: இங்கு ஒழுக்கங்களின் நெறிசார் நன்மையை எளிமையாகவும் கூடுதல் விளக்கமின்றியும் தெரிவிக்கிறது.
- source_word: ὁμιλίαι
  choice: சகவாசம்
  rationale: இச்சொல் உரையாடலையோ பழக்கவழக்கத் தொடர்பையோ குறிக்கலாம்; சூழலில் ஒருவரோடு ஒருவர் கொண்டிருக்கும் தொடர்பு அல்லது கூட்டுறவு என்ற பரந்த பொருளை ‘சகவாசம்’ இயல்பாகத் தருகிறது.
- source_word: κακαί
  choice: தீய
  rationale: தார்மீகமாகத் தீங்கு விளைவிக்கும் தொடர்பைச் சுருக்கமாகக் குறிக்கிறது; தொடர்ந்து வரும் ‘கெடுத்துவிடும்’ என்பதுடன் தேவையற்ற சொற்பொருள் மறுபதிப்பை ஏற்படுத்தவில்லை.
