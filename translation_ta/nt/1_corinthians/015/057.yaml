  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: ta
  text: ஆனால், நம் ஆண்டவரும் மேசியாவுமான[a] இயேசுவின் வழியாக நமக்கு வெற்றியைத் தருகிற கடவுளுக்கு நன்றி!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மரபான மொழிபெயர்ப்பு: “இயேசு கிறிஸ்து.” கிரேக்கச் சொல்லான Χριστός என்பதன் பொருள் “மேசியா,” அதாவது “அபிஷேகம் செய்யப்பட்டவர்.”'
    reason: Χριστός என்ற பட்டத்தின் பொருள் சார்ந்த மொழிபெயர்ப்பையும் மரபான ஒலிபெயர்ப்பையும் காட்டுவதற்கான மாற்று வாசிப்பு.
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட மரணத்தின் வல்லமைக்கு மாறாக, கடவுள் அளிக்கும் வெற்றியை நன்றியுடன் அறிவிக்கும் திருப்பத்தை இது இயல்பாகக் காட்டுகிறது.
- source_word: χάρις
  choice: நன்றி
  rationale: இங்கு χάρις என்பது ‘அருள்’ என்ற பொருளில் அல்லாமல், கடவுளை நோக்கிய நன்றியறிவிப்புச் சொற்றொடரில் வருகிறது. ‘கடவுளுக்கு நன்றி!’ என்பது அதன் துதிப்பாங்கை இயல்பான தமிழில் காக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: நன்றியைப் பெறுபவரைக் குறிக்கும் கிரேக்க வேற்றுமைத் தொடர்பைத் தமிழின் நான்காம் வேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῷ διδόντι
  choice: தருகிற
  rationale: பெயரடைத் தன்மையுடன் வரும் நிகழ்காலப் பங்கேற்புச் சொல், கடவுளை வெற்றியை அளிப்பவராக விவரிக்கிறது; ‘தருகிற’ அதன் தொடரும் அல்லது பொதுவான செயற்பாட்டை காக்கிறது.
- source_word: ἡμῖν
  choice: நமக்கு
  rationale: வெற்றியைப் பெறுகிறவர்களாகச் சூழலில் உள்ள விசுவாசிகளை உள்ளடக்கும் பன்மையை நேரடியாகத் தருகிறது.
- source_word: τὸ νῖκος
  choice: வெற்றியை
  rationale: முந்தைய சூழலில் மரணத்தின்மேல் பெறப்படும் குறிப்பிட்ட வெற்றியைக் குறிக்கிறது. தமிழில் ‘வெற்றியை’ என்பது தெளிவும் இயல்பும் வாய்ந்தது.
- source_word: διὰ
  choice: வழியாக
  rationale: γενitive உடன் வரும் διά இங்கு வழிமுறை அல்லது இடைமுகச் செயற்பாட்டைக் குறிக்கிறது; ‘வழியாக’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοῦ κυρίου ἡμῶν
  choice: நம் ஆண்டவரும்
  rationale: κύριος என்பதன் கிறிஸ்துவியல் பட்டத்தை ‘ஆண்டவர்’ என்றும், ἡμῶν என்பதை ‘நம்’ என்றும் காக்கிறது. அடுத்த பட்டத்துடன் இயல்பான தமிழில் இணைக்க ‘-உம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மேசியாவுமான இயேசுவின்
  rationale: Ἰησοῦ என்பது ‘இயேசு’ என ஒலிபெயர்க்கப்படுகிறது; Χριστός என்பதன் பட்டப் பொருள் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது. ‘ஆண்டவரும் மேசியாவுமான இயேசு’ என்ற அமைப்பு, இயேசுவே அந்த மேசியா என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστός-ஐப் பட்டமாகவா, பெயரின் நிலையான பகுதியாகவா வழங்குவது
  choice: முதன்மை உரையில் ‘மேசியா’
  alternative: ‘கிறிஸ்து’ — ‘நம் ஆண்டவராகிய இயேசு கிறிஸ்துவின் வழியாக’
  rationale: Χριστός என்பதன் மூலப் பட்டப் பொருளை வெளிப்படையாகக் காக்க ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது. தமிழ்க் கிறிஸ்தவ மரபில் பரவலாக உள்ள ‘கிறிஸ்து’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது; இதனால் பட்டத்தின் பொருளையும் மரபான வாசிப்பையும் ஒன்றை ஒன்று மறைக்காமல் பாதுகாக்க முடிகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் நன்றியறிவிப்பின் துதிப்பாங்கைத் தக்கவைக்கும் வகையிலும் மொழியாக்கப்பட்டுள்ளது. ‘நம் ஆண்டவரும் மேசியாவுமான இயேசு’ என்பது பட்டங்களைத் தெளிவாகவும் தமிழுக்கு இயல்பாகவும் இணைக்கிறது.
