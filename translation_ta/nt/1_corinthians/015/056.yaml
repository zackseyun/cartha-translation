translation:
  language: ta
  text: மரணத்தின் கொடுக்கு பாவம்; பாவத்தின் வல்லமை[a] சட்டம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “வலிமை”: “பாவத்தின் வலிமை சட்டம்.”'
    reason: lexical_alternative
  - marker: b
    text: பவுலின் வாதத்தில் “சட்டம்” என்பது குறிப்பாக மோசேயின் சட்டத்தைக் குறிக்க வாய்ப்புள்ளது. ஆயினும், பாவத்தை வெளிப்படுத்தி அதைத் தீவிரப்படுத்துவதில் சட்டத்துக்குள்ள பங்கைப் பொதுவாகக் குறிக்கும் பொருளையும் இச்சொல்லாக்கம் அனுமதிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: கொடுக்கோ
  rationale: κέντρον என்பதன் கூர்மையான, தீங்கிழைக்கும் கருவி என்ற உருவகப் பொருளை ‘கொடுக்கோ’ இயல்பாக வெளிப்படுத்துகிறது; மரணம் ஆளுருவகப்படுத்தப்படும் இச்சூழலில் ‘முள்’ அல்லது ‘தாற்றுக்கோல்’ என்பதைக் காட்டிலும் இது பொருத்தமானது. ‘-ஓ’ இணைப்பு வாக்கியத்தின் தலைப்பையும் இணையான அமைப்பையும் காட்டுகிறது.
- source_word: θανάτου
  choice: மரணத்தின்
  rationale: மரணத்துக்குரிய கொடுக்கு என்ற உடைமை அல்லது தொடர்புப் பொருளை நேரடியாகத் தக்கவைக்கிறது.
- source_word: ἁμαρτία
  choice: பாவம்
  rationale: தனித்தனியான பாவச்செயல்களைக் காட்டிலும் பாவத்தை ஒரு ஆற்றலாக அல்லது கோட்பாடாகக் குறிப்பிடும் பவுலின் ஒருமைப் பயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: δύναμις
  choice: வல்லமை
  rationale: பாவம் செயல்படுவதற்கான ஆற்றல் அல்லது திறனைத் தெரிவிக்கிறது. ‘பலன்’ அல்லது ‘வலிமை’ என்பவற்றைவிட இங்கு இறையியல் கருத்தையும் இயல்பான தமிழையும் நன்றாக இணைக்கிறது.
- source_word: νόμος
  choice: சட்டம்
  rationale: கிரேக்கச் சொல்லைத் தேவையின்றி மோசேயின் சட்டத்துக்கு மட்டும் குறுக்காமல், சட்டம் என்ற பொதுவான வடிவில் தருகிறது; அதேவேளை பவுலின் சூழலில் மோசேயின் சட்டம் சிறப்பாகக் குறிக்கப்படலாம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: δὲ
  choice: -ஓ ... -ஓ
  rationale: இரு கூறுகளையும் இணையான விளக்கக் கூற்றுகளாக முன்னிறுத்துகிறது; மூலத்தில் இல்லாத காலக் குறிப்பு அல்லது வலுவான முரண்பாட்டைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘சட்டம்’ என்பது மோசேயின் சட்டத்தை மட்டும் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘சட்டம்’ என்று பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மோசேயின் சட்டம்’ அல்லது ‘திருச்சட்டம்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: பவுலின் வாதத்தில் மோசேயின் சட்டம் முக்கியமாக மனதில் இருக்க வாய்ப்புள்ளது. எனினும், கிரேக்கச் சொற்றொடர் சட்டம் பாவத்தை வெளிப்படுத்தி தீவிரப்படுத்தும் பரந்த பங்கையும் அனுமதிப்பதால், முதன்மை உரை அந்த இறையியல் இழுபறியைத் தீர்மானித்துவிடாமல் தக்கவைக்கிறது.
- issue: சட்டம் பாவத்தின் δύναμις எனப்படுவதன் தன்மை
  choice: ‘வல்லமை’ என்று மொழிபெயர்த்து, சட்டமே பாவம் என்று கூறாமல் பாவத்தின் செயலாற்றலோடு அதற்குள்ள தொடர்பைத் தக்கவைத்தல்.
  alternative: ‘வலிமை’ என்று மொழிபெயர்த்தல்.
  rationale: மூலவாக்கியம் சட்டம் பாவத்துக்கு எந்த விதத்தில் ஆற்றல் அளிக்கிறது என்பதை இங்கே விளக்கவில்லை. ஆகவே மொழிபெயர்ப்பு காரணவியல் விளக்கத்தைச் சேர்க்காமல் கூற்றின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான, இணையான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ என்பதற்குப் பதிலாக இன்றைய வாசகர்களுக்கு எளிதில் புரியும் ‘சட்டம்’ தேர்ந்தெடுக்கப்பட்டது; அதன் சாத்தியமான மோசேயச் சார்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
