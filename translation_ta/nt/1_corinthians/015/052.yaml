id: 1CO.15.52
reference: 1 Corinthians 15:52
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: ta
  text: ஒரு கணப்பொழுதில்[a], கண் இமைக்கும் நேரத்தில், கடைசி எக்காளம் முழங்கும்போது, நாம் மாற்றப்படுவோம். ஏனெனில், எக்காளம் முழங்கும்; இறந்தவர்கள் அழிவற்றவர்களாக எழுப்பப்படுவார்கள்; நாமும் மாற்றப்படுவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிரிக்க முடியாத கணத்தில்.’ கிரேக்கச் சொல் மிகக் குறுகிய காலப்பொழுதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: ஒரு கணப்பொழுதில்
  rationale: ἄτομος என்பதன் அடிப்படைப் பொருள் ‘பிரிக்க முடியாதது’; இங்கு அது மிகமிகக் குறுகிய காலப்பொழுதைக் குறிக்கிறது. ‘ஒரு கணப்பொழுதில்’ என்பது அந்தத் திடீர்த் தன்மையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: கண் இமைக்கும் நேரத்தில்
  rationale: கண்ணின் மிக விரைவான அசைவைக் குறிக்கும் இந்தச் சொற்றொடர், நிகழ்வின் அதிவேகத்தையும் திடீர்த் தன்மையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: கடைசி எக்காளம் முழங்கும்போது
  rationale: ἐν இங்கு காலத்தைக் குறிக்கிறது. ‘கடைசி’ என்பது ἐσχάτῃ என்பதைக் நேரடியாகப் பாதுகாக்கிறது; ‘முழங்கும்போது’ என்பது தமிழில் நிகழ்வின் நேரத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: σαλπίσει
  choice: எக்காளம் முழங்கும்
  rationale: வினைச்சொல் எக்காளம் ஊதப்படுவதையோ அதன் ஒலி எழுவதையோ குறிக்கிறது. முன் குறிப்பிடப்பட்ட எக்காளத்தையே எழுவாயாக வெளிப்படுத்துவது தமிழில் இயல்பாக உள்ளது.
- source_word: οἱ νεκροὶ
  choice: இறந்தவர்கள்
  rationale: இது இறந்த மனிதர்களைக் கூட்டாகக் குறிக்கும் பெயராக்கப்பட்ட பெயரடை; ‘இறந்தவர்கள்’ தெளிவான இயல்புத் தமிழ்.
- source_word: ἐγερθήσονται
  choice: எழுப்பப்படுவார்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, உயிர்த்தெழுதல் சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἄφθαρτοι
  choice: அழிவற்றவர்களாக
  rationale: சிதைவு, அழுகை, அழிவு ஆகியவற்றுக்கு உட்படாத நிலையை இச்சொல் குறிக்கிறது. சூழலில் மனிதர்களைக் குறிப்பதால் ‘அழிவற்றவர்களாக’ இயல்பாக அமைகிறது.
- source_word: ἡμεῖς
  choice: நாமும்
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் வலியுறுத்தலுடனும் உள்ள முதல் நபர் பன்மையைப் பாதுகாக்கிறது; ‘-உம்’ இறந்தவர்களுடன் உள்ள இணைநிலையையும் வேறுபாட்டையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἀλλαγησόμεθα
  choice: மாற்றப்படுவோம்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் ‘மாற்றுதல்’ என்ற நேரடிப் பொருளையும் பாதுகாக்கிறது; மாற்றத்தின் தன்மையை மொழிபெயர்ப்பிலேயே கூடுதலாக வரையறுக்கவில்லை.
theological_decisions:
- issue: கடைசி எக்காளத்தை ஒரு குறிப்பிட்ட இறுதிக்கால அமைப்புடன் இணைக்காமல் மொழிபெயர்த்தல்
  choice: கடைசி எக்காளம் முழங்கும்போது
  alternative: இறுதி எக்காளம் முழங்கும்போது
  rationale: மூலம் ‘கடைசி எக்காளம்’ என்று கூறுவதைக் காக்கிறது; ஆனால் அது எந்த விரிவான இறுதிக்கால நிகழ்வமைப்பைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
- issue: உயிர்த்தெழுப்பப்படும் இறந்தவர்களுக்கும் மாற்றப்படும் ‘நாம்’ என்பவர்களுக்கும் உள்ள தொடர்பு
  choice: நாமும் மாற்றப்படுவோம்
  alternative: அப்போது உயிரோடிருக்கும் நாமும் மாற்றப்படுவோம்
  rationale: ἡμεῖς என்ற வெளிப்படையான பிரதிப்பெயரை அப்படியே பாதுகாக்கிறது. ‘அப்போது உயிரோடிருக்கும்’ என்பது சூழலிலிருந்து பெறக்கூடிய விளக்கம் என்றாலும், இவ்வசனத்தின் சொற்களில் இல்லாததால் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், பொதுவாசிப்புக்கும் சபை வாசிப்புக்கும் ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘இது நிகழும்’ என்பது முந்தைய வசனத்தில் கூறப்பட்ட மாற்றத்துடன் இவ்வசனத்தின் காலக் கூறுகளை இயல்பாக இணைக்கும் குறைந்தபட்சத் தமிழ் நிறைவு; புதிய இறையியல் தகவலைச் சேர்ப்பதில்லை.
