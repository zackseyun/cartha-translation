source:
  edition: SBLGNT
  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: ta
  text: எல்லா மாம்சமும் ஒரேவிதமான மாம்சம் அல்ல[a]. ஆனால் மனிதர்களுடைய மாம்சம் ஒருவகை; விலங்குகளுடையது வேறொரு வகை; பறவைகளுடையது வேறொரு வகை; மீன்களுடையது வேறொரு வகை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இயல்பான நடையில்: “எல்லா வகை மாம்சமும் ஒரே மாதிரியானது அல்ல.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὰρξ
  choice: மாம்சம்
  rationale: இங்கு இச்சொல் பாவ இயல்பைக் குறிக்கும் உருவகப் பொருளில் அல்லாமல், படைக்கப்பட்ட உயிரினங்களின் உடல்சார்ந்த தன்மையை நேரடியாகக் குறிக்கிறது. ‘மாம்சம்’ என்பதால் பவுலின் சொல்லாட்சியும் முதல் வாக்கியத்தில் உள்ள மீளுரையும் காக்கப்படுகின்றன.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: எல்லா மாம்சமும் ஒரேவிதமான மாம்சம் அல்ல
  rationale: கிரேக்கத்தின் மறுப்பையும் σὰρξ என்ற சொல்லின் மீளுரையையும் காத்து, உயிரின வகைகளுக்கிடையிலான வேறுபாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἄλλη
  choice: வேறுவிதம்
  rationale: ἄλλη ஒவ்வொரு வகையும் மற்றவற்றிலிருந்து வேறுபட்டது என்பதைக் குறிக்கிறது. ‘வேறுவிதம்’ என்ற மீளுரை கிரேக்கப் பட்டியலின் சொல்நயத்தைக் காக்கிறது.
- source_word: ἀνθρώπων
  choice: மனிதர்களுடைய
  rationale: இது ஆண்களை மட்டும் அல்லாமல் மனிதர்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: κτηνῶν
  choice: விலங்குகளுடைய
  rationale: κτηνῶν வளர்ப்பு விலங்குகளையோ விலங்குகளைப் பொதுவாகவோ குறிக்கலாம். இப்பட்டியலில் ‘விலங்குகள்’ என்பது தேவையற்ற குறுக்கத்தைத் தவிர்க்கும் தெளிவான பொதுப்பெயர்.
- source_word: πτηνῶν
  choice: பறவைகளுடைய
  rationale: பறக்கும் உயிரினங்கள் என்ற விரிந்த சாத்தியம் இருந்தாலும், இவ்வுயிரினப் பட்டியலில் ‘பறவைகள்’ என்பது இயல்பானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: ἰχθύων
  choice: மீன்களுடைய
  rationale: கிரேக்கப் பன்மை இங்கு மீன் இனத்தைப் பொதுவாகக் குறிக்கிறது; தமிழில் ‘மீன்கள்’ இயல்பாக அதைக் காட்டுகிறது.
- source_word: σὰρξ κτηνῶν / σὰρξ πτηνῶν / ἰχθύων
  choice: விலங்குகளுடையது ... பறவைகளுடையது ... மீன்களுடையது
  rationale: தமிழில் ‘மாம்சம்’ என்பதை ஒவ்வொரு முறையும் வெளிப்படையாக மீண்டும் கூறுவது கனமாக இருக்கும். ‘உடையது’ முந்திய ‘மாம்சம்’ என்பதை இயல்பாக எடுத்துக்கொண்டு, பட்டியலின் இணை அமைப்பைக் காக்கிறது.
theological_decisions:
- issue: பவுலின் இப்பகுதியில் σάρξ என்பதன் பொருள்
  choice: நேரடிப் பொருளில் ‘மாம்சம்’
  alternative: உடல்; இயல்பு; பாவ இயல்பு
  rationale: உயிர்த்தெழுதல் மற்றும் படைக்கப்பட்ட உயிரினங்களின் வெவ்வேறு உடல்சார்ந்த அமைப்புகள் இச்சூழலின் பொருள். ஆகவே உருவகமான ‘பாவ இயல்பு’ என்பதைச் சேர்க்காமல் நேரடிப் பொருளைக் காக்க வேண்டும்.
translation_notes:
  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. ‘மாம்சம்’ என்ற வேதாகமச் சொல்லாட்சி காக்கப்பட்டாலும், பின்னர் வரும் பட்டியலில் ‘உடையது’ மற்றும் ‘வேறுவிதம்’ பயன்படுத்தப்பட்டு தமிழின் இயல்பான ஓட்டமும் கிரேக்கத்தின் இணை அமைப்பும் சமநிலைப்படுத்தப்பட்டுள்ளன.
