source:
  edition: SBLGNT
  text: δεῖ γὰρ αὐτὸν βασιλεύειν ἄχρι ⸀οὗ θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: ta
  text: ஏனெனில், அவர் தம்முடைய பகைவர்கள் அனைவரையும் தமது பாதங்களுக்குக் கீழாக வைக்கும்வரை[a] ஆட்சி செய்ய வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தம்முடைய பகைவர்கள் அனைவரையும் தமது பாதங்களுக்குக் கீழாக வைத்துவிடும்வரை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை வடிவம் இவ்விரு தமிழ்க் கால/நிறைவுநிலைத் தேர்வுகளில் ஒன்றைக் கட்டாயப்படுத்துவதில்லை.
    reason: lexical_alternative
  - marker: b
    text: பகைவர்கள் ‘பாதங்களுக்குக் கீழாக’ வைக்கப்படுவது அவர்கள் முழுமையாகக் கீழ்ப்படுத்தப்படுவதைக் குறிக்கும் வேதாகம உருவகம்; சங்கீதம் 110:1-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: செய்யவேண்டும்
  rationale: இது தேவையானதையும் இறைத்திட்டத்தின்படி நிகழ வேண்டிய உறுதியையும் வெளிப்படுத்துகிறது; தமிழில் இயல்பாக வினையுடன் இணைக்கப்பட்டுள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: αὐτὸν
  choice: அவர்
  rationale: கிரேக்கத்தில் முடிவிலி வினையின் எழுவாயாக வேற்றுமை வடிவில் இருந்தாலும், இயல்பான தமிழில் மரியாதை ஒருமை எழுவாயாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: βασιλεύειν
  choice: ஆட்சி செய்ய
  rationale: அரசராக ஆளுதல் என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘அரசாள’ என்பதைக் காட்டிலும் பொதுவாக எளிதில் புரியும்.
- source_word: ἄχρι οὗ
  choice: வைக்கும்வரை
  rationale: குறிப்பிட்ட நிகழ்வு நிறைவேறும் வரையிலான கால எல்லையைத் தெரிவிக்கிறது; அதற்குப் பின்பு ஆட்சி முடிவதாகத் தானாகக் கூறுவதில்லை.
- source_word: θῇ
  choice: வைக்கும்வரை
  rationale: τίθημι என்பதன் ‘வை/இடு’ என்ற அடிப்படைப் பொருளையும், பகைவர்கள் காலடியில் முழுமையாக அடக்கப்படும் உருவகத்தையும் காக்கிறது. கிரேக்க வினை வடிவம் தமிழில் இயல்பான ‘-ம்வரை’ கட்டமைப்பால் வழங்கப்பட்டுள்ளது.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: தம்முடைய பகைவர்கள் அனைவரையும்
  rationale: πάντας என்பதன் முழுமையையும், αὐτοῦ உடனான இயல்பான தொடர்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: தமது காலடியில்
  rationale: முழுமையான கீழ்ப்படுத்தலைக் குறிக்கும் வேதாகம உருவகத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: ἄχρι οὗ (‘வரை’) என்பதன் காலப் பொருள்
  choice: ‘வைக்கும்வரை’ என்று மொழிபெயர்த்து, அதன் பின்னர் மெசியாவின் ஆட்சி முடிவடைகிறது என்று பொருள் சேர்க்கப்படவில்லை.
  alternative: பகைவர்கள் அடக்கப்பட்டதும் அவரது ஆட்சி முடியும் என்று வெளிப்படையாக உணர்த்தும் மொழிபெயர்ப்பு.
  rationale: கிரேக்கச் சொற்றொடர் இங்கு கவனத்தில் உள்ள கால எல்லையைக் குறிப்பிடுகிறது; அதற்குப் பின்னர் செயல் நிற்கும் என்று அது தனித்தே உறுதிப்படுத்துவதில்லை. ஆகவே மூலத்தில் உள்ள இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
- issue: θῇ என்ற வினையின் எழுவாய்
  choice: சூழலுக்கும் வாக்கிய இலக்கணத்திற்கும் ஏற்ப ‘அவர் ... வைக்கும்வரை’ என்று வழங்கப்பட்டுள்ளது.
  alternative: வெளிப்படையாகக் குறிப்பிடப்படாத வேறொரு செய்பவரைச் சேர்த்து, ‘கடவுள் அவரது பகைவர்களை வைக்கும்வரை’ என்று மொழிபெயர்த்தல்.
  rationale: இவ்வாக்கியத்தின் இயல்பான இலக்கணத் தொடர்ச்சி αὐτόν என்பதையே θῇ வினையின் புரிந்துகொள்ளப்படும் எழுவாயாக எடுத்துக்கொள்ள அனுமதிக்கிறது. மூலத்தில் இல்லாத பெயரெழுவாயைச் சேர்க்காமல் இருப்பது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆட்சி செய்யவேண்டும்’ என்பது δεῖ மற்றும் βασιλεύειν ஆகியவற்றின் பொருளை இயல்பாக இணைக்கிறது. மரியாதை ஒருமைக்கேற்ப ‘தம்முடைய/தமது’ பயன்படுத்தப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
