source:
  edition: SBLGNT
  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: ta
  text: இயற்கையான உடலாக விதைக்கப்படுகிறது; ஆவிக்குரிய உடலாக எழுப்பப்படுகிறது. இயற்கையான உடல் இருந்தால்[a], ஆவிக்குரிய உடலும் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆத்துமாவுக்குரிய உடல்’ என்றும் மொழிபெயர்க்கலாம். பவுல் இங்கே பொருளாலான உடலையும் பொருளற்ற உடலையும் எதிரெதிராக வைக்கவில்லை; சாதாரண மனித உயிரால் உயிரூட்டப்படும் உடலையும் ஆவியால் உயிரூட்டப்படும் உடலையும் வேறுபடுத்துகிறார்.
    reason: ψυχικόν என்பதற்கான சொற்பொருள் மாற்றைச் சுட்டி, ‘இயற்கையான/ஆவிக்குரிய’ என்ற எதிரிணை பொருளுள்ள உடல்–பொருளற்ற உடல் என்று தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
lexical_decisions:
- source_word: σπείρεται
  choice: விதைக்கப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும், முந்தைய வசனங்களில் வரும் விதை–உயிர்த்தெழுதல் உருவகத்தையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: இறப்பிலும் உயிர்த்தெழுதலிலும் மனிதரின் உடல்சார்ந்த இருப்பைக் குறிக்கும் இயல்பான, நேரடியான நவீனத் தமிழ்ச் சொல்.
- source_word: ψυχικόν
  choice: இயற்கையான
  rationale: πνευματικόν என்பதற்கு எதிராக, சாதாரண மனித உயிரால் அமைந்த இப்போதைய உடலைக் குறிக்கிறது. ‘ஆத்துமாவுக்குரிய’ என்பது இன்றைய வாசகருக்கு தெளிவற்றதாகவும் உடல்–ஆத்துமா பிரிவைத் தவறாக உணர்த்தக்கூடியதாகவும் இருப்பதால் தவிர்க்கப்பட்டது; ‘உடல்சார்ந்த’ என்பது பொருளுள்ள உடல்–பொருளற்ற உடல் என்ற தவறான எதிர்மறையை உருவாக்கலாம்.
- source_word: ἐγείρεται
  choice: எழுப்பப்படுகிறது
  rationale: செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, உயிர்த்தெழுதலைக் குறிக்கும் தெளிவான தமிழ்ச் சொல்லாட்சியை வழங்குகிறது.
- source_word: πνευματικόν
  choice: ஆவிக்குரிய
  rationale: பவுலின் ψυχικόν–πνευματικόν எதிரிணையைப் பாதுகாக்கிறது. இது உடலற்றது என்று அல்ல, ஆவியால் இயல்புபடுத்தப்பட்ட உயிர்த்தெழுந்த உடல் என்று சூழலில் புரிந்துகொள்ளப்பட வேண்டும்.
- source_word: Εἰ
  choice: இருக்குமானால்
  rationale: கிரேக்க நிபந்தனை வடிவத்தை, அதை ‘இருப்பதால்’ என்று தீர்மானமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: καὶ
  choice: -உம்
  rationale: ‘ஆவிக்குரிய உடலும்’ என்ற இணைப்பு, இரண்டாவது வகை உடலும் இருக்கிறது என்னும் சேர்க்கைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘இயற்கையான உடல்’ மற்றும் ‘ஆவிக்குரிய உடல்’ என்பவற்றின் எதிரிணை
  choice: பொருளாலான உடல் மற்றும் பொருளற்ற இருப்பு என்ற எதிரிணையாக அல்லாமல், சாதாரண மனித உயிர்க்குரிய உடல் மற்றும் ஆவிக்குரிய உடல் என்ற பவுலின் சொல்லாட்சியை முதன்மை உரை தக்கவைக்கிறது.
  alternative: ‘உடல்சார்ந்த உடல்’ எதிராக ‘ஆவி உடல்’; அல்லது ‘ஆத்துமாவுக்குரிய உடல்’ எதிராக ‘ஆவிக்குரிய உடல்’.
  rationale: உயிர்த்தெழுந்த இருப்பையும் பவுல் σῶμα, ‘உடல்’, என்றே அழைக்கிறார். ஆகவே πνευματικόν என்பது உடலற்ற தன்மையைக் கட்டாயமாகக் குறிக்காது. அதேவேளை அது ‘ஆவியால் இயக்கப்படும்’ என்று மட்டும் விரித்துரைக்கப்படாமல், மூலத்தின் சுருக்கமும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட சுருக்கமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சரீரம்’, ‘ஜென்ம சரீரம்’ போன்ற பழைய அல்லது சமயவழக்குச் சொற்களுக்கு பதிலாக ‘உடல்’, ‘இயற்கையான உடல்’ பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் இணையான இரு செயப்பாட்டு வாக்கியங்களும் தமிழில் பாதுகாக்கப்பட்டுள்ளன.
