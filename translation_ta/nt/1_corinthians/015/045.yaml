reference: 1 Corinthians 15:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: ta
  text: 'அவ்வாறே எழுதப்பட்டிருக்கிறது: “முதல் மனிதனாகிய ஆதாம் உயிருள்ள மனிதனானான்”[a]; கடைசி ஆதாம் உயிரளிக்கும் ஆவியானார்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிருள்ள ஆத்துமா.” இது ஆதியாகமம் 2:7-ன் பாரம்பரிய மொழிபெயர்ப்பை எதிரொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உயிரளிக்கும் ஆவியாக ஆனார்.” இச்சொற்றொடர் முதல் ஆதாமுக்கு மாறாகக் கடைசி ஆதாமை விவரிக்கிறது. கிரேக்கச் சொற்றொடர் பண்புரீதியானது; கிறிஸ்துவைப் பரிசுத்த ஆவியானவர் என்ற தனித்த நபரோடு வெளிப்படையாக அடையாளப்படுத்துவது அவசியமில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: அவ்வாறே எழுதப்பட்டிருக்கிறது
  rationale: οὕτως καὶ என்பது முந்தைய வாதத்துடன் வேதமேற்கோளை இணைக்கிறது; γέγραπται என்பதற்குரிய நிலைத்த வேதவாக்கு சூத்திரத்தையும் தமிழ் இயல்பில் காக்கிறது.
- source_word: Ἐγένετο
  choice: ஆனான் / ஆனார்
  rationale: γίνομαι இங்கு ஒரு விளைவு நிலையைச் சுட்டுகிறது. ஆதாமுக்கும் கடைசி ஆதாமுக்கும் ஒரே வினைச்சொல் அமைப்பைத் தக்கவைத்து, தமிழின் மரியாதை ஒருமையால் கிறிஸ்துவைக் குறிக்கும் இரண்டாம் இடத்தில் ‘ஆனார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ πρῶτος ἄνθρωπος Ἀδὰμ
  choice: முதல் மனிதனாகிய ஆதாம்
  rationale: ἄνθρωπος இங்கு மனிதகுலத்தின் பிரதிநிதியான ஆண் ஆதாமைக் குறிக்கிறது; ‘மனிதன்’ பாலினத்தையும் ஆதாம்–கிறிஸ்து மாதிரி ஒப்புமையையும் காக்கிறது.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: உயிருள்ள ஓர் உயிரினம்
  rationale: ஆதியாகமம் 2:7-ஐ எதிரொலிக்கும் இச்சொற்றொடரில் ψυχή பிரிக்கத்தக்க பொருளற்ற ஆன்மாவை மட்டும் அல்லாமல் உயிர்பெற்ற முழு உயிரினத்தைக் குறிக்கிறது. ‘உயிரினம்’ மூலத்தின் படைப்பியல் பொருளைக் காக்கிறது; பாரம்பரிய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: கடைசி ஆதாம்
  rationale: பவுலின் ஆதாம்–கிறிஸ்து மாதிரி எதிர்மறை ஒப்புமையையும் ἔσχατος என்பதன் இறுதியான தன்மையையும் நேரடியாகக் காக்கிறது.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: உயிரளிக்கும் ஆவி
  rationale: πνεῦμα இங்கு சுட்டுரையில்லாமல் பண்புரீதியாக வருகிறது; ζῳοποιοῦν என்பது ‘உயிரளிக்கும்’ அல்லது ‘உயிர்ப்பிக்கும்’ எனப் பொருள்படும். இந்தத் தேர்வு கடைசி ஆதாமின் உயிரளிக்கும் தன்மையைச் சொல்கிறது; பரிசுத்த ஆவியானவரோடு வெளிப்படையான தனிநபர் அடையாளப்படுத்தலை மொழிபெயர்ப்பில் சேர்ப்பதில்லை.
theological_decisions:
- issue: ஆதியாகம மேற்கோளில் ψυχή என்பதன் மனிதவியல் பொருள்
  choice: ‘உயிருள்ள ஓர் உயிரினம்’ என்று மொழிபெயர்த்தல்
  alternative: ‘உயிருள்ள ஓர் ஆத்துமா’
  rationale: இச்சூழலில் ஆதாம் உயிர்பெற்ற முழு உயிரினமாக ஆனதையே சொற்றொடர் குறிக்கிறது; மனிதனுள் தனியாகப் பிரிக்கக்கூடிய ஒரு கூறைப் பற்றிய குறிப்பிட்ட மனிதவியலை மொழிபெயர்ப்பு திணிக்கக் கூடாது. பாரம்பரிய வாசகம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ‘கடைசி ஆதாம் உயிரளிக்கும் ஆவி ஆனார்’ என்பதன் பொருள்
  choice: பண்புரீதியான ஆதாம்–கிறிஸ்து எதிர்மறை ஒப்புமையை அப்படியே வைத்தல்
  alternative: ‘கடைசி ஆதாம் உயிரளிக்கிற பரிசுத்த ஆவியானார்’ அல்லது ‘உயிரளிக்கும் ஓர் ஆவியானார்’
  rationale: πνεῦμα என்பதற்கு கிரேக்கத்தில் சுட்டுரை இல்லை; எனவே கிறிஸ்துவைப் பரிசுத்த ஆவியானவர் என்ற தனி நபரோடு நேரடியாக ஒன்றாக்கும் விளக்கத்தைச் சேர்க்காமல், உயிரளிக்கும் தன்மையை மொழிபெயர்ப்பு காக்கிறது. தமிழில் இயற்கையாகத் தோன்றாத கட்டாய ‘ஓர்’ என்பதையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதவாக்குக்குரிய கண்ணியத்துடன் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘முதல் மனிதனாகிய ஆதாம்’ மற்றும் ‘கடைசி ஆதாம்’ என்ற சமச்சீர் அமைப்பு பவுலின் மாதிரி ஒப்புமையைத் தெளிவாக்குகிறது. கிறிஸ்துவைக் குறிக்கும் இடத்தில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கம் தவிர்க்கப்பட்டுள்ளது.
