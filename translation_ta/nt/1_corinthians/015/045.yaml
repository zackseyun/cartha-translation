revisions:
- from: 'அவ்வாறே எழுதப்பட்டிருக்கிறது: “முதல் மனிதனாகிய ஆதாம் உயிருள்ள ஓர் உயிரினமானான்”[a]; கடைசி ஆதாம் உயிரளிக்கும் ஆவியானார்.[b]'
  to: 'அவ்வாறே எழுதப்பட்டிருக்கிறது: “முதல் மனிதனாகிய ஆதாம் உயிருள்ள மனிதனானான்”[a]; கடைசி ஆதாம் உயிரளிக்கும் ஆவியானார்.[b]'
  rationale: The revision corrects the primary rendering of ψυχὴ ζῶσα to a natural modern-Tamil expression for a living human being. It preserves the Genesis echo and the traditional ‘ஆத்துமா’ rendering as a non-preferred lexical alternative. The final Adam clause remains deliberately qualitative and does not add a doctrinal identification absent from the Greek.
