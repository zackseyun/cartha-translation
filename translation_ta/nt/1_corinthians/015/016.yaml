  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: ta
  text: ஏனெனில், இறந்தவர்கள் உயிர்த்தெழுப்பப்படுவதில்லை என்றால், மேசியாவும்கூட[a] உயிர்த்தெழுப்பப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கிறிஸ்து.” Χριστός என்ற கிரேக்கப் பட்டத்தை “மேசியா” என்றும், நீண்டகால மரபின்படி “கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ஏனெனில் … என்றால்
  rationale: εἰ என்பதன் நிபந்தனையையும் γάρ என்பதன் விளக்கவாதத் தொடர்பையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: νεκροὶ
  choice: இறந்தவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை உரிச்சொல், இறந்த மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
- source_word: οὐκ ἐγείρονται
  choice: உயிர்த்தெழுப்பப்படுவதில்லை
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும், உயிர்த்தெழுதலில் அவர்களை வேறொருவர் எழுப்பும் கருத்தையும் காக்கிறது.
- source_word: οὐδὲ
  choice: …வும் … இல்லை
  rationale: நிபந்தனையின் தீவிரமான விளைவாக ‘மேசியாவும்கூட இல்லை’ என்ற வலியுறுத்தலை இயல்பான தமிழ் அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: Χριστὸς
  choice: மேசியா
  rationale: Χριστός இங்கு அபிஷேகம் செய்யப்பட்டவரைக் குறிக்கும் பட்டமாக இருப்பதால் அதன் பொருளை மொழிபெயர்க்கிறது; மரபான ‘கிறிஸ்து’ மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐκ ἐγήγερται
  choice: உயிர்த்தெழுப்பப்படவில்லை
  rationale: நிறைவேறிய செயலும் அதன் தொடரும் விளைவும் கொண்ட இறந்தகால நிறைவு செயப்பாட்டு வடிவத்தின் மையக் கருத்தைத் தக்கவைக்கிறது; ‘உயிர்த்தெழவில்லை’ என்று சொல்வதால் செயப்பாட்டு நுணுக்கம் மறைவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் வாதத்தில் Χριστός என்பதை எவ்வாறு வழங்குவது
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு சொல் பெயராக மட்டும் அல்லாமல் பட்டத்தின் பொருளோடும் செயல்படுகிறது. ‘மேசியா’ அந்தப் பொருளை வெளிப்படையாக்குகிறது; நீண்டகால திருச்சபை மரபிலுள்ள ‘கிறிஸ்து’ என்பதும் செல்லத்தக்க மாற்றாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பவுலின் காரணவாத ஓட்டத்தையும் இரு வினைகளின் செயப்பாட்டு வடிவத்தையும் காக்கும் கண்ணியமான நடை. ‘உயிர்த்தெழுப்பப்படுதல்’ என்ற சொல் இறந்த நிலையிலிருந்து எழுப்பப்படுவதைத் தெளிவாக்குகிறது.
