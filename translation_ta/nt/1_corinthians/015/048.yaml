reference: 1 Corinthians 15:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: ta
  text: மண்ணால் ஆனவர் எப்படிப்பட்டவரோ, மண்ணால் ஆனவர்களும் அப்படிப்பட்டவர்களே; பரலோகத்துக்குரியவர் எப்படிப்பட்டவரோ, பரலோகத்துக்குரியவர்களும் அப்படிப்பட்டவர்களே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: எப்படிப்பட்டவரோ ... அப்படிப்பட்டவர்களே
  rationale: முன்மாதிரியாக உள்ள ஒருவருக்கும் அவரைச் சேர்ந்தவர்களுக்கும் இடையிலான ஒத்த இயல்பைச் சுட்டும் கிரேக்க இணைப்புக் கட்டமைப்பை இயல்பான தமிழிலும் இணை அமைப்புடனும் தருகிறது.
- source_word: χοϊκός
  choice: மண்ணால் ஆன
  rationale: ஆதாம் மண்ணிலிருந்து உண்டாக்கப்பட்டதைச் சுட்டும் தொடக்கநூல் எதிரொலியைப் பாதுகாக்கிறது; வெறும் உலகப்பற்றுள்ளவர் என்ற பொருளைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: ὁ χοϊκός
  choice: மண்ணால் ஆனவர்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லாகப் பயன்படும் ஒருமை ஆண்பால் பெயரடையைத் தமிழில் இயல்பாகக் காட்டுகிறது. முந்தைய வசனத்தின் சூழலில் இது ஆதாமைக் குறிக்கிறது; ஆனால் இவ்வசனத்தில் இல்லாத ‘மனிதன்’ என்ற சொல்லைச் சேர்க்காமல் விடுகிறது.
- source_word: οἱ χοϊκοί
  choice: மண்ணால் ஆனவர்கள்
  rationale: ஒருமை வடிவத்துடனான சொல் தொடர்பைத் தெளிவாகப் பாதுகாத்து, மண்ணால் ஆனவரின் இயல்பைப் பகிரும் மனிதர்களைக் குறிக்கிறது.
- source_word: ἐπουράνιος
  choice: பரலோகத்துக்குரிய
  rationale: ‘பரலோகத்தைச் சேர்ந்த’ அல்லது ‘பரலோக இயல்புடைய’ என்ற பெயரடைத் தன்மையைப் பாதுகாக்கிறது; முந்தைய வசனத்தில் உள்ள ‘பரலோகத்திலிருந்து வந்தவர்’ என்ற வேறுபட்ட சொற்றொடரை இங்கே இறக்குமதி செய்வதில்லை.
- source_word: ὁ ἐπουράνιος
  choice: பரலோகத்துக்குரியவர்
  rationale: சூழலில் கிறிஸ்துவைக் குறிக்கும் ஒருமை நபர் வடிவத்தை இயல்பான தமிழில் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மனிதன்’ என்பதைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: οἱ ἐπουράνιοι
  choice: பரலோகத்துக்குரியவர்கள்
  rationale: ஒருமை முன்மாதிரியுடன் உள்ள சொல் ஒற்றுமையைப் பாதுகாத்து, தேவதூதர்களை அல்லாமல் பரலோகத்துக்குரியவரோடு ஒத்த இயல்பைப் பகிரும் மனிதர்களைக் குறிக்கிறது.
theological_decisions:
- issue: ஒருமைச் சொற்களில் ‘மனிதன்’ என்பதை வெளிப்படையாகச் சேர்க்க வேண்டுமா?
  choice: ‘மண்ணால் ஆனவர் ... பரலோகத்துக்குரியவர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘மண்ணால் ஆன மனிதன் ... பரலோகத்துக்குரிய மனிதன்’
  rationale: உடனடிச் சூழல் ஆதாம்–கிறிஸ்து ஒப்புமையைத் தெளிவுபடுத்தினாலும், இவ்வசனத்தின் கிரேக்க உரையில் ‘மனிதன்’ என்ற பெயர்ச்சொல் இல்லை. தமிழில் மரியாதை ஒருமை வடிவம் நபர் குறியீட்டை இயல்பாகத் தருவதால், சூழலின் நபர்சார் எதிர்மறையைப் பாதுகாத்தபடியே மூலத்தின் சுருக்கத்தையும் நிலைநிறுத்தலாம்.
- issue: οἱ ἐπουράνιοι என்பது பரலோக உயிர்களையா அல்லது பரலோகத்துக்குரியவரோடு ஒத்த மனிதர்களையா குறிக்கிறது?
  choice: மனிதர்களைக் குறிக்கும் ‘பரலோகத்துக்குரியவர்கள்’
  alternative: ‘பரலோக வாசிகள்’
  rationale: உடனடிச் சூழல் மனித உயிர்த்தெழுதலையும் பரலோகத்துக்குரியவரின் சாயலைத் தரிப்பவர்களையும் பற்றியது. ‘பரலோக வாசிகள்’ என்பது தேவதூதர்கள் அல்லது ஏற்கெனவே பரலோகத்தில் வசிப்போர் என்ற தேவையற்ற பொருளை உருவாக்கக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்க வசனத்தின் இருபகுதி இணை அமைப்பும் χοϊκός/ἐπουράνιος என்ற மீளுருவாக்கமும் தமிழில் ஒரே சொற்றொடர்களால் பாதுகாக்கப்பட்டுள்ளன.
