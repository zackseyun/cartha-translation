  source_fidelity: மூலக் கிரேக்கத்தின் கூர்மையான விளிப்பான ἄφρων, வலியுறுத்தப்பட்ட σὺ, விதைப்பு உருவகம், மற்றும் ἐὰν μὴ ἀποθάνῃ என்ற நிபந்தனை அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘உயிர்ப்பிக்கப்படாது’ என்பது ζῳοποιεῖται என்பதன் செயப்பாட்டு/பெறுநிலை நுணுக்கத்தை இயன்றவரை காக்கிறது; செய்பவர் குறிப்பிடப்படாத நிலையும் பாதுகாக்கப்படுகிறது.
