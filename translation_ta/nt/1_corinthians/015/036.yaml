source:
  edition: SBLGNT
  text: ⸀ἄφρων, σὺ ὃ σπείρεις, οὐ ζῳοποιεῖται ἐὰν μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: ta
  text: அறிவில்லாதவனே![a] நீ விதைப்பது சாகாவிட்டால் உயிர்ப்பிக்கப்படாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மூடனே!’ அல்லது ‘புத்தியில்லாதவனே!’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உயிர்பெறாது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: அறிவில்லாதவனே
  rationale: நேரடியான கண்டனத்தையும் விளிவேற்றுமையின் அழைப்புத் தன்மையையும் காக்கிறது; நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: σὺ
  choice: நீ
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள வலியுறுத்தப்பட்ட இரண்டாம் நபர் ஒருமைப் பெயரைத் தமிழிலும் வெளிப்படையாகக் காக்கிறது.
- source_word: ὃ σπείρεις
  choice: நீ விதைப்பது
  rationale: விதைப்பு என்ற வேளாண்மை உருவகத்தை நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: ζῳοποιεῖται
  choice: உயிர்ப்பிக்கப்படாது
  rationale: வினையின் செயப்பாட்டு வடிவத்தையும் உயிரளித்தல்/உயிரடையச் செய்தல் என்ற பொருளையும் காக்கிறது; உயிர்த்தெழுதல் சூழலுடனான தொடர்பையும் மிகைப்படுத்தாமல் பிரதிபலிக்கிறது.
- source_word: ἐὰν μὴ
  choice: சாகாவிட்டால்
  rationale: நிபந்தனை அமைப்பை இயல்பான தமிழில் ‘சாகாவிட்டால்’ எனத் தருகிறது.
- source_word: ἀποθάνῃ
  choice: சாகு
  rationale: விதையைச் சுட்டும் உருவகத்தில் எளிய, இயல்பான தமிழ்ச் சொல்லாக உள்ளது; ‘முதலில்’ போன்ற மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: விதையின் மரணத்துக்கும் உயிர்த்தெழுதல் வாழ்வுக்கும் இடையிலான உருவக உறவு
  choice: வேளாண்மை உருவகத்தை விளக்கவுரை சேர்க்காமல் அப்படியே தக்கவைத்தல்
  alternative: இதை உடலின் உயிர்த்தெழுதலைப் பற்றிய நேரடி கோட்பாட்டு வாக்கியமாக வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: பவுல் உயிர்த்தெழுதலைப் பற்றிய ஐயத்துக்கு விதையின் உருவகத்தால் பதிலளிக்கிறார். இவ்வசனம் கூறுவதைத் தாண்டி கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கக்கூடாது.
- issue: ζῳοποιεῖται என்பதன் செயப்பாட்டு நுணுக்கம்
  choice: ‘உயிர்ப்பிக்கப்படாது’ என்று செயப்பாட்டு வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘உயிர்பெறாது’ அல்லது ‘உயிருக்கு வராது’ என்று நிகழ்வை மட்டும் கூறுதல்
  rationale: செயலைச் செய்பவர் இவ்வசனத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. செயப்பாட்டு வடிவம் அந்த மறைமுகத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் நேரடியான, கண்ணியமான கண்டனத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘அறிவில்லாதவனே’ என்பது கடுமையை மறைக்காமல், தேவையற்ற இழிவுத் தொனியையும் தவிர்க்கிறது. கிரேக்கத்தின் செயப்பாட்டு அமைப்பும் விதைப்பு உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
