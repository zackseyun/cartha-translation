  terminology: ‘விதைப்பது,’ ‘சாகாவிட்டால்,’ மற்றும் ‘உயிர்ப்பிக்கப்படாது’ ஆகியவை வேளாண் உருவகத்தையும் வாழ்வளிக்கப்படுதல் என்ற முக்கியச் சொல்லாட்சியையும் காக்கின்றன. ‘அறிவில்லாதவனே’ என்பதற்கான மாற்றுச் சொற்களை அடிக்குறிப்பு சரியாகக் கொடுக்கிறது. அடிக்குறிப்பு அடையாளங்கள் உரிய சொற்களில் இணைக்கப்பட்டுள்ளன.
