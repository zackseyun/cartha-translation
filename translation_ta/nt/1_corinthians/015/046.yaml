translation:
  language: ta
  text: ஆனால், முதலில் ஆவிக்குரியது அல்ல; இயல்பானது, பின்னர் ஆவிக்குரியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: முதலில் வருவது
  rationale: இது கால வரிசையைச் சுட்டுகிறது. தமிழில் தனியே ‘முதலில்’ என்பதைக் காட்டிலும் ‘முதலில் வருவது’ என்பது வாக்கியத்தின் தொடர்ச்சியை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: πνευματικόν
  choice: ஆவிக்குரியது
  rationale: கிரேக்கத்தில் இது நடுநிலை ஒருமை பெயரடையாகப் பெயர்ச்சொல் தன்மையில் வருகிறது. ‘உடல்’ என்பதை வசனம் வெளிப்படையாகச் சொல்லாததால் அதை முதன்மை உரையில் சேர்க்காமல், கிரேக்கத்தின் சுருக்கத்தையும் பொருள் விரிவையும் காக்கிறது.
- source_word: ψυχικόν
  choice: இயல்பான உயிர் வாழ்க்கைக்குரியது
  rationale: ψυχικόν என்பது சாதாரண உயிருள்ள மனித வாழ்க்கையின் நிலைக்குரியதைச் சுட்டுகிறது; வெறும் ‘உடலுக்குரியது’ என்று குறுக்குவதையும், ‘ஆவியற்றது’ என்று அறநெறி சார்ந்த எதிர்மறைப் பொருள் ஏற்றுவதையும் இந்தத் தேர்வு தவிர்க்கிறது.
- source_word: ἔπειτα
  choice: அதற்குப் பிறகே
  rationale: அடுத்துவரும் வரிசையைத் தெளிவாகக் காட்டுகிறது. ‘-ஏ’ விகுதி முதலில் அல்ல, பின்னரே என்ற கிரேக்க எதிர்மறை-நேர்மறை வரிசையை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: ஆனால் ... அல்ல; ...தே
  rationale: பவுல் திருத்திக் கூறும் இருமடங்கு எதிர்மறை அமைப்பைத் தமிழில் இயல்பாகத் தருகிறது; ‘-தே’ இரண்டாம் உறுப்பின் எதிர்மாற்ற வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ψυχικόν மற்றும் πνευματικόν ஆகியவற்றுக்கிடையிலான வேறுபாடு
  choice: முதலில் சாதாரண உயிர் வாழ்க்கைக்குரிய நிலை, பின்னர் ஆவிக்குரிய நிலை என்ற வரிசை சார்ந்த வேறுபாடு
  alternative: குறிப்பாக இயல்பான உடலுக்கும் ஆவிக்குரிய உடலுக்கும் இடையிலான வேறுபாடு; அல்லது ஆவிக்குரியவர்களுக்கும் ஆவிக்குரியவரல்லாதவர்களுக்கும் இடையிலான வேறுபாடு
  rationale: அருகிலுள்ள சூழலில் ‘உடல்’ வெளிப்படையாக உள்ளது; ஆனால் இவ்வசனத்தில் அந்தச் சொல் விடப்பட்டுள்ளது. ஆகவே முதன்மை உரை பெயரடைச் சொற்களின் விரிவைத் தக்கவைத்து, உயிர்த்தெழுதல் உடலைக் குறிக்கும் சூழல் வாய்ப்பை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இயற்கையானது’ என்ற சுருக்கமான சொல் ψυχικόν என்பதைக் குழப்பமாக்கக்கூடும் என்பதால் ‘இயல்பான உயிர் வாழ்க்கைக்குரியது’ எனத் தெளிவாக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘உடல்’ முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
