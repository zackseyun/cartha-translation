translation:
  language: ta
  text: அப்படியானால், மேசியாவுக்குள் மரணமடைந்தவர்களும்[a] அழிந்துபோனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “மேசியாவுக்குள் தூங்கிப்போனவர்களும்.” “தூங்குதல்” என்பது இங்கு மரணத்தைக் குறிக்கும் மென்மொழி.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: அப்படியானால்
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ
  choice: -உம்
  rationale: இறந்த விசுவாசிகளையும் முன் கூறப்பட்ட விளைவுகளோடு சேர்க்கும் கூட்டல் பொருளைப் பாதுகாக்கிறது.
- source_word: οἱ κοιμηθέντες
  choice: மரணமடைந்தவர்கள்
  rationale: கிரேக்கத்தில் இது சொல்லர்த்தமாக ‘தூங்கியவர்கள்’ என்றாலும், இங்கு மரணத்தைக் குறிக்கும் மரபுவழி மென்மொழி. தமிழில் ‘தூங்கிவிட்டவர்கள்’ என்பது உண்மையான தூக்கமாகத் தவறாகப் புரியக்கூடும் என்பதால் பொருள் இயல்பாக வழங்கப்படுகிறது; உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν Χριστῷ
  choice: மெசியாவுக்குள்
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளையும், பவுலின் ‘அவருக்குள்’ என்ற ஒன்றிப்புச் சொல்லாட்சியையும் பாதுகாக்கிறது.
- source_word: ἀπώλοντο
  choice: அழிந்துபோனார்கள்
  rationale: உயிர்த்தெழுதல் இல்லையெனில் அவர்களுக்கு ஏற்பட்டிருக்கும் இறுதியான இழப்பு அல்லது அழிவைக் குறிக்கும் வலிமையைப் பாதுகாக்கிறது; அதன் துல்லிய இயல்பை மேலதிகமாக வரையறுக்கவில்லை.
theological_decisions:
- issue: ἐν Χριστῷ என்ற பவுலின் ஒன்றிப்பு மொழி
  choice: மெசியாவுக்குள்
  alternative: கிறிஸ்துவுக்குள்
  rationale: Χριστός என்பதைப் பட்டப்பெயரான ‘மெசியா’ என்று மொழிபெயர்க்கிறது; அதேவேளை ἐν என்பதன் ஒன்றிப்பு சார்ந்த மொழியை வெறும் ‘மெசியாவை நம்பி’ என்று விளக்கிப் பரப்பாமல் பாதுகாக்கிறது.
- issue: ἀπώλοντο குறிக்கும் அழிவின் தன்மை
  choice: அழிந்துபோனார்கள்
  alternative: இழக்கப்பட்டார்கள்
  rationale: சொல் வெளிப்படுத்தும் அழிவு அல்லது நாசம் என்ற வலிமையை வைத்திருக்கிறது; நித்தியத் தண்டனை, இல்லாமற்போதல் போன்ற குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான வாக்கியம். ‘மெசியாவுக்குள்’ என்பது வழக்குத் தமிழில் சற்றுப் புதுமையாக இருந்தாலும், மூலத்தின் ἐν Χριστῷ ஒன்றிப்பு மொழியைத் திட்டமிட்டு பாதுகாக்கிறது.
