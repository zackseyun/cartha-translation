id: 1CO.15.49
reference: 1 Corinthians 15:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: ta
  text: நாம் மண்ணால் ஆனவரின் சாயலைத் தாங்கியதுபோலவே, விண்ணுக்குரியவரின் சாயலையும் தாங்குவோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “விண்ணுக்குரியவரின் சாயலையும் தாங்குவோமாக” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: போலவே
  rationale: இரு நிலைகளுக்கிடையிலான தெளிவான ஒப்புமையையும் தொடர்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐφορέσαμεν
  choice: தாங்கியதுபோலவே
  rationale: φορέω என்பதன் ‘தாங்குதல்/சுமத்தல்’ என்ற உருவகப் பொருளைப் பாதுகாக்கிறது; இறந்தகால வினை வடிவம் மனிதகுலம் ஆதாமின் சாயலை ஏற்கெனவே தாங்கியிருப்பதைச் சுட்டுகிறது.
- source_word: εἰκόνα
  choice: சாயலை
  rationale: εἰκών என்பதன் உருவம் அல்லது பிரதிபலிப்பு என்ற கருத்தை இயல்பாகத் தருகிறது; வெறும் உடல் வடிவம் என்று குறுக்காமல் ஆதாம்–கிறிஸ்து ஒப்புமையைப் பாதுகாக்கிறது.
- source_word: τοῦ χοϊκοῦ
  choice: மண்ணால் ஆனவரின்
  rationale: χοϊκός என்பதன் ‘மண்ணால் ஆன’ என்ற பொருளையும் ஆதியாகமத்தின் மண் பின்னணியையும் வெளிப்படுத்துகிறது; சூழலில் குறிப்பாக ஒரு மனிதரைச் சுட்டுவதால் ‘அவர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: φορέσομεν
  choice: தாங்குவோம்
  rationale: SBLGNT உரையிலுள்ள எதிர்காலக் குறிப்பு வினை வடிவத்தை நேரடியாகப் பிரதிபலித்து, உயிர்த்தெழுதலில் நிகழவிருக்கும் மாற்றத்தை உறுதியான எதிர்கால நிகழ்வாகத் தருகிறது.
- source_word: τοῦ ἐπουρανίου
  choice: விண்ணுக்குரியவரின்
  rationale: ἐπουράνιος என்பதன் ‘விண்ணுக்குரிய’ பொருளைப் பாதுகாத்து, மண்ணால் ஆனவருடன் இணையான தனிநபர் குறிப்பையும் தக்கவைக்கிறது.
- source_word: καὶ
  choice: -யும்
  rationale: இரண்டாம் கூறிலுள்ள சேர்க்கைப் பொருளைத் தமிழின் இயல்பான இணைப்புத் துகளால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இரண்டாம் வினைச்சொல் எதிர்காலக் குறிப்பா அல்லது ஊக்குவிக்கும் வேண்டுகோளா
  choice: தாங்குவோம்
  alternative: நாமும் தாங்குவோமாக
  rationale: அச்சிடப்பட்ட SBLGNT உரை φορέσομεν என்ற எதிர்காலக் குறிப்பு வடிவத்தைக் கொண்டுள்ளது. முக்கியமான φορέσωμεν என்ற பாடவேறுபாடு அறிவுறுத்தல் அல்லது ஊக்குவிப்பு பொருளைத் தருவதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மண்ணால் ஆனவர்’ மற்றும் ‘விண்ணுக்குரியவர்’ என்ற இணையான சொற்றொடர்கள் ஆதாம்–கிறிஸ்து எதிர்மறை ஒப்புமையை விளக்கவுரை சேர்க்காமல் தக்கவைக்கின்றன.
