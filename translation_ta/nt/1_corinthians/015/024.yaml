id: 1CO.15.24
reference: 1 Corinthians 15:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: ta
  text: அதன்பின் முடிவு[a] வரும். அப்போது அவர் அரசாட்சியைக் கடவுளாகிய தந்தையிடம்[b] ஒப்படைப்பார்; அப்போது எல்லா ஆட்சியையும், எல்லா அதிகாரத்தையும், எல்லா வல்லமையையும் ஒழித்துவிடுவார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிறைவு.” கிரேக்கச் சொல் “முடிவு,” “இலக்கு,” அல்லது “நிறைவு” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “கடவுளும் தந்தையுமானவரிடம்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “செயலற்றதாக்குவார்” அல்லது “ஒன்றுமில்லாமல் செய்வார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: அதன்பின்
  rationale: பவுல் விவரிக்கும் உயிர்த்தெழுதல் நிகழ்வுகளின் அடுத்த கட்டத்தைக் குறிக்கும் இயல்பான காலத் தொடர்ச்சிச் சொல்.
- source_word: τὸ τέλος
  choice: முடிவு
  rationale: τέλος என்பதன் நேரடியான காலநிறைவுப் பொருளைப் பேணுகிறது; ‘இலக்கு’ அல்லது ‘நிறைவு’ என்ற நுண்பொருள்களையும் அடிக்குறிப்பில் தருகிறது.
- source_word: ὅταν παραδιδῷ
  choice: அப்போது அவர் ... ஒப்படைப்பார்
  rationale: எதிர்காலத்தில் நிகழும் அரசாட்சி ஒப்படைப்பை இயல்பான நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: τὴν βασιλείαν
  choice: அரசாட்சியை
  rationale: βασιλεία இங்கு அரசுரிமை அல்லது ஆளுகையைச் சுட்டலாம்; ‘அரசாட்சி’ என்பது ஒப்படைக்கப்படும் ஆளுகை என்ற இயக்கமுள்ள பொருளையும் ராஜ்யக் கருத்தையும் உள்ளடக்குகிறது.
- source_word: τῷ θεῷ καὶ πατρί
  choice: கடவுளாகிய தந்தையிடம்
  rationale: ‘கடவுள்’ மற்றும் ‘தந்தை’ என்பவற்றை ஒரே நபரை விளக்கும் இணைப்பாக இயல்பான தமிழில் வழங்குகிறது; சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் உள்ளது.
- source_word: ὅταν καταργήσῃ
  choice: அப்போது ... ஒழித்துவிடுவார்
  rationale: எதிரான ஆட்சிகளின் செயல்பாடு தீர்மானமாக முடிவுக்குக் கொண்டுவரப்படுவதைச் சொல்கிறது; அவை இருப்பிலிருந்தே அழிக்கப்படுகின்றன என்று தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: πᾶσαν ἀρχὴν
  choice: எல்லா ஆட்சியையும்
  rationale: ἀρχή இப்பட்டியலில் ஆளும் அமைப்பு அல்லது ஆதிக்கத்தைச் சுட்டும் வாய்ப்பைப் பேணி, ‘அதிகாரம்’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: πᾶσαν ἐξουσίαν
  choice: எல்லா அதிகாரத்தையும்
  rationale: செலுத்தப்படும் அல்லது வழங்கப்பட்ட அதிகாரம் என்ற ἐξουσία-வின் வழக்கமான பொருளைத் தெளிவாகத் தருகிறது.
- source_word: δύναμιν
  choice: எல்லா வல்லமையையும்
  rationale: δύναμις-ஐ பட்டியலிலுள்ள மற்ற இரு சொற்களிலிருந்து வேறுபடுத்தி, சக்தி அல்லது வலிமை என்ற பரந்த பொருளை வழங்குகிறது.
theological_decisions:
- issue: τῷ θεῷ καὶ πατρί என்பதில் ‘கடவுள்’–‘தந்தை’ உறவு
  choice: ஒரே நபரை விளக்கும் வகையில் ‘கடவுளாகிய தந்தை’
  alternative: ‘கடவுளிடமும் தந்தையிடமும்’ அல்லது ‘கடவுளும் தந்தையுமானவரிடம்’
  rationale: சூழலில் மகன் அரசாட்சியைத் தந்தையிடம் ஒப்படைப்பதாக இருப்பதால் விளக்க இணைப்பு மிக இயல்பான வாசிப்பு; கிரேக்கத்தின் வடிவைச் சார்ந்த மாற்றை அடிக்குறிப்பு வெளிப்படையாகப் பேணுகிறது.
- issue: καταργήσῃ என்பதன் வலிமை
  choice: ஒழித்துவிடுவார்
  alternative: செயலற்றதாக்குவார்; ஒன்றுமில்லாமல் செய்வார்; அழித்துவிடுவார்
  rationale: எல்லா எதிர் ஆட்சியும் அதிகாரமும் வல்லமையும் நடைமுறையில் முடிவுக்குக் கொண்டுவரப்படுவதை வலுவாகக் கூறுகிறது; முழுமையான இருப்பழிவு என்ற கருத்தைச் சொற்பொருளுக்கு மேலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசாட்சி’ என்பது βασιλεία-வின் ராஜ்யம்/ஆளுகை நுண்பொருள்களை இணைக்கிறது. இணையான இரண்டு ὅταν தொடர்களும் ‘அப்போது’ என மீளக் கூறப்பட்டு கிரேக்க வாக்கிய அமைப்பு தெளிவாகப் பேணப்பட்டுள்ளது.
