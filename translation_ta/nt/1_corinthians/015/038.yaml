review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents God's giving of a body to the seed, God's volition, and the distributive assignment of an individual body to every seed. Repeating the Tamil verb in the second coordinated clause is acceptable and makes the shared Greek verb explicit. A minor wording adjustment better conveys ἴδιον ('its own') and improves idiomatic distributive Tamil.
  naturalness: ‘விதைகள் ஒவ்வொன்றுக்கும்’ is understandable but less natural than ‘ஒவ்வொரு விதைக்கும்.’ ‘தாம் விரும்பியவாறு’ is a smooth modern-standard equivalent of καθὼς ἠθέλησεν. ‘அதற்கே உரிய’ more clearly marks the individualizing force of ἴδιον than ‘அதற்குரிய.’
  terminology: ‘கடவுள்’ and ‘உடல்’ are clear, dignified modern Tamil choices. ‘உடல்’ appropriately retains the lexical connection with the wider resurrection discussion. No doctrinal expansion is introduced.
  issues:
  - severity: low
    issue: The distributive expression is slightly awkward.
    rationale: ‘விதைகள் ஒவ்வொன்றுக்கும்’ is grammatical, but ‘ஒவ்வொரு விதைக்கும்’ is the more idiomatic modern Tamil expression while retaining the distributive sense of ἑκάστῳ τῶν σπερμάτων.
  - severity: low
    issue: The rendering of ἴδιον can make its possessive-individualizing emphasis more explicit.
    rationale: ‘அதற்குரிய’ can mean simply ‘appropriate for it’; ‘அதற்கே உரிய’ more closely communicates ‘its own,’ without adding the interpretive idea of seed type or species.
  revised_text: ஆனால் கடவுள் தாம் விரும்பியவாறு அதற்கு ஒரு உடலைக் கொடுக்கிறார்; ஒவ்வொரு விதைக்கும் அதற்கே உரிய உடலைக் கொடுக்கிறார்.
  revised_footnotes: []
  revision_rationale: 'The revision makes only small idiomatic refinements. It preserves the present-tense divine action, the singular reference back to the seed, divine volition, the distributive reference to every seed, and the emphasis that each has its own body. No footnote is required in Tamil: ‘ஒவ்வொரு விதைக்கும்’ clearly expresses the distributive sense, and the English audit-trail alternative does not indicate a textual variant or unresolved source ambiguity.'
