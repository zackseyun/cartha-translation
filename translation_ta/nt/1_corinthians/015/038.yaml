revisions:
- from: ஆனால் கடவுள் தாம் விரும்பியபடியே அதற்கு ஓர் உடலைக் கொடுக்கிறார்; விதைகள் ஒவ்வொன்றுக்கும் அதற்குரிய உடலைக் கொடுக்கிறார்.
  to: ஆனால் கடவுள் தாம் விரும்பியவாறு அதற்கு ஒரு உடலைக் கொடுக்கிறார்; ஒவ்வொரு விதைக்கும் அதற்கே உரிய உடலைக் கொடுக்கிறார்.
  rationale: 'The revision makes only small idiomatic refinements. It preserves the present-tense divine action, the singular reference back to the seed, divine volition, the distributive reference to every seed, and the emphasis that each has its own body. No footnote is required in Tamil: ‘ஒவ்வொரு விதைக்கும்’ clearly expresses the distributive sense, and the English audit-trail alternative does not indicate a textual variant or unresolved source ambiguity.'
