id: 1CO.15.38
reference: 1 Corinthians 15:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: ta
  text: ஆனால் கடவுள் தாம் விரும்பியவாறு அதற்கு ஒரு உடலைக் கொடுக்கிறார்; ஒவ்வொரு விதைக்கும் அதற்கே உரிய உடலைக் கொடுக்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίδωσιν
  choice: கொடுக்கிறார்
  rationale: நிகழ்கால வினையின் இயல்பான பொருளைத் தக்கவைத்து, விதை குறித்த உவமையில் கடவுளின் செயலை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: αὐτῷ
  choice: அதற்கு
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட விதையையே ஒருமைச் சுட்டுப்பெயர் குறிக்கிறது; தமிழில் வேற்றுமை உருபுடன் இயல்பாக அமைகிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: σῶμα என்பதன் வழக்கமான நேரடி இணைச்சொல்; இவ்வதிகாரத்தில் உயிர்த்தெழுதல் பற்றிய ‘உடல்’ என்ற சொல் தொடர்பையும் காக்கிறது.
- source_word: καθὼς ἠθέλησεν
  choice: தாம் விரும்பியபடியே
  rationale: கடவுளின் சித்தத்தையும் நோக்கத்தையும் காட்டுகிறது. ‘தாம்’ என்பது எழுவாயாகிய கடவுளை மரியாதையுடன் திரும்பச் சுட்டுகிறது; ‘-ஏ’ கிரேக்கத் தொடரின் ஒப்புமை வலிமையை இயல்பாகத் தருகிறது.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: விதைகள் ஒவ்வொன்றுக்கும்
  rationale: பகுதிப்பொருள் கொண்ட கிரேக்க அமைப்பின் பகிர்ந்தளிக்கும் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வகை’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: ἴδιον
  choice: அதற்குரிய
  rationale: ஒவ்வொரு விதைக்கும் தனிப்பட்ட முறையில் உரிய உடல் என்பதைக் காட்டும் இயல்பான தமிழ்; ‘தனக்கே சொந்தமான’ என்பதைவிட இச்சூழலில் செறிவானது.
theological_decisions:
- issue: விதை–உடல் உவமையில் கடவுளின் செயலும் சித்தமும்
  choice: ஒவ்வொரு விதைக்கும் உடலைக் கொடுப்பவர் கடவுள் என்றும், அது அவர் விரும்பியபடியே அமைகிறது என்றும் நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒவ்வொரு விதை வகைக்கும் தனித்தனி உடல்’ என்று விளக்கமாக மொழிபெயர்க்கலாம்.
  rationale: வசனம் கடவுளின் செயற்பாட்டையும் சித்தத்தையும் வலியுறுத்துகிறது; ஆனால் மூலத்தில் இல்லாத இனவகை அல்லது உயிரியல் விளக்கத்தைச் சேர்க்காமல் அதன் இறையியல் அழுத்தமும் திறந்த தன்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘ஓர் உடல்’ என முதல் குறிப்பும், ‘அதற்குரிய உடல்’ என பகிர்ந்தளிக்கும் இரண்டாம் குறிப்பும் அமைக்கப்பட்டுள்ளன. தனி அடிக்குறிப்பு தேவையில்லை; கிரேக்கத்தின் ‘ஒவ்வொன்றுக்கும்’ என்ற பகிர்ந்தளிக்கும் பொருள் முதன்மை உரையிலேயே தெளிவாக உள்ளது.
