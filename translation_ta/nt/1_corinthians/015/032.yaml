reference: 1 Corinthians 15:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: ta
  text: மனிதக் கண்ணோட்டத்தில் சொல்வதானால்[a], எபேசுவில் நான் காட்டு விலங்குகளோடு போராடினேன் என்றால்[b], அதனால் எனக்கு என்ன பயன்? இறந்தவர்கள் உயிர்த்தெழுப்பப்படுவதில்லை என்றால், “நாம் உண்போம், குடிப்போம்[c]; ஏனெனில் நாளை இறந்துபோவோம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனித முறையில்” என்றும் மொழிபெயர்க்கலாம். இந்தச் சொற்றொடர் பவுல் பேசும் முறையையோ அவர் முன்வைக்கும் கண்ணோட்டத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “காட்டு விலங்குகளோடு போராடினேன்” என்பது நேரடியாகவும், கொடூரமான மனித எதிர்ப்பைக் குறிக்கும் உருவகமாகவும் புரிந்துகொள்ளப்படலாம்; முதன்மை உரை கிரேக்கத்தின் படிமத்தை அப்படியே வைத்துள்ளது.
    reason: alternative_reading
  - marker: c
    text: ஏசாயா 22:13-இலிருந்து மேற்கோள் அல்லது மறைமுகக் குறிப்பு.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: மனித முறையில் சொல்வதானால்
  rationale: இது வெறும் மனித அளவிலான பேச்சையோ மனிதக் கண்ணோட்டத்தையோ குறிக்கக்கூடிய சொற்றொடர். முதன்மை உரை இயல்பான தமிழில் பேச்சின் முறையை முன்னிறுத்துகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐθηριομάχησα
  choice: நான் காட்டு விலங்குகளோடு போராடினேன்
  rationale: வினைச்சொல்லின் நேரடியான, உயிரோட்டமுள்ள படிமம் காக்கப்படுகிறது. உண்மையான விலங்குகளையா கொடூரமான மனித எதிரிகளையா பவுல் குறிப்பிடுகிறார் என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
- source_word: ἐν Ἐφέσῳ
  choice: எபேசுவில்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: τί μοι τὸ ὄφελος
  choice: அதனால் எனக்கு என்ன பயன்?
  rationale: பேச்சின் சூழலுக்கேற்ற இயல்பான தமிழில், தனக்குக் கிடைக்கும் பயனைப் பற்றிய வினாவின் வலிமை காக்கப்படுகிறது.
- source_word: νεκροὶ
  choice: இறந்தவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் கிரேக்கப் பெயரடை இயல்பான, தெளிவான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐγείρονται
  choice: உயிருடன் எழுப்பப்படுவதில்லை
  rationale: கிரேக்கத்தின் செயப்பாட்டு வடிவம் காக்கப்படுகிறது; எழுப்புபவர் யார் என்பதை மொழிபெயர்ப்பு வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: நாம் உண்போம், குடிப்போம்
  rationale: ஊக்குவிக்கும் பொருளுடைய கிரேக்கத் துணைவினை வடிவங்களின் கூட்டுத் தீர்மானம் இயல்பான தமிழில் காக்கப்படுகிறது.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: ஏனெனில் நாளை இறந்துபோவோம்
  rationale: கிரேக்கத்தில் நிகழ்கால வடிவம் இருந்தாலும், நாளையைக் குறிக்கும் எதிர்கால நோக்கம் தமிழில் இயல்பாக வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: ἐθηριομάχησα என்பது உண்மையான காட்டு விலங்குகளுடன் நடந்த போராட்டத்தையா, கொடூரமான மனித எதிர்ப்புக்கான உருவகத்தையா குறிக்கிறது?
  choice: முதன்மை உரையில் “காட்டு விலங்குகளோடு போராடினேன்” என்ற நேரடி படிமத்தைத் தக்கவைத்தல்
  alternative: எபேசுவில் கொடூரமான மனித எதிரிகளோடு மோதியதைக் குறிக்கும் உருவகமாக நேரடியாக மொழிபெயர்த்தல்
  rationale: கிரேக்கச் சொல் தரும் படிமம் இரு புரிதல்களுக்கும் இடமளிக்கிறது. வசனத்தின் வாதத்திற்கு இந்த வரலாற்றுக் கேள்வியை மொழிபெயர்ப்பாளர் தீர்க்க வேண்டியதில்லை; ஆகவே தெளிவின்மை அடிக்குறிப்புடன் காக்கப்படுகிறது.
- issue: ἐγείρονται என்ற செயப்பாட்டு வடிவத்தில் எழுப்புபவரை வெளிப்படையாகக் குறிப்பிடலாமா?
  choice: “உயிருடன் எழுப்பப்படுவதில்லை” என்று செயப்பாட்டு வடிவத்தைப் பேணுதல்
  alternative: “கடவுள் இறந்தவர்களை உயிர்த்தெழச் செய்வதில்லை” என்று செய்பவரை வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழலில் கடவுளின் செயல் உள்ளடங்கியிருக்கலாம்; ஆனால் இவ்வசனத்தின் கிரேக்க உரை செய்பவரைப் பெயரிடவில்லை. எனவே உரையில் இல்லாத விளக்கத்தைச் சேர்க்காமல் இலக்கண வடிவம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. “காட்டு விலங்குகளோடு போராடினேன்” என்ற வலுவான மூலப்படிமமும், உயிருடன் எழுப்பப்படுதல் குறித்த செயப்பாட்டு வடிவமும் விளக்கவுரை சேர்க்காமல் காக்கப்பட்டுள்ளன.
