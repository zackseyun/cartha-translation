  to: மனிதக் கண்ணோட்டத்தில் சொல்வதானால்[a], எபேசுவில் நான் காட்டு விலங்குகளோடு போராடினேன் என்றால்[b], அதனால் எனக்கு என்ன பயன்? இறந்தவர்கள் உயிர்த்தெழுப்பப்படுவதில்லை என்றால், “நாம் உண்போம், குடிப்போம்[c]; ஏனெனில் நாளை இறந்துபோவோம்.”
  rationale: The revision removes an added lexical element in the passive resurrection clause and uses standard natural Tamil resurrection terminology. It also slightly broadens the opening idiom so that it can retain the source phrase’s possible reference either to Paul’s manner of speaking or to a human perspective. The ambiguity concerning the wild beasts remains in the main text and is appropriately retained in the footnote.
