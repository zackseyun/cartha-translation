id: 1CO.15.1
reference: 1 Corinthians 15:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: ta
  text: சகோதரர்களே[a], நான் உங்களுக்கு அறிவித்த நற்செய்தியைத் தெரிவிக்கிறேன். அதை நீங்கள் பெற்றீர்கள்; அதில் நீங்கள் நிலைத்திருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதர சகோதரிகளே’ என்றும் பொருள்படலாம். கிரேக்கத்தில் ‘சகோதரர்களே’ என்று உள்ளது; விசுவாசக் குழு முழுவதையும் அழைக்க ஆண்பால் வடிவம் அடிக்கடி பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: தெரியப்படுத்துகிறேன்
  rationale: இவ்வினைச்சொல்லின் நேரடியான பொருள் ‘அறியச் செய்கிறேன்’ அல்லது ‘தெரியப்படுத்துகிறேன்’ என்பதாகும். ஏற்கெனவே அறிந்ததை ‘நினைவூட்டுகிறேன்’ என்று பொருளைச் சுருக்காமல், பவுல் நற்செய்தியை மீண்டும் முன்வைப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது வலுவான எதிர்மறையை அல்ல, மென்மையான உரையாடல் மாற்றத்தைக் குறிக்கிறது. தமிழில் நேரடியான அழைப்புடன் புதிய கருத்தைத் தொடங்குவது இயல்பாகவே அந்த மாற்றத்தை உணர்த்துவதால், ‘இப்போது’ என்று சேர்த்து காலப்பொருள் உருவாக்கப்படவில்லை.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க மூலத்தின் ஆண்பால் பன்மை அழைப்பை வடிவத்துக்கு உண்மையாகக் காக்கிறது. இது முழுச் சபையையும் குறிக்கக்கூடும் என்பதைக் காலடிக்குறிப்பு விளக்குகிறது.
- source_word: τὸ εὐαγγέλιον
  choice: நற்செய்தி
  rationale: மூலச்சொல்லின் வெளிப்படையான ‘நல்ல செய்தி’ என்ற பொருளை, நவீனத் தமிழில் வழக்கமானதும் எளிதில் புரியக்கூடியதுமான ‘நற்செய்தி’ வழங்குகிறது.
- source_word: εὐηγγελισάμην
  choice: அறிவித்த
  rationale: நற்செய்தியைப் பிரகடனப்படுத்திய செயலை இயல்பான தமிழில் கூறுகிறது; ‘பிரசங்கித்த’ என்பதைக் காட்டிலும் பரந்த மூலப்பொருளைக் காக்கிறது.
- source_word: παρελάβετε
  choice: பெற்றுக்கொண்டீர்கள்
  rationale: செய்தி அல்லது மரபைப் பெற்றுக்கொண்டதைக் குறிக்கிறது. ‘ஏற்றுக்கொண்டீர்கள்’ என்று கூறி மனப்பூர்வ ஒப்புதலை அளவுக்கு மீறி முன்னிறுத்தவில்லை.
- source_word: ἐν ᾧ
  choice: அதில்
  rationale: நற்செய்தியே அவர்கள் நிலைத்திருக்கும் தளம் அல்லது சூழல் என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடுத்த வசனத்தின் ‘அதனால்’ என்ற கருத்தை முன்கூட்டியே இங்கே கொண்டுவரவில்லை.
- source_word: ἑστήκατε
  choice: நிலைத்திருக்கிறீர்கள்
  rationale: முன்பு தொடங்கி தற்போது தொடரும் நிலையை கிரேக்க நிறைவுக்கால வடிவம் உணர்த்துகிறது. ‘நிற்கிறீர்கள்’ என்பதைக் காட்டிலும் இச்சூழலில் ‘நிலைத்திருக்கிறீர்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: கலப்பின விசுவாசக் குழுவை நோக்கிய ἀδελφοί என்ற அழைப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’; உள்ளடக்கிய பயன்பாட்டைக் காலடிக்குறிப்பில் விளக்குதல்
  alternative: ‘சகோதர சகோதரிகளே’ அல்லது ‘உடன்பிறப்புகளே’
  rationale: ஆண்பால் வடிவிலுள்ள மூலச்சொல்லை முதன்மை உரை காக்கிறது. அதேவேளையில், பவுலின் பயன்பாட்டில் இது பெண்கள் உட்பட விசுவாசக் குழு முழுவதையும் அடிக்கடி குறிக்கும் என்பதை குறிப்பு தெளிவுபடுத்துகிறது; இதனால் மூலவடிவமும் அதன் பரந்த குறியீடும் இரண்டும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கிய அமைப்பு தமிழில் தெளிவுக்காக மூன்று தொடர்புடைய வாக்கியக்கூறுகளாகப் பிரிக்கப்பட்டுள்ளது; மீளச்சுட்டும் ‘அதை/அதில்’ வடிவங்கள் நற்செய்தியுடனான தொடர்பைத் தெளிவாகக் காக்கின்றன.
