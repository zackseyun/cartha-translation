id: 1CO.8.2
reference: 1 Corinthians 8:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀εἴ τις δοκεῖ ⸀ἐγνωκέναι τι, ⸀οὔπω ⸀ἔγνω καθὼς δεῖ γνῶναι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: ta
  text: தனக்கு ஏதாவது தெரியும் என்று ஒருவர் நினைத்தால்[a], அவர் அறிய வேண்டிய விதத்தில் இன்னும் அறியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்கு எதையாவது அறிந்துவிட்டதாக ஒருவர் நினைத்தால், அவர் அறிய வேண்டிய விதத்தில் இன்னும் அறிந்துகொள்ளவில்லை.”
    reason: ἐγνωκέναι என்ற நிறைவுவினை, அறிவைப் பெற்றுவிட்டதாகக் கருதும் நிலையைக் குறிப்பாக வெளிப்படுத்தவும் முடியும்.
lexical_decisions:
- source_word: εἴ τις
  choice: ஒருவர் ... நினைத்தால்
  rationale: நிபந்தனையையும், குறிப்பிட்ட பாலினத்துக்கோ நபருக்கோ மட்டுப்படாத பொதுவான ஒருமைச் சுட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: δοκεῖ
  choice: நினைத்தால்
  rationale: வெறும் வெளித்தோற்றத்தை அல்ல, ஒருவர் தம்மைப் பற்றிக் கொண்டுள்ள கருத்தையோ மதிப்பீட்டையோ இங்கு குறிக்கிறது.
- source_word: ἐγνωκέναι τι
  choice: தனக்கு ஏதாவது தெரியும்
  rationale: அறிவைப் பெற்றுவிட்ட நிலையைச் சுட்டும் கிரேக்க நிறைவுவினையின் கருத்தை இயல்பான தமிழில் கூறுகிறது; τι என்பதன் வரையறுக்கப்படாத பொருளை ‘ஏதாவது’ காக்கிறது.
- source_word: οὔπω ἔγνω
  choice: இன்னும் அறியவில்லை
  rationale: அறிவு முற்றிலும் இல்லை என்று கூறாமல், அது இன்னும் குறைவான நிலையில் இருப்பதை உணர்த்தும் காலநயத்தைப் பாதுகாக்கிறது.
- source_word: καθὼς δεῖ γνῶναι
  choice: அறிய வேண்டிய விதத்தில்
  rationale: அறிதலுக்குரிய முறை அல்லது அளவுகோலைக் குறிக்கும் καθὼς என்பதையும், δεῖ என்பதிலுள்ள அவசியம் அல்லது தகுதியையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: பொதுவான ஒருமைச் சுட்டு
  choice: ஒருவர் ... அவர்
  alternative: யாராவது ... அவர்கள்
  rationale: τις என்பது பாலினத்தால் வரையறுக்கப்படாத ஒருமைச் சுட்டு. ‘ஒருவர் ... அவர்’ என்பது இதை நவீன தரத் தமிழில் இயல்பாகவும் மரியாதையாகவும் காக்கிறது; ஆண்களை மட்டும் குறிக்கவில்லை.
- issue: பவுலின் அறிவு குறித்த கண்டனம்
  choice: அறிவை முற்றிலும் மறுப்பதல்ல; தன்னம்பிக்கை மிகுந்த அறிவின் குறைபாட்டைச் சுட்டுதல்
  alternative: மனிதருக்கு எந்த அறிவும் இல்லை என்ற முழுமையான மறுப்பு
  rationale: ‘இன்னும்’ என்றும் ‘அறிய வேண்டிய விதத்தில்’ என்றும் உரை கூறுவதால், அறிவே இல்லை என்பதற்குப் பதிலாக அதன் முறை அல்லது முதிர்ச்சி குறைவாக இருப்பதே வலியுறுத்தப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் வகையிலும், பவுலின் கண்டனத்திலுள்ள கண்ணியமும் அறிவுசார் தாழ்மைக்கான அழைப்பும் நிலைத்திருக்குமாறும் அமைக்கப்பட்டுள்ளது. ‘தனக்கு’ என்பது தன்னிலை மதிப்பீட்டை இயல்பாக வெளிப்படுத்துகிறது; பிரதான உரையில் ‘தெரியும்/அறியவில்லை’ என்ற சிறிய சொல் வேறுபாடு தமிழின் இயல்புக்காகப் பயன்படுத்தப்பட்டுள்ளது.
