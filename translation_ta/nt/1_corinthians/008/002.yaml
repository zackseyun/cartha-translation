  verdict: revise
  source_fidelity: The conditional force, generic reference, indefinite object, temporal nuance of οὔπω, and normative manner expressed by καθὼς δεῖ γνῶναι are all retained. The main wording naturally renders the perfect ἐγνωκέναι as a claimed state of knowledge; the footnote appropriately records a more explicit perfect-oriented alternative.
  naturalness: The draft is generally clear and modern, but it shifts awkwardly between the reflexive honorific pronoun ‘தாம்’ and ‘அவர்’ for the same generic subject in the latter clause. Using ‘அவர்’ consistently after ‘ஒருவர்’ is more natural and syntactically clear.
  terminology: ‘தெரியும்’ in the first clause and ‘அறியவில்லை’ in the second are idiomatic Tamil and suitably convey the contrast without implying that all knowledge is absent. ‘அறிய வேண்டிய விதத்தில்’ accurately renders the required manner/standard of knowing.
