  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: ta
  text: ஆனால், உங்களுடைய இந்த உரிமை பலவீனமானவர்களுக்கு இடறுதற்குக் காரணமாகிவிடாதபடி கவனமாக இருங்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களுடைய இந்தச் சுதந்திரம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ‘அதிகாரம்,’ ‘உரிமை,’ அல்லது ‘சுதந்திரம்’ என்று பொருள்படலாம்; இங்கே சிலைகளுக்குப் படைக்கப்பட்ட உணவை உண்பதற்குத் தங்களுக்கு இருப்பதாகச் சில விசுவாசிகள் கருதிய சுதந்திரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கே ‘பலவீனமானவர்கள்’ என்பது இந்த விஷயத்தில் மனசாட்சி பலவீனமாக இருப்பவர்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: பார்த்துக்கொள்ளுங்கள்
  rationale: எச்சரிக்கையுடன் கவனிக்கும்படி கூறும் கட்டளை வடிவத்தின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்திலிருந்து எச்சரிக்கைக்கு மாறும் மென்மையான எதிர்மறைத் தொடர்பைக் காட்டுகிறது.
- source_word: μή πως
  choice: எவ்விதத்திலாவது ... ஆகிவிடாதபடி
  rationale: நிகழக்கூடிய ஓர் எதிர்மறை விளைவைத் தவிர்க்குமாறு கூறும் முன்னெச்சரிக்கையைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: உங்களுடைய இந்த உரிமை
  rationale: சிலைப் படையலுடன் தொடர்புடைய உணவை உண்ணத் தங்களுக்கு இருப்பதாகச் சிலர் கருதிய உரிமையைச் சூழலுக்கேற்றவாறு குறிக்கிறது; சொல்லின் ‘அதிகாரம்/சுதந்திரம்’ என்ற பொருள் வாய்ப்புகள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: πρόσκομμα
  choice: இடறல்
  rationale: மற்றொருவரை ஒழுக்க அல்லது ஆவிக்குரிய வீழ்ச்சிக்கு இட்டுச் செல்லும் தடையைச் சுட்டும் மூல உருவகத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: γένηται
  choice: ஆகிவிடாதபடி
  rationale: ‘ஆகுதல்’ என்ற அடிப்படைப் பொருளையும், எச்சரிக்கை வாக்கியத்தின் எதிர்மறை நோக்கையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῖς ἀσθενέσιν
  choice: பலவீனமானவர்களுக்கு
  rationale: மூலத்தின் சுருக்கத்தைக் காக்கிறது; எந்த வகைப் பலவீனம் என்பது அதிகாரச் சூழலாலும் அடிக்குறிப்பாலும் விளக்கப்படுகிறது.
theological_decisions:
- issue: ἐξουσία என்பதன் சூழல்சார் பொருள்
  choice: சிலைப் படையலுடன் தொடர்புடைய உணவை உண்ணத் தங்களுக்கு இருப்பதாகக் கொரிந்தியர் கருதிய உரிமை
  alternative: பொதுவான அதிகாரம் அல்லது சுதந்திரம்
  rationale: 1 கொரிந்தியர் 8-ன் உடனடிச் சூழல் உணவு தொடர்பான செயல் சுதந்திரத்தைப் பற்றியது. ‘உரிமை’ அந்த நடைமுறைப் பொருளைத் தெளிவாகக் காட்டுகிறது; பிற உண்மையான பொருள் வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: τοῖς ἀσθενέσιν என்பவர்கள் யார்
  choice: இந்த விஷயத்தில் மனசாட்சி பலவீனமாக உள்ளவர்கள்
  alternative: பொதுவான பொருளில் பலவீனமானவர்கள் அல்லது உடல் பலவீனமுள்ளவர்கள்
  rationale: இந்த அதிகாரம் ‘பலவீனம்’ என்பதை மனசாட்சியின் பாதிப்புக்குள்ளாகும் நிலையோடு இணைக்கிறது. எனினும் மூலத்தின் சுருக்கத்தைப் பாதுகாக்க முதன்மை உரையில் ‘பலவீனமானவர்கள்’ என்று மட்டும் வைத்து, விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இடறல்’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டு, தெளிவிற்காகச் சொற்பொருள் மற்றும் சூழல் குறிப்புகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
