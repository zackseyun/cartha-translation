revisions:
- from: ஆனால் உணவு நம்மைக் கடவுள்முன் நிறுத்தப்போவதில்லை[a]. ஏனெனில், நாம் சாப்பிட்டால் மிகுதியடைவதும் இல்லை[b]; சாப்பிடாவிட்டால் குறைவுபடுவதும் இல்லை.
  to: ஆனால் உணவு நமக்குக் கடவுளின் அங்கீகாரத்தைப் பெற்றுத்தராது[a]. ஏனெனில், நாம் சாப்பிட்டால் நமக்கு எந்த ஆதாயமும் கிடையாது[b]; சாப்பிடாவிட்டால் நமக்குக் குறைவும் ஏற்படாது.
  rationale: 'The first clause is revised from a formally literal presentation image to the contextual sense that food does not secure God’s approval. The final clauses are recast in natural modern Tamil as a parallel contrast: eating brings no advantage, and abstaining brings no deficiency. Both footnote anchors are retained and their alternatives correspond to defensible lexical renderings.'
