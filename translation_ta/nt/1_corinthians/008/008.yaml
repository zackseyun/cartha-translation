source:
  edition: SBLGNT
  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: ta
  text: ஆனால் உணவு நமக்குக் கடவுளின் அங்கீகாரத்தைப் பெற்றுத்தராது[a]. ஏனெனில், நாம் சாப்பிட்டால் நமக்கு எந்த ஆதாயமும் கிடையாது[b]; சாப்பிடாவிட்டால் நமக்குக் குறைவும் ஏற்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணவு நம்மைக் கடவுளிடம் ஏற்றுக்கொள்ளத்தக்கவர்களாக்காது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாம் சாப்பிட்டால் மேம்படுவதும் இல்லை; சாப்பிடாவிட்டால் குறைவுபடுவதும் இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: உணவு
  rationale: குறிப்பிட்ட இறைச்சியையோ உணவுவேளையையோ அல்லாமல், உணவைப் பொதுவாகக் குறிக்கும் சொல்லாகும்.
- source_word: παραστήσει
  choice: கடவுள்முன் நிறுத்தப்போவதில்லை
  rationale: παρίστημι என்பதன் அடிப்படை ‘முன்னிலையில் நிறுத்துதல்/சமர்ப்பித்தல்’ என்ற பொருளைத் தக்கவைக்கிறது; கடவுளோடு நெருங்கச் செய்வது அல்லது அங்கீகாரம் பெற்றுத்தருவது என்ற ஒரே விளக்கத்துக்குள் பொருளைச் சுருக்கவில்லை.
- source_word: τῷ θεῷ
  choice: கடவுள்முன்
  rationale: παραστήσει உடன் வரும் இலக்கு/முன்னிலை சார்ந்த தத்துவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὔτε γὰρ ἐὰν φάγωμεν, περισσεύομεν
  choice: ஏனெனில், நாம் சாப்பிட்டால் மிகுதியடைவதும் இல்லை
  rationale: περισσεύω என்பதிலுள்ள மிகுதி அல்லது மேலதிகம் பெறுதல் என்ற உருவகத்தைப் பாதுகாத்து, உண்பதால் ஆன்மீக நன்மை உறுதி என்ற விளக்கத்தைச் சேர்க்காமல் விடுகிறது.
- source_word: οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα
  choice: சாப்பிடாவிட்டால் குறைவுபடுவதும் இல்லை
  rationale: ὑστερέω என்பதன் குறைவு அல்லது பற்றாக்குறை என்ற பொருளை, முந்தைய ‘மிகுதி’ என்பதற்கு இணையான எதிர்மறை அமைப்பில் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்தோடு உள்ள மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முதல் கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: உணவு கடவுள்முன் ஒருவரின் நிலையை மாற்றுகிறதா, அல்லது வெறும் சமய மதிப்பற்றதா
  choice: உணவு தானாகவே ஒருவரைக் கடவுள்முன் நிறுத்துவதில்லை; உண்பதாலும் தவிர்ப்பதாலும் மிகுதியோ குறைவோ ஏற்படாது என்ற திறந்த வடிவம்
  alternative: உணவு கடவுளின் அங்கீகாரத்தைப் பெற்றுத்தராது அல்லது கடவுளிடம் நெருங்கச் செய்யாது
  rationale: παραστήσει என்ற சொல் முன்னிலையில் நிறுத்துதல், சமர்ப்பித்தல், ஏற்றுக்கொள்ளப்படுதல் போன்ற பொருள் நிழல்களை அனுமதிக்கிறது. மொழிபெயர்ப்பு அவற்றில் ஒன்றை மட்டும் இறையியல் முடிவாக நிர்ணயிக்காமல், உண்பதும் தவிர்ப்பதும் தாமாகவே கடவுள்முன் நன்மையையோ இழப்பையோ உண்டாக்காது என்ற பவுலின் எதிரிணையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘சாப்பிடுதல்’ இயல்பான நடப்புத் தமிழாகவும், ‘மிகுதியடைதல்/குறைவுபடுதல்’ மூலத்தின் சமச்சீர் எதிரிணையைத் தக்கவைக்கும் சற்றே முறையான சொற்களாகவும் பயன்படுத்தப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
