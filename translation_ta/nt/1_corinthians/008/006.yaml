id: 1CO.8.6
reference: 1 Corinthians 8:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: ta
  text: ஆனாலும், நமக்கோ ஒரே கடவுள் இருக்கிறார்—அவர் தந்தை; அனைத்தும் அவரிடமிருந்து, நாமும் அவருக்காக இருக்கிறோம். ஒரே ஆண்டவரும் இருக்கிறார்—அவர் இயேசு மேசியா; அனைத்தும் அவர் வழியாக, நாமும் அவர் வழியாக இருக்கிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனாலும்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ‘கடவுள்கள்’ மற்றும் ‘ஆண்டவர்கள்’ என்போருக்கு மாறாக, பவுலின் அறிக்கையைத் தெளிவாகக் காட்டும் இயல்பான எதிர்மறை இணைப்புச்சொல்.
- source_word: ἡμῖν
  choice: நமக்கோ
  rationale: இது தொடர்பைக் குறிக்கும் வேற்றுமை வடிவம்; ‘-ஓ’ முந்தைய கருத்துடன் உள்ள வேறுபாட்டையும் ‘நமக்கு’ என்ற அறிக்கை நிலைப்பாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἷς θεὸς ὁ πατήρ
  choice: ஒரே கடவுள் இருக்கிறார்—அவர் தந்தை
  rationale: ‘ஒரே கடவுள்’ என்ற அறிக்கையின் வலிமையையும், அவரை ‘தந்தை’ என்று அடையாளப்படுத்தும் கிரேக்க வாக்கிய அமைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐξ οὗ τὰ πάντα
  choice: அவரிடமிருந்தே அனைத்தும் வந்தன
  rationale: ἐξ என்பதன் மூலாதாரப் பொருளை ‘இருந்து’ என்பதும், வினைச்சொல் விடுபட்டுள்ள கிரேக்கச் சொற்றொடரை இயல்பான தமிழில் ‘வந்தன’ என்பதும் வெளிப்படுத்துகின்றன.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: நாமும் அவருக்காக இருக்கிறோம்
  rationale: εἰς குறிக்கக்கூடிய திசை, இலக்கு, நோக்கம் ஆகியவற்றில் இங்கு இறுதி நோக்கை இயல்பாகக் காட்டுகிறது; ‘அவரை நோக்கி’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: καὶ εἷς κύριος
  choice: ஒரே ஆண்டவரும் இருக்கிறார்
  rationale: ‘ஒரே கடவுள்’ என்பதற்கு இணையான அமைப்பையும் κύριος என்பதன் உயர்ந்த பட்டப்பெயரையும் பாதுகாக்கிறது.
- source_word: Ἰησοῦς Χριστός
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பெயரைப் போன்ற நிலையான வடிவாக ‘இயேசு கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம்.
- source_word: δι’ οὗ τὰ πάντα
  choice: அவர் வழியாகவே அனைத்தும் வந்தன
  rationale: διά + மரபுவேற்றுமை தெரிவிக்கும் இடைமை அல்லது செயல்முகத்தை ‘வழியாக’ என்பதால் பாதுகாக்கிறது; ‘-வே’ கிரேக்க இணை அமைப்பின் வலிமையைத் தருகிறது.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: நாமும் அவர் வழியாகவே இருக்கிறோம்
  rationale: கிரேக்கத்தின் சுருக்கத்தையும், இது இருப்பு, வாழ்வு அல்லது மீட்பு ஆகியவற்றில் எதைச் சிறப்பாகக் குறிக்கிறது என்பதைத் தீர்மானிக்காமல் அதன் திறந்த பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘ஒரே கடவுள்’ மற்றும் ‘ஒரே ஆண்டவர்’ என்பவற்றின் உறவு
  choice: ‘ஒரே கடவுள்—தந்தை’ என்றும் ‘ஒரே ஆண்டவர்—மேசியாவாகிய இயேசு’ என்றும் உள்ள இணை அறிக்கை மாற்றமின்றி வைக்கப்பட்டது.
  alternative: ‘ஆண்டவர்’ என்பதன் வலிமையைக் குறைத்தல் அல்லது பிற்கால இறையியல் சொற்களை வசனத்திற்குள் சேர்த்தல்.
  rationale: வசனம் தந்தையையும் இயேசுவையும் வேறுபடுத்திக்கொண்டே ஒரேகடவுள் அறிக்கைக்குள் வலிமையான கிறிஸ்துவியல் உரையை முன்வைக்கிறது. அந்த இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு விளக்கித் தீர்க்காமல் பாதுகாக்கிறது.
- issue: தந்தையையும் மகனையும் விவரிக்கும் முன்னிடைச்சொற்கள்
  choice: ἐξ என்பதற்கு ‘இருந்து’, εἰς என்பதற்கு ‘அவருக்காக’, διά என்பதற்கு ‘வழியாக’ பயன்படுத்தப்பட்டது.
  alternative: εἰς என்பதற்கு ‘அவரை நோக்கி’; διά என்பதற்கு சூழலை விரித்து ‘அவரால் படைக்கப்பட்டன’ என்று மொழிபெயர்த்தல்.
  rationale: தந்தையை மூலமும் இலக்கும் எனவும், இயேசுவை இடைமுகமாகவும் காட்டும் வேறுபாட்டை இச்சொற்கள் தக்கவைக்கின்றன; மூலத்தில் இல்லாத கூடுதல் இறையியல் விளக்கத்தைத் தவிர்க்கின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘இருக்கிறார்/இருக்கிறோம்’ மற்றும் ‘வந்தன’ ஆகிய வினைகள் தமிழின் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளன. ‘ஒரே கடவுள்’ / ‘ஒரே ஆண்டவர்’ மற்றும் ‘அவரிடமிருந்து’ / ‘அவர் வழியாக’ என்ற இணை அமைப்புகள் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
