source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: ta
  text: இவ்வாறு சகோதரர்களுக்கு[a] எதிராகப் பாவம் செய்து, பலவீனமாயிருக்கும் அவர்களுடைய மனச்சாட்சியைக் காயப்படுத்தி, நீங்கள் மேசியாவுக்கு[b] எதிராகப் பாவம் செய்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘சகோதரர்கள்’ என்பது சக விசுவாசிகளைக் குறிக்கிறது; சூழலின்படி இதில் ஆண்களும் பெண்களும் அடங்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கிறிஸ்துவுக்கு.’ Χριστός என்பது கிரேக்கப் பட்டம்.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: இவ்வாறு
  rationale: οὕτως முன்பு விவரிக்கப்பட்ட விதத்தைச் சுட்டுகிறது; δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் முந்தைய கருத்துடன் மெதுவாக இணைக்கிறது. தமிழில் ‘இவ்வாறு’ இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: சகோதரர்களுக்கு எதிராகப் பாவம் செய்து
  rationale: ἁμαρτάνοντες என்பது முதன்மை வினையின் சூழல் அல்லது முறையைக் காட்டும் நிகழ்காலப் பங்கேற்புவினை; εἰς இங்கு ஒருவருக்கு எதிரான செயலைக் குறிக்கிறது. ἀδελφοὺς ஆண்பால் பன்மை வடிவமாக இருப்பதால் ‘சகோதரர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τύπτοντες
  choice: காயப்படுத்துவதால்
  rationale: τύπτω என்பதன் அடிப்படைப் பொருள் ‘அடித்தல்’; இங்கு மனச்சாட்சியைப் பற்றிய உருவகப் பயன்பாட்டில் ‘காயப்படுத்துதல்’ என்பது அதன் தீவிரத்தைக் காத்து, இயல்பான தமிழையும் தருகிறது.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: பலவீனமாயிருக்கும் அவர்களுடைய மனச்சாட்சியை
  rationale: கிரேக்கத்தில் ‘மனச்சாட்சி’ ஒருமையிலும், ‘அவர்களுடைய’ பன்மையிலும் உள்ளது; தமிழிலும் இந்தப் பகிர்ந்தளிக்கும் ஒருமை தெளிவாகவும் இயல்பாகவும் இருக்கிறது. ἀσθενοῦσαν மனச்சாட்சியின் பலவீனமான நிலையைக் குறிக்கிறது.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: மேசியாவுக்கு எதிராகப் பாவம் செய்கிறீர்கள்
  rationale: εἰς இங்கும் எதிரான திசையை உணர்த்துகிறது. Χριστός அபிஷேகம் செய்யப்பட்டவரைக் குறிக்கும் பட்டமாக இருப்பதால் ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது. நிகழ்கால வினை தொடரும் அல்லது நடைமுறையிலுள்ள செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: திருச்சபைச் சூழலில் ἀδελφοὺς என்பதன் வரம்பு
  choice: சகோதரர்கள்
  alternative: சக விசுவாசிகள்; சகோதர சகோதரிகள்
  rationale: மூலச்சொல் இலக்கணப்படி ஆண்பால் பன்மை. ஆனால் இந்த நிருபச் சூழலில் அது ஆண்களையும் பெண்களையும் உள்ளடக்கிய சக விசுவாசிகளைக் குறிக்கக்கூடும்; அந்த விரிவை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அபிஷேகம் செய்யப்பட்ட ஆண்டவருக்கு எதிராகப் பாவம் செய்வது கூறப்படுவதால் பட்டத்தின் பொருள் உயிரோடு உள்ளது. மரபான ‘கிறிஸ்து’ என்ற வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் பங்கேற்புவினை அமைப்பு தமிழில் காரணம்/முறை காட்டும் ‘செய்து … காயப்படுத்துவதால்’ என்ற தொடரால் இயல்பாக்கப்பட்டுள்ளது; மூலத்தின் உருவகத் தீவிரமும் இறையியல் பதற்றமும் காக்கப்பட்டுள்ளன.
