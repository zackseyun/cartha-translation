translation:
  language: ta
  text: ஆனால், யாராவது கடவுளை நேசித்தால், அப்படிப்பட்டவர் கடவுளால் அறியப்பட்டிருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுளால் அறியப்படுகிறார்’ அல்லது ‘கடவுளால் அறிந்துகொள்ளப்பட்டிருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிறைவுக்காலச் செயப்பாட்டு வினை, கடவுளால் அறியப்பட்ட நிலை தொடர்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: ஆனால், ... என்றால்
  rationale: εἰ நிபந்தனையையும் δέ முந்தைய கருத்துடன் மென்மையான முரண்பாட்டையும் குறிக்கிறது; இந்தத் தமிழ் அமைப்பு இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τις
  choice: யாராவது
  rationale: குறிப்பிடப்படாத எந்த நபரையும் உள்ளடக்கும் பொதுவான பொருளை நவீன தமிழில் இயல்பாகக் காக்கிறது.
- source_word: ἀγαπᾷ
  choice: அன்புகூர்ந்தால்
  rationale: ἀγαπάω என்பதன் நிகழ்காலச் செயற்பாட்டுப் பொருளை நேரடியாகத் தருகிறது; நிபந்தனை வாக்கியத்தில் தமிழ் இலக்கணத்துக்கு ஏற்ப அமைக்கப்பட்டுள்ளது.
- source_word: τὸν θεόν
  choice: கடவுளிடம்
  rationale: அன்பு செலுத்தப்படும் நபராகக் கடவுளைக் குறிக்கிறது; ‘கடவுளிடம் அன்புகூருதல்’ என்பது இயல்பான, தெளிவான நவீன தமிழ் நடை.
- source_word: οὗτος
  choice: அவர்
  rationale: முன்னர் குறிப்பிடப்பட்ட நபரையே சுட்டுகிறது. கிரேக்கத்தில் உள்ள சுட்டுவலிமை தமிழில் வாக்கியத் தொடர்பால் தெளிவாக இருப்பதால், இயல்பற்ற ‘இந்த நபர்’ என்பதற்குப் பதிலாக மரியாதையான பொதுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἔγνωσται
  choice: அறியப்பட்டிருக்கிறார்
  rationale: γινώσκω என்பதன் நிறைவுக்காலச் செயப்பாட்டு வடிவம், முந்திய அறிதலின் விளைவாகத் தொடரும் தற்போதைய நிலையை உணர்த்துகிறது; ‘அறியப்பட்டிருக்கிறார்’ அந்த அம்சத்தைத் தமிழில் காக்கிறது.
- source_word: ὑπ’ αὐτοῦ
  choice: கடவுளால்
  rationale: αὐτοῦ என்பது முன் வந்த கடவுளையே குறிக்கிறது. தமிழில் ‘அவரால்’ என்பது அன்புகூரும் நபரைக் குறிக்கிறதா என்ற குழப்பத்தை ஏற்படுத்தக்கூடும் என்பதால், குறிப்புப்பெயர் மீண்டும் சொல்லப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுள் ‘அறிவது’ என்பதன் பொருள்
  choice: கடவுளால் அறியப்பட்டிருக்கிறார்
  alternative: கடவுளால் அங்கீகரிக்கப்பட்டிருக்கிறார் / ஏற்றுக்கொள்ளப்பட்டிருக்கிறார்
  rationale: கடவுள் எழுவாயாக வரும் γινώσκω உறவுசார்ந்த அறிதல், அங்கீகாரம் அல்லது ஏற்றுக்கொள்ளுதல் போன்ற ஆழத்தைக் கொண்டிருக்கலாம். ஆனால் இவ்வசனம் அவற்றுள் ஒன்றை மட்டும் கட்டாயப்படுத்தாததால், அதன் இறையியல் விரிவும் இழுபறியும் ‘அறியப்பட்டிருக்கிறார்’ என்பதில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அறியப்பட்டிருக்கிறார்’ என்ற சற்று செறிவான வடிவம் கிரேக்க நிறைவுக்காலத்தின் தொடரும் நிலையைப் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டது; பாலினத்தைக் குறிப்பாகச் சுமத்தாத மரியாதைப் பொதுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
