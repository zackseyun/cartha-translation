reference: 1 Corinthians 8:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: ta
  text: ஏனெனில், உன் அறிவினால் பலவீனமாயிருப்பவன் அழிவுக்குள்ளாகிறான்[a]—அதாவது, மேசியா[c] இறந்த அந்தச் சகோதரன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அழிந்துபோகிறான்” அல்லது “நாசமடைகிறான்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் கடுமையான அழிவையோ நாசத்தையோ குறிக்கலாம்; இது இவ்வாழ்வில் நேரும் ஆன்மீகச் சீரழிவா, இறுதி அழிவா, அல்லது இரண்டுமா என்பதை இங்கு திட்டவட்டமாகத் தீர்மானிக்கவில்லை.
    reason: alternative_reading
  - marker: b
    text: இங்கு “சகோதரன்” என்பது சக விசுவாசியைக் குறிக்கிறது; சூழலின்படி இந்தப் பயன்பாடு விசுவாசத்திலுள்ள சகோதரனையோ சகோதரியையோ உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கில் Χριστός; அதாவது “கிறிஸ்து.” இங்கு அது ஒரு பட்டமாகச் செயல்படுவதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: அழிவுக்குள்ளாகிறான்
  rationale: நிகழ்கால நடுவினை/செயப்பாட்டு வடிவத்தின் கடுமையான ‘அழிவு, நாசம்’ என்ற பொருளைத் தக்கவைக்கிறது; இது தற்கால ஆன்மீகச் சீரழிவா, இறுதி அழிவா, இரண்டுமா என்பதைத் தீர்மானித்துவிடவில்லை.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிப்புக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: ὁ ἀσθενῶν
  choice: பலவீனமாயிருப்பவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நிகழ்காலப் பங்கேற்புவினையின் ஒருமையையும், ‘சகோதரன்’ என்பதை இங்கே முன்கூட்டியே சேர்க்காத மூல அமைப்பையும் காக்கிறது.
- source_word: ἐν τῇ σῇ γνώσει
  choice: உன் அறிவினால்
  rationale: ἐν இங்கு அறிவைப் பயன்படுத்தும் செயலே பலவீனமானவனின் அழிவுக்குக் கருவியாக அல்லது காரணமாக அமைவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: γνῶσις
  choice: அறிவு
  rationale: இதே சூழலில் பவுல் மீண்டும் மீண்டும் பயன்படுத்தும் ‘அறிவு’ என்ற கருத்தையும் அதன் நையாண்டித் தன்மையையும் காக்கிறது.
- source_word: ὁ ἀδελφός
  choice: அந்தச் சகோதரன்
  rationale: ஆண்பால் ஒருமை வடிவத்தை முதன்மை உரையில் காக்கிறது; இங்கு உடன்பிறந்தவனை அல்ல, சக விசுவாசியைக் குறிக்கும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: δι’ ὃν
  choice: அவனுக்காக
  rationale: διά + குற்றுவேற்றுமை சார்புப்பெயரின் ‘யாருக்காக / யாரின் நிமித்தம்’ என்ற பயனாளர் சார்ந்த பொருளை நேரடியாகத் தருகிறது.
- source_word: Χριστός
  choice: மேசியா
  rationale: இங்கு Χριστός ஒரு பட்டமாகச் செயல்படுவதால் அதன் ‘அபிஷேகம் பெற்றவர்’ என்ற மேசியாப் பொருளை வெளிப்படுத்துகிறது.
- source_word: ἀπέθανεν
  choice: இறந்தார்
  rationale: இறந்தது என்ற நிறைவுற்ற வரலாற்றுச் செயலை இயல்பான தமிழ் இறந்தகாலத்தில் தருகிறது; மரியாதைப் பன்மை தமிழின் வழக்கமான இயேசு குறிப்பு நடைக்கு ஏற்றது.
theological_decisions:
- issue: ἀπόλλυται என்பது உண்மையான விசுவாசியின் இறுதி நித்திய அழிவை அவசியமாகக் குறிக்கிறதா?
  choice: அழிவுக்குள்ளாகிறான்
  alternative: அழிந்துபோகிறான்; நாசமடைகிறான்
  rationale: வினைச்சொல்லின் கடுமையை மெலிதாக்காமல் காக்கிறது; அதே நேரத்தில் இது மனச்சாட்சிக்கும் ஆன்மீக வாழ்வுக்கும் நேரும் கடும் சேதமா, இறுதி அழிவா என்று விவாதிக்கப்படும் கேள்வியை மொழிபெயர்ப்பே தீர்த்துவிடாமல் விடுகிறது.
- issue: ἀδελφός என்பதை பாலினப் பொதுமைப்படுத்தலாக மாற்ற வேண்டுமா?
  choice: அந்தச் சகோதரன்
  alternative: சக விசுவாசி; சகோதரன் அல்லது சகோதரி
  rationale: மூலத்தின் ஆண்பால் ஒருமையை முதன்மை உரையில் காக்கிறது; சூழலில் அதன் பயன்பாடு சகோதரிகளையும் உள்ளடக்கலாம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: Χριστός என்பதை பெயர்போல் ‘கிறிஸ்து’ எனவா, பட்டமாக ‘மேசியா’ எனவா தருவது?
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் அது இயேசுவின் மீட்புச் செயலைச் சுட்டும் பட்டமாகச் செயல்படுவதால், பட்டத்தின் பொருள் வெளிப்படும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வசனத்தின் தாமதமான விளக்கவொட்டு அமைப்பையும் அதன் சொல்லழுத்தத்தையும் இயன்றவரை காக்க நீண்ட கோடு மற்றும் தொடரும் விளக்கவாக்கியம் பயன்படுத்தப்பட்டுள்ளன.
