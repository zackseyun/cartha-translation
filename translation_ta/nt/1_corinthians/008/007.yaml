source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: ta
  text: ஆனால் இந்த அறிவு எல்லாரிடமும் இல்லை. சிலர், சிலையோடு இருந்த பழக்கம் இன்றுவரை தொடர்வதால்[a][b], அதைச் சிலைக்குப் பலியிடப்பட்ட உணவாகக் கருதி உண்கிறார்கள்; அவர்களுடைய பலவீனமான மனச்சாட்சி கறைபடுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “சிலையோடு இன்றுவரை உள்ள பழக்கத்தினால்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது; சிலர் தங்களுடைய முந்தைய சிலைவழிபாட்டுத் தொடர்பின் தாக்கத்தில் இன்னும் இருப்பதை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப்பிரதிகளில் இப்பகுதியில் “சிலையின் மனச்சாட்சி” அல்லது அதனோடு தொடர்புடைய வேறுபட்ட வாசகங்கள் உள்ளன; முதன்மை உரை SBLGNT வாசகத்தைப் பின்பற்றுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: அறிவு
  rationale: முந்தைய வசனங்களில் சிலையைப் பற்றித் தாங்கள் அறிந்திருப்பதாகக் கூறுவோரையும், சிலை ஒன்றுமில்லை என்ற புரிதலையும் இணைக்கும் பவுலின் சொற்பயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: συνήθεια
  choice: பழகிவந்த பழக்கம்
  rationale: வெறும் பொதுவான வழக்கத்தை அல்லாமல், சிலைவழிபாட்டோடு முன்பிருந்து தொடரும் பரிச்சயத்தையும் பழக்கத்தின் தாக்கத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கச் சொற்றொடரின் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: இன்றுவரை சிலையோடு
  rationale: ἕως ἄρτι என்பதன் காலக் குறிப்பையும், சிலையுடனான தொடர்பைக் குறிக்கும் கடினமான உறவுநிலைத் தொடரையும் முடிந்தவரை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: εἰδωλόθυτον
  choice: சிலைக்குப் படைக்கப்பட்ட உணவு
  rationale: சிலைக்குப் பலியாகப் படைக்கப்பட்ட உணவைக் குறிக்கிறது. சூழலில் உணவின் வழிபாட்டுத் தொடர்பு முக்கியமானதால் ‘உணவு’ மற்றும் ‘படைக்கப்பட்ட’ ஆகிய இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: συνείδησις
  choice: மனச்சாட்சி
  rationale: நெறிசார் உள்ளுணர்வையும் தன் செயலுக்கான உள்மதிப்பீட்டையும் குறிக்கும் பவுலின் வழக்கமான பயன்பாட்டுக்கு ஏற்ற நவீனத் தமிழ் சொல்.
- source_word: ἀσθενής
  choice: பலவீனமாக இருக்கும்
  rationale: இந்த அதிகாரத்தில் மனச்சாட்சியின் உறுதியின்மையைக் குறிக்கும் பவுலின் உருவகத்தை விளக்கிச் சீர்செய்யாமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: μολύνεται
  choice: கறைபடுகிறது
  rationale: மனச்சாட்சி மாசுபடுவதைச் சுட்டும் ஒழுக்கநெறிசார் உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: சிலைக்குப் படைக்கப்பட்ட உணவின் நிலையை, சிலைகள் உண்மையான தெய்வங்கள் என்று உணர்த்தாமல் மொழிபெயர்த்தல்
  choice: அதைச் சிலைக்குப் படைக்கப்பட்ட உணவாகவே உண்கிறார்கள்
  alternative: அதைச் சிலைக்கான பலியாக உண்கிறார்கள்
  rationale: உண்போரின் பார்வையில் அந்த உணவுக்குள்ள வழிபாட்டுத் தொடர்பை இந்த வடிவம் வெளிப்படுத்துகிறது; சிலை உண்மையான தெய்வம் என பவுல் ஏற்றுக்கொள்வதாகச் சொல்லவில்லை. சிலை ஒன்றுமில்லை என்ற அறிவுக்கும், அதனோடு தொடர்புடைய செயல் பலவீனமான மனச்சாட்சியைக் கறைப்படுத்தக்கூடும் என்பதற்கும் இடையிலான பதற்றம் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சிலை’, ‘மனச்சாட்சி’, ‘கறைபடுகிறது’ ஆகிய சொற்கள் வசனத்தின் வழிபாட்டு, நெறிசார் நிறையைத் தக்கவைக்கின்றன. கடினமான கிரேக்கத் தொடரை அளவுக்கு மீறி விளக்காமல், அதன் சொற்பொருளும் உரைவேறுபாடும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
