source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: ta
  text: ஆகவே, சிலைகளுக்குப் படைக்கப்பட்ட உணவை உண்பதைப் பற்றி, உலகத்தில் சிலை என்பது ஒன்றுமில்லை[a] என்றும், ஒரே கடவுளைத் தவிர வேறு கடவுள் இல்லை[b] என்றும் நாம் அறிந்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உலகத்தில் ஒரு சிலைக்கும் உண்மையான இருப்பு இல்லை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரே ஒரு தெய்வத்தைத் தவிர வேறு தெய்வம் இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: உண்பது
  rationale: இந்தப் பெயர்ச்சொல் உணவைக் காட்டிலும் உண்ணும் செயலைக் குறிக்கிறது; περὶ உடனான அமைப்பில் அதன் வினைச்செயல் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: εἰδωλοθύτων
  choice: சிலைகளுக்குப் படைக்கப்பட்ட உணவு
  rationale: புறச்சமயப் பலிப்படையலுடன் தொடர்புடைய உணவைப் பொதுவாகக் குறிக்கிறது; ‘இறைச்சி’ என்று பொருளைச் சுருக்காமல் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: οἴδαμεν
  choice: நாம் அறிந்திருக்கிறோம்
  rationale: நிகழ்காலப் பொருளுடைய perfect வடிவையும், பவுல் கொரிந்தியருடன் பகிர்ந்த அறிவைச் சுட்டும் சொல்லாட்சியையும் வெளிப்படுத்துகிறது.
- source_word: οὐδὲν εἴδωλον
  choice: சிலை என்பது ஒன்றுமில்லை
  rationale: கிரேக்கத்தின் சுருக்கமான, வலுவான கூறைத் தக்கவைத்து, சிலையின் வெறுமை அல்லது யதார்த்தமின்மையை உணர்த்துகிறது.
- source_word: ἐν κόσμῳ
  choice: உலகத்தில்
  rationale: κόσμος இங்கு உலக யதார்த்தத்தின் வெளிக்கோளத்தைக் குறிக்கிறது; ‘உலகத்தில்’ என்பது இயல்பான நேரடி இணை.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: ஒரே கடவுளைத் தவிர வேறு கடவுள் இல்லை
  rationale: ஒரே கடவுள் என்ற தனித்துவக் கூற்றைத் தெளிவாகக் காட்டுகிறது; εἰ μὴ εἷς என்பதன் விலக்கு அமைப்பையும் தக்கவைக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய விவாதத்திலிருந்து வரும் முடிவுசார் தொடர்பை வெளிப்படையாகக் குறிக்கிறது.
theological_decisions:
- issue: சிலைகளின் நிலையும் ஒரே கடவுள் என்ற கூற்றும்
  choice: சிலையின் வெறுமையையும் கடவுள் ஒருவரே என்ற வலுவான கூற்றையும் உரையில் நேரடியாகத் தக்கவைத்தல்
  alternative: ‘சிலைக்கு உண்மையான இருப்பு இல்லை’ என்று யதார்த்தமின்மையை வெளிப்படையாக விளக்குதல்; அல்லது பொதுப்பொருளில் ‘தெய்வம்’ என மொழிபெயர்த்தல்
  rationale: மூலவசனம் சிலைகளின் வெறுமையையும் ஒரே கடவுளின் தனித்துவத்தையும் ஒன்றாகக் கூறுகிறது. பின்னாளைய கோட்பாட்டு விளக்கங்களைச் சேர்க்காமல் அந்த இறையியல் அழுத்தத்தையும் மொழிசார் இழுவிசையையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோள் போன்ற இரண்டு பகிரப்பட்ட அறிவுக் கூற்றுகளைத் தெளிவுபடுத்த மேற்கோள் குறிகள் இடப்பட்டுள்ளன; மூலத்தின் சுருக்கமும் இறையியல் அழுத்தமும் பாதுகாக்கப்பட்டுள்ளன.
