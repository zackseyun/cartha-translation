id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: ta
  text: ஆகையால், உணவு என் சகோதரனை இடறச் செய்தால், என் சகோதரனை நான் இடறச் செய்யாதபடி, நான் என்றென்றும் இறைச்சி உண்ணவே மாட்டேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: உணவு
  rationale: பொதுவாக உண்ணப்படும் பொருளைக் குறிக்கும் மூலச்சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது; அடுத்துள்ள ‘இறைச்சி’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: இடறச் செய்தால் / இடறச் செய்யாதபடி
  rationale: ஒருவரை பாவத்திற்கோ விசுவாசத் தடுமாற்றத்திற்கோ இட்டுச் செல்லும் உருவகத்தைத் தக்கவைக்கும் இயல்பான வேதாகமத் தமிழ்.
- source_word: κρέα
  choice: இறைச்சி
  rationale: மாமிச உணவைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: οὐ μὴ φάγω
  choice: உண்ணவே மாட்டேன்
  rationale: οὐ μή அமைப்பின் வலுவான மறுப்பை ‘வே மாட்டேன்’ எனத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: சொற்றொடரின் காலவரையற்ற வலிமையை மெலிதாக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: பவுலின் விலக்குறுதியின் கால அளவு
  choice: என்றென்றும்
  alternative: இனி ஒருபோதும்
  rationale: εἰς τὸν αἰῶνα என்பதன் வலுவான, சொல்லாட்சிக்குரிய காலவரையற்ற தன்மையைத் தக்கவைக்கிறது; நடைமுறை வரம்பை மொழிபெயர்ப்பிலேயே நிர்ணயிக்கவில்லை.
- issue: சகோதரனை ‘இடறச் செய்தல்’ என்பதன் பொருள்
  choice: உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: பாவம் செய்யத் தூண்டுதல்
  rationale: σκανδαλίζω என்பதில் உள்ள உருவகத்தையும், அது குறிக்கக்கூடிய விசுவாசத் தடுமாற்றம் அல்லது பாவத்திற்கான தூண்டுதல் ஆகிய பொருள் அகலத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வாக்கிய அமைப்பு. மூலத்தின் காரணவியல் ஒழுங்கும், வலியுறுத்தப்பட்ட மறுப்பும், ‘உணவு’ மற்றும் ‘இறைச்சி’ இடையேயான வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
