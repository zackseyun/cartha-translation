id: 1CO.8.1
reference: 1 Corinthians 8:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: ta
  text: 'விக்கிரகங்களுக்குப் பலியிடப்பட்ட உணவைப் பற்றி[a]: நம் அனைவருக்கும் அறிவு உண்டு என்பதை நாம் அறிந்திருக்கிறோம்.[b] அறிவு வீங்கச் செய்கிறது; ஆனால் அன்பு கட்டியெழுப்புகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விக்கிரகங்களுக்குப் பலியிடப்பட்ட இறைச்சி” அல்லது “விக்கிரகங்களுக்குப் பலியிடப்பட்ட பொருள்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “நம் அனைவருக்கும் அறிவு உண்டு” என்பதில் பவுல் கொரிந்தியரின் ஒரு முழக்கத்தை எதிரொலிக்கச் செய்திருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: பற்றி
  rationale: புதிய பொருளை அறிமுகப்படுத்தும் நிருப மாற்றத்தை இயல்பான நவீனத் தமிழில் தருகிறது; மூலத்தில் இல்லாத காலப் பொருளுடைய ‘இப்போது’ என்பதைச் சேர்க்கவில்லை.
- source_word: τῶν εἰδωλοθύτων
  choice: விக்கிரகங்களுக்குப் பலியிடப்பட்ட உணவு
  rationale: விக்கிரக வழிபாட்டில் பலியிடப்பட்டவற்றை, இச்சூழலில் குறிப்பாக உணவை, குறிக்கிறது. ‘இறைச்சி’ என்று தேவையின்றிக் குறுக்காமல் வழிபாட்டுச் சூழலைத் தெளிவாகப் பேணுகிறது.
- source_word: οἴδαμεν
  choice: நாம் அறிந்திருக்கிறோம்
  rationale: நிகழ்காலப் பொருளில் செயல்படும் கிரேக்க நிறைவு வடிவத்தை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: நம் அனைவருக்கும் அறிவு உண்டு என்பதை
  rationale: πάντες என்பதன் உள்ளடக்கிய ‘அனைவரும்’ என்ற வலிமையையும் γνῶσις என்பதற்கான ‘அறிவு’ என்ற சொல்லிணைப்பையும் பேணுகிறது.
- source_word: ἡ γνῶσις
  choice: அறிவு
  rationale: முந்தைய γνῶσιν என்பதோடு உள்ள சொல் தொடர்பைப் பேணி, பொதுப்படையான கருத்தாக இயல்பான தமிழில் தருகிறது.
- source_word: φυσιοῖ
  choice: இறுமாப்பால் வீங்க வைக்கிறது
  rationale: பவுலின் ‘வீங்குதல்’ உருவகத்தைப் பேணுவதோடு, அது உடல் வீக்கத்தை அல்ல, செருக்கைச் சுட்டுகிறது என்பதை நவீன வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: ἡ δὲ ἀγάπη
  choice: ஆனால் அன்பு
  rationale: அறிவுடன் அமைந்துள்ள முரண்பாட்டை ‘ஆனால்’ தெளிவாக்குகிறது; ἀγάπη என்பதற்கு இயல்பான ‘அன்பு’ பயன்படுத்தப்படுகிறது.
- source_word: οἰκοδομεῖ
  choice: கட்டியெழுப்புகிறது
  rationale: கட்டிடம் எழுப்பும் உருவகத்தைப் பேணியும், மனிதர்களை வளர்த்து வலுப்படுத்தும் பொருளை இயல்பாக உணர்த்தியும் உள்ளது.
theological_decisions:
- issue: πάντες (‘அனைவரும்’) என்பது நிபந்தனையற்ற பொதுக்கூற்றா அல்லது கொரிந்தியரின் கூற்றை பவுல் எடுத்தாளுகிறாரா?
  choice: ‘நம் அனைவருக்கும் அறிவு உண்டு’ என்று எந்தத் தகுதியுரையும் மேற்கோள் குறிகளும் இன்றி முதன்மை உரையில் தரப்பட்டது.
  alternative: இதை கொரிந்தியரின் முழக்கமாகக் காட்ட மேற்கோள் குறிகளை இடுதல்.
  rationale: கிரேக்க உரையில் வெளிப்படையான மேற்கோள் குறியீடோ விலகல் குறியீடோ இல்லை. எனவே சொல்லை அப்படியே பேணி, அதன் சொல்லாட்சிசார் வலிமையைச் சூழலும் அடிக்குறிப்பும் விளங்கச் செய்கின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீங்க வைக்கிறது’ மற்றும் ‘கட்டியெழுப்புகிறது’ என்பவை மூலத்தின் எதிரெதிரான உருவகங்களைப் பேணுகின்றன; ‘இறுமாப்பால்’ என்பது முதல் உருவகத்தின் நோக்கத்தைத் தெளிவாக்குகிறது. அனைத்து அடிக்குறிப்பு குறிகளும் அவை சாரும் சொற்றொடர்களுக்கு உடனடியாக அடுத்து வைக்கப்பட்டுள்ளன.
