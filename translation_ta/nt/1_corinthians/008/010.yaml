reference: 1 Corinthians 8:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: ta
  text: ஏனெனில், அறிவுள்ள நீ விக்கிரகக் கோவிலில் உணவிற்காகச் சாய்ந்திருப்பதை யாராவது கண்டால், பலவீனமான அந்த மனிதனின் மனச்சாட்சி விக்கிரகங்களுக்குப் படைக்கப்பட்ட உணவை உண்பதற்குக் கட்டியெழுப்பப்படாதா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துணிவூட்டப்படாதா?” கிரேக்கத்தில் நேரடியாக “கட்டியெழுப்பப்படாதா?” என்று உள்ளது. பவுல் பொதுவாக ஆவிக்குரிய வளர்ச்சியைக் குறிக்கப் பயன்படுத்தும் சொல்லை இங்கு முரண்நகையுடன் பயன்படுத்தியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் வாதத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: அறிவுள்ளவனாகிய நீ
  rationale: அறிவால் அடையாளப்படுத்தப்படும் முகவரியைச் சுட்டும் கிரேக்கப் பெயரெச்ச அமைப்பையும், தமிழில் இயல்பான நேரடி அழைப்பையும் தக்கவைக்கிறது.
- source_word: γνῶσιν
  choice: அறிவு
  rationale: 1 கொரிந்தியர் 8 முழுவதும் முக்கியமாகத் தொடரும் சொல்லிணைப்பைப் பாதுகாக்கிறது.
- source_word: ἐν εἰδωλείῳ
  choice: விக்கிரகக் கோவிலில்
  rationale: ஒரு விக்கிரக வழிபாட்டுடன் தொடர்புடைய கோவில் அல்லது சன்னிதி என்ற பண்பாட்டு இடத்தைக் குறிக்கிறது.
- source_word: κατακείμενον
  choice: பந்தியில் சாய்ந்திருப்பதை
  rationale: உணவின்போது சாய்ந்து அமரும் அக்கால வழக்கின் தெளிவான உருவகத்தைத் தக்கவைக்கிறது; 'பந்தியில்' என்பது உணவுச் சூழலை இயல்பாக விளக்குகிறது.
- source_word: ἡ συνείδησις αὐτοῦ
  choice: அவனுடைய மனச்சாட்சி
  rationale: பார்க்கிற நபரின் நெறியுணர்வை நேரடியாகக் குறிக்கிறது.
- source_word: ἀσθενοῦς ὄντος
  choice: பலவீனனாக இருக்கும்
  rationale: அந்த நபரின் நிலையைச் சுட்டும் பங்கேற்புச் சொல்லின் நுணுக்கத்தைப் பாதுகாக்கிறது; மனச்சாட்சியே பலவீனமானது என்று மட்டும் சுருக்கவில்லை.
- source_word: οἰκοδομηθήσεται
  choice: கட்டியெழுப்பப்படாதா?
  rationale: பவுல் வழக்கமாக ஆவிக்குரிய வளர்ச்சிக்குப் பயன்படுத்தும் கட்டியெழுப்புதல் மொழியை இங்கு தீங்கான விளைவைக் குறிக்க முரண்நகையுடன் பயன்படுத்துகிறார்; அதனைத் தக்கவைக்கிறது.
- source_word: εἰδωλόθυτα
  choice: விக்கிரகங்களுக்குப் படைக்கப்பட்டவை
  rationale: விக்கிரகங்களுக்குப் பலியாக அல்லது படையலாக அர்ப்பணிக்கப்பட்ட உணவைச் சுட்டுகிறது; சூழலில் உணவு என்பது தெளிவாக இருப்பதால் இயல்பான தமிழில் 'படைக்கப்பட்டவை' போதுமானது.
theological_decisions:
- issue: தீங்கான பின்பற்றுதலின் சூழலில் οἰκοδομηθήσεται என்பதன் பொருள்
  choice: கட்டியெழுப்பப்படாதா?
  alternative: துணிவூட்டப்படாதா? / தூண்டப்படாதா?
  rationale: சூழலுக்கேற்ற இயல்பான பொருள் 'துணிவூட்டப்படுதல்' என்றாலும், மூலத்தில் பவுலின் வழக்கமான 'கட்டியெழுப்புதல்' சொல் திட்டமிட்ட முரண்நகையுடன் உள்ளது. அதிலுள்ள இறையியல் மற்றும் சொல்லாட்சித் தளர்வைத் தீர்த்துவிடாமல் முதன்மை உரையில் பாதுகாத்து, இயல்பான பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை. 'விக்கிரகம்', 'மனச்சாட்சி', 'கட்டியெழுப்புதல்' ஆகியவை சூழலின் வேதாகமச் சொல்லிணைப்பையும் இறையியல் பதற்றத்தையும் காக்கத் தேர்ந்தெடுக்கப்பட்டன. வினா அமைப்பு நேர்மறை விடையை எதிர்பார்க்கும் கிரேக்கச் சொல்லாட்சியைப் பாதுகாக்கிறது.
