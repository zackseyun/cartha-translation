translation:
  language: ta
  text: ஏனெனில், வானத்திலோ பூமியிலோ தெய்வங்கள் எனப்படுபவர்கள்[a] இருக்கிறார்கள் என்றாலும்—உண்மையில் பல தெய்வங்களும் பல ஆண்டவர்களும்[b] இருக்கிறார்களே—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தெய்வங்கள் என்று அழைக்கப்படுபவர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பெயரிடப்படுவதைக் குறிக்கிறது; இச்சூழலில் ‘எனப்படுபவர்கள்’ என்பது அவர்களின் தெய்வீகத் தன்மையைப் பவுல் உறுதிப்படுத்தாமல் விலகி நிற்பதையும் உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘ஆண்டவர்கள்’ என்பது பொதுவாக ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்படும் அதே கிரேக்கச் சொல்லின் பன்மை. இது மக்கள் அந்தப் பட்டத்தால் ஏற்றுக்கொள்ளும் பல்வேறு ஆள்களையோ அதிகாரங்களையோ குறிக்கிறது; 6ஆம் வசனத்தில் கூறப்படும் ஒரே ஆண்டவரைக் குறிக்கவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில்
  rationale: γάρ என்பதன் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; καί தரும் மெல்லிய வலியுறுத்தல் வாக்கியத்தின் concessive அமைப்பில் வெளிப்படுகிறது.
- source_word: εἴπερ
  choice: இருக்கிறார்கள் என்றாலும்
  rationale: வாதத்திற்காக ஏற்றுக்கொள்ளப்படும் concessive நிபந்தனையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: λεγόμενοι θεοὶ
  choice: தெய்வங்கள் எனப்படுபவர்கள்
  rationale: இது அவர்களுக்குக் கொடுக்கப்படும் பெயரைக் குறிக்கிறது; அவர்கள் உண்மையிலேயே தெய்வங்கள் என்று பவுல் உறுதிப்படுத்துவதாகக் காட்டாமல் அவரது விலகலை மென்மையாகப் பேணுகிறது.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: வானத்திலோ பூமியிலோ
  rationale: இரண்டு உலகத் தளங்களையும் இணையாகவும் சுருக்கமாகவும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὥσπερ
  choice: உண்மையில் … இருக்கிறார்களே
  rationale: மக்கள் பலரைத் தெய்வங்களாகவும் ஆண்டவர்களாகவும் ஏற்றுக்கொள்வது கண்கூடான நிலை என்பதை உறுதிப்படுத்தும் கிரேக்கச் சொல்லின் நயத்தைப் பேணுகிறது.
- source_word: θεοὶ πολλοὶ
  choice: தெய்வங்கள் பலரும்
  rationale: பன்மையையும் ஆள்களாக அல்லது சக்திகளாகக் கருதப்படும் தன்மையையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: κύριοι πολλοί
  choice: ஆண்டவர்கள் பலரும்
  rationale: κύριος என்பதற்கான ‘ஆண்டவர்’ என்ற தொடர்ச்சியான சொல்லை பன்மையில் வைத்துப், 6ஆம் வசனத்தின் ஒரே ஆண்டவருடனான திட்டமிட்ட சொல் ஒற்றுமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: புறமதத் தெய்வங்களிலிருந்து பவுல் காட்டும் சொல்லாட்சிசார் விலகல்
  choice: ‘தெய்வங்கள் எனப்படுபவர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘தெய்வங்கள் என்று அழைக்கப்படுபவர்கள்’ அல்லது ‘தெய்வங்கள் என்று சொல்லப்படுபவர்கள்’
  rationale: λεγόμενοι என்பது பெயரிடப்படுவதைக் குறிக்கலாம்; உடனடிச் சூழலில் பவுல் அவர்களின் தெய்வீகத்தை நேரடியாக உறுதிப்படுத்தவில்லை. அதேவேளை, கிரேக்கத்தைவிட அதிகமான இகழ்ச்சி நயத்தைத் திணிக்காமல் சந்தேகத் தொனியைப் பேணுகிறது.
- issue: பல κύριοι என்பவர்களுக்கும் 6ஆம் வசனத்தின் ஒரே ஆண்டவருக்கும் இடையிலான மாறுபாடு
  choice: ‘ஆண்டவர்கள்’ என்று அதே அடிச்சொல்லைப் பயன்படுத்துதல்
  alternative: ‘எஜமான்கள்’ அல்லது ‘அதிகாரிகள்’
  rationale: கிரேக்க மூலத்தின் சொல் ஒற்றுமையையும் அடுத்த வசனத்தின் இறையியல் மாறுபாட்டையும் பேணுகிறது; இவர்கள் ஒரே உண்மையான ஆண்டவருக்கு இணையானவர்கள் என்று தீர்மானிப்பதில்லை.
- issue: ‘தெய்வங்கள் பலரும் ஆண்டவர்கள் பலரும் இருக்கிறார்கள்’ என்ற கூற்றின் பொருள்
  choice: மூலத்தில் உள்ள வலுவான வெளிப்பாட்டை அப்படியே பேணுதல்
  alternative: ‘தெய்வங்கள் என்றும் ஆண்டவர்கள் என்றும் கருதப்படுபவர்கள் பலர் உள்ளனர்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: ὥσπερ εἰσὶν என்ற சொல்லாட்சி உண்மையான இருப்பைப் பற்றிய கேள்வியில் ஒரு பதற்றத்தை உருவாக்குகிறது. அதை மக்கள் அங்கீகாரம் மட்டுமே என உரைக்குள் தீர்த்துவிடாமல், முந்தைய ‘எனப்படுபவர்கள்’ என்ற சூழலும் அடிக்குறிப்பும் வாசிப்பை வழிநடத்த அனுமதிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கு விளங்கும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கர்த்தர்கள்’ என்ற வழிபாட்டு மொழி பன்மையைத் தவிர்த்து, 6ஆம் வசனத்துடனான சொல் தொடர்பைப் பேண ‘ஆண்டவர்கள்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் முடிவுறாத தொடர்வாக்கிய அமைப்பைக் காட்ட இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது.
