  text: நான் நட்டேன்; அப்பொல்லோ தண்ணீர் ஊற்றினார்; ஆனால் கடவுளே வளரச் செய்துகொண்டிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
