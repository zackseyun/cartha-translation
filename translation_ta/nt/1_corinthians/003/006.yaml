    text: 'அல்லது: “கடவுள் வளர்ச்சியைக் கொடுத்தார்” / “கடவுள் வளரச் செய்தார்.”'
    reason: ηὔξανεν என்பதற்கான இயல்பான மாற்று மொழிபெயர்ப்புகள்; ஒன்று ‘வளர்ச்சியை அளித்தல்’ என்ற சொல்லாக்கத்தையும், மற்றொன்று காரணவினைப் பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἐγὼ
  choice: நான்
  rationale: வெளிப்படையாக வரும் முதலாம் நபர் சுட்டுப்பெயரை இயல்பான தமிழில் வைத்திருந்து, பவுலின் பங்கைக் குறிக்கும் எதிர்மறை ஒப்புமையைத் தெளிவாக்குகிறது.
- source_word: ἐφύτευσα
  choice: நட்டேன்
  rationale: φυτεύω என்பதன் அடிப்படைப் பொருளான ‘நடுதல்’ என்பதைக் கொண்டு, தண்ணீர் ஊற்றுதல் மற்றும் வளருதல் ஆகியவற்றோடு தொடரும் வேளாண்மை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: Ἀπολλῶς
  choice: அப்பொல்லோ
  rationale: தனிப்பெயர் நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பு முறையில் தரப்பட்டுள்ளது.
- source_word: ἐπότισεν
  choice: தண்ணீர் ஊற்றினார்
  rationale: வேளாண்மைச் சூழலில் ποτίζω என்பதன் பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: மனித ஊழியர்களின் பணிக்கும் கடவுளின் தீர்மானமான செயலுக்கும் இடையிலான வலுவான வேறுபாட்டைக் காட்டுகிறது.
- source_word: ὁ θεὸς
  choice: கடவுளே
  rationale: ‘-ஏ’ என்னும் வலியுறுத்தல், நடுதல் மற்றும் தண்ணீர் ஊற்றுதல் மனிதர்களின் பணிகளாக இருந்தாலும் வளரச் செய்பவர் கடவுள் என்ற கிரேக்க வாக்கியத்தின் மைய எதிர்மறை ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ηὔξανεν
  choice: அதை வளரச் செய்துவந்தார்
  rationale: αὐξάνω என்பதன் காரணவினைப் பொருளையும், இறந்தகாலத்தில் தொடர்ந்த செயலைச் சுட்டும் imperfect வடிவத்தின் நுணுக்கத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது. ‘அதை’ என்பது கிரேக்கத்தில் மறைமுகமாக உள்ள, நடப்பட்டதைக் குறிக்கும் செயப்படுபொருளைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: மனித ஊழியத்திற்கும் கடவுளின் செயலாற்றலுக்கும் உள்ள உறவு
  choice: பவுலும் அப்பொல்லோவும் உண்மையான பணிகளைச் செய்தார்கள்; ஆனால் வளர்ச்சியை உண்டாக்கிய தீர்மானமான செயலாற்றல் கடவுளுக்குரியது என்பதை வாக்கியம் வலியுறுத்துகிறது.
  alternative: “கடவுள் வளர்ச்சியைக் கொடுத்தார்”
  rationale: இது கோட்பாட்டு விரிவாக்கமல்ல; ἀλλὰ மற்றும் ὁ θεὸς ηὔξανεν ஆகியவற்றின் நேரடியான வலிமையைப் பாதுகாக்கிறது. மனித உழைப்பின் உண்மைத்தன்மையையும் கடவுளின் தீர்மானமான செயலையும் ஒன்றை ஒன்று நீக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வேளாண்மை உருவகம் முழுவதும் பாதுகாக்கப்பட்டுள்ளது; ‘செய்துவந்தார்’ என்பது தொடர்ந்த இறந்தகாலச் செயலைக் காட்டுகிறது.
