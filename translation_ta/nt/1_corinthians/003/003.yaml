id: 1CO.3.3
reference: 1 Corinthians 3:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: ta
  text: ஏனெனில், நீங்கள் இன்னும் மாம்சத்துக்குரியவர்களாகவே இருக்கிறீர்கள். உங்களிடையே பொறாமையும் சச்சரவும் இருக்கும்போது, நீங்கள் மாம்சத்துக்குரியவர்களாக இருந்து, மனித வழியின்படி[a] நடக்கிறீர்கள் அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெறும் மனிதர்களைப் போல.”
    reason: κατὰ ἄνθρωπον என்ற சொற்றொடரின் இயல்பான சூழ்நிலைப் பொருளை வழங்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἔτι
  choice: இன்னும்
  rationale: தொடர்ந்து நீடிக்கும் நிலையைக் குறிக்கிறது; பவுலின் கண்டிப்பை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றை விளக்கும் தொடர்பைத் தெளிவாகக் காட்டுகிறது. இரண்டாவது γὰρ தமிழின் வாக்கிய அமைப்பில் தனியே மீண்டும் மொழிபெயர்க்கப்படாமல், காரணத்தை விளக்கும் துணைவாக்கியத்தால் வெளிப்படுகிறது.
- source_word: σαρκικοί
  choice: மாம்சத்துக்குரியவர்கள்
  rationale: σάρξ என்ற சொல்லுடனான உருவகத் தொடர்பைக் காக்கிறது; ‘உலகத்துக்குரியவர்கள்’ அல்லது ‘பாவ இயல்பால் கட்டுப்படுகிறவர்கள்’ போன்ற விளக்கவுரைகளை மூலத்தில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ὅπου
  choice: இருக்கும்போது
  rationale: தமிழில் இடப்பொருளைச் சொற்சொல்லாக வழங்குவதைவிட, பொறாமையும் சச்சரவும் அவர்களிடையே நிலவுவது அவர்களின் நிலையை வெளிப்படுத்துகிறது என்ற சூழ்நிலைப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ζῆλος
  choice: பொறாமை
  rationale: ἔρις உடன் வரும் எதிர்மறைச் சூழலில், நேர்மறையான ‘ஆர்வம்’ என்பதல்லாமல் உறவுகளைச் சிதைக்கும் பொறாமையைக் குறிக்கிறது.
- source_word: ἔρις
  choice: சச்சரம்
  rationale: வாக்குவாதத்தை மட்டும் அல்லாமல் பரந்த முரண்பாட்டையும் பிளவையும் குறிக்கும் கண்ணியமான, புரியக்கூடிய தமிழ்ச் சொல்.
- source_word: οὐχὶ
  choice: அல்லவா
  rationale: உறுதியான ‘ஆம்’ என்ற பதிலை எதிர்பார்க்கும் கிரேக்க வினாவை இயல்பான தமிழ் சொல்லாட்சியில் காக்கிறது.
- source_word: κατὰ ἄνθρωπον
  choice: மனித வழியின்படி
  rationale: கிரேக்கத்தின் ஒருமை வடிவையும், ஆவியால் வடிவமைக்கப்படாத மனித நடத்தையுடனான எதிர்மறை ஒப்பீட்டையும் மிகைப்படுத்தாமல் காக்கிறது; இன்னொரு இயல்பான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: περιπατεῖτε
  choice: நடக்கிறீர்கள்
  rationale: நடத்தை அல்லது வாழ்வுமுறையைக் குறிக்கும் பவுலின் ‘நடத்தல்’ உருவகத்தைத் தமிழிலும் புரியக்கூடிய வகையில் தக்கவைக்கிறது.
theological_decisions:
- issue: σαρκικοί என்பதில் σάρξ சார்ந்த மொழியை மொழிபெயர்த்தல்
  choice: மாம்சத்துக்குரியவர்கள்
  alternative: உலகத்துக்குரியவர்கள்; பாவ இயல்புக்குட்பட்டவர்கள்
  rationale: விசுவாசிகளின் நடத்தையைப் பவுல் கண்டித்தாலும், இச்சொல்லை ஒரு முழுமையான கோட்பாட்டு விளக்கமாக விரிவாக்காமல் ‘மாம்சம்’ என்ற மூல உருவகத்துடன் இணைத்தே வழங்குகிறது.
- issue: κατὰ ἄνθρωπον என்பதன் நெறிசார் நுணுக்கம்
  choice: மனித வழியின்படி
  alternative: வெறும் மனிதர்களைப் போல
  rationale: மூலத்தின் சுருக்கத்தையும் தெளிவின்மையின் ஓரளவையும் காக்கும் முதன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது; ‘வெறும் மனித முறையில்’ என்ற சூழ்நிலைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், திருச்சபை வாசிப்புக்கு ஏற்ற கண்ணியமான நடையும் பொதுவாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. ‘மாம்சத்துக்குரியவர்கள்’ மற்றும் ‘நடக்கிறீர்கள்’ என்பவை பவுலின் முக்கிய உருவகங்களைத் திட்டமிட்டு காக்கின்றன.
