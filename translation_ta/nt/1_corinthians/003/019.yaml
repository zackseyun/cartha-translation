id: 1CO.3.19
reference: 1 Corinthians 3:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: ta
  text: ஏனெனில், இந்த உலகத்தின் ஞானம் தேவனுடைய பார்வையில்[a] மூடத்தனமாக இருக்கிறது. ஏனெனில், “ஞானிகளை அவர்களுடைய சூழ்ச்சியிலேயே[b] அவர் பிடிக்கிறார்” என்று எழுதப்பட்டிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனிடத்தில்.” அதாவது, தேவனுடைய பார்வையில் அல்லது மதிப்பீட்டில்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தந்திரத்திலேயே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: ஞானம்
  rationale: பவுலின் வாதத்தில் உலகம் ஞானம் என்று உரிமைகோரும் ஒன்றைக் குறிக்கும் வழக்கமான, இயல்பான மொழிபெயர்ப்பு.
- source_word: κόσμου τούτου
  choice: இந்த உலகத்தின்
  rationale: κόσμος இங்கு தற்போதைய உலக ஒழுங்கைக் குறிக்கிறது; ‘இந்த உலகத்தின்’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: μωρία
  choice: மூடத்தனம்
  rationale: தேவனுடைய மதிப்பீட்டில் உலக ஞானத்தின் பயனற்ற, அறிவற்ற தன்மையைத் தெளிவாகத் தெரிவிக்கிறது; தேவையற்ற பழமையான நடையைத் தவிர்க்கிறது.
- source_word: παρὰ τῷ θεῷ
  choice: தேவனிடத்தில்
  rationale: παρά + இறந்தவேற்றுமையின் மதிப்பீட்டு நோக்கைத் தக்கவைத்து, தமிழில் சுருக்கமாகவும் வேதாகமச் சூழலுக்கு ஏற்றவாறும் ஒலிக்கிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் நிறைவுற்ற செயப்பாட்டு வடிவத்தின் தொடரும் செல்லுபடியைத் தக்கவைக்கிறது.
- source_word: δρασσόμενος
  choice: அவர் பிடிக்கிறார்
  rationale: ஒருவரைப் பற்றிப் பிடித்தல் அல்லது சிக்கவைத்தல் என்ற படிமத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; குறிப்பிட்ட வினைமுற்றில்லாத கிரேக்கப் பெயரெச்சத்தை வாசிப்புத் தெளிவுக்காக வாக்கியமாக்குகிறது.
- source_word: σοφοὺς
  choice: ஞானிகளை
  rationale: பாலினத்தைத் தேவையின்றிக் குறிப்பிடாமல், ஞானிகளாகக் கருதப்படுபவர்களைக் குறிக்கிறது.
- source_word: πανουργίᾳ
  choice: சூழ்ச்சியிலேயே
  rationale: ஒழுக்கரீதியாக எதிர்மறையான, வஞ்சகமான புத்திசாலித்தனத்தைக் குறிக்கிறது; ‘-இலேயே’ என்பது அவர்களது சொந்த சூழ்ச்சியே அவர்கள் பிடிபடும் களமாக இருப்பதை வலியுறுத்துகிறது.
theological_decisions:
- issue: யோபு 5:13 மேற்கோளில் செயல்படுபவர் யார் என்பதைத் தமிழில் வெளிப்படுத்துதல்
  choice: “...அவர் பிடிக்கிறார்” என்று தேவனைச் சுட்டும் எழுவாயை வெளிப்படையாகக் கூறுதல்
  alternative: “ஞானிகளை அவர்களுடைய சூழ்ச்சியிலேயே பிடிக்கிறவர்”
  rationale: கிரேக்கத்தில் உள்ள வரையறைச் சுட்டுடன் கூடிய பெயரெச்சம் தேவனைச் சுட்டுகிறது. ‘அவர்’ என்று கூறுவது புதிய இறையியல் கருத்தைச் சேர்க்காமல், தமிழில் மேற்கோளை முழுமையான இயல்பான வாக்கியமாக்குகிறது.
- issue: உலக ஞானத்தைப் பற்றிய தேவனுடைய மதிப்பீடு
  choice: “தேவனிடத்தில் மூடத்தனமாக இருக்கிறது”
  alternative: “தேவனுடைய பார்வையில் மூடத்தனமாக இருக்கிறது”
  rationale: மூலத்தின் παρὰ τῷ θεῷ என்ற சுருக்கமான அமைப்பைத் தக்கவைத்தபடியே, இது தேவனுடைய பார்வை அல்லது தீர்ப்பைக் குறிக்கிறது என்ற அர்த்தத்தைத் திறந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மூடத்தனம்’, ‘சூழ்ச்சி’ ஆகிய சொற்கள் பவுலின் கூர்மையான எதிர்மறை மதிப்பீட்டை மென்மையாக்காமல் தெரிவிக்கின்றன; வாக்கிய அமைப்பு இன்றைய சாதாரண வாசகருக்கு இயல்பாக வைக்கப்பட்டுள்ளது.
