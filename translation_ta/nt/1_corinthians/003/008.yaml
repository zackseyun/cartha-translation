source:
  edition: SBLGNT
  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: ta
  text: நடுபவரும் நீர்ப்பாய்ச்சுபவரும் ஒன்றாயிருக்கிறார்கள்[a]. மேலும், ஒவ்வொருவரும் தமது உழைப்புக்கு ஏற்ப தமக்குரிய வெகுமதியைப் பெறுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒன்றுபட்டிருக்கிறார்கள்”; அல்லது, “ஒரே நோக்கம் கொண்டிருக்கிறார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: நடுகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்கால வினையெச்சத்தையும் வேளாண்மை உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ποτίζων
  choice: நீர் பாய்ச்சுகிறவர்
  rationale: பயிருக்கு நீர் அளிக்கும் வேளாண்மைச் செயலைத் தெளிவாகக் காட்டுகிறது; φυτεύων என்பதுடன் இணையான அமைப்பையும் காக்கிறது.
- source_word: ἕν
  choice: ஒன்றாயிருக்கிறார்கள்
  rationale: இருவரும் ஒரே நபர் என்று கூறாமல், அவர்களிடையிலான ஒற்றுமையை கிரேக்கத்தின் சுருக்கமான வடிவுக்கு நெருக்கமாக வெளிப்படுத்துகிறது; பொருள் சார்ந்த மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: ஒவ்வொரு பணியாளரும் தனித்தனியாகப் பெறுவார் என்ற தனிநபர் அழுத்தத்தைத் தெளிவாகக் காக்கிறது.
- source_word: ἴδιον μισθὸν
  choice: தமக்குரிய வெகுமதி
  rationale: ἴδιον என்பதன் தனிப்பட்ட உரிமை வலியுறுத்தலைக் காத்து, μισθός என்பதை இச்சூழலில் வெறும் பணக்கூலியாகக் குறுக்காமல் பிரதிபலிக்கிறது.
- source_word: λήμψεται
  choice: பெறுவார்கள்
  rationale: கிரேக்க எதிர்கால வினையின் பொருளை இயல்பான தமிழ் எதிர்கால வடிவில் வழங்குகிறது.
- source_word: κατὰ τὸν ἴδιον κόπον
  choice: தத்தமது உழைப்புக்கு ஏற்றபடி
  rationale: ஒவ்வொருவரின் சொந்த முயற்சியோடு வெகுமதி தொடர்புபடுத்தப்படுவதை வெளிப்படுத்துகிறது; κόπος என்பதிலுள்ள கடின முயற்சியின் நிழற்பொருளையும் ‘உழைப்பு’ காக்கிறது.
theological_decisions:
- issue: ἕν εἰσιν (‘ஒன்றாயிருக்கிறார்கள்’) என்பதன் பொருள்
  choice: நடுகிறவரும் நீர் பாய்ச்சுகிறவரும் வேறுபட்ட பணிகளைச் செய்தாலும் ஒன்றுபட்டவர்களாக இருக்கிறார்கள்
  alternative: அவர்கள் ஒரே நோக்கம் கொண்டவர்கள்; அல்லது ஒரே பணியில் இணைந்தவர்கள்
  rationale: நடுநிலை ஒருமையான ἕν, இருவரையும் ஒரே நபராக அடையாளப்படுத்துவதற்குப் பதிலாக அவர்களின் ஒற்றுமையைச் சுட்டுகிறது. சூழல் அவர்களின் வேறுபட்ட பணிகளையும் ஒவ்வொருவருக்குமான தனிப்பட்ட வெகுமதியையும் தொடர்ந்து காக்கிறது; ஆகவே ஒற்றுமையின் துல்லிய இயல்பை முதன்மை உரை தேவையின்றி வரையறுக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘ஒன்றாயிருக்கிறார்கள்’ மூலத்தின் சுருக்கத்தையும் உண்மையான பொருள் அகலத்தையும் காக்கிறது. ‘தத்தமது’ என்பது மீண்டும் வரும் ἴδιον மற்றும் தனித்தனி கைம்மாறு என்ற வலியுறுத்தலைச் சுருக்கமாக வெளிப்படுத்துகிறது.
