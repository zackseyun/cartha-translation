id: 1CO.3.4
reference: 1 Corinthians 3:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: ta
  text: ஏனெனில், ஒருவன், “நான் பவுலைச் சேர்ந்தவன்” என்றும், மற்றொருவன், “நான் அப்பொல்லோவைச் சேர்ந்தவன்” என்றும் சொல்லும்போதெல்லாம், நீங்கள் வெறும் மனிதர்கள்தானே?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் மனிதர்கள்தானே?”; சூழலின் பொருள்படி, “நீங்கள் மனிதர்களைப் போலத்தானே நடந்துகொள்கிறீர்கள்?”
    reason: ‘வெறும்’ மற்றும் ‘நடந்துகொள்கிறீர்கள்’ என்பவை கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும், கேள்வியின் கண்டனத் தொனியை விளக்கும் சாத்தியமான மொழிபெயர்ப்புகள்.
lexical_decisions:
- source_word: ὅταν
  choice: சொல்லும்போதெல்லாம்
  rationale: ஒரே ஒரு நிகழ்வைக் குறிக்காமல், எப்போதெல்லாம் இவ்வாறு சொல்லப்படுகிறதோ அப்போதெல்லாம் என்ற பொதுவான அல்லது திரும்பத் திரும்ப நிகழும் சூழலைக் காட்டுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கண்டனத்திற்கான விளக்கத்தைப் பவுல் இங்கு தருகிறார் என்பதை வெளிப்படுத்துகிறது.
- source_word: λέγῃ τις
  choice: ஒருவன் … சொல்லும்போதெல்லாம்
  rationale: திட்டவட்டமாக அடையாளம் காட்டப்படாத எந்த ஒருவரையும் குறிக்கும் ஒருமை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: நான் பவுலைச் சேர்ந்தவன்
  rationale: Παύλου என்ற உடைமை வேற்றுமை இங்கு பவுலின் அணியைச் சார்ந்திருப்பதாகக் கூறும் கட்சிப்பற்றைக் குறிக்கிறது; தமிழில் இயல்பாகவும் உறவை மிகையாக வரையறுக்காமலும் உள்ளது.
- source_word: ἕτερος δέ
  choice: மற்றொருவன் … என்றும்
  rationale: μέν … δέ அமைப்பிலுள்ள இணையான வேறுபாட்டைத் தமிழின் ‘என்றும் … என்றும்’ கட்டமைப்பு தெளிவாகக் காட்டுகிறது.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: நான் அப்பொல்லோவைச் சேர்ந்தவன்
  rationale: முந்தைய கூற்றிலிருந்து விடுபட்டுள்ள வினைச்சொல்லைத் தமிழில் நிரப்பி, இரு கட்சிப்பற்றுக் கூற்றுகளையும் இணையாக வைத்திருக்கிறது.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: நீங்கள் வெறும் மனிதர்கள்தானே?
  rationale: சொல்லளவில் ‘நீங்கள் மனிதர்கள்தானே?’ என்ற கேள்வியைத் தக்கவைத்தபடியே, சூழலில் உள்ள கண்டனத் தொனியை ‘வெறும்’ வெளிப்படுத்துகிறது; நடத்தை குறித்த விளக்கமான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பவுலையும் அப்பொல்லோவையும் சார்ந்திருப்பதாகக் கூறும் மொழியின் தன்மை
  choice: ‘சேர்ந்தவன்’ என்று கட்சிப்பற்றைக் காட்டுதல்
  alternative: ‘சீடன்’ அல்லது ‘பின்பற்றுகிறவன்’ என்று குறிப்பாக்குதல்
  rationale: மூலமொழியின் உடைமை வேற்றுமை உறவின் துல்லிய இயல்பை முழுமையாக வரையறுக்கவில்லை. ஆகவே குறிப்பிட்ட சீடத்துவக் கருத்தைச் சேர்க்காமல், பிரிவினை சார்பை மட்டும் தெரிவிக்கிறது.
- issue: ἄνθρωποι என்பதன் கண்டனப் பொருள்
  choice: முதன்மை உரையில் ‘வெறும் மனிதர்கள்’
  alternative: ‘மனிதர்களைப் போல நடந்துகொள்கிறீர்கள்’
  rationale: மூலத்தில் நடப்பதைக் குறிக்கும் தனி வினைச்சொல் இல்லை. எனவே முதன்மை உரை பெயர்ச்சொல் அமைப்பைத் தக்கவைக்கிறது; சூழலால் பெறப்படும் நடத்தை சார்ந்த விளக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், உரையாடலுக்குரிய மேற்கோள்களையும் பவுலின் கண்டனத் தொனியையும் தெளிவாக வைத்துள்ளோம். ‘பவுலைச் சேர்ந்தவன்’, ‘அப்பொல்லோவைச் சேர்ந்தவன்’ ஆகியவை இயல்பான தமிழில் கட்சிச் சார்பை உணர்த்துகின்றன; சமயப்பிரிவு சார்ந்த தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
