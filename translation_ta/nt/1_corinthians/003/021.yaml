id: 1CO.3.21
reference: 1 Corinthians 3:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε μηδεὶς καυχάσθω ἐν ἀνθρώποις· πάντα γὰρ ὑμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/021.yaml
  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: ta
  text: ஆகவே, யாரும் மனிதர்களைக் குறித்து பெருமைப்பட்டுக்கொள்ள வேண்டாம்[a]; ஏனெனில், எல்லாம் உங்களுடையவையே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலைக் கருத்தில் கொண்டால், ‘மனிதத் தலைவர்களைக் குறித்து’ என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து பெறப்படும் முடிவைக் குறிக்கும் இயல்பான, தெளிவான இணைப்புச் சொல்.
- source_word: μηδεὶς
  choice: யாரும் … வேண்டாம்
  rationale: அனைவருக்கும் பொதுவான தடையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καυχάσθω
  choice: பெருமைப்பட்டுக்கொள்ள வேண்டாம்
  rationale: வினைச்சொல்லின் பெருமைபாராட்டுதல் அல்லது மேன்மை கொண்டாடுதல் என்ற கருத்தை, கூடுதல் விளக்கம் புகுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἐν ἀνθρώποις
  choice: மனிதர்களைக் குறித்து
  rationale: ἐν என்பது இங்கு பெருமைப்பட்டுக்கொள்வதற்கான அடிப்படை அல்லது தொடர்பைக் குறிக்கலாம். ἀνθρώποις ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; சூழலில் மனிதத் தலைவர்களைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: πάντα
  choice: எல்லாம்
  rationale: நடுநிலைப் பன்மையின் விரிவான, அனைத்தையும் உள்ளடக்கும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய தடைக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὑμῶν ἐστιν
  choice: உங்களுடையவையே
  rationale: உடைமைப் பொருளை நேரடியாக வெளிப்படுத்துகிறது; ‘-வே’ என்பது பவுலின் வலியுறுத்தலை இயல்பான தமிழில் பிரதிபலிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தர்க்கத் தொடர்பும், பெருமைப்பட்டுக்கொள்வதற்கான மனித அடிப்படை குறித்த எச்சரிக்கையும் பாதுகாக்கப்பட்டுள்ளன.
