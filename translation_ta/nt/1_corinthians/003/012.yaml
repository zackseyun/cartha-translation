id: 1CO.3.12
reference: 1 Corinthians 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δέ τις ἐποικοδομεῖ ἐπὶ τὸν ⸀θεμέλιον ⸂χρυσόν, ἄργυρον⸃, λίθους τιμίους, ξύλα, χόρτον, καλάμην,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: ta
  text: யாராவது அந்த அஸ்திவாரத்தின் மேல் தங்கம், வெள்ளி, விலையுயர்ந்த கற்கள், மரம், காய்ந்த புல், வைக்கோல் ஆகியவற்றைக் கொண்டு கட்டினால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: ஒருவன் … கட்டினால்
  rationale: εἰ நிபந்தனையை வினைமுற்றின் ‘-ஆல்’ வடிவில் இயல்பாக வெளிப்படுத்துகிறது; τις பொதுவான, குறிப்பில்லாத ஒருவரைக் குறிக்க ‘ஒருவன்’ என மொழிபெயர்க்கப்பட்டது. δέ இங்கு மென்மையான கருத்துத் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் தனிச் சொல் சேர்க்காமல் வாக்கியத் தொடரால் அது இயல்பாக உணரப்படுகிறது.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: அந்த அஸ்திவாரத்தின்மேல் … கட்டினால்
  rationale: ἐποικοδομεῖ என்பது ஏற்கெனவே இடப்பட்ட ஒன்றின்மேல் கட்டுவதைக் குறிக்கிறது. முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அடித்தளத்தைத் தொடர்வதால் தமிழ் இயல்புக்காக ‘அந்த’ சேர்க்கப்பட்டது; ‘அஸ்திவாரம்’ கட்டுமான உருவகத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: χρυσόν, ἄργυρον
  choice: தங்கம், வெள்ளி
  rationale: இரு கட்டுமானப் பொருட்களுக்கும் நேரான, பொதுவழக்கிலுள்ள தமிழ் இணைகள்.
- source_word: λίθους τιμίους
  choice: விலையுயர்ந்த கற்கள்
  rationale: τιμίους என்பதன் மதிப்புமிக்க அல்லது செலவுயர்ந்த தன்மையை வெளிப்படுத்துகிறது; ‘ரத்தினங்கள்’ என்று குறுக்கி பொருளைத் தீர்மானிக்காமல், கட்டுமானத்திற்கான மதிப்புமிக்க கற்களையும் உள்ளடக்கும் வகையில் ambiguity பாதுகாக்கப்படுகிறது.
- source_word: ξύλα
  choice: மரம்
  rationale: பொருட்களின் பட்டியலில் கட்டுமானப் பொருளைக் குறிக்கும் இயல்பான ஒருமைத் தொகுப்புப்பெயர்.
- source_word: χόρτον
  choice: வைக்கோல்
  rationale: χόρτος அடிப்படையில் புல் அல்லது உலர்ந்த புல்லைக் குறிக்கலாம்; இக்கட்டுமானப் பொருட்களின் முரண்பட்ட பட்டியலில் ‘வைக்கோல்’ இயல்பாகப் பொருந்துகிறது.
- source_word: καλάμην
  choice: உலர்ந்த தாள்
  rationale: καλάμη இங்கு அறுவடைக்குப் பின் எஞ்சும் உலர்ந்த தண்டு அல்லது தாளைக் குறிக்கிறது. χόρτον என்பதற்கான ‘வைக்கோல்’ என்பதிலிருந்து வேறுபாட்டைக் காக்க ‘உலர்ந்த தாள்’ தேர்ந்தெடுக்கப்பட்டது.
