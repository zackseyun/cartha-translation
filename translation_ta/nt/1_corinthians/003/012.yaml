translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. உருவகத்தின் பொருட்களுக்கு மறைபொருள் விளக்கம் உரைக்குள் சேர்க்கப்படவில்லை.
