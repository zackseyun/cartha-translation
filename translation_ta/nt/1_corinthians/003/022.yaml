id: 1CO.3.22
reference: 1 Corinthians 3:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: ta
  text: பவுலோ, அப்பொல்லோவோ, கேபாவோ, உலகமோ, வாழ்வோ, சாவோ, இப்போது உள்ளவையோ, இனி வரவிருப்பவையோ—அனைத்தும் உங்களுடையவையே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: …ஓ, …ஓ
  rationale: தொடர்ந்து வரும் மாற்றுகளைத் தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் பட்டியலிட இணைப்புச் சாரியைப் பயன்படுத்துகிறது; மூலத்தின் மீளுருவாக்க அமைப்பையும் காக்கிறது.
- source_word: Παῦλος
  choice: பவுல்
  rationale: தமிழில் வழக்கில் உள்ள பெயரொலிபெயர்ப்பு; வாக்கியத்தில் ‘பவுலோ’ என இணைப்புச் சாரியுடன் வருகிறது.
- source_word: Ἀπολλῶς
  choice: அப்பொல்லோ
  rationale: கிரேக்கப் பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது; வாக்கியத்தில் ‘அப்பொல்லோவோ’ என வருகிறது.
- source_word: Κηφᾶς
  choice: கேபா
  rationale: மூலத்தில் உள்ள செமித்திய வடிவப் பெயரையே காக்கிறது; அதற்குச் சமமான ‘பேதுரு’ என்று மாற்றவில்லை.
- source_word: κόσμος
  choice: உலகம்
  rationale: இங்கு படைக்கப்பட்ட உலகையும் உலக ஒழுங்கையும் உள்ளடக்கக்கூடிய இயல்பான, பரந்த தமிழ்ச் சொல்.
- source_word: ζωή
  choice: வாழ்வு
  rationale: பட்டியலின் பெயர்ச்சொல் அமைப்புக்கு ஏற்ற நேரடியான மொழிபெயர்ப்பு.
- source_word: θάνατος
  choice: சாவு
  rationale: ‘வாழ்வு’ என்பதற்கு இணையாக, சாதாரண வாசகருக்கு உடனடியாகப் புரியும் இயல்பான பெயர்ச்சொல்.
- source_word: ἐνεστῶτα
  choice: இப்போது உள்ளவை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினையின் நிகழ்கால உண்மைகள் என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: μέλλοντα
  choice: இனி வரவிருப்பவை
  rationale: எதிர்காலத்தில் வரவுள்ள உண்மைகள் அல்லது காரியங்கள் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: πάντα
  choice: அனைத்தும்
  rationale: மனிதர்களும் மற்ற உண்மைகளும் சேர்ந்த முழுப் பட்டியலையும் ஒருங்கிணைக்கும் மூலத்தின் முழுமைப்படுத்தும் வலிமையைப் பாதுகாக்கிறது.
- source_word: ὑμῶν
  choice: உங்களுடையவையே
  rationale: உடைமைப் பொருளை நேரடியாக வெளிப்படுத்துவதோடு, இறுதி முடிவுரையின் வலியுறுத்தலையும் ‘ஏ’ மூலம் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: பட்டியலில் உள்ள அனைத்தும் கொரிந்தியர்களுக்கு உரியவை என்பதன் துல்லியமான உறவு
  choice: ‘உங்களுடையவையே’ என்ற உடைமை மொழியை அப்படியே காத்தல்
  alternative: ‘உங்கள் நன்மைக்காக உள்ளன’ என்று விளக்குதல்
  rationale: மூலம் ὑμῶν என்ற உடைமை வடிவை மட்டுமே தருகிறது. அது எவ்வாறு அல்லது எந்த வரம்பில் அவர்களுக்குரியது என்பதை இந்த வசனத்திற்குள் விளக்கிச் சுருக்காமல், அதன் இறையியல் அழுத்தத்தையும் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையில் சுருக்கமான பட்டியல் நடையும் இறுதியில் வலியுறுத்தப்பட்ட முடிவுரையும் பயன்படுத்தப்பட்டுள்ளன. ‘கேபா’ என்பது மூலப் பெயரைப் பாதுகாக்கிறது; ‘சாவு’ என்பது ‘மரணம்’ என்பதைக் காட்டிலும் இப்பட்டியலில் ‘வாழ்வு’ என்பதுடன் இயல்பாக இணைகிறது.
