  naturalness: ‘…ஓ’ எனத் தொடரும் பட்டியல் நவீன நிலையான தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது. ‘வாழ்வோ, சாவோ’ என்பது புரிந்துகொள்ள எளிய இணைச்சொல் அமைப்பு; இவ்வசனத்தின் சுருக்கமான பட்டியல் நடைக்கு ஏற்றது. ‘இப்போது உள்ளவையோ, இனி வரவிருப்பவையோ’ நிகழ்காலம்/எதிர்காலம் என்ற மூல வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
