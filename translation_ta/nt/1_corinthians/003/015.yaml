id: 1CO.3.15
reference: 1 Corinthians 3:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: ta
  text: ஒருவருடைய பணி எரிந்து அழிந்துபோனால், அவர் இழப்பைச் சந்திப்பார்; ஆனால் அவரே இரட்சிக்கப்படுவார்—ஆயினும் நெருப்பின் வழியாகக் கடப்பதுபோலவே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால் நெருப்பின் வழியாக மட்டுமே”; அல்லது, “நெருப்பின் வழியாகத் தப்புபவரைப் போல.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: ஒருவனுடைய ... -னால்
  rationale: நிபந்தனையையும் குறிப்பிடப்படாத எந்த நபரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ ἔργον
  choice: வேலை
  rationale: சூழலிலுள்ள கட்டுமான உருவகத்துடன் தொடர்பைத் தக்கவைத்து, ஊழியத்தின் விளைவையும் உள்ளடக்கக்கூடிய பொதுவான சொல்லாக உள்ளது.
- source_word: κατακαήσεται
  choice: எரிந்து அழிந்துபோனால்
  rationale: முற்றிலும் எரிந்து நாசமாதல் என்ற வினையின் தீவிரத்தைக் காட்டுகிறது.
- source_word: ζημιωθήσεται
  choice: இழப்பைச் சந்திப்பான்
  rationale: இழப்பு அல்லது பறிபோதலைக் குறிக்கிறது; அது தண்டனையா வெகுமதி இழப்பா என்பதை உரை கூறாததால் குறிப்பாகத் தீர்மானிக்கவில்லை.
- source_word: αὐτὸς δὲ σωθήσεται
  choice: ஆனாலும் அவனோ மீட்கப்படுவான்
  rationale: வேலை அழிவதற்கும் அந்த நபர் மீட்கப்படுவதற்கும் உள்ள முரண்பாட்டையும் αὐτός என்பதன் வலியுறுத்தலையும் ‘அவனோ’ காட்டுகிறது.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: எனினும் நெருப்பின் வழியாகத் தப்பியவனைப் போல
  rationale: நெருப்பினூடாகக் கடந்து மிகக் குறுகிய விதத்தில் தப்புதல் என்ற உருவகத்தை இயல்பான தமிழில் தருகிறது; மாற்று நேரடியான வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறுதிக் கூறு குறிப்பிட்ட சுத்திகரிப்பு கோட்பாட்டையா அல்லது மிகக் குறுகிய தப்பிப்பையா குறிக்கிறது என்பது
  choice: “நெருப்பின் வழியாகத் தப்பியவனைப் போல” என்று உருவகமாக வைத்தல்
  alternative: “நெருப்பின் வழியாகவே” என்று மிக நேரடியாக மொழிபெயர்த்தல்
  rationale: உரை நெருப்பின் உருவகத்தை விளக்கமாக விரித்துரைக்கவில்லை. ஆகவே சுத்திகரிப்பு போன்ற குறிப்பிட்ட சமயக் கோட்பாட்டைச் சேர்க்காமல், ஆபத்தினூடான மீட்பு என்ற காட்சியையும் அதன் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. “அவனோ” என்பதால் மூலத்தின் வலியுறுத்தல் காக்கப்படுகிறது; “இழப்பு” எதைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பு தேவையின்றித் தீர்மானிக்கவில்லை.
