    text: அல்லது, “ஆனால் நெருப்பின் வழியாக மட்டுமே”; அல்லது, “நெருப்பின் வழியாகத் தப்புபவரைப் போல.”
    reason: lexical_alternative
  revision_rationale: The revision retains the source text’s contrast between the loss of the work and the salvation of the individual, while rendering the final fire image without deciding whether it denotes narrow escape, purification, or another precise theological implication. The alternative ‘escape’ sense is retained in the footnote.
