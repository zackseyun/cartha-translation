source:
  edition: SBLGNT
  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: ta
  text: நான் உங்களுக்குப் பால் குடிக்கக் கொடுத்தேன்; திட உணவை[a] அல்ல. ஏனெனில் உங்களால் இன்னும் முடியவில்லை. ஆனால், இப்போதுகூட உங்களால் இன்னும் முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திட உணவு” என்பதற்கான கிரேக்கச் சொல் பொதுவாக “உணவு” என்று பொருள்படும்; இங்கு பாலுடன் உள்ள வேறுபாட்டைத் தெளிவுபடுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: பால்
  rationale: உணவூட்டும் உருவகத்தில் வரும் நேரடியான பொருள்; தமிழிலும் பால் என்ற சொல் இயல்பாகவே எதிர்மறை ஒப்பீட்டைத் தக்கவைக்கிறது.
- source_word: ἐπότισα
  choice: குடிக்கக் கொடுத்தேன்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளான ‘குடிக்கக் கொடுத்தல்’ என்பதை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: βρῶμα
  choice: திட உணவு
  rationale: இந்தச் சொல் பொதுவாக ‘உணவு’ என்று பொருள்பட்டாலும், பாலுடன் உள்ள எதிர்மறை ஒப்பீட்டை நவீன தமிழில் தெளிவாகக் காட்ட ‘திட உணவு’ என மொழிபெயர்க்கப்பட்டது; பொதுப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὔπω
  choice: அப்போது இன்னும்
  rationale: கடந்தகாலத்தில் அந்நேரம் வரை திறன் ஏற்படவில்லை என்ற காலநிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐδύνασθε
  choice: உங்களால் முடியவில்லை
  rationale: δύναμαι குறிக்கும் திறன் அல்லது ஆற்றலை நேரடியாகத் தருகிறது; கிரேக்கத்தில் விடப்பட்டுள்ள செயப்படுபொருளை தமிழிலும் விளக்கிச் சேர்க்காமல் விடுகிறது.
- source_word: οὐδὲ ἔτι νῦν
  choice: இப்போதும்கூட ... இன்னும்
  rationale: திறனின்மை தற்போதும் தொடர்கிறது என்ற வலியுறுத்தலை முழுமையாகப் பாதுகாக்கிறது.
- source_word: δύνασθε
  choice: உங்களால் ... முடியவில்லை
  rationale: தற்போதைய திறனின்மையைக் காட்டுவதோடு, முந்தைய வினை வடிவத்துடனான இணைப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: பவுலின் உணவூட்டும் உருவகத்தின் விளக்கம்
  choice: பால் மற்றும் திட உணவு என்ற உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘அடிப்படையானவற்றை மட்டுமே கற்பித்தேன்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்க மூலத்தில் உருவகமே பயன்படுத்தப்பட்டுள்ளது. அதன் இறையியல் பயன்பாட்டை மொழிபெயர்ப்புக்குள் விரித்துச் சேர்க்காமல் இருப்பது மூலத்தின் நுட்பத்தையும் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உங்களால் முடியவில்லை’ என்பதில் எது முடியவில்லை என்பதை விளக்கிச் சேர்க்காமல், மூலத்தில் உள்ள சுருக்கமும் உருவகத் திறந்த தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
