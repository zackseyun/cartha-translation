  text: நீங்கள்[b] கடவுளுடைய ஆலயம்[a] என்றும், கடவுளுடைய ஆவி உங்களுக்குள்[c] குடியிருக்கிறார் என்றும் உங்களுக்குத் தெரியாதா?
