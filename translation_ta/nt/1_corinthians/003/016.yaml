lexical_decisions:
- source_word: ναὸς
  choice: ஆலயம்
  rationale: ναός என்பது பொதுவான ஆலய வளாகத்தை அல்ல, குறிப்பாகத் தூய உறைவிடமான ஆலயத்தைச் சுட்டுகிறது. ‘ஆலயம்’ என்பது இயல்பான தமிழில் புனித இட உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: θεοῦ
  choice: கடவுளுடைய
  rationale: உடைமைப் பொருளுடைய கிரேக்க வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கடவுளுடைய ஆலயம்’, ‘கடவுளுடைய ஆவி’ என்ற இரு தொடர்களிலும் உறவைத் தெளிவாகக் காக்கிறது.
- source_word: ἐστε
  choice: நீங்கள் ... என்றும்
  rationale: இரண்டாம் நபர் பன்மையை ‘நீங்கள்’ எனக் காக்கிறது. வசனம் கொரிந்துச் சபையாரை ஒரு சமூகமாக நோக்கிச் சொல்வதும் இதனால் மறைக்கப்படவில்லை.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: கடவுளுடைய ஆவி
  rationale: கிரேக்கச் சொல்லமைப்பிலுள்ள உடைமை உறவை இயல்பான நவீன தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: οἰκεῖ
  choice: குடியிருக்கிறார்
  rationale: தொடர்ந்து உறைவதைக் குறிக்கும் οἰκέω என்பதையும் ஆலய உருவகத்தையும் காக்கிறது. ஆவியைக் குறிக்கும் இடத்தில் மரியாதை வினைமுற்று இயல்பான தமிழாக உள்ளது.
- source_word: ἐν ὑμῖν
  choice: உங்களுக்குள்
  rationale: ἐν என்பதன் அடிப்படை ‘உள்ளே’ பொருளைக் காக்கிறது; பன்மைச் சமூகத்தை நோக்கியதால் ‘உங்கள் நடுவில்’ என்ற பொருளும் சாத்தியம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: Οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாதா?
  rationale: பவுலின் எதிர்மறை வினாவையும் அதன் நினைவூட்டும், சவால்விடும் வலிமையையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: இந்த வசனம் தனிப்பட்ட விசுவாசிகளையா அல்லது சபையை ஒரு சமூகமாகவா முதன்மையாகக் குறிக்கிறது?
  choice: ‘நீங்கள்’ என்ற பன்மை வடிவம் பிரதான உரையில் காக்கப்பட்டு, அதன் சமூக நோக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
  alternative: ‘நீங்கள் எல்லாரும் சேர்ந்து கடவுளுடைய ஆலயம்’ என்று சமூகப் பொருளை உரையிலேயே வெளிப்படையாக்குதல்; அல்லது ‘உங்களில் ஒவ்வொருவரும்’ என்று தனிநபர்மயமாக்குதல்.
  rationale: கிரேக்கத்தில் இரண்டாம் நபர் பன்மை உள்ளது; சூழல் சபையைச் சமூகமாக நோக்குகிறது. ஆனால் ‘சேர்ந்து’ அல்லது ‘ஒவ்வொருவரும்’ என்பதற்கான வெளிப்படையான சொல் மூலத்தில் இல்லாததால், எந்தப் பக்கத்தையும் பிரதான உரை மேலதிகமாகச் சேர்த்து முடிவுசெய்யவில்லை.
- issue: ἐν ὑμῖν என்பது ‘உங்களுக்குள்’ என்பதா, ‘உங்கள் நடுவில்’ என்பதா?
  choice: ‘உங்களுக்குள்’ பிரதான உரையில் வைக்கப்பட்டு, ‘உங்கள் நடுவில்’ அடிக்குறிப்பில் தரப்படுகிறது.
  alternative: ‘உங்கள் நடுவில்’ என்பதைப் பிரதான உரையாகக் கொடுத்தல்.
  rationale: ἐν ὑμῖν இரு வகையிலும் புரிந்துகொள்ளப்படலாம். பன்மை முகவரியும் சமூக ஆலய உருவகமும் ‘நடுவில்’ என்ற வாசிப்பை ஆதரிக்கலாம்; இருப்பினும் ‘உங்களுக்குள்’ என்பது கிரேக்க முன்னிடைச்சொல்லின் நேரடியான பொருளையும் உண்மையான தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆலயம்’ மற்றும் ‘குடியிருக்கிறார்’ ஆகிய சொற்கள் மூலத்தின் புனித இடம்–உறைதல் உருவகத் தொடர்பைக் காக்கின்றன. ‘நீங்கள்’ என்ற பன்மையின் சமூகத் தன்மையும் ἐν ὑμῖν என்பதிலுள்ள இடவியல் தெளிவின்மையும் அடிக்குறிப்புகளில் வெளிப்படுத்தப்பட்டுள்ளன.
