  text: καὶ πάλιν· Κύριος γινώσκει τοὺς διαλογισμοὺς τῶν σοφῶν ὅτι εἰσὶν μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: ta
  text: மீண்டும், “ஞானிகளின் சிந்தனைகள்[a] பயனற்றவை[c] என்று ஆண்டவர் அறிந்திருக்கிறார்.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிந்தனைகள்” என்பதற்கு “ஆலோசனைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சங்கீதம் 94:11-லிருந்து மேற்கோள் (கிரேக்கப் பழைய ஏற்பாட்டில் 93:11).
    reason: cross_reference
  - marker: c
    text: “பயனற்றவை” என்பதற்கு “வீணானவை” அல்லது “வெறுமையானவை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: மேலும்
  rationale: முந்தைய மேற்கோளுக்கு அடுத்ததாக இரண்டாவது ஆதார மேற்கோளை அறிமுகப்படுத்துகிறது; நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: Κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, மரியாதைமிக்க தமிழ் வேதாகமச் சொல்; மேற்கோளின் எழுவாயைத் தெளிவாகக் காட்டுகிறது.
- source_word: γινώσκει
  choice: அறிந்திருக்கிறார்
  rationale: நிகழ்காலத்தில் நிலைத்திருக்கும் அறிவை இயல்பான தமிழில் தெரிவிக்கிறது; விளக்க விரிவாக்கம் எதையும் சேர்க்கவில்லை.
- source_word: διαλογισμοὺς
  choice: சிந்தனைகள்
  rationale: மனத்தின் எண்ணங்களையும் பகுத்தாராயும் சிந்தனைகளையும் உள்ளடக்கக்கூடிய இயல்பான நவீன தமிழ்; ‘ஆலோசனைகள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῶν σοφῶν
  choice: ஞானிகளின்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட σοφῶν என்பதைக் பாலினக் குறிப்பின்றி நேரடியாகத் தருகிறது; சூழலில் மனித ஞானம் உடையவர்களைக் குறிக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: ஆண்டவர் அறிந்திருப்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் ὅτι-ஐ இயல்பான தமிழ் மறைமுகக் கூற்றாகக் காட்டுகிறது; காரணப் பொருளாக மாற்றவில்லை.
- source_word: μάταιοι
  choice: பயனற்றவை
  rationale: வெறுமையும் பயனின்மையும் குறிக்கும் சொல்லின் கருத்தைத் தெளிவான நவீன தமிழில் தருகிறது; ‘வீணானவை’ என்ற மாற்றும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
