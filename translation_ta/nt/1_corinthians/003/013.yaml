source:
  edition: SBLGNT
  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: ta
  text: ஒவ்வொருவருடைய வேலையும் வெளிப்படும்; ஏனெனில் அந்த நாள்[a] அதைத் தெளிவாக்கும். ஏனெனில் அந்த நாள் நெருப்பில்[b] வெளிப்படுத்தப்படுகிறது; ஒவ்வொருவருடைய வேலை எத்தகையது என்பதை நெருப்பே சோதிக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்த நாள்” என்பது வருங்காலத்தில் நடைபெறும் தெய்வீக மதிப்பீடு அல்லது நியாயத்தீர்ப்பின் நாளைக் குறிக்கலாம்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “நெருப்பினால்.” ἐν πυρί என்ற கிரேக்கத் தொடரை “நெருப்பில்” என்றும், கருவிப்பொருளில் “நெருப்பினால்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου
  choice: ஒவ்வொருவருடைய
  rationale: பகிர்ந்தளிக்கும் தன்மையுள்ள ஒருமை உரிமைவேற்றுமையைப் பாதுகாத்து, ஒவ்வொரு நபரையும் தனித்தனியாகக் குறிக்கிறது.
- source_word: τὸ ἔργον
  choice: வேலை
  rationale: இச்சூழலில் கட்டுகிற ஒவ்வொருவரின் பணி அல்லது அதன் விளைவை விரிவாகக் குறிக்க இயல்பான பொதுச்சொல்.
- source_word: φανερὸν γενήσεται
  choice: வெளிப்படும்
  rationale: எதிர்காலத்தில் மறைவில்லாமல் தெரியவரும் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἡ ἡμέρα
  choice: அந்த நாள்
  rationale: குறிப்பிட்ட எதிர்கால நாளைச் சுட்டும் கிரேக்கச் சொல்லின் கட்டுரையையும் சூழலையும் தமிழில் இயல்பாகத் தெரிவிக்கிறது; தமிழில் பெரிய எழுத்து வேறுபாடு இல்லாததால் ‘அந்த’ பயன்படுத்தப்படுகிறது.
- source_word: δηλώσει
  choice: தெளிவாக்கும்
  rationale: வெளிப்படுத்தி அறியச் செய்யும் பொருளைத் தருவதோடு, அடுத்து வரும் ἀποκαλύπτεται என்பதிலிருந்து சொல்வேறுபாட்டையும் பேணுகிறது.
- source_word: ἐν πυρὶ
  choice: நெருப்பில்
  rationale: ἐν என்பதன் நேரடியான இடப்பொருளைப் பேணி, ‘நெருப்பினால்’ என்ற கருவிப்பொருள் சாத்தியத்தையும் அடிக்குறிப்பில் திறந்துவைக்கிறது.
- source_word: ἀποκαλύπτεται
  choice: வெளிப்படுத்தப்படுகிறது
  rationale: நிகழ்காலச் செயலற்ற வினை வடிவத்தையும் வெளிப்படுத்துதல் என்ற அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: ὁποῖόν ἐστιν
  choice: எத்தகையது
  rationale: வேலையின் தன்மை அல்லது தரம் என்ன என்பதைச் சுட்டும் கிரேக்கக் கேள்வித்தன்மையைச் சுருக்கமாகப் பேணுகிறது.
- source_word: τὸ πῦρ αὐτὸ
  choice: அந்த நெருப்பே
  rationale: αὐτό தரும் வலியுறுத்தலைத் தமிழ் ஏகாரத்தால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δοκιμάσει
  choice: சோதிக்கும்
  rationale: தன்மையையும் தரத்தையும் கண்டறிவதற்காகச் சோதித்தல் என்ற பொருளை கூடுதல் விளக்கமின்றித் தருகிறது.
theological_decisions:
- issue: ἡ ἡμέρα என்பது பொதுவான ஒரு நாளையா அல்லது எதிர்காலத் தெய்வீக மதிப்பீட்டின் குறிப்பிட்ட நாளையா குறிக்கிறது?
  choice: “அந்த நாள்” என்று குறிப்பிட்ட நாளாக மொழிபெயர்க்கப்பட்டது.
  alternative: “அந்நாள்” அல்லது “நாள்”
  rationale: உடனுள்ள சூழல் எதிர்கால மதிப்பீட்டு நாளைச் சுட்டுகிறது. ‘அந்த நாள்’ என்பது இதைத் தெளிவாக்கினாலும், ‘நியாயத்தீர்ப்பு நாள்’ என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: ἐν πυρί என்பதன் பொருள் இடச்சார்பானதா அல்லது கருவிச்சார்பானதா?
  choice: முதன்மை உரையில் “நெருப்பில்” என இடச்சார்பாக வைக்கப்பட்டது.
  alternative: “நெருப்பினால்”
  rationale: கிரேக்கத் தொடர் இரு நுணுக்கங்களையும் அனுமதிக்கிறது. முதன்மை உரை அதன் வடிவத்துக்கு நெருக்கமாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘அந்த நெருப்பே’ என்பது மூலத்தின் வலியுறுத்தலைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகே வைக்கப்பட்டுள்ளன.
