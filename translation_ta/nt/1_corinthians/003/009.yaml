    reason: θεοῦ συνεργοί என்ற கிரேக்கத் தொடரிலுள்ள உறவு, தேவனுக்குரிய பணியாளர்கள் என்றும் தேவனுடன் பணியாற்றுபவர்கள் என்றும் புரிந்துகொள்ளப்படக்கூடிய உண்மையான இலக்கணத் தெளிவின்மையைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கத்தை இவ்வசனம் தருகிறது என்பதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: συνεργοί
  choice: சக பணியாளர்கள்
  rationale: ஒன்றாகப் பணியாற்றுகிறவர்களைக் குறிக்கும் பன்மைப் பெயர்ச்சொல்லின் பொருளைத் தெளிவாகவும் நவீன தமிழிலும் வழங்குகிறது.
- source_word: θεοῦ (with συνεργοί)
  choice: தேவனுடைய
  rationale: உடனடி சூழலில் பணியாளர்கள் தேவனுக்குரியவர்கள், அவருடைய பணியில் இருப்பவர்கள் என்ற உரிமை அல்லது சார்புப் பொருளை முன்னிலைப்படுத்துகிறது; ‘தேவனுடன்’ என்ற சாத்தியத்தைக் குறிப்பில் பாதுகாக்கிறது.
- source_word: γεώργιον
  choice: விளைநிலம்
  rationale: பயிரிடப்படும் நிலம் என்ற வேளாண்மை உருவகத்தைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: οἰκοδομή
  choice: கட்டிடம்
  rationale: அடுத்த வசனங்களில் விரிவடையும் கட்டுமான உருவகத்தை இயல்பாக அறிமுகப்படுத்தும் எளிய சொல்.
- source_word: ἐστε
  choice: நீங்கள்
  rationale: கிரேக்க மூலத்தில் உள்ள இரண்டாம் நபர் பன்மையை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: θεοῦ συνεργοί என்பதன் பொருள் ‘தேவனுடைய சக பணியாளர்கள்’ என்பதா, ‘தேவனுடன் பணியாற்றும் சக பணியாளர்கள்’ என்பதா
  choice: தேவனுடைய சக பணியாளர்கள்
  alternative: தேவனுடன் சேர்ந்து பணியாற்றும் சக பணியாளர்கள்
  rationale: உடனடி சூழலில் ஊழியர்கள் தேவனுக்குரியவர்களாகவும் அவருக்குக் கீழ்ப்பட்டுப் பணிபுரிபவர்களாகவும் இருப்பது வலியுறுத்தப்படுகிறது. அதேவேளையில், கிரேக்க வேற்றுமை உருபு அனுமதிக்கும் மற்றொரு விளக்கத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘விளைநிலம்’ மற்றும் ‘கட்டிடம்’ ஆகிய உருவகங்கள் சுருக்கமாகப் பாதுகாக்கப்பட்டுள்ளன; விவாதத்திற்குரிய இறையியல் உறவு முதன்மை உரையில் வலுக்கட்டாயமாகத் தீர்க்கப்படாமல் அடிக்குறிப்பில் மாற்று வாசிப்புடன் தரப்பட்டுள்ளது.
