revisions:
- from: அப்படியானால், அப்பொல்லோ என்ன? பவுல் என்ன? நீங்கள் நம்பிக்கை கொள்வதற்குக் கருவிகளாயிருந்த பணியாளர்களே[a] அவர்கள்; ஆண்டவர் ஒவ்வொருவருக்கும் கொடுத்தபடியே[b] பணியாற்றினார்கள்.
  to: அப்படியானால் அப்பொல்லோ என்ன? பவுல் என்ன? நீங்கள் நம்பிக்கை கொண்டதற்கு வழியாக இருந்த பணியாளர்கள்[a] அவர்கள்; ஆண்டவர் ஒவ்வொருவருக்கும் கொடுத்தபடியே[b].
  rationale: The revision removes the unsupported “பணியாற்றினார்கள்,” replaces the more impersonal “கருவிகளாயிருந்த” with the direct instrumental expression “வழியாக இருந்த,” and retains the final Greek ellipsis rather than supplying “task,” “role,” “gift,” or a verb of service. Footnote a is adjusted to avoid the misleading modern sense of “செயலாளர்கள்.”
