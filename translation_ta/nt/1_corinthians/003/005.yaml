source:
  edition: SBLGNT
  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: ta
  text: அப்படியானால் அப்பொல்லோ என்ன? பவுல் என்ன? நீங்கள் நம்பிக்கை கொண்டதற்கு வழியாக இருந்த பணியாளர்கள்[a] அவர்கள்; ஆண்டவர் ஒவ்வொருவருக்கும் கொடுத்தபடியே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணியாளர்கள்’ என்பதற்கு ‘ஊழியர்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொல் சேவை செய்பவர்களைக் குறிக்கிறது; திருச்சபையின் முறையான ‘உதவிக்காரர்’ பதவியை அவசியம் குறிக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆண்டவர் ஒவ்வொருவருக்கும் கொடுத்தபடியே’ என்ற கிரேக்கத் தொடர் சுருக்கமானது; எதைக் கொடுத்தார் என்பது கூறப்படவில்லை. ‘ஆண்டவர் ஒவ்வொருவருக்கும் ஒதுக்கியபடி’ என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: என்ன
  rationale: கிரேக்கத்தில் ஆளைக் குறிக்கும் ‘யார்’ என்பதற்குப் பதிலாக ‘என்ன’ உள்ளது; இது அப்பொல்லோவும் பவுலும் யார் என்பதைவிட அவர்களுடைய பங்கு அல்லது நிலை என்ன என்பதைக் கேட்கிறது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: முந்தைய விவாதத்திலிருந்து வரும் முடிவையும் தொடர்ச்சியையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: δέ
  choice: பவுல் என்ன?
  rationale: δέ இங்கு மென்மையான தொடர்ச்சி அல்லது ஒப்பீட்டைக் குறிக்கிறது; தமிழில் தனியே ‘மேலும்’ சேர்க்காமல் இணையான இரு கேள்விகளாக அமைப்பது இயல்பாக உள்ளது.
- source_word: διάκονοι
  choice: பணியாளர்கள்
  rationale: இங்கு இது திருச்சபையின் முறையான ‘உதவிக்காரர்’ பதவியை அவசியம் குறிக்காமல், சேவை செய்கிறவர்களைக் குறிக்கிறது.
- source_word: δι’ ὧν
  choice: கருவிகளாயிருந்த
  rationale: διά + genitive காட்டும் வழிமுறை அல்லது இடைமுகச் செயல்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; நம்பிக்கையின் இறுதி காரணம் அவர்களே என்று கூறுவதில்லை.
- source_word: ἐπιστεύσατε
  choice: நீங்கள் நம்பிக்கை கொள்வதற்கு
  rationale: அவர்கள் வழியாக கொரிந்தியர் நம்பிக்கை கொண்டதை நேரடியாகக் கூறுகிறது; தேவையற்ற விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: ஆண்டவர் ஒவ்வொருவருக்கும் கொடுத்தபடியே பணியாற்றினார்கள்
  rationale: தமிழில் வாக்கியத்தைப் புரிந்துகொள்ள குறைந்தபட்சமாக ‘பணியாற்றினார்கள்’ சேர்க்கப்பட்டுள்ளது; ஆனால் ஆண்டவர் எதை அளித்தார்—பணி, வாய்ப்பு, திறன், அல்லது பங்கு—என்பது முதன்மை உரையில் குறிப்பிடப்படாமல் கிரேக்கத்தின் பொருள் திறந்தவாறே வைக்கப்படுகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான மரபான, கண்ணியமான தமிழ் இணை; முதன்மை உரை அதன் குறிப்பிட்ட நபரை மேலதிகமாக விளக்கவில்லை.
theological_decisions:
- issue: ‘ஆண்டவர்’ (κύριος) என்பவர் யார்?
  choice: முதன்மை உரையில் ‘ஆண்டவர்’ என்றே விடப்பட்டுள்ளது; சூழலில் இது ஆண்டவர் இயேசுவைக் குறிக்கலாம்.
  alternative: பொதுவாகக் கடவுளைக் குறிக்கும் வாசிப்பு.
  rationale: குறிப்பிட்ட பெயரை மொழிபெயர்ப்பில் சேர்ப்பது மூலத்தில் இல்லாத தெளிவாக்கமாகிவிடும்; ஆகவே குறிப்பீட்டின் இயல்பான திறந்த நிலை பாதுகாக்கப்படுகிறது.
- issue: ‘ஆண்டவர் கொடுத்தபடியே’ என்பதில் விடுபட்டுள்ள பொருள்
  choice: எதை ஆண்டவர் கொடுத்தார் என்பதை முதன்மை உரை குறிப்பிடவில்லை.
  alternative: ‘ஒவ்வொருவருக்கும் ஒரு பணியை ஒதுக்கியபடி’ அல்லது ‘ஒவ்வொருவருக்கும் ஒரு பங்கைக் கொடுத்தபடி.’
  rationale: கிரேக்க வாக்கியம் சுருக்கமாகவும் விடுபாட்டுடனும் உள்ளது. ‘பணி,’ ‘பங்கு,’ அல்லது ‘வரம்’ என்று நிரப்புவது உண்மையான பொருள் திறப்பைச் சுருக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பொல்லோ என்ன? பவுல் என்ன?’ என்ற வடிவம் தமிழில் சற்றுக் கூர்மையாக ஒலித்தாலும், நபர்களின் அடையாளத்தை அல்ல அவர்களின் பங்கு அல்லது நிலையை வலியுறுத்தும் மூலத்தின் ‘Τί’ என்பதைக் காக்கிறது. இறுதிக் கிரேக்கத் தொடரின் விடுபாட்டை முழுமையாகச் சொற்சொல்லாக வைத்தால் தமிழ் தெளிவிழக்கும் என்பதால், சூழலிலுள்ள சேவைச் செயலை மட்டும் ‘பணியாற்றினார்கள்’ என்று வெளிப்படுத்தி, கொடுக்கப்பட்ட பொருள் எது என்பதைத் திறந்தவாறே வைத்துள்ளோம்.
