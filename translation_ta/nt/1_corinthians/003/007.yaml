  to: ஆகவே, நடுகிறவரும் ஒன்றுமில்லை; நீர் பாய்ச்சுகிறவரும் ஒன்றுமில்லை; ஆனால் வளர்ச்சியை உண்டாக்குகிறவர் கடவுள்.[a]
