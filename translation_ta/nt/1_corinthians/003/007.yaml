id: 1CO.3.7
reference: 1 Corinthians 3:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ’ ὁ αὐξάνων θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: ta
  text: ஆகவே, நடுகிறவரும் ஒன்றுமில்லை; நீர் பாய்ச்சுகிறவரும் ஒன்றுமில்லை; ஆனால் வளர்ச்சியை உண்டாக்குகிறவர் கடவுள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால் வளர்ச்சியைக் கொடுக்கிறவர் கடவுள்”; பாரம்பரியமாக, “வளர்ச்சியைக் கொடுக்கிற கடவுள்.”
    reason: ὁ αὐξάνων θεός என்பதற்கான நெருங்கிய தமிழ்ச் சொற்றொடர் மாற்றுகளை வழங்குகிறது.
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ὁ φυτεύων
  choice: நடுகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையின் செயற்பாட்டு நயத்தையும் இணை அமைப்பையும் காக்கிறது.
- source_word: ἐστίν τι
  choice: ஒன்றுமில்லை
  rationale: மனிதப் பணியாளர்களின் முக்கியத்துவத்தை முற்றிலும் மறுப்பதல்ல, வளர்ச்சியின் மூலமாக அவர்கள் இல்லை என்பதைச் சூழலில் காட்டும் கிரேக்க மரபுத்தொடருக்கு நெருக்கமான தமிழ்.
- source_word: ὁ ποτίζων
  choice: நீர் பாய்ச்சுகிறவர்
  rationale: வேளாண்மைச் சூழலில் இயல்பாகவும், ‘நடுகிறவர்’ என்பதுடன் இணையான அமைப்பிலும் உள்ளது.
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: மனிதப் பணியாளர்களுக்கும் வளர்ச்சியை ஏற்படுத்தும் கடவுளுக்கும் இடையிலான வலுவான எதிர்மறை மாறுபாட்டைக் குறிக்கிறது; தமிழ்ச் சொற்றொடரில் அரைப்புள்ளிக்குப் பின் கருத்துவேறுபாடு இயல்பாக வெளிப்படுவதால் உரையில் தனிச் சொல் விடுக்கப்பட்டுள்ளது.
- source_word: ὁ αὐξάνων
  choice: வளரச் செய்கிற
  rationale: வளர்ச்சியை உண்டாக்குபவர் கடவுள் என்பதைக் காட்டுகிறது; கிரேக்கத்தில் வெளிப்படையான செயப்படுபொருள் இல்லாததையும் காக்கிறது.
- source_word: θεός
  choice: கடவுள்
  rationale: நவீன பொதுத் தமிழில் இயல்பான இறைப்பெயர்; கிரேக்க வாக்கிய முடிவிலுள்ள வலியுறுத்தலை ‘கடவுளே’ எனப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ἀλλ’ ὁ αὐξάνων θεός என்ற சுருக்கமான எதிர்மறை அமைப்பு
  choice: வளரச் செய்கிற கடவுளே எல்லாம்
  alternative: ஆனால் வளரச் செய்கிறவர் கடவுள்
  rationale: முன்னிரு பணியாளர்களும் ‘ஒன்றுமில்லை’ என்ற அமைப்புக்கு இயல்பான தமிழ் எதிரிணையாக ‘கடவுளே எல்லாம்’ அமைகிறது; ஆயினும் ‘எல்லாம்’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லை என்பதால் அடிக்குறிப்பில் மேலும் நேரடியான மாற்று தரப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நடுகிறவர் / நீர் பாய்ச்சுகிறவர் / வளரச் செய்கிற’ என்ற இணை அமைப்பு பவுலின் வேளாண்மை உருவகத்தையும் சொற்பொழிவு சமநிலையையும் காக்கிறது.
