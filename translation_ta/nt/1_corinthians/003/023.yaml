  source_fidelity: மூலக் கிரேக்கத்தின் சுருக்கமான இரண்டு இணை உடைமை/சார்பு வாக்கியங்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ὑμεῖς பன்மை ‘நீங்கள்/நீங்களோ’ ஆகவும், Χριστοῦ மற்றும் θεοῦ ஆகிய genitive உறவுகள் முறையே ‘மெசியாவுக்குரியவர்கள்’ மற்றும் ‘கடவுளுக்குரியவர்’ ஆகவும் சமச்சீராக வெளிப்படுகின்றன. δέ-யின் தொடர்ச்சியுடனான மென்மையான எதிர்நிலை ‘-ஓ … -ஓ’ அமைப்பில் இயல்பாகத் தெரிவிக்கப்படுகிறது.
  naturalness: ‘நீங்களோ மெசியாவுக்குரியவர்கள்; மெசியாவோ கடவுளுக்குரியவர்’ என்பது நவீன நிலையான தமிழில் சுருக்கமானதும் கண்ணியமானதுமான நடை. முற்றுப்புள்ளிக்குப் பதிலான அரைப்புள்ளி இரு இணைத் தொடர்களின் சொல்லாட்சி உறவை நன்றாகக் காட்டுகிறது.
  terminology: Χριστός பட்டப்பெயருக்கு ‘மெசியா’ தொடர்ந்து பயன்படுத்தப்பட்டுள்ளது; இது திட்டத்தின் lexical policy-க்கும் மூலத்தின் பட்டப்பெயர்ச் செயல்பாட்டுக்கும் ஏற்றது. θεός-க்கு ‘கடவுள்’ இயல்பான நவீனத் தமிழ் தேர்வு. அடிக்குறிப்பு ‘கிறிஸ்து’ என்ற மரபுவழி மாற்றைச் சரியாகக் குறிப்பிடுகிறது; அதன் [a] குறியீடு உரையில் சரியாக இணைக்கப்பட்டுள்ளது.
