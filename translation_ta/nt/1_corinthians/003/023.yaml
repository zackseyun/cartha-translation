lexical_decisions:
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: இது இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல்; நவீனத் தமிழில் இயல்பாகப் பன்மை வாசகர்களைக் குறிக்கிறது.
- source_word: δὲ
  choice: -ஓ … -ஓ
  rationale: இரு இணையான உறுப்புகளையும் தொடர்ச்சியுடனும் மென்மையான வேறுபாட்டுடனும் இணைக்கும் δέ-யின் பணியைத் தமிழில் இந்த அமைப்பு சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: Χριστοῦ / Χριστός
  choice: மெசியாவுக்குரியவர்கள் / மெசியா
  rationale: Χριστός இங்கு பட்டமாக வருகிறது. முதல் வடிவம் உடைமை அல்லது சார்புறவைச் சுட்டும் மரபுவேற்றுமை; தமிழில் ‘-க்குரியவர்கள்’ என்பது அந்த உறவை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: θεοῦ
  choice: கடவுளுக்குரியவர்
  rationale: θεός என்பதன் மரபுவேற்றுமை வடிவம் உடைமை அல்லது சார்புறவை வெளிப்படுத்துகிறது; ‘கடவுளுக்குரியவர்’ என்பது விளக்கத்தைச் சேர்க்காமல் அந்த உறவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστοῦ மற்றும் θεοῦ ஆகிய இரு மரபுவேற்றுமைத் தொடர்களில் உள்ள உடைமை/சார்புறவை எவ்வாறு மொழிபெயர்ப்பது
  choice: இரண்டையும் இணையாக ‘மெசியாவுக்குரியவர்கள்’ மற்றும் ‘கடவுளுக்குரியவர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘நீங்கள் மெசியாவுடையவர்கள்; மெசியா கடவுளுடையவர்’ அல்லது ‘நீங்கள் மெசியாவைச் சேர்ந்தவர்கள்; மெசியா கடவுளைச் சேர்ந்தவர்’
  rationale: கிரேக்க உரை சுருக்கமாகவும் இணை அமைப்புடனும் உள்ளது. ‘-க்குரிய’ என்பது உறவைத் தெளிவாக்குகிறது; அதே நேரத்தில் அது எந்த வகையான உடைமை அல்லது உறவு என்பதை இறையியல் விளக்கத்தால் தீர்மானித்துவிடாமல் அசல் உரையின் பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘-ஓ … -ஓ’ என்ற இணை அமைப்பு வசனத்தின் சொல்லாட்சிச் சமச்சீரைத் தக்கவைக்கிறது; ‘மெசியா’ பட்டப்பெயராக வைக்கப்பட்டுள்ளது.
