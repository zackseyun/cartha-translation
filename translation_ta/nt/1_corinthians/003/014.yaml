lexical_decisions:
- source_word: εἴ
  choice: -ஆல்
  rationale: எளிய நிபந்தனையைத் தமிழில் இயல்பாகத் தெரிவிக்கும் நிபந்தனை விகுதி.
- source_word: τινος
  choice: ஒருவன் ... அவன்
  rationale: மூலத்தின் பொதுவான ஒருமையையும் ஆண்பால் பிரதிநிதித்துவ வடிவத்தையும் தெளிவாகப் பேணுகிறது.
- source_word: τὸ ἔργον
  choice: வேலை
  rationale: கட்டுமான உருவகத்துக்கு ஏற்றதும், செயல் அல்லது ஊழியத்தின் பலன் என்று மிகையாகக் குறுக்காததும் ஆன பொதுவான சொல்.
- source_word: μενεῖ
  choice: நிலைத்திருந்தால்
  rationale: எதிர்கால நிபந்தனைச் சூழலில் ‘தொடர்ந்து இருத்தல்/நிலைத்திருத்தல்’ என்ற பொருளை இயல்பாகத் தருகிறது; நெருப்பிலிருந்து ‘தப்பிப் பிழைத்தல்’ என்று விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ὃ ἐποικοδόμησεν
  choice: கட்டியெழுப்பிய
  rationale: ஒரு அடித்தளத்தின்மேல் மேலும் கட்டுதல் என்ற கூட்டு வினையின் நுணுக்கத்தைப் பேணுகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத பொருளைச் சேர்க்காமல் ‘வேலை’ என்பதைத் தொடர்புபடுத்துகிறது.
- source_word: μισθὸν
  choice: கைம்மாறு
  rationale: மதிப்பீட்டுக்குப் பின் கிடைக்கும் பிரதிபலன் என்ற பொருளைத் தருகிறது; வெறும் கூலி என்ற பொருளுக்கு மட்டும் கட்டுப்படுத்தாது.
- source_word: λήμψεται
  choice: பெறுவான்
  rationale: எதிர்காலச் செயலைச் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: μισθός என்பது அருளா, இரட்சிப்பா, அல்லது ஊழியத்திற்கான பிரதிபலனா என்பதைத் துல்லியப்படுத்துதல்
  choice: கைம்மாறு
  alternative: வெகுமதி / கூலி
  rationale: வசனம் பிரதிபலன் கிடைப்பதை மட்டும் கூறுகிறது; அதன் இறையியல் இயல்பை மேலதிகமாக வரையறுக்கவில்லை. ஆகவே அந்தத் திறந்த தன்மை பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதும் கண்ணியமானதும் ஆன நடை. ‘கட்டியெழுப்பிய’ என்பது முந்தைய வசனங்களின் அடித்தள உருவகத்தைப் பேணுகிறது. எல்லா அடிக்குறிப்புக் குறிகளும் உரையில் இடம்பெற்றுள்ளன.
