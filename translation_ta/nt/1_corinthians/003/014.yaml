  rationale: The revision improves the natural Tamil expression of the future conditional and replaces a potentially misleading reciprocal term with the standard, contextually fitting ‘வெகுமதி.’ It does not add an explicit foundation, since the Greek leaves the object of ‘built on’ implicit in this clause; ‘கட்டியெழுப்பிய’ retains the contextual building-on nuance.
