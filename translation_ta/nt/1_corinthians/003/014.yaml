  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: ta
  text: ஒருவன் கட்டியெழுப்பிய வேலை நிலைத்தால்[a], அவன் வெகுமதி[b] பெறுவான்.
  philosophy: optimal-equivalence
  footnotes:
