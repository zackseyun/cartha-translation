id: 1CO.3.1
reference: 1 Corinthians 3:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: ta
  text: சகோதரர்களே[a], நானும் உங்களிடம் ஆவிக்குரியவர்களிடம் பேசுவது போல் பேச முடியவில்லை; மாறாக, மாம்சத்துக்குரியவர்களிடமும், மேசியாவுக்குள்[b] குழந்தைகளிடமும் பேசுவது போலப் பேசினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதர சகோதரிகளே’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் ‘சகோதரர்களே’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கிறிஸ்துவுக்குள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: நானும்
  rationale: καί என்பதன் இணைப்புப் பொருளையும், வலியுறுத்தப்பட்ட முதல் நபர் சுட்டுப்பெயரையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க ஆண்பால் பன்மை அழைப்பை நேரடியாகத் தருகிறது; சபையிலுள்ள பெண்களையும் உள்ளடக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: οὐκ ἠδυνήθην
  choice: பேச முடியவில்லை
  rationale: கடந்தகால இயலாமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: πνευματικοῖς
  choice: ஆவிக்குரியவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெயரடையைத் தெளிவாகத் தருவதுடன், அதன் ஆன்மீகப் பொருளைத் திறந்தவாறே வைத்திருக்கிறது.
- source_word: σαρκίνοις
  choice: மாம்சத்துக்குரியவர்கள்
  rationale: πνευματικοῖς என்பதுடனான எதிர்மறை இணைப்பையும் σάρξ உடனான சொற்பொருள் தொடர்பையும் காக்கிறது; ‘உலகத்தார்’ அல்லது ‘பாவ இயல்புடையோர்’ போன்ற மிகையான விளக்கத்தைத் தவிர்க்கிறது.
- source_word: νηπίοις
  choice: குழந்தைகள்
  rationale: முதிர்ச்சியின்மையைக் குறிக்கும் உருவகத்தை இயல்பான, கண்ணியமான தமிழில் பாதுகாக்கிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவுக்குள்
  rationale: ἐν என்பதன் உறவு/இணைப்பு சார்ந்த ‘உள்ளே’ மொழிநடையையும் Χριστός என்பதன் பட்டப்பெயர் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவுக்குள்
  alternative: கிறிஸ்துவுக்குள்
  rationale: இங்கு Χριστός பட்டப்பெயர் வலிமையைத் தக்கவைத்துள்ளது; ‘மேசியா’ அதை வெளிப்படையாகப் பாதுகாக்கிறது. பழக்கமான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: σαρκίνοις என்பதன் பொருள்
  choice: மாம்சத்துக்குரியவர்கள்
  alternative: உலகத்துக்குரியவர்கள்
  rationale: பவுலின் ‘ஆவிக்குரியவர்/மாம்சத்துக்குரியவர்’ என்ற பதற்றத்தைத் தீர்த்து விடாமல், மூலச் சொல்லின் உருவகத்தையும் ஒலிப்பொருள் தொடர்பையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பேசுவதுபோல்’ என்ற இணை அமைப்பு கிரேக்கத்தின் இரு ὡς சொற்றொடர்களையும் இயல்பாகவும் இணையாகவும் வெளிப்படுத்துகிறது.
