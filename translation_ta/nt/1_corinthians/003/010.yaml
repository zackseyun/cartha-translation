id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: ta
  text: எனக்குக் கொடுக்கப்பட்ட கடவுளின் அருளுக்கு ஏற்ப, ஞானமுள்ள தலைமைக் கட்டடக்காரரைப் போல[a] நான் ஓர் அடித்தளத்தை இட்டேன்; வேறொருவர் அதன்மேல் கட்டுகிறார். ஆனால், ஒவ்வொருவரும் எவ்வாறு கட்டுகிறார் என்பதில் கவனமாக இருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தலைமைக் கட்டடக்காரர்’ என்பதற்கு ‘கட்டடக் கலைஞர்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் கட்டுமானத்தை மேற்பார்வையிடும் முதன்மைக் கட்டுநரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ
  choice: ஏற்ப
  rationale: கொடுக்கப்பட்ட அருளுக்கு இசைவாக அல்லது அதற்கேற்ப பவுல் செயல்பட்டார் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் கருவிப்பொருளாக மாற்றவில்லை.
- source_word: χάριν
  choice: அருள்
  rationale: பவுலின் பயன்பாட்டில் கடவுள் இலவசமாக அளிக்கும் தயவையும் செயலாற்றும் ஆற்றலையும் தாங்கும் வழக்கமான, இறையியல் நிறை கொண்ட தமிழ்ச் சொல்.
- source_word: τὴν δοθεῖσάν μοι
  choice: எனக்குக் கொடுக்கப்பட்ட
  rationale: அந்த அருள் பவுலுக்குக் கடவுளால் அளிக்கப்பட்டது என்பதை நேரடியாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: σοφὸς ἀρχιτέκτων
  choice: ஞானமுள்ள தலைமை கட்டடக்காரர்
  rationale: σοφός என்பதன் ‘ஞானமுள்ள’ என்ற மதிப்பீட்டையும், ἀρχιτέκτων குறிக்கும் கட்டுமானத்தை மேற்பார்வையிடும் முதன்மைப் பணியாளரின் பங்கையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: θεμέλιον ἔθηκα
  choice: ஓர் அடித்தளத்தை இட்டேன்
  rationale: அடித்தளம் அமைப்பதற்கான இயல்பான தமிழ்ச் சொல்லாட்சியாகவும், பெயர்ச்சொல்லின் குறிப்பற்ற வடிவை ‘ஓர்’ என்பதால் பாதுகாப்பதாகவும் உள்ளது.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: வேறொருவர் அதன்மேல் கட்டிக்கொண்டிருக்கிறார்
  rationale: வேறு பணியாளர் ஏற்கெனவே இடப்பட்ட அடித்தளத்தின்மேல் தற்போது கட்டிவருவதை நிகழ்காலத் தொடர்ச்சியுடன் தெளிவாக்குகிறது.
- source_word: ἕκαστος δὲ βλεπέτω
  choice: ஆனால், ஒவ்வொருவரும் ... கவனமாக இருக்கட்டும்
  rationale: விழிப்புடனும் எச்சரிக்கையுடனும் செயல்பட வேண்டும் என்ற மூன்றாம் நபர் கட்டளையின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: πῶς ἐποικοδομεῖ
  choice: தாம் அதன்மேல் கட்டும் விதத்தைக் குறித்து
  rationale: கட்டுவதன் முறை அல்லது தரமே எச்சரிக்கையின் மையம் என்பதைத் தெரிவிக்கிறது; ἐποικοδομεῖ என்பதில் உள்ள ‘அதன்மேல் கட்டுதல்’ என்ற பொருளையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἕκαστος என்ற ஆண்பால் ஒருமையின் பிரதிநிதித்துவப் பயன்பாடு
  choice: ‘ஒவ்வொருவரும் தாம்’ என்று பாலினம் குறிக்காமல் ஒருமை சார்ந்த பகிர்ந்துணர்வைத் தருதல்
  alternative: ‘ஒவ்வொரு மனிதனும் அவன்’ என்று வெளிப்படையான ஆண்பால் வடிவில் மொழிபெயர்த்தல்
  rationale: இங்கு கிரேக்க ஆண்பால் வடிவம் ஆண்களை மட்டும் குறிக்காமல் ஒவ்வொரு பணியாளரையும் பிரதிநிதித்துவமாகக் குறிக்கிறது. தமிழ் ‘ஒவ்வொருவரும் தாம்’ என்பது அந்தப் பொதுவான பரப்பையும் தனிநபர் பொறுப்பையும் இயல்பாகப் பாதுகாக்கிறது.
- issue: இரண்டாவது ἐποικοδομεῖ என்பதில் அடித்தளம் மறைமுகப் பொருளாக இருப்பது
  choice: ‘அதன்மேல்’ என்பதை வெளிப்படையாகச் சேர்த்தல்
  alternative: ‘தாம் கட்டும் விதம்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: கிரேக்கக் கூட்டுவினையே ‘மேல் கட்டுதல்’ என்ற பொருளைக் கொண்டுள்ளது. தமிழில் ‘அதன்மேல்’ என்பது கட்டுமான உருவகத்தையும் முந்தைய அடித்தளத்துடனான தொடர்பையும் தெளிவாக்குகிறது; புதிய இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, dignified ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. ‘தலைமை கட்டடக்காரர்’ என்பது பண்டைய கட்டுமானப் பொறுப்பைத் தெளிவாகச் சொல்கிறது; ‘கட்டிக்கொண்டிருக்கிறார்’ நிகழும் பணியின் தொடர்ச்சியை வெளிப்படுத்துகிறது. பாலினத்தைத் தேவையின்றி இறக்குமதி செய்யாமல் தனிநபர் பொறுப்பு காக்கப்பட்டது.
