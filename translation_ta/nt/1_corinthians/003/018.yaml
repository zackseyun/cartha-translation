  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: ta
  text: யாரும் தன்னைத்தானே ஏமாற்றிக்கொள்ள வேண்டாம். உங்களில் யாராவது இந்தக் காலத்தில் தான் ஞானி[a] என்று நினைத்தால், அவர் ஞானியாக ஆகும்படி மூடராக[b] ஆகட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் காலத்தின் அளவுகோலின்படி ஞானி.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முட்டாளாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: யாரும் தன்னைத்தானே ஏமாற்றிக்கொள்ள வேண்டாம்
  rationale: தடைப் பொருளையும், வெளிப்படையான தன்மறுமொழிப் பெயரான ἑαυτόν என்பதையும் இயல்பான நவீனத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἴ τις δοκεῖ σοφὸς εἶναι
  choice: யாராவது ... தான் ஞானி என்று நினைத்தால்
  rationale: δοκεῖ இங்கு ஒருவரின் சுயமதிப்பீட்டைக் குறிக்கிறது; ‘நினைத்தால்’ என்பது அதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களில்
  rationale: கொரிந்து விசுவாசக் குழுவுக்குள் உள்ள ஒருவரைக் குறிக்கும் கிரேக்கத் தொடரின் சுருக்கமான, இயல்பான இணை.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: இந்தக் காலத்தில்
  rationale: αἰών என்பதன் காலகட்டப் பொருளைப் பாதுகாத்து, ‘உலகம்’ என்று விரிவுபடுத்துவதைத் தவிர்க்கிறது; தரநிலையின்படி என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μωρὸς γενέσθω
  choice: மூடராக ஆகட்டும்
  rationale: மூலத்தின் முரண்பாட்டுத் தாக்கத்தையும் ‘ஆகுதல்’ என்ற γενέσθω வின் பொருளையும் பாதுகாக்கிறது; பெயரடை/பெயர்ச்சொல் நுணுக்கத்திற்கான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἵνα γένηται σοφός
  choice: அவர் ஞானியாகும்படி
  rationale: ἵνα அறிமுகப்படுத்தும் நோக்கக் கூறைச் சுருக்கமாகப் பாதுகாத்து, ‘மூடராகி ஞானியாதல்’ என்ற பவுலின் திட்டமிட்ட முரண்பாட்டை நிலைநிறுத்துகிறது.
theological_decisions:
- issue: αἰών என்பதன் பொருள்
  choice: ‘இந்தக் காலத்தில்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இந்த உலகத்தில்’ அல்லது ‘இந்தக் காலத்தின் அளவுகோலின்படி’
  rationale: பவுலின் வாதத்தில் தற்போதைய காலகட்டத்தின் ஞானத்துக்கும் தேவனுடைய ஞானத்துக்கும் இடையிலான வேறுபாடு முக்கியம். ‘காலம்’ என்பது காலகட்ட நுணுக்கத்தைப் பாதுகாக்கிறது; அளவுகோல் சார்ந்த வாசிப்பு உண்மையான சாத்தியமாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: மூலத்தின் ஆண்பால் ஒருமையும் தமிழின் பொதுப்பால் பயன்பாடும்
  choice: தொடர்ச்சியான ஒருமையைக் காக்க ‘அவர்’ பயன்படுத்தப்பட்டது.
  alternative: ‘அந்த நபர்’ அல்லது பன்மை வடிவில் மறுசீரமைத்தல்
  rationale: கிரேக்கத்தின் பிரதிநிதித்துவ ஒருமையைத் தக்கவைத்து, தமிழில் மரியாதையானதும் ஆண்களுக்கும் பெண்களுக்கும் பொதுவாகப் பயன்படுத்தக்கூடியதுமான இயல்பான வடிவை அளிக்கிறது.
- issue: μωρός என்பதன் முரண்பாட்டுத் தீவிரம்
  choice: ‘மூடராக’ என்ற வலுவான சொல்லாக்கம் பயன்படுத்தப்பட்டது.
  alternative: ‘மூடத்தனமானவராக’
  rationale: பவுல் திட்டமிட்டு கூறும் அதிர்ச்சியூட்டும் முரண்பாட்டை மெலிதாக்காமல் காக்கிறது; இருப்பினும் அதை நிலையான ஆன்மிக அடையாளமாக விளக்கிச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. மூலத்தின் கட்டளை, சுயஏமாற்ற எச்சரிக்கை, மற்றும் ‘மூடராகி ஞானியாதல்’ என்ற இறையியல் பதற்றம் விளக்கிப் போக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
