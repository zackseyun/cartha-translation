id: 1CO.3.11
reference: 1 Corinthians 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: ta
  text: ஏனெனில், ஏற்கெனவே அமைக்கப்பட்டுள்ள அடித்தளத்தைத் தவிர வேறோர் அடித்தளத்தை யாராலும் அமைக்க முடியாது; அந்த அடித்தளம் இயேசுவே மேசியா[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “இயேசு கிறிஸ்து.”'
    reason: Χριστός என்பதற்கான தமிழில் பரவலாக அறியப்பட்ட பாரம்பரிய வடிவம்.
lexical_decisions:
- source_word: θεμέλιον
  choice: அடித்தளம்
  rationale: கட்டடம் கட்டும் உருவகத்தைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பை வெளிப்படுத்துகிறது.
- source_word: ἄλλον
  choice: வேறோர்
  rationale: ஏற்கெனவே உள்ள அடித்தளத்துக்கு மாற்றான இன்னொரு அடித்தளம் என்ற பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: οὐδεὶς δύναται
  choice: யாராலும் முடியாது
  rationale: திறன் அல்லது சாத்தியத்தை முற்றாக மறுக்கும் கிரேக்கச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: θεῖναι
  choice: அமைக்க
  rationale: அடித்தளம் என்ற பெயர்ச்சொல்லுடன் நவீனத் தமிழில் இயல்பாக இணையும் கட்டுமானச் சொல்.
- source_word: παρὰ τὸν κείμενον
  choice: ஏற்கெனவே அமைக்கப்பட்டுள்ள அடித்தளத்தைத் தவிர
  rationale: παρά என்பதன் விலக்கும் பொருளையும், κεῖμαι என்பதன் ஏற்கெனவே நிலைநிறுத்தப்பட்டுள்ள விளைவு நிலையையும் வெளிப்படுத்துகிறது.
- source_word: ὅς ἐστιν
  choice: அந்த அடித்தளம் …
  rationale: முன்னுள்ள ‘அடித்தளம்’ என்பதையே சுட்டும் தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் மீண்டும் எடுத்துரைக்கிறது.
- source_word: Ἰησοῦς Χριστός
  choice: இயேசுவாகிய மெசியா
  rationale: Ἰησοῦς என்பதைப் பெயராக ஒலிபெயர்த்தும், Χριστός என்பதன் பட்டப்பெயர் தன்மையை ‘மெசியா’ எனக் காட்டியும், இரண்டிற்கும் இடையிலான அடையாள உறவை ‘ஆகிய’ மூலம் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Ἰησοῦς Χριστός என்பதில் Χριστός-ஐ மொழிபெயர்த்தல்
  choice: இயேசுவாகிய மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இங்கு Χριστός வெறும் குடும்பப்பெயராக அல்லாமல் இயேசுவின் மெசியா பட்டத்தைத் தாங்குகிறது. எனவே அந்தப் பட்டப்பொருள் முதன்மை உரையில் வெளிப்படுத்தப்பட்டு, தமிழில் பரவலாக அறியப்பட்ட பாரம்பரிய வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: அடித்தளமும் இயேசுவும் ஒன்றென அடையாளப்படுத்துதல்
  choice: அந்த அடித்தளம் இயேசுவாகிய மெசியா
  alternative: அது இயேசுவாகிய மெசியா
  rationale: கிரேக்க உறவுப்பெயர் அடித்தளத்தையே சுட்டுகிறது; பெயர்ச்சொல்லை மீண்டும் கூறுவது கட்டுமான உருவகத்தையும் அடையாளப்படுத்துதலையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் ‘அடித்தளம்’ மற்றும் ‘அமைக்க’ பயன்படுத்தப்பட்டுள்ளன. வசனத்தின் விளக்கத் தொடர்பு ‘ஏனெனில்’ மூலம் காக்கப்பட்டுள்ளது; கட்டுமான உருவகமும் இறையியல் அடையாளப்படுத்துதலும் சீரிய, இயல்பான நடையில் பாதுகாக்கப்பட்டுள்ளன.
