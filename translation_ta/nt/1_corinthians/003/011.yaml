- from: ஏனெனில், ஏற்கெனவே அமைக்கப்பட்டுள்ள அடித்தளத்தைத் தவிர வேறோர் அடித்தளத்தை யாராலும் அமைக்க முடியாது; அந்த அடித்தளம் இயேசுவாகிய மெசியா[a].
  to: ஏனெனில், ஏற்கெனவே அமைக்கப்பட்டுள்ள அடித்தளத்தைத் தவிர வேறோர் அடித்தளத்தை யாராலும் அமைக்க முடியாது; அந்த அடித்தளம் இயேசுவே மேசியா[a].
