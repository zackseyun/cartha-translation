id: 1CO.3.17
reference: 1 Corinthians 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: ta
  text: ஒருவன் கடவுளின் ஆலயத்தை அழித்தால்[a], கடவுள் அவனை அழிப்பார். ஏனெனில் கடவுளின் ஆலயம் பரிசுத்தமானது; அந்த ஆலயம் நீங்கள்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழித்தால்’ என்பதற்குப் பதிலாக ‘கெடுத்தால்’ அல்லது ‘தீட்டுப்படுத்தினால்’ என்றும், அதற்கேற்ப அடுத்த இடத்திலும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நீங்கள்’ என்பது பன்மை. பவுல் சபைச் சமூகத்தைக் கூட்டாகக் கடவுளின் ஆலயம் என்று அடையாளப்படுத்துகிறார்.
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: ஆலயம்
  rationale: கடவுள் வாசம்செய்யும் பரிசுத்த இடத்தைக் குறிக்கும் சொல்லாக, நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருப்பதால் ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: φθείρει / φθερεῖ
  choice: அழித்தால் / அழிப்பார்
  rationale: ஒரே கிரேக்க வினைச்சொல் இருமுறை வருவதைக் காக்கவும் எச்சரிக்கையின் கடுமையைத் தக்கவைக்கவும் இரு இடங்களிலும் ‘அழி’ பயன்படுத்தப்பட்டது; ‘கெடுத்தல்’ அல்லது ‘தீட்டுப்படுத்துதல்’ என்பதும் சூழலில் சாத்தியம்.
- source_word: τοῦτον
  choice: அவனை
  rationale: τις என்பதைக் குறித்துத் திரும்பச் சுட்டும் ஒருமைத் தனிநபர் குறிப்பை நேரடியாகத் தக்கவைக்கிறது.
- source_word: ἅγιος
  choice: பரிசுத்தமானது
  rationale: கடவுளுக்கெனப் பிரித்துவைக்கப்பட்ட தூய்மையையும் புனிதத்தன்மையையும் தக்கவைக்கும் வழக்கமான வேதாகமத் தமிழ் சொல்.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: அந்த ஆலயம் நீங்கள்தான்
  rationale: வாசகர்களையே முன் குறிப்பிடப்பட்ட ஆலயமாக அடையாளப்படுத்தும் கிரேக்கத் தொடரை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: பன்மை வடிவத்தை வெளிப்படையாகக் காக்கிறது; ஒருமையான ‘ஆலயம்’ என்பதோடு பன்மையான சபைச் சமூகத்தை இணைக்கிறது.
theological_decisions:
- issue: கடவுளின் ஆலயம் என்பது முதன்மையாகத் தனிப்பட்ட விசுவாசியையா அல்லது சபைச் சமூகத்தையா குறிக்கிறது?
  choice: இங்கு பன்மையான ‘நீங்கள்’ ஒருமையான ‘ஆலயம்’ என்பதோடு இணைவதால், சபைச் சமூகமே கூட்டாகக் கடவுளின் ஆலயம் என்பது முதன்மைப் பொருள்.
  alternative: விரிவான வேதாகம இறையியலின் அடிப்படையில் இதைத் தனிப்பட்ட விசுவாசிக்கும் பொருத்திப் புரிந்துகொள்வது உண்டு.
  rationale: கிரேக்க இலக்கணமும் 1 கொரிந்தியர் 3-ஆம் அதிகாரத்தின் சமூகச் சூழலும் கூட்டுப் பொருளையே இயல்பாகச் சுட்டுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. வினைச்சொல் மறுபயன்பாடும் ஒருமை ‘ஆலயம்’—பன்மை ‘நீங்கள்’ அமைப்பும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
