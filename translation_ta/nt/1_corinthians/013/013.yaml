id: 1CO.13.13
reference: 1 Corinthians 13:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: ta
  text: இப்போதோ[a] விசுவாசம்[b], நம்பிக்கை, அன்பு ஆகிய இம்மூன்றும் நிலைத்திருக்கின்றன[c]. இவற்றில் மிகப் பெரியது அன்பு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆனால் இப்போது’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க இணைப்புச் சொல் தொடர்ச்சியையோ மாறுபாட்டையோ உணர்த்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘விசுவாசம்’ என்பதை இங்கு விரிவான பொருளில் ‘நம்புதல்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘தொடர்ந்து இருக்கின்றன’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: இப்போதோ
  rationale: νυνί என்பதன் ‘இப்போது’ என்ற காலச் சுட்டையும், δέ தரும் மென்மையான தொடர்ச்சி அல்லது மாறுபாட்டையும் ‘இப்போதோ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μένει
  choice: நிலைத்திருக்கின்றன
  rationale: μένω இங்கு மறைந்துபோகாமல் தொடர்ந்து இருப்பதைக் குறிக்கிறது. தமிழில் மூன்று எழுவாய்களுக்கு ஏற்ப பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இந்தப் பவுலின் மூவகைத் தொகுப்பில் πίστις என்பதற்கான நிலைபெற்ற, தெளிவான தமிழ் சொல் ‘விசுவாசம்’; இது அடுத்துள்ள ἐλπίς என்பதற்குப் பயன்படுத்தப்படும் ‘நம்பிக்கை’ என்பதிலிருந்தும் வேறுபாட்டைக் காக்கிறது.
- source_word: ἐλπίς
  choice: நம்பிக்கை
  rationale: பவுலின் பயன்பாட்டில் ἐλπίς எதிர்கால நன்மையை நம்பிக்கையுடன் எதிர்பார்ப்பதைக் குறிக்கிறது; ‘நம்பிக்கை’ என்பது இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: ἀγάπη
  choice: அன்பு
  rationale: ἀγάπη என்பதன் பரந்த, தன்னலமற்ற அன்புப் பொருளை மதப்பிரிவு சாராத இயல்பான தமிழில் ‘அன்பு’ தெளிவாகத் தருகிறது.
- source_word: τὰ τρία ταῦτα
  choice: ஆகிய இம்மூன்றும்
  rationale: முன் பட்டியலிடப்பட்ட மூன்றையும் சுட்டும் கிரேக்கச் சொற்றொடரின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: μείζων δὲ τούτων
  choice: இவற்றில் மிகப் பெரியது
  rationale: μείζων வடிவில் ஒப்பீட்டுச் சொல் என்றாலும், மூன்றின் தொகுப்புக்குள் அன்பை உயர்ந்ததாகக் காட்டுவதால் தமிழில் மிகையுருவாக மொழிபெயர்ப்பது பொருளைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: πίστις என்பதன் இறையியல் சார்ந்த பொருள்
  choice: விசுவாசம்
  alternative: நம்புதல்; நம்பகத்தன்மை
  rationale: விசுவாசம், நம்பிக்கை, அன்பு என்ற மூவகைத் தொகுப்பு இங்கு ‘விசுவாசம்’ என்ற பொருளை வலுவாக ஆதரிக்கிறது. ‘நம்பகத்தன்மை’ என்ற பொருளைச் சூழல் வேண்டுவதில்லை; ‘நம்புதல்’ என்பது சாத்தியமான விரிவுரை என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: மூன்றில் அன்பின் ஒப்பீட்டு நிலை
  choice: இவற்றில் மிகப் பெரியது அன்பு
  alternative: இவற்றைவிடப் பெரியது அன்பு
  rationale: கிரேக்க ஒப்பீட்டுருவை மூன்று உறுப்புகளுக்குள் உயர்ந்த ஒன்றை அடையாளப்படுத்தும் இயல்பான தமிழ் மிகையுருவாக வழங்குகிறது; அன்பை மற்ற இரண்டிலிருந்து பிரித்து எதிரியாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘விசுவாசம், நம்பிக்கை, அன்பு’ என்ற பரவலாக அறியப்பட்ட மூவகைச் சொல்லாக்கம் காக்கப்பட்டுள்ளது; ‘நிலைத்திருக்கின்றன’ என்பது முந்தைய வசனங்களில் மறைந்துபோகும் வரங்களுடன் உள்ள எதிர்மறை ஒப்புமையை உணர்த்துகிறது.
