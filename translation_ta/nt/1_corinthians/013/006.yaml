  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: ta
  text: அன்பு அநீதியில்[a] மகிழ்வதில்லை; மாறாக, உண்மையோடு சேர்ந்து மகிழ்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீச்செயலில்” அல்லது “நியாயக்கேட்டில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உண்மையில் மகிழ்கிறது.” கிரேக்கக் கூட்டு வினை, உண்மையோடு மகிழ்ச்சியைப் பகிர்ந்துகொள்வதையோ உண்மையை முன்னிட்டு மகிழ்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: மகிழ்வதில்லை
  rationale: χαίρω என்பது மகிழ்வதையோ மகிழ்ச்சி கொள்வதையோ குறிக்கிறது. தமிழில் இயல்பான ‘மகிழ்’ என்பதைத் தேர்ந்தெடுத்து, συγχαίρει என்பதுடனான வினைச்சொல் இணைநிலையும் காக்கப்பட்டுள்ளது.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: அநீதியில்
  rationale: χαίρω என்பதுடன் வரும் ἐπί + வேற்றுமை உருபு, மகிழ்ச்சிக்கான அடிப்படை அல்லது நிகழ்வைக் குறிக்கலாம். ἀδικία என்பதன் பரந்த அறநெறி மற்றும் பவுலின் இறையியல் பொருளை ‘அநீதி’ காக்கிறது; ‘-இல்’ என்பது அதில் இன்பம் காணும் கருத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: συγχαίρει
  choice: சேர்ந்து மகிழ்கிறது
  rationale: συν- முன்னொட்டு பகிர்ந்துகொள்ளும் அல்லது உடன்சேர்ந்து மகிழும் கருத்தைத் தருகிறது. ‘சேர்ந்து மகிழ்கிறது’ அந்தக் கூறை வெளிப்படையாகக் காத்து, முந்தைய ‘மகிழ்’ என்பதுடனான இணைநிலையையும் பேணுகிறது.
- source_word: δὲ
  choice: மாறாக
  rationale: δέ இங்கு அன்பு செய்யாததற்கும் செய்வதற்கும் இடையிலான முரண்பாட்டைக் குறிக்கிறது. தமிழில் ‘மாறாக’ அந்த எதிர்மறைத் திருப்பத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: τῇ ἀληθείᾳ
  choice: உண்மையோடு
  rationale: ἀλήθεια என்பது உண்மை, உண்மைத்தன்மை, அல்லது உண்மையானது என்ற பரப்பைக் கொண்டது. ‘உண்மை’ அதன் கருத்துச் செறிவை வரையறுக்காமல் காக்கிறது; ‘-ஓடு’ συγχαίρει என்பதிலுள்ள உடன்சேர்ந்த மகிழ்ச்சியை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் அறநெறி எதிரிணையில் ἀδικία என்பதன் மொழிபெயர்ப்பு
  choice: அநீதி
  alternative: தீச்செயல்; நியாயக்கேடு
  rationale: இங்கு ἀδικία என்பது தனிப்பட்ட ஒரு தவறான செயலையோ சமூக அநியாயத்தை மட்டுமோ விடப் பரந்த அறநெறி எதிர்மையைச் சுட்டுகிறது. ‘அநீதி’ அந்தப் பரந்த அறநெறி-இறையியல் எடையைக் காக்கிறது.
- issue: συγχαίρει τῇ ἀληθείᾳ என்பதில் உள்ள உறவு
  choice: உண்மையோடு சேர்ந்து மகிழ்கிறது
  alternative: உண்மையில் மகிழ்கிறது
  rationale: கூட்டு வினையின் συν- கூறு ‘உடன்/சேர்ந்து’ என்ற பகிர்ந்த மகிழ்ச்சியை ஆதரிக்கிறது. இருப்பினும் உண்மையை முன்னிட்டு அல்லது உண்மையில் மகிழ்தல் என்ற புரிதலும் இலக்கணரீதியாகச் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் எழுவாய் வெளிப்படையாக இல்லாவிட்டாலும், தொடர்ச்சியான சூழலில் எழுவாய் ‘அன்பு’ என்பதால் வாசகத் தெளிவுக்காக அது வெளிப்படுத்தப்பட்டுள்ளது. ‘மகிழ்’ என்ற ஒரே வேர்ச்சொல் இரு கூறுகளிலும் பயன்படுத்தப்பட்டு மூலத்தின் சொல்லிணைவு காக்கப்பட்டுள்ளது.
