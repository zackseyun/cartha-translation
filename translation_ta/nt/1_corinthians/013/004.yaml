id: 1CO.13.4
reference: 1 Corinthians 13:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: ta
  text: அன்பு பொறுமை காக்கிறது; அன்பு கனிவுடன் நடந்துகொள்கிறது. அன்பு[a] பொறாமைப்படுவதில்லை[b]; தன்னைப் பெருமைப்படுத்துவதில்லை; தற்பெருமையால் வீங்குவதில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கிரேக்கக் கையெழுத்துப்பிரதிகளில் இங்கு மூன்றாவது முறையாக வரும் ‘அன்பு’ இடம்பெறவில்லை.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘பொறாமைகொள்வதில்லை.’ கிரேக்க வினைச்சொல் நல்ல ஆர்வத்தையோ எதிர்மறையான பொறாமையையோ குறிக்கலாம்; இங்குள்ள எதிர்மறைச் சூழல் பொறாமை என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘இறுமாப்படைவதில்லை.’ கிரேக்கத்தில் அகந்தையால் ஊதிப்பெரிதாவதைச் சுட்டும் உருவகம் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: அன்பு
  rationale: இச்சொல் இங்கு தன்னலமற்ற, பிறர்நோக்கிய அன்பைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பானதும் பரந்த பொருளுடையதுமான இணைச்சொல் ‘அன்பு’.
- source_word: μακροθυμεῖ
  choice: பொறுமை காக்கிறது
  rationale: மற்றவர்களிடம் நீடித்த பொறுமையையும் சகிப்புத்தன்மையையும் காட்டும் வினைச்செயலை இது வெளிப்படுத்துகிறது; ‘பொறுமை காக்கிறது’ என்பது தமிழில் இயல்பாகவும் செயல்முகமாகவும் உள்ளது.
- source_word: χρηστεύεται
  choice: கனிவுடன் நடந்துகொள்கிறது
  rationale: வெறும் பண்பைக் குறிப்பிடாமல், தயவோடும் நன்மையோடும் செயல்படுவதை இந்த அரிய வினை குறிக்கிறது; அதனால் செயல்சார்ந்த மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: ζηλοῖ
  choice: பொறாமைப்படுவதில்லை
  rationale: இந்த எதிர்மறைச் சூழலில், நல்ல ஆர்வம் என்பதைக் காட்டிலும் பிறருடைய நன்மையை விரும்பாமல் பொறாமைப்படுதல் என்ற பொருளே பொருத்தமானது.
- source_word: περπερεύεται
  choice: தன்னைப் பெருமைப்படுத்துவதில்லை
  rationale: தன்னை வெளிக்காட்டிப் புகழ்ந்து பேசுதல் அல்லது தற்பெருமை பாராட்டுதல் என்ற கருத்தைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: φυσιοῦται
  choice: தற்பெருமையால் வீங்குவதில்லை
  rationale: அகந்தையால் ஊதிப்பெரிதாதல் என்ற பவுலின் உருவகத்தைத் தமிழிலும் இயன்றவரை தக்கவைக்கிறது.
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: அன்பு ... அன்பு ... அன்பு
  rationale: மூலத்தின் வலியுறுத்தும் மீளுரைப்பைத் தக்கவைக்கிறது; மூன்றாவது இடம்பெற்றுள்ள சொல் உரைவேறுபாட்டுக்குரியது என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: οὐ
  choice: இல்லை / -வதில்லை
  rationale: தொடர்ச்சியான மறுப்புகளை நவீனத் தமிழின் இயல்பான எதிர்மறை வினைமுற்றுகளால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀγάπη என்பதன் மொழிபெயர்ப்பு
  choice: அன்பு
  alternative: தன்னலமற்ற அன்பு
  rationale: ‘அன்பு’ மூலச்சொல்லின் பரந்த நெறியியல் மற்றும் உறவுசார் பொருளைச் சுருக்காமல் காக்கிறது; ‘தன்னலமற்ற’ என்பதை உரையிலேயே சேர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைப் புகுத்தும்.
- issue: φυσιοῦται என்ற உருவகத்தைத் தக்கவைத்தல்
  choice: தற்பெருமையால் வீங்குவதில்லை
  alternative: இறுமாப்படைவதில்லை
  rationale: மாற்று மொழியாக்கம் பொருளைத் தெளிவாக்கினாலும், தேர்ந்தெடுக்கப்பட்ட வாசகம் அகந்தையை ஊதிப்பெரிதாதலாகக் காட்டும் பவுலின் உருவகத்தையும் அதன் இறையியல் எச்சரிக்கையையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அன்பைச் செயல்படும் ஒருவரைப் போலச் சித்தரிக்கும் மூலத்தின் இலக்கண வடிவமும், தொடர்ச்சியான மறுப்புகளின் ஓசையும், இறுதிக் கூறிலுள்ள ‘வீங்குதல்’ உருவகமும் தக்கவைக்கப்பட்டுள்ளன.
