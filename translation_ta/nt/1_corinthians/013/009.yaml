id: 1CO.13.9
reference: 1 Corinthians 13:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκ μέρους ⸀γὰρ γινώσκομεν καὶ ἐκ μέρους προφητεύομεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/009.yaml
  text: For we know in part[a], and we prophesy in part.
translation:
  language: ta
  text: ஏனெனில், நாம் ஓரளவே[a] அறிகிறோம்; ஓரளவே தீர்க்கதரிசனம் உரைக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஓரளவே’ என்பதை ‘பகுதியளவே’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க மரபுத்தொடர் சொற்சொல்லாக ‘ஒரு பகுதியிலிருந்து’ என்று உள்ளது; வலியுறுத்துவதற்காக அது இரண்டு கூறுகளிலும் திரும்ப வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: ஓரளவே
  rationale: இந்தக் கிரேக்க மரபுத்தொடர் ‘பகுதியளவில்’ அல்லது ‘முழுமையின்றி’ என்ற பொருளைத் தருகிறது. ‘ஓரளவே’ என்பது இயல்பான நவீனத் தமிழில் வரம்பைத் தெளிவாகக் காட்டுவதோடு, அடுத்த சூழலில் வரும் முழுமையுடனான முரண்பாட்டையும் காக்கிறது. இரு கூறுகளிலும் இதே சொல்லைத் திரும்ப வழங்குவது மூலத்தின் இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றை விளக்கும் காரணத் தொடர்பை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: γινώσκομεν
  choice: அறிகிறோம்
  rationale: γινώσκω என்பதன் நேரடியான அறிவுசார் பொருளைக் காக்கிறது; ‘புரிந்துகொள்கிறோம்’ என்று பொருளைத் தேவையின்றி விரிவுபடுத்தவில்லை.
- source_word: καὶ
  choice: ;
  rationale: இரண்டு இணையான கூறுகளின் தொடர்பு தமிழில் அரைப்புள்ளியால் இயல்பாக வெளிப்படுகிறது; தொடர்ச்சியும் சமச்சீரும் பாதுகாக்கப்படுகின்றன.
- source_word: προφητεύομεν
  choice: தீர்க்கதரிசனம் உரைக்கிறோம்
  rationale: ஆவிக்குரிய வரங்களைப் பற்றிய சூழலில், எதிர்காலத்தை முன்னறிவிப்பது அல்லது பொதுவாகப் பிரசங்கிப்பது என்ற ஒரே பொருளுக்குள் சொல்லைக் குறுக்காமல், தீர்க்கதரிசன உரையின் பரந்த பொருளைக் காக்கிறது.
theological_decisions:
- issue: சபையில் தீர்க்கதரிசனச் செயலின் பொருள்
  choice: ‘தீர்க்கதரிசனம் உரைக்கிறோம்’ என்று பரந்த பொருளில் வழங்குதல்
  alternative: ‘எதிர்காலத்தை முன்னறிவிக்கிறோம்’ அல்லது ‘பிரசங்கிக்கிறோம்’
  rationale: உடனடிச் சூழல் ஆவிக்குரிய வரங்களைப் பற்றியது. προφητεύω என்பது வெறும் எதிர்கால முன்னறிவிப்பை விடப் பரந்த தீர்க்கதரிசனப் பேச்சைக் குறிக்கலாம். எனவே விவாதத்திற்குரிய இறையியல் பொருளை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் மூலத்தின் விரிவை வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘ஓரளவே’ என்ற இயல்பான சொல் இருமுறை பயன்படுத்தப்பட்டு மூலத்தின் வலியுறுத்தலும் இணை அமைப்பும் காக்கப்பட்டுள்ளன.
