id: 1CO.13.8
reference: 1 Corinthians 13:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: ta
  text: அன்பு ஒருபோதும் தோல்வியடைவதில்லை[a]. ஆனால் தீர்க்கதரிசனங்களோ நீக்கப்படும்; மொழிகளோ[b] ஓய்ந்துபோகும்; அறிவோ நீக்கப்படும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அன்பு ஒருபோதும் வீழ்வதில்லை” அல்லது “அன்பு ஒருபோதும் முடிவுக்கு வருவதில்லை.”
    reason: lexical_alternative
  - marker: b
    text: “மொழிகள்” என்பதற்கு, “நாவுகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: c
    text: “நீக்கப்படும்” என்று மொழிபெயர்க்கப்பட்டுள்ள அதே கிரேக்க வினை தீர்க்கதரிசனங்களைப் பற்றிய கூறிலும் அறிவைப் பற்றிய கூறிலும் வருகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: அன்பு
  rationale: பவுலின் பரந்த பொருளுடைய சொல்லை இயல்பான, பொதுவாகப் புரியும் தமிழில் தருகிறது.
- source_word: οὐδέποτε
  choice: ஒருபோதும் … இல்லை
  rationale: முழுமையான கால மறுப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: πίπτει
  choice: தோற்பதில்லை
  rationale: இங்கு இடரீதியான ‘விழுதல்’ என்பதைக் காட்டிலும் அன்பின் நிலைத்த தன்மையைக் குறிக்கும் சூழல்சார் பொருளைத் தருகிறது; பின்னர் வரும் நிறுத்தத்தைக் குறிக்கும் வினைகளுடன் இதை ஒன்றாக்கவில்லை.
- source_word: εἴτε δὲ
  choice: ஆனால் … -ஓ
  rationale: δὲ-யின் எதிர்மறைத் திருப்பையும், மூன்று இணையான εἴτε கூறுகளின் ‘இதுவோ/அதுவோ’ அமைப்பையும் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: προφητεῖαι
  choice: தீர்க்கதரிசனங்கள்
  rationale: தீர்க்கதரிசனச் செய்திகளையோ தீர்க்கதரிசனம் உரைக்கும் செயல்களையோ குறிக்கக்கூடிய வழக்கமான வேதாகமத் தமிழ் சொல்.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: நீக்கப்படும்
  rationale: இரு இடங்களிலும் ஒரே கிரேக்க வினை வந்திருப்பதை ஒரே தமிழ்ச் சொல்லால் காட்டுகிறது; முற்றாக அழித்தல் என்ற தேவையற்ற வலிமையைச் சேர்க்காமல், பயன்பாட்டிலிருந்து அகற்றப்படுதலைக் குறிக்கிறது.
- source_word: γλῶσσαι
  choice: மொழிகள்
  rationale: γλῶσσα என்பதன் பொருளை நவீன வாசகருக்கு இயல்பாகத் தருகிறது; இவை இயற்கை மொழிகளா அல்லது குறிப்பிட்ட ஆவிக்குரிய நிகழ்வா என்ற விவாதத்தைத் தீர்மானிக்கவில்லை.
- source_word: παύσονται
  choice: ஓய்ந்துபோகும்
  rationale: ‘நிறுத்தப்படும்’ என்ற சுற்றியுள்ள passive வினையிலிருந்து வேறுபட்ட, தானாக ஓய்வதைச் சுட்டும் நடுநிலை வடிவத்தின் நுணுக்கத்தை இயல்பாகக் காட்டுகிறது.
- source_word: γνῶσις
  choice: அறிவு
  rationale: அடுத்த வசனங்களில் வரும் பகுதியான அறிதலோடு தொடர்பைக் காக்கும் வழக்கமான பவுலியச் சொல்.
theological_decisions:
- issue: πίπτει என்பதன் பொருள்
  choice: அன்பு ஒருபோதும் தோற்பதில்லை
  alternative: அன்பு ஒருபோதும் வீழ்வதில்லை / அன்பு ஒருபோதும் முடிவுக்கு வருவதில்லை
  rationale: சூழல் அன்பின் நிலைத்த தன்மையையும் வரங்கள் ஓய்வதையும் வேறுபடுத்துகிறது. தேர்ந்த மொழிபெயர்ப்பு அன்பின் நம்பகத்தன்மையைத் தெரிவிக்கிறது; அதேவேளை πίπτει-ஐ பின்னர் வரும் நிறுத்த வினைகளுக்கு ஒப்பாக்கவில்லை.
- issue: γλῶσσαι என்பதன் சூழல்சார் பொருள்
  choice: மொழிகள்
  alternative: நாவுகள்
  rationale: 1 கொரிந்தியர் 12–14-இல் இது சிறப்பான ஆவிக்குரிய நிகழ்வைக் குறிக்கிறது. ‘மொழிகள்’ என்பது புரியக்கூடிய நவீன வடிவம்; அந்த நிகழ்வின் துல்லிய இயல்பைப் பற்றிய இறையியல் விவாதத்தை மொழிபெயர்ப்பு தீர்ப்பதில்லை.
- issue: καταργέω மற்றும் παύω இடையிலான வேறுபாடு
  choice: நீக்கப்படும் / ஓய்ந்துபோகும்
  alternative: அனைத்தையும் ‘முடிவுக்கு வரும்’ என ஒரேபோல் மொழிபெயர்த்தல்
  rationale: மூலத்தில் உள்ள வேறு வினைகளையும், καταργέω-வின் இரு நிகழ்வுகளுக்கிடையிலான ஒருமைப்பாட்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான இணை அமைப்புடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தீர்க்கதரிசனம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் வைக்கப்பட்டுள்ளது; பழமையான ‘பாஷைகள்’ என்பதற்குப் பதில் ‘மொழிகள்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மூன்று கூறுகளுக்கிடையிலான ஒத்திசைவும் வினை வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
