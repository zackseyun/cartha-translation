reference: 1 Corinthians 13:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: ta
  text: எனக்குத் தீர்க்கதரிசனம் இருந்தாலும், எல்லா மறைபொருள்களையும் எல்லா அறிவையும் அறிந்திருந்தாலும், மலைகளை இடம்பெயரச் செய்யும் அளவுக்கு முழு விசுவாசம்[a] எனக்கு இருந்தாலும், அன்பு இல்லாவிட்டால், நான் ஒன்றுமில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழு நம்பிக்கை”; “முழு விசுவாசத்தன்மை” என்பதும் சாத்தியமான பொருள், ஆனால் இங்கு பொருந்துவது குறைவு. கிரேக்கச் சொல் பல பொருள்களைக் கொள்ளலாம்; இங்கு அது மலைகளை இடம்பெயரச் செய்யும் அசாதாரண விசுவாசத்தையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείαν
  choice: தீர்க்கதரிசன வரம்
  rationale: சொல்லின் பரந்த பொருளைப் பேணுவதோடு, ஆவிக்குரிய வரங்களைப் பற்றிய சூழலில் இயல்பான தமிழை வழங்குகிறது; தீர்க்கதரிசனப் பதவியை மட்டும் குறிப்பதாகக் குறுக்கவில்லை.
- source_word: εἰδῶ
  choice: அறிந்திருந்தாலும்
  rationale: மறைபொருள்களையும் அறிவையும் முழுமையாகக் கைவரப்பெற்றிருப்பதைக் குறிக்கும் கிரேக்க வினையின் அறிவுசார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μυστήρια
  choice: மறைபொருள்கள்
  rationale: முன்பு மறைந்திருந்த அல்லது வெளிப்படுத்தப்பட வேண்டிய உண்மைகள் என்ற பவுலின் பயன்பாட்டைத் தமிழில் புரியத்தக்கவாறு பேணுகிறது.
- source_word: γνῶσιν
  choice: அறிவு
  rationale: அறிதலைக் குறிக்கும் வினையிலிருந்து பெயர்ச்சொல்லை வேறுபடுத்தி, மூலத்தின் இணை அமைப்பைப் பேணுகிறது.
- source_word: πᾶσαν τὴν πίστιν
  choice: முழுமையான விசுவாசம்
  rationale: πᾶσαν என்பதன் முழுமையைக் காட்டும் இயல்பான தமிழாக்கம். இச்சூழலில் இது மலைகளை நகர்த்தும் அசாதாரண விசுவாசத்தைக் குறிக்கிறது.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: மலைகளை இடம்பெயரச் செய்யும் அளவுக்கு
  rationale: விளைவைக் குறிக்கும் ὥστε அமைப்பையும், அசாதாரண வல்லமையைச் சுட்டும் மலைகளை நகர்த்தும் உருவகத்தையும் பேணுகிறது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: நவீனத் தமிழில் தெளிவானதும் பரந்ததுமான சொல்; ἀγάπηயை ஒரு குறிப்பிட்ட வகைச் செயலாகச் சுருக்கவில்லை.
- source_word: οὐθέν εἰμι
  choice: நான் ஒன்றுமில்லை
  rationale: பவுலின் வலிமையான, நேரடியான சுயமறுப்பை விளக்கச் சேர்க்கையின்றி இயல்பாகப் பேணுகிறது.
theological_decisions:
- issue: அசாதாரண அற்புத ஆற்றலைக் குறிக்கும் சூழலில் πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை; நம்பகத்தன்மை
  rationale: இங்கு மலைகளை நகர்த்துவதோடு இணைக்கப்படுவதால் அசாதாரண விசுவாசமே மிக இயல்பான பொருள். πίστις என்பதற்கு ‘நம்பிக்கை’ என்றும், சில சூழல்களில் ‘நம்பகத்தன்மை’ என்றும் பொருள் இருக்கலாம்; ஆனால் பின்னையது இவ்வாக்கியத்தில் குறைவாகப் பொருந்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் மிகைப்படுத்தும் தொடர் அமைப்பும், இறுதியில் வரும் ‘நான் ஒன்றுமில்லை’ என்ற கூர்மையான முடிவும் பேணப்பட்டுள்ளன.
