id: 1CO.13.10
reference: 1 Corinthians 13:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ τὸ τέλειον, ⸀τὸ ἐκ μέρους καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: ta
  text: ஆனால், நிறைவானது[a] வரும்போது, பகுதியானது ஒழிக்கப்படும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூரணமானது,” “முழுமையானது,” அல்லது “முதிர்ச்சியானது.” “நிறைவானது” என்பதற்கான கிரேக்கச் சொற்றொடர் (τὸ τέλειον, to teleion) எதைக் குறிக்கிறது என்பது விவாதிக்கப்படுகிறது. இப்போதுள்ள பகுதியான நிலைக்கு மாறாக நிறைவு, முதிர்ச்சி, அல்லது இறுதிக்கால நிறைவேற்றம் என்று பலவாறு புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “ஒழிந்துபோகும்,” “கடந்துபோகும்,” அல்லது “முடிவுக்குக் கொண்டுவரப்படும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: வரும்போது
  rationale: எதிர்காலத்தில் எதிர்பார்க்கப்படும் நிகழ்வை அறிமுகப்படுத்தும் காலத் தொடர்; தமிழில் இயல்பாக ‘வரும்போது’ என வழங்கப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பகுதியான அறிவுக்கும் தீர்க்கதரிசனத்துக்கும் எதிராக மென்மையான வேறுபாட்டைக் குறிக்கிறது.
- source_word: ἔλθῃ
  choice: வரும்போது
  rationale: ὅταν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் எதிர்கால நிகழ்வைக் குறிக்கிறது; தமிழில் கால இணைப்பாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὸ τέλειον
  choice: நிறைவானது
  rationale: τέλειον என்பது நிறைவு பெற்றது, பூரணமானது, அல்லது முதிர்ச்சியடைந்தது எனப் பொருள்படலாம். நடுநிலை ஒருமை பெயராக்க வடிவத்தையும் பொருள் குறித்த திறந்த நிலையையும் ‘நிறைவானது’ காக்கிறது.
- source_word: τὸ ἐκ μέρους
  choice: பகுதியாக இருப்பது
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இச்சொற்றொடர் ‘பகுதியானது’ அல்லது ‘ஒரு பகுதி அளவில் இருப்பது’ என்பதைக் குறிக்கிறது; தமிழில் தெளிவுக்காக ‘பகுதியாக இருப்பது’ என வழங்கப்பட்டுள்ளது.
- source_word: καταργηθήσεται
  choice: ஒழிந்துபோகும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவம் செயலற்றதாக்கப்படுதல் அல்லது முடிவுக்குக் கொண்டுவரப்படுதல் என்னும் கருத்தைக் கொண்டது. ‘ஒழிந்துபோகும்’ அதன் முடிவுறுதலைத் தெளிவாகக் கூறினாலும் முற்றிலும் அழித்தொழித்தல் என்ற பொருளை வற்புறுத்தாது.
theological_decisions:
- issue: τὸ τέλειον என்பதன் குறிப்பு
  choice: குறிப்பிட்ட ஓர் இறையியல் விளக்கத்துடன் அடையாளப்படுத்தாமல் ‘நிறைவானது’ எனப் பொதுவாக வழங்கப்பட்டது.
  alternative: ‘பூரணமானது,’ ‘முழுமையானது,’ அல்லது ‘முதிர்ச்சியானது’; சிலர் இதை இறுதிக்கால நிறைவு, கிறிஸ்துவின் வருகை, நேருக்கு நேர் அறிதல், அல்லது வேதாகமத் தொகுப்பின் நிறைவு என்று விளக்குகின்றனர்.
  rationale: இந்த வசனத்திலுள்ள கிரேக்கச் சொற்றொடர் எதைக் குறிக்கிறது என்பதை வெளிப்படையாகக் கூறவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையையும் இறையியல் இழுபறியையும் காக்கிறது; எந்த ஒரு கொள்கை விளக்கத்தையும் முதன்மை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘நிறைவானது’—‘பகுதியாக இருப்பது’ என்ற எதிரிணை தெளிவாக வைக்கப்பட்டு, மூலத்தின் பொருள் குறித்த திறந்த நிலை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
