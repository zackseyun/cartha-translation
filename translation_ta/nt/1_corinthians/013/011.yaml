id: 1CO.13.11
reference: 1 Corinthians 13:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: ta
  text: நான் சிறு குழந்தையாக இருந்தபோது, சிறு குழந்தையைப்போல் பேசினேன்; சிறு குழந்தையைப்போல் சிந்தித்தேன்; சிறு குழந்தையைப்போல் பகுத்தறிந்தேன். நான் ஆணாக ஆனபோது, சிறு குழந்தைக்குரியவற்றை[a] விட்டொழித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குழந்தைத்தனமானவற்றை’ அல்லது ‘சிறு குழந்தையின் வழக்கங்களை.’ கிரேக்கத்தில் சொல்லுக்குச் சொல், ‘சிறு குழந்தைக்குரியவற்றை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: சிறு குழந்தை
  rationale: இச்சொல் வயதிலும் முதிர்ச்சியிலும் இளமையான குழந்தையைக் குறிக்கிறது. ‘குழந்தை’ என்பதைவிட ‘சிறு குழந்தை’ என்பது ἀνήρ என்பதுடனான முதிர்ச்சி வேறுபாட்டைத் தெளிவாக்குகிறது; ‘கைக்குழந்தை’ எனக் குறுகலாக்குவதையும் தவிர்க்கிறது.
- source_word: ἐλάλουν
  choice: பேசினேன்
  rationale: λαλέω என்பதன் இயல்பான பொருளைத் தெளிவாகத் தருகிறது; வசனத்தின் மூன்று இணைச் செயல்களின் ஓசையையும் காக்கிறது.
- source_word: ἐφρόνουν
  choice: சிந்தித்தேன்
  rationale: இங்கு எண்ணம் அல்லது மனப்பாங்கைக் குறிக்கும் φρονέω, அடுத்துள்ள λογίζομαι என்பதிலிருந்து வேறுபடும் வகையில் ‘சிந்தித்தேன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐλογιζόμην
  choice: பகுத்தறிந்தேன்
  rationale: விஷயங்களை ஆராய்ந்து கணித்தல் அல்லது காரணபூர்வமாக எண்ணுதல் என்ற நுணுக்கத்தைத் தருகிறது; ἐφρόνουν என்பதற்கான ‘சிந்தித்தேன்’ என்பதுடன் உள்ள வேறுபாட்டையும் பேணுகிறது.
- source_word: γέγονα
  choice: ஆனபோது
  rationale: முழுமைப் பாங்கிலுள்ள வினை ஒரு புதிய நிலைக்கு வந்ததைக் குறிக்கிறது. தமிழில் காலத்தைக் குறிக்கும் இவ்வாக்கிய அமைப்பில் ‘ஆனபோது’ இயல்பாக அந்த மாற்றத்தை வெளிப்படுத்துகிறது.
- source_word: ἀνήρ
  choice: ஆண்
  rationale: கிரேக்கச் சொல் இங்கு பொதுவான ‘முதிர்ந்தவர்’ என்பதற்குப் பதிலாக ஆண்பாலைக் குறிப்பாகக் கொண்டுள்ளது. பவுல் தன்னையே எடுத்துக்காட்டாகப் பேசும் உருவகத்தில் உள்ள பாலினத் துல்லியத்தை இது காக்கிறது.
- source_word: κατήργηκα
  choice: விட்டொழித்தேன்
  rationale: குழந்தைப் பருவத்துக்குரியவற்றை இனி தொடராமல் அகற்றிவிட்டதைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ் வடிவம்; ‘அழித்தேன்’ என்ற அளவுக்கு மிகைப்படுத்தாது.
- source_word: τὰ τοῦ νηπίου
  choice: சிறு குழந்தைக்குரியவை
  rationale: ‘சிறு குழந்தையுடையவை’ என்ற கிரேக்க அமைப்பின் பரந்த பொருளைப் பேணுகிறது; அதை ‘குழந்தைத்தனமானவை’ என்று எதிர்மறையாக மட்டும் விளக்கிவிடாமல் விடுகிறது.
theological_decisions:
- issue: ἀνήρ என்பதில் உள்ள பாலின வேறுபாடு
  choice: ஆண்
  alternative: முதிர்ந்தவர் / பெரியவர்
  rationale: மூலமொழி ஆண்பால் ஒருமையை வெளிப்படையாகப் பயன்படுத்துகிறது. பவுல் தன் குழந்தைப் பருவத்தையும் ஆணான நிலையையும் ஒப்பிடுவதால், ‘ஆண்’ என்பது மூலத்தின் துல்லியத்தைப் பேணுகிறது; இது ஆண்களின் மேன்மையைப் பற்றிய கோட்பாட்டுக் கூற்று அல்ல.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியும், அதேவேளை கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மும்மை இணை அமைப்பையும் மீளுரையையும் காக்க அரைப்புள்ளிகள் இடப்பட்டுள்ளன. ‘சிந்தித்தேன்’ மற்றும் ‘பகுத்தறிந்தேன்’ என்ற சொற்கள் இரண்டு கிரேக்க அறிவுசார் வினைகளின் நுண்ணிய வேறுபாட்டை வெளிப்படுத்துகின்றன.
