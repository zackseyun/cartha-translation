translation:
  language: ta
  text: அன்பு தகாத விதத்தில் நடந்துகொள்ளாது[a]; தன்னுடையதை நாடாது[b]; எரிச்சலடையாது[c]; தீங்கை கணக்கில் வைத்துக்கொள்ளாது[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒழுங்குக்குப் புறம்பாக நடந்துகொள்ளாது”; “மரியாதையற்ற விதத்தில் நடந்துகொள்ளாது.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லெழுத்தாக, “தன்னுடையவற்றை நாடாது”; அதாவது, சுயநலமாகச் செயல்படாது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தூண்டப்பட்டுக் கோபமடையாது.” “எளிதில் கோபமடையாது” என்றும் மொழிபெயர்க்கப்படுகிறது; ஆனால் “எளிதில்” என்பது கிரேக்க மூலத்தில் வெளிப்படையாக இல்லை.
    reason: alternative_reading
  - marker: d
    text: சொல்லெழுத்தாக, “தீமையைக் கணக்கிடாது.” இதை “செய்யப்பட்ட தீங்குகளுக்குக் கணக்கு வைத்திருக்காது” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: தகாத விதத்தில் நடந்துகொள்ளாது
  rationale: இச்சொல் ஒழுங்குக்கும் மரியாதைக்கும் பொருந்தாத, வெட்கக்கேடான நடத்தையைக் குறிக்கிறது. ‘முரட்டுத்தனமாக’ என்பது பொருளை வெறும் மரியாதையின்மையாகச் சுருக்கக்கூடும்; இத்தேர்வு அதன் பரந்த சமூக-நெறிப் பொருளைப் பாதுகாக்கிறது.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: தன்னுடையதை நாடாது
  rationale: ‘தனக்குரியவற்றை நாடுதல்’ என்ற கிரேக்க அமைப்பை நெருக்கமாகப் பிரதிபலித்து, சுயநல நோக்கைக் காட்டுகிறது; ‘தன் விருப்பத்தை வற்புறுத்தாது’ போன்ற விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: παροξύνεται
  choice: எரிச்சலடையாது
  rationale: கூர்மையாகத் தூண்டப்பட்டு எரிச்சல் அல்லது கோபம் அடைவதைக் குறிக்கும் நடப்பு/இடைத்தன்மை வடிவம். கிரேக்கத்தில் இல்லாத ‘எளிதில்’ என்ற தீவிரப்படுத்தலைச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: λογίζεται
  choice: கணக்கில் வைத்துக்கொள்ளாது
  rationale: கணக்கிடுதல் அல்லது கணக்குப் பதித்தல் என்ற உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது. வெறும் ‘நினைக்காது’ என்பதைக் காட்டிலும் கணக்கு வைத்திருக்கும் நுண்ணுணர்வை வெளிப்படுத்துகிறது.
- source_word: τὸ κακόν
  choice: தீங்கை
  rationale: குறிப்பிட்ட உறுப்புடன் வரும் ஒருமை வடிவம் தீமை அல்லது செய்யப்பட்ட தீங்கைக் குறிக்கலாம். இவ்வுறவுசார் சூழலில் ‘தீங்கு’ இயல்பானது; ஆனால் மூலத்தின் பரந்த ‘தீமை’ சாத்தியத்தை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: ἀγάπη (சூழலிலிருந்து தொடரும் எழுவாய்)
  choice: அன்பு
  rationale: தமிழில் இவ்வசனம் தனியே வாசிக்கப்படும்போதும் தெளிவாக இருக்க, முந்தைய சூழலிலிருந்து தொடரும் எழுவாயை வெளிப்படையாக மீண்டும் கூறுகிறது.
theological_decisions:
- issue: παροξύνεται என்பதில் மூலத்தில் இல்லாத ‘எளிதில்’ என்பதைச் சேர்க்க வேண்டுமா?
  choice: எரிச்சலடையாது
  alternative: எளிதில் கோபமடையாது
  rationale: கிரேக்க மூலத்தில் ‘எளிதில்’ என்பதற்கான வினையடை இல்லை. ஆகவே அன்பின் கூற்றைத் தளர்த்தவோ விளக்கமாகக் குறுக்கவோ செய்யாமல் எளிய வடிவம் வைக்கப்படுகிறது.
- issue: λογίζεται τὸ κακόν என்பதை ‘தவறுகளின் பட்டியல் வைத்திருக்காது’ என விரிவாக்க வேண்டுமா?
  choice: தீங்கை கணக்கில் வைத்துக்கொள்ளாது
  alternative: செய்யப்பட்ட தவறுகளைப் பதிவு செய்துவைத்துக்கொள்ளாது
  rationale: மூலத்தின் கணக்கியல் உருவகத்தையும் ஒருமை வடிவத்தையும் முடிந்தவரை காக்கிறது; அதேவேளை தமிழில் பொருள் புரியும் வகையில் உள்ளது. மாற்று வாசகம் பொருளை விளக்கினாலும் பன்மையையும் ‘பதிவு’ என்ற கூடுதல் கருத்தையும் சேர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. தொடர்ச்சியான மறுப்பு அமைப்பு காக்கப்பட்டுள்ளது. ‘தகாத விதத்தில்’, ‘தன்னுடையதை’ போன்ற சொற்றொடர்கள் மூலத்திற்கு நெருக்கமாகவும் இயல்பாகவும் வைக்கப்பட்டுள்ளன; தேவையான மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
