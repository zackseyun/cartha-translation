reference: 1 Corinthians 13:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: ta
  text: இப்போது நாம் கண்ணாடியின் வழியாகப் புதிராகக் காண்கிறோம்; அப்போதோ முகமுகமாகப் பார்ப்போம். இப்போது நான் ஓரளவே அறிகிறேன்; அப்போதோ, நான் முழுமையாக அறியப்பட்டிருப்பதுபோலவே, முழுமையாக அறிந்துகொள்வேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέπομεν
  choice: நாம் பார்க்கிறோம்
  rationale: நேரடியான பார்வை உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἄρτι
  choice: இப்போது
  rationale: τότε என்பதன் ‘அப்போது’ என்ற எதிர்நிலையுடன் கால வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: δι’ ἐσόπτρου
  choice: கண்ணாடியின் வழியாக
  rationale: διά உடன் வரும் உருபின் ‘வழியாக’ என்ற இடைமுகப் பொருளையும் கண்ணாடி உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ἐν αἰνίγματι
  choice: புதிரான விதத்தில்
  rationale: αἴνιγμα என்பதன் ‘புதிர், மறைபொருள்’ என்ற பெயர்ச்சொல் சார்ந்த பொருளைப் பாதுகாத்து, தமிழில் இயல்பாக அமைகிறது; வெறும் பார்வை மங்கலை மட்டும் குறிக்கவில்லை.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: முகமுகமாக
  rationale: நேரடியான, இடையீடற்ற சந்திப்பைக் குறிக்கும் நிலையான தமிழ் வழக்கு.
- source_word: γινώσκω ἐκ μέρους
  choice: நான் ஓரளவே அறிகிறேன்
  rationale: பகுதியளவான தற்போதைய அறிவை இயல்பாகவும் வலியுறுத்தலுடனும் தெரிவிக்கிறது.
- source_word: ἐπιγνώσομαι
  choice: முழுமையாக அறிந்துகொள்வேன்
  rationale: தற்போதைய பகுதியளவு அறிவுடன் உள்ள வேறுபாட்டை வெளிப்படுத்துகிறது; அதேவேளையில் எல்லாவற்றையும் அறியும் தெய்வீக சர்வஞானத்தை வலியுறுத்துவதில்லை.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: நான் முழுமையாக அறியப்பட்டிருப்பதுபோலவே
  rationale: முன்னைய வினையுடன் உள்ள சொல் ஒற்றுமையையும் கிரேக்கத்தில் அறிபவர் குறிப்பிடப்படாத செயப்பாட்டு வடிவத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: எதிர்கால ἐπιγνώσομαι குறிக்கும் அறிவின் அளவு
  choice: முழுமையாக அறிந்துகொள்வேன்
  alternative: எல்லாவற்றையும் அறிந்துகொள்வேன்
  rationale: வசனம் பகுதியளவான அறிவை நிறைவான அறிவுடன் எதிரெதிராக வைக்கிறது; ஆனால் விசுவாசி தெய்வீக சர்வஞானத்தைப் பெறுவார் என்று கூறுவதில்லை.
- issue: ἐπεγνώσθην என்ற செயப்பாட்டு வினையின் மறைமுகச் செய்பவர்
  choice: அறிபவர் யார் என்பதைச் சேர்க்காமல் ‘அறியப்பட்டிருப்பதுபோலவே’ என்று மொழிபெயர்த்தல்
  alternative: ‘தேவன் என்னை முழுமையாக அறிந்திருப்பதுபோலவே’ என்று செய்பவரை வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழலில் தேவன் அறிபவர் என்பது இயல்பான புரிதலாக இருந்தாலும், கிரேக்க வாசகம் செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை; அந்தத் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘கண்ணாடியின் வழியாக’ மற்றும் ‘புதிரான விதத்தில்’ ஆகியவை மூலத்தின் இரு தனித்த உருவகக் கூறுகளையும் தக்கவைக்கின்றன; ‘முகமுகமாக’ இயல்பான தமிழ் இணைச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
