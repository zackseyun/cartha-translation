revisions:
- from: இப்போது நாம் கண்ணாடியின் வழியாகப் புதிரான விதத்தில்[a] பார்க்கிறோம்; அப்போதோ முகமுகமாகப் பார்ப்போம். இப்போது நான் ஓரளவே அறிகிறேன்; அப்போதோ, நான் முழுமையாக அறியப்பட்டிருப்பதுபோலவே, முழுமையாக அறிந்துகொள்வேன்.
  to: இப்போது நாம் கண்ணாடியின் வழியாகப் புதிராகக் காண்கிறோம்; அப்போதோ முகமுகமாகப் பார்ப்போம். இப்போது நான் ஓரளவே அறிகிறேன்; அப்போதோ, நான் முழுமையாக அறியப்பட்டிருப்பதுபோலவே, முழுமையாக அறிந்துகொள்வேன்.
  rationale: ‘புதிரான விதத்தில்’ என்பதற்குப் பதிலாக ‘புதிராக’ என மாற்றப்பட்டுள்ளது. இதனால் ἐν αἰνίγματι என்பதன் பெயர்ச்சொல் உருவகமும் அதன் மறைபொருள்/புதிர்தன்மையும் தெளிவாகப் பாதுகாக்கப்படுகின்றன. மற்ற சொற்றொடர்கள் மூலத்திற்கு நம்பிக்கையானவையும் இயல்பான நவீன தரத் தமிழும் ஆக இருப்பதால் தக்கவைக்கப்பட்டுள்ளன.
