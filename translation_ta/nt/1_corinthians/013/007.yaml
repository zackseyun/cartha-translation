  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: ta
  text: எல்லாவற்றையும் தாங்கும்[a]; எல்லாவற்றையும் நம்பும்[b]; எல்லாவற்றையும் நம்பிக்கையோடு எதிர்நோக்கும்; எல்லாவற்றையும் நிலைத்துச் சகிக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எல்லாவற்றையும் மூடும்’ அல்லது ‘பாதுகாக்கும்’ என்றும் மொழிபெயர்க்கலாம்; στέγει என்பது மூடுதல் அல்லது பாதுகாத்தல் என்ற பொருளையும், தாங்குதல் என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘எல்லாவற்றின்மீதும் நம்பிக்கை வைக்கும்’ என்றும் மொழிபெயர்க்கலாம். இங்கே அன்பு எளிதில் ஏமாறும் என்று பொருளல்ல; நம்பிக்கை வைக்க முனையும் அதன் பண்பே குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: ஒவ்வொரு வினையுடனும் வரும் நடுநிலைப் பன்மைச் சொல் முழுமையான பரப்பைக் குறிக்கிறது. ‘எல்லாவற்றையும்’ என்பது அந்த விரிவையும் நான்கு முறை வரும் சொல்லாட்சியையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: στέγει
  choice: தாங்கும்
  rationale: இந்த வினை ‘மூடும்/பாதுகாக்கும்’ என்றும், விரிவான பொருளில் ‘தாங்கும்’ என்றும் வரலாம். அன்பின் நிலைத்த பண்புகளை விவரிக்கும் இத்தொடரில் ‘தாங்கும்’ இயல்பாகப் பொருந்துகிறது; ‘மூடிப் பாதுகாக்கும்’ என்ற நுண்பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: πιστεύει
  choice: நம்பும்
  rationale: πιστεύω என்பதன் ‘நம்புதல்/நம்பிக்கை வைத்தல்’ என்ற பொருள் தமிழின் ‘நம்பும்’ என்பதில் சுருக்கமாகவும் நேரடியாகவும் வெளிப்படுகிறது. இது பகுத்தறிவின்றி எதையும் ஏற்றுக்கொள்வதைக் கட்டாயமாகக் குறிக்காது.
- source_word: ἐλπίζει
  choice: நம்பிக்கையோடு எதிர்நோக்கும்
  rationale: ‘எதிர்நோக்கும்’ மட்டும் எதிர்பார்த்தலைக் குறிக்கக்கூடும்; ‘நம்பிக்கையோடு’ என்பது ἐλπίζω-வின் நம்பிக்கை சார்ந்த பொருளைத் தெளிவாகக் காக்கிறது. நிகழ்காலம் அன்பின் தொடர்ந்த பண்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὑπομένει
  choice: நிலைத்துச் சகிக்கும்
  rationale: ὑπομένω அழுத்தத்தின் கீழும் நிலைத்திருந்து சகிப்பதைக் குறிக்கிறது. ‘நிலைத்துச் சகிக்கும்’ என்பது வெறும் பொறுத்துக்கொள்வதைவிட அந்த விடாமுயற்சியையும் வெளிப்படுத்தி, στέγει என்பதிலிருந்து தேவையான வேறுபாட்டைக் காக்கிறது.
theological_decisions:
- issue: πάντα நான்கு முறை வருவதன் பொருள்
  choice: அன்பின் முழுமையான நிலைத்த பண்பை வலியுறுத்தும் சொல்லாட்சியாக மொழிபெயர்க்கப்பட்டது.
  alternative: அன்பு ஒழுக்க வேறுபாடின்றி அல்லது பகுத்தறிவின்றி எல்லாவற்றையும் ஏற்றுக்கொள்கிறது என்ற முழுமையான நேரடிப் பொருள்.
  rationale: உடனடியான சூழல் அன்பின் பண்புகளை கவிதைநடையில் விவரிக்கிறது. ‘எல்லாவற்றையும்’ என்ற மீளுரைத்தலை அப்படியே காப்பது பவுலின் விரிவான வலியுறுத்தலைப் பாதுகாக்கிறது; அதேவேளையில் அன்பு எளிதில் ஏமாறுவது அல்லது எல்லாவற்றையும் அங்கீகரிப்பது என்று உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், சுருக்கமான இணைநடை காக்கப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாக இல்லாத ‘அன்பு’ என்ற எழுவாய் இவ்வசனத்தில் சேர்க்கப்படவில்லை; முந்தைய சூழலிலிருந்து அது விளங்குகிறது. ‘எல்லாவற்றையும்’ நான்கு முறையும் மீளுரைத்து மூலத்தின் ஓசையும் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
