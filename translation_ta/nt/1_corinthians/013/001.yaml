reference: 1 Corinthians 13:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: ta
  text: நான் மனிதர்களின் மொழிகளிலும் வானதூதர்களின் மொழிகளிலும் பேசினாலும், அன்பு எனக்கு இல்லையென்றால், ஒலிக்கிற வெண்கலமாகவோ ஆரவாரமிடும் கைத்தாளமாகவோ ஆகிவிட்டேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν
  choice: பேசினாலும்
  rationale: நிபந்தனை சார்ந்த கற்பனைச் சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘-ஆலும்’ அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: ταῖς γλώσσαις
  choice: மொழிகளில்
  rationale: γλῶσσα என்பது நாவையோ மொழியையோ குறிக்கலாம். இங்கு பேசும் வழிமுறையைக் குறிப்பதால் ‘மொழிகளில்’ இயல்பானது; அதேவேளை கொரிந்தியர் கடிதத்தின் அந்நியமொழிப் பேச்சு பற்றிய பின்னணியை இது மறுப்பதில்லை.
- source_word: τῶν ἀνθρώπων
  choice: மனிதர்களின்
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்ல, மனிதர்களை வானதூதர்களுடன் எதிர்நிறுத்துகிறது. ஆகவே நவீனத் தமிழில் துல்லியமான ‘மனிதர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: λαλῶ
  choice: பேசினாலும்
  rationale: முதலாம் நபர் நிகழ்கால வினை, நிபந்தனை அமைப்புடன் இணைந்து இயல்பான தமிழில் தரப்பட்டது.
- source_word: καὶ τῶν ἀγγέλων
  choice: வானதூதர்களின் மொழிகளிலும்
  rationale: மனிதர்களுக்கு எதிரான விண்ணுலக உயிர்களே இங்கு கருத்தாக இருப்பதால் ἄγγελοι என்பதற்கு ‘வானதூதர்கள்’ பொருத்தமானது. தமிழில் பொருள் தெளிவதற்காக ‘மொழிகள்’ மீண்டும் கூறப்பட்டது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான இயல்பான, பரந்த, சமயப் பிரிவுசார்பற்ற நவீனத் தமிழ் சொல் ‘அன்பு’.
- source_word: δὲ μὴ ἔχω
  choice: அன்பு எனக்கு இல்லையென்றால்
  rationale: δέ குறிக்கும் முரண்பாடும், ἔχω குறிக்கும் உடைமையும் தமிழில் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: γέγονα
  choice: ஆகிவிட்டேன்
  rationale: கிரேக்க நிறைவுக்காலத்தின் விளைவுநிலையை ‘ஆகிவிட்டேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: χαλκὸς ἠχῶν
  choice: ஒலிக்கிற வெண்கலம்
  rationale: χαλκός குறிப்பிட்ட இசைக்கருவியைச் சொல்லாமல் செம்பு/வெண்கல வகை உலோகத்தைக் குறிக்கிறது. கருவி ஒன்றை உரையில் சேர்க்காமல் ‘ஒலிக்கிற வெண்கலம்’ மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἢ κύμβαλον ἀλαλάζον
  choice: முழங்குகிற கைத்தாளம்
  rationale: κύμβαλον என்பது ஒன்றோடொன்று மோதப்பட்டு ஒலிக்கும் தாளக் கருவி; ἀλαλάζον அதன் உரத்த, ஆரவாரமான ஒலியைச் சுட்டுகிறது. ‘முழங்குகிற கைத்தாளம்’ இயல்பாகவும் உயிரோட்டமாகவும் உள்ளது.
theological_decisions:
- issue: ‘மனிதர்களின் மொழிகளும் வானதூதர்களின் மொழிகளும்’ என்பதன் பொருள்
  choice: மனித மற்றும் வானதூத மொழிகள் என்ற சொல்லாட்சியை நேரடியாகப் பாதுகாத்தல்
  alternative: உண்மையான விண்ணுலக மொழிகள் என்று தீர்மானித்தல்; அல்லது மிகைப்படுத்தல் மட்டுமே என்று வெளிப்படையாகக் கூறுதல்
  rationale: பவுல் உண்மையான வானதூத மொழிகளைச் சொல்கிறாரா அல்லது மிக உயர்ந்த பேச்சை மிகைப்படுத்திக் கூறுகிறாரா என்பதை வசனம் தீர்மானமாக விளக்கவில்லை. மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் திறந்தே வைக்கிறது.
- issue: ἀνθρώπων என்பதன் வரம்பு
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: இங்கு வேறுபாடு ஆண்–பெண் இடையில் அல்ல; மனிதர்களுக்கும் வானதூதர்களுக்கும் இடையில் உள்ளது. ‘மனிதர்கள்’ மூலத்தின் நோக்கத்தைத் துல்லியமாகத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிப்பதற்கு இயல்பாகவும் பொதுமக்களுக்கு விளங்குமாறும், அதேவேளை dignified வேதாகம நடையுடனும் வடிவமைக்கப்பட்டது. ‘வெண்கலம்’ என்பதில் குறிப்பிட்ட இசைக்கருவி சேர்க்கப்படவில்லை; வானதூத மொழிகள் நேரடியானவையா மிகைப்படுத்தலா என்ற தெளிவின்மையும் பாதுகாக்கப்பட்டது.
