source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: ta
  text: என் உடைமைகள் அனைத்தையும் நான் பகிர்ந்தளித்தாலும், எரிக்கப்படுவதற்காக என் உடலை நான் ஒப்புக்கொடுத்தாலும்[a], அன்பு எனக்கு இல்லையென்றால், எனக்கு எந்தப் பயனும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘எரிக்கப்படுவதற்காக’ என்பதற்குப் பதிலாக, ‘நான் பெருமைபாராட்டுவதற்காக’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: பகிர்ந்தளித்தாலும்
  rationale: இந்த வினைச்சொல் முதலில் சிறு பகுதிகளாக உணவளிப்பதைக் குறித்தாலும், இங்கு உடைமைகள் அனைத்தையும் பிறருக்குக் கொடுப்பதைக் குறிக்கிறது. ‘பகிர்ந்தளித்தாலும்’ என்பது தானமாக விநியோகிக்கும் கருத்தையும் முழுமையாகக் கொடுத்துவிடும் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: என்னிடமுள்ள அனைத்தையும்
  rationale: இந்தச் சொற்றொடர் ஒருவருடைய சொத்து மற்றும் பொருளாதார உடைமைகள் அனைத்தையும் குறிக்கிறது. இத்தமிழாக்கம் இயல்பாகவும் விரிவுபடுத்தாமல் தெளிவாகவும் உள்ளது.
- source_word: παραδῶ
  choice: ஒப்புக்கொடுத்தாலும்
  rationale: தன் உடலை வேறொருவரின் அதிகாரத்திற்கோ செயலுக்கோ ஒப்படைப்பதைக் குறிக்கும் மூலச்சொல்லின் வலிமையை இது காக்கிறது; ‘பலியிட்டாலும்’ போன்ற விளக்கவுரை சார்ந்த சொல்லைத் தவிர்க்கிறது.
- source_word: τὸ σῶμά μου
  choice: என் உடலை
  rationale: உருவக விரிவாக்கம் இன்றி konkreடான பெயர்ச்சொற்றொடரை நேரடியாக வழங்குகிறது.
- source_word: ἵνα καυθήσομαι
  choice: எரிக்கப்படுவதற்காக
  rationale: SBLGNT-யின் καυθήσομαι என்ற வாசகத்தைச் சார்ந்து, நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தெரிவிக்கும் ἵνα-வின் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான பரந்த, இயல்பான நவீனத் தமிழ் இணைச்சொல்; அதன் பொருளை தர்மம் அல்லது ஈகை என்ற குறுகிய கருத்துக்குள் அடைக்கவில்லை.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: எனக்கு எந்தப் பயனும் இல்லை
  rationale: பேசுகிறவருக்கு எவ்வித நன்மையோ ஆதாயமோ கிடையாது என்ற செயப்பாட்டு வினையின் தனிப்பட்ட விளைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: …பகிர்ந்தளித்தாலும், …ஒப்புக்கொடுத்தாலும்
  rationale: இரண்டு நிபந்தனைகளையும் தனித்தனியாக வைத்துப் பவுலின் படிப்படியான உயர்வைத் தக்கவைக்கிறது. தமிழில் ‘-ஆலும்’ என்ற இணையான அமைப்பு மீள வருவதால் தொடர்ச்சியான καὶ-யை தனியே மொழிபெயர்க்காமலும் அதன் சொல்லாட்சிப் பயனைப் பாதுகாக்கிறது.
theological_decisions:
- issue: நோக்கத்தைக் குறிக்கும் உட்பிரிவிலுள்ள பாட வேறுபாடு
  choice: SBLGNT-யின் καυθήσομαι என்பதை ‘எரிக்கப்படுவதற்காக’ என்று முதன்மை உரையில் மொழிபெயர்த்தல்.
  alternative: καυχήσωμαι — ‘நான் பெருமைபாராட்டிக்கொள்வதற்காக’
  rationale: வழங்கப்பட்ட மூலப்பதிப்பு SBLGNT என்பதால் அதன் வாசகமே முதன்மை உரையில் பின்பற்றப்படுகிறது. இந்தப் பாட வேறுபாடு உடலை எரிப்பதற்காக ஒப்புக்கொடுப்பதற்கும் பெருமைபாராட்டுவதற்காக ஒப்புக்கொடுப்பதற்கும் இடையே பொருளை குறிப்பிடத்தக்க வகையில் மாற்றுவதால், மாற்று வாசகம் அடிக்குறிப்பில் வெளிப்படையாகத் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் இரண்டு உயர்ந்து செல்லும் நிபந்தனைகளும் ‘-ஆலும்’ அமைப்பால் தக்கவைக்கப்பட்டுள்ளன; இறுதி முரண்பாடு ‘அன்பு எனக்கு இல்லையென்றால்’ என்று தெளிவாக முன்னிறுத்தப்பட்டுள்ளது.
