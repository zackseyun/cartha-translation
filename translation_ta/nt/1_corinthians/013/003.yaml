revisions:
- from: என்னிடமுள்ள அனைத்தையும் நான் பகிர்ந்தளித்தாலும், எரிக்கப்படுவதற்காக என் உடலை நான் ஒப்புக்கொடுத்தாலும்[a], அன்பு எனக்கு இல்லையென்றால், எனக்கு எந்தப் பயனும் இல்லை.
  to: என் உடைமைகள் அனைத்தையும் நான் பகிர்ந்தளித்தாலும், எரிக்கப்படுவதற்காக என் உடலை நான் ஒப்புக்கொடுத்தாலும்[a], அன்பு எனக்கு இல்லையென்றால், எனக்கு எந்தப் பயனும் இல்லை.
  rationale: The revision limits the first clause to the speaker’s possessions, matching the concrete sense of τὰ ὑπάρχοντά μου. The main-text reading follows SBLGNT (καυθήσομαι, ‘I may be burned’), while the materially different variant (‘I may boast’) remains in the footnote. No doctrinal interpretation has been introduced.
