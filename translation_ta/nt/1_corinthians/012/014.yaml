translation:
  language: ta
  text: ஏனெனில், உடல் ஒரே உறுப்பு அல்ல; பல உறுப்புகளைக் கொண்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்தை விளக்கி ஆதரிக்கும் இணைப்பாக இச்சொற்றொடர் வருகிறது. நவீன தமிழில் “ஏனெனில்” அதன் விளக்கக் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ σῶμα
  choice: உடல்
  rationale: இது எழுவாயாக வரும் நேரடியான பொருள். சூழலில் திருச்சபையைக் குறிக்கும் உருவகம் இருந்தாலும், மூலத்தில் உள்ள “உடல்” என்ற உருவகத்தையே மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: οὐκ ἔστιν
  choice: இல்லாமல்
  rationale: எதிர்மறை இருப்புநிலையைத் தமிழில் தொடர்ந்துவரும் “பல உறுப்புகளாக இருக்கிறது” என்பதோடு இயல்பாக இணைக்கிறது; மூலத்தின் ‘அல்ல’ என்ற எதிர்மறை கருத்தும் மாறாமல் உள்ளது.
- source_word: ἓν μέλος
  choice: ஒரே உறுப்பாக
  rationale: “உறுப்பு” என்பது உடல் உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது. ἓν என்பதன் ஒருமை வலியுறுத்தலை “ஒரே” வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ πολλά
  choice: பல உறுப்புகளாக இருக்கிறது
  rationale: πολλά என்பது முன்பு வந்த “உறுப்புகள்” என்பதை உள்ளடக்கி நிற்கும் பன்மைச் சொல். தமிழில் பொருள் தெளிவாகவும் வாக்கியம் முழுமையாகவும் இருக்க “உறுப்புகள்” மீண்டும் வெளிப்படையாகக் கூறப்படுகிறது.
theological_decisions:
- issue: “உடல்” என்ற உருவகத்தின் குறிப்பு
  choice: மூலத்தில் உள்ளபடி “உடல்” என்ற உருவகத்தை மட்டும் தக்கவைத்தல்
  alternative: “கிறிஸ்துவின் உடல்” என்று விரிவாக்குதல்
  rationale: பரந்த சூழல் திருச்சபையைக் கிறிஸ்துவின் உடலாகச் சித்தரித்தாலும், இந்த வசனம் τὸ σῶμα (“உடல்”) என்று மட்டுமே கூறுகிறது. “கிறிஸ்துவின்” என்று சேர்ப்பது வசனத்தில் வெளிப்படையாக இல்லாத சூழல் விளக்கத்தை முதன்மை உரைக்குள் கொண்டுவரும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. “அவயவம்” போன்ற பழைய அல்லது தொழில்நுட்பச் சொல்லுக்குப் பதிலாக இயல்பான “உறுப்பு” பயன்படுத்தப்பட்டது.
