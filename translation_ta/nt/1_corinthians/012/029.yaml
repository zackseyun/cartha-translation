id: 1CO.12.29
reference: 1 Corinthians 12:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: ta
  text: எல்லாருமே அப்போஸ்தலர்கள் அல்லவே? எல்லாருமே தீர்க்கதரிசிகள் அல்லவே? எல்லாருமே போதகர்கள் அல்லவே? எல்லாருமே அற்புதச் செயல்கள் செய்கிறவர்கள் அல்லவே?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்பொருளுக்கு நெருக்கமாக, “எல்லாருமே வல்லமைகள்/அற்புதச் செயல்கள் அல்லவே?” கிரேக்கத்தில் ‘வல்லமைகள்’ என்ற சொல் அற்புதச் செயல்களையோ அவற்றைச் செய்கிறவர்களையோ சுருக்கமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: அல்லவே?
  rationale: μή வினாவை அறிமுகப்படுத்தி எதிர்மறையான பதிலை எதிர்பார்க்கிறது. ‘அல்லவே?’ என்பது அந்த எதிர்பார்ப்பை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: πάντες
  choice: எல்லாருமே
  rationale: முழுச் சபையினரும் ஒரே பணியையோ வரத்தையையோ பெற்றவர்கள் அல்ல என்பதை வலியுறுத்தும் கிரேக்க மறுமொழியை ‘எல்லாருமே’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀπόστολοι
  choice: அப்போஸ்தலர்கள்
  rationale: இங்கு பொதுவான தூதர்களை அல்ல, சபையில் அறியப்பட்ட பணிப் பங்கைச் சுட்டுவதால் வழக்கமான திருச்சபைச் சொல்லான ‘அப்போஸ்தலர்கள்’ பொருத்தமானது.
- source_word: προφῆται
  choice: தீர்க்கதரிசிகள்
  rationale: இறைவாக்குரைக்கும் நபர்களைக் குறிக்கும் நிலையான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ்ச் சொல்.
- source_word: διδάσκαλοι
  choice: போதகர்கள்
  rationale: சபைச் சூழலில் கற்பிப்பவர்களைக் குறிக்கும் இயல்பான, மதிப்புமிக்க நவீனத் தமிழ் இணைச்சொல்.
- source_word: δυνάμεις
  choice: அற்புதச் செயல்கள் செய்கிறவர்கள்
  rationale: பெயர்ச்சொல்லாகிய δυνάμεις என்பதன் அடிப்படைப் பொருள் ‘வல்லமைகள்/அற்புதச் செயல்கள்’. ஆனால் பணிகளையும் அவற்றைச் செய்பவர்களையும் வரிசைப்படுத்தும் இச்சூழலில், அற்புதச் செயல்களை நிகழ்த்துகிறவர்களை ஆகுபெயராகக் குறிக்கிறது. நபர்களே ‘வல்லமைகள்’ என்று கூறும் இயல்பற்ற தமிழைத் தவிர்த்து சூழல்சார் பொருளை இவ்வடிவம் தருகிறது.
theological_decisions:
- issue: பணிகளும் வரங்களும் இடம்பெறும் பட்டியலில் δυνάμεις என்பதைக் கொடுத்தல்
  choice: எல்லாருமே அற்புதச் செயல்கள் செய்கிறவர்கள் அல்லவே?
  alternative: எல்லாருமே வல்லமைகள் அல்லவே? / எல்லாருக்குமே அற்புத வல்லமைகள் இருக்கின்றனவா?
  rationale: கிரேக்கத்தில் உள்ள சுருக்கமான ஆகுபெயர் பயன்பாட்டை வாசிக்கத்தக்க தமிழில் வெளிப்படுத்துகிறது; அதேவேளை ஒவ்வொரு உறுப்பினரும் இந்தச் செயலைச் செய்வதில்லை என்ற பவுலின் கருத்தை எந்தக் கோட்பாட்டுச் சேர்க்கையும் இன்றி காக்கிறது.
translation_notes:
  register: மறுமொழியாக வரும் நான்கு எதிர்மறை வினாக்களும் காக்கப்பட்டுள்ளன. ‘அல்லவே?’ எதிர்மறைப் பதிலை எதிர்பார்க்கும் வினாத்தொனியைத் தருகிறது; மொழிநடை நவீனமும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமாக உள்ளது.
