  terminology: ‘அப்போஸ்தலர்கள்,’ ‘தீர்க்கதரிசிகள்,’ and ‘போதகர்கள்’ are established, comprehensible church-register terms. The footnote responsibly identifies the literal lexical form ‘வல்லமைகள்/அற்புதச் செயல்கள்’ and explains the contextual metonymy.
