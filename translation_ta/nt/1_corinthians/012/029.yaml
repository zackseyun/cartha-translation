  source_fidelity: The four repeated μή questions are accurately conveyed as negative questions expecting a negative answer. The sequence of apostles, prophets, teachers, and the final δυνάμεις is retained. Rendering the final shorthand as people who perform miraculous works appropriately communicates its contextual sense in this role/gift list without treating people literally as ‘powers.’
