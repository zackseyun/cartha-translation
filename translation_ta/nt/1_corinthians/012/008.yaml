  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: ta
  text: ஒருவருக்கு ஆவியின் மூலம் ஞானத்தின் செய்தி[a] கொடுக்கப்படுகிறது; மற்றொருவருக்கு அதே ஆவியின்படி[c] அறிவின் செய்தி[b] கொடுக்கப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஞானத்தின் வார்த்தை’ / ‘ஞானத்தின் உரை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அறிவின் வார்த்தை’ / ‘அறிவின் உரை.’
    reason: lexical_alternative
  - marker: c
    text: ‘அதே ஆவியால்’ என்றும் மொழிபெயர்க்கலாம். இங்கே கிரேக்கத்தில், முன்பு வரும் ‘ஆவியின் மூலம்’ என்பதில் உள்ள முன்னிடைச்சொல்லிலிருந்து வேறான முன்னிடைச்சொல் பயன்படுத்தப்பட்டுள்ளது; அது ஒரே ஆவியின்படியான ஏற்பை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν ... ἄλλῳ δὲ
  choice: ஒருவருக்கு ... மற்றொருவருக்கு
  rationale: பகிர்ந்தளிப்பைக் காட்டும் இணையான கிரேக்க அமைப்பை இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: διὰ τοῦ πνεύματος
  choice: ஆவியானவர் வழியாக
  rationale: διά + பிறப்புவேற்றுமை இங்கு வழிமுறை அல்லது செயலாண்மையைக் குறிக்கிறது; ‘வழியாக’ என்பது அந்த இடைமுகப் பொருளைத் தக்கவைக்கிறது.
- source_word: δίδοται
  choice: கொடுக்கப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வினையின் பொருளையும், இது ஒருவர் தாமாக உருவாக்குவது அல்லாமல் வழங்கப்படுவது என்பதையும் காக்கிறது.
- source_word: λόγος σοφίας
  choice: ஞானத்தின் செய்தி
  rationale: λόγος இங்கு தனிச் சொல்லைவிட வெளிப்படுத்தப்படும் செய்தி அல்லது கூற்றைக் குறிக்கக்கூடும்; ‘செய்தி’ நவீன தமிழில் இயல்பாகவும் போதிய அளவு பரந்ததாகவும் உள்ளது.
- source_word: λόγος γνώσεως
  choice: அறிவின் செய்தி
  rationale: λόγος σοφίας என்பதுடன் உள்ள இணைத்தன்மையைப் பாதுகாக்க அதே சொல்லாக்கம் பயன்படுத்தப்படுகிறது; γνώσεως என்பதற்கு ‘அறிவின்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: அதே ஆவியானவருக்கு ஏற்ப
  rationale: κατά + செயப்படுபொருள் வேற்றுமை இசைவு அல்லது ஏற்பைக் குறிக்கலாம். முதல் சொற்றொடரிலுள்ள διά என்பதிலிருந்து கிரேக்க முன்னிடைச்சொல் வேறுபாட்டை இது பாதுகாக்கிறது.
theological_decisions:
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: ஆவியானவர்
  alternative: மனித ஆவி
  rationale: 1 கொரிந்தியர் 12-ன் உடனடிச் சூழல் வரங்களைப் பகிர்ந்தளிக்கும் ஒரே தெய்வீக ஆவியானவரைக் குறிக்கிறது. ‘ஆவியானவர்’ என்பது தமிழில் பரிசுத்த ஆவியைக் குறிக்கும் மரியாதைமிக்க இயல்பான வடிவம்.
- issue: வரங்களைக் குறிக்கும் சொற்றொடர்களில் λόγος என்பதன் பொருள்
  choice: செய்தி
  alternative: வார்த்தை / உரை
  rationale: ‘செய்தி’ என்பது வெளிப்படுத்தப்படும் கருத்து அல்லது கூற்றை சாதாரண வாசகர்களுக்குத் தெளிவாகத் தெரிவிக்கிறது; பாரம்பரியமான மற்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: κατὰ τὸ αὐτὸ πνεῦμα என்பதன் தொடர்பு
  choice: அதே ஆவியானவருக்கு ஏற்ப
  alternative: அதே ஆவியானவரால்
  rationale: ‘ஏற்ப’ என்பது κατά-வின் இசைவு சார்ந்த நுணுக்கத்தையும், முன்பு வந்த διά-விலிருந்து அதன் வேறுபாட்டையும் தக்கவைக்கிறது; இருப்பினும் சூழலில் ஆவியானவரே பொதுவான மூலமாக இருப்பதும் மறுக்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிதில் புரியும் அதே நேரத்தில் மதிப்புமிக்க நடை. ‘ஒருவருக்கு ... மற்றொருவருக்கு’ என்ற பகிர்ந்தளிப்பு அமைப்பும், ‘வழியாக’ / ‘ஏற்ப’ என்ற கிரேக்க முன்னிடைச்சொல் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
