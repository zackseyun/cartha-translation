source:
  edition: SBLGNT
  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: ta
  text: எல்லாரும் குணமாக்கும் வரங்களைப் பெற்றிருப்பதில்லை, அல்லவா?[a] எல்லாரும் மொழிகளில் பேசுவதில்லை, அல்லவா?[b] எல்லாரும் பொருளுரைப்பதில்லை, அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “குணமாக்குதல்களின் வரங்கள்.” கிரேக்கத்தில் “வரங்கள்,” “குணமாக்குதல்கள்” ஆகிய இரண்டும் பன்மையில் உள்ளன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாவுகளில் பேசுகிறார்கள்.” இச்சூழலில் இது பொதுவாக “அந்நிய பாஷைகளில் பேசுதல்” அல்லது “பாஷைகளில் பேசுதல்” என்று அழைக்கப்படும் வரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: எல்லாரும் ... செய்கிறார்களா?
  rationale: μή அறிமுகப்படுத்தும் ஒவ்வொரு வினாவும் எதிர்மறையான பதிலை எதிர்பார்க்கிறது. தமிழில் இயல்பான வினா வடிவம் இதைச் சூழலும் தொடர்ச்சியான மூன்று வினாக்களும் தெளிவாக்குகின்றன.
- source_word: χαρίσματα ἰαμάτων
  choice: குணமாக்கும் வரங்கள்
  rationale: χαρίσματα என்பதற்கு ‘வரங்கள்’ என்றும், பன்மையான ἰαμάτων என்பதன் கருத்தை ‘குணமாக்கும்’ செயல்களுடன் தொடர்புடைய பல வரங்கள் என்றும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் பன்மை குறித்த தகவல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: γλώσσαις λαλοῦσιν
  choice: அந்நிய மொழிகளில் பேசுகிறார்கள்
  rationale: இச்சூழலில் γλώσσαις என்பது பொதுவாக ‘அந்நிய மொழிகள்/நாவுகள்’ என அழைக்கப்படும் ஆவிக்குரிய வரத்தைக் குறிக்கிறது. ‘அந்நிய மொழிகளில் பேசுதல்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: διερμηνεύουσιν
  choice: அவற்றை அர்த்தம் கூறுகிறார்கள்
  rationale: 1 கொரிந்தியர் 12–14 சூழலில், மொழிகளில் பேசப்பட்டதை மற்றவர்கள் புரிந்துகொள்ளுமாறு தெரிவிப்பதே பொருள். ‘அவற்றை’ என்பது முந்தைய அந்நிய மொழிப் பேச்சைக் குறிப்பதால் தொடர்பு தெளிவாகிறது.
theological_decisions:
- issue: μή உடன் வரும் பவுலின் சொல்லாட்சிசார் வினாக்களின் தன்மை
  choice: எதிர்மறையான பதிலை எதிர்பார்க்கும் மூன்று வினாக்களாக மொழிபெயர்த்தல்
  alternative: எதிர்பார்க்கப்படும் பதிலைச் சுட்டாத சாதாரண வினாக்களாக மொழிபெயர்த்தல்
  rationale: எல்லா விசுவாசிகளும் எல்லா வரங்களையும் பெற்றிருப்பதில்லை என்பதை கிரேக்கத் தொடரமைப்பு உணர்த்துகிறது. ஒரே உடலில் வரங்களின் வேறுபாட்டை வலியுறுத்தும் பவுலின் கருத்தை வினா வடிவமே பாதுகாக்கிறது.
- issue: διερμηνεύουσιν என்பதன் செயல்பாடு
  choice: அந்நிய மொழிப் பேச்சை மற்றவர்கள் புரிந்துகொள்ளுமாறு அர்த்தம் கூறுதல்
  alternative: பொதுவாக மொழிபெயர்த்தல் அல்லது விளக்குதல்
  rationale: உடனடிச் சூழல் அந்நிய மொழிகளில் பேசும் வரத்தைக் குறிக்கிறது; இருப்பினும் அது எந்த விதத்தில் நிகழ்கிறது என்பதை மொழிபெயர்ப்பு மேலதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான வினாக்கள் மூலத்தின் சொல்லாட்சிசார் வலிமையைப் பாதுகாக்கின்றன. ‘பாஷைகள்’ போன்ற பழைய பயன்பாட்டுக்குப் பதிலாக ‘அந்நிய மொழிகள்’ பயன்படுத்தப்பட்டுள்ளது.
