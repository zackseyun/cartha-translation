source:
  edition: SBLGNT
  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: ta
  text: செயல்பாடுகளில் பல வகைகள் உண்டு[b]; ஆனால் எல்லாவற்றையும் அனைவரிலும்[a] செயல்படுத்துகிறவர் ஒரே கடவுள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “எல்லாரிலும்.” கிரேக்கத்தில் இங்கு பெயர்ச்சொல் வெளிப்படையாக இல்லை; கடவுள் இந்த வெளிப்பாடுகளைச் செயல்படுத்தும் சபையின் எல்லா உறுப்பினர்களையும் சூழல் சுட்டுகிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “செயல்பாடுகள் பல வகையானவை; ஆனால் எல்லாவற்றையும் அனைவரிலும் செயல்படுத்துகிறவர் ஒரே கடவுள்.”'
    reason: previous_rendering
lexical_decisions:
- source_word: διαιρέσεις
  choice: பல வகைகள்
  rationale: இச்சூழலில் பிரிவினையைக் காட்டாமல், ஒரே மூலத்திலிருந்து வெளிப்படும் வேறுபட்ட வகைகளைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐνεργημάτων
  choice: செயல்பாடுகளில்
  rationale: தெய்வீகச் செயலின் வெளிப்பாடுகள் அல்லது விளைவுகள் என்ற பொருளைத் தருகிறது. பின்னர் வரும் ἐνεργῶν என்பதுடன் உள்ள சொற்பொருள் தொடர்பை ‘செயல்படுத்துகிறவர்’ என்பதன் மூலம் ஓரளவு தக்கவைக்கிறது.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: ஆனால் ... ஒரே கடவுள்
  rationale: δέ தரும் மெல்லிய எதிர்மறை ஒப்புமையையும், பல வகைகள் இருந்தாலும் அவற்றின் மூலமான கடவுள் ஒருவரே என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: ὁ ἐνεργῶν
  choice: செயல்படுத்துகிறவர்
  rationale: நிகழ்காலச் செயற்பாட்டை இயல்பான தமிழ் உறவுத்தொடராக வெளிப்படுத்தி, ἐνεργημάτων உடனான சொல் தொடர்பையும் காக்கிறது.
- source_word: τὰ πάντα
  choice: எல்லாவற்றையும்
  rationale: கிரேக்கச் சொற்றொடரின் விரிவான பொருளைக் குறுகச் செய்யாமல் தருகிறது; ‘இவை எல்லாவற்றையும்’ என்று உடனடிச் சூழலுக்கு மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: ἐν πᾶσιν
  choice: அனைவரிலும்
  rationale: பெயர்ச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், சபை உறுப்பினர்களிடையே கடவுள் செயல்படுவதைச் சூழல் சுட்டுகிறது. அந்த நபர்சார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் மறைவை அடிக்குறிப்பு பதிவு செய்கிறது.
theological_decisions:
- issue: τὰ πάντα ἐν πᾶσιν என்பதில் கடவுளின் செயலின் வரம்பு
  choice: ‘எல்லாவற்றையும் அனைவரிலும் செயல்படுத்துகிறவர்’ என்று விரிவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இவை எல்லாவற்றையும் அனைவரிலும் செயல்படுத்துகிறவர்’ அல்லது ‘எல்லாவற்றையும் அனைத்திலும் செயல்படுத்துகிறவர்.’
  rationale: τὰ πάντα என்பதன் விரிவைத் தக்கவைத்தபடியே, ஆவிக்குரிய வெளிப்பாடுகள் சபை உறுப்பினர்களில் செயல்படுவது பற்றிய உடனடிச் சூழலை மதிக்கிறது. கிரேக்கம் வெளிப்படையாகச் சொல்லாத அளவுக்கு ஒரு குறுகிய கோட்பாட்டு முடிவை மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘செயல்பாடுகள்/செயல்படுத்துகிறவர்’ என்ற சொல் இணைப்பு கிரேக்கத்தில் உள்ள ἐνεργημάτων/ἐνεργῶν தொடர்பைக் காட்டுகிறது. வாக்கியத்தின் பல்மை–ஒருமை எதிர்நிலையும் தெளிவாக வைக்கப்பட்டுள்ளது.
