  terminology: ‘பல வகைகள்,’ ‘செயல்பாடுகள்,’ and ‘ஒரே கடவுள்’ are suitable and consistent choices. ‘அனைவரிலும்’ is a contextually warranted explicit rendering of the substantival masculine plural πᾶσιν; the accompanying note responsibly records that the Greek leaves the noun unstated.
