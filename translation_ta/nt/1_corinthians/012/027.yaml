  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: ta
  text: நீங்களோ கிறிஸ்துவின்[a] உடலாக இருக்கிறீர்கள்; உங்களில் ஒவ்வொருவரும் அதன் உறுப்பாக இருக்கிறீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேசியாவின்’ என்றும் மொழிபெயர்க்கலாம். Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்னும் பட்டத்தைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், ‘ஒரு பங்கின்படி உறுப்புகள்.’ இதனை ‘ஒவ்வொருவரும் அதன் உறுப்புகள்’ அல்லது ‘குறிப்பாக உறுப்புகள்’ என்றும் புரிந்துகொள்ளலாம். ஒரே உடலுக்குள் ஒவ்வொருவரும் ஓர் உறுப்பாக இருக்கிறார்கள் என்பதே இங்குள்ள பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: நீங்கள்
  rationale: வெளிப்படையாக இடம்பெறும் இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல்; கொரிந்திய விசுவாசிகள் அனைவரையும் கூட்டாகச் சுட்டுகிறது.
- source_word: δέ
  choice: -ஓ
  rationale: முன்னர் விளக்கப்பட்ட ஒரே உடல்–பல உறுப்புகள் உருவகத்திலிருந்து வாசகர்களை நேரடியாகச் சுட்டும் மாற்றத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; தேவையற்ற காலப்பொருளைச் சேர்ப்பதில்லை.
- source_word: σῶμα Χριστοῦ
  choice: கிறிஸ்துவின் உடல்
  rationale: சபையை கிறிஸ்துவுக்குரிய உடலாக அடையாளப்படுத்தும் உரிமை/உறவு சார்ந்த பிறப்புப்பொருளை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: μέλη
  choice: உறுப்புகள்
  rationale: உடலின் அங்கங்களையும் ஒரு கூட்டமைப்பைச் சேர்ந்தவர்களையும் குறிக்கக்கூடியதால், பவுலின் உடல் உருவகத்தையும் சமூகப் பொருளையும் தக்கவைக்கிறது.
- source_word: ἐκ μέρους
  choice: தனித்தனியே
  rationale: ஒவ்வொருவரும் முழு உடலுக்குள் ஓர் உறுப்பாக இருக்கிறார் என்ற பகிர்ந்தளிக்கும் பொருளைத் தெளிவாகக் காட்டுகிறது; ‘ஒரு பகுதியாக’ என்பது முழுமையின்மை என்ற தவறான எண்ணத்தை உண்டாக்கலாம்.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: கிறிஸ்து
  alternative: மேசியா
  rationale: தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் ‘கிறிஸ்து’ என்பது Χριστός என்ற பட்டத்தை இயல்பாகவும் மரியாதையுடனும் எடுத்துரைக்கும் நிலைபெற்ற வடிவம். அதன் ‘மேசியா/அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ἐκ μέρους என்பதன் பொருள்
  choice: ஒவ்வொருவரையும் பகிர்ந்தளித்துச் சுட்டும் ‘தனித்தனியே அதன் உறுப்புகள்’
  alternative: ‘குறிப்பாக உறுப்புகள்’ அல்லது ‘ஒரு பகுதியின்படி உறுப்புகள்’
  rationale: உடல் ஒன்று, உறுப்புகள் பல என்ற உடனடிச் சூழலில், சபை கூட்டாகக் கிறிஸ்துவின் உடல் என்பதையும் ஒவ்வொருவரும் அதற்குள் உறுப்பினர் என்பதையும் இந்த வாசிப்பு பாதுகாக்கிறது.
- issue: ‘அதன்’ எனும் வெளிப்படையாக இல்லாத சொல்லைச் சேர்த்தல்
  choice: உறுப்புகள் எந்த உடலுக்குரியவை என்பதைத் தெளிவுபடுத்த ‘அதன்’ சேர்க்கப்பட்டது
  alternative: ‘தனித்தனியே உறுப்புகளாகவும் இருக்கிறீர்கள்’
  rationale: கிரேக்கத்தில் உறவு சூழலால் புரிந்துகொள்ளப்படுகிறது. தமிழில் ‘அதன்’ என்பது புதிய கருத்தைச் சேர்க்காமல் முன்சொன்ன உடலுடனான இலக்கணத் தொடர்பை இயல்பாக்குகிறது; இதன் நேரடிச் சொல்வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘நீங்களோ’ என்பது δέ-யின் உரையாடல் மாற்றத்தைச் சுருக்கமாகக் காட்டுகிறது. அரைப்புள்ளி, கூட்டான ‘உடல்’ அடையாளத்தையும் தனிநபர் ‘உறுப்பு’ அடையாளத்தையும் வேறுபடுத்தியபடியே ஒன்றோடொன்று இணைக்கிறது.
