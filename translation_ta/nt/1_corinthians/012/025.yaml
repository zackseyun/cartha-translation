translation:
  language: ta
  text: உடலில் பிளவு[a] ஏற்படாமல், மாறாக, உறுப்புகள் ஒன்றுக்கொன்று ஒரே அக்கறை கொள்ளும்படி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பிரிவினை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பிளவு அல்லது கிழிவைக் குறிக்கக்கூடும்; இங்கு அது உடலுக்குள் ஏற்படும் பிரிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உறுப்புகள் ஒன்றுக்கொன்று சமமாக அக்கறை கொள்ளும்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ஏற்படாமல் … காட்டும்படி
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கடவுளின் செயலுக்கான நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது. வசனம் தனியாக வாசிக்கப்படும்போதும் தொடர்பு தெளிவாக இருக்க, “அவர் இவ்வாறு செய்தார்” என்று முந்தைய சூழலிலிருந்து உள்ளடங்கிய முதன்மை வினை வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: σχίσμα
  choice: பிளவு
  rationale: இந்தச் சொல் கிழிவு, பிளவு அல்லது பிரிவைக் குறிக்கலாம். “பிளவு” உடல் உருவகத்தையும் திருச்சபைக்குள் ஏற்படும் பிரிவையும் ஒருசேர இயல்பாகத் தக்கவைக்கிறது; பிற்காலத் தொழில்நுட்பச் சமயச் சொல்லைத் திணிப்பதில்லை.
- source_word: σῶμα
  choice: உடல்
  rationale: பவுல் பயன்படுத்தும் உடல் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τὸ αὐτό
  choice: ஒரே விதமான அக்கறை
  rationale: μεριμνῶσι என்பதோடு இணைந்து, உறுப்புகள் பரஸ்பரம் காட்டும் அக்கறையில் ஒருமைப்பாடு அல்லது சமத்தன்மை இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; அதன் துல்லியமான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὑπὲρ ἀλλήλων
  choice: ஒன்றுக்கொன்று
  rationale: இங்கு ὑπέρ பதிலீட்டைக் குறிக்காமல், அக்கறை செலுத்தப்படும் பரஸ்பர நோக்கைக் குறிக்கிறது. “ஒன்றுக்கொன்று” அந்தப் பரஸ்பரத் தன்மையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: μεριμνῶσι
  choice: அக்கறை காட்டும்படி
  rationale: இந்தச் சூழலில் கவலை அல்லது பதற்றம் அல்ல, நன்மையான பரஸ்பரக் கவனிப்பே பொருள். “அக்கறை காட்டுதல்” அதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μέλη
  choice: உறுப்புகள்
  rationale: உடலின் அங்கங்களையும், உருவகமாக கிறிஸ்தவச் சமூகத்தின் அங்கத்தினரையும் குறிக்கும் இரட்டைச் செயல்பாட்டைத் தக்கவைக்கிறது.
theological_decisions:
- issue: σχίσμα என்ற சொல்லைத் திருச்சபை சார்ந்த உடல் உருவகத்தில் மொழிபெயர்த்தல்
  choice: பிளவு
  alternative: பிரிவினை
  rationale: “பிளவு” மூலச்சொல்லின் கிழிவு/பிரிவு படிமத்தையும் உடல் உருவகத்தையும் பாதுகாக்கிறது. “பிரிவினை” சமூகப் பொருளைத் தெளிவாக்கினாலும், மூலத்தின் உடல் சார்ந்த படிமத்தை ஓரளவு மங்கச் செய்யலாம்.
- issue: τὸ αὐτό என்பதில் ஒரே தன்மையா அல்லது சம அளவா
  choice: ஒரே விதமான அக்கறை
  alternative: ஒருவருக்கொருவர் சமமாக அக்கறை
  rationale: கிரேக்கத் தொடர் அக்கறையின் ஒருமைப்பாட்டை நேரடியாகக் கூறுகிறது; அது சமமான அக்கறையையும் உணர்த்தக்கூடும். முதன்மை உரை இரு நுணுக்கங்களையும் திறந்தவையாக வைத்திருக்கிறது; சமத்தன்மை வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “உடல்—உறுப்புகள்—பிளவு” என்ற தொடரின் மூலம் மூலத்தின் உருவகம் முழுவதும் தக்கவைக்கப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தின் நோக்கத் தொடராக இருப்பதால், தனிவசன வாசிப்பில் இயல்பாக அமைய “அவர் இவ்வாறு செய்தார்” என்பது சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது.
