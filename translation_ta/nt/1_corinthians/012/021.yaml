id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: ta
  text: ஆனால் கண் கையிடம், “நீ எனக்குத் தேவையில்லை” என்று சொல்ல முடியாது; அல்லது மீண்டும் தலை கால்களிடம், “நீங்கள் எனக்குத் தேவையில்லை” என்று சொல்ல முடியாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: சொல்ல முடியாது
  rationale: மறுப்பையும் இயலாமையையும் இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; இது வெறும் தகாத செயல் என்பதைக் காட்டிலும் இயலாமையைச் சுட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய உடல் உறுப்புகளின் பரஸ்பரச் சார்பைப் பற்றிய விவாதத்துடன் உள்ள முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: ὁ ὀφθαλμός
  choice: கண்
  rationale: பவுலின் உடல் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τῇ χειρί
  choice: கையைப் பார்த்து
  rationale: தமிழில் ஒருவரிடம் சொல்வதைக் குறிக்கும் இயல்பான வழக்கு; மறைமுகப் பொருளின் செயல்பாட்டைத் தக்கவைக்கிறது.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: நீ எனக்குத் தேவையில்லை
  rationale: χρεία என்பதன் ‘தேவை’ என்ற பொருளைப் பாதுகாத்து, இயல்பான நவீன தமிழில் கூறுகிறது; ‘உன்னால் எனக்குப் பயனில்லை’ என்பது மூலத்தைவிடக் கடுமையானது.
- source_word: ἢ πάλιν
  choice: அதுபோல
  rationale: இரண்டாவது ஒத்த எடுத்துக்காட்டை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; πάλιν இங்கு மறுபடியும் நிகழ்வதைவிட ஒப்பான அடுத்த உதாரணத்தைக் குறிக்கிறது.
- source_word: ἡ κεφαλή
  choice: தலை
  rationale: உடல் உருவகத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: τοῖς ποσίν
  choice: கால்களைப் பார்த்து
  rationale: பன்மையைத் தெளிவாகப் பாதுகாத்து, தமிழின் இயல்பான சொற்றொடரைப் பயன்படுத்துகிறது.
- source_word: ὑμῶν
  choice: நீங்கள்
  rationale: கிரேக்க மூலத்தில் இரண்டாம் கூற்றில் உள்ள பன்மையைத் தமிழிலேயே வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: திருச்சபையின் உறுப்பினர்கள் ஒருவரை ஒருவர் சார்ந்திருப்பதைக் காட்டும் உடல் உருவகம்
  choice: விளக்க விரிவாக்கமின்றி உடல் உறுப்புகளின் நேரடி உருவகத்தைப் பாதுகாத்தல்
  alternative: முதன்மை உரையிலேயே இவை திருச்சபை உறுப்பினர்களைக் குறிக்கின்றன என்று வெளிப்படையாக விளக்குதல்
  rationale: பவுலின் இறையியல் கருத்து இந்த உருவகத்தின் வழியே முன்வைக்கப்படுகிறது. அதை முதன்மை உரையிலேயே விளக்குவது மொழிபெயர்ப்பைத் தாண்டி விளக்கவுரையாகிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ஒருமை ‘நீ’ மற்றும் பன்மை ‘நீங்கள்’ ஆகியவை கிரேக்கத்தின் எண்ணிக்கை வேறுபாட்டை நேரடியாகத் தெரிவிப்பதால் அடிக்குறிப்பு தேவையில்லை. ‘கையைப் பார்த்து/கால்களைப் பார்த்து’ என்பது தமிழில் ‘அவற்றிடம்’ என்பதைக் காட்டிலும் இயல்பான மனிதரூபப்படுத்தப்பட்ட உடல் உருவகச் சொல்லாக்கம்.
