  text: But as it is[a], there are many parts, yet one body.
translation:
  language: ta
  text: ஆனால், உண்மையில் உடலுறுப்புகள் பல; உடல் ஒன்றே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν
  choice: இப்போதுள்ளபடி
  rationale: முந்தைய வசனத்தின் கற்பனையான நிலைக்கு மாறாக, தற்போது உண்மையில் உள்ள நிலையைச் சுட்டும் வாதத் தொடரை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கூற்றிலிருந்து மென்மையான மாறுபாட்டையும் வாதத்தின் தொடர்ச்சியையும் குறிக்கிறது.
- source_word: πολλὰ ... μέλη
  choice: உடலுறுப்புகள் பல
  rationale: நீடித்துவரும் உடல் உருவகத்தில் μέλη என்பது உடலை அமைக்கும் உறுப்புகளைக் குறிக்கிறது; ‘உடலுறுப்புகள்’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: μὲν ... δὲ
  choice: பல; ... ஒன்றே
  rationale: பல உறுப்புகளுக்கும் ஒரே உடலுக்கும் இடையிலான சமநிலை மாறுபாட்டைத் தமிழ் சொல்வரிசையும் ‘-ஓ’, ‘-ஏ’ வலியுறுத்தல்களும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: ἓν
  choice: ஒன்றே
  rationale: பலதன்மைக்கு எதிராக உடலின் ஒருமையை வலியுறுத்துகிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: பவுலின் நீடித்த உருவகத்தை நேரடியாகப் பாதுகாத்து, வேற்றுமையிலுள்ள ஒருமையைத் தெரிவிக்கிறது.
theological_decisions:
- issue: உடல் உருவகத்தில் μέλη என்பதன் மொழிபெயர்ப்பு
  choice: உடலுறுப்புகள்
  alternative: அங்கங்கள்
  rationale: ‘உடலுறுப்புகள்’ உடற்கூறு உருவகத்தைத் தெளிவாக வைத்திருக்கிறது; ‘அங்கங்கள்’ என்பது சபை அல்லது அமைப்பின் உறுப்பினர்கள் என்ற நிறுவனப் பொருளை அதிகமாகத் தூண்டக்கூடும். இங்கு மூலத்தின் உடல் உருவகத்தை முன்னிறுத்துவது பொருத்தமானது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ். சுருக்கமான கிரேக்க வாக்கியத்தின் சமநிலை அமைப்பைப் பாதுகாக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; ‘உடலோ ஒன்றே’ இயல்பான தமிழில் மாறுபாட்டையும் ஒருமையின் வலியுறுத்தலையும் தருகிறது.
