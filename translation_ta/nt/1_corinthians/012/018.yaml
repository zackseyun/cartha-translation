source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: ta
  text: ஆனால் உண்மையில், தேவன் உறுப்புகள் ஒவ்வொன்றையும் தாம் விரும்பியபடியே உடலில் அமைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அமைத்தார்’ என்பதற்கு ‘வைத்தார்’ அல்லது ‘நிறுவினார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: ஆனால் உண்மையில்
  rationale: முந்தைய கற்பனையான கூற்றுகளுக்கு மாறாக, இப்போது நிலவும் உண்மையான நிலையைச் சுட்டும் எதிர்மறைத் திருப்பத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ θεὸς
  choice: தேவன்
  rationale: கிரேக்க எழுவாயின் நேரடியான, மரியாதைக்குரிய தமிழ் வடிவம்.
- source_word: ἔθετο
  choice: அதனதன் இடத்தில் அமைத்திருக்கிறார்
  rationale: τίθημι என்பதன் ‘வைத்தார்/நிறுவினார்’ என்ற அடிப்படைப் பொருளையும், உடலின் உறுப்புகளை நோக்கத்துடன் ஒழுங்குபடுத்திய சூழல்சார் கருத்தையும் வெளிப்படுத்துகிறது; நிகழ் நிலையின் விளைவைத் தமிழில் இயல்பாகக் காட்ட நிறைவுற்ற நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὰ μέλη
  choice: உடலில் உள்ள உறுப்புகள்
  rationale: உடல் உருவகத்தில் செயல்படும் தனித்தனி பாகங்களைக் குறிக்கும் இயல்பான மற்றும் துல்லியமான தமிழ் சொல் ‘உறுப்புகள்’.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: உறுப்புகள் ஒவ்வொன்றையும்
  rationale: ஒவ்வோர் உறுப்பின் தனித்தன்மையையும் பகிர்ந்தளிக்கும் வலியுறுத்தலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐν τῷ σώματι
  choice: உடலில்
  rationale: முதன்மையாக உருவக உடலைக் குறிக்கும் முன்னிடைச் சொற்றொடரின் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: καθὼς ἠθέλησεν
  choice: தாம் விரும்பியபடியே
  rationale: தேவனுடைய சொந்த விருப்பத்திற்கும் நோக்கத்திற்கும் ஏற்ப என்பதைக் காட்டுகிறது; ‘தாம்’ எழுவாயாகிய தேவனை மரியாதையுடன் தெளிவாகச் சுட்டுகிறது, ‘-படியே’ துல்லியமான ஒத்திசைவை வலியுறுத்துகிறது.
theological_decisions:
- issue: உடலின் உறுப்புகளை அமைப்பதில் தேவனுடைய நோக்கமுள்ள செயல்
  choice: ஒவ்வோர் உறுப்பையும் தேவன் தமது விருப்பத்தின்படி அதனதன் இடத்தில் அமைத்தார் என்று மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: நோக்கமுள்ள ஒழுங்கமைப்பை வலியுறுத்தாமல், ‘வைத்தார்’ என்று மட்டும் மொழிபெயர்த்தல்.
  rationale: சூழலில் உடலின் வேறுபாடு தற்செயலானது அல்ல, தேவனால் நோக்கத்துடன் ஏற்படுத்தப்பட்டது என்பதே பவுலின் வாதம். அதேவேளையில், வசனத்துக்கு அப்பாற்பட்ட விரிவான இறையியல் முடிவுகள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. ‘அதனதன் இடத்தில்’ என்பது கிரேக்க வினையின் சூழல்சார் ஒழுங்கமைப்புக் கருத்தை இயல்பாக வெளிப்படுத்துகிறது; மாற்றுச் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
