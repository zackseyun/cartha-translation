base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: ta
  text: முழு உடலும் கண்ணாக இருந்தால்[a], கேள்விப்புலன் எங்கே இருக்கும்? முழு உடலும் கேள்விப்புலனாக இருந்தால், முகர்வுப் புலன் எங்கே இருக்கும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காது எங்கே இருக்கும்? … மூக்கு எங்கே இருக்கும்?” கிரேக்க மூலத்தில் கேட்டல் மற்றும் முகர்தல் என்னும் புலன் திறன்களே குறிப்பிடப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: உடல் முழுவதும்
  rationale: முழு உடலும் ஒரே உறுப்பாக இருப்பதாகக் கூறும் பவுலின் கற்பனைப் படிமத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: ὀφθαλμός
  choice: கண்ணாக
  rationale: ஒருமையில் உள்ள உடல் உறுப்புப் படிமத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ποῦ
  choice: எங்கே இருக்கும்?
  rationale: கற்பனை நிபந்தனையின் விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀκοή
  choice: கேட்கும் திறன்
  rationale: இச்சொல் உடல் உறுப்பான காதைக் காட்டிலும் கேள்விப் புலனின் செயல்திறனைக் குறிக்கிறது; இரண்டு இடங்களிலும் ஒரே மொழிபெயர்ப்பு தெளிவையும் இணைப்பையும் காக்கிறது.
- source_word: ὅλον
  choice: உடல் முழுவதும்
  rationale: கிரேக்கத்தில் இரண்டாம் வாக்கியத்தில் விடுபட்டுள்ள ‘உடல்’ என்பதைத் தமிழில் தெளிவுக்காக மீண்டும் வழங்குகிறது; கருத்தை மாற்றுவதில்லை.
- source_word: ὄσφρησις
  choice: முகரும் திறன்
  rationale: மூக்கு என்னும் உறுப்பை அல்ல, முகர்தல் என்னும் புலன் திறனைச் சுட்டும் மூலச்சொல்லின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடல் உறுப்புகளாக மொழிபெயர்ப்பதா, புலன் திறன்களாக மொழிபெயர்ப்பதா
  choice: ἀκοή, ὄσφρησις ஆகியவற்றை முறையே ‘கேட்கும் திறன்’, ‘முகரும் திறன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘காது எங்கே இருக்கும்? ... மூக்கு எங்கே இருக்கும்?’
  rationale: கிரேக்க மூலத்தில் காது, மூக்கு என்பதற்கான உடற்கூறு சொற்கள் வராமல், கேட்டல் மற்றும் முகர்தல் ஆகிய புலன் செயல்களைக் குறிக்கும் சொற்கள் வருகின்றன. ஆகவே மூலத்தின் செயல்திறன் சார்ந்த மொழியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையில் அமைக்கப்பட்டுள்ளது. ‘கேட்கும் திறன்’, ‘முகரும் திறன்’ என்பவை சாதாரண வாசகருக்குப் புரியும் வகையில் மூலத்தின் புலன் சார்ந்த சொற்களைத் துல்லியமாகக் காக்கின்றன.
