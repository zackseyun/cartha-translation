  text: τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ⸀ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ⸀ὑστεροῦντι περισσοτέραν δοὺς τιμήν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: ta
  text: ஆனால், நம்முடைய கண்ணியமான உறுப்புகளுக்கு தேவையில்லை. மாறாக, மதிப்பு குறைவாயிருந்த உறுப்புக்கு அதிகமான மதிப்பைக் கொடுத்து, கடவுள் உடலை ஒன்றிணைத்து அமைத்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உடலைக் கலந்து ஒன்றாக்கினார்.’ கிரேக்க வினைச்சொல் பல பகுதிகளைக் கலந்து அல்லது இணைத்து ஒரே முழுமையாக்குவதை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: கண்ணியமாகத் தோன்றும் உறுப்புகள்
  rationale: உடலுறுப்புகளின் வெளிப்புறத் தகுதியையும் மரியாதைக்குரிய தோற்றத்தையும் குறிக்கிறது. ‘உறுப்புகள்’ என்பது சூழலிலிருந்து இயல்பாகச் சேர்க்கப்பட்டுள்ளது; ‘கண்ணியமானவை’ என்று மட்டும் கூறினால் உள்ளார்ந்த மதிப்பைக் குறிக்கும் தவறான எண்ணம் எழலாம் என்பதால் ‘தோன்றும்’ சேர்க்கப்பட்டது.
- source_word: χρείαν ἔχει
  choice: அது தேவையில்லை
  rationale: ‘தேவை உடையன அல்ல’ என்ற கிரேக்க மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் வடிவம். ‘அது’ என்பது முந்தைய வசனத்தில் கூறப்பட்ட சிறப்பான பராமரிப்பைக் சூழலால் சுட்டுகிறது.
- source_word: συνεκέρασεν
  choice: ஒன்றிணைத்து அமைத்தார்
  rationale: பல பகுதிகளை இணைத்து ஒரே முழுமையாக்குதல் என்ற வினையின் பொருளை உடல் உருவகத்துக்கு இயல்பாக வழங்குகிறது. வெறும் இயந்திரரீதியான ‘ஒழுங்குபடுத்தினார்’ என்பதைக் காட்டிலும் ஒன்றிணைப்பைத் தக்கவைக்கிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: பவுலின் மைய உருவகத்தை விரிவாக்கமின்றி நேரடியாகத் தக்கவைக்கிறது.
- source_word: τῷ ὑστεροῦντι
  choice: மதிப்பு குறைவாயிருந்த உறுப்புக்கு
  rationale: அந்த உறுப்பு இயல்பிலேயே தாழ்ந்தது என்பதல்ல, அதற்கு மதிப்பு குறைவாக இருந்தது என்பதே சூழல். அடுத்து வரும் ‘மதிப்பு’ என்பதைக் கொண்டு குறைவின் தன்மை தெளிவாக்கப்படுகிறது.
- source_word: περισσοτέραν τιμήν
  choice: மிகுந்த மதிப்பு
  rationale: 'ஒப்பீட்டுப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது: முன்பு குறைவாக இருந்த உறுப்புக்கு அதிகமான மதிப்பு வழங்கப்படுகிறது.'
- source_word: δοὺς
  choice: கொடுத்து
  rationale: கடவுள் உடலை எவ்வாறு ஒன்றிணைத்து அமைத்தார் என்பதை விளக்கும் செயப்பாட்டு வினையெச்சமாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: உடலை ஒன்றிணைக்கும் கடவுளின் செயல்
  choice: மதிப்பு குறைவாயிருந்த உறுப்புக்கு மிகுந்த மதிப்பைக் கொடுத்து, கடவுள் உடலை நோக்கமுடன் ஒன்றிணைத்து அமைத்தார் என மொழிபெயர்த்தல்
  alternative: இது உடற்கூறுகளைப் பௌதிகமாகக் கலந்த செயலை மட்டும் குறிக்கிறது என மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழல் திருச்சபையை உடலாக எடுத்துரைக்கும் பவுலின் நீண்ட உருவகமாகும். மொழிபெயர்ப்பு அந்த உருவகத்தையும் கடவுள் அளிக்கும் மதிப்பையும் தக்கவைக்கிறது; அதேவேளையில் இது மனித உடலைப் பற்றிய குறிப்பா, திருச்சபைப் பயன்பாடா என்ற உருவகத் தொடர்பை விளக்கவுரையால் அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. உடல் உருவகம் முழுவதும் தக்கவைக்கப்பட்டு, ‘மதிப்பு குறைவாயிருந்த’ என்பது உறுப்பின் உள்ளார்ந்த தாழ்வைக் குறிக்காமல் அதற்கு முன்பு கிடைத்த மதிப்பின் குறைவைக் காட்டுகிறது.
