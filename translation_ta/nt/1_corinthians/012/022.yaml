theological_decisions:
- issue: சபைச் சூழலில் உடல் உருவகத்தின் பொருள்
  choice: ‘உடலின் உறுப்புகள்’ என்ற konkre்தமான உருவகத்தையே தக்கவைத்தல்
  alternative: ‘சபையின் அங்கத்தினர்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: சூழலில் பவுல் இதைச் சபைக்குப் பயன்படுத்தினாலும், இவ்வசனம் நேரடியாக உடல் உறுப்புகளைப் பற்றிப் பேசுகிறது. ஆகவே விளக்கத்தை வசனத்திற்குள் சேர்க்காமல் உருவகம் பாதுகாக்கப்படுகிறது.
- issue: πολλῷ μᾶλλον என்பதன் வலியுறுத்தல்
  choice: அதன் தீவிரத்தை முதன்மை உரையிலேயே வெளிப்படையாகக் காட்டுதல்
  alternative: ‘மாறாக’ என்பதன் எதிர்மறை வலிமைக்குள் அதை மறைமுகமாக வைத்தல்
  rationale: கிரேக்கத்தில் தீவிரப்படுத்தி வெளிப்படையாக இருப்பதால், அதை விடாமல் தமிழிலும் உணரக்கூடிய வகையில் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘உறுப்புகள்’ என்பது உடல் உருவகத்தையும் பின்னணியிலுள்ள சபைப் பயன்பாட்டையும் இயல்பாக ஏந்துகிறது; ‘இன்றியமையாதவை’ என்பதற்குப் பதில் மூலத்திற்கு நெருக்கமான ‘அவசியமானவை’ தேர்ந்தெடுக்கப்பட்டது.
