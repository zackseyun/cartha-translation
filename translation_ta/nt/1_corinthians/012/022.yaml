lexical_decisions:
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: முந்தைய கூற்றை வலுவாக மறுத்துத் திருத்தும் எதிர்மறைத் தொடர்பை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: πολλῷ μᾶλλον
  choice: மிகவும் … மிகவும்
  rationale: ‘இன்னும் மிகுதியாக / பன்மடங்கு அதிகமாக’ என்ற வெளிப்படையான வலியுறுத்தலைத் தமிழில் தெளிவாகத் தக்கவைக்கிறது; பலவீனம் தோற்றத்திற்குரியது, அவசியம் வலியுறுத்தப்படும் உண்மை என்பதையும் வாக்கிய அமைப்பு காட்டுகிறது.
- source_word: τὰ δοκοῦντα
  choice: தோன்றும்
  rationale: உண்மையான நிலையைத் தீர்மானிக்காமல், பார்வைக்கோ மதிப்பீட்டுக்கோ அப்படித் தெரிகிறது என்ற மூலத்தின் நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: μέλη
  choice: உறுப்புகள்
  rationale: உடல் உருவகத்தில் இயல்பான தமிழ்ச் சொல்; சபை உறுப்பினர்கள் என்று நேரடியாக விளக்கிப் பரிமாற்றாமல் konkre்தமான உடல் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: τοῦ σώματος
  choice: உடலின்
  rationale: உறுப்புகள் சேர்ந்துள்ள முழுமையைச் சுட்டும் நேரடியான உரிமைத் தொடர்பு.
- source_word: ἀσθενέστερα
  choice: மிகவும் பலவீனமானவையாக
  rationale: ஒப்பீட்டுப் பொருளைச் சூழலுக்கு ஏற்ற தமிழில் வெளிப்படுத்துகிறது; மற்ற உறுப்புகளைக் காட்டிலும் பலவீனமானவையாகத் தோன்றுவதை குறிக்கிறது.
- source_word: ὑπάρχειν
  choice: …வையாக
  rationale: δοκοῦντα உடன் இணைந்து ‘அப்படியாக இருப்பதாகத் தோன்றும்’ என்ற பொருளைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀναγκαῖά ἐστιν
  choice: அவசியமானவை
