id: 1CO.12.3
reference: 1 Corinthians 12:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: ta
  text: ஆகையால், கடவுளின் ஆவியால் பேசுகிற எவரும், “இயேசு சபிக்கப்பட்டவர்”[a] என்று சொல்வதில்லை என்றும், தூய ஆவியால் அன்றி எவராலும், “இயேசுவே ஆண்டவர்”[b] என்று சொல்ல முடியாது என்றும் உங்களுக்குத் தெரிவிக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு சபிக்கப்படட்டும்.” கிரேக்கத்தில் உள்ள Ἀνάθεμα Ἰησοῦς என்ற வினைச்சொல் இல்லாத கூற்று இவ்வாறும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொற்களின் வரிசை, “ஆண்டவர் இயேசு”; இச்சூழலில் அது “இயேசுவே ஆண்டவர்” என்ற ஒப்புதல் அறிக்கையாகப் பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: ஆகையால்
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவுறுத்தலை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: γνωρίζω ὑμῖν
  choice: உங்களுக்குத் தெரிவிக்கிறேன்
  rationale: ‘அறியச் செய்கிறேன்’ என்ற காரணவினைப் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத விருப்ப நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐν πνεύματι θεοῦ
  choice: கடவுளின் ஆவியால்
  rationale: ἐν என்பதன் கருவி அல்லது செயலாக்கப் பொருளை இச்சூழலில் தெளிவாகக் காட்டுகிறது.
- source_word: λαλῶν λέγει
  choice: பேசுகிற ... சொல்வதில்லை
  rationale: தொடர்ச்சியாகப் பேசும் செயலைப் பங்கேற்புவினையும், குறிப்பிட்ட கூற்றைச் சொல்வதை முதன்மை வினையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: இயேசு சபிக்கப்பட்டவர்
  rationale: வினைச்சொல் இல்லாத கிரேக்கக் கூற்றின் இயல்பான தமிழ்ப் பொருளைத் தருகிறது; வெளிப்படையான கட்டளைப் பொருளைத் திணிக்கவில்லை.
- source_word: οὐδεὶς δύναται εἰπεῖν
  choice: எவராலும் ... சொல்ல முடியாது
  rationale: திறன் அல்லது சாத்தியத்தைக் குறிக்கும் δύναται என்பதையும் பொதுமையான மறுப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Κύριος Ἰησοῦς
  choice: இயேசுவே ஆண்டவர்
  rationale: வினைச்சொல் இல்லாத அறிக்கையைத் தமிழில் ஒப்புதல் அறிக்கையாகத் தெளிவுபடுத்துகிறது; ஏகார வலியுறுத்தல் இயேசுவே எழுவாய் என்பதை இயல்பாகக் காட்டுகிறது.
- source_word: εἰ μὴ ἐν πνεύματι ἁγίῳ
  choice: தூய ஆவியால் அன்றி
  rationale: ஒரே விதிவிலக்கையும் ஆவியின் செயலாக்கத்தையும் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Κύριος Ἰησοῦς என்ற ஒப்புதல் சொற்றொடரில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: இயேசுவே ஆண்டவர்
  alternative: ஆண்டவராகிய இயேசு
  rationale: இது அழைப்புப் பெயரோ கூட்டு பட்டமோ அல்ல, இயேசுவின் ஆண்டத்துவத்தை அறிக்கையிடும் சொற்றொடர் என்பதைத் தெளிவாக்குகிறது; அதற்கு அப்பாற்பட்ட இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
- issue: தூய ஆவியால் அன்றி எவராலும் சொல்ல முடியாது என்பதன் எல்லை
  choice: மூலத்தின் செயலாக்கக் கூற்றை அப்படியே வைத்தல்
  alternative: வெறும் வாய்மொழி உச்சரிப்பாகக் குறுக்குதல் அல்லது மனமாற்றம் பற்றிய முழுக் கோட்பாடாக விரிவாக்குதல்
  rationale: உண்மையான ஒப்புதலைத் தூய ஆவியின் செயலோடு வசனம் இணைக்கிறது; மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தைப் பாதுகாத்து, குறிப்பிடப்படாத கோட்பாட்டு விவரங்களை இறக்குமதி செய்யாது.
- issue: Ἀνάθεμα Ἰησοῦς என்பதன் இலக்கண விசை
  choice: இயேசு சபிக்கப்பட்டவர்
  alternative: இயேசு சபிக்கப்படட்டும்
  rationale: கிரேக்கத்தில் வெளிப்படையான கட்டளை வினை இல்லை. ஆகவே முதன்மை உரை நிலை அல்லது அறிவிப்புப் பொருளைக் காக்கிறது; சாப வேண்டுதலாகப் புரியும் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுளின் ஆவி’ மற்றும் ‘தூய ஆவி’ என்ற மூலத்தின் சொல் வேறுபாடு காக்கப்பட்டுள்ளது. ‘எவராலும் ... முடியாது’ என்ற அமைப்பு கிரேக்கத்தின் திறன் சார்ந்த மொழியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
