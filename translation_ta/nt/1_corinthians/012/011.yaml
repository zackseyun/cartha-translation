  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: ta
  text: ஆனால், இவை அனைத்தையும் ஒரே ஆவியானவரே செயல்படுத்துகிறார்; அவர் விரும்புகிறபடியே ஒவ்வொருவருக்கும் தனித்தனியாகப் பகிர்ந்தளிக்கிறார்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செயல்படுத்துகிறார்’ என்பதற்கு, ‘இவற்றையெல்லாம் உண்டாக்குகிறார்’ அல்லது ‘நடப்பிக்கிறார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பகிர்ந்தளிக்கிறார்’ என்பதற்கு, ‘ஒவ்வொருவருக்கும் ஒதுக்கி அளிக்கிறார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘விரும்புகிறபடியே’ என்பதற்கு, ‘தேர்ந்தெடுக்கிறபடியே’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் விரும்புதல், தேர்ந்தெடுத்தல் அல்லது நோக்கங்கொள்ளுதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: ஆனால், இவை அனைத்தையும்
  rationale: πάντα ταῦτα என்பது முன்பு பட்டியலிடப்பட்ட வெளிப்பாடுகள் அனைத்தையும் ஒருங்கிணைத்துக் குறிக்கிறது. δέ இங்கு மென்மையான மாறுபாட்டையும் தொடர்ச்சியையும் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐνεργεῖ
  choice: செயல்படுத்துகிறவர்
  rationale: ἐνεργέω செயற்படுதல் மட்டுமன்றி விளைவை உண்டாக்கும் செயற்பாட்டையும் குறிக்கலாம். தமிழில் ஆவியானவரின் செயலாற்றலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்க ‘செயல்படுத்துகிறவர்’ எனப்பட்டது.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: ஒரே ஆவியானவரே
  rationale: ἓν καὶ τὸ αὐτό பல்வேறு வரங்கள் ஒரே மூலத்திலிருந்து வருகின்றன என்பதை வலியுறுத்துகிறது. ‘ஒரே ... அவரே’ என்ற தமிழ் அமைப்பு இந்த அடையாளத்தையும் வலியுறுத்தலையும் இயல்பாகக் காக்கிறது.
- source_word: διαιροῦν
  choice: பகிர்ந்தளிக்கிறார்
  rationale: இப்பங்கேற்பு வினை, ஆவியானவர் எவ்வாறு செயல்படுகிறார் என்பதை விளக்குகிறது. வரங்களைப் பெறுநர்களுக்கு ஒதுக்கி வழங்கும் கருத்தை எதிர்மறையான ‘பிரித்தல்’ நிழலின்றி ‘பகிர்ந்தளிக்கிறார்’ தருகிறது.
- source_word: ἰδίᾳ ἑκάστῳ
  choice: ஒவ்வொருவருக்கும் தனித்தனியாக
  rationale: ἑκάστῳ ஒவ்வொரு பெறுநரையும் தனித்தனியாகக் குறிக்கிறது; ἰδίᾳ அந்தத் தனிப்பட்ட பகிர்வை வலியுறுத்துகிறது. இரண்டின் பொருளும் தமிழில் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: καθὼς βούλεται
  choice: அவர் தாம் விரும்புகிறபடியே
  rationale: βούλομαι விருப்பம், தெரிவு, நோக்கம் ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘விரும்புகிறபடியே’ என்பதும் தனிப்பட்ட சித்தத்தையும் சுயாதீனமான பகிர்வையும் தெரிவிக்கிறது; ‘தாம்’ வலியுறுத்தலை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: πνεῦμα மற்றும் βούλεται காட்டும் ஆவியானவரின் தனிப்பட்ட செயற்பாடு
  choice: ‘ஆவியானவரே; அவர் தாம் விரும்புகிறபடியே’
  alternative: ‘ஆவியே; அது விரும்புகிறபடியே’ அல்லது எழுவாயை வெளிப்படுத்தாமல் மொழிபெயர்த்தல்
  rationale: πνεῦμα கிரேக்கத்தில் இலக்கண ரீதியாக நடுநிலைப் பாலாக இருந்தாலும், βούλεται அதற்கு விருப்பத்தையும் நோக்கமுள்ள செயற்பாட்டையும் உரித்தாக்குகிறது. தமிழில் ‘ஆவியானவர்/அவர்’ என்பது இந்தச் சூழலில் உள்ள தனிப்பட்ட செயற்பாட்டைத் தெளிவாகக் காட்டுகிறது; இலக்கணப் பாலினத்தை இறையியல் முடிவாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஒரே ஆவியானவரே’ என்ற அமைப்பு கிரேக்கத்தின் ஒன்றுமை வலியுறுத்தலை இயல்பாகக் காக்கிறது. பிரதான உரையில் எல்லா அடிக்குறிப்பு குறியீடுகளும் இடம்பெற்றுள்ளன.
