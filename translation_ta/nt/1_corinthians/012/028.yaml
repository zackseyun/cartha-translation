source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: ta
  text: 'கடவுள் சபையில் இவற்றை அமைத்திருக்கிறார்: முதலில் அப்போஸ்தலர்களை, இரண்டாவதாக இறைவாக்கினர்களை, மூன்றாவதாக போதகர்களை, பின்னர் அற்புதச் செயல்களை[a], பின்னர் குணமாக்கும் அருள்வரங்களை, உதவிகளை, நிர்வாகங்களை[b], பலவகையான நாவுப்பேச்சுகளை[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வல்ல செயல்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வழிநடத்துதல்கள்” அல்லது “தலைமை வகிக்கும் முறைகள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பலவகையான மொழிகள்.” கிரேக்கச் சொல் γλῶσσαι ‘நாவுகள்’ அல்லது ‘மொழிகள்’ எனப் பொருள்படலாம்; இச்சூழலில் அதன் துல்லியமான குறிப்பு விவாதத்திற்குரியது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: நியமித்திருக்கிறார் ... ஏற்படுத்தியிருக்கிறார்
  rationale: τίθημι இங்கு சபைக்குள் மனிதர்களுக்குரிய பணிகளையும் அருள்வரங்களின் செயல்பாடுகளையும் கடவுள் அமைத்ததைக் குறிக்கிறது. தமிழில் ஒரே வினைச்சொல் பட்டியலின் எல்லா உறுப்புகளோடும் இயல்பாகப் பொருந்தாததால், மனிதர்களுக்கு ‘நியமித்திருக்கிறார்’ என்றும் செயல்பாடுகளுக்கு ‘ஏற்படுத்தியிருக்கிறார்’ என்றும் ஒரே கிரேக்க வினையின் பொருள் விரித்துரைக்கப்பட்டுள்ளது.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: சபையில்
  rationale: ἐκκλησία இங்கு கடவுளுடைய மக்கள் சமூகத்தைக் குறிக்கிறது; ‘சபை’ என்பது நவீனத் தமிழில் தெளிவானதும் பரவலாகப் புரிந்துகொள்ளப்படுவதுமான சொல்.
- source_word: πρῶτον ... δεύτερον ... τρίτον ... ἔπειτα
  choice: முதலில் ... இரண்டாவது ... மூன்றாவது ... அதன்பின்
  rationale: மூலத்தின் வரிசையைத் தெளிவாகப் பாதுகாக்கிறது; அந்த வரிசை அதிகாரப்படிநிலையா, காலவரிசையா, செயல்முக்கியத்துவமா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: ἀποστόλους
  choice: அப்போஸ்தலர்கள்
  rationale: இங்கு வெறும் தூதுவர்களை அல்ல, அறியப்பட்ட அப்போஸ்தலப் பணியைக் குறிக்கிறது; வழக்கிலுள்ள திருச்சொல் பொருத்தமானது.
- source_word: προφήτας
  choice: இறைவாக்கினர்கள்
  rationale: கடவுளிடமிருந்து பெற்ற செய்தியை அறிவிக்கும் நபர்களைக் குறிக்கும் இயல்பான, dignified modern Tamil rendering.
- source_word: διδασκάλους
  choice: போதகர்கள்
  rationale: சபையில் கற்பிக்கும் பணியுடையவர்களைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: δυνάμεις
  choice: அற்புதச் செயல்கள்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘வல்லமைகள்’ என்றாலும், இப்பட்டியலில் வல்லமையின் அதிசயமான வெளிப்பாடுகளை அது குறிக்கிறது. ‘அற்புதச் செயல்கள்’ பொதுவாசகருக்குத் தெளிவு; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: χαρίσματα ἰαμάτων
  choice: குணமாக்கும் அருள்வரங்கள்
  rationale: இரு கிரேக்கச் சொற்களும் பன்மையில் உள்ளன. தமிழில் இயல்பற்ற ‘குணமாக்குதல்களின் வரங்கள்’ என்பதற்குப் பதிலாக, பல குணமாக்கும் வரங்களைக் குறிக்கும் இயல்பான சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀντιλήμψεις
  choice: உதவிகள்
  rationale: ஆதரித்தல், துணைசெய்தல் ஆகிய செயல்களையோ திறன்களையோ குறிக்கும் பன்மை வடிவத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: κυβερνήσεις
  choice: நிர்வாகங்கள்
  rationale: வழிநடத்துதல், திசைகாட்டுதல், ஒழுங்குபடுத்துதல் ஆகிய நுண்பொருள்களை உள்ளடக்கும் சபைச் செயல்பாட்டைத் தெரிவிக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: γένη γλωσσῶν
  choice: பலவகையான நாவுப்பேச்சுகள்
  rationale: γένη என்பதன் பலவகைத் தன்மையையும் γλῶσσαι என்பதிலுள்ள ‘நாவுகள்/மொழிகள்’ என்ற தெளிவின்மையையும் முடிந்தவரை காக்கிறது. ‘அந்நிய மொழிகள்’ என்று குறிப்பிட்டு நிகழ்வின் இயல்பை முன்கூட்டியே தீர்மானிப்பது தவிர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இந்த வரிசை நிலையான அதிகாரப்படிநிலையையா, காலவரிசையையா, செயல்முக்கியத்துவத்தையா குறிக்கிறது?
  choice: ‘முதலில் ... இரண்டாவது ... மூன்றாவது ... அதன்பின்’ என்று வரிசையை மட்டும் நேரடியாகக் காட்டுதல்
  alternative: அதிகாரப்படிநிலை, தோன்றிய காலவரிசை, அல்லது ஒப்பீட்டு முக்கியத்துவம் என்று வெளிப்படையாக விளக்குதல்
  rationale: வசனம் தெளிவான வரிசையைக் கொடுக்கிறது; ஆனால் அந்த வரிசையின் சரியான தன்மையை விளக்கவில்லை. எனவே மொழிபெயர்ப்பு அதற்கு மேலான விளக்கத்தைச் சேர்க்கவில்லை.
- issue: γλῶσσαι இங்கு எதைக் குறிக்கிறது?
  choice: ‘நாவுப்பேச்சுகள்’ என்று நிகழ்வின் தன்மையைத் திறந்தவாறு வைத்தல்
  alternative: ‘மொழிகள்’ அல்லது ‘அந்நிய மொழிகள்’ என்று தீர்மானித்தல்
  rationale: பவுலின் சொல் நாவுகள் அல்லது மொழிகள் என்ற பொருளைக் கொள்ள முடியும்; இச்சூழலில் நிகழ்வின் துல்லிய இயல்பு விவாதத்திற்குரியது. முதன்மை உரை தெளிவின்மையைப் பாதுகாக்கிறது; ‘மொழிகள்’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு மரியாதையையும் பொதுவாசகருக்கான தெளிவையும் இணைக்கும் நடை. பட்டியலின் ஒத்திசைவுக்காக இணைப்புகள் வெளிப்படையாக வைக்கப்பட்டுள்ளன. ‘அப்போஸ்தலர்’, ‘அருள்வரம்’ போன்ற பரவலாக அறியப்பட்ட கிறிஸ்தவச் சொற்கள் பயன்படுத்தப்பட்டாலும், எந்தச் சபைப்பிரிவின் தனிப்பட்ட கோட்பாட்டுச் சொற்களும் சேர்க்கப்படவில்லை.
