revisions:
- from: நீங்கள் பிற இனத்தவராக[a] இருந்தபோது, பேச இயலாத சிலைகளை[b] நோக்கி, எவ்வாறெல்லாம் வழிநடத்தப்பட்டீர்களோ அவ்வாறெல்லாம் இழுத்துச் செல்லப்பட்டீர்கள்[c] என்பது உங்களுக்குத் தெரியும்.
  to: நீங்கள் பிற இனத்தவராக[a] இருந்தபோது, பேச இயலாத சிலைகளிடம்[b] எப்படியெல்லாம் வழிநடத்தப்பட்டீர்களோ, அப்படியே இழுத்துச் செல்லப்பட்டீர்கள்[c] என்பதை நீங்கள் அறிவீர்கள்.
  rationale: The revision removes the misleading impression of two separately coordinated actions, retains the emphatic passive sense of ἤγεσθε ἀπαγόμενοι, and gives ὡς ἂν its natural Tamil correlative expression. It also makes the directional movement toward idols more idiomatic. No theological interpretation has been added.
