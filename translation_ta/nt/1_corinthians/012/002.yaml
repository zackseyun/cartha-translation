    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில், “எப்படியெல்லாம் வழிநடத்தப்பட்டீர்களோ” என்ற குறிப்பு, அவர்கள் சிலைகளிடம் செயலற்ற நிலையில் இழுத்துச் செல்லப்பட்ட விதத்தை வலியுறுத்துகிறது. வினை வடிவம் கடந்தகாலத்தில் தொடர்ந்த செயப்பாட்டு இயக்கத்தைக் குறிக்கிறது.
    reason: source_form
