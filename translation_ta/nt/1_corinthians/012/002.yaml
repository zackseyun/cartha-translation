  text: நீங்கள் பிற இனத்தவராக[a] இருந்தபோது, பேச இயலாத சிலைகளிடம்[b] எப்படியெல்லாம் வழிநடத்தப்பட்டீர்களோ, அப்படியே இழுத்துச் செல்லப்பட்டீர்கள்[c] என்பதை நீங்கள் அறிவீர்கள்.
  philosophy: optimal-equivalence
