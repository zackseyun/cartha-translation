review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys shared knowledge, the former non-Jewish identity, the speechlessness of the idols, and passive movement toward them. However, its paired wording, “எவ்வாறெல்லாம் வழிநடத்தப்பட்டீர்களோ அவ்வாறெல்லாம் இழுத்துச் செல்லப்பட்டீர்கள்,” reverses and over-explicates the Greek construction. The source presents their being led/led away as a single emphatic passive description, qualified by ὡς ἂν (“however/in whatever way”).
  naturalness: 'The current sentence is grammatically possible but cumbersome: “வழிநடத்தப்பட்டீர்களோ அவ்வாறெல்லாம் இழுத்துச் செல்லப்பட்டீர்கள்” sounds like two sequential or contrasting actions. A more direct Tamil rendering preserves the rhetorical force while reading naturally.'
  terminology: “பிற இனத்தவராக” is acceptable modern Tamil for ἔθνη in context, provided the note explains its non-Jewish contextual sense. “பேச இயலாத சிலைகள்” accurately renders τὰ εἴδωλα τὰ ἄφωνα and avoids an inappropriate use of “ஊமை.” “சிலைகளிடம்” more naturally expresses movement toward the objects than “சிலைகளை நோக்கி.”
  issues:
  - severity: medium
    issue: The double passive movement is rendered as an awkward conditional-correlative pair.
    rationale: ὡς ἂν ἤγεσθε ἀπαγόμενοι means that they were being led away in whatever manner they were led; it does not clearly set “being led” and “being dragged away” as two distinct stages. The Tamil should retain the passive, ongoing/iterative force without manufacturing that relation.
  - severity: low
    issue: Directional phrase is slightly under-rendered idiomatically.
    rationale: “சிலைகளை நோக்கி” is understandable, but “சிலைகளிடம்” better conveys the destination implied by πρός with the accusative in this context.
