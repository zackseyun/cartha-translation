    text: அல்லது, “யூதரல்லாதவர்களாக.” கிரேக்கச் சொல் அடிப்படையில் “இனங்கள்” என்று பொருள்படும்; இங்கே அவர்களின் முந்தைய யூதரல்லாத மதப் பின்னணியைக் குறிக்கிறது.
