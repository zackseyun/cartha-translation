  choice: இழுத்துச் செல்லப்பட்டீர்கள்
  rationale: ஒரு திசையை நோக்கிச் செயலற்ற நிலையில் கொண்டுசெல்லப்பட்டதை வலியுறுத்துகிறது; கிரேக்க வாக்கியத்தில் ἤγεσθε உடன் வரும் மீளுரைப்பின் வலிமையையும் தமிழில் ஓரளவு காக்கிறது.
theological_decisions:
- issue: ἔθνη என்பது கொரிந்தியர்களின் முந்தைய நிலையைக் குறிக்கும் விதம்
  choice: பிற இனத்தவர்
  alternative: யூதரல்லாதவர்கள்; புறவினத்தார்; அஞ்ஞானிகள்
  rationale: இன-மதப் பின்னணியைப் பாதுகாத்து, மூலத்தில் இல்லாத கடுமையான எதிர்மறைத் தீர்ப்பைச் சேர்க்காமல் உள்ளது.
- issue: பேச இயலாத சிலைகளுக்கும் ஆவியால் உண்டாகும் பேச்சுக்கும் உள்ள சூழல்சார் வேறுபாடு
  choice: பேச இயலாத சிலைகள்
  alternative: ஊமைச் சிலைகள்; குரலற்ற சிலைகள்
  rationale: அடுத்தடுத்த வசனங்களிலுள்ள ஆவியால் உண்டாகும் அறிக்கைகளுக்கு எதிராகச் சிலைகள் பேச இயலாதவை என்ற பவுலின் சொற்சுருக்கமான வலியுறுத்தலை விளக்கவுரை சேர்க்காமல் பாதுகாக்கிறது.
- issue: ἤγεσθε ἀπαγόμενοι என்பதிலுள்ள இரட்டைச் செயப்பாட்டு இயக்கம்
  choice: எவ்வாறெல்லாம் வழிநடத்தப்பட்டீர்களோ அவ்வாறெல்லாம் இழுத்துச் செல்லப்பட்டீர்கள்
  alternative: எப்படியோ அப்படியே சிலைகளிடம் நடத்தப்பட்டீர்கள்
  rationale: அவர்களின் முந்தைய வழிபாட்டு வாழ்வில் வெளிப்புறச் செல்வாக்கின் கீழ் செயலற்றவர்களாகக் கொண்டுசெல்லப்பட்டனர் என்ற மொழியியல் அழுத்தத்தை வைத்திருக்கிறது; அந்தச் செல்வாக்கு என்னவென்று வசனம் கூறாததால் அதைத் தனியே அடையாளப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘புறவினத்தார்,’ ‘அஞ்ஞானிகள்,’ ‘ஊமைச் சிலைகள்’ போன்ற பழைய அல்லது தேவையற்ற எதிர்மறைத் தாக்கமுள்ள சொற்கள் தவிர்க்கப்பட்டுள்ளன. கிரேக்கத்தின் சற்றுக் கடினமான மீளுரைப்பை முற்றிலும் சீராக்காமல், இயல்பான தமிழுக்குள் அதன் செயப்பாட்டு அழுத்தம் பாதுகாக்கப்பட்டுள்ளது.
