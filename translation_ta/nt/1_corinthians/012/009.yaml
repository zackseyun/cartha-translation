  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: ta
  text: வேறொருவருக்கு அதே ஆவியால் விசுவாசம் கொடுக்கப்படுகிறது[a]; இன்னொருவருக்கு ஒரே ஆவியால் குணமாக்குதல்களின் வரங்கள் கொடுக்கப்படுகின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விசுவாசம்” (πίστις) என்பதற்கு “நம்பிக்கை” அல்லது “உண்மைத்தன்மை” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “வரங்கள்,” “குணமாக்குதல்கள்” ஆகிய இரண்டு சொற்களும் பன்மையில் உள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: வேறொருவருக்கு
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் பகிர்ந்தளிக்கும் அமைப்பை இயல்பான தமிழில் காட்டுகிறது. ἑτέρῳ மற்றும் ἄλλῳ இடையே சூழல் கோராத கூர்மையான வேறுபாட்டைத் திணிக்காமல், சொல் மாறுபாட்டை ஓரளவு பிரதிபலிக்கிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: பவுலின் வழக்குக்கும் திருச்சபைச் சூழலில் பொதுவாகப் புரியும் தமிழுக்கும் ஏற்ற முதன்மைச் சொல். இங்கு ஆவியால் அளிக்கப்படும் ஒரு வரத்தின் சூழல் உள்ளது; ஆனால் அதன் தன்மையை உரை மேலும் வரையறுக்காததால் மொழிபெயர்ப்பு அதை விளக்கிச் சுருக்கவில்லை.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: அதே ஆவியால்
  rationale: ἐν + வேற்றுமை உருபை இங்கு கருவி அல்லது செயலாற்றும் வழி என்ற பொருளில் இயல்பான தமிழாக மொழிபெயர்க்கிறது; αὐτῷ என்பதன் ‘அதே’ என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: ἄλλῳ
  choice: இன்னொருவருக்கு
  rationale: வரங்கள் வெவ்வேறு நபர்களுக்குப் பகிர்ந்தளிக்கப்படுவதை இயல்பாகக் காட்டுகிறது; ἑτέρῳ உடன் உள்ள கிரேக்கச் சொல் மாறுபாட்டையும் தமிழில் மெதுவாகப் பிரதிபலிக்கிறது.
- source_word: χαρίσματα
  choice: வரங்கள்
  rationale: அருளால் கொடுக்கப்படும் திறன்கள் அல்லது கொடைகள் என்ற சூழலுக்கு ஏற்ற, நவீன வேதாகமத் தமிழில் தெளிவாகப் புரியும் சுருக்கமான சொல்.
- source_word: ἰαμάτων
  choice: குணமாக்குதல்களின்
  rationale: கிரேக்க மூலத்தில் உள்ள பன்மையைப் பாதுகாத்து, பலவகையான அல்லது பல நிகழ்வுகளான குணமாக்குதல்களைச் சுட்டக்கூடிய உண்மையான உரைநுட்பத்தைத் திறந்தவாறு வைக்கிறது.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: ஒரே ஆவியால்
  rationale: ἐν என்பதைக் கருவியுறவாகவும் ἑνί என்பதைக் ‘ஒரே’ என்றும் வழங்கி, பல்வேறு வரங்களுக்குப் பின்னுள்ள ஆவியின் ஒருமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: χαρισμαச் சூழலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: πίστις என்பதன் பொருள் வரம்பு நம்புதல், நம்பிக்கை, உண்மைத்தன்மை ஆகியவற்றை உள்ளடக்கலாம். இச்சூழலில் ‘விசுவாசம்’ பொருத்தமான முதன்மை மொழிபெயர்ப்பு; ஒரு குறிப்பிட்ட கரிஸ்மாட்டிக் கோட்பாட்டை உரைக்குள் சேர்க்காமல் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: πνεύματι என்பதன் குறிப்பு
  choice: ஆவி, பரிசுத்த ஆவியைக் குறிக்கும் வகையில்
  alternative: மனித ஆவி அல்லது பொதுவான ஆவி
  rationale: 1 கொரிந்தியர் 12-இன் சுற்றியுள்ள சூழலில் வரங்களை வழங்குபவர் பரிசுத்த ஆவியே என்பது தெளிவு. தமிழில் ‘ஆவி’ என்ற மரியாதைமிக்க பயன்பாடு அந்தச் சூழல்சார் குறிப்பைத் தக்கவைக்கிறது.
- issue: ἰαμάτων என்ற பன்மையின் இறையியல் நுட்பம்
  choice: குணமாக்குதல்கள் என்ற பன்மையைப் பாதுகாத்தல்
  alternative: குணமாக்கும் வரம் என்ற ஒருமைப்படுத்தப்பட்ட வாசகம்
  rationale: மூலத்தில் χαρίσματα மற்றும் ἰαμάτων இரண்டும் பன்மை. அதை ஒரே நிலையான ‘குணமாக்கும் வரம்’ என மாற்றுவது உரையில் இல்லாத முறையாக்கத்தை ஏற்படுத்தலாம்; ஆகவே பன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் வினை தமிழில் வாக்கியம் முழுமையடைய ‘கொடுக்கப்படுகின்றன’ என வெளிப்படுத்தப்பட்டுள்ளது. ‘அதே ஆவி’ மற்றும் ‘ஒரே ஆவி’ என்ற கிரேக்க வேறுபாடு சமப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
