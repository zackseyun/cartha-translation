id: 1CO.12.23
reference: 1 Corinthians 12:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: ta
  text: உடலில் மதிப்புக் குறைந்தவை என்று நாம் கருதும் உறுப்புகளுக்கு அதிக மதிப்பை அளிக்கிறோம்; வெளிக்காட்டத் தகாத[a] நம் உறுப்புகளோ இன்னும் கண்ணியமான தோற்றம் பெறுகின்றன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தகுந்த தோற்றமில்லாத.” கிரேக்கச் சொல், பொதுவில் வெளிக்காட்ட ஏற்றதல்லாததைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இன்னும் தகுந்த தோற்றம் உடையவையாகின்றன” அல்லது “இன்னும் கண்ணியமாகக் காணப்படுகின்றன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: என்று நாம் கருதும்
  rationale: δοκέω இங்கு புறநிலையான உண்மையை அல்ல, மனிதர்களின் மதிப்பீட்டைக் குறிக்கிறது. ‘நாம் கருதும்’ என்பது இதை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀτιμότερα
  choice: மதிப்புக் குறைந்தவை
  rationale: ἄτιμος என்பதன் ஒப்பீட்டு வடிவத்தையும், τιμή என்பதோடு உள்ள ‘மதிப்பு’ என்ற சொல் தொடர்பையும் இது காக்கிறது; ‘மதிப்பற்றவை’ என்று அளவுக்கு மீறிக் கடுமையாக்கவில்லை.
- source_word: τοῦ σώματος
  choice: உடலில்
  rationale: இவை உடலின் உறுப்புகள் என்ற முழுமை–பகுதி உறவை இயல்பான தமிழில் தெரிவிக்கிறது; பவுலின் உடல் உருவகமும் காக்கப்படுகிறது.
- source_word: τούτοις τιμὴν περισσοτέραν περιτίθεμεν
  choice: உறுப்புகளுக்கு அதிக மதிப்பை அளிக்கிறோம்
  rationale: περιτίθεμεν என்பதன் அடிப்படைப் பொருள் ‘மேல்/சுற்றி இடுதல்’ என்றாலும், இச்சூழலில் மதிப்பை வழங்குவதைத் தமிழில் இயல்பாகச் சொல்கிறது. τιμή–ἀτιμότερα என்ற எதிரிணையும் ‘மதிப்பு’ என்பதால் தெளிவாகிறது.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: வெளிக்காட்டத் தகாத நம் உறுப்புகள்
  rationale: ἀσχήμων என்பது சமூகமாக வெளிப்படுத்த ஏற்றதல்லாத அல்லது தகுந்த தோற்றமில்லாத உறுப்புகளைக் குறிக்கலாம். ஒழுக்கக்கேடு என்ற பொருளைத் தேவையின்றி ஏற்றாமல் உடல்சார் சூழலை இது தெளிவாக்குகிறது.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: இன்னும் கண்ணியமான தோற்றம் பெறுகின்றன
  rationale: εὐσχημοσύνη என்பது தகுந்த, நேர்த்தியான அல்லது வெளிப்படுத்த ஏற்ற தோற்றத்தைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க ‘பெறுகின்றன’ பயன்படுத்தப்பட்டாலும், உறுப்புகள் அதிகமான கண்ணியத் தோற்றத்தைக் கொண்டிருக்கின்றன என்ற கிரேக்கப் பொருள் காக்கப்படுகிறது.
theological_decisions:
- issue: உடல் உறுப்புகளின் உருவகமும் சமூக மதிப்பும்
  choice: சபை உறுப்பினர்களைப் பற்றி நேரடியாகப் பொழிப்புரை செய்யாமல், உடல் உறுப்புகளைப் பற்றிய தெளிவான மொழியைத் தக்கவைத்தல்
  alternative: சமூகத்தில் பலவீனமாகக் கருதப்படும் விசுவாசிகளுக்கு அதிக மரியாதை அளிக்க வேண்டும் என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: பவுலின் இறையியல் பயன்பாடு நேரடி உடல் ஒப்புமையிலிருந்து உருவாகிறது. அந்த ஒப்புமையை அப்படியே வைத்திருப்பது விளக்கத்தை மொழிபெயர்ப்புக்குள் முன்கூட்டியே புகுத்துவதைத் தவிர்க்கிறது.
- issue: εὐσχημοσύνην என்பதிலுள்ள கண்ணியமும் வெளிப்படுத்தத்தக்க தோற்றமும்
  choice: ‘கண்ணியமான தோற்றம்’ என்று இரு கூறுகளையும் இணைத்தல்
  alternative: ‘அடக்கம்’, ‘மரியாதை’ அல்லது ‘அழகு’ என்ற ஒரே கருத்தாகச் சுருக்குதல்
  rationale: இந்தச் சொல் வெறும் உள்மரியாதையையோ ஒழுக்க அடக்கத்தையோ மட்டும் குறிக்காது; தகுந்த வெளித்தோற்றம் என்ற நுணுக்கமும் உண்டு. மொழிபெயர்ப்பு அந்தத் திறந்த பொருள் பரப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உறுப்புகள்’, ‘மதிப்பு’, ‘வெளிக்காட்டத் தகாத’, ‘கண்ணியமான தோற்றம்’ ஆகிய சொற்கள் உடல்சார் படிமத்தையும் மதிப்பு–அவமதிப்பு எதிரிணையையும் இயல்பாகக் காக்கின்றன.
