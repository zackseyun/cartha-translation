  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: ta
  text: ஆனால் ஒவ்வொருவருக்கும் ஆவியானவரின் வெளிப்பாடு பொதுநன்மைக்காகக் கொடுக்கப்படுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பயனுள்ளதற்காக” அல்லது “அனைவரின் நன்மைக்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστῳ
  choice: ஒவ்வொருவருக்கும்
  rationale: தனித்தனி நபர்களுக்குப் பகிர்ந்தளிக்கப்படுவதைச் சுட்டும் தத்திவ் ஒருமையின் பகிர்வு வலிமையை இயல்பான தமிழில் தெளிவாகக் காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்திலிருந்து இங்கு வரும் மென்மையான மாறுபாட்டை அல்லது கருத்துத் திருப்பத்தைத் தெரிவிக்கிறது; அளவுக்கு மீறிய எதிர்மறைத் தொனி இல்லாமல் இணைப்பைத் தக்கவைக்கிறது.
- source_word: δίδοται
  choice: கொடுக்கப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தை நேரடியாகக் காத்து, இது பெறப்படுகிற கொடை என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φανέρωσις
  choice: வெளிப்பாடு
  rationale: காணக்கூடியதாக அல்லது தெளிவாக வெளிப்படுதல் என்ற பொருளைச் சுருக்கமாகக் கொடுக்கிறது; சூழலில் ஆவியானவரின் செயல்பாடு வெளிப்படுவதைக் குறிக்க ஏற்றது.
- source_word: τοῦ πνεύματος
  choice: ஆவியானவரின்
  rationale: 1 கொரிந்தியர் 12-இன் உடனடிச் சூழலில் குறிக்கப்படுவது பரிசுத்த ஆவியானவரே. மூலத்தில் இல்லாத ‘பரிசுத்த’ என்ற சொல்லைச் சேர்க்காமல், தமிழில் தனிப்பட்ட செயற்பாட்டாளரைக் குறிக்கும் இயல்பான வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: πρὸς τὸ συμφέρον
  choice: பொதுநன்மைக்காக
  rationale: நன்மை அல்லது பயன் நோக்கியதாக இருப்பதைத் தெரிவிக்கிறது. உடலின் உறுப்புகளும் பரஸ்பர நலனும் மையமாக உள்ள சூழலில், சமூக நோக்கை இயல்பாக வெளிப்படுத்துகிறது; இருப்பினும் கிரேக்கச் சொற்றொடரின் பொதுவான ‘நன்மையானதற்காக’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘ஆவி’ என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியானவரைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: பொதுவான ‘ஆவி’
  rationale: அருகிலுள்ள வசனங்கள் வரங்களின் மூலமாக ஒரே ஆவியானவரை மீண்டும் மீண்டும் குறிப்பிடுகின்றன. ஆயினும், மூலத்தில் இவ்விடத்தில் ἅγιον இல்லாததால் ‘பரிசுத்த’ என்பது முதன்மை உரையில் சேர்க்கப்படவில்லை.
- issue: συμφέρον என்பதன் பயன் யாருக்குரியது
  choice: பொதுநன்மை
  alternative: பொதுவாக நன்மையானது அல்லது பயனுள்ளது
  rationale: அத்தியாயத்தின் உடல் மற்றும் பரஸ்பரக் கட்டியெழுப்புதல் சார்ந்த சூழல் சமூகப் பயனை வலியுறுத்துகிறது. அதே நேரத்தில், சொற்றொடரின் இலக்கண வடிவம் ‘நன்மையானதற்காக’ என்ற பொதுவான வாசிப்பையும் அனுமதிப்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைத்தும் சாதாரண வாசகர்களுக்குத் தெளிவாகவும் வடிவமைக்கப்பட்டது. ‘வெளிப்பாடு’ என்பது சுருக்கமான, நிலைபெற்ற சொல்; ‘பொதுநன்மை’ சமூக நோக்கை இயல்பாகத் தெரிவிக்கிறது.
