id: 1CO.12.13
reference: 1 Corinthians 12:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: ta
  text: ஏனெனில், ஒரே ஆவியில்[a] நாம் அனைவரும் ஒரே உடலுக்குள் திருமுழுக்கு பெற்றோம்—யூதர்களானாலும் கிரேக்கர்களானாலும், அடிமைகளானாலும் சுதந்திரமானவர்களானாலும்—நாம் அனைவரும் ஒரே ஆவியைப் பருகச் செய்யப்பட்டோம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே ஆவியால்.” கிரேக்க ἐν என்பது சூழல் அல்லது பரப்பைக் குறிக்கலாம்; கருவி அல்லது செயற்பாட்டாளரையும் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நாம் அனைவருக்கும் பருகுவதற்காக ஒரே ஆவி கொடுக்கப்பட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில்
  rationale: γάρ என்பதன் விளக்கமளிக்கும் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; καί தரும் வலியுறுத்தல் வாக்கியத்தின் சூழலிலும் ‘அனைவரும்’ என்ற மீளுரைப்பிலும் வெளிப்படுகிறது.
- source_word: ἐν ἑνὶ πνεύματι
  choice: ஒரே ஆவிக்குள்
  rationale: ἐν என்பதன் முதன்மையான இடம்/சூழல் சார்ந்த வடிவத்தைப் பாதுகாத்து, ‘ஆவியால்’ என்ற கருவி அல்லது செயற்பாட்டாளர் பொருளை மட்டும் கட்டாயப்படுத்தாமல் விடுகிறது.
- source_word: ἡμεῖς πάντες
  choice: நாம் அனைவரும்
  rationale: வெளிப்படையான ἡμεῖς மற்றும் πάντες தரும் கூட்டுத்தொகை வலியுறுத்தலைத் தெளிவாகத் தருகிறது.
- source_word: εἰς ἓν σῶμα
  choice: ஒரே உடலுக்குள்
  rationale: εἰς குறிக்கும் உட்புகுதல் அல்லது இணைக்கப்படுதல் என்ற இயக்கம்/விளைவைப் பாதுகாத்து, பவுலின் ஒரே உடல் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: ἐβαπτίσθημεν
  choice: திருமுழுக்குப் பெற்றோம்
  rationale: பவுலின் திருச்சபைச் சூழலில் βαπτίζω என்பதற்கான நிலையான, கண்ணியமான தமிழாக்கம்; முழுக்குதல் முறையைத் தனியாக வலியுறுத்தவில்லை.
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: யூதர்கள் ... கிரேக்கர்கள்
  rationale: இன-மத அடையாளங்களின் நேரடி எதிரிணையைப் பாதுகாக்கிறது; Ἕλληνες என்பதை பொதுவாக ‘புறஜாதியார்’ என்று விரிவாக்கவில்லை.
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: அடிமைகள் ... சுதந்திரமானவர்கள்
  rationale: சட்ட மற்றும் சமூகப் பிணைப்பு நிலைக்கும் சுதந்திர நிலைக்கும் இடையிலான வெளிப்படையான எதிரிணையைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ἐποτίσθημεν
  choice: பருகும்படி செய்யப்பட்டோம்
  rationale: ποτίζω என்பதன் இறந்தகாலச் செயலப்பாட்டு வடிவத்தையும் அனைவரும் ஒரே ஆவியில் பங்குபெறும் பருகுதல் உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ἓν πνεῦμα
  choice: ஒரே ஆவி
  rationale: முந்தைய சொற்றொடருடனான இணைப்பும் உடனடியான சூழலும் தூய ஆவியையே சுட்டுவதை வலுவாக ஆதரிக்கின்றன.
theological_decisions:
- issue: ἐν ἑνὶ πνεύματι என்பது சூழல்/இடப்பொருளா அல்லது கருவி/செயற்பாட்டாளர் பொருளா?
  choice: ஒரே ஆவிக்குள்
  alternative: ஒரே ஆவியால்; ஒரே ஆவியினால்
  rationale: கிரேக்க ἐν பல நுணுக்கங்களை அனுமதிக்கிறது. முதன்மை உரை கிரேக்க வடிவத்துக்கு நெருக்கமாக இருந்து தெளிவின்மையைப் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இரண்டாவது ἓν πνεῦμα தூய ஆவியைக் குறிக்கிறதா அல்லது பகிரப்பட்ட ஆவிக்குரிய யதார்த்தத்தைக் குறிக்கிறதா?
  choice: ஒரே ஆவி
  alternative: ஒரே ஆவிக்குரிய பானம் அல்லது ஒரே மனப்பாங்கு
  rationale: ஒரே ஆவியின் ஒருமைப்படுத்தும் செயலைக் குறிக்கும் உடனடிச் சூழல் தூய ஆவியைக் குறிப்பதாக வலுவாகச் சுட்டுகிறது; கிரேக்கத்தில் பெரிய/சிறிய எழுத்து வேறுபாட்டால் இது தீர்மானிக்கப்படவில்லை.
- issue: δοῦλοι என்ற சமூகநிலைச் சொல்லின் வலிமை
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள்; ஊழியர்கள்
  rationale: ‘சுதந்திரமானவர்கள்’ என்பதற்கெதிரான இணைச்சொல் என்பதால் பிணைக்கப்பட்ட சமூக/சட்ட நிலையே இங்கு முக்கியம்; மென்மைப்படுத்தப்பட்ட மாற்றுகள் துல்லியத்தைக் குறைக்கும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘திருமுழுக்கு’ திருச்சபைச் சூழலுக்குரிய பரவலான சொல்லாகப் பயன்படுத்தப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தின் இணைப்புகளையும் ‘ஒரே’ மற்றும் ‘அனைவரும்’ என்ற ஒருமைப்பாட்டு வலியுறுத்தலையும் தமிழில் தக்கவைத்துள்ளோம்.
