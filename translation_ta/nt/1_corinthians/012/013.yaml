revisions:
- from: ஏனெனில், ஒரே ஆவிக்குள்[a] நாம் அனைவரும் ஒரே உடலுக்குள் திருமுழுக்குப் பெற்றோம்—யூதர்களானாலும் கிரேக்கர்களானாலும், அடிமைகளானாலும் சுதந்திரமானவர்களானாலும்—நாம் அனைவரும் ஒரே ஆவியைப் பருகும்படி செய்யப்பட்டோம்.[b]
  to: ஏனெனில், ஒரே ஆவியில்[a] நாம் அனைவரும் ஒரே உடலுக்குள் திருமுழுக்கு பெற்றோம்—யூதர்களானாலும் கிரேக்கர்களானாலும், அடிமைகளானாலும் சுதந்திரமானவர்களானாலும்—நாம் அனைவரும் ஒரே ஆவியைப் பருகச் செய்யப்பட்டோம்.[b]
  rationale: The revision makes the final passive verb precise and idiomatic, improves the locative wording in the first clause, and corrects and clarifies footnote b. It retains the Greek ambiguity of ἐν through the primary wording and footnote, preserves the Spirit reference without imposing a doctrinal interpretation, and maintains the social-status force of δοῦλοι/ἐλεύθεροι.
