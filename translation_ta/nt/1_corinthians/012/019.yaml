  yaml_path: translation/nt/1_corinthians/012/019.yaml
  text: If all were one member, where would the body be?
translation:
  language: ta
  text: எல்லா உறுப்புகளும் ஒரே உறுப்பாக இருந்தால், உடல் எங்கே இருக்கும்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: இருந்தால்
  rationale: கற்பனையான நிபந்தனையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: —
  rationale: இங்கு இது உரையோட்டத்தில் மென்மையான தொடர்பை ஏற்படுத்துகிறது; தமிழில் தனியே இணைப்புச்சொல் சேர்க்காமலேயே எதிர்நிலை தெளிவாக உள்ளது.
- source_word: ἦν
  choice: இருந்தால்
  rationale: εἰ என்பதுடன் இணைந்து கற்பனையான நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ πάντα
  choice: எல்லா உறுப்புகளும்
  rationale: சூழலில் இது பொதுவான ‘எல்லாப் பொருட்களையும்’ அல்ல, உடலின் உறுப்புகள் அனைத்தையும் குறிக்கிறது; ‘உறுப்புகளும்’ என்பது தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἓν μέλος
  choice: ஒரே உறுப்பாக
  rationale: உடல் உருவகத்தைத் தக்கவைத்து, அனைத்தும் ஒரே வகை உறுப்பாக இருப்பதைக் குறிக்கும் வலியுறுத்தலை ‘ஒரே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ποῦ
  choice: எங்கே இருக்கும்?
  rationale: கற்பனையான சூழலில் உடல் இருக்க முடியாது என்பதை உணர்த்தும் சொல்லாட்சிக் கேள்வியின் வலிமையைப் பாதுகாக்கிறது.
- source_word: τὸ σῶμα
  choice: உடல்
  rationale: மூலத்தின் உடல் உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; இவ்வசனத்தில் இல்லாத ‘கிறிஸ்துவின் உடல்’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: உடல் உருவகத்தின் வரம்பு
  choice: பல்வேறு உறுப்புகள் இல்லாமல் ஓர் உடல் இருக்க முடியாது என்பதைக் காட்டும் சொல்லாட்சிக் கேள்வியாக மொழிபெயர்த்தல்
  alternative: ‘கிறிஸ்துவின் உடல்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: விரிவான சூழல் திருச்சபையைக் கிறிஸ்துவின் உடலாகப் பேசினாலும், இவ்வசனத்தின் கிரேக்க உரை ‘உடல்’ என்று மட்டுமே கூறுகிறது. ஆகவே உருவகத்தின் இறையியல் வலிமையைத் தக்கவைத்து, மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான சொல்லாட்சி. ‘உறுப்பு’ என்பது உடலின் பகுதியையும் சமூக உறுப்பினர் என்ற பவுலின் விரிந்த உருவகப் பொருளையும் தாங்கக்கூடியதாக உள்ளது.
