source:
  edition: SBLGNT
  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: ta
  text: வேறொருவருக்கு அற்புதச் செயல்கள்[a]; வேறொருவருக்கு இறைவாக்கு உரைத்தல்; வேறொருவருக்கு ஆவிகளைப் பகுத்தறிதல்; இன்னொருவருக்குப் பலவகையான நாவு மொழிகள்[b]; வேறொருவருக்கு நாவு மொழிகளுக்கு விளக்கமளித்தல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வல்லமைகளின் செயல்பாடுகள்” அல்லது “வல்ல செயல்களின் வெளிப்பாடுகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பலவகையான மொழிகள்” என்றும், தொடர்ந்து “மொழிகளுக்கு விளக்கமளித்தல்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ‘நாவுகள்’ அல்லது ‘மொழிகள்’ ஆகிய இரு பொருள்களையும் கொள்ளக்கூடும். ஆவிக்குரிய கொடைகள் பற்றிய பவுலின் உரையில் உள்ள தெளிவுபடுத்தப்படாத தன்மையைப் பாதுகாக்க இங்கு ‘நாவு மொழிகள்’ பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα
  choice: செயல்பாடுகள்
  rationale: இச்சொல் ஆற்றலால் உண்டாகும் செயல்கள் அல்லது விளைவுகளைக் குறிக்கிறது. தமிழ் நடையில் இயல்பாக இருக்கும்போதே அதன் செயல்நிலைப் பொருளைத் தக்கவைக்கிறது.
- source_word: δυνάμεων
  choice: அற்புத
  rationale: ஆவிக்குரிய கொடைகளின் இப்பட்டியலில், பன்மையான δυνάμεις அற்புதமான வல்ல செயல்களைக் குறிப்பது இயல்பானது. சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: προφητεία
  choice: இறைவாக்கு உரைத்தல்
  rationale: இது இங்கு பெயரிடப்படும் கொடையை நவீன தமிழில் தெளிவாகச் சொல்கிறது; முன்னறிவித்தல் என்ற குறுகிய பொருளுக்குள் இதை அடைக்கவில்லை.
- source_word: διακρίσεις
  choice: பகுத்தறிதல்
  rationale: கிரேக்கத்தில் பன்மை இருந்தாலும், செயல்வகையைக் குறிக்கும் ஒருமை வினைப்பெயர் தமிழில் இயல்பானது. மதிப்பிட்டு வேறுபடுத்தி அறியும் கருத்தை இது தெரிவிக்கிறது.
- source_word: πνευμάτων
  choice: ஆவிகளை
  rationale: அவை நல்ல ஆவிகளா, தீய ஆவிகளா, மனித ஆவிகளா அல்லது உரைகளின் பின்னுள்ள ஆவிகளா என்பதை மூலவாக்கியம் வரையறுக்காததால் பொதுவான சொல்லே தக்கவைக்கப்பட்டது.
- source_word: γένη
  choice: பலவகை
  rationale: வகைகள் அல்லது பிரிவுகள் என்ற பன்மைக் கருத்தை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: γλωσσῶν
  choice: நாவுப் பேச்சுகள்
  rationale: γλῶσσα என்பதன் ‘நா’ மற்றும் ‘மொழி’ சார்ந்த பொருள் பரப்பை நினைவில் வைத்தபடி, ஆவிக்குரிய கொடை குறித்த பவுலின் உரையாடலில் உள்ள தெளிவுபடுத்தப்படாத தன்மையை இந்தச் சொற்றொடர் காக்கிறது. ‘மொழிகள்’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἑρμηνεία
  choice: விளக்கம் அளித்தல்
  rationale: நாவுப் பேச்சின் உள்ளடக்கத்தைப் புரியும்படி எடுத்துரைக்கும் செயலை இயல்பான தமிழில் குறிக்கிறது; இது வெறும் மொழிபெயர்ப்பு மட்டுமே என்று முடிவுசெய்யவில்லை.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: வேறொருவருக்கு / இன்னொருவருக்கு
  rationale: கொடைகள் வெவ்வேறு நபர்களுக்குப் பகிர்ந்தளிக்கப்படுவதைத் தத்திவ் அமைப்புக்கு ஏற்ப காட்டுகிறது. ἑτέρῳ வந்த இடத்தில் இயல்பான சிறிய சொல் மாற்றம் செய்யப்பட்டாலும் தனிப்பட்ட இறையியல் வேறுபாடு வற்புறுத்தப்படவில்லை.
theological_decisions:
- issue: கொடைப்பட்டியலில் δυνάμεων என்பதன் இயல்பு
  choice: ‘அற்புதச் செயல்பாடுகள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வல்லமைகளின் செயல்பாடுகள்’ அல்லது ‘வல்ல செயல்கள்’
  rationale: இச்சூழலில் δυνάμεις பொதுவாக அற்புதமான வல்ல செயல்களைக் குறிக்கிறது. பிரதான வாசகம் வாசகருக்குத் தெளிவாக இருக்கிறது; சொல்லுக்கு நெருக்கமான சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: γλωσσῶν என்பதன் பொருள்
  choice: இரு இடங்களிலும் ‘நாவுப் பேச்சுகள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மொழிகள்’
  rationale: இது அறியப்பட்ட மனித மொழிகளையா, தனித்துவமான ஆவிக்குரிய பேச்சையா, அல்லது விரிந்த ஒரு வகையையா குறிக்கிறது என்பதை உரை இங்கே தீர்மானிப்பதில்லை. ‘நாவுப் பேச்சுகள்’ அந்த விவாதத்தை முடித்துவைக்காமல் விடுகிறது; ‘மொழிகள்’ என்ற சாத்தியம் அடிக்குறிப்பில் உள்ளது.
- issue: ‘ஆவிகளைப் பகுத்தறிதல்’ என்பதில் πνευμάτων குறிக்கும் பொருள்
  choice: ‘ஆவிகள்’ என்ற பொதுவான பொருள் தக்கவைக்கப்பட்டது.
  alternative: ஆவிக்குரிய உரைகள்; உரைகளின் பின்னுள்ள ஆவிகள்; மனித ஆவிகள்; தீய ஆவிகள்
  rationale: கிரேக்க உரை எந்தக் குறிப்பிட்ட வகையையும் வெளிப்படையாகச் சொல்லவில்லை. ஆகவே விளக்கவுரையை மொழிபெயர்ப்புக்குள் சேர்க்காமல் தெளிவின்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. கிரேக்கத்தின் பட்டியல் வடிவும் மீண்டும் வரும் பகிர்ந்தளிப்பு அமைப்பும் அரைப்புள்ளிகளால் காக்கப்பட்டுள்ளன. இயல்பற்ற ‘பகுத்தறிதல்கள்’ போன்ற வடிவங்களைத் தவிர்த்து தமிழ் வினைப்பெயர்கள் பயன்படுத்தப்பட்டுள்ளன; அதேவேளை மூலத்தின் இறையியல் தெளிவின்மைகள் அடிக்குறிப்புகளிலும் பொதுவான சொற்களிலும் பாதுகாக்கப்பட்டுள்ளன.
