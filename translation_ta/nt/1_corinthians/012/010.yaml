  source_fidelity: மொத்தத்தில் பட்டியலின் பகிர்ந்தளிப்பு அமைப்பும், δυνάμεων, προφητεία, πνευμάτων ஆகியவற்றின் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ஆனால் γένη γλωσσῶν என்பதற்கான ‘பலவகை நாவுப் பேச்சுகள்’ என்பது கிரேக்கத்தின் ‘வகைகள்/பிரிவுகள்’ என்ற அமைப்பைத் தெளிவாகக் காட்டாமல், வழக்கமற்ற ஒரு கூட்டுச்சொல்லாகிறது. ‘பலவகையான நாவு மொழிகள்’ என்பது சொல்லின் இரட்டைப் பொருள் எல்லையைச் சாத்தியமான அளவு காக்கிறது; அடிக்குறிப்பு ‘மொழிகள்’ என்ற மாற்றைத் தெளிவுபடுத்துகிறது.
  naturalness: ‘அற்புதச் செயல்கள்’ மற்றும் ‘விளக்கமளித்தல்’ நவீன பொதுத்தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளன. ‘பலவகையான நாவு மொழிகள்’ என்பது ‘நாவுப் பேச்சுகள்’ என்பதைவிட வகைகளைச் சுட்டும் மூல அமைப்பைத் தெளிவாக வெளிப்படுத்துகிறது; இது சிறிது தனித்தன்மையுள்ள சொல்லாட்சி என்றாலும், அடிக்குறிப்புடன் சேர்ந்து உரையின் வேண்டுமென்றே காக்கப்பட்ட தெளிவின்மைக்கு உதவுகிறது.
  terminology: ‘இறைவாக்கு உரைத்தல்,’ ‘ஆவிகளைப் பகுத்தறிதல்,’ மற்றும் ‘விளக்கமளித்தல்’ ஆகியவை நடுநிலையான, பொருத்தமான சொற்கள். γλωσσῶν-ஐ வெறும் ‘மொழிகள்’ என முதன்மை உரையில் மாற்றாமல் இருப்பது விவாதத்துக்குரிய பொருளை முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
