source:
  edition: SBLGNT
  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: ta
  text: மேலும், காது, “நான் கண் அல்லாததால், நான் உடலைச் சேர்ந்ததல்ல” என்று சொன்னால்[a], அதனால் அது உடலைச் சேர்ந்ததல்ல என்று ஆகிவிடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் வழக்கமான சொல்லாக்கம்: “நான் உடலின் ஓர் உறுப்பு அல்ல” … “அதனால் அது உடலின் ஓர் உறுப்பு அல்லாமல் போய்விடாது.” கிரேக்க மூலத்தில் “உடலைச் சேர்ந்தது” என்ற கருத்தைத் தரும் அதே சொற்றொடர் வலியுறுத்தலுக்காக இருமுறை வருகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐὰν εἴπῃ
  choice: சொன்னாலும்
  rationale: ἐὰν உடன் வரும் இறந்தகால subjunctive ஒரு கற்பனையான நிபந்தனையைச் சுட்டுகிறது; தமிழில் ‘சொன்னாலும்’ என்பது அடுத்துவரும் மறுப்போடு இயல்பாக இணைகிறது. καὶ இங்கு தொடர்ச்சியைச் சுட்டினாலும், தனி வசனத்தில் தனியே ‘மேலும்’ சேர்ப்பது தேவையில்லை.
- source_word: τὸ οὖς
  choice: காது
  rationale: உடல் உறுப்பைக் குறிக்கும் வழக்கமான சொல்; உவமையில் மனிதரைப்போல் பேசுவதாக அமைந்துள்ளது.
- source_word: Ὅτι οὐκ εἰμὶ ὀφθαλμός
  choice: நான் கண் அல்ல என்பதால்
  rationale: ὅτι இங்கு கூற்றின் உள்ளடக்கத்தையும் காரணத் தொடர்பையும் அறிமுகப்படுத்துகிறது; ‘என்பதால்’ அந்த இரு அம்சங்களையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐκ τοῦ σώματος
  choice: உடலைச் சேர்ந்தது
  rationale: உறுப்புக்கும் உடலுக்கும் உள்ள பங்குடைமை/சேர்க்கை உறவை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்கத்தில் இருமுறை வரும் சொற்றொடரை தமிழிலும் அதே சொல்லாக்கத்தால் மீட்டுள்ளது.
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν
  choice: அதனால் ... அல்ல என்று ஆகிவிடாது
  rationale: முன்கூறிய காரணத்தின் அடிப்படையில் முடிவை மறுக்கும் கிரேக்க அமைப்பை, அதன் இரட்டை மறுப்பின் வாத வலிமையைத் தக்கவைத்து, புரியக்கூடிய தமிழில் தருகிறது.
theological_decisions:
- issue: பவுலின் உடல் உவமையில் உறுப்பின் சேர்ந்திருத்தலை எவ்வாறு வெளிப்படுத்துவது
  choice: ‘உடலைச் சேர்ந்தது’ என்ற ஒரே சொல்லாக்கத்தை இரு இடங்களிலும் மீண்டும் பயன்படுத்துதல்
  alternative: ‘உடலின் ஓர் உறுப்பு’ என்றும், பின்னர் ‘அதனால் அது உடலின் உறுப்பு அல்லாமல் போய்விடாது’ என்றும் விளக்கமாக மொழிபெயர்த்தல்
  rationale: மாற்றுச் சொல்லாக்கம் கருத்தைத் தெளிவாக்கினாலும், மூலத்தின் ἐκ τοῦ σώματος என்ற மீட்டுரையை விரிவாக்குகிறது. தேர்ந்தெடுத்த வடிவம் சபையைப் பற்றிய கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல், சேர்ந்திருத்தல் குறித்த வாதத்தையும் மீட்டுரையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. ‘அதனால் ... ஆகிவிடாது’ என்ற அமைப்பு மூலத்தின் வாதரீதியான இரட்டை மறுப்பைத் தமிழில் இயல்பாகக் காக்கிறது. அடிக்குறிப்பு குறியீடு கூற்றை அறிமுகப்படுத்தும் வினைக்குப் பின் வைக்கப்பட்டுள்ளது.
