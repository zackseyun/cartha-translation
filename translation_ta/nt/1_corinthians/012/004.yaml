  text: Διαιρέσεις δὲ χαρισμάτων εἰσίν, τὸ δὲ αὐτὸ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: ta
  text: வரங்கள் பலவகையாக உள்ளன[a]; ஆனால் அதே ஆவியானவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வரங்களின் பகிர்வுகள்” அல்லது “வரங்களுக்கிடையிலான வேறுபாடுகள்.” கிரேக்கச் சொல் சபையில் ஏற்படும் பிளவை அல்ல, வரங்களுக்குள் உள்ள பல்வகைமையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: பலவகையாக
  rationale: இச்சூழலில் சபைக்குள் பிளவுகளை அல்ல, வரங்களிடையே உள்ள வேறுபாடுகளையும் பல்வகைமையையும் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: δὲ ... δὲ
  choice: (முதல் δὲ வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை) ... ஆனால்
  rationale: முதல் δὲ உரையாடலின் அடுத்த கருத்துக்கு நகர்த்தும் மென்மையான இணைப்பாக இருப்பதால் தமிழில் தனிச்சொல் இன்றியே இயல்பாக அமைகிறது; இரண்டாவது δὲ பல்வகைமைக்கும் ஒருமைக்கும் இடையிலான முரணைச் சுட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: χαρισμάτων
  choice: வரங்கள்
  rationale: χάρισμα அருளால் கொடுக்கப்படும் கொடையைச் சுட்டினாலும், இச்சூழலில் ‘வரங்கள்’ என்பது தெளிவான, வழக்கமான தமிழ்; ‘ஆவிக்குரிய’ என்பதை மூலத்தில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: τὸ ... αὐτὸ
  choice: ஒருவரே
  rationale: ஆவியானவருடைய ஒருமையையும் அடையாளத்தின் ஒரே தன்மையையும் தமிழில் இயல்பாக வலியுறுத்துகிறது; பல வரங்களுக்கு ஆதாரம் ஒரே ஆவியானவர் என்பதைக் காட்டுகிறது.
- source_word: πνεῦμα
  choice: ஆவியானவர்
  rationale: 1 கொரிந்தியர் 12:3–11 சூழலில் இது வரங்களை வழங்கும் பரிசுத்த ஆவியானவரைக் குறிக்கிறது. நபரைக் குறிக்கும் மரியாதை வடிவம் தமிழில் இயல்பானது.
theological_decisions:
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: ஆவியானவர் (பரிசுத்த ஆவியானவர்)
  alternative: மனித ஆவி அல்லது ஓர் ஆவிக்குரிய ஆற்றல்
  rationale: உடனடியான சூழல் ஒரே ஆவியானவர் பல்வேறு வரங்களைப் பகிர்ந்தளிப்பதாக மீண்டும் மீண்டும் கூறுகிறது. ஆகவே விரிவாக்கமின்றி ‘ஆவியானவர்’ என்பது குறிப்பைத் தெளிவாக வைத்திருக்கிறது.
- issue: τὸ αὐτὸ πνεῦμα என்பதன் ஒருமை வலியுறுத்தல்
  choice: ஆவியானவர் ஒருவரே
  alternative: அதே ஆவியானவர்
  rationale: ‘அதே ஆவியானவர்’ மூல வடிவத்துக்கு நெருக்கமானது; எனினும் முன்பே ஓர் ஆவியானவர் குறிப்பிடப்படாத தனி வசனத் தமிழில் அது சற்றுத் தொங்கலாகத் தோன்றலாம். ‘ஒருவரே’ என்பது பல்வகையான வரங்களுக்கு நடுவிலுள்ள ஒரே தெய்வீக ஆதாரத்தை இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. ‘ஆவியானவர்’ என்ற மரியாதைமிக்க ஆள்சுட்டு வடிவம் சூழலிலுள்ள தெய்வீக நபரைக் குறிக்கிறது.
