id: 1CO.12.12
reference: 1 Corinthians 12:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: ta
  text: ஏனெனில், உடல் ஒன்றாக இருக்கிறது, அதற்கு பல உறுப்புகள் உள்ளன; உடலின் உறுப்புகள் அனைத்தும் பலவாக இருந்தாலும் ஒரே உடலாக இருக்கின்றன. அதுபோலவே மேசியாவும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் இச்சொற்றொடர் நேரடியாக, “அதுபோலவே மேசியாவும்” என்று உள்ளது; “மேசியாவின் உடலும்” அல்லது “திருச்சபையும்” என்ற சொற்கள் சேர்க்கப்படவில்லை. ‘மேசியா’ என்பதைக் ‘கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: மூலத்தின் சுருக்கமான இறையியல் கூற்றையும் Χριστός என்பதற்கான மாற்று மொழிபெயர்ப்பையும் விளக்குதல்
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: ஏனெனில் … அதுபோலவே
  rationale: γάρ என்பதன் விளக்கத் தொடர்பை ‘ஏனெனில்’ என்றும், καθάπερ தொடங்கும் ஒப்புமையை அதன் முடிவிலுள்ள οὕτως καί உடன் இயல்பான தமிழில் ‘அதுபோலவே’ என்றும் வெளிப்படுத்துகிறது.
- source_word: τὸ σῶμα
  choice: உடல்
  rationale: பவுலின் உடல் உருவகத்திற்கான நேரடியான, இயல்பான தமிழ்ச் சொல்.
- source_word: ἕν
  choice: ஒன்று / ஒரே
  rationale: முதல் இடத்தில் ‘ஒன்று’ என்றும், ஒருங்கிணைந்த ஒரே உடலைக் குறிக்கும் பயனிலையில் ‘ஒரே’ என்றும் வழங்குவது தமிழில் இயல்பாக இருந்து எண்ணியல் ஒருமையையும் கருத்தியல் ஒற்றுமையையும் காக்கிறது.
- source_word: μέλη
  choice: உறுப்புகள்
  rationale: உடலின் அங்கங்களையும், தொடர்ந்து வரும் சமூகப் பயன்பாட்டையும் இயல்பாகத் தாங்கும் சொல்.
- source_word: πολλὰ ὄντα
  choice: பலவாயிருந்தும்
  rationale: பல உறுப்புகள் இருப்பதற்கும் அவை ஒரே உடலாக இருப்பதற்கும் இடையிலான விட்டுக்கொடுக்கும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: οὕτως καὶ ὁ Χριστός
  choice: அதுபோலவே மேசியாவும்
  rationale: ஒப்புமையின் முடிவைச் சுருக்கமாகக் காத்து, Χριστός என்பதை அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயரின் பொருளோடு ‘மேசியா’ என வழங்குகிறது; மூலத்தில் இல்லாத ‘உடல்’ அல்லது ‘திருச்சபை’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ὁ Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός ஒரு இறையியல் பட்டப்பெயராக நிற்கிறது. ‘மேசியா’ அதன் பட்டப்பெயர் தன்மையைத் தெளிவாகக் காக்கிறது; ‘கிறிஸ்து’ என்பது தமிழ்க் கிறிஸ்தவ வழக்கில் நிலைபெற்ற மாற்று வடிவம்.
- issue: ‘அதுபோலவே மேசியாவும்’ என்ற சுருக்கமான கூற்று
  choice: மூலத்தின் சுருக்கத்தையும் இறையியல் அழுத்தத்தையும் அப்படியே வைத்தல்
  alternative: அதுபோலவே மேசியாவின் உடலும் / திருச்சபையும்
  rationale: கிரேக்க மூலத்தில் ‘மேசியாவின் உடல்’ அல்லது ‘திருச்சபை’ என்று வெளிப்படையாக இல்லை. அத்தகைய விரிவாக்கம் அடுத்த வசனங்கள் விளக்கும் பொருளை இவ்வசனத்துக்குள் சேர்த்துவிடும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. உடல் உருவகம் தெளிவாக இருக்க ‘உடல்’, ‘உறுப்புகள்’ ஆகியவை தொடர்ந்து வழங்கப்பட்டுள்ளன. மூலத்தின் நீண்ட ஒப்புமை தமிழில் வாசிக்க ஏதுவாக அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளது.
