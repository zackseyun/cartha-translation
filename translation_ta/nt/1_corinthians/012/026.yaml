language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: ta
  text: ஓர் உறுப்பு துன்பப்பட்டால், எல்லா உறுப்புகளும் அதனுடன் சேர்ந்து துன்பப்படுகின்றன; ஒரு உறுப்பு கௌரவிக்கப்படுமானால்[a], எல்லா உறுப்புகளும் அதனுடன் சேர்ந்து மகிழ்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மகிமைப்படுத்தப்படுமானால்.’ இங்கே ஒரு உறுப்பு கௌரவம் பெறுவதையே இச்சொல் பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: …பட்டால் … பெற்றால்
  rationale: இந்த இணையான அமைப்பு இரண்டு நிகழ்நிலைகளை முன்வைக்கிறது. தமிழில் இரு வினைகளிலும் நிபந்தனை விகுதியைப் பயன்படுத்துவது இயல்பாகவும் பவுலின் இணை அமைப்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: ἓν μέλος / μέλος
  choice: ஓர் உறுப்பு
  rationale: உடலைப் பற்றிய உருவகத்தைத் தெளிவாகக் காக்க ‘உறுப்பு’ தேர்ந்தெடுக்கப்பட்டது. முதல் இடத்தில் உள்ள ἓν என்பதற்கு ‘ஓர்’ நேரடியாகப் பொருந்துகிறது; இரண்டாம் இடத்தில் எண் இல்லாவிட்டாலும், தமிழில் ‘ஓர் உறுப்பு’ என்பது குறிப்பற்ற ஒருமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάσχει
  choice: துன்பப்பட்டால்
  rationale: வலி, இடர், வேதனை ஆகியவற்றை அளவுக்கு மீறிக் குறிப்பாக்காமல், வினையின் பரந்த பொருளை ‘துன்பப்படு’ காக்கிறது.
- source_word: συμπάσχει
  choice: அதனுடன் சேர்ந்து துன்பப்படுகின்றன
  rationale: συν- முன்னொட்டில் உள்ள பகிர்ந்துகொள்ளும் ஒற்றுமையை ‘அதனுடன் சேர்ந்து’ வெளிப்படையாகக் காட்டுகிறது; ஒருமையான உறுப்பை ‘அதனுடன்’ சுட்டுகிறது.
- source_word: πάντα τὰ μέλη
  choice: எல்லா உறுப்புகளும்
  rationale: மூலத்தில் இருமுறை வரும் சொற்றொடரை ஒரே விதமாக மொழிபெயர்த்து, வலியுறுத்தலையும் உடல் உருவகத்தையும் காக்கிறது.
- source_word: δοξάζεται
  choice: மதிக்கப் பெற்றால்
  rationale: இந்தச் சூழலில் ஓர் உறுப்பு பெறும் மதிப்பு அல்லது கௌரவமே முதன்மையான பொருள். செயப்பாட்டு வடிவமும் காக்கப்பட்டுள்ளது.
- source_word: συγχαίρει
  choice: அதனுடன் சேர்ந்து மகிழ்கின்றன
  rationale: συν- முன்னொட்டு குறிக்கும் பகிர்ந்த மகிழ்ச்சியை ‘அதனுடன் சேர்ந்து’ வெளிப்படுத்துகிறது; முன் அரைவாக்கியத்தின் அமைப்புடனும் இணைகிறது.
theological_decisions:
- issue: சபை என்னும் உடல் உருவகத்தில் δοξάζεται என்பதன் பொருள்
  choice: சமூக உறவுக்குள் மதிக்கப்படுதல் (‘மதிக்கப் பெற்றால்’)
  alternative: மகிமைப்படுத்தப்பட்டால்
  rationale: உடலின் உறுப்புகள் ஒன்றுக்கொன்று காட்டும் அக்கறையும் பகிர்ந்த அனுபவமும் உடனடிச் சூழலாக உள்ளன. எனவே இறுதிக்கால அல்லது தெய்வீக மகிமைப்படுத்தலைத் தேவையின்றி உள்ளே கொண்டுவராமல், சமூக மதிப்பின் பொருள் முதன்மை உரையில் தரப்படுகிறது; சொல்லின் மற்ற சாத்தியமான பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உறுப்பு’ என்பதன் மூலம் உடல் உருவகமும் சபை உறுப்பினர் என்ற தொடர்பும் காக்கப்படுகின்றன. மூலத்தின் இணையான இரு அரைவாக்கியங்களும் பகிர்ந்த துன்பம்—பகிர்ந்த மகிழ்ச்சி என்ற சமநிலையுடன் அமைக்கப்பட்டுள்ளன.
