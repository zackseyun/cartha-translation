source:
  edition: SBLGNT
  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: ta
  text: ஆனால், மேன்மையான வரங்களை ஆர்வத்துடன் நாடுங்கள்.[a] இன்னும் மிகச் சிறந்த ஒரு வழியை உங்களுக்குக் காட்டுகிறேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால், நீங்கள் மேன்மையான வரங்களை ஆர்வத்துடன் நாடுகிறீர்கள்.” இங்குள்ள கிரேக்க வினைச்சொல் கட்டளையாகவும் நிகழ்காலக் கூற்றாகவும் வாசிக்கப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “மிகச் சிறந்த” என்பதற்கு, “மேலும் உன்னதமான” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: ஆர்வத்துடன் நாடுங்கள்
  rationale: வலுவான விருப்பத்தையும் தீவிரமான நாடுதலையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. இங்கு கட்டளைப் பொருள் முதன்மை உரையில் ஏற்கப்பட்டுள்ளது; இலக்கண ரீதியாகச் சாத்தியமான நிகழ்காலக் கூற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: χαρίσματα
  choice: வரங்கள்
  rationale: சூழலில் இவை அருளால் அளிக்கப்படும் ஆவிக்குரிய கொடைகள் என்பதை ‘வரங்கள்’ இயல்பாக உணர்த்துகிறது; மூலத்தில் இக்கூற்றில் இல்லாத ‘ஆவிக்குரிய’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: μείζονα
  choice: மேன்மையான
  rationale: அளவு மட்டுமல்ல, முக்கியத்துவத்திலும் உயர்ந்தவை என்ற ஒப்பீட்டுப் பொருளை இச்சூழலில் இயல்பாகத் தருகிறது.
- source_word: καὶ ἔτι
  choice: இன்னும்
  rationale: முந்தைய உரையுடன் தொடர்ச்சியையும், அதைக் கடந்து மேலான ஒன்றை அறிமுகப்படுத்தும் ஏற்றத்தையும் வெளிப்படுத்துகிறது.
- source_word: καθ’ ὑπερβολὴν
  choice: மிகச் சிறந்த
  rationale: அளவுக்கு அப்பாற்பட்ட மேன்மை அல்லது ஒப்பற்ற சிறப்பு என்ற பொருளை வாசிக்க இயல்பான தமிழில் தருகிறது. மிக நேரடியான ‘மிஞ்சிச் சிறந்த’ என்பது தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: ὁδὸν
  choice: ஒரு வழியை
  rationale: வாழ்க்கை முறை அல்லது நடத்தைப் பாதை என்ற உருவகத்தை ‘வழி’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: δείκνυμι
  choice: காட்டுகிறேன்
  rationale: கிரேக்க நிகழ்காலத்தை நேரடியாகப் பாதுகாக்கிறது; அடுத்த அதிகாரத்தில் பவுல் உடனே அந்த வழியை எடுத்துரைப்பதற்கும் இயல்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: ζηλοῦτε என்பதன் வினைநிலை
  choice: 'கட்டளை: ‘ஆர்வத்துடன் நாடுங்கள்’'
  alternative: 'கூற்று: ‘நீங்கள் மேன்மையான வரங்களை ஆர்வத்துடன் நாடுகிறீர்கள்’'
  rationale: இவ்வடிவம் இச்சூழலில் கட்டளையாகவும் நிகழ்காலக் கூற்றாகவும் வாசிக்கப்படலாம். அதிகாரத்தின் அறிவுறுத்தல் ஓட்டத்திற்குக் கட்டளைப் பொருள் நன்கு பொருந்துவதால் அது முதன்மை உரையில் உள்ளது; உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: καθ’ ὑπερβολὴν என்பதன் தீவிரம்
  choice: ‘மிகச் சிறந்த’
  alternative: ‘எல்லாவற்றையும் மிஞ்சிய’ அல்லது பாரம்பரியமாக ‘மேலும் உன்னதமான’
  rationale: அன்பின் வழியை வெறும் மற்றொரு உயர்ந்த வரமாகச் சுருக்காமல், அது ஒப்பற்ற மேன்மையுடைய வழி என்பதைத் தெரிவிக்கிறது; அதேவேளை மூலத்தை விட அதிகமான இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வரங்கள்’, ‘வழி’ ஆகிய சொற்கள் திருச்சபைச் சூழலில் பரிச்சயமானவையாக இருந்தாலும் இயல்பான பொதுத்தமிழிலும் புரியும். கிரேக்கத்தின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
