  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: ta
  text: ஊழியங்களில் பல வகைகள் உள்ளன[a]; ஆண்டவர் ஒருவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பல்வேறு சேவைகள்” அல்லது “பல்வேறு சேவை முறைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: பல்வேறு
  rationale: இங்கு பிளவுகள் அல்ல, ஒருமைக்குள் காணப்படும் வேறுபட்ட வகைகளே குறிக்கப்படுகின்றன. ‘பல்வேறு’ என்பது முரண்பாட்டைக் குறிக்காமல் அந்த வேறுபாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: διακονιῶν
  choice: ஊழியங்கள்
  rationale: திருச்சபையில் ஆற்றப்படும் சேவைப் பணிகளையும் அவற்றின் வேறுபட்ட செயல்பாடுகளையும் குறிக்க ‘ஊழியங்கள்’ பொருத்தமான, வழக்கிலுள்ள திருச்சபைத் தமிழ்ச் சொல். ‘சேவைகள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὁ αὐτὸς
  choice: ஒருவரே
  rationale: வேறுபட்ட ஊழியங்களுக்கிடையிலும் ஆண்டவரின் ஒருமையை வலியுறுத்தும் இயல்பான தமிழ் வடிவம். இது சொற்சொல்லாக ‘அதே’ என்பதற்குப் பதிலாக நபரைக் குறிக்கும் தமிழ்நடைக்கு ஏற்ற சமமான வெளிப்பாடு.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான இயல்பான, கண்ணியமான தமிழ் வேதாகமப் பட்டப்பெயர். இங்கு யாரைக் குறிக்கிறது என்பதை உரையில் விரிவாக்காமல் வைத்திருக்கிறது.
- source_word: καὶ
  choice: ஆனால்
  rationale: கிரேக்க καὶ அடிப்படையில் இணைப்புச் சொல் என்றாலும், பல்வகைமைக்கும் ஒரே ஆண்டவருக்கும் இடையிலான ஒப்பீட்டு மாறுபாட்டை இயல்பான தமிழில் ‘ஆனால்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰσιν
  choice: இருக்கின்றன
  rationale: பன்மை இருப்பைத் தெரிவிக்கும் எளிய, இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: 1 கொரிந்தியர் 12:4–6-இன் மும்மை அமைப்பில் ‘ஆண்டவர்’ என்பதன் குறிப்பு
  choice: உரையில் ‘ஆண்டவர்’ என்ற பட்டப்பெயர் மட்டும் வைக்கப்படுகிறது; பெயர் சேர்க்கப்படவில்லை.
  alternative: ‘ஆண்டவராகிய இயேசு’ என்று வெளிப்படையாக விரிவாக்குதல், அல்லது பொதுவாக இறைவனைக் குறிக்கும் சொல்லாகப் புரிந்துகொள்ளுதல்.
  rationale: சூழலில் ஆவியானவர், ஆண்டவர், கடவுள் என்ற மும்மை அமைப்பு இருப்பதால் இது பெரும்பாலும் இயேசுவைக் குறிக்கிறது. ஆயினும் மூலவாசகம் பெயரைச் சேர்க்காததால், அதன் சுருக்கத்தையும் சிறு தெளிவின்மையையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. 4–6 வசனங்களின் இணை அமைப்பை மனதில் கொண்டு, பல்வகைமைக்கும் ஆண்டவரின் ஒருமைக்கும் இடையிலான சமநிலை பாதுகாக்கப்பட்டுள்ளது.
