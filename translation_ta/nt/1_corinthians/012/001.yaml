translation:
  language: ta
  text: ஆவிக்குரிய வரங்களைக் குறித்து[a], சகோதரர்களே[b], நீங்கள் அறியாமல் இருப்பதை நான் விரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவிக்குரிய காரியங்களைக் குறித்து.” கிரேக்கச் சொல் “வரங்கள்” என்பதைவிட விரிந்த பொருளுடையது; எனினும் இந்த அதிகாரத்தின் சூழல் ஆவியானவர் அளிக்கும் வரங்களை மையப்படுத்துகிறது.
    reason: alternative_reading
  - marker: b
    text: “சகோதரர்களே” என்பது சபையாரை அழைக்கும் பவுலின் வழக்கமான சொல்; இங்கு அது பெண்களையும் உள்ளடக்கியிருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: குறித்து
  rationale: περί புதிய பொருளை அறிமுகப்படுத்தும் ‘குறித்து/பற்றி’ என்ற பொருளைத் தருகிறது; δέ-யின் மென்மையான உரைமாற்றச் செயல்பாட்டைத் தமிழில் தேவையற்ற காலச்சொல் சேர்க்காமல் வாக்கிய அமைப்பே உணர்த்துகிறது.
- source_word: τῶν πνευματικῶν
  choice: ஆவிக்குரிய வரங்கள்
  rationale: πνευματικῶν என்பது பெயர்ச்சொல் இல்லாமல் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெயரடை; சொற்படியாக இது ‘ஆவிக்குரியவை’ என விரிந்த பொருள் தரக்கூடும். ஆனால் 12:4–11 இல் ஆவியானவர் அளிக்கும் வரங்களும் வெளிப்பாடுகளும் பேசப்படுவதால், சூழலுக்கேற்ற தெளிவான மொழிபெயர்ப்பாக ‘ஆவிக்குரிய வரங்கள்’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: அழைப்புவேற்றுமையில் உள்ள ஆண்பால் பன்மையை நேரடியாகவும் மரியாதையான நவீன தமிழிலும் தருகிறது. பவுல் இதைச் சபை முழுவதையும் அழைக்கும் சொல்லாகப் பயன்படுத்துவதால் பெண்களும் உட்பட்டிருக்கலாம் என்பதைக் அடிக்குறிப்பு விளக்குகிறது.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: நீங்கள் அறியாமல் இருப்பதை நான் விரும்பவில்லை
  rationale: ‘நீங்கள் அறியாதிருக்க வேண்டும் என்பது என் விருப்பமல்ல’ என்ற பவுலின் வழக்கமான போதனை அறிமுகப்படுத்தும் சொற்றொடரை, இழிவான நிழற்பொருள் இல்லாமல் இயல்பான தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: τῶν πνευματικῶν என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘ஆவிக்குரிய வரங்கள்’
  alternative: ‘ஆவிக்குரிய காரியங்கள்’; இலக்கண ரீதியில் ‘ஆவிக்குரியவர்கள்’ என்பதும் சாத்தியம்
  rationale: இந்தக் கிரேக்கச் சொல் வெளிப்படையான பெயர்ச்சொல் இல்லாததால் உண்மையான பொருள் விரிவைக் கொண்டுள்ளது. உடனடியான சூழல் ஆவியானவர் வழங்கும் வரங்களையும் அவற்றின் வெளிப்பாடுகளையும் மையப்படுத்துவதால் ‘வரங்கள்’ சூழலுக்கு மிகவும் இயல்பானது; எனினும் மூலத்தில் ‘வரங்கள்’ என்ற சொல் வெளிப்படையாக இல்லை என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆவி’ என்பதுடன் தொடர்புடைய பொருளைத் தெளிவாகக் காட்ட ‘ஆவிக்குரிய’ பயன்படுத்தப்பட்டது. மூலத்தின் சொல்வரிசையை பெருமளவு காத்து, தமிழில் புரிந்துகொள்ளக்கூடிய வாக்கிய ஓட்டம் வழங்கப்பட்டுள்ளது.
