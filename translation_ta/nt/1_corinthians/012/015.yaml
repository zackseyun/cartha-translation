reference: 1 Corinthians 12:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: ta
  text: கால், “நான் கை அல்ல என்பதால், நான் உடலுக்குச் சேர்ந்ததல்ல” என்று சொன்னால்[a], அதனாலேயே அது உடலுக்குச் சேர்ந்ததல்ல என்று ஆகிவிடுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் இயல்பாக: “நான் உடலின் ஓர் அங்கம் அல்ல ... அதனால் அது உடலின் ஓர் அங்கம் அல்லாமல் போய்விடுமா?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: சொன்னால்
  rationale: ἐὰν உடன் வரும் இறந்தகால வினைமுற்று இங்கு பொதுவான கற்பனை நிபந்தனையை அறிமுகப்படுத்துகிறது. ‘சொன்னால்’ என்பது அதன் நிபந்தனைத் தன்மையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ὁ πούς
  choice: கால்
  rationale: பவுலின் உடல்-உறுப்பு உருவகம் உறுதியான உடல் உறுப்புகளின் ஒப்புமையைச் சார்ந்திருப்பதால், சொல்லை நேரடியாகப் பாதுகாக்கிறது.
- source_word: Ὅτι
  choice: என்பதால்
  rationale: ὅτι இங்கு காலின் கூற்றை அறிமுகப்படுத்துவதோடு காரணப் பொருளையும் கொண்டுள்ளது; ‘என்பதால்’ அந்தக் குறையின் தர்க்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: χείρ
  choice: கை
  rationale: ‘கால்’ என்பதுடனான நேரடி முரண்பாட்டையும் உடல் உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ἐκ τοῦ σώματος
  choice: உடலைச் சேர்ந்தவன் / உடலைச் சேர்ந்தது
  rationale: இச்சூழலில் ἐκ உறுப்புநிலை அல்லது சார்பைச் சுட்டுகிறது. ‘உடலைச் சேர்ந்த’ என்பது ‘உடலிலிருந்து’ என்ற இயல்பற்ற சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்தும், இரு இடங்களிலும் மூலத்தின் மீளுரைப்பைத் தக்கவைத்தும் உள்ளது. மேற்கோளில் கால் மனிதரைப் போலப் பேசுவதால் ‘சேர்ந்தவன்’ என்றும், பின்னர் காலைக் குறிக்கும் போது ‘சேர்ந்தது’ என்றும் தமிழின் இயல்பான பால் அமைப்பு பயன்படுத்தப்படுகிறது.
- source_word: οὐ παρὰ τοῦτο
  choice: அதனாலேயே
  rationale: கால் கூறிய அதே காரணத்தின் அடிப்படையில் அதன் முடிவு உண்மையாகிவிடாது என்பதை வலியுறுத்துகிறது; ‘-ஏ’ எதிர்மறை வினாவோடு சேர்ந்து கிரேக்கத்தின் மறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: அது உடலைச் சேர்ந்தது அல்ல என்று ஆகிவிடுமா?
  rationale: கிரேக்கத்தின் மறுப்புடன் கூடிய சொல்லாட்சியையும் பதில் ‘இல்லை’ என எதிர்பார்க்கும் வினாவையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: உடல் உருவகத்தில் உறுப்புநிலையை எவ்வளவு விளக்கமாகச் சொல்லுவது
  choice: மூலத்தில் மீண்டும் வரும் ‘உடலைச் சேர்ந்த’ என்ற சொல்லாட்சியையும் மறுப்புச் சார்ந்த வினாவையும் பாதுகாத்தல்
  alternative: ‘உடலின் ஓர் அங்கம் அல்ல ... அதனால் அது உடலின் ஓர் அங்கம் அல்லாமல் போய்விடுமா?’ என்று கருத்தை மேலும் இயல்பாக்குதல்
  rationale: இங்கு தனிப்பட்ட கோட்பாட்டைத் தீர்மானிக்க வேண்டிய தெளிவின்மை இல்லை. ஆயினும் பவுலின் வாதத்தில் உள்ள மீளுரைப்பையும், கால் தன்னை விலக்கிக்கொள்ளும் கூற்றை வினா மூலம் மறுக்கும் அமைப்பையும் பாதுகாப்பது மூலத்திற்கு வெளிப்படையான நெருக்கத்தை அளிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதைமிக்கவும் எளிதில் புரியக்கூடியதாகவும் வடிவமைக்கப்பட்டது. ‘உடலைச் சேர்ந்த’ என்ற மீளுரை மூலத்தின் அமைப்பைத் தக்கவைக்கிறது; வாக்கிய முடிவிலுள்ள எதிர்மறை வினா பவுலின் மறுப்புத் தொனியை இயல்பாக வழங்குகிறது.
