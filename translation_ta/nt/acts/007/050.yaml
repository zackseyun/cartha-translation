base_translation:
  language: en
  yaml_path: translation/nt/acts/007/050.yaml
  text: Did not my hand make all these things?[a][b]
translation:
  language: ta
  text: என் கை இவை அனைத்தையும் உண்டாக்கவில்லையா?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, பொருளை மையமாகக் கொண்டு: ‘நானே இவை அனைத்தையும் உண்டாக்கவில்லையா?’'
    reason: lexical_alternative
  - marker: b
    text: இந்த வரி ஏசாயா 66:2-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: உண்டாக்கவில்லையா?
  rationale: οὐχί உறுதியான ஆம் பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. தமிழில் எதிர்மறை வினை வடிவம் அந்த வினாவியல் அழுத்தத்தை இயல்பாகக் காக்கிறது.
- source_word: ἡ χείρ μου
  choice: என் கையே
  rationale: χείρ என்பதன் நேர்ப்பொருள் ‘கை’. ஏசாயா 66:2-ன் உருவக மொழியைப் பாதுகாக்க ‘என் கை’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘-ஏ’ வினாவின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐποίησεν
  choice: உண்டாக்க
  rationale: ποιέω இங்கு படைப்புச் சூழலில் ஒன்றை இருப்புக்கு வரச்செய்தலைக் குறிக்கிறது. ‘உண்டாக்கு’ என்பது நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ταῦτα πάντα
  choice: இவை அனைத்தையும்
  rationale: ταῦτα என்பதன் சுட்டுப்பொருளையும் πάντα என்பதன் முழுமையான பரப்பையும் இந்தச் சொற்றொடர் காக்கிறது.
theological_decisions:
- issue: கடவுளைக் குறித்த மனித உடலுறுப்பு உருவகம்
  choice: ‘என் கை’ என்ற தெய்வீகச் செயலாண்மையைக் குறிக்கும் உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘நானே இவை அனைத்தையும் உண்டாக்கவில்லையா?’ என்று இயக்கநிகர்ப்பாக மொழிபெயர்த்தல்
  rationale: இது ஏசாயா 66:2-ஐ எதிரொலிக்கும் மேற்கோள். ‘என் கை’ என்ற உருவகத்தைத் தக்கவைப்பது வேதவாக்கியத்தின் காட்சியையும் வினாவியல் வலிமையையும் பாதுகாக்கிறது; அதை ‘வல்லமை’ என்று விளக்கி இறையியல் பொருளை முன்கூட்டியே தீர்மானிப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் எதிர்மறை வினாவும் ‘என் கை’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
