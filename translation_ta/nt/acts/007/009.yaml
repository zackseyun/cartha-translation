revisions:
- from: முற்பிதாக்கள் யோசேப்பின்மேல் பொறாமைகொண்டு, அவரை எகிப்துக்குக் கொண்டுபோகும்படி விற்றுவிட்டார்கள். ஆனால் கடவுள் அவரோடு இருந்தார்.
  to: முற்பிதாக்கள் யோசேப்பின்மேல் பொறாமைகொண்டு, அவரை எகிப்துக்கு விற்றார்கள்; கடவுள் அவரோடு இருந்தார்.
  rationale: The revision removes the added purposive sense and renders the destination directly. It also replaces the interpretively adversative “ஆனால்” with simple coordination, preserving the Greek wording and its restrained theological presentation.
