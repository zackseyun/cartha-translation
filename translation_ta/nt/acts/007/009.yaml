source:
  edition: SBLGNT
  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: ta
  text: முற்பிதாக்கள் யோசேப்பின்மேல் பொறாமைகொண்டு, அவரை எகிப்துக்கு விற்றார்கள்; கடவுள் அவரோடு இருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: முற்பிதாக்கள்
  rationale: இங்கு யாக்கோபின் மக்களாகிய இஸ்ரயேலின் குல முன்னோர்களைக் குறிப்பதால், வரலாற்று-இறையியல் பொருளைத் துல்லியமாக வெளிப்படுத்தும் வழக்கமான சொல்.
- source_word: ζηλώσαντες
  choice: பொறாமைகொண்டு
  rationale: முதன்மைச் செயலான விற்றதற்கான உள்நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπέδοντο
  choice: விற்றுவிட்டார்கள்
  rationale: ஆதியாகமப் பின்னணியிலும் இச்சூழலிலும் யோசேப்பைப் பணத்திற்கு விற்ற செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: εἰς Αἴγυπτον
  choice: எகிப்துக்குக் கொண்டுபோகும்படி
  rationale: யோசேப்பு எகிப்தின் எல்லைக்குள் நேரடியாக சகோதரர்களால் விற்கப்பட்டார் என்று தவறாகப் புரிந்துகொள்ளாமல், எகிப்தை நோக்கிய விற்பனையின் இலக்கை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: கடவுள் அவரோடு இருந்தார்
  rationale: தெய்வீக உடனிருப்பை எளிமையாகவும் நேரடியாகவும் கூறுகிறது; சுட்டுப்பெயரின் முன்னிலைத் தொடர்பும் தெளிவாக உள்ளது.
theological_decisions:
- issue: யோசேப்பின் துன்பத்தில் கடவுளின் உடனிருப்பு
  choice: ஆனால் கடவுள் அவரோடு இருந்தார்
  alternative: கடவுள் அவரோடு இருந்தார்
  rationale: καί இங்கு சகோதரர்களின் துரோகத்துக்கும் கடவுளின் உடனிருப்புக்கும் இடையிலான கருத்து வேறுபாட்டை இணைக்கிறது. தமிழ் நடையில் ‘ஆனால்’ அந்தத் த tension-ஐ இயல்பாக வெளிப்படுத்துகிறது; அதேவேளை, தெய்வ பராமரிப்பைப் பற்றிய கூடுதல் கருத்தை வசனத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘முற்பிதாக்கள்’ என்ற வரலாற்று-இறையியல் சொல் தக்கவைக்கப்பட்டுள்ளது; மற்ற பகுதிகள் இயல்பான தமிழ்ச் சொற்றொடராக அமைக்கப்பட்டுள்ளன.
