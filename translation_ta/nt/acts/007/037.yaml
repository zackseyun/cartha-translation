id: ACT.7.37
reference: Acts 7:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: ta
  text: “இஸ்ரவேல் மக்களிடம்[a], ‘உங்கள் சகோதரர்களிலிருந்து[b] என்னைப் போன்ற ஓர் இறைவாக்கினரை[c] கடவுள் உங்களுக்காக எழுப்புவார்’ என்று சொன்ன மோசே இவர்தான்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லளவில், “இஸ்ரவேலின் மகன்களிடம்”; இங்கு இஸ்ரவேல் மக்களை, அதாவது இஸ்ரவேலர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “சகோதரர்கள்” என்பது உடன்பிறந்தவர்களை மட்டும் அல்ல, சக இஸ்ரவேலர்களைக் குறிக்கிறது; கிரேக்கச் சொல் ஆண்பால் பன்மையில் உள்ளது.
    reason: cultural_note
  - marker: c
    text: உபாகமம் 18:15-ஐ அடிப்படையாகக் கொண்ட இந்த வாக்குறுதி, அப்போஸ்தலர் நடபடிகளின் சூழலில் இயேசுவுக்குப் பொருத்தப்படுகிறது. ஆகவே இதை விளக்கமாக “எதிர்பார்க்கப்பட்ட அந்த இறைவாக்கினர்” என்றும் புரிந்துகொள்ளலாம்; ஆனால் இங்கு கிரேக்கம் வெறுமனே “இறைவாக்கினர்” என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: மோசே இவர்தான்
  rationale: οὗτός என்பதன் சுட்டிக்காட்டும் வலியுறுத்தலையும், குறிப்பிட்ட மோசேயை அடையாளப்படுத்தும் கிரேக்க அமைப்பையும் இயல்பான தமிழில் பின்னிலையிலுள்ள ‘இவர்தான்’ தெளிவாகக் காக்கிறது.
- source_word: εἴπας
  choice: என்று சொன்ன
  rationale: மோசேயை விவரிக்கும் இறந்தகாலப் பெயரெச்சத்தின் பொருளை இயல்பான தமிழ் தொடர்புச் சொற்றொடராக வழங்குகிறது.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: இஸ்ரவேல் மக்களிடம்
  rationale: கிரேக்கத்தில் சொல்லளவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் மக்களையும் குறிக்கும் வழக்குச் சொல்லை நவீன தமிழில் இயல்பாகத் தருகிறது; சொல்லளவிலான வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: Προφήτην
  choice: ஓர் இறைவாக்கினரை
  rationale: கடவுளின் செய்தியை அறிவிப்பவரைக் குறிக்கும் சொல். ‘ஓர்’ என்பது குறிப்பிட்ட இறையியல் அடையாளத்தை முதன்மை உரையிலேயே திணிக்காமல் கிரேக்கத்தின் இயல்பான பொருளைக் காக்கிறது.
- source_word: ἀναστήσει
  choice: எழுப்புவார்
  rationale: கடவுள் அந்த இறைவாக்கினரை மக்களிடையே தோன்றச் செய்வார் என்ற தீர்க்கவாக்குச் சூழலையும், மூல வினைச்சொல்லின் உருவகத்தையும் காக்கிறது.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: உங்கள் சகோதரர்களிலிருந்து
  rationale: ἐκ என்பதன் ‘அவர்களுள் இருந்து’ என்ற மூலப்பொருளையும், ἀδελφῶν என்பதன் குடும்ப-தேசிய உறவுமொழியையும் காக்கிறது.
- source_word: ὡς ἐμέ
  choice: என்னைப் போன்ற
  rationale: மோசேயுடனான ஒப்புமையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உபாகமம் 18:15 மேற்கோளின் கிறிஸ்துவைச் சுட்டும் முக்கியத்துவம்
  choice: முதன்மை உரையில் ‘ஓர் இறைவாக்கினர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘எதிர்பார்க்கப்பட்ட அந்த இறைவாக்கினர்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: அப்போஸ்தலர் நடபடிகளின் சூழலில் இவ்வசனம் இயேசுவோடு தொடர்புபடுத்தப்பட்டாலும், இங்குள்ள கிரேக்கச் சொற்றொடர் அந்த விளக்கத்தை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை. எனவே தீர்க்கவாக்கின் கிறிஸ்துவியல் முக்கியத்துவத்தை மறுக்காமலும் அதை மொழிபெயர்ப்பிலேயே முடிவுசெய்யாமலும் ambiguity காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இறைவாக்கினர்’ என்பது தற்போதைய வாசகருக்கு பொருள் தெளிவாக இருக்கத் தேர்ந்தெடுக்கப்பட்டது; ‘தீர்க்கதரிசி’ என்பது மரபுவழி மாற்றாகும். மேற்கோள் முதலில் வந்து, ‘மோசே இவர்தான்’ என்ற வலியுறுத்தல் இறுதியில் வருவது இயல்பான தமிழ் தொடரமைப்போடு கிரேக்கத்தின் அடையாளப்படுத்தும் அழுத்தத்தையும் காக்கிறது.
