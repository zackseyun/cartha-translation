source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: ta
  text: அவருடைய எல்லா இன்னல்களிலிருந்தும் அவரை விடுவித்து,[a] எகிப்தின் அரசனாகிய பார்வோனுக்கு முன்பாக அவருக்கு நன்மதிப்பையும்[b] ஞானத்தையும் அளித்து, எகிப்தின்மீதும் பார்வோனுடைய முழு இல்லத்தின்மீதும் அவரை ஆளுநராக நியமித்தார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய எல்லாத் துன்பங்களிலிருந்தும் அவரை மீட்டார்.’
    reason: lexical_alternative
  - marker: b
    text: ‘நன்மதிப்பு’ என்பது பார்வோனின் பார்வையில் கிடைத்த சாதகமான ஏற்றுக்கொள்ளுதலைக் குறிக்கிறது; ‘தயவு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘எகிப்தையும் பார்வோனுடைய முழு இல்லத்தையும் ஆளுகிறவராக அவரை நியமித்தார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: விடுவித்து
  rationale: இங்கு நடுவினை வடிவம் ஆபத்து அல்லது துன்பத்திலிருந்து மீட்பதைக் குறிக்கிறது. ‘விடுவித்து’ என்பது இயல்பான நவீனத் தமிழில் செயற்பட்ட மீட்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: θλίψεων
  choice: இன்னல்களிலிருந்து
  rationale: யோசேப்பு அனுபவித்த அழுத்தங்கள், துன்பங்கள், இடர்கள் அனைத்தையும் பொதுவாகச் சுட்டுகிறது; ‘இன்னல்கள்’ பொருளின் கனத்தைத் தக்கவைக்கிறது.
- source_word: χάριν
  choice: நன்மதிப்பை
  rationale: இச்சூழலில் பார்வோனின் பார்வையில் யோசேப்புக்குக் கிடைத்த சாதகமான ஏற்றுக்கொள்ளுதலைக் குறிக்கிறது; ‘கிருபை’ என்ற விரிவான இறையியல் பொருளை தேவையின்றி இறக்குமதி செய்யாது.
- source_word: σοφίαν
  choice: ஞானத்தை
  rationale: பார்வோனால் உணரப்பட்ட நடைமுறை அறிவுத்திறனையும் விவேகத்தையும் நேரடியாகக் குறிக்கிறது.
- source_word: ἐναντίον
  choice: பார்வோனுக்கு முன்பாக
  rationale: ஒருவரின் முன்னிலையில் அல்லது பார்வையில் என்பதைக் குறிக்கும் இயல்பான, மரியாதையான தமிழ் வடிவம்.
- source_word: κατέστησεν
  choice: நியமித்தார்
  rationale: ஒருவரை அதிகாரப் பொறுப்பில் அமர்த்துவதைக் குறிக்கும் καθίστημι என்பதன் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἡγούμενον
  choice: ஆளுநராக
  rationale: ஆட்சி அதிகாரம் செலுத்துபவரைக் குறிக்கிறது. ‘ஆளுநர்’ நியமிக்கப்பட்ட நிர்வாக அதிகாரத்தை இயல்பாக எடுத்துரைக்கிறது; ‘தலைவர்’ என்பதைக் காட்டிலும் இச்சூழலுக்குத் துல்லியமானது.
- source_word: ἐπ’ Αἴγυπτον
  choice: எகிப்தின்மீதும்
  rationale: ஒரு பரப்பின்மேல் செலுத்தப்படும் அதிகாரத்தைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: பார்வோனுடைய முழுக் குடும்பத்தின்மீதும்
  rationale: οἶκος வெறும் கட்டிடத்தை அல்லாமல் பார்வோனின் குடும்பம் மற்றும் இல்ல நிர்வாக வட்டத்தைக் குறிக்கிறது. தொடரின் அருகிலுள்ள ‘அவருடைய’ என்ற சொல்லால் ஏற்படக்கூடிய குறிப்பு மயக்கத்தைத் தவிர்க்க ‘பார்வோனுடைய’ என்று தெளிவுபடுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: வசனம் முழுவதிலுமுள்ள மறைமுக எழுவாயின் குறிப்பு
  choice: மறைமுக எழுவாய் தேவன்; ஆனால் மூலத்தில் பெயர் வெளிப்படையாக இல்லாததால் தமிழிலும் ‘தேவன்’ என்று சேர்க்கப்படவில்லை.
  alternative: தெளிவுக்காக ‘தேவன்’ என்பதை வெளிப்படையாகச் சேர்த்தல்.
  rationale: அப்போஸ்தலர் 7:9-இல் ‘தேவன் அவரோடு இருந்தார்’ என்ற முந்தைய சூழலை ஒருமை வினைகள் தொடர்கின்றன. எழுவாயை வினைமுற்று மரியாதைப் பால் வடிவத்தில் மறைமுகமாக வைத்திருப்பது கிரேக்க நடையையும் சூழல் சார்ந்த இறையியல் தொடர்பையும் காக்கிறது.
- issue: 'αὐτοῦ என்பதன் குறிப்பு: ‘அவருடைய முழுக் குடும்பம்’'
  choice: இறுதி αὐτοῦ பார்வோனைக் குறிக்கும் வகையில் ‘பார்வோனுடைய முழுக் குடும்பம்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவருடைய முழுக் குடும்பம்’ என்று சொல்லி தமிழில் குறிப்பை மயக்கமாக விடுதல்.
  rationale: ஆதியாகமம் 41:40 சார்ந்த கதைச்சூழலும் உடனடியான பெயர்ச்சொல் ‘பார்வோன்’ என்பதும் இதை பார்வோனின் இல்லம்/குடும்பம் எனச் சுட்டுகின்றன. தமிழில் ‘அவருடைய’ என்பது யோசேப்பைக் குறிக்கிறதென தவறாகப் புரிய வாய்ப்புள்ளதால் குறிப்பு வெளிப்படுத்தப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ஒரே நீண்ட கிரேக்க வாக்கியத்தின் இணைப்புத் தொடரைத் தக்கவைத்தபோதும் தமிழ் இயல்புக்காக வினையெச்சத் தொடராக வடிவமைக்கப்பட்டது. இறுதி வினைமுற்றின் ‘ஆர்’ வடிவம் மறைமுக எழுவாயான தேவனை மரியாதையுடன் சுட்டுகிறது; மூலத்தில் இல்லாத பெயர் உரையில் சேர்க்கப்படவில்லை.
