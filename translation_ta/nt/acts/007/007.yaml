reference: Acts 7:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: ta
  text: 'கடவுள் கூறினார்: “அவர்கள் எந்த நாட்டுக்கு அடிமைகளாகப் பணிசெய்வார்களோ, அந்த நாட்டை நானே நியாயந்தீர்ப்பேன்; இவற்றுக்குப் பிறகு அவர்கள் வெளியேறி, இந்த இடத்தில் என்னை வழிபடுவார்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθνος
  choice: நாடு
  rationale: இங்கு ஆபிரகாமின் சந்ததியினரை அடிமைப்படுத்தும் அரசியல் சமூகமாகிய எகிப்தைக் குறிக்கிறது. நவீன தமிழில் ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: எந்த நாட்டுக்கு அடிமைகளாகப் பணிசெய்வார்களோ
  rationale: δουλεύω என்பதன் அடிப்படைச் சேவைப் பொருளையும், எகிப்திய அடிமைத்தனமாகிய சூழலையும் ஒன்றாக வெளிப்படுத்துகிறது. கிரேக்கத்தின் உறவுத்தொடரை இயல்பான தமிழ் ‘எந்த…ஓ, அந்த…’ அமைப்பில் தருகிறது.
- source_word: κρινῶ ἐγώ
  choice: நானே நியாயந்தீர்ப்பேன்
  rationale: κρίνω என்பதிலுள்ள நீதித்தீர்ப்பின் பொருளைக் காக்கிறது; ἐγώ வெளிப்படையாக வருவதால் ‘நானே’ என வலியுறுத்தப்பட்டுள்ளது.
- source_word: ὁ θεὸς εἶπεν
  choice: என்று கடவுள் கூறினார்
  rationale: மேற்கோளுக்குள் வரும் பேச்சாளர் குறிப்பை இயல்பான, மதிப்புமிக்க நவீன தமிழில் தருகிறது.
- source_word: μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: ταῦτα என்பதன் பன்மைச் சுட்டைத் தக்கவைத்து நிகழ்வுகளின் தொடர்ச்சியைக் காட்டுகிறது.
- source_word: ἐξελεύσονται
  choice: வெளியேறி வந்து
  rationale: அடிமைப்படுத்திய நாட்டிலிருந்து இஸ்ரவேலர் புறப்பட்டு வருவதை, யாத்திராகமச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: λατρεύσουσίν μοι
  choice: என்னை வழிபடுவார்கள்
  rationale: கடவுளுக்குச் செலுத்தப்படும் சமயச் சேவையை λατρεύω குறிக்கிறது; ‘வழிபடுவார்கள்’ என்பது சாதாரண உழைப்பிலிருந்து இதைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: இந்த இடத்தில்
  rationale: τόπος என்பதன் நேரான பொருளையும், சுட்டப்படும் குறிப்பிட்ட இடத்தையும் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: அடிமைத்தனச் சூழலில் δουλεύω என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகளாகப் பணிசெய்வார்கள்
  alternative: சேவை செய்வார்கள் / அடிமைப்படுத்தப்படுவார்கள்
  rationale: வினைச்சொல்லின் ‘பணிசெய்தல்’ பொருளைத் தக்கவைத்தபடியே, சூழலில் உள்ள கட்டாய அடிமைத்தனத்தை மறைக்காமல் கூறுகிறது.
- issue: கடவுளை நோக்கிய λατρεύω என்பதன் மொழிபெயர்ப்பு
  choice: என்னை வழிபடுவார்கள்
  alternative: எனக்குச் சேவை செய்வார்கள்
  rationale: இது சாதாரணப் பணியல்ல, கடவுளுக்குச் செலுத்தப்படும் சமயச் சேவை என்பதை நவீன வாசகருக்குத் தெளிவாக்குகிறது; அதேவேளை ‘சேவை’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நானே’ என்பது கிரேக்கத்தில் வெளிப்படையாக உள்ள ἐγώ-வின் வலியுறுத்தலைக் காக்கிறது. அடிமைத்தனமும் வழிபாடும் குறித்த வேறுபட்ட சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் வெளிப்படையாகத் தரப்பட்டுள்ளன.
