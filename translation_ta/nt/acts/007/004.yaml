    rationale: Although Greek has no overt subject, the immediately governing discourse identifies God as the actor. Tamil’s paired implicit pronouns are less recoverable here, and explicit ‘கடவுள்’ provides clarity without adding a claim beyond the context; the note preserves the Greek feature.
  - severity: low
    issue: Footnote b is anchored at the end of the verse rather than at the temporal statement it explains, and the terminal punctuation is split as ‘[a].[b]’.
    rationale: Anchoring b to ‘தந்தை இறந்தபின்’ better identifies the chronology under discussion. Both markers can be placed before the single final full stop.
