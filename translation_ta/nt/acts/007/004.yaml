source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: ta
  text: பின்பு அவர் கல்தேயரின் நாட்டைவிட்டு வெளியேறி ஆரானில் குடியேறினார். அங்கிருந்து, அவருடைய தந்தை இறந்தபின்[b], கடவுள் அவரை நீங்கள் இப்போது குடியிருக்கும் இந்த நாட்டுக்கு இடம்பெயரச் செய்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அவரை இடம்பெயரச் செய்தார்.” கிரேக்கத்தில் இவ்வினையின் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; சூழல் கடவுளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த இடமாற்றம் ஆபிரகாமின் தந்தை இறந்தபின் நடந்ததாக ஸ்தேவான் கூறுகிறார். தொடர்புடைய காலவரிசைக்கு ஆதியாகமம் 11:32; 12:4 ஆகியவற்றை ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: பின்பு
  rationale: ஸ்தேவானின் வரலாற்றுக் கூறலில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத் தொடர்பை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: கல்தேயரின் நாட்டைவிட்டு வெளியேறி
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது; γῆ Χαλδαίων என்பதன் முழு புவியியல்-இனக் கூறையும் காக்கிறது.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: ஆரானில் குடியேறினார்
  rationale: κατοικέω இங்கு வசிப்பிடத்தை ஏற்படுத்திக்கொள்வதைக் குறிக்கிறது; ‘குடியேறினார்’ நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: κἀκεῖθεν
  choice: அங்கிருந்து
  rationale: ἐκεῖθεν என்பதன் இடத்திலிருந்து நகரும் பொருளைக் காக்கிறது; தமிழ் வாக்கியத் தொடர்பில் καί தனியே மொழிபெயர்க்கப்படாமலேயே இயல்பாக வெளிப்படுகிறது.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: அவருடைய தந்தை இறந்தபின்
  rationale: μετά உடன் வரும் பெயராக்கப்பட்ட வினைச்சொல் காட்டும் கால வரிசையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: μετῴκισεν αὐτὸν
  choice: அவரைக் குடிபெயரச் செய்தார்
  rationale: μετοικίζω என்பது ஒருவரை வேறிடத்திற்குக் குடியேறச் செய்வதைக் குறிக்கும் காரணவினை. கிரேக்கத்தில் எழுவாய் வெளிப்படையாக இல்லை என்பதால் தமிழிலும் பெயரைச் சேர்க்காமல், மரியாதை ஒருமை வினைமுற்றால் சூழலில் உள்ள கடவுளைக் குறிக்க அனுமதிக்கப்படுகிறது.
- source_word: εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: நீங்கள் இப்போது குடியிருக்கிற இந்த நாட்டுக்கு
  rationale: இலக்கைச் சுட்டும் εἰς மற்றும் தற்போதைய குடியிருப்பைக் குறிக்கும் உறவுத் தொடரை இயல்பான தமிழ் சொல்வரிசையில் வழங்குகிறது.
theological_decisions:
- issue: μετῴκισεν என்பதன் வெளிப்படையாகக் கூறப்படாத எழுவாய்
  choice: ‘கடவுள்’ என்ற பெயரை மூலவாக்கியத்தில் சேர்க்காமல், ‘அவரைக் குடிபெயரச் செய்தார்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுள் அவரைக் குடிபெயரச் செய்தார்’ என்று எழுவாயை வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்க வினை மூன்றாம் நபர் ஒருமையில் இருந்தாலும் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை. முந்தைய சூழல் கடவுளைச் செய்பவராகச் சுட்டுவதால் தமிழ் மரியாதை வினைமுற்று அந்தத் தொடர்பைத் தக்கவைக்கிறது; அதேவேளை மூலத்தின் இலக்கண மறைபொருளையும் உண்மையான சிறு தெளிவின்மையையும் காக்கிறது.
- issue: தேராகுவின் மரணத்துக்கும் ஆபிரகாமின் இடமாற்றத்துக்கும் இடையிலான காலவரிசை
  choice: ‘அவருடைய தந்தை இறந்தபின்’ என்று அப்போஸ்தலர் பணிகள் கூறும் வரிசையை அப்படியே மொழிபெயர்த்தல்
  alternative: ஆதியாகமத்தின் காலக்கணக்குடன் வெளிப்படையாக ஒத்திசைக்கும் விதமாக மறுபரிமாணம் செய்தல்
  rationale: மொழிபெயர்ப்பு ஸ்தேவானின் கூற்றிலுள்ள வரிசையை மாற்றவோ மறைமுகமாக ஒத்திசைக்கவோ கூடாது; தொடர்புடைய ஆதியாகமப் பகுதிகள் அடிக்குறிப்பில் மட்டும் சுட்டப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கல்தேயர்’, ‘ஆரான்’ ஆகிய நிலையான தமிழ் வேதாகமப் பெயர்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக இல்லாத ‘கடவுள்’ என்ற எழுவாய் முதன்மை உரையில் சேர்க்கப்படவில்லை; அதன் சூழல்சார் அடையாளம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
