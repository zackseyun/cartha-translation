  source_fidelity: The temporal sequence, departure from the land of the Chaldeans, settlement in Haran, and the move after his father's death are accurately represented. The implied subject of μετῴκισεν is contextually God; explicitly naming God is a clear and defensible Tamil rendering when accompanied by a note that the Greek leaves the subject unexpressed.
