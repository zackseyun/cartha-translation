- from: ஆனால், தன் அயலானுக்கு அநியாயம் செய்துகொண்டிருந்தவன் மோசேயைத் தள்ளிவிட்டு[a], “உன்னை எங்களுக்கு அதிகாரியாகவும் நீதிபதியாகவும் நியமித்தது யார்?” என்றான்.
  to: ஆனால், தன் அயலானுக்கு அநியாயம் செய்துகொண்டிருந்தவன் மோசேயைத் தள்ளிவிட்டு[a], “உன்னை எங்கள்மேல் ஆட்சியாளராகவும் நீதிபதியாகவும் நியமித்தது யார்?” என்றான்.
