translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் எதிர்மறைத் திருப்பம் ‘ஆனால்’ என்பதால் காக்கப்பட்டுள்ளது; உரையாடல் நேரடியும் கூர்மையும் உடையதாக வைக்கப்பட்டுள்ளது.
