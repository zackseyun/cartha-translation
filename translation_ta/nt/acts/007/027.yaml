id: ACT.7.27
reference: Acts 7:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀδικῶν τὸν πλησίον ἀπώσατο αὐτὸν εἰπών· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστὴν ἐφ’ ⸀ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: ta
  text: ஆனால், தன் அயலானுக்கு அநியாயம் செய்துகொண்டிருந்தவன் மோசேயைத் தள்ளிவிட்டு[a], “உன்னை எங்கள்மேல் ஆட்சியாளராகவும் நீதிபதியாகவும் நியமித்தது யார்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலுக்கட்டாயமாக ஒதுக்கித் தள்ளிவிட்டு.” கிரேக்க வினைச்சொல் உடலால் வலுவாகத் தள்ளுவதையோ இகழ்ச்சியுடன் நிராகரிப்பதையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: அநியாயம் செய்துகொண்டிருந்தவன்
  rationale: நிகழ்ந்துகொண்டிருந்த அநீதியான செயலைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சித் தன்மையையும் ἀδικέω என்பதின் அநீதி சார்ந்த பொருளையும் காக்கிறது.
- source_word: πλησίον
  choice: தன் அயலானுக்கு
  rationale: ‘அருகிலுள்ளவர்/அயலார்’ என்ற வழக்கமான பொருளை இயல்பான தமிழில் தருகிறது; இஸ்ரவேலன் என்று உரையில் இல்லாததை வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: ἀπώσατο
  choice: தள்ளிவிட்டு
  rationale: சூழலில் உடலால் வலுக்கட்டாயமாக விலக்குவதையும் நிராகரிப்பதையும் உணர்த்தும் வினையின் உறுதியான செயற்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κατέστησεν
  choice: நியமித்தது
  rationale: ஒருவரை ஓர் அதிகாரப் பொறுப்பில் அமர்த்துதல் என்ற causative பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἄρχοντα
  choice: அதிகாரியாக
  rationale: ஆளும் அதிகாரமுள்ள ஒருவரைக் குறிக்கும்; இச்சூழலில் நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: δικαστὴν
  choice: நீதிபதியாக
  rationale: தீர்ப்பு வழங்குபவர் என்ற நேரடியான பொருளைக் காத்து, ‘அதிகாரி’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: ἐφ’ ἡμῶν
  choice: எங்களுக்கு
  rationale: இங்கு சவால் செய்யப்படுவது அவர்கள்மேல் செலுத்தப்படும் அதிகாரமே; தமிழில் ‘எங்களுக்கு அதிகாரியாக’ என்பது அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
