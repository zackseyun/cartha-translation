id: ACT.7.23
reference: Acts 7:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: ta
  text: அவருக்கு நாற்பது வயது நிறைவடைந்தபோது, தன் சகோதரர்களாகிய[b] இஸ்ரயேலின் மகன்களை[c]ச் சென்று பார்க்க வேண்டும் என்ற எண்ணம் அவருடைய உள்ளத்தில் எழுந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: ‘அவருடைய உள்ளத்தில் தோன்றியது’ அல்லது ‘அவர் முடிவுசெய்தார்.’ கிரேக்க மொழி உள்ளார்ந்த எண்ணம் அல்லது உறுதியைக் குறிக்கும் உருவகச் சொற்றொடரைப் பாதுகாக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சகோதரர்கள்’ என்பது மோசேயின் சக இஸ்ரயேலர்களைக் குறிக்கிறது; அடுத்து வரும் சொற்றொடர் அவர்கள் யார் என்பதை விளக்குகிறது.
    reason: cultural_note
  - marker: c
    text: 'வேறு விதமாக: ‘இஸ்ரயேலின் பிள்ளைகள்’ அல்லது ‘இஸ்ரயேலர்கள்.’'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: நிறைவடைந்தபோது
  rationale: δὲ-யின் மென்மையான தொடர்ச்சி தமிழில் தனிச் சொல்லாக வலியுறுத்தப்படாமல், ὡς என்பதன் காலத் தொடர்பு இயல்பான ‘போது’ வாக்கிய அமைப்பால் வெளிப்படுத்தப்படுகிறது.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: அவருக்கு நாற்பது வயது நிறைவடைந்தபோது
  rationale: ‘நாற்பது ஆண்டுக் காலம் அவருக்கு நிறைவேறிக்கொண்டிருந்தது’ என்ற மூலமொழி அமைப்பைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், நாற்பது வயது நிறைவுறும் காலத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: என்ற எண்ணம் அவருடைய உள்ளத்தில் எழுந்தது
  rationale: உள்ளார்ந்த எண்ணம் அல்லது உறுதியைக் குறிக்கும் உருவக மொழியை ‘முடிவுசெய்தார்’ என்று தட்டையாக்காமல், தமிழில் புரியக்கூடிய ‘உள்ளத்தில் எழுந்தது’ என்ற வடிவில் பாதுகாக்கிறது.
- source_word: ἐπισκέψασθαι
  choice: சென்று பார்க்க
  rationale: சந்தித்துப் பார்ப்பதோடு அவர்களுடைய நிலையை அறிந்துகொள்ளும் அக்கறையையும் சூழல் உணர்த்துகிறது; ‘சென்று பார்க்க’ என்பது இயல்பான, சுருக்கமான தமிழ்.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: தன் சகோதரர்களாகிய
  rationale: மூலத்தின் உறவுமுறைச் சொல்லைப் பாதுகாக்கிறது; அடுத்து வரும் சொற்றொடர் இவர்கள் மோசேயின் சக இஸ்ரயேலர் என்பதைத் தெளிவாக்குகிறது.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: இஸ்ரயேலின் மகன்களை
  rationale: மூலத்தின் ஆண்பால் பன்மையையும் வேதாகம மரபுச் சொற்றொடரையும் நேரடியாகப் பாதுகாக்கிறது; இது இனக்குழுவைக் குறிக்கும் பிரதிநிதித்துவப் பயன்பாடு என்பதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: பாலினம் குறிக்கப்பட்ட உறவுமுறைச் சொல்லும் இன அடையாளமும்
  choice: தன் சகோதரர்களாகிய இஸ்ரயேலின் மகன்கள்
  alternative: தன் சக இஸ்ரயேலர்கள் / இஸ்ரயேல் மக்கள்
  rationale: இங்கு தனிப்பட்ட ஆண் உடன்பிறப்புகள் மட்டும் குறிக்கப்படவில்லை; மோசேயின் சொந்த மக்களாகிய இஸ்ரயேலர் குறிக்கப்படுகின்றனர். இருப்பினும் மூலத்தின் ‘சகோதரர்கள்’ மற்றும் ‘மகன்கள்’ என்ற குடும்பச் சார்ந்த உருவக மொழி பிரதான உரையில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘உள்ளத்தில் எழுந்தது’ மற்றும் ‘இஸ்ரயேலின் மகன்கள்’ ஆகியவை மூலத்தின் உருவகத்தையும் குடும்ப-இன அடையாள மொழியையும் பாதுகாக்கின்றன; சாத்தியமான இயல்பான மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
