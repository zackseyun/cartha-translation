source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: ta
  text: 'ஆனால் கடவுள் இவ்வாறு கூறினார்: “அவனுடைய சந்ததி தங்களுக்குச் சொந்தமல்லாத ஒரு நாட்டில் அந்நியக் குடியிருப்பாளராக இருக்கும்[a]; அந்நாட்டினர் அந்தச் சந்ததியை நானூறு ஆண்டுகளாக அடிமைப்படுத்தியும் கொடுமைப்படுத்தியும் வருவார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் இயல்பான பன்மையில், “அவனுடைய வழித்தோன்றல்கள் தங்களுக்குச் சொந்தமல்லாத ஒரு நாட்டில் அந்நியர்களாக வாழ்வார்கள்; அந்நாட்டினர் அவர்களை நானூறு ஆண்டுகளாக அடிமைப்படுத்தியும் கொடுமைப்படுத்தியும் வருவார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘சந்ததி’ என்பதும் அதைக் குறிக்கும் சுட்டுப்பெயரும் ஒருமையில் உள்ளன; ஆனால் அவை பல வழித்தோன்றல்களைத் தொகுப்பாகக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: ஆனால் கடவுள் இவ்வாறு கூறினார்
  rationale: δέ இங்கு உரையின் தொடர்ச்சியில் மென்மையான மாறுபாட்டைக் காட்டுவதால் ‘ஆனால்’ எனவும், οὕτως வெளிப்படையாக ‘இவ்வாறு’ எனவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: அவனுடைய சந்ததி
  rationale: σπέρμα இங்கு ஆபிரகாமின் வழிமரபைக் குறிக்கும் ஒருமைத் தொகுப்புப்பெயர். ‘சந்ததி’ நவீன தமிழில் இயல்பாகவும் அந்த ஒருமைத் தொகுப்புணர்வைத் தக்கவைத்தும் உள்ளது.
- source_word: πάροικον ἐν γῇ ἀλλοτρίᾳ
  choice: தங்களுக்குச் சொந்தமல்லாத ஒரு நாட்டில் அந்நியக் குடியிருப்பாளராக
  rationale: πάροικος தன் சொந்த நாட்டில் அல்லாமல் வாழும் வெளிநாட்டுக் குடியிருப்பாளரைக் குறிக்கிறது; ἀλλοτρία அந்த நாடு அவர்களுக்குச் சொந்தமானதல்ல என்பதை வலியுறுத்துகிறது.
- source_word: δουλώσουσιν αὐτὸ
  choice: அந்நாட்டினர் அந்தச் சந்ததியை அடிமைப்படுத்தி
  rationale: δουλόω-வின் அடிமைத்தனப் பொருளை ‘அடிமைப்படுத்தி’ தெளிவாகக் காட்டுகிறது. αὐτό என்ற ஒருமைச் சுட்டுப்பெயரின் தொகுப்புப்பொருளை இயல்பான தமிழில் தெளிவுபடுத்த ‘அந்தச் சந்ததியை’ என்று பெயர்ச்சொல் மீண்டும் பயன்படுத்தப்பட்டுள்ளது. வினையின் மறைமுக எழுவாய் சூழலின்படி ‘அந்நாட்டினர்’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: κακώσουσιν
  choice: கொடுமைப்படுத்துவார்கள்
  rationale: κακόω இங்கு துன்புறுத்துதல் அல்லது மோசமாக நடத்துதல் என்ற பரந்த பொருளைக் கொண்டது; ‘கொடுமைப்படுத்துவார்கள்’ அதன் தீவிரத்தையும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: ἔτη τετρακόσια
  choice: நானூறு ஆண்டுகள்
  rationale: கால நீட்சியைக் குறிக்கும் கிரேக்க வேற்றுமைத் தொடரை தமிழில் இயல்பான கால அளவுத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: ஆபிரகாமின் சந்ததியைக் குறிக்கும் ஒருமைத் தொகுப்புச் சொல் மற்றும் சுட்டுப்பெயர்
  choice: முதன்மை உரையில் ‘சந்ததி ... அந்தச் சந்ததியை’ என்ற ஒருமைத் தொகுப்பு வடிவம் தக்கவைக்கப்பட்டது.
  alternative: ‘வழித்தோன்றல்கள் ... அவர்களை’ என்ற இயல்பான பன்மை வடிவம்
  rationale: கிரேக்கத்தில் σπέρμα ... αὐτό என ஒருமைத் தொகுப்பு மொழி உள்ளது. அதைத் தக்கவைப்பது மூலத்தின் குறிப்பிடத்தக்க இலக்கண வடிவத்தை அழிக்காமல் காக்கிறது; தமிழில் குழப்பத்தைத் தவிர்க்க ஒருமைச் சுட்டுப்பெயருக்குப் பதிலாக ‘அந்தச் சந்ததியை’ என்று மீண்டும் கூறப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்நியக் குடியிருப்பாளர்’ சட்ட நிர்வாகச் சொல்லாக மட்டும் ஒலிக்காதபடி அதன் இடவியல் பொருள் ‘தங்களுக்குச் சொந்தமல்லாத ஒரு நாட்டில்’ என்பதால் தெளிவாக்கப்பட்டுள்ளது. மேற்கோள் வடிவம் கடவுள் கூறிய உரையின் எல்லையை வாசகருக்குத் தெளிவுபடுத்துகிறது.
