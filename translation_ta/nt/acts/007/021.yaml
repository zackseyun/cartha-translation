base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: ta
  text: ஆனால் அவன் வெளியில் விடப்பட்டபோது[a], பார்வோனின் மகள் அவனை எடுத்துக்கொண்டு[b], தனக்கு மகனாக வளர்த்தாள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெளியில் வைக்கப்பட்டபோது’ என்றும் மொழிபெயர்க்கலாம்; இங்கு குழந்தை வெளியே கொண்டுபோய் விடப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவனைத் தூக்கி எடுத்தாள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினை வெளியே விடப்பட்ட குழந்தையை எடுத்துக்கொள்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: நேர்ச்சொல்லாக, ‘தனக்காக ஒரு மகனாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: வெளியே விடப்பட்டபோது
  rationale: குழந்தையை வெளியே கொண்டுபோய் விட்டுவிடுவதைக் குறிக்கும் இறந்தகாலச் செயப்பாட்டு வினையெச்சம். ‘கைவிடப்பட்டபோது’ என்பது நோக்கத்தைச் சற்றுக் கூடுதலாக வலியுறுத்தும் என்பதால், மூலத்தின் செயலை நேரடியாகக் காட்டும் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் மோசே வெளியே எறியப்பட்டதற்கும் இங்கு பார்வோனின் மகள் அவனை ஏற்றுக்கொண்டதற்கும் இடையிலான கதைத் திருப்பத்தை இயல்பாகக் காட்டுகிறது.
- source_word: ἀνείλατο
  choice: எடுத்துக்கொண்டு
  rationale: வெளியே விடப்பட்ட குழந்தையைத் தூக்கி ஏற்றுக்கொள்ளும் செயலைக் குறிக்கிறது. ‘தத்தெடுத்தாள்’ என்ற மொழிபெயர்ப்பு, பின்னர் வரும் ‘மகனாக’ என்ற விளைவை இச்சொல்லிலேயே முன்கூட்டியே சேர்த்துவிடும்.
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: பார்வோனின் மகள்
  rationale: உடைமை உறவை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἀνεθρέψατο
  choice: வளர்த்தாள்
  rationale: ஒரு குழந்தையைப் பேணி வளர்ப்பதைக் குறிக்கும் வினை; நவீனத் தமிழில் இயல்பானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: தனக்கு மகனாக
  rationale: ‘தனக்காக/தனக்கு’ என்ற தற்சுட்டுப் பொருளையும், ‘மகன் என்ற நிலையில்’ என்னும் உறவையும் காக்கிறது. ‘தன் சொந்த மகனாக’ என்பது இயல்பான விரிவாக்கமாயினும், மூலத்தில் இல்லாத ‘சொந்த’ என்ற வலியுறுத்தலைத் தவிர்க்க இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: பார்வோனின் மகள் மோசேயைச் சட்டப்படி தத்தெடுத்தாளா, அல்லது மகனாகவே வளர்த்தாளா?
  choice: தனக்கு மகனாக வளர்த்தாள்
  alternative: தன் மகனாகத் தத்தெடுத்து வளர்த்தாள்
  rationale: மூலவாக்கியம் அவனை மகன் என்ற நிலையில் வளர்த்ததைத் தெரிவிக்கிறது; குறிப்பிட்ட சட்டரீதியான தத்தெடுப்பு நடைமுறை நடந்ததாக வெளிப்படையாகக் கூறவில்லை. ஆகவே அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான எளிய நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தத்தெடுத்தாள்’ என்று சட்டரீதியான பொருளைத் திணிக்காமல், உடனடி செயலும் பின்னர் ஏற்பட்ட மகன் உறவும் தனித்தனியாக வைக்கப்பட்டுள்ளன.
