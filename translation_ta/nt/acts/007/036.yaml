source:
  edition: SBLGNT
  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: ta
  text: இவரே அவர்களை வெளியே கொண்டு வந்தார்; எகிப்து நாட்டிலும் செங்கடலிலும்[a] வனாந்தரத்திலும் நாற்பது ஆண்டுகள் அற்புதங்களையும் அடையாளங்களையும் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாணல் கடல்.’ ஆனால் கிரேக்க மூலத்தில் ‘செங்கடல்’ (Ἐρυθρὰ Θάλασσα) என்றே உள்ளது; புதிய ஏற்பாட்டிலும் கிரேக்கப் பழைய ஏற்பாட்டிலும் இஸ்ரவேலர் கடந்த இடத்திற்குப் பயன்படுத்தப்படும் வழக்கமான பெயர் இதுவே.
    reason: ‘செங்கடல்’ என்பது கிரேக்கச் சொல்லின் நேரடிப் பொருள்; ‘நாணல் கடல்’ என்பது எபிரெயப் பின்னணியைப் பிரதிபலிக்கும் மாற்று மொழிபெயர்ப்பு என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
lexical_decisions:
- source_word: οὗτος
  choice: இவரே
  rationale: மோசேயைச் சுட்டும் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது; வெறும் ‘அவர்’ என்று மொழிபெயர்ப்பதைவிட மூலத்தின் சொல்லாட்சித் தீவிரத்தை வெளிப்படுத்துகிறது.
- source_word: ἐξήγαγεν αὐτούς
  choice: அவர்களை வெளியே வழிநடத்தினார்
  rationale: வெளியே நடத்திச் சென்றார் என்ற வினையின் இயக்கத்தையும், மோசே மனிதக் கருவியாகச் செயல்பட்டதையும் வெளிப்படுத்துகிறது.
- source_word: ποιήσας
  choice: செய்தார்
  rationale: கிரேக்கப் பெயரெச்சத் தொடரை இயல்பான நவீன தமிழுக்காக இணையான வினைமுற்றுத் தொடராக அமைத்துள்ளது; அற்புதச் செயல்களுக்கும் வழிநடத்தலுக்கும் உள்ள தொடர்பு சூழலால் தொடர்கிறது.
- source_word: τέρατα καὶ σημεῖα
  choice: அற்புதங்களையும் அடையாளங்களையும்
  rationale: வியப்பை உண்டாக்கும் செயல்கள் மற்றும் அவற்றின் அடையாளத் தன்மை ஆகிய இரு கூறுகளையும் பரவலாகப் புரியும் வேதாகமத் தமிழில் வேறுபடுத்திக் காக்கிறது.
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: எகிப்து நாட்டிலும்
  rationale: γῇ என்பதிலுள்ள ‘நாடு’ என்ற கூறையும் மூன்று இடங்களின் இணை அமைப்பையும் காக்கிறது.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: செங்கடலிலும்
  rationale: கிரேக்கத்தில் நேரடியாக உள்ள ‘சிவப்புக் கடல்’ என்ற வழக்குப் பெயருக்கான நிலைபெற்ற தமிழ் வடிவம்; மீண்டும் வரும் ἐν என்பதையும் ‘-இலும்’ மூலம் பிரதிபலிக்கிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: வனாந்தரத்திலும்
  rationale: இஸ்ரவேலரின் அலைந்து திரிந்த நிலப்பகுதியைக் குறிக்கும் வேதாகமப் பயன்பாட்டைத் தக்கவைத்து, வெறும் மணற்பாலை என்ற குறுகிய எண்ணத்தைத் தவிர்க்கிறது.
- source_word: ἔτη τεσσεράκοντα
  choice: நாற்பது ஆண்டுகள்
  rationale: கால அளவை இயல்பான தமிழில் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: யாத்திரையில் மோசேயைக் குறிக்கும் சுட்டும் சொல்லும் அவரது செயலாண்மையும்
  choice: ‘இவரே’ என்று மோசேயை வலியுறுத்தி, அவர் மக்களை வெளியே வழிநடத்தியதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்’ என்று வலியுறுத்தலின்றி மொழிபெயர்த்தல், அல்லது செயலை நேரடியாகக் கடவுளுக்குரியதாக மாற்றிக் கூறுதல்.
  rationale: வசனம் மோசேயை மனிதச் செயலாளராக முன்வைக்கிறது; அதேவேளையில் அவர் கடவுளிடமிருந்து சுயாதீனமாகச் செயல்பட்டார் என்று உரை கூறுவதில்லை. ஆகவே மூலத்தில் உள்ள வலியுறுத்தலும் இறையியல் பதற்றமும் விளக்கச் சேர்க்கையின்றி காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இவரே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது. நீண்ட கிரேக்கப் பெயரெச்ச அமைப்பு வாசிப்புத் தெளிவுக்காக அரைப்புள்ளியால் இணைக்கப்பட்ட இரண்டு தமிழ் வினைமுற்றுத் தொடர்களாக அமைக்கப்பட்டுள்ளது; மூன்று இடங்களின் இணைநிலை ‘-இலும்’ மூலம் காக்கப்பட்டுள்ளது.
