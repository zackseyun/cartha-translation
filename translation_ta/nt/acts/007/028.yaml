translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடியான கேள்வி வடிவமும் குற்றஞ்சாட்டும் தொனியும் காக்கப்பட்டுள்ளன. ‘நீ’ என்ற எழுவாய் தனியாகச் சேர்க்கப்படாமல், வினைமுற்றில் இயல்பாக வெளிப்படுகிறது.
