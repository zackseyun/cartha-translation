source:
  edition: SBLGNT
  text: μὴ ἀνελεῖν με σὺ θέλεις ὃν τρόπον ἀνεῖλες ⸀ἐχθὲς τὸν Αἰγύπτιον;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/028.yaml
  text: Do you want to kill me the way you killed the Egyptian yesterday?
translation:
  language: ta
  text: ‘நேற்று அந்த எகிப்தியனைக் கொன்றதுபோல, என்னையும் கொல்ல நீ விரும்புகிறாயா?’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: கொல்ல / கொன்ற
  rationale: இச்சூழலில் ἀναιρέω நேரடியாக உயிரைக் கொல்வதைக் குறிக்கிறது; ஒரே கிரேக்க வினையின் தொடர்பைத் தமிழிலும் ஒரே சொல்லால் காக்கிறது.
- source_word: ὃν τρόπον
  choice: கொன்றதுபோல
  rationale: ‘எந்த விதத்தில்’ என்ற ஒப்பீட்டுப் பொருளை இயல்பான, சுருக்கமான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐχθὲς
  choice: நேற்று
  rationale: காலக் குறிப்பைத் தெளிவாகவும் மூலத்தின் வலியுறுத்தலுக்கு ஏற்ற இடத்திலும் தருகிறது.
- source_word: τὸν Αἰγύπτιον
  choice: அந்த எகிப்தியனை
  rationale: குறிப்பிட்ட, முன்பே அறியப்பட்ட எகிப்திய மனிதரைச் சுட்டும் definite article-இன் குறிப்புத்தன்மையை ‘அந்த’ வெளிப்படுத்துகிறது.
