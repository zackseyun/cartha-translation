  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் வினைச்சொல்லின் உண்மையான செயப்பாட்டு வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, சூழலால் சாத்தியமான தற்சுட்டுப் பொருள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
