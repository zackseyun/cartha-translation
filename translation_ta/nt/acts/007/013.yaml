source:
  edition: SBLGNT
  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: ta
  text: அவர்கள் இரண்டாவது முறை வந்தபோது, யோசேப்பு தன் சகோதரர்களால் அடையாளம் காணப்பட்டார்[a]. மேலும், யோசேப்பின் குடும்பம் பார்வோனுக்குத் தெரியவந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோசேப்பு தன் சகோதரர்களுக்குத் தன்னை வெளிப்படுத்தினார்.” கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவில் உள்ளது; ஆனால் இங்கு யோசேப்பு தான் யார் என்பதை அவர்களுக்குத் தெரிவித்த நிகழ்வை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “குடும்பம்” என்பதற்கான கிரேக்கச் சொல்லை “உறவினர்,” “குலம்,” அல்லது “வம்சம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: அவர்கள் இரண்டாவது முறை வந்தபோது
  rationale: சொல்லுக்கு சொல் ‘இரண்டாவதில்’ என்றிருந்தாலும், சூழலில் யோசேப்பின் சகோதரர்கள் எகிப்துக்கு இரண்டாவது முறை வந்த நிகழ்வையே இது குறிக்கிறது. தமிழில் பொருள் இயல்பாகத் தெளிவதற்காக ‘வந்தபோது’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀνεγνωρίσθη
  choice: அடையாளம் கண்டுகொள்ளப்பட்டார்
  rationale: கிரேக்க வினைச்சொல்லின் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. ஆதியாகமப் பின்னணியில் யோசேப்பு தம்மை வெளிப்படுத்தியதால் அவர்கள் அவரை அடையாளம் அறிந்துகொண்டார்கள் என்ற நிகழ்வையும் இது அனுமதிக்கிறது; அந்தச் சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀδελφοῖς αὐτοῦ
  choice: தன் சகோதரர்களால்
  rationale: இங்கு குறிப்பிடப்படுபவர்கள் யோசேப்பின் ஆண் உடன்பிறந்தவர்கள். ‘-ஆல்’ என்பது கிரேக்கச் செயப்பாட்டு கட்டமைப்புக்கு ஏற்றது.
- source_word: φανερὸν ἐγένετο
  choice: தெரியவந்தது
  rationale: முன்பு அறியப்படாத ஒன்று ஒருவருக்குத் தெரிய வந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: γένος Ἰωσήφ
  choice: யோசேப்பின் குடும்பம்
  rationale: γένος இங்கு யோசேப்பின் உறவினர் குழுவை அல்லது குடும்பத்தைச் சுட்டுகிறது. ‘இனம்’ என்பது தவறான நவீன கருத்தை ஏற்படுத்தக்கூடும்; ‘வம்சம்’ தேவைக்கு மீறிய குறுகிய பொருளைத் தரக்கூடும்.
- source_word: τῷ Φαραώ
  choice: பார்வோனுக்கு
  rationale: விவரம் யாருக்குத் தெரியவந்தது என்பதைச் சுட்டும் கிரேக்க நான்காம் வேற்றுமையை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
