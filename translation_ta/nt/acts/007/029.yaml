translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ஒரே வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘அவருக்கு இரண்டு மகன்கள் பிறந்தார்கள்’ என்பது ἐγέννησεν என்பதன் தந்தை சார்ந்த பொருளைத் தவறான உடலியல் உணர்வின்றி வழங்குகிறது.
