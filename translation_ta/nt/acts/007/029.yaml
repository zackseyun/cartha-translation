  text: ἔφυγεν δὲ Μωϋσῆς ἐν τῷ λόγῳ τούτῳ, καὶ ἐγένετο πάροικος ἐν γῇ Μαδιάμ, οὗ ἐγέννησεν υἱοὺς δύο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: ta
  text: இந்த வார்த்தையைக் கேட்டதும்[a] மோசே தப்பியோடி, மீதியான் நாட்டில் அந்நியராகக் குடியிருந்தார்[b]. அங்கே அவர் இரண்டு மகன்களுக்குத் தந்தையானார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் கூற்றின் காரணமாக.” கிரேக்கச் சொற்றொடர், அந்தக் கூற்று மோசே தப்பியோடியதற்கான உடனடிக் காரணம் என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, தன் சொந்த நாடல்லாத ஒரு நாட்டில் அந்நியராக வாழ்ந்தார்.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἔφυγεν
  choice: தப்பியோடி
  rationale: φεύγω இங்கு ஆபத்திலிருந்து விலகிச் சென்றதைச் சுட்டுகிறது. ‘தப்பியோடி’ என்பது நிகழ்வின் அவசரத்தையும் தப்பிச் செல்லும் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: δὲ
  choice: —தும்
  rationale: δέ தனியே ஒரு இணைப்புச் சொல்லாக மொழிபெயர்க்கப்படாமல், முந்தைய கூற்றைத் தொடர்ந்து நிகழ்ந்த விளைவை ‘கேட்டதும்’ என்ற அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: இந்த வார்த்தையைக் கேட்டதும்
  rationale: சொல்லுக்கு நெருக்கமான ‘இந்த வார்த்தையின்போது’ என்பது தமிழில் இயல்பற்றது. ‘கேட்டதும்’ என்பது அந்தக் கூற்று மோசேயின் ஓட்டத்தைத் தூண்டிய உடனடி சூழலை வெளிப்படுத்துகிறது; காரணப் பொருளை முற்றிலும் நிர்ணயிக்காமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐγένετο πάροικος
  choice: அந்நியராகக் குடியிருந்தார்
  rationale: πάροικος என்பது தன் சொந்த நாடல்லாத இடத்தில் வசிக்கும் ஒருவரைக் குறிக்கிறது. ‘அந்நியராகக் குடியிருந்தார்’ என்பது இந்த நிலையை நவீன தமிழில் தெளிவாகக் கூறுகிறது; வெறும் குறுகிய காலத் தங்குதலை மட்டும் குறிக்கும் சொல்லைத் தவிர்க்கிறது.
- source_word: ἐν γῇ Μαδιάμ
  choice: மீதியான் நாட்டில்
  rationale: γῇ என்ற நிலப்பரப்புக் குறிப்பை ‘நாட்டில்’ வெளிப்படுத்துகிறது; Μαδιάμ என்பதற்கு வழக்கமான தமிழ் வடிவமான ‘மீதியான்’ பயன்படுத்தப்படுகிறது.
- source_word: οὗ
  choice: அங்கே
  rationale: οὗ முன் குறிப்பிடப்பட்ட மீதியான் நாட்டை இடவியல் ரீதியாகச் சுட்டுகிறது. தமிழில் ‘அங்கே’ இயல்பாக அடுத்த வாக்கியத்தை இணைக்கிறது.
- source_word: ἐγέννησεν
  choice: அவருக்கு ... பிறந்தார்கள்
  rationale: ஆண் எழுவாயுடன் வரும் γεννάω அவர் தந்தையானார் என்ற பொருளைத் தருகிறது. தமிழில் ‘இரண்டு மகன்களைப் பெற்றார்’ என்பது அவர் பெற்றெடுத்தார் எனத் தவறாகப் புரியக்கூடும்; ‘அவருக்கு ... பிறந்தார்கள்’ என்பது பொருளை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: υἱοὺς δύο
  choice: இரண்டு மகன்கள்
  rationale: எண்ணிக்கையையும் ஆண் பிள்ளைகள் என்ற பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
