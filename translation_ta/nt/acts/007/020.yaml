source:
  edition: SBLGNT
  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: ta
  text: அக்காலத்தில் மோசே பிறந்தார்; அவர் கடவுளின் பார்வையில் அழகானவராக இருந்தார்.[a] தன் தந்தையின் வீட்டில் மூன்று மாதங்கள் வளர்க்கப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளுக்கு அழகானவராக” என்றும் மொழிபெயர்க்கலாம். “அழகானவர்” என்பதற்கான கிரேக்கச் சொல் “நல்ல தோற்றமுள்ளவர்” அல்லது “சிறப்பானவர்” என்ற பொருள்களையும் தரக்கூடும்; ஆனால் மூலத்தில் கடவுளைப் பற்றிய குறிப்பு வெளிப்படையாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: அக்காலத்தில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பான, சுருக்கமான நவீனத் தமிழில் தருகிறது.
- source_word: ἐγεννήθη
  choice: பிறந்தார்
  rationale: பிறப்புச் சூழலில் γεννάω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்துக்கான இயல்பான தமிழாக்கம்.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: ἀστεῖος
  choice: அழகுள்ளவராக
  rationale: உடல் அழகு அல்லது சிறப்பான தோற்றம் என்ற அடிப்படைப் பொருளைப் பேணுகிறது; ‘சிறப்பானவர்’ என்று விளக்கமாகக் குறுக்கிவிடவில்லை.
- source_word: τῷ θεῷ
  choice: கடவுளின் பார்வையில்
  rationale: கடவுளைப் பற்றிய வெளிப்படையான குறிப்பைப் பேணுவதோடு, மதிப்பீடு அல்லது நோக்கு சார்ந்த வேற்றுமைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὃς
  choice: அவர்
  rationale: மோசேயையே தொடர்ந்து குறிக்கும் தொடர்புப்பெயரைத் தமிழில் புதிய வாக்கியத்தின் எழுவாயாக இயல்பாகத் தருகிறது.
- source_word: ἀνετράφη
  choice: வளர்க்கப்பட்டார்
  rationale: பேணி வளர்க்கப்படுதல் என்ற செயப்பாட்டு அர்த்தத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: μῆνας τρεῖς
  choice: மூன்று மாதங்கள்
  rationale: காலநீட்சியைத் தமிழில் இயல்பாகக் குறிக்கிறது; தனி இடைச்சொல் தேவையில்லை.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: தமது தந்தையின் வீட்டில்
  rationale: தந்தையின் குடும்ப வீட்டில் வளர்க்கப்பட்டார் என்ற பொருளை இயல்பாகப் பேணுகிறது; ‘தமது’ என்பது எழுவாயான மோசேயைத் தெளிவாகச் சுட்டுகிறது.
theological_decisions:
- issue: ἀστεῖος τῷ θεῷ என்பதன் பொருள்
  choice: கடவுளின் பார்வையில் அழகுள்ளவராக
  alternative: கடவுளுக்கு அழகுள்ளவராக; மிகவும் அழகுள்ளவராக; சிறப்பானவராக
  rationale: τῷ θεῷ எனும் கடவுளைப் பற்றிய வெளிப்படையான குறிப்பை நீக்காமல், அது கடவுளின் மதிப்பீடு அல்லது பார்வையைக் குறிக்கிறது என்பதை இயல்பான தமிழில் தருகிறது. அதேவேளை, மோசே விசேஷமாகத் தேர்ந்தெடுக்கப்பட்டார் போன்ற மேலதிக இறையியல் கருத்தை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கடவுளின் மதிப்பீட்டைக் குறிக்கும் கிரேக்கத் தொடரின் தெளிவின்மையை அடிக்குறிப்பில் பேணியுள்ளோம்; செயப்பாட்டு வடிவங்களும் குடும்பச் சூழலும் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளன.
