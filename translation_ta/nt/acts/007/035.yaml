source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: ta
  text: “உன்னை ஆட்சியாளராகவும் நீதிபதியாகவும் நியமித்தவர் யார்?” என்று சொல்லி அவர்கள் நிராகரித்த இந்த மோசேயையே, முட்புதரில் அவருக்குத் தோன்றிய தேவதூதரின் கைமூலமாக, ஆட்சியாளராகவும் மீட்பவராகவும்[a] கடவுள் அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விடுவிப்பவர்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் விடுதலை அல்லது மீட்பைக் கொண்டுவருபவரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: நிராகரித்த
  rationale: இங்கு மோசேயின் அதிகாரத்தை ஏற்க மறுத்ததைக் குறிக்கிறது; வெறும் வாய்மொழி மறுப்பைவிட ‘நிராகரித்த’ என்பது சூழலுக்கு ஏற்றது.
- source_word: κατέστησεν
  choice: நியமித்தவர்
  rationale: ஒருவரை அதிகாரப் பொறுப்பில் அமர்த்தும் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄρχοντα
  choice: ஆளுநராக
  rationale: அதிகாரம் செலுத்துபவரைக் குறிக்கும் சொல்லின் அலுவல்சார் பொருளையும், வசனத்திலுள்ள மறுமுறையையும் காக்கிறது.
- source_word: δικαστήν
  choice: நீதிபதியாக
  rationale: தீர்ப்பு வழங்குபவரைக் குறிக்கும் நேரடியான, தெளிவான தமிழ்ச் சொல்.
- source_word: λυτρωτὴν
  choice: மீட்பவராக
  rationale: விடுதலையையும் மீட்பையும் ஏற்படுத்துபவர் என்ற சொல்லின் வலிமையைத் தக்கவைக்கிறது; ‘விடுவிப்பவர்’ என்பதும் சாத்தியமானது என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: ἀπέσταλκεν
  choice: அனுப்பினார்
  rationale: நிறைவேறிய அனுப்புதலைத் தமிழ் கதைநடையில் இயல்பாகக் கூறுகிறது; கிரேக்க நிறைவுக்காலத்தின் தொடரும் முக்கியத்துவத்தைச் சூழல் உணர்த்துகிறது.
- source_word: σὺν χειρὶ
  choice: கையின் மூலம்
  rationale: தேவதூதரின் இடைமுகச் செயல்பாட்டைக் காட்டும் மூலமொழியின் ‘கை’ உருவகத்தை முற்றிலும் தட்டையாக்காமல் காக்கிறது.
- source_word: ἀγγέλου
  choice: தேவதூதரின்
  rationale: எரியும் முட்புதர் நிகழ்வின் சூழலில் இது விண்ணுலகத் தூதரைக் குறிப்பதால், நவீன தமிழில் தெளிவாக ‘தேவதூதர்’ என வழங்கப்பட்டுள்ளது.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: முட்புதரில் அவருக்குத் தோன்றிய
  rationale: செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் ‘தோன்றிய’ என அளிக்கிறது; இவ்வசனத்தில் இல்லாத ‘எரியும்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: Τοῦτον ... τοῦτον
  choice: இந்த மோசேயையே
  rationale: இருமுறை வரும் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதியால் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: ஆளுநராகவும் மீட்பவராகவும்
  rationale: இரு பணிகளையும் இணையாக வலியுறுத்தும் இரட்டை καί அமைப்பை ‘-வும் ... -வும்’ என்ற தமிழ் இணைப்பால் காக்கிறது.
theological_decisions:
- issue: மீட்பு வரலாற்றில் மோசேயின் பங்கை விவரிக்கும் λυτρωτής சொல்லின் மொழிபெயர்ப்பு
  choice: மீட்பவர்
  alternative: விடுவிப்பவர்
  rationale: ‘மீட்பவர்’ என்பது விடுதலை/மீட்பு சார்ந்த வலிமையான பொருளையும் மோசேயின் இறைவனால் அனுப்பப்பட்ட பணியையும் காக்கிறது. அதேவேளையில், மோசேயையும் கிறிஸ்துவையும் முழுமையாகச் சமப்படுத்தும் கருத்தை மொழிபெயர்ப்பில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இந்த மோசேயையே’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘தேவதூதரின் கையின் மூலம்’ என்பது சற்றே வேதாகமப் பாணியுடையதாயினும் மூலத்தின் கை-உருவகத்தையும் இடைமுகத்தையும் பாதுகாக்கிறது.
