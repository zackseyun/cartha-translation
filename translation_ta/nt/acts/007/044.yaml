revisions:
- from: “சாட்சியின் கூடாரம்”[a] வனாந்தரத்தில் நம் தந்தையர்களிடம்[b] இருந்தது. மோசேயிடம் பேசிக்கொண்டிருந்தவர்[c] கட்டளையிட்டபடியே, மோசே தான் கண்டிருந்த மாதிரியின்படி அதைச் செய்தார்.
  to: வனாந்தரத்தில் நம் தந்தையருடன் சாட்சியின் கூடாரம்[a] இருந்தது; மோசேயிடம் பேசியவர், மோசே கண்டிருந்த மாதிரியின்படி அதைச் செய்யும்படி கட்டளையிட்டபடியே அது அமைக்கப்பட்டிருந்தது.[c]
  rationale: The revision retains the source’s unnamed speaker and Moses’ prior vision of the pattern, while making “to make it” the content of the command rather than a separate claim that Moses performed the action. It also uses idiomatic Tamil for the tent’s presence with the forefathers. Footnote b is retained as a lexical alternative, though it is not separately anchored in the revised running text because the inherited English audit markers are not required by the Tamil wording; markers a and c remain anchored to the relevant terms.
