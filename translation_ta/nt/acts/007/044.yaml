theological_decisions:
- issue: மோசேயிடம் பேசியவரின் அடையாளம்
  choice: ‘மோசேயிடம் பேசிக்கொண்டிருந்தவர்’ என்று பெயரிடாமல் விடப்பட்டது.
  alternative: ‘மோசேயிடம் பேசிய கடவுள்’ அல்லது ‘மோசேயிடம் பேசிய ஆண்டவர்’.
  rationale: கிரேக்கம் பேசுபவரைக் கடவுள் அல்லது ஆண்டவர் என்று இவ்வசனத்திலேயே வெளிப்படையாகப் பெயரிடாமல், பெயர்ச்சொல் போன்று செயல்படும் பங்கேற்பு வினைச்சொல்லால் குறிக்கிறது. ஆகவே இறையியல் ரீதியாகச் சரியானதாக இருக்கக்கூடிய அடையாளத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல், மூலத்தின் மறைமுகத்தன்மை பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத்தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கூடாரம்’, ‘மாதிரி’ போன்ற எளிய சொற்களுடன் வேதாகமப் புவியியல் வழக்குச் சொல்லான ‘வனாந்தரம்’ இணைக்கப்பட்டுள்ளது. மூலத்தின் நீண்ட வாக்கிய அமைப்பு தமிழில் தெளிவிற்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கருத்துத் தொடர்பு ‘கட்டளையிட்டபடியே’ என்பதால் பேணப்படுகிறது.
