  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: ta
  text: வனாந்தரத்தில் நம் தந்தையருடன் சாட்சியின் கூடாரம்[a] இருந்தது; மோசேயிடம் பேசியவர், மோசே கண்டிருந்த மாதிரியின்படி அதைச் செய்யும்படி கட்டளையிட்டபடியே அது அமைக்கப்பட்டிருந்தது.[c]
