    text: அல்லது, ‘மோசேயிடம் பேசியவர்’; ‘மோசேயிடம் பேசிய கடவுள்/ஆண்டவர்’ என்றும் பொருள் கொள்ளலாம். கிரேக்கம் பேசுபவரின் பெயரை வெளிப்படையாகக் குறிப்பிடவில்லை.
