id: ACT.7.48
reference: Acts 7:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχ ὁ ὕψιστος ἐν ⸀χειροποιήτοις κατοικεῖ· καθὼς ὁ προφήτης λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: ta
  text: 'ஆனால் உன்னதமானவர் கைகளால் செய்யப்பட்டவற்றில்[a] குடியிருப்பதில்லை; தீர்க்கதரிசி கூறுவதுபோல்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கைகளால் செய்யப்பட்ட ஆலயங்களில்.” கிரேக்கச் சொற்றொடர் “கைகளால் செய்யப்பட்டவற்றில்” எனப் பரந்த பொருளுடையது; எனினும் உடனடிச் சூழல் ஆலயத்தைப் பற்றியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: சாலொமோன் ஓர் இல்லத்தைக் கட்டினார் என்ற முந்தைய கூற்றுடன் வலுவான முரண்பாட்டைக் குறிக்கிறது.
- source_word: οὐχ
  choice: குடியிருப்பதில்லை
  rationale: κατοικεῖ என்ற வினையுடன் இணைந்த மறுப்பை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: ὁ ὕψιστος
  choice: உன்னதமானவர்
  rationale: தேவனைக் குறிக்கும் பட்டப்பெயரின் தன்மையைப் பேணுகிறது; மூலத்தில் இல்லாத ‘தேவன்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἐν χειροποιήτοις
  choice: மனிதக் கைகளால் செய்யப்பட்டவற்றில்
  rationale: χειροποιήτοις என்பது ஆலயங்களை மட்டும் குறுகலாகச் சுட்டாமல், மனிதக் கைகளால் செய்யப்பட்டவை என்ற பரந்த பன்மைப் பொருளைக் கொண்டுள்ளது.
- source_word: κατοικεῖ
  choice: குடியிருப்பதில்லை
  rationale: தெய்வீக வாசத்தைக் குறிக்கும் சூழலில் ‘குடியிரு’ இயல்பாகவும் மரியாதைக்குரியதாகவும் உள்ளது.
- source_word: καθὼς
  choice: கூறுவதுபோல
  rationale: அடுத்து வரும் தீர்க்கதரிசன மேற்கோள் இக்கூற்றை உறுதிப்படுத்துவதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὁ προφήτης
  choice: தீர்க்கதரிசி
  rationale: மூலம் பெயரைக் குறிப்பிடாததால் ‘ஏசாயா’ என்று விரிவுபடுத்தாமல் உள்ளது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: வேதவாக்கின் தொடர்ந்த சாட்சியை உணர்த்தும் நிகழ்கால மேற்கோள் முறையைப் பேணுகிறது.
theological_decisions:
- issue: χειροποιήτοις என்பதைக் குறிப்பாக ‘ஆலயங்கள்’ என்று மொழிபெயர்க்கலாமா?
  choice: ‘மனிதக் கைகளால் செய்யப்பட்டவற்றில்’ என்ற பரந்த சொல்லாக்கத்தை வைத்தல்
  alternative: ‘மனிதக் கைகளால் செய்யப்பட்ட ஆலயங்களில்’
  rationale: உடனடிச் சூழல் ஆலயத்தைப் பற்றியது; எனினும் கிரேக்கப் பன்மைச் சொல் அதைவிடப் பரந்தது. ஆகவே மனிதர் உருவாக்கிய புனிதக் கட்டமைப்புகள் அல்லது பொருட்கள் மீதான விமர்சனத் தொனியைச் சுருக்காமல் பேணுகிறது.
- issue: ὁ ὕψιστος என்பதில் ‘தேவன்’ என்பதை வெளிப்படையாகச் சேர்க்கலாமா?
  choice: ‘உன்னதமானவர்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘உன்னதமான தேவன்’
  rationale: இது தேவனைக் குறிக்கும் என்பது தெளிவு; ஆனால் மூலத்தில் θεός இல்லை. எனவே பொருளைப் பேணிக்கொண்டு இல்லாத சொல்லைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கிற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘உன்னதமானவர்’ பட்டப்பெயரின் உயர்தொனியைப் பேணுகிறது; ‘மனிதக் கைகளால் செய்யப்பட்டவற்றில்’ மூலத்தின் பரந்த பொருளையும் பன்மையையும் காக்கிறது.
