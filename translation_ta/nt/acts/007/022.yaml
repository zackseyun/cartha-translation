source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: ta
  text: மோசே எகிப்தியர்களின் எல்லா ஞானத்திலும் கல்வி பயிற்றுவிக்கப்பட்டார்; அவர் தமது சொற்களிலும் செயல்களிலும் வல்லவராக இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேச்சிலும் செயல்களிலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: கல்வி கற்றார்
  rationale: இங்கு παιδεύω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் மோசே பெற்ற கல்வியையும் பயிற்சியையும் குறிக்கிறது. தமிழில் இயல்பாக இருக்க, செயப்பாட்டு வடிவத்துக்குப் பதிலாக அதே பொருளைத் தரும் ‘கல்வி கற்றார்’ பயன்படுத்தப்பட்டது.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: எகிப்தியர்களின் எல்லா ஞானத்திலும்
  rationale: πάσῃ என்பதன் முழுமையான பரப்பையும், Αἰγυπτίων என்பதன் உடைமை அல்லது மூலத் தொடர்பையும், கல்வியின் உள்ளடக்கம் அல்லது துறையைக் குறிக்கும் வேற்றுமையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: δυνατὸς
  choice: வல்லவராக
  rationale: δυνατός இங்கு திறனும் வலிமையும் உடையவர் என்ற பொருளைத் தருகிறது. ‘வல்லவர்’ என்பது பின்வரும் சொற்கள் மற்றும் செயல்கள் ஆகிய இரண்டுடனும் இயல்பாக இணைகிறது.
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: சொற்களிலும் செயல்களிலும்
  rationale: λόγοις / ἔργοις என்ற இணைச்சொற்களின் சமநிலையை நெருக்கமாகக் காக்கிறது. ‘சொற்கள்’ என்பது அவர் பேசியவற்றையும், ‘செயல்கள்’ என்பது அவர் செய்தவற்றையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: αὐτοῦ
  choice: தமது
  rationale: αὐτοῦ மோசேயைச் சுட்டி, சொற்களும் செயல்களும் அவருக்குரியவை என்பதைத் தெளிவுபடுத்துகிறது. வாக்கியத்தின் எழுவாயையே திரும்பச் சுட்டுவதால் மரியாதையுடனான ‘தமது’ இயல்பான தேர்வு.
theological_decisions:
- issue: λόγοις என்பதில் மோசேயின் வல்லமையின் பொருள் மற்றும் யாத்திராகமம் 4:10 உடனான பதற்றம்
  choice: ‘தமது சொற்களிலும் செயல்களிலும் வல்லவராக இருந்தார்’ என்று வசனத்தின் சொந்த கூற்றை நேரடியாகக் காத்தல்
  alternative: ‘பேச்சிலும் நடவடிக்கைகளிலும் வல்லவர்’ என்று தளர்வாக மொழிபெயர்த்தல் அல்லது இது மோசேயின் சொந்தப் பேச்சுத்திறனைக் குறிக்காது என விளக்கமளித்தல்
  rationale: ஸ்தேவானின் கூற்று அதன் சொந்த மொழிநடையில் மொழிபெயர்க்கப்பட வேண்டும். யாத்திராகமம் 4:10-இல் மோசே தம்மைப் பற்றிக் கூறுவதோடு காணப்படும் பதற்றத்தை மொழிபெயர்ப்பு மறைக்கவோ இணக்கப்படுத்தவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் இணையான அமைப்பும் இறுதியில் வரும் αὐτοῦ என்பதன் தொடர்பும் காக்கப்பட்டுள்ளன.
