reference: Acts 7:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: ta
  text: 'மோசே அதைக் கண்டதும், அந்தக் காட்சியால்[a] வியப்படைந்தார். அதை உற்றுப் பார்க்க அவர் அருகில் சென்றபோது, ஆண்டவரின் குரல் வந்தது[b][c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தரிசனத்தால்.’ கிரேக்கச் சொல் காணக்கூடிய தோற்றத்தையோ தரிசனத்தையோ குறிக்கலாம்; இங்கு மோசே எரியும் முட்செடியை நேரில் காண்பதால் ‘காட்சி’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆண்டவரின் குரல் ஒன்று எழுந்தது.’
    reason: lexical_alternative
  - marker: c
    text: இந்த நிகழ்வு யாத்திராகமம் 3-ஐ நினைவூட்டுவதால் சிலர் இங்கு இறைப்பெயரைக் குறிக்கும் வடிவை எதிர்பார்க்கலாம்; ஆனால் கிரேக்க மூலத்தில் ‘ஆண்டவர்’ (κύριος) என்றே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: அதைக் கண்டதும்
  rationale: ὁράω என்பதன் இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது. அடுத்துவரும் ‘காட்சி’ என்பதிலிருந்து பொருளை இயல்பாக எடுத்துக்காட்ட ‘அதை’ சேர்க்கப்பட்டது.
- source_word: ἐθαύμασεν
  choice: வியப்படைந்தார்
  rationale: θαυμάζω இங்கு ஆச்சரியத்தையும் வியப்பையும் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் ‘வியப்படைந்தார்’ அதை வெளிப்படுத்துகிறது.
- source_word: τὸ ὅραμα
  choice: அந்தக் காட்சி
  rationale: ὅραμα என்பது காணப்படும் தோற்றத்தையோ தரிசனத்தையோ குறிக்கலாம். எரியும் முட்செடியை மோசே நேரில் காணும் இந்தச் சூழலில் ‘காட்சி’ இயல்பானது; ‘தரிசனம்’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு காக்கிறது.
- source_word: προσερχομένου
  choice: அவர் அருகில் சென்றபோது
  rationale: αὐτοῦ உடனான இந்த genitive absolute காலத்தையும் உடன்நிகழும் சூழலையும் காட்டுகிறது. மோசே காட்சியை நோக்கி நெருங்கிய இயக்கத்தை மொழிபெயர்ப்பு தெளிவாகக் காக்கிறது.
- source_word: κατανοῆσαι
  choice: உற்றுப் பார்க்க
  rationale: κατανοέω கவனமாக நோக்குதல் அல்லது ஆராய்ந்து பார்த்தலைக் குறிக்கிறது. காட்சிசார் சூழலில் ‘உற்றுப் பார்க்க’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἐγένετο φωνὴ
  choice: ஒரு குரல் வந்தது
  rationale: ἐγένετο + பெயர்ச்சொல் அமைப்பு ஒரு நிகழ்வு ஏற்பட்டதை அறிமுகப்படுத்துகிறது. ‘ஒரு குரல் வந்தது’ அந்த நிகழ்வுத்தன்மையை வைத்துக்கொண்டு தமிழில் புரியும்படி தருகிறது.
- source_word: κυρίου
  choice: ஆண்டவரிடமிருந்து
  rationale: κύριος என்பதற்கு திட்டத்தின் வழக்குப்படி ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது. φωνὴ κυρίου என்பதை இயல்பான தமிழில் குரலின் மூலத்தைக் காட்டும் ‘ஆண்டவரிடமிருந்து’ என்று வழங்குவது பொருள happening மாற்றாது.
theological_decisions:
- issue: இறைத்தோற்றச் சூழலில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / கர்த்தர்
  rationale: கிரேக்க மூலத்தில் κύριος உள்ளது; எபிரெய நான்கெழுத்து இறைப்பெயர் நேரடியாக இல்லை. ஆகவே யாத்திராகமம் 3-ன் பின்னணியை வைத்து இறைப்பெயரை மொழிபெயர்ப்புக்குள் சேர்க்காமல், கிரேக்கச் சொல்லை ‘ஆண்டவர்’ எனக் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. ‘உற்றுப் பார்க்க’ என்பது கவனமாக நோக்குதலை இயல்பாக வெளிப்படுத்துகிறது; ‘காட்சி’ என்பது வெளிப்புற நிகழ்வையும் ‘தரிசனம்’ என்ற சாத்தியத்தையும் முற்றிலும் மூடாத சமநிலைச் சொல்.
