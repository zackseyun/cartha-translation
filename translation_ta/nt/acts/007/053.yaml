  text: οἵτινες ἐλάβετε τὸν νόμον εἰς διαταγὰς ἀγγέλων, καὶ οὐκ ἐφυλάξατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/053.yaml
  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: ta
  text: தேவதூதர்கள் வழியாக அளிக்கப்பட்ட திருச்சட்டத்தைப் பெற்ற நீங்கள், அதைக் கடைப்பிடிக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: நீங்களே
  rationale: தொடர்புப்பெயரின் குணவிளக்கத் தன்மையையும், பின்வரும் இரண்டாம் நபர் பன்மை வினைச்சொற்களின் நேரடியான குற்றச்சாட்டையும் இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: ἐλάβετε
  choice: பெற்றுக்கொண்ட
  rationale: λαμβάνω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம்; மனமுவந்து ஏற்றுக்கொண்டதாகக் கூடுதல் பொருள் சேர்க்காமல், சட்டத்தைப் பெற்றதை இயல்பாகக் குறிக்கிறது.
- source_word: τὸν νόμον
  choice: திருச்சட்டத்தை
  rationale: இங்கு மோசேயின் சட்டமே குறிக்கப்படுகிறது. நவீனத் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் ‘திருச்சட்டம்’ என்பது இதனைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: தேவதூதர்களின் ஏற்பாட்டின்படி
  rationale: διαταγή என்பதிலுள்ள ஏற்பாடு, ஆணை, வழிநடத்தல் ஆகிய சாத்தியங்களை முற்றிலும் ஒன்றாகச் சுருக்கிவிடாமல், சட்டம் வழங்கப்பட்டதில் தேவதூதர்களுக்கு இருந்த இடைநிலைப் பங்கை இயல்பான தமிழில் சுட்டுகிறது.
- source_word: ἀγγέλων
  choice: தேவதூதர்களின்
  rationale: சூழலில் மனிதத் தூதர்கள் அல்ல, திருச்சட்டம் வழங்கப்பட்டதோடு தொடர்புடைய விண்ணுலகத் தூதர்களே குறிக்கப்படுகின்றனர்.
- source_word: οὐκ ἐφυλάξατε
  choice: அதைக் கடைப்பிடிக்கவில்லை
  rationale: φυλάσσω என்பது சட்டத்துடன் வரும்போது அதைக் காத்து ஒழுகுதல் அல்லது அனுசரித்தல் என்று பொருள்படும்; ‘கடைப்பிடிக்கவில்லை’ என்பது நவீனத் தமிழில் இயல்பானது.
theological_decisions:
- issue: εἰς διαταγὰς ἀγγέλων என்ற தேவதூதர் இடைநிலைச் சொற்றொடரின் பொருள்
  choice: திருச்சட்டம் தேவதூதர்களின் ஏற்பாடு அல்லது வழிநடத்தலோடு தொடர்புடையதாகப் பெறப்பட்டது.
  alternative: ‘தேவதூதர்கள் வழியாக வழங்கப்பட்ட திருச்சட்டம்’ அல்லது இன்னும் சொல்லுக்குச் சொல் முறையில் ‘தேவதூதர்களின் கட்டளைகளின்படி’ என்று மொழிபெயர்க்கலாம்.
  rationale: தேவதூதர்கள் திருச்சட்டம் வழங்கப்பட்டதில் ஈடுபட்டனர் என்பது தெளிவு; ஆனால் διαταγαί அவர்களுடைய ஏற்பாட்டையா, ஆணையையா, இடைநிலை வழங்குதலையா குறிக்கிறது என்பது உறுதியல்ல. முதன்மை உரை அந்தத் தெளிவின்மையை ஓரளவு காக்கிறது; அடிக்குறிப்பு மாற்று வாய்ப்புகளைத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான குற்றச்சாட்டின் வலிமையை ‘நீங்களே’ என்பதால் காத்து, வேதாகமத்துக்குரிய கண்ணியமான நடையைப் பேணுகிறது. கடினமான கிரேக்கச் சொற்றொடரை மிகையாக விளக்காமல் முதன்மை உரையிலும் அடிக்குறிப்பிலும் அதன் பொருள் வாய்ப்புகள் பாதுகாக்கப்பட்டுள்ளன.
