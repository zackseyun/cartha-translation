source:
  edition: SBLGNT
  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: ta
  text: இவன்[a] நம் மக்களுக்கு எதிராகச் சூழ்ச்சி செய்து, நம் மூதாதையரைக்[c] கொடுமைப்படுத்தினான். அவர்கள் தங்கள் பச்சிளம் குழந்தைகளை உயிரோடு காக்கப்படாமல் இருக்கும்படி வெளியே கைவிடச் செய்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இவன் நம் மக்களை வஞ்சகமாகக் கையாண்டு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சூழ்ச்சியான அல்லது வஞ்சகமான நடத்தையை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, குழந்தைகள் உயிரோடு காக்கப்படாமல் இருக்கும்படி அவர்களை வெளியில் கைவிடுதல்.
    reason: cultural_note
  - marker: c
    text: ‘நம் முன்னோர்களை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இஸ்ரவேலின் முந்தைய தலைமுறையினரைக் குறிக்கும் மரபான குடும்பச் சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: இவன்
  rationale: முன்பு குறிப்பிடப்பட்ட அரசனைச் சுட்டும் கிரேக்கச் சுட்டுப்பெயரின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: κατασοφισάμενος
  choice: சூழ்ச்சி செய்து
  rationale: அறிவுக்கூர்மையை மட்டும் அல்லாமல், எதிராக மேற்கொள்ளப்பட்ட தந்திரமான அல்லது வஞ்சகமான செயலையும் சூழல் உணர்த்துகிறது.
- source_word: τὸ γένος ἡμῶν
  choice: நம் மக்கள்
  rationale: இங்கு γένος என்பது இஸ்ரவேல் மக்களினத்தைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தேவையற்ற உயிரியல் இனப் பொருளைத் தவிர்க்கும் வகையிலும் உள்ளது.
- source_word: ἐκάκωσεν
  choice: கொடுமைப்படுத்தினான்
  rationale: தீங்கு விளைவித்தல் மற்றும் மோசமாக நடத்துதல் ஆகிய இரண்டையும் இச்சூழலில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοὺς πατέρας
  choice: நம் மூதாதையரை
  rationale: இஸ்ரவேலின் முந்தைய தலைமுறையினரைக் குறிக்கும் குடும்ப-வரலாற்றுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τοῦ ποιεῖν
  choice: செய்தான்
  rationale: இறைவன் வினையெச்சத் தொடரை பார்வோனின் கொடுமைப்படுத்தலின் விளைவு அல்லது வழிமுறை என இணைக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத கட்டாயப்படுத்துதல் என்ற வலிமையைச் சேர்க்கவில்லை.
- source_word: τὰ βρέφη ἔκθετα
  choice: பச்சிளம் குழந்தைகளை வெளியே கைவிட
  rationale: βρέφη மிக இளம் குழந்தைகளைக் குறிக்கிறது; ἔκθετα அக்காலத்தில் குழந்தைகளை இறக்கும்படி வெளியில் கைவிடும் நடைமுறையைக் குறிக்கிறது.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: உயிரோடு காக்கப்படாதபடி
  rationale: நோக்கம் அல்லது விளைவு என்ற உண்மையான இலக்கணத் திறப்பைத் தக்கவைத்தபடி, ζῳογονεῖσθαι என்பதன் செயப்பாட்டு வடிவையும் ‘உயிரோடு பாதுகாத்தல்’ என்ற பொருளையும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: εἰς τό தொடரின் நோக்கம் அல்லது விளைவு
  choice: ‘காக்கப்படாதபடி’ என்று இரண்டுக்கும் இடமளிக்கும் வடிவம்
  alternative: ‘உயிரோடு காக்கப்படக்கூடாது என்பதற்காக’ என்று நோக்கத்தை மட்டும் வெளிப்படுத்துதல்
  rationale: கிரேக்கத் தொடர் நோக்கத்தையோ விளைவையோ சுட்டலாம்; தமிழாக்கம் அதனைத் தேவையின்றி ஒரே வகையாக முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பச்சிளம் குழந்தைகள்’, ‘உயிரோடு காக்கப்படாதபடி’ ஆகியவை மூலத்தின் துல்லியத்தையும் வாசிப்புத் தெளிவையும் சமநிலைப்படுத்துகின்றன; வரலாற்றுச் சார்ந்த ‘வெளியே கைவிடுதல்’ அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
