source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: ta
  text: மேலும், அவர் ஆபிரகாமுக்கு விருத்தசேதனத்தின் உடன்படிக்கையைக் கொடுத்தார். இவ்வாறு ஆபிரகாம் ஈசாக்குக்குத் தந்தையானார்; எட்டாம் நாளில் ஈசாக்குக்கு விருத்தசேதனம் செய்தார். ஈசாக்கு யாக்கோபுக்குத் தந்தையானார்; யாக்கோபு பன்னிரண்டு முற்பிதாக்களுக்குத் தந்தையானார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: விருத்தசேதனத்தின் உடன்படிக்கை
  rationale: διαθήκη என்பதன் வேதாகம வரலாற்றுச் சூழலுக்கேற்ற பொருள் ‘உடன்படிக்கை’. περιτομῆς என்ற உருபுத் தொடர்பு, விருத்தசேதனத்தால் அடையாளப்படுத்தப்பட்ட குறிப்பிட்ட உடன்படிக்கையைக் குறிக்கிறது.
- source_word: οὕτως
  choice: அதன்படி
  rationale: முன்னர் கூறப்பட்ட உடன்படிக்கையையும் அடுத்து நிகழ்ந்த ஈசாக்கின் பிறப்பு மற்றும் விருத்தசேதனத்தையும் இயல்பாக இணைக்கிறது; கிரேக்கத்தின் தொடர்ச்சி/விளைவு சார்ந்த நுணுக்கத்தையும் காக்கிறது.
- source_word: ἐγέννησεν
  choice: பெற்றார்
  rationale: ஆண் வழி வம்சத் தொடரைக் குறிக்கும் γεννάω என்பதற்கு, நவீன தமிழில் ‘பெற்றார்’ இயல்பானதும் மரியாதையானதும் ஆகும். வாக்கியத்தின் ஆண் எழுவாய்கள் தந்தைமைக் கருத்தைத் தெளிவாக்குகின்றன.
- source_word: περιέτεμεν
  choice: விருத்தசேதனம் செய்தார்
  rationale: περιτέμνω என்பதற்கான நிலைபெற்ற, கண்ணியமான வேதாகமத் தமிழ் சொற்றொடர்; உடன்படிக்கைச் சடங்கைத் துல்லியமாகக் குறிக்கிறது.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: எட்டாம் நாளில்
  rationale: கிரேக்க காலவியல் வேற்றுமையை இயல்பான தமிழில் நேரடியாக அளிக்கிறது; ‘பிறந்தபின்’ என்ற வெளிப்படையாக இல்லாத சொல்லைச் சேர்க்கவில்லை.
- source_word: πατριάρχας
  choice: கோத்திரத் தந்தையர்
  rationale: இங்கு இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்களின் மூதாதைத் தலைவர்களைக் குறிக்கும் வரலாற்றுப் பொருளை, சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: ஈசாக்கு / யாக்கோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: ஆபிரகாமுக்குக் கொடுக்கப்பட்ட உடன்படிக்கையின் குறிப்புத்தன்மை
  choice: ‘விருத்தசேதனத்தின் உடன்படிக்கை’ என்று குறிப்பிட்ட உடன்படிக்கையாக மொழிபெயர்த்தல்
  alternative: ‘விருத்தசேதன உடன்படிக்கை ஒன்று’
  rationale: ஆதியாகமம் 17-ல் ஆபிரகாமுக்குக் கொடுக்கப்பட்ட அடையாளம் காணக்கூடிய குறிப்பிட்ட உடன்படிக்கையையே வசனம் சுட்டுகிறது; கூடுதல் இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
- issue: γεννάω என்பதன் வம்சாவளிப் பொருள்
  choice: மூன்று இடங்களிலும் ‘பெற்றார்’
  alternative: ‘தந்தையானார்’ அல்லது பழமையான ‘ஜனிப்பித்தார்’
  rationale: ஆண் வழி வம்சத் தொடரை இயல்பான நவீன தமிழில் காக்கிறது; பழமையான அல்லது செயற்கையான நடையைத் தவிர்க்கிறது.
- issue: οὕτως என்பதன் தொடர்பு
  choice: ‘அதன்படி’
  alternative: ‘இவ்வாறு’
  rationale: உடன்படிக்கை வழங்கப்பட்டதைத் தொடர்ந்து ஆபிரகாம் உடன்படிக்கை அடையாளத்தை நிறைவேற்றிய தொடர்பை வெளிப்படுத்துகிறது; அது பிறப்பின் முறையைக் குறிக்கிறது என்று அளவுக்கு மீறி விளக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்கு புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; தகவல் உறவுகள் காக்கப்பட்டுள்ளன. ‘விருத்தசேதனம்’ என்பது இச்சூழலில் நிலைபெற்ற வேதாகமச் சொல்லாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளது.
