revisions:
- from: அந்த நாட்களில் அவர்கள் ஒரு கன்றுக்குட்டியைச் செய்து, அந்தச் சிலைக்குப் பலி செலுத்தினார்கள்; தங்கள் கைகளின் படைப்புகளைக் குறித்து மகிழ்ந்துகொண்டிருந்தார்கள்.[a]
  to: அந்த நாட்களில் அவர்கள் ஒரு கன்றைச் செய்து, அந்த விக்கிரகத்திற்குப் பலி செலுத்தினார்கள்; தங்கள் கைகள் செய்தவற்றில் மகிழ்ந்துகொண்டிருந்தார்கள்.[a]
  rationale: The revision preserves the Greek sequence and imperfect aspect while using established, clear Tamil terminology for an idol. It also makes the concluding phrase idiomatic without removing the source’s rhetorical emphasis on what human hands had made.
