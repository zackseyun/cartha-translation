source:
  edition: SBLGNT
  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: ta
  text: அந்த நாட்களில் அவர்கள் ஒரு கன்றைச் செய்து, அந்த விக்கிரகத்திற்குப் பலி செலுத்தினார்கள்; தங்கள் கைகள் செய்தவற்றில் மகிழ்ந்துகொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் கைகளின் படைப்புகளில் மகிழ்ந்துகொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: ஒரு கன்றுக்குட்டியைச் செய்து
  rationale: வினைச்சொல் ஒரு கன்றை உருவாக்குவதைக் குறிக்கிறது. அடுத்த சொற்றொடரில் அது ‘சிலை’ என்று வெளிப்படையாகக் குறிப்பிடப்படுவதால், இங்கே ‘கன்றுக்குட்டிச் சிலை’ என்று விரிவாக்காமல் மூலத்தின் சுருக்கம் காக்கப்படுகிறது.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: அந்த நாட்களில்
  rationale: கிரேக்க காலக் குறிப்பை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἀνήγαγον θυσίαν
  choice: பலி செலுத்தினார்கள்
  rationale: பலியிடும் சூழலில் இச்சொற்றொடர் பலியை அர்ப்பணிப்பதைக் குறிக்கிறது; ‘பலி செலுத்துதல்’ தமிழில் இயல்பான வழிபாட்டுச் சொற்றொடர்.
- source_word: τῷ εἰδώλῳ
  choice: அந்தச் சிலைக்கு
  rationale: குறிப்புச் சுட்டு முன்பு கூறப்பட்ட கன்றையே குறிக்கிறது. ‘அந்த’ என்பது அந்தத் தொடர்பைத் தெளிவாக்குகிறது; ‘சிலை’ என்பது εἴδωλον என்பதன் உருவவழிபாட்டுச் சார்பை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὐφραίνοντο
  choice: மகிழ்ந்துகொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்நிலைத் தன்மையை ‘கொண்டிருந்தார்கள்’ காக்கிறது.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: தங்கள் கைகளின் படைப்புகளைக் குறித்து
  rationale: ‘கைகளின் படைப்புகள்’ என்ற உருவகத்தையும் விக்கிரக வழிபாட்டுக்கு எதிரான வேதாகம விமர்சனத்தின் எதிரொலியையும் காக்கிறது. ἐν என்பதன் பொருள் இங்கு மகிழ்ச்சிக்கான காரணம் அல்லது பொருள் என்பதால் ‘குறித்து’ இயல்பான தமிழ்.
theological_decisions:
- issue: உருவவழிபாட்டு மொழியும் அதன் கண்டனத் தொனியும்
  choice: ‘சிலை’ மற்றும் ‘தங்கள் கைகளின் படைப்புகள்’ என்ற மொழியைத் தக்கவைத்தல்
  alternative: ‘உருவம்’ மற்றும் ‘தாங்கள் செய்தது’
  rationale: ஸ்தேவானின் உரை இஸ்ரவேலின் உருவவழிபாட்டைக் கண்டிக்கும் வேதாகம மொழியை எதிரொலிக்கிறது. ‘சிலை’ அந்த வழிபாட்டுப் பொருளை நடுநிலைப்படுத்தாமல் காட்டுகிறது; ‘கைகளின் படைப்புகள்’ என்ற உருவகம் மனிதனால் செய்யப்பட்டதை வழிபட்ட முரண்பாட்டைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் தொடர்நிலை அம்சம் காக்கப்பட்டுள்ளது; ‘கைகளின் படைப்புகள்’ என்ற சற்றே உயர்ந்த வேதாகம உருவகம் திட்டமிட்டு நிலைநிறுத்தப்பட்டுள்ளது.
