  source_fidelity: 'மூல கிரேக்கத்தின் இரு அடையாளக் கூறுகளும் காக்கப்பட்டுள்ளன: “உன் முன்னோர்களின் கடவுள்” என்பதும், ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருடனான மறுகூற்றும் இயல்பாகத் தரப்பட்டுள்ளன. ἔντρομος δὲ γενόμενος என்பதன் அச்சம்/நடுக்கம் மற்றும் நிகழ்வுத் தொடர்ச்சி “அப்போது மோசே அச்சத்தால் நடுங்கி” என்பதில் போதுமானவாறு வெளிப்படுகின்றன. οὐκ ἐτόλμα κατανοῆσαι என்பதற்கான “கூர்ந்து பார்க்கத் துணியவில்லை” காட்சிச் சூழலுக்கும் வினையின் பொருளுக்கும் ஏற்றது.'
