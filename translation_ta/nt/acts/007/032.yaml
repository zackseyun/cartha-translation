source:
  edition: SBLGNT
  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: ta
  text: “நான் உன் முன்னோர்களின் கடவுள்—ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோரின் கடவுள்.” அப்போது மோசே அச்சத்தால் நடுங்கி, கூர்ந்து பார்க்கத் துணியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கூர்ந்து கவனிக்க” அல்லது “ஆராய்ந்து பார்க்க” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் கவனமாகப் பார்ப்பதையோ ஆழ்ந்து கவனிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς τῶν πατέρων σου
  choice: நான் உன் முன்னோர்களின் கடவுள்
  rationale: வினைச்சொல் வெளிப்படையாக இல்லாத கிரேக்க அடையாள வாக்கியத்தை இயல்பான தமிழில் ‘நான் ... கடவுள்’ என வழங்குகிறது. πατέρων என்பதற்கு ‘தந்தையர்’ என்பது இங்கு உடனடியான தந்தையரைச் சுட்டுவதுபோல் தோன்றக்கூடும்; ‘முன்னோர்கள்’ மோசேயின் மூதாதையரைத் தெளிவாகக் குறிக்கிறது.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோரின் கடவுள்
  rationale: மூவருக்கும் உரிய கடவுள் என்ற உறவைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது; பட்டியலின் வேதாகமச் சந்தத்தையும் காக்கிறது.
- source_word: ἔντρομος δὲ γενόμενος
  choice: அப்போது ... அச்சத்தால் நடுங்கி
  rationale: ἔντρομος குறிக்கும் அச்சமும் நடுக்கமும் இரண்டையும் தெரிவிக்கிறது. δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் நிகழ்வின் அடுத்த கட்டத்துக்கு நகர்த்துவதால் ‘அப்போது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: οὐκ ἐτόλμα
  choice: துணியவில்லை
  rationale: தொடர்ந்த தயக்கம் அல்லது துணிவின்மையை இயல்பான சுருக்கமான தமிழில் தருகிறது.
- source_word: κατανοῆσαι
  choice: கூர்ந்து பார்க்க
  rationale: எரியும் புதரின் காட்சிச் சூழலில் கவனமாக உற்றுப் பார்ப்பது என்ற பொருள் பொருத்தமானது; ஆயினும் கவனித்து ஆராய்தல் என்ற விரிந்த நுண்பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் அது குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: யாத்திராகம மேற்கோளில் கடவுளின் தம்மை அடையாளப்படுத்தும் கூற்று
  choice: நான் உன் முன்னோர்களின் கடவுள்
  alternative: நான்—உன் முன்னோர்களின் கடவுள்
  rationale: கிரேக்கத்தில் வெளிப்படையான இணைப்பு வினை இல்லாவிட்டாலும், தமிழ் அடையாள வாக்கியமும் வினையின்றியே இயல்பாக அமைகிறது. ஆகவே மூலத்தின் வலியுறுத்தலைக் காத்து, கூடுதல் இறையியல் விளக்கத்தைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கடவுள்’ பொதுவான, சமயப் பிரிவுச் சார்பற்ற சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; ‘முன்னோர்கள்’ என்பது இச்சூழலில் ‘தந்தையர்’ என்பதைக் காட்டிலும் தெளிவானது.
