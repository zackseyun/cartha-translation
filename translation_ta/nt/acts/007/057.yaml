lexical_decisions:
- source_word: κράξαντες
  choice: கூச்சலிட்டு
  rationale: வினையெச்ச வடிவம் அடுத்தடுத்த செயல்களுடன் தொடர்பைப் பேணுகிறது; κράζω குறிக்கும் உரத்த கூக்குரலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: ஸ்தேவானின் தரிசனத்திலிருந்து கூட்டத்தின் பகைமையான எதிர்வினைக்குத் திரும்பும் மிதமான முரண்பாட்டை δέ இங்கு குறிக்கிறது.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான படிமத்தைப் பேணும் இயல்பான தமிழ் வழக்கு.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: தங்கள் காதுகளைப் பொத்திக்கொண்டு
  rationale: கேட்பதைத் தவிர்ப்பதற்காகக் காதுகளை அடைத்துக்கொண்ட செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὥρμησαν
  choice: பாய்ந்தார்கள்
  rationale: ὁρμάω குறிக்கும் திடீரான, வேகமான முன்னோக்கிச் செயலை வெளிப்படுத்துகிறது; கிரேக்கத்தில் இல்லாத கூடுதல் வன்முறை விவரத்தைச் சேர்க்கவில்லை.
- source_word: ὁμοθυμαδὸν
  choice: ஒருமனதாக
  rationale: கூட்டத்தினர் பகிர்ந்த ஒரே நோக்கத்துடன் ஒன்றுபட்டுச் செயல்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐπ’ αὐτόν
  choice: அவர்மேல்
  rationale: ἐπί + வேற்றுமை உருபு இங்கு ஒருவரை நோக்கிய பகைமையான விரைவைச் சுட்டுகிறது; ‘அவர்மேல் பாய்ந்தார்கள்’ என்பது இயல்பான தமிழ் இணைவு.
