  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: ta
  text: ஆனால் அவர்கள் உரத்த குரலில் கூச்சலிட்டு, தங்கள் காதுகளைப் பொத்திக்கொண்டு, ஒருமனதாக[a] அவரை நோக்கிப் பாய்ந்தார்கள்.
