    text: அல்லது, ‘ஒன்றுபட்டு.’ ὁμοθυμαδόν என்ற கிரேக்க வினையடை அவர்கள் ஒருங்கிணைந்து செயல்பட்டதை வலியுறுத்துகிறது.
