id: ACT.7.34
reference: Acts 7:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: ta
  text: “எகிப்தில் இருக்கும் என் மக்களுக்கு இழைக்கப்படும் கொடுமையை நான் நிச்சயமாகக் கண்டேன்[a]. அவர்களுடைய பெருமூச்சையும் கேட்டேன். அவர்களை மீட்பதற்காக இறங்கி வந்தேன். இப்போது வா[b]; நான் உன்னை எகிப்துக்கு அனுப்புவேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மக்களின் துன்பத்தை” அல்லது “என் மக்கள் ஒடுக்கப்படுவதை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இங்கே வா.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: நான் நிச்சயமாகக் கண்டேன்
  rationale: வினையெச்சமும் அதே வேரிலான வினைமுற்றும் சேர்ந்த இந்த எபிரேயப் பாணி அமைப்பு பார்வையின் உறுதியை வலியுறுத்துகிறது. சொல்லுக்குச் சொல் மொழிபெயர்ப்பை விட, இயல்பான தமிழில் ‘நிச்சயமாகக் கண்டேன்’ அந்த வலியுறுத்தலைத் தெளிவாகக் காக்கிறது.
- source_word: κάκωσιν
  choice: இழைக்கப்படும் கொடுமை
  rationale: இச்சொல் கடுமையான நடத்தையால் ஏற்படும் துன்பத்தையோ ஒடுக்குதலையோ குறிக்கிறது. ‘மக்களுக்கு இழைக்கப்படும் கொடுமை’ என்பது தவறான நடத்தையையும் அதன் வேதனையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; பொருளை அரசியல் ஒடுக்குமுறை என்று மட்டும் குறுக்கவில்லை.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: எகிப்தில் இருக்கும் என் மக்கள்
  rationale: மக்களின் இருப்பிடத்தை அடையாளப்படுத்தும் கிரேக்கத் தொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘என் மக்கள்’ என்பதிலுள்ள உடைமை மற்றும் உடன்படிக்கை சார்ந்த ஒலிப்பும் காக்கப்படுகிறது.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: அவர்களுடைய பெருமூச்சு
  rationale: கிரேக்க ஒருமைச் சுட்டுப்பெயர் ‘மக்கள்’ என்ற கூட்டுப்பெயரைச் சுட்டுகிறது. தமிழில் இயல்பான கூட்டுப் பொருளுக்காகப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘பெருமூச்சு’ என்பது வேதனையால் எழும் முனகல் அல்லது ஆழ்ந்த நெடுமூச்சை வெளிப்படுத்துகிறது.
- source_word: κατέβην
  choice: இறங்கி வந்தேன்
  rationale: தெய்வீகத் தலையீட்டை மனித உருவக மொழியில் விவரிக்கும் மூலத்தின் சொல்லாட்சியை விளக்கி மழுப்பாமல் காக்கிறது. தமிழில் இறங்கி வருதலை இயல்பாகக் குறிக்கிறது.
- source_word: ἐξελέσθαι
  choice: மீட்பதற்காக
  rationale: இச்சூழலில் வலுக்கட்டாய நிலையிலிருந்து விடுவித்தல் அல்லது காப்பாற்றுதல் என்பதே பொருள். ‘மீட்பது’ செயற்பாட்டுள்ள விடுதலையைச் சுருக்கமாகவும் கண்ணியமான நடையிலும் தருகிறது.
- source_word: δεῦρο
  choice: வா
  rationale: மோசேயை முன்வர அழைக்கும் கட்டளைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது. இடச்சுட்டுப் பொருளை வெளிப்படையாகக் காட்ட ‘இங்கே வா’ என்பதும் சாத்தியம்.
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: நான் உன்னை எகிப்துக்கு அனுப்புவேன்
  rationale: மோசேயின் பணிநியமனத்தை நேரடியான எதிர்காலக் கூற்றாகத் தருகிறது. இலக்கைத் தமிழில் இயல்பாக ‘எகிப்துக்கு’ என்று குறிக்கிறது.
theological_decisions:
- issue: கடவுள் ‘இறங்கி வந்தேன்’ என்று கூறும் மனித உருவக மொழி
  choice: இறங்கி வந்தேன்
  alternative: தலையிட வந்தேன்
  rationale: மூலம் தெய்வீகச் செயலை ‘இறங்கி வருதல்’ என்று நேரடியாகக் கூறுகிறது. அதை ‘தலையிடுதல்’ என்று விளக்கவுரையாக்காமல், மூலத்திலுள்ள உருவகத்தையும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு காக்கிறது.
- issue: ἐξελέσθαι என்பதின் விடுதலைப் பொருள்
  choice: மீட்பதற்காக
  alternative: விடுவிப்பதற்காக
  rationale: இரண்டும் மொழியியல் ரீதியில் சாத்தியம். ‘மீட்பது’ ஆபத்திலும் அடக்குமுறையிலும் இருந்து செயற்பாட்டுடன் காப்பதை வெளிப்படுத்துகிறது; குறிப்பிட்ட பிற்கால இறையியல் கோட்பாட்டை இங்கு திணிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டுள்ளது. தெய்வீக உரையின் நேரடித் தன்மையும் யாத்திராகமப் பின்னொலியும் காக்கப்பட்டுள்ளன. தேவையற்ற சமயக் குழு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
