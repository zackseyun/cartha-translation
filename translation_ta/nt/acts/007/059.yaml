  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: ta
  text: 'அவர்கள் ஸ்தேவான்மீது கல்லெறிந்துகொண்டிருந்தபோது, அவர் வேண்டி இவ்வாறு சொன்னார்: “ஆண்டவராகிய இயேசுவே, என் ஆவியை ஏற்றுக்கொள்ளுங்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: கல்லெறிந்துகொண்டிருந்தபோது
  rationale: முற்றுப்பெறாத இறந்தகால வினை ongoing action-ஐக் குறிக்கிறது; தாக்குதல் தொடர்ந்து நடந்துகொண்டிருந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπικαλούμενον
  choice: வேண்டிக்கொண்டு
  rationale: இங்கு ஸ்தேவான் இயேசுவை நேரடியாக அழைத்து வேண்டுவதைப் பங்கேற்புவினை குறிக்கிறது. ‘வேண்டிக்கொண்டு’ என்பது மன்றாட்டு/அழைப்பு பொருளை இயல்பாகத் தருகிறது; சொல்லின் விரிவான ‘அழைத்துக்கொண்டு’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: λέγοντα
  choice: என்றார்
  rationale: நேரடி உரையைத் தொடர்ந்து வரும் இயல்பான நவீனத் தமிழ் நடை; கிரேக்கப் பங்கேற்புவினையின் உரையாடல் செயல்பாட்டைத் தெளிவாக வழங்குகிறது.
- source_word: Κύριε Ἰησοῦ
  choice: ஆண்டவராகிய இயேசுவே
  rationale: நேரடி அழைப்பின் மரியாதையையும் κύριος என்பதன் வழக்கமான வேதாகமப் பொருளையும் காக்கிறது; இயேசுவே வேண்டுதலின் நேரடி முகவரி என்பதையும் தெளிவாக்குகிறது.
- source_word: δέξαι
  choice: ஏற்றுக்கொள்ளும்
  rationale: δέχομαι என்பதன் கட்டளை வடிவத்தை மரியாதைமிக்க வேண்டுகோளாக இயல்பான தமிழில் தருகிறது.
- source_word: τὸ πνεῦμά μου
  choice: என் ஆவியை
  rationale: இறக்கும் தருணத்தில் ஒப்படைக்கப்படும் தனிப்பட்ட ஆவியைக் குறிக்கும் நேரடியான, மரபிலும் நவீனப் பயன்பாட்டிலும் புரியக்கூடிய மொழிபெயர்ப்பு.
theological_decisions:
- issue: ஸ்தேவான் உயிர்த்தெழுந்த இயேசுவை நோக்கி வேண்டுகிறாரா என்பதை மொழிபெயர்ப்பில் எவ்வாறு காட்டுவது
  choice: ‘வேண்டிக்கொண்டு’ என்றும், ‘ஆண்டவராகிய இயேசுவே’ என்ற நேரடி அழைப்பையும் தக்கவைத்தல்
  alternative: ‘அழைத்துக்கொண்டு’ அல்லது ‘அவரை அழைத்து வேண்டிக்கொண்டு’
  rationale: கிரேக்க உரை இயேசுவையே நேரடியாக நோக்கிய மன்றாட்டைக் காட்டுகிறது. அதை மறைக்காமல் வழங்க வேண்டும்; அதே சமயம் மூலத்தில் வெளிப்படையாக இல்லாத பெயர்ச்சுட்டைச் சேர்த்து விளக்கக் கூடாது. சொல்லின் அழைத்தல்/வேண்டுதல் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; dignified ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை. தொடர்ச்சியான கல்லெறிதல், இயேசுவை நோக்கிய நேரடி வேண்டுதல், மரணத்தில் ஆவியை ஒப்படைத்தல் ஆகியவை தெளிவாக வைக்கப்பட்டுள்ளன.
