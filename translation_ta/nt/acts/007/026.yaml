id: ACT.7.26
reference: Acts 7:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: ta
  text: மறுநாள், அவர்கள் சண்டையிட்டுக்கொண்டிருந்தபோது மோசே அவர்களுக்குத் தோன்றி, அவர்களிடையே சமாதானம் ஏற்படுத்த முயன்று,[a] “ஆண்களே, நீங்கள் சகோதரர்கள்; ஏன் ஒருவருக்கொருவர் அநீதி செய்கிறீர்கள்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களிடையே சமாதானம் ஏற்படுத்திக்கொண்டிருந்தார்.” கிரேக்க இறந்தகாலத் தொடர்வினை நடந்துகொண்டிருந்த செயலைக் குறிக்கலாம்; இங்கு அடுத்த வசனத்தின் சூழலில், மோசே அவர்களிடையே சமாதானம் ஏற்படுத்த முயன்றார் என்ற பொருள் அதிகம் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: அடுத்த நாளில்
  rationale: தொடர்ந்து வரும் நாளைக் குறிக்கும் காலத் தொடரை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: ὤφθη
  choice: தோன்றி
  rationale: ὁράω என்பதன் இச்செயப்பாட்டு வடிவம் இக்கதைச் சூழலில் ‘தோன்றினார்’ என்ற செயப்படுபொருள் குன்றிய பொருளைக் கொண்டுள்ளது.
- source_word: αὐτοῖς μαχομένοις
  choice: அவர்கள் சண்டையிட்டுக்கொண்டிருந்தபோது
  rationale: நடந்துகொண்டிருந்த செயலைக் குறிக்கும் பங்கேற்புவினையின் தொடர்ச்சித் தன்மையை வெளிப்படுத்துகிறது.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: அவர்களைச் சமாதானப்படுத்த முயன்று
  rationale: அடுத்த வசனத்தில் முயற்சி நிராகரிக்கப்படுவதால், நிறைவேறாத முயற்சியைக் குறிக்கக்கூடிய இறந்தகாலத் தொடர்வினையின் நுணுக்கத்தைப் பாதுகாக்கிறது; தமிழிலும் இயல்பாக உள்ளது.
- source_word: Ἄνδρες
  choice: ஆண்களே
  rationale: இங்கு பேசப்படுபவர்கள் குறிப்பாக இரண்டு ஆண்கள்; மூலத்தின் நேரடி அழைப்பைத் தக்கவைக்கிறது.
- source_word: ἀδελφοί ἐστε
  choice: நீங்கள் சகோதரர்கள்
  rationale: சக இஸ்ரவேலர் என்ற உறவையும் பகிரப்பட்ட சகோதரத்துவத்தை முன்வைக்கும் அழைப்பையும் நேரடியாகத் தருகிறது.
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: ஏன் ஒருவருக்கொருவர் தீங்கு செய்கிறீர்கள்?
  rationale: ἀδικέω குறிக்கும் தவறு அல்லது அநீதி செய்வதை, உடனடி சண்டைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சமாதானப்படுத்தும் செயல் நிறைவேறியதா அல்லது முயற்சியாக இருந்ததா
  choice: முயற்சியாக இருந்தது என்று முதன்மை உரையில் வெளிப்படுத்தப்பட்டது
  alternative: ‘அவர்களைச் சமாதானத்துக்குக் கொண்டுவந்துகொண்டிருந்தார்’ அல்லது ‘சமாதானப்படுத்திக்கொண்டிருந்தார்’
  rationale: συνήλλασσεν என்ற இறந்தகாலத் தொடர்வினை நடப்பிலிருந்த செயலாகவும் முயற்சிச் செயலாகவும் வாசிக்கப்படலாம். அடுத்த வசனத்தில் மோசே நிராகரிக்கப்படுவதால் முயற்சிப் பொருள் சூழலுக்கு மிகவும் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘சமாதானப்படுத்த முயன்று’ என்பது இயல்பான தமிழ் நடையோடு மூலத்தின் நிறைவேறாத முயற்சிச் சாத்தியத்தையும் தக்கவைக்கிறது. தேவையற்ற இரண்டாவது அடிக்குறிப்பு சேர்க்கப்படவில்லை; வழங்கப்பட்ட ஆங்கில [b] அடிக்குறிப்பு உரையோடு பொருந்தாத முந்தைய வடிவத்தின் எச்சமாகத் தெரிகிறது.
