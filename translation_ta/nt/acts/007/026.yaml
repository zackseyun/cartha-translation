revisions:
- from: அடுத்த நாளில், அவர்கள் சண்டையிட்டுக்கொண்டிருந்தபோது மோசே அவர்களுக்குத் தோன்றி, அவர்களைச் சமாதானப்படுத்த முயன்று,[a] “ஆண்களே, நீங்கள் சகோதரர்கள்; ஏன் ஒருவருக்கொருவர் தீங்கு செய்கிறீர்கள்?” என்றார்.
  to: மறுநாள், அவர்கள் சண்டையிட்டுக்கொண்டிருந்தபோது மோசே அவர்களுக்குத் தோன்றி, அவர்களிடையே சமாதானம் ஏற்படுத்த முயன்று,[a] “ஆண்களே, நீங்கள் சகோதரர்கள்; ஏன் ஒருவருக்கொருவர் அநீதி செய்கிறீர்கள்?” என்றார்.
  rationale: The revision makes the reconciliation explicitly reciprocal, strengthens the rendering of wrongdoing to match ἀδικεῖτε, and uses more idiomatic modern Tamil for the temporal expression. It retains the contextually likely conative reading of the imperfect and preserves the ongoing-action alternative in the footnote.
