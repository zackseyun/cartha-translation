source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: ta
  text: அப்போது ஆண்டவர் அவனிடம், “உன் கால்களிலிருந்து காலணியைக் கழற்று[a]; ஏனெனில் நீ நின்றுகொண்டிருக்கும் இடம் புனிதமான நிலம்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “உன் கால்களிலிருந்து காலணியை அவிழ்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழ் வேதாகமத் தலைப்பு; கிரேக்கத்தில் இல்லாத பழைய ஏற்பாட்டின் தனிப்பட்ட பெயர் வடிவத்தை இங்கு சேர்க்கவில்லை.
- source_word: Λῦσον
  choice: கழற்று
  rationale: அடிப்படையில் ‘அவிழ்’ என்று பொருள்படலாம்; ஆனால் காலணியைப் பற்றிய இச்சூழலில் அகற்றும் கட்டளையை இயல்பான தமிழில் ‘கழற்று’ தெளிவாகக் கூறுகிறது.
- source_word: τὸ ὑπόδημα
  choice: காலணியை
  rationale: ὑπόδημα ஒருமையில் உள்ளது; ஆகவே பரிச்சயமான பன்மைக்கு மாற்றாமல் ஒருமையைப் பாதுகாக்கிறது. குறிப்பிட்ட வகையைத் தேவையின்றி நிர்ணயிக்காமல் பொதுவான நவீனச் சொல்லைப் பயன்படுத்துகிறது.
- source_word: τῶν ποδῶν σου
  choice: உன் கால்களிலுள்ள
  rationale: கிரேக்கத்தில் ‘கால்கள்’ பன்மையாக இருப்பதைப் பாதுகாத்து, தமிழ் வழக்கில் காலணியுடன் இயல்பாக இணைக்கிறது.
- source_word: ὁ γὰρ τόπος
  choice: ஏனெனில் ... இடம்
  rationale: γάρ தரும் காரண விளக்கத்தை ‘ஏனெனில்’ என்றும், τόπος என்பதை பொதுவான ‘இடம்’ என்றும் நேரடியாகக் கொடுக்கிறது.
- source_word: ἐφ’ ᾧ
  choice: நின்றுகொண்டிருக்கும்
  rationale: தமிழில் தொடர்புப் பெயரெச்ச அமைப்பின் வழியாக ‘எதன்மேல்/எந்த இடத்தில்’ என்ற உறவை இயல்பாக வெளிப்படுத்துகிறது; ‘இடம்’ என்பதால் மேலதிக இடைச்சொல் தேவையில்லை.
- source_word: ἕστηκας
  choice: நின்றுகொண்டிருக்கும்
  rationale: நிறைவுக் கால வடிவத்தின் தற்போதைய நிலைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γῆ ἁγία
  choice: புனிதமான நிலம்
  rationale: உடனடியான உள்ளூர் சூழலில் γῆ என்பதை ‘நிலம்’ என்றும் ἁγία என்பதை ‘புனிதமான’ என்றும் மொழிபெயர்த்து, இடத்தின் பரிசுத்தத் தன்மையைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: யாத்திராகம இறைத்தோற்ற மேற்கோளில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர் / தெய்வீகப் பெயரைக் குறிக்கும் சிறப்பு வடிவம்
  rationale: புதிய ஏற்பாட்டின் கிரேக்க உரையில் κύριος மட்டுமே உள்ளது; இவ்வசனத்திலேயே இல்லாத எபிரெயத் தெய்வீகப் பெயரை மொழிபெயர்ப்பில் சேர்க்காமல், மரியாதையையும் மூலமொழி முதன்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் ஒருமை ‘காலணி’ மற்றும் பன்மை ‘கால்கள்’ ஆகிய இரண்டும் பாதுகாக்கப்பட்டுள்ளன; ‘கழற்று’ முதன்மை உரையில் சூழலுக்கேற்ற இயல்பான சொல், ‘அவிழ்’ அடிக்குறிப்பில் நேரடி சொற்பொருளாக வழங்கப்பட்டுள்ளது.
