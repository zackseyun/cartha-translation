  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: ta
  text: “விறைத்த கழுத்துள்ளவர்களே! இதயங்களிலும் காதுகளிலும் விருத்தசேதனம் பெறாதவர்களே! நீங்கள் எப்போதும் பரிசுத்த ஆவியை எதிர்க்கிறீர்கள். உங்கள் தந்தையர்[a] செய்ததுபோலவே நீங்களும் பரிசுத்த ஆவியை எதிர்க்கிறீர்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்னோர்கள்.” கிரேக்கத்தில், “தந்தையர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: வணங்காத கழுத்துள்ளவர்களே
  rationale: கிரேக்கச் சொல்லின் வலுவான ‘விறைத்த/வணங்காத கழுத்து’ உருவகத்தை வெறும் ‘பிடிவாதக்காரர்கள்’ என்று விளக்கிவிடாமல், நவீன தமிழில் புரியக்கூடிய வடிவில் தக்கவைக்கிறது.
- source_word: ἀπερίτμητοι
  choice: விருத்தசேதனம் பெறாதவர்களே
  rationale: உடன்படிக்கை சார்ந்த தீர்க்கதரிசன உருவகத்தை ‘உணர்வற்றவர்கள்’ போன்ற பொதுவான விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: καρδίαις καὶ τοῖς ὠσίν
  choice: இதயங்களிலும் காதுகளிலும்
  rationale: மரியாதை அல்லது தளம் குறிக்கும் இரு கிரேக்க வேற்றுமை வடிவங்களையும் இணையாகவும் இயல்பான தமிழிலும் காட்டுகிறது.
- source_word: ἀεὶ
  choice: எப்போதும்
  rationale: தொடர்ந்து காணப்படும் எதிர்ப்பின் நிலையான தன்மையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: பரிசுத்த ஆவியை
  rationale: அப்போஸ்தலர் நடபடிகளின் சூழலில் உள்ள குறிப்பிட்ட தெய்வீக ஆவியைக் குறிக்கும் சொற்றொடரை வழக்கமான, பிரிவுசார்பற்ற கிறிஸ்தவத் தமிழில் தருகிறது.
- source_word: ἀντιπίπτετε
  choice: எதிர்க்கிறீர்கள்
  rationale: செயல்முறையான எதிர்ப்பை மிகைப்படுத்தாமல் தெளிவாகத் தெரிவிக்கிறது.
- source_word: οἱ πατέρες ὑμῶν
  choice: உங்கள் தந்தையர்
  rationale: கிரேக்கத்தின் ஆண்பால் குடும்பச் சொல்லைத் தக்கவைத்து, முந்தைய தலைமுறையினருடனான சொல்லாட்சித் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ὡς ... καὶ ὑμεῖς
  choice: செய்ததுபோலவே நீங்களும் செய்கிறீர்கள்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள செயலை தமிழில் இயல்பாக நிறைவு செய்து, முன்னோர்களுக்கும் கேட்போருக்கும் இடையிலான ஒப்புமையைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘பரிசுத்த ஆவி’ என்பதன் குறிப்பு
  choice: குறிப்பிட்ட தெய்வீக பரிசுத்த ஆவி
  alternative: பொதுவான தெய்வீக ஆற்றல் அல்லது பரிசுத்த மனப்பான்மை
  rationale: உறுப்புகளுடன் வரும் கிரேக்கச் சொற்றொடரும் அப்போஸ்தலர் நடபடிகளின் பயன்பாடும் குறிப்பிட்ட பரிசுத்த ஆவியையே சுட்டுகின்றன; அதற்கு மேல் விளக்கக் கூறுகள் சேர்க்கப்படவில்லை.
- issue: விருத்தசேதன உருவகம்
  choice: இதயங்களிலும் காதுகளிலும் ‘விருத்தசேதனம் பெறாதவர்கள்’ என்ற உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘இதயம் மூடியவர்கள், செவிடர்கள்’ போன்ற விளக்க மொழிபெயர்ப்பு
  rationale: இது இஸ்ரவேலின் வேதவாக்கியங்களிலுள்ள உடன்படிக்கை மற்றும் உள்ளார்ந்த கலக மொழியை நினைவூட்டுகிறது; அதைக் பொதுவான உளவியல் விளக்கமாகக் குறைக்கக்கூடாது.
- issue: πατέρες என்ற பாலினம் குறித்த முன்னோர் சொல்
  choice: தந்தையர்
  alternative: முன்னோர்கள் / மூதாதையர்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தையும் ஸ்தேவானின் குற்றச்சாட்டின் நேரடித் தன்மையையும் முதன்மை உரையில் பாதுகாக்கிறது; உள்ளடக்க ரீதியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கடுமையான தீர்க்கதரிசனக் கண்டனத்தின் தொனியைத் தக்கவைக்கும் வகையில் உரை அமைக்கப்பட்டுள்ளது. ‘வணங்காத கழுத்து’ மற்றும் ‘விருத்தசேதனம் பெறாத’ என்ற அசல் உருவகங்கள் விளக்கமாக மென்மையாக்கப்படவில்லை; அதேவேளை வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்குப் புரியும் அளவில் இயல்பாக்கப்பட்டுள்ளது.
