  source_fidelity: 'மையப் பொருள் சரியாக உள்ளது: மோசே வனாந்தரக் கூட்டத்தில், சீனாய் மலையில் அவரோடு பேசிக்கொண்டிருந்த தேவதூதருடனும் இஸ்ரவேலின் முற்பிதாக்களுடனும் இருந்தார்; அவர் நமக்குக் கொடுக்க உயிருள்ள தெய்வீக உரைகளைப் பெற்றார். எனினும் ‘கூடியிருந்த மக்கள் கூட்டம்’ என்பது ἐκκλησίαவின் ‘assembly’ பொருளைத் தேவையற்ற வகையில் இரட்டிப்பாக்குகிறது. ‘இறைவாக்குகள்’ என்பது தமிழில் குறிப்பாக தீர்க்கதரிசன அறிவிப்புகளைச் சுட்டக்கூடியதால், λόγια என்பதன் பரந்த ‘தெய்வீக உரைகள்/மொழிகள்’ பொருளுக்கு ‘இறைமொழிகள்’ அதிகத் துல்லியமானது.'
  naturalness: ‘வனாந்தரக் கூட்டம்’ நவீன தரத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது; அது பிற்கால நிறுவனத் திருச்சபைப் பொருளைத் திணிக்காது. ‘நம் முற்பிதாக்கள்’ என்பது πατέρες என்பதன் வரலாற்று-ஆண்பால் குறிப்பு சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது.
  terminology: ἐκκλησίαக்கு ‘கூட்டம்’, ἐρήμῳக்கு ‘வனாந்தரம்’, ἀγγέλοςக்கு ‘தேவதூதர்’, λόγιαக்கு ‘இறைமொழிகள்’, ζῶνταக்கு ‘உயிருள்ள’ எனத் தரப்பட்டுள்ளது. ‘உயிருள்ள’ என்பதை ‘உயிரளிக்கும்’ என்று விளக்கமாக மாற்றாமல் மூலத்தின் திறந்த செறிவு பாதுகாக்கப்படுகிறது.
