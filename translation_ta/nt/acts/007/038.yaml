source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: ta
  text: வனாந்தரக் கூட்டத்தில், சீனாய் மலையில் தன்னோடு பேசிக்கொண்டிருந்த தேவதூதருடனும் நம் முற்பிதாக்களுடனும் இருந்தவர் இவரே. நமக்குக் கொடுப்பதற்காக உயிருள்ள இறைமொழிகளை அவர் பெற்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: கூடியிருந்த மக்கள் கூட்டத்தில்
  rationale: இங்கு வனாந்தரத்தில் ஒன்றுகூடியிருந்த இஸ்ரவேல் மக்களைக் குறிக்கிறது. பிற்கால நிறுவன அமைப்பை உணர்த்தக்கூடிய ‘திருச்சபை’ என்பதைத் தவிர்த்து, அடிப்படைப் பொருளான ஒன்றுகூடுதலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: இஸ்ரவேலரின் பயணப் பின்னணிக்கு ஏற்ற, வேதாகமத் தமிழில் பரவலாக அறியப்படும் சொல்; வெறும் மணற்பாலையைக் குறிப்பதாகப் பொருளைச் சுருக்குவதில்லை.
- source_word: ἀγγέλου
  choice: தேவதூதரோடும்
  rationale: சீனாய் பின்னணியில் மனிதத் தூதரை அல்ல, வானுலகத் தூதரைச் சுட்டுவதால் ‘தேவதூதர்’ தெளிவான தேர்வு.
- source_word: λαλοῦντος
  choice: பேசிக்கொண்டிருந்த
  rationale: நிகழ்ந்துகொண்டிருந்த செயலைக் காட்டும் கிரேக்கப் பங்கேற்புச் சொல்லின் தொடர்ச்சித் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: ὄρει Σινᾶ
  choice: சீனாய் மலையில்
  rationale: இடப்பெயருக்கான வழக்கமான, தெளிவான தமிழாக்கம்.
- source_word: πατέρων ἡμῶν
  choice: நம் தந்தையரோடும்
  rationale: கிரேக்கத்தின் வெளிப்படையான ஆண்பால் வடிவத்தையும் இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கும் வரலாற்றுச் சூழலையும் காக்கிறது; விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐδέξατο
  choice: பெற்றார்
  rationale: மோசே இறை வெளிப்பாட்டைப் பெற்றவர் என்ற சூழலுக்கு நேரான, இயல்பான தமிழ்.
- source_word: λόγια
  choice: இறைவாக்குகளை
  rationale: சாதாரண வார்த்தைகளைவிட இறைவனிடமிருந்து வந்த உரைகளைக் குறிக்கும் சொல்லின் வெளிப்பாட்டு தன்மையைப் பாதுகாக்கிறது.
- source_word: ζῶντα
  choice: உயிருள்ள
  rationale: ‘உயிரளிக்கும்’ என்று விளக்கமாகச் சுருக்காமல், மூலத்தின் ‘வாழும்/உயிருள்ள’ என்ற செறிவையும் இறையியல் திறந்தநிலையையும் காக்கிறது.
- source_word: δοῦναι
  choice: கொடுப்பதற்காக
  rationale: மோசே அவற்றைப் பெற்றதன் நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἡμῖν
  choice: நமக்கு
  rationale: ஸ்தேவான் தன்னையும் கேட்போரையும் இஸ்ரவேலின் உடன்படிக்கை வரலாற்றோடு இணைத்துக் கூறுவதை நேரடியாகக் காக்கிறது.
- source_word: ὁ γενόμενος
  choice: இருந்தவர்
  rationale: அந்தச் சூழலில் மோசே இருந்ததை தமிழில் இயல்பாக அடையாளப்படுத்துகிறது; ‘உண்டானவர்’ போன்ற சொற்சொல்லான ஆனால் பொருத்தமற்ற வடிவத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: வனாந்தரத்தில் இருந்த இஸ்ரவேலைக் குறிக்கும் ἐκκλησίᾳ என்பதைக் ‘திருச்சபை’ என்று மொழிபெயர்க்க வேண்டுமா
  choice: கூடியிருந்த மக்கள் கூட்டத்தில்
  alternative: சபையில் / திருச்சபையில்
  rationale: இவ்வசனம் வனாந்தரத்தில் ஒன்றுகூடிய இஸ்ரவேலரைக் குறிக்கிறது. ‘மக்கள் கூட்டம்’ என்பது மூலச்சொல்லின் அடிப்படைப் பொருளைக் காத்து, பிற்காலத் திருச்சபை நிறுவனத்தை இங்கே முன்கூட்டியே பொருத்துவதைத் தவிர்க்கிறது.
- issue: λόγια ζῶντα என்பதை விளக்கமாக ‘உயிரளிக்கும் வார்த்தைகள்’ என்று தர வேண்டுமா
  choice: உயிருள்ள இறைவாக்குகள்
  alternative: உயிருள்ள வார்த்தைகள் / உயிரளிக்கும் இறைவாக்குகள்
  rationale: கிரேக்கத்தின் செறிவான உருவகத்தை அப்படியே காக்கிறது. அவை உயிரோடு இருப்பவையா அல்லது உயிரளிப்பவையா என்ற இறையியல் ஒலியலை ஒரே விளக்கத்துக்குள் சுருக்குவதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் மரியாதையும் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள் கூட்டம்’ நிறுவனம் சார்ந்த திருச்சபைப் பொருளைத் தவிர்க்கிறது; ‘இறைவாக்குகள்’ தெய்வீக உரைகளின் தன்மையைப் பாதுகாக்கிறது. மூலத்தின் நீண்ட வாக்கியத்தை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், தொடர்புகளும் வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
