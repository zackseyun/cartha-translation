- from: வனாந்தரத்தில் கூடியிருந்த மக்கள் கூட்டத்தில்[a], சீனாய் மலையில் தன்னோடு பேசிக்கொண்டிருந்த தேவதூதரோடும் நம் தந்தையரோடும்[c] இருந்தவர் இவரே. நமக்குக் கொடுப்பதற்காக உயிருள்ள இறைவாக்குகளை[b] அவர் பெற்றார்.
  to: வனாந்தரக் கூட்டத்தில், சீனாய் மலையில் தன்னோடு பேசிக்கொண்டிருந்த தேவதூதருடனும் நம் முற்பிதாக்களுடனும் இருந்தவர் இவரே. நமக்குக் கொடுப்பதற்காக உயிருள்ள இறைமொழிகளை அவர் பெற்றார்.
  rationale: மூலத்தின் உறவுகளையும் நோக்கத்தையும் மாற்றாமல், ἐκκλησίαவுக்கான தமிழ்ச் சொற்றொடரிலிருந்த மீளுரைப்பை நீக்கி, λόγιαவுக்கான சொல்லைத் தீர்க்கதரிசன வாக்கு என்ற குறுகிய பொருளிலிருந்து தெய்வீக உரைகள் என்ற பரந்த பொருளுக்கு ஒழுங்குபடுத்தினேன். அடிக்குறிப்பு அடையாளங்கள் a, b, c உரிய சொற்களிலேயே நிலைநிறுத்தப்பட வேண்டும்.
