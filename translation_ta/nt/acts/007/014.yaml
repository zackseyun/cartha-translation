  to: பின்பு யோசேப்பு ஆள் அனுப்பி, தன் தந்தை யாக்கோபையும் யாக்கோபின் உறவினர்கள் அனைவரையும்—மொத்தம் எழுபத்தைந்து பேரை—வரவழைத்தார்.[a]
