source:
  edition: SBLGNT
  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: ta
  text: பின்பு யோசேப்பு ஆள் அனுப்பி, தன் தந்தை யாக்கோபையும் யாக்கோபின் உறவினர்கள் அனைவரையும்—மொத்தம் எழுபத்தைந்து பேரை—வரவழைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பழைய ஏற்பாட்டுப் பகுதிகள் மொத்த எண்ணிக்கையை ‘எழுபது’ என்று தருகின்றன (எடுத்துக்காட்டாக, ஆதியாகமம் 46:27 மற்றும் யாத்திராகமம் 1:5 ஆகியவற்றின் எபிரெய உரை); இங்கு அப்போஸ்தலர் நடபடிகள் ‘எழுபத்தைந்து’ என்று கூறுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: ஆள் அனுப்பி
  rationale: தொடர்ந்து வரும் வரவழைத்தார் என்ற வினையுடன் இயல்பாக இணைந்து, ஒருவரை அனுப்பிய செயலைத் தமிழில் தெளிவாக உணர்த்துகிறது; கிரேக்கத்தில் அனுப்பப்பட்ட பொருள் அல்லது செய்தி வெளிப்படையாகக் குறிப்பிடப்படாததால் ‘செய்தி அனுப்பி’ எனச் சேர்க்கப்படவில்லை.
- source_word: δὲ
  choice: பின்பு
  rationale: கதை நிகழ்வின் அடுத்த கட்டத்தைக் குறிக்கும் இணைப்பை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μετεκαλέσατο
  choice: வரவழைத்தார்
  rationale: ஒருவரைத் தன்னிடம் வரும்படி அழைப்பித்தல் அல்லது ஆள் அனுப்பி அழைத்தல் என்ற நடுத்தர வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: தன் தந்தை யாக்கோபை
  rationale: அடைமொழித் தொடர்பைத் தெளிவாகவும் இயல்பான தமிழ் சொல்வரிசையிலும் தருகிறது; ‘தன்’ என்பது எழுவாயான யோசேப்பையே சுட்டுகிறது.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: அவருடைய உறவினர்கள் அனைவரையும்
  rationale: συγγένεια குறிக்கும் முழு உறவினர் வட்டத்தை, ‘குடும்பம்’ என்பதைக் காட்டிலும் அகலமாகவும் நவீனத் தமிழில் தெளிவாகவும் வெளிப்படுத்துகிறது. இங்கு ‘அவருடைய’ என்பது அருகிலுள்ள யாக்கோபைச் சுட்டும் இயல்பான வாசிப்பை வழங்குகிறது.
- source_word: ἐν ψυχαῖς
  choice: மொத்தம் … பேரை
  rationale: சொல்லுக்குச் சொல் ‘ஆத்துமாக்களில்’ என்பதற்குப் பதிலாக, மனிதர்களை எண்ணும் கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἑβδομήκοντα πέντε
  choice: எழுபத்தைந்து
  rationale: கிரேக்க மூலத்தில் உள்ள எண்ணை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: 'யாக்கோபின் குடும்பத்தாரின் மொத்த எண்ணிக்கை: ஆதியாகமம்/யாத்திராகம மரபுகளுடனான வேறுபாடு'
  choice: மொத்தம் எழுபத்தைந்து பேர்
  alternative: மொத்தம் எழுபது பேர்
  rationale: அப்போஸ்தலர் 7:14-ன் கிரேக்க உரை வெளிப்படையாக எழுபத்தைந்து என்று கூறுகிறது. சில பழைய ஏற்பாட்டு எபிரெய உரைப்பகுதிகளில் காணப்படும் எழுபது என்ற எண்ணுடன் ஒத்திசைக்க முயலாமல், அப்போஸ்தலர் உரையின் எண்ணை முதன்மை உரையில் வைத்துப் பதற்றத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதையும் கண்ணியமும் கொண்ட நடை. ‘ஆள் அனுப்பி … வரவழைத்தார்’ என்பது கிரேக்க வினைத்தொடரைத் தமிழில் இயல்பாகக் கொடுக்கிறது. எண்ணிக்கையிலுள்ள உரைமரபுப் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
