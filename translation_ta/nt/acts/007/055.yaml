lexical_decisions:
- source_word: ὑπάρχων
  choice: நிறைந்தவராக
  rationale: இந்நிகழ்வின்போது தொடர்ந்திருந்த ஸ்தேவானின் நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்த, πλήρης என்பதோடு இணைத்து இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: πλήρης πνεύματος ἁγίου
  choice: தூய ஆவியால் நிறைந்தவராக
  rationale: ஆவியினால் முழுமையாக ஆட்கொள்ளப்பட்ட நிலையைச் சுட்டும் லூக்காவின் வழக்கைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἀτενίσας
  choice: உற்றுநோக்கி
  rationale: சாதாரணமாகப் பார்ப்பதைவிடக் கூர்மையாகவும் தொடர்ந்து கவனம் செலுத்தியும் பார்த்ததைக் குறிக்கும் வினையின் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: εἰς τὸν οὐρανόν
  choice: வானத்தை
  rationale: இக்காட்சியின் சூழலில் οὐρανός விண்ணுலகைக் குறிக்கிறது; தமிழில் ‘வானத்தை உற்றுநோக்கி’ என்பது இயல்பாகவும் அந்தச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: முதன்மை வினையைத் தெளிவாகவும் நவீன தமிழுக்கு ஏற்றவாறும் தருகிறது.
- source_word: δόξαν θεοῦ
  choice: கடவுளின் மகிமையை
  rationale: கடவுளுடைய மாட்சியின் வெளிப்பாட்டைக் குறிக்கும் மூலமொழித் தொடரை நேரடியாகப் பாதுகாக்கிறது.
- source_word: Ἰησοῦν
  choice: இயேசுவை
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ἑστῶτα
  choice: நின்றிருந்த
  rationale: இயேசு நிற்கும் நிலையில் காணப்பட்டார் என்ற காட்சியின் உயிரோட்டத்தைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: கடவுளின் வலப்பக்கத்தில்
  rationale: ἐκ δεξιῶν என்பதன் சொற்சொல் வடிவத்தை அல்லாமல், இடத்தையும் உயர்ந்த மரியாதை மற்றும் அதிகாரத்தையும் குறிக்கும் வேதாகம மரபுத்தொடரைப் பாதுகாக்கிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய வசனத்திலுள்ள பகைமை நிறைந்த கூட்டத்துக்கும் ஸ்தேவானின் ஆவிக்குரிய நிலைக்கும் இடையிலான மென்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πνεύματος ἁγίου என்பது தெய்வீக ஆளுமையைக் குறிக்கிறதா என்பது
  choice: தூய ஆவி
  alternative: தூய ஆவிக்குரிய மனநிலை
  rationale: லூக்கா–அப்போஸ்தலர் நூல்களின் பயன்பாடும் உடனடிச் சூழலும் இதை வெறும் புனிதமான மனநிலையாகவோ ஆளற்ற சக்தியாகவோ அல்லாமல், கடவுளுடைய ஆவியைக் குறிக்கும் தனிப்பட்ட குறிப்பாகக் காட்டுகின்றன.
- issue: கடவுளின் வலப்பக்கத்தில் இயேசு நிற்பதாகக் காணப்படும் காட்சி
  choice: கடவுளின் வலப்பக்கத்தில் நின்றிருந்த இயேசு
  alternative: கடவுளின் வலப்புறத்திலிருந்து நின்றிருந்த இயேசு
  rationale: இந்த மொழிபெயர்ப்பு கடவுளையும் இயேசுவையும் உரை வேறுபடுத்திக் காட்டுவதைப் பாதுகாப்பதோடு, மரியாதை மற்றும் அதிகாரத்தைக் குறிக்கும் உயர்த்தப்பட்ட நிலையின் உருவகத்தையும் மாற்றாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகமக் காட்சியின் கண்ணியத்தைக் காக்கும் வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. ‘பரிசுத்த ஆவி’ என்பதற்குப் பதிலாக இயல்பான நவீனத் தமிழான ‘தூய ஆவி’ பயன்படுத்தப்பட்டுள்ளது; ‘வலப்பக்கம்’ என்ற மரபுத்தொடர் விளக்கவுரையாக மாற்றப்படாமல் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
