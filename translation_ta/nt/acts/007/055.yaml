  text: ஆனால், அவர் பரிசுத்த ஆவியால் நிறைந்தவராய், வானத்தை உற்றுநோக்கி[a], கடவுளின் மகிமையையும் கடவுளின் வலப்பக்கத்தில் நின்றிருந்த இயேசுவையும் கண்டார்.
