  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: ta
  text: மோலோக்கின் கூடாரத்தையும் ரெப்பான் என்னும் தெய்வத்தின் நட்சத்திரத்தையும்[a]—அவற்றை வழிபடுவதற்காக நீங்கள் செய்த உருவங்களையும்[c]—நீங்கள் சுமந்து சென்றீர்கள். மேலும், நான் உங்களைப் பாபிலோனுக்கு அப்பால் நாடுகடத்துவேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆமோஸ் 5:26-ன் எபிரெய மூலத்தைப் பிரதிபலிக்கும் சில மொழிபெயர்ப்புகள், ‘ரெப்பான் என்னும் தெய்வத்தின்’ என்பதற்குப் பதிலாக ‘உங்கள் தெய்வமாகிய ரெப்பானின்’ என்று தருகின்றன. இங்கே அப்போஸ்தலர் நடபடிகளின் கிரேக்க உரை ‘ரெப்பான் என்னும் தெய்வத்தின்’ என்கிறது.
    reason: alternative_reading
  - marker: b
    text: இங்கே அப்போஸ்தலர் நடபடிகளின் கிரேக்க உரை ‘பாபிலோனுக்கு அப்பால்’ என்கிறது. மேற்கோள் கொள்ளப்பட்ட ஆமோஸ் 5:27 பொதுவாக ‘தமஸ்குவுக்கு அப்பால்’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: cross_reference
  - marker: c
    text: ‘உருவங்கள்’ என்பதற்கு ‘வடிவங்கள்’ அல்லது ‘பிரதிநிதி உருவங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνελάβετε
  choice: சுமந்து சென்றீர்கள்
  rationale: இந்தச் சூழலில் வழிபாட்டுக்குரிய பொருட்களை எடுத்துச் சுமந்ததைக் குறிக்கிறது; ‘எடுத்துக்கொண்டீர்கள்’ என்பதைவிட இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: σκηνὴν
  choice: கூடாரம்
  rationale: σκηνή என்பதன் நேரடியான பொருள் ‘கூடாரம்.’ ‘திருக்கூடாரம்’ என்பது தேவனுடைய முறையான வழிபாட்டுக் கூடாரத்தைத் தவறாக நினைவூட்டக்கூடும்; ‘வழிபாட்டிடம்’ என்பது விளக்கமளிக்கும் மொழிபெயர்ப்பு.
- source_word: Μολὸχ
  choice: மோலோக்
  rationale: கிரேக்கப் பெயரின் ஒலிபெயர்ப்பு; தமிழில் எளிதில் வாசிக்கத்தக்க வடிவம்.
- source_word: ἄστρον
  choice: நட்சத்திரம்
  rationale: சொல்லின் நேரடிப் பொருளைப் பாதுகாக்கிறது; ‘நட்சத்திர உருவம்’ என விளக்கி விடாமல் மூலத்தின் தெளிவின்மையை வைத்திருக்கிறது.
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: ரெப்பான் என்னும் தெய்வத்தின்
  rationale: அப்போஸ்தலர் நடபடிகளின் கிரேக்க வாசகம் ‘ரெப்பான் என்னும் தெய்வத்தின்’ என்கிறது; ஆமோசின் எபிரெய வாசகத்துக்கு ஏற்ப ‘உங்கள் தெய்வமாகிய ரெப்பான்’ என்று ஒத்திசைக்கப்படவில்லை.
- source_word: Ῥαιφάν
  choice: ரெப்பான்
  rationale: Ῥαιφάν என்ற கிரேக்க வடிவத்தின் இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: τύπους
  choice: உருவங்கள்
  rationale: τύπος என்பதற்கு வடிவங்கள், பிரதிநிதித்துவங்கள் என்ற பொருள்களும் உண்டு; சிலைவழிபாட்டுச் சூழலில் ‘உருவங்கள்’ தெளிவாகவும் மிகையாக விளக்காததாகவும் உள்ளது.
- source_word: ἐποιήσατε
  choice: நீங்கள் செய்த
  rationale: அவர்களே அந்த உருவங்களை உண்டாக்கினார்கள் என்ற நேரடியான குற்றச்சாட்டைப் பாதுகாக்கிறது.
- source_word: προσκυνεῖν αὐτοῖς
  choice: அவற்றை வழிபடுவதற்காக
  rationale: சமயச் சூழலில் προσκυνέω என்பதற்கு ‘வழிபடு’ இயல்பான இணை; αὐτοῖς என்பதைக் ‘அவற்றை’ எனத் தெளிவாகக் காட்டுகிறது.
- source_word: μετοικιῶ
  choice: நாடுகடத்துவேன்
  rationale: கட்டாயமாக வேறிடத்துக்கு அகதியாக அனுப்புவதைச் சுருக்கமாகவும் நீதித்தீர்ப்பின் வலிமையுடனும் தெரிவிக்கிறது.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: பாபிலோனுக்கு அப்பால்
  rationale: அப்போஸ்தலர் நடபடிகளின் கிரேக்க வாசகமான ‘பாபிலோனுக்கு அப்பால்’ என்பதை அப்படியே பின்பற்றுகிறது; ஆமோசுடன் ஒத்திசைக்கவில்லை.
theological_decisions:
- issue: ஸ்தேவானின் மேற்கோளில் நாடுகடத்தப்படும் இடம் ஆமோஸ் 5:27-ன் வழக்கமான வாசகத்திலிருந்து வேறுபடுகிறது
  choice: பாபிலோனுக்கு அப்பால்
  alternative: தமஸ்குவுக்கு அப்பால்
  rationale: அப்போஸ்தலர் நடபடிகளின் கிரேக்க உரை வெளிப்படையாக ‘பாபிலோன்’ என்கிறது. எனவே ஆமோசின் வாசகத்துடன் ஒத்திசைக்காமல், வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ரெப்பானைச் சுட்டும் சொற்றொடரின் உடைமை அமைப்பு
  choice: ரெப்பான் என்னும் தெய்வத்தின்
  alternative: உங்கள் தெய்வமாகிய ரெப்பானின்
  rationale: SBLGNT உரையில் τοῦ θεοῦ Ῥαιφάν உள்ளது; ‘உங்கள்’ என்ற சொல் அப்போஸ்தலர் நடபடிகளின் இந்தக் கிரேக்க உரையில் இல்லை. ஆமோஸ் 5:26-ன் எபிரெயப் பின்னணி அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கூடாரம்,’ ‘நட்சத்திரம்,’ ‘உருவங்கள்’ ஆகியவை மூலத்தின் படிமங்களையும் தெளிவின்மையையும் காக்கின்றன. விக்கிரக வழிபாட்டின் குற்றச்சாட்டும் நாடுகடத்தல் தீர்ப்பின் வலிமையும் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளன.
