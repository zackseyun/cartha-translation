  text: ⸂καὶ κατέβη⸃ Ἰακὼβ εἰς Αἴγυπτον. καὶ ἐτελεύτησεν αὐτὸς καὶ οἱ πατέρες ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: ta
  text: யாக்கோபு எகிப்துக்குக் கீழிறங்கிச் சென்றார். அவரும் நம் தந்தையரும் இறந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘நம் தந்தையர்’ என்று உள்ளது; இது இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது. ‘நம் முன்னோர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: ‘தந்தையர்’ என்ற நேரடி மொழிபெயர்ப்பின் வரலாற்றுக் குறிப்பையும் இயல்பான மாற்றையும் விளக்குகிறது.
lexical_decisions:
- source_word: κατέβη
  choice: சென்றார்
  rationale: கிரேக்கச் சொல் நேரடியாக ‘கீழே சென்றார்’ எனப் பொருள்பட்டாலும், எகிப்துக்குச் செல்லும் புவியியல் மரபுத்தொடரைத் தமிழில் ‘எகிப்துக்குச் சென்றார்’ என்பதே இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: Ἰακὼβ
  choice: யாக்கோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: εἰς Αἴγυπτον
  choice: எகிப்துக்கு
  rationale: εἰς குறிப்பிடும் ஓர் இடத்தை நோக்கிய இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐτελεύτησεν
  choice: இறந்தார்கள்
  rationale: τελευτάω என்பதன் நேரடியான, தெளிவான பொருள் ‘இறத்தல்.’ யாக்கோபையும் தந்தையரையும் இணைத்துக் கூறுவதால் தமிழில் பன்மை மரியாதை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: αὐτὸς καὶ οἱ πατέρες ἡμῶν
  choice: அவரும் நம் தந்தையரும்
  rationale: யாக்கோபையும் இஸ்ரவேலின் முற்பிதாக்களையும் தனித்தனியாகக் குறிப்பதோடு, மூலத்தின் இணைப்பு அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் முன்னோர்களைக் குறிக்கும் πατέρες என்பதன் மொழிபெயர்ப்பு
  choice: நம் தந்தையர்
  alternative: நம் முன்னோர்கள்
  rationale: πατέρες என்பது இங்கு இஸ்ரவேலின் ஆண் முற்பிதாக்களைக் குறிப்பதால், பாலினத்தையும் உடன்படிக்கை வரலாற்றுத் தொடர்பையும் ‘தந்தையர்’ நேரடியாகப் பாதுகாக்கிறது. ‘முன்னோர்கள்’ என்பது இயல்பான மாற்றாக இருந்தாலும் பாலினக் குறிப்பைப் பொதுமைப்படுத்தும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தில் இல்லாத ‘அங்கே’ தமிழில் மரண நிகழ்வின் இடத்தையும் இரு வாக்கியங்களின் தொடர்பையும் இயல்பாகத் தெளிவுபடுத்துகிறது; புதிய தகவலைச் சேர்ப்பதில்லை.
