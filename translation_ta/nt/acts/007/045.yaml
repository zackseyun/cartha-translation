  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: ta
  text: அதை நம் முன்னோர்கள் தங்களுக்குமுன் இருந்தவர்களிடமிருந்து பெற்றுக்கொண்டு, யோசுவாவுடன், கடவுள் நம் முன்னோர்களின் முன்பாக இருந்து துரத்தியடித்த நாடுகளைக் கைப்பற்றியபோது கொண்டுவந்தார்கள்; அது தாவீதின் நாட்கள்வரை இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “தாவீதின் நாட்கள்வரை” என்பது கூடாரம் அங்கே இருந்த காலத்தைக் குறிக்கலாம்; அல்லது கடவுள் நாடுகளைத் துரத்தியடித்த காலத்துடன் இணைத்தும் புரிந்துகொள்ளலாம். “யோசுவா” என்பதற்கான கிரேக்கப் பெயர் இயேசுவின் பெயருடன் ஒரே வடிவில் உள்ளது; இங்கே நூனின் மகன் யோசுவாவே குறிக்கப்படுகிறார்.
    reason: காலச்சொற்றொடரின் இலக்கண இணைப்பு பற்றிய தெளிவின்மையையும் Ἰησοῦς என்ற கிரேக்கப் பெயரின் இரட்டை பயன்பாட்டையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἣν
  choice: அதை
  rationale: முந்தைய வசனத்திலுள்ள சாட்சிக் கூடாரத்தைக் குறிக்கும் பெண்பால் ஒருமை உறவுப்பெயர்; தமிழில் இயல்பாகத் தொடர ‘அதை’ என வழங்கப்பட்டது.
- source_word: εἰσήγαγον
  choice: இங்கே கொண்டுவந்தார்கள்
  rationale: εἰσάγω என்பதன் ‘உள்ளே கொண்டுவருதல்’ என்ற பொருளை, வாக்காளரின் பார்வையிலுள்ள வாக்குத்தத்த நாட்டுக்குள் கொண்டுவந்த சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διαδεξάμενοι
  choice: தங்கள் முறை வந்தபோது பெற்றுக்கொண்டு
  rationale: முன்னோரிடமிருந்து அடுத்த தலைமுறையினர் வரிசையாகப் பெற்றுக்கொண்டதையும், அதன்பின் கூடாரத்தைக் கொண்டுவந்ததையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: οἱ πατέρες ἡμῶν
  choice: நம் முன்னோர்கள்
  rationale: நவீன தமிழில் பாலினக் குழப்பமின்றி மூதாதையர்/முந்தைய தலைமுறையினரைக் குறிக்கும் இயல்பான, மரியாதையான சொற்றொடர்; வசனத்திலுள்ள மறுபடியும் வருதலும் காக்கப்படுகிறது.
- source_word: μετὰ Ἰησοῦ
  choice: யோசுவாவுடன்
  rationale: Ἰησοῦς என்பது இயேசு அல்லது யோசுவா என இருவரையும் குறிக்கக்கூடிய கிரேக்கப் பெயர்; மோசேக்குப் பிந்தைய நாட்டுப்பிரவேசச் சூழல் நூனின் மகன் யோசுவாவையே குறிக்கிறது.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: நாடுகளின் நிலத்தை அவர்கள் கைப்பற்றியபோது
  rationale: κατάσχεσις என்பது ‘உடைமையாக்குதல்/கைப்பற்றுதல்’ என்பதைக் குறிக்கிறது. τῶν ἐθνῶν என்பதிலுள்ள இலக்கணத் தெளிவின்மையை தமிழில் புரியும்படி, நாடுகளுக்குரிய நிலத்தைக் கைப்பற்றிய நிகழ்வாக வழங்குகிறது; அடுத்த உறவுத்தொடர் அந்த நாடுகளையே கடவுள் துரத்தியதாகக் காட்டுகிறது.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: கடவுள் துரத்தியடித்த நாடுகளின்
  rationale: ἐξωθέωவின் வலுவான ‘வெளியே தள்ளுதல்/துரத்துதல்’ பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: நம் முன்னோர்களின் முன்பாக இருந்து
  rationale: செமித்தியத் தாக்கமுள்ள ‘முகத்தின் முன்பிலிருந்து’ என்ற சொற்றொடரின் வேதாகம நயத்தையும், அவர்களது முன்னிலையிலிருந்து அகற்றப்பட்ட பொருளையும் காக்கிறது.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: தாவீதின் நாட்கள்வரை
  rationale: அடுத்த வசனத்துடன் இணையும் கால எல்லையை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: Ἰησοῦ என்பதன் குறிப்பு
  choice: யோசுவா
  alternative: இயேசு
  rationale: கிரேக்க வடிவம் இரு பெயர்களுக்கும் ஒன்றே என்றாலும், மோசேக்குப் பின் இஸ்ரவேல் நாட்டுக்குள் நுழைந்த வரலாற்றுச் சூழல் நூனின் மகன் யோசுவாவைத் தெளிவாகச் சுட்டுகிறது. கிரேக்கப் பெயரின் இரட்டை வாய்ப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: διαδεξάμενοι என்பதன் வலிமை
  choice: முன்னோர்கள் தங்கள் முறை வந்தபோது அதைப் பெற்றுக்கொண்டு பின்னர் கொண்டுவந்தார்கள்
  alternative: முன்னோர்கள் முறைமுறையாகக் கொண்டுவந்தார்கள்
  rationale: வினையெச்சம் வெறும் ‘முறையாக’ என்ற காலவுணர்வை மட்டுமல்லாமல், முன்னிருந்தவர்களிடமிருந்து அடுத்தவர்கள் பெற்றுக்கொண்ட தொடர்ச்சியையும் சுட்டுகிறது.
- issue: ἐν τῇ κατασχέσει τῶν ἐθνῶν என்பதன் தொடர்பு
  choice: முன்னோர்கள் நாடுகளின் நிலத்தைக் கைப்பற்றிய காலம்
  alternative: நாடுகள் உடைமையாக்கப்பட்ட/அகற்றப்பட்ட காலம்
  rationale: κατάσχεσις வழக்கமாகப் பெற்றுக்கொள்ளுதல் அல்லது கைப்பற்றுதலைக் குறிக்கிறது; τῶν ἐθνῶν என்பதை அந்த நாடுகளுக்குரிய நிலம் எனப் பொருள்கொள்வது சூழலுக்கு ஏற்றது. உடன்வரும் ὧν ἐξῶσεν ὁ θεὸς, கடவுள் அந்த நாடுகளைத் துரத்தியதாகத் தனியே கூறுகிறது.
- issue: ἕως தாவீதின் நாட்கள்வரை எதனுடன் இணைகிறது
  choice: கூடாரம் அந்நாட்டில் தாவீதின் நாட்கள்வரை இருந்தது
  alternative: கடவுள் நாடுகளைத் துரத்துதல் தாவீதின் நாட்கள்வரை நீடித்தது
  rationale: கிரேக்கத்தில் காலச்சொற்றொடரின் இணைப்பு சற்றே திறந்திருந்தாலும், அடுத்த வசனத்தில் தாவீது கடவுளின் வாசஸ்தலத்தைப் பற்றிக் கேட்பது கூடாரத்தின் தொடர்ந்த இருப்பை முதன்மையான பொருளாக்குகிறது. தமிழில் நீண்ட வாக்கியக் குழப்பத்தைத் தவிர்க்க இது தனி வாக்கியமாகத் தெளிவுபடுத்தப்பட்டது; மாற்று இணைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வழங்கப்பட்டது. நீண்ட கிரேக்கத் தொடரை மூன்று தமிழ்வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு பெறப்பட்டது. ‘பிதாக்கள்’ என்பதற்குப் பதில் ‘முன்னோர்கள்’ பயன்படுத்தப்பட்டாலும், வசனத்திலுள்ள இருமுறைத் திருப்பமும் காக்கப்பட்டுள்ளது. ‘கூடாரம்’ என்பதைக் குறிப்பாக மீண்டும் சேர்க்காமல் ‘அதை/அது’ மூலம் முந்தைய வசனத் தொடர்பு நிலைநிறுத்தப்பட்டுள்ளது.
