source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: ta
  text: அவர், “இதோ, வானங்கள் திறக்கப்பட்டிருப்பதையும்[a], மனிதகுமாரன்[b] கடவுளின் வலப்பக்கத்தில் நிற்பதையும் காண்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் நிறைவுற்ற செயப்பாட்டு எச்சம் பயன்படுத்தப்பட்டுள்ளது; ஸ்தேவானின் தரிசனத்தில் வானங்கள் ஏற்கெனவே திறக்கப்பட்டு, திறந்த நிலையிலேயே இருப்பதை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “மனிதகுமாரன்” என்பது தானியேல் 7:13-ஐ எதிரொலிக்கும், அறியப்பட்ட மேசியப் பட்டமாகும்.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் இந்த இடைச்சொல் ஸ்தேவானின் வியப்பும் கூற்றின் உடனடித் தன்மையும் வெளிப்படுமாறு இயல்பான நவீன தமிழில் தரப்பட்டுள்ளது.
- source_word: θεωρῶ
  choice: காண்கிறேன்
  rationale: நிகழ்கால வினை வடிவம் தொடர்ந்து நிகழும் காட்சியுணர்வைக் குறிக்கிறது; தரிசனச் சூழலுக்கு ஏற்ற இயல்பான சொல்லாக இது உள்ளது.
- source_word: τοὺς οὐρανοὺς
  choice: வானங்கள்
  rationale: மூலமொழியிலுள்ள பன்மை வடிவத்தைத் தக்கவைத்து, தரிசனத்தின் இறையியல் தொனியையும் காக்கிறது.
- source_word: διηνοιγμένους
  choice: திறக்கப்பட்டிருப்பதை
  rationale: நிறைவுற்ற செயப்பாட்டு எச்சம், வானங்கள் ஏற்கெனவே திறக்கப்பட்டு அந்த நிலையிலேயே இருப்பதைச் சுட்டுகிறது; தமிழ் வாக்கியத்தில் வேற்றுமை ஒருங்கிணைப்புக்காக ‘திறக்கப்பட்டிருப்பதையும்’ என வருகிறது.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: தானியேல் 7:13-ஐ எதிரொலிக்கும் நிலைபெற்ற கிறிஸ்துவியல் பட்டத்தை அதன் சொல் வடிவத்துடனும் வேதாகமத் தொடர்புடனும் காக்கிறது.
- source_word: ἐκ δεξιῶν
  choice: வலப்பக்கத்தில்
  rationale: மரியாதையும் அதிகாரமும் கொண்ட இடத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரை, புரிந்துகொள்ள எளியதும் அதன் வேதாகம முக்கியத்துவத்தைக் காப்பதுமான தமிழில் தருகிறது.
- source_word: ἑστῶτα
  choice: நிற்பதை
  rationale: இயேசு நிற்கும் நிலையில் இருப்பதை மூலவாசகம் வெளிப்படையாகக் கூறுகிறது; தமிழ் வாக்கியத்தில் ‘நிற்பதையும்’ என இணைக்கப்பட்டுள்ளது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: எளிய உடைமை வேற்றுமைத் தொடர்பை விரிவாக்கமின்றி நேரடியாகத் தருகிறது.
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπου என்ற கிறிஸ்துவியல் பட்டம்
  choice: மனிதகுமாரன்
  alternative: மனித மைந்தன்
  rationale: மூலத்தின் சொல் அமைப்பையும் தானியேல் நூலுடனான மேசியத் தொடர்பையும் அடையாளம் காணத்தக்க பாரம்பரியப் பட்டத்தையும் ‘மனிதகுமாரன்’ சிறப்பாகக் காக்கிறது.
- issue: மகிமைப்படுத்தப்பட்ட இயேசுவின் உடல் நிலை
  choice: கடவுளின் வலப்பக்கத்தில் நிற்பது
  alternative: கடவுளின் வலப்பக்கத்தில் அமர்ந்திருப்பது
  rationale: வேறு இடங்களில் இயேசு அமர்ந்திருப்பதாக வரும் வழக்கமான மொழியோடு ஒத்திசைக்காமல், இவ்வசனம் குறிப்பாகக் கூறும் ‘நிற்பதை’ அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமத் தரிசனத்துக்குரிய கண்ணியமான தொனியுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’, ‘வானங்கள்’, ‘மனிதகுமாரன்’ ஆகியவை மூலத்தின் உடனடித் தன்மை, பன்மை வடிவம், இறையியல் தொடர்பு ஆகியவற்றைக் காக்கின்றன.
