source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: ta
  text: அவர்கள் சீகேமுக்குக் கொண்டுசெல்லப்பட்டு, சீகேமில் ஏமோரின் மக்களிடமிருந்து ஆபிரகாம் வெள்ளி விலையாகக் கொடுத்து வாங்கிய கல்லறையில் வைக்கப்பட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஸ்தேவானின் இந்தச் சொற்களுடன் ஆதியாகமம் 23-ஐ ஒப்பிடலாம்; அங்கே ஆபிரகாம் மக்பேலாவில் எப்ரோனிடமிருந்து ஒரு அடக்க இடத்தை வாங்குகிறார். ஆதியாகமம் 33:19-ல் யாக்கோபு சீகேமுக்கு அருகே ஏமோரின் மக்களிடமிருந்து நிலத்தை வாங்குகிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: கொண்டுசெல்லப்பட்டு
  rationale: இறந்த முற்பிதாக்களின் உடல்கள் வேறோர் இடத்திற்குக் கொண்டுசெல்லப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தின் இறந்தகாலச் செயப்பாட்டு உணர்வையும் காக்கிறது.
- source_word: Συχὲμ / Συχέμ
  choice: சீகேம்
  rationale: தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
- source_word: ἐτέθησαν
  choice: வைக்கப்பட்டார்கள்
  rationale: அடக்கச் சூழலில் கல்லறையில் உடல்கள் வைக்கப்பட்டதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: μνήματι
  choice: கல்லறையில்
  rationale: μνῆμα குறிக்கும் அடக்க இடத்தை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: ᾧ
  choice: வாங்கிய கல்லறையில்
  rationale: தொடர்புப்பெயரைத் தனியே மரத்துப் போன நடையில் மொழிபெயர்க்காமல், அது குறிக்கும் கல்லறையுடன் இயல்பாக இணைக்கிறது.
- source_word: ὠνήσατο
  choice: வாங்கிய
  rationale: விலை கொடுத்து உரிமையாக்கிக்கொண்ட செயலை நேரடியாகக் குறிக்கிறது.
- source_word: τιμῆς ἀργυρίου
  choice: வெள்ளி கொடுத்து
  rationale: வெள்ளியை விலையாகக் கொடுத்தார் என்ற மூலப்பொருளை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: ஏமோரின் மக்களிடமிருந்து
  rationale: παρά உடன் வரும் மரபுப்பொருளான ‘இடமிருந்து’ என்பதையும், υἱοί என்பதன் பன்மையையும் வெளிப்படையாகக் காக்கிறது.
- source_word: ἐν Συχέμ
  choice: சீகேமில்
  rationale: இறுதி இடக்குறிப்பைச் சொற்றொடரின் தொடக்கத்தில் அமைப்பதால் தமிழ் இயல்பாகிறது; அது ஏமோரையா, அவரது மக்களையா, வாங்கிய நிகழ்வையா குறிப்பதாகும் என்ற மூலத்தின் தொடர்பு-தெளிவின்மையைத் தேவையின்றி தீர்மானிக்கவில்லை.
theological_decisions:
- issue: ஆதியாகமத்திலுள்ள அடக்க இடம் வாங்கிய விவரங்களுடன் காணப்படும் வரலாற்றுச் சிக்கல்
  choice: ஆபிரகாம் சீகேமில் ஏமோரின் மக்களிடமிருந்து கல்லறையை வாங்கினார் என்ற ஸ்தேவானின் சொற்களை மூலத்தில் உள்ளபடியே வைத்தல்.
  alternative: ஆதியாகமம் 33:19-க்கு ஏற்ப யாக்கோபின் வாங்குதலாகவோ, ஆதியாகமம் 23-க்கு ஏற்ப மக்பேலாவில் ஆபிரகாம் வாங்கியதாகவோ ஒத்திசைத்தல்.
  rationale: மொழிபெயர்ப்பு கிரேக்க உரையை மாற்றாமல் பிரதிபலிக்க வேண்டும். தொடர்புடைய ஆதியாகமப் பகுதிகளுடனான பதற்றத்தை முதன்மை உரையில் மறைத்துத் தீர்க்காமல், ஒப்பிடுவதற்கான தகவலை அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொண்டுசெல்லப்பட்டு’, ‘கல்லறையில் வைக்கப்பட்டார்கள்’ என்பவை அடக்கச் சூழலை இயல்பாகத் தருகின்றன. மூலத்தில் உள்ள வரலாற்றுப் பதற்றம் முதன்மை உரையில் ஒத்திசைக்கப்படவில்லை; [a] குறியீடு உரையிலும் அதற்குரிய அடிக்குறிப்பிலும் இடம்பெற்றுள்ளது.
