id: ACT.7.42
reference: Acts 7:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: ta
  text: 'ஆனால் கடவுள் அவர்களைவிட்டு விலகி, வானத்தின் சேனையைச் சேவிக்கும்படி[a][b] அவர்களை ஒப்புக்கொடுத்தார். இறைவாக்கினர்களின் நூலில்[c] எழுதப்பட்டிருப்பதுபோல:


    “இஸ்ரயேல் வீட்டாரே,

    வனாந்தரத்தில் நாற்பது ஆண்டுகள்

    பலியிடப்பட்ட மிருகங்களையும் பலிகளையும்

    எனக்குச் செலுத்தினீர்களா?[d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வழிபடும்படி” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் சமயச் சேவையையோ வழிபாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வானத்தின் சேனை” என்பது விண்பொருள்களையும், விரிவான பொருளில் விக்கிரக வழிபாட்டில் அவற்றோடு தொடர்புபடுத்தப்பட்ட வானுலக வல்லமைகளையும் குறிக்கும் வேதாகம மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: “இறைவாக்கினர்களின் சுருளில்” என்றும் மொழிபெயர்க்கலாம். இங்கு மேற்கோள் காட்டப்படுவது ஆமோஸ் 5:25.
    reason: lexical_alternative_and_cross_reference
  - marker: d
    text: கிரேக்கத்தில் இந்த வினா “இல்லை” என்ற பதிலை எதிர்பார்க்கிறது.
    reason: discourse_note
lexical_decisions:
- source_word: ἔστρεψεν
  choice: அவர்களைவிட்டு விலகி
  rationale: பின்வரும் நீதித்தீர்ப்புச் செயலான ‘ஒப்புக்கொடுத்தார்’ என்பதுடன் சேர்ந்து, கடவுள் உறவுநிலையில் அவர்களைவிட்டு விலகியதைக் காட்டுகிறது; வெறும் உடல் திரும்புதலாகக் குறுக்கவில்லை.
- source_word: παρέδωκεν
  choice: ஒப்புக்கொடுத்தார்
  rationale: கலகத்திற்குப் பதிலாக அவர்கள் தேர்ந்தெடுத்த வழிக்கே நீதித்தீர்ப்பாகக் கைவிடப்பட்டதைக் காட்டுகிறது; கடவுளே அவர்களுடைய பாவத்தை உண்டாக்கினார் என்று சொல்லவில்லை.
- source_word: λατρεύειν
  choice: சேவிக்கும்படி
  rationale: சமயச் சேவை அல்லது வழிபாடு ஆகிய இரு நுணுக்கங்களையும் தாங்கக்கூடிய சொல்லாக இருப்பதால், கிரேக்கச் சொல்லின் பரப்பைத் திறந்தே வைக்கிறது.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: வானத்தின் சேனை
  rationale: வானுலகப் படை என்ற வேதாகம மரபுத்தொடரைப் பாதுகாக்கிறது; விண்பொருள்கள் அல்லது அவற்றோடு தொடர்புபடுத்தப்பட்ட வானுலக வல்லமைகள் என்ற இரு தொடர்புகளையும் தேவையின்றிக் குறுக்கவில்லை.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: இறைவாக்கினர்களின் நூலில்
  rationale: βίβλος என்பதன் நூல்/சுருள் என்ற பொருள் பரப்பில், நவீனத் தமிழில் இயல்பான ‘நூல்’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது.
- source_word: σφάγια καὶ θυσίας
  choice: பலியிடப்பட்ட மிருகங்களையும் பலிகளையும்
  rationale: σφάγια என்பதிலுள்ள கொல்லப்பட்ட பலிப்பொருள் என்ற நுணுக்கத்தையும் θυσίας என்பதிலுள்ள பொதுவான பலி என்ற பொருளையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: προσηνέγκατέ μοι
  choice: எனக்குச் செலுத்தினீர்களா
  rationale: பலிச் சூழலில் προσφέρω என்பதைக் ‘செலுத்துதல்’ என்று இயல்பாகத் தருகிறது; μοι என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: Μὴ
  choice: … செலுத்தினீர்களா?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் கிரேக்க வினாவை இயல்பான தமிழ் வினாவாக வைத்திருக்கிறது; அதன் சொல்லாட்சிசார் வலிமை அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: நீதித்தீர்ப்பில் கடவுளின் செயல்
  choice: கடவுள் ‘அவர்களைவிட்டு விலகி… அவர்களை ஒப்புக்கொடுத்தார்’
  alternative: கடவுள் வழிபட வெறுமனே அனுமதித்தார் / அவர்களை வழிபடச் செய்தார்
  rationale: இணைந்துள்ள இரு வினைகளும் முந்தைய கலகத்திற்குப் பதிலான நீதித்தீர்ப்பைக் குறிக்கின்றன. கடவுளின் ஒப்புக்கொடுத்தலைத் தெளிவாக வைத்தாலும், அவர் அவர்களுடைய விக்கிரக வழிபாட்டை நேரடியாக உண்டாக்கினார் என்று உரை கூறுவதாக மாற்றவில்லை.
- issue: ‘வானத்தின் சேனை’ என்பதன் குறிப்பு
  choice: விண்பொருள்களையோ அவற்றுடன் தொடர்புபடுத்தப்பட்ட வானுலக வல்லமைகளையோ குறிக்கக்கூடிய மரபுத்தொடர்
  alternative: தேவதூதர்கள் மட்டும் / நட்சத்திரங்கள் மட்டும்
  rationale: இறைவாக்கினர் மேற்கோளின் விக்கிரக வழிபாட்டுச் சூழலில் வானியல் பொருள்களும் வல்லமைகளும் கருத்தில் இருக்கலாம்; மூலத்தின் பரப்பை ஒரு குறிப்பிட்ட வகைக்குள் கட்டுப்படுத்தவில்லை.
- issue: ஆமோஸ் 5:25-இன் எதிர்மறை வினா
  choice: வினா வடிவத்தைக் காத்து, எதிர்பார்க்கப்படும் ‘இல்லை’ என்ற பதிலை அடிக்குறிப்பில் தெரிவிப்பு
  alternative: ‘நீங்கள் செலுத்தவே இல்லை’ என்று உறுதிவாக்கியமாக மாற்றுதல்
  rationale: μή குறிக்கும் எதிர்பார்ப்பை வாசகருக்குத் தெளிவாக்குகிறது; அதே நேரத்தில் மூலத்தின் வினாவடிவத்தையும் அதன் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியக்கூடியதாயும் வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடையுடனும் வடிவமைக்கப்பட்டது. ‘இறைவாக்கினர்’, ‘வனாந்தரம்’, ‘இஸ்ரயேல் வீட்டார்’ போன்ற சொற்கள் வேதாகமப் பின்னணியைப் பாதுகாக்கின்றன; அரிதான சமயத் தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
