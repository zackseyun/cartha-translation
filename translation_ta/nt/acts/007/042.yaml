  source_fidelity: மூலக் கிரேக்கத்தின் தொடர்ச்சியான நீதித்தீர்ப்புச் செயலை “அவர்களைவிட்டு விலகி… ஒப்புக்கொடுத்தார்” துல்லியமாகக் காட்டுகிறது. λατρεύειν-இன் வழிபாட்டு/சமயச் சேவைப் பரப்பை “சேவிக்கும்படி” என்பதும் அடிக்குறிப்பு a-வும் பாதுகாக்கின்றன. σφάγια καὶ θυσίας என்பதன் இரட்டைத் தன்மை “பலியிடப்பட்ட மிருகங்களையும் பலிகளையும்” எனக் காக்கப்பட்டுள்ளது. μή-வினாவின் எதிர்மறைப் பதில் எதிர்பார்ப்பும் அடிக்குறிப்பு d-ல் சரியாக விளக்கப்பட்டுள்ளது.
