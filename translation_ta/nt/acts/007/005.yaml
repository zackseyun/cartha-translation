id: ACT.7.5
reference: Acts 7:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: ta
  text: அந்த நாட்டில் அவருக்கு ஓர் அடி நிலம்கூட[a] உரிமைச்சொத்தாகக் கொடுக்கவில்லை. ஆனால், அப்போது அவருக்குப் பிள்ளை இல்லாதிருந்தபோதிலும்[b], அந்த நாட்டை அவருக்கும் அவருக்குப் பின் அவருடைய சந்ததிக்கும் உடைமையாகக் கொடுப்பதாக வாக்குறுதி அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கால் வைக்கக்கூடிய அளவு நிலம்கூட.” இந்தக் கிரேக்க மரபுத்தொடர், மிகச் சிறிய நிலப்பகுதியைக்கூடக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருக்குப் பிள்ளை இல்லாதிருந்தபோது.” கிரேக்க இலக்கண அமைப்பை காலப்பொருளில் எடுத்துக்கொள்ளலாம்; எனினும் சூழல், “பிள்ளை இல்லாதிருந்தபோதிலும்” என்ற பொருளை வலுவாக ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: உரிமைச்சொத்து
  rationale: வழங்கப்பெறும் சட்டப்பூர்வப் பங்கையும் ஆபிரகாமிய உடன்படிக்கையின் நிலப் பின்னணியையும் இது இயல்பான தமிழில் காக்கிறது.
- source_word: οὐδὲ βῆμα ποδός
  choice: ஓர் அடி நிலம்கூட
  rationale: ஒருவர் கால் வைக்கக்கூடிய மிகச் சிறிய நிலப்பகுதியைக்கூடக் குறிக்கும் கிரேக்க மரபுத்தொடரைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἐπηγγείλατο
  choice: வாக்குறுதி அளித்தார்
  rationale: தேவனுடைய உறுதியான வாக்கை இயல்பான நவீன தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: εἰς κατάσχεσιν
  choice: உடைமையாக
  rationale: நாட்டைச் சொந்தமாகப் பெற்றுக்கொள்வதைக் குறிக்கும் விளைவுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: σπέρματι
  choice: சந்ததி
  rationale: ஒருமை வடிவத்திலும் கூட்டுப்பொருள் தரும் கிரேக்கச் சொல்லுக்கு இணையாக, உடன்படிக்கை மொழிநடையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: μετ’ αὐτόν
  choice: அவருக்குப் பின்
  rationale: ஆபிரகாமுக்குப் பின்வரும் அவருடைய சந்ததியைக் குறிக்கும் தொடரை நேரடியாகத் தருகிறது.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: அப்போது அவருக்குப் பிள்ளை இல்லாதிருந்தபோதிலும்
  rationale: காலச்சூழலைக் காட்டும் சாத்தியத்தை ‘அப்போது’ என்பதன் மூலம் வைத்துக்கொண்டே, சூழலில் வலுவாகத் தோன்றும் விட்டுக்கொடுப்பு நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: τέκνου
  choice: பிள்ளை
  rationale: τέκνον என்பதன் பாலினம் குறிப்பிடாத பொதுப்பொருளைத் துல்லியமாகக் காக்கிறது.
theological_decisions:
- issue: வாக்குறுதி அளிக்கப்பட்டபோது ஆபிரகாமுக்குப் பிள்ளை இல்லாதிருந்ததன் கால அல்லது விட்டுக்கொடுப்பு நுணுக்கம்
  choice: அப்போது அவருக்குப் பிள்ளை இல்லாதிருந்தபோதிலும்
  alternative: அவருக்குப் பிள்ளை இல்லாதிருந்தபோது
  rationale: மூலத்தின் genitive absolute அமைப்பு காலப்பொருளாகவும் கொள்ளப்படலாம்; ஆயினும் பிள்ளையற்ற நிலையிலும் வாக்குறுதி வழங்கப்பட்டது என்ற உரையின் வலியுறுத்தலைத் தேர்ந்த மொழிபெயர்ப்பு காக்கிறது. மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; எல்லாப் பெயர்ப்பதிலிகளும் சூழலில் தேவனையும் ஆபிரகாமையும் தெளிவாகச் சுட்டுகின்றன.
