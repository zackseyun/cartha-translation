  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: ta
  text: அவருக்குக் கீழ்ப்படிவதற்கு நம் முன்னோர்கள் விரும்பவில்லை; மாறாக, அவரை நிராகரித்தார்கள்[a], தங்கள் இதயங்களில் எகிப்துக்குத் திரும்பினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைத் தள்ளி ஒதுக்கினார்கள்.” கிரேக்க வினைச்சொல் மோசேயைத் தள்ளிப் புறக்கணித்ததையும் உணர்த்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவர்கள் இன்னும் வனாந்தரத்திலேயே இருந்தபோதும், உள்ளத்தில் எகிப்துக்குத் திரும்பிச் செல்ல ஏங்கினார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: அவருக்கு
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மோசேயைக் குறிக்கும் ஒருமை வேற்றுமை உறவுப்பெயர்; ‘கீழ்ப்படிய’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: οὐκ ἠθέλησαν
  choice: விரும்பவில்லை
  rationale: θέλω விருப்பத்தையோ மனவிருப்பத்தையோ குறிக்கிறது; மறுப்புடன் இங்கு கீழ்ப்படிய மனமில்லாத நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὑπήκοοι γενέσθαι
  choice: கீழ்ப்படிய
  rationale: சொல்லுக்கு நெருக்கமான ‘கீழ்ப்படிபவர்களாக ஆக’ என்பது தமிழில் செயற்கையாக இருப்பதால், கருத்தைத் தெளிவாகவும் இயல்பாகவும் தரும் வினை வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: οἱ πατέρες ἡμῶν
  choice: நம் முன்னோர்கள்
  rationale: ஸ்தேவான் இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறார்; நவீனத் தமிழில் ‘முன்னோர்கள்’ இயல்பாகவும் உள்ளடக்கத்தைத் தெளிவாகவும் தருகிறது.
- source_word: ἀπώσαντο
  choice: அவரைத் தள்ளிவிட்டு
  rationale: வினைச்சொல் உடலளவில் தள்ளுவதையும் ஒருவரை ஒதுக்கி நிராகரிப்பதையும் உணர்த்தக்கூடும்; ‘தள்ளிவிட்டு’ இந்த வலிமையான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἐστράφησαν
  choice: திரும்பினார்கள்
  rationale: எகிப்தை நோக்கிய முந்தைய பற்றுக்குத் திரும்பிய உள்நிலை மாற்றத்தைச் சூழல் காட்டுகிறது.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: தங்கள் இதயங்களில்
  rationale: καρδία ஆசை, எண்ணம், மனநோக்கம் ஆகியவற்றை உள்ளடக்கும் அகமனிதனைச் சுட்டுகிறது; வேதாகம உருவகத்தைத் தமிழ் வடிவம் பாதுகாக்கிறது.
- source_word: εἰς Αἴγυπτον
  choice: எகிப்துக்கு
  rationale: εἰς எகிப்தை நோக்கிய திசையைக் குறிக்கிறது; ‘திரும்பினார்கள்’ என்பதே மீள்வதன் கருத்தை ஏற்கெனவே தருகிறது.
theological_decisions:
- issue: இஸ்ரவேலர் எகிப்துக்குத் திரும்பியதன் தன்மை
  choice: தங்கள் இதயங்களில் எகிப்துக்குத் திரும்பினார்கள்
  alternative: தங்கள் இதயங்களை எகிப்தை நோக்கித் திருப்பினார்கள்
  rationale: ‘இதயங்களில்’ என்பது உடலளவிலான பயணத்தை மட்டும் அல்லாமல் ஆசை மற்றும் விசுவாசப் பற்றின் உள்நிலை மாற்றத்தைக் காட்டுகிறது. அதேவேளை, அதை வெறும் உருவகம் என்று விளக்கித் தீர்க்காமல் மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘தங்கள் இதயங்களில்’ என்ற வேதாகமச் சொல்லாட்சி அகநிலை ஆசை மற்றும் நோக்கத்தைப் பாதுகாக்கிறது; ‘முன்னோர்கள்’ என்பது இன்றைய தமிழில் ‘பிதாக்கள்’ என்பதைக் காட்டிலும் இயல்பானது.
