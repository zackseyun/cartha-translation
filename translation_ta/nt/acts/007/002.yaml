  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: ta
  text: 'அவர் கூறினார்: “சகோதரர்களே, தந்தையரே[a], கேளுங்கள்: மெசொப்பொத்தாமியாவில் இருந்த நம் தந்தை ஆபிரகாமுக்கு, அவர் ஆரானில் வாழ்வதற்கு முன்பே[b], மகிமையின் தேவன் தோன்றினார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்களே, சகோதரர்களே, தந்தையரே.” கிரேக்க மொழியின் மரியாதையான விளிப்புத் தொடர் வெளிப்படையாக ஆண்பாலில் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் ஆரானில் குடியேறுவதற்கு முன்பே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: அவர் கூறினார்
  rationale: δέ இங்கு மென்மையான உரைத்தொடர்பை அளிக்கிறது; தமிழில் தேவையற்ற எதிர்மறை நிழலைச் சேர்க்காமல் இயல்பான உரையாடல் அறிமுகமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: சகோதரர்களே, தந்தையர்களே
  rationale: சனகெரீம் உறுப்பினர்களையும் அங்கிருந்த ஆண் கேட்போரையும் நோக்கிய மரியாதையான அழைப்பின் உறவுமுறை வலிமையை இது இயல்பான தமிழில் தக்கவைக்கிறது. ἄνδρες என்பதன் வெளிப்படையான தனி மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀκούσατε
  choice: கேளுங்கள்
  rationale: கவனம் செலுத்தும்படி கோரும் நேரடியான இறைச்சொல்; நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ளது.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: மகிமையின் தேவன்
  rationale: தொடரின் உரிமைவேற்றுமை அமைப்பையும் வேதாகமப் பின்னொலியையும் தக்கவைக்கிறது; ‘மகிமையுள்ள தேவன்’ என்ற விளக்கமயமான உருமாற்றத்தைத் தவிர்க்கிறது.
- source_word: ὤφθη
  choice: தோன்றினார்
  rationale: தெய்வீகத் தோற்றச் சூழலில் ὁράω என்பதன் இறந்தகாலச் செயலப்பாட்டு வடிவத்திற்குரிய இயல்பான பொருள்; ‘தம்மை வெளிப்படுத்தினார்’ என்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: நம் தந்தை ஆபிரகாமுக்கு
  rationale: ஆபிரகாமோடு பேச்சாளரும் கேட்போரும் கொண்டுள்ள பொதுவான மரபுறவை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: மெசொப்பொத்தாமியாவில் இருந்தபோது
  rationale: பங்கேற்புவினையின் காலச்சூழல் பொருளை தெளிவான, இயல்பான தமிழில் அளிக்கிறது.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: அவர் ஆரானில் வாழ்வதற்கு முன்பே
  rationale: κατοικέω என்பதன் அடிப்படைப் பொருளான ஒரு இடத்தில் வாழ்தலை எளிய தமிழில் தருகிறது; நிரந்தரமாகக் குடியேறினார் என்ற சற்றுக் கூடுதலான பொருளை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: ஆண் கேட்போரை நோக்கிய அழைப்பை மொழிபெயர்த்தல்
  choice: சகோதரர்களே, தந்தையர்களே
  alternative: ஆண்களே, சகோதரர்களே, தந்தையர்களே
  rationale: கிரேக்க அழைப்பு வெளிப்படையாக ஆண்பாலுக்குரியது; அதை பாலினப் பொதுமைப்படுத்தல் செய்யவில்லை. அதேவேளை, ἄνδρες இத்தகைய மரியாதை அழைப்பில் வகிக்கும் சூத்திரப்பாங்கான வலிமை தமிழில் ‘சகோதரர்களே, தந்தையர்களே’ என்பதில் இயல்பாக வெளிப்படுகிறது; முழு வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: θεὸς τῆς δόξης என்ற தெய்வீகப் பட்டப்பெயர்
  choice: மகிமையின் தேவன்
  alternative: மகிமையுள்ள தேவன்
  rationale: மூலத்தின் உரிமைவேற்றுமை வடிவத்தையும் சாத்தியமான பழைய ஏற்பாட்டு பின்னொலியையும் தக்கவைத்து, அதை வெறும் பண்புப்பெயராகச் சுருக்குவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க வேதாகம நடையைக் கடைப்பிடிக்கிறது. ‘மகிமையின் தேவன்’ போன்ற மூலத்துக்கு நெருக்கமான முக்கிய சொற்றொடர்கள் பாதுகாக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு மட்டும் தமிழின் இயல்பான ஓட்டத்திற்கேற்ப ஒழுங்குபடுத்தப்பட்டுள்ளது.
