- source_word: τὸν Ἰωσήφ
  choice: யோசேப்பை
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம், இங்கு செயப்படுபொருள் வேற்றுமையுடன் பயன்படுத்தப்பட்டுள்ளது.
