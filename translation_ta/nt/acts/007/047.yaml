  source_fidelity: மிகவும் நன்றாக உள்ளது. Σολομῶν, δέ, οἰκοδόμησεν, αὐτῷ, οἶκον ஆகியவற்றின் பொருளும் தொடர்பும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘வீட்டை’ என்பது οἶκον-ன் நேரடிப் பொருளைத் தக்கவைக்கிறது; ‘அவருக்காக’ αὐτῷ என்பதன் இங்கு இயல்பான நோக்க/பயன் நுட்பத்தைச் சரியாகத் தருகிறது.
  naturalness: ‘ஆனால் சாலொமோன் அவருக்காக ஒரு வீட்டைக் கட்டினார்’ என்பது நவீன பொதுத்தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. கடவுளுக்கான மரியாதைப் பன்மையும் பொருத்தமானது.
  terminology: ‘சாலொமோன்’ வேதாகமத் தமிழில் நிலைபெற்ற பெயர்வடிவம். ‘வீடு’ மூலத்தின் திட்டமிட்ட பொதுச்சொல்லைத் தக்கவைக்கிறது; ‘ஆலயம்’ என்ற சூழல்சார் மாற்று அடிக்குறிப்பில் சரியாகக் கொடுக்கப்பட்டுள்ளது.
