  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σολομῶν δὲ οἰκοδόμησεν αὐτῷ οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/047.yaml
  text: But Solomon built a house for him[a].
translation:
  language: ta
  text: ஆனால் சாலொமோன் அவருக்காக ஒரு வீட்டைக்[a] கட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு ஆலயத்தைக்”; கிரேக்கத்தில், “ஒரு வீட்டை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: சாலொமோன்
  rationale: வேதாகமத் தமிழ் வழக்கில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவம்; பெயரை மொழிபெயர்க்காமல் ஒலிபெயர்க்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள மென்மையான முரண்பாட்டை வெளிப்படுத்துகிறது; அதே நேரத்தில் வரலாற்றுக் கதையோட்டத்தையும் இயல்பாகத் தொடர்கிறது.
- source_word: οἰκοδόμησεν
  choice: கட்டினார்
  rationale: இங்கு உருவகப் பொருளில் அல்லாமல் ஒரு கட்டடத்தை எழுப்பிய குறிப்பிட்ட கடந்தகாலச் செயலைக் குறிக்கிறது.
- source_word: αὐτῷ
  choice: அவருக்காக
  rationale: சூழலில் இது கடவுளைக் குறிக்கிறது. ஒரு கட்டடம் அவருக்கெனக் கட்டப்பட்டது என்ற நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οἶκον
  choice: ஒரு வீட்டை
  rationale: கிரேக்கச் சொல்லின் நேரடிப் பொருள் ‘வீடு.’ சூழலில் அது ஆலயத்தைக் குறித்தாலும், மூலத்தின் சொல்வடிவத்தையும் அடுத்த வசனத்தில் வரும் இறையியல் இழுபறியையும் இது காக்கிறது.
theological_decisions:
- issue: οἶκον என்பதை ‘வீடு’ என்றா, விளக்கமாக ‘ஆலயம்’ என்றா மொழிபெயர்ப்பது
  choice: வீடு
  alternative: ஆலயம்
  rationale: மூலத்தில் குறிப்பாக ஆலயத்தைக் குறிக்கும் ναός அல்லது ἱερόν அல்ல, பொதுவான οἶκος என்ற சொல் உள்ளது. ‘வீடு’ என்பது சாலொமோன் கடவுளுக்காகக் கட்டிய ஆலயத்தைக் குறிக்கிறது; அதேவேளையில், உன்னதமானவர் மனிதக் கைகளால் கட்டப்பட்ட இடங்களில் குடியிருப்பதில்லை என்று அடுத்த வசனம் கூறுவதற்கு முன் நிலவும் இறையியல் இழுபறியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டுள்ளது. கடவுளைக் குறிக்கும் சுட்டுப்பெயருக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; ‘வீடு’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டுள்ளது.
