id: ACT.7.25
reference: Acts 7:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: ta
  text: தன் கையின் வழியாகக் கடவுள் அவர்களுக்கு விடுதலை[b] அளிக்கிறார் என்பதைத் தன் சகோதரர்கள்[a] புரிந்துகொண்டிருப்பார்கள் என்று அவர் நினைத்தார்; ஆனால் அவர்கள் புரிந்துகொள்ளவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பது இங்கு மோசேயின் சக இஸ்ரவேலரைக் குறிக்கிறது; கிரேக்கத்தில் இது ஆண்பால் பன்மை உறவுமுறைச் சொல்.
    reason: cultural_note
  - marker: b
    text: “மீட்பு” அல்லது “இரட்சிப்பு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் காப்பாற்றுதல், விடுவித்தல், இரட்சித்தல் ஆகிய பொருள்களைக் கொண்டது; இங்கு உடனடிச் சூழல் மோசேயின் வழியாக இஸ்ரவேலுக்குக் கடவுள் அளிக்கும் விடுதலையைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: நினைத்தார்
  rationale: இறந்தகால imperfect வடிவம் பின்னணியில் நீடித்திருந்த மோசேயின் எண்ணத்தைக் காட்டுகிறது. தமிழில் இயல்பான எளிய இறந்தகாலமான ‘நினைத்தார்’ இதைச் சூழலுடன் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: συνιέναι / συνῆκαν
  choice: புரிந்துகொண்டார்கள் / புரிந்துகொள்ளவில்லை
  rationale: ஒரே கிரேக்க வினையின் மீளுருவாக்கத்தைத் தமிழிலும் பேணி, மோசேயின் எதிர்பார்ப்புக்கும் மக்களின் உண்மையான எதிர்வினைக்கும் உள்ள முரண்பாட்டைத் தெளிவாக்குகிறது.
- source_word: ἀδελφοὺς
  choice: சகோதரர்கள்
  rationale: ஆண்பால் பன்மை உறவுமுறைச் சொல்லையும், மோசேயுடன் இஸ்ரவேலருக்கிருந்த இன-சகோதர உறவையும் நேரடியாகப் பிரதிபலிக்கிறது; அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: தன் கையின் வழியாக
  rationale: செயலாற்றும் கருவி அல்லது முகவர் என்ற பொருளுடைய கிரேக்க உருவகத்தைப் பேணுகிறது. ‘தன் மூலம்’ என்பது இயல்பாக இருந்தாலும், மூலத்தின் ‘கை’ உருவகத்தை நீக்கிவிடும்.
- source_word: δίδωσιν
  choice: அளிக்கிறார்
  rationale: கிரேக்க நிகழ்காலத்தை மறைமுகக் கூற்றுக்குள் தமிழில் இயல்பாக நிகழ்காலமாகவே வைத்துள்ளது; கடவுளின் செயலை மரியாதை வினைமுற்றுடன் தெரிவிக்கிறது.
- source_word: σωτηρίαν
  choice: விடுதலை
  rationale: எகிப்திய ஒடுக்குமுறையிலிருந்து இஸ்ரவேலரை மீட்கும் உடனடி வரலாற்றுச் சூழலுக்கு ‘விடுதலை’ பொருத்தமானது; ‘மீட்பு/இரட்சிப்பு’ என்ற பரந்த இறையியல் நிழற்பொருளை அடிக்குறிப்பு திறந்தே வைக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: விடுதலையைப் பெறுபவர்களைக் குறிக்கும் கிரேக்க dative-ஐ இயல்பான தமிழ் வேற்றுமையால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மோசேச் சூழலில் σωτηρία என்பதன் பொருள்
  choice: விடுதலை
  alternative: மீட்பு அல்லது இரட்சிப்பு
  rationale: இங்கு முதன்மையாகக் குறிக்கப்படுவது ஒடுக்குமுறையிலிருந்து இஸ்ரவேலருக்குக் கடவுள் அளிக்கும் வரலாற்று விடுதலை. அதே நேரத்தில், கிரேக்கச் சொல்லின் பரந்த மீட்பு/இரட்சிப்பு பொருளை அடிக்குறிப்பில் குறிப்பதால் இறையியல் தொடர்பு மறுக்கப்படவோ குறுகலாகத் தீர்மானிக்கப்படவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தன் கையின் வழியாக’ என்ற சொற்றொடர் கிரேக்கத்தின் முகவர்-கருவி உருவகத்தைப் பேணுகிறது; இருமுறை வரும் ‘புரிந்து’ வேர்ச்சொல் மூலத்தின் நோக்கமுள்ள எதிர்மறை ஒப்புமையைத் தக்கவைக்கிறது.
