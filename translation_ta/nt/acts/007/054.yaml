source:
  edition: SBLGNT
  text: Ἀκούοντες δὲ ταῦτα διεπρίοντο ταῖς καρδίαις αὐτῶν καὶ ἔβρυχον τοὺς ὀδόντας ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/054.yaml
  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: ta
  text: அவர்கள் இவற்றைக் கேட்டபோது, தங்கள் உள்ளங்களில் ஊடறுக்கப்பட்டவர்களாய், ஸ்தேவான்மேல் பற்களை நறநறவென்று கடித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “அவர்கள் உள்ளத்தில் கடுஞ்சினமடைந்தார்கள்.” கிரேக்க வினைச்சொல் சொற்பொருளில் “ஊடறுக்கப்பட்டார்கள்” என்று பொருள்படும்; அது அவர்களுக்குள் எழுந்த தீவிரக் கொந்தளிப்பை உயிரோட்டமான உருவகமாகக் காட்டுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: அவர்கள் இவற்றைக் கேட்டபோது
  rationale: சூழ்நிலையைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையை இயல்பான தமிழில் காலத் தொடர்புடன் தருகிறது. δὲ இங்கு மென்மையான கதைத் தொடர்ச்சியைச் சுட்டுவதால் தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை; ταῦτα முந்தைய உரையின் கருத்துகளைக் குறிக்கும் பன்மையாகப் பாதுகாக்கப்படுகிறது.
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: தங்கள் உள்ளங்களில் வெட்டுண்டதுபோல் கடுங்கோபமடைந்து
  rationale: διεπρίοντο என்பதன் ‘ஊடறுக்கப்படுதல்/வெட்டப்படுதல்’ என்ற தீவிர உருவகத்தையும், இச்சூழலில் அது தெரிவிக்கும் உள்ளார்ந்த சீற்றத்தையும் ஒருசேர வெளிப்படுத்துகிறது. καρδίαις என்பதற்கு உடல் உறுப்பை மட்டும் சுட்டாத இயல்பான தமிழ் ‘உள்ளங்களில்’ பயன்படுத்தப்பட்டது.
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: பற்களைக் கடித்தார்கள்
  rationale: சினத்தால் பற்களை நறநறவென்று கடிக்கும் தெளிவான செயலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐπ’ αὐτόν
  choice: ஸ்தேவானைப் பார்த்து
  rationale: ἐπί இங்கு பகைமையான செயலின் இலக்கைச் சுட்டுகிறது. தமிழ் வாக்கியத்தில் சுட்டுப்பெயரால் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்கச் சூழலிலுள்ள நபரின் பெயர் தெளிவாக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் தீவிரமான ‘வெட்டப்படுதல்’ உருவகம் முற்றிலும் மறையாமல், அதன் சூழல்சார் கோப உணர்வும் தெளிவாகத் தரப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொற்றொடருக்குப் பின் இடப்பட்டுள்ளது.
