lexical_decisions:
- source_word: Εἶπεν
  choice: கேட்டார்
  rationale: λέγω என்பதன் இறந்தகால வடிவம் அடிப்படையில் ‘சொன்னார்’ எனப் பொருள்பட்டாலும், இங்கு நேரடிக் கேள்வியை அறிமுகப்படுத்துவதால் நவீனத் தமிழில் ‘கேட்டார்’ என்பது இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: δὲ
  choice: அப்போது
  rationale: δέ இங்கு முந்தைய குற்றச்சாட்டுகளிலிருந்து தலைமைக் குருவின் கேள்விக்குச் செல்லும் கதைத் தொடர்ச்சியைக் குறிக்கிறது.
- source_word: ἀρχιερεύς
  choice: தலைமைக் குரு
  rationale: ஒருமையில் நீதிமன்ற விசாரணைக்குத் தலைமை வகிக்கும் உயர்ந்த குருத்துவப் பதவியைக் குறிக்கிறது; ‘தலைமைக் குரு’ நவீனத் தமிழில் தெளிவான நிலையான இணைச்சொல்.
- source_word: Εἰ
  choice: இருக்கின்றனவா
  rationale: εἰ இங்கு நிபந்தனையை அல்ல, ஆம்/இல்லை விடை எதிர்பார்க்கும் நேரடிக் கேள்வியை அறிமுகப்படுத்துகிறது.
- source_word: ταῦτα
  choice: இந்தக் காரியங்கள்
  rationale: பன்மையான ταῦτα முந்தைய வசனங்களில் கூறப்பட்ட குற்றச்சாட்டுகளைச் சுட்டுகிறது. ‘குற்றச்சாட்டுகள்’ என்று நேரடியாக்காமல் மூலத்தின் பொதுவான சுட்டுப்பொருளைப் பாதுகாக்கிறது.
- source_word: οὕτως
  choice: இப்படித்தான்
  rationale: கூறப்பட்ட விதத்திலேயே உண்மை நிலை உள்ளதா என்ற வினாவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔχει
  choice: இருக்கின்றன
  rationale: οὕτως ἔχει என்ற கிரேக்க மரபுத்தொடர் ‘அவ்வாறே உள்ளது/உண்மையில் அப்படியே இருக்கிறது’ என்னும் பொருளுடையது; தமிழில் ‘இருக்கின்றன’ என்று இயல்பாக வழங்கப்பட்டுள்ளது.
