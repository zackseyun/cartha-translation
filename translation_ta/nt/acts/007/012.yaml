id: ACT.7.12
reference: Acts 7:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: ta
  text: ஆனால் எகிப்தில் தானியம்[a] இருப்பதாக யாக்கோபு கேள்விப்பட்டபோது, நம் முற்பிதாக்களை முதல் முறையாக அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எகிப்தில் உணவுப் பொருட்கள் இருப்பதாக.’ கிரேக்கச் சொல் பொதுவாக உணவுப் பொருட்களையோ உணவுக் கையிருப்பையோ குறிக்கலாம்; இச்சூழலில் ‘தானியம்’ என்பதே அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: கேள்விப்பட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முன் நிகழ்ந்ததை காலத் தொடர்புடன் காட்டுகிறது; தமிழில் இயல்பாக ‘கேள்விப்பட்டபோது’ என வழங்கப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: ஸ்தேவானின் உரையில் மென்மையான கதை மாற்றத்தைச் சுட்டுகிறது; மிகையான எதிர்மறை முரண்பாட்டை உருவாக்காமல் ‘ஆனால்’ அதை வெளிப்படுத்துகிறது.
- source_word: ὄντα σιτία εἰς Αἴγυπτον
  choice: எகிப்தில் தானியம் இருப்பதாக
  rationale: ἀκούω என்பதற்குப் பின் வரும் accusative-participle அமைப்பு தமிழில் இயல்பான மறைமுகக் கூற்றாக வழங்கப்பட்டுள்ளது. εἰς இங்கு இருப்பிடப் பொருளில் பயன்படுத்தப்பட்டிருப்பதால் ‘எகிப்தில்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: σιτία
  choice: தானியம்
  rationale: இச்சொல் தானியத்தையோ பொதுவான உணவுப் பொருட்களையோ குறிக்கலாம்; யோசேப்பின் காலப் பஞ்சச் சூழலில் ‘தானியம்’ என்பதே பொருத்தமான முதன்மைப் பொருள்.
- source_word: ἐξαπέστειλεν
  choice: அங்கு அனுப்பினார்
  rationale: பயணமாக அனுப்பிய செயலை இயல்பான தமிழில் காட்டுகிறது. ‘அங்கு’ என்பது கிரேக்கக் கூட்டு வினையின் வெளியே அனுப்பும் நுணுக்கத்தையும் எகிப்தை நோக்கிய பயணத்தையும் சூழலிலிருந்து தெளிவாக்குகிறது.
- source_word: τοὺς πατέρας ἡμῶν
  choice: நம் தந்தையரை
  rationale: இங்கு குறிப்பாக இஸ்ரவேலின் ஆண் மூதாதையராகிய யாக்கோபின் மகன்களைக் குறிக்கும் தந்தைமுறைச் சொல்லைத் தக்கவைக்கிறது; ‘முற்பிதாக்கள்’ என்பதைவிட நேரடியும் நவீனமும் ஆகும்.
- source_word: πρῶτον
  choice: முதல் முறையாக
  rationale: பின்னர் நிகழும் இரண்டாவது பயணத்துக்கு எதிராக இது முதல் அனுப்புதலைக் குறிக்கிறது; தமிழில் தெளிவான வினையடைத் தொடர்.
theological_decisions:
- issue: τοὺς πατέρας ἡμῶν என்பதன் மொழிபெயர்ப்பு
  choice: நம் தந்தையரை
  alternative: நம் மூதாதையரை / முற்பிதாக்களை
  rationale: கிரேக்கத்தில் உள்ள ஆண்பால் குடும்ப உறவுச் சொல்லைத் தக்கவைக்கிறது. இச்சூழலில் அது பொதுவாக எல்லா மூதாதையரையும் அல்ல, யாக்கோபின் மகன்களாகிய ஆண் முன்னோர்களையே குறிப்பதால் பாலினப் பொதுமைப்படுத்தல் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வசனத்தின் கதை ஓட்டமும் ‘முதல் முறையாக’ என்ற அடுத்த பயணத்தை எதிர்நோக்கும் குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
