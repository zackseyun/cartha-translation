revisions:
- from: ஆனால் எகிப்தில் தானியம் இருப்பதாக யாக்கோபு கேள்விப்பட்டபோது[a], நம் தந்தையரை முதல் முறையாக அங்கு அனுப்பினார்.
  to: ஆனால் எகிப்தில் தானியம்[a] இருப்பதாக யாக்கோபு கேள்விப்பட்டபோது, நம் முற்பிதாக்களை முதல் முறையாக அனுப்பினார்.
