  to: நாற்பது ஆண்டுகள் நிறைவடைந்தபின்[a], சீனாய் மலையின் வனாந்தரத்தில் ஒரு புதரின் நெருப்புச் சுடரில்[b] ஒரு தேவதூதன் அவருக்குத் தோன்றினார்.[c]
  rationale: புதருடனான நெருப்புச் சுடரின் தொடர்பை மூல உரை கூறும் அளவிலேயே வைத்திருக்க ‘புதரிலிருந்து எழுந்த’ என்பதற்குப் பதிலாக ‘புதரின் நெருப்புச் சுடரில்’ என மாற்றப்பட்டது. ἄγγελος-ன் சூழல்சார் பொருளைத் தெளிவுபடுத்த ‘தேவதூதன்’ பயன்படுத்தப்பட்டது; இருப்பினும் யாத்திராகமத்திலுள்ள ‘ஆண்டவருடைய தூதன்’ என்ற அடையாளம் முதன்மை உரையில் சேர்க்கப்படவில்லை. அடிக்குறிப்புகள் உரையின் முக்கிய lexical மற்றும் theological ambiguity-களை முறையாகக் குறிக்க மறுசீரமைக்கப்பட்டன.
