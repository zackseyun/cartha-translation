  source_fidelity: முதன்மை உரை காலக் குறிப்பையும், சீனாய் மலையின் வனாந்தரத்தையும், தூதனின் தோற்றத்தையும் துல்லியமாகத் தருகிறது. ஆனால் ‘ஒரு புதரிலிருந்து எழுந்த’ என்பது βάτου என்ற சுருக்கமான genitive தொடர்பை ‘எழுந்த’ எனச் சற்று விளக்கி உறுதிப்படுத்துகிறது. ‘புதரின் நெருப்புச் சுடரில்’ என்பது மூலத்தின் சுருக்கமான படிமத்தையும் அதன் தெளிவின்மையையும் நன்றாகக் காக்கிறது. சூழலில் விண்ணுலகத் தூதரைக் குறிக்கும் ἄγγελος-க்கு ‘தேவதூதன்’ தெளிவானதும் நவீன வேதாகமத் தமிழில் இயல்பானதுமாகும்.
  naturalness: திருத்திய சொற்றொடர் நவீன நிலையான தமிழில் இயல்பாகவும் வேதாகம உரைநடைக்குப் பொருத்தமாகவும் உள்ளது. ‘அவருக்குத் தோன்றினார்’ மோசேயைச் சூழலிலிருந்து இயல்பாகக் குறிக்கிறது; மரியாதை ஒருமையும் காக்கப்படுகிறது.
  terminology: ‘வனாந்தரம்,’ ‘தேவதூதன்,’ ‘நெருப்புச் சுடர்’ ஆகியவை நிலையான, புரிந்துகொள்ளக்கூடிய வேதாகமச் சொற்கள். ‘தேவதூதன்’ என்பது ‘ஆண்டவருடைய தூதன்’ என்ற கூடுதல் அடையாளத்தை முதன்மை உரையில் இறக்குமதி செய்யாது.
