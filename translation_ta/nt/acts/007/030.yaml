  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: ta
  text: நாற்பது ஆண்டுகள் நிறைவடைந்தபின்[a], சீனாய் மலையின் வனாந்தரத்தில் ஒரு புதரின் நெருப்புச் சுடரில்[b] ஒரு தேவதூதன் அவருக்குத் தோன்றினார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாற்பது ஆண்டுகள் நிறைவுற்றபோது.’
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, ‘ஒரு புதரின் நெருப்புச் சுடரில்.’ நெருப்புச் சுடர் புதருடன் தொடர்புடையது என்பதை இது குறிக்கிறது; யாத்திராகமம் 3:2-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
  - marker: c
    text: யாத்திராகமம் 3:2-இல் ‘ஆண்டவருடைய தூதன்’ என்று கூறப்படுகிறது; ஆனால் அப்போஸ்தலர் இங்கு வெறுமனே ‘ஒரு தேவதூதன்’ என்று மட்டுமே கூறுகிறார்.
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: நாற்பது ஆண்டுகள் நிறைவடைந்தபின்
  rationale: மூலத்தின் genitive absolute காலச் சூழலைக் குறிக்கிறது. ‘நிறைவடைந்தபின்’ என்பது πληρόω என்பதன் ‘நிறைவு’ கருத்தைப் பாதுகாப்பதோடு இயல்பான தமிழாகவும் உள்ளது.
- source_word: ὤφθη αὐτῷ
  choice: அவருக்குத் தோன்றினான்
  rationale: ὤφθη இங்கு ஒரு வெளிப்பாட்டைக் குறிக்கும் செயலற்ற வடிவமாக இருந்து ‘தோன்றினான்’ என்ற பொருளைத் தருகிறது; αὐτῷ என்பது சூழலில் மோசேயைக் குறிக்கிறது.
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: சீனாய் மலையின் வனாந்தரத்தில்
  rationale: ἔρημος என்பதற்கு வேதாகமப் புவியியல் சூழலில் ‘வனாந்தரம்’ பொருத்தமானது; மலையின் பெயரைக் குறிக்கும் இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἄγγελος
  choice: ஒரு தூதன்
  rationale: இங்கு மனிதத் தூதர் அல்ல, விண்ணுலகத் தூதர் குறிக்கப்படுகிறார். கிரேக்கம் குறிப்பிட்ட அடைமொழி இன்றி ἄγγελος என்று மட்டும் கூறுவதால் ‘ஒரு தூதன்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: ஒரு புதரிலிருந்து எழுந்த நெருப்புச் சுடரில்
  rationale: சுருக்கமான கிரேக்க genitive அமைப்பு புதருடன் தொடர்புடைய நெருப்புச் சுடரைக் குறிக்கிறது. ‘புதரிலிருந்து எழுந்த’ என்பது காட்சியை இயல்பாகத் தெரிவிக்கிறது; இதன் சொற்சொல் அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இறைத்தோற்றச் சூழலில் தோன்றிய ἄγγελος என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் ‘ஒரு தூதன்’ என்று மட்டும் குறிப்பிடுதல்
  alternative: ‘ஆண்டவருடைய தூதன்’ என்று குறிப்பிடுதல்
  rationale: அப்போஸ்தலர் 7:30 இன் கிரேக்க உரை ‘ஆண்டவருடைய தூதன்’ என்று கூறாமல் ἄγγελος என்று மட்டுமே கூறுகிறது. யாத்திராகமம் 3:2 உடனான தொடர்பை ஏற்றுக்கொண்டாலும், அந்த விரிவான அடையாளத்தை முதன்மை உரைக்குள் சேர்க்காமல் தெளிவின்மையைப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம நடையும் காக்கப்பட்டுள்ளன. மோசேயைக் குறிக்க ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’, ‘நெருப்புச் சுடர்’ போன்ற சொற்கள் பொதுவாகப் புரியக்கூடியவையாகவும் மூலப் படிமத்தைப் பாதுகாப்பவையாகவும் உள்ளன.
