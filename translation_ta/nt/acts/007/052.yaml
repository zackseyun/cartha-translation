id: ACT.7.52
reference: Acts 7:52
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: ta
  text: உங்கள் தந்தையர்[a] தீர்க்கதரிசிகளில் யாரைத்தான் துன்புறுத்தவில்லை? நீதியுள்ளவரின்[b] வருகையை முன்கூட்டியே அறிவித்தவர்களையும் அவர்கள் கொன்றார்கள். அவரைக் காட்டிக்கொடுத்தவர்களாகவும்[c] கொலைகாரர்களாகவும் இப்போது நீங்கள் ஆகியிருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் முன்னோர்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் சொல்லுக்குச் சொல் “உங்கள் தந்தையர்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “நீதிமானின்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “துரோகிகளாகவும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: தீர்க்கதரிசிகளில் யாரைத்தான்
  rationale: பகுதிப்பொருள் கொண்ட வினாவை இயல்பான தமிழில் வெளிப்படுத்தி, ஒருவரையும் அவர்கள் விட்டுவைக்கவில்லை என்ற சொல்லாட்சியின் வலிமையைத் தக்கவைக்கிறது.
- source_word: ἐδίωξαν
  choice: துன்புறுத்தவில்லை
  rationale: இங்கு தீர்க்கதரிசிகளுக்கு எதிரான பகைமையான ஒடுக்குதலைக் குறிக்கிறது; ‘துரத்தவில்லை’ என்பதைக் காட்டிலும் சூழலுக்கேற்ற பரந்த பொருளை வழங்குகிறது.
- source_word: οἱ πατέρες ὑμῶν
  choice: உங்கள் தந்தையர்
  rationale: கிரேக்கத்தின் உருவகத்தையும் ஸ்தேவானின் குற்றஞ்சாட்டும் வரலாற்றுத் தொடர்ச்சியையும் நெருக்கமாகப் பேணுகிறது; தமிழில் இது மூதாதையரையும் குறிக்கக்கூடும்.
- source_word: τοὺς προκαταγγείλαντας
  choice: முன்கூட்டியே அறிவித்தவர்களை
  rationale: προ- என்ற கால முன்னுரிமையையும், செய்தியை அறிவித்தல் என்ற வினைச்செயலையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: περὶ τῆς ἐλεύσεως τοῦ δικαίου
  choice: நீதியுள்ளவரின் வருகையை
  rationale: ἔλευσις என்பதற்கு இயல்பான ‘வருகை’ என்பதையும், குறிப்பிட்ட நபரைச் சுட்டும் பெயரடைத் தலைப்பின் வலிமையையும் பேணுகிறது.
- source_word: προδόται
  choice: காட்டிக்கொடுத்தவர்களாக
  rationale: இயேசுவை ஒப்படைத்த தனிப்பட்ட செயலைத் தெளிவாகக் காட்டுகிறது; அரசியல் சார்ந்த பரந்த பொருளைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: φονεῖς
  choice: கொலைகாரர்களாக
  rationale: பொதுவான ‘கொன்றவர்கள்’ என்பதைவிட, குற்றப்பொறுப்பை வலிமையாக வெளிப்படுத்துகிறது.
- source_word: νῦν ... ἐγένεσθε
  choice: இப்போது நீங்கள் ஆகியிருக்கிறீர்கள்
  rationale: முன்னோர்களின் செயலுக்கும் கேட்போரின் தற்போதைய குற்றநிலைக்கும் உள்ள கால வேறுபாட்டையும், ஏற்பட்டுள்ள விளைவு நிலையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: τοῦ δικαίου என்பதை கிறிஸ்துவைக் குறிக்கும் அடையாளப் பெயராக மொழிபெயர்த்தல்
  choice: நீதியுள்ளவர்
  alternative: நீதிமான்
  rationale: சூழலில் இது தீர்க்கதரிசிகளால் முன்னறிவிக்கப்பட்ட இயேசுவைக் குறிக்கிறது. ‘நீதியுள்ளவர்’ என்பது சிறப்பு அடையாளப் பெயரின் வலிமையைப் பேணும் தெளிவான நவீனத் தமிழ்; கிரேக்கத்தில் இல்லாத கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: προδόται என்பதிலுள்ள ஒப்படைத்தல் அல்லது துரோகம் என்ற நுணுக்கம்
  choice: காட்டிக்கொடுத்தவர்கள்
  alternative: துரோகிகள்
  rationale: இயேசுவைக் காட்டிக்கொடுத்த அல்லது ஒப்படைத்த செயலை முன்னிறுத்துகிறது; இருப்பினும் ‘துரோகிகள்’ என்ற நெறிசார் பொருளும் கிரேக்கச் சொல்லில் சாத்தியமுள்ளதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. சொல்லாட்சியின் குற்றஞ்சாட்டும் வலிமை பேணப்பட்டுள்ளது; ‘யாரைத்தான்’ என்ற வடிவம் கிரேக்க வினாவின் மறுப்புப் பொருளை இயல்பாக எடுத்துரைக்கிறது. ‘நீதியுள்ளவர்’ தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாத நிலையிலும் சூழலால் தனிப்பட்ட அடையாளப் பெயராகப் புரிகிறது.
