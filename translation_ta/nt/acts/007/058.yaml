reference: Acts 7:58
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: ta
  text: அவர்கள் அவனை நகரத்துக்கு வெளியே தள்ளிவிட்டு, அவன்மேல் கல்லெறிந்துகொண்டிருந்தார்கள். சாட்சிகள் தங்கள் மேலாடைகளை[a] சவுல் என்று அழைக்கப்பட்ட ஓர் இளைஞனின் காலடியில் வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் ஆடைகளை’ அல்லது ‘தங்கள் மேலங்கிகளை’; கிரேக்கச் சொல் வெளிப்புறத்தில் அணியும் ஆடைகளைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: தள்ளிவிட்டு
  rationale: வலுக்கட்டாயமாக வெளியேற்றிய செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; முதன்மை வினைக்கு முன் நிகழ்ந்த இறந்தகாலப் பங்கேற்புச் செயலையும் ‘-விட்டு’ என்ற தொடரால் காக்கிறது.
- source_word: ἔξω τῆς πόλεως
  choice: நகரத்திற்கு வெளியே
  rationale: நகரின் உள்ளிருந்து வெளியே கொண்டுசெல்லப்பட்ட இயக்கத்தையும் இறுதி இடத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐλιθοβόλουν
  choice: கல்லெறிந்துகொண்டிருந்தார்கள்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வினையின் நடந்துகொண்டிருந்த செயல் அம்சத்தைத் தமிழில் காக்கிறது.
- source_word: οἱ μάρτυρες
  choice: சாட்சிகள்
  rationale: இச்சூழலில் நீதிமுறை சார்ந்த சாட்சிகளைக் குறிக்கிறது; பிற்காலத்தில் உருவான ‘இரத்தசாட்சிகள்’ என்ற பொருளை இறக்குமதி செய்யவில்லை.
- source_word: ἀπέθεντο
  choice: வைத்தார்கள்
  rationale: ஆடைகளைக் கழற்றி ஒருவரின் காலடியில் வைத்த செயலை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: தங்கள் மேலாடைகளை
  rationale: ἱμάτια பொதுவாக வெளிப்புற ஆடைகளைக் குறிக்கிறது; ‘மேலாடைகள்’ என்பது தமிழில் புரியக்கூடியதும் ‘ஆடைகள்’ என்பதைவிடச் சற்றுத் துல்லியமானதும் ஆகும்.
- source_word: παρὰ τοὺς πόδας
  choice: காலடியில்
  rationale: ஒருவரின் கால்களுக்கு அருகில் அல்லது அவருடைய பொறுப்பில் பொருளை வைப்பதைத் தமிழில் இயல்பாகச் சொல்கிறது.
- source_word: νεανίου
  choice: ஓர் இளைஞனின்
  rationale: ஒப்பீட்டளவில் இளம் ஆணைக் குறிக்கும் νεανίας என்பதற்கு நவீனத் தமிழில் இயல்பான இணைச்சொல்.
- source_word: καλουμένου Σαύλου
  choice: சவுல் என்று அழைக்கப்பட்ட
  rationale: பெயரால் அழைக்கப்பட்டவர் என்ற கிரேக்க வடிவத்தை நெருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: கல்லெறியும் தண்டனைச் சூழலில் μάρτυρες என்போரின் அடையாளம்
  choice: நீதிமுறைச் சாட்சிகளைக் குறிக்கும் ‘சாட்சிகள்’
  alternative: ‘இரத்தசாட்சிகள்’
  rationale: இந்த நிகழ்வில் அவர்கள் விசாரணையில் சாட்சி சொன்னவர்களாகவும் கல்லெறிதலில் பங்கெடுத்தவர்களாகவும் உள்ளனர். பிற்காலத் திருச்சபைப் பயன்பாட்டிலுள்ள ‘இரத்தசாட்சி’ என்ற பொருள் இங்கு பொருந்தாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ந்துகொண்டிருந்த கல்லெறிதலை வினை வடிவம் வெளிப்படுத்துகிறது. அடிக்குறிப்புக் குறி அது விளக்கும் ‘மேலாடைகளை’ என்ற சொல்லுக்குப் பின்னால் வைக்கப்பட்டுள்ளது.
