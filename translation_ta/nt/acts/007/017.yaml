source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: ta
  text: ஆனால், கடவுள் ஆபிரகாமுக்கு அளித்த வாக்குறுதி நிறைவேறும் காலம் நெருங்கி வந்தபோது[a], எகிப்தில் மக்கள் வளர்ந்து பெருகினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் ஆபிரகாமுக்கு அளித்த வாக்குறுதியின் காலம் நெருங்கி வந்தபோது.” கிரேக்க வினைச்சொல் அறிவித்த அல்லது உறுதிப்படுத்திய அர்ப்பணிப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: ஆனால், ...போது
  rationale: καθώς என்பதன் காலத் தொடர்பை ‘போது’ இயல்பாக வெளிப்படுத்துகிறது; δέ குறிக்கும் மென்மையான உரைமாற்றத்தை ‘ஆனால்’ காட்டுகிறது, வலுவான முரண்பாட்டைத் திணிக்காமல்.
- source_word: ἤγγιζεν
  choice: நெருங்கி வந்தபோது
  rationale: நிறைவுறா இறந்தகால வடிவம் படிப்படியாக நெருங்கிக்கொண்டிருந்த நிகழ்வைச் சுட்டுவதால், ‘நெருங்கி வந்த’ அந்த நீடித்த தன்மையை வெளிப்படுத்துகிறது.
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: வாக்குறுதி நிறைவேறும் காலம்
  rationale: சொல்லுக்குச் சொல் ‘வாக்குறுதியின் காலம்’ என்பது தமிழில் தெளிவற்றதாக இருப்பதால், சூழலில் குறிக்கப்படும் வாக்குறுதியின் நிறைவேற்றக் காலத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: கடவுள் ஆபிரகாமுக்கு அளித்த
  rationale: ὡμολόγησεν இச்சூழலில் அறிவிக்கப்பட்ட உறுதிப்பாட்டைக் குறிக்கிறது. ‘வாக்குறுதி அளித்த’ என்பது தமிழின் இயல்பான சொற்சேர்க்கை; ‘ஆணையிட்டார்’ அல்லது ‘சத்தியம் செய்தார்’ என்று கிரேக்கத்தைவிட வலுப்படுத்தவில்லை.
- source_word: ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη
  choice: அந்த மக்கள் பெருகிப் பலுகினார்கள்
  rationale: இரு வினைகளின் நெருங்கிய ஆனால் வேறுபட்ட கருத்துகளை ‘பெருகி’ மற்றும் ‘பலுகி’ காக்கின்றன; ‘அந்த மக்கள்’ என்பது சூழலில் இஸ்ரவேல் மக்களைச் சுட்டும் கூட்டு அர்த்தத்தை இயல்பாகத் தருகிறது.
- source_word: ἐν Αἰγύπτῳ
  choice: எகிப்தில்
  rationale: இடப்பொருளை நேரடியாகவும் நவீனத் தமிழில் வழக்கமான பெயர்வடிவத்துடனும் தருகிறது.
theological_decisions:
- issue: ὡμολόγησεν என்பதையும் ஆபிரகாமுக்கான கடவுளின் வாக்குறுதியையும் மொழிபெயர்த்தல்
  choice: ‘கடவுள் ஆபிரகாமுக்கு அளித்த வாக்குறுதி’
  alternative: ‘கடவுள் ஆபிரகாமுக்கு வாக்களித்த வாக்குறுதி’ அல்லது ‘கடவுள் ஆபிரகாமுக்கு உறுதியளித்த வாக்குறுதி’
  rationale: ‘அளித்த வாக்குறுதி’ என்பது இயல்பான தமிழில் அறிவிக்கப்பட்ட தெய்வீக உறுதிப்பாட்டைத் தெரிவிக்கிறது. ‘சத்தியம் செய்த’ என்று குறிப்பிட்ட ஆணைமொழியைச் சேர்க்காமல், மூலத்தின் வாக்குறுதி மையத்தைப் பாதுகாக்கிறது.
- issue: τῆς ἐπαγγελίας என்ற மரபுத்தொடரில் காலத்தின் பொருள்
  choice: ‘வாக்குறுதி நிறைவேறும் காலம்’
  alternative: ‘வாக்குறுதியின் காலம்’
  rationale: கிரேக்க மரபுத்தொடர் வாக்குறுதியோடு தொடர்புடைய, சூழலில் அதன் நிறைவேற்றத்திற்குரிய காலத்தைக் குறிக்கிறது. தமிழில் தேவையான ‘நிறைவேறும்’ என்பதைச் சேர்ப்பது சூழல்சார் உறவைத் தெளிவாக்குகிறது; நிறைவேற்றத்தின் முறை அல்லது முழு இறையியல் பொருளை நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெருகிப் பலுகினார்கள்’ என்பது இரு கிரேக்க வினைகளையும் சுருக்கமாக வேறுபடுத்திக் காட்டும் இயல்பான இணைச்சொல். அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
