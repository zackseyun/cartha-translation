  to: ஆனால், கடவுள் ஆபிரகாமுக்கு அளித்த வாக்குறுதி நிறைவேறும் காலம் நெருங்கி வந்தபோது[a], எகிப்தில் மக்கள் வளர்ந்து பெருகினர்.
