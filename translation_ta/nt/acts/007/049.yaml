id: ACT.7.49
reference: Acts 7:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: ta
  text: '“வானம் எனக்குச் சிங்காசனம்;

    பூமியோ என் கால்களுக்கான பாதபீடம்.

    எப்படிப்பட்ட வீட்டை எனக்காகக் கட்டுவீர்கள்?

    என்று ஆண்டவர் கூறுகிறார்.

    அல்லது, என் ஓய்வின் இடம் எது?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: வானம்
  rationale: பூமிக்கு எதிரிணையாக வரும் பரலோக விரிவைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் கவித்துவத் தன்மையைப் பேணியும் ‘வானம்’ அமைகிறது.
- source_word: θρόνος
  choice: சிங்காசனம்
  rationale: அரசாட்சியின் இருக்கை என்ற உருவகத்தை நேரடியாகவும் தெளிவாகவும் பேணுகிறது.
- source_word: γῆ
  choice: பூமி
  rationale: வானத்துடன் இணைத்துக் கூறப்படும் பிரபஞ்ச அளவிலான பொருள்; ‘நிலம்’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: என் கால்களுக்குக் கால்மணை
  rationale: கால்களை வைக்கும் தாழ்ந்த மணை என்ற உருவகத்தையும் கிரேக்கத்தில் வெளிப்படையாக உள்ள ‘என் கால்கள்’ என்பதையும் இயல்பான தமிழில் பேணுகிறது.
- source_word: ποῖον
  choice: எப்படிப்பட்ட
  rationale: அடையாளத்தை மட்டுமல்லாமல் தன்மை அல்லது வகையைப் பற்றிக் கேட்கும் சொல்லின் வினாவுணர்வைப் பேணுகிறது.
- source_word: οἶκον
  choice: வீட்டை
  rationale: சூழலில் ஆலயத்தைக் குறிப்பிட்டாலும், மூலத்தின் பொதுவான ‘வீடு’ என்ற சொல்லைத் தக்கவைத்து, ஆலயப் பொருளைச் சூழலே உணர்த்த அனுமதிக்கிறது.
- source_word: οἰκοδομήσετέ
  choice: கட்டுவீர்கள்
  rationale: எதிர்காலச் சுட்டுவினாவை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டின் கிரேக்க மூலத்திலுள்ள κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழ் இணை.
- source_word: τόπος τῆς καταπαύσεώς μου
  choice: நான் இளைப்பாறுவதற்கான இடம்
  rationale: ‘என் இளைப்பாறுதலின் இடம்’ என்ற கடினமான சொற்றொடரைவிட இயல்பான தமிழைப் பயன்படுத்தி, தெய்வீக இளைப்பாறுதல் என்ற பொருளைப் பேணுகிறது.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் இஸ்ரவேலின் தேவனைச் சுட்டும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர்
  rationale: இது புதிய ஏற்பாட்டின் கிரேக்க உரையிலுள்ள κύριος என்பதன் மொழிபெயர்ப்பு. ‘ஆண்டவர்’ அதன் அதிகாரத்தையும் மரியாதையையும் வெளிப்படுத்துகிறது; எபிரெய தெய்வீகப் பெயரை நேரடியாக உரையில் சேர்க்காமல் மூலத்தின் வடிவைப் பேணுகிறது.
- issue: κατάπαυσις என்பதில் இடமா அல்லது செயலா முன்னிலைப்படுத்தப்பட வேண்டும்
  choice: நான் இளைப்பாறுவதற்கான இடம்
  alternative: என் இளைப்பாறுதலின் இடம்
  rationale: கிரேக்கத்தின் ‘என் இளைப்பாறுதலுக்குரிய இடம்’ என்ற உறவைத் தெளிவான தமிழில் தருகிறது; ‘இளைப்பாறும் இடம்’ என்று சுருக்கி இடத்தையே தனி பெயர்ச்சொல்லாக்காமல், தெய்வீக இளைப்பாறுதல் பற்றிய நுண்ணுணர்வைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் சாதாரண வாசகருக்கும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கவிதைநடை இணை அமைப்பும் இரண்டு வினாக்களின் வாதநயமும் வரி பிரிப்பால் பேணப்பட்டுள்ளன.
