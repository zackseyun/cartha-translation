source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: ta
  text: அவர்கள் ஆரோனிடம், “எங்களுக்காக, எங்களுக்கு முன் செல்லும் தெய்வங்களை[a] உருவாக்கு. ஏனெனில், எகிப்து நாட்டிலிருந்து எங்களை வெளியே அழைத்து வந்த இந்த மோசேக்கு என்ன ஆனது என்று எங்களுக்குத் தெரியவில்லை” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிலைகளை.” கிரேக்கச் சொல் நேரடியாக “தெய்வங்கள்” என்று பொருள்படும்; இது யாத்திராகம நிகழ்வின் சொல்வடிவத்தை எதிரொலிக்கிறது. மக்களின் கூற்றை விளக்கப்பெயரால் மாற்றாமல் அப்படியே காக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: அவர்கள் ஆரோனிடம் … என்று சொன்னார்கள்
  rationale: கிரேக்க இறந்தகாலப் பெயரெச்சத் தொடரைத் தமிழ்க் கதைநடைக்கு இயல்பான முற்றுவினை அமைப்பாக வழங்குகிறது; பேச்சின் உள்ளடக்கத்துடனான தொடர்பும் தெளிவாக உள்ளது.
- source_word: Ποίησον ἡμῖν
  choice: எங்களுக்காகச் செய்துகொடும்
  rationale: ποιέω என்பதன் நேரடியான ‘செய்/உருவாக்கு’ பொருளை வைத்துக்கொண்டு, ஆரோனிடம் வைக்கப்படும் வேண்டுகோள் கலந்த கட்டளையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: θεοὺς
  choice: தெய்வங்களை
  rationale: மூலத்தில் ‘சிலைகள்’ என்பதற்கான தனிச்சொல் இல்லாமல் θεός என்பதன் பன்மை உள்ளது. ஆகவே யாத்திராகம மேற்கோளின் சொல்வடிவத்தையும் மக்களின் சொந்தக் கோரிக்கையையும் ‘தெய்வங்கள்’ காக்கிறது.
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: எங்களுக்கு முன்பாகச் செல்லும்
  rationale: προπορεύομαι என்பதன் ‘முன்னே செல்லுதல்’ என்ற இயக்கப் பொருளை நேரடியாகக் காக்கிறது; ‘வழிநடத்தும்’ என்று மொழிபெயர்த்து கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: ஏனெனில் … இந்த மோசே
  rationale: γάρ தரும் காரணத் தொடர்பை ‘ஏனெனில்’ காட்டுகிறது; οὗτος என்பதன் சுட்டும், சற்றே விலகிநிற்கும் தொனியை ‘இந்த மோசே’ காக்கிறது.
- source_word: ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: எகிப்து நாட்டிலிருந்து எங்களை வெளியே அழைத்துவந்த
  rationale: ἐξάγω என்பதிலுள்ள வெளியே கொண்டுவரும் இயக்கத்தையும் γῆς Αἰγύπτου என்ற முழுச் சொற்றொடரிலுள்ள ‘எகிப்து நாடு’ என்பதையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: அவருக்கு என்ன ஆனது என்று எங்களுக்குத் தெரியவில்லை
  rationale: கிரேக்கச் சொற்றொடரின் பொருளைத் தெளிவான, தற்போதைய தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: விக்கிரகாராதனைச் சூழலில் θεοὺς என்பதன் மொழிபெயர்ப்பு
  choice: தெய்வங்கள்
  alternative: சிலைகள் / விக்கிரகங்கள்
  rationale: இது மக்களின் கோரிக்கையை அவர்களுடைய சொற்களிலேயே மேற்கோளிடுகிறது; கிரேக்கம் ‘சிலைகள்’ என்று விளக்கப்பெயர் பயன்படுத்தவில்லை. ‘தெய்வங்கள்’ என்பது மூலத்தின் சொற்பொருளையும் அவர்களின் துரோகத்தில் உள்ள இறையியல் பதற்றத்தையும் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான கதைநடை. மேற்கோள் இயல்பாக அமைய பெயரெச்சத்தை முற்றுவினையாக மாற்றியுள்ளோம். ‘இந்த மோசே’ என்ற வடிவம் மூலத்தில் உள்ள சற்றே இகழ்ச்சியான அல்லது விலகிநிற்கும் சுட்டுத்தொனியை அளவுக்கு மீறாமல் காக்கிறது.
