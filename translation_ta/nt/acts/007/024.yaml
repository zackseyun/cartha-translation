source:
  edition: SBLGNT
  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: ta
  text: அநீதி இழைக்கப்பட்ட ஒருவனை அவர் கண்டபோது, அவனுக்குத் துணைநின்று, ஒடுக்கப்பட்டவனுக்காக எகிப்தியனை அடித்து[b] நீதி கிடைக்கச் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒடுக்கப்பட்டவனுக்காகப் பழிதீர்த்தார்.” கிரேக்கச் சொற்றொடர் ஒருவருக்காக நீதி செய்வதையும் பழிதீர்ப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எகிப்தியனை அடிப்பதன் மூலம்.” இங்குள்ள கிரேக்க வினை நேரடியாக “அடி” என்று பொருள்படும்; சூழலில் அந்த அடி மரணத்தை விளைவித்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலச்சூழலை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: τινα
  choice: ஒருவனை
  rationale: கிரேக்கத்தின் குறிப்பற்ற தன்மையைத் தக்கவைக்கிறது; சூழலால் ஆண் என்பது தெளிவாக இருப்பதால் தமிழில் இயல்பாக உள்ளது.
- source_word: ἀδικούμενον
  choice: அநியாயமாக நடத்தப்பட்டுக்கொண்டிருந்த
  rationale: அநீதி இழைக்கப்படுதல் என்ற ஒழுக்கப் பொருளையும் தொடர்ந்துகொண்டிருந்த செயலையும் வெளிப்படுத்துகிறது.
- source_word: ἠμύνατο
  choice: அவனுக்குத் துணைநின்று
  rationale: தாக்குதலுக்கு உள்ளானவரின் சார்பாக உதவவும் காக்கவும் முன்வந்த செயலை இயல்பாகக் குறிக்கிறது.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: நீதி கிடைக்கச் செய்தார்
  rationale: பழிதீர்த்தல், நியாயம் செய்தல் ஆகிய இரு சாத்தியப் பொருள் நிழல்களுள் நீதிசார்ந்த பொருளை முதன்மைப்படுத்தி, மாற்றுப் பொருளை அடிக்குறிப்பில் தக்கவைக்கிறது.
- source_word: τῷ καταπονουμένῳ
  choice: ஒடுக்கப்பட்டுக்கொண்டிருந்த அவனுக்காக
  rationale: கடுமையாக நடத்தப்பட்ட அல்லது ஒடுக்கப்பட்ட நபருக்காகச் செய்யப்பட்ட செயல் என்பதைத் தெளிவாக்குகிறது.
- source_word: πατάξας
  choice: எகிப்தியனை அடித்து
  rationale: வினையின் நேரடியான பொருள் ‘அடித்தல்’; சூழலில் ஏற்பட்ட மரணத்தை மூலச்சொல்லுக்குள் கட்டாயமாகச் சேர்க்காமல் விடுகிறது.
- source_word: τὸν Αἰγύπτιον
  choice: எகிப்தியனை
  rationale: இன அடையாளத்தைக் குறிக்கும் பெயர்ச்சொல்லின் இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: மோசேயின் செயலிலுள்ள ἐκδίκησις என்பதன் நீதி/பழிதீர்த்தல் நுணுக்கம்
  choice: நீதி கிடைக்கச் செய்தார்
  alternative: ஒடுக்கப்பட்டவனுக்காகப் பழிதீர்த்தார்
  rationale: கிரேக்கச் சொற்றொடர் நியாயம் செய்தல், பழிதீர்த்தல் அல்லது ஒருவருக்காக நீதி பெற்றுத்தருதல் ஆகிய நுணுக்கங்களைக் கொண்டிருக்கலாம். முதன்மை உரை தனிப்பட்ட பழிவாங்கலைக் கோட்பாட்டுரீதியாக ஆதரிப்பதுபோல் ஒலிக்காமல் நீதிசார்ந்த பொருளைக் காட்டுகிறது; உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்நிலைப் பங்கேற்புவினைகள் ‘நடத்தப்பட்டுக்கொண்டிருந்த’, ‘ஒடுக்கப்பட்டுக்கொண்டிருந்த’ என்று மொழிபெயர்க்கப்பட்டு மூலத்தின் நீடித்த துன்புறுத்தல் உணர்வு காக்கப்பட்டுள்ளது.
