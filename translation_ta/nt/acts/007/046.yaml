  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: ta
  text: அவர் கடவுளின் பார்வையில் தயவு பெற்றார்; யாக்கோபின் கடவுளுக்காக ஓர் உறைவிடத்தைக் கண்டடைய வேண்டினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாக்கோபின் கடவுளுக்காக ஒரு திருக்கூடாரத்தைக் கண்டடைய வேண்டினார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: தயவு பெற்றார்
  rationale: இந்த கிரேக்க மரபுத்தொடர் அருள் என்ற கருத்தைப் புதிதாகக் கண்டுபிடித்ததை அல்ல, ஒருவரின் தயவைப் பெற்றதைக் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘தயவு பெற்றார்’ என்பது உறவுசார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளின் பார்வையில்
  rationale: ἐνώπιον என்பது ஒருவருக்கு முன்பாக அல்லது அவருடைய பார்வையில் இருப்பதைக் குறிக்கிறது. ‘கடவுளின் பார்வையில்’ என்பது தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: ᾐτήσατο
  choice: அனுமதி கேட்டார்
  rationale: இடைமைக் குரல் வடிவம் அவர் தனக்காக ஒரு வேண்டுகோளை முன்வைத்ததைக் காட்டுகிறது. சங்கீதம் 132:5-ஐப் பின்னணியாகக் கொண்ட இந்தச் சூழலில், உறைவிடத்தைக் கண்டடைய அவர் கடவுளிடம் அனுமதி கேட்டார் என்ற பொருளைத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது; ‘கேட்டார்’ என்ற மூல வினையின் வேண்டுகோள் தன்மையும் காக்கப்படுகிறது.
- source_word: εὑρεῖν
  choice: கண்டடைய
  rationale: கிரேக்க வினைச்சொல்லின் அடிப்படைப் பொருளான ‘கண்டுபிடிக்க/கண்டடைய’ என்பதைக் காக்கிறது; சூழலிலிருந்து கிடைக்கச் செய்தல் அல்லது ஏற்பாடு செய்தல் என்ற நுண்பொருள் எழலாம் என்றாலும் அதை முதன்மை உரையில் தீர்மானமாக்கவில்லை.
- source_word: σκήνωμα
  choice: ஓர் உறைவிடம்
  rationale: இச்சொல் பொதுவாகத் தங்குமிடம் அல்லது உறைவிடத்தைக் குறிக்கிறது. அடுத்த வசனத்தில் சாலொமோன் கட்டிய வீட்டுடன் தொடர்பு ஏற்படுவதால், ‘திருக்கூடாரம்’ அல்லது ‘ஆலயம்’ என்று முன்கூட்டியே குறிப்பிட்டுக் கட்டுப்படுத்தாமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: τῷ θεῷ Ἰακώβ
  choice: யாக்கோபின் கடவுளுக்காக
  rationale: σκήνωμα என்பதுடன் வரும் வேற்றுமை உருபைத் தமிழில் ‘-க்காக’ இயல்பாக வெளிப்படுத்துகிறது; ‘யாக்கோபின் கடவுள்’ என்ற வேதாகம உடன்படிக்கைச் சொல்லாட்சியையும் காக்கிறது.
theological_decisions:
- issue: தாவீது வேண்டிய கட்டிடத்தின் தன்மையும் அதன் சுட்டுப்பொருளும்
  choice: ‘ஓர் உறைவிடம்’ என்று பரந்த பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒரு திருக்கூடாரம்’ அல்லது ‘ஒரு வீடு’
  rationale: σκήνωμα என்பது ‘ஆலயம்’ என்பதைக் காட்டிலும் பரந்த சொல். தாவீது ஒரு இடத்தை விரும்பியதும் பின்னர் சாலொமோன் வீட்டைக் கட்டியதும் இடையிலான உரைநடைத் தொடர்பையும் இறையியல் அழுத்தத்தையும் ஒரு குறிப்பிட்ட கட்டிடமாக முன்கூட்டியே தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் பொதுமக்கள் புரிந்துகொள்ளும் இயல்பும் இணையும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உறைவிடம்’ என்பது σκήνωμα-வின் பரந்த பொருளைக் காக்கிறது; அடிக்குறிப்பில் ‘திருக்கூடாரம்’ என்ற சாத்தியமான தொழில்நுட்ப வாசிப்பு தரப்பட்டுள்ளது.
