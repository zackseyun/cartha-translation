  source_fidelity: 'மூலக் கிரேக்கத்தின் நிகழ்வுவரிசையும் முக்கியக் கூறுகளும் துல்லியமாகத் தக்கவைக்கப்பட்டுள்ளன: முழங்காலூன்றுதல், உரத்த குரலில் கூக்குரலிடுதல், ஆண்டவரை நோக்கிய வேண்டுதல், ‘இந்தப் பாவம்’ என்ற சுட்டுக்குறிப்பு, பின்னர் வரும் துயில்/மரண உருவகம் ஆகியவை அனைத்தும் இடம்பெறுகின்றன. “இவர்கள்மேல் சுமத்தாதீர்” என்பது μὴ στήσῃς αὐτοῖς ... τὴν ἁμαρτίαν என்பதன் கணக்கில் சுமத்துதல்/எதிராக நிறுத்துதல் என்ற பொருளை நன்றாக வெளிப்படுத்துகிறது.'
