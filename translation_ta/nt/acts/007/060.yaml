source:
  edition: SBLGNT
  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: ta
  text: பின்பு அவர் முழங்காலூன்றி, உரத்த குரலில், “ஆண்டவரே, இந்தப் பாவத்தை இவர்கள்மேல் சுமத்தாதீர்[a]” என்று கூக்குரலிட்டார். இப்படிச் சொன்னபின், அவர் துயிலடைந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தப் பாவத்தை இவர்கள்மேல் குற்றமாகச் சாட்டாதீர்” அல்லது “இந்தப் பாவத்தை இவர்கள் கணக்கில் வைக்காதீர்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “துயிலடைந்தார்”; இது மரணத்தைக் குறிக்க வழக்கமாகப் பயன்படுத்தப்பட்ட ஓர் வெளிப்பாடு.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: பின்பு அவர் முழங்காலூன்றி
  rationale: ‘முழங்கால்களை வைத்தல்’ என்ற கிரேக்க மரபுத்தொடர் முழங்காலூன்றுவதைக் குறிக்கிறது. δέ இங்கு கதை முன்னேற்றத்தைச் சுட்டுவதால் ‘பின்பு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: உரத்த குரலில் … கூக்குரலிட்டார்
  rationale: κράζω வலிமையான கூக்குரலைக் குறிக்கிறது; φωνῇ μεγάλῃ என்பதன் வலியுறுத்தலை ‘உரத்த குரலில்’ என்று வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: சூழலில் இயேசுவை நோக்கிய இந்த அழைப்பு, κύριος என்பதன் மரியாதையையும் புதிய ஏற்பாட்டுத் தலைப்புப் பயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: இந்தப் பாவத்தை இவர்கள்மேல் சுமத்தாதீர்
  rationale: இங்கு ἵστημι ஒரு குற்றத்தை ஒருவருக்கு எதிராகப் பதிவு செய்தல் அல்லது அவர்மேல் சுமத்துதல் என்ற பொருளைக் கொண்டுள்ளது. ‘இந்த’ என்பது ταύτην என்ற சுட்டுப்பெயரைத் தக்கவைக்கிறது.
- source_word: καὶ τοῦτο εἰπὼν
  choice: இப்படிச் சொன்னபின்
  rationale: கிரேக்கப் பெயரெச்சத் தொடரின் கால வரிசையையும் முந்தைய வேண்டுதலுடனான தொடர்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐκοιμήθη
  choice: அவர் துயிலடைந்தார்
  rationale: ஸ்தேவானின் மரணத்தைக் குறிக்க கிரேக்கம் பயன்படுத்தும் தூக்க உருவகத்தை ‘துயிலடைந்தார்’ தக்கவைக்கிறது; அதை நேரடியாக ‘இறந்தார்’ என்று சமப்படுத்தவில்லை.
theological_decisions:
- issue: ἐκοιμήθη என்ற மரணத்தைக் குறிக்கும் தூக்க உருவகம்
  choice: அவர் துயிலடைந்தார்
  alternative: அவர் இறந்தார்
  rationale: வசனம் மரணத்தை நேரடியாகச் சொல்லாமல் தூக்க உருவகத்தால் குறிப்பிடுகிறது. தமிழிலும் அந்த உருவகத்தையும் அதன் இறையியல் தொனியையும் மிகைப்படுத்தாமல் தக்கவைக்கப்பட்டது.
- issue: ஸ்தேவானின் வேண்டுதலில் வரும் Κύριε
  choice: ஆண்டவரே
  alternative: எஜமானே
  rationale: முந்தைய வசனத்தின் சூழலில் இந்த அழைப்பு இயேசுவை நோக்கியது. ‘ஆண்டவரே’ என்பது கிறிஸ்துவைக் குறிக்கும் பட்டத்தையும் மரியாதையையும் தக்கவைக்கிறது; உரைக்குள் கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘முழங்காலூன்றி,’ ‘உரத்த குரலில்,’ ‘இந்தப் பாவம்’ ஆகிய மூலஉரைக் கூறுகள் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளன. ‘துயிலடைந்தார்’ சற்றே உயர்ந்தாலும் பொதுவாகப் புரிந்துகொள்ளக்கூடிய சொல்லாக இருந்து, கிரேக்கத்தின் மரண உருவகத்தைப் பாதுகாக்கிறது.
