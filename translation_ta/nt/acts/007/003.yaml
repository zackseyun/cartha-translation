source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: ta
  text: அவர் அவனிடம், “உன் நாட்டிலிருந்தும் உன் உறவினரிடமிருந்தும்[a] புறப்பட்டு, நான் உனக்குக் காட்டும் நாட்டிற்கு வா” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “உன் உறவுக் கூட்டத்தாரிடமிருந்தும்” அல்லது “உன் குடும்பத்தாரிடமிருந்தும்.” συγγένεια என்ற கிரேக்கச் சொல் ஒருவருடைய உறவினர்களையோ உறவுக் குழுவையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: அவர் அவனிடம் … என்றார்
  rationale: கிரேக்க மூலத்திலுள்ள பெயர்ச்சுட்டைப் பெயரால் மாற்றாமல் வைத்திருக்கிறது; தமிழில் இயல்பான உரையாடல் அமைப்பையும் தருகிறது.
- source_word: Ἔξελθε
  choice: புறப்பட்டு
  rationale: ஒரு இடத்தைவிட்டு வெளியேறிச் செல்லும் கட்டளையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; தொடர்ந்து வரும் ‘வா’ என்பதோடு ஒரே கட்டளைத் தொடராக அமைகிறது.
- source_word: ἐκ τῆς γῆς σου
  choice: உன் நாட்டிலிருந்தும்
  rationale: γῆ என்பதன் பரந்த நிலப்பரப்பு அல்லது தாய்நாடு சார்ந்த பொருளை இச்சூழலில் தெளிவாகத் தருகிறது; நவீன தேசிய அரசின் கருத்தை வலியுறுத்தவில்லை.
- source_word: συγγενείας
  choice: உன் உறவினரிடமிருந்தும்
  rationale: ஒருவரின் உறவுக் குழுவைக் குறிக்கும் συλλογικό பொருளை இயல்பான தமிழில் தருகிறது. ‘குடும்பம்’ என்பதைவிட இது பரந்த பொருளுடையது.
- source_word: δεῦρο
  choice: வா
  rationale: δεῦρο என்பதன் அழைப்பு மற்றும் பேச்சாளரை நோக்கிய இயக்க நுட்பத்தைத் தக்கவைக்கிறது; அதை ‘போ’ என்று சமப்படுத்தவில்லை.
- source_word: εἰς τὴν γῆν
  choice: நாட்டிற்கு
  rationale: குறிப்பிட்ட நிலத்தை இலக்காக நோக்கிச் செல்லும் இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἣν ἄν σοι δείξω
  choice: நான் உனக்குக் காட்டும்
  rationale: ἄν உடன் வரும் aorist subjunctive-இன் எதிர்கால நோக்கை தமிழில் இயல்பாக வெளிப்படுத்துகிறது; தேவையற்ற ஐயப்பாட்டைச் சேர்க்கவில்லை.
