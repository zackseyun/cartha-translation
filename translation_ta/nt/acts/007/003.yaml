translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தெய்வீகப் பேச்சாளருக்கு மரியாதைப் பன்மையான ‘அவர்’ என்பதும், கிரேக்க மூலத்தின்படி ஆபிரகாமைக் குறிக்கப் பெயருக்குப் பதிலாக ‘அவன்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறி குறியீடு அது விளக்கும் ‘உறவினரிடமிருந்தும்’ என்பதுடன் இணைக்கப்பட்டுள்ளது.
