source:
  edition: SBLGNT
  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: ta
  text: எகிப்து முழுவதிலும் கானானிலும் பஞ்சமும் கடும் துன்பமும் ஏற்பட்டன; நம் தந்தையருக்கு[a] உணவு கிடைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் மூதாதையர்.” கிரேக்க மூலத்தில் “நம் தந்தையர்” என்று உள்ளது; இது இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ λιμὸς
  choice: பஞ்சம் ஏற்பட்டது
  rationale: λιμός என்பது பரவலான உணவுப் பற்றாக்குறையைக் குறிக்கிறது; ἦλθεν இங்கு நிகழ்வைச் சுட்டும் வழக்குப் பயன்பாடு. தமிழில் ‘பஞ்சம் ஏற்பட்டது’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது. δέ-ஐ தனிச் சொல்லால் மிகைப்படுத்தாமல் வாக்கியத்தின் தொடர்ச்சியில் உணர்த்தப்பட்டுள்ளது.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: எகிப்து முழுவதிலும் கானானிலும்
  rationale: ἐπί + accusative இங்கு புவியியல் பரப்பைக் குறிக்கிறது. இத்தமிழாக்கம் பஞ்சம் எகிப்து முழுவதையும் கானானையும் ஆட்கொண்ட பரப்பை இயல்பாகக் காட்டுகிறது.
- source_word: θλῖψις μεγάλη
  choice: கடும் துன்பம்
  rationale: பஞ்சத்துடன் வந்த மிகுந்த நெருக்கடியையும் வேதனையையும் குறிக்கிறது; இறுதிக்காலச் சிறப்புப் பொருளைத் தேவையின்றி ஏற்றாமல் வரலாற்றுச் சூழலுக்கு ஏற்ற பொதுவான சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: οὐχ ηὕρισκον
  choice: கிடைக்கவில்லை
  rationale: இறந்தகால imperfect வடிவம் நெருக்கடிக் காலம் முழுவதும் நீடித்த உணவின்மையைச் சுட்டுகிறது. தமிழில் ‘கிடைக்கவில்லை’ அந்தத் தொடர்ந்த நடைமுறை இயலாமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: χορτάσματα
  choice: உணவு
  rationale: உணவுப் பொருட்கள் அல்லது வாழ்வாதாரத்துக்கான உணவுச் சாமான்களைப் பொதுவாகக் குறிக்கிறது; ‘தானியம்’ என்பது தேவையற்ற அளவில் குறுகலானது.
- source_word: οἱ πατέρες ἡμῶν
  choice: நம் தந்தையர்
  rationale: கிரேக்கத்தின் ஆண்பால் உறவுமுறைச் சொல்லைத் தக்கவைத்து, இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கும் மீட்பு-வரலாற்றுச் சூழலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: முற்பிதாக்களைக் குறிக்கும் ஆண்பால் மூதாதை மொழி
  choice: நம் தந்தையர்
  alternative: நம் மூதாதையர்
  rationale: οἱ πατέρες ἡμῶν என்பது நேரடியாக ‘நம் தந்தையர்’ என்று கூறி இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது. பாலினத்தைக் பொதுமைப்படுத்தாமல் மூலத்தின் வடிவமும் வரலாற்றுச் சுட்டும் தக்கவைக்கப்பட்டுள்ளன; மாற்று இயல்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘எகிப்து முழுவதிலும் கானானிலும்’ என்பது புவியியல் பரப்பை இயல்பாகக் காட்டுகிறது; அரைப்புள்ளி பஞ்சம் மற்றும் துன்பத்தின் விளைவாக உணவு கிடைக்காத நிலையைத் தெளிவுபடுத்துகிறது.
