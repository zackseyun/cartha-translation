id: ACT.1.14
reference: Acts 1:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: ta
  text: இவர்கள் அனைவரும் பெண்களுடனும்[b], இயேசுவின் தாயாகிய மரியாளுடனும், அவருடைய சகோதரர்களுடனும்[c] ஒரே மனதுடன்[a] ஜெபத்தில் தொடர்ந்து உறுதியாக ஈடுபட்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒருமனப்பட்டு’ அல்லது ‘ஒரே நோக்கத்துடன்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஒரே இடத்தில் கூடுவதை மட்டுமல்ல, பகிரப்பட்ட நோக்கத்தையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பெண்களுடன்’ என்பதே நேரடி வடிவம். கிரேக்கத்தில் சுட்டுக் கட்டுரை இல்லை; எனினும், சீடர்களோடு தொடர்புடைய அறியப்பட்ட பெண்களின் குழுவை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘சகோதரர்கள்’ என்பது கிரேக்க ἀδελφοί என்ற சொல்லை மொழிபெயர்க்கிறது. இதை நெருங்கிய ஆண் உறவினர்கள் என்ற விரிவான பொருளிலும் சிலர் புரிந்துகொள்கிறார்கள்; அவர்களின் துல்லியமான குடும்ப உறவை இந்த இடத்தில் உரை குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: இவர்கள் அனைவரும்
  rationale: οὗτοι என்பதன் சுட்டுப்பொருளையும் πάντες என்பதன் முழுமையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: தொடர்ந்து உறுதியாக ஈடுபட்டுவந்தார்கள்
  rationale: நீடித்துச் சென்ற செயலைக் காட்டும் சுற்றுவழி இறந்தகால அமைப்பையும், προσκαρτερέω குறிக்கும் விடாமுயற்சி மற்றும் அர்ப்பணிப்பையும் வெளிப்படுத்துகிறது.
- source_word: ὁμοθυμαδόν
  choice: ஒரே மனதுடன்
  rationale: வெறுமனே ஒரே இடத்தில் கூடியிருப்பதைவிட, பகிரப்பட்ட நோக்கத்தையும் உள்ளார்ந்த ஒருமைப்பாட்டையும் குறிக்கிறது.
- source_word: τῇ προσευχῇ
  choice: ஜெபத்தில்
  rationale: προσκαρτερέω உடன் வரும் வேற்றுமையை இயல்பான தமிழில் தொடர்ச்சியான ஜெப ஈடுபாடாகத் தருகிறது; கிரேக்கக் கட்டுரைக்கு தமிழில் தனி இணை இல்லை.
- source_word: σὺν γυναιξίν
  choice: பெண்களுடனும்
  rationale: σύν குறிக்கும் உடனிருப்பை நேரடியாகக் காட்டுகிறது. கிரேக்கத்தில் கட்டுரை இல்லாததால், தமிழில் தேவையற்ற வகையில் குழுவை வரையறுக்கவில்லை.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: இயேசுவின் தாயாகிய மரியாள்
  rationale: அடைமொழி உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; மரியாள் என்பது தமிழில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: அவருடைய சகோதரர்களுடனும்
  rationale: இலக்கண ரீதியாக ஆண்பால் பன்மையில் உள்ள ἀδελφοί என்பதற்கு நெருக்கமான மொழிபெயர்ப்பு; அவர்களின் துல்லியமான குடும்ப உறவை உரை கூறுவதைக் கடந்துத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: இயேசுவின் ἀδελφοί யார் என்பது
  choice: அவருடைய சகோதரர்கள்
  alternative: அவருடைய நெருங்கிய உறவினர்கள் அல்லது குடும்பத்தார்
  rationale: ἀδελφοί என்பதன் வழக்கமான பொருள் ‘சகோதரர்கள்.’ ஆனால் அவர்கள் இயேசுவுடன் கொண்டிருந்த துல்லியமான குடும்ப உறவைப் பற்றிய மரபுசார் விவாதத்தை மொழிபெயர்ப்பு தீர்த்துவைக்காமல், மூலச்சொல்லின் இயல்பான பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஜெபம்,’ ‘ஒரே மனதுடன்,’ ‘ஈடுபட்டுவந்தார்கள்’ ஆகியவை திருச்சபைச் சூழலில் பழக்கமானவையாக இருந்தாலும் தற்போதைய இயல்பான தமிழுக்கும் ஏற்றவை. வாக்கிய வரிசை தமிழின் இயல்புக்காக மாற்றப்பட்டாலும், உடனிருந்த மூன்று குழுக்களும் மூல வரிசையில் வைக்கப்பட்டுள்ளன.
