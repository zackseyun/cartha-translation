source:
  edition: SBLGNT
  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: ta
  text: இந்த ஊழியத்திற்கும் அப்போஸ்தலப் பணிக்கும் உரிய இடத்தை ஏற்றுக்கொள்ளும்படி; யூதாஸ் அதிலிருந்து விலகி, தனக்குரிய இடத்திற்குச் செல்வதற்கு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβεῖν
  choice: ஏற்றுக்கொள்வதற்காக
  rationale: சூழலில் காலியாகிய பொறுப்பை ஒருவர் ஏற்றுக்கொள்வதைக் குறிக்கிறது. நோக்கம்/வேண்டுதலின் உள்ளடக்கத்தைத் தெரிவிக்கும் வினையெச்சத்தின் தன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: τὸν τόπον
  choice: இடத்தை
  rationale: சொல்லின் அடிப்படைப் பொருளான ‘இடம்’ என்பதைக் காத்து, இங்கு அது பணி அல்லது பொறுப்பிலுள்ள இடத்தைக் குறிக்கும்படி அமைக்கப்பட்டுள்ளது; வசனத்தின் இறுதியில் மீண்டும் வரும் ‘இடம்’ என்பதுடனான கருத்து எதிரொலியும் தொடர்கிறது.
- source_word: διακονίας
  choice: ஊழியத்திலும்
  rationale: ஒப்படைக்கப்பட்ட சேவையைக் குறிக்கும் திருச்சபைச் சூழலில் ‘ஊழியம்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: ἀποστολῆς
  choice: அப்போஸ்தலப் பணியிலும்
  rationale: பொதுவான அனுப்புதல் அல்லது பயணம் என்பதைக் காட்டிலும், இங்கு அப்போஸ்தலருக்குரிய பணி மற்றும் பொறுப்பே குறிக்கப்படுகிறது.
- source_word: ἀφ’ ἧς
  choice: அதிலிருந்து
  rationale: முன்னர் கூறப்பட்ட ஊழியத்தையும் அப்போஸ்தலப் பணியையும் பின்னோக்கிச் சுட்டி, யூதாஸ் அவற்றிலிருந்து விலகியதைக் காட்டுகிறது.
- source_word: παρέβη
  choice: விலகி
  rationale: இங்கு நியமிக்கப்பட்ட பணியிலிருந்து வழுவுதல் அல்லது நீங்குதல் என்ற பொருள் பொருத்தமானது. ‘மீறினான்’ போன்ற அதிக சட்டநுட்பமான சொல்லைத் தவிர்த்து மூலத்தின் பொருள் விரிவைத் தக்கவைக்கிறது.
- source_word: πορευθῆναι
  choice: சென்றான்
  rationale: πορεύομαι என்பதன் எளிய இயக்கப் பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: தனக்குரிய இடத்திற்குச்
  rationale: சுருக்கமானதும் கருத்துச் செறிவுடையதுமான கிரேக்கத் தொடரைப் பாதுகாக்கிறது; அது மரணம், கல்லறை அல்லது தண்டனைக்குரிய இடம் என்று பிரதான உரையிலேயே தீர்மானிக்கவில்லை.
theological_decisions:
- issue: யூதாஸின் ‘தனக்குரிய இடம்’ எதைக் குறிக்கிறது?
  choice: பிரதான உரையில் ‘தனக்குரிய இடம்’ என்ற தெளிவுபடுத்தப்படாத சொற்றொடரைத் தக்கவைத்தல்.
  alternative: அதை மரணம்/கல்லறை, நியாயத்தீர்ப்பின் இடம் அல்லது யூதாஸுக்குப் பொருத்தமான இடம் என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கச் சொற்றொடர் அந்த இடத்தைத் தெளிவாக வரையறுக்கவில்லை. எனவே மூலத்தில் உள்ள இறையியல் பதற்றத்தையும் பொருள் தெளிவின்மையையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இடம்’ என்ற உருவகம் வசனத்தின் இரு பகுதிகளிலும் காக்கப்பட்டுள்ளது; ‘அப்போஸ்தலப் பணி’ என்பது தேவையற்ற சமயப்பிரிவு சார்ந்த தொழில்நுட்பச் சொல்லாக்கமின்றி ἀποστολή என்பதன் சூழற்பொருளைத் தருகிறது.
