revisions:
- from: எனவே, இவன் அநீதியின் கூலியால் ஒரு நிலத்தைப் பெற்றுக்கொண்டான்[a]. பின்பு தலைகுப்புற விழுந்து, நடுவில் பிளந்து வெடித்தான்[b]; அவனுடைய குடல்கள் அனைத்தும் வெளியே சிந்தின.
  to: எனவே, இந்த மனிதன் அநீதியின் கூலியால் ஒரு நிலத்தைப் பெற்றான்[a]. பின்பு தலைகுப்புற விழுந்து, நடுவில் வெடித்தான்[b]; அவனுடைய உள்ளுறுப்புகள் அனைத்தும் வெளியே கொட்டின.
