source:
  edition: SBLGNT
  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: ta
  text: எனவே, இந்த மனிதன் அநீதியின் கூலியால் ஒரு நிலத்தைப் பெற்றான்[a]. பின்பு தலைகுப்புற விழுந்து, நடுவில் வெடித்தான்[b]; அவனுடைய உள்ளுறுப்புகள் அனைத்தும் வெளியே கொட்டின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீச்செயலின் பலனால்.” கிரேக்கச் சொற்றொடர் “அநீதியின் கூலியிலிருந்து” என்பதற்கு நெருக்கமாக உள்ளது. “பெற்றான்” என்பது நிலம் அவனுடன் தொடர்புடைய பணத்தால் உடைமையானதைக் குறிக்கலாம்; அவனே அதை நேரடியாக வாங்கினான் என்று கட்டாயமாகப் பொருள்படாது.
    reason: lexical_alternative
  - marker: b
    text: “முகங்குப்புற ஆனபோது” அல்லது “முகங்குப்புற விழுந்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் தலைமுன் அல்லது குப்புற நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: எனவே, இவன்
  rationale: Οὗτος முன் குறிப்பிடப்பட்ட யூதாசைக் குறிக்கிறது; μέν οὖν உரையின் தொடர்ச்சியையும் விளைவுத் தொடர்பையும் காட்டுவதால், இயல்பான தமிழில் ‘எனவே’ என்று தரப்பட்டுள்ளது.
- source_word: ἐκτήσατο
  choice: பெற்றுக்கொண்டான்
  rationale: κτάομαι என்பது ஒன்றைப் பெறுதல் அல்லது உடைமையாக்குதல் என்று பரந்த பொருள் தருகிறது. ‘வாங்கினான்’ என்று மொழிபெயர்த்து யூதாஸ் நேரடியாக வாங்கியதாகக் குறுக்காமல், கிரேக்கத்தின் தெளிவின்மையை இது காக்கிறது.
- source_word: χωρίον
  choice: ஒரு நிலம்
  rationale: χωρίον ஒரு வயல் அல்லது நிலப்பகுதியைக் குறிக்கலாம். இங்கு ‘ஒரு நிலம்’ என்பது இயல்பாகவும் பொருளில் போதிய பரப்புடனும் உள்ளது.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: அநீதியின் கூலியால்
  rationale: μισθός கூலி அல்லது பலன் என்றும், ἀδικία அநீதி அல்லது தீச்செயல் என்றும் பொருள்படும். ‘அநீதியின் கூலி’ என்ற உருவகமான, அறநெறி வலிமையுள்ள சொற்றொடரை வைத்துக்கொண்டு, ἐκ-ஐ தமிழில் இயல்பாகக் காரணம்/வழிமுறை காட்டும் ‘-ஆல்’ மூலம் தருகிறது.
- source_word: πρηνὴς γενόμενος
  choice: தலைகுப்புற விழுந்து
  rationale: πρηνής தலைமுன் அல்லது முகங்குப்புற நிலையைச் சுட்டுகிறது. அடுத்த நிகழ்வுக்கு வழிவகுக்கும் வீழ்ச்சியைத் தெளிவாகவும் இயல்பாகவும் ‘தலைகுப்புற விழுந்து’ தெரிவிக்கிறது.
- source_word: ἐλάκησεν μέσος
  choice: நடுவில் பிளந்து வெடித்தான்
  rationale: λακάω பிளந்து அல்லது வெடித்துத் திறப்பதைக் குறிக்கிறது; μέσος இங்கு உடலின் நடுப்பகுதியைக் குறிக்கிறது. இரு கூறுகளையும் தெளிவாகப் பாதுகாக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐξεχύθη
  choice: வெளியே சிந்தின
  rationale: ἐκχέω வெளியே ஊற்றப்படுதல் அல்லது சிந்தப்படுதலைக் குறிக்கிறது. உட்பாகங்கள் வெளியேறிய நிகழ்வுக்கு ‘வெளியே சிந்தின’ இயல்பான நவீனத் தமிழ்.
- source_word: πάντα τὰ σπλάγχνα αὐτοῦ
  choice: அவனுடைய குடல்கள் அனைத்தும்
  rationale: σπλάγχνα உடலின் உள்ளுறுப்புகள் அல்லது குடல்களைக் குறிக்கிறது. இச்சூழலில் ‘குடல்கள்’ தெளிவான, நேரடியான சொல்லாகும்.
theological_decisions:
- issue: யூதாசுக்கும் நிலம் பெறப்பட்டதற்கும் உள்ள தொடர்பு
  choice: ἐκτήσατο என்பதை ‘பெற்றுக்கொண்டான்’ என்று மொழிபெயர்த்து, நிலம் அவனுக்கு உடைமையானது எனக் கூறினாலும் அது எவ்வாறு நிகழ்ந்தது என்பதைத் திட்டவட்டமாக்கவில்லை.
  alternative: ‘நிலத்தை வாங்கினான்’ என்று மொழிபெயர்த்து யூதாஸ் நேரடியாக வாங்கியதாகக் கூறுதல்.
  rationale: கிரேக்க வினைச்சொல் நேரடியான கொள்முதலை மட்டும் கட்டாயப்படுத்துவதில்லை. மத்தேயு 27:5–8 உடனான தொடர்பை மொழிபெயர்ப்பிலேயே ஒத்திசைத்து முடிவுசெய்யாமல், மூல உரையின் பதற்றத்தையும் தெளிவின்மையையும் இது பாதுகாக்கிறது.
- issue: πρηνὴς γενόμενος விவரிக்கும் உடல்நிலை அல்லது இயக்கம்
  choice: சூழலுக்கேற்ற இயக்கமாக ‘தலைகுப்புற விழுந்து’ என்று தரப்பட்டுள்ளது.
  alternative: ‘முகங்குப்புற ஆனபோது’ அல்லது ‘குப்புறக் கிடந்தபோது’ என்று ஒரு நிலையை மட்டும் குறிப்பிடுதல்.
  rationale: πρηνής தலைமுன்/முகங்குப்புற நிலையைச் சுட்டலாம்; γενόμενος உடன் அது அடுத்த நிகழ்வுக்கு முன்னோடியான நிலைமாற்றமாகப் புரிந்துகொள்ளப்படலாம். அடிக்குறிப்பு மாற்று சாத்தியத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகமக் கண்ணியத்தைத் தக்கவைக்கும் நடையில் மொழிபெயர்க்கப்பட்டது. ‘அநீதியின் கூலி’ என்ற செறிவான மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘பெற்றுக்கொண்டான்’ என்பது தேவையற்ற ஒத்திசைவையோ நேரடி கொள்முதல் என்ற முடிவையோ தவிர்க்கிறது. நிகழ்வின் கடுமை மென்மையாக்கப்படாமல் தெளிவாகக் கூறப்பட்டுள்ளது.
