  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மேற்கோள் தமிழின் இயல்பான வாக்கிய வரிசையில் தரப்பட்டுள்ளது; கேள்வியின் இறையியல் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
