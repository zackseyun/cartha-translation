  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: ta
  text: ஆகவே, அவர்கள் ஒன்றுகூடியபோது, அவரிடம், “ஆண்டவரே, இந்தக் காலத்தில்தானா இஸ்ரவேலுக்கு அரசாட்சியை மீண்டும் நிலைநாட்டுகிறீர்?[a]” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலுக்காக அரசாட்சியை மீண்டும் நிலைநாட்டுகிறீர்?” கிரேக்க தத்திவேற்றுமையை நன்மையைக் குறிக்கும் வகையில் ‘இஸ்ரவேலுக்காக’ என்றும், இன்னும் நேரடியாக அரசாட்சியை ‘இஸ்ரவேலுக்கு’ மீட்டளிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: ஆகவே, அவர்கள் ஒன்றுகூடியபோது
  rationale: συνελθόντες என்னும் பங்கேற்புவினை கேள்வி எழுந்த காலச்சூழலைக் குறிக்கிறது. μὲν οὖν உரையாடலின் முன்னேற்றத்தைக் காட்டுவதால், நவீன தமிழில் இயல்பான ‘ஆகவே’ பயன்படுத்தப்பட்டது.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: அவரிடம் … என்று கேட்டார்கள்
  rationale: தமிழில் மேற்கோளைத் தொடர்ந்து ‘என்று கேட்டார்கள்’ என்பது இயல்பான அமைப்பு. ἠρώτων இறந்தகாலத் தொடர்ச்சியைச் சுட்டக்கூடியது என்றாலும், இங்கு எளிய நிகழ்வாக மொழிபெயர்ப்பது கதைநடைக்கு ஏற்றது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் மரியாதையையும் κύριος என்ற பட்டத்தின் இறையியல் கனத்தையும் ‘ஆண்டவரே’ தக்கவைக்கிறது.
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: இந்தக் காலத்தில்
  rationale: χρόνος ஒரு கணத்தை மட்டும் அல்லாமல் காலப்பகுதி அல்லது சந்தர்ப்பத்தைக் குறிக்கிறது; ‘இந்தக் காலத்தில்’ அதைத் தெளிவாகக் கொண்டுவருகிறது.
- source_word: ἀποκαθιστάνεις
  choice: மீண்டும் நிலைநாட்டப்போகிறீர்
  rationale: ἀποκαθίστημι முன்பிருந்த நிலைக்கு மீட்டமைத்தல் அல்லது மறுபடியும் நிறுவுதல் என்ற பொருளுடையது. கேள்வியின் உடன்நோக்கிய நிகழ்காலத்தைக் தமிழில் இயல்பாக ‘நிலைநாட்டப்போகிறீர்’ வெளிப்படுத்துகிறது.
- source_word: τὴν βασιλείαν
  choice: அரசாட்சியை
  rationale: βασιλεία ஆட்சி அல்லது அரசைக் குறிக்கலாம். இங்கு இஸ்ரவேலுடன் இணைந்த எதிர்பார்ப்பில் ‘அரசாட்சி’ என்பது ஆளுகை மற்றும் அரசியல் எதிர்பார்ப்பு ஆகிய இரண்டையும் தேவையின்றி குறுக்காமல் தக்கவைக்கிறது.
- source_word: τῷ Ἰσραήλ
  choice: இஸ்ரவேலுக்கு
  rationale: வேற்றுமை உருபான தத்திவை ‘இஸ்ரவேலுக்கு’ என்று நேரடியாகக் கொடுப்பது, ‘இஸ்ரவேலுக்காக’ என்ற நன்மைப் பொருளையும் ‘இஸ்ரவேலிடம்/இஸ்ரவேலுக்கு மீட்டளித்தல்’ என்ற பொருளையும் திறந்தவாறே வைத்திருக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் அரசாட்சியைப் பற்றிய சீடர்களின் எதிர்பார்ப்பின் தன்மை
  choice: ‘இஸ்ரவேலுக்கு அரசாட்சியை மீண்டும் நிலைநாட்டுதல்’ என்று கேள்வியை நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘இஸ்ரவேலுக்காக அரசாட்சியை மீண்டும் நிலைநாட்டுதல்’ அல்லது அதை முற்றிலும் அரசியல்/ஆவிக்குரியதாக விளக்குதல்
  rationale: இவ்வசனம் சீடர்களின் கேள்வியைப் பதிவுசெய்கிறது; அதிலுள்ள ஒவ்வொரு முன்கருத்தையும் இயேசு ஏற்றார் அல்லது மறுத்தார் என்று இங்கே தீர்மானிக்கவில்லை. எனவே வரலாற்று மற்றும் இறையியல் பதற்றம் விளக்கப் பராப்ரேஸால் தீர்க்கப்படவில்லை.
