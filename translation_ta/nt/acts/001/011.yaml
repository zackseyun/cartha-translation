id: ACT.1.11
reference: Acts 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: ta
  text: அவர்கள் மேலும், “கலிலேய ஆண்களே, நீங்கள் ஏன் வானத்தை நோக்கிப் பார்த்துக்கொண்டு நிற்கிறீர்கள்? உங்களிடமிருந்து வானத்திற்கு எடுத்துக்கொள்ளப்பட்ட இந்த இயேசு[a], வானத்திற்குப் போவதை நீங்கள் கண்ட அதே விதமாக வருவார்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரியமாக, “இதே இயேசு” என்றும் மொழிபெயர்க்கப்படுகிறது. கிரேக்க மூலத்தில் நேரடியாக “இந்த இயேசு” என்றே உள்ளது; “அதே” என்பது அவரது அடையாளத் தொடர்ச்சியை வலியுறுத்தும் விளக்க விரிவாக்கம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: கலிலேய ஆண்களே
  rationale: ஆண்பால் பன்மை அழைப்பான ἄνδρες என்பதையும் கலிலேயர் என்ற இன/பகுதி அடையாளத்தையும் நேரடியான விளிப்பாகப் பாதுகாக்கிறது.
- source_word: τί ἑστήκατε βλέποντες
  choice: நீங்கள் ஏன் வானத்தை நோக்கிப் பார்த்துக்கொண்டு நிற்கிறீர்கள்?
  rationale: ἑστήκατε என்பதன் நிகழ்நிலைப் பொருளை ‘நிற்கிறீர்கள்’ என்றும், உடனிகழும் βλέποντες செயலை ‘பார்த்துக்கொண்டு’ என்றும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν οὐρανόν
  choice: வானத்தை நோக்கி / வானத்திற்கு
  rationale: முதல் இடத்தில் பார்வையின் திசையை ‘வானத்தை நோக்கி’ என்றும், இயேசுவின் மேலே எடுத்துக்கொள்ளப்படுதலையும் செல்லுதலையும் ‘வானத்திற்கு’ என்றும் சூழலுக்கேற்ற தமிழில் தருகிறது.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: இந்த இயேசு
  rationale: οὗτος என்ற சுட்டுப்பெயரை நேரடியாகப் பிரதிபலிக்கிறது; மூலத்தில் இல்லாத ‘அதே’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: உங்களிடமிருந்து வானத்திற்கு எடுத்துக்கொள்ளப்பட்ட
  rationale: இறைவினைப் passive வடிவையும் சீடர்களிடமிருந்து பிரிக்கப்பட்டதையும், சூழலில் உள்ள மேல்நோக்கிய இயக்கத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: நீங்கள் கண்ட அதே விதமாக வருவார்
  rationale: οὕτως மற்றும் ὃν τρόπον இணைந்து தெரிவிக்கும் முறைசார் ஒப்புமையை இயல்பான தமிழில், தேவையற்ற மறுபடியும் கூறுதல் இல்லாமல் பாதுகாக்கிறது.
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: வானத்திற்குப் போவதை நீங்கள் கண்ட
  rationale: θεάομαι என்பதற்கு மிகைப்படுத்தாத ‘கண்ட’ என்பதையும், πορεύομαι என்பதற்கு எளிய ‘போவதை’ என்பதையும் பயன்படுத்தி நேரில் கண்ட நிகழ்வைத் தெரிவிக்கிறது.
theological_decisions:
- issue: விண்ணேற்றம் மற்றும் திரும்பிவருதல் சூழலில் οὐρανός என்பதன் பொருள்
  choice: வானம்
  alternative: வானவெளி / ஆகாயம்
  rationale: οὐρανός என்பது காணக்கூடிய ஆகாயத்தையும் குறிக்கலாம்; எனினும் இங்கு இயேசுவின் விண்ணேற்றமும் வருகையும் பற்றிய கதைச்சூழல் ‘வானம்’ என்ற ஆன்மிகமும் திசைசார்ந்ததுமான பொருளை ஆதரிக்கிறது. தமிழ் ‘வானம்’ இரு பரிமாணங்களையும் அளவுக்கு மீறித் தீர்மானிக்காமல் தாங்குகிறது.
- issue: οὗτος ὁ Ἰησοῦς என்பதில் அடையாளத்தை எவ்வாறு வெளிப்படுத்துவது
  choice: இந்த இயேசு
  alternative: இதே இயேசு
  rationale: கிரேக்கத்தில் ‘இந்த’ என்ற சுட்டு வெளிப்படையாக உள்ளது; ‘அதே’ என்ற தனிச்சொல் இல்லை. ஆகவே நேரடியான வடிவம் முதன்மை உரையில் வைக்கப்பட்டு, அடையாளத் தொடர்ச்சியை வலியுறுத்தும் பாரம்பரிய விரிவாக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இயேசுவின் வருகையின் ஒப்புமை
  choice: அதே விதமாக வருவார்
  alternative: இவ்வாறே வருவார்
  rationale: உரை வருகையின் ‘விதத்தை’ அவர் சென்றதைச் சீடர்கள் கண்ட விதத்துடன் ஒப்பிடுகிறது. அந்த ஒப்புமையைப் பாதுகாக்கிறது; ஆனால் அது குறிக்கும் ஒவ்வொரு விவரத்தையும் விளக்கி நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கலிலேய ஆண்களே’ என்பது மூலத்தின் ஆண்பால் அழைப்பைத் தக்கவைக்கிறது. ‘பார்த்துக்கொண்டு நிற்கிறீர்கள்’ என்பது இரு கிரேக்க வினை வடிவங்களையும் இயல்பாக இணைக்கிறது; ‘வானம்’ என்பது சூழலின் காணக்கூடிய மற்றும் இறையியல் பரிமாணங்களைத் திறந்தவாறே வைக்கிறது.
