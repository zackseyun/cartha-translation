id: ACT.1.2
reference: Acts 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: ta
  text: அவர் தேர்ந்தெடுத்திருந்த அப்போஸ்தலர்களுக்குப் பரிசுத்த ஆவியின் மூலமாகக் கட்டளையிட்ட பின்பு, அவர் எடுத்துக்கொள்ளப்பட்ட நாள் வரை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்த ஆவியால் ... கட்டளையிட்ட பின்பு.’ கிரேக்கச் சொற்றொடரில் வழிமுறை அல்லது செயற்பாட்டு முகமையைக் குறிக்க ‘மூலமாக’ அல்லது ‘ஆல்’ என மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: நாள் வரைக்கும்
  rationale: இது முந்தைய வசனத்தில் தொடங்கிய கால எல்லையைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் கிரேக்கச் சொற்றொடரின் கால முடிவையும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἐντειλάμενος
  choice: கட்டளைகள் கொடுத்த பின்பு
  rationale: இறந்தகாலப் பங்கேற்புவினை, எடுத்துக்கொள்ளப்படுவதற்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. ‘கட்டளைகள்’ என்பது ἐντέλλομαι என்பதன் வலிமையைத் தக்கவைக்கிறது.
- source_word: τοῖς ἀποστόλοις
  choice: அப்போஸ்தலர்களுக்கு
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகளில் இயேசுவால் நியமிக்கப்பட்ட இந்தக் குழுவுக்கான நிலைபெற்ற, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ்ச் சொல்.
- source_word: διὰ πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியின் மூலமாக
  rationale: διά + உரிமை வேற்றுமை இங்கு வழிமுறை அல்லது செயலாண்மையைக் குறிக்கலாம். ‘மூலமாக’ என்பது அந்த உறவை அதிகமாக விளக்காமல் தக்கவைக்கிறது.
- source_word: οὓς ἐξελέξατο
  choice: அவர் தேர்ந்தெடுத்திருந்த
  rationale: அப்போஸ்தலர்கள் முன்பே தேர்ந்தெடுக்கப்பட்டிருந்ததை இது இயல்பான தமிழில் தெரிவிக்கிறது; நடுவினை வடிவத்தின் நுணுக்கத்தை செயற்கையாக விரிவாக்கவில்லை.
- source_word: ἀνελήμφθη
  choice: எடுத்துக்கொள்ளப்பட்ட
  rationale: செயப்பாட்டு வடிவத்தையும் நேரடியான சொற்பொருளையும் காக்கிறது. இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘பரலோகத்திற்கு’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவின் கட்டளைகளுக்கும் பரிசுத்த ஆவிக்கும் இடையிலான உறவு
  choice: இயேசு பரிசுத்த ஆவியின் மூலமாக அப்போஸ்தலர்களுக்குக் கட்டளைகள் கொடுத்தார்.
  alternative: இயேசு பரிசுத்த ஆவியால் அப்போஸ்தலர்களுக்குக் கட்டளைகள் கொடுத்தார்.
  rationale: διὰ πνεύματος ἁγίου என்பது இயல்பாக ἐντειλάμενος என்பதுடன் இணைந்து, கட்டளைகள் கொடுக்கப்பட்ட வழிமுறை அல்லது செயலாண்மையைக் குறிக்கிறது. ‘மூலமாக’ என்பது கிரேக்கத்தில் உள்ள நுண்ணிய திறப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க இயல்பானதும் மரியாதைமிக்கதுமான நடை பயன்படுத்தப்பட்டுள்ளது. இது வசனம் 1-ல் தொடங்கிய வாக்கியத்தின் தொடர்ச்சி என்பதால், இறுதியில் அதன் சார்பு அமைப்பு தக்கவைக்கப்பட்டுள்ளது.
