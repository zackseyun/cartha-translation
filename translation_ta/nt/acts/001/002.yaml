revisions:
- from: அவர் தேர்ந்தெடுத்திருந்த அப்போஸ்தலர்களுக்குப் பரிசுத்த ஆவியின் மூலமாகக் கட்டளைகள் கொடுத்த பின்பு, எடுத்துக்கொள்ளப்பட்ட நாள் வரைக்கும்[a].
  to: அவர் தேர்ந்தெடுத்திருந்த அப்போஸ்தலர்களுக்குப் பரிசுத்த ஆவியின் மூலமாகக் கட்டளையிட்ட பின்பு, அவர் எடுத்துக்கொள்ளப்பட்ட நாள் வரை[a].
  rationale: The revision resolves the awkward Tamil word order while preserving the Greek syntax and its ambiguity concerning διά with the genitive. It retains the passive “was taken up,” does not add a destination, and leaves the verse as a dependent continuation of verse 1.
