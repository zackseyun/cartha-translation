  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: ta
  text: அவர் சென்றுகொண்டிருந்தபோது, அவர்கள் வானத்தை[a] உற்றுப் பார்த்துக்கொண்டிருந்தார்கள். இதோ, வெள்ளை ஆடைகள்[b] அணிந்த இரண்டு ஆண்கள் அவர்களருகே நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரலோகத்தை.” கிரேக்கச் சொல் “வானம்” அல்லது “பரலோகம்” என இருவகையிலும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வெள்ளை உடைகள்” அல்லது “வெள்ளை அங்கிகள்.” கிரேக்கச் சொல் பொதுவாக ஆடைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: உற்றுப் பார்த்துக்கொண்டிருந்தார்கள்
  rationale: வெறுமனே பார்ப்பதையல்ல, நிலையாகவும் கூர்ந்த கவனத்தோடும் தொடர்ந்து பார்ப்பதை இந்த வினையெச்சம் குறிக்கிறது.
- source_word: οὐρανόν
  choice: வானத்தை
  rationale: οὐρανός என்பதற்கு ‘வானம்’ என்றும் ‘பரலோகம்’ என்றும் பொருள் வரலாம். இங்கு கண்ணால் மேல்நோக்கிப் பார்க்கும் காட்சியை இயல்பாகச் சொல்ல ‘வானம்’ தேர்ந்தெடுக்கப்பட்டது; ஏறிச்செல்லும் நிகழ்வின் பரலோகப் பரிமாணத்தை அடிக்குறிப்பு திறந்தவையாக வைத்திருக்கிறது.
- source_word: πορευομένου αὐτοῦ
  choice: அவர் சென்றுகொண்டிருந்தபோது
  rationale: இந்த genitive absolute அமைப்பு, அவர் சென்ற செயலும் அவர்கள் பார்த்த செயலும் ஒரே நேரத்தில் நிகழ்ந்ததைத் தெரிவிக்கிறது; ‘சென்றுகொண்டிருந்தபோது’ அந்தத் தொடர்ச்சியைக் காக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: அடுத்து நிகழ்வதற்குக் கவனத்தை ஈர்க்கும் உரைக் குறியாகிய ἰδού என்பதன் தனித்துவத்தையும் கதைநடையின் வலிமையையும் ‘இதோ’ இயல்பாகக் காக்கிறது.
- source_word: ἄνδρες δύο
  choice: இருவர்
  rationale: தமிழில் மனிதர்களைக் குறிக்கும் எண்ணிக்கையுடன் ‘இருவர்’ இயல்பானது. சூழலில் அவர்கள் ஆண்கள் என்பது புரிகிறது; அவர்களை இந்த வசனமே வெளிப்படையாக ‘தேவதூதர்கள்’ என்று அழைக்காததால் அந்த அடையாளம் சேர்க்கப்படவில்லை.
- source_word: παρειστήκεισαν
  choice: அவர்களருகே நின்றார்கள்
  rationale: இங்கு வினைச்சொல் சீடர்களின் அருகில் அவர்கள் நின்றிருந்ததைச் சொல்கிறது. ‘தோன்றினார்கள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்க்கும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: ἐσθήσεσι λευκαῖς
  choice: வெண்ணிற ஆடைகள் அணிந்த
  rationale: ἐσθής என்பது குறிப்பிட்ட வகை அங்கியையல்ல, பொதுவாக ஆடையைக் குறிக்கிறது. ஆகவே ‘ஆடைகள்’ என்பது இயல்பாகவும் அளவுக்கு மீறிய குறிப்பின்றியும் உள்ளது.
theological_decisions:
- issue: ஏறிச்செல்லும் சூழலில் οὐρανός என்பதன் மொழிபெயர்ப்பு
  choice: வானம்
  alternative: பரலோகம்
  rationale: இந்த இடத்தில் சீடர்கள் மேல்நோக்கிப் பார்க்கும் கண்கூடான காட்சி முன்னிலையில் இருப்பதால் ‘வானம்’ இயல்பான தமிழாகிறது. அதே கிரேக்கச் சொல் ‘பரலோகம்’ என்றும் பொருள்படக்கூடியதால், ஏறிச்செல்லும் நிகழ்வின் இறையியல் பரிமாணத்தை மறுக்காமல் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: அந்த இருவரின் அடையாளம்
  choice: இருவர்
  alternative: இரண்டு தேவதூதர்கள்
  rationale: இந்த வசனத்தின் கிரேக்கம் அவர்களை ‘இரண்டு ஆண்கள்’ என்றே குறிப்பிடுகிறது; ‘தேவதூதர்கள்’ என்று வெளிப்படையாகச் சொல்லவில்லை. எனவே சூழல் உணர்த்தக்கூடிய அடையாளத்தை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் வெளிப்படையான வர்ணனை பாதுகாக்கப்படுகிறது.
