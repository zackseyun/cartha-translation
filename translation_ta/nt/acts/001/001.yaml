  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: ta
  text: தெயோப்பிலுவே, இயேசு செய்யவும் கற்பிக்கவும் தொடங்கிய எல்லாவற்றைக் குறித்து முதல் விவரத்தை எழுதினேன்.[a]
  philosophy: optimal-equivalence
