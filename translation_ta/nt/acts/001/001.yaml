    text: அல்லது, ‘முந்தைய விவரத்தை’ அல்லது ‘முதல் நூலை.’
    reason: λόγος மற்றும் πρῶτον ஆகியவற்றின் சூழற்பொருளைத் தமிழில் வெளிப்படுத்தக்கூடிய நியாயமான மாற்று மொழிபெயர்ப்புகள்.
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: முதல் பதிவை
  rationale: λόγος இங்கு ஒரு தனிச் ‘சொல்’ அல்ல; லூக்கா எழுதிய முந்தைய நூலாகிய விவரப் பதிவைக் குறிக்கிறது. πρῶτον என்பதன் வரிசைப் பொருளை ‘முதல்’ காக்கிறது; μέν தொடங்கும் உரையாடல் அமைப்பு தமிழில் தனிச் சொல்லால் வெளிப்படுத்தப்படாமல், வாக்கியத்தின் தொடர்ச்சிச் சூழலில் இயல்பாக விடப்பட்டுள்ளது.
- source_word: ἐποιησάμην
  choice: எழுதினேன்
  rationale: λόγος என்பதுடன் சேர்ந்துள்ள இவ்வினைச்சொல், ஒரு எழுத்துப் படைப்பை உருவாக்குதல் என்ற சூழற்பொருளைக் கொண்டுள்ளது; நவீன தமிழில் ‘எழுதினேன்’ தெளிவும் இயல்பும் உடையது.
- source_word: περὶ πάντων ... ὧν
  choice: அனைத்தையும் குறித்து
  rationale: περί உடன் வரும் இத்தொடர் பொருள் அல்லது கருப்பொருளைக் குறிக்கிறது. ‘அனைத்தையும் குறித்து’ என்பது கிரேக்கத் தொடரின் தொடர்பை இயல்பான தமிழில் காக்கிறது; லூக்காவின் விவரிப்பு எல்லைக்கு அப்பாற்பட்ட முழுமையை வலியுறுத்தவில்லை.
- source_word: ὦ Θεόφιλε
  choice: தெயோப்பிலுவே
  rationale: ὦ நேரடி விளிப்பைக் குறிக்கிறது. தமிழின் விளிவேற்றுமை ‘-வே’ இதை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘அன்புள்ள’ போன்ற நெருக்கச் சொல்லைச் சேர்க்கவில்லை.
- source_word: ἤρξατο
  choice: தொடங்கிய
  rationale: ‘தொடங்கினார்’ என்ற வெளிப்படையான பொருளை இது காக்கிறது. அப்போஸ்தலர் பணிகள் நூலில் இயேசுவின் செயல் தொடர்வதாக இருக்கலாம் என்ற உட்குறிப்பை விளக்கமாகச் சேர்க்காமல் அப்படியே விடுகிறது.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: செய்யவும் கற்பிக்கவும்
  rationale: τε καί இணை அமைப்பு தமிழில் இரு வினைகளுக்கும் ‘-வும்’ சேர்த்து வெளிப்படுத்தப்பட்டுள்ளது. ποιεῖν என்பதன் பரந்த பொருளை ‘செய்ய’ காக்கிறது; இயேசுவின் செயல்களையும் போதனையையும் வேறுபடுத்தியும் இணைத்தும் காட்டுகிறது.
theological_decisions:
- issue: ἤρξατο (‘தொடங்கிய’) என்பது அப்போஸ்தலர் பணிகள் நூலில் இயேசுவின் பணி தொடர்வதை உட்குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘தொடங்கிய’ என்பதைத் தக்கவைத்து, அதன் உட்குறிப்பை விளக்கிச் சேர்க்கவில்லை.
  alternative: ‘இயேசு செய்ததும் கற்பித்ததுமான அனைத்தையும்’ என்று மொழிபெயர்ப்பது, அல்லது அவர் அப்போஸ்தலர்கள் வழியாகத் தொடர்ந்தார் என்று விரித்துரைப்பது.
  rationale: கிரேக்க உரை வெளிப்படையாக ‘தொடங்கினார்’ என்று கூறுகிறது. அது இயேசுவின் பணி தொடர்வதைச் சுட்டலாம்; ஆனால் மொழிபெயர்ப்பு அந்த இறையியல் உட்குறிப்பை நீக்கவோ விரிவுரையால் தீர்மானிக்கவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் நேரடி விளிப்பு, ‘தொடங்கிய’ என்பதன் இறையியல் திறந்தநிலை, செயலும் கற்பித்தலும் இணையும் அமைப்பு ஆகியவை காக்கப்பட்டுள்ளன.
