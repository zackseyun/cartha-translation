id: ACT.1.9
reference: Acts 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: ta
  text: அவர் இவற்றைச் சொன்ன பின்பு, அவர்கள் பார்த்துக்கொண்டிருக்கும்போதே அவர் மேலே உயர்த்தப்பட்டார்[a]. ஒரு மேகம் அவரை அவர்களுடைய பார்வையிலிருந்து எடுத்துக்கொண்டது[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலே எடுத்துக்கொள்ளப்பட்டார்.”
    reason: lexical_alternative
  - marker: b
    text: “எடுத்துக்கொண்டது” என்பதற்கு “ஏற்றுக்கொண்டது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: வேதாகமத்தின் வேறு சில நிகழ்வுகளில் மேகம் கடவுளின் பிரசன்னத்தைக் குறிக்கிறது. இங்கும் அந்தப் பின்னொலி இருக்கலாம்; ஆனால் இவ்வசனம் அதை வெளிப்படையாகக் கூறவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: பின்பு
  rationale: எளிய கதைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வாக்கியத்தின் தொடக்கத்தில் தனியாக ‘மேலும்’ எனச் சேர்ப்பதைவிட, பங்கேற்புச் சொல்லோடு இணைந்து நிகழ்வுகளின் தொடர்ச்சியைத் தெளிவாக்குகிறது.
- source_word: ταῦτα εἰπὼν
  choice: அவர் இவற்றைச் சொன்ன பின்பு
  rationale: ταῦτα என்ற பன்மைச் சுட்டுப்பெயரையும், முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்புச் சொல்லையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: βλεπόντων αὐτῶν
  choice: அவர்கள் பார்த்துக்கொண்டிருக்கும்போதே
  rationale: Genitive absolute அமைப்பு குறிக்கும் உடனிகழ்ச்சியையும், அவர்கள் நேரில் பார்த்துக்கொண்டிருந்தார்கள் என்ற தொடர்ச்சியான செயலையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐπήρθη
  choice: மேலே உயர்த்தப்பட்டார்
  rationale: இறைச்செயப்பாட்டை வெளிப்படையாக அடையாளப்படுத்தாமல் கிரேக்கச் செயல்பாட்டு வினையின் passive வடிவத்தையும் மேல்நோக்கிய நகர்வையும் பாதுகாக்கிறது.
- source_word: νεφέλη
  choice: ஒரு மேகம்
  rationale: கட்டுரைச் சொல் இல்லாத ஒருமை பெயர்ச்சொல்லை நேரடியாகத் தருகிறது; மேகத்துக்கு முதன்மை உரையில் வெளிப்படையான இறைத்தோற்றப் பொருளைச் சேர்க்கவில்லை.
- source_word: ὑπέλαβεν
  choice: எடுத்துக்கொண்டது
  rationale: ‘எடுத்துக்கொள்/ஏற்றுக்கொள்’ என்ற வினையின் பரப்பை ஓரளவு பாதுகாத்து, மேகம் அவரை அவர்களின் பார்வைக்கு அப்பால் கொண்டுசென்றதைச் சொல்கிறது.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: அவர்களுடைய பார்வையிலிருந்து
  rationale: ‘அவர்களுடைய கண்களிலிருந்து’ என்ற சொற்சொல் வடிவத்தைவிட, காண முடியாதபடி அகன்றார் என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐπήρθη என்பதைக் பாரம்பரிய விண்ணேற்றச் சூத்திரமாக மொழிபெயர்ப்பதா
  choice: மேலே உயர்த்தப்பட்டார்
  alternative: மேலே எடுத்துக்கொள்ளப்பட்டார்
  rationale: காணக்கூடிய மேல்நோக்கிய நகர்வையும் passive வடிவத்தையும் பாதுகாக்கிறது; பின்னாளைய கோட்பாட்டுச் சொற்றொடரை முதன்மை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: νεφέλη என்பதில் இறைப் பிரசன்னத்தின் அடையாளத்தை வெளிப்படையாகச் சேர்ப்பதா
  choice: ஒரு மேகம்
  alternative: இறைப் பிரசன்னத்தைக் குறிக்கும் மேகம்
  rationale: வேதாகமத்தின் பிற இடங்களில் மேகம் இறைப் பிரசன்னத்தோடு தொடர்புடையதாக இருக்கலாம்; ஆனால் இவ்வசனம் அதை வெளிப்படையாகக் கூறாததால், சாத்தியமான ஒலிப்பை அடிக்குறிப்பில் மட்டும் குறிப்பிடுகிறது.
- issue: ὑπέλαβεν என்பதின் ‘எடுத்துக்கொண்டது/ஏற்றுக்கொண்டது’ என்ற நுணுக்கம்
  choice: எடுத்துக்கொண்டது
  alternative: ஏற்றுக்கொண்டது
  rationale: ‘ஏற்றுக்கொண்டது’ என்பது வரவேற்பு அல்லது ஒப்புதல் என்ற தவறான நவீன பொருளைத் தூண்டக்கூடும்; ‘எடுத்துக்கொண்டது’ சூழலில் நிகழும் பார்வையிலிருந்து அகற்றுதலைத் தெளிவாகத் தருகிறது, அதேவேளையில் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பார்த்துக்கொண்டிருக்கும்போதே’ என்பது நிகழ்வின் நேரடிச் சாட்சித்தன்மையை இயல்பாக வலியுறுத்துகிறது. ‘எடுத்துக்கொண்டது’ என்ற சற்றே குறிப்பிடத்தக்க மேகச் செயற்பாடு, மூலத்தின் உருவகத் தீவிரத்தை மென்மையாக்காமல் பாதுகாக்கப்படுகிறது.
