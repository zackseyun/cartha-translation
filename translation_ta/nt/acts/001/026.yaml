source:
  edition: SBLGNT
  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: ta
  text: அவர்கள் அவர்களுக்காகச் சீட்டுப் போட்டார்கள். சீட்டு மத்தியாவுக்கு விழுந்தது; அவரும் பதினொரு அப்போஸ்தலர்களுடன் சேர்த்து எண்ணப்பட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: அவ்விருவருக்காகச் சீட்டுப் போட்டார்கள்
  rationale: கிரேக்கச் சொற்றொடரின் நேர்ப்பொருள் ‘அவர்களுக்குச் சீட்டுகளைக் கொடுத்தார்கள்’ என்பதாக இருந்தாலும், இச்சூழலில் தேர்ந்தெடுப்பதற்காகச் சீட்டுப் போடுதலையே குறிக்கிறது. இயல்பான நவீனத் தமிழில் அந்தச் செயலைத் தெளிவாகக் கூறுகிறது; ‘அவ்விருவருக்காக’ என்பது முந்தைய வசனத்தில் நிறுத்தப்பட்ட இரு வேட்பாளர்களையும் சுட்டுகிறது.
- source_word: κλήρους / ὁ κλῆρος
  choice: சீட்டு / சீட்டுகள்
  rationale: இங்கு κλῆρος பங்கு அல்லது உரிமைப் பங்கைக் குறிக்காமல், ஒருவரைத் தேர்ந்தெடுக்கப் பயன்படுத்தப்பட்ட சீட்டைக் குறிக்கிறது.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: சீட்டு மத்தியாவுக்கு விழுந்தது
  rationale: கிரேக்க உருவகத்தையும் சீட்டுப் போடும் செயலின் முடிவையும் இயல்பான தமிழ் மரபுத்தொடரில் பாதுகாக்கிறது.
- source_word: Μαθθίαν
  choice: மத்தியா
  rationale: ஆள்பெயர் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்படுகிறது.
- source_word: συγκατεψηφίσθη
  choice: சேர்த்து அவரும் எண்ணப்பட்டார்
  rationale: ஒரு குழுவினரோடு ஒருவரும் கணக்கிடப்பட்டார் அல்லது அவர்களில் ஒருவராக ஏற்றுக்கொள்ளப்பட்டார் என்ற வினையின் பொருளை நெருக்கமாகப் பாதுகாக்கிறது; ‘சேர்க்கப்பட்டார்’ என்பதைக் காட்டிலும் குறைவாக விளக்கமளிக்கும் சொல்.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: பதினொரு அப்போஸ்தலர்களுடன்
  rationale: μετά + genitive என்பதன் ‘உடன்’ என்ற பொருளை நேரடியாகக் காக்கிறது; ஏற்கெனவே இருந்த பதினொரு அப்போஸ்தலர்களோடு மத்தியா எண்ணப்பட்டார் என்பதைத் தெரிவிக்கிறது.
theological_decisions:
- issue: συγκατεψηφίσθη என்ற சொல் விவரிப்பதைவிட வலுவான தெய்வீக அல்லது திருச்சபை நியமனக் கருத்தை மொழிபெயர்ப்பில் சேர்க்க வேண்டுமா?
  choice: பதினொரு அப்போஸ்தலர்களுடன் சேர்த்து அவரும் எண்ணப்பட்டார்
  alternative: பதினொரு அப்போஸ்தலர்களோடு அவர் சேர்க்கப்பட்டார்
  rationale: சீட்டு மத்தியாவுக்கு விழுந்ததைத் தொடர்ந்து அவர் பதினொருவரோடு கணக்கிடப்பட்டார் என்பதையே வசனம் நேரடியாகச் சொல்கிறது. ‘எண்ணப்பட்டார்’ என்பது அதற்கு அப்பாற்பட்ட கோட்பாட்டுக் கருத்தை இறக்குமதி செய்யாமல் கிரேக்கத்தின் அளவைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடையைக் கடைப்பிடித்துள்ளது. ‘அப்போஸ்தலர்’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல் என்பதால் வைக்கப்பட்டுள்ளது. முதல் வாக்கியத்தில் ‘அவ்விருவர்’ என்று கூறுவது உடனடி முந்தைய சூழலைத் தெளிவுபடுத்துகிறது; கிரேக்க αὐτοῖς என்பதன் பன்மையையும் காக்கிறது.
