  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: ta
  text: ஆனால் அவர் அவர்களிடம், “தந்தை தமது சொந்த அதிகாரத்திற்குள்[b] வைத்துள்ள காலங்களையோ வேளைகளையோ[a] அறிவது உங்களுக்குரியது அல்ல” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காலங்களையோ குறிக்கப்பட்ட நேரங்களையோ” அல்லது “காலப்பகுதிகளையோ தக்க வேளைகளையோ.” கிரேக்கத்தில் χρόνοι, καιροί என காலப்பகுதிகளையும் பொருத்தமான அல்லது குறிக்கப்பட்ட தருணங்களையும் குறிக்கக்கூடிய இரண்டு தொடர்புடைய சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: 'சொற்சார்ந்த மொழிபெயர்ப்பு: “தமது சொந்த அதிகாரத்தில்.” தந்தை இக்காலங்களையும் வேளைகளையும் தமது அதிகார உரிமைக்குள் வைத்துள்ளார் என்பதே இதன் பொருள்.'
    reason: lexical_alternative
