- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: தமது சொந்த அதிகாரத்தால்
  rationale: தந்தையின் தனிப்பட்ட அதிகாரமும் உரிமையும் இவற்றின் அடிப்படை என்பதைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது; ἐν என்பதிலுள்ள ‘அதிகாரத்திற்குள்’ என்ற சாத்திய நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: χρόνους / καιρούς என்ற இரு காலச் சொற்களின் மொழிபெயர்ப்பு
  choice: காலங்களையோ வேளைகளையோ
  alternative: காலங்களையோ குறிக்கப்பட்ட நேரங்களையோ
  rationale: இரண்டு தொடர்புடைய காலக் கருத்துகளுக்கிடையிலான வேறுபாட்டைக் காக்கிறது; ஆனால் கிரேக்கத்தில் இல்லாத கடுமையான இறுதிக்கால வகைப்பாட்டைத் திணிக்கவில்லை.
- issue: தந்தையைக் குறிக்கும் ἐξουσία என்பதன் மொழிபெயர்ப்பு
  choice: தமது சொந்த அதிகாரத்தால்
  alternative: தமது சொந்த அதிகாரத்தில்
  rationale: தந்தையின் இறையாண்மையான உரிமையைத் தெளிவாகச் சொல்கிறது; அதே நேரத்தில் பிற்காலக் கோட்பாட்டு விளக்கங்களை வசனத்திற்குள் சேர்க்கவில்லை. கிரேக்க முன்னிடைச்சொல்லின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘உங்களுக்குரியது அல்ல’ என்பது அறிவாற்றல் இல்லாமையை அல்ல, அந்த அறிவு சீடர்களின் உரிமை அல்லது பொறுப்புக்குரியது அல்ல என்பதைக் காக்கிறது. காலத்தைக் குறிக்கும் இரு கிரேக்கச் சொற்களின் வேறுபாடு ‘காலங்கள் / வேளைகள்’ எனத் தக்கவைக்கப்பட்டுள்ளது.
