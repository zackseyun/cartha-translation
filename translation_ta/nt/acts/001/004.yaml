id: ACT.1.4
reference: Acts 1:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: ta
  text: அவர் அவர்களோடு தங்கியிருந்தபோது[a], “எருசலேமைவிட்டு வெளியேறாமல், நீங்கள் என்னிடமிருந்து கேட்ட தந்தையின் வாக்குறுதிக்காகக் காத்திருங்கள்” என்று அவர்களுக்குக் கட்டளையிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களோடு கூடியிருந்தபோது”; சிலர் இதை “அவர்களோடு உணவருந்தியபோது” என்றும் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: அவர்களோடு தங்கியிருந்தபோது
  rationale: இந்தப் பங்கேற்புவினையின் துல்லியமான பொருள் விவாதத்திற்குரியது. உடனடி சூழலில் இயேசு அப்போஸ்தலர்களோடு இருந்தார் என்பது தெளிவு; ‘தங்கியிருந்தபோது’ என்பது இயல்பான தமிழில் அந்தப் பொதுவான பொருளைப் பாதுகாக்கிறது. ‘கூடியிருந்தபோது’, ‘உணவருந்தியபோது’ ஆகிய வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: παρήγγειλεν
  choice: கட்டளையிட்டார்
  rationale: அதிகாரபூர்வமான உத்தரவைச் சுட்டும் வினை; ‘அறிவுறுத்தினார்’ என்பதைவிட மூலத்தின் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: எருசலேமைவிட்டு வெளியேறாமல்
  rationale: நகரத்தை விட்டுப் பிரிந்து செல்லக்கூடாது என்பதே சூழல்சார் பொருள். இந்தத் தமிழ் வடிவம் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: περιμένειν
  choice: காத்திருங்கள்
  rationale: எதிர்பார்ப்புடன் காத்திருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: தந்தையின் வாக்குறுதி
  rationale: மூலத்தின் உறவுநிலை அமைப்பைப் பாதுகாக்கிறது; தந்தை அளித்த வாக்குறுதி என்ற சூழல்சார் பொருளை வெளிப்படுத்துகிறது, ஆனால் ‘வாக்குறுதியளிக்கப்பட்ட வரம்’ என்று விளக்கி விரிவாக்கவில்லை.
- source_word: ἣν ἠκούσατέ μου
  choice: நீங்கள் என்னிடமிருந்து கேள்விப்பட்ட
  rationale: ἀκούω உடன் வரும் மூலமொழியின் சுட்டுப்பெயர் ‘என்னிடமிருந்து கேட்ட’ என்ற இயல்பான பொருளைத் தருகிறது; கேட்ட செய்தியின் உள்ளடக்கத்தைத் தேவையின்றி மிகைப்படுத்தவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவின் செயலோடு தொடர்புடைய συναλιζόμενος என்பதன் பொருள்
  choice: இயேசு சீடர்களோடு பொதுவாகத் தங்கியிருந்ததாக மொழிபெயர்த்தல்
  alternative: அவர்களோடு கூடியிருந்தபோது; அவர்களோடு உணவருந்தியபோது
  rationale: சொல்லின் விவாதத்திற்குரிய நுணுக்கத்தைத் தீர்மானமாக்காமல், இயேசு அவர்களோடு இருந்தார் என்ற சூழலின் தெளிவான கருத்தைப் பாதுகாக்கிறது. குறிப்பாக உணவருந்தியதாகப் புரிந்துகொள்ளும் பழமையான மரபு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி கட்டளையின் இயல்புக்காக மேற்கோள் வடிவம் பயன்படுத்தப்பட்டது; ‘தந்தை’, ‘வாக்குறுதி’ ஆகிய சொற்கள் மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கின்றன.
