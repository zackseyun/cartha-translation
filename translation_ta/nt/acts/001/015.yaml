reference: Acts 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: ta
  text: 'அந்த நாட்களில் பேதுரு சகோதரர்களின் நடுவே எழுந்து நின்று கூறினார்: (அங்கே ஒன்றுகூடியிருந்தவர்களின் எண்ணிக்கை ஏறக்குறைய நூற்றிருபது.)[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களும் சகோதரிகளும்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க மூலத்தில் ‘சகோதரர்கள்’ என்று இருந்தாலும், இங்கு பெண்கள் உட்பட சக விசுவாசிகள் அனைவரையும் அது குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: எழுந்து நின்று
  rationale: பேசுவதற்காகப் பேதுரு எழுந்து நின்ற உடல்சார்ந்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν μέσῳ
  choice: நடுவே
  rationale: கூடியிருந்த குழுவினருக்குள் பேதுரு நின்ற இடத்தைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் இடவியல் நுணுக்கத்தைப் பேணுகிறது.
- source_word: ἀδελφῶν
  choice: சகோதரர்களின்
  rationale: ஆண்பால் பன்மை வடிவை முதன்மை உரையில் பேணுகிறது; இச்சூழலில் பெண்கள் உட்பட சக விசுவாசிகளையும் இது குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ὄχλος ὀνομάτων
  choice: ஒன்றுகூடியிருந்தவர்களின் எண்ணிக்கை
  rationale: சொல்லுக்குச் சொல் ‘பெயர்களின் கூட்டம்’ என்ற கிரேக்க மரபுத்தொடர் எண்ணப்பட்ட நபர்களைக் குறிக்கிறது. அதன் பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது; ‘பெயர்கள்’ என்று நேரடியாக மொழிபெயர்ப்பது இங்கு தவறான பொருளுணர்வைத் தரக்கூடும்.
- source_word: ἐπὶ τὸ αὐτό
  choice: அங்கே ஒன்றுகூடியிருந்த
  rationale: ஒரே இடத்தில் கூடியிருந்த நிலையைக் குறிக்கும் மரபுத்தொடரைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: ஏறக்குறைய நூற்றிருபது
  rationale: எண்ணுக்கு முன்னுள்ள ὡς தோராய மதிப்பைக் குறிப்பதால் ‘ஏறக்குறைய’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: கூடியிருந்த சமூகத்தில் ἀδελφῶν என்பதன் பாலினக் குறிப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்கள்’ என்று வைத்து, பெண்கள் உட்பட சக விசுவாசிகளையும் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘சகோதர சகோதரிகள்’ அல்லது ‘விசுவாசிகள்’
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவை மறைக்காமல் பேணுகிறது; அதேவேளையில், அங்கு கூடியிருந்த சமூகத்தின் சாத்தியமான உள்ளடக்கப் பொருளையும் அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் இடைச்செருகல் தகவல் அடைப்புக்குறிக்குள் வைக்கப்பட்டுள்ளது; நீண்ட தமிழ் வாக்கியத்தின் தெளிவுக்காக பேச்சை அறிமுகப்படுத்தும் பகுதி முற்றுப்புள்ளியுடன் முடிகிறது.
