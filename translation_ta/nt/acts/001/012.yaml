source:
  edition: SBLGNT
  text: Τότε ὑπέστρεψαν εἰς Ἰερουσαλὴμ ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος, ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ σαββάτου ἔχον ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: ta
  text: பின்பு அவர்கள் ஒலிவமலை என அழைக்கப்படும் மலையிலிருந்து எருசலேமுக்குத் திரும்பினார்கள். அந்த மலை எருசலேமுக்கு அருகில், ஓய்வுநாள் பயணத் தொலைவில் அமைந்திருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓய்வுநாள் பயணத் தொலைவு” என்பது ஓய்வுநாளில் ஒரு யூதர் பயணம் செய்யலாம் என்று வழக்கமாகக் கருதப்பட்ட தொலைவைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: பின்பு
  rationale: நிகழ்வுகளின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: எருசலேமுக்குத் திரும்பினார்கள்
  rationale: திரும்பிச் செல்லுதலையும் சென்றடையும் இடத்தையும் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος
  choice: ஒலிவமலை என்று அழைக்கப்பட்ட மலையிலிருந்து
  rationale: Ἐλαιῶνος என்பதன் இடப்பெயர் சார்ந்த பொருளை வழக்கமான தமிழ் வேதாகமப் பெயரான ‘ஒலிவமலை’ மூலம் தெரிவிக்கிறது; ὄρος என்பதையும் விடாமல் காக்கிறது.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: அந்த மலை எருசலேமுக்கு அருகில்
  rationale: உறவுப்பெயர் தொடரை தமிழில் தெளிவான தனி வாக்கியத் தொடராக வழங்குகிறது.
- source_word: σαββάτου ἔχον ὁδόν
  choice: ஓய்வுநாளில் பயணம் செய்ய அனுமதிக்கப்பட்ட தொலைவில்
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் தவிர்த்து, யூத வழக்கைக் குறிக்கும் தூர அளவின் பொருளை நவீன வாசகருக்குப் புரியும் வகையில் வழங்குகிறது.
theological_decisions:
- issue: σαββάτου ἔχον ὁδόν என்ற யூதப் பண்பாட்டு தூர வழக்கு
  choice: ஓய்வுநாளில் பயணம் செய்ய அனுமதிக்கப்பட்ட தொலைவில்
  alternative: ஓய்வுநாள் பயணத் தொலைவில்
  rationale: இது கோட்பாட்டுத் தீர்மானமல்ல; யூத ஓய்வுநாள் வழக்கில் ஏற்றுக்கொள்ளப்பட்ட பயணத் தொலைவைக் குறிக்கும் பண்பாட்டு மொழிவழக்கு. முதன்மை உரை அதன் பொருளைத் தெளிவாக்குகிறது; குறிப்பில் அதன் அளவீட்டுத் தன்மை விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கிரேக்க மூலத்தின் நிகழ்வுத் தொடரும் இடவியல் தகவலும் காக்கப்பட்டுள்ளன; பண்பாட்டு மொழிவழக்கு இயல்பாக விளக்கப்பட்டுள்ளது.
