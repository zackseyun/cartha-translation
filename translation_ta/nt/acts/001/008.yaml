source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: ta
  text: ஆனால் தூய ஆவி உங்கள்மேல் வரும்போது நீங்கள் வல்லமையைப் பெறுவீர்கள்; எருசலேமிலும், யூதேயா முழுவதிலும், சமாரியாவிலும், பூமியின் கடைசி எல்லைவரையிலும்[a] நீங்கள் எனக்குச் சாட்சிகளாக இருப்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியின் மிகத் தொலைவான பகுதிவரையிலும்.” கிரேக்கச் சொற்றொடர் ஒருமையில் உள்ளது; ஆனால் பூமியின் தொலைதூர எல்லையைக் குறிக்கும் மொழிமரபாகப் பயன்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்டதற்கு மாறாக, சீடர்கள் அறிய வேண்டிய காலங்களிலிருந்து அவர்கள் பெறவிருக்கும் பணிக்குத் திருப்பும் எதிர்மறை இணைப்பை இயல்பாகக் காட்டுகிறது.
- source_word: λήμψεσθε δύναμιν
  choice: நீங்கள் வல்லமையைப் பெறுவீர்கள்
  rationale: λαμβάνω இங்கு தமக்குத் தாமே எடுத்துக்கொள்வதை அல்ல, கொடுக்கப்படுவதைப் பெறுவதைக் குறிக்கிறது; δύναμις என்பதன் பரந்த, ஆவியால் அருளப்படும் செயலாற்றும் ஆற்றலை ‘வல்லமை’ காக்கிறது.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: தூய ஆவி உங்கள்மேல் வரும்போது
  rationale: மூலத்தின் genitive absolute அமைப்பை இயல்பான காலவாக்கியமாகத் தருகிறது; ἐπί உடன் வரும் இயக்க உணர்வை ‘உங்கள்மேல்’ காக்கிறது.
- source_word: ἔσεσθέ μου μάρτυρες
  choice: நீங்கள் எனக்குச் சாட்சிகளாக இருப்பீர்கள்
  rationale: μάρτυρες என்பது இங்கு சாட்சி பகருவோரைக் குறிக்கிறது; μου என்பதை ‘எனக்குச்’ என வழங்குவது இயேசுவைச் சார்ந்தும் அவருக்காகவும் சாட்சி கூறும் உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: எருசலேமிலும், யூதேயா முழுவதிலும், சமாரியாவிலும்
  rationale: τε...καί தொடரின் விரியும் புவியியல் வரிசையை ‘-இலும்’ அமைப்பு தெளிவாகக் காக்கிறது; πάσῃ என்பதன் முழுப் பரப்பை ‘முழுவதிலும்’ வெளிப்படுத்துகிறது.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: பூமியின் கடைமுனைவரையிலும்
  rationale: கிரேக்கத்தில் ஒருமையாக உள்ள ‘பூமியின் மிகத் தொலைவான எல்லை’ என்ற மொழிமரபை நெருக்கமாகவும் தமிழில் புரியத்தக்கவாறும் தருகிறது.
theological_decisions:
- issue: τοῦ ἁγίου πνεύματος என்பதன் தெய்வீக ஆள்தன்மையுள்ள குறிப்பு
  choice: தூய ஆவி
  alternative: பரிசுத்த ஆவி
  rationale: தெய்வீகக் குறிப்பை மரியாதையுடன் காக்கும் இயல்பான நவீனத் தமிழ்; குறிப்பிட்ட சமயக்குழுவின் வழக்கை மட்டும் சாராமல் உள்ளது.
- issue: சாட்சிப் பணியின் புவியியல் விரிவு
  choice: எருசலேமிலிருந்து பூமியின் கடைமுனைவரை விரியும் உண்மையான புவியியல் வரிசை
  alternative: முற்றிலும் குறியீட்டுத் தன்மையுள்ள ஆன்மிகப் புவியியல்
  rationale: மூலம் குறிப்பிட்ட இடப்பெயர்களையும் உலகளாவிய எல்லையையும் நேரடியாகக் கூறுகிறது; அதற்கு மேலான திருச்சபைத் திட்டவியலை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: μου உடன் μάρτυρες என்பதன் உறவு
  choice: எனக்குச் சாட்சிகள்
  alternative: என் சாட்சிகள்
  rationale: இரண்டும் இலக்கணரீதியாகச் சாத்தியம்; ‘எனக்குச் சாட்சிகள்’ என்பது இயேசுவுக்காகச் சாட்சி பகரும் உறவை இயல்பான தமிழில் காட்டுகிறது, ஆனால் உடைமை/சார்பு நிழலை முழுமையாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘வல்லமை’, ‘சாட்சிகள்’, ‘கடைமுனை’ ஆகியவை மூலத்தின் கருத்தைத் துல்லியமாகக் காக்கின்றன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
