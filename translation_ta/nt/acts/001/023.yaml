source:
  edition: SBLGNT
  text: καὶ ἔστησαν δύο, Ἰωσὴφ τὸν καλούμενον Βαρσαββᾶν, ὃς ἐπεκλήθη Ἰοῦστος, καὶ Μαθθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: ta
  text: 'அவர்கள் இருவரை முன்வைத்தார்கள்: பர்சபா என்று அழைக்கப்பட்ட யோசேப்பு—அவர் யுஸ்து என்றும் அழைக்கப்பட்டார்—மற்றும் மத்தியா.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இருவரை முன்னிறுத்தினார்கள்” அல்லது “இருவரை முன்மொழிந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஆட்களை ஒரு குழுவின் முன் நிறுத்துவதைக் குறிக்கலாம்; இங்கே அவர்களை வேட்பாளர்களாக முன்வைத்ததையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: முன்மொழிந்தார்கள்
  rationale: தேர்வு நடைபெறும் இச்சூழலில், இருவரையும் குழுவின் முன் வேட்பாளர்களாக நிறுத்திய செயலைக் குறிக்கிறது. வெறும் உடல்நிலையில் ‘நிற்கவைத்தார்கள்’ என்ற பொருளையோ, ஏற்கெனவே அதிகாரபூர்வமாக ‘நியமித்தார்கள்’ என்ற பொருளையோ வற்புறுத்தாமல் நடைமுறைச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δύο
  choice: இருவரை
  rationale: முன்மொழியப்பட்ட இரண்டு ஆண்களைக் குறிக்கும் எண்ணுப்பெயர்; தமிழில் மனிதர்களைக் குறிப்பிடும் இயல்பான வடிவம்.
- source_word: καλούμενον
  choice: என்று அழைக்கப்பட்ட
  rationale: யோசேப்புக்கு வழங்கப்பட்ட மற்றொரு பெயர் அல்லது அடையாளப் பெயரைத் தெரிவிக்கிறது.
- source_word: Βαρσαββᾶν
  choice: பர்சபா
  rationale: கிரேக்கப் பெயரின் ஒலிபெயர்ப்பு; தமிழில் வாசிக்க இயல்பான வடிவம்.
- source_word: ἐπεκλήθη
  choice: என்றும் அழைக்கப்பட்டார்
  rationale: இன்னொரு பெயரால் அறியப்பட்டதைக் காட்டுகிறது. ‘என்றும்’ என்பது இரண்டு பெயரிடும் கூறுகளுக்கிடையிலான தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: Ἰοῦστος
  choice: யுஸ்து
  rationale: தனிப்பெயரின் ஒலிபெயர்ப்பு; இலத்தீன் Justus பெயரின் மரபான தமிழ் வேதாகம வடிவத்துடன் ஒத்தது.
- source_word: Μαθθίαν
  choice: மத்தியா
  rationale: கிரேக்கத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: καὶ ... καὶ
  choice: அப்போது ... மற்றும்
  rationale: முதல் καί முந்தைய நிகழ்வோடு கதையைத் தொடர்கிறது; தமிழில் ‘அப்போது’ இயல்பான தொடர்ச்சியைத் தருகிறது. இரண்டாவது καί இரு வேட்பாளர்களை இணைப்பதால் ‘மற்றும்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: ἔστησαν என்பதன் தேர்வு நடைமுறை சார்ந்த பொருள்
  choice: முன்மொழிந்தார்கள்
  alternative: நியமித்தார்கள் / முன்னிறுத்தினார்கள் / நிற்கவைத்தார்கள்
  rationale: இவ்வசனத்திலேயே இறுதி நியமனம் நடந்ததாகத் தீர்மானிக்காமல், இருவரைத் தேர்வுக்காக முன்வைத்தனர் என்ற சூழல்சார் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் மரியாதையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; தேர்வு முடிந்துவிட்டதாக உணர்த்தக்கூடிய ‘நியமித்தார்கள்’ தவிர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
