source:
  edition: SBLGNT
  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: ta
  text: 'ஏனெனில், சங்கீதப் புத்தகத்தில் இவ்வாறு எழுதப்பட்டுள்ளது: “அவனுடைய குடியிருப்பு பாழாய்ப்போகட்டும்; அதில் குடியிருப்பவர் எவரும் இல்லாதிருக்கட்டும்”[a] என்றும், “அவனுடைய பதவியை வேறொருவர் ஏற்றுக்கொள்ளட்டும்”[b] என்றும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குடியிருப்பு” என்பதை “வாழிடம்” அல்லது “வசிப்பிடம்” என்றும் மொழிபெயர்க்கலாம்; “அதில் குடியிருப்பவர் எவரும் இல்லாதிருக்கட்டும்” என்பதை “அதில் எவரும் குடியிருக்காதிருக்கட்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பதவி” என்பதற்கான கிரேக்கச் சொல் ἐπισκοπή; இதை “மேற்பார்வை” அல்லது “மேற்பார்வைப் பொறுப்பு” என்றும் மொழிபெயர்க்கலாம். பிற்காலத் திருச்சபையின் ஒரு குறிப்பிட்ட பதவியை இது இங்கே கட்டாயமாகக் குறிக்கவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: எழுதப்பட்டுள்ளது
  rationale: வேதவசன மேற்கோளை அறிமுகப்படுத்தும் நிறைவுற்ற செயப்பாட்டு வடிவத்தின் நிகழ்காலச் செல்லுபடியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: βίβλῳ ψαλμῶν
  choice: சங்கீதப் புத்தகத்தில்
  rationale: மேற்கோளின் வேதநூல் மூலத்தைத் தெளிவாகவும் வழக்கமான நவீனத் தமிழிலும் அடையாளப்படுத்துகிறது.
- source_word: Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος
  choice: அவனுடைய குடியிருப்பு பாழாய்ப்போகட்டும்
  rationale: கட்டளை/விருப்பப் பொருளுடைய அசல் வடிவத்தையும் ἔπαυλις என்பதன் வாழிடப் பொருளையும் ἔρημος என்பதன் பாழடைந்த, குடியற்ற நிலையையும் காக்கிறது.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: அதில் குடியிருப்பவர் எவரும் இல்லாதிருக்கட்டும்
  rationale: ஒருவரும் அங்கு வசிக்காதிருக்க வேண்டும் என்ற கிரேக்கத் தொடரின் பொருளை அதன் தனிநபர் சார்ந்த இலக்கண வடிவத்துடன் இயல்பாக வழங்குகிறது.
- source_word: ἐπισκοπή
  choice: கண்காணிப்புப் பொறுப்பு
  rationale: மேற்பார்வை செய்யும் பொறுப்பு அல்லது பதவி என்ற பரந்த பொருளைத் தருகிறது; பிற்காலத் திருச்சபைத் தொழில்நுட்பப் பதவியை உரையில் திணிப்பதைத் தவிர்க்கிறது.
- source_word: λαβέτω ἕτερος
  choice: வேறொருவர் ஏற்றுக்கொள்ளட்டும்
  rationale: மற்றொருவர் அந்தப் பொறுப்பைப் பெறுதல் அல்லது ஏற்றல் என்ற வாரிசுரிமைச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யூதாசின் ἐπισκοπή என்பதன் தன்மை
  choice: கண்காணிப்புப் பொறுப்பு
  alternative: பதவி; மேற்பார்வை; ஆயர் பதவி
  rationale: இங்கு நிரப்பப்பட வேண்டிய அங்கீகரிக்கப்பட்ட பொறுப்பைக் குறிக்கிறது. ‘ஆயர் பதவி’ என்பது பிற்காலத் திருச்சபை அமைப்பைத் தேவையின்றி முன்வைக்கக்கூடும்; ‘கண்காணிப்புப் பொறுப்பு’ அசல் சொல்லின் செயல்பாட்டு பொருளையும் சூழலின் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழ்; வேத மேற்கோளுக்கேற்ற கண்ணியமான தொனி. மேற்கோள் அமைப்பு தெளிவாக வைக்கப்பட்டுள்ளது. ‘கண்காணிப்புப் பொறுப்பு’ என்பது புரிந்துகொள்ளத்தக்கதாய் இருந்து, தேவையற்ற சமயப்பிரிவு சார்ந்த தொழில்நுட்பப் பொருளைத் தவிர்க்கிறது.
