translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், அறியப்பட்ட செய்திக்கும் நிலத்திற்குப் பெயர் ஏற்பட்டதற்கும் இடையிலான விளைவுத் தொடர்பு காக்கப்பட்டுள்ளது. διάλεκτος என்பதிலுள்ள ‘மொழி/வட்டாரப் பேச்சு’ என்ற உண்மையான பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
