  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: ta
  text: இது எருசலேமில் வாழ்ந்த அனைவருக்கும் தெரியவந்தது. அதன் விளைவாக, அந்த நிலம் அவர்களுடைய சொந்த மொழியில்[a] ‘அகெல்தமாக்’[b] என்று அழைக்கப்பட்டது; அதற்கு ‘இரத்த நிலம்’ என்று பொருள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய சொந்த வட்டார வழக்கில்.’ கிரேக்க διάλεκτος என்பது ஒரு மொழியையோ வட்டார வழக்கையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க உரையில் பெயர் Ἁκελδαμάχ என்று உள்ளது; பல மொழிபெயர்ப்புகளில் இதன் குறுகிய வடிவமான ‘அக்கெல்தமா’ வழக்கில் உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: தெரியவந்தது
  rationale: இந்த இறந்தகால ஆளில்லா அமைப்பு, முந்தைய நிகழ்வு பரவலாக அறியப்பட்டதைக் குறிக்கிறது. ‘தெரியவந்தது’ என்பது இயல்பான நவீனத் தமிழில் இதை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: எருசலேமில் குடியிருந்த அனைவருக்கும்
  rationale: κατοικοῦσιν என்பது ஓர் இடத்தில் வசிப்பவர்களைக் குறிக்கிறது; ‘குடியிருந்த’ என்பது வசிப்பிடத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὥστε
  choice: அதனால்
  rationale: இங்கு ὥστε விளைவை அறிமுகப்படுத்துகிறது. தமிழில் தனி வாக்கியத்தின் தொடக்கத்தில் ‘அதனால்’ என்பது அந்த விளைவுத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; வெறும் தர்க்க முடிவாக மட்டும் அதை மாற்றுவதில்லை.
- source_word: κληθῆναι
  choice: அழைக்கப்பட்டது
  rationale: செயப்பாட்டு வினையான κληθῆναι, அந்த நிலம் குறிப்பிட்ட பெயரால் வழங்கப்பட்டதைக் குறிக்கிறது; ‘அழைக்கப்பட்டது’ இதை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: அந்த நிலம்
  rationale: χωρίον என்பது ஓர் இடம், நிலப்பகுதி அல்லது வயலைக் குறிக்கலாம். தொடர்ந்து வரும் பெயர் விளக்கத்திலும் அதே சொல்லைச் சீராகத் தக்கவைக்க ‘நிலம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: அவர்களுடைய சொந்த மொழியில்
  rationale: διάλεκτος என்பது ஒரு மொழியையோ வட்டாரப் பேச்சையோ குறிக்கக்கூடும். சூழலில் இயல்பான பொதுப் பொருளாக ‘மொழி’ பயன்படுத்தப்பட்டு, ἰδίᾳ என்பதன் வலியுறுத்தல் ‘சொந்த’ என்பதால் காக்கப்படுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: Ἁκελδαμάχ
  choice: அக்கெல்தாமாக்
  rationale: SBLGNT உரையிலுள்ள கிரேக்க வடிவத்தின் இறுதி χ ஒலியையும் உள்ளடக்கி பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. வழக்கில் காணப்படும் குறுகிய வடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: τοῦτ’ ἔστιν
  choice: அதற்கு … என்று பொருள்
  rationale: இந்தச் சூத்திரம் முந்தைய அயல்மொழிப் பெயரின் பொருளை விளக்குகிறது. தமிழில் ‘அதற்கு … என்று பொருள்’ என்பது அந்த விளக்கச் செயல்பாட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: Χωρίον Αἵματος
  choice: இரத்த நிலம்
  rationale: கிரேக்க உரையே பெயருக்கான நேரடி பொருள் விளக்கத்தை வழங்குகிறது. Χωρίον என்பதற்கு முன்பு தேர்ந்தெடுத்த ‘நிலம்’ என்பதையே இங்கும் பயன்படுத்தி சொல் ஒற்றுமை காக்கப்பட்டுள்ளது.
