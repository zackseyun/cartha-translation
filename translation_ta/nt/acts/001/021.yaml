lexical_decisions:
- source_word: δεῖ
  choice: அவசியம்
  rationale: இது கட்டாயத் தேவையை உணர்த்தும் ஆளற்ற வினை. அதன் கருத்தை நிறைவு செய்யும் பகுதி அடுத்த வசனத்தில் தொடருவதால், இங்கே புதிய செயற்பாட்டைச் சேர்க்காமல் ‘அவசியம்’ என வைத்திருக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையிலிருந்து பேதுரு எடுக்கும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: συνελθόντων ἡμῖν ἀνδρῶν
  choice: நம்முடன் சேர்ந்திருந்த ஆண்களில்
  rationale: συνέρχομαι என்பதன் அடிப்படைப் பொருளான ஒன்றுசேர்தலைக் காக்கிறது; இச்சூழலில் நீடித்த உடனிருப்பையும் இயல்பான தமிழில் உணர்த்துகிறது. ἀνήρ குறிப்பாக ஆண்களைக் குறிக்கும் என்பதும் பாதுகாக்கப்படுகிறது.
- source_word: ἐν παντὶ χρόνῳ ᾧ
  choice: காலம் முழுவதும்
  rationale: ஒவ்வொரு தனித்தருணத்தையும் அல்ல, இயேசு சீடர்களுடன் செயல்பட்ட முழுக் காலப்பரப்பையும் குறிக்கிறது.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς
  choice: நம்மிடையே வந்து போய்க்கொண்டிருந்த
  rationale: தொடர்ச்சியான உடனிருப்பையும் செயல்பாட்டையும் குறிக்கும் மூலமொழியின் உருவக வழக்கை இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ κύριος Ἰησοῦς
  choice: ஆண்டவராகிய இயேசு
  rationale: κύριος என்பதன் கிறிஸ்துவியல் பட்டப்பெயரான ‘ஆண்டவர்’ என்பதையும், தமிழில் பெயருடன் இயல்பாக அமையும் உறவையும் காக்கிறது.
theological_decisions:
- issue: κύριος என்ற கிறிஸ்துவியல் பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவராகிய இயேசு
  alternative: எஜமானாகிய இயேசு
  rationale: ‘ஆண்டவர்’ என்பது பட்டப்பெயரின் மரியாதையையும் புதிய ஏற்பாட்டில் உள்ள இறையியல் நிறையையும் தக்கவைக்கிறது; ‘எஜமான்’ இங்கு அதன் முழு நிறையை வெளிப்படுத்தாது.
- issue: ἀνδρῶν என்பதிலுள்ள பாலினக் குறிப்பு
  choice: ஆண்களில்
  alternative: மனிதர்களில் / நபர்களில்
  rationale: ἀνήρ இங்கு குறிப்பாக ஆண்களைக் குறிக்கிறது; பாலினப் பொதுமைப்படுத்தல் மூலத்தின் குறிப்பை மறைத்துவிடும்.
- issue: δεῖ என்பதன் நிறைவுபெறாத வசன அமைப்பு
  choice: ‘ஒருவன் அவசியம்—’ என்று அடுத்த வசனத்திற்குத் தொடரும் அமைப்பு
  alternative: ‘ஒருவனைத் தேர்ந்தெடுப்பது அவசியம்’
  rationale: யாரைத் தேர்ந்தெடுப்பது என்ற செயலை மூலவசனம் வெளிப்படையாகச் சொல்லவில்லை; தேவையின் துல்லியமான நிறைவு அடுத்த வசனத்தில் வருகிறது. எனவே அந்தத் தொடர்ச்சியும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தில் வசனம் காற்புள்ளியுடன் அடுத்த வசனத்திற்குத் தொடர்வதால், தமிழில் நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது; ‘தேர்ந்தெடுக்க வேண்டும்’ போன்ற வெளிப்படையாக இல்லாத செயல் சேர்க்கப்படவில்லை. ‘வந்து போய்க்கொண்டிருந்த’ என்பது இயேசுவின் சீடர்களிடையேயான தொடர்ச்சியான பொது வாழ்வையும் செயல்பாட்டையும் குறிக்கும் வழக்கை இயல்பாக எடுத்துரைக்கிறது.
