source:
  edition: SBLGNT
  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: ta
  text: ஏனெனில், அவன் நம்மில் ஒருவனாக எண்ணப்பட்டு, இந்த ஊழியத்தில் ஒரு பங்கைப் பெற்றிருந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த ஊழியத்தின் சீட்டை/ஒதுக்கப்பட்ட பங்கைப் பெற்றிருந்தான்.’ κλῆρος என்ற கிரேக்கச் சொல் ‘சீட்டு’ அல்லது ‘பங்கு, ஒதுக்கப்பட்ட பகுதி’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: பேதுரு முன் கூறியதற்கான காரணத்தை விளக்குவதால், இயல்பான காரண இணைப்புச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: κατηριθμημένος ἦν
  choice: எண்ணப்பட்டு ... இருந்தான்
  rationale: முழுநிறை செயலெச்சத்துடன் அமைந்த வினைப்பாட்டு வடிவம், யூதாஸ் அக்குழுவில் ஒருவனாகக் கணக்கிடப்பட்டிருந்த நிலையை உணர்த்துகிறது.
- source_word: ἐν ἡμῖν
  choice: நம்மில் ஒருவனாக
  rationale: வெறும் அருகாமையை அல்லாமல், அப்போஸ்தலர் குழுவுக்குள் இருந்த உண்மையான உறுப்பினர்நிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔλαχεν
  choice: பெற்றிருந்தான்
  rationale: λαγχάνω என்பது சீட்டினாலோ பங்கீட்டினாலோ ஒன்றைப் பெறுவதைக் குறிக்கலாம்; இங்கு அந்த ஊழியப் பங்கு அவனுக்குக் கிடைத்திருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὸν κλῆρον
  choice: ஒரு பங்கை
  rationale: κλῆρος என்பதற்கு ‘சீட்டு’ என்றும் ‘ஒதுக்கப்பட்ட பங்கு’ என்றும் பொருள் உண்டு. இச்சூழலில் பங்கேற்பைக் குறிக்கும் ‘ஒரு பங்கு’ தெளிவாகவும் இயல்பாகவும் உள்ளது; மூலச்சொல்லின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τῆς διακονίας ταύτης
  choice: இந்த ஊழியத்தில்
  rationale: διακονία இங்கு அப்போஸ்தலப் பணியைக் குறிக்கிறது. ‘பங்கு’ என்பதோடு ‘இந்த ஊழியத்தில்’ என்பது இயல்பாக இணைகிறது.
theological_decisions:
- issue: அப்போஸ்தல ஊழியத்துடன் யூதாஸுக்கு இருந்த தொடர்பின் தன்மை
  choice: யூதாஸ் அவர்களில் ஒருவனாக உண்மையில் எண்ணப்பட்டு, அவர்களுடைய ஊழியத்தில் ஒரு பங்கைப் பெற்றிருந்தான் என்று வசனம் கூறுகிறது.
  alternative: அவன் குழுவோடு வெறுமனே தொடர்புடையவனாக மட்டுமே இருந்தான் என்று பலவீனமாகப் புரிந்துகொள்ளலாம்.
  rationale: ‘நம்மில் ஒருவனாக எண்ணப்பட்டு’ என்பதும் ‘ஒரு பங்கைப் பெற்றிருந்தான்’ என்பதும் உண்மையான உள்ளடக்கத்தையும் பங்கேற்பையும் உறுதிப்படுத்துகின்றன. ஆனால் அவனுடைய அங்கீகாரம் அல்லது இறுதிவரை நிலைத்திருத்தல் பற்றிய பிற்காலக் கோட்பாட்டு முடிவுகளை மொழிபெயர்ப்பு சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடியதாயும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஊழியம்’ என்பது இச்சூழலின் அப்போஸ்தலப் பணியைத் துல்லியமாகக் குறிக்கிறது; ‘ஒரு பங்கு’ என்பது κλῆρος என்பதன் சூழல்சார் பொருளை இயல்பாக எடுத்துரைக்கிறது.
