source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: ta
  text: அவர்கள் ஜெபித்த பின்பு, “நீரே, ஆண்டவரே[b], அனைவருடைய இதயங்களையும் அறிந்தவரே, இந்த இருவரில் நீர் தேர்ந்தெடுத்த ஒருவரைக் காட்டியருளும்[a]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காட்டியருளும்’ என்பதற்கு ‘நியமித்தருளும்’ அல்லது ‘சுட்டிக்காட்டியருளும்’ என்றும் பொருள் கொள்ளலாம்; இவ்வினை அறியச் செய்வதையோ வெளிப்படையாக நியமிப்பதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆண்டவரே’ என்ற அழைப்பு பொதுவாக தேவனை நோக்கியதா அல்லது குறிப்பாக இயேசுவை நோக்கியதா என்பதை கிரேக்க வாசகம் வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: ஜெபித்த பின்பு
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முந்திய செயலை இயல்பாகக் குறிக்கிறது; நவீனத் தமிழில் வரிசையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: Σὺ κύριε
  choice: ஆண்டவரே ... நீர்
  rationale: κύριε என்பதை மரியாதையான நேரடி அழைப்பாக ‘ஆண்டவரே’ என்றும், வலியுறுத்தப்பட்ட Σὺ என்பதை மரியாதைப் பன்மையான ‘நீர்’ என்றும் வழங்குகிறது.
- source_word: καρδιογνῶστα πάντων
  choice: அனைவருடைய இதயங்களையும் அறிந்தவராகிய
  rationale: கூட்டுச்சொல்லின் ‘இதயங்களை அறிபவர்’ என்ற பொருளையும் πάντων என்பதன் ‘அனைவருடைய’ என்ற பரப்பையும் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἀνάδειξον
  choice: காட்டியருளும்
  rationale: தேவன் ஏற்கெனவே தேர்ந்தெடுத்த நபரை வெளிப்படுத்துமாறு கேட்கும் சூழலில் ‘காட்டு’ என்பது நிறுவுதல் என்ற பொருளைத் தேவையின்றி சேர்க்காது; ‘அருளும்’ ஜெப வேண்டுகோளின் மரியாதை நடையைத் தருகிறது.
- source_word: ὃν ἐξελέξω
  choice: நீர் தேர்ந்தெடுத்த ஒருவரை
  rationale: இறைவனுடைய தேர்வு ஏற்கெனவே நிகழ்ந்தது என்பதை எளிய தமிழில் வெளிப்படுத்துகிறது; நடுநிலை வினையின் தனிப்பட்ட தேர்வு நுணுக்கத்தையும் ‘தேர்ந்தெடுத்த’ தக்கவைக்கிறது.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: இந்த இருவரில் ... ஒருவரை
  rationale: இரு வேட்பாளர்களிலிருந்து ஒருவரைச் சுட்டிக்காட்டும் கிரேக்க அமைப்பை, ‘ஆண்கள்’ போன்ற வெளிப்படையாக இல்லாத சொல்லைச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ஜெபத்தில் ‘ஆண்டவர்’ என்பவர் யார்?
  choice: ‘ஆண்டவரே’ என்ற அழைப்பை மட்டும் வைத்து, அது யாரைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பில் குறிப்பிடாமல் விடுதல்.
  alternative: பொதுவாக தேவனை நோக்கியதாகவோ, குறிப்பாக உயிர்த்தெழுந்த இயேசுவை நோக்கியதாகவோ விளக்குதல்.
  rationale: கிரேக்க மூலத்தில் κύριε என்று மட்டுமே உள்ளது. பிதாவையோ இயேசுவையோ வெளிப்படையாக அடையாளப்படுத்தாததால், வசனத்தின் உண்மையான விளக்கத் திறப்பை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான மரியாதை நடையுடன் வடிவமைக்கப்பட்டது. ‘நீர்’, ‘ஆண்டவரே’, ‘காட்டியருளும்’ ஆகியவை உயர்வானதாயினும் சாதாரண வாசகர்களுக்குப் புரியும் சொற்கள். மூலத்தில் உள்ள ‘ஆண்டவர்’ குறித்த தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
