  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: ta
  text: ஆண்களே, சகோதரர்களே, இயேசுவைக் கைது செய்தவர்களுக்கு[c] வழிகாட்டியாக ஆன யூதாசைப் பற்றி, பரிசுத்த ஆவியானவர் தாவீதின் வாய்மூலம்[b] முன்னரே உரைத்த[a] வேதவாக்கு நிறைவேற வேண்டியிருந்தது.
  philosophy: optimal-equivalence
