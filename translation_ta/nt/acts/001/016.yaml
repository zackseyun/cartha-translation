theological_decisions:
- issue: வேதவாக்கு நிறைவேறுவதன் அவசியம்
  choice: நிறைவேற வேண்டியிருந்தது
  alternative: இறைவனால் முன்குறிக்கப்பட்டபடியே கட்டாயம் நிகழ வேண்டியிருந்தது
  rationale: ἔδει அவசியத்தைத் தெரிவிக்கிறது; ஆனால் அந்த அவசியத்தின் துல்லியமான செயல்முறையை இந்த வசனம் விளக்கவில்லை. ஆகவே இறை முன்னறிவு, வேதவாக்கின் நிறைவேற்றம், மனிதச் செயல் ஆகியவற்றுக்கிடையிலான பதற்றம் தீர்மானித்து விளக்கப்படவில்லை.
- issue: வேதவாக்கில் தெய்வீக மற்றும் மனித முகமை
  choice: பரிசுத்த ஆவியானவர் தாவீதின் வாய்மூலம் முன்னரே உரைத்த
  alternative: தாவீது பரிசுத்த ஆவியினால் உரைத்த
  rationale: கிரேக்கத்தில் பரிசுத்த ஆவியானவரே இலக்கணரீதியாகப் பேசுபவர்; தாவீது அவர் பயன்படுத்திய மனித வழிமூலம். மொழிபெயர்ப்பு இந்த இரு முகமைகளையும் அப்படியே காக்கிறது.
translation_notes:
  register: நடை நவீன, கண்ணியமான பொதுத்தமிழில் அமைந்துள்ளது. கிரேக்க அழைப்பிலுள்ள ἄνδρες மற்றும் ἀδελφοί இரண்டும் ‘சகோதரர்களாகிய ஆண்களே’ என்று பாதுகாக்கப்பட்டுள்ளன. தமிழின் இயல்பான தகவல் ஒழுங்குக்காக யூதாசைப் பற்றிய உறவுத்தொடர் முன்வைக்கப்பட்டாலும், பரிசுத்த ஆவியானவர் பேசுபவர், தாவீது வழிமூலம் என்ற மூலமொழியின் முகமை தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது.
