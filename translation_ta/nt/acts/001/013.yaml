revisions:
- from: அவர்கள் உள்ளே வந்தபோது, தாங்கள் தங்கியிருந்த மாடி அறைக்கு ஏறிச் சென்றார்கள். அங்கு பேதுரு, யோவான், யாக்கோபு, அந்திரேயா; பிலிப்பு, தோமா; பர்த்தலோமேயு, மத்தேயு; அல்பேயுவின் மகன் யாக்கோபு, தீவிர ஆர்வலரான சீமோன், யாக்கோபின் மகன் யூதா[a] ஆகியோர் இருந்தார்கள்.
  to: 'அவர்கள் உள்ளே வந்தபோது, அவர்கள் தங்கிக்கொண்டிருந்த மாடி அறைக்கு ஏறிச் சென்றார்கள். அங்கே தங்கிக்கொண்டிருந்தவர்கள்: பேதுரு, யோவான், யாக்கோபு, அந்திரேயா; பிலிப்பு, தோமா; பர்த்தலோமேயு, மத்தேயு; அல்பேயுவின் மகன் யாக்கோபு, தீவிர ஆர்வலரான சீமோன், யாக்கோபின் மகன் யூதா[a].'
  rationale: 'சிறிய நடைத் திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன: தேவையற்ற ‘தாங்கள்’ நீக்கப்பட்டு, καταμένοντες-இன் தொடர்ச்சியான பொருளைக் காட்ட ‘தங்கிக்கொண்டிருந்த’ பயன்படுத்தப்பட்டுள்ளது. பட்டியல் தங்கியிருந்தவர்களையே குறிக்கிறது என்பதைத் தெளிவாக்க மறுசீரமைக்கப்பட்டது. யூதா–யாக்கோபு உறவு குறித்த மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் மாற்றமின்றிப் பாதுகாக்கப்பட்டுள்ளது.'
