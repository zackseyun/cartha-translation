id: ACT.1.13
reference: Acts 1:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: ta
  text: 'அவர்கள் உள்ளே வந்தபோது, அவர்கள் தங்கிக்கொண்டிருந்த மாடி அறைக்கு ஏறிச் சென்றார்கள். அங்கே தங்கிக்கொண்டிருந்தவர்கள்: பேதுரு, யோவான், யாக்கோபு, அந்திரேயா; பிலிப்பு, தோமா; பர்த்தலோமேயு, மத்தேயு; அல்பேயுவின் மகன் யாக்கோபு, தீவிர ஆர்வலரான சீமோன், யாக்கோபின் மகன் யூதா[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாக்கோபின் சகோதரன் யூதா.’ கிரேக்க மூலத்தில் ‘யாக்கோபின் யூதா’ என்று மட்டுமே உள்ளது; அவர்களுக்கிடையிலான உறவு வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: உள்ளே வந்தபோது
  rationale: கிரேக்க வினைச்சொல் நுழைதலைக் குறிக்கிறது; இவ்வசனத்தில் இடம் வெளிப்படையாகக் குறிப்பிடப்படாததால் தமிழிலும் அதைச் சேர்க்காமல் விடப்பட்டுள்ளது.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: மாடி அறைக்கு ஏறிச் சென்றார்கள்
  rationale: ἀνέβησαν என்பதன் மேல்நோக்கிய இயக்கத்தையும் ὑπερῷον என்பதன் கட்டட அமைவிடத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὗ ἦσαν καταμένοντες
  choice: தாங்கள் தங்கியிருந்த
  rationale: தொடர்ந்து ஓரிடத்தில் தங்கியிருத்தல் என்ற பொருளையும் நீடித்த செயல் நிலையையும் இயல்பாகத் தருகிறது.
- source_word: ὅ τε Πέτρος καὶ Ἰωάννης καὶ Ἰάκωβος καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος
  choice: பேதுரு, யோவான், யாக்கோபு, அந்திரேயா; பிலிப்பு, தோமா; பர்த்தலோமேயு, மத்தேயு
  rationale: கிரேக்கப் பட்டியலின் பெயர்க் குழுக்களை அரைப்புள்ளிகளால் காட்டுகிறது; ஒவ்வொரு καί-யையும் செயற்கையாகத் தமிழில் மீண்டும் கூறுவதில்லை.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: அல்பேயுவின் மகன் யாக்கோபு
  rationale: இங்கு உறவைக் குறிக்கும் வேற்றுமை வடிவம் எந்த யாக்கோபு என்பதைக் காட்டும் தந்தைவழி அடையாளமாக இயல்பாகப் புரிகிறது.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: தீவிர ஆர்வலரான சீமோன்
  rationale: ζηλωτής என்பதை அடையாளப் பட்டமாக எடுத்துக்கொண்டு அதன் தீவிரப் பற்றைக் காட்டுகிறது; நவீன தமிழில் வன்முறை அல்லது பயங்கரவாதப் பொருளைத் தேவையின்றி ஏற்றக்கூடிய ‘தீவிரவாதி’ என்ற சொல்லைத் தவிர்க்கிறது.
- source_word: Ἰούδας Ἰακώβου
  choice: யாக்கோபின் மகன் யூதா
  rationale: ஆண்களின் பெயர்ப் பட்டியலில் இவ்வகை உடைமை வேற்றுமை பொதுவாகத் தந்தைவழி அடையாளமாக அமைகிறது. எனினும் உறவு கிரேக்கத்தில் வெளிப்படையாகச் சொல்லப்படாததால் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: Ἰούδας Ἰακώβου என்பதில் குறிக்கப்படும் உறவு
  choice: யாக்கோபின் மகன் யூதா
  alternative: யாக்கோபின் சகோதரன் யூதா
  rationale: கிரேக்கம் ‘யாக்கோபின் யூதா’ என்று மட்டுமே கூறி உறவை மறைமுகமாக விடுகிறது. பெயர்ப் பட்டியலின் சூழலில் ‘மகன்’ என்பது அதிக வாய்ப்புள்ள பொருள்; ஆனால் ‘சகோதரன்’ என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பட்டியலைத் தமிழில் முழுமையான வாக்கியமாக்க ‘அங்கு … ஆகியோர் இருந்தார்கள்’ என அமைக்கப்பட்டுள்ளது; இது οὗ ἦσαν καταμένοντες என்பதிலுள்ள இருப்பை இயல்பாக வெளிப்படுத்துகிறது. ‘மாடி அறை’ என்பது மரபுசார் திருச்சபைத் தொடர்புகளைத் தேவையின்றி ஏற்றாமல் ὑπερῷον என்பதன் சாதாரண இடவியல் பொருளைத் தருகிறது.
