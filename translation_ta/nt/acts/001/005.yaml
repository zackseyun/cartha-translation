id: ACT.1.5
reference: Acts 1:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: ta
  text: ஏனெனில், யோவான் தண்ணீரால் திருமுழுக்கு கொடுத்தார்; நீங்களோ இன்னும் பல நாட்கள் கழியுமுன் பரிசுத்த ஆவியில்[a] திருமுழுக்கு பெறுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்த ஆவியால்.’ கிரேக்க முன்னிடைச்சொல்லை ‘ஆவியில்’ அல்லது ‘ஆவியால்’ என்று புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் இயேசு கூறிய வாக்குறுதிக்கான விளக்கத்தையோ காரணத்தையோ இது அறிமுகப்படுத்துகிறது; நவீனத் தமிழில் ‘ஏனெனில்’ அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐβάπτισεν
  choice: திருமுழுக்கு கொடுத்தார்
  rationale: ‘திருமுழுக்கு’ என்பது βαπτίζω என்பதற்கான பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் வேதாகமச் சொல். இது சடங்கைக் குறிப்பிடுகிறது; அதன் செய்முறையை ‘முழுமையாக அமிழ்த்துதல்’ என்று தேவையின்றி தீர்மானிப்பதில்லை.
- source_word: ὕδατι
  choice: தண்ணீரால்
  rationale: இங்கு உள்ள வேற்றுமை உருபில்லா dative, கருவி அல்லது சாதனப் பொருளைக் கொண்டிருக்கலாம். ‘தண்ணீரால்’ என்பது அதனை இயல்பான தமிழில் வெளிப்படுத்தி, அடுத்துள்ள ஆவியைக் குறித்த சொற்றொடருடனான வேறுபாட்டையும் காக்கிறது.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: தூய ஆவியில்
  rationale: ἐν என்பதன் இடம் அல்லது சூழல் சார்ந்த பொருளை ‘-இல்’ நேரடியாகக் காக்கிறது. அதேவேளை, கருவிப் பொருளில் ‘தூய ஆவியால்’ என்றும் புரிந்துகொள்ள முடியும் என்பதால் அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: βαπτισθήσεσθε
  choice: திருமுழுக்கு பெறுவீர்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; செய்பவர் யார் என்பதை கிரேக்க மூலத்தைப் போலவே வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: இன்னும் பல நாட்கள் ஆகுமுன்
  rationale: குறிப்பிடப்படும் தற்போதைய காலத்திலிருந்து அதிக நாட்கள் கடந்துவிடுவதற்கு முன் நிகழும் என்ற எதிர்மறைக் காலக் கருத்தை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳ என்ற இறையியல் முக்கியத்துவமுள்ள சொற்றொடரின் மொழிபெயர்ப்பு
  choice: தூய ஆவியில்
  alternative: தூய ஆவியால்
  rationale: ἐν என்பது ஆவிக்குள் அல்லது ஆவியின் ஆளுகைச் சூழலில் நிகழ்வதைக் குறிக்கலாம்; அதேசமயம் ஆவியைச் சாதனம் அல்லது வழிமுறையாகவும் குறிக்கலாம். முதன்மைப் பாடம் ‘-இல்’ என்பதன் மூலம் கிரேக்க வடிவை நெருக்கமாகக் காக்கிறது; மாற்றுப் பொருளை அடிக்குறிப்பு பாதுகாக்கிறது. இதனால் ஒரு குறிப்பிட்ட மரபின் ஆவிக்குரிய திருமுழுக்கு விளக்கத்தை உரைக்குள் திணிப்பது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘திருமுழுக்கு’ என்ற நிலைபெற்ற சமயச் சொல் பயன்படுத்தப்பட்டாலும், அதன் முறையைப் பற்றிய எந்தப் பிரிவுசார் முடிவும் சேர்க்கப்படவில்லை. ‘பரிசுத்த ஆவி’ என்பதற்குப் பதிலாக இயல்பான நவீனத் தமிழான ‘தூய ஆவி’ பயன்படுத்தப்பட்டுள்ளது.
