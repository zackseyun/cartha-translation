source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: ta
  text: அவர் துன்புற்ற பின்பு, தாம் உயிரோடிருப்பதைப் பல உறுதியான சான்றுகளால்[a] அவர்களுக்குக் காட்டினார். நாற்பது நாட்கள் காலத்தில்[b] அவர் அவர்களுக்குத் தோன்றி, கடவுளின் ஆட்சியைப்[c] பற்றிப் பேசினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பல சான்றுகளால்’ அல்லது ‘உறுதியளிக்கும் பல சான்றுகளால்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் உறுதியை ஏற்படுத்தும் ஆதாரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நாற்பது நாட்களின்போது’ அல்லது ‘நாற்பது நாட்கள் முழுவதிலும்’ என்றும் மொழிபெயர்க்கலாம். அந்தக் காலப்பகுதியில் பல்வேறு நேரங்களில் அவர் தோன்றியதை இத்தொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘கடவுளின் அரசு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் கடவுளின் அரசாளுதலையும் அவரது ஆட்சிக்குட்பட்ட அரசையும் குறிக்கக்கூடும்.
    reason: ambiguity
lexical_decisions:
- source_word: οἷς / αὐτοῖς
  choice: அவர்களுக்கு / அவர்களுக்குத்
  rationale: இவை முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அப்போஸ்தலர்களைக் குறிக்கின்றன. கிரேக்கத்தில் இல்லாத ‘ஆண்கள்’ என்ற சொல்லைச் சேர்க்காமல் இயல்பான தமிழில் சுட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: தாம் உயிரோடிருப்பதை ... அவர்களுக்குக் காட்டினார்
  rationale: இயேசு தம்மை உயிருள்ளவராக அவர்களுக்கு வெளிப்படுத்தியதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; உயிர்த்தெழுதலை மறைமுகமாக்கவில்லை.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: அவர் துன்புற்ற பின்பு
  rationale: μετά உடன் வரும் வினையெச்சத் தொடர் கால வரிசையை, அதாவது துன்பத்துக்குப் பிந்தைய நிகழ்வை, தெளிவாகக் காட்டுகிறது. ‘பாடுபட்ட’ என்பது உழைத்தார் என்ற வேறு பொருளையும் தரக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: பல உறுதியான சான்றுகளால்
  rationale: τεκμήριον என்பது ஒரு முடிவை உறுதிப்படுத்தும் ஆதாரம் அல்லது சான்றைக் குறிக்கிறது. ‘உறுதியான’ என்பது அதன் சான்றுவலிமையைத் தெரிவிக்கிறது; ‘தவறாத’ போன்ற மிகைப்படுத்தப்பட்ட சொல்லைச் சேர்க்கவில்லை.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: நாற்பது நாட்கள் காலப்பகுதியில்
  rationale: διά உடன் வரும் இத்தொடர் அந்தக் காலப்பகுதி முழுவதும் நிகழ்ந்த தோற்றங்களைக் குறிக்கிறது; இடைவிடாமல் நாற்பது நாட்களும் தோன்றினார் என்ற எண்ணத்தை உருவாக்காமல் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: அவர் அவர்களுக்குத் தோன்றி
  rationale: உயிர்த்தெழுதலுக்குப் பிந்தைய சூழலில் ὀπτάνομαι என்பதன் இயல்பான பொருள் ‘தோன்றுதல்’ ஆகும்.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: கடவுளின் ஆட்சியைப் பற்றிப் பேசினார்
  rationale: τὰ περὶ என்ற மரபுத்தொடர் ‘பற்றியவற்றை’ எனப் பொருள்படும்; நவீன தமிழில் ‘பற்றிப் பேசினார்’ இயல்பாக உள்ளது.
- source_word: βασιλείας τοῦ θεοῦ
  choice: கடவுளின் ஆட்சி
  rationale: βασιλεία என்பதன் அரசாளுதல் அல்லது அரசுரிமை சார்ந்த மையப் பொருளை இது தெளிவாகத் தருகிறது. அந்தச் சொல் அரசாட்சிக்குட்பட்ட உலகையும் குறிக்கக்கூடியதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: உயிர்த்தெழுதலும் சான்றுகளின் வலிமையும்
  choice: இயேசு துன்புற்ற பின்பு உயிரோடிருப்பதைப் பல உறுதியான சான்றுகளால் காட்டினார் என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: தமது பாடுகளுக்குப் பின்பு தவறாத பல அத்தாட்சிகளால் தம்மை உயிருள்ளவராகக் காட்டினார்.
  rationale: கிரேக்கம் துன்பத்துக்குப் பிந்தைய உயிருள்ள நிலை மற்றும் அதை உறுதிப்படுத்தும் சான்றுகளைத் தெளிவாகக் கூறுகிறது. ‘தவறாத’ என்பது தேவையற்ற மிகைப்படுத்தலாக இருக்கலாம்; ‘பாடுகள்’ சில வாசகர்களுக்கு பழமையான சமயச் சொல்லாகத் தோன்றலாம்.
- issue: βασιλεία என்பதிலுள்ள ஆட்சி–அரசு பொருள் விரிவு
  choice: முதன்மை உரையில் ‘கடவுளின் ஆட்சி’ என்றும், ‘கடவுளின் அரசு’ என்பதை அடிக்குறிப்பில் மாற்றாகவும் தருவது.
  alternative: கடவுளின் அரசு / இறையரசு
  rationale: கிரேக்கச் சொல் கடவுளின் அரசாளுதலையும் அவரது ஆட்சிக்குட்பட்ட அரசையும் குறிக்கக்கூடும். ஒரு குறிப்பிட்ட சமய மரபின் நிலையான சொல்லை மட்டும் தேர்ந்தெடுத்து அந்தப் பொருள் விரிவை மறைக்காமல் அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: οἷς என்பதன் பாலின வெளிப்பாடு
  choice: அவர்களுக்கு
  alternative: அந்த ஆண்களுக்கு
  rationale: இதன் antecedent முந்தைய வசனத்தில் உள்ள அப்போஸ்தலர்கள் என்றாலும், இவ்வசனத்தின் கிரேக்கச் சுட்டுப்பெயரில் ‘ஆண்கள்’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லை. ஆகவே அதைச் சேர்க்காமல் நெருக்கமான தமிழாக்கம் வழங்கப்பட்டுள்ளது.
translation_notes:
  register: மொழிநடை நவீன, பொதுநிலை, கண்ணியமான தமிழில் அமைந்துள்ளது. ‘தேவன்/ராஜ்யம்’ அல்லது ‘இறையாட்சி’ போன்ற குறிப்பிட்ட திருச்சபை மரபுகளோடு வலுவாகத் தொடர்புடைய சொற்களுக்குப் பதிலாக, பொதுவாகப் புரியும் ‘கடவுளின் ஆட்சி’ பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
