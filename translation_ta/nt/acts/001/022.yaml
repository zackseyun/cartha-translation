  to: யோவான் கொடுத்த திருமுழுக்கிலிருந்து தொடங்கி, அவர் நம்மிடமிருந்து மேலே எடுத்துக்கொள்ளப்பட்ட நாள்வரை, இவர்களில் ஒருவர் அவருடைய உயிர்த்தெழுதலுக்கு நம்முடன் சாட்சியாக வேண்டும்.[a]
  rationale: The revision removes wording supplied from the preceding verse while preserving the explicit temporal qualification and the phrase ‘நம்முடன் சாட்சியாக,’ which renders σὺν ἡμῖν. No other change is needed.
