  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: ta
  text: யோவான் கொடுத்த திருமுழுக்கிலிருந்து தொடங்கி, அவர் நம்மிடமிருந்து மேலே எடுத்துக்கொள்ளப்பட்ட நாள்வரை, இவர்களில் ஒருவர் அவருடைய உயிர்த்தெழுதலுக்கு நம்முடன் சாட்சியாக வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனத்தின் ‘வேண்டும்’ என்பது முந்தைய வசனத்தில் உள்ள ‘ஆகவே ... வேண்டும்’ என்ற வாக்கிய அமைப்பிலிருந்து தொடர்கிறது.
    reason: cross_verse_syntax
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: யோவான் கொடுத்த திருமுழுக்கிலிருந்து தொடங்கி
  rationale: கிரேக்கத் தொடரின் காலத் தொடக்கத்தையும் பங்கேற்புவினையின் செயல்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. இங்கு Ἰωάννου என்பது யோவான் பெற்ற திருமுழுக்கை அல்ல, அவர் வழங்கிய திருமுழுக்குப் பணியைச் சுட்டுவதால் ‘கொடுத்த’ எனத் தெளிவாக்கப்பட்டது.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: நாள்வரை
  rationale: தொடங்கிய காலத்திலிருந்து முடியும் நாள்வரையிலான எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: நம்மிடமிருந்து மேலே எடுத்துக்கொள்ளப்பட்ட
  rationale: செயப்பாட்டு வடிவத்தையும் மேல்நோக்கிய ஏற்றத்தின் நுணுக்கத்தையும் காக்கிறது; ‘விண்ணேறினார்’ என்று மூலத்தில் இல்லாத வெளிப்பாட்டை விரிவாக்கவில்லை.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: அவருடைய உயிர்த்தெழுதலுக்கு ... சாட்சியாக
  rationale: தமிழில் ‘உயிர்த்தெழுதலுக்கு சாட்சி’ என்பது இயல்பான இணைப்பு; கிரேக்க மரபுவேற்றுமை உறவை நிகழ்வுக்குச் சாட்சி அளித்தல் என்ற பொருளில் வெளிப்படுத்துகிறது.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: நம்முடன் சாட்சியாக வேண்டும்
  rationale: முந்தைய வசனத்தின் δεῖ தரும் அவசியத்தை ‘வேண்டும்’ எனக் கொண்டுவருகிறது; தேர்ந்தெடுக்கப்படுபவர் ஏற்கெனவே உள்ளவர்களுடன் இணைந்து சாட்சியாக இருப்பதைத் தெளிவாக்குகிறது.
- source_word: ἕνα τούτων
  choice: இவர்களில் ஒருவர்
  rationale: அருகில் குறிப்பிடப்பட்ட தகுதியுடைய நபர்களைக் குறிக்கும் சுட்டுப்பெயரை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத ‘ஆண்கள்’ என்பதைக் கூட்டவில்லை.
theological_decisions:
- issue: முந்தைய வசனத்திலிருந்து தொடரும் அவசியப்பொருள்
  choice: ‘சாட்சியாக வேண்டும்’ என்று மொழிபெயர்த்தல்
  alternative: ‘சாட்சியாக ஆகுதல்’ என்று மட்டும் கூறுதல்
  rationale: இவ்வசனம் 1:21-இல் உள்ள δεῖ (‘வேண்டும்/அவசியம்’) என்பதன் ஆட்சிக்குள் தொடர்கிறது. முழுமையான தமிழ் வாக்கியத்தில் அந்த அவசியத்தை வெளிப்படுத்துவது புதிய கருத்தைச் சேர்ப்பதல்ல.
- issue: இயேசுவின் ஏற்றத்தைக் குறிக்கும் செயப்பாட்டு வினை
  choice: ‘மேலே எடுத்துக்கொள்ளப்பட்ட’
  alternative: ‘விண்ணேறிய’ அல்லது ‘எடுத்துச் செல்லப்பட்ட’
  rationale: மூலத்தின் செயப்பாட்டு வடிவத்தையும் மேல்நோக்கிய நுணுக்கத்தையும் காக்கிறது; இலக்கிடமாக ‘வானம்’ என்பதை வசனத்தில் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: உயிர்த்தெழுதலின் சாட்சியாகும் பணி
  choice: ‘அவருடைய உயிர்த்தெழுதலுக்கு நம்முடன் சாட்சியாக’
  alternative: ‘அவர் உயிர்த்தெழுந்தார் என்பதற்கு நம்முடன் சாட்சியாக’
  rationale: பெயர்ச்சொல் அமைப்பைத் தக்கவைத்து, சாட்சியின் உள்ளடக்கத்தை விளக்கவுரையாக விரிவாக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘திருமுழுக்கு’, ‘உயிர்த்தெழுதல்’, ‘சாட்சி’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. வசனம் முந்தைய வசனத்தின் நடுவிலிருந்து தொடர்வதால் தொடக்கத்தில் சிற்றெழுத்து வேறுபாடு தமிழில் பொருந்தாது; தொடர்ச்சியான காலத் தகுதி இயல்பான சொல் வரிசையில் தரப்பட்டுள்ளது.
