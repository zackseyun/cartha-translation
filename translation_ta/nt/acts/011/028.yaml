revisions:
- from: அவர்களில் அகபு என்னும் ஒருவர் எழுந்து நின்று, குடியிருக்கும் உலகம் முழுவதிலும் ஒரு பெரிய பஞ்சம் வரவிருக்கிறது என்று ஆவியானவர் மூலம் தெரிவித்தார்.[a] அது கிலவுதியுவின் காலத்தில் ஏற்பட்டது.
  to: அவர்களில் அகபு என்னும் ஒருவர் எழுந்து, மக்கள் வாழும் உலகம் முழுவதும்[a] ஒரு பெரிய பஞ்சம் வரவிருக்கிறது என்று ஆவியானவர் மூலம் தெரிவித்தார். அது கிளவுதியுவின் காலத்தில் ஏற்பட்டது.
  rationale: The revision corrects the proper-name spelling, removes an unnecessary verbal redundancy, makes the rendering of οἰκουμένη idiomatic in modern Tamil, and moves the note marker to its lexical anchor. It retains the source’s broad scope and does not resolve it as exclusively the Roman world.
