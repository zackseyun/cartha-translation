source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: ta
  text: அவர்களில் அகபு என்னும் ஒருவர் எழுந்து, மக்கள் வாழும் உலகம் முழுவதும்[a] ஒரு பெரிய பஞ்சம் வரவிருக்கிறது என்று ஆவியானவர் மூலம் தெரிவித்தார். அது கிளவுதியுவின் காலத்தில் ஏற்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உலகம் முழுவதும்’ என்றும் மொழிபெயர்க்கலாம். லூக்கா–அப்போஸ்தலர் நடபடிகளில் ‘மக்கள் வாழும் உலகம்’ என்பது இன்னும் குறிப்பாக ரோம உலகத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: எழுந்து நின்று
  rationale: கூட்டத்தில் அகபு எழுந்து பேசத் தொடங்கிய உடல்சார் செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐσήμανεν
  choice: தெரிவித்தார்
  rationale: σημαίνω என்பதன் ‘குறிப்பால் உணர்த்துதல்/தெரியப்படுத்துதல்’ என்ற பொருளைத் தருகிறது; முன்னறிவித்தார் என்று மொழிபெயர்த்து தீர்க்கதரிசன முறையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: διὰ τοῦ πνεύματος
  choice: ஆவியானவர் மூலம்
  rationale: διά + genitive இங்குக் கருவி அல்லது செயலாற்றும் முகமையைச் சுட்டுகிறது. அப்போஸ்தலர் நடபடிகளின் தீர்க்கதரிசனச் சூழலில் பரிசுத்த ஆவியானவரையே குறிக்கிறது.
- source_word: λιμὸν μεγάλην
  choice: ஒரு பெரிய பஞ்சம்
  rationale: λιμός என்பதை ‘பஞ்சம்’ என்றும் μεγάλην என்பதை நேரடியாக ‘பெரிய’ என்றும் மொழிபெயர்க்கிறது.
- source_word: μέλλειν ἔσεσθαι
  choice: வரவிருக்கிறது
  rationale: நெருங்கிய அல்லது எதிர்பார்க்கப்பட்ட எதிர்கால நிகழ்வைச் சுட்டும் μέλλω + infinitive அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: குடியிருக்கும் உலகம் முழுவதிலும்
  rationale: οἰκουμένη என்பதன் ‘மக்கள் குடியிருக்கும் உலகம்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; அதை முதன்மை உரையிலேயே ரோம உலகம் என்று குறுக்கவில்லை.
- source_word: ἥτις ἐγένετο
  choice: அது ... ஏற்பட்டது
  rationale: முன்னறிவிக்கப்பட்ட பஞ்சம் உண்மையில் நிகழ்ந்தது என்ற தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπὶ Κλαυδίου
  choice: கிலவுதியுவின் காலத்தில்
  rationale: ஒரு ஆட்சியாளரின் காலத்தைக் குறிக்கும் ἐπί + genitive அமைப்பை, மூலத்தில் இல்லாத ‘ஆட்சி’ என்ற சொல்லைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: διὰ τοῦ πνεύματος என்பதில் ‘ஆவி’ யாரைக் குறிக்கிறது
  choice: பரிசுத்த ஆவியானவரைக் குறிக்கும் வகையில் ‘ஆவியானவர்’
  alternative: பொதுவான ஓர் ஆவிக்குரிய தூண்டுதல்
  rationale: அப்போஸ்தலர் நடபடிகளில் தீர்க்கதரிசனச் சூழலில் ‘ஆவி’ என்பது வழக்கமாகப் பரிசுத்த ஆவியானவரைக் குறிக்கிறது.
- issue: οἰκουμένη என்பதன் பரப்பு
  choice: முதன்மை உரையில் ‘குடியிருக்கும் உலகம் முழுவதிலும்’
  alternative: ‘உலகம் முழுவதிலும்’ அல்லது ‘ரோம உலகம் முழுவதிலும்’
  rationale: கிரேக்கச் சொல்லின் பரந்த பொருளை முதன்மை உரை பாதுகாக்கிறது; லூக்கா–அப்போஸ்தலர் நடபடிகளில் அது குறிப்பாக ரோம உலகத்தையும் குறிக்கக்கூடும் என்பதைக் குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘ஆவியானவர் மூலம்’ என்பது இயல்பான முகமைத் தொடர்பையும், ‘குடியிருக்கும் உலகம்’ என்பது மூலத்தின் பொருள் பரப்பையும் பாதுகாக்கிறது.
