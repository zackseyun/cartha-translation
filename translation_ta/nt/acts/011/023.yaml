source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: ta
  text: அவர் வந்து, தேவனுடைய அருளைக்[a] கண்டு மகிழ்ந்தார். மேலும், அவர்கள் அனைவரையும் உள்ளத்தில் உறுதியான நோக்கத்தோடு ஆண்டவரோடு நிலைத்திருக்கும்படி[b] தொடர்ந்து ஊக்கப்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இச்சொற்றொடர், அவர்கள் நடுவில் காணக்கூடியதாக இருந்த தேவனுடைய அருள்செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆண்டவரில் தொடர்ந்து நிலைத்திருக்கும்படி” அல்லது “ஆண்டவருக்கு உண்மையாய் நிலைத்திருக்கும்படி.”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: வந்து
  rationale: இறந்தகாலப் பங்கேற்புவினை பர்னபா அங்கு வந்ததைச் சுருக்கமாகக் குறிக்கிறது; தமிழில் ‘வந்து’ இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: ἰδὼν
  choice: கண்டு
  rationale: ὁράω என்பதன் சாதாரண காணுதல் என்ற பொருளைப் பேணுகிறது; தேவனுடைய செயலை உணர்ந்தார் என்று விளக்கமாக விரிவாக்கவில்லை.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: தேவனுடைய அருளை
  rationale: χάρις என்பதன் இறையியல் செறிவைப் பேணுகிறது; அது அந்தியோகியாவில் காணப்பட்ட தேவனுடைய அருள்செயலைக் குறிக்கலாம் என்றாலும், ‘தேவன் செய்தவை’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: ἐχάρη
  choice: மகிழ்ந்தார்
  rationale: இச்சூழலில் இயல்பான தமிழ்; கிரேக்க வினையின் மகிழ்ச்சி என்ற நேரடிப் பொருளைப் பேணுகிறது.
- source_word: παρεκάλει
  choice: தொடர்ந்து ஊக்கப்படுத்தினார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் காட்டுகிறது; παρακαλέω என்பதிலுள்ள ஊக்குவித்தல் மற்றும் வலியுறுத்தல் ஆகிய இரு நிழற்பொருள்களுக்கும் ஏற்றதாக உள்ளது.
- source_word: πάντας
  choice: அவர்கள் அனைவரையும்
  rationale: சூழலில் குறிப்பிடப்படும் விசுவாசிகள் அனைவரையும் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: மன உறுதியோடு
  rationale: πρόθεσις என்பது நோக்கம் அல்லது உறுதியையும், καρδία உள்ளார்ந்த மனதையும் சித்தத்தையும் குறிக்கிறது; ‘மன உறுதியோடு’ என்பது நவீன தமிழில் இயல்பாக இவற்றை ஒருங்கிணைக்கிறது.
- source_word: προσμένειν
  choice: நிலைத்திருக்கும்படி
  rationale: தொடர்ந்து இணைந்திருத்தல், பற்றுறுதியுடன் நீடித்திருத்தல் ஆகிய பொருள்களைச் சுமக்கிறது; அளவுக்கு மீறிய இறையியல் விளக்கத்தைச் சேர்க்காமல் தொடர்ந்த பற்றை வெளிப்படுத்துகிறது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவரில்
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது. தமிழில் ‘ஆண்டவரில் நிலைத்திருத்தல்’ என்பது அவருடனான தொடர்ந்த உறவையும் பற்றையும் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்க வேற்றுமையின் சாத்தியமான நிழற்பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: ‘தேவனுடைய அருள்’ என்பதன் சூழல்சார் பொருள்
  choice: அந்தியோகியா விசுவாசிகளிடையே காணக்கூடியதாக இருந்த தேவனுடைய அருள்செயல்
  alternative: தேவனிடமிருந்து வரும் அருள்நிலை அல்லது விசுவாசிகளின் அருளுள்ள தன்மை
  rationale: மொழிபெயர்ப்பு ‘தேவன் செய்ததை’ என்று விளக்கிப் பொருளைக் குறுக்காமல், மூலத்தின் இறையியல் செறிவையும் சாத்தியமான பரப்பையும் பேணுகிறது.
- issue: προσμένειν τῷ κυρίῳ என்பதன் வலிமை
  choice: ஆண்டவருடன் பற்றுறவிலே தொடர்ந்து நிலைத்திருத்தல்
  alternative: ஆண்டவரோடு தொடர்ந்து இருத்தல் அல்லது ஆண்டவருக்கு உண்மையாய் நிலைத்திருத்தல்
  rationale: கிரேக்கம் நீடித்த இணைப்பையும் உறுதியான பற்றையும் தெரிவிக்கிறது. ‘நிலைத்திருக்க’ என்பது இதைத் தெளிவாகச் சொல்லுகிறது; பின்னாளைய ஒரு குறிப்பிட்ட கோட்பாட்டுச் சொல்லாட்சியைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. மூலத்தின் பங்கேற்புவினைகளை தமிழுக்கேற்ற தொடர் வாக்கிய அமைப்பாக மாற்றுகிறது; ἐχάρη மற்றும் παρεκάλει ஆகியவற்றின் தனித்த செயற்பாடுகள் தெளிவாக இருக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் உரிய இடங்களில் இடம்பெற்றுள்ளன.
