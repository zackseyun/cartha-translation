  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: ta
  text: ஆண்டவரின் கை அவர்களோடு இருந்தது[a]. நம்பின பெருந்திரளானோர்[b] ஆண்டவரிடம் திரும்பினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு விதமாக, “ஆண்டவருடைய கை.” இச்சொற்றொடர் ஆண்டவரின் செயலாற்றும் வல்லமையையோ ஆதரவையோ குறிக்கும் வேதாகம மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: வேறு விதமாக, “நம்பி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: ஆண்டவரின் கை
  rationale: ஆண்டவரின் செயலாற்றும் வல்லமையையும் ஆதரவையும் குறிக்கும் வேதாகம உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இச்சூழலில் இயேசுவையோ பொதுவாகக் கடவுளையோ சுட்டக்கூடிய கிரேக்கப் பட்டத்தைத் தெளிவுபடுத்திச் சுருக்காமல் நிலையான தமிழ்ப் பட்டமாகப் பாதுகாக்கிறது.
- source_word: μετ’ αὐτῶν
  choice: அவர்களோடு
  rationale: μετά என்பதன் இயல்பான 'உடன்' என்ற பொருளையும் ஆண்டவரின் உடனிருப்பையும் ஆதரவையும் தெரிவிக்கிறது.
- source_word: πολύς τε ἀριθμός
  choice: பெருந்திரளான மக்கள்
  rationale: அதிக எண்ணிக்கையிலான மனிதர்களைக் குறிக்கும் பெயர்ச்சொல் அமைப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὁ πιστεύσας
  choice: நம்பிக்கை கொண்ட
  rationale: இறந்தகாலப் பங்கேற்பு வினைச்சொல்லின் பொருளை இயல்பாகத் தருகிறது; நம்புதலும் திரும்புதலும் இடையிலான துல்லியமான கால அல்லது தர்க்க உறவை வலுக்கட்டாயமாக நிர்ணயிக்கவில்லை.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: ஆண்டவரிடம் திரும்பினார்கள்
  rationale: மனமாற்றத்தைக் குறிக்கும் திசைமாற்ற உருவகத்தைப் பாதுகாக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத 'மனந்திரும்புதல்' போன்ற கூடுதல் கோட்பாட்டுச் சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இரு இடங்களிலும் வரும் κύριος என்பதன் குறிப்பு
  choice: இரண்டையும் 'ஆண்டவர்' என்று மட்டும் மொழிபெயர்த்தல்
  alternative: '''இயேசு'' என்று வெளிப்படையாகக் குறிப்பிடுதல் அல்லது பொதுவாகக் ''கடவுள்'' என்று குறிப்பிடுதல்'
  rationale: அப்போஸ்தலர் நடபடிகளில், குறிப்பாக மனமாற்றச் சூழலில், κύριος இயேசுவைக் குறிக்கக்கூடும்; எனினும் கிரேக்க மூலத்தில் 'ஆண்டவர்' என்றே இருப்பதால் அதன் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
- issue: ὁ πιστεύσας மற்றும் ἐπέστρεψεν ஆகியவற்றின் உறவு
  choice: முதன்மை உரையில் 'நம்பிக்கை கொண்ட ... திரும்பினார்கள்' என்று இயல்பாக வழங்கி, மாற்று வடிவை அடிக்குறிப்பில் காட்டுதல்
  alternative: '''நம்பிக்கை கொண்டு, ஆண்டவரிடம் திரும்பினார்கள்'' என்று தொடர்ச்சியான செயல்களாக வெளிப்படையாக அமைத்தல்'
  rationale: அயோரிஸ்ட் பங்கேற்பு வினைச்சொல் முன் நிகழ்வைக் குறிக்கக்கூடும்; ஆனால் அதன் கால அல்லது தர்க்க வரிசையைத் தமிழ் உரையில் அளவுக்கு மீறி தீர்மானிக்காமல் இருப்பது மூலத்தின் நெகிழ்வை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. 'ஆண்டவரின் கை' என்ற மூல உருவகம் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; வாக்கியத்தை இயல்பாக்க ஒருமை கிரேக்க வினைச்சொல் தமிழில் பொருள் சார்ந்த பன்மையாக வழங்கப்பட்டுள்ளது.
