base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: ta
  text: அந்த நாட்களில், தீர்க்கதரிசிகள் எருசலேமிலிருந்து அந்தியோகியாவுக்கு இறங்கி வந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமிலிருந்து அந்தியோகியாவுக்கு இறங்கிச் சென்றனர்.” கிரேக்க வினைச்சொல்லை வருகையின் பார்வையில் ‘இறங்கி வந்தனர்’ என்றும், புறப்படுதலின் பார்வையில் ‘இறங்கிச் சென்றனர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: அந்த நாட்களில்
  rationale: இது காலச் சூழலைக் குறிக்கிறது. δέ மென்மையான இணைப்பாக இருப்பதால், தமிழில் தனியாக ஒரு கூடுதல் சொல்லைச் சேர்க்காமல் இயல்பான கதைத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κατῆλθον
  choice: இறங்கி வந்தனர்
  rationale: κατέρχομαι என்பது ‘கீழே போ/வா’ என்ற பொருளைக் கொண்டது. இலக்காகிய அந்தியோகியாவை நோக்கிய வருகையைத் தமிழில் இயல்பாகச் சொல்ல ‘இறங்கி வந்தனர்’ பயன்படுத்தப்பட்டுள்ளது; ‘இறங்கிச் சென்றனர்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: எருசலேமிலிருந்து
  rationale: ἀπό புறப்படும் இடத்தைக் குறிக்கிறது. கிரேக்கத்தில் நகரப் பெயர் இலக்கண வடிவில் பன்மையாக இருந்தாலும், தமிழின் வழக்கமான ஒருமைப் பெயரான ‘எருசலேம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: προφῆται
  choice: தீர்க்கதரிசிகள்
  rationale: ஆரம்பத் திருச்சபையில் இவர்களுடைய பணியின் துல்லியமான எல்லையை வசனம் விளக்காததால், விளக்கவுரைப் பதத்திற்கு மாறாமல் பரவலாக அறியப்பட்ட நேரடியான சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἰς Ἀντιόχειαν
  choice: அந்தியோகியாவுக்கு
  rationale: εἰς ஓர் இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; நகரப் பெயருடன் ‘அந்தியோகியாவுக்கு’ என்பது இயல்பான நவீனத் தமிழ் நடை.
theological_decisions:
- issue: எருசலேம்–அந்தியோகியா திருச்சபைச் சூழலில் ‘தீர்க்கதரிசிகள்’ என்போரின் பணியின் இயல்பு
  choice: προφῆται என்பதை அதன் பரந்த பொருளைத் தக்கவைத்து ‘தீர்க்கதரிசிகள்’ என்று மொழிபெயர்த்தல்
  alternative: தீர்க்கதரிசன ஆசிரியர்கள்; இறைத்தூண்டுதல் பெற்ற தூதர்கள்
  rationale: இந்த இடத்தில் கிரேக்க உரை இவர்களுடைய ஊழியத்தைப் பழைய ஏற்பாட்டு நூலாசிரியத் தீர்க்கதரிசிகளாகவோ, வெறும் அருள்வரம்பெற்ற பிரசங்கிகளாகவோ குறுக்கி வரையறுக்கவில்லை. ஆகவே எந்தக் குறிப்பிட்ட கோட்பாட்டு விளக்கத்தையும் புகுத்தாமல் மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வந்தனர்’ என்ற மரியாதைமிக்க பன்மை வினைமுற்று சுருக்கமான வேதாகம உரைநடைக்கு ஏற்றது; இடப்பெயர்கள் வழக்கமான தமிழ் வடிவங்களில் தரப்பட்டுள்ளன.
