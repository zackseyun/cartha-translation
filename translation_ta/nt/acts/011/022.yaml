source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: ta
  text: அவர்களைப் பற்றிய செய்தி எருசலேமிலிருந்த திருச்சபையின் செவிகளுக்கு எட்டியது[a]. அவர்கள் பர்னபாவை அந்தியோகியா வரை அனுப்பிவைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எருசலேமிலிருந்த திருச்சபை அவர்களைப் பற்றிய செய்தியைக் கேள்விப்பட்டது’; சொற்படி, ‘அவர்களைப் பற்றிய செய்தி எருசலேமிலிருந்த திருச்சபையின் செவிகளுக்குள் கேட்கப்பட்டது.’
    reason: கிரேக்கச் செயல்படுபொருள் வடிவத்தையும் ‘செவிகளுக்குள்’ என்ற மூல உருவகத்தையும் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἠκούσθη
  choice: எட்டியது
  rationale: வினைச்சொல் சொற்படி ‘கேட்கப்பட்டது’ என்றாலும், εἰς τὰ ὦτα என்பதுடன் சேர்ந்து ஒரு செய்தி ஒருவரின் கவனத்துக்கு வந்ததைக் குறிக்கிறது. ‘எட்டியது’ என்பது அந்தச் செயல்படுபொருள் வடிவத்தின் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ὁ λόγος
  choice: செய்தி
  rationale: இங்கு λόγος என்பது முந்தைய நிகழ்வுகளையும் மக்களையும் பற்றிய தகவலைக் குறிக்கிறது; ஆகவே ‘வார்த்தை’ என்பதைவிட ‘செய்தி’ சூழலுக்கு இயல்பானது.
- source_word: εἰς τὰ ὦτα
  choice: செவிகளுக்கு
  rationale: தகவல் திருச்சபையின் கவனத்துக்கு வந்தது என்ற கிரேக்க உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் காக்கிறது.
- source_word: ἐκκλησίας
  choice: திருச்சபை
  rationale: அப்போஸ்தலர் பணிகள் நூலில் இது கிறிஸ்தவ விசுவாசிகளின் சமூகத்தைக் குறிக்கிறது; நவீன தரமான தமிழ் வேதாகம நடையில் ‘திருச்சபை’ பொருத்தமானது.
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: எருசலேமிலிருந்த
  rationale: எந்தத் திருச்சபை என்பதைக் குறிப்பிடும் பங்கேற்புவினைத் தொடரைச் சுருக்கமின்றி இயல்பான தமிழில் அடையாளப்படுத்துகிறது.
- source_word: περὶ αὐτῶν
  choice: அவர்களைப் பற்றிய
  rationale: αὐτῶν என்பது முந்தைய சூழலில் கூறப்பட்ட மக்களை இயல்பாகச் சுட்டுகிறது. நிகழ்வுகளையும் உள்ளடக்கக்கூடிய சுட்டின் சிறிய தெளிவின்மை சூழலில் தொடர்கிறது.
- source_word: ἐξαπέστειλαν
  choice: அனுப்பிவைத்தார்கள்
  rationale: வெளியே அனுப்புதல் அல்லது ஒரு பணிக்காக அனுப்பிவைத்தல் என்ற கூட்டு வினையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Βαρναβᾶν
  choice: பர்னபாவை
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டு, வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: ἕως Ἀντιοχείας
  choice: அந்தியோகியா வரை
  rationale: ἕως காட்டும் எல்லை அல்லது சேருமிட உணர்வைக் காக்கிறது; வெறும் ‘அந்தியோகியாவுக்கு’ என்று மாற்றுவதைக் காட்டிலும் மூலத்தின் வடிவத்துக்கு நெருக்கமானது.
theological_decisions:
- issue: ‘அவர்கள் அனுப்பிவைத்தார்கள்’ என்பதன் எழுவாய்
  choice: எருசலேமிலிருந்த திருச்சபையை ஒட்டுமொத்தமாகச் சுட்டும் பன்மை
  alternative: திருச்சபைக்குள் பெயர் குறிப்பிடப்படாத அப்போஸ்தலர்கள் அல்லது தலைவர்கள் அனுப்பினர்
  rationale: அருகிலுள்ள வெளிப்படையான முன்னிலைச் சொல் ‘எருசலேமிலிருந்த திருச்சபை’ என்பதே. மூலவசனம் குறிப்பிட்ட தலைமைக்குழுவைப் பெயரிடாததால், மொழிபெயர்ப்பும் அத்தகைய கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. செய்தி கவனத்துக்கு வந்தது என்ற செவி உருவகம் காக்கப்பட்டுள்ளது; அதே நேரத்தில் மிகச் சொற்படியான இயல்பற்ற நடை அடிக்குறிப்பில் தரப்பட்டுள்ளது. δὲ-க்கு இங்கு தனியான காலச்சுட்டான ‘இப்போது’ சேர்க்கப்படவில்லை; வசனத் தொடர் தமிழில் இயல்பாக விடப்பட்டுள்ளது.
