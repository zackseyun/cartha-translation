source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: ta
  text: ஆகவே, ஸ்தேவானை முன்னிட்டு எழுந்த உபத்திரவத்தால்[a] சிதறிப்போனவர்கள் பொனிக்கே, சைப்பிரசு, அந்தியோகியா வரைக்கும் சென்று, யூதர்களுக்கு மட்டுமே வார்த்தையை[b] அறிவித்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உபத்திரவம்’ என்பதற்கு ‘துன்புறுத்தல்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சூழலுக்கேற்ப துன்பம், நெருக்கடி அல்லது துன்புறுத்தலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வார்த்தை’ என்பது இங்கு இயேசுவைப் பற்றி அறிவிக்கப்பட்ட செய்தியைக் குறிக்கிறது; ‘செய்தி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'கிரேக்க மூலத்தில் வலியுறுத்தல் உள்ளது: ‘யூதர்களுக்கு மட்டுமே’ அல்லது ‘யூதர்களைத் தவிர வேறு யாருக்கும் அல்ல.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: διασπαρέντες
  choice: சிதறிப்போனவர்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு எச்சத்தின் பொருளை இயல்பான தமிழில் தருகிறது; முந்தைய நிகழ்வினால் அவர்கள் பல இடங்களுக்குச் சிதறியதையும் காக்கிறது.
- source_word: θλίψεως
  choice: உபத்திரவத்தால்
  rationale: θλῖψις என்பதன் துன்பம், நெருக்கடி, ஒடுக்குதல் ஆகிய பரந்த பொருள் வரம்பைத் தக்கவைக்கிறது; இச்சூழலில் துன்புறுத்தல் என்ற குறிப்பான பொருளும் சாத்தியம்.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: ஸ்தேவானை முன்னிட்டு எழுந்த
  rationale: ἐπί + வேற்றுமை உருபின் தொடர்பு/காரண நுணுக்கத்தை, ஸ்தேவானுடைய சம்பவத்தைச் சுற்றி உபத்திரவம் எழுந்தது என்றவாறு இயல்பாகத் தெரிவிக்கிறது.
- source_word: διῆλθον ἕως
  choice: வரைக்கும் சென்று
  rationale: பயணத்தின் புவியியல் எல்லையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: பெனிக்கே, சீப்புரு, அந்தியோகியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட இடப்பெயர் வடிவங்களைப் பயன்படுத்துகிறது.
- source_word: μηδενὶ λαλοῦντες
  choice: அறிவித்துவந்தார்கள்
  rationale: சொல்லை மற்றவர்களிடம் பேசிப் பகிர்ந்த செயலை இயல்பான தமிழில் தருகிறது; வெறும் உரையாடல் அல்ல, அறிவிப்புச் சூழல் என்பதை வெளிப்படுத்துகிறது.
- source_word: τὸν λόγον
  choice: இறைவார்த்தையை
  rationale: லூக்காவின் தொடர்ச்சியான கருப்பொருள் சொல்லாட்சியைத் தக்கவைத்து, இங்கு கடவுளிடமிருந்து வரும் அறிவிக்கப்பட்ட செய்தி என்பதை இயல்பான தமிழில் உணர்த்துகிறது; ‘செய்தி’ என்பது மாற்று.
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: யூதர்களுக்கு மட்டுமே
  rationale: εἰ μή மற்றும் μόνον இணைந்து தரும் வலியுறுத்தப்பட்ட வரம்பை இயல்பான தமிழில் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: ஸ்தேவானுடைய சம்பவத்திற்குப் பின் ஏற்பட்ட பகைமையின் தன்மை
  choice: மூல உரையின் பரந்த பொருளைக் காக்க ‘உபத்திரவம்’ என்று மொழிபெயர்த்தல்
  alternative: துன்புறுத்தல்
  rationale: சூழல் துன்புறுத்தலைக் குறித்தாலும், θλῖψις என்ற சொல் துன்பம் அல்லது நெருக்கடி என்ற பரந்த பொருளுடையது; முதன்மை உரையில் அதைக் குறுக்காமல் மாற்று வாசிப்பை அடிக்குறிப்பில் தருகிறது.
- issue: அப்போஸ்தலர் நடபடிகளில் τὸν λόγον என்பதன் பொருள்
  choice: ‘இறைவார்த்தை’ என்ற கருப்பொருள் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: இயேசுவைப் பற்றிய செய்தி
  rationale: இது அறிவிக்கப்பட்ட கிறிஸ்தவச் செய்தியைக் குறித்தாலும், ‘நற்செய்தி’ போன்ற விரிவாக்கம் மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: செய்தி யாருக்கு அறிவிக்கப்பட்டது என்பதிலுள்ள கட்டுப்பாடு
  choice: ‘யூதர்களுக்கு மட்டுமே’ என்று வலியுறுத்தலைத் தெளிவாகக் காத்தல்
  alternative: யூதர்களைத் தவிர வேறு யாருக்கும் இல்லை
  rationale: εἰ μὴ μόνον என்ற இரட்டை வரம்புக் குறிப்பைத் தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் தருகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஸ்தேவான்’, ‘பெனிக்கே’, ‘சீப்புரு’, ‘அந்தியோகியா’ ஆகியவை பரவலாக அறியப்பட்ட தமிழ் வேதாகமப் பெயர்வடிவங்கள். மூலத்தின் நீண்ட வாக்கிய அமைப்பு வாசிக்கத்தக்க தமிழாக மாற்றப்பட்டாலும், காரணம், பயண எல்லை, செய்தி, கேட்போர் வரம்பு ஆகிய அனைத்தும் காக்கப்பட்டுள்ளன.
