  language: ta
  text: எனவே சீடர்கள் ஒவ்வொருவரும் தத்தமது வசதிக்கேற்ப[a], யூதேயாவில் வாழும் சகோதரர்களுக்கு[b] நிவாரண உதவி அனுப்பத் தீர்மானித்தார்கள்.
  philosophy: optimal-equivalence
