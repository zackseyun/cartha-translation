- source_word: εἰς διακονίαν πέμψαι
  choice: நிவாரண உதவி அனுப்ப
  rationale: διακονία என்பது பொதுவாகச் சேவை அல்லது உதவியைக் குறித்தாலும், இச்சூழலில் யூதேயாவிலுள்ள தேவையுற்ற விசுவாசிகளுக்கான நடைமுறை உதவியைக் குறிக்கிறது; தமிழில் ‘நிவாரண உதவி அனுப்ப’ என்பது அந்தச் சூழற்பொருளை இயல்பாகத் தருகிறது.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
