- source_word: καθὼς εὐπορεῖτό τις
  choice: ஒவ்வொருவரும் தத்தமது வசதிக்கேற்ப
  rationale: ஒவ்வொருவரிடமும் இருந்த பொருளாதார வசதி அல்லது கொடுக்கக்கூடிய அளவுக்கு ஏற்ப என்பதைக் கூறும் கிரேக்கச் சொற்றொடரின் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ὥρισαν
  choice: தீர்மானித்தார்கள்
  rationale: ஆலோசித்து முடிவெடுத்தல் அல்லது உறுதியாகத் தீர்மானித்தல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἕκαστος αὐτῶν
  choice: ஒவ்வொருவரும்
