theological_decisions:
- issue: யூதேயாவிலுள்ள கிறிஸ்தவச் சமூகத்தைக் குறிக்கும் ἀδελφοῖς என்ற ஆண்பால் குடும்ப உறவுச் சொல்
  choice: சகோதரர்களுக்கு
  alternative: சகோதர சகோதரிகளுக்கு; சக விசுவாசிகளுக்கு
  rationale: மூல கிரேக்கம் ஆண்பால் பன்மையைப் பயன்படுத்துகிறது; ஆரம்பக் கிறிஸ்தவ வழக்கில் அது பெண்களையும் உள்ளடக்கிய சமூகத்தைக் குறிக்கக்கூடும். மூல வடிவத்தை முதன்மை உரையில் காத்து, அதன் சாத்தியமான உள்ளடக்கப் பரப்பை அடிக்குறிப்பில் விளக்குவது தெளிவற்ற தன்மையைச் செயற்கையாகத் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தத்தமது வசதிக்கேற்ப’ என்பது பொருளாதார வளத்திற்கேற்ப கொடுத்ததை இயல்பாகக் கூறுகிறது; ‘நிவாரண உதவி’ பஞ்சச் சூழலில் διακονία என்பதன் நடைமுறைப் பொருளை வெளிப்படுத்துகிறது.
