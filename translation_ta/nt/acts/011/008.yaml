source:
  edition: SBLGNT
  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: ta
  text: ஆனால் நான், ‘இல்லவே இல்லை, ஆண்டவரே! ஏனெனில் பொதுவானதோ அசுத்தமானதோ எதுவும் ஒருபோதும் என் வாய்க்குள் சென்றதில்லை’ என்றேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: ஒருபோதும் முடியாது
  rationale: வலுவான மறுப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: நேரடி அழைப்பின் மரியாதையையும் மூலத்தின் இறையியல் திறந்தநிலையையும் காக்கிறது.
- source_word: κοινὸν
  choice: பொதுவானது
  rationale: சடங்குமுறைப் பார்வையில் தூய்மையற்றதாகக் கருதப்பட்டதை குறிக்கும் மூலச்சொல்லின் தனித்த கருத்தை, ἀκάθαρτον என்பதோடு ஒன்றாக்காமல் காக்கிறது.
- source_word: ἀκάθαρτον
  choice: அசுத்தமானது
  rationale: தூய்மையின்மையைக் குறிக்கும் வழக்கமான வேதாகமச் சொல்லாட்சியைப் பயன்படுத்துகிறது.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: என் வாய்க்குள் சென்றதில்லை
  rationale: மூலத்தின் உடலுறுப்பு சார்ந்த நேரடி உருவகத்தைப் பேணுகிறது; சூழலில் உண்பதைக் குறிக்கிறது.
theological_decisions:
- issue: κοινὸν மற்றும் ἀκάθαρτον ஆகியவற்றின் தொடர்பு
  choice: ‘பொதுவானதோ அசுத்தமானதோ’ என்று இரு தனிச் சொற்களாக வைக்கப்பட்டது.
  alternative: இரண்டையும் ‘தீட்டானது’ என்ற ஒரே கருத்தாக இணைத்தல்.
  rationale: மூலத்தில் உள்ள வேறுபாட்டையும் சட்டம்/சடங்கு சார்ந்த பதற்றத்தையும் முன்கூட்டியே தீர்க்காமல் பாதுகாக்கிறது.
- issue: ὅτι என்பதன் உறவு
  choice: ‘ஏனெனில்’
  alternative: ‘அதாவது’ அல்லது தொடர்புச்சொல் இன்றி மொழிபெயர்த்தல்.
  rationale: பேதுருவின் மறுப்புக்கான காரணத்தை வெளிப்படையாகக் காட்டும் காரணவியல் வாசிப்பைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க நேரடி உரை. மூலத்தின் வலுவான மறுப்பும் ‘பொதுவானது/அசுத்தமானது’ என்ற இரட்டைச் சொல்லாட்சியும் பாதுகாக்கப்பட்டுள்ளன.
