source:
  edition: SBLGNT
  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: ta
  text: ஆனால் பேதுரு எருசலேமுக்குப் போனபோது, விருத்தசேதனத்தைச் சார்ந்தவர்கள்[a] அவருடன் வாதிட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: ‘விருத்தசேதனத்தைச் சேர்ந்தவர்கள்,’ ‘விருத்தசேதனப் பிரிவினர்,’ அல்லது ‘விருத்தசேதனம் செய்யப்பட்ட விசுவாசிகள்.’ கிரேக்க மொழி, விருத்தசேதனத்துடனான தொடர்பின் அடிப்படையில் ஒரு குழுவை அடையாளப்படுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ஆனால் …போது
  rationale: δέ கதை நகர்வுடன் மெல்லிய முரண்பாட்டையும் குறிக்கிறது; ‘ஆனால்’ அதை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἀνέβη
  choice: போனபோது
  rationale: எருசலேமுக்குச் செல்வதை ‘மேலே போதல்’ எனக் கூறும் மூலமொழி மரபை, தமிழில் இயல்பாக ‘போனபோது’ என வழங்குகிறது; செயற்கையான நிலவியல் சொல்லாக்கம் தவிர்க்கப்படுகிறது.
- source_word: Ἰερουσαλήμ
  choice: எருசலேம்
  rationale: தமிழ் வேதாகம மரபில் நன்கு அறியப்பட்ட இடப்பெயர் வடிவம்.
- source_word: διεκρίνοντο
  choice: வாதிட்டுக்கொண்டிருந்தார்கள்
  rationale: இங்கு நேரடியாக வெளிப்படும் எதிர்ப்பையும், இறந்தகாலத் தொடர்நிலை வினையின் நீடித்த செயலையும் வெளிப்படுத்துகிறது.
- source_word: πρὸς αὐτόν
  choice: அவருடன்
  rationale: வாதம் ஒருவரை நோக்கி, அவரோடு நிகழ்ந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; ‘அவருக்கு எதிராக’ என்பதைக் காட்டிலும் தேவையற்ற பகைமைத் தீவிரத்தைச் சேர்க்காது.
- source_word: οἱ ἐκ περιτομῆς
  choice: விருத்தசேதனத்தைச் சார்ந்தவர்கள்
  rationale: ‘விருத்தசேதனத்திலிருந்து/விருத்தசேதனத்தைச் சேர்ந்தவர்கள்’ என்ற குழு அடையாளத்தைத் தக்கவைக்கிறது; எல்லா யூத விசுவாசிகளையும் குறித்ததாகவோ, முறையாக அமைந்த கட்சியாகவோ மிகத் தெளிவுபடுத்திவிடாது.
theological_decisions:
- issue: οἱ ἐκ περιτομῆς என்பவர்களின் அடையாளம்
  choice: விருத்தசேதனத்தால் அடையாளப்படுத்தப்பட்டு பேதுருவை எதிர்த்த ஒரு குழுவைத் திறந்த நிலையில் குறித்தல்
  alternative: எல்லா யூத விசுவாசிகளும்; அல்லது பிற்காலத்தில் முறையாக அமைந்த ‘விருத்தசேதனக் கட்சி’
  rationale: கிரேக்கத் தொடர் விருத்தசேதனத்துடன் தொடர்புடைய ஒரு குழுவைக் குறிக்கிறது; ஆனால் அந்தக் குழுவின் அமைப்பையும் எல்லையையும் துல்லியமாக நிர்ணயிக்கவில்லை. எனவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘விருத்தசேதனம்’ என்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; தொடர்ச்சியான வாக்குவாதத்தை ‘வாதிட்டுக்கொண்டிருந்தார்கள்’ வெளிப்படுத்துகிறது.
