lexical_decisions:
- source_word: ἐξῆλθεν
  choice: புறப்பட்டுச் சென்றார்
  rationale: ἐξέρχομαι என்பதிலுள்ள வெளியே சென்று புறப்படும் இயக்க நுணுக்கத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘சென்றார்’ என்பதைவிட மூலத்திற்கு நெருக்கமானது.
- source_word: δὲ
  choice: பின்பு
  rationale: இங்கு δέ எதிர்மறை வேறுபாட்டைக் காட்டாமல் கதையை அடுத்த நிகழ்வுக்கு நகர்த்தும் மென்மையான இணைப்பாக உள்ளது; ‘பின்பு’ தமிழில் இயல்பான தொடர்ச்சியை அளிக்கிறது.
- source_word: εἰς Ταρσόν
  choice: தர்சுவுக்கு
  rationale: இயக்க வினையுடன் εἰς இலக்கிடத்தைச் சுட்டுகிறது; ‘தர்சுவுக்கு’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: ἀναζητῆσαι
  choice: தேடுவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் இறந்தகால எச்சவினையின் பொருளைத் தெளிவாகக் காட்டுகிறது. ἀναζητέω வெறுமனே பார்ப்பதைவிட முயன்று தேடும் கருத்தையும் ஏற்கக்கூடும்; அந்த நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Σαῦλον
  choice: சவுலை
  rationale: பெயர் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு முறையில் தரப்பட்டு, வினையின் செயப்படுபொருளுக்குரிய ‘ஐ’ வேற்றுமை உருபைப் பெறுகிறது.
