translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், அதன் இயக்கம், நோக்கம், கதைத்தொடர்ச்சி ஆகியவை இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
