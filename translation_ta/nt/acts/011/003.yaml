  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγοντες ὅτι ⸂Εἰσῆλθες πρὸς ἄνδρας ἀκροβυστίαν ἔχοντας καὶ συνέφαγες⸃ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: ta
  text: “விருத்தசேதனம் செய்யப்படாத ஆண்களிடம்[a] நீர் உள்ளே சென்று, அவர்களோடு உணவருந்தினீரே!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இச்சொற்றொடர் விருத்தசேதனம் என்ற யூத உடன்படிக்கை அடையாளத்தைப் பெறாதவர்களைக் குறிக்கிறது; அதாவது, புறவினத்தாரை.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: என்றார்கள்
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் நிகழ்காலப் பங்கேற்புச் சொல்லை, முந்தைய வசனத்தோடு இயல்பாக இணையும் தமிழ் மேற்கோள் அமைப்பில் வழங்குகிறது.
- source_word: Εἰσῆλθες πρὸς
  choice: நீர் ... ஆண்களிடம் சென்று
  rationale: அவர்களிடம் சென்று அவர்களுடன் பழகியதைக் குறிக்கும் குற்றச்சாட்டை இயல்பான தமிழில் தருகிறது; ‘உள்ளே நுழைந்தீர்’ என்பது தமிழில் இங்கு தேவையற்ற இடவியல் அழுத்தத்தை ஏற்படுத்தும்.
- source_word: ἄνδρας ἀκροβυστίαν ἔχοντας
  choice: விருத்தசேதனம் செய்யப்படாத ஆண்கள்
  rationale: ἄνδρας என்பதன் ஆண்பால் குறிப்பையும், உடன்படிக்கையின் அடையாளமான விருத்தசேதனம் இல்லாத நிலையை வலியுறுத்தும் யூதச் சொல்லாட்சியையும் காக்கிறது; விளக்கமாக ‘புறவினத்தார்’ என்று மட்டும் மாற்றவில்லை.
- source_word: συνέφαγες αὐτοῖς
  choice: அவர்களோடு சேர்ந்து சாப்பிட்டீரே
  rationale: συνεσθίω என்பதில் உள்ள ஒன்றாக உணவருந்துதல் என்ற கருத்தையும், குற்றஞ்சாட்டும் பேச்சின் தொனியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀκροβυστίαν ἔχοντας என்பதை ‘புறவினத்தார்’ என்று விளக்கமாக மொழிபெயர்ப்பதா, அல்லது விருத்தசேதனமின்மையை நேரடியாகக் காப்பதா
  choice: விருத்தசேதனம் செய்யப்படாத ஆண்கள்
  alternative: புறவினத்து ஆண்கள்
  rationale: பேசுகிறவர்கள் எழுப்பிய எதிர்ப்பு வெறும் இன அடையாளத்தைப் பற்றியது அல்ல; உடன்படிக்கை மற்றும் சமூகத் தூய்மை எல்லைகளின் அடையாளமான விருத்தசேதனத்தை மையமாகக் கொண்டது. நேரடி சொல்லாட்சி அந்த இறையியல் மற்றும் சமூகப் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன வாசகர்களுக்குப் புரியும் மரியாதையான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நீர்’ மற்றும் ‘சாப்பிட்டீரே’ ஆகியவை நேரடி குற்றச்சாட்டின் மரியாதை ஒருமையையும் கண்டனத் தொனியையும் காக்கின்றன; ‘விருத்தசேதனம்’ என்பது வேதாகமச் சூழலில் நிலைபெற்ற துல்லியமான சொல்.
