- from: இதோ, உடனே செசரியாவிலிருந்து என்னிடம் அனுப்பப்பட்ட மூன்று ஆண்கள் நாங்கள் இருந்த வீட்டுக்கு வந்து நின்றார்கள்.
  to: இதோ, உடனே[a] செசரியாவிலிருந்து என்னிடம் அனுப்பப்பட்ட மூன்று ஆண்கள் நாங்கள் இருந்த வீட்டுக்கு வந்து சேர்ந்தார்கள்.
