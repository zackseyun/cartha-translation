translation_notes:
  register: நவீன நிலையான தமிழ்; வாய்மொழிக் கதையாடலுக்கேற்ற எளிமையையும் வேதாகம உரைக்குரிய கண்ணியத்தையும் சமநிலைப்படுத்துகிறது. ‘இதோ’ மூலத்தின் கவன ஈர்ப்பு வலிமையைக் காக்கிறது; ‘வந்து நின்றார்கள்’ வருகை மற்றும் உடனிருப்பு ஆகிய இரண்டையும் இயல்பாகத் தெரிவிக்கிறது.
