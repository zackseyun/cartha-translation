  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: ta
  text: இதோ, உடனே[a] செசரியாவிலிருந்து என்னிடம் அனுப்பப்பட்ட மூன்று ஆண்கள் நாங்கள் இருந்த வீட்டுக்கு வந்து சேர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கணமே” அல்லது “அப்போதே.”
    reason: ἐξαυτῆς என்பதன் உடனடித்தன்மையையும் முந்தைய நிகழ்வுடனான நெருங்கிய காலத் தொடர்பையும் காட்டும் சொல் மாற்றுகள்.
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: நிகழப்போகும் முக்கியமான திருப்பத்தின்மீது கவனத்தை ஈர்க்கும் உரையாடல் குறியீட்டின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐξαυτῆς
  choice: உடனே
  rationale: முந்தைய நிகழ்வைத் தொடர்ந்து தாமதமின்றி நிகழ்ந்ததைத் தெளிவாகக் காட்டுகிறது; ‘அந்தக் கணமே’ என்பதும் சாத்தியம்.
- source_word: τρεῖς ἄνδρες
  choice: மூன்று ஆண்கள்
  rationale: எண்ணையும் ஆண்பாலைக் குறிக்கும் ἄνδρες என்பதையும் நேரடியாகக் காக்கிறது.
- source_word: ἐπέστησαν ἐπὶ τὴν οἰκίαν
  choice: வீட்டுக்கு வந்து நின்றார்கள்
  rationale: அவர்கள் அந்த வீட்டை வந்தடைந்து அங்கே நின்றார்கள் என்ற சூழல்சார் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐν ᾗ ἦμεν
  choice: நாங்கள் இருந்த
  rationale: தங்கியிருந்தார்கள் என்று மேலதிகமாக விளக்காமல், மூலத்தின் எளிய இடக் குறிப்பை அப்படியே காக்கிறது.
- source_word: ἀπεσταλμένοι
  choice: அனுப்பப்பட்ட
  rationale: அவர்களுடைய வருகைக்கு முன்னரே அவர்கள் அனுப்பப்பட்டிருந்ததைச் சுருக்கமான இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀπὸ Καισαρείας
  choice: செசரியாவிலிருந்து
  rationale: ἀπό குறிக்கும் புறப்பட்ட இடத்தை நிலையான தமிழ் இடப்பெயர்ப்புடன் வழங்குகிறது.
- source_word: πρός με
  choice: என்னிடம்
  rationale: பேதுருவே அவர்கள் அனுப்பப்பட்ட இலக்கு என்பதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
