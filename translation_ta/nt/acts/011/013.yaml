id: ACT.11.13
reference: Acts 11:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπήγγειλεν ⸀δὲ ἡμῖν πῶς εἶδεν τὸν ἄγγελον ἐν τῷ οἴκῳ αὐτοῦ σταθέντα καὶ ⸀εἰπόντα· Ἀπόστειλον εἰς ⸀Ἰόππην καὶ μετάπεμψαι Σίμωνα τὸν ἐπικαλούμενον Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: ta
  text: அவர் தமது வீட்டில் அந்தத் தூதர் நின்றுகொண்டு, ‘யோப்பாவுக்கு அனுப்பி, பேதுரு என்று அழைக்கப்படும் சீமோனை வரவழை[a]’ என்று சொல்வதை அவர் எப்படிக் கண்டார் என்பதை எங்களிடம் விவரித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேதுரு என்று அழைக்கப்படும் சீமோனை அழைத்துவர அனுப்பு.’
    reason: μετάπεμψαι என்ற வினை ஒருவரை அழைத்து வருவதற்காக அனுப்புதல் என்ற நுணுக்கத்தையும் கொண்டுள்ளது.
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: விவரித்தார்
  rationale: ἀπαγγέλλω என்பது கண்ட நிகழ்வை மற்றவர்களிடம் அறிவிப்பதையோ எடுத்துரைப்பதையோ குறிக்கிறது. இங்கு ‘விவரித்தார்’ என்பது πῶς என்பதோடு இயல்பாக இணைந்து, அவர் கண்டதைப் பற்றிய கணக்கைச் சொன்னார் என்ற பொருளைத் தருகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல் இடப்படவில்லை
  rationale: δέ மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது. இந்தத் தனி வசனத்தில் தமிழில் ‘மேலும்’ அல்லது ‘ஆனால்’ என்று வெளிப்படையாகச் சேர்ப்பது தேவையற்ற வலியுறுத்தலை உருவாக்கும்; வாக்கியத் தொடர்ச்சியே அதன் பணியைச் செய்கிறது.
- source_word: πῶς
  choice: எப்படி
  rationale: அவர் தூதரைக் கண்ட விதத்தையும் நிகழ்வின் விவரத்தையும் அறிமுகப்படுத்தும் πῶς என்பதன் நுணுக்கத்தைப் பாதுகாக்கிறது; வெறும் ‘என்று’ எனத் தட்டையாக்கவில்லை.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: இறந்தகால நிகழ்வைக் குறிக்கும் அஓரிஸ்ட் வடிவம். தமிழில் சூழலும் துணைவினை அமைப்பும், இந்தக் காணுதல் பின்னர் விவரித்ததற்கு முந்தியது என்பதைத் தெளிவாக்குவதால் கூடுதல் காலக் குறிப்பு தேவையில்லை.
- source_word: τὸν ἄγγελον
  choice: அந்தத் தூதர்
  rationale: கிரேக்கக் குறிப்புச் சுட்டும் முந்தைய கதைச் சூழலும் ஒரு குறிப்பிட்ட தூதரைக் காட்டுகின்றன. ‘அந்தத் தூதர்’ என்பது தமிழில் அந்த உரைக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: தமது வீட்டில்
  rationale: οἶκος இங்கு வசிப்பிடமாகிய வீட்டைக் குறிக்கிறது. ‘தமது’ என்பது வாக்கியத்தின் எழுவாயான அவர் தம் சொந்த வீட்டைப் பற்றிச் சொல்வதைத் தெளிவாக்குகிறது.
- source_word: σταθέντα
  choice: நின்றுகொண்டு
  rationale: தூதரின் நிலைப்பாட்டையும் அதனுடன் இணைந்த பேச்சையும் தமிழில் இயல்பான தொடர்வினை அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: εἰπόντα
  choice: சொல்வதை
  rationale: σταθέντα என்பதுடன் இணைந்துள்ள பங்கேற்பு வடிவத்தைத் தமிழில் தொடர்ச்சியான செயல் அமைப்பாக வைத்திருக்கிறது.
- source_word: Ἀπόστειλον εἰς Ἰόππην
  choice: யோப்பாவுக்கு ஆள் அனுப்பி
  rationale: Ἀπόστειλον என்பது ஒருமை ஏவல். கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் இலக்கை நோக்கி ஒருவரை அனுப்பி அடுத்த செயலைச் செய்வித்தல் என்பதைக் கூற ‘ஆள் அனுப்பி’ என்பது இயல்பான குறைந்தபட்ச நிரப்பல்; குறிப்பிட்ட எண்ணிக்கையையோ நபர்களையோ நிர்ணயிக்கவில்லை.
- source_word: μετάπεμψαι
  choice: வரவழை
  rationale: μεταπέμπομαι என்பது ஒருவரை அழைத்துவரும்படி அனுப்புதல், அதாவது அவரை வரச் செய்தல். ‘வரவழை’ இந்த விளைவைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ‘ஆள் அனுப்பி அழைத்துவா’ என்ற மூல நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὸν ἐπικαλούμενον Πέτρον
  choice: பேதுரு என்று அழைக்கப்படும் சீமோனை
  rationale: ἐπικαλούμενον என்பது சீமோனை அவர் வழக்கமாக அழைக்கப்படும் மற்றொரு பெயரால் அடையாளப்படுத்துகிறது. இவ்வடிவம் அந்த அடையாளப்படுத்தும் செயல்பாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
