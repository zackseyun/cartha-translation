  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கக்கூடிய, அதேவேளையில் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்தத் தூதர்’ என்பது குறிப்பிட்ட தூதரைக் காட்டுகிறது; ‘தமது/தாம்’ என்பவை அவர் தம் வீட்டில் கண்டதைத் தாமே விவரித்தார் என்ற தொடர்பைத் தெளிவாக்குகின்றன. இடப்பெயர் ‘யோப்பா’, நபர் பெயர்கள் ‘சீமோன்’ மற்றும் ‘பேதுரு’ என்ற பரவலான தமிழ் வேதாகம வடிவங்களில் தரப்பட்டுள்ளன.
