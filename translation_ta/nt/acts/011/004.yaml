lexical_decisions:
- source_word: ἀρξάμενος
  choice: விளக்கத் தொடங்கி
  rationale: இறந்தகால நடுவினைப் பெயரெச்சம் முதன்மை வினையோடு வினையடைபோல் இணைகிறது. இயல்பான நவீன தமிழில் ‘விளக்கத் தொடங்கி’ என்பது தொடக்கச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் எழுந்த குற்றச்சாட்டிலிருந்து பேதுருவின் பதிலுக்கு மாறும் மென்மையான எதிர்மறைத் தொடர்பை இது வெளிப்படுத்துகிறது.
- source_word: Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ἐξετίθετο
  choice: நடந்தவற்றை ... விளக்க
  rationale: இச்சூழலில் ஒரு விவகாரத்தை விரிவாக எடுத்துரைத்தல் அல்லது முன்வைத்தல் என்ற பொருள். ‘நடந்தவற்றை’ என்பது தமிழில் வினையின் கருப்பொருளை இயல்பாக வெளிப்படுத்துகிறது; இது முந்தைய நிகழ்வுகளைக் குறிக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: பேதுருவிடம் குற்றம் சாட்டியவர்களைக் குறிக்கும் பன்மை வேற்றுமைச் சுட்டுப்பெயரின் நேரான தமிழ் வடிவம்.
- source_word: καθεξῆς
  choice: வரிசையாக
  rationale: நிகழ்வுகளை ஒன்றன்பின் ஒன்றாக ஒழுங்கில் எடுத்துரைத்தார் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: λέγων
  choice: சொன்னார்
  rationale: அடுத்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் பெயரெச்சத் தொடர்பை தமிழில் இயல்பான தொடர்வினை அமைப்பான ‘விளக்கத் தொடங்கிச் சொன்னார்’ என்பதால் வெளிப்படுத்துகிறது.
