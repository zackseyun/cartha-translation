revisions:
- from: அவரைக் கண்டுபிடித்ததும், அவரை அந்தியோகியாவுக்கு அழைத்து வந்தார். அவர்கள் ஓராண்டு முழுவதும் திருச்சபையாரோடு கூடிவந்து[a], திரளான மக்களுக்குக் கற்பித்தார்கள்; சீடர்கள் முதன்முதலில் “கிறிஸ்தவர்கள்” என்று அழைக்கப்பட்டது அந்தியோகியாவில்தான்[b].
  to: அவரைக் கண்டுபிடித்ததும், அவரை அந்தியோகியாவுக்கு அழைத்து வந்தார். அவர்கள் ஒரு முழு ஆண்டுக்கு திருச்சபையினருடன் கூடி, திரளான மக்களுக்குக் கற்பித்தார்கள்; சீடர்கள் முதன்முதலில் “கிறிஸ்தவர்கள்” என்று அழைக்கப்பட்டார்கள் அந்தியோகியாவில்தான்[b].
  rationale: The revision corrects the required plural personal passive agreement in the final clause and in the explanatory quotation. It also makes the church-community expression more idiomatic without deciding the debated building-versus-community nuance beyond what the text safely conveys. Footnote a is no longer needed because the revised wording already communicates the community sense, and no unresolved lexical ambiguity requires a note in this short verse.
