id: ACT.11.26
reference: Acts 11:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: ta
  text: அவரைக் கண்டுபிடித்ததும், அவரை அந்தியோகியாவுக்கு அழைத்து வந்தார். அவர்கள் ஒரு முழு ஆண்டுக்கு திருச்சபையினருடன் கூடி, திரளான மக்களுக்குக் கற்பித்தார்கள்; சீடர்கள் முதன்முதலில் “கிறிஸ்தவர்கள்” என்று அழைக்கப்பட்டார்கள் அந்தியோகியாவில்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: கிரேக்க உரை, “சீடர்கள் முதன்முதலில் கிறிஸ்தவர்கள் என்று அழைக்கப்பட்டார்கள்” என்கிறது. இந்தப் பெயர் அந்தியோகியாவில் பொதுமக்கள் பயன்படுத்திய அடையாளப் பெயராகத் தோன்றியிருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: கண்டுபிடித்ததும்
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பை, இயல்பான தமிழில் காலத் தொடர்போடு வெளிப்படுத்துகிறது.
- source_word: ἤγαγεν
  choice: அழைத்து வந்தார்
  rationale: சவுலை அந்தியோகியாவுக்குக் கூட்டிவந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐνιαυτὸν ὅλον
  choice: ஓராண்டு முழுவதும்
  rationale: கால அளவைக் குறிக்கும் சொற்றொடரின் முழுமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: திருச்சபையாரோடு கூடிவந்து
  rationale: ἐκκλησία என்பதை ஒரு கட்டடமாக அல்லாமல் விசுவாசிகளின் சமூகமாகப் புரிந்துகொள்ள வழிவகுக்கிறது; கூடுகையின் தொடர்ச்சியையும் சூழலுக்கேற்ற தமிழில் காட்டுகிறது.
- source_word: ἐκκλησίᾳ
  choice: திருச்சபையார்
  rationale: இங்கு கிறிஸ்தவச் சமூகத்தைக் குறிக்கிறது; ‘திருச்சபையார்’ என்பது மக்களோடு கூடினார்கள் என்ற பொருளைத் தெளிவாக்குகிறது.
- source_word: διδάξαι
  choice: கற்பித்தார்கள்
  rationale: இணைக்கப்பட்ட வினையெச்சக் கருத்தை இயல்பான தமிழ் இறந்தகால வினையாக வழங்குகிறது.
- source_word: ὄχλον ἱκανόν
  choice: திரளான மக்களுக்கு
  rationale: ἱκανός இங்கு கணிசமான எண்ணிக்கையைக் குறிக்கிறது; ‘திரளான மக்கள்’ இயல்பாகவும் மிகைப்படுத்தாமலும் உள்ளது.
- source_word: χρηματίσαι
  choice: என்று அழைக்கப்பட்டது
  rationale: ஒரு பெயரால் பொதுவாக அடையாளப்படுத்தப்பட்டார்கள் என்ற பொருளைப் பாதுகாக்கும்; இந்தப் பெயரை யார் வழங்கினார்கள் என்பதை உரை குறிப்பிடாததால் செயப்பாட்டு வடிவம் வைக்கப்படுகிறது.
- source_word: πρώτως
  choice: முதன்முதலில்
  rationale: இந்தப் பெயரிடல் நிகழ்ந்த முதல் இடம்/நிகழ்வை இயல்பான தமிழில் குறிக்கிறது.
- source_word: Χριστιανούς
  choice: கிறிஸ்தவர்கள்
  rationale: இது Χριστός என்ற பட்டத்தின் நேரடி பயன்பாடு அல்ல, நிலைபெற்ற குழுப் பெயர்; தமிழில் வழக்கமானதும் பொருள்துல்லியமுமான பெயர் ‘கிறிஸ்தவர்கள்’.
theological_decisions:
- issue: Χριστιανούς என்ற குழுப் பெயரை எவ்வாறு வழங்குவது
  choice: கிறிஸ்தவர்கள்
  alternative: மேசியாவினர்
  rationale: இங்கு சொல் ஒரு நிலைபெற்ற பொதுப் பெயராக உள்ளது. ‘மேசியாவினர்’ என்பது சொல்லின் தோற்றத்தை முன்னிறுத்தி, தமிழில் இல்லாத ஒரு தனிப்பிரிவு நுணுக்கத்தை உருவாக்கக்கூடும்.
- issue: ἐν τῇ ἐκκλησίᾳ என்பது கட்டடத்தையா சமூகத்தையா குறிக்கிறது
  choice: திருச்சபையாரோடு
  alternative: திருச்சபையில்
  rationale: முதல் நூற்றாண்டுச் சூழலில் ἐκκλησία முதன்மையாகக் கூடிவரும் விசுவாசிகளின் சமூகத்தைக் குறிக்கிறது. இருப்பினும் கிரேக்க முன்னிடைச்சொல்லின் அமைப்பால் ‘திருச்சபையில்’ என்ற வாசிப்பும் இலக்கணரீதியாக சாத்தியம்; இதை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீன தரத் தமிழ்; கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் நடை. ‘திருச்சபையார்’ என்பதன் மூலம் ἐκκλησία கட்டடம் அல்ல, மக்கள் சமூகம் என்பதை முதன்மை உரையிலேயே தெளிவாக்கப்பட்டுள்ளது. கிரேக்கத்தின் தொடர்ச்சியான அமைப்பு தமிழில் இயல்பாக இருக்க அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளது.
