id: ACT.11.18
reference: Acts 11:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: ta
  text: அவர்கள் இவற்றைக் கேட்டபோது அமைதியடைந்து, கடவுளை மகிமைப்படுத்தி, “அப்படியானால், வாழ்வுக்கு வழிவகுக்கும் மனந்திரும்புதலைப் புறவினத்தாருக்கும்[a] கடவுள் அருளியிருக்கிறார்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பிற இனத்தாருக்கும்.” இங்கு ἔθνεσιν என்பது யூதரல்லாதவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “வாழ்வை நோக்கிய மனந்திரும்புதலை” அல்லது “வாழ்வுக்கான மனந்திரும்புதலைக் கடவுள் கொடுத்தார்” என்றும் மொழிபெயர்க்கலாம். εἰς ζωήν என்பது வாழ்வை இலக்காகவோ விளைவாகவோ சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: அவர்கள் இவற்றைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; δέ இங்கு மென்மையான இணைப்பாக இருப்பதால் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: ἡσύχασαν
  choice: அமைதியடைந்து
  rationale: எதிர்ப்பதை நிறுத்தி அமைதியானார்கள் என்ற சூழல்சார் பொருளையும், பேசாமல் போனார்கள் என்ற அடிப்படை நுணுக்கத்தையும் அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
- source_word: ἐδόξασαν τὸν θεόν
  choice: கடவுளை மகிமைப்படுத்தி
  rationale: லூக்கா–அப்போஸ்தலர் பணிகளில் δοξάζω கொண்டுள்ள இறையியல் நிறையைப் பேணுகிறது.
- source_word: Ἄρα καὶ
  choice: அப்படியானால் … கூட
  rationale: பேதுருவின் அறிக்கையிலிருந்து அவர்கள் வந்த முடிவையும், கடவுளின் செயல் யூதரல்லாதவர்களுக்கும் விரிவடைந்ததையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: τοῖς ἔθνεσιν
  choice: புறவினத்தாருக்கு
  rationale: இச்சூழலில் அரசியல் நாடுகளை அல்ல, யூதரல்லாத மக்களைக் குறிக்கிறது.
- source_word: τὴν μετάνοιαν
  choice: மனந்திரும்புதலை
  rationale: μετάνοια என்பது வெறும் கருத்துமாற்றத்தைவிட ஆழமான மனமாற்றத்தையும் கடவுளை நோக்கித் திரும்புதலையும் குறிக்கக்கூடியதால், தமிழில் நிலைபெற்றும் பொருத்தமாகவும் உள்ள சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: εἰς ζωὴν
  choice: வாழ்வுக்கு வழிவகுக்கும்
  rationale: εἰς குறிக்கும் இலக்கு அல்லது விளைவு ஆகிய இரண்டையும் முற்றிலும் ஒன்றாகத் தீர்மானிக்காமல், நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔδωκεν
  choice: அருளியிருக்கிறார்
  rationale: கடவுள் மனந்திரும்புதலைக் கொடுத்தார் என்பதையும், நிறைவேறிய அச்செயலின் தற்போதைய முக்கியத்துவத்தையும் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: மனந்திரும்புதல் கடவுள் அளிக்கும் ஒன்றாகச் சித்தரிக்கப்படுதல்
  choice: “கடவுள் அருளியிருக்கிறார்” என்று மொழிபெயர்த்து, மனந்திரும்புதலைக் கடவுள் அளித்ததாகவே வைத்தல்
  alternative: “கடவுள் கொடுத்தார்”
  rationale: கிரேக்க உரை மனந்திரும்புதலைக் கடவுள் அளித்ததாகத் தெளிவாகக் கூறுகிறது. ஆனால் மனிதப் பதில்செயல் அல்லது இரட்சிப்பின் செயல்முறை பற்றிய விரிவான கோட்பாட்டை இந்த வசனத்திற்கு மேலாகச் சேர்க்கவில்லை.
- issue: εἰς ζωήν என்பதன் இலக்கு அல்லது விளைவு
  choice: “வாழ்வுக்கு வழிவகுக்கும்”
  alternative: “வாழ்வை நோக்கிய” அல்லது “வாழ்வுக்கான”
  rationale: இச்சொற்றொடர் வாழ்வை இலக்காகவோ விளைவாகவோ சுட்டலாம்; முதன்மை உரை இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது, அடிக்குறிப்பு மாற்று வடிவங்களைப் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. “புறவினத்தார்,” “மனந்திரும்புதல்,” “மகிமைப்படுத்துதல்” ஆகியவை வேதாகமச் சூழலில் நிலைபெற்ற சொற்களாக இருந்தாலும் வாக்கிய அமைப்பு இயல்பாக வைக்கப்பட்டுள்ளது.
