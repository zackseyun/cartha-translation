  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: ta
  text: இது மூன்று முறை நடந்தது; அப்போது அனைத்தும் மீண்டும் வானத்துக்குள் மேலே இழுக்கப்பட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: இது
  rationale: முன்பு விவரிக்கப்பட்ட நிகழ்வைச் சுட்டுகிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘தரிசனம்’ என்ற சொல்லைச் சேர்க்காமல் இயல்பாக உள்ளது.
- source_word: δὲ
  choice: ; பின்பு
  rationale: கதை ஓட்டத்தில் இரண்டு நிகழ்வுகளை மென்மையாக இணைக்கிறது; தமிழில் அரைப்புள்ளியும் ‘பின்பு’ என்பதும் இயல்பான தொடர்ச்சியைத் தருகின்றன.
- source_word: ἐγένετο
  choice: நடந்தது
  rationale: ஒரு நிகழ்வு நிகழ்ந்ததைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἐπὶ τρίς
  choice: மூன்று முறை
  rationale: அதே நிகழ்வு மூன்று தடவை நிகழ்ந்தது என்ற பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀνεσπάσθη
  choice: இழுத்துக்கொள்ளப்பட்டது
  rationale: வெளிப்படையாகக் குறிப்பிடப்படாத ஒரு செய்பவரால் மேல்நோக்கி இழுக்கப்பட்டதைக் காட்டும் வினையின் செயப்பாட்டு வடிவத்தையும் உருவகத்தையும் காக்கிறது.
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: மீண்டும் அல்லது முன்பிருந்த இடத்துக்குத் திரும்பச் செய்யப்பட்ட இயக்கத்தை இயல்பாகக் குறிக்கிறது.
- source_word: ἅπαντα
  choice: அனைத்தும்
  rationale: துணியையோ விலங்குகளையோ மட்டும் குறிப்பதாக வரையறுக்காமல், மூலத்தின் விரிவான மற்றும் தெளிவுபடுத்தப்படாத குறிப்பைப் பாதுகாக்கிறது.
- source_word: εἰς τὸν οὐρανόν
  choice: வானத்துக்குள்
  rationale: εἰς என்பதன் உள்ள்நோக்கிய இயக்கத்தைப் பாதுகாக்கிறது; தரிசனச் சூழலில் οὐρανός வெறும் காணக்கூடிய ஆகாயத்தைவிட பரலோக வானத்தைக் குறிக்கிறது.
theological_decisions:
- issue: பேதுருவின் தரிசன அறிக்கையில் ἅπαντα என்பதன் குறிப்பு
  choice: ‘அனைத்தும்’ என்று விரிவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அது முழுவதும்’, ‘எல்லா விலங்குகளும்’, அல்லது ‘அந்தத் துணி முழுவதும்’
  rationale: கிரேக்க நடுநிலைப் பன்மை அனைத்தையும் உள்ளடக்குகிறது; ஆனால் இந்த வசனத்தில் குறிப்பிட்ட ஒன்றை மட்டும் வெளிப்படையாகச் சுட்டவில்லை. எனவே குறிப்பைச் சுருக்காமல் மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified narrative நடை. செயப்பாட்டு வடிவமும் மேல்நோக்கிய இயக்க உருவகமும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
