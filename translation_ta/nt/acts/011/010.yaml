  source_fidelity: 'கருத்து பெரும்பாலும் துல்லியமானது: τοῦτο, ἐπὶ τρίς, ἅπαντα, πάλιν, மற்றும் εἰς τὸν οὐρανόν ஆகியவை நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் ἀνεσπάσθη என்பது மேல்நோக்கிய இயக்கத்தை வெளிப்படையாகக் கொண்டது; தற்போதைய ‘இழுத்துக்கொள்ளப்பட்டது’ அதனைத் தெளிவாகச் சொல்லவில்லை. மேலும் δέ-க்கு ‘பின்பு’ என்பது காலவரிசைத் தொடர்ச்சியைச் சேர்க்கிறது; மூலத்தில் அது மெலிந்த இணைப்பே.'
  naturalness: ‘வானத்துக்குள் இழுத்துக்கொள்ளப்பட்டது’ புரியத்தக்கது; இருப்பினும் ‘மேலே இழுக்கப்பட்டது’ சேர்த்தால் தமிழில் இயல்பாகவும் காட்சியின் இயக்கம் தெளிவாகவும் இருக்கும். ‘மீண்டும்’ என்பது இச்சூழலில் ‘மறுபடியும்’ என்பதைக் காட்டிலும் சுருக்கமாகவும் நவீன நடையிலும் உள்ளது.
