review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Peter as the referent, retains the future sense, renders ῥήματα in the plural, conveys the instrumental force of ἐν οἷς, and preserves the collective scope of the household. However, ‘மீட்கப்படுவீர்கள்’ is broader than σωθήσῃ in this gospel-and-salvation context and can readily suggest rescue or redemption rather than salvation.
  naturalness: ‘வார்த்தைகளைப் பேசுவார்’ is understandable but not idiomatic modern standard Tamil; ‘வார்த்தைகளைச் சொல்வார்’ is natural. The coordinated expression and plural final verb are natural Tamil for Cornelius together with his household.
  terminology: Use ‘இரட்சிக்கப்படுவீர்கள்’ for σωθήσῃ. This is the established clear Tamil term for salvation in this context and does not add a doctrinal mechanism. ‘வீட்டார் அனைவரும்’ suitably renders the household rather than a physical house.
  issues:
  - severity: medium
    issue: ‘மீட்கப்படுவீர்கள்’ for σωθήσῃ
    rationale: While lexically related, ‘மீட்கப்படுதல்’ in contemporary Tamil may denote rescue, release, or redemption. In Acts 11:14, where the proclaimed words are the means of salvation, ‘இரட்சிக்கப்படுவீர்கள்’ more precisely conveys the source-context sense.
  - severity: low
    issue: ‘வார்த்தைகளைப் பேசுவார்’ is less idiomatic
    rationale: Modern Tamil normally says ‘வார்த்தைகளைச் சொல்வார்’ when ‘words’ is the object. This retains the plural ῥήματα without altering meaning.
  - severity: low
    issue: Footnote wording follows the broader term ‘மீட்பு’
    rationale: Once σωθήσῃ is rendered as salvation, the explanatory note should consistently refer to ‘இரட்சிப்பு’.
