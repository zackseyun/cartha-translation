revisions:
- from: அவர் உன்னிடம் வார்த்தைகளைப் பேசுவார்; அவற்றின் மூலம் நீயும் உன் வீட்டார் அனைவரும் மீட்கப்படுவீர்கள்.[a]
  to: அவர் உன்னிடம் வார்த்தைகளைச் சொல்வார்; அவற்றின் மூலம் நீயும் உன் வீட்டார் அனைவரும் இரட்சிக்கப்படுவீர்கள்.[a]
  rationale: The revision improves idiomatic Tamil and uses the contextually precise salvation term for σωθήσῃ, while retaining the Greek plural ‘words,’ the instrumental relation of the words to salvation, and the inclusive reference to Cornelius and his entire household. It does not specify how household members receive salvation beyond what the verse states.
