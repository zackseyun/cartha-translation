  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: ta
  text: அவர் உன்னிடம் வார்த்தைகளைச் சொல்வார்; அவற்றின் மூலம் நீயும் உன் வீட்டார் அனைவரும் இரட்சிக்கப்படுவீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவற்றில்’ அல்லது ‘அவற்றின் வழியாக’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொற்றொடர், அந்த வார்த்தைகளே இரட்சிப்பு வருவதற்கான வழிமுறை என்பதைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: அவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பேதுருவைக் குறிக்கும் தொடர்புப்பெயர். தமிழில் தனி வாக்கியமாக இயல்பாக அமைய ஆண்பால் மரியாதைச் சுட்டுப்பெயர் பயன்படுத்தப்படுகிறது.
- source_word: λαλήσει
  choice: பேசுவார்
  rationale: எதிர்கால வினையான λαλέω என்பதன் அடிப்படைப் பொருளான ‘பேசுதல்’ என்பதையும் செய்தி அறிவிக்கப்படும் தன்மையையும் காக்கிறது.
- source_word: ῥήματα
  choice: வார்த்தைகளை
  rationale: பன்மை வடிவத்தை ‘செய்தி’ என்று ஒருமைப்படுத்தாமல், கிரேக்கத்தின் நேரடியான concrete பொருளைத் தக்கவைக்கிறது.
- source_word: πρὸς σὲ
  choice: உன்னிடம்
  rationale: பேசுதல் வினையுடன் πρός + accusative கேட்பவரை நோக்கிய திசையைச் சுட்டுகிறது; ‘உன்னிடம்’ என்பது இயல்பான தமிழாக்கம்.
- source_word: ἐν οἷς
  choice: அவற்றின் மூலம்
  rationale: ἐν இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது; அந்த வார்த்தைகள் மீட்பு வரும் வழிமுறை என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: σωθήσῃ
  choice: மீட்கப்படுவீர்கள்
  rationale: σῴζω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்தையும் இச்சூழலின் இரட்சிப்பு சார்ந்த பொருளையும் காக்கிறது. ‘நீயும் ... அனைவரும்’ என்ற கூட்டெழுவாய்க்கேற்ப தமிழில் பன்மை வினை பயன்படுத்தப்படுகிறது.
- source_word: σὺ
  choice: நீயும்
  rationale: கிரேக்கத்தில் வெளிப்படையாக வரும் வலியுறுத்தப்பட்ட இரண்டாம் நபர் எழுவாயைத் தக்கவைத்து, வீட்டாருடன் இணைக்கும் καί-ஐ ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: πᾶς ὁ οἶκός σου
  choice: உன் வீட்டார் அனைவரும்
  rationale: οἶκος கட்டிடத்தை அல்ல, குடும்பம் அல்லது வீட்டைச் சேர்ந்த மக்களைக் குறிக்கிறது. ‘வீட்டார் அனைவரும்’ அதன் கூட்டுப் பரப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: கொர்நேலியுவின் வீட்டார் சூழலில் σωθήσῃ என்பதன் பொருள்
  choice: ‘மீட்கப்படுவீர்கள்’ என்று மொழிபெயர்த்து, அறிவிக்கப்படும் வார்த்தைகளின் மூலம் வரும் இரட்சிப்பை உரை கூறும் அளவிலேயே வைத்திருக்கிறது.
  alternative: ‘விடுவிக்கப்படுவீர்கள்’
  rationale: உடனடிச் சூழல் நற்செய்தியைக் கேட்டு இரட்சிப்பைப் பெறுவதைப் பற்றியது. இந்தச் சொல் இரட்சிப்பு சார்ந்த வலிமையைக் காக்கிறது; ஆனால் ஒவ்வொருவரும் அதில் எவ்வாறு பங்குபெறுகிறார்கள் என்பது குறித்த பிற்கால கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ‘உன் வீட்டார் அனைவரும்’ என்பதன் பரப்பு
  choice: முழு வீட்டாரையும் கூட்டாகக் குறிக்கிறது; தனிநபரின் பதிலளிப்பின்றி தானாகவே இரட்சிப்பு கிடைக்கும் என்று கூறவில்லை.
  alternative: ‘உன் வீடு முழுவதும்’
  rationale: வாக்குறுதியின் பரப்பு வீட்டார் அனைவரையும் உள்ளடக்குகிறது; ஆனால் அதன் எல்லா கதைசார் அல்லது இறையியல் நிபந்தனைகளையும் இந்த வசனம் தனியே விளக்கவில்லை. எனவே எந்தச் சபைப் பிரிவின் தனிப்பட்ட வீட்டார்-இரட்சிப்புக் கோட்பாடும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. பேதுருவைக் குறிக்க ‘அவர்/பேசுவார்’ என்ற மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ஒருமை ‘நீ’ மற்றும் பன்மை ‘வீட்டார் அனைவரும்’ சேர்ந்த கூட்டெழுவாயால் இறுதி வினை ‘மீட்கப்படுவீர்கள்’ எனப் பன்மையில் அமைந்துள்ளது.
