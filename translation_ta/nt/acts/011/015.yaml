source:
  edition: SBLGNT
  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: ta
  text: நான் பேசத் தொடங்கியபோது[a], பரிசுத்த ஆவியானவர் அவர்கள்மேல் இறங்கினார்; தொடக்கத்தில் நம்மேலும் இறங்கியதுபோலவே.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் பேசத் தொடங்கிய உடனே.” கிரேக்க அமைப்பு, நான் பேசத் தொடங்கிய நேரத்திலேயே இது நிகழ்ந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தொடக்கத்தில்” என்பது சீடர்கள்மேல் பரிசுத்த ஆவியானவர் முதன்முதலில் பொழியப்பட்ட பெந்தெகொஸ்தே நாளைக் குறிக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: நான் பேசத் தொடங்கியபோது
  rationale: ἐν + பெயர்ச்சொல் தன்மையிலான வினையெச்ச அமைப்பு ஒரே நேரத்தில் நிகழ்வதைக் குறிக்கிறது. ‘பேசத் தொடங்கியபோது’ என்பது இயல்பான தமிழில் ‘when/as I began to speak’ என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: ἐπέπεσεν
  choice: இறங்கினார்
  rationale: ἐπιπίπτω இங்கு பரிசுத்த ஆவியானவர் மக்கள்மேல் வல்லமையாக வந்த நிகழ்வைக் குறிக்கிறது. தமிழில் ‘மேல் இறங்கினார்’ என்பது கிரேக்க உருவகத்தைத் தக்கவைக்கும் இயல்பான வேதாகம நடையாகும்.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியானவர்
  rationale: இது நவீனத் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் தெளிவாகவும் மரியாதையுடனும் உள்ள வழக்கமான பெயர்.
- source_word: ἐπ’ αὐτούς
  choice: அவர்கள்மேலும்
  rationale: ἐπί என்பதன் ‘மேல்’ உறவைத் தக்கவைத்து, பின்னர் வரும் ‘நம்மேல்’ என்பதுடன் நேரான ஒப்புமையை உருவாக்குகிறது.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: நம்மேல் இறங்கியதுபோலவே
  rationale: ὥσπερ நெருக்கமான ஒப்புமையையும் καί ‘நம்மேலும்’ என்ற சேர்க்கைப் பொருளையும் தருகிறது. தமிழில் விடுபட்ட வினையைச் சேர்ப்பது ஒப்புமையை இயல்பாகவும் தெளிவாகவும் ஆக்குகிறது.
- source_word: ἐν ἀρχῇ
  choice: தொடக்கத்தில்
  rationale: படைப்பின் தொடக்கம் எனத் தவறாகப் புரியாமல், சூழலில் குறிப்பிடப்படும் முந்தைய ஆரம்ப நிகழ்வைத் திறந்தவாறே குறிக்கிறது.
theological_decisions:
- issue: ἐν ἀρχῇ என்பதன் குறிப்பு
  choice: ‘தொடக்கத்தில்’ என்று பொதுவாக மொழிபெயர்த்து, சீடர்கள்மேல் ஆவியானவர் முதலில் பொழியப்பட்ட பெந்தெகொஸ்தே நிகழ்வைச் சாத்தியமான குறிப்பாக அடிக்குறிப்பில் தெரிவிப்பது
  alternative: குறிப்பிட்ட நிகழ்வைச் சுட்டாமல் ‘முதலில்’ என்று மட்டும் மொழிபெயர்ப்பது
  rationale: பேதுரு ‘நம்மேல்’ நிகழ்ந்ததை ஒப்பிடுவதால் பெந்தெகொஸ்தே இயல்பான குறிப்பாகத் தெரிகிறது; ஆயினும் மூலவாக்கியம் நிகழ்வின் பெயரை வெளிப்படையாகச் சொல்லாததால் முதன்மை உரை அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறங்கினார்’ என்ற மரியாதை வினை பரிசுத்த ஆவியானவரைக் குறிக்கிறது; மூலத்தின் ஒப்புமையும் காலத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
