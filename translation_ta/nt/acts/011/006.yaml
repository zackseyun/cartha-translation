language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: ta
  text: நான் அதற்குள் உற்றுப் பார்த்து, அதைக் கூர்ந்து கவனித்துக் கொண்டிருந்தபோது, பூமியின் நான்கு கால் விலங்குகளையும், காட்டு விலங்குகளையும், ஊர்வனவற்றையும்[a], வானத்துப் பறவைகளையும் கண்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஊர்ந்து செல்லும் உயிரினங்களையும்.’ இந்த மாற்று மொழிபெயர்ப்பு, படைப்பு மற்றும் தூய்மைச் சட்டங்களில் காணப்படும் விரிவான உயிரின வகைப்பாட்டு மொழியைப் பேணுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: அதற்குள்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட விரிப்பு போன்ற பாத்திரத்தின் உட்புறத்தை நோக்கிய பார்வையை εἰς சுட்டுவதால், வெறுமனே ‘அதை’ என்பதைக் காட்டிலும் ‘அதற்குள்’ பொருத்தமானது.
- source_word: ἀτενίσας
  choice: உற்றுப் பார்த்து
  rationale: ஒருமுகப்பட்ட, தீவிரமான பார்வையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: κατενόουν
  choice: கூர்ந்து ஆராய்ந்தபோது
  rationale: தொடர்ந்து கவனித்துப் பரிசீலித்த செயலைக் காட்டி, பின்னர் வரும் ‘கண்டேன்’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: εἶδον
  choice: கண்டேன்
  rationale: எளிய நேரடிப் பார்வையைக் குறிக்கும் அஓரிஸ்ட் வினைக்கு இயல்பான தமிழ் இணை.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: பூமியின் நான்கு கால் விலங்குகள்
  rationale: கிரேக்கத்தின் வகைப்பாட்டு மொழியையும் ‘பூமியின்’ என்ற தொடர்பையும் தெளிவாகப் பேணுகிறது.
- source_word: τὰ θηρία
  choice: காட்டு விலங்குகள்
  rationale: பொதுவான நான்கு கால் விலங்குகளிலிருந்து காட்டில் வாழும் விலங்குகளை வேறுபடுத்துகிறது; நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: τὰ ἑρπετά
  choice: ஊர்வன
  rationale: ஊர்ந்து அல்லது தரையில் நகரும் உயிரின வகையைச் சுருக்கமாகக் குறிக்கிறது; இதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: வானத்துப் பறவைகள்
  rationale: இந்த உயிரினப் பட்டியலின் சூழலில் பறக்கும் உயிரினங்களை இயல்பாகக் குறித்து, τοῦ οὐρανοῦ என்பதையும் பேணுகிறது.
theological_decisions: []
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. உயிரினங்களின் பட்டியலில் உள்ள படைப்பு மற்றும் தூய்மைச் சட்டச் சொல்லாட்சியின் எதிரொலி பேணப்பட்டுள்ளது; காலநிலை வேறுபாட்டைத் தமிழில் இயல்பாக உணர்த்த ‘கூர்ந்து ஆராய்ந்தபோது’ பயன்படுத்தப்பட்டுள்ளது.
