revisions:
- from: நான் அதற்குள் உற்றுப் பார்த்துக் கூர்ந்து ஆராய்ந்தபோது, பூமியின் நான்கு கால் விலங்குகளையும், காட்டு விலங்குகளையும், ஊர்வனவற்றையும்[a], வானத்துப் பறவைகளையும் கண்டேன்.
