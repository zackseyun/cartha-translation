id: ACT.11.5
reference: Acts 11:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: ta
  text: '“நான் யோப்பா நகரத்தில் ஜெபித்துக்கொண்டிருந்தபோது, மெய்மறந்த நிலையில் ஒரு தரிசனத்தைக் கண்டேன்: பெரிய விரிப்பைப் போன்ற ஏதோ ஒன்று[a], நான்கு மூலைகளால் வானத்திலிருந்து இறக்கப்பட்டு, கீழே வந்துகொண்டிருந்தது[b]; அது என்னிடம் வந்து சேர்ந்தது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருவகைப் பாத்திரம்.’ கிரேக்கச் சொல் ஒரு பொருள், பாத்திரம் அல்லது கொள்கலனைக் குறிக்கக்கூடிய பரந்த சொல்லாகும்; பின்னர் அது பெரிய விரிப்புக்கு ஒப்பிடப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நான்கு மூலைகளால் வானத்திலிருந்து கீழே விடப்பட்டிருந்தது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: நான் யோப்பா நகரத்தில் ஜெபித்துக்கொண்டிருந்தேன்
  rationale: πόλει என்பதிலுள்ள ‘நகரம்’ என்பதைக் காக்கிறது; நிகழ்ந்துகொண்டிருந்த செயலைக் குறிக்கும் προσευχόμενος என்பதையும் இயல்பான தொடர்நிலை வினையாக வழங்குகிறது.
- source_word: ἐν ἐκστάσει
  choice: மெய்மறந்த நிலையில்
  rationale: வழக்கமான விழிப்புணர்விலிருந்து மாறிய தரிசன நிலையைத் தெளிவாகக் குறிக்கிறது; ‘பரவசம்’ என்பதால் ஏற்படக்கூடிய வெறும் உணர்ச்சிகரமான பொருளைத் தவிர்க்கிறது.
- source_word: ὅραμα
  choice: ஒரு தரிசனம்
  rationale: வெளிப்படுத்தப்பட்ட காட்சியைக் குறிக்கும் வழக்கமான, dignified Tamil சொல்லாகும்.
- source_word: σκεῦός τι
  choice: ஏதோ ஒன்று
  rationale: σκεῦος என்பது பொருள், பாத்திரம் அல்லது கருவி எனப் பரந்த பொருளுடையது; தொடர்ந்து வரும் உவமை அதன் தோற்றத்தை விளக்குவதால், இங்கே தேவையற்ற குறிப்பாக்கத்தைத் தவிர்க்கிறது.
- source_word: ὡς ὀθόνην μεγάλην
  choice: பெரிய விரிப்பைப் போன்ற
  rationale: ὀθόνη குறிக்கும் பெரிய துணி அல்லது விரிப்பின் தோற்றத்தை இயல்பாகத் தருகிறது; மூலத்தில் இல்லாத துணிவகையைச் சேர்க்கவில்லை.
- source_word: καταβαῖνον
  choice: கீழே வந்துகொண்டிருந்தது
  rationale: தரிசனத்தில் காணப்பட்ட பொருளின் தொடர்ச்சியான கீழ்நோக்கிய இயக்கத்தை வெளிப்படுத்துகிறது.
- source_word: τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: நான்கு முனைகளால் வானத்திலிருந்து இறக்கப்பட்டு
  rationale: ἀρχαί என்பதன் ‘முனைகள்/எல்லைகள்’ என்ற காட்சியையும் καθίημι என்பதன் இறக்கப்படுதல் என்ற செயப்பாட்டு பொருளையும் காக்கிறது.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: அது என்னிடம் வந்து சேர்ந்தது
  rationale: ἄχρι குறிக்கும் பேதுருவின் இடம் வரையிலான இயக்கத்தையும் அடைவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: தரிசன அனுபவத்தைக் குறிக்கும் ἐκστάσει மற்றும் ὅραμα ஆகிய இரு சொற்களின் வேறுபாடு
  choice: மெய்மறந்த நிலையில் ஒரு தரிசனத்தைக் கண்டேன்
  alternative: பரவசத்தில் ஒரு தரிசனத்தைக் கண்டேன்
  rationale: பேதுருவின் மாறிய உணர்வுநிலையையும் அவர் கண்ட தரிசனத்தையும் தனித்தனி கூறுகளாகக் காக்கிறது; ‘பரவசம்’ கொண்டுவரக்கூடிய வெறும் உணர்ச்சி அல்லது பிற்கால மறைஞானச் சாயலைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீளமான கிரேக்க வாக்கியத்தின் காட்சித் தொடரைத் தெளிவாக்க இரண்டு வாக்கியங்களாக அமைத்தாலும், செயல்வரிசையும் தரிசனத்தின் இயக்கமும் காக்கப்பட்டுள்ளன.
