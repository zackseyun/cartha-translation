id: ACT.11.9
reference: Acts 11:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ ⸂φωνὴ ἐκ δευτέρου⸃ ἐκ τοῦ οὐρανοῦ· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: ta
  text: 'ஆனால் வானத்திலிருந்து ஒரு குரல் இரண்டாவது முறையாகப் பதிலளித்தது: “கடவுள் தூய்மையாக்கியவற்றைத் தீட்டானவை என்று நீ சொல்லாதே.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறுவிதமாக: “புனிதமற்றவை என்று கருதாதே” அல்லது “அசுத்தமானவை என்று சொல்லாதே.”'
    reason: κοινόω என்ற கிரேக்கச் சொல் ‘பொதுவானதாக அல்லது புனிதமற்றதாக ஆக்குதல்/கருதுதல்’ என்றும், யூதத் தூய்மைச் சூழலில் ‘தீட்டானது அல்லது அசுத்தமானது என்று கருதுதல்’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தது
  rationale: ἀποκρίνομαι என்பதன் இறந்தகால வடிவம் இங்கு ‘பதிலளித்தது’ என்று பொருள்படும்; முந்தைய உரைக்கு மறுமொழியாகக் குரல் பேசுவதை இது இயல்பாகத் தெரிவிக்கிறது.
- source_word: φωνὴ
  choice: ஒரு குரல்
  rationale: கிரேக்கத்தில் பேசுபவர் மேலும் குறிப்பாக அடையாளப்படுத்தப்படவில்லை; ‘ஒரு குரல்’ என்பது அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ἐκ δευτέρου
  choice: இரண்டாவது முறையாக
  rationale: இந்த மரபுத்தொடர் ‘இரண்டாவது முறை’ என்பதைக் குறிக்கிறது; ‘மீண்டும்’ என்பதைவிட எண்ணிக்கைத் தகவலைத் தெளிவாகக் காக்கிறது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: இச்சூழலில் οὐρανός தெய்வீகக் குரல் வரும் வானத்தைக் குறிக்கிறது; நவீனத் தமிழில் ‘வானத்திலிருந்து’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: Ἃ
  choice: …வற்றை
  rationale: நடுநிலைப் பன்மை உறவுப்பெயரின் பொதுவான பொருளைத் தமிழில் ‘கடவுள் தூய்மையாக்கியவற்றை’ என்ற தொடர்பெயரெச்ச அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκαθάρισεν
  choice: தூய்மையாக்கிய
  rationale: καθαρίζω என்பது ‘தூய்மையாக்குதல்’ அல்லது ‘சுத்திகரித்தல்’ என்று பொருள்படும்; சடங்குசார் தூய்மை பற்றிய எதிர்மறை இணைப்பையும் ‘தூய்மையாக்கிய’ காக்கிறது.
- source_word: σὺ
  choice: நீ
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடம்பெறும் வலியுறுத்தப்பட்ட இரண்டாம் நபர் ஒருமைப் பெயர்ச்சொல் தமிழிலும் ‘நீ’ என்று வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- source_word: μὴ κοίνου
  choice: தீட்டானவை என்று … சொல்லாதே
  rationale: κοινόω இங்கு தூய்மைக்கு எதிரான சடங்குசார் வகைப்படுத்தலைக் குறிக்கிறது. சொற்கூறான ‘பொதுவானவை’ என்பது நவீனத் தமிழில் தவறாகப் புரியக்கூடும்; ‘தீட்டானவை என்று சொல்லாதே’ பொருளை இயல்பாகத் தருகிறது. ‘புனிதமற்றவை’ மற்றும் ‘அசுத்தமானவை’ ஆகிய நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: κοινόω என்பதிலுள்ள தூய்மை–தீட்டு வகைப்பாட்டின் நுணுக்கம்
  choice: தீட்டானவை என்று சொல்லாதே
  alternative: புனிதமற்றவை என்று கருதாதே; அசுத்தமானவை என்று சொல்லாதே
  rationale: இறைவன் தூய்மையாக்கியதை மனிதன் எதிர்மறையான சடங்குசார் வகையில் குறிக்கக் கூடாது என்பதே முரண். ‘தீட்டானவை’ என்பது தமிழில் புரியத்தக்க முதன்மை மொழிபெயர்ப்பு; ஆயினும் கிரேக்கச் சொல்லில் ‘பொதுவானது/புனிதமற்றது’ என்ற வேறுபாடும் இருப்பதால் மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வானத்திலிருந்து ஒரு குரல்’ என்று பேசுபவரைத் தேவையின்றி அடையாளப்படுத்தாமல் மூலத்தின் தெளிவின்மை காக்கப்பட்டுள்ளது. ‘பொதுவானவை’ என்ற சொற்கூறு மொழிபெயர்ப்பு இன்றைய தமிழில் சாதாரணமானவை என்ற தவறான பொருளைத் தரக்கூடும் என்பதால் பிரதான உரையில் தவிர்க்கப்பட்டு, சடங்குசார் நுணுக்கம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
