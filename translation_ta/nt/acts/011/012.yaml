id: ACT.11.12
reference: Acts 11:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: ta
  text: ஆவியானவர் என்னிடம், எந்த வேறுபாடும் பார்க்காமல்[a] அவர்களோடு போகும்படி சொன்னார். இந்த ஆறு சகோதரர்களும் என்னோடு வந்தார்கள்; நாங்கள் அந்த மனிதனின் வீட்டுக்குள் சென்றோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தயங்காமல்”; அல்லது, “சந்தேகப்படாமல்.” கிரேக்க வினையெச்சம் வேறுபாடு பார்க்காதிருப்பதையோ, தயங்காமல் அல்லது சந்தேகப்படாமல் இருப்பதையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: ஆவியானவர்
  rationale: வெளிப்படுத்தி வழிநடத்தும் இந்தச் சூழலில் இது பரிசுத்த ஆவியானவரைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘பரிசுத்த’ என்பதைச் சேர்க்காமல், தமிழில் தனிப்பட்ட செயற்பாட்டாளரைக் காட்டும் மரியாதை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: εἶπεν ... μοι
  choice: என்னிடம் ... சொன்னார்
  rationale: அறிவுறுத்தலை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ்; சொல்லின் கட்டளை சார்ந்த வலிமையையும் காக்கிறது.
- source_word: συνελθεῖν αὐτοῖς
  choice: அவர்களோடு போகும்படி
  rationale: இங்கு συνέρχομαι அந்த மனிதர்களுடன் செல்வதை, அதாவது அவர்களுக்குத் துணையாகப் பயணிப்பதை குறிக்கிறது.
- source_word: μηδὲν διακρίναντα
  choice: எந்த வேறுபாடும் பார்க்காமல்
  rationale: யூதர்–யூதரல்லாதவர் என்ற வேறுபாட்டின் அடிப்படையில் பாகுபாடு காட்டாதிருப்பதைச் சூழல் வலியுறுத்துகிறது. அதேவேளை ‘தயங்காமல்/சந்தேகப்படாமல்’ என்ற பொருள் வாய்ப்பும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: இந்த ஆறு சகோதரர்களும்
  rationale: οὗτοι என்பதற்கு ‘இந்த’ என்றும், இங்கு ஆறு ஆண் உடன்சென்றவர்களைக் குறிக்கும் ἀδελφοί என்பதற்கு ‘சகோதரர்கள்’ என்றும் நேரடியாக மொழிபெயர்க்கப்பட்டது. καί-இன் சேர்க்கைப் பொருளை ‘-உம்’ தருகிறது.
- source_word: εἰσήλθομεν
  choice: நாங்கள் ... வீட்டுக்குள் சென்றோம்
  rationale: உள்ளே நுழைந்ததைக் கூறும் இயல்பான தமிழாக்கம்; எழுவாய் வினைமுற்றில் மறைந்திருந்தாலும் தெளிவுக்காக ‘நாங்கள்’ வெளிப்படுத்தப்பட்டது.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: அந்த மனிதனின் வீட்டுக்குள்
  rationale: குறிப்பிட்ட ஆண் நபரைச் சுட்டும் ἀνήρ என்பதையும், அவரது வீட்டையும் வெளிப்படையாகக் காக்கிறது; ‘அந்த’ என்பது கிரேக்கத் திட்டவட்டச் சுட்டின் உரையாடல் சார்ந்த குறிப்பை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: பேதுருவின் அறிக்கையில் μηδὲν διακρίναντα என்பதன் பொருள்
  choice: எந்த வேறுபாடும் பார்க்காமல்
  alternative: தயங்காமல்; சந்தேகப்படாமல்
  rationale: உடனடிச் சூழல் பேதுரு யூதர்–யூதரல்லாதவர் எல்லையைக் கடந்து சென்றதையும் அதற்காக விளக்கம் அளிப்பதையும் பற்றியது. ஆகவே வேறுபாடு அல்லது பாகுபாடு பார்க்காதிருத்தல் முதன்மைப் பொருளாக ஏற்கப்பட்டது. கிரேக்கச் சொற்றொடரின் தயக்கம் அல்லது சந்தேகம் சார்ந்த உண்மையான பொருள் வாய்ப்பு அடிக்குறிப்பில் விடப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. ஆவியானவரைக் குறிக்கும் மரியாதை ஒருமையும் மற்ற மனிதர்களைக் குறிக்கும் இயல்பான பன்மை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் உண்மையான பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
