  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: ta
  text: மேலும், “பேதுருவே, எழுந்து, கொன்று சாப்பிடு” என்று என்னிடம் சொன்ன ஒரு குரலையும் கேட்டேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάς
  choice: எழுந்து
  rationale: கட்டளையின் சூழலில் இயல்பான தமிழ்; பேதுருவைச் செயல்பட எழுமாறு அழைக்கிறது.
- source_word: θῦσον
  choice: கொன்று
  rationale: இங்கு உணவுக்காக விலங்கைக் கொல்வதைக் குறிக்கும் பொதுவான கட்டளை; பலியிடுதல் என்ற தேவையற்ற சடங்கு நுணுக்கத்தைத் தவிர்க்கிறது.
- source_word: φάγε
  choice: சாப்பிடு
  rationale: நவீன பொதுத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ள கட்டளை வடிவம்.
- source_word: φωνῆς
  choice: ஒரு குரல்
  rationale: கிரேக்க உரையின் பொருளை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: θῦσον என்பது சடங்குப் பலியைக் குறிக்கிறதா அல்லது உணவுக்காகக் கொல்வதைக் குறிக்கிறதா
  choice: கொன்று
  alternative: பலியிட்டு
  rationale: காட்சியில் உள்ள உயிரினங்களைக் கொன்று உண்ணும்படி கட்டளையிடப்படுவதால், சடங்குப் பலி என்ற கருத்தைத் திணிக்காமல் பொதுவான ‘கொன்று’ என்பதே சூழலுக்கு ஏற்றது.
translation_notes:
  register: மரியாதைமிக்க, இயல்பான நவீனத் தமிழ். நேரடி மேற்கோளில் ஒருமை கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் சுருக்கமும் நேரடியான வலிமையும் காக்கப்பட்டுள்ளன.
