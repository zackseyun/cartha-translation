    reason: lexical_alternative
  revision_rationale: The revision makes the Judea-wide descriptor unambiguously modify only the brothers, preserves the Greek order of the two subject groups as far as Tamil idiom permits, and renders τὰ ἔθνη with its contextual non-Jewish sense. It retains “ஏற்றுக்கொண்டார்கள்” as a permissible contextual rendering of ἐδέξαντο and preserves the inclusive explanatory footnote without replacing the masculine plural in the main text.
