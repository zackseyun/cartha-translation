source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: ta
  text: அப்போஸ்தலர்களும், யூதேயா முழுவதிலும் இருந்த சகோதரர்களும்[a], யூதரல்லாத மக்களும் கடவுளுடைய வார்த்தையை ஏற்றுக்கொண்டார்கள் என்று கேள்விப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகள்’; கிரேக்கத்தில் ‘சகோதரர்கள்’ என்று உள்ளது; இது சக விசுவாசிகளைப் பொதுவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: கேள்விப்பட்டார்கள்
  rationale: இங்கு ἀκούω என்பது அறிவிக்கப்பட்ட செய்தியை அறிந்துகொண்டதைக் குறிக்கிறது; தமிழில் ‘கேள்விப்பட்டார்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: δὲ
  choice: தனி மொழிபெயர்ப்பு அளிக்கப்படவில்லை
  rationale: இங்கு δέ வலுவான எதிர்மறையை அல்ல, கதை நகர்வைக் குறிக்கிறது. தமிழில் தேவையற்ற ‘இப்போது’ அல்லது ‘ஆனால்’ சேர்க்காமல் வாக்கியத் தொடரே அந்த நகர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ ἀπόστολοι
  choice: அப்போஸ்தலர்கள்
  rationale: அப்போஸ்தலர் பணிகளில் அங்கீகரிக்கப்பட்ட அப்போஸ்தலர் குழுவைக் குறிக்கும் நிலைபெற்ற தமிழ் வேதாகமச் சொல்.
- source_word: οἱ ἀδελφοὶ
  choice: சகோதரர்கள்
  rationale: கிரேக்கச் சொல் ஆண்பால் பன்மையில் உள்ளது; அது சக விசுவாசிகளைக் கூட்டாகக் குறிக்கக்கூடும் என்பதைக் காலடிக்குறிப்பு விளக்குகிறது.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: யூதேயா முழுவதிலும் இருந்த
  rationale: κατά இங்கு பரவலான இடவுணர்வைக் கொண்டுள்ளது; ‘முழுவதிலும்’ என்பது யூதேயாவின் பல பகுதிகளில் இருந்ததைக் காட்டுகிறது. கிரேக்கத் தொடரமைப்பின்படி இத்தொடர் ‘சகோதரர்கள்’ என்பதோடு நேரடியாக இணைக்கப்பட்டுள்ளது.
- source_word: καὶ τὰ ἔθνη
  choice: பிற இனத்தவர்களும்
  rationale: இச்சூழலில் ἔθνη என்பது யூதரல்லாத மக்களைக் குறிக்கிறது; ‘பிற இனத்தவர்கள்’ அந்த வேறுபாட்டையும் καί-இன் சேர்க்கைப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐδέξαντο
  choice: ஏற்றுக்கொண்டார்கள்
  rationale: தேவசெய்தியை வெறுமனே பெற்றதல்ல, அதை வரவேற்று ஏற்றுக்கொண்டதைக் குறிக்கும் δέχομαι என்பதன் சூழல்சார் பொருளை வெளிப்படுத்துகிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: அறிவிக்கப்பட்ட கடவுளின் செய்தியைக் குறிக்கும் வேதாகமச் சொல்லாட்சியையும் அதன் இறையியல் ஒலியையும் காக்கிறது.
theological_decisions:
- issue: ἀδελφοὶ என்பது கலப்பு விசுவாசக் குழுவை உள்ளடக்கக்கூடிய விதம்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; விசுவாசிகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரை காக்கிறது; அது பெண்களையும் உள்ளடக்கிய சக விசுவாசிகளைக் குறிக்கக்கூடும் என்பதை காலடிக்குறிப்பு தெரிவிக்கிறது.
- issue: ἐδέξαντο τὸν λόγον τοῦ θεοῦ என்பதன் பொருள்
  choice: கடவுளுடைய வார்த்தையை ஏற்றுக்கொண்டார்கள்
  alternative: கடவுளுடைய வார்த்தையைப் பெற்றுக்கொண்டார்கள்
  rationale: ‘ஏற்றுக்கொண்டார்கள்’ என்பது செய்தியை வரவேற்று ஒப்புக்கொண்ட கருத்தைத் தருகிறது; அதேவேளையில் மனமாற்றம் அல்லது இரட்சிப்பின் ஒரு குறிப்பிட்ட கோட்பாட்டு வரிசையை உரையில் கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தமிழின் இயல்பான தகவல் அமைப்புக்கேற்ப கேட்ட செய்தி முதலில் வைக்கப்பட்டுள்ளது. கிரேக்கத்தில் ‘யூதேயா முழுவதிலும் இருந்த’ என்ற தொடர் ‘சகோதரர்கள்’ என்பதோடு நேரடியாக இணைவதால், தமிழிலும் அந்த இணைப்பு தெளிவாக வைக்கப்பட்டுள்ளது.
