source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: ta
  text: ஆனால், அவர்களில் சிலர் சைப்பிரசையும் சிரேனேயையும் சேர்ந்த ஆண்களாக இருந்தார்கள். அவர்கள் அந்தியோகியாவுக்கு வந்து, கிரேக்க மொழி பேசும் யூதர்களிடமும்[a] பேசிவந்தார்கள்; ஆண்டவராகிய இயேசுவைப் பற்றிய நற்செய்தியை அறிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘கிரேக்க மொழி பேசும் யூதர்கள்’ என்பதற்குப் பதிலாக ‘கிரேக்கர்கள்’ என்று உள்ளது. அந்த வாசகமே மூல வாசகமெனில், அவர்கள் கிரேக்க மொழி பேசும் யூதர்களிடம் மட்டுமல்லாமல் யூதரல்லாத பிற இனத்தவரிடமும் பேசினார்கள் என்பது பொருள்.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: சிலர்
  rationale: முன்பு குறிப்பிடப்பட்ட குழுவில் பெயர் குறிப்பிடப்படாத ஒரு பகுதியினரைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: ἄνδρες
  choice: ஆண்கள்
  rationale: மூலத்தில் பொதுவாக ‘மக்கள்’ என்பதற்குப் பதிலாக வயதுவந்த ஆண்களைக் குறிக்கும் ஆண்பால் பெயர்ச்சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: சைப்பிரசையும் சிரேனேயையும் சேர்ந்த
  rationale: இந்த இனவழிப் பெயரடைகள் அவர்களுடைய ஊர் அல்லது பகுதி சார்ந்த தோற்றத்தைச் சுட்டுகின்றன; நவீன தமிழில் இவ்வாறு சொல்வது இயல்பாக உள்ளது.
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: முன்னர் கூறப்பட்ட ஆண்களை விவரிக்கும் தொடர்புக் கூறைத் தமிழில் புதிய வாக்கியமாக இயல்பாகத் தொடங்குகிறது.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: அந்தியோகியாவுக்கு வந்து
  rationale: இறந்தகாலப் பெயரெச்சத்தின் காலத் தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐλάλουν
  choice: பேசி ... அறிவித்துவந்தார்கள்
  rationale: நிறைவுறாத இறந்தகால வடிவம் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் குறிப்பதால் ‘அறிவித்துவந்தார்கள்’ என்று அதன் தொடர்நிலையை வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: -இடமும்
  rationale: முன்னர் குறிப்பிடப்பட்ட கேட்போருடன் இன்னொரு குழுவும் சேர்க்கப்பட்டதைத் தமிழின் இணைப்பும்மை இயல்பாகக் காட்டுகிறது.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: கிரேக்க மொழி பேசும் யூதர்களிடம்
  rationale: SBLGNT-யின் Ἑλληνιστάς என்பது வழக்கமாக கிரேக்க மொழி பேசும் யூதர்களைக் குறிக்கிறது. முக்கியமான மாற்றுப் பாடம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: εὐαγγελιζόμενοι
  choice: நற்செய்தியை அறிவித்து
  rationale: அவர்களுடைய பேச்சின் தன்மையையும் உள்ளடக்கத்தையும் சாதாரண வாசகர்களுக்குத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: τὸν κύριον Ἰησοῦν
  choice: ஆண்டவராகிய இயேசுவைப் பற்றிய
  rationale: κύριος என்பதைக் கிறிஸ்துவுக்குரிய பட்டமாக ‘ஆண்டவர்’ என்று வழங்கி, இயேசுவே அறிவிக்கப்பட்ட செய்தியின் மையம் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: τοὺς Ἑλληνιστάς என்ற மூலப்பாடத்துக்கும் Ἕλληνας என்ற மாற்றுப் பாடத்துக்கும் இடையிலான வேறுபாடு
  choice: முதன்மை உரையில் SBLGNT-யின் ‘கிரேக்க மொழி பேசும் யூதர்கள்’ என்ற வாசகம் பின்பற்றப்பட்டு, ‘கிரேக்கர்கள்’ என்ற மாற்றுப் பாடம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
  alternative: முதன்மை உரையில் ‘கிரேக்கர்கள்’ என்று வாசித்தல்; இது யூதரல்லாத பிற இனத்தவரைக் குறிக்கும்.
  rationale: இது உரைசார் வேறுபாடாக இருந்தாலும், நற்செய்தி யாரிடம் விரிவடைந்தது என்பதில் குறிப்பிடத்தக்க விளக்கவியல் தாக்கம் கொண்டது. கொடுக்கப்பட்ட SBLGNT மூலப்பாடத்தை முதன்மை உரை பின்பற்றுகிறது; இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மாற்றுப் பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆண்கள்’ என்பது மூலத்தின் பாலினக் குறிப்பைப் பாதுகாக்கிறது; ‘அறிவித்துவந்தார்கள்’ என்பது இறந்தகாலத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
