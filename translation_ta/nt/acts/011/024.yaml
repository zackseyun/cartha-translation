revisions:
- from: ஏனெனில், அவர் நல்ல மனிதராகவும், பரிசுத்த ஆவியாலும் விசுவாசத்தாலும்[a] நிறைந்தவராகவும் இருந்தார். பெருந்திரளான மக்கள் ஆண்டவரிடம் சேர்க்கப்பட்டார்கள்.
  to: ஏனெனில், அவர் நல்ல மனிதராகவும், பரிசுத்த ஆவியும் விசுவாசமும்[a] நிறைந்தவராகவும் இருந்தார். கணிசமான மக்கள் கூட்டம் ஆண்டவரோடு சேர்க்கப்பட்டது.
  rationale: The revision clarifies that Barnabas was full of the Holy Spirit and faith, rather than potentially being filled by them as instruments. It also renders the passive addition of a considerable crowd in a way that retains the Greek’s explicit relation to the Lord and does not introduce ‘church’ or ‘community.’
