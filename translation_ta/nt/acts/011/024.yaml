  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: ta
  text: ஏனெனில், அவர் நல்ல மனிதராகவும், பரிசுத்த ஆவியும் விசுவாசமும்[a] நிறைந்தவராகவும் இருந்தார். கணிசமான மக்கள் கூட்டம் ஆண்டவரோடு சேர்க்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசம்’ என்பதற்குப் பதிலாக ‘உண்மைத்தன்மை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் πίστις, ‘உண்மைத்தன்மை’ அல்லது ‘நம்பிக்கை’ என்றும் பொருள்படலாம்; இங்கு முதன்மை உரை அதன் வழக்கமான மொழிபெயர்ப்பான ‘விசுவாசம்’ என்பதைப் பின்பற்றுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀνὴρ ἀγαθὸς
  choice: நல்ல மனிதர்
  rationale: பர்னபாவின் ஒழுக்கப் பண்பை நேரடியாகக் கூறுகிறது; ஆண்பால் குறிப்பு சூழலிலேயே தெளிவாக உள்ளது.
- source_word: πλήρης
  choice: நிறைந்தவர்
  rationale: தொடரும் இரண்டு உடைமை வேற்றுமைச் சொற்களோடு இயல்பாக இணைந்து, கிரேக்கத்தின் ‘நிறைவாக உடையவர்’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: πνεύματος ἁγίου
  choice: பரிசுத்த ஆவி
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகளில் வழக்கமாகக் குறிக்கப்படும் தெய்வீக பரிசுத்த ஆவியையே குறிப்பிடுகிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: πίστις என்பதற்கான வழக்கமான முதன்மைப் பொருளைத் தருகிறது; இச்சூழலில் சாத்தியமான ‘உண்மைத்தன்மை’ என்ற பண்புப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὄχλος ἱκανὸς
  choice: பெருந்திரளான மக்கள்
  rationale: ὄχλος என்பதன் மக்கள்திரள் என்ற பொருளையும் ἱκανός குறிப்பிடும் கணிசமான எண்ணிக்கையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: προσετέθη ... τῷ κυρίῳ
  choice: ஆண்டவரிடம் சேர்க்கப்பட்டார்கள்
  rationale: கிரேக்கத்தின் இறைவினைப் பயன்பாட்டையும், சேர்க்கப்பட்டதன் வெளிப்படையான இலக்கு ‘ஆண்டவர்’ என்பதையும் மாற்றாமல் காக்கிறது.
theological_decisions:
- issue: πνεύματος ἁγίου என்பதன் குறிப்பு
  choice: தெய்வீக நபரான பரிசுத்த ஆவி
  alternative: பரிசுத்தமான ஆவி அல்லது மனப்பாங்கு
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகளின் பயன்பாடும் பர்னபாவைப் பற்றிய இவ்வருணனையும் பரிசுத்த ஆவியையே சுட்டுகின்றன.
- issue: πίστεως என்பதன் நுட்பப் பொருள்
  choice: விசுவாசம்
  alternative: உண்மைத்தன்மை அல்லது நம்பிக்கை
  rationale: சொல்லின் வழக்கமான பொருள் முதன்மை உரையில் வைக்கப்பட்டுள்ளது; பர்னபாவின் குணநலனை வருணிக்கும் சூழலில் சாத்தியமான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: προσετέθη ... τῷ κυρίῳ என்பதில் சேர்க்கப்பட்ட இலக்கு
  choice: மக்கள் ஆண்டவரிடம் சேர்க்கப்பட்டார்கள்
  alternative: மக்கள் திருச்சபை அல்லது விசுவாசிகளின் சமூகத்தில் சேர்க்கப்பட்டார்கள்
  rationale: திருச்சபையில் இணைதல் சூழலால் உட்குறிக்கப்பட்டாலும், கிரேக்க உரை வெளிப்படையாக ‘ஆண்டவருக்கு/ஆண்டவரிடம்’ என்றே கூறுவதால் அதுவே மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆண்டவரிடம் சேர்க்கப்பட்டார்கள்’ என்ற சொற்றொடர் தமிழில் புரியத்தக்கவாறு அமைந்தாலும், மூலத்தின் தனித்துவமான ‘ஆண்டவருக்குச் சேர்க்கப்பட்டனர்’ என்ற உறவை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
