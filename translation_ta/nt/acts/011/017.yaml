id: ACT.11.17
reference: Acts 11:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: ta
  text: ஆகவே, ஆண்டவராகிய இயேசு மெசியாவை[b] நம்பிய நமக்குக் கொடுத்த அதே கொடையை கடவுள் அவர்களுக்கும் கொடுத்தார் என்றால்,[a] கடவுளைத் தடுக்கக்கூடிய நான் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆண்டவராகிய இயேசு மெசியாவை நாம் நம்பியபோது நமக்குக் கொடுத்ததுபோல’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பெயரெச்சம் காலத் தொடர்போடும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, ‘கிறிஸ்து’. கிரேக்கம்: Χριστόν (கிறிஸ்தோன்); இங்கு ‘மெசியா’ என்ற பட்டப்பொருள் செயல்பாட்டில் உள்ளது.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: ஆகவே … என்றால்
  rationale: οὖν-இன் முடிவுரைக்கும் தொடர்பையும் εἰ-இன் நிபந்தனை அமைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν ἴσην δωρεάν
  choice: அதே கொடை
  rationale: ἴσην என்பது அளவில் சமமானது மட்டுமல்ல, ஒப்பிடப்படும் ஒரேவகையான கொடை என்பதையும் குறிக்கிறது; ‘அதே கொடை’ இந்த ஒப்புமையை இயல்பாகத் தருகிறது.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: ஆண்டவராகிய இயேசு மெசியாவை நம்பிய நமக்கு
  rationale: இறந்தகாலப் பெயரெச்சம் πιστεύσασιν, ἡμῖν என்பதோடு இலக்கண ரீதியாக இணைவதை ‘நம்பிய நமக்கு’ நேரடியாகப் பாதுகாக்கிறது. ἐπὶ + வேற்றுமை உருபின் விசுவாசப் பொருள் தமிழில் ‘-ஐ நம்புதல்’ என இயல்பாக வருகிறது.
- source_word: κύριον
  choice: ஆண்டவராகிய
  rationale: κύριος இங்கு இயேசுவின் பட்டமாக உள்ளது; ‘ஆண்டவராகிய’ என்பது அடுத்துவரும் பெயருடன் அதைத் தெளிவாக இணைக்கிறது.
- source_word: Χριστόν
  choice: மெசியா
  rationale: Χριστός இங்கு பொருளுள்ள பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது; வழக்கமான ‘கிறிஸ்து’ மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν
  choice: கடவுளைத் தடுக்க நான் யார்?
  rationale: கடவுளின் செயலை எதிர்க்கத் தனக்கு எந்த அதிகாரமும் தகுதியும் இல்லை என்ற வலியுறுத்தும் வினாவைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; δυνατός என்பதன் திறன் சார்ந்த கருத்து இந்த தமிழ்ச் சொற்றொடரில் உட்பொதிந்துள்ளது.
theological_decisions:
- issue: πιστεύσασιν என்பதற்கும் ἡμῖν என்பதற்கும் உள்ள தொடர்பு
  choice: ‘நம்பிய நமக்கு’ என்ற விளக்கப் பெயரெச்சத் தொடர்பு
  alternative: ‘நாம் நம்பியபோது’ என்ற காலத் தொடர்பு
  rationale: கிரேக்கத்தில் பெயரெச்சம் ἡμῖν என்பதோடு நேரடியாக ஒத்திசைவதால் அதையே முதன்மை உரையில் வைத்துள்ளோம். நிகழ்வின் காலத் தொடர்பை வலியுறுத்தும் மொழிபெயர்ப்பும் சாத்தியம் என்பதால் அதை அடிக்குறிப்பில் தருகிறோம்; இதனால் வரிசை குறித்த இறையியல் முடிவு திணிக்கப்படவில்லை.
- issue: κύριον Ἰησοῦν Χριστόν என்பதில் Χριστόν-இன் பங்கு
  choice: பட்டப்பொருளைத் தக்கவைக்கும் ‘மெசியா’
  alternative: தமிழ் கிறிஸ்தவ வழக்கிலுள்ள ‘கிறிஸ்து’
  rationale: இச்சூழலில் Χριστός பெயரைப் போன்ற நிலையான வடிவமாக மட்டும் இல்லாமல் இயேசுவின் மெசியா பட்டத்தையும் தாங்குகிறது. மாற்று வழக்குச் சொல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τὴν ἴσην δωρεάν குறிக்கும் கொடை
  choice: ‘கொடை’ என்று மட்டும் வைத்து, பரிசுத்த ஆவி என உரைக்குள் வெளிப்படையாகச் சேர்க்கவில்லை
  alternative: ‘பரிசுத்த ஆவியாகிய அதே கொடை’ என்று விளக்கமாக்குதல்
  rationale: சூழலில் கொடை பரிசுத்த ஆவியைக் குறித்தாலும், இவ்வசனத்தின் கிரேக்க உரை δωρεάν என்று மட்டுமே கூறுகிறது. மூலத்தின் மறைமுகத்தன்மையைத் தக்கவைக்க விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுளைத் தடுக்க நான் யார்?’ என்ற நேரடி வினா மூலத்தின் கூர்மையையும் பேதுருவின் தாழ்மையையும் காக்கிறது. ‘கொடை’ என்பதன் குறிப்பிட்ட அடையாளம் சூழலுக்கே விடப்பட்டு, உரையில் விளக்கச் சேர்க்கை தவிர்க்கப்பட்டுள்ளது.
