revisions:
- from: 'அப்போது ஆண்டவர் சொன்ன வார்த்தை எனக்கு நினைவுக்கு வந்தது: “யோவான் தண்ணீரால் திருமுழுக்குக் கொடுத்தார்; ஆனால் நீங்களோ பரிசுத்த ஆவியில்[a] திருமுழுக்குப் பெறுவீர்கள்.”'
  to: 'அப்போது நான் ஆண்டவரின் வார்த்தையை நினைவுகூர்ந்தேன்; அவர் சொன்னது: “யோவான் தண்ணீரால் திருமுழுக்கு கொடுத்தார்; ஆனால் நீங்களோ பரிசுத்த ஆவியில்[a] திருமுழுக்கு பெறுவீர்கள்.”'
  rationale: The revision explicitly renders Peter’s first-person recollection, retains the Lord’s quoted saying and the emphatic contrast (‘நீங்களோ’), and corrects the Tamil baptism constructions. The main text retains the locative rendering ‘பரிசுத்த ஆவியில்’; the footnote preserves the equally defensible instrumental rendering ‘பரிசுத்த ஆவியால்.’
