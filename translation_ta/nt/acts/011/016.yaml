source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: ta
  text: 'அப்போது நான் ஆண்டவரின் வார்த்தையை நினைவுகூர்ந்தேன்; அவர் சொன்னது: “யோவான் தண்ணீரால் திருமுழுக்கு கொடுத்தார்; ஆனால் நீங்களோ பரிசுத்த ஆவியில்[a] திருமுழுக்கு பெறுவீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஆவியால்.” கிரேக்க முன்னிடைச்சொல் இங்கு “ஆவியில்” என்றோ “ஆவியால்” என்றோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην δὲ
  choice: அப்போது ... எனக்கு நினைவுக்கு வந்தது
  rationale: ἐμνήσθην என்பது வடிவில் செயல்பாட்டு/இடைத்தன்மை கொண்டிருந்தாலும் பொருளில் ‘நினைவுகூர்ந்தேன்’ என்பதாகும்; δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது. நவீன தமிழில் இந்தச் சொற்றொடர் இயல்பாக உள்ளது.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: ஆண்டவர் சொன்ன வார்த்தை
  rationale: ῥῆμα பேச்சாகச் சொல்லப்பட்ட வார்த்தையைக் குறிக்கிறது. ‘ஆண்டவருடைய வார்த்தை’ என்பதைக் காட்டிலும் ‘ஆண்டவர் சொன்ன வார்த்தை’ அடுத்து வரும் நேரடி மேற்கோளோடு இயல்பாக இணைகிறது; κύριος என்பதன் அதிகாரமும் இறையியல் நிறையும் ‘ஆண்டவர்’ என்பதில் நிலைக்கிறது.
- source_word: ὡς ἔλεγεν
  choice: சொன்ன
  rationale: இங்குள்ள இறந்தகாலத் தொடர்நிலை வடிவை தமிழில் வழக்கமாக எளிய இறந்தகாலத்தால் இயல்பாகச் சொல்லலாம். ‘சொல்லிக்கொண்டிருந்தார்’ அல்லது ‘வழக்கமாகச் சொல்வார்’ என்பது மூலத்தில் உறுதியாக இல்லாத தொடர்ச்சி அல்லது பழக்கப் பொருளை மிகைப்படுத்தக்கூடும்.
- source_word: Ἰωάννης μὲν ... ὑμεῖς δὲ
  choice: யோவான் ... ஆனால் நீங்களோ
  rationale: μέν ... δέ அமைப்பு யோவானுக்கும் கேட்போருக்கும் இடையிலான வேறுபாட்டை அமைக்கிறது. ‘ஆனால் நீங்களோ’ வெளிப்படையான ὑμεῖς தரும் வலியுறுத்தலைத் தமிழில் காக்கிறது.
- source_word: ἐβάπτισεν ὕδατι
  choice: தண்ணீரால் திருமுழுக்குக் கொடுத்தார்
  rationale: ὕδατι இங்கு கருவி/வழிமுறை வேற்றுமையாக இயல்பாகப் புரிகிறது. யோவான் மற்றவர்களுக்கு நிகழ்த்திய செயலைத் தமிழில் ‘திருமுழுக்குக் கொடுத்தார்’ தெளிவாகக் காட்டுகிறது.
- source_word: βαπτισθήσεσθε
  choice: திருமுழுக்குப் பெறுவீர்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைத் தமிழில் ‘பெறுவீர்கள்’ இயல்பாக வெளிப்படுத்துகிறது; ‘திருமுழுக்கு’ நிலைபெற்ற, மரியாதையான வேதாகமப் பயன்பாடு.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: பரிசுத்த ஆவியில்
  rationale: ἐν என்பதன் இடநிலை நுணுக்கத்தை முதன்மை உரையில் ‘-இல்’ காக்கிறது. இங்கு πνεῦμα ἅγιον தெய்வீக ஆவியைக் குறிப்பதால் ‘பரிசுத்த ஆவி’ பயன்படுத்தப்படுகிறது; கருவிப்பொருளான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இச்சூழலில் இது இயேசுவின் அதிகாரமுள்ள சொல்லைக் குறிக்கிறது. ‘ஆண்டவர்’ என்பது இயல்பான தமிழ் வேதாகமச் சொல்லாகவும் மூலத்தின் இறையியல் நிறையைத் தக்கவைப்பதாகவும் உள்ளது.
- issue: ἐν πνεύματι ἁγίῳ என்பதில் ἐν-இன் பொருள்
  choice: பரிசுத்த ஆவியில்
  alternative: பரிசுத்த ஆவியால்
  rationale: ἐν இங்கு இடநிலையாகவோ கருவி/வழிமுறையாகவோ புரிந்துகொள்ளப்படலாம். முதன்மை உரை ‘ஆவியில்’ என்பதை வைத்துக்கொண்டு, உண்மையான மாற்றுப் புரிதலை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டது. நேரடி மேற்கோள் தெளிவாக வைக்கப்பட்டு, யோவான் மற்றும் ‘நீங்கள்’ இடையிலான எதிர்மறை ஒப்புமை பாதுகாக்கப்பட்டுள்ளது.
