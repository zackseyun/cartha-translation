base_translation:
  language: en
  yaml_path: translation/nt/acts/011/030.yaml
  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: ta
  text: அவர்கள் அவ்வாறே செய்து, பர்னபாவும் சவுலும் வழியாக[a] அதை மூப்பர்களுக்கு அனுப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பர்னபாவும் சவுலும் கையால்.” கிரேக்கத்தில் நேரடியாக, “பர்னபா மற்றும் சவுலின் கையால்” என்று உள்ளது; இது அவர்கள் மூலம் அனுப்பப்பட்டதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: அவர்கள் அவ்வாறே செய்து
  rationale: ὃ முந்தைய வசனத்தில் தீர்மானிக்கப்பட்ட நிவாரண உதவியைச் சுட்டுகிறது; ‘அவ்வாறே செய்து’ என்பது கிரேக்கத் தொடரின் சுருக்கத்தையும் பின்னோக்கிய குறிப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀποστείλαντες
  choice: அனுப்பினார்கள்
  rationale: இறந்தகாலப் பங்கேற்புவினை பிரதான செயலோடு இணைந்த செயலைக் குறிக்கிறது; தமிழில் வாக்கியத்தின் பிரதான வினையாக அமைப்பது இயல்பாக உள்ளது.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: மூப்பர்களுக்கு
  rationale: πρεσβύτεροι இங்கு சமூகத்தில் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது; ‘மூப்பர்கள்’ என்பது தெளிவான, வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: διὰ χειρὸς
  choice: கையில்
  rationale: இது நியமிக்கப்பட்ட தூதர்கள் வாயிலான செயலாண்மையைக் குறிக்கும் கிரேக்க மரபுத்தொடர். ‘கையில்’ அதன் உருவகத்தைப் பாதுகாக்கிறது; பொருள் ‘மூலம்’ என்பதாகும்.
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: பர்னபா, சவுல் ஆகியோர்
  rationale: பெயர்கள் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன.
- source_word: implicit object from context
  choice: அதை
  rationale: கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் முந்தைய வசனத்தின் நிவாரண உதவியிலிருந்து புரிகிறது; ‘அதை’ மிகைப்படுத்தாமல் அந்தத் தொடர்பைத் தெளிவாக்குகிறது.
