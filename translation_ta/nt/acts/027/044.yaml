base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: ta
  text: மற்றவர்கள், சிலர் பலகைகளின் மீதும் சிலர் கப்பலிலிருந்த சில பொருள்களின் மீதும் சென்றார்கள். இவ்விதமாக அனைவரும் பாதுகாப்பாகக் கரை சேர்ந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அனைவரும் காப்பாற்றப்பட்டுக் கரை சேர்ந்தார்கள்’ அல்லது ‘அனைவரும் பத்திரமாகக் கரை தப்பிச் சேர்ந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல் கப்பல் விபத்திலிருந்து உடல்சார்ந்த விதத்தில் பாதுகாப்பாகத் தப்பியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: மற்றவர்களில்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களைத் தவிர எஞ்சியிருந்த மக்களைக் குறிக்கிறது; அடுத்து வரும் இரு குழுக்களுடன் இயல்பாக இணைகிறது.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: சிலர் ... சிலர்
  rationale: எஞ்சியிருந்தவர்களை இரண்டு குழுக்களாகப் பிரிக்கும் கிரேக்க இணை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπὶ σανίσιν
  choice: பலகைகளின் மீதும்
  rationale: σανίς என்பது பலகையையோ நீளமான மரத்துண்டையையோ குறிக்கிறது; கப்பல் விபத்துச் சூழலில் ‘பலகைகள்’ தெளிவாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: கப்பலிலிருந்து கிடைத்த பொருள்கள் சிலவற்றின் மீதும்
  rationale: τινων என்பதன் குறிப்பிடப்படாத தன்மையைப் பாதுகாத்து, அவை கப்பலிலிருந்து வந்தவை என்பதை மட்டும் கூறுகிறது; ‘சிதைந்த துண்டுகள்’ என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்ப்பதில்லை.
- source_word: οὕτως
  choice: இவ்வாறாக
  rationale: முன்னர் விவரிக்கப்பட்ட முறையைச் சுருக்கிக் காட்டி அதன் விளைவுக்கு வழிநடத்துகிறது.
- source_word: ἐγένετο
  choice: சேர்ந்தார்கள்
  rationale: கிரேக்கத்தில் விளைவை அறிமுகப்படுத்தும் ‘நிகழ்ந்தது/ஆயிற்று’ என்ற மொழிநடையை, தமிழில் அசட்டுத்தனமின்றி முடிவுச் சம்பவத்தோடு இயல்பாக இணைக்கிறது.
- source_word: πάντας διασωθῆναι
  choice: அனைவரும் பாதுகாப்பாக
  rationale: διασῴζω இங்கு கப்பல் விபத்தின் ஆபத்திலிருந்து உயிருடன் பாதுகாப்பாகத் தப்புவதைக் குறிக்கிறது; ஆன்மீக இரட்சிப்பை தேவையின்றி முன்வைப்பதைத் தவிர்க்கிறது.
- source_word: ἐπὶ τὴν γῆν
  choice: கரை சேர்ந்தார்கள்
  rationale: கடலுக்கு எதிரான நிலப்பகுதியை இச்சூழலில் இயல்பான தமிழில் ‘கரை’ எனத் தருகிறது.
theological_decisions:
- issue: διασωθῆναι என்பதன் சாத்தியமான இரட்சிப்பியல் ஒலிப்பு
  choice: ‘அனைவரும் பாதுகாப்பாகக் கரை சேர்ந்தார்கள்’ என்று உடல்சார்ந்த ஆபத்திலிருந்து தப்பிய பொருளில் மொழிபெயர்த்தல்
  alternative: ‘அனைவரும் காப்பாற்றப்பட்டுக் கரை சேர்ந்தார்கள்’ / ‘அனைவரும் பத்திரமாகக் கரை தப்பிச் சேர்ந்தார்கள்’
  rationale: உடனடிச் சூழல் கப்பல் விபத்திலிருந்து உயிர் தப்புவதைப் பற்றியது. ஆகவே ஆன்மீக இரட்சிப்பு என்ற கருத்தை இறக்குமதி செய்யாமல், வினையின் பாதுகாப்பான மீட்பு என்ற பொருளையும் முடிவையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தில் கிரேக்கத்தில் வெளிப்படையாக இல்லாத இயக்க வினை, தமிழில் வாக்கியம் முழுமையடைய ‘மிதந்து சென்றார்கள்’ எனச் சூழலிலிருந்து நிரப்பப்பட்டுள்ளது; இறுதி வாக்கியம் அனைவரும் பாதுகாப்பாகக் கரை சேர்ந்த விளைவைத் தெளிவுபடுத்துகிறது.
