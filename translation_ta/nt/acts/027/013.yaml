  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: ta
  text: தெற்குக் காற்று மெதுவாக வீசத் தொடங்கியபோது, தங்கள் திட்டம் நிறைவேறிவிட்டதாகக் கருதி, அவர்கள் நங்கூரத்தைத் தூக்கி, கிரேத்துத் தீவின் கரையை இன்னும் நெருக்கமாக ஒட்டி கப்பலைச் செலுத்தினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: மெதுவாக வீசத் தொடங்கியபோது
  rationale: ὑποπνέω காற்று மென்மையாக அல்லது இலேசாக வீசுவதைக் குறிக்கிறது; சூழலில் காற்றின் தொடக்கத்தையும் மென்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: νότου
  choice: தென்றல்
  rationale: νότος தெற்கிலிருந்து வீசும் காற்றைக் குறிக்கிறது. நவீனத் தமிழில் ‘தென்றல்’ இயல்பாகவே மென்மையான தெற்குக் காற்றை உணர்த்துகிறது; அடுத்த சொற்றொடரும் அதன் மென்மையைத் தெளிவாக்குகிறது.
- source_word: δόξαντες
  choice: கருதி
  rationale: இங்கு δοκέω தோற்றத்தையல்ல, மாலுமிகளின் சொந்த மதிப்பீட்டைச் சுட்டுகிறது.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: தாங்கள் நினைத்தது நிறைவேறிவிட்டதாக
  rationale: πρόθεσις இங்கு திட்டம் அல்லது நோக்கம்; κρατέω உடன் சேர்ந்த அமைப்பு அதைச் சாதித்துவிட்டதாக அவர்கள் எண்ணியதைச் சுட்டுகிறது. தமிழில் இயல்பாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἄραντες
  choice: நங்கூரத்தைத் தூக்கி
  rationale: αἴρω என்பதன் நேர்ப்பொருள் ‘தூக்கு’; கடற்பயணச் சூழலில் விடுபட்டுள்ள பொருள் நங்கூரம் என்பதால் அதை வெளிப்படையாகக் கூறுவது தெளிவளிக்கிறது.
- source_word: ἆσσον
  choice: கரைக்கு மிக அருகிலேயே
  rationale: ஒப்பீட்டு வினையடை ‘இன்னும் அருகில்/நெருக்கமாக’ என்பதைக் குறிக்கிறது; கடல்பயணச் சூழலில் கரையோர நெருக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παρελέγοντο τὴν Κρήτην
  choice: கிரேத்துத் தீவின் கரைக்கு மிக அருகிலேயே கப்பலைச் செலுத்தினார்கள்
  rationale: παραλέγομαι என்பது கடற்கரையை ஒட்டிப் பயணிப்பதைக் குறிக்கும் கடல்சார் சொல். ‘கப்பலைச் செலுத்தினார்கள்’ என்பது தமிழ் வாசகருக்கு செயலைத் தெளிவாக்குகிறது.
