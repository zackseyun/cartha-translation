revisions:
- from: ஆனால், சிறிது நேரத்திற்குள், “யூராக்கிலோன்”[a][b] என்று அழைக்கப்பட்ட ஒரு சூறாவளிக் காற்று அதன்மேல் பாய்ந்தடித்தது.
  to: ஆனால், சிறிது நேரத்திற்குப் பிறகு, “யூரகிலோன்”[a][b] என்று அழைக்கப்பட்ட ஒரு சூறாவளிக் காற்று அதிலிருந்து கீழ்நோக்கி வீசியது.
  rationale: The revision corrects the temporal relation and the directional force of κατ’ αὐτῆς, while retaining the source’s ambiguity about the antecedent. It also makes minor transliteration and punctuation refinements without altering the text’s meaning.
