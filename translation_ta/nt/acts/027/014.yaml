  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. “அதன்மேல்” என்பது கிரேக்கப் பெண்பால் சுட்டுப்பெயரின் குறிப்பு எதுவென்பதை உரையிலேயே தீர்மானிக்காமல் பாதுகாக்கிறது.
