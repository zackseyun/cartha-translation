base_translation:
  language: en
  yaml_path: translation/nt/acts/027/014.yaml
  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: ta
  text: ஆனால், சிறிது நேரத்திற்குப் பிறகு, “யூரகிலோன்”[a][b] என்று அழைக்கப்பட்ட ஒரு சூறாவளிக் காற்று அதிலிருந்து கீழ்நோக்கி வீசியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “யூரகிலோன்” என்பதற்குப் பதிலாக “யூரோக்ளிடோன்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “கடும் வடகிழக்குக் காற்று.” இந்தப் பெயர் வடகிழக்கிலிருந்து வீசும் புயல்காற்றைக் குறிக்கலாம்; ஆனால் கிரேக்க மூலபாடம் இதை ஒரு தனிப்பெயராக வழங்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: சிறிது நேரத்திற்குள்
  rationale: குறுகிய நேரத்திற்குப் பிறகு நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: கதைப்போக்கில் ஏற்பட்ட திடீர் எதிர்மறைத் திருப்பை மென்மையான மாறுபாட்டுடன் காட்டுகிறது.
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: அதன்மேல் பாய்ந்தடித்தது
  rationale: காற்று வலிமையாக வந்து மோதியதைத் தெளிவாகக் காட்டுகிறது; αὐτῆς என்பதன் சுட்டுப்பொருளை விளக்கிச் சொல்லாமல் “அதன்மேல்” என்று வைத்திருக்கிறது.
- source_word: ἄνεμος τυφωνικὸς
  choice: ஒரு சூறாவளிக் காற்று
  rationale: வன்மையான சுழற்காற்றுத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நவீன வானிலை வகைப்பாட்டைத் தேவையின்றி திணிக்கவில்லை.
- source_word: ὁ καλούμενος
  choice: என்று அழைக்கப்பட்ட
  rationale: ஒரு பெயர் அல்லது வழங்குபெயரை அறிமுகப்படுத்தும் கிரேக்கத் தொடரை நேர்த்தியாகக் காட்டுகிறது.
- source_word: Εὐρακύλων
  choice: யூராக்கிலோன்
  rationale: SBLGNT மூலபாடத்திலுள்ள தனிப்பெயரை மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கிறது.
