translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான வற்புறுத்தலும், உணவு உண்ணாத நிலையை வலியுறுத்தும் இரட்டைச் சொல்லாக்கமும் காக்கப்பட்டுள்ளன; προσδοκῶντες என்பதிலுள்ள எதிர்பார்ப்பு அல்லது கவலை கலந்த காத்திருப்பு என்ற நுணுக்கம் அடிக்குறிப்பில் திறந்தவாறு வைக்கப்பட்டுள்ளது.
