source:
  edition: SBLGNT
  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: ta
  text: பொழுது புலரப்போகும் வரையில், பவுல் அவர்கள் அனைவரையும் சிறிது உணவு உண்ணும்படி தொடர்ந்து வற்புறுத்தினார்; அவர், “இன்றுடன் பதினான்கு நாட்களாக, நீங்கள் காத்துக்கொண்டு, உணவு உண்ணாமல், எதையும் உட்கொள்ளாமல் தொடர்ந்து இருக்கிறீர்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ
  choice: வரையில்
  rationale: தொடர்ந்து நடந்த செயல் எந்த நேரம்வரை நீடித்தது என்பதைக் காட்டும் கால எல்லையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἡμέρα ἤμελλεν γίνεσθαι
  choice: பொழுது புலரப்போகும்
  rationale: சொல்லுக்கு நெருக்கமாக ‘பகலாகப்போகும்’ என்ற பொருள் இருந்தாலும், விடியற்காலச் சூழலில் ‘பொழுது புலரப்போகும்’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: παρεκάλει
  choice: தொடர்ந்து வற்புறுத்தி
  rationale: இறந்தகாலத் தொடர்நிலை வினையின் நீடித்த அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட வேண்டுகோளைப் பிரதிபலிக்கிறது; இச்சூழலில் வெறும் ஊக்கத்தைவிட வலியுறுத்திய வேண்டுகோள் பொருத்தமானது.
- source_word: ἅπαντας
  choice: அவர்கள் அனைவரையும்
  rationale: கப்பலில் இருந்த அனைவரையும் உள்ளடக்கும் முழுமையைக் காக்கிறது.
- source_word: μεταλαβεῖν τροφῆς
  choice: சிறிது உணவு உண்ணும்படி
  rationale: உணவில் பங்கெடுத்து உடலுக்கு ஊட்டம் பெறுதல் என்ற கருத்தையும், τροφῆς என்பதன் பகுதி சார்ந்த நுணுக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: இன்றோடு பதினான்கு நாட்களாக
  rationale: இன்றைய நாள் பதினான்காவது நாள் என்ற கிரேக்க வலியுறுத்தலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: προσδοκῶντες
  choice: எதிர்பார்த்துக் காத்துக்கொண்டே
  rationale: எதை எதிர்பார்த்தார்கள் என்பதை உரை வெளிப்படையாகச் சொல்லாததால் அந்தத் தெளிவின்மையைத் தீர்க்காமல், எதிர்நோக்கிக் காத்திருக்கும் அடிப்படைப் பொருளைக் காக்கிறது.
- source_word: ἄσιτοι
  choice: சாப்பிடாமல் இருந்து
  rationale: மத நோக்கமுள்ள நோன்பு என்ற தவறான எண்ணத்தைத் தவிர்த்து, உணவு உண்ணாத நிலையைக் குறிக்கிறது.
- source_word: διατελεῖτε
  choice: இருக்கிறீர்கள்
  rationale: முந்தைய தொடர்நிலைக் கூறுகளுடன் சேர்ந்து, கடந்த நாட்களிலிருந்து தற்போதுவரை நீடித்த நிலையைக் காட்டுகிறது.
- source_word: μηθὲν προσλαβόμενοι
  choice: எதையும் உட்கொள்ளாமல்
  rationale: தங்களுக்காக எதையும் எடுத்துக்கொள்ளவில்லை என்ற கிரேக்கக் கூறை, இச்சூழலில் உணவு உட்கொள்ளாமை எனத் தெளிவாகவும் முந்தைய கூறின் வலியுறுத்தலைக் காத்தும் தருகிறது.
