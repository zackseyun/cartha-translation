source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: ta
  text: பவுல் நூற்றுவர் தலைவனிடமும் படைவீரர்களிடமும், “இவர்கள் கப்பலில் தங்கியிருக்காவிட்டால், நீங்கள் காப்பாற்றப்பட முடியாது[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிர் தப்ப முடியாது.” கிரேக்கத்தில் “காப்பாற்றப்படுதல்” என்று உள்ளது; இங்கு அது உடல் ரீதியாக உயிர் பிழைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: நூற்றுவர் தலைவனிடமும்
  rationale: ரோமப் படையின் இந்தப் பதவியைத் துல்லியமாகவும் தமிழ் வேதாகம நடையில் அறிமுகமான வகையிலும் குறிக்கிறது.
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: கப்பலை விட்டுச் செல்ல முயன்ற மாலுமிகளைக் குறிக்கும் சுட்டுப்பெயரை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: μείνωσιν
  choice: தங்கியிருக்காவிட்டால்
  rationale: μένω என்பதன் ‘தொடர்ந்து இருத்தல்/தங்கியிருத்தல்’ என்ற பொருளையும் நிபந்தனை அமைப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ πλοίῳ
  choice: கப்பலிலேயே
  rationale: பெரிய கடற்பயணக் கப்பலைக் குறிக்க ‘கப்பல்’ பொருத்தமானது; ‘-இலேயே’ என்பது அவர்கள் கப்பலுக்குள் தொடர்ந்து இருப்பதன் அவசியத்தை இயல்பாக வலியுறுத்துகிறது.
- source_word: σωθῆναι
  choice: காப்பாற்றப்பட
  rationale: கிரேக்க வினையின் பொதுவான ‘காப்பாற்றப்படுதல்’ என்ற பரந்த சொல்லாட்சியைப் பாதுகாக்கிறது; இச்சூழலில் அது கப்பல் விபத்திலிருந்து உடல் சார்ந்து உயிர் பிழைப்பதைக் குறிக்கிறது.
- source_word: οὐ δύνασθε
  choice: முடியாது
  rationale: திறன் மறுப்பைச் சுருக்கமாகவும் நேரடியாகவும் நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: σωθῆναι என்பதை உடல் சார்ந்த மீட்பை மட்டும் வெளிப்படுத்தும் சொல்லால் மொழிபெயர்ப்பதா, அல்லது அதன் பரந்த ‘காப்பாற்றப்படுதல்’ என்ற பொருளைப் பாதுகாப்பதா?
  choice: காப்பாற்றப்பட முடியாது
  alternative: உயிர் தப்ப முடியாது
  rationale: உடனடிச் சூழல் புயல் மற்றும் கப்பல் விபத்திலிருந்து உயிர் பிழைப்பதைத் தெளிவாகக் குறிக்கிறது. இருப்பினும், மூலத்தின் பரந்த வினைச்சொல்லைத் தமிழிலும் வைத்திருப்பது தேவையற்ற இறையியல் விளக்கத்தைச் சேர்க்காமல் அதன் சொல்லாட்சியைப் பாதுகாக்கிறது; அடிக்குறிப்பு சூழல்சார் பொருளைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன வாசகர்களுக்குப் புரியும், நேரடியான, கண்ணியமான நடையுடன் கதைசொல்லல் அமைப்பு பேணப்பட்டுள்ளது. ரோமப் படைப் பதவிக்கான சுருக்கமான ‘நூற்றுவர் தலைவன்’ என்ற வழக்கமான சொல் பயன்படுத்தப்பட்டுள்ளது.
