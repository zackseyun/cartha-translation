source:
  edition: SBLGNT
  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: ta
  text: ஆனால், இரண்டு கடல்கள் சந்திக்கும் ஓர் இடத்தில் வந்து[a], அவர்கள் கப்பலைத் தரைதட்டினார்கள். கப்பலின் முன்பகுதி உறுதியாகப் பதிந்து அசையாமல் நின்றது; பின்பகுதியோ பலத்த தாக்கத்தால் உடைந்துகொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டு கடல்களுக்கு இடையிலுள்ள ஓர் இடம்.” இதற்கான கிரேக்கச் சொற்றொடர் அரிதானது; அது ஒரு நீர்வழி, மணல்திட்டு, அல்லது இரண்டு நீர்ப்பரப்புகளோ நீரோட்டங்களோ சந்திக்கும் இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: சிக்கிக்கொண்டு
  rationale: கப்பல் எதிர்பாராத, ஆபத்தான இடத்தை எதிர்கொண்ட சூழ்நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; குறிப்பிட்ட கடலோட்டச் செயலைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: τόπον διθάλασσον
  choice: இரண்டு கடல்கள் சந்திக்கும் ஓர் இடம்
  rationale: அரிதான διθάλασσος என்ற சொல்லின் ‘இரு கடல்கள்’ சார்ந்த உருவகத்தைப் பாதுகாக்கிறது; மணல்திட்டு அல்லது கால்வாய் என்று மிகத் துல்லியமாக ஊகிப்பதைத் தவிர்க்கிறது.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: கப்பலைத் தரைதட்டச் செய்தார்கள்
  rationale: கப்பலை ஆழமற்ற தரையிலோ கரையிலோ ஏற்றி நிறுத்தும் கடல்சார் செயலை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: πρῷρα
  choice: கப்பலின் முன்பகுதி
  rationale: தொழில்நுட்பக் கடல்சார் சொல்லைவிட சாதாரண வாசகர்களுக்கு உடனடியாகப் புரியும் துல்லியமான சொற்றொடர்.
- source_word: ἐρείσασα
  choice: உறுதியாகப் பதிந்து
  rationale: முன்பகுதி தரையில் இறுகப் பதிந்த விளைவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔμεινεν ἀσάλευτος
  choice: அசையாமல் நின்றது
  rationale: அது நிலைபெற்று நகராதிருந்ததை இயல்பான தமிழில் தருகிறது.
- source_word: πρύμνα
  choice: பின்பகுதி
  rationale: கப்பலின் பின்புறத்தைச் சாதாரண வாசகர்களுக்குப் புரியும் வகையில் துல்லியமாகக் குறிக்கிறது.
- source_word: ἐλύετο
  choice: உடைந்துகொண்டிருந்தது
  rationale: இறந்தகாலத் தொடர்நிலை வடிவத்தின் படிப்படியான சிதைவு அல்லது உடைதலைப் பாதுகாக்கிறது.
- source_word: ὑπὸ τῆς βίας
  choice: பலத்த தாக்கத்தால்
  rationale: βία குறிக்கும் வலிமையான தாக்கத்தைத் தருகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘அலைகள்’ என்பதை முதன்மை உரையில் சேர்ப்பதில்லை.
