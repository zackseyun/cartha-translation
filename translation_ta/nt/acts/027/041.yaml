translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடல்சார் தொழில்நுட்பச் சொற்களுக்கு பதிலாக ‘முன்பகுதி’, ‘பின்பகுதி’, ‘தரைதட்டுதல்’ போன்ற தெளிவான சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் அரிதான நிலவியல் சொல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
