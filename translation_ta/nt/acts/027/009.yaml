source:
  edition: SBLGNT
  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: ta
  text: 'கணிசமான காலம் கடந்திருந்தது; நோன்பும்[a] ஏற்கெனவே கடந்துபோயிருந்ததால், கடற்பயணம் ஏற்கெனவே ஆபத்தானதாக இருந்தது. பவுல் அவர்களுக்கு அறிவுரை கூறிக்கொண்டிருந்தார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, பாவநிவாரண நாளின் ஆண்டு யூத நோன்பாக இருக்கலாம். இந்த நோன்பு கடந்திருந்தது என்பது, கடற்பயணம் ஆபத்தாகும் பருவம் வந்துவிட்டதைச் சுட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: நெடுங்காலம் கடந்துவிட்டது
  rationale: கணிசமான காலம் கடந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; கிரேக்கத்தின் காலச்சூழல் அமைப்பை தெளிவான தனி வாக்கியமாக்குகிறது.
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: கடற்பயணம் இப்போது ஆபத்தானதாக இருந்தது
  rationale: πλοῦς என்பது கப்பலை அல்ல, கடல்வழிப் பயணத்தைக் குறிக்கிறது; ἐπισφαλής என்பதன் ஆபத்தான நிலையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: நோன்பும் ஏற்கெனவே முடிந்திருந்ததால்
  rationale: διά உடனான காரணப் பொருளையும், நோன்பு கடந்துபோன நிறைவுற்ற நிலையையும் வெளிப்படுத்துகிறது. καί என்பதற்கான ‘-உம்’ தாமதமான பருவத்தை வலியுறுத்துகிறது.
- source_word: τὴν νηστείαν
  choice: நோன்பு
  rationale: கிரேக்கத்தில் உள்ள அறியப்பட்ட குறிப்பை விளக்கமாக விரிவுபடுத்தாமல் முதன்மை உரையில் பாதுகாக்கிறது; பண்பாட்டுச் சூழல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παρῄνει
  choice: அறிவுரை கூறிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலையைப் பாதுகாத்து, அடுத்த வசனத்தில் வரும் பவுலின் உரைக்கு இயல்பாக வழிவகுக்கிறது; ‘எச்சரித்தார்’ என்ற அதிக வலிமையை தேவையின்றி சேர்க்கவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீளமான கிரேக்க வாக்கிய அமைப்பு தமிழில் இயல்பாக வாசிக்கச் சிறு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. அடுத்த வசனத்தில் பவுலின் நேரடி உரை தொடர்வதால் முடிவில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
