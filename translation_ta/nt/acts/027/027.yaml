source:
  edition: SBLGNT
  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: ta
  text: பதினான்காம் இரவு வந்தபோது, நாங்கள் அதிரியா கடலில்[a] காற்றால் அடித்துச் செல்லப்பட்டுக்கொண்டிருந்தோம். நள்ளிரவு வாக்கில், ஏதோ ஒரு நிலப்பகுதி அவர்களை நெருங்கி வருவதாக மாலுமிகள் ஊகிக்கத் தொடங்கினார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பண்டைக்காலத்தில் “அதிரியா” என்ற பெயர் இன்றைய அத்ரியாட்டிக் கடலை மட்டும் அல்லாமல், இப்பகுதியிலுள்ள நடு மத்தியதரைக் கடல் நீர்ப்பரப்பையும் விரிவாகக் குறிக்கக்கூடும்.
    reason: cultural_note
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “ஏதோ ஒரு நிலப்பகுதி அவர்களை நெருங்கிக்கொண்டிருப்பதாக மாலுமிகள் ஊகித்துக்கொண்டிருந்தார்கள்.” இதன் பொருள், தாங்கள் நிலத்தை நெருங்குவதாக அவர்கள் உணர்ந்தார்கள் என்பதாகும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: பதினான்காம் இரவு வந்தபோது
  rationale: காலவரிசையில் பதினான்காம் இரவு வந்தடைந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; ἐγένετο என்பதன் காலம் வந்தடைதல் என்ற பொருளையும் காக்கிறது.
- source_word: διαφερομένων ἡμῶν
  choice: நாங்கள் ... காற்றால் அடித்துச் செல்லப்பட்டுக்கொண்டிருந்தோம்
  rationale: செயப்படுபொருள் நிலையும் கட்டுப்பாடற்ற தொடர்ச்சியான நகர்வும் தெளிவாகின்றன; புயல் சூழலால் இயக்கிய காரணத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: அதிரியா கடலில்
  rationale: பண்டைய புவியியல் பெயரான Ἀδρίας என்பதை நவீன அத்ரியாட்டிக் கடலோடு மிகக் குறுகலாக ஒப்பாக்காமல் பெயர்மாற்றம் செய்கிறது.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: நள்ளிரவு வாக்கில்
  rationale: இரவின் நடுப்பகுதி என்ற தோராயமான காலக் குறிப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ὑπενόουν
  choice: ஊகிக்கத் தொடங்கினார்கள்
  rationale: வினையின் இறந்தகாலத் தொடர்நிலை அல்லது தொடக்க நுணுக்கத்தையும் உறுதியற்ற அனுமானத்தையும் காக்கிறது.
- source_word: οἱ ναῦται
  choice: மாலுமிகள்
  rationale: கப்பலில் பணிபுரியும் sailors என்பதற்கான பொதுவாகப் புரியும் மரியாதையான நவீன தமிழ்ச் சொல்.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: ஏதோ ஒரு நிலப்பகுதி தங்களை நெருங்கிக்கொண்டிருப்பதாக
  rationale: நிலமே அவர்களை நெருங்குகிறது என்ற கிரேக்கக் கண்ணோட்டத்தையும் τινά குறிக்கும் அடையாளம் தெரியாத தன்மையையும் பாதுகாக்கிறது.
