translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. கிரேக்கத்தின் நிலமே நெருங்குகிறது என்ற உருவகக் கண்ணோட்டம் முதன்மை உரையில் காக்கப்பட்டுள்ளது; பண்டைய ‘அதிரியா’ என்ற பெயரின் பரந்த புவியியல் பயன்பாடு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
