  source_fidelity: வரைவின் காலக் குறிப்பு, தொடர்ச்சியான கட்டுப்பாடற்ற பயணம், பண்டைய அதிரியா பகுதி, நள்ளிரவு வாக்கு, மற்றும் அடையாளம் தெரியாத நிலப்பகுதி என்ற முக்கியப் பொருள்கள் கிரேக்க மூலத்துடன் நன்றாக ஒத்துள்ளன. ஆனால் “தங்களை” என்பது மாலுமிகளையே சுட்டும் தற்சுட்டுப் பெயராகப் படுவதால், αὐτοῖς (‘அவர்களுக்கு/அவர்களை’) என்பதற்கான குறிப்பு தெளிவிழக்கிறது.
  naturalness: “நெருங்கி வருவதாக” என்பது நவீனத் தமிழில் இயல்பாக உள்ளது; “அவர்களை” என மாற்றுவதால் நிலப்பகுதி மாலுமிகளை நெருங்குவதாகும் கிரேக்கக் கண்ணோட்டமும் தெளிவாகும். வாக்கியத்தின் மற்ற நடை கண்ணியமாகவும் வாசிக்க இயலுமாறும் உள்ளது.
