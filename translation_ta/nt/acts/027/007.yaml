  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: ta
  text: பல நாட்களாக நாங்கள் மெதுவாகக் கப்பலில் பயணம் செய்து, மிகுந்த சிரமத்துடன் கினீதுவுக்கு எதிரே வந்தோம். காற்று எங்களை முன்னேற விடாததால்[a], கிரேத்தாவின் காற்றிலிருந்து பாதுகாப்பான பக்கமாக, சல்மோனேக்கு எதிரே கப்பலில் சென்றோம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காற்று எங்களைச் செல்ல அனுமதிக்காததால்.” இங்குள்ள கிரேக்க அமைப்பு வழித்தடம் மாற்றப்பட்டதற்கான காரணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “கிரேத்தாவின் கீழாகக் கப்பலில் சென்றோம்”; அதாவது, தீவின் காற்று மறைவான, பாதுகாப்பான பக்கமாகச் சென்றோம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: பல நாட்களாக
  rationale: கால நீட்சியையும் பயணத் தாமதத்தையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: βραδυπλοοῦντες
  choice: மெதுவாகக் கப்பலில் சென்று
  rationale: மெதுவான கடற்பயணத்தைத் தெளிவாகக் காட்டி, அடுத்துள்ள μόλις என்பதன் ‘சிரமம்’ என்ற தனிப் பொருளுடன் கலக்காமல் காக்கிறது.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: மிகுந்த சிரமத்துடன் கினீதுவுக்கு எதிரே வந்தோம்
  rationale: μόλις குறிக்கும் கடும் சிரமத்தையும், κατά குறிக்கும் கடற்கரை இடத்துக்கு எதிரான நிலைப்பாட்டையும் காக்கிறது.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: காற்று எங்களை மேற்கொண்டு செல்ல அனுமதிக்காததால்
  rationale: வழித்தடம் மாறியதற்கான காரணத்தைக் கூறும் genitive absolute அமைப்பை இயல்பான காரண வாக்கியமாக வழங்குகிறது; முன்னேறுதல் அல்லது அணுகுதல் என்ற சூழல்சார் நுண்பொருளை அடிக்குறிப்பில் காக்கிறது.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: கிரேத்தா தீவின் காற்று மறைவுப் பக்கமாகக் கப்பலில் சென்றோம்
  rationale: தீவின் பாதுகாப்பான, காற்றடிக்காத மறுபக்கமாகச் சென்ற கடல்சார் பொருளை சாதாரண வாசகருக்குத் தெளிவாக வழங்குகிறது.
- source_word: κατὰ Σαλμώνην
  choice: சல்மோனே முனைக்கு அருகே
  rationale: கடற்கரை அடையாள இடத்துக்கு அருகாக அல்லது அதற்கு அப்பால் அமைந்த பயண நிலையைத் தெளிவுபடுத்துகிறது; சல்மோனே ஒரு முனை என்பதையும் புவியியல் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: கினீது / கிரேத்தா / சல்மோனே
  rationale: கிரேக்கப் பெயர்களின் ஒலியமைப்பைத் தமிழில் வாசிக்க ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
