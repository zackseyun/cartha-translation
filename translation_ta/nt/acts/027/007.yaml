translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான, எளிதில் புரியும் நடையில் கடற்பயணச் சூழல் தெளிவாக்கப்பட்டுள்ளது. ‘காற்று மறைவுப் பக்கம்’ என்ற சொற்றொடர் தொழில்நுட்பமான கடல்சார் கருத்தை பொதுவாசகருக்குப் புரியும்படி தருகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
