id: ACT.27.43
reference: Acts 27:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἑκατοντάρχης βουλόμενος διασῶσαι τὸν Παῦλον ἐκώλυσεν αὐτοὺς τοῦ βουλήματος, ἐκέλευσέν τε τοὺς δυναμένους κολυμβᾶν ἀπορίψαντας πρώτους ἐπὶ τὴν γῆν ἐξιέναι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: ta
  text: ஆனால் நூற்றுவர் தலைவன்[a] பவுலைக் காப்பாற்ற விரும்பியதால், அவர்களுடைய திட்டத்தைச் செயல்படுத்தவிடாமல் தடுத்தான். நீந்த முடிந்தவர்கள் முதலில் கப்பலிலிருந்து குதித்துக் கரைக்குச் செல்லும்படி கட்டளையிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ரோமப் படையில் ஒரு படைப்பிரிவுக்குத் தலைமை வகித்த அதிகாரி; இப்பதவி வழக்கமாக “செஞ்சூரியன்” என்றும் அழைக்கப்படுகிறது.
    reason: historical_context
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: நூற்றுவர் தலைவன்
  rationale: ரோமப் படையின் centurion என்ற அதிகாரிப் பதவிக்கான மரபான, சுருக்கமான தமிழ் இணை; அதன் வரலாற்றுப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: βουλόμενος διασῶσαι τὸν Παῦλον
  choice: பவுலைக் காப்பாற்ற விரும்பியதால்
  rationale: βουλόμενος என்பது தலைவனின் விருப்பம் அல்லது நோக்கத்தைத் தெரிவிக்கிறது; διασῶσαι இச்சூழலில் பவுலின் உயிரைப் பாதுகாப்பதைக் குறிக்கிறது. காரணத் தொடர்பு தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: அவர்களுடைய திட்டத்தைச் செயல்படுத்தவிடாமல் தடுத்தான்
  rationale: முந்தைய வசனத்தில் கைதிகளைக் கொல்ல வீரர்கள் எண்ணிய திட்டத்தை நிறைவேற்றாதபடி தடுத்தான் என்ற பொருளைத் தெளிவாகவும், முந்தைய சூழலை அளவுக்கு மீறி இவ்வசனத்தில் சேர்க்காமலும் தருகிறது.
- source_word: ἐκέλευσέν τε
  choice: கட்டளையிட்டான்
  rationale: κελεύω என்பதன் அதிகாரபூர்வமான கட்டளையிடுதல் என்ற வலிமையை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: நீந்த முடிந்தவர்கள்
  rationale: நீந்தும் திறன் உள்ளவர்களைத் தனிக் குழுவாகக் குறிப்பிடும் கிரேக்கப் பங்கேற்பு அமைப்பின் பொருளை நேரடியாகத் தருகிறது.
- source_word: ἀπορίψαντας πρώτους
  choice: முதலில் கப்பலிலிருந்து குதித்து
  rationale: தங்களை வெளியே எறிந்துகொள்வது என்ற சொற்பொருள், இக்கடற்பயணச் சூழலில் கப்பலிலிருந்து குதிப்பதைக் குறிக்கிறது; πρώτους என்பதன் வரிசைப் பொருளும் காக்கப்படுகிறது.
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: கரைக்குச் செல்லும்படி
  rationale: கடலிலிருந்து நிலத்தை நோக்கிச் சென்று கரையேறுதல் என்ற திசைசார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அவர்கள் உறுதியாகக் கரையை அடைந்துவிட்டார்கள் என்று முன்கூட்டியே கூறுவதில்லை.
