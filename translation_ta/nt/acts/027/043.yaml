translation_notes:
  register: நவீன, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. முந்தைய வசனத்திலுள்ள வீரர்களின் கொலைத் திட்டம் இங்கு வெளிப்படையாகச் சேர்க்கப்படாமல், “அவர்களுடைய திட்டம்” என மூலத்தின் பின்னோக்கிய சுட்டுதல் பாதுகாக்கப்பட்டுள்ளது.
