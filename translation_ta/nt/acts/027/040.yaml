  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: ta
  text: அவர்கள் நங்கூரங்களைக் கழற்றிக் கடலிலேயே விட்டுவிட்டார்கள்; அதே நேரத்தில் சுக்கான்களின் கட்டுக் கயிறுகளைத் தளர்த்தி, முன்புறப் பாயை[a] வீசும் காற்றுக்கு ஏற்ப உயர்த்தி, கடற்கரையை நோக்கிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேற்புறப் பாய்’ அல்லது ‘கப்பலின் முனையிலிருந்த பாய்’ என்றும் பொருள் கொள்ளலாம்; இந்த அரிய கிரேக்கக் கடல்சார் சொல் துல்லியமாக எந்தப் பாயைக் குறிக்கிறது என்பது உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες τὰς ἀγκύρας
  choice: நங்கூரங்களைக் கழற்றி
  rationale: περιαιρέω என்பதன் இறந்தகாலப் பங்கேற்பு வடிவம் முதலில் நிகழ்ந்த செயலைக் குறிக்கிறது. நங்கூரங்களை வெறுமனே அகற்றினார்கள் என்பதற்குப் பதிலாக, கப்பலிலிருந்து அவற்றை விடுவித்தார்கள் என்ற கடற்பயணச் சூழலை ‘கழற்றி’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: கடலிலேயே விட்டுவிட்டார்கள்
  rationale: ἐάω இங்கு விடுதல் அல்லது கைவிடுதல் எனப் பொருள்படுகிறது. நங்கூரங்கள் மீண்டும் எடுத்துக்கொள்ளப்படாமல் கடலில் விடப்பட்டதை ‘விட்டுவிட்டார்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: ἅμα
  choice: அதே நேரத்தில்
  rationale: அடுத்து வரும் செயல்கள் ஒரே நேரத்தில் நடைபெற்றதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων
  choice: சுக்கான்களின் கட்டுக் கயிறுகளைத் தளர்த்தி
  rationale: ζευκτηρίας என்பது சுக்கான் அமைப்பைப் பிணைத்தோ நிலைப்படுத்தியோ வைத்திருந்த அரிய கடல்சார் சொல்லாகும். ‘கட்டுக் கயிறுகள்’ அதன் செயல்பாட்டை வாசகருக்குத் தெளிவுபடுத்துகிறது; ἀνέντες என்பதற்கு ‘தளர்த்தி’ பொருத்தமானது.
- source_word: τῶν πηδαλίων
  choice: சுக்கான்களின்
  rationale: πηδάλια பன்மையில் இருப்பதால் பழங்காலக் கப்பலின் இரட்டை வழிநடத்தும் துடுப்புகள் அல்லது சுக்கான்களைக் குறிக்கலாம். பொதுவாகப் புரியும் கடல்சார் சொல்லாக ‘சுக்கான்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐπάραντες τὸν ἀρτέμωνα
  choice: முன்புறப் பாய்மரத்தை உயர்த்தி
  rationale: ἀρτέμων என்பது எந்தப் பாயைக் குறிப்பதாகும் என்பது உறுதியற்ற அரிய கடல்சார் சொல். கப்பலின் முன்புறத்தில் பயன்படுத்தப்பட்ட பாய் என்ற சாத்தியமான பொருளை முதன்மை உரை தருகிறது; ஐயப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τῇ πνεούσῃ
  choice: காற்றுக்கு ஏற்றவாறு
  rationale: πνέω என்பதன் பங்கேற்பு வடிவம் வீசும் காற்றைக் குறிக்கிறது. பாயை காற்றைப் பிடிக்கும்படி உயர்த்திய செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: கடற்கரையை நோக்கிச் சென்றார்கள்
  rationale: κατέχω இங்கு ஒரு இலக்கை நோக்கிக் கப்பலைச் செலுத்துதல் என்ற கடல்சார் பொருளையும், αἰγιαλός மணற்கரை அல்லது கரையோரம் என்ற பொருளையும் தருகின்றன. தமிழில் நோக்கமுள்ள இயக்கத்தைத் தெளிவாகக் காட்டுகிறது.
