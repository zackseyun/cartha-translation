translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கும் புரியும் வகையில் கடற்பயணச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கியத்தின் தொடர்ச்சியான மற்றும் ஒரே நேரத்தில் நிகழும் செயல்கள் பாதுகாக்கப்பட்டுள்ளன. கிரேக்க மூலத்தில் நங்கூரங்களுக்கு அடிக்குறிப்பு தேவையில்லை; ஆங்கில ஆலோசனை உரையின் முதல் அடிக்குறிப்பு அதன் சொந்த முதன்மை உரையுடன் பொருந்தாததால் சேர்க்கப்படவில்லை. ἀρτέμων பற்றிய உண்மையான சொற்பொருள் ஐயப்பாடு மட்டும் [a] எனக் குறிக்கப்பட்டுள்ளது.
