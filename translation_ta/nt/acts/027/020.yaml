  to: பல நாட்களாகச் சூரியனோ நட்சத்திரங்களோ தென்படாமல், கடும் புயலும் எங்கள்மேல் தொடர்ந்துகொண்டிருந்ததால், இறுதியில் நாங்கள் உயிர் தப்புவோம் என்ற எல்லா நம்பிக்கையும் மெல்ல மெல்ல அகன்றுகொண்டே இருந்தது.[a]
