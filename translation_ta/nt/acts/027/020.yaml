  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: ta
  text: பல நாட்களாகச் சூரியனோ நட்சத்திரங்களோ தென்படாமல், கடும் புயலும் எங்கள்மேல் தொடர்ந்துகொண்டிருந்ததால், இறுதியில் நாங்கள் உயிர் தப்புவோம் என்ற எல்லா நம்பிக்கையும் மெல்ல மெல்ல அகன்றுகொண்டே இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாங்கள் காப்பாற்றப்படுவோம் என்ற நம்பிக்கை.’ கிரேக்க வினைச்சொல் ‘காப்பாற்றுதல்’ அல்லது ‘மீட்டல்’ என்று பொருள்படலாம்; இங்கு அது புயலிலிருந்து உடலுடன் உயிர் தப்புதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: தென்படவில்லை
  rationale: சூரியனும் நட்சத்திரங்களும் கண்களுக்குத் தோன்றாததையும், கடற்பயண வழிகாட்டுதலுக்கு அவை கிடைக்காததையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: பல நாட்களாக
  rationale: நீடித்த கால அளவைக் குறிக்கும் கிரேக்கத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: χειμῶνός τε οὐκ ὀλίγου
  choice: கடும் புயலும்
  rationale: கடல்சார் சூழலில் χειμών புயலான மோசமான வானிலையைக் குறிக்கிறது. οὐκ ὀλίγου என்ற குறைத்துக்கூறும் வலியுறுத்தலை நவீன தமிழில் ‘கடும்’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπικειμένου
  choice: எங்களைத் தொடர்ந்து தாக்கிக்கொண்டிருந்தது
  rationale: புயல் அவர்கள்மேல் நீடித்து அழுத்தம் செலுத்தியதைத் தொடர்நிலை வினையால் காட்டுகிறது.
- source_word: λοιπὸν
  choice: ஆகவே
  rationale: முந்தைய கடுமையான சூழ்நிலையின் விளைவாக நம்பிக்கை இழந்ததைக் குறிக்கும் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: περιῃρεῖτο
  choice: படிப்படியாக மறைந்துபோயிற்று
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் காட்டும் தொடர்ச்சியான நம்பிக்கை இழப்பைத் தக்கவைக்கிறது.
- source_word: ἐλπὶς πᾶσα
  choice: நம்பிக்கை முழுவதும்
  rationale: நம்பிக்கையின் முழுமையான இழப்பைத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: நாங்கள் உயிர் தப்புவோம் என்ற
  rationale: கப்பல் விபத்து மற்றும் கடலில் மரண அபாயம் என்ற உடனடி சூழலில் σῴζεσθαι குறிக்கும் உடல்சார் மீட்பைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: கடற்பயணக் கதையாடலில் σῴζεσθαι என்பதன் பொருள்
  choice: மரணத்திலிருந்து உடலுடன் உயிர் தப்புதல்
  alternative: காப்பாற்றப்படுதல்
  rationale: அப்போஸ்தலர் 27-ன் சூழல் புயல், கப்பல் சேதம், உயிர்பிழைப்பு ஆகியவற்றைப் பற்றியது; எனவே இங்கு ஆவிக்குரிய இரட்சிப்பை விட உடல்சார் மீட்பே நேரடிப் பொருள். ‘உயிர் தப்புவோம்’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க இறந்தகாலத் தொடர்நிலையை ‘தாக்கிக்கொண்டிருந்தது’ மற்றும் ‘படிப்படியாக’ என்பவை வெளிப்படுத்துகின்றன; இயல்பான தமிழுக்காக ‘no small’ என்ற குறைத்துக்கூறும் மரபு ‘கடும்’ என மாற்றப்பட்டுள்ளது.
