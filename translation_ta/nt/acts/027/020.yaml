  naturalness: ‘பல நாட்களாகச் சூரியனோ நட்சத்திரங்களோ தென்படாமல்’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும், மூலத்தின் இணை அமைப்பையும் நன்றாகவும் தருகிறது. ‘எங்களைத் தொடர்ந்து தாக்கிக்கொண்டிருந்தது’ புரியத்தக்கது; எனினும் ἐπικειμένου-ன் ‘மேல் அழுத்தமாக நீடித்தல்’ பொருளுக்கு ‘எங்கள்மேல் தொடர்ந்துகொண்டிருந்தது’ பொருத்தமானது. ‘நம்பிக்கை முழுவதும்’ என்பதற்குப் பதில் ‘எல்லா நம்பிக்கையும்’ வழக்கமானதும் தெளிவானதுமாகும்.
