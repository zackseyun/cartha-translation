source:
  edition: SBLGNT
  text: τό τε πέλαγος τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν διαπλεύσαντες κατήλθομεν εἰς Μύρα τῆς Λυκίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: ta
  text: கிலிக்கியா, பம்பிலியா பகுதிகளையொட்டிய திறந்த கடலைக் கடந்து சென்றபின்[a], லீக்கியாவிலுள்ள மீராவுக்கு வந்தோம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிலிக்கியா, பம்பிலியா கடற்கரைகளுக்கு அப்பாலுள்ள திறந்த கடலைக் கடந்து சென்றபின்.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “கீழே வந்தோம்.” இங்குள்ள கிரேக்க வினை ஓர் இடத்தை வந்து அடைந்ததையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: திறந்த கடல்
  rationale: இச்சொல் பொதுவாகக் கடலை மட்டும் அல்லாமல், கரையிலிருந்து விலகிய திறந்த கடற்பரப்பைக் குறிக்கிறது; தமிழிலும் இயல்பாக இந்தக் கடல்சார் குறிப்பைத் தக்கவைக்கிறது.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: கிலிக்கியா, பம்பிலியா ஆகிய பகுதிகளுக்கு அப்பாலுள்ள
  rationale: κατά உடன் வரும் புவியியல் தொடர், அந்தக் கடலோரப் பகுதிகளை ஒட்டியோ அவற்றுக்கு அப்பாலோ சென்ற பாதையைக் குறிக்கிறது. 'அப்பாலுள்ள' என்பது கடற்பயணத்தின் இடநிலையை இயல்பான தமிழில் தெரிவிக்கிறது; 'கடற்கரையை ஒட்டி' என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: διαπλεύσαντες
  choice: பயணம் செய்தபின்
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மை வினைக்கு முன் நிறைவடைந்த கடற்பயணத்தைக் குறிக்கிறது. 'செய்தபின்' காலவரிசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: κατήλθομεν
  choice: வந்து சேர்ந்தோம்
  rationale: சொல்லுக்கு நேரடியாக 'கீழே வந்தோம்' என்ற பொருள் இருந்தாலும், இப்பயணச் சூழலில் ஓர் இடத்தை அடைந்ததைக் குறிக்கும் வழக்கமான இயக்க வினையாக உள்ளது. இயல்பான தமிழுக்காக 'வந்து சேர்ந்தோம்' பயன்படுத்தப்பட்டு, நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Μύρα τῆς Λυκίας
  choice: லீக்கியாவிலுள்ள மீரா
  rationale: இங்குள்ள உடைமை வேற்றுமை மீரா நகரம் அமைந்திருந்த மாகாணத்தை அடையாளப்படுத்துகிறது; தமிழில் 'லீக்கியாவிலுள்ள மீரா' தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τε
  choice: தனி மொழிபெயர்ப்பு இல்லை
  rationale: இது முந்தைய நிகழ்வுடன் இவ்வாக்கியத்தை மெதுவாக இணைக்கும் இடைச்சொல். தமிழில் தொடர்ச்சியான கதைநடையிலேயே அதன் இணைப்புப் பணி இயல்பாக வெளிப்படுவதால் தனிச் சொல் தேவையில்லை.
