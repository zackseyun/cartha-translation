  source_fidelity: 'மொத்தத்தில் மூலத்தின் வாக்கிய அமைப்பும் பொருளும் நன்றாகப் பிரதிபலிக்கப்படுகின்றன: அச்சம், பின்புறத்திலிருந்து நான்கு நங்கூரங்களை இடுதல், பொழுது விடிய வேண்டும் என்ற வேண்டுதல் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ἐκπέσωμεν என்பதற்கு ‘கப்பல் மோதிவிடுமோ’ என்பது வெறும் மோதலை முன்னிறுத்துகிறது; இச்சூழலில் கப்பல் ஆபத்தான/பாறைமிக்க பகுதியில் கரைதட்டுதல் அல்லது தள்ளப்பட்டுச் சிக்குதல் என்பதே துல்லியமானது.'
