  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: ta
  text: பாறைகள் நிறைந்த இடங்களில் கப்பல் கரைதட்டிவிடுமோ[a] என்று அஞ்சி, அவர்கள் கப்பலின் பின்புறத்திலிருந்து நான்கு நங்கூரங்களை இறக்கிவிட்டு, பொழுது விடிய வேண்டுமென்று வேண்டிக்கொண்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: ‘கரடுமுரடான இடங்களில் கப்பல் கரைதட்டிவிடுமோ’ அல்லது ‘கூரான பாறைகளின் மீது கப்பல் தள்ளப்பட்டுவிடுமோ.’'
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘பகல் உண்டாக’; அதாவது, பகல் வெளிச்சம் வருவதற்காக ஆவலுடன் காத்திருந்தார்கள். இங்குள்ள வினை ‘ஜெபித்தார்கள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: அஞ்சி
  rationale: பின்வரும் செயல்களுக்கான காரணத்தையும் சூழ்நிலையையும் காட்டும் பங்கேற்புவினையின் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: பாறைகள் நிறைந்த இடங்களில் கப்பல் மோதிவிடுமோ
  rationale: கப்பல் கரடுமுரடான கடலடிப் பகுதிகள், பாறைகள் அல்லது ஆபத்தான கரைப்பகுதியில் மோதிக்கொள்ளும் அச்சத்தைத் தெளிவாகச் சொல்கிறது; கிரேக்கம் குறிப்பிடாத ஒரு குறிப்பிட்ட நிலவடிவை மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: ἐκπέσωμεν
  choice: கப்பல் மோதிவிடுமோ
  rationale: கடற்பயணச் சூழலில் கப்பல் ஆபத்தான கரை அல்லது பாறைப் பகுதியில் தள்ளப்பட்டு மோதுவதைக் குறிக்கும் வினையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ πρύμνης
  choice: கப்பலின் பின்புறத்திலிருந்து
  rationale: πρύμνα என்பது கப்பலின் பின்பகுதியான stern-ஐக் குறிக்கிறது; தொழில்நுட்பச் சொல்லைவிட இவ்வடிவம் பொதுவாசகருக்கு உடனடியாகப் புரியும்.
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: நான்கு நங்கூரங்களை இறக்கிவிட்டு
  rationale: முதன்மை வினைக்கு முன்னதாக நடந்த செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது; நங்கூரத்தைப் பயன்படுத்தும் சூழலில் ‘இறக்குதல்’ வழக்கமான சொல்லாகும்.
- source_word: ηὔχοντο
  choice: வேண்டிக்கொண்டிருந்தார்கள்
  rationale: εὔχομαι என்பதிலுள்ள வேண்டுதல் அல்லது தீவிரமான ஏக்கத்தின் நுணுக்கத்தைத் திறந்தவாறே வைத்திருக்கிறது; இறந்தகாலத் தொடர்நிலை கிரேக்க imperfect-இன் நீடித்த செயலை பிரதிபலிக்கிறது.
- source_word: ἡμέραν γενέσθαι
  choice: பொழுது விடிய வேண்டுமென்று
  rationale: சொல்லுக்கு சொல் ‘பகல் உண்டாக’ என்பதன் இயல்பான தமிழ் இணை; இச்சூழலில் அவர்கள் வெளிச்சம் வரக் காத்திருந்ததைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ηὔχοντο என்பது இறைவனை நோக்கிய ஜெபமா அல்லது பொழுது விடிய வேண்டும் என்ற தீவிர விருப்பமா
  choice: வேண்டிக்கொண்டிருந்தார்கள்
  alternative: ஜெபித்துக்கொண்டிருந்தார்கள் / ஏங்கிக்கொண்டிருந்தார்கள்
  rationale: கிரேக்க வினை இரு நுணுக்கங்களையும் தாங்கக்கூடும். ‘வேண்டிக்கொண்டிருந்தார்கள்’ என்பது மதச்சார்பான ஜெபத்தை மறுப்பதுமில்லை, உரை வெளிப்படையாகச் சொல்லாத இறைநோக்கைச் சேர்ப்பதுமில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கப்பலின் பின்புறம்’ என்பது துல்லியமான கருத்தைத் தொழில்நுட்பச் சுமையின்றி தருகிறது; ‘வேண்டிக்கொண்டிருந்தார்கள்’ மூலத்தின் ஜெபம்/தீவிர விருப்பம் என்ற தெளிவின்மையைப் பாதுகாக்கிறது.
