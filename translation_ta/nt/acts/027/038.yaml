translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கப்பலின் பாரத்தைக் குறைத்தல்’ என்பது சொற்சொல்லான வடிவத்தைவிடச் செயற்பொருளைத் தெளிவாகக் கூறுகிறது. மூலத்தின் நிறைவுறா வினையில் உள்ள தொடர்ச்சி/தொடக்கத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
