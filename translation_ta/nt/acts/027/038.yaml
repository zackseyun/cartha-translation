  text: κορεσθέντες ⸀δὲ τροφῆς ἐκούφιζον τὸ πλοῖον ἐκβαλλόμενοι τὸν σῖτον εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/038.yaml
  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: ta
  text: அவர்கள் உணவு உண்டு திருப்தியடைந்தபின்[a], கோதுமையை[c] கடலில் எறிந்து, கப்பலின் பாரத்தைக் குறைக்கத் தொடங்கினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘அவர்கள் உணவினால் நிறைவடைந்தபின்’ அல்லது ‘அவர்கள் போதுமான அளவு சாப்பிட்டபின்.’'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘கப்பலின் பாரத்தைக் குறைத்துக்கொண்டிருந்தார்கள்’ அல்லது ‘கப்பலின் பாரத்தைக் குறைத்தார்கள்.’ கிரேக்க நிறைவுறா இறந்தகால வினை, செயல் தொடர்ந்து நடந்ததையோ தொடங்கியதையோ வலியுறுத்தலாம்.'
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘தானியத்தை.’ கிரேக்கச் சொல் பொதுவாகத் தானியத்தைக் குறிக்கலாம்; இங்கு அது குறிப்பாகக் கோதுமையைக் குறிக்கும் வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: உணவு உண்டு திருப்தியடைந்தபின்
  rationale: உணவினால் நிறைவடைதல் அல்லது திருப்தியடைதல் என்ற பொருளையும், முற்றுப்பெற்ற பங்கேற்பு வடிவத்தின் காலத் தொடர்பையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது கதையை மெதுவாக முன்னெடுக்கும் இணைப்புச்சொல். தமிழில் வாக்கியத் தொடர்ச்சியே அதன் பணியை இயல்பாகச் செய்கிறது; ‘பின்பு’ எனச் சேர்த்தால் பங்கேற்பு வடிவத்தில் ஏற்கெனவே உள்ள காலத் தொடர்பு தேவையின்றி இரட்டிப்பாகும்.
- source_word: ἐκούφιζον τὸ πλοῖον
  choice: கப்பலின் பாரத்தைக் குறைக்கத் தொடங்கினார்கள்
  rationale: நிறைவுறா இறந்தகால வினை செயல் தொடங்கியதையோ தொடர்ந்து நடைபெற்றதையோ குறிக்கலாம். இச்சூழலில் ‘குறைக்கத் தொடங்கினார்கள்’ என்பது செயல் முறையின் தொடக்கத்தை இயல்பாகக் காட்டுகிறது.
- source_word: ἐκβαλλόμενοι
  choice: எறிந்து
  rationale: கப்பலின் பாரம் எவ்வாறு குறைக்கப்பட்டது என்பதை விளக்கும் வழிமுறைப் பங்கேற்பு வடிவத்தைச் சுருக்கமான இயல்பான தமிழில் தருகிறது.
- source_word: τὸν σῖτον
  choice: கோதுமையை
  rationale: σῖτος பொதுவாகத் தானியத்தையும் குறிப்பாகக் கோதுமையையும் குறிக்கலாம்; இக்கப்பலின் சரக்குச் சூழலில் ‘கோதுமை’ பொருத்தமான குறிப்பான மொழிபெயர்ப்பு.
- source_word: εἰς τὴν θάλασσαν
  choice: கடலில்
  rationale: கடலை நோக்கிய எறிதலின் திசையைத் தமிழில் இயல்பாகக் குறிக்கிறது.
