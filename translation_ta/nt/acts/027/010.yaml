source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: ta
  text: 'அவர்களிடம் அவர் கூறினார்: “ஆண்களே, இந்தக் கடற்பயணம் பேரிடரையும் மிகுந்த இழப்பையும் கொண்டுவரப்போகிறது[a] என்று உணர்கிறேன்—சரக்குக்கும் கப்பலுக்கும் மட்டுமல்ல, நம் உயிர்களுக்கும்கூட[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொடுந்துன்பத்தையும் மிகுந்த சேதத்தையும் கொண்டுவரப்போகிறது.” கிரேக்கச் சொற்றொடர் இந்தக் கடற்பயணத்தோடு வரும் கடுமையான துன்பத்தையோ சேதத்தையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “நம் ஆத்துமாக்களுக்கும்கூட.” ஆனால் கப்பல் விபத்தாலும் மரணத்தாலும் ஏற்படும் அபாயத்தைப் பற்றிய இச்சூழலில் இதன் பொருள் “நம் உயிர்களுக்கும்கூட” என்பதே.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: அவர்களிடம் அவர் கூறினார்
  rationale: தொடர்ந்து வரும் நேரடி உரையை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; கிரேக்கப் பங்கேற்புவினையின் உடனிகழ்வுப் பொருளைச் சூழலுக்கேற்ற முறையில் வெளிப்படுத்துகிறது.
- source_word: Ἄνδρες
  choice: ஆண்களே
  rationale: ἀνήρ என்பதன் ஆண்பால் பன்மை அழைப்பை நேரடியாகவும் மரியாதைக்குரிய நவீன தமிழிலும் காக்கிறது.
- source_word: θεωρῶ
  choice: உணர்கிறேன்
  rationale: வெறும் கண்பார்வையை அல்லாமல், சூழ்நிலையை ஆராய்ந்து பெற்ற மதிப்பீட்டையோ தெளிவையோ குறிக்கிறது.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: பேரிடரையும் மிகுந்த இழப்பையும் கொண்டுவரப்போகிறது
  rationale: கடற்பயணச் சூழலில் ὕβρις குறிக்கும் கடுமையான கேடு அல்லது பேரிடரையும், ζημία குறிக்கும் பெரும் இழப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: சரக்குக்கும் கப்பலுக்கும் மட்டுமல்ல, ... கூட
  rationale: இழப்பு எவற்றைச் சாரும் என்ற கிரேக்கப் பிறப்புவேற்றுமைத் தொடர்பையும் οὐ μόνον ... ἀλλὰ καί என்ற வலியுறுத்தும் அமைப்பையும் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: நம் உயிர்களுக்கும்
  rationale: கப்பல் விபத்தும் மரண அபாயமும் பேசப்படும் இச்சூழலில் ψυχή என்பது உடல் வாழ்வைக் குறிக்கிறது; ‘உயிர்கள்’ அந்தப் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: μέλλειν ἔσεσθαι
  choice: கொண்டுவரப்போகிறது
  rationale: எதிர்பார்க்கப்படும் நெருங்கிய விளைவைத் தெரிவிக்கும் μέλλω என்பதன் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν πλοῦν
  choice: இந்தக் கடற்பயணம்
  rationale: πλοῦς குறிக்கும் கடல்வழிப் பயணத்தைத் துல்லியமாகக் குறிக்கிறது; தமிழ் உரையில் சுட்டுப்பெயரடை சூழலில் பேசப்படும் பயணத்தை இயல்பாக அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: τῶν ψυχῶν ἡμῶν என்பதன் பொருள்
  choice: நம் உயிர்கள்
  alternative: நம் ஆத்துமாக்கள்
  rationale: இங்கு ஏற்படக்கூடிய கப்பல் விபத்தும் மரணமும் பற்றியே எச்சரிக்கை தரப்படுவதால், ψυχή மனிதரின் உயிர்வாழ்வைக் குறிக்கிறது; உடலிலிருந்து வேறான ஆத்துமா பற்றிய கோட்பாட்டுப் பொருளை உரைக்குள் இறக்குமதி செய்யக்கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. நேரடி அழைப்பின் ஆண்பால் வடிவம் காக்கப்பட்டுள்ளது; கடற்பயணச் சூழலுக்கு அந்நியமான கோட்பாட்டுச் சொல்லாட்சியைத் தவிர்த்து, மூலத்தின் தீவிரமும் ‘மட்டுமல்ல ... கூட’ என்ற எதிரிணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
