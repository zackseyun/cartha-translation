  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கடல்சார் செயல் விளக்கமாக மொழிபெயர்க்கப்பட்டுள்ளது. ‘பாகம்’ என்ற அளவுப்பெயர் மூலத்தின் வரலாற்றுச் சூழலைத் தக்கவைக்கிறது; நவீன மதிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
