reference: Acts 27:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ βολίσαντες εὗρον ὀργυιὰς εἴκοσι, βραχὺ δὲ διαστήσαντες καὶ πάλιν βολίσαντες εὗρον ὀργυιὰς δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: ta
  text: அவர்கள் ஆழம் பார்த்து, இருபது பாகம் ஆழம் எனக் கண்டார்கள்; சற்றுத் தூரம் சென்றபின் மீண்டும் ஆழம் பார்த்து, பதினைந்து பாகம் ஆழம் எனக் கண்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βολίσαντες
  choice: ஆழம் அளந்தபோது
  rationale: கனமான குண்டு இணைக்கப்பட்ட அளவுக் கயிற்றைக் கடலில் இறக்கி ஆழத்தை அளக்கும் கடல்சார் செயலை இயல்பான நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: εὗρον
  choice: என்று கண்டார்கள்
  rationale: அளவீட்டில் கிடைத்த முடிவை அறிந்ததைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὀργυιὰς
  choice: பாகம்
  rationale: ὀργυιά என்ற சுமார் ஆறு அடி நீளமுள்ள பழங்கால அளவுக்கு மரபாகப் பயன்படுத்தப்படும் தமிழ் அலகுப் பெயரைத் தக்கவைக்கிறது; அதன் மதிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: εἴκοσι
  choice: இருபது
  rationale: எண்ணின் நேரடி மொழிபெயர்ப்பு.
- source_word: βραχὺ διαστήσαντες
  choice: சற்றுத் தூரம் சென்றபின்
  rationale: கப்பல் சிறிது தூரம் முன்னே சென்றபின் அடுத்த அளவீடு செய்யப்பட்டதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: ஆழம் அளக்கும் செயல் திரும்பச் செய்யப்பட்டதைக் குறிக்கிறது.
- source_word: δεκαπέντε
  choice: பதினைந்து
  rationale: எண்ணின் நேரடி மொழிபெயர்ப்பு.
- source_word: καὶ ... δὲ ... καὶ
  choice: '...போது ... சென்றபின் மீண்டும்...'
  rationale: இணைப்புச் சொற்களின் முதன்மையான தொடர்ச்சி சார்ந்த கதையோட்டத்தை இயல்பான தமிழ்ச் சொற்றொடரால் வழங்குகிறது; தேவையற்ற எதிர்மறை முரணை உருவாக்கவில்லை.
