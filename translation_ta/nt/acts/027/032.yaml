    text: “சிறுபடகு” என்பதற்கான கிரேக்கச் சொல் ஸ்காபே (skaphē); இது கப்பலுடன் இருந்த சிறிய படகைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “விலகிச் செல்ல” என்பதன் அடிப்படைப் பொருள் “விழுந்து அல்லது வெளியேறிச் செல்ல” என்பதாகவும் இருக்கலாம்; இச்சூழலில் “மிதந்து விலகிச் செல்ல” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
