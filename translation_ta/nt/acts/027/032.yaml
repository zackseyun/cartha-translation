  text: Then the soldiers cut away the ropes of the skiff and let it fall off[a][b].
translation:
  language: ta
  text: அப்போது படைவீரர்கள் சிறுபடகின் கயிறுகளை வெட்டி, அதை விலகிச் செல்ல விட்டார்கள்.[a][b]
  philosophy: optimal-equivalence
