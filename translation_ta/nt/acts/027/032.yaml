- source_word: ἀπέκοψαν
  choice: வெட்டி
  rationale: கயிறுகளை அறுத்துப் பிரித்த செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οἱ στρατιῶται
