  text: καὶ τῇ τρίτῃ αὐτόχειρες τὴν σκευὴν τοῦ πλοίου ⸀ἔρριψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/019.yaml
  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: ta
  text: மூன்றாம் நாளில், அவர்கள் தங்கள் கைகளாலேயே கப்பலின் உபகரணங்களைக் கடலில் எறிந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களே கப்பலின் உபகரணங்களை வெளியே எறிந்தார்கள்.”
    reason: αὐτόχειρες என்பதன் ‘தங்கள் கைகளால்’ என்ற நேரடிப் பொருளுக்கு மாற்றாக, செயலை அவர்களே நேரடியாகச் செய்தனர் என்ற வலியுறுத்தலைக் காட்டுகிறது.
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: மூன்றாம் நாளில்
  rationale: வரிசை எண்ணுடன் வரும் வேற்றுமை உருபு இங்கு காலத்தைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் நாளை வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: αὐτόχειρες
  choice: தங்கள் சொந்தக் கைகளாலேயே
  rationale: கப்பலில் இருந்தவர்கள் இந்தச் செயலைத் தாங்களே நேரடியாகச் செய்தார்கள் என்ற வலியுறுத்தலை, வெறும் ‘தாங்களே’ என்பதைக் காட்டிலும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: கப்பலின் உபகரணங்களை
  rationale: கடற்பயணச் சூழலில் σκευή என்பது கப்பலைச் சார்ந்த சாதனங்கள் அல்லது பொருட்களைக் குறிக்கிறது; ‘உபகரணங்கள்’ என்பது நவீனத் தமிழில் தெளிவான, மிகையாகத் தொழில்நுட்பமில்லாத சொல்.
- source_word: ἔρριψαν
  choice: கடலில் எறிந்தார்கள்
  rationale: வினைச்சொல் ‘எறிதல்’ என்று பொருள்படும்; கப்பலிலிருந்து வெளியே, கடலுக்குள் எறிந்தனர் என்பது சூழலில் உள்ளார்ந்திருப்பதால் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
