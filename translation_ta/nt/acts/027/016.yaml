  text: νησίον δέ τι ὑποδραμόντες καλούμενον ⸀Καῦδα ⸂ἰσχύσαμεν μόλις⸃ περικρατεῖς γενέσθαι τῆς σκάφης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/016.yaml
  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: ta
  text: ஆனால், கௌதா என்று அழைக்கப்பட்ட ஒரு சிறிய தீவின் மறைவுப் பக்கமாகக் கடந்து சென்றபின்[a], கப்பலின் சிறுபடகை வசப்படுத்த எங்களால் மிகுந்த சிரமத்துடன்தான் முடிந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கௌதா என்று அழைக்கப்பட்ட ஒரு சிறிய தீவின் ஒதுக்குப்புறமாகக் கடந்து சென்றபின்.’ கிரேக்கத்தில் உள்ள கடற்பயணச் சொல், காற்றிலிருந்து பாதுகாப்பு கிடைக்கும் தீவின் பக்கமாகக் கப்பல் சென்றதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: ஒரு சிறிய தீவு
  rationale: νησίον என்பது தீவைக் குறிக்கும் சிறுமை வடிவம்; ஆகவே ‘ஒரு சிறிய தீவு’ என்பது அதன் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சி அல்லது மாறுபாட்டைக் குறிக்கிறது; புயலிலிருந்து கிடைத்த தற்காலிக மறைவை நோக்கிக் கதை நகர்வதை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது.
- source_word: ὑποδραμόντες
  choice: காற்று மறைவில் சென்றபின்
  rationale: கடற்பயணச் சூழலில் ὑποτρέχω என்பது தீவின் காற்று மறைவான பக்கத்தில் செல்வதைக் குறிக்கிறது. தொழில்நுட்பச் சொல்லாடலைத் தவிர்த்து கடல்சார் பொருளை இத்தொடர் தெளிவாகத் தருகிறது.
- source_word: καλούμενον Καῦδα
  choice: கௌதா என்று அழைக்கப்பட்ட
  rationale: தீவின் பெயரை அடையாளப்படுத்தும் எளிய பெயரெச்சத் தொடர்; Καῦδα என்பதற்கு மூலமொழியை நெருங்கிய தமிழ் ஒலிபெயர்ப்பு ‘கௌதா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἰσχύσαμεν μόλις
  choice: எங்களால் மிகுந்த சிரமத்துடன்தான் முடிந்தது
  rationale: செயலை நிறைவேற்றுவது ஏறத்தாழ இயலாத அளவுக்குக் கடினமாக இருந்ததை இந்த இயல்பான தமிழ்த் தொடர் வெளிப்படுத்துகிறது.
- source_word: περικρατεῖς γενέσθαι
  choice: கட்டுப்பாட்டுக்குள் கொண்டுவர
  rationale: இந்தத் தொடர் ஒன்றைப் பிடித்து அதன்மீது கட்டுப்பாடு பெறுவதைக் குறிக்கிறது; சிறுபடகை மீட்டு வசப்படுத்திய கடற்பயணச் சூழலுக்கு இத்தேர்வு பொருந்துகிறது.
- source_word: τῆς σκάφης
  choice: கப்பலின் சிறுபடகு
  rationale: σκάφη என்பது பெரிய கப்பலோடு இருந்த சிறிய துணைப் படகைக் குறிக்கிறது. ‘கப்பலின் சிறுபடகு’ என்பது இதைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
