  rationale: குளிர்காலம் தங்கிக் கழிப்பதற்கு அந்தத் துறைமுகம் பொருத்தமற்றதாக இருந்த நடைமுறைச் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது.
