source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: ta
  text: அந்தத் துறைமுகம் குளிர்காலத்தைக் கழிப்பதற்கு ஏற்றதாக இல்லாததால், பெரும்பான்மையினர் அங்கிருந்து கடலுக்குப் புறப்பட வேண்டும் என்று முடிவுசெய்தனர்[a]. எப்படியாவது கிரேத்தாவில் உள்ள ஒரு துறைமுகமான பீனிக்ஸை[b] சென்றடைந்து அங்கே குளிர்காலத்தைக் கழிக்க முடியுமோ என்று அவர்கள் எண்ணினர்; அது தென்மேற்கும் வடமேற்கும் நோக்கியிருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அங்கிருந்து கப்பலில் புறப்பட வேண்டும்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல், கப்பல் துறைமுகத்திலிருந்து கடலுக்குப் புறப்படுவதைக் குறிக்கும் கடல்சார் சொல்.
    reason: lexical_alternative
  - marker: b
    text: பீனிக்ஸ் என்பது கிரேத்தாவில் இருந்த ஒரு துறைமுகம். சில பழைய மொழிபெயர்ப்புகளில் இப்பெயர் வேறு எழுத்துப்பெயர்ப்பு வடிவங்களில் காணப்படுகிறது.
    reason: cultural_note
  - marker: c
    text: இறுதியில் வரும் திசைக் குறிப்பு பொருள் காண்பதற்குக் கடினமானது. பாரம்பரியமாக இது “தென்மேற்கும் வடமேற்கும் நோக்கிய” என்று மொழிபெயர்க்கப்படுகிறது; இரண்டாவது திசையை இன்னும் குறிப்பாக “மேற்கு-வடமேற்கு” எனச் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
