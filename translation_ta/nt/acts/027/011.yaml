source:
  edition: SBLGNT
  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: ta
  text: ஆனால் ரோம நூற்றுப்படைத் தலைவர், பவுல் சொன்னவற்றைவிடக் கப்பலை வழிநடத்துபவரையும் கப்பல் உரிமையாளரையும் அதிகம் நம்பினான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பவுல் சொன்னவற்றைவிடக் கப்பலை வழிநடத்துபவருக்கும் கப்பல் உரிமையாளருக்குமே அதிகம் செவிகொடுத்தான்.”
    reason: μᾶλλον ἐπείθετο என்பது ‘அதிகம் நம்பினான்’ என்றும், முடிவெடுக்கும் சூழலில் ‘அதிகம் செவிகொடுத்தான்’ என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: நூற்றுக்குத் தலைவன்
  rationale: ரோமப் படையில் ஏறத்தாழ நூறு வீரர்களுக்குப் பொறுப்பான அதிகாரியைக் குறிக்கும் வரலாற்றுச் சொல்லைத் தமிழில் தெளிவாகவும் வழக்கமாகவும் தருகிறது.
- source_word: κυβερνήτῃ
  choice: கப்பலை ஓட்டுபவர்
  rationale: கப்பலைச் செலுத்தி வழிநடத்தும் நபரைக் குறிக்கிறது; பொதுவான ‘மாலுமி’ என்பதைவிடப் பணி தெளிவாகிறது, மேலும் ναύκληρος என்பவரிடமிருந்து வேறுபாடும் காக்கப்படுகிறது.
- source_word: ναυκλήρῳ
  choice: கப்பல் உரிமையாளர்
  rationale: கப்பலின் உரிமையாளர் அல்லது அதன் முதன்மை நிர்வாகியைக் குறிக்கும் வாய்ப்புள்ள சொல்லுக்கு இயல்பான, துல்லியமான இணை.
- source_word: μᾶλλον ἐπείθετο
  choice: அதிகம் நம்பினான்
  rationale: ஒப்பீட்டுப் பொருளையும், அவர்களுடைய ஆலோசனையால் இணங்கச் செய்யப்பட்ட அல்லது அதற்கு அதிக நம்பிக்கை கொடுத்த கருத்தையும் சுருக்கமாக வெளிப்படுத்துகிறது; ‘அதிகம் செவிகொடுத்தான்’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு காக்கிறது.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: பவுல் சொன்னவற்றை
  rationale: பவுலால் கூறப்பட்ட எச்சரிக்கை அல்லது ஆலோசனையைக் குறிக்கும் பெயராக்கப்பட்ட பங்கேற்புவினையின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் பவுல் கூறிய எச்சரிக்கைக்கும் அதிகாரியின் பதிலுக்கும் இடையிலான முரண்பாட்டைத் தெளிவாக்குகிறது.
- source_word: ἢ
  choice: விட
  rationale: μᾶλλον உடன் அமைந்த ஒப்பீட்டைத் தமிழில் நேரடியாகக் குறிக்கிறது.
