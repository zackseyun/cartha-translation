  text: ἣν ἄραντες βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον· φοβούμενοί τε μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν, χαλάσαντες τὸ σκεῦος, οὕτως ἐφέροντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: ta
  text: அதை மேலே தூக்கியபின், கப்பலைச் சுற்றிக் கட்டி வலுப்படுத்தும் கயிறுகளைப் பயன்படுத்தினார்கள். மேலும், சிர்த்திஸ் பகுதிக்குள் தள்ளப்பட்டுவிடுவோமோ என்று அஞ்சி[a], கப்பலின் தளவாடத்தை இறக்கிவிட்டு[b], அவ்வாறே அடித்துச் செல்லப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சிர்த்திஸ் என்பது வட ஆப்பிரிக்கக் கடற்கரைக்கு அப்பால் இருந்த, மணல்திட்டுகளும் ஆழமற்ற கடற்பகுதிகளும் நிறைந்த, கப்பல்களுக்கு மிகவும் ஆபத்தான பகுதி.
    reason: cultural_note
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “கப்பலின் கயிற்றுச் சாதனத்தை இறக்கிவிட்டு” அல்லது “கடல் நங்கூரத்தை இறக்கிவிட்டு.” கிரேக்கத்தில் “தளவாடம்/சாதனம்” என்ற பொதுவான சொல் உள்ளது; இங்கு குறிக்கப்படும் குறிப்பிட்ட கடல்சார் சாதனம் எது என்பது உறுதியில்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: அதை மேலே தூக்கியபின்
  rationale: ἣν என்பது முந்தைய வசனத்தில் கூறப்பட்ட சிறுபடகைக் குறிக்கிறது; ἄραντες முதன்மைச் செயலுக்கு முந்திய தூக்குதல் அல்லது மேலே ஏற்றுதல் செயலைக் காட்டுகிறது.
- source_word: βοηθείαις ἐχρῶντο
  choice: வலுப்படுத்தும் கயிறுகளைப் பயன்படுத்தினார்கள்
  rationale: βοηθείαις என்பதன் அடிப்படைப் பொருள் ‘உதவிகள்/ஆதரவுகள்’; இக்கடற்பயணச் சூழலில் கப்பலின் உடற்பகுதியை வலுப்படுத்தப் பயன்படுத்திய கயிறு அமைப்புகளைக் குறிக்கிறது.
- source_word: ὑποζωννύντες τὸ πλοῖον
  choice: கப்பலை அடிப்புறமாகச் சுற்றிக் கட்டி
  rationale: வலுப்படுத்தும் கயிறுகளைக் கப்பலின் உடற்பகுதியைச் சுற்றிக் கீழ்ப்புறமாகக் கட்டும் தொழில்நுட்பச் செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: சிர்த்திஸ் மணல்திட்டில் சிக்கிவிடுவோமோ
  rationale: ἐκπίπτω இங்கு கப்பல் அபாயப் பகுதியில் தள்ளப்பட்டு தரைதட்டுதல் அல்லது சிக்குதல் என்ற கடல்சார் பொருளைக் கொண்டது; Σύρτις என்ற இடப்பெயருடன் அதன் அபாயத் தன்மையையும் வாசகருக்குப் புரியும்படி கூறுகிறது.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: கப்பலின் தளவாடத்தை இறக்கிவிட்டு
  rationale: σκεῦος என்பது பொதுவாக கருவி, சாதனம், தளவாடம் என்று பொருள்படும். இங்கு குறிப்பிட்ட கடல்சார் சாதனம் எது என்பது உறுதியற்றதால், மூலத்தின் பொதுத்தன்மை பாதுகாக்கப்படுகிறது.
- source_word: οὕτως ἐφέροντο
  choice: காற்றின் போக்கிலேயே அடித்துச் செல்லப்பட்டார்கள்
  rationale: இறந்தகாலத் தொடர்நிலைச் செயப்பாட்டு வடிவம் வெளிப்புற விசையால் தொடர்ந்து நகர்த்தப்பட்டதைச் சுட்டுகிறது; சூழலில் அந்த விசை புயற்காற்று என்பதால் தமிழ் வாசகருக்கு இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கடல்சார் தொழில்நுட்பச் செயலை விளக்கமாகக் கூறியுள்ளதுடன், σκεῦος குறித்த உண்மையான பொருள் ஐயத்தை அடிக்குறிப்பில் பாதுகாத்துள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
