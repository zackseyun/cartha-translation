source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: ta
  text: நாங்கள் இத்தாலிக்குக் கப்பலில் புறப்படுவது என்று முடிவுசெய்யப்பட்டபோது, பவுலையும் வேறு சில கைதிகளையும் அகுஸ்து படைப்பிரிவைச் சேர்ந்த[a] யூலியஸ் என்னும் ஒரு நூற்றுவரிடம் ஒப்படைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேரரசரின் படைப்பிரிவைச் சேர்ந்த”; “செபஸ்தே படைப்பிரிவைச் சேர்ந்த” என்றும் இருக்கலாம். கிரேக்கச் சொல் அகுஸ்து அல்லது பேரரசருடன் தொடர்புடைய ஒரு பட்டப்பெயரைப் பிரதிபலிக்கிறது; ஆனால் இங்கு குறிக்கப்படும் படைப்பிரிவு எது என்பது உறுதியாகத் தெரியவில்லை.
    reason: வரலாற்று இராணுவப் பெயரின் மாற்று விளக்கங்களையும் உறுதியின்மையையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἐκρίθη
  choice: முடிவுசெய்யப்பட்டபோது
  rationale: இறந்தகாலச் செயலப்பாட்டு வடிவம் அதிகாரப்பூர்வமாக எடுக்கப்பட்ட முடிவைக் குறிக்கிறது. தமிழில் இயல்பான ஆளில்லாச் செயலப்பாட்டு அமைப்பு மூலத்தின் நிர்வாகத் தொனியைப் பேணுகிறது.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: நாங்கள் இத்தாலிக்குக் கப்பலில் செல்ல வேண்டும் என்று
  rationale: இது எடுக்கப்பட்ட முடிவின் உள்ளடக்கத்தைத் தெரிவிக்கிறது. ‘கப்பலில் செல்ல’ என்பது ἀποπλεῖν என்பதன் கடற்பயணப் பொருளையும், ‘நாங்கள்’ என்பது முதலாம் நபர் பன்மை வர்ணனையையும் தெளிவாகப் பேணுகின்றன.
- source_word: παρεδίδουν
  choice: ஒப்படைத்தார்கள்
  rationale: கைதிகளை அதிகாரப்பூர்வக் காவலில் ஒப்படைப்பதை இயல்பான நவீனத் தமிழில் துல்லியமாகத் தெரிவிக்கிறது. கிரேக்கத்தில் செய்பவர்கள் வெளிப்படையாகக் குறிப்பிடப்படாததால் தமிழிலும் பன்மை வினைமுற்று மட்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: பவுலையும் வேறு சில கைதிகளையும்
  rationale: τε...καί இணைப்பு இரு செயப்படுபொருள்களையும் ஒரே ஒப்படைப்பில் இணைக்கிறது; ‘வேறு சில கைதிகள்’ என்பது τινας ἑτέρους δεσμώτας என்பதற்கான தெளிவான, இயல்பான மொழிபெயர்ப்பு.
- source_word: ἑκατοντάρχῃ
  choice: நூற்றுவர் தலைவனிடம்
  rationale: ரோமப் படையின் centurion பதவியைத் தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய முறையில் குறிக்கிறது; வேற்றுமை உருபு ஒப்படைப்பைப் பெற்றவரைக் காட்டுகிறது.
- source_word: ὀνόματι Ἰουλίῳ
  choice: யூலியு என்னும்
  rationale: பெயரை அறிமுகப்படுத்தும் கிரேக்கச் சொற்றொடருக்கான இயல்பான தமிழ் அமைப்பு.
- source_word: σπείρης Σεβαστῆς
  choice: அகுஸ்து படைப்பிரிவைச் சேர்ந்த
  rationale: σπεῖρα என்பது ரோம இராணுவப் படைப்பிரிவைக் குறிக்கிறது. Σεβαστή என்பது அகுஸ்து/பேரரசருடன் தொடர்புடைய பட்டப்பெயராக இருக்கலாம்; நேரடியான வரலாற்றுப் பெயரை உரையில் வைத்து, அதன் உறுதியின்மையை அடிக்குறிப்பு தெரிவிக்கிறது.
theological_decisions:
- issue: σπείρης Σεβαστῆς என்ற வரலாற்று ரோம இராணுவப் பெயரின் பொருள்
  choice: அகுஸ்து படைப்பிரிவைச் சேர்ந்த
  alternative: பேரரசரின் படைப்பிரிவைச் சேர்ந்த; செபஸ்தே படைப்பிரிவைச் சேர்ந்த
  rationale: இது கோட்பாட்டுச் சொல் அல்ல; எனினும் குறிப்பிட்ட படைப்பிரிவின் அடையாளம் வரலாற்று ரீதியாக உறுதியில்லை. மூலத்தின் பட்டப்பெயருடன் நெருக்கமான வடிவம் முதன்மை உரையில் தரப்பட்டு, பொருள் சார்ந்த மற்றும் இடப்பெயர் சார்ந்த சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. முதல் நபர் பன்மை வர்ணனை, அதிகாரப்பூர்வ முடிவு, காவல் ஒப்படைப்பு ஆகியவை வெளிப்படையாகப் பேணப்பட்டுள்ளன. மூலத்தில் இல்லாத ‘இப்போது’ போன்ற உரையாடல் இணைப்புச் சொல் சேர்க்கப்படவில்லை.
