revisions:
- from: நாங்கள் புயலால் கடுமையாக அலைக்கழிக்கப்பட்டதால், மறுநாளில் அவர்கள் கப்பலிலிருந்த சரக்கைக் கடலில் எறியத் தொடங்கினார்கள்.[a]
  to: நாங்கள் புயலால் கடுமையாக அலைக்கழிக்கப்பட்டுக்கொண்டிருந்தபோது, அடுத்த நாள் அவர்கள் சரக்கைக் கப்பலிலிருந்து கடலில் எறியத் தொடங்கினார்கள்.[a]
  rationale: The revision removes the unsupported causal implication and preserves the Greek participle’s ongoing passive sense with a natural temporal clause. It also improves the temporal idiom and recasts the footnote in idiomatic Tamil while explaining the nautical expression and its contextual reference to cargo.
