  yaml_path: translation/nt/acts/027/018.yaml
  text: As we were being violently storm-tossed[a], on the next day they began to throw the cargo overboard.
translation:
  language: ta
  text: நாங்கள் புயலால் கடுமையாக அலைக்கழிக்கப்பட்டுக்கொண்டிருந்தபோது, அடுத்த நாள் அவர்கள் சரக்கைக் கப்பலிலிருந்து கடலில் எறியத் தொடங்கினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “அவர்கள் ஒரு சரக்கெறிதலைச் செய்தார்கள்.” கப்பலை இலகுவாக்குவதற்காகச் சரக்கை வெளியே எறிவதைக் குறிக்கும் கடல்சார் சொல்லாட்சியை கிரேக்கம் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφοδρῶς
  choice: கடுமையாக
  rationale: புயலின் தாக்கத்தின் தீவிரத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: χειμαζομένων
  choice: புயலால் ... அலைக்கழிக்கப்பட்டதால்
  rationale: புயலில் சிக்கித் துன்புறும் செயலின் இடைநிலை/செயப்பாட்டு உணர்வையும், இங்கு வரும் genitive absolute அமைப்பின் சூழ்நிலைத் தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: ἡμῶν
  choice: நாங்கள்
  rationale: Genitive absolute அமைப்பில் உள்ள முதலாம் நபர் பன்மையைத் தமிழில் துணைவாக்கியத்தின் எழுவாயாக இயல்பாக வழங்குகிறது.
- source_word: τῇ ἑξῆς
  choice: மறுநாளில்
  rationale: ‘அடுத்த நாள்’ என்ற காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐκβολὴν
  choice: கப்பலிலிருந்த சரக்கைக் கடலில் எறிய
  rationale: கப்பலை இலகுவாக்குவதற்காகச் சரக்கைக் கடலில் எறியும் கடல்சார் பொருளைச் சூழலுக்கேற்றவாறு வெளிப்படையாகக் கூறுகிறது; ‘சரக்கு’ என்பது கிரேக்கத்தில் நேரடியாக இல்லாவிட்டாலும் இச்சொற்றொடரில் உட்கிடையாக உள்ளது.
- source_word: ἐποιοῦντο
  choice: தொடங்கினார்கள்
  rationale: Imperfect middle வடிவம் காட்டும் தொடர்ச்சியான செயலைக் கதையின் புதிய கட்டத்தின் தொடக்கமாக இயல்பான தமிழில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. புயலின் செயப்பாட்டு தாக்கமும் கடல்சார் நடவடிக்கையும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
