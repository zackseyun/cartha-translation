source:
  edition: SBLGNT
  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: ta
  text: ஆகவே, ஆண்களே, துணிவுடன் இருங்கள்; ஏனெனில், என்னிடம் சொல்லப்பட்டபடியே நடக்கும் என்று கடவுள் கூறியதை நான் நம்புகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் கடவுளை நம்புகிறேன்.” கிரேக்கச் சொற்றொடர் கடவுள்மீது நம்பிக்கை வைப்பதையோ, கடவுள் கூறியதை உண்மையென நம்புவதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட உறுதியிலிருந்து வரும் முடிவையும் அதன் அடிப்படையிலான ஊக்கத்தையும் இயல்பான தமிழில் தெளிவாக இணைக்கிறது.
- source_word: εὐθυμεῖτε
  choice: துணிவுடன் இருங்கள்
  rationale: ஆபத்தான சூழலில் மனந்தளராமல் நம்பிக்கையோடு இருக்கும்படி கூறும் கட்டளையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄνδρες
  choice: ஆண்களே
  rationale: ἀνήρ என்பதன் ஆண்பால் பன்மை விளிவடிவத்தைப் பாதுகாத்து, கப்பலில் இருந்த ஆண்களை நேரடியாக அழைப்பதைக் காட்டுகிறது.
- source_word: πιστεύω τῷ θεῷ
  choice: நான் கடவுளை நம்புகிறேன்
  rationale: πιστεύω என்பதுடன் வரும் இறைவனைக் குறிக்கும் நான்காம் வேற்றுமை, கடவுளை நம்புதல் அல்லது அவர் கூறியதை உண்மையென ஏற்றுக்கொள்ளுதல் ஆகிய இரு நெருங்கிய நுணுக்கங்களையும் கொண்டிருக்கலாம். தமிழ் சொற்றொடர் இந்த இரண்டையும் இயல்பாகத் தாங்குகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: பவுல் நம்புவதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணத்தைக் குறிப்பதாக மொழிபெயர்க்கப்படவில்லை.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: சொல்லப்பட்டபடியே நடக்கும்
  rationale: நிகழப்போவது தனக்குக் கூறப்பட்ட செய்தியுடன் துல்லியமாக ஒத்திருக்கும் என்ற கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: λελάληταί μοι
  choice: என்னிடம் சொல்லப்பட்ட
  rationale: முன்னரே கூறப்பட்டு இப்போதும் பொருந்தும் செய்தியைக் குறிக்கும் நிறைவுற்ற செயப்பாட்டு வடிவத்தையும், μοι என்பதன் தனிப்பட்ட பெறுநர் உணர்வையும் பாதுகாக்கிறது.
theological_decisions:
- issue: πιστεύω τῷ θεῷ என்பதன் பொருள்
  choice: நான் கடவுளை நம்புகிறேன்
  alternative: கடவுள் சொன்னதை நான் நம்புகிறேன் / நான் கடவுளிடம் நம்பிக்கை வைத்திருக்கிறேன்
  rationale: கிரேக்க அமைப்பு கடவுளையே நம்புவதையும் அவர் கூறிய வார்த்தையை உண்மையென ஏற்றுக்கொள்வதையும் ஒன்றோடொன்று இணைக்கிறது. முதன்மை மொழிபெயர்ப்பு இந்த உறவைப் பாதுகாக்கிறது; ஒரு நுணுக்கத்தை மட்டும் தேர்ந்தெடுத்து மற்றதை நீக்கவில்லை.
translation_notes:
  register: நவீன, பொதுநிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடல் ஆபத்தின் நடுவில் வழங்கப்படும் நேரடியான ஊக்கத்தைத் தெரிவிக்க குறுகிய இரண்டு வாக்கியங்கள் அமைக்கப்பட்டுள்ளன. ‘ஆண்களே’ என்பது மூலத்தின் பாலினக் குறிப்பைத் தக்கவைக்கிறது; ‘கடவுளை நம்புகிறேன்’ என்பது நபர்மீதான நம்பிக்கைக்கும் அவர் கூறிய செய்தியை ஏற்றுக்கொள்வதற்கும் இடமளிக்கிறது.
