- from: ஆகவே, ஆண்களே, துணிவுடன் இருங்கள். ஏனெனில், என்னிடம் சொல்லப்பட்டபடியே நடக்கும் என்று நான் கடவுளை நம்புகிறேன்.[a]
  to: ஆகவே, ஆண்களே, துணிவுடன் இருங்கள்; ஏனெனில், என்னிடம் சொல்லப்பட்டபடியே நடக்கும் என்று கடவுள் கூறியதை நான் நம்புகிறேன்.[a]
