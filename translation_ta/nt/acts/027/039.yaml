  edition: SBLGNT
  text: Ὅτε δὲ ἡμέρα ἐγένετο, τὴν γῆν οὐκ ἐπεγίνωσκον, κόλπον δέ τινα κατενόουν ἔχοντα αἰγιαλὸν εἰς ὃν ⸀ἐβουλεύοντο εἰ ⸀δύναιντο ⸀ἐξῶσαι τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: ta
  text: பகல் விடிந்தபோது, அவர்கள் அந்த நிலப்பகுதியை அடையாளம் காணவில்லை. ஆனால் கடற்கரையுள்ள ஒரு வளைகுடாவைக் கவனித்தார்கள்; முடிந்தால் கப்பலை அந்த வளைகுடாவுக்குள் செலுத்திக் கரையேற்ற[a] திட்டமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கப்பலைக் கரையில் ஏற்ற.” கிரேக்க வினைச்சொல் கப்பலைக் கரையை நோக்கிச் செலுத்தி ஏற்றுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: பகல் விடிந்தபோது
  rationale: பகல் வந்த நேரத்தைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; δέ இங்குள்ள மென்மையான கதைத் தொடர்ச்சியைத் தனிச் சொல்லால் மிகைப்படுத்தவில்லை.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: அவர்கள் அந்த நிலப்பகுதியை அடையாளம் காணவில்லை
  rationale: ἐπιγινώσκω என்பதன் ‘அடையாளம் காணுதல்’ என்ற பொருளையும், இச்சூழலில் γῆ குறிக்கும் காணப்பட்ட நிலம் அல்லது கரைப்பகுதியையும் தெளிவாகத் தருகிறது.
- source_word: κόλπον δέ τινα κατενόουν
  choice: ஆனால் ... ஒரு வளைகுடாவைக் கவனித்தார்கள்
  rationale: κόλπος என்பதற்கு இக்கடற்பயணச் சூழலில் ‘வளைகுடா’ பொருத்தமானது; τινα தரும் குறிப்பிடப்படாத தன்மையை ‘ஒரு’ காக்கிறது; κατενόουν என்பது கவனமாகக் கண்டுணர்வதைக் குறிக்கிறது.
- source_word: ἔχοντα αἰγιαλόν
  choice: கடற்கரையுள்ள
  rationale: αἰγιαλός குறிக்கும் கடற்கரை அல்லது கடலோரத்தைத் தேவையின்றி ‘மணற்கரை’ என்று மிகைப்படுத்தாமல் தருகிறது.
- source_word: εἰς ὃν
  choice: அந்த வளைகுடாவுக்குள்
  rationale: εἰς என்பதன் உள்ளே நோக்கிய திசைப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ἐβουλεύοντο εἰ δύναιντο
  choice: முடிந்தால் ... திட்டமிட்டார்கள்
  rationale: βουλεύομαι குறிக்கும் திட்டம் அல்லது ஆலோசித்த முடிவையும், εἰ உடன் வரும் optative வெளிப்படுத்தும் சாத்திய நிபந்தனையையும் இயல்பாகத் தருகிறது.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: கப்பலை ... செலுத்திக் கரையேற்ற
  rationale: கப்பலைக் கரையை நோக்கி வலுக்கட்டாயமாகச் செலுத்தி நிலைநிறுத்தும் கடற்பயணச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
