source:
  edition: SBLGNT
  text: τῇ τε ἑτέρᾳ κατήχθημεν εἰς Σιδῶνα, φιλανθρώπως τε ὁ Ἰούλιος τῷ Παύλῳ χρησάμενος ἐπέτρεψεν πρὸς τοὺς φίλους ⸀πορευθέντι ἐπιμελείας τυχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: ta
  text: மறுநாள் நாங்கள் சீதோன் துறைமுகத்தை அடைந்தோம். யூலியுஸ் பவுலைக் கனிவாக நடத்தி[a], பவுல் தன் நண்பர்களிடம் சென்று பராமரிப்பைப் பெற அனுமதித்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கனிவாக நடத்தி” என்பதை “மனிதநேயத்துடன் நடத்தி” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் ஒரு கைதியிடம் காட்டப்பட்ட இரக்கமும் நன்மையும் நிறைந்த நடத்தையை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “பராமரிப்பைப் பெற” என்பதை “கவனிப்பைப் பெற” அல்லது “உதவியைப் பெற” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத் தொடர் நண்பர்களிடமிருந்து கிடைக்கும் பராமரிப்பு, கவனம், அல்லது உதவியைப் பரந்த பொருளில் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: மறுநாள்
  rationale: கதைத் தொடரில் அடுத்த நாளைக் குறிக்கும் காலப் பொருளை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: சீதோன் துறைமுகத்தை அடைந்தோம்
  rationale: κατάγω என்பதன் கடற்பயணச் சூழலுக்குரிய, கப்பல் துறைமுகத்தில் சேரும் பொருளைப் பொதுவாசகருக்குத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: φιλανθρώπως ... χρησάμενος
  choice: மனிதநேயத்துடன் நடத்தி
  rationale: காவலில் இருந்த பவுலிடம் யூலியு காட்டிய கனிவான, மனிதாபிமானமான நடத்தையைச் சொல்கிறது; வெறும் மரியாதையைக் காட்டிலும் மூலச்சொல்லின் பரப்பை நன்கு காக்கிறது.
- source_word: ἐπέτρεψεν
  choice: அனுமதித்தார்
  rationale: அதிகாரமுடையவர் அனுமதி வழங்கிய செயலை dignified modern Tamil-ல் நேரடியாகத் தருகிறது.
- source_word: πρὸς τοὺς φίλους πορευθέντι
  choice: தம் நண்பர்களிடம் சென்று
  rationale: இங்கு φίλους என்பது சீதோனிலிருந்த பவுலின் நண்பர்களைக் குறிக்கிறது; சார்புப்பெயர் தமிழில் இயல்பான உறவுப் பொருளை வழங்குகிறது.
- source_word: ἐπιμελείας τυχεῖν
  choice: அவர்களிடமிருந்து தேவையான உதவியைப் பெற
  rationale: இந்த கிரேக்கத் தொடர் பராமரிப்பு, கவனம், நடைமுறை உதவி ஆகியவற்றை விரிவாகக் குறிக்கலாம்; 'தேவையான உதவி' சூழலுக்கேற்ற இயல்பான தமிழாகவும் பொருளின் பரப்பைக் காக்குமாறும் உள்ளது.
