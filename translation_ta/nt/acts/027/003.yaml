translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கடற்பயணச் சூழல் தெளிவாக இருக்க ‘துறைமுகத்தை’ வெளிப்படையாகச் சேர்த்துள்ளோம். ‘மனிதநேயத்துடன்’ என்பது மூலத்தின் benevolent/humane நுணுக்கத்தைப் பாதுகாக்கிறது; ‘தேவையான உதவி’ என்பது ἐπιμέλεια என்பதன் திட்டமிட்டு பரந்த பொருளைச் சுருக்காமல் வழங்குகிறது.
