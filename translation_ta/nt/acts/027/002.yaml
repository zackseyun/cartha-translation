  edition: SBLGNT
  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: ta
  text: ஆசியாவில் உள்ள இடங்களுக்குப்[b] பயணம் செய்யவிருந்த அத்ரமித்தியம் நகரத்தைச் சேர்ந்த ஒரு கப்பலில் ஏறி, கடலுக்குப் புறப்பட்டோம். தெசலோனிக்கேயைச் சேர்ந்த மக்கெதோனியரான அரிஸ்தர்க்கு எங்களுடன் இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “ஆசியாவின் கரையோர இடங்களுக்குப்” அல்லது “ஆசியக் கடற்கரையோரத் துறைமுகங்களுக்குப்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: கப்பலில் ஏறி
  rationale: கடற்பயணச் சூழலில் கப்பலில் ஏறுவதைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வினையை இயல்பான தமிழில் முதன்மை வினைக்கு முந்திய செயலாக வழங்குகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான முரண்பாட்டைக் காட்டாமல் கதைத் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் வாக்கிய வரிசையே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: அதிரமித்தியம் நகரத்தைச் சேர்ந்த ஒரு கப்பல்
  rationale: பெயரடை கப்பலின் சொந்தத் துறைமுகம் அல்லது பிறப்பிடத்தைச் சுட்டுகிறது. தமிழில் புரியாத பெயரடை வடிவத்தை உருவாக்காமல் அதன் தொடர்பைத் தெளிவாகக் கூறுகிறது.
- source_word: μέλλοντι πλεῖν
  choice: பயணம் செய்யவிருந்த
  rationale: μέλλω உடனடியான நோக்கம் அல்லது விரைவில் நிகழவிருந்த செயலைக் குறிக்கிறது; கப்பலின் திட்டமிட்ட கடற்பயணத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: ஆசியா மாகாணத்தின் கரையோர இடங்களுக்கு
  rationale: κατά + வேற்றுமை உருபு இங்கு ஆசியா மாகாணத்தை ஒட்டிய பல இடங்களைக் குறிக்கும் புவியியல் பொருளைக் கொண்டுள்ளது. கடற்பயணச் சூழல் காரணமாக ‘கரையோர’ என்பது இயல்பான வெளிப்பாடு; ‘துறைமுகங்கள்’ என்ற இன்னும் குறிப்பான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἀσίαν
  choice: ஆசியா மாகாணம்
  rationale: இது இன்றைய ஆசியக் கண்டத்தை அல்ல, மேற்கு ஆசியா மைனரில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது; வரலாற்றுப் பொருளைத் தெளிவுபடுத்த ‘மாகாணம்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀνήχθημεν
  choice: கடலுக்குப் புறப்பட்டோம்
  rationale: துறைமுகத்தைவிட்டுக் கப்பலில் புறப்படுவதற்கான வழக்கமான கடல்சார் சொல்லை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: ὄντος σὺν ἡμῖν
  choice: அரிஸ்தர்க்கும் எங்களுடன் இருந்தார்
  rationale: மூலத்தின் உடனிருக்கும் சூழ்நிலையைத் தனி இயல்பான தமிழ் வாக்கியமாக வழங்குகிறது; ‘-உம்’ அவர் பயணக் குழுவுடன் சேர்ந்திருந்ததை வெளிப்படுத்துகிறது.
- source_word: Ἀριστάρχου Μακεδόνος Θεσσαλονικέως
  choice: தெசலோனிக்கேயைச் சேர்ந்த மக்கெதோனியரான அரிஸ்தர்க்கு
  rationale: நபரின் பெயர், மக்கெதோனிய அடையாளம், தெசலோனிக்கே நகரத் தொடர்பு ஆகிய மூன்றையும் இயல்பான தமிழ் அடைமொழித் தொடரில் காக்கிறது.
