source:
  edition: SBLGNT
  text: μόλις τε παραλεγόμενοι αὐτὴν ἤλθομεν εἰς τόπον τινὰ καλούμενον Καλοὺς Λιμένας ᾧ ἐγγὺς ⸂ἦν πόλις⸃ ⸀Λασαία.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: ta
  text: சிரமத்துடன் அதன் கடற்கரையை ஒட்டிச் சென்று[a], ‘நல்ல துறைமுகங்கள்’ என்று அழைக்கப்பட்ட ஓர் இடத்தை அடைந்தோம். அதன் அருகே லசேயா என்னும் ஒரு நகரம் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் கடற்கரையை ஒட்டிக் கப்பலில் சிரமத்துடன் சென்று.” παραλεγόμενοι என்ற கிரேக்கச் சொல் கடற்கரையை ஒட்டிக் கப்பலில் செல்வதைக் குறிக்கும் கடல்சார் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: மிகுந்த சிரமத்துடன்
  rationale: பயணம் பெரும் சிரமத்தோடுதான் நிறைவேறியது என்ற வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τε
  choice: தனி இணைப்புச்சொல் இன்றி தொடரமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: இது முந்தைய நிகழ்வுடன் கதையை இணைக்கிறது; தமிழில் வாக்கியத் தொடரே அந்த இணைப்பை இயல்பாகக் காட்டுகிறது.
- source_word: παραλεγόμενοι
  choice: கரையோரமாகப் பயணம் செய்து
  rationale: கடற்கரையை ஒட்டிக் கப்பலில் செல்வதைக் குறிக்கும் மாலுமிச் சொல்லின் பொருளைப் பாதுகாக்கிறது; தமிழில் இயல்பாகவும் புரியும்படியாகவும் உள்ளது.
- source_word: αὐτὴν
  choice: அதன்
  rationale: முந்தைய சூழலில் கூறப்பட்ட கிரேத்தா தீவைக் குறிக்கும் பெண்பால் ஒருமைச் சுட்டுப்பெயரின் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ἤλθομεν
  choice: அடைந்தோம்
  rationale: இலக்கை வந்தடைந்த இயக்கத்தை இச்சூழலில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἰς τόπον τινά
  choice: ஓர் இடத்தை
  rationale: τινά என்பதன் குறிப்பற்ற தன்மையைத் தக்கவைத்தபடி, தமிழில் தேவையற்ற செயற்கைத்தன்மையைத் தவிர்க்கிறது.
- source_word: καλούμενον
  choice: என்று அழைக்கப்பட்ட
  rationale: அந்த இடத்தின் பெயரை அறிமுகப்படுத்தும் பங்கேற்புவினையின் பொருளை நேராக வெளிப்படுத்துகிறது.
- source_word: Καλοὺς Λιμένας
  choice: ‘நல்ல துறைமுகங்கள்’
  rationale: கிரேக்க இடப்பெயரின் சொற்பொருளை தமிழில் தெளிவாக வழங்குகிறது; பன்மை வடிவத்தையும் பாதுகாக்கிறது.
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: அதன் அருகே லசேயா என்னும் ஒரு நகரம் இருந்தது
  rationale: உறவுப்பெயரின் சுட்டுதலையும் ἐγγύς என்பதன் அண்மைப் பொருளையும், பெயர்ச்சொல்லுக்கு உருபில்லாத πόλις என்பதன் குறிப்பற்ற தன்மையையும் இயல்பான தமிழில் காக்கிறது.
