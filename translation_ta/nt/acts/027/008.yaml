  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கடல்பயணச் சூழலைத் தெளிவாக்க ‘கரையோரமாகப் பயணம் செய்து’ என வழங்கப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கப்பலில்’ என்பது முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் மட்டும் விளக்கப்பட்டுள்ளது.
