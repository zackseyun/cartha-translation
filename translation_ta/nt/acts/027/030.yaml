  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: ta
  text: மாலுமிகள் கப்பலிலிருந்து தப்பியோட முயன்று, கப்பலின் முனையிலிருந்து[a] நங்கூரங்களை இறக்கப்போவதாகப் பாசாங்கு செய்து, சிறுபடகைக்[b] கடலுக்குள் இறக்கியபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முன்பகுதியிலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொல் கப்பலோடு எடுத்துச் செல்லப்பட்ட சிறிய படகைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: ναυτῶν
  choice: மாலுமிகள்
  rationale: கப்பலை இயக்கும் பணியாளர்களைக் குறிக்கும் இயல்பான, நவீனத் தமிழ்ச் சொல்.
- source_word: ζητούντων φυγεῖν
  choice: தப்பியோட முயன்று
  rationale: ζητέω + infinitive இங்கு முயற்சி அல்லது நோக்கத்தைக் குறிக்கிறது; கப்பலைக் கைவிட்டுத் தப்பும் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ πλοίου
  choice: கப்பலிலிருந்து
  rationale: மூலத்தின் இடவியல் பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: χαλασάντων τὴν σκάφην
  choice: சிறுபடகைக் கடலில் இறக்கி
  rationale: σκάφη என்பது கப்பலோடு இருந்த சிறிய படகைக் குறிக்கிறது; ‘உயிர்காப்புப் படகு’ என்பது தேவையற்ற சூழல் விளக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: εἰς τὴν θάλασσαν
  choice: கடலில்
  rationale: இறக்குதல் என்ற வினையுடன் இயல்பாக இணைந்து, மூலத்தின் பொருளைப் பாதுகாக்கிறது.
- source_word: προφάσει
  choice: பாசாங்கு செய்து
  rationale: உண்மையான நோக்கத்தை மறைக்கும் போலியான காரணத்தை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: ἐκ πρῴρης
  choice: முன்பகுதியிலிருந்து
  rationale: கப்பலின் bow/prow-ஐ சாதாரண வாசகருக்குப் புரியும் தமிழில் குறிக்கிறது; மாற்றாக ‘முனையிலிருந்து’ என்பதும் சாத்தியம்.
- source_word: ἀγκύρας
  choice: நங்கூரங்களை
  rationale: பன்மையைத் துல்லியமாகப் பேணும் நிலையான தமிழ்ச் சொல்.
- source_word: μελλόντων ἐκτείνειν
  choice: பாய்ச்சப்போவதாக
  rationale: μέλλω-வின் அண்மைய நோக்கத்தையும், ἐκτείνω-வின் இச்சூழலிலான நங்கூரங்களை வெளியே இடுதல்/நீரில் செலுத்துதல் என்ற கடல்சார் செயலையும் இயல்பாகக் காட்டுகிறது.
