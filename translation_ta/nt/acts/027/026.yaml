  text: But we must run aground on some island[a].
translation:
  language: ta
  text: ஆனால் ஏதோ ஒரு தீவில் நாம் கரைதட்ட வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏதோ ஒரு தீவின் கரைக்கு அடித்துச் செல்லப்பட வேண்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள மென்மையான மாறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: εἰς νῆσον τινα
  choice: ஏதாவது ஓர் தீவில்
  rationale: τινα குறிப்பிடப்படாத ஒரு தீவைக் குறிக்கிறது; εἰς என்பது ἐκπεσεῖν உடன் சேர்ந்த கடற்பயணச் சூழலில் தமிழில் இடத்தைக் குறிக்கும் ‘தீவில்’ என இயல்பாக வெளிப்படுகிறது.
- source_word: δεῖ ἡμᾶς
  choice: நாம் ... வேண்டியிருக்கிறது
  rationale: δεῖ வெளிப்படுத்தும் கட்டாயத்தையும் அவசியத்தையும், infinitive construction-ஐ இயல்பான தமிழ் வாக்கிய அமைப்பாக மாற்றியும் காக்கிறது.
- source_word: ἐκπεσεῖν
  choice: கரைதட்ட
  rationale: கடற்பயணப் பயன்பாட்டில் கப்பல் கரையில் அல்லது ஆழமற்ற பகுதியில் சிக்குவதைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; செயப்படுபொருள் சார்ந்த நுணுக்கத்தை மாற்றுவாசிப்பு அடிக்குறிப்பில் காக்கிறது.
theological_decisions:
- issue: δεῖ குறிக்கும் அவசியத்தின் இயல்பு
  choice: வேண்டியிருக்கிறது
  alternative: கட்டாயம்
  rationale: மூலத்தில் அவசியம் தெளிவாக இருந்தாலும் அது தெய்வீக நியதி, சூழ்நிலைக் கட்டாயம், அல்லது இரண்டுமா என்பதை இவ்வசனம் மட்டும் வெளிப்படையாகத் தீர்மானிக்கவில்லை; தேர்ந்த மொழியாக்கம் அந்தத் திறந்த தன்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கரைதட்ட’ என்பது இயல்பான கடற்பயணச் சொல்; மாற்றுவாசிப்பு ἐκπεσεῖν என்பதன் செயப்படுபொருள் சார்ந்த சாத்தியத்தைப் பேணுகிறது.
