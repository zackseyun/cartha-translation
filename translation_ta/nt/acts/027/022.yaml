  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: ta
  text: இப்போதும் நான் உங்களைத் தைரியமாக இருக்கும்படி[a] கேட்டுக்கொள்கிறேன். ஏனெனில், உங்களில் எவருடைய உயிருக்கும் இழப்பு ஏற்படாது[b]; கப்பல் மட்டுமே இழக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனந்தளராமல் இருங்கள்” அல்லது “உங்கள் தைரியத்தைக் காத்துக்கொள்ளுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “உயிருக்கு எந்த இழப்பும் ஏற்படாது.” இங்கே ψυχή என்பது உடல்சார்ந்த உயிரைக் குறிக்கிறது; குறிப்பாக ஆத்துமாவைக் குறிக்கவில்லை.
    reason: lexical_alternative
