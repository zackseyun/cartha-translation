- source_word: πλὴν τοῦ πλοίου
  choice: கப்பல் மட்டுமே இழக்கப்படும்
  rationale: 'இலக்கணத்தில் சுருக்கமாக உள்ள விதிவிலக்கின் பொருளை இயல்பான தமிழில் நிறைவு செய்கிறது: மனித உயிர்கள் அல்ல, கப்பலே இழக்கப்படும்.'
theological_decisions:
- issue: ψυχή என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: கப்பல் விபத்தில் மனிதர்கள் உயிர் பிழைப்பதைப் பற்றிய உடனடி சூழல் உடல்சார்ந்த உயிரையே குறிக்கிறது; ஆத்துமா–உடல் குறித்த தனிப்பட்ட கோட்பாட்டை உரைக்குள் புகுத்தக்கூடாது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ‘இப்போதும்’ தொடர்ச்சியைப் பேணுகிறது; ‘கப்பல் மட்டுமே இழக்கப்படும்’ என்பது கிரேக்கச் சுருக்கத்தை தமிழில் இயல்பாகத் தெளிவுபடுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
