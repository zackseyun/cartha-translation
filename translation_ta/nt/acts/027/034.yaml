  edition: SBLGNT
  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: ta
  text: ஆகவே, சிறிது உணவு உட்கொள்ளுமாறு உங்களிடம் வலியுறுத்திக் கேட்டுக்கொள்கிறேன். ஏனெனில் இது உங்கள் உயிர் பிழைப்பதற்கு[a] அவசியமானது; உங்களில் எவருடைய தலையிலிருந்தும் ஒரு முடிகூட அழிந்துபோகாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் மீட்புக்காக.’ இங்குள்ள கிரேக்கச் சொல் ‘இரட்சிப்பு,’ ‘மீட்பு,’ ‘பாதுகாப்பு,’ அல்லது ‘உயிர் பிழைப்பு’ எனப் பொருள்படலாம்; இச்சூழலில் அது உடல் ரீதியாக உயிர் பிழைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய உரையிலிருந்து வரும் முடிவையும் காரணத் தொடர்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: παρακαλῶ
  choice: வலியுறுத்துகிறேன்
  rationale: இச்சூழலில் பவுல் கனிவுடன் ஆனால் தீவிரமாக வேண்டிக்கொள்வதை வெளிப்படுத்துகிறது.
- source_word: μεταλαβεῖν τροφῆς
  choice: சிறிது உணவு உட்கொள்ளும்படி
  rationale: உணவைப் பங்கெடுத்து உண்ணுதல் என்ற பொருளை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: இது உங்கள் உயிர் பிழைப்புக்கு உதவும்
  rationale: கடல் ஆபத்தின் சூழலில் σωτηρία உடல் ரீதியான மீட்பு அல்லது உயிர் பிழைப்பைக் குறிக்கிறது; πρὸς உடன் வரும் சொற்றொடரின் பயன் சார்ந்த பொருளையும் இது வெளிப்படுத்துகிறது.
- source_word: σωτηρίας
  choice: உயிர் பிழைப்பு
  rationale: இங்கு நித்திய இரட்சிப்பைவிட கப்பல் விபத்திலிருந்து உடல் ரீதியாகத் தப்பிப் பிழைப்பதே உடனடிச் சூழல்; இருப்பினும் மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: உங்களில் ஒருவருடைய...கூட
  rationale: ஒருவரும் விதிவிலக்கல்ல என்ற பகிர்ந்தளிக்கும் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: தலையிலிருந்தும் ஒரு முடிகூட
  rationale: ἀπό என்பதன் ‘இலிருந்து’ என்ற கூறைத் தக்கவைத்து, முழுமையான பாதுகாப்பைக் குறிக்கும் மொழிவழக்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπολεῖται
  choice: அழிந்துபோகாது
  rationale: ἀπόλλυμι என்பதன் அழிதல் அல்லது இழக்கப்படுதல் என்ற வலுவான பொருளைத் தக்கவைக்கிறது; ஒரு முடிகூட சேதமடையாது என்ற உறுதியை தெரிவிக்கிறது.
theological_decisions:
- issue: இச்சூழலில் σωτηρία என்பதன் பொருள்
  choice: உடல் ரீதியான உயிர் பிழைப்பு
  alternative: இரட்சிப்பு / மீட்பு
  rationale: உடனடிச் சூழல் கடல் புயலிலும் வரவிருக்கும் கப்பல் விபத்திலும் உள்ள அனைவரும் உயிர் பிழைப்பார்கள் என்ற உறுதிமொழியாகும். ஆகவே முதன்மை உரையில் உடல் ரீதியான பொருள் தெளிவாக்கப்படுகிறது; மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உணவு உட்கொள்ள’ என்பது இயல்பையும் சற்றே உயர்ந்த கதைநடையையும் சமநிலைப்படுத்துகிறது; ‘ஒரு முடிகூட’ என்ற அமைப்பு மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
