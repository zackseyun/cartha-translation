  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கடற்பயணச் சூழல் இயல்பாகத் தென்படும்படி வாக்கியம் அமைக்கப்பட்டுள்ளது; மூலத்தின் சாத்தியமான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
