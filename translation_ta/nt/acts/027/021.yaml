source:
  edition: SBLGNT
  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: ta
  text: அவர்கள் நீண்ட காலமாக உணவு உண்ணாமல் இருந்தபோது,[a] பவுல் அவர்கள் நடுவில் நின்று, “ஆண்களே, நீங்கள் என் சொல்லைக் கேட்டு, கிரேத்தாவிலிருந்து கடலுக்குப் புறப்படாமல், இந்தச் சேதத்தையும் இழப்பையும்[c] தவிர்த்திருக்க வேண்டும்” என்றார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீண்ட காலமாக உண்ணாநோன்பு இருந்தபோது.” ἀσιτία என்ற கிரேக்கச் சொல் உணவு இல்லாமையையோ உணவு உண்பதைத் தவிர்ப்பதையோ குறிக்கலாம்; இந்தப் புயல் சூழலில், நீண்ட காலம் உண்ணாமல் இருந்ததையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்குக் கீழ்ப்படிந்து.” இங்கு பவுலின் அறிவுரையை ஏற்றுச் செயல்பட்டிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “சேதம், இழப்பு” என்ற இணைச்சொற்கள், ஏற்பட்ட தீங்கு அல்லது சேதத்தையும் அதனால் உண்டான இழப்பையும் வேறுபடுத்திக் காட்டலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: அவர்கள் நீண்ட நேரமாக உணவு உண்ணாமல் இருந்தபோது
  rationale: இந்த genitive absolute பவுலின் உரைக்கு முன்பிருந்த சூழ்நிலையைச் சுட்டுகிறது. ἀσιτία என்பது உணவு கிடைக்காமையையோ உண்ணாமல் இருப்பதையோ குறிக்கலாம்; புயல் சூழலில் நீண்ட நேரம் உண்ணாதிருந்த நிலையே இயல்பான பொருள்.
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: பவுல் அவர்கள் நடுவில் எழுந்து நின்று
  rationale: σταθεὶς என்பது உரையாற்றுவதற்காக நின்ற செயலைக் குறிக்கிறது; ἐν μέσῳ αὐτῶν என்பதன் பொதுமக்கள் முன் உரையாற்றும் காட்சியை ‘அவர்கள் நடுவில்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: ஆண்களே, ... இருந்திருக்க வேண்டும்
  rationale: ἄνδρες ஆண் குழுவை நேரடியாக அழைக்கிறது. Ἔδει என்ற imperfect, கடந்தகாலத்தில் செய்ய வேண்டியிருந்த ஒன்றைச் சுட்டுவதால் ‘இருந்திருக்க வேண்டும்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: πειθαρχήσαντάς μοι
  choice: என் சொல்லைக் கேட்டு
  rationale: πειθαρχέω கீழ்ப்படிதல் அல்லது அறிவுரைக்குச் செவிகொடுத்தல் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு பவுலின் பயண அறிவுரையை ஏற்றிருக்க வேண்டும் என்பதால் ‘என் சொல்லைக் கேட்டு’ இயல்பாகவும் அதிகாரத்தை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: கிரேத்தாவிலிருந்து புறப்படாமல்
  rationale: ἀνάγω கடற்பயணச் சூழலில் கப்பலில் கடலுக்குப் புறப்படுதலைக் குறிக்கிறது. முந்தைய சூழல் கடற்பயணம் என்பதைத் தெளிவாக்குவதால் சுருக்கமான ‘புறப்படாமல்’ போதுமானது.
- source_word: κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: அப்படிச் செய்திருந்தால், இந்தச் சேதத்தையும் இழப்பையும் தவிர்த்திருக்கலாம்
  rationale: κερδαίνω அடிப்படையில் ‘ஆதாயம் அடைதல்’ என்றாலும், இங்கு தீங்கைச் சந்திக்காமல் தப்புதல் என்ற வழக்குப் பொருளைக் கொண்டுள்ளது. ὕβρις மற்றும் ζημία ஆகிய இரண்டின் வேறுபாட்டை ‘சேதம்’ மற்றும் ‘இழப்பு’ எனப் பாதுகாக்கிறது.
