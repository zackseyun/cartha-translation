  text: κἀκεῖθεν ἀναχθέντες ὑπεπλεύσαμεν τὴν Κύπρον διὰ τὸ τοὺς ἀνέμους εἶναι ἐναντίους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: ta
  text: அங்கிருந்து நாங்கள் கடலுக்குப் புறப்பட்ட பின், எதிர்க்காற்று இருந்ததால், சைப்பிரஸின் காற்றிலிருந்து பாதுகாப்பான பக்கமாகக் கப்பலில் பயணித்தோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சைப்பிரஸின் காற்றிலிருந்து மறைவான பக்கமாகக் கப்பலில் பயணித்தோம்.” இங்குள்ள கிரேக்க வினைச்சொல், ஒரு தீவின் காற்றிலிருந்து பாதுகாப்பான பக்கமாகக் கப்பலில் செல்வதைக் குறிக்கும் கடற்பயணச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: அங்கிருந்து
  rationale: καί உடன் இணைந்த ἐκεῖθεν என்பதன் தொடர்ச்சிப் பொருளைத் தமிழ் கதைநடையில் இயல்பாகத் தருகிறது; வாக்கியத் தொடர் இணைப்பை வினையெச்ச அமைப்பு ஏற்கிறது.
- source_word: ἀναχθέντες
  choice: புறப்பட்டுக் கடலுக்குச் சென்ற
  rationale: கடற்பயணச் சூழலில் ἀνάγω என்பது துறைமுகத்திலிருந்து கடலுக்குப் புறப்படுவதைக் குறிக்கிறது. நங்கூரம் எடுத்தல் என்று மூலத்தைவிடக் குறிப்பாக்காமல், முன்நிகழ்ந்த செயலை வினையெச்சமாகத் தருகிறது.
- source_word: ὑπεπλεύσαμεν
  choice: காற்றடிக்காத பக்கமாகக் கப்பலில் சென்றோம்
  rationale: ὑποπλέω என்ற கடற்பயணச் சொல் தீவின் காற்றிலிருந்து மறைவான பக்கமாகச் செல்வதைக் குறிக்கிறது. சாதாரண வாசகருக்குப் புரியும் தமிழில் அதன் கடல்சார் பொருள் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τὴν Κύπρον
  choice: சைப்பிரஸ் தீவின்
  rationale: Κύπρος என்பதற்கான வழக்கமான நவீனத் தமிழ்ப் பெயர் ‘சைப்பிரஸ்’; இடவியல் உறவு தெளிவாக இருக்க ‘தீவு’ சேர்க்கப்பட்டுள்ளது.
- source_word: διὰ τὸ ... εἶναι
  choice: வீசியதால்
  rationale: διά உடன் வரும் articular infinitive காரணத்தைக் குறிக்கிறது; தமிழில் காரண வினையெச்சம் இயல்பாக உள்ளது.
- source_word: τοὺς ἀνέμους
  choice: காற்று
  rationale: கிரேக்கத்தில் பன்மை இருந்தாலும், வானிலைச் சூழலில் தமிழில் ‘காற்று’ என்ற ஒருமைத் தொகுப்புப்பொருள் இயல்பானது.
- source_word: ἐναντίους
  choice: எங்களுக்கு எதிராக
  rationale: ἐναντίους என்பது எதிரான நிலையைச் சொல்கிறது; சூழலால் உணரப்படும் பயணிகளைக் குறிக்கும் ‘எங்களுக்கு’ தமிழில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
