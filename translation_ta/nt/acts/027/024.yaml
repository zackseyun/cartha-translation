id: ACT.27.24
reference: Acts 27:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: ta
  text: 'அவன் கூறினான்: “பவுலே, பயப்படாதே. நீ சீசரின் முன்னிலையில் ஆஜராக வேண்டும். இதோ, உன்னுடன் கப்பலில் பயணம் செய்கிற அனைவரையும் கடவுள் உனக்கு அருளாகக் கொடுத்திருக்கிறார்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: அவன் சொன்னதாவது
  rationale: முந்தைய வசனத்தில் தோன்றிய தேவதூதன் கூறிய செய்தியை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: Καίσαρί
  choice: சீசருக்கு முன்பாக
  rationale: Καῖσαρ என்பது ரோமப் பேரரசரின் பட்டப்பெயர்; தமிழில் வழக்கமான ‘சீசர்’ பயன்படுத்தப்படுகிறது.
- source_word: δεῖ παραστῆναι
  choice: நிற்க வேண்டும்
  rationale: தெய்வீகத் திட்டத்தின்படி இது நிகழ வேண்டிய அவசியத்தை δεῖ காட்டுகிறது; παραστῆναι அதிகாரியின் முன்னிலையில் ஆஜராகி நிற்பதைக் குறிக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: அடுத்து வரும் வியப்பூட்டும் அறிவிப்புக்கு கவனத்தை ஈர்க்கும் சொல்.
- source_word: κεχάρισταί σοι
  choice: உனக்குக் கருணையுடன் அளித்திருக்கிறார்
  rationale: χαρίζομαι என்பதிலுள்ள அருளான கொடை என்ற நுணுக்கத்தையும், perfect வடிவம் காட்டும் நிறைவேறிய செயலும் தொடரும் விளைவும் தக்கவைக்கப்படுகின்றன.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: உன்னுடன் கப்பலில் பயணம் செய்கிற அனைவரையும்
  rationale: ‘உன்னுடன் கடலில் பயணிப்பவர்கள் அனைவரும்’ என்ற பொருளை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: பயணிகளைக் கடவுள் பவுலுக்கு ‘அளித்தார்’ என்பதன் பொருள்
  choice: மூலத்தின் கொடை/கருணை மொழியை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘உன்னுடன் பயணம் செய்கிற அனைவரின் உயிரையும் கடவுள் காப்பாற்றுவார்’
  rationale: மாற்று வாசகம் சூழலின் விளைவை விளக்கினாலும், κεχάρισταί σοι என்பதன் உருவகத்தையும் பவுலின் வேண்டுகோளுக்குப் பதிலாக வழங்கப்பட்டிருக்கலாம் என்ற உட்குறிப்பையும் வெளிப்படையாகத் தீர்மானித்துவிடும். ஆகவே மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: δεῖ காட்டும் அவசியம்
  choice: ‘வேண்டும்’ என்று மொழிபெயர்த்து தெய்வீகமாக நிர்ணயிக்கப்பட்ட அவசியத்தைத் தக்கவைத்தல்
  alternative: ‘நீ நிற்பாய்’
  rationale: வெறும் எதிர்கால நிகழ்வைக் காட்டாமல், நிகழ வேண்டிய கட்டாயத்தை மூலச்சொல் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடி உரையில் ஒருமை அழைப்பும் கட்டளையும் தக்கவைக்கப்பட்டுள்ளன. மொழிநடை கண்ணியமானதும் சாதாரண வாசகர்களுக்குத் தெளிவானதும் ஆகும்.
