- from: 'அவன் சொன்னதாவது: “பவுலே, பயப்படாதே. நீ சீசருக்கு முன்பாக நிற்க வேண்டும். இதோ, உன்னுடன் கப்பலில் பயணம் செய்கிற அனைவரையும் கடவுள் உனக்குக் கருணையுடன் அளித்திருக்கிறார்.”'
  to: 'அவன் கூறினான்: “பவுலே, பயப்படாதே. நீ சீசரின் முன்னிலையில் ஆஜராக வேண்டும். இதோ, உன்னுடன் கப்பலில் பயணம் செய்கிற அனைவரையும் கடவுள் உனக்கு அருளாகக் கொடுத்திருக்கிறார்.”'
  rationale: Minor revisions improve idiomatic modern Tamil and clarify the official sense of Paul's required appearance before Caesar. The final clause deliberately preserves the source's wording that God has graciously granted the fellow sailors to Paul, without turning it into an explicit prediction that they will be saved.
