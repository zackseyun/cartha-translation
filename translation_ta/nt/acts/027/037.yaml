base_translation:
  language: en
  yaml_path: translation/nt/acts/027/037.yaml
  text: There were 276 persons in the ship in all[a].
translation:
  language: ta
  text: கப்பலில் நாங்கள் அனைவரும் மொத்தம் 276 பேர் இருந்தோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நெருக்கமாக: “கப்பலில் இருந்த எல்லா உயிர்களும் சேர்ந்து நாங்கள் 276 பேர் இருந்தோம்.” இங்கு “உயிர்கள்” என்பது மனிதர்களைக் குறிக்கிறது; உடலற்ற ஆத்துமாக்களை மட்டும் குறிப்பதல்ல.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: இருந்த நாங்கள்
  rationale: முதல் நபர் பன்மையான ‘நாங்கள் இருந்தோம்’ என்ற வடிவத்தைத் தக்கவைத்தபடியே, தமிழில் இயல்பான எண்ணிக்கை வாக்கியமாக அமைக்கிறது.
- source_word: δὲ
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான கதைத் தொடர்பைக் குறிக்கிறது; தமிழில் தனியாக ‘ஆனால்’ அல்லது ‘இப்போது’ சேர்த்தால் இல்லாத கால அல்லது முரண்பாட்டு நுணுக்கம் தோன்றக்கூடும்.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: நாங்கள் அனைவரும்
  rationale: ψυχαί இங்கு உடலற்ற ‘ஆத்துமாக்கள்’ என்று குறிப்பதல்ல; கப்பலில் இருந்த மனிதர்களைக் குறிக்கும் வழக்குச் சொல். πᾶσαι என்பதன் முழுமையை ‘அனைவரும்’ வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ πλοίῳ
  choice: கப்பலில்
  rationale: கிரேக்க இடவுரையை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: 276 பேர்
  rationale: துல்லியமான எண்ணிக்கையை வாசிப்புக்கு எளிய எண் வடிவில் தருகிறது; ‘பேர்’ மனிதர்களின் எண்ணிக்கையை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: ψυχαί என்பதன் பொருள்
  choice: மனிதர்கள் / பேர் என்ற பொருளில் மொழிபெயர்த்தல்
  alternative: ஆத்துமாக்கள்
  rationale: இந்தக் கணக்கெடுப்பு சூழலில் ψυχαί கப்பலில் இருந்த நபர்களைக் குறிக்கிறது; ‘ஆத்துமாக்கள்’ என்பது தேவையற்ற உடலற்ற ஆன்மீகப் பொருளை வாசகர் உணரச் செய்யலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified narrative நடை. முதல் நபர் பன்மையைத் தக்கவைத்து, கிரேக்கச் சொல்லமைப்பைத் தமிழில் இயல்பாக மாற்றியுள்ளது.
