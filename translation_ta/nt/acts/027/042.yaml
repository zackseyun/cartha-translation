  text: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο ἵνα τοὺς δεσμώτας ἀποκτείνωσιν, μή τις ἐκκολυμβήσας διαφύγῃ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: ta
  text: படைவீரர்களின் திட்டம், கைதிகளில் யாரும் நீந்திச் சென்று தப்பிவிடாதபடி, கைதிகளைக் கொல்ல வேண்டும் என்பதாக இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: திட்டமிட்டார்கள்
  rationale: சொல்லுக்குச் சொல் ‘திட்டம் ஏற்பட்டது’ என்பதற்குப் பதிலாக, படைவீரர்களிடையே ஒரு திட்டம் உருவானது என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς δεσμώτας
  choice: கைதிகளை
  rationale: கட்டப்பட்டவர்கள் அல்லது காவலில் வைக்கப்பட்டவர்கள் என்ற சூழல்சார் பொருளைத் தெளிவாகக் கூறும் பொதுவான தமிழ் சொல்.
- source_word: ἐκκολυμβήσας διαφύγῃ
  choice: நீந்தித் தப்பிவிட
  rationale: ἐκκολυμβάω என்பதன் நீந்தி வெளியேறுதல் என்ற கருத்தையும் διαφεύγω என்பதன் தப்பித்தல் என்ற கருத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
