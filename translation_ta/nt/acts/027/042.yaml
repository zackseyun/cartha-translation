revisions:
- from: ஆனால் படைவீரர்கள், கைதிகளில் எவனும் நீந்தித் தப்பிவிடாதபடி அவர்களைக் கொன்றுவிடத் திட்டமிட்டார்கள்.
  to: படைவீரர்களின் திட்டம், கைதிகளில் யாரும் நீந்திச் சென்று தப்பிவிடாதபடி, கைதிகளைக் கொல்ல வேண்டும் என்பதாக இருந்தது.
