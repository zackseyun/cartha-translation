  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: ta
  text: அங்கே நூற்றுவர் தலைவர் இத்தாலியாவுக்குச் செல்லும் அலெக்சாந்திரியக் கப்பல் ஒன்றைக் கண்டு, எங்களை அதில் ஏற்றினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே நூற்றுவர் தலைவர் இத்தாலியாவுக்குப் பயணம் செய்துகொண்டிருந்த அலெக்சாந்திரியக் கப்பல் ஒன்றைக் கண்டு, எங்களை அதில் ஏற்றினார்.”
    reason: πλέον εἰς τὴν Ἰταλίαν என்பது கப்பலின் இத்தாலியா நோக்கிய இலக்கையோ அப்போதைய பயணத் திசையையோ குறிக்கலாம்; மாற்று வாசகம் பயணத்தில் இருந்த நுணுக்கத்தை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: κἀκεῖ
  choice: அங்கே
  rationale: கிரேக்கச் சொல் ‘அங்கே’ அல்லது ‘அங்கேயும்’ எனப் பொருள்படும். தமிழ் கதைநடையில் இணைப்புச் சொல் இல்லாமலேயே தொடர்ச்சி இயல்பாக வெளிப்படுவதால் ‘அங்கே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: εὑρὼν
  choice: கண்டு
  rationale: முதன்மை வினைக்கு முன் நிகழும் செயலைக் குறிக்கும் இறந்தகால வினையெச்சம்; ‘கண்டு’ என்பது கிரேக்க வாக்கிய அமைப்பையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: ἑκατοντάρχης
  choice: நூற்றுவர் தலைவர்
  rationale: ரோமப் படையின் நூறு வீரர்களைக் கொண்ட பிரிவுடன் தொடர்புடைய அதிகாரப் பதவியைத் துல்லியமாகவும் பொதுவாசகருக்குப் புரியுமாறும் குறிக்கிறது.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: அலெக்சாந்திரியக் கப்பல் ஒன்று
  rationale: Ἀλεξανδρῖνον என்பது கப்பலின் அலெக்சாந்திரியத் தொடர்பை—தோற்றம் அல்லது பதிவிடம் போன்றதை—குறிக்கும்; மூலத்தின் தெளிவின்மையை ‘அலெக்சாந்திரியக் கப்பல்’ காக்கிறது.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: இத்தாலியாவுக்குச் சென்றுகொண்டிருந்த
  rationale: நிகழ்கால வினையெச்சமும் இலக்கிடமும் கப்பலின் அப்போதைய பயணத் திசை அல்லது நோக்கத்தைச் சுட்டுகின்றன. இத்தொடர் அதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: எங்களை அதில் ஏற்றினார்
  rationale: ἐνεβίβασεν என்பது பிறரை ஏறச் செய்வதைக் குறிக்கும் காரணவினை. ‘அதில் ஏற்றினார்’ என்பது அந்தப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
