  text: συναρπασθέντος δὲ τοῦ πλοίου καὶ μὴ δυναμένου ἀντοφθαλμεῖν τῷ ἀνέμῳ ἐπιδόντες ἐφερόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: ta
  text: கப்பல் காற்றின் பிடியில் சிக்கி, காற்றை எதிர்கொள்ள முடியாமல் போனபோது, நாங்கள் எதிர்ப்பதைக் கைவிட்டு, அடித்துச் செல்லப்பட்டோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் கப்பலை அதன் போக்கில் செல்லவிட்டு, அடித்துச் செல்லப்பட்டோம்.”
    reason: ἐπιδόντες என்பதன் விடுக்கப்பட்ட செயப்படுபொருளை கப்பலாக எடுத்துக்கொள்ளக்கூடிய சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: συναρπασθέντος
  choice: காற்றின் பிடியில் சிக்கி
  rationale: கப்பல் திடீரென வெளிப்புற வலிமையால் பிடிக்கப்பட்டது என்ற இறந்தகாலச் செயல்பாட்டு வினையெச்சத்தின் உணர்வை இயல்பான தமிழில் தருகிறது; கப்பல் ஏற்கெனவே முற்றிலும் கட்டுப்பாட்டை இழந்துவிட்டதாக மிகைப்படுத்தவில்லை.
- source_word: πλοίου
  choice: கப்பல்
  rationale: இக்கடற்பயணச் சூழலில் இயல்பான, பொதுவாகப் புரியும் நவீனத் தமிழ் சொல்.
- source_word: μὴ δυναμένου
  choice: முடியாமல் போனபோது
  rationale: கப்பலின் இயலாமையை இயல்பான தமிழ் காலத் தொடர்புடன் வெளிப்படுத்துகிறது.
- source_word: ἀντοφθαλμεῖν
  choice: எதிர்கொள்ள
  rationale: காற்றை நேராக எதிர்த்து நிற்க அல்லது அதனை நோக்கிச் செல்ல இயலாத கடற்பயணக் கருத்தைச் சுருக்கமாகத் தருகிறது; ‘முன்னேற’ போன்ற கூடுதல் கருத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: ἀνέμῳ
  choice: காற்றை
  rationale: மூலச்சொல் பொதுவாக ‘காற்று’ என்பதையே குறிக்கிறது; சூழல் புயலாக இருந்தாலும் ‘புயற்காற்று’ என்று மிகத் துல்லியப்படுத்தவில்லை.
- source_word: ἐπιδόντες
  choice: எதிர்ப்பதைக் கைவிட்டு
  rationale: காற்றின் வலிமையைத் தொடர்ந்து எதிர்க்காமல் விட்டுவிடும் கடற்பயணச் செயலைத் தெளிவான நவீனத் தமிழில் தருகிறது. கிரேக்கத்தில் விடுக்கப்பட்டுள்ள செயப்படுபொருளை உரையில் கட்டாயமாக நிரப்பவில்லை.
- source_word: ἐφερόμεθα
  choice: அடித்துச் செல்லப்பட்டோம்
  rationale: வெளிப்புற வலிமையால் தொடர்ந்து கொண்டு செல்லப்பட்டதைச் சுட்டும் imperfect passive உணர்வையும் புயல் சூழலின் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δέ
  choice: போது
  rationale: தமிழில் தனியே ‘மேலும்’ என்று தொடங்குவதைவிட, தொடர்ச்சியான நிகழ்வை காலத் துணைவாக்கியமாக இணைப்பது இயல்பாக உள்ளது.
