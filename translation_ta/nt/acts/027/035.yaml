id: ACT.27.35
reference: Acts 27:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: ta
  text: இவற்றைச் சொன்னபின், அவர் அப்பத்தை எடுத்து, எல்லாரின் முன்னிலையிலும்[a] கடவுளுக்கு நன்றி செலுத்தினார். பின்பு அதைப் பிட்டு, சாப்பிடத் தொடங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாரின் கண்முன்னேயும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: இவற்றைச் சொன்னபின்
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மைச் செயலுக்கு முன் நடந்ததைச் சுட்டுகிறது. δέ இங்கு மென்மையான கதைத் தொடர்புச் சொல்; தமிழில் இயல்பான தொடரோட்டத்திற்காகத் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: λαβὼν ἄρτον
  choice: அப்பத்தை எடுத்து
  rationale: ἄρτον என்பது அப்பத்தைக் குறிக்கிறது; அது முழு அப்பமா அல்லது ஒரு பகுதியா என்பதை மூலமொழி தெளிவுபடுத்தாததால் மொழிபெயர்ப்பும் அதைக் குறிப்பாக்கவில்லை.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: கடவுளுக்கு நன்றி செலுத்தினார்
  rationale: εὐχαριστέω என்பதன் நேரான பொருளான ‘நன்றி செலுத்துதல்’ என்பதையும், τῷ θεῷ என்ற பெறுநரையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐνώπιον πάντων
  choice: எல்லாரின் முன்னிலையிலும்
  rationale: இந்தச் செயல் அங்கிருந்த அனைவருக்கும் முன்பாக, வெளிப்படையாக நடந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: κλάσας
  choice: பின்பு அதைப் பிட்டு
  rationale: அப்பத்தை எடுத்த பின்பு அதைப் பிட்டார் என்ற செயல்முறையைப் பாதுகாக்கிறது; தமிழில் தெளிவுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἤρξατο ἐσθίειν
  choice: சாப்பிடத் தொடங்கினார்
  rationale: ἄρχομαι + வினையெச்சத்தின் தொடக்கப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அப்பத்தை எடுத்து—நன்றி செலுத்தி—பிட்டு—சாப்பிடுதல்’ என்ற வரிசையில் இருக்கக்கூடிய திருவிருந்து ஒலிப்பு
  choice: சாதாரண உணவுண்ணும் நிகழ்வாகச் செயல்களை நேரடியாக மொழிபெயர்த்தல்
  alternative: திருவிருந்து வழிபாட்டு மொழியை நினைவூட்டும் மரபுசார் சொற்றொடர்களைப் பயன்படுத்துதல்
  rationale: இந்தச் சொற்கள் திருவிருந்து நிகழ்வுகளை வாசகர்களுக்கு நினைவூட்டலாம்; ஆனால் இவ்வசனம் கப்பலில் பவுல் வெளிப்படையாக உணவு உண்டதை மட்டுமே விவரிக்கிறது, இதை ஆண்டவரின் திருவிருந்து என்று வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே அந்தத் தொடர்பை மறுக்காமலும் வலியுறுத்தாமலும் சாதாரண கதைநடையில் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பம்’ என்பது வேதாகமச் சூழலில் பரவலாக அறியப்படும் சொல்லாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளது; சமயச் சடங்கு சார்ந்த பொருள் கூடுதலாக ஏற்றப்படவில்லை.
