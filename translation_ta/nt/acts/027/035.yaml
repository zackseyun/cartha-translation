  source_fidelity: 'மூலக் கிரேக்கத்தின் செயல்வரிசை நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: இவற்றைச் சொன்னார், அப்பத்தை எடுத்தார், அனைவரின் முன்னிலையில் கடவுளுக்கு நன்றி செலுத்தினார், அதைப் பிட்டார், சாப்பிடத் தொடங்கினார். κλάσας என்பதன் முன்நிகழ் செயலும் ἤρξατο ἐσθίειν என்பதன் ‘தொடங்கினார்’ என்ற ingressive பொருளும் துல்லியமாகத் தரப்பட்டுள்ளன.'
