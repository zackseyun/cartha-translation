  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: ta
  text: ஏனெனில், நான் யாருக்குச் சொந்தமானவனோ, மேலும் யாரை வழிபடுகிறேனோ, அந்தக் கடவுளின் தூதன் இந்த இரவிலேயே என் அருகில் வந்து நின்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாருக்குப் பணிசெய்கிறேனோ.’ கிரேக்க வினைச்சொல் கடவுளுக்குச் செலுத்தும் புனிதப் பணியையோ வழிபாட்டையோ குறிக்கலாம்.
