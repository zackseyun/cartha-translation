lexical_decisions:
- source_word: παρέστη
  choice: என் அருகில் வந்து நின்றான்
  rationale: παρίστημι இங்கு பவுலின் அருகில் தூதன் திடீரென வந்து நின்றதைச் சுட்டுகிறது. ‘வந்து நின்றான்’ என்பது தோன்றுதலை மட்டும் கூறாமல் இடம்சார்ந்த பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் பவுலின் நம்பிக்கைக்கான காரணத்தை γάρ அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அந்த விளக்கத் தொடர்பைத் தெளிவாகத் தருகிறது.
- source_word: ταύτῃ τῇ νυκτί
  choice: இந்த இரவிலேயே
  rationale: சுட்டுப்பெயரால் வலியுறுத்தப்படும் உடனடித்தன்மையை ‘இந்த இரவிலேயே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῦ θεοῦ
  choice: அந்தக் கடவுளின்
  rationale: இச்சொல் ἄγγελος என்பதோடு இணைந்து தூதன் யாருடையவர் என்பதை அடையாளப்படுத்துகிறது. தொடர்ந்து வரும் உறவுநிலை வாக்கியங்களால் ஏற்கெனவே குறிப்பிட்ட கடவுளைச் சுட்டுவதால் ‘அந்தக் கடவுளின்’ இயல்பான தமிழ் அமைப்பைத் தருகிறது.
- source_word: οὗ εἰμι
  choice: நான் யாருக்குச் சொந்தமானவனோ
  rationale: சொல்லுக்கு நெருக்கமாக ‘நான் யாருடையவனோ’ எனலாம்; ‘யாருக்குச் சொந்தமானவனோ’ என்பது உடைமை மற்றும் பற்றுறவை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ᾧ καὶ λατρεύω
  choice: யாரை வழிபடுகிறேனோ
  rationale: λατρεύω கடவுளுக்குச் செலுத்தப்படும் சமயப் பணி அல்லது வழிபாட்டைக் குறிக்கிறது. இங்கு ‘வழிபடுகிறேன்’ முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது; ‘பணிசெய்கிறேன்’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது. καί-யின் இணைப்புப் பொருள் இரட்டைப் உறவுநிலை அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: ἄγγελος
  choice: தூதன்
  rationale: தெய்வீக உறுதிப்படுத்தல் இடம்பெறும் இச்சூழலில் இது மனிதச் செய்தியாளரை அல்ல, கடவுளின் தூதரைச் சுட்டுகிறது; ‘கடவுளின் தூதன்’ தமிழில் தெளிவாக உள்ளது.
theological_decisions:
- issue: οὗ εἰμι என்பதன் மொழிபெயர்ப்பு
  choice: நான் யாருக்குச் சொந்தமானவனோ
  alternative: நான் யாருடையவனோ
  rationale: இச்சொற்றொடர் பவுல் கடவுளுக்குச் சொந்தமானவர் என்பதைத் தெரிவிக்கிறது. தேர்ந்த வடிவம் கிரேக்கத்தில் உள்ளதைவிட வலுவான தனிப்பட்ட கோட்பாட்டைச் சேர்க்காமல் உடைமை மற்றும் பற்றுறவை இயல்பான தமிழில் தெரிவிக்கிறது.
- issue: λατρεύω என்பதன் மொழிபெயர்ப்பு
  choice: வழிபடுகிறேனோ
  alternative: பணிசெய்கிறேனோ
  rationale: கடவுளை நோக்கிய λατρεύω பொதுவாக சமயப் பணி அல்லது வழிபாட்டைக் குறிக்கிறது. ‘வழிபடுகிறேன்’ இச்சூழலில் அதன் தெய்வீக நோக்கைத் தெளிவாகக் காக்கிறது; ‘பணிசெய்கிறேன்’ என்ற பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் இறுதியில் வரும் ‘தூதன்’ தமிழின் இயல்பான அடைமொழி அமைப்புக்காக ‘அந்தக் கடவுளின் தூதன்’ என மையப்பகுதியில் வைக்கப்பட்டுள்ளது. ‘இந்த இரவிலேயே’ உடனடித்தன்மையை வலியுறுத்துகிறது. முதன்மை உரையில் ‘சொந்தமானவனோ’ என்பதால் οὗ εἰμι-யின் பொருள் தெளிவாக இருப்பதால் அதற்குத் தனி அடிக்குறிப்பு தேவையில்லை; λατρεύω-வின் உண்மையான பொருள் பரப்பை மட்டும் [a] காக்கிறது.
