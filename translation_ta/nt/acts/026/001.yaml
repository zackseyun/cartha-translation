  text: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη· Ἐπιτρέπεταί σοι ⸀ὑπὲρ σεαυτοῦ λέγειν. τότε ὁ Παῦλος ⸂ἐκτείνας τὴν χεῖρα ἀπελογεῖτο⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: ta
  text: 'அப்போது அகிரிப்பா பவுலிடம், “உங்கள் சார்பாகப் பேச உங்களுக்கு அனுமதி அளிக்கப்படுகிறது[a]” என்றார். பின்பு பவுல் தன் கையை நீட்டி, தற்காப்பாகப் பேசினார்[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்காக நீங்களே பேச.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் தரப்பில் வாதாடினார்.” கிரேக்க வினைச்சொல் சட்ட விசாரணையில் ஒருவர் தமது சார்பில் தற்காப்புரை ஆற்றுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: அகிரிப்பா
  rationale: கிரேக்கத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதிய வடிவம்.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு கதைநிகழ்வின் அடுத்த கட்டத்தைக் குறிக்கிறது; தமிழில் இயல்பான நிகழ்வுத் தொடரைத் தருகிறது.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: பவுலிடம் … என்றார்
  rationale: பேசுதல் சார்ந்த வினையுடன் வரும் πρὸς என்பதன் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἐπιτρέπεταί σοι
  choice: உனக்கு அனுமதி அளிக்கப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் முறையான விசாரணைச் சூழலின் தொனியையும் காக்கிறது.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: உன் சார்பாகப் பேச
  rationale: ὑπέρ என்பதன் ‘ஒருவரின் சார்பாக’ என்ற பொருளைத் தக்கவைத்து, தன் தரப்பை எடுத்துரைக்கும் சூழலைத் தெளிவாக்குகிறது.
- source_word: τότε
  choice: பின்பு
  rationale: கிரேக்கத்தில் வெளிப்படையாகக் குறிக்கப்பட்ட நிகழ்வுகளின் காலத் தொடரை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: தன் கையை நீட்டி
  rationale: உடல் அசைவை மேலதிக விளக்கமின்றி நேரடியாகக் கூறுகிறது.
- source_word: ἀπελογεῖτο
  choice: தன் தரப்பு வாதத்தை முன்வைத்தார்
  rationale: சட்ட அல்லது முறையான விசாரணைச் சூழலில் தன் தரப்பை ஆதரித்துப் பேசுவதைக் குறிக்கும் வினையின் பொருளை இயல்பான தமிழில் தருகிறது; இறந்தகால நீட்சி வடிவத்தைச் செயற்கையாகப் பிரதிபலிக்கவில்லை.
