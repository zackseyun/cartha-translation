translation_notes:
  register: நவீனத் தரத் தமிழில், விசாரணைச் சூழலுக்கேற்ற முறையான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையைக் கொண்டுள்ளது. இருவரையும் குறிக்கும் வினைகளில் மரியாதைப் பன்மை ஒருமையாகப் பயன்படுத்தப்பட்டு, தேவையற்ற சமூக நிலை வேறுபாடு தவிர்க்கப்பட்டுள்ளது.
