  rationale: உடனடியான சூழலும் பவுலின் முழு வாதமும் உயிர்த்தெழுதலுடன் தொடர்புடையவை; ஆனால் இவ்வசனம் அதன் உள்ளடக்கத்தை மீண்டும் வெளிப்படையாகக் கூறவில்லை. ஆகவே மூலத்தின் தொடர்பும் இறையியல் இடைவெளியும் காக்கப்படுகின்றன.
