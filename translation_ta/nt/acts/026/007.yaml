  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: ta
  text: பன்னிரு கோத்திரங்களாகிய நம் மக்களினம்[a] இரவும் பகலும் கடவுளுக்குப் ஆர்வத்துடன் பணி செய்து[b], அந்த வாக்குறுதியை அடையும் என எதிர்நோக்குகிறது. அரசே, இந்த நம்பிக்கையைக் குறித்தே யூதர்களால்[c] நான் குற்றஞ்சாட்டப்படுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நமது பன்னிரு கோத்திரங்கள்.’ கிரேக்கத்தில் ஒருமை வடிவிலுள்ள கூட்டுப்பெயர் பயன்படுத்தப்பட்டு, இஸ்ரவேல் பன்னிரு கோத்திர மக்களினமாகக் குறிப்பிடப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளை வழிபட்டு.’ கிரேக்க வினை கடவுளுக்குச் செலுத்தும் சமயப் பணியையோ வழிபாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, பவுல்மீது சட்டப்படி குற்றஞ்சாட்டிய யூதர்கள். இது எல்லா யூதர்களையும் ஒட்டுமொத்தமாகக் குறிக்கும் கூற்று அல்ல.
    reason: contextual_clarification
lexical_decisions:
- source_word: εἰς ἣν
  choice: அந்த வாக்குறுதியை
  rationale: உறவுப்பெயருடன் வரும் εἰς முந்தைய வசனத்திலுள்ள வாக்குறுதியை நோக்கிய இலக்கைச் சுட்டுகிறது. தமிழில் தொடர்பைத் தெளிவாக்கப் பெயர்ச்சொல் மீண்டும் வழங்கப்பட்டது.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: நமது பன்னிரு கோத்திர மக்களும்
  rationale: δωδεκάφυλον என்பது இஸ்ரவேலைப் பன்னிரு கோத்திரங்களைக் கொண்ட ஒரே மக்களினமாகக் குறிக்கும் கூட்டு ஒருமை. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இந்தக் கூட்டு அர்த்தம் இவ்வாறு தரப்பட்டது.
- source_word: ἐν ἐκτενείᾳ
  choice: ஊக்கத்தோடு
  rationale: தீவிரமான, இடைவிடாத அர்ப்பணிப்பைக் குறிக்கும் தொடரை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: νύκτα καὶ ἡμέραν
  choice: இரவும் பகலும்
  rationale: கிரேக்கச் சொல்வரிசையையும் தொடர்ந்து நடைபெறும் செயல் என்ற வழக்குப் பொருளையும் காக்கிறது.
- source_word: λατρεῦον
  choice: கடவுளுக்குப் பணிசெய்து
  rationale: கடவுளுக்குச் செலுத்தப்படும் சமயப் பணி அல்லது வழிபாட்டைக் குறிக்கும் வினை. சூழலில் மறைந்துள்ள செயப்படுபொருளாகிய கடவுள் தமிழில் தெளிவாகச் சேர்க்கப்பட்டுள்ளார்.
- source_word: ἐλπίζει καταντῆσαι
  choice: அடைவோம் என்று நம்பிக்கையுடன் எதிர்நோக்குகிறார்கள்
  rationale: எதிர்பார்க்கப்படும் இலக்கை அடைதல் என்ற καταντάω-வின் கருத்தையும் நம்பிக்கை வைக்கும் ἐλπίζω-வின் கருத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: περὶ ἧς ἐλπίδος
  choice: இந்த நம்பிக்கையைக் குறித்தே
  rationale: περί என்பதன் ‘குறித்து’ என்ற நேரடியான பொருளைக் காத்து, ஏன் வழக்கு எழுந்தது என்ற அழுத்தத்தையும் ‘-ஏ’ வெளிப்படுத்துகிறது.
- source_word: ἐγκαλοῦμαι
  choice: நான் குற்றஞ்சாட்டப்படுகிறேன்
  rationale: நீதிமன்றச் சூழலுக்கேற்ற சட்டப் பொருளையும் கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: ὑπὸ Ἰουδαίων
  choice: யூதர்களால்
  rationale: கிரேக்கத்தில் குறிப்பிட்ட உருபின்றி வரும் சொற்றொடரை நேரடியாக மொழிபெயர்க்கிறது; இது எல்லா யூதர்களையும் குறிக்கவில்லை என்பதை அடிக்குறிப்பு தெளிவாக்குகிறது.
- source_word: βασιλεῦ
  choice: அரசே
  rationale: அகிரிப்பாவை நேரடியாக அழைக்கும் விளிவேற்றுமையையும் மரியாதையான சொல்லாட்சியையும் இயல்பான தமிழில் காக்கிறது.
