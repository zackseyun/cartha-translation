  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: ta
  text: ஆனால், முதலில் தமஸ்குவில் இருந்தவர்களுக்கும், பின்பு எருசலேமில் இருந்தவர்களுக்கும், யூதேயா நாடு முழுவதிலும் இருந்தவர்களுக்கும், யூதரல்லாத மக்களுக்கும்[a], மனந்திரும்பி கடவுளிடம் திரும்பி, மனந்திரும்புதலுக்கு ஏற்ற செயல்களைச்[b] செய்ய வேண்டும் என்று அறிவித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிற இனத்தாருக்கும்.” இங்கே இச்சொல் யூதரல்லாத மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “மனந்திரும்புதலுக்குத் தகுந்த செயல்களை” என்றும் மொழிபெயர்க்கலாம். மனந்திரும்புதலுடன் பொருந்தும் நடைமுறைச் செயல்களை இச்சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள எதிர்மறைத் தொடர்பை இயல்பான தமிழில் குறிக்கிறது.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: தமஸ்குவில் இருந்தவர்களுக்கும்
  rationale: இடத்தில் இருந்த மக்களைக் குறிக்கும் பன்மை வேற்றுமையின் மறைமுகச் செயப்படுபொருள் வலிமையைத் தக்கவைக்கிறது.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: முதலில் தமஸ்குவில் இருந்தவர்களுக்கும், பின்பு எருசலேமில் இருந்தவர்களுக்கும்
  rationale: πρῶτον ... τε καί காட்டும் வரிசையையும் சேர்த்தலையும் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: யூதேயா நாடு முழுவதிலும் இருந்தவர்களுக்கும்
  rationale: χώρα என்பதன் பரந்த புவியியல் பொருளைத் தருவதோடு, அறிவிப்பைப் பெற்ற மக்களைக் தமிழில் இயல்பாக வெளிப்படச் செய்கிறது.
- source_word: τοῖς ἔθνεσιν
  choice: யூதரல்லாத மக்களுக்கும்
  rationale: இச்சூழலில் ἔθνη என்பது யூதரல்லாத மக்களைக் குறிக்கிறது; தற்போதைய சாதாரணத் தமிழில் தெளிவாக உள்ளது.
- source_word: ἀπήγγελλον
  choice: அறிவித்தேன்
  rationale: பவுல் பொதுவாக அறிவித்ததை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: μετανοεῖν
  choice: மனந்திரும்பி
  rationale: கடவுளுக்கு முன்பான மனப்போக்கு மற்றும் வாழ்வுத் திருப்பத்தைச் சுட்டும் வழக்கமான, பொருத்தமான வேதாகமத் தமிழ்.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: கடவுளிடம் திரும்பி
  rationale: கடவுளை நோக்கித் திரும்புதல் என்ற திசைசார் பொருளைக் காக்கிறது; முன்பு அவருக்குரியவர்களாக இருந்தனர் என்று அவசியம் உணர்த்துவதில்லை.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: மனந்திரும்புதலுக்கு ஏற்ற செயல்கள்
  rationale: ἄξια என்பதன் ‘தகுந்த/ஏற்ற’ பொருளையும் ἔργα என்பதன் நடைமுறைச் செயல்களையும் இயல்பாகக் காக்கிறது.
- source_word: πράσσοντας
  choice: செய்ய வேண்டும்
  rationale: அறிவிக்கப்பட்ட கட்டளையின் பகுதியாகப் பங்கேற்புச் சொல்லைத் தமிழில் இயல்பாக இணைத்து, நடைமுறை நடத்தையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மனந்திரும்புதல், கடவுளிடம் திரும்புதல், செயல்கள் ஆகியவற்றின் உறவு
  choice: செயல்கள் மனந்திரும்புதலுக்கு ஏற்றவையாகச் செய்யப்பட வேண்டும் என்று உரை கூறுவதை மட்டும் வெளிப்படுத்துதல்
  alternative: செயல்களை மனந்திரும்புதலின் முழு உள்ளடக்கமாகவோ, கடவுளின் ஏற்றுக்கொள்ளுதலைப் பெறும் தகுதியாகவோ விளக்குதல்
  rationale: μετανοεῖν மற்றும் ἐπιστρέφειν அறிவிக்கப்பட்ட பதிலைச் சுட்டுகின்றன; πράσσοντας ἄξια τῆς μετανοίας ἔργα அதனுடன் ஒத்த நடத்தையை விவரிக்கிறது. ‘ஏற்ற’ என்பது உறவைத் தக்கவைக்கிறது; உரை சொல்லாத மீட்பியல் முடிவைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தின் புவியியல் வரிசை காக்கப்பட்டுள்ளது. ‘யூதரல்லாத மக்கள்’ என்பது ‘புறஜாதியார்’ என்பதைக் காட்டிலும் இன்றைய வாசகர்களுக்கு நேரடியாகப் புரியும் சொல்லாக்கம்.
