base_translation:
  language: en
  yaml_path: translation/nt/acts/026/017.yaml
  text: delivering you from the people and from the Gentiles[a], to whom I am sending you
translation:
  language: ta
  text: மக்களிடமிருந்தும் பிற இனத்தாரிடமிருந்தும் உன்னை விடுவித்து, அவர்களிடமே நான் உன்னை அனுப்புகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மக்களிடமிருந்தும்’ என்பதற்கு, ‘யூத மக்களிடமிருந்தும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: விடுவித்து
  rationale: இச்சொல் ஆபத்திலிருந்து மீட்பதையோ விடுவிப்பதையோ குறிக்கிறது. தொடர்ச்சியான நிகழ்கால வினையெச்சத்தைத் தமிழில் இயல்பாக இணைக்கும் வகையில் ‘விடுவித்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: τοῦ λαοῦ
  choice: மக்களிடமிருந்தும்
  rationale: பிற இனத்தாருடன் உள்ள முரண்பாடு யூத மக்களைக் குறிப்பதாக இருந்தாலும், கிரேக்கத்தில் உள்ள பொதுவான ‘மக்கள்’ என்ற சொல்லை முதன்மை உரை தக்கவைக்கிறது.
- source_word: τῶν ἐθνῶν
  choice: பிற இனத்தாரிடமிருந்தும்
  rationale: இச்சூழலில் ἔθνη என்பது யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ என்பது அந்த வேறுபாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εἰς οὓς
  choice: அவர்களிடமே
  rationale: அனுப்புதல் என்னும் வினையுடன் இச்சொற்றொடர் செல்ல வேண்டிய நபர்களைக் குறிக்கிறது. ‘-மே’ இலக்கை வலியுறுத்தி, முதலில் அவர்களிடமிருந்து விடுவித்தும் பின்னர் அவர்களிடமே அனுப்புவதுமான பதற்றத்தைத் தக்கவைக்கிறது.
- source_word: ἀποστέλλω
  choice: நான் உன்னை அனுப்புகிறேன்
  rationale: நிகழ்கால ஆணைப்பணியை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘மக்கள்’ என்பதன் குறிப்பிடம்
  choice: முதன்மை உரையில் ‘மக்கள்’ எனத் தக்கவைக்கப்பட்டது; சூழலில் இது யூத மக்களைக் குறிக்கிறது.
  alternative: ‘யூத மக்கள்’ அல்லது ‘இஸ்ரயேல் மக்கள்’
  rationale: ‘பிற இனத்தார்’ என்ற எதிரிணை யூதர்களைக் குறிப்பதைத் தெளிவாக்கினாலும், மூலத்தில் உள்ள λαός என்பது ‘மக்கள்’ என்றே உள்ளது. ஆகவே விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் தருவது மூலத்தின் சொல்வடிவத்தையும் அதன் உட்குறிப்பையும் பாதுகாக்கிறது.
- issue: விடுவித்தல் மற்றும் அதே மக்களிடம் அனுப்புதல் ஆகியவற்றின் உறவு
  choice: ‘அவர்களிடமே’ என்று மொழிபெயர்த்து மூலத்தின் பதற்றம் தக்கவைக்கப்பட்டது.
  alternative: ‘அந்தப் பிற இனத்தாரிடம்’ என்று இறுதி அண்மைக் குறிப்பை மட்டும் எடுத்தல்
  rationale: εἰς οὓς என்ற பன்மை தொடர்புப்பெயர் இலக்கணப்படி முன் குறிப்பிடப்பட்ட இரு குழுக்களையும் உள்ளடக்கக்கூடும். ஒரே குழுவுக்கென அதைச் சுருக்காமல் இருவரிடமும் அனுப்பப்படுதல் என்ற இயல்பான வாசிப்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஜெந்துக்கள்’ போன்ற திருச்சபைச் சிறப்புச்சொல்லைத் தவிர்த்து ‘பிற இனத்தார்’ பயன்படுத்தப்பட்டது; மூலத்தின் யூதர்–யூதரல்லாதோர் வேறுபாடு காக்கப்பட்டது.
