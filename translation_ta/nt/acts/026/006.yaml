source:
  edition: SBLGNT
  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: ta
  text: இப்போது, கடவுள் நம் தந்தையருக்கு[a] அளித்த வாக்குறுதியைப் பற்றிய நம்பிக்கையின் காரணமாக நான் விசாரணைக்கு நிற்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் மூதாதையருக்கு.” கிரேக்கத்தில் “நம் தந்தையருக்கு” என்று உள்ளது; இது இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: இப்போது
  rationale: முந்தைய உரையோடு தற்போதைய நீதிமன்றச் சூழலை இணைக்கும் இயல்பான நவீனத் தமிழ் தொடர்.
- source_word: ἐπ’ ἐλπίδι
  choice: நம்பிக்கையின் காரணமாக
  rationale: ἐπί உடன் வரும் வேற்றுமை இங்கு பவுல் விசாரிக்கப்படுவதற்கான அடிப்படை அல்லது காரணத்தைக் குறிக்கிறது.
- source_word: ἐπαγγελίας
  choice: வாக்குறுதி
  rationale: கடவுள் கொடுத்த உறுதிமொழியைக் குறிக்கும் தெளிவான, பொதுவாகப் புரியும் சொல்.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: நம் தந்தையருக்கு அளித்த வாக்குறுதி
  rationale: εἰς τοὺς πατέρας ἡμῶν என்பது வாக்குறுதியைப் பெற்றவர்களைக் குறிக்கிறது; தமிழில் ‘...க்கு அளித்த’ என்பது இந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: கடவுள் ... அளித்த
  rationale: வாக்குறுதியின் மூலமும் செயற்பாட்டாளரும் கடவுள் என்பதைத் தெளிவாக வைத்திருக்கிறது; ‘அளித்த’ என்பது தமிழில் வாக்குறுதியுடன் இயல்பாக இணைகிறது.
- source_word: πατέρας ἡμῶν
  choice: நம் தந்தையர்
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மையையும் இஸ்ரவேலின் உடன்படிக்கை வரலாற்றில் முன்னிருந்த தந்தையரைக் குறிக்கும் நயத்தையும் காக்கிறது; ‘மூதாதையர்’ என்ற இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἕστηκα
  choice: நான் ... நிற்கிறேன்
  rationale: நிறைவேற்றுக் கால வடிவத்தின் தற்போதைய நிலைநிறுத்தும் பொருளை நீதிமன்றச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κρινόμενος
  choice: விசாரணைக்கு
  rationale: நீதித்துறைச் சூழலில் ‘விசாரிக்கப்படுதல்/தீர்ப்பிடப்படுதல்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ‘நம் தந்தையர்’ என்பவர்களின் அடையாளம்
  choice: இஸ்ரவேலின் முற்பிதாக்கள் அல்லது உடன்படிக்கை வரலாற்றின் தந்தையர்
  alternative: யூத மக்களின் மூதாதையர் என்ற பொதுவான குறிப்பு
  rationale: அகிரிப்பாவின் முன் பவுல் பேசும் சூழலில், இச்சொற்றொடர் இஸ்ரவேலின் வாக்குறுதி வரலாற்றை நினைவூட்டுகிறது. முதன்மை உரை இதை விரிவாக விளக்காமல் மூலத்தின் தந்தையர் என்ற சொல்லாட்சியை வைத்திருக்கிறது.
- issue: வாக்குறுதிக்கும் நம்பிக்கைக்கும் உள்ள உறவு
  choice: ‘வாக்குறுதியைப் பற்றிய நம்பிக்கை’ என்று மொழிபெயர்த்தல்
  alternative: ‘வாக்குறுதியின் மீதுள்ள நம்பிக்கை’ அல்லது ‘வாக்குறுதியால் எழும் நம்பிக்கை’
  rationale: γενitive கட்டமைப்பு நம்பிக்கைக்கும் வாக்குறுதிக்கும் நெருங்கிய உறவைச் சொல்கிறது; அது பொருள் சார்ந்ததா, அடிப்படை சார்ந்ததா, விளைவு சார்ந்ததா என்பதைத் தேவையின்றி முழுமையாகத் தீர்மானிக்காமல் ‘பற்றிய’ என்று வழங்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, நீதிமன்றச் சூழலுக்கு ஏற்ற தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘விசாரணைக்கு நிற்கிறேன்’ என்பது சட்டப் பொருளை இயல்பாகத் தருகிறது; ‘நம் தந்தையர்’ மூலத்தின் வடிவத்தைப் பேணுகிறது, அதற்கான தெளிவு அடிக்குறிப்பில் வழங்கப்படுகிறது.
