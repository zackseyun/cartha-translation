id: ACT.26.23
reference: Acts 26:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: ta
  text: கிறிஸ்து[a] பாடுபடுவார் என்றும், இறந்தோரிலிருந்து உயிர்த்தெழுதலில் முதன்மையானவராக அவர் மக்களுக்கும்[b] பிற இனத்தாருக்கும்[c] ஒளியை அறிவிப்பார் என்றும் சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியா.” இரு சொற்களும் “அபிஷேகம் பெற்றவர்” என்ற பட்டத்தைக் குறிக்கின்றன.
    reason: alternative_reading
  - marker: b
    text: “மக்கள்” என்பது இங்கு பிற இனத்தாரிலிருந்து வேறுபடுத்திக் கூறப்படும் யூத மக்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மற்ற நாடுகளுக்கும்.” இச்சூழலில் இது பொதுவாக யூதரல்லாத பிற இன மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: பாடுபடுவார்
  rationale: இந்தத் தீர்க்கதரிசனச் சுருக்கத்தில், பாடுபடத்தக்கவர் அல்லது பாடுபட விதிக்கப்பட்டவர் என்ற பெயரடைப் பொருளை இயல்பான தமிழ் வினை வடிவில் தருகிறது; தேவையற்ற தத்துவச் சொல்லாக்கத்தைத் தவிர்க்கிறது.
- source_word: ὁ χριστός
  choice: கிறிஸ்து
  rationale: Χριστός இங்கு அபிஷேகம் பெற்ற மீட்பருக்கான பட்டமாக வருகிறது. தமிழ் வேதாகம மற்றும் பொதுக் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் ‘கிறிஸ்து’ என்பதைக் கொண்டு, ‘மேசியா’ என்பதை அடிக்குறிப்பில் மாற்றாகக் கொடுக்கிறது.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: இறந்தோரிலிருந்து உயிர்த்தெழுவதில் முதல்வராக
  rationale: πρῶτος எனும் முன்னுரிமைக் கூற்றை வெளிப்படையாகப் பாதுகாக்கிறது; முன்பு உயிரோடு திரும்பியவர்களைப் பற்றிய இறையியல் விளக்கத்தை மூலவசனம் கூறாததால் அதை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: φῶς
  choice: ஒளி
  rationale: வெளிப்பாடு, மீட்பு, நம்பிக்கை ஆகிய பரந்த வேதாகம உருவகத்தைச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: μέλλει καταγγέλλειν
  choice: அறிவிப்பார்
  rationale: எதிர்கால நோக்கம் அல்லது விதிக்கப்பட்ட செயலை இயல்பான தமிழில் தெரிவிக்கிறது; உடனடியாக நிகழவிருப்பதாகக் குறுகச் செய்யவில்லை.
- source_word: τῷ τε λαῷ
  choice: இந்த மக்களுக்கு
  rationale: λαός என்பதன் பொதுவான வடிவைத் தக்கவைத்தபடி, சூழலில் சுட்டப்படும் யூத மக்களை ‘பிற இனத்தார்’ என்ற எதிரிணை உணர்த்த அனுமதிக்கிறது.
- source_word: τοῖς ἔθνεσιν
  choice: பிற இனத்தாருக்கு
  rationale: யூத மக்களுடன் அமைந்துள்ள இன-மத எதிரிணையை நவீன தமிழில் தெளிவாகத் தருகிறது; ‘நாடுகள்’ என்று மொழிபெயர்த்து பொருளை மறைக்கவில்லை.
- source_word: τε ... καὶ
  choice: …க்கும் …க்கும்
  rationale: இரு பெறுநர் குழுக்களையும் இணைக்கும் கிரேக்க இணைநிலையை இயல்பான தமிழ் உருபுகளால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உயிர்த்தெழுதலில் கிறிஸ்துவின் முதன்மை
  choice: ‘முதல்வராக’ என்ற மூலத்தின் முன்னுரிமைக் கூற்றை மட்டும் பிரதான உரையில் தக்கவைத்தல்
  alternative: இறுதி உயிர்த்தெழுதலின் முதற்கனி; இனி மரிக்காதபடி உயிர்த்தெழுந்த முதல் நபர்
  rationale: கிரேக்கம் πρῶτος என்று முன்னுரிமையைச் சொன்னாலும், அதன் முழு இறையியல் விளக்கத்தை இங்கே வரையறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் திறந்த நிலையைக் காக்கிறது.
- issue: ‘மக்கள்’ என்பதன் குறிப்பு
  choice: பிரதான உரையில் ‘இந்த மக்கள்’ என்று வைத்து, யூத மக்களைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பில் விளக்குதல்
  alternative: யூத மக்கள்; இஸ்ரவேல் மக்கள்
  rationale: λαός என்ற மூலச்சொல்லை நேரடியாகக் காத்து, ἔθνη உடனான எதிரிணையால் அதன் சூழல் குறிப்பை உணரச் செய்கிறது.
- issue: Χριστός பட்டத்தின் தமிழ் வடிவம்
  choice: பிரதான உரையில் ‘கிறிஸ்து’, அடிக்குறிப்பில் ‘மேசியா’
  alternative: பிரதான உரையில் ‘மேசியா’
  rationale: இரண்டும் ‘அபிஷேகம் பெற்றவர்’ என்ற பட்டத்தைக் குறிக்கின்றன. நவீனத் தமிழ் வாசகர்களுக்கு இயல்பாக அறியப்படும் வடிவத்தைப் பயன்படுத்தி, பட்டத்தன்மையை மாற்று வடிவத்தின் மூலம் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட உரை. வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால் நிறைவு பெற ‘என்றும் சொன்னேன்’ சேர்க்கப்பட்டுள்ளது; இது 26:22-இன் உரையாடல் ஓட்டத்தை இயல்பாகத் தொடர்கிறது. இறையியல் விளக்கங்களை பிரதான உரைக்குள் விரிவாக்காமல், மூலத்தின் சுருக்கத்தையும் பதற்றத்தையும் காக்கிறது.
