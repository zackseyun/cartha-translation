  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: ta
  text: எனவே, அகிரிப்பா அரசே, அந்த வானுலகத் தரிசனத்துக்குக் கீழ்ப்படியாதவனாக நான் இருக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅθεν
  choice: எனவே
  rationale: முந்தைய வசனங்களில் பவுல் விவரித்த சந்திப்பையும் தனக்குக் கொடுக்கப்பட்ட பணியையும் அடிப்படையாகக் கொண்ட முடிவை இயல்பான நவீன தமிழில் இணைக்கிறது.
- source_word: βασιλεῦ Ἀγρίππα
  choice: அகிரிப்பா அரசே
  rationale: நேரடி விளியின் மரியாதைத் தலைப்பையும் பெயரையும் தமிழின் இயல்பான விளி அமைப்பில் தக்கவைக்கிறது.
- source_word: οὐκ ἐγενόμην
  choice: நான் ... இருக்கவில்லை
  rationale: γίνομαι இங்கு பண்புப்பெயருடன் ‘இரு/ஆகு’ என்ற பொருளில் வருகிறது. மூலத்தின் எதிர்மறை அமைப்பைத் தக்கவைத்து தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ἀπειθὴς
  choice: கீழ்ப்படியாமல்
  rationale: இறைவன் கொடுத்த பணியை ஏற்று நடக்க மறுப்பதைக் குறிக்கும் சூழலில், வெறும் ‘நம்பாமல்’ என்பதைக் காட்டிலும் கீழ்ப்படியாமை என்ற செயல்விருப்பப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: அந்த வானுலகத் தரிசனத்துக்கு
  rationale: ὀπτασία என்பதன் இயல்புக்கு அப்பாற்பட்ட காட்சி/தரிசனம் என்ற பொருளையும், οὐράνιος சுட்டும் வானுலகத் தோற்றம் அல்லது மூலத்தையும் சுருக்கமாகத் தக்கவைக்கிறது. ἀπειθής உடன் வரும் வேற்றுமையைத் தமிழில் ‘-க்கு’ என இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: தமஸ்கு வழியில் பவுலுக்கு ஏற்பட்ட அனுபவத்தின் இயல்பு
  choice: தரிசனம்
  alternative: காட்சி; வானத்திலிருந்து வந்த வெளிப்பாடு
  rationale: ὀπτασία நேரடியாக ஒரு தரிசனம் அல்லது தோற்றத்தைக் குறிக்கிறது. ‘தரிசனம்’ என்பது மூல உரையின் வகைப்பாட்டைத் தக்கவைத்து, அதை மேலும் விரிவான இறையியல் விளக்கமாக மாற்றாமல் விடுகிறது.
- issue: οὐράνιος என்பது தரிசனத்தின் மூலத்தையா இயல்பையா குறிக்கிறது
  choice: வானுலகத் தரிசனம்
  alternative: வானத்திலிருந்து வந்த தரிசனம்
  rationale: பெயரடை தரிசனத்தின் வானுலக இயல்பையோ வானத்திலிருந்து வந்த மூலத்தையோ குறிக்கலாம். முதன்மை உரை இந்த இரு நுட்பங்களையும் திறந்தவையாக வைத்திருக்கிறது; அடிக்குறிப்பு மூலத்தைக் குறிப்பாக வெளிப்படுத்தும் மாற்றை அளிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அகிரிப்பா அரசே’ நேரடி விளியை இயல்பாகக் காட்டுகிறது. மூலத்தின் ‘கீழ்ப்படியாதவனாக இருக்கவில்லை’ என்ற இரட்டை எதிர்மறையை மிகக் கனமாக்காமல், ‘கீழ்ப்படியாமல் இருக்கவில்லை’ என்று அதன் வலியுறுத்தலைத் தக்கவைத்துள்ளது.
