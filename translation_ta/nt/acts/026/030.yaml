translation_notes:
  register: நவீன நிலையான தமிழில், முறையான நிகழ்விடத்துக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கப் பட்டியலின் சேர்த்துக் கூறும் அமைப்பு தமிழ் எண்ணும்மையால் இயல்பாக்கப்பட்டுள்ளது; வசனம் அடுத்த வசனத்தோடு தொடர்வதால் இறுதியில் தொடர்ச்சியை உணர்த்தும் நிறுத்தக்குறி பொருத்தமாக இருக்கலாம் என்றாலும், தனி வசன வெளியீட்டில் முற்றுப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
