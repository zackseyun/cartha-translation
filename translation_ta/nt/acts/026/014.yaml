source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: ta
  text: 'நாங்கள் எல்லாரும் தரையில் விழுந்தபோது, எபிரேய மொழியில்[a] என்னிடம் சொல்லும் குரலைக் கேட்டேன்: “சவுலே, சவுலே, நீ ஏன் என்னைத் துன்புறுத்துகிறாய்? முள்கோல்களுக்கு எதிராக உதைப்பது உனக்குக் கடினம்.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரமேய மொழியில்” எனப் பொருள்படலாம்; கிரேக்கத் தொடர் சொற்பட “எபிரேய மொழி/பேச்சுவழக்கு” என்று கூறுகிறது.
    reason: alternative_reading
  - marker: b
    text: இது ஒரு பழமொழி. கால்நடைகளை ஓட்டும் கூர்முனைக் கோல்களை எதிர்த்து உதைப்பது உதைக்கும் விலங்கிற்கே காயம் விளைவிப்பதுபோல, பேசுகிறவரை எதிர்ப்பது எதிர்ப்பவருக்கே தீங்கு விளைவிக்கும் என்பதே இதன் கருத்து.
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: நாங்கள் எல்லாரும் தரையில் விழுந்தபோது
  rationale: முற்றுப்பெற்ற முன்நிகழ்வைக் குறிக்கும் வேற்றுமைத் தனிநிலைத் தொடரை இயல்பான தமிழ்க் காலவாக்கியமாக மொழிபெயர்க்கிறது; πάντων மற்றும் ἡμῶν ஆகியவற்றின் முழுமையும் காக்கப்படுகிறது.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: என்னிடம் இப்படிச் சொல்லும் ஒரு குரலைக் கேட்டேன்
  rationale: φωνή என்பதை தொடரும் நேரடிப் பேச்சுக்கு ஏற்றவாறு ‘குரல்’ என்றும், πρός με என்பதை உரை பவுலை நோக்கிச் சொல்லப்பட்டதைக் காட்ட ‘என்னிடம்’ என்றும் வழங்குகிறது.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: எபிரெய மொழியில்
  rationale: கிரேக்கத் தொடரின் வெளிப்படையான பொருளை முதன்மை உரையில் காக்கிறது; அது அரமேய மொழியைக் குறிக்கக்கூடும் என்ற வரலாற்று-மொழியியல் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Σαοὺλ Σαούλ
  choice: சவுலே, சவுலே
  rationale: பெயரின் இருமுறை அழைப்பையும் அதன் அழைப்புவேற்றுமை வலியுறுத்தலையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: τί με διώκεις;
  choice: நீ ஏன் என்னைத் துன்புறுத்துகிறாய்?
  rationale: διώκεις இச்சூழலில் குறிக்கும் பகைமையான துரத்தல் மற்றும் துன்புறுத்தலை இயல்பான தற்போதைய தமிழில் வெளிப்படுத்துகிறது.
- source_word: σκληρόν σοι πρὸς κέντρα λακτίζειν
  choice: தாற்றுக்கோல்களுக்கு எதிராக உதைப்பது உனக்குக் கடினம்
  rationale: பழமொழியின் உருவகத்தை விளக்கவுரையாக மாற்றாமல் காக்கிறது. κέντρα என்பது கால்நடைகளை ஓட்டப் பயன்படுத்திய கூர்முனைக் கோல்களைக் குறிக்கும்; ‘தாற்றுக்கோல்’ அதற்கான சுருக்கமான தமிழ்ச் சொல்.
theological_decisions:
- issue: τῇ Ἑβραΐδι διαλέκτῳ என்பதன் மொழியியல் குறிப்பு
  choice: எபிரெய மொழியில்
  alternative: அரமேய மொழியில்
  rationale: மூல கிரேக்கத்தின் நேரடிச் சொல்லாட்சியான ‘எபிரெய’ முதன்மை உரையில் வைக்கப்படுகிறது. முதல் நூற்றாண்டுச் சூழலில் இது அரமேய மொழியைக் குறித்திருக்கலாம் என்ற புரிதல் சாத்தியமாக மட்டும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; தெளிவில்லாததை மொழிபெயர்ப்பே தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் மரியாதைமிக்க நேரடி உரைநடையிலும் வடிவமைக்கப்பட்டது. அரிதாக இருக்கக்கூடிய ‘தாற்றுக்கோல்’ என்ற சொல் பழமொழியின் பண்பாட்டு உருவகத்தைத் துல்லியமாகக் காக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது. வழங்கப்பட்ட ஆங்கில அடிக்குறி இடங்கள் அவற்றின் உள்ளடக்கத்துடன் பொருந்தாததால், [a] ‘எபிரெய மொழியில்’ என்பதற்குப் பின்னும் [b] பழமொழிக்குப் பின்னும் பொருத்தப்பட்டுள்ளன.
