source:
  edition: SBLGNT
  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: ta
  text: எல்லா ஜெபக்கூடங்களிலும் அவர்களைப் பலமுறை தண்டித்து, இறைநிந்தனை செய்யும்படி அவர்களைக் கட்டாயப்படுத்த முயன்றேன். அவர்கள்மீது அளவுகடந்த சீற்றம் கொண்டு, வெளியிலுள்ள நகரங்கள் வரைக்கும்கூட[a] அவர்களைத் தொடர்ந்து துன்புறுத்தினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மேலும் சொற்சொல்லாக, ‘வெளியிலுள்ள நகரங்கள் வரைக்கும்’; இது யூதேயாவுக்கு அப்பாலுள்ள நகரங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: எல்லா ஜெபக்கூடங்களிலும்
  rationale: κατά உடன் வரும் வேற்றுமை வடிவம் பல்வேறு ஜெபக்கூடங்களில் திரும்பத் திரும்ப நடந்த செயலைக் குறிக்கிறது; தமிழில் இவ்வடிவம் இடத்தையும் முழுப் பரப்பையும் இயல்பாகக் காட்டுகிறது.
- source_word: πολλάκις τιμωρῶν
  choice: பலமுறை தண்டித்து
  rationale: πολλάκις செயலின் தொடர்ச்சியான மறுநிகழ்வை வெளிப்படுத்துகிறது; பங்கேற்புவினையான τιμωρῶν முதன்மைச் செயலோடு இணைந்த சூழல் அல்லது வழிமுறையைக் குறிக்கிறது.
- source_word: ἠνάγκαζον
  choice: கட்டாயப்படுத்த முயன்றேன்
  rationale: இறந்தகால நிறைவுறா வடிவம் திரும்பத் திரும்ப மேற்கொள்ளப்பட்ட கட்டாய முயற்சியை இச்சூழலில் வெளிப்படுத்துகிறது; எல்லா முயற்சிகளும் வெற்றியடைந்தன என்று கூறாமல் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: βλασφημεῖν
  choice: இறைநிந்தனை செய்யும்படி
  rationale: நிந்தனையின் இலக்கு கிரேக்கத்தில் குறிப்பிடப்படவில்லை. இயேசுவையோ கிறிஸ்தவ அறிக்கையையோ குறிப்பாகச் சேர்க்காமல் மூலத்தின் பொதுவான சொல்லாட்சி காக்கப்படுகிறது.
- source_word: περισσῶς ἐμμαινόμενος
  choice: அளவுகடந்த சீற்றம்கொண்டு
  rationale: περισσῶς தீவிரத்தை மிகைப்படுத்திக் காட்டுகிறது; ἐμμαινόμενος மனநோயைக் குறிக்கும் நவீன தவறான எண்ணத்தைத் தவிர்த்து, வெறிகொண்ட பகைமை மற்றும் சீற்றத்தை வெளிப்படுத்துகிறது.
- source_word: ἐδίωκον
  choice: தொடர்ந்து துன்புறுத்தினேன்
  rationale: நிறைவுறா வடிவம் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் காட்டுகிறது; அப்போஸ்தலர் நடபடிகளில் διώκω விசுவாசிகளுக்கு எதிரான பகைமையான பின்தொடர்தலையும் துன்புறுத்தலையும் குறிக்கிறது.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: வெளியிலுள்ள நகரங்கள்வரைக்கும்கூட
  rationale: ἔξω எதற்கு வெளியே என்பதை உரை வெளிப்படையாகக் கூறவில்லை. ஆகவே ‘வெளிநாட்டு நகரங்கள்’ என்று பொருளைக் குறுக்காமல், மூலத்தின் இடவியல் தெளிவின்மையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: βλασφημεῖν என்பதன் இலக்கு
  choice: ‘இறைநிந்தனை செய்யும்படி’ என்று இலக்கைக் குறிப்பிடாமல் மொழிபெயர்த்தல்
  alternative: ‘இயேசுவை நிந்திக்கும்படி’ அல்லது ‘கிறிஸ்தவ விசுவாச அறிக்கையைச் சபிக்கும்படி’
  rationale: சூழல் இயேசுவுக்கோ கிறிஸ்தவ செய்திக்கோ எதிரான நிந்தனையைச் சுட்டினாலும், கிரேக்க மூலத்தில் அதன் இலக்கு சொல்லப்படவில்லை; அந்தத் தெளிவின்மையைத் தீர்த்துவிடாமல் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஜெபக்கூடம்’, ‘இறைநிந்தனை’, ‘துன்புறுத்தினேன்’ ஆகியவை திருச்சபைச் சூழலில் பரிச்சயமானவையாக இருந்தாலும் பிரிவுசார் தனித்தன்மையைச் சுமத்தாத சொற்கள். அடிக்குறிப்புக் குறி அது விளக்கும் ‘வெளியிலுள்ள நகரங்கள்’ என்ற தொடருக்குப் பின்பு வைக்கப்பட்டுள்ளது.
