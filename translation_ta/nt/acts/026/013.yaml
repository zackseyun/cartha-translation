  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: ta
  text: நடுப்பகலில்[a], வழியில், அரசே, விண்ணிலிருந்து சூரியனின் ஒளிப்பொலிவைவிட மிகுந்த ஒரு ஒளி என்னையும் என்னுடன் பயணம் செய்தவர்களையும் சுற்றி ஒளிர்ந்ததை நான் கண்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாளின் நடுவில்.” கிரேக்கச் சொற்றொடர் நடுப்பகல் நேரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: நடுப்பகல் வேளையில்
  rationale: நாளின் நடுப்பகுதியைக் குறிக்கும் கால மரபுத்தொடரை இயல்பான நவீனத் தமிழில் துல்லியமாகத் தருகிறது.
- source_word: κατὰ τὴν ὁδὸν
  choice: வழியில் சென்றுகொண்டிருந்தபோது
  rationale: பயணத்தின்போது வழியில் நிகழ்ந்த சம்பவம் என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; பின்னுள்ள பயணச் சூழலையும் காக்கிறது.
- source_word: εἶδον
  choice: நான் கண்டேன்
  rationale: கடந்தகால நேரடியான பார்வைப் புலனை எளிமையாகவும் தெளிவாகவும் தருகிறது.
- source_word: βασιλεῦ
  choice: அரசே
  rationale: அகிரிப்பாவை நோக்கிய மரியாதையான நேரடி அழைப்பை நவீனத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: οὐρανόθεν
  choice: வானத்திலிருந்து
  rationale: ஒளியின் மேலுலகத் தோற்றத்தைத் தருகிறது; வெறும் வளிமண்டல இருப்பிடமாகக் குறுக்காமல் மூலத்தின் இறையியல் சாத்தியத்தையும் காக்கிறது.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: சூரியனின் ஒளியைவிட அதிக ஒளிவீசிய
  rationale: ὑπέρ குறிக்கும் மிஞ்சுதலையும் λαμπρότης குறிக்கும் ஒளிப்பொலிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: φῶς ... περιλάμψαν
  choice: ஒரு வெளிச்சம் ... சுற்றிப் பிரகாசித்ததை
  rationale: ஒளி அவர்களைச் சூழ்ந்து ஒளிவீசியது என்ற கூட்டு வினையின் சுற்றுப்புறப் பொருளைக் காக்கிறது.
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: என்னுடன் பயணம் செய்தவர்களையும்
  rationale: பவுலுடன் பயணம் செய்தவர்களை எந்தக் கூடுதல் அடையாளமும் சேர்க்காமல் நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: தரிசனச் சூழலில் οὐρανόθεν என்பதன் பொருள்
  choice: வானத்திலிருந்து
  alternative: விண்ணிலிருந்து / ஆகாயத்திலிருந்து
  rationale: லூக்கா–அப்போஸ்தலர் நூல்களில் உள்ள மேலுலகத் தோற்றத்தின் இறையியல் ஒலியைத் தக்கவைத்துக்கொண்டு, நிகழ்வை அளவுக்கு மீறி விளக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வாய்மொழிச் சாட்சியின் ஓட்டமும் காக்கப்பட்டுள்ளன. ‘அரசே’ என்ற அழைப்பு வாக்கிய நடுவில் வைக்கப்பட்டுள்ளது; சூரிய ஒளியை மிஞ்சிய தன்மை வெளிப்படையாகத் தரப்பட்டுள்ளது.
