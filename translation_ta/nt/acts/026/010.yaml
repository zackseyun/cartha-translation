source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: ta
  text: 'எருசலேமில் நானும் இதையே செய்தேன்: தலைமை ஆசாரியர்களிடமிருந்து அதிகாரம் பெற்று, பரிசுத்தவான்களில் பலரைச் சிறைகளில் அடைத்தேன்; மேலும், அவர்கள் கொல்லப்பட்டபோது, அவர்களுக்கு எதிராக என் வாக்கை அளித்தேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் கொல்லப்பட்டபோது அவர்களுக்கு எதிராக நான் ஒப்புதல் அளித்தேன்.” கிரேக்கச் சொற்றொடர் நேரடியாக ஒரு ‘வாக்கை’ (ψῆφος) அளிப்பதைக் குறிக்கிறது; இது முறையான வாக்கெடுப்பைக் குறிக்கிறதா, அல்லது உறுதியான ஒப்புதலைக் குறிக்கிறதா என்பதில் விளக்க வேறுபாடுகள் உள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: நான் அப்படியே செய்தேன்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட துன்புறுத்தும் நோக்கத்தையும் செயலையும் ὃ பின்னோக்கிச் சுட்டுகிறது; ‘அப்படியே செய்தேன்’ என்பது அந்தத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν Ἱεροσολύμοις
  choice: எருசலேமில்
  rationale: இடப்பெயரின் வழக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: πολλούς τε τῶν ἁγίων
  choice: பரிசுத்தவான்களில் பலரை
  rationale: ἅγιοι என்பது இயேசுவில் நம்பிக்கை கொண்ட கடவுளுடைய பரிசுத்த மக்களைக் குறிக்கிறது; பிற்காலத்தில் சிறப்பாக அங்கீகரிக்கப்பட்ட சிலரை மட்டும் குறிக்கவில்லை.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: சிறைகளில் அடைத்தேன்
  rationale: κατακλείω-வின் அடைத்துவைக்கும் பொருளையும் φυλακαῖς என்ற பன்மையையும் சுருக்கமின்றிக் காக்கிறது.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: முதன்மைக் குருக்களிடமிருந்து அதிகாரம் பெற்று
  rationale: பவுல் எந்த அதிகாரத்தின் அடிப்படையில் செயல்பட்டார் என்பதைப் பங்கேற்புவினைத் தொடர் விளக்குகிறது; ἐξουσία என்பதற்கு ‘அதிகாரம்’ நேரடியான இணை.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: அவர்கள் கொல்லப்பட்டபோது
  rationale: இங்குள்ள ἀναιρέω உயிரைப் பறித்தல் அல்லது கொல்லுதல் என்று பொருள்படுகிறது. ‘கொல்லப்பட்டபோது’ மூலத்தின் செயப்பாட்டு வடிவத்தையும் காலத் தொடர்பையும் காக்கிறது; சட்டபூர்வ மரணதண்டனை என்று மிகையாகக் குறிப்பதில்லை.
- source_word: κατήνεγκα ψῆφον
  choice: அவர்களுக்கு எதிராக என் வாக்கையும் அளித்தேன்
  rationale: ψῆφος வாக்களிக்கப் பயன்படுத்தப்பட்ட கல்லையும், அதனால் ‘வாக்கு’ என்பதையும் குறிக்கிறது. சூழலில் எதிரான வாக்கு என்பது தெளிவாக இருப்பதால் தமிழில் வெளிப்படுத்தப்பட்டுள்ளது; ‘என் வாக்கு’ தனிப்பட்ட பங்கேற்பைத் தெரிவிக்கிறது.
theological_decisions:
- issue: அப்போஸ்தலர் நூலில் ἅγιοι என்பதன் பொருள்
  choice: பரிசுத்தவான்கள்—இயேசுவில் நம்பிக்கை கொண்ட சமூகத்தினர்
  alternative: பரிசுத்த மக்கள் / இறைமக்கள்
  rationale: இச்சொல் விசுவாசிகள் அனைவரையும் குறிக்கிறது; தனிப்பட்ட உயர்நிலைப் பிரிவையோ பிற்கால புனிதர் பட்டத்தையோ குறிக்காது. ‘பரிசுத்தவான்கள்’ மூலச்சொல்லின் முக்கியத் தொடர்பைக் காக்கிறது.
- issue: κατήνεγκα ψῆφον என்பதன் வலிமை
  choice: அவர்களுக்கு எதிராக என் வாக்கையும் அளித்தேன்
  alternative: அவர்களுடைய கொலைக்கு நான் ஒப்புதல் அளித்தேன்
  rationale: சொற்றொடர் இயல்பாக வாக்களிக்கும் செயலைக் குறிக்கிறது. அது முறையான எந்தச் சபையில் நடந்தது என்பதை உரை கூறாததால், மொழிபெயர்ப்பு அந்த நிறுவனச் சூழலைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. τε…τε இணைப்பின் சேர்க்கைப் பொருள் அரைப்புள்ளி மற்றும் ‘வாக்கையும்’ என்பதன் மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
