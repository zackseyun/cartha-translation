  source_fidelity: 'மூலக் கிரேக்கத்தின் எல்லாக் கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: அழைப்பு வடிவமான «அகிரிப்பா அரசரே», இறைவாக்கினர்களை நோக்கிய கேள்வி, οἶδα-வின் நிகழ்காலப் பொருளான «எனக்குத் தெரியும்», மற்றும் இருமுறை வரும் πιστεύεις ஆகியவை தெளிவாகத் தரப்பட்டுள்ளன. இறைவாக்கினர்களின் சாட்சியை நம்புதல்/ஏற்றுக்கொள்ளுதல் என்ற திறந்த பொருள் பாதுகாக்கப்படுகிறது.'
