  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: ta
  text: அகிரிப்பா அரசரே, நீங்கள் இறைவாக்கினர்களை நம்புகிறீர்களா?[a] நீங்கள் நம்புகிறீர்கள் என்று எனக்குத் தெரியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைவாக்கினர்களை ஏற்றுக்கொள்கிறீர்களா?” அல்லது “இறைவாக்கினர்களிடம் நம்பிக்கை வைக்கிறீர்களா?”
    reason: πιστεύω என்ற வினை இச்சூழலில் நம்புதல், உண்மையென ஏற்றுக்கொள்ளுதல், நம்பிக்கை வைத்தல் ஆகிய நெருங்கிய பொருள்களைத் தரலாம்.
lexical_decisions:
- source_word: πιστεύεις
  choice: நம்புகிறீர்களா / நம்புகிறீர்கள்
  rationale: நிகழ்காலச் செய்பாட்டு வினை. முதல் இடத்தில் நேரடியான கேள்வியாகவும், இரண்டாம் இடத்தில் பவுலின் உறுதியான கூற்றாகவும் இயல்பான தமிழில் தரப்பட்டுள்ளது; ஒரே வினைச்சொல்லின் மறுபயன்பாடும் காக்கப்பட்டுள்ளது.
- source_word: βασιλεῦ Ἀγρίππα
  choice: அகிரிப்பா அரசரே
  rationale: βασιλεῦ என்பது அழைப்புவேற்றுமை. நவீன மரியாதைத் தமிழில் பெயருடன் சேரும் இயல்பான நேரடி அழைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τοῖς προφήταις
  choice: இறைவாக்கினர்களை
  rationale: πιστεύω என்பதுடன் வரும் பன்மை உருபு, இறைவாக்கினர்களையும் அவர்களுடைய சாட்சியையும் நம்புவதைச் சுட்டுகிறது. மூலத்தின் நபரைக் குறிக்கும் வடிவத்தைத் தக்கவைக்க ‘அவர்கள் கூறியவற்றை’ என்று விரித்துரைக்கவில்லை.
- source_word: οἶδα
  choice: எனக்குத் தெரியும்
  rationale: வடிவத்தில் நிறைவுக்காலமாக இருந்தாலும் நிகழ்காலப் பொருள் தரும் வினை; பவுலின் நேரடியான உறுதியை இயல்பான தமிழில் காக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: பவுலுக்குத் தெரிந்த செய்தியை அறிமுகப்படுத்தும் இயல்பான தமிழ் இணைப்புமுறை.
theological_decisions:
- issue: ‘இறைவாக்கினர்களை நம்புதல்’ என்பதன் தன்மை
  choice: இறைவாக்கினர்களையும் அவர்களுடைய சாட்சியையும் உண்மையென ஏற்றுக்கொள்ளும் பொருளைத் திறந்தவாறே வைத்தல்
  alternative: ‘இறைவாக்கினர்கள் சொன்னவற்றுக்குக் கீழ்ப்படிகிறீர்களா?’ அல்லது பொதுவான சமயநம்பிக்கையாக விரித்துரைத்தல்
  rationale: πιστεύω + dative இங்கு இறைவாக்கினர்களின் சாட்சியை நம்புதல் அல்லது ஏற்றுக்கொள்ளுதல் என்ற பொருளை இயல்பாகத் தருகிறது. கீழ்ப்படிதல் அல்லது முழுமையான கோட்பாட்டு ஒப்புதல் என்ற கூடுதல் கருத்து மூலத்தில் வெளிப்படையாக இல்லை.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க, பொதுமக்கள் புரிந்துகொள்ளக்கூடிய தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அகிரிப்பா அரசரே’ என்பது இயல்பான நேரடி அழைப்பு; ‘இறைவாக்கினர்கள்’ என்பது சமயப்பிரிவு சாராத தெளிவான சொல். கிரேக்கத்தில் இருமுறை வரும் πιστεύεις தமிழிலும் இருமுறை ‘நம்புகிறீர்கள்’ எனக் காக்கப்பட்டுள்ளது.
