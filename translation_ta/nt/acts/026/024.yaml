reference: Acts 26:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: ta
  text: பவுல் இவற்றைத் தன் தற்காப்பாகக் கூறிக்கொண்டிருக்கையில், பெஸ்து உரத்த குரலில், “பவுலே, உனக்குப் பைத்தியம் பிடித்திருக்கிறது! உன்னுடைய மிகுந்த படிப்பு உன்னைப் பைத்தியத்திற்குத் தள்ளுகிறது” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பவுலே, நீ பைத்தியமாக இருக்கிறாய்! உன்னுடைய மிகுந்த படிப்பு உன்னைப் பைத்தியமாக்குகிறது.”
    reason: முதல் வாக்கியத்தில் Μαίνῃ-யின் நேரடியான நிலைவர்ணனையையும், இரண்டாவது வாக்கியத்தில் περιτρέπει-யின் நேரடியான காரணவினை வடிவத்தையும் வழங்குகிறது.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: தமது தரப்பு நியாயத்தை எடுத்துரைத்துக்கொண்டிருக்கையில்
  rationale: இந்தப் பிறவினைத் தொடர்புத் தொடர் ஒரே நேரத்தில் நடந்த செயலைக் குறிக்கிறது; ἀπολογέομαι என்பதன் நீதிமன்ற/வாதப் பின்னணியையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: உரத்த குரலில்
  rationale: முறையைக் குறிக்கும் கிரேக்க வேற்றுமைத் தொடரைத் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்த்து, பெஸ்துவின் திடீர் குறுக்கீட்டின் தீவிரத்தைக் காக்கிறது.
- source_word: φησιν
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இறந்தகால வடிவம் இயல்பாக உள்ளது.
- source_word: Μαίνῃ
  choice: உமக்குப் பைத்தியம் பிடித்துவிட்டது
  rationale: μαίνομαι குறிக்கும் மனப்பிறழ்வு குற்றச்சாட்டைத் தெளிவான நவீன தமிழில் வலுவாக வெளிப்படுத்துகிறது.
- source_word: τὰ πολλά ... γράμματα
  choice: உமது மிகுந்த கல்வி
  rationale: γράμματα என்பதற்கு எழுத்துகள், நூல்கள், கல்வி என்ற பொருள்கள் உண்டு; இச்சூழலில் பெஸ்து பவுலின் விரிவான கல்வி/படிப்பையே குறிப்பிடுவது இயல்பான பொருள்.
- source_word: εἰς μανίαν
  choice: பைத்தியத்திற்குத்
  rationale: εἰς இங்கு ஒரு நிலைக்குள் செல்லும் விளைவு அல்லது திசையைக் குறிக்கிறது; தமிழ் இலக்கு வேற்றுமை அந்த நுணுக்கத்தைக் காக்கிறது.
- source_word: περιτρέπει
  choice: தள்ளுகிறது
  rationale: ஒருவரை ஒரு நிலைக்குக் கொண்டு செல்லுதல் அல்லது திருப்புதல் என்ற காரணவினைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
