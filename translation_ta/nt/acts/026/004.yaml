  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் உரையின் தற்காப்புரைத் தொனிக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. மூலத்தின் இரு காலக் குறிப்புகளையும் இடக் குறிப்புகளையும் பாதுகாத்தபடி, தமிழில் இயல்பாக வாசிக்க அரைப்புள்ளியுடன் ஒரே வாக்கியமாக வழங்கப்பட்டது.
