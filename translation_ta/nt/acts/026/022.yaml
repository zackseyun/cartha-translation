  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: ta
  text: ஆகவே, கடவுளிடமிருந்து கிடைத்த உதவியைப் பெற்று, இந்நாள்வரை நான் நிலைத்து நின்று, சிறியோருக்கும் பெரியோருக்கும்[a] சாட்சி கூறுகிறேன். தீர்க்கதரிசிகளும் மோசேயும் நிகழவிருந்ததாகச் சொன்னவற்றைத் தவிர வேறெதையும் நான் சொல்வதில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறியோர் பெரியோர்’ என்பது எல்லா சமூக நிலைகளிலும் உள்ளவர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘தீர்க்கதரிசிகளும் மோசேயும் நிகழவிருந்ததாகச் சொன்னவற்றுக்கு அப்பால் எதையும் நான் சொல்வதில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τῆς ἀπὸ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து கிடைத்த உதவி
  rationale: ἐπικουρία என்பது உதவி அல்லது துணையைக் குறிக்கிறது; attributive phrase அதன் மூலமாகக் கடவுளைத் தெளிவாகச் சுட்டுகிறது.
- source_word: τυχὼν
  choice: பெற்றதால்
  rationale: இங்கு τυγχάνω என்பதன் aorist participle ‘பெறுதல்’ என்ற பொருளில் வந்து, அடுத்துள்ள நிலை மற்றும் சாட்சிக்கான காரணத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: இந்நாள்வரை நான் நிலைத்து நின்று
  rationale: Perfect ἕστηκα குறிப்பிடும், கடந்த செயலில் தொடங்கி தற்போது தொடரும் நிலையை ‘நிலைத்து நின்று’ என்பதும் கால வரம்பை ‘இந்நாள்வரை’ என்பதும் வெளிப்படுத்துகின்றன.
- source_word: μαρτυρόμενος
  choice: சாட்சி கூறிவருகிறேன்
  rationale: தொடர்ச்சியான சாட்சியளிக்கும் செயலும், நீதிமன்றச் சூழலுக்குரிய சாட்சி நயமும் பாதுகாக்கப்படுகின்றன.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: சிறியோர் பெரியோர் அனைவருக்கும்
  rationale: மூலத்தின் சமச்சீர் சொல்லமைப்பைப் பேணியபடி, அது எல்லா சமூக நிலைகளிலுமுள்ள மக்களைக் குறிக்கிறது என்பதை ‘அனைவருக்கும்’ தெளிவாக்குகிறது.
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: தவிர வேறெதையும் நான் சொல்வதில்லை
  rationale: ἐκτός இங்கு ‘தவிர/அப்பால்’ என்ற எல்லைப்படுத்தும் பொருளைக் கொண்டுள்ளது; தமிழ் வாக்கியத்தில் வலுவான மறுப்பை இயல்பாக வழங்குகிறது.
- source_word: οἱ προφῆται ... καὶ Μωϋσῆς
  choice: தீர்க்கதரிசிகளும் மோசேயும்
  rationale: τε ... καί இணைப்பின் இரு உறுப்புகளையும் கிரேக்க வரிசையிலேயே வைத்திருக்கிறது.
- source_word: μελλόντων γίνεσθαι
  choice: நிகழவிருந்ததாக
  rationale: தீர்க்கதரிசிகளின் பேச்சுடன் ஒப்பிடுகையில் எதிர்காலத்தில் நிகழவிருந்ததைச் சுட்டுகிறது; உடனடித் தன்மையையோ தெய்வீக நிர்ணயத்தையோ தேவையின்றி சேர்ப்பதில்லை.
theological_decisions:
- issue: இஸ்ரவேலின் வேதவாக்குகளுடன் பவுலின் சாட்சிக்குள்ள தொடர்ச்சி
  choice: தீர்க்கதரிசிகளும் மோசேயும் முன்னுரைத்தவற்றைத் தவிர வேறெதையும் பவுல் கூறவில்லை என்ற வலுவான தொடர்ச்சி கூற்று
  alternative: பவுலின் செய்தி வேதவாக்குகளுடன் பொதுவாக ஒத்துப்போகிறது என்ற மென்மையான கூற்று
  rationale: οὐδὲν ἐκτὸς λέγων என்ற சொற்றொடர் வெறும் பொதுவான ஒற்றுமையைவிட வலுவான வரம்பை நிறுவுகிறது; மொழிபெயர்ப்பு அந்தத் தீவிரத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிலைத்து நின்று’ என்பது ἕστηκα-வின் தொடரும் தற்போதைய நிலையைப் பேணுகிறது; ‘சாட்சி கூறிவருகிறேன்’ தொடர்ச்சியான செயலை இயல்பாக வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
