source:
  edition: SBLGNT
  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: ta
  text: யூதர்கள் என்மீது சுமத்தும் எல்லாக் குற்றச்சாட்டுகளைக் குறித்தும், அகிரிப்பா அரசே, இன்று உமக்கு முன்பாக என் தரப்பு விளக்கத்தை அளிக்கவிருப்பதால், நான் என்னை நற்பேறு பெற்றவனாகக் கருதுகிறேன்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: எல்லாக் குற்றச்சாட்டுகளைக் குறித்தும்
  rationale: περί உடன் வரும் மரபுத்தொடர் ‘குறித்து’ என்ற பொருளைத் தருகிறது. அடுத்துள்ள ἐγκαλοῦμαι என்பதோடு இணைத்து, தமிழில் இயல்பாகவும் தெளிவாகவும் ‘எல்லாக் குற்றச்சாட்டுகளைக் குறித்தும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐγκαλοῦμαι
  choice: என்மீது சுமத்துகிற ... குற்றச்சாட்டுகள்
  rationale: இச்சொல் சட்டச் சூழலில் ஒருவர்மீது குற்றம் சாட்டப்படுவதைக் குறிக்கிறது. கிரேக்கத்தின் செயப்பாட்டு வடிவம் தமிழில் இயல்பாக அமைய, குற்றஞ்சாட்டுவோரை எழுவாயாகக் கொண்ட அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: ὑπὸ Ἰουδαίων
  choice: யூதர்கள்
  rationale: ὑπό குற்றஞ்சாட்டும் செயலைச் செய்வோரைக் குறிக்கிறது. சூழலில் இது பவுல்மீது குற்றஞ்சாட்டிய யூதர்களைக் குறிக்கிறதே தவிர எல்லா யூதர்களையும் பொதுப்படையாகக் குறிக்கவில்லை.
- source_word: βασιλεῦ Ἀγρίππα
  choice: அகிரிப்பா அரசே
  rationale: விளிவேற்றுமையிலுள்ள நேரடி அழைப்பையும் அரச பட்டத்தையும் நவீன, கண்ணியமான தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἥγημαι ἐμαυτὸν
  choice: நான் ... என்று கருதுகிறேன்
  rationale: ἡγέομαι இங்கு ‘ஒருவரை ஒரு நிலையில் இருப்பதாகக் கருதுதல்’ என்று பொருள்படுகிறது. தன்மறுமொழியான ἐμαυτόν தமிழில் ‘நான் ... என்று’ என்ற இயல்பான அமைப்பால் வெளிப்படுகிறது.
- source_word: μακάριον
  choice: நற்பேறு பெற்றவன்
  rationale: இந்த நீதிமன்றச் சூழலில், அகிரிப்பாவுக்கு முன் தன் தரப்பை எடுத்துரைக்கும் வாய்ப்பு கிடைத்த சாதகமான நிலையைக் குறிக்கிறது. ‘மகிழ்ச்சியானவன்’ என்பதைக் காட்டிலும் ‘நற்பேறு பெற்றவன்’ சூழலுக்குப் பொருத்தமானது; அதேவேளையில் ‘பேறுபெற்றவன்’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ἐπὶ σοῦ
  choice: உமக்கு முன்பாக
  rationale: விசாரணை அல்லது அதிகாரமுள்ள ஒருவரின் முன்னிலையில் பேசுவதைக் குறிக்கும் சட்டச் சூழலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: μέλλων
  choice: எடுத்துரைக்கவிருப்பதால்
  rationale: μέλλω உடனடியாக நிகழவிருக்கும் செயலைக் குறிக்கிறது. வாக்கியத்தின் காரணத் தொடர்பை இயல்பான தமிழில் காட்ட ‘-விருப்பதால்’ பயன்படுத்தப்பட்டது.
- source_word: σήμερον
  choice: இன்று
  rationale: σήμερον என்பதன் நேரடியான, இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: ἀπολογεῖσθαι
  choice: என் தரப்பு நியாயத்தை எடுத்துரைக்க
  rationale: இது பொதுவான தற்காப்பை மட்டுமல்லாமல் சட்டரீதியாகத் தன் தரப்பை விளக்கிப் பதிலளிப்பதைக் குறிக்கிறது. ‘என் தரப்பு நியாயத்தை எடுத்துரைக்க’ என்பது அந்த நீதிமன்றத் தன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: μακάριον என்பதிலுள்ள உலகியல் நற்பேறு மற்றும் தெய்வீகப் பேறு ஆகிய பொருள் சாத்தியங்கள்
  choice: முதன்மை உரையில் ‘நற்பேறு பெற்றவன்’
  alternative: ‘பேறுபெற்றவன்’
  rationale: அகிரிப்பாவுக்கு முன் தன் தரப்பை எடுத்துரைக்கும் வாய்ப்பைப் பற்றிய சட்டச் சூழல் ‘fortunate/privileged’ என்ற பொருளை முன்னிறுத்துகிறது. இருப்பினும் சொல்லின் பரந்த ‘blessed’ பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. அகிரிப்பாவை நோக்கிய மரியாதைமிக்க ஒருமை ‘உமக்கு’ எனப் பாதுகாக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
