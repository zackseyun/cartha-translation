  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: ta
  text: இவற்றின் காரணமாக[a], யூதர்கள் என்னை ஆலயத்தில்[b] பிடித்து, கொல்ல முயன்று கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தக் காரணத்தினால்’ அல்லது ‘இவற்றை முன்னிட்டு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே ‘ஆலயம்’ என்பதற்கான கிரேக்கச் சொல், உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: இவற்றின் காரணமாக
  rationale: ἕνεκα என்பதும் அதைத் தொடரும் உருபும் காரணத்தைச் சுட்டுகின்றன. முந்தைய வசனங்களில் பவுல் கூறிய செய்தியையும் செயல்களையும் பின்னோக்கிச் சுட்டும் பொருளை இந்தத் தெரிவு இயல்பாகப் பாதுகாக்கிறது.
- source_word: με
  choice: என்னை
  rationale: συλλαβόμενοι என்பதன் நேரடிச் செயப்படுபொருளான முதல் நபர் ஒருமை வடிவத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: நிகழ்வில் பவுலைப் பிடித்த யூத எதிர்ப்பாளர்களையே சூழல் குறிக்கிறது; எல்லா யூத மக்களையும் பொதுப்படையாகக் குற்றஞ்சாட்டுவதாக இதைப் புரிந்துகொள்ளக் கூடாது. மூலத்தில் இல்லாத ‘சிலர்’ என்பதை முதன்மை உரையில் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: συλλαβόμενοι
  choice: பிடித்து
  rationale: ஒருவரைப் பலவந்தமாகப் பற்றிப் பிடித்தல் அல்லது கைப்பற்றுதல் என்ற பொருளைத் தருகிறது. அதிகாரபூர்வக் கைது என்ற கூடுதல் கருத்தைச் சேர்க்காமல் பகைமையான சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கிறது. ‘ஆலயத்தில்’ என்பது தமிழில் இயல்பான முதன்மை உரை; துல்லியமான பண்பாட்டுத் தகவல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπειρῶντο
  choice: முயன்றார்கள்
  rationale: கடந்தகாலத்தில் நடைபெற்ற முயற்சியை imperfect வடிவம் காட்டுகிறது. தமிழில் ‘முயன்றார்கள்’ என்பது அந்த முயற்சியை இயல்பாகத் தெரிவிக்கிறது; அதை வெற்றியடைந்த செயலாகக் காட்டுவதில்லை.
- source_word: διαχειρίσασθαι
  choice: கொல்ல
  rationale: இச்சூழலில் வன்முறையாக உயிரைப் போக்குதல் என்ற பொருள். ‘கொல்ல’ என்பது தெளிவான நவீனத் தமிழ்; ‘கொலை செய்ய’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத சட்ட அல்லது ஒழுக்கத் தீர்ப்பை வலுப்படுத்தக்கூடும்.
theological_decisions:
- issue: சர்ச்சைக்குரிய சூழலில் ‘யூதர்கள்’ என்பதன் குறிப்பு
  choice: ‘யூதர்கள்’ என்று நேரடியாக மொழிபெயர்த்து, நிகழ்வில் பவுலைப் பிடித்த குறிப்பிட்ட எதிர்ப்பாளர்களைச் சூழலின்படி குறிப்பதாகப் புரிந்துகொள்ளுதல்
  alternative: ‘யூதர்களில் சிலர்’ அல்லது ‘யூத மக்கள்’
  rationale: மூலம் நிகழ்வில் ஈடுபட்ட குழுவை அடையாளப்படுத்துகிறது; ‘சிலர்’ என்று சேர்ப்பது வெளிப்படையாக இல்லாத சொல்லை உரையில் புகுத்தும், ‘யூத மக்கள்’ என்பது தேவையற்ற பொதுமைப்படுத்தலை ஏற்படுத்தலாம். வரலாற்றுக் குறிப்பை மறைக்காமலும் ஒரு இனமெங்கும் குற்றஞ்சாட்டாமலும் சூழல் சார்ந்த பொருள் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. காரணத்தைச் சுட்டும் தொடர், வன்முறையான பிடித்தல், நிறைவேறாத கொலை முயற்சி ஆகியவை சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கப்பட்டுள்ளன.
