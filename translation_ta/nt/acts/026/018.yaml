source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: ta
  text: அவர்களுடைய கண்களைத் திறக்கவும், அவர்கள் இருளிலிருந்து ஒளிக்குத் திரும்பவும், சாத்தானின் அதிகாரத்திலிருந்து[a] கடவுளிடம் திரும்பவும், அவர்கள் பாவங்களின் மன்னிப்பையும், என்மீது கொண்டுள்ள நம்பிக்கையால் தூய்மையாக்கப்பட்டவர்களிடையே ஒரு பங்கையும்[b] பெறவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சாத்தானின் வல்லமை’ அல்லது ‘சாத்தானின் ஆளுகை.’ கிரேக்கச் சொல் அதிகாரம், ஆளும் வல்லமை, அல்லது ஆளுகைக்குட்பட்ட தளம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தூயவர்களாக்கப்பட்டவர்களிடையே.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: அவர்களுடைய கண்களைத் திறந்து
  rationale: கண்கள் திறக்கப்படுதல் என்ற மூல உருவகத்தை விளக்கவுரையாக மாற்றாமல் இயல்பான தமிழில் காக்கிறது.
- source_word: τοῦ ἐπιστρέψαι
  choice: திரும்பும்படி செய்வதற்கும்
  rationale: நோக்கத்தைக் குறிக்கும் infinitive-ஐ வெளிப்படுத்துகிறது; ‘மதம் மாறுதல்’ போன்ற கூடுதல் கருத்தைச் சேர்க்காமல் ‘திரும்புதல்’ என்ற இயக்க உருவகத்தைக் காக்கிறது.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: இருளிலிருந்து ஒளியிடம்
  rationale: மூலத்தின் தெளிவான எதிர்நிலை உருவகத்தை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: சாத்தானின் அதிகாரம்
  rationale: ἐξουσία என்பதன் அதிகாரம் அல்லது ஆளுகை என்ற பொருளை ‘அதிகாரம்’ துல்லியமாகக் காட்டுகிறது.
- source_word: ἐπὶ τὸν θεόν
  choice: கடவுளிடம்
  rationale: ஒரு நிலையிலிருந்து கடவுளை நோக்கித் திரும்பும் இயக்கத்தையும் சார்புமாற்றத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: பாவமன்னிப்பு
  rationale: ἄφεσις என்பதன் விடுவிப்பு/மன்னிப்பு கருத்தை இச்சூழலில் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: κλῆρον
  choice: ஓர் உரிமைப் பங்கு
  rationale: ஒதுக்கப்பட்ட பங்கு மற்றும் வாரிசுரிமை ஆகிய இரு நுணுக்கங்களையும் சுருக்கமாகக் காக்கிறது.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: தூயவர்களாக்கப்பட்டவர்களிடையே
  rationale: நிறைவேற்றப்பட்ட செயலும் தொடரும் நிலையும் கொண்ட perfect passive participle-ன் வினைச் செயற்பொருளைக் காக்கிறது.
- source_word: πίστει τῇ εἰς ἐμέ
  choice: என்மீது வைக்கும் நம்பிக்கையால்
  rationale: πίστις-ஐ இங்கு இயல்பான தனிப்பட்ட நம்பிக்கையாகவும், εἰς ἐμέ-ஐ அதன் நோக்காகவும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πίστει τῇ εἰς ἐμέ என்பதன் பொருள்
  choice: என்மீது வைக்கும் நம்பிக்கையால்
  alternative: என்னில் வைக்கும் விசுவாசத்தால்
  rationale: இது சர்ச்சைக்குரிய pistis-Christou genitive அமைப்பு அல்ல; இயேசுவை நோக்கிய நம்பிக்கையே நேரடியான பொருள். ‘நம்பிக்கை’ நவீன பொதுத் தமிழில் இயல்பானது; ‘விசுவாசம்’ என்பதும் சாத்தியமான சமய வழக்குச் சொல்.
- issue: κλῆρον என்பதன் மீட்பியல் நுணுக்கம்
  choice: ஓர் உரிமைப் பங்கு
  alternative: ஒரு வாரிசுரிமை
  rationale: கடவுளுடைய மக்களிடையே வழங்கப்படும் பங்கு என்ற பொருளைத் தெளிவாகக் காக்கிறது; எதிர்கால வாரிசுரிமை மட்டுமே என்று மிகையாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. வசனம் முந்தைய வாக்கியத்தைத் தொடரும் நோக்கக் கூறாக இருப்பதால், அதன் தொடர்ச்சியான infinitive அமைப்பு தமிழிலும் ‘செய்வதற்கும்… பெற்றுக்கொள்வதற்கும்’ எனக் காக்கப்பட்டுள்ளது. சமயக் குழுவுக்கே உரிய சொற்களைத் தவிர்த்து ‘கடவுள்,’ ‘நம்பிக்கை,’ ‘தூயவர்களாக்கப்பட்டவர்கள்’ ஆகிய பொதுவாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
