id: ACT.26.8
reference: Acts 26:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: ta
  text: கடவுள் இறந்தவர்களை உயிர்த்தெழுப்புகிறார் என்றால், அதை நீங்கள் ஏன் நம்ப முடியாததாகக் கருதுகிறீர்கள்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: ஏன்
  rationale: இங்கு காரணத்தை வினவும் இயல்பான தமிழ்ச் சொல்லாக்கம்.
- source_word: ἄπιστον
  choice: நம்ப முடியாதது
  rationale: நம்பத்தகாதது அல்லது நம்ப இயலாதது என்ற பொருளை எளிய நவீன தமிழில் தருகிறது.
- source_word: κρίνεται παρ’ ὑμῖν
  choice: நீங்கள் ... என்று தீர்ப்பிடுகிறீர்கள்
  rationale: சொல்லுக்கு சொல் அமைந்த செயப்பாட்டு வடிவம் தமிழில் செயற்கையாக இருப்பதால், παρ’ ὑμῖν என்பதிலுள்ள ‘உங்களால்’ என்ற செய்பவர் தொடர்பைத் தெளிவாகக் காக்கும் இயல்பான செய்வினை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: பொதுவாகப் புரியும், மரியாதைமிக்க நவீனத் தமிழ்ச் சொல்.
- source_word: νεκροὺς ἐγείρει
  choice: இறந்தவர்களை உயிரோடு எழுப்புகிறார்
  rationale: ἐγείρει என்பதன் ‘எழுப்புதல்’ உருவகத்தைப் பேணுவதோடு, மரித்தோரின் உயிர்த்தெழுதலே குறிப்பு என்பதைத் தெளிவாக்குகிறது; நிகழ்கால வினை வடிவமும் காக்கப்படுகிறது.
theological_decisions:
- issue: εἰ என்பதன் வினா-சூழல் பொருள்
  choice: ‘என்பதை’ என்று உள்ளடக்கக் கூற்றாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘கடவுள் இறந்தவர்களை உயிரோடு எழுப்பினால்’
  rationale: இது கடவுள் அப்படிச் செய்ய முடியுமா அல்லது இறந்தோரை எழுப்புகிறார் என்ற கூற்று ஏன் நம்ப முடியாததாகத் தீர்க்கப்படுகிறது என்பதைக் கேட்கும் சொற்பொழிவு வினா. தமிழில் ‘என்றால்’ என்பது தேவையற்ற நிபந்தனைத் தொனியை வலுப்படுத்தலாம்.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் சொற்பொழிவு வினாவின் வலிமையும் காக்கப்பட்டுள்ளன. மூலத்தின் சுருக்கத்தைப் பேணியபடியே, தமிழில் தெளிவுக்காக உயிர்த்தெழுதலைக் குறிக்கும் ‘உயிரோடு எழுப்புகிறார்’ பயன்படுத்தப்பட்டது.
