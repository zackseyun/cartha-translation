source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: ta
  text: அவர்கள் தொடக்கத்திலிருந்தே[a] என்னை அறிந்திருக்கிறார்கள்; சாட்சியமளிக்க அவர்கள் விரும்பினால், நமது சமயத்தின் மிகக் கண்டிப்பான பிரிவின்[b] வழிமுறையின்படி ஒரு பரிசேயனாக நான் வாழ்ந்தேன் என்பதை அவர்கள் உறுதிப்படுத்தலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முதற்கொண்டே’; ‘நீண்ட காலமாக’ என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொல் αἵρεσις இங்கு ‘பிரிவு’ அல்லது ‘கட்சி’ என்று பொருள்படும்; பிற்காலத் தொழில்நுட்பப் பொருளான ‘மதவழு’ என்று பொருள்படாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές
  choice: அறிந்திருக்கிறார்கள்
  rationale: முன்பிருந்தே தொடங்கி நிகழ்காலம் வரை தொடரும் அறிமுகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இங்கு ‘முன்னறிந்தார்கள்’ என்பது பொருத்தமற்றது.
- source_word: ἄνωθεν
  choice: தொடக்கத்திலிருந்தே
  rationale: இச்சூழலில் ‘மேலிருந்து’ என்று அல்லாமல், பவுலின் வாழ்க்கையின் தொடக்கக் காலத்திலிருந்து இருந்த அறிவைக் குறிக்கிறது.
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: சாட்சி சொல்ல விரும்பினால்
  rationale: θέλωσι என்பதிலுள்ள மனவிருப்பத்தையும், நீதிமன்றச் சூழலுக்குரிய μαρτυρεῖν என்பதையும் தெளிவாகக் காக்கிறது.
- source_word: ἀκριβεστάτην
  choice: மிகக் கண்டிப்பான
  rationale: சமயப் பிரிவின் கடுமையான ஒழுக்கநெறியைக் குறிக்கும் உயர்நிலைப் பொருளை இயல்பாக வழங்குகிறது.
- source_word: αἵρεσιν
  choice: பிரிவு
  rationale: அக்கால யூத மதத்துக்குள் இருந்த அங்கீகரிக்கப்பட்ட குழுவைக் குறிக்கிறது; பிற்காலத் தொழில்நுட்பப் பொருளான ‘மதவழு’ என்பதைத் தவிர்க்கிறது.
- source_word: θρησκείας
  choice: சமயத்தின்
  rationale: இங்கு பகிரப்பட்ட யூத சமய மரபை முழுமையாகக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: ἔζησα Φαρισαῖος
  choice: ஒரு பரிசேயனாக நான் வாழ்ந்தேன்
  rationale: பவுலின் முந்தைய அடையாளத்தையும் வாழ்க்கை முறையையும் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: யூத வரலாற்றுச் சூழலில் αἵρεσις என்பதன் பொருள்
  choice: பிரிவு
  alternative: மதவழு; கட்சி
  rationale: இங்கு பரிசேயர்கள் யூத மதத்துக்குள் இருந்த ஓர் அறியப்பட்ட பிரிவாகக் குறிப்பிடப்படுகிறார்கள். ‘மதவழு’ என்பது பிற்காலக் கோட்பாட்டுப் பொருளைத் தேவையின்றி உரைக்குள் கொண்டுவரும்.
translation_notes:
  register: நவீன பொதுத் தமிழில், நீதிமன்றச் சாட்சியச் சூழலின் மரியாதையையும் வரலாற்று நுணுக்கத்தையும் காக்கும் நடை. நீளமான கிரேக்க வாக்கியத்தின் தொடர்பை அரைப்புள்ளி மூலம் தெளிவாக்கப்பட்டுள்ளது.
