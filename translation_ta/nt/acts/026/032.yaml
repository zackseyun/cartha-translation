translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குத் தெளிவானதுமான சட்டச் சூழல் மொழிநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள நிகழாமல் போன கடந்தகாலச் சாத்தியம் நிபந்தனை அமைப்பின் மூலம் பாதுகாக்கப்பட்டுள்ளது.
