id: ACT.26.32
reference: Acts 26:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: ta
  text: அப்போது அகிரிப்பா பெஸ்துவிடம், “இந்த மனிதன் சீசரிடம் மேல்முறையீடு செய்திருக்காவிட்டால், இந்த மனிதனை விடுதலை செய்திருக்க முடியும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு δέ கதை நகர்வையும் அகிரிப்பாவின் முடிவுரைக்கான மாற்றத்தையும் குறிக்கிறது; நவீன தமிழில் ‘அப்போது’ இயல்பாக அந்த இணைப்பை வெளிப்படுத்துகிறது.
- source_word: ἔφη
  choice: என்றார்
  rationale: φημί என்ற வினையின் இறந்தகால வடிவம் இங்கு சாதாரண உரையறிமுகமாக வருகிறது; ‘என்றார்’ இயல்பான மரியாதைமிக்க தமிழ் நடை.
- source_word: Ἀπολελύσθαι
  choice: விடுதலை செய்யப்பட்டிருக்க
  rationale: ἀπολύω என்பதன் நிறைவுற்ற வினையெச்சம் காவல் அல்லது சட்டக் கட்டுப்பாட்டிலிருந்து விடுவிக்கப்படுவதைக் குறிக்கிறது. ‘குற்றமற்றவர் எனத் தீர்க்கப்பட’ என்பது தேவையற்ற அளவு குறுகிய நீதிமன்றப் பொருளைச் சேர்க்கும்.
- source_word: ἐδύνατο
  choice: முடியும்
  rationale: δύναμαι இங்கு நிகழாமல் போன கடந்தகாலச் சாத்தியத்தை எதிர்மறை நிபந்தனையுடன் வெளிப்படுத்துகிறது; முழு தமிழ் வாக்கிய அமைப்பில் ‘விடுதலை செய்யப்பட்டிருக்க முடியும்’ அந்தப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: இந்த மனிதன்
  rationale: குறிப்பிட்ட ஆணான பவுலைச் சுட்டும் ἄνθρωπος மற்றும் οὗτος ஆகியவற்றின் நேரடியான சுட்டுப்பொருளை இது காக்கிறது.
- source_word: εἰ μὴ
  choice: செய்யாமல் இருந்திருந்தால்
  rationale: நிகழாத கடந்தகால நிபந்தனையைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காட்டும் அமைப்பு.
- source_word: ἐπεκέκλητο
  choice: மேல்முறையீடு செய்யாமல் இருந்திருந்தால்
  rationale: ரோமச் சட்டச் சூழலில் ἐπικαλέω என்பது பேரரசரிடம் தீர்ப்புக்காக மேல்முறையீடு செய்வதைக் குறிக்கிறது; ‘அழைத்திருந்தால்’ போன்ற சொற்கள் சட்டப் பொருளை மறைக்கும்.
- source_word: Καίσαρα
  choice: சீசரிடம்
  rationale: Καῖσαρ என்ற வரலாற்று மற்றும் சட்டப்பூர்வ பட்டப்பெயரை ‘சீசர்’ எனப் பாதுகாக்கிறது; ‘பேரரசரிடம்’ என்பது விளக்கமான மாற்றாக இருந்தாலும் மூலச் சொல்லின் வடிவத்தை இழக்கும்.
