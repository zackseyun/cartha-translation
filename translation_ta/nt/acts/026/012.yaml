  text: Ἐν ⸀οἷς πορευόμενος εἰς τὴν Δαμασκὸν μετ’ ἐξουσίας καὶ ἐπιτροπῆς ⸀τῆς τῶν ἀρχιερέων
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: ta
  text: இந்தச் சூழ்நிலையில்[a], தலைமை ஆசாரியர்களிடமிருந்து அதிகாரமும் ஆணையும் பெற்றுக்கொண்டு தமஸ்குவுக்குப் பயணம் செய்துகொண்டிருந்தபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “இவற்றில்.” இது பவுல் முன்பு கூறிய செயல்களையும் நோக்கங்களையும் பின்னோக்கிச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: அவ்வாறு
  rationale: முந்தைய வசனங்களில் பவுல் கூறிய செயல்களையும் நோக்கங்களையும் இது பின்னோக்கிச் சுட்டுகிறது. சொற்சொல்லாக மொழிபெயர்ப்பதைவிட ‘அவ்வாறு’ என்பது தமிழில் இயல்பாக அந்தத் தொடர்பைப் பேணுகிறது; அதன் சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πορευόμενος
  choice: பயணம் செய்துகொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருந்த பயணத்தைச் சுட்டும் நிகழ்காலப் பங்கேற்பு வடிவத்தையும், அடுத்த வசனத்தில் தொடரும் காலச் சார்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν Δαμασκὸν
  choice: தமஸ்குவுக்கு
  rationale: εἰς இங்கு நகரத்தை நோக்கிய பயண இலக்கைக் குறிக்கிறது; ‘தமஸ்குவுக்கு’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: μετ’ ἐξουσίας
  choice: அதிகாரம் ... பெற்றுக்கொண்டு
  rationale: ἐξουσία இங்கு வெறும் வல்லமையைக் காட்டாமல், ஒப்படைக்கப்பட்ட அதிகாரத்தைக் குறிக்கிறது. ‘பெற்றுக்கொண்டு’ என்பது அந்த அதிகாரத்தின் மூலத்தைத் தெளிவாக இணைக்கிறது.
- source_word: ἐπιτροπῆς
  choice: பணிக்கட்டளை
  rationale: ஒப்படைக்கப்பட்ட அதிகாரப்பூர்வப் பணி அல்லது ஆணையைச் சுட்டுகிறது. ‘பணிக்கட்டளை’ என்பது இராணுவத் தன்மையை மிகைப்படுத்தாமல், குறிப்பிட்ட பணிக்கான அதிகாரப்பூர்வ ஆணையைத் தெரிவிக்கிறது.
- source_word: τῆς τῶν ἀρχιερέων
  choice: முதன்மைக் குருக்களிடமிருந்து
  rationale: கிரேக்க உரையின் உடைமை வேற்றுமை இங்கு அதிகாரமும் பணிக்கட்டளையும் வழங்கிய மூலத்தைக் குறிக்கிறது; தமிழில் ‘இடமிருந்து’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀρχιερέων
  choice: முதன்மைக் குருக்கள்
  rationale: இது ஒரே நேரத்தில் பல தலைமைக் குருக்கள் பதவியில் இருந்தனர் என்று பொருள்படாமல், தலைமைக் குருத்துவத் தலைமைக்குழுவினரைக் குறிக்கும் வழக்குச் சொல்.
