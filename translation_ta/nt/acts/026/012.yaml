- from: அவ்வாறு[a], முதன்மைக் குருக்களிடமிருந்து அதிகாரமும் பணிக்கட்டளையும் பெற்றுக்கொண்டு தமஸ்குவுக்குப் பயணம் செய்துகொண்டிருந்தபோது,
  to: இந்தச் சூழ்நிலையில்[a], தலைமை ஆசாரியர்களிடமிருந்து அதிகாரமும் ஆணையும் பெற்றுக்கொண்டு தமஸ்குவுக்குப் பயணம் செய்துகொண்டிருந்தபோது,
