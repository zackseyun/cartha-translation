translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்றச் சூழலைத் தெளிவாக உணர்த்தும் கண்ணியமான இயல்பான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீடித்த உரையாடல் ‘பேசிக்கொண்டு’ என்பதாலும், தண்டனைக்குரிய செயல் எதுவுமில்லை என்ற தீர்ப்பு நேரடியான மேற்கோளாலும் காக்கப்பட்டுள்ளது.
