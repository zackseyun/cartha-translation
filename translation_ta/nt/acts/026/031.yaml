source:
  edition: SBLGNT
  text: καὶ ἀναχωρήσαντες ἐλάλουν πρὸς ἀλλήλους λέγοντες ὅτι Οὐδὲν θανάτου ⸂ἢ δεσμῶν ἄξιον⸃ ⸀τι πράσσει ὁ ἄνθρωπος οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: ta
  text: அவர்கள் அங்கிருந்து விலகிச் சென்றபின், ஒருவரோடு ஒருவர் பேசிக்கொண்டு, “இந்த மனிதன் மரண தண்டனைக்கோ சிறைவாசத்துக்கோ[a] உரிய எதையும் செய்வதில்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரணத்துக்கோ சங்கிலிகளுக்கோ.” கிரேக்கச் சொல்லான δεσμῶν என்பதன் நேரடிப் பொருள் “கட்டுகள்” அல்லது “சங்கிலிகள்”; இங்கு அது சிறைக்காவல் அல்லது சிறைவாசத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: அங்கிருந்து விலகிச் சென்றபின்
  rationale: பொதுக் கூடுகையிலிருந்து அவர்கள் அகன்றதை இறந்தகால வினையெச்சம் காட்டுகிறது; தமிழில் நிகழ்வுகளின் வரிசையையும் இடத்திலிருந்து விலகிய பொருளையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐλάλουν πρὸς ἀλλήλους λέγοντες
  choice: ஒருவரோடு ஒருவர் பேசிக்கொண்டு … என்றார்கள்
  rationale: பரஸ்பரமாகத் தொடர்ந்து உரையாடியதை ἐλάλουν என்ற நிறைவுறா இறந்தகால வடிவம் காட்டுகிறது; ‘பேசிக்கொண்டு’ என்பது அந்த நீடித்த தன்மையை இயல்பான தமிழில் காக்கிறது, ‘என்றார்கள்’ உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: Οὐδὲν … ἄξιον
  choice: உரிய எதையும் … இல்லை
  rationale: எந்தச் செயலும் குறிப்பிடப்பட்ட தண்டனைகளுக்குத் தகுதியானதல்ல என்ற கிரேக்கக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: θανάτου ἢ δεσμῶν
  choice: மரண தண்டனைக்கோ சிறைவாசத்துக்கோ
  rationale: சட்ட விசாரணைச் சூழலில் θάνατος மரண தண்டனையையும் δεσμοί சங்கிலிகளால் கட்டப்பட்ட காவல் அல்லது சிறைவாசத்தையும் குறிக்கின்றன. நவீன வாசகருக்குச் சட்டப் பொருளைத் தெளிவாக்கும் மொழிபெயர்ப்பு; நேரடியான ‘சங்கிலிகள்’ அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: τι πράσσει
  choice: எதையும் செய்வதில்லை
  rationale: நிகழ்கால πράσσει-ஐப் பொதுவான செயலாகத் தருகிறது; ‘குற்றம் புரிவதில்லை’ என்று மூலத்தில் இல்லாத குற்றவியல் பொருளைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: இந்த மனிதன்
  rationale: பவுலைக் குறிக்கும் ஆண்பால் ஒருமையை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
