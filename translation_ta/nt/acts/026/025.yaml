translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பெஸ்துவுக்கான அதிகாரபூர்வ மரியாதை அழைப்பு காக்கப்பட்டுள்ளது; σωφροσύνη என்பதிலுள்ள நிதானம், தெளிந்த மனநிலை, சுயக்கட்டுப்பாடு ஆகிய பொருள் நிழல்கள் அடிக்குறிப்பில் திறந்தவையாக வைக்கப்பட்டுள்ளன.
