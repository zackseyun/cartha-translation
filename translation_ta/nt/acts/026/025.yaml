source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: ta
  text: ஆனால் பவுல், “நான் பைத்தியக்காரன் அல்ல, மாண்புமிகு பெஸ்துவே[b]. மாறாக, உண்மையையும் தெளிந்த சிந்தனையையும் வெளிப்படுத்தும் வார்த்தைகளைப் பேசுகிறேன்[c]” என்றார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு மனநிலை பிறழவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: “மாண்புமிகு” என்பது உயர்பதவி வகிக்கும் அதிகாரியை அழைப்பதற்குப் பயன்படுத்தப்பட்ட முறையான மரியாதை அடைமொழி.
    reason: cultural_note
  - marker: c
    text: அல்லது, “உண்மையும் நிதானமும் நிறைந்த வார்த்தைகள்”; வேறொரு வகையில், “உண்மையும் மனத்தெளிவும் கொண்ட வார்த்தைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் பெஸ்து சுமத்திய குற்றச்சாட்டுக்கு பவுல் மறுப்புத் தெரிவிப்பதால், எதிர்மறைத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: μαίνομαι
  choice: நான் பைத்தியக்காரன் அல்ல
  rationale: பைத்தியம் பிடித்திருத்தல் அல்லது மனநிலை பிறழ்ந்திருத்தல் என்ற பொருளை, சாதாரண நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: φησίν
  choice: என்றார்
  rationale: கிரேக்கத்தில் இது வரலாற்று நிகழ்காலமாக இருந்தாலும், தமிழ் கதைநடையில் இறந்தகால வினை இயல்பானது.
- source_word: κράτιστε
  choice: மாண்புமிகு
  rationale: உயர்பதவி வகிக்கும் அதிகாரியை மரியாதையுடன் அழைக்கும் முறையான அடைமொழி; நவீனத் தமிழிலும் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἀληθείας
  choice: உண்மை
  rationale: பவுலின் வார்த்தைகளின் உண்மையான தன்மையைப் பெயர்ச்சொல் வடிவில் காக்கிறது.
- source_word: σωφροσύνης
  choice: நிதானம்
  rationale: தெளிந்த மனநிலை, சுயக்கட்டுப்பாடு, விவேகமான சிந்தனை ஆகிய பொருள் நிழல்களைச் சுருக்கமாகத் தருகிறது; பைத்தியம் என்ற குற்றச்சாட்டுக்கும் பொருத்தமான எதிர்ச்சொல்லாக அமைகிறது.
- source_word: ῥήματα
  choice: வார்த்தைகள்
  rationale: கிரேக்கப் பன்மைப் பெயர்ச்சொல்லை நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: ἀποφθέγγομαι
  choice: பேசுகிறேன்
  rationale: தெளிவாகக் கூறுதல் அல்லது உரைத்தல் என்ற வலிமை இதில் இருக்கலாம்; இச்சூழலில் மிகைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
