revisions:
- from: ஆனால் பவுல், “மாண்புமிகு பெஸ்துவே[b], நான் பைத்தியக்காரன் அல்ல[a]. மாறாக, உண்மையும் நிதானமும் நிறைந்த வார்த்தைகளைப் பேசுகிறேன்[c]” என்றார்.
  to: ஆனால் பவுல், “நான் பைத்தியக்காரன் அல்ல, மாண்புமிகு பெஸ்துவே[b]. மாறாக, உண்மையையும் தெளிந்த சிந்தனையையும் வெளிப்படுத்தும் வார்த்தைகளைப் பேசுகிறேன்[c]” என்றார்[a].
  rationale: The revision preserves the Greek contrast, formal address, plural “words,” and Paul's present-tense assertion. It replaces the potentially under-specified “நிதானம்” in the main text with “தெளிந்த சிந்தனை,” which better represents σωφροσύνη as sound-minded, sober judgment in direct reply to Festus's accusation. The alternate “நிதானம்” is retained in the lexical footnote.
