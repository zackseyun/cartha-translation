translation_notes:
  register: நவீன தரத் தமிழில், நீதிமன்றச் சூழலுக்கு ஏற்ற மரியாதையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. அகிரிப்பாவை நோக்கிய மரியாதைப் பன்மை தொடரப்பட்டுள்ளது; மூலத்தின் காரணவியல் தொடர்பும் வேண்டுகோளின் தீவிரமும் இயல்பான ஒரே வாக்கியத்தில் பாதுகாக்கப்பட்டுள்ளன.
