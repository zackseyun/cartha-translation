source:
  edition: SBLGNT
  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: ta
  text: குறிப்பாக, யூதர்களிடையே உள்ள எல்லா வழக்கங்களையும் சர்ச்சைகளையும்[a] நீங்கள் நன்கு அறிந்திருப்பதால், பொறுமையுடன் எனக்குச் செவிகொடுக்கும்படி உங்களிடம் வேண்டிக்கொள்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்களுக்குரிய எல்லா வழக்கங்களையும் சர்ச்சைகளையும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வேண்டுகிறேன்”; கிரேக்க வினைச்சொல் உருக்கமான வேண்டுகோளை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: குறிப்பாக
  rationale: முந்தைய வசனத்தில் பவுல் தெரிவித்த மகிழ்ச்சிக்கான முதன்மையான காரணத்தை வலியுறுத்துகிறது; தமிழில் இயல்பான இணைப்பைத் தொடர்ந்து வரும் ‘என்பதால்’ வெளிப்படுத்துகிறது.
- source_word: γνώστην ὄντα σε
  choice: நீங்கள் நன்கு அறிந்திருப்பதால்
  rationale: அகிரிப்பாவுக்கு இவற்றைப் பற்றிய ஆழமான பரிச்சயம் இருப்பதைக் காட்டுகிறது; ‘நிபுணர்’ என்று மொழிபெயர்த்து பொருளை மிகைப்படுத்தவில்லை.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: யூதர்களிடையே உள்ள எல்லா வழக்கங்களையும்
  rationale: κατὰ Ἰουδαίους என்பதன் தொடர்பு அல்லது சூழல் சார்ந்த பொருளை ‘யூதர்களிடையே உள்ள’ என்று நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τε καὶ
  choice: …ஐயும் …ஐயும்
  rationale: இரு தொடர்புடைய வகைகளை இணைக்கும் கிரேக்க அமைப்பைத் தமிழின் இணை எண்ணுமை உருபுகள் தெளிவாக வெளிப்படுத்துகின்றன.
- source_word: ζητημάτων
  choice: சர்ச்சைகளையும்
  rationale: இங்கு வெறும் கேள்விகளை அல்லாமல் யூதர்களிடையே விவாதத்திற்கும் கருத்துமோதலுக்கும் உரிய விஷயங்களைக் குறிக்கிறது.
- source_word: διὸ
  choice: என்பதால்
  rationale: அகிரிப்பாவின் அறிவிலிருந்து பவுலின் வேண்டுகோளுக்கு வரும் காரணவியல் தொடர்பை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: δέομαι
  choice: மன்றாடுகிறேன்
  rationale: இது சாதாரணமாகக் கேட்பதைவிட உருக்கமான வேண்டுகோளைக் குறிக்கிறது; ‘மன்றாடுகிறேன்’ அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: μακροθύμως
  choice: பொறுமையுடன்
  rationale: நீண்ட மனப்பொறுமையோடு செவிகொடுக்குமாறு பவுல் வேண்டுவதைக் தெளிவாகக் காட்டுகிறது.
- source_word: ἀκοῦσαί μου
  choice: நான் சொல்வதைக் … கேட்கும்படி
  rationale: ஒருவருக்குச் செவிகொடுப்பது என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘முழுவதுமாக’ போன்ற கருத்தைச் சேர்க்கவில்லை.
