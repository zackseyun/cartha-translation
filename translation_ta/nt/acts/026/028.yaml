source:
  edition: SBLGNT
  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: ta
  text: அப்போது அகிரிப்பா பவுலிடம், “குறுகிய நேரத்தில் என்னைக் கிறிஸ்தவனாகும்படி இணங்கவைக்கிறாய்”[a] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிட்டத்தட்ட என்னைக் கிறிஸ்தவனாக்கிவிட்டாய்”; அல்லது, “இவ்வளவு குறுகிய நேரத்தில் என்னைக் கிறிஸ்தவனாக ஆக்கிவிடலாம் என்று நினைக்கிறாயா?” கிரேக்கச் சொற்றொடர் குறுகிய நேரத்தையோ சிறிய அளவையோ குறிக்கலாம்; அகிரிப்பாவின் தொனி உண்மையானதாகவோ ஏளனமானதாகவோ இருந்திருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: அப்போது அகிரிப்பா
  rationale: δέ இங்கு மென்மையான தொடர்ச்சி இணைப்பாக உள்ளது; ‘அப்போது’ இயல்பான கதை நகர்வைத் தருகிறது, தேவையற்ற எதிர்மறை வேறுபாட்டைச் சேர்ப்பதில்லை.
- source_word: πρὸς τὸν Παῦλον
  choice: பவுலிடம்
  rationale: பேச்சை அறிமுகப்படுத்தும் இவ்வமைப்பில் சொல்லுதல் குறித்த வினைச்சொல் மறைந்துள்ளது; ‘பவுலிடம்’ என்பதோடு மேற்கோளுக்குப் பின் ‘என்றான்’ சேர்ப்பது தமிழில் இயல்பாக உள்ளது.
- source_word: Ἐν ὀλίγῳ
  choice: இவ்வளவு குறுகிய நேரத்தில்
  rationale: இந்தச் சொற்றொடர் சிறிதளவு நேரத்தையோ சிறிய அளவையோ குறிக்கலாம். முதன்மை உரையில் காலப் பொருள் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது; அளவுப் பொருளும் மாறுபட்ட தொனியும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: με πείθεις
  choice: என்னை இணங்கவைக்கிறாயா?
  rationale: πείθεις நிகழ்காலத்தில் நடைபெறும் இணங்கவைத்தலை அல்லது முயற்சியைச் சுட்டுகிறது. கிரேக்க வடிவம் இலக்கணப்படி வாக்கியமாக இருந்தாலும், சூழலில் இருக்கக்கூடிய வினா அல்லது நகைச்சுவைத் தொனியைத் தமிழ் வினா வடிவம் இயல்பாக வெளிப்படுத்துகிறது; உறுதியான கூற்றாகவும் வாசிக்கலாம் என்பது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: Χριστιανὸν
  choice: கிறிஸ்தவனாக
  rationale: ποιῆσαι உடன் வரும் பயனிலை வேற்றுமை, விளைவாக ஏற்படும் அடையாளம் அல்லது நிலையைச் சுட்டுகிறது. அகிரிப்பா ஆண் என்பதால் தமிழில் ‘கிறிஸ்தவனாக’ பொருத்தமானது.
- source_word: ποιῆσαι
  choice: ஆக்கிவிடலாம் என்று
  rationale: ποιέω இங்கு ஒருவரை ஒரு குறிப்பிட்ட அடையாளம் உடையவராக ஆக்குதல் என்ற விளைவுப் பொருளைக் கொண்டது. ‘ஆக்கிவிடலாம் என்று’ என்பது πείθεις உடனான கருத்தை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: அகிரிப்பாவின் பதிலின் தொனியும் வலிமையும்
  choice: “இவ்வளவு குறுகிய நேரத்தில் என்னைக் கிறிஸ்தவனாக ஆக்கிவிடலாம் என்று என்னை இணங்கவைக்கிறாயா?” என்ற சாத்தியமான வினா/வியப்பு வாசிப்பு
  alternative: “குறுகிய நேரத்தில் என்னைக் கிறிஸ்தவனாகும்படி இணங்கவைக்கிறாய்” என்ற நேரடியான கூற்று; அல்லது “கிட்டத்தட்ட என்னைக் கிறிஸ்தவனாக்கிவிட்டாய்” என்ற அளவுப் பொருள்
  rationale: Ἐν ὀλίγῳ என்பது நேரத்தையோ அளவையோ குறிக்கக்கூடியது; கிரேக்க உரையில் தொனியைத் தீர்மானிக்கும் குறியீடுகள் இல்லை. ஆகவே முதன்மை உரை சூழலுக்கு ஏற்ற இயல்பான தமிழ் வினாவைத் தேர்ந்தெடுக்கிறது; ஆனால் அகிரிப்பா உண்மையாக, தவிர்க்கும் விதமாக, அல்லது ஏளனமாகப் பேசியிருக்கலாம் என்ற தெளிவின்மையை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் புகழ்பெற்ற அர்த்த மற்றும் தொனி இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
