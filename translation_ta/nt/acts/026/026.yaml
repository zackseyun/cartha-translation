source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: ta
  text: இந்தக் காரியங்களைப் பற்றி அரசர் அறிந்திருக்கிறார்; அவரிடமே நான் துணிவுடன் பேசுகிறேன்.[a] இவற்றில் எதுவும் அவருடைய கவனத்துக்குத் தப்பியிருக்கவில்லை[b] என்று நான் உறுதியாக நம்புகிறேன்; ஏனெனில் இது ஒரு மூலையில் நடந்தது அல்ல.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவரிடம் வெளிப்படையாகப் பேசுகிறேன்” அல்லது “அவரிடம் தாராளமாகப் பேசுகிறேன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஒளிவுமறைவற்ற, அச்சமற்ற பேச்சைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “இவற்றில் எதுவும் அவருக்கு மறைவாக இல்லை” அல்லது “இவற்றில் எதுவும் அவருக்குத் தெரியாமல் போகவில்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “ஒரு மூலையில் நடந்தது அல்ல” என்பது இது இரகசியமாகவோ பொதுமக்கள் அறியாத விதத்திலோ நடைபெறவில்லை என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: அறிந்திருக்கிறார்
  rationale: இந்த வினைச்சொல் அறிவையும் பரிச்சயத்தையும் குறிக்கிறது. அரசருக்கு இக்காரியங்கள் பற்றிய அறிவு இருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: περὶ τούτων
  choice: இந்தக் காரியங்களைப் பற்றி
  rationale: περί + genitive பேசப்படும் பொருளைக் குறிக்கிறது; இந்தத் தொடர் அதன் பரந்த சுட்டுதலைக் காக்கிறது.
- source_word: παρρησιαζόμενος
  choice: துணிவுடன் பேசுகிறேன்
  rationale: வெளிப்படையாகவும் அச்சமின்றியும் தன்னம்பிக்கையுடனும் பேசும் கருத்தை இயல்பான தமிழில் தருகிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: πρὸς ὃν ... λαλῶ
  choice: அவரிடம் ... பேசுகிறேன்
  rationale: அரசரே பவுலின் பேச்சு நேரடியாகச் செலுத்தப்படும் நபர் என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: λανθάνειν ... αὐτὸν
  choice: அவருடைய கவனத்துக்குத் தப்பியிருக்கவில்லை
  rationale: ஒருவரால் கவனிக்கப்படாமல் போதல் என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: οὐ πείθομαι οὐθέν
  choice: எதுவும் ... இல்லை என்று நான் உறுதியாக நம்புகிறேன்
  rationale: கிரேக்கத்தின் எதிர்மறைக் கட்டமைப்பையும் பவுலின் உறுதியான நம்பிக்கையையும் தெளிவாக எடுத்துரைக்கிறது.
- source_word: πεπραγμένον
  choice: நடந்தது
  rationale: நிறைவேறிய செயல் அல்லது நிகழ்வைக் குறிக்கும் perfect participle-ஐ சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: ἐν γωνίᾳ
  choice: ஒரு மூலையில்
  rationale: இரகசியமாகவோ பொதுக் கவனத்திற்கு அப்பாற்பட்டதாகவோ நடைபெறவில்லை என்ற உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τοῦτο
  choice: இது
  rationale: எந்த நிகழ்வை அல்லது நிகழ்வுகளின் தொகுதியைச் சுட்டுகிறது என்பதை வசனம் துல்லியமாக வரையறுக்காததால், கிரேக்கத்தின் பரந்த சுட்டுதலை அப்படியே வைத்திருக்கிறது.
theological_decisions:
- issue: “இது” என்பதன் வரம்பும் நிகழ்வுகளின் பொதுத் தன்மையும்
  choice: வசனம் குறிப்பிடுவதைக் கடந்துச் செல்லாமல், பொதுவாக அறியப்பட்ட நிகழ்வு அல்லது நிகழ்வுகளின் தொகுதியை நடுநிலையாகச் சுட்டுதல்
  alternative: இதை இயேசுவின் மரணம் மற்றும் உயிர்த்தெழுதல் மட்டும் என்று குறுகலாகவோ, முழுக் கிறிஸ்தவ இயக்கமும் பவுலின் வழக்கும் என்று விரிவாகவோ விளக்குதல்
  rationale: τοῦτο என்பதன் சரியான வரம்பை இவ்வசனம் தனியாக வரையறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு எந்த ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தையும் திணிக்காமல் அதன் இயல்பான பரந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. “அரசர்” என்பது மரியாதையைப் பேணுகிறது; “ஒரு மூலையில்” என்ற மூல உருவகம் உரையிலேயே வைக்கப்பட்டு அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
