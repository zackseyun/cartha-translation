id: ACT.26.29
reference: Acts 26:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: ta
  text: அதற்குப் பவுல், “சிறிது காலத்திலோ நீண்ட காலத்திலோ[a], நீர் மட்டுமல்ல, இன்று எனக்குச் செவிகொடுக்கிற அனைவருமே—இந்தச் சங்கிலிகளைத் தவிர—என்னைப் போல ஆக வேண்டும் என்று கடவுளிடம் வேண்டிக்கொள்வேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏறக்குறையவோ முழுமையாகவோ.” கிரேக்கச் சொற்றொடர் புரிந்துகொள்வதற்குக் கடினமானது; அது அளவு, முயற்சி, காலம் அல்லது பரப்பைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: கடவுளிடம் வேண்டிக்கொள்வேன்
  rationale: ἄν உடன் வரும் விருப்ப வினைமுறை, கடவுளை நோக்கிய விருப்பத்தையும் வேண்டுதலையும் தெரிவிக்கிறது. தமிழில் ‘கடவுளிடம் வேண்டிக்கொள்வேன்’ என்பது இதை இயல்பாகவும் மரியாதையான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: சிறிது காலத்திலோ நீண்ட காலத்திலோ
  rationale: விவாதத்திற்குரிய இந்த இணைச்சொற்றொடரின் காலம்/அளவு சார்ந்த பொருளை முதன்மை உரை எடுத்துக்கொள்கிறது; கிரேக்கத்தின் பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: நீர் மட்டுமல்ல, இன்று எனக்குச் செவிகொடுக்கிற அனைவருமே
  rationale: ‘நீர் மட்டுமல்ல ... அனைவருமே’ என்பது வலியுறுத்தப்பட்ட முரணைத் தக்கவைக்கிறது; நிகழ்காலப் பங்கேற்புச் சொல்லை ‘செவிகொடுக்கிற’ என்று இயல்பான தமிழில் வழங்குகிறது.
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: என்னைப் போல ஆக வேண்டும்
  rationale: விரும்பப்படும் விளைவு நிலையை ‘ஆக வேண்டும்’ தெளிவாகக் காட்டுகிறது; பவுலின் சுயஒப்பீட்டையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: இந்தச் சங்கிலிகளைத் தவிர
  rationale: παρεκτός குறிக்கும் விதிவிலக்கையும், சிறைவாசச் சூழலில் δεσμοί குறிக்கும் கண்கூடான சங்கிலிகளையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: அகிரிப்பாவின் முந்தைய கூற்றுடன் தொடர்புடைய ἐν ὀλίγῳ καὶ ἐν μεγάλῳ என்பதன் பொருள்
  choice: கால அளவைக் குறிக்கும் பரந்த எதிரிணையாக ‘சிறிது காலத்திலோ நீண்ட காலத்திலோ’
  alternative: ‘ஏறக்குறையவோ முழுமையாகவோ’ அல்லது ‘சிறிதளவு முயற்சியிலோ மிகுந்த முயற்சியிலோ’
  rationale: சொற்றொடரின் பொருள் உண்மையாகவே விவாதத்திற்குரியது. உடனடிச் சூழலுக்கு ஏற்ற ஒரு சாத்தியமான பொருள் முதன்மை உரையில் தரப்படுகிறது; பிற சாத்தியங்கள் மறைக்கப்படாமல் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசரிடம் பேசுவதால் ஒருமை மரியாதை வடிவான ‘நீர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. சிக்கலான கிரேக்கச் சொற்றொடரின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
