id: ACT.26.15
reference: Acts 26:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: ta
  text: அதற்கு நான், “ஆண்டவரே,[a] நீர் யார்?” என்று கேட்டேன். ஆண்டவர், “நீ துன்புறுத்துகிற இயேசு நானே” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்கச் சொல் மரியாதையான அழைப்பாகவும் பயன்படலாம்; ஆனால் இங்கு வானத் தோற்றத்தில் பேசுபவர் உடனே இயேசு என்று அடையாளப்படுத்தப்படுவதால் “ஆண்டவரே” என்பது பிரதான உரையில் பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: அதற்கு நான் ... என்று கேட்டேன்
  rationale: δέ இங்கு வலுவான எதிர்மறையை அல்ல, உரையாடலின் தொடர்ச்சியைச் சுட்டுகிறது; ‘அதற்கு’ என்பது தமிழில் இயல்பான கதைத் தொடர்பை அளிக்கிறது. கேள்வி உரை வருவதால் εἶπα என்பதை ‘என்று கேட்டேன்’ என வழங்குவது இயல்பானது.
- source_word: Τίς εἶ, κύριε;
  choice: ஆண்டவரே, நீர் யார்?
  rationale: τίς εἶ என்பது ‘நீர் யார்?’ κύριε என்பதற்கு இவ்வானத் தோற்றச் சூழலில் ‘ஆண்டவரே’ பொருத்தமானது. மரியாதை ஒருமையைத் தக்கவைக்க ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: ஆண்டவர் ... என்றார்
  rationale: ὁ κύριος அடையாளம் காணப்பட்ட பேச்சாளரை ‘ஆண்டவர்’ எனக் குறிக்கிறது. δέ-ஐ தனியே மொழிபெயர்க்காமல் வாக்கியத் தொடர்ச்சியில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: இயேசு நானே
  rationale: தமிழில் பெயர்ச்சொல்லை முன்வைத்து ‘நானே’ என முடிப்பது இயல்பான நேரடி சுயஅடையாளப்படுத்தல்; ἐγώ என்பதன் வெளிப்படையான இருப்பையும் அளவுக்கு மீறாமல் பிரதிபலிக்கிறது.
- source_word: ὃν σὺ διώκεις
  choice: நீ துன்புறுத்துகிற
  rationale: διώκεις இங்கு பகைமையுடன் தொடர்ந்து துன்புறுத்துவதைக் குறிக்கிறது. ‘நீ ... துன்புறுத்துகிற’ என்பது நிகழ்காலத் தொடர்ச்சியையும் உறவுப்பெயர் அமைப்பையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: சவுலின் அழைப்பிலும் உரையாசிரியரின் அடையாளப்படுத்தலிலும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர் / ஆண்டவரே
  alternative: ஐயா / ஐயாவே
  rationale: முதல் κύριε தனியாகப் பார்க்கும்போது மரியாதை அழைப்பான ‘ஐயா’ என்றும் அமையலாம். ஆனால் வானத் தோற்றத்தில் பேசுபவர் உடனே இயேசு என்று தம்மை வெளிப்படுத்துவதும், அடுத்த சொற்றொடர் அவரை ὁ κύριος என்று குறிப்பிடுவதும் பிரதான உரையில் ‘ஆண்டவரே’ என்பதை ஆதரிக்கின்றன. மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வேதாகமக் கண்ணியமும் கொண்ட இயல்பான உரை. இயேசுவை நோக்கிய நேரடி உரையில் ‘நீர்’ என்றும், இயேசுவின் பதிலில் சவுலை நோக்கி மூலத்தின் ஒருமையைப் பிரதிபலிக்கும் ‘நீ’ என்றும் வழங்கப்பட்டுள்ளது.
