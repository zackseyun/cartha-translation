  to: “ஆனால் எழுந்து, உன் கால்களில் நிமிர்ந்து நில். ஏனெனில், நீ என்னைக் கண்ட காரியங்களைக் குறித்தும், நான் உனக்குத் தோன்றவிருக்கும் காரியங்களைக் குறித்தும் பணியாளனாகவும் சாட்சியாகவும் உன்னை நியமிப்பதற்காகவே உனக்குத் தோன்றினேன்.”
