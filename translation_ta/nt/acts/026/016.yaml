id: ACT.26.16
reference: Acts 26:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: ta
  text: “ஆனால் எழுந்து, உன் கால்களில் நிமிர்ந்து நில். ஏனெனில், நீ என்னைக் கண்ட காரியங்களைக் குறித்தும், நான் உனக்குத் தோன்றவிருக்கும் காரியங்களைக் குறித்தும் பணியாளனாகவும் சாட்சியாகவும் உன்னை நியமிப்பதற்காகவே உனக்குத் தோன்றினேன்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάστηθι
  choice: எழுந்து
  rationale: இறந்தகால ஏவல் வடிவம் உடனடியாக எழும்பும்படி கட்டளையிடுகிறது; ‘எழுந்து’ என்பது இயல்பானதும் சுருக்கமானதும் ஆகும்.
- source_word: στῆθι ἐπὶ τοὺς πόδας σου
  choice: உன் கால்களில் நிமிர்ந்து நில்
  rationale: அழைப்பு மற்றும் நியமனச் சூழலில் வரும் உடல்சார்ந்த தெளிவான கட்டளையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τοῦτο γὰρ
  choice: இதற்காகவே
  rationale: தோன்றியதன் நோக்கத்தை வலியுறுத்தும் சொற்றொடராக இருப்பதால், நோக்கத்தையும் வலியுறுத்தலையும் தெளிவாகக் காட்டுகிறது.
- source_word: ὤφθην σοι
  choice: உனக்குத் தோன்றினேன்
  rationale: இலக்கணத்தில் செயல்பாட்டு வடிவமல்லாதபோதிலும், இங்கு தனிப்பட்ட வெளிப்பாட்டைக் குறிக்கும் வழக்கமான தோற்றச் சொற்றொடர்; அதை நேரடியாகப் பேணுகிறது.
- source_word: προχειρίσασθαί σε
  choice: உன்னை ... நியமிப்பதற்காக
  rationale: ஒரு குறிப்பிட்ட பொறுப்புக்காகத் தேர்ந்தெடுத்து அமர்த்தும் அதிகாரப்பூர்வ நியமனப் பொருளை வெளிப்படுத்துகிறது.
- source_word: ὑπηρέτην
  choice: பணியாளனாக
  rationale: ὑπηρέτης என்பது கீழ்ப்பட்ட முறையில் பணிபுரியும் உதவியாளர் அல்லது முகவரைக் குறிக்கிறது; சபைப் பதவிப் பொருளைத் தேவையின்றி ஏற்றாமல் எளிய தமிழில் தரப்படுகிறது.
- source_word: μάρτυρα
  choice: சாட்சியாக
  rationale: கண்டதும் வெளிப்படுத்தப்பட்டதும் குறித்து சான்றுரைப்பவரைத் துல்லியமாகக் குறிக்கும் வழக்கமான சொல்.
- source_word: ὧν τε εἶδές με
  choice: நீ என்னைக் கண்டவற்றைக் குறித்தும்
  rationale: με என்பதைக் கணக்கில் கொண்டு, இயேசுவை பவுல் கண்டதுடன் தொடர்புடையவற்றைப் பற்றிச் சாட்சி கூறும் பொருளை, கிரேக்கத்தின் சுருக்கமான அமைப்பை அதிகமாக விரிவாக்காமல் தருகிறது.
- source_word: ὧν τε ὀφθήσομαί σοι
  choice: நான் உனக்குத் தோன்றப்போகிறவற்றைக் குறித்தும்
  rationale: எதிர்காலத் தோற்ற மொழியைப் பேணி, இனி நிகழவிருக்கும் வெளிப்பாடுகளையும் பவுலின் சாட்சிப் பணியுடன் இணைக்கிறது.
theological_decisions:
- issue: ὤφθην / ὀφθήσομαί என்பவற்றின் வெளிப்பாட்டு இயல்பு
  choice: இரண்டையும் ‘தோன்றினேன் / தோன்றப்போகிற’ என்ற தனிப்பட்ட தோற்ற மொழியால் மொழிபெயர்த்தல்
  alternative: ‘என்னை நீ கண்டாய் / என்னை நீ காண்பாய்’ அல்லது ‘என்னை வெளிப்படுத்தினேன் / வெளிப்படுத்துவேன்’
  rationale: உயிர்த்தெழுந்த இயேசு பவுலுக்குத் தனிப்பட்ட முறையில் தோன்றி அவரை நியமிப்பதை வசனம் கூறுகிறது. ‘தோன்றுதல்’ என்பது வெளிப்பாட்டின் நிஜத்தன்மையைப் பேணுகிறது; அது எந்த விதத்தில் நிகழ்ந்தது என்பதைத் தேவையின்றி வரையறுப்பதில்லை.
- issue: ὧν ... ὧν என்ற சுருக்கமான தொடர்புச் சொற்றொடரின் பொருள்
  choice: கண்டவற்றையும் இனித் தோன்றப்போகிறவற்றையும் குறித்து சாட்சியாக இருப்பது
  alternative: ‘நீ என்னைக் கண்ட காரியங்களிலும், நான் உனக்குத் தோன்றும் காரியங்களிலும்’ என்று வடிவத்துக்கு மிக நெருக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்கச் சொற்றொடரின் உறவைத் தீர்மானித்துவிடாமல், தமிழில் புரியக்கூடிய அளவுக்கு மட்டும் ‘குறித்து’ எனத் தெளிவாக்கப்பட்டுள்ளது; சுருக்கமான மூல அமைப்பு அடிக்குறிப்பில் காட்டப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் நேரடியான கட்டளைத் தொனியும் பேணப்பட்டுள்ளன. ‘ஊழியக்காரன்’ அல்லது ‘மந்திரி’ போன்ற சபைசார் அல்லது பதவிசார் நிழற்பொருள்களைத் தவிர்த்து, ὑπηρέτης என்பதற்கு ‘பணியாளன்’ பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபருக்கான ‘உன்/உனக்கு’ வடிவங்கள் மூலத்தின் நேரடியான அழைப்பைத் தக்கவைக்கின்றன.
