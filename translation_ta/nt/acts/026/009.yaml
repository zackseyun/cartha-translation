id: ACT.26.9
reference: Acts 26:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: ta
  text: ஆகவே, நாசரேயனாகிய இயேசுவின் பெயருக்கு எதிராகப் பல செயல்களைச் செய்ய வேண்டும் என்று நானே எண்ணினேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாசரேத்தைச் சேர்ந்த இயேசுவின் பெயருக்கு எதிராக.”
    reason: Ναζωραῖος என்பதை அடையாளப் பெயராகவோ, நாசரேத் ஊரைச் சேர்ந்தவர் என்பதைக் காட்டும் சொல்லாகவோ இயல்பாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: Ἐγὼ μὲν οὖν
  choice: ஆகவே ... நானே
  rationale: οὖν உரையின் தொடர்ச்சியையும் முடிவுறுத்தலையும் காட்டுவதால் “ஆகவே” என மொழிபெயர்க்கப்பட்டது. தேவையின்றியும் வெளிப்படையாக வரும் Ἐγώ மற்றும் μέν தரும் மிதமான வலியுறுத்தலை “நானே” இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔδοξα ἐμαυτῷ
  choice: எண்ணியிருந்தேன்
  rationale: இந்தச் சொற்றொடர் பவுலின் அக்கால உள்ளார்ந்த தீர்மானத்தை, “நான் அவ்வாறு நினைத்தேன்” என்ற பொருளில் குறிக்கிறது. கடந்தகால மனநிலையைத் தெளிவாகக் காட்ட “எண்ணியிருந்தேன்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: πρὸς τὸ ὄνομα
  choice: பெயருக்கு எதிராக
  rationale: ἐναντία மற்றும் πρᾶξαι என்பவற்றுடன் சேர்ந்துள்ள πρός எதிர்ப்புப் பொருளைக் கொண்டுள்ளது. “பெயர்” என்பது இயேசுவின் நபர், மதிப்பு, அதிகாரம் ஆகியவற்றைக் குறிக்கக்கூடிய வேதாகம வழக்காக இருப்பதால் விளக்கிச் சுருக்காமல் அப்படியே வைக்கப்பட்டது.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: நாசரேயனாகிய இயேசு
  rationale: Ναζωραῖος இயேசுவின் ஊர்சார்ந்த அடையாளத்தைப் பட்டப்பெயர் போன்ற வடிவில் தருகிறது. “நாசரேயனாகிய” என்பது அந்த வடிவைத் தக்கவைக்கும் மரியாதையான, வழக்கமான தமிழ் சொல்லாக்கம்.
- source_word: δεῖν
  choice: செய்ய வேண்டும்
  rationale: பவுல் முன்பு உணர்ந்த கடமை அல்லது அவசியத்தை δεῖν குறிக்கிறது. வெளிப்புறக் கட்டாயத்தை மிகைப்படுத்தாமல் அந்த உள்ளார்ந்த கடமை உணர்வை “வேண்டும்” வெளிப்படுத்துகிறது.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: எதிராகப் பல காரியங்களைச் செய்ய
  rationale: πολλά செயல்களின் பன்மையையும், ἐναντία அவற்றின் எதிர்ப்புத் தன்மையையும் குறிக்கிறது. செயல்களைத் தேவையின்றி குறிப்பாக்காமல் இரண்டையும் இயல்பான தமிழில் இச்சொற்றொடர் காக்கிறது.
theological_decisions:
- issue: இயேசுவைச் சார்ந்த “பெயர்” என்பதன் பொருள்
  choice: “பெயர்” என்ற வேதாகம மரபுச் சொல்லைத் தக்கவைத்தல்
  alternative: “இயேசுவின் அதிகாரம்” அல்லது “இயேசுவின் இயக்கம்” என்று விளக்கி மொழிபெயர்த்தல்
  rationale: ὄνομα இங்கு இயேசுவின் நபர், பொது அடையாளம், அதிகாரம் ஆகியவற்றை உள்ளடக்கக்கூடும். அவற்றில் ஒன்றை மட்டும் தேர்ந்தெடுத்து பொருளைச் சுருக்காமல் மூலத்தின் பரந்த பொருளையும் இறையியல் நிறைவையும் “பெயர்” காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. “நானே” பவுலின் சுயஒப்புதலுக்குரிய வலியுறுத்தலை வழங்குகிறது; “பெயர்” என்ற வேதாகமச் சொல்லாட்சி விளக்கிச் சுருக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
