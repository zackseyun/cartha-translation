id: ACT.21.7
reference: Acts 21:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: ta
  text: நாங்கள் தீருவிலிருந்து கடற்பயணத்தை முடித்து, தொலெமாய்க்கு வந்து சேர்ந்தோம். அங்கிருந்த சகோதரர்களை[a] வணக்கம் தெரிவித்த பின்பு, அவர்களுடன் ஒரு நாள் தங்கினோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதரர்களும் சகோதரிகளும்.” கிரேக்கத்தில் “சகோதரர்கள்” என்று ஆண்பால் பன்மையில் உள்ளது; இச்சொல் இங்கு சக விசுவாசிகள் அனைவரையும் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: பின்பு நாங்கள்
  rationale: Ἡμεῖς என்னும் வெளிப்படையான எழுவாயை ‘நாங்கள்’ எனத் தக்கவைத்து, δέ குறிக்கும் உரையாடல் தொடர்ச்சியை இயல்பான தமிழில் ‘பின்பு’ என வெளிப்படுத்துகிறது.
- source_word: τὸν πλοῦν διανύσαντες
  choice: கடற்பயணத்தை முடித்து
  rationale: πλοῦς என்பது கடல்வழிப் பயணத்தையும், διανύω அதை நிறைவு செய்வதையும் குறிக்கிறது; இத்தொடர் வினையெச்ச வரிசையையும் பயணம் முடிவடைந்ததையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἀπὸ Τύρου
  choice: தீருவிலிருந்து
  rationale: ἀπό புறப்பட்ட இடத்தைக் குறிக்கிறது; ‘தீருவிலிருந்து’ என்பது நேரடியான தமிழ் வடிவம்.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: தொலெமாய்க்கு வந்து சேர்ந்தோம்
  rationale: பயணச் சூழலில் καταντάω ஓர் இடத்தை அடைவதைக் குறிக்கிறது; εἰς இலக்கிடத்தைக் காட்டுவதால் ‘வந்து சேர்ந்தோம்’ என்ற இயல்பான தமிழ் நடை பயன்படுத்தப்பட்டது.
- source_word: ἀσπασάμενοι
  choice: வாழ்த்திய பின்பு
  rationale: ἀσπάζομαι சந்தித்தவர்களை வாழ்த்துவதைக் குறிக்கிறது; இறந்தகால வினையெச்சத்தின் முந்திய செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοὺς ἀδελφοὺς
  choice: சகோதரர்களை
  rationale: கிரேக்கச் சொல் ஆண்பால் பன்மையில் உள்ளது. தொடக்ககாலக் கிறிஸ்தவப் பயன்பாட்டில் இது பொதுவாகச் சக விசுவாசிகளைக் குறிக்கக்கூடும்; மூலத்தின் வடிவம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: அவர்களுடன் ஒரு நாள் தங்கினோம்
  rationale: μένω பயணச் சூழலில் ‘தங்குதல்’ என்றும், ἡμέραν μίαν கால அளவாக ‘ஒரு நாள்’ என்றும், παρά உடனிருப்பதை ‘அவர்களுடன்’ என்றும் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: கிறிஸ்தவச் சமூகச் சூழலில் ἀδελφοὺς என்பதன் பொருள்
  choice: சகோதரர்களை
  alternative: சகோதர சகோதரிகளை; சக விசுவாசிகளை
  rationale: மூலச்சொல் இலக்கணப்படி ஆண்பால் பன்மை; ஆனால் சூழலில் பெண்களையும் உள்ளடக்கிய உள்ளூர் விசுவாசிகள் அனைவரையும் குறித்திருக்கலாம். பாலின வடிவத்தை முதன்மை உரையில் தக்கவைத்து, அதன் சாத்தியமான உள்ளடக்கிய பொருளை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பயணக் கதையாடலுக்கேற்ற தெளிவானவும் கண்ணியமானவும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அங்கிருந்த’ என்பது சகோதரர்கள் தொலெமாயில் இருந்தவர்கள் என்பதைத் தமிழில் இயல்பாகத் தெளிவுபடுத்தும் சூழல்சார் சேர்க்கை; புதிய தகவலைச் சேர்ப்பதில்லை.
