- from: பின்பு நாங்கள் தீருவிலிருந்து கடற்பயணத்தை முடித்து, தொலெமாய்க்கு வந்து சேர்ந்தோம். அங்கிருந்த சகோதரர்களை[a] வாழ்த்திய பின்பு, அவர்களுடன் ஒரு நாள் தங்கினோம்.
