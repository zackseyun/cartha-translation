source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: ta
  text: மறுநாள் நாங்கள் புறப்பட்டுக் கைசரியாவுக்கு வந்தோம். நற்செய்தியாளரான பிலிப்புவின் வீட்டுக்குள் சென்று, அந்த ஏழு பேரில் ஒருவரான[a] அவரோடு தங்கினோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, எருசலேமில் பணியாற்றுவதற்காக முன்பு நியமிக்கப்பட்ட ஏழு பேரில் ஒருவர் (அப்போஸ்தலர் 6:3–6 பார்க்கவும்).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: மறுநாள்
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் சுருக்கமாகக் காட்டுகிறது; δέ-யைத் தனியே மிகைப்படுத்தாமல் அதன் தொடர்ச்சி உணர்வைப் பேணுகிறது.
- source_word: ἐξελθόντες
  choice: புறப்பட்டு
  rationale: முந்தைய இடத்தைவிட்டு பயணத்தைத் தொடங்கியதைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்; கிரேக்கப் பங்கேற்புவினையின் முன்னிகழ்வுத் தொடர்பையும் காக்கிறது.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: செசரியாவுக்கு வந்தோம்
  rationale: இலக்கை அடைந்த பயண இயக்கத்தைத் தெளிவாகக் காட்டுகிறது; இடப்பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்படுகிறது.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: வீட்டுக்குச் சென்று
  rationale: தமிழில் இயல்பான பயண-விருந்தோம்பல் சூழலை வழங்குகிறது. ‘வீட்டுக்குள் நுழைந்து’ என்பதைக் காட்டிலும் ஓட்டம் இயல்பாக இருந்தாலும், வீட்டை அடைந்து உள்ளே சென்ற வரிசையைப் பேணுகிறது.
- source_word: Φιλίππου
  choice: பிலிப்புவின்
  rationale: தனிப்பெயரின் நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு; உரிமைத் தொடர்புக்கேற்ப வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: τοῦ εὐαγγελιστοῦ
  choice: நற்செய்தியாளர்
  rationale: εὐαγγελιστής என்பதன் பணிவிளக்கை சாதாரண வாசகருக்குப் புரியும் தற்போதைய தமிழில் தெரிவிக்கிறது; பின்னாளைய குறிப்பிட்ட திருச்சபைப் பதவியைத் திணிக்காது.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: அந்த ஏழுபேரில் ஒருவரான
  rationale: முன்னர் அறிமுகப்படுத்தப்பட்ட குறிப்பிட்ட ஏழுபேரைச் சுட்டும் பொருளைப் பேணுகிறது; இதைத் தனி அதிகாரப்பூர்வப் பதவிப் பெயராக மாற்றவில்லை.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: அவரோடு தங்கினோம்
  rationale: விருந்தோம்பல் சூழலில் μένω மற்றும் παρά ஆகியவற்றின் கூட்டு அர்த்தத்தை இயல்பாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: பிலிப்பு ‘அந்த ஏழுபேரில் ஒருவர்’ என அடையாளப்படுத்தப்படுதல்
  choice: ‘அந்த ஏழுபேரில் ஒருவரான’ என்று வரலாற்றுச் சுட்டுதலை மட்டும் தக்கவைத்தல்
  alternative: ‘ஏழு திருத்தொண்டர்களில் ஒருவர்’ அல்லது ஒரு குறிப்பிட்ட திருச்சபைப் பதவியால் அடையாளப்படுத்துதல்
  rationale: இச்சொற்றொடர் அப்போஸ்தலர் 6:3–6-இல் தேர்ந்தெடுக்கப்பட்டவர்களைச் சுட்டுகிறது; ஆனால் அவர்களுக்கு பின்னாளைய திருச்சபை அமைப்பின் தொழில்நுட்பப் பதவியை இவ்வசனம் அளிப்பதில்லை.
translation_notes:
  register: நவீனச் செந்தமிழ் கலந்த பொதுநடை பயன்படுத்தப்பட்டுள்ளது. பயணச் செயல்களின் வரிசை இரண்டு இயல்பான வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. மரியாதையான ‘அவர்/அவரோடு’ வடிவம் பயன்படுத்தப்பட்டுள்ளது; மொழிநடை கண்ணியமானதும் சாதாரண வாசகருக்கு எளிதில் புரியக்கூடியதுமாக உள்ளது.
