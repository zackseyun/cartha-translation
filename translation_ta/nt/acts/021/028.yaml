translation:
  language: ta
  text: “இஸ்ரயேல் ஆண்களே, உதவுங்கள்!” என்று கூக்குரலிட்டார்கள். “மக்களுக்கும் திருச்சட்டத்துக்கும் இந்த இடத்துக்கும் எதிராக எல்லாருக்கும் எங்கும் போதித்துவருகிறவன் இவன்தான். அது மட்டுமல்ல, கிரேக்கர்களைக் கோவில் வளாகத்திற்குள்[a] அழைத்துவந்து, இந்தப் பரிசுத்த இடத்தைத் தீட்டுப்படுத்தியும் விட்டான்.”
  philosophy: optimal-equivalence
