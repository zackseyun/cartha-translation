  register: நவீன நிலையான தமிழில், பொது வாசிப்புக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. குற்றச்சாட்டின் அவசரமும் திரளின் தீவிரமும் காக்கப்பட்டுள்ளன; ‘கிரேக்கர்கள்’, ‘திருச்சட்டம்’, ‘கோவில் வளாகம்’ ஆகியவை மூலச் சூழலின் குறிப்புத்தன்மையைப் பாதுகாக்கின்றன.
