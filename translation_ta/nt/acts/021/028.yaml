  choice: திருச்சட்டம்
  alternative: சட்டம்
  rationale: எருசலேம் கோவில் சூழலில் இது பொதுவான சட்டத்தை அல்ல, யூத மக்களின் மோசேயின் சட்டத்தைச் சுட்டுகிறது; ‘திருச்சட்டம்’ அந்தக் குறிப்பை இயல்பாகத் தெளிவாக்குகிறது.
- issue: ἱερόν என்பதன் வரம்பு
  choice: முதன்மை உரையில் ‘கோவில் வளாகம்’, அடிக்குறிப்பில் உள் பரிசுத்த ஸ்தலத்திலிருந்து வேறுபாடு
  alternative: கோவில்
  rationale: ἱερόν முழுக் கோவில் வளாகத்தையோ முற்றங்களையோ குறிக்கிறது; ναός போல உள் பரிசுத்த ஸ்தலத்தை மட்டும் குறிக்காது. வரலாற்றுச் சூழலில் இவ்வேறுபாடு முக்கியம்.
- issue: κεκοίνωκεν குறிக்கும் தீட்டு
  choice: வழிபாட்டுத் தூய்மையை மீறியதாகக் கூறும் குற்றச்சாட்டாக ‘தீட்டுப்படுத்தியும் விட்டான்’
  alternative: அசுத்தப்படுத்தினான் / புனிதத்தைக் குலைத்தான்
  rationale: இது கதைசொல்லியின் உறுதிப்படுத்தல் அல்ல, கூட்டம் பவுல்மீது சுமத்திய வழிபாட்டுத் தீட்டு குற்றச்சாட்டு; மொழிபெயர்ப்பு அந்தக் கூற்றின் வலிமையைப் பாதுகாக்கிறது.
