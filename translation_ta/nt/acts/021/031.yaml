  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: ta
  text: அவர்கள் அவரைக் கொல்ல முயன்றுகொண்டிருந்தபோது, எருசலேம் முழுவதும் குழப்பத்தில் இருந்ததாகப் படைப்பிரிவின் தளபதிக்குச்[a] செய்தி சென்றது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படைப்பிரிவின் தளபதி” என்பது அங்கு நிறுத்தப்பட்டிருந்த ரோமப் படைப்பிரிவுக்குப் பொறுப்பான ஒரு ரோம இராணுவ அதிகாரியைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “எருசலேம் முழுவதும் கொந்தளிப்பில் இருந்ததாக” அல்லது “பெரும் குழப்பத்தில் இருந்ததாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: அவர்கள் அவரைக் கொல்ல முயன்றுகொண்டிருந்தபோது
  rationale: தொடர்ந்து நடந்துகொண்டிருந்த செயலைக் குறிக்கும் நிகழ்காலப் பங்கேற்புச் சொல்லின் தன்மையையும், பிரதான நிகழ்வுடன் அது ஒரே நேரத்தில் நடந்ததையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀνέβη φάσις
  choice: செய்தி சென்றது
  rationale: கிரேக்கத்தில் உள்ள ‘செய்தி மேலே சென்றது’ என்ற உருவகத்தைத் தமிழில் அப்படியே சொல்வது இயல்பாக இருக்காது; கோட்டையிலிருந்த தளபதியைச் செய்தி அடைந்தது என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: படைப்பிரிவின் தளபதிக்கு
  rationale: χιλίαρχος என்பது இங்கு ரோமப் படையின் உயரதிகாரியையும், σπεῖρα ஒரு படைப்பிரிவையும் குறிக்கிறது. தொழில்நுட்பமான பதவிப் பெயரைத் தவிர்த்து, நவீன வாசகருக்குப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὅτι ὅλη Ἰερουσαλήμ
  choice: எருசலேம் முழுவதும்
  rationale: நகரையும் அதன் மக்களையும் குறிக்கும் கிரேக்க ஆகுபெயர் வழக்கின் சுருக்கமான வலிமையைப் பாதுகாக்கிறது.
- source_word: συγχύννεται
  choice: கலவரத்தில் இருப்பதாக
  rationale: நகரம் குழப்பமும் பொதுக் கொந்தளிப்பும் நிறைந்த நிலையில் இருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; செயப்பாட்டு வடிவத்தைச் செயற்கையாகப் பிரதிபலிக்காமல் அதன் நிலைமையை எடுத்துரைக்கிறது.
