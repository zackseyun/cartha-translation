translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஆலய வளாகம்’ என்ற சொற்றொடர் வரலாற்று இடவியல் வேறுபாட்டை முதன்மை உரையிலேயே தெளிவாக்குகிறது; திடீர் கூட்டச்சேர்க்கையும் தொடர்ந்து இழுத்துச் செல்லப்பட்ட செயலும்கூட இயல்பான தமிழ் வினை அமைப்புகளால் வெளிப்படுத்தப்பட்டுள்ளன.
