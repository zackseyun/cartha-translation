id: ACT.21.30
reference: Acts 21:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: ta
  text: நகரம் முழுவதும் கலக்கமடைந்தது; மக்கள் கூட்டமாக ஓடித் திரண்டார்கள்.[a] அவர்கள் பவுலைப் பிடித்து, ஆலய வளாகத்திலிருந்து வெளியே இழுத்துக்கொண்டு போனார்கள்.[b] உடனே கதவுகள்[c] மூடப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் ஒன்றாகக் கூடிவந்தார்கள்.” கிரேக்கச் சொல் மக்கள் திடீரென ஒரே இடத்தில் திரண்டதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள கிரேக்கச் சொல் ஆலயத்தின் உட்புறத் திருத்தலத்தை மட்டும் குறிக்காமல், அதன் முற்றங்களையும் பிற பகுதிகளையும் உள்ளடக்கிய ஆலய வளாகத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “வாயில்கள்.” ஆலயச் சூழலில் இச்சொல் நுழைவாயில்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη
  choice: கலக்கமடைந்தது
  rationale: இங்கு κινέω என்பதன் செயப்பாட்டு வடிவம் நகரம் உடலளவில் அசைந்ததைக் குறிக்காமல், நகரமெங்கும் ஏற்பட்ட பரபரப்பையும் கலக்கத்தையும் குறிக்கிறது.
- source_word: ἡ πόλις ὅλη
  choice: நகரம் முழுவதும்
  rationale: நகரின் எல்லாப் பகுதிகளிலும் அல்லது நகர மக்களிடையே பரவிய கலக்கத்தின் விரிவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: மக்கள் கூட்டமாக ஓடித் திரண்டார்கள்
  rationale: συνδρομή என்பது மக்கள் திடீரென ஒரே இடத்தை நோக்கி ஓடிவந்து கூடுவதைக் குறிக்கிறது; வெறுமனே ஒரு கூட்டம் இருந்தது என்பதைக் காட்டிலும் இந்த இயக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: அவர்கள் பவுலைப் பிடித்து
  rationale: ἐπιλαμβάνομαι இங்கு ஒருவரைப் பலவந்தமாகப் பற்றிப் பிடிப்பதைக் குறிக்கிறது. வினையெச்ச அமைப்பு அடுத்த செயலோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: εἷλκον
  choice: இழுத்துக்கொண்டு போனார்கள்
  rationale: இறந்தகால நிறைவுறா வடிவம் தொடர்ந்த இழுத்துச் செல்லும் செயலைக் காட்டுகிறது; தமிழ் தொடர்நிலை அமைப்பு அந்த அம்சத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: ஆலய வளாகத்திலிருந்து வெளியே
  rationale: ἱερόν என்பது உட்புற பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலயத்தின் மொத்த வளாகத்தையும் குறிக்கிறது; ‘வளாகம்’ அந்த இடவியல் பொருளைத் தெளிவாக்குகிறது.
- source_word: εὐθέως
  choice: உடனே
  rationale: செயல் தாமதமின்றி நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: கதவுகள் மூடப்பட்டன
  rationale: செயப்பாட்டு அமைப்பையும் θύραι என்பதன் அடிப்படைப் பொருளையும் காக்கிறது; ஆலயச் சூழலில் ‘வாயில்கள்’ என்ற பொருளும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
