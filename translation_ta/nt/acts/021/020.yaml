id: ACT.21.20
reference: Acts 21:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: ta
  text: அவர்கள் இதைக் கேட்டபோது கடவுளை மகிமைப்படுத்தினார்கள். பின்பு பவுலிடம், “சகோதரரே, யூதர்களில்[b] விசுவாசித்தவர்கள் எத்தனை பல்லாயிரக்கணக்கானோர்[a] இருக்கிறார்கள் என்பதை நீர் காண்கிறீர்; அவர்கள் அனைவரும் திருச்சட்டத்தின்மேல் மிகுந்த ஆர்வமுள்ளவர்கள்,” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எத்தனை பத்தாயிரக்கணக்கானோர்.” கிரேக்கச் சொல் பத்தாயிரம் என்ற அலகுகளையோ, பொதுவாக மிகப் பெரும் எண்ணிக்கையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யூதர்களில்” என்பதற்கு மாற்றாக, புவியியல் பொருளில் “யூதேயர்களில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: அவர்கள் இதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை காலத் தொடர்பைக் காட்டுகிறது; முந்தைய வசனத்தில் பவுல் தெரிவித்த செய்தியை இயல்பாகச் சுட்டுவதற்காகத் தமிழில் ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐδόξαζον τὸν θεόν
  choice: கடவுளை மகிமைப்படுத்தினார்கள்
  rationale: கடவுளுக்கு மகிமை செலுத்துதல் என்ற δοξάζω-வின் இறையியல் நிறையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἶπόν τε αὐτῷ
  choice: பின்பு பவுலிடம் ... என்றார்கள்
  rationale: τέ கதைத் தொடர்ச்சியை இணைக்கிறது. αὐτῷ என்பதன் சூழல்சார் குறிப்பு பவுல் என்பதால், தமிழில் தெளிவுக்காக அவரது பெயர் வழங்கப்படுகிறது.
- source_word: Θεωρεῖς, ἀδελφέ
  choice: சகோதரரே, ... நீர் காண்கிறீர்
  rationale: ஒரு குறிப்பிட்ட ஆணான பவுலை மரியாதையுடன் நேரடியாக அழைக்கும் சொற்றொடர்; θεωρέω இங்கு கண்முன் உள்ள நிலையை கவனிக்கச் செய்கிறது.
- source_word: πόσαι μυριάδες
  choice: எத்தனை பல்லாயிரக்கணக்கானோர்
  rationale: μυριάδες என்பது பத்தாயிர அலகுகளையோ பொதுவாக மிகப் பெரும் எண்ணிக்கையையோ குறிக்கலாம். ‘பல்லாயிரக்கணக்கானோர்’ இயல்பான தமிழில் பெருந்தொகையைத் தெரிவித்து, துல்லிய எண்ணைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: யூதர்களில்
  rationale: இங்கு புவியியல் இருப்பிடத்தை மட்டும் அல்லாமல் யூத இன-சமயச் சமூகத்தினரிடையே என்பதைக் குறிக்கும் வாசிப்புக்கு ஏற்றது.
- source_word: τῶν πεπιστευκότων
  choice: விசுவாசித்தவர்கள்
  rationale: நம்பிக்கைக்கு வந்து அந்த நிலையில் இருப்பவர்களைக் குறிக்கும் நிறைவுக் காலப் பங்கேற்புவினையின் வினைத்தன்மையைப் பாதுகாக்கிறது.
- source_word: πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: அவர்கள் அனைவரும் திருச்சட்டத்தின்மேல் வைராக்கியமுள்ளவர்கள்
  rationale: ζηλωταί குறிக்கும் தீவிரப் பற்றை ‘வைராக்கியம்’ தெரிவிக்கிறது; νόμος இங்கு மோசேயின் சட்டத்தைக் குறிப்பதால் ‘திருச்சட்டம்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἐν τοῖς Ἰουδαίοις என்பதன் குறிப்பு
  choice: யூதர்களில்
  alternative: யூதேயர்களில்
  rationale: சூழல் மோசேயின் திருச்சட்டத்தின்மேல் பற்றுள்ள யூத விசுவாசிகளைப் பற்றியது; ஆகவே இன-சமய அடையாளம் முதன்மையாகத் தெரிகிறது. இருப்பினும் புவியியல் வாசிப்பும் மொழியளவில் சாத்தியம் என்பதால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: μυριάδες என்பதன் எண்ணளவு
  choice: பல்லாயிரக்கணக்கானோர்
  alternative: பல்லாயிரம் பத்தாயிரக்கணக்கானோர் / பல பத்தாயிரக்கணக்கானோர்
  rationale: கிரேக்கச் சொல் துல்லியமாகப் பத்தாயிர அலகுகளைக் குறிக்கக்கூடும்; பொதுவாக எண்ணற்ற பெருந்தொகையையும் குறிக்கலாம். பிரதான உரை அந்தத் தெளிவின்மையை இயல்பான தமிழில் காக்கிறது.
- issue: νόμος என்பதன் குறிப்பு
  choice: திருச்சட்டம்
  alternative: சட்டம் / தோரா
  rationale: இங்கு மோசேயின் சட்டம் குறிக்கப்படுவது சூழலில் தெளிவு. ‘திருச்சட்டம்’ சாதாரண சட்டத்திலிருந்து அதை வேறுபடுத்துகிறது; குறிப்பிட்ட சமயப் பிரிவின் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. பவுலுக்கான நேரடி அழைப்பில் மரியாதைப் பன்மை (‘நீர்’) கையாளப்பட்டுள்ளது. கிரேக்கத்தின் எண்ணியல் மற்றும் இன-புவியியல் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
