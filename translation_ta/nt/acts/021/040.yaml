  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் இரண்டு காலநிலைத் தொடர்களும் ‘...கொடுத்ததும்’, ‘...ஏற்பட்டதும்’ என்று தெளிவாகக் காக்கப்பட்டுள்ளன. எபிரெயம்–அரமேயம் குறித்த உண்மையான சொற்பொருள் தெளிவின்மை முதன்மை உரையிலும் காலடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
