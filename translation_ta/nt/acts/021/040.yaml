base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: ta
  text: 'அவன் அனுமதி கொடுத்ததும், பவுல் படிக்கட்டுகளின்மேல் நின்று மக்களுக்குக் கையால் சைகை செய்தார். மிகுந்த அமைதி ஏற்பட்டதும், அவர் எபிரெய மொழியில்[a] அவர்களிடம் இவ்வாறு பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரமேய மொழியில்” என இருக்கலாம். கிரேக்க மூலத்தில் “எபிரெய மொழி/பேச்சுவழக்கில்” என்று உள்ளது; இந்தச் சூழலில் அது பொதுவாக அரமேயம் என்று அழைக்கப்படும் உள்ளூர் செமித்தியப் பேச்சுமொழியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: அவன் அனுமதி கொடுத்ததும்
  rationale: முந்தைய சூழலில் உள்ள படைத்தளபதியைக் குறிக்கும் தனிநிலை உடைமை வேற்றுமைப் பங்கேற்புத் தொடர். காலத் தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: படிக்கட்டுகளின்மேல் நின்று
  rationale: பவுல் நின்றிருந்த இடத்தை விளக்குகிறது; ἀναβαθμοί என்பது கோட்டைக்குச் செல்லும் படிக்கட்டுகளைக் குறிக்கிறது.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: மக்களை நோக்கிக் கையசைத்தார்
  rationale: மக்களின் கவனத்தைப் பெறுவதற்காக அல்லது அவர்களை அமைதிப்படுத்துவதற்காகச் செய்த கைச்சைகையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τῷ λαῷ
  choice: மக்களை நோக்கி
  rationale: λαός என்பதன் நேரடியான பொருளான ‘மக்கள்’ என்பதைக் காக்கிறது; ‘கூட்டம்’ என்ற சூழல்சார் விளக்கத்தை முதன்மை உரைக்குள் கொண்டுவரவில்லை.
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: மிகுந்த அமைதி ஏற்பட்டதும்
  rationale: அமைதி உருவான நிகழ்வையும் அதன் அளவையும் இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: προσεφώνησεν
  choice: அவர்களிடம் ... பேசினார்
  rationale: பொதுவில் கூடியிருந்த மக்களை நோக்கிப் பேசிய செயலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: எபிரெய மொழியில்
  rationale: கிரேக்க உரையின் வெளிப்படையான ‘எபிரெய மொழி/பேச்சுவழக்கு’ என்ற சொல்லாட்சியை முதன்மை உரையில் பாதுகாக்கிறது; இங்கு அரமேயம் குறிக்கப்பட்டிருக்கக்கூடும் என்பதைக் காலடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: λέγων
  choice: 'இவ்வாறு பேசினார்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை இயல்பான தமிழில் அறிமுகப்படுத்தி, தொடரும் உரையை இரட்டைப்புள்ளியால் சுட்டுகிறது.
