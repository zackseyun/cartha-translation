source:
  edition: SBLGNT
  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: ta
  text: அவர் இணங்காததால், நாங்கள் அமைதியாகி, “ஆண்டவரின் விருப்பம் நிறைவேறட்டும்” என்றோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: அவர் இணங்காததால்
  rationale: இந்தத் தனிநிலை வேற்றுமைத் தொகர், பவுல் அவர்களுடைய வேண்டுகோளுக்கு இணங்காத சூழ்நிலையைச் சுட்டுகிறது. ‘இணங்காததால்’ என்பது அவரைச் சம்மதிக்க வைக்க முடியாத நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘கேட்க மறுத்ததால்’ என்று மொழிபெயர்த்து அர்த்தத்தைத் தேவையின்றிக் குறுக்கவில்லை.
- source_word: ἡσυχάσαμεν
  choice: நாங்கள் அமைதியானோம்
  rationale: இங்கு ἡσυχάζω என்பது தொடர்ந்து வற்புறுத்துவதை நிறுத்தி அமைதியடைதலைக் குறிக்கிறது. இறந்தகால வினையின் தொடக்கத்தன்மையையும் சுருக்கமான மூல நடையையும் இந்தத் தேர்வு காக்கிறது.
- source_word: εἰπόντες
  choice: என்றோம்
  rationale: தமிழில் இயல்பான நேரடி உரை அமைப்புக்காகப் பங்கேற்புவினை வரையறுக்கப்பட்ட வினையாக மொழிபெயர்க்கப்பட்டது; இது அவர்கள் அமைதியானபோது கூறிய சொற்களைத் தெளிவாக இணைக்கிறது.
- source_word: Τοῦ κυρίου
  choice: ஆண்டவரின்
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் இணை ‘ஆண்டவர்.’ கிரேக்கம் குறிப்பிடாதபடி அந்த ஆண்டவர் யார் என்பதை மொழிபெயர்ப்பு வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: τὸ θέλημα
  choice: விருப்பம்
  rationale: θέλημα என்பது ஒருவர் விரும்புவது அல்லது தீர்மானிப்பதைக் குறிக்கிறது. இன்றைய பொதுத் தமிழில் தெளிவாகப் புரியும் ‘விருப்பம்’ தேர்ந்தெடுக்கப்பட்டது; ‘சித்தம்’ போன்ற குறைவாகப் பொதுவான சமயச் சொல்லைத் தவிர்க்கிறது.
- source_word: γινέσθω
  choice: நிறைவேறட்டும்
  rationale: இந்தக் கட்டளை வடிவம் ஆண்டவரின் விருப்பம் நிகழ வேண்டும் என்ற ஒப்புதலை வெளிப்படுத்துகிறது. ‘நிறைவேறட்டும்’ என்பது ‘நடக்கட்டும்’ என்பதைக் காட்டிலும் இந்த விருப்பம்–நிகழ்வு இணைப்பை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: κύριος என்பதன் மொழிபெயர்ப்பும் அதன் குறிப்பீடும்
  choice: ஆண்டவர்
  alternative: எஜமான்; அல்லது ‘இயேசு’ என்று குறிப்பீட்டை வெளிப்படுத்துதல்
  rationale: சூழலில் இது இயேசுவைக் குறிக்கக்கூடும்; எனினும் மூல உரை κύριος என்று மட்டுமே கூறுகிறது. ஆகவே குறிப்பீட்டை விளக்கிச் சேர்க்காமல், பரந்த பொருளைத் தக்கவைக்கும் ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது.
- issue: θέλημα என்பதன் இறையியல் நுட்பம்
  choice: விருப்பம்
  alternative: சித்தம்; திட்டம்
  rationale: ‘திட்டம்’ என்பது முன்னியமிக்கப்பட்ட திட்டத்தை மூலத்தைவிடத் தெளிவாக வலியுறுத்தலாம். ‘விருப்பம்’ ஆண்டவர் விரும்புவது நிகழட்டும் என்ற உரையின் சமர்ப்பண மனப்பான்மையைத் தருகிறது; அதன் இயல்பைப் பற்றி மேலதிகக் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நடை நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ். மூலத்தின் சுருக்கமும் சமர்ப்பணத் தொனியும் காக்கப்பட்டுள்ளன. நேரடி உரைக்கு முன் தனி வாக்கியம் பயன்படுத்தப்பட்டது; இது தமிழில் தெளிவாகவும் இயல்பாகவும் ஒலிக்கிறது.
