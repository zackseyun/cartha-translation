source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: ta
  text: சீடர்களைத் தேடிக்கண்டுபிடித்து, அங்கே ஏழு நாட்கள் தங்கினோம். அவர்கள் ஆவியினால்[a] பவுலிடம், எருசலேமுக்குப் போக வேண்டாம் என்று சொல்லிக்கொண்டே இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆவியின் மூலம்.’ வரவிருந்த துன்பத்தை ஆவி வெளிப்படுத்தியதிலிருந்து, பவுல் எருசலேமுக்குப் போகக் கூடாது என்று சீடர்கள் முடிவுசெய்திருக்கலாம்; இந்தச் சொற்றொடர் அந்த வாய்ப்பை மறுப்பதில்லை.
    reason: மாற்று மொழிபெயர்ப்பையும், ஆவி அளித்த வெளிப்பாட்டுக்கும் சீடர்கள் கூறிய தடைக்கும் இடையிலான உண்மையான விளக்கத் தெளிவின்மையையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἀνευρόντες
  choice: கண்டுபிடித்த பின்பு
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது. இந்தத் தேர்வு நிகழ்வுகளின் வரிசையை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: μαθητάς
  choice: சீடர்களை
  rationale: அப்போஸ்தலர் நடபடிகளில் μαθητής என்பதற்கான நிலையான, பொருத்தமான தமிழ் சொல்; ‘விசுவாசிகள்’ என்பதைவிட மூலச்சொல்லின் தனித்த பொருளைப் பேணுகிறது.
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: அங்கே ... தங்கினோம்
  rationale: ἐπιμένω இங்கு தங்கியிருத்தலைக் குறிக்கிறது; αὐτοῦ இடத்தைக் குறிக்கும் வினையடையாக ‘அங்கே’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: ἡμέρας ἑπτά
  choice: ஏழு நாட்கள்
  rationale: கால அளவைக் குறிக்கும் வேற்றுமை வடிவத்தைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: முந்தைய ‘சீடர்கள்’ என்பவர்களையே சுட்டுகிறது. புதிய தமிழ் வாக்கியத்தின் தொடக்கத்தில் ‘அவர்கள்’ என்பது இயல்பாக உள்ளது.
- source_word: ἔλεγον
  choice: தொடர்ந்து சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சை உணர்த்துகிறது.
- source_word: διὰ τοῦ πνεύματος
  choice: ஆவியின் மூலமாக
  rationale: διά உடன் வரும் இத்தொடர் வழிமுறை அல்லது செயற்பாட்டு முகவரைக் குறிக்கிறது. மூலத்தில் ‘பரிசுத்த’ என்ற அடைமொழி இல்லாததால் அதைச் சேர்க்காமல், அப்போஸ்தலர் நடபடிகளின் சூழலில் ஆவியைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μὴ ἐπιβαίνειν
  choice: போக வேண்டாம்
  rationale: எருசலேமை நோக்கிய பயணச் சூழலில் ἐπιβαίνω இலக்கை நோக்கிச் செல்வதைக் குறிக்கிறது. தமிழில் ‘மேலே போக வேண்டாம்’ என்பது இயல்பற்றதாகவோ தவறாக இடவியல் பொருள் தரக்கூடியதாகவோ இருப்பதால், இலக்கைத் தெளிவாகக் காட்டும் இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமுக்கு
  rationale: இலக்கைச் சுட்டும் εἰς என்பதற்கு இயல்பான தமிழ் நான்காம் வேற்றுமை வடிவம்.
theological_decisions:
- issue: διὰ τοῦ πνεύματος என்ற சொற்றொடர் பவுலின் பயணத்துடன் எவ்வாறு தொடர்புபடுகிறது
  choice: ஆவியின் மூலமாக
  alternative: ஆவியினால்
  rationale: சீடர்கள் பவுலிடம் ஆவியின் மூலமாகப் பேசினார்கள் என்ற மூலவாக்கியத்தை இத்தேர்வு நேரடியாகப் பேணுகிறது. ஆவி பயணத்தைத் தடைசெய்தாரா, அல்லது வரவிருந்த துன்பத்தை வெளிப்படுத்தியதால் சீடர்கள் போக வேண்டாம் என்ற முடிவுக்கு வந்தார்களா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை; அப்போஸ்தலர் 19:21; 20:22–23 உடனான பதற்றமும் அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘தொடர்ந்து சொல்லிக்கொண்டிருந்தார்கள்’ என்பது கிரேக்க முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்ச்சியை வெளிப்படுத்துகிறது. ‘போக வேண்டாம்’ இயல்பான தமிழாக இருப்பதுடன், எருசலேமுக்குச் ‘செல்லுதல்/மேலே செல்லுதல்’ என்ற பயணப் பொருளையும் சூழல் மூலம் தக்கவைக்கிறது.
