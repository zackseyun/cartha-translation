  source_fidelity: மூலக் கிரேக்கத்தின் தலைப்புமாற்றம், நம்பிக்கை கொண்ட புற இனத்தவரைக் குறித்தல், அனுப்புதல், முன் எடுக்கப்பட்ட தீர்மானம், மற்றும் நான்கு உருப்படிகள் அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ἀπεστείλαμεν என்பதன் விடுபட்ட செயப்படுபொருளை முதன்மை உரையில் ‘செய்தி’ என இயல்பாக நிரப்பியிருப்பது சூழலுக்கு ஏற்றது; குறிப்பு கிரேக்கத்தில் பொருள் வெளிப்படையாக இல்லை என்பதையும் சரியாகக் கூறுகிறது.
  naturalness: நடை நவீன பொதுத்தமிழிலும் வேதாகம உரைக்கேற்ற கண்ணியமான பதிவிலும் உள்ளது. நீளமான வாக்கியம் என்றாலும், தடைகளின் பட்டியல் தெளிவாக உள்ளது. ‘தங்களைக் காத்துக்கொள்ள வேண்டும்’ φυλάσσεσθαι என்பதன் தற்சார்பு/விலகியிருக்கும் நுணுக்கத்தை நன்றாகக் காட்டுகிறது.
