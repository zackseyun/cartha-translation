id: ACT.21.25
reference: Acts 21:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: ta
  text: ஆனால், நம்பிக்கை கொண்ட பிற இனத்தவரைக் குறித்து, அவர்கள் சிலைகளுக்குப் படைக்கப்பட்டவை, இரத்தம், கழுத்து நெரித்துக் கொல்லப்பட்டவை[b], பாலியல் ஒழுக்கக்கேடு ஆகியவற்றிலிருந்து தங்களைக் காத்துக்கொள்ள வேண்டும் என்று முடிவுசெய்து, நாங்கள் செய்தி அனுப்பினோம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல் ‘நாங்கள் அனுப்பினோம்’; எதை அனுப்பினார்கள் என்பது வெளிப்படையாகக் கூறப்படவில்லை. சூழல் அப்போஸ்தலர் 15-இல் அனுப்பப்பட்ட கடிதத்தையோ தீர்மானத்தையோ சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, இரத்தம் வடிக்கப்படாமல் கழுத்து நெரிக்கப்பட்டு அல்லது மூச்சுத்திணறச் செய்யப்பட்டுக் கொல்லப்பட்ட விலங்குகள்.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ δὲ
  choice: ஆனால், … குறித்து
  rationale: περί தலைப்பை அறிமுகப்படுத்துகிறது; δέ முந்தைய கருத்திலிருந்து மென்மையான மாறுதலையோ வேறுபாட்டையோ காட்டுகிறது. இவை இரண்டையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: நம்பிக்கை கொண்ட பிற இனத்தவர்
  rationale: πεπιστευκότων என்பது நம்பிக்கை கொண்டவர்களாகத் தொடரும் நிலையைக் குறிக்கிறது; ἐθνῶν இச்சூழலில் யூதரல்லாத பிற இனத்தவரைக் குறிக்கிறது. ‘பிற இனத்தவர்’ என்பது தேவையற்ற விளக்கத்தைச் சேர்க்காமல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: நாங்கள் செய்தி அனுப்பினோம்
  rationale: வலியுறுத்தப்பட்ட ἡμεῖς என்பதற்காக ‘நாங்கள்’ வெளிப்படையாக வைக்கப்பட்டுள்ளது. ἀπεστείλαμεν என்பதன் செயப்படுபொருள் கிரேக்கத்தில் கூறப்படாததால், அப்பொருள் ஒரு கடிதமே என்று முதன்மை உரையில் கட்டுப்படுத்தாமல் ‘செய்தி அனுப்பினோம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κρίναντες
  choice: முடிவுசெய்து
  rationale: கலந்தாலோசித்து எடுக்கப்பட்ட தீர்மானத்தையும், அந்த முடிவு அனுப்பும் செயலுக்கு முன்னதாக இருந்ததையும் இயல்பாகக் காட்டுகிறது.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: அவர்கள் … தங்களைக் காத்துக்கொள்ள வேண்டும்
  rationale: நடுவினை வடிவிலுள்ள தம்மைத் தாமே காத்துக்கொள்ளும் நுணுக்கத்தையும், பட்டியலிடப்பட்டவற்றிலிருந்து விலகியிருக்கும் கருத்தையும் பாதுகாக்கிறது.
- source_word: τό τε εἰδωλόθυτον
  choice: சிலைகளுக்குப் படைக்கப்பட்டவை
  rationale: சிலை வழிபாட்டில் பலியாகப் படைக்கப்பட்ட உணவு அல்லது இறைச்சியைச் சுட்டும் சொல்லை, ‘உணவு’ என்று தேவையின்றிக் குறுக்காமல் வாசிக்கத்தக்க தமிழில் தருகிறது.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: மூலத்தின் சுருக்கமான சொல்லாக்கத்தை நேரடியாகப் பாதுகாக்கிறது; இச்சூழலில் அதன் உட்கொள்ளுதலே கருத்தாக இருந்தாலும் அதை முதன்மை உரையில் விரிவுபடுத்தவில்லை.
- source_word: πνικτόν
  choice: கழுத்து நெரித்துக் கொல்லப்பட்டவை
  rationale: இரத்தம் வடிக்கப்படாமல் மூச்சுத்திணறச் செய்து அல்லது கழுத்தை நெரித்துக் கொல்லப்பட்ட விலங்கைக் குறிக்கும் சொல்லைத் தெளிவாகவும் பட்டியலின் இணை அமைப்பைத் தக்கவைத்தும் தருகிறது.
- source_word: πορνείαν
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: πορνεία குறிக்கும் முறைகேடான பாலியல் நடத்தையின் விரிந்த பொருளை, திருமணத்திற்கு முந்தைய உறவுக்கு மட்டும் குறுக்காமல் நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: அப்போஸ்தலர் தீர்மானத்தில் உள்ள நான்கு தடைகளின் தன்மையும் காலவரம்பும்
  choice: நான்கு தடைகளையும் உரையில் உள்ளபடியே நேரடியாகக் கூறி, அவற்றின் காரணத்தையோ காலவரம்பையோ தீர்மானிக்காமல் விடுதல்
  alternative: இவை தற்காலிகமான பந்தி உறவுக்கான சலுகைகள் என்றோ, எல்லாக் காலத்திற்குமான உலகளாவிய கட்டளைகள் என்றோ முதன்மை உரையிலேயே விளக்குதல்
  rationale: இந்த வசனம் முந்தைய தீர்மானத்தின் உள்ளடக்கத்தை மீண்டும் கூறுகிறது; ஒவ்வொரு தடையின் முழுத் தெய்வவியல் காரணத்தையோ நீடிப்பையோ விளக்கவில்லை. எனவே எந்தச் சமயப் பிரிவின் முடிவையும் மொழிபெயர்ப்பில் புகுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘புறவினத்தார்’ போன்ற வாசகர்களுக்கு அரிதாக இருக்கக்கூடிய மரபுச் சொல்லுக்குப் பதிலாக ‘பிற இனத்தவர்’ பயன்படுத்தப்பட்டுள்ளது. வாக்கியத்தின் நீளம் மூலத்தின் ஒரே வாக்கிய அமைப்பைத் தக்கவைத்தாலும், பட்டியல் தெளிவாக வாசிக்குமாறு தமிழ்ச் சொல் வரிசை அமைக்கப்பட்டுள்ளது.
