  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: ta
  text: அப்படியானால், என்ன செய்வது?[a] நீர் வந்திருப்பதை அவர்கள் நிச்சயமாகக் கேள்விப்படுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘அப்படியானால், அது என்ன?’ இச்சூழ்நிலையில் என்ன செய்ய வேண்டும் என்று கிரேக்க மரபுத்தொடர் கேட்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: அப்படியானால், என்ன செய்வது?
  rationale: சொல்லுக்குச் சொல் ‘அப்படியானால், அது என்ன?’ என இருந்தாலும், சூழ்நிலையில் அடுத்து என்ன செய்ய வேண்டும் என்று கேட்கும் கிரேக்க மரபுத்தொடரின் நடைமுறைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πάντως
  choice: நிச்சயமாக
  rationale: அடுத்து நிகழப்போவது உறுதி என்பதை இந்த வினையடை வலியுறுத்துகிறது.
- source_word: ἀκούσονται
  choice: அவர்கள் ... கேள்விப்படுவார்கள்
  rationale: எதிர்கால நடுவினை வடிவம் இங்கு செயப்பாட்டு பொருளில் ‘அவர்கள் கேள்விப்படுவார்கள்’ எனப் பொருள்படுகிறது; எழுவாய் சூழலிலிருந்து பெறப்படுகிறது.
- source_word: ὅτι
  choice: '... என்பதை'
  rationale: இது காரணத்தைக் குறிக்காமல், அவர்கள் கேள்விப்படும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: ἐλήλυθας
  choice: நீர் வந்திருப்பதை
  rationale: நிறைவுக்கால வடிவம் பவுலின் வருகையால் ஏற்பட்டுள்ள தற்போதைய நிலையைச் சுட்டுகிறது; ‘வந்தீர்’ என்பதைவிட ‘வந்திருப்பதை’ அந்த அம்சத்தை நன்கு காக்கிறது.
