  register: நவீன பொதுத்தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவர்களோ’ என்பது கிரேக்கத்தில் உள்ள எதிர்மறை நகர்வை—நாங்கள் கப்பலில் ஏறினோம், அவர்களோ திரும்பினர்—இயல்பாக வெளிப்படுத்துகிறது.
