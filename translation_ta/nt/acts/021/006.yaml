base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: ta
  text: நாங்கள் ஒருவருக்கொருவர் விடைபெற்ற பின்பு[a], கப்பலில் ஏறினோம்; அவர்களோ தங்கள் வீடுகளுக்குத்[b] திரும்பிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவரிடமிருந்து ஒருவர் விடைபெற்ற பின்பு.” கிரேக்கச் சொற்றொடர் சந்திக்கும்போது வாழ்த்துவதையோ பிரியும்போது விடைபெறுவதையோ குறிக்கலாம்; இங்கு புறப்படும் சூழல் விடைபெறும் பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “தங்களுக்குரியவற்றுக்கு” அல்லது “தங்களுக்குரிய இடங்களுக்கு”; இது “தங்கள் வீடுகளுக்கு” அல்லது “தங்கள் சொந்த இடத்திற்கு” என்று பொருள்படும் ஒரு மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: ஒருவருக்கொருவர் விடைபெற்ற பின்பு
  rationale: இந்தக் கிரேக்கச் சொற்றொடர் சந்திப்பின்போதான வாழ்த்தையோ பிரிவின்போதான விடைபெறுதலையோ குறிக்கலாம். இங்கு பிரிந்து புறப்படும் சூழல் இருப்பதால், ‘விடைபெற்ற’ என்பது இயல்பான பொருள்.
- source_word: ἐνέβημεν
  choice: கப்பலில் ஏறினோம்
  rationale: இந்தச் சூழலில் வினைச்சொல் ஒரு கப்பலுக்குள் செல்வதை, அதாவது அதில் ஏறுவதை, நேரடியாகக் குறிக்கிறது.
- source_word: πλοῖον
  choice: கப்பல்
  rationale: இச்சொல் படகையோ கப்பலையோ குறிக்கக்கூடும்; அப்போஸ்தலர் பணிகளில் வரும் கடற்பயணச் சூழலுக்கு ‘கப்பல்’ பொருத்தமானதும் வழக்கமானதும் ஆகும்.
- source_word: ὑπέστρεψαν
  choice: திரும்பிச் சென்றார்கள்
  rationale: முன்பிருந்த இடத்திற்குத் திரும்பிச் செல்வதைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: εἰς τὰ ἴδια
  choice: தங்கள் வீடுகளுக்கு
  rationale: சொல்லுக்கு சொல் ‘தங்களுக்குரியவற்றுக்கு/இடங்களுக்கு’ என இருந்தாலும், இந்த மரபுத்தொடர் ஒருவருடைய சொந்த இடத்தை அல்லது வீட்டைக் குறிக்கிறது. சூழலில் ‘தங்கள் வீடுகளுக்கு’ என்பது தெளிவான இயல்பான தமிழ்.
