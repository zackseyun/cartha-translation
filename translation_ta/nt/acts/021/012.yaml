source:
  edition: SBLGNT
  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: ta
  text: இவற்றைக் கேட்டபோது, நாங்களும் அங்குள்ள மக்களும் அவர் எருசலேமுக்கு ஏறிச்செல்ல வேண்டாம் என்று வற்புறுத்தினோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வற்புறுத்தினோம்” என்பதற்கு “வேண்டிக்கொண்டோம்” அல்லது “மன்றாடினோம்” என்றும் மொழிபெயர்க்கலாம்; இவ்வினைச்சொல் தீவிரமான வேண்டுகோளையும் குறிக்கலாம்.
    reason: παρεκαλοῦμεν என்பதன் வேண்டுகோள், வலியுறுத்தல் ஆகிய நுணுக்கங்களுக்கான சொல்வழி மாற்று.
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: இவற்றைக் கேட்டபோது
  rationale: ὡς என்பதன் காலத்தொடர்பையும் ταῦτα என்பதன் பன்மையையும் இயல்பான நவீன தமிழில் காக்கிறது; δέ இங்கு மென்மையான உரைநடை நகர்வாக இருப்பதால் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: παρεκαλοῦμεν
  choice: வற்புறுத்திக் கேட்டுக்கொண்டோம்
  rationale: παρακαλέω இச்சூழலில் அறிவுரை கூறுதல் மட்டுமல்லாமல் தீவிரமாக வேண்டிக்கொள்ளுதல் அல்லது வலியுறுத்துதல் என்ற பொருளையும் தருகிறது. இறந்தகால முற்றுப்பெறா வடிவத்தின் தொடர்ச்சியான முயற்சியை ‘கேட்டுக்கொண்டோம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: நாங்களும் அங்கிருந்த மக்களும்
  rationale: கதைசொல்லியின் குழுவும் அந்த இடத்து மக்களும் என இரு குழுக்களும் சேர்ந்து வேண்டியதை τε καὶ அமைப்பு காட்டுகிறது. ‘அங்கிருந்த மக்கள்’ என்பது ἐντόπιοι என்பதற்கான தெளிவான இயல்பான தமிழ்.
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: அவரை … போக வேண்டாம் என்று
  rationale: வேண்டுகோளின் உள்ளடக்கம் பவுல் செல்லக்கூடாது என்பதே. αὐτόν என்பதைக் ‘அவரை’ என வெளிப்படையாகக் காக்கிறது.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமுக்கு
  rationale: இலக்கைக் குறிக்கும் இயல்பான தமிழ் வடிவம். ἀναβαίνειν என்பதிலுள்ள ‘மேலே செல்லுதல்’ என்ற திசைமரபை முதன்மை உரையில் இயல்புக்காக ‘போகுதல்’ எனக் கொடுத்து, அடிக்குறிப்பில் பதிவு செய்கிறது.
theological_decisions:
- issue: எருசலேமுக்குச் செல்லுவதற்கான திசைமரபு
  choice: எருசலேமுக்குப் போக
  alternative: எருசலேமுக்கு ஏறிப்போக
  rationale: ἀναβαίνειν சொற்படியாக ‘மேலே செல்லுதல்/ஏறிப்போகுதல்’ என்றும், எருசலேமுக்குச் செல்வதற்கான வழக்கமான திசைச் சொல்லாகவும் உள்ளது. நவீன தமிழில் ‘ஏறிப்போக’ என்பது தவறாக உடல்சார்ந்த ஏற்றத்தை முன்னிறுத்தக்கூடும்; எனவே இயல்பான வாசிப்பை முதன்மை உரையில் வைத்து, மூலத்தின் நுணுக்கத்தை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘வற்புறுத்திக் கேட்டுக்கொண்டோம்’ என்பது வேண்டுகோளின் தீவிரத்தையும் தொடர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது; உணர்ச்சியின் அளவை உறுதியாக நிர்ணயிக்காமல் மாற்று நுணுக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
