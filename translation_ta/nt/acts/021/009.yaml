  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: ta
  text: அவருக்குத் தீர்க்கதரிசனம் உரைத்துவந்த கன்னியரான நான்கு மகள்கள் இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கன்னியரான’ என்பதை ‘திருமணமாகாத’ என்றும் மொழிபெயர்க்கலாம்.
    reason: παρθένοι என்ற சொல் நேரடியாகக் கன்னியரைக் குறித்தாலும், இச்சூழலில் திருமணமாகாத பெண்கள் என்ற சமூக நிலையையும் உணர்த்தலாம்.
lexical_decisions:
- source_word: τούτῳ
  choice: அவருக்கு
  rationale: உடனடி சூழலில் இது பிலிப்பைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயர்; தமிழில் முந்தைய நபரை இயல்பாகச் சுட்டுவதற்கு ‘அவருக்கு’ பொருத்தமானது.
- source_word: δὲ
  choice: தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான தொடர்ச்சியைச் சுட்டும் இடைச்சொல்; தமிழில் வாக்கிய ஓட்டமே அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἦσαν
  choice: இருந்தார்கள்
  rationale: τούτῳ ... ἦσαν என்ற உடைமைப் பொருளுள்ள அமைப்பு தமிழில் ‘அவருக்கு ... இருந்தார்கள்’ என்று இயல்பாக அமைகிறது; மகள்களைக் குறிப்பதால் மரியாதை/மனிதப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: θυγατέρες
  choice: மகள்கள்
  rationale: குடும்ப உறவைக் குறிக்கும் நேரான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: τέσσαρες
  choice: நான்கு
  rationale: ‘மகள்கள்’ என்பதைக் குறிக்கும் எண்ணுப்பெயரின் நேரான மொழிபெயர்ப்பு.
- source_word: παρθένοι
  choice: கன்னியரான
  rationale: இச்சொல்லின் நேரடியான பொருளான கன்னித்தன்மையைப் பாதுகாக்கிறது; அதனுடன் தொடர்புடைய திருமணமாகாத சமூக நிலையையும் அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: προφητεύουσαι
  choice: தீர்க்கதரிசனம் உரைத்துவந்த
  rationale: நிகழ்காலச் செயப்பெயரெச்சம் மகள்களை விவரித்து, அவர்களின் தொடர்ந்த அல்லது வழக்கமான தீர்க்கதரிசனச் செயல்பாட்டைக் குறிக்கிறது; ‘உரைத்துவந்த’ அந்த நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பெண்களின் தீர்க்கதரிசனச் செயல்பாட்டை எவ்வாறு வெளிப்படுத்துவது
  choice: தீர்க்கதரிசனம் உரைத்துவந்த
  alternative: தீர்க்கதரிசனம் உரைத்தார்கள்
  rationale: மூலவாக்கியம் அவர்களின் செயலை எவ்வித விளக்கமோ வரம்போ இன்றி நிகழ்காலச் செயப்பெயரெச்சத்தால் குறிப்பிடுகிறது. மொழிபெயர்ப்பு அதை அப்படியே பாதுகாத்து, அவர்களின் பங்கு அல்லது அதிகாரம் குறித்து மேலதிகக் கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: παρθένοι என்பதன் மொழிபெயர்ப்பு
  choice: கன்னியரான
  alternative: திருமணமாகாத
  rationale: ‘கன்னியர்’ என்பது மூலச்சொல்லின் நேரடியான பொருளைத் தெளிவாகக் காக்கிறது. ‘திருமணமாகாத’ என்பது சாத்தியமான சமூகப் பொருளை மட்டும் முன்னிறுத்தக்கூடும்; அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது. கன்னித்தன்மைக்கும் தீர்க்கதரிசனச் செயலுக்கும் இடையே வசனம் கூறாத எந்த இறையியல் தொடர்பும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘தீர்க்கதரிசனம் உரைத்துவந்த’ என்பது திருச்சபைச் சூழலில் புரிந்துகொள்ளத்தக்க சொற்றொடராக இருந்து, கிரேக்க நிகழ்காலச் செயப்பெயரெச்சத்தின் தொடர்ச்சியான பண்பையும் காக்கிறது.
