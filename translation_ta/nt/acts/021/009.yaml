  source_fidelity: மூலத்தின் உடைமை அமைப்பு (‘அவருக்கு ... இருந்தார்கள்’), எண்ணிக்கை, ‘மகள்கள்,’ παρθένοι என்பதன் நேரடியான ‘கன்னியர்’ பொருள், மற்றும் προφητεύουσαι என்பதன் தொடர்ச்சியான/வழக்கமான செயல் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘தீர்க்கதரிசனம் உரைத்துவந்த’ என்பது நிகழ்காலப் பெயரெச்சத்தின் பண்புவிளக்கச் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
