  terminology: ‘கன்னியரான’ என்பது παρθένοι-க்கு நேரான, பொருத்தமான இணை. மாற்று சமூகப் பொருளான ‘திருமணமாகாத’ அடிக்குறிப்பில் கவனமாக வழங்கப்பட்டுள்ளது. ‘தீர்க்கதரிசனம் உரைத்துவந்த’ திருவிவிலியப் பயன்பாட்டிலும் நவீன வாசகத்திலும் புரிந்துகொள்ளத்தக்கது.
