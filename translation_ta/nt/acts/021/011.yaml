id: ACT.21.11
reference: Acts 21:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: ta
  text: அவன் எங்களிடம் வந்து, பவுலின் இடைக்கச்சையை எடுத்து, தன் கால்களையும் கைகளையும் கட்டிக்கொண்டு, “பரிசுத்த ஆவியானவர் இவ்வாறு கூறுகிறார்:[a] ‘இந்த இடைக்கச்சை யாருடையதோ, அந்த மனிதனை எருசலேமில் உள்ள யூதர்கள் இவ்வாறே கட்டி, யூதரல்லாதவர்களின் கைகளில் ஒப்படைப்பார்கள்’” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஆவியானவர் கூறுவது இதுவே.”
    reason: alternative_reading
lexical_decisions:
- source_word: ζώνην
  choice: இடைக்கச்சை
  rationale: ζώνη என்பது இடுப்பைச் சுற்றி அணியும் பட்டை அல்லது கச்சையைக் குறிக்கிறது. பண்டைய சூழலுக்கு ‘இடைக்கச்சை’ பொருத்தமாகவும் இன்றைய வாசகருக்குப் புரியத்தக்கதாகவும் உள்ளது.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: தன் கால்களையும் கைகளையும் கட்டிக்கொண்டு
  rationale: ἑαυτοῦ என்பது செயலைச் செய்த அகபுவையே திரும்பச் சுட்டுகிறது; ஆகவே அவன் பவுலைக் கட்டவில்லை, தன்னையே அடையாளச் செயலாகக் கட்டிக்கொண்டான். ‘கட்டிக்கொண்டு’ என்பது இந்தத் தற்சுட்டுச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Τάδε λέγει
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசன அறிவிப்பின் அதிகாரமிக்க தொனியைத் தக்கவைத்தபடியே, நவீன தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியானவர்
  rationale: தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற, மதிப்புமிக்க சமகாலப் பெயர்ப்பு.
- source_word: Τὸν ἄνδρα
  choice: அந்த மனிதனை
  rationale: இடைக்கச்சையின் உரிமையாளரைக் குறிப்பாகச் சுட்டும் ὁ ἀνήρ என்பதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: இந்த இடைக்கச்சை யாருடையதோ
  rationale: உரிமை உறவைத் துல்லியமாக வைத்திருப்பதோடு, கிரேக்க வாக்கிய அமைப்பின் சுருக்கமான தீர்க்கதரிசனத் தொனியையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: οὕτως
  choice: இவ்வாறே
  rationale: அகபு செய்த அடையாளச் செயலுக்கும் தொடர்ந்து வரும் முன்னறிவிப்புக்கும் உள்ள நேரடி தொடர்பை வெளிப்படுத்துகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: எருசலேமில் உள்ள யூதர்கள்
  rationale: கிரேக்கம் ‘யூதர்கள்’ என்றே கூறுகிறது; ‘தலைவர்கள்’ போன்ற கூடுதல் வரையறையைச் சேர்க்காமல், ἐν Ἰερουσαλήμ என்ற இடத்தொடர்பை இயல்பாக இணைக்கிறது.
- source_word: παραδώσουσιν
  choice: ஒப்படைப்பார்கள்
  rationale: ஒருவரை வேறொரு குழுவின் அதிகாரத்திற்குக் கையளிப்பதை παραδίδωμι இங்கு குறிக்கிறது; ‘ஒப்படைப்பார்கள்’ அதனை இயல்பாகத் தெரிவிக்கிறது.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: யூதரல்லாதவர்களின் கைகளில்
  rationale: ἐθνῶν இச்சூழலில் யூதரல்லாத மக்களைக் குறிக்கிறது. ‘கைகளில்’ என்ற உருவகத்தைப் பாதுகாப்பதால் அவர்களின் அதிகாரத்திற்குள் ஒப்படைக்கப்படுதல் வெளிப்படுகிறது.
theological_decisions:
- issue: ஆவியானவரின் நேரடி தீர்க்கதரிசன அறிவிப்பாக Τάδε λέγει என்பதை மொழிபெயர்த்தல்
  choice: பரிசுத்த ஆவியானவர் கூறுவது இதுவே
  alternative: பரிசுத்த ஆவியானவர் இவ்வாறு கூறுகிறார்
  rationale: மூலத்தின் தீர்க்கதரிசனச் சூத்திரத்தையும் அதன் அதிகாரக் கோரிக்கையையும் காக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் எதையும் சேர்க்கவில்லை.
- issue: ἑαυτοῦ என்பதன் சுட்டுப்பொருள்
  choice: அகபு தன் கால்களையும் கைகளையும் கட்டிக்கொண்டான்
  alternative: அகபு பவுலின் கால்களையும் கைகளையும் கட்டினான்
  rationale: தற்சுட்டுப் பெயர்ச்சொல் இயல்பாகப் பங்கேற்பு வினையின் எழுவாயான அகபுவையே சுட்டுகிறது. இதனால் நிகழ்வு பவுலுக்கான அடையாளச் செயலாக உள்ளது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழாகவும், தீர்க்கதரிசன அறிவிப்புக்கேற்ற கண்ணியமான தொனியுடனும் அமைக்கப்பட்டுள்ளது. ‘இடைக்கச்சை’ பண்டைய உடைச்சூழலைத் தக்கவைக்கிறது; ‘யூதரல்லாதவர்கள்’ என்பது ἔθνη என்பதைக் குழப்பமின்றி விளக்குகிறது. மூலத்தில் இல்லாத ‘யூதத் தலைவர்கள்’ போன்ற வரையறை சேர்க்கப்படவில்லை.
