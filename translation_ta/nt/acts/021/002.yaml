  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: ta
  text: பெனிக்கேக்குக் கடந்து செல்லும் ஒரு கப்பலைக் கண்டு, அதில் ஏறிப் புறப்பட்டோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெனிக்கேக்குச் செல்லவிருந்த ஒரு கப்பல்.” கிரேக்கச் சொற்றொடர் சொற்படியாக, “பெனிக்கேக்குக் கடந்து செல்லும்” கப்பலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: கண்டு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்புச் சொல்லை, தமிழில் இயல்பான வினையெச்சமாக மொழிபெயர்க்கிறது; ‘பின்பு’ நிகழ்வுகளின் வரிசையைத் தெளிவாக்குகிறது.
- source_word: πλοῖον
  choice: ஒரு கப்பலை
  rationale: மத்தியதரைக் கடல் பயணத்திற்குரிய கடல்வழிப் போக்குவரத்து சாதனத்தை இயல்பாகக் குறிக்கும் சொல்.
- source_word: διαπερῶν εἰς Φοινίκην
  choice: பெனிக்கேயாவுக்குக் கடந்து செல்லும்
  rationale: இலக்கை நோக்கிக் கடலைக் கடக்கும் கப்பலின் பயணத்தை மூலத்தின் பங்கேற்பு வடிவத்துக்கு நெருக்கமாகப் பாதுகாக்கிறது; வெறுமனே ‘செல்லவிருந்த’ என்று இலக்கை மட்டும் குறிப்பிடவில்லை.
- source_word: ἐπιβάντες
  choice: அதில் ஏறி
  rationale: கடற்பயணச் சூழலில் கப்பலில் ஏறுவதைக் குறிக்கிறது; அடுத்த செயலுக்கு முன் நிகழ்ந்ததை இயல்பான தமிழ் வினையெச்சத்தால் தருகிறது.
- source_word: ἀνήχθημεν
  choice: புறப்பட்டோம்
  rationale: கடற்பயணப் பயன்பாட்டில் ‘கடலுக்குப் புறப்படுதல்’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது; சூழலில் கப்பல் ஏற்கெனவே குறிப்பிடப்பட்டிருப்பதால் ‘கப்பலில் புறப்பட்டோம்’ என மீண்டும் கூறத் தேவையில்லை.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பயண நிகழ்வுகளின் தொடரைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது. ‘பெனிக்கேயா’ என்பது Φοινίκη என்ற இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
