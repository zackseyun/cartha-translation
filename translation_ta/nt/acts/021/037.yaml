translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவான அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பவுல் அதிகாரியிடம் மரியாதையாகப் பேசுவதால் “உங்களிடம்” என்றும், அதிகாரி பவுலிடம் மேலதிகாரத் தொனியில் பேசுவதால் “உனக்கு” என்றும் வேறுபடுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள செயப்பாட்டு வடிவமும் அனுமதி கேட்கும் நுணுக்கமும் பேணப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் இடம் மாறியிருந்ததால், தமிழில் அவை பொருந்தும் சொற்றொடர்களோடு சரியாக இணைக்கப்பட்டுள்ளன.
