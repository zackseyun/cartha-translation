source:
  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: ta
  text: பவுல் படைவீரர் தங்குமிடத்துக்குள்[c] கொண்டுபோகப்படவிருந்தபோது, படைத்தளபதியிடம்[b], “நான் உங்களிடம் ஒன்று சொல்ல அனுமதி உண்டா?[a]” என்று கேட்டார். அதற்கு அவர், “உனக்குக் கிரேக்க மொழி தெரியுமா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது இன்னும் இயல்பாக, “நான் உங்களிடம் ஒன்று சொல்லலாமா?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “படை அதிகாரி.” கிரேக்கச் சொல் ஒரு ரோமப் படை அதிகாரியைக் குறிக்கிறது; மரபாக இது “திரிபியூன்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: cultural_note
  - marker: c
    text: “படைவீரர் தங்குமிடம்” என்பது ரோமப் படையினருக்கான தங்குமிடத்தைக் குறிக்கிறது; இது கோட்டை வளாகத்துக்குள் இருந்திருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: கொண்டுபோகப்படவிருந்தபோது
  rationale: μέλλω தெரிவிக்கும் உடனடி எதிர்நிலையையும், εἰσάγεσθαι என்பதன் செயப்பாட்டு வடிவத்தையும் காக்கிறது; பங்கேற்பு அமைப்பு தமிழில் இயல்பான காலத் துணைவாக்கியமாக மாற்றப்பட்டுள்ளது.
- source_word: παρεμβολή
  choice: படைத் தங்குமிடம்
  rationale: எருசலேமின் இந்தச் சூழலில் பொதுவான முகாமைவிட ரோமப் படையினரின் தங்குமிடம் அல்லது கோட்டை வளாகத்திலுள்ள படைப்பகுதியைக் குறிக்கிறது. இச்சொல் நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: χιλίαρχος
  choice: படைத்தளபதி
  rationale: ரோமப் படையின் உயர்நிலை அதிகாரியைச் சுட்டுகிறது. ‘ஆயிரத்தலைவர்’ என்பது சொல்லுக்குச் சொல் வடிவமானாலும் பதவியின் வரலாற்றுப் பொருளைத் தவறாகத் துல்லியப்படுத்தக்கூடும்; ‘படைத்தளபதி’ இயல்பான பொதுச் சமமான சொல்.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: நான் உங்களிடம் ஒன்று சொல்ல அனுமதி உண்டா?
  rationale: ἔξεστιν என்பதன் அனுமதி சார்ந்த பொருளையும் மரியாதையான கேள்வித் தொனியையும் காக்கிறது. கிரேக்கத்தின் நிபந்தனைத் தோற்றத்தைத் தமிழில் செயற்கையாகப் பிரதிபலிக்காமல், நேரடிக் கேள்வியாக இயல்புபடுத்துகிறது.
- source_word: τι
  choice: ஒன்று
  rationale: இச்சூழலில் ‘ஏதாவது ஒன்று’ அல்லது ‘ஒரு விஷயம்’ என்ற பொருள்; ‘ஒன்று’ சுருக்கமாகவும் பேச்சில் இயல்பாகவும் உள்ளது.
- source_word: Ἑλληνιστί
  choice: கிரேக்க மொழி
  rationale: ‘கிரேக்கத்தில்/கிரேக்க மொழியில்’ என்ற பொருளை, γινώσκεις உடன் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γινώσκεις
  choice: தெரியுமா
  rationale: அடிப்படையான ‘அறிதல்’ பொருளைப் பேணுகிறது; மொழிச் சூழலில் பேச அல்லது புரிந்துகொள்ளும் அறிவையும் இயல்பாக உள்ளடக்குகிறது.
