id: ACT.21.17
reference: Acts 21:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα ἀσμένως ⸀ἀπεδέξαντο ἡμᾶς οἱ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: ta
  text: நாங்கள் எருசலேமுக்கு வந்தபோது, சகோதரர்கள்[a] எங்களை மகிழ்ச்சியுடன் வரவேற்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகள்’; கிரேக்கத்தில் ‘சகோதரர்கள்’ என்று உள்ளது. இச்சொல் சக விசுவாசிகள் அனைவரையும் விரிவாகக் குறிக்கவும் முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα
  choice: நாங்கள் எருசலேமுக்கு வந்தபோது
  rationale: இங்குள்ள genitive absolute காலச் சூழலைக் குறிக்கிறது; εἰς இலக்கைச் சுட்டுகிறது. இந்தத் தமிழ் வடிவம் இரண்டையும் இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀσμένως
  choice: மகிழ்ச்சியுடன்
  rationale: வரவேற்பில் இருந்த மகிழ்ச்சியையும் மனமுவந்த தன்மையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἀπεδέξαντο
  choice: வரவேற்றார்கள்
  rationale: இச்சூழலில் மனிதர்களை அன்போடு ஏற்றுக்கொள்வதைக் குறிக்கிறது; பொதுவான ‘ஏற்றுக்கொண்டார்கள்’ என்பதைவிட விருந்தோம்பல் சார்ந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: οἱ ἀδελφοί
  choice: சகோதரர்கள்
  rationale: கிரேக்க மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது; இது விரிவாக சக விசுவாசிகளையும் குறிக்கக்கூடும் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
theological_decisions:
- issue: எருசலேம் கிறிஸ்தவச் சமூகத்தைக் குறிக்கும் ἀδελφοί என்பதன் பாலின வெளிப்பாடு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; விசுவாசிகள்
  rationale: மூலத்தில் ஆண்பால் பன்மையான ἀδελφοί உள்ளது. அதன் வடிவத்தை முதன்மை உரையில் காக்கும் அதே நேரத்தில், ஆரம்பக் கிறிஸ்தவப் பயன்பாட்டில் அது பெண்கள் உட்பட சக விசுவாசிகளை விரிவாகக் குறிக்கக்கூடும் என்ற உண்மையான பொருள் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எருசலேமுக்கு வந்தபோது’ என்பது இலக்கையும் காலத் தொடர்பையும் தெளிவாகக் காட்டுகிறது; ‘மகிழ்ச்சியுடன் வரவேற்றார்கள்’ என்பது மூலத்தின் உளப்பாங்கையும் செயற்பாட்டையும் நேரடியாக வெளிப்படுத்துகிறது.
