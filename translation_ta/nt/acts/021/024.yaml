id: ACT.21.24
reference: Acts 21:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: ta
  text: இவர்களை உன்னுடன் அழைத்துக்கொண்டு, அவர்களோடு நீயும் தூய்மைப்படுத்திக்கொள்; அவர்களுக்காகச் செலவுகளை நீ ஏற்றுக்கொள்; அப்பொழுது அவர்கள் தங்கள் தலைகளைச் சிரைத்துக்கொள்வார்கள். அப்போது, உன்னைப்பற்றி அவர்களுக்கு அறிவிக்கப்பட்டவற்றில்[a] உண்மை எதுவுமில்லை என்றும், நீயும் சட்டத்தைக் கடைப்பிடித்து அதன்படி வாழ்கிறாய்[b] என்றும் எல்லாரும் அறிந்துகொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுக்குப் போதிக்கப்பட்டவற்றில்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ‘போதித்தல்’ அல்லது பொதுவாக ‘அறிவித்தல்’ என்று பொருள்படலாம்; இங்கே அது பவுலைப்பற்றிப் பரவிய தகவல்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “வரிசையில் நடந்து, சட்டத்தைக் கைக்கொள்கிறாய்”; அதாவது, சட்டத்தைக் கடைப்பிடிப்பதற்கு இசைவாக வாழ்கிறாய்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: இவர்களை உன்னுடன் அழைத்துக்கொண்டு
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நான்கு ஆண்களைச் சுட்டும் τούτους என்பதையும், உடன் அழைத்துச் செல்லும் παραλαμβάνω என்பதன் சூழல்சார் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: அவர்களோடு நீயும் தூய்மைப்படுத்திக்கொள்
  rationale: சடங்குசார் தூய்மைப்படுத்தலைக் குறிக்கும் ἁγνίζω என்பதையும், σύν மூலம் வரும் ‘அவர்களோடு’ என்ற இணைப்பையும் காக்கிறது.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: செலவுகளை நீ ஏற்றுக்கொள்
  rationale: அவர்களுக்காகத் தேவையான செலவைச் சுமப்பது என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: அவர்கள் தங்கள் தலைகளை மழித்துக்கொள்வதற்கான
  rationale: ἵνα கூறும் நோக்கத்தையும், பலருக்குப் பகிர்ந்தளிக்கப்படும் ஒருமை ‘தலை’ என்பதை இயல்பான தமிழ் பன்மையில் வழங்குகிறது.
- source_word: γνώσονται πάντες
  choice: எல்லாரும் அறிந்துகொள்வார்கள்
  rationale: எதிர்கால வினையின் நேரடியான பொருளை இயல்பாகக் காக்கிறது.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: உன்னைப்பற்றி அவர்களுக்கு அறிவிக்கப்பட்டவற்றில்
  rationale: κατηχέω என்பதற்கு ‘போதிக்கப்படுதல்’ அல்லது பொதுவாக ‘அறிவிக்கப்படுதல்’ ஆகிய பொருள்கள் இருக்கலாம்; இச்சூழலில் பவுலைப்பற்றிப் பரவிய தகவல்களைச் சுட்டுவதால் ‘அறிவிக்கப்பட்ட’ எனத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: οὐδέν ἐστιν
  choice: உண்மை எதுவுமில்லை
  rationale: அறிவிக்கப்பட்ட குற்றச்சாட்டுகளுக்கு ஆதாரமான உண்மை இல்லை என்ற சூழல்சார் கருத்தைத் தெளிவான தமிழில் தருகிறது.
- source_word: ἀλλὰ στοιχεῖς καὶ αὐτὸς
  choice: நீயும் ... அதன்படி வாழ்கிறாய்
  rationale: στοιχέω என்பதன் ‘ஒரு ஒழுங்கு அல்லது நெறிக்கு ஏற்ப நடத்தல்’ என்ற தொடர்ச்சியான வாழ்வியல் பொருளையும், καὶ αὐτός என்பதன் ‘நீயும்’ என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: φυλάσσων τὸν νόμον
  choice: சட்டத்தைக் கடைப்பிடித்து
  rationale: φυλάσσω + νόμος என்பதன் ‘சட்டத்தைக் கைக்கொள்ளுதல்/கடைப்பிடித்தல்’ என்ற பொருளை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: இந்த நிகழ்வில் பவுலுக்கும் சட்டத்திற்கும் உள்ள உறவு
  choice: நீயும் சட்டத்தைக் கடைப்பிடித்து அதன்படி வாழ்கிறாய்
  alternative: நீயும் சட்டத்தைக் கைக்கொள்கிறாய்
  rationale: இது பவுலின் செயலைக் கண்டு மற்றவர்கள் அறிந்துகொள்ள வேண்டிய அவரது கண்கூடான நடத்தையை விவரிக்கிறது. பவுலின் சட்டக் கோட்பாட்டைப் பற்றிய விரிவான இறையியல் முடிவை இவ்வசனத்துக்குள் புகுத்தாமல், στοιχεῖς மற்றும் φυλάσσων ஆகிய இரு வினைச் சாயல்களையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டது. ‘தூய்மைப்படுத்திக்கொள்’ சடங்குசார் பொருளைத் தக்கவைக்கிறது; ‘சட்டம்’ என்பது νόμος என்பதைக் கூடுதல் இறையியல் விளக்கமின்றி வழங்குகிறது. மூலத்தின் கருத்துத் தொடரையும் பவுலின் சட்ட உறவு குறித்த பதற்றத்தையும் தீர்மானித்து விடாமல் பாதுகாக்கிறது.
