source:
  edition: SBLGNT
  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: ta
  text: அவர் உடனே படைவீரர்களையும் நூற்றுக்குத் தலைவர்களையும் கூட்டிக்கொண்டு, அவர்களை நோக்கிக் கீழே ஓடினார். படைத்தளபதியையும்[a] படைவீரர்களையும் கண்ட அவர்கள், பவுலை அடிப்பதை நிறுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ரோம இராணுவத் டிரிப்யூன்’; χιλίαρχος என்பது ரோமப் படைப்பிரிவுக்குத் தலைமை வகித்த அதிகாரியின் பதவி.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: உடனே
  rationale: செயல் தாமதமின்றி நடந்ததைக் காட்டும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: παραλαβὼν
  choice: அழைத்துக்கொண்டு
  rationale: அதிகாரி படைவீரர்களையும் நூற்றுக்குத் தலைவர்களையும் தன்னுடன் கூட்டிச் சென்றதைக் சூழலுக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: στρατιώτας
  choice: படைவீரர்கள்
  rationale: தனிப்பட்ட இராணுவ வீரர்களைக் குறிக்கும் பொதுவான, தெளிவான சொல்.
- source_word: ἑκατοντάρχας
  choice: நூற்றுக்குத் தலைவர்கள்
  rationale: ரோம இராணுவத்தின் centurion பதவியைச் சொல்லுக்குச் சொல்லான வரலாற்றுப் பொருளுடன், பழமையான நடையைத் தவிர்த்து வழங்குகிறது.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: அவர்களிடம் கீழே ஓடினார்
  rationale: கோட்டைப் பகுதியிலிருந்து கூட்டத்தை நோக்கி விரைவாகக் கீழிறங்கிய இயக்கத்தைப் பாதுகாக்கிறது; தேவையின்றி தாக்குதல் நோக்கத்தைச் சேர்க்கவில்லை.
- source_word: χιλίαρχον
  choice: படைத்தளபதி
  rationale: ரோமப் படைப்பிரிவுக்குப் பொறுப்பான அதிகாரியை சாதாரண தமிழ் வாசகருக்குத் தெளிவாகக் குறிக்கிறது; துல்லியமான வரலாற்றுப் பதவி அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐπαύσαντο
  choice: நிறுத்தினார்கள்
  rationale: அவர்கள் செய்துகொண்டிருந்த செயலை முடித்தார்கள் என்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: τύπτοντες
  choice: அடிப்பதை
  rationale: தொடர்ந்து பலமுறை தாக்கிக்கொண்டிருந்த வன்முறைச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
