source:
  edition: SBLGNT
  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: ta
  text: கைசரியாவைச் சேர்ந்த சீடர்களில் சிலரும் எங்களுடன் சென்று, நாங்கள் தங்கவிருந்த சீப்பிரசைச் சேர்ந்த மினாசோன் என்னும் ஒருவரிடம் எங்களை அழைத்துச் சென்றார்கள்[a]. அவர் தொடக்கக் காலத்திலிருந்த சீடர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மினாசோனிடம் எங்களை வழிநடத்திச் சென்றார்கள்; அவரிடம் நாங்கள் தங்கவிருந்தோம்” அல்லது “மினாசோனின் வீட்டுக்கு எங்களை அழைத்துச் சென்றார்கள்.” கிரேக்க வினையெச்சமும் விருந்தினராகத் தங்குதலைக் குறிக்கும் வினையும் நெருக்கமாகத் தொடர்புடையவை; அவை இவ்விதங்களில் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீண்டகாலமாகச் சீடராக இருந்தவர்.” மினாசோன் நீண்ட காலமாக, ஒருவேளை இயக்கத்தின் ஆரம்ப நாட்களிலிருந்தே, சீடராக இருந்தார் என்று இச்சொற்றொடர் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον … σὺν ἡμῖν
  choice: எங்களுடன் வந்து
  rationale: பயணத்தில் உடன்சென்றதைக் குறிக்கும் இயல்பான தமிழாக்கம்; ‘ஒன்றாக வந்தார்கள்’ என்ற சொல்லடிச் சார்ந்த பொருளையும் சூழலுக்கேற்ற உடன்செல்லும் கருத்தையும் தக்கவைக்கிறது.
- source_word: τῶν μαθητῶν ἀπὸ Καισαρείας
  choice: செசரியாவைச் சேர்ந்த சீடர்களில் சிலரும்
  rationale: கிரேக்கத்தின் பகுதி சார்ந்த பொருளை (‘சீடர்களில் சிலர்’) வெளிப்படையாகக் காட்டி, அவர்கள் செசரியாவிலிருந்து வந்தவர்கள் என்பதையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἄγοντες
  choice: எங்களை அழைத்துச் சென்றார்கள்
  rationale: பயணக் குழுவைத் தங்குமிடத்துக்கு வழிநடத்திச் சென்ற செயலைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: நாங்கள் தங்கவிருந்த … என்பவரிடம்
  rationale: விருந்தினராகத் தங்கவைக்கப்படுதல் என்ற ξενίζω வினையின் கருத்தையும், திட்டமிடப்பட்ட தங்குதலையும் சுருக்கமான நவீன தமிழில் தருகிறது.
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: சீப்பிரு நாட்டவரான மினாசோன் என்பவரிடம்
  rationale: முன்பு அறிமுகப்படுத்தப்படாத நபரை τινι அறிமுகப்படுத்தும் விதத்தை ‘என்பவர்’ இயல்பாகக் காட்டுகிறது; Κυπρίῳ அவரது சீப்பிரு நாட்டுப் பின்னணியைக் குறிக்கிறது.
- source_word: ἀρχαίῳ μαθητῇ
  choice: தொடக்கக்காலச் சீடர்
  rationale: அவர் இயக்கத்தின் ஆரம்பக் காலத்திலிருந்த சீடர் என்ற சாத்தியமான பொருளைத் தருகிறது; அவர் துல்லியமாக முதல் சீடர்களில் ஒருவர் என்று அளவுக்கு மீறி உறுதிப்படுத்தவில்லை.
theological_decisions:
- issue: ἀρχαίῳ μαθητῇ என்பதன் காலக் குறிப்பு
  choice: தொடக்கக்காலச் சீடர்
  alternative: நீண்டகாலமாகச் சீடராக இருந்தவர்
  rationale: கிரேக்கச் சொற்றொடர் ஆரம்பக் காலத்தைச் சேர்ந்தவர் என்றோ நீண்டகாலச் சீடர் என்றோ புரிந்துகொள்ளப்படலாம். முதன்மை உரை காலத்தின் தொடக்கத்தைச் சுட்டும் சுருக்கமான வாசிப்பைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தை இரண்டு தமிழ் வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டுள்ளது; பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
