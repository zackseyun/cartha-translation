translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பயண நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தீருவுக்கு இறங்கி வந்தோம்’ என்ற சொற்சொல் வடிவம் தமிழில் கப்பலிலிருந்து இறங்கியதாகத் தவறாகப் புரியக்கூடும் என்பதால் முதன்மை உரையில் ‘வந்தடைந்தோம்’ பயன்படுத்தப்பட்டு, மூலத்தின் திசை சார்ந்த சொற்றொடர் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. நடு/செயப்பாட்டு வடிவத்தின் ambiguity ‘இறக்கிக்கொண்டிருந்தது’ என்ற முதன்மை வாசிப்புடனும் மாற்று அடிக்குறிப்புடனும் காக்கப்பட்டுள்ளது.
