source:
  edition: SBLGNT
  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: ta
  text: சைப்பிரஸ் தீவு கண்ணில் பட்டதும்[a], அதை எங்கள் இடப்பக்கத்தில் விட்டுவிட்டு[b], சிரியாவுக்குக் கப்பலில் பயணித்தோம்; தீருவுக்கு வந்தடைந்தோம்[c]. ஏனெனில் அங்கே அந்தக் கப்பல் தன் சரக்கை இறக்கிக்கொண்டிருந்தது[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சைப்பிரஸ் தீவு பார்வைக்குத் தோன்றியதும்.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அதை இடப்பக்கத்தில் விட்டுவிட்டு”; அதாவது, நாங்கள் பயணித்தபோது சைப்பிரஸ் தீவு கப்பலின் இடப்புறத்தில் இருந்தது.
    reason: cultural_note
  - marker: c
    text: நேரடியாக, “தீருவுக்கு இறங்கி வந்தோம்”; இதை “தீருவுக்கு வந்து சேர்ந்தோம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “அந்தக் கப்பலிலிருந்து சரக்கு இறக்கப்பட்டுக்கொண்டிருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: கண்ணில் பட்டதும்
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகால வினையெச்சத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பயணத்தின்போது தீவு பார்வைக்குத் தோன்றியதையும் குறிக்கிறது.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: அதை எங்கள் இடப்பக்கத்தில் விட்டுவிட்டு
  rationale: εὐώνυμον என்பதன் ‘இடப்பக்கம்’ என்ற நேரடிப் பொருளையும், கப்பல் செல்லும்போது சைப்பிரு தீவு அவர்களது இடப்புறத்தில் இருந்தது என்ற பயணச் சூழலையும் காக்கிறது.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: சிரியாவை நோக்கிக் கப்பலில் பயணித்து
  rationale: இலக்கை நோக்கித் தொடர்ந்த கடற்பயணத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; முற்றுப்பெறாத ἐπλέομεν வினையின் தொடர்ச்சியான தன்மையையும் அளவோடு பிரதிபலிக்கிறது.
- source_word: κατήλθομεν εἰς Τύρον
  choice: தீருவை வந்தடைந்தோம்
  rationale: κατέρχομαι என்பதன் திசை சார்ந்த ‘இறங்கி வருதல்’ என்ற வடிவத்தைத் தமிழில் சொற்சொல்லாக மொழிபெயர்த்தால் கப்பலிலிருந்து இறங்கியதாகத் தவறாகப் புரியலாம். இங்கு இயல்பான பயணப் பொருளான வருகையைத் தெளிவாக வழங்குகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐκεῖσε
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட தீருவையே இயல்பாகச் சுட்டுகிறது.
- source_word: ἀποφορτιζόμενον
  choice: இறக்கிக்கொண்டிருந்தது
  rationale: ἦν உடன் சேர்ந்த நிகழ்கால நடு/செயப்பாட்டு வினையெச்சத்தின் தொடர்நிலையைப் பாதுகாக்கிறது. கப்பல் தனது சரக்கை இறக்குகிறது என்ற தமிழ்ப் பயன்பாடு இயல்பானது; செயப்பாட்டு வாசிப்பும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: τὸν γόμον
  choice: தன் சரக்கை
  rationale: γόμος என்பது கப்பலில் ஏற்றப்பட்ட சரக்கு அல்லது சுமையைக் குறிக்கிறது. ‘தன்’ என்பது அந்தச் சரக்கு கப்பலிலிருந்தது என்பதை இயல்பாகத் தெளிவுபடுத்துகிறது.
