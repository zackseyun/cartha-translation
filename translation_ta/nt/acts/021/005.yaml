translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஜெபித்தோம்’ என்பது தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பரவலாகப் புரிந்துகொள்ளப்படும் இயல்பான சொல். வழியனுப்பும் செயலைக் குறிக்கும் [a] குறிப்பு அதற்குரிய சொற்றொடருக்குப் பின்னும், αἰγιαλός குறித்த [b] குறிப்பு ‘கடற்கரையில்’ என்பதற்குப் பின்னும் இடப்பட்டது.
