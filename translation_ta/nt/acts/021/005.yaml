source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: ta
  text: அந்த நாட்களை நாங்கள் முடிக்கும் நேரம் வந்தபோது, நாங்கள் புறப்பட்டு எங்கள் பயணத்தைத் தொடர்ந்தோம். அவர்கள் எல்லாரும் தங்கள் மனைவிகளோடும் பிள்ளைகளோடும் நகரத்துக்கு வெளியே வரை எங்களுடன் வந்து வழியனுப்பினர்[a]. கடற்கரையில்[b] மண்டியிட்டு, நாங்கள் ஜெபித்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் எல்லாரும் எங்களை வழியனுப்ப வந்தனர்.’ புறப்படும் ஒருவருடன் சென்று பிரியாவிடை கொடுப்பதையும் இந்தக் கிரேக்க வினை குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடலோரத்தில்’ அல்லது ‘கடற்கரை ஓரத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας
  choice: அந்த நாட்களை நாங்கள் நிறைவு செய்ய வேண்டிய நேரம் வந்தபோது
  rationale: ἐγένετο + infinitive காலத்தின் ஒரு கட்டம் வந்ததைச் சுட்டுகிறது; ἐξαρτίζω குறிப்பிட்ட நாட்களை நிறைவு செய்வதைக் குறிக்கிறது. மூலத்தின் காலக் குறிப்பையும் ‘நாங்கள்’ என்ற எழுவாயையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: நாங்கள் புறப்பட்டு எங்கள் வழியே சென்றோம்
  rationale: புறப்படுதலையும் அதைத் தொடர்ந்து பயணம் மேற்கொண்டதையும் இரு வினை வடிவங்களும் வெளிப்படுத்துகின்றன; தமிழ் நடையில் இரண்டும் இயல்பாகப் பாதுகாக்கப்பட்டன.
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: அவர்கள் எல்லாரும் ... எங்களுடன் வந்து வழியனுப்பினர்
  rationale: προπέμπω புறப்படுகிற ஒருவருடன் சென்று வழியனுப்புவதைக் குறிக்கலாம். நிகழ்வின் இரு அம்சங்களையும் ‘எங்களுடன் வந்து வழியனுப்பினர்’ இயல்பாகத் தருகிறது.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: தங்கள் மனைவிகளோடும் பிள்ளைகளோடும்
  rationale: πάντων என்ற ஆண்பால் பன்மையோடு வரும் சூழலில் γυναιξί என்பது பொதுவாக ‘மனைவிகள்’ எனப் பொருள்படுகிறது; குடும்பங்கள் முழுவதும் வழியனுப்ப வந்த காட்சிக்கும் இது பொருந்துகிறது.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: நகரத்துக்கு வெளியே வரை
  rationale: நகர எல்லைக்கு அப்பால் உள்ள இடம்வரை உடன் வந்த திசை மற்றும் எல்லைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: θέντες τὰ γόνατα
  choice: முழங்கால்படியிட்டு
  rationale: ‘முழங்கால்களை வைத்தல்’ என்ற கிரேக்க மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்; ஜெபத்திற்காக மண்டியிட்ட செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπὶ τὸν αἰγιαλὸν
  choice: கடற்கரையில்
  rationale: αἰγιαλός கடலோரம் அல்லது மணற்கரையைக் குறிக்கிறது. ‘கடற்கரை’ நவீனத் தமிழில் தெளிவாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: προσευξάμενοι
  choice: நாங்கள் ஜெபித்தோம்
  rationale: முதல் நபர் பன்மை பயணக் குறிப்புடன் இசைவாக, வினையெச்சத்தை இயல்பான தமிழ் முற்றுவினையாக வழங்குகிறது.
