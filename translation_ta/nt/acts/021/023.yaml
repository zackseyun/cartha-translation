source:
  edition: SBLGNT
  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: ta
  text: 'ஆகவே, நாங்கள் உனக்குச் சொல்வதைச் செய்: தங்கள்மேல் ஒரு நேர்த்திக்கடன் உள்ள நான்கு ஆண்கள் நம்மிடம் இருக்கிறார்கள்[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு நேர்த்திக்கடனை எடுத்துக்கொண்டவர்கள்.” கிரேக்கத்தில் நேரடியாக, “ஒரு நேர்த்திக்கடன் கொண்டவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: சூழல் இது நசரேயர் வகை நேர்த்திக்கடனாக இருக்கலாம் என்று சுட்டுகிறது; ஆனால் இவ்வசனம் ‘ஒரு நேர்த்திக்கடன்’ என்று மட்டுமே கூறுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: ஆகவே
  rationale: οὖν காட்டும் முடிவுசார் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; τοῦτο என்பதன் பொருள் தொடர்ந்து வரும் ‘நாங்கள் உனக்குச் சொல்வதைச் செய்’ என்ற கட்டளையில் அடங்கியுள்ளது.
- source_word: ποίησον
  choice: செய்
  rationale: நேரடியான இறந்தகால ஏவல்வினையின் கட்டளை வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὅ σοι λέγομεν
  choice: நாங்கள் உனக்குச் சொல்வதை
  rationale: உறவுப்பெயரால் குறிக்கப்படும் கட்டளையின் உள்ளடக்கத்தை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰσὶν ἡμῖν
  choice: நம்மிடம் இருக்கிறார்கள்
  rationale: இருத்தல் வினையுடன் வரும் ἡμῖν என்ற நான்காம் வேற்றுமைப் பொருளை இயல்பான தமிழ் உடைமை/சார்பு அமைப்பில் தருகிறது; ‘நம்மிடையே’ என்று தேவையின்றி வரம்பிடவில்லை.
- source_word: ἄνδρες τέσσαρες
  choice: ஆண்கள் நால்வர்
  rationale: ἀνήρ என்பதன் வயதுவந்த ஆண் என்ற பாலினக் குறிப்பைப் பாதுகாத்து, மனிதர்களுக்குரிய எண்ணுப்பெயரான ‘நால்வர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: εὐχὴν ἔχοντες
  choice: ஒரு நேர்த்திக்கடன் கொண்ட
  rationale: ‘ஒரு நேர்த்திக்கடனை உடையவர்கள்’ என்ற தொடரின் பொருளை இயல்பாகத் தருகிறது; அவர்கள் அந்த நேர்த்திக்கடனுக்குக் கட்டுப்பட்டுள்ள தொடர்நிலையையும் உணர்த்துகிறது.
- source_word: ἀφ’ ἑαυτῶν
  choice: தங்களுக்கென
  rationale: அந்த நேர்த்திக்கடன் அவர்களையே சார்ந்தது அல்லது அவர்களுக்குரியது என்ற தற்சுட்டுப் பொருளைப் பாதுகாக்கிறது; அதன் துல்லிய உறவை அளவுக்கு மீறி விளக்கவில்லை.
theological_decisions:
- issue: நேர்த்திக்கடனின் தன்மை
  choice: முதன்மை உரையில் பொதுவாக ‘ஒரு நேர்த்திக்கடன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘நசரேய நேர்த்திக்கடன்’ என்று குறிப்பாக மொழிபெயர்த்தல்
  rationale: சுற்றியுள்ள வசனங்கள் நசரேய வகை நேர்த்திக்கடனைச் சுட்டக்கூடும்; ஆனால் இவ்வசனத்தின் εὐχήν என்பது ‘நேர்த்திக்கடன்’ என்று மட்டுமே கூறுகிறது. எனவே மூலத்தில் இல்லாத குறிப்பை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் நேரடியான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபருக்கான ‘உனக்கு’ மற்றும் ‘செய்’ மூலத்தின் நேரடி உரையாடல் தொனியைப் பாதுகாக்கின்றன. ‘நேர்த்திக்கடன்’ என்பது சமயச் சூழலில் vow என்பதற்குப் புரிந்துகொள்ளத்தக்க சொல்; வசனமே தராத நசரேயக் குறிப்பை முதன்மை உரை தவிர்க்கிறது.
