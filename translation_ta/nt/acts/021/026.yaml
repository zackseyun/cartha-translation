id: ACT.21.26
reference: Acts 21:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: ta
  text: பின்பு பவுல் அந்த மனிதர்களைத் தன்னுடன் அழைத்துக்கொண்டான். மறுநாள் அவர்களோடு சேர்ந்து சடங்குமுறையில் தூய்மைப்படுத்திக்கொண்டு, ஆலய வளாகத்திற்குள்[a] சென்றான். அவர்கள் ஒவ்வொருவருக்காகவும் காணிக்கை செலுத்தப்படும் வரை நடைபெறும் தூய்மைப்படுத்தும் நாட்கள் நிறைவடைவதை அறிவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் ஆலயத்தின் உள்ளார்ந்த பரிசுத்த இடத்தை மட்டும் அல்ல, ஆலயத்தின் முழு வளாகத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: தன்னுடன் அழைத்துக்கொண்டான்
  rationale: அந்த மனிதர்களைப் பவுல் தன்னுடன் கூட்டிச் சென்றதை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: மறுநாள்
  rationale: அடுத்த நாளைக் குறிக்கும் கிரேக்க காலச்சொற்றொடருக்கான சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: அவர்களோடு தன்னையும் தூய்மைப்படுத்திக்கொண்டு
  rationale: சடங்குமுறைத் தூய்மைப்படுத்துதலையும் பவுலின் உடன்பங்கேற்பையும் வெளிப்படுத்துகிறது; கிரேக்க வடிவத்தின் செயல்பாட்டு/இடைநிலைப் பொருளை சூழலுக்கு ஏற்றவாறு தருகிறது.
- source_word: εἰσῄει
  choice: சென்றான்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த அல்லது நிகழ்வுப்பின்னணி நுணுக்கம் கொள்ளலாம்; தமிழில் இங்கு எளிய இறந்தகாலம் இயல்பாகவும் கதைநடையைச் சிதைக்காமலும் உள்ளது.
- source_word: τὸ ἱερόν
  choice: ஆலய வளாகம்
  rationale: ἱερόν என்பது உள்ளார்ந்த பரிசுத்த இடத்தை மட்டும் அல்லாமல் முழு ஆலயப் பகுதியையும் குறிக்கிறது; ‘ஆலய வளாகம்’ அந்த வேறுபாட்டைத் துல்லியமாக்குகிறது.
- source_word: διαγγέλλων
  choice: அறிவித்தான்
  rationale: ஆலய நடைமுறையோடு தொடர்புடைய முறையான அறிவிப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: தூய்மைப்படுத்தும் நாட்கள் நிறைவடைவது
  rationale: குறிக்கப்பட்ட சடங்குக் காலத்தின் நிறைவை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἕως οὗ προσηνέχθη ... ἡ προσφορά
  choice: காணிக்கை செலுத்தப்படும் காலம்
  rationale: ‘காணிக்கை செலுத்தப்படும் வரை’ என்ற கிரேக்க எல்லைக்காலத் தொடர்பை இயல்பான தமிழ் வாக்கிய அமைப்பில் காலக் குறிப்பாக வெளிப்படுத்துகிறது; செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: அவர்கள் ஒவ்வொருவருக்காகவும்
  rationale: காணிக்கை ஒவ்வொருவரின் சார்பாக அல்லது நன்மைக்காகச் செலுத்தப்படுவதை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: ἡ προσφορά
  choice: காணிக்கை
  rationale: பலியைக் காட்டிலும் பரந்த பொருளுடைய வழிபாட்டுச் செலுத்துதலைக் குறிக்கும் பொதுச் சொல்லாக இருப்பதால், கிரேக்கச் சொல்லை தேவையின்றிக் குறுக்கவில்லை.
theological_decisions:
- issue: ஆலயத் தூய்மைப்படுத்தும் சடங்கில் பவுலின் பங்கேற்பின் இறையியல் மதிப்பீடு
  choice: நிகழ்வை மதிப்பீட்டு விளக்கமின்றி நேரடியாக விவரித்தல்
  alternative: இந்தச் செயல் கிறிஸ்தவர்களுக்கு மோசேயின் சட்டம் தொடர்ந்து கட்டாயம் என்பதையோ, அதற்கு எதிரானது என்பதையோ மொழிபெயர்ப்பிலேயே உணர்த்துதல்
  rationale: வசனம் பவுலின் செயலை விவரிக்கிறது; ஆலயச் சடங்குகளின் தொடர்ந்த செல்லுபடித்தன்மையைப் பற்றிய விரிவான இறையியல் முடிவை இங்கே வெளிப்படையாக வழங்கவில்லை.
- issue: εἰσῄει என்பதன் இறந்தகாலத் தொடர்நிலை நுணுக்கம்
  choice: தமிழில் இயல்பான எளிய இறந்தகாலமான ‘சென்றான்’
  alternative: தொடர்ச்சியை வெளிப்படையாகக் காட்ட ‘சென்றுகொண்டிருந்தான்’ அல்லது மீள்நிகழ்வைக் காட்ட ‘சென்று வந்தான்’
  rationale: கிரேக்க வடிவம் பின்னணி, நீடிப்பு அல்லது மீள்நிகழ்வு ஆகிய நுணுக்கங்களில் ஒன்றைக் கொள்ளலாம். சூழல் எதைக் குறிப்பாகக் கோருகிறது என்பது உறுதியில்லை; தமிழில் தொடர்நிலை வடிவம் தேவையற்ற பொருளைச் சேர்க்கக்கூடும்.
- issue: ἕως οὗ உடன் வரும் இறுதி சொற்றொடரின் இலக்கணத் தொடர்பு
  choice: தூய்மைப்படுத்தும் காலத்தின் முடிவையும் ஒவ்வொருவருக்கான காணிக்கை செலுத்தப்படும் காலத்தையும் அறிவித்ததாக இயல்பான தமிழில் வழங்குதல்
  alternative: ‘காணிக்கை செலுத்தப்படும் வரை’ என்று கிரேக்கச் சொல் வரிசையை அப்படியே வைத்து வாக்கியத்தைத் தொங்கவிடுதல்
  rationale: கிரேக்க வாக்கியத்தின் கால எல்லைத் தொடர்பைத் தக்கவைத்தபடியே தமிழில் புரியும் அமைப்பு தேவை. காணிக்கையின் தன்மை அல்லது பவுலே அதைச் செலுத்தினார் என்ற விவரத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலய வளாகம்’, ‘தூய்மைப்படுத்துதல்’, ‘காணிக்கை’ ஆகிய சொற்கள் யூதச் சடங்கு சூழலைத் தெளிவாகக் காட்டுகின்றன; எந்தப் பிரிவுசார் இறையியல் முடிவும் சேர்க்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் பொருத்தமான இடங்களில் இடம்பெற்றுள்ளன.
