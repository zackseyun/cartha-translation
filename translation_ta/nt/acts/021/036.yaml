  source_fidelity: மூலத்தின் γάρ-இணைப்பு, மக்கள் கூட்டம் என்ற நடுநிலையான குறிப்பு, மற்றும் κράζοντες குறிக்கும் உரத்த கோரிக்கை ஆகியவை வரைவில் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் “ஒழித்துவிடுங்கள்” என்பது αἶρε αὐτόν என்பதன் ‘அகற்றுங்கள்/அப்புறப்படுத்துங்கள்’ என்ற அடிப்படை வேண்டுகோளை விடக் கொலை அல்லது முற்றாக அழித்தல் என்ற பொருளை முதன்மைப்படுத்துகிறது. இவ்வசனத்தில் அந்தக் கூடுதல் வலிமை சூழலால் சாத்தியமானதாயினும், கிரேக்கத்தின் வெளிப்படையான சொற்பொருளாகத் திணிக்கக் கூடாது.
  naturalness: “மக்கள் கூட்டம் அவரைப் பின்தொடர்ந்து ... கூச்சலிட்டது” இயல்பானது. எனினும் imperfect வினையின் தொடர்நிலையையும், பின்தொடர்தலும் கூச்சலிடுதலும் ஒரே நேரத்தில் நடந்ததையும் “பின்தொடர்ந்துகொண்டே” மிகத் தெளிவாக வெளிப்படுத்துகிறது.
