  text: ἠκολούθει γὰρ τὸ πλῆθος τοῦ λαοῦ ⸀κράζοντες· Αἶρε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/036.yaml
  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: ta
  text: ஏனெனில், மக்கள் கூட்டம் அவரைப் பின்தொடர்ந்துகொண்டே, “இவனை அகற்றுங்கள்!”[a] என்று கூச்சலிட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவனை ஒழித்துவிடுங்கள்!”
    reason: αἶρε αὐτόν என்பது அடிப்படையில் ஒருவரை அகற்ற வேண்டும் என்ற பகைமையான கோரிக்கை; சூழலினால் வலுவான ‘ஒழித்துவிடுங்கள்’ என்ற நுண்ணுணர்வும் சாத்தியமாகிறது.
lexical_decisions:
- source_word: ἠκολούθει
  choice: பின்தொடர்ந்து
  rationale: இறந்தகாலத்தில் தொடர்ந்து நடந்த செயலைக் குறிக்கும் imperfect வினையின் தொடர்நிலையை, தமிழில் முதன்மை வினையுடன் இயல்பாக இணையும் வினையெச்சம் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிகழ்வுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: πλῆθος τοῦ λαοῦ
  choice: மக்கள் கூட்டம்
  rationale: பெருந்திரளான மக்களைக் குறிக்கும் தொடரை இயல்பான நவீன தமிழில் தருகிறது; ‘கும்பல்’ போன்ற இழிவான நுண்ணுணர்வைச் சேர்க்கவில்லை.
- source_word: κράζοντες
  choice: கூச்சலிட்டது
  rationale: கூட்டம் பின்தொடர்ந்தபோது உரத்த குரலில் எழுப்பிய கோரிக்கையை வலிமையாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: Αἶρε αὐτόν
  choice: இவனை ஒழித்துவிடுங்கள்!
  rationale: இச்சூழலில் αἴρω வெறுமனே தூக்குவதைக் குறிக்காமல், ஒருவரை அகற்ற வேண்டும் என்ற பகைமையான கோரிக்கையைத் தருகிறது. ‘ஒழித்துவிடுங்கள்’ அந்த வலிமையைக் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: Αἶρε என்பதன் சூழல்சார் வலிமை
  choice: இவனை ஒழித்துவிடுங்கள்!
  alternative: இவனை அப்புறப்படுத்துங்கள்! / இவனை அழைத்துச் செல்லுங்கள்!
  rationale: கூட்டத்தின் பகைமையான கோரிக்கையைத் தளர்த்தாமல் தருகிறது; அதேவேளை கொலைக்கான கட்டளையாக மட்டும் பொருளைச் சுருக்காமல், அகற்றுதல் அல்லது இல்லாமற் செய்தல் என்ற மொழிமரபுச் சார்ந்த பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கதைநடையின் அவசரத்தையும் கூட்டத்தின் பகைமையையும் காக்கும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
