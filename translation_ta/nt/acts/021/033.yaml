source:
  edition: SBLGNT
  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: ta
  text: அப்போது படைத்தளபதி[a] அவரிடம் நெருங்கி வந்து, அவரைப் பிடித்து, இரண்டு சங்கிலிகளால்[b] கட்டும்படி கட்டளையிட்டார். அவர் யார், என்ன செய்திருக்கிறார் என்று படைத்தளபதி விசாரித்துக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆயிரத்தலைவர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க χιλίαρχος என்பது ஒரு ரோம இராணுவ அதிகாரியைக் குறிக்கிறது; நேரடியாக, ‘ஆயிரம் பேருக்குத் தளபதி’ என்று பொருள்.
    reason: lexical_alternative
  - marker: b
    text: ‘இரண்டு சங்கிலிகள்’ என்பது, பவுல் எருசலேமில் கட்டப்படுவார் என்று அப்போஸ்தலர் 21:11-ல் கூறப்பட்ட தீர்க்கவாக்கை எதிரொலிக்கக்கூடும்.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: படைத்தளபதி
  rationale: ரோமப் படைப்பிரிவுக்கு அதிகாரியாக இருந்தவரைக் குறிக்கிறது. ‘படைத்தளபதி’ என்பது அவரது அதிகாரப்பூர்வ இராணுவப் பொறுப்பை நவீன வாசகர்களுக்குத் தெளிவாக உணர்த்துகிறது; சொல்லின் நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐγγίσας
  choice: அருகில் வந்து
  rationale: முதன்மைச் செயலுக்கு முன் அவர் நெருங்கி வந்ததை இறந்தகால வினையெச்சத் தொடர் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπελάβετο αὐτοῦ
  choice: அவரைப் பிடித்து
  rationale: பவுலை உடலளவில் பிடித்ததையும் கைது நிகழ்வின் வலிமையையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐκέλευσε δεθῆναι
  choice: கட்டும்படி கட்டளையிட்டார்
  rationale: அதிகாரத்துடன் பிறப்பிக்கப்பட்ட கட்டளையைத் தெளிவாகக் காட்டுகிறது. கிரேக்கச் செயலப்பாட்டு வடிவத்தின் கருத்து தமிழில் இயல்பான காரணவினைத் தொடரால் வெளிப்படுகிறது.
- source_word: ἁλύσεσι δυσί
  choice: இரண்டு சங்கிலிகளால்
  rationale: காவல் சூழலில் ἅλυσις என்பதன் நேரடியான பொருளான ‘சங்கிலி’யைத் தக்கவைத்து, எண்ணிக்கையையும் வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: ἐπυνθάνετο
  choice: விசாரித்துக்கொண்டிருந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்த விசாரணையைக் காட்டும் கிரேக்க imperfect வடிவத்தின் நீடித்த தன்மையைப் பாதுகாக்கிறது.
- source_word: τίς εἴη
  choice: அவர் யார் என்று
  rationale: கடந்தகால அறிமுக வினைக்குப் பின் வரும் மறைமுகக் கேள்வியை இயல்பான தமிழில் தருகிறது; தேவையற்ற ஐயப்பாட்டைச் சேர்க்கவில்லை.
- source_word: τί ἐστιν πεποιηκώς
  choice: என்ன செய்திருக்கிறார் என்று
  rationale: முடிந்த செயல் தற்போதைய சூழலோடு தொடர்புடையது என்பதை உணர்த்தும் periphrastic perfect வடிவத்தின் நுணுக்கத்தை ‘செய்திருக்கிறார்’ பாதுகாக்கிறது.
theological_decisions:
- issue: ‘இரண்டு சங்கிலிகள்’ என்பதற்கும் அப்போஸ்தலர் 21:11 தீர்க்கவாக்கிற்கும் உள்ள தொடர்பு
  choice: முதன்மை உரையில் ‘இரண்டு சங்கிலிகளால்’ என்று மட்டும் மொழிபெயர்த்து, சாத்தியமான எதிரொலியை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: முதன்மை உரையிலேயே தீர்க்கவாக்கு நிறைவேறியதாக விளக்குதல்
  rationale: கிரேக்க உரை இரண்டு சங்கிலிகளை மட்டும் கூறுகிறது; முந்தைய தீர்க்கவாக்குடன் தொடர்பு இருக்கலாம் என்றாலும், அதை வெளிப்படையாகத் தெய்வவியல் முடிவாக அறிவிப்பதில்லை. ஆகவே உரையின் இறுக்கமும் சாத்தியமான தொடர்பும் இரண்டும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. ‘விசாரித்துக்கொண்டிருந்தார்’ என்பது நடப்பின் தொடர்ச்சியைத் தக்கவைக்கிறது; ‘செய்திருக்கிறார்’ என்பது முடிந்த செயலின் அப்போதைய தொடர்பை வெளிப்படுத்துகிறது. மரியாதைப் பன்மைத் தன்மையுள்ள ‘அவர்’ வடிவம் பவுலுக்கும் படைத்தளபதிக்கும் இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது; வாக்கிய அமைப்பு குறிப்பிடுபவரைத் தெளிவாக்குகிறது.
