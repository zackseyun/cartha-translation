  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: ta
  text: அந்த ஏழு நாட்கள் நிறைவடைய இருந்தபோது, ஆசியா மாகாணத்திலிருந்து வந்த யூதர்கள் பவுலை ஆலய வளாகத்தில்[a] கண்டு, முழு மக்கள் கூட்டத்தையும் குழப்பத்தில் ஆழ்த்தி[b], அவரைப் பிடித்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆலய வளாகம்’ என்பது ஆலயத்தின் உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல், அதன் முற்றங்கள் உட்பட முழு வளாகத்தையும் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘முழு மக்கள் கூட்டத்தையும் தூண்டிவிட்டார்கள்’ அல்லது ‘கலக்கச் செய்தார்கள்.’ கிரேக்க வினைச்சொல் கூட்டத்தைக் குழப்பத்தில் ஆழ்த்துதல், கலக்கச் செய்தல், அல்லது தூண்டிவிடுதல் ஆகிய நுணுக்கங்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: c
