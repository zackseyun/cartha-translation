lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: அந்த ஏழு நாட்கள் நிறைவடையவிருந்தபோது
  rationale: μέλλω உடன் வரும் வினையெச்சம் உடனடியாக நிகழவிருந்த நிலையையும், συντελεῖσθαι காலப்பகுதி நிறைவுபெறுவதையும் குறிக்கிறது. முந்தைய சூழலைச் சுட்ட ‘அந்த’ இயல்பாகச் சேர்க்கப்பட்டது.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: ஆசியா மாகாணத்திலிருந்து வந்த யூதர்கள்
  rationale: Ἀσία இங்கு நவீன ஆசியக் கண்டத்தை அல்ல, ரோம ஆட்சிக்குட்பட்ட ஆசியா மாகாணத்தைக் குறிக்கிறது; அதனால் வாசகரின் தவறான புரிதலைத் தவிர்க்க ‘மாகாணம்’ வெளிப்படையாகக் கூறப்படுகிறது.
- source_word: θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ
  choice: பவுலை ஆலய வளாகத்தில் கண்டு
  rationale: αὐτόν என்பதைத் தமிழில் தெளிவுக்காக ‘பவுலை’ என்று வழங்குகிறது. ἱερόν உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கும்.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: மக்கள் கூட்டம் முழுவதையும் கலக்கிவிட்டு
  rationale: συγχέω குழப்புதல், கலக்கமடையச் செய்தல், தூண்டிவிடுதல் ஆகிய தொடர்புடைய பொருள்களைக் கொண்டது. ‘கலக்கிவிட்டு’ அதன் திட்டமிட்ட தூண்டுதலையும் விளைந்த குழப்பத்தையும் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: அவரைப் பலவந்தமாகப் பிடித்தார்கள்
  rationale: இச்சொற்றொடர் வெறுமனே கைகளை வைப்பதை அல்ல, ஒருவரைப் பிடித்துக்கொள்வதைச் சுட்டும் மரபுத்தொடர். ‘பலவந்தமாகப் பிடித்தார்கள்’ அதன் உடல் வன்முறையையும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
