translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் மதிப்புடனும் அமையும் நடை. ‘ஆசியா மாகாணம்’ மற்றும் ‘ஆலய வளாகம்’ ஆகியவை வரலாற்று-பண்பாட்டு தவறான புரிதலைத் தவிர்க்கப் பயன்படுத்தப்பட்டுள்ளன; συγχέω என்பதிலுள்ள பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
