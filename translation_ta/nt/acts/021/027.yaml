- from: அந்த ஏழு நாட்கள் நிறைவடையவிருந்தபோது, ஆசியா மாகாணத்திலிருந்து வந்த யூதர்கள் பவுலை ஆலய வளாகத்தில்[a] கண்டு, மக்கள் கூட்டம் முழுவதையும் கலக்கிவிட்டு[b], அவரைப் பலவந்தமாகப் பிடித்தார்கள்[c].
  to: அந்த ஏழு நாட்கள் நிறைவடைய இருந்தபோது, ஆசியா மாகாணத்திலிருந்து வந்த யூதர்கள் பவுலை ஆலய வளாகத்தில்[a] கண்டு, முழு மக்கள் கூட்டத்தையும் குழப்பத்தில் ஆழ்த்தி[b], அவரைப் பிடித்தார்கள்[c].
  rationale: The revision retains the draft's historically accurate clarification of Asia and precise rendering of the temple precincts. It refines the crowd verb to reflect συγχέω more directly and removes an unwarranted explicit intensifier from the idiom for seizing Paul. All footnote anchors and their explanations remain aligned with the revised wording.
