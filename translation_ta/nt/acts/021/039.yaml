  terminology: ‘யூதன்,’ ‘சிலிசியா,’ ‘தர்சு,’ ‘குடிமகன்,’ and ‘மக்கள்’ are appropriate. The revision preserves the Greek litotes rather than replacing it with a simple positive description.
