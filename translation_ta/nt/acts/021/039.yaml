id: ACT.21.39
reference: Acts 21:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: ta
  text: ஆனால் பவுல், “நான் ஒரு யூதன்; சிலிசியாவிலுள்ள தர்சு நகரத்தின் குடிமகன்; அது சிறப்பற்ற நகரம் அல்ல. மக்களிடம் பேச எனக்கு அனுமதி அளிக்குமாறு உங்களை வேண்டுகிறேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος … Ἰουδαῖος
  choice: ஒரு யூதன்
  rationale: இது பவுலின் இன-சமய அடையாளத்தைக் குறிக்கிறது. தமிழில் ‘ஒரு யூத மனிதன்’ என்பது இயல்பற்றதாக இருப்பதால், ஆண்பால் ஒருமையையும் அடையாளத்தையும் இயல்பாகத் தெரிவிக்கும் ‘ஒரு யூதன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: Ταρσεὺς τῆς Κιλικίας … πολίτης
  choice: சிலிசியாவிலுள்ள தர்சு நகரத்தின் குடிமகன்
  rationale: Ταρσεύς என்பது தர்சுவைச் சேர்ந்தவர் என்பதையும், πολίτης குடியுரிமை சார்ந்த நகர அடையாளத்தையும் காட்டுகிறது. இரண்டையும் தமிழில் இயல்பாக ஒருங்கிணைக்கிறது.
- source_word: οὐκ ἀσήμου πόλεως
  choice: அது சிறப்பற்ற நகரம் அல்ல
  rationale: மூலத்தின் எதிர்மறை வழியிலான வலியுறுத்தலை நேர்மறையாகத் தட்டையாக்காமல், தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: δέομαι
  choice: வேண்டிக்கொள்கிறேன்
  rationale: ஒரு சாதாரணக் கேள்வியைவிட உருக்கமும் மரியாதையும் கொண்ட வேண்டுகோளை வெளிப்படுத்துகிறது.
- source_word: ἐπίτρεψόν μοι λαλῆσαι
  choice: பேச எனக்கு அனுமதி அளிக்கும்படி
  rationale: இராணுவ அதிகாரியிடம் பவுல் வைக்கும் மரியாதையான முறையான கோரிக்கையைத் தெளிவாகக் காட்டுகிறது.
- source_word: πρὸς τὸν λαόν
  choice: மக்களிடம்
  rationale: λαός என்பதன் சமூகக் கூட்டுணர்வைப் பாதுகாக்கிறது; உடனடி சூழலில் உள்ள கூட்டத்தையும் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: Ἰουδαῖος என்பதன் பொருள்
  choice: யூதன்
  alternative: யூதேயன்
  rationale: பவுல் தனது பிறப்பிடமாகச் சிலிசியாவிலுள்ள தர்சுவைத் தனியாகக் குறிப்பிடுவதால், இங்கே Ἰουδαῖος என்பது யூதேயப் பிரதேசத்தைச் சேர்ந்தவர் என்பதைக் காட்டிலும் அவரது இன-சமய அடையாளத்தைக் குறிப்பதே பொருத்தமானது.
translation_notes:
  register: நவீன தரமான தமிழில், அதிகாரியிடம் முன்வைக்கப்படும் மரியாதையான வேண்டுகோளுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘சிறப்பற்ற நகரம் அல்ல’ என்ற எதிர்மறை வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
