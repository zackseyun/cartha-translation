id: ACT.21.13
reference: Acts 21:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: ta
  text: 'அப்போது பவுல் பதிலளித்தார்: “நீங்கள் இப்படி அழுது என் உள்ளத்தை நொறுக்குகிறீர்களே,[a] என்ன செய்கிறீர்கள்? ஆண்டவர் இயேசுவின் பெயருக்காக[b] எருசலேமில் கட்டப்படுவதற்கு மட்டுமல்ல, இறப்பதற்கும் நான் ஆயத்தமாக இருக்கிறேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் உள்ளத்தை நொறுக்குகிறீர்களே’ என்பதை ‘என் உள்ளத்தைச் சிதைக்கிறீர்களே’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் சாதாரண வருத்தத்தைவிட வலிமையானது; உள்ளார்ந்த முறிவைச் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பெயருக்காக’ என்பது ‘பெயரின் பொருட்டு’ என்றும் மொழிபெயர்க்கப்படலாம். வேதாகமச் சொல்லாட்சியில் ‘பெயர்’ என்பது இயேசுவையும் அவரது அதிகாரத்தையும் அவரோடு தொடர்புடைய நோக்கத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε ἀπεκρίθη ὁ Παῦλος
  choice: அப்போது பவுல் பதிலளித்தார்
  rationale: கதைநடையின் இயல்பான வரிசையையும் ἀπεκρίθη என்பதன் பதிலுரைக்கும் பொருளையும் தெளிவாகக் கொடுக்கிறது.
- source_word: Τί ποιεῖτε
  choice: என்ன செய்கிறீர்கள்?
  rationale: பவுலின் நேரடியான, உணர்ச்சிமிக்க எதிர்ப்பை ‘ஏன்’ என்று விளக்கிவிடாமல் கிரேக்கக் கேள்வியின் வடிவிலேயே பாதுகாக்கிறது.
- source_word: κλαίοντες
  choice: அழுது
  rationale: தொடர்நிலைப் பங்கேற்பு வடிவத்தையும் காட்சியின் துயரத் தொனியையும் இயல்பான தமிழில் தருகிறது.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: என் உள்ளத்தை நொறுக்குகிறீர்களே
  rationale: συνθρύπτω குறிக்கும் ஆழமான உள்ளார்ந்த உடைதலை வலுவான, இயல்பான தமிழ் உருவகமாக வெளிப்படுத்துகிறது; καρδία இங்கு உணர்வுகளின் மையத்தைக் குறிப்பதால் ‘உள்ளம்’ பொருத்தமானது.
- source_word: δεθῆναι
  choice: கட்டப்படுவதற்கு
  rationale: δέω என்பதன் நேரடியான கட்டுதல் அல்லது பிணைத்தல் என்ற பொருளைப் பாதுகாக்கிறது; ‘சிறையில் அடைக்கப்படுதல்’ என்று சூழலை விரிவுபடுத்தவில்லை.
- source_word: ἀποθανεῖν
  choice: இறப்பதற்கும்
  rationale: மூலத்தின் நேரான பொருளையும் ‘மட்டுமல்ல ... இறப்பதற்கும்’ என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமில்
  rationale: கட்டப்படுதலும் இறப்பதும் நிகழக்கூடிய இடத்தை இயல்பான தமிழில் குறிக்கிறது; பயண இலக்கை விட இங்கு எதிர்நோக்கும் துன்பத்தின் இடம் முன்னிலையில் உள்ளது.
- source_word: ἑτοίμως ἔχω
  choice: நான் ஆயத்தமாக இருக்கிறேன்
  rationale: துன்பத்தை மனமுவந்து எதிர்கொள்ளத் தயாராக இருப்பதைத் தெளிவாகவும் கண்ணியமான நடையிலும் தருகிறது.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: பெயருக்காக
  rationale: இயேசுவையும் அவரது அதிகாரத்தையும் அவரோடு தொடர்புடைய நோக்கத்தையும் சுட்டும் வேதாகமச் சொல்லாட்சியான ‘பெயர்’ என்பதை விளக்கிப் பதிலீடு செய்யாமல் பாதுகாக்கிறது.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ஆண்டவர் இயேசுவின்
  rationale: κύριος என்பதை இயேசுவுக்குரிய கிறிஸ்துவியல் பட்டமாக ‘ஆண்டவர்’ என்று மொழிபெயர்க்கிறது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர் இயேசு
  alternative: எஜமானாகிய இயேசு
  rationale: இங்கு κύριος ஒரு கிறிஸ்துவியல் பட்டம்; ‘ஆண்டவர்’ அதன் வேதாகம மற்றும் இறையியல் கனத்தைத் தளர்த்தாமல் இயல்பாகத் தருகிறது.
- issue: ‘பெயர்’ என்ற வேதாகமச் சொல்லாட்சியைப் பாதுகாத்தல்
  choice: ஆண்டவர் இயேசுவின் பெயருக்காக
  alternative: ஆண்டவர் இயேசுவுக்காக
  rationale: மூலத்தில் உள்ள ‘பெயர்’ என்பது இயேசுவின் நபர், அதிகாரம், அவரோடு அடையாளப்படுத்தப்பட்ட நோக்கம் ஆகியவற்றைத் தாங்கும் பொருளடர்த்தியான சொல்லாட்சி; அதை குறுகிய விளக்கமாக மாற்றாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. பவுலின் உணர்ச்சிமிக்க நேரடிக் கேள்வி பாதுகாக்கப்பட்டு, ‘உள்ளத்தை நொறுக்குதல்’ மற்றும் ‘பெயருக்காக’ என்ற மூல உருவகங்களும் சொல்லாட்சியும் விளக்கிப் பரப்பப்படாமல் வைக்கப்பட்டுள்ளன.
