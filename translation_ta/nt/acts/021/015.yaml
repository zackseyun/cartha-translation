base_translation:
  language: en
  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: ta
  text: அந்த நாட்களுக்குப் பிறகு, நாங்கள் பயணத்துக்குத் தயாராகி[a], எருசலேமுக்கு ஏறிச் சென்றோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயணத்துக்கான பொருட்களைக் கட்டிக்கொண்டு.” கிரேக்கச் சொல் பயணத்துக்குப் பொதுவாக ஆயத்தமாவதையோ, குறிப்பாகப் பயணத்துக்கான பொருட்களைக் கட்டுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: அந்த நாட்களுக்குப் பிறகு
  rationale: μετά என்பதன் காலத் தொடர்ச்சியைக் குறிக்கும் பொருளை நேரடியாகக் காட்டுகிறது. தமிழில் இயல்பாக இருக்க ‘அந்த நாட்கள்’ என வழங்கப்பட்டுள்ளது; இது உடனே முன் சொல்லப்பட்ட காலப்பகுதியைக் குறிக்கிறது.
- source_word: ἐπισκευασάμενοι
  choice: பயணத்துக்குத் தயாராகி
  rationale: இந்த வினையெச்சம் பயணத்திற்காகத் தங்களை ஆயத்தப்படுத்திக்கொள்வதையோ உடைமைகளை எடுத்துக்கட்டுவதையோ குறிக்கலாம். ‘பயணத்துக்குத் தயாராகி’ என்பது மூலச்சொல்லின் பரந்த பொருளையும் அதன் தெளிவின்மையையும் காக்கும் இயல்பான தமிழ்.
- source_word: ἀνεβαίνομεν
  choice: ஏறிச் சென்றோம்
  rationale: எருசலேமை நோக்கிய பயணத்தை ‘மேலே செல்லுதல்’ என்று விவரிக்கும் கிரேக்கத் திசைநுட்பத்தைக் காக்கிறது. இறந்தகாலப் பயண நிகழ்வாகத் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமுக்கு
  rationale: εἰς இங்கு நகரத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; அதற்கான இயல்பான தமிழ் வடிவம் ‘எருசலேமுக்கு’.
