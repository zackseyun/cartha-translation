id: ACT.21.29
reference: Acts 21:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: ta
  text: ஏனெனில், எபேசியனான துரோப்பீமு அவருடன் நகரத்தில் இருப்பதை அவர்கள் முன்பே பார்த்திருந்தார்கள்; பவுல் அவனைத் தேவாலயத்துக்குள்[a] அழைத்துச் சென்றதாக அவர்கள் எண்ணினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘தேவாலயம்’ என்பதற்கான கிரேக்கச் சொல், உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் தேவாலய வளாகத்தையோ அதன் முற்றங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: முன்பே பார்த்திருந்தார்கள்
  rationale: இறந்தகாலத்தில் மற்றொரு நிகழ்வுக்கு முன்னரே நிகழ்ந்த செயலை இந்தக் கூட்டு வினை வடிவம் குறிக்கிறது; தமிழ் இறந்தகால நிறைவுவடிவம் அந்தக் கால உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: எபேசியனான துரோப்பீமு
  rationale: Ἐφέσιον என்பது துரோப்பீமுவை அவர் வந்த ஊரால் அடையாளப்படுத்துகிறது; இவ்வடிவம் கிரேக்கத் தொடர் அமைப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ἐν τῇ πόλει
  choice: நகரத்தில்
  rationale: இங்கு πόλις என்பது தேவாலயப் பகுதியிலிருந்து வேறுபடுத்தப்படும் எருசலேம் நகரப் பகுதியைக் குறிக்கிறது.
- source_word: σὺν αὐτῷ
  choice: அவருடன்
  rationale: σύν உடனிருப்பதைக் குறிக்கிறது; சூழலில் பதிற்பெயர் பவுலைக் குறிக்கிறது. பெயரை மீண்டும் சேர்க்காமல் மூலத்தின் பதிற்பெயர் அமைப்பு காக்கப்பட்டுள்ளது.
- source_word: ἐνόμιζον
  choice: எண்ணினார்கள்
  rationale: அவர்கள் கண்டதன் அடிப்படையில் உறுதியான அறிவின்றி செய்த ஊகத்தையோ முடிவையோ νομίζω குறிக்கிறது; ‘எண்ணினார்கள்’ அந்தத் தன்மையை மிகைப்படுத்தாமல் தருகிறது.
- source_word: εἰς τὸ ἱερὸν
  choice: தேவாலயத்துக்குள்
  rationale: முதன்மை உரையில் வாசகர்களுக்குப் பழக்கமான சுருக்கமான சொல் பயன்படுத்தப்பட்டுள்ளது; ἱερόν முழு தேவாலய வளாகத்தையும் குறிக்கக்கூடும் என்ற துல்லியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: εἰσήγαγεν
  choice: அழைத்து வந்ததாக
  rationale: ஒருவரை ஓர் இடத்திற்குள் கூட்டிச் சென்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது; ἐνόμιζον என்பதற்குப் பிந்தைய சார்பு வாக்கியமாக ‘வந்ததாக’ அமைக்கப்பட்டுள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திலுள்ள குற்றச்சாட்டுக்கான விளக்கக் காரணத்தை γάρ அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: பவுல்மீதான குற்றச்சாட்டில் ἱερόν என்பதன் பரப்பு
  choice: முதன்மை உரையில் ‘தேவாலயம்’ என்று வழங்கி, அது முழு தேவாலய வளாகத்தையோ அதன் சுற்றுப்பகுதிகளையோ குறிக்கலாம் என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துதல்
  alternative: ‘தேவாலய வளாகத்துக்குள்’ அல்லது ‘தேவாலய முற்றங்களுக்குள்’ என்று முதன்மை உரையிலேயே வழங்குதல்
  rationale: ἱερόν என்பது ναός போல உள் பரிசுத்தக் கட்டடத்தை மட்டும் குறிப்பதில்லை. அதேவேளை, ‘தேவாலயம்’ என்பது இயல்பான பொதுவழக்கு; அடிக்குறிப்பு வரலாற்றுச் சூழலுக்குத் தேவையான பரந்த பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவருடன்’ என்பது சூழலில் பவுலைக் குறிக்கிறது; மூலத்தின் பதிற்பெயர் அமைப்பு பாதுகாக்கப்பட்டுள்ளது. குற்றச்சாட்டு உண்மை என உறுதிப்படுத்தாமல், அவர்கள் செய்த ஊகம் ‘எண்ணினார்கள்’ என்பதன் மூலம் காக்கப்பட்டுள்ளது.
