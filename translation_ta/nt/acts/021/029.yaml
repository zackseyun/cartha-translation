revisions:
- from: ஏனெனில், எபேசியனான துரோப்பீமு அவருடன் நகரத்தில் இருப்பதை அவர்கள் முன்பே பார்த்திருந்தார்கள்; பவுல் அவனைத் தேவாலயத்துக்குள்[a] அழைத்து வந்ததாக எண்ணினார்கள்.
  to: ஏனெனில், எபேசியனான துரோப்பீமு அவருடன் நகரத்தில் இருப்பதை அவர்கள் முன்பே பார்த்திருந்தார்கள்; பவுல் அவனைத் தேவாலயத்துக்குள்[a] அழைத்துச் சென்றதாக அவர்கள் எண்ணினார்கள்.
  rationale: This limited revision retains the draft’s faithful handling of the verse while making the alleged movement into the temple more idiomatic and directionally clear in Tamil. The revised note more accurately describes the lexical range of ἱερόν without asserting that the inner sanctuary is meant.
  reviewer_model: gpt-5.6-terra
