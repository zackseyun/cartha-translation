revisions:
- from: ஆனால் கூட்டத்தில் சிலர் ஒன்றையும் வேறு சிலர் இன்னொன்றையும் கூச்சலிட்டுக்கொண்டிருந்தார்கள். அந்தக் கலவரத்தினால் அவரால் உறுதியான விவரத்தை அறிந்துகொள்ள முடியாததால், பவுலை படைவீரர் தங்குமிடத்துக்குள் கொண்டுபோகும்படி கட்டளையிட்டார்.[a]
  to: ஆனால், கூட்டத்தில் சிலர் ஒன்றைக் கூச்சலிட்டுக் கொண்டிருந்தார்கள்; வேறு சிலர் இன்னொன்றைக் கூச்சலிட்டுக் கொண்டிருந்தார்கள். அந்த ஆரவாரத்தினால் என்ன நடந்தது என்பதை அவரால் உறுதியாக அறிய முடியாததால், பவுலைப் படைவீரர்களின் தங்குமிடத்துக்குள் அழைத்துச் செல்லும்படி அவர் கட்டளையிட்டார்.[a]
  rationale: The revision removes a potentially emphatic Tamil construction not present in the Greek, renders τὸ ἀσφαλές idiomatically as establishing with certainty what had happened, and uses “ஆரவாரம்” for the noisy public tumult. It retains Paul as the explicit referent of αὐτόν, which is contextually clear and helpful in Tamil, and preserves the cultural-note anchor at the rendering of παρεμβολή.
