  text: ἄλλοι δὲ ἄλλο τι ⸀ἐπεφώνουν ἐν τῷ ὄχλῳ· μὴ ⸂δυναμένου δὲ αὐτοῦ⸃ γνῶναι τὸ ἀσφαλὲς διὰ τὸν θόρυβον ἐκέλευσεν ἄγεσθαι αὐτὸν εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: ta
  text: ஆனால், கூட்டத்தில் சிலர் ஒன்றைக் கூச்சலிட்டுக் கொண்டிருந்தார்கள்; வேறு சிலர் இன்னொன்றைக் கூச்சலிட்டுக் கொண்டிருந்தார்கள். அந்த ஆரவாரத்தினால் என்ன நடந்தது என்பதை அவரால் உறுதியாக அறிய முடியாததால், பவுலைப் படைவீரர்களின் தங்குமிடத்துக்குள் அழைத்துச் செல்லும்படி அவர் கட்டளையிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படைவீரர்களின் தங்குமிடம்” என்பது ஆலயப் பகுதிக்கு அருகிலிருந்த கோட்டை வளாகத்திலுள்ள ரோமப் படையினரின் தங்குமிடத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: ஆனால் கூட்டத்தில் சிலர் ஒன்றையும் வேறு சிலர் இன்னொன்றையும் கூச்சலிட்டுக்கொண்டிருந்தார்கள்
  rationale: ἄλλοι...ἄλλο τι என்பதன் பகிர்ந்தெதிர்நிலையையும், ἐπεφώνουν என்பதன் தொடர்ச்சியான கடந்தகாலச் செயற்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. ὄχλος என்பதற்கு சூழலை மிகைப்படுத்தாத நடுநிலையான ‘கூட்டம்’ பயன்படுத்தப்பட்டது.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι τὸ ἀσφαλές
  choice: அவரால் உறுதியான விவரத்தை அறிந்துகொள்ள முடியாததால்
  rationale: மரபிலக்கணத் தொடர்பு அடுத்த நடவடிக்கைக்கான காரணத்தைத் தருகிறது. τὸ ἀσφαλές என்பது வெறும் ‘உண்மை’ என்பதைவிட உறுதிப்படுத்தக்கூடிய அல்லது நம்பகமான விவரத்தைக் குறிப்பதால் ‘உறுதியான விவரம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: διὰ τὸν θόρυβον
  choice: அந்தக் கலவரத்தினால்
  rationale: θόρυβος வெறும் இரைச்சலை மட்டுமல்லாமல் குழப்பமான பொதுக் கொந்தளிப்பையும் குறிக்கிறது; ‘கலவரம்’ அந்தச் சூழலைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτόν
  choice: பவுலை ... கொண்டுபோகும்படி கட்டளையிட்டார்
  rationale: செயப்படுபொருளின் அடையாளம் முந்தைய சூழலில் தெளிவாக இருப்பதால் தமிழில் ‘பவுலை’ என வெளிப்படுத்துவது குழப்பத்தைத் தவிர்க்கிறது. செயற்பாட்டாளர்களைக் கிரேக்கம் குறிப்பிடாததால் மொழிபெயர்ப்பிலும் அவர்கள் சேர்க்கப்படவில்லை.
- source_word: εἰς τὴν παρεμβολήν
  choice: படைவீரர் தங்குமிடத்துக்குள்
  rationale: இந்தச் சூழலில் παρεμβολή என்பது ஆலயப் பகுதிக்கு அடுத்திருந்த ரோமப் படையினரின் அரண் வளாகத்திலுள்ள தங்குமிடத்தைக் குறிக்கிறது. ‘படைவீரர் தங்குமிடம்’ என்பது நவீன வாசகருக்குத் தெளிவாகவும் ‘முகாம்’ என்பதிலுள்ள தற்காலிகத் தொனியைத் தவிர்ப்பதாகவும் உள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் dignified நடையில் அமைக்கப்பட்டது. தொடர்ச்சியான கூச்சலை ‘கூச்சலிட்டுக்கொண்டிருந்தார்கள்’ என்றும், குழப்பமான கொந்தளிப்பை ‘கலவரம்’ என்றும் வழங்குகிறது. முதன்மை உரையில் உள்ள [a] குறியீடு பண்பாட்டு அடிக்குறிப்புடன் நேரடியாக இணைக்கப்பட்டுள்ளது.
