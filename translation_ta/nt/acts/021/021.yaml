id: ACT.21.21
reference: Acts 21:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: ta
  text: ஆனால், பிற இன மக்களிடையே வாழும் யூதர்கள் அனைவருக்கும் மோசேயைக் கைவிடுமாறு[a] நீ போதிப்பதாகவும், தங்கள் பிள்ளைகளுக்கு விருத்தசேதனம் செய்ய வேண்டாம் என்றும், மரபுவழக்கங்களின்படி நடக்க வேண்டாம்[b] என்றும் நீ அவர்களுக்குச் சொல்வதாகவும் அவர்களுக்குத் தெரிவிக்கப்பட்டுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோசேயிடமிருந்து விலகுதலை நீ போதிப்பதாக.” கிரேக்கத்தில் கைவிடுதல் அல்லது விலகிச் செல்லுதல் என்ற பொருளுடைய பெயர்ச்சொல் பயன்படுத்தப்பட்டுள்ளது. இங்கு “மோசே” என்பது மோசேயின் நியமத்தையும் யூத முன்னோர் மரபையும் குறிக்கிறது.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: அல்லது, “மரபுவழக்கங்களின்படி வாழ வேண்டாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: கேள்விப்பட்டிருக்கிறார்கள்
  rationale: இங்கு செயல்பாட்டு வினையின் செயப்பாட்டு வடிவம், பவுலைப் பற்றிய செய்தி அவர்களுக்குத் தெரிவிக்கப்பட்டிருப்பதைக் குறிக்கிறது. தமிழில் ‘கேள்விப்பட்டிருக்கிறார்கள்’ என்பது வாய்மொழியாகச் செய்தி சென்றதையும் அதன் தற்போதைய விளைவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: மோசேயைவிட்டு விலகும்படி
  rationale: ἀποστασία என்பது கைவிடுதல் அல்லது விலகிச் செல்லுதல் என்ற கருத்தைக் குறிக்கிறது. ‘மோசேயைவிட்டு விலகுதல்’ குற்றச்சாட்டின் வலிமையைத் தக்கவைத்து, இதைத் தொழில்நுட்பமான சமயச் சொல்லாகத் தேவையின்றி மாற்றுவதில்லை.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: பிற இனத்தாரிடையே வாழும் யூதர்கள் அனைவருக்கும்
  rationale: இந்தச் சொற்றொடர் பிற இன மக்களிடையே சிதறி வாழ்ந்த யூதர்களைக் குறிக்கிறது. ‘வாழும்’ என்பதைச் சேர்ப்பது தமிழில் பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: λέγων
  choice: அவர்களுக்குச் சொல்வதாகவும்
  rationale: இந்தப் பங்கேற்பு வினை, குற்றஞ்சாட்டப்பட்ட போதனையின் உள்ளடக்கத்தை விளக்குகிறது. தமிழில் மேற்கோள் அமைப்புடன் ‘சொல்வதாகவும்’ என்பது இயல்பாக இணைகிறது.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: தங்கள் பிள்ளைகளுக்கு விருத்தசேதனம் செய்ய வேண்டாம்
  rationale: கிரேக்கம் ‘பிள்ளைகள்’ என்றே கூறுவதால் ‘மகன்கள்’ என்று குறுக்கப்படவில்லை. αὐτούς தரும் உடைமைத் தொடர்பு தமிழில் ‘தங்கள்’ என்பதால் வெளிப்படுகிறது.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: மரபுவழக்கங்களின்படி நடக்க வேண்டாம்
  rationale: περιπατεῖν என்பதன் ‘நடத்தையை மேற்கொள்ளுதல்/வாழ்தல்’ என்ற உருவகப் பொருளை ‘நடக்க’ தக்கவைக்கிறது; ἔθεσιν என்பது முன்னோரிடமிருந்து வந்த யூத மரபுவழக்கங்களைக் குறிக்கிறது.
theological_decisions:
- issue: மோசேயின் நியமத்தைப் பற்றிய பவுலுக்கு எதிரான குற்றச்சாட்டின் தன்மை
  choice: ‘மோசேயைவிட்டு விலகும்படி ... போதிப்பதாக’ என்று, பிறர் கூறிய குற்றச்சாட்டாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மோசேக்கு எதிராக விசுவாசத்துரோகம் செய்யும்படி’ அல்லது ‘மோசேயின் நியமத்தைக் கைவிடும்படி’ என்று விரிவாக்குதல்.
  rationale: இது பவுலைப் பற்றி மற்றவர்கள் கேட்டறிந்த குற்றச்சாட்டை அறிக்கையிடுகிறது; உரையாசிரியரின் இறையியல் தீர்ப்பாக அல்ல. ‘மோசே’ என்ற மூல உரையின் ஆகுபெயரைத் தக்கவைத்து, குற்றச்சாட்டை உண்மை என உறுதிப்படுத்தாமலும் அதன் வலிமையைக் குறைக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘விருத்தசேதனம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டது. கிரேக்கத்தின் ‘நடத்தல்’ உருவகம் தமிழிலும் புரியக்கூடியதால் ‘நடக்க’ எனப் பாதுகாக்கப்பட்டது. அடிக்குறிப்பு குறிகள் உரையில் தொடர்புடைய இடங்களிலேயே வைக்கப்பட்டுள்ளன.
