source:
  edition: SBLGNT
  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: ta
  text: அவர்களுக்கு வணக்கம் தெரிவித்த பின்பு, தன் ஊழியத்தின் மூலம் பிற இனத்தவரிடையே[a] கடவுள் செய்தவற்றை அவர் ஒவ்வொன்றாக விவரித்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிற நாடுகளிடையே.’ இச்சூழலில் இது யூதரல்லாத மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விரிவாக எடுத்துரைத்தார்’ அல்லது ‘விளக்கிச் சொன்னார்.’ கிரேக்க வினை தொடர்ச்சியான, ஒவ்வொன்றாக அமைந்த விவரிப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: வாழ்த்திய பின்பு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்புவினையின் தொடரை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐξηγεῖτο
  choice: விவரித்துச் சொன்னார்
  rationale: நீடித்த, விரிவான எடுத்துரைப்பைக் குறிக்கும் நிறைவுறாத இறந்தகால வினையின் பொருளையும், recount/explain என்ற சொற்பொருள் வரம்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καθ’ ἓν ἕκαστον
  choice: ஒவ்வொன்றாக
  rationale: ஒவ்வொரு நிகழ்வையும் தனித்தனியாக எடுத்துரைத்தார் என்ற பகிர்வுப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: கடவுள் செய்தவற்றை
  rationale: செயல்களின் உண்மையான கர்த்தாவாகக் கடவுளையே கிரேக்க உரை வெளிப்படையாக முன்வைப்பதைப் பாதுகாக்கிறது.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: பிற இனத்தாரிடையே
  rationale: இச்சூழலில் யூதரல்லாத மக்களைக் குறிக்கும் ἔθνη என்பதைக் காலத்திற்கேற்ற, புரிந்துகொள்ள எளிய தமிழில் தருகிறது; ‘நாடுகள்’ என்ற புவியியல் பொருளைத் தவிர்க்கிறது.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: தன் ஊழியத்தின் மூலம்
  rationale: διά உடன் வரும் உடைமை வேற்றுமையின் கருவி/வழி பொருளைத் தக்கவைத்து, பவுலின் சேவை கடவுளுடைய செயலுக்கான வழியாக இருந்ததை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் பிற இனத்தார் நடுவிலான பணியில் செயலாற்றியவர் யார்?
  choice: செய்தவர் கடவுள்; பவுலின் ஊழியம் அதற்கான வழி.
  alternative: பவுல் தாமே சாதித்தவற்றை அறிக்கையிட்டார்.
  rationale: ὁ θεὸς என்பது ἐποίησεν என்பதன் எழுவாய்; διὰ τῆς διακονίας αὐτοῦ என்பது பவுலின் ஊழியத்தை வழி அல்லது கருவியாகக் காட்டுகிறது. மொழிபெயர்ப்பு இறைச் செயலையும் மனித ஊழியத்தையும் உரையில் உள்ள உறவிலேயே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஊழியம்’ இச்சூழலில் சேவை/பணி என்ற பொருளில் பயன்படுத்தப்படுகிறது; குறிப்பிட்ட திருச்சபைப் பதவி எதையும் இறக்குமதி செய்யவில்லை. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
