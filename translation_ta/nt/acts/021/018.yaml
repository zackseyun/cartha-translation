revisions:
- from: மறுநாள் பவுல் எங்களுடன் யாக்கோபிடம் சென்றார்; மூப்பர்கள் அனைவரும் அங்கே வந்திருந்தார்கள்.[a]
  to: மறுநாள்[a] பவுல் எங்களுடன் யாக்கோபிடம் சென்றார்; மூப்பர்கள் அனைவரும் வந்தனர்.[b]
  rationale: The revision removes the unexpressed locative ‘there’ and avoids implying that the elders’ arrival necessarily preceded Paul’s. It renders παρεγένοντο with the straightforward ‘வந்தனர்,’ while the footnote preserves the contextually viable sense ‘were present.’ It also supplies the audit-trail lexical alternative for ‘மறுநாள்.’
