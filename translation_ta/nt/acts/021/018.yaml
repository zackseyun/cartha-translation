  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: ta
  text: மறுநாள்[a] பவுல் எங்களுடன் யாக்கோபிடம் சென்றார்; மூப்பர்கள் அனைவரும் வந்தனர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடுத்த நாள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மூப்பர்கள் அனைவரும் இருந்தனர்” அல்லது “மூப்பர்கள் அனைவரும் வந்து சேர்ந்தனர்.” கிரேக்க வினைச்சொல் வருகையையோ உடனிருப்பையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: மறுநாள்
  rationale: இந்த இறந்தகால வினையெச்சத் தொடர் ‘அடுத்த நாள்/மறுநாள்’ என்ற காலக் குறிப்பைக் காட்டும் மரபுத்தொடர். ‘மறுநாள்’ என்பது இயல்பான, சுருக்கமான நவீனத் தமிழ்.
- source_word: εἰσῄει
  choice: சென்றார்
  rationale: εἴσειμι என்ற வினை உள்ளே செல்லும் அல்லது ஒருவரிடம் சென்று சேரும் இயக்கத்தைக் குறிக்கிறது. யாக்கோபிடம் சந்திப்புக்குச் செல்லும் இச்சூழலில் ‘சென்றார்’ இயல்பாக உள்ளது; ‘உள்ளே சென்றார்’ என்று மொழிபெயர்த்தால் மூலத்தில் குறிப்பிடப்படாத கட்டடத்தைத் தெளிவுபடுத்தும் அபாயம் உண்டு.
- source_word: σὺν ἡμῖν
  choice: எங்களுடன்
  rationale: σύν + வேற்றுமை உருபு உடன்செல்லுதலை நேரடியாகக் குறிக்கிறது; ‘எங்களுடன்’ தெளிவான தமிழ் இணைச்சொல்.
- source_word: πρὸς Ἰάκωβον
  choice: யாக்கோபிடம்
  rationale: πρός இங்கு ஒருவரை நோக்கிச் செல்லுதலைக் குறிக்கிறது. ‘யாக்கோபிடம்’ என்பது கூடுதல் சந்திப்பு நோக்கத்தைச் சேர்க்காமல் அந்த இயக்கத்தை இயல்பாகத் தருகிறது.
- source_word: πάντες τε
  choice: அனைவரும்
  rationale: τέ மெல்லிய இணைப்பை வழங்குகிறது; தமிழில் அரைப்புள்ளியும் வாக்கிய அமைப்பும் அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துவதால் கூடுதல் இணைப்புச்சொல் தேவையில்லை.
- source_word: παρεγένοντο
  choice: அங்கே வந்திருந்தார்கள்
  rationale: παραγίνομαι வருதல், வந்து சேருதல், அல்லது உடனிருத்தல் ஆகிய நுணுக்கங்களைத் தாங்குகிறது. ‘வந்திருந்தார்கள்’ என்பது வருகையின் விளைவான உடனிருப்பை வெளிப்படுத்தி, மூலத்தின் இரு சாத்தியங்களையும் ஓரளவு காக்கிறது.
- source_word: οἱ πρεσβύτεροι
  choice: மூப்பர்கள்
  rationale: இச்சொல் எருசலேம் சபையின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது. ‘மூப்பர்கள்’ என்பது பிற்காலப் பிரிவுசார் பதவிப்பெயரைத் திணிக்காத, தமிழில் நிலைபெற்ற மொழிபெயர்ப்பு.
theological_decisions:
- issue: Ἰάκωβον என்பவரின் அடையாளமும் பங்கும்
  choice: விளக்க அடைமொழி சேர்க்காமல் ‘யாக்கோபு’ என்ற பெயரை மட்டும் பயன்படுத்துதல்
  alternative: ‘ஆண்டவரின் சகோதரனான யாக்கோபு’ அல்லது ‘எருசலேம் சபையின் தலைவரான யாக்கோபு’
  rationale: இவ்வசனம் அவருக்கு எந்த அடையாள அடைமொழியையும் தரவில்லை. சூழல் அவர் யார் என்பதை உணர்த்தினாலும், அதை முதன்மை உரையில் சேர்ப்பது மூலத்தைவிட அதிகம் கூறுவதாகும்.
- issue: οἱ πρεσβύτεροι என்பதன் சபைத் தலைமைப் பொருள்
  choice: ‘மூப்பர்கள்’ என்று பிரிவுசார் விளக்கமின்றி மொழிபெயர்த்தல்
  alternative: ‘குருக்கள்’ அல்லது பொதுவாக ‘சபைத் தலைவர்கள்’
  rationale: இந்தச் சொல் அங்கீகரிக்கப்பட்ட சபைத் தலைவர்களைக் குறித்தாலும், பிற்காலத் திருச்சபை அமைப்பொன்றின் குறிப்பிட்ட பதவியை இங்கு திணிக்கக் கூடாது. ‘மூப்பர்கள்’ மூலச் சொல்லின் பொருளையும் இறையியல் நடுநிலையையும் காக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு அணுக்கமான, dignified பொதுநடை பயன்படுத்தப்பட்டுள்ளது. ‘சென்றார்,’ ‘வந்திருந்தார்கள்’ என்ற மரியாதைப் பன்மை வடிவங்கள் வேதாகம நபர்களைக் குறிப்பிடும் இயல்பான தமிழ் நடையைப் பின்பற்றுகின்றன. மூலத்தில் இல்லாத யாக்கோபின் அடையாளமும் குறிப்பிட்ட திருச்சபைப் பதவியமைப்பும் சேர்க்கப்படவில்லை.
