source:
  edition: SBLGNT
  text: ἐπιμενόντων ⸀δὲ ἡμέρας πλείους κατῆλθέν τις ἀπὸ τῆς Ἰουδαίας προφήτης ὀνόματι Ἅγαβος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: ta
  text: நாங்கள் அங்கே மேலும் பல நாட்கள் தங்கியிருந்தபோது, அகபு என்னும் இறைவாக்கினர் ஒருவர் யூதேயாவிலிருந்து இறங்கி வந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: நாங்கள் அங்கே ... தங்கியிருந்தபோது
  rationale: நிகழ்காலப் பன்மை வினையெச்சம் காலத்தைக் குறிக்கும் genitive absolute அமைப்பில் உள்ளது. சூழலில் இதன் மறைமுக எழுவாய் பவுலும் அவருடைய பயணத் தோழர்களும் என்பதால், தமிழில் இயல்பாக ‘நாங்கள்’ என்று வெளிப்படுத்தப்பட்டது.
- source_word: δὲ
  choice: -இருந்தபோது
  rationale: δέ இங்கு மென்மையான உரைமாற்றத்தைக் குறிக்கிறது; காலப்பொருளுடைய வினையெச்ச அமைப்புடன் சேர்ந்து வருவதால் தமிழில் தனிச் சொல்லாக மொழிபெயர்க்காமல் ‘தங்கியிருந்தபோது’ என்பதில் இயல்பாக உட்பொதிக்கப்பட்டது.
- source_word: ἡμέρας πλείους
  choice: மேலும் பல நாட்கள்
  rationale: கால அளவைக் குறிக்கும் சொற்றொடர். πλείους என்பதன் ஒப்பீட்டு/கூடுதல் நிழற்பொருளை ‘மேலும்’ காக்கிறது; ‘பல நாட்கள்’ இயல்பான நவீனத் தமிழாக உள்ளது.
- source_word: κατῆλθέν
  choice: இறங்கி வந்தார்
  rationale: κατέρχομαι என்ற வினையின் திசைப் பொருளைத் தக்கவைத்து, யூதேயாவிலிருந்து கடற்கரைப் பகுதிக்கான பயணத்தையும் கதைசொல்லியின் இடநோக்கையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τις
  choice: ஒருவர்
  rationale: புதிய நபரை அறிமுகப்படுத்தும் குறிப்பற்ற சுட்டுப்பெயர். ‘இறைவாக்கினர் ஒருவர்’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் குறிப்பின்மையைத் தக்கவைத்தும் உள்ளது.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: யூதேயாவிலிருந்து
  rationale: மூலத்தின் இடத்தொடக்கப் பொருளை நேரடியாகக் கொடுக்கிறது; Ἰουδαία என்பதற்கான நிலையான தமிழ்ப் பெயராக ‘யூதேயா’ பயன்படுத்தப்பட்டது.
- source_word: προφήτης
  choice: இறைவாக்கினர்
  rationale: தீர்க்கதரிசனச் செய்தியை உரைப்பவரைக் குறிக்கும் பெயரை, நவீன வாசகர்களுக்கு புரியக்கூடிய, கண்ணியமான தமிழில் தருகிறது; இங்கு அந்த நபரின் அங்கீகரிக்கப்பட்ட பணியையே கதை குறிப்பிடுகிறது.
- source_word: ὀνόματι Ἅγαβος
  choice: அகபு என்னும்
  rationale: ὀνόματι என்ற பெயரிடும் மரபுத்தொடரை இயல்பான தமிழில் ‘என்னும்’ எனத் தந்து, Ἅγαβος என்பதைக் ‘அகபு’ என்று ஒலிபெயர்த்தது.
