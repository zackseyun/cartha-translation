  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: ta
  text: “அப்படியானால், சில நாட்களுக்கு முன்பு கலகத்தைத் தூண்டி, கொலையாளிகளான[a] அந்த நாலாயிரம் ஆண்களை வனாந்தரத்துக்குக் கூட்டிச் சென்ற எகிப்தியன் நீ அல்லவா?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குறுவாளேந்தியவர்கள்.’ கிரேக்கத்தில் ‘சிக்காரியர்’; மறைத்து வைத்த குறுவாள்களால் தாக்குவதற்காக அறியப்பட்ட ஒரு குழு.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: அப்படியானால் ... அல்லவா?
  rationale: பவுல் கிரேக்க மொழியில் பேசியதைக் கேட்டு படைத்தளபதி ஊகித்த முடிவை வினாவாக முன்வைக்கிறார். இந்த ஊகத்தையும் எதிர்மறை வினாவின் இயல்பையும் நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: ὁ Αἰγύπτιος
  choice: எகிப்தியன்
  rationale: குறிப்பிட்ட, ஏற்கெனவே அறியப்பட்ட ஒருவரைச் சுட்டுகிறது; தமிழில் ஒருமை அடையாளத்தை வாக்கிய அமைப்பே தெளிவாக்குகிறது.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: சில நாட்களுக்கு முன்பு
  rationale: அண்மையில் நிகழ்ந்ததைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் காலப் பொருளை மிகைப்படுத்தாமல் இயல்பாகத் தருகிறது.
- source_word: ἀναστατώσας
  choice: கலகத்தைத் தூண்டி
  rationale: வெறும் குழப்பத்தை அல்லாமல் அரசியல்-பொதுக் கிளர்ச்சியைத் தூண்டிய சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐξαγαγὼν
  choice: கூட்டிச் சென்ற
  rationale: ஒரு குழுவைத் தன்னுடன் ஓரிடத்திலிருந்து மற்றோர் இடத்துக்கு வழிநடத்திச் சென்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἰς τὴν ἔρημον
  choice: வனாந்தரத்துக்கு
  rationale: மணற்பாலை என்று குறுக்காமல், மக்கள் குடியிராத வறண்ட வெளியைக் குறிக்கும் சொல்லின் பரந்த பொருளைப் பேணுகிறது.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: அந்த நாலாயிரம் பேரை
  rationale: குறிப்பிட்ட குழுவைக் குறிக்கும் கிரேக்க சுட்டுத்தன்மையை ‘அந்த’ என்பதன் மூலம் பேணுகிறது; கலந்த அல்லது பொதுவான மனிதக் குழுவைக் குறிக்க இயல்பான ‘பேர்’ பயன்படுத்தப்படுகிறது.
- source_word: τῶν σικαρίων
  choice: கொலையாளிகளான
  rationale: மறைத்து வைத்த குறுவாள்களால் தாக்கிக் கொன்றதாக அறியப்பட்ட குழுவின் செயல்சார்ந்த பொருளை பொதுவாசகர்களுக்குத் தெளிவாகத் தருகிறது; வரலாற்றுப் பெயரும் சொற்பிறப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
