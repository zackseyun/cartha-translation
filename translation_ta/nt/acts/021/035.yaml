    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: அவன் ... அடைந்தபோது
  rationale: ὅτε காலத் தொடர்பை அறிமுகப்படுத்துகிறது; δέ இங்கு மென்மையான தொடரிணைப்பு என்பதால் தமிழில் தனியே மொழிபெயர்க்காமல் இயல்பான காலவாக்கியமாக வழங்கப்பட்டது.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: படிக்கட்டுகளை அடைந்தபோது
  rationale: γίνομαι + ἐπί இங்கு ஓர் இடத்தை வந்தடைவதைக் குறிக்கும் மரபுத்தொடர்; தமிழில் ‘அடைந்தபோது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀναβαθμούς
  choice: படிக்கட்டுகள்
  rationale: இச்சொல் மேலே செல்லும் படிகள் அல்லது படிக்கட்டுத் தொடரைக் குறிக்கிறது; சூழலில் கோட்டைக்குச் செல்லும் படிக்கட்டுகள் பொருந்துகின்றன.
- source_word: συνέβη βαστάζεσθαι
  choice: தூக்கிச் செல்ல வேண்டியதாயிற்று
  rationale: συνέβη விளைவாக ஏற்பட்ட நிலையைச் சுட்டுகிறது; தொடரும் செயலைக் குறிக்கும் நிகழ்காலச் செயலப்பாட்டு infinitive βαστάζεσθαι உடன், கூட்டத்தின் வன்முறையால் உருவான நடைமுறைத் தேவையை இந்த இயல்பான தமிழ் அமைப்பு வெளிப்படுத்துகிறது.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: படைவீரர்கள்
  rationale: செயப்பாட்டு வாக்கியத்தின் செய்பவர்களாக στρατιῶται குறிப்பிடப்படுகின்றனர்; தமிழ் வாக்கிய அமைப்பில் அவர்களை எழுவாயாகக் கொடுத்தாலும் மூலத்தின் பொருள் மாறாது.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: மக்கள் கூட்டத்தின் வன்முறை காரணமாக
  rationale: διά + வேற்றுமை வடிவம் காரணத்தைத் தெரிவிக்கிறது; βία என்பது இக்கலவரச் சூழலில் வன்முறையை, ὄχλος மக்கள் கூட்டத்தைச் சுட்டுகிறது.
