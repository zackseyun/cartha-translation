  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: ta
  text: அவன் படிக்கட்டுகளை அடைந்தபோது[a], மக்கள் கூட்டத்தின் வன்முறையினால் படைவீரர்கள் அவனைத் தூக்கிச் செல்ல வேண்டியதாயிற்று[b].
  philosophy: optimal-equivalence
