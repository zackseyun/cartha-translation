translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. ‘தூக்கிச் செல்ல வேண்டியதாயிற்று’ என்பது காரணத்தால் ஏற்பட்ட தேவையை இயல்பாக வெளிப்படுத்துகிறது; நேரடி செயப்பாட்டு மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் பகுதிகளுடன் இணைக்கப்பட்டுள்ளன.
