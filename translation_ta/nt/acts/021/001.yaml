id: ACT.21.1
reference: Acts 21:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: ta
  text: நாங்கள் அவர்களிடமிருந்து மனமில்லாமல் பிரிந்து கடலுக்குப் புறப்பட்ட பிறகு, நேராகப் பயணம் செய்து கோஸ்[a] சென்றடைந்தோம்; மறுநாள் ரோதோஸையும், அங்கிருந்து பட்டாராவையும் சென்றடைந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கோசு.’
    reason: transliteration_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: பிறகு
  rationale: இந்தக் கிரேக்கக் கதைநடைச் சொற்றொடர் அடுத்த நிகழ்வுக்கான காலத் தொடர்பை அறிமுகப்படுத்துகிறது; தமிழில் ‘பிறகு’ இயல்பாகவும் தெளிவாகவும் அதை வெளிப்படுத்துகிறது.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: அவர்களிடமிருந்து எங்களைப் பிரித்துக்கொண்டு
  rationale: ἀποσπάω என்பது சாதாரணமாகப் பிரிவதைக் காட்டிலும் வலிமையானது; மனவேதனையுடன் தம்மைப் பிரித்துக்கொண்ட சூழலை, தேவையற்ற விளக்கம் சேர்க்காமல் இந்தத் தொடர் உணர்த்துகிறது.
- source_word: ἀναχθῆναι
  choice: கடலுக்குப் புறப்பட்ட
  rationale: கடற்பயணச் சூழலில் ἀνάγω என்பது கப்பலில் கடலுக்குப் புறப்படுவதைக் குறிக்கிறது.
- source_word: εὐθυδρομήσαντες
  choice: நேராகக் கப்பலில் சென்று
  rationale: இந்தக் கடற்பயண வினைச்சொல் நேரான போக்கில் கப்பற்பயணம் செய்ததைக் குறிக்கிறது; தற்போதைய தமிழ் வாசகருக்கு இயல்பாக இருக்குமாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἤλθομεν εἰς
  choice: அடைந்தோம்
  rationale: பயண விவரிப்பில் ஓர் இடத்துக்கு வந்து சேர்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் ‘அடைந்தோம்’ தெரிவிக்கிறது.
- source_word: Κῶ
  choice: கோஸ்
  rationale: Κῶς என்ற தீவுப் பெயரின் மூலமொழி ஒலிக்கு அண்மையான நவீனத் தமிழ் ஒலிபெயர்ப்பு.
- source_word: τῇ δὲ ἑξῆς
  choice: மறுநாள்
  rationale: அடுத்த நாளைக் குறிக்கும் கிரேக்கக் காலச் சொற்றொடருக்கான இயல்பான, துல்லியமான தமிழ் வடிவம்.
- source_word: Ῥόδον
  choice: ரோதோஸ்
  rationale: Ῥόδος என்ற தீவுப் பெயரின் மூல வடிவத்தைத் தெளிவாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: κἀκεῖθεν
  choice: அங்கிருந்து
  rationale: καί + ἐκεῖθεν என்பதன் தொடர்ச்சியையும் அடுத்த பயணப் பகுதியின் தொடக்க இடத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: Πάταρα
  choice: பட்டாரா
  rationale: Πάταρα என்ற இடப்பெயரின் கிரேக்க உச்சரிப்பை அணுகும் தமிழ் ஒலிபெயர்ப்பு.
