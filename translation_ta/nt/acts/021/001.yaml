translation_notes:
  register: நவீன பொதுத்தமிழில், பயணக் கதைநடையின் வேகத்தையும் கண்ணியத்தையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. ἀποσπάω என்பதன் வலிமை முற்றிலும் மங்காதபடி ‘எங்களைப் பிரித்துக்கொண்டு’ பயன்படுத்தப்பட்டது; இடப்பெயர்கள் மூல கிரேக்க ஒலிக்கு அண்மையாக அமைக்கப்பட்டன.
