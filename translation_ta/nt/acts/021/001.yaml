    reason: transliteration_alternative
  revision_rationale: The revision replaces an unnatural reflexive construction with idiomatic modern Tamil that retains the force of the difficult parting, removes unexpressed geographic labels, and renders the direct sailing and sequential destinations concisely. The footnote is retained as a straightforward transliteration alternative.
