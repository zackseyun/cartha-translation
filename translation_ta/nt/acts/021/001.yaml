revisions:
- from: நாங்கள் அவர்களிடமிருந்து எங்களைப் பிரித்துக்கொண்டு கடலுக்குப் புறப்பட்ட பிறகு, நேராகக் கப்பலில் சென்று கோஸ்[a] தீவை அடைந்தோம். மறுநாள் ரோதோஸ் தீவையும், அங்கிருந்து பட்டாராவையும் அடைந்தோம்.
  to: நாங்கள் அவர்களிடமிருந்து மனமில்லாமல் பிரிந்து கடலுக்குப் புறப்பட்ட பிறகு, நேராகப் பயணம் செய்து கோஸ்[a] சென்றடைந்தோம்; மறுநாள் ரோதோஸையும், அங்கிருந்து பட்டாராவையும் சென்றடைந்தோம்.
  rationale: The revision replaces an unnatural reflexive construction with idiomatic modern Tamil that retains the force of the difficult parting, removes unexpressed geographic labels, and renders the direct sailing and sequential destinations concisely. The footnote is retained as a straightforward transliteration alternative.
