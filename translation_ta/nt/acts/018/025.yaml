id: ACT.18.25
reference: Acts 18:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: ta
  text: இவன் ஆண்டவரின் வழியைக் குறித்துப் போதிக்கப்பட்டிருந்தான். ஆவியில் அனல் கொண்டவனாய்[a], இயேசுவைப் பற்றியவற்றைத் துல்லியமாகப் பேசிவந்தான், போதித்துவந்தான்; யோவானின் திருமுழுக்கை மட்டுமே அறிந்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆவி’ என்பது அப்பொல்லோவின் சொந்த ஆவியைக் குறிக்கலாம்; அல்லது ‘பரிசுத்த ஆவியில் அனல் கொண்டவனாய்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηχημένος
  choice: போதிக்கப்பட்டிருந்தான்
  rationale: முன்னர் பெற்ற போதனையின் விளைவு தொடர்வதைக் காட்டும் நிறைவுற்ற செயப்பாட்டு வினையெச்சத்தின் பொருளைப் பாதுகாக்கிறது; பிற்காலத் திருச்சபைத் தொழில்நுட்பச் சொல்லைத் திணிக்கவில்லை.
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: ஆண்டவரின் வழி
  rationale: ஆரம்பக் கிறிஸ்தவச் சூழலில் ‘வழி’ என்பதற்குள்ள தனித்துவமான சொல்லாட்சியைப் பாதுகாத்து, κύριος என்பதை ‘ஆண்டவர்’ என வழங்குகிறது.
- source_word: ζέων τῷ πνεύματι
  choice: ஆவியில் அனல் கொண்டவனாய்
  rationale: ζέων என்பதிலுள்ள கொதிக்கும் அனல் மற்றும் தீவிர ஆர்வத்தின் படிமத்தைத் தக்கவைக்கிறது. ‘ஆவி’ என்பது அவனுடைய உள்ளார்ந்த ஆவியையோ தூய ஆவியையோ குறிக்கலாம்; அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: பேசிவந்தான், போதித்துவந்தான்
  rationale: இரண்டு வினைகளையும் தனித்தனியாகப் பாதுகாத்து, இறந்தகால நிறைவுறா வினைகளின் தொடர்ச்சியான செயலை ‘வந்தான்’ வடிவால் வெளிப்படுத்துகிறது.
- source_word: ἀκριβῶς
  choice: துல்லியமாக
  rationale: அவனுடைய போதனையின் சரியான தன்மையையும் நுட்பமான துல்லியத்தையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: இயேசுவைப் பற்றியவை
  rationale: இயேசுவைக் குறித்த அவனுடைய போதனையின் பொருளை தேவையின்றிக் குறுக்காமல் கிரேக்கச் சொற்றொடரின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: யோவானின் திருமுழுக்கை மட்டுமே அறிந்திருந்தான்
  rationale: μόνον என்பதிலுள்ள வரம்பைத் தெளிவாகக் காட்டுகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘ஆனால்’ அல்லது ‘இருந்தபோதிலும்’ என்ற இணைப்பைச் சேர்க்காமல் வினையெச்சத்தின் சூழ்நிலைப் பொருளை வழங்குகிறது.
theological_decisions:
- issue: ζέων τῷ πνεύματι என்பதில் τῷ πνεύματι யாரைக் அல்லது எதைக் குறிக்கிறது?
  choice: அப்பொல்லோவின் உள்ளார்ந்த ஆவி அல்லது மனவுறுதி என்பதற்கு இடமளிக்கும் ‘ஆவியில்’
  alternative: தூய ஆவியால் அல்லது தூய ஆவியில் அனல் கொண்டிருந்தான்
  rationale: கிரேக்கச் சொற்றொடர் மனிதனுடைய ஆவியையும் தூய ஆவியையும் இலக்கண ரீதியாக அனுமதிக்கிறது. தமிழ் எழுத்துமுறையில் ஆங்கிலம்போல் பெரிய/சிறிய எழுத்தால் வேறுபடுத்த முடியாததால், முதன்மை உரை ‘ஆவியில்’ என்று தெளிவின்மையைத் தக்கவைத்து, மாற்றுப் புரிதலை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: ἐπιστάμενος என்ற வினையெச்சத்துக்கும் முந்தைய கூற்றுக்கும் உள்ள தொடர்பு
  choice: வெளிப்படையான எதிர்மறை இணைப்பின்றி இணைத்தல்
  alternative: ‘அவன் யோவானின் திருமுழுக்கை மட்டுமே அறிந்திருந்தபோதிலும்’ என விட்டுக்கொடுப்பு உறவை வெளிப்படுத்துதல்
  rationale: சூழலில் ஒரு முரண்பாடு உணரப்பட்டாலும், கிரேக்கத்தில் ‘இருந்தபோதிலும்’ என்ற சொல் வெளிப்படையாக இல்லை. ஆகவே மூலத்தின் இலக்கணத் திறந்தநிலையை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கையாள்கிறது. ‘திருமுழுக்கு’ என்பது βάπτισμα என்பதன் செயற்படிமத்தைத் தக்கவைக்கும் பொதுவான வேதாகமச் சொல். அடிக்குறிப்பு குறி அது விளக்கும் ‘ஆவியில் அனல் கொண்டவனாய்’ என்ற சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
