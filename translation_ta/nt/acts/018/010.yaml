id: ACT.18.10
reference: Acts 18:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: ta
  text: ஏனெனில் நான் உன்னோடு இருக்கிறேன்; உனக்குத் தீங்கு செய்யும்படி ஒருவனும் உன்னைத் தாக்கமாட்டான்[a]. ஏனெனில் இந்த நகரத்தில் எனக்கு மக்கள் பலர் இருக்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உனக்குத் தீங்கு செய்ய ஒருவனும் உன்மேல் கைபோடமாட்டான்.’
    reason: lexical_alternative
  - marker: b
    text: ‘இந்த நகரத்தில் எனக்கு மக்கள் பலர் இருக்கிறார்கள்’ என்பது கொரிந்துவில் ஆண்டவருக்குரிய பலர் இருப்பதைக் குறிக்கலாம்; இன்னும் விசுவாசிக்கப்போகிறவர்களும் இதில் அடங்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தையும், பின்னர் வரும் வாக்குறுதிக்கான காரணத்தையும் அறிமுகப்படுத்தும் காரணப்பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: நான் உன்னோடு இருக்கிறேன்
  rationale: தெய்வீக உடனிருப்பின் உறுதியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. வெளிப்படையாக உள்ள ἐγώ என்பதன் வலியுறுத்தலை ‘நான்’ காக்கிறது.
- source_word: οὐδεὶς
  choice: ஒருவனும் ... மாட்டான்
  rationale: எவரும் செய்யமாட்டார்கள் என்ற முழுமையான மறுப்பைத் தமிழின் இயல்பான எதிர்மறை அமைப்பில் தருகிறது.
- source_word: ἐπιθήσεταί σοι
  choice: உன்னைத் தாக்கமாட்டான்
  rationale: இச்சூழலில் ἐπιτίθημι குறிக்கும் பகைமையான நடவடிக்கையை நேரடியாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது; ‘கைபோடுதல்’ என்பது சாத்தியமான மாற்று மொழிபெயர்ப்பு.
- source_word: τοῦ κακῶσαί σε
  choice: உனக்குத் தீங்கு செய்யும்படி
  rationale: தாக்குதலின் நோக்கம் அல்லது விளைவைச் சுட்டும் articular infinitive அமைப்பைத் தக்கவைத்து, உடல் காயம் மட்டுமல்லாத தீங்கையும் உள்ளடக்குகிறது.
- source_word: λαός
  choice: மக்கள்
  rationale: பேசுகிறவருக்குரிய ஒரு கூட்டத்தைக் குறிக்கும் சொல்லை, தமிழில் இயல்பான கூட்டுப்பெயராக வழங்குகிறது.
- source_word: ἐστί μοι
  choice: எனக்கு ... இருக்கிறார்கள்
  rationale: εἰμί உடன் வரும் உடைமைப் பொருளுள்ள μοι என்பதைத் தமிழின் இயல்பான உடைமை அமைப்பில் தருகிறது; சொந்தமானவர்கள் என்ற விளக்கத்தை முதன்மை உரையில் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: πολὺς
  choice: பலர்
  rationale: மக்களின் பெரும் எண்ணிக்கையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: இந்த நகரத்தில்
  rationale: கொரிந்து போன்ற நகர்ப்புற மையத்திற்கு πόλις என்பதன் பொருத்தமான நவீனத் தமிழ் இணை; ταύτῃ என்பதையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: இந்த நகரத்தில் ‘மக்கள் பலர்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘இந்த நகரத்தில் எனக்கு மக்கள் பலர் இருக்கிறார்கள்’ என்று மொழிபெயர்த்து, அவர்கள் ஆண்டவருக்குரியவர்கள் என்ற உறவை வெளிப்படுத்துகிறது; இன்னும் விசுவாசிக்கப்போகிறவர்களும் இதில் அடங்கலாம் என்பதை அடிக்குறிப்பில் மட்டும் குறிப்பிடுகிறது.
  alternative: ஏற்கெனவே பவுலுக்கு ஆதரவாக இருந்த பலரைப் பொதுவாகக் குறிக்கிறது என்று புரிந்துகொள்ளலாம்.
  rationale: λαός மற்றும் ἐστί μοι ஆகியவை வெறும் நகர மக்கள்தொகையைவிட ஆண்டவருக்குரிய மக்களைச் சுட்டுகின்றன. ஆயினும் அவர்கள் அனைவரும் ஏற்கெனவே விசுவாசித்தவர்களா அல்லது பின்னர் விசுவாசிக்கவிருப்பவர்களும் அடங்குகிறார்களா என்பதை மூலவாக்கியம் வெளிப்படையாகத் தீர்மானிக்கவில்லை; அந்தத் தெய்வியல் இழுபறி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ஒருமை உரையாடல் வடிவமான ‘உன்/உன்னை’ கிரேக்கத்தின் σοῦ/σοι/σε என்பவற்றைத் துல்லியமாகப் பிரதிபலிக்கிறது. இரண்டு διότι தொடர்களும் ‘ஏனெனில்’ என்று மீளத் தரப்பட்டு, வாக்கியத்தின் காரணத் தொடர் பாதுகாக்கப்பட்டுள்ளது.
