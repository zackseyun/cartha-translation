source:
  edition: SBLGNT
  text: καὶ διὰ τὸ ὁμότεχνον εἶναι ἔμενεν παρ’ αὐτοῖς καὶ ⸀ἠργάζετο, ἦσαν γὰρ σκηνοποιοὶ ⸂τῇ τέχνῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: ta
  text: அவர் அவர்களைப் போலவே அதே தொழிலைச் செய்தவர் என்பதால், அவர்களோடு தங்கி வேலை செய்தார். அவர்கள் தொழிலாகக் கூடாரங்கள் தயாரிப்பவர்கள்[a] ஆக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோல் வேலை செய்பவர்கள்.” கிரேக்கச் சொல் கூடாரங்கள் தயாரிப்பவர்களையோ, அதனுடன் தொடர்புடைய பரந்த கைவினைத் தொழில் செய்பவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: அவர் அவர்களுடைய அதே தொழிலைச் சேர்ந்தவராக இருந்ததால்
  rationale: διά உடன் வரும் பெயர்ச்சொல் தன்மையுள்ள infinitive காரணத்தைக் குறிக்கிறது. ὁμότεχνος ஒரே தொழில் அல்லது கைவினையைச் சேர்ந்தவர் என்னும் பொருளைத் தருகிறது; அடுத்த பகுதியில் தொழில் குறிப்பிடப்படுவதற்கு முன்பே அதை மிகையாக விளக்காமல் இச்சொற்றொடர் காரணத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: அவர்களோடு தங்கி
  rationale: μένω இச்சூழலில் ஒருவரோடு வசித்தல் அல்லது தங்கியிருத்தலைக் குறிக்கிறது. இயல்பான நவீன தமிழில் “அவர்களோடு தங்கி” என்பது தெளிவாக உள்ளது.
- source_word: ἠργάζετο
  choice: வேலை செய்தார்
  rationale: ἐργάζομαι இங்கு தொழில் சார்ந்த உழைப்பைக் குறிக்கிறது. Imperfect வடிவம் தொடர்ந்த செயலைச் சுட்டினாலும், தமிழ் கதைநடையில் “தங்கி வேலை செய்தார்” என்பதே இயல்பாக அந்தப் பின்னணியை வெளிப்படுத்துகிறது.
- source_word: σκηνοποιοὶ
  choice: கூடாரத் தயாரிப்பாளர்கள்
  rationale: இச்சொல்லின் மரபானதும் மிகவும் சாத்தியமானதுமான பொருள் கூடாரங்களைத் தயாரிப்பவர்கள் என்பதாகும். தோல் வேலை உள்ளிட்ட தொடர்புடைய பரந்த கைவினைப் பொருள் இருக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τῇ τέχνῃ
  choice: தொழிலால்
  rationale: τέχνη கைவினை, திறத்தொழில் அல்லது தொழிலைச் சுட்டுகிறது. இங்குள்ள dative பயன்பாட்டை “தொழிலால்” என்று மொழிபெயர்ப்பது, கூடாரம் தயாரிப்பது அவர்களின் வாழ்வாதாரத் தொழில் என்பதைச் சுருக்கமாகத் தெரிவிக்கிறது.
