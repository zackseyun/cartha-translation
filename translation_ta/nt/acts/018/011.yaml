  text: ἐκάθισεν ⸀δὲ ἐνιαυτὸν καὶ μῆνας ἓξ διδάσκων ἐν αὐτοῖς τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: ta
  text: ஆகவே அவர் அங்கே ஓர் ஆண்டும் ஆறு மாதங்களும் தங்கி, அவர்களிடையே கடவுளுடைய வார்த்தையைப் போதித்துவந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: தங்கி
  rationale: இவ்வினைச்சொல்லின் நேரடிப் பொருள் ‘அமர்ந்தார்’ என்றாலும், இக்கதைச் சூழலில் ஒரு குறிப்பிட்ட காலம் ஓரிடத்தில் தங்கியிருந்ததை இயல்பாகக் குறிக்கிறது.
- source_word: δὲ
  choice: ஆகவே
  rationale: இது மென்மையான இணைப்புச்சொல்; முந்தைய வசனத்தில் கிடைத்த தெய்வீக ஊக்கத்தைத் தொடர்ந்து பவுல் அங்கே தங்கியதைச் சூழல் காட்டுவதால் ‘ஆகவே’ பொருத்தமாகிறது.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: ஓர் ஆண்டும் ஆறு மாதங்களும்
  rationale: காலநீட்சியைக் குறிக்கும் இச்சொற்றொடரைத் துல்லியமாகவும் இயல்பான நவீனத் தமிழிலும் வழங்குகிறது.
- source_word: διδάσκων
  choice: போதித்துவந்தார்
  rationale: பவுல் தங்கியிருந்த காலம் முழுவதும் தொடர்ந்த உடன்நிகழ் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν αὐτοῖς
  choice: அவர்களிடையே
  rationale: சமூகத்தின் நடுவில் அவர் செய்த போதனைப் பணியை, ‘அவர்களுக்குள்’ என்ற தவறான உட்பொருள் எழாமல் இயல்பாகக் காட்டுகிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தையை
  rationale: அப்போஸ்தலர் நடபடிகளில் தேவனிடமிருந்து அறிவிக்கப்படும் செய்தியைக் குறிக்கும் நிலைபெற்ற வேதாகமச் சொல்லாட்சியையும் அதன் இறையியல் செறிவையும் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘போதித்துவந்தார்’ என்பது கிரேக்க நிகழ்காலப் பங்கேற்பு வினையின் தொடர்ச்சியைக் காட்டுகிறது; தேவையற்ற விளக்கமோ பிரிவுசார் சொல்லாட்சியோ சேர்க்கப்படவில்லை.
