revisions:
- from: அவர் செசரியாவுக்குச் சென்றடைந்தபின், மேலே சென்று திருச்சபையினரை வாழ்த்திவிட்டு,[a] அந்தியோகியாவுக்குச் சென்றார்.
  to: அவர் செசரியாவுக்கு இறங்கிச் சென்று, மேலே சென்று திருச்சபையை வாழ்த்திவிட்டு,[a] அந்தியோகியாவுக்கு இறங்கிச் சென்றார்.
  rationale: மூலத்தின் திசைமொழியான κατελθών, ἀναβὰς, κατέβη ஆகிய மூன்றையும் ‘இறங்கிச் சென்று, மேலே சென்று, இறங்கிச் சென்றார்’ எனக் காக்கப்பட்டுள்ளது. ‘மேலே சென்று’ என்பதன் இலக்கு உரையில் சொல்லப்படாமல் விடப்பட்டுள்ளது; அடிக்குறிப்பு மட்டுமே எருசலேம் என்ற சாத்தியமான குறிப்பை விளக்குகிறது. ‘திருச்சபையை’ என்பது τὴν ἐκκλησίαν என்ற ஒருமைச் சமூகக் குறிப்புக்கு நெருக்கமானது.
