source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: ta
  text: அவர் செசரியாவுக்கு இறங்கிச் சென்று, மேலே சென்று திருச்சபையை வாழ்த்திவிட்டு,[a] அந்தியோகியாவுக்கு இறங்கிச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு குறிப்பிடப்படுவது எருசலேமிலிருந்த திருச்சபையாக இருக்கலாம். பல மொழிபெயர்ப்புகள் ‘எருசலேம்’ என்பதை வெளிப்படையாகச் சேர்க்கின்றன; ஆனால் கிரேக்க மூல உரையில் அந்த இடப்பெயர் இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: சென்றடைந்தபின்
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது. கிரேக்கத்தின் திசைச்சொல்லைச் சொற்சொல்லாக மொழிபெயர்த்தால் தமிழில் இயல்பற்ற அல்லது தவறாகப் புரியக்கூடிய வடிவம் உருவாகும் என்பதால், பயணத்தின் முடிவை இயல்பாகக் கூறுகிறது.
- source_word: Καισάρειαν
  choice: செசரியா
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு; சூழலில் கடற்கரைச் செசரியாவைக் குறிக்கிறது.
- source_word: ἀναβὰς
  choice: மேலே சென்று
  rationale: செல்லுமிடத்தைச் சேர்க்காமல், மூலத்தின் திசை உணர்வையும் அதன் மறைபொருள் நிலையையும் காக்கிறது.
- source_word: ἀσπασάμενος
  choice: வாழ்த்திவிட்டு
  rationale: சந்தித்து வாழ்த்துதல் என்ற இயல்பான பொருளைத் தருகிறது; ‘வரவேற்றார்’ அல்லது ‘சென்று பார்த்தார்’ என்பவற்றைவிடக் குறைவான விளக்கச் சேர்க்கை கொண்டது.
- source_word: τὴν ἐκκλησίαν
  choice: திருச்சபையினரை
  rationale: ἐκκλησία இங்கு கிறிஸ்தவ விசுவாசிகளின் சமூகத்தைக் குறிக்கிறது. தமிழில் மனிதர்களை வாழ்த்துவது இயல்பானதால், சமூக உறுப்பினர்களைக் குறிக்கும் பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: κατέβη
  choice: சென்றார்
  rationale: ‘கீழே சென்றார்’ என்ற கிரேக்கத் திசைமொழி தமிழில் இங்கு இயல்பற்றதாகவும் நிலவியல் திசையாகத் தவறாகப் புரியக்கூடியதாகவும் இருப்பதால், பயணத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: Ἀντιόχειαν
  choice: அந்தியோகியா
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு; இச்சூழலில் சிரியாவின் அந்தியோகியாவைக் குறிக்கிறது.
theological_decisions:
- issue: ‘மேலே சென்று’ என்பதன் மறைமுக இலக்கு எருசலேமா?
  choice: முதன்மை உரையில் செல்லுமிடத்தை வெளிப்படையாகச் சொல்லாமல் விடுதல்
  alternative: ‘எருசலேமுக்குச் சென்று’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: செசரியாவிலிருந்து மேலே சென்று ‘திருச்சபையை’ வாழ்த்திவிட்டு அந்தியோகியாவுக்குச் சென்ற பயண வரிசை எருசலேமை வலுவாகச் சுட்டுகிறது. எனினும், கிரேக்க உரையில் எருசலேம் பெயரிடப்படவில்லை; ஆகவே மறைமுகக் குறிப்பை முதன்மை உரை தீர்மானித்து விடாமல், அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பயணத் திசைமொழியில் பொருள் தெளிவாகவும் தமிழில் இயல்பாகவும் இருக்கும் ‘மேலே சென்று’ மட்டும் காக்கப்பட்டுள்ளது; மற்ற இடங்களில் சொற்சொல் திசைமொழியைவிட இயல்பான பயண வினைகள் தேர்ந்தெடுக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி அதனுடன் தொடர்புடைய ‘திருச்சபையினரை வாழ்த்திவிட்டு’ என்ற தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
