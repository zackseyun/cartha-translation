translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் இயல்பாக வாசிக்கும்படி வாக்கியம் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட அறிமுக வாக்கியம் தமிழின் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கருத்துறவுகள் அப்படியே காக்கப்பட்டுள்ளன.
