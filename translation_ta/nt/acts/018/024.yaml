id: ACT.18.24
reference: Acts 18:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰουδαῖος δέ τις Ἀπολλῶς ὀνόματι, Ἀλεξανδρεὺς τῷ γένει, ἀνὴρ λόγιος, κατήντησεν εἰς Ἔφεσον, δυνατὸς ὢν ἐν ταῖς γραφαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: ta
  text: அப்பொல்லோ என்னும் யூதர் ஒருவர் எபேசுவுக்கு வந்தார். அவர் பிறப்பால் அலெக்சாந்திரியர்; பேச்சாற்றல் மிக்கவர்[a], வேதநூல்களில் வல்லவராகவும் இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கல்வியறிவு மிக்கவர்’ என்றும் மொழிபெயர்க்கலாம்; λόγιος என்ற கிரேக்கச் சொல் பேச்சாற்றலையோ கல்வியறிவையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: யூதர்
  rationale: இங்கு புவியியல் சார்ந்த ‘யூதேயர்’ என்பதைக் காட்டிலும், அப்பொல்லோவின் இன-சமய அடையாளத்தைக் குறிக்கிறது.
- source_word: δέ τις
  choice: ஒருவர்
  rationale: δέ புதிய கதைப்பகுதிக்கான மென்மையான மாற்றத்தைக் குறிக்கிறது; தமிழில் தனியான இணைப்புச்சொல் இல்லாமலே இயல்பாக அமைகிறது. τις என்பதன் அறிமுகப்படுத்தும் உறுதியின்மை ‘ஒருவர்’ என்பதில் வெளிப்படுகிறது.
- source_word: Ἀπολλῶς ὀνόματι
  choice: அப்பொல்லோ என்னும்
  rationale: ஒருவரின் பெயரை அறிமுகப்படுத்தும் கிரேக்க மரபுத்தொடருக்கான இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: பிறப்பால் அலெக்சாந்திரியர்
  rationale: அவருடைய பிறப்பிடம் அல்லது பூர்வீகத் தொடர்பைத் தெரிவிக்கிறது; நவீன சூழலில் தவறாகப் புரிந்துகொள்ளக்கூடிய இனவகைப் பதத்தைத் தவிர்க்கிறது.
- source_word: ἀνὴρ λόγιος
  choice: பேச்சாற்றல் மிக்கவர்
  rationale: λόγιος என்பதற்கு ‘சொல்வன்மையுள்ளவர்’ அல்லது ‘கல்வியறிவுள்ளவர்’ என்ற இரு பொருள்களும் இருக்கலாம். முதன்மைப் பொருளாக பேச்சாற்றல் தேர்ந்தெடுக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: எபேசுவுக்கு வந்தார்
  rationale: இலக்கை அடைந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: திருமறை நூல்களில் வல்லவர்
  rationale: δυνατός என்பதன் வலிமையான திறன் உணர்வை ‘வல்லவர்’ காக்கிறது; γραφαί இங்கு யூதப் புனித நூல்களைக் குறிப்பதால் ‘திருமறை நூல்கள்’ என வழங்கப்படுகிறது.
