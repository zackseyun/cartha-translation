  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: ta
  text: 'ஒரு இரவில், ஆண்டவர் பவுலிடம் ஒரு தரிசனத்தின் மூலம்[a] கூறினார்: “பயப்படாதே; தொடர்ந்து பேசு; மௌனமாக இருக்காதே.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு தரிசனத்தில்.” கிரேக்கத்தில், “ஒரு தரிசனத்தின் வழியாக” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான இறையியல் பட்டப்பெயரைத் தக்கவைக்கிறது; பேசியவர் இயேசு என்று விளக்கமாகச் சேர்க்காமல் மூலத்தின் சொல்வடிவத்தைக் காக்கிறது.
- source_word: ἐν νυκτὶ
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: δι’ ὁράματος
  choice: ஒரு தரிசனத்தின் வழியாக
  rationale: διά உடன் வரும் ஆறாம் வேற்றுமை வடிவத்தின் வழிமுறை அல்லது ஊடகப் பொருளைப் பாதுகாக்கிறது; ‘ஒரு தரிசனத்தில்’ என்பது இயல்பான மாற்று என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Μὴ φοβοῦ
  choice: பயப்படாதே
  rationale: தடை கட்டளையின் வலிமையை இயல்பான ஒருமை நேரடி அழைப்பில் வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ λάλει
  choice: தொடர்ந்து பேசு
  rationale: நிகழ்காலக் கட்டளையின் தொடர்ச்சியான செயற்பாட்டு நுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ μὴ σιωπήσῃς
  choice: மௌனமாக இருக்காதே
  rationale: பேசுவதை நிறுத்த வேண்டாம் என்ற இணைத் தடையை இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பவர் யார்?
  choice: மூலத்தில் உள்ள பட்டப்பெயரை மட்டும் பின்பற்றி ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ஆண்டவராகிய இயேசு
  rationale: அப்போஸ்தலர் நடபடிகளில் இச்சொல் உயிர்த்தெழுந்த இயேசுவைக் குறிப்பது இயல்பானதாக இருந்தாலும், இவ்வசனம் ὁ κύριος என்று மட்டுமே கூறுகிறது. ஆகவே உரையில் இல்லாத முழுமையான அடையாளத்தைச் சேர்க்காமல் கிறிஸ்துவியல் நிறையையும் மூலத்தின் அளவையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘தொடர்ந்து பேசு’ என்பது கட்டளையின் நீடித்த செயற்பாட்டை வெளிப்படுத்துகிறது; ‘மௌனமாக இருக்காதே’ அதனுடன் இணைந்த தடையை இயல்பாகக் காக்கிறது.
