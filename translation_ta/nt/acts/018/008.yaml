source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: ta
  text: ஆனால் யூத வழிபாட்டுக்கூடத் தலைவரான கிறிஸ்பு, தன் குடும்பத்தார் அனைவருடனும் ஆண்டவர்மீது நம்பிக்கை வைத்தார். கேட்டுக்கொண்டிருந்த கொரிந்தியர் பலர் நம்பிக்கை வைத்துக்கொண்டும் திருமுழுக்கு பெற்றுக்கொண்டும் இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது இயல்பாக, “கொரிந்தியர் பலர் கேட்டபின் நம்பிக்கை வைத்து திருமுழுக்கு பெற்றார்கள்” என மொழிபெயர்க்கலாம். கிரேக்கத்தின் நிகழ்நிலைப் பங்கேற்புவினையும் நிறைவுறா இறந்தகால வினைகளும் அவர்களுடைய பதில் தொடர்ந்து நிகழ்ந்துகொண்டிருந்ததைச் சித்தரிக்கின்றன.
    reason: கிரேக்க வினைவடிவங்களின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழும் தன்மையையும், இயல்பான தமிழில் வழங்கக்கூடிய மாற்று வடிவத்தையும் காட்டுதல்.
lexical_decisions:
- source_word: Κρίσπος
  choice: கிறிஸ்பு
  rationale: தனிப்பட்ட பெயரைத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: ἀρχισυνάγωγος
  choice: யூத வழிபாட்டுக்கூடத் தலைவர்
  rationale: யூதரின் synagogue என்பதையும் அதன் தலைமைப் பொறுப்பையும் சாதாரண வாசகர்களுக்குத் தெளிவாகக் காட்டுகிறது; நிர்வாக விவரங்களை மேலதிகமாக ஊகிக்கவில்லை.
- source_word: ἐπίστευσεν
  choice: நம்பிக்கை வைத்தார்
  rationale: கிறிஸ்புவின் நம்பிக்கைச் செயலை நேரடியாகக் குறிக்கிறது; ‘விசுவாசத்திற்கு வந்தார்’ போன்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவர்மீது
  rationale: πιστεύω என்பதுடன் வரும் இறைவேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; κύριος என்பதை மூலத்தில் இருப்பதுபோல ‘ஆண்டவர்’ என்ற பட்டமாகவே வைக்கிறது.
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: தன் குடும்பத்தார் அனைவருடனும்
  rationale: σύν என்பதன் உடனிணைவையும், οἶκος என்பதன் குடும்ப/குடும்பத்தார் பொருளையும், ὅλος என்பதன் முழுமையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: கொரிந்தியர் பலரும்
  rationale: பகுதிப்பொருள் கொண்ட கிரேக்க அமைப்பை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ἀκούοντες
  choice: கேட்டபோது
  rationale: கேட்டதையும் அதனைத் தொடர்ந்து ஏற்பட்ட பதிலையும் இயல்பான தமிழில் இணைக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத கேட்புப் பொருளைச் சேர்க்கவில்லை.
- source_word: ἐπίστευον
  choice: நம்பிக்கை வைத்து
  rationale: பல கொரிந்தியரின் நம்பிக்கைப் பதிலைத் தெளிவாகத் தருகிறது; இறந்தகாலத்தின் விரிவடைந்த நிகழ்வுத் தன்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ἐβαπτίζοντο
  choice: திருமுழுக்கு பெற்றார்கள்
  rationale: செயப்பாட்டு வடிவத்தை ‘பெற்றார்கள்’ என்பதன்மூலம் காக்கிறது; வாசிக்க இயல்பான தமிழைப் பயன்படுத்துகிறது, நிகழ்வு தொடர்ச்சியாக நடந்ததை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: ‘தன் குடும்பத்தார் அனைவருடனும்’ என்பதில் குடும்ப நம்பிக்கையின் வரம்பு
  choice: கிரேக்க வாசகத்தை நேரடியாகப் பின்பற்றி, குடும்பத்தார் அனைவரும் கிறிஸ்புவுடன் இணைந்ததாகக் கூறுதல்; ஒவ்வொருவரின் நம்பிக்கை அனுபவத்தை மேலும் விளக்காதிருத்தல்
  alternative: ஒவ்வொரு குடும்ப உறுப்பினரும் தனிப்பட்ட முறையில் நம்பிக்கை வைத்ததாக வெளிப்படையாகக் கூறுதல்; அல்லது குடும்பத்தைப் பற்றிய கூட்டுச் சுருக்கம் மட்டுமே என்று விளக்குதல்
  rationale: மூலம் குடும்பத்தாரின் உடனிணைவைச் சொல்கிறது; ஆனால் தனிநபர் நம்பிக்கை அல்லது குடும்பத் திருமுழுக்கு பற்றிய நடைமுறையை விரிவாக விளக்கவில்லை. எனவே அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
- issue: ‘ஆண்டவர்’ என்பவரின் அடையாளம்
  choice: κύριος என்பதை ‘ஆண்டவர்’ என்றே மொழிபெயர்த்தல்
  alternative: ‘ஆண்டவராகிய இயேசு’ என்று விரிவாக்குதல்
  rationale: அப்போஸ்தலர் பணிகள் நூலின் சூழலில் இது இயேசுவைக் குறித்தாலும், இவ்வசனத்தின் கிரேக்க மூலம் κύριος என்ற பட்டத்தை மட்டுமே கொண்டுள்ளது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘யூத வழிபாட்டுக்கூடம்’ என்பது synagogue என்ற பண்பாட்டு அமைப்பைத் தெளிவுபடுத்துகிறது. ‘திருமுழுக்கு’ என்பது βαπτίζω என்பதற்கான சுருக்கமான, நிலையான தமிழ் கிறிஸ்தவச் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; குடும்ப நம்பிக்கை அல்லது திருமுழுக்கு குறித்த எந்தப் பிரிவுசார் முடிவும் சேர்க்கப்படவில்லை.
