source:
  edition: SBLGNT
  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: ta
  text: அப்போது அவர்கள் எல்லாரும் ஜெபக்கூடத் தலைவரான சொஸ்தேனேயைப்[a] பிடித்து, நீதிமன்ற மேடையின் முன்பாக அடித்துக்கொண்டிருந்தார்கள். ஆனால் கல்லியோ இவற்றில் எதையும் பொருட்படுத்தவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘அவர்கள் எல்லாரும்’ என்பதற்குப் பதிலாக ‘கிரேக்கர்கள் எல்லாரும்’ என்று உள்ளது. பழமையான உரை சுருக்கமாக இருப்பதால், அந்தக் குழுவினர் யார் என்று குறிப்பிடப்படவில்லை.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: பிடித்து
  rationale: ἐπιλαμβάνομαι என்பதன் பகைமையான சூழலுக்குரிய ‘பற்றிப் பிடித்தல்’ என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πάντες
  choice: அவர்கள் எல்லாரும்
  rationale: கிரேக்கத்தில் குழுவின் அடையாளம் கூறப்படாமல் உள்ளபடியே வைத்து, πάντες என்பதன் முழுமைப்படுத்தும் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: ἀρχισυνάγωγον
  choice: ஜெபக்கூடத் தலைவர்
  rationale: யூத ஜெபக்கூடத்தின் முன்னணி பொறுப்பாளரைக் குறிக்கும் பதவிப் பெயரைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: ἔτυπτον
  choice: அடித்துக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால imperfect வடிவம் காட்டும் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த தாக்குதலை வெளிப்படுத்துகிறது.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: நீதிமன்ற மேடைக்கு முன்பாக
  rationale: βῆμα என்பது ஆளுநர் அமர்ந்து விசாரித்த அதிகாரப்பூர்வ நீதிமன்ற மேடை; சட்டச் சூழலையும் இடத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: இவற்றில் எதையும் பொருட்படுத்தவில்லை
  rationale: ‘இவற்றில் எதுவும் அவருக்குக் கவலையாக இருக்கவில்லை’ என்ற கிரேக்கச் சொற்றொடரின் பொருளை இயல்பாகவும், மிகைப்படுத்தாமலும் வழங்குகிறது.
- source_word: δέ
  choice: அப்போது
  rationale: இங்கே கதையின் அடுத்த நிகழ்வுக்கான நகர்வைக் குறிக்கிறது.
- source_word: καί
  choice: ஆனால்
  rationale: கூட்டத்தின் வன்முறைக்கும் கல்லியோவின் அக்கறையின்மைக்கும் இடையிலான சூழல்சார் முரணை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πάντες (‘எல்லாரும்’) என்போர் யார்?
  choice: முதன்மை உரையைப் போலவே குழுவின் அடையாளத்தைக் குறிப்பிடாமல் ‘அவர்கள் எல்லாரும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கிரேக்கர்கள் எல்லாரும்’; அல்லது சூழலை அடிப்படையாகக் கொண்டு வேறு குழுவை வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: SBLGNT உரையில் வெளிப்படையான எழுவாய் இல்லாமல் πάντες மட்டுமே உள்ளது. சில கையெழுத்துப் பிரதிகள் ‘கிரேக்கர்கள் எல்லாரும்’ என்று விரிவாக்குகின்றன. ஆதார உரை விட்டுள்ள தெளிவின்மையை மொழிபெயர்ப்பு தீர்மானித்துவிடக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஜெபக்கூடம்’ யூத வழிபாட்டிடத்தையும், ‘நீதிமன்ற மேடை’ βῆμα என்பதன் சட்ட மற்றும் இடவியல் பொருளையும் தெளிவுபடுத்துகின்றன. மூலத்தில் குறிப்பிடப்படாத கூட்டத்தின் அடையாளம் திட்டமிட்டு திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
