id: ACT.18.2
reference: Acts 18:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: ta
  text: அங்கே, பொந்து நாட்டைச் சேர்ந்த ஆக்கில்லா என்னும் யூதர் ஒருவரை அவர் கண்டார். கிளவுதியு, யூதர்கள் அனைவரும் உரோமையிலிருந்து வெளியேற வேண்டும் என்று கட்டளையிட்டிருந்ததால், ஆக்கில்லா தம் மனைவி பிரிஸ்கில்லாவுடன் அண்மையில் இத்தாலியிலிருந்து வந்திருந்தார். அவர் அவர்களிடம் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρών
  choice: கண்டார்
  rationale: இறந்தகாலப் பெயரெச்சம் பவுலின் அடுத்த செயலை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான தொடர் வாக்கியமாக ‘கண்டார்’ என்று வழங்கப்பட்டது.
- source_word: τινα Ἰουδαῖον
  choice: யூதர் ஒருவர்
  rationale: τις குறிப்பிட்டுப் பெயரிடப்படவிருக்கும் ஒருவரை அறிமுகப்படுத்துகிறது; மரியாதையான நவீனத் தமிழில் ‘யூதர் ஒருவர்’ இயல்பானது.
- source_word: ὀνόματι Ἀκύλαν
  choice: ஆக்கில்லா என்னும்
  rationale: ஒருவரின் பெயரை அறிமுகப்படுத்தும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் அமைப்பு.
- source_word: Ποντικὸν τῷ γένει
  choice: பொந்து நாட்டைச் சேர்ந்த
  rationale: பிறப்பு அல்லது பூர்வீக நிலப்பகுதியைக் குறிக்கிறது; ‘சேர்ந்த’ என்பது இரண்டையும் தேவையின்றி குறுக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: அண்மையில் இத்தாலியிலிருந்து வந்திருந்தார்
  rationale: நிறைவுக்காலப் பெயரெச்சம் முதன்மை நிகழ்வுக்கு முன் நடந்த அண்மைய வருகையையும் அதன் தற்போதைய தொடர்பையும் காட்டுகிறது; ‘வந்திருந்தார்’ அந்த முன்னிகழ்வைத் தக்கவைக்கிறது.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: தம் மனைவி பிரிஸ்கில்லாவுடன்
  rationale: பிரிஸ்கில்லா ஆக்கில்லாவுடன் இத்தாலியிலிருந்து வந்தார் என்பதைக் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: கிலவுதியு ... என்று கட்டளையிட்டிருந்ததால்
  rationale: διά உடனான வினையெச்ச அமைப்பு காரணத்தைக் குறிக்கிறது; διατάσσω பேரரசரின் அதிகாரப்பூர்வ ஆணையைச் சுட்டுகிறது.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: யூதர்கள் அனைவரும் உரோமையைவிட்டு வெளியேற வேண்டும்
  rationale: χωρίζεσθαι ἀπό என்பது உரோமையிலிருந்து பிரிந்து செல்லுதலைக் கூறுகிறது. ‘வெளியேற வேண்டும்’ என்பது இயல்பான தமிழாக இருந்து, ‘வெளியேற்றப்பட வேண்டும்’ என்ற வலுவான விளக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: προσῆλθεν αὐτοῖς
  choice: பவுல் அவர்களிடம் சென்றார்
  rationale: வினைச்சொல் அவர்களிடம் அணுகிச் சென்றதைக் குறிக்கிறது. நீண்ட தமிழ் வாக்கியத்துக்குப் பின் எழுவாயின் தெளிவுக்காகச் சூழலில் உள்ள பவுலின் பெயர் மீண்டும் சொல்லப்படுகிறது.
theological_decisions:
- issue: Ἰουδαῖον / Ἰουδαίους என்பவற்றின் பொருள்
  choice: யூதர் / யூதர்கள்
  alternative: யூதேயர் / யூதேயர்கள்
  rationale: இங்கு கிலவுதியுவின் ஆணையால் உரோமையிலிருந்து செல்ல வேண்டிய யூத மக்களைக் குறிக்கிறது; யூதேயா பகுதியின் குடியிருப்பாளர்களை மட்டும் குறிக்கவில்லை.
- issue: χωρίζεσθαι என்பதன் வினைநிலை மற்றும் ஆணையின் வலிமை
  choice: வெளியேற வேண்டும்
  alternative: வெளியேற்றப்பட வேண்டும்
  rationale: கிரேக்கச் சொல் அடிப்படையில் ‘பிரிக்கப்படுதல்/பிரிந்து செல்லுதல்’ என்ற இடைவெளியை அனுமதிக்கிறது. அரசாணை வெளியேற்றத்தை நடைமுறையில் குறித்திருக்கலாம்; ஆனால் அந்த வலுவான செயப்பாட்டு விளக்கத்தை முதன்மை உரை கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது. இடப்பெயர்களும் தனிப்பெயர்களும் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் வழங்கப்பட்டுள்ளன.
