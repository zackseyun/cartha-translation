translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் சுட்டுப்பெயர்களும் ‘தாமே’ என்ற அழுத்தமும் பாதுகாக்கப்பட்டுள்ளன; சூழலிலிருந்து வரும் பெயர்கள் முதன்மை உரைக்குள் சேர்க்கப்படாமல் அடிக்குறிப்பில் மட்டும் விளக்கப்பட்டுள்ளன.
