source:
  edition: SBLGNT
  text: ⸀κατήντησαν δὲ εἰς Ἔφεσον, κἀκείνους κατέλιπεν αὐτοῦ, αὐτὸς δὲ εἰσελθὼν εἰς τὴν συναγωγὴν ⸀διελέξατο τοῖς Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: ta
  text: அவர்கள் எபேசுவுக்கு வந்து சேர்ந்தார்கள்[a]. அவர் அவர்களை அங்கே விட்டுவிட்டு[b], தாமே ஜெபக்கூடத்துக்குள் சென்று யூதர்களுடன் கலந்துரையாடினார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எபேசுவை அடைந்தார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பிரிஸ்கில்லாவையும் ஆக்கில்லாவையும் அவர் அங்கே விட்டார்.
    reason: cross_reference
  - marker: c
    text: அல்லது, “அவர்களுடன் தர்க்கரீதியாக உரையாடினார்.” கிரேக்கச் சொல் கருத்துகளைப் பரிமாறி ஆராயும் உரையாடலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: வந்து சேர்ந்தார்கள்
  rationale: இலக்கை அடைதல் அல்லது அங்கு வந்து சேர்தல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: (முதல் இடத்தில் தனியாக மொழிபெயர்க்கப்படவில்லை); விட்டுவிட்டு
  rationale: முதல் δέ கதைத் தொடர்ச்சியை மட்டும் குறிக்கிறது; தமிழில் வாக்கிய ஓட்டமே அதைத் தெரிவிக்கிறது. இரண்டாவது δέ தரும் மெல்லிய வேறுபாடு, ‘அவர்களை அங்கே விட்டுவிட்டு, தாமே…’ என்ற அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: κἀκείνους
  choice: அவர்களை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட உடன் பயணித்தவர்களைக் குறிக்கும் சுட்டுப்பெயரைப் பெயர்களாக விரிவாக்காமல் பாதுகாக்கிறது.
- source_word: κατέλιπεν
  choice: விட்டுவிட்டு
  rationale: ஒரு இடத்தில் பிறரை விட்டுச் செல்லுதல் என்ற பொருளைத் தமிழில் இயல்பாகத் தருகிறது; அடுத்த செயலை இணைக்கும் வினையெச்ச வடிவம் மூலத்தின் ஓட்டத்திற்குப் பொருந்துகிறது.
- source_word: αὐτοῦ
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் இச்சொல், அவர்கள் எபேசுவிலேயே விடப்பட்டார்கள் என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: αὐτὸς
  choice: தாமே
  rationale: மற்றவர்களை அங்கே விட்டதற்கு மாறாக அவர் தனிப்பட்ட முறையில் உள்ளே சென்றார் என்ற அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: εἰσελθὼν
  choice: உள்ளே சென்று
  rationale: முதன்மைச் செயலுக்கு முன்னோடியாக வரும் பங்கேற்பு வினையை இயல்பான தமிழ் வினையெச்சமாக வழங்குகிறது.
- source_word: συναγωγήν
  choice: ஜெபக்கூடம்
  rationale: யூதர்களின் கூடுகை மற்றும் வழிபாட்டு இடத்தைக் குறிக்கும், தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட சொல்.
- source_word: διελέξατο
  choice: கலந்துரையாடினார்
  rationale: கருத்துப் பரிமாற்றத்துடன் கூடிய உரையாடலைக் குறிக்கிறது; வெறும் பேச்சு என்ற அளவுக்கு மங்கலாகவோ, ‘வாதிட்டார்’ என்பதுபோல் தேவையற்ற மோதல் நிறைந்ததாகவோ இல்லை.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்களுடன்
  rationale: மூலத்தின் இன-சமயக் குறிப்பை நேரடியாகப் பாதுகாக்கிறது; ‘தலைவர்கள்’ என்று தேவையின்றி குறுக்கவில்லை.
