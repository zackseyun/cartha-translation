source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: ta
  text: ஆனால் அவர்கள் எதிர்த்து நின்று பழித்துப் பேசியபோது[a], அவர் தமது ஆடைகளை உதறிவிட்டு அவர்களிடம், “உங்கள் இரத்தப்பழி உங்கள் தலைமேலேயே இருக்கட்டும்[b]. நான் குற்றமற்றவன். இனி நான் யூதரல்லாத மக்களிடம் செல்வேன்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேவதூஷணம் பேசினர்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் தேவதூஷணத்தையோ இழிவான வசைபேச்சையோ குறிக்கலாம்; யாரை அல்லது எதைப் பழித்தார்கள் என்பதை இங்கு உரை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “உங்கள் இரத்தப்பழி உங்கள் தலைமேலேயே இருக்கட்டும்” என்பது, அதன் விளைவுகளுக்கான பொறுப்பு அவர்களிடமே உள்ளது என்று பொருள்படும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: சொற்படி, “பிற இனத்தாரிடம்” அல்லது “தேசங்களிடம்”; இச்சூழலில் இது யூதரல்லாத மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: எதிர்த்து நின்று
  rationale: பவுலின் செய்திக்கு எதிராகத் தங்களை நிறுத்திக்கொண்ட செயற்பாட்டையும் எதிர்ப்பின் வலிமையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: βλασφημούντων
  choice: பழித்துப் பேசியபோது
  rationale: இவ்வினைச்சொல் தேவதூஷணத்தையோ இழிவான வசைபேச்சையோ குறிக்கலாம். வெளிப்படாத செயப்படுபொருளைச் சேர்க்காமல், இச்சூழலின் பகைமையான பேச்சைத் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: தமது ஆடைகளை உதறிவிட்டு
  rationale: விலகிநிற்பதைக் குறிக்கும் அடையாளச் செயலை மூலத்துக்கு நெருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: உங்கள் இரத்தப்பழி உங்கள் தலைமேலேயே இருக்கட்டும்
  rationale: விளைவுகளுக்கான பொறுப்பு கேட்போரிடமே இருப்பதாகக் கூறும் வேதாகம மரபுத்தொடரின் நீதித்தீர்ப்புச் செறிவைத் தக்கவைக்கிறது.
- source_word: καθαρὸς ἐγώ
  choice: நான் குற்றமற்றவன்
  rationale: சொற்படி ‘நான் தூயவன்’ என்பதற்குப் பதிலாக, இங்கு பொறுப்பிலிருந்தும் பழியிலிருந்தும் விடுபட்டிருப்பதைக் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπὸ τοῦ νῦν
  choice: இனி
  rationale: ஊழியத்தின் திசையில் ஏற்படும் தீர்மானமான மாற்றத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: εἰς τὰ ἔθνη
  choice: யூதரல்லாத மக்களிடம்
  rationale: இச்சூழலில் ἔθνη என்பது யூதரல்லாதோரைச் சுட்டுவதால், ‘நாடுகள்’ என்பதைவிடத் தெளிவாகப் பொருளை வழங்குகிறது.
- source_word: πορεύσομαι
  choice: செல்வேன்
  rationale: எதிர்கால நோக்கத்தையும் செல்லும் செயலையும் நேரடியான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: “உங்கள் இரத்தப்பழி உங்கள் தலைமேலேயே இருக்கட்டும்” என்ற பொறுப்புச் சூத்திரம்
  choice: செய்தியை நிராகரிப்பதால் வரும் விளைவுகளுக்கான பொறுப்பு கேட்போரிடமே உள்ளது; பவுலிடம் இல்லை என்ற அறிவிப்பு
  alternative: வலுவான சாபமாகப் புரிந்துகொள்ளுதல்
  rationale: இத்தொடர் வேதாகமக் காவலாளி/பொறுப்பு மொழியை எதிரொலித்து, உண்மையாகச் சாட்சி கூறிய பின்பு பவுல் தமக்குப் பொறுப்பில்லை என்று ஆணித்தரமாக அறிவிப்பதாக அமைகிறது. மொழிபெயர்ப்பு அதை வெறும் விளக்கவுரையாக மாற்றாமலும், மூலத்தைவிட வலுவான சாபமாக்காமலும் மரபுத்தொடரைப் பேணுகிறது.
- issue: βλασφημούντων என்பதன் இலக்கு மற்றும் பொருள்
  choice: செயப்படுபொருளைக் குறிப்பிடாமல் ‘பழித்துப் பேசினர்’ என வழங்குதல்
  alternative: ‘தேவதூஷணம் பேசினர்’ அல்லது ‘அவரைப் பழித்தனர்’
  rationale: கிரேக்கத்தில் யாரை அல்லது எதைப் பழித்தார்கள் என்பது வெளிப்படையாக இல்லை. ஆகவே பவுலையோ தேவனையோ தனிப்படக் குறிப்பிட்டு உரையின் தெளிவின்மையைத் தீர்த்துவிடாமல், சொல்லின் பரந்த வசை/தூஷணப் பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழின் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இரத்தப்பழி’ என்ற வேதாகமச் செறிவுள்ள சொல்லுக்கு விளக்க அடிக்குறிப்பு இணைக்கப்பட்டுள்ளது; βλασφημούντων என்பதிலுள்ள உண்மையான பொருள் மற்றும் செயப்படுபொருள் தெளிவின்மை பிரதான உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
