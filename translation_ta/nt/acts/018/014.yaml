translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நீதிமன்றப் பேச்சுநடை பயன்படுத்தப்பட்டுள்ளது. ‘யூதர்களே’ என்ற நேரடி அழைப்பு பாதுகாக்கப்பட்டுள்ளது. கல்லியோவின் சற்றே அலட்சியமான தொனி முற்றிலும் நீக்கப்படாமல், தமிழில் அளவுக்கு மீறிய இகழ்ச்சியாகவும் மாற்றப்படாமல் அமைக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
