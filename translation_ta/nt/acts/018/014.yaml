source:
  edition: SBLGNT
  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: ta
  text: ஆனால் பவுல் பேசத் தொடங்கவிருந்தபோது[a], கல்லியோ யூதர்களிடம், “யூதர்களே, இது ஏதாவது அநியாயச் செயலோ தீய குற்றச்செயலோ பற்றியதாக இருந்தால்[b], நான் நியாயமாக உங்களைப் பொறுத்துக்கொண்டிருப்பேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “பவுல் தன் வாயைத் திறக்கவிருந்தபோது”; இது பேசத் தொடங்குவதைக் குறிக்கும் கிரேக்க மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “தீய குற்றச்செயல்” என்பதற்கு “கொடிய குற்றம்,” “வஞ்சகமான தீச்செயல்,” அல்லது “பொல்லாத குற்றம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நான் உங்களைச் சகித்துக்கொண்டிருப்பேன்” அல்லது “தக்க காரணத்துடன் உங்களைப் பொறுத்துக்கொண்டிருப்பேன்.” இங்கு பயன்படுத்தப்பட்டுள்ள கிரேக்க வினை பொறுத்துக்கொள்ளுதல் அல்லது சகித்துக்கொள்ளுதலைக் குறிக்கிறது; நீதிமன்றச் சூழலில் அவர்களது முறையீட்டைக் கேட்பதையும் அது உட்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: பவுல் பேசத் தொடங்கவிருந்தபோது
  rationale: மெல்லோ + வினையெச்சம் உடனடியாக நிகழவிருந்த செயலைக் குறிக்கிறது. ‘வாயைத் திறக்க’ என்ற கிரேக்க மரபுத்தொடரைச் சொற்சொல்லாகக் கொடுப்பதைவிட அதன் இயல்பான பொருளான பேசத் தொடங்குவதை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: பவுல் பதிலளிக்கத் தொடங்கும் முன்பே கல்லியோ பேசுவதைச் சுட்டும் மெல்லிய முரண்பாட்டுடன் கூடிய கதைத் திருப்பை வெளிப்படுத்துகிறது.
- source_word: Γαλλίων
  choice: கல்லியோ
  rationale: கிரேக்கப் பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: யூதர்களிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நேரடியாகத் தருகிறது; ‘குற்றஞ்சாட்டிய யூதர்கள்’ என்ற சூழல் சார்ந்த கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: Εἰ μὲν ἦν
  choice: இது ... பற்றியதாக இருந்தால்
  rationale: நிபந்தனை வாக்கியத்தை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது. μέν தனியே வலியுறுத்தப்படாமல், தொடர்ந்து வரும் எதிர்மறை ஒப்பீட்டுக்கான அமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: ἀδίκημά τι
  choice: ஏதாவது அநியாயச் செயல்
  rationale: சட்டரீதியான தவறு அல்லது குற்றச்செயலைக் குறிக்கும் சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது; குறிப்பிட்ட குற்றவகையைத் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: கொடிய குற்றம்
  rationale: ῥᾳδιούργημα என்பதன் குற்றச்செயல் சார்ந்த வலிமையையும் πονηρόν என்பதன் தீய ஒழுக்கத் தன்மையையும் சுருக்கமான, இயல்பான தமிழில் இணைக்கிறது.
- source_word: ὦ Ἰουδαῖοι
  choice: யூதர்களே
  rationale: நேரடி அழைப்பையும் அதன் வலியுறுத்தலையும் தமிழின் இயல்பான விளிவடிவில் தருகிறது.
- source_word: κατὰ λόγον
  choice: நியாயமாக இருக்கும்
  rationale: ‘நியாயத்தின்படி’ அல்லது ‘தக்க காரணத்துடன்’ என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀνεσχόμην ὑμῶν
  choice: நான் உங்களுக்குச் செவிகொடுப்பது
  rationale: வினைச்சொல்லுக்கு ‘பொறுத்துக்கொள்/சகித்துக்கொள்’ என்ற அடிப்படை வலிமை இருந்தாலும், நீதிமன்றச் சூழலில் அவர்களது முறையீட்டைக் கேட்டுப் பொறுத்திருப்பதைக் குறிக்கிறது. ‘உங்களைச் சகித்துக்கொள்வேன்’ என்பது தமிழில் தேவையற்ற தனிப்பட்ட இகழ்ச்சியாக ஒலிக்கக்கூடும்; முதன்மை உரை சூழல் பொருளைத் தருகிறது, மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
