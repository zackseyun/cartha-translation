source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: ta
  text: சீலாவும் தீமோத்தேயுவும் மக்கெதோனியாவிலிருந்து இறங்கி வந்தபோது, பவுல் வார்த்தையில் முழுமையாக ஈடுபட்டவராய்[a], இயேசுவே மெசியா[b] என்று யூதர்களிடம் ஆணித்தரமாகச் சாட்சியளித்துக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வார்த்தையால் உந்தப்பட்டு” அல்லது “செய்தியில் முற்றிலும் மூழ்கி.” கிரேக்க வினைச்சொல் ஒன்றினால் ஆட்கொள்ளப்படுதல், நெருக்கப்படுதல், அல்லது அதில் முழுமையாக ஈடுபடுதல் ஆகிய பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “கிறிஸ்து.” இங்கு அது ஒரு பட்டப்பெயராக இருப்பதால், அதன் மெசியானிய பொருளைத் தக்கவைக்க “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: வந்தபோது
  rationale: ὡς என்பதன் காலப்பொருளை இயல்பான தமிழில் தருகிறது; δέ இங்குச் சொல்லோட்ட மாற்றத்தைக் குறிக்கிறது, ஆனால் தனிச்சொல்லாக மொழிபெயர்த்தால் தமிழ் நடையில் தேவையற்ற கனத்தை உண்டாக்கும்.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: மக்கெதோனியாவிலிருந்து இறங்கி வந்தபோது
  rationale: κατέρχομαι என்பதிலுள்ள ‘இறங்கி வருதல்’ என்ற பயணச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: சீலாவும் தீமோத்தேயுவும்
  rationale: τε ... καί இணைப்பு இருவரையும் ஒரே கூட்டெழுவாயாக வலியுறுத்துகிறது; ‘-வும் ... -வும்’ என்பது அதற்கான இயல்பான தமிழ் அமைப்பு.
- source_word: συνείχετο
  choice: முழுமையாக ஈடுபட்டு
  rationale: இங்கு வினைச்சொல் ஒன்றினால் ஆட்கொள்ளப்பட்டிருத்தல், அதில் மூழ்கியிருத்தல், அல்லது அதனால் நெருக்கப்படுதல் ஆகிய நுணுக்கங்களைக் கொண்டிருக்கலாம். முதன்மை உரை சூழலுக்கேற்ற ஈடுபாட்டைத் தருகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: τῷ λόγῳ
  choice: வார்த்தையில்
  rationale: λόγος என்பதைக் வெளிப்படையாகத் தக்கவைத்து, அது நற்செய்தி அல்லது அறிவிக்கப்படும் செய்தியைக் குறிக்கும் லூக்காவின் சொல்லாட்சியாக வாசிக்க இடமளிக்கிறது.
- source_word: διαμαρτυρόμενος
  choice: ஆணித்தரமாகச் சாட்சியளித்துக்கொண்டிருந்தார்
  rationale: διαμαρτύρομαι என்பதிலுள்ள வலியுறுத்தப்பட்ட, உறுதியான சாட்சியின் தன்மையையும், நிகழ்ந்துகொண்டிருந்த செயலைக் குறிக்கும் காலநிலையையும் வெளிப்படுத்துகிறது.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்களிடம்
  rationale: சூழலில் Ἰουδαῖοι என்பது யூத மக்களைக் குறிக்கிறது; ‘யூதர்களிடம்’ நேரடியும் இயல்பானதுமான மொழிபெயர்ப்பு.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: இயேசுவே மெசியா என்று
  rationale: இங்கு χριστός பெயரைப் போன்ற பயன்பாடு அல்ல, இயேசுவைப் பற்றிய பட்டப்பெயர்சார் கூற்றாக உள்ளது. ‘-வே’ என்பது ‘மெசியா இயேசுதான்’ என்ற அடையாளப்படுத்தும் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: Χριστός என்பதைப் பட்டப்பெயராகவா, பெயரைப் போன்ற வடிவமாகவா மொழிபெயர்ப்பது
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: χριστός இங்கு உருபுடன், யூதர்களுக்குச் செய்யப்படும் அறிவிப்பில் பயனிலைப் பட்டப்பெயராக வருகிறது. ஆகவே வாக்குறுதியளிக்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் மெசியானிய பொருள் வெளிப்படையாகத் தரப்படுகிறது.
- issue: συνείχετο τῷ λόγῳ என்பதன் உறவு
  choice: வார்த்தையில் முழுமையாக ஈடுபட்டு
  alternative: வார்த்தையால் நெருக்கப்பட்டு
  rationale: தத்திவ வேற்றுமை ஈடுபாட்டின் துறையையோ, வினையின் காரணத்தையோ குறிக்கக்கூடும். முதன்மை உரை ஊழியச் சூழலில் இயல்பான வாசிப்பைத் தேர்ந்தெடுக்கிறது; ‘வார்த்தையால் உந்தப்பட்டார்/நெருக்கப்பட்டார்’ என்ற சாத்தியத்தை அடிக்குறிப்பு வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. “இறங்கி வந்தபோது” லூக்காவின் பயணச் சொல்லாட்சியைத் தக்கவைக்கிறது. “வார்த்தை” என்பது மூலத்தின் λόγος சொல்லை வெளிப்படையாகக் காக்கிறது; அதன் பொருள்சார் தெளிவு அடிக்குறிப்பில் வழங்கப்படுகிறது. அடிக்குறி [a] தொடர்புடைய சொற்றொடருக்குப் பின்னும் [b] “மெசியா”வுக்குப் பின்னும் சரியாக வைக்கப்பட்டுள்ளன.
