source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: ta
  text: பவுல் இன்னும் பல நாட்கள் தங்கியிருந்து, சகோதரர்களிடம் விடைபெற்று, சிரியாவுக்குக் கப்பலில் புறப்பட்டார்; பிரிஸ்கில்லாவும் ஆக்கில்லாவும் அவருடன் இருந்தனர். பவுலுக்கு ஒரு நேர்ச்சை இருந்ததால், கெங்கிரேயாவில் அவர் தன் தலைமுடியை வெட்டிக்கொண்டார்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தலைமுடியை மழித்துக்கொண்டார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் முடியை வெட்டுவதையோ மழிப்பதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: தலைமுடியை வெட்டிக்கொண்டதும் நேர்ச்சை இருந்ததும் ஆக்கில்லாவைக் குறிக்கும் என்று சிலர் கருதுகின்றனர்; ஆனால் கிரேக்க இலக்கணம் இயல்பாகப் பவுலையே சுட்டுகிறது.
    reason: alternative_reading
  - marker: c
    text: மூல உரை ‘ஒரு நேர்ச்சை’ என்று மட்டுமே கூறுகிறது; இது நாசரேய நேர்ச்சையைப் போன்றது என்று பலர் கருதினாலும், அதன் வகை இங்கே வெளிப்படையாகச் சொல்லப்படவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: προσμείνας ... ἡμέρας ἱκανὰς
  choice: இன்னும் பல நாட்கள் அங்கே தங்கியிருந்த பின்பு
  rationale: வினையெச்சம் பிரதானச் செயலுக்கு முந்திய தங்கியிருத்தலைக் குறிக்கிறது; ἔτι மற்றும் ἱκανὰς இணைந்து தொடர்ந்து கணிசமான பல நாட்கள் என்ற பொருளைத் தருகின்றன. ‘அங்கே’ என்பது சூழலிலிருந்து இயல்பான தமிழுக்காக நிரப்பப்பட்டது.
- source_word: τοῖς ἀδελφοῖς ἀποταξάμενος
  choice: சகோதரர்களிடம் விடைபெற்று
  rationale: ἀποτάσσομαι இங்கு ஒருவரிடம் விடைபெறுதல் என்ற இயல்பான பொருளில் வருகிறது; ‘சகோதரர்கள்’ மூலத்தின் குடும்ப உறவுச் சொல்லைப் பாதுகாக்கிறது.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: சிரியாவுக்குக் கப்பலில் புறப்பட்டார்
  rationale: ἐκπλέω கப்பலில் புறப்படுதலைத் தெளிவாகக் குறிக்கிறது; இலக்கைத் தமிழில் ‘சிரியாவுக்கு’ என இயல்பாகத் தருகிறது.
- source_word: σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: பிரிஸ்கில்லாளோடும் ஆக்கில்லாவோடும்
  rationale: இருவரும் பவுலுடன் பயணித்ததைச் சுருக்கமாகவும் இயல்பாகவும் பிரதான வினையுடன் இணைக்கிறது.
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: தமது தலைமுடியை வெட்டிக்கொண்டார்
  rationale: κείρω முடியை வெட்டுதல் அல்லது மழித்தல் என வரக்கூடும். ‘தலைமுடியை வெட்டிக்கொண்டார்’ அந்தச் சொற்பொருள் பரப்பைப் பாதுகாத்து, முழுமையாக மழித்தார் என்று தேவையின்றி உறுதிப்படுத்தாது.
- source_word: ἐν Κεγχρεαῖς
  choice: கெங்கிரேயாவில்
  rationale: இடப்பெயரின் கிரேக்க உச்சரிப்பை அணுகும் தமிழ் எழுத்துப்பெயர்ப்பு; ἐν-ஐ இடவெற்றுமையாகத் தருகிறது.
- source_word: εἶχεν γὰρ εὐχήν
  choice: அவருக்கு ஒரு நேர்த்திக்கடன் இருந்ததால்
  rationale: εὐχή இங்கு கடவுளிடம் மேற்கொள்ளப்பட்ட நேர்ச்சை அல்லது உறுதிமொழியைக் குறிக்கிறது. ‘நேர்த்திக்கடன்’ தமிழில் சமயச் சூழலில் இயல்பானது; அதன் குறிப்பிட்ட வகையை நிர்ணயிப்பதில்லை.
theological_decisions:
- issue: κειράμενος என்பதன் செய்பவர்
  choice: தலைமுடியை வெட்டிக்கொண்டவர் பவுல் என முதன்மை உரையில் தரப்பட்டது.
  alternative: சிலர் அருகிலுள்ள ஆக்கில்லாவையே செய்பவராகக் கருதுகின்றனர்.
  rationale: ஆண்பால் ஒருமை வினையெச்சம் வாக்கியத்தின் பிரதான ஆண்பால் ஒருமை எழுவாயான பவுலை இயல்பாகச் சுட்டுகிறது. இருப்பினும் விளக்க வரலாற்றில் காணப்படும் மாற்றுக் கருத்து அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: εὐχή என்பதன் தன்மை
  choice: பொதுவாக ‘ஒரு நேர்த்திக்கடன்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: நாசரேய நேர்த்திக்கடன் எனக் குறிப்பாக்குதல்.
  rationale: மூல உரை நேர்த்திக்கடனின் வகையைச் சொல்லவில்லை; ஆகவே நாசரேய நேர்ச்சை என்ற சடங்கு அடையாளம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்பான ஓட்டத்தில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘தமது’ என்பது பவுலையே மீளச் சுட்டுகிறது; ‘சகோதரர்கள்’ மூலச் சொல்லைத் தக்கவைத்தாலும், சூழலில் அது விசுவாசிகளின் சமூகத்தைக் குறிக்கலாம்.
