source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: ta
  text: அவர் ஜெபக்கூடத்தில் துணிவுடன் பேசத் தொடங்கினார். பிரிஸ்கில்லாவும் அக்கில்லாவும் அவர் பேசுவதைக் கேட்டபோது, அவரைத் தங்களுடன் சேர்த்துக்கொண்டு[a], கடவுளின் வழியை இன்னும் துல்லியமாக அவருக்கு விளக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைத் தனியே அழைத்துச் சென்று”; அல்லது, “அவரை வரவேற்று.” கிரேக்க வினைச்சொல் ஒருவரைத் தம்முடன் சேர்த்துக்கொள்வது அல்லது வரவேற்பது என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε ἤρξατο
  choice: அவர் ... தொடங்கினார்
  rationale: οὗτος முந்தைய சூழலில் அப்பொல்லோவைக் குறிக்கிறது; நவீன தமிழில் மரியாதை ஒருமைப் பெயர்ப்பதிலியான ‘அவர்’ இயல்பானது. τέ-யின் மென்மையான இணைப்புத் தன்மையை தனியாக மிகைப்படுத்தாமல் தமிழ் வாக்கிய ஓட்டத்தில் வெளிப்படுத்துகிறது.
- source_word: παρρησιάζεσθαι
  choice: துணிவுடன் பேச
  rationale: வெளிப்படையாகவும் நம்பிக்கையுடனும் துணிச்சலாகவும் பேசுதல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐν τῇ συναγωγῇ
  choice: ஜெபக்கூடத்தில்
  rationale: யூதர்களின் synagogue-ஐக் குறிக்கும் தமிழில் பரவலாக அறியப்பட்ட, தெளிவான சொல்.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: அவர் பேசுவதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்பு வடிவத்தின் காலத் தொடர்பை ‘கேட்டபோது’ எனத் தருகிறது; αὐτοῦ இங்கு அவர் பேசுவதைக் கேட்டனர் என்ற பொருளில் இயல்பாக விரிக்கப்பட்டுள்ளது. δέ-யின் மென்மையான நகர்வை தமிழ் வாக்கிய அமைப்பு வெளிப்படுத்துவதால் வலுவான முரண்பாட்டுச் சொல் சேர்க்கப்படவில்லை.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: பிரிஸ்கில்லாவும் ஆக்கில்லாவும்
  rationale: கிரேக்கப் பெயர் வடிவங்களுக்கேற்ப தமிழில் தெளிவாக ஒலிபெயர்க்கப்பட்டுள்ளன; இணைப்பை ‘-வும் ... -வும்’ இயல்பாகக் காட்டுகிறது.
- source_word: προσελάβοντο αὐτὸν
  choice: அவரைத் தங்களுடன் அழைத்துக்கொண்டு[a]
  rationale: வினைச்சொல் ஒருவரைத் தம்முடன் சேர்த்துக்கொள்ளுதல், வரவேற்றல், அல்லது தனியே அழைத்துச் செல்லுதல் ஆகிய நிழற்பொருள்களைக் கொள்ளலாம். தனிப்பட்ட விளக்கம் தொடர்வதால் ‘தங்களுடன் அழைத்துக்கொண்டு’ சூழலுக்கு ஏற்றதாகவும், கிரேக்கத்தின் பரந்த பொருளை அளவுக்கு மீறிக் குறுக்காததாகவும் உள்ளது.
- source_word: ἀκριβέστερον
  choice: இன்னும் துல்லியமாக
  rationale: ஒப்பீட்டுப் பொருளை ‘இன்னும்’ என்பதும், அதிகச் சரிநுட்பத்தை ‘துல்லியமாக’ என்பதும் தெளிவாகக் காக்கின்றன.
- source_word: ἐξέθεντο
  choice: விளக்கினார்கள்
  rationale: இங்கு நடுவினை வடிவிலுள்ள ἐκτίθημι விரிவாக எடுத்துரைத்தல் அல்லது விளக்குதல் என்று பொருள்படும்; ‘விளக்கினார்கள்’ இயல்பான தற்போதைய தமிழ்.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: கடவுளின் வழியை
  rationale: மூலத்தின் ‘கடவுளின் வழி’ என்ற உருவகச் சொல்லாடலைப் பாதுகாக்கிறது; அதை ஒழுக்கநெறி அல்லது முழுக் கிறிஸ்தவக் கோட்பாடு என்று மொழிபெயர்ப்பிலேயே குறுக்கவில்லை.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: விளக்கத்தின் மறைமுகப் பெறுநரைத் தமிழில் இயல்பான வேற்றுமை உருபுடன் காட்டுகிறது.
theological_decisions:
- issue: பிரிஸ்கில்லாவும் ஆக்கில்லாவும் அப்பொல்லோவிடம் செய்த செயல்
  choice: அவரைத் தங்களுடன் அழைத்துக்கொண்டு மேலதிகமாக விளக்கினர்
  alternative: அவரைத் தனியே அழைத்துச் சென்றனர்; அவரை வரவேற்றனர்; தங்களிடம் ஏற்றுக்கொண்டனர்
  rationale: προσελάβοντο பல நிழற்பொருள்களைக் கொண்டது. தொடர்ந்து வரும் துல்லியமான விளக்கம் தனிப்பட்ட உரையாடலைச் சுட்டினாலும், வினைச்சொல் கட்டாயமாக ‘தனியே’ என்று சொல்லாது. ஆகவே முதன்மை உரை தனிப்பட்ட வரவேற்பு/அழைத்துக்கொள்ளுதல் ஆகிய இரண்டுக்கும் இடமளிக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருள்களைப் பதிவு செய்கிறது.
- issue: ‘கடவுளின் வழி’ என்பதன் பொருள்
  choice: மூலத்தின் பரந்த ஆரம்பக் கிறிஸ்தவச் சொல்லாடலை அப்படியே வைத்தல்
  alternative: கடவுளின் ஒழுக்க வழி; முழுக் கிறிஸ்தவ விசுவாசத்திற்கான தொழில்நுட்பப் பெயர்
  rationale: சூழலில் இது கடவுளுடைய மீட்பு வழி அல்லது செய்தியைக் குறிக்க வாய்ப்புள்ளது; ஆனால் உரை அதைக் கோட்பாட்டு வரையறையாக விரிவுபடுத்தவில்லை. எனவே அதன் இறையியல் பரப்பும் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தேவையற்ற சமயக்குழு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன. ‘கடவுளின் வழி’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டு, [a] குறியீடு உரையில் அதற்குரிய இடத்தில் சேர்க்கப்பட்டுள்ளது.
