source:
  edition: SBLGNT
  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: ta
  text: ஏனெனில், அவர் பொதுவெளியில் யூதர்களுக்கு எதிராக வலிமையாக வாதாடி, வேதநூல்களின் மூலம் இயேசுவே மேசியா[b] என்பதை நிரூபித்துக் காட்டினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியா இயேசுவே என்பதை.” கிரேக்க வினையெச்சத் தொடர் இருவித சொல் வரிசைகளிலும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கில், “கிறிஸ்து”; இங்கு அது ஒரு பட்டமாகப் பயன்படுத்தப்படுவதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: வலிமையாக
  rationale: வாதத்தின் தீவிரத்தையும் அதன் வலுவான தாக்கத்தையும் தெரிவிக்கிறது; வெறும் உரத்த தன்மையைக் குறிக்காமல், ஆதாரபூர்வமான மறுப்பின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διακατηλέγχετο
  choice: வாதத்தில் … மறுத்து
  rationale: எதிர்தரப்பினரின் கூற்றை ஆதாரங்களால் முழுமையாகத் தவறெனக் காட்டும் பொருளைத் தருகிறது. ‘வாதத்தில்’ என்பது மனிதர்களையே நிராகரித்தார் என்ற தவறான எண்ணத்தைத் தவிர்த்து, விவாதச் சூழலைத் தெளிவாக்குகிறது.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்களை
  rationale: கிரேக்கத்தின் குழுக் குறிப்பை நேரடியாகப் பாதுகாக்கிறது; சூழலில் அப்பொல்லோவுடன் விவாதித்த யூதர்களைக் குறிக்கிறது.
- source_word: δημοσίᾳ
  choice: பொதுவில்
  rationale: மறுப்பு தனிப்பட்ட உரையாடலில் அல்லாமல் மக்கள் முன்னிலையில் நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐπιδεικνὺς
  choice: எடுத்துக்காட்டினார்
  rationale: வேத ஆதாரங்களை முன்வைத்து ஒரு முடிவைத் தெளிவாக நிறுவிக் காட்டியதைக் குறிக்கிறது; தமிழில் இயல்பான வாதவியல் சொல்லாக்கம்.
- source_word: διὰ τῶν γραφῶν
  choice: வேதநூல்களின் வாயிலாக
  rationale: διά + genitive குறிக்கும் கருவி அல்லது வழிமுறையைப் பாதுகாக்கிறது; அப்பொல்லோ பயன்படுத்திய ஆதாரம் வேதநூல்கள் என்பதைக் காட்டுகிறது.
- source_word: τὸν χριστὸν
  choice: மேசியா
  rationale: இங்கு χριστός ஒரு பெயர்போன்ற சொல்லாக அல்லாமல், வேதத்தில் வாக்களிக்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாகச் செயல்படுகிறது.
- source_word: Ἰησοῦν
  choice: இயேசு
  rationale: Ἰησοῦς என்ற தனிப்பெயரின் நிலையான தமிழ் வடிவம்.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: இயேசுவே மேசியா என்பதை
  rationale: இயேசுவை வாக்களிக்கப்பட்ட மேசியாவாக அடையாளப்படுத்தும் கருத்தை இயல்பான தமிழ் சொல் வரிசையில் தருகிறது; கிரேக்கக் கட்டமைப்பின் மாற்று புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இந்த இடத்தில் சொல் ஒரு பட்டமாகவும் யூத வேதநூல்களின் எதிர்பார்ப்போடும் தொடர்புடையதாகவும் உள்ளது; ஆகவே ‘மேசியா’ அந்தச் சூழலைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: εἶναι τὸν χριστὸν Ἰησοῦν என்ற சொற்றொடரின் உறுப்பு தொடர்பு
  choice: இயேசுவே மேசியா என்பதை
  alternative: மேசியாவே இயேசு என்பதை
  rationale: கிரேக்க infinitive clause இரு தமிழ் சொல் வரிசைகளிலும் வெளிப்படுத்தப்படலாம். பிரதான உரை இயல்பான நற்செய்தி அறிவிப்பு வடிவைப் பயன்படுத்துகிறது; மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘யூதர்களை வாதத்தில் … மறுத்து’ என்பது மூலத்தின் நபரைக் குறிக்கும் தத்திவை காத்துக்கொண்டே, மறுக்கப்பட்டது அவர்களின் வாதம் என்ற சூழலை இயல்பாகத் தெளிவாக்குகிறது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
