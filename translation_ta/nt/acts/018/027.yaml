source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: ta
  text: அவர் அகாயாவுக்குச் செல்ல விரும்பியபோது, சகோதரர்கள்[a] அவரை ஊக்கப்படுத்தி, அவரை வரவேற்கும்படி சீடர்களுக்கு எழுதினார்கள். அவர் அங்கு சென்றடைந்ததும், அருளினால் நம்பிக்கை கொண்டவர்களுக்கு மிகவும் உதவினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்கள்’ என்பது கிரேக்கத்தில் ஆண்பால் வடிவில் உள்ளது; எனினும் இங்கு அது பெண்களையும் உள்ளடக்கிய விரிவான விசுவாசச் சமூகத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அருளினால் அவர் நம்பிக்கை கொண்டவர்களுக்கு மிகவும் உதவினார்.’ ‘அருளினால்’ என்ற கிரேக்கச் சொற்றொடர், மக்கள் நம்பிக்கை கொண்டதைக் குறிப்பதற்குப் பதிலாக அப்பொல்லோ செய்த உதவியோடு இணைக்கப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: அவர் ... செல்ல விரும்பியபோது
  rationale: இந்த genitive absolute அமைப்பு அப்பொல்லோவின் எண்ணத்தைச் சூழ்நிலை வாக்கியமாகக் காட்டுகிறது. ‘விரும்பியபோது’ என்பது அவரது மனவிருப்பத்தையும் காலத் தொடர்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: அகாயாவுக்குக் கடந்து செல்ல
  rationale: எபேசுவிலிருந்து அகாயா பகுதிக்குச் செல்லும் பயணத்தில் கடந்து செல்லும் நுணுக்கத்தை διέρχομαι கொண்டிருக்கலாம். ஆகவே வெறுமனே ‘செல்ல’ என்பதற்குப் பதிலாக ‘கடந்து செல்ல’ என மொழிபெயர்க்கப்பட்டது.
- source_word: προτρεψάμενοι
  choice: அவரை ஊக்கப்படுத்தி
  rationale: இச்சொல் ஆதரவான தூண்டுதலைக் குறிக்கிறது. ‘ஊக்கப்படுத்தி’ என்பது கடுமையான வற்புறுத்தலைக் குறிக்காமல் சூழலுக்கு ஏற்ற நேர்மறையான பொருளைத் தருகிறது; ‘அவரை’ என்பது கிரேக்கத்தில் சூழலிலிருந்து புரிந்துகொள்ளப்படும் செயப்படுபொருள்.
- source_word: οἱ ἀδελφοὶ
  choice: சகோதரர்கள்
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவம் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது. தொடக்கக் கிறிஸ்தவப் பயன்பாட்டில் இது பெண்களையும் உள்ளடக்கிய விசுவாசச் சமூகத்தைக் குறிக்கக்கூடும் என்பதைக் குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: சீடர்களுக்கு எழுதினார்கள்
  rationale: γράφω உடன் வரும் dative இங்கு ‘யாருக்கு எழுதினார்கள்’ என்பதைக் குறிக்கிறது. μαθηταί என்பதற்கு அப்போஸ்தலர் பணிகள் நூலில் வழக்கமான, துல்லியமான ‘சீடர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀποδέξασθαι αὐτόν
  choice: அவரை வரவேற்கும்படி
  rationale: இச்சூழலில் ἀποδέχομαι என்பது அப்பொல்லோவை நல்ல முறையில் ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘வரவேற்க’ என்பது அந்த உபசரிப்பு உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: ὃς παραγενόμενος
  choice: அவர் அங்கு சென்றடைந்ததும்
  rationale: உறவுப்பெயரும் வினையெச்சமும் அப்பொல்லோவை மீண்டும் சுட்டி அடுத்த நிகழ்வை அறிமுகப்படுத்துகின்றன. ‘சென்றடைந்ததும்’ வருகையையும் அதன் பின்வரும் செயலையும் தெளிவாக இணைக்கிறது; ‘அங்கு’ என்பது இலக்கு இடத்தைக் கருத்திலிருந்து வெளிப்படுத்துகிறது.
- source_word: συνεβάλετο πολὺ
  choice: மிகவும் உதவினார்
  rationale: சூழலில் συμβάλλω நடுவினை வடிவம் குறிப்பிடத்தக்க உதவி அல்லது பயனைச் சுட்டுகிறது. ‘மிகவும் உதவினார்’ என்பது தெளிவான, இயல்பான தமிழாக்கம்.
- source_word: τοῖς πεπιστευκόσιν
  choice: நம்பிக்கை கொண்டவர்களுக்கு
  rationale: Perfect participle முன்பே நம்பிக்கை கொண்டு அந்த நிலையில் இருப்பவர்களைக் குறிக்கிறது. ‘நம்பிக்கை கொண்டவர்கள்’ அந்த நிலையான விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: διὰ τῆς χάριτος
  choice: அருளினால்
  rationale: διά உடன் genitive இங்கு வழிமுறை அல்லது கருவியைச் சுட்டுகிறது. ‘அருளினால்’ கிரேக்கத்தின் சுருக்கத்தைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தேவனுடைய’ என்பது சேர்க்கப்படவில்லை.
theological_decisions:
- issue: διὰ τῆς χάριτος என்பதன் தொடரியல் இணைப்பு
  choice: ‘அருளினால்’ என்பது ‘நம்பிக்கை கொண்டவர்களுக்கு’ என்பதோடு இணைக்கப்பட்டு, அவர்கள் அருளினால் நம்பிக்கை கொண்டார்கள் என்ற வாசிப்பு முதன்மை உரையில் தரப்பட்டுள்ளது.
  alternative: ‘அருளினால் அவர் நம்பிக்கை கொண்டவர்களுக்கு மிகவும் உதவினார்’ என்று, அருள் அப்பொல்லோவின் உதவியை விவரிப்பதாகவும் வாசிக்கலாம்.
  rationale: சொற்றொடரமைப்பிலும் சூழலிலும் ‘அருளினால்’ என்பது விசுவாசிகள் நம்பிக்கை கொண்ட விதத்தைக் குறிப்பதே சற்றே இயல்பானது. எனினும் அப்பொல்லோ செய்த உதவி அருளினால் நிகழ்ந்தது என்ற இணைப்பும் இலக்கணரீதியாக சாத்தியமானதால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அகாயா’, ‘சீடர்கள்’, ‘அருள்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; கிரேக்கத்தில் உள்ள தொடரியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
