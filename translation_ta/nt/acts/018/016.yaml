translation:
  language: ta
  text: அவன் அவர்களை நீதிமன்ற மேடையிலிருந்து[a] விரட்டிவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘நியாயாசனத்திலிருந்து’ அல்லது ‘நீதிமன்ற இருக்கையிலிருந்து’; கிரேக்கச் சொல், அதிகாரப்பூர்வமாக நீதி வழங்கும் இருக்கையையோ நீதிமன்ற மேடையையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: வாக்கியங்களை இணைக்கும் தனிச் சொல் சேர்க்கப்படவில்லை
  rationale: καί இங்கு கதையைத் தொடர்ந்து இணைக்கிறது. இயல்பான தமிழில் வாக்கியத் தொடரே அந்த இணைப்பைத் தெளிவாகக் காட்டுவதால், ‘பின்பு’ போன்ற காலநுட்பத்தைப் புதிதாகச் சேர்க்கவில்லை.
- source_word: ἀπήλασεν
  choice: விரட்டிவிட்டான்
  rationale: ἀπελαύνω என்பதன் இறந்தகால வடிவம் அதிகாரத்தோடும் வலுக்கட்டாயமாகவும் அகற்றிய செயலைக் குறிக்கிறது. ‘அனுப்பிவிட்டான்’ அல்லது ‘கலைந்துபோகச் சொன்னான்’ என்பதைவிட ‘விரட்டிவிட்டான்’ அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: முன்னுள்ள சூழலில் குறிப்பிடப்பட்டவர்களையே சுட்டுப்பெயர் குறிக்கிறது; அவர்களை மேலும் குறிப்பிட்டு விளக்காமல் மூலத்தின் சூழல்சார்ந்த தன்மை பாதுகாக்கப்படுகிறது.
- source_word: βήματος
  choice: நீதிமன்ற மேடை
  rationale: இந்த நீதித்துறைச் சூழலில் βῆμα என்பது அதிகாரி அமர்ந்து வழக்கை விசாரிக்கும் உயர்ந்த அதிகாரப்பூர்வ இருக்கை அல்லது நீதிமன்ற மேடையைக் குறிக்கிறது. ‘நீதிமன்ற மேடை’ என்பது அதன் இடம்சார்ந்ததும் நீதித்துறைசார்ந்ததுமான பொருள்களை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπὸ τοῦ βήματος
  choice: நீதிமன்ற மேடையிலிருந்து
  rationale: ἀπό என்பது அந்த நீதிவிசாரணை நடைபெற்ற இடத்திலிருந்து அவர்கள் அகற்றப்பட்டதைக் காட்டுகிறது; வெறுமனே அதிகாரியின் முன்னிலையிலிருந்து அனுப்பப்பட்டார்கள் என்று பொருளைச் சுருக்கவில்லை.
