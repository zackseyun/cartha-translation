  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: ta
  text: அவர்கள், “சட்டத்திற்கு முரணாக[a][b] இவன் மக்களைக் கடவுளை வழிபடும்படி இணங்கவைக்கிறான்” என்று குற்றஞ்சாட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சட்டத்திற்கு எதிராக’ அல்லது ‘சட்டத்தை மீறும் வகையில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: குற்றஞ்சாட்டியவர்கள் யூதச் சட்டத்தைக் குறிப்பிட்டிருக்கலாம்; ஆனால் கிரேக்க மூலத்தில் ‘சட்டம்’ என்று மட்டுமே உள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: என்று குற்றஞ்சாட்டினார்கள்
  rationale: இது முந்தைய வசனத்தில் தொடங்கிய குற்றச்சாட்டின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் வெறும் ‘சொல்லி’ என்பதைவிட, சூழலில் நடைபெறும் செயலை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: Παρὰ τὸν νόμον
  choice: சட்டத்திற்கு முரணாக
  rationale: παρά + வேற்றுமை உருபு இங்கு சட்டத்துக்கு எதிரான அல்லது அதை மீறும் செயலைக் குறிக்கிறது; குற்றச்சாட்டின் சட்டரீதியான தொனியையும் காக்கிறது.
- source_word: ἀναπείθει
  choice: தூண்டுகிறான்
  rationale: ஒருவரை ஒரு செயலில் ஈடுபடச் செல்வாக்குச் செலுத்துதல் என்ற பொருளைத் தருகிறது. கிரேக்கத்தில் கட்டாயமில்லாத ‘தவறாக வழிநடத்துகிறான்’ என்ற எதிர்மறைப் பொருளைச் சேர்க்கவில்லை.
- source_word: οὗτος
  choice: இவன்
  rationale: குற்றஞ்சாட்டுவோர் சுட்டிக்காட்டிப் பேசும் தொனியைச் சுருக்கமாகத் தருகிறது; தேவையற்ற இழிவுச் சாயலைச் சேர்ப்பதில்லை.
- source_word: τοὺς ἀνθρώπους
  choice: மக்களை
  rationale: இங்கு ஆண்களை மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிக்கும் பன்மைச் சொல்.
- source_word: σέβεσθαι τὸν θεόν
  choice: கடவுளை வழிபடும்படி
  rationale: இச்சூழலில் σέβομαι மதப்பற்றுடன் வணங்குதல் அல்லது வழிபடுதல் என்பதைக் குறிக்கிறது.
- source_word: τὸν νόμον
  choice: சட்டம்
  rationale: கிரேக்கம் எந்தச் சட்டம் என்று வெளிப்படையாகக் குறிப்பிடாமல் ‘சட்டம்’ என்று மட்டுமே கூறுவதால், அந்தத் தெளிவின்மை முதன்மை உரையில் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘சட்டம்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘சட்டம்’ என்று பொதுவாகவே வைத்தல்
  alternative: யூதச் சட்டம்; எங்கள் சட்டம்
  rationale: குற்றஞ்சாட்டுவோர் யூதச் சட்டத்தைக் குறிப்பிட்டிருக்க வாய்ப்பு மிகுதி. எனினும், மூல உரை அதை வெளிப்படையாகச் சொல்லாததால் விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் தருவது பொருத்தம்.
- issue: ἀναπείθει என்பதன் மதிப்பீட்டுச் சாயல்
  choice: தூண்டுகிறான்
  alternative: இணங்கச் செய்கிறான்; தவறாக வழிநடத்துகிறான்
  rationale: குற்றஞ்சாட்டுவோரின் எதிர்மறை நோக்கம் சூழலில் தெரிந்தாலும், வினைச்சொல் தானாகவே ‘தவறாக வழிநடத்துதல்’ என்ற வலுவான குற்றத்தீர்ப்பை கட்டாயப்படுத்தாது.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்றக் குற்றச்சாட்டின் தொனியைத் தெளிவாகவும் இயல்பாகவும் வைத்துள்ளது. ‘இவன்’ சுட்டிக்காட்டும் வலிமையைப் பாதுகாக்கிறது; ‘சட்டம்’ என்பதன் மூலத் தெளிவின்மை அடிக்குறிப்புடன் காக்கப்படுகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
