id: ACT.18.21
reference: Acts 18:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: ta
  text: ஆனால் அவர் அவர்களிடம் விடைபெற்று, “நான் மீண்டும் உங்களிடம் வருவேன், கடவுள் விரும்பினால்[b]” என்று சொல்லி[a], எபேசுவிலிருந்து கப்பலில் புறப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘என்று சொல்லி’ என்பதும் அதற்கு முந்திய மேற்கோள் முழுவதும் இடம்பெறவில்லை.
    reason: textual_variant
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘கடவுளுக்கு விருப்பமானால்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வேண்டுகோளுக்கு மாறான பவுலின் செயலைக் காட்டும் எதிர்மறை இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: ἀποταξάμενος
  choice: விடைபெற்று
  rationale: புறப்படுவதற்கு முன் நிகழ்ந்த விடைபெறுதலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: καὶ εἰπών
  choice: என்று சொல்லி
  rationale: கிரேக்க மூலத்தில் உள்ள இரண்டாவது பங்கேற்புவினையின் தொடரைத் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: Πάλιν
  choice: மீண்டும்
  rationale: திரும்பி வருவதைக் குறிக்கும் வழக்கமான வினையடைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἀνακάμψω
  choice: வருவேன்
  rationale: πάλιν என்பதுடன் சேர்ந்து ‘மீண்டும் வருவேன்’ எனத் திரும்பி வருதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘திரும்பி வருவேன்’ என மொழிபெயர்த்தால் ‘மீண்டும்’ என்பதுடன் தேவையற்ற இரட்டிப்பு ஏற்படும்.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம்
  rationale: நபர்களை நோக்கிய வருகையைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: τοῦ θεοῦ θέλοντος
  choice: கடவுள் விரும்பினால்
  rationale: இது கடவுளின் சித்தத்தைச் சார்ந்த நிபந்தனை என்பதைத் தெளிவாகப் பேணுகிறது; மூலத்தில் உள்ள θεός என்பதற்குப் பதிலாக ‘ஆண்டவர்’ என்பதை இறக்குமதி செய்யவில்லை.
- source_word: ἀνήχθη
  choice: கப்பலில் புறப்பட்டார்
  rationale: பயணச் சூழலில் இவ்வினை கடல் வழியாகப் புறப்படுவதைக் குறிக்கிறது; சொல்லுக்கு சொல் பொருந்தாத ‘மேலே கொண்டு செல்லப்பட்டார்’ என்ற மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: எபேசுவிலிருந்து
  rationale: புறப்பட்ட நகரத்தைத் தெளிவாகக் குறிக்கிறது; Ἔφεσος என்பதன் வழக்கமான தமிழ் பெயர் ‘எபேசு’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: பவுலின் பயணத் திட்டம் கடவுளின் விருப்பத்தைச் சார்ந்திருத்தல்
  choice: கடவுள் விரும்பினால்
  alternative: கடவுளுக்கு விருப்பமானால்
  rationale: τοῦ θεοῦ θέλοντος என்பது கடவுளின் விருப்பத்தைச் சார்ந்த நிபந்தனையை வெளிப்படுத்துகிறது. மூலத்தின் ‘கடவுள்’ என்ற குறிப்பைப் பேணி, வேறு வாசக மரபிலுள்ள ‘ஆண்டவர்’ என்பதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கப் பங்கேற்புவினைகளின் தொடரை ‘விடைபெற்று … என்று சொல்லி … புறப்பட்டார்’ என்ற இயல்பான தமிழ் அமைப்பில் பேணியுள்ளோம்.
