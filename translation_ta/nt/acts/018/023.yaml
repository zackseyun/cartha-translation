  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: ta
  text: அங்கே சிறிது காலம் தங்கிய பின்பு, அவர் புறப்பட்டு, கலாத்தியப் பகுதியையும் பிரிகியாவையும் வரிசையாகக் கடந்து சென்று, எல்லாச் சீடர்களையும் பலப்படுத்தினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: அங்கே சிறிது காலம் தங்கிய பின்பு
  rationale: ποιέω + χρόνον என்ற மரபுத்தொடர் ‘காலம் கழித்தல்/தங்கியிருத்தல்’ என்று பொருள்படும். முந்தைய வசனத்தில் கூறப்பட்ட இடத்தைச் சூழல் சுட்டுவதால் ‘அங்கே’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐξῆλθεν
  choice: அவர் புறப்பட்டு
  rationale: பயணக் கதையாடலில் இது ஓர் இடத்தைவிட்டு வெளியேறிப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்பட்டு’ இயல்பான தமிழாக்கம்.
- source_word: διερχόμενος καθεξῆς
  choice: அடுத்தடுத்து பயணம் செய்து
  rationale: διερχόμενος தொடர்ந்து பகுதிகளூடாகச் செல்வதையும், καθεξῆς வரிசையாக அல்லது ஒன்றன்பின் ஒன்றாகச் செல்வதையும் குறிக்கின்றன. ‘அடுத்தடுத்து’ அந்த வரிசையான முன்னேற்றத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: τὴν Γαλατικὴν χώραν καὶ Φρυγίαν
  choice: கலாத்தியப் பகுதியிலும் பிரிகியாவிலும்
  rationale: χώρα ஒரு பரந்த பகுதி அல்லது நிலப்பரப்பைக் குறிக்கிறது. கிரேக்கச் சொற்றொடரில் Φρυγίαν என்பதற்கும் பகுதி என்ற கருத்து பொருளில் தொடர்வதால், தமிழில் இணையான இடவெற்றுமை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: στηρίζων
  choice: பலப்படுத்தினார்
  rationale: στηρίζω என்பது உறுதிப்படுத்துதல், நிலைநிறுத்துதல், பலப்படுத்துதல் ஆகிய பொருள்களைக் கொண்டது. சீடர்களுக்கான தொடர்ச்சியான ஊழியத்தை அளவுக்கு மீறி விளக்காமல் ‘பலப்படுத்தினார்’ தெரிவிக்கிறது.
- source_word: πάντας τοὺς μαθητάς
  choice: சீடர்கள் அனைவரையும்
  rationale: μαθηταί என்பது அப்போஸ்தலர் நடபடிகளில் இயேசுவைப் பின்பற்றுவோருக்கான நிலையான சொல்; πάντας என்பதன் முழுமை ‘அனைவரையும்’ என்று தெளிவாகக் காக்கப்படுகிறது.
