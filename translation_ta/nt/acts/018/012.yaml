source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: ta
  text: கல்லியோன் அகாயாவின் புரோகான்சலாக இருந்தபோது, யூதர்கள்[a] ஒன்றுகூடி பவுலுக்கு எதிராக எழுந்து, அவரை நீதியிருக்கையின் முன் கொண்டுவந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “யூதர்கள்” என்பது பவுலுக்கு எதிராகச் செயல்பட்ட அந்தப் பகுதியின் யூதக் குழுவைக் குறிக்கிறது; எல்லா யூத மக்களையும் பொதுவாகக் குறிக்கவில்லை.
    reason: cultural_note
  - marker: b
    text: அல்லது, “நீதித்தீர்ப்பு மேடைக்கு.” கிரேக்கச் சொல் அதிகாரப்பூர்வமான நீதியிருக்கை அல்லது நீதித்தீர்ப்பு மேடையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: கல்லியோன்
  rationale: கிரேக்கப் பெயரின் ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: δὲ
  choice: —
  rationale: இங்கு இது மெலிதான கதைத் தொடர்ச்சி அல்லது மாற்றத்தைக் குறிக்கிறது; தனியாக ‘ஆனால்’ என்று மொழிபெயர்த்தால் தமிழில் தேவையற்ற வலுவான முரண்பாடு தோன்றலாம் என்பதால் காலத் துணைவாக்கிய அமைப்பிலேயே மாற்றம் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἀνθυπάτου ὄντος
  choice: ஆளுநராக இருந்தபோது
  rationale: காலப் பின்னணியைக் குறிக்கும் genitive absolute அமைப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἀνθύπατος
  choice: ஆளுநர்
  rationale: இது ரோம மாகாணத்தின் குறிப்பிட்ட proconsul பதவியைக் குறித்தாலும், பொதுவாசகருக்குப் புரியும் ‘ஆளுநர்’ முதன்மை உரையில் இயல்பானது; பதவியின் தொழில்நுட்பப் பெயரைச் சேர்ப்பது இவ்வசனத்தின் ஓட்டத்திற்கு அவசியமில்லை.
- source_word: Ἀχαΐας
  choice: அகாயா
  rationale: ரோம மாகாணப் பெயரை வழக்கமான தமிழ் ஒலிப்பில் எழுத்துப்பெயர்க்கிறது.
- source_word: κατεπέστησαν
  choice: எதிராக எழும்பி
  rationale: பவுலுக்கு எதிரான பகைமையான நடவடிக்கையை வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத உடல் வன்முறையைச் சேர்ப்பதில்லை.
- source_word: ὁμοθυμαδὸν
  choice: ஒன்றுசேர்ந்து
  rationale: ஒருமித்த, கூட்டு நடவடிக்கையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; முழுமையான கருத்தொற்றுமை என்ற பொருளை அளவுக்கு மீறி வலியுறுத்துவதில்லை.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கத்தின் நேரடியான சொல்லைத் தக்கவைக்கிறது; ‘தலைவர்கள்’ என்று மூலத்தில் இல்லாத வரம்பைச் சேர்க்கவில்லை. உள்ளூர் குழுவையே சூழல் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: τῷ Παύλῳ
  choice: பவுலுக்கு எதிராக
  rationale: κατεπέστησαν என்பதுடன் வரும் பகைமை சார்ந்த தத்தியைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἤγαγον αὐτὸν
  choice: அவரைக் கொண்டுவந்தார்கள்
  rationale: சட்ட விசாரணைச் சூழலுக்கு ஏற்ற பொதுவான பொருளை வழங்குகிறது; ‘இழுத்துக்கொண்டு வந்தார்கள்’ போன்ற மூலத்தில் இல்லாத கடுமையைச் சேர்ப்பதில்லை.
- source_word: ἐπὶ τὸ βῆμα
  choice: நீதிமன்றத்திற்கு
  rationale: அதிகாரப்பூர்வ நீதியிருக்கை அல்லது விசாரணை மேடையின் சட்டச் சூழலை நவீன வாசகருக்குத் தெளிவாகக் கூறுகிறது; சொல்லுக்குரிய மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: மோதல் நிகழ்வில் οἱ Ἰουδαῖοι என்பதன் மொழிபெயர்ப்பு
  choice: யூதர்கள்
  alternative: யூதத் தலைவர்கள் / யூதேயர்கள்
  rationale: மூல உரை பொதுவாக ‘யூதர்கள்’ என்றே கூறுகிறது; ஆகவே ‘தலைவர்கள்’ என்று குறுக்குவது உரையில் இல்லாத தகவலைச் சேர்க்கும். அதேவேளை, இதை எல்லா காலங்களிலும் உள்ள எல்லா யூதர்களையும் குறிக்கும் பொதுப்பழியாக வாசிக்காமல், இந்நிகழ்வில் செயல்பட்ட உள்ளூர் யூதக் குழுவைக் குறிக்கிறது என்று அடிக்குறிப்பு விளக்குகிறது.
- issue: ἀνθύπατος என்ற ரோமப் பதவியின் அளவான வெளிப்பாடு
  choice: ஆளுநர்
  alternative: புரோகான்சல் / மாகாண ஆளுநர்
  rationale: வரலாற்றுச் சிறப்புப் பதவியை பொதுவாசகர் உடனடியாகப் புரிந்துகொள்ளும் சொல்லால் தருகிறது. எந்த இறையியல் முடிவையும் சேர்க்காமல் நிர்வாகப் பங்கைச் சரியாகத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகருக்கு எளிதில் புரியக்கூடியதுமான நடையைப் பயன்படுத்துகிறது. சட்டச் சூழல் தெளிவாக வைக்கப்பட்டு, மூலத்தின் பகைமை உணர்வு மிகைப்படுத்தப்படவில்லை. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
