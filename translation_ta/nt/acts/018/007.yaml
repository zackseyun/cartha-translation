source:
  edition: SBLGNT
  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: ta
  text: அவர் அங்கிருந்து புறப்பட்டு, தீத்தியு யுஸ்து என்னும் ஒருவருடைய வீட்டிற்குள் நுழைந்தார். அவர் கடவுளை வழிபட்டு வந்தவர்[a]. அவருடைய வீடு யூத வழிபாட்டுக்கூடத்தை ஒட்டி இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளுக்குப் பயந்தவர்” அல்லது “கடவுளை வணங்குகிறவர்” என்றும் மொழிபெயர்க்கலாம். இங்கு பயன்படுத்தப்பட்டுள்ள கிரேக்கச் சொற்றொடர், இஸ்ரவேலின் கடவுளிடம் பக்தியுடைய பிற இனத்தவர் ஒருவரை விவரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “யூத வழிபாட்டுக்கூடத்துக்கு அடுத்ததாக இருந்தது” அல்லது “அதனுடன் எல்லையைப் பகிர்ந்திருந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: அங்கிருந்து புறப்பட்டு
  rationale: இடமாற்றத்தையும் பிரதான வினைக்கு முந்திய செயலையும் இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: εἰσῆλθεν εἰς οἰκίαν
  choice: வீட்டுக்குச் சென்றார்
  rationale: கிரேக்கத்தில் நேரடியாக ‘வீட்டுக்குள் நுழைந்தார்’ என்றாலும், இச்சூழலில் ஒருவருடைய வீட்டுக்குச் செல்வதை நவீன தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: தீத்தியு யுஸ்து என்னும்
  rationale: பெயரை ஒலிபெயர்த்து, ὀνόματι என்பதைக் இயல்பான தமிழ் பெயரறிமுக அமைப்பில் தருகிறது.
- source_word: σεβομένου τὸν θεόν
  choice: கடவுளை வழிபட்டு வந்தவர்
  rationale: இஸ்ரவேலின் கடவுளிடம் பக்தியுடைய பிற இனத்தவரைக் குறிக்கும் விளக்கத் தன்மையைப் பாதுகாக்கிறது; தொழில்நுட்பமான சமூகப் பிரிவுப்பெயரைத் திணிக்கவில்லை.
- source_word: συνομοροῦσα
  choice: ஒட்டி இருந்தது
  rationale: அருகாமை மட்டுமல்லாமல், இணைந்த எல்லை அல்லது பக்கச்சார்பு என்ற பொருளையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: συναγωγῇ
  choice: யூத வழிபாட்டுக்கூடம்
  rationale: சூழலில் யூதர்களின் synagogue என்பதைக் பொதுவாசகர்களுக்கு உடனடியாகப் புரியும் தமிழில் தருகிறது.
theological_decisions:
- issue: தீத்தியு யுஸ்துவை σεβόμενος τὸν θεόν என்று விவரித்தல்
  choice: கடவுளை வழிபட்டு வந்தவர்
  alternative: கடவுளுக்குப் பயந்தவர்; கடவுளை வணங்குகிறவர்
  rationale: கிரேக்கம் இஸ்ரவேலின் கடவுளிடம் அவருக்கிருந்த பக்தியைச் சுட்டுகிறது; ஆனால் அவரை ஒரு குறிப்பிட்ட அரை-தொழில்நுட்ப மத-சமூக வகையில் கட்டாயமாக வகைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க உறவுச்சொல் அமைப்பு வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; எல்லா அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
