  text: After this[a], he left Athens and went to Corinth.
translation:
  language: ta
  text: இதற்குப் பின்பு அவர் அத்தேனையை விட்டுப் புறப்பட்டு கொரிந்துவுக்குச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மேலும் சொல்லுக்குச் சொல் நெருக்கமாக: “இவற்றுக்குப் பின்பு, அத்தேனையிலிருந்து புறப்பட்டு, அவர் கொரிந்துவுக்கு வந்தார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: இதற்குப் பின்பு
  rationale: கதை நிகழ்வுகளின் கால வரிசையைக் காட்டும் இயல்பான நவீனத் தமிழ் தொடர்; சொல்லுக்குச் சொல் வரும் ‘இவற்றுக்குப் பின்பு’ என்பதன் பொருளையும் தெளிவாகத் தருகிறது.
- source_word: χωρισθεὶς
  choice: விட்டுப் புறப்பட்டு
  rationale: χωρίζω என்பதன் இறந்தகாலப் பங்கேற்பு இங்கு ஓர் இடத்திலிருந்து பிரிந்து புறப்படுவதைக் குறிக்கிறது. ‘விட்டுப் புறப்பட்டு’ என்பது அதன் பிரிதல் மற்றும் பயணம் தொடங்குதல் ஆகிய நுணுக்கங்களை இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: அத்தேனையை
  rationale: ἐκ வெளிவரும் தொடக்க இடத்தைக் குறிக்கிறது; தமிழில் ‘அத்தேனையை விட்டுப் புறப்பட்டு’ என்பது அதே பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἦλθεν
  choice: சென்றார்
  rationale: ἔρχομαι அடிப்படையில் ‘வந்தார்’ எனவும் அமையலாம்; ஆனால் அத்தேனையிலிருந்து கொரிந்துவுக்கான கதைநகர்வைத் தமிழில் ‘சென்றார்’ என்பது இயல்பாகக் காட்டுகிறது.
- source_word: εἰς Κόρινθον
  choice: கொரிந்துவுக்கு
  rationale: εἰς இலக்கை நோக்கிய நகர்வைக் குறிக்கிறது; நகரங்களுக்கு இடையிலான பயணத்தைத் தமிழில் ‘கொரிந்துவுக்கு’ என்பது தெளிவாகவும் இயல்பாகவும் தருகிறது.
