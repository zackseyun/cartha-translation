translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பங்கேற்பின் வரிசை ‘விட்டுப் புறப்பட்டு’ என்பதால் தக்கவைக்கப்பட்டு, இலக்கை நோக்கிய நகர்வு தமிழில் இயல்பாக ‘சென்றார்’ என வழங்கப்பட்டுள்ளது.
