  text: ἐρωτώντων δὲ αὐτῶν ἐπὶ πλείονα χρόνον ⸀μεῖναι οὐκ ἐπένευσεν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/020.yaml
  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: ta
  text: ஆனால், மேலும் நீண்ட காலம் தங்கும்படி அவர்கள் கேட்டபோது, அவர் அதற்கு இணங்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அதற்கு ஒப்புக்கொள்ளவில்லை” அல்லது “அவர் அந்த வேண்டுகோளை ஏற்கவில்லை.” கிரேக்க வினைச்சொல் ஒரு வேண்டுகோளுக்கு ஒப்புதல் அல்லது இசைவு அளிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτώντων
  choice: அவர்கள் கேட்டபோது
  rationale: நிகழ்காலப் பெயரெச்சத்துடன் அமைந்த தனி உடைமைவேற்றுமைத் தொடரை இயல்பான தமிழில் காலத்தைக் குறிக்கும் உட்பிரிவாக மொழிபெயர்க்கிறது; சூழலில் இது வேண்டுகோளைக் குறிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: 'முந்தைய நிகழ்விலிருந்து மென்மையான எதிர்மாற்றத்தைச் சுட்டுகிறது: அவர்கள் அவரை வரவேற்று தங்குமாறு கேட்டாலும், அவர் இணங்கவில்லை.'
- source_word: αὐτῶν
  choice: அவர்கள்
  rationale: எபேசுவில் வேண்டுகோள் விடுத்த மக்களையே இந்தப் பன்மைச் சுட்டுப்பெயர் குறிக்கிறது; தமிழில் எழுவாயாகத் தெளிவாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐπὶ πλείονα χρόνον
  choice: இன்னும் நீண்ட காலம்
  rationale: πλείονα என்பதிலுள்ள ஒப்பீட்டுப் பொருளைப் பாதுகாத்து, ஏற்கெனவே இருந்ததைவிடக் கூடுதல் காலம் என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: μεῖναι
  choice: தங்களோடு தங்கும்படி
  rationale: பயணச் சூழலில் ‘தங்குதல்’ என்பது இயல்பான சொல்; வேண்டுகோளின் உள்ளடக்கத்தைத் தமிழில் தெளிவுபடுத்த ‘-ும்படி’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘தங்களோடு’ என்பது சூழலால் உணரப்படும் பொருளை வெளிப்படுத்துகிறது.
- source_word: οὐκ ἐπένευσεν
  choice: அவர் அதற்கு இணங்கவில்லை
  rationale: ἐπινεύω என்பதன் வேண்டுகோளுக்கு ஒப்புதல் அல்லது இசைவு அளித்தல் என்ற பொருளைப் பாதுகாக்கிறது; ‘மறுத்துவிட்டார்’ என்பதிலுள்ள சற்றுக் கடுமையான நுண்ணுணர்வைத் தவிர்க்கிறது.
