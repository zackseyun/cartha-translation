id: ACT.18.15
reference: Acts 18:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: ta
  text: ஆனால், ஒரு சொல்[a], பெயர்கள், உங்களுக்குரிய சட்டம் ஆகியவற்றைப் பற்றிய கேள்விகள் என்றால், அவற்றை நீங்களே பார்த்துக்கொள்வீர்கள்; இவற்றில் நீதிபதியாக இருக்க நான் விரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு செய்தி” அல்லது “ஒரு போதனை.” λόγος என்ற கிரேக்கச் சொல் பரந்த பொருள்வளமுடையது; இங்கு விவாதிக்கப்பட்ட போதனையையோ சொற்பயன்பாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: கேள்விகள்
  rationale: விசாரணைக்கோ விவாதத்துக்கோ உரிய பிரச்சினைகளைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது; தேவையின்றி பகைமையான ‘சர்ச்சைகள்’ என்று தீவிரப்படுத்தவில்லை.
- source_word: περὶ λόγου
  choice: ஒரு சொல்[a] பற்றிய
  rationale: λόγος என்பதன் அகன்ற பொருளையும் இவ்விடத்தில் உள்ள தெளிவின்மையையும் நெருக்கமாகப் பாதுகாக்கிறது; ‘செய்தி’ அல்லது ‘போதனை’ என்று ஒரே பொருளில் முடிவுசெய்யவில்லை.
- source_word: ὀνομάτων
  choice: பெயர்கள்
  rationale: பெயர்கள், பட்டங்கள் அல்லது அழைப்புமுறைகள் எவை குறிக்கப்படுகின்றன என்பதைத் திறந்தவாறே வைக்கும் நேரடி மொழிபெயர்ப்பு.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: உங்களுக்குரிய சட்டம்
  rationale: இது ரோமச் சட்ட அதிகாரத்திற்குரியதல்ல, அவர்களுக்குள் பொருந்தும் சட்டம் என்ற கல்லியோனின் விலகிய நிலைப்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὄψεσθε αὐτοί
  choice: அவற்றை நீங்களே பார்த்துக்கொள்ளுங்கள்
  rationale: ‘நீங்களே கவனித்துக்கொள்ளுங்கள்’ என்ற இடைமொழிப் பொருளையும் αὐτοί தரும் வலியுறுத்தலையும் இயல்பாகக் கொண்டுவருகிறது.
- source_word: κριτὴς
  choice: நீதிபதி
  rationale: நீதிமன்றச் சூழலுக்கும் கல்லியோன் தீர்ப்பளிக்க மறுப்பதற்கும் ஏற்ற நேரடி சொல்.
- source_word: τούτων
  choice: இவற்றுக்கு
  rationale: முன் குறிப்பிடப்பட்ட கேள்விகள் அனைத்தையும் இயல்பாகச் சுட்டுகிறது.
- source_word: οὐ βούλομαι εἶναι
  choice: இருக்க நான் விரும்பவில்லை
  rationale: βούλομαι என்பதிலுள்ள விருப்பமின்மையை இயல்பாகக் கூறுகிறது; அதனை மிகைப்படுத்தி ஒரு முறைப்படியான சட்ட மறுப்பாக மாற்றவில்லை.
theological_decisions:
- issue: கல்லியோ நிராகரிக்கும் விவகாரத்தில் λόγος என்பதன் பொருள் வரம்பு
  choice: முதன்மை உரையில் ‘ஒரு சொல்’ என்று பொதுவாக மொழிபெயர்த்து, மாற்றுப் பொருட்களை அடிக்குறிப்பில் தருதல்
  alternative: ஒரு செய்தி; ஒரு போதனை; ஒரு கோட்பாடு
  rationale: இது யூதர்களுக்குள்ளான விவகாரத்தில் தீர்ப்பளிக்க ரோம அதிகாரி மறுக்கும் சூழல். λόγος எதைக் குறிப்பதாகும் என்பதை வசனம் துல்லியமாக வரையறுக்காததால், குறிப்பிட்ட இறையியல் பொருளைத் திணிக்காமல் மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்களே பார்த்துக்கொள்ளுங்கள்’ என்பது கல்லியோனின் விலகிய, சற்றுக் கடுமையான தொனியை இயல்பாகக் கொண்டுவருகிறது.
