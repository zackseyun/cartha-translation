revisions:
- from: ஆனால், ஒரு சொல்[a], பெயர்கள், உங்களுக்குரிய சட்டம் ஆகியவற்றைப் பற்றிய கேள்விகள் என்றால், அவற்றை நீங்களே பார்த்துக்கொள்ளுங்கள்; இவற்றுக்கு நீதிபதியாக இருக்க நான் விரும்பவில்லை.
  to: ஆனால், ஒரு சொல்[a], பெயர்கள், உங்களுக்குரிய சட்டம் ஆகியவற்றைப் பற்றிய கேள்விகள் என்றால், அவற்றை நீங்களே பார்த்துக்கொள்வீர்கள்; இவற்றில் நீதிபதியாக இருக்க நான் விரும்பவில்லை.
  rationale: The revision changes only the imperative to a future form in order to represent ὄψεσθε faithfully, and smooths the Tamil expression for being a judge in these matters. It preserves the lexical and theological ambiguity of λόγος and retains the existing footnote anchor.
