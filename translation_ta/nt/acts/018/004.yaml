- source_word: ἐν τῇ συναγωγῇ
  choice: யூத வழிபாட்டுக்கூடத்தில்
  rationale: சினகோக் என்பதைக் கடன்சொல்லாக வழங்காமல், சாதாரண வாசகர்களுக்குத் தெளிவாக அதன் இடத்தையும் சமூகச் சூழலையும் காட்டும் இயல்பான தமிழ்ச் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: κατὰ πᾶν σάββατον
  choice: ஒவ்வொரு ஓய்வுநாளிலும்
  rationale: κατά உடன் வரும் πᾶν இங்கு பகிர்வுப்பொருளில் ‘ஒவ்வொரு’ என்பதைக் குறிக்கிறது; ‘ஓய்வுநாள்’ சப்பாத்தின் அடிப்படைப் பொருளையும் வழக்கமான தமிழ் வேதாகமப் பயன்பாட்டையும் காக்கிறது.
- source_word: ἔπειθέν
  choice: இணங்கச் செய்ய முயன்றார்
  rationale: முற்றுப்பெறா வினைவடிவம் தொடர்ந்து மேற்கொண்ட சம்மதிக்கச் செய்யும் முயற்சியைச் சூழலில் உணர்த்தலாம். ‘முயன்றார்’ என்பது அனைவரும் உண்மையில் இணங்கிவிட்டனர் என்ற தேவையற்ற முடிவைத் தவிர்க்கிறது; இதற்கான நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τε
  choice: -உம் … -உம்
  rationale: τε இணைக்கும் இரு குழுக்களையும் தமிழில் ‘யூதர்களையும் கிரேக்கர்களையும்’ என்ற இயல்பான இணை அமைப்பு வெளிப்படுத்துகிறது.
- source_word: Ἰουδαίους
  choice: யூதர்களை
  rationale: இங்கு இது யூத மக்களை இன-சமயக் குழுவாகக் குறிக்கிறது; யூதேயா பகுதியைச் சேர்ந்தவர்களை மட்டும் குறிக்கவில்லை.
- source_word: Ἕλληνας
  choice: கிரேக்கர்களை
  rationale: மூலச்சொல்லின் நேரடியான அடையாளம் காக்கப்படுகிறது. அவர்கள் யூதர் அல்லாதவர்கள் அல்லது வழிபாட்டுக்கூடத்துடன் தொடர்புடையவர்கள் என இருக்கக்கூடும்; ஆனால் மூலவசனம் அவர்களை இன்னும் குறிப்பாக வகைப்படுத்தவில்லை.
theological_decisions:
- issue: வழிபாட்டுக்கூடச் சூழலில் Ἕλληνας என்பவர்களின் அடையாளம்
  choice: கிரேக்கர்கள்
  alternative: யூதரல்லாதவர்கள்; கடவுளுக்குப் பயந்த கிரேக்கர்கள்
  rationale: வசனம் பயன்படுத்தும் பொதுவான இன-பண்பாட்டு அடையாளத்தையே மொழிபெயர்ப்பு காக்கிறது. அவர்கள் ‘கடவுளுக்குப் பயந்தவர்கள்’ என்று வசனம் வெளிப்படையாகக் கூறாததால் அந்தக் குறிப்பை முதன்மை உரையில் சேர்க்கவில்லை.
- issue: ἔπειθέν வெற்றியைக் குறிக்கிறதா அல்லது தொடர்ந்த முயற்சியைக் குறிக்கிறதா
  choice: இணங்கச் செய்ய முயன்றார்
  alternative: இணங்கச் செய்துவந்தார்
  rationale: முற்றுப்பெறா வடிவம் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட செயலைக் காட்டுகிறது; சூழலில் முயற்சி என்ற நுண்பொருள் சாத்தியமானது. எனினும் கிரேக்க வினைச்சொல் தானாகவே ‘முயற்சி’ என்று சொல்லாததால் மாற்று அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
