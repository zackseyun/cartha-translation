  yaml_path: translation/nt/acts/010/001.yaml
  text: There was a man in Caesarea named Cornelius[a], a centurion from the cohort called the Italian Cohort[b],
translation:
  language: ta
  text: செசரியாவில் கொர்நேலியு என்ற பெயருடைய ஒரு மனிதர் இருந்தார்; அவர் ‘இத்தாலியப் படையணி’ என்று அழைக்கப்பட்ட படையணியைச் சேர்ந்த ஒரு நூற்றுவர் தலைவர் இருந்தார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செசரியாவில் ஒரு குறிப்பிட்ட மனிதர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில், கதையில் புதிதாக அறிமுகமாகும் ஒருவரைக் குறிக்கும் குறிப்பற்ற சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘படையணி’ என்பது ரோமப் படையின் ஓர் அலகு. ‘இத்தாலியப் படையணி’ என்பது இத்தாலியோடு தொடர்புடைய அல்லது இத்தாலிய வீரர்களைக் கொண்ட ஓர் அலகைக் குறித்திருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: ஒரு மனிதர் இருந்தார்
  rationale: ἀνήρ என்பது வயது வந்த ஆணைக் குறிக்கிறது; τις அவரை கதையில் முதன்முறையாக அறிமுகப்படுத்தும் குறிப்பற்ற சொல்லாகும். தமிழில் ‘ஒரு மனிதர் இருந்தார்’ என்பது இதை இயல்பாகத் தெரிவிக்கிறது. δέ இங்கு புதிய காட்சிக்கான மென்மையான தொடர்பை அளிக்கிறது; தனியாக ஒரு இணைப்புச் சொல்லைச் சேர்ப்பது தமிழில் தேவையில்லை.
- source_word: ἐν Καισαρείᾳ
  choice: செசரியாவில்
  rationale: இடப்பொருளைக் குறிக்கும் சொற்றொடரை வழக்கமான தமிழ் ஒலிபெயர்ப்புடன் நேரடியாக வழங்குகிறது.
- source_word: ὀνόματι Κορνήλιος
  choice: கொர்நேலியு என்ற பெயருடைய
  rationale: ὀνόματι என்பதன் பெயர் அறிமுகப்படுத்தும் இயல்பைத் தெளிவான நவீன தமிழில் தருகிறது; ‘கொர்நேலியு’ என்பது தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ἑκατοντάρχης
  choice: நூற்றுவர் தலைவர்
  rationale: ரோமப் படையின் இந்த அதிகாரிப் பதவிக்கான துல்லியமான, தமிழில் வழக்குள்ள வரலாற்றுச் சொல்; அவர் கட்டாயமாகச் சரியாக நூறு பேருக்குத் தலைமை வகித்தார் என்ற விளக்கப் பொருளைச் சேர்க்கவில்லை.
- source_word: ἐκ σπείρης
  choice: படையணியைச் சேர்ந்த
  rationale: ἐκ இங்கு ஓர் அமைப்பைச் சேர்ந்திருப்பதைக் குறிக்கிறது. σπεῖρα என்பதற்கு ரோமப் படையின் cohort என்ற பிரிவைக் குறிக்கும் வாசிக்க எளிய சொல்லாக ‘படையணி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: ‘இத்தாலியப் படையணி’ என்று அழைக்கப்பட்ட
  rationale: καλουμένης என்பதன் ‘அழைக்கப்பட்ட’ என்ற பொருளையும் Ἰταλικῆς என்ற அலகின் பெயரையும் தெளிவாகப் பாதுகாக்கிறது.
