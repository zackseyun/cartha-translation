id: ACT.10.26
reference: Acts 10:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: ta
  text: ஆனால் பேதுரு அவனை எழுப்பி[a], “எழுந்து நில்[b]; நானும் ஒரு மனிதன்தான்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அவனைத் தூக்கி எழுப்பி” அல்லது “அவன் எழுந்திருக்க உதவி செய்து.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “எழு” அல்லது “எழுந்திரு.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது “நானும்கூட ஒரு மனிதனே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: அவனை எழுப்பி
  rationale: ἐγείρω என்பதன் அடிப்படைச் செயற்பொருளான ஒருவரை எழும்பச் செய்தல் என்பதைக் காக்கிறது. பேதுரு கொர்நேலியுவை எவ்வாறு எழுப்பினார் என்பதைத் தேவையின்றி குறிப்பாக்காமல், இச்சூழலில் இயல்பான தமிழாக உள்ளது.
- source_word: Ἀνάστηθι
  choice: எழுந்து நில்
  rationale: காலில் எழுந்து நிற்கும்படியான நேரடிக் கட்டளையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. ‘எழு’ என்பதும் சாத்தியம்; ஆனால் முந்தைய வசனத்தில் அவர் கால்களில் விழுந்திருந்த சூழலை ‘எழுந்து நில்’ தெளிவாக எடுத்துரைக்கிறது.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: நானும்
  rationale: καί தரும் ‘கூட/உம்’ என்ற உள்ளடக்கத்தையும் αὐτός தரும் வலியுறுத்தலையும் தமிழின் இயல்பான ‘நானும்’ என்பதில் சுருக்கமாக வெளிப்படுத்துகிறது; மாற்று வடிவில் வலியுறுத்தலை இன்னும் வெளிப்படையாகக் காட்டலாம்.
- source_word: ἄνθρωπός εἰμι
  choice: ஒரு மனிதன்தான்
  rationale: ἄνθρωπος என்பதைக் ‘மனிதன்’ என நேரடியாக வழங்குகிறது. ‘தான்’ தமிழில் பேதுருவின் பகிர்ந்த மனிதநிலையை வலியுறுத்துகிறது; கிரேக்கத்தில் இல்லாத ‘வெறும்’ அல்லது ‘மட்டுமே’ போன்ற மதிப்பீட்டைச் சேர்ப்பதில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கொர்நேலியு பேதுருவின் கால்களில் விழுந்த செயலுக்கும் பேதுருவின் திருத்தும் பதிலுக்கும் இடையிலான மிதமான முரண்பாட்டைக் காட்டுகிறது.
theological_decisions:
- issue: பேதுருவின் கால்களில் விழுந்து வணங்கியதற்கான அவரது பதில்
  choice: தனக்குச் செலுத்தப்பட்ட அளவுமீறிய மரியாதையை பேதுரு ஏற்காமல், கொர்நேலியுவைப் போலத் தானும் மனிதன் என்பதைச் சொல்வதாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை விரிவான இறையியல் உட்பொருள் இல்லாத பேதுருவின் எளிய தாழ்மையாக மட்டும் புரிந்துகொள்ளலாம்.
  rationale: ‘எழுந்து நில்; நானும் ஒரு மனிதன்தான்’ என்பது உரையின் நேரடிப் பொருளைக் காக்கிறது. வழிபாடு குறித்த ஒரு முழுமையான கோட்பாட்டை இவ்வசனத்திற்குள் சேர்க்காமலும், பேதுருவின் மறுப்பையும் அதற்கான பகிர்ந்த மனிதநிலை காரணத்தையும் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எழுப்பி’ மூலவினையின் செயற்பொருளைக் காக்கிறது; ‘மனிதன்தான்’ பகிர்ந்த மனிதநிலையை இயல்பாக வலியுறுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
