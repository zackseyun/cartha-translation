translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘மொட்டைமாடி’ என்பது தட்டையான, பயன்படுத்தக்கூடிய வீட்டுக் கூரையை இயல்பாகக் குறிக்கிறது. மூலத்தின் ‘ஆறாம் மணிநேரம்’ பிரதான உரையில் பாதுகாக்கப்பட்டு, அதன் பண்பாட்டு நேர மதிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
