id: ACT.10.9
reference: Acts 10:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: ta
  text: மறுநாள்[a], அவர்கள் பயணம் செய்துகொண்டு அந்த நகரத்தை நெருங்கிக்கொண்டிருந்தபோது, பேதுரு ஏறக்குறைய ஆறாம் மணிநேரத்தில் ஜெபிப்பதற்காக வீட்டின் மொட்டைமாடிக்கு ஏறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யூதர்களின் பகல்நேரக் கணக்கின்படி இது ஏறக்குறைய நண்பகல்.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: மறுநாள்
  rationale: காலத்தைக் குறிக்கும் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது. δέ-யின் மென்மையான கதைத் தொடர்பைத் தமிழில் தனிச்சொல்லால் வெளிப்படுத்த வேண்டிய அவசியமில்லை.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: அவர்கள் பயணம் செய்து
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட கொர்நேலியுவின் தூதர்களையே ἐκείνων சுட்டுகிறது; தொடர்பு தெளிவாக இருப்பதால் இயல்பான தமிழில் ‘அவர்கள்’ போதுமானது.
- source_word: τῇ πόλει ἐγγιζόντων
  choice: அந்த நகரத்தை நெருங்கிக்கொண்டிருந்தபோது
  rationale: ἐγγίζω என்பதன் நெருங்கிவரும் இயக்கத்தையும், இரண்டு பங்கேற்பு வினைகளின் ஒரேகாலச் செயலையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἀνέβη
  choice: ஏறினார்
  rationale: மொட்டைமாடிக்குச் செல்லும் மேல்நோக்கிய இயக்கத்தைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἐπὶ τὸ δῶμα
  choice: வீட்டின் மொட்டைமாடிக்கு
  rationale: மக்கள் பயன்படுத்தக்கூடிய தட்டையான வீட்டுக் கூரையைக் குறிக்கும் δῶμα-வின் வரலாற்று-கட்டடச் சூழலை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: προσεύξασθαι
  choice: ஜெபிப்பதற்காக
  rationale: இது ἀνέβη என்பதற்கான நோக்கத்தைக் காட்டும் வினையெச்சம்; தமிழில் நோக்கத்தை நேரடியாகக் குறிக்கிறது.
- source_word: περὶ ὥραν ἕκτην
  choice: ஏறக்குறைய ஆறாம் மணிநேரத்தில்
  rationale: περί-யின் தோராயப் பொருளையும் மூலப் பண்பாட்டின் நேரக் கணக்கையும் பாதுகாக்கிறது; இன்றைய நேரத்திற்கான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
