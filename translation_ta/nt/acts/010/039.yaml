id: ACT.10.39
reference: Acts 10:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: ta
  text: அவர் யூதர்களின் நாட்டிலும் எருசலேமிலும் செய்த அனைத்திற்கும் நாங்களும் சாட்சிகள். அவரை அவர்கள் ஒரு மரத்தில்[a] தொங்கவிட்டுக் கொன்றார்கள்; மேலும், அதற்கு நாங்களே சாட்சிகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரப்பொருளின்மீது”; விளக்கமாக, “சிலுவையில்.” கிரேக்க மூலத்தில் “மரம்” என்று உள்ளது; இது உபாகமம் 21:23-ஐ எதிரொலிக்கலாம்.
    reason: ξύλον என்பதன் சொல்லியல் மாற்றுகளையும் உபாகமத்துடனான சாத்தியமான தொடர்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: μάρτυρες
  choice: சாட்சிகள்
  rationale: நேரில் கண்டவற்றை உறுதிப்படுத்திச் சொல்பவர்களைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்; அப்போஸ்தலர்களின் நேரடிச் சாட்சியத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: πάντων ὧν ἐποίησεν
  choice: அவர் செய்த அனைத்திற்கும்
  rationale: πάντων என்பதன் முழுமையான பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων καὶ Ἰερουσαλήμ
  choice: யூதர்களின் நாட்டிலும் எருசலேமிலும்
  rationale: χώρα என்பதைக் குறிப்பிட்ட ரோம மாகாணமாகச் சுருக்காமல் ‘நாடு/பகுதி’ என்ற பரந்த பொருளில் தருகிறது; τε ... καὶ என்ற இணை அமைப்பை ‘இலும் ... இலும்’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνεῖλαν
  choice: கொன்றார்கள்
  rationale: இங்கு ἀναιρέω என்பதன் ‘உயிரை நீக்குதல்’ என்ற பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: κρεμάσαντες
  choice: தொங்கவிட்டு
  rationale: இறப்பை ஏற்படுத்திய செயல் அல்லது வழியைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: ἐπὶ ξύλου
  choice: ஒரு மரத்தில்
  rationale: ξύλον என்பதன் ‘மரம்/மரப்பொருள்’ என்ற மூலச் சொல்லாட்சியைப் பேணி, அதை நேரடியாக ‘சிலுவை’ என்று விளக்கித் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: சிலுவையில் அறையப்பட்ட சூழலில் ξύλου என்பதன் மொழிபெயர்ப்பு
  choice: ஒரு மரத்தில்
  alternative: ஒரு சிலுவையில்; மரத்தின்மீது
  rationale: மூலத்தில் σταυρός அல்ல, ξύλον பயன்படுத்தப்பட்டுள்ளது. ‘மரம்’ என்பது அந்தச் சொல்லாட்சியையும் உபாகமம் 21:23-க்கான சாத்தியமான எதிரொலியையும் காக்கிறது; ‘சிலுவை’ என்பது மூலத்தைவிட விளக்கமான மொழிபெயர்ப்பாகிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. καὶ ἡμεῖς என்பதன் இணை/வலியுறுத்தும் நுணுக்கம் ‘நாங்களும்’ எனக் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘மரத்தில்’ என்ற சொல்லுக்கு உடனடியாக அடுத்ததாக வைக்கப்பட்டுள்ளது.
