base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: ta
  text: 'மறுபடியும் இரண்டாவது முறையாக அவனிடம் ஒரு குரல் வந்தது: “கடவுள் தூய்மையாக்கியவற்றை நீ தீட்டானவை என்று கருதாதே[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசுத்தமானவை என்று சொல்லாதே”; அல்லது, “தூய்மையற்றவையாக நடத்தாதே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: ஒரு குரல்
  rationale: எழுவாய் குறிப்பிட்ட பெயர்ச்சொல்லாக இல்லாவிட்டாலும், தமிழில் இயல்பாகவும் பரலோகத்திலிருந்து மீண்டும் வந்த உரையை முன்னிறுத்தவும் ‘ஒரு குரல்’ பொருத்தமானது.
- source_word: πάλιν ἐκ δευτέρου
  choice: மறுபடியும் இரண்டாவது முறையாக
  rationale: கிரேக்கத்தில் உள்ள வலியுறுத்தலுடன் கூடிய மீளுரையைச் சற்றே அசாதாரணமாக இருந்தாலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: πρὸς αὐτόν
  choice: அவனிடம்
  rationale: பேச்சு பேதுருவை நோக்கி உரைக்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Ἃ
  choice: எவற்றை … அவற்றை
  rationale: நடுநிலைப் பன்மை தொடர்புப்பெயரின் பொதுப்படுத்தும் பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: ஒரே கடவுளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐκαθάρισεν
  choice: தூய்மையாக்கிய
  rationale: கடவுளின் நிறைவேற்றப்பட்ட செயலைக் காட்டுவதோடு சடங்குத் தூய்மை சார்ந்த பொருளையும் காக்கிறது.
- source_word: σὺ
  choice: நீ
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள வலியுறுத்தப்பட்ட இரண்டாம் நபர் பெயர்ச்சொல்லைப் பாதுகாக்கிறது.
- source_word: μὴ κοίνου
  choice: தீட்டானவை என்று கருதாதே
  rationale: κοινόω என்பதன் தூய்மைச் சூழலிலான ‘பொதுவானது/தீட்டுப்பட்டது என மதித்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘அசுத்தம்’ என்ற வேறு கிரேக்கச் சொல்லுடனான வேறுபாட்டை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: பேதுருவின் தரிசனத்திலுள்ள தூய்மைச் சொற்களின் மொழிபெயர்ப்பு
  choice: ‘தீட்டானவை என்று கருதாதே’ என்பதை முதன்மை உரையில் வைத்தல்
  alternative: ‘அசுத்தமானவை என்று சொல்லாதே’ அல்லது ‘தூய்மையற்றவையாக நடத்தாதே’
  rationale: καθαρίζω என்பதற்கு எதிராக κοινόω பயன்படுத்தப்பட்டிருப்பதைப் பாதுகாக்கிறது. தமிழில் ‘பொதுவானவை என்று அழைக்காதே’ என்பது தவறான சாதாரணப் பொருளைத் தரக்கூடும்; ‘தீட்டு’ என்பது சடங்கு மாசின் நுணுக்கத்தை இயல்பாக எடுத்துரைக்கிறது. அதேவேளை மாற்று விளக்கங்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாகப் புரியும் தமிழ். ‘மறுபடியும் இரண்டாவது முறையாக’ என்ற கிரேக்க மீளுரை திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது; ‘தீட்டு’ சடங்குத் தூய்மைச் சூழலை உணர்த்துகிறது.
