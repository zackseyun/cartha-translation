  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: ta
  text: ஆகவே, உங்களை வரவழைக்க உடனே[a] செய்தி அனுப்பினேன்; நீங்கள் இங்கு வந்தது நல்லதே. இப்போது நாங்கள் அனைவரும், ஆண்டவர்[b] உங்களுக்குக் கட்டளையிட்ட அனைத்தையும் கேட்பதற்காகக் கடவுளின் முன்னிலையில் இங்கே இருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடனடியாக” அல்லது “தாமதமின்றி.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “ஆண்டவர்” என்றே உள்ளது. சூழலில் இது இயேசுவைக் குறிப்பதாக இருக்க வாய்ப்பு அதிகம்; ஆனால் சிலர் இதைப் பொதுவாகக் கடவுளைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: உடனே
  rationale: செயல் தாமதமின்றி நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய செய்தியிலிருந்து கொர்நேலியு எடுத்த நடவடிக்கையைத் தொடர்ச்சியாகவும் காரணவிளைவுடனும் இணைக்கிறது.
- source_word: ἔπεμψα πρὸς σέ
  choice: உங்களை அழைத்துவர ... ஆள் அனுப்பினேன்
  rationale: சொல்லுக்குச் சொல் ‘உங்களிடம் அனுப்பினேன்’ என்றாலும், பேதுருவை வரவழைக்கத் தூதர்களை அனுப்பிய சூழ்நிலைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: σύ τε καλῶς ἐποίησας παραγενόμενος
  choice: நீங்களும் இங்கு வந்தது நல்லது
  rationale: பேதுருவின் வருகையைப் பாராட்டும் கிரேக்க மரபுத்தொடரின் பொருளை எளிய, மரியாதையான தமிழில் தருகிறது.
- source_word: νῦν οὖν
  choice: இப்போது
  rationale: கூடியிருப்பதன் நோக்கத்துக்கான உரைமாற்றத்தை இயல்பாகக் குறிக்கிறது; தமிழில் தேவையற்ற இரட்டிப்பு இணைப்பைத் தவிர்க்கிறது.
- source_word: πάντες ἡμεῖς
  choice: நாங்கள் அனைவரும்
  rationale: கூடியிருந்த முழுக் குழுவையும் வலியுறுத்தும் மூலத்தின் அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளின் முன்னிலையில்
  rationale: கடவுளுடைய சந்நிதியில் தாங்கள் இருப்பதைக் குறித்த உணர்வையும் நிகழ்வின் பயபக்தியான தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: πάρεσμεν
  choice: இங்கே இருக்கிறோம்
  rationale: ‘வந்திருக்கிறோம்/உடனிருக்கிறோம்’ என்பதைக் காட்டும் வினையை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ἀκοῦσαι
  choice: கேட்பதற்காக
  rationale: கூடியிருப்பதன் நோக்கத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: உங்களுக்குக் கட்டளையிட்ட அனைத்தையும்
  rationale: அனைத்தையும் உள்ளடக்கும் பொருளையும் அதிகாரத்தோடு வழங்கப்பட்ட அறிவுறுத்தலின் வலிமையையும் காக்கிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவர்
  rationale: மூலத்தில் உள்ள κύριος என்ற பட்டத்தை விரிவாக்காமல் அப்படியே காத்து, அதன் சாத்தியமான குறிப்பைத் திறந்த நிலையில் வைக்கிறது.
theological_decisions:
- issue: τοῦ κυρίου (‘ஆண்டவர்’) யாரைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: சூழலின் அடிப்படையில் ‘இயேசு’ என்று வெளிப்படையாகக் கூறுதல், அல்லது உடனே முன் வரும் ‘கடவுள்’ என்பதைக் குறிப்பதாகப் புரிந்துகொள்ளுதல்.
  rationale: கிரேக்க மூலத்தில் ‘ஆண்டவர்’ என்று மட்டுமே உள்ளது. அப்போஸ்தலர் 10-ன் சூழலில் இது இயேசுவைக் குறிப்பதாக இருக்க வாய்ப்பு அதிகம்; எனினும் மூலத்தில் இல்லாத பெயரைச் சேர்க்காமல் அதன் இறையியல் நுட்பத்தையும் உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையான ஒருமை வடிவமாக ‘உங்கள்/நீங்கள்’ பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் கண்ணியமான உரைநடையைக் காக்கிறது; அதேவேளை சாதாரண வாசகர்களுக்கும் இயல்பாகப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது.
