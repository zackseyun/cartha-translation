revisions:
- from: 'நாசரேத்தைச் சேர்ந்த இயேசுவைக் குறித்து: கடவுள் அவரைப் பரிசுத்த ஆவியாலும் வல்லமையாலும் அபிஷேகம் செய்தார்; அவர் நன்மை செய்துகொண்டும், பிசாசினால் ஒடுக்கப்பட்ட அனைவரையும் குணமாக்கிக்கொண்டும் எங்கும் சென்றார். ஏனெனில் கடவுள் அவரோடு இருந்தார்.'
  to: நாசரேத்தைச் சேர்ந்த இயேசுவைப் பற்றி, கடவுள் அவரைப் பரிசுத்த ஆவியாலும் வல்லமையாலும் அபிஷேகம் செய்தார்; அவர் நன்மை செய்தும், பிசாசினால் ஒடுக்கப்பட்ட அனைவரையும் குணமாக்கியும் சுற்றிவந்தார்; ஏனெனில் கடவுள் அவரோடு இருந்தார்.
  rationale: The revision retains the draft’s faithful renderings of the key Greek terms while smoothing the contextual introductory phrase and using natural Tamil participial parallelism for Jesus’ itinerant ministry. The causal force of ὅτι remains explicit through “ஏனெனில்.” No footnote is necessary, since the source does not require a textual or lexical qualification here.
