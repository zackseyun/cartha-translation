source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: ta
  text: நாசரேத்தைச் சேர்ந்த இயேசுவைப் பற்றி, கடவுள் அவரைப் பரிசுத்த ஆவியாலும் வல்லமையாலும் அபிஷேகம் செய்தார்; அவர் நன்மை செய்தும், பிசாசினால் ஒடுக்கப்பட்ட அனைவரையும் குணமாக்கியும் சுற்றிவந்தார்; ஏனெனில் கடவுள் அவரோடு இருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: நாசரேத்தைச் சேர்ந்த இயேசுவைக் குறித்து
  rationale: ἀπό இயேசுவின் ஊர் அல்லது பிறப்பிடத் தொடர்பைச் சுட்டுகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘நாசரேத்தைச் சேர்ந்த’ என மொழிபெயர்க்கப்பட்டது; முந்தைய வசனத்திலிருந்து தொடரும் வேற்றுமை அமைப்பை உணர்த்த ‘குறித்து’ சேர்க்கப்பட்டது.
- source_word: ὡς
  choice: (முக்காற்புள்ளிக்குப் பின் வரும் விளக்கவுரை)
  rationale: இங்கு ὡς இயேசுவைக் குறித்த செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தனியாக ‘எப்படி’ என்று இடுவது தமிழில் செய்முறையை வலியுறுத்துவது போலத் தோன்றக்கூடும்; முக்காற்புள்ளி அதே விளக்கச் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔχρισεν
  choice: அபிஷேகம் செய்தார்
  rationale: χρίω என்பதன் அபிஷேக உருவகத்தையும் மேசியா சார்ந்த ஒலிப்பையும் பாதுகாக்கிறது; ‘நியமித்தார்’ அல்லது ‘வல்லமை அளித்தார்’ எனக் குறுக்கவில்லை.
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: பரிசுத்த ஆவியாலும் வல்லமையாலும்
  rationale: இரு தத்திகளின் கருவிப் பொருளையும் இணை அமைப்பையும் பாதுகாக்கிறது. ‘வல்லமை’ என்பதை அற்புத ஆற்றலுக்கு மட்டும் சுருக்கவில்லை.
- source_word: διῆλθεν εὐεργετῶν
  choice: நன்மை செய்துகொண்டும் ... எங்கும் சென்றார்
  rationale: διέρχομαι இங்கு இடம்விட்டு இடம் சென்று ஊழியம் செய்ததைக் குறிக்கிறது; தொடர்ச்சியான நன்மைச் செயலை இணைவினையெச்சம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἰώμενος πάντας τοὺς καταδυναστευομένους
  choice: ஒடுக்கப்பட்ட அனைவரையும் குணமாக்கிக்கொண்டும்
  rationale: ἰάομαι என்பதற்கு நேரான ‘குணமாக்கு’ பயன்படுத்தப்பட்டது. καταδυναστεύω கூறும் கடுமையான ஆதிக்கநிலையை ‘ஒடுக்கப்பட்ட’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: பிசாசினால்
  rationale: διάβολος இங்கு தனிப்பட்ட தீயவனைச் சுட்டுவதால் தமிழில் பரவலாகப் புரியும் நிலையான சொல் பயன்படுத்தப்பட்டது.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: ஏனெனில் கடவுள் அவரோடு இருந்தார்
  rationale: ὅτι என்பதன் காரணப் பொருளை வெளிப்படையாகக் காக்கிறது; θεός என்பதற்கு நவீன பொது வழக்கில் இயல்பான ‘கடவுள்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: இயேசுவின் அபிஷேகத்துக்கும் அவருடைய அடையாளம் மற்றும் பணிக்கும் உள்ள தொடர்பு
  choice: ‘அபிஷேகம் செய்தார்’ என்ற வேதாகம உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘மேசியாவாக நியமித்தார்’ அல்லது ‘வல்லமை அளித்தார்’ என்று விளக்கிப் பொருளுரைத்தல்
  rationale: வசனம் கூறுவதைக் கடந்த கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் χρίω சொல்லின் பரந்த வேதாகம ஒலிப்பைப் பாதுகாக்கிறது.
- issue: πνεύματι ἁγίῳ என்பதன் குறிப்பு
  choice: தெய்வீக நபரான ‘பரிசுத்த ஆவி’ என மொழிபெயர்த்தல்
  alternative: தனிப்பட்ட நபரல்லாத ‘பரிசுத்தமான ஆற்றல்’ எனப் புரிதல்
  rationale: அப்போஸ்தலர் நடபடிகளில் இச்சொற்றொடர் பரிசுத்த ஆவியைக் குறிக்கிறது; மேலும் இவ்வசனம் ஆவியையும் வல்லமையையும் இணைத்தாலும் வேறுபடுத்திக் கூறுகிறது.
- issue: ὅτι தொடங்கும் காரண வாக்கியம்
  choice: ‘ஏனெனில்’ என காரணத் தொடர்பைத் தெளிவாகக் காத்தல்
  alternative: வெறும் உடனிருப்பைக் கூறும் இணை வாக்கியமாக மாற்றுதல்
  rationale: கடவுள் இயேசுவோடு இருந்தது அவருடைய நன்மைசெய்தல் மற்றும் குணமாக்கும் பணிக்கான காரண அடிப்படையாக உரையில் தரப்படுகிறது; இதை கிறிஸ்துவின் இயல்பைப் பற்றிய கூடுதல் முடிவாக விரிவாக்கவோ குறைக்கவோ இல்லை.
- issue: ὃς என்ற தொடர்புப்பெயரின் தமிழ் வடிவம்
  choice: புதிய வாக்கியத்தில் ‘அவர்’ எனத் தொடர்தல்
  alternative: ‘அவர் நன்மை செய்துகொண்டு... சென்றவராய் இருந்தார்’ போன்ற நீண்ட தொடர்புத் தொடர்
  rationale: கிரேக்கத் தொடரின் குறிப்பு இயேசுவையே சார்ந்திருப்பதைப் பாதுகாத்து, நவீன தமிழில் குழப்பமற்ற இயல்பான வாக்கிய ஓட்டத்தை அளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குத் தெளிவான அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அபிஷேகம்’, ‘பரிசுத்த ஆவி’, ‘வல்லமை’ போன்ற வேதாகம முக்கியச் சொற்கள் பாதுகாக்கப்பட்டுள்ளன. கிரேக்கத்தின் நெருக்கமான இலக்கண அமைப்பு தமிழில் செயற்கையாகத் தோன்றாதபடி இரண்டு முதன்மை வாக்கியங்களாக அமைக்கப்பட்டது.
