source:
  edition: SBLGNT
  text: εὐσεβὴς καὶ φοβούμενος τὸν θεὸν σὺν παντὶ τῷ οἴκῳ αὐτοῦ, ⸀ποιῶν ἐλεημοσύνας πολλὰς τῷ λαῷ καὶ δεόμενος τοῦ θεοῦ διὰ παντός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/002.yaml
  text: devout and fearing God with all his household[a], doing many acts of charity for the people and praying to God continually[b],
translation:
  language: ta
  text: அவர் பக்தியுள்ளவராகவும், தம் வீட்டார் அனைவரோடும் கடவுளுக்கு அஞ்சுபவராகவும்[a] இருந்தார். மக்களுக்கு ஏராளமான தரும உதவிகளைச் செய்துவந்தார்[b]; எப்போதும் கடவுளிடம் மன்றாடிவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுளுக்கு அஞ்சுகிறவர்’ என்பது இஸ்ரவேலின் கடவுளை வழிபட்ட பிற இனத்தவரைக் குறிக்கும் அறியப்பட்ட வருணனையாகவும் இருந்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'வேறு வகையில்: ‘ஏராளமாகத் தருமம் கொடுத்தார்.’ கிரேக்கச் சொல் பெரும்பாலும் தேவையுள்ளோருக்குக் கொடுக்கப்படும் உதவியைக் குறிப்பாகக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: பக்தியுள்ளவர்
  rationale: இறைபக்தி வாழ்க்கையில் வெளிப்படுவதை இயல்பான, இன்றைய தமிழில் தெரிவிக்கிறது; பழமையான அல்லது குறிப்பிட்ட சமய மரபுக்கே உரிய சொல்லைத் தவிர்க்கிறது.
- source_word: φοβούμενος τὸν θεὸν
  choice: கடவுளுக்கு அஞ்சுபவர்
  rationale: கிரேக்கத்தின் வினைச்சொல் வடிவத்தையும், பயமும் ஆழ்ந்த மரியாதையும் இணைந்த வேதாகம மொழிநடையையும் காக்கிறது.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: தம் வீட்டார் அனைவரோடும்
  rationale: οἶκος என்பது கட்டடத்தை அல்ல, குடும்பத்தாரையும் வீட்டைச் சேர்ந்தவர்களையும் உள்ளடக்கிய சமூக அலகைக் குறிக்கிறது.
- source_word: ποιῶν
  choice: செய்துவந்தார்
  rationale: தொடர்ந்து நடந்துவந்த செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐλεημοσύνας πολλὰς
  choice: ஏராளமான தரும உதவிகள்
  rationale: தேவையுள்ளோருக்குக் கொடுக்கப்படும் உதவிகள் என்ற சொல்லின் வழக்கமான பொருளைத் தெளிவாகத் தருகிறது; பன்மையையும் மிகுதியையும் காக்கிறது.
- source_word: τῷ λαῷ
  choice: மக்களுக்கு
  rationale: கொடையின் பயனாளிகளைக் குறிக்கும் வேற்றுமைப் பொருளை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: δεόμενος τοῦ θεοῦ
  choice: கடவுளிடம் மன்றாடிவந்தார்
  rationale: δέομαι என்பதில் உள்ள வேண்டுதல் மற்றும் விண்ணப்பத்தின் வலிமையை, வெறும் பொதுவான தொழுகை என்று தளர்த்தாமல் தெரிவிக்கிறது.
- source_word: διὰ παντός
  choice: எப்போதும்
  rationale: இடைவிடாத ஒரு தனித்த செயல் என்று மிகைப்படுத்தாமல், தொடர்ச்சியான வழக்கத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளைத் தருகிறது.
theological_decisions:
- issue: கொர்னேலியுவைக் குறிக்கும் ‘கடவுளுக்கு அஞ்சுதல்’ என்ற மொழிநடை
  choice: கடவுளுக்கு அஞ்சுபவர்
  alternative: கடவுளை வணங்கி மதிப்பவர்; ‘கடவுளுக்கு அஞ்சுகிறவர்’ என்ற அடையாளப் பெயர்
  rationale: இது சாதாரண இறைமரியாதையையும், இஸ்ரவேலின் கடவுளை வழிபட்ட பிற இனத்தவருக்கான அறியப்பட்ட வருணனையாக இருக்கக்கூடிய வரலாற்று நுணுக்கத்தையும் தாங்கலாம். முதன்மை உரை அதன் வினைச்சொல் தன்மையையும் இருபொருள் வாய்ப்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை இயல்புக்காகப் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் தொடராக வரும் பெயரெச்சங்களும் வினையெச்சங்களும் தமிழின் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளன; அவற்றின் தொடர்ச்சியான செயற்பொருள் காக்கப்பட்டுள்ளது.
