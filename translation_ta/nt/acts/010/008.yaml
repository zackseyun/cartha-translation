id: ACT.10.8
reference: Acts 10:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐξηγησάμενος ⸂ἅπαντα αὐτοῖς⸃ ἀπέστειλεν αὐτοὺς εἰς τὴν Ἰόππην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: ta
  text: அவர்களிடம் எல்லாவற்றையும் விவரித்துச் சொல்லியபின், அவர்களை யோப்பாவுக்கு அனுப்பினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: விவரித்துச் சொல்லியபின்
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மை வினைக்கு முன்னர் நிகழ்ந்த செயலைக் குறிக்கிறது. ἐξηγέομαι என்பதிலுள்ள முழுமையாக எடுத்துரைக்கும் பொருளையும் காலத் தொடர்பையும் இச்சொற்றொடர் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἅπαντα
  choice: எல்லாவற்றையும்
  rationale: நடுநிலைப் பன்மையான ἅπαντα, இங்கு நடந்த அனைத்தையும் அல்லது முழு விவரத்தையும் குறிக்கிறது; ‘எல்லாவற்றையும்’ அதன் விரிவைத் தெளிவாகக் காக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: இது விவரிக்கப்பட்ட செய்தியைப் பெற்றவர்களைக் குறிக்கும் வேற்றுமை வடிவம். தமிழில் ‘அவர்களிடம் ... சொல்லி’ என்பது இயல்பான கட்டமைப்பு.
- source_word: ἀπέστειλεν
  choice: அனுப்பினான்
  rationale: ἀποστέλλω என்பதன் நேரடியான பொருள் ‘அனுப்பு’. ஆண்பால் ஒருமை எழுவாயை வினைமுற்று இயல்பாகச் சுட்டுகிறது.
- source_word: εἰς τὴν Ἰόππην
  choice: யோப்பாவுக்கு
  rationale: εἰς இங்கு சென்றடைய வேண்டிய இடத்தைக் குறிக்கிறது. Ἰόππη என்ற இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு ‘யோப்பா’; இலக்கை ‘-க்கு’ உருபு இயல்பாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கப் பங்கேற்புவினையின் காலத் தொடர்பு ‘சொல்லியபின்’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது.
