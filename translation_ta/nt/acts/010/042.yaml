source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: ta
  text: 'மக்களிடம் அறிவிக்கவும், உயிருள்ளவர்களுக்கும் இறந்தவர்களுக்கும் நீதிபதியாகக் கடவுளால் நியமிக்கப்பட்டவர் இவரே என்று வலியுறுத்திச் சாட்சியளிக்கவும் அவர் எங்களுக்குக் கட்டளையிட்டார்.[a]


    [a] அல்லது, “உயிருள்ளவர்களுக்கும் இறந்தவர்களுக்கும் நீதிபதியாகக் கடவுளால் குறித்துவைக்கப்பட்டவர் இவரே.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிருள்ளவர்களுக்கும் இறந்தவர்களுக்கும் நீதிபதியாகக் கடவுளால் குறித்துவைக்கப்பட்டவர் இவரே.”
    reason: ὁρίζω என்பதற்கு நியமித்தல் என்பதோடு ஒருவரைக் குறிப்பிட்டுத் தீர்மானித்தல் அல்லது குறித்துவைத்தல் என்ற பொருளும் இருப்பதால் தரப்பட்ட சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: παρήγγειλεν
  choice: கட்டளையிட்டார்
  rationale: அதிகாரத்தோடு கொடுக்கப்பட்ட ஆணை என்ற வினையின் வலிமையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: κηρύξαι
  choice: அறிவிக்க
  rationale: பொதுவாகப் பிரகடனம் செய்வதைக் குறிக்கிறது; ‘பிரசங்கிக்க’ என்பதில் ஏற்படக்கூடிய நவீன சமயச் சொற்பொழிவு என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: τῷ λαῷ
  choice: மக்களிடம்
  rationale: சூழலில் இஸ்ரயேல் மக்கள் குறிக்கப்பட்டாலும், இவ்வசனம் ‘இஸ்ரயேல்’ என்று வெளிப்படையாகச் சொல்லாததால் மூலத்தின் கட்டுப்பாட்டைக் காக்கிறது.
- source_word: διαμαρτύρασθαι
  choice: வலியுறுத்திச் சாட்சியளிக்க
  rationale: சாட்சியளித்தல் என்பதோடு அதன் தீவிரமான, உறுதியான தன்மையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὗτός
  choice: இவரே
  rationale: இயேசுவைச் சுட்டும் வலியுறுத்தலைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὁ ὡρισμένος
  choice: நியமிக்கப்பட்டவர்
  rationale: ὁρίζω என்பதன் இறைவனால் குறிப்பிட்ட பொறுப்புக்கு நியமிக்கப்பட்டவர் என்ற பொருளையும், அந்த நியமனத்தின் தொடரும் நிலையை உணர்த்தும் இறந்தகால வினையெச்சத்தின் வலிமையையும் இயல்பாகத் தருகிறது.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: கடவுளால்
  rationale: செயப்பாட்டு வினையின் செயற்பாட்டாளராகக் கடவுளை நேரடியாகவும் தெளிவாகவும் குறிப்பிடுகிறது.
- source_word: κριτὴς
  choice: நீதிபதியாக
  rationale: தீர்ப்பு வழங்கும் அதிகாரமுள்ளவரை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது; ‘நடுவர்’ என்றால் சமரசம் செய்பவர் என்ற தவறான உணர்வு ஏற்படலாம்.
- source_word: ζώντων καὶ νεκρῶν
  choice: உயிருள்ளவர்களுக்கும் இறந்தவர்களுக்கும்
  rationale: இரு குழுக்களையும் இணையாகக் காட்டி, அவரது தீர்ப்பதிகாரத்தின் முழுமையான மனிதகுல அளவை விரிவாக்கமின்றிப் பாதுகாக்கிறது.
theological_decisions:
- issue: தீர்ப்பளிக்க இயேசுவைக் கடவுள் நியமித்ததன் வலிமை
  choice: உயிருள்ளவர்களுக்கும் இறந்தவர்களுக்கும் நீதிபதியாகக் கடவுளால் நியமிக்கப்பட்டவர்
  alternative: உயிருள்ளவர்களுக்கும் இறந்தவர்களுக்கும் நீதிபதியாகக் கடவுளால் குறித்துவைக்கப்பட்டவர்
  rationale: இயேசுவைக் கடவுள் தீர்ப்பளிப்பவராக நியமித்தார் என்ற வசனத்தின் வெளிப்படையான கூற்றைப் பாதுகாக்கிறது; பிற்கால இறையியல் விளக்கங்களைச் சேர்க்காமல் ὁρίζω என்பதிலுள்ள நியமித்தல் அல்லது குறிப்பிட்டுத் தீர்மானித்தல் என்ற பொருள் பரப்பையும் அடிக்குறிப்பில் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘இவரே’ மூலத்தின் சுட்டுவலியுறுத்தலைக் காக்கிறது; ‘வலியுறுத்திச் சாட்சியளிக்க’ என்பது διαμαρτύρομαι என்பதின் தீவிரத்தைக் கடினமான அல்லது பழமையான சொற்கள் இன்றித் தெரிவிக்கிறது.
