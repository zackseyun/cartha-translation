  source_fidelity: 'மூலக் கிரேக்கத்தின் அனைத்து முக்கிய கூறுகளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: அதிகாரப்பூர்வ கட்டளை (παρήγγειλεν), பொதுப் பிரகடனம் (κηρύξαι), தீவிரமான சாட்சியம் (διαμαρτύρασθαι), இயேசுவைச் சுட்டும் வலியுறுத்தல் (οὗτός), கடவுளால் செய்யப்பட்ட நியமனம் (ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ), மற்றும் உயிருள்ளவர்களும் இறந்தவர்களும் அடங்கிய தீர்ப்பதிகாரம். ‘மக்களிடம்’ என்பது வசனத்தில் வெளிப்படையாக இல்லாத ‘இஸ்ரயேல்’ என்பதைச் சேர்க்காமல் τῷ λαῷ என்பதைக் கட்டுப்பாட்டுடன் தருகிறது.'
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் மரியாதைமிக்கதாகவும் உள்ளது. ‘வலியுறுத்திச் சாட்சியளிக்கவும்’ என்பது சற்றே முறையானதாயினும் இவ்வகை வேதாகம உரைக்குப் பொருத்தமான இயல்பான பயன்பாடாகும். வாக்கியத்தின் இணை அமைப்பு மூலத்தின் இரு infinitive-களையும் நன்றாகக் காக்கிறது.
