  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘விருத்தசேதனம்,’ ‘பரிசுத்த ஆவி’ போன்ற சூழலுக்கு இன்றியமையாத வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; சிக்கலான மூலமொழி நுட்பங்கள் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
