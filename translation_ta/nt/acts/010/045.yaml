base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: ta
  text: பேதுருவுடன் வந்திருந்த விருத்தசேதனக் குழுவைச் சேர்ந்த விசுவாசிகள்[a] அனைவரும் திகைத்தார்கள். ஏனெனில், பரிசுத்த ஆவியின் கொடை யூதரல்லாதவர்கள்மீதும்கூட[b] ஊற்றப்பட்டிருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விருத்தசேதனம் பெற்ற விசுவாசிகள்.” சொல்லர்த்தமாக, “விருத்தசேதனத்திலிருந்து வந்த விசுவாசிகள்.” இங்கு யூத விசுவாசிகள் குறிக்கப்படுகிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யூதரல்லாதவர்கள்மீதும்.” கிரேக்கச் சொல் சேர்க்கையைக் குறிக்கலாம்; இங்கு “யூதரல்லாதவர்கள்மீதும்கூட” என்ற வியப்பின் வலியுறுத்தலும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஊற்றப்பட்டுள்ளது.” கிரேக்க நிறைவுக்காலம், நிறைவேறிய செயலையும் அதன் விளைவு தொடர்ந்து இருப்பதையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: திகைத்தார்கள்
  rationale: இங்கு வினைச்சொல் வலுவான வியப்பையும் அதிர்ச்சியையும் குறிக்கிறது. ‘திகைத்தார்கள்’ என்பது அதன் தீவிரத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: விருத்தசேதனத்தைச் சேர்ந்த விசுவாசிகள்
  rationale: நேரடியாக ‘விருத்தசேதனத்திலிருந்து வந்த விசுவாசிகள்’ என்று மொழிபெயர்ப்பது தமிழில் இயல்பற்றதாக இருக்கும். இந்தத் தொடர் விருத்தசேதனத்தால் அடையாளப்படுத்தப்பட்ட யூத விசுவாசக் குழுவைக் குறிப்பதால், ‘சேர்ந்த’ என்பது மூலத்தின் குழு அடையாள நுட்பத்தைப் பேணுகிறது.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: பேதுருவுடன் வந்திருந்த ... அனைவரும்
  rationale: ὅσοι என்பது அந்தக் குழுவில் பேதுருவுடன் வந்திருந்த அனைவரையும் வரையறுக்கிறது. ‘வந்திருந்த’ என்பது கதைநேரத்திற்கு முன்பே அவர்கள் அவருடன் வந்ததை இயல்பாகக் காட்டுகிறது.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: பிற இனத்தார்மீதும்கூட
  rationale: அப்போஸ்தலர் 10-இன் சூழலில் ἔθνη என்பது யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ அந்த வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது; ‘மீதும்கூட’ என்பது καί-யின் சேர்க்கைப் பொருளோடு இங்குள்ள வியப்பின் வலியுறுத்தலையும் வெளிப்படுத்துகிறது.
- source_word: ἡ δωρεὰ
  choice: கொடை
  rationale: δωρεά என்பது இலவசமாக அளிக்கப்படும் பரிசைக் குறிக்கிறது. ‘கொடை’ என்பது தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது; ‘இலவச’ என்பதைச் சேர்க்காமல் சொல்லின் இயல்பான பொருளைப் பேணுகிறது.
- source_word: τοῦ ἁγίου πνεύματος
  choice: பரிசுத்த ஆவியின்
  rationale: இது நவீனத் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் தெளிவாகவும் பரவலாகவும் புரிந்துகொள்ளப்படும் சமயப் பிரிவுசார்பற்ற வடிவம்.
- source_word: ἐκκέχυται
  choice: ஊற்றப்பட்டிருந்தது
  rationale: கிரேக்க நிறைவுக்காலச் செயப்பாட்டு வடிவம் நிறைவேறிய செயலையும் அதன் தொடரும் விளைவையும் சுட்டுகிறது. பார்வையாளர்கள் திகைத்த கதைநேரத்துடன் தொடர்புபடுத்தும்போது ‘ஊற்றப்பட்டிருந்தது’ தமிழில் இயல்பாக உள்ளது; தொடரும் விளைவு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
theological_decisions:
- issue: இரட்சிப்பு வரலாற்றுச் சூழலில் ἔθνη என்பதன் பொருள்
  choice: பிற இனத்தார்
  alternative: நாடுகள்; யூதரல்லாதவர்கள்
  rationale: அப்போஸ்தலர் 10-இல் யூத விசுவாசிகளுக்கும் யூதரல்லாதவர்களுக்கும் இடையிலான வேறுபாடே கருத்தில் உள்ளது. ‘பிற இனத்தார்’ என்பது மக்களைக் குறிக்கும் மூலச்சொல்லின் வடிவத்தைப் பேணுவதோடு அந்தச் சூழலுக்கும் பொருந்துகிறது.
- issue: ἐκκέχυται என்பதன் நிறைவுக்காலத் தன்மை
  choice: ஊற்றப்பட்டிருந்தது
  alternative: ஊற்றப்பட்டுள்ளது
  rationale: முக்கிய உரை, அவர்கள் திகைத்த கதைநேரத்திற்கு முன் நிகழ்ந்த நிறைவான செயலை இயல்பான தமிழில் காட்டுகிறது. கிரேக்க வடிவம் அந்தச் செயலின் விளைவு தொடர்ந்து இருப்பதையும் அனுமதிப்பதால் அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: καί என்பதிலுள்ள சேர்க்கை மற்றும் வியப்பு
  choice: மீதும்கூட
  alternative: மேலும் ... மீது; மீதும்
  rationale: καί அடிப்படையில் சேர்க்கையைக் குறிக்கலாம்; இச்சூழலில் பிற இனத்தாரும் ஆவியைப் பெற்றதைக் கண்ட வியப்பு வலுவாக இருப்பதால் ‘கூட’ பொருத்தமானது. இருப்பினும் வெறும் சேர்க்கைப் பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
