  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸀εὐθὺς ἀνελήμφθη τὸ σκεῦος εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/016.yaml
  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: ta
  text: இது மூன்று முறை நடந்தது; உடனே அந்தப் பொருள்[a] வானத்திற்கு[b] எடுத்துக்கொள்ளப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்த விரிப்பு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பொதுவாக ‘பாத்திரம்,’ ‘கொள்கலம்,’ அல்லது ‘பொருள்’ எனப் பொருள்படும்; முந்தைய சூழல் அதை விரிப்பைப் போன்ற ஒரு பொருளாக விவரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “விண்ணகத்திற்கு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ‘ஆகாயம்’ அல்லது ‘விண்ணகம்’ ஆகிய இரண்டையும் குறிக்கலாம்; இங்குள்ள தரிசனச் சூழல் விண்ணகத்தைக் குறிப்பதாகத் தோன்றுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: இது
  rationale: முந்தைய வசனங்களில் விவரிக்கப்பட்ட நிகழ்வைச் சுட்டுகிறது; தமிழில் இயல்பான சுட்டுப்பெயராக உள்ளது.
- source_word: δὲ
  choice: ;
  rationale: இங்கு மென்மையான தொடரிணைப்பாக உள்ளது; தனிச் சொல்லாக மொழிபெயர்க்காமல் வாக்கிய ஓட்டத்திலும் அரைப்புள்ளியிலும் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐγένετο
  choice: நடந்தது
  rationale: ஒரு நிகழ்வு நிகழ்ந்ததைக் குறிக்கும் பொதுவான பயன்பாடு; நவீனத் தமிழில் இயல்பானது.
- source_word: ἐπὶ τρίς
  choice: மூன்று முறை
  rationale: ஒரே நிகழ்வு மும்முறை நிகழ்ந்ததைக் கூறும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: εὐθὺς
  choice: உடனே
  rationale: தாமதமின்றி நிகழ்ந்த திடீர் மாற்றத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀνελήμφθη
  choice: எடுத்துக்கொள்ளப்பட்டது
  rationale: மேல்நோக்கிய இயக்கத்தையும் கிரேக்கச் சொல்லின் செயப்பாட்டு வடிவத்தையும் காக்கிறது; இலக்கு ‘வானத்திற்குள்’ என்பதால் இயக்கத்தின் திசை தெளிவாகிறது.
- source_word: τὸ σκεῦος
  choice: அந்தப் பாத்திரம்
  rationale: σκεῦος என்பதன் பரந்த ‘பாத்திரம்/கொள்கலம்/பொருள்’ என்ற பொருளை மிகையாகக் குறிப்பாக்காமல் காக்கிறது; சுட்டுப்பெயரடை முந்தைய சூழலில் காணப்பட்ட பொருளைக் குறிக்கிறது.
- source_word: εἰς τὸν οὐρανόν
  choice: வானத்திற்குள்
  rationale: εἰς என்பதன் உள்நோக்கிய இயக்கத்தைக் காக்கிறது. ‘வானம்’ என்பது சூழலுக்கேற்ப ஆகாயத்தையோ விண்ணகத்தையோ குறிக்கக்கூடியதால் மூலத்தின் பொருள் விரிவையும் ஓரளவு காக்கிறது.
theological_decisions:
- issue: பேதுருவின் தரிசனத்தில் οὐρανός என்பதன் குறிப்பு
  choice: வானம்
  alternative: விண்ணகம் / ஆகாயம்
  rationale: οὐρανός என்பது ஆகாயத்தையும் விண்ணகத்தையும் குறிக்கலாம். தரிசனச் சூழல் தெய்வீக உலகைக் குறிப்பதாகத் தோன்றினாலும், மூலத்தில் உள்ள சொற்பொருள் விரிவை முற்றிலும் நீக்காமல் ‘வானம்’ பயன்படுத்தப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பாத்திரம்’ மூலச்சொல்லின் பொதுத்தன்மையைப் பேணுகிறது; ‘விரிப்பு’ சூழல்சார் மாற்றாக அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘வானம்’ மூலத்தில் உள்ள ஆகாயம்/விண்ணகம் என்ற பொருள் வாய்ப்புகளை அளவுக்கு மீறித் தீர்மானிக்காமல் வைத்திருக்கிறது.
