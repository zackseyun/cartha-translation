source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: ta
  text: அவர்மீது நம்பிக்கை வைக்கும் ஒவ்வொருவரும் அவருடைய பெயரின் மூலம் பாவமன்னிப்பைப் பெறுகிறார்கள் என்று அவரைக் குறித்து எல்லாத் தீர்க்கதரிசிகளும் சாட்சி கூறுகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்குச் சாட்சி கூறுகிறார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: அவரைக் குறித்து
  rationale: μαρτυροῦσιν என்பதுடன் இணையும் இந்த வேற்றுமை வடிவம், இயேசுவைப் பற்றிய தீர்க்கதரிசிகளின் சாட்சியைக் குறிக்கிறது. ‘அவருக்கு’ என்ற சொற்சொல்லான வடிவத்தைவிட ‘அவரைக் குறித்து’ என்பது தமிழில் பொருளை இயல்பாகத் தருகிறது.
- source_word: πάντες οἱ προφῆται
  choice: எல்லாத் தீர்க்கதரிசிகளும்
  rationale: தீர்க்கதரிசிகள் அனைவருடைய ஒருமித்த சாட்சியையும், அவர்கள்மூலம் வழங்கப்பட்ட தீர்க்கதரிசனச் சாட்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μαρτυροῦσιν
  choice: சாட்சி கூறுகிறார்கள்
  rationale: வினைச்சொல்லின் சான்றளிக்கும் வலிமையைத் தக்கவைத்துக்கொண்டு, நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: பாவமன்னிப்பு
  rationale: புதிய ஏற்பாட்டில் நிலைபெற்றுள்ள இச்சொற்றொடரின் உறவுசார் மற்றும் நீதிசார் பொருளைச் சுருக்கமாகவும் பொதுவாகப் புரியும் வகையிலும் தருகிறது.
- source_word: λαβεῖν
  choice: பெறுகிறார்கள்
  rationale: தீர்க்கதரிசிகளின் சாட்சியின் உள்ளடக்கமாக வரும் இறந்தெச்ச வினையை, பொதுவான உண்மையைக் கூறும் இயல்பான தமிழ் நிகழ்கால வினையாக வழங்குகிறது.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: அவருடைய பெயரின் மூலம்
  rationale: இயேசுவின் நபரையும் அதிகாரத்தையும் அடிப்படையாகக் கொண்ட இடைமுகத்தைச் சுட்டும் வேதாகம மொழிநடையைத் தக்கவைக்கிறது; ‘அதிகாரம்’ என்று விரித்துரைத்து மூலத்தை மீறவில்லை.
- source_word: πάντα τὸν πιστεύοντα
  choice: நம்பிக்கை வைக்கும் ஒவ்வொருவரும்
  rationale: ஆண்பால் ஒருமை பங்கேற்புவினையின் பொதுவான, பகிர்ந்தளிக்கும் பொருளை பாலின வரம்பின்றி இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς αὐτόν
  choice: அவர்மீது
  rationale: πιστεύω உடன் வரும் εἰς, ஒருவரை நோக்கிய தனிப்பட்ட நம்பிக்கையைக் குறிக்கிறது. ‘அவர்மீது நம்பிக்கை வைக்கும்’ என்பது அந்த நோக்குநிலையையும் நம்பிக்கையையும் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: மன்னிப்பின் பரப்பும் நிபந்தனையும்
  choice: இயேசுவின்மீது நம்பிக்கை வைக்கும் ஒவ்வொருவரும் அவருடைய பெயரின் மூலம் பாவமன்னிப்பைப் பெறுகிறார்கள் என்று வசனம் கூறுகிறது.
  alternative: இரட்சிப்பு நிகழும் முறையைப் பற்றிய விரிவான கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பிலேயே சேர்த்தல்.
  rationale: இயேசு, நம்பிக்கை, பாவமன்னிப்பு ஆகியவற்றுக்கிடையில் கிரேக்க உரை வெளிப்படையாகக் கூறும் தொடர்பை மட்டும் காக்கிறது; எந்தப் பிரிவுசார் விளக்கத்தையும் சேர்க்கவில்லை.
- issue: பொதுப்பொருளுடைய ஆண்பால் பங்கேற்புவினை
  choice: ஒவ்வொருவரும்
  alternative: நம்புகிற ஒவ்வொரு ஆணும்
  rationale: கிரேக்க ஆண்பால் ஒருமை வடிவம் இங்கு ஆண்களுக்கு மட்டும் உரியதாக இல்லாமல் அனைவரையும் பொதுவாகக் குறிக்கிறது.
- issue: τούτῳ என்பதன் தொடர்பு
  choice: அவரைக் குறித்து
  alternative: அவருக்கு
  rationale: இந்த இடத்தில் தீர்க்கதரிசிகளின் சாட்சி இயேசுவைச் சார்ந்தது என்பதே சூழலுக்கு இயல்பான வாசிப்பு; எனினும் கிரேக்க வேற்றுமை வடிவத்தின் நெருக்கமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசிகள்’, ‘சாட்சி கூறுகிறார்கள்’, ‘பாவமன்னிப்பு’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் தேவையற்ற கோட்பாட்டு விரிவாக்கமின்றி வைக்கப்பட்டுள்ளன.
