    issue: ‘தருமச் செயல்கள்’ may carry connotations of religious duty, righteousness, or merit.
    rationale: The Greek ἐλεημοσύναι denotes merciful assistance, especially almsgiving, rather than an abstract religious obligation. A less culturally and theologically loaded Tamil expression is preferable.
