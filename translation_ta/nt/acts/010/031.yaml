  terminology: ‘ஜெபம்’ and ‘நினைவுகூரப்பட்டன’ are appropriate. ‘இரக்கச் செயல்கள்’ communicates merciful deeds for people in need without importing merit-based associations; the note retains the gift-oriented lexical alternatives.
  issues:
