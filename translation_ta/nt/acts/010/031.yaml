lexical_decisions:
- source_word: φησί
  choice: அவன் சொன்னான்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், நவீனத் தமிழின் கதைநடையில் இறந்தகாலம் இயல்பாக உள்ளது.
- source_word: Κορνήλιε
  choice: கொர்நேலியுவே
  rationale: பெயரைத் தமிழில் ஒலிபெயர்த்து, கிரேக்க அழைப்புவேற்றுமையை இயல்பான தமிழ் அழைப்புருவால் காட்டுகிறது.
- source_word: εἰσηκούσθη
  choice: கேட்கப்பட்டது
  rationale: இறைச் செயலை நேரடியாக விரித்துச் சொல்லாமல், கிரேக்கச் செயப்பாட்டு வடிவத்தையும் ஜெபம் ஏற்றுக்கொள்ளப்பட்ட கருத்தையும் காக்கிறது.
- source_word: ἡ προσευχὴ
  choice: உன் ஜெபம்
  rationale: மூலத்தின் ஒருமையைப் பாதுகாக்கும் பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: αἱ ἐλεημοσύναι
  choice: நீ செய்த தருமச் செயல்கள்
  rationale: தேவையுள்ளவர்களுக்குச் செய்யப்படும் இரக்கமுள்ள கொடைகளையோ உதவிச் செயல்களையோ குறிக்கும் பன்மைச் சொல்லின் பரப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐμνήσθησαν
  choice: நினைவுகூரப்பட்டன
  rationale: கிரேக்கப் பன்மைச் செயப்பாட்டையும் வேதாகமத்தின் முக்கியமான ‘நினைவுகூருதல்’ மொழியையும் தக்கவைக்கிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளின் முன்னிலையில்
  rationale: கடவுளுடைய பிரசன்னத்தையும் மதிப்பீட்டுப் பார்வையையும் கூடுதல் விளக்கமின்றி தெரிவிக்கும் நேரான மொழிபெயர்ப்பு.
theological_decisions:
- issue: கொர்நேலியுவின் ἐλεημοσύναι என்பதன் பொருள்
  choice: தருமச் செயல்கள்
  alternative: தருமங்கள்; இரக்கச் செயல்கள்; தருமக் கொடைகள்
  rationale: இது தேவையுள்ளவர்களுக்குச் செய்யப்பட்ட இரக்கமுள்ள கொடைகளையும் செயல்களையும் குறிக்கிறது. அவை கடவுளால் கவனிக்கப்பட்டதை வசனம் கூறுகிறது; ஆனால் இரட்சிப்புக்கான தகுதியையோ புண்ணியக் கோட்பாட்டையோ மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: கடவுளின் முன்னிலையில் நினைவுகூரப்படுதல்
  choice: செயப்பாட்டு வடிவில் ‘நினைவுகூரப்பட்டன’ என்று தக்கவைத்தல்
  alternative: கடவுள் கவனித்தார்; கடவுள் நினைத்துக்கொண்டார்
  rationale: மூலத்தின் இறைச்செயப்பாட்டையும் ‘நினைவுகூருதல்’ என்ற வேதாகம மொழியின் உறவுசார் கனத்தையும் பாதுகாக்கிறது; அதன் துல்லியமான இறையியல் செயல்முறையை விளக்கி முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபம்’ பொதுவாகப் புரியும் திருவிவிலியச் சொல்லாகவும், ‘தருமச் செயல்கள்’ பழமையான ஒற்றைச்சொல் வழக்கை விடத் தெளிவாகவும் உள்ளது. கிரேக்கத்தின் இரு செயப்பாட்டு வடிவங்களும் பாதுகாக்கப்பட்டுள்ளன.
