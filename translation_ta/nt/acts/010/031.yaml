  text: 'அவன் சொன்னான்: “கொர்நேலியுவே, உன் ஜெபம் கேட்கப்பட்டது; உன் இரக்கச் செயல்கள்[a] கடவுளின் முன்னிலையில் நினைவுகூரப்பட்டன.”'
  philosophy: optimal-equivalence
  footnotes:
