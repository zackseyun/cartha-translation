    text: அல்லது “தருமங்கள்,” “இரக்கக் கொடைகள்,” அல்லது “தருமக் கொடைகள்.” கிரேக்கச் சொல் தேவையுள்ளவர்களுக்கு இரக்கத்துடன் கொடுப்பதையோ உதவிச் செயல்கள் செய்வதையோ குறிக்கிறது.
