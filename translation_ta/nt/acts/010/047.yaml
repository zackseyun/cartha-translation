source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: ta
  text: “நம்மைப்போலவே பரிசுத்த ஆவியைப் பெற்றுக்கொண்ட இவர்கள் திருமுழுக்கு பெறாதபடி, தண்ணீரை யாராவது மறுக்க முடியுமா?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “நம்மைப்போலவே பரிசுத்த ஆவியைப் பெற்றுக்கொண்ட இவர்கள் திருமுழுக்கு பெறுவதை யாராவது தடுக்க முடியுமா?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μήτι
  choice: யாராலும் முடியுமா?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் கிரேக்க வினாவின் சொல்லாட்சியை இயல்பான தமிழ் வினாவாகப் பாதுகாக்கிறது.
- source_word: τὸ ὕδωρ
  choice: தண்ணீரை
  rationale: சூழலில் திருமுழுக்கிற்குப் பயன்படுத்தப்படும் குறிப்பிட்ட தண்ணீரைக் குறிக்கிறது; தமிழில் வேற்றுமை உருபுடன் இயல்பாக வழங்கப்படுகிறது.
- source_word: δύναται κωλῦσαί τις
  choice: தடுக்க யாராலும் முடியுமா
  rationale: κωλύω என்பதன் தடுத்தல் அல்லது அனுமதி மறுத்தல் என்ற பொருளையும், τις என்பதன் வரையறுக்கப்படாத நபரையும் தக்கவைக்கிறது.
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: இவர்களுக்கு திருமுழுக்கு கொடுக்கப்படாதபடி
  rationale: திருமுழுக்கு நிகழ்வதைத் தடுப்பது என்ற எதிர்மறை, செயப்பாட்டு infinitive அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἵτινες
  choice: இவர்கள்
  rationale: இந்த நபர்களை அவர்கள் ஆவியைப் பெற்ற உண்மையால் அடையாளப்படுத்தும் தொடர்பைத் தமிழ் வாக்கிய அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியை
  rationale: நவீனத் தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும், மூலத்தின் பட்டப்பெயரைத் தக்கவைக்கும் வடிவம்.
- source_word: ἔλαβον
  choice: பெற்றுக்கொண்ட
  rationale: கடந்த காலத்தில் நிகழ்ந்து தற்போதைய வாதத்துக்கு முக்கியத்துவம் கொண்ட பெற்றுக்கொள்ளுதலைக் காட்டுகிறது.
- source_word: ὡς καὶ ἡμεῖς
  choice: நம்மைப் போலவே
  rationale: அவர்களும் பேதுருவையும் உடனிருந்த விசுவாசிகளையும் போலவே ஆவியைப் பெற்றார்கள் என்ற முழு ஒப்புமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பரிசுத்த ஆவியைப் பெற்றதற்கும் தண்ணீர் திருமுழுக்கிற்கும் உள்ள தொடர்பு
  choice: இவர்கள் ஏற்கெனவே பரிசுத்த ஆவியைப் பெற்றுள்ளதால், அவர்களுக்குத் தண்ணீர் திருமுழுக்கைத் தடுக்க முடியாது என்று பேதுரு வாதிடுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஆவியைப் பெற்றது திருமுழுக்கிற்கு முன்பா என்பதைக் தெளிவற்றதாக்கும் மொழிபெயர்ப்பு.
  rationale: ἔλαβον என்ற முடிவுற்ற நிகழ்வும், அதை அடிப்படையாகக் கொண்ட திருமுழுக்கு பற்றிய வினாவும் கதையின் நிகழ்வரிசையைத் தெளிவாகக் காட்டுகின்றன. எந்தச் சபைப்பிரிவின் திருமுழுக்குக் கோட்பாட்டையும் மேலாகச் சேர்க்காமல் அந்த இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ஒரே சொல்லாட்சிக்குரிய வினா ஒரே வாக்கியமாக வைக்கப்பட்டுள்ளது; எதிர்மறைப் பதிலை எதிர்பார்க்கும் வினாவலிமை தமிழில் இயல்பாக வெளிப்படுகிறது. “திருமுழுக்கு” என்பது ordinary readers புரிந்துகொள்ளக்கூடிய மரியாதையான பதமாகத் தேர்ந்தெடுக்கப்பட்டது.
