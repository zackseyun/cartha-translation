  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: ta
  text: அவனோடு பேசிக்கொண்டே பேதுரு உள்ளே சென்றார்; பலர் கூடியிருப்பதைக் கண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனோடு பேசிக்கொண்டே பேதுரு உள்ளே சென்றார்; பலர் கூடியிருப்பதைக் காண்கிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் உயிரோட்டமான கதைநடைக்குரிய வரலாற்று நிகழ்காலம் (‘காண்கிறார்’) பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνομιλῶν
  choice: பேசிக்கொண்டே
  rationale: நிகழ்காலப் பெயரெச்சம், உள்ளே செல்லும் செயல் நடந்த அதே நேரத்தில் உரையாடல் தொடர்ந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: αὐτῷ
  choice: அவனோடு
  rationale: συνομιλέω என்பதுடன் வரும் வேற்றுமை உரையாடலில் உடனிருந்த நபரைக் குறிக்கிறது; தமிழில் ‘அவனோடு’ பரஸ்பர உரையாடலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰσῆλθεν
  choice: உள்ளே சென்றார்
  rationale: வீட்டுக்குள் நுழையும் அடுத்த நிகழ்வைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: εὑρίσκει
  choice: கண்டார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலத்தில் வழங்குகிறது; அதன் உயிரோட்டமான மூலவடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: συνεληλυθότας
  choice: கூடியிருப்பதை
  rationale: நிறைவுநிலைப் பெயரெச்சம் மக்கள் ஏற்கெனவே வந்து கூடி, அந்நிலையில் இருந்ததைச் சுட்டுகிறது.
- source_word: πολλούς
  choice: பலர்
  rationale: மனிதர்களைக் குறிக்கும் பெயர்ச்சொல் தன்மையிலான பெயரடை; ‘பலர்’ என்பது சுருக்கமான, இயல்பான தமிழ்.
