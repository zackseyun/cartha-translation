translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. சூழலில் செய்பவர் பேதுரு என்பது தெளிவாக இருப்பதால், தமிழில் குழப்பம் தவிர்க்க அவரது பெயர் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; கொர்நேலியுவைக் குறிக்கும் ‘அவனோடு’ மூலத்தின் சுட்டுப்பெயரைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
