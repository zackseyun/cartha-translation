id: ACT.10.3
reference: Acts 10:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: ta
  text: அவன் பகலின் ஒன்பதாம் மணி அளவில்[a] ஒரு தரிசனத்தில் தேவனுடைய ஒரு தூதன் தன்னிடம் உள்ளே வந்து, “கொர்நேலியுவே!” என்று சொல்வதைத் தெளிவாக[b] கண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்றைய மணி கணக்கின்படி, இது ஏறக்குறைய பிற்பகல் மூன்று மணி.
    reason: cultural_note
  - marker: b
    text: 'அல்லது: “வெளிப்படையாக.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: கண்டான்
  rationale: ὁράω என்பதன் இறந்தகாலக் கதைவடிவை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது; தரிசன அனுபவத்தின் காட்சித் தன்மையையும் காக்கிறது.
- source_word: ἐν ὁράματι
  choice: ஒரு தரிசனத்தில்
  rationale: ὅραμα என்பது இயற்கைக்கு அப்பாற்பட்ட காட்சி அல்லது தரிசனத்தைக் குறிக்கிறது. அதன் நிகழ்வுமுறையை மேலதிகமாக விளக்காமல் மூலத்தின் பொருளைக் காக்கிறது.
- source_word: φανερῶς
  choice: தெளிவாக
  rationale: காட்சி மங்கலாக இல்லாமல் தெளிவாகவும் ஐயமின்றியும் காணப்பட்டதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: பகலின் ஒன்பதாம் மணி நேரத்தளவில்
  rationale: பண்டைய மணி கணக்கை முதன்மை உரையில் காக்கிறது; ὡσεὶ மற்றும் περὶ தரும் தோராயப் பொருளை ‘நேரத்தளவில்’ தெரிவிக்கிறது.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: தேவனுடைய தூதர்
  rationale: தரிசனச் சூழலில் ἄγγελος ஒரு பரலோகத் தூதரைக் குறிக்கிறது. ‘தேவனுடைய தூதர்’ என்பது தமிழில் நிலைபெற்றதும் சூழலுக்கு ஏற்றதுமான சொற்றொடர்.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: தன்னிடம் உள்ளே வந்து
  rationale: εἰσελθόντα குறிப்பிடும் உள்ளே நுழையும் அசைவையும் கொர்நேலியுவின் முன்னிலைக்கு வருவதையும் காக்கிறது.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: என்று சொல்வதை
  rationale: இரண்டாவது பங்கேற்புவினையின் தொடர்பைத் தமிழில் இயல்பான சார்பு அமைப்பாகத் தருகிறது; αὐτῷ இன் இலக்கு சூழலிலும் ‘கொர்நேலியுவே’ என்ற நேரடி அழைப்பிலும் தெளிவாகிறது.
- source_word: Κορνήλιε
  choice: கொர்நேலியுவே
  rationale: Κορνήλιος என்ற பெயரின் விளிவடிவத்தைத் தமிழின் அழைப்புவிகுதி ‘-வே’ மூலம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இச்சூழலில் ἄγγελος என்பதன் இயல்பு
  choice: பரலோகத் தூதர்
  alternative: மனிதத் தூதுவர்
  rationale: இது ஒரு தரிசனம் என்றும் அவர் ‘தேவனுடைய’ தூதர் என்றும் உரை கூறுவதால், இயற்கைக்கு அப்பாற்பட்ட தூதரே இங்கு இயல்பான பொருள். அதற்கு மேல் எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் பண்டைய மணி கணக்கு முதன்மை உரையில் வைக்கப்பட்டு, இன்றைய நேரம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. φανερῶς என்பது ‘கண்டான்’ என்பதை இயல்பாக விசேஷிக்கும் வகையில் அமைக்கப்பட்டுள்ளது.
