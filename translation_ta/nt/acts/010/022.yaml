  to: அவர்கள், “நூற்றுக்குத் தலைவனான கொர்நேலியு நீதியுள்ளவர், கடவுளுக்கு அஞ்சுகிறவர், யூத மக்கள் அனைவராலும் நற்சான்று பெற்றவர்.[a] உங்களைத் தம் வீட்டுக்கு வரவழைத்து[c], உங்களிடமிருந்து வார்த்தைகளைக் கேட்கும்படி[d] ஒரு பரிசுத்த தூதரால் அவர் தெய்வீகமாக அறிவுறுத்தப்பட்டார்.[b]” என்றார்கள்.
