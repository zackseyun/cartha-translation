source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: ta
  text: அவர்கள், “நூற்றுக்குத் தலைவனான கொர்நேலியு நீதியுள்ளவர், கடவுளுக்கு அஞ்சுகிறவர், யூத மக்கள் அனைவராலும் நற்சான்று பெற்றவர்.[a] உங்களைத் தம் வீட்டுக்கு வரவழைத்து[c], உங்களிடமிருந்து வார்த்தைகளைக் கேட்கும்படி[d] ஒரு பரிசுத்த தூதரால் அவர் தெய்வீகமாக அறிவுறுத்தப்பட்டார்.[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “யூதர்களின் முழு இனத்தாலும்.” இங்கு “இனம்” என்பது ஒரு மக்கள் குழுவைக் குறிக்கிறது; நவீன அரசியல் நாட்டை அவசியம் குறிக்காது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது “தெய்வீகச் செய்தி பெற்றார்” அல்லது “எச்சரிக்கப்பட்டார்.” கிரேக்க வினை தெய்வீகத் தகவல் அல்லது அறிவுறுத்தல் கிடைத்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “உங்களை அழைக்க ஆளனுப்பி.”
    reason: lexical_alternative
  - marker: d
    text: 'அல்லது “உங்களிடமிருந்து ஒரு செய்தியைக் கேட்கும்படி.” சொல்லுக்குச் சொல்: “உங்களிடமிருந்து வார்த்தைகளைக் கேட்கும்படி.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: நூற்றுக்குத் தலைவன்
  rationale: ரோமப் படையின் வரலாற்றுப் பதவியைத் தமிழில் பொருள் தெளிவாகக் காட்டுகிறது; இது சரியாக நூறு வீரர்களையே குறித்தது என்று மிகைப்படுத்தாமல் மரபுப் பதவிப்பெயரைப் பாதுகாக்கிறது.
- source_word: ἀνὴρ δίκαιος
  choice: நீதியுள்ளவர்
  rationale: δίκαιος என்பதன் அறநெறி மற்றும் சமயச் சார்ந்த நிறையைப் பாதுகாக்கிறது; கொர்நேலியுவின் இறையியல் நிலையை இதற்கு அப்பால் தீர்மானிப்பதில்லை.
- source_word: φοβούμενος τὸν θεόν
  choice: கடவுளுக்கு அஞ்சுகிறவர்
  rationale: கடவுளைப் பயபக்தியுடன் மதிப்பவர் என்ற வேதாகம வழக்கை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; இதை ஒரு தொழில்நுட்பக் குழுப்பெயராக மட்டும் குறுக்குவதில்லை.
- source_word: μαρτυρούμενος
  choice: நற்சான்று பெற்றவர்
  rationale: மற்றவர்களிடமிருந்து சாதகமான சாட்சி பெறுதல் என்ற செயப்பாட்டு பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: யூத மக்கள் அனைவராலும்
  rationale: ἔθνος இங்கு நவீன அரசியல் நாட்டைவிட மக்கள் இனத்தைக் குறிக்கிறது; தமிழில் தவறான அரசியல் உணர்வைத் தவிர்த்து முழுமையைக் காட்டுகிறது.
- source_word: ἐχρηματίσθη
  choice: தெய்வீக அறிவுறுத்தல் கிடைத்தது
  rationale: இறைவனிடமிருந்து வந்த தகவல் அல்லது வழிநடத்தல் என்ற பொருளை வெளிப்படுத்துகிறது; ‘எச்சரிக்கப்பட்டார்’ என்று தேவையில்லாமல் குறுக்குவதில்லை.
- source_word: ἀγγέλου ἁγίου
  choice: ஒரு பரிசுத்த தூதர் மூலம்
  rationale: ἁγίου என்ற வெளிப்படையான அடைமொழியையும், தூதர் வழியாக அறிவுறுத்தல் வந்ததையும் பாதுகாக்கிறது.
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: உங்களைத் தமது வீட்டுக்கு வரவழைத்து
  rationale: ஒருவரை ஆளனுப்பி அழைத்துவருதல் என்ற நடுத்தர வினையின் பொருளையும் வீட்டை நோக்கிய இலக்கையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: உங்களிடமிருந்து வார்த்தைகளைக் கேட்கும்படி
  rationale: ῥήματα என்பதைக் ‘செய்தி’ என்று முன்கூட்டியே குறிப்பாக்காமல், கிரேக்கத்தின் ‘வார்த்தைகள்’ என்ற திறந்த தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கொர்நேலியுவின் பக்தியைப் பிற்கால இறையியல் வகைகளால் வரையறுப்பது
  choice: நீதியுள்ளவர்; கடவுளுக்கு அஞ்சுகிறவர்
  alternative: பக்தியுள்ளவர் / நீதிமானும் தேவபக்தியுள்ளவரும்
  rationale: வசனம் கொர்நேலியுவை யூத அறநெறி-சமய மொழியில் பாராட்டுகிறது; ஆனால் அவரது உடன்படிக்கை நிலை அல்லது இரட்சிப்பைப் பற்றி இங்கு முடிவளிக்கவில்லை. எனவே மூலத்தின் பாராட்டையும் இறையியல் பதற்றத்தையும் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் எளிமையும் பேணப்பட்டுள்ளன. பேதுருவை நோக்கிய பன்மை மரியாதை வடிவமான “உங்களை/உங்களிடமிருந்து” பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் பட்டியல் அமைப்பு அரைப்புள்ளிகளால் தெளிவாக்கப்பட்டுள்ளது; மூலத்தில் இல்லாத பிரிவினைச் சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
