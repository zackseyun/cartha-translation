review_pass:
  verdict: revise
  source_fidelity: The draft conveys the main descriptions of Cornelius and the two purposes of the angelic instruction. However, “அறிவுறுத்தல் கிடைத்தது” is impersonal and less faithfully represents the Greek passive προσωπικό construction ἐχρηματίσθη, whose subject is Cornelius. The agent phrase is also more direct as “ஒரு பரிசுத்த தூதரால்.”
  naturalness: The list of descriptions is clear modern Tamil. Revising the final clause to make Cornelius the explicit subject of the passive yields a more natural and syntactically coherent sentence.
  terminology: “நூற்றுக்குத் தலைவன்,” “நீதியுள்ளவர்,” “கடவுளுக்கு அஞ்சுகிறவர்,” and “நற்சான்று பெற்றவர்” are suitable. “பரிசுத்த தூதர்” retains the explicit adjective ἅγιος. The name form “கொர்நேலியு” is retained.
  issues:
  - severity: medium
    issue: 'The final main clause is impersonal: “அவருக்குத் தெய்வீக அறிவுறுத்தல் கிடைத்தது.”'
    rationale: 'ἐχρηματίσθη is a passive verb with Cornelius as its subject: he was divinely instructed/received a divine communication. Tamil “கொர்நேலியு ... அறிவுறுத்தப்பட்டார்” better retains this construction and avoids the slight ambiguity of an instruction merely ‘coming to’ him.'
  - severity: low
    issue: “ஒரு பரிசுத்த தூதர் மூலம்” is less direct than the Greek agent construction.
    rationale: The Greek ὑπὸ ἀγγέλου ἁγίου means ‘by a holy angel.’ “ஒரு பரிசுத்த தூதரால்” directly reflects that agency.
