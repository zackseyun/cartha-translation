    issue: Unwarranted emphatic suffix in “எங்களுக்கே.”
    rationale: The dative ἡμῖν identifies the witnesses as “us”; it does not itself require the Tamil exclusive/emphatic suffix -ஏ. The preceding contrast already expresses the limitation of the witness group.
