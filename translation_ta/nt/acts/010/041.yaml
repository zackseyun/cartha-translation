  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: ta
  text: மக்கள் அனைவருக்கும் அல்ல; கடவுளால் முன்கூட்டியே தேர்ந்தெடுக்கப்பட்ட[a] சாட்சிகளுக்கு, அதாவது, இறந்தோரிலிருந்து அவர் உயிர்த்தெழுந்த[b] பின்பு அவரோடு உண்டு குடித்த எங்களுக்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளால் முன்கூட்டியே நியமிக்கப்பட்ட.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இறந்தோரிலிருந்து அவர் எழுப்பப்பட்ட பின்பு.” இங்குள்ள கிரேக்கத்தை இயல்பாக “அவர் உயிர்த்தெழுந்த பின்பு” என்று மொழிபெயர்க்கலாம்; புதிய ஏற்பாட்டின் மற்ற இடங்களில் செயப்பாட்டு வடிவமும் காணப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: மக்கள் அனைவருக்கும் அல்ல
  rationale: παντί என்பதன் முழு வரம்பையும், தொடர்ந்து வரும் வரையறுக்கப்பட்ட சாட்சிகள் குழுவுடனான முரண்பாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: μάρτυσι
  choice: சாட்சிகளுக்கு
  rationale: அவர்கள் கண்டதைப் பற்றிச் சான்றளிப்பவர்களை குறிக்கும் அப்போஸ்தலர் பணிகள் நூலின் வழக்கமான பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: கடவுளால் முன்கூட்டியே தேர்ந்தெடுக்கப்பட்ட
  rationale: முன்னதாக நிகழ்ந்த தெய்வீகத் தேர்வையும் அதன் தொடரும் பொருத்தத்தையும் உணர்த்தும் நிறைவுநிலைச் செயப்பாட்டு வினையெச்சத்தின் பொருளைக் காக்கிறது.
- source_word: ἡμῖν
  choice: அதாவது, ... எங்களுக்கே
  rationale: ‘சாட்சிகள்’ யார் என்பதை விளக்கும் இணைப்புப் பயன்பாட்டைத் தமிழில் தெளிவாக்குகிறது; ‘-ஏ’ வரையறுக்கப்பட்ட இந்தக் குழுவின்மீதான அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: அவரோடு உண்டு குடித்த எங்களுக்கே
  rationale: συν- முன்னொட்டு காட்டும் உடனிருந்து உணவருந்திய உறவையும், உயிர்த்தெழுந்த இயேசுவின் உடல்சார்ந்த தோற்றத்தின் தெளிவையும் நேரடியாகக் காக்கிறது.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து அவர் உயிர்த்தெழுந்த பின்பு
  rationale: μετά உடனான இக்கட்டமைப்பின் காலப்பொருளையும், ἀναστῆναι என்பதன் இயல்பான எழுவாய் சார்ந்த ‘உயிர்த்தெழுந்தார்’ என்ற பொருளையும் காக்கிறது.
theological_decisions:
- issue: ἀναστῆναι αὐτὸν ἐκ νεκρῶν என்பதில் உயிர்த்தெழுதல் எவ்வாறு சொல்லப்பட வேண்டும்
  choice: இறந்தோரிலிருந்து அவர் உயிர்த்தெழுந்த பின்பு
  alternative: இறந்தோரிலிருந்து அவர் எழுப்பப்பட்ட பின்பு
  rationale: இவ்வசனத்தின் கிரேக்கக் கட்டமைப்பு இயல்பாக ‘அவர் உயிர்த்தெழுந்தார்’ என்று மொழிபெயர்க்கப்படுகிறது. வேறு இடங்களில் கூறப்படும் கடவுளின் செயற்பாட்டை இது மறுப்பதில்லை; இங்கு உள்ள சொல்வடிவத்தை மட்டும் பின்பற்றுகிறது. செயப்பாட்டு மாற்றையும் அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் தொடர்வாக்கியத் தன்மை காக்கப்பட்டுள்ளது; நீண்ட உறவைத் தெளிவாக்க நீள்கோடும் ‘அதாவது’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை சார்ந்த சொற்றொடர்களுக்குப் பின் நேரடியாக வைக்கப்பட்டுள்ளன.
