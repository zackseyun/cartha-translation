  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: ta
  text: 'மேலும், அவரிடம் ஒரு குரல் ஒலித்தது: “பேதுருவே, எழுந்து கொன்று சாப்பிடு.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: வந்தது
  rationale: φωνὴ என்பதுடன் வரும் γίνομαι, ஒரு குரல் எழுந்து ஒருவரை வந்தடைந்ததை நிகழ்வுணர்வுடன் அறிமுகப்படுத்துகிறது. ‘வந்தது’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: φωνὴ
  choice: ஒரு குரல்
  rationale: இந்த வெளிப்பாட்டுக் காட்சியில் இது வெறும் ஓசையை அல்ல, தெளிவாகப் பேசும் குரலைக் குறிக்கிறது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: பேச்சு ஒருவரை நோக்கிச் சொல்லப்படுவதைக் குறிக்கும் πρός + வேற்றுமை அமைப்பை ‘அவரிடம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἀναστάς
  choice: எழுந்து
  rationale: இந்த இறந்தகால வினையெச்சம் அடுத்து வரும் கட்டளைகளுடன் கட்டளைத் தொடராகச் செயல்படுகிறது. ‘எழுந்து’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: Πέτρε
  choice: பேதுருவே
  rationale: Πέτρος என்பதன் விளி வடிவம்; தமிழில் வழக்கில் நிலைபெற்ற பெயரும் விளி உருபும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: θῦσον
  choice: கொன்று
  rationale: θύω என்பதற்கு ‘பலியிடு’ என்ற பொருளும் இருக்கலாம்; ஆனால் விலங்குகளை உணவுக்காகத் தயாரித்து உண்ணும்படி கூறும் இந்தக் காட்சியில் ‘கொன்று’ என்பது உடனடிப் பொருளை இயல்பாகத் தருகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: φάγε
  choice: சாப்பிடு
  rationale: ἐσθίω என்பதன் நேரடிக் கட்டளை. ‘சாப்பிடு’ என்பது சாதாரண நவீன தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: καὶ
  choice: அப்போது
  rationale: தொடக்க καί கதையின் அடுத்த நிகழ்வைத் தொடர்கிறது. தமிழில் ‘அப்போது’ அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: θῦσον என்பதைப் பலியிடுதல் சார்ந்த சொல்லால் மொழிபெயர்க்க வேண்டுமா
  choice: முதன்மை உரையில் ‘கொன்று’
  alternative: ‘பலியிட்டு’ அல்லது ‘அறுத்து’
  rationale: உடனடிச் சூழல் வழிபாட்டுப் பலியைச் செய்வதற்கான கட்டளை அல்ல; விலங்குகளைக் கொன்று உண்பதைப் பற்றிய பேதுருவின் காட்சி. ஆகவே முதன்மை உரையில் ‘பலியிட்டு’ என்பது காட்சிக்கு தேவையற்ற வழிபாட்டுப் பொருளை ஏற்றக்கூடும். எனினும், மூல வினையின் உண்மையான பலியிடுதல் சார்ந்த பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. θῦσον என்பதிலுள்ள ‘கொல்/பலியிடு’ என்ற உண்மையான பொருள் இருமை முதன்மை உரையிலும் அடிக்குறிப்பிலும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
