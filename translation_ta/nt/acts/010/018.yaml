  text: καὶ φωνήσαντες ⸀ἐπυνθάνοντο εἰ Σίμων ὁ ἐπικαλούμενος Πέτρος ἐνθάδε ξενίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: ta
  text: அவர்கள் கூப்பிட்டு, பேதுரு என்று அழைக்கப்படும் சீமோன் இங்கே தங்கியிருக்கிறாரா[a] என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இங்கே விருந்தினராகத் தங்கியிருக்கிறாரா?” கிரேக்க வினைச்சொல் ஒருவர் விருந்தினராகத் தங்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: கூப்பிட்டு
  rationale: வீட்டிலிருந்தவர்களிடம் கேட்பதற்காகக் குரல் கொடுத்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; கிரேக்க இறந்தகால வினையெச்சத்தின் முன்ன நிகழ்வையும் காக்கிறது.
- source_word: ἐπυνθάνοντο
  choice: கேட்டார்கள்
  rationale: விசாரித்தார்கள் என்பதும் சாத்தியம்; ஆனால் இந்தச் சூழலில் கேட்டார்கள் என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது. கிரேக்க இறந்தகாலத் தொடர்வினையின் நீடிப்பு இங்கு மெல்லியதாக இருப்பதால் தனியாக வெளிப்படுத்தப்படவில்லை.
- source_word: εἰ
  choice: -ஆ ... என்று
  rationale: மறைமுக வினாவைத் தமிழில் இயல்பாக அமைக்கும் வடிவம்.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: பேதுரு என்று அழைக்கப்படும் சீமோன்
  rationale: இரு பெயர்களையும் காத்து, ἐπικαλούμενος என்பதன் அடையாளப்படுத்தும் நிகழ்காலப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐνθάδε
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் கிரேக்கச் சொல்லுக்கான இயல்பான நவீனத் தமிழ் இணை.
- source_word: ξενίζεται
  choice: தங்கியிருக்கிறார்
  rationale: விருந்தினராகத் தங்கவைக்கப்பட்டிருக்கும் பொருளைச் சூழலில் இயல்பாகத் தெரிவிக்கிறது; உபசரிக்கப்படுகிறார் என்று மொழிபெயர்ப்பது தமிழில் இங்கு தேவையற்ற செயப்பாட்டு அழுத்தத்தை ஏற்படுத்தும்.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் நிகழ்வுவரிசை—முதலில் கூப்பிடுதல், பின்னர் கேட்டல்—இயல்பான தமிழ் தொடரில் காக்கப்பட்டுள்ளது. அடிக்குறி குறிக்கும் ξενίζεται என்பதற்கேற்ப [a] குறி ‘தங்கியிருக்கிறாரா’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
