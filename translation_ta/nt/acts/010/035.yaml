source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: ta
  text: ஆனால், ஒவ்வொரு இனத்திலும், அவருக்குப் பயந்து நீதியைச் செய்கிறவர் அவருக்கு ஏற்றவராக இருக்கிறார்[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியானதைச் செய்கிறவர்” / “நீதியைக் கடைப்பிடிக்கிறவர்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் δικαιοσύνην; பொதுவாக “நீதி” அல்லது “நேர்மை” எனப் பொருள்படும். சில சூழல்களில் “நியாயம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவரால் ஏற்றுக்கொள்ளப்படுகிறார்.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கடவுள் பாரபட்சம் காட்டுவதில்லை என்று கூறியதற்கு மாறுபாட்டுடன் தொடரும் இயல்பான இணைப்புச்சொல்.
- source_word: ἐν παντὶ ἔθνει
  choice: எந்த நாட்டினராக இருந்தாலும்
  rationale: ஒவ்வொரு தேசத்திலும் என்ற பகிர்வுப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; நவீன தேசிய-அரசியல் பொருளை அளவுக்கு மீறித் திணிக்கவில்லை.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: அவருக்குப் பயந்து
  rationale: கடவுள்மீதான பயபக்தியைக் குறிக்கும் φοβέομαι என்பதன் பொருளைப் பாதுகாக்கிறது; ஆண்பாலுக்கு மட்டும் வரையறுக்கவில்லை.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: நீதியைச் செய்கிறவர்
  rationale: ἐργάζομαι செயலில் வெளிப்படும் நடத்தையையும் δικαιοσύνην நீதி/நேர்மையின் பண்பையும் குறிக்கின்றன. தமிழில் இயல்பாகவும் மூலத்தின் பெயர்ச்சொல் வடிவத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: δικαιοσύνη என்பதன் பரந்த ஒழுக்கநேர்மை மற்றும் சரியான செயல் ஆகிய பொருள்களைத் தாங்குகிறது; இங்கு நீதித்துறை அல்லது சமூகநீதி என்ற குறுகிய பொருளுக்கு மட்டும் வரையறுக்கப்படவில்லை.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: அவருக்கு ஏற்றவராக இருக்கிறார்
  rationale: δεκτός என்ற வினையடைப் பயனையும் αὐτῷ என்ற வேற்றுமையையும் நெருக்கமாகப் பாதுகாக்கிறது; தன் செயலால் இரட்சிப்பைச் சம்பாதிக்கிறார் என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: கடவுளுக்குப் பயந்து நீதியைச் செய்பவர் அவருக்கு ஏற்றவர் என்பது செயல்களால் இரட்சிப்பைப் பெறுவதாகக் கூறுகிறதா, அல்லது கடவுள் இனப்பாரபட்சமின்றி ஏற்றுக்கொள்வதைக் கூறுகிறதா?
  choice: வசனத்தின் பதற்றத்தைத் தீர்க்காமல், எந்த நாட்டினராக இருந்தாலும் கடவுளுக்குப் பயந்து நீதியைச் செய்கிறவர் அவருக்கு ஏற்றவர் என்ற கூற்றை அப்படியே பாதுகாத்தல்.
  alternative: “கடவுளால் ஏற்றுக்கொள்ளப்படுகிறார்” என்று வினைப்பாட்டில் மொழிபெயர்த்தல், அல்லது இதை இரட்சிப்புக்கான தகுதி/விசுவாசத்தின் சான்று என விளக்கிச் சேர்த்தல்.
  rationale: மூல கிரேக்கம் தெய்வீக ஏற்றுக்கொள்ளுதலுக்கும் கடவுளுக்குப் பயந்து நீதியைச் செய்வதற்கும் உள்ள உறவைச் சொல்கிறது; ஆனால் அதன் விரிவான கோட்பாட்டு விளக்கத்தை இவ்வசனத்திலேயே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. “அவருக்குப் பயந்து” என்பது வெறும் அச்சத்தைவிட பயபக்தியைச் சுட்டும் வேதாகமப் பயன்பாடு. “எந்த நாட்டினராக இருந்தாலும்” என்பது ἐν παντὶ ἔθνει என்பதன் இயல்பான பகிர்வுப் பொருளை வழங்குகிறது.
