revisions:
- from: ஆனால், எந்த நாட்டினராக இருந்தாலும், அவருக்குப் பயந்து நீதியைச் செய்கிறவர் அவருக்கு ஏற்றவராக இருக்கிறார்[a][b][c].
  to: ஆனால், ஒவ்வொரு இனத்திலும், அவருக்குப் பயந்து நீதியைச் செய்கிறவர் அவருக்கு ஏற்றவராக இருக்கிறார்[a][b][c].
  rationale: 'The revision changes only the rendering of ἐν παντὶ ἔθνει, from a concessive statement about nationality to a direct distributive locative expression: “in every people.” The rest of the wording and all footnote anchors are retained, preserving the verse’s theological openness and its relation between fearing God, doing righteousness, and being acceptable to him.'
  reviewer_model: gpt-5.6-terra
