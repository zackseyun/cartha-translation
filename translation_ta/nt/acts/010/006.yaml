  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: ta
  text: அவர் தோல் பதனிடுபவரான சீமோன் என்னும் ஒருவரிடம் விருந்தினராகத் தங்கியிருக்கிறார்[a]. அந்தச் சீமோனின் வீடு கடலோரத்தில் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் தோல் பதனிடுபவரான சீமோன் என்னும் ஒருவரிடம் தங்கியிருக்கிறார்.”
    reason: ξενίζεται என்பதிலுள்ள விருந்தினராக ஏற்றுக்கொள்ளப்பட்டுத் தங்கும் நுணுக்கத்தை வெளிப்படையாகக் கூறாத இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ξενίζεται
  choice: விருந்தினராகத் தங்கியிருக்கிறார்
  rationale: இங்கு நிகழ்கால இடை/செயப்பாட்டு வடிவம் ஒருவர் விருந்தினராக ஏற்றுக்கொள்ளப்பட்டுத் தங்கியிருப்பதைக் குறிக்கிறது; இத்தமிழாக்கம் வெறும் ‘தங்கியிருக்கிறார்’ என்பதைவிட அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: παρά τινι
  choice: ஒருவரிடம்
  rationale: παρά + கொடை வேற்றுமை ஒருவரோடு அல்லது அவரது இடத்தில் இருப்பதைக் குறிக்கிறது; τις தரும் குறிப்பிடப்படாத தன்மையை ‘ஒருவரிடம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Σίμωνι
  choice: சீமோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: βυρσεῖ
  choice: தோல் பதனிடுகிற
  rationale: βυρσεύς என்பது விலங்குத் தோலைப் பதப்படுத்துபவரைக் குறிப்பாகக் குறிக்கிறது; ‘தோல் தொழிலாளி’ என்பதைவிட இது துல்லியமானது.
- source_word: ᾧ ἐστιν οἰκία
  choice: அவருடைய வீடு ... இருக்கிறது
  rationale: சீமோனுக்குச் சொந்தமான வீட்டின் இருப்பிடத்தைச் சார்பு வாக்கியம் தெரிவிக்கிறது; தமிழில் தனி வாக்கியமாக அமைப்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: παρὰ θάλασσαν
  choice: கடலோரத்தில்
  rationale: παρά + குற்றுவேற்றுமை இங்கு கடலுக்கு அருகிலுள்ள இடத்தைக் குறிக்கிறது; ‘கடலோரத்தில்’ இயல்பான நவீனத் தமிழ்.
- source_word: οὗτος
  choice: அவர்
  rationale: சூழலில் இது முன்பு குறிப்பிடப்பட்ட பேதுருவைக் குறிக்கிறது; மரியாதையான தமிழ் ஒருமைப் பெயர்ப்பதிலி இயல்பாகப் பொருந்துகிறது.
