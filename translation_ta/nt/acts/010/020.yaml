- from: ஆனால் எழுந்து, கீழே இறங்கி, அவர்களோடு போ; எதையும் சந்தேகிக்காதே[a]. ஏனெனில், நானே அவர்களை அனுப்பியிருக்கிறேன்.
  to: ஆனால் எழுந்து, கீழே இறங்கி, அவர்களோடு செல்; எதிலும் தயங்காதே[a]. ஏனெனில், நானே அவர்களை அனுப்பியிருக்கிறேன்.
  rationale: The revision improves idiomatic modern Tamil while preserving the source’s imperative sequence, causal force, and emphatic ‘I.’ It retains the contested semantic range of μηδὲν διακρινόμενος in a footnote rather than resolving the Jew–Gentile implication in the main text.
