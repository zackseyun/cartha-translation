source:
  edition: SBLGNT
  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: ta
  text: ஆனால் எழுந்து, கீழே இறங்கி, அவர்களோடு செல்; எதிலும் தயங்காதே[a]. ஏனெனில், நானே அவர்களை அனுப்பியிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எந்த வேறுபாடும் செய்யாமல்.’ கிரேக்கப் பங்கேற்புச் சொல் ‘சந்தேகிக்காமல்’ அல்லது ‘தயங்காமல்’ இருப்பதையும், ‘வேறுபாடு செய்யாமல்’ இருப்பதையும் குறிக்கலாம்; இரண்டாவது பொருள் இந்த அதிகாரத்தின் யூதர்–பிற இனத்தார் கருப்பொருளை எதிரொலிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: பேதுருவின் குழப்பத்திலிருந்து அவர் செய்ய வேண்டிய செயலுக்கு உரையைத் திருப்பும் எதிர்மறை இணைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀναστὰς
  choice: எழுந்து
  rationale: அடுத்தடுத்த கட்டளைகளுடன் இணையும் இறந்தகாலப் பங்கேற்பு வடிவத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: κατάβηθι
  choice: கீழே இறங்கி
  rationale: பேதுரு மாடியிலிருந்து கீழே செல்ல வேண்டிய இடஞ்சார்ந்த இயக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: πορεύου σὺν αὐτοῖς
  choice: அவர்களோடு போ
  rationale: உடன் செல்வதற்கான கட்டளையை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: μηδὲν διακρινόμενος
  choice: எதையும் சந்தேகிக்காதே
  rationale: உடனடிச் சூழலில் பேதுருவின் குழப்பத்தையும் தயக்கமின்றி அவர்களுடன் செல்ல வேண்டியதையும் எடுத்துரைக்கிறது; ‘வேறுபாடு பாராமல்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் கிரேக்கச் சொல்லின் காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐγὼ
  choice: நானே
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடம்பெற்றுள்ள வலியுறுத்தப்பட்ட முதலாம் நபர் சுட்டுப்பெயரின் அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: ἀπέσταλκα
  choice: அனுப்பியிருக்கிறேன்
  rationale: முடிந்த செயல் தற்போதும் தொடர்புடையதாக இருப்பதைக் காட்டும் perfect காலத்தின் நுணுக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: வந்துள்ள தூதர்களைக் குறிக்கும் நேரடிச் செயப்படுபொருளை மரியாதையான மனிதர் சுட்டுப்பெயரால் தருகிறது.
theological_decisions:
- issue: μηδὲν διακρινόμενος என்பதன் பொருளும் யூதர்–பிற இனத்தார் சேர்க்கையுடனான தொடர்பும்
  choice: முதன்மை உரையில் ‘எதையும் சந்தேகிக்காதே’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எந்த வேறுபாடும் பார்க்காமல்’ அல்லது ‘தயங்காமல்’
  rationale: உடனடிச் சூழல் பேதுருவின் குழப்பத்தையும் வந்தவர்களுடன் செல்ல அவர் தயங்கக்கூடாது என்பதையும் முன்னிறுத்துகிறது. அதேவேளை, அத்தியாயம் முழுவதிலும் காணப்படும் யூதர்–பிற இனத்தார் வேறுபாட்டை நீக்கும் கருத்தை இந்தக் கிரேக்கச் சொல் எதிரொலிக்கக்கூடும். ஆகவே அந்த இறையியல் பதற்றம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான கட்டளைத் தொனியும் கண்ணியமான நடையும் பேணப்பட்டுள்ளன. ‘நானே’ என்பது மூலத்தின் வலியுறுத்தலைக் காட்டுகிறது; பிரதான வாசிப்பைச் சீர்குலைக்காமல் உண்மையான சொற்பொருள் இருமை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
