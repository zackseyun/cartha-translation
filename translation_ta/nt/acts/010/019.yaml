reference: Acts 10:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: ta
  text: பேதுரு அந்தத் தரிசனத்தைப் பற்றி ஆழ்ந்து சிந்தித்துக்கொண்டிருந்தபோது, ஆவியானவர் அவரிடம், “இதோ, ஆண்கள் உன்னைத் தேடிக்கொண்டிருக்கிறார்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைத் தேடுகிறார்கள்.”
    reason: ζητέω என்பதன் நிகழ்காலத்தைத் தமிழில் தொடர்நிலை வடிவமாகவோ எளிய நிகழ்கால வடிவமாகவோ இயல்பாக வழங்கலாம்.
lexical_decisions:
- source_word: διενθυμουμένου
  choice: ஆழ்ந்து சிந்தித்துக்கொண்டிருந்தபோது
  rationale: இந்த நடுநிலை வினையெச்சம் நீடித்த உள்ளார்ந்த சிந்தனையைக் குறிக்கிறது. ‘ஆழ்ந்து சிந்தித்துக்கொண்டிருந்தபோது’ என்பது அதன் தொடர்ச்சியான தன்மையையும் தீவிரமான மனச்செயல்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; கிரேக்கத்தில் தனியாக இல்லாத ‘இன்னும்’ என்பதைச் சேர்ப்பதில்லை.
- source_word: περὶ τοῦ ὁράματος
  choice: அந்தத் தரிசனத்தைப் பற்றி
  rationale: περί என்பதன் ‘பற்றி’ என்ற தொடர்பை வெளிப்படையாகக் காக்கிறது. குறிப்பிட்ட தரிசனத்தைச் சுட்டுவதால் τοῦ என்பதற்கு இயல்பாக ‘அந்த’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: இந்த நிகழ்ச்சிச் சூழலில் பேதுருவை வழிநடத்திப் பேசுபவர் இறை ஆவி. கிரேக்கத்தில் ἅγιον இல்லாததால் ‘பரிசுத்த’ என்பது சேர்க்கப்படவில்லை; மரியாதைமிக்க நபர்சுட்டு வடிவமான ‘ஆவியானவர்’ நவீனத் தமிழில் இயல்பானது.
- source_word: εἶπεν αὐτῷ
  choice: அவரிடம் … என்றார்
  rationale: தமிழின் நேர்க்கூற்று அமைப்புக்கு ஏற்றவாறு வாக்கியத்தின் முடிவில் வைக்கப்பட்டு, ‘அவரிடம்’ மூலம் மறைமுகப் பொருள் தெளிவாகக் காக்கப்படுகிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் குறியீட்டின் வலிமையை, பழமையற்ற ஆனால் கண்ணியமான தமிழில் ‘இதோ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄνδρες
  choice: சில ஆண்கள்
  rationale: ἀνήρ இங்கு பொதுவான ‘மக்கள்’ என்பதல்ல, வயது வந்த ஆண்களைக் குறிக்கிறது. எண்ணிக்கை குறிப்பிடப்படாத பன்மையை இயல்பாகச் சொல்ல ‘சில’ சேர்க்கப்பட்டுள்ளது.
- source_word: ζητοῦντές σε
  choice: உன்னைத் தேடிக்கொண்டிருக்கிறார்கள்
  rationale: ζητέω என்பதன் அடிப்படைப் பொருளான ‘தேடு’ காக்கப்பட்டுள்ளது; நிகழ்கால வினையெச்சத்தின் தொடர்ச்சியை ‘தேடிக்கொண்டிருக்கிறார்கள்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τὸ πνεῦμα என்பதன் சுட்டுப்பொருள்
  choice: பேதுருவிடம் பேசும் இறை ஆவியைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: குறிப்பிடப்படாத ஓர் ஆவி அல்லது உள்ளார்ந்த ஆன்மிகத் தூண்டுதல்
  rationale: அப்போஸ்தலர் 10-ன் நிகழ்ச்சித் தொடரில் புறவினத்தாரிடம் செல்லும் பணியை வழிநடத்திப் பேசுபவர் இறை ஆவி. அதேவேளை, மூலத்தில் ἅγιον இல்லாததால் ‘பரிசுத்த ஆவியானவர்’ என்று விரிவாக்கப்படவில்லை.
- issue: ἄνδρες என்பதன் பாலினக் குறிப்பு
  choice: சில ஆண்கள்
  alternative: சிலர்; சில ஆட்கள்
  rationale: மூலச்சொல் பொதுவான மனிதர்களை அல்ல, ஆண் நபர்களைத் தெளிவாகக் குறிக்கிறது; ஆகவே அந்தக் குறிப்பை நடுநிலைப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: மொழிநடை நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியக்கூடிய நிலையான தமிழ். ‘ஆழ்ந்து சிந்தித்துக்கொண்டிருந்தபோது’ என்பது கிரேக்கத்தின் நீடித்த சிந்தனையை இயல்பாகத் தருகிறது; ‘இதோ’ கவன ஈர்ப்பைச் சுருக்கமாகக் காக்கிறது. நேர்க்கூற்றுக்குள் உள்ள [a] குறியீடு தொடர்புடைய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
