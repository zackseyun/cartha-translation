  source_fidelity: 'மூலத்தின் முக்கிய கருத்துகள் காக்கப்பட்டுள்ளன: யூதரின் பிரிவுநடைமுறை, வேற்றினத்தவரோடு தொடர்புகொள்வது/செல்வது, மேலும் எந்த மனிதரையும் κοινός அல்லது ἀκάθαρτος என்று அழைக்க வேண்டாம் என்ற கடவுளின் காட்டுதல் ஆகியவை தெளிவாக உள்ளன. ஆயினும் λέγειν இங்கு ஒருவரை ஒரு வகையாக ‘அழைத்தல்/கருதுதல்’ என்ற பொருளில் இருப்பதால், ‘சொல்லக்கூடாது’ என்பதற்குப் பதில் ‘அழைக்கக்கூடாது’ என்பது பொருத்தமானது.'
