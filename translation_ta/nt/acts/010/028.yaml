source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “ஒரு யூத ஆண் வேற்றினத்தவரோடு[a] உறவாடுவதோ அவரிடம் செல்வதோ அனுமதிக்கப்படாதது என்பதை நீங்களே அறிவீர்கள். ஆனால், எந்த மனிதரையும் ‘பொதுவானவர்’[b] என்றும் ‘தீட்டானவர்’ என்றும் அழைக்கக்கூடாது என்று கடவுள் எனக்குக் காட்டியிருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேற்றினத்தவர்’ (ἀλλόφυλος) என்பது சொல்லுக்குச் சொல் ‘வேறொரு மக்களினத்தைச் சேர்ந்தவர்’ என்று பொருள்; இங்கு ‘யூதரல்லாதவர்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பொதுவானவர்’ என்பது κοινός என்பதன் மொழிபெயர்ப்பு. இது ‘தீட்டானவர்’ (ἀκάθαρτος) என்பதிலிருந்து வேறான தூய்மைச் சொல்லாட்சி; மூலத்தில் உள்ள இரு வகைகளும் இங்கே தனித்தனியாகக் காக்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: மேலும் அவர் அவர்களிடம் ... என்றார்
  rationale: τέ-யின் மென்மையான இணைப்பை ‘மேலும்’ வெளிப்படுத்துகிறது; தமிழ் மேற்கோள் அமைப்புக்கேற்ப சொல்லும் வினை இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: நீங்களே அறிவீர்கள்
  rationale: வெளிப்படையாக இடம்பெறும் Ὑμεῖς தரும் வலியுறுத்தலை ‘நீங்களே’ இயல்பாகக் காக்கிறது.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: அனுமதிக்கப்படாதது என்பதை
  rationale: ἀθέμιτος என்பது சட்டம் அல்லது ஏற்றுக்கொள்ளப்பட்ட வழக்கத்தின்படி அனுமதிக்கப்படாததைக் குறிக்கலாம். ‘சட்டவிரோதம்’ என்று கூறி பொருளை மிகையாகக் குறுக்காமல் இத்தெளிவின்மை காக்கப்படுகிறது.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: ஒரு யூத ஆண்
  rationale: கிரேக்கத்தின் ஒருமையையும் வெளிப்படையான ஆண்பால் குறிப்பையும் காக்கிறது.
- source_word: κολλᾶσθαι
  choice: உறவாடுவதோ
  rationale: தன்னைக் இணைத்துக்கொள்ளுதல் என்ற அடிப்படைப் பொருளை, இச்சமூகச் சூழலில் இயல்பான தமிழில் ‘உறவாடுதல்’ தெரிவிக்கிறது.
- source_word: ἢ προσέρχεσθαι
  choice: அவரிடம் செல்வதோ
  rationale: அந்நிய இனத்தவரிடம் அணுகிச் செல்லுதல் அல்லது அவரது வீட்டிற்குச் செல்லுதல் என்ற சூழல்சார் பொருளை, ‘வருகை தருதல்’ என்று தேவையின்றி குறுக்காமல் காக்கிறது.
- source_word: ἀλλοφύλῳ
  choice: வேற்றினத்தவரோடு / அவரிடம்
  rationale: வேறொரு மக்கள் அல்லது இனத்தைச் சேர்ந்தவர் என்ற சொல்லின் நேரடிப் பொருளைத் தருகிறது; ‘யூதரல்லாதவர்’ என்பது சாத்தியமான சூழல்சார் விளக்கம் என்றாலும் மூலச்சொல்லைவிட விளக்கமாகிவிடும்.
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: ஆனால் ... கடவுள் எனக்குக் காட்டியிருக்கிறார்
  rationale: κἀμοί என்பதன் இணைப்பில் சூழல் காட்டும் எதிர்மாற்றை ‘ஆனால்’ வெளிப்படுத்துகிறது; காட்டப்பட்டதன் தற்போதைய விளைவை ‘காட்டியிருக்கிறார்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: μηδένα ... ἄνθρωπον
  choice: எந்த மனிதரையும் ... சொல்லக்கூடாது
  rationale: ἄνθρωπος இங்கு பாலினப் பிரத்தியேகமின்றி எந்த மனிதரையும் குறிக்கிறது; μηδένα உடன் சேர்ந்த தடை தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: κοινὸν
  choice: பொதுவானவர்
  rationale: யூதத் தூய்மைச் சொல்லாட்சியில் κοινός குறிக்கும் ‘பொதுவான/புனிதப் பயன்பாட்டிலிருந்து வேறான’ வகையை ἀκάθαρτος என்பதோடு ஒன்றாக்காமல் காக்கிறது.
- source_word: ἢ ἀκάθαρτον
  choice: என்றோ தீட்டானவர் என்றோ
  rationale: ἀκάθαρτος குறிக்கும் சடங்குசார் தூய்மையின்மையை ‘தீட்டானவர்’ தெளிவாகத் தெரிவிக்கிறது; κοινός என்பதிலிருந்து வேறுபாடும் நீடிக்கிறது.
theological_decisions:
- issue: யூத எல்லை நடைமுறைக்கும் கடவுளின் வெளிப்பாட்டிற்கும் இடையிலான உறவு
  choice: யூத ஆணுக்கு இத்தகைய உறவு அனுமதிக்கப்படாததாக அறியப்பட்டதையும், எந்த மனிதரையும் பொதுவானவர் அல்லது தீட்டானவர் என்று சொல்லக்கூடாது எனக் கடவுள் பேதுருவுக்குக் காட்டியதையும் அப்படியே வைத்தல்.
  alternative: ἀθέμιτον என்பதை வெறும் சமூக மரியாதைக் குறைவாக மெலிதாக்குதல் அல்லது தூய்மைச் சொற்களின் இரு வகைகளையும் ஒரே சொல்லாக மாற்றுதல்.
  rationale: வசனம் முதலில் யூதப் பிரிவுநடைமுறையைப் பற்றிய பேதுருவின் கூற்றைத் தருகிறது; பின்னர் கடவுளின் வெளிப்பாடு அவரது புரிதலை மனிதர்களைப் பற்றிய வகையில் திருத்தியதைச் சொல்கிறது. மொழிபெயர்ப்பு முதல் கூற்றை மிகைப்படுத்தாமலும் மெலிதாக்காமலும், ‘எந்த மனிதரையும்’ என்ற பயன்பாட்டையும் காக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் வாசிக்கத்தக்க, ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்களே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது. ‘பொதுவானவர்’ வழக்குத் தமிழில் சற்றுப் புதுமையாகத் தோன்றினாலும், κοινός மற்றும் ἀκάθαρτος ஆகியவற்றை ஒன்றாக்காமல் காக்க வேண்டியதால் அடிக்குறிப்புடன் பயன்படுத்தப்பட்டுள்ளது.
