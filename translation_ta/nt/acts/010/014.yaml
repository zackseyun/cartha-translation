source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: ta
  text: ஆனால் பேதுரு, “அப்படியெல்லாம் இல்லை, ஆண்டவரே! ஏனெனில் தீட்டானதும் அசுத்தமானதுமான எதையும் நான் ஒருபோதும் உண்டதில்லை” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: ஒருபோதும் முடியாது
  rationale: வலுவான மறுப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: நேரடி விளியின் மரியாதையையும் இப்பகுதியின் இறையியல் திறந்தநிலையையும் காக்கிறது.
- source_word: κοινὸν
  choice: பொதுவான
  rationale: சடங்குமுறைப்படி தனிப்படுத்தப்படாதது என்ற மூலச் சொல்லின் கருத்தை ‘அசுத்தமான’ என்பதுடன் ஒன்றாக்காமல் காக்கிறது.
- source_word: ἀκάθαρτον
  choice: அசுத்தமான
  rationale: சடங்குசார் தூய்மையின்மையைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க சொல்.
- source_word: καὶ
  choice: -தும் ... -துமான
  rationale: மூலத்தின் ‘மற்றும்’ இணைப்பை ‘அல்லது’ என்று மாற்றாமல், இரு பண்புகளும் ஒன்றாகச் சொல்லப்படுவதைப் பாதுகாக்கிறது.
- source_word: ἔφαγον
  choice: சாப்பிட்டதில்லை
  rationale: உணவு உண்ணுதலைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வினை.
theological_decisions:
- issue: κοινὸν καὶ ἀκάθαρτον என்பதிலுள்ள இணைப்பு
  choice: பொதுவானதும் அசுத்தமானதுமான எதையும்
  alternative: பொதுவான அல்லது அசுத்தமான எதையும்
  rationale: SBLGNT இல் உள்ள καὶ-ஐ ‘மற்றும்’ என்ற இணைப்பாகப் பாதுகாத்து, இரண்டு தனித்த வகைகள் என்று முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
- issue: κύριε என்பதன் அழைப்பு
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: காட்சியின் சூழலில் உள்ள உயர்ந்த அழைப்பைத் தக்கவைக்கிறது; பேதுரு பேசுபவரை எவ்வளவு தெளிவாக அடையாளம் கண்டார் என்பதை மேலதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பேதுருவின் வலுவான மறுப்பை மரியாதையான, dignified நேரடி உரையாக வழங்குகிறது. மூலத்தின் ‘ஏனெனில்’ காரணத் தொடர்பும் ‘மற்றும்’ இணைப்பும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
