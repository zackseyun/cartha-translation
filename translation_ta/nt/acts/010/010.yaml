source:
  edition: SBLGNT
  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: ta
  text: அவனுக்கு மிகவும் பசியெடுத்தது; அவன் உணவருந்த விரும்பினான்[a]. அவர்கள் உணவைத் தயாரித்துக்கொண்டிருந்தபோது, அவன்மேல் ஒரு மெய்மறந்த நிலை வந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறுவகையில், ‘எதையாவது சுவைக்க விரும்பினான்.’ கிரேக்க வினைச்சொல்லுக்கு நேரடியாக ‘சுவைத்தல்’ என்று பொருள் கொள்ளலாம்; ஆனால் இங்கு அது உணவு உண்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: வேறுவகையில், ‘ஒரு பரவசநிலை அவன்மேல் வந்தது.’ கிரேக்கச் சொல் இங்கு தரிசன வெளிப்பாட்டுடன் தொடர்புடைய ஓர் அசாதாரண மாற்றுணர்வு நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ πρόσπεινος
  choice: அவனுக்கு மிகவும் பசியெடுத்தது
  rationale: πρόσπεινος என்பது சாதாரணப் பசியைவிடக் கடுமையான பசியைக் குறிக்கிறது. தமிழில் இயல்பான நிகழ்வுரையாகவும் அதன் வலிமையைத் தக்கவைத்தும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἤθελεν γεύσασθαι
  choice: அவன் சாப்பிட விரும்பினான்
  rationale: γεύομαι என்பதன் அடிப்படைப் பொருள் ‘சுவைத்தல்’ என்றாலும், இச்சூழலில் அது உணவு உண்பதைக் குறிக்கிறது. ‘சாப்பிட’ என்பது நவீனத் தமிழில் இயல்பாகப் பொருளைத் தெரிவிக்கிறது.
- source_word: παρασκευαζόντων δὲ αὐτῶν
  choice: அவர்கள் உணவைத் தயாரித்துக்கொண்டிருந்தபோது
  rationale: இந்தப் பிறப்புவேற்றுமைத் தனிநிலை அமைப்பு ஒரே நேரத்தில் நடந்த செயலைக் காட்டுகிறது. கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் அது உணவு என்பதால் தமிழில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ἐγένετο ἐπ’ αὐτὸν ἔκστασις
  choice: அவனுக்கு ஒரு பரவசநிலை ஏற்பட்டது
  rationale: இந்த அமைப்பு பேதுருவை ஆட்கொண்ட அனுபவநிலையின் தொடக்கத்தைக் குறிக்கிறது. ἔκστασις இங்கு அடுத்துவரும் தரிசனத்துடன் தொடர்புடைய அசாதாரண உணர்வுநிலையைக் குறிக்கிறது; வெறும் வியப்பு அல்ல.
theological_decisions:
- issue: ἔκστασις குறிக்கும் பேதுருவின் தரிசன அனுபவத்தின் இயல்பு
  choice: ஒரு பரவசநிலை
  alternative: தன்னிலை மறந்த நிலை; மெய்மறந்த நிலை
  rationale: உடனடிச் சூழலில் வெளிப்பாட்டு தரிசனம் வருவதால், இது வெறும் ஆச்சரியம் அல்லது வியப்பைக் குறிக்கவில்லை. அதேவேளையில், அந்த அனுபவத்தின் உளவியல் அல்லது மறைஞான இயல்பைத் தேவையின்றி வரையறுக்காமல் கிரேக்கச் சொல்லின் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நிகழ்வுரை பயன்படுத்தப்பட்டுள்ளது. ‘சாப்பிட’ என்பது பேச்சுவழக்காகத் தாழாமல் இயல்பாக இருப்பதால் தேர்ந்தெடுக்கப்பட்டது; ‘பரவசநிலை’ என்பது தரிசனச் சூழலை உணர்த்தினாலும் அனுபவத்தை அளவுக்கு மீறி விளக்காது.
