id: ACT.10.24
reference: Acts 10:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: ta
  text: மறுநாளில் அவர் செசரியாவுக்குள் சென்றார்.[a] கொர்நேலியு அவர்களை எதிர்பார்த்துக்கொண்டிருந்தார்; அவர் தம் உறவினர்களையும் நெருங்கிய நண்பர்களையும் ஒன்றுகூட அழைத்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “சென்றார்” என்ற வினைச்சொல் ஒருமையில் உள்ளது; பின்னர் “அவர்களை” என்ற பிரதிப்பெயர் பன்மையில் வருகிறது. கொர்நேலியு பேதுருவையும் அவருடன் வந்தவர்களையும் எதிர்பார்த்திருந்தபோதிலும், முதன்மைப் பாத்திரமான பேதுருவை இந்த ஒருமை வினைச்சொல் முன்னிறுத்தியிருக்கலாம்.
    reason: ஒருமை வினைச்சொல்லுக்கும் பன்மைப் பிரதிப்பெயருக்கும் இடையிலான குறிப்பிடத்தக்க இலக்கண வேறுபாட்டை விளக்குகிறது.
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: மறுநாளில்
  rationale: அடுத்த நாளைக் குறிக்கும் இயல்பான தமிழ் காலச் சொற்றொடர்; δέ குறிக்கும் மென்மையான கதைத் தொடர்ச்சியை தனிச் சொல்லால் மிகைப்படுத்தாமல் சூழலில் வெளிப்படுத்துகிறது.
- source_word: εἰσῆλθεν
  choice: அவர் ... சென்றார்
  rationale: வினைச்சொல் ஒருமையில் இருப்பதைப் பேணுகிறது; முதன்மைப் பாத்திரமான பேதுருவை முன்னிறுத்தும் கிரேக்க அமைப்பை மாற்றவில்லை.
- source_word: Καισάρειαν
  choice: செசரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட இடப்பெயர் வடிவம்.
- source_word: ὁ δὲ Κορνήλιος
  choice: கொர்நேலியு
  rationale: δέ இங்கு வலுவான எதிர்மறையை அல்ல, காட்சியின் கவனம் கொர்நேலியுவிடம் மாறுவதைச் சுட்டுகிறது; தமிழ் வாக்கியத் தொடர் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἦν προσδοκῶν
  choice: எதிர்பார்த்துக்கொண்டிருந்தார்
  rationale: தொடர்ந்து நிலவிய எதிர்பார்ப்பைச் சுட்டும் சுற்றுவழி இறந்தகால அமைப்பின் நீடித்த தன்மையைப் பேணுகிறது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: கிரேக்கப் பிரதிப்பெயர் வெளிப்படையாகப் பன்மையில் உள்ளது; பேதுருவையும் அவருடன் வந்தவர்களையும் குறிக்கும் பன்மையைப் பேணுகிறது.
- source_word: συγκαλεσάμενος
  choice: ஒன்றுகூட அழைத்திருந்தார்
  rationale: கொர்நேலியு காத்திருந்ததற்கு முன்பே அவர்களை அழைத்துச் சேர்த்திருந்தார் என்ற முன்னிகழ்ந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: தம் உறவினர்களை
  rationale: συγγενεῖς என்பதன் குடும்ப அல்லது உறவுமுறைப் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது; தம் என்பது எழுவாயான கொர்நேலியுவையே திரும்பச் சுட்டுகிறது.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: நெருங்கிய நண்பர்களை
  rationale: ἀναγκαῖος இங்கு சொல்லுக்குச் சொல் 'தேவையான' என்று அல்லாமல், நெருக்கமான அல்லது அந்தரங்கமான நண்பர்களைக் குறிக்கிறது.
