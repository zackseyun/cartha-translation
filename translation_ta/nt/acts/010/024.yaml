translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்றுகள் மனிதப் பாத்திரங்களுக்கு இயல்பாகப் பயன்படுத்தப்பட்டாலும், கிரேக்க மூலத்தின் ஒருமை–பன்மை வேறுபாடு பிரதிப்பெயர்களிலும் அடிக்குறிப்பிலும் தெளிவாகப் பேணப்பட்டுள்ளது.
