id: ACT.10.12
reference: Acts 10:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν ᾧ ὑπῆρχεν πάντα τὰ τετράποδα ⸂καὶ ἑρπετὰ τῆς γῆς καὶ⸃ πετεινὰ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: ta
  text: அதில்[a] நான்கு கால் விலங்குகள் அனைத்தும், நிலத்தில் ஊர்வனவும்[b], வானத்துப் பறவைகளும்[c] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதற்குள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நிலத்தில் தவழும் உயிரினங்களும்.’
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், ‘வானத்தின் பறவைகளும்.’ இங்கு ‘வானம்’ என்பதற்கான கிரேக்கச் சொல் ‘பரலோகம்’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அதில்
  rationale: முந்தைய வசனத்தில் காணப்பட்ட விரிப்பு போன்ற பொருளைச் சுட்டுகிறது. இடத்தைக் குறிக்கும் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ὑπῆρχεν
  choice: இருந்தன
  rationale: அந்தப் பொருளுக்குள் விலங்குகள் இருந்ததைச் சொல்கிறது; ‘அடங்கியிருந்தன’ என்பது மூலத்தில் இல்லாத கூடுதல் விளக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: πάντα
  choice: அனைத்தும்
  rationale: பட்டியலிடப்பட்ட உயிரினங்களின் விரிவான முழுமையைக் காக்கிறது; ‘எல்லா வகையான’ என்ற சூழல்சார் விளக்கத்தை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: τὰ τετράποδα
  choice: நான்கு கால் விலங்குகள்
  rationale: தொழில்நுட்பச் சொல் இன்றி, மூலச்சொல்லின் நேரடிப் பொருளை சாதாரண வாசகர்களுக்குத் தெளிவாகத் தருகிறது.
- source_word: ἑρπετὰ τῆς γῆς
  choice: நிலத்தில் ஊர்வன
  rationale: ἑρπετά என்பது பாம்பு, பல்லி போன்ற ஊர்வனவற்றை மட்டும் அல்லாமல் நிலத்தில் ஊரும் அல்லது தவழும் உயிரினங்களையும் விரிவாகக் குறிக்கலாம்; ‘நிலத்தில் ஊர்வன’ அந்தப் பரப்பைத் திறந்தவாறு வைக்கிறது.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: வானத்துப் பறவைகள்
  rationale: இப்பட்டியலில் πετεινά என்பதற்கு இயல்பான தமிழாக ‘பறவைகள்’ பொருந்துகிறது; τοῦ οὐρανοῦ என்பதன் வானைக் குறிக்கும் பொருளும் காக்கப்படுகிறது.
- source_word: καὶ ... καὶ
  choice: …வும், …வும்
  rationale: கிரேக்கத்தில் மீண்டும் வரும் இணைப்புச் சொற்களை இயல்பான தமிழ் பட்டியல் அமைப்பில் பிரதிபலிக்கிறது.
