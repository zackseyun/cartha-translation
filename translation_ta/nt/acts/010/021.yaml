id: ACT.10.21
reference: Acts 10:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: ta
  text: அப்போது பேதுரு கீழே இறங்கி அந்த ஆட்களிடம் சென்று, “இதோ, நீங்கள் தேடுகிறவன் நான்தான். நீங்கள் இங்கே இருப்பதற்கான காரணம் என்ன?[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் எதற்காக இங்கே வந்திருக்கிறீர்கள்?”
    reason: πάρεστε என்பது அவர்கள் அங்கு தற்போது இருப்பதை அல்லது வந்து சேர்ந்திருக்கும் நிலையைக் குறிக்கலாம்; மாற்று மொழிபெயர்ப்பு வருகையின் விளைவுநிலையை முன்வைக்கிறது.
lexical_decisions:
- source_word: καταβὰς
  choice: கீழே இறங்கி
  rationale: பேதுரு மேலிருந்த இடத்திலிருந்து ஆட்கள் இருந்த இடத்துக்கு இறங்கிய திசைச்சார்ந்த பொருளை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு வலுவான எதிர்மறையை அல்ல, நிகழ்வின் அடுத்த கட்டத்தை δέ குறிக்கிறது; ‘அப்போது’ நவீன தமிழில் அந்தக் கதைத் தொடர்ச்சியை இயல்பாகத் தருகிறது.
- source_word: πρὸς τοὺς ἄνδρας
  choice: அந்த ஆட்களிடம் சென்று
  rationale: πρός உடன் வரும் வேற்றுமை உருபு அவர்களை நோக்கிய நகர்வைக் குறிக்கிறது; தமிழில் ‘ஆட்களிடம் சென்று’ என்பதே இயல்பான வெளிப்பாடு.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் ἰδού என்பதன் உரையாடல் வலிமையை, பழமையான நடையின்றி ‘இதோ’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: நீங்கள் தேடுகிறவன் நான்தான்
  rationale: தேடப்படுகிற நபர் தாமே என்பதைப் பேதுரு வலியுறுத்தி அடையாளப்படுத்துவதை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: τίς ἡ αἰτία
  choice: காரணம் என்ன?
  rationale: αἰτία என்பதிலுள்ள வெளிப்படையான ‘காரணம்’ என்ற பெயர்ச்சொல்லைச் சுருக்கி ‘ஏன்?’ என மாற்றாமல் பாதுகாக்கிறது.
- source_word: δι’ ἣν πάρεστε
  choice: நீங்கள் இங்கே இருப்பதற்கான
  rationale: πάρειμι என்பதன் முதன்மையான நிகழ்காலப் பொருள் ‘இருக்கிறீர்கள்/வந்திருக்கிறீர்கள்’ என்பதாகும்; ‘இங்கே இருப்பது’ அவர்கள் அங்கு தற்போது இருப்பதை நேரடியாகக் காட்டுகிறது. வருகையின் விளைவுநிலையை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
