  source_fidelity: மூலக் கிரேக்கத்தின் நிகழ்வுத் தொடர்ச்சி (καταβὰς δέ), பேதுருவின் கீழிறங்குதல், ஆட்களிடம் செல்வது, கவன ஈர்ப்புச் சொல் (ἰδού), தம்மைத் தேடப்படும் நபராக அடையாளப்படுத்துதல், மற்றும் அவர்கள் அங்கே இருப்பதற்கான காரணத்தை விசாரித்தல் ஆகிய அனைத்தும் துல்லியமாகக் கொடுக்கப்பட்டுள்ளன. “காரணம் என்ன?” என்பது τίς ἡ αἰτία என்பதன் வெளிப்படையான பெயர்ச்சொல் அமைப்பைப் பாதுகாக்கிறது.
  naturalness: நடை நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. “இதோ, நீங்கள் தேடுகிறவன் நான்தான்” மற்றும் “நீங்கள் இங்கே இருப்பதற்கான காரணம் என்ன?” என்பவை உரையாடலுக்கு ஏற்ற தெளிவான வடிவங்கள்.
  terminology: “பேதுரு,” “இதோ,” மற்றும் “காரணம்” ஆகிய தேர்வுகள் நிலையானவை; எந்தத் தேவையற்ற இறையியல் விளக்கமும் சேர்க்கப்படவில்லை. “ஆட்கள்” என்பது τοὺς ἄνδρας என்பதற்குச் சூழலுக்கு ஏற்ற, நடுநிலையான மொழிபெயர்ப்பு.
