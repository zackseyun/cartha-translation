  rationale: 'The revision improves modern Tamil grammar and explicitly represents the imperfect aspect without adding an interpretation. It retains the source expression''s lexical and theological openness: the main text uses «நாவுகளால்», and the attached footnote gives «மொழிகளில்» as the alternative. «மகிமைப்படுத்துதல்» more directly conveys μεγαλυνόντων in established Tamil biblical register.'
