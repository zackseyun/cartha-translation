review_pass:
  verdict: revise
  source_fidelity: The draft represents all principal Greek elements, including the explanatory γάρ, the durative sense of ἤκουον, the coordinated actions, and Peter's response. However, «நாவுகளில் பேசிக்கொண்டு» is not idiomatic modern Tamil and can sound anatomically literal rather than functioning as the deliberately broad expression corresponding to λαλεῖν γλώσσαις.
  naturalness: «கேட்டுக்கொண்டிருந்தார்கள்» directly and naturally expresses the imperfect/durative force. Recasting the two present participles as coordinated verbal nouns is smooth Tamil. «நாவுகளால் பேசுதல்» is more grammatically natural than «நாவுகளில் பேசுதல்» while retaining the lexical image of γλῶσσαι.
  terminology: «தேவனை மகிமைப்படுத்துதல்» is a clear, established modern Tamil biblical rendering of μεγαλύνειν. «பேதுரு» is the standard Tamil Christian name form. The footnote retains «மொழிகளில்» as the legitimate alternative and explicitly avoids deciding the disputed character of the speech.
  issues:
  - severity: medium
    issue: «நாவுகளில் பேசிக்கொண்டு» is awkward Tamil usage.
    rationale: Tamil normally uses «-ஆல்» for the physical instrument ‘tongue’; «-இல்» naturally denotes a language only with «மொழி/பாஷை». Since the main text intentionally retains the lexical ‘tongue’ side of the Greek ambiguity, «நாவுகளால் பேசுதல்» is the safer natural formulation, with the language sense supplied in the anchored note.
  - severity: low
    issue: The durative force of ἤκουον is only indirectly conveyed in the draft.
    rationale: «பேசிக்கொண்டு» modifies the speech, but «கேட்டார்கள்» itself is simple past. «கேட்டுக்கொண்டிருந்தார்கள்» explicitly preserves the ongoing hearing conveyed by the Greek imperfect.
  revised_text: 'ஏனெனில், அவர்கள் நாவுகளால் பேசுவதையும் தேவனை மகிமைப்படுத்துவதையும் இவர்கள் கேட்டுக்கொண்டிருந்தார்கள்[a]. அப்போது பேதுரு மறுமொழி கூறினார்:'
