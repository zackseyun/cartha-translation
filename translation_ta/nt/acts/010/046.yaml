revisions:
- from: 'ஏனெனில், அவர்கள் நாவுகளில் பேசிக்கொண்டு தேவனைப் பெருமைப்படுத்துவதை இவர்கள் கேட்டார்கள்[a]. அப்போது பேதுரு மறுமொழி கூறினார்:'
