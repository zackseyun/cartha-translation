  text: ἤκουον γὰρ αὐτῶν λαλούντων γλώσσαις καὶ μεγαλυνόντων τὸν θεόν. τότε ⸀ἀπεκρίθη Πέτρος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/046.yaml
  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: ta
  text: 'ஏனெனில், அவர்கள் நாவுகளால் பேசுவதையும் தேவனை மகிமைப்படுத்துவதையும் இவர்கள் கேட்டுக்கொண்டிருந்தார்கள்[a]. அப்போது பேதுரு மறுமொழி கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மொழிகளில்.” கிரேக்கச் சொல் நாவையோ மொழியையோ குறிக்கலாம்; இங்கு அந்தப் பேச்சின் இயல்பைத் தீர்மானிக்காமல் சொற்றொடர் விரிந்த பொருளிலேயே விடப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: கேட்டார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வினையின் நீடித்த தன்மை, ‘பேசிக்கொண்டு’ என்ற தொடர்நிலை அமைப்பால் இயல்பான தமிழில் வெளிப்படுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்புச்சொல்.
- source_word: αὐτῶν
  choice: அவர்கள் ... இவர்கள்
  rationale: கிரேக்கத்தில் உள்ள இரு குழுக்களுக்கிடையேயான வேறுபாட்டைத் தமிழில் தெளிவாக்குகிறது; சூழலில் ஏற்கெனவே குறிப்பிடப்பட்டவர்களின் அடையாளத்தை விளக்கப் பெயரால் நிரப்பவில்லை.
- source_word: λαλούντων
  choice: பேசிக்கொண்டு
  rationale: நிகழ்ந்து கொண்டிருந்த செயலைக் காட்டுவதோடு, அடுத்த பங்கேற்பு வினையுடனான ஒருங்கிணைப்பையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: γλώσσαις
  choice: நாவுகளில்
  rationale: γλῶσσα என்பதன் ‘நாவு/மொழி’ என்ற சொற்பொருள் விரிவையும், அப்பேச்சின் இயல்பு குறித்த உரையின் தெளிவின்மையையும் உடனே தீர்மானிக்காமல் காக்கிறது; ‘மொழிகளில்’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μεγαλυνόντων
  choice: தேவனைப் பெருமைப்படுத்துவதை
  rationale: μεγαλύνω என்பதன் ‘பெருமைப்படுத்து, உயர்த்திப் போற்று’ என்ற பொருளை நெருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τὸν θεόν
  choice: தேவனை
  rationale: μεγαλυνόντων என்பதன் நேரடிச் செயப்படுபொருளைத் தருகிறது.
- source_word: τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை வரிசைப்படி அறிமுகப்படுத்துகிறது.
- source_word: ἀπεκρίθη
  choice: மறுமொழி கூறினார்
  rationale: வெளிப்படையான கேள்வி முன் இல்லாவிட்டாலும், ἀποκρίνομαι என்பதன் ‘பதில் அளித்தல்/மறுமொழி கூறுதல்’ என்ற பொருளைக் காக்கிறது.
- source_word: Πέτρος
  choice: பேதுரு
  rationale: தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
theological_decisions:
- issue: 'γλώσσαις என்பதன் பொருள்: நாவுகளா அல்லது மொழிகளா'
  choice: நாவுகளில்
  alternative: மொழிகளில்
  rationale: இந்தச் சொல் நாவுகளையும் மொழிகளையும் குறிக்கக்கூடும். ஆவியால் உண்டான இப்பேச்சு அறியப்பட்ட மனித மொழிகளா, வேறுவகை நாவுப்பேச்சா என்பதை மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்காமல் இருக்க, முதன்மை உரையில் விரிந்த பொருளுடைய வடிவமும் அடிக்குறிப்பில் மாற்று மொழிபெயர்ப்பும் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘இவர்கள்/அவர்கள்’ என்ற வேறுபாடு இரு குழுக்களையும் தமிழில் தெளிவாக வைத்திருக்கிறது. அடுத்த வசனத்தில் தொடரும் பேதுருவின் சொற்களை அறிமுகப்படுத்த இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
