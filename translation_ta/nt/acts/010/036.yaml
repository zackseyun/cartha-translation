base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: ta
  text: இயேசு மெசியாவின் மூலமாகச் சமாதானத்தை நற்செய்தியாக அறிவித்து, இஸ்ரவேல் மக்களுக்கு அவர் அனுப்பிய செய்தியை[a]—இவரே எல்லாருக்கும் ஆண்டவர்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “இஸ்ரவேலின் மகன்களுக்கு அவர் அனுப்பிய வார்த்தையை.” இங்கு “வார்த்தை” என்பது அறிவிக்கப்பட்ட செய்தியைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: “இவரே” என்பது கிரேக்கத்தில் வலியுறுத்தும் சுட்டுப்பெயர்; “அவர் எல்லாருக்கும் ஆண்டவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: செய்தியை
  rationale: இங்கு λόγος என்பது தனியொரு சொல்லை அல்ல, கடவுள் இஸ்ரவேலுக்கு அனுப்பிய அறிவிப்பின் உள்ளடக்கத்தைக் குறிக்கிறது. அடுத்த வசனத்துடன் தொடரும் கிரேக்க வாக்கிய அமைப்பைப் பாதுகாக்க வேற்றுமை உருபுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: ὃν ἀπέστειλεν
  choice: அவர் அனுப்பிய
  rationale: இது ‘செய்தியை’ விளக்கும் தொடர்புத் தொடர். விரிந்த சூழலில் மறைமுக எழுவாய் கடவுள்; அதை பெயரிட்டு சேர்க்காமல் ‘அவர்’ என்று வைத்திருப்பது மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாக்கிறது.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: இஸ்ரவேல் மக்களுக்கு
  rationale: சொல்லுக்கு சொல் வடிவம் ‘இஸ்ரவேலின் மகன்களுக்கு’ என்றாலும், இது இஸ்ரவேல் ஜனத்தைக் குறிக்கும் மரபுத்தொடர். நவீன தமிழில் இயல்பாகவும் உள்ளடக்கிய விதமாகவும் ‘இஸ்ரவேல் மக்களுக்கு’ என வழங்கப்பட்டது.
- source_word: εὐαγγελιζόμενος
  choice: நற்செய்தியாக அறிவித்து
  rationale: வெறும் ‘அறிவித்து’ என்பதைக் காட்டிலும், வினையின் நற்செய்தி அறிவிக்கும் பொருளை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: εἰρήνην
  choice: சமாதானத்தை
  rationale: εἰρήνη என்பதற்கான நேரடியான, வேதாகமத் தமிழில் பரவலாகப் புரியக்கூடிய இணைச்சொல்; ஒப்புரவு மற்றும் நல்வாழ்வு ஆகிய விரிந்த பொருள்களையும் தாங்கக்கூடியது.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின் மூலமாக
  rationale: διά கருவி அல்லது இடைமுகத்தைச் சுட்டுவதால் ‘மூலமாக’ எனப்பட்டது. Χριστός இங்கு பட்டமாகச் செயல்படுவதால் ஒலிபெயர்ப்பான ‘கிறிஸ்து’ என்பதற்குப் பதில் அதன் பொருளைத் தரும் ‘மெசியா’ பயன்படுத்தப்பட்டது.
- source_word: οὗτός
  choice: இவரே
  rationale: எளிய ‘அவர்’ என்பதைவிட கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் ‘இவரே’ பாதுகாக்கிறது.
- source_word: πάντων κύριος
  choice: எல்லாருக்கும் ஆண்டவர்
  rationale: πάντων உலகளாவிய ஆளுகையைச் சுட்டுகிறது; κύριος என்பதன் அதிகாரத்தையும் இறையியல் நிறையையும் ‘ஆண்டவர்’ பாதுகாக்கிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστός-ஐ மொழிபெயர்த்தல்
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இந்த இடத்தில் Χριστός இயேசுவின் பட்டமாகச் செயல்படுகிறது. ஆகவே பட்டத்தின் பொருளைத் தெரிவிக்கும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது; எந்தப் பிரிவுசார் விளக்கமும் சேர்க்கப்படவில்லை.
- issue: οὗτός ἐστιν πάντων κύριος என்பதிலுள்ள வலியுறுத்தல்
  choice: இவரே எல்லாருக்கும் ஆண்டவர்
  alternative: அவர் எல்லாருக்கும் ஆண்டவர்
  rationale: οὗτός இயேசுவையே சுட்டி வலியுறுத்துகிறது. ‘இவரே’ அந்தக் கிறிஸ்துவியல் வலியுறுத்தலை மிகைப்படுத்தாமலும் மழுங்கடிக்காமலும் காக்கிறது.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு சமூக உறவிலுள்ள எஜமானத்தன்மை மட்டும் அல்லாமல் அனைவர்மீதான அதிகாரம் கூறப்படுகிறது. ‘ஆண்டவர்’ அந்த இறையியல் நிறையைப் பாதுகாக்கிறது.
- issue: வசனத்தின் நிறைவுறாத இலக்கண அமைப்பு
  choice: ‘செய்தியை’ என்று அடுத்த வசனத்தோடு தொடரும் அமைப்பைப் பாதுகாத்தல்
  alternative: ‘அவர் செய்தியை அனுப்பினார்’ என்று தனி நிறைவு வாக்கியமாக மாற்றுதல்
  rationale: கிரேக்கத்தில் τὸν λόγον வேற்றுமை வடிவில் இருந்து அடுத்த வசனத்தின் οἴδατε உடன் தொடரும் தொங்கிய அமைப்பைக் கொண்டுள்ளது. வசன எல்லைக்காக புதிய நிறைவு வினையைச் சேர்க்காமல் மூலத்தின் அமைப்பும் அதன் உண்மையான சிக்கலும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் மதிப்புமிக்கதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நற்செய்தியாக அறிவித்து’ என்பது மூல வினையின் நற்செய்தி நுணுக்கத்தை வெளிப்படுத்துகிறது. வசனம் கிரேக்கத்திலும் அடுத்த வசனத்துடன் இலக்கண ரீதியாகத் தொடர்வதால், தமிழிலும் இறுதியில் நீண்ட கோடு வைத்து அந்தத் தொடர்ச்சி காட்டப்பட்டுள்ளது.
