id: ACT.10.23
reference: Acts 10:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: ta
  text: எனவே, அவர் அவர்களை உள்ளே அழைத்து, தங்குவதற்கு இடமளித்தார்[a]. மறுநாள் அவர் எழுந்து அவர்களுடன் புறப்பட்டுச் சென்றார்; யோப்பாவைச் சேர்ந்த சகோதரர்களில் சிலரும் அவருடன் சென்றார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை விருந்தினர்களாகத் தங்க வைத்தார்.” கிரேக்க வினைச்சொல், அவர்களுக்கு விருந்தோம்பலுடன் தங்குமிடம் அளித்ததைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்கள்” என்பது ἀδελφῶν என்ற ஆண்பால் பன்மைச் சொல்லை மொழிபெயர்க்கிறது. தொடக்கக் கிறிஸ்தவப் பயன்பாட்டில் இது சில சமயங்களில் “சகோதர சகோதரிகள்,” அதாவது சக விசுவாசிகள் அனைவரையும், விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: உள்ளே அழைத்து
  rationale: நடுவினைப் பங்கேற்பெயர், பேதுரு அவர்களைத் தாம் தங்கியிருந்த இடத்திற்குள் வருமாறு அழைத்ததைக் குறிக்கிறது. ‘உள்ளே அழைத்து’ என்பது இயல்பான தமிழில் அந்தச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய உரையாடலின் விளைவாக நடந்த செயலைக் காட்டும் கதைத் தொடர்பை வெளிப்படுத்துகிறது; மிக வலுவான தர்க்க முடிவாக மாற்றவில்லை.
- source_word: ἐξένισεν
  choice: தங்குவதற்கு இடமளித்தார்
  rationale: ξενίζω இங்கு விருந்தினருக்கு இரவுத் தங்குமிடம் அளிக்கும் விருந்தோம்பலைக் குறிக்கிறது. இந்தத் தமிழாக்கம் வெறும் வரவேற்பைக் காட்டாமல், தங்க வைத்த செயலை வெளிப்படையாகச் சொல்கிறது.
- source_word: Τῇ δὲ ἐπαύριον
  choice: மறுநாள்
  rationale: கதை நிகழ்வுகளின் காலவரிசையை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கும் நவீனத் தமிழ் நடை.
- source_word: ἀναστὰς
  choice: எழுந்து
  rationale: ‘எழுந்த பின்’ என்ற அடிப்படை இயக்கத்தைப் பாதுகாக்கிறது; அடுத்துள்ள ἐξῆλθεν என்பதன் புறப்படும் கருத்தை இதற்குள் கலக்கவில்லை.
- source_word: ἐξῆλθεν
  choice: புறப்பட்டுச் சென்றார்
  rationale: பயணச் சூழலில் வெளியே சென்று பயணத்தைத் தொடங்கிய இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: σὺν αὐτοῖς
  choice: அவர்களுடன்
  rationale: எளிய உடன்செல்லுதலைத் துல்லியமாகக் காட்டுகிறது.
- source_word: τινες
  choice: சிலரும்
  rationale: குறிப்பிடப்படாத ஒரு பகுதியினரைச் சுட்டும் பன்மையை இயல்பாகக் காட்டுகிறது; ‘-உம்’ அவர்கள் கூடச் சென்றதை இணைக்கிறது.
- source_word: ἀδελφῶν
  choice: சகோதரர்களில்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தைப் பாதுகாக்கிறது. தொடக்கக் கிறிஸ்தவப் பயன்பாட்டில் இது சக விசுவாசிகளை விரிவாகக் குறிக்கக்கூடிய வாய்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: யோப்பாவைச் சேர்ந்த
  rationale: அந்தச் சகோதரர்களின் ஊர் அல்லது தொடர்பிடத்தை இயல்பான தமிழில் அடையாளப்படுத்துகிறது.
- source_word: συνῆλθον αὐτῷ
  choice: அவருடன் சென்றார்கள்
  rationale: பேதுருவுடன் பயணத்தில் இணைந்து சென்றதைக் குறிக்கும் சூழல்சார் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சபைச் சூழலில் ἀδελφῶν என்பதன் பாலின மற்றும் குழு வரம்பு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; சக விசுவாசிகள்
  rationale: மூலத்தில் ஆண்பால் பன்மை இருப்பதால் முதன்மைப் பாடத்தில் ‘சகோதரர்கள்’ என வைக்கப்படுகிறது. அதேவேளை, தொடக்கக் கிறிஸ்தவ வழக்கில் இச்சொல் சக விசுவாசிகளைக் குழுவாக விரிவாகக் குறிக்கக்கூடும் என்ற உண்மையான பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தங்குவதற்கு இடமளித்தார்’ விருந்தோம்பலின் உறுதியான செயலைத் தெளிவாக்குகிறது; ‘சகோதரர்கள்’ மூலத்தின் இலக்கண வடிவத்தைப் பாதுகாக்கிறது, அதன் சாத்தியமான விரிவான சபைப் பயன்பாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
