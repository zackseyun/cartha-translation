id: ACT.10.17
reference: Acts 10:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: ta
  text: பேதுரு தான் கண்ட தரிசனம் என்னவாக இருக்குமோ என்று தனக்குள் குழப்பமடைந்திருந்தபோது, இதோ, கொர்நேலியுவால் அனுப்பப்பட்ட ஆட்கள், சீமோனின் வீட்டைப் பற்றி விசாரித்தவர்கள், வாசலில் நின்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ
  choice: '...கொண்டிருந்தபோது'
  rationale: கதையின் தொடர்ச்சியையும் ஒரே நேரத்தில் நிகழும் செயலையும் இயல்பான தமிழ் காலத் துணைவாக்கியமாகக் காட்டுகிறது.
- source_word: ἐν ἑαυτῷ
  choice: தனக்குள்
  rationale: பேதுருவின் குழப்பம் உள்ளார்ந்த சிந்தனையாக இருந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: διηπόρει
  choice: மிகவும் குழம்பிக்கொண்டிருந்த
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்நிலையையும், சாதாரண வியப்பைவிட வலுவான குழப்பத்தையும் காக்கிறது.
- source_word: τί ἂν εἴη
  choice: என்னவாக இருக்குமென்று
  rationale: கிரேக்கத்தின் மெய்யான 'அது என்னவாக இருக்கும்' என்ற தெளிவின்மையைத் தீர்த்துவிடாமல் காக்கிறது; சூழலில் பொருள் அல்லது முக்கியத்துவம் குறிக்கப்படலாம்.
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: தான் கண்ட தரிசனம்
  rationale: தமிழில் இயல்பான தொடர்புச் சொற்றொடராகவும், முன்பு கண்ட காட்சியைத் தெளிவாகச் சுட்டுவதாகவும் உள்ளது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: எதிர்பாராத முக்கியமான கதைத் திருப்பத்தைக் கவனத்திற்கு கொண்டுவரும் மூல உரையின் உரையாடல் குறியீட்டைத் தக்கவைக்கிறது.
- source_word: οἱ ἄνδρες
  choice: ஆட்கள்
  rationale: இச்சூழலில் அனுப்பப்பட்ட ஆண்களைக் குறிக்கும் இயல்பான நவீன தமிழ் சொல்.
- source_word: οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: கொர்நேலியுவால் அனுப்பப்பட்ட
  rationale: மூலத்தின் செயப்பாட்டு அமைப்பையும் அனுப்பியவரையும் தெளிவாகக் காக்கிறது.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: சீமோனின் வீட்டை விசாரித்துக்கொண்டு வந்து
  rationale: முதன்மைச் செயலுக்கு முன் அவர்கள் வழி விசாரித்ததை இயல்பான தமிழில் காட்டுகிறது; வீட்டைப் பற்றி கேட்டறிந்து அங்கு வந்தனர் என்ற சூழல்சார் பொருளை வழங்குகிறது.
- source_word: ἐπέστησαν
  choice: நின்றார்கள்
  rationale: அவர்கள் அங்கு வந்து நிலைகொண்டதை மூலத்துக்கு நெருக்கமாகக் காட்டுகிறது.
- source_word: ἐπὶ τὸν πυλῶνα
  choice: வாசலில்
  rationale: வீட்டின் வாயில் அல்லது நுழைவிடப் பகுதியைக் குறிக்கும் πυλών என்பதற்கான தெளிவான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: τί ἂν εἴη என்பது தரிசனத்தின் இயல்பையா பொருளையா குறிக்கிறது
  choice: என்னவாக இருக்குமென்று
  alternative: என்ன பொருள் என்று
  rationale: சூழல் தரிசனத்தின் பொருளைச் சுட்டினாலும், கிரேக்க உரை நேரடியாக 'என்னவாக இருக்கும்' என்று கூறுவதால் அதன் உண்மையான தெளிவின்மையை முதன்மை உரையில் காத்து, பொருள் சார்ந்த வாசிப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. “இதோ” மூல உரையின் திடீர் கவன ஈர்ப்பைத் தக்கவைக்கிறது; “தனக்குள் மிகவும் குழம்பிக்கொண்டிருந்த” என்பது தொடர்ந்த உள்ளார்ந்த குழப்பத்தை வெளிப்படுத்துகிறது.
