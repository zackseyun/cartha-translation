revisions:
- from: பேதுரு தான் கண்ட தரிசனம் என்னவாக இருக்குமென்று[a] தனக்குள் மிகவும் குழம்பிக்கொண்டிருந்தபோது, இதோ, கொர்நேலியுவால் அனுப்பப்பட்ட ஆட்கள் சீமோனின் வீட்டை விசாரித்துக்கொண்டு வந்து, வாசலில்[b] நின்றார்கள்.
  to: பேதுரு தான் கண்ட தரிசனம் என்னவாக இருக்குமோ என்று தனக்குள் குழப்பமடைந்திருந்தபோது, இதோ, கொர்நேலியுவால் அனுப்பப்பட்ட ஆட்கள், சீமோனின் வீட்டைப் பற்றி விசாரித்தவர்கள், வாசலில் நின்றார்கள்.
  rationale: 'The revision makes the inquiry for Simon’s house a completed identifying action, matching the Greek aorist participle, and uses a smoother formal narrative expression for Peter’s inward perplexity. Footnote markers are retained in the complete text’s intended locations: [a] after “இருக்குமோ என்று” and [b] after “வாசலில்.”'
