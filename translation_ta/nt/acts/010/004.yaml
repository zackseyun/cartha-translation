source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: ta
  text: அவர் அவனை உற்றுப் பார்த்து, பயமடைந்து, “என்ன, ஆண்டவரே?” என்றார். அவன் அவரிடம், “உமது மன்றாட்டுகளும் இரக்கச் செயல்களும்[a] தேவனுக்கு முன்பாக நினைவாக மேலே சென்றிருக்கின்றன” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரக்கச் செயல்கள்’ என்பதற்கு ‘தருமங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் குறிப்பாகத் தேவையுள்ளவர்களுக்குச் செய்யும் பொருளுதவியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: உற்றுப் பார்த்து
  rationale: நிலையாகவும் கூர்ந்த கவனத்தோடும் பார்ப்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἔμφοβος γενόμενος
  choice: பயமடைந்து
  rationale: பயம் ஏற்பட்ட நிலைக்குள் வந்ததைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; ‘திகிலடைந்து’ என்று உணர்வை மிகைப்படுத்தவில்லை.
- source_word: Τί ἐστιν
  choice: என்ன
  rationale: இச்சூழலில் ‘என்ன விஷயம்?’ என்ற நேரடியான கேள்வியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: வானதூதரிடம் மரியாதையுடன் பேசும் உயர்ந்த அழைப்பாக மூலச் சொல்லின் வலிமையைப் பாதுகாக்கிறது; இது இங்கே இயேசுவைப் பற்றிய முழுமையான விசுவாச அறிக்கை என்று கட்டாயப்படுத்தவில்லை.
- source_word: προσευχαί
  choice: மன்றாட்டுகள்
  rationale: தேவனை நோக்கிச் செய்யப்படும் வேண்டுதல்களை dignified, current Tamil-இல் தெரிவிக்கிறது.
- source_word: ἐλεημοσύναι
  choice: இரக்கத்தால் செய்த உதவிகள்
  rationale: தேவையுள்ளவர்களுக்கு இரக்கத்தோடு கொடுக்கப்படும் உதவியை நவீன வாசகருக்குத் தெளிவாகக் காட்டுகிறது; வெறும் பொதுவான இரக்கச் செயல்களாக விரிவுபடுத்தவில்லை.
- source_word: ἀνέβησαν
  choice: மேலே சென்றிருக்கின்றன
  rationale: ஜெபமும் காணிக்கையும் தேவனிடம் மேலெழும் உருவகத்தைத் தக்கவைத்து, முடிவின் தற்போதைய பொருத்தத்தையும் வெளிப்படுத்துகிறது.
- source_word: εἰς μνημόσυνον
  choice: நினைவுச் சின்னமாக
  rationale: தேவனுக்கு முன்பாக நினைவுகூரச் செய்யும் ஒன்றாக அவை வந்துள்ளன என்ற கருத்தைத் தக்கவைக்கிறது; குறிப்பிட்ட பலியியல் விளக்கத்தைத் திணிக்கவில்லை.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: தேவனுக்கு முன்பாக
  rationale: தேவனுடைய முன்னிலையையோ பார்வையையோ குறிக்கும் மூலத்தின் நேரடியான சொல்லமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வானதூதரை நோக்கிய κύριε என்பதன் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இது வானதூதரிடம் மரியாதையுடன் கூறப்படும் அழைப்பாக இருக்கலாம். ‘ஆண்டவரே’ என்பது உயர்ந்த நடையையும் மூலச் சொல்லின் வழக்கமான வடிவத்தையும் காக்கிறது; அதேவேளையில், இச்சொல் மட்டும் கிறிஸ்துவைப் பற்றிய அறிக்கையாகப் புரிந்துகொள்ளப்பட வேண்டியதில்லை.
- issue: மன்றாட்டுகளும் உதவிகளும் ‘நினைவுச் சின்னமாக’ மேலே சென்றன என்பதன் பலியியல் நிழல்
  choice: உருவகத்தையும் ‘நினைவுச் சின்னம்’ என்ற திறந்த பொருளையும் தக்கவைத்தல்
  alternative: நினைவுக் காணிக்கையாக
  rationale: மூலத்தில் காணிக்கை அல்லது பலி என்ற பெயர்ச்சொல் நேரடியாக இல்லை. ஆகவே பலியியல் பின்னொலியை அழிக்காமலும், குறிப்பிட்ட காணிக்கை வகையை உரைக்குள் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ஒரே காட்சியில் வரும் இரு ஆண் பாத்திரங்களையும் தெளிவுபடுத்த, கொர்னேலியுவுக்கு மரியாதைப் பன்மையும் தூதருக்குச் சாதாரண ஒருமையும் பயன்படுத்தப்பட்டுள்ளன; மூலத்தில் உள்ள பிரதிப்பெயர் ஓட்டம் தக்கவைக்கப்பட்டுள்ளது. அடிக்குறி குறியீடு அது விளக்கும் சொல்லுக்குப் பின்னால் வைக்கப்பட்டுள்ளது.
