revisions:
- from: கடவுள் இவரையே[a] மூன்றாம் நாளில் உயிரோடு எழுப்பி, இவர் வெளிப்படும்படி செய்தார்[b].
  to: கடவுள் இவரையே[a] மூன்றாம் நாளில் உயிர்த்தெழச் செய்து, இவரைக் காணத்தக்கவராக ஆக்கினார்[b].
  rationale: The revision corrects the Tamil syntax and more explicitly conveys resurrection. ‘காணத்தக்கவராக ஆக்கினார்’ preserves the source’s distinction between raising Jesus and making him visible, while not specifying to whom he became visible.
  reviewer_model: gpt-5.6-terra
