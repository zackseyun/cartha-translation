  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: ta
  text: அப்போது பேதுரு பேசத் தொடங்கி, “கடவுள் பாரபட்சம் காட்டுகிறவர் அல்ல என்பதை உண்மையாகவே உணர்ந்துகொள்கிறேன்[a],” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையில் புரிந்துகொள்கிறேன்”; “மெய்யாகவே அறிந்துகொள்கிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: பேசத் தொடங்கி
  rationale: சொல்லுக்குச் சொல் ‘வாயைத் திறந்து’ என்றாலும், இது முறையாக அல்லது முக்கியத்துவத்துடன் பேசத் தொடங்குவதைக் குறிக்கும் கிரேக்க மரபுத்தொடர். நவீன தமிழில் இயல்பாக அதன் பொருளைத் தெரிவிக்கிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு கதைநடையின் அடுத்த கட்டத்தை இணைக்கிறது; ‘அப்போது’ என்பது இயல்பான தமிழ் இணைப்பு.
- source_word: Ἐπ’ ἀληθείας
  choice: உண்மையாகவே
  rationale: பேதுருவின் உறுதியான மெய்யுணர்வைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: καταλαμβάνομαι
  choice: உணர்ந்துகொள்கிறேன்
  rationale: புரிந்துகொள்ளுதல், உணர்தல் என்ற பொருளுடைய நிகழ்கால வடிவத்தைப் பாதுகாக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘இப்போது’ என்பதைச் சேர்க்கவில்லை.
- source_word: προσωπολήμπτης
  choice: பாரபட்சம் காட்டுகிறவர்
  rationale: ஒருவரின் வெளிப்புற அடையாளம் அல்லது சமூக நிலை முதலியவற்றின் அடிப்படையில் பட்சபாதமாக நடப்பவரைக் குறிக்கும் பெயர்ச்சொல்லை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: ὁ θεός
  choice: கடவுள்
  rationale: θεός என்பதற்கான இயல்பான, பொதுவாகப் புரிந்துகொள்ளப்படும் நவீன தமிழ்ச் சொல்.
theological_decisions:
- issue: கடவுளின் பாரபட்சமின்மையைப் பிற்காலக் கோட்பாட்டு வரையறைகளால் குறுக்காமல் மொழிபெயர்த்தல்
  choice: கடவுள் பாரபட்சம் காட்டுகிறவர் அல்ல
  alternative: கடவுள் ஆட்களைப் பார்த்து பட்சபாதம் செய்கிறவர் அல்ல
  rationale: கிரேக்கப் பெயர்ச்சொல்லின் தனிநபர் சார்ந்த இலக்கண வடிவத்தையும் கடவுளின் குணத்தைப் பற்றிய வாக்கியத்தையும் காக்கிறது; அதேவேளை, இதை ஒரு குறிப்பிட்ட இறையியல் அமைப்புக்குள் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்க மரபுத்தொடரான ‘வாயைத் திறந்து’ என்பது தமிழில் செயற்கையாக இருப்பதால் அதன் இயல்பான பொருளான ‘பேசத் தொடங்கி’ பயன்படுத்தப்பட்டது. உரையின் உணர்வு மற்றும் பாரபட்சமின்மை குறித்த இறையியல் அழுத்தம் பாதுகாக்கப்பட்டுள்ளன.
