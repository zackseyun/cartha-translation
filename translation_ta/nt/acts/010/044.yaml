language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: ta
  text: பேதுரு இந்த வார்த்தைகளை இன்னும் பேசிக்கொண்டிருக்கும்போதே, செய்தியைக் கேட்டுக்கொண்டிருந்த அனைவர்மீதும் பரிசுத்த ஆவியானவர் இறங்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஆவியானவர் செய்தியைக் கேட்ட அனைவர்மீதும் வந்தார்.”
    reason: ἐπέπεσε என்பதற்கு ‘வந்தார்’ என்ற இயல்பான மாற்று மொழிபெயர்ப்பையும், பங்கேற்பெயருக்கான சுருக்கமான தமிழ் வடிவத்தையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: பேதுரு … இன்னும் பேசிக்கொண்டிருக்கும்போதே
  rationale: நிகழ்ந்துகொண்டிருந்த பேதுருவின் பேச்சுக்கும் பிரதான நிகழ்வுக்கும் உள்ள கால ஒருங்கிணைப்பை இயல்பான தமிழில் காட்டுகிறது; ἔτι என்பதன் ‘இன்னும்’ என்ற தொடர்நிலையும் காக்கப்படுகிறது.
- source_word: τὰ ῥήματα ταῦτα
  choice: இந்த வார்த்தைகளை
  rationale: ῥήματα இங்கு பேதுரு கூறிக்கொண்டிருந்த சொற்களைக் குறிக்கிறது; ‘இந்த வார்த்தைகள்’ என்பது நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
- source_word: ἐπέπεσε
  choice: இறங்கினார்
  rationale: பரிசுத்த ஆவியானவர் மக்கள்மீது வந்த நிகழ்வைத் தமிழில் இயல்பாகவும் வலிமையாகவும் தெரிவிக்கிறது. ‘விழுந்தார்’ என்பது சொற்படி நெருக்கமாக இருந்தாலும் இச்சூழலில் தவறான உடல்சார் படிமத்தை உருவாக்கக்கூடும்.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியானவர்
  rationale: நவீனத் தமிழ் வேதாகம நடையில் தெளிவாகவும் மரியாதையாகவும் உள்ள வழக்கமான ஆளுமைச் சுட்டும் வடிவம்.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: கேட்டுக்கொண்டிருந்த அனைவர்மீதும்
  rationale: நிகழும் நேரத்தில் கேட்டுக்கொண்டிருந்த அனைவரையும் நிகழ்காலப் பங்கேற்பெயரின் தொடர்நிலையோடு வெளிப்படுத்துகிறது; πάντας என்பதன் முழுமையும் காக்கப்படுகிறது.
- source_word: τὸν λόγον
  choice: செய்தியை
  rationale: இச்சூழலில் λόγος ஒரு தனிச்சொல்லை அல்ல, பேதுரு அறிவித்த செய்தியைக் குறிக்கிறது. ‘செய்தி’ என்பது சாதாரண நவீனத் தமிழ் வாசகருக்கு பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ἐπέπεσε என்பதில் ஆவியானவரின் செயலை மொழிபெயர்த்தல்
  choice: பரிசுத்த ஆவியானவர் … இறங்கினார்
  alternative: பரிசுத்த ஆவியானவர் … வந்தார்
  rationale: லூக்காவின் வலிமையான நிகழ்வுச் சொல்லை முடிந்தவரை காக்கிறது; அதே நேரத்தில் ஆவியின் வருகை எவ்வாறு நிகழ்ந்தது என்பது குறித்து உரையில் இல்லாத சமயக்கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: அறிவிப்புச் சூழலில் λόγος என்பதன் பொருள்
  choice: செய்தி
  alternative: வார்த்தை
  rationale: பேதுருவின் அறிவிப்பையே இது குறிக்கிறது என்பதைத் தெளிவாக்குகிறது; அதற்கு மேலான கோட்பாட்டு விளக்கம் எதையும் புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பேசிக்கொண்டிருக்கும்போதே’ மற்றும் ‘கேட்டுக்கொண்டிருந்த’ ஆகிய வடிவங்கள் மூலத்தின் ஒரேநேர நிகழ்வையும் தொடர்ச்சியையும் இயல்பாகக் காட்டுகின்றன.
