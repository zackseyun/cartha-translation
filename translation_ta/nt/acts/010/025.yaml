  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: ta
  text: பேதுரு உள்ளே நுழைந்தபோது, கொர்நேலியு அவரைச் சந்தித்து, அவரது கால்களில் விழுந்து அவருக்குப் பணிந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை வழிபட்டார்.” கிரேக்க வினைச்சொல் சூழலுக்கு ஏற்ப வழிபடுவதையோ, தரையில் பணிந்து மரியாதை செலுத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον
  choice: பேதுரு உள்ளே நுழைந்தபோது
  rationale: கிரேக்கக் கதைநடை மரபுத்தொடரின் காலப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; δέ-யின் தொடர்ச்சி சூழலிலேயே தெளிவாக இருப்பதால் தனியே வலிந்து மொழிபெயர்க்கப்படவில்லை.
- source_word: συναντήσας αὐτῷ
  choice: அவரை எதிர்கொண்டு
  rationale: கொர்நேலியு பேதுருவைச் சந்திக்க முன்வந்த நிகழ்வைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: அவரது கால்களில் விழுந்து
  rationale: தாழ்ந்து மரியாதை காட்டும் உடல் நிலையையும் நிகழ்ச்சியின் தொடரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: προσεκύνησεν
  choice: அவருக்குப் பணிந்து வணங்கினார்
  rationale: இச்சூழலில் காணப்படும் தரையில் பணிந்து மரியாதை செலுத்தும் செயலை வெளிப்படுத்துகிறது; அதேவேளை அந்த வினைச்சொல்லுக்குச் சாத்தியமான வலுவான ‘வழிபட்டார்’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பேதுருவை நோக்கிப் பயன்படுத்தப்பட்ட προσκυνέω என்பதன் பொருள்
  choice: அவருக்குப் பணிந்து வணங்கினார்
  alternative: அவரை வழிபட்டார்
  rationale: προσκυνέω என்பது சூழலுக்கு ஏற்ப பணிவுடன் விழுந்து மரியாதை செலுத்துவதையோ வழிபடுவதையோ குறிக்கலாம். அடுத்த வசனத்தில் பேதுரு இச்செயலை மறுப்பதால், மூலத்தில் உள்ள தீவிரத்தைப் பாதுகாத்தபடியே தெய்வீக வழிபாடு என்ற முடிவை முதன்மை உரையில் கட்டாயப்படுத்தாமல், மாற்றுப் பொருளை அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பணிந்து வணங்கினார்’ என்பது உடல் செயலும் மரியாதையும் இணைந்திருப்பதை வெளிப்படுத்துகிறது; அடிக்குறிப்பு மூலச்சொல்லின் உண்மையான பொருள் அகலத்தைப் பாதுகாக்கிறது.
