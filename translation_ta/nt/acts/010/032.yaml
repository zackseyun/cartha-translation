id: ACT.10.32
reference: Acts 10:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: ta
  text: ஆகவே, யோப்பாவுக்கு ஆள் அனுப்பி, பேதுரு என்று அழைக்கப்படும் சீமோனை வரவழை.[a] அவர் கடலோரத்தில் உள்ள தோல் பதனிடுபவரான சீமோனின் வீட்டில் விருந்தினராகத் தங்கியிருக்கிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறுவிதமாக: “சீமோனை அழைத்து வரச் சொல்.” கிரேக்க வினைச்சொல் ஒருவரைத் தன்னிடம் அழைத்துவரச் செய்வதைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவர் அங்கே விருந்தினராக ஏற்றுக்கொள்ளப்பட்டுத் தங்கியிருக்கிறார்.
    reason: lexical_clarification
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: ஆகவே, யோப்பாவுக்கு ஆள் அனுப்பி
  rationale: οὖν காட்டும் முந்தைய செய்தியிலிருந்து வரும் தொடர்ச்சி அல்லது முடிவை ‘ஆகவே’ வெளிப்படுத்துகிறது. πέμψον என்பதன் கட்டளையை இயல்பான தமிழில் சொல்ல, கிரேக்கத்தில் உட்கிடையாக உள்ள அனுப்பப்படுபவரை ‘ஆள்’ என வெளிப்படுத்துவது அவசியமாகிறது.
- source_word: μετακάλεσαι
  choice: வரவழை
  rationale: ஒருவரைத் தன்னிடம் அழைத்துவரச் செய்வது என்ற கிரேக்க நடுவினை வினையின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: பேதுரு என்று அழைக்கப்படும் சீமோனை
  rationale: சீமோன் அறியப்படும் மற்றொரு பெயரை ἐπικαλεῖται குறிப்பிடுகிறது; ‘என்று அழைக்கப்படும்’ அந்த உறவைத் தெளிவாகக் காக்கிறது.
- source_word: ξενίζεται
  choice: விருந்தினராகத் தங்கியிருக்கிறார்
  rationale: வெறுமனே தங்கியிருப்பதைவிட, மற்றொருவரின் உபசரிப்பைப் பெற்று விருந்தினராகத் தங்கியிருக்கும் செயப்பாட்டு நுணுக்கத்தை ξενίζεται கொண்டுள்ளது.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: தோல் பதனிடுபவரான சீமோனின் வீட்டில்
  rationale: οἰκία என்பதன் ‘வீடு’ என்ற பொருளையும், βυρσεύς குறிப்பிடும் சீமோனின் தோல் பதனிடும் தொழிலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: παρὰ θάλασσαν
  choice: கடலோரத்தில் உள்ள
  rationale: கடலுக்கு அருகிலுள்ள இடத்தைக் குறிக்கும் παρά + வேற்றுமை அமைப்பை இயல்பான தமிழில் வழங்குகிறது; தொடரமைப்பில் இது வீட்டின் இருப்பிடத்தைத் தெளிவுபடுத்துகிறது.
