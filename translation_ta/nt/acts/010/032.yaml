  source_fidelity: மூலக் கிரேக்கத்தின் கட்டளைத் தொடரான πέμψον … καὶ μετακάλεσαι இயல்பாகவும் துல்லியமாகவும் “யோப்பாவுக்கு ஆள் அனுப்பி … வரவழை” என வழங்கப்பட்டுள்ளது. ξενίζεται என்பதிலுள்ள விருந்தோம்பல் பெற்று தங்கும் நுணுக்கம் “விருந்தினராகத் தங்கியிருக்கிறார்” என்பதில் பாதுகாக்கப்படுகிறது. இடம், பெயர்கள், தொழில், மற்றும் “கடலோரத்தில்” என்ற இருப்பிடக் குறிப்பு அனைத்தும் மூலத்துடன் ஒத்திருக்கின்றன.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “ஆள் அனுப்பி … வரவழை” என்பது இரண்டு கிரேக்கக் கட்டளைகளையும் தமிழில் இயல்பாக இணைக்கிறது. சொற்றொடர் நீளமானதாயினும் பொருளில் குழப்பம் இல்லை.
  terminology: “யோப்பா,” “சீமோன்,” “பேதுரு,” மற்றும் “தோல் பதனிடுபவர்” ஆகியவை பொருத்தமானவை. “விருந்தினராகத் தங்கியிருக்கிறார்” என்பது வெறும் தங்குதலைவிட ξενίζεται-ன் விருந்தினராக்கப்படுதல்/உபசரிப்பு பெறுதல் என்ற கூறைச் சரியாகத் தெரிவிக்கிறது.
