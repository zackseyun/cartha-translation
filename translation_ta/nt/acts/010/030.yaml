source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: ta
  text: 'கொர்னேலியு கூறினார்: “நான்கு நாட்களுக்கு முன்பு இதே நேரத்தில், ஒன்பதாம் மணி வேளையில்[a] நான் என் வீட்டில் செபித்துக்கொண்டிருந்தேன். அப்போது, இதோ, ஒளிவீசும் ஆடை அணிந்த ஒரு மனிதர் என் முன்னால் நின்றார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, பிற்பகல் சுமார் மூன்று மணி.
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: கூறினார்
  rationale: இறந்தகாலக் கதைநடையில் உரையை அறிமுகப்படுத்தும் இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: நான்கு நாட்களுக்கு முன்பு இதே நேரத்தில்
  rationale: நிகழ்காலத்திலிருந்து நான்கு நாட்கள் பின்னோக்கி இதே நேரத்தைக் குறிக்கும் கிரேக்க காலமரபை இயல்பான தமிழில் தருகிறது; சொல்லுக்குச் சொல் மொழிபெயர்ப்பின் செயற்கைத்தன்மையைத் தவிர்க்கிறது.
- source_word: ἤμην ... προσευχόμενος
  choice: செபித்துக்கொண்டிருந்தேன்
  rationale: கடந்த காலத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கும் சுற்றுவழி இறந்தகால அமைப்பின் பொருளைப் பாதுகாக்கிறது.
- source_word: τὴν ἐνάτην
  choice: ஒன்பதாம் மணி வேளையில்
  rationale: மூலப் பண்பாட்டின் நேரக் கணக்கை முதன்மை உரையில் பாதுகாக்கிறது; இன்றைய நேரக் கணக்கிலான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν τῷ οἴκῳ μου
  choice: என் வீட்டில்
  rationale: இடத்தைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: அறிக்கையின் திடீர் தன்மையையும் காட்சித் தெளிவையும் உணர்த்தும் கவன ஈர்ப்புச் சொல்லைப் பாதுகாக்கிறது.
- source_word: ἀνὴρ
  choice: ஒருவர்
  rationale: தமிழில் மரியாதையுடனும் இயல்பாகவும் ஒரு மனித உருவைக் குறிக்கிறது; சூழலில் ஆண் உருவம் என்பது தெளிவாக இருந்தாலும், ‘ஒரு மனிதன்’ என்பதைவிட ‘ஒருவர்’ கண்ணியமான நடை.
- source_word: ἔστη ἐνώπιόν μου
  choice: என் முன்னால் நின்றார்
  rationale: அந்த உருவம் கொர்னேலியுவுக்கு முன்னே நிலைகொண்டதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: ஒளிவீசும் ஆடை அணிந்த
  rationale: λαμπρός என்பதன் பிரகாசமான காட்சித் தன்மையையும் ἐσθής என்பதன் ஆடைப் பொருளையும் தெளிவாகக் கடத்துகிறது.
theological_decisions:
- issue: τὴν ἐνάτην என்ற நேரக் குறிப்பை மொழிபெயர்த்தல்
  choice: ஒன்பதாம் மணி வேளையில்
  alternative: பிற்பகல் சுமார் மூன்று மணிக்கு
  rationale: மூலத்தின் பண்பாட்டு நேரக் குறிப்பை முதன்மை உரையில் வைத்திருக்கிறது; நவீன நேர இணை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: ἀνὴρ என்பவர் யார் என்பதை உரையில் அடையாளப்படுத்தல்
  choice: ஒருவர்
  alternative: ஒரு தேவதூதர்
  rationale: இந்த வசனம் தோற்றத்தை ‘ஒருவர்’ என்று விவரிக்கிறது. சூழலின் அடிப்படையில் அவரை நேரடியாக ‘தேவதூதர்’ என்று பெயரிடுவது இவ்வசனத்தின் சொற்களைத் தாண்டிய விளக்கமாகிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘செபித்துக்கொண்டிருந்தேன்’ தொடர்ச்சியான செயலைத் தெளிவுபடுத்துகிறது; ‘அப்போது இதோ’ மூலத்தின் காட்சித் திடீர்மையைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறி [a] முதன்மை உரையில் உரிய இடத்தில் இடம்பெற்றுள்ளது.
