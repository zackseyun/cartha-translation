- source_word: ἐπὶ τῆς γῆς
  choice: பூமிக்கு
  rationale: கீழ்நோக்கிய இயக்கத்தின் இலக்கைச் சுருக்கமாகக் காட்டுகிறது; ‘தரைக்கு’ என்பதைவிட γῆ இன் விரிந்த பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தரிசனச் சூழலில் οὐρανός என்பதன் பொருள்
