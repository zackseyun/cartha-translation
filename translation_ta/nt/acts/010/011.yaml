  rationale: ‘வானம்’ நவீன தமிழில் இயல்பாக இருப்பதுடன், காணக்கூடிய ஆகாயம் மற்றும் தெய்வீக வானுலகம் ஆகிய இரு சாத்தியங்களையும் கட்டாயமாகப் பிரிக்காமல் தாங்குகிறது. அடிக்குறிப்பு மாற்றுப் பொருளை வெளிப்படையாகக் குறிப்பிடுகிறது.
