source:
  edition: SBLGNT
  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: ta
  text: கொர்னேலியுவிடம் பேசிக்கொண்டிருந்த தேவதூதன் புறப்பட்டுப் போனபோது, கொர்னேலியு தன் வீட்டுப் பணியாளர்களில் இருவரையும்[a], தனக்கு உடனிருந்து சேவை செய்தவர்களில் இறைபக்தியுள்ள ஒரு படைவீரனையும் அழைத்து,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வீட்டு அடிமைகளில் இருவரையும்.’ οἰκέται என்ற கிரேக்கச் சொல் வீட்டைச் சேர்ந்திருந்து அடிமை நிலையில் பணிசெய்தவர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: புறப்பட்டுப் போனபோது
  rationale: முதன்மைச் செயலுக்கு முன் தூதன் சென்றுவிட்ட காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; δέ-ஐ தேவையின்றி தனியே மொழிபெயர்க்கவில்லை.
- source_word: ὁ ἄγγελος ὁ λαλῶν αὐτῷ
  choice: தன்னிடம் பேசிக்கொண்டிருந்த தூதன்
  rationale: சூழலில் இது விண்ணுலகத் தூதரைக் குறிக்கிறது; நிகழ்ந்துகொண்டிருந்த பேச்சை நிகழ்காலப் பங்கேற்பு வடிவத்துக்கேற்ப ‘பேசிக்கொண்டிருந்த’ என வழங்குகிறது.
- source_word: φωνήσας
  choice: அழைத்து,
  rationale: இது முற்றுவினை அல்ல, அடுத்த வசனத்தின் செயலுக்கு முன் நிகழும் பங்கேற்புவினை. ஆகவே வசனத்தின் தொடர்தன்மையைப் பாதுகாக்க ‘அழைத்து’ என்று முடிக்கப்பட்டுள்ளது.
- source_word: δύο τῶν οἰκετῶν
  choice: தன் வீட்டுப் பணியாளர்களில் இருவரையும்
  rationale: οἰκέτης என்பது வீட்டில் பணிசெய்யும் பணியாளர் அல்லது அடிமையைக் குறிக்கிறது. இயல்பான நவீன தமிழுக்காக ‘வீட்டுப் பணியாளர்கள்’ பயன்படுத்தப்பட்டு, அடிமை என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. ‘தன்’ என்பது சூழலிலிருந்து தெளிவாகும் கொர்னேலியுவின் வீட்டைக் குறிக்கிறது.
- source_word: στρατιώτην εὐσεβῆ
  choice: இறைபக்தியுள்ள ஒரு படைவீரனை
  rationale: εὐσεβής குறிக்கும் பயபக்தியுள்ள சமய ஈடுபாட்டை ‘இறைபக்தியுள்ள’ இயல்பாகத் தெரிவிக்கிறது; ‘தேவபயமுள்ள’ என்ற சூழலைவிடக் குறிப்பான கருத்தைச் சேர்க்கவில்லை.
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: தனக்குத் தொடர்ந்து உதவியாக இருந்தவர்களில்
  rationale: கொர்னேலியுவிடம் விடாமுயற்சியுடன் உடனிருந்து பணியாற்றிய குழுவிலிருந்து அந்தப் படைவீரன் தேர்ந்தெடுக்கப்பட்டதை, partitive genitive உட்பட, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἄγγελος என்பவரின் இயல்பு
  choice: விண்ணுலகத் தூதரைக் குறிக்கும் ‘தூதன்’
  alternative: சாதாரண செய்தியாளர்
  rationale: அப்போஸ்தலர் 10-இன் உடனடிச் சூழல் கொர்னேலியுவின் தரிசனத்தில் வந்த தெய்வீகத் தூதரை விவரிக்கிறது. எனவே சாதாரண மனிதச் செய்தியாளர் என்ற பொதுவான பொருள் இங்கு பொருந்தாது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. கிரேக்க வாக்கியம் அடுத்த வசனத்தில் நிறைவடைவதால், ‘அழைத்து,’ என்ற தொடர்வடிவமும் இறுதிக் காற்புள்ளியும் வேண்டுமென்றே வைக்கப்பட்டுள்ளன. குழப்பத்தைத் தவிர்க்கச் சூழலிலிருந்து ‘கொர்னேலியு’ என்ற எழுவாய் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
