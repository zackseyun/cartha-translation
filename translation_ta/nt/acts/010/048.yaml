id: ACT.10.48
reference: Acts 10:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: ta
  text: பின்பு, மெசியாவாகிய இயேசுவின் பெயரில் திருமுழுக்கு பெறுமாறு அவர் அவர்களுக்குக் கட்டளையிட்டார்.[a] அப்போது, அவரைச் சில நாட்கள் தங்கியிருக்குமாறு அவர்கள் கேட்டுக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபான சொல்லாக்கத்தில், “இயேசு கிறிஸ்துவின் பெயரில்.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξεν
  choice: கட்டளையிட்டார்
  rationale: அதிகாரத்துடன் அறிவுறுத்துவதைச் சுட்டும் வினையின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: δὲ
  choice: எனவே
  rationale: இங்கு வலுவான முரண்பாட்டைக் காட்டாமல், முந்தைய நிகழ்வின் விளைவாகக் கதை நகர்வதைக் காட்டுகிறது.
- source_word: ἐν τῷ ὀνόματι
  choice: பெயரில்
  rationale: அதிகாரம், சார்பு, அழைப்பு ஆகிய சாத்தியமான பொருள் நிழல்களைச் சுருக்காமல் கிரேக்கச் சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மெசியாவாகிய இயேசுவின்
  rationale: Χριστός என்பதைப் பெயரின் ஒரு பகுதிபோல் ஒலிபெயர்க்காமல், இங்கு இயேசுவுக்குரிய பட்டமாகத் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: βαπτισθῆναι
  choice: திருமுழுக்குப் பெறும்படி
  rationale: செயப்பாட்டு infinitive வடிவத்தை இயல்பான தமிழில் தருகிறது; சடங்கின் முறையைத் தேவையின்றி மேலும் வரையறுக்கவில்லை.
- source_word: τότε
  choice: பின்பு
  rationale: அடுத்த நிகழ்வின் காலவரிசையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἠρώτησαν
  choice: கேட்டுக்கொண்டார்கள்
  rationale: இங்கு வேண்டுகோள் விடுப்பதைக் காட்டும் மரியாதையான, இயல்பான தமிழ்ச் சொல்லாக்கம்.
- source_word: ἐπιμεῖναι
  choice: தங்கும்படி
  rationale: குறிப்பிட்ட காலம் தொடர்ந்து ஓரிடத்தில் இருப்பது என்ற சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἡμέρας τινάς
  choice: சில நாட்கள்
  rationale: கால அளவைத் துல்லியமாக நிர்ணயிக்காமல் கிரேக்கத்தின் திட்டமிடப்படாத தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: திருமுழுக்கு வாய்பாட்டில் Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவாகிய இயேசு
  alternative: இயேசு கிறிஸ்து
  rationale: இச்சூழலில் Χριστός ஒரு பட்டமாகவும் அறிக்கையாகவும் செயல்படுகிறது. ஆகவே அதன் பொருளை ‘மெசியா’ என மொழிபெயர்த்து, தமிழில் இயல்பாகப் பட்டத்துடன் பெயரை இணைக்கிறது; மரபான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘திருமுழுக்கு’ என்பது வழக்கமான வேதாகமச் சொல்லாக வைக்கப்பட்டுள்ளது; ‘மெசியாவாகிய இயேசு’ என்ற வடிவம் பட்டத்தின் பொருளைத் தெளிவுபடுத்துகிறது.
