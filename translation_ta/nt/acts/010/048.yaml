revisions:
- from: எனவே, மெசியாவாகிய இயேசுவின் பெயரில் அவர்கள் திருமுழுக்குப் பெறும்படி அவர் கட்டளையிட்டார்.[a] பின்பு, அவரைச் சில நாட்கள் தங்கும்படி கேட்டுக்கொண்டார்கள்.
  to: பின்பு, மெசியாவாகிய இயேசுவின் பெயரில் திருமுழுக்கு பெறுமாறு அவர் அவர்களுக்குக் கட்டளையிட்டார்.[a] அப்போது, அவரைச் சில நாட்கள் தங்கியிருக்குமாறு அவர்கள் கேட்டுக்கொண்டார்கள்.
  rationale: The revision replaces the overly inferential connector with neutral narrative progression, corrects the Tamil baptism expression, and keeps the title rendering and its traditional alternative. «அப்போது» reflects τότε's temporal sequence, and «தங்கியிருக்குமாறு» naturally conveys remaining for some days.
