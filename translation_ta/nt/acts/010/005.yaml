id: ACT.10.5
reference: Acts 10:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: ta
  text: இப்பொழுது, யோப்பாவுக்கு ஆட்களை அனுப்பி, பேதுரு என்று அழைக்கப்படும் சீமோன் என்ற ஒருவரை வரவழை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேதுரு என்று அறியப்படும் சீமோன் என்ற ஒருவரை அழைக்க, ஆட்களை அனுப்பு.”
    reason: சீமோனை அறிமுகப்படுத்தும் τινα என்பதையும், ἐπικαλεῖται என்பதையும் வேறொரு இயல்பான முறையில் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: καὶ νῦν
  choice: இப்போது
  rationale: νῦν என்பதன் கால மற்றும் உரையாடல் முன்னேற்றத்தை இயல்பான நவீனத் தமிழில் காட்டுகிறது; முந்தைய வாக்கியத்துடனான தொடர்பு தமிழில் சூழலால் தெளிவாக இருப்பதால் καί தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: πέμψον
  choice: அனுப்பி
  rationale: இரண்டாம் நபர் ஒருமை கட்டளையைத் தெளிவாகத் தருகிறது; அடுத்த கட்டளையுடன் இயல்பாக இணைக்க தமிழில் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἄνδρας
  choice: ஆட்களை
  rationale: இங்கு அனுப்பப்படுகிற மனிதர்களைக் குறிக்கும் இயல்பான தமிழ்ச் சொல். ‘தூதர்களை’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத பணிப்பெயரைச் சேர்த்துவிடும்.
- source_word: εἰς Ἰόππην
  choice: யோப்பாவுக்கு
  rationale: ஓர் இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கும் εἰς என்பதற்கு இயல்பான தமிழாக்கம்.
- source_word: μετάπεμψαι
  choice: வரவழை
  rationale: ஒருவரைத் தன்னிடம் வரும்படி ஆள் அனுப்பி அழைப்பது என்ற நடுத்தர வினை வடிவத்தின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; கட்டாயமாகக் கொண்டுவருதல் என்ற மிகைப்பைத் தவிர்க்கிறது.
- source_word: Σίμωνά τινα
  choice: சீமோன் என்பவரை
  rationale: τινα அறிமுகப்படுத்தும், இதுவரை குறிப்பாக அடையாளப்படுத்தப்படாத நபரை மரியாதையான இயல்பான தமிழில் காட்டுகிறது. ‘ஒரு குறிப்பிட்ட சீமோன்’ என்பது தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: பேதுரு என்று அழைக்கப்படும்
  rationale: சீமோனுக்கு வழங்கப்பட்டு பயன்பாட்டில் இருந்த பெயரை நேரடியாக வெளிப்படுத்துகிறது; ‘குடிப்பெயர்’ போன்ற மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
