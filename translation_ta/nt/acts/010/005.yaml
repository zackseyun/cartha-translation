- from: இப்போது யோப்பாவுக்கு ஆட்களை அனுப்பி, பேதுரு என்று அழைக்கப்படும் சீமோன் என்பவரை வரவழை[a].
  to: இப்பொழுது, யோப்பாவுக்கு ஆட்களை அனுப்பி, பேதுரு என்று அழைக்கப்படும் சீமோன் என்ற ஒருவரை வரவழை[a].
