  text: διὸ καὶ ἀναντιρρήτως ἦλθον μεταπεμφθείς πυνθάνομαι οὖν τίνι λόγῳ μετεπέμψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: ta
  text: ஆகையால், என்னை வரவழைத்தபோது நானும் மறுப்பின்றி வந்தேன்[a]. எனவே, எதற்காக என்னை வரவழைத்தீர்கள் என்று கேட்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எந்தத் தயக்கமும் இல்லாமல்.’ கிரேக்கத்தில் இன்னும் சொற்படியாக, ‘மறுப்பின்றி’ அல்லது ‘எதிர்த்துப் பேசாமல்’ என்று பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஏன் என்னை வரவழைத்தீர்கள்?’ சொற்படியாக, ‘எந்தக் காரணத்திற்காக என்னை வரவழைத்தீர்கள்?’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ஆகையால்
  rationale: முந்தைய விளக்கத்திலிருந்து வரும் முடிவைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: καὶ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது தரும் மெலிந்த வலியுறுத்தல் தமிழ்ச் சொற்றொடரின் ஓட்டத்தில் இயல்பாக உட்பொதிகிறது; ‘மேலும்’ என்று வெளிப்படையாகச் சேர்ப்பது செயற்கையாக இருக்கும்.
- source_word: ἀναντιρρήτως
  choice: எந்த மறுப்பும் சொல்லாமல்
  rationale: எதிர்த்துப் பேசாமலும் ஆட்சேபிக்காமலும் நடந்துகொள்வதைக் குறிக்கும் கிரேக்கச் சொல்லின் அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἦλθον
  choice: வந்தேன்
  rationale: ἔρχομαι என்பதன் இறந்தகால வடிவத்திற்கான நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: μεταπεμφθείς
  choice: என்னை அழைத்து அனுப்பியபோது
  rationale: ஒருவரை வரவழைக்க ஆள் அனுப்புதல் என்ற μεταπέμπομαι என்பதன் செயப்பாட்டு உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: πυνθάνομαι
  choice: கேட்கிறேன்
  rationale: விசாரித்துக் கேட்பதைக் குறிக்கும் வினைக்கு நவீனத் தமிழில் இயல்பான தெரிவு.
- source_word: οὖν
  choice: எனவே
  rationale: பேச்சில் முடிவையும் அடுத்த கேள்விக்கான நகர்வையும் குறிக்கிறது.
- source_word: τίνι λόγῳ
  choice: எதற்காக
  rationale: ‘எந்தக் காரணத்திற்காக’ என்ற பொருளை இயல்பான நவீனத் தமிழில் வழங்குகிறது; சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μετεπέμψασθέ με
  choice: என்னை அழைத்து அனுப்பினீர்கள்
  rationale: முன்னர் வந்த அதே வேர்ச்சொல்லுடனான தொடர்பைப் பாதுகாத்து, வரவழைப்பதற்காக ஆள் அனுப்பிய செயலைத் தெரிவிக்கிறது.
