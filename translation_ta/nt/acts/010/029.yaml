  source_fidelity: மூலத்தின் முக்கியப் பொருள் காக்கப்பட்டுள்ளது. ஆனால் μεταπεμφθείς மற்றும் μετεπέμψασθέ με என்பவற்றுக்கு ‘அழைத்து அனுப்புதல்’ என்பது தமிழில் ‘அழைத்துப் பிறகு அனுப்புதல்’ என்ற வேறுபட்ட பொருளை எளிதில் தரலாம். இங்கு பொருள் ஒருவரைத் தம்மிடம் வரும்படி வரவழைத்தல்/அழைப்பித்தல் ஆகும். διὸ καί-இன் மென்மையான ‘நானும்’ வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்தலாம்.
  naturalness: ‘வரவழைத்தல்’ நவீன நிலையான தமிழில் தெளிவானதும் இயல்பானதும் ஆகும். ‘ஆகையால், நானும்’ மற்றும் ‘எனவே’ ஆகியவை மூலத்தில் உள்ள இரு இணைப்புகளின் தொடர்ச்சியை கண்ணியமான, வாசிக்க எளிய நடையில் தருகின்றன.
