id: ACT.10.37
reference: Acts 10:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: ta
  text: யோவான் அறிவித்த திருமுழுக்குக்குப் பிறகு, கலிலேயாவிலிருந்து தொடங்கி[b] யூதேயா முழுவதிலும் நடந்த காரியத்தை[a] நீங்களே அறிவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயா முழுவதிலும் பரவிய சொல்/செய்தி.” கிரேக்கச் சொல்லான ῥῆμα என்பதற்கு “சொல்,” “செய்தி,” அல்லது “காரியம்” என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தொடங்கி” என மொழிபெயர்க்கப்பட்ட கிரேக்க வினையெச்சத்தின் இலக்கணத் தொடர்பு சற்றுத் தளர்வாக உள்ளது; எனினும், அந்தக் காரியம் கலிலேயாவில் தொடங்கியதை அது தெளிவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: நீங்களே அறிவீர்கள்
  rationale: வினைச்சொல்லுக்கு அவசியமில்லாத ὑμεῖς வலியுறுத்தலைத் தருவதால், ‘நீங்களே’ என்று இயல்பாக வெளிப்படுத்தப்பட்டது. οἴδατε இங்கு நிகழ்காலப் பொருளில் ‘அறிவீர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: τὸ γενόμενον ῥῆμα
  choice: நடந்த காரியம்
  rationale: ῥῆμα என்பதற்கு ‘சொல்,’ ‘செய்தி,’ ‘காரியம்’ ஆகிய பொருள்கள் உண்டு. γενόμενον மற்றும் சூழல் சேர்ந்து இயேசுவைப் பற்றிய பொதுவாக அறியப்பட்ட நிகழ்வு–செய்தித் தொகுப்பைக் குறிப்பதால் ‘நடந்த காரியம்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: யூதேயா முழுவதிலும்
  rationale: κατά + ஆறாம் வேற்றுமை ஒரு பகுதி முழுவதும் பரவியிருப்பதைக் குறிக்கிறது; இத்தமிழாக்கம் ὅλης என்பதன் முழுமையையும் இயல்பாகக் காக்கிறது.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: கலிலேயாவில் தொடங்கி
  rationale: ἀπό தொடக்கப் புள்ளியைக் குறிக்கிறது. தமிழில் ‘கலிலேயாவில் தொடங்கி’ என்பது இயல்பானது; அதேவேளை தொடக்க இடத்தைத் தெளிவாகத் தருகிறது.
- source_word: μετὰ τὸ βάπτισμα
  choice: திருமுழுக்குக்குப் பிறகு
  rationale: μετά + நான்காம் வேற்றுமை இங்கு கால வரிசையைக் குறிக்கிறது. βάπτισμα என்பதற்கு நவீனத் தமிழ் வேதாகம நடையில் பரவலாகப் புரியக்கூடிய ‘திருமுழுக்கு’ பயன்படுத்தப்பட்டது.
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: யோவான் அறிவித்த
  rationale: κηρύσσω என்பதன் பொது அறிவிப்பு சார்ந்த வலிமையை ‘அறிவித்த’ இயல்பாகத் தருகிறது; ‘பிரசங்கித்த’ என்பதைக் காட்டிலும் இது இச்சூழலில் குறுகிய சமயப் பயன்பாட்டைத் தவிர்க்கிறது.
theological_decisions:
- issue: பேதுருவின் சுருக்கத்தில் ῥῆμα என்பதன் பொருள்
  choice: ‘நடந்த காரியம்’ என்று மொழிபெயர்த்து, இயேசுவைப் பற்றிய பொதுவான நிகழ்வுகளையும் அவற்றின் செய்தியையும் உள்ளடக்கும் வகையில் வைத்தல்
  alternative: ‘பரவிய சொல்/செய்தி’
  rationale: ῥῆμα-வின் பன்முகப் பொருளையும் γενόμενον-ன் நிகழ்வுத் தன்மையையும் சூழல் இணைக்கிறது. முதன்மை உரை நிகழ்வுத் தன்மையைத் தருகிறது; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀρξάμενος என்பதன் இலக்கணத் தொடர்பு
  choice: தமிழில் ‘கலிலேயாவில் தொடங்கி’ என்று நிகழ்வின் தொடக்கத்தைச் சுட்டும் தளர்ந்த வினையெச்சமாக வைத்தல்
  alternative: ‘அது கலிலேயாவில் தொடங்கியது’ என்று வெளிப்படையான புதிய வாக்கியமாக்கல்
  rationale: கிரேக்கத்தில் ஆண்பால் வினையெச்சம் முன் வரும் நடுநிலை ῥῆμα-வுடன் நேரடியாக ஒத்திசையாததால் கட்டமைப்பு சற்றுத் தளர்வானது. தமிழ் வடிவம் பொருளைத் தெளிவாக்கினாலும், கிரேக்கத்தில் இல்லாத தெளிவான எழுவாயைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. கிரேக்கச் சொற்றொடரின் வரிசையை அப்படியே பின்பற்றினால் தமிழில் தொய்வு ஏற்படுவதால், காலச் சொற்றொடர் முன்னிறுத்தப்பட்டது. ‘நீங்களே’ என்ற வலியுறுத்தலும் ῥῆμα-வின் உண்மையான பொருள் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
