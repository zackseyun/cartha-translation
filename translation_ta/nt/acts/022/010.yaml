id: ACT.22.10
reference: Acts 22:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: ta
  text: அப்போது நான், “ஆண்டவரே, நான் என்ன செய்ய வேண்டும்?[a]” என்று கேட்டேன். அதற்கு ஆண்டவர் என்னிடம், “எழுந்து தமஸ்குவுக்குப் போ. நீ செய்யுமாறு உனக்கு நியமிக்கப்பட்டுள்ள அனைத்தையும் பற்றி அங்கே உனக்குச் சொல்லப்படும்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரே, நான் என்ன செய்வேன்?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீ செய்யுமாறு உனக்கு ஒதுக்கப்பட்டுள்ள அனைத்தையும் பற்றி அங்கே உனக்குச் சொல்லப்படும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: நான் என்ன செய்ய வேண்டும்?
  rationale: இது அடுத்து தான் என்ன செய்ய வேண்டும் என்று வழிகாட்டுதலைக் கேட்கும் deliberative aorist subjunctive. நவீன தமிழில் இயல்பாகவும் கடமை அல்லது வழிநடத்துதலின் நுணுக்கத்தைப் பாதுகாக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது.
- source_word: κύριε / ὁ ... κύριος
  choice: ஆண்டவரே / ஆண்டவர்
  rationale: தமஸ்கு வழி நிகழ்வை பவுல் மறுபடியும் விவரிக்கும் இந்தச் சூழலில் κύριος என்பது இயேசுவை நோக்கியும் அவரை அடையாளப்படுத்தியும் பயன்படுத்தப்படுகிறது; ஆகவே மரியாதை அழைப்பான ‘ஐயா’ என்பதைவிட ‘ஆண்டவர்’ பொருத்தமானது.
- source_word: Ἀναστὰς
  choice: எழுந்து
  rationale: இந்தப் பங்கேற்புவினை πορεύου என்னும் கட்டளையுடன் தொடர்ச்சியான கட்டளைப் பொருளில் வருகிறது. ‘எழுந்து’ என்பது சுருக்கமாகவும் இயல்பாகவும் அந்த வரிசையைப் பாதுகாக்கிறது.
- source_word: πορεύου εἰς Δαμασκόν
  choice: தமஸ்குவுக்குப் போ
  rationale: இலக்கை நோக்கிய இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது. εἰς இன் நகருக்குள் செல்லும் நுணுக்கத்தைத் தமிழில் வற்புறுத்துவது செயற்கையாக இருக்கும் என்பதால் இலக்குவேற்றுமை பயன்படுத்தப்பட்டது.
- source_word: κἀκεῖ
  choice: அங்கே
  rationale: καὶ ἐκεῖ குறிக்கும் இடத்தையும் நிகழ்வின் தொடர்ச்சியையும் இயல்பான தமிழில் தருகிறது; வாக்கிய அமைப்பே அதன் இணைப்புப் பொருளை வெளிப்படுத்துகிறது.
- source_word: λαληθήσεται
  choice: உனக்குச் சொல்லப்படும்
  rationale: λαλέω என்பதன் எதிர்காலச் செயலப்பாட்டு வடிவத்தையும் σοι என்னும் வேற்றுமையையும் இயல்பான தமிழ் செயலப்பாட்டு வாக்கியமாகப் பாதுகாக்கிறது; யார் சொல்வார் என்பதை உரை குறிப்பிடாதபடியே விடுகிறது.
- source_word: περὶ πάντων
  choice: அனைத்தையும் பற்றி
  rationale: περί உடன் வரும் பிறப்புவேற்றுமை, தெரிவிக்கப்படவிருக்கும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. ‘அனைத்தையும் பற்றி’ என்பது தெளிவான நவீன தமிழ்.
- source_word: ὧν τέτακταί σοι ποιῆσαι
  choice: நீ செய்யுமாறு உனக்கு நியமிக்கப்பட்டுள்ள
  rationale: τάσσω என்பதன் நிறைவுச் செயலப்பாட்டு வடிவம் ஏற்கெனவே ஏற்படுத்தப்பட்டு தொடர்ந்து நிலவும் நியமிப்பைச் சுட்டுகிறது. ‘உனக்கு’ என்பது σοι-ஐ வெளிப்படுத்துகிறது; நியமித்தவர் யார் என்பதையும் நியமித்தலின் துல்லியமான இறையியல் இயல்பையும் உரையைவிட அதிகமாகக் குறிப்பிடவில்லை.
theological_decisions:
- issue: τέτακταί என்பது இறை வழிநடத்தல் மற்றும் அழைப்புடன் கொண்டுள்ள தொடர்பு
  choice: நீ செய்யுமாறு உனக்கு நியமிக்கப்பட்டுள்ள
  alternative: நீ செய்யுமாறு உனக்கு ஒதுக்கப்பட்டுள்ள / நீ செய்யக் கட்டளையிடப்பட்டுள்ள
  rationale: பவுலின் வரவிருக்கும் செயல்கள் முன்பே அமைக்கப்பட்டுள்ளன என்ற உரையின் கருத்தை இது பாதுகாக்கிறது. அதே நேரத்தில் ‘கட்டளையிடப்பட்டுள்ள’ என்று வலுப்படுத்தவோ, ஒரு குறிப்பிட்ட முன்நியமனக் கோட்பாட்டை உரைக்குள் கொண்டுவரவோ இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டது. நேரடி உரையின் இயல்பான ஓட்டத்திற்காக ‘அப்போது’, ‘அதற்கு’ ஆகிய இணைப்புகள் பயன்படுத்தப்பட்டன. செயலப்பாட்டு வடிவங்கள் தேவையான இடங்களில் பாதுகாக்கப்பட்டுள்ளன; இறை செயற்பாட்டாளரை மூல உரை வெளிப்படையாகக் குறிப்பிடாத இடத்தில் மொழிபெயர்ப்பும் குறிப்பிடவில்லை.
