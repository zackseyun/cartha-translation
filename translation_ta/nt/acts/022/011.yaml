  naturalness: The prose is generally clear and modern. Recasting the hand-leading phrase in an explicit passive construction makes the sentence more idiomatic and faithfully retains the Greek passive participle.
  terminology: ‘பிரகாசம்’ is a suitable contextual rendering of δόξα here, with ‘மகிமை’ properly retained as a literal alternative in the footnote. ‘தமஸ்குவுக்கு’ is the more natural Tamil directional form for a city name.
