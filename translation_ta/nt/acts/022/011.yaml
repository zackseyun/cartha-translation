id: ACT.22.11
reference: Acts 22:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: ta
  text: அந்த ஒளியின் பிரகாசத்தால்[a] என்னால் பார்க்க முடியாததால், என்னோடு இருந்தவர்களால் என் கையைப் பிடித்து வழிநடத்தப்பட்டு நான் தமஸ்குவுக்கு வந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, ‘அந்த ஒளியின் மகிமையால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: என்னால் பார்க்க முடியாததால்
  rationale: இச்சூழலில் ἐμβλέπω என்பது வெறுமனே உற்றுநோக்க முடியாமையை அல்ல, அந்த ஒளியால் பார்வை செயலிழந்ததைத் தெரிவிக்கிறது. இறந்தகாலத் தொடர்நிலையும் காரணத் தொடர்பும் தமிழில் இயல்பாக வெளிப்படுகின்றன.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: அந்த ஒளியின் பிரகாசத்தால்[a]
  rationale: δόξα என்பதன் அடிப்படைப் பொருள் ‘மகிமை’ என்றாலும், இங்கு பார்வையை மறைத்த ஒளியின் கதிர்வீச்சைச் சுட்டுகிறது. ‘பிரகாசம்’ உடனடியான காட்சிசார் பொருளைத் தெளிவுபடுத்துகிறது; ‘அந்த’ என்பது ἐκείνου-வைப் பாதுகாக்கிறது. நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: χειραγωγούμενος
  choice: என் கையைப் பிடித்து வழிநடத்த
  rationale: இந்த வினையெச்சம் கையைப் பிடித்து நடத்திச் செல்லும் குறிப்பான செயலைக் கொண்டுள்ளது. ‘கையைப் பிடித்து வழிநடத்த’ என்பது அந்தத் தெளிவான படிமத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: என்னோடு இருந்தவர்கள்
  rationale: σύνειμι என்பதன் ‘உடன் இருத்தல்/உடன் செல்லுதல்’ என்ற உறவுசார் பொருளை, குழுவின் தன்மையை மேலதிகமாக வரையறுக்காமல் நேரடியாகத் தருகிறது.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: நான் தமஸ்குவுக்குள் வந்தேன்
  rationale: εἰς குறிக்கும் நகருக்குள் செல்லும் திசைநுணுக்கத்தை ‘தமஸ்குவுக்குள்’ தக்கவைக்கிறது; ‘வந்தேன்’ என்பது ἦλθον என்பதற்கு இயல்பான கதைநடைத் தமிழ்.
- source_word: ὡς δὲ
  choice: …முடியாததால்
  rationale: ὡς இங்கு அடுத்து நிகழ்ந்ததற்கான சூழ்நிலையையும் காரணத்தையும் அறிமுகப்படுத்துகிறது. தமிழில் காரண வினையெச்சம் இதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; δέ-யின் கதைத் தொடர்ச்சி தனியே இணைப்புச்சொல் சேர்க்காமல் வாக்கிய ஓட்டத்தில் வெளிப்படுகிறது.
theological_decisions:
- issue: தெய்வீக வெளிப்பாட்டுச் சூழலில் δόξα என்பதன் மொழிபெயர்ப்பு
  choice: பிரகாசம்
  alternative: மகிமை
  rationale: இங்கு δόξα, பார்வையை மறைத்த அந்த ஒளியின் காணக்கூடிய ஒளிவீச்சைக் குறிக்கிறது. ‘பிரகாசம்’ உடனடியான காரணத்தைத் தெளிவாகக் கூறுகிறது; அதேவேளையில், சொல்லின் இறையியல் ஒலிப்பை மறைத்துவிடாதபடி ‘மகிமை’ என்ற நேரடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ஒரே வாக்கிய அமைப்பும் காரணத் தொடர்பும் தக்கவைக்கப்பட்டுள்ளன; ‘கையைப் பிடித்து’ என்பது χειραγωγούμενος-ன் உயிரோட்டமான விவரத்தைப் பாதுகாக்கிறது.
