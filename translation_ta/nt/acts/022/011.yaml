  to: அந்த ஒளியின் பிரகாசத்தால்[a] என்னால் பார்க்க முடியாததால், என்னோடு இருந்தவர்களால் என் கையைப் பிடித்து வழிநடத்தப்பட்டு நான் தமஸ்குவுக்கு வந்தேன்.
