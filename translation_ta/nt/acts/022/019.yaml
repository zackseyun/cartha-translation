  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: ta
  text: நானும், “ஆண்டவரே, உம்மை நம்புகிறவர்களை[b] நான் தொழுகைக்கூடம் தோறும்[a] சிறையில் அடைத்தும் அடித்தும் வந்தேன் என்பது அவர்களுக்கே தெரியும்” என்று சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு தொழுகைக்கூடத்திலும்”; கிரேக்கச் சொற்றொடர் பல தொழுகைக்கூடங்களில் மீண்டும் மீண்டும் நடந்த செயலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உம்மீது நம்பிக்கை வைக்கிறவர்களை” அல்லது “உம்மைச் சார்ந்திருக்கிறவர்களை.”
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: அப்போது நான் ... என்று சொன்னேன்
  rationale: καὶ ἐγώ என்பதன் தொடர்ச்சியையும் λέγω என்பதன் இயல்பான நேர்கூற்றையும் நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριος என்பதன் மரியாதையையும் கிறிஸ்துவியல் நிறையையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: αὐτοὶ ἐπίστανται
  choice: அவர்களுக்கே தெரியும்
  rationale: αὐτοί தரும் வலியுறுத்தலை ‘-க்கே’ என்பதன் மூலம் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: சிறையில் அடைத்தும் அடித்தும் வந்தேன்
  rationale: இறந்தகாலத்தில் தொடர்ந்து அல்லது வழக்கமாக நிகழ்ந்த செயலைக் காட்டும் சுற்றுவடிவ imperfect கட்டமைப்பை ‘வந்தேன்’ தக்கவைக்கிறது; δέρων என்பதை குறிப்பிட்ட நீதித்துறைச் சவுக்கடியாக மிகைப்படுத்தாமல் ‘அடித்தும்’ என மொழிபெயர்க்கிறது.
- source_word: κατὰ τὰς συναγωγάς
  choice: தொழுகைக்கூடம் தோறும்
  rationale: κατά உடன் வரும் பன்மைச் சொல்லின் பகிர்வுப் பொருளை—பல தொழுகைக்கூடங்களில் மீண்டும் மீண்டும் நடந்த செயலை—இயல்பான தமிழில் காட்டுகிறது.
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: உம்மை நம்புகிறவர்களை
  rationale: πιστεύω ἐπί என்பதிலுள்ள இயேசுவை நோக்கிய நம்பிக்கை அல்லது சார்ந்திருத்தலை இயல்பாக வெளிப்படுத்துகிறது; நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்நிலையும் காக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριος என்ற அழைப்பு
  choice: ஆண்டவரே
  alternative: எஜமானே
  rationale: உயிர்த்தெழுந்த இயேசுவிடம் பவுல் பேசும் இச்சூழலில், ‘ஆண்டவரே’ என்பது மரியாதையையும் உரையின் கிறிஸ்துவியல் வலிமையையும் காக்கிறது; அதேவேளை உரை கூறுவதற்கு மேல் எந்தக் கோட்பாட்டு விளக்கத்தையும் சேர்ப்பதில்லை.
- issue: பவுலின் முந்தைய துன்புறுத்தலின் காலநிலை
  choice: சிறையில் அடைத்தும் அடித்தும் வந்தேன்
  alternative: சிறையில் அடைத்து அடிப்பது வழக்கம்
  rationale: ἤμην உடன் வரும் நிகழ்காலப் பங்கேற்புச் சொற்கள் கடந்தகாலத் தொடர்ச்சி அல்லது வழக்கமான மீள்செயலைக் குறிக்கின்றன. தேர்ந்த வடிவம் இரு சாத்தியங்களையும் தேவையின்றி குறுக்காமல் தக்கவைக்கிறது.
- issue: πιστεύοντας ἐπὶ σέ என்பதிலுள்ள நம்பிக்கையின் இயல்பு
  choice: உம்மை நம்புகிறவர்கள்
  alternative: உம்மீது நம்பிக்கை வைக்கிறவர்கள்
  rationale: ‘நம்புகிறவர்கள்’ என்பது நவீனத் தமிழில் இயல்பானதும், அறிவுசார் ஒப்புதலாக மட்டும் குறுகாமல் ஒருவர்மீது வைக்கும் நம்பிக்கையையும் உள்ளடக்கக்கூடியதும் ஆகும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் வேதாகம நேர்கூற்றுக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நேரடியாக அழைப்பதால் ‘உம்மை’ என்ற மரியாதைப் பெயர்ப்பதிலி பயன்படுத்தப்பட்டது. ‘தொழுகைக்கூடம்’ என்பது συναγωγή என்பதற்கான தெளிவான பொதுத்தமிழ்ச் சொல்; ‘தோறும்’ அதன் பகிர்வுப் பொருளை இயல்பாகத் தெரிவிக்கிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
