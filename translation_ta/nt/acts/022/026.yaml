source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: ta
  text: நூற்றுவர் படைத்தலைவர் இதைக் கேட்டதும், படைத்தளபதியிடம் சென்று, “நீர் என்ன செய்யப்போகிறீர்?[a] ஏனெனில், இந்த மனிதர் ஒரு ரோமக் குடிமகன்.[b]” என்று தெரிவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் என்ன செய்ய இருக்கிறீர்?” கிரேக்கச் சொற்றொடர் உடனடியாக நிகழவிருக்கும் செயலையோ செய்ய எண்ணியுள்ள செயலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “இந்த மனிதர் ஒரு ரோமர்.” இச்சூழலில் அவர் ரோமக் குடியுரிமை பெற்றவர் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: இதைக் கேட்டதும்
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மைச் செயலுக்கு முன் நிகழ்ந்த சூழலைக் குறிக்கிறது. கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் முந்தைய செய்தியைக் குறிக்க ‘இதை’ சேர்ப்பது இயல்பானது.
- source_word: ἑκατοντάρχης
  choice: நூற்றுவர் தலைவர்
  rationale: ரோமப் படையின் ἑκατοντάρχης என்னும் குறிப்பிட்ட பதவியைத் தெளிவாகவும் தமிழில் புரிந்துகொள்ளத்தக்க வகையிலும் தருகிறது.
- source_word: προσελθὼν
  choice: படைத்தளபதியிடம் சென்று
  rationale: மேலதிகாரியை நோக்கிச் சென்ற இயக்கத்தை இயல்பான தமிழ் நடையில் வெளிப்படுத்துகிறது.
- source_word: χιλιάρχῳ
  choice: படைத்தளபதி
  rationale: ரோமப் படையின் உயரதிகாரியைக் குறிக்கும் சொல்லை, அரிதான ஒலிபெயர்ப்பைத் தவிர்த்து நவீன வாசகர்களுக்குத் தெளிவாக வழங்குகிறது.
- source_word: ἀπήγγειλεν
  choice: தெரிவித்தார்
  rationale: பெற்ற தகவலை மேலதிகாரியிடம் அறிவித்த செயலை இராணுவச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: Τί μέλλεις ποιεῖν;
  choice: நீர் என்ன செய்யப்போகிறீர்?
  rationale: μέλλω + வினையெச்சம் உடனடியாக நிகழவிருக்கும் செயலையோ செய்யும் நோக்கத்தையோ குறிக்கலாம். ‘செய்யப்போகிறீர்’ என்ற தமிழ் வடிவம் இரு நிழற்பொருள்களையும் பெருமளவு தக்கவைக்கிறது.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: ஏனெனில், இந்த மனிதர்
  rationale: γάρ தரும் காரணத் தொடர்பை வெளிப்படையாகக் காட்டி, ἄνθρωπος என்பதைக் சூழலுக்கேற்ற ‘மனிதர்’ என மரியாதையான நடையில் மொழிபெயர்க்கிறது.
- source_word: Ῥωμαῖός ἐστιν
  choice: ஒரு ரோமக் குடிமகன்
  rationale: சட்டச் சூழலில் Ῥωμαῖος என்பது இனத்தையோ வசிப்பிடத்தையோ அல்ல, ரோமக் குடியுரிமையைச் சுட்டுகிறது; ஆகவே பொருளைத் தெளிவுபடுத்துகிறது.
