translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பான ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அதிகாரியிடம் பேசுவதால் ‘நீர்’ என்ற மரியாதை ஒருமை வடிவம் தேர்ந்தெடுக்கப்பட்டது. இராணுவப் பதவிகள் வாசகர்களுக்குப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளன.
