theological_decisions:
- issue: ἡ ὁδός என்பதைப் பொதுப்பெயராகவா, கிறிஸ்தவ இயக்கத்தின் அடையாளப் பெயராகவா மொழிபெயர்ப்பது
  choice: ‘இந்த மார்க்கம்’ என்று அடையாளப் பெயர்சார் நயத்துடன் மொழிபெயர்க்கப்பட்டது
  alternative: இந்த வழி; இந்தப் பாதை; இந்த இயக்கம்
  rationale: அப்போஸ்தலர் பணிகளில் ἡ ὁδός கிறிஸ்தவ விசுவாசத்தையும் சமூகத்தையும் குறிக்கும் நிலையான பயன்பாட்டைக் கொண்டுள்ளது. ‘மார்க்கம்’ பிற்கால சபைச் சொற்களை இறக்குமதி செய்யாமல் அந்தக் குறிப்பை உணர்த்துகிறது.
- issue: ἄχρι θανάτου என்பது நேரடியாகக் கொன்றதாகக் கூறுகிறதா அல்லது துன்புறுத்தலின் கொடிய அளவைக் குறிக்கிறதா
  choice: ‘மரணம் வரைக்கும்’ என்று அதன் எல்லை/அளவுச் சார்ந்த தெளிவின்மை காக்கப்பட்டது
  alternative: கொலைசெய்தேன்; மரணம் நேரிடும் அளவுக்குத் துன்புறுத்தினேன்
  rationale: கிரேக்கச் சொற்றொடர் மரணம் வரையிலான தீவிரத்தைத் தெரிவிக்கிறது; பவுல் தனிப்பட்ட முறையில் கொன்றார் என்ற மேலதிக முடிவை வெளிப்படையாகக் கூறுவதில்லை.
