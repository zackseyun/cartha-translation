lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: இந்த மார்க்கத்தை
  rationale: ὁδός என்பதன் அடிப்படைப் பொருள் ‘வழி/பாதை.’ அப்போஸ்தலர் பணிகளில் இது கிறிஸ்தவ விசுவாசத்தையும் அதைச் சார்ந்த இயக்கத்தையும் குறிக்கும் அடையாளப் பெயராக வருகிறது. ‘மார்க்கம்’ அந்தப் பெயர்சார் நயத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ἐδίωξα
