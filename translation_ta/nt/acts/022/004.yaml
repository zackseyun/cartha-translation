  rationale: இச்சூழலில் διώκω நடுநிலையான பின்தொடர்தலை அல்ல, பகைமையுடன் மேற்கொள்ளப்பட்ட துன்புறுத்தலைக் குறிக்கிறது.
- source_word: ἄχρι θανάτου
  choice: மரணம் வரைக்கும்
  rationale: துன்புறுத்தல் உயிரிழப்பு வரையிலான கொடிய எல்லையை எட்டியதை இந்தச் சொற்றொடர் காட்டுகிறது; பவுலே ஒவ்வொருவரையும் கொன்றார் என்று தேவையின்றி மிகைப்படுத்தாமல் அதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: δεσμεύων
  choice: கட்டி
  rationale: இந்தப் பங்கேற்புவினை உடல்ரீதியாகக் கட்டுவதைக் குறிப்பதால், ‘கைதுசெய்து’ என்ற விளக்க மொழிபெயர்ப்பைவிட மூலத்தின் நேரடியான படிமத்தைப் பாதுகாக்கிறது.
- source_word: παραδιδοὺς
  choice: ஒப்படைத்தேன்
  rationale: இங்கு அதிகாரிகளின் காவலுக்கும் சிறைத்தண்டனைக்கும் ஒருவரை ஒப்படைப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் சட்ட/காவல் சார்ந்த நயத்துடனும் உள்ளது.
- source_word: εἰς φυλακὰς
