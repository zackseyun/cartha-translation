reference: Acts 22:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: ta
  text: உமது சாட்சியான[a] ஸ்தேவானின் இரத்தம் சிந்தப்பட்டுக்கொண்டிருந்தபோது, நானே அங்கே நின்று ஒப்புதல் அளித்து, அவரைக் கொன்றவர்களின் மேலாடைகளைக் காவல் காத்துக்கொண்டிருந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரத்தசாட்சியான’. கிரேக்கச் சொல் ‘சாட்சி’ என்பதைக் குறிக்கிறது; கிறிஸ்தவப் பயன்பாட்டில், தமது சாட்சிக்காக உயிரிழந்த ஒருவருடன் இச்சொல் சிறப்பாகத் தொடர்புபடுத்தப்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: சிந்தப்பட்டுக்கொண்டிருந்தபோது
  rationale: இறந்தகாலத் தொடர்நிலைச் செயப்பாட்டு வடிவத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இரத்தம் ஊற்றப்படுதல் என்ற மூல உருவகத்தையும் ‘சிந்தப்படுதல்’ என்ற வழக்கான தமிழ்ச் சொல்லால் காக்கிறது.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: நேரடியான, நிலையான தமிழ் இணைச்சொல்.
- source_word: μάρτυρός
  choice: சாட்சியான
  rationale: மூலக் கிரேக்கச் சொல்லின் அடிப்படைப் பொருள் ‘சாட்சி’. ஸ்தேவானின் மரணச் சூழலால் ‘இரத்தசாட்சி’ என்ற பிற்கால கிறிஸ்தவப் பயன்பாடும் பொருத்தமுடையதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐφεστὼς
  choice: அருகில் நின்று
  rationale: நிகழ்விடத்தில் நின்றிருந்ததையும் அங்கிருந்ததையும் இயல்பான தமிழில் தெரிவிக்கிறது; பவுலின் பங்கை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: συνευδοκῶν
  choice: அதை ஆமோதித்ததோடு
  rationale: வெறும் உடன்பாட்டைக் காட்டிலும் செயலில் வெளிப்பட்ட ஒப்புதலைத் தெளிவாகக் காட்டுகிறது; ‘அதை’ என்பது ஸ்தேவானைக் கொன்ற நிகழ்வைக் குறிக்கிறது.
- source_word: φυλάσσων
  choice: காவல் காத்துக்கொண்டிருந்தேன்
  rationale: மேலாடைகளைப் பாதுகாத்துக் கவனித்துக்கொண்டிருந்த உறுதியான செயலைத் தொடர்நிலையுடன் வெளிப்படுத்துகிறது.
- source_word: ἱμάτια
  choice: மேலாடைகள்
  rationale: பொதுவான ‘உடைகள்’ என்பதைவிட, கல்லெறியும்போது கழற்றி வைக்கப்பட்ட வெளிப்புற ஆடைகளைத் துல்லியமாகக் குறிக்கிறது.
- source_word: ἀναιρούντων
  choice: கொன்றவர்களின்
  rationale: இச்சூழலில் ‘கொல்லுதல்’ அல்லது ‘உயிரை நீக்குதல்’ என்பதே பொருள்; ‘கொலைசெய்த’ என்பது மூலச்சொல்லில் வெளிப்படையாக இல்லாத கூடுதல் அறத்தீர்ப்பைச் சேர்க்கக்கூடும்.
- source_word: αὐτὸς
  choice: நானே
  rationale: பேசுபவர் தாமும் நேரடியாக அங்கு இருந்ததை வலியுறுத்தும் கிரேக்கச் சுட்டுப்பெயரின் அழுத்தத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஸ்தேவானைக் குறிக்கும் μάρτυς சொல்லின் மொழிபெயர்ப்பு
  choice: சாட்சி
  alternative: இரத்தசாட்சி
  rationale: மூலக் கிரேக்கச் சொல்லின் அடிப்படைப் பொருளை முதன்மை உரை காக்கிறது. ஸ்தேவான் தமது சாட்சிக்காகக் கொல்லப்பட்ட சூழலால் உருவான ‘இரத்தசாட்சி’ என்ற கிறிஸ்தவப் பயன்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; பிற்காலத் திருச்சபைச் சொல்லாட்சியை முதன்மை உரையில் பின்னோக்கித் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நானே’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; தொடர்நிலை வினைவடிவங்கள் நிகழ்வின் நீடித்த தன்மையை வெளிப்படுத்துகின்றன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘சாட்சியான’ என்பதற்குப் பின்பே வைக்கப்பட்டுள்ளது.
