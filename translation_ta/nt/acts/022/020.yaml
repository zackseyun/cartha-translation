revisions:
- from: உமது சாட்சியான[a] ஸ்தேவானின் இரத்தம் சிந்தப்பட்டுக்கொண்டிருந்தபோது, நானே அருகில் நின்று அதை ஆமோதித்ததோடு, அவரைக் கொன்றவர்களின் மேலாடைகளையும் காவல் காத்துக்கொண்டிருந்தேன்.
  to: உமது சாட்சியான[a] ஸ்தேவானின் இரத்தம் சிந்தப்பட்டுக்கொண்டிருந்தபோது, நானே அங்கே நின்று ஒப்புதல் அளித்து, அவரைக் கொன்றவர்களின் மேலாடைகளைக் காவல் காத்துக்கொண்டிருந்தேன்.
  rationale: The revision removes an ambiguous Tamil pronoun and replaces an overly specific spatial expression with a natural rendering of presence. It retains the ongoing passive depiction of Stephen’s blood being poured out, Paul’s emphatic self-reference, his approval, and his guarding of the killers’ outer garments. The footnote continues to preserve the traditional ‘martyr’ sense without displacing the primary lexical rendering ‘witness’ from the text.
