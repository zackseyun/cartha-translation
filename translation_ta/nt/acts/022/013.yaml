translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. மூலத்தில் இருமுறை வரும் μοι என்பதைக் கணக்கில் கொண்டு ‘என்னிடம்’ இருமுறையும் வைக்கப்பட்டது. ἀναβλέπω என்ற இரு வடிவங்களும் இச்சூழலில் ஒரேபோல் ‘மீண்டும் பார்வை பெறு/பெற்று’ என மொழிபெயர்க்கப்பட்டதால் தனிக் குறிப்புரை தேவையில்லை.
