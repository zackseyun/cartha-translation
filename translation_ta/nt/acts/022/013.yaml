id: ACT.22.13
reference: Acts 22:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐλθὼν πρὸς ⸀ἐμὲ καὶ ἐπιστὰς εἶπέν μοι· Σαοὺλ ἀδελφέ, ἀνάβλεψον· κἀγὼ αὐτῇ τῇ ὥρᾳ ἀνέβλεψα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: ta
  text: அவர் என்னிடம் வந்து, என் அருகில் நின்று, “சகோதரனாகிய சவுலே, மீண்டும் பார்வை பெறு” என்று என்னிடம் கூறினார். அந்த நேரத்திலேயே நானும் மீண்டும் பார்வை பெற்று, அவரைப் பார்த்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: அவர் என்னிடம் வந்து
  rationale: இறந்தகால வினையெச்சத்தையும் பவுலை நோக்கிய வருகையையும் இயல்பான தமிழ் நடையில் வெளிப்படுத்துகிறது.
- source_word: ἐπιστάς
  choice: என் அருகில் நின்று
  rationale: அனனியா பவுலின் அருகே வந்து நின்ற இடநிலைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: Σαοὺλ ἀδελφέ
  choice: சகோதரனாகிய சவுலே
  rationale: விளிவேற்றுமையிலுள்ள பெயரையும் சகோதர உறவு அல்லது விசுவாசத் தோழமை குறிக்கும் அழைப்பையும் இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: ἀνάβλεψον
  choice: மீண்டும் பார்வை பெறு
  rationale: வினைச்சொல் ‘மேலே பார்’ என்றும் பொருள்படலாம்; ஆனால் குருட்டுத்தன்மையும் குணமடைதலும் பற்றிய சூழலில் பார்வை திரும்பக் கிடைப்பதே இங்கு இயல்பான பொருள்.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: அந்த நேரத்திலேயே
  rationale: நிகழ்வு அதே குறிப்பிட்ட நேரத்தில் நடந்தது என்ற வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀνέβλεψα
  choice: நான் மீண்டும் பார்வை பெற்று
  rationale: முன்னுள்ள கட்டளையோடு சொற்பொருள் ஒற்றுமையைப் பேணி, பார்வை மீட்கப்பட்டதைக் குறிக்கிறது.
- source_word: εἰς αὐτόν
  choice: அவரைப் பார்த்தேன்
  rationale: பார்வை மீண்டபின் அது அனனியாவை நோக்கிச் செலுத்தப்பட்டதைத் தெளிவாகத் தருகிறது.
- source_word: κἀγώ
  choice: நான்
  rationale: καί மற்றும் ἐγώ சேர்ந்த வடிவம்; தமிழில் தொடர்ச்சியும் எழுவாய் வலியுறுத்தலும் சூழலால் போதுமான அளவு வெளிப்படுகின்றன.
