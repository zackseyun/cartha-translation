  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: ta
  text: என்னுடன் இருந்தவர்கள் அந்த ஒளியைக் கண்டார்கள்; ஆனால் என்னிடம் பேசிக்கொண்டிருந்தவரின் குரலை அவர்கள் கேட்கவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தக் குரலை அவர்கள் புரிந்துகொள்ளவில்லை.’ அப்போஸ்தலர் 9:7-ல் பவுலுடன் சென்றவர்கள் ஒலியையோ குரலையோ கேட்டதாகச் சொல்லப்படுகிறது. அவர்கள் ஒலியைக் கேட்டும், பேசியவரின் வார்த்தைகளைப் புரிந்துகொள்ளவில்லை என்பது இங்குள்ள பொருளாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: என்னுடன் இருந்தவர்கள்
  rationale: பாலினத்தை மூலத்தில் இல்லாமல் சேர்க்காமல், பெயரெச்சத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது. δέ-யின் எதிர்மறைத் தொடர்பு அடுத்துள்ள ‘ஆனால்’ என்பதில் வெளிப்படுகிறது.
- source_word: τὸ μὲν φῶς
  choice: அந்த ஒளியை
  rationale: φῶς என்பதன் நேரடிப் பொருள் ‘ஒளி’. μέν…δέ அமைக்கும் முரண்பாடு தமிழில் ‘…கண்டார்கள்; ஆனால்…’ என வெளிப்படுத்தப்படுகிறது. இவ்வசனத்தில் இல்லாத ‘பிரகாசமான’ என்ற பண்பு சேர்க்கப்படவில்லை.
- source_word: ἐθεάσαντο
  choice: கண்டார்கள்
  rationale: θεάομαι இங்கு பார்வையால் கண்டதைச் சொல்கிறது. ‘கண்டார்கள்’ என்பது இயல்பானதும், நோக்கத்துடன் உற்றுப் பார்த்தார்கள் என்ற தேவையற்ற நுண்பொருளைச் சேர்க்காததும் ஆகும்.
- source_word: τὴν δὲ φωνὴν
  choice: குரலை
  rationale: φωνή என்பது ‘குரல்’ அல்லது ‘ஒலி’ என வரலாம். ‘என்னிடம் பேசிக்கொண்டிருந்தவரின்’ என்ற தொடரால் தனிப்பட்ட பேச்சாளர் குறிக்கப்படுவதால் ‘குரல்’ பொருத்தமானது.
- source_word: οὐκ ἤκουσαν
  choice: கேட்கவில்லை
  rationale: ἀκούω என்பதன் முதன்மையான பொருளை நேரடியாகப் பாதுகாக்கிறது. ‘புரிந்துகொள்ளவில்லை’ என்ற சாத்தியமான நுண்பொருள் பிரதான உரையில் திணிக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ λαλοῦντός μοι
  choice: என்னிடம் பேசிக்கொண்டிருந்தவரின்
  rationale: நிகழ்ந்துகொண்டிருக்கும் செயலைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்தின் தன்மையை ‘பேசிக்கொண்டிருந்த’ என்பதால் காக்கிறது; μοι என்பதற்கு இயல்பாக ‘என்னிடம்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: அப்போஸ்தலர் 9:7-ல் உடன் சென்றவர்கள் குரல்/ஒலியைக் கேட்டதாகச் சொல்லப்படுவதற்கும் இவ்வசனத்திற்கும் இடையிலான வெளிப்படையான இழுபறி
  choice: ‘குரலை அவர்கள் கேட்கவில்லை’ என்று மூலத்தின் வெளிப்படையான சொல்லாக்கத்தைப் பிரதான உரையில் வைத்தல்
  alternative: ‘அந்தக் குரலை அவர்கள் புரிந்துகொள்ளவில்லை’
  rationale: இங்கு ἀκούω இயல்பாக ‘கேள்’ என்றும், φωνή தனிப்பட்ட பேச்சாளரின் ‘குரல்’ என்றும் பொருள்படுகின்றன. ஆயினும் சொற்களின் பொருள் வரம்பும் அப்போஸ்தலர் 9:7-ன் இணை விவரமும், ஒலியைக் கேட்டும் பேசியவரின் வார்த்தைகளைப் புரிந்துகொள்ளாத நிலையை அனுமதிக்கலாம். அந்த விளக்கத்தை பிரதான உரையில் கொண்டு இழுபறியைத் தீர்த்துவிடாமல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தில் இல்லாத தொடக்கக் காலக் குறியீட்டையோ ‘ஆண்கள்’ என்ற பாலினச் சொல்லையோ சேர்க்கவில்லை. அடிக்குறிப்பு குறி அது விளக்கும் ‘கேட்கவில்லை’ என்ற கூற்றுக்குப் பின் வைக்கப்பட்டுள்ளது.
