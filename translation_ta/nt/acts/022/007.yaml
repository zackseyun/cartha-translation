source:
  edition: SBLGNT
  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: ta
  text: நான் தரையில் விழுந்தேன்; ‘சவுலே, சவுலே, நீ ஏன் என்னைத் துன்புறுத்துகிறாய்?’ என்று என்னிடம் சொன்ன ஒரு குரலைக் கேட்டேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: நான் ... விழுந்தேன்
  rationale: πίπτω என்பதன் இறந்தகால நிகழ்வை இயல்பான நவீனத் தமிழில் எளிய கடந்தகாலமாகத் தருகிறது.
- source_word: τε
  choice: அப்போது
  rationale: முன்னுள்ள நிகழ்வுடன் இவ்வாக்கியத்தை இணைக்கும் τε-யின் தொடர்ச்சி வலிமையைத் தமிழில் இயல்பாகக் காட்டுகிறது; தனியே ‘மேலும்’ என மொழிபெயர்ப்பது செயற்கையாக இருக்கும்.
- source_word: εἰς τὸ ἔδαφος
  choice: தரையில்
  rationale: விழுதலின் இலக்கைத் தமிழில் இயல்பாகக் குறிக்கும் வழக்கு; ‘பூமிக்கு’ என்பது இச்சூழலில் இயல்பற்றது.
- source_word: ἤκουσα
  choice: கேட்டேன்
  rationale: ἀκούω என்பதன் முதலாம் நபர் ஒருமை இறந்தகாலத்தை நேரடியாகக் காக்கிறது.
- source_word: φωνῆς
  choice: ஒரு குரல்
  rationale: ἀκούω-வைத் தொடர்ந்து வரும் மரபான வேற்றுமை அமைப்பைத் தமிழில் இயல்பான கேட்புப் பொருளாகத் தருகிறது; தொடர்ந்து வரும் நேரடிப் பேச்சால் ‘குரல்’ என்பதே பொருத்தமானது.
- source_word: λεγούσης μοι
  choice: என்னிடம் ... என்று சொல்வதை
  rationale: குரல் பேசிக்கொண்டிருந்த ஒரேகாலச் செயலும் μοι குறிக்கும் சவுலை நோக்கிய உரையும் இரண்டையும் காக்கிறது.
- source_word: Σαοὺλ Σαούλ
  choice: சவுலே, சவுலே
  rationale: பெயரின் ஒலிபெயர்ப்பையும் நேரடி அழைப்பையும் வலியுறுத்தும் இரட்டிப்பையும் காக்கிறது; தமிழ் விளிவேற்றுமைக்காக ‘-ஏ’ சேர்க்கப்படுகிறது.
- source_word: τί
  choice: ஏன்
  rationale: ஒரு செயலுக்கான காரணத்தைக் கேட்கும் இக்கிரேக்க வழக்கின் இயல்பான தமிழாக்கம்.
- source_word: με
  choice: என்னை
  rationale: பேசுகிறவரைக் குறிக்கும் நேரடி செயப்படுபொருளை எந்த விளக்க விரிவாக்கமும் இன்றிக் காக்கிறது.
- source_word: διώκεις
  choice: துன்புறுத்துகிறாய்
  rationale: இச்சூழலில் பகைமையோடு தொடர்ந்து ஒடுக்குதல் என்ற διώκω-வின் பொருளை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது; நிகழ்கால வடிவம் தொடரும் செயலைக் காக்கிறது.
theological_decisions:
- issue: விசுவாசிகளுக்கு எதிரான சவுலின் செயல்களுக்கும் பேசுகிறவருக்கும் உள்ள உறவு
  choice: ‘என்னை’ என்ற நேரடி முதலாம் நபர் குறிப்பை விளக்க விரிவாக்கமின்றிக் காத்தல்
  alternative: ‘என் மக்களை’ அல்லது ‘என்னைப் பின்பற்றுகிறவர்களை’ என்று விரித்துரைத்தல்
  rationale: சவுல் விசுவாசிகளைத் துன்புறுத்துவதைத் தம்மையே துன்புறுத்துவதாகப் பேசுகிறவர் அடையாளப்படுத்துவதில்தான் வசனத்தின் இறையியல் அழுத்தம் உள்ளது. அந்தப் பதற்றத்தை மொழிபெயர்ப்பு விளக்கி முடிவுசெய்யாமல் அப்படியே காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, மரியாதைமிக்க உரைநடை. நேரடிப் பேச்சின் தீவிரத்தையும் பெயரின் இரட்டிப்பையும் காக்கிறது.
