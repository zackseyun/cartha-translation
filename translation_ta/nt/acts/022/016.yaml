source:
  edition: SBLGNT
  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: ta
  text: இப்போது ஏன் தாமதிக்கிறாய்? எழுந்து, திருமுழுக்குப் பெற்று, அவருடைய பெயரைக் கூப்பிட்டு வேண்டிக்கொண்டு, உன் பாவங்களைக் கழுவிப்போடு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடைய பெயரைக் கூப்பிட்டு வேண்டிக்கொண்டு’ என்பதை ‘அவருடைய பெயரைக் கூப்பிட்டு வேண்டுவதன் மூலம்’ என்றும் புரிந்துகொள்ளலாம். கிரேக்க வினையெச்சம் இச்செயல்களுக்கிடையிலான துல்லியமான தொடர்பை வெளிப்படையாக வரையறுக்கவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: ஏன் தாமதிக்கிறாய்?
  rationale: இங்கு μέλλω வினாவுடன் சேர்ந்து எதிர்கால நோக்கத்தைக் கேட்பதைவிடத் தாமதத்தைக் கண்டிக்கும் சொல்வழக்காக உள்ளது. நவீன தமிழில் இதன் அவசரத் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀναστὰς
  choice: எழுந்து
  rationale: இறந்தகால வினையெச்சம் அடுத்து வரும் கட்டளைகளுடன் இணைந்த துணைச் செயலாக உள்ளது; ‘எழுந்து’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: βάπτισαι
  choice: திருமுழுக்குப் பெற்று
  rationale: நடுநிலை வடிவிலுள்ள கட்டளையை, ஒருவர் திருமுழுக்கு அளிப்பதைப் பெறுதல் என்ற பொருளுடன் இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἀπόλουσαι
  choice: கழுவிப்போடு
  rationale: ἀπολούομαι என்பது கழுவி அகற்றுதல் அல்லது சுத்தப்படுத்துதல் என்னும் பொருள் தருகிறது. ‘பாவங்கள்’ என்ற செயப்படுபொருளோடு ‘கழுவிப்போடு’ நேரடியாகப் பொருந்துகிறது.
- source_word: τὰς ἁμαρτίας σου
  choice: உன் பாவங்களை
  rationale: ἁμαρτία என்பதன் வழக்கமான புதிய ஏற்பாட்டுப் பொருளை விளக்க விரிவாக்கமின்றி நேரடியாகக் காக்கிறது.
- source_word: ἐπικαλεσάμενος
  choice: அழைத்து வேண்டிக்கொண்டு
  rationale: ἐπικαλέομαι இங்கு ஒருவரின் பெயரை அழைத்து உதவி அல்லது இரட்சிப்பை வேண்டுதல் என்னும் கருத்தைக் கொண்டுள்ளது. தமிழ் வாசகருக்கு ‘பெயரை அழைத்தல்’ மட்டும் தெளிவற்றிருக்கக்கூடும் என்பதால் ‘அழைத்து வேண்டுதல்’ இயல்பாகப் பொருளைக் கொடுக்கிறது; வினையெச்ச வடிவம் அதன் தொடர்பைத் திறந்தவாறே வைக்கிறது.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: அவருடைய பெயரை
  rationale: மூலத்தில் வெளிப்படையான பட்டப்பெயருக்குப் பதிலாக αὐτοῦ என்ற பிரதிப்பெயர் இருப்பதால், சூழலிலுள்ள மரியாதையைப் பேணியபடி ‘அவருடைய’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: திருமுழுக்கு, பாவங்களைக் கழுவுதல், அவருடைய பெயரை அழைத்து வேண்டுதல் ஆகியவற்றின் தொடர்பு
  choice: கிரேக்க மொழியின் கட்டளைத் தொடரையும் வினையெச்சத் தொடர்பையும் காத்து, ‘அழைத்து வேண்டிக்கொண்டு’ என்பதைத் தனியே வெளிப்படுத்தாமல் அதே தொடரில் வைத்தல்
  alternative: ‘அவருடைய பெயரை அழைத்து வேண்டுவதன் மூலம் உன் பாவங்களைக் கழுவிப்போடு’ என்று கருவிப் பொருளை வெளிப்படையாகக் கூறுதல்
  rationale: ἐπικαλεσάμενος காலம், உடன்நிகழ்வு அல்லது வழிமுறை சார்ந்த தொடர்பைக் கொள்ளக்கூடும். எந்தச் செயல் பாவமன்னிப்பின் தனிப்பட்ட வழிமுறை என்று மொழிபெயர்ப்பிலேயே முடிவு செய்யாமல், மூலத்தின் இறையியல் பதற்றத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான மற்றும் அவசரமான கட்டளைத் தொனி பேணப்பட்டுள்ளது. இறைவனைச் சுட்டும் பிரதிப்பெயருக்கு மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; பிரிவுசார் திருமுழுக்குக் கோட்பாடு எதுவும் சொற்களில் சேர்க்கப்படவில்லை.
