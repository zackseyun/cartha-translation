source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: ta
  text: “நான் ஒரு யூதன்; சிலிசியாவின் தர்சு நகரத்தில் பிறந்தவன்; இந்த நகரத்தில் கமாலியேலின் காலடியில்[a] வளர்க்கப்பட்டவன்; நம் மூதாதையரின் சட்டத்தின் கண்டிப்பின்படி[b] பயிற்சி பெற்றவன்; இன்று நீங்கள் அனைவரும் இருப்பதைப் போலக் கடவுளுக்காகத் தீவிர ஆர்வம் கொண்டவன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, கமாலியேலிடம் சீடராக இருந்து கல்வி பயின்றார் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “நம் பூர்வீகச் சட்டத்தின் கண்டிப்பின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: ஒரு யூதன்
  rationale: தமிழில் ‘யூதன்’ என்பது இங்கு வயது வந்த யூத ஆணைக் குறிக்கும் இயல்பான சொல்; ‘ஒரு யூத ஆண்’ என்பது தேவையற்ற விதத்தில் இறுக்கமாக ஒலிக்கும்.
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: சிலிசியாவிலுள்ள தர்சு நகரத்தில் பிறந்தேன்
  rationale: பிறந்த இடத்தையும் அதன் மாகாணத்தையும் நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: ஆனால் இந்த நகரத்தில் ... வளர்க்கப்பட்டு
  rationale: பிறந்த இடத்துக்கும் வளர்ந்த இடத்துக்கும் உள்ள δέ குறிக்கும் வேறுபாட்டை ‘ஆனால்’ காட்டுகிறது; ἀνατρέφω இங்கு வளர்ப்பைக் குறிக்கிறது.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: கமாலியேலின் காலடியில்
  rationale: ஆசிரியரிடம் சீடராகக் கல்வி கற்றதைக் குறிக்கும் மூலமொழியின் உயிரோட்டமான மரபுத்தொடரைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் பொருளை விளக்குகிறது.
- source_word: πεπαιδευμένος
  choice: பயிற்றுவிக்கப்பட்டேன்
  rationale: முறையான போதனையையும் உருவாக்கத்தையும் குறிக்கும்; ‘கல்வி கற்றேன்’ என்பதைக் காட்டிலும் அடுத்துவரும் சட்டநெறிப் பயிற்சியுடன் இயல்பாக இணைகிறது.
- source_word: κατὰ ἀκρίβειαν
  choice: மிகத் துல்லியமாகக் கடைப்பிடிக்கும் வகையில்
  rationale: ἀκρίβεια குறிக்கும் நுணுக்கமான துல்லியத்தையும் கண்டிப்பான இணக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῦ πατρῴου νόμου
  choice: நம் மூதாதையரின் திருச்சட்டத்தை
  rationale: πατρῷος குறிக்கும் பூர்வீக மரபையும் பேச்சாளரும் கேட்போரும் பகிர்ந்த அடையாளத்தையும் ‘நம்’ வெளிப்படுத்துகிறது; ‘திருச்சட்டம்’ இங்கு தோராவைக் குறிக்கும் மரியாதையான, புரிந்துகொள்ளத்தக்க சொல்.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: கடவுளுக்காக வைராக்கியமுள்ளவனாய் இருந்தேன்
  rationale: ζηλωτής குறிக்கும் தீவிர ஆர்வத்தையும் அர்ப்பணிப்பையும் தருகிறது; அரசியல் சார்ந்த ‘தீவிரவாதி’ என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: இன்று நீங்கள் அனைவரும் இருப்பதைப் போலவே
  rationale: பவுல் தம்மைத் தம் கேட்போரின் தற்போதைய வைராக்கியத்துடன் ஒப்பிட்டு இணைத்துப் பேசுவதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: πατρῴου νόμου என்பதில் பவுல் தமது யூதக் கேட்போருடன் பகிர்ந்த மரபை எவ்வாறு வெளிப்படுத்துவது
  choice: நம் மூதாதையரின் திருச்சட்டம்
  alternative: மூதாதையருக்குரிய சட்டம்
  rationale: கிரேக்கச் சொல் நேரடியாக ‘பூர்வீகமான/மூதாதையருக்குரிய’ எனப் பொருள்படும். உரையின் பேச்சுச் சூழலில் ‘நம்’ என்பது பவுலின் பகிர்ந்த யூத மரபை இயல்பாக வெளிப்படுத்துகிறது; தனிப்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: παρὰ τοὺς πόδας Γαμαλιήλ என்ற மரபுத்தொடரை நேரடியாக வைத்திருக்க வேண்டுமா
  choice: கமாலியேலின் காலடியில்
  alternative: கமாலியேலிடம் கல்வி கற்று
  rationale: நேரடி உருவகம் வரலாற்றுக் கல்விச் சூழலைத் தக்கவைக்கிறது; அதன் பண்பாட்டு பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: ζηλωτὴς ὑπάρχων என்பதன் காலநிலையைத் தமிழில் வெளிப்படுத்துவது
  choice: வைராக்கியமுள்ளவனாய் இருந்தேன்
  alternative: வைராக்கியமுள்ளவனாய் இருக்கிறேன்
  rationale: முக்கிய வினையான கடந்தகால ‘பயிற்றுவிக்கப்பட்டேன்’ என்பதோடு பங்கேற்புச் சொற்றொடர் இயல்பாக இணைவதால் கடந்தகால வடிவம் தேர்ந்தெடுக்கப்பட்டது. கிரேக்க வடிவம் தனியே காலத்தை நிர்ணயிக்காததால் நிகழ்கால உணர்வும் இலக்கண ரீதியாகச் சாத்தியம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நீண்ட வாக்கிய ஓட்டம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது; பிறப்பிடம், கல்வி, வைராக்கியம் என்ற கருத்து வரிசை மாற்றப்படவில்லை. ‘காலடியில்’ என்ற செமிட்டிய-ரபீனிய கல்வி உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
