id: ACT.22.30
reference: Acts 22:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: ta
  text: மறுநாளில், யூதர்கள்[a] பவுல்மீது என்ன குற்றம் சாட்டுகிறார்கள் என்பதை உறுதியாக அறிய விரும்பிய படைத்தளபதி, அவனைக் கட்டுகளிலிருந்து அவிழ்த்தான். பின்பு, தலைமை ஆசாரியர்களும் நியாயச்சங்கம் முழுவதும்[b] கூடிவருமாறு கட்டளையிட்டான்; பவுலைக் கீழே அழைத்துவந்து அவர்கள் முன் நிறுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘யூதர்கள்’ என்பது வேறுபாடின்றி எல்லா யூத மக்களையும் அல்ல, இந்தச் சூழலில் பவுல்மீது குற்றம் சாட்டியவர்களைக் குறிக்கிறது. ‘யூதத் தலைவர்கள்’ அல்லது ‘யூதேயர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நியாயச்சங்கம்’ என்பது எருசலேமிலிருந்த யூத ஆட்சிமன்றமான சனகெத்ரினைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: மறுநாளில்
  rationale: இந்தக் காலக்குறிப்பு ‘அடுத்த நாளில்’ என்று பொருள்படும். δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைச் சுட்டுவதால், தமிழில் தனியாக ‘ஆனால்’ என்று சேர்க்காமல் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: உறுதியாக அறிய விரும்பிய
  rationale: βουλόμενος நோக்கத்தையோ விருப்பத்தையோ குறிக்கிறது; τὸ ἀσφαλές நம்பத்தகுந்த உறுதியைக் குறிக்கிறது. இரண்டையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: யூதர்கள் பவுல்மீது என்ன குற்றம் சாட்டுகிறார்கள்
  rationale: τί குற்றச்சாட்டின் உள்ளடக்கத்தைத் திறந்தவாறே வைக்கிறது. Ἰουδαίων என்பதற்கு நேரான ‘யூதர்கள்’ என்பதே வைக்கப்பட்டு, சூழலில் அது யாரைக் குறிக்கிறது என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἔλυσεν αὐτόν
  choice: அவனுடைய கட்டுகளை அவிழ்த்தான்
  rationale: λύω என்பது அவிழ்த்தல் அல்லது விடுவித்தல் என்று பொருள்படலாம். முந்தைய சூழலில் பவுல் கட்டப்பட்டிருந்ததால், காவலிலிருந்து முழுமையாக விடுதலை செய்ததாகத் தவறாகப் புரியாதவாறு கட்டுகளை அவிழ்த்த செயல் வெளிப்படையாகத் தரப்பட்டுள்ளது.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: கூடிவருமாறு கட்டளையிட்டான்
  rationale: κελεύω அதிகாரபூர்வமான கட்டளையையும், συνελθεῖν ஒன்றுகூடுவதையும் குறிக்கின்றன.
- source_word: τοὺς ἀρχιερεῖς
  choice: முதன்மைக் குருமார்கள்
  rationale: இது ஒரே பதவியிலிருந்த பல தலைமைக் குருக்களைக் குறிக்காமல், முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் வழக்குச் சொல். ‘முதன்மைக் குருமார்கள்’ அந்த வேறுபாட்டை இயல்பாகப் பேணுகிறது.
- source_word: πᾶν τὸ συνέδριον
  choice: நியாயச்சங்கம் முழுவதும்
  rationale: συνέδριον எருசலேமிலிருந்த யூத ஆட்சிமன்றத்தைக் குறிக்கிறது; πᾶν அதன் முழு அவையையும் வலியுறுத்துகிறது.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: பவுலைக் கீழே அழைத்துவந்து
  rationale: κατά என்ற திசைநுணுக்கத்துடன் கூடிய இயக்கத்தைப் பேணுகிறது; இது கோட்டைப் பகுதியிலிருந்து கூட்டம் நடைபெற்ற இடத்துக்கான நகர்வாக இருக்கலாம்.
- source_word: ἔστησεν εἰς αὐτούς
  choice: அவர்கள் முன் நிறுத்தினான்
  rationale: அதிகாரபூர்வ விசாரணைக்காக ஒருவரை அவையினர் முன்னிலையில் நிறுத்துவதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: அப்போஸ்தலர் நடபடிகளில் Ἰουδαίων என்பதன் மொழிபெயர்ப்பு
  choice: யூதர்கள்
  alternative: யூதத் தலைவர்கள் / யூதேயர்கள்
  rationale: கிரேக்கச் சொல் இன-மதக் குழுவைக் குறிக்கும் பொதுவான வடிவிலேயே உள்ளது. உடனடிச் சூழல் பவுலைக் குற்றம் சாட்டிய குறிப்பிட்டவர்களைக் காட்டினாலும், முதன்மை உரையில் அதை ‘தலைவர்கள்’ என்று சுருக்குவது விளக்கத்தை மொழிபெயர்ப்புக்குள் கொண்டுவரும். ஆகவே சொல் நேரடியாகப் பேணப்பட்டு, அதன் சூழல்சார் வரம்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடைத் தெளிவும் பேணப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியம் தமிழில் வாசிப்பிற்கு ஏற்ற இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘படைத்தளபதி’ என்பது முந்தைய சூழலில் தெளிவாக உள்ள மறைமுக எழுவாயை வாசகருக்காக வெளிப்படுத்துகிறது.
