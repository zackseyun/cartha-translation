id: ACT.22.18
reference: Acts 22:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: ta
  text: '“அவர் என்னிடம் பேசிக்கொண்டிருப்பதைக் கண்டேன்: ‘விரைந்து எருசலேமிலிருந்து உடனே வெளியேறு; ஏனெனில், என்னைப்பற்றிய உன் சாட்சியை அவர்கள் ஏற்றுக்கொள்ள மாட்டார்கள்.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν
  choice: பார்த்தேன்
  rationale: இது இலக்கண வடிவில் இறந்தகால வினையெச்சமாக இருந்தாலும், தரிசனத்தைப் பற்றிய பவுலின் தொடர்ச்சியான விவரிப்பில் இயல்பான தமிழ் வாக்கியத்திற்காக முற்றுவினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: αὐτὸν
  choice: அவர்
  rationale: முந்தைய சூழலில் தரிசனத்தில் காணப்பட்ட ஆண்டவரைக் குறிக்கும் பிரதிப்பெயர். மூலத்தில் உள்ள பிரதிப்பெயரை விளக்கப் பெயரால் மாற்றாமல் வைத்திருக்கிறது.
- source_word: λέγοντά μοι
  choice: என்னிடம் சொல்வதை
  rationale: αὐτόν என்பதுடன் தொடர்புடைய வினையெச்சக் கட்டமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: Σπεῦσον
  choice: விரைந்து
  rationale: அவசரத்தை வெளிப்படுத்தும் கட்டளையின் வலிமையை நவீன, இயல்பான தமிழில் தருகிறது.
- source_word: ἔξελθε
  choice: வெளியேறு
  rationale: நகரத்திலிருந்து வெளியே செல்லும்படியான நேரடிக் கட்டளையைத் தெளிவாகத் தருகிறது.
- source_word: ἐν τάχει
  choice: சீக்கிரமாக
  rationale: Σπεῦσον உடன் சேர்ந்து மூலத்தில் வலியுறுத்தப்படும் இரட்டிப்பு அவசரத்தையும் காக்கிறது.
- source_word: ἐξ Ἰερουσαλήμ
  choice: எருசலேமைவிட்டு
  rationale: நகரின் உள்ளிருந்து வெளியேறும் இயக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: διότι
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: οὐ παραδέξονταί
  choice: ஏற்றுக்கொள்ள மாட்டார்கள்
  rationale: παραδέχομαι இங்கு சாட்சியைச் சாதகமாக ஏற்றுக்கொள்வதைக் குறிக்கிறது; இந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: σου μαρτυρίαν
  choice: உன் சாட்சியை
  rationale: μαρτυρία என்பதன் சான்றுரைத்தல் மற்றும் அறிவித்தல் சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: περὶ ἐμοῦ
  choice: என்னைப்பற்றிய
  rationale: περί உடன் வரும் தொடர்புப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தரிசனத்தில் ‘அவர்’ என்பதன் குறிப்பு
  choice: மூலத்தில் உள்ளபடி ‘அவர்’ என்ற பிரதிப்பெயரை வைத்தல்
  alternative: ‘ஆண்டவர்’ அல்லது ‘இயேசு’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: உடனடி சூழல் பேசுபவரை அடையாளப்படுத்தினாலும், இந்த வசனத்தின் கிரேக்க உரை பிரதிப்பெயரையே பயன்படுத்துகிறது. மூலத்தில் இல்லாத விளக்கப் பெயரைச் சேர்க்காமல் சூழலின் தெளிவையும் மூலத்தின் வடிவத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘விரைந்து’ மற்றும் ‘சீக்கிரமாக’ என்பவை கிரேக்கத்தில் உள்ள இரட்டிப்பு அவசரத்தைத் தக்கவைக்கின்றன. ஆங்கில ஆலோசனை உரையில் உள்ள அடிக்குறிப்பு, ‘accept/receive’ என்ற ஆங்கிலச் சொல் தேர்வுக்குரியது; தமிழில் ‘ஏற்றுக்கொள்ள’ இரு நுண்பொருள்களையும் இயல்பாக உள்ளடக்குவதால் தனி அடிக்குறிப்பு தேவையில்லை.
