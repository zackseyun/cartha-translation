  text: Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατέ μου τῆς πρὸς ὑμᾶς νυνὶ ἀπολογίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: ta
  text: “ஆண்களே, சகோதரர்களே, தந்தையரே, உங்களிடம் நான் இப்போது கூறும் என் தற்காப்புரையைக் கேளுங்கள்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοὶ
  choice: சகோதரர்களே
  rationale: தமிழில் ‘ஆண்களே, சகோதரர்களே’ என்பது இயல்பற்ற இரட்டிப்பு. ஆண் கேட்போரை நோக்கிய மரியாதையான அழைப்பை ‘சகோதரர்களே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πατέρες
  choice: தந்தையரே
  rationale: வயதிலும் மதிப்பிலும் உயர்ந்த ஆண்களை மரியாதையுடன் அழைக்கும் மூல உருவகத்தைப் பாதுகாக்கிறது; ‘மூப்பர்களே’ என மொழிபெயர்த்து முறையான பதவியைக் குறிக்கும் பொருளைச் சேர்க்கவில்லை.
- source_word: ἀκούσατέ
  choice: கேளுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தையும் பொதுமக்கள் முன்னிலையிலான மரியாதையான தொனியையும் இயல்பான தமிழில் தருகிறது.
- source_word: νυνὶ
  choice: இப்போது
  rationale: பவுலின் உடனடியான வேண்டுகோளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀπολογίας
  choice: தற்காப்பு விளக்கம்
  rationale: இங்கு மன்னிப்புக் கோருதல் அல்ல, குற்றச்சாட்டுகளுக்குப் பதிலாக அளிக்கப்படும் காரணமுள்ள தற்காப்புரை என்பதைக் குழப்பமின்றி தெரிவிக்கிறது.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம் நான் அளிக்கும்
  rationale: தற்காப்பு விளக்கம் கேட்போரை நோக்கி அளிக்கப்படுகிறது என்ற தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions: []
