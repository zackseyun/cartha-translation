  register: நவீன நிலையான தமிழில், பொதுமக்கள் முன் ஆற்றப்படும் மரியாதையான உரையின் கண்ணியமான தொனி பேணப்பட்டுள்ளது. ‘Ἄνδρες’ என்பதற்குத் தனியான ‘ஆண்களே’ சேர்ப்பது தமிழில் செயற்கையானதாக இருப்பதால், ‘Ἄνδρες ἀδελφοὶ’ என்ற கூட்டு அழைப்பு ‘சகோதரர்களே’ என இயல்பாக்கப்பட்டுள்ளது.
