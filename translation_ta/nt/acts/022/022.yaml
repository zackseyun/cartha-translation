  source_fidelity: முதல் வாக்கியத்தில் உள்ள “இந்தக் கூற்றைச் சொல்லும்வரை” என்பது கிரேக்கத்தின் ἄχρι τούτου τοῦ λόγου என்பதைக் ‘அவன் இந்தக் கூற்றைச் சொல்லும் வரையில்’ என மாற்றுகிறது. மூலத்தில், பவுலின் பேச்சில் இந்தக் குறிப்பிட்ட கூற்று வரையில் கூட்டம் கேட்டுக்கொண்டிருந்தது என்பதே கருத்து. “இந்தக் கூற்று வரையில்” அந்தப் பொருளைத் துல்லியமாகக் காக்கிறது. மற்ற பகுதிகள் ἐπῆραν τὴν φωνὴν αὐτῶν, Αἶρε ... ἀπὸ τῆς γῆς, மற்றும் οὐ ... καθῆκεν ... ζῆν ஆகியவற்றின் வலிமையையும் நுணுக்கத்தையும் நன்றாக வெளிப்படுத்துகின்றன.
