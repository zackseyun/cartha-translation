  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: ta
  text: இந்தக் கூற்று வரையில் அவர்கள் அவனுக்குச் செவிகொடுத்துக்கொண்டிருந்தார்கள். பின்பு அவர்கள் உரத்த குரலில், “இப்படிப்பட்டவனைப் பூமியிலிருந்து அகற்றுங்கள்![a] இவன் உயிரோடிருப்பது தகாது”[b] என்று கூச்சலிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “இப்படிப்பட்டவன் பூமியில் இருக்கவே கூடாது!” இது அவனைக் கொல்ல வேண்டும் என்ற கோரிக்கை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இவன் உயிர்வாழக் கூடாது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: செவிகொடுத்துக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலையை உணர்த்தும் imperfect வினைவடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: இந்தக் கூற்றைச் சொல்லும்வரை
  rationale: λόγος இங்கு தனி வார்த்தையைக் குறிக்காமல் பவுலின் பேச்சிலுள்ள குறிப்பிட்ட கூற்றைக் குறிக்கிறது; அந்தக் கூற்றை அவர்கள் கேட்டதுவரை என்ற பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: உரத்த குரலில் ... கூச்சலிட்டார்கள்
  rationale: குரலை உயர்த்துதல் என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் அளிக்கிறது.
- source_word: Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον
  choice: இப்படிப்பட்டவனைப் பூமியிலிருந்து அகற்றுங்கள்
  rationale: பகைமையோடு கூறப்பட்ட அகற்றும் கட்டளையையும், γῆ என்பதன் ‘பூமி’ என்ற வலிமையான உருவகத்தையும் காக்கிறது.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: இவன் உயிரோடிருப்பது தகாது
  rationale: καθῆκεν என்பதிலுள்ள ‘தகுந்தது/முறையானது’ என்ற அடிப்படைப் பொருளைக் காத்து, தமிழில் இயல்பாகவும் கூட்டத்தின் மரணக் கோரிக்கையை மறைக்காமலும் வழங்குகிறது.
