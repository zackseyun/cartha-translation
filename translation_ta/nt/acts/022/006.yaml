  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: ta
  text: நான் பயணம் செய்துகொண்டு தமஸ்குவை நெருங்கிக்கொண்டிருந்தபோது, ஏறக்குறைய நண்பகல் வேளையில், திடீரென்று வானத்திலிருந்து மிகப் பிரகாசமான ஒளி ஒன்று[a] என்னைச் சுற்றிலும் பளிச்சென்று ஒளிவீசியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேரொளி ஒன்று.’ கிரேக்கச் சொற்றொடர் ஒளியின் பெருமையையோ அதன் தீவிரத்தையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: நான் … இருந்தபோது
  rationale: கிரேக்க மொழியின் நிகழ்வை அறிமுகப்படுத்தும் கட்டமைப்பைத் தமிழில் சொற்சொல்லாக மொழிபெயர்த்தால் இயல்பற்றதாக இருக்கும். முதல் நபர் அனுபவத்தையும் நிகழ்வின் தொடக்கத்தையும் தொடர்ச்சியான தமிழ்க் காலவாக்கியத்தில் இயல்பாக வெளிப்படுத்துகிறது; δέ-யின் மெலிந்த இணைப்புப் பொருள் சூழலால் உணரப்படுகிறது.
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: பயணம் செய்து தமஸ்குவை நெருங்கிக்கொண்டிருந்தபோது
  rationale: இரண்டு நிகழ்காலப் பெயரெச்சங்களின் தொடர்ச்சியான செயற்பாட்டையும், தமஸ்குவை அணுகிக்கொண்டிருந்த நிலையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: περὶ μεσημβρίαν
  choice: ஏறக்குறைய நண்பகல் வேளையில்
  rationale: περί குறிக்கும் தோராயமான நேரத்தையும் μεσημβρία குறிக்கும் நண்பகலையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐξαίφνης
  choice: திடீரென்று
  rationale: நிகழ்வின் எதிர்பாராத, உடனடியான தன்மையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: οὐρανός என்பதன் மேலுலக அல்லது தெய்வீக மூலத்தைக் குறிக்கக்கூடிய பொருளைத் திறந்தவாறு வைத்திருக்கிறது; வெறும் வளிமண்டல வானம் என்று சுருக்குவதில்லை.
- source_word: φῶς ἱκανὸν
  choice: மிகப் பிரகாசமான ஒளி ஒன்று
  rationale: ἱκανός இங்கு ஒளியின் குறிப்பிடத்தக்க அளவு அல்லது தீவிரத்தைச் சுட்டுகிறது. இத்தேர்வு நவீனத் தமிழில் இயல்பாகத் தீவிரத்தை வெளிப்படுத்துகிறது; ‘பேரொளி’ என்ற அளவு சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: περιαστράψαι … περὶ ἐμέ
  choice: என்னைச் சுற்றிலும் பளிச்சென்று ஒளிவீசியது
  rationale: சுற்றிலும் ஒளி மின்னியதைச் சொல்லும் கூட்டுவினையின் இடஞ்சார்ந்த பொருளையும், திடீர் ஒளிப்பாய்ச்சலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐκ τοῦ οὐρανοῦ என்பதில் οὐρανός
  choice: வானத்திலிருந்து
  alternative: ஆகாயத்திலிருந்து
  rationale: அப்போஸ்தலர் நடபடிகளின் வெளிப்பாட்டு நிகழ்வு என்ற சூழலில், ‘வானம்’ என்பது மேலிருந்து வந்த மூலத்தையும் சாத்தியமான தெய்வீக நுணுக்கத்தையும் பாதுகாக்கிறது; ‘ஆகாயம்’ என்பது நிகழ்வை வெறும் வளிமண்டலச் சம்பவமாகப் புரிந்துகொள்ளச் செய்யக்கூடும்.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையைக் கொண்டுள்ளது. ‘நெருங்கிக்கொண்டிருந்தபோது’ தொடர்ச்சியான பயணநிலையைத் தெளிவாக்குகிறது; ‘பளிச்சென்று ஒளிவீசியது’ திடீர்மையையும் சுற்றியொளிர்தலையும் இயல்பாகச் சொல்கிறது.
