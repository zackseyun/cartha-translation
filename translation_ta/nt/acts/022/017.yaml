source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: ta
  text: 'பின்பு, எனக்கு இவ்வாறு நிகழ்ந்தது: நான் எருசலேமுக்குத் திரும்பிவந்து, ஆலயத்தில்[a] வேண்டிக்கொண்டிருந்தபோது, பரவச நிலைக்கு வந்தேன்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆலயம்’ என்பதற்கான கிரேக்கச் சொல், உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘மெய்மறந்த நிலையில் இருந்தேன்.’ கிரேக்கச் சொற்றொடர், ஒரு பரவசமான அல்லது மாற்றமடைந்த உணர்வுநிலைக்குள் வருவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: பின்பு, … உள்ளானேன்
  rationale: இந்தக் கிரேக்க நிகழ்வுரை பவுலின் அனுபவத்தில் அடுத்து நிகழ்ந்ததை அறிமுகப்படுத்துகிறது. சொற்சொல்லான, தமிழில் இயல்பற்ற அமைப்பைத் தவிர்த்து, ‘பின்பு’ என்ற தொடர்ச்சிச் சொல்லாலும் முதல் நபர் வினையாலும் அதன் கருத்து வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλὴμ
  choice: நான் எருசலேமுக்குத் திரும்பிவந்து
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மை நிகழ்வுக்கு முன்பு நடந்த திரும்புதலைக் குறிக்கிறது. ‘திரும்பிவந்து’ என்பது அந்தக் கால வரிசையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: καὶ προσευχομένου μου
  choice: வேண்டிக்கொண்டிருந்தபோது
  rationale: இது முதன்மை நிகழ்வுடன் ஒரே நேரத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கிறது. ‘வேண்டிக்கொண்டிருந்தபோது’ அந்த நீடித்த செயலையும் காலத் தொடர்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கிறது. வாசிப்புக்கு இயல்பான ‘ஆலயம்’ முதன்மை உரையில் வைக்கப்பட்டு, துல்லியமான வரம்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: மெய்மறந்த நிலைக்கு உள்ளானேன்
  rationale: இந்தச் சொற்றொடர் வழக்கமான விழிப்புணர்விலிருந்து வேறுபட்ட ஒரு நிலைக்குள் சென்றதைக் குறிக்கிறது. ‘மெய்மறந்த நிலை’ என்பது உணர்ச்சிப் பரவசத்தை மட்டும் சுட்டாமல், தமிழில் புரியக்கூடிய வகையில் அந்த மாற்றமடைந்த நிலையை எடுத்துரைக்கிறது.
theological_decisions:
- issue: ἐκστάσει எனப்படும் பவுலின் அனுபவத்தின் இயல்பு
  choice: மெய்மறந்த நிலைக்கு உள்ளானேன்
  alternative: பரவசநிலையில் இருந்தேன்
  rationale: இவ்வசனம் ஜெபத்தின்போது பவுல் ஒரு மாற்றமடைந்த உணர்வுநிலைக்கு வந்ததாகக் கூறுகிறது; அந்த அனுபவத்தின் உளவியல் செயல்முறையையோ அதன் முழுத் தெய்வியல் இயல்பையோ வரையறுக்கவில்லை. ஆகவே உரை கூறுவதைத் தாண்டிய விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பங்கேற்புவினைகளின் காலத் தொடர்பு இயல்பான தமிழ்த் தொடரால் தரப்பட்டுள்ளது; அனுபவத்தின் இயல்பு தேவையின்றி விரிவுபடுத்தப்படவில்லை.
