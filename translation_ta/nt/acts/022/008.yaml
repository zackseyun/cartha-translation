id: ACT.22.8
reference: Acts 22:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: ta
  text: அதற்கு நான், “ஆண்டவரே,[a] நீர் யார்?” என்று பதிலளித்தேன். அவர் என்னிடம், “நீ துன்புறுத்துகிற நாசரேயனாகிய[b] இயேசு நானே” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” κύριε என்ற கிரேக்கச் சொல் ‘ஆண்டவர்’ என்ற பட்டப்பெயராகவும் மரியாதையான விளிப்பாகவும் பயன்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நாசரேத்தைச் சேர்ந்த இயேசு”; இன்னொரு வடிவில், “நாசரியன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: பதிலளித்தேன்
  rationale: ἀποκρίνομαι என்பதன் இறந்தகால வடிவம் இங்கு நேரடியாக ‘பதிலளித்தேன்’ எனப் பொருள்படுகிறது; கேள்வி வடிவிலான பதிலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Τίς εἶ
  choice: நீர் யார்?
  rationale: கேள்விப்பெயரும் வினையும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன. மரியாதை விளிப்புடன் பொருந்துமாறு ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: κύριε என்பதற்கான வழக்கமான இறையியல் பட்டப்பெயர் ‘ஆண்டவரே.’ சவுல் அப்போது பேசுகிறவரின் அடையாளத்தை முழுமையாக அறிந்திருந்தாரா என்பது தெளிவாகாததால், மரியாதை விளிப்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: அவர் என்னிடம் … என்றார்
  rationale: λέγω + πρὸς ἐμέ என்ற கிரேக்கச் சொற்றொடரின் இயல்பான தமிழ் வடிவம் இது; τε-யின் இணைப்புத் தன்மை அடுத்த வாக்கியத் தொடரால் வெளிப்படுகிறது.
- source_word: Ἐγώ εἰμι
  choice: … இயேசு நானே
  rationale: தமிழில் இயல்பான சுய அடையாளப்படுத்தும் வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘நானே’ என்பது ἐγώ என்பதன் வெளிப்படையான வலியுறுத்தலைக் காக்கிறது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தனிப்பெயரின் நிலைபெற்ற தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ Ναζωραῖος
  choice: நாசரேயனாகிய
  rationale: பெயருடன் வரும் கிரேக்க அடைமொழியின் வடிவத்தைப் பாதுகாக்கும் நிலைபெற்ற தமிழ் சொல் இது. இடத்தொடர்பை வெளிப்படையாகக் கூறும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὃν σὺ διώκεις
  choice: நீ துன்புறுத்துகிற
  rationale: διώκω இச்சூழலில் வெறுமனே பின்தொடர்வதை அல்ல, பகைமையுடன் துன்புறுத்துவதை குறிக்கிறது. நிகழ்காலத்தின் தொடர்ச்சியான செயற்பொருளும் தமிழில் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: சவுலின் விளிப்பில் κύριε என்பதன் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: ‘ஆண்டவர்’ என்பது κύριος என்பதற்கான வழக்கமான முதன்மை மொழிபெயர்ப்பு. ஆனால் பேசுகிறவர் யார் என்பதைச் சவுல் இன்னும் கேட்பதால், இது வெறும் மரியாதை விளிப்பாகவும் இருக்கக்கூடும். அந்தத் தெளிவின்மையைத் தீர்த்துவிடாமல் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்’ மரியாதை ஒருமையையும், ‘நீ’ இயேசுவின் நேரடியான குற்றச்சாட்டையும் இயல்பாக வேறுபடுத்துகிறது. மூலத்தின் சொல் வரிசையைத் தமிழின் இயல்புக்கேற்ப மாற்றியபோதும், சுய அடையாளப்படுத்தலின் வலியுறுத்தலும் κύριε-யின் பொருள் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
