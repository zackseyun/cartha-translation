source:
  edition: SBLGNT
  text: ⸀κραυγαζόντων ⸀τε αὐτῶν καὶ ῥιπτούντων τὰ ἱμάτια καὶ κονιορτὸν βαλλόντων εἰς τὸν ἀέρα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/023.yaml
  text: And as they were shouting and throwing off their cloaks and flinging dust into the air,[a]
translation:
  language: ta
  text: அவர்கள் கூச்சலிட்டுக்கொண்டும், தங்கள் மேலாடைகளை வீசிக்கொண்டும், புழுதியைக் காற்றில் வீசிக்கொண்டும் இருந்தபோது,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் ஆடைகளைக் கழற்றி எறிந்துகொண்டும்” அல்லது “தங்கள் ஆடைகளை ஆவேசமாக வீசிக்கொண்டும்.” கிரேக்கச் சொல், ஆடைகளைத் தூர எறிவதையோ அல்லது ஆவேசத்தில் அவற்றை வீசுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγαζόντων
  choice: கூச்சலிட்டுக்கொண்டும்
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சம் கூட்டத்தாரின் தொடர்ந்து நடந்த உரத்த கூக்குரலைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τε
  choice: -உம்
  rationale: முதல் செயலையும் தொடர்ந்து வரும் ஒருங்கிணைந்த செயல்களையும் இணைக்கும் கிரேக்க இடைச்சொல்லின் பொருளைத் தமிழின் இணைப்பும்மை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτῶν
  choice: அவர்கள் / தங்கள்
  rationale: மூலத்தில் வேற்றுமைத் தொகையாக இருந்தாலும், தமிழில் வாக்கியம் இயல்பாக அமைய செய்பவரை ‘அவர்கள்’ என்றும் உடைமையை ‘தங்கள்’ என்றும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: ῥιπτούντων
  choice: வீசியெறிந்துகொண்டும்
  rationale: ῥιπτέω என்பது வீசுதல் அல்லது எறிதல் எனப் பொருள்படும். உடைகளைத் தம்மிடமிருந்து எறிந்ததையோ கிளர்ச்சியுடன் வீசியதையோ தீர்மானிக்காமல், இரண்டிற்கும் இடமளிக்கிறது.
- source_word: τὰ ἱμάτια
  choice: மேலாடைகளை
  rationale: ἱμάτια பொதுவாக வெளிப்புற ஆடைகளைக் குறிக்கிறது. ‘மேலாடைகள்’ என்பது ‘உடைகள்’ என்பதைக் காட்டிலும் குறிப்பானதும், ‘அங்கிகள்’ என்பதைக் காட்டிலும் இன்றைய வாசகருக்கு இயல்பானதும் ஆகும்.
- source_word: κονιορτόν
  choice: புழுதியை
  rationale: κονιορτός என்பதன் நேரடியான பொருள் தூசி அல்லது புழுதி. இச்சூழலில் ‘புழுதி’ இயல்பான காட்சிப்படுத்தலை வழங்குகிறது.
- source_word: βαλλόντων
  choice: வாரியிறைத்துக்கொண்டும்
  rationale: βάλλω என்பது வீசுதல் அல்லது எறிதல். இங்கு புழுதியை மேல்நோக்கி ஆவேசமாக வீசும் செயலை இயல்பான தமிழில் காட்டுவதோடு, முந்தைய ῥιπτούντων என்பதன் மொழிபெயர்ப்பை அப்படியே மீண்டும் கூறுவதைத் தவிர்க்கிறது.
- source_word: εἰς τὸν ἀέρα
  choice: காற்றில்
  rationale: ‘காற்றிற்குள்’ என்ற சொற்சொல் வடிவைவிட, புழுதியை மேலே வீசும் செயலை ‘காற்றில்’ என்பது இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
