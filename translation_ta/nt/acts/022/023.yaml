- from: அவர்கள் கூச்சலிட்டுக்கொண்டும், தங்கள் மேலாடைகளை வீசியெறிந்துகொண்டும், புழுதியை காற்றில் வாரியிறைத்துக்கொண்டும் இருந்தபோது,[a]
  to: அவர்கள் கூச்சலிட்டுக்கொண்டும், தங்கள் மேலாடைகளை வீசிக்கொண்டும், புழுதியைக் காற்றில் வீசிக்கொண்டும் இருந்தபோது,[a]
  rationale: The revision maintains the coordinated ongoing actions and the verse’s syntactic dependence on what follows. It removes unnecessary narrowing in the rendering of ῥιπτούντων and uses a direct, modern Tamil equivalent for casting dust into the air. The footnote explicitly preserves the lexical ambiguity reflected in the source and English audit trail.
