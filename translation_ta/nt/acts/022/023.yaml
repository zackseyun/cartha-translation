translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமும் காட்சித் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று நிகழ்கால வினையெச்சங்களின் ஒரேநேரத் தொடர்ச்சியை ‘-க்கொண்டும்’ என்ற இணையான அமைப்பு காக்கிறது. வசனம் அடுத்த வாக்கியத்துடன் இலக்கண ரீதியாகத் தொடர்வதால் இறுதியில் ‘இருந்தபோது’ பயன்படுத்தப்பட்டுள்ளது.
