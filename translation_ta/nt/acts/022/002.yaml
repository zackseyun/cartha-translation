source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: ta
  text: 'ஆனால், அவர் அவர்களிடம் எபிரெய மொழியில்[a] பேசிக்கொண்டிருப்பதைக் கேட்டபோது, அவர்கள் இன்னும் அதிகமாக அமைதியாக இருந்தார்கள். அப்போது அவர் சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரமேய மொழியில்” என இருக்கலாம்; கிரேக்க உரை “எபிரெய மொழியில்” என்கிறது. இச்சூழலில் அது யூதேயாவில் வழக்கிலிருந்த உள்ளூர் செமித்திய பேச்சுமொழியைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது. δὲ குறிக்கும் மென்மையான தொடர்ச்சி/திருப்பம் தனியாக இணைப்புச்சொல் சேர்க்காமலேயே சூழலில் தெளிவாகிறது.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: எபிரெய மொழியில்
  rationale: கிரேக்கச் சொற்றொடர் நேரடியாக ‘எபிரெய மொழி/பேச்சுவழக்கு’ என்கிறது; ஆகவே மூலமொழிக்கு முன்னுரிமை கொடுத்து முதன்மை உரையில் ‘எபிரெய’ தக்கவைக்கப்படுகிறது.
- source_word: προσεφώνει αὐτοῖς
  choice: தங்களிடம் ... பேசுவதை
  rationale: அவர்களை நோக்கித் தொடர்ந்து உரையாற்றியதை இயல்பான, மரியாதையான தமிழில் தெரிவிக்கிறது; முற்றுப்பெறாத வினையின் தொடர்நிலையும் காக்கப்படுகிறது.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: அவர்கள் இன்னும் அமைதியானார்கள்
  rationale: ‘மேலும் அமைதியை அளித்தார்கள்’ என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில், μᾶλλον என்பதன் ஒப்பீட்டு வலிமையுடன் வழங்குகிறது.
- source_word: καὶ φησίν
  choice: 'அப்போது அவர் சொன்னது:'
  rationale: வரலாற்று நிகழ்காலத்தை தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலத்தில் தருகிறது; அடுத்துவரும் உரையை இரட்டைப்புள்ளி அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: ‘எபிரெய மொழி’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘எபிரெய மொழி’ என்பதைத் தக்கவைத்தல்
  alternative: இதை யூதேயாவில் வழக்கிலிருந்த அரமேய மொழியைக் குறிப்பதாகப் புரிந்துகொள்ளுதல்
  rationale: கிரேக்க உரை வெளிப்படையாக ‘எபிரெய’ என்கிறது. அது இச்சூழலில் அரமேய மொழியைக் குறிக்கக்கூடும் என்ற வரலாற்று-மொழியியல் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது; முதன்மை உரை அந்தத் தெளிவின்மையைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எபிரெய’ என்ற மூலச்சொல் முதன்மை உரையில் காக்கப்பட்டு, ‘அரமேய’ என்ற சாத்தியம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
