  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: ta
  text: ஏனெனில், நீ கண்டதையும் கேட்டதையும் குறித்து எல்லா மக்களுக்கும் அவருக்காகச் சாட்சியாக இருப்பாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருக்குச் சாட்சியாக’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க தத்துவேற்றுமையை நெருங்கிய தொடர்புடைய இந்த இரு விதங்களிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இங்கு பவுலுக்குக் கொடுக்கப்பட்ட கட்டளைக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘ஏனெனில்’ அதன் காரணவிளக்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔσῃ
  choice: இருப்பாய்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தை நவீனத் தமிழில் நேரான எதிர்காலமாகத் தருகிறது.
- source_word: μάρτυς
  choice: சாட்சியாக
  rationale: ஒருவர் கண்டதையும் கேட்டதையும் பிறரிடம் உறுதிப்படுத்திச் சொல்பவரைக் குறிக்கும் சொல்லின் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: αὐτῷ
  choice: அவருக்காக
  rationale: யாரைக் குறித்து அல்லது யாரின் சார்பாகச் சாட்சி கூறப்படுகிறதோ அவரைக் குறிக்கும் தத்துவை இயல்பான தமிழில் தருகிறது; கிரேக்கத்தில் உள்ள நெருங்கிய மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: எல்லா மக்களுக்கும்
  rationale: πρός சாட்சி சென்றடையும் மக்களைச் சுட்டுகிறது. ἀνθρώπους இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களை பொதுவாகக் குறிப்பதால் ‘மக்கள்’ பொருத்தமானது.
- source_word: ὧν
  choice: குறித்து
  rationale: கண்டதும் கேட்டதும் சாட்சியின் உள்ளடக்கம் என்பதைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: ἑώρακας
  choice: நீ கண்டதையும்
  rationale: முன்பு நேரடியாகக் கண்ட அனுபவம் தற்போதைய சாட்சிக்கு அடிப்படையாக இருப்பதைத் தருகிறது.
- source_word: καὶ ἤκουσας
  choice: கேட்டதையும்
  rationale: கண்டதும் கேட்டதும் ஆகிய இணையான அனுபவங்களை இயல்பான தமிழ் இணைப்பில் வழங்குகிறது.
theological_decisions:
- issue: பவுலின் பணியளிப்பில் αὐτῷ குறிக்கும் உறவு
  choice: ஆண்டவர்/இயேசுவுக்காகப் பவுல் சாட்சி கூறுவார் என்ற பொருளில் ‘அவருக்காக’
  alternative: ‘அவருக்குச் சாட்சியாக’ என்று நெருக்கமாக மொழிபெயர்க்கலாம்.
  rationale: உடனடிச் சூழலில் உயிர்த்தெழுந்த இயேசுவைப் பற்றிய பணியளிப்பை அனனியா எடுத்துரைக்கிறார். ‘அவருக்காக’ என்பது பவுல் அவரின் சார்பாக அல்லது அவரைக் குறித்து பிறர்முன் சாட்சி கூறுவதை வெளிப்படுத்துகிறது; கிரேக்கத் தத்துவின் நெருங்கிய மாற்றுப் பொருள் அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள்’ என்பது பாலின வரம்பின்றி மனிதர்களைப் பொதுவாகக் குறிக்கிறது; எனவே தனி அடிக்குறிப்பு தேவையில்லை.
