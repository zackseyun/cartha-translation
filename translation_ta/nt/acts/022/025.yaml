source:
  edition: SBLGNT
  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: ta
  text: ஆனால் அவரை வார்களால் நீட்டிக் கட்டியபோது, அருகே நின்ற நூற்றுவர் தலைவனிடம் பவுல், “குற்றவாளி என்று தீர்ப்பளிக்கப்படாத ஒரு ரோமக் குடிமகனை[a] சாட்டையால் அடிக்க உங்களுக்குச் சட்டப்படி அனுமதி உண்டா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல், “ஒரு ரோம மனிதனை.” இந்தச் சட்டச் சூழலில் அது ரோமக் குடியுரிமை பெற்றவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέτειναν ... τοῖς ἱμᾶσιν
  choice: வார்களால் நீட்டிக் கட்டியபோது
  rationale: προτείνω இங்கு சாட்டையடிக்கத் தயாராகப் பவுலை நீட்டிக் கட்டுவதையும், ἱμᾶσιν தோல் வார்களையும் குறிக்கிறது. இந்தத் தமிழாக்கம் உடல் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἑστῶτα
  choice: அருகே நின்ற
  rationale: அந்த நூற்றுவர் தலைவன் அங்கு அருகில் நின்றிருந்த காட்சியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἑκατόνταρχον
  choice: நூற்றுவர் தலைவன்
  rationale: ரோமப் படையின் இந்தப் பதவிக்குப் பயன்படும் துல்லியமான, மரபாக அறியப்பட்ட தமிழ்ச் சொற்றொடர்.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: ஒரு ரோமக் குடிமகனை
  rationale: கிரேக்கத்தில் சொல்லுக்குச் சொல் ‘ஒரு ரோம மனிதனை’ என்றிருந்தாலும், இச்சட்டச் சூழலில் பாதுகாக்கப்பட்ட ரோமக் குடியுரிமைதான் வலியுறுத்தப்படுகிறது. ‘ரோமக் குடிமகன்’ என்பது தமிழில் இயல்பாகவும் சட்டப் பொருளில் துல்லியமாகவும் உள்ளது; நேரடிச் சொல்வடிவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀκατάκριτον
  choice: குற்றவாளி என்று தீர்ப்பளிக்கப்படாத
  rationale: நீதிமன்றத் தீர்ப்பின் மூலம் குற்றவாளியாக அறிவிக்கப்படாத நிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔξεστιν
  choice: உங்களுக்குச் சட்டப்படி அனுமதி உண்டா?
  rationale: செயல் சட்டரீதியாக அனுமதிக்கப்பட்டதா என்ற பவுலின் கேள்வியைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: μαστίζειν
  choice: சாட்டையால் அடிக்க
  rationale: கடுமையாகச் சாட்டையடிப்பதைக் குறிக்கும் சொல்லின் வலிமையை, இன்றைய வாசகர்களுக்குப் புரியும் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἄνθρωπον Ῥωμαῖον என்பதிலுள்ள சொல்லாட்சிக்கும் அதன் சட்டப் பொருளுக்கும் இடையிலான வேறுபாடு
  choice: முதன்மை உரையில் ‘ரோமக் குடிமகன்’
  alternative: ‘ரோம மனிதன்’ அல்லது ‘ரோமன்’
  rationale: பவுலின் வாதத்தின் அடிப்படை அவரது ரோமக் குடியுரிமையும் அதனுடன் இணைந்த சட்டப் பாதுகாப்புமே. இருப்பினும், மூலத்தின் நேரடிச் சொல்லாட்சியை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது; இதனால் பொருளும் மூலவடிவமும் இரண்டும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டச் சூழலின் தீவிரத்தையும் கதையின் உடனடித் தன்மையையும் காக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நூற்றுவர் தலைவன்’ வரலாற்றுப் பதவியைத் துல்லியமாகக் குறிக்கிறது; வினா இயல்பான நேரடிப் பேச்சாக அமைக்கப்பட்டுள்ளது.
