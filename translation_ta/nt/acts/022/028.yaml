translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரையாடல் நடை. சட்டப்பூர்வமான ரோமக் குடியுரிமை தெளிவாக்கப்பட்டுள்ளது; மூலத்தில் மறைந்துள்ள பொருள் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
