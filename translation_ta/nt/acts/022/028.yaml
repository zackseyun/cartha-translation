id: ACT.22.28
reference: Acts 22:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: ta
  text: அதற்கு அந்தப் படைத்தலைவர், “நான் பெருந்தொகை கொடுத்து இந்தக் குடியுரிமையைப் பெற்றேன்” என்றார். பவுலோ, “நான் குடியுரிமையுடன் பிறந்தவன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: ஆயிரத்தலைவர்
  rationale: ரோமப் படையில் ஏறத்தாழ ஆயிரம் வீரர்களுக்குப் பொறுப்பான அதிகாரியைக் குறிக்கும் வரலாற்றுச் சொல்லுக்கு மரபிலும் புரிதலிலும் ஏற்ற சுருக்கமான பதம்.
- source_word: πολλοῦ κεφαλαίου
  choice: பெருந்தொகை கொடுத்து
  rationale: பெருமளவு பணம் செலுத்தியதைக் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: πολιτείαν
  choice: குடியுரிமை
  rationale: இச்சூழலில் அரசியல் வாழ்க்கையை அல்ல, ரோமக் குடிமகன் என்ற சட்டப்பூர்வ நிலையைக் குறிக்கிறது.
- source_word: ἐκτησάμην
  choice: பெற்றேன்
  rationale: தனக்காகப் பெற்றுக்கொண்டார் என்ற வினையின் பரந்த பொருளைக் காக்கிறது; பணம் கொடுத்தது முந்தைய சொற்றொடரிலேயே தெளிவாகிறது.
- source_word: καὶ γεγέννημαι
  choice: நானோ பிறப்பிலேயே குடிமகன்
  rationale: ‘பிறந்திருக்கிறேன்’ என்ற நிறைவுநிலை வடிவத்தையும், சூழலில் விடுபட்டுள்ள குடியுரிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; καί தரும் வலியுறுத்தல் ‘பிறப்பிலேயே’ என்பதில் பிரதிபலிக்கிறது.
- source_word: δέ
  choice: அதற்கு / ஆனால் / நானோ
  rationale: உரையாடலின் தொடர்ச்சியையும் இருவரின் நிலைகளுக்கிடையேயான மாறுபாட்டையும் தமிழில் இயல்பாகக் காட்ட, சூழலுக்கேற்ப வேறுபட்ட இணைப்புகள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ἔφη
  choice: என்றார்
  rationale: கூடுதல் உரைநடை வலிமையைச் சேர்க்காமல் பொதுவான பேச்சு வினையாக மொழிபெயர்க்கிறது.
