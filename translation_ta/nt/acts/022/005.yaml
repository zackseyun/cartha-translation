  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: ta
  text: இதற்கு தலைமைக் குருவும் மூப்பர் குழு முழுவதும் எனக்குச் சாட்சி கூற முடியும். அவர்களிடமிருந்து தமஸ்குவிலுள்ள சகோதரர்களுக்கு[a] கடிதங்களையும் பெற்று, அங்கே இருந்தவர்களையும் கட்டுண்டவர்களாக எருசலேமுக்குக் கொண்டுவந்து, அவர்கள் தண்டிக்கப்படுவதற்காக நான் அங்குப் பயணம் செய்துகொண்டிருந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளுக்கு.” கிரேக்க மொழியில் “சகோதரர்கள்” என்று உள்ளது; சில சூழல்களில் இச்சொல் பரந்த சமூகத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι
  choice: இதற்கு தலைமைக் குருவும் எனக்குச் சாட்சி கூற முடியும்
  rationale: ὡς καὶ என்பதன் உறுதிப்படுத்தும் தொடர்பை இயல்பான தமிழில் ‘இதற்கு ... உம்’ என வெளிப்படுத்துகிறது; μαρτυρεῖ μοι என்பது பவுலின் கூற்றை ஆதரிக்கும் சாட்சியைக் குறிக்கிறது.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: மூப்பர் குழு முழுவதும்
  rationale: πρεσβυτέριον என்பது வயதானவர்களைப் பொதுவாக அல்ல, மூப்பர்களால் ஆன அதிகாரப்பூர்வக் குழுவைக் குறிக்கிறது.
- source_word: ἐπιστολὰς
  choice: கடிதங்கள்
  rationale: அடிப்படைச் சொல்லர்த்தத்தைப் பேணுகிறது; அவை அதிகாரக் கடிதங்கள் என்பது சூழலிலிருந்து தெளிவாகிறது.
- source_word: πρὸς τοὺς ἀδελφοὺς
  choice: சகோதரர்களுக்கு
  rationale: கிரேக்க ஆண்பால் பன்மையை நேரடியாகப் பேணுகிறது; பரந்த சமூகத்தைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπορευόμην
  choice: பயணம் செய்துகொண்டிருந்தேன்
  rationale: இறந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த பயணத்தை imperfect வினை வடிவுக்கு ஏற்ப வெளிப்படுத்துகிறது.
- source_word: ἄξων ... δεδεμένους
  choice: கட்டுண்டவர்களாக ... கொண்டுவந்து
  rationale: ἄξων என்பதன் நோக்கப்பொருளையும் δεδεμένους குறிக்கும் கைதிநிலையையும் குறிப்பிட்ட சங்கிலிகளை ஊகிக்காமல் தெரிவிக்கிறது.
- source_word: ἵνα τιμωρηθῶσιν
  choice: தண்டிக்கப்படச் செய்வதற்காக
  rationale: எருசலேமுக்குக் கொண்டுவரும் நோக்கம் அவர்கள் தண்டிக்கப்படுவதே என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; குறிப்பிடப்படாத தண்டனை வகையைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ἀδελφοί என்பது ஆண்களை மட்டும் குறிக்கிறதா அல்லது பரந்த சமூகத்தையா என்பது
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; சக யூதர்கள்
  rationale: மூலத்தின் ஆண்பால் வடிவத்தை முதன்மை உரையில் பேணுகிறது; சூழலில் பரந்த சமூகத்தைக் குறிக்கக்கூடிய மொழிப்பயன்பாட்டை அடிக்குறிப்பில் திறந்துவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தலைமைக் குரு,’ ‘மூப்பர் குழு’ போன்ற சொற்கள் வரலாற்று அதிகார அமைப்பை சாதாரண வாசகருக்குப் புரியுமாறு தருகின்றன. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘சகோதரர்கள்’ என்பதற்குப் பிறகு நேரடியாக அமைக்கப்பட்டுள்ளது.
