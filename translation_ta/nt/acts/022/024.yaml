source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: ta
  text: படைத்தளபதி பவுலைப் படைவீரர் தங்குமிடத்துக்குள்[a] கொண்டுபோகும்படி கட்டளையிட்டார். மக்கள் எதற்காக அவருக்கு எதிராக இவ்வாறு கூச்சலிட்டுக்கொண்டிருந்தார்கள் என்பதைத் தெரிந்துகொள்ள, அவரைச் சாட்டைகளால் அடித்து விசாரிக்கும்படி கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘படை முகாமுக்குள்’ அல்லது ‘கோட்டைக்குள்.’ இங்கே இச்சொல் எருசலேமிலிருந்த ரோமப் படையினரின் தங்குமிடத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: χιλίαρχος
  choice: படைத்தளபதி
  rationale: ரோமப் படையில் உயர்நிலைத் தளபதியைக் குறிக்கும் பதவி. தமிழில் இயல்பாகவும் வரலாற்றுச் சூழலுக்குப் பொருத்தமாகவும் ‘படைத்தளபதி’ என வழங்கப்பட்டது.
- source_word: παρεμβολή
  choice: படைவீரர் தங்குமிடம்
  rationale: அடிப்படையில் படை முகாம் அல்லது படைத்தளம் என்று பொருள்படும் சொல்; எருசலேம் சூழலில் ரோமப் படையினர் தங்கியிருந்த கோட்டைப் பகுதியைக் குறிக்கிறது.
- source_word: εἰσάγεσθαι
  choice: கொண்டுபோகும்படி
  rationale: பவுலை மற்றவர்கள் உள்ளே கொண்டுபோக வேண்டும் என்ற செயப்பாட்டு infinitive-இன் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μάστιξιν
  choice: சாட்டைகளால் அடித்து
  rationale: விசாரணை நடத்தப் பயன்படுத்தப்பட்ட கடுமையான சாட்டையடியைத் தெளிவாகக் காட்டுகிறது; பன்மை instrumental dative-இன் கருவிப் பொருளும் காக்கப்படுகிறது.
- source_word: ἀνετάζεσθαι
  choice: விசாரிக்கும்படி
  rationale: கேட்டு ஆராய்தல் அல்லது விசாரணை செய்தல் என்ற மையப் பொருளை வழங்குகிறது; அதன் வன்முறை முறை ‘சாட்டைகளால் அடித்து’ என்பதில் வெளிப்படுகிறது.
- source_word: ἐπιγνῷ
  choice: தெரிந்துகொள்ள
  rationale: நிகழ்ந்ததற்கான காரணத்தை ஆராய்ந்து கண்டறிவது என்ற நோக்கத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: δι’ ἣν αἰτίαν
  choice: எதற்காக
  rationale: கூட்டத்தின் கூச்சலுக்கான காரணத்தை விசாரிப்பதைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத சட்டரீதியான ‘குற்றச்சாட்டு’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: ἐπεφώνουν αὐτῷ
  choice: அவருக்கு எதிராக ... கூச்சலிட்டார்கள்
  rationale: தொடர்ந்து எழுப்பப்பட்ட பகைமையான கூச்சலை imperfect வினையின் தொடர்நிலை உணர்வுடன் வெளிப்படுத்துகிறது.
