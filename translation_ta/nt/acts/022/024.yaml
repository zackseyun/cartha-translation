translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமைக்காக பவுலைக் குறிக்கும் இடங்களில் ‘அவரை/அவருக்கு’ என்றும், கூட்டத்தைப் பன்மையில் என்றும் வழங்கப்பட்டுள்ளது. மூலத்தின் கட்டளை—விசாரணை—நோக்கம் என்ற தொடர் இரண்டு இயல்பான தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
