source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: ta
  text: அவர், “நம் தந்தையரின் தேவன், அவருடைய விருப்பத்தை நீ அறிந்துகொள்ளவும், நீதியுள்ளவரைக்[b] காணவும், அவருடைய வாயிலிருந்து ஒரு குரலைக் கேட்கவும் உன்னை நியமித்திருக்கிறார்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன்னைத் தேர்ந்தெடுத்திருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை, ஒரு பணிக்காக ஒருவரைத் தேர்ந்தெடுப்பதையோ நியமிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நீதியுள்ளவர்’ என்பது இங்கு இயேசுவைக் குறிக்கும் பட்டம்; ‘நீதிமான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: அதற்கு அவர் … என்றார்
  rationale: δέ உரையாடலின் தொடர்ச்சியைச் சுட்டுவதால், இயல்பான தமிழில் ‘அதற்கு’ எனத் தரப்பட்டுள்ளது; εἶπεν எளிமையாக ‘என்றார்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: நம் தந்தையரின் தேவன்
  rationale: πατέρων என்பதன் ஆண்பால் வடிவத்தையும், இஸ்ரவேலின் உடன்படிக்கை மரபை நினைவூட்டும் வழக்கையும் ‘தந்தையர்’ பாதுகாக்கிறது.
- source_word: προεχειρίσατό
  choice: உன்னை நியமித்திருக்கிறார்
  rationale: இந்த வினை ஒரு நோக்கத்திற்காக ஒருவரைத் தேர்ந்தெடுத்து நியமிப்பதைக் குறிக்கிறது. தொடர்ந்து வரும் மூன்று வினையெச்ச நோக்கங்களோடு ‘நியமித்திருக்கிறார்’ இயல்பாகப் பொருந்துகிறது; முன்காலத் தேர்வை தேவையின்றி வலியுறுத்தவில்லை.
- source_word: γνῶναι τὸ θέλημα αὐτοῦ
  choice: அவருடைய விருப்பத்தை நீ அறிந்துகொள்ளவும்
  rationale: γνῶναι என்பது இங்கு அறிதல் அல்லது அறிந்துகொள்ளுதலைக் குறிக்கிறது. θέλημα என்பதன் பரந்த ‘will’ பொருளை சமயக் குழுவுக்கே உரிய கலைச்சொல்லின்றி ‘விருப்பம்’ வெளிப்படுத்துகிறது.
- source_word: ἰδεῖν τὸν δίκαιον
  choice: நீதியுள்ளவரைக் காணவும்
  rationale: ἰδεῖν என்பதற்கு நேரடியான ‘காண’ பயன்படுத்தப்பட்டுள்ளது. τὸν δίκαιον சூழலில் இயேசுவைக் குறிக்கும் பட்டமாக இருந்தாலும், மூலத்தின் நீதியைக் குறிக்கும் சொற்பொருள் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ
  choice: அவருடைய வாயிலிருந்து ஒரு குரலைக் கேட்கவும்
  rationale: φωνή இங்கு உரைக்கப்பட்ட குரலைக் குறிக்கிறது; கிரேக்கத்தில் அது குறிப்புச் சுட்டியின்றி இருப்பதால் ‘ஒரு குரல்’ எனத் தரப்பட்டுள்ளது. ‘வாயிலிருந்து’ என்ற மூலத்தின் தெளிவான, நேரடியான உருவகம் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: τὸν δίκαιον என்பது கிறிஸ்துவைக் குறிக்கும் பட்டமா அல்லது வெறும் விளக்கப் பெயரடையா?
  choice: இயேசுவைக் குறிக்கும் பட்டமாக ‘நீதியுள்ளவர்’
  alternative: ‘நீதிமான்’ அல்லது பட்டத் தன்மையைச் சுட்டாமல் ‘நீதியுள்ள ஒருவர்’
  rationale: அப்போஸ்தலர் பணிகள் 3:14; 7:52 ஆகிய இடங்களிலும் இச்சொற்றொடர் இயேசுவுக்குரிய அடையாளப் பட்டமாக வருகிறது. தமிழ் எழுத்தில் பெரிய எழுத்து வேறுபாடு இல்லாததால் அடிக்குறிப்பு பட்டத் தன்மையைத் தெளிவாக்குகிறது.
- issue: πατέρων என்பதைக் பாலினப் பொதுமைப்படுத்தலாக மாற்ற வேண்டுமா?
  choice: ‘நம் தந்தையர்’ என்று மூலத்தின் ஆண்பால் மற்றும் மரபுச் சொல்லாக்கத்தைப் பாதுகாத்தல்
  alternative: ‘நம் முன்னோர்’
  rationale: கிரேக்கம் வெளிப்படையாக ‘தந்தையர்’ என்கிறது; மேலும் இந்தச் சொற்றொடர் இஸ்ரவேலின் பிதாக்களுடனான வரலாற்று, உடன்படிக்கைத் தொடர்ச்சியை எடுத்துக்காட்டுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நம் தந்தையரின் தேவன்’ மற்றும் ‘வாயிலிருந்து ஒரு குரல்’ ஆகியவை மூலத்தின் உடன்படிக்கைச் சொல்லாக்கத்தையும் தெளிவான உருவகத்தையும் பாதுகாக்கின்றன. சமயக் குழுவுக்கே உரிய தொழில்நுட்பச் சொற்களைத் தவிர்த்து, உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளன.
