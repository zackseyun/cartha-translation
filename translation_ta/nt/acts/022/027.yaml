id: ACT.22.27
reference: Acts 22:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: ta
  text: அப்போது படைத்தளபதி பவுலிடம் வந்து, “நீ ரோமக் குடிமகனா என்று என்னிடம் சொல்” என்று கேட்டார். பவுல், “ஆம்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: பவுலிடம் வந்து
  rationale: προσέρχομαι என்ற வினையின் இறந்தகால வினையெச்சம், அதிகாரி பவுலை அணுகிய பின்பு பேசியதைச் சுட்டுகிறது. தமிழில் ‘பவுலிடம் வந்து’ என்பது இயல்பாக அந்த அசைவையும் தொடர்ச்சியையும் தெரிவிக்கிறது; ‘பவுல்’ என்பது சூழலிலிருந்து தெளிவாகும் பெயர்ச்சுட்டு.
- source_word: δὲ
  choice: அப்போது / அதற்கு
  rationale: முதல் δέ நிகழ்வின் தொடர்ச்சியைச் சுட்டுவதால் ‘அப்போது’ என்றும், இரண்டாவது δέ பதிலுரைக்கு மாறுவதால் ‘அதற்கு’ என்றும் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது; வலுவான எதிர்மறை உணர்வு சேர்க்கப்படவில்லை.
- source_word: χιλίαρχος
  choice: படைத்தளபதி
  rationale: ரோமப் படையின் ஒரு பெரிய பிரிவுக்குத் தலைமை வகித்த அதிகாரியை இச்சொல் குறிக்கிறது. ‘படைத்தளபதி’ என்பது வரலாற்றுப் பதவியின் இராணுவ இயல்பைக் காட்டுவதோடு சாதாரண தமிழ் வாசகருக்கும் புரியும்.
- source_word: εἶπεν αὐτῷ
  choice: என்று கேட்டார்
  rationale: சொற்பொருளில் ‘அவரிடம் சொன்னார்’ என்றாலும், தொடர்ந்து நேரடியான கேள்வி வருவதால் தமிழில் ‘என்று கேட்டார்’ என்பது உரையாடல் செயல்பாட்டைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: Λέγε μοι
  choice: என்னிடம் சொல்
  rationale: கட்டளை வடிவிலுள்ள λέγε மற்றும் μοι என்ற தன்மை வேற்றுமையை நேரடியாகப் பாதுகாக்கும் இயல்பான தமிழ். ‘சொல்லுங்கள்’ என மரியாதை வடிவம் சேர்ப்பது மூலத்தில் இல்லாத சமூகத் தொனியை உருவாக்கும்.
- source_word: σὺ Ῥωμαῖος εἶ
  choice: நீ ரோமக் குடிமகனா?
  rationale: Ῥωμαῖος பெயர்ச்சொல் போலப் பயன்பட்டு இச்சூழலில் சட்டப்பூர்வ ரோமக் குடியுரிமையைக் குறிக்கிறது. தமிழில் வெறும் ‘ரோமனா?’ என்பது இனமோ வசிப்பிடமோ எனத் தவறாகப் புரியக்கூடும்; ‘ரோமக் குடிமகனா?’ என்பது சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது. வெளிப்படையான σὺ ‘நீ’ என்று வைக்கப்பட்டுள்ளது.
- source_word: Ναί
  choice: ஆம்
  rationale: எந்த விரிவாக்கமும் இன்றி எளிய உறுதிப்படுத்தும் பதிலைத் தருகிறது.
