- from: அப்போது படைத்தளபதி பவுலிடம் வந்து, “என்னிடம் சொல், நீ ரோமக் குடிமகனா?” என்று கேட்டார். அதற்கு அவர், “ஆம்” என்றார்.
  to: அப்போது படைத்தளபதி பவுலிடம் வந்து, “நீ ரோமக் குடிமகனா என்று என்னிடம் சொல்” என்று கேட்டார். பவுல், “ஆம்” என்றார்.
  rationale: Question wording and pronoun reference have been made more idiomatic and explicit in modern standard Tamil. The meaning, narrative progression, and concise affirmative response of the Greek are retained. Notes preserve the historical force of χιλίαρχος and the legal sense of Ῥωμαῖος.
