translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வரலாற்றுப் பதவிக்குப் புரியக்கூடிய பொதுச் சொல்லும், Ῥωμαῖος என்பதற்கு சட்டப்பூர்வ குடியுரிமையைத் தெளிவாக்கும் சொல்லாட்சியும் பயன்படுத்தப்பட்டுள்ளன. இவ்வசனத்திற்கு அவசியமான அடிக்குறிப்பு இல்லை.
