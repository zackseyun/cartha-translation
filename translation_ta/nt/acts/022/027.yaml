    text: ‘படைத்தளபதி’ என்பதற்கான கிரேக்கச் சொல் χιλίαρχος; இது ரோம இராணுவ அதிகாரியைக் குறிக்கிறது; ‘ரோமப் படைத்தலைவர்’ என்றும் மொழிபெயர்க்கலாம்.
