- from: நியாயப்பிரமாணத்தின்படி இறைப்பற்றுள்ள அனனியா என்னும் ஒருவர், அங்கு வாழ்ந்த யூதர்கள் அனைவராலும் நற்சான்று பெற்றவர்.
  to: அனனியா என்னும் ஒருவர் நியாயப்பிரமாணத்தின்படி பக்தியுள்ளவராகவும், அங்கு வாழும் யூதர்கள்[a] அனைவராலும் நற்சான்று பெற்றவராகவும் இருந்தார்.
  rationale: The revision retains the mild, unexpressed discourse transition without adding «இப்போது» or «ஆனால்»; preserves the named yet previously unintroduced individual; represents κατοικούντων with a present descriptive form; and makes both εὐλαβής κατὰ τὸν νόμον and μαρτυρούμενος explicit coordinated predicates in idiomatic modern Tamil. The note preserves the stated alternative for Ἰουδαίων.
