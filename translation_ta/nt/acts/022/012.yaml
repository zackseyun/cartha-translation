source:
  edition: SBLGNT
  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: ta
  text: அனனியா என்னும் ஒருவர் நியாயப்பிரமாணத்தின்படி பக்தியுள்ளவராகவும், அங்கு வாழும் யூதர்கள்[a] அனைவராலும் நற்சான்று பெற்றவராகவும் இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, «யூதேயர்கள்»; இதை சமய-சமூக அடையாளமாக அல்லாமல் இன-புவியியல் அடையாளமாக எடுத்துக்கொண்டால்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁνανίας
  choice: அனனியா
  rationale: தனிப்பட்ட பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபின்படி வழங்கப்படுகிறது.
- source_word: δέ
  choice: தனி இணைப்புச்சொல் இன்றி
  rationale: இங்கு இது மென்மையான உரைமாற்றத்தைக் குறிக்கிறது; தமிழில் தனியே ‘இப்போது’ அல்லது ‘ஆனால்’ சேர்ப்பது தேவையற்ற கால அல்லது எதிர்மறை நிழலை உருவாக்கும்.
- source_word: τις ἀνὴρ
  choice: என்னும் ஒருவர்
  rationale: முன்னர் அறிமுகப்படுத்தப்படாத குறிப்பிட்ட ஆண் நபரை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; பெயருடன் ‘என்னும் ஒருவர்’ என்பது கிரேக்கத்தின் குறிப்பிட்டதாயினும் முதலில் குறிப்பிடப்படும் தன்மையைப் பாதுகாக்கிறது.
- source_word: εὐλαβής
  choice: இறைப்பற்றுள்ள
  rationale: பக்தியும் கவனமான சமய ஒழுக்கமும் உடையவர் என்ற பொருளை நவீன, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: κατὰ τὸν νόμον
  choice: நியாயப்பிரமாணத்தின்படி
  rationale: மோசேயின் நியாயப்பிரமாணத்தைச் சார்ந்த பக்தியைத் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் காட்டுகிறது.
- source_word: μαρτυρούμενος
  choice: நற்சான்று பெற்றவர்
  rationale: மற்றவர்கள் அவரைக் குறித்து சாதகமான சாட்சி அளித்தனர் என்ற செயப்பாட்டு கருத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: ὑπὸ πάντων
  choice: அனைவராலும்
  rationale: πάντων என்பதன் முழுமையான வலிமையையும் செயப்பாட்டு வினையின் முகவரையும் காக்கிறது.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: அங்கு வாழ்ந்த யூதர்கள்
  rationale: சுற்றியுள்ள சூழலில் குறிக்கப்படும் தமஸ்குவில் குடியிருந்த யூத சமூகத்தை இயல்பாகச் சுட்டுகிறது; ‘அங்கு’ என்பது சூழலால் நிரப்பப்படும் இடக்குறிப்பு.
theological_decisions:
- issue: Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்கள்
  alternative: யூதேயர்கள்
  rationale: இங்கு தமஸ்குவில் வாழும் சமய-சமூகக் குழுவே குறிக்கப்படுகிறது; யூதேயா பகுதியைச் சேர்ந்தவர்கள் என்ற புவியியல் அடையாளம் முதன்மையல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. வசனம் அடுத்த பகுதியுடன் இலக்கண ரீதியாகத் தொடர்ந்தாலும், தமிழில் இயல்பான முழு வாக்கியமாக வழங்கப்பட்டுள்ளது. மூலத்தில் தனி காலக்குறிப்புச் சொல் இல்லாததால் தொடக்கத்தில் ‘இப்போது’ சேர்க்கப்படவில்லை.
