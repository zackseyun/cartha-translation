id: ACT.22.21
reference: Acts 22:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: ta
  text: அவர் என்னிடம், “போ; ஏனெனில் நான் உன்னைத் தொலைதூரத்தில் உள்ள யூதரல்லாத மக்களிடம்[a] அனுப்புவேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பிற இனத்தாரிடம்”; நேரடியாக, “இனங்களிடம்” அல்லது “நாடுகளிடம்.”
    reason: ἔθνη என்ற கிரேக்கச் சொல் யூதரல்லாத மக்களையும், பரந்த பொருளில் இனங்கள் அல்லது நாடுகளையும் குறிக்கலாம்.
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: அவர் என்னிடம் … என்றார்
  rationale: πρός + வேற்றுமையுடன் வரும் λέγω நேரடியாக ஒருவரிடம் உரையாடுவதைக் குறிக்கிறது; தமிழில் மேற்கோளைச் சுற்றி ‘என்னிடம் … என்றார்’ என்பது இயல்பான கதைநடை.
- source_word: Πορεύου
  choice: போ
  rationale: πορεύομαι என்பதன் கட்டளை வடிவம் இங்கு புறப்பட்டுச் செல்லும்படி கூறுகிறது; ‘போ’ சுருக்கமாகவும் இயல்பாகவும் அதன் கட்டளை வலிமையைத் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இங்கு ὅτι, போகும்படியான கட்டளைக்குக் காரணத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அந்தக் காரண உறவைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐγὼ
  choice: நான்
  rationale: கிரேக்கத்தில் வெளிப்படையாக வரும் எழுவாய் வலியுறுத்தலைக் கொண்டிருக்கலாம்; தமிழில் ‘நான்’ என்பதை வெளிப்படையாக வைத்திருப்பது அதை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: εἰς ἔθνη
  choice: யூதரல்லாத மக்களிடம்
  rationale: அப்போஸ்தலர் பணியின் இச்சூழலில் ἔθνη என்பது புவியியல் நாடுகளை மட்டும் அல்லாமல் யூதரல்லாத மக்களைக் குறிப்பாகச் சுட்டுகிறது. நவீனத் தமிழில் இத்தேர்வு அர்த்தத்தை உடனடியாகத் தெளிவாக்குகிறது; ‘பிற இனத்தாரிடம்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μακρὰν
  choice: தொலைதூரத்தில் உள்ள
  rationale: μακράν அனுப்பப்படும் இடம் அல்லது மக்களின் தொலைவை வலியுறுத்துகிறது; தமிழில் ‘தொலைதூரத்தில் உள்ள’ என்பது யாரிடம் அனுப்பப்படுகிறார் என்பதோடு இயல்பாக இணைகிறது.
- source_word: ἐξαποστελῶ
  choice: அனுப்புவேன்
  rationale: எதிர்கால வினையான ἐξαποστέλλω ‘அனுப்புதல்/வெளியே அனுப்புதல்’ எனப் பொருள்படும்; சூழலில் பணியமர்த்தும் நுணுக்கம் இருந்தாலும், ‘அனுப்புவேன்’ அதீத விளக்கமின்றி முதன்மைப் பொருளைத் தருகிறது.
- source_word: σε
  choice: உன்னை
  rationale: அனுப்பும் வினையின் இரண்டாம் நபர் ஒருமை செயப்படுபொருளை நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: அப்போஸ்தலப் பணி சூழலில் ἔθνη என்பதன் மொழிபெயர்ப்பு
  choice: யூதரல்லாத மக்கள்
  alternative: பிற இனத்தார்; நாடுகள்
  rationale: இவ்வசனம் பவுல் யூதரல்லாத மக்களிடம் அனுப்பப்படுவதைப் பற்றியது. ‘யூதரல்லாத மக்கள்’ என்பது அப்போஸ்தலர் நூலிலுள்ள யூதர்–யூதரல்லாதவர் வேறுபாட்டைப் பாதுகாக்கிறது; சொல்லின் பரந்த ‘இனங்கள்/நாடுகள்’ சாத்தியத்தைக் குறிப்பு முற்றிலும் மறைக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘போ’ என்ற நேரடி கட்டளையும் ‘ஏனெனில்’ என்ற காரண இணைப்பும் மூலத்தின் அமைப்பைப் பாதுகாக்கின்றன; ἔθνη என்பதிலுள்ள சொற்பொருள் விரிவு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
