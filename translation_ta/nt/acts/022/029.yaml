source:
  edition: SBLGNT
  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: ta
  text: ஆகவே, அவனை விசாரிக்கவிருந்தவர்கள்[a] உடனே அவனைவிட்டு விலகினார்கள். அவன் ரோமக் குடிமகன் என்பதையும், தாம் அவனைக் கட்டிவைத்திருந்ததையும் அறிந்த படைத்தளபதியும்[b] பயந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இச்சூழலில், “சாட்டையால் அடித்து விசாரிக்கவிருந்தவர்கள்” என இன்னும் குறிப்பாகவும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் அதிகாரபூர்வ விசாரணையைக் குறிக்கலாம்; முந்தைய வசனம் அதற்குப் பயன்படுத்தவிருந்த முறையைத் தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “ஆயிரவர் தலைவர்.” இது பெயரளவில் சுமார் ஆயிரம் வீரர்களுக்குத் தலைமை வகித்த ஒரு ரோமப் படை அதிகாரியின் பதவி; நடைமுறையில் வீரர்களின் எண்ணிக்கை மாறுபடலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: ஆகவே ... உடனே
  rationale: οὖν முந்தைய வசனத்திலிருந்து வரும் விளைவைச் சுட்டுகிறது; εὐθέως உடனடியான எதிர்வினையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: அவனைவிட்டு விலகினார்கள்
  rationale: அவர்கள் பவுல்மீது மேற்கொள்ளவிருந்த நடவடிக்கையை நிறுத்திப் பின்வாங்கியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: அவனை விசாரணை செய்யவிருந்தவர்கள்
  rationale: μέλλω + infinitive உடனடியாகச் செய்யவிருந்த நோக்கத்தையும், ἀνετάζω அதிகாரபூர்வ விசாரணையையும் குறிக்கின்றன. சாட்டையடித்து விசாரித்தல் என்ற சூழல் சார்ந்த குறிப்பை அடிக்குறிப்பில் வைக்கிறது.
- source_word: χιλίαρχος
  choice: படைத்தளபதி
  rationale: ரோமப் படையில் ஆயிரவர் தலைவன் என்ற பதவியைச் சொற்சொல்லாகக் கொடுப்பதைவிட, சாதாரண வாசகருக்குப் புரியும் வகையில் அதிகாரமுள்ள படைத்தலைவரைக் குறிக்கிறது; வரலாற்றுச் சிறப்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἐφοβήθη
  choice: பயந்தார்
  rationale: உண்மையை அறிந்தவுடன் ஏற்பட்ட அச்சத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐπιγνοὺς
  choice: அறிந்தபோது
  rationale: அதிகாரி நிலைமையின் உண்மையை உணர்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: Ῥωμαῖός ἐστιν
  choice: அவன் ஒரு ரோமக் குடிமகன்
  rationale: இங்கு இன அடையாளத்தைவிட சட்டப்பூர்வ குடியுரிமை நிலையே முக்கியம் என்பதால் ‘குடிமகன்’ சேர்க்கப்படுகிறது.
- source_word: αὐτὸν ἦν δεδεκώς
  choice: தான் அவனைக் கட்டிவைத்திருந்ததை
  rationale: perfect participle முன்னரே செய்யப்பட்டு அப்போதும் விளைவுடன் இருந்த கட்டிவைத்த செயலைக் காட்டுகிறது; ἦν உடன் உள்ள அமைப்பு தமிழில் இறந்தகால நிறைவாக வழங்கப்படுகிறது.
