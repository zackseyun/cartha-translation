translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இரு தகவல்களான ரோமக் குடியுரிமையும் கட்டிவைத்த செயலும் சமநிலையுடன் பாதுகாக்கப்பட்டுள்ளன; சாட்டையடி விசாரணை என்பது வசனத்திலேயே வெளிப்படையாக இல்லாததால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
