  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: ta
  text: இனி அவர்கள் அவரது முகத்தைக் காணப்போவதில்லை என்று அவர் சொன்ன வார்த்தையினால் அவர்கள் மிகவும் துயரமடைந்தார்கள்.[a] பின்பு அவரைக் கப்பல்வரை வழியனுப்பிச் சென்றார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக, “அவர் சொன்ன அந்த வார்த்தையினால்: ‘இனி அவர்கள் அவரது முகத்தைக் காணப்போவதில்லை.’” அல்லது, “அவர் சொன்னதைக் குறித்து.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவரைக் கப்பல்வரை உடன் சென்று அனுப்பிவைத்தார்கள்.” இவ்வினைச்சொல் மரியாதையுடன் வழியனுப்புவதற்காக ஒருவருடன் செல்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: துயரப்பட்டார்கள்
  rationale: ஆழ்ந்த மனவேதனையையும் துக்கத்தையும் குறிக்கும் பங்கேற்புவினை; விடைபெறும் சூழலில் இயல்பான நவீனத் தமிழ்.
- source_word: μάλιστα ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: அவர் சொன்ன வார்த்தையை நினைத்து … மிகவும்
  rationale: அவர்களுடைய துயரத்திற்கான முதன்மைக் காரணத்தைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; λόγος என்பதையும் ‘வார்த்தை’ என்று தக்கவைக்கிறது.
- source_word: οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: இனி அவர்கள் அவரது முகத்தைக் காணப்போவதில்லை
  rationale: οὐκέτι என்பதன் ‘இனி இல்லை’ என்ற பொருளையும், μέλλω தரும் எதிர்பார்க்கப்பட்ட எதிர்கால நோக்கையும், ‘அவரது முகம்’ என்ற தனிப்பட்ட சொல்லாட்சியையும் தக்கவைக்கிறது.
- source_word: προέπεμπον
  choice: வழியனுப்பிச் சென்றார்கள்
  rationale: பிரியாவிடையாக ஒருவருடன் சென்று அனுப்பிவைப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முற்றுப்பெறாமல் தொடர்ந்த செயலைச் சூழல் தெளிவாக்குகிறது.
- source_word: εἰς τὸ πλοῖον
  choice: கப்பல்வரை
  rationale: இலக்கைச் சுட்டும் εἰς என்பதையும் கடற்பயணச் சூழலுக்குரிய πλοῖον என்பதையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
