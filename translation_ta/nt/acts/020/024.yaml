source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: ta
  text: ஆனால், என் உயிர் எனக்கே மதிப்புமிக்கது என்று நான் கருதுவதில்லை[a]. கடவுளுடைய அருளின் நற்செய்திக்குச் சாட்சியளிப்பதற்காக ஆண்டவர் இயேசுவிடமிருந்து நான் பெற்ற ஊழியத்தையும் என் ஓட்டத்தையும்[b] நிறைவேற்றி முடித்தால் போதும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் வாழ்க்கை எனக்கே அருமையானது’ என்றும் மொழிபெயர்க்கலாம். இங்கு ‘உயிர்’ என்பது, தன் பணியை முடிப்பதற்காக மரணத்தையும் எதிர்கொள்ளப் பவுல் தயாராக இருப்பதைச் சூழலுக்கேற்றவாறு காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘என் ஓட்டப்பாதை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் முடிவுவரை ஓடி நிறைவு செய்யப்படும் ஓட்டத்தையோ பாதையையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘உறுதியாகச் சாட்சிபகர்வதற்காக’ அல்லது ‘ஆணித்தரமாகச் சாட்சியளிப்பதற்காக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: எனக்கே மதிப்புமிக்கது என்று நான் கருதுவதில்லை
  rationale: மதிப்பீட்டை வெளிப்படுத்தும் கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; ἐμαυτῷ என்பதன் தனிப்பட்ட அழுத்தத்தையும் ‘எனக்கே’ எனக் காக்கிறது.
- source_word: ψυχήν
  choice: உயிர்
  rationale: இங்கு பவுல் துன்பத்தையும் மரணத்தையும் எதிர்கொள்ளத் தயாராயிருப்பதைப் பேசுவதால், உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ என்ற கருத்தைவிட இவ்வுலக வாழ்வாகிய ‘உயிர்’ சூழலுக்குப் பொருந்துகிறது.
- source_word: ὡς τελειῶσαι
  choice: நிறைவேற்றி முடித்தால் போதும்
  rationale: பவுலின் மேலோங்கிய ஒரே நோக்கத்தையும் ஏக்கத்தையும் இயல்பான தமிழில் காட்டுகிறது; வெறும் நோக்கப் பொருளாக மட்டும் குறுக்காமல், கிரேக்கத் தொடரின் சுருக்கமான வலிமையைக் காக்கிறது.
- source_word: δρόμον
  choice: ஓட்டம்
  rationale: முடிவுவரை ஓடும் பந்தய உருவகத்தைத் தெளிவாகக் காக்கிறது; ‘வாழ்க்கைப் பயணம்’ என்று விளக்கிச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: διακονίαν
  choice: ஊழியம்
  rationale: ஆண்டவர் இயேசுவிடமிருந்து பெற்ற ஒப்படைக்கப்பட்ட சேவையை இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: ஆண்டவர் இயேசுவிடமிருந்து
  rationale: παρά + பிறப்புவேற்றுமை குறிக்கும் மூலத்தைத் தெளிவாகக் காட்டி, κύριος என்ற பட்டத்தை ‘ஆண்டவர்’ எனக் காக்கிறது.
- source_word: διαμαρτύρασθαι
  choice: சாட்சியளிக்கும்
  rationale: சாட்சிபகர்தல் என்ற மையப் பொருளைத் தருகிறது; வினையின் தீவிரமான அல்லது உறுதியான நுணுக்கம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: கடவுளுடைய அருளின் நற்செய்தி
  rationale: இறை அருளால் தன்மையுறும் நற்செய்தி என்றும், இறை அருளைப் பற்றிய நற்செய்தி என்றும் புரிந்துகொள்ளக்கூடிய கிரேக்க உடைமைத் தொடரின் நெகிழ்வைத் தீர்மானிக்காமல் காக்கிறது.
theological_decisions:
- issue: ψυχή என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: உடல்–ஆத்துமா பிரிவைப் பவுல் இங்கு முன்னிறுத்தவில்லை; தன் பணியை முடிப்பதற்காக மரண ஆபத்தையும் ஏற்கும் மனநிலையே சூழல்.
- issue: ὡς τελειῶσαι என்பதன் வலிமை
  choice: நிறைவேற்றி முடித்தால் போதும்
  alternative: நிறைவேற்றி முடிப்பதற்காக
  rationale: இது சாதாரண நோக்கக் கூற்றை மட்டுமல்லாமல், பவுலுக்கு எல்லாவற்றையும் விட மேலான குறிக்கோளை வெளிப்படுத்துகிறது; அதேவேளை மறைமுகமான கிரேக்க இலக்கணத் தொடர்பை அளவுக்கு மீறி விளக்கவில்லை.
- issue: τῆς χάριτος τοῦ θεοῦ என்ற உடைமைத் தொடரின் தொடர்பு
  choice: கடவுளுடைய அருளின் நற்செய்தி
  alternative: கடவுளுடைய அருளைப் பற்றிய நற்செய்தி
  rationale: நற்செய்தியின் உள்ளடக்கம், தன்மை, மூலம் ஆகியவற்றில் ஒன்றை மட்டும் கட்டாயமாகத் தேர்ந்தெடுக்காமல் மூலத்தின் இறையியல் செறிவையும் ambiguity-யையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஊழியம்’, ‘நற்செய்தி’, ‘அருள்’, ‘ஆண்டவர்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக இருப்பதால் வைக்கப்பட்டுள்ளன. வாக்கியத்தின் நீளத்தைச் சமாளிக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டு, διαμαρτύρασθαι என்பது ஊழியத்தை விளக்கும் இணைப்பாகத் தெளிவாக்கப்பட்டுள்ளது.
