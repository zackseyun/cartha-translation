- from: ஆனால், என் உயிர் எனக்கே மதிப்புமிக்கது என்று நான் கருதுவதில்லை[a]. என் ஓட்டத்தையும்[b], ஆண்டவர் இயேசுவிடமிருந்து நான் பெற்ற ஊழியத்தையும்—அதாவது, கடவுளுடைய அருளின் நற்செய்திக்குச் சாட்சியளிக்கும் பணியையும்[c]—நிறைவேற்றி முடித்தால் போதும்.
  to: ஆனால், என் உயிர் எனக்கே மதிப்புமிக்கது என்று நான் கருதுவதில்லை[a]. கடவுளுடைய அருளின் நற்செய்திக்குச் சாட்சியளிப்பதற்காக ஆண்டவர் இயேசுவிடமிருந்து நான் பெற்ற ஊழியத்தையும் என் ஓட்டத்தையும்[b] நிறைவேற்றி முடித்தால் போதும்[c].
  rationale: சாட்சியளித்தல் என்பது ஆண்டவர் இயேசுவிடமிருந்து பெற்ற ஊழியத்தின் நோக்கம் அல்லது உள்ளடக்கத்தை விளக்குகிறது என்பதைத் தமிழில் நேரடியாக இணைத்துள்ளோம். ὡς τελειῶσαι-யின் மேலான குறிக்கோள்/‘if only’ வலிமையை ‘நிறைவேற்றி முடித்தால் போதும்’ எனக் காத்துள்ளோம். அடிக்குறிப்பு c-யும் முதன்மை உரையின் இலக்கண அமைப்புடன் ஒத்தவாறு ‘...வதற்காக’ எனச் சீரமைக்கப்பட்டுள்ளது.
