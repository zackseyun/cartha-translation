  yaml_path: translation/nt/acts/020/037.yaml
  text: They all wept a great deal, threw their arms around Paul’s neck, and kept kissing him.
translation:
  language: ta
  text: அவர்கள் எல்லாரும் மிகவும் அழுது, பவுலின் கழுத்தைக் கட்டிக்கொண்டு, அவரைத் திரும்பத் திரும்ப முத்தமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸς κλαυθμὸς ἐγένετο πάντων
  choice: அவர்கள் எல்லாரும் மிகவும் அழுது
  rationale: அங்கிருந்த அனைவரும் மிகுதியாக அழுததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; அழுகையின் தீவிரத்தையும் கூட்டுப் பங்கேற்பையும் காக்கிறது.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: பவுலின் கழுத்தைக் கட்டிக்கொண்டு
  rationale: கிரேக்க மொழிமரபிலுள்ள ‘கழுத்தின்மேல் விழுதல்’ என்பதைத் தமிழில் இயல்பான அணைப்பாகக் கூறுகிறது; அதேவேளை கழுத்து என்ற தெளிவான படிமத்தையும் காக்கிறது.
- source_word: κατεφίλουν αὐτόν
  choice: அவரைத் திரும்பத் திரும்ப முத்தமிட்டார்கள்
  rationale: முற்றுப்பெறாமல் தொடர்ந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் குறிக்கும் imperfect வினையின் கூறைத் தெளிவாக வெளிப்படுத்துகிறது.
