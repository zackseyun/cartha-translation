  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. மூலத்தின் உணர்ச்சித் தீவிரம், கழுத்தை அணைத்த படிமம், மீண்டும் மீண்டும் முத்தமிட்ட செயல் ஆகியவை காக்கப்பட்டுள்ளன.
