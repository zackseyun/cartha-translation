revisions:
- from: இவற்றைச் சொன்ன பின்பு, அவர் அவர்கள் அனைவரோடும் முழங்கால்படியிட்டு மன்றாடினார்.
  to: இவற்றைச் சொன்னபின், அவர் அவர்கள் அனைவருடனும் முழங்காலிட்டு ஜெபித்தார்.
  rationale: The revision retains the antecedent action (‘after saying these things’), Paul’s kneeling with the entire group, and the simple act of prayer. It replaces an awkward posture expression and removes the unwarranted implication that he was specifically pleading.
