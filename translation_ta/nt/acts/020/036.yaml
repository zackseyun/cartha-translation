  text: Καὶ ταῦτα εἰπὼν θεὶς τὰ γόνατα αὐτοῦ σὺν πᾶσιν αὐτοῖς προσηύξατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/036.yaml
  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: ta
  text: இவற்றைச் சொன்னபின், அவர் அவர்கள் அனைவருடனும் முழங்காலிட்டு ஜெபித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: பின்பு
  rationale: கிரேக்கத்தில் இது எளிய இணைப்புச்சொல். தமிழ்க் கதைநடையில் முந்தைய உரையைத் தொடர்ந்து நிகழ்ந்த செயலை இயல்பாக இணைக்க, தனியே ‘மேலும்’ என்று மொழிபெயர்க்காமல் ‘சொன்ன பின்பு’ என்ற தொடரில் அதன் முன்னேற்றப் பொருள் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ταῦτα εἰπὼν
  choice: இவற்றைச் சொன்ன பின்பு
  rationale: இறந்தகால வினையெச்சம் பிரதான செயலுக்கு முன்னர் பேச்சு முடிந்ததைச் சுட்டுகிறது; இந்தத் தமிழாக்கம் அந்தக் காலவரிசையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: முழங்கால்படியிட்டு
  rationale: சொல்லுக்கு சொல் ‘தமது முழங்கால்களை வைத்தார்’ என்றாலும், இது முழங்காலிட்டு அமர்வதைக் குறிக்கும் கிரேக்க மரபுத்தொடர். ‘முழங்கால்படியிட்டு’ என்பது இயக்கத்தை மிகைப்படுத்தாமல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: அவர்கள் அனைவரோடும்
  rationale: σύν உடனிருப்பையும் பங்கேற்பையும் குறிக்கிறது; πᾶσιν குழுவிலிருந்த அனைவரையும் வலியுறுத்துவதால் ‘அனைவரோடும்’ என வழங்கப்பட்டுள்ளது.
- source_word: προσηύξατο
  choice: மன்றாடினார்
  rationale: προσεύχομαι என்பது கடவுளிடம் வேண்டுதல் அல்லது ஜெபம் செய்வதற்கான பொதுவான வினை. நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருக்க ‘மன்றாடினார்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகமக் கதைநடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் செயல்வரிசையும் முழுக் குழுவின் பங்கேற்பும் காக்கப்பட்டுள்ளன; தேவையற்ற விளக்கமோ சமயப்பிரிவு சார்ந்த சொற்பயன்பாடோ சேர்க்கப்படவில்லை.
