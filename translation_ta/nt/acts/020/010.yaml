source:
  edition: SBLGNT
  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: ta
  text: ஆனால் பவுல் கீழே இறங்கி, அவன்மேல் விழுந்து, அவனை அணைத்துக்கொண்டு, “பதற்றமடையாதீர்கள்; ஏனெனில் அவனுடைய உயிர்[a] அவனுக்குள் இருக்கிறது[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுடைய ஆன்மா’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ψυχή என்பதற்கு ‘உயிர்,’ ‘தன்நபர்,’ அல்லது ‘ஆன்மா’ என்று பொருள் வரலாம்; இங்கு அவன் இறந்துவிட்டானா அல்லது உயிரோடிருக்கிறானா என்பதே உடனடிச் சூழல் என்பதால் ‘உயிர்’ என்பது மிகவும் பொருத்தமானது.
    reason: lexical_alternative
  - marker: b
    text: அந்த இளைஞன் உண்மையில் இறக்கவில்லை என்று பவுல் கூறியதாகவும், அவனுக்கு உயிர் மீட்டளிக்கப்பட்டது என்று கூறியதாகவும் இச்சொற்களைப் புரிந்துகொள்ள முடியும்; கிரேக்கச் சொல்லமைப்பு இந்த இரண்டில் எது என்பதை வெளிப்படையாகத் தீர்மானிக்கவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: கீழே இறங்கிப்போய்
  rationale: மேல்மாடிப் பகுதியிலிருந்து பவுல் கீழே சென்ற திசையையும், முதன்மை வினைக்கு முன்னான செயல் தொடரையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: இளைஞனின் விழுதலும் மரணநிலையும் பற்றிய முந்தைய செய்தியைத் தொடர்ந்து பவுலின் பதில்செயலைக் குறிக்கும் மென்மையான எதிர்வினையை வெளிப்படுத்துகிறது.
- source_word: ἐπέπεσεν αὐτῷ
  choice: அவன்மேல் விழுந்து
  rationale: உடல்மீதான பவுலின் செயலை நேரடியாகக் காட்டுவதோடு, தீர்க்கதரிசிகளின் உயிர்ப்பித்தல் நிகழ்வுகளை நினைவூட்டக்கூடிய மொழியொலியையும் தேவையின்றி விளக்காமல் தக்கவைக்கிறது.
- source_word: συμπεριλαβὼν
  choice: அவனை அணைத்துக்கொண்டு
  rationale: அவனைச் சுற்றித் தழுவிப் பிடித்த உடல்செயலை இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: Μὴ θορυβεῖσθε
  choice: பதற்றமடையாதீர்கள்
  rationale: கூடியிருந்தவர்களின் கலக்கம், அச்சம், பரபரப்பு ஆகியவற்றைச் சூழலுக்கேற்ற நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἡ ... ψυχὴ αὐτοῦ
  choice: அவனுடைய உயிர்
  rationale: ψυχή என்பதற்கு உயிர், ஆள்/தன், ஆன்மா போன்ற பொருள்கள் இருக்கலாம்; இங்கு அவன் உயிரோடு இருக்கிறானா என்ற உடனடிச் சூழலில் ‘உயிர்’ மிகவும் பொருத்தமானது.
- source_word: ἐν αὐτῷ ἐστιν
  choice: அவனுக்குள் இருக்கிறது
  rationale: கிரேக்கச் சொல்லமைப்பை நெருக்கமாகப் பேணி, உயிர் தொடர்ந்து இருந்ததா அல்லது திரும்பக் கொடுக்கப்பட்டதா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: உயிர்/மரணம் பற்றிய சூழலில் ψυχή என்பதன் பொருள்
  choice: ‘உயிர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆன்மா’
  rationale: இங்கு கவனம் இளைஞனின் உடல்சார்ந்த உயிர்நிலையிலுள்ளது. ‘உயிர்’ என்பது சூழலுக்குப் பொருந்துவதோடு, இவ்வசனம் முன்னிறுத்தாத ஆன்மா குறித்த தொழில்நுட்பமான கோட்பாட்டை இறக்குமதி செய்வதையும் தவிர்க்கிறது.
- issue: அந்த இளைஞன் உண்மையில் இறக்கவில்லை என்று பவுல் கூறுகிறாரா, அல்லது அவன் மீண்டும் உயிர்பெற்றதாகக் கூறுகிறாரா
  choice: ‘அவனுடைய உயிர் அவனுக்குள் இருக்கிறது’ என்ற நடுநிலையான சொல்லமைப்பு தக்கவைக்கப்பட்டது.
  alternative: ‘அவன் உயிரோடிருக்கிறான்’ அல்லது ‘அவனுடைய உயிர் திரும்பிவிட்டது’ போன்ற விளக்க மொழிபெயர்ப்புகள்
  rationale: கிரேக்க உரை உயிர் அவனுக்குள் இருப்பதாக மட்டுமே கூறுகிறது; அது தொடர்ந்து இருந்ததா அல்லது மீட்டளிக்கப்பட்டதா என்பதை வெளிப்படையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நிகழ்வின் உடல்செயல்கள் தெளிவாக வைக்கப்பட்டுள்ளன; உயிர் தொடர்ந்திருந்ததா அல்லது மீட்டளிக்கப்பட்டதா என்ற மூல உரையின் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
