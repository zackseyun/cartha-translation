  text: διελθὼν δὲ τὰ μέρη ἐκεῖνα καὶ παρακαλέσας αὐτοὺς λόγῳ πολλῷ ἦλθεν εἰς τὴν Ἑλλάδα
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: ta
  text: அவர் அந்தப் பகுதிகள் வழியாகச் சென்று, அவர்களிடம் விரிவாகப் பேசி ஊக்கப்படுத்தி, கிரேக்கத்துக்கு வந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελθὼν
  choice: வழியாகச் சென்று
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது; தமிழில் இயல்பான வினையெச்சத் தொடரால் அந்த வரிசை பாதுகாக்கப்படுகிறது.
- source_word: τὰ μέρη ἐκεῖνα
  choice: அந்தப் பகுதிகள்
  rationale: μέρη என்பதன் புவியியல் பொருளான ‘பகுதிகள்/வட்டாரங்கள்’ என்பதில், சூழலுக்கு ஏற்ற இயல்பான பொதுச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: παρακαλέσας
  choice: ஊக்கப்படுத்திய
  rationale: παρακαλέω என்பது ஊக்கப்படுத்துதல், அறிவுறுத்துதல், ஆறுதலளித்தல் ஆகிய பொருட்களைக் கொள்ளலாம்; விசுவாசிகளைச் சந்தித்து வலுப்படுத்தும் இச்சூழலில், பொருளை தேவையின்றிக் குறுக்காமல் ‘ஊக்கப்படுத்திய’ என மொழிபெயர்க்கப்பட்டது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட விசுவாசிகளைக் குறிக்கும் பன்மைப் பிரதிப்பெயர் நேரடியாகத் தரப்பட்டது.
- source_word: λόγῳ πολλῷ
  choice: பல வார்த்தைகளால்
  rationale: ‘மிகுதியான பேச்சால்/பல வார்த்தைகளால்’ என்ற கிரேக்கச் சொற்றொடரின் வடிவத்தைப் பாதுகாக்கிறது; நீளமான அல்லது விரிவான ஊக்கவுரையைக் குறிக்கக்கூடிய நுட்பம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: கிரேக்க நாட்டுக்கு வந்தார்
  rationale: இலக்கை நோக்கிய நகர்வைத் தமிழில் இயல்பாகக் காட்டுகிறது; Ἑλλάδα என்பதற்கு தெளிவான நவீன பெயராக ‘கிரேக்க நாடு’ பயன்படுத்தப்பட்டது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: δέ-யின் மென்மையான தொடர்ச்சிப் பணி தமிழின் வினையெச்சத் தொடரிலும் வாக்கிய ஓட்டத்திலும் இயல்பாக உட்பொதிந்துள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வினையெச்சங்களின் நிகழ்வுவரிசை தமிழின் இயல்பான வினையெச்ச அமைப்பால் தரப்பட்டுள்ளது; λόγῳ πολλῷ என்பதிலுள்ள உண்மையான சொற்பொருள் மற்றும் பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
