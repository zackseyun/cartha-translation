id: ACT.20.22
reference: Acts 20:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: ta
  text: இப்போது, இதோ, ஆவியில் கட்டுண்டவனாக[a] நான் எருசலேமுக்குப் போகிறேன்; அங்கே எனக்கு என்ன நேரிடும் என்று அறியாதபடியே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் ஆவியில் கட்டுண்டவனாக.” கிரேக்கச் சொற்றொடர் பவுலின் சொந்த ஆவியையோ பரிசுத்த ஆவியையோ குறிக்கலாம். இதை “ஆவியால் கட்டாயப்படுத்தப்பட்டு” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: வலியுறுத்தும் உரையாடல் அடையாளத்தையும் பவுலின் முக்கியமான கருத்துமாற்றத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: δεδεμένος
  choice: கட்டுண்டவனாக
  rationale: ‘கட்டப்பட்டிருப்பது’ என்ற நிறைவுற்ற நிலையைத் தெரிவிக்கும் உருவகத்தைத் தக்கவைத்து, உள்ளார்ந்த கட்டுப்பாடா அல்லது ஆவியானவரின் வழிநடத்துதலா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: τῷ πνεύματι
  choice: ஆவியில்
  rationale: இச்சொற்றொடர் பரிசுத்த ஆவியைக் குறிக்கிறதா அல்லது பவுலின் சொந்த ஆவியைக் குறிக்கிறதா என்ற கிரேக்க மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது; ‘ஆவியால்’ என்று மொழிபெயர்த்து செயலாற்றும் காரணத்தை மிகுதியாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: πορεύομαι
  choice: நான் எருசலேமுக்குப் போகிறேன்
  rationale: நடைபெறவிருக்கும் பயணத்தை இயல்பான தற்காலத் தமிழில் தெரிவிக்கிறது.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: அங்கே எனக்கு என்ன நேரிடும்
  rationale: சொல்லுக்குச் சொல் ‘அதில் என்னைச் சந்திக்கவிருப்பவை’ என்பதன் பொருளை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μὴ εἰδώς
  choice: தெரியாமலே
  rationale: பவுல் போகும் அதே வேளையில் வரவிருப்பவற்றை அறியாதிருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Ἰερουσαλήμ
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
theological_decisions:
- issue: τῷ πνεύματι என்பதன் குறிப்பு
  choice: ‘ஆவியில்’ என்று மொழிபெயர்த்து, பரிசுத்த ஆவியே பெரும்பாலும் நோக்கப்பட்டிருக்கலாம் என்ற வாய்ப்பைத் திறந்துவைத்தல்
  alternative: ‘தன் ஆவியில்’ அல்லது ‘ஆவியால் கட்டாயப்படுத்தப்பட்டு’
  rationale: அப்போஸ்தலர் நூலில் πνεῦμα பல இடங்களில் பரிசுத்த ஆவியைக் குறிக்கிறது; அடுத்த வசனங்களும் அந்த வாசிப்பை ஆதரிக்கின்றன. ஆயினும், இங்குள்ள வேற்றுமை உருபுக் கட்டமைப்பு பவுலின் சொந்த ஆவியையும் குறிக்கக்கூடும். எனவே பிரதான உரை அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது; மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைப் பயன்படுத்துகிறது. ‘இதோ’ மற்றும் ‘கட்டுண்டவனாக’ ஆகிய சற்றே உயர்ந்த சொற்கள் மூலத்தின் வலியுறுத்தலையும் உருவகத்தையும் தக்கவைக்கின்றன. அடிக்குறிப்பு குறியீடு தொடர்புடைய தெளிவற்ற சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
