id: ACT.20.30
reference: Acts 20:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: ta
  text: உங்களுக்குள்ளிருந்தே ஆண்கள் எழுவார்கள்; சீடர்களைத் தங்களுக்குப் பின்னால் இழுத்துக்கொள்வதற்காக அவர்கள் திரிக்கப்பட்டவற்றை[a] பேசுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெறிபிறழ்ந்தவற்றை” அல்லது “மாறுபடுத்தப்பட்டவற்றை.”
    reason: ‘திரிக்கப்பட்டவற்றை’ என்பதற்கான சொற்பொருள் மாற்றுகள்.
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: உங்களுக்குள்ளிருந்தே
  rationale: ἐξ ... αὐτῶν தரும் வலியுறுத்தலைப் பேணி, ஆபத்து எபேசு சமூகத்திற்கு வெளியிலிருந்து அல்ல, அவர்களுடைய சொந்த நடுவிலிருந்தே வரும் என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀναστήσονται
  choice: எழும்பி
  rationale: இங்கு ἀνίστημι என்பது ‘தோன்றுதல்’ அல்லது ‘முன்வருதல்’ என்ற இடியோமப் பொருளில் உள்ளது. ‘எழும்பி’ என்பது எதிர்கால முன்னறிவிப்பின் வலிமையைத் தொடரும் மரபான, புரிந்துகொள்ளத்தக்க சொல்.
- source_word: ἄνδρες
  choice: ஆண்கள்
  rationale: ἀνήρ குறிப்பாக ஆண்பாலாரைக் குறிக்கிறது; ஆகவே பாலினத்தைப் பொதுமைப்படுத்தாமல் ‘ஆண்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: λαλοῦντες
  choice: பேசுவார்கள்
  rationale: அவர்களுடைய தொடர்ச்சியான பேச்சுச் செயலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: διεστραμμένα
  choice: திரிக்கப்பட்டவற்றை
  rationale: நேரான அல்லது உண்மையான நிலையிலிருந்து திரிக்கப்பட்ட கருத்துகள் என்ற பரந்த பொருளைப் பேணுகிறது; குறிப்பிட்ட ஒரு தவறான போதனையை வசனத்திற்குள் இறக்குமதி செய்யவில்லை.
- source_word: τοῦ ἀποσπᾶν
  choice: இழுத்துக்கொள்வதற்காக
  rationale: τοῦ உடன் வரும் வினையெச்சம் நோக்கத்தைக் குறிக்கிறது; ἀποσπάω-வின் பிரித்து இழுக்கும் உருவகத்தையும் இந்தத் தமிழ் சொற்றொடர் காக்கிறது.
- source_word: τοὺς μαθητὰς
  choice: சீடர்களை
  rationale: அப்போஸ்தலர் நூலில் இயேசுவைப் பின்பற்றுவோருக்கான நிலையான வேதாகமச் சொல்லாட்சியைப் பேணுகிறது.
- source_word: ὀπίσω ἑαυτῶν
  choice: தங்களுக்குப் பின்னால்
  rationale: அந்த ஆண்கள் சீடர்களைத் தங்களுடைய ஆதரவாளர்களாக ஆக்க முயல்வதைக் காட்டும் பின்பற்றுதல் சார்ந்த இடியோமத்தை நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: பொய்ப் போதகர்களின் பேச்சின் இயல்பு
  choice: திரிக்கப்பட்டவற்றைப் பேசுவார்கள்
  alternative: நெறிபிறழ்ந்தவற்றைப் பேசுவார்கள்; மாறுபடுத்தப்பட்டவற்றைப் பேசுவார்கள்
  rationale: கிரேக்கம் ஒரு குறிப்பிட்ட வழுவான கோட்பாட்டைக் குறிப்பிடாமல் பரந்த doctrinal அல்லது ஒழுக்கச் சிதைவை எச்சரிக்கிறது. ‘திரிக்கப்பட்டவை’ அந்தத் திறந்த பொருள் வரம்பைப் பேணுகிறது.
- issue: ἄνδρες என்பதன் பாலினக் குறிப்பு
  choice: ஆண்கள்
  alternative: மனிதர்கள்; ஆட்கள்
  rationale: மூலச் சொல் குறிப்பாக ஆண்பாலைக் குறிக்கிறது; எனவே அதன் பாலினக் குறிப்பை நடுநிலைப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘உங்களுக்குள்ளிருந்தே’ என்ற வலியுறுத்தலும், ‘தங்களுக்குப் பின்னால்’ என்ற பின்பற்றுதல் உருவகமும் பேணப்பட்டுள்ளன. அடிக்குறி குறியீடு அது விளக்கும் ‘திரிக்கப்பட்டவற்றை’ என்ற சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
