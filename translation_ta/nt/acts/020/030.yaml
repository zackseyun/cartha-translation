    reason: ‘திரிக்கப்பட்டவற்றை’ என்பதற்கான சொற்பொருள் மாற்றுகள்.
  revision_rationale: The revision makes the predictive force of ‘will arise’ explicit with ‘ஆண்கள் எழுவார்கள்’ and uses a more natural Tamil clause structure. It preserves the source’s masculine reference, broad description of distorted matters, purposive infinitive, and personal-following idiom, without specifying any particular false teaching.
