lexical_decisions:
- source_word: δὲ
  choice: தனி இணைப்புச் சொல் இன்றி இயல்பான தொடர்ச்சி
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்பை மட்டுமே குறிக்கிறது; தமிழில் ‘அப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது மூலத்தில் இல்லாத கால அல்லது எதிர்மறை வலியுறுத்தலை உருவாக்கலாம்.
- source_word: λαμπάδες
  choice: விளக்குகள்
  rationale: λαμπάς என்பது விளக்கு அல்லது தீப்பந்தத்தைக் குறிக்கலாம். வீட்டின் மாடி அறை என்ற சூழலில் ‘விளக்குகள்’ இயல்பானதும் அதிக சாத்தியமானதும் ஆகும்.
- source_word: ἱκαναὶ
  choice: பல
  rationale: இங்கு ἱκανός விளக்குகளின் கணிசமான எண்ணிக்கையைச் சுட்டுகிறது; ‘பல’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐν τῷ ὑπερῴῳ
  choice: மாடி அறையில்
  rationale: ὑπερῷον வீட்டின் மேற்பகுதியிலுள்ள அறையைக் குறிக்கிறது; ‘மாடி அறை’ பொதுவாகப் புரியும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: οὗ
  choice: -இல்
  rationale: இடத்தைக் குறிக்கும் οὗ, தமிழில் தொடர்பெச்ச அமைப்பான ‘நாங்கள் கூடியிருந்த மாடி அறையில்’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: συνηγμένοι
  choice: கூடியிருந்த
  rationale: συνάγω என்பதன் நிறைவுநிலைச் செயப்பாட்டு வினையெச்சம், அவர்கள் ஒன்றுகூடி அந்நிலையில் இருந்ததைச் சுட்டுகிறது; ‘கூடியிருந்த’ அந்த நிலைத்த விளைவை இயல்பாகத் தருகிறது.
- source_word: ἦσαν ... ἦμεν
  choice: இருந்தன ... கூடியிருந்த
  rationale: இரு imperfect வடிவங்களும் கடந்தகாலக் காட்சியை விவரிக்கின்றன; தமிழில் இவ்வமைப்பு அவற்றை மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
