translation:
  language: ta
  text: நாங்கள் கூடியிருந்த மாடி அறையில் பல விளக்குகள்[a] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீப்பந்தங்கள்.’ கிரேக்கச் சொல் பொதுவாக எடுத்துச் செல்லக்கூடிய ஒளிச்சாதனங்களையும் குறிக்கலாம்; ஆனால் அறைக்குள் உள்ள இந்தச் சூழலில் ‘விளக்குகள்’ என்பதே அதிக சாத்தியம்.
