- from: பவுல் ஆசியாவில் காலம் செலவிட நேரிடாதபடி, எபேசுவைக் கடந்து கப்பலில் செல்லத் தீர்மானித்திருந்தார்.[a] ஏனெனில், முடிந்தால் பெந்தெகொஸ்தே நாளில் எருசலேமில் இருக்க வேண்டும் என்று அவர் விரைந்து சென்றுகொண்டிருந்தார்.[b]
