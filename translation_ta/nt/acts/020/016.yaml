  source_fidelity: 'மூலத்தின் முக்கியக் கருத்துகள் துல்லியமாக உள்ளன: முன்பே எடுக்கப்பட்ட பவுலின் முடிவு, எபேசுவைக் கடல்வழியாகக் கடத்தல், ஆசியாவில் தங்கும் காலத்தைத் தவிர்த்தல், பெந்தெகொஸ்தே நாளுக்கான அவசரப் பயணம் ஆகியவை அனைத்தும் பாதுகாக்கப்பட்டுள்ளன. எனினும், ‘எருசலேமில் இருக்க வேண்டும் என்று அவர் விரைந்து சென்றுகொண்டிருந்தார்’ என்பது தமிழில் சற்றே கனமாகவும், ‘வேண்டும்’ என்பதால் மூலத்தில் இல்லாத கட்டாயத் தொனியையும் ஏற்படுத்தலாம். நோக்கத்தைக் காட்டும் வினையெச்ச அமைப்பு மிகவும் நேரடியானது.'
