  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: ta
  text: ஆசியாவில் காலம் செலவிட நேரிடாதபடி, பவுல் எபேசுவைக் கடல்வழியாகக் கடந்து செல்லத் தீர்மானித்திருந்தார்.[a] ஏனெனில், முடிந்தால் பெந்தெகொஸ்தே நாளில் எருசலேமில் இருப்பதற்காக அவர் விரைந்து சென்றுகொண்டிருந்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘ஆசியா’ என்பது இன்றைய ஆசியக் கண்டத்தை அல்ல, ஆசியா மைனரின் மேற்குப் பகுதியில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘பெந்தெகொஸ்தே நாளில் எருசலேமை வந்தடைவதற்காக.’ கிரேக்கத் தொடர் அந்த நாளில் அங்கே இருப்பதையோ அந்த நாளில் அங்கே வந்தடைவதையோ வலியுறுத்தக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: தீர்மானித்திருந்தார்
  rationale: இறந்தகாலத்தில் ஏற்கெனவே எடுக்கப்பட்ட உறுதியான முடிவைக் காட்டும் இறந்தகால நிறைவுணர்வைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: எபேசுவைக் கடந்து கப்பலில் செல்ல
  rationale: எபேசுவில் நிற்காமல் கடல்வழியாக அதைக் கடந்து செல்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: காலம் செலவிட நேரிடாதபடி
  rationale: காலதாமதம் அல்லது அங்கே நேரம் செலவிட வேண்டிய நிலையைத் தவிர்ப்பது என்ற இடியோமிய பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: ஆசியாவில்
  rationale: மூலத்தின் இடப்பெயரைத் தக்கவைக்கிறது; இது நவீன கண்டத்தைக் குறிக்காமல் ரோம மாகாணத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἔσπευδεν
  choice: விரைந்து சென்றுகொண்டிருந்தார்
  rationale: பயணச் சூழலில் தொடர்ந்த அவசர முயற்சியைக் காட்டும் imperfect வினையின் அம்சத்தைப் பாதுகாக்கிறது.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: முடிந்தால்
  rationale: சாத்தியத்திற்குட்பட்ட நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: பெந்தெகொஸ்தே நாளில்
  rationale: புதிய ஏற்பாட்டில் நிலைபெற்ற பண்டிகைப் பெயரையும் குறிப்பிட்ட நாளையும் தெளிவாக வழங்குகிறது.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: எருசலேமில் இருக்க வேண்டும்
  rationale: அந்நாளில் எருசலேமில் இருக்க வேண்டும் என்ற நோக்கை இயல்பாகத் தெரிவிக்கிறது; அங்கே அந்நாளில் வந்து சேர்வது என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: நவீன தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
- source_word: πεντηκοστῆς
  choice: பெந்தெகொஸ்தே
  rationale: புதிய ஏற்பாட்டின் பண்டிகைப் பெயராகத் தமிழில் பரவலாக அறியப்படும் வடிவம்.
theological_decisions:
- issue: γενέσθαι εἰς Ἱεροσόλυμα என்பதன் கால-இட நுணுக்கம்
  choice: பெந்தெகொஸ்தே நாளில் எருசலேமில் இருக்க வேண்டும்
  alternative: பெந்தெகொஸ்தே நாளில் எருசலேமை வந்தடைய வேண்டும்
  rationale: கிரேக்கத் தொடர் அந்நாளில் அங்கே இருப்பதையோ அந்நாளில் அங்கே வந்தடைவதையோ முன்னிறுத்தக்கூடும். முதன்மை உரை இருப்பைத் தருகிறது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘காலம் செலவிட நேரிடாதபடி’ என்பது கிரேக்க இடியோமின் நோக்கை இயல்பாக வெளிப்படுத்துகிறது; genuine ambiguity அடிக்குறிப்பு [b]-இல் தக்கவைக்கப்பட்டுள்ளது.
