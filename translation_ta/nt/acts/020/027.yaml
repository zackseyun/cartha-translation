revisions:
- from: ஏனெனில், கடவுளின் முழுத் திட்டத்தையும்[a] உங்களுக்கு அறிவிக்க நான் பின்வாங்கவில்லை.
  to: ஏனெனில், கடவுளின் முழு ஆலோசனையையும்[a] உங்களுக்கு அறிவிப்பதிலிருந்து நான் பின்வாங்கவில்லை.
  rationale: The revision preserves the Greek metaphor of not shrinking back while rendering the articular infinitive naturally. It adopts ‘முழு ஆலோசனை’ for βουλή in the text to retain the source term’s broad sense without imposing a specific theological construal; the viable alternatives remain available in the footnote.
