id: ACT.20.27
reference: Acts 20:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: ta
  text: ஏனெனில், கடவுளின் முழு ஆலோசனையையும்[a] உங்களுக்கு அறிவிப்பதிலிருந்து நான் பின்வாங்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளின் முழு நோக்கத்தையும்,’ ‘கடவுளின் முழுத் திட்டத்தையும்,’ அல்லது ‘கடவுளின் முழுத் திருவுளத்தையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் γάρ என்பதன் இணைப்புப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὑπεστειλάμην
  choice: நான் பின்வாங்கவில்லை
  rationale: ὑποστέλλω என்பதன் இடைநிலை வடிவம் ஒரு செயலைச் செய்வதிலிருந்து பின்வாங்குதல் அல்லது தன்னை ஒதுக்கிக்கொள்ளுதல் என்ற உருவகப் பொருளைக் கொண்டுள்ளது. ‘பின்வாங்கவில்லை’ அந்த உருவகத்தையும் 20:20-இன் சூழல் ஒற்றுமையையும் காக்கிறது.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: அறிவிக்க
  rationale: ὑποστέλλω-வுடன் வரும் இந்த எதிர்மறை articular infinitive, பவுல் எதைச் செய்வதிலிருந்து பின்வாங்கவில்லை என்பதைச் சுட்டுகிறது. தமிழில் ‘அறிவிக்க நான் பின்வாங்கவில்லை’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: πᾶσαν
  choice: முழு
  rationale: ஒருமைச் சொல்லான βουλήν உடன் இது முழுமையைக் குறிக்கிறது; அதனால் ‘முழு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: βουλήν
  choice: திட்டம்
  rationale: βουλή என்பது ஆலோசனை, நோக்கம், திட்டம், விருப்பம்/சித்தம் ஆகிய பொருட்களைத் தரக்கூடும். இச்சூழலில் ‘திட்டம்’ இயல்பான நவீன தமிழில் கடவுளின் விரிவான நோக்கத்தையும் செயல்திட்டத்தையும் தெரிவிக்கிறது; பிற நியாயமான பொருட்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: இந்த உரிமை/மூலத்தைக் குறிக்கும் வேற்றுமை, அந்தத் திட்டம் கடவுளுக்குரியது அல்லது அவரிடமிருந்து வருவது என்பதை நேரடியாகத் தெரிவிக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: ἀναγγεῖλαι என்ற வினையுடன் வரும் கொடை வேற்றுமையை இயல்பாகத் தருகிறது; எபேசு மூப்பர்களிடமுள்ள நேரடி உரையையும் காக்கிறது.
theological_decisions:
- issue: βουλή τοῦ θεοῦ என்பதன் பொருள்
  choice: கடவுளின் முழுத் திட்டம்
  alternative: கடவுளின் முழு நோக்கம் / கடவுளின் முழுத் திருவுளம் / கடவுளின் ஆலோசனை முழுவதும்
  rationale: இந்தச் சொற்றொடர் கடவுளின் தீர்மானம், மீட்புக்கான நோக்கம், திட்டம் அல்லது சித்தம் ஆகியவற்றை வலியுறுத்தக்கூடும். முதன்மை உரையில் இயல்பான ‘திட்டம்’ பயன்படுத்தப்பட்டாலும், கிரேக்கத்தின் உண்மையான பொருள் விரிவைச் சுருக்காமல் மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘பின்வாங்கவில்லை’ மூல உருவகத்தைப் பாதுகாக்கிறது; ‘அறிவிக்க’ போதனை மற்றும் பிரகடனச் சூழலுக்கு இயல்பாக உள்ளது.
