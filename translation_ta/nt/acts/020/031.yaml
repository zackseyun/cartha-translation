id: ACT.20.31
reference: Acts 20:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: ta
  text: ஆகவே விழிப்புடன் இருங்கள். மூன்று ஆண்டுகள் இரவும் பகலும் கண்ணீரோடு ஒவ்வொருவரையும் அறிவுறுத்துவதை[a] நான் நிறுத்தவில்லை என்பதை நினைவில் கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எச்சரிப்பதை.” கிரேக்க வினைச்சொல் அறிவுறுத்துவதோடு, திருத்தும் நோக்கமுள்ள எச்சரிப்பையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய எச்சரிப்பிலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: γρηγορεῖτε
  choice: விழிப்புடன் இருங்கள்
  rationale: நிகழ்காலக் கட்டளை உணர்த்தும் தொடர்ச்சியான கண்காணிப்பையும் எச்சரிக்கையையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: μνημονεύοντες
  choice: நினைவில் கொள்ளுங்கள்
  rationale: விழிப்புடன் இருப்பதோடு இணைந்த தொடர்ச்சியான நினைவுகூருதலைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; வாக்கியத்தின் இறுதியில் வருவது இயல்பான தமிழ் தொடரமைப்புக்கு ஏற்றது.
- source_word: τριετίαν
  choice: மூன்று ஆண்டுகளாக
  rationale: கால நீட்சியைக் குறிக்கும் வேற்றுமைப் பயன்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: νύκτα καὶ ἡμέραν
  choice: இரவும் பகலும்
  rationale: மூலத்தின் சொல்வரிசையையும் இடைவிடாத செயலின் வலியுறுத்தலையும் காக்கிறது.
- source_word: οὐκ ἐπαυσάμην
  choice: நான் நிறுத்தவில்லை
  rationale: செயலைத் தளர்த்தாமலும் கைவிடாமலும் தொடர்ந்ததை நேரடியான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: μετὰ δακρύων
  choice: கண்ணீரோடு
  rationale: பவுலின் பணியோடு கண்ணீர் இணைந்திருந்த உணர்ச்சிசார் வலிமையைச் சுருக்கமாகக் காக்கிறது.
- source_word: νουθετῶν
  choice: புத்திசொல்வதை
  rationale: அறிவுறுத்துதல், திருத்துதல், எச்சரித்தல் ஆகிய பரப்பைக் கொண்ட சொல்லுக்கு இயல்பான தமிழ்ச் சொல்; வெறும் தகவல் கற்பித்தலாகக் குறுக்கவில்லை.
- source_word: ἕνα ἕκαστον
  choice: ஒவ்வொருவருக்கும்
  rationale: தனித்தனியான ஒவ்வொருவர்மீதும் செலுத்தப்பட்ட கவனத்தைத் தெளிவாகக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘உங்களில்’ என்பதைக் கூட்டவில்லை.
theological_decisions:
- issue: νουθετῶν என்பதன் மேய்ப்புப்பணி சார்ந்த திருத்தும் வலிமை
  choice: புத்திசொல்வதை
  alternative: எச்சரிப்பதை
  rationale: இந்தச் சொல் அன்போடு அறிவுறுத்துதல் மற்றும் திருத்தும் எச்சரிக்கை ஆகிய இரண்டையும் உள்ளடக்குகிறது. ‘புத்திசொல்வது’ அந்த விரிவை இயல்பான தமிழில் காக்கிறது; மாற்று பொருளை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் தர்க்கத் தொடர்பு, தொடர்ச்சியான விழிப்பு, தனிநபர் சார்ந்த மேய்ப்புக் கவனம், கண்ணீரின் உணர்ச்சிசார் வலிமை ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அது விளக்கும் νουθετῶν என்பதற்கான மொழிபெயர்ப்புக்குப் பின்பே வைக்கப்பட்டுள்ளது.
