revisions:
- from: ஆகவே விழிப்புடன் இருங்கள். மூன்று ஆண்டுகளாக, இரவும் பகலும், கண்ணீரோடு ஒவ்வொருவருக்கும் புத்திசொல்வதை[a] நான் நிறுத்தவில்லை என்பதை நினைவில் கொள்ளுங்கள்.
  to: ஆகவே விழிப்புடன் இருங்கள். மூன்று ஆண்டுகள் இரவும் பகலும் கண்ணீரோடு ஒவ்வொருவரையும் அறிவுறுத்துவதை[a] நான் நிறுத்தவில்லை என்பதை நினைவில் கொள்ளுங்கள்.
  rationale: The revision retains the draft's clear modern register and its logical connection while expressing the completed three-year period more precisely, using an idiomatic direct-object construction for individual attention, and choosing 'அறிவுறுத்துவதை' to convey νουθετέω's instructive and corrective force. The footnote remains anchored immediately after the word it explains.
