review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential force of διό, the continuing imperative γρηγορεῖτε, Paul's three-year duration, continual 'night and day' activity, tears, and individual attention. However, 'மூன்று ஆண்டுகளாக' can suggest a duration continuing up to the present; the Greek aorist statement refers to Paul's completed ministry among them and is more precisely rendered 'மூன்று ஆண்டுகள்.' 'புத்திசொல்வதை' is understandable but is somewhat colloquial and can mean merely giving advice, underrepresenting νουθετῶν's corrective, formative admonition.
  naturalness: The sentence is clear and suitably modern. Using the direct-object construction 'ஒவ்வொருவரையும் அறிவுறுத்துவதை' is more idiomatic and more closely reflects the distributive accusative ἕνα ἕκαστον than the dative 'ஒவ்வொருவருக்கும் புத்திசொல்வதை.'
  terminology: 'Use ''அறிவுறுத்துதல்'' for νουθετέω: it is dignified modern standard Tamil and retains instruction with corrective guidance without limiting the verb to warning alone. The footnote''s alternative ''எச்சரிப்பதை'' remains appropriate.'
  issues:
  - severity: medium
    issue: Completed three-year duration is rendered as 'மூன்று ஆண்டுகளாக.'
    rationale: In this past-tense autobiographical statement, 'ஆண்டுகளாக' may imply an interval extending to the present. 'மூன்று ஆண்டுகள்' naturally expresses the Greek accusative extent of time in a completed past setting.
  - severity: medium
    issue: '''புத்திசொல்வதை'' is weaker and more colloquial than νουθετῶν.'
    rationale: It may be heard as simply offering advice. 'அறிவுறுத்துவதை' better preserves the pastoral, corrective instruction denoted by νουθετέω.
  - severity: low
    issue: The dative phrase 'ஒவ்வொருவருக்கும்' is less source-proximate than a direct-object construction.
    rationale: The Greek expression is distributive accusative ('each one'). 'ஒவ்வொருவரையும்' directly represents Paul's individual action toward each person.
  revised_text: ஆகவே விழிப்புடன் இருங்கள். மூன்று ஆண்டுகள் இரவும் பகலும் கண்ணீரோடு ஒவ்வொருவரையும் அறிவுறுத்துவதை[a] நான் நிறுத்தவில்லை என்பதை நினைவில் கொள்ளுங்கள்.
