source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: ta
  text: 'எல்லா வகையிலும் நான் உங்களுக்குக் காட்டினேன்: இவ்வாறு கடினமாக உழைத்து, பலவீனமானவர்களுக்கு உதவ வேண்டும்[a]; மேலும், ஆண்டவராகிய இயேசுவின் வார்த்தைகளை நினைவில் கொள்ள வேண்டும். அவர் தாமே, ‘பெறுவதைவிடக் கொடுப்பதே அதிக பாக்கியமானது’ என்று சொன்னார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பலவீனமானவர்களை ஆதரிக்க வேண்டும்.’ கிரேக்க வினைச்சொல் தற்காலிக உதவியை மட்டுமல்லாமல், தொடர்ந்து ஆதரவளிப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: எல்லாவற்றிலும்
  rationale: வினையடையாகப் புரிந்து, பவுல் எல்லா வகையிலும் தன் நடத்தையால் எடுத்துக்காட்டியதைக் குறிக்கிறது.
- source_word: ὑπέδειξα
  choice: எடுத்துக்காட்டிக் காட்டினேன்
  rationale: வெறுமனே அறிவித்தல் அல்லாமல், சொந்த நடத்தையின் மூலம் செய்து காட்டிய பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὕτως κοπιῶντας
  choice: இவ்வாறு கடினமாக உழைத்து
  rationale: οὕτως முந்தைய சூழலில் பவுல் உழைத்த முறையைச் சுட்டுகிறது; κοπιάω கடும் முயற்சியுடன் உழைப்பதைக் குறிக்கிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: கிரேக்கத்தில் உள்ள அவசியம் அல்லது கடமை உணர்வை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀντιλαμβάνεσθαι
  choice: உதவ
  rationale: உதவுதல், ஆதரவளித்தல் ஆகிய பொருள் வரம்பைச் சுருக்காமல், பொதுவாகப் புரியும் சொல்லைத் தேர்ந்தெடுக்கிறது; நீடித்த ஆதரவு என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῶν ἀσθενούντων
  choice: பலவீனமானவர்களுக்கு
  rationale: உடல், பொருளாதார அல்லது சமூக பலவீனம் என்று ஒன்றுக்குள் குறுக்காமல் கிரேக்கச் சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: μνημονεύειν τε
  choice: மேலும் ... நினைவில் கொள்ள வேண்டும்
  rationale: முந்தைய கடமையுடன் இணைக்கப்பட்ட இரண்டாவது கடமையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: ஆண்டவராகிய இயேசுவின் வார்த்தைகளை
  rationale: λόγοι என்பதற்கு நேரடியான ‘வார்த்தைகள்’ என்பதையும், κύριος என்ற பட்டத்தையும் பாதுகாக்கிறது.
- source_word: αὐτὸς εἶπεν
  choice: அவரே சொன்னார்
  rationale: αὐτός தரும் வலியுறுத்தலை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: பெற்றுக்கொள்வதைவிடக் கொடுப்பதே அதிக ஆசீர்வாதமானது
  rationale: ஒப்பீட்டையும் கொடுப்பதன்மீது உள்ள வலியுறுத்தலையும் காக்கிறது; μακάριον என்பதன் இறையியல் நிறமுள்ள பொருளை ‘ஆசீர்வாதமானது’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘பலவீனமானவர்கள்’ என்பதன் வரம்பு
  choice: பலவீனமானவர்கள்
  alternative: ஏழைகள்; நோயாளிகள்; விசுவாசத்தில் பலவீனமானவர்கள்
  rationale: ἀσθενούντων என்ற சொல் பல வகையான பலவீனத்தைக் குறிக்கலாம். உடனடிச் சூழல் தேவைப்படுவோருக்கு உழைத்து உதவுவதைச் சுட்டினாலும், ஒரு குறிப்பிட்ட வகைக்குள் பொருளைச் சுருக்கவில்லை.
- issue: μακάριον என்பதன் மொழிபெயர்ப்பு
  choice: ஆசீர்வாதமானது
  alternative: பாக்கியமானது; அதிக மகிழ்ச்சி தருவது
  rationale: இது வெறும் மனமகிழ்ச்சியை விட இறைவனுடைய அங்கீகாரம் மற்றும் நன்மை என்ற நிறத்தைக் கொண்டிருக்கலாம். ‘ஆசீர்வாதமானது’ அந்தத் திறந்த இறையியல் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. ‘எடுத்துக்காட்டிக் காட்டினேன்’ என்பது பவுலின் வாழ்வியல் முன்மாதிரியை வெளிப்படுத்துகிறது; ‘பலவீனமானவர்கள்’ என்பது மூலத்தின் திட்டமிட்ட பரந்த பொருளைத் தக்கவைக்கிறது.
