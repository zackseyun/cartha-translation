revisions:
- from: 'எல்லாவற்றிலும் நான் உங்களுக்கு எடுத்துக்காட்டிக் காட்டினேன்: இவ்வாறு கடினமாக உழைத்து, பலவீனமானவர்களுக்கு உதவ வேண்டும்[a]; மேலும், ஆண்டவராகிய இயேசுவின் வார்த்தைகளை நினைவில் கொள்ள வேண்டும். ஏனெனில், ‘பெற்றுக்கொள்வதைவிடக் கொடுப்பதே அதிக ஆசீர்வாதமானது’ என்று அவரே சொன்னார்.'
  to: 'எல்லா வகையிலும் நான் உங்களுக்குக் காட்டினேன்: இவ்வாறு கடினமாக உழைத்து, பலவீனமானவர்களுக்கு உதவ வேண்டும்[a]; மேலும், ஆண்டவராகிய இயேசுவின் வார்த்தைகளை நினைவில் கொள்ள வேண்டும். அவர் தாமே, ‘பெறுவதைவிடக் கொடுப்பதே அதிக பாக்கியமானது’ என்று சொன்னார்.'
