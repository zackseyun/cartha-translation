translation:
  language: ta
  text: இவர்கள் முன்னே சென்று, துரோவாவில் எங்களுக்காகக் காத்திருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'முறையான மாற்று: “இவர்கள் முன்னே சென்றபின், துரோவாவில் எங்களுக்காகக் காத்திருந்தார்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: முன்பு பெயரிடப்பட்ட ஆண் பயணத் தோழர்களைக் குறிக்கும் ஆண்பால் பன்மைச் சுட்டுப்பெயர்; தமிழில் இயல்பாகவும் தெளிவாகவும் ‘இவர்கள்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: δὲ
  choice: —
  rationale: இது மென்மையான இணைப்புச் சொல். இவ்விடத்தில் தமிழின் இயல்பான ஓட்டத்திற்கு தனியாக மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: προσελθόντες
  choice: முன்னதாகச் சென்று
  rationale: இப்பயணச் சூழலில், பேசுபவரின் குழுவுக்கு முன்பாகச் சென்ற செயலைப் பங்கேற்புவினை குறிக்கிறது; ‘முன்னதாகச் சென்று’ என்பது அதன் காலத் தொடர்பையும் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔμενον
  choice: காத்திருந்தார்கள்
  rationale: μένω என்பதன் அடிப்படைப் பொருள் ‘தங்கியிரு/நிலைத்திரு’; ஆனால் ἡμᾶς என்னும் நபரைக் குறிக்கும் செயப்படுபொருளுடனும் இப்பயணச் சூழலிலும், அவர்கள் வரும்வரை காத்திருந்தார்கள் என்பதே பொருள். இறந்தகாலத் தொடர்ச்சியையும் இச்சொல் வெளிப்படுத்துகிறது.
- source_word: ἡμᾶς
  choice: எங்களுக்காக
  rationale: முதல் நபர் பன்மைப் பெயர்ச்சொல்; ‘காத்திரு’ என்பதுடன் தமிழில் இயல்பாக ‘எங்களுக்காக’ என அமைகிறது.
- source_word: ἐν Τρῳάδι
  choice: துரோவாவில்
  rationale: ἐν மற்றும் இடப்பெயரின் வேற்றுமை வடிவம் இடத்தைக் குறிக்கின்றன; தமிழில் இடவேற்றுமையுடன் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
