source:
  edition: SBLGNT
  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: ta
  text: அவர் அசோசில் எங்களைச் சந்தித்தபோது[a], அவரைக் கப்பலில் ஏற்றிக்கொண்டு மித்திலேனேவுக்குச் சென்றோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அசோசில் எங்களுடன் சேர்ந்தபோது’ அல்லது ‘அசோசில் எங்களோடு கூடிவந்தபோது.’ கிரேக்க வினை சந்திப்பதையோ ஒன்றுசேர்வதையோ குறிக்கலாம்; இங்கே பவுல் அங்கு மீண்டும் பயணக் குழுவுடன் சேர்ந்தார் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: சந்தித்தபோது
  rationale: பயணச் சூழலில் இந்த வினை, பவுல் அசோசில் கப்பலில் வந்த குழுவினரைச் சந்தித்து மீண்டும் அவர்களுடன் சேர்ந்ததைக் குறிக்கிறது. தமிழில் இயல்பாகவும் மூலத்தின் பொருள் விரிவை அதிகமாகச் சுருக்காமலும் இருப்பதால் ‘சந்தித்தபோது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἡμῖν
  choice: எங்களை
  rationale: கப்பலில் பயணம் செய்த குழுவைக் குறிக்கும் பன்மை இடப்பெயர்; ‘சந்தித்தார்’ என்ற தமிழ் வினையுடன் இயல்பாகச் செயப்படுபொருள் வடிவில் வருகிறது.
- source_word: εἰς τὴν Ἆσσον
  choice: அசோசில்
  rationale: εἰς பொதுவாகத் திசையைக் குறித்தாலும், சந்திப்பு நிகழ்ந்த இடத்தைத் தமிழில் இயல்பாகக் காட்ட ‘அசோசில்’ என்று வழங்கப்பட்டது.
- source_word: ἀναλαβόντες
  choice: கப்பலில் ஏற்றிக்கொண்டு
  rationale: இது கடற்பயணச் சூழல் என்பதால், அவரைக் குழுவுடன் அழைத்துக்கொண்டது கப்பலில் ஏற்றிக்கொண்டதைக் குறிக்கிறது. மூலத்தில் மறைமுகமாக உள்ள கடற்பயணச் சூழலைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட பவுலைக் குறிக்கிறது; மரியாதைமிக்க நவீன தமிழில் ‘அவரை’ இயல்பானது.
- source_word: ἤλθομεν
  choice: சென்றோம்
  rationale: புறப்பட்ட இடத்திலிருந்து இலக்கை நோக்கிய பயணத்தைத் தமிழில் ‘சென்றோம்’ என்பது இயல்பாக வெளிப்படுத்துகிறது; ‘வந்தோம்’ என்பதும் சாத்தியமானாலும் இங்கு கதைநடையில் குறைவாக இயலும்.
- source_word: εἰς Μιτυλήνην
  choice: மித்திலேனேவுக்கு
  rationale: இலக்கைச் சுட்டும் εἰς என்பதற்கு தமிழ் திசை வேற்றுமை உருபு பயன்படுத்தப்பட்டது; கிரேக்க இடப்பெயரின் ஒலிப்பை அண்மையாகப் பேணுகிறது.
