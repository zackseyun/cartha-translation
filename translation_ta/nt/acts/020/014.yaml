  source_fidelity: முதன்மை உரை συνέβαλλεν என்பதைச் சூழலுக்கு ஏற்றவாறு “சந்தித்தபோது” எனவும், ἀναλαβόντες என்பதை கடற்பயணச் சூழலைச் சரியாக வெளிப்படுத்தும் “கப்பலில் ஏற்றிக்கொண்டு” எனவும் மொழிபெயர்க்கிறது. ἡμῖν, αὐτόν, மற்றும் மித்திலேனேவை நோக்கிய பயணம் ஆகியவை துல்லியமாகப் பேணப்பட்டுள்ளன.
  naturalness: உரை நவீன நிலையான தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது. “அவரைக் கப்பலில் ஏற்றிக்கொண்டு ... சென்றோம்” என்ற தொடர் கதைநடைக்கு ஏற்றது.
