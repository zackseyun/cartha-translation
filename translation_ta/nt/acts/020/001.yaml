translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் நிகழ்வு வரிசையும் சீடர்கள் என்ற லூக்காவின் சொல்லாட்சியும் பாதுகாக்கப்பட்டுள்ளன; ἀσπάζομαι என்பதிலுள்ள உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
