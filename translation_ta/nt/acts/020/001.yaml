  terminology: «சீடர்கள்» அப்போஸ்தலர் நூலில் μαθηταί என்பதற்குரிய நிலையான சொல்லாட்சியைப் பாதுகாக்கிறது. «கலகம்» இச்சூழலின் பொதுத் துமள/கிளர்ச்சி உணர்வைத் தகுந்தவாறு தருகிறது. ἀσπάζομαι என்பதன் சூழல்சார் «விடைபெற்று» என்ற பொருளும் அதன் «வாழ்த்தி» என்ற மாற்றும் அடிக்குறிப்பில் முறையாகக் காக்கப்பட்டுள்ளன.
