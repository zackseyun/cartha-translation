  source_fidelity: 'மூலக் கிரேக்கத்தின் நிகழ்வுவரிசை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளது: கலகம் அடங்குதல், பவுல் சீடர்களை வரவழைத்தல், ஊக்கப்படுத்தல், விடைபெறுதல், மக்கெதோனியாவுக்குப் புறப்படுதல். «வரவழைத்து» μεταπεμψάμενος என்பதற்கும், «ஊக்கப்படுத்தி» παρακαλέσας என்பதற்கும் பொருத்தமானவை. «போவதற்காகப் புறப்பட்டார்» ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν என்பதன் பயண நோக்கத்தை இயல்பாகத் தருகிறது.'
