id: ACT.20.1
reference: Acts 20:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: ta
  text: கலகம் அடங்கிய பிறகு, பவுல் சீடர்களை வரவழைத்து, அவர்களை ஊக்கப்படுத்தி, அவர்களிடம் விடைபெற்று[a], மக்கெதோனியாவுக்குப் போவதற்காகப் புறப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை வாழ்த்தி.” ἀσπάζομαι என்ற கிரேக்கச் சொல் வாழ்த்துவதையும், புறப்படும் சூழலில் விடைபெறுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: கலகம் அடங்கிய பிறகு
  rationale: μετά உடன் வரும் வினையெச்சத் தொடர் கால வரிசையைச் சுட்டுகிறது; θόρυβος இங்கு எபேசுவில் நடந்த பொதுக் கலகத்தைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இத்தொடர் இரண்டையும் தெளிவாகத் தருகிறது.
- source_word: μεταπεμψάμενος
  choice: வரவழைத்து
  rationale: ஒருவரைத் தன்னிடம் வரும்படி ஆள் அனுப்பி அழைப்பது என்ற இடைநிலை வினையின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τοὺς μαθητὰς
  choice: சீடர்களை
  rationale: அப்போஸ்தலர் நூலில் இயேசுவைப் பின்பற்றுகிறவர்களைக் குறிக்கும் லூக்காவின் வழக்கமான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: παρακαλέσας
  choice: அவர்களை ஊக்கப்படுத்தி
  rationale: παρακαλέω என்பதில் அறிவுறுத்துதல், ஆறுதலளித்தல், ஊக்கமளித்தல் ஆகிய பொருள் நிழல்கள் உள்ளன; கலகத்துக்குப் பிந்தைய பிரிவுச் சூழலில் ‘ஊக்கப்படுத்தி’ என்பது அவற்றைத் தேவையின்றி குறுக்காமல் இயல்பாகத் தருகிறது.
- source_word: ἀσπασάμενος
  choice: அவர்களிடம் விடைபெற்று
  rationale: இந்த வினை பொதுவாக வாழ்த்துதல் எனப் பொருள்பட்டாலும், புறப்படும் சூழலில் விடைபெறுதலையும் குறிக்கலாம். நிகழ்வின் சூழலுக்கு ‘விடைபெற்று’ பொருத்தமானது; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: மக்கெதோனியாவுக்குப் போவதற்காகப் புறப்பட்டார்
  rationale: ἐξῆλθεν இங்கு பயணப் புறப்பாட்டைக் குறிக்கிறது; πορεύεσθαι என்ற வினையெச்சம் நோக்கத்தையும் εἰς Μακεδονίαν சென்றடைய வேண்டிய இடத்தையும் தெரிவிக்கிறது.
