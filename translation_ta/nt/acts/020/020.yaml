source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: ta
  text: உங்களுக்குப் பயனளிக்கும் எதையும் உங்களுக்கு அறிவிப்பதிலிருந்தும், பொது இடங்களிலும் வீடுவீடாகவும் உங்களுக்குக் கற்பிப்பதிலிருந்தும் நான் பின்வாங்கவில்லை என்பதைக் குறித்து எவ்வாறு [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்குப் பயனளிக்கும் எதையும் உங்களுக்கு அறிவிப்பதிலிருந்தும், பொது இடங்களிலும் வீடுவீடாகவும் உங்களுக்குக் கற்பிப்பதிலிருந்தும் நான் தடுத்துக்கொள்ளவில்லை.”
    reason: ὑπεστειλάμην என்பதற்கு இச்சூழலில் ‘பின்வாங்கவில்லை’ என்பதோடு ‘தடுத்துக்கொள்ளவில்லை / ஒதுக்கிவைக்கவில்லை’ என்ற பொருளும் சாத்தியம்.
lexical_decisions:
- source_word: ὑπεστειλάμην
  choice: நான் பின்வாங்கவில்லை
  rationale: நடுவினை வடிவிலுள்ள ὑποστέλλω, ஒரு செயலைச் செய்யத் தயங்கி விலகுதல் அல்லது தன்னைப் பின்வாங்கிக்கொள்ளுதல் என்ற பொருளைக் கொண்டது. ‘பின்வாங்கவில்லை’ அதன் உருவக வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: τῶν συμφερόντων
  choice: உங்களுக்குப் பயனளிக்கும் எதையும்
  rationale: συμφέρω என்பதிலிருந்து வந்த இச்சொல் பயனுள்ள அல்லது நன்மை தருகிறவற்றைக் குறிக்கிறது. சூழலில் கேட்போருக்கு ஊழியத்தின் வழியாகக் கிடைக்கும் நன்மையைக் குறித்தாலும், ‘பயனளிக்கும்’ என்பது பொருளை தேவையின்றி ஆன்மிக நன்மை என்று மட்டும் சுருக்கவில்லை.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: அறிவிக்காமலோ
  rationale: μή உடன் வரும் பெயர்ச்சொல் தன்மையுடைய வினையெச்சம், பவுல் எதைச் செய்வதிலிருந்து பின்வாங்கவில்லை என்பதை விளக்குகிறது. தமிழில் எதிர்மறை வினையெச்சமும் இறுதியில் வரும் ‘பின்வாங்கவில்லை’ என்பதும் கிரேக்கத்தின் இரட்டை எதிர்மறை உறவை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: ἀναγγεῖλαι
  choice: அறிவிக்க
  rationale: ἀναγγέλλω என்பது தெரிவிக்க, அறிவிக்க, அறியச் செய்ய என்பதாகும். ‘அறிவிக்க’ என்பது கற்பித்தலிலிருந்து தொடர்புடையதாயினும் தனித்த செயலாக இதைக் காட்டுகிறது.
- source_word: διδάξαι
  choice: கற்பிக்க
  rationale: διδάσκω என்பதன் நேரடியான, இயல்பான தமிழ் இணை ‘கற்பிக்க’ ஆகும்.
- source_word: δημοσίᾳ
  choice: பொது இடங்களில்
  rationale: இந்த வினையடை திறந்த பொதுச் சூழல்களைக் குறிக்கிறது. ‘பொது இடங்களில்’ என்பது நவீன தமிழில் தெளிவான இயல்பான வடிவம்.
- source_word: κατ’ οἴκους
  choice: வீடுவீடாக
  rationale: κατά உடன் வரும் பன்மைச் சொல் பகிர்ந்தளிக்கும் பொருளைக் கொண்டதால், ஒரு வீட்டிலிருந்து மற்றொரு வீட்டிற்கு நிகழ்ந்த ஊழியத்தை ‘வீடுவீடாக’ சுருக்கமாகவும் துல்லியமாகவும் காட்டுகிறது.
- source_word: ὡς
  choice: என்பதையும்
  rationale: முந்தைய வசனங்களிலிருந்து தொடரும் நினைவூட்டலின் உள்ளடக்கத்தை ὡς அறிமுகப்படுத்துகிறது. தனி வசனமாக வாசிக்கத் தெளிவளிக்க ‘என்பதையும் நீங்கள் அறிவீர்கள்’ எனச் சூழலோடு இணைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘பயனளிக்கும்’ என்பதன் வரம்பு
  choice: பயனுள்ள அல்லது நன்மை தரும் அனைத்தையும் குறிக்கும் பரந்த சொல்லாக்கம்
  alternative: ஆன்மிக நன்மை தரும் எதையும்
  rationale: எபேசுவில் பவுல் செய்த போதனை ஊழியமே உடனடிச் சூழல் என்பதால் ஆன்மிக, மேய்ப்புப் பயன் முதன்மையாக இருக்கலாம். ஆயினும் மூலச்சொல் கூறுவதைக் காட்டிலும் குறுக்காமல், முதன்மை உரை அதன் பரந்த பொருளைக் காக்கிறது.
- issue: இரண்டு வினையெச்சங்களின் இலக்கணத் தொடர்பு
  choice: ‘அறிவிக்காமலோ … கற்பிக்காமலோ நான் பின்வாங்கவில்லை’ என ஒரே முதன்மை வினையின் கீழ் இணைத்தல்
  alternative: அறிவிப்பதிலிருந்தும் கற்பிப்பதிலிருந்தும் தனித்தனியே பின்வாங்கவில்லை
  rationale: கிரேக்கத்தில் ἀναγγεῖλαι மற்றும் διδάξαι ஆகிய இரண்டும் ὑπεστειλάμην என்பதோடு தொடர்புபடுகின்றன. தமிழ் அமைப்பு அந்த ஒற்றை ஆளுகை உறவைக் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடுவீடாக’ பகிர்ந்தளிக்கும் கிரேக்கக் கட்டமைப்பைக் காக்கிறது. வசனம் தனித்த மேற்கோளாக வழங்கப்பட்டதால், முந்தைய சூழலுடன் இணைக்கும் ‘என்பதையும் நீங்கள் அறிவீர்கள்’ சேர்க்கப்பட்டுள்ளது.
