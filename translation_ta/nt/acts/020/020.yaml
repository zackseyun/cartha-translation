  source_fidelity: திருத்தம் தேவை. வரைவு ὑπεστειλάμην மற்றும் இரு infinitive-களின் தொடர்பை பெரும்பாலும் சரியாகக் காட்டினாலும், மூலத்தில் இவ்வசனத்தில் இல்லாத ‘என்பதையும் நீங்கள் அறிவீர்கள்’ என்பதைச் சேர்க்கிறது. அது முந்தைய சூழலின் கருத்தை இவ்வசனத்திற்குள் கொண்டுவருகிறது. மேலும் ‘அறிவிக்காமலோ ... கற்பிக்காமலோ நான் பின்வாங்கவில்லை’ என்ற அமைப்பு தவிர்க்கப்பட்ட செயல்களையே நேரடியாகக் கூறுவதால், ‘அறிவிப்பதிலிருந்தும் ... கற்பிப்பதிலிருந்தும்’ என்ற வடிவம் மூலத்தின் ‘செய்வதிலிருந்து பின்வாங்கவில்லை’ என்ற உறவைத் தெளிவாகக் காட்டும்.
  naturalness: ‘எவ்வாறு ... நான் பின்வாங்கவில்லை’ என்ற தொடர் நவீன தரநிலைத் தமிழில் இயல்பாகவும், முந்தைய வசனத் தொடர்ச்சியைச் சுட்டுவதாகவும் உள்ளது. ‘பொது இடங்களிலும் வீடுவீடாகவும்’ என்பது பொது மற்றும் இல்லம்சார் ஊழியத்தின் வேறுபாட்டையும் κατά-வின் பகிர்வுப் பொருளையும் தெளிவாகக் காக்கிறது.
  terminology: ‘பயனளிக்கும்’, ‘அறிவித்தல்’, ‘கற்பித்தல்’, ‘பின்வாங்குதல்’ ஆகியவை மூலத்தின் பரந்த பொருளையும் கண்ணியமான பொதுவாசக நடைமுறையையும் காக்கின்றன. ‘ஒதுக்கிவைத்தல்’ என்பது இச்சூழலில் சாத்தியமான மாற்றுப் பொருள்; ஆனால் அடிக்குறிப்பு அதை முதன்மை உரையின் முழுமையான மாற்று வாசகமாகத் துல்லியமாக வழங்க வேண்டும்.
