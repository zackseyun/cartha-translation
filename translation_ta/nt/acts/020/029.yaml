  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: ta
  text: நான் புறப்பட்டுப் போன பிறகு[a], கொடிய[b] ஓநாய்கள் உங்களுக்குள் நுழைந்து, மந்தையின்மேல் இரக்கம் காட்டமாட்டார்கள் என்று எனக்குத் தெரியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “நான் வந்த பிறகு” அல்லது “என் வருகைக்குப் பிறகு”; இச்சூழலில், பவுல் புறப்பட்டுச் சென்ற பிறகு என்பது பொருள்.'
    reason: lexical_alternative
  - marker: b
    text: “மூர்க்கமான” என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பெயரடை கடுமையான, ஒடுக்குகிற அல்லது வன்மையான தன்மையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: எனக்குத் தெரியும்
  rationale: பவுலின் உறுதியான அறிவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது; இது வெறும் கருத்தையோ ஊகத்தையோ குறிக்கவில்லை.
- source_word: εἰσελεύσονται
  choice: நுழைந்து
  rationale: ஓநாய்கள் சமூகத்தின் நடுவுக்குள் வருவதைச் சுட்டுகிறது; தமிழில் இயக்கத்தையும் ஊடுருவலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: நான் புறப்பட்டுப் போன பிறகு
  rationale: ἄφιξις பொதுவாக வருகையைக் குறிக்கக்கூடியது; ஆனால் பவுல் அங்கிருந்து சென்ற பின்பு நிகழப்போவதைப் பற்றிய எச்சரிக்கையே சூழலில் தெளிவாக உள்ளது. ஆகவே சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: λύκοι βαρεῖς
  choice: கொடிய ஓநாய்கள்
  rationale: βαρεῖς என்பதன் சொற்பொருள் ‘கனமான’ என்றாலும், இங்கு கடுமையான, ஆபத்தான, இரக்கமற்ற தன்மையைக் குறிக்கிறது. ‘கொடிய’ என்பது உருவகத்தின் வேட்டையாடும் ஆபத்தைத் தெளிவாகக் காக்கிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்குள்
  rationale: சொல்லமைப்பில் உள்ள ‘உள்ளே/நோக்கி’ என்ற இயக்கத்தையும், சமூகத்துக்குள் ஊடுருவும் ஓநாய்களின் உருவகத்தையும் காக்கிறது.
- source_word: μὴ φειδόμενοι
  choice: தப்பவிட மாட்டார்கள்
  rationale: மந்தையின் எவரையும் விட்டுவைக்காத இரக்கமற்ற செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τοῦ ποιμνίου
  choice: மந்தையை
  rationale: திருச்சபைச் சமூகத்தைக் குறிக்கும் மேய்ப்பர் உருவகத்தையும் ஓநாய் உருவகத்துடனான தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: ‘ஓநாய்கள்’ என்ற உருவகத்தின் பொருள்
  choice: ‘கொடிய ஓநாய்கள்’ என்ற உருவகத்தை மொழிபெயர்ப்பிலேயே வைத்திருத்தல்
  alternative: அழிவை உண்டாக்கும் மனிதர்கள் / பொய்ப் போதகர்கள் / ஒடுக்குபவர்கள்
  rationale: இந்த வசனம் ஓநாய்கள் யாரைக் குறிப்பதாகும் என்பதை வெளிப்படையாகக் குறுக்கி வரையறுக்கவில்லை. உருவகத்தை அப்படியே வைத்திருப்பது அதன் எச்சரிக்கை வலிமையைக் காத்து, ஒரு குறிப்பிட்ட விளக்கத்தை உரைக்குள் புகுத்துவதைத் தவிர்க்கிறது.
- issue: ἄφιξις என்பதன் சூழல்சார் பொருள்
  choice: ‘புறப்பட்டுப் போன பிறகு’
  alternative: ‘வந்த பிறகு’ / ‘வருகைக்குப் பிறகு’
  rationale: இந்தப் பெயர்ச்சொல் வருகையைக் குறிக்கக்கூடியதாயினும், பவுல் இனி அவர்களுடன் இல்லாத காலத்தில் நிகழப்போவதை உரையாடல் சூழல் சுட்டுகிறது. பிரதான உரை அந்தச் சூழல்சார் பொருளைத் தருகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ஓநாய்–மந்தை உருவகம் காக்கப்பட்டுள்ளது. ‘புறப்பட்டுப் போன பிறகு’ என்பது சூழல்சார் தெளிவைத் தருகிறது; மூலத்தின் அரிதான சொற்பொருள் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
