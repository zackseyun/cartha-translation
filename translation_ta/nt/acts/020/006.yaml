translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘நாங்களோ’ என்பது δέ-யின் மென்மையான மாறுபாட்டையும் பயணக் குழுவின் மாற்றத்தையும் காட்டுகிறது. பண்டிகையின் தன்மையைத் தெளிவுபடுத்த ‘புளிப்பில்லா அப்பப் பண்டிகை’ பயன்படுத்தப்பட்டது.
