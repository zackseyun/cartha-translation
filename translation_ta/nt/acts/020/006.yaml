source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: ta
  text: நாங்களோ புளிப்பில்லா அப்பப் பண்டிகை நாட்களுக்குப் பின்பு பிலிப்பியிலிருந்து கப்பலில் புறப்பட்டு, ஐந்து நாட்களில்[a] துரோவாவில் அவர்களிடம் வந்து சேர்ந்தோம். அங்கே ஏழு நாட்கள் தங்கியிருந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஐந்து நாட்களுக்குள்.’ கிரேக்கச் சொற்றொடர் அவர்கள் வந்து சேரும்வரை பயணம் நீடித்த காலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: கப்பலில் புறப்பட்டு
  rationale: ἐκπλέω என்பது கப்பல் மூலம் ஒரு இடத்திலிருந்து புறப்படுவதைக் குறிப்பதால், இயல்பான நவீனத் தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: புளிப்பில்லா அப்பப் பண்டிகை நாட்களுக்குப் பின்பு
  rationale: மூலத்தில் உள்ள ‘புளிப்பில்லாதவற்றின் நாட்கள்’ என்பது யூதர்களின் புளிப்பில்லா அப்பப் பண்டிகைக் காலத்தைக் குறிக்கிறது; ‘நாட்கள்’ என்ற காலக் குறிப்பும் தக்கவைக்கப்பட்டது.
- source_word: ἀπὸ Φιλίππων
  choice: பிலிப்பியிலிருந்து
  rationale: ἀπό குறிக்கும் புறப்படும் இடம் தெளிவாகவும், Φίλιπποι என்ற நகரப்பெயர் வழக்கமான தமிழ் வடிவிலும் தரப்பட்டது.
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: அவர்களிடம் வந்து சேர்ந்தோம்
  rationale: πρός உடன் வரும் இயக்கம் நபர்களை நோக்கிச் சென்று அவர்களிடம் சேர்வதைக் குறிக்கிறது; தேவையற்ற விளக்கத்தைச் சேர்க்காமல் இயல்பான தமிழில் தரப்பட்டது.
- source_word: εἰς τὴν Τρῳάδα
  choice: துரோவாவில்
  rationale: இலக்கிடமான துரோவாவை, ‘அவர்களிடம் வந்து சேர்ந்தோம்’ என்பதுடன் இயல்பாக இணையும் இடவெற்றுமையில் மொழிபெயர்க்கப்பட்டது.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: ஐந்து நாட்களில்
  rationale: பயணம் வருகைவரை நீண்ட கால அளவை இச்சொற்றொடர் குறிக்கிறது. ‘ஐந்து நாட்களில்’ என்பது தமிழில் அந்தப் பயணக் காலத்தை இயல்பாகச் சொல்கிறது; அதன் சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὗ
  choice: அங்கே
  rationale: οὗ முன்னர் குறிப்பிடப்பட்ட துரோவாவைக் குறிக்கும் இடவினையுரிச்சொல்; புதிய தமிழ் வாக்கியத்தில் ‘அங்கே’ இயல்பாக உள்ளது.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: ஏழு நாட்கள் தங்கியிருந்தோம்
  rationale: διατρίβω இப்பயணச் சூழலில் ஓர் இடத்தில் காலம் தங்கியிருப்பதைக் குறிக்கிறது; தொடர்ச்சியான தங்குதலை ‘தங்கியிருந்தோம்’ இயல்பாக வெளிப்படுத்துகிறது.
