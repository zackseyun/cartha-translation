source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: ta
  text: இப்போது நான் உங்களைக் கடவுளிடமும் அவருடைய அருளின் வார்த்தையிடமும் ஒப்படைக்கிறேன். அந்த வார்த்தை உங்களை கட்டியெழுப்பவும், பரிசுத்தமாக்கப்பட்ட அனைவரோடும் சேர்ந்து பெறும் உரிமைப்பங்கை உங்களுக்கு அளிக்கவும் வல்லது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களை கட்டியெழுப்பவும், பரிசுத்தமாக்கப்பட்ட அனைவரோடும் சேர்ந்து பெறும் உரிமைப்பங்கை உங்களுக்கு அளிக்கவும் வல்லவராகிய கடவுளிடம்’ என்று பொருள் கொள்ளலாம். இவ்வாறு எடுத்தால் ‘வல்லவர்’ என்பது முதன்மையாகக் கடவுளைக் குறிக்கும்.
    reason: alternative_reading
lexical_decisions:
- source_word: παρατίθεμαι
  choice: ஒப்படைக்கிறேன்
  rationale: நடுவினை வடிவம், கேட்பவர்களைக் கடவுளின் பாதுகாப்பிலும் பொறுப்பிலும் வைப்பதைக் குறிக்கிறது; நவீனத் தமிழில் ‘ஒப்படைக்கிறேன்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τῷ θεῷ
  choice: கடவுளிடம்
  rationale: παρατίθεμαι என்பதுடன் வரும் தத்திவேற்றுமை, யாரிடம் ஒப்படைக்கப்படுகிறார்கள் என்பதைக் குறிக்கிறது.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: அவருடைய அருளின் வார்த்தையிடம்
  rationale: λόγος என்பதன் ‘வார்த்தை/அறிவிக்கப்பட்ட செய்தி’ என்ற பொருளையும், τῆς χάριτος αὐτοῦ என்ற உடைமை அமைப்பையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: τῷ δυναμένῳ
  choice: வல்ல
  rationale: தத்திவேற்றுமை ஒருமைச் சொல்லெச்சம் அருகிலுள்ள ‘அருளின் வார்த்தை’ என்பதைக் குறிக்கலாம்; தமிழில் தொடரின் ambiguity முற்றிலும் இயல்பாகத் தங்காததால், முதன்மை உரை அருகிலுள்ள தொடர்பை ஏற்று, கடவுளைக் குறிக்கும் மாற்றுவாசிப்பை அடிக்குறிப்பில் தருகிறது.
- source_word: οἰκοδομῆσαι
  choice: உங்களை வளரச்செய்து
  rationale: கட்டியெழுப்புதல் என்ற உருவகத்தின் ஆவிக்குரிய வளர்ச்சி/உறுதிப்படுத்தல் பொருளை இயல்பான தமிழில் தருகிறது; சூழலில் மறைந்துள்ள செயப்படுபொருளாக ‘உங்களை’ வெளிப்படுத்துகிறது.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: உரிமைப்பங்கை அளிக்க
  rationale: δοῦναι என்பதற்கு ‘அளிக்க’ என்றும் κληρονομίαν என்பதற்கு மரபுரிமையாகப் பெறும் பங்கு என்ற வேதாகமப் பொருளைத் தாங்கும் ‘உரிமைப்பங்கு’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: பரிசுத்தமாக்கப்பட்ட அனைவரிடையிலும்
  rationale: ἡγιασμένοις என்ற நிறைவுற்ற செயப்பாட்டு சொல்லெச்சத்தின் செயல்வடிவத்தையும் தொடரும் விளைவையும் காக்கிறது; ἐν இங்கு ஒரு கூட்டத்தினிடையிலான பங்கைக் குறிக்கிறது.
theological_decisions:
- issue: τῷ δυναμένῳ என்பதன் தொடர்புச் சொல்
  choice: முதன்மை உரையில் ‘வல்ல’ என்பது அருகிலுள்ள ‘அவருடைய அருளின் வார்த்தை’ என்பதோடு தொடர்புபடுத்தப்பட்டுள்ளது.
  alternative: இது முதன்மையாகக் கடவுளைக் குறித்து, ‘வல்லவராகிய கடவுள்’ எனப் புரிந்துகொள்ளலாம்.
  rationale: இலக்கணப்படி இரண்டு தொடர்புகளும் சாத்தியம். அருகிலுள்ள பெயர்ச்சொல் ‘வார்த்தை’; அறிவிக்கப்பட்ட வார்த்தை செயலாற்றுவதாகவும் வேதாகமம் பேசுகிறது. அதேவேளை உரிமைப்பங்கை அளிக்கும் தனிப்பட்ட செயற்பாட்டாளர் கடவுள் என்பதால் மாற்றுப் புரிதலும் உண்மையான சாத்தியம்; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைக்குரிய வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘அருளின் வார்த்தை’ மூலமொழியின் இணைப்பைத் தெளிவாகக் காக்கிறது; ‘பரிசுத்தமாக்கப்பட்ட’ என்பது இறையியல் நிறமுள்ள செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
