revisions:
- from: இப்போது நான் உங்களைக் கடவுளிடமும், உங்களை வளரச்செய்து பரிசுத்தமாக்கப்பட்ட அனைவரிடையிலும் உரிமைப்பங்கை அளிக்க வல்ல அவருடைய அருளின் வார்த்தையிடமும்[a] ஒப்படைக்கிறேன்.
  to: இப்போது நான் உங்களைக் கடவுளிடமும் அவருடைய அருளின் வார்த்தையிடமும் ஒப்படைக்கிறேன். அந்த வார்த்தை உங்களை கட்டியெழுப்பவும், பரிசுத்தமாக்கப்பட்ட அனைவரோடும் சேர்ந்து பெறும் உரிமைப்பங்கை உங்களுக்கு அளிக்கவும் வல்லது.[a]
  rationale: The revision replaces an unnatural causative-growth expression with the biblical building-up metaphor, improves Tamil clause structure, and makes the implied recipients of the inheritance clear. The footnote continues to preserve the genuine ambiguity of τῷ δυναμένῳ without deciding it on theological grounds.
