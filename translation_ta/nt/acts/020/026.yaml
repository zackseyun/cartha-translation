  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: ta
  text: 'ஆகையால், இன்று உங்களிடம் நான் சாட்சியாக அறிவிப்பது இதுவே: எல்லாருடைய இரத்தப்பழிக்கும் நான் குற்றமற்றவன்[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாருடைய இரத்தத்திலிருந்தும் நான் தூய்மையானவன்.” இந்தக் கிரேக்கச் சொற்றொடர், மற்றவர்களைப் பற்றிய குற்றம் அல்லது பொறுப்பிலிருந்து விடுபட்டிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இச்சொற்கள் இரத்தப்பழியைப் பற்றிய எசேக்கியேலின் காவலன் உருவகத்தை நினைவூட்டலாம் (எசே. 3:18–19; 33:6–9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் பவுல் கூறியதிலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: μαρτύρομαι
  choice: சாட்சியாக அறிவிக்கிறேன்
  rationale: இடை/செயப்பாட்டு வடிவத்தின் தனிப்பட்ட, ஆணித்தரமான சாட்சியளிப்பு உணர்வைப் பாதுகாக்கிறது; வெறும் ‘சொல்கிறேன்’ என்பதைவிட வலிமையானது.
- source_word: ὑμῖν
  choice: உங்களிடம்
  rationale: வேற்றுமை உருபின் எளிய மறைமுகச் செயப்படுபொருள் பொருளை இயல்பான தமிழில் தருகிறது; தேவையற்ற நீதிமன்றச் சூழலைச் சேர்ப்பதில்லை.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: இன்றைய நாளில்
  rationale: ‘இன்று’ என்பதைவிட மூலத்தின் செம்மையான, ஆணித்தரமான செமித்தியத் தொடரின் தொனியை ஓரளவு பாதுகாக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: பவுலின் சாட்சியறிக்கையின் உள்ளடக்கத்தை இயல்பான தமிழ் மறைமுகக் கூற்றாக அறிமுகப்படுத்துகிறது.
- source_word: καθαρός
  choice: பொறுப்பற்றவன்
  rationale: இங்கு உடல் தூய்மையை அல்ல, குற்றம் அல்லது பொறுப்பிலிருந்து விடுபட்ட நிலையை குறிக்கிறது; தமிழில் தொடரின் நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: εἰμι
  choice: நான் ... பொறுப்பற்றவன்
  rationale: முதல் நபர் நிகழ்கால இணைப்பின் பொருள் தமிழ் பெயர்ப் பயனிலை அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: ἀπὸ τοῦ αἵματος
  choice: இரத்தப்பழிக்கும்
  rationale: ‘இரத்தத்திலிருந்து’ என்ற சொல்லுக்கு சொல் வடிவம் தமிழில் தெளிவற்றது. ‘இரத்தப்பழி’ என்பது பிறரின் அழிவு தொடர்பான குற்றப்பொறுப்பு என்ற வேதாகமச் சொற்றொடரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: πάντων
  choice: எல்லாருடைய
  rationale: ஆண்பால் பன்மை வடிவத்தின் பரந்த மனிதக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ‘எல்லாருடைய இரத்தத்திலிருந்து தூயவன்’ என்ற சொற்றொடரின் பொருள்
  choice: தனக்குக் கொடுக்கப்பட்ட எச்சரித்து போதிக்கும் கடமையை நிறைவேற்றியதால் எல்லாருடைய இரத்தப்பழிக்கும் பொறுப்பற்றவன்
  alternative: யாருடைய உடல் மரணத்திலும் நேரடிப் பங்கு இல்லாதவன் என்ற குறுகிய பொருள்
  rationale: சூழலில் பவுல் தேவனுடைய முழுத் திட்டத்தையும் அறிவிக்கத் தவறவில்லை என்கிறார். இச்சொற்றொடர் எசேக்கியேலின் காவலன் உருவகத்திலுள்ள இரத்தப்பழியை நினைவூட்டுகிறது; ஆகவே நேரடி உடல் மரணத்தை மட்டும் குறிக்கும் பொருள் போதாது. முதன்மை உரை உருவகத்தைச் சுருக்கமாக வைத்துக் கொண்டு, அடிக்குறிப்பு அதன் பின்னணியை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘சாட்சியாக அறிவிக்கிறேன்’ மற்றும் ‘இன்றைய நாளில்’ என்பவை வசனத்தின் ஆணித்தரமான தொனியைத் தக்கவைக்கின்றன. ‘இரத்தப்பழி’ மூல உருவகத்தையும் குற்றப்பொறுப்பு சார்ந்த பொருளையும் இணைக்கிறது; மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
