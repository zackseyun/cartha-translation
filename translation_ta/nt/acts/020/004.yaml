source:
  edition: SBLGNT
  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: ta
  text: பைருவின் மகனும் பெரோயாவைச் சேர்ந்தவருமான சோபத்தர் அவருடன் பயணம் செய்தார்; தெசலோனிக்கேவைச் சேர்ந்த அரிஸ்தர்க்கும் செகுந்துவும்[a], தெர்பேவைச் சேர்ந்த காயுவும், தீமோத்தேயுவும், ஆசியா மாகாணத்தைச் சேர்ந்த தீகிக்கும் துரோப்பீமும்[b] அவருடன் பயணம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “தெசலோனிக்கேயருள் [இருந்தவர்கள்]”; அதாவது, தெசலோனிக்கே நகரத்தைச் சேர்ந்தவர்கள்.'
    reason: lexical_alternative
  - marker: b
    text: இது நவீன ஆசியக் கண்டத்தை அல்ல; அக்கால ரோமப் பேரரசின் ஆசியா மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: அவருடன் சென்றார் / அவருடன் சென்றார்கள்
  rationale: இறந்தகால நிறைவுறா வினை வடிவம், பவுலுடன் பயணத்தில் சென்றுகொண்டிருந்ததைக் குறிக்கிறது. பட்டியலின் முதல் உறுப்பில் ஒருமையும், பின்னர் விடுபட்டிருக்கும் அதே வினையைத் தமிழில் தெளிவுபடுத்த பன்மையும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: பைருவின் மகனும் பெரோயாவைச் சேர்ந்தவருமான சோபத்தர்
  rationale: Πύρρου என்ற உரிமை வேற்றுமை வடிவம் தந்தைவழி அடையாளமாக இயல்பாகப் புரிகிறது; Βεροιαῖος அவரது ஊர்சார் அடையாளத்தைக் குறிக்கிறது.
- source_word: Θεσσαλονικέων
  choice: தெசலோனிக்கேயரைச் சேர்ந்த
  rationale: பன்மை உரிமை வேற்றுமை வடிவம் அரிஸ்தர்க்கையும் செகுந்தையும் தெசலோனிக்கேயர் குழுவுடன் இணைக்கிறது. இயல்பான தமிழில் அது அவர்கள் தெசலோனிக்கேயாவைச் சேர்ந்தவர்கள் என்பதைக் குறிக்கிறது.
- source_word: Γάϊος Δερβαῖος
  choice: தெர்பையைச் சேர்ந்த காயு
  rationale: Δερβαῖος என்பது காயுவின் ஊர்சார் அடையாளம்; அது தீமோத்தேயுவையும் மாற்றுவதாகக் கொள்ளப்படவில்லை.
- source_word: Ἀσιανοὶ
  choice: ஆசியாவைச் சேர்ந்த
  rationale: இச்சொல் நவீன ஆசியக் கண்டத்தை அல்ல, ரோம மாகாணமான ஆசியாவைச் சேர்ந்தவர்களைக் குறிக்கிறது; இதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: δέ ... δέ ... δέ
  choice: பட்டியல் அமைப்பில் தொடர்ச்சியான இணைப்பு
  rationale: மீண்டும் வரும் δέ பட்டியலின் குழுக்களைச் சேர்த்துக் காட்டுகிறது. தமிழில் பெயர்களோடு வரும் ‘-உம்’ இணைப்புகளும் வாக்கியப் பிரிப்பும் அதன் கூட்டுறவை இயல்பாக வெளிப்படுத்துகின்றன.
