translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. நீண்ட கிரேக்கப் பட்டியலை வாசிப்பதற்கு எளிதாக்க இரண்டு வாக்கியங்களாகப் பிரித்தாலும், எல்லாப் பெயர்களும் ஊர்சார் அடையாளங்களும் ஒரே பயணக் குழுவாக இருப்பது தெளிவாக வைக்கப்பட்டுள்ளது. நிலைபெற்ற தமிழ் வேதாகமப் பெயரெழுத்து மரபுக்கு அண்மையான வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
