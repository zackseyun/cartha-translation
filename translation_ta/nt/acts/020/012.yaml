  text: ἤγαγον δὲ τὸν παῖδα ζῶντα, καὶ παρεκλήθησαν οὐ μετρίως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/012.yaml
  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: ta
  text: அவர்கள் அந்த இளைஞனை உயிருடன் அழைத்துச் சென்றார்கள்; மிகுந்த ஆறுதல் அடைந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: அழைத்துவந்தார்கள்
  rationale: ἄγω என்பதற்கு ‘அழைத்துச் செல்’ அல்லது ‘அழைத்து வா’ என்று பொருள் வரலாம். இங்கு உயிருடன் இருந்த இளைஞனை மற்றவர்களிடம் கொண்டுவந்த செயலை இயல்பாகக் கூற ‘அழைத்துவந்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: παῖδα
  choice: இளைஞனை
  rationale: παῖς என்பது சிறுவன், பிள்ளை அல்லது பணியாள் எனப் பொருள்படலாம். இங்கு இது 9ஆம் வசனத்தில் νεανίας என அழைக்கப்பட்ட ஐத்திகுவைக் குறிப்பதால், வயதைத் துல்லியமின்றி குறைத்து விடாத ‘இளைஞன்’ பொருத்தமானது.
- source_word: ζῶντα
  choice: உயிருடன்
  rationale: இளைஞனை அவர்கள் எந்த நிலையில் அழைத்துவந்தார்கள் என்பதை இந்தப் பங்கேற்புவினை குறிக்கிறது; தமிழில் ‘உயிருடன்’ என்பது இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: παρεκλήθησαν
  choice: ஆறுதல் அடைந்தார்கள்
  rationale: παρακαλέω என்பதற்கு ஊக்கப்படுத்துதல், தேற்றுதல், ஆறுதலளித்தல் ஆகிய பொருள்கள் உண்டு. இங்கு மரணமடைந்ததாகத் தோன்றிய இளைஞன் உயிருடன் இருந்ததைக் கண்டதால் ஏற்பட்ட நிம்மதியை ‘ஆறுதல் அடைந்தார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ μετρίως
  choice: மிகுந்த
  rationale: சொல்லர்த்தமாக ‘மிதமாக அல்ல’ என்று வரும் இச்சொற்றொடர், குறைத்துக் கூறி மிகுதியை உணர்த்தும் வழக்கு. அதன் வலிமையை இயல்பான தமிழில் ‘மிகுந்த’ என்று வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் குறைத்துக் கூறும் மரபைச் சொல்லுக்குச் சொல் பின்பற்றாமல், அதன் உண்மையான வலிமையை ‘மிகுந்த’ என இயல்பாக வெளிப்படுத்துகிறது.
