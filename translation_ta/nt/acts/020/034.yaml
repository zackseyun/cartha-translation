base_translation:
  language: en
  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: ta
  text: என் தேவைகளையும் என்னுடன் இருந்தவர்களின் தேவைகளையும் இந்தக் கைகளே பூர்த்தி செய்தன என்பதை நீங்களே அறிவீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தேவைகளையும் என்னுடன் இருந்தவர்களின் தேவைகளையும் இந்தக் கைகளே நிறைவேற்ற உதவின.” கிரேக்க வினைச்சொல் நடைமுறைச் சேவையைக் குறிக்கிறது; அதன் விளைவாகப் பொருள்சார் ஆதரவும் கிடைத்ததைச் சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: நீங்களே
  rationale: வினைச்சொல்லுடன் வெளிப்படையாக வரும் வலியுறுத்தும் சுட்டுப்பெயரின் அழுத்தத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: γινώσκετε
  choice: அறிவீர்கள்
  rationale: பவுலின் நடத்தையை அவர்கள் நேரடியாக அறிந்திருந்ததை நிகழ்காலப் பொருளில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ταῖς χρείαις μου
  choice: என் தேவைகளுக்கும்
  rationale: χρεία இச்சூழலில் அன்றாட நடைமுறை அல்லது பொருள்சார் தேவைகளைக் குறிக்கிறது; ‘தேவைகள்’ என்பது இயல்பான, பரந்த தமிழ்ச் சொல்.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: என்னுடன் இருந்தவர்களின் தேவைகளுக்கும்
  rationale: மூலத்தின் ‘என்னுடன் இருந்தவர்கள்’ என்ற குறிப்பிடுதலை உறவை மேலதிகமாக வரையறுக்காமல் காக்கிறது; இணையான தத்திவ் அமைப்பின் காரணமாக ‘தேவைகளுக்கும்’ என்பது தமிழில் மீண்டும் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ὑπηρέτησαν
  choice: உழைத்து உதவின
  rationale: ‘இந்தக் கைகள்’ என்பதே எழுவாயாக இருப்பதால், நடைமுறைச் சேவையையும் பவுலின் கைவேலையையும் இயல்பான தமிழில் சித்தரிக்கிறது; பொருளாதார ஆதரவு என்ற விளைவை முதன்மை உரையில் மட்டும் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் தெரிவிக்கிறது.
- source_word: αἱ χεῖρες αὗται
  choice: இந்தக் கைகளே
  rationale: சுட்டும் தன்மையையும் வலியுறுத்தலையும் ‘இந்த’ மற்றும் ‘-ஏ’ மூலம் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘என் சொந்த’ என்பதைச் சேர்க்கவில்லை.
