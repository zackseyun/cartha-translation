source:
  edition: SBLGNT
  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: ta
  text: மிகுந்த மனத்தாழ்மையுடனும், கண்ணீருடனும், யூதர்களின் சதிகளால் எனக்கு நேரிட்ட சோதனைகளுடனும் ஆண்டவருக்குப் பணிசெய்தேன்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சோதனைகள்” என்பதற்கு “துன்பங்கள்” அல்லது “பரீட்சிப்புகள்” என்றும் பொருள் கொள்ளலாம்; இங்கு எதிர்ப்பினால் ஏற்பட்ட வெளிப்புற இன்னல்களே குறிக்கப்படுகின்றன.
    reason: lexical_alternative
  - marker: b
    text: இது பவுலுக்கு எதிராகச் சதிசெய்த குறிப்பிட்ட யூத எதிரிகளைக் குறிக்கிறது; எல்லா யூதர்களையும் குறித்த பொதுவான கூற்று அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: பணிசெய்தேன்
  rationale: இது பவுல் தொடர்ந்து எந்த விதத்தில் ஊழியம் செய்தார் என்பதை விவரிக்கும் நிகழ்காலப் பெயரெச்சம். தமிழில் முந்தைய வசனத்துடன் இயல்பாக இணைவதற்காக வினைமுற்றாக மொழிபெயர்க்கப்பட்டுள்ளது; அர்ப்பணிப்புள்ள சேவை என்ற பொருளைத் தருகிறது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவருக்கு
  rationale: κύριος என்ற பட்டத்தை மேலதிகமாக யாரென்று விளக்காமல் அப்படியே காக்கிறது; இச்சூழலில் அது இயல்பாக ஆண்டவர் இயேசுவைக் குறிக்கிறது.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: முழுமையான மனத்தாழ்மையோடும்
  rationale: πάσης என்பதன் முழுமை வலியுறுத்தப்படுகிறது; ταπεινοφροσύνη என்பதற்கு நவீனத் தமிழில் தெளிவான, கண்ணியமான இணைச்சொல் ‘மனத்தாழ்மை’.
- source_word: δακρύων
  choice: கண்ணீரோடும்
  rationale: உணர்ச்சியின் தெளிவை நிலைநிறுத்தும் வகையில் பன்மைப் பெயர்ச்சொல்லின் பொருள் இயல்பான தமிழில் வழங்கப்படுகிறது.
- source_word: πειρασμῶν
  choice: சோதனைகளோடும்
  rationale: இங்கு பாவத்துக்கான உள்தூண்டுதல்களைவிட எதிர்ப்பினால் ஏற்பட்ட வெளிப்புறத் துன்பங்களையே சூழல் குறிக்கிறது; இருப்பினும் மூலச்சொல்லின் பரந்த பொருளை ‘சோதனைகள்’ காக்கிறது.
- source_word: τῶν συμβάντων μοι
  choice: எனக்கு நேரிட்ட
  rationale: அந்தச் சோதனைகள் பவுலுக்கு நிகழ்ந்தவை என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: சதிகளால்
  rationale: ἐν இங்கு அச்சோதனைகள் நேரிட்ட வழிமுறை அல்லது காரணச் சூழலைக் குறிக்கலாம்; ‘சதிகளால்’ என்பது அந்தக் காரண-கருவிப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களின்
  rationale: கிரேக்கப் பன்மைச் சொல்லை நேரடியாகக் காக்கிறது; உடனடிச் சூழலில் இது பவுலுக்கு எதிராகச் சதிசெய்த குறிப்பிட்ட யூத எதிரிகளைக் குறிக்கிறது.
theological_decisions:
- issue: ‘யூதர்கள்’ என்ற சொற்றொடர் எல்லா யூதர்களையும் குற்றஞ்சாட்டுவதாகத் தவறாகப் புரிந்துகொள்ளப்படும் வாய்ப்பு
  choice: மூலத்தில் உள்ள τῶν Ἰουδαίων என்பதற்கு ‘யூதர்களின்’ என்று முதன்மை உரையில் வைத்துக் கொண்டு, அது குறிப்பிட்ட எதிரிகளைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துதல்
  alternative: ‘யூதத் தலைவர்களின்’ அல்லது ‘யூதேயர்களின்’
  rationale: மூல உரை தலைவர்கள் என்று வரம்பிடவில்லை. அதேவேளை, இச்சொற்றொடர் உலகளாவிய எல்லா யூதர்களையும் குறிக்கவில்லை; பவுலுக்கு எதிராகச் சதிசெய்த குறிப்பிட்டவர்களைச் சூழல் சுட்டுகிறது.
- issue: πειρασμῶν என்பதன் பொருள்
  choice: சோதனைகள்
  alternative: துன்பங்கள்; தூண்டுதல்கள்
  rationale: எதிரிகளின் சதிகளுடன் இணைக்கப்பட்டிருப்பதால் வெளிப்புறச் சோதனைகள் அல்லது இன்னல்கள் என்பதே இங்கு முதன்மைப் பொருள்; சொல்லின் உண்மையான பொருள் வரம்பை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மனத்தாழ்மை’, ‘கண்ணீர்’, ‘சோதனைகள்’ என்ற இணை அமைப்பு கிரேக்கத்தின் மூன்று உடன்சேர்ந்த சூழல்களையும் காக்கிறது; தமிழ் வாக்கிய ஓட்டத்திற்காக வினைச்சொல் இறுதியில் வைக்கப்பட்டுள்ளது.
