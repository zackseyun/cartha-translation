source:
  edition: SBLGNT
  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: ta
  text: 'அவர்கள் அவரிடம் வந்தபோது, அவர் அவர்களிடம் சொன்னார்: “நான் ஆசியாவில்[a] காலடி வைத்த முதல் நாளிலிருந்து உங்களோடு இருந்த காலம் முழுவதும் எவ்வாறு வாழ்ந்தேன்[b] என்பது உங்களுக்கே தெரியும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “ஆசியா” என்பது இன்றைய ஆசியக் கண்டத்தைக் குறிக்காமல், ஆசியா மைனரின் மேற்குப் பகுதியில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “நான் உங்களோடு காலம் முழுவதும் எவ்வாறு இருந்தேன்.” கிரேக்கச் சொற்றொடர் பவுலின் வாழ்க்கை முறையையோ அவர் அவர்களோடு தொடர்ந்து இருந்ததையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: அவர்கள் அவரிடம் வந்தபோது
  rationale: அவர்கள் பவுல் இருந்த இடத்தை நோக்கி வந்து அவரை அடைந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: உங்களுக்கே தெரியும்
  rationale: வெளிப்படையாக இடம்பெறும் Ὑμεῖς தரும் வலியுறுத்தலை ‘உங்களுக்கே’ என்பதன் மூலம் காக்கிறது.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην
  choice: காலடி வைத்த முதல் நாளிலிருந்து
  rationale: ἐπιβαίνω என்பதிலுள்ள ‘காலடி வைத்தல்’ என்ற உயிரோட்டமான பயணப் படிமத்தையும் தொடக்கக் காலக்குறிப்பையும் காக்கிறது.
- source_word: εἰς τὴν Ἀσίαν
  choice: ஆசியா மாகாணத்தில்
  rationale: இன்றைய கண்டத்துடன் குழப்பம் ஏற்படாமல் வரலாற்றுக் குறிப்பைத் தெளிவாக்குகிறது; ‘ஆசியா’ என்ற மூலப் பெயரையும் காக்கிறது.
- source_word: μεθ’ ὑμῶν τὸν πάντα χρόνον
  choice: உங்களோடு இருந்த காலம் முழுவதும்
  rationale: சமூகத்தின் நடுவில் தொடர்ச்சியாக இருந்த காலத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πῶς ... ἐγενόμην
  choice: நான் எவ்வாறு வாழ்ந்தேன்
  rationale: சூழலில் பவுலின் வாழ்க்கை முறையைக் குறிக்கும் இயல்பான வாசிப்பு இது; கிரேக்கத்தின் பரந்த பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: πῶς ... ἐγενόμην என்பதன் பொருள் வரம்பு
  choice: நான் எவ்வாறு வாழ்ந்தேன்
  alternative: நான் எவ்வாறு உங்களோடு இருந்தேன்
  rationale: சொற்றொடர் பவுலின் வாழ்க்கை நடத்தையையோ அவர்களோடு தொடர்ந்து இருந்த விதத்தையோ முன்னிறுத்தக்கூடும். முதன்மை உரையில் இயல்பான பொருள் தேர்ந்தெடுக்கப்பட்டு, உண்மையான தெளிவின்மை அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, கண்ணியமும் எளிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘காலடி வைத்த’ என்பது மூலத்தின் உயிரோட்டமான படிமத்தைப் பாதுகாக்கிறது; ‘உங்களுக்கே தெரியும்’ என்பது வலியுறுத்தலை இயல்பாகக் காட்டுகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
