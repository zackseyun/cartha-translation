id: ACT.20.11
reference: Acts 20:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: ta
  text: பின்னர் அவர் மேலே சென்று, அப்பத்தைப் பிட்டு[a] உண்டார்[b]. விடியும்வரை வெகுநேரம் பேசிக்கொண்டிருந்த பின்பு, அங்கிருந்து புறப்பட்டுச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அப்பத்தைப் பிட்டு’ என்ற இந்தக் கிரேக்கச் சொற்றொடர் உணவைப் பகிர்ந்து கொள்வதை மட்டும் குறிக்கலாம்; சிலர் இது ஆண்டவரின் இராப்போஜனத்தையும் உள்ளடக்குவதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது ‘சுவைத்தார்’ அல்லது ‘உணவில் பங்கெடுத்தார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: மேலே சென்று
  rationale: இது ἀναβαίνω என்பதன் இறந்தகால வினையெச்ச வடிவம்; அடிப்படைப் பொருளான மேல்நோக்கிய நகர்வைத் தெளிவாகக் காட்டுகிறது. முந்தைய சூழலில் பவுல் மேல் அறைக்குத் திரும்பியதைக் குறிக்கலாம்; ஆயினும் ‘திரும்பி’ என்பது இந்தச் சொல்லிலேயே வெளிப்படையாக இல்லை என்பதால் சேர்க்கப்படவில்லை.
- source_word: κλάσας τὸν ἄρτον
  choice: அப்பத்தைப் பிட்டு
  rationale: τὸν என்னும் சுட்டுச் சொல் இருப்பதால் குறிப்பிட்ட அப்பத்தைப் பிட்ட செயல் நேரடியாகத் தரப்படுகிறது. இது சாதாரண உணவுப் பகிர்வா அல்லது ஆண்டவரின் இராப்போஜனத்தையும் உள்ளடக்கியதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: γευσάμενος
  choice: உண்டார்
  rationale: γεύομαι என்பதற்கு ‘சுவைத்தார்’ என்ற அடிப்படைப் பொருள் இருந்தாலும், உணவுச் சூழலில் உண்பதை அல்லது உணவில் பங்கெடுப்பதை இது குறிக்கலாம். இயல்பான தமிழில் ‘உண்டார்’ என்பது இச்சூழலுக்கு ஏற்றது.
- source_word: ἐφ’ ἱκανόν
  choice: வெகுநேரம்
  rationale: கணிசமான கால அளவைக் குறிக்கும் இந்த மரபுத்தொடரைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁμιλήσας
  choice: பேசிக்கொண்டிருந்த
  rationale: ὁμιλέω இங்கு நீடித்த உரையாடல் அல்லது பேச்சைக் குறிக்கிறது. தொடர்ச்சியான காலநீட்சியை ‘பேசிக்கொண்டிருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄχρι αὐγῆς
  choice: விடியும்வரை
  rationale: αὐγή என்பது விடியல் அல்லது பொழுது புலர்வதைக் குறிக்கிறது; ‘விடியும்வரை’ நவீனத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: οὕτως ἐξῆλθεν
  choice: அங்கிருந்து புறப்பட்டுச் சென்றார்
  rationale: ἐξῆλθεν என்பதன் வெளியேறுதல் அல்லது புறப்படுதல் என்ற கருத்தை இயல்பாகத் தருகிறது. οὕτως முன்னுள்ள நிகழ்வுகளுக்குப் பின் அவர் புறப்பட்டதை இணைக்கிறது; தமிழில் வாக்கிய வரிசையும் ‘பின்பு’ என்பதும் அந்தத் தொடர்பை வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: κλάσας τὸν ἄρτον என்பது ஆண்டவரின் இராப்போஜனத்தைத் திட்டவட்டமாகக் குறிக்கிறதா?
  choice: ‘அப்பத்தைப் பிட்டு’ என்று நடுநிலையாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை ஆண்டவரின் இராப்போஜனத்தைக் குறிப்பதாகவோ, சாதாரணமாக உணவைப் பகிர்ந்து கொண்டதைக் குறிப்பதாகவோ புரிந்துகொள்ளலாம்.
  rationale: அப்பம் பிடுதல் என்ற சொற்றொடர் அப்போஸ்தலர் நூலில் திருவிருந்துடன் தொடர்புபடுத்தப்படக்கூடியதாக இருந்தாலும், இவ்வசனம் மட்டும் ஒரு குறிப்பிட்ட சடங்குப் பொருளைத் திட்டவட்டமாக்கவில்லை. ஆகவே மூலத்தின் இறையியல் பதற்றமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் பொருந்தாத இடங்களில் இருந்ததால், [a] அப்பம் பிடித்தலுக்குப் பின்னும் [b] உண்டதற்குப் பின்னும் மூலக் கருத்துகளுக்கு ஏற்ற இடங்களில் வைக்கப்பட்டுள்ளன.
