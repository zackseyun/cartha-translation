source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: ta
  text: வாரத்தின் முதல் நாளில், அப்பத்தைப் பிய்ப்பதற்காக[a] நாங்கள் ஒன்றுகூடியிருந்தபோது, மறுநாள் புறப்படவிருந்த பவுல் அவர்களோடு பேசிக்கொண்டிருந்தார்; அவர் தமது பேச்சை நள்ளிரவுவரை நீட்டினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அப்பத்தைப் பிய்த்தல்’ என்பது ஒன்றாகப் பகிர்ந்து உண்ணும் உணவைக் குறிக்கலாம்; ஆண்டவரின் இராப்போஜனத்தைக் குறிக்கும் சாயலும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதை, ‘மறுநாள் புறப்படவிருந்ததால், பவுல் அவர்களோடு பேசிக்கொண்டிருந்தார்; அவர் தமது பேச்சை நள்ளிரவுவரை நீட்டினார்’ எனவும் மொழிபெயர்க்கலாம்.
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: வாரத்தின் முதல் நாளில்
  rationale: இது கொய்னே கிரேக்கத்தில் வாரத்தின் முதல் நாளைக் குறிக்கும் வழக்கமான காலச் சொற்றொடர். δέ-யின் மென்மையான இணைப்புப் பொருளைத் தமிழில் தேவையற்ற முரண்பாடாக வலுப்படுத்தாமல் இயல்பான வாக்கிய ஓட்டத்தில் விட்டுள்ளது.
- source_word: συνηγμένων ἡμῶν
  choice: நாங்கள் ஒன்றுகூடியிருந்தபோது
  rationale: Genitive absolute தரும் சூழ்நிலையையும் முதல் நபர் பன்மை கதைநடையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: κλάσαι ἄρτον
  choice: அப்பத்தைப் பிய்த்து உண்பதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் infinitive-ஐப் பாதுகாக்கிறது. ‘அப்பத்தைப் பிய்த்தல்’ என்ற மூல உருவகத்தையும் உணவுப் பின்னணியையும் தெரிவிக்கிறது; இதை ஆண்டவரின் இராப்போஜனம் என்று மட்டும் குறுக்கவில்லை.
- source_word: διελέγετο αὐτοῖς
  choice: அவர்களோடு பேசிக்கொண்டிருந்தார்
  rationale: Imperfect-இன் தொடர்ச்சியான செயலை ‘பேசிக்கொண்டிருந்தார்’ காட்டுகிறது; διαλέγομαι-வின் பரிமாற்றத் தன்மையை ‘அவர்களோடு’ பாதுகாக்கிறது, ஒருதலைப் பிரசங்கமாக மாற்றவில்லை.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: மறுநாள் புறப்படவிருந்த
  rationale: μέλλω + infinitive தரும் அண்மைய எதிர்கால எண்ணத்தை இயல்பான தமிழில் காட்டுகிறது; ‘வெளியே செல்லுதல்’ என்ற அளவுக்கு மீறிய சொற்பொருள் மொழிபெயர்ப்பைத் தவிர்த்து பயணச் சூழலுக்கு ஏற்ற ‘புறப்படுதல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: παρέτεινέν τε τὸν λόγον
  choice: அவர் தமது பேச்சை … நீட்டினார்
  rationale: παρατείνω என்பதன் நீட்டித்தல் என்ற பொருளையும், இங்கு λόγος குறிக்கும் பவுலின் வாய்மொழிப் பேச்சையும் இயல்பாக வழங்குகிறது.
- source_word: μέχρι μεσονυκτίου
  choice: நள்ளிரவுவரை
  rationale: செயல் தொடர்ந்த கால எல்லையை நேரடியாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: κλάσαι ἄρτον என்பது பொதுவான கூட்டு உணவையா, ஆண்டவரின் இராப்போஜனத்தையா குறிக்கிறது?
  choice: அப்பத்தைப் பிய்த்து உண்பதற்காக
  alternative: ஆண்டவரின் இராப்போஜனத்தில் பங்கேற்பதற்காக / ஒன்றாக உணவருந்துவதற்காக
  rationale: அப்பத்தைப் பிய்த்தல் என்ற சொற்றொடர் பொதுவான உணவுப் பகிர்வையும் ஆண்டவரின் இராப்போஜனத் தொடர்பையும் தாங்கக்கூடும். மூலத்தில் வெளிப்படையாகத் தீர்மானிக்கப்படாததை ஒரு திருச்சபை மரபுக்கே உரிய பொருளாக மொழிபெயர்ப்பு நிர்ணயிக்கவில்லை.
- issue: μέλλων ἐξιέναι என்ற participle-ன் பவுலின் பேச்சோடு உள்ள தர்க்கத் தொடர்பு
  choice: மறுநாள் புறப்படவிருந்த பவுல்
  alternative: மறுநாள் புறப்படவிருந்ததால், பவுல் அவர்களோடு பேசிக்கொண்டிருந்தார்
  rationale: கிரேக்கம் பவுல் விரைவில் புறப்படவிருந்ததைச் சொல்கிறது; காரணத் தொடர்பு சூழலில் சாத்தியமானதாயினும் ‘ஏனெனில்/ஆதால்’ என்பதை வெளிப்படையாகக் கூறவில்லை. முதன்மை உரை அந்தத் திறந்த நிலையைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்களோடு பேசிக்கொண்டிருந்தார்’ என்பது கலந்துரையாடல் சாயலைக் காக்கிறது; ‘அப்பத்தைப் பிய்த்து உண்பது’ என்பது பழமையான மரபுச்சொல்லை மட்டும் சாராமல் இன்றைய வாசகருக்கும் விளங்குமாறு அமைந்துள்ளது.
