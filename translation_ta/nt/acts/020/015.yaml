source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: ta
  text: அங்கிருந்து நாங்கள் கப்பலில் புறப்பட்டு, மறுநாள் கியோஸ் தீவுக்கு எதிரே வந்தோம்[a]. அடுத்த நாள் சாமோசில் கப்பலை நிறுத்தினோம்[b]. அதற்கு அடுத்த நாள் மிலேத்துவுக்கு வந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கியோஸ் தீவுக்கு நேரெதிரே’ அல்லது ‘கியோஸ் தீவுக்கு எதிரிலுள்ள கடற்பகுதியில்.’ கிரேக்கச் சொல் அவர்கள் தீவுக்கு எதிரே இருந்ததைக் குறிக்கிறது; அவர்கள் தீவில் இறங்கினார்கள் என்று கட்டாயமாகப் பொருள்படாது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சாமோசில் கப்பலை அணைத்தோம்’ அல்லது ‘சாமோசில் தங்கினோம்.’ இங்குள்ள கிரேக்க வினைச்சொல், கப்பலை ஓரிடத்துக்கு அணுகச் செய்வதையோ அங்கே நிறுத்துவதையோ குறிக்கும் கடற்பயணச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: அங்கிருந்து
  rationale: καί + ἐκεῖθεν என்ற இணைவு முந்தைய பயண நிகழ்வோடு தொடர்ச்சியையும் புறப்பட்ட இடத்தையும் குறிக்கிறது; தமிழில் வாக்கியத் தொடர்ச்சியே ‘and’ என்பதன் பணியை இயல்பாக வெளிப்படுத்துவதால் ‘அங்கிருந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἀποπλεύσαντες
  choice: கப்பலில் புறப்பட்டு
  rationale: கடற்பயணத்தைத் தொடங்கியதைச் சுட்டும் இறந்தகாலப் பங்கேற்புச் சொல்லை, முதன்மை வினைக்கு முந்திய செயலைக் காட்டும் இயல்பான தமிழ் வினையெச்சமாக வழங்குகிறது.
- source_word: τῇ ἐπιούσῃ
  choice: மறுநாள்
  rationale: காலத்தைக் குறிக்கும் இத்தொடர் அடுத்த நாளைச் சுட்டுகிறது; ‘மறுநாள்’ சுருக்கமான, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: κατηντήσαμεν
  choice: வந்தோம்
  rationale: பயணச் சூழலில் ஓர் இடத்தை அடைந்ததைக் குறிக்கிறது. அடுத்துள்ள ‘கீயு தீவுக்கு எதிரே’ என்ற நிலைக்குறிப்புடன் ‘வந்தோம்’ இயல்பாக அமைகிறது.
- source_word: ἄντικρυς Χίου
  choice: கீயு தீவுக்கு எதிரே
  rationale: ἄντικρυς என்பது தீவின் எதிர்ப்புறக் கடற்பகுதியை அடைந்ததைக் குறிக்கிறது; தீவில் இறங்கியதாகக் கூறவில்லை. தமிழ் வாசகருக்குத் தெளிவாக இருக்க ‘தீவு’ சேர்க்கப்பட்டது.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: அதற்கு அடுத்த நாள்
  rationale: பயணத்தின் அடுத்த நாள்கட்டத்தை வரிசையாகக் காட்டும் கிரேக்க மரபுத்தொடரைத் தெளிவான தமிழில் தருகிறது.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: சாமோசில் கப்பலைக் கரைசேர்த்தோம்
  rationale: παραβάλλω இங்கு கப்பலை ஓரிடத்தில் அணுகச் செய்தல் அல்லது நிறுத்துதல் என்ற கடற்பயணப் பொருளுடையது. வெறுமனே ‘வந்தோம்’ என்பதைவிட இந்தச் சிறப்புப் பொருளை வெளிப்படுத்துகிறது.
- source_word: τῇ δὲ ἐχομένῃ
  choice: அதற்கு மறுநாள்
  rationale: தொடர்ச்சியில் உடனடுத்து வரும் நாளைக் குறிக்கிறது; முந்தைய நாள்குறிப்புகளுக்குப் பின் காலவரிசையைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: மிலேத்துவுக்கு வந்தோம்
  rationale: இலக்கை நோக்கி வந்து சேர்ந்ததை எளிய பயண நடையில் நேரடியாகத் தருகிறது.
- source_word: Χίου / Σάμον / Μίλητον
  choice: கீயு / சாமோஸ் / மிலேத்து
  rationale: கிரேக்க இடப்பெயர்களின் ஒலிவடிவங்களைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்து, வேற்றுமை உருபுகளுடன் முறையே ‘கீயு தீவுக்கு’, ‘சாமோசில்’, ‘மிலேத்துவுக்கு’ என வழங்கப்பட்டது.
