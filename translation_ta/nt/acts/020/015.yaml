translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான பயணவிவர நடையைப் பயன்படுத்தியுள்ளது. கிரேக்க மூலத்தின் மூன்று நாள் காலவரிசையும், கீயுவில் இறங்கியதாகச் சொல்லாத இடநிலை நுணுக்கமும், சாமோசை அணைந்ததைக் குறிக்கும் கடற்பயணச் சொல்லின் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
