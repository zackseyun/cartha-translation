revisions:
- from: அங்கிருந்து நாங்கள் கப்பலில் புறப்பட்டு, மறுநாள் கீயு தீவுக்கு எதிரே வந்தோம்[a]. அதற்கு அடுத்த நாள் சாமோசில் கப்பலைக் கரைசேர்த்தோம்[b]. அதற்கு மறுநாள் மிலேத்துவுக்கு வந்தோம்.
  to: அங்கிருந்து நாங்கள் கப்பலில் புறப்பட்டு, மறுநாள் கியோஸ் தீவுக்கு எதிரே வந்தோம்[a]. அடுத்த நாள் சாமோசில் கப்பலை நிறுத்தினோம்[b]. அதற்கு அடுத்த நாள் மிலேத்துவுக்கு வந்தோம்.
