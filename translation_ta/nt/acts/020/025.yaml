source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: ta
  text: இப்போது, இதோ, அரசாட்சியை அறிவித்துக்கொண்டு உங்களிடையே சுற்றித் திரிந்த நான், நீங்கள் அனைவரும் இனி என் முகத்தைக் காணமாட்டீர்கள் என்பதை அறிந்திருக்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: பாருங்கள்
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லை நவீன, இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: διῆλθον
  choice: உங்களிடையே நான் சென்று
  rationale: பல இடங்களில் அவர்களிடையே சுற்றிச் சென்றதைக் குறிக்கும் சூழலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: κηρύσσων
  choice: அறிவித்தேனே
  rationale: பொதுவாகப் பிரகடனம் செய்த செயலைத் தெளிவாகக் காட்டுகிறது; தொடரின் தொடர்பை தமிழில் இயல்பாக்க ஏகார வலியுறுத்தல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὴν βασιλείαν
  choice: அரசாட்சியை
  rationale: βασιλεία என்பதன் ஆட்சி/அரசுரிமை சார்ந்த பொருளை முன்னிறுத்துகிறது; மூலத்தில் குறிப்பிடப்படாத ‘தேவனுடைய’ என்பதைச் சேர்க்கவில்லை.
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: இனி என் முகத்தைக் காணமாட்டீர்கள்
  rationale: செமித்தியத் தாக்கமுள்ள முகத்தைக் காணுதல் என்ற மூலச் சொல்லாக்கத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அரசாட்சி’ யாருடையது என்பது
  choice: மூலத்தைப் போல ‘அரசாட்சி’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தேவனுடைய அரசாட்சி’
  rationale: சூழலில் தேவனுடைய அரசாட்சியே குறிக்கப்பட்டாலும், இவ்வசனத்தின் கிரேக்க உரையில் அதற்குரிய உரிமைச்சொல் இல்லை; ஆகவே அதை வெளிப்படையாகச் சேர்க்கவில்லை.
- issue: οἶδα என்பதன் உறுதியான தொனி
  choice: ‘எனக்குத் தெரியும்’
  alternative: ‘நான் உறுதியாக நம்புகிறேன்’
  rationale: பவுலின் கூற்றை அறிவாகவே மூல உரை முன்வைக்கிறது; அதை ஊகம் அல்லது தனிப்பட்ட நம்பிக்கையாகத் தளர்த்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் உரையின் கண்ணியத்தையும் பவுலின் உணர்ச்சிமிக்க நேரடித் தொனியையும் காக்கும் வகையிலும் வடிவமைக்கப்பட்டது.
