  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: ta
  text: மிலேத்துவிலிருந்து அவர் எபேசுவுக்கு ஆள் அனுப்பி, திருச்சபையின் மூப்பர்களைத் தம்மிடம் வரவழைத்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திருச்சபையின் மூப்பர்களை அழைத்துவரும்படி எபேசுவுக்கு ஆள் அனுப்பினார்.’ கிரேக்க வாசகம் ‘எபேசுவுக்கு அனுப்பி’ என்பதையும் ‘தம்மிடம் வரவழைத்தார்’ என்பதையும் இணைக்கிறது; அவர்கள் வரும்படி செய்தி அல்லது தூதர்கள் அனுப்பப்பட்டதை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: மிலேத்துவிலிருந்து
  rationale: ἀπό உடன் வரும் உருபு புறப்படும் இடத்தைக் குறிக்கிறது. δέ இங்கு மென்மையான தொடர்ச்சிச் சொல்; தனியாக மொழிபெயர்த்தால் தமிழில் தேவையற்ற முரண்பாடு அல்லது வலியுறுத்தல் தோன்றக்கூடும் என்பதால் இயல்பான வாக்கிய ஓட்டத்தில் விடப்பட்டுள்ளது.
- source_word: πέμψας εἰς Ἔφεσον
  choice: எபேசுவுக்கு ஆள் அனுப்பி
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் காட்டுகிறது. அனுப்பப்பட்டது செய்தியோ தூதரோ என்பது கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படவில்லை; தமிழில் செயற்பாட்டை இயல்பாகத் தெரிவிக்க ‘ஆள் அனுப்பி’ என வழங்கப்பட்டுள்ளது.
- source_word: μετεκαλέσατο
  choice: தம்மிடம் வரவழைத்தார்
  rationale: இடைநிலை வினை ஒருவர் தம்மிடம் வரும்படி அழைப்பித்தல் அல்லது ஆள் அனுப்பி வரவழைத்தல் என்ற பொருளைக் கொண்டது. ‘வரவழைத்தார்’ என்பது சூழலுக்கு இயல்பானது; ‘தம்மிடம்’ என்பது இடைநிலையின் நோக்கைத் தெளிவாக்குகிறது.
- source_word: τοὺς πρεσβυτέρους
  choice: மூப்பர்களை
  rationale: இங்கு வயதில் மூத்த ஆண்களை மட்டும் அல்லாமல், திருச்சபையில் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது. ‘மூப்பர்கள்’ என்பது பிற்கால குறிப்பிட்ட திருச்சபை ஆட்சிமுறையைத் திணிக்காமல் பொருளைத் தக்கவைக்கிறது.
- source_word: τῆς ἐκκλησίας
  choice: திருச்சபையின்
  rationale: லூக்கா–அப்போஸ்தலர் சூழலில் ἐκκλησία கிறிஸ்தவ விசுவாசிகளின் சமூகத்தைக் குறிக்கிறது. நவீன நிலையான தமிழில் ‘திருச்சபை’ இதற்கான இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் சொல்.
theological_decisions:
- issue: திருச்சபைச் சூழலில் πρεσβυτέρους என்பதன் பொருள்
  choice: திருச்சபையின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கும் ‘மூப்பர்கள்’
  alternative: சபையிலுள்ள வயதான ஆண்கள்; அல்லது ஒலிபெயர்ப்பான ‘பிரஸ்பிட்டர்கள்’
  rationale: அப்போஸ்தலர் நூலின் கதைச்சூழலில் பவுல் எபேசுவின் அங்கீகரிக்கப்பட்ட திருச்சபைத் தலைவர்களை அழைக்கிறார். ‘மூப்பர்கள்’ என்ற மொழிபெயர்ப்பு அந்தப் பொறுப்பைக் காட்டுகிறது; ஆனால் எந்தப் பிற்கால சமயப்பிரிவு சார்ந்த ஆட்சியமைப்பையும் உரையில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆள் அனுப்பி’ மற்றும் ‘தம்மிடம் வரவழைத்தார்’ என்ற தொடர்கள் கிரேக்க வாக்கியத்தின் செயல்வரிசையையும் இடைநிலை வினையின் நோக்கையும் இயல்பாக வெளிப்படுத்துகின்றன.
