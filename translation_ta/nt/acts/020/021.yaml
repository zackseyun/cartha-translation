  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: ta
  text: கடவுளிடம் மனந்திரும்புவதையும், நம் ஆண்டவர் இயேசுவின்மேல் விசுவாசம் வைப்பதையும்[a] குறித்து, யூதர்களுக்கும் கிரேக்கர்களுக்கும் உறுதியாய்ச் சாட்சியமளித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம் ஆண்டவர் இயேசுவை நம்புவதையும்.’
    reason: πίστις என்பதற்கு இச்சூழலில் ‘விசுவாசம்’ என்றும் ‘நம்புதல்’ என்றும் பொருள் கொள்ளக்கூடிய சொற்பொருள் மாற்றை பாதுகாக்கிறது.
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: ஆணித்தரமாகச் சாட்சியளித்தேன்
  rationale: இந்த வினைச்சொல் வெறும் தகவல் கூறுதலைவிட வலியுறுத்தப்பட்ட, பொறுப்புணர்வுள்ள சாட்சியத்தை உணர்த்துகிறது. முந்தைய வசனத்தின் முதன்மை வினையுடன் இணைந்துள்ள கிரேக்கப் பங்கேற்புவினையின் காலமும் நபரும் தமிழில் இயல்பாக வெளிப்பட இவ்வாறு முற்றுவினையாக வழங்கப்பட்டுள்ளது.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: யூதர்களுக்கும் கிரேக்கர்களுக்கும்
  rationale: τε καὶ அமைப்பு இரு குழுக்களையும் உள்ளடக்குகிறது; Ἕλλησιν என்பதைக் பொதுமைப்படுத்தி ‘பிற இனத்தார்’ என மாற்றாமல் லூக்காவின் சொல் தேர்வு காக்கப்படுகிறது.
- source_word: μετάνοιαν
  choice: மனந்திரும்புவது
  rationale: இந்தச் சூழலில் μετάνοια என்பது வெறும் எண்ணமாற்றம் அல்ல; கடவுளை நோக்கிய உள்ளார்ந்த மற்றும் வாழ்வியல் திருப்பத்தைக் குறிக்கிறது. ‘மனந்திரும்புதல்’ நவீனத் தமிழில் இதைச் சுருக்கமாகவும் நிலைபெற்ற வகையிலும் தெரிவிக்கிறது.
- source_word: εἰς θεόν
  choice: கடவுளிடம்
  rationale: εἰς இங்கு மனந்திரும்புதலின் திசையையும் இலக்கையும் குறிக்கிறது. ‘கடவுளிடம் மனந்திரும்புவது’ தமிழில் இயல்பாக அந்தக் கடவுள் நோக்கிய இயக்கத்தை வெளிப்படுத்துகிறது.
- source_word: πίστιν
  choice: விசுவாசம் வைப்பது
  rationale: இங்கு விசுவாசத்தின் பொருள் வெளிப்படையாக இயேசு என்பதால், ‘விசுவாசம் வைப்பது’ பொருத்தமானது. ‘நம்புவது’ என்ற இயல்பான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: நம் ஆண்டவர் இயேசுவின்மேல்
  rationale: πίστις உடன் வரும் εἰς, ஒருவர்மேல் வைக்கப்படும் விசுவாசத்தைச் சுட்டுகிறது. κύριος என்பதன் கிறிஸ்துவியல் பட்டப்பெயர் ‘ஆண்டவர்’ எனவும், Ἰησοῦς ‘இயேசு’ எனவும் வழங்கப்படுகிறது.
theological_decisions:
- issue: πίστις என்பதன் விசுவாசம்/நம்பிக்கை சார்ந்த மொழிபெயர்ப்பு
  choice: நம் ஆண்டவர் இயேசுவின்மேல் விசுவாசம் வைப்பது
  alternative: நம் ஆண்டவர் இயேசுவை நம்புவது
  rationale: இது πίστις Χριστοῦ என்ற உரிமைவேற்றுமைத் தொடரின் விவாதம் அல்ல; இயேசுவே விசுவாசத்தின் பொருளாகத் தெளிவாகக் கொடுக்கப்பட்டுள்ளார். முதன்மை உரையில் ‘விசுவாசம்’ மூலச்சொல்லுடனான தொடர்பையும் இறையியல் நிறையையும் காக்கிறது; ‘நம்புவது’ அதன் இயல்பான தமிழ்ப் பொருள் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: மனந்திரும்புதலுக்கும் விசுவாசத்துக்கும் இடையிலான தொடர்பு
  choice: இரண்டையும் καὶ இணைப்பின்படி சமநிலையில் வைத்தல்
  alternative: ஒன்றை மற்றொன்றின் விளைவாக அல்லது விளக்கமாகக் காட்டுதல்
  rationale: கிரேக்க உரை மனந்திரும்புதலையும் விசுவாசத்தையும் καὶ மூலம் இணைக்கிறது; அவற்றின் தர்க்க அல்லது கால வரிசையைத் தெளிவுபடுத்தவில்லை. ஆகவே மொழிபெயர்ப்பு கூடுதல் கோட்பாட்டு வரிசையைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்கப் பெயர்ச்சொல் தொடர்கள் தமிழில் இயல்பான வினைப்பெயர் தொடர்களாக மாற்றப்பட்டுள்ளன. ‘ஆணித்தரமாக’ என்பது διαμαρτύρομαι என்பதன் வலியுறுத்தலைக் காக்கிறது; ‘கிரேக்கர்கள்’ என்பது மூலத்தின் இன-மொழிசார் சொல்லை பொதுமைப்படுத்தாமல் பாதுகாக்கிறது.
