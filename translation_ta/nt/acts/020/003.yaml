source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: ta
  text: அங்கே மூன்று மாதங்கள் தங்கிய பின்பு, அவர் சீரியாவுக்குக் கப்பலில் புறப்படவிருந்தபோது, யூதர்கள்[a] அவருக்கு எதிராகச் சதித்திட்டம் தீட்டினர்; அதனால், மக்கெதோனியா வழியாகத் திரும்பிச் செல்ல அவர் முடிவு செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அப்போஸ்தலர் நூலில் ‘யூதர்கள்’ என்பது இத்தகைய சூழல்களில் பெரும்பாலும் பவுலை எதிர்த்த ஒரு குறிப்பிட்ட குழுவைக் குறிக்கிறது; வேறுபாடின்றி எல்லா யூத மக்களையும் குறிக்காது.
    reason: cultural_note
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: அங்கே மூன்று மாதங்கள் தங்கிய பின்பு
  rationale: ποιέω கால அளவுடன் வரும்போது ஒரு காலப்பகுதியைக் கழித்தல் அல்லது தங்கியிருத்தல் என்று பொருள்படும். முந்தைய வசனத்தில் கூறப்பட்ட கிரேக்கப் பகுதியைச் சூழல் காட்டுவதால், இயல்பான தமிழுக்காக ‘அங்கே’ சேர்க்கப்பட்டுள்ளது.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: அவருக்கு எதிராகச் சதித்திட்டம் தீட்டியதால்
  rationale: ἐπιβουλή என்பது தீங்கு செய்யும் நோக்கமுள்ள சதி அல்லது சூழ்ச்சியைக் குறிக்கிறது. மரபுத்தொடரின் சூழ்நிலைப் பொருள் இங்கு பவுலின் பயணத் திட்டம் மாறியதற்கான காரணமாக இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: யூதர்கள்
  rationale: கிரேக்க மூலம் ‘யூதர்களால்’ என்று வெளிப்படையாகக் கூறுகிறது. தமிழில் செயப்பாட்டு வாக்கியத்துக்குப் பதிலாக இயல்பான செய்வினை அமைப்பு பயன்படுத்தப்பட்டாலும், மூலத்தின் குறிப்பு மாற்றப்படவில்லை.
- source_word: μέλλοντι ἀνάγεσθαι
  choice: கப்பலில் புறப்படவிருந்தபோது
  rationale: μέλλω உடனடியாக நிகழவிருப்பதைக் குறிக்கிறது; பயணச் சூழலில் ἀνάγομαι கடல்பயணத்திற்காகப் புறப்படுதல் அல்லது கப்பல் ஏறிச் செல்லுதல் என்ற பொருள் தருகிறது.
- source_word: εἰς τὴν Συρίαν
  choice: சீரியாவுக்கு
  rationale: εἰς இங்கு பயணத்தின் இலக்கைக் குறிக்கிறது; ‘சீரியாவுக்கு’ என்பது நவீனத் தமிழில் நேரான இலக்கு வெளிப்பாடு.
- source_word: ἐγένετο γνώμης
  choice: முடிவு செய்தார்
  rationale: இந்த மரபுத்தொடர் ஒரு தீர்மானத்திற்கு வருவதைக் குறிக்கிறது. ‘முடிவு செய்தார்’ தெளிவான, இயல்பான தமிழ் இணை.
- source_word: τοῦ ὑποστρέφειν
  choice: திரும்பிச் செல்ல
  rationale: பெயர்ச்சொல் தன்மையுள்ள வினையெச்சம் முடிவின் உள்ளடக்கத்தைக் கூறுகிறது; ὑποστρέφω இங்கு திரும்பிச் செல்வதைக் குறிக்கிறது.
- source_word: διὰ Μακεδονίας
  choice: மக்கெதோனியா வழியாக
  rationale: διά + genitive பயணப் பாதையைக் குறிக்கிறது. ‘வழியாக’ இந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: மோதல் நிகழ்வில் ‘யூதர்கள்’ என்ற குறிப்பின் பரப்பு
  choice: மூலத்தில் உள்ளபடி ‘யூதர்கள்’ என்பதை முதன்மை உரையில் வைத்து, அது எல்லா யூத மக்களையும் வேறுபாடின்றிக் குறிக்காது என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துதல்.
  alternative: ‘யூத எதிரிகள்’ அல்லது ‘சில யூதர்கள்’ என்று முதன்மை உரையிலேயே குறிப்பிடுதல்.
  rationale: τῶν Ἰουδαίων என்ற மூலச்சொல்லை மாற்றிக் குறுக்குவது உரையின் வெளிப்படையான வடிவத்தை மங்கச் செய்யும். அதேவேளை, சூழலில் எதிர்த்த ஒரு குறிப்பிட்ட குழுவே குறிக்கப்படுகிறது என்பதை அடிக்குறிப்பு மூலம் காட்டுவது தவறான இனப் பொதுமைப்படுத்தலைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் காரணத் தொடர்பும் பயண வரிசையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் பாதுகாக்கப்பட்டுள்ளன.
