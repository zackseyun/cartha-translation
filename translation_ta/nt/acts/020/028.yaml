theological_decisions:
- issue: τοῦ αἵματος τοῦ ἰδίου என்பதன் குறிப்பு மற்றும் பொருள்
  choice: தமக்கே சொந்தமானவரின் இரத்தத்தின் மூலம்
  alternative: தமது சொந்த மகனின் இரத்தத்தின் மூலம்; பாரம்பரியமாக, தமது சொந்த இரத்தத்தினால்
  rationale: ἰδίου என்பது பெயர்ச்சொல்லாகச் செயல்பட்டு ‘தமக்குச் சொந்தமானவர்’ என்றும், சூழலில் ‘தமது சொந்த மகன்’ என்றும் புரிந்துகொள்ளப்படலாம்; பாரம்பரிய வாசிப்பு இதை ‘தமது சொந்த இரத்தம்’ என்றும் எடுத்துக்கொள்கிறது. முதன்மை உரை மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது; முக்கிய விளக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: περιεποιήσατο வினையின் மறைமுக எழுவாய்
  choice: தேவன் என்று வெளிப்படுத்தப்பட்டது
  alternative: அவர் என்று மட்டும் மொழிபெயர்த்தல்
  rationale: தமிழில் அருகிலுள்ள ‘பரிசுத்த ஆவியானவர்’ என்பதையே ‘அவர்’ குறிப்பதாகத் தவறாகப் புரிந்துகொள்ள வாய்ப்புள்ளது. ‘தேவனுடைய திருச்சபை’ என்ற உடனடி கிரேக்க முன்னிலையைத் தொடர்ந்து தேவனே பெற்றுக்கொண்டவர் என்பதைத் தெளிவுபடுத்துவது பொருளை மாற்றாமல் குழப்பத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான திருவிவிலிய நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியம் தமிழில் மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; இதனால் கருத்துத் தொடர்பு தெளிவாகிறது. ‘மந்தை/மேய்த்தல்’ உருவகம் முழுவதும் பாதுகாக்கப்பட்டுள்ளது; ‘கண்காணிப்பாளர்கள்’ என்பது பிற்காலச் சபைப் பதவிப் பொருளைத் தேவையின்றி இறக்குமதி செய்வதைத் தவிர்க்கிறது.
