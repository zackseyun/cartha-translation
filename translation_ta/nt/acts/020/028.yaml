  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: ta
  text: உங்களையும் மந்தை முழுவதையும் விழிப்புடன் கவனியுங்கள். பரிசுத்த ஆவியானவர் உங்களை அந்த மந்தையின் நடுவில் கண்காணிப்பாளர்களாக நியமித்திருக்கிறார்; தேவனுடைய திருச்சபையை[a] மேய்க்கும்படி நியமித்திருக்கிறார். தேவன் அந்தத் திருச்சபையைத் தமக்குச் சொந்தமானவருடைய இரத்தத்தின் மூலம் பெற்றுக்கொண்டார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘தேவனுடைய திருச்சபை’ என்பதற்குப் பதிலாக ‘ஆண்டவருடைய திருச்சபை’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘தமது சொந்த மகனின் இரத்தத்தின் மூலம்’; பாரம்பரிய மொழிபெயர்ப்பு, ‘தமது சொந்த இரத்தத்தினால்.’
    reason: alternative_reading
