id: ACT.20.9
reference: Acts 20:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: ta
  text: ஐத்திகு என்ற இளைஞன் ஒருவன் சன்னல் திறப்பில் உட்கார்ந்திருந்தான். பவுல் நீண்ட நேரம் பேசிக்கொண்டிருந்தபோது, அவன் ஆழ்ந்த தூக்கத்தில் மூழ்கிக்கொண்டிருந்தான். தூக்கம் அவனை ஆட்கொண்டதால், அவன் மூன்றாம் மாடியிலிருந்து கீழே விழுந்தான்; அவன் இறந்த நிலையில் தூக்கி எடுக்கப்பட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் இறந்த நிலையில் எடுத்துக்கொள்ளப்பட்டான்.” கிரேக்க வினைச்சொல் “தூக்கி எடுக்கப்பட்டான்” அல்லது “எடுத்துக்கொள்ளப்பட்டான்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος
  choice: உட்கார்ந்திருந்தான்
  rationale: நிகழ்வின் பின்னணியில் தொடர்ந்திருந்த உடல் நிலையைக் காட்டும் நிகழ்காலப் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் தருகிறது.
- source_word: τις νεανίας
  choice: இளைஞன் ஒருவன்
  rationale: τις தரும் வரையறையற்ற தன்மையையும் νεανίας குறிக்கும் இளம் ஆணையும் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὀνόματι Εὔτυχος
  choice: ஐத்திகு என்ற
  rationale: பெயரைக் குறிப்பிடும் கிரேக்கத் தொடரை இயல்பான தமிழ்ச் சொல்லமைப்பில் தருகிறது; Εὔτυχος என்பதற்கு தமிழில் பரவலாக அறியப்பட்ட ‘ஐத்திகு’ என்ற பெயர்வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: ἐπὶ τῆς θυρίδος
  choice: சன்னல் திறப்பில்
  rationale: θυρίς என்பது சன்னல் அல்லது சுவரிலுள்ள திறப்பைக் குறிக்கிறது. கீழே விழும் நிகழ்வுக்கு ஏற்றவாறு, அவன் திறப்பினுள் அல்லது அதன் விளிம்பில் இருந்த நிலையை மிகையாக விவரிக்காமல் காட்டுகிறது.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: ஆழ்ந்த தூக்கத்தில் மூழ்கிக்கொண்டிருந்தான்
  rationale: ஆழ்ந்த தூக்கத்தால் படிப்படியாக ஆட்கொள்ளப்படும் நிகழ்வைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: பவுல் நீண்ட நேரம் பேசிக்கொண்டிருந்தபோது
  rationale: மரபுத்தொடரின் சூழ்நிலைப் பொருளையும் ἐπὶ πλεῖον தரும் நீடித்த காலத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: தூக்கம் அவனை முற்றிலும் ஆட்கொண்டதால்
  rationale: முன்பு தொடங்கிய தூக்க நிலை தீர்மானமான கட்டத்தை அடைந்ததையும் விழுதலுக்கான காரணத் தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: மூன்றாம் மாடியிலிருந்து கீழே விழுந்தான்
  rationale: τρίστεγον குறிக்கும் மூன்றாம் மாடியையும் κάτω குறிக்கும் கீழ்நோக்கிய விழுதலையும் நேரடியாகத் தருகிறது.
- source_word: ἤρθη νεκρός
  choice: அவனைத் தூக்கி எடுத்தபோது, அவன் இறந்திருந்தான்
  rationale: αἴρω என்ற வினையின் தூக்கி எடுக்கும் பொருளையும் νεκρός என்ற சொல்லின் நேரடியான ‘இறந்த’ பொருளையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: νεκρός என்பதை ‘இறந்திருந்தான்’ என நேரடியாக மொழிபெயர்ப்பதா அல்லது ‘இறந்தவனைப் போல இருந்தான்’ என மென்மைப்படுத்துவதா
  choice: இறந்திருந்தான்
  alternative: இறந்தவனைப் போல இருந்தான் / இறந்ததாகத் தோன்றினான்
  rationale: கிரேக்க மூலத்தில் சந்தேகம் அல்லது தோற்றம் என்பதைக் குறிக்கும் சொல் இல்லை. எனவே உரையின் வெளிப்படையான கூற்றையும் அதன் இறையியல் பதற்றத்தையும் மென்மைப்படுத்தாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சன்னல் திறப்பு’ என்பது பழமையான கட்டிடச் சூழலைக் கருத்தில் கொண்டு, கண்ணாடிச் சன்னலைத் தவறாகக் கற்பனை செய்யாமல் இருக்கத் தேர்ந்தெடுக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
