  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: ta
  text: நான் யாருடைய வெள்ளியையோ தங்கத்தையோ உடையையோ பேராசையுடன் விரும்பவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் யாருடைய வெள்ளியையோ தங்கத்தையோ உடையையோ விரும்பவில்லை.”
    reason: ἐπεθύμησα என்ற சொல்லை ஒழுக்க வலியுறுத்தல் குறைந்த ‘விரும்பினேன்’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: ἀργυρίου
  choice: வெள்ளி
  rationale: இச்சொல் நேரடியாக வெள்ளியைக் குறிக்கிறது; தங்கம், உடை ஆகிய மதிப்புள்ள பொருட்களுடன் வருவதால் அதன் தெளிவான பொருள் பாதுகாக்கப்படுகிறது.
- source_word: χρυσίου
  choice: தங்கம்
  rationale: வெள்ளி மற்றும் உடையுடன் இணைக்கப்பட்டுள்ள மதிப்புள்ள பொருளைக் குறிக்கும் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: ἱματισμοῦ
  choice: உடை
  rationale: ஆடை அல்லது உடைகளைக் குறிக்கிறது; ஒருமை தொகுப்புப் பொருளில் வரும் “உடை” நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: οὐδενὸς
  choice: ஒருவருடைய ... -யும் இல்லை
  rationale: மூலத்தின் உரிமைத் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்தி, எந்த ஒருவருக்கும் சொந்தமான பொருளையும் பவுல் விரும்பவில்லை என்பதைத் தெரிவிக்கிறது.
- source_word: ἐπεθύμησα
  choice: பேராசையுடன் விரும்பவில்லை
  rationale: ἐπιθυμέω என்பதன் ‘விரும்புதல்’ என்ற அடிப்படைப் பொருளையும், பிறருடைய உடைமைகளை நோக்கிய இச்சூழலின் எதிர்மறை ஒழுக்க நுட்பத்தையும் சேர்த்து வெளிப்படுத்துகிறது.
- source_word: ἢ ... ἢ ... ἢ
  choice: -யையோ ... -த்தையோ ... -யையோ
  rationale: மறுப்பு வாக்கியத்தில் மூன்று பொருட்களையும் தனித்தனி மாற்றுகளாக இணைக்கும் கிரேக்கத் தொடரை இயல்பான தமிழ் “-ஓ” அமைப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: பொருள் உடைமைகள் தொடர்பாக ἐπιθυμέω கொண்டுள்ள ஒழுக்க நுட்பம்
  choice: “பேராசையுடன் விரும்பவில்லை” என்று மொழிபெயர்த்தல்
  alternative: “விரும்பவில்லை”
  rationale: தன் நேர்மையையும் பேராசையின்மையையும் பவுல் எடுத்துரைக்கும் சூழல் எதிர்மறையான ஆசையை உணர்த்துகிறது. அதேவேளை, “விரும்புதல்” என்ற மூல வினையின் பரந்த பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. “பேராசையுடன் விரும்பவில்லை” என்பது பொருளைத் தெளிவாக்கினாலும், மூலச்சொல்லின் இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
