revisions:
- from: நான் ஒருவருடைய வெள்ளியையோ தங்கத்தையோ உடையையோ பேராசையுடன் விரும்பவில்லை.[a]
  to: நான் யாருடைய வெள்ளியையோ தங்கத்தையோ உடையையோ பேராசையுடன் விரும்பவில்லை.[a]
  rationale: “ஒருவருடைய” என்பதற்குப் பதிலாக “யாருடைய” பயன்படுத்தப்பட்டுள்ளது. இதனால் οὐδενός-இன் ‘யாருடையதும் இல்லை’ என்ற முழுமையான மறுப்புப் பொருள் நவீன தமிழில் தெளிவாகிறது. மற்ற சொற்களும் அடிக்குறிப்பும் மூலத்தின் பொருளையும் மாற்று நுட்பத்தையும் பாதுகாக்கின்றன.
