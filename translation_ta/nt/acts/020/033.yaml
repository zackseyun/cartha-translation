review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders silver, gold, clothing, and the morally negative sense of ἐπεθύμησα. However, “ஒருவருடைய” ordinarily means “one person’s” and does not reliably convey οὐδενός, “no one’s/anyone’s,” in this negated statement.
  naturalness: The sentence is generally natural modern Tamil. Moving “நான்” to the beginning and using “யாருடைய” yields a clearer and more idiomatic expression of the universal negative.
  terminology: “வெள்ளி,” “தங்கம்,” and collective “உடை” are appropriate. “பேராசையுடன் விரும்பவில்லை” adequately represents coveting without imposing a doctrinal interpretation; the footnote can retain the less ethically marked alternative.
  issues:
  - severity: medium
    issue: “ஒருவருடைய” is too limited for οὐδενός.
    rationale: The Greek denies coveting the possessions of anyone at all. In Tamil, “ஒருவருடைய” can be heard as referring to a single unspecified person, whereas “யாருடைய” naturally expresses “anyone’s” under negation.
  revised_text: நான் யாருடைய வெள்ளியையோ தங்கத்தையோ உடையையோ பேராசையுடன் விரும்பவில்லை.[a]
