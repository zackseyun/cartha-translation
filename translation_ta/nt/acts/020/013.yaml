  register: நவீனத் தரநிலைத் தமிழில், பயணக் கதைக்கேற்ற தெளிவான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாமே’ என்பதன் மூலம் மூலத்தின் வலியுறுத்தல் காக்கப்பட்டுள்ளது; செயல்பாட்டு எதிர்மறை அமைப்பும் ‘தரைவழி/கால்நடை’ நுணுக்கமும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
