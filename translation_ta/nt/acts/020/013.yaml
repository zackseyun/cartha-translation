base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: ta
  text: ஆனால் நாங்கள் முன்னதாகக் கப்பலில் ஏறி அசோசுக்குப் புறப்பட்டோம். அங்கே பவுலைக் கப்பலில் ஏற்றிக்கொள்ள எண்ணியிருந்தோம்; ஏனெனில், அவர் தாமே தரைவழியாகச் செல்ல எண்ணியிருந்ததால், அவ்வாறு ஏற்பாடு செய்திருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவ்வாறே ஏற்பாடு செய்யப்பட்டிருந்தது; ஏனெனில், அவர் தாமே கால்நடையாகச் செல்ல எண்ணியிருந்தார்.” διατεταγμένος ἦν என்பது வடிவத்தில் செயப்பாட்டாக உள்ளது; ஆனால் இச்சூழலில் அது பவுலின் முன் ஏற்பாட்டையோ அறிவுறுத்தலையோ குறிக்கலாம். πεζεύειν என்பது குழுவினரின் கப்பற்பயணத்திற்கு மாறாகத் தரைவழியாக, குறிப்பாகக் கால்நடையாகப் பயணம் செய்வதைக் குறிக்கிறது.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: முன்னதாகச் சென்று
  rationale: முதன்மை வினைக்கு முன்பு நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகால வினையெச்சத்தின் காலத் தொடரையும், பவுலுக்கு முன்பாகக் குழுவினர் சென்றதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τὸ πλοῖον
  choice: கப்பலுக்குச் சென்று
  rationale: இயக்கத்தைக் குறிக்கும் ἐπί இங்கு கப்பலுக்குச் செல்வதைச் சொல்கிறது; அடுத்துள்ள ‘புறப்பட்டோம்’ என்பது அவர்கள் கப்பலில் ஏறியதைச் சூழலிலேயே தெளிவாக்குகிறது.
- source_word: ἀνήχθημεν
  choice: புறப்பட்டோம்
  rationale: கடற்பயணச் சூழலில் இவ்வினை ‘கடலுக்குப் புறப்படுதல்’ அல்லது ‘கப்பலில் புறப்படுதல்’ என்று பொருள்படும். தமிழில் ‘அசோசுக்குப் புறப்பட்டோம்’ இயல்பாக உள்ளது.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: அசோசுக்கு
  rationale: கடற்பயணத்தின் இலக்கைச் சுட்டுகிறது; Ἆσσος என்பதன் தமிழ் ஒலிபெயர்ப்பு ‘அசோசு’.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: கப்பலில் ஏற்றிக்கொள்ளத் திட்டமிட்டு
  rationale: μέλλω இங்கு நோக்கத்தைச் சுட்டுகிறது; ἀναλαμβάνω பயணச் சூழலில் ஒருவரைக் கப்பலில் ஏற்றிக்கொள்வதைக் குறிக்கிறது.
- source_word: ἐκεῖθεν
  choice: அங்கிருந்து
  rationale: பவுலைக் கப்பலில் ஏற்றிக்கொள்ளவிருந்த இடத்திலிருந்து எனும் பிரிவிடப் பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: διατεταγμένος ἦν
  choice: அவர் அவ்வாறு ஏற்பாடு செய்திருந்தார்
  rationale: வடிவத்தில் செயல்பாட்டு எதிர்மறை அமைப்பாக இருந்தாலும், சூழலில் பவுலின் முன்திட்டத்தைக் குறிக்கும் தனிப்பட்ட செயப்பொருள் வாசிப்பு இயல்பாக உள்ளது; மூலத்தின் மாற்று வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: தாமே தரைவழியாகச் செல்ல எண்ணியிருந்ததால்
  rationale: αὐτός தரும் வலியுறுத்தலை ‘தாமே’ காட்டுகிறது. πεζεύω கப்பற்பயணத்திற்கு மாறாகத் தரைவழிப் பயணத்தைக் குறிக்கிறது; அது குறிப்பாக நடந்து செல்வதையும் குறிக்கக்கூடும்.
- source_word: δὲ
  choice: ஆனால்
  rationale: விவரிப்பவரின் குழுவுக்கும் பவுலுக்கும் இடையிலான மெல்லிய முரண்பாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
