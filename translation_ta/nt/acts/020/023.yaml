  text: πλὴν ὅτι τὸ πνεῦμα τὸ ἅγιον κατὰ πόλιν διαμαρτύρεταί ⸀μοι λέγον ὅτι δεσμὰ ⸂καὶ θλίψεις με⸃ μένουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: ta
  text: ஆனால், நகரந்தோறும் பரிசுத்த ஆவியானவர் எனக்குச் சாட்சியளித்து, சங்கிலிகளும் துன்பங்களும் எனக்குக் காத்திருக்கின்றன என்று சொல்கிறார்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நகரம் நகரமாக” அல்லது “ஒவ்வொரு நகரத்திலும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர், அடுத்தடுத்து வரும் நகரங்களில் இந்தச் சாட்சி மீண்டும் மீண்டும் அளிக்கப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கட்டுகளும் துன்பங்களும்” என்றும் மொழிபெயர்க்கலாம். “சங்கிலிகள்” என்பது கிரேக்கச் சொல்லின் தெளிவான உருவகத்தைத் தக்கவைக்கிறது; அது சிறைவாசத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: சில கையெழுத்துப் பிரதிகளில் “என்னை/எனக்கு” என்பதன் இடம் அல்லது இடம்பெறுதல் சிறிது வேறுபடுகிறது. எனினும், சங்கிலிகளும் துன்பங்களும் பவுலுக்குக் காத்திருக்கின்றன என்பதே பொருள்.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: ஆனால் ... என்பதைத் தவிர
  rationale: முந்தைய வசனத்திலுள்ள கூற்றுக்கு ஒரே விதிவிலக்கை அறிமுகப்படுத்தும் எதிர்மறை-விதிவிலக்கு வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியானவர்
  rationale: தெய்வீக ஆவியைக் குறிக்கும் திட்டவட்டமான சொற்றொடருக்கான நிலையான, மரியாதையான நவீனத் தமிழ் வடிவம்.
- source_word: κατὰ πόλιν
  choice: நகரந்தோறும்
  rationale: ஒவ்வொரு அடுத்தடுத்த நகரத்திலும் மீண்டும் மீண்டும் நிகழ்வதைக் காட்டும் பகிர்வுப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; முழுமையான உலகளாவிய தன்மையைத் தேவையின்றி வலியுறுத்தவில்லை.
- source_word: διαμαρτύρεταί μοι
  choice: எனக்குச் சாட்சியளித்து
  rationale: வினைச்சொல்லின் உறுதியான சாட்சியமளித்தல் என்ற பொருளைத் தக்கவைக்கிறது; ‘எச்சரித்து’ என்பது உரையின் முன்கூறல் தன்மையை அளவுக்கு மீறி விளக்கிவிடும்.
- source_word: λέγον
  choice: என்று சொல்வதை
  rationale: ஆவியானவரின் சாட்சியின் உள்ளடக்கத்தை நேரடியாக அறிமுகப்படுத்தும் இயல்பான தமிழ் வடிவம்.
- source_word: δεσμὰ
  choice: கட்டுகள்
  rationale: சிறைவாசம் என்ற விளைவை மட்டும் கூறாமல், கட்டப்படுதல் அல்லது விலங்கிடப்படுதல் என்ற மூலச் சொல்லின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: θλίψεις
  choice: துன்பங்கள்
  rationale: அழுத்தம், இடுக்கண், வேதனை ஆகியவற்றை உள்ளடக்கும் தீவிரத்தைக் கொண்டும் சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உள்ளது.
- source_word: με
  choice: எனக்காக
  rationale: அச்சிடப்பட்ட கிரேக்க உரையிலுள்ள முதல் நபர் சுட்டை, தமிழில் ‘எனக்காகக் காத்திருக்கின்றன’ என்ற இயல்பான அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: μένουσιν
  choice: காத்திருக்கின்றன
  rationale: இவை பவுலுக்கு வரவிருக்கின்றன, அவருக்கென முன்நிற்கின்றன என்ற எதிர்கால நோக்கை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘பரிசுத்த ஆவியானவர்’ என்பவரின் தன்மை
  choice: பவுலுக்குச் சாட்சியளித்துப் பேசும் தனிப்பட்ட தெய்வீக செயற்பாட்டாளர்
  alternative: தனித்தன்மையற்ற ஆவிக்குரிய ஆற்றல்
  rationale: உரை பரிசுத்த ஆவியானவரைச் சாட்சியளித்துச் சொல்பவராக முன்வைக்கிறது. இலக்கணத்திலும் வினைச்செயல்களிலும் காணப்படும் தனிப்பட்ட செயற்பாட்டை மொழிபெயர்ப்பு மறைக்கவில்லை; அதே நேரத்தில் வசனம் கூறுவதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை. வசனம் 22-இலிருந்து தொடரும் வாக்கியமாக இருப்பதால், தனித்து வாசிக்கும்போதும் பொருள் நிறைவடைய ‘வேறொன்றும் எனக்குத் தெரியாது’ சேர்க்கப்பட்டுள்ளது; இது πλὴν ὅτι-யின் முந்தைய சூழலை வெளிப்படுத்துகிறது. அடிக்குறி குறிகள் உரையில் [a][b][c] என இடம்பெற்றுள்ளன.
