source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: ta
  text: அவனைப் பிடித்துச் சிறையில் அடைத்தான். அவனைக் காவல் காக்கும்படி, தலா நான்கு படைவீரர்களைக் கொண்ட நான்கு குழுக்களிடம்[a] அவனை ஒப்படைத்தான். பஸ்கா பண்டிகைக்குப் பிறகு[b] அவனை மக்கள்முன் கொண்டுவரத் திட்டமிட்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘படைவீரர்களின் நான்கு நால்வர் குழுக்கள்’; அதாவது, தலா நான்கு வீரர்களைக் கொண்ட நான்கு குழுக்கள்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் πάσχα என்பது ‘பஸ்கா’ என்று பொருள்; சில பழைய மொழிபெயர்ப்புகள் இங்கே ‘ஈஸ்டர்’ என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: அவனைப் பிடித்து
  rationale: இறந்தகாலப் பங்கேற்புவினை பிரதான வினைக்கு முன் நடந்த கைது நடவடிக்கையைக் குறிக்கிறது; ‘பிடித்து’ என்பது இயல்பாகவும் காவலில் எடுத்த பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: ἔθετο εἰς φυλακήν
  choice: சிறையில் அடைத்தான்
  rationale: சிறைப்படுத்துதலைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வழக்கு; ‘வைத்தான்’ என்பதைவிட சூழலுக்குத் தெளிவானது.
- source_word: παραδοὺς
  choice: ஒப்படைத்தான்
  rationale: பேதுருவை படைவீரர்களின் காவலுக்கு மாற்றியதைத் துல்லியமாகக் காட்டுகிறது.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: தலா நான்கு படைவீரர்களைக் கொண்ட நான்கு குழுக்களிடம்
  rationale: τετράδιον என்பது நான்கு பேர் கொண்ட குழு; இங்கு அத்தகைய நான்கு குழுக்கள் என்பதைக் குழப்பமின்றி வெளிப்படுத்துகிறது.
- source_word: φυλάσσειν αὐτόν
  choice: அவனைக் காவல் காக்கும்படி
  rationale: ஒப்படைத்ததன் நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: βουλόμενος
  choice: திட்டமிட்டிருந்தான்
  rationale: ஏரோதின் திட்டமிட்ட நோக்கத்தைத் தெரிவிக்கிறது; வெறும் விருப்பமாகக் குறைத்துவிடவில்லை.
- source_word: μετὰ τὸ πάσχα
  choice: பஸ்கா பண்டிகைக்குப் பிறகு
  rationale: πάσχα யூதர்களின் பஸ்கா பண்டிகையைக் குறிக்கிறது; மூலமொழியின் பொருளை நேரடியாகத் தருகிறது.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: அவனை மக்கள்முன் கொண்டுவர
  rationale: பொதுமக்கள் முன்னிலையில் அவனை வெளிக்கொண்டு வருவதைத் தெரிவிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத முறையான விசாரணை அல்லது மரணதண்டனையைச் சேர்க்கவில்லை.
- source_word: λαῷ
  choice: மக்கள்
  rationale: பொதுமக்களை ஒரு சமூகத் தொகுதியாகக் குறிக்கும் இயல்பான, பரந்த சொல்.
theological_decisions:
- issue: πάσχα என்பதன் மொழிபெயர்ப்பு
  choice: பஸ்கா பண்டிகை
  alternative: ஈஸ்டர்
  rationale: கிரேக்கச் சொல் இச்சூழலில் யூதர்களின் பஸ்காவையே குறிக்கிறது. சில பழைய மொழிபெயர்ப்பு மரபுகளில் காணப்படும் ‘ஈஸ்டர்’ என்பது இங்குள்ள நேரடியான சொற்பொருள் அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கதைநடை பயன்படுத்தப்பட்டுள்ளது. படைவீரர் குழுக்களின் எண்ணிக்கை முதன்மை உரையிலேயே தெளிவாக்கப்பட்டு, மூலத்தின் சொற்றொடர் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
