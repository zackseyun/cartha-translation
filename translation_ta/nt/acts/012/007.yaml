source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: ta
  text: இதோ, ஆண்டவருடைய தூதர் அருகில் நின்றார்[a]; சிறையறையில் ஒளி பிரகாசித்தது[b]. அவர் பேதுருவின் பக்கத்தில் தட்டி அவனை எழுப்பி, “சீக்கிரமாக எழுந்திரு” என்றார். அவனுடைய கைகளிலிருந்து சங்கிலிகள் கழன்று விழுந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அருகில் நின்றார்” அல்லது “திடீரெனத் தோன்றினார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை அருகில் நிற்பதையோ திடீர் முன்னிலையையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “அறையில்” அல்லது “கூடத்தில்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பொதுவானது; சிறைச்சாலைச் சூழலால் இங்கு “சிறையறை” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: நிகழ்வை உயிரோட்டமாக வாசகரின் கவனத்துக்குக் கொண்டுவரும் கிரேக்க இடைச்சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: ἄγγελος κυρίου
  choice: ஆண்டவருடைய தூதர்
  rationale: தூதர் ஆண்டவருக்குரியவர் அல்லது அவரால் அனுப்பப்பட்டவர் என்ற இயல்பான உடைமைத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ἐπέστη
  choice: திடீரென அருகில் நின்றார்
  rationale: அருகில் நிற்பதோடு திடீர் தோற்றத்தையும் குறிக்கக்கூடிய வினையின் இரு நுணுக்கங்களையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: φῶς ἔλαμψεν
  choice: ஒளி பிரகாசித்தது
  rationale: பெயர்ச்சொல்-வினை அமைப்பை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: ἐν τῷ οἰκήματι
  choice: சிறையறையில்
  rationale: கிரேக்கச் சொல் பொதுவாக அறை அல்லது இடத்தைக் குறித்தாலும், உடனுள்ள சிறைச்சாலைச் சூழலில் ‘சிறையறை’ தெளிவான பொருத்தமான தேர்வு.
- source_word: πατάξας τὴν πλευρὰν
  choice: விலாப்பக்கத்தில் தட்டி
  rationale: πατάσσω என்பதன் உடல் தொடுதல் அல்லது அடித்தல் சார்ந்த வலிமையை முற்றிலும் மென்மையாக்காமல், ஒருவரை விழிக்கச் செய்யும் இச்சூழலுக்கு இயல்பாகப் பொருந்துகிறது; πλευρά உடலின் பக்கத்தை, குறிப்பாக விலாப்பகுதியைச் சுட்டுகிறது.
- source_word: ἤγειρεν αὐτόν
  choice: அவனை எழுப்பி
  rationale: இங்கு தூக்கத்திலிருந்து விழிக்கச் செய்தல் என்பதே சூழல்சார் பொருள்; தமிழ் ‘எழுப்பி’ என்பது விழிக்கச் செய்தலும் எழுந்திருக்கச் செய்தலும் ஆகிய இரண்டுக்கும் இடமளிக்கிறது.
- source_word: Ἀνάστα ἐν τάχει
  choice: சீக்கிரமாக எழுந்திரு
  rationale: கட்டளையின் அவசரத்தையும் நவீனத் தமிழின் இயல்பையும் காக்கிறது.
- source_word: ἐξέπεσαν ... αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: கைகளிலிருந்து சங்கிலிகள் கழன்று விழுந்தன
  rationale: சங்கிலிகள் தாமாக விடுபட்டு கீழே விழுந்த திடீர் நிகழ்வை வெளிப்படுத்துகிறது; χείρ என்பதற்கு விளக்கமாக ‘மணிக்கட்டுகள்’ என்று மாற்றாமல் ‘கைகள்’ எனத் தக்கவைக்கிறது.
theological_decisions:
- issue: ἄγγελος κυρίου என்பதில் κύριος-ஐ மொழிபெயர்த்தல்
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: புதிய ஏற்பாட்டுச் சூழலில் மரியாதையுடனும் வழக்குடனும் உள்ள ‘ஆண்டவர்’ என்பதைக் கொண்டு, தேவையற்ற தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் மூலத்தின் பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இதோ’ லூக்காவின் உயிரோட்டமான கதைசொல்லலைத் தக்கவைக்கிறது. ‘திடீரென’ என்பது ἐπέστη-யின் சாத்திய நுணுக்கத்தை உரையில் வெளிப்படுத்தினாலும், அடிக்குறிப்பு அதன் பொருள் வரம்பைத் திறந்தவாறே வைத்துள்ளது.
