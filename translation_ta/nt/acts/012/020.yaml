  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒருமனப்பட்டு’ மூலத்தின் கூட்டு நோக்கத்தை காக்கிறது. அரிதான அரசவைப் பதவி முதன்மை உரையில் சுருக்கமாகவும் அடிக்குறிப்பில் சொல்லெழுத்துப் பின்னணியுடனும் தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் பொருத்தமான இடங்களில் இடம்பெற்றுள்ளன.
