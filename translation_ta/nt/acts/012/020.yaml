source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: ta
  text: அவர் தீரு, சீதோன் மக்கள்மீது கடுங்கோபத்தில் இருந்தார்[a]. ஆனால் அவர்கள் ஒருமனப்பட்டு அவரிடம் வந்து, அரசரின் படுக்கையறைப் பொறுப்பாளரான பிலாஸ்துவை இணங்கச் செய்தபின்[b], சமாதானம் வேண்டிக்கொண்டிருந்தார்கள். ஏனெனில், அவர்களுடைய நாட்டுக்கு அரசரின் ஆட்சிப்பகுதியிலிருந்தே உணவு வழங்கப்பட்டுவந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீரு, சீதோன் மக்களிடம் பகைமை கொண்டிருந்தார்.’ கிரேக்கச் சொல் தீவிரமான கோபம் அல்லது பகைமையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லெழுத்தாக, ‘அரசரின் படுக்கையறைக்குப் பொறுப்பானவர்’; அரசரின் தனிப்பட்ட அறைகளை அணுகும் அதிகாரமுள்ள அரசவை அலுவலராக இருக்கலாம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘அவர்களுடைய பிரதேசத்துக்கு அரசரின் நிலப்பகுதியிலிருந்து உணவுப் பொருள் வழங்கப்பட்டுவந்தது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: கடுங்கோபத்தில் இருந்தார்
  rationale: இந்த வினையெச்சம் தீவிரமான கோபம் அல்லது பகைமையான நிலையை உணர்த்துகிறது. ‘கடுங்கோபத்தில் இருந்தார்’ என்பது இயல்பான நவீனத் தமிழில் அதன் தீவிரத்தை வெளிப்படுத்துகிறது.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: தீரு, சீதோன் மக்கள்
  rationale: இவை அந்த நகரங்களின் குடிமக்களைக் குறிக்கும் இனப்பெயர்கள்; தமிழில் நகரப்பெயர்களோடு ‘மக்கள்’ சேர்ப்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ὁμοθυμαδόν
  choice: ஒருமனப்பட்டு
  rationale: வெறுமனே ஒன்றாக வந்ததைக் காட்டிலும், பகிர்ந்த ஒரே நோக்கத்துடன் செயல்பட்டதை இது காக்கிறது.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: அவரிடம் வந்து
  rationale: ஒருவரிடம் வந்து முன்னிலையாவதைக் குறிக்கும் சொற்றொடரின் தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: πείσαντες
  choice: தங்கள் பக்கம் இணங்கச் செய்தபின்
  rationale: முதன்மைச் செயலுக்கு முன் பிலாஸ்துவின் ஆதரவைப் பெற்றார்கள் என்ற தொடரை வெளிப்படுத்துகிறது; ‘சம்மதிக்கச் செய்தபின்’ என்பதைக் காட்டிலும் அரசவைக் சூழலில் நோக்கம் தெளிவாகிறது.
- source_word: Βλάστον
  choice: பிலாஸ்து
  rationale: கிரேக்கப் பெயரான Βλάστος என்பதற்கான தமிழெழுத்துப் பெயர்ப்பு.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: அரசரின் அந்தப்புர அதிகாரி
  rationale: சொல்லெழுத்தாக ‘அரசரின் படுக்கையறைக்குப் பொறுப்பானவர்’ என்பதைக் குறிக்கும் அரசவைப் பதவி. சுருக்கமாகவும் மரியாதையான நடையிலும் இதைத் தருகிறது; அடிப்படைப் படிமம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ᾐτοῦντο εἰρήνην
  choice: சமாதானம் வேண்டிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை, அவர்கள் தொடர்ந்து அல்லது முயன்று விண்ணப்பித்ததைக் காட்டுகிறது; அரசியல் சமாதானத்திற்கான வேண்டுகோளையும் தெளிவாக்குகிறது.
- source_word: διὰ τὸ τρέφεσθαι
  choice: உணவு கிடைத்துவந்ததால்
  rationale: διά உடன் வரும் infinitive காரணத்தைச் சுட்டுகிறது; passive τρέφεσθαι உணவு வழங்கப்பட்டு வாழ்வாதாரம் கிடைத்ததை உணர்த்துகிறது.
- source_word: αὐτῶν τὴν χώραν
  choice: அவர்களுடைய நாடு
  rationale: χώρα என்பது நிலப்பகுதி, பிரதேசம் அல்லது நாடு எனப் பொருள்படும்; இங்குள்ள அரசியல்-பொருளாதாரச் சூழலுக்கு ‘நாடு’ பொருந்துகிறது.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: அரசரின் ஆட்சிப்பகுதியிலிருந்து
  rationale: βασιλικῆς என்பது பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெயரடை; அரசருக்குரிய நிலப்பரப்பு அல்லது ஆட்சிப்பகுதியைக் குறிக்கிறது. மூலத்தில் விடப்பட்டுள்ள பெயர்ச்சொல்லைத் தமிழில் இயல்பாக நிரப்புகிறது.
