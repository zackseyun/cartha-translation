source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: ta
  text: பேதுரு தன்னுணர்வுக்கு வந்தபோது[a], “ஆண்டவர் தமது தூதனை அனுப்பி, ஏரோதின் கையிலிருந்தும்[b] யூத மக்கள் எதிர்பார்த்திருந்த எல்லாவற்றிலிருந்தும்[c] என்னை மீட்டார் என்பதை இப்போது நான் உண்மையாகவே அறிந்துகொண்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் நினைவுக்கு வந்தபோது” அல்லது “தெளிவுணர்வு பெற்றபோது.”
    reason: lexical_alternative
  - marker: b
    text: “ஏரோதின் கையிலிருந்து” என்பது ஏரோதின் அதிகாரத்திலிருந்து அல்லது கட்டுப்பாட்டிலிருந்து என்பதைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: 'இன்னொரு மொழிபெயர்ப்பு: “யூத மக்களின் முழு எதிர்பார்ப்பிலிருந்தும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: தன்னுணர்வுக்கு வந்தபோது
  rationale: பேதுரு முழு விழிப்புணர்வுக்குத் திரும்பியதைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளையும் அதன் உருவகத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀληθῶς
  choice: உண்மையாகவே
  rationale: பேதுருவின் உறுதியான உணர்தலை வலியுறுத்தும் வினையடையின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἐξαπέστειλεν
  choice: அனுப்பி
  rationale: இச்சூழலில் தேவையற்ற விறைப்பின்றி ‘அனுப்பினார்’ என்ற அடிப்படைச் செயலை இயல்பாகக் குறிக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: கிரேக்கச் சொல் குறிப்பிடாத ஆளைக் கூடுதலாக அடையாளப்படுத்தாமல், அதன் மரியாதைமிக்க வழக்கமான தமிழ் இணையைப் பயன்படுத்துகிறது.
- source_word: ἄγγελον
  choice: தூதனை
  rationale: இக்கதையில் வானதூதரே குறிக்கப்படுகிறார்; தமிழில் ‘தூதன்’ என்பது இச்சூழலுக்கு இயல்பான வேதாகமப் பயன்பாடு.
- source_word: ἐξείλατό με
  choice: என்னை மீட்டார்
  rationale: ஆபத்திலிருந்தும் அதிகாரத்தின் பிடியிலிருந்தும் விடுவித்த செயலை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: ஏரோதின் கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் மூலமொழி உருவகத்தைத் தமிழிலும் புரியக்கூடிய வகையில் தக்கவைக்கிறது.
- source_word: πάσης τῆς προσδοκίας
  choice: எதிர்பார்த்திருந்த எல்லாவற்றிலிருந்து
  rationale: மக்களின் ‘எதிர்பார்ப்பு’ என்பதைக் காட்டிலும் அவர்கள் எதிர்பார்த்த முடிவு அல்லது நிகழ்வு குறிக்கப்படுவதை இயல்பாக வெளிப்படுத்துகிறது; அதேவேளையில் அதன் உள்ளடக்கத்தை ஊகித்து நிரப்பவில்லை.
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: யூத மக்கள்
  rationale: கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான, மரியாதையான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: κύριος என்பதன் குறிப்பு
  choice: ஆண்டவர்
  alternative: கடவுள் / உயிர்த்தெழுந்த இயேசு
  rationale: இவ்விடத்தில் கிரேக்க உரை κύριος என்று மட்டுமே கூறுகிறது. அது யாரைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பில் தீர்மானித்து விடாமல், மூலத்தின் இறையியல் திறந்தநிலையை ‘ஆண்டவர்’ தக்கவைக்கிறது.
- issue: யூத மக்களின் எதிர்பார்ப்பின் உள்ளடக்கம்
  choice: யூத மக்கள் எதிர்பார்த்திருந்த எல்லாவற்றிலிருந்தும்
  alternative: யூத மக்கள் எனக்குச் செய்ய எதிர்பார்த்திருந்த தண்டனையிலிருந்து
  rationale: மூல உரை எதிர்பார்ப்பின் துல்லியமான விளைவை வெளிப்படையாகக் கூறவில்லை. ஆகவே மரணம் அல்லது தண்டனை என்று விளக்கிச் சேர்க்காமல் அதன் இயல்பான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘தன்னுணர்வுக்கு வந்தபோது’ மற்றும் ‘ஏரோதின் கையிலிருந்து’ ஆகியவை மூலத்தின் உருவகங்களைத் தக்கவைக்கின்றன; ‘யூத மக்கள் எதிர்பார்த்திருந்த எல்லாவற்றிலிருந்தும்’ என்பது கடினமான பெயர்ச்சொல் அமைப்பை இயல்பான தமிழாக்கமாக வழங்குகிறது.
