  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: ta
  text: தேவதூதர் அவரிடம், “உன் இடுப்புக் கச்சையைக் கட்டிக்கொள்[a]; உன் செருப்புகளை அணிந்துகொள்” என்றார். அவர் அப்படியே செய்தார். தேவதூதர் அவரிடம், “உன் மேலங்கியைப் போர்த்திக்கொள்[b]; என்னைப் பின்தொடர்” என்கிறார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் இடுப்புக் கச்சையை இறுக்கிக் கட்டிக்கொள்.” கிரேக்கக் கட்டளை, பயணத்திற்கோ செயலுக்கோ ஆயத்தமாக இடுப்புக் கச்சையை இறுக்கிக் கட்டுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் மேலங்கியை உன்னைச் சுற்றிப் போர்த்திக்கொள்.”
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில், “என்கிறார்.” கடந்தகால நிகழ்வை உயிரோட்டமாக விவரிக்க இங்கு நிகழ்கால வினை பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: தூதர்
  rationale: சிறையில் இயற்கைக்கு அப்பாற்பட்ட விதத்தில் தோன்றிய விண்ணுலகத் தூதரையே சூழல் குறிக்கிறது. தமிழில் ‘தூதர்’ என்பது வேதாகமப் பயன்பாட்டில் இதை இயல்பாகக் குறிக்கிறது.
- source_word: Ζῶσαι
  choice: உன் இடுப்புக் கச்சையைக் கட்டிக்கொண்டு
  rationale: ζώννυμι இங்கு ஆடையை இடுப்புக் கச்சையால் இறுக்கிக் கட்டி ஆயத்தமாவதைக் குறிக்கிறது. கட்டளையின் குறிப்பிட்ட உடல் செயலை நவீன வாசகருக்குத் தெளிவுபடுத்துகிறது.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: உன் செருப்புகளை அணிந்துகொள்
  rationale: செருப்புகளைப் பாதங்களில் அணிந்துகொள்ளும் கட்டளையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐποίησεν δὲ οὕτως
  choice: அவர் அப்படியே செய்தார்
  rationale: முந்தைய கட்டளைகளுக்குப் பேதுரு கீழ்ப்படிந்ததை οὕτως சுருக்கமாகக் குறிக்கிறது.
- source_word: λέγει
  choice: என்கிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தக்கவைத்து, நிகழ்வின் விவரிப்புக்கு உயிரோட்டம் அளிக்கிறது.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: உன் மேலங்கியைப் போர்த்திக்கொண்டு
  rationale: ἱμάτιον என்பது வெளிப்புற ஆடை; περιβάλλω அதைத் தன்னைச் சுற்றிப் போட்டுக்கொள்வதைக் குறிக்கிறது. ‘மேலங்கியைப் போர்த்திக்கொண்டு’ இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀκολούθει μοι
  choice: என்னைப் பின்தொடர்ந்து வா
  rationale: ἀκολουθέω என்பதன் ‘பின்தொடர்’ என்ற அடிப்படைப் பொருளையும், இங்கு இடம்பெயர்ந்து வரும்படி கொடுக்கப்படும் கட்டளையையும் இயல்பான தமிழில் காக்கிறது.
