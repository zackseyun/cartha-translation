translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மரியாதைப் பன்மை தொடர்ச்சியாகப் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் εἶπεν என்ற இறந்தகாலத்திலிருந்து λέγει என்ற வரலாற்று நிகழ்காலத்துக்கு ஏற்படும் மாற்றம் பிரதான உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
