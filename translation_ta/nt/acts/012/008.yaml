revisions:
- from: அப்போது அந்தத் தூதர் அவரிடம், “உன் இடுப்புக் கச்சையைக் கட்டிக்கொண்டு[a], உன் செருப்புகளை அணிந்துகொள்” என்றார். அவர் அப்படியே செய்தார். பின்னர் தூதர் அவரிடம், “உன் மேலங்கியைப் போர்த்திக்கொண்டு[b], என்னைப் பின்தொடர்ந்து வா” என்கிறார்[c].
  to: தேவதூதர் அவரிடம், “உன் இடுப்புக் கச்சையைக் கட்டிக்கொள்[a]; உன் செருப்புகளை அணிந்துகொள்” என்றார். அவர் அப்படியே செய்தார். தேவதூதர் அவரிடம், “உன் மேலங்கியைப் போர்த்திக்கொள்[b]; என்னைப் பின்தொடர்” என்கிறார்[c].
  rationale: The revision clarifies that the referent is a heavenly angel, corrects the inaccurate alternative in footnote a, and uses coordinated Tamil imperatives that closely reflect the Greek commands. It retains the Greek historical present in ‘என்கிறார்’ and its explanatory footnote, without assigning theological significance beyond the narrative context.
