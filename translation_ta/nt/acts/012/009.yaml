source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: ta
  text: அவன் வெளியே சென்று, தூதரைப் பின்தொடர்ந்து கொண்டிருந்தான். ஆனால், தூதர் மூலமாக[a] நடைபெறுவது உண்மையானது என்று அவனுக்குத் தெரியவில்லை; தான் ஒரு தரிசனத்தைக் காண்பதாக நினைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூதரால்.” கிரேக்கத்தில் உள்ள சொற்றொடர் தூதரின் மூலம் அல்லது தூதரால் நிகழும் செயலைக் குறிக்கலாம்; இங்கு ‘தூதர் மூலமாக’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: வெளியே சென்று
  rationale: முதன்மை வினைக்கு முன் நிகழும் இயக்கத்தை இயல்பான தமிழ் வினையெச்சத்தால் காட்டுகிறது.
- source_word: ἠκολούθει
  choice: அவரைப் பின்தொடர்ந்தான்
  rationale: இறந்தகாலத் தொடர்நிலைச் செயலைத் தமிழ் கதைநடையில் இயல்பாகத் தருகிறது; முந்தைய சூழலில் தூதரே சுட்டப்படுவதால் மரியாதை ஒருமைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: οὐκ ᾔδει
  choice: அவனுக்குத் தெரியவில்லை
  rationale: அறியாமை அல்லது உணராமையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀληθές
  choice: உண்மையானது
  rationale: தரிசனம் என்ற எண்ணத்துக்கு எதிராக நிகழ்வின் நிஜத்தன்மையைச் சுட்டுகிறது.
- source_word: τὸ γινόμενον
  choice: நடந்துகொண்டிருந்தது
  rationale: நிகழ்வு அப்போது நடைபெற்றுக்கொண்டிருந்த தொடர்நிலையைப் பாதுகாக்கிறது.
- source_word: διὰ τοῦ ἀγγέλου
  choice: தூதர் மூலமாக
  rationale: διά + உரிமை வேற்றுமை குறிக்கும் இடைமுகச் செயற்பாட்டை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: ἐδόκει
  choice: நினைத்தான்
  rationale: பேதுருவின் அப்போதைய எண்ணம் அல்லது அனுமானத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ὅραμα
  choice: ஒரு தரிசனம்
  rationale: வெளிப்பாட்டு அல்லது காட்சியனுபவத்துக்கான வழக்கமான, கண்ணியமான வேதாகமத் தமிழ் சொல்.
- source_word: βλέπειν
  choice: காண்பதாக
  rationale: ἐδόκει என்பதுடன் இணைந்து, தான் அனுபவிப்பதாக பேதுரு எண்ணிய காட்சியை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தூதரின் செயலின் தன்மை
  choice: தூதர் மூலமாக
  alternative: தூதரால்
  rationale: கிரேக்க διά என்ற முன்னிடைச்சொல்லின் இடைமுகச் செயற்பாட்டு நுணுக்கத்தைப் பாதுகாத்து, தூதரின் சுயாதீன ஆற்றலைப் பற்றி உரை கூறாத முடிவைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை. கிரேக்கத்தின் தொடர்நிலை உணர்வு ‘நடந்துகொண்டிருந்தது’ என்பதில் காக்கப்பட்டுள்ளது. ‘தூதர் மூலமாக’ என்பது மூலமொழியின் இடைமுக நுணுக்கத்தைத் தெளிவாகத் தருவதால் அடிக்குறிப்பு தேவையில்லை.
