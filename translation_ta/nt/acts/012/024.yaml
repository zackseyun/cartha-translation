  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ δὲ λόγος τοῦ ⸀θεοῦ ηὔξανεν καὶ ἐπληθύνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/024.yaml
  text: But the word of God continued to grow and multiply[a].
translation:
  language: ta
  text: ஆனால் கடவுளுடைய வார்த்தை தொடர்ந்து வளர்ந்து பெருகியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளுடைய செய்தி தொடர்ந்து வளர்ந்து பெருகியது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: வார்த்தை
  rationale: லூக்கா அடிக்கடி பயன்படுத்தும் ‘கடவுளுடைய வார்த்தை’ என்ற சொற்றொடரைப் பாதுகாக்கிறது; சூழலில் இது அறிவிக்கப்பட்ட கடவுளின் செய்தியைக் குறிக்கிறது. ‘செய்தி’ என்பதும் பொருத்தமான மாற்றாகும்.
- source_word: τοῦ θεοῦ
  choice: கடவுளுடைய
  rationale: கடவுளுக்குரிய அல்லது கடவுளிடமிருந்து வரும் வார்த்தை என்ற உடைமைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ηὔξανεν
  choice: தொடர்ந்து வளர்ந்து
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் காட்டும் நீடித்த செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐπληθύνετο
  choice: பெருகியது
  rationale: முந்தைய ‘வளர்ந்து’ என்பதிலிருந்து வேறுபட்ட விரிவடைதல் என்ற பொருளைப் பாதுகாக்கிறது; சூழலில் வார்த்தையின் பரவலும் தாக்கமும் அதிகரித்ததைக் குறிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய பகுதியில் ஏரோதின் அழிவு விவரிக்கப்பட்டதற்கும், இங்கே கடவுளுடைய வார்த்தையின் வளர்ச்சி விவரிக்கப்படுவதற்கும் இடையிலான முரண்பாட்டைச் சுட்டுகிறது.
theological_decisions:
- issue: ‘கடவுளுடைய வார்த்தை’ என்பதை இன்னும் பொருள்வழியாக ‘கடவுளுடைய செய்தி’ என மொழிபெயர்க்க வேண்டுமா?
  choice: கடவுளுடைய வார்த்தை
  alternative: கடவுளுடைய செய்தி
  rationale: ‘கடவுளுடைய வார்த்தை’ என்பது லூக்காவின் மீண்டும் வரும் சொற்றொடரையும் அதன் வேதாகம மற்றும் அறிவிப்புச் சார்ந்த பரந்த ஒலியையும் பாதுகாக்கிறது; ‘செய்தி’ என்பது சூழலுக்கேற்ற மாற்று என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வார்த்தை’ என்ற பரிச்சயமான வேதாகமச் சொல்லாட்சி பாதுகாக்கப்பட்டு, அதன் சூழல்சார் பொருளான ‘செய்தி’ அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
