source:
  edition: SBLGNT
  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: ta
  text: அவள் பேதுருவின் குரலை அறிந்ததும், மகிழ்ச்சியால் வாசற்கதவைத்[a] திறக்காமல், உள்ளே ஓடிப்போய், வாசற்கதவுக்கு முன் பேதுரு நின்றுகொண்டிருப்பதாக அறிவித்தாள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வாசற்கதவு” என்பதற்கான கிரேக்கச் சொல் (πυλών), தெருவிலிருந்து வீட்டின் வளாகத்திற்குள் செல்லும் நுழைவாயிலையோ வெளிக்கதவையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “வாசற்கதவுக்கு முன் பேதுரு நின்றுகொண்டிருப்பதை அறிவித்தாள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: அடையாளம் கண்டுகொண்டதும்
  rationale: கேட்ட குரல் பேதுருடையது என்று அவள் உணர்ந்து அடையாளம் கண்டதை இறந்தகாலப் பங்கேற்புச் சொல் குறிக்கிறது; தமிழில் நிகழ்வுகளின் தொடரையும் உடனடித்தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὴν φωνὴν τοῦ Πέτρου
  choice: பேதுருவின் குரலை
  rationale: இச்சூழலில் φωνή பொதுவான ‘ஒலி’ அல்ல, குறிப்பிட்ட நபரின் குரல்.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: மகிழ்ச்சியால்
  rationale: ἀπό இங்கு காரணத்தைக் குறிக்கிறது; அவளுடைய மகிழ்ச்சியே கதவைத் திறக்காத உடனடி காரணம் என்பதைச் சுருக்கமாகவும் தெளிவாகவும் கூறுகிறது.
- source_word: οὐκ ἤνοιξεν
  choice: திறக்காமல்
  rationale: ἀνοίγω என்பதன் நேரான பொருள் ‘திறத்தல்’; ‘பூட்டைத் திறத்தல்’ போன்ற மூலத்தில் இல்லாத விவரத்தைச் சேர்க்கவில்லை.
- source_word: τὸν πυλῶνα / τοῦ πυλῶνος
  choice: வாசற்கதவு / வாசற்கதவுக்கு
  rationale: πυλών வீட்டின் உட்கதவைக் காட்டிலும் தெருவிலிருந்து வளாகத்திற்குள் செல்லும் வெளிப்புற நுழைவையோ அதன் கதவையோ குறிக்கலாம்; ‘வாசற்கதவு’ தமிழில் இச்சூழலுக்கு இயல்பானது.
- source_word: εἰσδραμοῦσα
  choice: உள்ளே ஓடிப்போய்
  rationale: உள்ள்நோக்கி வேகமாக ஓடிய இயக்கத்தையும் கதையின் துரிதத்தையும் காக்கிறது.
- source_word: ἀπήγγειλεν
  choice: அறிவித்தாள்
  rationale: ἀπαγγέλλω ஒரு செய்தியைத் தெரிவித்தல் அல்லது அறிவித்தல் என்ற பொருளுடையது; இங்கு ‘அறிவித்தாள்’ கண்ணியமான இயல்பான நடையில் பொருந்துகிறது.
- source_word: ἑστάναι
  choice: நின்றுகொண்டிருப்பதாக
  rationale: ἵστημι என்பதன் நிறைவுக்கால வினையெச்ச வடிவம் தொடரும் நிலையைச் சுட்டுகிறது; பேதுரு அப்போது அங்கே நின்றுகொண்டிருந்தார் என்ற நிலைப்பொருளைக் காக்கிறது.
- source_word: πρὸ τοῦ πυλῶνος
  choice: வாசற்கதவுக்கு முன்
  rationale: πρό + genitive என்பதன் இடப்பொருளான ‘முன்/எதிரே’ என்பதை நேரடியாகப் பாதுகாக்கிறது.
