source:
  edition: SBLGNT
  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: ta
  text: ஏரோது அவனைத் தேடினான்; ஆனால் கண்டுபிடிக்கவில்லை. பின்னர் காவலர்களை விசாரித்து, அவர்களை மரணதண்டனைக்காகக் கொண்டு செல்லும்படி கட்டளையிட்டான்.[a] அதன்பின் அவன் யூதேயாவிலிருந்து செசரியாவுக்கு இறங்கிச் சென்று, அங்கே தங்கியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: “அவர்களை அழைத்துச் செல்லும்படி கட்டளையிட்டான்.” இச்சூழலில், இது அவர்கள் மரணதண்டனைக்காகக் கொண்டு செல்லப்படுவதைக் குறிக்க வாய்ப்பு மிகுந்தது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας
  choice: தேடியும்
  rationale: பேதுருவைக் கண்டுபிடிக்க ஏரோது மேற்கொண்ட திட்டமிட்ட தேடலை இயல்பான தமிழில் தெரிவிக்கிறது; இறந்தகாலப் பங்கேற்புவினையின் முன்னிகழ்வும் சூழலில் தெளிவாக உள்ளது.
- source_word: μὴ εὑρὼν
  choice: கண்டுபிடிக்காததால்
  rationale: தேடல் தோல்வியடைந்ததைத் தொடர்ந்து காவலர்கள் விசாரிக்கப்பட்ட காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνακρίνας
  choice: விசாரித்து
  rationale: சாதாரணமாகக் கேள்வி கேட்பதைவிட அதிகாரபூர்வமான அல்லது நீதித்துறை சார்ந்த விசாரணையை இச்சொல் குறிக்க முடியும்; இச்சூழலுக்கு ‘விசாரித்து’ பொருத்தமானது.
- source_word: φύλακας
  choice: காவலர்களை
  rationale: பேதுருவைக் காவல் காக்க நியமிக்கப்பட்டவர்களை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: அவர்களை மரணதண்டனைக்காக அழைத்துச் செல்லும்படி கட்டளையிட்டான்
  rationale: ἀπαχθῆναι என்பதன் நேரடிப் பொருள் ‘அழைத்துச் செல்லப்படுதல்’; இச்சூழலில் அது மரணதண்டனைக்காகக் கொண்டு செல்லப்படுவதைக் குறிக்கும் வாய்ப்பு மிகுந்ததால், உட்கருத்தை முதன்மை உரையில் தெளிவாக்கி நேரடிச் சொல்லமைப்பை அடிக்குறிப்பில் வைத்துள்ளது.
- source_word: κατελθὼν
  choice: இறங்கிச் சென்று
  rationale: உள்நாட்டிலுள்ள உயரமான யூதேயாவிலிருந்து கடற்கரைச் செசரியாவுக்குச் செல்லும் புவியியல் நகர்வை கிரேக்கத்தின் ‘கீழே செல்’ என்ற மொழிவழக்குடன் பாதுகாக்கிறது.
- source_word: Ἰουδαίας
  choice: யூதேயா
  rationale: இப்பகுதிப் பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Καισάρειαν
  choice: செசரியா
  rationale: இவ்விடப்பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: διέτριβεν
  choice: அங்கே தங்கியிருந்தான்
  rationale: முற்றுப்பெறாத வினையின் தொடர்நிலையை ‘தங்கியிருந்தான்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀπαχθῆναι என்பதை நேரடியாக ‘அழைத்துச் செல்லப்பட’ என்று மட்டும் மொழிபெயர்ப்பதா, அல்லது சூழலில் குறிக்கப்படும் தண்டனையை வெளிப்படையாக்குவதா
  choice: மரணதண்டனைக்காக அழைத்துச் செல்லும்படி
  alternative: அழைத்துச் செல்லும்படி
  rationale: கிரேக்க உரை கொல்லுதல் என்பதற்கான வெளிப்படையான வினைச்சொல்லைப் பயன்படுத்தவில்லை. எனினும் கைதி தப்பியதற்குப் பொறுப்பான காவலர்கள் குறித்த ஏரோதின் ஆணை, இங்கு மரணதண்டனையை வலுவாகக் குறிக்கிறது. அந்த உட்கருத்தை முதன்மை உரை தெளிவாக்குகிறது; மூலத்தின் உண்மையான சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. தொடர் பங்கேற்புவினைகளை இயல்பான தமிழ் வாக்கியத் தொடராக மாற்றியுள்ளதுடன், நீதித்துறைச் சூழலும் புவியியல் ‘இறங்கிச் செல்லுதல்’ என்ற படிமமும் காக்கப்பட்டுள்ளன.
