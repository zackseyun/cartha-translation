id: ACT.12.23
reference: Acts 12:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: παραχρῆμα δὲ ἐπάταξεν αὐτὸν ἄγγελος κυρίου ἀνθ’ ὧν οὐκ ἔδωκεν ⸀τὴν δόξαν τῷ θεῷ, καὶ γενόμενος σκωληκόβρωτος ἐξέψυξεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: ta
  text: உடனே கர்த்தருடைய ஒரு தூதன் அவனை அடித்தான். ஏனெனில், அவன் கடவுளுக்கு உரிய மகிமையைச் செலுத்தவில்லை. அவன் புழுக்களால் அரிக்கப்பட்டு[a] உயிர்விட்டான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புழுக்களால் உண்ணப்பட்டு.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இறந்தான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: உடனே
  rationale: தாமதமின்றி நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெரிவித்து, தீர்ப்பின் திடீர்த் தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐπάταξεν
  choice: அடித்தான்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளைத் தருகிறது. மரணம் பின்னர் தனியாகக் கூறப்படுவதால், ‘வீழ்த்தினான்’ அல்லது ‘கொன்றான்’ என்று விளைவை முன்கூட்டியே சேர்க்கவில்லை.
- source_word: ἄγγελος κυρίου
  choice: கர்த்தருடைய ஒரு தூதன்
  rationale: ἄγγελος என்பதற்கு கிரேக்கத்தில் குறிப்புச் சுட்டு இல்லாததால் ‘ஒரு தூதன்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; κύριος என்ற பட்டத்திற்கு ‘கர்த்தர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀνθ’ ὧν
  choice: ஏனெனில்
  rationale: இங்கு இந்தச் சொற்றொடர் தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதன் காரணப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: அவன் கடவுளுக்கு உரிய மகிமையைச் செலுத்தவில்லை
  rationale: கடவுளுக்குச் சேரவேண்டிய கனத்தை அவருக்குக் கொடுக்காததை இயல்பான தமிழில் தெரிவிக்கிறது. ‘மகிமையைச் செலுத்துதல்’ என்பது வெறும் புகழ்ச்சியை விட, உரிய கனத்தை அளித்தல் என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: γενόμενος σκωληκόβρωτος
  choice: புழுக்களால் அரிக்கப்பட்டு
  rationale: புழுக்களால் உண்ணப்பட்ட நிலையைத் தெளிவாகவும் காட்சித் தீவிரம் குறையாமலும் கூறுகிறது; பங்கேற்புவினையின் தொடரையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐξέψυξεν
  choice: உயிர்விட்டான்
  rationale: இறந்ததைச் சுட்டும் கிரேக்க வினையின் உருவகத் தன்மையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: இங்கு விவரிக்கப்படும் தீர்ப்பின் தன்மை
  choice: ஏரோதின் மரணம், கர்த்தருடைய ஒரு தூதன் மூலம் நிகழ்ந்த கடவுளின் தீர்ப்பாகவே உரை கூறுகிறது; அதற்கு மேலான கோட்பாட்டு அல்லது மருத்துவ விளக்கம் சேர்க்கப்படவில்லை.
  alternative: இதை வெறும் இயற்கை மரணத்தின் சமய மொழி விளக்கமாகவோ, தூதன் அடித்த அதே கணத்தில் நிகழ்ந்த உடனடி மரணமாகவோ திட்டவட்டமாக்குதல்.
  rationale: தூதன் அவனை அடித்ததையும், கடவுளுக்கு உரிய மகிமையை அவன் செலுத்தாததே அதற்குக் காரணம் என்பதையும் உரை வெளிப்படையாகக் கூறுகிறது. ஆனால் ‘புழுக்களால் அரிக்கப்பட்டு, உயிர்விட்டான்’ என்ற அமைப்பு நிகழ்வின் மருத்துவ முறை அல்லது துல்லியமான கால இடைவெளியை வரையறுக்கவில்லை; ஆகவே அந்தத் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஒரு தூதன்’ என்பது கிரேக்கத்தின் குறிப்பின்மையைப் பாதுகாக்கிறது; ‘அடித்தான்’ என்பது பின்னர் கூறப்படும் மரணத்தை முன்கூட்டியே பொருளில் சேர்ப்பதைத் தவிர்க்கிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
