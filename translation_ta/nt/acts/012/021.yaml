source:
  edition: SBLGNT
  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: ta
  text: நியமிக்கப்பட்ட நாளில், ஏரோது அரச உடையை[a] அணிந்துகொண்டு, அதிகாரப்பூர்வமான மேடையில்[b] அமர்ந்து, அவர்களுக்குப் பொதுவாக உரையாற்றிக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அரச அங்கியை.’ இங்குள்ள கிரேக்கச் சொல் பொதுவாகச் சிறப்பான உடையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நியாயாசனத்தில்’ அல்லது ‘உயர்ந்த மேடையில்.’ βῆμα என்ற கிரேக்கச் சொல் அதிகாரப்பூர்வ இருக்கையையோ உயர்த்தப்பட்ட மேடையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: குறிக்கப்பட்ட ஒரு நாளில்
  rationale: ஒரு குறிப்பிட்ட நிகழ்வுக்காக முன்பே நிர்ணயிக்கப்பட்ட நாளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; கிரேக்கத்தில் இல்லாத தனிப்பட்ட காலச் சுட்டுச்சொல் எதையும் சேர்க்கவில்லை.
- source_word: ἐνδυσάμενος
  choice: அணிந்துகொண்டு
  rationale: ஏரோது தானே உடையை அணிந்த செயலைக் காட்டுவதோடு, அதன் பின் அமர்ந்தான் என்ற செயல்தொடரையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐσθῆτα βασιλικὴν
  choice: அரசருக்குரிய உடையை
  rationale: ἐσθής என்பது குறிப்பிட்ட வகை அங்கியை மட்டும் அல்லாமல் உடை அல்லது ஆடையையும் பொதுவாகக் குறிக்கலாம்; βασιλικός அதன் அரசருக்குரிய தன்மையைத் தெரிவிக்கிறது.
- source_word: καθίσας
  choice: அமர்ந்து
  rationale: உடை அணிந்த பின் அமர்ந்த செயலைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தொடர்ச்சியாகக் காட்டுகிறது.
- source_word: ἐπὶ τοῦ βήματος
  choice: அதிகாரப்பூர்வ மேடையில்
  rationale: βῆμα குறிக்கும் அதிகாரபூர்வமான இருக்கை அல்லது உயர்த்தப்பட்ட மேடை என்ற இரு சாத்தியங்களையும், இங்கு சட்ட விசாரணை நடந்ததாக மிகையாகக் குறிப்பாக்காமல், சூழலுக்கேற்ற வகையில் தெரிவிக்கிறது.
- source_word: ἐδημηγόρει
  choice: பொதுவுரையாற்றிக்கொண்டிருந்தான்
  rationale: δημηγορέω பொதுக்கூட்டத்தின்முன் உரையாற்றுவதைக் குறிக்கிறது; இறந்தகால முற்றுப்பெறா வினையின் தொடரும் தன்மையை ‘-க்கொண்டிருந்தான்’ பாதுகாக்கிறது.
- source_word: πρὸς αὐτούς
  choice: அவர்களிடம்
  rationale: உரை அந்த மக்களை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
