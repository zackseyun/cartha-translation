revisions:
- from: குறிக்கப்பட்ட ஒரு நாளில், ஏரோது அரசருக்குரிய உடையை[a] அணிந்துகொண்டு, அதிகாரப்பூர்வ மேடையில்[b] அமர்ந்து, அவர்களிடம் பொதுவுரையாற்றிக்கொண்டிருந்தான்.
  to: நியமிக்கப்பட்ட நாளில், ஏரோது அரச உடையை[a] அணிந்துகொண்டு, அதிகாரப்பூர்வமான மேடையில்[b] அமர்ந்து, அவர்களுக்குப் பொதுவாக உரையாற்றிக்கொண்டிருந்தான்.
  rationale: 'The revision makes two modest idiomatic clarifications: ‘நியமிக்கப்பட்ட நாளில்’ better conveys a prearranged day, and ‘அவர்களுக்குப் பொதுவாக’ makes the audience-directed public address explicit. It retains the source’s aspect, action sequence, formal βῆμα ambiguity, and correctly placed lexical footnote anchors.'
