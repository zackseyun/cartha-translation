translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் செயல்தொடர் தமிழின் வினையெச்ச அமைப்பால் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது. மூலத்தில் உள்ள δέ தனியே ‘இப்போது’ என்று மொழிபெயர்க்கப்படாமல், வசனத்தின் இயல்பான தொடர்ச்சியில் விடப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் [a] குறி நாளுக்குப் பின் இருந்தாலும் அதன் அடிக்குறிப்பு அரச உடையைச் சார்ந்ததால், தமிழில் அந்தக் குறி ‘அரசருக்குரிய உடையை’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
