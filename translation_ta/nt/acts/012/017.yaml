source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: ta
  text: அவர்கள் அமைதியாக இருக்கும்படி, அவர் தம் கையால் சைகை செய்து, ஆண்டவர் தம்மைச் சிறையிலிருந்து எவ்வாறு வெளியே கொண்டுவந்தார் என்பதை அவர்களுக்கு விளக்கிச் சொன்னார். மேலும் அவர், “இவற்றை யாக்கோபுக்கும் சகோதரர்களுக்கும்[a] தெரிவியுங்கள்” என்றார். பின்பு அவர் அங்கிருந்து புறப்பட்டு வேறோர் இடத்திற்குச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளுக்கும்.” கிரேக்கத்தில் “சகோதரர்கள்” என்று உள்ளது; சூழலின்படி இது விசுவாசிகளின் பரந்த சமூகத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: அமைதியாக இருக்கும்படி தம் கையால் ... சைகை செய்துவிட்டு
  rationale: கையசைவின் நோக்கம் கூட்டத்தினரை அமைதிப்படுத்துவது என்பதை இயல்பான நவீன தமிழில் தெளிவாகக் கூறுகிறது; சைகையின் துல்லியமான வடிவத்தை அளவுக்கு மீறிக் குறிப்பிடவில்லை.
- source_word: διηγήσατο
  choice: விளக்கிச் சொன்னார்
  rationale: நடந்ததை விரிவாக எடுத்துரைக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: πῶς
  choice: எவ்வாறு
  rationale: பேதுரு எடுத்துரைத்த சம்பவத்தின் முறையை அறிமுகப்படுத்தும் கிரேக்கச் சொல்லின் பொருளைப் பாதுகாக்கிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் இணை; அது இயேசுவைக் குறிப்பாகச் சுட்டுகிறதா அல்லது கடவுளை பொதுவாகக் குறிக்கிறதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: சிறையிலிருந்து வெளியே கொண்டுவந்தார்
  rationale: விடுவித்து வெளியே அழைத்துவரும் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Ἀπαγγείλατε
  choice: தெரிவியுங்கள்
  rationale: முக்கிய செய்தியை மற்றவர்களிடம் கொண்டு சேர்க்கும் கட்டளையை இயல்பான தமிழில் வழங்குகிறது.
- source_word: Ἰακώβῳ
  choice: யாக்கோபுக்கும்
  rationale: புதிய ஏற்பாட்டுத் தமிழ் மரபில் Ἰάκωβος/Ἰακώβ என்ற பெயருக்குப் பொதுவாகப் பயன்படும் வடிவம்.
- source_word: τοῖς ἀδελφοῖς
  choice: சகோதரர்களுக்கும்
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது; சூழலில் விசுவாசிகள் அனைவரையும் உள்ளடக்கக்கூடிய வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: அங்கிருந்து புறப்பட்டு ... சென்றார்
  rationale: தற்போதைய இடத்தைவிட்டு வெளியேறுதலையும் பிற இடத்திற்குச் செல்லுதலையும் தமிழில் மீளுரையாடல் இல்லாமல் இயல்பாகக் காட்டுகிறது.
- source_word: εἰς ἕτερον τόπον
  choice: வேறோர் இடத்திற்கு
  rationale: அந்த இடம் எது என்று குறிப்பிடாத கிரேக்க உரையின் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: κύριος என்பதன் குறிப்பு
  choice: ஆண்டவர்
  alternative: ஆண்டவராகிய இயேசு; அல்லது கடவுள்
  rationale: மூல உரை κύριος என்று மட்டுமே கூறுகிறது. அப்போஸ்தலர் நடபடிகளில் இது உயிர்த்தெழுந்த இயேசுவைக் குறிக்கக்கூடும்; அதேவேளை தெய்வீக விடுதலையின் முகவராகக் கடவுளையும் குறிக்கக்கூடிய மொழியாக உள்ளது. எனவே குறிப்பை விரிவுபடுத்தாமல் மூலத்தின் இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
- issue: τοῖς ἀδελφοῖς என்பதன் சமூக வரம்பு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; சக விசுவாசிகள்
  rationale: இலக்கண வடிவம் ஆண்பால் பன்மை. ஆனால் சூழலின்படி அது பரந்த விசுவாசக் குழுவைக் குறிக்கலாம். முதன்மை உரை வடிவத்தைக் காக்கிறது; சாத்தியமான உள்ளடக்கிய பொருள் அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை வழியாகப் பேதுருவைப் பற்றிய வினைமுற்றுகளும் பிரதிப்பெயர்களும் ஒருமையாகப் பேணப்பட்டுள்ளன; மூலத்தில் இல்லாத இடப்பெயர் அல்லது ஆண்டவரின் குறிப்பான அடையாளம் சேர்க்கப்படவில்லை.
