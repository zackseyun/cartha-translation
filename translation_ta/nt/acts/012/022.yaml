  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: ta
  text: 'மக்கள் கூட்டமோ தொடர்ந்து முழங்கிக்கொண்டிருந்தது: “இது ஒரு தெய்வத்தின் குரல்[a]; மனிதனுடைய குரல் அல்ல!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது தேவனுடைய குரல்; மனிதனுடைய குரல் அல்ல!” என்று மொழிபெயர்க்கலாம். கிரேக்க வாசகத்தை இவ்வாறும் புரிந்துகொள்ள முடியும். ஆனால் சூழலில், ஏரோதுக்குப் புறமத மக்கள் தெய்வீகப் புகழ்ச்சி செலுத்துவதைக் காட்டும் “ஒரு தெய்வத்தின் குரல்” என்பதே அதிகம் பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: மக்கள் கூட்டம்
  rationale: இங்கு இந்தச் சொல் ஒரு முறையான அரசியல் அமைப்பைக் குறிக்காமல், பொதுவெளியில் கூடியிருந்த மக்களைக் குறிக்கிறது. ‘மக்கள் கூட்டம்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἐπεφώνει
  choice: தொடர்ந்து முழங்கிக்கொண்டிருந்தது
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் காட்டுகிறது. இந்தத் தேர்வு கூட்டத்தின் தொடர்ச்சியான உரத்த ஆரவாரத்தை வெளிப்படுத்துகிறது.
- source_word: Θεοῦ
  choice: ஒரு தெய்வத்தின்
  rationale: புறமதச் சூழலில் ஏரோதுக்கு வழங்கப்பட்ட தெய்வீகப் புகழ்ச்சியைக் கருத்தில் கொண்டால், குறிப்பிட்ட ஒரே கடவுளைக் காட்டிலும் பொதுவாக ‘ஒரு தெய்வம்’ என்பதே இங்கு பொருத்தமானது. எனினும் கிரேக்கச் சொல் ‘தேவனுடைய’ என்றும் புரிந்துகொள்ளப்படலாம்; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: φωνὴ
  choice: குரல்
  rationale: மனிதனின் பேச்சொலியைக் குறிக்கும் நேரடியான, இயல்பான இணைச்சொல்; பெயர்ச்சொல் அமைப்பையும் காக்கிறது.
- source_word: ἀνθρώπου
  choice: மனிதனுடைய
  rationale: ‘தெய்வத்தின்’ என்பதற்கு நேரான எதிர்மறை ஒப்புமையாக இருந்து, மனித மூலத்தை மறுக்கும் கிரேக்க வாசகத்தின் கருத்தைக் காக்கிறது.
theological_decisions:
- issue: Θεοῦ என்பதை ‘ஒரு தெய்வத்தின்’ என்றா ‘தேவனுடைய’ என்றா மொழிபெயர்ப்பது
  choice: ஒரு தெய்வத்தின்
  alternative: தேவனுடைய
  rationale: ஏரோதுக்குத் தெய்வீக மரியாதை செலுத்தும் புறமதக் கூட்டத்தின் சூழலும், கிரேக்கத்தில் குறிப்புச் சுட்டும் உருபு இல்லாததும், ‘ஒரு தெய்வத்தின்’ என்ற வாசிப்பை ஆதரிக்கின்றன. இருந்தாலும் இலக்கண ரீதியில் ‘தேவனுடைய’ என்பது சாத்தியமுள்ளதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘முழங்கிக்கொண்டிருந்தது’ என்பது கிரேக்க முற்றுப்பெறாத காலத்தின் தொடர்ச்சித் தன்மையை இயல்பாக எடுத்துரைக்கிறது; மேற்கோளுக்குள் ‘இது’ சேர்க்கப்பட்டது தமிழில் பெயர்ச்சொல் வாக்கியத்தைத் தெளிவாகவும் இயல்பாகவும் அமைப்பதற்காக.
