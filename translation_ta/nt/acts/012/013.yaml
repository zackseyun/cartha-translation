  text: When he knocked at the door of the gateway[a], a servant girl named Rhoda came to answer.
translation:
  language: ta
  text: அவன் நுழைவாயிலின் கதவைத் தட்டியபோது, ரோதை என்னும் பணிப்பெண்[a] பதிலளிக்க வந்தாள்.
