lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: அவன் ... தட்டியபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையும் δέ-யும் கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகின்றன; ‘தட்டியபோது’ என்பது காலத் தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: θύραν τοῦ πυλῶνος
  choice: நுழைவாயிலின் கதவை
  rationale: θύρα என்பதன் ‘கதவு’ என்ற பொருளையும், πυλών என்பதன் வீட்டு வெளிப்புற நுழைவாயில்/வாயிற்கூடம் என்ற பொருளையும் இந்தச் சொற்றொடர் தக்கவைக்கிறது.
- source_word: προσῆλθε
  choice: வந்தாள்
  rationale: இச்சூழலில் προσέρχομαι குறிக்கும் அணுகிவருதலை ‘வந்தாள்’ என்பது இயல்பாக வெளிப்படுத்துகிறது; தொடர்ந்து வரும் நோக்கவினை அதன் நோக்கத்தைக் கூறுகிறது.
- source_word: παιδίσκη
  choice: பணிப்பெண்
  rationale: இச்சொல் இளம் பெண் வீட்டுப் பணியாளரையோ அடிமைப் பெண்ணையோ குறிக்கலாம். இல்லச் சூழலில் அவளுடைய பணியை இயல்பாகக் காட்ட ‘பணிப்பெண்’ தேர்ந்தெடுக்கப்பட்டது; சட்ட அல்லது சமூக நிலையை வலியுறுத்தும் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὑπακοῦσαι
  choice: பதிலளிக்க
  rationale: அடிப்படையில் ‘கேட்பது/செவிகொடுப்பது’ எனப் பொருள்படக்கூடிய இவ்வினை, கதவைத் தட்டும் இச்சூழலில் அதற்குப் பதிலளிப்பதைக் குறிக்கிறது.
- source_word: ὀνόματι Ῥόδη
  choice: ரோதை என்னும்
  rationale: ὀνόματι ஒருவரின் பெயரை அறிமுகப்படுத்துகிறது. Ῥόδη என்ற தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பான ‘ரோதை’ என வழங்கப்படுகிறது.
