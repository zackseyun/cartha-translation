id: ACT.12.10
reference: Acts 12:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: ta
  text: அவர்கள் முதல் காவலையும் இரண்டாம் காவலையும் கடந்து, நகரத்திற்குள் செல்லும் இரும்புக் கதவுக்கு வந்தார்கள். அது அவர்களுக்காகத் தானாகவே திறந்தது[a]. அவர்கள் வெளியே சென்று, ஒரு தெரு தூரம் நடந்தார்கள்[b]. உடனே அந்தத் தூதர் அவரைவிட்டு விலகிச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “அது அவர்களுக்காகத் தன்னாலேயே திறந்தது.”'
    reason: lexical_alternative
  - marker: b
    text: “ஒரு தெரு தூரம்” என்பது, தூதர் அவரைவிட்டுப் பிரிவதற்கு முன் அவர்கள் ஒரு தெருவின் அளவுக்குச் சென்றார்கள் என்று பொருள்படலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: கடந்து
  rationale: முதன்மை வினைக்கு முன் முடிந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வடிவம்; தமிழில் தொடர்ச்சியான நிகழ்வோட்டத்துடன் இயல்பாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: φυλακὴν
  choice: காவல்
  rationale: இச்சூழலில் சிறைக்காவலின் அடுத்தடுத்த பாதுகாப்புக் கட்டங்களையோ காவற்குழுக்களையோ குறிக்கிறது. ‘காவல்’ என்பது மனிதர்களா காவலிடங்களா என்ற சிறிய தெளிவின்மையைத் தேவையின்றி நீக்காமல் வைத்திருக்கிறது.
- source_word: πύλην τὴν σιδηρᾶν
  choice: இரும்புக் கதவு
  rationale: கதவு செய்யப்பட்ட பொருளை நேரடியாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: நகரத்திற்குள் செல்லும்
  rationale: அந்தக் கதவு நகரத்திற்குள் நுழைய வழிவகுத்தது என்ற இடஞ்சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτομάτη
  choice: தானாகவே
  rationale: மனிதர் எவரும் திறக்காமல் கதவு திறந்ததைத் தெளிவாகக் கூறுகிறது; நவீன இயந்திரச் செயல்பாட்டைக் குறிக்கும் சொல்லைத் தவிர்க்கிறது.
- source_word: ῥύμην μίαν
  choice: ஒரு தெரு தூரம்
  rationale: சொற்றொடரின் நேரடிப் பொருளான ‘ஒரு தெரு’ என்பதையும், இங்கு குறிக்கப்படும் பயணத் தொலைவையும் தமிழில் புரியும்படி இணைக்கிறது.
- source_word: ἀπέστη ... ἀπ’ αὐτοῦ
  choice: அவரைவிட்டு விலகினார்
  rationale: தூதர் பேதுருவிடமிருந்து பிரிந்து சென்றார் என்ற பொருளை, அவர் மறைந்தார் என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்க்காமல் தருகிறது.
theological_decisions:
- issue: கதவு திறந்த விதம்
  choice: அது அவர்களுக்காகத் தானாகவே திறந்தது
  alternative: அது அவர்களுக்காகத் தன்னாலேயே திறந்தது
  rationale: மூலம் நிகழ்வை அற்புதமானதாக முன்வைக்கிறது; ஆனால் அது எவ்வாறு நிகழ்ந்தது என்பதை விளக்கவில்லை. மொழிபெயர்ப்பும் அந்த வரம்பைப் பேணுகிறது.
- issue: φυλακή என்பதன் குறிப்பு
  choice: முதல் காவலும் இரண்டாம் காவலும்
  alternative: முதல் காவல் நிலையமும் இரண்டாம் காவல் நிலையமும்
  rationale: சிறையிலிருந்து வெளியேறும் வழியிலிருந்த அடுத்தடுத்த பாதுகாப்புக் கட்டங்களே சூழலுக்குப் பொருந்துகின்றன. ‘காவல்’ என்பது காவலர்களையும் காவல் இடங்களையும் உள்ளடக்கக்கூடிய மூலத்தின் நெகிழ்வை ஓரளவு பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தானாகவே’ என்பது இயந்திரமயமான ‘தானியங்கியாக’ என்ற சொல்லைத் தவிர்க்கிறது. ‘அவரைவிட்டு விலகினார்’ என்பது பேதுருவைச் சுட்டும் ஒருமையைத் துல்லியமாகப் பேணுகிறது.
