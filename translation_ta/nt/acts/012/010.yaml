  source_fidelity: The sequence of passing two successive φυλακαί, reaching the iron gate, its self-opening, proceeding one street, and the angel's departure from Peter is retained. A small wording revision makes the arrival at the gate and the final departure more idiomatic and explicit in Tamil without adding interpretation.
  naturalness: The draft is generally clear modern Tamil. “இரும்புக் கதவிடம் வந்தார்கள்” is less natural than “இரும்புக் கதவுக்கு வந்தார்கள்,” and “விலகிச் சென்றார்” better expresses ἀπέστη in this narrative context.
