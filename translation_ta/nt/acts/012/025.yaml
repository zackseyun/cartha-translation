revisions:
- from: ஆனால் பர்னபாவும் சவுலும் தங்கள் ஊழியத்தை நிறைவேற்றியபின் எருசலேமுக்குத் திரும்பி வந்தார்கள்; மாற்கு என்று அழைக்கப்பட்ட யோவானையும் தங்களுடன் அழைத்துக்கொண்டு வந்தார்கள்.[a]
  to: ஆனால் பர்னபாவும் சவுலும் ஊழியத்தை நிறைவேற்றியபின், மாற்கு என்று அழைக்கப்பட்ட யோவானைத் தங்களுடன் அழைத்துக்கொண்டு எருசலேமுக்குத் திரும்பினார்கள்.[a]
  rationale: The revision removes the redundant ‘வந்தார்கள்,’ integrates the accompanying action with the return as in the Greek participial construction, and places the variant marker directly after the translated phrase it concerns. It retains the SBLGNT reading ‘to Jerusalem’ in the main text and preserves the alternative reading in the footnote.
