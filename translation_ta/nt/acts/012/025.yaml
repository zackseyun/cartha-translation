id: ACT.12.25
reference: Acts 12:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: ta
  text: ஆனால் பர்னபாவும் சவுலும் ஊழியத்தை நிறைவேற்றியபின், மாற்கு என்று அழைக்கப்பட்ட யோவானைத் தங்களுடன் அழைத்துக்கொண்டு எருசலேமுக்குத் திரும்பினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “எருசலேமுக்கு” என்பதற்குப் பதிலாக “எருசலேமிலிருந்து” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: திரும்பி வந்தார்கள்
  rationale: ὑποστρέφω என்பதன் இறந்தகால வடிவம் பொதுவாக ‘திரும்புதல்’ என்பதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாக அமையும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமுக்குத்
  rationale: கொடுக்கப்பட்ட SBLGNT உரையில் εἰς என்பது வழக்கமாக ‘நோக்கி/க்கு’ எனப் பொருள்படும்; எனவே உரையின் நேரடிப் பொருள் காக்கப்பட்டது.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: தங்கள் ஊழியத்தை நிறைவேற்றியபின்
  rationale: πληρόω இங்கு முடித்தல் அல்லது நிறைவேற்றுதல் என்றும், διακονία சேவை அல்லது ஊழியம் என்றும் பொருள்படும். சூழலில் நிவாரணப் பணி அடங்கினாலும், மூலத்தின் பரந்த சொல்லாட்சியை ‘ஊழியம்’ காக்கிறது.
- source_word: συμπαραλαβόντες
  choice: தங்களுடன் அழைத்துக்கொண்டு வந்தார்கள்
  rationale: ஒருவரைத் தங்களுடன் கூட்டிச் சென்ற அல்லது அழைத்து வந்த துணைச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: மாற்கு என்று அழைக்கப்பட்ட யோவானை
  rationale: ἐπικαλέω என்பதன் இறப்புவினை வடிவம் ‘என்று அழைக்கப்பட்ட’ எனத் தெளிவாகப் பொருள்படுகிறது; மூலத்தில் ‘மேலும்’ என்பது வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: இடத்தை நோக்கியதா அல்லது அந்த இடத்திலிருந்து வந்ததா என்ற பாட வேறுபாடு
  choice: எருசலேமுக்குத்
  alternative: எருசலேமிலிருந்து
  rationale: வழங்கப்பட்ட SBLGNT மூல உரை εἰς Ἰερουσαλήμ (‘எருசலேமுக்கு’) என்று வாசிப்பதால் முதன்மை உரை அதைப் பின்பற்றுகிறது. கதைச் சூழலுடன் இயல்பாகப் பொருந்தும் ἐξ Ἰερουσαλήμ (‘எருசலேமிலிருந்து’) என்ற முக்கியமான கையெழுத்துப் பிரதிப் பாடம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஊழியம்’ என்பது இங்கு குறிப்பிட்ட நிவாரணப் பணியை மட்டும் வெளிப்படையாகச் சொல்லாமல் διακονία என்பதன் பரந்த பொருளைக் காக்கிறது. [a] குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் வைக்கப்பட்டுள்ளது.
