  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: ta
  text: அவர் இதை உணர்ந்தபோது, மாற்கு என்று அழைக்கப்பட்ட யோவானின் தாயான மரியாளின் வீட்டுக்குச் சென்றார். அங்கே பலர் கூடியிருந்து ஜெபித்துக்கொண்டிருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνιδών
  choice: அவர் இதை உணர்ந்தபோது
  rationale: சூழ்நிலையைப் பேதுரு முழுமையாக உணர்ந்ததை இறந்தகாலப் பங்கேற்புவினை குறிக்கிறது. தமிழில் இயல்பான தொடருக்காக முந்தைய சூழலிலிருந்து ‘அவர்’ மற்றும் ‘இதை’ சேர்க்கப்பட்டுள்ளன.
- source_word: τε
  choice: வாக்கியத் தொடரால் வெளிப்படுத்தப்பட்டது
  rationale: இது மென்மையான இணைப்பிடைச்சொல். தமிழில் தனியாக ‘மேலும்’ அல்லது ‘அப்போது’ என்று மிகைப்படுத்தாமல், தொடர்ச்சியான வாக்கிய அமைப்பே அதன் கதையோட்டத்தை வெளிப்படுத்துகிறது.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: வீட்டுக்குச் சென்றார்
  rationale: ஒரு இடத்தை நோக்கிய நகர்வை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τῆς Μαρίας
  choice: மரியாளுடைய
  rationale: Μαρία என்ற பெயரின் தமிழில் பரவலாக அறியப்பட்ட வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τῆς μητρὸς Ἰωάννου
  choice: யோவானின் தாயாகிய
  rationale: எந்த மரியாள் என்று அடையாளப்படுத்தும் மூலத்தின் உறவுமுறையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: மாற்கு என்று அழைக்கப்பட்ட
  rationale: யோவானுக்கு வழங்கப்பட்ட கூடுதல் பெயரைத் தெரிவிக்கிறது; மூலத்தில் ‘மேலும்’ என்ற வினையடை வெளிப்படையாக இல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: οὗ
  choice: அங்கே
  rationale: மரியாளுடைய வீட்டையே இடமாகச் சுட்டுகிறது; தனி தமிழ் வாக்கியத்தில் ‘அங்கே’ இயல்பாக உள்ளது.
- source_word: ἱκανοὶ
  choice: பலர்
  rationale: கணிசமான எண்ணிக்கையினரைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: συνηθροισμένοι
  choice: ஒன்றுகூடி
  rationale: முன்பே கூடிவந்து அங்கே இருந்த நிலையைச் சூழல் தெளிவாக்குவதால், தமிழில் இயல்பான வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: καὶ προσευχόμενοι
  choice: செபித்துக்கொண்டிருந்தார்கள்
  rationale: அவர்கள் தொடர்ந்து செய்துகொண்டிருந்த செயலை ‘-க்கொண்டிருந்தார்கள்’ என்ற வடிவம் தெளிவாக வெளிப்படுத்துகிறது.
