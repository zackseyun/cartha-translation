source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: ta
  text: பொழுது விடிந்தபோது, பேதுருவுக்கு என்ன நேர்ந்தது என்பதைக் குறித்து படைவீரர்களிடையே சிறியதல்லாத கலக்கம் ஏற்பட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: பொழுது விடிந்தபோது
  rationale: இந்த genitive absolute காலத்தைக் குறிக்கிறது; δέ இங்கு நிகழ்வின் தொடர்ச்சியை மெதுவாக நகர்த்துகிறது. தமிழில் தனியாக ஒரு இணைப்புச் சொல்லைச் சேர்க்காமல், இயல்பாகவும் துல்லியமாகவும் காலப்பொருளைத் தருகிறது.
- source_word: τάραχος οὐκ ὀλίγος
  choice: சிறிதல்லாத கலக்கம்
  rationale: οὐκ ὀλίγος என்பது ‘மிகுந்த’ என்ற பொருளைத் தரும் குறைத்துக் கூறும் வலியுறுத்தல். ‘சிறிதல்லாத’ என்பது அந்தச் சொல்லாட்சியின் தன்மையைப் பாதுகாக்கிறது; ‘கலக்கம்’ τάραχος என்பதன் குழப்பமும் பதற்றமும் கலந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐν τοῖς στρατιώταις
  choice: படைவீரர்களிடையே
  rationale: στρατιώταις என்பதற்கு நேரடியான பொருள் ‘படைவீரர்கள்’; ἐν இங்கு அந்தக் கலக்கம் நிலவிய குழுவைக் குறிப்பதால் ‘இடையே’ பொருத்தமானது. சூழலை முன்னிட்டு ‘காவலர்கள்’ என்று குறுக்கவில்லை.
- source_word: τί ἄρα
  choice: என்ன ஆனதோ என்று
  rationale: ἄρα தரும் ஊகம், திகைப்பு, விடை தெரியாத கேள்வி ஆகிய நுண்ணுணர்வுகளைத் தமிழ் மறைமுகக் கேள்வியில் ‘-தோ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐγένετο
  choice: ஆனது
  rationale: τί ... ἐγένετο என்ற ஆளைக் குறித்த மொழிவழக்கின் பொருள் ‘அவருக்கு என்ன நேர்ந்தது/அவர் என்ன ஆனார்’ என்பதாகும். ‘பேதுருக்கு என்ன ஆனதோ’ என்பது அதை இயல்பான தமிழில் தருகிறது.
