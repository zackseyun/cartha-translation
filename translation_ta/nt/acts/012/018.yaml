translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் குறைத்துக் கூறும் வலியுறுத்தலைச் சீராக்கி மறைக்காமல் ‘சிறிதல்லாத’ எனப் பாதுகாத்துள்ளோம்; ἄραவின் திகைப்பு ‘-தோ’ மூலம் வெளிப்படுகிறது.
