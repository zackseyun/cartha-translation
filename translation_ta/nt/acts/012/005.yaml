source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: ta
  text: ஆகவே பேதுரு சிறையில் அடைத்து வைக்கப்பட்டிருந்தார்; ஆனால் அவருக்காகத் திருச்சபை கடவுளிடம் தீவிரமாக[a] வேண்டிக்கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விடாமுயற்சியுடன்.” கிரேக்க வினையடை ஜெபத்தின் தீவிரத்தையோ அதன் தொடர்ச்சியையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: அடைத்து வைக்கப்பட்டிருந்தார்
  rationale: நிறைவுறாத இறந்தகாலச் செயப்பாட்டு வடிவம், பேதுரு தொடர்ந்து சிறையில் வைக்கப்பட்டிருந்த நிலையைச் சுட்டுகிறது. தமிழில் இச்சொற்றொடர் செயப்பாட்டையும் நீடித்த நிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φυλακῇ
  choice: சிறையில்
  rationale: இங்கு இச்சொல் காவல் செயலைவிட அடைத்து வைக்கும் இடத்தைக் குறிக்கிறது; ‘சிறை’ என்பது நவீனத் தமிழில் இயல்பான, கண்ணியமான சொல்.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: வேண்டிக்கொண்டிருந்தது
  rationale: ἦν உடன் நிகழ்காலப் பங்கேற்பு வடிவம் தொடர்ச்சியாக நடந்த செயலைக் காட்டுகிறது. ‘வேண்டிக்கொண்டிருந்தது’ அந்த நீடித்த ஜெபச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐκτενῶς
  choice: தீவிரமாக
  rationale: இந்த வினையடை ஜெபத்தின் தீவிரத்தையோ விடாமுயற்சியையோ குறிக்கலாம். ‘தீவிரமாக’ முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது; தொடர்ச்சி சார்ந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: திருச்சபை
  rationale: இங்கு ἐκκλησία என்பது பேதுருவுக்காக ஜெபித்த கிறிஸ்தவ விசுவாசிகளின் சமூகத்தைக் குறிக்கிறது. ‘திருச்சபை’ நிலைபெற்ற தமிழ் வழக்காக இருந்தாலும், பிற்கால அமைப்புரீதியான பொருளை இங்கு கட்டாயப்படுத்தவில்லை.
- source_word: πρὸς τὸν θεὸν
  choice: கடவுளிடம்
  rationale: πρός ஜெபம் யாரை நோக்கிச் செலுத்தப்பட்டது என்பதைக் காட்டுகிறது. ‘கடவுளிடம்’ என்பது தமிழில் இயல்பான ஜெப மொழிநடை.
- source_word: περὶ αὐτοῦ
  choice: அவருக்காக
  rationale: இந்தச் சூழலில் περί உடன் வரும் மரபுத்தொடர் பேதுருவின் சார்பாகச் செய்யப்பட்ட பரிந்துரை ஜெபத்தைக் குறிக்கிறது; ‘அவருக்காக’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μὲν οὖν ... δὲ
  choice: ஆகவே ... ஆனால்
  rationale: இந்த இடைச்சொற்கள் கதை முன்னேற்றத்தோடு பேதுருவின் சிறைநிலைக்கும் திருச்சபையின் ஜெபத்திற்கும் இடையிலான மிதமான முரணைக் காட்டுகின்றன.
theological_decisions:
- issue: ἐκκλησία என்பதன் மொழிபெயர்ப்பு
  choice: திருச்சபை
  alternative: சபை / விசுவாசிகளின் கூட்டம்
  rationale: சொல் இங்கு பேதுருவுக்காக ஜெபிக்கும் கிறிஸ்தவ சமூகத்தைக் குறிக்கிறது. ‘திருச்சபை’ நவீனத் தமிழில் பரவலாகப் புரியக்கூடியது; எந்த ஓர் பிரிவின் தனிப்பட்ட ஆட்சிமுறையையும் பொருளாகச் சேர்க்காமல் சமூகத்தைக் குறிக்கும் வகையில் பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீடித்த செயலை ‘வைக்கப்பட்டிருந்தார்’, ‘வேண்டிக்கொண்டிருந்தது’ ஆகிய வடிவங்கள் காக்கின்றன; மூலத்தின் மிதமான முரண் அரைப்புள்ளி மற்றும் ‘ஆனால்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது.
