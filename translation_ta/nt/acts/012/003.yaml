  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: ta
  text: அது யூதர்களுக்கு[a] மகிழ்ச்சியளித்ததைக் கண்டபோது, அவன் மேலும் பேதுருவையும் கைது செய்தான். (அப்போது புளிப்பில்லா அப்பப் பண்டிகை நாட்களாக இருந்தன[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “யூதேயர்களுக்கு”; சூழலைக் குறுக்கிப் புரிந்துகொண்டால், “யூதத் தலைவர்களுக்கு.” கிரேக்கச் சொல் சில சூழல்களில் இப்பொருள்களைக் கொள்ளலாம்; ஆனால் இங்கே உரை வெறுமனே “யூதர்கள்” என்றே கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: பஸ்காவுடன் தொடர்புடைய பண்டிகைக் காலம்; இந்நாட்களில் புளிப்பூட்டப்படாத அப்பம் உண்ணப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: அது ... விருப்பமானதாக இருந்ததைக் கண்ட அவன்
  rationale: இறந்தகால வினையெச்சம் ஏரோது மக்களின் எதிர்வினையைக் கண்டபின் அடுத்த நடவடிக்கை எடுத்த காலவரிசையைக் காட்டுகிறது; இவ்வடிவம் தமிழில் இயல்பாக அந்தத் தொடர்ச்சியைத் தெரிவிக்கிறது.
- source_word: ἀρεστόν ἐστιν
  choice: விருப்பமானதாக இருந்தது
  rationale: இந்தச் சொற்றொடர் ‘மகிழ்ச்சியளித்தது’ அல்லது ‘ஏற்றதாக இருந்தது’ என்ற பொருளைக் கொள்ளலாம்; ‘விருப்பமானதாக’ என்பது அதன் மதிப்பீட்டுப் பொருளை மிகைப்படுத்தாமல் தருகிறது.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்களுக்கு
  rationale: கிரேக்க மூலத்தில் பொதுவாக ‘யூதர்கள்’ என்றே உள்ளது; சூழலை மட்டும் கொண்டு ‘யூதத் தலைவர்கள்’ என்று குறுக்காமல் மூலத்தின் பரந்த குறிப்பைத் தக்கவைக்கிறது.
- source_word: προσέθετο συλλαβεῖν
  choice: அடுத்ததாக ... கைது செய்தான்
  rationale: προστίθημι + வினையெச்சம் அடுத்த செயலை மேற்கொள்வதைக் குறிக்கும் மொழிவழக்கு. சொற்சொல்லாக ‘சேர்த்தான்’ என்பதற்குப் பதிலாக, செயல்வரிசையை இயல்பான தமிழில் தருகிறது.
- source_word: καὶ Πέτρον
  choice: பேதுருவையும்
  rationale: καί, முன்பு யாக்கோபுக்கு நடந்ததோடு பேதுருவையும் மற்றொரு இலக்காகச் சேர்ப்பதைக் காட்டுகிறது; ‘-யும்’ அந்தச் சேர்க்கைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: அப்போது புளிப்பில்லா அப்பப் பண்டிகையின் நாட்களாக இருந்தன
  rationale: மூலம் தரும் காலச் சூழலையும் ‘புளிப்பில்லா அப்பம்’ என்ற யூதப் பண்டிகைப் பெயரையும் தக்கவைத்து, தமிழில் புரியும்படி ‘பண்டிகை’ என்பதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அப்போஸ்தலர் நூலில் Ἰουδαίοις என்பதன் குறிப்பு
  choice: யூதர்களுக்கு
  alternative: யூதேயர்கள்; யூதத் தலைவர்கள்
  rationale: இந்த இடத்தில் மூல உரை புவியியல் பகுதியையோ தலைமைக்குழுவையோ வெளிப்படையாகக் குறிப்பிடவில்லை. எனவே பொருளைச் செயற்கையாகக் குறுக்காமல் உண்மையான குறிப்புத் தெளிவின்மையைத் தக்கவைக்கிறது.
- issue: τῶν ἀζύμων என்ற பண்டிகைப் பெயர்
  choice: புளிப்பில்லா அப்பப் பண்டிகை
  alternative: பஸ்கா
  rationale: கிரேக்கம் ‘பஸ்கா’ என்று அல்லாமல் புளிப்பில்லா அப்பத்தின் நாட்கள் என்று குறிப்பாகக் கூறுகிறது. தொடர்புடைய இரு பெயர்களையும் ஒன்றாகக் கலக்காமல் மூலப் பெயர் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் உடனே புரிந்துகொள்ளும் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘பிடித்தது’ என்ற பேச்சுவழக்குச் சொல்லைவிட ‘விருப்பமானதாக இருந்தது’ தேர்ந்தெடுக்கப்பட்டது. அடைப்புக்குறிப்பு மூலத்தின் காலச்சூழல் குறிப்பாகவே வைக்கப்பட்டுள்ளது.
