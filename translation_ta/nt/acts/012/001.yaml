  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: ta
  text: அந்தக் காலத்தில்[a], ஏரோது அரசன் திருச்சபையைச் சேர்ந்த சிலர்மேல் கை வைத்து, அவர்களைத் துன்புறுத்தினான்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏறக்குறைய அந்தக் காலத்தில்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘கைகளை வைத்தான்.’ இந்தச் சொற்றொடர் திருச்சபையைச் சேர்ந்த சிலருக்கு எதிராகப் பகைமையுடன் நடவடிக்கை எடுத்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘தீங்கு செய்தான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: அந்தக் காலக்கட்டத்தில்
  rationale: κατά உடன் வரும் காலத்தைக் குறிக்கும் சொற்றொடர் ‘அந்தக் காலத்தில்/அந்தக் காலக்கட்டத்தில்’ என்ற பொருளைத் தருகிறது. δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தனிச் சொல்லாக வெளிப்படுத்தாமல் இயல்பான வாக்கியத் தொடரில் விடப்பட்டுள்ளது.
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: அவர்கள்மேல் கை வைத்தான்
  rationale: மூலத்தின் உருவகச் சொற்றொடரைப் பாதுகாக்கிறது; இச்சூழலில் அது அன்பான தொடுதலை அல்ல, பகைமையான நடவடிக்கையைத் தொடங்குவதைச் சுட்டுகிறது. ‘கைது செய்தான்’ என்பது பொருளைத் தேவையின்றி குறுக்கும்.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: ஏரோது அரசன்
  rationale: கிரேக்கத்தின் பெயர்-பதவி அமைப்பை இயல்பான நவீனத் தமிழில் பின்பற்றுகிறது.
- source_word: κακῶσαί
  choice: துன்புறுத்துவதற்காக
  rationale: தீங்கு அல்லது மோசமான நடத்தைக்கு உட்படுத்தும் நோக்கத்தை இயல்பான தமிழில் தருகிறது; ‘துன்புறுத்து’ என்பது இங்கு மதத்தொழில்நுட்பச் சொல்லாக இல்லாமல் பொதுவான தீய நடத்தையைக் குறிக்கிறது.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: திருச்சபையைச் சேர்ந்த சிலரை
  rationale: கிறிஸ்தவக் குழுமத்துடன் தொடர்புடைய சில நபர்களைக் குறிக்கும் பகுதியைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: ἐκκλησία என்பதன் மொழிபெயர்ப்பு
  choice: திருச்சபை
  alternative: சபை / கூடுகை
  rationale: அப்போஸ்தலர் பணிகளில் இச்சொல் பொதுவாகக் கிறிஸ்தவ விசுவாசிகளின் சமூகத்தைக் குறிக்கிறது. ‘திருச்சபை’ நவீனத் தமிழில் பரவலாகப் புரியப்படும் சொல்; ‘கூடுகை’ மூல வடிவத்துக்கு நெருக்கமானதாயினும் இச்சூழலில் சமூக அடையாளத்தைத் தெளிவாகக் காட்டாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் ‘கை வைத்தான்’ என்ற உருவகம் பிரதான உரையில் பாதுகாக்கப்பட்டு, அதன் பகைமைப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
