source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: ta
  text: அவர்கள் அவளிடம், “உனக்குப் பைத்தியம் பிடித்திருக்கிறது” என்றார்கள். ஆனால் அவளோ, அது உண்மைதான் என்று தொடர்ந்து வலியுறுத்தினாள். அவர்களோ, “அது அவருடைய தேவதூதன்தான்[a]” என்று திரும்பத் திரும்பச் சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய காவல் தூதன்,’ ‘அவரைப் பிரதிநிதித்துவப்படுத்தும் தூதன்’; சில விளக்கவுரையாளர்களின்படி, ‘அவருடைய ஆவி’ அல்லது ‘பேய்.’ கிரேக்க வாசகம் ‘அவருடைய தூதன்’ என்று மட்டுமே கூறுகிறது.
    reason: மூலவாசகம் விளக்காத ‘அவருடைய தூதன்’ என்ற சொல்லின் பல சாத்தியமான பொருள்களைச் சுட்டிக்காட்டி, அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Μαίνῃ
  choice: உனக்குப் பைத்தியம் பிடித்திருக்கிறது
  rationale: μαίνομαι இங்கு ஒருவரை மனநிலை தவறியவர் எனக் குற்றஞ்சாட்டும் வழக்குச் சொல்லாக வருகிறது. இந்தத் தமிழ் நடை அதன் கடுமையைத் தக்கவைத்துக்கொண்டு, நவீன வாசகர்களுக்கு இயல்பாகப் புரிகிறது.
- source_word: διϊσχυρίζετο
  choice: தொடர்ந்து வலியுறுத்தினாள்
  rationale: இறந்தகாலத் தொடர்நிலை வினை வடிவம் நீடித்த அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட வலியுறுத்தலைக் காட்டுகிறது; ‘தொடர்ந்து’ என்பது அந்த வினைநிலையை வெளிப்படுத்துகிறது.
- source_word: οὕτως ἔχειν
  choice: அது உண்மைதான் என்று
  rationale: ‘நிலைமை அப்படித்தான் இருந்தது’ என்ற மொழிவழக்குப் பொருளை இயல்பான தமிழில் தருகிறது. ரோதாவின் கூற்று சரியானது என்பதே இங்கு நோக்கம்.
- source_word: ἔλεγον
  choice: திரும்பத் திரும்பச் சொன்னார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் அவர்கள் இதை தொடர்ந்து அல்லது மீண்டும் கூறியதைக் குறிக்கிறது.
- source_word: ἄγγελός
  choice: தூதன்
  rationale: ἄγγελος என்பதன் அடிப்படைப் பொருள் ‘தூதன்’; இச்சூழலில் இயற்கைக்கு அப்பாற்பட்ட தூதனைக் குறிக்கும் வாய்ப்பு மிகுந்தாலும், ‘காவல் தூதன்’ போன்ற விளக்கத்தை மூலவசனம் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: ஆண்பால் ஒருமை உடைமைப் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது. சூழலில் இது பேதுருவைக் குறிக்கிறது; தமிழின் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அவருடைய தூதன்’ என்பதன் பொருள்
  choice: மூலத்தின் தெளிவின்மையைத் தக்கவைத்து ‘அவருடைய தூதன்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: அவருடைய காவல் தூதன்; அவரைப் பிரதிநிதித்துவப்படுத்தும் தூதன்; அவருடைய ஆவி/பேய்
  rationale: கிரேக்க வாசகம் ὁ ἄγγελός ἐστιν αὐτοῦ என்று மட்டுமே கூறுகிறது; அந்தக் கருத்துக்குப் பின்னுள்ள நம்பிக்கையை அது விளக்கவில்லை. எனவே குறிப்பிட்ட தேவதூதர் கோட்பாட்டையோ, ஆவி பற்றிய விளக்கத்தையோ முதன்மை உரைக்குள் சேர்க்காமல், சாத்தியமான பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவளோ/அவர்களோ’ என்ற எதிர்மறை வலியுறுத்தல், δέ மூலம் உருவாகும் கருத்து மோதலை இயல்பாக வெளிப்படுத்துகிறது. பேதுருவைக் குறிக்கும் உடைமைச் சொல்லில் மரியாதை ஒருமையான ‘அவருடைய’ பயன்படுத்தப்பட்டுள்ளது.
