  yaml_path: translation/nt/acts/012/002.yaml
  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: ta
  text: அவன் யோவானின் சகோதரனாகிய யாக்கோபை[a] வாளால் கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கொல்லச் செய்தான்’ அல்லது ‘மரணதண்டனை நிறைவேற்றினான்.’ கிரேக்கச் சொல் யாக்கோபின் மரணத்திற்கு அவன் காரணமானான் என்பதை மட்டும் கூறுகிறது; விரிந்த நிகழ்ச்சிச் சூழல் இது அதிகாரபூர்வமாக நிறைவேற்றப்பட்ட மரணதண்டனையாக இருக்கலாம் என உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: கொன்றான்
  rationale: இங்கு ἀναιρέω என்பது ஒருவரின் மரணத்தை ஏற்படுத்துவதைக் குறிக்கிறது. ‘கொன்றான்’ என்பது இயல்பானதும் நேரடியானதும் ஆகும்; சட்டரீதியான தண்டனை என்பதை வசனம் வெளிப்படையாகக் கூறாததால் ‘மரணதண்டனை நிறைவேற்றினான்’ என்று குறிப்பாக்கவில்லை.
- source_word: δὲ
  choice: தனி இணைப்புச் சொலாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ கதைநடையை முன்னெடுக்கும் மென்மையான இணைப்புச் சொல். தமிழில் இவ்வசனம் முந்தைய வசனத்தின் தொடர்ச்சியாக இயல்பாக வாசிக்கப்படுவதால், கட்டாயமாக ‘மேலும்’ அல்லது ‘அப்போது’ சேர்ப்பது தேவையில்லை.
- source_word: Ἰάκωβον
  choice: யாக்கோபை
  rationale: Ἰάκωβος என்ற பெயரின் மூலமொழி வடிவத்தைத் தொடரும் நிலையான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: யோவானின் சகோதரனாகிய
  rationale: இந்த விளக்கத் தொடர் எந்த யாக்கோபு என்பதைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் இயல்பாகவும் கிரேக்கத்தின் அடையாளப்படுத்தும் செயலையும் தெளிவாகவும் தருகிறது.
- source_word: μαχαίρῃ
  choice: வாளால்
  rationale: μάχαιρα என்பது வாள் அல்லது குறுவாளைக் குறிக்கிறது; இங்குள்ள வேற்றுமை கருவியைக் காட்டுகிறது. ‘வாளால்’ என்பது அந்தக் கொலைக்குப் பயன்படுத்தப்பட்ட கருவியைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ஏரோதுவின் செயலின் தன்மை
  choice: சட்டரீதியான நடைமுறையைக் குறிப்பாக்காமல் நேரடியான கொலையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘யாக்கோபுக்கு மரணதண்டனை நிறைவேற்றினான்’ என்று மொழிபெயர்த்து, அரசால் நடத்தப்பட்ட அதிகாரபூர்வக் கொலையை வலியுறுத்துதல்.
  rationale: ἀνεῖλεν என்பது யாக்கோபு கொல்லப்பட்டதைக் கூறுகிறது; μαχαίρῃ அதற்கான கருவியைச் சுட்டுகிறது. சுற்றியுள்ள நிகழ்ச்சிச் சூழல் அதிகாரபூர்வ மரணதண்டனையை உணர்த்தக்கூடும்; ஆனால் இவ்வசனம் மட்டும் சட்ட நடைமுறையை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே அந்தத் தெளிவின்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயினும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. பெயர்கள் மூலமொழி வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டன; தேவையற்ற சட்டரீதியான விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
