translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத தொடக்க ‘இப்போது’ போன்ற உரையாடல் இணைப்புச் சொல் சேர்க்கப்படவில்லை. அடிக்குறிப்பு [b] அது விளக்கும் காவல் செயலைத் தொடர்ந்து வைக்கப்பட்டுள்ளது.
