id: ACT.12.6
reference: Acts 12:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: ta
  text: 'ஏரோது அவனை வெளியே கொண்டுவரவிருந்தபோது[a], அந்த இரவிலேயே பேதுரு இரண்டு சங்கிலிகளால் பிணைக்கப்பட்டு, இரண்டு படைவீரர்களுக்கு நடுவில் தூங்கிக்கொண்டிருந்தார்; காவலர்கள் கதவுக்கு முன்பாகச் சிறைச்சாலையைக் கண்காணித்துக்கொண்டிருந்தார்கள்[b].


    [a] அல்லது, “அவனை முன்னிலைப்படுத்தவிருந்தபோது.” கிரேக்க வினைச்சொல், ஒருவரைப் பொதுமக்கள் முன்பாகவோ விசாரணைக்காகவோ அழைத்து வருவதைக் குறிக்கலாம்.


    [b] அல்லது, “சிறைச்சாலையைக் காவல் காத்துக்கொண்டிருந்தார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை முன்னிலைப்படுத்தவிருந்தபோது.” கிரேக்க வினைச்சொல், ஒருவரைப் பொதுமக்கள் முன்பாகவோ விசாரணைக்காகவோ அழைத்து வருவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சிறைச்சாலையைக் காவல் காத்துக்கொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: கொண்டுவரவிருந்தபோது
  rationale: μέλλω உடனடியாக நிகழவிருந்த செயலைக் குறிக்கிறது; ‘விருந்தபோது’ அதன் அண்மையையும் எதிர்பார்ப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: προαγαγεῖν αὐτόν
  choice: அவனை வெளியே கொண்டுவர
  rationale: சிறையிலிருந்து பொதுமக்கள் முன்னிலைக்கோ விசாரணைக்கோ பேதுருவை அழைத்து வருவதை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; ‘முன்னிலைப்படுத்த’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: அந்த இரவிலேயே
  rationale: ἐκείνῃ தரும் குறிப்புத்தன்மையையும் வலியுறுத்தலையும் ‘-லேயே’ பிரதிபலிக்கிறது.
- source_word: κοιμώμενος
  choice: தூங்கிக்கொண்டிருந்தார்
  rationale: தொடர்ந்து நடைபெற்றுக்கொண்டிருந்த உறக்கநிலையை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: இரண்டு படைவீரர்களுக்கு நடுவில்
  rationale: இரு வீரர்களுக்கும் இடையில் இருந்த இடநிலையைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: இரண்டு சங்கிலிகளால் பிணைக்கப்பட்டு
  rationale: முன்பே கட்டப்பட்டு அந்நிலையிலேயே இருந்ததை perfect passive participle குறிக்கிறது; ‘பிணைக்கப்பட்டு’ சங்கிலியால் ஏற்பட்ட கட்டுப்பாட்டைத் தெளிவாக்குகிறது.
- source_word: φύλακες πρὸ τῆς θύρας
  choice: காவலர்கள் கதவுக்கு முன்பாக
  rationale: சிறைச்சாலைச் சூழலுக்கும் πρό என்பதன் இடப்பொருளுக்கும் ஏற்ற நேரடியான மொழிபெயர்ப்பு.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: சிறைச்சாலையைக் கண்காணித்துக்கொண்டிருந்தார்கள்
  rationale: τηρέω என்பதன் தொடர்ந்து காவல் செய்தல் அல்லது கண்காணித்தல் என்ற பொருளையும் φυλακή என்பதன் ‘சிறைச்சாலை’ என்ற சூழற்பொருளையும் தருகிறது; மாற்று இயல்பான சொல்லாக்கம் அடிக்குறிப்பில் உள்ளது.
