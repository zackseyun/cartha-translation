  source_fidelity: மூலத்தின் ἐπέμενεν κρούων என்ற தொடர்ச்சிச் செயல் “தொடர்ந்து ... தட்டிக்கொண்டிருந்தார்” என்பதில் துல்லியமாக உள்ளது. ἀνοίξαντες, εἶδαν, ἐξέστησαν ஆகிய நிகழ்வுவரிசையும் அவர்கள் திறந்து, பேதுருவைக் கண்டு, வியப்படைந்தனர் என்ற பொருளுடன் காக்கப்பட்டுள்ளது. சூழலால் தெளிவாகும் ‘கதவை’ முதல் வாக்கியத்தில் சேர்த்திருப்பது பாதுகாப்பானது; ஆங்கில POB-வும் இதையே செய்கிறது.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. “பெரிதும் வியப்படைந்தார்கள்” வலுவான வியப்பைத் தெரிவிக்கிறது; செயல்வரிசையும் வாசிப்பில் தடையின்றி அமைகிறது.
