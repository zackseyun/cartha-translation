source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἐπέμενεν κρούων· ἀνοίξαντες δὲ εἶδαν αὐτὸν καὶ ἐξέστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: ta
  text: ஆனால் பேதுரு தொடர்ந்து கதவைத் தட்டிக்கொண்டிருந்தார்.[a] அவர்கள் திறந்து அவரைக் கண்டபோது, பெரிதும் வியப்படைந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விடாமல் தட்டிக்கொண்டிருந்தார்.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “அவர்கள் திறந்து, அவரைக் கண்டு, வியப்படைந்தார்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν κρούων
  choice: தொடர்ந்து கதவைத் தட்டிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலை வினையான ἐπέμενεν, தட்டும் செயல் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நடந்ததைச் சுட்டுகிறது. κρούων அதனுடன் ஒரே நேரத்தில் நடந்த செயலைக் குறிக்கிறது. தமிழில் இவ்விரண்டின் இணைந்த பொருளை இயல்பாகத் தர இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; சூழலிலிருந்து ‘கதவை’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ἀνοίξαντες
  choice: அவர்கள் திறந்து ... கண்டபோது
  rationale: இறந்தகாலப் பெயரெச்சம் நிகழ்வுகளின் வரிசையைச் சுட்டுகிறது. கிரேக்கத்தில் திறக்கப்பட்ட பொருள் குறிப்பிடப்படாததால், அதை இங்கே மீண்டும் சேர்க்காமல் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: εἶδαν αὐτόν
  choice: அவரைக் கண்டபோது
  rationale: கதைச் சூழலில் எளிய நேரடிப் பார்வையைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐξέστησαν
  choice: பெரிதும் வியப்படைந்தார்கள்
  rationale: இச்சொல் தீவிரமான வியப்பைக் குறிக்கிறது. ‘பெரிதும்’ அந்த வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது; அதேவேளையில் அளவுக்கு மீறிய விளக்கத்தைத் தவிர்க்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முதல் δέ, முந்தைய வசனத்தின் நிலைக்கு மாறான பேதுருவின் தொடர்ந்த செயலை எடுத்துக்காட்டுகிறது. இரண்டாவது δέ தமிழ் வாக்கிய அமைப்பில் தனியாக மொழிபெயர்க்கப்படாமல் காலத் தொடர்புக்குள் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
