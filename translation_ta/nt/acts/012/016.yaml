  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான செயலும் வியப்பின் தீவிரமும் காக்கப்பட்டுள்ளன; சூழல் தெளிவுக்காக ‘கதவை’ என்பது முதல் வாக்கியத்தில் சேர்க்கப்பட்டுள்ளது.
