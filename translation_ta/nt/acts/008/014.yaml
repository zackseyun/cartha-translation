  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: ta
  text: எருசலேமிலிருந்த அப்போஸ்தலர்கள், சமாரியா[a] தேவனுடைய வார்த்தையை ஏற்றுக்கொண்டிருந்தது என்று கேள்விப்பட்டபோது, பேதுருவையும் யோவானையும் அவர்களிடம் அனுப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “சமாரியா” என்பது அந்தப் பகுதியிலிருந்த மக்களைக் கூட்டாகக் குறிக்கிறது.
    reason: மூலத்தில் உள்ள இடப்பெயரின் ஆகுபெயர்ப் பயன்பாட்டையும், பின்னர் வரும் ‘அவர்களிடம்’ என்ற பன்மைச் சுட்டுப்பெயர் அந்த மக்களையே குறிக்கிறது என்பதையும் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: கேள்விப்பட்டபோது
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கு முந்திய சூழலைக் குறிக்கிறது. தமிழில் ‘கேள்விப்பட்டபோது’ என்பது காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான முரண்பாட்டைக் காட்டாமல் கதையின் தொடர்ச்சியை மட்டும் குறிக்கும் மென்மையான இணைப்புச்சொல். தமிழ் வாக்கிய ஓட்டத்தில் தனிச் சொல்லைச் சேர்க்காமலேயே அந்தத் தொடர்ச்சி இயல்பாகத் தெரிகிறது.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: எருசலேமிலிருந்த அப்போஸ்தலர்கள்
  rationale: அப்போஸ்தலர்கள் எருசலேமில் இருந்தார்கள் என்ற இடப்பொருளைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: δέδεκται
  choice: ஏற்றுக்கொண்டது
  rationale: δέχομαι என்பதன் நிறைவுற்ற ஏற்றுக்கொள்ளுதலை இது தெரிவிக்கிறது. இங்கு செய்தியைப் பெற்றுக்கொண்டதோடு அதை ஏற்றுக்கொண்டதையும் தமிழ் சொற்றொடர் இயல்பாகக் காட்டுகிறது.
- source_word: ἡ Σαμάρεια
  choice: சமாரியா
  rationale: கிரேக்கத்தில் உள்ள இடப்பெயர் அப்படியே வைக்கப்பட்டு, அந்த இடத்து மக்களைக் கூட்டாகக் குறிக்கும் ஆகுபெயர்ப் பயன்பாடு பாதுகாக்கப்படுகிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: தேவனுடைய வார்த்தை
  rationale: மூலத்தின் சொல்வடிவத்தையும் புதிய ஏற்பாட்டில் இச்சொற்றொடருக்குள்ள இறையியல் ஒலியையும் காக்கிறது; சூழலில் இது அறிவிக்கப்பட்ட தேவசெய்தியைக் குறிக்கிறது.
- source_word: ἀπέστειλαν
  choice: அனுப்பினார்கள்
  rationale: எளிய இறந்தகால முதன்மை வினையை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: πρὸς αὐτοὺς
  choice: அவர்களிடம்
  rationale: முன்னர் ‘சமாரியா’ என்று கூட்டாகக் குறிப்பிடப்பட்ட மக்களிடம் சென்ற திசையைக் குறிக்கிறது; பன்மைச் சுட்டுப்பெயரையும் பாதுகாக்கிறது.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: பேதுருவையும் யோவானையும்
  rationale: தமிழில் வழக்கமாக நிலைபெற்றுள்ள வேதாகமப் பெயர்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; ‘-ஐயும் ... -ஐயும்’ அமைப்பு இருவரும் அனுப்பப்பட்டதைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ‘சமாரியா’ என்ற இடப்பெயரின் ஆகுபெயர்ப் பயன்பாடு
  choice: சமாரியா தேவனுடைய வார்த்தையை ஏற்றுக்கொண்டது
  alternative: சமாரியர்கள் தேவனுடைய வார்த்தையை ஏற்றுக்கொண்டார்கள்
  rationale: மூலம் இடப்பெயரையே எழுவாயாகக் கொண்டு அங்குள்ள மக்களைக் கூட்டாகக் குறிக்கிறது. அதை முதன்மை உரையில் காப்பது மூலத்துக்கு நெருக்கமானது; அடிக்குறிப்பு பொருளைத் தெளிவுபடுத்துகிறது.
- issue: λόγος என்பதன் மொழிபெயர்ப்பு
  choice: தேவனுடைய வார்த்தை
  alternative: தேவனுடைய செய்தி
  rationale: ‘வார்த்தை’ என்பது மூலச் சொல்லின் வடிவத்தையும் பரந்த வேதாகமப் பயன்பாட்டையும் காக்கிறது; ‘செய்தி’ என்பது இச்சூழலின் கருத்தைத் தெளிவாக்கினாலும் சற்றே விளக்க மொழிபெயர்ப்பாகும்.
- issue: சமாரியா ஒருமையிலிருந்து αὐτούς பன்மைக்குச் செல்லுதல்
  choice: சமாரியா ... அவர்களிடம்
  alternative: சமாரியர்கள் ... அவர்களிடம்
  rationale: மூலத்தில் இடப்பெயர் ஒருமையாக வந்தபின் அங்குள்ள மக்களைப் பன்மைச் சுட்டுப்பெயரால் குறிப்பிடும் இயல்பான பொருள் மாற்றம் உள்ளது. அதனைச் சீராக்காமல் தமிழிலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘எருசலேமிலிருந்த’ என்ற சுருக்கமான அமைப்பும் ‘கேள்விப்பட்டபோது’ என்ற காலத் தொடர்பும் இயல்பான வாக்கிய ஓட்டத்தைத் தருகின்றன. கதைத்தொடர்ச்சியை மட்டும் குறிக்கும் δὲ-க்கு தேவையற்ற தொடக்க இணைப்புச்சொல் சேர்க்கப்படவில்லை.
