id: ACT.8.12
reference: Acts 8:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: ta
  text: ஆனால், கடவுளின் அரசாட்சியையும் இயேசு மெசியாவின்[a] பெயரையும் பற்றிய நற்செய்தியை பிலிப்பு அறிவித்தபோது, அவர்கள் அவரை நம்பினார்கள்; ஆண்களும் பெண்களும் திருமுழுக்கு பெற்றுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு கிறிஸ்துவின் பெயரையும்.” கிரேக்கச் சொல்லான Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைக்க “மெசியா” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ஆனால், ...போது
  rationale: ὅτε என்பதன் காலத் தொடர்பையும் δέ குறிக்கும் மென்மையான மாறுபாடு அல்லது கதை நகர்வையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: அவர்கள் அவரை நம்பினார்கள்
  rationale: இங்கு நம்பிக்கை பிலிப்பை இரட்சகராகக் கொண்டதல்ல; அவர் அறிவித்த செய்தியைச் சொன்ன நம்பத்தகுந்த சாட்சியாக அவரை ஏற்றுக்கொண்டதைக் குறிக்கிறது. முந்தைய பெயருடன் இணைத்து வரும் ‘அவரை’ தமிழில் இயல்பாக உள்ளது.
- source_word: εὐαγγελιζομένῳ
  choice: நற்செய்தியை ... அறிவித்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினையின் சூழ்நிலைத் தொடர்பை கால வாக்கியமாக இயல்பாக வெளிப்படுத்தி, εὐαγγελίζω என்பதன் நற்செய்தி அறிவிக்கும் பொருளைக் காக்கிறது.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: கடவுளின் அரசைப் பற்றிய
  rationale: περί பொருளடக்கத்தை அறிமுகப்படுத்துகிறது; βασιλεία என்பதற்கு ஆட்சி மற்றும் அரசாட்சியின் கருத்தைத் தாங்கும் பொதுவாகப் புரியும் ‘அரசு’ பயன்படுத்தப்படுகிறது.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின் பெயரையும்
  rationale: ὄνομα குறிக்கும் பெயர், அதிகாரம், வெளிப்படுத்தப்பட்ட அடையாளம் ஆகிய பரப்பைச் சுருக்காமல் ‘பெயர்’ தக்கவைக்கப்படுகிறது. Χριστός இங்கு பட்டப்பெயர் சார்ந்ததால் ‘மெசியா’ என வழங்கப்படுகிறது.
- source_word: ἐβαπτίζοντο
  choice: திருமுழுக்குப் பெற்றுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்து அல்லது பலரிடையே நிகழ்ந்த செயலை imperfect passive காட்டுவதால், தமிழின் தொடர்நிலை வடிவம் பயன்படுத்தப்படுகிறது; passive பொருளும் காக்கப்படுகிறது.
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: ஆண்களும் பெண்களும்
  rationale: τε ... καὶ இரு குழுக்களையும் உள்ளடக்கி இணைப்பதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-ஐ மொழிபெயர்த்தல்
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இச்சூழலில் Χριστός வெறும் பெயரின் பகுதியாக அல்லாமல் அபிஷேகம் பெற்ற அரசர் குறித்த பட்டமாக ஒலிக்கிறது. ஆகவே அதன் மெசியானியப் பொருளை வெளிப்படையாகக் காக்க ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது; மாற்று மரபுவழக்கை அடிக்குறிப்பு பதிவு செய்கிறது.
- issue: ἐπίστευσαν τῷ Φιλίππῳ என்பதிலுள்ள நம்பிக்கையின் இலக்கு
  choice: பிலிப்பை நம்பினார்கள்
  alternative: பிலிப்பின்மேல் விசுவாசம் வைத்தார்கள்
  rationale: தத்திவ் அமைப்பு பிலிப்பு அறிவித்ததை நம்பியதைக் குறிக்கிறது; பிலிப்பையே இரட்சிக்கும் விசுவாசத்தின் இலக்காக மாற்றும் வாசிப்பைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘நற்செய்தி’, ‘கடவுளின் அரசு’, ‘திருமுழுக்கு’ ஆகியவை எளிதில் புரியும் சமயச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன; கிரேக்க imperfect-இன் தொடர்ச்சித் தன்மை ‘பெற்றுக்கொண்டிருந்தார்கள்’ என்பதில் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொல்லுக்குப் பதிலாக வசன முடிவில் வைக்கப்பட்டுள்ளது.
