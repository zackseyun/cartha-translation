revisions:
- from: ஆனால், கடவுளின் அரசையும் இயேசு மெசியாவின் பெயரையும் பற்றிய நற்செய்தியை பிலிப்பு அறிவித்தபோது, அவர்கள் அவரை நம்பினார்கள்; ஆண்களும் பெண்களும் திருமுழுக்குப் பெற்றுக்கொண்டிருந்தார்கள்.[a]
  to: ஆனால், கடவுளின் அரசாட்சியையும் இயேசு மெசியாவின்[a] பெயரையும் பற்றிய நற்செய்தியை பிலிப்பு அறிவித்தபோது, அவர்கள் அவரை நம்பினார்கள்; ஆண்களும் பெண்களும் திருமுழுக்கு பெற்றுக்கொண்டிருந்தார்கள்.
  rationale: The revision corrects the Tamil baptism construction, anchors the alternative-rendering footnote to “மெசியா,” and uses “அரசாட்சி” for a clearer rendering of God’s kingdom. It otherwise retains the draft’s close rendering and its non-doctrinal distinction between believing Philip and believing in Philip.
