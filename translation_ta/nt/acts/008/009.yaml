  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: ta
  text: சீமோன் என்ற ஒரு மனிதன் அந்த நகரத்தில் முன்பிருந்தே மந்திரவித்தை[a] செய்து, சமாரிய மக்களை வியப்பில் ஆழ்த்திவந்தான்; தான் ஒரு பெரிய மனிதன் என்று அவன் சொல்லிக்கொண்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூனியவித்தை செய்து.” கிரேக்க வினைச்சொல் மாய அல்லது மந்திரக் கலைகளில் ஈடுபடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தான் முக்கியமான ஒருவன் என்று.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: சீமோன் என்ற ஒரு மனிதன்
  rationale: Ἀνήρ என்பதன் ஆண்பால் குறிப்பை ‘மனிதன்’ தக்கவைக்கிறது; τις என்பதன் வரையறையற்ற தன்மையை ‘ஒரு’ வெளிப்படுத்துகிறது. δέ இங்கு மென்மையான நிகழ்வுமாற்ற இணைப்பாக இருப்பதால், இயல்பான தமிழ் நடையில் தனிச்சொல்லாகச் சேர்க்கப்படவில்லை.
- source_word: ὀνόματι Σίμων
  choice: சீமோன் என்ற
  rationale: பெயரைக் குறிக்கும் கிரேக்கத் தொடருக்கு இயல்பான தமிழாக்கம்; பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: προϋπῆρχεν ἐν τῇ πόλει
  choice: அந்த நகரத்தில் முன்பிருந்தே ... வந்தான்
  rationale: முன்னதாகவே அங்கு இருந்ததையும், இறந்தகாலத்தில் தொடர்ந்த நிலையையும் வெளிப்படுத்துகிறது; ‘அந்த நகரம்’ முந்தைய சூழலில் குறிப்பிடப்பட்ட நகரத்தைக் குறிக்கிறது.
- source_word: μαγεύων
  choice: மந்திரவித்தை செய்து
  rationale: மாய அல்லது மந்திரக் கலைகளில் ஈடுபடுதலைத் தெளிவான நவீன தமிழில் குறிக்கிறது; அதன் ஆற்றலின் மூலத்தை வசனம் கூறுவதைக் காட்டிலும் அதிகமாக வரையறுக்கவில்லை.
- source_word: ἐξιστάνων
  choice: வியப்பில் ஆழ்த்திவந்தான்
  rationale: மக்களைத் திகைக்கவைத்த தொடர்ச்சியான செயலைக் காரணவினை வடிவில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: சமாரிய மக்களை
  rationale: இச்சூழலில் ἔθνος அரசியல் ‘நாடு’ என்பதைக் காட்டிலும் சமாரியப் பொதுமக்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: λέγων
  choice: சொல்லிக்கொண்டான்
  rationale: சீமோன் தன்னைப் பற்றித் தொடர்ந்து முன்வைத்த கூற்றை இயல்பாகக் காட்டுகிறது; ‘கூறிக்கொண்டான்’ போன்ற கடுமையான மதிப்பீட்டைச் சேர்ப்பதில்லை.
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: தான் ஒரு பெரிய மனிதன் என்று
  rationale: ἑαυτόν என்பதன் தன்வலியுறுத்தலை ‘தான்’ தக்கவைக்கிறது; τινα மற்றும் μέγαν ஆகியவை சேர்ந்து காட்டும் வரையறையற்ற பெருமை அல்லது முக்கியத்துவத்தை ‘ஒரு பெரிய மனிதன்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சீமோனின் மந்திரச் செயலின் தன்மை
  choice: மந்திரவித்தை செய்து
  alternative: சூனியவித்தை செய்து
  rationale: வசனம் சீமோன் மந்திரக் கலைகளில் ஈடுபட்டதாகக் கூறுகிறது; ஆனால் அதன் ஆற்றல் பேய்சார்ந்ததா, ஏமாற்றமா என்பதைக் குறிப்பாக இங்கே தீர்மானிக்கவில்லை. ஆகவே அந்த இறையியல் பதற்றம் திறந்தே வைக்கப்படுகிறது.
- issue: சீமோனின் சுயப்பெருமைக் கூற்று
  choice: தான் ஒரு பெரிய மனிதன் என்று
  alternative: தான் முக்கியமான ஒருவன் என்று
  rationale: μέγαν என்பதில் பெருமை, மேன்மை, முக்கியத்துவம் ஆகிய நிழற்பொருள்கள் இருக்க முடியும். முதன்மை உரை பொதுவான ‘பெரிய’ என்பதை வைத்துப் பொருளைத் தேவையின்றி குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பங்கேற்பு அமைப்புகள் தமிழில் தொடர்ச்சியான செயல்களாக இயல்பாக்கப்பட்டுள்ளன; சுயப்பெருமையும் மந்திரச் செயலின் தெளிவின்மையும் மிகைவிளக்கமின்றித் தக்கவைக்கப்பட்டுள்ளன.
