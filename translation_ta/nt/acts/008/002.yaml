  text: συνεκόμισαν δὲ τὸν Στέφανον ἄνδρες εὐλαβεῖς καὶ ⸀ἐποίησαν κοπετὸν μέγαν ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: ta
  text: ஆனால் பக்தியுள்ள ஆண்கள் ஸ்தேவானை அடக்கம் செய்து,[a] அவருக்காகப் பெரிதும் புலம்பினார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஸ்தேவானை அடக்கத்திற்காக ஆயத்தப்படுத்தி’ அல்லது ‘அடக்கம் செய்வதற்காக ஸ்தேவானை எடுத்துச் சென்று’; கிரேக்க வினைச்சொல் அடக்கம் செய்வதை மட்டுமல்லாமல், அவரது உடலை எடுத்துச் சென்று கையாள்வதையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பெரிதும் புலம்பினார்கள்’ என்பது உள்ளார்ந்த துயரத்தை மட்டும் அல்லாமல், கேட்கக்கூடியதும் பொதுவெளியில் வெளிப்படுத்தப்பட்டதுமான துக்கத்தையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: அடக்கம் செய்து
  rationale: இச்சூழலில் இச்சொல் ஸ்தேவானின் உடலை எடுத்துச் சென்று அடக்கத்திற்குரிய முறையில் கையாள்வதையும், அதன் முடிவாக அடக்கம் செய்வதையும் குறிக்கிறது. இயல்பான தமிழில் ‘அடக்கம் செய்து’ என்பது பொருத்தமானது; மூலச்சொல்லின் விரிவை அடிக்குறிப்பு காக்கிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து மென்மையான மாற்றத்தையோ வேறுபாட்டையோ குறிக்கிறது; ‘ஆனால்’ அந்தக் கதைநடைத் திருப்பத்தை வெளிப்படுத்துகிறது.
- source_word: ἄνδρες εὐλαβεῖς
  choice: இறைப்பற்றுள்ள ஆண்கள்
  rationale: ἄνδρες என்பதன் ஆண்பால் பன்மையை ‘ஆண்கள்’ காக்கிறது; εὐλαβεῖς குறிக்கும் சமயப் பயபக்தி மற்றும் பக்திநிறைந்த நடத்தையை நவீன தமிழில் ‘இறைப்பற்றுள்ள’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐποίησαν
  choice: புலம்பினார்கள்
  rationale: கிரேக்கத்தில் ἐποίησαν என்பது κοπετόν உடன் இணைந்து ‘புலம்புதல் செய்தார்கள்’ என்ற கருத்தைத் தருகிறது. தமிழில் தனி வினையாக ‘புலம்பினார்கள்’ என்பதே இயல்பான சொற்றொடர்.
- source_word: κοπετὸν μέγαν
  choice: பெரிதும் புலம்பினார்கள்
  rationale: κοπετός வெளிப்படையான, கேட்கக்கூடிய துக்கப் புலம்பலைக் குறிக்கக்கூடும்; μέγαν அதன் தீவிரத்தை உணர்த்துகிறது. ‘பெரிதும் புலம்பினார்கள்’ இயல்பான தமிழில் இரண்டையும் தருகிறது.
- source_word: ἐπ’ αὐτῷ
  choice: அவருக்காக
  rationale: துக்கப் புலம்பல் சூழலில் ἐπί + வேற்றுமை உருபு அந்த நபரை முன்னிட்டு அல்லது அவரது மரணத்திற்காகப் புலம்புவதைச் சுட்டுகிறது; தமிழில் ‘அவருக்காக’ இயல்பானது.
