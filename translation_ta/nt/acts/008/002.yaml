translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைப்பற்றுள்ள’ என்பது பொதுவாகப் புரியும் சமயப் பக்தியைக் குறிக்கிறது; ‘ஆண்கள்’ மூலத்தின் இலக்கணப் பாலினத்தைத் தெளிவாகக் காக்கிறது. அடிக்குறிப்பு குறிகள் அனைத்தும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
