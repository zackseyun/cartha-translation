  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: ta
  text: ஆனால், அப்போஸ்தலர்கள் கைகளை வைப்பதன் மூலம் ஆவி[a] கொடுக்கப்படுவதைச் சீமோன் கண்டபோது, அவர்களுக்குப் பணத்தை அளிக்க முன்வந்தான்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஆவி.” கிரேக்க உரையில் “ஆவி” என்று மட்டுமே உள்ளது; இச்சூழலில் அது பரிசுத்த ஆவியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: கண்டபோது
  rationale: ὁράω என்பதன் இறந்தகால வினையெச்சம் இங்கு காலத்தொடர்பைக் காட்டுகிறது; சீமோன் கண்டதற்குப் பின் செய்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து சீமோனின் எதிர்வினைக்குச் செல்லும் மென்மையான மாறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων
  choice: அப்போஸ்தலர்கள் கைகளை வைத்ததன் மூலம்
  rationale: διά + genitive குறிப்பிடும் வழிமுறை அல்லது கருவியைத் தெளிவாகக் காட்டுகிறது; அப்போஸ்தலர்களே ஆவியின் இறுதி மூலமெனக் கூறவில்லை.
- source_word: δίδοται
  choice: கொடுக்கப்படுவதை
  rationale: மூலத்தின் நிகழ்காலச் செயப்பாட்டு வடிவத்தை, கதைச் சூழலில் இயல்பான தமிழ் செயப்பாட்டு அமைப்பால் தருகிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவி
  rationale: கிரேக்க மூலத்தில் πνεῦμα மட்டுமே உள்ளது. சூழலில் அது பரிசுத்த ஆவியைக் குறித்தாலும், முதன்மை உரை மூலத்தின் சுருக்கமான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: προσήνεγκεν αὐτοῖς χρήματα
  choice: அவர்களுக்குப் பணம் தர முன்வந்து
  rationale: προσφέρω இங்கு பணத்தை வழங்க முன்வருதல் அல்லது அளிப்பதாகச் சொல்லுதல் என்ற பொருளில் வருகிறது. பணம் உண்மையில் ஏற்றுக்கொள்ளப்பட்டது என்ற தவறான எண்ணத்தைத் தவிர்த்து, தொடரும் வசனத்தோடு இணைகிறது.
theological_decisions:
- issue: τὸ πνεῦμα என்பதன் குறிப்பு
  choice: முதன்மை உரையில் “ஆவி”; அடிக்குறிப்பில் “பரிசுத்த ஆவி” எனத் தெளிவாக்குதல்
  alternative: முதன்மை உரையிலேயே “பரிசுத்த ஆவி”
  rationale: உடனடி சூழல் பரிசுத்த ஆவியையே குறிக்கிறது; ஆனால் கிரேக்க வசனம் πνεῦμα என்று மட்டுமே சொல்வதால் அந்த வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- issue: ஆவி கொடுக்கப்படுவதில் அப்போஸ்தலர்களின் பங்கு
  choice: “கைகளை வைத்ததன் மூலம் ... கொடுக்கப்படுவதை”
  alternative: “அப்போஸ்தலர்கள் ... ஆவியைக் கொடுத்ததை”
  rationale: மூலம் வழிமுறையை மட்டுமே குறிப்பிடுகிறது; அப்போஸ்தலர்களை ஆவியின் இறுதி மூலமாக்காமல், வசனத்தின் இறையியல் பதற்றத்தைத் தீர்மானிக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வசனம் அடுத்த வசனத்தில் வரும் சீமோனின் பேச்சோடு தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
