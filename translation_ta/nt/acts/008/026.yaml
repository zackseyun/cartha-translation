  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: ta
  text: ஆண்டவரின் தூதர் ஒருவர் பிலிப்புவிடம், “எழுந்து, எருசலேமிலிருந்து காசாவுக்கு இறங்கிச் செல்லும் சாலையை நோக்கித் தெற்கே[a] போ” என்றார். அது மக்கள் நடமாட்டமற்ற சாலை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நண்பகலில்.” கிரேக்கச் சொற்றொடர் “தெற்கு” என்ற திசையையோ “நண்பகல்” என்ற நேரத்தையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “இது பாலைவனம்.” சாலையே மக்கள் நடமாட்டமற்றது என்பதற்குப் பதிலாக, அந்தப் பாதை பாலைவனப் பகுதி வழியாகச் செல்கிறது என்று கிரேக்க வாசகம் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: ஆண்டவரின் தூதர் ஒருவர்
  rationale: Ἄγγελος என்பதன் ‘தூதர்’ என்ற அடிப்படைப் பொருளையும், κυρίου என்பதன் தெய்வீகச் சார்பையும் காக்கிறது. கிரேக்கத்தில் பெயர்ச்சொல் குறிப்பில்லாமல் இருப்பதால் ‘ஒருவர்’ சேர்க்கப்பட்டுள்ளது; குறிப்பிட்ட ஓர் தனித்த தூதரை உரை அடையாளப்படுத்துவதாகக் காட்டவில்லை. δέ இங்கு மென்மையான கதைத் தொடர்ச்சியை மட்டும் குறிக்கிறது; தமிழில் தனிச் சொல்லாக மொழிபெயர்க்காமல் இயல்பாக விடப்பட்டுள்ளது.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: பிலிப்புவிடம் … என்றார்
  rationale: தமிழில் நேர்கூற்றை அறிமுகப்படுத்தும் இயல்பான அமைப்பு. ‘பேசி, சொல்லி’ என இரட்டிப்பதைத் தவிர்த்து, மூலத்தின் பேச்சுச் செயலைத் தெளிவாகக் கொடுக்கிறது.
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: எழுந்து … போ
  rationale: இரண்டு கட்டளைகளையும் சுருக்கமாகவும் உடனடி நடவடிக்கையை உணர்த்துமாறும் வழங்குகிறது.
- source_word: κατὰ μεσημβρίαν
  choice: தெற்கே
  rationale: இயக்கத்தைக் குறிக்கும் சூழலில் திசைப் பொருள் இயல்பானது. எனினும் ‘நண்பகலில்’ என்ற காலப் பொருளும் கிரேக்கத்தில் சாத்தியமானதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἐπὶ τὴν ὁδὸν
  choice: சாலையை நோக்கி
  rationale: ஒரு குறிப்பிட்ட பாதையை அடையும்படி செல்லும் இயக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: எருசலேமிலிருந்து காசாவுக்குச் செல்லும்
  rationale: எருசலேமிலிருந்து இறங்கிச் செல்லும் புவியியல் கருத்தைத் தமிழில் இயல்பாக வழங்குகிறது. ‘கீழே இறங்கும்’ என்பது தமிழில் தேவையற்ற சொற்படியான அமைப்பாக இருக்கும்.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: அது மக்கள் நடமாட்டமற்ற சாலை
  rationale: பெண்பால் சுட்டுப்பெயர் முன் வந்த ὁδός (‘சாலை’) என்பதைக் குறிப்பதாக எடுத்துக்கொண்டு, தமிழில் மறைந்துள்ள பெயர்ச்சொல்லை வெளிப்படுத்துகிறது. ἔρημος என்பதன் தனிமையான அல்லது மக்கள் இல்லாத நிலையை ‘மக்கள் நடமாட்டமற்ற’ என்று தெளிவாக்குகிறது; ‘பாலைவனப் பகுதி’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘ஆண்டவரின் தூதர்’ என்பவரின் அடையாளம்
  choice: தெய்வீக அதிகாரத்தோடு தொடர்புடைய ஒரு தூதர் என்று மட்டும் மொழிபெயர்க்கப்படுகிறது.
  alternative: ‘தேவனால் அனுப்பப்பட்ட தூதர்’ அல்லது ஒரு குறிப்பிட்ட வெளிப்பாட்டு உருவமாக விளக்குதல்.
  rationale: மூல உரை தூதரை ‘ஆண்டவரின்’ என்று குறிப்பிடுகிறது; அதற்கு அப்பாற்பட்ட துல்லியமான அடையாளத்தையோ கிறிஸ்தவக் கோட்பாட்டு விளக்கத்தையோ கட்டாயப்படுத்தவில்லை.
- issue: αὕτη ἐστὶν ἔρημος யாருடைய கூற்று என்பது
  choice: நேர்கூற்றுக்கு அடுத்ததாக வரும் கதைசொல்லியின் விளக்கமாக நிறுத்தப்பட்டுள்ளது.
  alternative: தூதரின் கட்டளையின் ஒரு பகுதியாக மேற்கோளுக்குள் அமைத்தல்.
  rationale: பண்டைய கிரேக்கக் கையெழுத்துப் பிரதிகளின் நிறுத்தக்குறிகள் இதைத் தீர்மானிப்பதில்லை. சூழலில் சாலையை விளக்கும் ஆசிரியர் குறிப்பு என வாசிப்பது இயல்பானது; மொழிபெயர்ப்பு இதற்கு மேலான இறையியல் முடிவைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கர்த்தர்’ போன்ற மரபுவழி சமயச் சொல் வடிவத்திற்கு பதிலாக பொதுவான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது. தூதரைக் குறிப்பிட மரியாதைப் பன்மை வினைமுற்றான ‘என்றார்’ பயன்படுத்தப்பட்டாலும், உரை அவரின் இயல்பைப் பற்றி கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்ப்பதில்லை.
