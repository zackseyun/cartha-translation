source:
  edition: SBLGNT
  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: ta
  text: சீமோனும்கூட நம்பினான். திருமுழுக்கு பெற்றபின் அவன் பிலிப்போடு தொடர்ந்து இருந்தான். நிகழ்ந்துகொண்டிருந்த அடையாளங்களையும் பெரும் வல்லமைச் செயல்களையும்[a] கண்டு அவன் வியப்பில் ஆழ்ந்துகொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெரிய அற்புதங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அற்புதங்களையும் வல்லமையின் வெளிப்பாடுகளையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: சீமோனும்கூட
  rationale: καί என்பதன் சேர்க்கைப் பொருளையும் αὐτός தரும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் காட்டுகிறது; சீமோனும் இந்தப் பதிலளிப்பில் சேர்ந்தான் என்பதை முன்னிறுத்துகிறது.
- source_word: ἐπίστευσεν
  choice: நம்பினான்
  rationale: வினைச்சொல் கூறுவதை மட்டும் தருகிறது; சீமோனின் நம்பிக்கை உண்மையானதா அல்லது மேலோட்டமானதா என்ற பின்னணித் தெய்வியல் கேள்வியை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: βαπτισθεὶς
  choice: திருமுழுக்கு பெற்றபின்
  rationale: இறந்தகாலப் பெயரெச்சம் முதன்மைச் செயலுக்கு முந்திய நிகழ்வைக் குறிக்கிறது; தமிழில் நிகழ்வுகளின் வரிசையை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: பிலிப்போடு தொடர்ந்து இருந்தான்
  rationale: சுற்றிவரும் இறந்தகால அமைப்பு நீடித்த செயலைக் காட்டுகிறது. மிகையாகப் பொருள் ஏற்றாமல் சீமோன் பிலிப்புடன் தொடர்ச்சியாக இருந்ததைச் சொல்கிறது.
- source_word: θεωρῶν
  choice: கண்டு
  rationale: சீமோனின் தொடர்ந்த பார்வையே அவன் மலைப்புக்குக் காரணம் என்பதைக் குறும் பெயரெச்சத் தொடரால் இயல்பாக இணைக்கிறது.
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: அப்போஸ்தலர் நடபடிகளில் இச்சொல்லுக்குள்ள சான்றளிக்கும் அல்லது வெளிப்படுத்தும் நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: δυνάμεις μεγάλας
  choice: பெரும் வல்லமைச் செயல்கள்
  rationale: இது தெய்வீக வல்லமையின் வெளிப்பாடுகளைக் குறிக்கிறது. ‘அற்புதங்கள்’ என்று மட்டும் விளக்கிப் பொருளைக் குறுக்காமல் மூலச்சொல்லின் வல்லமை நுட்பத்தைத் தக்கவைக்கிறது.
- source_word: γινομένας
  choice: நிகழ்ந்துகொண்டிருந்த
  rationale: சீமோன் பார்த்துக்கொண்டிருந்தபோது அந்தச் செயல்கள் நிகழ்ந்துகொண்டிருந்த தொடர்நிலையை வெளிப்படுத்துகிறது.
- source_word: ἐξίστατο
  choice: மலைத்துப்போனான்
  rationale: தொடர்ந்த வியப்பையும் மனம் திகைக்கும் அளவிலான தாக்கத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: சீமோனின் நம்பிக்கை உண்மையான மனமாற்றமா என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிப்பது
  choice: ἐπίστευσεν என்பதைத் தகுதிப்படுத்தாமல் ‘நம்பினான்’ என்று மொழிபெயர்த்தல்
  alternative: ‘உண்மையாக நம்பினான்’, ‘நம்புவதாகக் கூறினான்’, அல்லது ‘மேலோட்டமாக நம்பினான்’
  rationale: இவ்வசனம் சீமோன் நம்பியதாகவும் திருமுழுக்கு பெற்றதாகவும் கூறுகிறது; பின்னைய நிகழ்வுகள் விளக்கவியல் கேள்விகளை எழுப்பினாலும், கிரேக்க உரை இங்கே அவன் நம்பிக்கையின் தன்மையைத் தீர்மானிக்கவில்லை. ஆகவே அந்தத் தெய்வியல் இறுக்கம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஞானஸ்நானம்’ போன்ற மரபுசார் சொல்லுக்குப் பதிலாக பரவலாகப் புரியும் ‘திருமுழுக்கு’ பயன்படுத்தப்பட்டது; வாக்கியத்தின் நீண்ட கிரேக்க அமைப்பு தமிழில் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது.
