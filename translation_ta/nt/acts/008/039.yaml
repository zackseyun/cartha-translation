source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: ta
  text: அவர்கள் தண்ணீரிலிருந்து மேலே வந்தபோது, ஆண்டவருடைய ஆவியானவர் பிலிப்புவைத் திடீரெனக் கொண்டுபோய்விட்டார்[a]. அந்த அண்ணகன் அதன்பின் பிலிப்புவை இனி காணவில்லை; அவன் மகிழ்ச்சியுடன் தன் வழியில் தொடர்ந்து சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிலிப்புவைப் பறித்துக்கொண்டு போனார்.” கிரேக்க வினைச்சொல் திடீரான, வலிமையான அகற்றுதலை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: தண்ணீரிலிருந்து மேலே வந்தபோது
  rationale: ἀναβαίνω என்பதன் மேல்நோக்கிய இயக்கத்தையும் ἐκ என்பதன் ‘உள்ளிருந்து வெளியே’ என்ற இடப்பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது; திருமுழுக்கின் முறையை இதற்கு மேல் வரையறுப்பதில்லை.
- source_word: πνεῦμα κυρίου
  choice: ஆண்டவருடைய ஆவியானவர்
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகள் பயன்பாட்டில் இது தனிப்பட்ட முறையில் செயல்படும் கடவுளுடைய ஆவியைக் குறிப்பது இயல்பானது. ‘ஆவியானவர்’ என்பது நவீனத் தமிழில் மரியாதையையும் தனிப்பட்ட செயற்பாட்டையும் காட்டுகிறது.
- source_word: ἥρπασεν
  choice: பிலிப்புவைத் திடீரெனக் கொண்டுபோய்விட்டார்
  rationale: ἁρπάζω குறிக்கும் திடீரான, வலிமையான அகற்றுதலை ‘திடீரென’ தக்கவைக்கிறது; முதன்மை உரையில் அளவுக்கு மீறிய வன்முறைத் தொனியைத் தவிர்க்கிறது. வலிமையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: அதற்குப் பிறகு அவரைக் காணவில்லை
  rationale: οὐκέτι குறிக்கும் ‘இனிமேல் இல்லை’ என்ற காலத் தொடர்ச்சியை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὁ εὐνοῦχος
  choice: அந்த அண்ணகன்
  rationale: εὐνοῦχος என்பதற்கு நேரடியான தமிழ்ச் சொல் ‘அண்ணகன்’; முன்னைய நிகழ்விலுள்ள அதே நபரை ‘அந்த’ சுட்டுகிறது.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: தன் வழியில் தொடர்ந்து சென்றான்
  rationale: இறந்தகாலத் தொடர்நிலை வினை குறிக்கும் நீடித்த பயணத்தை ‘தொடர்ந்து சென்றான்’ வெளிப்படுத்துகிறது; ὁδός இங்கு வெறும் சாலை அல்ல, பயண வழி.
- source_word: χαίρων
  choice: மகிழ்ச்சியுடன்
  rationale: பயணத்தைத் தொடர்ந்தபோது உடனிருந்த மகிழ்ச்சியான நிலையைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்தின் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: πνεῦμα κυρίου என்பது பரிசுத்த ஆவியைக் குறிக்கிறதா அல்லது உயிரற்ற தெய்வீக வல்லமையைக் குறிக்கிறதா
  choice: தனிப்பட்ட தெய்வீகச் செயற்பாட்டைக் காட்டும் ‘ஆண்டவருடைய ஆவியானவர்’
  alternative: ‘ஆண்டவருடைய ஆவி’
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகள் நூல்களின் வழக்கில் இந்தச் சொற்றொடர் செயல்படும் கடவுளுடைய ஆவியைக் குறிப்பது மிகவும் இயல்பானது; இருப்பினும் மூலத்தில் இல்லாத ‘பரிசுத்த’ என்ற சொல்லைச் சேர்க்கவில்லை.
- issue: ἥρπασεν அற்புதமானதும் திடீரானதுமான அகற்றுதலைக் குறிக்கிறதா
  choice: ‘திடீரெனக் கொண்டுபோய்விட்டார்’ என்று தெய்வீகத் திடீர் அகற்றுதலை வெளிப்படுத்துதல்
  alternative: ‘பறித்துக்கொண்டுபோனார்’ என்று வலிமையை இன்னும் நேரடியாக வலியுறுத்துதல்
  rationale: எழுவாய் ஆண்டவருடைய ஆவியானவர் என்பதால் தெய்வீகத் தலையீடு தெளிவாகிறது. ‘திடீரென’ வினையின் திடீர் வலிமையைத் தக்கவைக்கிறது; அது எவ்வாறு நிகழ்ந்தது என்பதை உரை சொல்லாததால் அதற்கு மேல் விளக்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கும் பொதுப் பேச்சு வழக்குக்கும் இடைப்பட்ட, வாசிக்க எளிதான கண்ணியமான நடை. ‘அண்ணகன்’ என்பது துல்லியமான தமிழ்ச் சொல்; ‘அவர்கள்’ பிலிப்புவுக்கும் அண்ணகனுக்கும் பொருந்துகிறது. ‘ஆவியானவர்’ மற்றும் பிலிப்பைக் குறிக்கும் ‘அவர்’ ஆகியவை மரியாதை ஒருமையில் வைக்கப்பட்டுள்ளன.
