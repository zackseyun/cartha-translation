  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες διῆλθον εὐαγγελιζόμενοι τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: ta
  text: ஆகவே, சிதறடிக்கப்பட்டவர்கள் ஊர் ஊராகச் சென்று அந்தச் செய்தியை அறிவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க வினைச்சொல், “நற்செய்தியை அறிவித்தல்” என்ற நுணுக்கத்தைக் கொண்டுள்ளது. “அந்தச் செய்தியை நற்செய்தியாக அறிவித்தார்கள்” என்றும் மொழிபெயர்க்கலாம். இங்கு “செய்தி” என்பது இயேசுவைப் பற்றிய செய்தியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: ஆகவே, ...வர்கள்
  rationale: οὖν முந்தைய துன்புறுத்தலாலும் சிதறடிப்பாலும் ஏற்பட்ட விளைவைச் சுட்டுகிறது. μέν இங்கு தொடரை அமைக்கும் உரையாடல் துகள் என்பதால் தமிழில் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: διασπαρέντες
  choice: சிதறடிக்கப்பட்டவர்கள்
  rationale: இது இறந்தகாலச் செயல்பாட்டு அல்லாத வினையெச்சம்; அவர்கள் தாங்களாகப் பிரிந்துசெல்லாமல், பிறரால் சிதறடிக்கப்பட்டார்கள் என்ற பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: διῆλθον
  choice: ஊர் ஊராகச் சென்றார்கள்
  rationale: ஒரே இடத்தைக் கடந்து சென்றார்கள் என்பதல்லாமல், பல இடங்களுக்குச் சென்று வந்தார்கள் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὐαγγελιζόμενοι
  choice: நற்செய்தியாக அறிவித்துக்கொண்டே
  rationale: பயணம் செய்தபோதே தொடர்ந்து அறிவித்தார்கள் என்ற உடனிகழ்வையும், வினையில் உள்ள ‘நற்செய்தி அறிவித்தல்’ என்ற பொருளையும் காக்கிறது.
- source_word: τὸν λόγον
  choice: அந்தச் செய்தியை
  rationale: λόγος இங்கு இயேசுவைப் பற்றிய அறிவிப்பைக் குறிக்கிறது. ‘செய்தி’ என்பது இயல்பான நவீனத் தமிழ்; ‘அந்த’ என்பது கிரேக்கத் திட்டவட்டச் சுட்டையும் முன் சூழலில் அறியப்பட்ட செய்தியையும் காட்டுகிறது.
theological_decisions:
- issue: εὐαγγελιζόμενοι τὸν λόγον என்பதன் தொடர்பு
  choice: அந்தச் செய்தியை நற்செய்தியாக அறிவித்துக்கொண்டே
  alternative: வார்த்தையை அறிவித்துக்கொண்டே / நற்செய்தியைப் பிரசங்கித்துக்கொண்டே
  rationale: கிரேக்கத்தில் τὸν λόγον என்பது εὐαγγελιζόμενοι என்பதன் நேரடிச் செயப்படுபொருள். எனவே ‘செய்தி’ என்பதையும் வினையில் உள்ள ‘நற்செய்தி அறிவித்தல்’ என்ற நுணுக்கத்தையும் ஒன்றை மற்றொன்றில் கரைத்துவிடாமல் காக்கிறது; ‘தேவவார்த்தை’ என்று மூலத்தில் இல்லாத சொல்லையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது. ‘பிரசங்கித்தல்’ போன்ற திருச்சபைச் சிறப்புச் சொல்லுக்குப் பதிலாக ‘அறிவித்தல்’ பயன்படுத்தப்பட்டுள்ளது; ‘ஊர் ஊராக’ என்பது பயணித்துச் செய்தியைப் பரப்பிய தொடர்ச்சியான செயலை இயல்பாக வெளிப்படுத்துகிறது.
