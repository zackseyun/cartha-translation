revisions:
- from: ஆகவே, சிதறடிக்கப்பட்டவர்கள் அந்தச் செய்தியை நற்செய்தியாக அறிவித்துக்கொண்டே ஊர் ஊராகச் சென்றார்கள்.[a]
  to: ஆகவே, சிதறடிக்கப்பட்டவர்கள் ஊர் ஊராகச் சென்று அந்தச் செய்தியை அறிவித்தார்கள்.[a]
  rationale: The revision makes τὸν λόγον (‘the word/message’) the direct object of ‘announced/proclaimed,’ as in the Greek, and retains the evangelizing nuance in a concise lexical note. It also preserves the passive scattering, the inference from the preceding context, and travel from place to place in idiomatic modern Tamil.
  reviewer_model: gpt-5.6-terra
