translation:
  language: ta
  text: அப்போது அவர்கள் அவர்கள்மேல் தங்கள் கைகளை வைத்தார்கள்; அவர்களும் பரிசுத்த ஆவியைப் பெற்றுக்கொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, தொடர்நிலையை வெளிப்படுத்தி: “அப்போது அவர்கள் அவர்கள்மேல் தங்கள் கைகளை வைத்துக்கொண்டிருந்தார்கள்; அவர்களும் பரிசுத்த ஆவியைப் பெற்றுக்கொண்டிருந்தார்கள்.” கிரேக்கத்தில் இரண்டு வினைச்சொற்களும் நிறைவுறா இறந்தகாலத்தில் உள்ளன.'
    reason: கிரேக்கத்தின் இரண்டு நிறைவுறா இறந்தகால வினைகளுக்கும் சாத்தியமான தொடர்நிலை மொழிபெயர்ப்பைத் தருகிறது.
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: நிகழ்வுகளின் காலவரிசையில் அடுத்து நடந்ததை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: அவர்கள் அவர்கள்மேல் தங்கள் கைகளை வைத்தார்கள்
  rationale: கைகளை ஒருவர்மேல் வைக்கும் கிரேக்க மரபுத்தொடரைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது. கிரேக்கத்தின் நிறைவுறா இறந்தகால அம்சம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ἐλάμβανον
  choice: பெற்றுக்கொண்டார்கள்
  rationale: λαμβάνω என்பதன் ‘பெறு’ என்ற பொருளை இயல்பான தமிழ் நடையில் தருகிறது; நிறைவுறா இறந்தகாலத்தின் தொடர்நிலைச் சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: πνεῦμα ἅγιον
  choice: பரிசுத்த ஆவி
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகளின் சூழலில் இது இறைவனுடைய பரிசுத்த ஆவியைக் குறிக்கிறது; ‘ஒரு பரிசுத்த ஆவி’ என்ற வரையறையற்ற பொருள் இங்கு பொருந்தாது.
theological_decisions:
- issue: πνεῦμα ἅγιον என்பது வரையறையற்ற ஓர் ஆவியையா அல்லது இறைவனுடைய பரிசுத்த ஆவியையா குறிக்கிறது
  choice: பரிசுத்த ஆவி
  alternative: ஒரு பரிசுத்த ஆவி
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகளின் உடனடிச் சூழலில் விசுவாசிகள் பெற்றுக்கொள்ளும்படி அப்போஸ்தலர்கள் வேண்டிக்கொண்ட இறைவனுடைய ஆவியே குறிக்கப்படுகிறார்; இதற்கு மேற்பட்ட கோட்பாட்டு விளக்கம் உரையில் சேர்க்கப்படவில்லை.
- issue: இரண்டு கிரேக்க நிறைவுறா இறந்தகால வினைகளின் அம்சத்தைத் தமிழில் எவ்வாறு வெளிப்படுத்துவது
  choice: முதன்மை உரையில் இயல்பான இறந்தகாலம்; தொடர்நிலை வடிவத்தை அடிக்குறிப்பில் வழங்குதல்
  alternative: அவர்கள் கைகளை வைத்துக்கொண்டிருந்தார்கள்; அவர்கள் பெற்றுக்கொண்டிருந்தார்கள்
  rationale: இரு வினைகளையும் தொடர்நிலையில் தருவது கிரேக்க அம்சத்தை வெளிப்படையாகக் காட்டினாலும், தமிழில் அது தேவையற்ற நீடிப்பையோ ஒரே செயல் நீண்ட நேரம் நடந்ததையோ உணர்த்தக்கூடும். முதன்மை உரை இயல்பான கதைநடையைப் பேணுகிறது; உண்மையான அம்சத் தகவலை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பிரதிப்பெயர்கள் பாதுகாக்கப்பட்டுள்ளன; சூழலிலிருந்து ‘அப்போஸ்தலர்கள்’ அல்லது ‘விசுவாசிகள்’ போன்ற பெயர்ச்சொற்கள் உரைக்குள் சேர்க்கப்படவில்லை.
