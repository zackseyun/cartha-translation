id: ACT.8.22
reference: Acts 8:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: ta
  text: ஆகவே, உன்னுடைய இந்தத் தீமையைவிட்டு மனந்திரும்பு; உன் உள்ளத்தின் நோக்கம்[a] ஒருவேளை உனக்கு மன்னிக்கப்படுமோ என்று ஆண்டவரிடம் மன்றாடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் உள்ளத்தின் எண்ணம்.”
    reason: ἐπίνοια என்பது சூழலின்படி ‘நோக்கம்’ அல்லது ‘எண்ணம்’ எனப் பொருள்படலாம்.
lexical_decisions:
- source_word: μετανόησον
  choice: மனந்திரும்பு
  rationale: தீர்மானமான மனமாற்றத்தையும் தீமையிலிருந்து திரும்புவதையும் கோரும் இறந்தகாலக் கட்டளை வடிவத்தின் ஒழுக்க-ஆவிக்குரிய வலிமையை இயல்பான வேதாகமத் தமிழில் தெரிவிக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கண்டிப்பிலிருந்து வரும் முடிவையும் அதன் விளைவாக இப்போது செய்ய வேண்டியதையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: உன்னுடைய இந்தத் தீமையைவிட்டு
  rationale: ἀπό என்பதிலுள்ள விலகுதலை ‘விட்டு’ என்பதும், κακίαவின் ஒழுக்கத் தீமையை ‘தீமை’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன; σουவின் தனிப்பட்ட பொறுப்பும் காக்கப்படுகிறது.
- source_word: δεήθητι
  choice: மன்றாடு
  rationale: வெறும் பொதுவான வேண்டுதலைவிட ஊக்கமான, பணிவான விண்ணப்பத்தைக் குறிக்கும் δέομαιயின் வலிமையை ‘மன்றாடு’ தக்கவைக்கிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவரிடம்
  rationale: κύριος என்பதற்கான இயல்பான கிறிஸ்தவத் தமிழ் இணை; இங்கு அது யாரைக் குறிப்பதாகும் என்பதை மொழிபெயர்ப்பு தேவையின்றித் தீர்மானிக்கவில்லை.
- source_word: εἰ ἄρα
  choice: ஒருவேளை … மன்னிக்கப்படுமோ என்று
  rationale: மன்னிப்பு உறுதி செய்யப்பட்டதாகவோ இயலாததாகவோ கூறாமல், εἰ ἄραவின் தயக்கத்துடனான சாத்தியத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀφεθήσεταί σοι
  choice: உனக்கு மன்னிக்கப்படுமோ
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் மன்னிப்பை வழங்குபவர் வெளிப்படையாகச் சொல்லப்படாத நிலையையும் காக்கிறது.
- source_word: ἡ ἐπίνοια τῆς καρδίας σου
  choice: உன் உள்ளத்தின் நோக்கம்
  rationale: சீமோனின் உள்ளார்ந்த சிந்தனைக்கு மட்டுமல்ல, அதற்குப் பின்னிருந்த எண்ணப்பூர்வமான நோக்கத்திற்கும் ἐπίνοια இங்கு இடமளிக்கிறது; ‘உள்ளம்’ καρδίαவின் வேதாகம மனிதவியல் நுணுக்கத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: மன்னிப்பு கிடைக்கும் சாத்தியத்தின் உறுதித்தன்மை
  choice: பேதுரு மனந்திரும்பி மன்றாடும்படி கட்டளையிடுகிறார்; ஆனால் மன்னிப்பு உறுதியாகக் கிடைக்கும் என்று கூறாமல் ‘ஒருவேளை … மன்னிக்கப்படுமோ’ என்ற நிபந்தனைத் தொனியைப் பேணுகிறார்.
  alternative: மனந்திரும்பினால் மன்னிப்பு உறுதியாகக் கிடைக்கும் என்று மொழிபெயர்த்தல், அல்லது மன்னிப்பு கிடைப்பது இயலாது என்று உணர்த்துதல்.
  rationale: εἰ ἄρα மற்றும் எதிர்காலச் செயப்பாட்டு வினைச்சொல் சேர்ந்து நம்பிக்கையுடனான சாத்தியத்தையும் தீர்மானிக்கப்படாத முடிவையும் வெளிப்படுத்துகின்றன; இந்த இறையியல் பதற்றம் தீர்த்துவைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘மனந்திரும்பு’, ‘ஆண்டவர்’ ஆகிய பரிச்சயமான வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; ‘மன்றாடு’ என்பது δεήθητιயின் ஊக்கமான வேண்டுதலை வெளிப்படுத்துகிறது. கிரேக்கத்தின் நிபந்தனைத் தொனியை இயல்பாகக் காக்க வாக்கிய ஒழுங்கு தமிழுக்கேற்ப மாற்றப்பட்டுள்ளது.
