  source_fidelity: மூலத்தின் நிகழ்வரிசை, εὐνοῦχος (‘அண்ணகன்’), φησιν-இன் வரலாற்று நிகழ்காலம் (‘கேட்கிறான்’), மற்றும் திறந்த கேள்வி ஆகியவை வரைவில் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் ‘தண்ணீர் இருந்த ஓரிடத்திற்கு’ என்பது கிரேக்கத்தின் ἐπί τι ὕδωρ (‘சில/ஏதோ தண்ணீரிடம்’) என்பதைக் காட்டிலும் ஓரளவு இடவியல் விளக்கத்தைச் சேர்க்கிறது; ‘தண்ணீர் இருந்த இடம்’ என அமைப்பது நெருக்கமானதும் இயல்பானதும்.
