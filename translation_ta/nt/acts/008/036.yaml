  text: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, ἦλθον ἐπί τι ὕδωρ, καί φησιν ὁ εὐνοῦχος· Ἰδοὺ ὕδωρ, τί κωλύει με ⸀βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: ta
  text: அவர்கள் வழியில் சென்றுகொண்டிருந்தபோது, தண்ணீர் இருந்த ஓரிடத்திற்கு வந்தார்கள். அண்ணகன், “இதோ, தண்ணீர்! நான் திருமுழுக்கு பெறுவதற்கு என்ன தடை?” என்று கேட்கிறான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: அண்ணகன்
  rationale: அரசவையில் பதவி வகித்த உடற்கூறியல் ரீதியான அண்ணகனைச் சுட்டும் கிரேக்கச் சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: τι ὕδωρ
  choice: தண்ணீர் இருந்த ஓரிடம்
  rationale: குறிப்பிடப்படாத ஒரு நீர்நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நீரின் வகையையோ அளவையையோ ஊகிக்கவில்லை.
- source_word: φησιν
  choice: கேட்கிறான்
  rationale: வரலாற்று நிகழ்காலத்தைத் தமிழில் நிகழ்காலமாகவே தக்கவைத்து, தொடர்ந்து வரும் வினாவுக்கு இயல்பான உரையறிமுகம் அளிக்கிறது.
- source_word: βαπτισθῆναι
  choice: திருமுழுக்குப் பெறுவதற்கு
  rationale: செயப்பாட்டு வடிவத்தையும் கிறிஸ்தவத் திருமுழுக்கு குறித்த குறிப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τί κωλύει με
  choice: என்ன தடை?
  rationale: ‘எது என்னைத் தடுக்கிறது?’ என்ற கருத்தைச் சுருக்கமான, இயல்பான தமிழ் வினாவாக வழங்குகிறது.
theological_decisions:
- issue: திருமுழுக்கிற்கான தகுதி அல்லது நடைமுறை நிபந்தனைகள்
  choice: “நான் திருமுழுக்குப் பெறுவதற்கு என்ன தடை?” என்ற திறந்த வினாவை அப்படியே தக்கவைத்தல்
  alternative: ஒரு குறிப்பிட்ட விசுவாச அறிக்கையையோ சடங்கு நிபந்தனையையோ வசனத்துக்குள் சேர்த்தல்
  rationale: SBLGNT வசனம் எந்தப் பதிலையோ கூடுதல் நிபந்தனையையோ இங்கு வழங்கவில்லை; எனவே உரையின் திறந்த தன்மையைத் தீர்மானித்து விடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதைமிக்க, எளிதில் புரியும் நடை. “அண்ணகன்” என்பது மூலச்சொல்லின் தனிப்பட்ட பொருளைத் தக்கவைக்கும் இலக்கியத் தரமான சொல். கிரேக்க வரலாற்று நிகழ்காலமான φησιν தமிழிலும் நிகழ்காலத்தில் வழங்கப்பட்டுள்ளது.
