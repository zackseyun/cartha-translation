source:
  edition: SBLGNT
  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: ta
  text: அப்போது பிலிப்பு ஓடி அவரிடம் சென்று, இறைவாக்கினர் ஏசாயாவின் நூலை அவர் வாசித்துக்கொண்டிருப்பதைக் கேட்டார். “நீங்கள் வாசிப்பது உங்களுக்கு உண்மையிலேயே புரிகிறதா?” என்று சொன்னார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் வாசிப்பது உங்களுக்கு மெய்யாகவே புரிகிறதா?” கிரேக்க வினாத் துகள்கள் பிலிப்பின் கேள்விக்கு வலியுறுத்தலைச் சேர்க்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: ஓடிப்போய்
  rationale: προστρέχω என்ற வினையின் இறந்தகால வினையெச்சம், ஒருவரை நோக்கி விரைவாக ஓடிச் செல்வதைக் குறிக்கிறது; தமிழில் ‘ஓடிப்போய்’ என்பது அந்த வேகத்தையும் நிகழ்வின் உயிரோட்டத்தையும் இயல்பாகத் தருகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு δέ கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; ‘அப்போது’ என்பது தமிழில் இயல்பான கதைத் தொடர்ச்சியை அளிக்கிறது.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: அவர் ... வாசித்துக்கொண்டிருப்பதைக் கேட்டு
  rationale: ἀκούω உடன் வரும் ஆறாம் வேற்றுமை வினையெச்ச அமைப்பு, அந்த நபர் வாசித்துக்கொண்டிருந்ததை பிலிப்பு கேட்டார் என்று பொருள்படும். கிரேக்கத்தில் ‘சத்தமாக’ என்பது வெளிப்படையாக இல்லை; ஆகவே அது சேர்க்கப்படவில்லை.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: இறைவாக்கினரான ஏசாயாவின் நூலை
  rationale: சூழலில் வாசிக்கப்பட்டது ஏசாயாவின் எழுத்து/நூல் என்பது தெளிவு. தமிழில் ஒருவரையே ‘வாசித்தார்’ என்று சொல்வது இயல்பற்றதால், பொருளை வெளிப்படுத்த ‘நூலை’ என்பது மறைமுகமாக நிரப்பப்பட்டுள்ளது; ‘இறைவாக்கினர்’ προφήτης என்பதைக் கண்ணியமான நவீன தமிழில் தருகிறது.
- source_word: εἶπεν
  choice: என்று கேட்டார்
  rationale: λέγω என்பதன் அடிப்படைப் பொருள் ‘சொல்’ என்றாலும், தொடர்ந்து நேரடியான கேள்வி வருவதால் தமிழில் ‘கேட்டார்’ என்பது பேச்சுச் செயலின் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἆρά γε
  choice: உண்மையிலேயே ... ஆ
  rationale: ἆρα γε கேள்விக்கு வலியுறுத்தலையும் ஆராயும் தொனியையும் சேர்க்கிறது; ‘உண்மையிலேயே’ அந்த வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: γινώσκεις
  choice: புரிகிறதா
  rationale: இங்கு γινώσκω வாசித்த செய்தியின் பொருளை அறிந்து கொள்வதைக் குறிக்கிறது; ‘புரிகிறதா’ என்பது நவீன தமிழில் நேரான, இயல்பான தேர்வு.
- source_word: ἃ ἀναγινώσκεις
  choice: நீங்கள் வாசிப்பது
  rationale: ἃ என்பது வாசிக்கப்படும் உள்ளடக்கத்தைக் குறிக்கிறது; நிகழ்காலத் தொடர்ச்சியைத் தமிழில் சூழலும் ‘வாசிப்பது’ என்ற வடிவமும் இயல்பாகத் தருகின்றன.
