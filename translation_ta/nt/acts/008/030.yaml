  register: நவீன நிலையான தமிழில், மரியாதையான ‘நீங்கள்’ வடிவமும் இயல்பான கதைநடையும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் சுறுசுறுப்பையும் கேள்வியின் வலியுறுத்தலையும் காக்கும் வகையில் உகந்த-ஒப்புமை அணுகுமுறை பின்பற்றப்பட்டுள்ளது.
