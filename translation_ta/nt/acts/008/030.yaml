revisions:
- from: அப்போது பிலிப்பு ஓடிப்போய், அவர் இறைவாக்கினரான ஏசாயாவின் நூலை வாசித்துக்கொண்டிருப்பதைக் கேட்டு, “நீங்கள் வாசிப்பது உங்களுக்கு உண்மையிலேயே புரிகிறதா?” என்று கேட்டார்.[a]
  to: அப்போது பிலிப்பு ஓடி அவரிடம் சென்று, இறைவாக்கினர் ஏசாயாவின் நூலை அவர் வாசித்துக்கொண்டிருப்பதைக் கேட்டார். “நீங்கள் வாசிப்பது உங்களுக்கு உண்மையிலேயே புரிகிறதா?” என்று சொன்னார்.[a]
