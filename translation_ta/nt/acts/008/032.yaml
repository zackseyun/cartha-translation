source:
  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: ta
  text: 'அவன் வாசித்துக்கொண்டிருந்த வேதப்பகுதி இதுதான்: “செம்மறியாடு கொல்லப்படுவதற்குக் கொண்டு செல்லப்பட்டதுபோலவும்[a], ஆட்டுக்குட்டி தன் மயிரைக் கத்தரிப்பவனுக்கு முன்பாக மௌனமாயிருப்பதுபோலவும்[b], அவ்வாறே அவன் தன் வாயைத் திறப்பதில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொலைக்குக் கொண்டு செல்லப்பட்டதுபோல.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மயிர் கத்தரிப்பவனுக்கு முன்பாக”; கிரேக்கில் சொல்லுக்குச் சொல், “அதன் மயிரைக் கத்தரிப்பவனுக்கு முன்பாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: வேதப்பகுதி
  rationale: ஒரு குறிப்பிட்ட திருமறைப் பகுதியைக் குறிக்கும் இயல்பான, சுருக்கமான நவீனத் தமிழ் சொற்றொடர்.
- source_word: ἀνεγίνωσκεν
  choice: வாசித்துக்கொண்டிருந்த
  rationale: இறந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கும் கிரேக்க முற்றுப்பெறா காலத்தின் பொருளைப் பாதுகாக்கிறது.
- source_word: Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη
  choice: செம்மறியாடு ஒன்று கொல்லப்படுவதற்குக் கொண்டுபோகப்படுவதுபோல
  rationale: πρόβατον என்பதைக் குறிப்பான ‘செம்மறியாடு’ என்றும், ἤχθη என்பதன் செயப்பாட்டு பொருளை ‘கொண்டுபோகப்படுவது’ என்றும் வெளிப்படுத்துகிறது; ἐπὶ σφαγήν நோக்கத்தைச் சுட்டுகிறது.
- source_word: ἀμνὸς
  choice: ஆட்டுக்குட்டி
  rationale: பொதுவான πρόβατον என்பதிலிருந்து வேறுபட்ட இளம் ஆட்டைக் குறிக்கும் சொல்லைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν
  choice: தன்னை மயிர் கத்தரிக்கிறவனுக்கு முன்பாக
  rationale: கிரேக்கப் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் செயலாற்றுகிற நபராக மொழிபெயர்த்து, ஆட்டின் மயிர் கத்தரிக்கப்படுவதைத் தெளிவாக்குகிறது.
- source_word: ἄφωνος
  choice: மௌனமாயிருக்கும்
  rationale: இச்சூழலில் ‘குரலற்ற’ என்பதைவிட அமைதியாக இருப்பதைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ்.
- source_word: οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: அவர் தமது வாயைத் திறப்பதில்லை
  rationale: மேற்கோளிலுள்ள நிகழ்காலத்தைப் பாதுகாக்கிறது; மரியாதை ஒருமை தமிழில் இயல்பாக இருந்தாலும், அந்த நபர் இயேசு என்று வசனத்திற்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: ஏசாயா 53 மேற்கோளின் கிறிஸ்துவியல் குறிப்பு
  choice: மேற்கோளை அதன் உவமை வடிவிலேயே வைத்தல்
  alternative: துன்புறும் ஊழியர் இயேசுவே என்று இவ்வசனத்திலேயே வெளிப்படையாகக் கூறுதல்
  rationale: சுற்றியுள்ள நிகழ்வுரை அந்த அடையாளத்தை விளக்குகிறது; ஆனால் இவ்வசனம் வேதமேற்கோளை மட்டும் தருவதால், அதன் குறிப்பை மொழிபெயர்ப்பில் முன்கூட்டியே தீர்மானித்து விரிவாக்கவில்லை.
- issue: மேற்கோளிலுள்ள கால வடிவம்
  choice: ‘திறப்பதில்லை’ என்ற நிகழ்காலம்
  alternative: ‘திறக்கவில்லை’ என்ற இறந்தகாலம்
  rationale: ἀνοίγει என்ற கிரேக்க நிகழ்காலத்தின் உயிரோட்டத்தையும் மேற்கோள் வடிவத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘வேதப்பகுதி’ என்பது திருவெழுத்தின் குறிப்பிட்ட பகுதியை இயல்பாகக் குறிக்கிறது. மேற்கோளின் கவித்துவமான ஒப்புமையும் πρόβατον/ἀμνός ஆகியவற்றின் செம்மறியாடு/ஆட்டுக்குட்டி வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
