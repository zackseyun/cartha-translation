  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: ta
  text: பிலிப்பு சமாரியாவின் நகரத்திற்குச் இறங்கிச் சென்று, அவர்களுக்கு மேசியாவைப் பிரகடனப்படுத்தினார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சமாரியா பகுதியில் உள்ள ஒரு நகரத்திற்குச் இறங்கிச் சென்று.’ கிரேக்கத் தொடரைச் சமாரியாவில் உள்ள ஒரு குறிப்பிட்ட நகரத்தையோ, பொதுவாக அந்தப் பகுதியின் நகரங்களில் ஒன்றையோ குறிப்பதாகப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘சமாரியா நகரத்திற்குச் இறங்கிச் சென்று.’
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது கதையைத் தொடரும் மென்மையான இணைப்புச்சொல். தமிழில் தேவையற்ற ‘இப்போது’ அல்லது வலுவான முரண்பாட்டைக் காட்டும் சொல்லைச் சேர்க்காமல் வாக்கியத் தொடர்ச்சியால் அதன் பணி வெளிப்படுகிறது.
- source_word: κατελθὼν
  choice: சென்று
  rationale: இறங்கி அல்லது கீழ்நோக்கிச் செல்லும் திசைநுணுக்கம் கிரேக்கத்தில் உள்ளது. ஆனால் இயல்பான நவீனத் தமிழில் இடப்பெயர்ச்சியை ‘சென்று’ என்று கூறுவது தெளிவானது; ‘இறங்கிச் சென்று’ என்பதும் சாத்தியம்.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: சமாரியாவின் நகரத்திற்கு
  rationale: πόλιν என்பதற்கு முன் வரும் குறிப்புச் சுட்டை மதித்து ‘நகரத்திற்கு’ எனத் திட்டவட்டமாக மொழிபெயர்க்கப்பட்டுள்ளது. இது சமாரியா பகுதியிலுள்ள குறிப்பிட்ட நகரத்தையோ ‘சமாரியா நகரம்’ என அறியப்பட்ட நகரத்தையோ குறிக்கக்கூடியதால் மாற்று வாய்ப்புகள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
- source_word: ἐκήρυσσεν
  choice: அறிவித்தார்
  rationale: பொதுவாகப் பிரகடனம் செய்தல் என்ற பொருளை இயல்பான, திருச்சபைச் சொல்வழக்கில் மட்டும் கட்டுப்படாத நவீனத் தமிழில் தருகிறது.
- source_word: αὐτοῖς
  choice: அங்கிருந்தவர்களுக்கு
  rationale: கிரேக்கத்தின் ‘அவர்களுக்கு’ என்ற பொருளைத் தமிழில் தெளிவான இடச்சூழலுடன் இயல்பாகத் தெரிவிக்கிறது.
- source_word: τὸν χριστόν
  choice: மேசியாவை
  rationale: குறிப்புச் சுட்டுடனும் அறிவிப்பு சூழலிலும் Χριστός ஒரு பட்டமாகச் செயல்படுகிறது; எனவே அதன் யூத மேசியா சார்ந்த பொருள் மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து / அந்தக் கிறிஸ்து
  rationale: இங்கு அது பெயரைப் போல அல்லாமல் வாக்களிக்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாக வருகிறது. ‘மேசியா’ என்பது அந்தப் பட்டத்தின் பொருளையும் யூத எதிர்பார்ப்புச் சூழலையும் காக்கிறது.
- issue: சமாரியாவின் நகரம் எது என்பதிலுள்ள தெளிவின்மை
  choice: சமாரியாவின் நகரம்
  alternative: சமாரியாவிலுள்ள ஒரு நகரம் / சமாரியா நகரம்
  rationale: கிரேக்க குறிப்புச் சுட்டை முதன்மை உரையில் காத்தாலும், இந்தத் தொடர் ஒரு குறிப்பிட்ட நகரத்தையா, அந்தப் பகுதியிலுள்ள ஒரு நகரத்தையா, அல்லது சமாரியா எனப்பட்ட நகரத்தையா குறிக்கிறது என்பதை உரை முழுமையாகத் தீர்மானிக்கவில்லை; ஆகவே மாற்று புரிதல்கள் அடிக்குறிப்புகளில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, இயல்பான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பிரசங்கித்தார்’ என்பதற்குப் பதிலாக பொதுவான அறிவிப்புச் செயலை வெளிப்படுத்தும் ‘அறிவித்தார்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. இடப்பெயர் தொடர்பான உண்மையான தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
