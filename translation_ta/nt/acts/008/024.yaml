id: ACT.8.24
reference: Acts 8:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: ta
  text: ஆனால் சீமோன், “நீங்களே எனக்காக ஆண்டவரிடம் வேண்டிக்கொள்ளுங்கள்; நீங்கள் சொன்னவற்றில் ஒன்றும் என்மேல் வராதபடி” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν
  choice: ஆனால் சீமோன் … என்றான்
  rationale: ἀποκριθεὶς உடன் εἶπεν என்பது பதிலுரையை அறிமுகப்படுத்தும் கிரேக்க மரபுத்தொடர். தமிழில் இரு வினைகளையும் தனித்தனியாக மொழிபெயர்க்காமல், இயல்பாகப் பேச்சை அறிமுகப்படுத்துகிறது; δέ குறிக்கும் மென்மையான எதிர்மாற்றை ‘ஆனால்’ காக்கிறது.
- source_word: Δεήθητε ὑμεῖς
  choice: நீங்களே … வேண்டிக்கொள்ளுங்கள்
  rationale: Δεήθητε என்பது இறைவனிடம் மன்றாடி வேண்டுவதைக் குறிக்கிறது. வெளிப்படையாக வந்துள்ள ὑμεῖς-இன் வலியுறுத்தலை ‘நீங்களே’ வெளிப்படுத்துகிறது.
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν κύριον
  choice: எனக்காக ஆண்டவரிடம்
  rationale: ὑπέρ உடன் ஆறாம் வேற்றுமை பிறருக்காகப் பரிந்துவேண்டுதலைக் குறிக்கிறது; πρός வேண்டுதலின் முகவரைச் சுட்டுகிறது. ‘ஆண்டவர்’ என்பது κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழ் இணை.
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: ஒன்றும் என்மேல் வந்துவிடாதபடி
  rationale: ὅπως நோக்கத்தையோ எதிர்பார்க்கும் விளைவையோ அறிமுகப்படுத்துகிறது. ἐπέρχομαι உடன் ἐπί தண்டனை அல்லது தீங்கு ஒருவர்மேல் வருவதைப் போன்ற தீவிரத்தைக் கொண்டிருப்பதால், வெறும் ‘எனக்கு நேரிடாதபடி’ என்பதற்குப் பதில் ‘என்மேல் வந்துவிடாதபடி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὧν εἰρήκατε
  choice: நீங்கள் சொன்னவற்றில்
  rationale: 'இது μηδέν-ஐச் சார்ந்த பகுதிப்பொருள் கொண்ட உறவுப்பெயர் அமைப்பு: அவர்கள் சொன்னவற்றில் ஒன்றும் வரக்கூடாது. தமிழ் அமைப்பு இதை இயல்பாகவும் துல்லியமாகவும் தருகிறது.'
theological_decisions:
- issue: τὸν κύριον என்பதன் குறிப்பிட்ட அடையாளம்
  choice: ஆண்டவர்
  alternative: கடவுள்; ஆண்டவராகிய இயேசு
  rationale: கிரேக்க மூலம் ‘ஆண்டவர்’ என்று மட்டுமே கூறுகிறது. இங்கு அது கடவுளையா உயிர்த்தெழுந்த இயேசுவையா குறிக்கிறது என்பதை மொழிபெயர்ப்பில் தேவையின்றித் தீர்மானிக்காமல், மூலத்தின் குறிப்பின்மையை அப்படியே காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வசனத்தின் தீவிரமும் காக்கப்பட்டுள்ளன. ‘நீங்களே’ சீமோன் தானே வேண்டாமல் அப்போஸ்தலர்களை வேண்டச் சொல்வதில் உள்ள வலியுறுத்தலை வெளிப்படுத்துகிறது.
