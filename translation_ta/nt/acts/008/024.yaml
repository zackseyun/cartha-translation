    reason: ὧν-உடைய பகுதிப்பொருள் நிழலை ‘சொன்னவற்றில்’ என்பதற்குப் பதிலாக ‘சொன்னவற்றிலிருந்து’ என வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
  revision_rationale: A single Tamil imperative now corresponds to Δεήθητε, while ‘வராதபடி’ correctly expresses the purpose/result introduced by ὅπως. The footnote is completed so that it supplies a usable alternative for the full relevant clause without altering its meaning.
