  to: ஆனால் சீமோன், “நீங்களே எனக்காக ஆண்டவரிடம் வேண்டிக்கொள்ளுங்கள்; நீங்கள் சொன்னவற்றில் ஒன்றும் என்மேல் வராதபடி” என்றான்.
