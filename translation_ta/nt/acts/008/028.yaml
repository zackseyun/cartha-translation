- from: அவன் திரும்பிச் சென்றுகொண்டிருந்தான்; தன் தேரில் அமர்ந்தபடி இறைவாக்கினர் எசாயாவின் நூலை வாசித்துக்கொண்டிருந்தான்.[a]
  to: அவன் திரும்பிச் சென்றுகொண்டிருந்தான்; தன் தேரில் அமர்ந்து, எசாயா இறைவாக்கினரின் நூலை வாசித்துக்கொண்டிருந்தான்.[a]
  rationale: The revision preserves the Greek imperfect/progressive sense, the seated posture, and the idiomatic Tamil reference to reading a prophetic book. It retains the source expression’s identification of Isaiah as a prophet more directly, without adding ‘home’ or asserting that the reading was aloud.
