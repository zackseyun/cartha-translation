id: ACT.8.28
reference: Acts 8:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἦν ⸀τε ὑποστρέφων καὶ καθήμενος ἐπὶ τοῦ ἅρματος αὐτοῦ καὶ ἀνεγίνωσκεν τὸν προφήτην Ἠσαΐαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: ta
  text: அவன் திரும்பிச் சென்றுகொண்டிருந்தான்; தன் தேரில் அமர்ந்து, எசாயா இறைவாக்கினரின் நூலை வாசித்துக்கொண்டிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பண்டைய காலத்தில் பலர் உரக்க வாசித்தார்கள். ஆகவே, ‘உரக்க வாசித்துக்கொண்டிருந்தான்’ என்றும் புரிந்துகொள்ளலாம்; ஆனால் ‘உரக்க’ என்பது கிரேக்க வினைச்சொல்லில் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: அவன் திரும்பிச் சென்றுகொண்டிருந்தான்
  rationale: ἦν என்பதுடன் நிகழ்காலப் பெயரெச்சம் சேர்ந்துள்ள அமைப்பு, கடந்த காலத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் காட்டுகிறது. சூழலில் தெரிந்தாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘வீட்டுக்கு’ என்பது சேர்க்கப்படவில்லை; τέ இயல்பான தமிழ் தொடரில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: καθήμενος
  choice: அமர்ந்தபடி
  rationale: பயணத்தின்போது அவன் இருந்த உடல் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; முதன்மை வினையின் தொடர்ச்சியோடும் நன்றாக இணைகிறது.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: தன் தேரில்
  rationale: ἐπί என்பதன் சொற்பொருள் ‘மேல்’ என இருக்கக்கூடியபோதிலும், வாகனத்தில் பயணிப்பதைத் தமிழில் இயல்பாக ‘தேரில்’ என்று சொல்வது பொருளையும் காட்சியையும் காக்கிறது. αὐτοῦ இங்குள்ள எழுவாயையே சுட்டுவதால் ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀνεγίνωσκεν
  choice: வாசித்துக்கொண்டிருந்தான்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்த வாசிப்பைக் காட்டுகிறது. பண்டைய காலத்தில் உரக்க வாசிப்பது வழக்கமாக இருந்தாலும், இவ்வினைச்சொல் இங்கு ‘உரக்க’ என்பதைத் தனியாகக் கட்டாயப்படுத்தாததால் அது முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: இறைவாக்கினர் எசாயாவின் நூலை
  rationale: கிரேக்கத்தில் சொற்பட ‘இறைவாக்கினர் எசாயாவை’ என்றிருந்தாலும், வாசிக்கப்பட்டது அவரது எழுத்து அல்லது நூல் என்பதே பொருள். தமிழில் தவறான புரிதலைத் தவிர்த்து இயல்பாகச் சொல்ல ‘நூலை’ வெளிப்படுத்தப்பட்டுள்ளது; ‘இறைவாக்கினர்’ என்பது நவீன, கண்ணியமான சொல்லாகும்.
