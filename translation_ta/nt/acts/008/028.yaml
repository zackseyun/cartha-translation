translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான இரண்டு கடந்தகாலச் செயல்களும் ‘சென்றுகொண்டிருந்தான்’, ‘வாசித்துக்கொண்டிருந்தான்’ எனப் பாதுகாக்கப்பட்டுள்ளன. ‘இறைவாக்கினர்’ என்பது மரியாதை ஒருமை வடிவமாகப் பயன்படுத்தப்பட்டுள்ளது.
