  source_fidelity: 'முதல் கூறில் மூலத்தின் பொருள் துல்லியமாக உள்ளது: அசுத்த ஆவிகளே உரத்த குரலில் கூச்சலிட்டு, அவை பிடித்திருந்தவர்களிடமிருந்து வெளியேறின. γάρ-இன் விளக்கத் தொடர்பும், ἐθεραπεύθησαν-இன் செயப்பாட்டு வடிவமும் பேணப்பட்டுள்ளன. ஆனால் χωλοί என்பதற்கு ‘கால் ஊனமுற்றவர்கள்’ என்பது நிலையான உடல் ஊனத்தைத் தேவையற்ற வகையில் குறிப்பதாக இருக்கலாம்; மூலச்சொல் முதன்மையாக நடப்பதில்/கால்களில் உள்ள குறைபாட்டைக் குறிக்கிறது.'
