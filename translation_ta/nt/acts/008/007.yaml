source:
  edition: SBLGNT
  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: ta
  text: ஏனெனில், அசுத்த ஆவிகள் பிடித்திருந்த பலரிடமிருந்து அவை உரத்த குரலில் கூச்சலிட்டுக்கொண்டே வெளியேறின; முடக்குவாதத்தால் பாதிக்கப்பட்டவர்களும் கால்களில் குறைபாடு உள்ளவர்களுமான பலர் குணமாக்கப்பட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα
  choice: ஏனெனில், அசுத்த ஆவிகள் பிடித்திருந்த பலரிடமிருந்து
  rationale: γάρ முந்தைய கூற்றுக்கான விளக்கத் தொடர்பைக் காட்டுவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது. τῶν ἐχόντων என்ற அமைப்பு, ஆவிகள் பிடித்திருந்த மக்களைச் சுட்டுவதாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: πνεύματα ἀκάθαρτα
  choice: அசுத்த ஆவிகள்
  rationale: லூக்கா–அப்போஸ்தலர் பணிகள் நூல்களின் பேயோட்டும் சூழலில், இந்தச் சொற்றொடருக்கான துல்லியமும் பரவலாகப் புரிந்துகொள்ளக்கூடியதுமான தமிழ் இணை இது.
- source_word: βοῶντα φωνῇ μεγάλῃ ἐξήρχοντο
  choice: அவை உரத்த குரலில் கூச்சலிட்டுக்கொண்டே வெளியேறின
  rationale: நடுநிலைப் பன்மை வினையெச்சமான βοῶντα, πνεύματα என்பதோடு இலக்கண ரீதியாக இயைந்து, கூச்சலிட்டவை அசுத்த ஆவிகளே என்பதைத் தெளிவாக்குகிறது. இறந்தகால நிகழ்வின் தொடர்ச்சித் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παραλελυμένοι
  choice: முடக்குவாதமுற்றவர்கள்
  rationale: செயலிழந்த அல்லது வாதத்தால் முடங்கிய உடல்நிலையைச் சுட்டும் சொல்; நவீன தமிழில் நோய்நிலையை மரியாதையுடன் குறிக்கிறது.
- source_word: χωλοὶ
  choice: கால் ஊனமுற்றவர்கள்
  rationale: நடப்பதில் உடல் குறைபாடு உள்ளவர்களை இழிவுபடுத்தாத, தெளிவான நவீன தமிழ் சொற்றொடராகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐθεραπεύθησαν
  choice: குணமாக்கப்பட்டார்கள்
  rationale: மூலத்தின் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பேணி, இவ்வாக்கியத்தில் செயலாற்றியவரை வெளிப்படையாகச் சேர்க்காமல் உள்ளது.
theological_decisions:
- issue: கூச்சலிட்டதும் வெளியேறியதும் யார்?
  choice: அசுத்த ஆவிகளே உரத்த குரலில் கூச்சலிட்டுக்கொண்டு மக்களிடமிருந்து வெளியேறின.
  alternative: ஆவிகள் வெளியேறுகையில் அவை பிடித்திருந்த மக்களே கூச்சலிட்டார்கள்.
  rationale: βοῶντα என்ற நடுநிலைப் பன்மை வினையெச்சம் πνεύματα ἀκάθαρτα என்ற நடுநிலைப் பன்மைப் பெயர்ச்சொற்றொடரோடு இயல்பாக இயைகிறது. ஆகவே, கூச்சலிடும் செயல் ஆவிகளுக்குரியது என உரை காட்டுகிறது.
translation_notes:
  register: நவீன செந்தமிழும் பொதுவழக்கில் எளிதில் புரியும் சொற்களும் இணைந்த கண்ணியமான கதைநடை. மூலத்தின் விளக்கத் தொடர்பு, செயப்பாட்டு வடிவம், மற்றும் ஆவிகளே கூச்சலிட்டன என்ற இலக்கணத் தெளிவு பேணப்பட்டுள்ளன.
