id: ACT.8.25
reference: Acts 8:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: ta
  text: அவ்வாறு அவர்கள் வலியுறுத்திச் சாட்சியமளித்து, கர்த்தருடைய வார்த்தையை எடுத்துரைத்த பின்பு, எருசலேமுக்குத் திரும்பிக்கொண்டிருந்தார்கள்; சமாரியர்களின் பல கிராமங்களிலும் நற்செய்தியை அறிவித்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: உறுதியாகச் சாட்சியளித்து
  rationale: வினைச்சொல்லில் உள்ள தீவிரமான, வலியுறுத்தப்பட்ட சாட்சியின் பொருளைப் பாதுகாக்கிறது; சூழலில் இல்லாத ‘எச்சரித்தல்’ என்ற குறுகிய பொருளைச் சேர்க்கவில்லை.
- source_word: λαλήσαντες τὸν λόγον τοῦ κυρίου
  choice: கர்த்தருடைய வார்த்தையை எடுத்துரைத்த பின்பு
  rationale: λαλέω என்பதன் பேசுதல்/எடுத்துரைத்தல் என்ற இயல்பான பொருளையும், λόγος என்பதற்குரிய மரபான ‘வார்த்தை’ என்பதையும் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: ὑπέστρεφον
  choice: திரும்பிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் காட்டும் தொடர்நிலையைத் தமிழின் ‘கொண்டிருந்தார்கள்’ அமைப்பு வெளிப்படுத்துகிறது.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: சமாரியர்களின் பல கிராமங்களிலும்
  rationale: கிராமங்களுக்கும் சமாரியர்களுக்கும் இடையிலான கிரேக்க உரையின் தொடர்பைப் பாதுகாத்து, தமிழில் இயல்பான இடப்பொருளையும் தெரிவிக்கிறது.
- source_word: εὐηγγελίζοντο
  choice: நற்செய்தியை அறிவித்துக்கொண்டிருந்தார்கள்
  rationale: நற்செய்தியைப் பிரசித்தப்படுத்துதல் என்ற வினைப்பொருளையும், முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்ச்சியான செயலையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: எழுவாயாகக் குறிக்கப்படுகிறவர்கள் யார்?
  choice: ‘அவர்கள்’ என்றே வைக்கப்பட்டது.
  alternative: ‘பேதுருவும் யோவானும்’ என்று பெயர்களை வெளிப்படையாகச் சேர்த்தல்.
  rationale: உடனடியான சூழல் பேதுருவையும் யோவானையும் சுட்டினாலும், இவ்வசனத்தின் கிரேக்க உரை பெயர்களைக் கூறாமல் பன்மை எழுவாயைக் கொண்டுள்ளது; ஆகவே உரையில் இல்லாத பெயர்கள் சேர்க்கப்படவில்லை.
- issue: திரும்பிச் செல்லுதலும் நற்செய்தி அறிவித்தலும் இடையிலான காலத் தொடர்பு
  choice: இரு செயல்களும் தொடர்ந்துகொண்டிருந்ததாக இணையான வினை வடிவங்களில் வழங்கப்பட்டது.
  alternative: எருசலேமுக்குத் திரும்பிய பின்பே கிராமங்களில் அறிவித்தார்கள் என வரிசைப்படுத்துதல்.
  rationale: ὑπέστρεφον மற்றும் εὐηγγελίζοντο ஆகிய இரண்டும் முற்றுப்பெறாத இறந்தகால வினைகள்; உரை இரண்டு செயல்களையும் தொடர்ச்சியானவையாக முன்வைக்கிறது, அவற்றின் உறவைத் தேவையின்றி தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கர்த்தர்,’ ‘வார்த்தை,’ ‘நற்செய்தி’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக வைத்துக்கொள்ளப்பட்டுள்ளன; சமயக்குழு சார்ந்த தனிச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
