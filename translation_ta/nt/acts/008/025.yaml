    issue: Force of διαμαρτυράμενοι
    rationale: '"உறுதியாகச் சாட்சியளித்து" may primarily communicate that they testified with certainty. The Greek conveys earnest or emphatic testimony; "வலியுறுத்திச் சாட்சியமளித்து" better preserves this nuance.'
  revised_text: அவ்வாறு அவர்கள் வலியுறுத்திச் சாட்சியமளித்து, கர்த்தருடைய வார்த்தையை எடுத்துரைத்த பின்பு, எருசலேமுக்குத் திரும்பிக்கொண்டிருந்தார்கள்; சமாரியர்களின் பல கிராமங்களிலும் நற்செய்தியை அறிவித்துக்கொண்டிருந்தார்கள்.
