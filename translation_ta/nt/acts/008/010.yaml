source:
  edition: SBLGNT
  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: ta
  text: சிறியவர் முதல் பெரியவர் வரை அனைவரும் அவரைக் கூர்ந்து கவனித்துவந்தார்கள். “மகத்தானது என்று அழைக்கப்படும் கடவுளின் வல்லமை இவர்தான்”[a] என்று அவர்கள் சொல்லிவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர்தான் ‘கடவுளின் மகத்தான வல்லமை.’” கிரேக்கச் சொற்றொடரைப் பட்டப்போன்ற வெளிப்பாடாக இன்னும் சுருக்கமாக மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: அவரைக் கூர்ந்து கவனித்துவந்தார்கள்
  rationale: προσέχω இச்சூழலில் ஒருவர்மீது கவனத்தைச் செலுத்தி, அவருக்குச் செவிகொடுப்பதைக் குறிக்கிறது. இறந்தகாலத் தொடர்நிலையை உணர்த்தும் προσεῖχον என்பதற்காக ‘கவனித்துவந்தார்கள்’ என்று மொழிபெயர்க்கப்பட்டது; ‘கூர்ந்து’ என்பது அந்தக் கவனத்தின் தீவிரத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: மக்கள் முழுவதையும் உள்ளடக்கும் பன்மைச் சொல்லைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: சிறியோர்முதல் பெரியோர்வரை
  rationale: சமூக நிலையிலோ முக்கியத்துவத்திலோ முழு வரம்பையும் குறிக்கும் மூலமொழியின் இருமுனைச் சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: λέγοντες
  choice: என்று அவர்கள் சொல்லிவந்தார்கள்
  rationale: முதன்மை வினையுடன் ஒரே காலத்தில் தொடர்ந்து நிகழ்ந்த பேச்சை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Οὗτός
  choice: இவர்தான்
  rationale: இச்சுட்டுப்பெயர் சீமோன் என்னும் நபரைக் குறிப்பதால் ‘இவர்’ பயன்படுத்தப்பட்டது; ‘தான்’ கூட்டத்தின் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: கடவுளின் வல்லமை
  rationale: தெய்வீக ஆற்றலைக் குறிக்கும் மூலச் சொற்றொடரின் அமைப்பையும் கூட்டம் சீமோனுக்குக் கொடுத்த அடையாளத்தையும் காக்கிறது.
- source_word: ἡ καλουμένη Μεγάλη
  choice: மகத்தானது என்று அழைக்கப்படும்
  rationale: καλουμένη என்பதன் பெயரிடப்படுதல் என்ற செயப்பாட்டு பொருளையும் Μεγάλη என்பதன் அடைமொழித் தன்மையையும் பாதுகாக்கிறது; இதை விளக்கவுரையாக மாற்றவில்லை.
theological_decisions:
- issue: கூட்டத்தின் கூற்று முறையான தெய்வீகப் பட்டமா, சீமோனைப் பற்றிய விளக்கக் கூற்றா என்பது
  choice: “மகத்தானது என்று அழைக்கப்படும் கடவுளின் வல்லமை இவர்தான்” என்று கூட்டத்தின் கூற்றாக மொழிபெயர்த்தல்
  alternative: “இவர்தான் ‘கடவுளின் மகத்தான வல்லமை’ என்று அழைக்கப்படுபவர்”
  rationale: கிரேக்க உரை கூட்டம் சீமோனைப் பற்றிச் சொன்னதைப் பதிவு செய்கிறது; அந்தக் கூற்றை உரையாளர் ஏற்றுக்கொள்வதாகக் காட்டவில்லை. முதன்மை மொழிபெயர்ப்பு பெயரிடப்படுதல் என்ற வடிவத்தையும் ‘மகத்தானது’ என்ற அடைமொழியையும் வைத்திருக்கிறது; மாற்று, அதைத் தலைப்புப்போன்ற சுருக்கமான தொடராக வாசிக்கும் வாய்ப்பைக் காட்டுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கவனித்துவந்தார்கள்’, ‘சொல்லிவந்தார்கள்’ ஆகியவை கிரேக்க இறந்தகாலத் தொடர்நிலையை வெளிப்படுத்துகின்றன. கூட்டத்தின் கூற்று மேற்கோளுக்குள் வைக்கப்பட்டதால், அதை விவரிப்பவர் உறுதிப்படுத்துவதாகத் தோன்றாது.
