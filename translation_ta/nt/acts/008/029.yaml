id: ACT.8.29
reference: Acts 8:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ τὸ πνεῦμα τῷ Φιλίππῳ· Πρόσελθε καὶ κολλήθητι τῷ ἅρματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: ta
  text: அப்போது ஆவியானவர் பிலிப்பிடம், “இந்தத் தேரை நெருங்கி, அதனோடு சேர்ந்துகொள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தத் தேரை அணுகி, அதன் அருகிலேயே இரு.”
    reason: κολλήθητι என்பது ‘சேர்ந்துகொள்’ என்பதோடு, நெருக்கமாக அல்லது அருகிலேயே தொடர்ந்து இருத்தல் என்ற நுணுக்கத்தையும் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: εἶπεν
  choice: என்றார்
  rationale: நேரடிக் கூற்றைத் தொடர்ந்து வரும் கதைநடைச் சொல்லாக இயல்பான தமிழ் வடிவம்; தெய்வீகச் செயற்பாட்டாளருக்குரிய மரியாதைப் பன்மையும் இதில் வெளிப்படுகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு வலுவான எதிர்மறையை அல்ல, நிகழ்வுகளின் அடுத்த கட்டத்தை δέ குறிக்கிறது; ‘அப்போது’ இயல்பான கதைநடைத் தொடர்ச்சியைத் தருகிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: அப்போஸ்தலர் பணிகளில் வெளிப்பாட்டு வழிநடத்தலை வழங்கும் இந்தச் சொற்றொடர் பரிசுத்த ஆவியைக் குறிக்கிறது. மூலத்தில் ἅγιον இல்லாததால் ‘பரிசுத்த’ என்பது சேர்க்கப்படவில்லை; தமிழில் தனிப்பட்ட தெய்வீகச் செயற்பாட்டாளரை இயல்பாகவும் மரியாதையுடனும் குறிக்க ‘ஆவியானவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τῷ Φιλίππῳ
  choice: பிலிப்பிடம்
  rationale: கூறப்பட்ட செய்தியைப் பெறுபவரைக் குறிக்கும் எளிய வேற்றுமைப் பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: Πρόσελθε
  choice: நெருங்கி
  rationale: தேரை நோக்கிச் சென்று அதன் அருகில் வரும்படியான கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: κολλήθητι
  choice: அதனோடு சேர்ந்துகொள்
  rationale: κολλάομαι நெருக்கமாக இணைதல் அல்லது உடன் சேர்ந்திருத்தல் என்ற பொருளைக் கொண்டது. இச்சூழலில் நகரும் தேருடன் சென்று சேரும் கட்டளையை இந்த வடிவம் தெளிவாகத் தருகிறது; அருகிலேயே இருக்க வேண்டும் என்ற மாற்று நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: τῷ ἅρματι τούτῳ
  choice: இந்தத் தேரை / அதனோடு
  rationale: ἅρμα இச்சூழலில் ‘தேர்’; τούτῳ என்பதன் அண்மைச் சுட்டை ‘இந்த’ காக்கிறது. இரு வினைகளுக்கும் தமிழில் வேண்டிய வேற்றுமைகள் இயல்பாக அமைக்கப்பட்டுள்ளன.
theological_decisions:
- issue: τὸ πνεῦμα என்பதன் சுட்டுப்பொருள்
  choice: பரிசுத்த ஆவியைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: தெளிவாக அடையாளப்படுத்தப்படாத ஓர் ஆவி அல்லது உள்ளார்ந்த ஆன்மிகத் தூண்டுதல்
  rationale: அப்போஸ்தலர் பணிகளில் விசுவாசிகளுக்கு தெய்வீக வழிநடத்தல் அளிக்கும் ‘ஆவி’ தொடர்ந்து பரிசுத்த ஆவியையே குறிக்கிறது. எனினும் மூலத்தில் ‘பரிசுத்த’ என்ற பெயரடை இல்லாததால் அதை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் உடனடி இயக்கமும் தேருடன் நெருக்கமாகச் செல்லும் கருத்தும் தெளிவாக வைக்கப்பட்டுள்ளன.
