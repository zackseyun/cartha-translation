  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: ta
  text: பிலிப்பு[a] அவரிடம், “நீங்கள் முழு மனதோடு நம்பினால், ஞானஸ்நானம் பெற உங்களுக்கு அனுமதி உண்டு” என்றார். அதற்கு அவர், “இயேசுவே மெசியாவும் கடவுளின் மகனும் என்று நான் நம்புகிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில்—மூன்றாம் நூற்றாண்டைச் சேர்ந்த பப்பிரஸ் பிரதிகளிலும், நான்காம் நூற்றாண்டைச் சேர்ந்த சினாய்ட்டிகஸ் மற்றும் வத்திக்கானஸ் பிரதிகளிலும்—தொடக்ககால கொப்திக் மொழிபெயர்ப்புகளிலும் இல்லை. ஆனால் பைசாந்தியப் பெரும்பான்மை உரைமரபிலும் இலத்தீன் உரைமரபிலும் இது உள்ளது; இரண்டாம் நூற்றாண்டின் பிற்பகுதியிலேயே இரேனேயுஸ் இதை மேற்கோள் காட்டினார்; பின்னர் சைப்பிரியனும் மேற்கோள் காட்டினார். ஞானஸ்நானத்தின்போது பயன்படுத்தப்பட்ட தொடக்ககால வழிபாட்டு விசுவாச அறிக்கை பின்னர் அப்போஸ்தலர் பணிகள் நூலின் கதை உரைக்குள் சேர்க்கப்பட்டதாக அறிஞர்கள் பலர் கருதுகின்றனர்.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: ஞானஸ்நானம் பெறலாம்
  rationale: இது அனுமதி அல்லது சாத்தியத்தைக் குறிக்கும் ஆளில்லா வினை. கிரேக்கத்தில் செயல் சூழலிலிருந்து புரிந்துகொள்ளப்படுவதால் விடப்பட்டுள்ளது; தமிழில் வாக்கியம் இயல்பாகவும் தெளிவாகவும் இருக்க, முந்தைய வசனத்தின் ஞானஸ்நானச் செயல் வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: முழு உள்ளத்தோடும்
  rationale: முழுமையான நேர்மையையும் அர்ப்பணிப்பையும் குறிக்கும் செமித்திய-வேதாகம வழக்கை, உடல் உறுப்பை மட்டும் நினைவூட்டும் சொற்பொருள் மொழிபெயர்ப்பைத் தவிர்த்து இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: Πιστεύω
  choice: நான் நம்புகிறேன்
  rationale: இங்கு இயேசுவின் அடையாளத்தை ஏற்றுக்கொண்டு அறிக்கையிடும் நம்பிக்கையை நேரடியாகக் காட்டுகிறது.
- source_word: Χριστόν
  choice: மெசியா
  rationale: Χριστός இங்கு இயேசுவுக்குரிய பட்டமாகப் பயன்படுத்தப்படுகிறது; அதன் அபிஷேகம் பெற்றவர் என்ற மெசியானிய பொருளை பெயரொலிப்பான ‘கிறிஸ்து’ என்பதைக் காட்டிலும் வெளிப்படையாகத் தருகிறது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: கடவுளின் மகன்
  rationale: உறவையும் பட்டத்தையும் எளிய, பொதுவாகப் புரியும் நவீனத் தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: Ἰησοῦν Χριστόν என்பதன் வடிவாக்கம்
  choice: இயேசுவாகிய மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός என்பதை வெறும் பெயரின் பகுதியாக மாற்றாமல் பட்டமாக வெளிப்படுத்துகிறது; அதேவேளை இயேசுவே அந்த மெசியா என்ற அடையாள அறிக்கையைப் பாதுகாக்கிறது.
- issue: விசுவாச அறிக்கையின் இலக்கண உறவு
  choice: இயேசுவாகிய மெசியா கடவுளின் மகன் என்று நான் நம்புகிறேன்
  alternative: கடவுளின் மகன் இயேசுவாகிய மெசியா என்று நான் நம்புகிறேன்
  rationale: இரண்டு வரையறுக்கப்பட்ட அடையாளங்களையும் இணைக்கும் கிரேக்க சமன்பாட்டு அமைப்பை இயல்பான தமிழில் தருகிறது; எது இலக்கணப் பொருள், எது பயனிலை என்ற கேள்வியில் தேவையற்ற கோட்பாட்டு முடிவைச் சுமத்தவில்லை.
translation_notes:
  register: மரியாதையான உரையாடலைக் காட்ட ‘நீங்கள்’ பயன்படுத்தப்பட்டுள்ளது. நடை நவீனமும் பொதுமக்களுக்கு எளிதில் புரியக்கூடியதுமாக இருக்கிறது; அதேவேளை ‘மெசியா’, ‘கடவுளின் மகன்’ ஆகிய வேதாகமப் பட்டங்களின் செறிவு பாதுகாக்கப்பட்டுள்ளது.
