  text: εἰς γὰρ χολὴν πικρίας καὶ σύνδεσμον ἀδικίας ὁρῶ σε ὄντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: ta
  text: ஏனெனில், நீ கசப்பின் பித்தத்தில்[a] இருப்பதையும் அநீதியின் பிணைப்பில்[b] இருப்பதையும் நான் காண்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கசப்பின் பித்தம்’ என்பது நஞ்சூட்டும் கசப்பைக் குறிக்கும் பழைய ஏற்பாட்டு மொழியை நினைவூட்டும் வலிமையான உருவகம் (உபாகமம் 29:18-ஐ ஒப்பிடுக; எழுபதின்மர் மொழிபெயர்ப்பு).
    reason: cross_reference
  - marker: b
    text: அல்லது ‘அநீதியின் சங்கிலி’ அல்லது ‘தீமையின் தளை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς
  choice: இல்
  rationale: ὁρῶ σε ὄντα என்பதுடன் வரும் இச்சொல், இங்கு சென்றடையும் திசையைக் காட்டாமல் சீமோன் இருக்கும் நிலையை அல்லது சூழ்நிலையைச் சுட்டுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கண்டிப்பிற்கான காரணத்தை γάρ அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதன் தொடர்பைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: χολὴν πικρίας
  choice: கசப்பின் பித்து
  rationale: χολή என்பதன் ‘பித்து’ என்ற உயிரோட்டமான உருவகத்தையும் πικρίας என்பதன் உரிச்சொல் சார்ந்த உறவையும் தக்கவைக்கிறது; இதை வெறும் ‘கசப்பு’ என்று பொருள்விரித்து மழுங்கடிக்கவில்லை.
- source_word: σύνδεσμον ἀδικίας
  choice: அநீதியின் பிணைப்பு
  rationale: σύνδεσμος கட்டிவைக்கும் பிணைப்பைக் குறிக்கிறது; ἀδικία இங்கு ஒழுக்கரீதியான அநீதியையும் தீமையையும் உள்ளடக்குவதால், பரந்த பொருளுடைய ‘அநீதி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ὁρῶ
  choice: நான் காண்கிறேன்
  rationale: இது நேரடியான பார்வையை மட்டுமல்ல, ஒருவரின் நிலையை உணர்ந்து அறிவதையும் இயல்பாக வெளிப்படுத்த முடியும்.
- source_word: σε ὄντα
  choice: நீ ... இருப்பதை
  rationale: வினைமுற்றா வினையெச்சத்துடன் அமைந்த கிரேக்கத் தொடரை, பொருளை மாற்றாமல் இயல்பான நவீன தமிழில் உள்ளடக்க வாக்கியமாக வழங்குகிறது.
theological_decisions:
- issue: சீமோனின் ஒழுக்க மற்றும் ஆன்மிக நிலையை விவரிக்கும் உருவகங்கள்
  choice: ‘கசப்பின் பித்து’, ‘அநீதியின் பிணைப்பு’ என்ற இரு செறிவான உருவகங்களும் தக்கவைக்கப்பட்டன.
  alternative: ‘கசப்பான நஞ்சால் நிறைந்தவன்’, ‘பாவத்திற்கு அடிமையானவன்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க உரை வெளிப்படையான கோட்பாட்டு விளக்கத்தை அளிக்காமல் உருவகங்களால் சீமோனின் தற்போதைய நிலையை விவரிக்கிறது. அவற்றைத் தக்கவைப்பது உரையின் கடுமையையும் பொருள் விரிவையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. மூலத்தின் இணையான இரு உருவகங்களையும் தெளிவுபடுத்துவதற்காக ‘இருப்பதை’ இருமுறை வழங்கப்பட்டுள்ளது; ‘கட்டு’ என்பது ‘கட்டில்’ எனத் தவறாக வாசிக்கப்பட வாய்ப்புள்ளதால் ‘பிணைப்பு’ பயன்படுத்தப்பட்டது.
