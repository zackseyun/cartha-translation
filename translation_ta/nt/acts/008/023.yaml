  rationale: ‘பித்து’ என்பதை ‘பித்தம்’ என மாற்றியதால் χολή-யின் ‘gall/bile’ என்ற நேரடியான உருவகம் பாதுகாக்கப்படுகிறது; அதேவேளை, மூலத்தின் செறிவான மற்றும் ஓரளவு கடினமான உருவக மொழி விளக்கமாக மாற்றப்படவில்லை. வேற்றுமை உருபும் ‘பித்தத்தில்’ எனச் சரிசெய்யப்பட்டுள்ளது. பிற சொற்களும் அடிக்குறிப்பு இடங்களும் தக்கவைக்கப்பட்டுள்ளன.
