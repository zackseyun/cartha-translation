id: ACT.8.16
reference: Acts 8:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: ta
  text: ஏனெனில், அவர்களில் ஒருவர்மீதும் அவர் இன்னும் வந்திறங்கியிருக்கவில்லை[a]; அவர்கள் ஆண்டவராகிய இயேசுவின் பெயரில்[b] மட்டுமே திருமுழுக்கு பெற்றிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: “அவர்களில் ஒருவர்மீதும் அவர் இன்னும் விழுந்திருக்கவில்லை.” இங்கு “அவர்” என்பது முந்தைய வசனத்தில் சொல்லப்பட்ட பரிசுத்த ஆவியானவரைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'நேரடியாக: “ஆண்டவராகிய இயேசுவின் பெயருக்குள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: இன்னும் … இல்லை
  rationale: குறிப்பிட்ட அந்த நேரம்வரை நிகழ்வு நடைபெறவில்லை என்பதைக் காட்டும் இயல்பான நவீனத் தமிழ் அமைப்பு.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: அவர்களில் ஒருவர்மீதும்
  rationale: ἐπί என்பதிலுள்ள ‘மேல்/மீது’ என்ற இடவியல் உருவகத்தைத் தக்கவைத்தும் தமிழில் தெளிவாகவும் உள்ளது.
- source_word: ἐπιπεπτωκός
  choice: வந்திறங்கியிருக்கவில்லை
  rationale: பரிசுத்த ஆவியானவர் மக்கள்மீது வருவதைக் குறிக்கும் அப்போஸ்தலர் நடபடிகளின் உருவகத்தை இயல்பான தமிழில் தருகிறது; கிரேக்க நிறைநிலை வடிவத்தின் விளைவுநிலையையும் ‘இருக்கவில்லை’ உணர்த்துகிறது.
- source_word: μόνον
  choice: மட்டுமே
  rationale: திருமுழுக்கு நடந்திருந்தாலும் ஆவியானவர் இன்னும் வந்திறங்கவில்லை என்ற வரம்பையும் முரண்பாட்டையும் தெளிவாக்குகிறது.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: திருமுழுக்கு பெற்றிருந்தார்கள்
  rationale: முன்பே நிறைவேறிய செயலும் அதன் தொடரும் நிலையையும் காட்டும் சுற்றுவழி நிறைநிலை அமைப்புக்கு இயல்பான தமிழ் இணை.
- source_word: εἰς τὸ ὄνομα
  choice: பெயரில்
  rationale: திருமுழுக்குச் சூழலில் இயல்பாகப் புரியும் தமிழ் வழக்கு; εἰς என்பதன் நேரடியான ‘பெயருக்குள்’ என்ற வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κυρίου Ἰησοῦ
  choice: ஆண்டவராகிய இயேசு
  rationale: κύριος என்ற பட்டத்தை ‘ஆண்டவர்’ எனத் தருகிறது; தமிழ் இலக்கண ஓட்டத்திற்காக ‘ஆகிய’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘வந்திறங்கியிருக்கவில்லை’ என்பதன் மறைமுக எழுவாய்
  choice: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பரிசுத்த ஆவியானவரைக் குறிக்கும் ‘அவர்’ பயன்படுத்தப்பட்டது.
  alternative: எழுவாயை வெளிப்படையாக ‘பரிசுத்த ஆவியானவர்’ என்று மீண்டும் குறிப்பிடுதல்.
  rationale: கிரேக்கத்தில் எழுவாய் மீண்டும் சொல்லப்படாமல் சூழலிலிருந்து அறியப்படுகிறது. தமிழிலும் ‘அவர்’ எனக் குறிப்பிடுவது அந்தச் சூழல் சார்பையும் தனிப்பட்ட குறிப்பையும் காக்கிறது; வசனத்தில் இல்லாத மறுபெயரிடலைத் தவிர்க்கிறது.
- issue: திருமுழுக்கும் இயேசுவின் பெயரும் இடையிலான தொடர்பு
  choice: ‘ஆண்டவராகிய இயேசுவின் பெயரில்’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆண்டவராகிய இயேசுவின் பெயருக்குள்’ என்ற நேரடியான வடிவம்.
  rationale: இவ்வசனம் பின்னாளைய திருமுழுக்கு வாய்பாட்டையோ திருவருட்சாதனக் கோட்பாட்டையோ தீர்மானிப்பதாக மொழிபெயர்க்கப்படவில்லை. கிரேக்க முன்னிடைச்சொல்லின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வந்திறங்குதல்’ இயல்பான தமிழ் சொல்லாட்சியையும் மூலத்தின் இடவியல் உருவகத்தையும் இணைக்கிறது; ‘பெயரில்’ வாசிப்பின் இயல்பை காக்க, ‘பெயருக்குள்’ அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
