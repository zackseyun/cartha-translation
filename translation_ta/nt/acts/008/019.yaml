  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: ta
  text: “இந்த அதிகாரத்தை எனக்கும் கொடுங்கள்; நான் யார்மேல் கைகளை வைத்தாலும், அவர் பரிசுத்த ஆவியைப் பெறும் வகையில்” என்று சொன்னான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதிகாரம்’ என்பதற்கு ‘வல்லமை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் (exousia) ஒப்படைக்கப்பட்ட அதிகாரம், உரிமை அல்லது செயல்படும் வல்லமை ஆகியவற்றைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: என்று சொன்னான்
  rationale: நிகழ்காலப் பெயரெச்சம் சீமோனின் நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. தமிழ்க் கதைநடையில் வாக்கிய முடிவில் ‘என்று சொன்னான்’ என்பது இயல்பாக இருந்து, முந்தைய வசனத்துடனான தொடர்ச்சியையும் காக்கிறது.
- source_word: Δότε
  choice: கொடுங்கள்
  rationale: δίδωμι என்பதன் இறந்தகால ஏவல் பன்மை வடிவம். பேதுருவையும் யோவானையும் நோக்கிய பன்மை வேண்டுகோளை மரியாதையுடன் தெளிவாகக் காட்டுகிறது.
- source_word: κἀμοί
  choice: எனக்கும்
  rationale: καί + ἐμοί என்ற இணைவு, சீமோன் தன்னையும் இதில் சேர்த்துக்கொள்ள விரும்பியதை வலியுறுத்துகிறது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: ἐξουσία என்பது செயல்படுவதற்கான அதிகாரம், உரிமை அல்லது ஒப்படைக்கப்பட்ட வல்லமையைக் குறிக்கலாம். δύναμις போன்ற நேரடியாக வல்லமையைக் குறிக்கும் சொற்களிலிருந்து உள்ள வேறுபாட்டைக் காக்க ‘அதிகாரம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ταύτην
  choice: இந்த
  rationale: சீமோன் சற்றுமுன் கண்ட குறிப்பிட்ட அதிகாரத்தைச் சுட்டுகிறது.
- source_word: ἵνα
  choice: பெற்றுக்கொள்ளும்படி
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ᾧ ἐὰν
  choice: யார்மேல் … அவர்
  rationale: ἐάν உடன் வரும் தொடர்புப்பெயர் வரையறையற்ற பொதுநிலையைத் தெரிவிக்கிறது. தமிழ் இணைநிலை அமைப்பான ‘யார்மேல் … அவர்’ இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: நான் … கைகளை வைக்கிறேனோ
  rationale: கைகளை வைத்தல் என்ற மூலமொழியின் தெளிவான செயற்படிமத்தைப் பாதுகாக்கிறது. கிரேக்கத்தில் உடைமைப்பெயர் இல்லாததால் தமிழிலும் தேவையற்ற ‘என்’ சேர்க்கப்படவில்லை.
- source_word: λαμβάνῃ
  choice: பெற்றுக்கொள்ளும்படி
  rationale: ἵνα கீழுள்ள நிகழ்கால விருப்பவினையின் நோக்கம் அல்லது விளைவு இயல்பான தமிழில் இவ்வாறு தரப்படுகிறது.
- source_word: πνεῦμα ἅγιον
  choice: பரிசுத்த ஆவியை
  rationale: கிரேக்கத்தில் சுட்டுரை இல்லாவிட்டாலும், அப்போஸ்தலர் நடபடிகளின் சூழலில் இது கடவுளின் பரிசுத்த ஆவியையே குறிக்கிறது. தமிழ் வேற்றுமை உருபுடன் குறிப்பிட்ட அந்த நபரைக் குறிக்கும் இயல்பான வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: சுட்டுரை இல்லாத πνεῦμα ἅγιον என்பதை வரையறையற்ற ‘ஒரு பரிசுத்த ஆவி’ என்று மொழிபெயர்க்க வேண்டுமா
  choice: பரிசுத்த ஆவியை
  alternative: ஒரு பரிசுத்த ஆவியை
  rationale: அப்போஸ்தலர் நடபடிகளின் உடனடிச் சூழல் கடவுளின் பரிசுத்த ஆவியையே குறிக்கிறது. ‘ஒரு பரிசுத்த ஆவி’ என்பது சூழல் ஆதரிக்காத வேறொரு பொருளைத் தோற்றுவிக்கும்.
- issue: சீமோன் கேட்ட ἐξουσίαவை ‘அதிகாரம்’ அல்லது ‘வல்லமை’ என்று மொழிபெயர்ப்பது
  choice: அதிகாரம்
  alternative: வல்லமை
  rationale: சொல் அதிகாரம், உரிமை, செயல்படும் ஆற்றல் ஆகிய பொருட்பரப்பைக் கொண்டது. சூழலில் செயல்வல்லமை உள்ளடங்கினாலும், ἐξουσίαவுக்கும் δύναμις போன்ற சொற்களுக்கும் உள்ள சொல்வேறுபாட்டை ‘அதிகாரம்’ சிறப்பாகக் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. நேரடிப் பேச்சின் தமிழ் இயல்புக்கேற்ப λέγων வாக்கிய முடிவில் தரப்பட்டது. ‘கைகளை வைக்கிறேனோ’ என்ற மொழிநடை மூலத்தின் செயல்படிமத்தைப் பாதுகாக்கிறது.
