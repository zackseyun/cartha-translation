source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: ta
  text: அப்போது பிலிப்பு வாய்திறந்து, இந்த வேதவசனத்திலிருந்து தொடங்கி, அவருக்கு இயேசுவைப் பற்றிய நற்செய்தியை அறிவித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் நேரடியாக, ‘அவருக்கு இயேசுவை நற்செய்தியாக அறிவித்தார்’; அதாவது, இயேசுவைப் பற்றிய நற்செய்தியை அறிவித்தார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: பேசத் தொடங்கி
  rationale: இது ஒருவர் பேச ஆரம்பிப்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடர். சொல்லுக்குச் சொல் மொழிபெயர்க்கும் ‘தன் வாயைத் திறந்து’ என்பதைக் காட்டிலும், அதன் பொருளை இயல்பான நவீனத் தமிழில் இத்தேர்வு தெளிவாக வழங்குகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு δέ கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘அப்போது’ என்பது தேவையற்ற எதிர்மறைத் தொடர்பைச் சேர்க்காமல் அந்த நகர்வை இயல்பாகக் காட்டுகிறது.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: இந்த வேதவசனத்திலிருந்து ஆரம்பித்து
  rationale: ἀπό குறிக்கும் தொடக்கப் புள்ளியை ‘-இலிருந்து’ நேரடியாகக் காட்டுகிறது. சூழலில் வாசிக்கப்பட்ட குறிப்பிட்ட வேதப்பகுதியைக் குறிப்பதால் ‘வேதவசனம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: γραφῆς
  choice: வேதவசனம்
  rationale: புதிய ஏற்பாட்டுப் பயன்பாட்டில் γραφή புனித வேத எழுத்தைக் குறிக்கிறது; இச்சூழலில் மேற்கோள் காட்டப்பட்டுள்ள குறிப்பிட்ட பகுதியை ‘வேதவசனம்’ தெளிவாகச் சுட்டுகிறது.
- source_word: εὐηγγελίσατο
  choice: நற்செய்தியை அறிவித்தார்
  rationale: இந்த வினை நற்செய்தியை அறிவித்தல் அல்லது பிரகடனம் செய்தல் என்பதைக் குறிக்கிறது. ‘அறிவித்தார்’ என்பது நிறுவனமயமான அல்லது மேடைப்பேச்சு சார்ந்த நிழற்பொருளைச் சேர்க்காமல் எளிய நவீனத் தமிழில் அதன் செயற்பாட்டை வழங்குகிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: முந்தைய சூழலில் உள்ள எத்தியோப்பிய அதிகாரியையே பதிலிப்பெயர் குறிக்கிறது. கிரேக்கத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் மரியாதையான தமிழ்ப் பதிலிப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸν Ἰησοῦν
  choice: இயேசுவைப் பற்றிய
  rationale: εὐαγγελίζομαι என்பதோடு வரும் வேற்றுமை வடிவம் அறிவிக்கப்படும் நற்செய்தியின் உள்ளடக்கமாக இயேசுவைக் காட்டுகிறது. இயல்பான தமிழில் இந்த உறவை ‘இயேசுவைப் பற்றிய நற்செய்தி’ என்று தெளிவுபடுத்துகிறது; கிரேக்கத்தின் சுருக்கமான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν என்பதன் பொருள்
  choice: இயேசுவைப் பற்றிய நற்செய்தியை அவருக்கு அறிவித்தார்
  alternative: இயேசுவை அவருக்கு நற்செய்தியாக அறிவித்தார் / இயேசுவை அவருக்குப் பிரசங்கித்தார்
  rationale: கிரேக்க அமைப்பு இயேசுவையே நற்செய்தி அறிவிப்பின் உள்ளடக்கமும் மையமும் ஆக்குகிறது. தேர்ந்த மொழிபெயர்ப்பு இதை இயல்பான தமிழில் தெளிவாகத் தெரிவிக்கிறது; இயேசுவை வெறும் செய்தியிலிருந்து பிரிக்கவோ கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்க மரபுத்தொடர் இயல்பான தமிழாக்கமாக வழங்கப்பட்டாலும், இறுதிக் கிரேக்கத் தொடரின் செறிவான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
