  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: ta
  text: அவர்கள் அங்கு இறங்கி வந்தபின்[a][b], சமாரியர்கள் பரிசுத்த ஆவியைப் பெறும்படி அவர்களுக்காக ஜெபித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்கள் அங்கு இறங்கி வந்தபோது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'முந்தைய மொழிபெயர்ப்பு: “அவர்கள் அங்கு இறங்கி வந்தபின் ஜெபித்தார்கள்.”'
    reason: previous_rendering
lexical_decisions:
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பேதுருவையும் யோவானையும் சுட்டும் தொடர்புப்பெயர். தமிழில் வாக்கியத் தொடர்ச்சிக்கேற்ற இயல்பான வடிவம்.
- source_word: καταβάντες
  choice: அங்கே இறங்கிச் சென்று
  rationale: இறங்கி வந்ததைத் தொடர்ந்து வேண்டிக்கொண்டார்கள் என்ற செயல்களின் வரிசையை இயல்பான தமிழ் தொடர் வினையெச்சம் வெளிப்படுத்துகிறது. ‘அங்கே’ என்பது இலக்கைத் தெளிவாக்கும் சூழல்சார் சேர்க்கை; கிரேக்கச் சொல்லில் அது வெளிப்படையாக இல்லை.
- source_word: προσηύξαντο
  choice: வேண்டிக்கொண்டார்கள்
  rationale: προσεύχομαι என்பதன் பொருளை நவீன, மரியாதையான தமிழில் இயல்பாகத் தருகிறது.
- source_word: περὶ αὐτῶν
  choice: அவர்களுக்காக
  rationale: இங்கு பிறர் சார்பாகச் செய்யப்படும் பரிந்துரை வேண்டுதலைக் குறிக்கிறது.
- source_word: ὅπως
  choice: பெற்றுக்கொள்ளும்படி
  rationale: வேண்டுதலின் நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: λάβωσιν
  choice: பெற்றுக்கொள்ள
  rationale: ὅπως உடன் வரும் இறந்தகாலத் தற்சார்பு வினையின் நோக்கப் பொருளைத் தமிழில் பொருத்தமாக வெளிப்படுத்துகிறது; தேவையற்ற ஐயப்பாட்டைச் சேர்க்கவில்லை.
- source_word: πνεῦμα ἅγιον
  choice: பரிசுத்த ஆவியை
  rationale: அப்போஸ்தலர் நடபடிகளின் இச்சூழலில் வாக்குத்தத்தம் செய்யப்பட்ட தெய்வீக ஆவியைக் குறிக்கிறது; தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் தெளிவாக அறியப்படும் பெயர்ப்பு.
theological_decisions:
- issue: πνεῦμα ἅγιον என்பது பொதுவான ஒரு பரிசுத்த ஆவியையா அல்லது தெய்வீகப் பரிசுத்த ஆவியையா குறிக்கிறது?
  choice: பரிசுத்த ஆவியை
  alternative: ஒரு பரிசுத்த ஆவியை
  rationale: அப்போஸ்தலர் நடபடிகளின் கதைச்சூழலில் இது விசுவாசிகளுக்குக் கொடுக்கப்படும் வாக்குத்தத்தமான தெய்வீக ஆவியைக் குறிக்கிறது. உரையில் இல்லாத மேலதிக கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அந்தக் குறிப்பிட்ட பொருளைத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்த மக்கள்’ என்பது ஒரே வாக்கியத்தில் வரும் இரு வேறு பன்மைச் சுட்டுகளின் குழப்பத்தைத் தவிர்த்து, முந்தைய வசனத்தில் உள்ள சமாரியர்களைச் சுட்டுகிறது. ‘இறங்கிச் சென்று’ என்பது கிரேக்க இறந்தகால வினையெச்சத்தின் முன்நிகழ்வையும் செயல்களின் வரிசையையும் சீரான தமிழில் தக்கவைக்கிறது.
