revisions:
- from: அவர்கள் அங்கே இறங்கிச் சென்று[a][b], அந்த மக்கள் பரிசுத்த ஆவியைப் பெற்றுக்கொள்ளும்படி அவர்களுக்காக வேண்டிக்கொண்டார்கள்.
  to: அவர்கள் அங்கு இறங்கி வந்தபின்[a][b], சமாரியர்கள் பரிசுத்த ஆவியைப் பெறும்படி அவர்களுக்காக ஜெபித்தார்கள்.
  rationale: The revision renders καταβάντες as the single prior action “இறங்கி வந்தபின்,” preserves the purposive force of ὅπως with “பெறும்படி,” and identifies the antecedent of αὐτῶν as the Samaritans for natural Tamil clarity. The footnotes have been updated to match the corrected wording and remain anchored to the participial phrase.
