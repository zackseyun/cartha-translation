  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: ta
  text: ஆனால் சவுல் திருச்சபையைப் பாழாக்கிக்கொண்டிருந்தான்[a]. அவன் வீடு வீடாக[b] நுழைந்து, ஆண்களையும் பெண்களையும் இழுத்துச் சென்று, சிறையில் அடைக்க ஒப்படைத்துவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திருச்சபையை அழித்துக்கொண்டிருந்தான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வீடுதோறும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் பல வீடுகளுக்குள் ஒன்றன்பின் ஒன்றாக நுழைந்ததை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: பாழாக்கிக்கொண்டிருந்தான்
  rationale: வன்முறையால் கடுமையாகச் சீரழித்தல் என்ற வினையின் வலிமையையும், நிறைவுறா இறந்தகாலம் காட்டும் தொடர்ச்சியான செயலையும் இது வெளிப்படுத்துகிறது; பொதுவான ‘துன்புறுத்தினான்’ என்பதைவிட மூலத்தின் தீவிரம் இதில் தெளிவாக உள்ளது.
- source_word: ἐκκλησίαν
  choice: திருச்சபையை
  rationale: இங்கு குடிமக்கள் கூட்டத்தை அல்ல, இயேசுவில் நம்பிக்கை கொண்ட சமூகத்தைச் சுட்டுவதால், நவீனத் தமிழில் பரவலாக அறியப்படும் ‘திருச்சபை’ பொருத்தமானது.
- source_word: κατὰ τοὺς οἴκους
  choice: வீடு வீடாக
  rationale: κατά + பன்மை தரும் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தெரிவித்து, சவுல் பல வீடுகளுக்குள் தொடர்ந்து சென்றதை வலியுறுத்துகிறது.
- source_word: εἰσπορευόμενος
  choice: நுழைந்து
  rationale: சவுல் திருச்சபையைப் பாழாக்கிய விதத்தைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: σύρων
  choice: இழுத்துச் சென்று
  rationale: σύρω குறிக்கும் வலுக்கட்டாயமாக இழுத்துச் செல்லும் செயலைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: ஆண்களையும் பெண்களையும்
  rationale: பாலின வேறுபாடின்றி இரு தரப்பினரும் குறிவைக்கப்பட்டதை ‘-யும் ... -யும்’ அமைப்பு இயல்பாக வலியுறுத்துகிறது.
- source_word: παρεδίδου
  choice: ஒப்படைத்துவந்தான்
  rationale: அதிகாரக் காவலுக்கு ஒப்படைத்தல் என்ற பொருளையும், நிறைவுறா இறந்தகாலம் உணர்த்தும் மீண்டும் மீண்டும் நிகழ்ந்த செயலையும் பாதுகாக்கிறது.
- source_word: εἰς φυλακήν
  choice: சிறையில் அடைக்க
  rationale: சிறைக் காவலுக்குள் அனுப்பப்படுதல் என்ற இலக்கை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: மனமாற்றத்திற்கு முந்தைய சவுலின் செயல்களின் தீவிரத்தை மொழிபெயர்த்தல்
  choice: ‘திருச்சபையைப் பாழாக்கிக்கொண்டிருந்தான்’ என்ற வலிமையான சொல்லாட்சியைப் பயன்படுத்துதல்
  alternative: ‘திருச்சபையைத் துன்புறுத்திக்கொண்டிருந்தான்’
  rationale: மூல வினை வன்முறையான, தொடர்ச்சியான சீரழிப்பைக் குறிக்கிறது. இந்த வலிமையைப் பாதுகாப்பது வசனத்தின் பதற்றத்தைத் தணிக்காமல் தருகிறது; அதேவேளையில் பிற்கால சவுல்/பவுலைப் பற்றிய எந்தக் கோட்பாட்டு விளக்கத்தையும் உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாழாக்கிக்கொண்டிருந்தான்’ மற்றும் ‘ஒப்படைத்துவந்தான்’ ஆகிய வடிவங்கள் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் காட்டுகின்றன; ‘வீடு வீடாக’ என்பது பேசுபெயர்ச்சி இல்லாமல் இயல்பான பகிர்ந்தளிப்பு நடையைத் தருகிறது.
