id: ACT.8.33
reference: Acts 8:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: ta
  text: அவர் தாழ்த்தப்பட்டபோது, அவருக்கு நீதி மறுக்கப்பட்டது.[a] அவருடைய தலைமுறையை யார் எடுத்துரைப்பார்?[b] ஏனெனில், அவருடைய உயிர் பூமியிலிருந்து எடுத்துக்கொள்ளப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்கான தீர்ப்பு அகற்றப்பட்டது.”
    reason: lexical_alternative
  - marker: b
    text: ‘தலைமுறை’ என்பதற்கான கிரேக்கச் சொல் இங்கு “சந்ததியினர்” அல்லது “சமகாலத்தவர்” என்றும் பொருள்படலாம்; ஏசாயா 53 மேற்கோளிலுள்ள தெளிவின்மை முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ταπεινώσει
  choice: தாழ்த்தப்பட்டபோது
  rationale: இச்சொல் தாழ்வுக்கும் அவமானப்படுத்தப்பட்ட நிலைக்கும் இடமளிக்கிறது. வினைமயமான இத்தமிழ் வடிவம் இயல்பாகவும், அவர் அனுபவித்த சிறுமைப்படுத்துதலைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: κρίσις
  choice: நீதி
  rationale: இங்கு நியாயமான விசாரணையோ நீதியான தீர்ப்போ அவருக்கு மறுக்கப்பட்டதைக் குறிக்கிறது. ‘நீதி’ என்பது சட்டம் மற்றும் நியாயம் ஆகிய இரு பரிமாணங்களையும் இயல்பாக வெளிப்படுத்துகிறது; ‘தீர்ப்பு’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἤρθη
  choice: மறுக்கப்பட்டது
  rationale: αἴρω என்பதன் செயலற்ற வடிவம் அகற்றப்படுதல் அல்லது கிடைக்காமல் பறிக்கப்படுதல் என்ற கருத்தைத் தருகிறது. நீதியைப் பற்றிய இச்சூழலில் ‘மறுக்கப்பட்டது’ என்பது தமிழில் இயல்பாக அந்த இழப்பைத் தெரிவிக்கிறது.
- source_word: γενεὰν
  choice: தலைமுறையை
  rationale: ‘தலைமுறை’ என்பது சந்ததியினர், சமகாலத்தவர் ஆகிய சாத்தியங்களை முற்றிலும் முடிவுசெய்யாமல் கிரேக்கச் சொல்லின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
- source_word: διηγήσεται
  choice: எடுத்துரைப்பார்
  rationale: விரிவாகச் சொல்லுதல் அல்லது விவரித்துரைத்தல் என்ற வினையின் பொருளைச் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: αἴρεται
  choice: எடுத்துக்கொள்ளப்படுகிறது
  rationale: நிகழ்காலச் செயலற்ற வடிவத்தின் உயிரோட்டத்தையும், பூமியிலிருந்து உயிர் அகற்றப்படுவதையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: γῆς
  choice: பூமி
  rationale: இச்சூழலில் உலக வாழ்விலிருந்து அகற்றப்படுதல் என்ற பொருளுக்கு ‘பூமி’ இயல்பான இணையாகும்.
- source_word: ζωὴ
  choice: உயிர்
  rationale: ஏசாயா மேற்கோளின் மரணச் சூழலில் உடல் உயிரைக் குறிக்கும் நேரடியான, இயல்பான தமிழ்ச் சொல்.
theological_decisions:
- issue: ‘அவருடைய தலைமுறை’ என்பதன் பொருள்
  choice: தெளிவுபடுத்தாமல் ‘அவருடைய தலைமுறை’ என்று முதன்மை உரையில் வைத்தல்
  alternative: ‘அவருடைய சந்ததியினர்’ அல்லது ‘அவருடைய சமகாலத்தவர்’
  rationale: ஏசாயா 53 மேற்கோளிலுள்ள இச்சொற்றொடர் பலவகையாகப் புரிந்துகொள்ளக்கூடியது. ஒரே விளக்கத்தைத் திணிக்காமல் கிரேக்கத்தின் உண்மையான தெளிவின்மையை முதன்மை உரை பாதுகாக்கிறது.
- issue: κρίσις என்பதன் பொருள்
  choice: ‘நீதி’ என்று மொழிபெயர்த்தல்
  alternative: ‘தீர்ப்பு’
  rationale: இச்சூழலில் அவர் நியாயமாக நடத்தப்படுவதற்கான நீதி பறிக்கப்பட்டதை ‘நீதி’ தெளிவாக உணர்த்துகிறது. இருப்பினும், சட்டத் தீர்ப்பு என்ற நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம மேற்கோளுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் சட்டப் பொருளும் ‘தலைமுறை’ என்ற சொல்லின் விளக்கத் திறந்தநிலையும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
