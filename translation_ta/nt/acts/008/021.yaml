id: ACT.8.21
reference: Acts 8:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: ta
  text: இந்தக் காரியத்தில் உனக்குப் பங்கும் இல்லை, உரிமையும் இல்லை; ஏனெனில் உன் இதயம் கடவுளுக்கு முன்பாக நேர்மையாக இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς
  choice: பங்கு
  rationale: ஒரு காரியத்தில் ஒருவருக்குள்ள பங்கேற்பையோ பங்கையோ இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: κλῆρος
  choice: உரிமை
  rationale: சீட்டுப்பங்கு அல்லது ஒதுக்கப்பட்ட பங்கு என்ற அடிப்படைப் படிமம் இங்கு ஒருவர் பெற்றுக்கொள்ளும் உரிமை/பங்கைக் குறிக்கிறது; μερίς என்பதுடன் வரும் இணைச்சொல் வலியுறுத்தலைத் தமிழில் தெளிவாக வேறுபடுத்துகிறது.
- source_word: λόγῳ τούτῳ
  choice: இந்தக் காரியத்தில்
  rationale: λόγος இங்கு வெறும் பேச்சையல்ல, சூழலில் பேசப்பட்ட விஷயம் அல்லது காரியத்தைக் குறிக்கிறது.
- source_word: εὐθεῖα
  choice: நேர்மையாக
  rationale: இதயம் கடவுளுக்கு முன் சரியான அல்லது செம்மையான நிலையில் இல்லாததைக் குறிக்கும் உருவகத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἔναντι τοῦ θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: தெய்வீக மதிப்பீட்டின் முன்னிலையில் என்பதைக் கூறும் மூலமொழியின் நீதிமன்ற/உறவு நிழலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: μερὶς ... κλῆρος என்ற இணைச்சொல்லின் பொருள்
  choice: பங்கும் இல்லை, உரிமையும் இல்லை
  alternative: பங்கும் இல்லை, பங்குரிமையும் இல்லை
  rationale: இரண்டு கிரேக்கச் சொற்களின் வலியுறுத்தும் இணைப்பைப் பாதுகாத்து, ஒரே கருத்தைத் தேவையற்ற முறையில் இருமுறை சொல்லாமல் இயல்பான தமிழில் வழங்குகிறது.
- issue: இதயத்தின் நிலை
  choice: உன் இதயம் கடவுளுக்கு முன்பாக நேர்மையாக இல்லை
  alternative: உன் இதயம் கடவுளின் பார்வையில் சரியாக இல்லை
  rationale: εὐθεῖα என்பதிலுள்ள ‘நேரான’ என்ற உருவகத்தையும் ἔναντι என்பதிலுள்ள ‘முன்பாக’ என்ற கருத்தையும் காக்கிறது; மனமாற்றம் அல்லது இரட்சிப்பு குறித்த கூடுதல் கோட்பாட்டு முடிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான கண்டனத்தின் வலிமையைத் தக்கவைத்துள்ள கண்ணியமான நடை. ‘கடவுள்’ என்பது பொதுவாகப் புரியும் சமயச் சார்பற்ற தேர்வு; தேவையற்ற பழமொழிநடை தவிர்க்கப்பட்டது.
