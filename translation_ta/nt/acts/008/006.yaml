revisions:
- from: பிலிப்பு சொன்னவற்றைக் கேட்டும், அவர் செய்துவந்த அடையாளங்களைக் கண்டும், மக்கள் கூட்டத்தினர் ஒருமனதாக[b] அவர் சொன்னவற்றைக் கூர்ந்து கவனித்தார்கள்.[a]
  to: பிலிப்பு சொன்னவற்றைக் கேட்டும், அவர் செய்துவந்த அடையாளங்களைக் கண்டும், கூடியிருந்த மக்கள் ஒருமனதாக[b] அவற்றைக் கூர்ந்து கவனித்தார்கள்.[a]
  rationale: The revision replaces the less idiomatic ‘மக்கள் கூட்டத்தினர்’ with ‘கூடியிருந்த மக்கள்’ and avoids unnecessary repetition by using ‘அவற்றை’ for Philip’s previously mentioned words. It preserves the source’s united response, the circumstantial hearing and seeing, and the ongoing nature of Philip’s signs. Footnote anchors and content remain structurally valid.
