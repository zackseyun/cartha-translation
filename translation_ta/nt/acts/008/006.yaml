  text: προσεῖχον ⸀δὲ οἱ ὄχλοι τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου ὁμοθυμαδὸν ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: ta
  text: பிலிப்பு சொன்னவற்றைக் கேட்டும், அவர் செய்துவந்த அடையாளங்களைக் கண்டும், கூடியிருந்த மக்கள் ஒருமனதாக[b] அவற்றைக் கூர்ந்து கவனித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘கவனமாகக் கேட்டார்கள்’ அல்லது ‘செவிகொடுத்தார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘ஒருமித்த மனதுடன்’; கிரேக்கச் சொல் அவர்களுடைய ஒன்றுபட்ட, பொதுவான எதிர்வினையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: கூர்ந்து கவனித்தார்கள்
  rationale: προσέχω என்பது கவனத்தை ஒன்றின்மேல் செலுத்தி அதைப் பற்றிக்கொள்வதைக் குறிக்கிறது. இறந்தகாலத் தொடர்ச்சியை உணர்த்தும் வினைவடிவத்தின் வலிமையை இயல்பான நவீனத் தமிழில் இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சி இணைப்பு. தமிழில் வாக்கிய அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துவதால், தனியாக ‘மேலும்’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது தேவையற்ற வலியுறுத்தலை உண்டாக்கும்.
- source_word: οἱ ὄχλοι
  choice: மக்கள் கூட்டத்தினர்
  rationale: ὄχλοι பன்மையில் கூடியிருந்த மக்கள் கூட்டங்களைக் குறிக்கிறது. ‘மக்கள் கூட்டத்தினர்’ என்பது பன்மைக் கூட்டுணர்வைத் தக்கவைத்து இயல்பாக உள்ளது.
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: பிலிப்பு சொன்னவற்றை
  rationale: செயப்பாட்டு வடிவத்தைத் தமிழில் இயல்பான செய்வினையாக மாற்றினாலும், பிலிப்பு பேசியவற்றின் உள்ளடக்கமே கவனத்தின் பொருள் என்பதைக் காக்கிறது; ‘செய்தி’ என்று விளக்கவுரை சேர்க்கப்படவில்லை.
- source_word: ὁμοθυμαδὸν
  choice: ஒருமனதாக
  rationale: இந்தச் சொல் வெறுமனே ஒரே இடத்தில் ‘ஒன்றாக’ இருந்ததை அல்ல, பகிரப்பட்ட ஒருமித்த மனப்பாங்கையும் எதிர்வினையையும் குறிக்கிறது.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: கேட்டும் ... கண்டும்
  rationale: ἐν τῷ + infinitive இங்கு சூழ்நிலை/காலத் தொடர்பைக் காட்டுகிறது. αὐτούς என்பது மக்கள் கூட்டத்தினரை முடிவிலி வினைகளின் எழுவாயாகக் குறிக்கிறது; ஆகவே ‘அவர்கள்’ என்ற பொருள் தமிழ் வினைத் தொடர்பில் வெளிப்படுகிறது, ‘அவரைக் கேட்டார்கள்’ என்ற மூலத்தில் இல்லாத செயப்படுபொருள் சேர்க்கப்படவில்லை.
- source_word: τὰ σημεῖα
  choice: அடையாளங்களை
  rationale: σημεῖα என்பதன் அடிப்படை வேதாகமப் பயன்பாட்டை ‘அடையாளங்கள்’ நேரடியாகக் காக்கிறது. ‘அற்புத அடையாளங்கள்’ என்று சேர்ப்பது விளக்கத்தை மொழிபெயர்ப்புக்குள் கொண்டுவரும்.
- source_word: ἃ ἐποίει
  choice: அவர் செய்துவந்த
  rationale: ἐποίει என்ற நிறைவுறா இறந்தகால வடிவம் தொடர்ந்து நடந்த செயலைக் காட்டுகிறது. ‘செய்துவந்த’ அந்தத் தொடர்ச்சியைச் சுருக்கமாகப் பாதுகாக்கிறது.
