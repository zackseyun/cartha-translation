translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பிலிப்பு சொன்னவற்றை’ என்பது தெளிவிற்காக இருமுறை வருகிறது; முதலாவது கேட்டதின் பொருளையும், இரண்டாவது கூர்ந்து கவனித்ததின் பொருளையும் விளக்கி, கிரேக்க வாக்கியத்தின் உறவுகளைத் தவறாக மாற்றாமல் காக்கிறது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களுக்கு உடனடியாக இணைக்கப்பட்டுள்ளன.
