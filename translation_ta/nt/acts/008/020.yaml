  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: ta
  text: ஆனால் பேதுரு அவனிடம், “உன் வெள்ளிப்பணம்[a] உன்னோடு சேர்ந்து அழியட்டும்! ஏனெனில், கடவுளின் கொடையைப் பணத்தால் பெற்றுக்கொள்ளலாம்[b] என்று நீ நினைத்தாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பணம்.” கிரேக்கத்தில் நேரடியாக “வெள்ளி” என்று உள்ளது; இச்சூழலில் அது பணத்தைக் குறிக்கும் பொதுவான வழக்காகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அடையலாம்” அல்லது “வாங்கலாம்.” கடவுளின் கொடையைப் பணம் செலுத்திப் பெறக்கூடிய ஒன்றாகச் சீமோன் கருதியதே இதன் கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: வெள்ளிக்காசு
  rationale: இச்சொல் நேரடியாக ‘வெள்ளி’ அல்லது ‘வெள்ளிப்பணம்’ என்பதைக் குறிக்கிறது. ‘வெள்ளிக்காசு’ என்பது மூலத்தின் konkreட் உருவகத்தைத் தக்கவைத்தபடியே, இங்கு பணத்தைக் குறிக்கிறது என்பதைத் தெளிவாக உணர்த்துகிறது.
- source_word: σὺν σοὶ
  choice: உன்னோடு
  rationale: சீமோனையும் அவனுடைய பணத்தையும் ஒரே அழிவுத் தீர்ப்போடு இணைக்கும் கிரேக்கத் தொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: εἴη εἰς ἀπώλειαν
  choice: அழிந்துபோகட்டும்
  rationale: εἴη என்ற விருப்பவினையின் கடுமையான சாபவாக்குத் தன்மையை ‘-ட்டும்’ வடிவம் வெளிப்படுத்துகிறது. ἀπώλεια குறிக்கும் அழிவு அல்லது நாசத்தைத் தக்கவைத்து, இறுதி நரகத் தண்டனை என்ற கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்க்கவில்லை.
- source_word: δωρεὰν
  choice: கொடை
  rationale: விலை கொடுத்து வாங்கப்படுவது அல்ல, கடவுள் அளிப்பது என்ற எதிர்மறை ஒப்புமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐνόμισας
  choice: நீ நினைத்தாய்
  rationale: பேதுருவின் நேரடியான கண்டிப்பை எளிய, நடப்புத் தமிழில் தருகிறது.
- source_word: διὰ χρημάτων
  choice: பணத்தால்
  rationale: διά + உரிமை வேற்றுமை இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது; ‘பணத்தால்’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: κτᾶσθαι
  choice: பெற்றுக்கொள்ளலாம்
  rationale: இவ்வினை பெறுதல் அல்லது அடைதல் என்ற பொருளுடையது. ‘வாங்கலாம்’ என மொழிபெயர்த்து வணிகப் பொருளை மிகைப்படுத்தாமல், பணமே அதைப் பெறும் வழி என்று சீமோன் கருதியதை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் சீமோன் கூறியதற்கு மாறான பேதுருவின் பதிலைச் சுட்டும் எதிர்மறைத் திருப்பத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பேதுரு சீமோனுக்கும் அவன் பணத்துக்கும் கூறிய வாக்கின் தன்மை
  choice: ‘உன் வெள்ளிக்காசு உன்னோடு அழிந்துபோகட்டும்’ என்ற அழிவை வேண்டிக் கூறும் கடுமையான சாபவாக்கு
  alternative: அழிவு நிச்சயமாக நிகழும் என்ற முன்னறிவிப்பு; அல்லது ‘நரகத்துக்குப் போ’ போன்ற இறுதித் தண்டனையைத் தெளிவாகக் கூறும் வாக்கு
  rationale: εἴη என்பது சாதாரண எதிர்கால அறிவிப்பாக இல்லாமல் விருப்பம் அல்லது சாபவாக்கை வெளிப்படுத்துகிறது. அதேவேளையில், ἀπώλεια இங்கு இறுதி நரகத் தீர்ப்பையே கட்டாயமாகக் குறிக்கிறது என்று உரை கூறாததால், அந்தக் கோட்பாட்டுப் பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவான வாசகர்களுக்கு உடனடியாகப் புரியும் வகையிலும் பேதுருவின் கண்டிப்பின் கடுமை குறையாத வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அழிந்துபோகட்டும்’ என்பது சாபவாக்கின் வலிமையைத் தக்கவைக்கிறது; ‘நரகத்துக்குப் போ’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத சமயவியல் விளக்கம் தவிர்க்கப்பட்டுள்ளது.
