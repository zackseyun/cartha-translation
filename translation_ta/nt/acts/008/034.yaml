id: ACT.8.34
reference: Acts 8:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ εὐνοῦχος τῷ Φιλίππῳ εἶπεν· Δέομαί σου, περὶ τίνος ὁ προφήτης λέγει ⸀τοῦτο; περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: ta
  text: 'அப்போது அந்த அண்ணகன் பிலிப்பிடம் பதிலளித்து, “தயவுசெய்து சொல்லுங்கள்[a]: தீர்க்கதரிசி இதை யாரைக் குறித்துச் சொல்கிறார்? தம்மைக் குறித்தா, வேறு ஒருவரைக் குறித்தா?” என்று கேட்டான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களை வேண்டிக்கொள்கிறேன்.” கிரேக்கச் சொற்றொடர் மரியாதையான வேண்டுகோளைக் குறிக்கிறது; அதில் அதிக வலியுறுத்தலும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: அப்போது ... என்று கேட்டான்
  rationale: ἀποκριθείς உடன் வரும் εἶπεν என்பது கதைநடையில் பதிலுரையை அறிமுகப்படுத்தும் வழக்குச் சொற்றொடர். தமிழில் ‘என்று கேட்டான்’ என்பது கேள்வியின் இயல்பையும் கதைநடையையும் இயல்பாக வெளிப்படுத்துகிறது; δέ-யின் தொடர்ச்சி உணர்வை ‘அப்போது’ தருகிறது.
- source_word: ὁ εὐνοῦχος
  choice: அந்த அண்ணகன்
  rationale: εὐνοῦχος என்பதன் குறிப்பான பொருளான உடலியல்/சமூக அடையாளத்தை ‘அதிகாரி’ என்று பொதுமைப்படுத்தாமல், நவீனத் தமிழில் பயன்படும் ‘அண்ணகன்’ மூலம் பாதுகாக்கிறது.
- source_word: τῷ Φιλίππῳ
  choice: பிலிப்பிடம்
  rationale: பேசப்படுபவரைக் குறிக்கும் தத்திவேற்றுமையைத் தமிழின் இயல்பான ‘-ிடம்’ வடிவம் வெளிப்படுத்துகிறது.
- source_word: Δέομαί σου
  choice: தயவுசெய்து சொல்லுங்கள்
  rationale: இது மரியாதையுடனான வேண்டுகோள். சொற்சொல்லான ‘உம்மை வேண்டிக்கொள்கிறேன்’ என்பதைவிட நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது; வேண்டுகோளின் வலிமையான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: περὶ τίνος
  choice: யாரைக் குறித்து
  rationale: περί + பிறப்புவேற்றுமை குறிக்கும் பொருள் அல்லது தொடர்பை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: ὁ προφήτης
  choice: தீர்க்கதரிசி
  rationale: குறிப்பிட்ட தீர்க்கதரிசியைச் சுட்டும் கிரேக்கச் சொல்லின் திட்டவட்டத்தன்மையைச் சூழலில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: λέγει τοῦτο
  choice: இதை ... சொல்கிறார்
  rationale: முன்பு வாசிக்கப்பட்ட மேற்கோளை τοῦτο சுட்டுகிறது; ‘இதைச் சொல்கிறார்’ என்பது நேரான நவீனத் தமிழ்.
- source_word: περὶ ἑαυτοῦ
  choice: தம்மைக் குறித்தா
  rationale: தீர்க்கதரிசியையே திரும்பச் சுட்டும் ἑαυτοῦ என்பதைக் கண்ணியமான தற்சுட்டுப் பெயரால் வெளிப்படுத்துகிறது.
- source_word: περὶ ἑτέρου τινός
  choice: வேறு யாரையாவது குறித்தா
  rationale: ἑτέρου τινός என்பதிலுள்ள ‘வேறொருவர்’ என்ற திறந்த, உறுதியற்ற குறிப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
