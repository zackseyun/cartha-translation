translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அண்ணகன்’ என்பது εὐνοῦχος என்ற குறிப்பான அடையாளத்தைப் பாதுகாக்கிறது. நேரடி உரையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
