revisions:
- from: அப்போது அந்த அண்ணகன் பிலிப்பிடம், “தயவுசெய்து சொல்லுங்கள்[a], தீர்க்கதரிசி இதை யாரைக் குறித்துச் சொல்கிறார்? தம்மைக் குறித்தா, வேறு யாரையாவது குறித்தா?” என்று கேட்டான்.
  to: 'அப்போது அந்த அண்ணகன் பிலிப்பிடம் பதிலளித்து, “தயவுசெய்து சொல்லுங்கள்[a]: தீர்க்கதரிசி இதை யாரைக் குறித்துச் சொல்கிறார்? தம்மைக் குறித்தா, வேறு ஒருவரைக் குறித்தா?” என்று கேட்டான்.'
  rationale: The revision explicitly renders ἀποκριθείς as ‘பதிலளித்து,’ retains the respectful force of Δέομαί σου, and refines the final alternative to match ἑτέρου τινός. No theological interpretation has been introduced.
