  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: ta
  text: அண்ணகன் தேரை நிறுத்தும்படி கட்டளையிட்டார்; பிலிப்பும் அண்ணகனும் இருவரும் தண்ணீருக்குள்[a] இறங்கினார்கள்; பிலிப்பு அவருக்குத் திருமுழுக்கு அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தண்ணீருக்கு”; இருப்பினும் கிரேக்க முன்னிடைச்சொல் பொதுவாகத் தண்ணீருக்குள் செல்லும் இயக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: கட்டளையிட்டார்
  rationale: κέλευω என்பதன் அதிகாரப்பூர்வமான ஆணையிடும் பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: στῆναι τὸ ἅρμα
  choice: தேரை நிறுத்தும்படி
  rationale: வாகனமாகிய தேரை நின்றுவிடச் செய்வதைக் குறிக்கும் கிரேக்கத் தொடரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἅρμα
  choice: தேர்
  rationale: ἅρμα என்பதற்கான நேரடியான, மரபாக ஏற்றுக்கொள்ளப்பட்ட பொருள்; வண்டி என்று பொதுமைப்படுத்தாமல் மூலச்சொல்லின் தன்மையைப் பேணுகிறது.
- source_word: κατέβησαν
  choice: இறங்கினார்கள்
  rationale: καταβαίνω என்பதன் கீழ்நோக்கிய இயக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀμφότεροι ... ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: பிலிப்பும் அண்ணகனும் ஆகிய இருவரும்
  rationale: ἀμφότεροι மற்றும் τε ... καί ஆகிய இரண்டும் வலியுறுத்தும் இரண்டு நபர்களின் கூட்டு நடவடிக்கையைப் பேணுகிறது.
- source_word: εἰς τὸ ὕδωρ
  choice: தண்ணீருக்குள்
  rationale: εἰς பொதுவாக உள்ளே நோக்கிய இயக்கத்தைக் குறிக்கிறது; ஆகவே வெறும் ‘தண்ணீரிடம்’ என்பதைவிட ‘தண்ணீருக்குள்’ மூலத்தின் திசைசார் பொருளை நன்றாகப் பேணுகிறது.
- source_word: εὐνοῦχος
  choice: அண்ணகன்
  rationale: உடல் நிலையைக் குறிக்கும் εὐνοῦχος என்பதன் நேரடிப் பொருளையும் கதையின் சொல் தொடர்ச்சியையும் பேணும் மரியாதையான தமிழ்ச் சொல்; வெறும் ‘அரசவை அதிகாரி’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: ἐβάπτισεν
  choice: திருமுழுக்குக் கொடுத்தார்
  rationale: தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் புரிந்துகொள்ளத்தக்க நிலைபெற்ற சொற்றொடர்; சடங்கின் முறையை ‘முழுவதும் அமிழ்த்தினார்’ என்று தனியே தீர்மானிக்காமல் βαπτίζω என்பதைக் குறிக்கிறது.
- source_word: αὐτόν
  choice: அவருக்கு
  rationale: செயலின் பெறுநரான அண்ணகனை மரியாதையான தமிழில் தெளிவாகச் சுட்டுகிறது.
theological_decisions:
- issue: திருமுழுக்கின் முறை குறித்து மொழிபெயர்ப்பு முடிவுகூற வேண்டுமா
  choice: இருவரும் ‘தண்ணீருக்குள் இறங்கினார்கள்’ என்றும் பிலிப்பு அவருக்குத் ‘திருமுழுக்குக் கொடுத்தார்’ என்றும் மொழிபெயர்த்தல்
  alternative: βαπτίζω என்பதை ‘முழுவதும் அமிழ்த்தினார்’ என்று மொழிபெயர்த்தல், அல்லது εἰς τὸ ὕδωρ என்பதை ‘தண்ணீரிடம்’ என்று மென்மைப்படுத்தல்
  rationale: கிரேக்க உரை இருவரும் தண்ணீருக்குள் சென்றதையும் பிலிப்பு அவருக்குத் திருமுழுக்குக் கொடுத்ததையும் கூறுகிறது. உள்ளே நோக்கிய இயக்கத்தைப் பேண வேண்டும்; அதேவேளை திருமுழுக்கின் முறையைப் பற்றிய பிற்காலச் சமயப்பிரிவுச் சர்ச்சையை மொழிபெயர்ப்பு தனியாகத் தீர்க்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு இயல்பாகவும் கண்ணியமாகவும் இருக்கும்படி அமைக்கப்பட்டது. மூலத்தின் இரட்டை வலியுறுத்தலை ‘பிலிப்பும் அண்ணகனும் ஆகிய இருவரும்’ என்று பேணுகிறது. தேவையற்ற அடிக்குறிப்பு சேர்க்கப்படவில்லை; ‘தண்ணீருக்குள்’ என்பது εἰς என்பதன் வழக்கமான திசைசார் பொருளை நேரடியாகத் தருகிறது.
