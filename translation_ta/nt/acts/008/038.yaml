revisions:
- from: அவர் தேரை நிறுத்தும்படி கட்டளையிட்டார். பிலிப்பும் அண்ணகனும் ஆகிய இருவரும் தண்ணீருக்குள் இறங்கினார்கள்; பிலிப்பு அவருக்குத் திருமுழுக்குக் கொடுத்தார்.
  to: அண்ணகன் தேரை நிறுத்தும்படி கட்டளையிட்டார்; பிலிப்பும் அண்ணகனும் இருவரும் தண்ணீருக்குள்[a] இறங்கினார்கள்; பிலிப்பு அவருக்குத் திருமுழுக்கு அளித்தார்.
  rationale: The revision clarifies the referent of the first verb, smooths the Tamil while preserving the Greek's explicit emphasis that both men went down, and restores the lexical-alternative footnote from the English POB audit trail. It retains “தண்ணீருக்குள்” and “திருமுழுக்கு” without adding any conclusion about the mode of baptism.
  reviewer_model: gpt-5.6-terra
