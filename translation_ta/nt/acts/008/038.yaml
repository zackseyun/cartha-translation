    reason: lexical_alternative
  revision_rationale: The revision clarifies the referent of the first verb, smooths the Tamil while preserving the Greek's explicit emphasis that both men went down, and restores the lexical-alternative footnote from the English POB audit trail. It retains “தண்ணீருக்குள்” and “திருமுழுக்கு” without adding any conclusion about the mode of baptism.
