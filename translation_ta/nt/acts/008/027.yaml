base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: ta
  text: அவர் எழுந்து புறப்பட்டுச் சென்றார். இதோ, எத்தியோப்பியனாகிய ஒரு மனிதர் இருந்தார். அவர் ஓர் அண்ணகர்[a]; எத்தியோப்பியர்களின் அரசியான கந்தாகேயின்[b] உயரதிகாரி; அவளுடைய கருவூலம் முழுவதற்கும் பொறுப்பாளராக இருந்தவர். அவர் வழிபடுவதற்காக எருசலேமுக்கு வந்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரசவை அதிகாரி” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் சில சூழல்களில் அரசவைப் பதவியாளரைக் குறிக்கலாம். எனினும் இங்கு அதன் நேரடிப் பொருளான “அண்ணகர்” என்பதே அதிகம் சாத்தியம்.
    reason: lexical_alternative
  - marker: b
    text: “கந்தாகே” என்பது அரசியின் தனிப்பெயராக இல்லாமல், அரச வம்சமுறைப் பட்டமாக இருந்திருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς ἐπορεύθη
  choice: எழுந்து புறப்பட்டுப் போனார்
  rationale: முதலில் நிகழும் பங்கேற்புவினையையும் அதைத் தொடரும் முதன்மை இயக்கவினையையும் இயல்பான தமிழ் நிகழ்வுவரிசையில் தருகிறது.
- source_word: ἰδοὺ
  choice: அப்போது, இதோ
  rationale: லூக்காவின் கவனத்தை ஈர்க்கும் கதைநடைச் சுட்டியை நீக்காமல், தமிழில் காட்சிமாற்றத்தையும் தெளிவாக்குகிறது.
- source_word: ἀνὴρ Αἰθίοψ
  choice: எத்தியோப்பிய மனிதர் ஒருவர்
  rationale: ἀνήρ என்பதிலுள்ள ஆண் பாலினக் குறிப்பையும் Αἰθίοψ என்பதிலுள்ள இன-புவியியல் அடையாளத்தையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: εὐνοῦχος
  choice: அண்ணகர்
  rationale: சொல்லின் முதன்மையான நேரடிப் பொருளைத் தருகிறது; அதிகாரி என்ற விரிந்த பொருள் சாத்தியமானாலும், அடுத்துள்ள δυνάστης ஏற்கெனவே அவரது அதிகாரப் பதவியைச் சுட்டுகிறது.
- source_word: δυνάστης
  choice: உயரதிகாரி
  rationale: அரசவையில் அதிகாரமும் உயர்ந்த பதவியும் உடையவர் என்ற கருத்தை, அவரையே ஆட்சியாளர் என மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: எத்தியோப்பியர்களின் அரசியான கந்தாகேயின்
  rationale: கிரேக்கப் பன்மை இனப்பெயரைப் பாதுகாத்து, Κανδάκη என்பதை ஒலிபெயர்க்கிறது; இது தனிப்பெயரா வம்சப் பட்டமா என்ற விவரம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: அவளுடைய கருவூலம் முழுவதற்கும் பொறுப்பாளராக
  rationale: ἐπί இங்குக் குறிக்கும் நிர்வாகப் பொறுப்பையும் γάζα என்பதன் கருவூலப் பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: ἐληλύθει
  choice: வந்திருந்தார்
  rationale: கதையின் அப்போதைய நிகழ்வுக்கு முன்பே வருகை நிகழ்ந்திருந்ததை நிறைவுற்ற இறந்தகால வடிவில் பாதுகாக்கிறது.
- source_word: προσκυνήσων εἰς Ἰερουσαλήμ
  choice: வழிபடுவதற்காக எருசலேமுக்கு
  rationale: எதிர்காலப் பங்கேற்புவினை தெரிவிக்கும் நோக்கத்தையும் நகரை நோக்கிய இயக்கத்தையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: εὐνοῦχος என்பதை உடல்/சமூக நிலையைச் சுட்டும் சொல்லாக மொழிபெயர்ப்பதா, பொதுவாக அரசவை அதிகாரி என மொழிபெயர்ப்பதா
  choice: முதன்மை உரையில் “அண்ணகர்”
  alternative: “அரசவை அதிகாரி”
  rationale: εὐνοῦχος என்பதன் இயல்பான நேரடிப் பொருள் அண்ணகர் என்பதே; மேலும் δυνάστης அவரது அதிகாரி நிலையைத் தனியே தெரிவிப்பதால் இரண்டையும் ஒன்றாக்கக் கூடாது. இருப்பினும் சில சூழல்களில் εὐνοῦχος அரசவை அதிகாரியைக் குறிக்கலாம் என்ற உண்மையான சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. “இதோ” என்ற கவனச் சுட்டி மூலத்தின் உயிரோட்டத்திற்காகத் தக்கவைக்கப்பட்டது. “அண்ணகர்” என்பது துல்லியமான இலக்கிய-நிலையான சொல்; அதன் மாற்றுப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
