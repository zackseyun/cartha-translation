- from: அவரைக் கொன்றதற்குச் சவுலும் சம்மதித்திருந்தான்[a]. அன்றே எருசலேமிலிருந்த திருச்சபைக்கு எதிராகக் கடுமையான துன்புறுத்தல் தொடங்கியது. அப்போஸ்தலர்களைத் தவிர மற்ற அனைவரும் யூதேயா, சமாரியா பகுதிகளெங்கும் சிதறிப்போனார்கள்.
