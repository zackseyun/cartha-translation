id: ACT.8.1
reference: Acts 8:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: ta
  text: சவுலும் அவரைக் கொன்றதை ஏற்றுக்கொண்டிருந்தான்[a]. அந்த நாளிலே எருசலேமில் இருந்த திருச்சபைக்கு எதிராகப் பெரும் துன்புறுத்தல் எழுந்தது. அப்போஸ்தலர்களைத் தவிர மற்ற அனைவரும் யூதேயா, சமாரியா பகுதிகளெங்கும் சிதறிப்போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘அவர் கொல்லப்பட்டதை.’ கிரேக்கச் சொல் அவரை உயிரிழக்கச் செய்த செயலைக் குறிக்கிறது; அது வெறுமனே அவரது மரணத்தைக் குறிப்பதல்ல.'
    reason: ἀναίρεσις என்பதன் செயற்பொருளை விளக்கி, ‘மரணதண்டனை’ அல்லது ‘கொலை’ என்ற மேலதிக சட்ட-அற மதிப்பீடுகளைத் தவிர்க்கிறது.
lexical_decisions:
- source_word: Σαῦλος
  choice: சவுல்
  rationale: தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: συνευδοκῶν
  choice: சம்மதித்திருந்தான்
  rationale: ἦν உடன் வரும் நிகழ்காலப் பங்கேற்புவினை, அந்தக் கொலையை சவுல் ஏற்றுக்கொண்டு அதற்கு உடன்பட்டிருந்த நிலையைச் சுட்டுகிறது; அவன் நேரடியாகக் கொலையில் ஈடுபட்டதாக மிகைப்படுத்தவில்லை.
- source_word: ἀναιρέσει αὐτοῦ
  choice: அவரைக் கொன்றதற்கு
  rationale: வெறும் மரணத்தையல்ல, ஒருவரை உயிரிழக்கச் செய்த செயலைக் குறிக்கிறது. ‘மரணதண்டனை’ என்பது சட்டபூர்வத் தீர்ப்பை உட்புகுத்தக்கூடும்; ‘கொலை’ என்ற பெயர்ச்சொல் மூலச்சொல்லைவிட வலுவான நீதித்தீர்ப்பாக ஒலிக்கக்கூடும்.
- source_word: Ἐγένετο
  choice: தொடங்கியது
  rationale: அன்றே துன்புறுத்தல் எழுந்து நிகழத் தொடங்கியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: διωγμὸς μέγας
  choice: கடுமையான துன்புறுத்தல்
  rationale: μέγας இங்கு துன்புறுத்தலின் பெரும் தீவிரத்தைச் சுட்டுவதால், நவீன தமிழில் இயல்பாக ‘கடுமையான’ என்று வழங்கப்படுகிறது.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: எருசலேமிலிருந்த திருச்சபைக்கு எதிராக
  rationale: துன்புறுத்தல் எந்தக் குழுவை நோக்கி இருந்தது என்பதையும் அதன் இருப்பிடத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: πάντες ... πλὴν τῶν ἀποστόλων
  choice: அப்போஸ்தலர்களைத் தவிர மற்ற அனைவரும்
  rationale: ‘அனைவரும்’ என்ற வலியுறுத்தலையும், அப்போஸ்தலர்கள் அதற்கு விதிவிலக்கு என்ற வெளிப்படையான வரம்பையும் ஒரே இயல்பான தொடரில் தருகிறது.
- source_word: διεσπάρησαν
  choice: சிதறிப்போனார்கள்
  rationale: துன்புறுத்தலால் அவர்கள் பல இடங்களுக்குப் பரவிச் செல்ல நேர்ந்த விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: யூதேயா, சமாரியா பகுதிகளெங்கும்
  rationale: இரு நிலப்பரப்புகளின் பல பகுதிகளிலும் பரவியதைக் குறிக்கும் κατὰ τὰς χώρας என்பதன் புவியியல் பரப்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀναιρέσει αὐτοῦ என்பது ஸ்தேவானின் மரணத்தை எவ்வாறு வருணிக்கிறது
  choice: அவரைக் கொன்றதற்கு
  alternative: அவருக்கு மரணதண்டனை நிறைவேற்றப்பட்டதற்கு; அவர் கொலைசெய்யப்பட்டதற்கு; அவரது மரணத்திற்கு
  rationale: மூலம், அவரை உயிரிழக்கச் செய்த செயலைக் குறிக்கிறது. சட்டபூர்வமான ‘மரணதண்டனை’ என்ற மதிப்பீட்டையோ, தனியே ‘கொலை’ எனும் வலுவான சட்ட-அறத் தீர்ப்பையோ மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: πάντες என்பதன் வரம்பு
  choice: அப்போஸ்தலர்களைத் தவிர மற்ற அனைவரும்
  alternative: விசுவாசிகள் எல்லாரும்; எல்லாரும்
  rationale: ‘அனைவரும்’ என்ற இலக்கிய வலிமை காக்கப்படுகிறது; அதே நேரத்தில் மூலமே தரும் அப்போஸ்தலர் விதிவிலக்கு தெளிவாக வைக்கப்படுகிறது. இதன் சூழல் சார்ந்த குறிப்பு எருசலேம் திருச்சபையினரே.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘திருச்சபை’, ‘அப்போஸ்தலர்’, ‘எருசலேம்’, ‘யூதேயா’, ‘சமாரியா’ ஆகிய நிலைபெற்ற வேதாகமப் பயன்பாடுகள் தக்கவைக்கப்பட்டுள்ளன. δέ-யின் மென்மையான இணைப்புத் தன்மை முதல் வாக்கியத்தில் ‘சவுலும்’ என்பதாலும், அடுத்த நிகழ்வின் காலத் தொடர்பு ‘அன்றே’ என்பதாலும் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
