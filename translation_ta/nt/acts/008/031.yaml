translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘புரிந்துகொள்ள’ என்பது முந்தைய வசனத்திலிருந்து தொடரும் மறைபொருளைத் தமிழில் வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
