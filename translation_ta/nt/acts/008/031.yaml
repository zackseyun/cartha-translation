source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ⸀ὁδηγήσει με; παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: ta
  text: அதற்கு அவர், “யாராவது எனக்கு வழிகாட்டாவிட்டால்[a], என்னால் எப்படிப் புரிந்துகொள்ள முடியும்?” என்றார். பின்பு அவர் பிலிப்பை மேலே ஏறித் தம்முடன் உட்காரும்படி வேண்டிக்கொண்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாராவது என்னை வழிநடத்தாவிட்டால்.’ கிரேக்க வினைச்சொல் பாதையில் வழிநடத்துவதையும், ஒருவரைப் புரிந்துகொள்ள வழிகாட்டுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பிலிப்பு மேலே ஏறித் தம்முடன் உட்காரும்படி அவரை அழைத்தார்.’ இங்குள்ள கிரேக்க வினைச்சொல் ஆர்வமான வேண்டுகோளையோ அழைப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: என்னால் எப்படிப் புரிந்துகொள்ள முடியும்?
  rationale: ἄν உடன் வரும் optative சாத்தியமின்மையை நிபந்தனை சார்ந்த விதத்தில் வெளிப்படுத்துகிறது. கிரேக்கத்தில் ‘புரிந்துகொள்ள’ என்பது வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய வசனத்தின் கேள்வியிலிருந்து அது இயல்பாகப் புரிந்துகொள்ளப்படுகிறது; தமிழில் வாக்கியம் தெளிவாக இருக்க அதைச் சேர்த்துள்ளோம்.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: யாராவது எனக்கு வழிகாட்டாவிட்டால்
  rationale: ὁδηγέω என்பதன் அடிப்படைப் பொருள் வழிநடத்துதல் அல்லது வழிகாட்டுதல். இங்கு வேதவசனத்தைப் புரிந்துகொள்ள உதவுவதைக் குறித்தாலும், ‘வழிகாட்டுதல்’ என்ற சொல் அதன் நேரடியான மற்றும் கருத்துணர்வுக்கு உதவும் இரு நிழற்பொருள்களையும் காக்கிறது.
- source_word: παρεκάλεσέν
  choice: வேண்டிக்கொண்டார்
  rationale: παρακαλέω இச்சூழலில் மரியாதையுடனும் வலியுறுத்தலுடனும் செய்யப்படும் வேண்டுகோளைக் குறிக்கிறது. ‘கேட்டார்’ என்பதைவிட இதன் வலிமையை நன்றாகக் காட்டுகிறது; ‘கெஞ்சினார்’ என்பதுபோல் மிகைப்படுத்துவதில்லை.
- source_word: τε
  choice: பின்பு
  rationale: τε இரு நிகழ்வுகளை மெதுவாக இணைக்கிறது. ‘பின்பு’ என்பது இங்குள்ள கதைநகர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀναβάντα
  choice: மேலே ஏறி
  rationale: ἀναβαίνω என்பதன் மேலே செல்வது அல்லது ஏறுவது என்ற இடவியல் படிமத்தை இது காக்கிறது; சூழலில் பிலிப்பு தேரில் ஏறுவதைக் குறிக்கிறது.
- source_word: καθίσαι σὺν αὐτῷ
  choice: தன்னுடன் உட்காரும்படி
  rationale: σύν உடன் வரும் இத்தொடர் ‘அவருடன் உட்காருதல்’ என இயல்பாகப் பொருள்படுகிறது. ‘அருகில்’ அல்லது ‘பக்கத்தில்’ என்று மூலத்தில் இல்லாத இடத்துல்லியத்தைச் சேர்க்கவில்லை.
- source_word: Φίλιππον
  choice: பிலிப்பு
  rationale: தமிழ் வேதாகமப் பெயர் வழக்குக்கு ஏற்ற நிலையான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
