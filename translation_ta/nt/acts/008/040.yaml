  source_fidelity: 'மூல கிரேக்கத்தின் முக்கிய கூறுகள் நம்பகமாகப் பாதுகாக்கப்பட்டுள்ளன: δὲ-யின் மென்மையான தொடர்ச்சி/மாறுபாடு ‘ஆனால்’ மூலம் தரப்பட்டுள்ளது; εὑρέθη-யின் விளக்கமளிக்காத செயப்பாட்டு ‘காணப்பட்டார்’ என உள்ளது; ‘அசோத்தில்’ இடத்தைக் குறிக்கிறது; διερχόμενος மற்றும் imperfect εὐηγγελίζετο ஆகியவற்றின் தொடர்ச்சியான பயணமும் அறிவித்தலும் ‘அவ்வழியே சென்று’ மற்றும் ‘அறிவித்துக்கொண்டிருந்தார்’ மூலம் வெளிப்படுகின்றன. ‘செசரியாவை அடையும்வரை’ ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν என்பதன் கால-எல்லையையும் இலக்கையும் துல்லியமாகத் தருகிறது.'
