source:
  edition: SBLGNT
  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: ta
  text: ஆனால் பிலிப்பு அசோத்தில் காணப்பட்டார்[a]. அவர் அவ்வழியே சென்று, செசரியாவை அடையும்வரை எல்லா நகரங்களிலும் நற்செய்தியை அறிவித்துக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசோத்தில் தோன்றினார்.” கிரேக்க உரை இன்னும் நேரடியாக “அசோத்தில் காணப்பட்டார்” என்று கூறுகிறது. சூழலில் இது தெய்வீகச் செயலால் திடீரென இடமாற்றப்பட்டதைக் குறிக்கக்கூடும்; ஆனால் அதை வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் ஆவியானவர் பிலிப்புவை எடுத்துக்கொண்ட நிகழ்விலிருந்து அடுத்த நிகழ்வுக்கு மெல்லிய மாறுபாட்டுடன் நகர்த்தும் இணைப்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: εὑρέθη
  choice: காணப்பட்டார்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தின் நேரடியான பொருளைப் பாதுகாக்கிறது; பிலிப்பு அற்புதமாக இடமாற்றப்பட்டார் என்று சூழல் உணர்த்தினாலும், அதை மூலச்சொல்லைவிட வெளிப்படையாகக் கூறுவதில்லை.
- source_word: εἰς Ἄζωτον
  choice: அசோத்தில்
  rationale: இங்கு εἰς, பிலிப்பு காணப்பட்டதன் விளைவான இருப்பிடத்தைக் குறிக்கிறது; தமிழில் இடப்பொருளை இயல்பாகத் தருகிறது.
- source_word: διερχόμενος
  choice: அவர் அவ்வழியே சென்று
  rationale: பிலிப்பு அந்தப் பகுதியைக் கடந்து பயணம் செய்ததையும், அதே நேரத்தில் நற்செய்தி அறிவித்ததையும் இயல்பான தொடரமைப்பில் வெளிப்படுத்துகிறது.
- source_word: εὐηγγελίζετο
  choice: நற்செய்தியை அறிவித்துக்கொண்டிருந்தார்
  rationale: நடந்துகொண்டிருந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் குறிக்கும் imperfect வடிவத்தின் தன்மையைப் பாதுகாத்து, சமயத் தொழில்சொல் சார்பில்லாத தெளிவான நவீன தமிழைப் பயன்படுத்துகிறது.
- source_word: τὰς πόλεις πάσας
  choice: எல்லா நகரங்களிலும்
  rationale: அவர் சென்ற பாதையிலிருந்த நகரங்கள் அனைத்திலும் அறிவித்தார் என்ற பகிர்வுப் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: அடையும்வரை
  rationale: தொடர்ந்த செயல் முடியும் எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: εἰς Καισάρειαν
  choice: செசரியாவை
  rationale: ἔρχομαι உடன் வரும் εἰς குறிக்கும் இலக்கை, ‘அடையும்வரை’ என்ற தமிழ் வினையுடன் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: εὑρέθη என்பதை பிலிப்புவின் அற்புதமான இடமாற்றத்தை வெளிப்படையாக விளக்கும் வகையில் மொழிபெயர்க்க வேண்டுமா?
  choice: முதன்மை உரையில் நடுநிலையான ‘காணப்பட்டார்’ என்பதை வைத்திருத்தல்
  alternative: ‘அசோத்தில் தோன்றினார்’
  rationale: சூழல் தெய்வீகச் செயலை வலுவாக உணர்த்தினாலும், கிரேக்க உரை நேரடியாக ‘காணப்பட்டார்’ என்றே கூறுகிறது. ஆகவே அற்புதத்தின் தன்மையை மேலதிகமாக வரையறுக்காமல் மூல உரையின் இறையியல் பதற்றத்தையும் மறைபொருளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நற்செய்தி’ என்பது εὐαγγέλιον சார்ந்த கருத்தைத் தெளிவாகத் தருகிறது; ‘பிரசங்கித்தார்’, ‘சுவிசேஷம்’ போன்ற அதிக சமயவழக்குச் சொற்கள் தவிர்க்கப்பட்டுள்ளன. இடப்பெயர்கள் ‘அசோத்து’, ‘செசரியா’ என்ற வழக்கமான ஒலிபெயர்ப்புகளின் வேற்றுமை வடிவங்களில் தரப்பட்டுள்ளன.
