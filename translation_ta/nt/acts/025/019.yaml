source:
  edition: SBLGNT
  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: ta
  text: மாறாக, தங்களுடைய மதத்தைப் பற்றியும்[a], இறந்துபோன இயேசு என்னும் ஒருவரைப் பற்றியும் அவர்களுக்குப் பவுலோடு சில சர்ச்சைகள் இருந்தன; அவர் உயிரோடிருக்கிறார் என்று பவுல் கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களுடைய மூடநம்பிக்கையைப் பற்றியும்.” கிரேக்கச் சொல் நடுநிலையாக மதத்தைக் குறிக்கலாம்; வெளியாளர் ஒருவரின் பேச்சில் இழிவான நிழற்பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: சில சர்ச்சைகள்
  rationale: இது வெறும் கேள்விகளைக் காட்டிலும் கருத்து வேறுபாடும் வாதத்திற்குரிய விஷயங்களும் இருந்ததைக் குறிக்கிறது; சூழலின் எதிர்நிலைத் தன்மையை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: δέ
  choice: மாறாக
  rationale: எதிர்பார்க்கப்பட்ட குற்றச்சாட்டுகள் இல்லாமல், அதற்குப் பதிலாக உண்மையில் அவர்கள் முன்வைத்தவை என்ன என்பதை முந்தைய வசனத்துடன் திருத்தமான எதிர்மறைத் தொடர்பில் காட்டுகிறது.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: தங்களுடைய மதத்தைப் பற்றி
  rationale: δεισιδαιμονία என்பது நடுநிலையாக ‘மதம்’ என்றும் இழிவான நிழற்பொருளில் ‘மூடநம்பிக்கை’ என்றும் பொருள்படலாம். ‘மதம்’ என்பது தேவையற்ற இழிவைச் சேர்க்காமல் பொருளை இயல்பாகத் தருகிறது; ἰδίας-இன் தொலைவுணர்வை ‘தங்களுடைய’ காக்கிறது.
- source_word: εἶχον πρὸς αὐτόν
  choice: அவர்களுக்குப் பவுலோடு ... இருந்தன
  rationale: பவுலுக்கும் குற்றஞ்சாட்டியவர்களுக்கும் இடையே சர்ச்சைகள் இருந்தன என்ற கிரேக்கச் சொற்றொடரின் உறவுநிலையை இயல்பான தமிழில் தருகிறது; தேவையற்ற சட்ட நுட்பத்தைச் சேர்க்கவில்லை.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: இயேசு என்னும் ஒருவரைப் பற்றியும்
  rationale: τινος காட்டும் பெஸ்துவின் அறிமுகமின்மையையும் விலகிய பார்வையையும், தமிழில் இயல்பற்ற ‘ஒரு குறிப்பிட்ட இயேசு’ என்பதற்குப் பதிலாக இந்தச் சொற்றொடர் காக்கிறது.
- source_word: τεθνηκότος
  choice: இறந்துபோன
  rationale: மரணத்தின் விளைவாகத் தொடரும் நிலையை உணர்த்தும் நிறைவுக்காலப் பங்கேற்பையும், அடுத்து வரும் ‘உயிரோடிருப்பதாக’ என்பதுடனான முரண்பாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: அந்த இயேசு உயிரோடிருப்பதாகப் பவுல் வாதிட்டார்
  rationale: φάσκω என்பது ஒரு கூற்றை அறிவிக்க அல்லது வலியுறுத்தச் சொல்கிறது. ‘வாதிட்டார்’ என்பது பெஸ்துவின் மறைமுக அறிக்கையையும் சர்ச்சைச் சூழலையும் காக்கிறது; உயிர்த்தெழுதலை மொழிபெயர்ப்பாளரே நேரடியாக உறுதிப்படுத்துவதாக மாற்றவில்லை.
theological_decisions:
- issue: பெஸ்துவின் பேச்சில் δεισιδαιμονία-வை மொழிபெயர்த்தல்
  choice: மதம்
  alternative: மூடநம்பிக்கை
  rationale: ஒரு ரோம அதிகாரி யூத நம்பிக்கையை வெளியாளின் பார்வையில் குறிப்பிடுகிறார். கிரேக்கம் அவசியமாகக் கொண்டிருப்பதைவிடக் கடுமையான இழிவை ‘மூடநம்பிக்கை’ முதன்மை உரையில் சேர்க்கக்கூடும். ஆயினும் அதன் சாத்தியமான இழிவான நிழற்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: இயேசு உயிரோடிருப்பது பற்றிய கூற்றின் வடிவம்
  choice: உயிரோடிருப்பதாகப் பவுல் வாதிட்டார்
  alternative: உயிரோடிருக்கிறார் என்று பவுல் கூறினார்
  rationale: இது உயிர்த்தெழுதலைப் பற்றிய கதைசொல்லியின் நேரடிக் கூற்று அல்ல; பவுலின் கூற்றை பெஸ்து அறிக்கையிடுவது. தேர்ந்த வடிவம் அந்தப் பேச்சுப் பார்வையைக் காக்கிறது; பிற இடங்களில் உறுதிப்படுத்தப்படும் உயிர்த்தெழுதலின் உண்மையை மறுப்பதுமில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. பெஸ்துவின் வெளியாளர் பார்வை ‘தங்களுடைய’ மற்றும் ‘இயேசு என்னும் ஒருவர்’ என்பவற்றால் காக்கப்படுகிறது. ‘சர்ச்சைகள்’ என்பது கருத்து மோதலைத் தெளிவாகத் தருகிறது; ‘வாதிட்டார்’ என்பது இங்கு இடம்பெறும் மறைமுக அறிக்கையின் தூரத்தைப் பேணுகிறது.
