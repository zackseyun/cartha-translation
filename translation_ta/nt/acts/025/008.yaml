source:
  edition: SBLGNT
  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: ta
  text: பவுல் தன் தரப்பு வாதத்தை முன்வைத்து, “யூதர்களின் சட்டத்திற்கோ[a], ஆலயத்திற்கோ, சீசருக்கோ எதிராக நான் எந்தப் பாவமும் செய்யவில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்களின் சட்டத்திற்கோ, ஆலயத்திற்கோ, சீசருக்கோ எதிராக நான் எந்தக் குற்றமும் செய்யவில்லை.”
    reason: ἥμαρτον இங்கு சட்டச் சூழலில் ‘குற்றம் செய்தேன்’ என்றும் பொருள்படலாம்; இந்த மாற்று அந்த நுணுக்கத்தை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: தன் தரப்பு வாதத்தை முன்வைத்து
  rationale: நீதிமன்றச் சூழலில் பவுல் தம்மைத் தற்காத்துப் பேசியதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: நேர்க் கூற்றாக மேற்கோள் குறிகளால் வெளிப்படுத்தப்பட்டது
  rationale: இது பவுலின் தரப்பு வாதத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் நேர்க் கூற்று இயல்பாக உள்ளது.
- source_word: νόμον τῶν Ἰουδαίων
  choice: யூதர்களுடைய திருச்சட்டம்
  rationale: மூலத்தின் உடைமைத் தொடர்பைப் பேணுவதோடு, மதச் சட்டத்தைக் குறிக்கும் νόμος என்பதையும் தெளிவாக்குகிறது.
- source_word: ἱερὸν
  choice: ஆலயம்
  rationale: ἱερόν இங்கு உள்ளார்ந்த பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தையும் பொதுவாகக் குறிக்கிறது; ‘ஆலயம்’ இயல்பான நிலையான தமிழ் சொல்.
- source_word: Καίσαρά
  choice: சீசர்
  rationale: ரோமப் பேரரசரைக் குறிக்கும் கிரேக்கப் பெயர்/பட்டத்தை ஒலிபெயர்த்து, அரசியல் மற்றும் சட்டச் சூழலைப் பேணுகிறது.
- source_word: τι
  choice: எந்தப் ... உம்
  rationale: எந்த வகையிலும் குற்றமிழைக்கவில்லை என்ற முழுமையான மறுப்பைத் தமிழில் இயல்பாக வலியுறுத்துகிறது.
- source_word: ἥμαρτον
  choice: பாவமும் செய்யவில்லை
  rationale: சூழல் சட்டரீதியானதாக இருந்தாலும், பொதுவாக ‘பாவம் செய்தல்’ என்று பொருள்படும் ἁμαρτάνω என்பதன் ஒழுக்கவியல் நுணுக்கத்தையும் பேணுகிறது.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: -க்கோ ... -க்கோ ... -க்கோ
  rationale: மூன்று தரப்புகளுக்கு எதிராகவும் செய்ததில்லை என்ற இணையான மும்முறை மறுப்பை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
theological_decisions:
- issue: ἥμαρτον என்பதிலுள்ள சட்டரீதியான மற்றும் ஒழுக்கவியல் நுணுக்கம்
  choice: எந்தப் பாவமும் செய்யவில்லை
  alternative: எந்தக் குற்றமும் செய்யவில்லை
  rationale: இந்த வசனம் நீதிமன்றச் சூழலில் இருந்தாலும், கிரேக்க வினைச்சொல்லின் ‘பாவம் செய்தல்’ என்ற பரந்த ஒழுக்கவியல் தொடர்பை முற்றிலும் சட்ட மொழியாகச் சுருக்காமல் பேணுகிறது. மாற்று வாசிப்பு சட்டச் சூழலைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான மொழிநடை. ‘தன் தரப்பு வாதத்தை முன்வைத்து’ என்பது சட்டவியல் பொருளைத் தெளிவாக்குகிறது; ‘திருச்சட்டம்’, ‘ஆலயம்’, ‘சீசர்’ ஆகியவை பொதுவாகப் புரியக்கூடிய வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன.
