source:
  edition: SBLGNT
  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: ta
  text: அவனைப் பற்றி, நான் எருசலேமுக்கு வந்தபோது, தலைமை ஆசாரியர்களும் யூதர்களின் மூப்பர்களும் என்னிடம் தகவல் தெரிவித்தார்கள்; அவனைக் குற்றவாளி எனத் தீர்ப்பிடும்படி[a] கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்கு எதிராகக் குற்றத்தீர்ப்பு வழங்கும்படி”; அல்லது, “அவனுக்கு எதிராகக் கண்டனத் தீர்ப்பு வழங்கும்படி.”
    reason: καταδίκην என்பது சட்டரீதியான கண்டனத் தீர்ப்பு அல்லது குற்றவாளித் தீர்ப்பைக் குறிக்கிறது; மூலச் சொல்லின் நெருங்கிய சட்டப் பொருள்நிழல்களை அடிக்குறிப்பு காக்கிறது.
lexical_decisions:
- source_word: περὶ οὗ
  choice: அவனைப் பற்றி
  rationale: இது முன்பு குறிப்பிடப்பட்ட பவுலைக் குறிக்கிறது; கிரேக்கத்தின் தொடர்புச் சுட்டையும் பேச்சுப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: நான் எருசலேமுக்கு வந்தபோது
  rationale: γίνομαι என்பதும் εἰς + இடம் என்பதும் இங்கு ஓர் இடத்திற்கு வந்து சேர்ந்ததைக் குறிக்கின்றன; காலத் தொடர்பையும் தெளிவாகக் காக்கிறது.
- source_word: ἐνεφάνισαν
  choice: என்னிடம் தகவல் தெரிவித்தார்கள்
  rationale: அதிகாரியிடம் ஒரு காரியத்தைத் தெரிவிக்கும் சட்ட-நிர்வாகச் சூழலைக் காட்டுகிறது; தேவையற்ற தொழில்நுட்பச் சொல்லாடலைத் தவிர்க்கிறது.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: ஒரே தலைமைக் குருவைக் குறிக்காமல், முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் பன்மைப் பட்டத்தைத் துல்லியமாக வழங்குகிறது.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: யூதர்களின் மூப்பர்கள்
  rationale: யாருடைய மூப்பர்கள் என்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடரை நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: αἰτούμενοι
  choice: கேட்டார்கள்
  rationale: தகவல் தெரிவித்ததோடு இணைந்து அவர்கள் வைத்த கோரிக்கையை எளிய, இயல்பான தமிழில் காட்டுகிறது.
- source_word: κατ’ αὐτοῦ
  choice: அவனுக்கு எதிராக
  rationale: இந்த நீதித்துறைச் சூழலில் κατά கொண்டுள்ள எதிரான சட்ட நடவடிக்கை என்ற பொருளைக் காக்கிறது.
- source_word: καταδίκην
  choice: குற்றத்தீர்ப்பு
  rationale: ஒருவருக்கு எதிராக வழங்கப்படும் நீதித்துறை சார்ந்த கண்டன அல்லது குற்றத் தீர்ப்பைச் சுருக்கமாகக் குறிக்கிறது; வெறும் பொதுக் கண்டனமாக மங்கச் செய்யவில்லை.
