lexical_decisions:
- source_word: κατελαβόμην
  choice: நான் கண்டறிந்தேன்
  rationale: விசாரணைக்குப் பின் பெஸ்து வந்த முடிவை நீதித்துறைச் சூழலில் இயல்பாகத் தெரிவிக்கிறது; முறையான இறுதித் தீர்ப்பு என்ற அளவுக்கு பொருளை மிகைப்படுத்தவில்லை.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: மரணத்திற்குத் தகுந்த எதையும் ... இல்லை
  rationale: மரண தண்டனைக்குரிய செயல் எதுவும் இல்லை என்ற கிரேக்கச் சொற்றொடரின் பொருளை நெருக்கமாக வைத்திருக்கிறது; மூலத்தில் இல்லாத ரோமச் சட்டத் தனித்துவத்தைச் சேர்க்கவில்லை.
- source_word: πεπραχέναι
  choice: செய்யவில்லை
  rationale: πράσσω என்பதன் பரந்த செயற்பொருளை இயல்பான தமிழில் தருகிறது; சட்டவியல் நுணுக்கம் சுற்றியுள்ள சொற்றொடரிலேயே வெளிப்படுகிறது.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: அவனே ... மேல்முறையீடு செய்ததால்
  rationale: வலியுறுத்தப்பட்ட αὐτοῦ τούτου என்பதை ‘அவனே’ என்பதால் பிரதிபலித்து, பெஸ்துவின் முடிவுக்கான காரணச் சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: τὸν Σεβαστόν
  choice: பேரரசரிடம்
  rationale: Σεβαστός இங்கு வரலாற்று அகுஸ்துவின் தனிப்பெயராக அல்ல, ரோமப் பேரரசருக்கான பட்டமாகப் பயன்படுகிறது; நவீன வாசகருக்கு குறிக்கப்படுபவரைத் தெளிவாக்குகிறது.
- source_word: ἔκρινα πέμπειν
  choice: அவனை அனுப்பிவைக்கத் தீர்மானித்தேன்
  rationale: பெஸ்துவின் அதிகாரப்பூர்வமான நடைமுறை முடிவை இயல்பான தமிழில் தெரிவிக்கிறது; சூழலிலிருந்து விளங்கும் ‘அவனை’ என்பதை வெளிப்படையாகச் சேர்க்கிறது.
