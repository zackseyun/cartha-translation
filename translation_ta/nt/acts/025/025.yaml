base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: ta
  text: ஆனால், அவன் மரணத்திற்குத் தகுந்த எதையும் செய்திருக்கவில்லை என்று நான் கண்டறிந்தேன்; அவனே பேரரசரிடம்[a] முறையீடு செய்ததால், அவனை அனுப்பத் தீர்மானித்தேன்.
  philosophy: optimal-equivalence
