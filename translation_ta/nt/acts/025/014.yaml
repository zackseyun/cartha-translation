- from: அவர்கள் அங்கே பல நாட்கள் தங்கியிருந்தபோது, பெஸ்து பவுலைப் பற்றிய விவகாரத்தை[b] அரசரின் பரிசீலனைக்கு முன்வைத்து[a], “பெலிக்ஸ் கைதியாக விட்டுச்சென்ற ஒரு மனிதன் இங்கே இருக்கிறான்” என்றார்.
  to: அவர்கள் அங்கே பல நாட்கள் தங்கியிருந்தபோது, பெஸ்து பவுலைப் பற்றிய காரியங்களை[b] அரசரிடம் முன்வைத்து[a], “பெலிக்ஸ் கைதியாக விட்டுச் சென்ற ஒருவன் இருக்கிறான்” என்றார்.
