  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: ta
  text: அவர்கள் அங்கே பல நாட்கள் தங்கியிருந்தபோது, பெஸ்து பவுலைப் பற்றிய காரியங்களை[b] அரசரிடம் முன்வைத்து[a], “பெலிக்ஸ் கைதியாக விட்டுச் சென்ற ஒருவன் இருக்கிறான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசரிடம் தெரிவித்தார்.” கிரேக்கச் சொல் வெறுமனே தகவல் கொடுப்பதைவிட, ஒரு விவகாரத்தைப் பரிசீலனைக்காக முன்வைப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “பவுலைப் பற்றிய காரியங்களை”; இச்சொற்றொடர் குறிப்பாக பவுலின் சட்ட வழக்கைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: பல நாட்கள்
  rationale: காலத்தைக் குறிக்கும் இச்சூழலில் ஒப்பீட்டுச் சொல்லான πλείους, கண்டிப்பான ஒப்பீட்டைவிட நீண்ட காலத்தைக் குறிக்கும் மரபுத்தொடராக வருகிறது; ‘பல நாட்கள்’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: διέτριβον
  choice: தங்கியிருந்தபோது
  rationale: διατρίβω இங்கு ஓர் இடத்தில் காலம் செலவிட்டுத் தங்கியிருப்பதைக் குறிக்கிறது; பன்மை எழுவாயையும் தொடர்ச்சியான சூழலையும் இச்சொல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνέθετο
  choice: அரசரின் பரிசீலனைக்கு முன்வைத்து
  rationale: இடை வினை வடிவிலுள்ள ἀνατίθεμαι, தகவல் தெரிவிப்பதை மட்டும் அல்லாமல் ஒரு விவகாரத்தை மற்றொருவரின் பரிசீலனைக்காக முன்வைப்பதையும் குறிக்கலாம்.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: பவுலைப் பற்றிய விவகாரத்தை
  rationale: இம்மரபுத்தொடர் பவுலுடன் தொடர்புடைய காரியங்களை, இச்சூழலில் குறிப்பாக அவரது சட்ட வழக்கு நிலையை, குறிக்கிறது. ‘விவகாரம்’ அதை மிகையாக விளக்காமல் இயல்பாகத் தருகிறது.
- source_word: Ἀνήρ τίς
  choice: ஒரு மனிதன் ... இருக்கிறான்
  rationale: குறிப்பிட்ட ஆனால் இதுவரை அடையாளப்படுத்தப்படாத ஒருவரை அறிமுகப்படுத்தும் கிரேக்கச் சொல்லாட்சியை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: καταλελειμμένος
  choice: விட்டுச்சென்ற
  rationale: கடந்த செயலும் அதன் தொடரும் நிலையும் சேர்ந்துள்ள நிறைவுக்காலச் செயப்பாட்டு வினையெச்சத்தின் பொருளைக் காட்டுகிறது; ‘கைவிட்ட’ என்று உணர்ச்சிசார் பொருளைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: δέσμιος
  choice: கைதியாக
  rationale: பெலிக்ஸ் அந்த மனிதனை விட்டுச்சென்றபோது அவர் கைதி என்ற நிலையிலிருந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: βασιλεῖ
  choice: அரசரிடம்
  rationale: கிரேக்க மூலத்தில் இவ்வசனத்தில் பெயர் மீண்டும் வராமல் ‘அரசர்’ என்ற பட்டமே உள்ளது; சூழலிலிருந்து அவர் யார் என்பது தெளிவாகிறது.
