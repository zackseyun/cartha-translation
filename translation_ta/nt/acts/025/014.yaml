translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சட்டச் சூழலை உணர்த்த ‘விவகாரம்’, பரிசீலனைக்காக எடுத்துரைக்கும் நுட்பத்தைப் பேண ‘பரிசீலனைக்கு முன்வைத்து’ ஆகியவை பயன்படுத்தப்பட்டுள்ளன. எல்லா அடிக்குறிப்புக் குறியீடுகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே அமைக்கப்பட்டுள்ளன.
