id: ACT.25.12
reference: Acts 25:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: ta
  text: அப்போது பெஸ்து ஆலோசனைக் குழுவுடன் கலந்துபேசிய பின்பு, “நீ சீசரிடம் மேல்முறையீடு செய்திருக்கிறாய்; சீசரிடமே நீ போவாய்[a]” என்று பதிலளித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீசரின் முன்னிலைக்கு நீ போவாய்.” மேல்முறையீடு செய்ததால் சீசரின் நீதிமன்ற விசாரணைக்குச் செல்வது என்ற சட்டப் பொருளையும் இச்சொற்றொடர் கொண்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதையில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இயல்பான காலத் தொடர்புச் சொல்.
- source_word: συλλαλήσας
  choice: கலந்துபேசிய பின்பு
  rationale: முதன்மை வினைக்கு முன் நடந்த ஆலோசனை சார்ந்த உரையாடலை இறந்தகாலப் பங்கேற்புவினை குறிக்கிறது.
- source_word: μετὰ τοῦ συμβουλίου
  choice: தன் ஆலோசனைக் குழுவினருடன்
  rationale: இங்கு συμβούλιον என்பது ஆளுநருக்கு ஆலோசனை வழங்கும் குழுவைக் குறிக்கிறது; இயல்பான தமிழுக்காக உறவைக் காட்டும் ‘தன்’ பயன்படுத்தப்பட்டுள்ளது, ஆனால் அது கிரேக்கத்தில் வெளிப்படையாக இல்லை.
- source_word: ἀπεκρίθη
  choice: பதிலளித்தான்
  rationale: நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான, இயல்பான கதையாடல் வினை.
- source_word: Καίσαρα
  choice: பேரரசரிடம்
  rationale: Καῖσαρ இங்கு தனிப்பட்ட பெயரை விட ரோமப் பேரரசரின் பதவிப் பட்டமாகவும் சட்ட அதிகாரமாகவும் செயல்படுவதால், சாதாரண தமிழ் வாசகருக்குத் தெளிவாக ‘பேரரசர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐπικέκλησαι
  choice: மேல்முறையீடு செய்திருக்கிறாய்
  rationale: நிறைவேற்றப்பட்ட செயலின் தற்போதைய சட்ட விளைவை உணர்த்தும் perfect middle வடிவத்தையும், பேரரசரின் நீதியதிகாரத்தை நாடும் சட்டப் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπὶ Καίσαρα
  choice: பேரரசரிடமே
  rationale: πορεύσῃ என்பதுடன் பேரரசரை நோக்கிச் செல்வதை முதன்மையாகக் குறிக்கிறது; ‘-மே’ முறையீட்டிற்கும் அதன் விளைவிற்கும் இடையேயான வலியுறுத்தப்பட்ட தொடர்பைப் பாதுகாக்கிறது.
- source_word: πορεύσῃ
  choice: நீ போவாய்
  rationale: எதிர்கால இடைநிலை வடிவத்தின் நேரடியான இயக்கப் பொருளைப் பாதுகாக்கிறது; ‘அனுப்பப்படுவாய்’ என்பது மூலத்தில் இல்லாத செயப்பாட்டு அர்த்தத்தைச் சேர்க்கும்.
