  register: நவீன நிலையான தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேல்முறையீடு’ சட்டத் துல்லியத்திற்காகவும், ‘ஆலோசனைக் குழு’ συμβούλιον என்பதன் நிர்வாகச் சூழலைத் தெளிவுபடுத்தவும் தேர்ந்தெடுக்கப்பட்டன. அடிக்குறிப்பு குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
