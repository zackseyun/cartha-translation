id: ACT.25.23
reference: Acts 25:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: ta
  text: ஆகவே, மறுநாள் அகிரிப்பாவும் பெர்னீக்கேயும் மிகுந்த ஆடம்பரத்துடன்[a] வந்து, படைத்தளபதிகளோடும் நகரத்தின் முக்கியமான ஆண்களோடும்[b] விசாரணை மண்டபத்திற்குள் நுழைந்தார்கள். பெஸ்து கட்டளையிட்டதும் பவுல் அழைத்து வரப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகுந்த பகட்டுடன்” அல்லது “மிகுந்த விழாக்கோலத்துடன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நகரத்தின் செல்வாக்குமிக்க ஆண்களோடும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: ஆகவே, மறுநாள்
  rationale: οὖν காட்டும் கதைத் தொடர்ச்சியையும், தத்திவ வேற்றுமையில் அமைந்த காலக் குறிப்பான ἐπαύριον என்பதன் ‘மறுநாள்’ என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης
  choice: அகிரிப்பாவும் பெர்னீக்கேயும் ... வந்து
  rationale: மரபான தமிழ் பெயரெழுத்துப்பெயர்ப்பைப் பயன்படுத்தி, genitive absolute அமைப்பை இயல்பான வினையெச்சத் தொடராக மாற்றுகிறது.
- source_word: μετὰ πολλῆς φαντασίας
  choice: மிகுந்த ஆடம்பரத்துடன்
  rationale: φαντασία இங்கு பொதுமக்கள் முன்னிலையிலான பகட்டான வெளிப்பாடு, விழாக்கோலம் ஆகியவற்றைக் குறிக்கிறது; ‘ஆடம்பரம்’ அந்தச் சாயலைத் தெளிவாகத் தருகிறது.
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: விசாரணை மண்டபத்திற்குள் நுழைந்தார்கள்
  rationale: ἀκροατήριον என்பது கேட்பதற்கான இடத்தை, இச்சூழலில் அதிகாரப்பூர்வ விசாரணை நடைபெறும் மண்டபத்தைச் சுட்டுகிறது.
- source_word: σύν τε χιλιάρχοις
  choice: படைத்தளபதிகளோடும்
  rationale: χιλίαρχοι உயர்நிலை ரோமப் படை அதிகாரிகள். குறிப்பிட்ட ரோமப் பதவிக்கான அரிதான தமிழ்ச்சொல்லை விட ‘படைத்தளபதிகள்’ வாசகருக்கு தெளிவான செயல்பாட்டு இணையாக உள்ளது; τε அடுத்த குழுவுடனான இணைப்பில் ‘-ஓடும்’ மூலம் வெளிப்படுகிறது.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: நகரத்தின் முதன்மையான மனிதர்களோடும்
  rationale: κατ’ ἐξοχήν என்பதன் மேன்மை அல்லது சமூக முக்கியத்துவத்தை ‘முதன்மையான’ வெளிப்படுத்துகிறது; ἀνδράσιν என்பதிலுள்ள ஆண்பால் குறிப்பை ‘மனிதர்கள்’ தக்கவைக்கிறது.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: பெஸ்து கட்டளையிட்டதும்
  rationale: genitive absolute தொடரை காலத்தையும் அதிகாரபூர்வ ஆணையையும் தெளிவாகக் காட்டும் இயல்பான தமிழ் வாக்கியமாக வழங்குகிறது.
- source_word: ἤχθη ὁ Παῦλος
  choice: பவுல் அழைத்து வரப்பட்டார்
  rationale: ἄγω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் பவுல் பிறரால் மண்டபத்திற்குக் கொண்டுவரப்பட்டதைத் தெரிவிக்கிறது; தமிழ் மரியாதை ஒருமை இயல்புக்கேற்ப ‘வரப்பட்டார்’ பயன்படுத்தப்படுகிறது.
