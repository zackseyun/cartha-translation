translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடையைக் கடைப்பிடிக்கிறது. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; நிகழ்வுகளின் வரிசையும் இணைப்புகளும் பாதுகாக்கப்பட்டுள்ளன.
