language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: ta
  text: எனவே, நான் குற்றம் செய்கிறவனாக இருந்து, மரணத்திற்குத் தகுதியான எதையாவது செய்திருந்தால், இறப்பதற்கு நான் மறுப்பதில்லை. ஆனால் இவர்கள் என்மீது சுமத்தும் குற்றச்சாட்டுகளில் ஒன்றும் உண்மையில்லை என்றால், அவர்களுக்குச் சாதகமாக என்னை அவர்களிடம் யாரும் ஒப்படைக்க முடியாது.[a] நான் சீசரிடம் மேல்முறையீடு செய்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைத் திருப்திப்படுத்துவதற்காக என்னை அவர்களிடம் விட்டுக்கொடுக்க முடியாது.” கிரேக்க வினைச்சொல், ஒருவரைச் சலுகையாக வழங்குதல் அல்லது ஒப்படைத்தல் என்ற பொருளையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: நான் அநியாயம் செய்து
  rationale: நிகழ்கால வினையின் தொடரும் அல்லது தற்போதைய குற்றநிலையைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; ஒழுக்க மற்றும் சட்டப் பொருளையும் காக்கிறது.
- source_word: ἄξιον θανάτου
  choice: மரணத்திற்குத் தகுதியான
  rationale: மரண தண்டனைக்கு உரிய செயல் என்ற மதிப்பீட்டு மற்றும் சட்ட நுணுக்கத்தை அளவுக்கு மீறி விளக்காமல் காக்கிறது.
- source_word: πέπραχά τι
  choice: எதையாவது செய்திருந்தால்
  rationale: நிறைவேற்றப்பட்டு தற்போதும் பொருத்தமுள்ள செயலை நிபந்தனை வாக்கியத்தில் இயல்பான தமிழில் தருகிறது; τι என்பதன் குறிப்பற்ற தன்மையையும் காக்கிறது.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: இறப்பதற்கு நான் மறுப்பதில்லை
  rationale: παραιτέομαι என்பதன் ‘மறுத்தல்/தவிர்த்தல்’ பொருளை நேரடியாகக் காத்து, குற்றவாளி என்றால் மரணத்தை ஏற்கும் மனநிலையை வெளிப்படுத்துகிறது.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: இவர்கள் என்மீது சுமத்தும் குற்றச்சாட்டுகளில் ஒன்றும் உண்மையில்லை
  rationale: குற்றச்சாட்டுகளுக்கு ஆதாரமான உண்மை அல்லது சாரம் இல்லை என்ற கிரேக்கச் சொற்றொடரின் இடியோமாட்டிக் பொருளை தெளிவான தமிழில் வழங்குகிறது.
- source_word: χαρίσασθαι
  choice: அவர்களுக்குச் சலுகையாக என்னை ... ஒப்படைக்க
  rationale: ஒருவரை மற்றவர்களுக்குச் சாதகமாக அல்லது அவர்களைத் திருப்திப்படுத்தும் வகையில் வழங்குதல் என்ற நீதித்துறைச் சூழலிலுள்ள நுணுக்கத்தை காக்கிறது.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: நான் சீசரிடம் மேல்முறையீடு செய்கிறேன்
  rationale: ரோமப் பேரரசரிடம் செய்யப்படும் தொழில்நுட்பமான சட்ட மேல்முறையீட்டை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: μὲν οὖν ... δὲ
  choice: ஆகவே ... ஆனால்
  rationale: பவுலின் முதல் நிபந்தனையையும் அதற்கு மாறான இரண்டாம் நிபந்தனையையும் இயல்பான வாத ஓட்டத்தில் இணைக்கிறது.
theological_decisions:
- issue: மரண தண்டனையையும் சட்ட மேல்முறையீட்டையும் பற்றிய பவுலின் கூற்றின் நீதித்துறை நுணுக்கம்
  choice: தான் உண்மையில் மரணத்திற்குரிய குற்றம் செய்திருந்தால் இறப்பதை மறுக்கவில்லை என்றும், குற்றச்சாட்டுகள் ஆதாரமற்றவை என்றால் தன்னைச் சலுகையாக ஒப்படைக்க யாருக்கும் உரிமையில்லை என்றும் பவுல் கூறுகிறார்.
  alternative: நடவடிக்கையின் சட்டபூர்வத்தன்மையை எந்த வகையிலும் ஏற்றுக்கொள்ளாமல் பவுல் வெறும் வாதத்திற்காக இவ்வாறு பேசுகிறார்.
  rationale: வசனத்தின் முதன்மைச் சூழல் சட்டம் சார்ந்தது. பரந்த மரண தண்டனைக் கோட்பாட்டை இறக்குமதி செய்யாமல், பவுலின் நிபந்தனைக்குட்பட்ட ஒப்புதலையும் நீதிக்கான வலியுறுத்தலையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘சீசர்’ என்பது இங்கு ரோமப் பேரரசரின் பதவிப் பெயராக வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
