revisions:
- from: ஆனால், இந்தக் காரியங்கள் குறித்த விசாரணையைப் பொறுத்தவரை நான் செய்வதறியாமல் இருந்ததால்[a], அவன் எருசலேமுக்குப் போய், அங்கே இவற்றைக் குறித்து தீர்ப்பளிக்கப்பட விரும்புகிறானா[b] என்று கேட்டேன்.
  to: இந்தக் காரியங்கள் தொடர்பான விசாரணையைப் பற்றி நான் குழப்பமடைந்திருந்ததால்[a], அவன் எருசலேமுக்குச் சென்று, அங்கே இவற்றைக் குறித்து தீர்ப்புக்குட்பட விரும்புகிறானா[b] என்று கேட்டேன்.
