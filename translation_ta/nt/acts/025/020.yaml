translation_notes:
  register: நவீன தரத் தமிழில், சட்ட நிர்வாகச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் செயப்பாட்டு நீதித்துறைப் பொருளும், ζήτησις என்பதிலுள்ள ‘விசாரணை/சர்ச்சை’ என்ற நெகிழ்வும் அடிக்குறிப்புடன் பேணப்பட்டுள்ளன.
