base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: ta
  text: இந்தக் காரியங்கள் தொடர்பான விசாரணையைப் பற்றி நான் குழப்பமடைந்திருந்ததால்[a], அவன் எருசலேமுக்குச் சென்று, அங்கே இவற்றைக் குறித்து தீர்ப்புக்குட்பட விரும்புகிறானா[b] என்று கேட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்தக் காரியங்கள் தொடர்பான சர்ச்சையைப் பற்றி நான் குழப்பமடைந்திருந்ததால்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவன் எருசலேமுக்குச் சென்று, அங்கே இவற்றைக் குறித்து விசாரிக்கப்பட விருப்பமுள்ளவனாக இருக்கிறானா.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: செய்வதறியாமல் இருந்ததால்
  rationale: பெயரெச்சம் பெஸ்துவின் குழப்பத்தையும் வழி தெரியாத நிலையையும் குறிக்கிறது; சூழலில் அதன் காரணப்பொருளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ζήτησιν
  choice: விசாரணை
  rationale: நீதித்துறைச் சூழலில் விவாதத்திற்குரிய காரியங்களை ஆராய்வதைக் குறிக்கிறது; ‘கேள்வி’ என்பதைவிட இங்கு தெளிவானது, ‘தகராறு’ என்பதைவிட பரந்தது.
- source_word: ἔλεγον
  choice: கேட்டேன்
  rationale: சொற்பொருள் ‘சொன்னேன்’ என்றாலும், தொடர்ந்து வரும் εἰ அறிமுகப்படுத்தும் மறைமுக வினா காரணமாக இங்கு செயல்பாட்டுப் பொருள் ‘கேட்டேன்’ என்பதாகும்.
- source_word: εἰ βούλοιτο
  choice: விரும்புகிறானா
  rationale: பெஸ்து கேட்ட மறைமுக வினாவின் உள்ளடக்கத்தை இயல்பான தமிழில் தருகிறது; விருப்பம் அல்லது மனச்சம்மதம் என்ற நுண்பொருளைத் திறந்தவாறு வைக்கிறது.
- source_word: πορεύεσθαι
  choice: போய்
  rationale: இடமாற்றத்தைக் குறிக்கும் வினைக்கு இச்சூழலில் இயல்பான, நேரடியான தமிழ்.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற இடப்பெயர் வடிவம்.
- source_word: κἀκεῖ
  choice: அங்கே
  rationale: καὶ ἐκεῖ என்பதன் சுருக்கம்; தீர்ப்பு நிகழ வேண்டிய இடத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: κρίνεσθαι
  choice: தீர்ப்பளிக்கப்பட
  rationale: சட்டரீதியான தீர்ப்புக்கு உட்படுவதைத் தெரிவிக்கும் கிரேக்கச் செயப்பாட்டு வடிவத்தைப் பேணுகிறது; ‘விசாரிக்கப்பட’ என்று மட்டும் குறுக்கவில்லை.
- source_word: περὶ τούτων
  choice: இந்தக் காரியங்கள் குறித்து / இவற்றைக் குறித்து
  rationale: ஒரே விவகாரங்களைச் சுட்டும் இரு நிகழ்வுகளையும் பேணி, தமிழில் தேவையற்ற சொல் மீளுரையைத் தவிர்க்கிறது.
