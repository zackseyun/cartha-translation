translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஏறிச் சென்றார்’ என்பது எருசலேமின் உயரத்தையும் அதற்குச் செல்வதற்கான மரபுவழிப் பயண மொழியையும் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய தெளிவற்ற கிரேக்கச் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
