  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: ta
  text: ஆகவே, பெஸ்து மாகாணத்திற்கு வந்த பிறகு[a], மூன்று நாட்கள் கழித்து செசரியாவிலிருந்து எருசலேமுக்கு ஏறிச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாகாணத்திற்குள் நுழைந்த பிறகு” அல்லது “மாகாணத்தின் பொறுப்பை ஏற்ற பிறகு.” கிரேக்க வினையெச்சம் பெஸ்து தனது மாகாணத்திற்கு வந்ததைக் குறிக்கலாம்; அதன் உட்குறிப்பாக, அவர் அங்கு நிர்வாகப் பொறுப்பை ஏற்றதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் இவ்வசனத்தை இணைத்து, கதை முன்னேறுவதையும் அதன் தொடர்ச்சியையும் காட்டுகிறது; கிரேக்க இணைப்புச் சொல்லின் மென்மையான முடிவு/தொடர்ச்சி நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: மாகாணத்திற்கு வந்த பிறகு
  rationale: மாகாணத்திற்குள் வந்ததைக் குறிக்கும் கால வினையெச்சத் தன்மையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; அவர் நிர்வாகப் பொறுப்பை ஏற்றார் என்ற உட்குறிப்பை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: ἐπαρχείᾳ
  choice: மாகாணம்
  rationale: ரோம அரசின் நிர்வாகப் பகுதியைக் குறிக்கும் வரலாற்றுக்கு ஏற்ற நேரடியான சொல்.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: மூன்று நாட்கள் கழித்து
  rationale: மூன்று நாட்களுக்குப் பின் நிகழ்ந்த காலத் தொடர்ச்சியை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ἀνέβη
  choice: ஏறிச் சென்றார்
  rationale: எருசலேமுக்குச் செல்வதற்குப் பயன்படுத்தப்படும் புவியியல் மற்றும் மரபுவழிப் பொருளான ‘மேலே செல்’ என்பதைக் காக்கிறது.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமுக்கு
  rationale: செல்லும் இலக்கை இயல்பான தமிழில் துல்லியமாகக் குறிக்கிறது.
- source_word: ἀπὸ Καισαρείας
  choice: செசரியாவிலிருந்து
  rationale: பயணம் தொடங்கிய இடத்தைத் துல்லியமாகக் குறிக்கிறது.
- source_word: Φῆστος
  choice: பெஸ்து
  rationale: கிரேக்கப் பெயரின் ஒலியைத் தமிழில் வழக்கமான வேதாகமப் பெயரெழுத்தாக்கத்துக்கு ஏற்றவாறு தருகிறது.
