source:
  edition: SBLGNT
  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: ta
  text: ஆகவே, அவர்கள் இங்கே கூடிவந்தபோது, நான் சிறிதும் தாமதிக்காமல், அடுத்த நாள் நீதிபீடத்தில்[a] அமர்ந்து, அந்த மனிதனைக் கொண்டுவரும்படி கட்டளையிட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிமன்ற மேடையில் அமர்ந்து.” கிரேக்கச் சொல் βῆμα அதிகாரப்பூர்வமான நீதித்துறை இருக்கையையோ நீதிமன்ற மேடையையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: அவர்கள் இங்கே கூடிவந்தபோது
  rationale: இது எழுவாய் வெளிப்படையாகக் கூறப்படாத மரபுத்தொடர் அமைப்பு; சூழலில் குற்றஞ்சாட்டியவர்களையும் தொடர்புடைய தரப்பினரையும் குறிக்கிறது. ‘கூடிவந்தபோது’ என்பது ஒன்றுகூடுதலையும் இங்கே வருதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: பெஸ்துவின் உரையில் முந்தைய கருத்திலிருந்து வரும் தொடர்ச்சியையும் முடிவையும் குறிக்கிறது.
- source_word: ἐνθάδε
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை; சூழலுக்கு நேரான, இயல்பான இணைச்சொல்.
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: நான் சிறிதும் தாமதிக்காமல்
  rationale: வழக்கை ஒத்திவைக்கவோ நடவடிக்கையைத் தாமதிக்கவோ இல்லை என்ற நிர்வாக-நீதித்துறைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τῇ ἑξῆς
  choice: மறுநாளே
  rationale: அடுத்த நாளைக் குறிக்கும் கால மரபுத்தொடர். ‘-ஏ’ தாமதமின்றி அடுத்த நாளிலேயே நடந்ததை இயல்பாக வலியுறுத்துகிறது.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: நீதியிருக்கையில் அமர்ந்து
  rationale: βῆμα என்பது அதிகாரப்பூர்வமாகத் தீர்ப்பு வழங்கும் இருக்கையையோ நீதிமன்ற மேடையையோ குறிக்கிறது. ‘நீதியிருக்கை’ சட்டச் சூழலைச் சுருக்கமாகப் பாதுகாக்கிறது; மேடை மற்றும் இருக்கை ஆகிய இரு நுணுக்கங்களையும் அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: ἐκέλευσα
  choice: கட்டளையிட்டேன்
  rationale: அதிகாரப்பூர்வ உத்தரவைத் தெரிவிக்கும் வினை; நீதித்துறைச் சூழலுக்கு ஏற்றது.
- source_word: ἀχθῆναι
  choice: கொண்டுவரும்படி
  rationale: ἄγω என்பதன் இறந்தகாலச் செயப்பாட்டு வினையெச்சப் பொருளைத் தமிழில் இயல்பான காரணவினை அமைப்பால் வெளிப்படுத்துகிறது; கிரேக்கத்தில் இல்லாத ‘உள்ளே’ என்ற விவரத்தைச் சேர்க்கவில்லை.
- source_word: τὸν ἄνδρα
  choice: அந்த மனிதனை
  rationale: பவுலைக் குறிக்கும் குறிப்பிட்ட ஆணை நேரடியாகத் தருகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘குற்றஞ்சாட்டப்பட்டவர்’ என்பதைச் சேர்க்கவில்லை.
