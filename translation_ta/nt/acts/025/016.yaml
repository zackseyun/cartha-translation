base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: ta
  text: அவர்களிடம் நான், ‘குற்றம் சாட்டப்பட்டவர் தம்மீது குற்றம் சாட்டுகிறவர்களை நேருக்கு நேர் சந்தித்து, தம்மீதான குற்றச்சாட்டைக் குறித்து தற்காப்பு விளக்கம் அளிக்க வாய்ப்புப் பெறுவதற்கு முன்பு, எந்த மனிதரையும் ஒப்படைப்பது ரோமர்களின் வழக்கம் அல்ல’ என்று பதிலளித்தேன்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எந்த மனிதரையும் ஒரு சலுகையாக விட்டுக்கொடுப்பது’; கிரேக்க வினைச்சொல், குற்றம் சாட்டுகிறவர்களின் கோரிக்கையை நிறைவேற்றுவதற்காக ஒருவரை ஒப்படைக்கும் பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘எந்த மனிதரையும்’; இத்தொடர் இலக்கணப்படி ஆண்பால் ஒருமையில் இருந்தாலும், இந்தச் சட்டச் சூழலில் பொதுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: வழக்கம்
  rationale: நிலையாகப் பின்பற்றப்படும் நடைமுறை அல்லது மரபைக் குறிக்கிறது; சட்ட நிர்வாகச் சூழலில் ‘வழக்கம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Ῥωμαίοις
  choice: ரோமர்களின்
  rationale: தத்தி பன்மை இங்கு ரோம மக்களின் அல்லது அவர்களது சட்ட அமைப்பின் வழக்கைக் குறிக்கிறது; ‘ரோமர்களின் வழக்கம்’ தமிழில் இயல்பான அமைப்பு.
- source_word: χαρίζεσθαί
  choice: ஒப்படைப்பது
  rationale: ஒரு தரப்பினரின் வேண்டுகோளை நிறைவேற்றும் சலுகையாக ஒருவரை அவர்களிடம் விட்டுக்கொடுக்கும் சட்டச் சூழலிலான பொருளைத் தெரிவிக்கிறது.
- source_word: τινα ἄνθρωπον
  choice: எந்த மனிதரையும்
  rationale: τινα உடன் வரும் ἄνθρωπον என்பதன் மனித நபரைக் குறிக்கும் வடிவத்தைப் பாதுகாக்கிறது; இச்சட்டச் சூழலில் இது பொதுப்பொருளில் பயன்படுகிறது.
- source_word: ὁ κατηγορούμενος
  choice: குற்றம் சாட்டப்பட்டவர்
  rationale: குற்றச்சாட்டுக்கு உட்பட்ட நபரைக் குறிக்கும் substantival participle-ஐ தெளிவான, நவீன சட்டத் தமிழில் வழங்குகிறது.
- source_word: κατὰ πρόσωπον
  choice: நேருக்கு நேர்
  rationale: குற்றம் சாட்டுபவர்களுடனான நேரடியான எதிர்கொள்ளுதலைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: τόπον ... ἀπολογίας
  choice: தற்காப்பு விளக்கம் அளிக்க வாய்ப்பு
  rationale: τόπος இங்கு இடம் என்பதல்ல, வாய்ப்பு என்பதாகும்; ἀπολογία குற்றச்சாட்டுக்கு எதிராக அளிக்கப்படும் சட்டரீதியான தற்காப்பு விளக்கம்.
- source_word: ἐγκλήματος
  choice: குற்றச்சாட்டு
  rationale: சட்டரீதியான குற்றச்சாட்டு அல்லது வழக்கின் குற்றப்பத்திரிகைச் சார்ந்த குற்றத்தைச் சுட்டுகிறது; ‘குற்றச்சாட்டு’ பொதுவாசகர்களுக்கு தெளிவானது.
