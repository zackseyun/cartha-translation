translation_notes:
  register: நவீன, கண்ணியமான நீதிமன்ற மொழிநடை பயன்படுத்தப்பட்டுள்ளது. பெஸ்துவை நோக்கிப் பேசுவதால் மரியாதை ஒருமை “உமக்கு” வைக்கப்பட்டுள்ளது. “சீசர்” வரலாற்றுப் பட்டமாகப் பாதுகாக்கப்பட்டு, பொதுவாசகருக்குத் தெளிவாக “நீதிமன்றம்,” “விசாரிக்கப்பட வேண்டும்” போன்ற தற்போதைய சட்டச் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
