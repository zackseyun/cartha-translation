source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: ta
  text: ஆனால் பவுல், “நான் சீசரின் நீதிமன்றத்தின் முன் நிற்கிறேன்[a]. அந்த நீதிமன்றத்திலேயே நான் விசாரிக்கப்பட வேண்டும். யூதர்களுக்கு எதிராக நான் எந்தத் தவறும் செய்யவில்லை; நீரே இதை மிக நன்றாக அறிந்திருக்கிறீர்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதித்தீர்ப்பு இருக்கை.” கிரேக்கச் சொல் βῆμα அதிகாரப்பூர்வமான நீதித்தீர்ப்பு இருக்கையையோ, அந்த இருக்கையால் குறிக்கப்படும் நீதிமன்றத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீரே இதை இன்னும் நன்றாக அறிந்திருக்கிறீர்.” கிரேக்கத்தில் ஒப்பீட்டுப் பொருளுடைய κάλλιον என்ற சொல் உள்ளது; இச்சூழலில் அது “மிக நன்றாக” என்றும் பொருள்படலாம்.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: βῆμα
  choice: நீதிமன்றம்
  rationale: இச்சூழலில் இது ரோம அரசின் அதிகாரப்பூர்வ நீதித்தீர்ப்பு இருக்கையையும் அதனால் குறிக்கப்படும் நீதிமன்றத்தையும் குறிக்கிறது. நவீனத் தமிழில் சட்டச் சூழலைத் தெளிவாக உணர்த்த “நீதிமன்றம்” இயல்பானது.
- source_word: Καίσαρος
  choice: சீசரின்
  rationale: இது ரோமப் பேரரசருக்கான பட்டமாக இருந்தாலும், மூலத்தின் வரலாற்று மற்றும் சட்டச் சூழலைப் பாதுகாக்க “சீசர்” என்ற பெயர்ப்பட்டம் வைக்கப்பட்டுள்ளது.
- source_word: ἑστώς εἰμι
  choice: நான் … நிற்கிறேன்
  rationale: நிறைவேற்றுப் பெயரெச்சத்துடன் εἰμί வரும் சுற்றுவழிக் கட்டமைப்பு, பவுலின் தற்போதைய சட்டநிலையை வலியுறுத்துகிறது. “நிற்கிறேன்” அந்த உடனடி நிலையை இயல்பான தமிழில் தருகிறது.
- source_word: δεῖ κρίνεσθαι
  choice: விசாரிக்கப்பட வேண்டும்
  rationale: δεῖ சட்டரீதியான அவசியத்தையும் உரிய அதிகார வரம்பையும் உணர்த்துகிறது; κρίνεσθαι இங்கு நீதிமன்றத்தில் விசாரித்து தீர்ப்பளிக்கப்படுவதைக் குறிக்கிறது.
- source_word: οὐδὲν ἠδίκησα
  choice: எந்த அநீதியும் செய்யவில்லை
  rationale: ἀδικέω தவறு செய்தல், அநீதி இழைத்தல், ஒருவருக்குத் தீங்கு செய்தல் ஆகிய சட்ட மற்றும் ஒழுக்கப் பொருள்களை உடையது. இங்கு “அநீதி செய்யவில்லை” இரு பரிமாணங்களையும் காக்கிறது.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: இது உமக்கே மிக நன்றாகத் தெரியும்
  rationale: καὶ σὺ என்பதன் அழுத்தத்தை “உமக்கே” தருகிறது; ἐπιγινώσκεις மற்றும் κάλλιον ஆகியவற்றின் வலிமையை இயல்பான தமிழில் “மிக நன்றாகத் தெரியும்” வெளிப்படுத்துகிறது. ஒப்பீட்டுப் பொருள் சாத்தியமுள்ளதால் அடிக்குறிப்பில் அது பாதுகாக்கப்பட்டுள்ளது.
