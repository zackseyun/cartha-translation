revisions:
- from: அவர்களிடையே எட்டு அல்லது பத்து நாட்களுக்கு மிகாமல் தங்கியிருந்து, செசரியாவுக்கு இறங்கிச் சென்றான். மறுநாள் நீதியிருக்கையில் அமர்ந்து[a], பவுலைக் கொண்டுவரும்படி கட்டளையிட்டான்.
  to: அவர்களிடையே எட்டு அல்லது பத்து நாட்களுக்கு மேல் தங்காமல், செசரியாவுக்கு இறங்கிச் சென்றான். மறுநாள் நீதிபீடத்தில் அமர்ந்து[a], பவுலைக் கொண்டு வரும்படி கட்டளையிட்டான்.
  rationale: The revision improves modern Tamil idiom for the limited duration of the stay and replaces a less familiar legal term with “நீதிபீடம்.” It retains the source’s temporal sequence, directional “went down,” judicial setting, and passive sense that Paul was to be brought. The footnote marker is correctly attached to the expression translating βῆμα.
