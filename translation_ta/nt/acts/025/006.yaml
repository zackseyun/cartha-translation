source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: ta
  text: அவர்களிடையே எட்டு அல்லது பத்து நாட்களுக்கு மேல் தங்காமல், செசரியாவுக்கு இறங்கிச் சென்றான். மறுநாள் நீதிபீடத்தில் அமர்ந்து[a], பவுலைக் கொண்டு வரும்படி கட்டளையிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிமன்ற மேடையில் அமர்ந்து.” கிரேக்கச் சொல்லான βῆμα அதிகாரப்பூர்வ நீதிபீடத்தையோ நீதிமன்ற மேடையையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας
  choice: தங்கியிருந்து
  rationale: முதன்மை வினைக்கு முன்பு நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகால வினையெச்சம்; நாட்களைக் குறிப்பதோடு இயல்பாக இணைகிறது.
- source_word: ἐν αὐτοῖς
  choice: அவர்களிடையே
  rationale: முன்பு குறிப்பிடப்பட்டவர்களின் இடத்திலும் சமூகச் சூழலிலும் பெஸ்து தங்கியிருந்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: எட்டு அல்லது பத்து நாட்களுக்கு மிகாமல்
  rationale: οὐ πλείους என்பதன் மேலெல்லையையும், ὀκτὼ ἢ δέκα என்பதிலுள்ள கணக்கின் நெகிழ்வையும் காக்கிறது.
- source_word: καταβὰς
  choice: இறங்கிச் சென்றான்
  rationale: எருசலேமிலிருந்து செசரியாவை நோக்கிய பயணத்தின் திசையைக் குறிக்கும் மூலமொழிச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: Καισάρειαν
  choice: செசரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட இடப்பெயர் வடிவம்.
- source_word: τῇ ἐπαύριον
  choice: மறுநாள்
  rationale: அங்கு சென்றதற்கு அடுத்த நாளைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: நீதியிருக்கையில் அமர்ந்து
  rationale: βῆμα குறிக்கும் அதிகாரப்பூர்வ நீதியிருக்கை அல்லது நீதிமன்ற மேடை என்ற சட்டச் சூழலைத் தெரிவிக்கிறது; சொல்லின் பரப்பை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: ἐκέλευσεν
  choice: கட்டளையிட்டான்
  rationale: அதிகாரப்பூர்வமான நீதித்துறை உத்தரவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀχθῆναι
  choice: கொண்டுவரும்படி
  rationale: ἄγω என்பதன் செயப்பாட்டு வினையெச்சப் பொருளை நீதிமன்றச் சூழலில் இயல்பான தமிழில் வழங்குகிறது.
