translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சட்டச் சூழல் நடையைப் பயன்படுத்துகிறது. மூலத்தில் பெயர் மீண்டும் வராததால் தமிழிலும் எழுவாய் மறைநிலையாக வைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிக் குறியீடு நாட்களின் பின்னர் இருந்தாலும் அதன் உள்ளடக்கம் βῆμα பற்றியது என்பதால், தொடர்புடைய ‘நீதியிருக்கை’ என்பதற்குப் பின்னர் குறியீடு வைக்கப்பட்டுள்ளது.
