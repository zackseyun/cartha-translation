    text: அல்லது, “நீதிமன்ற மேடையில் அமர்ந்து.” கிரேக்கச் சொல்லான βῆμα அதிகாரப்பூர்வ நீதிபீடத்தையோ நீதிமன்ற மேடையையோ குறிக்கிறது.
    reason: lexical_alternative
  revision_rationale: The revision improves modern Tamil idiom for the limited duration of the stay and replaces a less familiar legal term with “நீதிபீடம்.” It retains the source’s temporal sequence, directional “went down,” judicial setting, and passive sense that Paul was to be brought. The footnote marker is correctly attached to the expression translating βῆμα.
