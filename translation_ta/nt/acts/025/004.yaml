  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: ta
  text: எனவே பெஸ்து, பவுல் செசரியாவில் காவலில் வைக்கப்பட்டிருக்கிறார் என்றும், தாமே விரைவில் புறப்படவிருப்பதாகவும் பதிலளித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: காவலில் வைக்கப்பட்டிருக்கிறார்
  rationale: சூழலில் பவுல் செசரியாவில் அதிகாரப்பூர்வக் காவலில் வைக்கப்பட்டிருப்பதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐν τάχει
  choice: விரைவில்
  rationale: காலத் தாமதமின்றி, சீக்கிரமாக என்ற மூலப்பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐκπορεύεσθαι
  choice: அங்குப் புறப்பட்டுச் செல்லவிருப்பதாக
  rationale: செசரியாவை நோக்கிய அடுத்த பயணத்தைச் சூழலுக்கேற்ப வெளிப்படுத்துகிறது; கிரேக்க வினையின் புறப்படுதல் என்ற கருத்தையும் காக்கிறது.
