  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. ‘தாமே’ என்பது ἑαυτόν என்பதன் வலியுறுத்தலை இயல்பாகக் காக்கிறது.
