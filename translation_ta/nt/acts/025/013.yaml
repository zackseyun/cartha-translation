base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: ta
  text: சில நாட்கள் கடந்த பின், அகிரிப்பா அரசனும் பெர்னீக்கேயும்[a] பெஸ்துவைச் சந்தித்து வாழ்த்துவதற்காக செசரியாவுக்கு வந்து சேர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பெயரை “பெரெனீக்கே” என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: சில நாட்கள் கடந்தபின்
  rationale: இது காலப் பின்னணியைக் குறிக்கும் genitive absolute அமைப்பு. δέ இங்கே மென்மையான கதைத் தொடர்ச்சியைக் காட்டுவதால், தமிழில் தனியே ஒரு வலுவான இணைப்புச்சொல் சேர்க்காமல் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: அகிரிப்பா அரசன்
  rationale: βασιλεύς என்பதன் அரசப் பட்டத்தைத் தெளிவாகக் காத்து, தமிழின் இயல்பான பெயர்-பட்ட வரிசையில் வழங்குகிறது.
- source_word: Βερνίκη
  choice: பெர்னீக்கே
  rationale: கிரேக்கப் பெயரின் ஒலியமைப்புக்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான ஒலிபெயர்ப்பு. மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: κατήντησαν εἰς Καισάρειαν
  choice: செசரியாவுக்கு வந்து சேர்ந்தார்கள்
  rationale: பயணத்தின் இலக்கை அடைந்த நிகழ்வை κατήντησαν குறிக்கிறது; εἰς என்பதன் இலக்கு உணர்வை “-க்கு” காக்கிறது.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: பெஸ்துவை வாழ்த்துவதற்காக
  rationale: ἀσπάζομαι என்பதன் சந்தித்து வாழ்த்துதல் என்ற அடிப்படைப் பொருளைக் காக்கிறது. “மரியாதை செலுத்த” என்பது அரசவைக் குறிப்பை அளவுக்கு மீறிச் சேர்க்கக்கூடும்.
- source_word: Φῆστον
  choice: பெஸ்து
  rationale: ரோம ஆளுநரின் பெயருக்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு.
