  to: சில நாட்கள் கடந்த பின், அகிரிப்பா அரசனும் பெர்னீக்கேயும்[a] பெஸ்துவைச் சந்தித்து வாழ்த்துவதற்காக செசரியாவுக்கு வந்து சேர்ந்தார்கள்.
