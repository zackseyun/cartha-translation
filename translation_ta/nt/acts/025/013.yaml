translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கதைநடையின் சுருக்கமும், பயண இலக்கும், வருகையின் நோக்கமும் தெளிவாக வைக்கப்பட்டுள்ளன.
