  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: ta
  text: ஏனெனில், ஒரு கைதியை அனுப்பும்போது அவனுக்கு எதிரான குற்றச்சாட்டுகளையும் தெரிவிக்காமல்[a] இருப்பது நியாயமற்றது என்று எனக்குத் தோன்றுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குற்றச்சாட்டுகளைக் குறிப்பிட்டுச் சொல்லாமல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογον
  choice: நியாயமற்றது
  rationale: இச்சொல் இங்கு காரணத்துக்கும் முறையான நிர்வாக நடைமுறைக்கும் பொருந்தாததைக் குறிக்கிறது. ‘நியாயமற்றது’ என்பது பெஸ்துவின் மதிப்பீட்டை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: δοκεῖ μοι
  choice: எனக்குத் தோன்றுகிறது
  rationale: கிரேக்க மொழியின் தனிப்பட்ட, ஓரளவு மதிப்பீட்டுத் தன்மையுள்ள சொல்லமைப்பை இது நேரடியாகப் பாதுகாக்கிறது.
- source_word: πέμποντα
  choice: அனுப்பும்போது
  rationale: நிகழ்காலப் பங்கேற்புவினையின் சூழ்நிலைத் தொடர்பைத் தமிழில் இயல்பான காலவினையெச்ச அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: δέσμιον
  choice: ஒரு கைதியை
  rationale: சட்ட மற்றும் காவல் சூழலில் δέσμιος என்பதற்கான தெளிவான, வழக்கமான நவீனத் தமிழ் இணைச்சொல் ‘கைதி’ ஆகும்.
- source_word: μὴ καὶ
  choice: குற்றச்சாட்டுகளையும் தெரிவிக்காமல்
  rationale: καί என்பதன் கூட்டிச் சேர்க்கும் வலிமையை ‘-உம்’ விகுதி காக்கிறது; μὴ என்பதன் எதிர்மறைப் பொருள் ‘தெரிவிக்காமல்’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: அவனுக்கு எதிரான குற்றச்சாட்டுகள்
  rationale: நீதித்துறைச் சூழலில் αἰτίαι என்பது ஒருவர்மீது சுமத்தப்படும் சட்டரீதியான குற்றச்சாட்டுகளைக் குறிக்கிறது.
- source_word: σημᾶναι
  choice: தெரிவிக்க
  rationale: σημαίνω என்பதன் ‘அறியச்செய்தல்/சுட்டிக்காட்டுதல்’ என்ற பரப்பை ‘தெரிவிக்க’ இயல்பாகக் கொண்டுவருகிறது; ‘குறிப்பிட்டுச் சொல்ல’ என்பதும் சாத்தியமான, சற்று வலுவான மாற்று.
