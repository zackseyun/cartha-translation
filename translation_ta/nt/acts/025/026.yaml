  source_fidelity: மூலத்தின் முக்கியப் பொருள் காக்கப்பட்டுள்ளது. ஆனால் 'ἀσφαλές τι' என்பது வெறுமனே 'உறுதியான எதுவும்' அல்ல; பேரரசருக்கு எழுதத்தக்க தெளிவான/உறுதியான தகவல் அல்லது குற்றச்சாட்டு இல்லை என்ற நிர்வாகப் பொருளில் வருகிறது. மேலும் ὅπως நோக்கத்தைக் குறிக்கிறது; தமிழில் 'கிடைக்கும்படி' என்பதற்குப் பதில் 'எழுதுவதற்கு ஏதாவது இருக்க வேண்டும் என்பதற்காக' என்பது பேசுபவரின் நோக்கத்தைத் தெளிவாகத் தருகிறது.
