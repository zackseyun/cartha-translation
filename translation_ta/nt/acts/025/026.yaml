id: ACT.25.26
reference: Acts 25:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: ta
  text: அவனைப் பற்றி என் ஆண்டவருக்கு[a] எழுதுவதற்கு தெளிவானதாக எதையும் என்னிடம் இல்லை. ஆகவே, விசாரணை நடந்த பிறகு[b] எழுதுவதற்கு ஏதாவது இருக்க வேண்டும் என்பதற்காக, அவனை உங்கள் அனைவரின் முன்னிலையிலும், குறிப்பாக உம்முன், அகிரிப்பா அரசே, கொண்டுவந்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ‘பேரரசருக்கு.’ கிரேக்கத்தில் ‘என் ஆண்டவருக்கு’ என்று உள்ளது; இந்த அரச நிர்வாகச் சூழலில் அது பேரரசருக்கான வழக்கமான மரியாதைப் பட்டமாகும்.
    reason: alternative_reading
  - marker: b
    text: ‘விசாரணை’ என்பதை ‘விசாரணைக் கேட்பு’ அல்லது ‘நீதித்துறை ஆய்வு’ என்றும் மொழிபெயர்க்கலாம்; இது பவுலின் வழக்கைப் பற்றிய அதிகாரப்பூர்வ விசாரணையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: உறுதியான எதுவும்
  rationale: ἀσφαλές என்பது உறுதியான, நிச்சயமான, நம்பத்தக்க ஒன்றைக் குறிக்கிறது. குற்றச்சாட்டைப் பற்றிய அதிகாரப்பூர்வ அறிக்கைக்கான தெளிவான ஆதாரம் பெஸ்துவிடம் இல்லை என்பதைக் சட்டநிர்வாகச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῷ κυρίῳ
  choice: என் ஆண்டவருக்கு
  rationale: κύριος என்பதன் அடிப்படைப் பொருளைத் தக்கவைக்கிறது; இங்கு அது ரோமப் பேரரசரைச் சுட்டும் அதிகாரப்பூர்வ மரியாதைப் பட்டம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: προήγαγον
  choice: கொண்டுவந்திருக்கிறேன்
  rationale: ஒருவரை மக்கள் முன்னிலையில் கொண்டுவருதல் அல்லது ஆஜர்படுத்துதல் என்ற பொருளைத் தருகிறது; நிகழ்ந்த செயல் தற்போதைய விசாரணை நோக்குடன் தொடர்புடையதால் இவ்வினைவடிவம் இயல்பாக உள்ளது.
- source_word: ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ
  choice: உங்கள் அனைவருக்கும் முன்பாகவும், குறிப்பாக ... உங்களுக்கு முன்பாகவும்
  rationale: முதலில் வரும் பன்மை ὑμῶν என்பதையும் பின்னர் அகிரிப்பாவை நோக்கிய ஒருமை σοῦ என்பதையும் தெளிவாக வேறுபடுத்துகிறது.
- source_word: βασιλεῦ Ἀγρίππα
  choice: அகிரிப்பா அரசே
  rationale: விளிவேற்றுமையிலுள்ள பட்டத்தையும் பெயரையும் இயல்பான நவீனத் தமிழில் நேரடி அழைப்பாக வழங்குகிறது.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: விசாரணை நடந்த பிறகு
  rationale: ἀνάκρισις குறிக்கும் நீதித்துறை ஆய்வு அல்லது கேள்வி விசாரணையைத் தெரிவித்து, genitive absolute அமைப்பின் காலப்பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σχῶ τί γράψω
  choice: எழுதுவதற்கு ஏதாவது எனக்குக் கிடைக்கும்படி
  rationale: அதிகாரப்பூர்வமாக எழுதுவதற்குரிய தகவல் அல்லது பொருள் கிடைப்பதை நோக்கமாகக் கொண்ட கிரேக்கச் சொல்லமைப்பை இயல்பான தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: இறையியல் சாராத அரசச் சூழலில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: என் ஆண்டவர்
  alternative: பேரரசர்
  rationale: இங்கு κύριος என்பது கடவுளையோ கிறிஸ்துவையோ அல்ல, ரோமப் பேரரசரை அதிகாரப்பூர்வ மரியாதையுடன் குறிக்கிறது. மூலச்சொல்லின் வடிவத்தை முதன்மை உரை தக்கவைக்கிறது; அதன் குறிப்பிட்ட சுட்டுப்பொருளை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்ற மற்றும் அரச நிர்வாகச் சூழலுக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பன்மையான அவையினருக்கும் ஒருமையில் அகிரிப்பாவுக்கும் இடையிலான வேறுபாடு வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது; κύριος என்பதன் சொற்பொருளும் சூழல்சார் சுட்டுப்பொருளும் முதன்மை உரை–அடிக்குறிப்பு இணைப்பில் தக்கவைக்கப்பட்டுள்ளன.
