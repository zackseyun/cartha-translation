translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டச் சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் காலத் தொடர்பும், சுற்றி நின்ற காட்சியும், குற்றச்சாட்டுகளை நிரூபிக்க முடியாத நிலையும் பாதுகாக்கப்பட்டுள்ளன.
