source:
  edition: SBLGNT
  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: ta
  text: அவர் வந்தபோது, எருசலேமிலிருந்து இறங்கி வந்திருந்த யூதர்கள்[b] அவரைச் சுற்றி நின்று[a], தங்களால் நிரூபிக்க முடியாத பல கடுமையான குற்றச்சாட்டுகளை அவர்மீது சுமத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரைச் சூழ்ந்துகொண்டார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஒருவரைச் சுற்றி நிற்பதை வலியுறுத்தலாம்; இச்சட்ட விசாரணைச் சூழலில் அந்த நிலை அழுத்தத்தையும் உணர்த்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘யூதேயர்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு எருசலேமிலிருந்து வந்த யூதக் குற்றஞ்சாட்டிகளைக் குறிப்பதால் ‘யூதர்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; யூதேயாவில் வசித்தவர்களை மட்டும் இது குறிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: அவர் வந்தபோது
  rationale: இந்தப் பிறவேற்றுமைத் தனிநிலைத் தொடர் காலச் சூழலைக் குறிக்கிறது. கிரேக்கத்தில் உள்ள பிரதிப்பெயரைப் போலவே நபரின் பெயரைச் சேர்க்காமல் வைத்து, இயல்பான தமிழில் நிகழ்வின் தொடர்ச்சியைத் தெரிவிக்கிறது.
- source_word: περιέστησαν αὐτὸν
  choice: அவரைச் சுற்றி நின்று
  rationale: வினைச்சொல் ஒருவரைச் சுற்றிலும் நிற்பதைக் குறிக்கிறது. சட்ட விசாரணைச் சூழலில் அழுத்தம் இருந்திருக்கலாம் என்றாலும், ‘சூழ்ந்துகொண்டார்கள்’ என்று பகைமையை மிகைப்படுத்தாமல் காட்சியை நேரடியாக வழங்குகிறது.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: எருசலேமிலிருந்து இறங்கி வந்திருந்த யூதர்கள்
  rationale: எருசலேமிலிருந்து செசரியாவுக்குச் சென்றது வழக்கமான புவியியல் சொல்லாட்சியின்படி ‘இறங்கி வந்தது’ என மொழிபெயர்க்கப்படுகிறது. Ἰουδαῖοι இங்கு எருசலேமிலிருந்து வந்த யூதக் குற்றஞ்சாட்டிகளைக் குறிக்கிறது.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: பல கடுமையான குற்றச்சாட்டுகள்
  rationale: αἰτιώματα சட்டரீதியான குற்றச்சாட்டுகளையும், βαρέα அவற்றின் தீவிரத்தையும் குறிக்கின்றன. இச்சொற்றொடர் நவீனத் தமிழில் தெளிவாகவும் சட்டச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: καταφέροντες
  choice: அவர்மீது சுமத்தினார்கள்
  rationale: சட்டச் சூழலில் குற்றச்சாட்டுகளை ஒருவருக்கு எதிராக முன்வைப்பது அல்லது சுமத்துவது என்ற பொருள். தமிழில் ‘குற்றச்சாட்டுகளை அவர்மீது சுமத்தினார்கள்’ என்பது இயல்பான இணைச்சொல்.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: தங்களால் நிரூபிக்க முடியாத
  rationale: ἰσχύω உடன் வரும் வினையெச்சம் திறன் அல்லது இயலாமையைக் குறிக்கிறது; ἀποδείκνυμι நிரூபிப்பதைக் குறிக்கிறது. குற்றச்சாட்டுகளோடு தொடர்புடைய பெயரெச்சத் தொடராகத் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
