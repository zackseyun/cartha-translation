  text: περὶ οὗ σταθέντες οἱ κατήγοροι οὐδεμίαν αἰτίαν ⸀ἔφερον ὧν ⸂ἐγὼ ὑπενόουν⸃ ⸀πονηρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/018.yaml
  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: ta
  text: அவரைக் குறித்து[a] குற்றஞ்சாட்டியவர்கள் எழுந்து நின்றபோது, நான் சந்தேகித்துக்கொண்டிருந்த தீய செயல்கள் தொடர்பாக அவர்கள் அவர்மீது எந்தக் குற்றச்சாட்டையும் சுமத்தவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் சந்தேகித்த குற்றங்கள் தொடர்பாக அவர்கள் அவர்மீது எந்தக் குற்றச்சாட்டையும் சுமத்தவில்லை.” கிரேக்கத்தில் “தீயவை” என்று உள்ளது; அது சட்டப்படி வரையறுக்கப்பட்ட குற்றங்களை மட்டும் அல்லாமல், தவறான செயல்களைப் பொதுவாகவும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: அவரைக் குறித்து
  rationale: περί உடன் வரும் ஆறாம் வேற்றுமை உறவுப்பெயர் பவுலை விவாதப் பொருளாகக் குறிப்பிடுகிறது; இத்தொடர் அதை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: σταθέντες
  choice: எழுந்து நின்றபோது
  rationale: ἵστημι என்பதன் இறந்தகால வினையெச்சம் இங்கு காலப்பொருளில் வந்து, நீதிமன்றத்தில் குற்றஞ்சாட்டுவோர் தங்கள் வழக்கை முன்வைக்க எழுந்து நிற்பதைக் குறிக்கிறது.
- source_word: οἱ κατήγοροι
  choice: குற்றஞ்சாட்டியவர்கள்
  rationale: சட்டச் சூழலில் குற்றச்சாட்டுகளைக் கொண்டுவருகிறவர்களை நேரடியாகவும் பொதுமக்களுக்குப் புரியும் வகையிலும் குறிக்கிறது.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: ஒன்றைக்கூட அவர்மீது குற்றச்சாட்டாகக் கொண்டுவரவில்லை
  rationale: φέρειν αἰτίαν என்பது சட்டச் சூழலில் குற்றச்சாட்டைக் கொண்டுவருதல் அல்லது முன்வைத்தல் என்ற பொருளுடையது; οὐδεμίαν என்பதன் முழுமையான மறுப்பை ‘ஒன்றைக்கூட’ தெளிவாக்குகிறது.
- source_word: ὧν
  choice: தீய செயல்களில்
  rationale: பன்மை உறவுப்பெயரின் பகுதி/வகை சார்ந்த உறவைத் தமிழில் இயல்பாகக் காட்டி, எதிர்பார்க்கப்பட்ட செயல்களின் வகையிலிருந்து எந்தக் குற்றச்சாட்டும் வரவில்லை என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: ἐγὼ ὑπενόουν
  choice: நான் சந்தேகித்துக்கொண்டிருந்த
  rationale: இறந்தகாலத்தில் நீடித்த முன் எண்ணம் அல்லது சந்தேகத்தை imperfect வடிவம் காட்டுவதால், ‘சந்தேகித்துக்கொண்டிருந்த’ அந்த நிறைவேறாத எதிர்பார்ப்பைத் தக்கவைக்கிறது.
- source_word: πονηρῶν
  choice: தீய செயல்கள்
  rationale: நடுநிலைப் பன்மையான πονηρῶν பொதுவாகத் தீய காரியங்கள் அல்லது தவறான செயல்களைக் குறிக்கலாம்; ‘குற்றங்கள்’ என்று சட்டரீதியாக மிகத் துல்லியப்படுத்தாமல் மூலத்தின் பரப்பை இது காக்கிறது.
