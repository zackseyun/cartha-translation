revisions:
- from: அவரைக் குறித்து[a] குற்றஞ்சாட்டியவர்கள் எழுந்து நின்றபோது, நான் சந்தேகித்துக்கொண்டிருந்த தீய செயல்களில் ஒன்றைக்கூட அவர்மீது குற்றச்சாட்டாகக் கொண்டுவரவில்லை.
  to: அவரைக் குறித்து[a] குற்றஞ்சாட்டியவர்கள் எழுந்து நின்றபோது, நான் சந்தேகித்துக்கொண்டிருந்த தீய செயல்கள் தொடர்பாக அவர்கள் அவர்மீது எந்தக் குற்றச்சாட்டையும் சுமத்தவில்லை.
  rationale: The revision retains the temporal force of σταθέντες, the courtroom sense of αἰτίαν ἔφερον, and the ongoing past sense of ὑπενόουν. It also represents πονηρῶν broadly as “தீய செயல்கள்,” while making clear that the absent accusation concerned those suspected acts rather than treating the acts themselves as countable charges.
