  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: ta
  text: ஆனால் பவுல், பேரரசரின்[a] தீர்ப்புக்காகத் தன்னைக் காவலில் வைத்திருக்கும்படி மேல்முறையீடு செய்ததால், நான் அவரைச் சீசரிடம் அனுப்பும்வரை காவலில் வைத்திருக்கக் கட்டளையிட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “செபஸ்தோஸ்” (Σεβαστός) என்று உள்ளது; இது இலத்தீன் “அகஸ்து” என்பதற்கு இணையான ரோமப் பேரரசரின் பட்டம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: மேல்முறையீடு செய்ததால்
  rationale: ரோம நீதித்துறைச் சூழலில் இது உயர் அதிகாரியிடம் செய்யப்படும் முறையான மேல்முறையீட்டைக் குறிக்கிறது; நவீன தமிழில் சட்டப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: காவலில் வைத்திருக்கும்படி / காவலில் வைத்திருக்க
  rationale: இங்கு τηρέω என்பது வெறுமனே பாதுகாப்பதையோ கவனிப்பதையோ அல்ல, அதிகாரபூர்வத் தடுப்புக்காவலைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே காவல் சார்ந்த பொருள் காக்கப்பட்டுள்ளது.
- source_word: διάγνωσιν
  choice: தீர்ப்பு
  rationale: நீதித்துறை சார்ந்த முடிவை இயல்பான தமிழில் குறிக்கிறது; விசாரணை என்ற சொல்லைவிட முடிவெடுக்கும் நுணுக்கத்தை நன்றாகக் காக்கிறது, அதேவேளை குற்றத்தீர்ப்பு என்று மிகைப்படுத்தவில்லை.
- source_word: Σεβαστοῦ
  choice: பேரரசரின்
  rationale: Σεβαστός இங்கு ரோமப் பேரரசருக்குரிய ‘அகஸ்து’ என்ற பட்டமாகப் பயன்படுகிறது. ‘பேரரசர்’ என்பது சூழலில் தெளிவான, இயல்பான தமிழ்; மூலத்தின் பட்டப்பெயர் நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀναπέμψω
  choice: அனுப்பும்வரை
  rationale: உயர் பேரரசு அதிகாரியிடம் அனுப்புவதைக் குறிக்கிறது. வினையின் திசைநுணுக்கத்தைச் செயற்கையாக விரிக்காமல் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: πρὸς Καίσαρα
  choice: சீசரிடம்
  rationale: Καίσαρ இங்கு ரோமப் பேரரசரின் பட்டமாகச் செயல்படுகிறது; வரலாற்றுச் சொல்லாட்சியை ‘சீசர்’ எனக் காக்கிறது.
