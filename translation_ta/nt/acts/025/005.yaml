revisions:
- from: ஆகவே, உங்களிடையே அதிகாரமுள்ளவர்கள்[a] என்னுடன் இறங்கி வந்து, அந்த மனிதனிடம் தவறானது ஏதாவது இருந்தால், அவன்மீது குற்றஞ்சாட்டட்டும்.[b]
  to: ஆகவே, உங்களிடையே வல்லவர்களாக இருப்பவர்கள்[a] என்னுடன் இறங்கிச் செல்லட்டும்; அந்த மனிதனிடம் ஏதாவது தவறு இருந்தால், அவர்கள் அவன்மீது குற்றஞ்சாட்டட்டும்.[b]
  rationale: The revision replaces the overly determinate “அதிகாரமுள்ளவர்கள்” with a broader substantive expression that preserves the range of δυνατοί and retains its contextual alternatives in the note. It also smooths the travel expression while preserving the sense of descending together with Festus. No theological or doctrinal interpretation is introduced.
