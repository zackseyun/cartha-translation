base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: ta
  text: ஆகவே, உங்களிடையே வல்லவர்களாக இருப்பவர்கள்[a] என்னுடன் இறங்கிச் செல்லட்டும்; அந்த மனிதனிடம் ஏதாவது தவறு இருந்தால், அவர்கள் அவன்மீது குற்றஞ்சாட்டட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களிடையே திறனுள்ளவர்கள்,” “உங்களிடையே செல்வாக்குள்ளவர்கள்,” அல்லது “உங்களிடையே முக்கியமானவர்கள்.” δυνατοί என்ற கிரேக்கச் சொல் வல்லமை, திறமை, செல்வாக்கு, அல்லது முக்கியத்துவம் உடையவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுக்கு எதிராகக் குற்றச்சாட்டுகளை முன்வைக்கட்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: ஆகவே, ...வர்கள் ...ட்டும்
  rationale: οὖν முந்தைய கூற்றிலிருந்து தொடரும் முடிவைச் சுட்டுகிறது; தமிழில் ‘ஆகவே’ இயல்பாக அதைக் காட்டுகிறது. பெயர்ச்சொல்லாகப் பயன்படும் பெயரடை, முழு வாக்கிய அமைப்பில் ‘...வர்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: உங்களிடையே அதிகாரமுள்ளவர்கள்
  rationale: δυνατοί என்பதற்கு திறனுள்ளவர்கள், வல்லவர்கள், செல்வாக்கு அல்லது அதிகாரமுள்ளவர்கள் என்ற பொருள் வரலாம். ஆட்சிசார் சட்டச் சூழலில் பிரதிநிதிகளாகச் செல்லக்கூடிய அதிகார நிலையுடையவர்களை இது குறிக்க வாய்ப்புள்ளதால் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது; பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: φησίν
  choice: முதன்மை உரையில் தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: இது ‘அவர் கூறுகிறார்’ என்ற இடைச்செருகல் தன்மையுள்ள அறிக்கைச் சொல். தமிழில் நேர்கூற்றின் நடுவே இதைச் சேர்ப்பது செயற்கையாக இருப்பதால், உரையாடல் சூழலிலேயே அதன் பணி வெளிப்படுகிறது.
- source_word: συγκαταβάντες
  choice: என்னுடன் இறங்கி வந்து
  rationale: σύν உடன்செல்லுதலையும் καταβαίνω கீழிறங்கிச் செல்லுதலையும் குறிக்கின்றன. எருசலேமிலிருந்து செசரியாவுக்குச் செல்லும் புவியியல் வழக்கை ‘இறங்கி’ காக்கிறது; பேச்சாளருடன் சென்று இலக்கை அடைவதை ‘வந்து’ இயல்பாக்குகிறது.
- source_word: εἴ τί ἐστιν
  choice: ஏதாவது இருந்தால்
  rationale: நிபந்தனையையும் τί என்பதன் வரையறுக்கப்படாத பொருளையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἐν τῷ ἀνδρὶ
  choice: அந்த மனிதனிடம்
  rationale: ἐν என்பதன் அடிப்படை ‘இல்/உள்ளே’ சார்ந்த பொருளை, ஒருவரிடம் குறை காணப்படுதல் என்ற தமிழ்ச் சொல்லாட்சியில் ‘மனிதனிடம்’ வெளிப்படுத்துகிறது. இதை ‘அவனுக்கு எதிராக’ என மாற்றி சட்டக் குற்றச்சாட்டின் பொருளை முன்கூட்டியே திணிக்கவில்லை.
- source_word: ἄτοπον
  choice: தவறானது
  rationale: ἄτοπον என்பது பொருத்தமற்றது, தவறானது, முறைகேடானது எனப் பரந்த பொருளுடையது. ‘குற்றம்’ அல்லது ‘குற்றச்செயல்’ எனச் சட்டப் பொருளை மிகைப்படுத்தாமல் ‘தவறானது’ அதன் பரப்பைக் காக்கிறது.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: அவன்மீது குற்றஞ்சாட்டட்டும்
  rationale: κατηγορέω குற்றஞ்சாட்டுதல் அல்லது குற்றச்சாட்டுகளை முன்வைத்தல் என்று பொருள்படும். கிரேக்க மூன்றாம் நபர் பன்மை கட்டளையை ‘...ட்டும்’ என்பதும் αὐτοῦ-ஐ இயல்பான தமிழில் ‘அவன்மீது’ என்பதும் வழங்குகின்றன.
