- from: அப்போது அகிரிப்பா பெஸ்துவிடம், “அந்த மனிதர் பேசுவதை நானே[a] கேட்க விரும்புகிறேன்” என்றார். அதற்கு பெஸ்து, “நாளை நீர் அவர் பேசுவதைக் கேட்பீர்[c]” என்கிறார்[b].
  to: அப்போது அகிரிப்பா பெஸ்துவிடம், “அந்த மனிதரைக் நானே[a] கேட்க விரும்புகிறேன்” என்றார். பெஸ்து, “நாளை நீர் அவரைக் கேட்பீர்[c]” என்கிறார்[b].
  rationale: The revision removes an unnecessary explicit reference to the man’s speaking from the main text, rendering the Greek’s direct object more closely as “அந்த மனிதரைக் ... கேட்க.” It retains the draft’s valid handling of the imperfect wish as a present polite desire, the emphatic reading “நானே,” the formal address, and the historical-present “என்கிறார்.” Footnote anchors and all three footnotes are retained and aligned with the revised wording.
