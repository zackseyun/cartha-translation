base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: ta
  text: அப்போது அகிரிப்பா பெஸ்துவிடம், “அந்த மனிதரைக் நானே[a] கேட்க விரும்புகிறேன்” என்றார். பெஸ்து, “நாளை நீர் அவரைக் கேட்பீர்[c]” என்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நானும்” என்றும் மொழிபெயர்க்கலாம்; καὶ αὐτός என்பது தன்வலியுறுத்தலோடு கூடுதற்பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் இங்கு வரலாற்று நிகழ்காலமான “என்கிறார்” உள்ளது; தமிழில் இதை “என்றார்” என்றும் இயல்பாக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அவரிடமிருந்து கேட்பீர்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் அந்த நபர் பேசுவதை நேரடியாகக் கேட்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: அகிரிப்பா
  rationale: தனிப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு தரப்பட்டுள்ளது.
- source_word: δὲ
