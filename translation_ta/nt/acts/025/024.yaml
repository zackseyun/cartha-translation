source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: ta
  text: 'அப்போது பெஸ்து கூறுகிறார்: “அகிரிப்பா அரசரே, எங்களுடன் இங்கே கூடியிருக்கும் ஆண்கள் அனைவரே, இந்த மனிதரைப் பாருங்கள். இவனைப் பற்றி யூதர்களின் மொத்தக் கூட்டமும்[a] எருசலேமிலும் இங்கேயும் என்னிடம் முறையிட்டு, ‘இவன் இனியும் உயிரோடு இருக்கக் கூடாது’[b] என்று கூக்குரலிட்டது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்களின் பெருங்கூட்டம் முழுவதும்.” கிரேக்கத்தில் கூட்டுத் தொகுதியைக் குறிக்கும் சொற்றொடர் உள்ளது. இது பெஸ்து எதிர்ப்பைத் தொகுத்துக் கூறுவதைப் பிரதிபலிக்கிறது; விதிவிலக்கின்றி ஒவ்வொரு யூதரையும் அவசியமாகக் குறிக்காது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இவன் இனிமேல் வாழக் கூடாது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: கூறுகிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தக்கவைத்து, லூக்காவின் உயிரோட்டமான கதைநடையை வெளிப்படுத்துகிறது.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: எங்களுடன் இங்கே கூடியிருக்கும் ஆண்கள் அனைவரே
  rationale: பெஸ்துவுடன் அந்த நிகழ்வில் இருந்த ஆண்களை நேரடியாக அழைக்கும் முறையான விளிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: θεωρεῖτε τοῦτον
  choice: இந்த மனிதரைப் பாருங்கள்
  rationale: சபையினரின் கவனத்தைப் பவுலின்மீது திருப்பும் சூழல்சார் பொருளை இயல்பாக வெளிப்படுத்துகிறது; இலக்கண வடிவில் நிகழ்காலச் சுட்டல் இருந்தாலும், தமிழில் இங்கு ஏவல் வடிவமே இயல்பானது.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: யூதர்களின் மொத்தக் கூட்டமும்
  rationale: πλῆθος என்பதன் கூட்டுத் தொகுதி உணர்வையும் ἅπαν என்பதன் முழுமை வலியுறுத்தலையும் காக்கிறது; ஒவ்வொரு யூத தனிநபரையும் விதிவிலக்கின்றிக் குறிக்கிறது என அவசியப்படுத்தாது.
- source_word: ἐνέτυχόν μοι
  choice: என்னிடம் முறையிட்டு
  rationale: அதிகாரியிடம் கோரிக்கையுடன் அணுகும் சட்டநிர்வாகச் சூழலை ‘முறையிட்டு’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: எருசலேமிலும் இங்கேயும்
  rationale: ‘அங்கும் இங்கும்’ என்ற இரட்டை இடத் தொடர்பைச் சுருக்கமாகவும் துல்லியமாகவும் காக்கிறது.
- source_word: βοῶντες
  choice: கூக்குரலிட்டு
  rationale: உரத்த குரலில் வற்புறுத்திய செயலைத் தெளிவாகவும் உயிரோட்டமாகவும் வெளிப்படுத்துகிறது.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: இவன் இனியும் உயிரோடு இருக்கக் கூடாது
  rationale: δεῖ என்பதிலுள்ள அவசியம் அல்லது தகுதி குறித்த கூற்றையும் μηκέτι என்பதிலுள்ள ‘இனியும் இல்லை’ என்ற கால உணர்வையும் காக்கிறது; இதை நேரடியாக ஒரு சட்டபூர்வ மரணதண்டனைச் சூத்திரமாக மாற்றவில்லை.
theological_decisions:
- issue: பகைமையான சட்டச் சூழலில் ‘யூதர்கள்’ என்று குறிப்பிடுதல்
  choice: கிரேக்கத்தில் உள்ள இன-சமூகப் பெயரை ‘யூதர்கள்’ என்று தக்கவைத்து, πλῆθος என்பதை கூட்டுத் தொகுதியாக மொழிபெயர்த்தல்
  alternative: யூதத் தலைவர்கள் / எல்லா யூதர்களும்
  rationale: τῶν Ἰουδαίων என்பதை ஆதாரமின்றி ‘தலைவர்கள்’ என்று குறுக்கக்கூடாது. அதேவேளை, இது பெஸ்துவின் தொகுத்துரைக்கும் வலியுறுத்தல் என்பதால் ஒவ்வொரு யூதரும் தனித்தனியாக இதில் சேர்ந்திருந்தனர் என்ற உலகளாவிய குற்றச்சாட்டாக வாசிக்க வேண்டியதில்லை.
- issue: μὴ δεῖν αὐτὸν ζῆν μηκέτι என்பதன் வலிமை
  choice: இவன் இனியும் உயிரோடு இருக்கக் கூடாது
  alternative: இவன் இனிமேல் வாழக் கூடாது / இவன் இனியும் வாழ வேண்டியதில்லை
  rationale: கூற்று மரணத்தை வலியுறுத்துகிறது; ஆனால் கிரேக்கம் முறையான மரணதண்டனைத் தீர்ப்புச் சொல்லாட்சியைப் பயன்படுத்தவில்லை. ஆகவே அந்தத் தீவிரத்தையும் மொழிசார் திறந்த நிலையையும் ஒன்றாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான முறையான நடை பயன்படுத்தப்பட்டுள்ளது. அரசவைக் கூட்டத்தின் அழைப்புமுறை தக்கவைக்கப்பட்டுள்ளது; சட்டச் சூழலுக்கு ‘முறையிட்டு’ என்றும், உரத்த எதிர்ப்புக்கு ‘கூக்குரலிட்டு’ என்றும் இயல்பான சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
