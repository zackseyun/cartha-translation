  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: ta
  text: 'அப்போது தலைமைக் ஆசாரியர்களும் யூதர்களின் முக்கியப் பிரமுகர்களும் பவுலுக்கு எதிராக அவரிடம் முறையிட்டார்கள்; அவரை வற்புறுத்திக் கேட்டுக்கொண்டார்கள்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: தங்கள் வழக்கை அவரிடம் எடுத்துரைத்து
  rationale: ஆளுநர்முன் ஒரு விவகாரத்தைத் தெரியப்படுத்துதல் என்ற பொருளோடு இச்சூழலில் உள்ள சட்டமுறை நுணுக்கத்தையும் தெரிவிக்கிறது; கிரேக்கம் வெளிப்படையாகக் கூறாத முறையான குற்றப்பத்திரிகை என்ற கருத்தைத் திணிக்கவில்லை.
- source_word: τέ
  choice: அப்போது
  rationale: முந்தைய வசனத்தின் நிகழ்வோட்டத்துடன் இவ்வசனத்தை இயல்பாக இணைக்கும் உரையாடல் தொடர்பைக் காட்டுகிறது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: சூழலில் பெஸ்துவைக் குறிக்கும் மறைமுகப் பொருள்.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: எருசலேமின் பிரதான ஆசாரியத் தலைமைக் குழுவைக் குறிக்கும் இயல்பான, நிலைபெற்ற தமிழ் சொற்றொடர்.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: யூதர்களில் முதன்மையானவர்கள்
  rationale: சமூகத்திலும் அரசியலிலும் செல்வாக்குள்ள உயர்நிலையினரை πρῶτοι குறிக்கிறது; கிரேக்கத்தின் ‘யூதர்களில்’ என்ற அமைப்பையும் தக்கவைக்கிறது.
- source_word: κατὰ τοῦ Παύλου
  choice: பவுலுக்கு எதிரான
  rationale: κατά + உரிமை வேற்றுமை இங்கு எதிர்ப்பையும் குற்றச்சாட்டின் திசையையும் குறிக்கிறது.
- source_word: παρεκάλουν
  choice: வற்புறுத்திக் கேட்டுக்கொண்டார்கள்
  rationale: தொடர்ச்சியாக அல்லது மீண்டும் மீண்டும் வேண்டியதை இறந்தகாலத் தொடர்வினை உணர்வுடன் வெளிப்படுத்துகிறது; வெறும் ‘கேட்டார்கள்’ என்பதைக் காட்டிலும் வலிமையானது, ஆனால் உணர்ச்சிவசப்பட்ட ‘கெஞ்சினார்கள்’ என்பதைத் தவிர்க்கிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: மீண்டும் பெஸ்துவையே வற்புறுத்தலின் செயப்படுபொருளாகக் குறிக்கிறது.
