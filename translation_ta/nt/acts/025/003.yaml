revisions:
- from: அவருக்கு எதிராகத் தங்களுக்கு ஒரு தயவு செய்யுமாறும், அவரை எருசலேமுக்கு வரவழைக்குமாறும்[a] கேட்டுக்கொண்டார்கள். வழியில் அவரைக் கொல்வதற்காகப் பதுங்கித் தாக்க ஏற்பாடு செய்துகொண்டிருந்தார்கள்.
  to: அவரை எருசலேமுக்கு வரவழைக்க வேண்டும் என்ற, அவருக்கு எதிரான ஒரு தயவை அவர்கள் கேட்டுக்கொண்டார்கள்; வழியிலே அவரைக் கொல்லப் பதுங்கித் தாக்கச் சதித்திட்டம் தீட்டிக்கொண்டிருந்தார்கள்.
  rationale: The wording removes the unsupported and misleading “தங்களுக்கு,” makes the favor’s hostile object and requested content explicit, and renders the ambush idiom more precisely. A footnote marker must be retained in the text to anchor the lexical alternative.
  reviewer_model: gpt-5.6-terra
