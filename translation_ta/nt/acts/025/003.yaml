id: ACT.25.3
reference: Acts 25:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αἰτούμενοι χάριν κατ’ αὐτοῦ ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ, ἐνέδραν ποιοῦντες ἀνελεῖν αὐτὸν κατὰ τὴν ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: ta
  text: அவரை எருசலேமுக்கு வரவழைக்க வேண்டும் என்ற, அவருக்கு எதிரான ஒரு தயவை அவர்கள் கேட்டுக்கொண்டார்கள்; வழியிலே அவரைக் கொல்லப் பதுங்கித் தாக்கச் சதித்திட்டம் தீட்டிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτούμενοι χάριν κατ’ αὐτοῦ
  choice: அவருக்கு எதிராகத் தங்களுக்கு ஒரு தயவு செய்யுமாறு கேட்டுக்கொண்டார்கள்
  rationale: ‘ஒரு தயவைக் கேட்டல்’ என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது; κατ’ αὐτοῦ என்பதன் பகைமை சார்ந்த வலிமையை ‘அவருக்கு எதிராக’ எனப் பாதுகாக்கிறது.
- source_word: ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ
  choice: அவரை எருசலேமுக்கு வரவழைக்குமாறு
  rationale: Festus ஆள் அனுப்பி பவுலைத் தன்னிடம் கொண்டுவர ஏற்பாடு செய்ய வேண்டும் என்ற பொருளை ‘வரவழைக்க’ இயல்பாக வெளிப்படுத்துகிறது; வினைச்சொல்லின் மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐνέδραν ποιοῦντες
  choice: பதுங்கித் தாக்க ஏற்பாடு செய்துகொண்டிருந்தார்கள்
  rationale: பதுங்கியிருந்து தாக்கும் திட்டத்தையும், முதன்மை வேண்டுகோளுடன் ஒரே நேரத்தில் நடைபெற்றுக்கொண்டிருந்த துணைச் செயலையும் வெளிப்படுத்துகிறது.
- source_word: ἀνελεῖν αὐτὸν
  choice: அவரைக் கொல்வதற்காக
  rationale: இச்சூழலில் ἀναιρέω உயிரைப் பறிப்பதை நேரடியாகக் குறிக்கிறது; ‘கொல்ல’ என்பது தெளிவான, மிகைப்படுத்தாத தமிழ்.
- source_word: κατὰ τὴν ὁδόν
  choice: வழியில்
  rationale: பயணப் பாதையில் தாக்கத் திட்டமிட்டனர் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள பகைமைச் சார்பும், ஒரே நேரத்தில் நடந்த பதுங்குத் தாக்கத் திட்டமும் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
