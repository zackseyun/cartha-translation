  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: ta
  text: ஆனால் பெஸ்து, யூதர்களுக்கு[b] ஒரு உதவி செய்ய விரும்பி[a], பவுலுக்குப் பதிலளித்து, “நீ எருசலேமுக்குப் போய், அங்கே இவற்றைக் குறித்து என் முன்னிலையில் உன் வழக்கு விசாரிக்கப்பட விரும்புகிறாயா?” என்று கேட்டார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதர்களுக்கு ஓர் அனுகூலம் செய்ய” என்றும் மொழிபெயர்க்கலாம்; இச்சொற்றொடர் பவுல்மீது குற்றஞ்சாட்டிய யூதர்களின் விருப்பத்துக்கு இணங்க பெஸ்து முயன்றதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கே “யூதர்கள்” என்பது வேறுபாடின்றி எல்லா யூத மக்களையும் அல்ல, இவ்வழக்கை முன்னெடுத்த யூதக் குற்றஞ்சாட்டிகளையோ தலைவர்களையோ சூழல்படி குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “என் முன்னிலையில் வழக்கு நடத்தப்பட” அல்லது “என் முன்னிலையில் தீர்ப்பு விசாரணைக்கு உட்பட” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: விரும்பி
  rationale: பெஸ்துவின் தொடர்ந்த நோக்கத்தை வெளிப்படுத்தும் நிகழ்காலப் பெயரெச்சத்தின் இயல்பைச் சுருக்கமாகவும் இயற்கையாகவும் தருகிறது.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்களுக்கு
  rationale: கிரேக்கத்தின் பரந்த இன-சமயச் சொல்லை முதன்மை உரையில் காக்கிறது; சூழலில் அது வழக்கை முன்னெடுத்த யூதக் குற்றஞ்சாட்டிகளையோ தலைவர்களையோ குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: χάριν καταθέσθαι
  choice: ஒரு உதவி செய்ய
  rationale: ஒருவருக்கு அனுகூலம் செய்து அவரது நல்லெண்ணத்தை நாடுதல் என்ற மரபுத்தொடரின் பொருளை, சூழ்ச்சியான உள்நோக்கத்தை மிகைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: '... என்று கேட்டார்'
  rationale: பவுலை நோக்கி அளிக்கப்பட்ட பதில் கேள்வி வடிவில் இருப்பதால், தமிழில் தேவையற்ற ‘பதிலளித்துச் சொன்னார்’ என்ற இரட்டிப்பைத் தவிர்த்து இயல்பான கதையாடல் வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: Θέλεις
  choice: விரும்புகிறாயா
  rationale: பவுலின் விருப்பத்தை நேரடியாகக் கேட்கும் வினையைத் தக்கவைக்கிறது; வெறும் சம்மதத்தை மட்டும் குறிக்கும் ‘இணங்குகிறாயா’ என்பதைவிட மூலத்திற்கு நெருக்கமானது.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: எருசலேமுக்குப் போய்
  rationale: தமிழில் ‘எருசலேமுக்கு ஏறிப்போய்’ என்பது இச்சூழலில் இயல்பற்றதாக இருக்கக்கூடும்; இலக்கை இயல்பாகச் சொல்லி, மூலத்தின் பயணக் கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: περὶ τούτων
  choice: இவற்றைக் குறித்து
  rationale: குற்றச்சாட்டுகள் என்று மூலத்தில் இல்லாத சட்டத் துல்லியத்தைச் சேர்க்காமல், விவாதத்திலுள்ள காரியங்களைப் பொதுவாகக் குறிக்கிறது.
- source_word: κριθῆναι
  choice: விசாரிக்கப்பட
  rationale: சட்டச் சூழலில் κρίνω என்பதன் செயலற்ற வடிவம் வழக்கு விசாரணைக்கு உட்படுவதை குறிக்கலாம்; ‘தீர்ப்பளிக்கப்பட’ என்பதுபோல் இறுதித் தீர்ப்பை மட்டும் முன்கூட்டியே சுட்டாமல் இயல்பான தமிழை வழங்குகிறது.
- source_word: ἐπ’ ἐμοῦ
  choice: என் முன்னிலையில்
  rationale: பெஸ்துவின் முன்னிலையிலும் அதிகாரத்தின் கீழும் வழக்கு விசாரிக்கப்படும் பொருளை, அவரே தனியாகத் தீர்ப்பளிப்பார் என்று மிகைப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: ‘யூதர்கள்’ என்ற சொல்லை எல்லா யூத மக்களுக்கும் எதிரான பொதுப்படுத்தலாக வாசிக்கும் அபாயம்
  choice: மூலத்தின் τοῖς Ἰουδαίοις என்பதற்கிணங்க முதன்மை உரையில் ‘யூதர்களுக்கு’ என்பதை வைத்துக் கொண்டு, சூழல் சார்ந்த குறிப்பு மூலம் அதன் குறிப்பிட்ட பொருளை விளக்குதல்
  alternative: ‘யூதத் தலைவர்களுக்கு’ அல்லது ‘யூதக் குற்றஞ்சாட்டிகளுக்கு’ என்று முதன்மை உரையிலேயே குறுக்குதல்
  rationale: மூலத்தின் சொல்வடிவத்தைப் பாதுகாத்தபடியே, இந்த வழக்கை முன்னெடுத்த குற்றஞ்சாட்டிகளும் தலைவர்களுமே இங்கு சூழல்படி குறிக்கப்படுகிறார்கள் என்பதை விளக்குவது தேவையற்ற இன-சமயப் பொதுப்படுத்தலைத் தவிர்க்கிறது.
- issue: κριθῆναι என்பதன் சட்டப் பொருளிலுள்ள திறந்த தன்மை
  choice: ‘விசாரிக்கப்பட’
  alternative: ‘தீர்ப்பளிக்கப்பட’ அல்லது ‘வழக்கு நடத்தப்பட’
  rationale: இச்சொல் விசாரணை, நீதித்தீர்ப்பு ஆகிய சட்டநடவடிக்கைகளின் பரப்பைக் கொண்டிருக்கலாம். ‘விசாரிக்கப்பட’ என்பது தமிழில் இச்சூழலுக்கு இயல்பாக இருந்து, இறுதித் தீர்ப்பு மட்டுமே பொருள் என்று முடிவுசெய்யாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சட்ட-கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பதிலளித்துச் சொன்னார்’ போன்ற கிரேக்கக் கட்டமைப்பின் இயல்பற்ற இரட்டிப்பைத் தவிர்த்து ‘என்று கேட்டார்’ என இயல்பாக்கப்பட்டுள்ளது. முதன்மை உரையிலுள்ள அனைத்து அடிக்குறிப்பு அடையாளங்களும் [a], [b], [c] என இடம்பெற்றுள்ளன.
