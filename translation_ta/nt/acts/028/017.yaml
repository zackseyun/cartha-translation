source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: ta
  text: மூன்று நாட்களுக்குப் பின்பு, அவர் யூதர்களின் முக்கியஸ்தர்களை[a] ஒன்றுகூட அழைத்தார். அவர்கள் ஒன்றுகூடி வந்தபோது, அவர் அவர்களிடம், “சகோதரர்களே[b], மக்களுக்கோ மூதாதையரின் வழக்கங்களுக்கோ[c] எதிராக நான் எதுவும் செய்யாதிருந்தும், எருசலேமிலிருந்து கைதியாக ரோமர்களின் கைகளில் ஒப்படைக்கப்பட்டேன்[d]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்களின் தலைவர்களை” அல்லது “யூதர்களிடையே முன்னணியில் இருந்தவர்களை.”
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்களே” என்பது கிரேக்கத்தில் ஆண்பால் விளிப்பாக உள்ளது. பவுல் இங்கு தான் அழைத்திருந்த யூத ஆண் தலைவர்களிடம் பேசுகிறார்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “மூதாதையரிடமிருந்து வந்த மரபுகளுக்கோ.”
    reason: lexical_alternative
  - marker: d
    text: “ஒப்படைக்கப்பட்டேன்” என்பதற்கான கிரேக்கச் சொற்றொடர் இன்னும் சொற்படியாய், “ரோமர்களின் கைகளுக்குள் கொடுக்கப்பட்டேன்” எனப் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: மூன்று நாட்களுக்குப் பின்பு
  rationale: Ἐγένετο δὲ என்பது லூக்காவின் நிகழ்வை அறிமுகப்படுத்தும் நடை; தமிழில் தனியே ‘நிகழ்ந்தது’ என்று கூறுவது செயற்கையாக இருப்பதால், காலத்தொடரால் இயல்பாக எடுத்துரைக்கப்படுகிறது.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: அவர் ... ஒன்றுகூட அழைத்தார்
  rationale: συν- முன்னொட்டின் ஒன்றாகக் கூட்டும் பொருளையும் அழைப்புச் செயலையும் இயல்பான தமிழில் தருகிறது.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: யூதர்களில் முதன்மையானவர்களை
  rationale: πρώτους என்பது காலவரிசையை அல்ல, சமூக முக்கியத்துவத்தையும் முன்னணி நிலையையும் குறிக்கிறது.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: அவர்கள் ஒன்றுகூடி வந்தபோது
  rationale: மூலத்தின் genitive absolute அமைப்பை இயல்பான காலவினைத் துணைவாக்கியமாக வழங்குகிறது.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: சகோதரர்களே
  rationale: ἄνδρες ἀδελφοί என்பது மரியாதையும் இன-சமய உறவுணர்வும் கொண்ட ஆண் அழைப்பு. தமிழில் ‘சகோதரர்களே’ இயல்பான நேரடி விளிப்பு; ἐγώ அடுத்துள்ள ‘நான்’ என்பதில் வெளிப்படுகிறது.
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: எதிராக நான் எதுவும் செய்யாதிருந்தும்
  rationale: பவுலின் குற்றமின்மைக்கும் அவர் ஒப்படைக்கப்பட்டதற்கும் உள்ள முரண்பாட்டைக் காட்டும் concessive பொருளைப் பாதுகாக்கிறது.
- source_word: τῷ λαῷ
  choice: நம் மக்களுக்கு
  rationale: மூலத்தில் உடைமைச்சொல் இல்லாவிட்டாலும், பவுல் யூதத் தலைவர்களை ‘சகோதரர்களே’ என்று அழைக்கும் சூழலில் தமிழின் ‘நம்’ அவரது பகிரப்பட்ட இன அடையாளத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: நம் மூதாதையரின் வழக்கங்களுக்கு
  rationale: πατρῴοις என்பது முன்னோர்களிடமிருந்து வந்தவற்றைக் குறிக்கிறது; ‘மூதாதையரின் வழக்கங்கள்’ நவீன தமிழில் தெளிவாகவும் மாண்பாகவும் உள்ளது.
- source_word: δέσμιος
  choice: கைதியாக
  rationale: பிணைக்கப்பட்டவர் என்ற சொற்பிறப்பை விட, இச்சட்ட-காவல் சூழலில் பவுலின் கைதி நிலையைக் தெளிவாகக் குறிக்கிறது.
- source_word: ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: எருசலேமிலிருந்து ... ரோமர்களின் கைகளில் ஒப்படைக்கப்பட்டேன்
  rationale: παρεδόθην என்பதன் சட்ட/காவல் சார்ந்த ‘ஒப்படைக்கப்பட்டேன்’ பொருளையும், εἰς τὰς χεῖρας என்ற மூல உருவகத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ἄνδρες ἀδελφοί என்ற அழைப்பின் பாலினமும் உறவுணர்வும்
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே; சகோதர ஆண்களே
  rationale: இங்கு பவுல் அழைத்தவர்கள் யூதர்களின் ஆண் முன்னணியினர். ஆகவே மூலத்தின் ஆண்பால் குறிப்பையும் உறவுணர்வையும் ‘சகோதரர்களே’ பாதுகாக்கிறது.
- issue: οὐδὲν ἐναντίον ποιήσας என்பதன் தர்க்கத் தொடர்பு
  choice: 'சலுகை/முரண்பாட்டு பொருள்: ‘செய்யாதிருந்தும்’'
  alternative: 'கால/சூழ்நிலைப் பொருள்: ‘எதுவும் செய்யாமல்’'
  rationale: குற்றமற்றிருந்த போதிலும் ரோமரிடம் ஒப்படைக்கப்பட்டதாகப் பவுல் வலியுறுத்தும் உரையாடல் பதற்றத்தை இது காக்கிறது; அதற்கு மேல் இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
- issue: τῷ λαῷ என்பதில் உடைமைச் சுட்டு
  choice: நம் மக்களுக்கு
  alternative: மக்களுக்கு; அந்த மக்களுக்கு
  rationale: கிரேக்கத்தில் வெளிப்படையான ‘நம்’ இல்லை. எனினும் அழைப்பும் பகிரப்பட்ட யூத அடையாளமும் தமிழில் இயல்பாக அமைய ‘நம்’ பயன்படுத்தப்படுகிறது; இது மக்கள் என்ற சொல்லின் குறிப்பைத் தெளிவாக்குகிறது, வேறொரு இறையியல் அடையாளத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற மாண்பும் காக்கப்பட்டுள்ளன. ‘முதன்மையானவர்கள்’, ‘மூதாதையரின் வழக்கங்கள்’, ‘ஒப்படைக்கப்பட்டேன்’ ஆகியவை சாதாரண வாசகருக்குப் புரியுமாறும் மூலத்தின் சட்ட மற்றும் சமூக நுணுக்கங்களைத் தக்கவைத்தும் தேர்ந்தெடுக்கப்பட்டன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
