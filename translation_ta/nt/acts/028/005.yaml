  text: ὁ μὲν οὖν ἀποτινάξας τὸ θηρίον εἰς τὸ πῦρ ἔπαθεν οὐδὲν κακόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/005.yaml
  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: ta
  text: ஆகவே அவர் அந்த விலங்கைத்[a] தீக்குள் உதறிவிட்டபின், அவருக்கு எந்தத் தீங்கும் நேரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மிருகம்’ அல்லது ‘உயிரினம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பொதுவானது; ஆனால் சூழல் இதைப் பாம்பாக அடையாளப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: ஆகவே அவர்
  rationale: ὁ என்பது முந்தைய சூழலில் உள்ள பவுலைக் குறிக்கும் பதிலிப்பெயர்போல் செயல்படுகிறது; μέν மற்றும் οὖν இணைந்து தரும் மென்மையான கதைத் தொடர்ச்சியை இயல்பான தமிழில் ‘ஆகவே’ வெளிப்படுத்துகிறது.
- source_word: ἀποτινάξας
  choice: உதறிவிட்டபின்
  rationale: இறந்தகால வினையெச்சம் பிரதான வினைக்கு முந்திய செயலைக் குறிக்கிறது; ‘உதறிவிட்டபின்’ அந்தக் காலத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὸ θηρίον
  choice: அந்த விலங்கை
  rationale: θηρίον என்பது பொதுவாக ஒரு விலங்கு அல்லது காட்டுயிரைக் குறிக்கும் சொல். முந்தைய வசனத்தின் சூழலில் இது பாம்பைக் குறித்தாலும், இவ்வசனத்தில் உள்ள கிரேக்கச் சொல்லின் பொதுத்தன்மையை ‘விலங்கு’ காக்கிறது.
- source_word: εἰς τὸ πῦρ
  choice: தீக்குள்
  rationale: εἰς உடன் வரும் இச்சொற்றொடர் உள்ளே நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘தீக்குள்’ சுருக்கமாகவும் நேரடியாகவும் உள்ளது.
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: அவருக்கு எந்தத் தீங்கும் நேரவில்லை
  rationale: πάσχω மற்றும் οὐδὲν κακόν இணைவு காயமோ மோசமான விளைவோ ஏற்படாததைக் குறிக்கிறது; இந்தத் தமிழ் நடை அதன் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க மூலத்தின் பொதுவான விலங்குக் குறிப்பும், வினையெச்சச் செயலுக்கும் பிரதான வினைக்கும் இடையிலான காலத் தொடர்பும் காக்கப்பட்டுள்ளன.
