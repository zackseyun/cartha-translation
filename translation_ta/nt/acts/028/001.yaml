source:
  edition: SBLGNT
  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: ta
  text: நாங்கள் பாதுகாப்பாக மீட்கப்பட்ட பின்பு[a], அந்தத் தீவு மால்ட்டா[b] என்று அழைக்கப்படுவதை அப்போது அறிந்துகொண்டோம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் பாதுகாப்பாகத் தப்பிய பின்பு” அல்லது “நாங்கள் காப்பாற்றப்பட்ட பின்பு.” கிரேக்க வினைச்சொல், ஆபத்தின் வழியாகப் பாதுகாப்பாக மீட்கப்பட்டதை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் மெலித்தே (Melitē); மரபாக மால்ட்டா என்று அடையாளம் காணப்படும் தீவு.
    reason: cultural_note
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “அந்தத் தீவு மால்ட்டா என்று அழைக்கப்படுகிறது.” அறிவிக்கப்பட்ட தகவலில் கிரேக்கம் நிகழ்காலச் செயப்பாட்டு வடிவத்தைப் பயன்படுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διασωθέντες
  choice: பாதுகாப்பாக மீட்கப்பட்ட பின்பு
  rationale: இறந்தகாலச் செயப்பாட்டு எச்சத்தின் பொருளையும், கப்பல் விபத்தின் ஆபத்திலிருந்து வெற்றிகரமாகக் காக்கப்பட்டதையும் வெளிப்படுத்துகிறது; கரைசேர்ந்ததை மட்டும் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: τότε
  choice: அப்போது
  rationale: நிகழ்வுகளின் கால வரிசையை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: ἐπέγνωμεν
  choice: அறிந்துகொண்டோம்
  rationale: முன்பு தெரியாத தீவின் பெயரைத் தெரிந்துகொண்டதைக் குறிக்கும் இயல்பான தமிழ் வினை.
- source_word: Μελίτη
  choice: மால்ட்டா
  rationale: Μελίτη எனும் கிரேக்கப் பெயரால் குறிப்பிடப்படும் தீவின் வழக்கிலுள்ள நவீனத் தமிழ்ப் பெயர்.
- source_word: ἡ νῆσος
  choice: அந்தத் தீவு
  rationale: ஏற்கெனவே அவர்கள் வந்து சேர்ந்திருந்த தீவைக் குறிப்பதால், தமிழ் உரையாடல் ஓட்டத்தில் ‘அந்தத் தீவு’ இயல்பாக உள்ளது.
- source_word: καλεῖται
  choice: என்று அழைக்கப்படுவதை
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் பெயரிடும் பொருளைத் தக்கவைத்து, ‘அறிந்துகொண்டோம்’ என்பதுடன் இயல்பாக இணைக்கிறது.
