  source_fidelity: மூலக் கிரேக்கத்தின் διασωθέντες (பாதுகாப்பான விடுதலை/மீட்பு), τότε (அப்போது), ἐπέγνωμεν (அறிந்துகொண்டோம்), மற்றும் καλεῖται என்ற நிகழ்காலச் செயப்பாட்டு பெயரிடல் ஆகியவை உரையிலும் அடிக்குறிப்புகளிலும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. தொடக்க Καὶ-யைத் தமிழில் வெளிப்படையாகச் சொல்லாதது இயல்பான நடைமுறை; பொருள் இழப்பு இல்லை.
  naturalness: “நாங்கள் பாதுகாப்பாக மீட்கப்பட்ட பின்பு, அந்தத் தீவு மால்ட்டா என்று அழைக்கப்படுவதை அப்போது அறிந்துகொண்டோம்” என்பது நவீன நிலையான தமிழில் தெளிவான, மரியாதையான கதைநடை. “அப்போது” என்பதன் இடம் சிறிது கவன ஈர்ப்புடையதாக இருந்தாலும் இயல்புக்கு முரணல்ல; மூலத்தின் τότε-வைத் தெளிவாகக் காக்கிறது.
  terminology: “மீட்கப்பட்ட,” “அறிந்துகொண்டோம்,” “அழைக்கப்படுவதை,” மற்றும் “மால்ட்டா” ஆகிய தேர்வுகள் பொருத்தமானவை. மெலித்தே/மால்ட்டா குறித்த அடிக்குறிப்பு அடையாளத் தகவலை அளிக்கிறது; அதை உரையின் பொருளாக மாற்றவில்லை.
