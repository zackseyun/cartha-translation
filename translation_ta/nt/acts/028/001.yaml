translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified narrative register பயன்படுத்தப்பட்டது. தொடக்க Καί தமிழில் கட்டாயமில்லாததால் தனியே மொழிபெயர்க்கப்படவில்லை; τότε ‘அப்போது’ எனத் தக்கவைக்கப்பட்டது. செயப்பாட்டு நுணுக்கமும் மூலத்தின் நிகழ்காலப் பெயரிடும் வடிவமும் உரை மற்றும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
