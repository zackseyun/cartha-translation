  yaml_path: translation/nt/acts/028/030.yaml
  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: ta
  text: அவர் தாம் வாடகைக்கு எடுத்திருந்த தங்குமிடத்தில்[a] முழு இரண்டு ஆண்டுகள் தங்கியிருந்து, தம்மிடம் வந்த அனைவரையும்[b] வரவேற்றார்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தமது வாடகை வீட்டில்.’ கிரேக்கச் சொல் வாடகைக்கு எடுக்கப்பட்ட தங்குமிடம் அல்லது வசிப்பிடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘தம்மிடம் உள்ளே வந்த அனைவரையும்.’ இது அவருடைய தங்குமிடத்திற்குள் வந்த பார்வையாளர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: தங்கியிருந்து
  rationale: ἐμμένω என்பதன் இறந்தகால வடிவம் ஓர் இடத்தில் தொடர்ந்து தங்கியிருப்பதைக் குறிக்கிறது. ‘தங்கியிருந்து’ என்பது அந்த நீடித்த வசிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: —
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் கதையைத் தொடரும் மென்மையான இணைப்பாக உள்ளது. முந்தைய வசனத்துடன் தமிழில் இயல்பாகத் தொடர்வதால் தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை.
- source_word: διετίαν ὅλην
  choice: இரண்டு ஆண்டுகள் முழுவதும்
  rationale: கால அளவையும் ὅλην தரும் முழுக் காலத்திற்கான வலியுறுத்தலையும் இச்சொற்றொடர் காக்கிறது.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: தமது வாடகை வீட்டில்
  rationale: μίσθωμα என்பது வாடகைக்கு எடுக்கப்பட்ட தங்குமிடத்தைக் குறிக்கிறது; ἰδίῳ அந்த ஏற்பாடு அவருக்குரியது என்பதைத் தெரிவிக்கிறது. ‘வாடகை வீடு’ நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀπεδέχετο
  choice: வரவேற்றார்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் வழக்கமாக அல்லது தொடர்ந்து நிகழ்ந்த செயலைக் காட்டுகிறது. ‘வரவேற்றார்’ என்பது வெறுமனே ஏற்றுக்கொண்டார் என்பதைக் காட்டிலும் ἀποδέχομαι என்பதன் அன்பான வரவேற்பு நயத்தை வெளிப்படுத்துகிறது.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: தம்மிடம் வந்த அனைவரையும்
  rationale: இது எல்லாரையும் விலக்கின்றி ஏற்றுக்கொண்டதைக் காக்கிறது. εἰσπορεύομαι என்பதில் ‘உள்ளே வருதல்’ என்ற இடவியல் நயம் இருந்தாலும், ‘தம்மிடம் வந்த’ என்பது தமிழில் இயல்பான முதன்மை வாசகம்; அந்த நயம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
