source:
  edition: SBLGNT
  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: ta
  text: மூன்று மாதங்களுக்குப் பிறகு, அந்தத் தீவில் குளிர்காலத்தைக் கழித்திருந்த, தியோஸ்கூரர்கள் என்ற சின்னம் கொண்ட அலெக்சாந்திரியக் கப்பலில் நாங்கள் கடலுக்குப் புறப்பட்டோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தியோஸ்கூரர்கள்” என்பது கிரேக்க-ரோமப் புராணத்தில் காஸ்டர், பொல்லுக்ஸ் எனப்படும் இரட்டையரைக் குறிக்கும் பெயர்.
    reason: அறிமுகமற்ற கிரேக்கப் புராணத் தனிப்பெயருக்கான விளக்கம்
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: மூன்று மாதங்களுக்குப் பிறகு
  rationale: μετά உடன் வரும் கால அளவு, அந்த இடைவெளிக்குப் பிறகு என்பதைக் குறிக்கிறது. δέ இங்கு மெலிதான தொடர்ச்சிச் சொல்; இயல்பான தமிழில் தனியாக மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: ἀνήχθημεν
  choice: நாங்கள் கடலுக்குப் புறப்பட்டோம்
  rationale: ἀνάγω என்பதன் கடற்பயணப் பயன்பாடு கரையிலிருந்து கடலுக்குப் புறப்படுதல் அல்லது பயணத்தைத் தொடங்குதல் என்பதாகும்.
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: அலெக்சாந்திரியக் கப்பல் ஒன்றில்
  rationale: πλοῖον இச்சூழலில் பெரிய கடற்பயணக் கப்பலைக் குறிக்கிறது; Ἀλεξανδρίνῳ அதன் அலெக்சாந்திரியத் தோற்றம் அல்லது தொடர்பைக் காட்டுகிறது.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: அந்தத் தீவில் குளிர்காலத்தைக் கழித்திருந்த
  rationale: παραχειμάζω என்பதன் நிறைவுற்ற வினையெச்ச வடிவம், கப்பல் அங்கே குளிர்காலம் முழுவதும் தங்கியிருந்ததைக் குறிக்கிறது.
- source_word: παρασήμῳ Διοσκούροις
  choice: அந்தக் கப்பலின் சின்னம் தியோஸ்கூரர்கள்
  rationale: παράσημος கப்பலை அடையாளப்படுத்திய சின்னம் அல்லது உருவத்தைக் குறிக்கலாம். குறிப்பாக ‘முகப்புச் சிற்பம்’ என்று வரையறுத்துவிடாமல் பொதுவான ‘சின்னம்’ என்பது மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது; Διόσκουροι என்ற பெயர் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: புறசமயப் புராணப் பெயரான Διοσκούροι-ஐ மொழிபெயர்த்தல்
  choice: தியோஸ்கூரர்கள்
  alternative: இரட்டைக் கடவுளர்கள் / காஸ்டரும் பொல்லுக்ஸும்
  rationale: மூலத்திலுள்ள தனிப்பெயரை நேரடியாகப் பாதுகாப்பது, உரை அந்தச் சின்னத்தை வெறுமனே அறிக்கையிடுகிறது என்பதையும் அதை ஏற்றுக்கொள்ளவில்லை என்பதையும் தெளிவாக வைத்திருக்கிறது. அறிமுகமற்ற பெயருக்கான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அலெக்சாந்திரியக் கப்பல்’ என்பது கப்பலின் தோற்றத் தொடர்பைப் பாதுகாக்கிறது; ‘சின்னம்’ என்பது அதன் துல்லியமான அமைவிடம் அல்லது வடிவம் குறித்து மூலத்தில் உள்ள திறந்த நிலையைக் காக்கிறது.
