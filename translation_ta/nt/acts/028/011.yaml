  to: மூன்று மாதங்களுக்குப் பிறகு, அந்தத் தீவில் குளிர்காலத்தைக் கழித்திருந்த, தியோஸ்கூரர்கள் என்ற சின்னம் கொண்ட அலெக்சாந்திரியக் கப்பலில் நாங்கள் கடலுக்குப் புறப்பட்டோம்.[a]
