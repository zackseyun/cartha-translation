source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: ta
  text: அந்த இடத்தைச் சுற்றியிருந்த பகுதியில், தீவின் முதன்மையானவரான[a] புபிலியு என்பவருக்குச் சொந்தமான நிலங்கள்[b] இருந்தன. அவர் எங்களை வரவேற்று, மூன்று நாட்கள் அன்புடன் விருந்தோம்பினார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “தீவின் தலைசிறந்தவர்.” கிரேக்கச் சொற்றொடர் தீவின் முன்னணி அல்லது மிக உயர்ந்த நிலையிலிருந்தவரைக் குறிக்கலாம்.'
    reason: alternative_reading
  - marker: b
    text: “நிலங்கள்” என்பதற்கான கிரேக்கச் சொல், அந்தப் பகுதியில் இருந்த நிலச் சொத்துகள் அல்லது பண்ணைத் தோட்டங்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'வேறு விதமாக: “அவர் எங்களை ஏற்றுக்கொண்டு, மூன்று நாட்கள் கனிவுடன் உபசரித்தார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: அந்த இடத்தைச் சுற்றியிருந்த பகுதியில்
  rationale: περὶ τὸν τόπον என்பது அந்த இடத்தின் சுற்றுப்புறத்தைக் குறிக்கிறது. δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைத் தருவதால், தமிழில் தனிச் சொல்லாக வலிந்து மொழிபெயர்க்காமல் இயல்பான வாக்கியத் தொடரில் விடப்பட்டுள்ளது.
- source_word: χωρία
  choice: நிலங்கள்
  rationale: நிலச் சொத்துகள் அல்லது பண்ணைத் தோட்டங்களைக் குறிக்கக்கூடிய பன்மைச் சொல்லை, சொத்தின் துல்லியமான வகையை வரையறுக்காமல் ‘நிலங்கள்’ என வழங்குகிறது.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: தீவின் முதன்மையானவர்
  rationale: πρῶτος இங்கு வரிசையில் ‘முதலாவது’ என்பதைக் காட்டிலும் உயர்ந்த நிலை அல்லது தலைமைத் தகுதியைக் குறிக்கிறது; குறிப்பிட்ட அதிகாரப் பதவியை ஆதாரமின்றி நிர்ணயிக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὀνόματι Ποπλίῳ
  choice: புபிலியு என்பவர்
  rationale: ὀνόματι உடன் வரும் பெயரை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; Πόπλιος என்ற பெயர் ‘புபிலியு’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: அவர் எங்களை வரவேற்று
  rationale: விருந்தினர்களை ஏற்றுக்கொண்டு வரவேற்ற செயலைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τρεῖς ἡμέρας
  choice: மூன்று நாட்கள்
  rationale: காலநீட்சியைக் குறிக்கும் வேற்றுமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φιλοφρόνως ἐξένισεν
  choice: அன்புடன் விருந்தோம்பினார்
  rationale: φιλοφρόνως என்பதன் கனிவான, நட்பான முறையையும் ξενίζω என்பதன் விருந்தினராகத் தங்கவைத்து உபசரிக்கும் பொருளையும் சுருக்கமாகவும் கண்ணியமாகவும் வழங்குகிறது.
theological_decisions:
- issue: τῷ πρώτῳ τῆς νήσου என்பது அதிகாரப்பூர்வப் பட்டமா அல்லது பொதுவான உயர்நிலைச் சுட்டுமா
  choice: தீவின் முதன்மையானவர்
  alternative: தீவின் தலைமை அதிகாரி
  rationale: கிரேக்கச் சொற்றொடர் உயர்ந்த சமூக அல்லது நிர்வாக நிலையைக் குறிக்கலாம்; ஆனால் குறிப்பிட்ட அதிகாரப்பூர்வப் பதவியை உறுதியாக நிர்ணயிக்காததால் மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘விருந்தோம்பினார்’ என்பது தங்கவைத்து உபசரித்த கருத்தை இயல்பாகச் சுமக்கிறது; ‘முதன்மையானவர்’ என்பது ஆதாரத்தை மீறி ஒரு குறிப்பிட்ட நிர்வாகப் பதவியை விதிப்பதைத் தவிர்க்கிறது.
