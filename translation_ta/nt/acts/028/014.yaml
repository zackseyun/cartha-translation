  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: ta
  text: அங்கே சகோதரர்களைக்[a] கண்டோம். அவர்களுடன் ஏழு நாட்கள் தங்கும்படி அவர்கள் எங்களை அழைத்தார்கள். இவ்வாறாக நாங்கள் ரோமுக்கு வந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதரர்களையும் சகோதரிகளையும்”; கிரேக்கத்தில் “சகோதரர்களை” என்று உள்ளது. இச்சூழலில் இது பொதுவாக சக விசுவாசிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட புத்தேயோலி நகரத்தைக் குறிக்கும் இடவினையடை; நவீன தமிழில் இயல்பாக வாக்கியத்தைத் தொடங்குகிறது.
- source_word: εὑρόντες
  choice: கண்டோம்
  rationale: முதன்மை வினையின் அதே எழுவாயைக் கொண்ட இறந்தகால வினையெச்சத்தை, செயல்களின் வரிசையைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் முற்றுவினையாக வழங்குகிறது.
- source_word: ἀδελφοὺς
  choice: சகோதரர்களை
  rationale: கிரேக்கச் சொல்லின் ஆண்பால் பன்மை வடிவத்தைப் பேணுகிறது; சூழலில் இது உள்ளூர் கிறிஸ்தவ விசுவாசிகளைப் பொதுவாகக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: παρεκλήθημεν
  choice: அவர்கள் எங்களைக் கேட்டுக்கொண்டார்கள்
  rationale: கிரேக்கத்தில் உள்ள செயப்பாட்டு வடிவத்தைத் தமிழில் இயல்பான செய்வினை அமைப்பாக மாற்றினாலும், உள்ளூர் விசுவாசிகளிடமிருந்து வந்த வேண்டுகோள் என்ற பொருளைத் துல்லியமாகப் பேணுகிறது.
- source_word: παρ’ αὐτοῖς ἐπιμεῖναι
  choice: அவர்களுடன் ... தங்கும்படி
  rationale: பயணம் மற்றும் விருந்தோம்பல் சூழலில் அவர்களோடு தங்கியிருப்பதைக் குறிக்கும் இயல்பான நவீன தமிழ்.
- source_word: ἡμέρας ἑπτά
  choice: ஏழு நாட்கள்
  rationale: கால நீட்சியைக் குறிக்கும் வேற்றுமைப் பயன்பாட்டைத் தமிழில் நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: καὶ οὕτως
  choice: இவ்வாறாக
  rationale: பயண நிகழ்வுகளின் தொடர்ச்சியையும், இந்த முறையில் இறுதியாக ரோமை அடைந்ததையும் காட்டுகிறது.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: நாங்கள் ரோமுக்கு வந்தோம்
  rationale: இலக்கை நோக்கி வந்து சேர்ந்த பொருளையும் லூக்காவின் முதல் நபர் பன்மைப் பயண விவரிப்பையும் பேணுகிறது.
theological_decisions:
- issue: ἀδελφοὺς என்பதன் சுட்டுப்பொருள்
  choice: உள்ளூர் கிறிஸ்தவச் சமூகத்தைச் சேர்ந்த சக விசுவாசிகள்
  alternative: உடன்பிறந்த சகோதரர்கள் அல்லது பொதுவாக யூத இனத்தவர்கள்
  rationale: அப்போஸ்தலர் நூலின் பயணச் சூழலிலும், இங்கே காணப்படும் தங்குமிட வேண்டுகோளிலும், இச்சொல் சக விசுவாசிகளைக் குறிப்பதே மிகவும் இயல்பானது. எனினும் மூலச்சொல்லின் வடிவத்தை முதன்மை உரை பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்கச் செயப்பாட்டு அமைப்பு தமிழில் கடினமாக ஒலிக்காதபடி செய்வினையாக வழங்கப்பட்டுள்ளது; கருத்தும் செயலில் ஈடுபட்டவர்களும் மாற்றப்படவில்லை.
