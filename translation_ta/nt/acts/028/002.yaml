translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதையாடல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அங்கிருந்த மக்கள்’ என்பது இன்றைய தமிழில் இழிவாக ஒலிக்கக்கூடிய நேரடி சொல்லைத் தவிர்க்கிறது; மூலச்சொல்லின் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. கிரேக்க மரபுத்தொடரின் வலிமை ‘வழக்கத்திற்கு மேற்பட்ட பரிவு’ என இயல்பாகத் தரப்பட்டு, அதன் முறையான எதிர்மறை வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
