id: ACT.28.2
reference: Acts 28:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: ta
  text: அங்கிருந்த மக்கள்[a] எங்களிடம் வழக்கத்திற்கு மேற்பட்ட பரிவைக் காட்டினார்கள்[b]. ஏனெனில், அப்போது பெய்துகொண்டிருந்த மழையினாலும் குளிரினாலும் அவர்கள் நெருப்பு மூட்டி, எங்கள் அனைவரையும் வரவேற்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் βάρβαροι என்பது சொல்லுக்குச் சொல் ‘பார்பரியர்கள்’; அதாவது, கிரேக்க மொழி பேசாத மக்கள். இங்கு அது அத்தீவின் உள்ளூர் மக்களைக் குறிக்கிறது; அவர்கள் நாகரிகமற்றவர்கள் என்ற பொருள் அவசியமில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சாதாரணமான பரிவை அல்ல.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: அங்கிருந்த மக்கள்
  rationale: இச்சொல் இங்கு கிரேக்க மொழி பேசாத உள்ளூர் மக்களைக் குறிக்கிறது; நவீன தமிழில் இழிவான பொருளைத் தரக்கூடிய ‘காட்டுமிராண்டிகள்’ என்ற நேரடி வடிவத்தைத் தவிர்த்து, சூழலுக்கேற்ற இன-மொழியியல் பொருளை இயல்பாகத் தருகிறது.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: வழக்கத்திற்கு மேற்பட்ட பரிவு
  rationale: οὐ τὴν τυχοῦσαν என்ற மரபுத்தொடர் ‘சாதாரணமல்லாத’ அல்லது ‘வழக்கத்தைவிட மிகுந்த’ என்ற பொருளையும், φιλανθρωπία மனிதரிடம் காட்டும் அன்பான பரிவையும் குறிக்கிறது. தேர்ந்த வடிவம் எதிர்மறை கிரேக்க அமைப்பின் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: παρεῖχον
  choice: காட்டினார்கள்
  rationale: φιλανθρωπία என்பதுடன் சேர்ந்தபோது, பரிவை வெளிப்படுத்துதல் என்ற பொருளை ‘காட்டினார்கள்’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: ἅψαντες πυράν
  choice: நெருப்பு மூட்டி
  rationale: ἅπτω இங்கு நெருப்பைப் பற்றவைத்தல் அல்லது மூட்டுதல் என்று பொருள்படும்; ‘நெருப்பு மூட்டி’ என்பது இயல்பான, தெளிவான தமிழ்.
- source_word: προσελάβοντο
  choice: வரவேற்றார்கள்
  rationale: இச்சூழலில் விருந்தோம்பலோடு ஏற்றுக்கொண்டு அருகில் சேர்த்துக்கொண்டதைக் குறிக்கிறது; தங்குமிடம் கொடுத்தார்கள் என்று மிகையாகக் குறிப்பிடாமல் ‘வரவேற்றார்கள்’ அந்தப் பொருளைத் தருகிறது.
- source_word: πάντας ἡμᾶς
  choice: எங்கள் அனைவரையும்
  rationale: வரவேற்பு ஒருவரையும் விலக்காமல் அனைவருக்கும் அளிக்கப்பட்டது என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: அப்போது பெய்துகொண்டிருந்த மழையினாலும்
  rationale: ἐφεστῶτα மழை வந்து அப்போது நிலவிக்கொண்டிருந்ததைக் குறிக்கிறது; ‘பெய்துகொண்டிருந்த’ என்பது தொடர்ந்த மழையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διὰ τὸ ψῦχος
  choice: குளிரினாலும்
  rationale: ψῦχος என்பதன் நேரடியான வானிலை சார்ந்த பொருளைச் சுருக்கமாகத் தருகிறது.
