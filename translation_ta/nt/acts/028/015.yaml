  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: ta
  text: அங்கிருந்து, சகோதரர்கள்[a] எங்களைப் பற்றிக் கேள்விப்பட்டு, அப்பியு சந்தை மற்றும் மூன்று சத்திரங்கள் வரைக்கும் எங்களைச் சந்திக்க வந்தார்கள். பவுல் அவர்களைக் கண்டதும், கடவுளுக்கு நன்றி செலுத்தி தைரியம் பெற்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதரர்களும் சகோதரிகளும்.” கிரேக்கத்தில் “சகோதரர்கள்” என்று உள்ளது; சூழலுக்கேற்ப உடன் விசுவாசிகளைக் குறிக்கும் இந்தப் பொதுவான சொல் பெண்களையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: அங்கிருந்து
  rationale: καί + ἐκεῖθεν என்பதன் இடமாற்றத் தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வாக்கியத் தொடரை நிறுத்தாமல் முன்னைய பயணக் குறிப்போடு இணைக்கிறது.
- source_word: οἱ ἀδελφοὶ
  choice: சகோதரர்கள்
  rationale: கிரேக்க ஆண்பால் பன்மை வடிவத்தை நேரடியாகப் பேணுகிறது. சூழலில் இது பெண்களையும் உள்ளடக்கிய உடன் விசுவாசிகளைக் குறிக்கக்கூடும் என்பதால் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: எங்களைப் பற்றிக் கேள்விப்பட்டு
  rationale: செய்தியைக் கேட்டதைக் குறிக்கும் காலநிலைப் பங்கேற்பை இயல்பான தமிழில் தருகிறது; τὰ περὶ ἡμῶν என்பதைக் குறிப்பிட்ட ‘செய்தி’ என்று மிகையாக நிர்ணயிக்காமல் அதன் பொருளைத் தக்கவைக்கிறது.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: எங்களைச் சந்திக்க வந்தார்கள்
  rationale: ஒருவரை எதிர்கொண்டு வரவேற்கச் செல்வதைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: அப்பியு சந்தை மற்றும் மூன்று சத்திரங்கள் வரைக்கும்
  rationale: ἄχρι குறிக்கும் எல்லை அல்லது தொலைவை ‘வரைக்கும்’ பேணுகிறது. Forum என்பதற்கு இச்சூழலில் ‘சந்தை’, Tabernae என்பதற்கு ‘சத்திரங்கள்’ என இடப்பெயர்களின் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: οὓς ἰδὼν
  choice: பவுல் அவர்களைக் கண்டதும்
  rationale: உறவுப்பெயரின் முன்னோடி சகோதரர்களே என்பதைத் தெளிவாக்கி, பங்கேற்பின் காலத் தொடர்பை ‘கண்டதும்’ என இயல்பாகக் காட்டுகிறது.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: கடவுளுக்கு நன்றி செலுத்தி
  rationale: தெய்வத்துக்குச் செலுத்தப்பட்ட நன்றியைத் தெளிவாகவும் கண்ணியமான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: ἔλαβε θάρσος
  choice: தைரியம் பெற்றார்
  rationale: ‘தைரியத்தைப் பெற்றார்’ என்ற கிரேக்கச் சொல்லமைப்பை இயல்பான தமிழில் நெருக்கமாகப் பேணுகிறது; வெறுமனே பிறரால் ஊக்குவிக்கப்பட்டார் என்று காரணத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: ἀδελφοί என்பது கலப்புப் பாலின விசுவாசிகள் குழுவைக் குறிக்கக்கூடிய விதம்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; விசுவாசிகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் பேணுகிறது; அக்காலப் பயன்பாட்டில் பெண்களையும் உள்ளடக்கக்கூடிய பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது. இதனால் வடிவமும் சாத்தியமான உள்ளடக்கமும் இரண்டும் மறைக்கப்படுவதில்லை.
