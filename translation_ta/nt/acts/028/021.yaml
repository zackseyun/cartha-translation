source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: ta
  text: ஆனால் அவர்கள் அவனிடம், “உன்னைப் பற்றி யூதேயாவிலிருந்து எங்களுக்குக் கடிதங்கள் எதுவும் வரவில்லை; வந்த சகோதரர்களில்[b] எவரும் உன்னைப் பற்றித் தீமையான எதையும்[a] தெரிவிக்கவோ பேசவோ இல்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைப் பற்றிக் கெட்டதாக எதையும்.”
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்கள்” என்பது யூதேயாவிலிருந்து வந்த சக யூதர்களைக் குறிக்கலாம்; அவர்கள் கிறிஸ்தவ விசுவாசிகள் என்று உரை வெளிப்படையாக அடையாளப்படுத்தவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ... εἶπαν
  choice: ஆனால் அவர்கள் ... என்றார்கள்
  rationale: δέ இங்கு உரையாடலில் மிதமான எதிர்நிலையைக் காட்டுகிறது; அதனை மிகைப்படுத்தாமல் இயல்பான தமிழில் ‘ஆனால்’ என வழங்குகிறது.
- source_word: γράμματα ... ἐδεξάμεθα
  choice: எங்களுக்குக் கடிதங்கள் எதுவும் வரவில்லை
  rationale: γράμματα என்பது இச்சூழலில் கடிதங்களைக் குறிக்கிறது. δέχομαι என்பதன் பெறுதல் என்ற பொருளை, தமிழ் வழக்கில் கடிதங்கள் ‘வருதல்’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: யூதேயாவிலிருந்து
  rationale: புவியியல் மூலத்தை நேரடியாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: அங்கிருந்து வந்த சகோதரர்களில் எவரும்
  rationale: பகுதிப்பொருளைக் காட்டும் τῶν ἀδελφῶν என்பதையும், வந்தடைந்ததைக் குறிக்கும் παραγενόμενος என்பதையும் இயல்பான தமிழில் காக்கிறது. ‘அங்கிருந்து’ என்பது முந்தைய யூதேயாவைச் சூழல்படி சுட்டுகிறது.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν
  choice: தெரிவிக்கவோ பேசவோ
  rationale: அறிக்கை அளித்தல் மற்றும் பேசுதல் என்ற இரு வினைகளுக்கிடையிலான மென்மையான வேறுபாட்டைக் காக்கிறது.
- source_word: τι περὶ σοῦ πονηρόν
  choice: உன்னைப் பற்றித் தீமையான எதையும்
  rationale: πονηρόν என்பதன் தீய அல்லது கேடான உள்ளடக்கத்தைத் தெளிவாகக் காட்டி, τι என்பதன் பொதுமையையும் காக்கிறது.
theological_decisions:
- issue: τῶν ἀδελφῶν என்பதன் குறிப்பு
  choice: ‘சகோதரர்கள்’ என்று மட்டும் மொழிபெயர்த்து, அவர்களை ஒரு குறிப்பிட்ட மதக்குழுவினராக அடையாளப்படுத்தவில்லை.
  alternative: ‘சக யூதர்கள்’ அல்லது ‘கிறிஸ்தவ சகோதரர்கள்’
  rationale: ரோமிலுள்ள யூதத் தலைவர்கள் யூதேயாவிலிருந்து வந்தவர்களைப் பற்றிப் பேசும் சூழலில், இது சக யூதர்களைக் குறிக்க வாய்ப்புள்ளது; எனினும் கிரேக்க உரை அவர்களை வெளிப்படையாக அடையாளப்படுத்தாததால் அந்தத் தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தெரிவிக்கவோ பேசவோ’ என்ற இணை அமைப்பு மூலத்தின் இரு வினைகளையும் காக்கிறது; ‘சகோதரர்கள்’ என்ற சொல் விளக்கக் குறிப்புடன் அதன் அடையாளத் தெளிவின்மையைப் பாதுகாக்கிறது.
