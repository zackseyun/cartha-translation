source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: ta
  text: அப்போது, புபிலியுவின் தந்தை காய்ச்சல்களாலும் சீதபேதியாலும் பீடிக்கப்பட்டுப் படுத்திருந்தார்.[a] பவுல் அவர் இருந்த இடத்திற்குள் சென்று, ஜெபித்து, அவர்மேல் தன் கைகளை வைத்து, அவரைக் குணமாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காய்ச்சல்களும் சீதபேதியும் பற்றிப்பிடித்ததால்.” கிரேக்க வினையெச்சம், இந்த நோய்கள் அவரைத் தொடர்ந்து பிடித்துத் துன்புறுத்திய நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: புபிலியுவின் தந்தை… படுத்திருந்தார்
  rationale: இது லூக்கா–அப்போஸ்தலர் நடபடிகளில் காணப்படும் நிகழ்வை அறிமுகப்படுத்தும் தொடர். தமிழில் தனியாக ‘நேர்ந்தது’ என்று சேர்ப்பதைவிட, நிகழ்வை நேரடியாகக் கூறுவது இயல்பாகவும் δέ-யின் மென்மையான தொடர்ச்சி உணர்வைச் சூழல் ஏற்கும் வகையிலும் உள்ளது.
- source_word: τὸν πατέρα τοῦ Ποπλίου
  choice: புபிலியுவின் தந்தை
  rationale: கிரேக்க உரையின் உடைமைத் தொடர்பை இயல்பான நவீன தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: πυρετοῖς
  choice: பல காய்ச்சல்கள்
  rationale: கிரேக்கப் பன்மையைப் பாதுகாக்கிறது; திரும்பத் திரும்ப அல்லது பலவிதத் தாக்கங்களாக வந்த காய்ச்சலைக் குறிக்கக்கூடிய அமைப்பாக உள்ளது.
- source_word: δυσεντερίῳ
  choice: சீதபேதி
  rationale: dysentery என்பதற்கான அறியப்பட்ட நவீன தமிழ் மருத்துவப் பெயர்; பொதுவான ‘வயிற்றுப்போக்கு’ என்பதைவிட நோயைத் துல்லியமாகக் குறிக்கிறது.
- source_word: συνεχόμενον
  choice: பீடிக்கப்பட்டு
  rationale: நோயால் தொடர்ந்து பிடிக்கப்பட்ட அல்லது துன்புறுத்தப்பட்ட நிலையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: κατακεῖσθαι
  choice: படுத்திருந்தார்
  rationale: நோயின் காரணமாகக் கிடந்த உடல்நிலையையும் கிரேக்க வினையின் அடிப்படைப் பொருளையும் தேவையற்ற மிகைப்படுத்தல் இன்றிக் காட்டுகிறது.
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: பவுல் அவர் இருந்த இடத்திற்குள் சென்று
  rationale: நோயுற்றவரிடம் பவுல் சென்றதோடு, அவர் இருந்த இடத்திற்குள் நுழைந்ததையும் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: προσευξάμενος
  choice: ஜெபித்து
  rationale: முதன்மைச் செயலான குணமாக்குதலுக்கு முன் நடந்த வேண்டுதலை இயல்பான தொடர் வினையெச்சத்தால் காட்டுகிறது.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: அவர்மேல் தன் கைகளை வைத்து
  rationale: கிரேக்கத்தின் பன்மையான ‘கைகள்’ என்பதையும் பவுலே அவற்றை வைத்தார் என்பதையும் பாதுகாக்கிறது.
- source_word: ἰάσατο αὐτόν
  choice: அவரைக் குணமாக்கினார்
  rationale: ἰάομαι என்ற வினையின் நேரடியான குணப்படுத்தும் பொருளை இறையியல் விளக்கத்தைச் சேர்க்காமல் தருகிறது.
theological_decisions:
- issue: பவுலின் குணமாக்கும் செயலின் தன்மை
  choice: ஜெபம், கைகளை வைத்தல், குணமாக்குதல் ஆகியவற்றை உரையில் உள்ள வரிசைப்படியே கூறுதல்
  alternative: இதை வெளிப்படையாக ‘அற்புத சுகமாக்குதல்’ என்றோ மருத்துவ ரீதியான ‘நோய் நீங்குதல்’ என்றோ விளக்குதல்
  rationale: வசனம் பவுலின் ஜெபத்துடனும் செயலுடனும் குணமாக்குதலை இணைக்கிறது; ஆனால் அது உடனடியாக நடந்ததா, எந்தத் தொழில்நுட்ப இறையியல் வகையைச் சேர்ந்ததா என்பதைக் குறிப்பிடவில்லை. ஆகவே அந்தத் தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘சீதபேதி’ மருத்துவத் துல்லியத்திற்காகவும், ‘படுத்திருந்தார்’ தேவையற்ற ‘படுக்கையிலிருந்து எழ முடியாதவர்’ என்ற மிகைப்படுத்தலைத் தவிர்க்கவும் தேர்ந்தெடுக்கப்பட்டன.
