source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: ta
  text: அந்த உயிரினம் அவருடைய கையிலிருந்து தொங்கிக்கொண்டிருப்பதைத் தீவுவாசிகள்[a] கண்டபோது, அவர்கள் ஒருவருக்கொருவர், “இந்த மனிதன் நிச்சயமாக ஒரு கொலைகாரன். இவன் கடலிலிருந்து பத்திரமாகத் தப்பிவந்தபோதிலும், நீதி[b] இவனை உயிர்வாழ விடவில்லை,” என்று சொல்லிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘கிரேக்கம் பேசாதவர்கள்’; இங்கு கிரேக்கம் பேசாத உள்ளூர் மக்களைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘நீதி’ என்பது குற்றத்துக்குத் தண்டனை வழங்கும் சக்தியாக ஆளுருவாக்கப்பட்டிருக்கலாம்; தீவுவாசிகளின் சமயப் புரிதலில் ஒரு தேவதை உருவத்தையும் இது சுட்டியிருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: தீவுவாசிகள்
  rationale: இச்சூழலில் மால்த்தா தீவில் வாழ்ந்த, கிரேக்கம் பேசாத உள்ளூர் மக்களைக் குறிக்கிறது; நவீன தமிழில் எதிர்மறையான பொருளைத் தரக்கூடிய ‘காட்டுமிராண்டிகள்’ என்பதைத் தவிர்த்து, சூழலுக்கேற்ற இயல்பான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: κρεμάμενον
  choice: தொங்கிக்கொண்டிருப்பதை
  rationale: உயிரினம் பவுலின் கையிலிருந்து தொங்கிய காட்சியை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; அது எவ்வாறு பற்றியிருந்தது என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: τὸ θηρίον
  choice: அந்த உயிரினம்
  rationale: கிரேக்கச் சொல் பொதுவாக விலங்கு அல்லது உயிரினம் எனப் பொருள்படும். முந்தைய வசனம் அதை பாம்பு என்று அடையாளப்படுத்தினாலும், இவ்வசனத்தின் பொதுப்படையான சொல்லாட்சியை இது காக்கிறது.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: அவர்கள் ஒருவருக்கொருவர் ... சொல்லிக்கொண்டார்கள்
  rationale: πρὸς ἀλλήλους என்பதை வெளிப்படையாகக் காத்து, imperfect வினையின் தொடர்ச்சியான உரையாடல் நிழலையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: Πάντως
  choice: நிச்சயமாக
  rationale: அவர்கள் கண்ட காட்சியிலிருந்து எடுத்த உறுதியான முடிவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: φονεύς
  choice: ஒரு கொலைகாரன்
  rationale: திட்டமிட்டு அல்லது குற்றமாக மனிதனைக் கொன்றவனைக் குறிக்கும் சொல்லுக்கு தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: διασωθέντα
  choice: பத்திரமாகத் தப்பிவந்தபோதிலும்
  rationale: கடல் ஆபத்திலிருந்து பாதுகாப்பாகக் கடந்துவந்த கருத்தை இயல்பான தமிழில் தருகிறது; இங்கு தேவையற்ற இரட்சிப்பியல் நிழலைச் சேர்ப்பதில்லை.
- source_word: ἡ δίκη
  choice: நீதி
  rationale: பழிவாங்கித் தண்டிக்கும் நீதி ஆளுருவாக்கப்பட்டிருப்பதைச் சொல்லின் இயல்பான பொருளை வைத்தே தருகிறது; குறிப்பிட்ட தேவதையாக பிரதான உரையில் மிகையாக அடையாளப்படுத்தவில்லை.
- source_word: ζῆν οὐκ εἴασεν
  choice: உயிர்வாழ விடவில்லை
  rationale: தொடர்ந்து வாழ அனுமதிக்கவில்லை என்ற கிரேக்கச் சொற்றொடரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἐκ τῆς θαλάσσης
  choice: கடலிலிருந்து
  rationale: ἐκ என்பதன் இடஞ்சார்ந்த ‘இலிருந்து’ என்ற பொருளைக் காக்கிறது; உயிர்தப்பிய கருத்து வினைச்சொல்லில் ஏற்கெனவே வெளிப்படுவதால் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
theological_decisions:
- issue: ἡ δίκη என்பதன் ஆளுருவாக்கம்
  choice: பிரதான உரையில் ‘நீதி’ என்றும், அடிக்குறிப்பில் தண்டனை வழங்கும் நீதி ஆளுருவாக்கப்பட்டிருக்கலாம் என்றும் குறிப்பிடுதல்
  alternative: ‘நீதி தேவதை’ அல்லது ‘பழிவாங்குதல்’ என்று மொழிபெயர்த்தல்
  rationale: தீவுவாசிகளின் புறசமய உலகப்பார்வையை உரை அறிக்கையிடுகிறது; அதை உரையாளர் ஏற்றுக்கொள்வதாகக் காட்டாமல் ஆளுருவாக்கத்தின் சாத்தியத்தைப் பாதுகாக்கிறது. குறிப்பிட்ட தேவதையையே குறிக்கிறது என்று மூலத்தைவிட அதிகமாகத் தீர்மானிப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையின் உறுதியான தொனியும், தீவுவாசிகளின் தவறானதாகத் தோன்றும் மதிப்பீட்டை உரையாளர் ஒப்புக்கொள்ளாமல் வெறும் அறிக்கையாகக் கூறும் இடைவெளியும் காக்கப்பட்டுள்ளன. அனைத்து அடிக்குறிப்பு குறியீடுகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
