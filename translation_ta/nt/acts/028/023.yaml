source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: ta
  text: அவர்கள் அவரோடு ஒரு நாளை நியமித்துக்கொண்ட பின்பு, அதிகமானோர்[a] அவர் தங்கியிருந்த இடத்திற்கு[b] வந்தார்கள். காலையிலிருந்து மாலைவரை, மோசேயின் திருச்சட்டத்திலிருந்தும் இறைவாக்கினர் நூல்களிலிருந்தும் விளக்கிக் காட்டி, அவர் அவர்களுக்குத் தேவனுடைய அரசாட்சியை விளக்கி அதைக் குறித்து வலியுறுத்திச் சான்றளித்தார்; மேலும் இயேசுவைப் பற்றி அவர்களை நம்பவைக்க முயன்றார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலர்.” கிரேக்கச் சொல் ஒப்பீட்டுப் பொருளில் “அதிகமானோர்” என்றும், சூழலின்படி பொதுவாக “பலர்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவர் தங்கியிருந்த தங்குமிடம் அல்லது வசிப்பிடம்.
    reason: lexical_clarification
  - marker: c
    text: அல்லது, “அவர்களை நம்பவைத்தார்.” கிரேக்கச் சொல் நம்பச் செய்யும் செயலை அல்லது அதற்கான முயற்சியை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι δὲ αὐτῷ ἡμέραν
  choice: அவர்கள் அவரோடு ஒரு நாளை நியமித்துக்கொண்ட பின்பு
  rationale: ஒரு சந்திப்பு நாளை அவருடன் ஏற்பாடு செய்துகொண்டார்கள் என்ற கிரேக்கச் சொற்றொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: πλείονες
  choice: இன்னும் அதிகமானோர்
  rationale: ஒப்பீட்டுப் பொருளைத் தக்கவைத்து, முன்பு வந்தவர்களைவிட அதிகமானோர் வந்ததைச் சுட்டுகிறது; சூழலின்படி ‘பலர்’ என்றும் கொள்ளலாம்.
- source_word: εἰς τὴν ξενίαν
  choice: அவர் தங்கியிருந்த இடத்திற்கு
  rationale: ξενία என்பது தங்குமிடம் அல்லது விருந்தினர் தங்கும் வசதியைக் குறிக்கிறது. தமிழில் குறிப்பிட்ட அறை அல்லது வீட்டுவகையை ஊகிக்காமல் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: ἐξετίθετο
  choice: விளக்கி
  rationale: நீடித்த விளக்கவுரையைச் சுட்டும் imperfect வடிவத்தின் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: διαμαρτυρόμενος
  choice: உறுதியாகச் சான்றளித்தார்
  rationale: வெறும் தகவல் கூறுதல் அல்லாமல், வலியுறுத்திச் சாட்சி அளித்தல் என்ற சொல்லின் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: தேவனுடைய அரசாட்சி
  rationale: βασιλεία என்பதிலுள்ள ஆட்சி/அரசுரிமை சார்ந்த பொருளை வெளிப்படுத்துகிறது; நிலப்பரப்பை மட்டும் குறிக்கும் ‘ராஜ்யம்’ என்ற புரிதலைத் தவிர்க்கிறது.
- source_word: πείθων τε αὐτοὺς
  choice: அவர்களை நம்பவைக்க முயன்றார்
  rationale: தொடர்ந்த இணங்கவைக்கும் முயற்சியை வெளிப்படுத்துகிறது; கேட்ட அனைவரும் உண்மையில் நம்பினர் என்று முடிவை முன்கூட்டியே நிர்ணயிப்பதில்லை.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: மோசேயின் திருச்சட்டத்திலிருந்தும் இறைவாக்கினர் நூல்களிலிருந்தும்
  rationale: ἀπό குறிக்கும் ஆதாரத்தைத் தக்கவைக்கிறது. ‘நூல்கள்’ என்பது இங்கு இஸ்ரவேலின் வேத எழுத்துகளைச் சுட்டுவதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: காலையிலிருந்து மாலைவரை
  rationale: கிரேக்கத்தில் கூறப்பட்ட கால அளவை மிகைப்படுத்தாமல் நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: தேவனுடைய அரசாட்சிக்கும் இயேசுவைப் பற்றிய சாட்சிக்கும் உள்ள தொடர்பு
  choice: ஒரே தொடர்ச்சியான விளக்கத்தில் தேவனுடைய அரசாட்சியைப் பற்றிச் சான்றளித்து, இயேசுவைப் பற்றி நம்பவைக்க முயன்றதாக மொழிபெயர்க்கப்பட்டது.
  alternative: அரசாட்சியும் இயேசுவும் தொடர்பில்லாத இரண்டு தனித்தனி தலைப்புகள் எனப் பிரித்துக் காட்டுதல்.
  rationale: கிரேக்க வாக்கிய அமைப்பு இரண்டையும் ஒரே நாள் முழுவதும் நடந்த வேத அடிப்படையிலான விளக்கச் செயலுக்குள் இணைக்கிறது; ஆனால் அவற்றின் முழுமையான இறையியல் உறவை வசனம் கூறுவதைக் கடந்துச் சீரமைக்கவில்லை.
- issue: πείθων என்பது வெற்றியடைந்த இணங்கவைத்தலா அல்லது முயற்சியா
  choice: நம்பவைக்க முயன்றார்
  alternative: நம்பவைத்தார்
  rationale: பங்கேற்புவினை இணங்கச் செய்யும் செயலைக் குறிக்கலாம்; அடுத்த வசனத்தில் கேட்போரின் பதில்கள் வேறுபடுவதால், அனைவரும் நம்பினர் என்ற முடிவை இங்கே திணிக்காமல் செயல்முறையை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. நீளமான கிரேக்க வாக்கியம் தமிழில் வாசிக்க எளிதாக இரண்டு கருத்துத் தொகுதிகளாக அமைக்கப்பட்டாலும், ஒரே தொடர்ச்சியான நிகழ்வாகவே பாதுகாக்கப்பட்டுள்ளது. “அரசாட்சி,” “திருச்சட்டம்,” “இறைவாக்கினர் நூல்கள்” ஆகியவை பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மூலத்தின் வேதச்சூழலைத் தக்கவைக்கும் வகையிலும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
