  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கடற்பயணச் சொல்லின் சிறப்புப் பொருள் முதன்மை உரையைச் சுமையாக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
