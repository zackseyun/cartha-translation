  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: ta
  text: அவர் இவற்றைச் சொன்னபின்,[a] யூதர்கள் தங்களுக்குள் பெரும் விவாதத்தில் ஈடுபட்டபடி அங்கிருந்து சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த முழு வசனமும் மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில்—மூன்றாம் நூற்றாண்டைச் சேர்ந்த பப்பிரஸ் 74, நான்காம் நூற்றாண்டைச் சேர்ந்த சினாய்டிகஸ் மற்றும் வத்திக்கானஸ் உட்பட—மற்றும் பழைய காப்டிக் மொழிபெயர்ப்புகளில் இல்லை. ஆனால் பைசாந்தியப் பெரும்பான்மை உரைமரபிலும் பழைய இலத்தீன் மற்றும் சிரியாக் மொழிபெயர்ப்புகளிலும் உள்ளது. யூதர்கள் சென்றதைச் சொல்லி நிகழ்வை நிறைவுசெய்வதற்காக, இது பிற்கால நகலெழுத்தர் விரிவாக்கமாகச் சேர்க்கப்பட்டிருக்க வாய்ப்புள்ளது.
    reason: textual_critical
lexical_decisions:
- source_word: συζήτησις
  choice: கடுமையாக விவாதித்துக்கொண்டே
  rationale: இந்தச் சொல் விவாதம், வாதம் அல்லது சர்ச்சையைக் குறிக்கலாம். பவுலின் செய்தியைப் பற்றிய அவர்களுடைய கருத்து வேறுபாட்டின் தீவிரத்தை πολλήν என்பதுடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπέρχομαι
  choice: அங்கிருந்து சென்றார்கள்
  rationale: காட்சியின் இடத்திலிருந்து அவர்கள் வெளியேறியதை நவீன, இயல்பான தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: ἐν ἑαυτοῖς
  choice: தங்களுக்குள்
  rationale: யூதத் தலைவர்களிடையே நடந்த பரஸ்பர விவாதத்தைச் சுருக்கமாகவும் துல்லியமாகவும் குறிக்கிறது.
