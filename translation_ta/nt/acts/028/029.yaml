translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளது. ‘பலத்த விவாதத்தைத் தங்களுக்குள் கொண்டவர்களாய்’ என்ற சொற்குச் சொல் அமைப்புக்குப் பதிலாக, கிரேக்கத்தின் தீவிரத்தையும் தொடர்நிலையையும் இயல்பாக வெளிப்படுத்த ‘கடுமையாக விவாதித்துக்கொண்டே’ பயன்படுத்தப்பட்டுள்ளது.
