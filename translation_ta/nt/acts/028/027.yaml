id: ACT.28.27
reference: Acts 28:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: ta
  text: ஏனெனில், இந்த மக்களின் இதயம் மழுங்கிப்போயிற்று; அவர்கள் காதுகளால் மந்தமாகக் கேட்டார்கள்; தங்கள் கண்களை மூடிக்கொண்டார்கள். இல்லாவிட்டால்[a], அவர்கள் தங்கள் கண்களால் கண்டு, காதுகளால் கேட்டு, இதயத்தால் புரிந்துகொண்டு, திரும்பக்கூடும்[b]; அப்போது நான் அவர்களைக் குணமாக்குவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கள் கண்களால் கண்டு, காதுகளால் கேட்டு, இதயத்தால் புரிந்துகொண்டு, திரும்பி, நான் அவர்களைக் குணமாக்கிவிடாதபடிக்கு.” ஏசாயாவிலிருந்து மேற்கோள் காட்டப்பட்டுள்ள இவ்விடத்தில், கிரேக்க இணைப்புச்சொல் ‘அவ்வாறு நிகழாதபடிக்கு’ அல்லது ‘காணாதபடிக்கு’ என்ற வலுவான நோக்க/தடுப்புப் பொருளையும் கொண்டிருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “திரும்புதல்” என்பதை இங்கு “மீளுதல்” என்றும், சூழலின்படி “மனம் திரும்புதல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: உணர்வற்றுப் போயிற்று
  rationale: சொல்லின் நேரடிப் பொருள் ‘தடித்தது/கொழுத்தது’; இங்கு இதயத்தின் உணர்வின்மையைக் குறிக்கும் உருவகம். நவீன தமிழில் இயல்பாக அதன் உருவகப் பொருளைத் தெரிவிக்கிறது.
- source_word: καρδία
  choice: இதயம்
  rationale: வேதாகம மனிதவியல் சொல்லைத் தக்கவைத்து, பின்னர் வரும் ‘இதயத்தால் புரிந்துகொண்டு’ என்பதுடனான கருத்து ஒற்றுமையையும் காக்கிறது.
- source_word: βαρέως ἤκουσαν
  choice: காதுகளால் மந்தமாகக் கேட்டார்கள்
  rationale: ‘கனமாக/மந்தமாகக் கேட்டார்கள்’ என்ற கிரேக்க உருவகத்தையும் இறந்தகால வினையையும் இயன்றவரைத் தக்கவைக்கிறது; ‘கேட்கவே இல்லை’ என்று மிகைப்படுத்தவில்லை.
- source_word: ἐκάμμυσαν
  choice: மூடிக்கொண்டார்கள்
  rationale: கண்களைத் தாங்களே மூடிய செயலை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: μήποτε
  choice: இல்லாவிட்டால்
  rationale: எதிர்மறை விளைவு அல்லது நோக்கத்தை அறிமுகப்படுத்தும் இணைப்பை வாசிக்க இயல்பான முறையில் தருகிறது; வலுவான ‘காணாதபடிக்கு’ என்ற நோக்க நிழல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: συνῶσιν
  choice: புரிந்துகொண்டு
  rationale: இதயத்தால் அறிதல் அல்லது உணர்தல் என்ற பொருளை எளிய, நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐπιστρέψωσιν
  choice: திரும்பக்கூடும்
  rationale: திரும்புதல்/மீளுதல் என்ற திசை உருவகத்தைப் பாதுகாக்கிறது; ‘மனந்திரும்புதல்’ என்று பொருளைத் தேவையின்றி குறுக்கவில்லை.
- source_word: ἰάσομαι
  choice: நான் அவர்களைக் குணமாக்குவேன்
  rationale: எதிர்கால வினையின் ‘நான் குணமாக்குவேன்’ என்ற வடிவைத் தக்கவைக்கிறது; முன் வரும் சாத்திய நிபந்தனையோடு அதன் தொடர்பை ‘அப்போது’ தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் இறை நோக்கமும் மனிதப் பொறுப்பும்
  choice: முதன்மை உரையில் ‘இல்லாவிட்டால்’ என்று மொழிபெயர்த்து, வலுவான நோக்க நிழலை அடிக்குறிப்பில் தருதல்
  alternative: ‘அவர்கள் காணாதபடிக்கு’ அல்லது ‘அவர்கள் காணாதிருக்கும்படி’
  rationale: கிரேக்க μήποτε இறைத் தீர்ப்புக்கும் மனிதரின் கண்மூடுதலுக்கும் இடையிலான பதற்றத்தைத் தாங்குகிறது. முதன்மை உரையும் அடிக்குறிப்பும் சேர்ந்து அந்தப் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கின்றன.
- issue: ἐπιστρέψωσιν என்பதன் மனமாற்றச் சார்பு
  choice: திரும்பக்கூடும்
  alternative: மனம் திரும்பக்கூடும்; மனந்திரும்பக்கூடும்; மீளக்கூடும்
  rationale: மாற்றத்தை நோக்கிய பொருளை அனுமதிக்கிறது; ஆனால் வினையில் வெளிப்படையாக இல்லாத ஒரு குறிப்பிட்ட கோட்பாட்டுச் சொல்லைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் செறிவும் உள்ள நடை. ‘இதயம்’, ‘கண்கள்’, ‘காதுகள்’ என்ற மூலப்படிமங்கள் பாதுகாக்கப்பட்டுள்ளன; கிரேக்கத்தின் சற்றே அசாதாரணமான ‘மந்தமாகக் கேட்டார்கள்’ என்ற உருவகமும் மிகையாகச் சீராக்கப்படவில்லை.
