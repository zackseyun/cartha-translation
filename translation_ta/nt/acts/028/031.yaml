id: ACT.28.31
reference: Acts 28:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: ta
  text: தேவனுடைய ராஜ்யத்தைப் பறைசாற்றியும், ஆண்டவராகிய இயேசு மெசியாவைக்[a] குறித்தவற்றைக் கற்பித்தும், முழுத் துணிவோடு தடையின்றி இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு கிறிஸ்துவைக்.” கிரேக்க மொழியிலுள்ள Χριστός என்ற சொல் “மெசியா” என்ற பட்டமாகவோ, சில சூழல்களில் “கிறிஸ்து” என்ற பெயர்போன்ற அடையாளமாகவோ அமையலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: பறைசாற்றி
  rationale: பொதுவெளியில் அதிகாரத்தோடு அறிவிக்கும் செயலைக் காட்டுகிறது; இதை முறைப்படியான பிரசங்கத்துக்கு மட்டும் குறுக்கவில்லை.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: தேவனுடைய அரசு
  rationale: βασιλεία என்பதன் ஆட்சியையும் ஆளுகைக்குரிய பரப்பையும் உள்ளடக்கக்கூடிய இயல்பான தமிழ் தொடர்.
- source_word: διδάσκων
  choice: கற்பித்துவந்தான்
  rationale: நடந்துகொண்டிருந்த தொடர்ச்சியான செயலை நிகழ்காலப் பங்கேற்பெயரின் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: τὰ περὶ
  choice: குறித்தவற்றை
  rationale: கிரேக்கத் தொடரின் ‘சம்பந்தப்பட்ட காரியங்கள்’ என்ற விரிவைத் தக்கவைத்தபடி தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: κυρίου
  choice: ஆண்டவராகிய
  rationale: இங்கு இயேசுவுக்குரிய நிறுவப்பட்ட கிறிஸ்தவப் பட்டமாக κύριος பயன்படுவதைக் காட்டுகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பட்டப் பொருளை வெளிப்படையாகக் காக்கிறது; தமிழில் வேற்றுமை உருபுடன் ‘இயேசு மெசியாவைக்’ என அமைந்துள்ளது.
- source_word: μετὰ πάσης παρρησίας
  choice: முழுத் துணிவோடு
  rationale: அச்சமின்றியும் வெளிப்படையாகவும் பேசும் παρρησία என்பதன் வலிமையையும் πάσης தரும் முழுமையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀκωλύτως
  choice: தடையின்றி
  rationale: எந்தத் தடைசெய்தலும் இல்லாமல் பவுலின் பணி தொடர்ந்தது என்ற நூலின் நிறைவு வலியுறுத்தலைச் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்ற தொடரில் Χριστός-ஐ வழங்குதல்
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இச்சூழலில் Χριστός-இன் பட்டப் பொருள் இன்னும் கேட்கப்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டது. அதே சொல் சில சூழல்களில் பெயர்போன்ற அடையாளமாகவும் செயல்படக்கூடிய உண்மையான தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சியான வினையெச்ச அமைப்பு என்றாலும், தமிழில் தனிவசனமாக வாசிக்க இயல ‘கற்பித்துவந்தான்’ என முடிக்கப்பட்டது. ‘முழுத் துணிவோடு, தடையின்றி’ என்ற இறுதி வரிசை கிரேக்கத்தின் உச்சநிலை முடிவைத் தக்கவைக்கிறது.
