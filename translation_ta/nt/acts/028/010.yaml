  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தின் சொல் மறுபயன்பாடு பிரதான உரையில் இயல்பாக்கப்பட்டு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; கடற்பயணச் சூழல் தமிழில் தெளிவுபடுத்தப்பட்டுள்ளது.
