source:
  edition: SBLGNT
  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: ta
  text: அவர்கள் எங்களுக்கு மிகுந்த மரியாதை காட்டினார்கள்[a]. நாங்கள் கடற்பயணத்தைத் தொடங்கியபோது[b], எங்களுக்குத் தேவையானவற்றைக் கப்பலில் ஏற்றினார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கம் சொல்லுக்குச் சொல் நெருக்கமாக, “பல மரியாதைகளால் எங்களை மரியாதை செய்தார்கள்” என்று ஒரே சொல்வேரைத் திரும்பக் கூறி வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாங்கள் கடலுக்குள் புறப்பட்டபோது.” இங்கு வரும் கிரேக்கச் சொல் கப்பல் பயணத்தைத் தொடங்குவதைக் குறிக்கும் கடல்சார் சொல்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எங்களுக்குத் தேவையானவற்றை அவர்கள் வழங்கினார்கள்.” கிரேக்கம் இன்னும் நேரடியாக, தேவைக்குரிய பொருள்களை அவர்கள் வைத்தார்கள் என்று கூறுகிறது; கப்பல் என்பது சூழலிலிருந்து தெளிவாகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: மிகுந்த மரியாதை காட்டினார்கள்
  rationale: கிரேக்கத்தில் ‘பல மரியாதைகளால் மரியாதை செய்தார்கள்’ என்று ஒரே சொல்வேரை மீண்டும் பயன்படுத்தும் வலியுறுத்தல் உள்ளது. தமிழில் இயல்பாகவும் அதன் வலிமையைத் தக்கவைத்தும் ‘மிகுந்த மரியாதை காட்டினார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἀναγομένοις
  choice: கடற்பயணத்தைத் தொடங்கியபோது
  rationale: ἀνάγω என்ற வினையின் இக்கடல்சார் பயன்பாடு கப்பலில் பயணத்தைத் தொடங்குவதையோ கடலுக்குள் புறப்படுவதையோ குறிக்கிறது; பொதுவான ‘புறப்பட்டபோது’ என்பதைவிட இத்தேர்வு சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπέθεντο
  choice: கப்பலில் ஏற்றினார்கள்
  rationale: ‘வைத்தார்கள்’ என்பது அடிப்படைப் பொருளாக இருந்தாலும், கடற்பயணச் சூழலில் பொருள்களைக் கப்பலில் வைத்ததைக் குறிக்க இயல்பான தமிழில் ‘கப்பலில் ஏற்றினார்கள்’ எனத் தரப்பட்டது.
- source_word: τὰ πρὸς τὰς χρείας
  choice: எங்களுக்குத் தேவையானவற்றை
  rationale: இச்சொற்றொடர் தேவைகளை நிறைவேற்றும் பொருள்கள் அல்லது பயணப் பொருட்களைக் குறிக்கிறது. கிரேக்கத்தில் பொருள்களின் பட்டியல் குறிப்பிடப்படாததால் பொதுவான வடிவம் தக்கவைக்கப்பட்டது.
