  source_fidelity: மூலக் கிரேக்கத்தின் தர்க்க இணைப்பு (οὖν), அறிவிப்புக் கட்டளைத் தொனி (γνωστὸν ... ἔστω ὑμῖν), யூதர்–யூதரல்லாதவர் சூழலில் τοῖς ἔθνεσιν என்பதன் பொருள், நிறைவேறிய செயப்பாட்டு அனுப்புதல் (ἀπεστάλη), மற்றும் αὐτοὶ καὶ தரும் வலியுறுத்தல் அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘செவிகொடுப்பார்கள்’ என்பது சூழலுக்கேற்ற ஏற்றுக்கொள்ளும் கேட்பைக் குறிக்கிறது; மனமாற்றம் போன்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
