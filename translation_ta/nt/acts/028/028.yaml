source:
  edition: SBLGNT
  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: ta
  text: ஆகவே, கடவுளின் இந்த மீட்பு[a] யூதரல்லாதவர்களுக்கு அனுப்பப்பட்டுள்ளது என்பதை நீங்கள் அறிந்துகொள்ளுங்கள். அவர்களும் செவிகொடுப்பார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளிடமிருந்து வரும் இந்த மீட்பு.’ கிரேக்கத்தில் உள்ள உடைமை வேற்றுமையை ஒன்றுக்கொன்று நெருங்கிய இந்த இரண்டு விதங்களிலும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களும் கேட்பார்கள்.’ சூழலைப் பொறுத்து, இங்குள்ள கிரேக்க வினைச்சொல் ‘கேட்பது’ அல்லது ‘செவிகொடுத்துக் கேட்பது’ என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: ஆகவே, ... என்பதை நீங்கள் அறிந்துகொள்ளுங்கள்
  rationale: οὖν முந்தைய உரையாடலிலிருந்து வரும் முடிவைக் குறிக்கிறது; γνωστὸν ἔστω ὑμῖν என்பது பொதுவாகவும் உறுதியாகவும் அறிவிக்கும் கட்டளைத்தொனி கொண்ட சொற்றொடர். நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: τοῖς ἔθνεσιν
  choice: யூதரல்லாதவர்களுக்கு
  rationale: அப்போஸ்தலர் பணிகளில் யூதர்கள்–ἔθνη என்ற எதிரெதிர் சூழலில், இச்சொல் பொதுவாக யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தாருக்கு’ என்பதைக் காட்டிலும் இத்தேர்வு சூழல்சார் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀπεστάλη
  choice: அனுப்பப்பட்டுள்ளது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவம் நிறைவேறிய அனுப்புதலைக் குறிக்கிறது. ‘அனுப்பப்பட்டுள்ளது’ என்பது அந்த நிறைவேறிய செயலின் தற்போதைய தொடர்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: கடவுளின் இந்த மீட்பு
  rationale: σωτήριον பெயர்ச்சொல் தன்மையில் ‘மீட்பு’ என மொழிபெயர்க்கப்பட்டுள்ளது. τοῦ θεοῦ என்பதன் உறவையோ மூலத்தையோ ஒரே பொருளாகச் சுருக்காமல், ‘கடவுளின்’ என்ற வடிவம் கிரேக்கத்தின் நெருங்கிய தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: அவர்களும் செவிகொடுப்பார்கள்
  rationale: αὐτοὶ καὶ தரும் வலியுறுத்தல் ‘அவர்களும்’ என்பதில் பிரதிபலிக்கிறது. சூழலில் ἀκούω வெறுமனே ஒலியைக் கேட்பதைவிட ஏற்றுக்கொள்ளும் மனத்துடன் கேட்பதைக் குறிப்பதால் ‘செவிகொடுப்பார்கள்’ தேர்ந்தெடுக்கப்பட்டது; ஆனால் மனமாற்றம் போன்ற கூடுதல் கருத்து சேர்க்கப்படவில்லை.
theological_decisions:
- issue: σωτήριον என்பதன் சூழல்சார் பொருள்
  choice: மீட்பு
  alternative: மீட்புச் செய்தி
  rationale: கிரேக்கச் சொல் நேரடியாக மீட்பைக் குறிக்கிறது. அறிவிப்பு சூழலில் இருந்தாலும், ‘மீட்புச் செய்தி’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும்; ஆகவே கடவுளின் மீட்புச் செயலின் பரந்த பொருள் பாதுகாக்கப்படுகிறது.
- issue: ἀκούσονται என்பதன் வலிமை
  choice: செவிகொடுப்பார்கள்
  alternative: கேட்பார்கள்
  rationale: சிலரின் மறுப்புக்கும் யூதரல்லாதவர்களின் எதிர்பார்க்கப்படும் ஏற்புக்கும் இடையிலான வேறுபாட்டை ‘செவிகொடுப்பார்கள்’ வெளிப்படுத்துகிறது. அதேவேளை, அவர்கள் நிச்சயமாக மனமாறுவார்கள் என்ற கூடுதல் இறையியல் முடிவை இது சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘யூதரல்லாதவர்கள்’ சூழல்சார் தெளிவுக்காகவும், ‘மீட்பு’ இயல்பான நவீன இறையியல் சொல்லாகவும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
