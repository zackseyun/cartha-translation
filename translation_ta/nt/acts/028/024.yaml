  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐπείθοντο τοῖς λεγομένοις οἱ δὲ ἠπίστουν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/024.yaml
  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: ta
  text: சொல்லப்பட்டவற்றால் சிலர் மனம் இணங்கினர்; மற்றவர்களோ நம்பவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்ப மறுத்தனர்.”
    reason: ἀπιστέω என்பதற்கு சூழலைப் பொறுத்து நம்பாமை அல்லது நம்ப மறுத்தல் என்ற நுணுக்கங்கள் இருக்கலாம்; முதன்மை உரை குறைந்த விளக்கச்சுமையுள்ள பொருளைத் தருகிறது.
lexical_decisions:
- source_word: ἐπείθοντο
  choice: மனம் இணங்கினர்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம், பவுலின் உரையால் சிலர் படிப்படியாக இணங்கிய பதிலைச் சுட்டுகிறது. ‘விசுவாசித்தனர்’ என்று மொழிபெயர்த்து முழுமையான இரட்சிப்பு விசுவாசம் என்ற பொருளைத் திணிக்காமல், வாதத்தால் ஏற்கத் தூண்டப்பட்ட உணர்வைப் பாதுகாக்கிறது.
- source_word: τοῖς λεγομένοις
  choice: சொல்லப்பட்டவற்றால்
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலச் செயப்பாட்டு எச்சம், பேசப்பட்ட செய்தியின் உள்ளடக்கத்தைக் குறிக்கிறது. தமிழில் இயல்பாகவும் கிரேக்கத்தின் செயப்பாட்டு உறவைக் காக்கும் விதமாகவும் உள்ளது.
- source_word: ἠπίστουν
  choice: நம்பவில்லை
  rationale: ἀπιστέω என்பதன் நேரடியான பொருளான ‘நம்பாமல் இருத்தல்’ என்பதைக் காட்டுகிறது; ‘நம்ப மறுத்தனர்’ என்ற மனவுறுதி சார்ந்த கூடுதல் நுணுக்கத்தை முதன்மை உரையில் திணிப்பதில்லை.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: சிலர் ... மற்றவர்களோ
  rationale: குழுவுக்குள் ஏற்பட்ட இருவேறு பதில்களை இயல்பான தமிழில் தெளிவான முரண்பாடாகக் காட்டுகிறது.
- source_word: καὶ
  choice: வெளிப்படையாகத் தனிச் சொல்லால் மொழிபெயர்க்கப்படவில்லை
  rationale: தமிழில் வசனத் தொடர்ச்சி சூழலாலும் வாக்கிய வரிசையாலும் இயல்பாக வெளிப்படுகிறது; ‘மேலும்’ அல்லது ‘அப்போது’ சேர்ப்பது இங்கு செயற்கையாகவோ விளக்கவுரையாகவோ ஒலிக்கும்.
theological_decisions:
- issue: பதில்களின் இயல்பு
  choice: சிலர் செய்தியால் மனம் இணங்கினர்; மற்றவர்கள் அதை நம்பவில்லை என்ற உடனடி நிகழ்ச்சிநிலை வேறுபாட்டை மட்டும் வெளிப்படுத்துதல்
  alternative: மனம் இணங்கியவர்கள் முழுமையான இரட்சிப்பு விசுவாசம் பெற்றவர்கள் என்றும் மற்றவர்கள் திட்டமிட்டு நம்ப மறுத்தவர்கள் என்றும் மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை இருவேறு பதில்களைத் தெரிவிக்கிறது; ஆனால் ஒவ்வொருவரின் இறுதியான ஆவிக்குரிய நிலையை வரையறுப்பதில்லை. ஆகவே அந்த இறையியல் பதற்றம் தீர்மானிக்கப்படாமல் விடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மனம் இணங்கினர்’ என்பது புரியத்தக்க தற்போதைய சொற்றொடராக இருந்து, ‘விசுவாசித்தனர்’ என்ற இறையியல் ரீதியாக அதிகம் வரையறுக்கப்பட்ட சொல்லைத் தவிர்க்கிறது.
