base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: ta
  text: 'அவர்கள் ஒருவரோடு ஒருவர் உடன்படாததால், பவுல் ஒரு இறுதி வார்த்தையைச்[a] சொன்னபின் அவர்கள் கலைந்து செல்லத் தொடங்கினர்: “தூய ஆவியானவர் இறைவாக்கினர் ஏசாயா வழியாக உங்கள் தந்தையரிடம்[b][c] சரியாகவே பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு சொல்” அல்லது “ஒரு கூற்று.” கிரேக்கத்தில் சொல்லுக்கு சொல் “ஒரு வார்த்தை”; இங்கு அது முடிவாகக் கூறப்பட்ட ஒரு கருத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் முன்னோர்களிடம்.” கிரேக்கத்தில் “உங்கள் தந்தையரிடம்” என்றுள்ளது; இது இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சில பழமையான கையெழுத்துப் பிரதிகளில் “உங்கள்” என்ற சொல் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: அவர்கள் ஒருவரோடு ஒருவர் உடன்படாததால்
  rationale: இந்தச் சொற்றொடர் அவர்களுக்கிடையிலிருந்த பரஸ்பரக் கருத்து வேறுபாட்டைக் குறிக்கிறது. காரணத் தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; கருத்தொற்றுமையின்மையை மிகைப்படுத்தவில்லை.
- source_word: ἀπελύοντο
  choice: கலைந்து செல்லத் தொடங்கினர்
  rationale: இடைத்தன்மை/செயப்பாட்டு வடிவிலுள்ள இறந்தகாலத் தொடர்வினை, கூட்டம் பிரிந்து புறப்படத் தொடங்கிய நிகழ்வைச் சுட்டுகிறது. தமிழ் மொழியில் நிகழ்வின் தொடக்கமும் கூட்டம் கலைவதும் இயல்பாக வெளிப்படுகின்றன.
- source_word: εἰπόντος τοῦ Παύλου
  choice: பவுல் ... சொன்னபின்
  rationale: தனி உருபேற்றுத் தொடரை காலத் தொடர்புடைய உட்பிரிவாக மொழிபெயர்க்கிறது; εἰπόντος என்பதற்கு ‘சொன்ன’ என்பது நேரான பொருத்தம்.
- source_word: ῥῆμα ἓν
  choice: இறுதியாக ஒரு வார்த்தையை
  rationale: சொல்லுக்கு சொல் ‘ஒரு வார்த்தை’; இங்கு விடைபெறுமுன் கூறிய முடிவுரையாகச் செயல்படுவதால் ‘இறுதியாக’ சேர்க்கப்பட்டுள்ளது. அடிப்படை உருவகம் தக்கவைக்கப்படுகிறது.
- source_word: Καλῶς
  choice: சரியாகவே
  rationale: தூய ஆவியானவர் கூறியதன் சரித்தன்மையை மதிப்பிடும் வினையடை. ‘நன்றாக’ என்பதைவிட இச்சூழலில் ‘சரியாகவே’ தெளிவானது.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: தூய ஆவியானவர்
  rationale: தெய்வீக நபரைக் குறிக்கும் மரியாதையான, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐλάλησεν
  choice: பேசினார்
  rationale: λαλέω என்பதன் இயல்பான பொருளைத் தக்கவைத்து, தீர்க்கதரிசி வழியான உரைக்கு ஏற்ற மரியாதை வினைமுற்றைப் பயன்படுத்துகிறது.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: இறைவாக்கினர் ஏசாயா வழியாக
  rationale: διά + உரிமை வேற்றுமை சுட்டும் கருவி அல்லது இடைமுகச் செயற்பாட்டை ‘வழியாக’ தெளிவாகக் காட்டுகிறது.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: உங்கள் தந்தையரிடம்
  rationale: πατέρας என்ற ஆண்பால் குடும்பச் சொல்லை ‘தந்தையர்’ எனப் பாதுகாக்கிறது; இங்கு அது இஸ்ரவேலின் முன்னோர்களைக் குறிக்கிறது.
theological_decisions:
- issue: தீர்க்கதரிசன உரையில் தூய ஆவியானவரின் செயற்பாடு
  choice: தூய ஆவியானவர் இறைவாக்கினர் ஏசாயா வழியாக ... பேசினார்
  alternative: தூய ஆவியானவர் ஏசாயாவைக் கொண்டு ... பேசினார்
  rationale: உரையின் பேச்சாளர் தூய ஆவியானவர் என்றும் ஏசாயா அதன் மனித இடைமுகம் என்றும் கிரேக்க வாக்கியம் கூறுவதை அப்படியே தக்கவைக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ‘உங்கள் தந்தையர்’ என்பதன் குறிப்பு
  choice: உங்கள் தந்தையர்
  alternative: உங்கள் முன்னோர்கள்
  rationale: πατέρας என்பதன் வெளிப்படையான தந்தை/மூதாதையர் மொழியைப் பாதுகாக்கிறது; சூழலில் அது இஸ்ரவேலின் முற்பிதாக்களைக் குறித்தாலும், பொதுவான ‘முன்னோர்கள்’ என்று அமைதியாகப் பொதுமைப்படுத்தவில்லை.
translation_notes:
  register: நவீன, மரியாதையான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தூய ஆவியானவர்’ மற்றும் ‘இறைவாக்கினர்’ ஆகியவை தெளிவான, கண்ணியமான வடிவங்கள். அடுத்த வசனத்தில் தொடரும் நேரடி மேற்கோளைச் சுட்டுவதற்காக இறுதியில் மேற்கோள் குறி மூடப்படவில்லை; முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
