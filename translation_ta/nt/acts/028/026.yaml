id: ACT.28.26
reference: Acts 28:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: ta
  text: 'இவ்வாறு கூறி: “இந்த மக்களிடம் சென்று, அவர்களுக்குச் சொல்: ‘நீங்கள் கேட்கவே கேட்பீர்கள்[a]; ஆனால் ஒருபோதும் புரிந்துகொள்ள மாட்டீர்கள். நீங்கள் பார்க்கவே பார்ப்பீர்கள்[b]; ஆனால் ஒருபோதும் உணர மாட்டீர்கள்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல் நெருக்கமாக, “கேட்டுக் கேட்பீர்கள்.” இது கிரேக்கத்தில் பாதுகாக்கப்பட்டுள்ள எபிரெயப் பாணியிலான வலியுறுத்தல்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பார்த்துக்கொண்டு பார்ப்பீர்கள்; ஆனால் ஒருபோதும் காண மாட்டீர்கள்.” கிரேக்கத்தில் பார்வையைக் குறிக்கும் சொற்கள் மீண்டும் வருகின்றன; சூழலில் இறுதி வினை உள்ளார்ந்த உணர்தலையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: இவ்வாறு கூறினார்
  rationale: நிகழ்கால வினையெச்சம் முந்தைய வசனத்துடன் இணைந்து மேற்கோளை அறிமுகப்படுத்துகிறது. தனி வசனமாகவும் இயல்பாக வாசிக்க, தமிழில் வினைமுற்றாக வழங்கப்பட்டுள்ளது; ‘இவ்வாறு’ மேற்கோள் அறிமுகத்தின் தொடர்பைத் தக்கவைக்கிறது.
- source_word: Πορεύθητι πρὸς τὸν λαὸν τοῦτον
  choice: இந்த மக்களிடம் போய்
  rationale: πορεύθητι என்பதன் இயக்கக் கட்டளையை ‘போய்’ இயல்பாக வெளிப்படுத்துகிறது. λαὸν τοῦτον என்பது ஒரு கூட்டத்தைக் குறித்தாலும், நவீன தமிழில் ‘இந்த மக்கள்’ என்பதே தெளிவான இயல்பான வடிவம்.
- source_word: εἰπόν
  choice: அவர்களிடம் சொல்
  rationale: ஒருமைக் கட்டளை வடிவம் ‘சொல்’ என்று நேரடியாக வழங்கப்பட்டுள்ளது. ‘அவர்களிடம்’ என்பது தமிழில் முகவரியைத் தெளிவாக்குகிறது.
- source_word: Ἀκοῇ ἀκούσετε
  choice: நீங்கள் கேட்கவே கேட்பீர்கள்
  rationale: பெயர்ச்சொல்லும் அதே வேருடைய வினையும் சேர்ந்த கிரேக்க அமைப்பின் வலியுறுத்தலை, இயல்பான தமிழ் வலியுறுத்தல் வடிவமான ‘கேட்கவே கேட்பீர்கள்’ வெளிப்படுத்துகிறது.
- source_word: οὐ μὴ συνῆτε
  choice: ஒருபோதும் புரிந்துகொள்ள மாட்டீர்கள்
  rationale: οὐ μή உடன் வரும் வலுவான மறுப்பை ‘ஒருபோதும் ... மாட்டீர்கள்’ தெளிவாகக் காட்டுகிறது; συνίημι என்பதற்கு ‘புரிந்துகொள்ள’ பொருத்தமானது.
- source_word: βλέποντες βλέψετε
  choice: நீங்கள் பார்க்கவே பார்ப்பீர்கள்
  rationale: மீண்டும் வரும் பார்வைச் சொல்லையும் அதன் வலியுறுத்தலையும் தமிழ் இணைவேர் அமைப்பால் தக்கவைக்கிறது.
- source_word: οὐ μὴ ἴδητε
  choice: ஒருபோதும் உணர மாட்டீர்கள்
  rationale: ἴδητε அடிப்படையில் ‘காண்பீர்கள்’ எனப் பொருள்படலாம்; இச்சூழலில் வெளிப்புறப் பார்வைக்கும் உள்ளார்ந்த உணர்தலுக்கும் இடையிலான முரணை ‘உணர’ காட்டுகிறது. நேரடியான பார்வைப் பொருள் அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் புலனுணர்வுச் சொற்கள் உள்ளார்ந்த புரிதலின்மையையும் சுட்டுவது
  choice: இறுதி ἴδητε என்பதை ‘உணர மாட்டீர்கள்’ என்று வழங்குதல்
  alternative: ‘காணவே மாட்டீர்கள்’ அல்லது ‘பார்க்கவே மாட்டீர்கள்’
  rationale: மேற்கோள் வெளிப்புறமாகக் கேட்பதையும் பார்ப்பதையும் உள்ளார்ந்து புரிந்துகொள்ளாமை மற்றும் உணராமையுடன் மோதவைக்கிறது. ‘உணர’ அந்தச் சூழல்பொருளை வெளிப்படுத்துகிறது; அதேவேளை கிரேக்கத்தின் பார்வைச் சொல் என்ற உண்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், தீர்க்கதரிசன மேற்கோளுக்குரிய கண்ணியத்தையும் வலியுறுத்தலையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கேட்கவே கேட்பீர்கள் / பார்க்கவே பார்ப்பீர்கள்’ என்ற இணை அமைப்பு கிரேக்கத்தின் சமாந்தரத்தையும் செமித்திய வலியுறுத்தலையும் வாசிக்க எளிய தமிழில் பிரதிபலிக்கிறது.
