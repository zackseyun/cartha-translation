id: ACT.28.6
reference: Acts 28:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: ta
  text: அவன் உடல் வீங்கிவிடும் அல்லது அவன் திடீரென்று கீழே விழுந்து இறந்துவிடுவான் என்று அவர்கள் எதிர்பார்த்துக்கொண்டிருந்தார்கள். ஆனால், நீண்ட நேரம் காத்திருந்து, அவனுக்கு வழக்கத்திற்கு மாறாக எதுவும் நிகழவில்லை என்பதைக் கண்டபின், அவர்கள் தங்கள் எண்ணத்தை மாற்றிக்கொண்டு, அவன் ஒரு தெய்வம் என்று சொல்லத் தொடங்கினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεδόκων
  choice: எதிர்பார்த்துக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்து நிலவிய எதிர்பார்ப்பைக் காட்டுகிறது; இந்தத் தமிழ்ச் சொற்றொடர் அந்த நீடித்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πίμπρασθαι
  choice: உடல் வீங்கிவிடும்
  rationale: பாம்புக்கடியின் சூழலில் இது நேரடியான எரிதலைவிட உடல் வீங்குவதைக் குறிக்கிறது. எழுவாய் தெளிவாக இருக்க ‘உடல்’ சேர்க்கப்பட்டுள்ளது.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: திடீரென்று கீழே விழுந்து இறந்துவிடுவான்
  rationale: ἄφνω என்பதன் திடீர்தன்மையையும், καταπίπτειν என்பதன் கீழே விழுதலையும், νεκρόν என்பதன் மரண விளைவையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐπὶ πολὺ
  choice: நீண்ட நேரம்
  rationale: நீண்ட கால அளவைக் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: θεωρούντων
  choice: கவனித்தும் ... கண்டபோது
  rationale: வெறுமனே பார்ப்பதைவிட உற்றுக் கவனித்து அதன் முடிவைக் காணும் பொருளைச் சூழலுக்கேற்ற தமிழில் வெளிப்படுத்துகிறது.
- source_word: μηδὲν ἄτοπον
  choice: வழக்கத்திற்கு மாறானது எதுவும்
  rationale: ἄτοπος என்பதிலுள்ள அசாதாரணம் அல்லது ஒவ்வாமை என்ற பரந்த பொருளை, ‘தீங்கு’ என்று மிகையாகக் குறிப்பாக்காமல் பாதுகாக்கிறது.
- source_word: μεταβαλόμενοι
  choice: தங்கள் எண்ணத்தை மாற்றிக்கொண்டு
  rationale: அவர்களின் முடிவு அல்லது மனப்பான்மை தலைகீழாக மாறியதை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ἔλεγον
  choice: சொல்லத் தொடங்கினார்கள்
  rationale: முற்றுப்பெறாத இறந்தகாலத்தின் தொடக்க அல்லது தொடர்ச்சிப் பொருளில், புதிய முடிவை அவர்கள் கூறத் தொடங்கியதை வெளிப்படுத்துகிறது.
- source_word: θεόν
  choice: ஒரு தெய்வம்
  rationale: பலதெய்வ நம்பிக்கையுள்ள தீவுவாசிகளின் தவறான முடிவைச் சூழலுக்கேற்ற வகையில் காட்டுகிறது; பவுலை ஒரே கடவுளோடு அடையாளப்படுத்துவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: αὐτὸν εἶναι θεόν என்பது பவுலைப் பற்றிய பிற்கால கிறிஸ்தவக் கூற்றாகத் தோன்றாமல் மொழிபெயர்த்தல்
  choice: அவன் ஒரு தெய்வம்
  alternative: அவன் கடவுள்; அவன் தெய்வீகமானவன்
  rationale: இது தீவுவாசிகளின் பலதெய்வப் பின்னணியில் உருவான தவறான முடிவை விவரிக்கிறது. பெயர்ச்சொல்லுக்கு முன் சுட்டுப்பெயர் இல்லாததும் சூழலும் சேர்ந்து ‘ஒரு தெய்வம்’ என்ற பொருளை ஆதரிக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தொடர்நிலைச் செயல்கள் தமிழின் ‘-க்கொண்டிருந்தார்கள்’, ‘கவனித்தும்’, ‘சொல்லத் தொடங்கினார்கள்’ ஆகிய வடிவங்களால் வெளிப்படுத்தப்பட்டுள்ளன.
