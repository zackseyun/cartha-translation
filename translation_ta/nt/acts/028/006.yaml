revisions:
- from: அவனுடைய உடல் வீங்கிவிடும் அல்லது அவன் திடீரென்று கீழே விழுந்து இறந்துவிடுவான் என்று அவர்கள் எதிர்பார்த்துக்கொண்டிருந்தார்கள். ஆனால் நீண்ட நேரம் காத்திருந்து கவனித்தும் அவனுக்கு வழக்கத்திற்கு மாறானது எதுவும் நேராததைக் கண்டபோது[a], அவர்கள் தங்கள் எண்ணத்தை மாற்றிக்கொண்டு, அவன் ஒரு தெய்வம் என்று சொல்லத் தொடங்கினார்கள்.
  to: அவன் உடல் வீங்கிவிடும் அல்லது அவன் திடீரென்று கீழே விழுந்து இறந்துவிடுவான் என்று அவர்கள் எதிர்பார்த்துக்கொண்டிருந்தார்கள். ஆனால், நீண்ட நேரம் காத்திருந்து, அவனுக்கு வழக்கத்திற்கு மாறாக எதுவும் நிகழவில்லை என்பதைக் கண்டபின், அவர்கள் தங்கள் எண்ணத்தை மாற்றிக்கொண்டு, அவன் ஒரு தெய்வம் என்று சொல்லத் தொடங்கினார்கள்.
