  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘சுள்ளிகள்,’ ‘விரியன் பாம்பு,’ ‘பற்றிக்கொண்டது’ ஆகிய சொற்கள் சாதாரண வாசகருக்குத் தெளிவாக இருந்து, மூலத்தின் குறிப்புத்தன்மையையும் திட்டமிட்ட தெளிவின்மையையும் பாதுகாக்கின்றன.
