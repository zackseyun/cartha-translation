source:
  edition: SBLGNT
  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: ta
  text: ஆனால் பவுல் ஒரு கட்டு காய்ந்த சுள்ளிகளைச் சேகரித்து நெருப்பின்மேல் வைத்தபோது, வெப்பத்தின் காரணமாக[a] ஒரு விரியன் பாம்பு வெளியே வந்து அவருடைய கையைப் பற்றிக்கொண்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெப்பத்திலிருந்து.” கிரேக்க முன்னிடைச்சொல்லை இன்னும் நேரடியாக இவ்வாறு மொழிபெயர்க்கலாம்; ஆனால் இங்கு நெருப்பின் வெப்பத்தால் பாம்பு வெளியே வந்தது என்ற காரணப் பொருளை அது தருவதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய கையைக் கவ்விப் பிடித்தது” அல்லது “அவருடைய கையைக் கடித்தது.” கிரேக்க வினைச்சொல் இன்னும் பொதுவாக “பற்றிக்கொண்டது” அல்லது “பிடித்துக்கொண்டது” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: சேகரித்து
  rationale: இது பவுல் எரிபொருளை ஒன்றாகச் சேர்த்த செயலைக் குறிக்கிறது. சொல்லின் நேரடியான ‘முறுக்கி ஒன்றுசேர்த்து’ என்ற பொருளைவிட, இச்சூழலில் ‘சேகரித்து’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: φρυγάνων τι πλῆθος
  choice: ஒரு கட்டு காய்ந்த சுள்ளிகளை
  rationale: φρύγανα என்பது நெருப்பெரிக்கப் பயன்படும் காய்ந்த சிறு குச்சிகள் அல்லது புதர்ச்சுள்ளிகளைக் குறிக்கிறது; τι πλῆθος குறிப்பிடப்படாத ஓர் அளவைக் காட்டுகிறது. ‘ஒரு கட்டு காய்ந்த சுள்ளிகள்’ என்பது இவ்விரு கூறுகளையும் தெளிவான தமிழில் தருகிறது.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: நெருப்பின்மேல் வைத்தபோது
  rationale: இது பவுல் சேகரித்த சுள்ளிகளை நெருப்பின்மேல் வைத்த அடுத்த செயலைக் குறிக்கிறது. இரு இறந்தகாலப் பங்கேற்பு வடிவங்களின் காலத் தொடர்பைத் தமிழில் ‘வைத்தபோது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔχιδνα
  choice: ஒரு விரியன் பாம்பு
  rationale: ἔχιδνα பொதுவான பாம்பை அல்ல, நஞ்சுள்ள விரியன் வகைப் பாம்பைக் குறிப்பாகக் குறிக்கிறது. ‘விரியன் பாம்பு’ அந்தத் தனிப்பட்ட பொருளைப் பாதுகாக்கிறது.
- source_word: ἀπὸ τῆς θέρμης
  choice: வெப்பத்தின் காரணமாக
  rationale: ἀπό என்பதற்கு நேரடியாக ‘இருந்து’ என்று பொருள் கொள்ள முடிந்தாலும், இங்கு நெருப்பின் வெப்பமே பாம்பு வெளிவரக் காரணம் என்பதைக் குறிக்கும் வாய்ப்பு அதிகம். முதன்மை உரை அந்தக் காரணத் தொடர்பைத் தெளிவாகத் தருகிறது; நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐξελθοῦσα
  choice: வெளியே வந்து
  rationale: பாம்பு மறைந்திருந்த இடத்திலிருந்து வெளிப்பட்டதை எளிய, இயல்பான தமிழ் வினைத்தொடர் வெளிப்படுத்துகிறது.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: அவருடைய கையைப் பற்றிக்கொண்டது
  rationale: καθάπτω என்பது பற்றுதல் அல்லது ஒட்டிக்கொள்ளுதல் என்ற பரந்த பொருளைக் கொண்டது. ‘கடித்தது’ என்று மூலச்சொல் வெளிப்படையாகக் கூறாத விதத்தைச் சேர்க்காமல், பாம்பு கையில் இறுகப் பற்றியிருப்பதை ‘பற்றிக்கொண்டது’ பாதுகாக்கிறது.
