  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: ta
  text: அவர்கள் என்னை விசாரித்தபின், மரண தண்டனை விதிப்பதற்கான காரணம் எதுவும் என் வழக்கில் இல்லாததால்[a], என்னை விடுதலை செய்ய விரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரணத்துக்குரிய குற்றச்சாட்டு எதுவும் எனக்கு எதிராக இல்லாததால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ரோம அதிகாரிகளைத் தொடரும் தொடர்புப்பெயரை, தமிழில் இயல்பான வாக்கியத் தொடருக்காக ‘அவர்கள்’ என்று வழங்குகிறது.
- source_word: ἀνακρίναντές με
  choice: என்னை விசாரித்தபின்
  rationale: நீதித்துறைச் சூழலையும், முதன்மை வினைக்கு முன் நடந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வடிவத்தின் காலத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐβούλοντο
  choice: விரும்பினார்கள்
  rationale: கடந்தகாலத்தில் இருந்த எண்ணம் அல்லது நோக்கத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; அது உண்மையில் நிறைவேறியதாகக் கூறவில்லை.
- source_word: ἀπολῦσαι
  choice: விடுதலை செய்ய
  rationale: காவல் மற்றும் நீதித்துறைச் சூழலில் ஒருவரை விடுவிப்பதைக் குறிக்கும் பொருளைத் துல்லியமாக வழங்குகிறது.
- source_word: διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν
  choice: மரண தண்டனை விதிப்பதற்கான காரணம் எதுவும் ... இல்லாததால்
  rationale: διά உடன் வரும் பெயராக்கப்பட்ட வினையெச்ச அமைப்பின் காரணப்பொருளையும், αἰτία θανάτου என்பதன் சட்டரீதியான பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ἐμοί
  choice: என் வழக்கில்
  rationale: சொல்லுக்கு சொல் ‘என்னில்’ என்பதற்குப் பதிலாக, பவுலைப் பற்றிய சட்ட விசாரணையைக் குறிக்கும் சூழல்சார் பொருளைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: αἰτία θανάτου என்பதன் சட்டரீதியான பொருள்
  choice: மரண தண்டனை விதிப்பதற்கான காரணம்
  alternative: மரணத்துக்குரிய குற்றச்சாட்டு
  rationale: மூலச்சொல் சட்டரீதியான காரணம் அல்லது குற்றச்சாட்டு ஆகிய இரண்டையும் குறிக்கக்கூடும். முதன்மை உரை தண்டனைக்கான சட்ட அடிப்படையை முன்னிறுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதித்துறைச் சூழலைத் தெளிவாகக் காட்டும் கண்ணியமான மற்றும் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தைத் தொடர்ந்தாலும், தமிழில் தனித்த வாக்கியமாகவும் இயல்பாக வாசிக்குமாறு அமைக்கப்பட்டுள்ளது.
