source:
  edition: SBLGNT
  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: ta
  text: இது நடந்த பிறகு, தீவில் நோய்களால் பாதிக்கப்பட்டிருந்த மற்றவர்களும்[a] வந்து குணப்படுத்தப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நோயுற்றிருந்த.” கிரேக்கத்தில் சொல்லர்த்தமாக, “நோய்களைக் கொண்டிருந்த” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: இது நடந்த பிறகு
  rationale: மரபுத்தொடரான genitive absolute-இன் காலத் தொடர்பையும் δέ குறிக்கும் நிகழ்ச்சி மாற்றத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οἱ λοιποί
  choice: மற்றவர்களும்
  rationale: முன்பு குறிப்பிடப்பட்ட நபரைத் தவிர தீவில் இருந்த ஏனைய நோயாளிகளைக் குறிக்கிறது; καί-யின் ‘கூட/உம்’ பொருளும் இதில் இயல்பாக வெளிப்படுகிறது.
- source_word: οἱ ἐν τῇ νήσῳ
  choice: தீவில்
  rationale: அந்தக் குழுவினர் இருந்த இடத்தைச் சுருக்கமாகவும் இயல்பாகவும் அடையாளப்படுத்துகிறது.
- source_word: ἔχοντες ἀσθενείας
  choice: நோய்களால் பாதிக்கப்பட்டிருந்த
  rationale: ἀσθενείας என்பதன் பன்மையைத் தக்கவைத்து, ‘நோய்களைக் கொண்டிருந்த’ என்ற சொற்சொல்லான ஆனால் இயல்பற்ற தமிழுக்குப் பதிலாக தற்போதைய இயல்பான நடையில் தருகிறது.
- source_word: προσήρχοντο
  choice: வந்து
  rationale: மீண்டும் மீண்டும் மக்கள் அணுகிவந்த நிகழ்வைச் சூழல் தெளிவாக்குகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘அவரிடம்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἐθεραπεύοντο
  choice: குணமாக்கப்பட்டார்கள்
  rationale: வினையின் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; அவர்கள் தாமாகக் குணமடைந்தார்கள் என்று மாற்றாமல், குணமாக்கப்பட்டார்கள் எனத் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் செயப்பாட்டு வினையும் நோய்களைக் குறிக்கும் பன்மையும் முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன.
