  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: ta
  text: நாங்கள் ரோமுக்குள் சென்றபோது, அவரைக் காவல் காத்த படைவீரனுடன் தனியாகத் தங்க பவுலுக்கு அனுமதி வழங்கப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வசிக்க.”
    reason: μένειν என்பதற்கு இச்சூழலில் ‘தங்க’ என்றும் ‘வசிக்க’ என்றும் பொருள் கொள்ளலாம்; முதன்மை உரை இச்சூழலின் தங்கியிருக்கும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: சென்றபோது
  rationale: Ὅτε காலச் சூழலை அறிமுகப்படுத்துகிறது; δέ இங்கு மென்மையான தொடரிணைப்பாக இருப்பதால் தமிழில் தனியே மொழிபெயர்க்காமல் விடுவது இயல்பானது.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: நாங்கள் ரோமுக்குள் சென்றபோது
  rationale: முதல் நபர் பன்மையையும், εἰς உடன் வரும் ‘உள்ளே செல்லுதல்’ என்ற இயக்கப் பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: பவுல் ... அனுமதிக்கப்பட்டார்
  rationale: ἐπιτρέπω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் பவுலுக்கு அனுமதி வழங்கப்பட்டதைத் தெரிவிக்கிறது; தமிழ் செயப்பாட்டு அமைப்பு மூலத்தின் வடிவத்துக்கு நெருக்கமாக உள்ளது.
- source_word: μένειν
  choice: தங்க
  rationale: இச்சூழலில் தற்காலிகமாக ஓர் இடத்தில் இருப்பதைக் குறிக்க ‘தங்க’ என்பது இயல்பான நவீனத் தமிழ்; ‘வசிக்க’ என்பதும் சாத்தியம்.
- source_word: καθ’ ἑαυτόν
  choice: தனியே
  rationale: மற்ற கைதிகளிடமிருந்து தனியாக இருப்பதைச் சுருக்கமாகக் குறிக்கிறது; அடுத்த சொற்றொடரில் ஒரு படைவீரன் உடனிருந்தது கூறப்படுவதால் முழுமையான தனிமை என மிகைப்படுத்தவில்லை.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: தன்னைக் காவல் காத்த படைவீரனுடன்
  rationale: σύν உடனிருப்பதையும், நிகழ்காலப் பெயரெச்சம் பவுலைக் காவல் காக்கும் பணியையும் குறிக்கிறது. கிரேக்க வரையறைச் சுட்டு குறிப்பிட்ட காவலரைச் சுட்டுவதால் ‘ஒரு படைவீரன்’ என்பதற்குப் பதில் ‘படைவீரன்’ பயன்படுத்தப்பட்டுள்ளது.
