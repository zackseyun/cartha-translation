source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: ta
  text: ஆனால், நீங்கள் என்ன நினைக்கிறீர்கள் என்பதை உங்களிடமிருந்தே கேட்பது தகும் எனக் கருதுகிறோம். ஏனெனில், இந்தப் பிரிவைப்[a] பற்றி எங்கும் எதிர்த்துப் பேசப்படுகிறது என்பது எங்களுக்குத் தெரியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குழு’ அல்லது ‘இயக்கம்’; இங்குள்ள கிரேக்கச் சொல் αἵρεσις, பிற்காலத் தொழில்நுட்பப் பொருளில் ‘மதக்கோட்பாட்டுப் பிறழ்வு’ என்பதை அவசியம் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: தகும் என்று கருதுகிறோம்
  rationale: இங்கு வினைச்சொல் கோரிக்கையையோ தகுதியையோ வலியுறுத்தாமல், ஒன்றைக் கேட்பது முறையானது என்ற மரியாதையான மதிப்பீட்டைத் தெரிவிக்கிறது.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: உங்களிடமிருந்தே கேட்பது
  rationale: παρά + மரபுவேற்றுமை பவுலிடமிருந்து நேரடியாகக் கேட்பதை வலியுறுத்துகிறது; ‘-ஏ’ அந்த நேரடி மூல நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἃ φρονεῖς
  choice: நீங்கள் என்ன நினைக்கிறீர்கள் என்பதை
  rationale: φρονέω இங்கு ஒருவரின் கருத்தையோ நிலைப்பாட்டையோ குறிக்கிறது; இத்தொடர் தெளிவான நவீனத் தமிழில் அதைப் பாதுகாக்கிறது.
- source_word: αἱρέσεως
  choice: பிரிவு
  rationale: அப்போஸ்தலர் பணிகளில் இச்சொல் பிற்காலத் தொழில்நுட்பப் பொருளான ‘மதக்கோட்பாட்டுப் பிறழ்வு’ என்பதை அவசியம் குறிக்காமல், ஒரு சமயக் குழு அல்லது இயக்கத்தைக் குறிக்கிறது.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: எங்களுக்குத் தெரியும்
  rationale: கிரேக்கத்தின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்சொல்லான செயப்பாட்டு அமைப்பு தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: πανταχοῦ
  choice: எங்கும்
  rationale: இடமெங்கும் என்ற பரந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀντιλέγεται
  choice: எதிர்த்துப் பேசப்படுகிறது
  rationale: செயப்பாட்டு வடிவத்தையும், வெறும் பொதுவான எதிர்ப்பல்லாமல் வாய்மொழியாக எதிர்த்துப் பேசும் நுணுக்கத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: αἵρεσις என்பதன் மொழிபெயர்ப்பு
  choice: பிரிவு
  alternative: மதக்கோட்பாட்டுப் பிறழ்வு / மதப்பிரிவு
  rationale: இங்கு வெளியார் கிறிஸ்தவ இயக்கத்தை ஒரு தனிக் குழுவாகக் குறிப்பிடுகின்றனர்; பிற்காலத் திருச்சபைத் தொழில்நுட்பப் பொருளான ‘heresy’யை இவ்வசனத்தில் திணிக்கக் கூடாது.
translation_notes:
  register: மரியாதையான உரையாடல் தொனி காக்கப்பட்டுள்ளது. நவீன நிலையான தமிழில் இயல்பாக இருக்கும்படி ‘எங்களுக்குத் தெரியும்’ என அமைக்கப்பட்டாலும், மூலத்தின் செயப்பாட்டு நுணுக்கம் ‘எதிர்த்துப் பேசப்படுகிறது’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
