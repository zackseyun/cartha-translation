source:
  edition: SBLGNT
  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: ta
  text: அங்கிருந்து நங்கூரத்தைத் தூக்கிவிட்டு[a], ரேகியத்தை அடைந்தோம். ஒரு நாள் கழித்து, தெற்குக் காற்று வீசத் தொடங்கியபோது, இரண்டாம் நாளில் புத்தேயோலியை அடைந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கப்பலைச் செலுத்திப் புறப்பட்டு.” περιελόντες என்ற கிரேக்க வினையெச்சம் கடற்பயணம் சார்ந்தது; அது குறிப்பாக நங்கூரத்தைத் தூக்குவதையோ, பொதுவாகக் கடற்பயணத்தைத் தொடங்குவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: அங்கிருந்து
  rationale: பயண விவரிப்பில் முந்தைய இடத்தை இயல்பாகச் சுட்டும் நவீனத் தமிழ் வடிவம்.
- source_word: περιελόντες
  choice: நங்கூரத்தைத் தூக்கிவிட்டு
  rationale: இந்தக் கடற்பயணச் சூழலில், கப்பலைப் புறப்படத் தடுப்பதை அகற்றி பயணத்தைத் தொடங்கியதைக் குறிக்கும் துல்லியமான மொழிபெயர்ப்பு. பொதுவாக ‘கப்பலைச் செலுத்திப் புறப்பட்டு’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατηντήσαμεν
  choice: அடைந்தோம்
  rationale: ஒரு இலக்கிடத்துக்கு வந்து சேர்ந்ததைக் குறிக்கும் வினையை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: Ῥήγιον
  choice: ரேகியம்
  rationale: பண்டைய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு; வேற்றுமை உருபுடன் உரையில் ‘ரேகியத்தை’ என வருகிறது.
- source_word: μετὰ μίαν ἡμέραν
  choice: ஒரு நாள் கழித்து
  rationale: கிரேக்க காலக் குறிப்பின் பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἐπιγενομένου νότου
  choice: தெற்குக் காற்று வீசத் தொடங்கியபோது
  rationale: காற்று அப்போது எழுந்தது என்ற நிகழ்வுச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δευτεραῖοι
  choice: இரண்டாம் நாளில்
  rationale: வருகை இரண்டாம் நாளில் நிகழ்ந்தது என்ற கிரேக்கச் சொல்லின் வெளிப்படையான காலக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: ἤλθομεν
  choice: அடைந்தோம்
  rationale: குறிப்பிட்ட இலக்கிடத்துக்கு வந்து சேர்ந்ததைக் குறிக்கும் இயல்பான தமிழ் நடை.
- source_word: Ποτιόλους
  choice: புத்தேயோலி
  rationale: பண்டைய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு; வேற்றுமை உருபுடன் உரையில் ‘புத்தேயோலியை’ என வருகிறது.
