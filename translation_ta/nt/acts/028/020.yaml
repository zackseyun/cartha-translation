source:
  edition: SBLGNT
  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: ta
  text: எனவே, இந்தக் காரணத்திற்காக உங்களைப் பார்க்கவும் உங்களுடன் பேசவும் அழைத்தேன். ஏனெனில், இஸ்ரவேலின் நம்பிக்கையின்[a] காரணமாக இந்தச் சங்கிலியை அணிந்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேலுக்குரிய நம்பிக்கை’ என்றும் மொழிபெயர்க்கலாம்; இத்தொடர் பவுல் அறிவிக்கும் உடன்படிக்கை மற்றும் உயிர்த்தெழுதல் நம்பிக்கையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: எனவே, இந்தக் காரணத்தினால்தான்
  rationale: οὖν என்பதன் முடிவுரைத் தொடர்பையும் διὰ...τὴν αἰτίαν என்பதன் காரணத் தொடர்பையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι
  choice: உங்களைப் பார்க்கவும் உங்களுடன் பேசவும் அழைத்தேன்
  rationale: இங்கு பவுல் உள்ளூர் யூதத் தலைவர்களைத் தன்னிடம் வரவழைத்த சூழலில், παρεκάλεσα என்பதற்கு ‘அழைத்தேன்’ என்பது இயல்பானது; ἰδεῖν மற்றும் προσλαλῆσαι ஆகியவை நேரில் காண்பதையும் உரையாடுவதையும் வெளிப்படுத்துகின்றன.
- source_word: ἕνεκεν γὰρ
  choice: ஏனெனில் ... காரணமாகவே
  rationale: γάρ தரும் விளக்கத் தொடர்பையும் ἕνεκεν தரும் காரணத்தையும் தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: இஸ்ரவேலின் நம்பிக்கை
  rationale: மூலத்தின் சுருக்கமான உரிமைவேற்றுமைத் தொடரை விரிவுபடுத்தாமல் தக்கவைத்து, அது இஸ்ரவேலின் உடன்படிக்கை, மேசியா அல்லது உயிர்த்தெழுதல் நம்பிக்கையை எவ்வாறு குறிக்கிறது என்ற பொருளை மொழிபெயர்ப்பிலேயே குறுக்கிவிடாமல் விடுகிறது.
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: இந்தச் சங்கிலியை அணிந்திருக்கிறேன்
  rationale: περίκειμαι என்பதன் ‘சுற்றிலும்/மேலும் கொண்டிருத்தல்’ என்ற தெளிவான உடல் உருவகத்தையும் ἅλυσιν என்பதன் ஒருமையையும் தக்கவைக்கிறது; ‘கட்டப்பட்டிருக்கிறேன்’ என்று விளக்கிப் பொருளைத் தட்டையாக்கவில்லை.
theological_decisions:
- issue: ‘இஸ்ரவேலின் நம்பிக்கை’ என்பதன் பொருள்
  choice: விரிவான விளக்கமின்றி ‘இஸ்ரவேலின் நம்பிக்கை’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: இஸ்ரவேலுக்கு வாக்களிக்கப்பட்ட நம்பிக்கை; உயிர்த்தெழுதலைப் பற்றிய இஸ்ரவேலின் நம்பிக்கை; இஸ்ரவேலின் மேசியா நம்பிக்கை
  rationale: இத்தொடர் உடன்படிக்கை, மேசியா, உயிர்த்தெழுதல் ஆகிய எதிர்பார்ப்புகளை உள்ளடக்கக்கூடும்; ஆனால் கிரேக்க வாசகம் அதை ஒரு குறிப்பிட்ட விளக்கமாகச் சுருக்கவில்லை. ஆகவே அதன் இறையியல் செறிவும் திறந்த தன்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘எனவே’ மற்றும் ‘இந்தக் காரணத்தினால்தான்’ ஆகிய இரண்டும் கிரேக்கத்தில் வெளிப்படையாக உள்ள தர்க்கத் தொடர்புகளைப் பாதுகாக்கின்றன. ‘சங்கிலியை அணிந்திருக்கிறேன்’ என்பது தமிழில் சற்றே வலுவான உருவகமாக இருந்தாலும், மூலத்தின் உடல் படிமத்தை நேரடியாக வழங்குகிறது.
