source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: ta
  text: ஆனால் யூதர்கள் எதிர்ப்புத் தெரிவித்ததால்[a][b], நான் சீசரிடம் மேல்முறையீடு செய்ய வேண்டிய கட்டாயம் ஏற்பட்டது; என் சொந்த மக்கள்மீது குற்றஞ்சாட்ட எனக்கு ஏதாவது இருந்ததால் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்கள் என்னை எதிர்த்துக்கொண்டிருந்தபோது” அல்லது “யூதர்கள் மறுத்துப் பேசிக்கொண்டிருந்ததால்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “யூதர்கள்” என்பது எல்லா யூத மக்களையும் பொதுவாகக் குறிக்கவில்லை; இந்தச் சட்டச் சூழலில் பவுலை எதிர்த்த யூதக் குற்றஞ்சாட்டிகளையே குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: எதிர்ப்புத் தெரிவித்ததால்
  rationale: நிகழ்காலப் பெயரெச்சத்துடன் வரும் தனித்த ஆறாம் வேற்றுமை அமைப்பு, பவுலின் மேல்முறையீட்டுக்குத் தூண்டுதலான சூழ்நிலையைத் தெரிவிக்கிறது. சட்டச் சூழலில் வெறும் வாய்மொழி மறுப்பைவிடச் செயற்பட்ட எதிர்ப்பை இயல்பான நவீன தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள மிதமான முரண்பாட்டையும் உரையின் அடுத்த நகர்வையும் குறிக்கிறது.
- source_word: Ἰουδαίων
  choice: யூதர்கள்
  rationale: கிரேக்க மூலத்தில் உள்ள பொதுவான இன-மதப் பெயரை மேலதிகமாகக் குறுக்காமல் நேரடியாக வழங்குகிறது; இச்சட்டச் சூழலில் சுட்டப்படுபவர்கள் யார் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἠναγκάσθην
  choice: செய்ய வேண்டிய கட்டாயம் ஏற்பட்டது
  rationale: செயப்பாட்டு வடிவம் தெரிவிக்கும் வெளிப்புற நெருக்கடியையும் தவிர்க்க முடியாத தேவையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: சீசரிடம் மேல்முறையீடு செய்ய
  rationale: ரோமப் பேரரசரிடம் சட்டப்படி மேல்முறையீடு செய்வதைக் குறிக்கும் தொழில்நுட்பச் சட்டப் பயன்பாடு. மூலத்தில் உள்ள ‘சீசர்’ என்ற பட்டப்பெயர் தக்கவைக்கப்படுகிறது.
- source_word: οὐχ ὡς
  choice: '... இருந்ததால் அல்ல'
  rationale: பவுல் தன் நோக்கத்தைத் தெளிவுபடுத்தி, தன் மக்கள்மீது பகைமையான குற்றச்சாட்டு கொண்டிருந்ததை மறுப்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: τοῦ ἔθνους μου
  choice: என் சொந்த மக்கள்
  rationale: பவுலின் இன-தேசிய சமூகத்தைக் குறிக்கிறது. ‘என் நாடு’ என்று இடப்பரப்பாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்த்து, தமிழில் இயல்பாக மனிதக் குழுவைக் காட்டுகிறது.
- source_word: ἔχων τι κατηγορεῖν
  choice: குற்றஞ்சாட்ட எனக்கு ஏதாவது இருந்தது
  rationale: குற்றஞ்சாட்டுவதற்கான ஏதாவது காரணமோ விவகாரமோ தன்னிடம் இருந்ததாகும் கருத்தைச் சட்டத் தன்மை குன்றாமல் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ‘யூதர்கள்’ என்ற இன-மதக் குறிப்பின் சூழல்சார் பொருள்
  choice: மூலத்தின் τῶν Ἰουδαίων என்பதற்கு ‘யூதர்கள்’ என்பதை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘யூதத் தலைவர்கள்’ அல்லது ‘யூதேயர்கள்’
  rationale: மூலம் குறிப்பிடாத வரம்பை முதன்மை உரையில் சேர்க்காமல் அதன் சொல்லாட்சியைப் பாதுகாக்கிறது. அதே நேரத்தில், இங்கு எல்லா யூத மக்களையும் பொதுப்படையாகக் குறிக்காமல் பவுலுக்கு எதிராகச் சட்ட நடவடிக்கையில் ஈடுபட்ட யூத எதிர்ப்பாளர்களைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட-உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சீசர்’, ‘மேல்முறையீடு’, ‘குற்றஞ்சாட்ட’ ஆகிய சொற்கள் வசனத்தின் நீதிமன்றச் சூழலைத் தக்கவைக்கின்றன; இனக் குறிப்பின் தேவையற்ற விரிவாக்கம் முதன்மை உரையில் தவிர்க்கப்பட்டு அடிக்குறிப்பில் சூழல் விளக்கப்பட்டுள்ளது.
