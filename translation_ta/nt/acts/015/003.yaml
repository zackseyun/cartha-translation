source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: ta
  text: ஆகவே, திருச்சபையால் வழியனுப்பப்பட்ட அவர்கள், பெனிக்கேயா மற்றும் சமாரியா ஆகிய இரு பகுதிகளின் வழியாகச் சென்று, யூதரல்லாத மக்கள் திரும்பியதை[a] விரிவாக எடுத்துரைத்தார்கள். அவ்வாறு அவர்கள் சகோதரர்கள்[b] அனைவருக்கும் மிகுந்த மகிழ்ச்சியை ஏற்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதரல்லாத மக்கள் மனமாற்றம் அடைந்ததை.”
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்கள்” என்பது இங்கு பெண்கள் உட்பட சக விசுவாசிகள் அனைவரையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: வழியனுப்பப்பட்ட
  rationale: பயணத்தைத் தொடர உதவி செய்து அனுப்புதல் என்ற பயணச் சூழலுக்குரிய நுட்பத்தை இயல்பான தமிழில் தருகிறது; உடன் அழைத்துச் சென்றதாக அளவுக்கு மீறிக் குறிப்பிடவில்லை.
- source_word: ἐκκλησίας
  choice: திருச்சபையினரால்
  rationale: இங்கு சொல் உள்ளூர் கிறிஸ்தவ நம்பிக்கையாளர் சமூகத்தைக் குறிக்கிறது. செயலைச் செய்த சமூகத்தைத் தமிழில் தெளிவுபடுத்த பன்மை மனிதக் குறிப்பு பயன்படுத்தப்பட்டது.
- source_word: διήρχοντο
  choice: பகுதிகளின் வழியாகச் சென்று
  rationale: இரு பிரதேசங்கள் வழியாகத் தொடர்ந்து பயணித்ததை இயல்பான கதைநடைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: பெனிக்கேயா, சமாரியா ஆகிய பகுதிகளின் வழியாக
  rationale: τε ... καί இணைக்கும் இரு பிரதேசங்களையும் சமநிலையில் இணைக்கிறது; அவை பகுதிகள் என்பதைத் தமிழில் இயல்பாகத் தெளிவாக்குகிறது.
- source_word: ἐκδιηγούμενοι
  choice: விரிவாக எடுத்துச் சொன்னார்கள்
  rationale: சாதாரணமாகச் சொல்வதைவிட முழுமையாகவும் விவரமாகவும் எடுத்துரைத்தல் என்ற கூட்டுவினையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: τὴν ἐπιστροφὴν τῶν ἐθνῶν
  choice: யூதரல்லாத மக்கள் மனந்திரும்பியதை
  rationale: அப்போஸ்தலர் 15-ன் சூழலில் ἔθνη என்பது யூதரல்லாத மக்களைக் குறிக்கிறது. ἐπιστροφή கடவுளை நோக்கிய மதநம்பிக்கை சார்ந்த திரும்புதலைக் குறிப்பதால், நவீன வேதாகமத் தமிழில் புரியக்கூடிய ‘மனந்திரும்புதல்’ தேர்ந்தெடுக்கப்பட்டது; அதன் அடிப்படை ‘திரும்புதல்’ உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: மிகுந்த மகிழ்ச்சி உண்டானது
  rationale: செய்தியைச் சொன்னதன் விளைவாகப் பெரும் மகிழ்ச்சி ஏற்பட்டது என்ற காரணவிளைவு உறவை இயல்பான தமிழில் தருகிறது.
- source_word: πᾶσι τοῖς ἀδελφοῖς
  choice: சகோதரர்கள் அனைவருக்கும்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது; சூழலில் பெண் நம்பிக்கையாளர்களும் உள்ளடங்கியிருக்கலாம் என்பது அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
theological_decisions:
- issue: பிற இனத்தாரின் ἐπιστροφή என்பதன் பொருள்
  choice: யூதரல்லாத மக்கள் மனந்திரும்பியது
  alternative: யூதரல்லாத மக்கள் திரும்பியது
  rationale: இந்த வசனம் நற்செய்திக்குப் பதிலாக அவர்கள் கடவுளிடம் திரும்பியதைக் குறிக்கிறது. ‘மனந்திரும்புதல்’ அதன் மதநம்பிக்கை சார்ந்த பொருளைத் தெளிவாகத் தருகிறது; இருப்பினும் மூலச்சொல்லின் எளிய ‘திரும்புதல்’ பொருளை அடிக்குறிப்பில் வைத்துப் பொருள் நுட்பம் பாதுகாக்கப்படுகிறது.
- issue: கலப்புப் பாலின நம்பிக்கையாளர் சமூகத்தில் ἀδελφοί
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள் / சக விசுவாசிகள்
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவம் முதன்மை உரையில் வைக்கப்படுகிறது. ஆரம்பக் கிறிஸ்தவச் சூழலில் இது பொதுவாகப் பெண் நம்பிக்கையாளர்களையும் உள்ளடக்கக்கூடும் என்பதால் அந்த உள்ளடக்கப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சபை’, ‘மனந்திரும்புதல்’, ‘சகோதரர்கள்’ ஆகிய பரிச்சயமான வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; தேவையற்ற சமயப் பிரிவுச் சிறப்புப் பொருள் சேர்க்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
