source:
  edition: SBLGNT
  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: ta
  text: கூடியிருந்த அனைவரும் அமைதியானார்கள்; பின்னர், பர்னபாவும் பவுலும் வழியாகப் பிற இனத்தாரிடையே கடவுள் செய்த அடையாளங்களையும் அற்புதங்களையும் அவர்கள் விவரிப்பதைக் கூடியிருந்தோர் கேட்டுக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகளிடையே.” இச்சூழலில், கிரேக்கச் சொல் குறிப்பாக யூதரல்லாத பிற இனத்தாரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: அமைதியானார்கள்
  rationale: 'இறந்தகால வினை இங்கு ஒரு புதிய நிலைக்குள் நுழைந்ததைச் சுட்டுகிறது: கூடியிருந்தோர் பேசுவதை நிறுத்தி அமைதியானார்கள்.'
- source_word: πᾶν τὸ πλῆθος
  choice: கூடியிருந்த அனைவரும்
  rationale: எருசலேம் ஆலோசனைக் கூட்டத்தில் இருந்த முழுக் குழுவையும் குறிக்கிறது; ‘திரளான மக்கள்’ என்பதைக் காட்டிலும் சூழலுக்கு இயல்பானது.
- source_word: ἤκουον
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் அவர்கள் தொடர்ந்து கவனமாகக் கேட்டதைக் காட்டுகிறது.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: பர்னபாவும் பவுலும்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ἐξηγουμένων
  choice: விவரித்தபோது
  rationale: நிகழ்ந்தவற்றை ஒழுங்காக எடுத்துரைத்தல் அல்லது விரிவாகக் கூறுதல் என்ற பொருளைத் தருகிறது; வெறும் விளக்கவுரை என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: ὅσα
  choice: செய்த அடையாளங்களையும் அற்புதங்களையும்
  rationale: ὅσα, σημεῖα καὶ τέρατα ஆகியவற்றோடு இணைந்து, கடவுள் செய்த அடையாளங்களும் அற்புதங்களும் எத்தகையவை என்பதை அவர்கள் விவரித்தார்கள் என்ற இயல்பான தமிழ் அமைப்பில் தரப்பட்டுள்ளது.
- source_word: ἐποίησεν ὁ θεὸς
  choice: கடவுள் செய்த
  rationale: கிரேக்க வாக்கியத்தில் கடவுளே வினையின் எழுவாய்; அந்த முதன்மைச் செயற்பாடு தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: σημεῖα καὶ τέρατα
  choice: அடையாளங்களையும் அற்புதங்களையும்
  rationale: லூக்காவின் எழுத்துகளில் இணையாக வரும் இரு சொற்களையும் தனித்தனியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: பிற இனத்தாரிடையே
  rationale: அப்போஸ்தலர் 15-ன் சூழலில் யூதரல்லாத மக்களைக் குறிக்கிறது; ‘புறஜாதியார்’ என்பதைக் காட்டிலும் நவீன வாசகர்களுக்கு இயல்பானதும் மரியாதையானதும் ஆகும். ‘நாடுகளிடையே’ என்பது சொற்பொருள் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δι’ αὐτῶν
  choice: தங்கள் வழியாக
  rationale: கடவுள் முதன்மைச் செயற்பாட்டாளர் என்றும் பர்னபாவும் பவுலும் அவர் செயலாற்றிய வழிமுறையினர் என்றும் διά + ஆறாம் வேற்றுமை காட்டும் கருவித்தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: அப்போஸ்தலப் பணியில் கடவுளின் செயற்பாடு
  choice: அடையாளங்களையும் அற்புதங்களையும் செய்தவர் கடவுள்; அவர் பர்னபா மற்றும் பவுல் வழியாகச் செயல்பட்டார்.
  alternative: பர்னபாவும் பவுலுமே முதன்மையான பொருளில் அந்த அடையாளங்களையும் அற்புதங்களையும் செய்தார்கள்.
  rationale: ἐποίησεν என்பதன் எழுவாய் ὁ θεὸς; δι’ αὐτῶν என்பது பர்னபாவையும் பவுலையும் கடவுள் செயல்பட்ட வழிமுறையாகக் காட்டுகிறது. மொழிபெயர்ப்பு அவர்களுடைய உண்மையான பங்கேற்பைக் குறைக்காமல் கடவுளின் முதன்மைச் செயற்பாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான கேட்டலைக் காட்ட ‘கேட்டுக்கொண்டிருந்தார்கள்’ என்றும், கூட்டத்தின் முழுமையை இயல்பாகக் காட்ட ‘கூடியிருந்த அனைவரும்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
