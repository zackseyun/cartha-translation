revisions:
- from: கூடியிருந்த அனைவரும் அமைதியானார்கள்; பின்பு பர்னபாவும் பவுலும் தங்கள் வழியாகப் பிற இனத்தாரிடையே கடவுள் செய்த அடையாளங்களையும் அற்புதங்களையும் விவரித்தபோது, அவர்கள் கேட்டுக்கொண்டிருந்தார்கள்.[a]
