base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: ta
  text: ஆகவே, பிற இனத்தாருள்[a] கடவுளிடம் திரும்புகிறவர்களுக்குத் தொந்தரவு செய்யக்கூடாது என்பதே என் தீர்ப்பு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிற நாடுகளைச் சேர்ந்தவர்கள்.’ கிரேக்கச் சொல் ‘நாடுகள்’ என்றும் பொருள்படலாம்; இங்கு அது யூதரல்லாத பிற இனத்தாரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுக்குத் தொந்தரவு செய்யக்கூடாது என்று நான் கருதுகிறேன்’ அல்லது ‘அவர்களைத் தொந்தரவு செய்யாதிருப்பதே என் தீர்ப்பு.’
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: யாக்கோபின் முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἐγὼ κρίνω
  choice: என்பதே என் தீர்ப்பு
  rationale: மூலத்தில் உள்ள முதலாம் நபர் ஒருமையையும், இது யாக்கோபின் ஆராய்ந்த முடிவு அல்லது முன்மொழிவு என்பதையும் காக்கிறது.
- source_word: μὴ παρενοχλεῖν
  choice: தொந்தரவு கொடுக்கக் கூடாது
  rationale: παρενοχλέω என்பதன் ‘சிரமம் அல்லது இடையூறு உண்டாக்குதல்’ என்ற பொருளை நவீன, இயல்பான தமிழில் தருகிறது; சபைக்கான நடைமுறை முன்மொழிவின் வலிமையையும் வெளிப்படுத்துகிறது.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: பிற இனத்தாரிலிருந்து ... திரும்புகிறவர்களுக்கு
  rationale: இனங்களிலிருந்து வரும் குறிப்பிட்ட நபர்களைக் குறிக்கும் கிரேக்கத் தொடரின் தனிப்பட்ட மற்றும் மூலத்தோற்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἐθνῶν
  choice: பிற இனத்தார்
  rationale: இச்சூழலில் யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ என்பது தமிழில் புரியக்கூடியதாக இருந்து, ‘நாடுகள்’ என்ற சொற்பொருள் மாற்றையும் அடிக்குறிப்பில் வைத்திருக்க அனுமதிக்கிறது.
- source_word: ἐπιστρέφουσιν
  choice: திரும்புகிறவர்கள்
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடரும் இயக்கத்தையும், கடவுளை நோக்கித் திரும்புதல் என்ற உருவகத்தையும் காக்கிறது; பிற்காலத் தொழில்நுட்ப சமயச் சொல்லைத் திணிக்கவில்லை.
- source_word: ἐπὶ τὸν θεόν
  choice: கடவுளிடம்
  rationale: ἐπιστρέφω உடன் வரும் திசைநோக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இது யாக்கோபின் தனிப்பட்ட கருத்து மட்டுமா, அல்லது அவைக்கான முன்மொழியப்பட்ட கூட்டுத் தீர்மானமா?
  choice: ‘தொந்தரவு கொடுக்கக் கூடாது என்பதே என் தீர்ப்பு’ என்று, யாக்கோபின் முதலாம் நபர் தீர்ப்பையும் அவைக்குரிய நடைமுறைப் பரிந்துரையையும் ஒன்றாக வெளிப்படுத்துதல்.
  alternative: ‘தொந்தரவு கொடுக்காமல் இருக்க நான் தீர்மானிக்கிறேன்’ அல்லது ‘அவர்களுக்குத் தொந்தரவு கொடுக்கக் கூடாது என்று நான் கருதுகிறேன்.’
  rationale: κρίνω என்பது வெளிப்படையாக முதலாம் நபர் ஒருமையில் உள்ளது; அதைச் சார்ந்த இறவினைத் தொடர், குழுவின் செயலை வழிநடத்தும் தீர்ப்பின் உள்ளடக்கத்தைத் தருகிறது. மொழிபெயர்ப்பு இந்த இரு அம்சங்களையும் ஒன்றை நீக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘என்பதே என் தீர்ப்பு’ சற்றே முறையானதாயினும், சபைக் கலந்தாய்வுச் சூழலுக்கும் கிரேக்கத்தின் முதலாம் நபர் வலியுறுத்தலுக்கும் ஏற்றது. மூல உரையின் வரிசையைப் பின்பற்றி அடிக்குறிப்பு குறிகள் [b][a] என அமைக்கப்பட்டுள்ளன.
