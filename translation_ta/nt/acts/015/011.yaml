  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: ta
  text: ஆனால், ஆண்டவர் இயேசுவின் அருளின் மூலம் நாம் இரட்சிக்கப்படுவோம் என்று நம்புகிறோம்; அவர்களும் அதே விதமாகவே இரட்சிக்கப்படுவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நெருக்கமாக: “ஆண்டவர் இயேசுவின் அருளின் மூலம் நாம் இரட்சிக்கப்படுவோம் என்று நம்புகிறோம்; அவர்களும் அதே விதமாகவே.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தாங்க முடியாத நுகத்துக்கு வலுவான எதிர்மறை மாற்றத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: διὰ τῆς χάριτος
  choice: அருளின் மூலமாகவே
  rationale: διά + genitive குறிக்கும் வழி அல்லது கருவி என்ற பொருளைப் பாதுகாக்கிறது; ‘வே’ சூழலில் உள்ள வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது, புதிய கோட்பாட்டுச் சொற்றொடரைச் சேர்க்கவில்லை.
- source_word: χάριτος
  choice: அருள்
  rationale: இங்கு இரட்சிப்புக்கான தெய்வீகக் கிருபை/தயவை குறிக்கும் மரியாதையான, பரவலாகப் புரியக்கூடிய தமிழ் சொல்.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ஆண்டவராகிய இயேசுவின்
  rationale: ‘Lord Jesus’ என்ற பட்டத்தையும், அருள் அவருக்குரியது அல்லது அவரிடமிருந்து வருவது என்ற இயல்பான genitive தொடர்பையும் காக்கிறது.
- source_word: πιστεύομεν
  choice: நாம் ... என்று நம்புகிறோம்
  rationale: உள்ளடக்க infinitive-ஐ நவீன தமிழில் இயல்பான ‘என்று’ உட்பிரிவாக வழங்குகிறது.
- source_word: σωθῆναι
  choice: மீட்கப்படுவோம்
  rationale: Aorist passive infinitive-ன் இரட்சிக்கப்படுதல் என்ற passive பொருளையும் எதிர்நோக்கும் நிறைவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: καθ’ ὃν τρόπον
  choice: அதே விதமாகவே
  rationale: முறை சார்ந்த ஒப்பீட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: κἀκεῖνοι
  choice: அவர்களும் ... மீட்கப்படுவார்கள்
  rationale: καί-யின் ‘உம்’ பொருளைப் பாதுகாத்து, தமிழில் ஒப்பீட்டை முழுமையான வாக்கியமாக இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பேதுருவின் கூற்றில் ஒப்பீட்டின் திசை
  choice: ‘நாம்’ மீட்கப்படுவது ‘அவர்களும்’ மீட்கப்படும் அதே விதத்தில் என்று வழங்கப்பட்டது.
  alternative: ‘அவர்கள் நம்மைப் போல மீட்கப்படுவார்கள்’
  rationale: கிரேக்கச் சொல் வரிசையும் வாதத்தின் வலிமையும் யூத விசுவாசிகளாகிய ‘நம்மை’ புறஜாதியாராகிய ‘அவர்களோடு’ ஒப்பிடுகின்றன; ஒப்பீட்டைத் தலைகீழாக்கவில்லை.
- issue: அருளின் மூலமான மீட்பு
  choice: மீட்பு ஆண்டவராகிய இயேசுவின் அருளின் மூலமாக வருகிறது என்று மட்டும் கூறப்பட்டது.
  alternative: ‘அருளால் மட்டுமே, விசுவாசத்தால் மட்டுமே’ போன்ற விரிவாக்கம்
  rationale: வசனத்தில் வெளிப்படையாக இல்லாத பிற்கால கோட்பாட்டுச் சூத்திரங்களைச் சேர்க்காமல், மூலத்தின் வாக்கியத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘மீட்கப்படுதல்’ என்பது passive வடிவத்தைக் காக்கிறது; ‘இரட்சிக்கப்படுதல்’ என்பதைக் காட்டிலும் பொதுவாகப் புரியக்கூடியதாகத் தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
