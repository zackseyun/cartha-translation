revisions:
- from: மாறாக, ஆண்டவராகிய இயேசுவின் அருளின் மூலமாகவே நாம் மீட்கப்படுவோம் என்று நம்புகிறோம்; அவர்களும் அதே விதமாகவே மீட்கப்படுவார்கள்.[a]
  to: ஆனால், ஆண்டவர் இயேசுவின் அருளின் மூலம் நாம் இரட்சிக்கப்படுவோம் என்று நம்புகிறோம்; அவர்களும் அதே விதமாகவே இரட்சிக்கப்படுவார்கள்.[a]
  rationale: 'The revision removes an added emphatic particle, uses the precise Tamil term for salvation, and slightly improves modern naturalness. It retains the Greek comparison’s direction: Jewish believers (“we”) are saved in the same way as Gentiles (“they also”). The footnote preserves the Greek’s ellipsis in the second member of the comparison.'
