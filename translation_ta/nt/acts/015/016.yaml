  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: ta
  text: '“இவற்றுக்குப் பிறகு நான் திரும்பி வந்து,


    விழுந்துபோன தாவீதின் கூடாரத்தை[a][b] மீண்டும் கட்டுவேன்;


    அதன் இடிபாடுகளையும் மீண்டும் கட்டி,


    அதை மீண்டும் நிலைநிறுத்துவேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கூடாரம்’ என்பதற்கான கிரேக்கச் சொல் ‘திருக்கூடாரம்’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தாவீதின் கூடாரம்’ என்பது தாவீதின் வம்சம் அல்லது அரசுடன் தொடர்புடைய மறுநிலைப்படுத்தலைக் குறிக்கும் தீர்க்கதரிசன உருவகம்.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: பன்மைச் சுட்டையும் காலத் தொடர்ச்சியையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἀναστρέψω
  choice: நான் திரும்பி வந்து
  rationale: இச்சூழலில் ‘திரும்புதல்/மீண்டும் வருதல்’ என்ற பொருளை இயல்பாக வெளிப்படுத்தி, இறைவனின் முதலாம் நபர் வாக்குறுதியைத் தக்கவைக்கிறது.
- source_word: ἀνοικοδομήσω
  choice: மீண்டும் கட்டுவேன்
  rationale: மறுபடியும் கட்டுதல் என்ற வினையின் பொருளையும் மறுசீரமைப்பு உருவகத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: σκηνὴν Δαυὶδ
  choice: தாவீதின் கூடாரம்
  rationale: σκηνή என்பதன் நேரடியான உருவகத்தைத் தக்கவைத்து, அதை ‘தாவீதின் வம்சம்’ அல்லது ‘அரசு’ என்று விளக்கமாக மாற்றிவிடாமல் இருக்கிறது.
- source_word: τὴν πεπτωκυῖαν
  choice: விழுந்துபோன
  rationale: விழுந்ததன் விளைவாக நீடிக்கும் நிலையைக் குறிக்கும் நிறைவுப் பெயரெச்சத்தின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: இடித்துப்போடப்பட்ட அதன் பகுதிகள்
  rationale: இடிக்கப்பட்ட அல்லது தகர்க்கப்பட்டவற்றைக் குறிக்கும் பன்மை வடிவத்தை ‘இடிபாடுகள்’ என்று பொதுமைப்படுத்தாமல் சற்றே வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: ἀνορθώσω
  choice: திரும்ப நிலைநிறுத்துவேன்
  rationale: நிமிர்த்துதல், மீண்டும் நிலைபெறச் செய்தல், சீரமைத்தல் ஆகிய பொருள் நிழல்களைத் தக்கவைத்து, இச்சூழலுக்கு இயல்பான தமிழை வழங்குகிறது.
- source_word: αὐτήν
  choice: அதை
  rationale: இலக்கணப் பாலைக் தமிழில் செயற்கையாகப் பிரதிபலிக்காமல், ‘கூடாரம்’ என்பதையே இயல்பாகச் சுட்டுகிறது.
theological_decisions:
- issue: ‘தாவீதின் கூடாரம்’ என்ற உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் ‘தாவீதின் கூடாரம்’ என்ற தீர்க்கதரிசன உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘தாவீதின் வம்சம்’, ‘தாவீதின் அரசு’ அல்லது ‘தாவீதின் வீடு’ என்று நேரடியாக விளக்குதல்
  rationale: இந்த உருவகம் தாவீதுடன் தொடர்புடைய அரச வம்சம் அல்லது ஆட்சியின் மீட்பைச் சுட்டக்கூடும்; எனினும் கிரேக்க உரை அந்த விளக்கத்தை நேரடியாகக் கூறாமல் உருவகத்தையே வைத்துள்ளது. ஆகவே அதன் இறையியல் விரிவையும் பதற்றத்தையும் மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. கவிதைநடை வரிப்பிரிப்பு கிரேக்க வாக்கியத்தின் இணை அமைப்பையும் மறுகட்டுமானத்தின் படிப்படியான இயக்கத்தையும் வெளிப்படுத்துகிறது.
