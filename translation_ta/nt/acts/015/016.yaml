  - severity: low
    issue: Footnote b uses ‘மீட்பு’ for the image’s meaning.
    rationale: The source image concerns rebuilding/restoration. ‘மறுநிலைப்படுத்தல்’ better reflects this without importing a more specific theological sense.
  - severity: low
    issue: Footnote a’s wording makes the alternative sense sound inherently cultic.
    rationale: σκηνή can be rendered ‘tabernacle’; the note should state this as a translation alternative without adding an unnecessary definitional claim.
