source:
  edition: SBLGNT
  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: ta
  text: யூதேயாவிலிருந்து இறங்கி வந்த சிலர், “மோசேயின் வழக்கத்தின்படி நீங்கள் விருத்தசேதனம் செய்துகொள்ளாவிட்டால், இரட்சிக்கப்பட முடியாது” என்று சகோதரர்களுக்கு[a] போதித்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதர சகோதரிகளுக்கு” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க மூலத்தில் “சகோதரர்களுக்கு” என்று உள்ளது. இங்கு அது விசுவாசச் சமூகத்திலுள்ள ஆண்களையும் பெண்களையும் உள்ளடக்கிக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: '[தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை]'
  rationale: தமிழ் தொடர்நடையில் வசனத்தின் தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ என்று சேர்ப்பது தேவையற்றதாகவும் சற்று விளக்கவுரையாகவும் இருக்கும்; நிகழ்வின் தொடர்ச்சி இயல்பான வாக்கிய அமைப்பிலேயே புலப்படுகிறது.
- source_word: τινες
  choice: சிலர்
  rationale: குறிப்பிடப்படாத சில நபர்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம்; ஆண்பால் பன்மையைத் தனியாகச் சேர்க்காமல் மூலத்தின் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: யூதேயாவிலிருந்து இறங்கி வந்த
  rationale: யூதேயாவிலிருந்து அந்தியோகியாவை நோக்கிய நிலவியல் இயக்கத்தையும், முக்கிய வினைக்கு முன் நிகழ்ந்த வருகையையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἐδίδασκον
  choice: போதித்துக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத கால வடிவம் காட்டும் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நடந்த போதனையைப் பாதுகாக்கிறது.
- source_word: τοὺς ἀδελφοὺς
  choice: சகோதரர்களுக்கு
  rationale: கிரேக்க ஆண்பால் பன்மையை முதன்மை உரையில் நேரடியாகத் தருகிறது; இது விசுவாசச் சமூகத்தை உள்ளடக்கமாகக் குறிக்கக்கூடும் என்பதைக் காலடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: நீங்கள் விருத்தசேதனம் செய்துகொள்ளாவிட்டால்
  rationale: எதிர்மறை நிபந்தனையை இயல்பான தமிழில் தருகிறது. கிரேக்கச் செயப்பாட்டு வடிவத்தின் பொருள், தமிழில் வழக்கமான ‘செய்துகொள்ளுதல்’ அமைப்பால் வெளிப்படுகிறது.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: மோசேயின் வழக்கத்தின்படி
  rationale: ἔθος என்பதன் நிலைபெற்ற வழக்கம் அல்லது மரபு என்ற பொருளையும், மோசேயுடன் உள்ள தொடர்பையும் கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: οὐ δύνασθε σωθῆναι
  choice: இரட்சிக்கப்பட முடியாது
  rationale: இயலாமையையும் செயப்பாட்டு வடிவத்தையும் தக்கவைக்கிறது; இச்சூழலில் σωθῆναι என்பது சாதாரண ஆபத்திலிருந்து விடுவிக்கப்படுவதைவிட இறையியல் சார்ந்த இரட்சிப்பைக் குறிக்கிறது.
theological_decisions:
- issue: எருசலேம் ஆலோசனைக் கூட்டத்தைச் சூழ்ந்த விவாதத்தில் σωθῆναι என்பதன் பொருள்
  choice: இரட்சிக்கப்பட
  alternative: மீட்கப்பட
  rationale: விருத்தசேதனம் இரட்சிப்புக்கு அவசியமா என்பதே சூழலின் விவாதம். ‘இரட்சிக்கப்பட’ என்பது அந்த இறையியல் வலிமையைத் தக்கவைக்கிறது; அதேவேளை எந்த ஒரு திருச்சபைப் பிரிவின் விளக்கத்தையும் வசனத்தில் சேர்ப்பதில்லை.
- issue: ἀδελφοὺς என்பதன் பாலினம் மற்றும் சமூக உள்ளடக்கம்
  choice: சகோதரர்களுக்கு
  alternative: சகோதர சகோதரிகளுக்கு; விசுவாசிகளுக்கு
  rationale: மூல கிரேக்கம் ஆண்பால் பன்மையைக் கொண்டிருப்பதால் அதை முதன்மை உரையில் பாதுகாக்கிறது. அச்சொல் முழு விசுவாசச் சமூகத்தையும் உள்ளடக்கமாகக் குறிக்க வாய்ப்புள்ளதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. ‘இறங்கி வந்த’ என்பது லூக்காவின் நிலவியல் நோக்கைத் தக்கவைக்கிறது; ‘போதித்துக்கொண்டிருந்தார்கள்’ தொடர்ச்சியான செயலை வெளிப்படுத்துகிறது. ‘விருத்தசேதனம்’ மற்றும் ‘இரட்சிக்கப்பட’ ஆகியவை இச்சூழலுக்குத் தேவையான நிலைபெற்ற வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன.
