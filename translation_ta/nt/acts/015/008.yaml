id: ACT.15.8
reference: Acts 15:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: ta
  text: இதயங்களை அறிந்தவரான கடவுள், நமக்குக் கொடுத்தது போலவே அவர்களுக்கும் பரிசுத்த ஆவியைக் கொடுத்து, அவர்களுக்குச் சான்றளித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδιογνώστης
  choice: இதயங்களை அறிந்தவரான
  rationale: அரிதான இக்கூட்டுச்சொல் உள்ளார்ந்த எண்ணங்களையும் நோக்கங்களையும் அறிபவரைக் குறிக்கிறது. இயல்பான நவீனத் தமிழுக்காகப் பெயரெச்சத் தொடராக மொழிபெயர்க்கப்பட்டது; பன்மை வடிவம் மனிதர்களின் இதயங்கள் என்ற பொதுப்பொருளைப் பாதுகாக்கிறது.
- source_word: θεὸς
  choice: கடவுள்
  rationale: θεός என்பதற்கான இயல்பான நவீனத் தமிழ் இணை; முன்வரும் καρδιογνώστης இதைக் குறிப்பிடும் பண்புத் தொடராக அமைந்துள்ளது.
- source_word: ἐμαρτύρησεν
  choice: சான்றளித்தார்
  rationale: கடவுள் தமது ஏற்றுக்கொள்ளுதலை வெளிப்படையாக உறுதிப்படுத்தியதைச் சொல்லும் சாட்சியப் பொருளைப் பாதுகாக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: சூழலில் புறஜாதியாரைக் குறிக்கும் இடப்பொருள் வேற்றுமைப் பிரதிப்பெயர்; மூலத்தில் இல்லாத அடையாளத்தை வசனத்துக்குள் சேர்க்காமல் பிரதிப்பெயராகவே வைக்கப்படுகிறது.
- source_word: δοὺς
  choice: கொடுத்து
  rationale: கடவுள் எவ்வாறு சான்றளித்தார் என்பதை விளக்கும் பங்கேற்புவினையின் வழிமுறைப் பொருளை இயல்பான தமிழ் வினையெச்சம் வெளிப்படுத்துகிறது.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவி
  rationale: இது நவீனத் தமிழ் வேதாகம நடையில் நன்கு அறியப்பட்ட, கண்ணியமான நிலையான பெயர்.
- source_word: καθὼς καὶ ἡμῖν
  choice: நமக்குக் கொடுத்தது போலவே
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள ‘கொடுத்தார்’ என்ற வினைப்பொருளை தமிழில் தெளிவுக்காக நிரப்பி, அவர்களுக்கும் நமக்கும் ஒரே விதமாக ஆவி வழங்கப்பட்ட ஒப்புமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இதயங்களை அறியும் கடவுளின் பண்பும் புறஜாதியாருக்கான அவரது சான்றும்
  choice: ‘இதயங்களை அறிந்தவரான கடவுள்’ என்று பண்புத் தொடராக மொழிபெயர்த்து, சான்று பரிசுத்த ஆவியை அளித்ததன் மூலம் வழங்கப்பட்டது எனக் காட்டப்பட்டது.
  alternative: ‘இதயங்களை அறிபவராகிய கடவுள்’ அல்லது ‘இதயங்களை அறியும் கடவுள்’ என்று மொழிபெயர்க்கலாம்.
  rationale: καρδιογνώστης கடவுளின் பண்பை வலியுறுத்துகிறது; அதேவேளை δοὺς சான்றளித்ததற்கான வழிமுறையைச் சொல்கிறது. கடவுள் அவர்களை ஏற்றுக்கொண்டதன் விரிவான உடன்படிக்கை அல்லது இனவியல் விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை.
- issue: ‘அவர்கள்’ என்போரின் அடையாளம்
  choice: மூலத்தின் αὐτοῖς போலவே ‘அவர்களுக்கு’ என வைக்கப்பட்டது.
  alternative: சூழலை வெளிப்படையாக்க ‘புறஜாதியாருக்கு’ என்று மொழிபெயர்க்கலாம்.
  rationale: அவர்கள் புறஜாதியார் என்பது சூழலால் தெளிவாகிறது; ஆனால் அந்தப் பெயர்ச்சொல் இவ்வசனத்தின் கிரேக்க உரையில் இல்லை. ஆகவே மூலத்தின் சுட்டுப்பெயரையும் அதன் சூழல் சார்பையும் பாதுகாக்கிறது.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் நடை. ‘இதயங்கள்’ என்பது உடல் உறுப்பை மட்டும் அல்லாமல் மனிதரின் உள்ளார்ந்த எண்ணம், நோக்கம், மனநிலையைச் சுட்டும் வேதாகம உருவகத்தைத் தக்கவைக்கிறது. வசனத்தில் அடிக்குறிப்பு தேவையில்லை.
