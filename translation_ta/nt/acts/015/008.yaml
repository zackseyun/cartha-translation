  terminology: “கடவுள்,” “பரிசுத்த ஆவி,” and “சான்றளித்தார்” are established, comprehensible Tamil biblical terms. The plural “இதயங்களை” naturally expresses the compound’s sense of knowing human hearts without imposing an unwarranted interpretation.
