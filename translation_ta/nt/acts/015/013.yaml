  - severity: low
    issue: The imperative expands the Greek object.
    rationale: ‘நான் சொல்வதைக் கேளுங்கள்’ adds ‘what I say,’ whereas ἀκούσατέ μου is more directly and idiomatically rendered ‘எனக்குச் செவிகொடுங்கள்.’
