source:
  edition: SBLGNT
  text: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς ἀπεκρίθη Ἰάκωβος λέγων· Ἄνδρες ἀδελφοί, ἀκούσατέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: ta
  text: 'அவர்கள் அமைதியடைந்த பின்பு[a], யாக்கோபு பதிலளித்துக் கூறினார்: “சகோதரர்களே[b], எனக்குச் செவிகொடுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் பேசுவதை நிறுத்திய பின்பு.” முந்தைய பேச்சாளர்கள் பேசுவதை நிறுத்திய பின் நிகழ்ந்ததை கிரேக்கத் தொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “ஆண்களே, சகோதரர்களே.” இது கிரேக்கத்தில் ஆண்பால் முறையான அழைப்பு. இங்கு கூடிவந்த சகோதரர்களை நோக்கி இவ்வாறு பேசப்படுகிறது; எனினும் விரிவான அந்தக் கூட்டத்தில் மற்றவர்களும் இருந்தனர்.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: அவர்கள் அமைதியான பின்பு
  rationale: μετά + பெயரெச்ச வினையெச்ச அமைப்பு பின்னர் நிகழும் காலத்தைக் குறிக்கிறது. σιγάω இங்கு பேசுவதை நிறுத்தி அமைதியாவதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் காலவரிசை தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἀπεκρίθη
  choice: பதிலளித்துச் சொன்னார்
  rationale: ἀποκρίνομαι என்பது பதிலளித்தல் அல்லது எதிர்வினையாகப் பேசுதல் எனப் பொருள்படும். அடுத்துள்ள λέγων என்பதையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: Ἰάκωβος
  choice: யாக்கோபு
  rationale: புதிய ஏற்பாட்டுத் தமிழ் மரபிலும் கிரேக்கப் பெயரின் மூல வடிவத்திற்கும் ஏற்ற வழக்கமான பெயராக்கம்.
- source_word: λέγων
  choice: சொன்னார்
  rationale: இந்தப் பங்கேற்பு வடிவம் நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது; ἀπεκρίθη உடன் இணைந்து தமிழில் இயல்பாக அமைக்கப்பட்டது.
- source_word: Ἄνδρες ἀδελφοί
  choice: சகோதரர்களே
  rationale: இரண்டு ஆண்பால் அழைப்புச் சொற்களையும் தமிழில் அப்படியே அடுக்குவது மிகவும் செயற்கையாக இருக்கும். ‘சகோதரர்களே’ என்பது சபையிலிருந்த ஆண்களை நோக்கிய முறையான அழைப்பாக இயல்பாக உள்ளது; ἄνδρες என்ற வெளிப்படையான ஆண்பால் கூறு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ἀκούσατέ μου
  choice: நான் சொல்வதைக் கேளுங்கள்
  rationale: கிரேக்க இறந்தகால ஏவல் வடிவம் கவனத்துடன் கேட்குமாறு கட்டளையிடுகிறது. ‘எனக்குச் செவிகொடுங்கள்’ என்பதைவிட இவ்வடிவம் நவீனத் தமிழில் இயல்பாகவும் அதே வலிமையுடனும் உள்ளது.
theological_decisions:
- issue: பொதுக் கூடத்தில் பயன்படுத்தப்பட்ட ஆண்பால் அழைப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று வைத்து, கிரேக்கத்தின் வெளிப்படையான ஆண்பால் வடிவத்தை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘ஆண்களே, சகோதரர்களே’
  rationale: ἄνδρες, ἀδελφοί இரண்டும் இலக்கண ரீதியாக ஆண்பால் பன்மை அழைப்புகள். இருப்பினும் அவற்றைச் சொற்சொல்லாக அடுக்குவது தமிழில் இயல்பற்றது. ‘சகோதரர்களே’ முறையான ஆண்பால் அழைப்பைத் தக்கவைக்கிறது; அடிக்குறிப்பு மூலத்தின் முழு வடிவத்தையும் வெளிப்படையாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் பொதுவாசிப்புக்கு ஏற்ற ஓட்டமும் பேணப்பட்டுள்ளன. ‘பதிலளித்துச் சொன்னார்’ என்பது கிரேக்கத்தின் உரையாடல் அமைப்பைத் தக்கவைக்கிறது; ‘சகோதரர்களே’ இயல்பான முறையான அழைப்பாக உள்ளது.
