source:
  edition: SBLGNT
  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: ta
  text: ஏனெனில், இந்த அவசியமானவற்றைத் தவிர, உங்கள்மேல் இதற்கும் மேலான எந்தச் சுமையையும் சுமத்தாமல் இருப்பது தூய ஆவிக்கும் எங்களுக்கும் நல்லதெனத் தோன்றியது:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய ஆவியாலும் எங்களாலும் தீர்மானிக்கப்பட்டது.” ἔδοξεν … καὶ ἡμῖν என்ற கிரேக்க மரபுத்தொடரைத் தீர்மானத்தை அறிவிக்கும் சொற்றொடராகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்த இன்றியமையாதவற்றை” அல்லது “இந்த அவசியமான தேவைகளை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: நலமெனத் தோன்றியது
  rationale: δοκέω என்பதன் இறந்தகாலத் தீர்மானச் சொற்றொடர் ‘நலமெனத் தோன்றியது’ அல்லது ‘தீர்மானிக்கப்பட்டது’ என்று பொருள்படலாம். முதன்மை மொழிபெயர்ப்பு கிரேக்க மரபுத்தொடரையும் ஆலோசனைக்குப் பிந்தைய ஒப்புதலின் தொனியையும் காக்கிறது.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: தூய ஆவிக்கும்
  rationale: ἔδοξεν என்பதோடு இணையும் வேற்றுமை வடிவம், தூய ஆவியின் தனிப்பட்ட ஒப்புதலைக் குறிக்கிறது. ‘தூய ஆவி’ என்பது நவீனத் தமிழில் இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: καὶ ἡμῖν
  choice: எங்களுக்கும்
  rationale: இது ‘தூய ஆவிக்கும்’ என்பதுடன் இணையான இலக்கண அமைப்பில் இருந்து, ஒருங்கிணைந்த ஒப்புதலை வெளிப்படுத்துகிறது.
- source_word: μηδὲν πλέον
  choice: வேறு எந்தச் ... யையும்
  rationale: βάρος என்பதுடன் சேர்ந்து, குறிப்பிடப்பட்டவற்றுக்கு மேலாக அல்லது கூடுதலாக ஒன்றும் இல்லை என்ற ஒப்பீட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπιτίθεσθαι ὑμῖν βάρος
  choice: எந்தச் சுமையையும் உங்கள்மேல் சுமத்தாமல் இருப்பது
  rationale: சுமையை ஒருவர்மேல் வைப்பது என்ற கிரேக்க உருவகத்தைத் தமிழிலும் காத்து, விதிக்கப்படும் கடமைகள் என்ற சூழல்சார் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: πλὴν
  choice: தவிர
  rationale: முந்தைய எதிர்மறைக் கூற்றுக்குப் பின்னர் வரும் விதிவிலக்கை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: τούτων τῶν ἐπάναγκες
  choice: அவசியமான இவற்றை
  rationale: அடுத்த வசனத்தில் பட்டியலிடப்படும் குறிப்பிட்டவற்றைச் சுட்டுகிறது. ‘அவசியமானவை’ என்பது அவற்றின் தன்மையை மேலதிகமாக விளக்காமல் கிரேக்கத்தின் தேவையுணர்வைக் காக்கிறது.
theological_decisions:
- issue: தூய ஆவிக்கும் அவைக்கும் இடையிலான தீர்மான உறவு
  choice: ‘தூய ஆவிக்கும் எங்களுக்கும் நலமெனத் தோன்றியது’ என்று இணையான அமைப்பைக் காத்தல்
  alternative: இதை மனிதர்களின் ஒருமித்த முடிவாக மட்டும் கூறுதல் அல்லது ஆவியைத் தனிப்பட்ட செயலாளராகக் காட்டாமல் மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் தூய ஆவியும் ‘நாங்களும்’ ஒரே வினையின் இணையான வேற்றுமை நிறைவுகளாக வருகின்றனர். மொழிபெயர்ப்பு இந்த ஒருங்கிணைந்த ஒப்புதலை விளக்கிச் சுருக்காமல் அப்படியே காக்கிறது.
- issue: புறவினத்து நம்பிக்கையாளர்கள்மேல் விதிக்கப்படும் கடமைகளின் அளவு
  choice: குறிப்பிடப்படும் அவசியமானவற்றைத் தவிர வேறு சுமை சுமத்தப்படவில்லை என்று மொழிபெயர்த்தல்
  alternative: எந்தக் கடமையும் முற்றிலும் இல்லை என்றோ மோசேயின் சட்டம் முழுவதும் விதிக்கப்படுகிறது என்றோ பொருள்கொள்ளுதல்
  rationale: வசனம் குறிப்பிட்ட சிலவற்றை விதிவிலக்காக வைத்துக் கொண்டு கூடுதல் சுமையை மறுக்கிறது. ஆகவே சட்டம் மற்றும் அருள் பற்றிய பிற்காலக் கோட்பாட்டு முடிவுகளை உரைக்குள் புகுத்தாமல் அதன் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘நலமெனத் தோன்றியது’ கிரேக்கத் தீர்மான மரபுத்தொடரின் திட்டமிட்ட மிதத்தன்மையை காக்கிறது; ‘சுமத்துதல்’ என்ற உருவகம் தமிழிலும் இயல்பாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
