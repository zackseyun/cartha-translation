  rationale: புறப்படுவதற்கு முன் பவுலே சீலாவைத் தேர்ந்தெடுத்தார் என்ற இறந்தகால இடைநிலைப் பங்கேற்புச் சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: Σιλᾶν
  choice: சீலா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: ἐξῆλθεν
  choice: புறப்பட்டார்
  rationale: பயணக் கதைச் சூழலில் ‘வெளியே சென்றார்’ என்பதைவிட ஒரு பயணத்தைத் தொடங்கினார் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παραδοθεὶς
  choice: ஒப்புவிக்கப்பட்டு
  rationale: சமூகத்தார் பவுலை இறைவனுடைய அருளின் பொறுப்பிலும் பாதுகாப்பிலும் ஒப்படைத்தார்கள் என்ற செயலற்ற வினைத் தன்மையைப் பாதுகாக்கிறது; ‘பரிந்துரைக்கப்பட்டு’ என்ற நவீன தமிழின் வேறுபட்ட பொருளைத் தவிர்க்கிறது.
- source_word: τῇ χάριτι
  choice: அருளுக்கு
  rationale: χάρις என்ற இறையியல் முக்கியத்துவமுள்ள பெயர்ச்சொல்லை விளக்கவுரையாக மாற்றாமல் ‘அருள்’ எனத் தக்கவைக்கிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவரின்
  rationale: கிரேக்க உரை இயேசுவையா பிதாவாகிய கடவுளையா என்று இங்கு வெளிப்படையாகக் குறிப்பிடாததால், அதன் தெளிவின்மையைத் தீர்க்காமல் வழக்கமான கிறிஸ்தவப் பட்டப்பெயராக மொழிபெயர்க்கிறது.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: சகோதரர்களால்
  rationale: செயலற்ற வினையின் செய்பவரைக் குறிக்கும் ὑπό தொடரையும், மூலத்தின் ஆண்பால் பன்மை வடிவையும் பிரதான உரையில் பாதுகாக்கிறது; சமூகமெங்கும் உள்ளடங்கக்கூடிய பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பதன் குறிப்பு
  choice: ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆண்டவராகிய இயேசு’ அல்லது ‘கடவுள்’
  rationale: κύριος என்ற பட்டப்பெயரின் குறிப்பை கிரேக்க உரை இந்த வசனத்தில் வெளிப்படையாகத் தீர்மானிக்கவில்லை; எனவே மொழிபெயர்ப்பும் தேவையற்ற இறையியல் தீர்மானத்தைச் சேர்க்கவில்லை.
- issue: ‘சகோதரர்கள்’ என்பதன் பரப்பு
  choice: பிரதான உரையில் ‘சகோதரர்கள்’ என வைத்து, உள்ளடக்கப் பரப்பை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ‘சகோதர சகோதரிகள்’ அல்லது ‘விசுவாசிகள்’
  rationale: ἀδελφῶν என்பது இலக்கணப்படி ஆண்பால் பன்மை; அதேவேளை ஆரம்பக் கிறிஸ்தவச் சமூகப் பயன்பாட்டில் பெண்களையும் உள்ளடக்கலாம். வடிவை உரையில் காத்து, சூழல்சார் உள்ளடக்கத்தை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியத்தின் பங்கேற்புச் சொல் அமைப்பு வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், தேர்ந்தெடுத்தல், சமூகத்தாரால் அருளுக்கு ஒப்புவிக்கப்படுதல், புறப்படுதல் ஆகிய நிகழ்வுகளின் தொடர்பு காக்கப்பட்டுள்ளது.
