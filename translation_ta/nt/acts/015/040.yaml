  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: ta
  text: ஆனால் பவுல் சீலாவைத் தேர்ந்தெடுத்தார். சகோதரர்களால்[b] ஆண்டவரின் அருளுக்கு ஒப்புவிக்கப்பட்டு[a], அவர் புறப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரின் அருளிடம் ஒப்படைக்கப்பட்டு.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “சகோதரர்கள்” என்பது சூழலின்படி பெண்களையும் உள்ளடக்கிய விசுவாசக் குழுமம் முழுவதையும் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் பர்னபா புறப்பட்டதற்கு மாறாக இப்போது பவுலின் செயலுக்குத் திரும்பும் மென்மையான எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ἐπιλεξάμενος
