source:
  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: ta
  text: மாறாக, சிலைகளோடு தொடர்புடைய தீட்டுகளையும்[a], பாலியல் ஒழுக்கக்கேட்டையும்[b], கழுத்து நெரித்துக் கொல்லப்பட்டதையும்[c], இரத்தத்தையும் விட்டு விலகியிருக்கும்படி அவர்களுக்கு எழுத வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிலைகளால் உண்டாகும் தீட்டுகள்.’ சில மொழிபெயர்ப்புகள் இதை ‘சிலைகளுக்குப் படைக்கப்பட்ட உணவு’ என்று குறுக்குகின்றன; ஆனால் இங்குள்ள கிரேக்கச் சொற்றொடர் அதைவிடப் பரந்தது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொல் பாலியல் ஒழுக்கக்கேட்டை விரிவாகக் குறிக்கலாம்; இங்கு அது குறிப்பாகத் தடைசெய்யப்பட்ட பாலியல் உறவுகளைக் குறிக்கிறது என்றும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: c
    text: சொல்லெழுத்தாக, ‘கழுத்து நெரிக்கப்பட்டது’; இரத்தம் முறையாக வடிக்கப்படாமல் கொல்லப்பட்ட விலங்கிலிருந்து கிடைத்ததை இது குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: எழுத வேண்டும்
  rationale: எருசலேம் ஆலோசனைக் குழுவின் எழுத்துப்பூர்வ அறிவுறுத்தலைச் சூழல் காட்டுவதால், கடிதத்தின் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀπέχεσθαι
  choice: விட்டு விலகியிருக்கும்படி
  rationale: ஒரு பொருள் அல்லது நடத்தையிலிருந்து தம்மைத் தவிர்த்துக்கொள்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: சிலைகளோடு தொடர்புடைய தீட்டுகள்
  rationale: சிலை வழிபாட்டுடன் தொடர்புடைய சடங்கு அல்லது வழிபாட்டு மாசுபாட்டைத் தெரிவிக்கிறது; இதைச் சிலைகளுக்குப் படைக்கப்பட்ட உணவு என்று மட்டும் குறுக்கவில்லை.
- source_word: πορνείας
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: பொதுவாகத் தவறான பாலியல் நடத்தையைக் குறிக்கும் சொல்லின் பரப்பைத் தக்கவைக்கிறது; குறிப்பிட்ட ஒரு வகை உறவாகக் குறுக்கவில்லை.
- source_word: τοῦ πνικτοῦ
  choice: கழுத்து நெரித்துக் கொல்லப்பட்டது
  rationale: இரத்தம் முறையாக வடிக்கப்படாமல் கொல்லப்பட்ட விலங்கைச் சுட்டும் பெயரடைப் பயன்பாட்டை, ‘இறைச்சி’ என்ற சொல்லை மூலத்தில் இல்லாமல் சேர்க்காமல் வெளிப்படுத்துகிறது.
- source_word: τοῦ αἵματος
  choice: இரத்தம்
  rationale: மூலத்தின் சுருக்கத்தையும் பட்டியலின் இணை அமைப்பையும் தக்கவைக்கிறது; அதன் பயன்பாட்டை மொழிபெயர்ப்பிலேயே மிகையாக விளக்கவில்லை.
theological_decisions:
- issue: சிலை தொடர்பான தடையின் பரப்பு
  choice: சிலைகளோடு தொடர்புடைய தீட்டுகள்
  alternative: சிலைகளுக்குப் படைக்கப்பட்ட உணவு
  rationale: ἀλισγημάτων τῶν εἰδώλων என்பது εἰδωλόθυτα என்பதைக் காட்டிலும் பரந்த சொற்றொடர். ஆகவே குறிப்பிட்ட உணவுத் தடையாக மட்டும் பொருளை முடிவுசெய்யாமல், பரந்த சிலைத் தொடர்புடைய தீட்டைப் பாதுகாக்கிறது.
- issue: அப்போஸ்தலர் தீர்மானத்தில் πορνεία என்பதன் பொருள்
  choice: பாலியல் ஒழுக்கக்கேடு
  alternative: தடைசெய்யப்பட்ட பாலியல் உறவுகள்
  rationale: இச்சொல் பொதுவான பாலியல் பாவத்தையோ, இச்சூழலில் குறிப்பிட்ட தடைசெய்யப்பட்ட உறவுகளையோ குறிக்கலாம். முதன்மை உரை அதன் பொருள் பரப்பைத் திறந்தே வைக்கிறது.
- issue: பட்டியலிடப்பட்ட தடைகளின் காலமும் கட்டுப்பாட்டு இயல்பும்
  choice: அவற்றை விட்டு விலகுமாறு மட்டும் கூறுதல்
  alternative: யூதர்–யூதரல்லாதோர் உணவு உறவுக்கான தற்காலிக ஏற்பாடு அல்லது எல்லாக் காலத்திற்குமான கட்டளை என்று விளக்குதல்
  rationale: இவ்வசனம் தடைகளைத் தருகிறது; அவற்றின் முழுமையான நோக்கம் அல்லது காலவரம்பை விளக்கவில்லை. எனவே எந்த இறையியல் முடிவையும் உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தீட்டு’ என்ற சொல் வழிபாட்டு மாசுபாட்டின் நுணுக்கத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் பரந்த பொருளை விளக்குகிறது. பட்டியலின் கிரேக்க இணை அமைப்பு தமிழில் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
