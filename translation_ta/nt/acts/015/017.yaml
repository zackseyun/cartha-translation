  to: மனிதகுலத்தில் எஞ்சியிருப்போரும், என் பெயரால் அழைக்கப்படுகிற[b] பிற இனத்தார்[a] அனைவரும் ஆண்டவரைத் தேடும்படி, இவற்றைச் செய்கிற ஆண்டவர் கூறுகிறார்.[c]
  rationale: திருத்தம் கிரேக்கப் பெயரிடல் மரபுத்தொடரின் அடையாளப்படுத்தும் பொருளைத் துல்லியமாக்குகிறது; அதேவேளை அதன் நேரடித் தோற்றத்தை அடிக்குறிப்பில் பாதுகாக்கிறது. அடிக்குறிப்பு b-யும் அது விளக்கும் சொல்லாட்சிக்கு நேரடியாக நங்கூரமிடப்பட்டுள்ளது. ἔθνη-க்கு ‘பிற இனத்தார்’ என்ற சூழல்சார் வாசிப்பும் ‘தேசத்தார்’ என்ற மாற்றுவாசிப்பும் மாற்றப்படவில்லை.
