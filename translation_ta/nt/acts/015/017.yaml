source:
  edition: SBLGNT
  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: ta
  text: மனிதகுலத்தில் எஞ்சியிருப்போரும், என் பெயரால் அழைக்கப்படுகிற[b] பிற இனத்தார்[a] அனைவரும் ஆண்டவரைத் தேடும்படி, இவற்றைச் செய்கிற ஆண்டவர் கூறுகிறார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா தேசத்தாரும்.” ἔθνη என்ற கிரேக்கச் சொல் “பிற இனத்தார்” என்றும் “தேசத்தார்” என்றும் பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “என் பெயர் அவர்கள்மேல் அழைக்கப்பட்டிருக்கிற”; இதற்கு “என் பெயரால் அழைக்கப்படுகிற” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: இந்த வரிகள் ஆமோஸ் 9:12-ஐ கிரேக்க வேதாகமத்தில் காணப்படும் வடிவில் எதிரொலிக்கின்றன; அங்கு ஆண்டவரின் பெயரைத் தாங்கும் தேசங்கள் அல்லது பிற இனத்தார் வலியுறுத்தப்படுகின்றனர்.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: தேடும்படி
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκζητήσωσιν
  choice: தேடும்படி
  rationale: வினையின் தீவிரப் பொருளை அளவுக்கு மீறி வலியுறுத்தாமல், இச்சூழலில் அதன் இயல்பான பொருளான ‘தேடுதல்’ என்பதைக் கொடுக்கிறது.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: மனிதர்களில் எஞ்சியிருப்போர்
  rationale: κατάλοιποι என்பதன் ‘மீதியாக இருப்போர்’ என்ற பொருளையும், ἀνθρώπων என்பதன் பொதுவான மனிதகுலக் குறிப்பையும் பாலின வரம்பின்றிப் பாதுகாக்கிறது.
- source_word: τὸν κύριον
  choice: ஆண்டவரை
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழாக்கம்; வாக்கியத்தில் தேடுதலின் செயப்படுபொருளாக வேற்றுமை உருபுடன் தரப்பட்டுள்ளது.
- source_word: πάντα τὰ ἔθνη
  choice: பிற இனத்தார் அனைவரும்
  rationale: எருசலேம் ஆலோசனைக் கூட்டத்தின் சூழலில் யூதரல்லாதவர்களின் சேர்க்கையே மையமாக இருப்பதால், ἔθνη என்பதன் ‘Gentiles’ என்ற சூழற்பொருளைத் தெரிவிக்கிறது; ‘எல்லா தேசத்தாரும்’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: என் பெயர் சூட்டப்பட்டிருக்கிற
  rationale: தெய்வீகப் பெயருடன் அடையாளப்படுத்தப்பட்டிருப்பதையும் அவருக்குரியவர்களாக இருப்பதையும் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது; அதன் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: λέγει κύριος
  choice: ஆண்டவர் கூறுகிறார்
  rationale: தீர்க்கதரிசன மேற்கோள்களில் வரும் வழக்கமான அறிவிப்பு முறையை நிகழ்காலத்தில் கண்ணியமாகத் தருகிறது.
- source_word: ποιῶν ταῦτα
  choice: இவற்றைச் செய்கிற
  rationale: நிகழ்காலப் பங்கேற்புவினை ‘ஆண்டவர்’ என்பதைக் குறிப்பதைத் தெளிவாகவும் இயல்பாகவும் பாதுகாக்கிறது.
theological_decisions:
- issue: 'ἔθνη என்பதன் பொருள்: தேசத்தாரா அல்லது யூதரல்லாத பிற இனத்தாரா'
  choice: பிற இனத்தார்
  alternative: எல்லா தேசத்தாரும்
  rationale: அப்போஸ்தலர் 15-இன் உடனடிச் சூழல் யூதரல்லாதவர்கள் தேவமக்களுடன் சேர்க்கப்படுவதைப் பற்றியது. இருப்பினும் தீர்க்கதரிசன மேற்கோளில் உள்ள பரந்த ‘தேசங்கள்’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: தெய்வீகப் பெயர் ‘அழைக்கப்பட்டிருக்கும்’ என்ற மரபுத்தொடர்
  choice: என் பெயர் சூட்டப்பட்டிருக்கிற
  alternative: என் பெயர் அவர்கள்மேல் அழைக்கப்பட்டிருக்கிற
  rationale: முதன்மை வாசகம் அந்த மக்களின் தேவனுக்குரிய அடையாளத்தை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கத்தின் அசாதாரணமான ஆனால் இறையியல் நிறைந்த நேரடி சொல்லமைப்பு அடிக்குறிப்பில் மறைக்கப்படாமல் தரப்பட்டுள்ளது.
- issue: ἀνθρώπων என்பதன் பொதுமனிதக் குறிப்பு
  choice: மனிதர்களில்
  alternative: மனிதகுலத்தில்
  rationale: இது ஆண்களை மட்டும் குறிக்கவில்லை; மொத்த மனிதர்களிலிருந்து எஞ்சியிருப்பவர்களைக் குறிக்கிறது. ‘மனிதர்களில்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தில் வினைக்கு முன் தனித்தனியாக வரும் இரு எழுவாய்களையும் தமிழில் ஒருங்கிணைத்து, இரு குழுவினரும் ஆண்டவரைத் தேடுவார்கள் என்பது தெளிவாக்கப்பட்டுள்ளது; பொருளில் புதிதாக எதுவும் சேர்க்கப்படவில்லை.
