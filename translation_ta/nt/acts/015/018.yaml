translation:
  language: ta
  text: பழங்காலத்திலிருந்தே அறியப்பட்டவை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “நித்திய காலத்திலிருந்தே அறியப்பட்டவை” என்றோ, “இவற்றைப் பழங்காலத்திலிருந்தே தெரியப்படுத்துகிறவர்” என்றோ விரிவாக உள்ளது.
