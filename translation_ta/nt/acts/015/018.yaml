lexical_decisions:
- source_word: γνωστὰ
  choice: அறியப்பட்டவை
  rationale: இது வினைச்சொல் இல்லாத சுருக்கமான வாக்கியத்தில் பயனிலைப் பொருளில் வரும் பன்மை உரிச்சொல். “அறியப்பட்டவை” என்பது அதன் பொருளை நேரடியாகத் தருகிறது; “அறிவிக்கப்பட்டவை” என்று மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத செயப்படுத்தும் நுணுக்கம் சேரும்.
- source_word: ἀπ’
  choice: -இலிருந்தே
  rationale: காலத்தின் தொடக்கப் புள்ளியைக் குறிக்கும் ἀπό என்பதன் பொருளைத் தமிழில் இயல்பாகத் தருகிறது. “-ஏ” விகுதி நீண்ட காலத் தொடர்ச்சியைச் சுருக்கமாக வலியுறுத்துகிறது.
- source_word: αἰῶνος
  choice: பழங்காலம்
  rationale: இந்தக் காலவழக்கில் αἰών தொன்மையான கடந்த காலத்தையோ நீண்ட காலப்பகுதியையோ குறிக்கலாம். SBLGNT-யின் சுருக்கமான வாசகத்தில் “நித்தியம்” என்ற வலுவான பொருளைத் திணிக்காமல் “பழங்காலம்” இயல்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: இந்தச் சுருக்கமான கூற்றில் கடவுளுடைய அறிவின் கால எல்லை
  choice: இவை பழங்காலத்திலிருந்தே அறியப்பட்டவை என்று மட்டும் மொழிபெயர்த்து, நித்திய முன்அறிவைப் பற்றிய விரிவான இறையியல் கூற்றாக மாற்றவில்லை.
  alternative: “நித்திய காலத்திலிருந்தே அறியப்பட்டவை” அல்லது “இவற்றைப் பழங்காலத்திலிருந்தே அறியச் செய்கிறவர்.”
  rationale: SBLGNT வாசகம் γνωστὰ ἀπ’ αἰῶνος என்று மிகச் சுருக்கமாக உள்ளது. நீளமான பிற பாடபேதங்களிலுள்ள சொற்களையோ இறையியல் அனுமானத்தையோ முதன்மை உரையில் சேர்க்காமல், மாற்று வாசகங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. முந்தைய வசனத்திலுள்ள செயல்களைக் குறிக்கும் கிரேக்கப் பன்மை வடிவத்தை “அறியப்பட்டவை” தக்கவைக்கிறது; மூலத்தின் வினையற்ற, செறிவான அமைப்பும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
