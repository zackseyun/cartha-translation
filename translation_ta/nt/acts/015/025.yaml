- source_word: ἐκλεξαμένοις
  choice: தேர்ந்தெடுத்து
  rationale: அனுப்புவதற்கு முன் ஆட்களைத் தேர்ந்தெடுத்த செயலை வினையெச்சமாகத் தெளிவாகக் காட்டுகிறது.
- source_word: ἄνδρας
  choice: ஆண்கள் சிலரை
  rationale: ἀνήρ இங்கு பொதுவாக மனிதர்களை அல்ல, ஆண்களைக் குறிப்பதாகும்; அடுத்தடுத்த வசனங்களின் சூழலும் இதை உறுதிப்படுத்துகிறது.
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: அவர்களை ... உங்களிடம் அனுப்புவது
  rationale: தேர்ந்தெடுக்கப்பட்ட ஆண்களே அனுப்பப்படுகிறார்கள் என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: σὺν τοῖς ἀγαπητοῖς ἡμῶν
  choice: எங்கள் அன்புக்குரிய ... ஓடும்
