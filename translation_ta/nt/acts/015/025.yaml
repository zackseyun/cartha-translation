lexical_decisions:
- source_word: ἔδοξεν ἡμῖν
  choice: நல்லது என்று கருதினோம்
  rationale: குழுவாக ஆலோசித்து ஏற்றுக்கொண்ட தீர்மானத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் இயல்பையும் மிதமான தொனியையும் காக்கிறது; ‘கட்டளையிட்டோம்’ போன்ற வலுவான அதிகாரத் தொனியைச் சேர்க்கவில்லை.
- source_word: γενομένοις ὁμοθυμαδόν
