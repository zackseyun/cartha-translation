- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: பர்னபாவோடும் பவுலோடும்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவங்களைப் பின்பற்றி, உடன்செல்லும் பொருளை இயல்பான இணைப்பால் காட்டுகிறது.
theological_decisions:
- issue: எருசலேம் கடிதத்தின் கூட்டுத் தீர்மானத் தொனி
  choice: நல்லது என்று கருதினோம்
  alternative: நாங்கள் தீர்மானித்தோம்
  rationale: δοκέω அமைப்பு ஒரு கூட்டத்தின் ஒப்புதலையும் மதிப்பீட்டையும் தெரிவிக்கிறது. மாற்று வாசகம் மூலத்தில் வெளிப்படையாக இல்லாத அதிக வலுவான அதிகாரத் தொனியை ஏற்படுத்தலாம்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கூட்டுத் தீர்மானத்தின் மிதமான தொனியும், ஒருமித்த நிலைக்கு வந்த செயல்முறையும், ἄνδρας என்பதன் ஆண்பால் குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
