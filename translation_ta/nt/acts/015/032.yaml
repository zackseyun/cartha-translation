source:
  edition: SBLGNT
  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: ta
  text: யூதாவும் சீலாவும் தாங்களே தீர்க்கதரிசிகளாக இருந்து, சகோதரர்களிடம்[a] நீண்ட நேரம் பேசி அவர்களை ஊக்கப்படுத்தி உறுதிப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதரர்களும் சகோதரிகளும்.” கிரேக்க மூலத்தில் “சகோதரர்கள்” என்று உள்ளது; இது முழு விசுவாசக் கூட்டத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας τε καὶ Σιλᾶς
  choice: யூதாவும் சீலாவும்
  rationale: இரு நபர்களின் பெயர்களையும் இயல்பான தமிழில் இணைக்கிறது; τε καὶ காட்டும் நெருங்கிய இணைப்பை ‘உம்...உம்’ அமைப்பு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: தாங்களும் தீர்க்கதரிசிகளாக இருந்ததால்
  rationale: αὐτοὶ என்பதன் வலியுறுத்தலை ‘தாங்களும்’ காக்கிறது; பங்கேற்புவினை அமைப்பு இங்கு அடுத்த செயல்களுக்கான பின்னணி அல்லது காரணத்தைத் தருவதால் இயல்பான தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: διὰ λόγου πολλοῦ
  choice: நீண்ட நேரம் உரையாற்றி
  rationale: சொல்லுக்குச் சொல் ‘மிகுதியான பேச்சின் மூலம்’ என்பதற்குப் பதிலாக, நீண்ட அளவில் வாய்மொழியாகப் போதித்து ஊக்கப்படுத்திய பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: παρεκάλεσαν
  choice: ஊக்கப்படுத்தி
  rationale: παρακαλέω இச்சூழலில் ஆறுதல், அறிவுரை, வலியுறுத்தல் ஆகிய நிழற்பொருள்களைக் கொண்டிருந்தாலும், நம்பிக்கையாளர்களைத் திடப்படுத்தும் தீர்க்கதரிசனப் பணியை ‘ஊக்கப்படுத்தி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοὺς ἀδελφοὺς
  choice: சகோதரர்களை
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் நேரடியாகக் காக்கிறது; இது முழு விசுவாசக் கூட்டத்தையும் குறிக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐπεστήριξαν
  choice: அவர்களை உறுதிப்படுத்தினார்கள்
  rationale: விசுவாசத்தில் திடமாக்குதல் என்ற வினையின் பொருளைக் காக்கிறது; முந்தைய ‘ஊக்கப்படுத்தி’ என்பதிலிருந்து வேறுபட்ட இரண்டாவது செயலைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ἀδελφοὺς என்பது கலப்புப் பாலின விசுவாசக் கூட்டத்தைக் குறிக்குமா?
  choice: முதன்மை உரையில் ‘சகோதரர்களை’
  alternative: ‘சகோதர சகோதரிகளை’ அல்லது ‘விசுவாசிகளை’
  rationale: மூலச்சொல் இலக்கண ரீதியாக ஆண்பால் பன்மை. அதேவேளை, ஆரம்பக் கிறிஸ்தவப் பயன்பாட்டில் அது பெண்களையும் உள்ளடக்கிய முழு விசுவாசக் கூட்டத்தைக் குறிக்கலாம். ஆகவே மூல வடிவம் உரையில் காக்கப்பட்டு, உள்ளடக்கிய பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசிகள்’, ‘ஊக்கப்படுத்தி’, ‘உறுதிப்படுத்தினார்கள்’ ஆகியவை மூலத்தின் இறையியல் மற்றும் மேய்ப்புப்பணி நிழற்பொருள்களை எளிமையாகக் காக்கின்றன.
