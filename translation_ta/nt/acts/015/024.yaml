  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: ta
  text: எங்களிடமிருந்து புறப்பட்டுச் சென்ற சிலர்—நாங்கள் அவர்களுக்கு எந்த அறிவுறுத்தலும் கொடுத்திருக்கவில்லை[b]—தங்கள் பேச்சால் உங்களைக் கலக்கி, உங்கள் உள்ளங்களை நிலைகுலையச் செய்தார்கள்[a] என்று கேள்விப்பட்டிருப்பதால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘உங்கள் ஆத்துமாக்களைச் சீர்குலைத்து.’ இங்குள்ள கிரேக்கச் சொற்றொடர் அவர்களின் உணர்ச்சிகளை மட்டும் அல்ல, அவர்களின் அகநிலையையே குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நாங்கள் அவர்களுக்குக் கட்டளையிடவில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ ἠκούσαμεν
  choice: என்று கேள்விப்பட்டிருப்பதால்
  rationale: ἐπειδή என்பதன் காரணப் பொருளையும், கிடைத்த செய்தி இப்போது பொருத்தமுடையதாக இருப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடுத்த வசனத்துடன் தொடரும் வாக்கிய அமைப்பும் காக்கப்படுகிறது.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: எங்களிடமிருந்து புறப்பட்டுச் சென்ற சிலர்
  rationale: அவர்கள் இந்தக் குழுவிலிருந்து வந்தவர்கள் என்பதையும் அங்கிருந்து புறப்பட்டுச் சென்றதையும் ஒன்றாகக் காட்டுகிறது.
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: தங்கள் பேச்சால் உங்களைக் கலக்கி
  rationale: λόγοις என்பதன் கருவிப் பொருளை ‘தங்கள் பேச்சால்’ என்று இயல்பாகவும், ἐτάραξαν குறிக்கும் மனக்கலக்கத்தைத் தெளிவாகவும் தருகிறது.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: உங்கள் உள்ளங்களை நிலைகுலையச் செய்தார்கள்
  rationale: ἀνασκευάζω குறிக்கும் குலைத்தல் அல்லது சீர்குலைத்தல் என்ற வலிமையையும், ψυχή இங்கு குறிக்கும் மனிதரின் அகநிலையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: நாங்கள் அவர்களுக்கு எந்த அறிவுறுத்தலும் கொடுத்திருக்கவில்லை
  rationale: அந்த நபர்கள் எருசலேம் குழுவின் உத்தரவின்படி செயல்படவில்லை என்ற மறுப்பைத் தெளிவாகக் காக்கிறது; கிரேக்கத்தில் இல்லாத ‘என்றாலும்’ போன்ற இணைப்பைச் சேர்க்கவில்லை.
theological_decisions:
- issue: கலக்கத்தை ஏற்படுத்தியவர்களுக்கு அப்போஸ்தலர் குழுவின் அதிகாரப்பூர்வ அனுமதி இருந்ததா?
  choice: நாங்கள் அவர்களுக்கு எந்த அறிவுறுத்தலும் கொடுத்திருக்கவில்லை
  alternative: நாங்கள் அவர்களுக்குக் கட்டளையிடவில்லை
  rationale: மூலவாக்கியம் அவர்கள் எருசலேம் குழுவின் அறிவுறுத்தலால் அனுப்பப்படவில்லை என்பதை நேரடியாக மறுக்கிறது. ‘அறிவுறுத்தல்’ என்பது கட்டளையின் கடுமையை தேவையின்றி கூட்டாமல் அந்த அதிகாரப்பூர்வ மறுப்பைக் காக்கிறது.
- issue: τὰς ψυχὰς ὑμῶν என்பதைக் ‘ஆத்துமாக்கள்’ என்று நேரடியாக வழங்கலாமா?
  choice: உங்கள் உள்ளங்களை
  alternative: உங்கள் ஆத்துமாக்களை
  rationale: இங்கு ψυχή என்பது உடலிலிருந்து பிரிந்த ஓர் அங்கத்தைப் பற்றிய தொழில்நுட்பக் கோட்பாட்டுச் சொல்லாக அல்லாமல், கேட்போரின் அகநிலை அல்லது முழு நபரைக் குறிக்கிறது. ‘உள்ளங்கள்’ அந்தப் பொருளை இயல்பாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் கடிதத் தன்மையும் காக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்திற்குக் காரணவாக்கியமாகத் தொடருவதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. இடைச்செருகல் கோடுகள் οἷς οὐ διεστειλάμεθα யாரைக் குறிக்கிறது என்பதைத் தெளிவாக்குகின்றன; அதற்கு concessive பொருள் சேர்க்கப்படவில்லை.
