source:
  edition: SBLGNT
  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: ta
  text: நம்முடைய ஆண்டவராகிய இயேசு மெசியாவின் பெயருக்காகத் தங்கள் உயிரைப் பணயம் வைத்த மனிதர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் உயிரை ஒப்படைத்த.’ கிரேக்கச் சொற்றொடர் நேரடியாக இவ்வாறு இருந்தாலும், இங்கு அது உயிருக்கு ஆபத்தான நிலைக்குத் தங்களை உட்படுத்தியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώποις
  choice: மனிதர்கள்
  rationale: இது பர்னபாவையும் பவுலையும் குறிக்கிறது. கிரேக்கச் சொல் இங்கு ஆண்களைக் குறிப்பிட்டாலும், இயல்பான நவீனத் தமிழில் அவர்களை மரியாதையுடன் சுட்டும் பொதுவான சொல்லாக ‘மனிதர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: παραδεδωκόσι
  choice: பணயம் வைத்த
  rationale: παραδίδωμι என்பதன் நேரடிப் பொருள் ‘ஒப்படைத்த’ என்பதாகும்; ஆனால் ‘உயிர்’ என்பதுடன் இங்கு உயிருக்கு ஆபத்தான நிலைக்கு மனமுவந்து தங்களை உட்படுத்தியதைக் குறிக்கிறது. அவர்கள் உண்மையில் இறந்துவிட்டதாகச் சொல்லாமல் அந்த வலிமையை ‘உயிரைப் பணயம் வைத்த’ என்பது இயல்பாகத் தெரிவிக்கிறது.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: தங்கள் உயிரை
  rationale: ψυχή இங்கு உடலிலிருந்து வேறான ‘ஆத்துமா’ என்பதை அல்ல, உயிரையே குறிக்கிறது.
- source_word: ὑπὲρ
  choice: -க்காக
  rationale: காரணம் அல்லது ஒருவருக்காகச் செய்யப்படுவதைக் குறிக்கும் ὑπέρ என்பதற்கு இச்சூழலில் இயல்பான தமிழாக்கம்.
- source_word: τοῦ ὀνόματος
  choice: பெயருக்காக
  rationale: வேதாகமப் பயன்பாட்டிலுள்ள ‘பெயர்’ என்பது நபர், அதிகாரம், மகிமை ஆகியவற்றையும் எதிரொலிக்கச் செய்கிறது; எனவே அதை விளக்கமாகக் குறுக்காமல் அப்படியே தக்கவைக்கிறது.
- source_word: τοῦ κυρίου ἡμῶν
  choice: நம்முடைய ஆண்டவராகிய
  rationale: κύριος என்பதன் கிறிஸ்துவியல் பட்டத்தையும் நவீனத் தமிழின் இயல்பையும் தக்கவைக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Ἰησοῦ என்பது பெயராகவும் Χριστός என்பது ‘மெசியா’ என்ற பட்டமாகவும் வழங்கப்பட்டுள்ளது; ‘கிறிஸ்து’ என்பதை வெறும் இரண்டாம் பெயராகப் புரிந்துகொள்ளும் வாய்ப்பை இது தவிர்க்கிறது.
theological_decisions:
- issue: Χριστοῦ என்பதைப் பட்டமாக மொழிபெயர்த்தல்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் Χριστός, இயேசுவின் பெயருக்குப் பின்னால் வரும் பொருளிழந்த குடும்பப்பெயர் அல்ல; ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பட்டத்தின் பொருளைத் தக்கவைக்கிறது.
- issue: παραδεδωκόσι τὰς ψυχὰς என்பதன் வலிமை
  choice: தங்கள் உயிரைப் பணயம் வைத்த
  alternative: தங்கள் உயிரை ஒப்படைத்த
  rationale: இச்சொற்றொடர் உயிருக்கு ஆபத்தை ஏற்றுக்கொண்டதைக் குறிக்கிறது; அவர்கள் ஏற்கெனவே இறந்துவிட்டதாகக் கூறாது. நேரடித் தமிழாக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமத் தொனியும் குன்றாமல் சாதாரண வாசகர்களுக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது. ‘நாமம்’ என்பதற்குப் பதில் இயல்பான ‘பெயர்’, ‘கர்த்தர்’ என்பதற்குப் பதில் ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளன.
