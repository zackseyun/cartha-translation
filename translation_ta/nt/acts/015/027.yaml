source:
  edition: SBLGNT
  text: ἀπεστάλκαμεν οὖν Ἰούδαν καὶ Σιλᾶν, καὶ αὐτοὺς διὰ λόγου ἀπαγγέλλοντας τὰ αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: ta
  text: ஆகவே, யூதாவையும் சீலாவையும் அனுப்பியிருக்கிறோம்[a]. அவர்களே இதே காரியங்களை வாய்மொழியாகவும்[b] தெரிவிப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அனுப்பினோம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிறைவுக்கால வடிவம், அனுப்பிய செயலின் தற்போதைய தொடர்பை உணர்த்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘சொல் மூலமாக’; அதாவது, கடிதத்துடன் சேர்த்து வாயால் பேசித் தெரிவிப்பது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: அனுப்பியிருக்கிறோம்
  rationale: கிரேக்க நிறைவுக்கால வினை, அனுப்பப்பட்டதன் தற்போதைய தொடர்பை உணர்த்துகிறது; தமிழில் ‘அனுப்பியிருக்கிறோம்’ என்பது அந்த நுட்பத்தை இயல்பாகக் காக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய தீர்மானத்திலிருந்து வரும் முடிவையும் தர்க்கத் தொடர்பையும் தெளிவாகக் குறிக்கிறது.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: யூதாவையும் சீலாவையும்
  rationale: தமிழ் வேதாகமப் பெயர் வழக்கிற்கு ஏற்ற ஒலிபெயர்ப்பு; இருவரும் அனுப்பப்பட்டவர்கள் என்பதை ‘-ஐயும்’ இணைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτοὺς
  choice: அவர்களே
  rationale: கடிதத்துடன் அனுப்பப்பட்ட தூதர்களே அதன் செய்தியை நேரடியாக உறுதிப்படுத்துவார்கள் என்ற வலியுறுத்தலைக் காக்கிறது.
- source_word: διὰ λόγου
  choice: வாய்மொழியாகவும்
  rationale: எழுதப்பட்ட கடிதத்தோடு கூடுதலாகப் பேசிச் செய்தியைத் தெரிவிப்பதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπαγγέλλοντας
  choice: தெரிவிப்பார்கள்
  rationale: மூலத்தில் நிகழ்காலப் பங்கேற்பு வடிவமாக இருந்தாலும், அனுப்பப்பட்டவர்கள் செய்யவிருக்கும் செயலை இச்சூழலில் குறிக்கிறது; எதிர்கால வினை தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τὰ αὐτά
  choice: இதே காரியங்களை
  rationale: குழுவின் கடிதத்தில் உள்ள அதே செய்திப் பொருள்களைக் குறிக்கிறது; ‘செய்தி’ என்று ஒருமைப்படுத்தாமல் மூலத்தின் பன்மைப் பொருளைத் தக்கவைக்கிறது.
