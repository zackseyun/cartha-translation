  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: ta
  text: பவுலுக்கும் பர்னபாவுக்கும் அவர்களுக்கும் இடையே சிறிதல்லாத[a] கருத்து மோதலும் விவாதமும் ஏற்பட்டபோது, இந்த விவகாரம்[b] குறித்து எருசலேமிலுள்ள அப்போஸ்தலர்களிடமும் மூப்பர்களிடமும் மேலே செல்லும்படி[c] பவுலையும் பர்னபாவையும், அவர்களுள் வேறு சிலரையும் அவர்கள் நியமித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறியதல்லாத’ என்றும் மொழிபெயர்க்கலாம். சர்ச்சையின் தீவிரத்தை வலியுறுத்துவதற்காகக் கிரேக்கம் ‘சிறிதல்லாத’ என்ற குறைத்துரைத்தல் நடையைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இந்தக் காரியம் குறித்து’ அல்லது ‘இந்தக் கேள்வி குறித்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எருசலேமுக்குப் பயணம் செய்வதை கிரேக்கத்தில் வழக்கமாக ‘மேலே போதல்’ என்று குறிப்பிடுவர்.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης δὲ
  choice: ஏற்பட்டபோது
  rationale: முதன்மைச் செயலுக்கான காலச் சூழலைக் காட்டும் genitive absolute அமைப்பை இயல்பான தமிழில் தருகிறது; δέ-யின் தொடர்ச்சி இங்கு வாக்கிய ஓட்டத்தால் வெளிப்படுகிறது.
- source_word: στάσεως
  choice: கருத்து மோதல்
  rationale: வெறும் கருத்து வேறுபாட்டைவிடக் கடுமையான எதிர்ப்பை உணர்த்துகிறது; ஆனால் வன்முறை அல்லது கலகம் என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: ζητήσεως
  choice: விவாதம்
  rationale: στάσις என்பதுடன் இணைந்து வரும் வாய்மொழிச் சர்ச்சையைத் தெளிவாகக் காட்டுகிறது.
- source_word: οὐκ ὀλίγης
  choice: சிறிதல்லாத
  rationale: அளவைக் குறைத்து உரைத்து வலியுறுத்தும் கிரேக்க litotes நடையைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: பவுலுக்கும் பர்னபாவுக்கும் அவர்களுக்கும் இடையே
  rationale: சர்ச்சையில் ஈடுபட்ட இரு தரப்புகளையும் இயல்பான தமிழில் காட்டுகிறது. ‘அவர்கள்’ என்பது முந்தைய வசனத்தில் யூதேயாவிலிருந்து வந்தவர்களைக் குறிக்கிறது.
- source_word: ἔταξαν
  choice: நியமித்தார்கள்
  rationale: பயணத்துக்கான பிரதிநிதிகள் சமூகத்தால் தேர்ந்தெடுக்கப்பட்ட ஒழுங்கான நடவடிக்கையை உணர்த்துகிறது; வெறும் தனிப்பட்ட முடிவாகக் குறுக்குவதில்லை.
- source_word: ἀναβαίνειν
  choice: மேலே போகும்படி
  rationale: எருசலேமுக்குச் செல்வதை ‘மேலே போதல்’ என்று குறிப்பிடும் கிரேக்கப் புவியியல் மற்றும் வழக்குமொழிப் பயன்பாட்டைப் பாதுகாக்கிறது.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: தங்களில் வேறு சிலரையும்
  rationale: உள்ளூர் குழுவிலிருந்து மேலும் சில பிரதிநிதிகள் தேர்ந்தெடுக்கப்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: அப்போஸ்தலர்களிடமும் மூப்பர்களிடமும்
  rationale: அப்போஸ்தலர் என்பது அப்போஸ்தலர் நடபடிகளில் நிலைபெற்ற பட்டப்பெயர்; மூப்பர்கள் என்பது அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கும் நேரான மொழிபெயர்ப்பு.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: இந்த விவகாரம் குறித்து
  rationale: விவாதத்திற்குள்ளான குறிப்பிட்ட காரியத்தை நவீன, தெளிவான தமிழில் காட்டுகிறது; ‘கேள்வி’ அல்லது ‘பிரச்சினை’ என்று பொருளைச் சுருக்கவில்லை.
theological_decisions:
- issue: சர்ச்சையில் ஈடுபட்ட தரப்புகளின் அடையாளம்
  choice: பவுலும் பர்னபாவும் ‘அவர்களும்’ இரு தரப்புகளாகக் காட்டப்பட்டுள்ளனர்; ‘அவர்கள்’ முந்தைய வசனத்தில் யூதேயாவிலிருந்து வந்தவர்களைக் குறிக்கிறது.
  alternative: ‘பவுலும் பர்னபாவும் அவர்களோடு கடுமையாக விவாதித்தார்கள்’ என்று வினைமையமாக மொழிபெயர்க்கலாம்.
  rationale: இது முதன்மையாகத் தொடரியல் சார்ந்த முடிவு. உடனடி கதைச் சூழலிலுள்ள சுட்டுதலை மட்டும் பிரதிபலித்து, எந்தப் பிரிவுசார் கோட்பாட்டு முடிவையும் சேர்க்கவில்லை.
- issue: ἔταξαν என்பதிலுள்ள அமைப்புசார் நுணுக்கம்
  choice: ‘நியமித்தார்கள்’ என்று மொழிபெயர்த்து, பிரதிநிதிகள் சமூகமாகத் தேர்ந்தெடுக்கப்பட்டதை உணர்த்துகிறது.
  alternative: ‘முடிவு செய்தார்கள்’ அல்லது ‘ஏற்பாடு செய்தார்கள்’.
  rationale: சர்ச்சைக்கு ஒழுங்கான சமூகப் பதில் அளிக்கப்பட்டதை உரை காட்டுகிறது; அதேவேளையில் கிரேக்கம் கூறுவதைத் தாண்டி குறிப்பிட்ட திருச்சபை ஆட்சிமுறையை மொழிபெயர்ப்பு நிறுவுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ஒரே வாக்கிய அமைப்பு காக்கப்பட்டுள்ளது; ‘சிறிதல்லாத’ மற்றும் ‘மேலே போக’ ஆகிய மூலநடை அம்சங்கள் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
