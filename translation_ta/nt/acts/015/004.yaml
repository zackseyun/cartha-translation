source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: ta
  text: அவர்கள் எருசலேமுக்கு வந்து சேர்ந்தபோது, திருச்சபையும் அப்போஸ்தலர்களும் மூப்பர்களும் அவர்களை வரவேற்றனர். கடவுள் அவர்களோடு செய்த அனைத்தையும் அவர்கள் எடுத்துரைத்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் அவர்கள் மூலமாகச் செய்த அனைத்தையும்” அல்லது “கடவுள் அவர்கள் நடுவில் செய்த அனைத்தையும்.” கிரேக்கத்தில் நேரடியாக “அவர்களோடு” என்று உள்ளது.
    reason: μετ’ αὐτῶν என்பதன் திறந்த பொருளையும் சாத்தியமான கருவி மற்றும் இடநிலை வாசிப்புகளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: அவர்கள் எருசலேமுக்கு வந்து சேர்ந்தபோது
  rationale: இறந்தகால வினையெச்சத்தின் காலச் சூழலை இயல்பான தமிழில் காட்டுகிறது; εἰς என்பதிலுள்ள இலக்கை நோக்கிய இயக்கத்தையும் ‘எருசலேமுக்கு’ தக்கவைக்கிறது. δέ-யின் மென்மையான இணைப்புப் பணி தனிச் சொல்லாக மொழிபெயர்க்கப்படாமல் வாக்கிய அமைப்பில் உட்பொதிக்கப்பட்டுள்ளது.
- source_word: παρεδέχθησαν ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: திருச்சபையினரும் அப்போஸ்தலர்களும் மூப்பர்களும் அவர்களை வரவேற்றார்கள்
  rationale: கிரேக்கத்தின் செயப்பாட்டு அமைப்பை இயல்பான தமிழ் செய்வினை அமைப்பாக மாற்றினாலும், வரவேற்ற குழுக்கள் அனைத்தும் தெளிவாகத் தக்கவைக்கப்படுகின்றன. παραδέχομαι இச்சூழலில் அன்புடன் ஏற்றுக்கொள்வதைச் சுட்டுவதால் ‘வரவேற்றார்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐκκλησίας
  choice: திருச்சபையினர்
  rationale: இங்கு கட்டிடத்தை அல்ல, எருசலேமிலுள்ள கிறிஸ்தவ நம்பிக்கையாளர் சமூகத்தைச் சுட்டுகிறது; மனிதர்களைக் குறிக்கும் வாக்கியச் சூழலுக்கேற்ப ‘திருச்சபையினர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀποστόλων
  choice: அப்போஸ்தலர்கள்
  rationale: இயேசுவால் அனுப்பப்பட்ட அங்கீகரிக்கப்பட்ட சாட்சிகளைச் சுட்டும் பரவலாக அறியப்பட்ட தமிழ் சொல்.
- source_word: πρεσβυτέρων
  choice: மூப்பர்கள்
  rationale: வயதில் மூத்த ஆண்களை மட்டும் அல்லாமல், திருச்சபையில் அங்கீகரிக்கப்பட்ட தலைவர்களை இங்கு குறிக்கிறது; குறிப்பிட்ட ஒரு திருச்சபை மரபின் பதவிப்பெயரைத் திணிக்காமல் அந்தப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἀνήγγειλάν τε
  choice: அவர்கள் எடுத்துரைத்தார்கள்
  rationale: நடந்தவற்றை விரிவாகத் தெரிவிக்கும் அறிக்கையின் தன்மையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது; τε-யின் இணைப்புப் பணி புதிய வாக்கியத்தின் தொடர்ச்சியால் உணர்த்தப்படுகிறது.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: கடவுள் செய்த அனைத்தையும்
  rationale: ὅσα-வின் முழுமையையும், செயலில் கடவுளே முதன்மை எழுவாய் என்பதையும் தக்கவைக்கிறது.
- source_word: μετ’ αὐτῶν
  choice: தங்களோடு
  rationale: μετά + உரிமை வேற்றுமையின் அடிப்படைப் பொருளான ‘உடன்/ஓடு’ என்பதை நேரடியாகத் தக்கவைத்து, ‘அவர்கள் மூலமாக’ என்ற கருவிப் பொருளையோ ‘அவர்கள் நடுவில்’ என்ற இடப்பொருளையோ முதன்மை உரையில் திணிக்காமல் விடுகிறது.
theological_decisions:
- issue: μετ’ αὐτῶν என்ற தொடரில் கடவுளின் செயலுக்கும் பவுல், பர்னபாவின் பங்குக்கும் உள்ள உறவு
  choice: கடவுள் தங்களோடு செய்த அனைத்தையும்
  alternative: கடவுள் அவர்கள் மூலமாகச் செய்த அனைத்தையும் / கடவுள் அவர்கள் நடுவில் செய்த அனைத்தையும்
  rationale: மூலமொழி கடவுளை முதன்மைச் செய்பவராகக் காட்டி, தூதர்களை அவருடைய செயலுடன் தொடர்புபடுத்துகிறது; அந்தத் தொடர்பு கருவியாகவா அல்லது செயல்நிகழ்ந்த வட்டாரமாகவா என்பதைத் திட்டவட்டமாக முடிவுசெய்யவில்லை. ‘தங்களோடு’ அந்த இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘திருச்சபையினர்’, ‘அப்போஸ்தலர்கள்’, ‘மூப்பர்கள்’ ஆகியவை சூழலுக்குரிய சமூக மற்றும் தலைமைப் பொருளைத் தெளிவாக வழங்குகின்றன. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கருத்துத் தொடர்பு காக்கப்பட்டுள்ளது.
