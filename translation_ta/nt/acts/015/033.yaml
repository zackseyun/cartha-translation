source:
  edition: SBLGNT
  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: ta
  text: அவர்கள் அங்கே[a] சில காலம் தங்கியபின், சகோதரர்கள்[b] அவர்களைச் சமாதானத்தோடு தங்களை அனுப்பியவர்களிடம் அனுப்பிவைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அங்கே’ என்பது கிரேக்க மூலத்தில் வெளிப்படையாக இல்லை; அவர்கள் அந்தியோகியாவில் தங்கியிருந்ததைச் சூழல் காட்டுகிறது.
    reason: supplied_for_clarity
  - marker: b
    text: அல்லது, ‘சகோதர சகோதரிகள்.’ கிரேக்கத்தில் ‘சகோதரர்கள்’ என்று உள்ளது; இச்சூழலில் அது விசுவாசிகளின் சமூகத்தை உள்ளடக்கமாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: அங்கே சில காலம் தங்கியபின்
  rationale: இந்தக் கிரேக்க மரபுத்தொடர் ஒரு காலப்பகுதியைச் செலவிடுதல் அல்லது தங்கியிருத்தலைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க ‘சில காலம் தங்கியபின்’ என மொழிபெயர்க்கப்பட்டது. ‘அங்கே’ என்பது மூலத்தில் வெளிப்படையாக இல்லை; அந்தியோகியாவில் அவர்கள் தங்கியிருந்த சூழலிலிருந்து இயல்புக்காகச் சேர்க்கப்பட்டது.
- source_word: δὲ
  choice: வாக்கியத் தொடர்ச்சியால் வெளிப்படுத்தப்பட்டது
  rationale: இது கதையை முன்னெடுக்கும் மென்மையான இணைப்புச்சொல். தமிழில் தனியாக ‘மேலும்’ அல்லது ‘பின்பு’ என்று சேர்ப்பதைவிட, ‘தங்கியபின்’ என்ற அமைப்பே தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπελύθησαν
  choice: வழியனுப்பி ... செல்லவிட்டார்கள்
  rationale: இங்கு கட்டுப்பாட்டிலிருந்து விடுவிப்பது அல்ல, தூதர்களைச் சமாதானமாகப் பிரியாவிடை கொடுத்து அனுப்புவதே பொருள். கிரேக்கச் செயல்பாட்டு அமைப்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் கூற இந்த வடிவம் பயன்படுத்தப்பட்டது.
- source_word: μετ’ εἰρήνης
  choice: அமைதியுடன்
  rationale: நல்லுறவும் சமாதானமும் நிலவும் விதத்தில் வழியனுப்பப்பட்டதை இச்சொல் காட்டுகிறது. மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கும் இயல்பான தமிழ் இணை இது.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: சகோதரர்கள்
  rationale: கிரேக்கத்தில் ஆண்பால் பன்மையான ‘சகோதரர்கள்’ என்ற வடிவமே உள்ளது. இந்தச் சூழலில் அது விசுவாசிகளின் சமூகத்தை உள்ளடக்கமாகக் குறிக்க வாய்ப்புள்ளதால், மூல வடிவம் முதன்மை உரையில் வைக்கப்பட்டு அதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: தங்களை அனுப்பியவர்களிடம்
  rationale: இது அவர்களை முன்னதாக அனுப்பியவர்களைக் குறிக்கிறது. ‘திரும்ப’ என்பது சூழலில் பொருந்தினாலும் கிரேக்கத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ἀδελφοί என்பதன் உள்ளடக்கப் பொருள்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; விசுவாசிகள்
  rationale: கிரேக்க வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், அப்போஸ்தலர் பணிகளில் இது விசுவாசக் குழுவை உள்ளடக்கமாகக் குறிக்கலாம். மூலத்தின் இலக்கண வடிவம் முதன்மை உரையில் காக்கப்பட்டு, சாத்தியமான உள்ளடக்கப் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அமைதியுடன் வழியனுப்பி’ என்பது சமூகத்தின் நல்லுறவான பிரியாவிடையை இயல்பாக வெளிப்படுத்துகிறது.
