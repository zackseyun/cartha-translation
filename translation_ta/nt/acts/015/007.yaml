source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: ta
  text: மிகுந்த விவாதம் நடந்தபின், பேதுரு எழுந்து அவர்களிடம், “சகோதரர்களே[a], முன்னைய நாட்களிலிருந்தே[b] உங்களிடையே தேவன் என்னைத் தேர்ந்தெடுத்தார் என்பதை நீங்கள் அறிவீர்கள்; என் வாயின் மூலம் யூதரல்லாத மக்கள்[c] நற்செய்தியின் செய்தியைக் கேட்டு விசுவாசிப்பதற்காகவே அவர் அப்படிச் செய்தார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஆண்களே, சகோதரர்களே.” இது கிரேக்கத்தில் ஆண்பால் பன்மை அழைப்பு; அக்கால வழக்கில் பிரதிநிதித்துவமான பொதுக் கூட்டத்தையும் இவ்வாறு அழைத்திருக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது “பழைய நாட்களிலிருந்தே.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது “தேசங்கள்.” இச்சூழலில் இது யூதரல்லாத மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: நீண்ட விவாதம் நடந்தபின்
  rationale: முன்னதாக நிகழ்ந்த சூழலைக் குறிக்கும் genitive absolute அமைப்பையும், சபைக் கூட்டத்தில் நடந்த தீவிர ஆலோசனை மற்றும் கருத்து வேறுபாட்டையும் இயல்பான தமிழில் தெரிவிக்கிறது; பகைமையை மிகைப்படுத்தவில்லை.
- source_word: ἀναστὰς
  choice: எழுந்து
  rationale: பேசுவதற்கு முன் பேதுரு செய்த செயலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: Ἄνδρες ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை அழைப்பின் குடும்ப உறவு நயத்தைப் பாதுகாக்கிறது. கிரேக்கத்தின் இருசொல் வடிவத்தை அப்படியே மரத்தனமாக்காமல், தமிழில் வழக்கமான மரியாதை அழைப்பாக வழங்குகிறது.
- source_word: ἐπίστασθε
  choice: நீங்கள் அறிவீர்கள்
  rationale: கேட்போர் ஏற்கெனவே அறிந்திருந்த உண்மை அல்லது விழிப்புணர்வை நேரடியாகக் குறிக்கிறது.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: தொடக்க நாட்களிலிருந்தே
  rationale: சூழலில் மிகப் பழங்காலத்தை அல்ல, சபையின் ஆரம்ப காலத்தில் நடந்த முந்தைய நிகழ்வைச் சுட்டுவது இயல்பாக வெளிப்படுகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεὸς
  choice: உங்களிடையே தேவன் என்னைத் தேர்ந்தெடுத்தார்
  rationale: ἐν ὑμῖν என்பதன் ‘உங்களிடையே’ என்ற உணர்வையும், அடுத்துள்ள ‘என் வாயின் மூலம்’ என்பதால் மறைமுகமாகத் தெளிவாகும் பேதுருவைத் தேர்ந்தெடுத்தார் என்ற பொருளையும் தமிழில் இலக்கணத் தெளிவுடன் வழங்குகிறது.
- source_word: διὰ τοῦ στόματός μου
  choice: என் வாயின் மூலம்
  rationale: பேதுருவை அறிவிப்புக் கருவியாகக் காட்டும் மூலமொழியின் உயிரோட்டமான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: τὰ ἔθνη
  choice: யூதரல்லாத மக்கள்
  rationale: எருசலேம் ஆலோசனைக் கூட்டத்தின் சூழலில் யூதர் அல்லாத மக்களையே குறிக்கிறது. ‘புறஜாதியார்’ என்பதைவிட இது இன்றைய சாதாரண வாசகருக்கு உடனடியாகப் புரியும்.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: நற்செய்தியின் செய்தி
  rationale: λόγος இங்கு அறிவிக்கப்படும் செய்தியைக் குறிக்கிறது; εὐαγγέλιον என்பதன் ‘நற்செய்தி’ பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἀκοῦσαι ... καὶ πιστεῦσαι
  choice: கேட்டுச் விசுவாசிக்கும்படி
  rationale: இணையான இரண்டு infinitive வினைகளையும் அவற்றின் நோக்கம்/விளைவு உறவையும் சுருக்கமாகப் பாதுகாக்கிறது; ‘விசுவாசிக்க’ என்பது வேதாகமத் தமிழில் புரிந்துகொள்ளக்கூடிய தற்போதைய பயன்பாடு.
theological_decisions:
- issue: Ἄνδρες ἀδελφοί என்ற பாலினக் குறியீடுள்ள அழைப்பு
  choice: சகோதரர்களே
  alternative: ஆண்களே, சகோதரர்களே / சகோதர சகோதரிகளே
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தையும் குடும்ப உறவு நயத்தையும் பிரதான உரையில் காக்கிறது. வெளிப்படையாக இல்லாத பெண்பால் சொல்லைச் சேர்க்காமல், வழக்காற்றின் பிரதிநிதித்துவப் பயன்பாட்டை அடிக்குறிப்பில் விளக்குகிறது.
- issue: τὰ ἔθνη என்பதன் இரட்சிப்பு வரலாற்றுச் சூழல்
  choice: யூதரல்லாத மக்கள்
  alternative: தேசங்கள் / புறஜாதியார்
  rationale: இந்த அதிகாரத்தின் உடனடி விவாதம் யூதரல்லாத விசுவாசிகளைப் பற்றியது. ஆகவே பரந்த ‘தேசங்கள்’ என்ற பொருளைவிடச் சூழல் சார்ந்த மக்களைக் தெளிவாகக் குறிக்கிறது; பரந்த சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐν ὑμῖν ἐξελέξατο ὁ θεός அமைப்பின் சார்பு
  choice: தேவன் உங்களிடையே என்னைத் தேர்ந்தெடுத்தார்
  alternative: தேவன் உங்களிடையே தேர்ந்தெடுத்தார்
  rationale: ‘என் வாயின் மூலம்’ என்ற தொடரால் தேர்ந்தெடுக்கப்பட்டவர் பேதுரு என்பது தெளிவாகிறது. தமிழில் பொருள் மங்காதிருக்க ‘என்னை’ வெளிப்படுத்தப்படுகிறது; ‘உங்களிடையே’ என்ற சொற்றொடரின் உண்மையான அமைப்பும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடையைப் பயன்படுத்தியுள்ளது. ‘தேவன்,’ ‘நற்செய்தி,’ ‘விசுவாசிக்க’ போன்ற பரவலாக அறியப்படும் வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; தேவையற்ற பழந்தமிழ் மற்றும் சமயப் பிரிவு சார்ந்த சொற்பயன்பாடு தவிர்க்கப்பட்டுள்ளது. மூலத்தின் நீண்ட வாக்கிய ஓட்டம் தமிழில் தெளிவாக இருக்க அரைப்புள்ளி மற்றும் விளக்கத் தொடரால் அமைக்கப்பட்டுள்ளது.
