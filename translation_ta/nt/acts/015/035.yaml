  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: ta
  text: ஆனால் பவுலும் பர்னபாவும் அந்தியோகியாவில் தங்கியிருந்தார்கள்[a]. வேறு பலருடன் சேர்ந்து ஆண்டவருடைய வார்த்தையை[c] போதித்தும், அதை நற்செய்தியாக அறிவித்தும்[b] வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தியோகியாவில் சில காலம் இருந்தார்கள்.’ கிரேக்க வினை அங்கே ஒரு காலப்பகுதி தங்கியிருந்ததை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நற்செய்தியைப் பிரசங்கித்தும்.’ கிரேக்க வினை நல்ல செய்தியை அறிவித்தல் அல்லது பிரகடனம் செய்தல் என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: c
    text: ‘ஆண்டவருடைய வார்த்தை’ என்பது அப்போஸ்தலர் நூலில் ஆண்டவருடைய செய்தியைக் குறிக்க வழக்கமாகப் பயன்படும் சொற்றொடர்; ‘ஆண்டவருடைய செய்தி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: தங்கியிருந்து
  rationale: இந்த இறந்தகாலத் தொடர்வினை அவர்கள் அந்தியோகியாவில் ஒரு காலப்பகுதி தொடர்ந்து தங்கியிருந்ததைக் குறிக்கிறது. ‘தங்கியிருந்து’ என்பது இயல்பான தமிழில் அந்த நீடித்த நிலையையும் தொடர்ந்து நடைபெற்ற செயல்களையும் வெளிப்படுத்துகிறது.
- source_word: διδάσκοντες
  choice: போதித்தும்
  rationale: அவர்கள் தங்கியிருந்தபோது தொடர்ந்து செய்த போதிக்கும் செயலை வினையெச்ச வடிவில் இயல்பாகக் காட்டுகிறது.
- source_word: εὐαγγελιζόμενοι
  choice: நற்செய்தியாக அறிவித்தும்
  rationale: இவ்வினை நல்ல செய்தியை அறிவிப்பதைக் குறிக்கிறது. இங்கு τὸν λόγον τοῦ κυρίου என்பதே போதித்தல், நற்செய்தியாக அறிவித்தல் ஆகிய இரண்டிற்கும் பொருளாக இருப்பதை இந்தச் சொற்றொடர் காக்கிறது.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: வேறு பலரோடுகூட
  rationale: பவுலும் பர்னபாவும் மட்டுமல்லாமல் வேறு பலரும் இப்பணியில் உடனிருந்தனர் என்ற சேர்க்கைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: λόγον
  choice: வார்த்தையை
  rationale: λόγος என்பதற்கு ‘செய்தி’ என்றும் பொருள் கொள்ளலாம்; ஆனால் அப்போஸ்தலர் நூலில் வழக்கமாகத் தோன்றும் ‘ஆண்டவருடைய வார்த்தை’ என்ற இலக்கிய மற்றும் இறையியல் தொடர்ச்சியைப் பேண ‘வார்த்தை’ பயன்படுத்தப்படுகிறது.
- source_word: κυρίου
  choice: ஆண்டவருடைய
  rationale: κύριος என்ற பட்டப்பெயர் குறிப்பிட்ட நபரை மொழிபெயர்ப்பிலேயே மேலதிகமாக நிர்ணயிக்காமல் ‘ஆண்டவர்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: ‘ஆண்டவருடைய வார்த்தை’ என்பதில் ‘ஆண்டவர்’ யாரைக் குறிக்கிறார் என்பது
  choice: கிரேக்கத்தில் உள்ளபடியே ‘ஆண்டவர்’ என்று பொதுநிலையில் வைக்கப்பட்டது.
  alternative: ‘ஆண்டவராகிய இயேசுவின் வார்த்தை’ அல்லது பரந்த பொருளில் கடவுளிடமிருந்து வந்த செய்தி
  rationale: அப்போஸ்தலர் நூலில் ‘ஆண்டவர்’ என்பது சிறப்பாக இயேசுவைக் குறிக்கக்கூடும்; என்றாலும் இவ்வசனத்தின் κύριος என்ற பட்டப்பெயர் மட்டுமே உள்ளதால் மொழிபெயர்ப்பு அதன் சாத்தியமான பொருளை மிகுதியாகக் குறிப்பாக்கவில்லை.
- issue: εὐαγγελιζόμενοι மற்றும் λόγον ஆகியவற்றின் தொடர்பு
  choice: ஆண்டவருடைய வார்த்தையை ‘நற்செய்தியாக அறிவித்தார்கள்’ என்று வழங்கப்பட்டது.
  alternative: ‘நற்செய்தியை அறிவித்தார்கள்’ என்று தனியான பொருளை அமைத்தல்
  rationale: கிரேக்க வாக்கியத்தில் ‘ஆண்டவருடைய வார்த்தை’ என்பது போதித்தல் மற்றும் நற்செய்தி அறிவித்தல் ஆகிய இரண்டோடும் இயல்பாகத் தொடர்புபடுகிறது; ஆகவே ஒரே பொருளை இரு செயல்களுக்கும் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘போதித்தும் … அறிவித்தும் வந்தார்கள்’ என்பது மூலத்தின் தொடர்ச்சியான செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; ‘வேறு பலரோடுகூட’ என்பது καί-இன் சேர்க்கைப் பொருளைக் காக்கிறது.
