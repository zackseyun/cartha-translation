revisions:
- from: ஆனால் பவுலும் பர்னபாவும் அந்தியோகியாவில் தங்கியிருந்து[a], வேறு பலரோடுகூட ஆண்டவருடைய வார்த்தையைப் போதித்தும் நற்செய்தியாக அறிவித்தும் வந்தார்கள்[b][c].
  to: ஆனால் பவுலும் பர்னபாவும் அந்தியோகியாவில் தங்கியிருந்தார்கள்[a]. வேறு பலருடன் சேர்ந்து ஆண்டவருடைய வார்த்தையை[c] போதித்தும், அதை நற்செய்தியாக அறிவித்தும்[b] வந்தார்கள்.
  rationale: The revision preserves every element of the SBLGNT text while improving modern Tamil idiom and syntactic clarity. The two clauses naturally express the imperfect duration of their stay and the accompanying ongoing ministry. ‘அதை’ clarifies, rather than narrows, that the Lord’s word is the content associated with both teaching and good-news proclamation. The referent of ‘ஆண்டவர்’ remains unspecified, as in the Greek.
