source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: ta
  text: ஆனால் பரிசேயர் பிரிவைச் சேர்ந்தவர்களில்[a] நம்பிக்கை கொண்டிருந்த சிலர் எழுந்து, “அவர்களுக்கு விருத்தசேதனம் செய்யவும், மோசேயின் சட்டத்தைக் கடைப்பிடிக்கும்படி அவர்களுக்குக் கட்டளையிடவும் அவசியம்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரிசேயர் பிரிவு” என்பதை “பரிசேயரின் மதப்பிரிவு” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொல் அங்கீகரிக்கப்பட்ட ஒரு குழுவையோ சிந்தனைப் பள்ளியையோ குறிக்கிறது; பிற்காலத் தொழில்நுட்பப் பொருளில் ‘தவறான மதக்கொள்கை’ என்று அவசியம் பொருள்படாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: எழுந்து நின்று
  rationale: சபையில் பேசுவதற்காக எழுந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது; வெறுமனே எதிர்த்துநின்றார்கள் என்ற கூடுதல் பொருளைத் திணிக்கவில்லை.
- source_word: τινες
  choice: சிலர்
  rationale: பாலினத்தைக் கூடுதலாகக் குறிப்பிடாமல் கிரேக்கப் பன்மைச் சுட்டுப்பெயரின் உறுதியற்ற தன்மையைப் பாதுகாக்கிறது.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: பரிசேயர் பிரிவைச் சேர்ந்தவர்களில்
  rationale: αἵρεσις இங்கு அங்கீகரிக்கப்பட்ட ஒரு குழு அல்லது சிந்தனைப் பிரிவைக் குறிக்கிறது; பிற்காலத் தொழில்நுட்பப் பொருளான ‘மதப்புரட்டு’ என்பதைத் தவிர்க்கிறது.
- source_word: πεπιστευκότες
  choice: நம்பிக்கை கொண்டிருந்த
  rationale: முன்பு நம்பிக்கை கொண்டு அதன் நிலையில் தொடர்ந்ததைச் சுட்டும் நிறைவேற்றுப் பங்கேற்புவினையின் கால-நிலை நுணுக்கத்தையும், அவர்கள் முன்வைத்த கோரிக்கையுடனான இறையியல் இழுபறியையும் பாதுகாக்கிறது.
- source_word: λέγοντες
  choice: என்று சொன்னார்கள்
  rationale: அவர்களின் பேச்சை நடுநிலையாக அறிமுகப்படுத்துகிறது; ‘வற்புறுத்தினார்கள்’ போன்ற கூடுதல் தொனியைச் சேர்க்கவில்லை.
- source_word: δεῖ
  choice: அவசியம்
  rationale: அவசியத்தைக் குறிக்கும் ஆளற்ற வினையின் வலிமையைத் தெளிவாகத் தருகிறது; அந்த அவசியத்தின் ஆதாரம் என்ன என்பதை மூலத்தைப் போலவே வெளிப்படையாகக் கூறாமல் விடுகிறது.
- source_word: περιτέμνειν αὐτούς
  choice: அவர்களுக்கு விருத்தசேதனம் செய்வதும்
  rationale: நேரடியாகச் செய்யப்படும் செயலைத் தெளிவாகக் காட்டி, மூலத்தின் செயப்பாட்டு அமைப்பை இயன்றவரைத் தக்கவைக்கிறது.
- source_word: παραγγέλλειν
  choice: கட்டளையிடுவதும்
  rationale: அதிகாரபூர்வமான கோரிக்கையின் வலிமையைப் பாதுகாக்கிறது; ‘அறிவுறுத்துதல்’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: τε τηρεῖν
  choice: கடைப்பிடிக்கும்படி
  rationale: சட்டத்தைத் தொடர்ந்து அனுசரித்தல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τὸν νόμον Μωϋσέως
  choice: மோசேயின் சட்டத்தை
  rationale: உடைமை வேற்றுமை அமைப்பை நேரடியாகவும் வாசகருக்கு எளிதாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யூதக் குழுவைக் குறிக்கும் αἵρεσις என்பதன் மொழிபெயர்ப்பு
  choice: பிரிவு
  alternative: மதப்பிரிவு
  rationale: இங்கு பரிசேயர்களை யூத மதத்திற்குள் இருந்த அடையாளம் பெற்ற குழுவாகக் குறிக்கிறது; பிற்கால ‘மதப்புரட்டு’ அல்லது கோட்பாட்டுத் தவறு என்ற பொருளை இறக்குமதி செய்யவில்லை.
- issue: πεπιστευκότες என்பதன் வினை வலிமை
  choice: நம்பிக்கை கொண்டிருந்த
  alternative: விசுவாசிகளாயிருந்த
  rationale: இவர்கள் உண்மையில் நம்பிக்கை கொண்டதாக வசனம் கூறுவதையும், அதேவேளை பிற இனத்தவருக்கு விருத்தசேதனத்தையும் சட்டக் கடைப்பிடிப்பையும் கோரியதையும் உள்ளபடியே வைத்திருக்கிறது; அவர்களின் நிலையை மொழிபெயர்ப்பாளர் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ மற்றும் ‘மோசேயின் சட்டம்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தெளிவுக்காகத் தக்கவைக்கப்பட்டுள்ளன; வாக்கியத்தின் நேரடி உரை இயல்பாக அமைக்கப்பட்டுள்ளது.
