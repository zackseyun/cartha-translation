source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: ta
  text: அப்போது அப்போஸ்தலர்களும் மூப்பர்களும் முழுத் திருச்சபையோடும் சேர்ந்து, தங்களுள் இருந்து ஆண்களைத் தேர்ந்தெடுத்து பவுலுடனும் பர்னபாவுடனும் அந்தியோகியாவுக்கு அனுப்புவது நல்லது என்று கருதினர். அவர்கள் பர்சபா என்று அழைக்கப்பட்ட யூதாவையும் சீலாவையும் அனுப்பத் தேர்ந்தெடுத்தனர்; இவர்கள் சகோதரர்கள் நடுவே தலைமை வகித்தவர்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதரர்கள் நடுவே தலைவர்களாக இருந்த ஆண்கள்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “சகோதரர்கள்” என்பது பெண்களையும் உள்ளடக்கிய விசுவாசிகள் சமூகத்தை விரிவாகக் குறிக்க வாய்ப்புள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: நல்லது என்று கருதினார்கள்
  rationale: கூட்டு ஆலோசனையின் முடிவைச் சுட்டும் δοκέω என்பதன் இயல்பான பொருளைத் தருகிறது; இதை ஒரு முறையான ஆணையாக மிகைப்படுத்தவில்லை.
- source_word: πρεσβυτέροις
  choice: மூப்பர்களும்
  rationale: ஆரம்பத் திருச்சபைத் தலைமைச் சூழலில் இயல்பாகவும் பரவலாகவும் புரிந்துகொள்ளப்படும் சொல்.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: திருச்சபை முழுவதோடும் சேர்ந்து
  rationale: முழுச் சமூகமும் இந்தத் தீர்மானத்தில் உடனிருந்ததையும் பங்கேற்றதையும் σύν தெளிவாகக் காட்டுவதால் அதைப் பாதுகாக்கிறது.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: தங்கள் நடுவிலிருந்து ஆட்களைத் தேர்ந்தெடுத்து
  rationale: தூதர்கள் எருசலேம் விசுவாசிகளின் சொந்தக் குழுவிலிருந்து தேர்ந்தெடுக்கப்பட்டார்கள் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; ἄνδρας-இன் ஆண்பால் குறிப்பு தொடர்ந்த வாக்கியத்தில் வெளிப்படையாக உள்ளது.
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: அந்தியோகியாவுக்கு அனுப்புவது
  rationale: அனுப்பும் நடவடிக்கையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: σὺν τῷ Παύλῳ καὶ Βαρναβᾷ
  choice: பவுலோடும் பர்னபாவோடும்
  rationale: σύν குறிக்கும் உடன்செல்லுதலைத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἰούδαν τὸν καλούμενον Βαρσαββᾶν
  choice: பர்சபா என்று அழைக்கப்பட்ட யூதாவை
  rationale: கூடுதல் பெயரால் அறியப்பட்டவர் என்ற விளக்கப் பங்கேற்புச் சொல்லின் பொருளைப் பாதுகாக்கிறது.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: சகோதரர்கள் நடுவே தலைமை வகித்த ஆண்கள்
  rationale: ἡγουμένους குறிக்கும் அங்கீகரிக்கப்பட்ட தலைமைப் பங்கைத் தருகிறது; அதை ஒரு குறிப்பிட்ட பதவிப் பெயராக மாற்றவில்லை. ἄνδρας என்பதன் ஆண்பால் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: ἀδελφοῖς
  choice: சகோதரர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மையைப் பாதுகாக்கிறது; இச்சொல் விரிவான விசுவாசிகள் சமூகத்தைக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: தீர்மானத்தில் திருச்சபை முழுவதின் பங்கேற்பு
  choice: அப்போஸ்தலர்களும் மூப்பர்களும் திருச்சபை முழுவதோடும் சேர்ந்து இதை நல்லது என்று கருதினார்கள்
  alternative: அப்போஸ்தலர்களும் மூப்பர்களும் மட்டுமே முடிவெடுத்தார்கள்; திருச்சபை வெறுமனே உடனிருந்தது
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ என்ற சொற்றொடர் முழுத் திருச்சபையையும் ἔδοξε எனும் கூட்டு மதிப்பீட்டோடு இயல்பாக இணைக்கிறது; அதற்கு அப்பால் எந்தத் திருச்சபை ஆட்சிமுறையையும் மொழிபெயர்ப்பு திணிக்கவில்லை.
- issue: ἀδελφοῖς என்பதன் பாலினமும் சமூகப் பரப்பும்
  choice: முதன்மை உரையில் ‘சகோதரர்கள்’; விரிவான சமூகப் பொருள் அடிக்குறிப்பில்
  alternative: ‘சகோதர சகோதரிகள்’ அல்லது ‘விசுவாசிகள்’
  rationale: கிரேக்கம் இலக்கண ரீதியாக ஆண்பால் பன்மை; ஆரம்பக் கிறிஸ்தவப் பயன்பாட்டில் இது பெண்களையும் உள்ளடக்கிய விசுவாசிகள் சமூகத்தைச் சுட்டக்கூடும். இரு அம்சங்களும் உரை மற்றும் அடிக்குறிப்பு மூலம் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘திருச்சபை’, ‘மூப்பர்கள்’, ‘சகோதரர்கள்’ ஆகியவை தமிழ் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற சொற்கள்; எந்தத் தனிப்பட்ட சபை ஆட்சிமுறையும் திணிக்கப்படவில்லை.
