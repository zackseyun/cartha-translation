translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘இவன்’ என்ற சுட்டுப்பெயர் தனியாகக் கடுமையாக ஒலிக்காமல், வேற்றுமை உருபுடன் ‘இவனை’ என மூலத்தின் τοῦτον சுட்டுவலிமையைத் தக்கவைக்கிறது. அடிக்குறி முதன்மை உரையில் [a] எனக் குறிக்கப்பட்டுள்ளது.
