source:
  edition: SBLGNT
  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: ta
  text: ஆனால் பவுல், பம்பிலியாவிலிருந்து அவர்களை விட்டு விலகி, அந்தப் பணிக்குச் அவர்களுடன் செல்லாத இவனைத் தங்களோடு அழைத்துச் செல்லக் கூடாது என்று வலியுறுத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பம்பிலியாவிலிருந்து அவர்களைக் கைவிட்டுச் சென்ற இவனை.” கிரேக்க வினையெச்சம் வலுவான எதிர்மறைப் பொருளிலும் மொழிபெயர்க்கப்படலாம்; முதன்மை உரையில் குறைவாக விளக்கமளிக்கும் “விலகி” என உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: வலியுறுத்தினார்
  rationale: இங்கு முற்றுப்பெறாத கால வடிவம், கருத்து வேறுபாட்டின் சூழலில் பவுலின் உறுதியான நிலைப்பாட்டைக் காட்டுகிறது; வெறும் ‘நினைத்தார்’ என்பதைவிட ‘வலியுறுத்தினார்’ இயல்பாக அந்த வலிமையைத் தருகிறது.
- source_word: ἀποστάντα
  choice: விலகி
  rationale: ἀφίσταμαι என்பதன் அடிப்படைப் பொருளான விலகுதல் அல்லது பிரிதலைப் பாதுகாக்கிறது; முதன்மை உரையிலேயே ‘கைவிட்டுச் சென்றான்’ என்ற வலுவான எதிர்மறை நோக்கத்தைத் திணிப்பதில்லை.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: பம்பிலியாவில் தங்களைவிட்டு
  rationale: முதல் ἀπό அவர்களிடமிருந்து பிரிந்ததையும், இரண்டாவது ἀπό பம்பிலியாவைச் சார்ந்த அந்தப் பிரிவின் இடம் அல்லது புறப்படும் புள்ளியையும் குறிக்கிறது. தமிழில் ‘பம்பிலியாவில் தங்களைவிட்டு’ என்பது இயல்பாகவும் சம்பவச் சூழலுக்கு ஏற்றவாறும் உள்ளது; ‘பம்பிலியாவிலிருந்து’ என்ற மூலவடிவச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: தங்களுடன் செல்லாத
  rationale: பயண ஊழியச் சூழலில் συνέρχομαι என்பது உடன் செல்வதைக் குறிக்கிறது; சுருக்கமான இந்தத் தமிழ் வடிவம் அந்தத் தொடர்ந்துசெல்லாமையைத் தெளிவாகக் கூறுகிறது.
- source_word: εἰς τὸ ἔργον
  choice: அந்தப் பணிக்காக
  rationale: குறிப்பிட்ட ஊழியப் பணியைச் சுட்டும் பெயர்ச்சொல் தொகையை இயல்பான தமிழில் தருகிறது; ‘திருப்பணி’ அல்லது ‘மிஷன்’ போன்ற அதிக விளக்கமுள்ள சொற்களைத் தவிர்க்கிறது.
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: இவனைத் தங்களோடு அழைத்துச் செல்லக் கூடாது
  rationale: συμπαραλαμβάνω என்பதன் ‘தம்முடன் அழைத்துச் செல்லுதல்’ என்ற பொருளையும் τοῦτον என்பதன் சுட்டுவலிமையையும் பாதுகாக்கிறது; μή உடனான வினையெச்சத்தின் மறுப்பை இயல்பான தமிழ் சார்பு வாக்கியமாகத் தருகிறது.
