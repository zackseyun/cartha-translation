  yaml_path: translation/nt/acts/015/041.yaml
  text: And he went through Syria and Cilicia, strengthening the churches.
translation:
  language: ta
  text: அவர் சிரியா, சிலிசியா ஆகிய பகுதிகள் வழியாகச் சென்று, திருச்சபைகளை உறுதிப்படுத்தினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: பகுதிகள் வழியாகச் சென்று
  rationale: இறந்தகாலத் தொடர்நிலை வினை அந்தப் பகுதிகளினூடாக அவர் பயணம் செய்துகொண்டிருந்ததை உணர்த்துகிறது. தமிழில் இயல்பாக இருக்கவும், பல இடங்களைக் கடந்து சென்ற பொருளைக் காக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: δὲ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது. தமிழில் வசனத்தைத் தனியே வாசிக்கும்போது இயல்பாக இருக்க, அதன் பணியை வாக்கியத் தொடரமைப்பே ஏற்கிறது.
- source_word: Συρίαν
  choice: சிரியா
  rationale: இப்பகுதியின் நவீனத் தமிழில் வழக்கமான பெயர்.
- source_word: Κιλικίαν
  choice: சிலிசியா
  rationale: கிரேக்கப் பகுதி பெயருக்கான தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: ἐπιστηρίζων
  choice: உறுதிப்படுத்தினார்
  rationale: பயணத்துடன் நிகழ்ந்த செயலைக் குறிக்கும் இப்பங்கேற்பு வினை, விசுவாசக் குழுக்களை நிலைப்படுத்தி வலுப்படுத்தியதைக் கூறுகிறது. ‘உறுதிப்படுத்தினார்’ என்பது உணர்ச்சிசார் ஊக்கத்துக்கு மட்டும் பொருளைக் குறுக்காமல் இதைக் காக்கிறது.
- source_word: τὰς ἐκκλησίας
  choice: திருச்சபைகளை
  rationale: அப்போஸ்தலர் பணிகளில் இச்சொல் உள்ளூர் கிறிஸ்தவ விசுவாசக் குழுக்களைக் குறிக்கிறது. ‘திருச்சபைகள்’ என்பது நவீனத் தமிழ் வேதாகம நடையில் தெளிவாகவும் வழக்கமாகவும் உள்ளது.
