translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் பவுலின் பெயர் வெளிப்படையாக இல்லாவிட்டதால், சூழலில் குறிக்கப்படும் நபரைத் தாண்டி பெயர் சேர்க்காமல் ‘அவர்’ என வைக்கப்பட்டுள்ளது. ‘ஆகிய பகுதிகள்’ என்பது சிரியாவும் சிலிசியாவும் பிரதேசங்கள் என்பதை இயல்பாகத் தெளிவாக்குகிறது.
