source:
  edition: SBLGNT
  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: ta
  text: அவர்களுக்கிடையே அவர்கள் ஒருவரைவிட்டு ஒருவர் பிரிந்துபோகும் அளவுக்குக் கடுமையான மோதல்[a] ஏற்பட்டது. பர்னபா மாற்குவைத் தன்னுடன் அழைத்துக்கொண்டு கப்பலில் சைப்பிரசுக்குப் புறப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடுமையான வாக்குவாதம்.” கிரேக்கச் சொல் தீவிரமான தூண்டுதலையையோ கடுமையான மோதலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: அப்போது ... ஏற்பட்டதால்
  rationale: δέ-ஐ மிகையான எதிர்மறை இணைப்பாக ஆக்காமல் கதைத் தொடர்ச்சியை ‘அப்போது’ காட்டுகிறது; ἐγένετο என்பதன் புதிய நிகழ்வு உருவாகும் கருத்தை ‘ஏற்பட்டது’ இயல்பாகத் தருகிறது.
- source_word: παροξυσμὸς
  choice: கடுமையான கருத்து மோதல்
  rationale: உள்ளார்ந்த எரிச்சலை மட்டும் அல்லாமல், இச்சூழலில் பவுலுக்கும் பர்னபாவுக்கும் இடையே ஏற்பட்ட தீவிரமான மோதலைத் தெளிவாகவும் மிகைப்படுத்தாமலும் குறிக்கிறது.
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: அவர்கள் ஒருவரைவிட்டு ஒருவர் பிரிந்தார்கள்
  rationale: ὥστε + infinitive காட்டும் விளைவை, முன்வரும் ‘ஏற்பட்டதால்’ என்பதுடன் இணைத்து இயல்பான தமிழ் வாக்கியமாகத் தருகிறது; பரஸ்பரப் பிரிவையும் காக்கிறது.
- source_word: τόν τε Βαρναβᾶν
  choice: பர்னபா
  rationale: τε அடுத்த வசனத்தில் வரும் பவுலின் இணையான செயலை முன்னறிவிக்கிறது. தமிழில் தேவையற்ற இணைப்பைச் சேர்க்காமல் தனி வாக்கியத் தொடரால் அதன் கதை ஓட்டம் காக்கப்படுகிறது.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: மாற்குவைத் தன்னுடன் அழைத்துக்கொண்டு
  rationale: παραλαμβάνω என்பதிலுள்ள ஒருவரைத் துணையாக உடன் அழைத்துச் செல்லும் பொருளை வெளிப்படையாகவும் இயல்பாகவும் தருகிறது; மூலத்தில் உள்ளபடி ‘மாற்கு’ என்ற பெயரை மட்டுமே பயன்படுத்துகிறது.
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: கப்பலில் சைப்பிரசுக்குப் புறப்பட்டார்
  rationale: ἐκπλέω என்பதன் கடல் வழியாகப் புறப்படும் கருத்தையும் εἰς என்பதன் இலக்கையும் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: அப்போஸ்தலப் பணியில் உடன் உழைத்தவர்களுக்கிடையேயான மோதலின் சித்தரிப்பு
  choice: ‘கடுமையான கருத்து மோதல்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘கருத்து வேறுபாடு’ என்று மென்மைப்படுத்துதல் அல்லது ‘கடும் சண்டை’ என்று தீவிரப்படுத்துதல்
  rationale: வசனம் உண்மையான, தீவிரமான மோதலைப் பதிவு செய்கிறது. அதை இணக்கப்படுத்தும் நோக்கில் மென்மைப்படுத்தாமலும், சொல் தரும் ஆதாரத்தை மீறி ஒழுக்கத் தீர்ப்பாகத் தீவிரப்படுத்தாமலும் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘கருத்து மோதல்’ சாதாரண வாசகருக்குப் புரியும் வகையில் தீவிரத்தையும் கருத்து சார்ந்த மோதலையும் ஒருங்கே தருகிறது. வசனத்தின் நீண்ட கிரேக்கத் தொடரை வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைத்துள்ளோம்.
