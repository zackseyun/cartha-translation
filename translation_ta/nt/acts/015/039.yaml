revisions:
- from: அப்போது அவர்களுக்கிடையே கடுமையான கருத்து மோதல் ஏற்பட்டதால், அவர்கள் ஒருவரைவிட்டு ஒருவர் பிரிந்தார்கள்[a]. பர்னபா மாற்குவைத் தன்னுடன் அழைத்துக்கொண்டு கப்பலில் சைப்பிரசுக்குப் புறப்பட்டார்.
  to: அவர்களுக்கிடையே அவர்கள் ஒருவரைவிட்டு ஒருவர் பிரிந்துபோகும் அளவுக்குக் கடுமையான மோதல்[a] ஏற்பட்டது. பர்னபா மாற்குவைத் தன்னுடன் அழைத்துக்கொண்டு கப்பலில் சைப்பிரசுக்குப் புறப்பட்டார்.
  rationale: The revision renders ὥστε as «... அளவுக்கு», preserving the Greek degree-result relationship without making the conflict a merely causal background. It replaces the interpretively narrower «கருத்து மோதல்» with the broader and source-faithful «கடுமையான மோதல்», while retaining the verse’s direct portrayal of the conflict and the sea voyage.
