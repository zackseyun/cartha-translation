id: ACT.15.21
reference: Acts 15:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: ta
  text: ஏனெனில், பண்டைய தலைமுறைகளிலிருந்தே ஒவ்வொரு நகரத்திலும் மோசேயைப் பிரசங்கிப்பவர்கள் இருந்து வருகின்றனர், அவர் ஒவ்வொரு ஓய்வுநாளிலும் தொழுகைக்கூடங்களில் வாசிக்கப்படுகிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: “மோசே ... அவரைப் பிரசங்கிப்பவர்கள் ... அவர் வாசிக்கப்படுகிறார்.” இங்கே “மோசே” என்பது அவருடன் தொடர்புடைய எழுத்துகள் அல்லது திருச்சட்டத்தைக் குறிக்கும் ஆகுபெயர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்; மூலத்தில் உள்ள நபரைக் குறிக்கும் சொல்லை அப்படியே தக்கவைக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய தீர்மானத்திற்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: பண்டைய தலைமுறைகளிலிருந்தே
  rationale: γενεῶν என்ற பன்மையையும், தொன்றுதொட்டு நீடிக்கும் காலப் பொருளையும் தக்கவைக்கிறது.
- source_word: κατὰ πόλιν
  choice: ஒவ்வொரு நகரத்திலும்
  rationale: κατά என்பதன் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: மோசேயை அறிவிப்பவர்கள்
  rationale: κηρύσσω என்பதன் பொது அறிவிப்பு சார்ந்த பொருளைத் தருகிறது; αὐτόν என்பதன் ஆண்பால் நபர்ச் சுட்டை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: ἔχει
  choice: இருந்து வருகின்றனர்
  rationale: இலக்கணத்தில் நிகழ்காலமாக இருந்தாலும், பண்டைய தலைமுறைகளிலிருந்து நிகழ்காலம்வரை நீடிக்கும் நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: தொழுகைக்கூடங்களில்
  rationale: யூதர்கள் கூடி வழிபட்டு வேதத்தை வாசிக்கும் இடத்தைக் குறிக்கும் συναγωγή என்பதற்கு புரிந்துகொள்ளத்தக்க, நிலைபெற்ற தமிழ்ச் சொல்.
- source_word: κατὰ πᾶν σάββατον
  choice: ஒவ்வொரு ஓய்வுநாளிலும்
  rationale: தவறாமல் மீண்டும் நிகழ்வதைச் சுட்டும் பகிர்ந்தளிக்கும் சொற்றொடரைத் தக்கவைக்கிறது.
- source_word: ἀναγινωσκόμενος
  choice: அவர் வாசிக்கப்படுகிறார்
  rationale: செயப்பாட்டு வினைப் பொருளைத் தக்கவைக்கிறது; காரணப் பொருளைத் தெளிவாகச் சேர்க்காமல், இணைந்த விளக்கக் கூற்றாக வழங்குகிறது.
theological_decisions:
- issue: ‘மோசே’ என்பது அவரது எழுத்துகள் அல்லது திருச்சட்டத்தைக் குறிக்கும் ஆகுபெயராக வருதல்
  choice: மூலத்தில் உள்ளபடி ‘மோசே’ மற்றும் ‘அவர்’ என்ற நபர்ச் சுட்டுகளைத் தக்கவைத்தல்
  alternative: ‘மோசேயின் திருச்சட்டம்’ அல்லது ‘மோசேயின் எழுத்துகள்’ என்று பிரதான உரையிலேயே விரித்துரைத்தல்
  rationale: கிரேக்க உரை நபரின் பெயரையும் அவரைக் குறிக்கும் சுட்டுப்பெயரையும் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது மூலத்தின் ஆகுபெயர் நடை மற்றும் அதன் இலக்கியத் தாக்கத்தைப் பாதுகாக்கிறது; தேவையான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀναγινωσκόμενος என்ற பங்கேற்புவினையின் தொடர்பு
  choice: ‘அவர் வாசிக்கப்படுகிறார்’ என்ற ஒருங்கிணைந்த விளக்கக் கூற்றாக மொழிபெயர்த்தல்
  alternative: ‘அவர் வாசிக்கப்படுவதால்’ என்று வெளிப்படையான காரணத் தொடர்பைச் சேர்த்தல்
  rationale: பங்கேற்புவினை சூழலில் விளக்க அல்லது காரண நிழலைக் கொண்டிருக்கலாம்; ஆனால் காரணத்தை மட்டும் தீர்மானித்து உரையில் சேர்க்காமல் மூலத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மோசே/அவர்’ என்ற மூல ஆகுபெயர் அமைப்பு பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ‘தொழுகைக்கூடம்’ என்பது συναγωγή குறிக்கும் யூத வழிபாட்டு மற்றும் வேதவாசிப்பு இடத்திற்கான தெளிவான சொல்.
