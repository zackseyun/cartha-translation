source:
  edition: SBLGNT
  text: καὶ ⸀οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: ta
  text: விசுவாசத்தினால்[a] அவர்களுடைய இதயங்களைத் தூய்மைப்படுத்தி, நமக்கும் அவர்களுக்கும் இடையில் அவர் எந்த வேறுபாடும் காட்டவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசத்தின் மூலம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வேற்றுமை உருபு வழிமுறை அல்லது கருவியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: எந்த வேறுபாடும் காட்டவில்லை
  rationale: οὐθὲν உடன் வரும் διέκρινεν இங்கு இரு குழுக்களுக்கிடையே பாகுபாடு அல்லது வேறுபாடு செய்யாததைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: நமக்கும் அவர்களுக்கும் இடையில்
  rationale: τε ... καὶ இணைப்பு இரு தரப்பினரையும் இணைக்கிறது; தமிழில் ‘நமக்கும் அவர்களுக்கும் இடையில்’ என்பது அதன் இயல்பான சமமான வடிவம்.
- source_word: τῇ πίστει
  choice: விசுவாசத்தினால்
  rationale: இங்குள்ள வேற்றுமை உருபு வழிமுறை அல்லது கருவியைக் குறிக்கக்கூடும். ‘விசுவாசத்தினால்’ என்பது அந்தக் கருவிப் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: καθαρίσας
  choice: தூய்மைப்படுத்தி
  rationale: இறந்தகால வினையெச்சத்தின் சார்பு இயல்பைப் பாதுகாத்து, முதன்மை வினையுடன் தொடர்புடைய செயலைக் காட்டுகிறது; அதன் காலத் தொடர்பை தேவையின்றி மிகத் துல்லியமாக நிர்ணயிப்பதில்லை.
- source_word: τὰς καρδίας αὐτῶν
  choice: அவர்களுடைய இதயங்களை
  rationale: καρδία என்பது இங்கு வெறும் உணர்ச்சிகளை அல்ல, உள்ளார்ந்த மனிதரைச் சுட்டுகிறது. ‘இதயங்கள்’ என்ற வழக்கமான வேதாகமச் சொல் இந்தப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இந்தச் சூழலில் πίστις என்பது கடவுள் அவர்களுடைய இதயங்களைத் தூய்மைப்படுத்திய வழிமுறையாக வரும் மனித விசுவாசத்தைக் குறிக்கிறது. ‘விசுவாசம்’ என்பது பொருத்தமான பொதுவான மொழிபெயர்ப்பு; ‘உண்மைத்தன்மை’ என மொழிபெயர்க்க இந்த வசனத்தில் போதிய ஆதாரம் இல்லை.
- issue: καθαρίσας என்ற வினையெச்சத்தின் காலத் தொடர்பு
  choice: தூய்மைப்படுத்தி
  alternative: தூய்மைப்படுத்தியதால்; தூய்மைப்படுத்திய பின்
  rationale: கிரேக்க வினையெச்சம் தூய்மைப்படுத்துதலையும் வேறுபாடு காட்டாததையும் நெருக்கமாக இணைக்கிறது; ஆனால் அது காரணத்தையோ கடுமையான கால வரிசையையோ வெளிப்படையாக நிர்ணயிப்பதில்லை. எனவே அந்த இறையியல் மற்றும் இலக்கணத் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கிரேக்க முதன்மை வினையின் வலிமையைத் தக்கவைக்க ‘எந்த வேறுபாடும் காட்டவில்லை’ பயன்படுத்தப்பட்டுள்ளது; வினையெச்சத்தின் திட்டமிட்ட தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளது.
