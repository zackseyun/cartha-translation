source:
  edition: SBLGNT
  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: ta
  text: 'அவர்கள் கையில்[a] இவ்வாறு எழுதி அனுப்பினர்:


    “அப்போஸ்தலர்களும் மூப்பர்களாகிய சகோதரர்களும்[b], அந்தியோகியா, சீரியா, சிலிசியா ஆகிய இடங்களில் பிற இனத்தாரிலிருந்து வந்த சகோதரர்களுக்கு[c] வாழ்த்துகள்!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “அவர்கள் கையில்.” இங்கு “அவர்கள் வழியாக” அல்லது “அவர்கள் மூலம்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதை “அப்போஸ்தலர்களும் மூப்பர்களும், சகோதரர்களும்” என்றும் புரிந்துகொள்ளலாம்; சிலர் “மூப்பர்களும் சகோதரர்களும்” என்பதைத் தனித்தனி குழுக்களாக எடுத்துக்கொள்கிறார்கள்.
    reason: alternative_reading
  - marker: c
    text: இங்கு “சகோதரர்கள்” என்பது பெண்கள் உட்பட விசுவாசச் சமூகத்தினர் அனைவரையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες
  choice: பின்வருமாறு எழுதி அனுப்பினார்கள்
  rationale: இறந்தகால வினையெச்சம், கடிதத்தை எழுதி பிரதிநிதிகள் மூலம் அனுப்பிய செயலை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாக அமைய வினைமுற்றுத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: διὰ χειρὸς αὐτῶν
  choice: அவர்கள் மூலம்
  rationale: சொல்லுக்கு சொல் பார்த்தால் ‘அவர்களுடைய கையால்’ என்றாலும், இச்சூழலில் பெயரிடப்பட்ட பிரதிநிதிகள் வழியாகக் கடிதம் அனுப்பப்பட்டதைக் குறிக்கும் இயல்பான தமிழ்த் தொடர் இது. மூல உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀπόστολοι
  choice: அப்போஸ்தலர்கள்
  rationale: எருசலேமிலிருந்த அங்கீகரிக்கப்பட்ட தூதுத் தலைவர்களைக் குறிக்கும் வழக்கமான, நிலைபெற்ற தமிழ்ச் சொல்.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: மூப்பர்களாகிய சகோதரர்கள்
  rationale: இரண்டாவது பெயர்ச்சொல்லுக்கு முன் தனிக் கட்டுரை இல்லாததால், ‘சகோதரர்கள்’ என்பது ‘மூப்பர்கள்’ என்பதற்கு விளக்கமாக அமைவதை இத்தொடர் பிரதிபலிக்கிறது. வேறு சாத்தியமான நிறுத்தக்குறி சார்ந்த வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀδελφοῖς
  choice: சகோதரர்களுக்கு
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவம் தக்கவைக்கப்பட்டுள்ளது; இக்கடித முகவரியில் அது பெண்கள் உட்பட விசுவாசச் சமூகத்தினர் அனைவரையும் உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: பிற இனத்தாரிலிருந்து வந்த
  rationale: ἐξ என்பதன் தோற்றம் அல்லது பின்னணியைக் குறிக்கும் பொருளையும், ἔθνη என்பதன் யூதரல்லாத பிற இன மக்கள் என்ற சூழல்சார் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: χαίρειν
  choice: வாழ்த்துகள்
  rationale: இது மகிழும்படி இடப்படும் கட்டளை அல்ல; பண்டைய கடிதத் தொடக்கத்தில் வரும் வழக்கமான வாழ்த்துச் சொல்.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: அந்தியோகியா, சீரியா, சிலிசியா ஆகிய இடங்களில்
  rationale: κατά இங்கு குறிப்பிடப்பட்ட நகரத்திலும் பிரதேசங்களிலும் பரவியிருக்கும் பெறுநர்களின் இருப்பிடத்தைக் குறிக்கிறது; ‘ஆகிய இடங்களில்’ என்பது தெளிவான இயல்பான தமிழ்.
theological_decisions:
- issue: πρεσβύτεροι ἀδελφοὶ என்பதன் தொடரியல் உறவு
  choice: மூப்பர்களாகிய சகோதரர்கள்
  alternative: மூப்பர்களும், சகோதரர்களாகிய நாங்களும் / மூப்பர்களும் சகோதரர்களும்
  rationale: கிரேக்கத்தில் ἀδελφοί என்பதற்கு முன் மறுபடியும் கட்டுரை வராததால், அதை πρεσβύτεροι என்பதற்கு விளக்கப் பெயராக எடுத்துக்கொள்வது இயல்பானது. ஆயினும் நிறுத்தக்குறியை வேறுவிதமாகப் புரிந்துகொண்டு ‘மூப்பர்களே சகோதரர்களாக’ அல்லது தனிக் குழுவாக வாசிக்கும் மரபும் இருப்பதால் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: கலந்த விசுவாசச் சமூகத்தை நோக்கி வரும் ἀδελφοῖς
  choice: சகோதரர்களுக்கு
  alternative: சகோதர சகோதரிகளுக்கு / உடன்பிறப்புகளுக்கு
  rationale: மூலத்தின் ஆண்பால் பன்மைச் சொல் முதன்மை உரையில் தக்கவைக்கப்படுகிறது; அது பெண்களையும் உள்ளடக்கிய சமூக அழைப்பாக இருக்கக்கூடிய பொருள் அடிக்குறிப்பில் கூறப்படுகிறது.
translation_notes:
  register: 'நவீன நிலையான தமிழில், கடித முகவரியின் மரியாதையும் சுருக்கமும் காக்கப்பட்டுள்ளன. “எழுதுவது: வாழ்த்துகள்” என்பது பண்டைய கடிதத் தொடக்க வடிவத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது. “மூப்பர்களாகிய சகோதரர்கள்” என்பது சற்றே முறையான நடையாயினும், கிரேக்கத் தொடரியலின் தெளிவின்மையை மிகையாகத் தீர்மானிக்காமல் காக்கிறது.'
