source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: ta
  text: அப்படியானால், இப்போது, நம் முன்னோர்களாலும்[c] நம்மாலும் சுமக்க முடியாத நுகத்தை[b] சீடர்களின் கழுத்தில் வைத்து, கடவுளை ஏன் சோதிக்கிறீர்கள்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளை ஏன் சோதனைக்கு உட்படுத்துகிறீர்கள்?”
    reason: lexical_alternative
  - marker: b
    text: “நுகம்” என்பது சுமத்தப்படும் கடமைக்கான உருவகம்; இச்சூழலில், சீடர்கள்மேல் வைக்கப்படும் கோரிக்கைகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “நம் தந்தையரும் நாமும்.” இங்கு “தந்தையர்” என்பது முந்தைய தலைமுறையினரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: ஆகவே இப்போது
  rationale: οὖν என்பதன் முடிவுரைக்கும் தன்மையையும் νῦν என்பதன் நிகழ்காலத் திருப்பத்தையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: τί πειράζετε τὸν θεόν
  choice: கடவுளை ஏன் சோதிக்கிறீர்கள்
  rationale: ர rhetorical கேள்வியில் τί என்பது ‘ஏன்’ என இயல்பாக அமைகிறது; πειράζω என்பதன் ‘சோதனைக்கு உட்படுத்துதல்’ என்ற பொருளையும் நேரடியாகத் தருகிறது.
- source_word: ἐπιθεῖναι
  choice: வைப்பதன் மூலம்
  rationale: சீடர்கள்மேல் நுகத்தை வைப்பதே கடவுளைச் சோதிக்கும் செயல் என்பதை விளக்கும் infinitive-இன் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ζυγὸν
  choice: நுகத்தை
  rationale: சுமத்தப்பட்ட கடமையைக் குறிக்கும் உருவகத்தை விளக்கமாக மாற்றாமல், மூலத்தின் தெளிவான படிமத்தைப் பாதுகாக்கிறது.
- source_word: ἐπὶ τὸν τράχηλον τῶν μαθητῶν
  choice: சீடர்களின் கழுத்தின்மேல்
  rationale: மூலத்தின் உடற்கூறு படிமத்தையும் μαθηταί என்பதற்கான வழக்கமான ‘சீடர்கள்’ என்ற சொல்லையும் நேரடியாகக் காக்கிறது.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: நம் முன்னோர்களும் நாமும் ... முடியாமற்போன
  rationale: இரு குழுக்களுக்குமான மறுப்பைத் தமிழ் வினைமுற்றில் ஒருங்கிணைத்து இயல்பாகக் காட்டுகிறது; πατέρες இங்கு முந்தைய தலைமுறையினரைக் குறிப்பதால் ‘முன்னோர்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: சுமக்க முடியாமற்போன
  rationale: ἰσχύω + infinitive குறிக்கும் இயலாமையையும் βαστάζω குறிக்கும் சுமத்தலையும் நுகம் என்ற உருவகத்தோடு இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: ‘நுகம்’ என்ற உருவகத்தின் வரம்பு
  choice: சீடர்கள்மேல் சுமத்தப்படும் கடமையைக் குறிக்கும் உருவகமாகவே வைத்தல்
  alternative: அதை முழு மோசேயின் சட்டம் என்றோ, விருத்தசேதனையும் அதனோடு சேர்ந்த குறிப்பிட்ட விதிகளும் என்றோ மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: உடனடிச் சூழல் பிற இனத்து விசுவாசிகள்மேல் வைக்கப்படும் கோரிக்கைகளைப் பற்றியது; ஆனால் இவ்வசனம் நுகம் என்ற உருவகத்தைப் பயன்படுத்தி அதன் வரம்பைத் துல்லியமாக வரையறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் திறந்த தன்மையைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘நுகம்’ மற்றும் ‘கழுத்தின்மேல்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; வாக்கியத்தின் கேள்வித் தீவிரமும் தக்கவைக்கப்பட்டுள்ளது.
