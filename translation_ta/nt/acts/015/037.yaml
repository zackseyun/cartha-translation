  text: Βαρναβᾶς δὲ ⸀ἐβούλετο συμπαραλαβεῖν ⸀καὶ τὸν Ἰωάννην τὸν καλούμενον Μᾶρκον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: ta
  text: ஆனால் பர்னபா, மாற்கு என்று அழைக்கப்பட்ட யோவானையும் தங்களுடன் அழைத்துச் செல்ல விரும்பினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாற்கு என்றும் அழைக்கப்பட்ட யோவானைத் தங்களுடன் அழைத்துச் செல்ல பர்னபா விரும்பினார்.”
    reason: καὶ என்பதன் சேர்க்கைப் பொருளை யோவானை அழைத்துச் செல்வதோடு இணைப்பதற்குப் பதிலாக, யோவானின் மற்றொரு பெயருடன் இணைத்துப் புரிந்துகொள்ளக்கூடிய மாற்று வாசிப்பைச் சுட்டுகிறது.
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: பர்னபா
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயர்வடிவம்; கிரேக்கப் பெயரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் பவுல் முன்வைத்த திட்டத்துடன் பர்னபாவின் விருப்பத்தை ஒப்பிட்டு, இங்கு காணப்படும் மிதமான எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ἐβούλετο
  choice: விரும்பினார்
  rationale: βούλομαι என்பதன் விருப்பம் அல்லது நோக்கம் சார்ந்த பொருளை மிகைப்படுத்தாமல் இயல்பான நவீன தமிழில் தருகிறது; இறந்தகாலத் தொடர்நிலையின் சூழ்நிலைப் பொருள் தமிழில் இயல்பான வினைமுற்றால் வெளிப்படுகிறது.
- source_word: συμπαραλαβεῖν
  choice: தங்களுடன் அழைத்துச் செல்ல
  rationale: ஒருவரைத் தங்கள் பயணக் குழுவில் உடன் கூட்டிச் செல்லும் கூட்டுறவுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: -யும்
  rationale: யோவானும் பயணத்தில் சேர்க்கப்பட வேண்டும் என்ற சேர்க்கைப் பொருளைத் தமிழின் இயல்பான இணைப்பு விகுதியால் காட்டுகிறது.
- source_word: Ἰωάννην
  choice: யோவான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: மாற்கு என்று அழைக்கப்பட்ட
  rationale: யோவானை அவரது மற்றொரு பெயரால் அடையாளப்படுத்தும் கிரேக்கப் பெயரெச்சத் தொடரை முறையாகவும் தெளிவாகவும் பிரதிபலிக்கிறது.
- source_word: Μᾶρκον
  choice: மாற்கு
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயர்வடிவம்.
