  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகம மரபின் பரவலான வடிவங்களில் தரப்பட்டுள்ளன; கிரேக்கத்தின் மிதமான எதிர்மறைத் தொடர்பும் καὶ என்பதன் இடம் சார்ந்த உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
