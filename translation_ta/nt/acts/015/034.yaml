translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை. மூலத்தின் ஆளில்லா வினை அமைப்பை தமிழில் இயன்றவரை பேணுகிறது; கையெழுத்துப் பிரதிச் சிக்கல் அடிக்குறிப்பில் தெளிவாகக் கொடுக்கப்பட்டுள்ளது.
