source:
  edition: SBLGNT
  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: ta
  text: அப்போஸ்தலர்களும் மூப்பர்களும் இந்த விவகாரத்தை ஆராய ஒன்றுகூடினார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கூடினார்கள்’ அல்லது ‘கூடிவந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் வடிவத்தில் செயப்பாட்டுவினையாக, ‘ஒன்றாகக் கூட்டப்பட்டார்கள்’ என்று உள்ளது; ஆனால் இச்சூழலில் குழுவினர் கூடிவந்தார்கள் என்ற பொருளில் இயல்பாகப் பயன்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘இந்த வார்த்தையைப் பற்றிக் காண்பதற்கு.’ இங்கு ‘வார்த்தை’ என்பது விவாதிக்கப்பட்ட விவகாரத்தை அல்லது பிரச்சினையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: ஒன்றுகூடினார்கள்
  rationale: இது συνάγω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவமாக இருந்தாலும், இச்சூழலில் ஒரு குழு கூடிவந்ததைக் குறிக்கும் இயல்பான பொருளில் வருகிறது. ‘ஒன்றுகூடினார்கள்’ என்பது தமிழில் செயப்பாட்டு வடிவத்தின் செயற்கைத்தன்மையைத் தவிர்த்து, கூட்டாகக் கூடிய பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τε
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: τε முந்தைய நிகழ்வுடன் இவ்வாக்கியத்தை மென்மையாக இணைக்கிறது. தமிழில் வாக்கியத் தொடர்ச்சியே அந்த இணைப்பை இயல்பாக உணர்த்துவதால், ‘ஆகவே’ போன்ற வலுவான காரணவிளைவு இணைப்பைச் சேர்க்கவில்லை.
- source_word: ἀπόστολοι
  choice: அப்போஸ்தலர்கள்
  rationale: அப்போஸ்தலர் பணிகள் நூலில் அங்கீகரிக்கப்பட்ட அப்போஸ்தலத் தலைவர்களைக் குறிக்கும் நிலைபெற்ற, சூழலுக்குப் பொருத்தமான தமிழ் சொல்.
- source_word: πρεσβύτεροι
  choice: மூப்பர்கள்
  rationale: இங்கு வயதில் மூத்த ஆண்களை மட்டுமல்லாமல், சமூகத்தில் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது. பிற்கால சபை அமைப்புகளை உரைக்குள் திணிக்காமல் இந்தப் பொருளை ‘மூப்பர்கள்’ தக்கவைக்கிறது.
- source_word: ἰδεῖν
  choice: ஆராய
  rationale: சொல்லுக்குச் சொல் ‘காண’ என்றாலும், இங்கு ஒரு விவகாரத்தை எடுத்துப் பரிசீலிக்கும் நோக்கைக் குறிக்கிறது. ‘ஆராய’ என்பது முடிவு ஏற்கெனவே எடுக்கப்பட்டதாகக் காட்டாமல், ஆய்ந்து பரிசீலிக்கும் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: περὶ τοῦ λόγου τούτου
  choice: இந்த விவகாரத்தை
  rationale: λόγος என்பதற்கு ‘சொல்’, ‘செய்தி’, அல்லது ‘விவகாரம்’ எனச் சூழலுக்கேற்ப பொருள் உண்டு. இங்கு முன்வைக்கப்பட்ட சர்ச்சைக்குரிய பிரச்சினையைக் குறிப்பதால் ‘இந்த விவகாரம்’ தெளிவான இயல்பான தேர்வு.
theological_decisions:
- issue: எருசலேம் கூடுகையில் πρεσβύτεροι என்பதன் நிறுவன நுட்பம்
  choice: பிற்காலத் திருச்சபைப் பதவி அமைப்புகளைச் சேர்க்காமல் ‘மூப்பர்கள்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: பிற்காலத் தொழில்நுட்பப் பதவியைக் குறிக்கும் சொல்லைப் பயன்படுத்துதல்
  rationale: வசனம் எருசலேம் சபையின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிப்பிடுகிறது; ஆனால் பிற்காலத்தில் வளர்ந்த குறிப்பிட்ட சபை ஆட்சிமுறையை அது கட்டாயப்படுத்தவில்லை.
- issue: கூட்டத்தின் ஆலோசனை நோக்கம்
  choice: ‘இந்த விவகாரத்தை ஆராய’ என்று தரப்பட்டது.
  alternative: ‘இந்த விவகாரத்தைத் தீர்மானிக்க’ அல்லது சொல்லுக்குச் சொல் ‘இந்த வார்த்தையைப் பற்றிக் காண’
  rationale: ἰδεῖν இங்கு விவகாரத்தை எடுத்துப் பரிசீலிப்பதைக் குறிக்கிறது. ‘ஆராய’ என்பது இக்கதைப் புள்ளியிலேயே முடிவு முன்கூட்டியே நிர்ணயிக்கப்பட்டதாக மிகைப்படுத்தாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலர்கள்’, ‘மூப்பர்கள்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
