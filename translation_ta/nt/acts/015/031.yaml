translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. கிரேக்கச் சொல்லின் ஊக்கம்–அறிவுரை–ஆறுதல் என்ற பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
