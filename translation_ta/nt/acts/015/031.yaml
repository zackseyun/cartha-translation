    text: அல்லது, “அந்த ஊக்கத்தில் மகிழ்ந்தார்கள்.” இங்கு παράκλησις என்பதற்கு “அறிவுரை” அல்லது “ஆறுதல்” என்றும் பொருள் கொள்ளலாம்.
