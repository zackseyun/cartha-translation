lexical_decisions:
- source_word: ἀναγνόντες
  choice: அவர்கள் அதைப் படித்தபோது
  rationale: இறந்தகால வினையெச்சம், முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் கால உறவுடன் காட்டுகிறது. முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கடிதமே மறைமுகச் செயப்படுபொருள் என்பதால், தமிழில் இயல்பாக ‘அதைப்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல் சேர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான தொடர்ச்சியைக் குறிக்கிறது. ‘படித்தபோது’ என்ற தமிழ்க் கட்டமைப்பே முந்தைய நிகழ்வுடனான தொடர்ச்சியை இயல்பாகத் தருவதால், தனியாக ‘மேலும்’ அல்லது ‘ஆனால்’ சேர்ப்பது தேவையில்லை.
- source_word: ἐχάρησαν
  choice: மகிழ்ந்தார்கள்
  rationale: χαίρω என்ற வினையின் செயற்பொருள் அர்த்தத்தையும் கூட்டத்தாரின் மகிழ்ச்சியையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ
  choice: குறித்து
  rationale: இடைச்சொல் இங்கு மகிழ்ச்சியின் அடிப்படை அல்லது காரணத்தைக் குறிக்கிறது. ‘குறித்து’ என்பது தமிழில் அந்த உறவை இயல்பாகத் தெரிவிக்கிறது; அடிக்குறிப்பு காரணவியல் வாசிப்பையும் வெளிப்படுத்துகிறது.
- source_word: τῇ παρακλήσει
  choice: அதன் ஊக்கமளிக்கும் செய்தி
  rationale: παράκλησις என்பது ஊக்கம், அறிவுரை, ஆறுதல் ஆகிய பொருள் நிழல்களைக் கொண்டது. கடிதத்தின் உள்ளடக்கம் விசுவாசிகளைத் தேற்றி வலுப்படுத்தியதை ‘ஊக்கமளிக்கும் செய்தி’ இயல்பாகக் காட்டுகிறது; ‘அதன்’ என்பது கடிதத்துடனான தொடர்பைச் சூழலிலிருந்து வெளிப்படுத்துகிறது.
