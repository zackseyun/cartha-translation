  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: ta
  text: 'இதனுடன் தீர்க்கதரிசிகளின் வார்த்தைகளும் ஒத்துப்போகின்றன[a]; எழுதப்பட்டிருக்கிறபடியே:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதற்குத் தீர்க்கதரிசிகளின் வார்த்தைகள் ஒத்துப்போகின்றன.” கிரேக்க மொழியிலுள்ள வேற்றுமைத் தொடர் “இதனுடன்” அல்லது “இதற்கு” என இரு விதமாகக் குறிப்பிடப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -உம்
  rationale: முந்தைய கருத்தோடு தீர்க்கதரிசிகளின் வார்த்தைகளையும் இணைக்கும் தொடர்ச்சிப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τούτῳ
  choice: இதனுடன்
  rationale: முன்னர் கூறப்பட்ட நிகழ்வு அல்லது கருத்தைச் சுட்டுகிறது; அது எதைக் குறிப்பதாகும் என்பதைத் தேவையின்றிக் குறுக்காமல் கிரேக்கத்தின் பரந்த சுட்டுப்பொருளைப் பாதுகாக்கிறது.
- source_word: συμφωνοῦσιν
  choice: ஒத்துப்போகின்றன
  rationale: ‘ஒத்திருக்கின்றன, உடன்படுகின்றன’ என்ற நிகழ்காலப் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: οἱ λόγοι
  choice: வார்த்தைகள்
  rationale: எழுத்து வடிவில் உள்ள தீர்க்கதரிசன உரைகளைக் குறிக்கும் λόγοι என்பதன் நேரடியான, எளிதில் புரியும் மொழிபெயர்ப்பு.
- source_word: τῶν προφητῶν
  choice: தீர்க்கதரிசிகளின்
  rationale: வார்த்தைகள் தீர்க்கதரிசிகளுக்குரியவை அல்லது அவர்களிடமிருந்து வந்தவை என்பதைக் கிரேக்க உரையின் இயல்பான உடைமைத் தொடர்போடு தருகிறது.
- source_word: καθὼς
  choice: -கிறபடியே
  rationale: யாக்கோபு கூறியது வேதத்தில் எழுதப்பட்டிருப்பதோடு பொருந்துவதைச் சுட்டும் ஒப்புமை வலிமையைப் பாதுகாக்கிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: வேத மேற்கோட்டை அறிமுகப்படுத்தும் நிறைவு நிலைச் செயப்பாட்டு வடிவத்தைத் தமிழில் வழக்கமான முறையில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τούτῳ என்பதன் சுட்டுப்பொருள்
  choice: முன்னர் கூறப்பட்ட கருத்து அல்லது நிகழ்வை விரிவாகச் சுட்டும் ‘இதனுடன்’
  alternative: புறவினத்தாரின் மனமாற்றம்; பேதுருவின் கூற்று; தேவனுடைய திட்டம்
  rationale: கிரேக்க உரை ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தை வெளிப்படையாகத் தேர்ந்தெடுக்கவில்லை. ஆகவே சுட்டுப்பொருளின் பரப்பை மொழிபெயர்ப்பு குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஒத்துப்போகின்றன’ இயல்பான தற்போதைய வழக்கைத் தருகிறது; ‘எழுதப்பட்டிருக்கிறபடியே’ வேத மேற்கோட்டு அறிமுகத்தின் மரியாதையான நடையைப் பாதுகாக்கிறது.
