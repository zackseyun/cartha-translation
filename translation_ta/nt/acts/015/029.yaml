id: ACT.15.29
reference: Acts 15:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: ta
  text: விக்கிரகங்களுக்குப் படைக்கப்பட்ட உணவையும்[a], இரத்தத்தையும், நெரித்துக் கொல்லப்பட்டவற்றையும்[b], பாலியல் ஒழுக்கக்கேட்டையும்[c] விலகியிருங்கள். இவற்றிலிருந்து உங்களைக் காத்துக்கொண்டால், நன்றாகச் செய்வீர்கள். நலமாயிருங்கள்.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விக்கிரகங்களுக்குப் படைக்கப்பட்டவற்றையும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நெரித்துக் கொல்லப்பட்ட இறைச்சியையும்” அல்லது “நெரித்துக் கொல்லப்பட்டவைகளையும்.”
    reason: lexical_alternative
  - marker: c
    text: “பாலியல் ஒழுக்கக்கேடு” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல்லைப் பரந்த பொருளில் புரிந்துகொள்ளலாம். எனினும், இங்கு அது லேவியராகமத்தில் தடைசெய்யப்பட்ட சில உறவுகளை இன்னும் குறிப்பாகச் சுட்டுவதாகச் சிலர் கருதுகின்றனர்.
    reason: alternative_reading
  - marker: d
    text: அல்லது, “நலமுடன் இருங்கள்.” இந்தக் கிரேக்கச் சொல் கடிதத்தை முடிக்கும் வழக்கமான வாழ்த்துரை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: விட்டு விலகியிருங்கள்
  rationale: மூலத்தில் இது முந்தைய வாக்கியத்தைத் தொடரும் வினையெச்சப் பெயரெச்ச வடிவம். தனி வசனமாகத் தமிழில் இயல்பாகவும் அறிவுறுத்தலின் வலிமையுடனும் வாசிக்க, கட்டளை வடிவில் மொழிபெயர்க்கப்பட்டது.
- source_word: εἰδωλοθύτων
  choice: விக்கிரகங்களுக்குப் படைக்கப்பட்ட உணவு
  rationale: விக்கிரக வழிபாட்டில் பலியாகப் படைக்கப்பட்டவற்றை, குறிப்பாக உணவு அல்லது இறைச்சியை, குறிக்கிறது. பொதுவாசகருக்குத் தெளிவாக இருக்க ‘உணவு’ முதன்மை உரையில் சேர்க்கப்பட்டது; விரிவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: αἵματος
  choice: இரத்தம்
  rationale: மூலத்தின் சுருக்கமான, பொதுவான சொல்லை உணவுசார் விளக்கத்தால் குறுக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: πνικτῶν
  choice: கழுத்து நெரித்துக் கொல்லப்பட்டவை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இந்தப் பெயரடை, இரத்தம் வடிக்கப்படாமல் கழுத்து நெரித்துக் கொல்லப்பட்ட விலங்குகளைச் சுட்டுகிறது; ‘வை’ என்ற வடிவம் அதன் பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: πορνείας
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: ஒரே குறிப்பிட்ட பாலியல் குற்றமாகக் குறுக்காமல், πορνεία என்பதன் பரந்த பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξ ὧν
  choice: இவற்றிலிருந்து
  rationale: முன் பட்டியலிடப்பட்ட அனைத்தையும் சுட்டும் தொடர்பைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: διατηροῦντες ἑαυτούς
  choice: உங்களைக் காத்துக்கொண்டால்
  rationale: மூலத்தின் பங்கேற்பு வினை வடிவிலுள்ள நிபந்தனைப் பொருளைத் தமிழில் இயல்பான நிபந்தனை வாக்கியமாக வழங்குகிறது.
- source_word: εὖ πράξετε
  choice: நன்றாகச் செய்வீர்கள்
  rationale: இவற்றைக் கடைப்பிடிப்பது சரியானதும் பாராட்டத்தக்கதுமான செயல் என்ற திறந்த பொருளைக் காக்கிறது; ‘செழிப்பீர்கள்’ போன்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: ἔρρωσθε
  choice: நலமாயிருங்கள்
  rationale: சொல்லின் நலம் அல்லது வலிமை சார்ந்த பின்னணியையும் கடித முடிவுரையாகிய அதன் வழக்குப் பயன்பாட்டையும் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: அப்போஸ்தலர் தீர்மானத்தில் πορνεία என்பதன் பொருள்
  choice: ஒரு குறிப்பிட்ட குற்றமாகக் குறுக்காமல் ‘பாலியல் ஒழுக்கக்கேடு’ என்று பரந்த பொருளில் வழங்கப்பட்டது.
  alternative: ‘வேசித்தனம்’ அல்லது லேவியராகமம் 18-இன் வெளிச்சத்தில் தடைசெய்யப்பட்ட திருமணங்கள் அல்லது பாலுறவுகள்
  rationale: இந்தச் சூழலில் சிலர் இதை லேவியராகமத் தடைகளுடன் குறிப்பாக இணைத்தாலும், இவ்வசனமே சொல்லின் பொருளை அவ்வாறு வெளிப்படையாகக் குறுக்கவில்லை. ஆகவே இறையியல் பதற்றமும் உண்மையான விளக்கத் திறப்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கடிதத்தின் கண்ணியமான அறிவுறுத்தல் தொனியைப் பேணியும் மொழிபெயர்க்கப்பட்டது. பட்டியலின் இணை அமைப்பு காக்கப்பட்டுள்ளது; விளக்கத்தால் மூலத்தின் இறையியல் தெளிவின்மை குறுக்கப்படவில்லை.
