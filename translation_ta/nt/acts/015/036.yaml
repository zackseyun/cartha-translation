source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: ta
  text: சில நாட்களுக்குப் பிறகு, பவுல் பர்னபாவிடம், “நாம் இப்போது திரும்பிச் சென்று, ஆண்டவருடைய வார்த்தையை அறிவித்த ஒவ்வொரு நகரத்திலும் உள்ள சகோதரர்களை[a]ச் சந்தித்து, அவர்கள் எப்படி இருக்கிறார்கள் என்று பார்ப்போம்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதரர் சகோதரிகள்’; கிரேக்கத்தில் ‘சகோதரர்கள்’ என்று உள்ளது; இது விசுவாசிகளின் முழுக் குழுவையும் குறிக்கப் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: சில நாட்களுக்குப் பிறகு
  rationale: μετά உடன் வரும் காலக் குறிப்பு, அதற்குப் பிந்தைய காலத்தைச் சுட்டுகிறது; இடைவெளியின் நீளத்தை மிகைப்படுத்தாமல் இயல்பாகத் தருகிறது.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: நாம் திரும்பிச் சென்று ... சந்தித்து ... பார்ப்போம்
  rationale: இறந்தகால வினையெச்சமும் ஊக்குவிக்கும் துணைவினை வடிவமும் இணைந்து ஒரு கூட்டு முன்மொழிவை உருவாக்குகின்றன. δὴ தரும் உடனடி வலியுறுத்தல் தமிழில் முன்மொழிவின் சூழலிலேயே இயல்பாக வெளிப்படுகிறது.
- source_word: τοὺς ἀδελφοὺς
  choice: சகோதரர்களை
  rationale: கிரேக்க ஆண்பால் குடும்ப உறவுச் சொல்லை மூலவடிவத்துக்கு நெருக்கமாகப் பேணுகிறது; இச்சூழலில் அது பெண்கள் உட்பட விசுவாசிகள் அனைவரையும் குறிக்கக்கூடும்.
- source_word: κατὰ πόλιν πᾶσαν
  choice: ஒவ்வொரு நகரத்திலும் உள்ள
  rationale: κατά அமைப்பின் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου
  choice: ஆண்டவருடைய வார்த்தையை அறிவித்த
  rationale: καταγγέλλω என்பதன் வெளிப்படையான அறிவிப்பு உணர்வையும், λόγος τοῦ κυρίου என்பதன் மூலவடிவ உறவையும் பேணுகிறது.
- source_word: πῶς ἔχουσιν
  choice: அவர்கள் எப்படி இருக்கிறார்கள் என்று
  rationale: அவர்களின் தற்போதைய நிலை அல்லது நலனை அறியும் அக்கறையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ἀδελφοί என்பது கலப்பு பாலின விசுவாசிகள் குழுவைக் குறிக்கக்கூடியது
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; விசுவாசிகள்
  rationale: மூலத்தின் ஆண்பால் குடும்பச் சொல்லை முதன்மை உரையில் பேணுகிறது; அதன் சாத்தியமான உள்ளடக்கிய பொருளை விளக்கக் குறிப்பில் தெரிவிக்கலாம்.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இச்சூழலில் கிறிஸ்தவ அறிவிப்புடன் தொடர்புடைய κύριος என்பதற்கு நவீனத் தமிழில் மரியாதையும் வழக்குப் பொருத்தமும் கொண்ட நிலையான சொல் ‘ஆண்டவர்’ ஆகும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடை. ‘சகோதரர்கள்’ என்பதன் உள்ளடக்கிய சாத்தியத்தை விளக்க வேண்டுமெனில் குறிப்பு சேர்க்கலாம்; ஆனால் வழங்கப்பட்ட ஆங்கிலக் குறிப்பின் குறியீடு தவறாக காலவாக்கியத்தோடு இணைக்கப்பட்டிருப்பதால், ஆதாரமற்ற குறியீட்டை முதன்மை உரையில் சேர்க்கவில்லை.
