source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: ta
  text: ஆகவே, அனுப்பிவைக்கப்பட்ட அவர்கள்[a] அந்தியோகியாவுக்குக் கீழிறங்கிச் சென்றார்கள்[b]; மக்கள் கூட்டத்தை ஒன்றுகூட்டி[c], அந்தக் கடிதத்தை ஒப்படைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விடை கொடுத்து அனுப்பப்பட்டவர்கள்” அல்லது “விடுவிக்கப்பட்டவர்கள்.” கிரேக்கப் பங்கேற்புவினை முறையாக அனுப்பிவைக்கப்பட்டதையோ, விடை கொடுத்து அனுப்பப்பட்டதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கீழிறங்கிச் சென்றார்கள்” என்பது கிரேக்க வினையின் திசைசார் பொருளைப் பிரதிபலிக்கிறது; உயரமான இடத்தில் இருந்த எருசலேமிலிருந்து அந்தியோகியாவுக்குச் சென்றதைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “சபைக் கூட்டத்தை” அல்லது “ஒன்றுகூடிய குழுவை.” இச்சொற்றொடர் அந்தியோகியாவில் ஒன்றுகூடிய குழுவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: அனுப்பிவைக்கப்பட்ட அவர்கள்
  rationale: இந்தப் பங்கேற்புவினை முறையாக விடைபெறச் செய்து அனுப்பப்பட்டதைக் குறிக்கிறது. சூழலில் அதிகாரப்பூர்வமாக அனுப்பப்பட்ட புறப்பாடு முன்னிலையில் இருந்தாலும், கிரேக்கச் சொல்லின் ‘விடுவிக்கப்பட்ட/விடை கொடுக்கப்பட்ட’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κατῆλθον
  choice: கீழே சென்று
  rationale: எருசலேமின் உயரமான நிலப்பகுதியிலிருந்து அந்தியோகியாவுக்குச் செல்லும் திசைசார் இறக்கத்தை கிரேக்க வினை வெளிப்படுத்துகிறது; ‘கீழே சென்று’ அதைத் தக்கவைக்கிறது.
- source_word: συναγαγόντες
  choice: கூட்டி
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த செயலை இயல்பான தமிழ் வினையெச்சத்தால் தெளிவாகக் காட்டுகிறது.
- source_word: τὸ πλῆθος
  choice: மக்கள் கூட்டம்
  rationale: இது அந்தியோகியாவில் ஒன்றுகூடிய விசுவாசிகளின் பரந்த குழுவைக் குறிக்கலாம். ‘சபை’ போன்ற முறையான திருச்சபைச் சொல்லால் பொருளை முன்கூட்டியே குறுக்காமல், பொதுவான குறிப்பைத் தக்கவைக்கிறது.
- source_word: ἐπέδωκαν
  choice: ஒப்படைத்தார்கள்
  rationale: கடிதத்தைச் சாதாரணமாகக் கொடுத்தார்கள் என்பதைக் காட்டிலும், கூடியிருந்த குழுவிடம் முறையாகச் சேர்ப்பித்த செயலை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπιστολήν
  choice: கடிதம்
  rationale: நவீனத் தமிழில் தெளிவான, இயல்பான இணைச்சொல்; தேவையற்ற சமய இலக்கிய நடையைத் தவிர்க்கிறது.
