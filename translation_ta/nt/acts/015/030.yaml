  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் சொல் வரிசையைச் செயற்கையாகப் பின்பற்றாமல், நிகழ்வுகளின் வரிசையும் திசைசார் நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
