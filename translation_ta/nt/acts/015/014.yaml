source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: ta
  text: சிமியோன்[a], பிற இனத்தாரிடமிருந்து[b] தம் பெயருக்கென[c] ஒரு மக்களைக் எடுத்துக்கொள்ளும்படி கடவுள் முதன்முதலில் அவர்கள்மேல் அக்கறை கொண்டார் என்பதை எடுத்துரைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சீமோன்.’ இங்கே யாக்கோபு ‘சிமியோன்’ என்ற வடிவத்தைப் பயன்படுத்துகிறார்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நாடுகளின் நடுவிலிருந்து.’ இங்கே இது யூதரல்லாத மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘தம் பெயருக்கென ஒரு மக்கள்’ என்பது கடவுளுக்குச் சொந்தமானவர்களாகவும் அவரது பெயரால் அடையாளப்படுத்தப்பட்டவர்களாகவும் இருக்கும் மக்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: சிமியோன்
  rationale: மூலத்தில் உள்ள ‘சிமியோன்’ என்ற தனித்த வடிவத்தை, பழக்கமான ‘சீமோன்’ என்பதோடு ஒருமைப்படுத்தாமல் ஒலிபெயர்க்கிறது.
- source_word: ἐξηγήσατο
  choice: எடுத்துரைத்தார்
  rationale: சபையிடம் இப்போதுதான் விவரிக்கப்பட்ட நிகழ்வை ஒழுங்காகக் கூறியதைக் குறிக்கும் இயல்பான தமிழ் வினை.
- source_word: καθὼς
  choice: எப்படி என்பதை
  rationale: கூறப்பட்ட செய்தியின் உள்ளடக்கத்தையும் நிகழ்ந்த விதத்தையும் அறிமுகப்படுத்தும் கிரேக்கப் பயன்பாட்டை இயல்பாகத் தருகிறது.
- source_word: πρῶτον
  choice: முதன்முதலில்
  rationale: பிற இனத்தார் தொடர்பாகக் கடவுள் மேற்கொண்ட செயலின் தொடக்கக் கட்டத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἐπεσκέψατο
  choice: அவர்கள்மீது அக்கறைகொண்டது
  rationale: வெறும் ‘பார்த்தல்’ அல்லாமல் அக்கறையுடன் கவனித்து நோக்கிச் செயல்படும் ἐπισκέπτομαι என்பதன் நுண்பொருளைத் தமிழில் தெரிவிக்கிறது.
- source_word: λαβεῖν
  choice: தேர்ந்தெடுத்துக்கொள்ளும்படி
  rationale: தமக்கென ஒரு மக்களை பிற இனத்தாரிடமிருந்து எடுத்துக்கொள்ளும் நோக்கத்தை இயல்பான தமிழில் தருகிறது; ‘எடுத்துக்கொள்ள’ என்பதை மட்டும் பயன்படுத்துவதால் உண்டாகும் பொருள் மயக்கத்தைத் தவிர்க்கிறது.
- source_word: ἐξ ἐθνῶν
  choice: பிற இனத்தாரிடமிருந்து
  rationale: அப்போஸ்தலர் 15-ன் சூழலில் யூதரல்லாத மக்களைக் குறிக்கிறது; அதேவேளை ἐξ என்பதன் ‘அவர்களிடமிருந்து/அவர்கள் நடுவிலிருந்து’ என்ற பொருளையும் காக்கிறது.
- source_word: λαὸν
  choice: ஒரு மக்களை
  rationale: தனிநபர்களின் தொகுப்பை மட்டுமல்ல, கடவுளுக்குரியதாக அடையாளப்படுத்தப்படும் ஒரு மக்களைக் குறிக்கும் வேதாகமப் பொருளைத் தக்கவைக்கிறது.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: தமது பெயருக்கென
  rationale: ‘தமக்கென’ என்று முழுவதுமாகப் பொழிப்புரை செய்யாமல், மூலத்தின் பெயர் சார்ந்த உடன்படிக்கை மொழிநடையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐξ ἐθνῶν என்பது ‘நாடுகளிலிருந்து’ என்பதா, யூதரல்லாத ‘பிற இனத்தாரிடமிருந்து’ என்பதா
  choice: பிற இனத்தாரிடமிருந்து
  alternative: நாடுகளிலிருந்து
  rationale: அப்போஸ்தலர் 15-ன் உடனடிச் சூழல் யூதரல்லாதோர் கடவுளுடைய மக்களுக்குள் சேர்க்கப்படுவதைப் பற்றியது. எனவே ‘பிற இனத்தார்’ சூழல்சார் எதிர்மறையைத் தெளிவாகக் காட்டுகிறது.
- issue: τῷ ὀνόματι αὐτοῦ என்பதை ‘தமக்கென’ என்று பொழிப்புரை செய்வதா
  choice: தமது பெயருக்கென
  alternative: தமக்கென
  rationale: ‘பெயர்’ என்ற இறையியல் நிறைவுள்ள வேதாகம மொழியைத் தக்கவைத்து, கடவுளுக்குச் சொந்தமானவர்களாகவும் அவரது பெயரால் அடையாளப்படுத்தப்பட்டவர்களாகவும் இருப்பதன் நுண்பொருளைத் திறந்தவாறு வைக்கிறது.
- issue: ἐπεσκέψατο என்பதை நேரடியாக ‘சந்தித்தார்/வருகை தந்தார்’ என்று மொழிபெயர்ப்பதா
  choice: அவர்கள்மீது அக்கறைகொண்டது
  alternative: அவர்களைச் சந்தித்தது
  rationale: இங்கு உடல்ரீதியான வருகையைவிட கரிசனையுடன் திரும்பிப் பார்த்து நோக்கமுள்ள செயலை மேற்கொள்வதே கருத்து; தமிழ் வாசகருக்கு தவறான நேரடி-வருகைப் பொருள் வராமல் நுண்பொருளை அளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘தமது பெயருக்கென’ என்ற மூலமொழி உருவகம் காக்கப்பட்டுள்ளது; ‘அக்கறைகொண்டது’ என்பது கடவுளின் நோக்கமுள்ள கரிசனையை இயல்பாக வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
