  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: ta
  text: அவர் மனிதக் கைகளால் பணிவிடை பெறுவதில்லை[a]; எதையும் தேவைப்படுகிறவர்போல் அல்ல. அவரே அனைவருக்கும் வாழ்வையும் மூச்சையும் எல்லாவற்றையும் அளிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதக் கைகளால் வழிபடப்படுவதில்லை.” கிரேக்க வினைச்சொல் சமயச் சூழலில் செய்யப்படும் சேவை அல்லது பணிவிடையைக் குறிக்கலாம். இங்கு கடவுள் மனிதரின் பணிவிடைகளைச் சார்ந்தவர் அல்ல என்பதே கருத்து.
    reason: lexical_alternative
