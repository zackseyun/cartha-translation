- from: அவர் ஏதோ ஒன்றைத் தேவைப்படுகிறவர்போல், மனிதக் கைகளால் பணிவிடை செய்யப்படுவதும் இல்லை[a]. அவரே எல்லாருக்கும் வாழ்வையும் மூச்சையும் அனைத்தையும் கொடுக்கிறார்.
  to: அவர் மனிதக் கைகளால் பணிவிடை பெறுவதில்லை[a]; எதையும் தேவைப்படுகிறவர்போல் அல்ல. அவரே அனைவருக்கும் வாழ்வையும் மூச்சையும் எல்லாவற்றையும் அளிக்கிறார்.
