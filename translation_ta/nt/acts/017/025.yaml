- source_word: οὐδὲ
  choice: செய்யப்படுவதும் இல்லை
  rationale: முந்தைய வசனத்தின் மறுப்பைத் தொடரும் οὐδὲ என்பதன் இணைப்பு வலிமையைத் தமிழின் ‘-உம் இல்லை’ அமைப்பு இயல்பாகத் தருகிறது.
theological_decisions:
- issue: θεραπεύεται என்பதை வெளிப்படையாக ‘வழிபடப்படுகிறார்’ என்று மொழிபெயர்ப்பதா, அல்லது பரந்த பணிவிடைச் சொல்லால் மொழிபெயர்ப்பதா
  choice: பணிவிடை செய்யப்படுகிறார்
  alternative: வழிபடப்படுகிறார்
  rationale: பவுலின் கருத்து மனிதரின் சமயச் சேவைகள்மீது கடவுள் சார்ந்திருப்பதில்லை என்பதாகும். ‘பணிவிடை’ என்பது சமயச் சேவையையும் உள்ளடக்குகிறது; ஆனால் உள்ளார்ந்த வழிபாட்டை கடவுள் ஏற்றுக்கொள்வதில்லை என்ற தவறான குறுகிய கருத்தை உண்டாக்காது.
- issue: πᾶσι என்பதன் பரப்பை மனிதர்களுக்கு மட்டும் வரையறுப்பதா
  choice: எல்லாருக்கும்
  alternative: எல்லா மனிதர்களுக்கும்
  rationale: மூலம் பெறுநர்களை ‘மனிதர்கள்’ என்று வெளிப்படையாகக் குறுக்கவில்லை. எனவே அதன் பரந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பணிவிடை’ என்ற சொல் சமயச் சூழலை உணர்த்தியபடியே θεραπεύεται என்பதன் பரந்த பொருளைப் பாதுகாக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
