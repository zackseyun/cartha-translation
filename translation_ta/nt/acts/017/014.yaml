- source_word: οἱ ἀδελφοὶ
  choice: சகோதரர்கள்
  rationale: கிரேக்க மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் தக்கவைக்கிறது; இது சக விசுவாசிகள் அனைவரையும் கூட்டாகக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: πορεύεσθαι
  choice: போகும்படி
  rationale: அனுப்பியதன் நோக்கத்தை எளிமையாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: கடல்வரை
  rationale: கடற்கரை வரையிலான நகர்வைச் சுருக்கமாகக் காட்டுவதோடு, அங்கிருந்து கடல் பயணம் மேற்கொண்டார்களா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: ὑπέμεινάν
  choice: தங்கியிருந்தார்கள்
  rationale: இச்சூழலில் துன்பத்தைச் சகித்தல் என்பதல்லாமல் ஓர் இடத்தில் தொடர்ந்து இருத்தல் என்பதே பொருள்; பவுலின் புறப்பாட்டுடன் உள்ள வேறுபாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: சீலாவும் தீமோத்தேயுவும்
  rationale: τε ... καὶ இணைப்பின் இருவரையும் உள்ளடக்கும் வலியுறுத்தலைத் தமிழ் ‘உம் ... உம்’ அமைப்பு இயல்பாகத் தருகிறது.
- source_word: ἐκεῖ
  choice: அங்கேயே
  rationale: அவர்கள் அதே இடத்தில் தொடர்ந்திருந்ததை ‘ஏ’ வலியுறுத்தல் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: விசுவாசக் குழுவைக் குறிக்கும் ἀδελφοί என்பதன் மொழிபெயர்ப்பு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; விசுவாசிகள்
  rationale: முதன்மை உரை கிரேக்கச் சொல்லின் ஆண்பால் பன்மை வடிவத்தைப் பின்பற்றுகிறது. அதேவேளை, அச்சொல் சக விசுவாசிகள் அடங்கிய முழுக் குழுவையும் குறிக்கக்கூடும் என்ற உள்ளடக்க வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கடல்வரை’ என்ற சுருக்கமான வடிவம் மூலத்தின் திசை/எல்லை சார்ந்த தெளிவின்மையைத் தக்கவைக்கிறது; பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற வடிவங்களில் தரப்பட்டுள்ளன.
