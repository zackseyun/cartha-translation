  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: ta
  text: அப்போது சகோதரர்கள்[a] உடனே பவுலைக் கடல்வரை[b] போகும்படி அனுப்பிவிட்டார்கள். ஆனால் சீலாவும் தீமோத்தேயுவும் அங்கேயே தங்கியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகள்.” கிரேக்க மூலத்தில் “சகோதரர்கள்” என்று உள்ளது; இச்சொல் சக விசுவாசிகள் அனைவரையும் கூட்டாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடலுக்குப் போகும்படி” அல்லது “கடலை நோக்கிப் போகும்படி.” கிரேக்கச் சொற்றொடர் கடற்கரை வரையிலான நகர்வைக் குறிக்கலாம்; அதற்கு மேல் விவரம் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
