source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: ta
  text: இறந்தோரின் உயிர்த்தெழுதலைக் குறித்து அவர்கள் கேட்டபோது, சிலர் ஏளனம் செய்தார்கள். மற்றவர்களோ, “இதைக் குறித்து உம்மிடமிருந்து இன்னொரு முறை கேட்போம்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதைக் குறித்து உம்மை மீண்டும் கேட்போம்.”
    reason: Ἀκουσόμεθά σου என்பதன் நபரைக் குறிக்கும் அமைப்பையும், καὶ πάλιν என்பதன் ‘மீண்டும்’ என்ற வெளிப்படையான பொருளையும் நேரடியாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: அவர்கள் கேட்டபோது
  rationale: இறந்தகால வினையெச்சத்தின் காலச்சூழலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀνάστασιν νεκρῶν
  choice: இறந்தோர் உயிர்த்தெழுவதைப் பற்றி
  rationale: இறந்தவர்களை ஒரு வகுப்பாகக் குறிக்கும் νεκρῶν என்பதையும், உயிர்த்தெழுதல் என்ற மையக் கருத்தையும் தெளிவாகப் பாதுகாக்கிறது; தமிழில் கேட்ட செய்தியின் பொருளாக இயல்பாக அமைகிறது.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: சிலர் ... மற்றவர்களோ
  rationale: இரு குழுக்களின் மாறுபட்ட எதிர்வினையை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: ἐχλεύαζον
  choice: ஏளனம் செய்தார்கள்
  rationale: இகழ்ச்சியுடன் கேலி செய்தல் என்ற வினையின் பொருளை, தேவையற்ற தொடக்க அல்லது தொடர்நிலை நுணுக்கத்தைச் சேர்க்காமல் தெரிவிக்கிறது.
- source_word: Ἀκουσόμεθά σου
  choice: நீர் ... பேசுவதை ... கேட்போம்
  rationale: ஆளைக் குறிக்கும் மரியாதையான ஒருமையையும், அவருக்குச் செவிகொடுப்பது என்ற பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: περὶ τούτου καὶ πάλιν
  choice: இதைப் பற்றி ... இன்னொரு முறையும்
  rationale: περὶ τούτου என்பதன் ‘இதைப் பற்றி’ என்ற பொருளையும் καὶ πάλιν என்பதன் மீண்டும்/மற்றொரு முறை என்ற வெளிப்படையான பொருளையும் பிரதான உரையிலேயே பாதுகாக்கிறது.
theological_decisions:
- issue: புறவினத்தார் கலந்திருந்த கேட்போர் சூழலில் ἀνάστασιν νεκρῶν என்பதன் பொருள்
  choice: இறந்தோர் உயிர்த்தெழுதல்
  alternative: இறந்தோரிலிருந்து உயிர்த்தெழுதல்
  rationale: மூலமொழித் தொடர் இறந்தோரை ஒரு வகுப்பாகக் கொண்டு உயிர்த்தெழுதல் என்ற கருத்தைக் குறிக்கிறது. ஒரே நபர் இறந்தோரிலிருந்து எழுதல் என்று பொருளைச் சுருக்காமல் அதன் பொதுவான வடிவம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. பவுலை நோக்கிய ஒருமை மரியாதைக்கு ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது; δὲ தனியே ‘இப்போது’ என்று மொழிபெயர்க்கப்படாமல், வாக்கிய ஓட்டத்திலும் ‘மற்றவர்களோ’ என்ற எதிர்மறை இணைப்பிலும் அதன் உரையாடல் பணி வெளிப்படுத்தப்பட்டுள்ளது.
