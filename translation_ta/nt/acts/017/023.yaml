source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: ta
  text: ஏனெனில், நான் கடந்து சென்று, உங்கள் வழிபாட்டுப் பொருள்களைக் கூர்ந்து கவனித்தபோது, ‘அறியப்படாத கடவுளுக்கு’ என்று பொறிக்கப்பட்டிருந்த ஒரு பலிபீடத்தைக்கூட கண்டேன்.[a] ஆகவே, நீங்கள் அறியாமல் எதை வழிபடுகிறீர்களோ, அதையே நான் உங்களுக்கு அறிவிக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறியப்படாத ஒரு கடவுளுக்கு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கக் கல்வெட்டு வாசகத்தில் திட்டவட்ட உருபு இல்லை; எனவே வரையறையற்ற வாசிப்பும் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διερχόμενος
  choice: உங்கள் நகரத்தின் வழியாகச் சென்று
  rationale: நகரத்தின் வழியே பவுல் சென்றுகொண்டிருந்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலிலிருந்து தெளிவாகும் ‘நகரத்தின்’ என்பது வாசிப்புத் தெளிவுக்காகச் சேர்க்கப்பட்டது.
- source_word: ἀναθεωρῶν
  choice: கூர்ந்து கவனித்தபோது
  rationale: வெறுமனே பார்த்தல் அல்லாமல் கவனமாக ஆராய்ந்து நோக்கும் பொருளை எடுத்துரைக்கிறது.
- source_word: τὰ σεβάσματα
  choice: நீங்கள் வழிபடும் பொருள்கள்
  rationale: வழிபாட்டுக்குரிய சிலைகள், சின்னங்கள், புனிதப் பொருள்கள் முதலியவற்றை உள்ளடக்கக்கூடிய கிரேக்கச் சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: βωμὸν
  choice: பலிபீடம்
  rationale: βωμός என்பதற்கான வழக்கமான, தெளிவான தமிழ் வேதாகமச் சொல்.
- source_word: ἐπεγέγραπτο
  choice: பொறிக்கப்பட்டிருந்த
  rationale: பலிபீடத்தின் மேல் முன்பே எழுதப்பட்டிருந்த கல்வெட்டு போன்ற எழுத்தைக் குறிக்கும் செயப்பாட்டு இறந்தநிறைவு நுணுக்கத்தை இயல்பாகத் தருகிறது.
- source_word: Ἀγνώστῳ θεῷ
  choice: அறியப்படாத ஒரு கடவுளுக்கு
  rationale: கிரேக்கத்தில் குறிப்புச் சுட்டு உருபு இல்லாததால், அர்ப்பணிப்பு வாசகத்தை இயல்பான தமிழில் வரையறையற்ற முறையில் தருகிறது.
- source_word: ὃ οὖν
  choice: ஆகவே ... எதை ... அதையே
  rationale: οὖν என்பதன் முடிவுரைக் தொடர்பையும், ὃ என்ற அஃறிணை உறவுப்பெயரின் வடிவத்தையும் பாதுகாக்கிறது.
- source_word: ἀγνοοῦντες
  choice: அறியாமல்
  rationale: ‘அறியப்படாத’ என்ற கல்வெட்டு வாசகத்துடனான சொல்லியல் தொடர்பைத் தக்கவைத்து, வழிபடும் விதத்தை இயல்பான தமிழில் கூறுகிறது.
- source_word: εὐσεβεῖτε
  choice: வழிபடுகிறீர்கள்
  rationale: இச்சூழலில் பக்தியுடன் மதிப்புச் செலுத்தும் மதச்செயலை சாதாரண வாசகருக்குத் தெளிவாகக் கூறுகிறது.
- source_word: καταγγέλλω
  choice: அறிவிக்கிறேன்
  rationale: பொதுவாகவும் அதிகாரத்துடனும் பிரகடனம் செய்வதைக் குறிக்கும்; நவீனத் தமிழில் இயல்பானது.
theological_decisions:
- issue: ὃ என்ற அஃறிணை உறவுப்பெயரின் குறிப்பு
  choice: “நீங்கள் அறியாமல் எதை வழிபடுகிறீர்களோ” என்று அஃறிணை வடிவில் மொழிபெயர்க்கப்பட்டது.
  alternative: “நீங்கள் அறியாமல் யாரை வழிபடுகிறீர்களோ”
  rationale: மூல கிரேக்கம் ஆண்பால் ‘யாரை’ என்பதற்குப் பதிலாக அஃறிணை ‘எதை’ பயன்படுத்துகிறது. பவுலின் வாதத்தில் உள்ள இறையியல் பதற்றத்தை முன்கூட்டியே தனிப்பட்ட குறிப்பாகத் தீர்மானிக்காமல் இது பாதுகாக்கிறது.
- issue: Ἀγνώστῳ θεῷ என்பதில் குறிப்புச் சுட்டு உருபு இல்லாமை
  choice: “அறியப்படாத ஒரு கடவுளுக்கு”
  alternative: “அறியப்படாத கடவுளுக்கு”
  rationale: கிரேக்கத்தில் உருபு இல்லை; தமிழில் ‘ஒரு’ என்பது வரையறையற்ற வாசிப்பை வெளிப்படுத்துகிறது. இருப்பினும் அர்ப்பணிப்புக் கல்வெட்டு நடையில் ‘ஒரு’ இல்லாத மொழிபெயர்ப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் நீண்ட வாக்கிய ஓட்டம் பாதுகாக்கப்பட்டாலும், தமிழ் வாசிப்புத் தெளிவுக்கேற்ற வினையெச்ச மற்றும் தொடர்புச் சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன. அஃறிணை ὃ திட்டமிட்டு ‘எதை’ எனத் தக்கவைக்கப்பட்டுள்ளது.
