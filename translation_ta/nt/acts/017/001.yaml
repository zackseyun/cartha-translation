id: ACT.17.1
reference: Acts 17:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: ta
  text: அவர்கள் அம்பிப்போலி, அப்பொல்லோனியா ஆகிய நகரங்கள் வழியாகச் சென்று, தெசலோனிக்கே நகரத்துக்கு வந்தார்கள். அங்கே யூதர்களுடைய ஒரு ஜெபக்கூடம் இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: வழியாகச் சென்று
  rationale: முந்திய செயலைக் குறிக்கும் இறந்தகால வினையெச்சம்; அந்த நகரங்களைக் கடந்து பயணித்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான கதைத் தொடர்ச்சியை மட்டும் குறிக்கிறது; தமிழில் தனிச் சொல்லைச் சேர்க்காமல் வாக்கியத் தொடரால் இயல்பாக வெளிப்படுகிறது.
- source_word: Ἀμφίπολιν
  choice: அம்பிப்போலி
  rationale: கிரேக்க இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ἀπολλωνίαν
  choice: அப்பொல்லோனியா
  rationale: கிரேக்க இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: ἦλθον
  choice: வந்தார்கள்
  rationale: ἔρχομαι என்பதன் எளிய நகர்வுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: εἰς Θεσσαλονίκην
  choice: தெசலோனிக்கேவுக்கு
  rationale: ஒரு நகரத்தை நோக்கிய நகர்வைத் தமிழின் இலக்கு வேற்றுமையால் இயல்பாகக் காட்டுகிறது.
- source_word: ὅπου
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் தொடர்புச் சொல்லைத் தமிழில் இயல்பான தனி வாக்கியத் தொடக்கமாக வழங்குகிறது.
- source_word: συναγωγὴ
  choice: ஒரு ஜெபக்கூடம்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு குறிப்புச் சுட்டு இல்லை; ஆகவே ‘ஒரு’ என்பது இயல்பான வாசிப்பை அளிக்கிறது. ‘ஜெபக்கூடம்’ யூதர்களின் கூடுகை மற்றும் வழிபாட்டு இடத்தைத் தமிழில் வழக்கமாகக் குறிக்கிறது.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களுடைய
  rationale: சமூகச் சார்பு அல்லது உடைமையைக் குறிக்கும் கிரேக்கப் பிறப்புவேற்றுமையை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கதைச் சூழலில் Ἰουδαίων என்பதன் மொழிபெயர்ப்பு
  choice: யூதர்களுடைய
  alternative: யூதேயர்களுடைய / யூத மக்களுடைய
  rationale: இங்கு சொல் யூதேயா பகுதியைச் சேர்ந்தவர்களை மட்டும் அல்லாமல், தெசலோனிக்கேயில் ஜெபக்கூடத்துடன் தொடர்புடைய யூதச் சமூகத்தைக் குறிக்கிறது. ‘யூதர்கள்’ என்பது நேரடியும் புவியியல் குழப்பமற்றதுமாகும்.
- issue: குறிப்புச் சுட்டில்லாத συναγωγὴ
  choice: ஒரு ஜெபக்கூடம்
  alternative: அந்த ஜெபக்கூடம்
  rationale: கிரேக்க மூலத்தில் συναγωγή என்பதற்கு முன் குறிப்புச் சுட்டு இல்லை. எனவே ‘ஒரு’ என்று மொழிபெயர்ப்பது வடிவத்தையும் இயல்பான தமிழையும் காக்கிறது; குறிப்பிட்ட ஒரே ஜெபக்கூடம் என்ற கருத்தைத் தேவையின்றி திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாய் இருந்தாலும் கண்ணியமான கதைநடை. இடப்பெயர்கள் கிரேக்க வடிவத்துக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன. மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை.
