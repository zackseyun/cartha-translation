  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: ta
  text: ஆனால் சில ஆண்கள் அவரோடு இணைந்துகொண்டு நம்பினார்கள்.[a] அவர்களில் அரியோப்பக மன்றத்தைச் சேர்ந்த தியோனீசியுவும்,[b] தாமரிஸ் என்னும் ஒரு பெண்ணும், அவர்களுடன் வேறு சிலரும் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவரோடு தங்களை இணைத்துக்கொண்டார்கள்” அல்லது “அவரைப் பற்றிக்கொண்டார்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் பவுலுடன் ஏற்பட்ட நெருக்கமான தனிப்பட்ட தொடர்பை உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “அரியோப்பக மன்றத்தைச் சேர்ந்தவர்” என்பது அந்த மன்றத்தின் ஓர் உறுப்பினர் என்றோ, அதனுடன் தொடர்புடையவர் என்றோ பொருள்படலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: ஆனால் சில ஆண்கள்
  rationale: முந்தைய வசனத்தின் எதிர்வினைகளுடன் உள்ள மென்மையான முரண்பாட்டை δὲ குறிக்கிறது; ἄνδρες இங்கு வெளிப்படையாக ஆண்பாலைக் குறிக்கிறது.
- source_word: κολληθέντες αὐτῷ
  choice: அவரோடு சேர்ந்துகொண்டு
  rationale: κολλάομαι என்பது ஒருவருடன் நெருக்கமாக இணைந்து அவரைச் சார்ந்துகொள்வதை உணர்த்துகிறது; தமிழில் இயல்பாகவும் மிகை விளக்கமின்றியும் இவ்வாறு வருகிறது.
- source_word: ἐπίστευσαν
  choice: நம்பினார்கள்
  rationale: வினையின் நேரடியான பொருளைப் பேணுகிறது; நம்பிக்கையின் மறைமுகப் பொருளை பவுல் என்று தவறாகக் குறிப்பிடுவதில்லை.
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: அரெயோபாகு மன்றத்தைச் சேர்ந்த தியோனீசியு
  rationale: பெயரைத் தமிழில் ஒலிபெயர்த்து, Ἀρεοπαγίτης என்பதன் நிறுவனத் தொடர்பை சாதாரண வாசகர் புரிந்துகொள்ளும் வகையில் வெளிப்படுத்துகிறது; அந்தத் தொடர்பின் துல்லியம் குறித்த தெளிவின்மையை அடிக்குறிப்பு பேணுகிறது.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: தாமரிஸ் என்னும் ஒரு பெண்
  rationale: பாலினத்தையும் தனிப்பெயரையும் நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: இவர்களோடு வேறு சிலரும்
  rationale: பெயர் குறிப்பிடப்பட்ட இருவரைத் தவிர மேலும் இருந்தவர்களையும், அவர்களுடனான தொடர்பையும் சுருக்கமாகப் பேணுகிறது.
theological_decisions:
- issue: இச்சூழலில் πιστεύω என்பதன் தன்மை
  choice: நம்பினார்கள்
  alternative: விசுவாசத்திற்கு வந்தார்கள்
  rationale: பவுலின் அறிவிப்புக்குப் பதிலாக ஏற்பட்ட உண்மையான நம்பிக்கையை உரை தெரிவிக்கிறது; ஆனால் இங்கு முழுமையான கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை. எனவே நேரடியான வினைச்சொல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. கிரேக்க உரையின் ஆண்பால் குறிப்பும், πιστεύω வினையின் பொருள் சார்ந்த திறந்தநிலையும் பேணப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
