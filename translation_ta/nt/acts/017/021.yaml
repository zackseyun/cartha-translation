translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிரேக்க ஒப்புமை வடிவத்தின் நுணுக்கத்தை ‘புதிதிலும் புதிதான’ என முதன்மை உரையில் காத்து, எளிய மாற்றை அடிக்குறிப்பில் தருகிறது.
