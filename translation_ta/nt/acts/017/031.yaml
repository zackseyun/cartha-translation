source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: ta
  text: ஏனெனில், அவர் ஒரு நாளை நிர்ணயித்திருக்கிறார்; தான் நியமித்த ஒரு மனிதரைக் கொண்டு, அந்த நாளில் மக்கள் வாழும் உலகம் முழுவதையும் நீதியின்படி[a] நியாயந்தீர்க்கப் போகிறார். அந்த மனிதரை இறந்தோரிலிருந்து உயிர்த்தெழச் செய்ததன் மூலம், இதற்கான சான்றை அனைவருக்கும் அளித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியோடு” அல்லது “நியாயத்தோடு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அனைவருக்கும் உறுதியளித்தார்”; இன்னும் சொல்லுக்குச் சொல்ல, “அனைவருக்கும் நம்பிக்கையை அளித்தார்.” இங்கு πίστιν παρασχὼν என்ற சொற்றொடர் பொதுவான சான்று அல்லது உறுதியைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: ஏனெனில்
  rationale: முந்தைய மனந்திரும்புதலுக்கான அழைப்பின் காரணத்தை அறிமுகப்படுத்தும் causal force-ஐ இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: ἔστησεν ἡμέραν
  choice: ஒரு நாளை நிர்ணயித்திருக்கிறார்
  rationale: குறிப்பிட்ட ஒரு நாளை உறுதியாக அமைத்தார் அல்லது நியமித்தார் என்ற பொருளைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: அந்த நாளில் ... நியாயந்தீர்க்கப் போகிறார்
  rationale: μέλλει என்பதிலுள்ள நோக்கமுடைய எதிர்காலச் செயல் நுணுக்கத்தை வெறும் எதிர்கால வினையைவிடத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τὴν οἰκουμένην
  choice: மக்கள் வாழும் உலகம் முழுவதையும்
  rationale: οἰκουμένη என்பதன் ‘குடியிருக்கும் உலகம்’ என்ற அடிப்படைப் பொருளையும் தீர்ப்பின் உலகளாவிய மனிதப் பரப்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐν δικαιοσύνῃ
  choice: நீதியுடன்
  rationale: δικαιοσύνη என்பதன் நீதி/நீதிநெறி சார்ந்த பரப்பைத் தீர்ப்புச் சூழலில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: தாம் நியமித்த ஒரு மனிதரைக் கொண்டு
  rationale: ἀνήρ என்பதன் ஆண் மனிதர் என்ற துல்லியத்தையும், பெயர்ச்சொல்லுக்கு article இல்லாத வடிவையும் பாதுகாக்கிறது; ἐν இங்கு செயலின் கருவி அல்லது முகவர் பொருளில் இயல்பான தமிழாக ‘கொண்டு’ என வழங்கப்பட்டுள்ளது.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: இதற்கான சான்றை அனைவருக்கும் அளித்தார்
  rationale: παρέχω உடன் வரும் πίστις இச்சூழலில் நம்பிக்கை என்ற தனிப்பட்ட மனநிலையைவிட பொதுவான உறுதி அல்லது சான்றைக் குறிக்கிறது. ‘சான்று’ உயிர்த்தெழுதல் நியமிக்கப்பட்ட நீதிபதியை உறுதிப்படுத்துவதைக் காட்டுகிறது.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: அந்த மனிதரை இறந்தோரிலிருந்து உயிர்த்தெழச் செய்ததன் மூலம்
  rationale: aorist participle-ஐ சான்றளித்த வழிமுறையாக எடுத்துக்கொண்டு, ἐκ νεκρῶν என்பதன் பன்மை வடிவையும் தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதியுடன்
  alternative: நியாயத்துடன்; நீதிநெறியின்படி
  rationale: தீர்ப்புச் சூழலில் நீதியும் நியாயமும் இரண்டும் பொருந்துகின்றன. மூலச்சொல்லின் பரந்த நெறிசார் பொருளைச் சுருக்கிவிடாமல் ‘நீதியுடன்’ முதன்மையாக வைக்கப்பட்டு, மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πίστιν παρασχὼν πᾶσιν என்பதன் பொருள்
  choice: சான்றை அனைவருக்கும் அளித்தார்
  alternative: அனைவருக்கும் உறுதியளித்தார்; சொல்லுக்குச் சொல், அனைவருக்கும் நம்பிக்கையை அளித்தார்
  rationale: இச்சொற்றொடர் வழக்கில் public assurance/proof என்ற பொருளைக் கொடுக்கிறது. ‘நம்பிக்கை’ என்று மட்டும் மொழிபெயர்ப்பது இங்கு உயிர்த்தெழுதலின் உறுதிப்படுத்தும் செயல்பாட்டை மறைக்கக்கூடும்; இருப்பினும் சொற்படியான வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ἀνδρὶ என்பதன் பாலினத் துல்லியமும் குறிப்புத்தன்மையும்
  choice: ஒரு மனிதர்
  alternative: அந்த மனிதர்
  rationale: ἀνήρ ஆண் மனிதரைக் குறிக்கிறது; Greek article இல்லாததால் ‘ஒரு மனிதர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. சூழலில் அவர் இயேசு என்பது தெளிவாயினும், மொழிபெயர்ப்பு பெயரைச் சேர்த்து ambiguity-ஐ முன்கூட்டியே தீர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட Greek வாக்கியம் தமிழின் இயல்புக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் causal தொடர்பும், தீர்ப்புக்காக நிர்ணயிக்கப்பட்ட நாளும், நியமிக்கப்பட்ட மனிதரும், உயிர்த்தெழுதலால் அளிக்கப்பட்ட சான்றும் அசல் வரிசைக்கு நெருக்கமாகப் பாதுகாக்கப்பட்டுள்ளன.
