id: ACT.17.26
reference: Acts 17:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: ta
  text: ஒரே மனிதனிலிருந்து மனிதர்களின் ஒவ்வோர் இனத்தையும் அவர் உருவாக்கி, பூமியின் முழுப் பரப்பிலும் வாழச் செய்தார்[a]. அவர்களுக்கு நியமிக்கப்பட்ட காலங்களையும் அவர்கள் வாழிடத்தின் எல்லைகளையும் அவர் நிர்ணயித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘ஒருவரிலிருந்து’ என்பதற்குப் பதிலாக ‘ஒரே இரத்தத்திலிருந்து’ என்று உள்ளது. முதன்மை உரை SBLGNT-யின் ‘ஒருவரிலிருந்து’ என்ற வாசகத்தைப் பின்பற்றுகிறது; தெளிவுக்காக ‘மனிதன்’ என்ற சொல் தமிழில் சேர்க்கப்பட்டுள்ளது.
    reason: textual_variant
  - marker: b
    text: ‘அவர்களுக்காக அமைக்கப்பட்ட காலங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: உருவாக்கி
  rationale: ποιέω இங்கு மனித இனங்களின் பொதுத் தோற்றத்தை ஏற்படுத்தியதைக் குறிக்கிறது. ‘உருவாக்கினார்’ என்பது இயல்பான தமிழாகவும், ஒன்றுமில்லாமையிலிருந்து படைத்தார் என்ற கருத்தைத் தேவையின்றி குறிப்பாக்காமலும் உள்ளது.
- source_word: τε
  choice: வாக்கியத் தொடர்பால் வெளிப்படுத்தப்பட்டது
  rationale: τέ முந்தைய கருத்தோடு இக்கூற்றை இணைக்கிறது. தமிழில் தனியாக ‘மேலும்’ சேர்ப்பதைவிட தொடர்ச்சியான வாக்கிய அமைப்பு அந்த இணைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξ ἑνὸς
  choice: ஒரே மனிதனிலிருந்து
  rationale: மூலத்தில் நேரடியாக ‘ஒருவரிலிருந்து’ என்றே இருந்தாலும், மனிதனைச் சுட்டுவது சூழலில் மறைமுகமாக உள்ளது. தமிழில் தெளிவுக்காக ‘மனிதன்’ சேர்க்கப்பட்டுள்ளது; ‘ஒரே இரத்தத்திலிருந்து’ என்ற பிற்பட்ட வாசகம் முதன்மை உரையில் ஏற்கப்படவில்லை.
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: மனிதர்களின் ஒவ்வோர் இனத்தையும்
  rationale: ἔθνος தனித்தனி மக்கள் இனங்களைக் குறிக்கிறது; πᾶν என்பதன் பகிர்ந்தளிக்கும் வலிமையை ‘ஒவ்வோர்’ காக்கிறது. ἀνθρώπων மனிதர்கள் அனைவரையும் உள்ளடக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κατοικεῖν
  choice: வாழச் செய்தார்
  rationale: இறந்தகால வினையோடு இணைந்த நோக்கம் அல்லது விளைவைக் குறிக்கும் infinitive-ஐ இயல்பான தமிழில் காரணவினை அமைப்பு வெளிப்படுத்துகிறது.
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: பூமியின் முழுப் பரப்பிலும்
  rationale: πρόσωπον இவ்வழக்கில் பூமியின் முகம் அல்லது மேற்பரப்பைக் குறிக்கிறது. ‘முழுப் பரப்பிலும்’ என்பது அந்தப் படிமத்தின் பொருளை தெளிவான நவீன தமிழில் தருகிறது.
- source_word: ὁρίσας
  choice: நிர்ணயித்தார்
  rationale: காலங்களையும் எல்லைகளையும் வரையறுத்து அமைத்த செயலை ‘நிர்ணயித்தார்’ துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: προστεταγμένους καιρούς
  choice: அவர்களுக்கு நியமிக்கப்பட்ட காலங்கள்
  rationale: καιροί முக்கியமான காலப்பகுதிகள் அல்லது பருவங்களைக் குறிக்கிறது; προστεταγμένους அவை நியமிக்கப்பட்டவை என்பதைக் காட்டுகிறது. சூழலிலுள்ள இனங்களைச் சுட்ட ‘அவர்களுக்கு’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὁροθεσίας
  choice: எல்லைகள்
  rationale: ὁροθεσία வாழும் பகுதிகளுக்கான வரம்புகள் அல்லது எல்லைகளைக் குறிக்கிறது; ‘எல்லைகள்’ நவீன தமிழில் நேரான இணைச்சொல்.
- source_word: τῆς κατοικίας αὐτῶν
  choice: அவர்கள் வாழிடத்தின்
  rationale: κατοικία குடியிருப்பு அல்லது வாழும் இடத்தைக் குறிக்கிறது. கிரேக்க ஒருமையின் கூட்டுப் பொருளைத் தமிழ் ஒருமையான ‘வாழிடம்’ காக்கிறது.
theological_decisions:
- issue: ἐξ ἑνὸς என்பதில் மறைமுகமாக உள்ள சுட்டுப்பொருளை வெளிப்படையாக்க வேண்டுமா
  choice: ஒரே மனிதனிலிருந்து
  alternative: ஒருவரிலிருந்து / ஒரே மூதாதையிடமிருந்து
  rationale: SBLGNT உரையில் ‘இரத்தம்’ இல்லை; ஆகவே அந்த மாற்று வாசகம் முதன்மை உரையில் புகுத்தப்படவில்லை. வெறும் ‘ஒருவரிலிருந்து’ என்பது தமிழில் தெளிவற்றதாக அமையலாம் என்பதால், மனிதகுலத்தின் பொதுத் தோற்றத்தைச் சுட்டும் மறைமுகப் பொருள் ‘மனிதன்’ என வெளிப்படுத்தப்பட்டுள்ளது.
- issue: ἀνθρώπων என்பதன் பாலினம் உள்ளடக்கிய மனிதகுலப் பொருள்
  choice: மனிதர்களின்
  alternative: மனிதகுலத்தின்
  rationale: இச்சொல் ஆண்களை மட்டும் அல்லாமல் மனிதர்கள் அனைவரையும் குறிக்கிறது. ‘மனிதர்களின்’ என்பது மூலத்தின் மனிதக் குழுக்களைக் குறிக்கும் அமைப்பைக் காக்கிறது; அதை முற்றிலும் கருத்தாக்கமான ‘மனிதகுலம்’ என்று சமப்படுத்தவில்லை.
- issue: கடவுளின் நிர்ணயமும் மனித இனங்களின் காலம் மற்றும் வாழிடமும்
  choice: நியமிக்கப்பட்ட காலங்களையும் வாழிடத்தின் எல்லைகளையும் அவர் நிர்ணயித்தார்
  alternative: அவர்களுக்காக அமைக்கப்பட்ட காலங்களையும் அவர்கள் குடியிருக்கும் வரம்புகளையும் அவர் தீர்மானித்தார்
  rationale: மூலம் கடவுளின் எல்லை நிர்ணயிக்கும் செயலைக் கூறுகிறது; ஆனால் ஒவ்வோர் இனத்தின் வரலாற்று விதியைப் பற்றிய கூடுதல் இறையியல் விளக்கத்தை வழங்கவில்லை. மொழிபெயர்ப்பு அந்தத் திடத்தன்மையையும் வரம்பையும் மட்டும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பூமியின் முகமெங்கும்’ என்ற சொற்சொல் வடிவத்தைவிட ‘பூமியின் முழுப் பரப்பிலும்’ இயல்பாக உள்ளது. மூலத்தின் ஒரே நீண்ட வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கருத்துத் தொடர்பும் கடவுளே இரு செயல்களுக்கும் எழுவாய் என்பதும் காக்கப்பட்டுள்ளன.
