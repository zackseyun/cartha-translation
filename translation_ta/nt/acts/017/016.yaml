  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: ta
  text: பவுல் அத்தேனே நகரத்தில் அவர்களுக்காகக் காத்திருந்தபோது, அந்த நகரம் சிலைகளால் நிறைந்திருப்பதைக் கண்டு, அவருடைய ஆவி அவருக்குள் கடுமையாகக் கிளர்ந்தது[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடுமையாகக் கலங்கியது” அல்லது “கொந்தளித்தது.” கிரேக்க வினைச்சொல் கூர்மையான உளக் கிளர்ச்சியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த நகரம் சிலைகளுக்கு முற்றிலும் ஒப்புக்கொடுக்கப்பட்டிருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: காத்திருந்தபோது
  rationale: இறந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த காத்திருப்பையும், முதன்மை நிகழ்வுக்கான காலச் சூழலையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: παρωξύνετο
  choice: கொந்தளித்தது
  rationale: இவ்வினைச்சொல் குறிக்கும் கூர்மையான உளக் கிளர்ச்சியை வெறும் வருத்தமாகக் குறுக்காமல், இயல்பான தமிழில் வலிமையுடன் வெளிப்படுத்துகிறது.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: அவருடைய ஆவி
  rationale: உடைமைச் சுட்டுடன் வரும் πνεῦμα என்பதன் நேரடியான பொருளைப் பாதுகாக்கிறது; பரிசுத்த ஆவியை மொழிபெயர்ப்பில் வெளிப்படையாகக் கொண்டுவரவில்லை.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள்
  rationale: பவுலின் எதிர்வினை அவருடைய உள்ளார்ந்த நிலையில் நிகழ்ந்ததைத் தெளிவாகக் காட்டுகிறது; மூலத்தில் உள்ள வலியுறுத்தலையும் காக்கிறது.
- source_word: θεωροῦντος
  choice: கண்டு
  rationale: கவனித்துப் பார்த்ததால் ஏற்பட்ட எதிர்வினையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: κατείδωλον
  choice: சிலைகளால் நிறைந்திருப்பதை
  rationale: நகரம் சிலைகளால் நிரம்பியிருந்தது என்ற அரிய பெயரடையின் வலுவான, நேரடியான பொருளை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: πόλιν
  choice: அந்த நகரம்
  rationale: முன்னர் குறிப்பிடப்பட்ட அத்தேனே நகரத்தையே சுட்டும் மூலத்தின் ‘நகரம்’ என்ற சொல்லைத் தக்கவைக்கிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான முரண்பாட்டைக் காட்டாமல் கதைத் தொடரை நகர்த்துகிறது; தமிழில் காலத் துணைவாக்கிய அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவருடைய ஆவி’ என்பதன் குறிப்பு
  choice: பவுலின் சொந்த மனித ஆவி அல்லது உள்ளார்ந்த தன்மை
  alternative: பரிசுத்த ஆவியானவர் பவுலைத் தூண்டினார் என்ற மறைமுகக் குறிப்பு
  rationale: ‘அவருடைய ஆவி’ என்ற உடைமை அமைப்பும் ‘அவருக்குள்’ என்ற சொற்றொடரும் பவுலின் உள்ளார்ந்த எதிர்வினையைக் குறிக்கின்றன. இந்த எதிர்வினையைப் பரிசுத்த ஆவியானவருக்குத் தெளிவாக உரியதாக்காத மூலத்தின் வரம்பும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘ஆவி’ மற்றும் ‘அவருக்குள்’ ஆகிய நேரடி கூறுகள் மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கின்றன; ‘கொந்தளித்தது’ கூர்மையான உளக் கிளர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
