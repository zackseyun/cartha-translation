base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: ta
  text: ஆகவே, அவர் யூத வழிபாட்டுக்கூடத்தில் யூதர்களோடும் கடவுளை வழிபட்டவர்களோடும்[a], ஒவ்வொரு நாளும் பொதுச் சந்தையில்[b] அங்கிருந்தவர்களோடும் கலந்துரையாடி வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுளுக்குப் பயந்தவர்கள்’ என்றும் மொழிபெயர்க்கலாம். யூத வழிபாட்டுடன் தொடர்புகொண்டிருந்த யூதரல்லாதவர்களைக் குறிக்கும் சொல்லாகவும் இது பயன்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பொதுச் சந்தை’ என்பது பொருள்களை வாங்கி விற்கும் இடம் மட்டுமல்ல; மக்கள் கூடிவந்த குடிமை வாழ்வின் பொது வெளியுமாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: கலந்துரையாடினார்
  rationale: இறந்தகாலத் தொடர்வினை வடிவம் வழக்கமாகத் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நிகழ்ந்த உரையாடலைக் குறிக்கிறது. ‘கலந்துரையாடினார்’ என்பது பரஸ்பர உரையாடலையும் காரணங்களை முன்வைத்து ஆராய்வதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் பேச்சு அல்லது கடுமையான விவாதம் எனப் பொருளைக் குறுக்கவில்லை.
- source_word: μὲν οὖν
  choice: ஆகவே
  rationale: முந்தைய சூழலிலிருந்து தொடர்ச்சியையும் விளைவையும் குறிக்கும் இணைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συναγωγῇ
  choice: யூத வழிபாட்டுக்கூடத்தில்
  rationale: இங்கு யூதர்களின் அடையாளம் பெற்ற வழிபாட்டு மற்றும் கூடுகை இடத்தைக் குறிக்கிறது. பொதுவாசகர்களுக்கு உடனடியாகப் புரியும் தமிழாக்கம்.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்களோடும்
  rationale: இச்சூழலில் யூத வழிபாட்டுக்கூடத்தில் இருந்த யூத சமூகத்தினரைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: τοῖς σεβομένοις
  choice: கடவுளை வழிபட்டவர்களோடும்
  rationale: சொல்லுக்குச் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், அப்போஸ்தலர் பணிகள் நூலின் பயன்பாடும் வழிபாட்டுக்கூடச் சூழலும் ‘கடவுளை’ எனப் பொருளை நிறைவு செய்ய ஆதரிக்கின்றன. தொழில்நுட்பப் பெயரை முதன்மை உரையில் திணிக்காமல் தெளிவாகத் தருகிறது.
- source_word: ἀγορᾷ
  choice: பொதுச் சந்தையில்
  rationale: வாங்கல் விற்பனை மட்டுமல்லாமல் குடிமக்கள் கூடும் பொது வெளியையும் குறித்ததால், ‘பொதுச் சந்தை’ இரு அம்சங்களையும் சுருக்கமாகக் காட்டுகிறது; அடிக்குறிப்பு வரலாற்றுச் சூழலை விளக்குகிறது.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: ஒவ்வொரு நாளும்
  rationale: தினந்தோறும் நிகழ்ந்த தொடர்ச்சியான செயல்பாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: அப்போது அங்கிருந்தவர்களோடும்
  rationale: தற்செயலாக அங்கு இருந்த அல்லது அங்கே எதிர்ப்பட்டவர்களை உள்ளடக்குகிறது; ‘வழிப்போக்கர்கள்’ என்று பொருளைக் குறுக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: τοῖς σεβομένοις என்பவர்களின் அடையாளம்
  choice: முதன்மை உரையில் ‘கடவுளை வழிபட்டவர்கள்’; அடிக்குறிப்பில் யூதரல்லாத பின்னணி
  alternative: ‘கடவுளுக்குப் பயந்தவர்கள்’ என்ற தொழில்நுட்பப் பெயர்
  rationale: மூலச் சொற்றொடர் நேரடியாக இன அடையாளத்தையோ தொழில்நுட்ப வகைப்பாட்டையோ கூறவில்லை. அப்போஸ்தலர் பணிகள் நூலின் சூழலில் இவர்கள் யூத வழிபாட்டுடன் தொடர்புடைய யூதரல்லாதவர்கள் எனப் புரிந்துகொள்ளப்படுவதால், அந்தத் தகவல் உரையை விட அடிக்குறிப்பில் பாதுகாப்பாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கிய அமைப்பு தமிழில் தெளிவாக அமைய அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது. இரு இடங்களிலும் நிகழ்ந்த தொடர்ச்சியான செயலைத் தெளிவுபடுத்த ‘கலந்துரையாடினார்’ மீண்டும் வழங்கப்பட்டுள்ளது; எல்லா அடிக்குறிப்பு குறிகளும் உரையில் பொருத்தப்பட்டுள்ளன.
