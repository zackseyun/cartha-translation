source:
  edition: SBLGNT
  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: ta
  text: ஆகவே, அவர்களில் பலர் நம்பினார்கள். மேலும், உயர்ந்த சமூக நிலையிலிருந்த[a] கிரேக்கப் பெண்கள் பலரும் நம்பினார்கள்; நம்பிய ஆண்களும் குறைவானோர் அல்லர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மரியாதைக்குரிய’ அல்லது ‘உயர் சமூக அந்தஸ்துடைய’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘குறைவானோர் அல்லர்’ என்று உள்ளது; இது கணிசமான எண்ணிக்கையினரைக் குறிக்கும் வலியுறுத்தும் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: ஆகவே, ... பலர்
  rationale: μὲν οὖν முந்தைய வசனத்தில் அவர்கள் வேதவாக்குகளை ஆராய்ந்ததன் விளைவையும் உரையின் அடுத்த கட்டத்திற்கான மாற்றத்தையும் குறிக்கிறது. ‘ஆகவே’ அந்தத் தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐξ αὐτῶν
  choice: அவர்களில்
  rationale: இது முன்பு குறிப்பிடப்பட்ட பெரோயா மக்களைப் பகுதியளவில் சுட்டுகிறது; ‘அவர்களில்’ என்பது ἐξ என்பதன் பகுதிப்பொருளை இயல்பாகக் காக்கிறது.
- source_word: ἐπίστευσαν
  choice: நம்பினார்கள்
  rationale: விசுவாசத்தின் பொருள் சூழலிலிருந்து புரிந்துகொள்ளப்படுவதால், மூலத்தில் இல்லாத விரிவான கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் வினையை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: கிரேக்கப் பெண்களில்
  rationale: Ἑλληνίδων அவர்களை கிரேக்கப் பெண்களாக அடையாளப்படுத்துகிறது; இங்கு திருமண உறவு குறிப்பிடப்படாததால் γυναικῶν என்பதற்கு ‘பெண்கள்’ பொருத்தமானது.
- source_word: τῶν εὐσχημόνων
  choice: சமுதாயத்தில் உயர்நிலையில் இருந்த
  rationale: இச்சூழலில் εὐσχήμων சமூக மதிப்பையும் உயர்ந்த நிலையையும் குறிக்கிறது. இந்தச் சொற்றொடர் நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘மரியாதைக்குரிய’ என்ற நற்பண்பு சார்ந்த ஒரே பொருளுக்கு அதைச் சுருக்கவில்லை.
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: ஆண்களிலும் நம்பியவர்கள் குறைவானோர் அல்ல
  rationale: οὐκ ὀλίγοι என்பது ‘சிலர் அல்ல’ என வலியுறுத்தும் எதிர்மறைச் சொல்லாட்சி. தமிழில் புரியும்படி வினையை நிரப்பிச் சொல்லியபோதும், அதை வெறுமனே ‘பலர்’ என்று சமப்படுத்தாமல் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: καὶ
  choice: மேலும்
  rationale: முதலில் குறிப்பிடப்பட்டவர்களோடு இன்னொரு குழுவை இணைக்கும் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ἐπίστευσαν என்பதற்கு வெளிப்படையான கிறிஸ்தவக் கோட்பாட்டு விரிவாக்கம் கொடுக்க வேண்டுமா?
  choice: நம்பினார்கள்
  alternative: கிறிஸ்துவில் விசுவாசம் கொண்டார்கள் / செய்தியை நம்பினார்கள்
  rationale: இந்த வசனம் நம்பிக்கையின் பொருளை வெளிப்படையாகச் சொல்லவில்லை; அது சூழலில் புரிகிறது. ஆகவே மூலத்தில் இல்லாத கோட்பாட்டு விவரத்தைச் சேர்க்காமல் அதன் சுருக்கத்தையும் திறந்த தன்மையையும் காக்கிறது.
- issue: εὐσχημόνων பெண்களை மட்டும் குறிக்கிறதா, பெண்களையும் ஆண்களையும் குறிக்கிறதா?
  choice: பெண்களையும் ஆண்களையும் சமூக உயர்நிலையோடு இணைக்கும் வகையில் மொழிபெயர்த்தல்
  alternative: சமுதாயத்தில் உயர்நிலையில் இருந்த கிரேக்கப் பெண்கள்; மேலும் ஆண்கள்
  rationale: கிரேக்க இலக்கணத்தில் பன்மை வேற்றுமை வடிவம் இரு குழுக்களோடும் பொருந்தக்கூடும்; வாக்கியத்தின் ஒருங்கிணைந்த அமைப்பும் இருவரையும் ஒரே சமூக விவரிப்புக்குள் வாசிக்க இடமளிக்கிறது. இருந்தபோதும் தேவையற்ற அளவில் ‘செல்வாக்குமிக்கவர்கள்’ போன்ற கூடுதல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் எதிர்மறை வலியுறுத்தலான οὐκ ὀλίγοι பாதுகாக்கப்பட்டுள்ளது; தெளிவுக்காக இரண்டாவது உட்பிரிவில் ‘நம்பியவர்கள்’ நிரப்பப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
