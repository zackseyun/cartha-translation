  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: ta
  text: ஆனால் தெசலோனிக்கேயைச் சேர்ந்த யூதர்கள், பெரோயாவிலும் பவுலால் கடவுளுடைய வார்த்தை அறிவிக்கப்பட்டதை அறிந்தபோது, அங்கேயும் வந்து மக்கள் கூட்டங்களைக் கிளர்த்திக் கலக்கினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “கலக்கினார்கள்” என்பதற்குரிய சொற்கள் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: ὡς δὲ
  choice: ஆனால் ... அறிந்தபோது
  rationale: δέ முந்தைய நிகழ்வுடன் உள்ள மெல்லிய எதிர்மறைத் திருப்பத்தைச் சுட்டுகிறது; ὡς காலத்தைக் குறிக்கும் துணைவாக்கியமாக இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: ἔγνωσαν
  choice: அறிந்தபோது
  rationale: γινώσκω இங்கு ஒரு செய்தியைத் தெரிந்துகொண்டதைக் குறிக்கிறது; வெறும் அறிவு உடையவர்களாக இருந்ததைக் குறிக்கவில்லை.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: தெசலோனிக்கேயைச் சேர்ந்த யூதர்கள்
  rationale: எதிர்ப்பில் ஈடுபட்ட குறிப்பிட்ட யூதர்களை அவர்களுடைய இடத் தொடர்பால் அடையாளப்படுத்துகிறது; எல்லா யூதர்களையும் பொதுப்படுத்தவில்லை.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: பெரோயாவிலும்
  rationale: καί கூடுதலான இடமாக பெரோயாவைச் சுட்டுகிறது; தெசலோனிக்கேயில் நடந்ததுபோல அங்கும் செய்தி அறிவிக்கப்பட்டது என்ற பொருளைத் தருகிறது.
- source_word: κατηγγέλη
  choice: அறிவிக்கப்பட்டதை
  rationale: καταγγέλλω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம், செய்தி பொதுவாக அறிவிக்கப்பட்டதை வலியுறுத்துகிறது. தமிழில் இவ்வடிவம் நிகழ்வுகளின் காலத் தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑπὸ τοῦ Παύλου
  choice: பவுலால்
  rationale: ὑπό உடன் வரும் பிறப்புவேற்றுமை செயப்பாட்டு வாக்கியத்தின் செய்பவரைக் குறிக்கிறது.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: அறிவிக்கப்பட்ட தெய்வீகச் செய்தி என்ற பொருளையும், மூலத்தின் வழக்கமான வேதாகமச் சொற்றொடரின் இறையியல் ஒலியையும் காக்கிறது.
- source_word: ἦλθον κἀκεῖ
  choice: அங்கேயும் வந்து
  rationale: κἀκεῖ என்பது ‘அங்கேயும்’ என்று பொருள்பட்டு, அவர்களுடைய எதிர்ப்பு பெரோயாவுக்கும் நீண்டதைத் தெளிவாக்குகிறது.
- source_word: σαλεύοντες καὶ ταράσσοντες
  choice: கிளர்த்திக் கலக்கினார்கள்
  rationale: இரண்டு பங்கேற்பு வினைகளையும் இயல்பான தமிழ் தொடர் வினைகளாக வழங்கி, பொதுமக்களைத் தூண்டுதல் மற்றும் குழப்பமடையச் செய்தல் ஆகிய நெருக்கமான ஆனால் தனித்த நுணுக்கங்களைக் காக்கிறது.
- source_word: τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களை
  rationale: ὄχλοι என்பதன் நடுநிலையான பன்மைப் பொருளைக் காக்கிறது; ‘கும்பல்கள்’ என மொழிபெயர்த்து தேவையற்ற எதிர்மறை உணர்வைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ὁ λόγος τοῦ θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளுடைய வார்த்தை
  alternative: கடவுளுடைய செய்தி
  rationale: ‘வார்த்தை’ என்பது அறிவிக்கப்பட்ட தெய்வீகச் செய்தியைக் குறிக்கும் சொற்றொடரின் இறையியல் நிறையைப் பாதுகாக்கிறது; அதேவேளையில் உடனடிச் சூழலைத் தாண்டிய பிற்காலத் தொழில்நுட்பப் பொருளைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் செயப்பாட்டு அமைப்பும், இரு வேறுபட்ட பொதுக் கலக்கச் செயல்களும் இயன்றவரை காக்கப்பட்டுள்ளன.
