  yaml_path: translation/nt/acts/017/008.yaml
  text: And they disturbed the crowd and the city officials when they heard these things,[a]
translation:
  language: ta
  text: இவற்றைக் கேட்டபோது, அவர்கள் மக்கள் கூட்டத்தையும் நகர அதிகாரிகளையும் கலங்கச் செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதிக நேரடி மொழிபெயர்ப்பில், “பொலித்தார்க்குகள்”; இது நகர நிர்வாக அதிகாரிகளைக் குறிக்கும் மக்கெதோனிய உள்ளூர் பதவிப்பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: ἐτάραξαν
  choice: கலக்கமடையச் செய்தார்கள்
  rationale: இச்சொல் மனக்குழப்பத்தையோ சமூகக் கலக்கத்தையோ ஏற்படுத்துவதைக் குறிக்கலாம். இரு குழுக்களுக்கும் இயல்பாகப் பொருந்தி, விளைவை மிகைப்படுத்தாமல் தமிழில் பொருளைத் தருகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சியை மட்டும் குறிக்கிறது; தமிழில் வாக்கியத் தொடர்ச்சியே அந்தப் பணியை இயல்பாக நிறைவேற்றுகிறது.
- source_word: ὄχλον
  choice: மக்கள் கூட்டத்தினர்
  rationale: ὄχλος என்பது கூடியிருந்த மக்களைக் குறிக்கும் நடுநிலையான சொல். ‘கும்பல்’ என்பது கிரேக்கத்தில் கட்டாயமில்லாத பகைமைத் தொனியைச் சேர்க்கும்.
- source_word: πολιτάρχας
  choice: நகர அதிகாரிகள்
  rationale: இது மக்கெதோனிய நகர நிர்வாகப் பதவிக்கான உள்ளூர் பட்டப்பெயர். ‘நகர அதிகாரிகள்’ என்பது நவீன வாசகர்களுக்குத் தெளிவாகவும், குறிப்பிட்ட நீதித்துறைப் பதவியைத் தேவையின்றி உணர்த்தாமலும் உள்ளது.
- source_word: ἀκούοντας ταῦτα
  choice: அவர்கள் சொன்னவற்றைக் கேட்ட
  rationale: நிகழ்காலப் பங்கேற்புவினை மக்கள் கூட்டத்தினரையும் நகர அதிகாரிகளையும் சேர்ந்தே விளக்குகிறது. தமிழில் முன்வரும் காலச்சார்பு வினையெச்ச அமைப்பு இயல்பாக உள்ளது; ταῦτα என்பதின் பன்மை ‘சொன்னவற்றை’ என்பதில் காக்கப்படுகிறது.
