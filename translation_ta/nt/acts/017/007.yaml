  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: ta
  text: யாசோன் விருந்தினர்களாக ஏற்றுக்கொண்டுள்ள[a] இவர்கள் அனைவரும், இயேசு வேறொரு அரசர் என்று கூறி, சீசரின் ஆணைகளுக்கு[b] எதிராகச் செயல்படுகிறார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வரவேற்றுள்ள’ அல்லது ‘தன்னிடம் ஏற்றுக்கொண்டுள்ள.’ கிரேக்க வினை விருந்தினர்களை வரவேற்று உபசரிப்பதையோ தங்க இடமளித்து ஏற்றுக்கொள்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆணைகள்’ என்பதற்கு ‘அதிகாரப்பூர்வக் கட்டளைகள்’ அல்லது ‘அரசாணைகள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அதிகாரப்பூர்வமான தீர்மானங்களையோ கட்டளைகளையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘மற்றோர் அரசர்.’ கிரேக்கத்தில் ‘வேறொரு அரசர்’ என்று உள்ளது; இது சீசரின் ஆட்சிக்கு எதிரான மற்றொரு அரசுரிமைக் கோரலாகக் குற்றஞ்சாட்டப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: விருந்தினர்களாக ஏற்றுக்கொண்டுள்ள
  rationale: நிறைவுற்ற செயலின் தற்போதைய விளைவை உணர்த்தும் கிரேக்க perfect வடிவத்தையும், விருந்தோம்பலுடன் ஒருவரை ஏற்றுக்கொள்ளும் வினையின் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπέναντι
  choice: எதிராக
  rationale: ஆறாம் வேற்றுமைப் பொருளுடன் வரும் இச்சொல் எதிர்ப்பு அல்லது முரண்பாட்டைக் குறிக்கிறது; குற்றச்சாட்டுச் சூழலில் ‘எதிராக’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: δογμάτων
  choice: ஆணைகளுக்கு
  rationale: ரோம அரசியல் சூழலில் அதிகாரப்பூர்வமாகப் பிறப்பிக்கப்பட்ட கட்டளைகள் அல்லது தீர்மானங்களைக் குறிக்கிறது; ‘ஆணைகள்’ பொதுவாசகருக்குப் புரியக்கூடிய சட்ட-அதிகாரத் தொனியைத் தக்கவைக்கிறது.
- source_word: πράσσουσι
  choice: செயல்பட்டு
  rationale: தொடர்ந்து நடைபெறும் நடத்தையை நிகழ்கால வினை வெளிப்படுத்துகிறது; ‘செயல்பட்டு’ என்பது வெறும் கருத்து வேறுபாடு அல்ல, நடைமுறைச் செயல் என்பதைக் காட்டுகிறது.
- source_word: βασιλέα ἕτερον
  choice: வேறொரு அரசர்
  rationale: βασιλεύς என்பதன் குறிப்பான ‘அரசர்’ என்ற பொருளையும், ἕτερος சுட்டும் தனித்த மற்றொரு உரிமைகோரலையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: λέγοντες
  choice: என்று சொல்கிறார்கள்
  rationale: அவர்கள் சீசரின் ஆணைகளுக்கு எதிராகச் செயல்படுவதாகக் கூறப்படும் விதத்தையும் அதன் உள்ளடக்கத்தையும் விளக்குகிறது; ‘உரிமைகோருகிறார்கள்’ போன்ற சொற்களால் மூலத்தைவிட வலிமையாக்கவில்லை.
- source_word: εἶναι Ἰησοῦν
  choice: இயேசு என்ற ... இருக்கிறார்
  rationale: கிரேக்க மறைமுகக் கூற்றை இயல்பான தமிழ் வாக்கிய அமைப்பில் மாற்றி, மற்ற அரசர் இயேசுவே என்ற அடையாளத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: οὗτοι πάντες
  choice: இவர்கள் அனைவரும்
  rationale: சுட்டுப்பொருளையும் குற்றச்சாட்டின் முழுமைப்படுத்தும் வலியுறுத்தலையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: இயேசுவை அரசர் என்று கூறுவதிலுள்ள அரசியல் வலிமை
  choice: சீசருடன் தொடர்புடைய குற்றச்சாட்டின் அரசியல் பதற்றத்தைத் தக்கவைத்து, இயேசுவை ‘வேறொரு அரசர்’ என்று நேரடியாக மொழிபெயர்த்தல்.
  alternative: அரசியல் ஒலியைத் தணிக்க ‘வேறொரு தலைவர்’ அல்லது ‘ஆட்சியாளர்’ என்று மொழிபெயர்த்தல்.
  rationale: மூலவசனம் சீசரின் ஆணைகளையும் வேறொரு அரசரையும் நேரடியாக இணைத்து ஒரு அரசியல் குற்றச்சாட்டை முன்வைக்கிறது. அதை ‘ஆன்மீக’ அரசாட்சி என்று விளக்கிச் சுருக்காமலும், குற்றச்சாட்டு முற்றிலும் அரசியல் மட்டுமே என்று தீர்மானிக்காமலும் மூலத்தின் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், ஆனால் நீதிமன்ற அல்லது குடிமைச் குற்றச்சாட்டுக்கேற்ற கண்ணியமான தொனியில் வடிவமைக்கப்பட்டது. ‘சீசர்,’ ‘ஆணைகள்,’ ‘அரசர்’ ஆகிய சொற்கள் வரலாற்று-அரசியல் சூழலைத் தெளிவாகக் காக்கின்றன; தேவையற்ற சமய மரபுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
