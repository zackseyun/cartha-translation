id: ACT.17.19
reference: Acts 17:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: ta
  text: அவர்கள் அவரைப் பிடித்துக்கொண்டு அரேயோபாகுவுக்கு[a] அழைத்துச் சென்று, “நீர் எடுத்துரைக்கும் இந்தப் புதிய போதனை என்ன என்பதை நாங்கள் அறிந்துகொள்ளலாமா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரேயோபாகு’ என்பது அந்தக் குன்றையோ, அதனுடன் தொடர்புடைய அவையையோ குறிக்கலாம்; இதற்கு ‘மார்ஸ் குன்று’ என்ற பாரம்பரியப் பெயரும் உண்டு.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: பிடித்து
  rationale: வினைச்சொல் உடல்ரீதியாகப் பற்றிக்கொண்டு அழைத்துச் செல்லும் உறுதியான செயலையும் குறிக்கலாம். ‘கைதுசெய்து’ என்று பகைமையை மிகைப்படுத்தாமலும், வெறும் ‘அழைத்து’ என்று உடல்ரீதியான முன்முயற்சியை மறைக்காமலும் ‘பிடித்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: τε
  choice: அதனால்
  rationale: முந்தைய நிகழ்வுடன் உள்ள மென்மையான கதைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: அரேயோபாகுவுக்கு
  rationale: கிரேக்கப் பெயரை ஒலிபெயர்ப்பதால், அது குன்றைக் குறிக்கிறதா அல்லது அதனுடன் தொடர்புடைய அவையைக் குறிக்கிறதா என்ற தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: ἤγαγον
  choice: அழைத்துச் சென்று
  rationale: ἄγω என்பதன் ‘வழிநடத்து/கொண்டுசெல்’ பொருளை, ‘பிடித்து’ என்பதுடன் இயல்பாக இணைக்கிறது.
- source_word: λέγοντες
  choice: என்று கேட்டார்கள்
  rationale: கிரேக்கத்தில் ‘சொல்லிக்கொண்டு’ என்ற பங்கேற்புவினை இருந்தாலும், தொடரும் வாக்கியம் கேள்வியாக இருப்பதால் நவீன தமிழில் ‘என்று கேட்டார்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: Δυνάμεθα γνῶναι
  choice: நாங்கள் அறிந்துகொள்ளலாமா?
  rationale: திறனைப் பற்றிய வெறும் கேள்வியாக அல்லாமல், மரியாதையான வேண்டுகோளாகச் செயல்படும் கிரேக்கத் தொடரைத் தெரிவிக்கிறது.
- source_word: καινὴ
  choice: புதிய
  rationale: கேட்போருக்குப் புதியதாக அல்லது புதுவகையாக உள்ளதைக் குறிக்கும் இயல்பான பொதுத் தமிழ் சொல்.
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: நீர் பேசிவரும்
  rationale: கிரேக்கத்தின் செயப்பாட்டு அமைப்பைத் தமிழில் வற்புறுத்திப் பொருத்தாமல், தொடர்ந்து முன்வைக்கப்படும் போதனை என்ற கருத்தை இயல்பாகத் தருகிறது.
- source_word: διδαχή
  choice: போதனை
  rationale: மதச்சூழலில் இயல்பாகப் புரியும், ஆனால் ‘கோட்பாடு’ போல அளவுக்கு மீறித் தொழில்நுட்பமாக இல்லாத சொல்.
theological_decisions:
- issue: பவுலை அரேயோபாகுவுக்கு அழைத்துச் சென்ற விதத்தின் நுட்பம்
  choice: உறுதியான உடல்ரீதியான பிடிப்பு; அவசியம் பகைமையான கைது அல்ல
  alternative: முறைப்படியான கைது அல்லது வெறும் மரியாதையான அழைப்பு
  rationale: ἐπιλαμβάνομαι வலுவான உடல்ரீதியான செயலைக் குறிக்கக்கூடும்; ஆனால் உடனடிச் சூழல் வெளிப்படையான பகைமையை விட விசாரிக்கும் ஆர்வத்தையே காட்டுகிறது. எனவே இரு முனைகளும் தவிர்க்கப்பட்டன.
- issue: Ἄρειος Πάγος என்பதன் குறிப்பு
  choice: ‘அரேயோபாகு’ என்ற பெயராக வைத்து இடம்/அவை என்ற தெளிவின்மையைப் பாதுகாத்தல்
  alternative: ‘மார்ஸ் குன்று’ என்ற இடப்பெயர் அல்லது ‘அரேயோபாகு அவை’ என்று குறிப்பாக்குதல்
  rationale: கிரேக்கச் சொற்றொடர் குன்றையும் அதனுடன் தொடர்புடைய அவையையும் குறிக்கக்கூடும். வசனம் தீர்மானிக்காத வரலாற்றுக் கேள்வியை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. மரியாதை ஒருமை ‘நீர்’ மூலமொழியின் ஒருமைச் சுட்டைத் தக்கவைக்கிறது. செயப்பாட்டு வடிவத்தைச் சொற்சொல்லாகப் பின்பற்றாமல் ‘நீர் பேசிவரும்’ என இயல்பாக்கப்பட்டுள்ளது.
