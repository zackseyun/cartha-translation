revisions:
- from: அதனால் அவர்கள் அவரைப் பிடித்து, அரேயோபாகுவுக்கு[a] அழைத்துச் சென்று, “நீர் பேசிவரும் இந்தப் புதிய போதனை என்னவென்று நாங்கள் அறிந்துகொள்ளலாமா?” என்று கேட்டார்கள்.
  to: அவர்கள் அவரைப் பிடித்துக்கொண்டு அரேயோபாகுவுக்கு[a] அழைத்துச் சென்று, “நீர் எடுத்துரைக்கும் இந்தப் புதிய போதனை என்ன என்பதை நாங்கள் அறிந்துகொள்ளலாமா?” என்று கேட்டார்கள்.
