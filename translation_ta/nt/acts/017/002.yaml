lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: பவுல் தம் வழக்கத்தின்படி
  rationale: κατά என்பதுடன் வரும் εἴωθα வினையின் பெயரெச்சத் தொடர், பவுலின் நிலையான வழக்கத்தைக் குறிக்கிறது. ‘தம் வழக்கத்தின்படி’ என்பது இயல்பான, கண்ணியமான தமிழில் அந்தப் பழக்கப் பொருளைத் தக்கவைக்கிறது.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: அவர்களிடம் சென்றார்
  rationale: εἰσέρχομαι உள்ளே செல்வதைக் குறித்தாலும், πρὸς αὐτούς உடன் இச்சூழலில் முன் வசனத்தில் சொல்லப்பட்டிருந்த கூடுகையில் இருந்தவர்களிடம் பவுல் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘தொழுகைக்கூடத்திற்குள்’ என்று மூலத்தில் இல்லாத பெயரை இவ்வசனத்தில் சேர்க்கவில்லை.
- source_word: ἐπὶ σάββατα τρία
  choice: மூன்று ஓய்வுநாட்களில்
  rationale: ἐπί + வேற்றுமை வடிவம் இங்கு மூன்று ஓய்வுநாள் சந்தர்ப்பங்களில் நிகழ்ந்த செயலைக் குறிக்கிறது. ‘மூன்று ஓய்வுநாட்களில்’ என்பது காலப் பரவலையும் ஒவ்வொரு சந்தர்ப்பத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διελέξατο
  choice: எடுத்துரையாடினார்
  rationale: διαλέγομαι என்பது வெறும் உரையாடலைவிட ஆதாரங்களை முன்வைத்து விளக்கி விவாதிப்பதைக் குறிக்கலாம். ‘எடுத்துரையாடினார்’ என்பது உரையாடல் தன்மையையும் காரணம் காட்டும் தன்மையையும் காக்கிறது; பகைமையான வாக்குவாதம் என்ற தேவையற்ற நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: ἀπὸ τῶν γραφῶν
  choice: வேதவாக்கியங்களிலிருந்து
  rationale: பன்மையான γραφαί இச்சூழலில் அதிகாரமுள்ள பரிசுத்த எழுத்துகளைக் குறிக்கிறது. தமிழ் வேதாகமப் பயன்பாட்டில் புரிந்துகொள்ளத்தக்க ‘வேதவாக்கியங்கள்’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: பவுல் சென்ற ‘அவர்கள்’ யார் என்பது
  choice: முதன்மை உரையில் ‘அவர்களிடம்’ என்ற பதிற்பெயரைத் தக்கவைத்தல்
  alternative: ‘தொழுகைக்கூடத்திற்குள் சென்றார்’ அல்லது ‘அங்கிருந்த யூதர்களிடம் சென்றார்’
  rationale: உடனடி சூழல் தொழுகைக்கூடத்தை அடையாளப்படுத்தினாலும், இவ்வசனத்தின் கிரேக்கம் பெயர்ச்சொல்லுக்குப் பதிலாக αὐτούς என்ற பதிற்பெயரையே பயன்படுத்துகிறது. ஆகவே மூலத்தின் குறிப்பளவைக் கடக்காமல் பதிற்பெயர் தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தம்’ என்பது பவுலைக் குறிக்கும் மரியாதைத் தற்சுட்டாகப் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் உரையாடல் மற்றும் ஆதாரம்காட்டும் இரு நுணுக்கங்களையும் இணைக்க ‘எடுத்துரையாடினார்’ தேர்ந்தெடுக்கப்பட்டது; அனைத்து அடிக்குறிப்பு சுட்டிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
