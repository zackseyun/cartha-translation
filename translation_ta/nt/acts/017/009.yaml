lexical_decisions:
- source_word: λαβόντες
  choice: பெற்றுக்கொண்டு
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. தமிழில் ‘பெற்றுக்கொண்டு’ என்பது அந்தச் செயல்முறையையும் தொடர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ ἱκανὸν
  choice: பிணைத்தொகையை
  rationale: இச்சட்டச் சூழலில் இச்சொற்றொடர் போதுமான உத்தரவாதமாகப் பெறப்பட்ட பணம் அல்லது பிணையைக் குறிக்கலாம். ‘பிணைத்தொகை’ அதன் சட்ட/நிதிப் பொருளைத் தெளிவாகக் காட்டுகிறது; ‘ஜாமீன்’ போன்ற குறிப்பிட்ட நவீன சட்டமுறையைத் தேவையின்றி திணிப்பதில்லை. அடிப்படைச் சொல்லாக்கத்தின் ‘போதுமான தொகை’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: யாசோனிடமிருந்தும் மற்றவர்களிடமிருந்தும்
  rationale: παρά + உரிமை வேற்றுமை மூலத்தை, அதாவது ‘இடமிருந்து’ என்பதைக் குறிக்கிறது. λοιποί உடனிருந்த மீதியானவர்களைக் குறிக்கிறது; ‘மற்றவர்கள்’ என்பது இயல்பான நவீன தமிழ்.
- source_word: ἀπέλυσαν
  choice: விடுவித்தார்கள்
  rationale: குடிமை/நீதிச் சூழலில் காவல் அல்லது கட்டுப்பாட்டிலிருந்து விடுவித்தலைக் குறிக்கிறது. ‘விடுவித்தார்கள்’ என்பது சட்டச் சூழலுக்கும் இயல்பான தமிழுக்கும் ஏற்றது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: கைதுசெய்யப்பட்ட அல்லது தடுத்து வைக்கப்பட்ட யாசோனையும் அவருடன் இருந்தவர்களையும் சுட்டும் பன்மைச் சுட்டுப்பெயர்.
