  naturalness: ‘மனம் இணங்கி’ மற்றும் ‘தேவனை வழிபட்டுவந்த கிரேக்கர்கள்’ இயல்பாக உள்ளன. ஆயினும் பெண்களைக் குறிக்கும் இறுதிச் சொற்றொடர் பெயர்ச்சொல்-எண்ணிக்கைக் கட்டமைப்பால் செயற்கையாகத் தோன்றுகிறது. ‘சமூகத்தில் முக்கியத்துவம் பெற்ற பெண்களும் குறைவானவர்கள் அல்ல’ என்பது நவீன பொதுத்தமிழில் லூக்காவின் குறைத்துக்கூறி வலியுறுத்தும் நடையைத் தெளிவாகக் காக்கிறது.
