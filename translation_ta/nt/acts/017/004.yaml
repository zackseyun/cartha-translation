source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: ta
  text: அவர்களில் சிலர் மனம் இணங்கி, பவுலுடனும் சீலாவுடனும் சேர்ந்துகொண்டார்கள்[a]. மேலும், தேவனை வழிபட்டுவந்த கிரேக்கர்களில் ஏராளமானவர்களும், சமூகத்தில் முக்கியத்துவம் பெற்ற பெண்களும் குறைவானவர்கள் அல்ல; அவர்களும் சேர்ந்துகொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “பவுலுடனும் சீலாவுடனும் தங்கள் பங்கை இணைத்துக்கொண்டார்கள்.”
    reason: προσεκληρώθησαν என்ற அரிய வினை, பவுல் மற்றும் சீலாவுடன் தம்மை இணைத்துக்கொண்ட அல்லது அவர்களுடைய அணியில் பங்குபெற்ற நுணுக்கத்தைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: அவர்களில் சிலர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தொழுகைக்கூடக் கூட்டத்திலிருந்து சிலரைக் குறிக்கும் பகுதிப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπείσθησαν
  choice: மனம் இணங்கி
  rationale: πείθω என்ற வினையின் ‘இணங்கச் செய்யப்பட்டனர்/இணங்கினர்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத πιστεύω என்ற வெளிப்படையான ‘விசுவாசித்தனர்’ என்னும் கருத்தைச் சேர்க்கவில்லை.
- source_word: προσεκληρώθησαν
  choice: சேர்ந்துகொண்டார்கள்
  rationale: இந்த அரிய வினை பவுல் மற்றும் சீலாவுடன் இணைக்கப்படுவதையோ அவர்களது அணியில் சேருவதையோ குறிக்கிறது. ‘சேர்ந்துகொண்டார்கள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்; அதன் நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: பவுலுடனும் சீலாவுடனும்
  rationale: உறவைக் குறிக்கும் வேற்றுமைப் பொருளைத் தமிழில் உடனிகழ்ச்சி உருபால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: தேவனை வழிபட்டுவந்த கிரேக்கர்களில்
  rationale: அப்போஸ்தலர் நடபடிகளில் இச்சொற்றொடர் யூத வழிபாட்டுடன் தொடர்புடைய, இஸ்ரவேலின் தேவனை வணங்கிய யூதரல்லாதவர்களைக் குறிக்கிறது. ‘தேவனை வழிபட்டுவந்த’ என்பது வரலாற்றுச் சூழலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: πλῆθος πολὺ
  choice: பெருந்திரளானவர்கள்
  rationale: கணிசமான பெரிய எண்ணிக்கையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: முக்கியப் பெண்கள்
  rationale: πρῶτος இங்கு காலவரிசையில் ‘முதல்’ என்பதைக் காட்டாமல் சமூக முக்கியத்துவத்தையோ உயர்நிலையையோ குறிக்கிறது. ‘முக்கியப் பெண்கள்’ இரண்டையும் தேவையின்றிக் குறுக்காமல் காக்கிறது.
- source_word: οὐκ ὀλίγαι
  choice: குறைவில்லாத எண்ணிக்கையினர்
  rationale: ‘பலர்’ என்று சமப்படுத்தாமல், லூக்கா பயன்படுத்தும் ‘சிலர் அல்ல’ என்ற எதிர்மறை வலியுறுத்தலின் தாக்கத்தை இயல்பான தமிழில் இயன்றவரை காக்கிறது.
- source_word: τε ... τε
  choice: மேலும் ... -உம் ... -உம்
  rationale: முதல் குழுவுடன் மேலும் இரண்டு குழுக்கள் சேர்க்கப்படுவதைத் தமிழின் இணைப்புமுறையில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ἐπείσθησαν என்பதைக் வெளிப்படையான மனமாற்றம் அல்லது விசுவாச மொழியில் மொழிபெயர்ப்பதா
  choice: மனம் இணங்கி
  alternative: விசுவாசித்து
  rationale: சூழல் நற்செய்திப் பிரசங்கத்துக்கான பதிலை விவரித்தாலும், கிரேக்கத்தில் πιστεύω அல்ல, πείθω பயன்படுத்தப்பட்டுள்ளது. ஆகவே சொற்களுக்கிடையிலான வேறுபாடும் மூலத்தின் அளவான குறிப்பும் காக்கப்படுகின்றன.
- issue: σεβομένων Ἑλλήνων என்பவர்களின் சமய அடையாளத்தை எவ்வளவு வெளிப்படையாக்குவது
  choice: தேவனை வழிபட்டுவந்த கிரேக்கர்கள்
  alternative: பக்தியுள்ள கிரேக்கர்கள்
  rationale: அப்போஸ்தலர் நடபடிகளின் வரலாற்றுச் சூழலில் இவர்கள் யூத வழிபாட்டுடன் தொடர்புடைய யூதரல்லாதவர்களாக இருப்பதால், மறைமுகமாக உள்ள வழிபாட்டின் இலக்கைத் தெளிவுபடுத்துவது பொருத்தமானது; இது புதிய கோட்பாட்டுக் கருத்தைச் சேர்ப்பதல்ல.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், ஆனால் வேதாகமப் பதிப்புக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனம் இணங்கி’ என்பது இயல்பான தமிழையும் πείθω/πιστεύω வேறுபாட்டையும் சமநிலைப்படுத்துகிறது. ‘குறைவில்லாத எண்ணிக்கையினர்’ என்பது சற்றே இலக்கியமானதாயினும் οὐκ ὀλίγαι என்ற குறைத்துக் கூறி வலியுறுத்தும் நடையைத் தக்கவைக்கத் தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறி [a] முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
