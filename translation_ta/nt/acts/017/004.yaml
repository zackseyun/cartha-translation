revisions:
- from: அவர்களில் சிலர் மனம் இணங்கி, பவுலுடனும் சீலாவுடனும் சேர்ந்துகொண்டார்கள்[a]. மேலும், தேவனை வழிபட்டுவந்த கிரேக்கர்களில் பெருந்திரளானவர்களும், முக்கியப் பெண்களில் குறைவில்லாத எண்ணிக்கையினரும் அவர்களுடன் சேர்ந்துகொண்டார்கள்.
  to: அவர்களில் சிலர் மனம் இணங்கி, பவுலுடனும் சீலாவுடனும் சேர்ந்துகொண்டார்கள்[a]. மேலும், தேவனை வழிபட்டுவந்த கிரேக்கர்களில் ஏராளமானவர்களும், சமூகத்தில் முக்கியத்துவம் பெற்ற பெண்களும் குறைவானவர்கள் அல்ல; அவர்களும் சேர்ந்துகொண்டார்கள்.
  rationale: 'திருத்தம் மூலத்தின் மூன்று குழுக்களையும் தெளிவாக வைத்திருக்கிறது: தொழுகைக்கூடக் கேட்போரில் சிலர், தேவனை வழிபட்ட கிரேக்கர்களில் ஏராளமானோர், மற்றும் சமூகத்தில் முக்கியத்துவம் பெற்ற பெண்களில் சிலர் அல்லாதோர். ‘குறைவானவர்கள் அல்ல’ என்பது οὐκ ὀλίγαι-யின் குறைத்துக்கூறி வலியுறுத்தும் நடையை இயல்பான தமிழில் பாதுகாக்கிறது.'
