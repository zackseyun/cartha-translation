id: ACT.17.3
reference: Acts 17:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: ta
  text: மேசியா[a] துன்பப்படவும் இறந்தோரிலிருந்து உயிர்த்தெழவும் வேண்டியிருந்தது[b] என்பதையும், “நான் உங்களுக்கு அறிவிக்கிற இந்த இயேசுவே அந்த மேசியா” என்பதையும் அவர் விளக்கி எடுத்துக்காட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டு இடங்களிலும் ‘மேசியா’ என்பதற்குப் பதிலாக ‘கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘இறந்தோரிலிருந்து எழுப்பப்பட’ என்றும் மொழிபெயர்க்கலாம். இங்கு கிரேக்கத்தில் ‘உயிர்த்தெழ’ என்ற செய்வினை வடிவம் உள்ளது; எனினும் புதிய ஏற்பாட்டின் பிற இடங்கள் இயேசுவைத் தேவன் எழுப்பினார் என்றும் கூறுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: விளக்கி
  rationale: இச்சொல் வேதவசனங்களின் பொருளைத் திறந்து தெளிவுபடுத்துவதைக் குறிக்கிறது. நவீன தமிழில் ‘விளக்கி’ என்பது இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: παρατιθέμενος
  choice: ஆதாரங்களை முன்வைத்தார்
  rationale: பவுல் தமது கூற்றுக்கு ஆதாரங்களை எடுத்துவைத்து நிறுவிய செயலை இது குறிக்கிறது; ‘நிரூபித்தார்’ என்பதைவிட இது கிரேக்கச் சொல்லின் வலிமையை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: மேசியா
  rationale: இரு இடங்களிலும் Χριστός இயேசுவின் பெயரின் ஒரு பகுதியாக அல்லாமல், எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἔδει
  choice: வேண்டியிருந்தது
  rationale: வேதவசனத்திலும் இறைத்திட்டத்திலும் வேரூன்றியிருந்த அவசியத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: παθεῖν
  choice: துன்பப்பட்டு
  rationale: மேசியாவின் பாடுகளைக் குறிக்கும் πάσχω என்பதற்கான நேரடியான, வழக்கமான தமிழ் வடிவம்.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து உயிர்த்தெழ
  rationale: செய்வினை வடிவிலுள்ள ἀναστῆναι என்பதையும், ἐκ νεκρῶν என்பதன் ‘இறந்தோரிலிருந்து’ என்ற பொருளையும் நேரடியாகப் பேணுகிறது.
- source_word: οὗτός ἐστιν ὁ χριστός, ὁ Ἰησοῦς
  choice: இந்த இயேசுவே மேசியா
  rationale: இயேசுவையே மேசியா என்று அடையாளப்படுத்தும் வலியுறுத்தலை ‘-வே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καταγγέλλω ὑμῖν
  choice: நான் உங்களுக்கு அறிவிக்கிற
  rationale: பொதுவாக அறிவித்தல் என்ற பொருளைத் தருகிறது; ‘பிரசங்கிக்கிற’ என்று குறிப்பிட்ட சமயச் செயலாகத் தேவையின்றிக் குறுக்கவில்லை.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தை இரண்டு இடங்களிலும் எவ்வாறு மொழிபெயர்ப்பது
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்வசனத்தின் வாதம், எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவர் துன்பப்பட்டு உயிர்த்தெழ வேண்டும் என்பதும், இயேசுவே அவர் என்பதும் ஆகும். ஆகவே யூத வேதப்பின்னணியைத் தெளிவாகப் பேண ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது.
- issue: ἀναστῆναι என்பதன் வினைக்குரல் நுட்பம்
  choice: உயிர்த்தெழ
  alternative: உயிரோடு எழுப்பப்பட
  rationale: கிரேக்கத்தில் செய்வினை infinitive பயன்படுத்தப்பட்டுள்ளதால் ‘உயிர்த்தெழ’ என்பது நேரடியான மொழிபெயர்ப்பு. இயேசுவைத் தேவன் எழுப்பினார் என்ற பிற புதிய ஏற்பாட்டு கூற்றை இது மறுப்பதில்லை; இவ்வசனத்தின் வடிவத்தை மட்டும் பேணுகிறது.
- issue: முதலாம் நபர் καταγγέλλω இடம்பெறும் கூற்றின் வடிவம்
  choice: நேர்கூற்றாக மேற்கோள் குறிகளுக்குள் வழங்கப்பட்டது
  alternative: மறைமுகக் கூற்றாக ‘அவர் அறிவிக்கிற’ என்று மாற்றுவது
  rationale: மூலத்தில் ‘நான் அறிவிக்கிறேன்’ என்ற முதலாம் நபர் திடீரென இடம்பெறுவதால் பவுலின் சொற்களை நேர்கூற்றாகக் காட்டுவது இயல்பான தமிழையும் மூலத்தின் நபர்நிலையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஆதாரங்களை முன்வைத்தார்’ என்பது தர்க்கரீதியான நிரூபணத்தை மிகைப்படுத்தாமல் வேதவசனங்களிலிருந்து சான்றுகளை எடுத்துவைத்த செயலைத் தெரிவிக்கிறது. மூலத்தின் முதலாம் நபர் கூற்றைப் பேண மேற்கோள் குறிகள் பயன்படுத்தப்பட்டுள்ளன.
