- from: மேசியா[a] துன்பப்பட்டு, இறந்தோரிலிருந்து உயிர்த்தெழ வேண்டியிருந்தது[b] என்பதையும், “நான் உங்களுக்கு அறிவிக்கிற இந்த இயேசுவே மேசியா” என்பதையும் அவர் விளக்கி, ஆதாரங்களை முன்வைத்தார்.
  to: மேசியா[a] துன்பப்படவும் இறந்தோரிலிருந்து உயிர்த்தெழவும் வேண்டியிருந்தது[b] என்பதையும், “நான் உங்களுக்கு அறிவிக்கிற இந்த இயேசுவே அந்த மேசியா” என்பதையும் அவர் விளக்கி எடுத்துக்காட்டினார்.
