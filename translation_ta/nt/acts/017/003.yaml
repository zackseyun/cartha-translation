  source_fidelity: 'கருத்து முழுவதும் மூலத்துடன் பொருந்துகிறது: மேசியாவின் துன்பம், இறந்தோரிலிருந்து உயிர்த்தெழுதல், இயேசுவே மேசியா என்ற அடையாளப்படுத்தல், மற்றும் பவுலின் முதலாம் நபர் அறிவித்தல் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘மேசியா’வின் குறிப்புத்தன்மையை இரண்டாம் இடத்தில் ‘அந்த மேசியா’ எனத் தெளிவுபடுத்துவதும், ἀναστῆναι-க்கான மாற்றுவாசகக் குறிப்பைச் சரிசெய்வதும் பாதுகாப்பான மேம்பாடுகள்.'
