  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: ta
  text: ஆகவே, அறியாமையின் காலங்களைக் கண்டுகொள்ளாமல் விட்ட கடவுள்[a], இப்போது எங்கும் உள்ள எல்லா மக்களும் மனந்திரும்ப வேண்டும் என்று கட்டளையிடுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கண்டுகொள்ளாமல் விட்ட” என்பது அந்த அறியாமைக் காலங்களைக் கடவுள் அங்கீகரித்தார் என்று பொருளல்ல; அவற்றை உடனடியாகத் தண்டிக்காமல் பொறுத்துக்கொண்டார் என்பதே கருத்து. “கடந்து சென்றார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας
  choice: ஆகவே, அறியாமையின் காலங்களை
  rationale: μὲν οὖν உரையின் நகர்வையும் முந்தைய காலங்களுக்கும் இப்போதைக்கும் உள்ள மெல்லிய முரண்பாட்டையும் குறிக்கிறது. ἄγνοια என்பதன் நேரடியான பொருள் ‘அறியாமை’; ‘கடவுளைப் பற்றிய’ என்று விரிவுபடுத்துவது சூழலுக்கு ஏற்றதாயினும் மூலத்தில் இல்லாத சொற்களைச் சேர்க்கும்.
- source_word: ὑπεριδὼν
  choice: கண்டும் காணாதவர்போல் விட்டுவந்த
  rationale: ὑπεροράω இங்கு முந்தைய அறியாமைக் காலங்களை கடவுள் உடனடியாகத் தண்டிக்காமல் பொறுத்துக்கொண்டதைக் குறிக்கிறது. இந்த இயல்பான தமிழாக்கம் அவரது அங்கீகாரத்தையோ அலட்சியத்தையோ குறிக்காமல், ‘overlook/pass over’ என்ற உருவகத்தின் வலிமையைத் தக்கவைக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: எழுவாயின் நேரடியான, பொதுவாகப் புரியும் தமிழாக்கம்.
- source_word: τὰ νῦν παραγγέλλει
  choice: இப்போது ... கட்டளையிடுகிறார்
  rationale: τὰ νῦν முந்தைய காலங்களுடன் நிகழ்காலத்தை வேறுபடுத்துகிறது; παραγγέλλει அதிகாரமுள்ள கட்டளையைக் குறிக்கிறது.
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: எல்லா இடங்களிலும் உள்ள மக்கள் அனைவரும்
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கிறது. πάντας மற்றும் πανταχοῦ கட்டளையின் முழுமையான மனித மற்றும் இடவியல் பரப்பை வலியுறுத்துகின்றன.
- source_word: μετανοεῖν
  choice: மனந்திரும்ப வேண்டும்
  rationale: μετανοέω சிந்தனை மாற்றத்தை மட்டும் அல்லாமல் கடவுளை நோக்கிய ஒழுக்க மற்றும் வாழ்வுத் திருப்பத்தையும் உள்ளடக்குகிறது. ‘மனந்திரும்புதல்’ என்பது இவ்விரு பரிமாணங்களையும் தாங்கும் நிலைபெற்ற, இயல்பான தமிழ் வேதாகமச் சொல்.
theological_decisions:
- issue: ‘அறியாமையின் காலங்கள்’ குறித்த கடவுளின் முந்தைய செயல்
  choice: அந்தக் காலங்களை உடனடியாகத் தண்டிக்காமல் பொறுத்துக்கொண்டார் என்பதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: பாவத்தைப் பொருட்படுத்தவில்லை அல்லது அறியாமையை முற்றிலும் மன்னித்துவிட்டார்.
  rationale: ὑπεριδών என்பது பொறுமையுடன் கடந்து செல்லுதலைக் குறிக்கலாம்; தொடர்ந்து வரும் மனந்திரும்புவதற்கான கட்டளை மனிதப் பொறுப்பைத் தக்கவைக்கிறது. கடவுள் விக்கிரக வழிபாட்டை அங்கீகரித்தார் என்று மொழிபெயர்ப்பு கூறவில்லை.
- issue: மனந்திரும்புவதற்கான கட்டளையின் பரப்பு
  choice: எல்லா இடங்களிலும் உள்ள மக்கள் அனைவருக்கும் உரிய பொதுவான கட்டளை.
  alternative: ஆண்களுக்கு மட்டும் அல்லது பிற இனத்தாருக்கு மட்டும் கொடுக்கப்பட்ட கட்டளை.
  rationale: τοῖς ἀνθρώποις πάντας πανταχοῦ என்பது பாலினம் அல்லது இனக்குழு ஒன்றால் வரையறுக்கப்படாத முழு மனிதப் பரப்பைக் குறிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்டும் காணாதவர்போல்’ என்ற வழக்குச் சொல்லுடன் ‘விட்டுவந்த’ சேர்க்கப்பட்டு, இறந்த காலத்துக்கும் ‘இப்போது’ என்பதற்கும் இடையிலான இரட்சிப்பு-வரலாற்று மாறுதல் வெளிப்படுத்தப்பட்டுள்ளது. ‘மனந்திரும்ப’ என்பது நிலைபெற்றிருந்தாலும் இன்னும் இயல்பாகப் புரியும் சமயச் சொல்.
