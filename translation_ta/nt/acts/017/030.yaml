revisions:
- from: ஆகவே, அறியாமையின் காலங்களைக் கண்டும் காணாதவர்போல் விட்டுவந்த கடவுள்[a], இப்போது எல்லா இடங்களிலும் உள்ள மக்கள் அனைவரும் மனந்திரும்ப வேண்டும் என்று கட்டளையிடுகிறார்.
  to: ஆகவே, அறியாமையின் காலங்களைக் கண்டுகொள்ளாமல் விட்ட கடவுள்[a], இப்போது எங்கும் உள்ள எல்லா மக்களும் மனந்திரும்ப வேண்டும் என்று கட்டளையிடுகிறார்.
