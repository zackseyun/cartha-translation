id: ACT.17.27
reference: Acts 17:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: ta
  text: அவர்கள் கடவுளைத் தேடும்படியாகவும், ஒருவேளை அவரைத் தடவித் தேடி கண்டடையக்கூடுமென்பதற்காகவும்; ஆயினும் உண்மையில், அவர் நம்மில் ஒவ்வொருவரிடமிருந்தும் தொலைவில் இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητεῖν
  choice: தேட வேண்டும் என்பதற்காகவே
  rationale: முந்தைய வாக்கியத்தைச் சார்ந்த நோக்கம் அல்லது விளைவைச் சுட்டும் வினையெச்சத்தின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν θεόν
  choice: கடவுளை
  rationale: குறிப்பிட்ட சுட்டிடைச்சொல் இருந்தாலும், இச்சூழலில் தமிழில் இயல்பான இறைப்பெயர் பயன்பாடு ‘கடவுள்’ ஆகும்.
- source_word: εἰ ἄρα γε
  choice: ஒருவேளை ... கூடும்
  rationale: மனிதத் தேடலின் நிச்சயமின்மையையும் சாத்தியத்தையும் ஒருசேரத் தக்கவைக்கிறது.
- source_word: ψηλαφήσειαν
  choice: தடவித் தேடி
  rationale: தெளிவாகக் காண முடியாத நிலையில் தொடுதலால் தேடும் மூலமொழிப் படிமத்தை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: καὶ εὕροιεν
  choice: கண்டடையக்கூடும்
  rationale: முந்தைய சாத்தியநிலை வினையுடன் இணைந்துள்ள optative பொருளைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: καί γε
  choice: உண்மையில்
  rationale: மனிதத் தேடலின் தயக்கத்துக்கு எதிராகக் கடவுளின் மெய்யான அருகாமையை வலியுறுத்தும் தெளிவுரையைச் சொல்கிறது.
- source_word: οὐ μακρὰν
  choice: தொலைவில் இல்லை
  rationale: மூலத்தின் நேரடியான இடவியல் உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: நம்மில் ஒவ்வொருவருக்கும்
  rationale: ἑνὸς ἑκάστου என்பதன் தனித்தனி பகிர்வுச் சிறப்பைத் தெளிவாகப் பேணுகிறது.
- source_word: ὑπάρχοντα
  choice: அவர் ... இல்லை
  rationale: கடவுளின் உண்மையான அருகாமையைத் தமிழுக்குத் தேவையான முற்றுவினை அமைப்பில் இயல்பாகக் கூறுகிறது.
theological_decisions:
- issue: கடவுளை அணுகக்கூடிய நிலையும் மனிதத் தேடலும்
  choice: ‘ஒருவேளை ... தடவித் தேடி கண்டடையக்கூடும்’ என்ற தயக்கத்தையும், ‘அவர் ... தொலைவில் இல்லை’ என்ற உறுதியையும் சேர்த்துப் பேணுதல்
  alternative: தடவித் தேடும் உருவகத்தை நீக்கி, ‘தேடிக் கண்டுகொள்வார்கள்’ என்று எளிமைப்படுத்துதல்
  rationale: கிரேக்கம் மனிதரின் வரையறுக்கப்பட்ட உணர்திறனையும் கடவுளின் உண்மையான அருகாமையையும் பதற்றத்தோடு ஒன்றாக வைத்திருக்கிறது; மொழிபெயர்ப்பு அவற்றில் ஒன்றை மற்றொன்றால் நீக்கக்கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடை. ‘தடவித் தேடி’ என்பது மூலமொழியின் தொடுதல் சார்ந்த உருவகத்தை வாசகருக்குப் புரியுமாறு காக்கிறது; அடிக்குறிப்பு அதன் நேரடியான மாற்றையும் விளக்குகிறது.
