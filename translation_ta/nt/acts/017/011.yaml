id: ACT.17.11
reference: Acts 17:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: ta
  text: தெசலோனிக்கேயில் இருந்தவர்களைவிட இவர்கள் உயர்ந்த மனப்பான்மை கொண்டவர்களாக[a] இருந்தார்கள். ஏனெனில், இவர்கள் மிகுந்த ஆர்வத்துடன் இறைவார்த்தையை ஏற்றுக்கொண்டு,[b] இவை இவ்வாறே உள்ளனவா என்று அறிய ஒவ்வொரு நாளும் மறைநூல்களை ஆராய்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயர்குடியினராக.” கிரேக்கச் சொல் பாராட்டத்தக்க மனப்பான்மையையோ சமூகத்தில் உயர்ந்த பிறப்பையோ குறிக்கலாம்; இங்கு முதலாவது பொருளே சூழலுக்கு அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “செய்தியை மனமுவந்து வரவேற்று.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: உயர்ந்த மனப்பான்மை கொண்டவர்களாக
  rationale: இச்சொல் உயர்குடிப் பிறப்பையோ பாராட்டத்தக்க பண்பையோ குறிக்கலாம். தொடர்ந்து வரும் ஆர்வமான ஏற்றுக்கொள்ளுதலும் மறைநூல் ஆராய்ச்சியும் இங்கு மனப்பான்மையே முதன்மை என்பதைச் சுட்டுகின்றன; அதேவேளை மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οἵτινες
  choice: ஏனெனில், இவர்கள்
  rationale: இவர்கள் ஏன் உயர்ந்த மனப்பான்மை கொண்டவர்கள் என்று அடுத்த பகுதி விளக்குவதால், விளக்கக் காரணத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐδέξαντο τὸν λόγον
  choice: இறைவார்த்தையை ஏற்றுக்கொண்டு
  rationale: λόγος என்பதன் வேதாகமத் தொடர்ச்சியைப் பாதுகாக்க ‘வார்த்தை’ அடிப்படையிலான மொழிபெயர்ப்பு பயன்படுத்தப்படுகிறது. தமிழில் தனித்த ‘வார்த்தை’ தெளிவில்லாததால் வழக்கமான ‘இறைவார்த்தை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: μετὰ πάσης προθυμίας
  choice: மிகுந்த ஆர்வத்துடன்
  rationale: πάσης என்பதன் வலியுறுத்தலையும் προθυμία என்பதிலுள்ள ஆயத்தம் மற்றும் ஆர்வத்தையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τὸ καθ’ ἡμέραν
  choice: ஒவ்வொரு நாளும்
  rationale: தினந்தோறும் நிகழ்ந்த வழக்கமான செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀνακρίνοντες
  choice: ஆராய்ந்தார்கள்
  rationale: கவனமாகச் சோதித்தல் அல்லது விசாரித்தல் என்ற பொருளை, மறைநூல்களுடன் பொருந்தும் இயல்பான தமிழில் தருகிறது.
- source_word: τὰς γραφὰς
  choice: மறைநூல்களை
  rationale: இச்சூழலில் யூதர்களின் புனித எழுத்துத் தொகுப்புகளைக் குறிக்கிறது; ‘மறைநூல்கள்’ என்பது பன்மையையும் புனித நூல் குறிப்பையும் காக்கிறது.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: இவை இவ்வாறுதான் இருக்கின்றனவா என்று அறிய
  rationale: பவுலின் கூற்றுகள் உண்மையில் அவ்வாறே உள்ளனவா என்ற மறைமுக விசாரணையை, ‘உண்மையா’ என்று பொருளைச் சுருக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: εὐγενέστεροι என்பதன் சூழல்சார் பொருள்
  choice: பாராட்டத்தக்க உயர்ந்த மனப்பான்மை
  alternative: உயர்குடிப் பிறப்பு அல்லது சமூக அந்தஸ்து
  rationale: அவர்களின் ஆர்வமான வரவேற்பும் மறைநூல் ஆராய்ச்சியும் அந்த மதிப்பீட்டை விளக்குகின்றன. இருப்பினும் கிரேக்கச் சொல்லிலுள்ள சமூகப் பொருள் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: λόγος என்பதன் மொழிபெயர்ப்பு
  choice: இறைவார்த்தை
  alternative: செய்தி
  rationale: அப்போஸ்தலர் நூலில் உள்ள வேதாகமச் சொல் தொடர்ச்சியைப் பாதுகாக்கிறது; இங்கு அறிவிக்கப்பட்ட செய்தியைக் குறிக்கும் மாற்றுப் பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உயர்ந்த மனப்பான்மை,’ ‘மிகுந்த ஆர்வம்,’ ‘ஆராய்ந்தார்கள்’ ஆகிய சொற்கள் பொதுவாசகர்களுக்குப் புரியும்படி மூலத்தின் மதிப்பீட்டு மற்றும் ஆய்வுத் தன்மையைப் பாதுகாக்கின்றன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
