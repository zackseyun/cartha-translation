  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: ta
  text: சகோதரர்கள்[a] உடனே இரவில்[b] பவுலையும் சீலாவையும் பெரோயாவுக்கு அனுப்பிவிட்டார்கள். அவர்கள் அங்கு வந்ததும் யூதர்களின் தொழுகைக்கூடத்துக்குச்[c] சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதர சகோதரிகள்’ என்றும் பொருள்படலாம்; ‘சகோதரர்கள்’ என்பதற்கான கிரேக்கச் சொல் இங்கு விரிவான விசுவாசிகள் சமூகத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இரவு நேரத்தில்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘யூதத் தொழுகைக்கூடத்துக்குச்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: சகோதரர்கள்
  rationale: இறைநம்பிக்கையால் உருவான குடும்ப உறவையும், கிரேக்கச் சொல்லின் ஆண்பால் பன்மை வடிவத்தையும் நேரடியாகப் பாதுகாக்கிறது. சூழலில் பெண்களும் அடங்கிய விரிவான விசுவாசிகள் சமூகத்தைக் குறிக்க வாய்ப்புள்ளதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εὐθέως
  choice: உடனே
  rationale: தாமதமில்லாமல் விரைந்து செயல்பட்டதைக் காட்டும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: διὰ νυκτός
  choice: இரவிலேயே
  rationale: இரவு நேரத்தில் நடவடிக்கை நடந்ததைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பாகத் தருகிறது; ‘-ஏ’ உடனடியான இரவுப் புறப்பாட்டின் சூழலைத் தெளிவாக்குகிறது.
- source_word: ἐξέπεμψαν
  choice: அனுப்பிவிட்டார்கள்
  rationale: ஒரு இடத்திலிருந்து வெளியே அனுப்பியதைக் காட்டும் ἐκπέμπω வினையின் கருத்தை, அவசரமான புறப்பாட்டுச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: பவுலையும் சீலாவையும்
  rationale: τε ... καί இணைப்பு இருவரையும் ஒருங்கே சுட்டுகிறது; தமிழின் ‘-உம் ... -உம்’ அமைப்பு அந்த இணைப்பை இயல்பாகக் காட்டுகிறது.
- source_word: Βέροιαν
  choice: பெரோயாவுக்கு
  rationale: கிரேக்க இடப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது; வேற்றுமை உருபு பயணத்தின் இலக்கைத் தெளிவாக்குகிறது.
- source_word: οἵτινες παραγενόμενοι
  choice: அவர்கள் அங்கு வந்ததும்
  rationale: இடைச்சொல் அமைப்பை மரப்பொருளாகப் பின்பற்றாமல், பவுலும் சீலாவும் வந்தபின் நடந்த அடுத்த செயலை இயல்பான தொடர்கதையாகவும் காலவரிசையுடனும் தருகிறது.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: யூதர்களின் தொழுகைக்கூடத்துக்கு
  rationale: உடைமைப் பொருளுடைய கிரேக்க வேற்றுமைத் தொடரைப் பாதுகாத்து, அது பெரோயாவிலிருந்த யூத சமூகத்தின் வழிபாட்டிடத்தைக் குறிக்கிறது என்பதைத் தெளிவாகத் தருகிறது.
- source_word: ἀπῄεσαν
  choice: சென்றார்கள்
  rationale: இலக்கை நோக்கிச் சென்ற செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; கிரேக்க இறந்தகால நிறைவுறா வடிவத்தின் கதையோட்டப் பயன்பாட்டை தமிழில் எளிய இறந்தகாலம் நன்கு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கலப்பின விசுவாசிகள் சமூகத்தில் ἀδελφοὶ என்பதன் பொருள்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; விசுவாசிகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தையும் குடும்ப உறவுச் சொல்லையும் முதன்மை உரை பாதுகாக்கிறது. இருப்பினும், அப்போஸ்தலர் நடபடிகளில் இச்சொல் பெண்கள் உட்பட விரிவான விசுவாசிகள் சமூகத்தைக் குறிக்கக்கூடும் என்ற உண்மையான பொருள் வாய்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: τῶν Ἰουδαίων என்பதன் சமூகக் குறிப்பு
  choice: யூதர்களின்
  alternative: யூதத்
  rationale: மூலத்தின் உடைமை/தொடர்பு அமைப்பை வெளிப்படையாகப் பாதுகாக்கிறது. இது பெரோயாவின் யூத சமூகத்துக்குரிய தொழுகைக்கூடத்தை அடையாளப்படுத்துகிறது; யூதர்களைப் பற்றிய எதிர்மறையான இறையியல் மதிப்பீடு அல்ல.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் தெளிவான, கண்ணியமான கதையோட்டம் பயன்படுத்தப்பட்டுள்ளது. ‘தொழுகைக்கூடம்’ என்பது συναγωγή என்பதற்கான சாதாரண வாசகருக்கு புரியும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது. மூலத்தில் உள்ள இரண்டு வாக்கிய அசைவுகளும் தமிழில் இயல்பாகப் பிரிக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
