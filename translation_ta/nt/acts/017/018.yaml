source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: ta
  text: எப்பிக்கூரியர் மற்றும் ஸ்தோயிக்கர் ஆகிய தத்துவஞானிகளில் சிலரும் அவருடன் உரையாடலில் ஈடுபட்டார்கள்[a]. சிலர், “இந்தக் கருத்துத் துணுக்குப் பொறுக்கி என்ன சொல்ல முயல்கிறான்?”[b] என்றார்கள். வேறு சிலரோ, “இவன் அந்நிய தெய்வங்களை அறிவிப்பவனாகத் தெரிகிறான்”[c][d] என்றார்கள். ஏனெனில், அவர் இயேசுவையும் உயிர்த்தெழுதலையும் குறித்து நற்செய்தி அறிவித்துவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவருடன் விவாதித்தார்கள்” அல்லது “அவருடன் கலந்துரையாடினார்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் செயல்வீரியமுள்ள உரையாடலையோ கருத்து மோதலையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இது ஓர் இகழ்ச்சிச் சொல். சொல்லர்த்தத்தில் “விதை பொறுக்குகிறவன்” என்பதோடு தொடர்புடையது; பல இடங்களிலிருந்து கருத்துத் துணுக்குகளைப் பொறுக்கி அவற்றைத் திரும்பச் சொல்லுகிறவன் என்ற ஏளனப் பொருளில் பயன்படுத்தப்பட்டது.
    reason: cultural_note
  - marker: c
    text: “அந்நியத் தெய்வீக உயிர்கள்,” “அறிமுகமற்ற கடவுள்கள்,” அல்லது சொல்லளவில் “அந்நியப் பேய்கள்” என்றும் மொழிபெயர்க்கலாம். இங்கே அத்தேனையர் தங்கள் புறமதக் கருத்துப்படி அறிமுகமற்ற தெய்வீக உயிர்களைக் குறிப்பிட்டிருக்கலாம்; பிற்காலக் கிறிஸ்தவப் பொருளிலுள்ள தீய ஆவிகளை அவசியம் குறிக்கவில்லை.
    reason: alternative_reading
  - marker: d
    text: பவுல் இயேசுவையும் உயிர்த்தெழுதலையும் அறிவித்ததால், அத்தேனையர் “உயிர்த்தெழுதல்” என்பதை இன்னொரு தெய்வத்தின் பெயராகத் தவறாகப் புரிந்துகொண்டிருக்கலாம் என்று சிலர் கருதுகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: அவருடன் உரையாடலில் ஈடுபட்டார்கள்
  rationale: இச்சொல் உரையாடல், கருத்துப் பரிமாற்றம் அல்லது விவாதம் ஆகியவற்றைக் குறிக்கலாம். சூழலில் நிகழ்ந்த செயல்வீரியமுள்ள கலந்துரையாடலைக் காட்டியும், அது கட்டாயம் பகைமையான வாதம் என்று முடிவுசெய்யாமலும் இத்தேர்வு அமைந்துள்ளது.
- source_word: σπερμολόγος
  choice: பொறுக்கிப் பேசுகிறவன்
  rationale: சொல்லர்த்தத்தில் ‘விதைகளைப் பொறுக்குகிறவன்’ என்பதோடு தொடர்புடைய இகழ்ச்சிச் சொல்; பிறரிடமிருந்து கிடைக்கும் துணுக்குகளைச் சேகரித்து மீண்டும் பேசுகிறவன் என்ற ஏளனத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: என்ன சொல்ல முயல்கிறான்?
  rationale: ἄν உடன் வரும் விருப்பவினை வடிவம் தயக்கமான, இங்கே ஏளனம் கலந்த ஊகத்தைக் காட்டுகிறது. ‘முயல்கிறான்’ என்பது அதை இயல்பாகத் தருகிறது.
- source_word: Ξένων δαιμονίων
  choice: அந்நிய தெய்வங்கள்
  rationale: அத்தேனையரின் புறமதக் கருத்துலகில் δαιμόνια என்பது அவசியமாகத் தீய ஆவிகளைக் குறிக்காது; அறிமுகமற்ற தெய்வீக உயிர்களையோ தெய்வங்களையோ குறிக்கலாம். பேசுகிறவர்களின் பார்வையை இத்தேர்வு பாதுகாக்கிறது.
- source_word: καταγγελεὺς
  choice: அறிவிப்பவன்
  rationale: பொதுவாக அறிவிப்பவர் அல்லது பிரகடனப்படுத்துபவர் என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: εὐηγγελίζετο
  choice: நற்செய்தியை அறிவித்துவந்தார்
  rationale: நற்செய்தியை அறிவித்தல் என்ற வினையின் தனிப்பட்ட பொருளையும், கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவத்தின் நீடித்த செயலையும் காக்கிறது.
- source_word: ἀνάστασιν
  choice: உயிர்த்தெழுதல்
  rationale: லூக்கா இங்கே பவுலின் செய்தியின் உள்ளடக்கத்தைச் சொல்கிறார். ஆகவே இதை ஒரு தனிப்பெயராக மாற்றாமல் பொதுப்பெயராக வைத்திருக்கிறது.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: எப்பிக்கூரியர் மற்றும் ஸ்தோயிக்கர் ஆகிய தத்துவஞானிகள்
  rationale: இரு வரலாற்றுத் தத்துவப் பள்ளிகளின் பெயர்களையும் தெளிவாகப் பாதுகாக்கும் இயல்பான தமிழ் அமைப்பு.
theological_decisions:
- issue: புறமதப் பேச்சுச் சூழலில் δαιμόνια என்பதன் மொழிபெயர்ப்பு
  choice: அந்நிய தெய்வங்கள்
  alternative: அந்நியப் பேய்கள்; புதுமையான கடவுள்கள்
  rationale: ‘பேய்கள்’ என்பது பின்னைய கிறிஸ்தவப் பொருளை அத்தேனையரின் சொற்களுக்குள் கொண்டுவரக்கூடும். அவர்களின் மதக் கருத்துலகை பிரதிபலிக்க ‘தெய்வங்கள்’ பொருத்தமானது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: ἀνάστασιν என்பதை ஆளுருவாக்கப்பட்ட தெய்வத்தின் பெயராகக் காட்டலாமா
  choice: உயிர்த்தெழுதல் என்ற பொதுப்பெயர்
  alternative: ‘உயிர்த்தெழுதல்’ என்ற பெயருடைய மற்றொரு தெய்வம் என அத்தேனையர் புரிந்துகொண்டிருக்கலாம்
  rationale: மூல உரையில் லூக்கா பவுல் அறிவித்த செய்தியின் உள்ளடக்கத்தை விளக்குகிறார்; ஆளுருவாக்கம் வெளிப்படையாக இல்லை. இருந்தாலும் வரலாற்று-இலக்கண ரீதியாகச் சாத்தியமான தவறான புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தத்துவப் பள்ளிகளின் வரலாற்றுப் பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன. அத்தேனையரின் இகழ்ச்சியை மிக மென்மையாக்காமல், தமிழில் இயல்பாகத் தெரிவிக்க ‘பொறுக்கிப் பேசுகிறவன்’ பயன்படுத்தப்பட்டுள்ளது; அதன் பண்பாட்டு பின்னணி அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
