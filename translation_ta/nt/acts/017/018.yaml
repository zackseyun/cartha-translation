  source_fidelity: 'மொத்தத்தில் மூலக் கிரேக்கத்தின் கருத்தைத் துல்லியமாகக் காக்கிறது: இரு தத்துவப் பள்ளிகளைச் சேர்ந்த சிலர் பவுலுடன் விவாத/உரையாடலில் ஈடுபட்டனர்; இரண்டு வேறுபட்ட இகழ்ச்சியான எதிர்வினைகள் வருகின்றன; δαιμόνια என்பதற்கு அத்தேனையரின் பார்வையில் ‘தெய்வங்கள்’ எனத் தரப்பட்டுள்ளது; இறுதி ὅτι-விளக்கமும் பாதுகாக்கப்பட்டுள்ளது. ஆனால் σπερμολόγος என்பதற்கான முதன்மை உரையின் ‘பொறுக்கிப் பேசுகிற இவன்’ என்பது பொறுக்குதல் செயலையே ‘பேசுதல்’ உடன் இயல்பற்ற விதத்தில் இணைக்கிறது; கருத்துத் துணுக்குகளைப் பொறுக்குபவன் என்ற குறிப்பு தெளிவாக அமைய வேண்டும்.'
  naturalness: திருத்தப்பட்ட நடை நவீனத் தரத் தமிழில் இயல்பாகவும் வாசிக்கத் தெளிவாகவும் உள்ளது. ‘இந்தக் கருத்துத் துணுக்குப் பொறுக்கி’ என்பது இகழ்ச்சியையும் சொல்வழிப் பின்னணியையும் நேரடியாக உரையாடலில் திணிக்காமல், தமிழில் பொருள் விளங்கும் வகையில் தருகிறது. ‘இயேசுவையும் உயிர்த்தெழுதலையும் குறித்து நற்செய்தி அறிவித்துவந்தார்’ என்பது கிரேக்கத்தில் இரண்டும் εὐηγγελίζετο வினையின் பொருள்கள் என்பதைத் தெளிவுபடுத்துகிறது.
  terminology: ‘எப்பிக்கூரியர்’, ‘ஸ்தோயிக்கர்’, ‘தத்துவஞானிகள்’, ‘அந்நிய தெய்வங்கள்’, ‘நற்செய்தி’, ‘உயிர்த்தெழுதல்’ ஆகியவை பொருத்தமானவை. ‘அந்நிய தெய்வங்கள்’ δαιμόνια-வைத் தீய ஆவிகள் என முன்கூட்டியே விளக்காமல், பேச்சாளர்களின் புறமதச் சட்டகத்தைக் காக்கிறது. அடிக்குறிப்புகள் மாற்று வாசிப்புகளையும் வரலாற்றுச் சாத்தியத்தையும் சமநிலையுடன் தருகின்றன.
  issues:
  - severity: medium
    issue: σπερμολόγος-க்கு ‘பொறுக்கிப் பேசுகிற இவன்’ என்ற மொழிபெயர்ப்பு இயல்பற்றது.
    rationale: இச்சொல் ‘பேசும் முறையை’ அல்ல, கருத்துத் துணுக்குகளைப் பொறுக்கி மீண்டும் கூறுபவனாகக் கருதப்பட்ட ஒருவரை இகழ்ச்சியாகக் குறிக்கிறது. ‘கருத்துத் துணுக்குப் பொறுக்கி’ எனத் தருவது அந்த ஏளனப் பொருளைத் தெளிவாகக் காக்கிறது.
  - severity: low
    issue: இறுதி வாக்கியத்தில் ‘இயேசுவைப் பற்றியும் உயிர்த்தெழுதலைப் பற்றியும் நற்செய்தியை’ என்ற அமைப்பு சற்றே கனமாக உள்ளது.
    rationale: இயேசுவும் உயிர்த்தெழுதலும் நற்செய்தி அறிவிப்பின் உள்ளடக்கம் என்பதை ‘இயேசுவையும் உயிர்த்தெழுதலையும் குறித்து நற்செய்தி’ என்ற அமைப்பு நவீனத் தமிழில் தெளிவாகத் தருகிறது.
  revised_text: எப்பிக்கூரியர் மற்றும் ஸ்தோயிக்கர் ஆகிய தத்துவஞானிகளில் சிலரும் அவருடன் உரையாடலில் ஈடுபட்டார்கள்[a]. சிலர், “இந்தக் கருத்துத் துணுக்குப் பொறுக்கி என்ன சொல்ல முயல்கிறான்?”[b] என்றார்கள். வேறு சிலரோ, “இவன் அந்நிய தெய்வங்களை அறிவிப்பவனாகத் தெரிகிறான்”[c][d] என்றார்கள். ஏனெனில், அவர் இயேசுவையும் உயிர்த்தெழுதலையும் குறித்து நற்செய்தி அறிவித்துவந்தார்.
  revised_footnotes:
  - marker: a
    text: “அவருடன் விவாதித்தார்கள்” அல்லது “அவருடன் கலந்துரையாடினார்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் செயல்வீரியமுள்ள உரையாடலையோ கருத்து மோதலையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இது ஓர் இகழ்ச்சிச் சொல். சொல்லர்த்தத்தில் “விதை பொறுக்குகிறவன்” என்பதோடு தொடர்புடையது; பல இடங்களிலிருந்து கருத்துத் துணுக்குகளைப் பொறுக்கி அவற்றைத் திரும்பச் சொல்லுகிறவன் என்ற ஏளனப் பொருளில் பயன்படுத்தப்பட்டது.
    reason: cultural_note
  - marker: c
    text: “அந்நியத் தெய்வீக உயிர்கள்,” “அறிமுகமற்ற கடவுள்கள்,” அல்லது சொல்லளவில் “அந்நியப் பேய்கள்” என்றும் மொழிபெயர்க்கலாம். இங்கே அத்தேனையர் தங்கள் புறமதக் கருத்துப்படி அறிமுகமற்ற தெய்வீக உயிர்களைக் குறிப்பிட்டிருக்கலாம்; பிற்காலக் கிறிஸ்தவப் பொருளிலுள்ள தீய ஆவிகளை அவசியம் குறிக்கவில்லை.
    reason: alternative_reading
  - marker: d
    text: பவுல் இயேசுவையும் உயிர்த்தெழுதலையும் அறிவித்ததால், அத்தேனையர் “உயிர்த்தெழுதல்” என்பதை இன்னொரு தெய்வத்தின் பெயராகத் தவறாகப் புரிந்துகொண்டிருக்கலாம் என்று சிலர் கருதுகின்றனர்.
    reason: alternative_reading
  revision_rationale: σπερμολόγος என்பதன் இகழ்ச்சியான, கருத்துத் துணுக்குகளைப் பொறுக்கும் நபர் என்ற நுணுக்கத்தை முதன்மை உரையில் தெளிவுபடுத்தினேன். மேலும், இயேசுவும் உயிர்த்தெழுதலும் பவுலின் நற்செய்தி அறிவிப்பின் உள்ளடக்கம் என்பதை இயல்பான தமிழில் வெளிப்படுத்த இறுதி வாக்கிய அமைப்பைச் சிறிது செம்மைப்படுத்தினேன். மற்ற எல்லா சொல் தேர்வுகளும், அடிக்குறிப்பு அடையாளங்களும், மாற்று வாசிப்புகளும் பொருத்தமாக இருப்பதால் காக்கப்பட்டுள்ளன.
