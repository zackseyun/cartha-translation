source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: ta
  text: ஏனெனில், அவரில் நாம் வாழ்கிறோம், அசைகிறோம், இருக்கிறோம்; உங்கள் கவிஞர்களில் சிலரும்கூட, ‘ஏனெனில், நாமும் அவருடைய சந்ததியினர்’ என்று கூறியிருக்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: அவரில்தான்
  rationale: இடம் அல்லது உறவைச் சுட்டும் ἐν என்பதையும், வலியுறுத்தும் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; முன் வசனத்தில் குறிப்பிடப்பட்ட கடவுளையே ‘அவர்’ குறிக்கிறது.
- source_word: ζῶμεν καὶ κινούμεθα καὶ ἐσμέν
  choice: நாம் வாழ்கிறோம், அசைகிறோம், இருக்கிறோம்
  rationale: மூன்று இணை வினைச்சொற்களின் ஒத்த அமைப்பைப் பாதுகாக்கிறது. ἐσμέν என்பதை ‘இருக்கிறோம்’ என நேரடியாக வழங்கி, ‘உயிர்வாழ்கிறோம்’ என்ற முந்தைய சொல்லுடன் ஒன்றாக்காமல் வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: τινες τῶν καθ’ ὑμᾶς ποιητῶν
  choice: உங்கள் கவிஞர்களில் சிலர்
  rationale: கேட்போருக்குச் சார்ந்த அல்லது அவர்களிடையே மதிக்கப்படும் கவிஞர்கள் என்ற பொருளை எளிய நவீன தமிழில் தெரிவிக்கிறது.
- source_word: Τοῦ γὰρ καὶ γένος ἐσμέν
  choice: நாமும் அவருடைய சந்ததியினர்தான்
  rationale: γένος என்பதன் வம்சம்/சந்ததி சார்ந்த பொருளைப் பாதுகாக்கிறது; καί என்பதை ‘நாமும்’ என்றும் மேற்கோளின் வலியுறுத்தலை ‘தான்’ என்றும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவரில்’ வாழ்தல், அசைதல், இருத்தல் என்பதன் தன்மை
  choice: உறவு அல்லது இருப்பியல் சார்ந்த பொருளை விளக்காமல் ‘அவரில்தான்’ எனப் பாதுகாக்கப்பட்டது.
  alternative: ‘அவருடைய வல்லமையால்’ அல்லது ‘அவரைச் சார்ந்தே’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: மூலத்தின் ἐν αὐτῷ கொண்டுள்ள சுருக்கத்தையும் சாத்தியமான பொருள் நுணுக்கங்களையும் ஒரு குறிப்பிட்ட இறையியல் விளக்கமாகச் சுருக்காமல் வைக்கிறது.
- issue: மனிதர்கள் கடவுளுடைய γένος எனப்படுதல்
  choice: ‘அவருடைய சந்ததியினர்’ என்ற மேற்கோள் வடிவம் பாதுகாக்கப்பட்டது.
  alternative: ‘அவரால் படைக்கப்பட்டவர்கள்’ அல்லது ‘அவருடைய பிள்ளைகள்’ என்று இறையியல் விளக்கம் சேர்த்தல்.
  rationale: பவுல் மேற்கோள் காட்டும் கவிதை மொழியை அப்படியே தக்கவைத்து, உயிரியல் தெய்வத் தோற்றமோ இரட்சிப்பு சார்ந்த தத்தெடுப்போ என உரை கூறாத கருத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. மூலத்தின் மூவகை வினை ஒத்திசைவும் கவிதை மேற்கோளும் பாதுகாக்கப்பட்டுள்ளன.
