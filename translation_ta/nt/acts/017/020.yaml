translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதை பன்மை வினைவடிவமான ‘கொண்டுவருகிறீர்’ பயன்படுத்தப்பட்டுள்ளது. வாக்கியத்தின் காரண–விளைவு தொடர்பும், ‘காதுகள்’ என்ற மூல உருவகமும் தக்கவைக்கப்பட்டுள்ளன; கிரேக்க மரபுத்தொடர் முதன்மை உரையில் இயல்பான தமிழாகத் தரப்பட்டு, அதன் சொல்லடுக்கு அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
