  edition: SBLGNT
  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: ta
  text: ஏனெனில், எங்கள் காதுகளுக்குப் புதிதான சிலவற்றை முன்வைக்கிறீர்.[a] ஆகவே, இவற்றின் பொருள் என்ன என்பதை அறிய விரும்புகிறோம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்நியமான சிலவற்றை’ அல்லது ‘அறிமுகமில்லாத சிலவற்றை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல், கேட்பவருக்குப் புதியதாகவோ அந்நியமாகவோ இருப்பதால் புதிதாகத் தோன்றுவதைச் சுட்டலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘இவை என்னவாக இருக்க விரும்புகின்றன.’ இது ‘இவற்றின் பொருள் என்ன’ அல்லது ‘இவற்றின் முக்கியத்துவம் என்ன’ எனக் கேட்கும் ஒரு மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα τινα
  choice: அறிமுகமில்லாத சில விஷயங்கள்
  rationale: இங்கு ξενίζοντα என்பது கேட்போருக்குப் புதிதாகவோ அந்நியமாகவோ இருப்பதைக் குறிக்கிறது. ‘அறிமுகமில்லாத’ என்பது எதிர்மறையான ‘விநோதமான’ என்ற மிகைப்பைத் தவிர்த்து, τινα தரும் குறிப்பற்ற தன்மையையும் ‘சில விஷயங்கள்’ எனப் பேணுகிறது.
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: எங்கள் காதுகளுக்குக் கொண்டுவருகிறீர்
  rationale: மூலத்திலுள்ள ‘காதுகள்/கேள்விக்குள் கொண்டுவருதல்’ என்ற உடல் சார்ந்த உருவகத்தை இயல்பான தமிழில் இயன்றவரைத் தக்கவைக்கிறது.
- source_word: βουλόμεθα οὖν γνῶναι
  choice: ஆகவே ... அறிய விரும்புகிறோம்
  rationale: οὖν குறிக்கும் முடிவுறுத்தலை ‘ஆகவே’ வெளிப்படுத்துகிறது; βουλόμεθα மற்றும் γνῶναι ஆகியவை முறையே விருப்பத்தையும் அறிதலையும் நேரடியாகக் காட்டுகின்றன.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: இவற்றின் பொருள் என்ன
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இவை என்னவாக இருக்க விரும்புகின்றன’ என்பதாக இருந்தாலும், இக்கிரேக்க மரபுத்தொடர் செய்தியின் பொருள் அல்லது முக்கியத்துவத்தைக் கேட்கிறது. தமிழில் ‘இவற்றின் பொருள் என்ன’ என்பது இயல்பாக அதைக் கடத்துகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைப் பேணுகிறது.
