id: ACT.17.29
reference: Acts 17:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: ta
  text: ஆகவே, நாம் கடவுளின் சந்ததியினராக இருப்பதால், தெய்வீக இருப்பு[a] பொன், வெள்ளி, கல், அல்லது மனிதனின் கலைத்திறனாலும் சிந்தனையாலும் வடிவமைக்கப்பட்ட செதுக்குருவுக்கு[b] ஒப்பானது என்று எண்ணக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தெய்வம்,” “தெய்வத்தன்மை,” அல்லது “தெய்வீக இயல்பு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் τὸ θεῖον என்பது தெய்வீகமானதைக் குறிக்கும் பரந்த சொல்; இங்கு பவுலின் வாதத்தில் அது உண்மையான கடவுளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “செதுக்கப்பட்ட உருவம்” அல்லது “பொறிக்கப்பட்ட பொருள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: சந்ததியினர்
  rationale: கடவுளிடமிருந்து வந்தவர்கள் என்ற உறவையும் தோற்றத்தையும் தெரிவிக்கிறது; இனத்தையோ ஒரு குறுகிய குடும்ப அமைப்பையோ குறிப்பதில்லை.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தின் வாதத்திலிருந்து பெறப்படும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: ὑπάρχοντες
  choice: இருப்பதால்
  rationale: இங்கு வினையெச்சம் காரணப் பொருளில் உள்ளது; அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐκ ὀφείλομεν νομίζειν
  choice: நாம் எண்ணக்கூடாது
  rationale: இது வெறும் சாத்தியமின்மையை அல்ல, அப்படி எண்ணுவது தகாதது என்ற கடமைசார் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: பொன்னுக்கோ வெள்ளிக்கோ கல்லுக்கோ
  rationale: கிரேக்க மூலத்தில் வரிசையாகக் குறிப்பிடப்பட்டுள்ள மூன்று பொருட்களையும் காக்கிறது.
- source_word: χαράγματι
  choice: செதுக்கப்பட்ட ஓர் உருவம்
  rationale: செதுக்குதல் அல்லது பொறித்தல் மூலம் உண்டாக்கப்பட்ட பொருள் என்ற கருத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τέχνης καὶ ἐνθυμήσεως ἀνθρώπου
  choice: மனிதக் கலைத்திறனாலும் சிந்தனையாலும்
  rationale: τέχνη என்பதன் கைவினை/கலைத்திறனையும் ἐνθύμησις என்பதன் மனக்கருத்து அல்லது வடிவமைப்பையும் இணையாகக் காக்கிறது.
- source_word: τὸ θεῖον
  choice: தெய்வீகமானது
  rationale: தெய்வத்துக்குரியது அல்லது தெய்வீக இருப்பு என்ற பரந்த, தத்துவநடை கொண்ட சொல்லைத் தொழில்நுட்பமான பிற்கால இறையியல் பதமாகக் குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: தத்துவநடையிலான ஒரே கடவுள் வாதத்தில் τὸ θεῖον என்பதன் மொழிபெயர்ப்பு
  choice: தெய்வீகமானது
  alternative: தெய்வீக இருப்பு; தெய்வத்தன்மை; தெய்வம்
  rationale: பவுல் உண்மையான கடவுளைப் பற்றிப் பேசினாலும், இங்கு பொதுவான தத்துவநடைச் சொல்லைப் பயன்படுத்துகிறார். ‘தெய்வீகமானது’ அந்தச் சொல்லின் பரப்பையும் சிறிதளவு உள்ள இயல்பான தெளிவின்மையையும் காக்கிறது; அதை வெறும் பண்பாகவோ பிற்கால தொழில்நுட்ப இறையியல் சொல்லாகவோ மாற்றுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆகவே’ வாதத் தொடர்பை வெளிப்படுத்துகிறது. பொன், வெள்ளி, கல் ஆகியவற்றிற்கும் மனிதனால் உருவாக்கப்பட்ட உருவத்திற்கும் இடையிலான ஒப்பீட்டை நீண்ட கோடுகள் தெளிவுபடுத்துகின்றன; மூலத்தின் தத்துவச் சொல்வழக்கு அடிக்குறிப்புடன் காக்கப்பட்டுள்ளது.
