  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: ta
  text: 'பவுல் அரேயோபாகுவின் நடுவில் நின்று கூறினார்: “அத்தேனையைச் சேர்ந்த ஆண்களே, நீங்கள் எல்லா வகையிலும் மிகவும் மதப்பற்றுள்ளவர்கள்[a] என்று நான் காண்கிறேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிக மூடநம்பிக்கையுள்ளவர்கள்” அல்லது “மேலும் மதப்பற்றுள்ளவர்கள்.” கிரேக்கச் சொல்லை எதிர்மறையாகவும் நேர்மறையாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς δὲ
  choice: அப்போது ... நின்று
  rationale: δέ கதையில் மென்மையான தொடர்ச்சியைச் சுட்டுகிறது; அப்போது என்பது இயல்பான தமிழ் இணைப்பு. Σταθεὶς காட்சியமைக்கும் இறந்தகால வினையெச்சமாக இருப்பதால் நின்று என்று வழங்கப்பட்டது.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: அரேயோபாகுவின் நடுவில்
  rationale: கிரேக்கச் சொற்றொடரின் இடப்பொருளை நேரடியாகக் காக்கிறது; இதை சபையின் முன் என்று விளக்கி மொழிபெயர்ப்பதன் மூலம் இடமா, மன்றமா என்ற சாத்தியத்தைத் தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: Ἀρείου Πάγου
  choice: அரேயோபாகு
  rationale: கிரேக்கப் பெயரின் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது; மார்ஸ் குன்று என்ற இலத்தீன் மரபுசார் மாற்றுப்பெயர் தவிர்க்கப்பட்டது.
- source_word: ἔφη
  choice: கூறினார்
  rationale: உரையை அறிமுகப்படுத்தும் இயல்பான, கண்ணியமான நவீனத் தமிழ் வடிவம்.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: அத்தேனைச் சேர்ந்த ஆண்களே
  rationale: ἄνδρες என்பதன் ஆண்பால் குறிப்பையும் Ἀθηναῖοι என்பதன் ஊர்சார் அழைப்பையும் தெளிவாகக் காக்கிறது.
- source_word: κατὰ πάντα
  choice: எல்லா வகையிலும்
  rationale: ஒவ்வொரு அம்சத்திலும் என்ற பரந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: δεισιδαιμονεστέρους
  choice: மிகுந்த சமயப்பற்றுள்ளவர்களாக
  rationale: இந்த ஒப்பீட்டுருவச் சொல் சமயப்பற்று அல்லது மூடநம்பிக்கை என நேர்மறையாகவும் எதிர்மறையாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரையில் சொல்லின் சொற்பொழிவு நயத்தையும் ஒப்பீட்டின் வலியுறுத்தல் பயன்பாட்டையும் இயல்பாகக் காக்கும் ஒப்பீட்டளவில் நடுநிலையான மொழி தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டன.
- source_word: θεωρῶ
  choice: நான் காண்கிறேன்
  rationale: கவனித்தறிதல் அல்லது உணர்தல் என்ற பொருளை எளிய, இயல்பான பேச்சுத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: அத்தேனையரின் சமயநிலையை δεισιδαιμονεστέρους மூலம் பவுல் வர்ணிக்கும் தொனி
  choice: முதன்மை உரையில் ஒப்பீட்டளவில் நடுநிலையான மிகுந்த சமயப்பற்றுள்ளவர்கள்
  alternative: அதிக மூடநம்பிக்கையுள்ளவர்கள்; இன்னும் அதிக சமயப்பற்றுள்ளவர்கள்
  rationale: கிரேக்கச் சொல் பாராட்டாகவும் குறைகூறலாகவும் ஒலிக்கக்கூடியது; பவுலின் தொடக்கச் சொற்களில் உள்ள சொற்பொழிவு நயத்தையும் இறையியல் பதற்றத்தையும் ஒரே திசையில் தீர்மானிக்காமல் காக்க, நடுநிலைத் தேர்வு முதன்மை உரையிலும் மற்ற வாசிப்புகள் அடிக்குறிப்பிலும் வைக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான பேச்சுநடை பயன்படுத்தப்பட்டது. அரேயோபாகு ஒலிபெயர்ப்பாக வைக்கப்பட்டது; பாலினக் குறிப்பு மற்றும் மூலத்தின் உண்மையான சொற்பொருள் இருமை பாதுகாக்கப்பட்டன.
