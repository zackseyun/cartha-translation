  text: So Paul went out from among them[a].
translation:
  language: ta
  text: இவ்வாறு பவுல் அவர்களிடையிலிருந்து வெளியேறினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவ்விதமாக பவுல் அவர்கள் நடுவிலிருந்து புறப்பட்டுச் சென்றார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: இது நிகழ்வின் முடிவைக் குறிக்கும் உரையாடல் இணைப்பாகச் செயல்பட்டு, ‘இவ்விதமாக/அப்படியே’ என்ற தொடர்ச்சி உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: ὁ Παῦλος
  choice: பவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐξῆλθεν
  choice: வெளியேறினார்
  rationale: ἐξέρχομαι என்பதன் நேரடியான வெளியே செல்லுதல் அல்லது புறப்படுதல் என்ற பொருளை, அடுத்து வரும் இடத்தொடருடன் இயல்பாக இணைக்கிறது.
- source_word: ἐκ μέσου αὐτῶν
  choice: அவர்களிடையிலிருந்து
  rationale: கூடியிருந்த அந்த மக்களின் நடுவிலிருந்து பவுல் நீங்கிச் சென்றார் என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமான கதைநடையும் இயக்கத்தைக் குறிக்கும் சொல்லாட்சியும் பேணப்பட்டுள்ளன.
