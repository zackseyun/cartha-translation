id: ACT.17.24
reference: Acts 17:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: ta
  text: உலகத்தையும் அதிலுள்ள அனைத்தையும் படைத்த கடவுள், வானத்திற்கும் பூமிக்கும் ஆண்டவராய் இருந்து, மனிதக் கைகளால் கட்டப்பட்ட கோவில்களில்[a] குடியிருப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “கைகளால் செய்யப்பட்ட கோவில்கள்.” இச்சொற்றொடர் மனிதர்கள் கட்டிய கோவில்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: படைத்த
  rationale: இறந்தகாலப் பங்கேற்புவினை ὁ θεός என்பதை விளக்குகிறது. தமிழில் பெயரெச்ச வடிவமான ‘படைத்த’ இயல்பாகவும் மூலத்தின் செயற்பொருளை நேரடியாகவும் தருகிறது.
- source_word: κόσμον
  choice: உலகத்தை
  rationale: இச்சூழலில் படைக்கப்பட்ட உலகம் முழுவதையும் குறிக்கிறது; ‘உலகம்’ நவீனத் தமிழில் இயல்பானதும் போதிய அளவு விரிவானதும் ஆகும்.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: அதிலுள்ள அனைத்தையும்
  rationale: κόσμος என்பதற்குள் உள்ள யாவற்றையும் உள்ளடக்கும் πάντα என்பதன் முழுமையான பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὑπάρχων κύριος
  choice: ஆண்டவராய் இருந்து
  rationale: ὑπάρχων குறிக்கும் நிலையைப் பாதுகாக்கிறது; இதை காரணப் பொருளாக மாற்றாமல் மூலத்தின் பங்கேற்புவினைத் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இங்கு வானத்தின்மீதும் பூமியின்மீதும் கடவுளுக்குள்ள இறையாண்மையைக் குறிக்கிறது; ‘ஆண்டவர்’ dignified and standard Tamil equivalent.
- source_word: οὐρανοῦ καὶ γῆς
  choice: வானத்திற்கும் பூமிக்கும்
  rationale: இரு உரிச்சொல் தொடர்புகளும் κύριος என்பதோடு இணைகின்றன; தமிழில் ‘வானத்திற்கும் பூமிக்கும் ஆண்டவர்’ என்பது தெளிவான இயல்பான அமைப்பு.
- source_word: χειροποιήτοις
  choice: மனிதக் கைகளால் கட்டப்பட்ட
  rationale: மனிதர்கள் உருவாக்கியவை என்ற உட்கருத்தை வெளிப்படுத்துகிறது; கோவில்களுடன் இயல்பாக அமைய ‘கட்டப்பட்ட’ பயன்படுத்தப்படுகிறது.
- source_word: ναοῖς
  choice: கோவில்களில்
  rationale: வழிபாட்டுக்குரிய புனிதக் கட்டடங்களைக் குறிக்கும் ναός என்பதற்கு இச்சூழலில் பொதுவாகப் புரியும் தமிழ் சொல் ‘கோவில்’.
- source_word: κατοικεῖ
  choice: குடியிருப்பதில்லை
  rationale: ஒரு இடத்தில் வாசம்செய்தல் அல்லது நிலையாகத் தங்குதல் என்ற பொருளைத் தருகிறது; ஆலயத்தில் தெய்வம் வசிப்பதாகக் கருதும் பின்னணிக்கு ஏற்றது.
theological_decisions:
- issue: கடவுளின் எல்லைகடந்த தன்மையும் கோவிலுக்குள் இடப்படுத்தப்படுதலும்
  choice: படைப்பாளரும் வானம் பூமியின் ஆண்டவருமான கடவுள் மனிதர்கள் கட்டிய கோவில்களில் குடியிருப்பதில்லை என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுளை கோவில்களுக்குள் அடக்கிவைக்க முடியாது’ என்று விரிவாகப் பொருளுரைக்கலாம்.
  rationale: மூலவாக்கியத்தின் நேரடியான கூற்றை மட்டும் தருகிறது; அதிலிருந்து பெறக்கூடிய பரந்த இறையியல் முடிவை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- issue: ὑπάρχων என்பதன் தொடர்பு
  choice: ‘ஆண்டவராய் இருந்து’ என்று நிலையைச் சுட்டும் பங்கேற்புவினையாக வைக்கப்பட்டது.
  alternative: ‘ஆண்டவராய் இருப்பதால்’ என்று காரணப் பொருளில் மொழிபெயர்க்கலாம்.
  rationale: கிரேக்கப் பங்கேற்புவினை காரணத்தை வெளிப்படையாகக் குறிக்கவில்லை; ஆகவே சாத்தியமான இறையியல் தர்க்கத்தை மொழிபெயர்ப்பே தீர்மானிக்காமல் விட்டுள்ளது.
translation_notes:
  register: 'நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘கடவுள்,’ ‘ஆண்டவர்,’ ‘குடியிருப்பதில்லை’ ஆகியவை பரவலாகப் புரியும் சொற்கள். இருப்பினும் சமர்ப்பிக்கப்பட்ட உரையில் ‘இருப்பதால் அல்ல’ என்ற தேவையற்ற சொற்றொடர் ஏற்பட்டுள்ளது; வெளியீட்டிற்கான சரியான உரை: ‘உலகத்தையும் அதிலுள்ள அனைத்தையும் படைத்த கடவுள், வானத்திற்கும் பூமிக்கும் ஆண்டவராய் இருந்து, மனிதக் கைகளால் கட்டப்பட்ட கோவில்களில்[a] குடியிருப்பதில்லை.’'
