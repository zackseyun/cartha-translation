  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: ta
  text: ஆனால், அவர்களைக் காணாதபோது, யாசோனையும் சில சகோதரர்களையும்[a] நகர அதிகாரிகளின் முன்[b] இழுத்துக்கொண்டு போய், “குடியிருக்கும் உலகையே[c] கலக்கிவிட்ட இவர்கள் இங்கேயும் வந்திருக்கிறார்கள்!” என்று கூச்சலிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பது இங்கு சக விசுவாசிகளைக் குறிக்கிறது; சூழலைப் பொறுத்து இந்தப் பன்மைச் சொல் பெண்களையும் உள்ளடக்கிய குழுவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “பொலித்தார்க்குகள்” என்று உள்ளது; இது மக்கெதோனிய நகர அதிகாரிகளுக்குரிய உள்ளூர் பதவிப்பெயர்.
    reason: cultural_note
  - marker: c
    text: அதாவது, “மனிதர்கள் குடியிருக்கும் உலகம்”; இச்சொல் அக்காலத்தில் அறியப்பட்ட நாகரிக உலகை, பெரும்பாலும் ரோம உலகை, குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες
  choice: அவர்களைக் காணாததால்
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கு முன் நிகழ்ந்த சூழ்நிலையையும் காரணத் தொடர்பையும் காட்டுகிறது; தமிழில் இது இயல்பாகவும் சுருக்கமாகவும் அமைகிறது.
- source_word: ἔσυρον
  choice: இழுத்துக்கொண்டு போய்
  rationale: σύρω வலுக்கட்டாயமாக இழுத்துச் செல்வதைக் குறிக்கிறது; வெறுமனே ‘கொண்டுபோய்’ என்பதைக் காட்டிலும் உடல் வன்முறையின் நிழலை இது காக்கிறது.
- source_word: τινας ἀδελφοὺς
  choice: சகோதரர்கள் சிலரையும்
  rationale: இங்கு ἀδελφοί கிறிஸ்துவை நம்பிய சமூகத்தினரைச் சுட்டுகிறது. மூலத்தின் உறவுமுறைச் சொல்லை முதன்மை உரையில் காத்து, அதன் சமூகப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: நகர அதிகாரிகளிடம்
  rationale: πολιτάρχης மக்கெதோனிய நகராட்சிக்குரிய குறிப்பிட்ட பதவிப்பெயர். அதன் செயல்பாட்டை இன்றைய வாசகர் தெளிவாகப் புரிந்துகொள்ளும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: βοῶντες
  choice: கூச்சலிட்டார்கள்
  rationale: இச்சொல் உரத்த பொதுக் கூக்குரலைக் குறிக்கிறது; குற்றஞ்சாட்டிய கூட்டத்தின் தீவிரத்தைக் காக்கிறது.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: குடியிருக்கும் உலகையே கலக்கிவிட்ட இவர்கள்
  rationale: οἰκουμένη என்பதன் ‘மனிதர்கள் குடியிருக்கும் உலகம்’ என்ற பொருளையும், ἀναστατόω என்பதன் பெரும் குழப்பம் அல்லது கலக்கம் உண்டாக்குதல் என்ற குற்றச்சாட்டையும் காக்கிறது; ‘தலைகீழாக்கினர்’ என்ற தமிழ் சொற்றொடர் இங்கு தேவையற்ற வேறு நிழற்பொருளை ஏற்படுத்தக்கூடும்.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: இவர்கள் இங்கேயும் வந்திருக்கிறார்கள்
  rationale: πάρειμι வருகையின் விளைவாக இப்போது அங்கே இருப்பதைக் குறிக்கிறது; ‘வந்திருக்கிறார்கள்’ அந்த வருகையையும் தற்போதைய இருப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. καί என்பது ‘இங்கேயும்’ எனக் காக்கப்பட்டுள்ளது.
