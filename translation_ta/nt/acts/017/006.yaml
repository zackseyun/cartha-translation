translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. குற்றஞ்சாட்டும் கூட்டத்தின் வன்முறையும் உரத்த தொனியும் காக்கப்பட்டுள்ளன. தொழில்நுட்பமான மக்கெதோனிய பதவிப்பெயர் முதன்மை உரையில் செயல்பாட்டு மொழியாகவும் அடிக்குறிப்பில் வரலாற்றுப் பெயராகவும் தரப்பட்டுள்ளது.
