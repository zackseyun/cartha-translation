source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: ta
  text: ஆனால் யூதர்கள் பொறாமை கொண்டு, சந்தைவெளியிலிருந்த தீய மனிதர்கள் சிலரைத் தங்களோடு சேர்த்துக்கொண்டு, ஒரு கும்பலைத் திரட்டி நகரத்தில் கலக்கத்தை ஏற்படுத்திக்கொண்டிருந்தார்கள்; அவர்கள் யாசோனின் வீட்டிற்கு வந்து, அவர்களைக் குடிமக்கள் மன்றத்திற்கு[a] கொண்டுவர முயன்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பொது மன்றத்திற்கு” அல்லது “மக்களின் முன்.” கிரேக்கச் சொல் வெறும் வரையறையற்ற கூட்டத்தையல்ல, பொதுவில் கூடிய குடிமக்கள் அமைப்பைக் குறிக்கிறது.
    reason: δῆμος என்பதன் நிறுவனச் சார்ந்த பொருளையும் இயல்பான மாற்று மொழிபெயர்ப்புகளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: ζηλώσαντες
  choice: பொறாமைகொண்டு
  rationale: முதன்மைச் செயல்களுக்கு உந்துதலான மனநிலையை இயல்பான தமிழில் தெரிவிக்கிறது; சூழலில் ‘ஆர்வம்’ என்பதைக் காட்டிலும் எதிர்மறையான ‘பொறாமை’ பொருத்தமானது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல் இன-சமயக் குழுவைக் குறிக்கிறது; ‘யூதத் தலைவர்கள்’ என்று மூலத்தில் இல்லாத வரம்பைச் சேர்க்கவில்லை. சூழலில் இது தெசலோனிக்கேயிலிருந்த ஒரு குறிப்பிட்ட யூதக் குழுவைக் குறிக்கிறது.
- source_word: προσλαβόμενοι
  choice: தங்களோடு சேர்த்துக்கொண்டு
  rationale: மற்றவர்களைத் தங்கள் பக்கம் இணைத்துக்கொண்டதைக் காட்டும் நடுத்தர வினை வடிவத்தின் பொருளை இயல்பாக வெளிப்படுத்துகிறது; கூலிக்கு அமர்த்தியதாகக் கூறவில்லை.
- source_word: τῶν ἀγοραίων
  choice: சந்தைவெளியிலிருந்த
  rationale: அகோராவுடன் தொடர்புடைய அல்லது அங்கு காணப்பட்டவர்களைக் குறிக்கிறது; ‘வேலையற்றவர்கள்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத மதிப்பீட்டைத் தவிர்க்கிறது.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: தீய மனிதர்கள் சிலரை
  rationale: τινάς என்பதன் குறிப்பற்ற தன்மையையும் πονηρούς என்பதன் எதிர்மறையான ஒழுக்க மதிப்பீட்டையும் காக்கிறது.
- source_word: ὀχλοποιήσαντες
  choice: ஒரு கும்பலைத் திரட்டி
  rationale: வெறும் கூட்டம் அல்ல, கலகம் செய்யும் பகைமையான திரளை உருவாக்கிய சூழல்சார் வலிமையை ‘கும்பல்’ வெளிப்படுத்துகிறது.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: நகரத்தைக் கலக்கிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியையும் நகரமெங்கும் ஏற்பட்ட குழப்பத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: யாசோனின் வீட்டிற்கு வந்து
  rationale: இங்கு வினைச்சொல் வந்து சேருதல் அல்லது அணுகுதல் என்ற பொருளில் உள்ளது; ‘தாக்கி’ என்பது மூலச் சொல்லை விட வலிமையானது.
- source_word: ἐζήτουν
  choice: முயன்றார்கள்
  rationale: இச்சூழலில் அவர்கள் தேடிக்கொண்டிருந்த நோக்கம் அடுத்த இறுதிநிலை வினையால் விளக்கப்படுகிறது; ‘கொண்டுவரத் தேடினார்கள்’ என்ற இயல்பற்ற தமிழுக்குப் பதிலாக முயற்சியைத் தெளிவாகக் கூறுகிறது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: கிரேக்கத்தில் உள்ள சுட்டுப்பெயரை அப்படியே வைத்ததால், அதன் குறிப்பை பவுல் மற்றும் சீலா என்று மொழிபெயர்ப்பே வெளிப்படையாக நிர்ணயிக்கவில்லை.
- source_word: προαγαγεῖν
  choice: கொண்டுவர
  rationale: வீட்டிலிருந்து வெளியே அல்லது பொதுமக்களின் முன்னே அழைத்துவரும் பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν δῆμον
  choice: பொதுமன்றத்திற்கு
  rationale: δῆμος என்பது வரையறையற்ற ஒரு கூட்டத்தையல்ல, பொதுவில் கூடும் குடிமக்கள் அமைப்பைக் குறிக்கிறது; ‘பொதுமன்றம்’ அதன் நிறுவனத் தன்மையையும் வாசிப்புத் தெளிவையும் காக்கிறது.
theological_decisions:
- issue: மோதல் நிகழ்வில் οἱ Ἰουδαῖοι என்பதன் மொழிபெயர்ப்பு
  choice: யூதர்கள்
  alternative: யூதத் தலைவர்கள் / யூதேயர்கள்
  rationale: மூலச்சொல்லை விரிவாக்காமலும் குறுக்காமலும் நேரடியாகத் தருகிறது. இச்சூழல் தெசலோனிக்கேயிலிருந்த ஒரு குறிப்பிட்ட குழுவைக் குறிக்கிறதே அன்றி எல்லாக் காலங்களிலுமுள்ள அனைத்து யூதர்களையும் குறிக்கவில்லை; ஆயினும் அந்த விளக்கத்தை முதன்மை உரைக்குள் சேர்த்து மூலத்தை மாற்றவில்லை.
- issue: δῆμος என்பதன் சமூக-அரசியல் தன்மை
  choice: பொதுமன்றம்
  alternative: மக்கள் / கூட்டம்
  rationale: இது வெறும் கட்டுப்பாடற்ற மக்கள் திரளைக் குறிக்காமல், பொதுவாகக் கூடும் குடிமக்கள் அமைப்பைக் குறிக்கிறது. ஆகவே முன் குறிப்பிடப்பட்ட ‘கும்பல்’ மற்றும் இங்குள்ள ‘பொதுமன்றம்’ இரண்டையும் ஒன்றாக்காமல் வேறுபடுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான கலகத்தை ‘கலக்கிக்கொண்டிருந்தார்கள்’ என்றும், பகைமையான திரளை ‘கும்பல்’ என்றும் வேறுபடுத்தியுள்ளது. ‘யாசோன்’ என்பது Ἰάσων என்ற பெயரின் தமிழாக்கம்.
