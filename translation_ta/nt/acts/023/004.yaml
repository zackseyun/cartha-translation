  text: οἱ δὲ παρεστῶτες εἶπαν· Τὸν ἀρχιερέα τοῦ θεοῦ λοιδορεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: ta
  text: அருகில் நின்றவர்கள், “கடவுளுடைய தலைமை ஆசாரியரை அவமதிக்கிறாயா?”[a] என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய தலைமை ஆசாரியரை வசைபாடுகிறாயா?”
    reason: λοιδορεῖς என்பதன் சொல்லால் இழிவுபடுத்துதல் அல்லது வசைபாடுதல் என்ற வலுவான பொருளைச் சுட்டுகிறது.
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: அருகில் நின்றுகொண்டிருந்தவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பன்மை வினையெச்சம், பவுலின் அருகில் நின்றிருந்தவர்களைக் குறிக்கிறது. ‘அருகில்’ என்பது παρίστημι என்பதன் இடவியல் உணர்வை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἶπαν
  choice: என்று கேட்டார்கள்
  rationale: εἶπαν என்பது எளிய இறந்தகாலத்தில் உரையாடலை முன்னெடுக்கிறது. கிரேக்கத்தில் ‘சொன்னார்கள்’ என்றாலும், மேற்கோள் கேள்வியாக இருப்பதால் தமிழில் ‘என்று கேட்டார்கள்’ என்பது இயல்பாக உள்ளது.
- source_word: ἀρχιερέα
  choice: தலைமைக் குருவை
  rationale: இச்சூழலில் ἀρχιερεύς யூதர்களின் தலைமை மதகுருவைக் குறிக்கிறது. ‘தலைமைக் குரு’ என்பது பதவியைத் தெளிவாகவும் தற்போதைய தமிழில் புரியும்படியும் வழங்குகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளுடைய
  rationale: இந்த மரபுத்தொடர் அந்தப் பதவியைக் கடவுளோடு தொடர்புபடுத்துகிறது. தமிழில் உடைமை வேற்றுமை இயல்பாக இருந்து, அந்நபரின் நடத்தைக்கு கடவுள் ஒப்புதல் அளித்தார் என்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: λοιδορεῖς
  choice: அவமதிக்கிறாயா
  rationale: λοιδορέω என்பது இழிவாகப் பேசுதல், வசைபாடுதல் அல்லது சொல்லால் அவமதித்தல் என்பதைக் குறிக்கிறது. ‘அவமதிக்கிறாயா’ என்பது கண்டிக்கும் கேள்வியின் வலிமையைத் தெளிவான நவீனத் தமிழில் தருகிறது; அடிக்குறிப்பில் சொல்லால் நிகழும் செயல் மேலும் வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: τοῦ θεοῦ என்பது தலைமைக் குருவுடன் கொண்டுள்ள தொடர்பு
  choice: ‘கடவுளுடைய தலைமைக் குரு’ என்று மொழிபெயர்த்து, உரையில் கூறப்பட்ட பதவித் தொடர்பை மட்டும் வெளிப்படுத்துதல்
  alternative: ‘கடவுளின் தலைமைக் குரு’
  rationale: இந்தச் சொற்றொடர் தலைமைக் குருவின் பதவியைக் கடவுளுடன் தொடர்புபடுத்துகிறது; அந்தப் பதவியில் இருந்த நபரின் நடத்தைக்கு கடவுள் ஒப்புதல் அளித்ததாக இதை விரிவுபடுத்தக் கூடாது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நேரடி உரையின் கண்டிக்கும் கேள்வித்தொனி காக்கப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
