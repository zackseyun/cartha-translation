    issue: ‘தலைமைக் குரு’ does not clearly identify the Jewish high-priestly office.
    rationale: ἀρχιερέα refers specifically to the high priest. In modern Tamil, ‘குரு’ has broader associations and may obscure the priestly office; ‘தலைமை ஆசாரியர்’ is more precise without adding interpretation.
