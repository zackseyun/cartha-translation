source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: ta
  text: ஆகவே படைவீரர்கள், தங்களுக்குக் கட்டளையிடப்பட்டிருந்தபடி[a], பவுலை அழைத்துக்கொண்டு இரவில்[b] அந்திப்பத்திரிக்குக் கொண்டுபோனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களுக்குக் கொடுக்கப்பட்ட கட்டளைகளின்படி.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இரவு நேரத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: ஆகவே படைவீரர்கள்
  rationale: οὖν கதையின் தொடர்ச்சியையும் அதன் விளைவையும் குறிக்கிறது; μέν அடுத்த வசனத்திலுள்ள தொடருடன் உரையாடல் அமைப்பை உருவாக்கினாலும், தமிழில் அதைத் தனியாக மொழிபெயர்ப்பது இயல்பாக இருக்காது.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: தங்களுக்குக் கட்டளையிடப்பட்டிருந்தபடி
  rationale: διατάσσω என்பதன் நிறைவேற்றப்பட்ட செயப்பாட்டு வினையெச்ச வடிவம், முன்பே அவர்களுக்குக் கொடுக்கப்பட்ட கட்டளையைக் குறிக்கிறது. தமிழில் செயப்பாட்டு பொருளையும் முந்திய கட்டளையையும் இச்சொற்றொடர் தெளிவாகக் காக்கிறது.
- source_word: ἀναλαβόντες
  choice: அழைத்துக்கொண்டு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த துணைச் செயலைக் குறிக்கிறது. பவுலைத் தங்களுடன் கூட்டிச் சென்றனர் என்ற பொருளை இயல்பாகத் தருகிறது; ‘காவலுடன் அழைத்துச் சென்றனர்’ என மூலத்தில் நேரடியாக இல்லாத நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: ἤγαγον
  choice: கொண்டுபோனார்கள்
  rationale: ἄγω என்பது நடத்துதல், அழைத்துச் செல்லுதல், கொண்டுபோதல் ஆகிய பொருள்களைக் கொண்டது. பயணத்தின் இலக்கு குறிப்பிடப்படுவதால், தமிழில் ‘கொண்டுபோனார்கள்’ இயல்பாக உள்ளது.
- source_word: διὰ νυκτός
  choice: இரவில்
  rationale: διά + νυκτός என்பது ‘இரவு நேரத்தில்’ அல்லது ‘இரவின்போது’ என்பதைக் குறிக்கிறது. பயணம் இரவு முழுவதும் நீடித்தது என்று தேவையின்றி உணர்த்தாமல் ‘இரவில்’ நேரத்தைக் குறிக்கிறது.
- source_word: Ἀντιπατρίδα
  choice: அந்திப்பத்திரி
  rationale: இடப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் வழங்கப்பட்டுள்ளது; இயக்கத்தைக் குறிக்க நான்காம் வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
