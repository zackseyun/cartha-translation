source:
  edition: SBLGNT
  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: ta
  text: அவர்கள் தலைமை ஆசாரியர்களிடமும் மூப்பர்களிடமும் சென்று, “பவுலைக் கொல்லும்வரை எதையும் சுவைக்கமாட்டோம் என்று நாங்கள் எங்களையே சாபத்திற்கு உட்படுத்திக்கொண்டு ஆணையிட்டிருக்கிறோம்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “நாங்கள் எங்களைச் சாபத்துக்குள்ளாக்கிக்கொண்டோம்.” கிரேக்கச் சொற்றொடர், அந்த ஆணையை மீறினால் தங்கள்மேல் சாபம் வரட்டும் என்று தங்களையே பிணைத்துக்கொள்ளும் ஆணையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட சதிகாரர்களையே தொடர்புப்பெயர் சுட்டுகிறது; தமிழ்க் கதைநடையில் “அவர்கள்” இயல்பாக அந்தத் தொடர்பைத் தொடர்கிறது.
- source_word: προσελθόντες
  choice: வந்து
  rationale: முதன்மை வினையான “என்றார்கள்” என்பதற்கு முன் நிகழ்ந்த அணுகுதலை இயல்பான தமிழ் வினையெச்சமாகத் தருகிறது.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: தலைமை ஆசாரியர்களிடம்
  rationale: இரண்டாம் ஆலயக் கால யூதத் தலைமைச் சூழலில் உள்ள ஆசாரியத் தலைவர்களின் குழுவைக் குறிக்கும் நிலையான, புரிந்துகொள்ளக்கூடிய சொற்றொடர்.
- source_word: τοῖς πρεσβυτέροις
  choice: மூப்பர்களிடம்
  rationale: வயதில் முதியவர்களை மட்டும் அல்லாமல் அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களைக் குறிக்கும் நிறுவனப் பொருளைப் பாதுகாக்கிறது.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: நாங்கள் எங்கள்மேல் சாபத்தை ஏற்று ... ஆணையிட்டுக்கொண்டோம்
  rationale: பெயர்ச்சொல்–வினைச்சொல் இணைப்பு வெளிப்படுத்தும் கடுமையான, தம்மீதே சாபம் வருமாறு செய்த ஆணையைத் தெளிவான நவீன தமிழில் தருகிறது; பிற்கால சமயக் கலைச்சொல்லான “அனத்தேமா”வைத் தவிர்க்கிறது.
- source_word: μηδενὸς γεύσασθαι
  choice: எதையும் சுவைப்பதில்லை
  rationale: γεύομαι என்பதன் நேரடியான “சுவைத்தல்/உட்கொள்ளுதல்” பொருளையும் μηδενός என்பதன் முழுமையான மறுப்பையும் பாதுகாக்கிறது.
- source_word: ἕως οὗ
  choice: வரை
  rationale: அவர்களுடைய ஆணையின் கால எல்லையைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἀποκτείνωμεν
  choice: கொல்லும்வரை
  rationale: எதிர்பார்க்கப்பட்ட செயலை நேரடியாகத் தருகிறது; மூலத்தில் இல்லாத சட்ட அல்லது ஒழுக்க மதிப்பீட்டைச் சேர்க்கவில்லை.
- source_word: τὸν Παῦλον
  choice: பவுலை
  rationale: தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்; வேற்றுமை உருபுடன் இயல்பாக அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς என்ற ஆணைச் சூத்திரத்தின் பொருள்
  choice: நாங்கள் எங்கள்மேல் சாபத்தை ஏற்று ... ஆணையிட்டுக்கொண்டோம்
  alternative: நாங்கள் எங்களைச் சாபத்துக்குள்ளாக்கிக்கொண்டோம்
  rationale: இது பிற்காலத் திருச்சபைத் தண்டனைக்கான தொழில்நுட்பச் சொல்லல்ல; ஆணையை நிறைவேற்றாவிட்டால் தங்கள்மேல் தீங்கு வரட்டும் என்ற சுய-சாப ஆணை. தேர்ந்த மொழிபெயர்ப்பு அதன் கடுமையையும் தங்களைத் தாங்களே பிணைத்துக்கொண்ட தன்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. “எதையும் சுவைப்பதில்லை” என்பது மூலத்தின் நேரடி உருவகத்தைத் தக்கவைக்கிறது; “எங்கள்மேல் சாபத்தை ஏற்று” என்பது சுய-சாப ஆணையை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
