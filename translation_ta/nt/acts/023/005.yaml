source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: ta
  text: அப்போது பவுல், “சகோதரர்களே, அவர் தலைமைக் குருவாக இருக்கிறார் என்பது எனக்குத் தெரியாது. ஏனெனில், ‘உன் மக்களின் ஆட்சியாளரைப் பற்றித் தீமையாகப் பேசாதே’[a] என்று எழுதப்பட்டிருக்கிறது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் மக்களின் ஆட்சியாளரைப் பழித்துரைக்காதே.”
    reason: κακῶς ἐρεῖς என்பதற்கான மேலும் குறிப்பான சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: அப்போது பவுல் ... என்றார்
  rationale: τέ மென்மையான கதைத் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் இயல்பான நேரடி உரை அமைப்புடன் ‘அப்போது’ எனத் தரப்பட்டது.
- source_word: Οὐκ ᾔδειν
  choice: எனக்குத் தெரியாது
  rationale: அறிந்திருத்தலைக் குறிக்கும் οἶδα வடிவத்தின் நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவத்தையும், பவுல் ஆலோசனைச் சங்கத்தினரை நேரடியாக அழைப்பதையும் காக்கிறது.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: அவர் தலைமைக் குருவாக இருக்கிறார் என்பது
  rationale: ἐστίν என்பதன் நிகழ்காலத்தைக் காத்து, குறிப்பிட்ட பதவியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γέγραπται γὰρ
  choice: ஏனெனில் ... என்று எழுதப்பட்டிருக்கிறது
  rationale: வேத மேற்கோளுக்குரிய முறையையும், perfect passive வடிவத்தின் நிலைத்த விளைவையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: Ἄρχοντα
  choice: ஆட்சியாளரை
  rationale: ἄρχων இங்கு மக்கள்மீது அதிகாரமுள்ள ஒருவரைக் குறிக்கிறது; சட்ட-நெறிசார் சூழலில் ‘ஆட்சியாளர்’ பொருத்தமானது.
- source_word: τοῦ λαοῦ σου
  choice: உன் மக்களின்
  rationale: λαός என்பதன் மக்கள்/சமூகப் பொருளை நெருக்கமாகக் காக்கிறது.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: தீமையாகப் பேசாதே
  rationale: எதிர்கால வடிவில் கூறப்பட்ட தடையைத் தமிழ் கட்டளை வடிவில் இயல்பாகத் தருகிறது; κακῶς என்பதன் பரந்த பொருளைக் குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: ἀδελφοί என்பதை உள்ளடக்க மொழியில் மொழிபெயர்ப்பதா
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் பன்மையையும், இங்கு ஆண் ஆட்சிமன்ற உறுப்பினர்களை நோக்கிப் பேசும் சூழலையும் காக்கிறது.
- issue: பவுலின் வேத மேற்கோளை எவ்வாறு வழங்குவது
  choice: ‘உன் மக்களின் ஆட்சியாளரைப் பற்றித் தீமையாகப் பேசாதே’ என்று எழுதப்பட்டிருக்கிறது
  alternative: ‘உன் மக்களின் ஆட்சியாளரைப் பழித்துரைக்காதே’ என்று எழுதப்பட்டிருக்கிறது
  rationale: வேதத்தின் அதிகாரப்பூர்வ மேற்கோள் முறையைக் காக்கும் அதேவேளையில், κακῶς என்பதைக் குறிப்பாக ‘பழித்துரைத்தல்’ என்ற ஒரே பொருளுக்குள் சுருக்காமல் விடுகிறது.
- issue: ἐστίν நிகழ்காலத்தைப் பாதுகாப்பதா
  choice: இருக்கிறார்
  alternative: இருந்தார்
  rationale: மூல கிரேக்கத்தின் நிகழ்காலத்தைப் பாதுகாக்கிறது; பவுலின் அறியாமை எதைச் சார்ந்தது என்ற உரையின் பதற்றத்தை காலமாற்றத்தால் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும், கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. வேத மேற்கோள் தெளிவாகவும் இயல்பாகவும் அமைக்கப்பட்டுள்ளது; denominational விளக்கம் சேர்க்கப்படவில்லை.
