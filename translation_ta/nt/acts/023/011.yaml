id: ACT.23.11
reference: Acts 23:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: ta
  text: அதற்கு அடுத்த இரவில் ஆண்டவர் பவுலின் அருகில் நின்று, “தைரியமாக இரு![a] எருசலேமில் என்னைக் குறித்துச் சாட்சியளித்ததுபோலவே[b], ரோமிலும் நீ சாட்சியளிக்க வேண்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனத்திடனுடன் இரு!”
    reason: lexical_alternative
  - marker: b
    text: “சான்று பகர்ந்ததுபோலவே” என்றும் மொழிபெயர்க்கலாம். பவுல் ஏற்கெனவே பேசியதையும் இனி பேச வேண்டியதையும் குறிக்கும் இரண்டு கிரேக்க வினைகளும் சாட்சி/சான்று என்ற ஒரே சொற்குடும்பத்தைச் சேர்ந்தவை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: அதற்கு அடுத்த இரவில்
  rationale: ἐπιούσῃ νυκτί என்பது அடுத்த அல்லது தொடர்ந்து வந்த இரவைக் குறிக்கிறது. δέ-யின் மென்மையான கதைத் தொடர்பு தமிழில் தனியே வலுக்கட்டாயமாக மொழிபெயர்க்கப்படாமல் இயல்பான தொடரில் வெளிப்படுகிறது.
- source_word: ἐπιστὰς αὐτῷ
  choice: பவுலின் அருகில் நின்று
  rationale: ἐφίστημι இங்கு ஒருவரிடம் வந்து அருகில் நிற்பதைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் சுட்டுப்பெயரின் தெளிவின்மையைத் தவிர்க்க αὐτῷ என்பதன் குறிப்பு ‘பவுல்’ என்று வெளிப்படுத்தப்பட்டுள்ளது; ‘தோன்றினார்’ என்ற விளக்கமான பொருள் சேர்க்கப்படவில்லை.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழ் வேதாகமச் சொல்; கிரேக்கத்தைப் போலவே இயேசு என்ற பெயரை மொழிபெயர்ப்பில் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: Θάρσει
  choice: தைரியமாக இரு
  rationale: நிகழ்காலக் கட்டளை பவுலை மனத்திடத்துடன் இருக்க ஊக்குவிக்கிறது. இத்தமிழாக்கம் தெளிவாகவும் நேரடியாகவும் உள்ளது.
- source_word: διεμαρτύρω
  choice: சாட்சியளித்ததுபோலவே
  rationale: இந்த வினை சாட்சி கூறுதல் அல்லது வலியுறுத்திச் சான்றுரைத்தல் எனப் பொருள்படலாம். பின்னர் வரும் μαρτυρῆσαι உடனான ஒரே சாட்சி-சொற்குடும்பத் தொடர்பைத் தமிழில் காக்க ‘சாட்சியளி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὰ περὶ ἐμοῦ
  choice: என்னைக் குறித்து
  rationale: இயேசுவைப் பற்றிய காரியங்களை இயல்பான நவீன தமிழில் சுருக்கமாகக் குறிக்கிறது.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமில்
  rationale: நகரப்பெயருடன் வரும் εἰς இங்கு ஏற்கெனவே நிகழ்ந்த சாட்சியின் இடத்தைக் குறிக்கிறது; தமிழில் இடவேற்றுமை இயல்பானது.
- source_word: οὕτω
  choice: போலவே
  rationale: எருசலேமில் நிகழ்ந்த சாட்சிக்கும் ரோமில் நிகழ வேண்டிய சாட்சிக்கும் உள்ள ஒப்புமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: σε δεῖ
  choice: நீ ... வேண்டும்
  rationale: δεῖ வெளிப்படுத்தும் அவசியத்தைத் தெளிவாகக் காக்கிறது; அது எவ்வாறு நிறைவேறும் என்பதையோ விதிநியமக் கருத்தையோ மொழிபெயர்ப்பு கூடுதலாகச் சேர்க்கவில்லை.
- source_word: καὶ εἰς Ῥώμην
  choice: ரோமிலும்
  rationale: καί சேர்க்கும் ‘மேலும் அங்கேயும்’ என்ற பொருளை -உம் விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μαρτυρῆσαι
  choice: சாட்சியளிக்க
  rationale: διεμαρτύρω உடனான சொற்பொருள் தொடர்பைக் காக்க அதே தமிழ் வினை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ὁ κύριος என்பவரின் அடையாளம்
  choice: ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்த்து, உரையின் சொல்வடிவத்தைக் காத்தல்
  alternative: ‘ஆண்டவராகிய இயேசு’ என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: அப்போஸ்தலர் பணிகளின் சூழலில் ‘என்னைக் குறித்து’ என்று பேசுகிறவர் உயிர்த்தெழுந்த இயேசு என்பதைச் சூழல் காட்டுகிறது. எனினும் கிரேக்க உரை பெயரைச் சேர்க்காததால் மொழிபெயர்ப்பும் அதைச் சேர்க்கவில்லை.
- issue: δεῖ என்பதன் அவசியம்
  choice: ‘வேண்டும்’ என்று அவசியத்தை வெளிப்படுத்துதல்
  alternative: ‘உனக்கு நியமிக்கப்பட்டிருக்கிறது’ என்று விதிநியமமாக விரித்துரைத்தல்
  rationale: உரை தெய்வீக அவசியத்தை உணர்த்தினாலும் அதன் செயல்முறையை விளக்கவில்லை. ‘வேண்டும்’ அந்த இறையியல் அழுத்தத்தைத் தக்கவைத்து, விதி அல்லது முன்நியமம் பற்றிய கூடுதல் முடிவைத் திணிக்காது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பவுலின்’ என்பது கிரேக்கச் சுட்டுப்பெயரின் குறிப்பைத் தெளிவுபடுத்தும் இயல்பான பெயர்மாற்றீடு. ‘சாட்சியளி’ என்ற ஒரே வினை இரு இடங்களிலும் பயன்படுத்தப்பட்டு மூலத்தின் சொற்குடும்பத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
