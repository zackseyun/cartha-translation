id: ACT.23.20
reference: Acts 23:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: ta
  text: அவன், “யூதர்கள்[a], தாங்கள் அவரைப்பற்றி இன்னும் துல்லியமாக விசாரிக்கப்போவதுபோல், பவுலை நாளை சனெத்ரின் மன்றத்திற்குக்[b] கீழே கொண்டுவருமாறு உங்களிடம் கேட்க உடன்பட்டிருக்கிறார்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘யூதர்கள்’ என்பது யூத மக்கள் அனைவரையும் அல்ல, பவுலுக்கு எதிரான இந்தத் திட்டத்தில் ஈடுபட்ட குறிப்பிட்ட குழுவைக் குறிக்கிறது.
    reason: contextual_clarification
  - marker: b
    text: ‘சனெத்ரின்’ என்பது எருசலேமிலிருந்த யூத ஆட்சிமன்றம்; இதை ‘மன்றம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல்லை நேரடியாக மொழிபெயர்க்கிறது. இச்சூழலில் இது பவுலுக்கு எதிராகத் திட்டமிட்ட குறிப்பிட்ட யூதக் குழுவைக் குறிக்கிறது; யூத மக்கள் அனைவரையும் அல்ல.
- source_word: συνέθεντο
  choice: தங்களுக்குள் உடன்பட்டிருக்கிறார்கள்
  rationale: ஒரு காரியத்தைச் செய்ய ஒன்றுசேர்ந்து உடன்படுதல் அல்லது திட்டமிடுதல் என்ற இடைநிலை வினையின் பொருளைத் தருகிறது; சொல்லிலேயே தீய சதியை மிகைப்படுத்தாமல், சூழல் காட்டும் பகைமையைத் தக்கவைக்கிறது.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: உங்களிடம் கேட்க
  rationale: இறுதிநிலை வினைச்சொல் அவர்களுடைய உடன்பாட்டின் நோக்கத்தை வெளிப்படுத்துகிறது. அதிகாரியிடம் வைக்கும் வேண்டுகோள் தமிழில் இயல்பாக அமைய ‘உங்களிடம் கேட்க’ என வழங்கப்பட்டுள்ளது.
- source_word: καταγάγῃς
  choice: கீழே கொண்டுவருமாறு
  rationale: κατά- என்பதிலுள்ள கீழ்நோக்கிய இயக்கத்தைப் பாதுகாக்கிறது; கோட்டைப் பகுதியிலிருந்து மன்றத்திற்குக் கொண்டுவரும் நிகழ்வுக்கும் பொருந்துகிறது.
- source_word: συνέδριον
  choice: சனெத்ரின் மன்றம்
  rationale: எருசலேமிலிருந்த யூத ஆட்சிமன்றம் என்ற குறிப்பிட்ட நிறுவனத்தைக் குறிக்கிறது. ‘மன்றம்’ மட்டும் என்பதைக் காட்டிலும் வரலாற்றுக் குறிப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὡς
  choice: போல
  rationale: கூறப்படும் நோக்கம் உண்மையானது அல்ல என்ற பாவனை அல்லது சாக்கை வெளிப்படுத்துகிறது; ‘சாக்காக’ என்று விளக்கத்தை மிகுதியாக்காமல் கிரேக்கத்தின் நுட்பத்தைத் தக்கவைக்கிறது.
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ
  choice: அவரைப்பற்றி இன்னும் துல்லியமாக விசாரிக்கப்போவதாக
  rationale: πυνθάνομαι என்பதிலுள்ள விசாரித்து அறியும் கருத்தையும் ἀκριβέστερον என்பதிலுள்ள ஒப்பீட்டு நுட்பத்தையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பகைமை நிறைந்த இச்சூழலில் ‘யூதர்கள்’ என்பதன் குறிப்பு
  choice: Οἱ Ἰουδαῖοι என்பதை ‘யூதர்கள்’ என்று நேரடியாகத் தக்கவைத்து, சூழல்சார் வரம்பை அடிக்குறிப்பில் தெளிவுபடுத்துதல்
  alternative: யூதத் தலைவர்கள் / யூதேயர்கள்
  rationale: மூலவாக்கியம் குறிப்பாக ‘தலைவர்கள்’ என்று கூறவில்லை. ஆகவே குறிப்பை மொழிபெயர்ப்பிலேயே குறுக்காமல், பவுலுக்கு எதிராகத் திட்டமிட்ட குறிப்பிட்ட குழுவே இங்கு குறிக்கப்படுகிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- issue: ὡς அறிமுகப்படுத்தும் கூறு உண்மையான நோக்கமா அல்லது பாசாங்கான நோக்கமா
  choice: ‘விசாரிக்கப்போவதுபோல’ என்று கூறி பாசாங்கின் நுட்பத்தைப் பாதுகாத்தல்
  alternative: விசாரிப்பதற்காக / விசாரிப்பதைச் சாக்காகக் கொண்டு
  rationale: ὡς இங்கு வெளிப்படையாகச் சொல்லப்படும் நோக்கத்துக்கும் உண்மையான திட்டத்துக்கும் இடையிலான வேறுபாட்டைக் குறிக்கிறது. ‘போல’ என்பது அந்த இறுக்கத்தை மிகையாக விளக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான உரையாடல் நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கீழே கொண்டுவர’ என்பது மூலத்தின் திசைநுட்பத்தைப் பாதுகாக்கிறது. ‘சனெத்ரின் மன்றம்’ வரலாற்று நிறுவனத்தைத் தெளிவுபடுத்துகிறது; பொதுவாசகருக்கான விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
