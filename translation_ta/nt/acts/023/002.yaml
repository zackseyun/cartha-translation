  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: ta
  text: ஆனால், தலைமை ஆசாரியரான அனனியா தன் அருகில் நின்றவர்களுக்குப் பவுலின் வாயில் அடிக்கும்படி கட்டளையிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பவுலின் வாயில் அறையும்படி.” கிரேக்க வினைச்சொல் பொதுவாக அடிப்பதைக் குறிக்கலாம்; “அறைவது” என்பது சாத்தியமான, ஆனால் இன்னும் குறிப்பான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் பவுல் கூறியதற்கு வந்த திடீர் எதிர்வினையை மிதமான முரண்பாட்டுடன் காட்டுகிறது.
- source_word: ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: இச்சூழலில் ἀρχιερεύς குறிக்கும் ஒருமை பதவிக்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: Ἁνανίας
  choice: அனனியா
  rationale: தனிப்பெயர் தமிழின் நிலையான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
- source_word: ἐπέταξεν
  choice: கட்டளையிட்டார்
  rationale: அதிகாரபூர்வமாக ஆணையிடுதல் என்ற வினையின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: தன் அருகில் நின்றவர்களிடம்
  rationale: அனனியாவின் பக்கத்தில் இருந்தவர்கள் என்ற இடஞ்சார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; αὐτῷ அனனியாவையே சுட்டுகிறது.
- source_word: τύπτειν
  choice: அடிக்கும்படி
  rationale: τύπτω பொதுவாக அடித்தலைக் குறிக்கிறது; அறைவது என்று முறையைத் தேவையின்றிக் குறிப்பாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: αὐτοῦ τὸ στόμα
  choice: பவுலின் வாயில்
  rationale: கிரேக்கத்தில் உள்ள சுட்டுப்பெயரின் குறிப்பு பவுல் என்பதைத் தமிழில் குழப்பமின்றித் தெளிவாக்கி, தாக்கப்பட்ட இடத்தையும் இயல்பாகக் கூறுகிறது.
