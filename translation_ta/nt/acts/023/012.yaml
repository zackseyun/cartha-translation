source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: ta
  text: பொழுது விடிந்தபோது, யூதர்கள்[a] ஒன்றுகூடிச் சதித்திட்டம் தீட்டினார்கள். பவுலைக் கொல்லும்வரை உண்ணவோ குடிக்கவோ மாட்டோம் என்று கூறி, தங்கள்மேல் சாபத்தை ஏற்றிக்கொண்டு உறுதிமொழி செய்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘யூதர்கள்’ என்பது யூத மக்கள் அனைவரையும் அல்ல, இந்தச் சதியில் ஈடுபட்ட அவர்களில் ஒரு குறிப்பிட்ட குழுவைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘தங்கள்மேல் சாபத்தை ஏற்றிக்கொண்டார்கள்.’ தங்கள் உறுதிமொழியை நிறைவேற்றத் தவறினால் தங்கள்மேல் தீர்ப்பு வரட்டும் என்று அவர்கள் தாங்களே ஏற்ற சாபத்தைக் குறிக்கும் சொற்றொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: பொழுது விடிந்தபோது
  rationale: இது கால மாற்றத்தைக் குறிக்கும் தனிநிலை வேற்றுமைத் தொடர். தமிழில் இயல்பாகவும் மூலத்தின் காலப்பொருளைத் தக்கவைத்தும் இருக்கிறது.
- source_word: ποιήσαντες συστροφὴν
  choice: ஒன்றுகூடிச் சதித்திட்டம் தீட்டினார்கள்
  rationale: இந்தச் சூழலில் συστροφή என்பது வெறும் கூட்டத்தையோ கலகக் கும்பலையோ அல்ல, திட்டமிட்ட கூட்டு சதியைக் குறிக்கிறது. ‘ஒன்றுகூடி’ என்பது அவர்கள் கூட்டாகச் செயல்பட்டதையும் வெளிப்படுத்துகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: மூலத்தில் உள்ள பொதுப்பெயர் நேரடியாகத் தக்கவைக்கப்படுகிறது. எனினும், சூழலில் இது யூத மக்கள் அனைவரையும் அல்ல, சதியில் ஈடுபட்ட ஒரு குறிப்பிட்ட குழுவைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: தங்களைச் சாபத்துக்கு உட்படுத்தி உறுதிமொழி எடுத்துக்கொண்டார்கள்
  rationale: தங்கள் உறுதியை நிறைவேற்றத் தவறினால் தங்கள்மீதே தண்டனை வர வேண்டும் எனச் சாபத்தை ஏற்றுக்கொள்ளும் உறுதிமொழியை இச்சொற்றொடர் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘உறுதிமொழி’ என்பதும் சேர்க்கப்பட்டுள்ளது.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: சாப்பிடவோ குடிக்கவோ மாட்டோம் என்று கூறி
  rationale: இரட்டை மறுப்பையும், அவர்கள் எடுத்த உறுதிமொழியின் உள்ளடக்கத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: பவுலைக் கொல்லும்வரை
  rationale: உறுதிமொழி எவ்வளவு காலம் நடைமுறையில் இருக்கும் என்பதற்கான எல்லையைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
