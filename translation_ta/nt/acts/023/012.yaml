translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் நிகழ்வுவரிசை இரண்டு இயல்பான தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு [a] அது விளக்கும் ‘யூதர்கள்’ என்ற சொல்லுக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
