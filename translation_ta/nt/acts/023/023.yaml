translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் இராணுவக் கட்டளையின் நேரடித்தன்மையும் பேணப்பட்டுள்ளன. ‘நூற்றுவர் தலைவர்’ மற்றும் ‘மூன்றாம் மணிநேரம்’ ஆகிய வரலாற்றுச் சொற்றொடர்கள் எளிதில் புரியும் வகையில் வைக்கப்பட்டு, தேவையான விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
