  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: ta
  text: அவர் நூற்றுவர் தலைவர்களில் இருவரைத் தம்மிடம் அழைத்து, “இரவின் மூன்றாம் மணிநேரத்திலிருந்து செசரியா வரையில் செல்வதற்காக இருநூறு படைவீரர்களையும், எழுபது குதிரைவீரர்களையும், இருநூறு ஈட்டிவீரர்களையும்[a] ஆயத்தப்படுத்துங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலதுகைப் பாதுகாவலர்கள் இருநூறு பேர்”; “ஈட்டிவீரர்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ள அரிய கிரேக்கச் சொல்லின் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: தம்மிடம் அழைத்து
  rationale: தன் முன்னிலைக்கு அழைப்பதைக் குறிக்கும் நடுநிலை வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: நூற்றுவர் தலைவர்களில் இருவரை
  rationale: τινας இரண்டு பேரைத் தெளிவற்ற வகையில் சுட்டினாலும், தமிழில் ‘இருவரை’ என்பதே இயல்பானது; ἑκατοντάρχης என்ற ரோமப் படைப் பதவியை புரியக்கூடிய முறையில் ‘நூற்றுவர் தலைவர்’ என வழங்குகிறது.
- source_word: Ἑτοιμάσατε
  choice: ஆயத்தப்படுத்துங்கள்
  rationale: படையினரைப் பயணத்திற்குத் தயாராக்கும்படி கொடுக்கப்படும் பன்மை இராணுவக் கட்டளையைத் தக்கவைக்கிறது.
- source_word: στρατιώτας διακοσίους
  choice: இருநூறு படைவீரர்களை
  rationale: குதிரைவீரர்களிலிருந்தும் அடுத்து வரும் தனிப்படைப் பிரிவிலிருந்தும் வேறுபடும் பொதுவான காலாட்படை வீரர்களைக் குறிக்கிறது.
- source_word: ὅπως πορευθῶσιν
  choice: செல்வதற்காக ... புறப்படட்டும்
  rationale: ὅπως உடன் வரும் நோக்கப் பொருளை ‘செல்வதற்காக’ என்பதில் தக்கவைத்து, புறப்படும் நேரத்துடன் கட்டளையை இயல்பாக இணைக்கிறது.
- source_word: ἕως Καισαρείας
  choice: செசரியா வரையில்
  rationale: ἕως என்பதன் எல்லை அல்லது சென்றடையும் இடம் என்ற நுணுக்கத்தை ‘வரையில்’ தக்கவைக்கிறது.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: எழுபது குதிரைவீரர்களை
  rationale: குதிரையில் செல்லும் படைப்பிரிவை நவீன வாசகருக்குத் தெளிவாகக் குறிக்கிறது.
- source_word: δεξιολάβους διακοσίους
  choice: இருநூறு ஈட்டிவீரர்களை
  rationale: அரிய படைத்துறைச் சொல்லுக்கான பரவலான சூழல்சார் பொருளை வழங்குகிறது; துல்லியமான படைப்பிரிவு உறுதியல்ல என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: இரவின் மூன்றாம் மணிநேரத்தில் புறப்படட்டும்
  rationale: ἀπό குறிக்கும் தொடக்க நேரத்தைப் புறப்பாட்டுடன் வெளிப்படையாக இணைத்து, பழங்கால நேரக் கணக்கை முதன்மை உரையில் தக்கவைக்கிறது.
