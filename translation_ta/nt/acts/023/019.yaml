source:
  edition: SBLGNT
  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: ta
  text: அப்போது படைத்தளபதி அவனுடைய கையைப் பிடித்துக்கொண்டு, அவனுடன் தனியே ஒதுங்கி, “நீ என்னிடம் தெரிவிக்க வேண்டியது என்ன?” என்று விசாரிக்கத் தொடங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: அந்த இளைஞனின் கையைப் பிடித்துக்கொண்டு
  rationale: கையைப் பற்றிக்கொள்ளும் தெளிவான உடல் செயலை இயல்பான தமிழில் தருகிறது; வலுக்கட்டாயமாகப் பிடித்தார் என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது. சூழலிலிருந்து குறிக்கப்படுபவர் இளைஞன் என்பது தெளிவாக இருப்பதால் தமிழில் பெயரிட்டு சொல்லப்பட்டுள்ளது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு δέ கதை நகர்வைக் குறிக்கிறது; நவீன தமிழில் இயல்பான தொடர்ச்சியை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: ὁ χιλίαρχος
  choice: படைத்தளபதி
  rationale: ரோமப் படையின் உயரதிகாரியை பொதுவாசகர் புரிந்துகொள்ளும் வகையில் குறிக்கிறது; அறிமுகமற்ற பதவிப் பெயரை ஒலிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: தனியாக ஒதுங்கிச் சென்று
  rationale: மற்றவர்களிடமிருந்து விலகிச் சென்ற இயக்கத்தையும் தனிப்பட்ட சூழலையும் இரண்டையும் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத நேரடி செயப்படுபொருளைச் சேர்க்கவில்லை.
- source_word: ἐπυνθάνετο
  choice: விசாரிக்கத் தொடங்கினார்
  rationale: இறந்தகால imperfect வடிவத்தின் தொடக்க அல்லது நீடிப்பு நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: நீ என்னிடம் தெரிவிக்க வேண்டியது என்ன?
  rationale: ἔχεις + infinitive கட்டமைப்பையும், தகவலை அறிவித்தல் அல்லது எடுத்துரைத்தல் என்ற ἀπαγγεῖλαι பொருளையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
