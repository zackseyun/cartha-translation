source:
  edition: SBLGNT
  text: Διακούσομαί σου, ἔφη, ὅταν καὶ οἱ κατήγοροί σου παραγένωνται· ⸀κελεύσας ἐν τῷ πραιτωρίῳ ⸀τοῦ Ἡρῴδου φυλάσσεσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: ta
  text: “உன் வழக்கை, உன்மேல் குற்றம் சாட்டுகிறவர்களும் வரும்போது விசாரிப்பேன்[b],” என்று அவன் சொன்னான். பின்பு, ஏரோதின் அரண்மனையில்[a] அவனைக் காவலில் வைக்கக் கட்டளையிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “அரண்மனை” என்பதற்கான கிரேக்கச் சொல் பிரைத்தோரியம். இது ரோம ஆளுநரின் அதிகாரபூர்வ இல்லம் அல்லது தலைமையகத்தைக் குறிக்கும்; இங்கு செசரியாவில் இருந்த ஏரோதின் அரண்மனை ரோம ஆளுநரின் பிரைத்தோரியமாகப் பயன்படுத்தப்பட்டதைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “உன் தரப்பை முழுமையாகக் கேட்பேன்.” கிரேக்க வினைச்சொல் ஒருவரது தரப்பை இறுதிவரை கேட்பதைக் குறிக்கலாம்; இங்குள்ள சட்டச் சூழலில் அது வழக்கை விசாரிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: உன் வழக்கை விசாரிப்பேன்
  rationale: διακούω என்பது ஒருவரது தரப்பை முழுமையாகக் கேட்பதை, குறிப்பாகச் சட்டச் சூழலில் ஒரு வழக்கை விசாரிப்பதை குறிக்கலாம். இயல்பான நவீனத் தமிழில் நீதித்துறைச் சூழலைத் தெளிவுபடுத்தும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது; வினையின் நுண்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: உன்மேல் குற்றம் சாட்டுகிறவர்களும் வந்ததும்
  rationale: ὅταν உடன் வரும் subjunctive எதிர்காலத்தில் நிகழ வேண்டிய நிபந்தனையைக் குறிக்கிறது. καί இங்குள்ள ‘அவர்களும்’ என்ற பொருளில் பாதுகாக்கப்பட்டுள்ளது; κατήγοροί என்பது சட்டரீதியாகக் குற்றம் சாட்டுகிறவர்களைக் குறிக்கிறது.
- source_word: κελεύσας
  choice: பின்பு ... கட்டளையிட்டான்
  rationale: Aorist participle தொடர்ச்சியான கதையோட்டத்திற்கேற்ப தமிழில் முற்றுவினையாக மாற்றப்பட்டுள்ளது. ‘பின்பு’ நிகழ்வுகளின் வரிசையை இயல்பாகக் காட்டுகிறது.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: ஏரோதின் ஆளுநர் மாளிகையில்
  rationale: πραιτώριον என்பது ரோம ஆளுநரின் அதிகாரபூர்வ இல்லம் அல்லது தலைமையகத்தைக் குறிக்கிறது. தமிழில் புரியாத ஒலிபெயர்ப்பை விட வரலாற்று-நிர்வாகச் செயல்பாட்டைத் தெரிவிக்கும் இயல்பான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; துல்லியமான விளக்கம் அடிக்குறிப்பில் உள்ளது.
- source_word: φυλάσσεσθαι αὐτόν
  choice: அவனைக் காவலில் வைக்கும்படி
  rationale: இங்கு passive infinitive காவலுடன் கூடிய தடுப்புக் காவலைக் குறிக்கிறது. தண்டனைச் சிறை என்ற கூடுதல் பொருளைச் சேர்க்காமல், தொடர்ந்து காவலில் வைத்திருப்பதை இச்சொற்றொடர் தெளிவாகத் தெரிவிக்கிறது.
