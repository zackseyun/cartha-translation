  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: ta
  text: மறுநாள், குதிரைப்படை வீரர்கள் அவனோடு செல்ல அனுமதித்துவிட்டு, மற்ற வீரர்கள் படைவீட்டுக்குத்[a] திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “படைமுகாமுக்கு.” கிரேக்கச் சொல் ஒரு முகாமையோ படைவீரர்கள் தங்கும் இடத்தையோ குறிக்கலாம்; இங்கே அது எருசலேமிலிருந்த ரோமப் படைவீடு அல்லது கோட்டையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: மறுநாளோ
  rationale: ἐπαύριον என்பதன் ‘மறுநாள்’ என்ற காலக் குறிப்பையும், δέ குறிக்கும் மென்மையான கதைநடை மாற்றத்தையும் ‘-ஓ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐάσαντες
  choice: அனுமதித்துவிட்டு
  rationale: ἐάω என்பதன் ‘அனுமதி/விடு’ என்ற பொருளையும், பிரதான வினைக்கு முன் நிகழ்ந்த பங்கேற்பு வினைச் செயலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τοὺς ἱππεῖς
  choice: குதிரைப்படை வீரர்கள்
  rationale: ἱππεῖς என்பது குதிரைகளில் செல்லும் படைவீரர்களைக் குறிக்கிறது; ‘குதிரைப்படை வீரர்கள்’ என்பது தெளிவான நவீன ராணுவச் சொல்.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: அவனோடு தொடர்ந்து செல்ல
  rationale: σὺν αὐτῷ என்பதன் உடன்செல்லுதலையும், மற்ற வீரர்கள் திரும்பியபோது குதிரைப்படையினர் பயணத்தைத் தொடர்ந்த சூழலையும் வெளிப்படுத்துகிறது.
- source_word: ὑπέστρεψαν
  choice: திரும்பினார்கள்
  rationale: ὑποστρέφω என்பதன் நேரடியான ‘திரும்புதல்’ என்ற கதைநடைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: εἰς τὴν παρεμβολήν
  choice: படைவீட்டுக்கு
  rationale: παρεμβολή என்பது முகாம் அல்லது படைத்தங்குமிடத்தைக் குறிக்கலாம்; இச்சூழலில் எருசலேமிலிருந்த ரோமப் படையின் தங்குமிடம்/கோட்டைப் பகுதியே குறிக்கப்படுவதால் ‘படைவீடு’ பொருத்தமானது.
