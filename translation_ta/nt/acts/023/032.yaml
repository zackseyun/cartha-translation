translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் பெயர் மூல வசனத்தில் இல்லாததால் ‘அவனோடு’ என்று மூலத்துக்கு நெருக்கமாக வைக்கப்பட்டுள்ளது. அடிக்குறி குறியீடு அது விளக்கும் ‘படைவீடு’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
