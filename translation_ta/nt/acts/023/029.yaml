revisions:
- from: அவன்மீது சுமத்தப்பட்ட குற்றச்சாட்டுகள் அவர்களுடைய சட்டத்தைப் பற்றிய சர்ச்சைக்குரிய கேள்விகள் தொடர்பானவை என்று கண்டறிந்தேன்; ஆனால் மரணத்துக்கோ சிறைத்தண்டனைக்கோ[a] உரிய குற்றம் எதுவும் அவன்மீது சுமத்தப்படவில்லை.
  to: அவர்களுடைய சட்டத்தைப் பற்றிய கேள்விகளைக் குறித்து அவன் மீது குற்றஞ்சாட்டப்பட்டிருப்பதை நான் கண்டேன்; ஆனால் மரணத்துக்கோ சிறைத்தண்டனைக்கோ[a] உரிய எந்தக் குற்றச்சாட்டும் அவன் மீது இல்லை.
  rationale: The revision restores the Greek construction in which Paul, rather than the accusations, is the one found to be accused. It also renders ἔχοντα ἔγκλημα as the absence of any qualifying accusation against him, carefully avoiding an implication of guilt or conviction. The footnote remains correctly anchored to ‘சிறைத்தண்டனைக்கோ’ and preserves the literal alternative for δεσμῶν.
  reviewer_model: gpt-5.6-terra
