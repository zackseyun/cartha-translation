source:
  edition: SBLGNT
  text: ὃν εὗρον ἐγκαλούμενον περὶ ζητημάτων τοῦ νόμου αὐτῶν, μηδὲν ⸀δὲ ἄξιον θανάτου ἢ δεσμῶν ⸂ἔχοντα ἔγκλημα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: ta
  text: அவர்களுடைய சட்டத்தைப் பற்றிய கேள்விகளைக் குறித்து அவன் மீது குற்றஞ்சாட்டப்பட்டிருப்பதை நான் கண்டேன்; ஆனால் மரணத்துக்கோ சிறைத்தண்டனைக்கோ[a] உரிய எந்தக் குற்றச்சாட்டும் அவன் மீது இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “மரணத்துக்கோ சங்கிலிகளுக்கோ உரியது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαλούμενον
  choice: அவன்மீது சுமத்தப்பட்ட குற்றச்சாட்டுகள்
  rationale: செயப்பாட்டு நிலையில் அவனுக்கு எதிராகக் குற்றச்சாட்டுகள் கொண்டுவரப்பட்டதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; குற்றம் நிரூபிக்கப்பட்டதாகக் கூறவில்லை.
- source_word: περὶ ζητημάτων
  choice: சர்ச்சைக்குரிய கேள்விகள் தொடர்பானவை
  rationale: ζητήματα என்பதில் கேள்விகள் மட்டுமன்றி விவாதத்திற்கும் சர்ச்சைக்கும் உரிய விஷயங்கள் என்ற பொருளும் இருப்பதால் இரு நுட்பங்களையும் காக்கிறது.
- source_word: τοῦ νόμου αὐτῶν
  choice: அவர்களுடைய சட்டத்தைப் பற்றிய
  rationale: ரோம அதிகாரியின் பார்வையில் உள்ள αὐτῶν என்ற உடைமைப் பொருளைத் தக்கவைக்கிறது.
- source_word: εὗρον
  choice: கண்டறிந்தேன்
  rationale: விசாரணையின் அடிப்படையில் அதிகாரி வந்த முடிவைக் குறிக்கும் சூழலுக்கு ஏற்ற இயல்பான சொல்.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: மரணத்துக்கோ சிறைத்தண்டனைக்கோ உரிய ... எதுவும்
  rationale: ἄξιον என்பதின் தகுதி அல்லது தண்டனைக்குரிய நிலையைப் பாதுகாக்கிறது; δεσμά என்பதின் நேர்ப்பொருள் ‘சங்கிலிகள்’ என்றாலும் இச்சட்டச் சூழலில் சிறைத்தண்டனை என்பது இயல்பான பொருளாக்கம்.
- source_word: ἔχοντα ἔγκλημα
  choice: குற்றம் எதுவும் அவன்மீது சுமத்தப்படவில்லை
  rationale: அவனுக்கு எதிராக அத்தகைய குற்றச்சாட்டு இல்லை என்பதைத் தெளிவாகச் சொல்கிறது; அவன் குற்றவாளி எனத் தீர்ப்பளிக்கப்பட்டதாக மிகைப்படுத்தாது.
