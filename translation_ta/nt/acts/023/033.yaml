  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: ta
  text: அவர்கள் செசரியாவுக்குள் வந்து, ஆளுநரிடம் கடிதத்தைக் கொடுத்துவிட்டு, பவுலையும் அவர்முன் கொண்டுவந்து நிறுத்தினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட குதிரைப்படை வீரர்களைக் குறிக்கிறது; தமிழில் தனி வாக்கியத் தொடக்கமாக இயல்பாக அமைகிறது.
- source_word: εἰσελθόντες εἰς τὴν Καισάρειαν
  choice: செசரியாவுக்குள் வந்து
  rationale: முதன்மைச் செயலுக்கு முன் நடந்த செயலைக் காட்டும் இறந்தகால வினையெச்சத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἀναδόντες τὴν ἐπιστολήν
  choice: கடிதத்தைக் கொடுத்துவிட்டு
  rationale: அதிகாரியிடம் அதிகாரபூர்வக் கடிதத்தை ஒப்படைத்த செயலை இயல்பாகக் காட்டுகிறது; பின்னர் நடந்த செயலைத் தெளிவுபடுத்த ‘விட்டு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τῷ ἡγεμόνι
  choice: ஆளுநரிடம்
  rationale: ரோம மாகாண அதிகாரிக்கான துல்லியமான, நவீனத் தமிழ் பதம்.
- source_word: παρέστησαν καὶ τὸν Παῦλον αὐτῷ
  choice: பவுலையும் அவர்முன் கொண்டுவந்து நிறுத்தினார்கள்
  rationale: அதிகாரபூர்வமாக ஒருவரை அதிகாரியின் முன்னிலையில் ஆஜர்படுத்தும் பொருளைக் காட்டுகிறது; καί என்பதன் சேர்க்கைப் பொருள் ‘பவுலையும்’ என்பதில் வெளிப்படுகிறது.
