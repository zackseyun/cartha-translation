source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: ta
  text: ஏனெனில், சதுசேயர்கள் உயிர்த்தெழுதல் இல்லை என்றும், வானதூதனும் இல்லை, ஆவியும் இல்லை என்றும் சொல்கிறார்கள்; ஆனால் பரிசேயர்கள் இவ்விரண்டையும் உண்மை என்று ஒப்புக்கொள்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசேயர்கள் மூன்றையும் உண்மை என்று ஒப்புக்கொள்கிறார்கள்”—அதாவது, உயிர்த்தெழுதல், வானதூதன், ஆவி ஆகியவற்றை. கிரேக்க மூலத்தில் “இரண்டையும்” என்று இருப்பதால், அது மிக நேரடியாக வானதூதனையும் ஆவியையும் சுட்டுகிறது; ஆனால் சூழலின் அடிப்படையில் சிலர் அதை விரிவாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: சதுசேயர்கள்
  rationale: யூத சமயப் பிரிவின் பெயருக்கான தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பு.
- source_word: μὲν γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய நிகழ்வுக்கான விளக்கப் பின்னணியைத் தொடங்கும் காரணத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: λέγουσιν
  choice: சொல்கிறார்கள்
  rationale: அந்தப் பிரிவினரின் பொதுவான நம்பிக்கையை எடுத்துரைக்கும் நிகழ்கால வினையாக மூலத்தை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: μὴ εἶναι
  choice: இல்லை என்று
  rationale: இருப்பு அல்லது உண்மைத்தன்மையை மறுக்கும் கிரேக்க infinitival கூறை இயல்பான தமிழில் தருகிறது.
- source_word: ἀνάστασιν
  choice: உயிர்த்தெழுதல்
  rationale: மறுபடியும் உயிருடன் எழுதல் என்ற கருத்தை ஒரு பொதுவான உண்மையாகக் குறிக்கும் நிலையான, தெளிவான வேதாகமத் தமிழ் சொல்.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: வானதூதர் என்பதும், ஆவி என்பதும் இல்லை
  rationale: இரு பெயர்ச்சொற்களையும் தனித்தனியாக மறுக்கும் μήτε...μήτε அமைப்பைப் புரிந்துகொள்ள எளிதான தமிழில் பாதுகாக்கிறது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: யூத சமயப் பிரிவின் பெயருக்கான தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பு.
- source_word: ὁμολογοῦσιν
  choice: ஏற்றுக்கொள்கிறார்கள்
  rationale: இங்கு உண்மை என்று ஒப்புதல் அல்லது அங்கீகரித்தல் என்பதே பொருள்; பாவ அறிக்கையைக் குறிப்பதாகத் தவறாகப் புரியக்கூடிய சொல்லைத் தவிர்க்கிறது.
- source_word: τὰ ἀμφότερα
  choice: இவ்விரண்டையும்
  rationale: கிரேக்கச் சொல் நேரடியாக ‘இரண்டையும்’ எனக் கூறுவதையும், உடனடியாக முந்திய ‘வானதூதர்’ மற்றும் ‘ஆவி’ என்ற இணையைச் சுட்டுவதையும் பாதுகாக்கிறது.
theological_decisions:
- issue: பரிசேயர்கள் ஏற்றுக்கொள்வதாகக் கூறப்படும் ‘இரண்டும்’ என்பதன் வரம்பு
  choice: முதன்மை உரையில் கிரேக்கத்தின் τὰ ἀμφότερα என்பதற்கேற்ப ‘இவ்விரண்டையும்’ என்று வைத்தல்; இது உடனடியாக முந்திய வானதூதர் மற்றும் ஆவி ஆகியவற்றை மிக இயல்பாகச் சுட்டுகிறது.
  alternative: பரிசேயர்கள் உயிர்த்தெழுதல், வானதூதர், ஆவி ஆகிய மூன்றையும் ஏற்றுக்கொள்கிறார்கள் என்று சூழலின் அடிப்படையில் புரிந்துகொள்ளுதல்.
  rationale: மூலத்தில் ‘மூன்றையும்’ அல்லது ‘அனைத்தையும்’ என்று இல்லாமல் ‘இரண்டையும்’ என்று உள்ளது. ஆயினும், முழு வாக்கியத்தின் சூழலும் பரிசேயர்களின் உயிர்த்தெழுதல் நம்பிக்கையும் மூன்றையும் உள்ளடக்கிய புரிதலுக்கு இடமளிப்பதால், அந்த மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைக்குரிய, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பட்டியலின் மறுப்பு அமைப்பும் ‘இவ்விரண்டையும்’ என்பதில் உள்ள உண்மையான விளக்கத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
