language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: ta
  text: ஆனால், அவர்களில் ஒரு பகுதியினர் சதுசேயர்கள் என்றும் மற்றொரு பகுதியினர் பரிசேயர்கள் என்றும் பவுல் அறிந்து, மன்றத்தில்[a] உரத்த குரலில், “ஆண்களே, சகோதரர்களே, நான் ஒரு பரிசேயன்; பரிசேயர்களின் மகன்[b]. நம்பிக்கையையும் இறந்தோரின் உயிர்த்தெழுதலையும் குறித்தே நான் நீதிவிசாரணைக்கு உட்படுத்தப்படுகிறேன்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சன்ஹெத்ரினில்.” கிரேக்கச் சொல் குறிப்பாக யூதர்களின் ஆட்சிமன்றத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பரிசேயப் பெற்றோரின் மகன்” அல்லது “பரிசேயர்களின் வழிவந்தவன்.”
    reason: alternative_reading
  - marker: c
    text: அல்லது, “இறந்தோர் உயிர்த்தெழுவார்கள் என்ற நம்பிக்கையைக் குறித்தே நான் நீதிவிசாரணைக்கு உட்படுத்தப்படுகிறேன்.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: அறிந்து
  rationale: இறந்தகால வினையெச்சத்தின் சூழ்நிலைத் தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: ஒரு பகுதியினர் ... மற்றொரு பகுதியினர்
  rationale: சங்கத்திற்குள் இருந்த இரு பிரிவுகளைக் குறிக்கும் μέρος என்பதன் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: சதுசேயர்கள் / பரிசேயர்கள்
  rationale: இவ்விரு யூத சமயக் குழுக்களுக்கும் தமிழில் வழக்கிலுள்ள பெயர்கள்.
- source_word: ἔκραζεν
  choice: உரத்த குரலில் ... என்றார்
  rationale: பொதுவெளியில் சத்தமாகப் பேசியதைக் குறிக்கும் κράζω என்பதன் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τῷ συνεδρίῳ
  choice: ஆலோசனைச் சங்கத்தில்
  rationale: சங்கம் அல்லது நீதிமன்றக் குழுவைக் குறிக்கும் சொல்லைத் தமிழில் தெளிவாக மொழிபெயர்க்கிறது; குறிப்பிட்ட யூத ஆட்சிமன்றமான ‘சன்ஹெத்ரின்’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἄνδρες ἀδελφοί
  choice: சகோதரர்களே
  rationale: தமிழில் ஆண்களை நோக்கி மரியாதையுடன் அழைக்கும் இயல்பான வடிவம்; ἄνδρες என்பதையும் தனியே மொழிபெயர்த்தால் செயற்கையாக ஒலிக்கும்.
- source_word: Φαρισαῖός εἰμι
  choice: நான் ஒரு பரிசேயன்
  rationale: பவுலின் நிகழ்காலத் தன்னடையாளத்தை நேரடியாகக் காட்டுகிறது.
- source_word: υἱὸς Φαρισαίων
  choice: பரிசேயர்களின் மகன்
  rationale: கிரேக்க பன்மையையும் குடும்ப உறவைக் குறிக்கும் உருவகத்தையும் பாதுகாத்து, பெற்றோர் அல்லது முன்னோர் என்று குறுக்கிப் பொருள்கொள்ளவில்லை.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: இறந்தோருக்கான நம்பிக்கையையும் உயிர்த்தெழுதலையும் குறித்து
  rationale: ἐλπίδος மற்றும் ἀναστάσεως ஆகியவை καί மூலம் இணைக்கப்பட்டிருப்பதைப் பாதுகாக்கிறது; இரண்டும் ஒரே கருத்தின் இரு கூறுகளா அல்லது நெருக்கமாகத் தொடர்புடைய தனிக் கருத்துகளா என்பதைத் தீர்மானிக்கவில்லை.
- source_word: κρίνομαι
  choice: நான் நியாயந்தீர்க்கப்படுகிறேன்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் நீதித்துறைச் சூழலையும் பாதுகாக்கிறது.
theological_decisions:
- issue: υἱὸς Φαρισαίων என்ற பவுலின் கூற்றின் பொருள்
  choice: பரிசேயர்களின் மகன்
  alternative: பரிசேயப் பெற்றோரின் மகன்; பரிசேயர்களின் வழிவந்தவன்
  rationale: கிரேக்கப் பன்மை பெற்றோர், வம்சம் அல்லது மரபுசார் அடையாளம் ஆகியவற்றில் எதைக் குறிப்பாகக் குறிக்கிறது என்பது தெளிவல்ல; ஆகவே குடும்ப வழக்கை அப்படியே வைத்திருக்கிறது.
- issue: பவுலின் வாதத்தில் நம்பிக்கைக்கும் உயிர்த்தெழுதலுக்கும் உள்ள தொடர்பு
  choice: இறந்தோருக்கான நம்பிக்கையையும் உயிர்த்தெழுதலையும் குறித்து
  alternative: இறந்தோர் உயிர்த்தெழுவார்கள் என்ற நம்பிக்கையைக் குறித்து
  rationale: கிரேக்கத்தில் நம்பிக்கையும் உயிர்த்தெழுதலும் καί மூலம் இணைக்கப்பட்டுள்ளன. அவற்றை ஒரே கருத்தாகச் சுருக்காமல், மூலத்தின் இலக்கணத் திறந்தநிலையை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. நீதித்துறைச் சூழலை வெளிப்படுத்த ‘நியாயந்தீர்க்கப்படுகிறேன்’ என்றும், συνέδριον என்பதற்கு விளக்கமான ‘ஆலோசனைச் சங்கம்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தில் உள்ள பொருள் இருமைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
