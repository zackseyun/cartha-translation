    text: சொல்லர்த்தமாக, ‘பின்வரும் வடிவைக் கொண்ட ஒரு கடிதம் எழுதினார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψας
  choice: எழுதினார்
  rationale: இது γράφω என்பதன் இறந்தகாலப் பங்கேற்பு வடிவம். முந்தைய வசனத்தின் எழுவாயே கடிதத்தை எழுதியதைக் குறிக்கிறது. இயல்பான தமிழ் கதைநடைக்காக வினைமுற்றாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐπιστολὴν
  choice: ஒரு கடிதம்
  rationale: எழுத்து மூலமான தகவல் தொடர்பைக் குறிக்கிறது. இக்கதைச் சூழலில் ‘கடிதம்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἔχουσαν
  choice: வடிவில்
  rationale: ἐπιστολήν என்பதை விளக்கும் நிகழ்காலப் பங்கேற்பு; சொல்லர்த்தமாக ‘கொண்டிருந்த’ எனலாம். ஆனால் τύπον τοῦτον என்ற தொடருடன் சேர்த்து ‘பின்வரும் வடிவில்’ என்பது தமிழில் இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: τύπον
  choice: வடிவம்
  rationale: இங்கு கடிதத்தின் அமைப்பு, வாசகம் அல்லது உள்ளடக்கத்தின் மாதிரியைக் குறிக்கலாம். அந்தச் சாத்தியங்களைத் தேவையின்றிக் குறுக்காமல் ‘வடிவம்’ என்ற பரந்த சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τοῦτον
  choice: பின்வரும்
  rationale: அடுத்து மேற்கோளிடப்படும் கடிதத்தைச் சுட்டுகிறது. தமிழில் முன்சுட்டாக ‘பின்வரும்’ என்பது ‘இந்த’ என்பதைவிட இயல்பாக உள்ளது.
theological_decisions: []
