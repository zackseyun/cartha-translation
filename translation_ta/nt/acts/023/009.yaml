source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: ta
  text: அப்போது பெரும் கூச்சல் எழுந்தது. பரிசேயர் கட்சியைச் சேர்ந்த மறைநூல் அறிஞர்களில் சிலர் எழுந்து நின்று, கடுமையாக வாதிட்டு, “இந்த மனிதனிடம் எந்தத் தவறும் இருப்பதாக நாங்கள் காணவில்லை. ஆனால் ஓர் ஆவியோ[b] ஒரு தேவதூதரோ அவரிடம் பேசியிருந்தால்—”[a] என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் இந்த நிபந்தனை வாக்கியம் திடீரென முறிந்து நிற்கிறது.
    reason: மூலத்தின் நிறைவுறாத வாக்கிய அமைப்பை விளக்குதல்
  - marker: b
    text: ‘ஓர் ஆவி’ என்பதைப் பொதுவாக ஓர் ஆவிக்குரிய இருப்பு என்று புரிந்துகொள்ளலாம். சிலர் இதைப் ‘பரிசுத்த ஆவி’ என்று புரிந்துகொள்கிறார்கள்; ஆனால் ‘தேவதூதர்’ என்பதுடன் காணப்படும் வேறுபாடு இங்கு பொதுவான பொருளையே அதிகம் ஆதரிக்கிறது.
    reason: மாற்றுப் பொருளையும் மூலத்தில் உள்ள இறையியல் தெளிவின்மையையும் பாதுகாத்தல்
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: பெரும் கூச்சல்
  rationale: கூச்சல் அல்லது கொந்தளிப்பான கூக்குரல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; μεγάλη என்பதையும் ‘பெரும்’ என வெளிப்படுத்துகிறது.
- source_word: ἀναστάντες
  choice: எழுந்து நின்று
  rationale: அவையில் பேசுவதற்காக உடலளவில் எழுந்ததையும் நடவடிக்கை எடுத்ததையும் தெளிவாகக் காட்டுகிறது.
- source_word: τινὲς τῶν γραμματέων
  choice: வேத அறிஞர்களில் சிலர்
  rationale: யூத மறைநூல்களிலும் திருச்சட்டத்திலும் தேர்ச்சி பெற்ற γραμματεῖς என்போரின் பங்கை, பழமையான தொழிற்பெயரைப் பயன்படுத்தாமல் சாதாரண வாசகருக்குப் புரியும் வகையில் தருகிறது.
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: பரிசேயர் கட்சியைச் சேர்ந்த
  rationale: μέρος இங்கு ஒரு தரப்பு அல்லது பிரிவைக் குறிக்கிறது; ‘கட்சியைச் சேர்ந்த’ என்பது அவர்களின் குழுச் சார்பைத் தெளிவாகச் சொல்கிறது.
- source_word: διεμάχοντο
  choice: கடுமையாக வாதிட்டு
  rationale: தொடர்ந்து தீவிரமாக எதிர்த்து வாதிட்டார்கள் என்ற imperfect வினையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: எந்தத் தவறும் இருப்பதாக நாங்கள் காணவில்லை
  rationale: κακόν என்பதன் குற்றம்சாட்டத்தக்க தவறு என்ற சூழல் பொருளைத் தருகிறது; நீதிவிசாரணைச் சூழலுக்கும் பொருந்துகிறது.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: இந்த மனிதனிடம்
  rationale: பவுலைக் குறிப்பாகச் சுட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: εἰ δὲ
  choice: ஆனால் ... இருந்தால்—
  rationale: நிபந்தனை வாக்கியத்தை முடிக்காமல் விட்டுள்ள கிரேக்க அமைப்பை நிரப்பாமல் அப்படியே பாதுகாக்கிறது.
- source_word: πνεῦμα
  choice: ஓர் ஆவி
  rationale: தேவதூதரோடு இணைத்து வேறுபடுத்திக் கூறப்படுவதால், குறிப்பிட்ட பரிசுத்த ஆவியை விட பொதுவான ஆவிக்குரிய உயிரையே முதன்மையாகக் குறிக்கிறது; தமிழிலும் அதன் தெளிவின்மை ஓரளவு நிலைக்கிறது.
- source_word: ἐλάλησεν αὐτῷ
  choice: அவனிடம் பேசியிருந்தால்
  rationale: கடந்த நிகழ்வாக இருக்கக்கூடிய சாத்தியத்தை நிபந்தனை வடிவில் இயல்பாகத் தருகிறது.
- source_word: ἄγγελος
  choice: ஒரு தேவதூதர்
  rationale: இயற்கைக்கு அப்பாற்பட்ட ஆவியுடன் இணைத்துக் கூறப்படுவதால், இங்கு மனிதத் தூதன் அல்ல, தேவதூதரே குறிக்கப்படுகிறார்.
theological_decisions:
- issue: πνεῦμα என்பதன் பொருள்
  choice: ஓர் ஆவி—பொதுவாக ஓர் ஆவிக்குரிய உயிர்
  alternative: பரிசுத்த ஆவி
  rationale: ‘தேவதூதர்’ என்பதுடன் மாற்றாக இணைக்கப்பட்டிருப்பதும், பெயர்ச்சொல்லுக்கு article இல்லாததும் பொதுவான பொருளை ஆதரிக்கின்றன. இருப்பினும் வேறு புரிதல் சாத்தியம் என்பதால் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: இறுதி நிபந்தனை வாக்கியத்தின் நிறைவு
  choice: நீண்ட கோட்டுடன் முடிவுறாத வாக்கியமாகவே வைத்தல்
  alternative: ‘அப்படியானால் என்ன?’ போன்ற சொற்களைச் சேர்த்து கேள்வியாக நிறைவு செய்தல்
  rationale: கிரேக்க வாசகம் திடீரென முறிந்து நிற்கிறது. சொல்லப்படாத முடிவைச் சேர்ப்பது மூலத்தின் சொல்லாட்சித் திறப்பைத் தீர்மானித்துவிடும் என்பதால் அது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வேதபாரகர்’ போன்ற பழமையான சொல்லுக்குப் பதிலாக ‘வேத அறிஞர்கள்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் முறிந்து நிற்கும் இறுதி வாக்கியம் விளக்கச் சொற்களால் நிறைவு செய்யப்படவில்லை.
