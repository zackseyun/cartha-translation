  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: ta
  text: இந்தச் சதித்திட்டத்தை வகுத்தவர்கள் நாற்பதுக்கும் அதிகமானோர் இருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: நாற்பதுக்கும் அதிகமானோர்
  rationale: ஒப்பீட்டு வடிவமான πλείους, τεσσεράκοντα என்ற எண்ணுடன் சேர்ந்து ‘நாற்பதுக்கும் அதிகமானோர்’ என்று பொருள்படுகிறது. οἱ என்ற ஆண்பால் பன்மைச் சுட்டின் நபர்சார் பொருளையும் ‘-ஓர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συνωμοσίαν
  choice: சதித்திட்டம்
  rationale: συνωμοσία என்பது இரகசியமாகச் சேர்ந்து வகுக்கும் கூட்டுச் சதியைக் குறிக்கிறது. நவீனத் தமிழில் ‘சதித்திட்டம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது; இச்சொல்லிலேயே வெளிப்படாத ‘சத்தியம் செய்த’ என்ற விவரத்தைச் சேர்ப்பதில்லை.
- source_word: ποιησάμενοι
  choice: செய்தவர்கள்
  rationale: ποιέω என்ற வினையின் இறந்தகாலப் பங்கேற்பு வடிவம் இங்கு சதித்திட்டத்தை ‘செய்த/உருவாக்கிய’வர்களைக் குறிக்கிறது. ‘சதித்திட்டத்தைச் செய்தவர்கள்’ என்பது மூலத்தின் நேரடித் தொடரை இயல்பான தமிழில் காக்கிறது.
- source_word: ἦσαν δὲ
  choice: '[தனி வினையாக வெளிப்படுத்தப்படவில்லை]'
  rationale: தமிழில் ‘நாற்பதுக்கும் அதிகமானோர்’ என்ற பயனிலை அமைப்பே அவர்களின் எண்ணிக்கையை முழுமையாகத் தெரிவிக்கிறது. δέ இங்கு மெலிதான இணைப்புச்சொல்; தொடர்ச்சியை வற்புறுத்தி ‘ஆனால்’ என்று மொழிபெயர்ப்பது தேவையற்ற முரண்பாட்டை உருவாக்கும்.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: இந்தச் சதித்திட்டத்தைச் செய்தவர்கள்
  rationale: உறுப்புடன் வந்த பங்கேற்பு substantival ஆக, ‘இந்தச் சதித்திட்டத்தைச் செய்தவர்கள்’ என நபர்களைக் குறிக்கிறது. தமிழ் தொடர்பெயர் அமைப்பு இதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
