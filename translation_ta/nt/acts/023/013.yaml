translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் சாதாரண வாசகருக்குப் புரியக்கூடியதுமான நடை. ஆங்கில அடிக்குறிப்பிலுள்ள ‘over forty’ தமிழில் தனித்த பொருள் மாற்றாக இல்லாமல் அதே அளவுப் பொருளையே தருவதால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
