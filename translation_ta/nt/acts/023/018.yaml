source:
  edition: SBLGNT
  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: ta
  text: ஆகவே, அவன் அந்த இளைஞனை அழைத்துக்கொண்டு படைப்பிரிவுத் தளபதியிடம்[a] வந்து, “கைதியான பவுல் என்னைத் தன்னிடம் அழைத்து, இந்த இளைஞனை உங்களிடம் அழைத்து வரும்படி என்னிடம் கேட்டுக்கொண்டார்; அவனுக்கு உங்களிடம் ஏதோ சொல்ல இருக்கிறது” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் χιλίαρχος; ரோமப் படையின் ஒரு பிரிவுக்குத் தலைமை வகித்த இராணுவ அதிகாரி. சொல்லுக்குச் சொல், “ஆயிரத்தலைவர்.”
    reason: cultural_note
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν ἤγαγεν
  choice: அந்த இளைஞனை அழைத்துக்கொண்டு ... வந்து
  rationale: இரு வினைகளும் இளைஞனை உடன் அழைத்துச் சென்று அதிகாரியிடம் கொண்டுவந்த செயலைக் குறிக்கின்றன. தமிழில் இயல்பான ஒருங்கிணைந்த தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: χιλίαρχον
  choice: படைப்பிரிவுத் தளபதி
  rationale: ரோமப் படையின் உயர்நிலைப் பிரிவு அதிகாரியைக் குறிக்கும் சொல்லை, நவீன வாசகர்களுக்குத் தெளிவாகவும் வரலாற்றுப் பின்னணிக்கு ஏற்றவாறும் வழங்குகிறது.
- source_word: φησίν
  choice: சொன்னான்
  rationale: மூலத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலம் இயல்பானது.
- source_word: Ὁ δέσμιος Παῦλος
  choice: கைதியான பவுல்
  rationale: δέσμιος என்பது காவலில் அல்லது கட்டுப்பாட்டில் உள்ள நபரைக் குறிக்கிறது; ‘கைதி’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: προσκαλεσάμενός με
  choice: என்னைத் தன்னிடம் அழைத்து
  rationale: பவுல் அந்த வீரனைத் தன்னருகே வரவழைத்த திசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἠρώτησεν
  choice: கேட்டுக்கொண்டார்
  rationale: இங்கு ἐρωτάω ஒரு கேள்வியைக் கேட்பதை அல்ல, ஒரு வேண்டுகோளை முன்வைப்பதைக் குறிக்கிறது.
- source_word: νεανίαν
  choice: இளைஞன்
  rationale: νεανίας என்பதன் வயது மற்றும் ஆண்பால் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: உங்களிடம் ஏதோ சொல்ல வேண்டியிருக்கும்
  rationale: இப்பகுதி ‘இந்த இளைஞன்’ என்பதையே விளக்குகிறது. அவனிடம் சொல்ல வேண்டிய செய்தி ஒன்று இருப்பதை இயல்பாக வெளிப்படுத்துகிறது.
