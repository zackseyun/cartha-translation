base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: ta
  text: அப்போது பவுல் நூற்றுவர் தலைவர்களில் ஒருவரைத் தன்னிடம் அழைத்து, “இந்த இளைஞனைத் தளபதியிடம் அழைத்துச் செல்லுங்கள்; இவன் அவரிடம் தெரிவிக்க ஒரு செய்தி இருக்கிறது” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: தன்னிடம் அழைத்து
  rationale: தன்னருகே வரும்படி அழைத்தல் என்ற நடுவினைச் சொல்லின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு எதிர்மறை வேறுபாட்டைக் காட்டாமல் கதை நிகழ்வின் அடுத்த கட்டத்தை அறிமுகப்படுத்துகிறது.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: நூற்றுவர் தலைவர்களில் ஒருவரை
  rationale: ரோமப் படையின் centurion என்ற வரலாற்றுப் பதவியைத் தமிழில் வழக்கமான, பொருள் தெளிவான சொல்லால் குறிக்கிறது.
- source_word: νεανίαν
  choice: இளைஞனை
  rationale: νεανίας குறிக்கும் இளம் ஆணை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ἄπαγε
  choice: அழைத்துச் செல்லுங்கள்
  rationale: ஒருவரை இன்னொருவரிடம் கூட்டிச் செல்லும் கட்டளையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: χιλίαρχον
  choice: படைத்தளபதி
  rationale: இச்சூழலில் ரோமப் படையின் உயரதிகாரியைக் குறிக்கிறது; தொழில்நுட்பப் பதவிப்பெயரை ஒலிபெயர்ப்பதைவிட சாதாரண வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: அவரிடம் தெரிவிக்க வேண்டிய ஒன்று இவனிடம் இருக்கிறது
  rationale: ἔχει + வினையெச்ச அமைப்பையும், தகவலை அறிவித்தல் அல்லது எடுத்துரைத்தல் என்ற ἀπαγγέλλω சொல்லின் பொருளையும் இயல்பான தமிழில் காக்கிறது.
