source:
  edition: SBLGNT
  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: ta
  text: அவர்கள் அவர்மீது சுமத்திய குற்றச்சாட்டு என்ன என்பதை அறிய விரும்பி, அவரை அவர்களுடைய ஆலோசனை மன்றத்துக்கு[a] கீழே கொண்டுவந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய சனெத்ரினுக்கு.” கிரேக்கச் சொல் ஒரு ஆலோசனை மன்றத்தைக் குறிக்கிறது; இச்சூழலில் அது எருசலேமிலிருந்த யூத ஆட்சிமன்றத்தைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός
  choice: அறிய விரும்பி
  rationale: இது லீசியாவின் நோக்கத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; விருப்பம் என்ற பொருளையும் காக்கிறது.
- source_word: τε
  choice: தனி இணைப்புச் சொல் இடப்படவில்லை
  rationale: τέ முந்தைய வாக்கியத்தோடு மென்மையாக இணைக்கிறது. இங்கு தமிழ் உரைநடையின் தொடர்ச்சியில் அந்த இணைப்பு இயல்பாக வெளிப்படுவதால் தனியாக ‘மேலும்’ சேர்ப்பது தேவையில்லை.
- source_word: ἐπιγνῶναι
  choice: அறிய
  rationale: குற்றச்சாட்டின் காரணத்தைத் தெரிந்துகொள்ளும் நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τὴν αἰτίαν δι’ ἣν
  choice: அவர்கள் அவர்மீது சுமத்திய குற்றச்சாட்டு என்ன என்பதை
  rationale: சட்டச் சூழலில் αἰτία என்பது பொதுவான ‘காரணம்’ என்பதைக் காட்டிலும் குற்றச்சாட்டின் அடிப்படையைக் குறிக்கிறது. தமிழில் ‘என்ன என்பதை’ என்பது கிரேக்க உறவுத் தொடரின் பொருளை இயல்பாக அளிக்கிறது.
- source_word: ἐνεκάλουν αὐτῷ
  choice: அவர்கள் அவர்மீது சுமத்திய
  rationale: ἐγκαλέω என்பதன் சட்டப் பொருளான ஒருவர்மீது குற்றம் சுமத்துதலைத் தெளிவாகத் தருகிறது. இறந்தகாலத் தொடர்வினையின் நிகழ்ந்துகொண்டிருந்த குற்றஞ்சாட்டும் செயலைச் சூழல் போதுமான அளவு காட்டுகிறது.
- source_word: κατήγαγον
  choice: கொண்டுபோனேன்
  rationale: சபைக் கூடுமிடத்திற்குச் செய்த நகர்வை இயல்பான தமிழில் தருகிறது. கிரேக்கத்தில் உள்ள ‘கீழே’ என்ற திசைநுட்பம் தமிழில் சேர்க்கப்பட்டால் செயற்கையாக ஒலிக்கக்கூடும்; இச்சூழலில் அது கருத்தின் மையமல்ல.
- source_word: συνέδριον
  choice: ஆலோசனைச் சங்கம்
  rationale: பொதுவாக ‘கூட்டம்/ஆலோசனைச் சபை’ என்று பொருள்படும் சொல்லை மொழிபெயர்க்கிறது; இச்சூழலில் எருசலேமின் யூத ஆட்சிமன்றத்தைக் குறிப்பதாக இருக்கலாம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: கிரேக்கச் சுட்டுப்பெயரை நேரடியாகக் காத்து, பவுல்மீது குற்றஞ்சாட்டியவர்களின் சங்கம் என்பதைச் சூழலுக்கு விட்டுவைக்கிறது.
