translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் சார்பு அமைப்பு என்பதால் இறுதியில் ‘அறிந்ததும்’ பயன்படுத்தப்பட்டுள்ளது; அடிக்குறி குறியீடு அதற்குப் பின் வைக்கப்பட்டுள்ளது.
