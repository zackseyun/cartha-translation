source:
  edition: SBLGNT
  text: ἀναγνοὺς ⸀δὲ καὶ ἐπερωτήσας ἐκ ποίας ⸀ἐπαρχείας ἐστὶν καὶ πυθόμενος ὅτι ἀπὸ Κιλικίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: ta
  text: அவர் கடிதத்தை வாசித்து, அவர் எந்த மாகாணத்தைச் சேர்ந்தவர் என்று விசாரித்து, அவர் சிலிசியாவைச் சேர்ந்தவர் என்று அறிந்ததும்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் அமைப்பில்: “அதை வாசித்து, அவர் எந்த மாகாணத்திலிருந்து வந்தவர் என்று விசாரித்து, அவர் சிலிசியாவிலிருந்து வந்தவர் என்று அறிந்தபின்,”'
    reason: மூலத்தின் தொடர்ச்சியான வினையெச்ச அமைப்பையும் ‘இருந்து’ என்ற இடத்தோற்றக் குறிப்பையும் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: கடிதத்தை வாசித்துவிட்டு
  rationale: இது ἀναγινώσκω என்பதன் இறந்தகால வினையெச்சம். முந்தைய சூழலில் குறிப்பிடப்பட்ட கடிதமே வாசிக்கப்பட்டது என்பதால், இயல்பான தமிழுக்காக ‘கடிதத்தை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான தொடர்புச் சொல்; தமிழில் நிகழ்வுகளின் தொடர்ச்சியே அதன் உரையாடல் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: நிகழ்வுகளின் தொடர்ச்சியாக வெளிப்படுத்தப்பட்டது
  rationale: மூன்று வினையெச்சச் செயல்களையும் இணைக்கிறது; தமிழில் ‘வாசித்துவிட்டு ... கேட்டார் ... அறிந்ததும்’ என்ற தொடரமைப்பு இதன் இணைப்புச் செயல்பாட்டை வழங்குகிறது.
- source_word: ἐπερωτήσας
  choice: கேட்டார்
  rationale: ἐπερωτάω என்பதன் இறந்தகால வினையெச்சம்; நேரடியாக விசாரித்ததைக் குறிக்க இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: எந்த மாகாணத்தைச் சேர்ந்தவர்
  rationale: ἐπαρχεία என்பது ரோம நிர்வாக மாகாணத்தைக் குறிக்கிறது. ‘எந்த மாகாணத்தைச் சேர்ந்தவர்’ என்பது நிர்வாகப் பொருளையும் இயல்பான தமிழ் வழக்கையும் காக்கிறது.
- source_word: πυθόμενος
  choice: அறிந்ததும்
  rationale: πυνθάνομαι என்பதன் வினையெச்சம்; விசாரித்து ஒரு தகவலைத் தெரிந்துகொண்டதையும், அடுத்த வசனத்தில் தொடரும் செயலை எதிர்பார்க்கும் வாக்கிய ஓட்டத்தையும் வெளிப்படுத்துகிறது.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: அவர் சிலிசியாவைச் சேர்ந்தவர் என்று
  rationale: ἀπό இடத்தின் அடிப்படையிலான தோற்றம் அல்லது சொந்தத்தைச் சுட்டுகிறது. தமிழில் ‘சிலிசியாவைச் சேர்ந்தவர்’ என்பது நேரடியும் இயல்பானதும் ஆகும்.
- source_word: Κιλικίας
  choice: சிலிசியா
  rationale: கிரேக்க இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
