reference: Acts 23:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: ta
  text: அப்போது பவுல் அவரிடம், “வெள்ளையடிக்கப்பட்ட சுவரே, கடவுள் உன்னை அடிக்கப் போகிறார்![a] நீ சட்டத்தின்படி எனக்குத் தீர்ப்பளிக்க அமர்ந்திருக்கிறாய்; ஆனால் சட்டத்தை மீறி என்னை அடிக்கும்படி கட்டளையிடுகிறாயா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் உன்னை அடிப்பார்.” கிரேக்க மொழியில் சொல்லர்த்தமாக, “கடவுள் உன்னை அடிக்கப் போகிறார்” என்று உள்ளது; இது செயல் விரைவில் நிகழவிருப்பதை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: கடவுள் உன்னை அடிக்கப்போகிறார்
  rationale: μέλλει + வினையெச்சம் விரைவில் அல்லது நெருங்கி வரும் செயலைக் குறிக்கிறது. ‘அடிக்கப்போகிறார்’ என்பது அந்த அண்மைத்தன்மையை இயல்பான நவீன தமிழில் காக்கிறது; τύπτειν என்பதற்கு இங்கு ‘அடிக்க’ பொருத்தமானது.
- source_word: τοῖχε κεκονιαμένε
  choice: வெள்ளையடிக்கப்பட்ட சுவரே
  rationale: சுண்ணாம்பால் பூசப்பட்ட சுவர் என்ற தெளிவான உருவகத்தையும், வெளிப்புறத் தூய்மை அல்லது மதிப்புக்குப் பின்னுள்ள சீர்கேட்டைச் சாடும் வலிமையையும் காக்கிறது. perfect participle-இன் முடிவுற்ற நிலையும் ‘வெள்ளையடிக்கப்பட்ட’ என்பதில் பிரதிபலிக்கிறது.
- source_word: κάθῃ
  choice: அமர்ந்திருக்கிறாய்
  rationale: நீதித் தீர்ப்புக்காக அமர்ந்திருக்கும் நேரடியான காட்சியையும் பவுலின் கூர்மையான வினாவையும் காக்கிறது.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: சட்டத்தின்படி என்னைத் தீர்ப்பளிக்க
  rationale: κατά இங்கு சட்டத்தை அளவுகோலாகக் கொண்டு தீர்ப்பளிப்பதைக் குறிக்கிறது. ‘சட்டத்தின்படி’ என்பது துல்லியமும் இயல்பும் உடையது.
- source_word: παρανομῶν
  choice: சட்டத்தை மீறி
  rationale: சட்டத்திற்கு முரணாகச் செயல்படுவதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவித்து, முந்தைய ‘சட்டத்தின்படி’ என்பதுடன் உள்ள திட்டமிட்ட முரண்பாட்டைக் காக்கிறது.
- source_word: κελεύεις με τύπτεσθαι
  choice: என்னை அடிக்கும்படி கட்டளையிடுகிறாய்
  rationale: κελεύω-வின் கட்டளை வலிமையையும், τύπτεσθαι-யின் செயப்பாட்டு கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: அப்போது பவுல் அவரிடம் ... என்றார்
  rationale: கிரேக்கக் கதை அறிமுகத்தைத் தேவையற்ற விரிவாக்கமின்றி இயல்பான தமிழ் நேர்கூற்றுச் சொல்லமைப்பில் தருகிறது.
theological_decisions:
- issue: ‘கடவுள் உன்னை அடிக்கப்போகிறார்’ என்ற பவுலின் கூற்றின் தன்மை
  choice: விரைவில் நிகழவிருக்கும் தெய்வீகச் செயலின் அறிவிப்பாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘கடவுள் உன்னை அடிப்பாராக’ என்ற வேண்டுதல் அல்லது சாபவாக்கு
  rationale: μέλλει + infinitive அமைப்பு பொதுவாக விரைவில் நிகழவிருக்கும் செயலை அறிவிக்கிறது; விருப்பம் அல்லது வேண்டுதலை அல்ல. பவுலின் கூற்றின் ஒழுக்கத் தன்மையை விளக்கிச் சேர்க்காமல் மூலத்தின் இறையியல் பதற்றம் அப்படியே விடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. சட்டச் சூழலுக்கேற்ற ‘சட்டத்தின்படி,’ ‘தீர்ப்பளிக்க,’ ‘கட்டளையிடுகிறாய்’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘வெள்ளையடிக்கப்பட்ட சுவரே’ என்ற உருவகம் விளக்கி மாற்றப்படாமல் அதன் நேரடி தாக்கத்துடன் காக்கப்பட்டுள்ளது.
