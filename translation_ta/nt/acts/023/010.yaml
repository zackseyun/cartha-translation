translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வன்முறைச் சூழலை மென்மையாக்காமல் διασπάω மற்றும் ἁρπάζω ஆகியவற்றின் வலிமை பாதுகாக்கப்பட்டுள்ளது; ரோம இராணுவப் பதவியும் இடமும் புரியாத ஒலிபெயர்ப்புகளின்றி சூழலுக்கேற்ற சொற்களால் வழங்கப்பட்டுள்ளன.
