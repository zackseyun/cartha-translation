source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: ta
  text: பெரும் மோதல் ஏற்பட்டபோது[a], அவர்கள் பவுலைக் கிழித்துத் துண்டாக்கிவிடுவார்களோ[b] என்று படைத்தளபதி அஞ்சி, படைவீரர்கள் கீழே இறங்கி, அவர்களுடைய நடுவிலிருந்து அவரை வலுக்கட்டாயமாகப் பிடித்தெடுத்து, படைவீரர்களின் தங்குமிடத்துக்குக்[c] கொண்டுசெல்லுமாறு கட்டளையிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெரும் மோதல்” என்பதற்குப் பதிலாக “கடும் கருத்து மோதல்,” “பெரும் வாக்குவாதம்,” அல்லது “பெரும் குழப்பம்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் (στάσις) தீவிரமான உள்மோதலையும், சில சூழல்களில் கிளர்ச்சியையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கிழித்துத் துண்டாக்கிவிடுவார்களோ” என்பது கிரேக்க வினைச்சொல்லின் (διασπασθῇ) வன்மையான காட்சியுணர்வைப் பாதுகாக்கிறது; “பிய்த்துப்போட்டுவிடுவார்களோ” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “படைவீரர்களின் தங்குமிடம்” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் (παρεμβολή) நேரடியாக “படை முகாம்” என்றும் பொருள்படும்; இங்கு அது எருசலேமிலிருந்த ரோமப் படையினரின் தங்குமிடத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς ... γινομένης στάσεως
  choice: பெரும் கலகம் ஏற்பட்டபோது
  rationale: மரபுத்தொடர் அமைப்பை இயல்பான காலச் சார்பு வாக்கியமாக வழங்குகிறது. στάσις இங்கு தீவிரமான உள்மோதலையும் குழப்பத்தையும் குறிக்கிறது; முறையான கிளர்ச்சி என்று மிகைப்படுத்தாமல், சூழலின் வன்மையான பதற்றத்தை ‘கலகம்’ வெளிப்படுத்துகிறது.
- source_word: φοβηθεὶς
  choice: அஞ்சி
  rationale: தளபதி அடுத்த கட்டளையைப் பிறப்பித்ததற்கான காரணத்தைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ὁ χιλίαρχος
  choice: படைத்தளபதி
  rationale: ரோமப் படையின் உயரதிகாரியைக் குறிக்கும் சொல்லை, புரியாத ஒலிபெயர்ப்பைத் தவிர்த்து நவீன வாசகருக்குத் தெளிவாக வழங்குகிறது.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: அவர்கள் பவுலைக் கிழித்துத் துண்டாக்கிவிடுவார்களோ
  rationale: διασπάω என்பதன் வன்மையான, உயிரோட்டமுள்ள பொருளைப் பாதுகாக்கிறது; μή உடன் வரும் அச்சத்துக்குரிய சாத்தியத்தை ‘-வார்களோ’ இயல்பாகக் காட்டுகிறது.
- source_word: ἐκέλευσεν
  choice: கட்டளையிட்டான்
  rationale: இராணுவச் சூழலுக்குப் பொருத்தமான நேரடியான மொழிபெயர்ப்பு.
- source_word: τὸ στράτευμα
  choice: படைவீரர்கள்
  rationale: கட்டளைக்குக் கீழுள்ள படைக்குழுவைத் தமிழில் இயல்பான பன்மை வடிவில் குறிக்கிறது.
- source_word: καταβὰν
  choice: கீழே இறங்கிப்போய்
  rationale: மேலிருந்த கோட்டைப் பகுதியிலிருந்து கீழேயிருந்த மன்றத்துக்குச் செல்லும் இடவியல் இயக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: அவர்களிடையிலிருந்து அவனை வலுக்கட்டாயமாகப் பிடித்தெடுத்து
  rationale: ἁρπάζω குறிக்கும் திடீர், பலவந்தமான மீட்பு நடவடிக்கையையும் ἐκ μέσου αὐτῶν குறிக்கும் ‘அவர்களின் நடுவிலிருந்து’ என்ற கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: ἄγειν τε
  choice: கொண்டுவருமாறு
  rationale: குறிப்பிட்ட இலக்கை நோக்கிப் படைவீரர்கள் பவுலை அழைத்துச் செல்லும் செயலைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: παρεμβολήν
  choice: படைவீரர் தங்குமிடம்
  rationale: சொல் அடிப்படையில் ‘படை முகாம்’ என வரக்கூடியதாயினும், எருசலேமிலுள்ள ரோமப் படையினரின் குடியிருப்புப் பகுதியை இச்சூழலில் தெளிவாகக் குறிக்கிறது.
