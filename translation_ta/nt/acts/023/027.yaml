  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: ta
  text: யூதர்கள் இந்த மனிதனைப் பிடித்து, அவரைக் கொல்லவிருந்தபோது, அவர் ரோமர் என்று அறிந்த நான் படையினருடன் வந்து அவரை மீட்டேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συλλημφθέντα
  choice: பிடித்து
  rationale: இங்கு இந்த வினைச்சொல் பகைமையுடன் ஒருவரைப் பிடித்ததைக் குறிக்கிறது; முறையான சட்டப்பூர்வக் கைது என்ற கூடுதல் பொருளைச் சேர்க்காமல் இயல்பான தமிழில் இதைத் தெரிவிக்கிறது.
- source_word: Ἰουδαίων
  choice: யூதர்கள்
  rationale: எருசலேமில் பவுலை எதிர்த்த யூதக் குழுவை இங்கு குறிக்கிறது. கிரேக்கச் சொல் புவியியல் அடிப்படையில் ‘யூதேயர்கள்’ என்றும் பொருள்படக்கூடும் என்பதால் அந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: கொல்லவிருந்தபோது
  rationale: μέλλω உடனடியான நிகழ்வைச் சுட்டுகிறது; ἀναιρέω இச்சூழலில் கொல்வதைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் மரணம் நெருங்கியிருந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπιστὰς
  choice: வந்து
  rationale: திடீரென அங்கு வந்து தலையிட்ட நுண்பொருள் முழு வாக்கியத்தின் சூழலால் வெளிப்படுகிறது; ‘வந்து’ என்பது இயல்பான, மிகை விளக்கமில்லாத மொழிபெயர்ப்பு.
- source_word: σὺν τῷ στρατεύματι
  choice: படையினருடன்
  rationale: στράτευμα ஒரு படைப்பிரிவையோ படைவீரர் கூட்டத்தையோ குறிக்கலாம். அலகின் அளவைத் தேவையின்றி வரையறுக்காமல் இராணுவப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐξειλάμην
  choice: அவரை மீட்டேன்
  rationale: உடனிருந்த கொலை ஆபத்திலிருந்து விடுவித்ததைக் குறிக்கும் நடுத்தர வினை வடிவத்தின் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: μαθὼν
  choice: அறிந்த நான்
  rationale: கிரேக்க இறந்தகாலப் பெயரெச்சம் முதன்மைச் செயலுடன் தொடர்புடைய அறிதலைக் குறிக்கிறது. படைத்தலைவன் தன் செயலைச் சாதகமாக எடுத்துரைக்கும் வரிசையை மாற்றாமல் இது பிரதிபலிக்கிறது.
- source_word: Ῥωμαῖός ἐστιν
  choice: அவர் ரோமர்
  rationale: Ῥωμαῖος என்பதன் நேரடியான பொருளைத் தருகிறது; இச்சட்டச் சூழலில் ரோமக் குடியுரிமை உட்பொருளாக இருந்தாலும், அதை விளக்கமாக மூலவாக்கியத்தில் சேர்க்கவில்லை.
theological_decisions:
- issue: படைத்தலைவனின் கடிதத்திலுள்ள வரலாற்று–சொல்லாட்சிப் பதிவு
  choice: அவர் ரோமர் என்று அறிந்த பின்னரே மீட்டதாகப் படைத்தலைவன் கூறும் கூற்றை, அப்படியே மொழிபெயர்த்தல்
  alternative: அப்போஸ்தலர் 21–22 நிகழ்வுகளுடன் வெளிப்படையாக ஒத்திசையும்படி காலவரிசையை மாற்றியமைத்தல்
  rationale: இது கிலவுதியு லீசியா தன் செயல்களைச் சாதகமாக முன்வைக்கும் கடிதத்தின் சொற்கள். சுற்றியுள்ள நிகழ்வுரையுடன் காணப்படும் பதற்றத்தை மொழிபெயர்ப்பு விளக்கவோ நீக்கவோ கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கடிதத்தின் அதிகாரப்பூர்வத் தொனி காக்கப்பட்டாலும், செயற்கையான சட்ட மொழிநடை தவிர்க்கப்பட்டது.
