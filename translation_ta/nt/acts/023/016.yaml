translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் மரியாதையான வேதாகம நடையிலும் மொழிபெயர்க்கப்பட்டது. மூலத்தின் நிகழ்வுத் தொடர் பேணப்பட்டுள்ளது; உறவுமுறை தெளிவாகக் கூறப்பட்டுள்ளது; παρεμβολή மற்றும் ἐνέδρα ஆகியவற்றின் சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
