  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: ta
  text: ஆனால், பவுலின் சகோதரியின் மகன்[a] அந்தப் பதுங்கித் தாக்குவதற்கான சதியைக்[b] கேள்விப்பட்டபோது, அவன் வந்து படைவீரர்களின் தங்குமிடத்திற்குள்[c] நுழைந்து, அதைப் பவுலிடம் தெரிவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பவுலின் மருமகன்’ என்றும் கூறலாம்; ஆனால் அந்தச் சொல் சில பயன்பாடுகளில் வேறு உறவுமுறைகளையும் குறிக்கலாம். கிரேக்கத்தில், ‘பவுலின் சகோதரியின் மகன்’ என்று வெளிப்படையாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘பதுங்கித் தாக்குதல்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் குறிப்பாகப் பதுங்கியிருந்து தாக்குவதையோ அவ்வாறு காத்திருப்பதையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘படை முகாமிற்குள்’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் இது ரோமப் படைவீரர்களின் தங்குமிடத்தைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: கேள்விப்பட்டபோது
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கு முன் நிகழ்ந்ததைக் காட்டுகிறது. தமிழில் காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் வரும் சதித்திட்டத்திலிருந்து அது கண்டுபிடிக்கப்படுவதற்கான மிதமான எதிர்மறைத் திருப்பத்தை வெளிப்படுத்துகிறது.
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: பவுலின் சகோதரியின் மகன்
  rationale: கிரேக்க மூலத்தின் உறவுமுறையைத் துல்லியமாகவும் தமிழில் தெளிவாகவும் கூறுகிறது; பல பொருள் தரக்கூடிய உறவுமுறைச் சுருக்கச் சொல்லைத் தவிர்க்கிறது.
- source_word: τὴν ἐνέδραν
  choice: அந்தப் பதுங்கித் தாக்கும் திட்டத்தை
  rationale: ἐνέδρα என்பதன் பதுங்கியிருந்து தாக்குதல் என்ற குறிப்பான பொருளைப் பேணுகிறது; பொதுவான ‘சதி’ என்பதைவிட இச்சூழலின் செயலைத் தெளிவுபடுத்துகிறது.
- source_word: παραγενόμενος
  choice: அவன் வந்து
  rationale: அவன் அங்கு வந்து சேர்ந்ததை இயல்பான தமிழ் நிகழ்வுத் தொடரில் காட்டுகிறது.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: படைவீரர்களின் தங்குமிடத்திற்குள் நுழைந்து
  rationale: எருசலேமில் ரோமப் படையினரின் காவலில் பவுல் இருந்த சூழலில் παρεμβολή என்பது படைவீரர்களின் தங்குமிடத்தைக் குறிக்கிறது; அதேவேளை ‘படை முகாம்’ என்ற பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀπήγγειλεν
  choice: தெரிவித்தான்
  rationale: கேள்விப்பட்ட தகவலைப் பவுலிடம் கொண்டு சென்று அறிவித்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῷ Παύλῳ
  choice: பவுலிடம்
  rationale: தகவல் யாரிடம் தெரிவிக்கப்பட்டது என்பதைக் குறிக்கும் மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் தருகிறது.
