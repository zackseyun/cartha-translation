  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நீண்ட கட்டளை அமைப்பு தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
