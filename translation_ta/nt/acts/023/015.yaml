source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: ta
  text: ஆகவே இப்போது, நீங்களும் ஆலோசனைச் சங்கத்தோடு சேர்ந்து, அவனைப் பற்றியவற்றை இன்னும் துல்லியமாக விசாரிக்கப்போகிறவர்களைப் போல, அவனை உங்களிடம் கீழே கொண்டுவரும்படி[a] படைத்தலைவரிடம் தெரிவியுங்கள்[b]. ஆனால், அவன் அருகில் வருவதற்கு முன்பே அவனைக் கொல்ல நாங்கள் ஆயத்தமாக இருக்கிறோம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை உங்கள்முன் கொண்டுவரும்படி.” கிரேக்க வினைச்சொல் சொல்லர்த்தமாக அவனைக் ‘கீழே கொண்டுவருதல்’ என்ற கருத்தையும் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய வழக்கை இன்னும் கவனமாக ஆராயப்போகிறவர்களைப் போல.” இந்தச் சொற்றொடர் மேலும் நீதிமுறை விசாரணை நடத்தப்போவதாகப் பாசாங்கு செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவன் வந்து சேருவதற்கு முன்பே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: தெரிவியுங்கள்
  rationale: அதிகாரியிடம் ஒரு காரியத்தை முறைப்படி தெரியப்படுத்துதல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; ‘கோருங்கள்’ என்று சூழலை அளவுக்கு மீறி குறிப்பாக்கவில்லை.
- source_word: χιλιάρχῳ
  choice: படைத்தளபதியிடம்
  rationale: ரோமப் படையின் χιλίαρχος என்ற அதிகாரியை வாசகருக்குப் புரியும் வகையில் குறிக்கிறது; தொழில்நுட்பப் பதவிப்பெயரை ஒலிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: σὺν τῷ συνεδρίῳ
  choice: ஆலோசனைச் சங்கத்தாரும் சேர்ந்து
  rationale: σύν என்பதன் கூட்டுறவுப் பொருளையும், συνέδριον என்பதன் அறியப்பட்ட ஆளும் ஆலோசனை அமைப்பையும் வெளிப்படுத்துகிறது; ‘சனெத்ரின்’ என்ற ஒலிபெயர்ப்பைவிட வெளிப்படையானது.
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: அவனை உங்களிடம் கீழே அழைத்துவரும்படி
  rationale: κατάγω என்பதிலுள்ள கீழ்நோக்கிய இயக்கத்தைப் பாதுகாக்கிறது; தமிழில் இயல்பாகவும் உள்ளது.
- source_word: ὡς μέλλοντας
  choice: விசாரிக்கப்போவதுபோல் சொல்லுங்கள்
  rationale: கிரேக்கச் சொற்றொடரிலுள்ள தோற்றப்படுத்தப்பட்ட அல்லது பாசாங்கான நோக்கத்தை வெளிப்படுத்துகிறது; ஏமாற்றத்தைத் தனியாக மிகைப்படுத்தவில்லை.
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: இன்னும் துல்லியமாக விசாரிக்க
  rationale: நீதித்துறைச் சூழலில் ஆராய்ந்து தீர்மானிக்கும் வினையையும், ஒப்பீட்டு அடைமொழியான ‘மேலும் துல்லியமாக’ என்பதையும் காக்கிறது.
- source_word: τὰ περὶ αὐτοῦ
  choice: அவனைப் பற்றியவற்றை
  rationale: கிரேக்க மரபுத்தொடரின் பரந்த பொருளை வைத்திருக்கிறது; ‘அவனுடைய வழக்கை’ என்று நீதிமன்றப் பொருளை மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτὸν
  choice: அவன் அருகில் வருவதற்கு முன்பே
  rationale: ἐγγίζω என்பதன் அணுகுதல் அல்லது அருகில் வருதல் என்ற இடவியல் நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: அவனைக் கொல்ல
  rationale: இச்சூழலில் ἀναιρέω என்பதன் நேரடியான பொருளைத் தெளிவாகத் தருகிறது; ‘கொலைசெய்ய’ என்ற கூடுதல் அறவியல் மதிப்பீட்டைச் சேர்க்கவில்லை.
