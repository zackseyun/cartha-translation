source:
  edition: SBLGNT
  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: ta
  text: அவர் இதைச் சொல்லிக்கொண்டிருந்தபோது, பரிசேயர்களுக்கும் சதுசேயர்களுக்கும் இடையே கருத்து மோதல் ஏற்பட்டது[a]; அங்கிருந்த கூட்டம் பிளவுபட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “பிணக்கு ஏற்பட்டது” அல்லது “தகராறு எழுந்தது.”'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு வகையில்: “அங்கிருந்தவர்கள் இரு தரப்பாகப் பிரிந்தார்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: அவர் இதைச் சொல்லிக்கொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருக்கும் சமகாலச் செயலைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையுடன் அமைந்த தனிநிலை ஆறாம் வேற்றுமைத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγένετο
  choice: ஏற்பட்டது
  rationale: மோதல் அப்போது உருவானது அல்லது வெடித்தது என்ற தொடக்கப் பொருளை இயல்பான கதைநடைத் தமிழில் தருகிறது.
- source_word: στάσις
  choice: கருத்து மோதல்
  rationale: சூழலில் இரு தரப்பினரிடையே எழுந்த முரண்பாட்டையும் வாக்குவாதத்தையும் தெரிவிக்கிறது; சொல்லின் ‘பிணக்கு/பிளவு’ என்ற பரந்த பொருளை அடிக்குறிப்பில் தக்கவைக்கிறது.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: பரிசேயர்களுக்கும் சதுசேயர்களுக்கும் இடையே
  rationale: கிரேக்க ஆறாம் வேற்றுமைத் தொடர்பு இங்கு எதிரெதிரான இரு குழுக்களுக்கிடையிலான மோதலைக் குறிக்கிறது; தமிழில் ‘இடையே’ என்பது தெளிவும் இயல்பும் தருகிறது.
- source_word: ἐσχίσθη
  choice: பிளவுபட்டது
  rationale: σχίζω என்பதன் பிரிக்கப்பட்டது/பிளந்தது என்ற உருவகத்தை சமூகக் குழுவின் பிரிவைக் குறிக்கும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: τὸ πλῆθος
  choice: அங்கிருந்த கூட்டம்
  rationale: இது சீரற்ற பொதுமக்கள் கூட்டத்தை மட்டும் அல்லாமல், பவுல் பேசியபோது அங்கு கூடியிருந்த மொத்தக் குழுவைக் குறிக்கிறது. ‘அங்கிருந்த’ என்பது சூழலைத் தெளிவாக்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நிகழ்காலப் பங்கேற்புவினையின் சமகாலத் தன்மை ‘சொல்லிக்கொண்டிருந்தபோது’ எனப் பாதுகாக்கப்பட்டுள்ளது; மோதலும் அதன் விளைவான கூட்டப் பிளவும் தனித்தனியாகத் தெளிவுபடுத்தப்பட்டுள்ளன.
