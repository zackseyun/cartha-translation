  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: ta
  text: அந்த மனிதருக்கு எதிராகச் சதி ஒன்று நடக்கவிருப்பதாக எனக்குத் தெரிவிக்கப்பட்டபோது, உடனடியாக அவரை உங்களிடம் அனுப்பினேன். அவர்மீது குற்றஞ்சாட்டுபவர்களுக்கும், உங்கள்முன் அவருக்கு எதிராகத் தங்கள் குற்றச்சாட்டுகளை முன்வைக்குமாறு கட்டளையிட்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள்முன் அவருக்கு எதிராகப் பேசுமாறு.” கிரேக்கத்தில் சொல்லுக்கு நெருக்கமாக, “உங்கள்முன் அவரிடம்/அவருக்கு எதிராகப் பேச” என்று உள்ளது; இது நீதிமன்றச் சூழலில் குற்றச்சாட்டுகளை முன்வைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: எனக்குத் தெரிவிக்கப்பட்டபோது
  rationale: இது இறந்தகாலச் செயப்பாட்டு வினையெச்சத் தொடராக இருப்பதால், அதன் செயப்பாட்டு நிலையையும் காலச் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπιβουλῆς
  choice: சதி ஒன்று
  rationale: எதிரிக்குத் தீங்கு செய்ய வகுக்கப்படும் திட்டத்தைக் குறிக்கும் பொதுவான பொருளைத் தக்கவைக்கிறது; ‘பதுங்கித் தாக்குதல்’ என்று சூழலை அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: εἰς τὸν ἄνδρα
  choice: இந்த மனிதருக்கு எதிராக
  rationale: εἰς இங்கு பகைமையின் இலக்கைக் குறிக்கிறது. முன் சூழலில் குறிப்பிடப்பட்ட பவுலையே சுட்டுவதால் தமிழில் ‘இந்த மனிதர்’ இயல்பாக உள்ளது.
- source_word: ἔσεσθαι
  choice: நடக்கவிருப்பதாக
  rationale: எதிர்கால வினையெச்சம் சதி நிகழவிருப்பதைக் குறிக்கிறது; தமிழில் மறைமுகக் கூற்றாக இயல்பாக மாற்றப்பட்டுள்ளது.
- source_word: ἐξαυτῆς
  choice: உடனடியாக
  rationale: தாமதமின்றி உடனே செய்த செயலைத் தெளிவாகவும் அதிகாரப்பூர்வ நடைக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: ἔπεμψα πρὸς σέ
  choice: அவரை உங்களிடம் அனுப்பினேன்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், சூழலிலிருந்து அது பவுலைக் குறிக்கிறது; தெளிவான தமிழுக்காக ‘அவரை’ சேர்க்கப்பட்டுள்ளது.
- source_word: παραγγείλας
  choice: கட்டளையிட்டேன்
  rationale: அனுப்பியதோடு இணைந்து நடந்த கூடுதல் செயலைத் தனி தமிழ் வாக்கியத்தில் தெளிவாகத் தருகிறது.
- source_word: κατηγόροις
  choice: அவர்மீது குற்றஞ்சாட்டுகிறவர்களும்
  rationale: சட்டச் சூழலுக்கேற்ற சொல்லாக்கம்; குற்றஞ்சாட்டப்படுபவர் பவுல் என்பதை ‘அவர்மீது’ தெளிவாக்குகிறது. καί குறிக்கும் கூடுதல் தொடர்பை ‘-உம்’ தக்கவைக்கிறது.
- source_word: λέγειν πρὸς αὐτὸν
  choice: தங்கள் குற்றச்சாட்டுகளை ... எடுத்துரைக்க
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவருக்கு எதிராகப் பேச’ என்றாலும், நீதிமன்றச் சூழலில் குற்றச்சாட்டை முன்வைப்பதே பொருள். பிரதிப்பெயரின் நேரடியான வடிவத்தால் தோன்றும் ஐயத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ἐπὶ σοῦ
  choice: உங்களுக்கு முன்பாக
  rationale: பெலிக்ஸ் என்ற அதிகாரியின் முன்னிலையில் வழக்கை முன்வைப்பதைக் குறிக்கும் நீதித்துறை நயத்தைச் சுருக்கமாகத் தருகிறது.
