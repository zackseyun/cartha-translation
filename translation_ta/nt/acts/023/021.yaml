source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: ta
  text: ஆகவே, நீர் அவர்களால் மனம் மாற்றப்படாதீர். ஏனெனில், அவர்களில் நாற்பதுக்கும் மேற்பட்ட ஆண்கள் அவனைப் பதுங்கித் தாக்கக் காத்திருக்கிறார்கள். அவனைக் கொல்லும்வரை சாப்பிடவோ குடிக்கவோ மாட்டோம் என்று அவர்கள் தங்களையே சாபத்துக்கு உட்படுத்தி உறுதிமொழி எடுத்திருக்கிறார்கள்.[a] இப்போது அவர்கள் ஆயத்தமாக இருந்து, உம்மிடமிருந்து வரும் வாக்குறுதிக்காகக் காத்திருக்கிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள்மீது சாபம் வரட்டும் என்று ஆணையிட்டிருக்கிறார்கள்.” அவர்கள் தங்கள் உறுதிமொழியை நிறைவேற்றாவிட்டால் தங்கள்மீது சாபம் வரட்டும் என்ற கருத்து கிரேக்கச் சொல்லில் அடங்கியுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு அது உமது சம்மதம் அல்லது அனுமதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: இணங்கவைக்கப்பட வேண்டாம்
  rationale: செயப்பாட்டு வடிவத்தையும், அவர்களுடைய கோரிக்கையால் மனம் மாற்றப்பட்டு இணங்கிவிட வேண்டாம் என்ற சூழல்சார்ந்த பொருளையும் காக்கிறது.
- source_word: ἐνεδρεύουσιν
  choice: பதுங்கியிருந்து தாக்கக் காத்திருக்கிறார்கள்
  rationale: வெறும் சதித்திட்டத்தை அல்ல, மறைந்திருந்து தாக்கும் பதுங்குத் தாக்குதலின் தெளிவான படிமத்தை வெளிப்படுத்துகிறது.
- source_word: ἐξ αὐτῶν
  choice: அவர்களில்
  rationale: முன்னர் குறிப்பிடப்பட்ட குழுவிலிருந்து இந்த ஆண்கள் வந்தவர்கள் என்பதைக் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: நாற்பதுக்கும் மேற்பட்ட ஆண்கள்
  rationale: ஒப்பீட்டு அமைப்பையும் எண்ணிக்கையின் வலிமையையும் துல்லியமாகக் காக்கிறது.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: தங்கள்மீது சாபத்தை வரவழைத்து உறுதிபூண்டிருக்கிறார்கள்
  rationale: தாங்கள் தவறினால் சாபம் நேரட்டும் என்ற சுயசாப உறுதிமொழியின் இரு கூறுகளையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: சாப்பிடவும் குடிக்கவும் மாட்டோம்
  rationale: இரண்டு செயல்களையும் மறுக்கும் இணை அமைப்பை இயல்பான நேரடி உரை வடிவில் தருகிறது.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: அவனைக் கொல்லும்வரை
  rationale: ἀναιρέω என்பதன் இச்சூழலிலுள்ள வன்முறையான கொலைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἰσιν ἕτοιμοι
  choice: ஆயத்தமாக இருந்து
  rationale: அவர்கள் உடனடியாகச் செயல்படத் தயாராக உள்ள நிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: προσδεχόμενοι
  choice: காத்திருக்கிறார்கள்
  rationale: எதிர்பார்ப்புடன் காத்திருக்கும் நிகழ்காலச் செயலைத் தெளிவாகக் காக்கிறது.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: உம்மிடமிருந்து வரும் ஒப்புதல்
  rationale: ἐπαγγελία என்பதன் அடிப்படைப் பொருள் ‘வாக்குறுதி’ என்றாலும், இங்கு அதிகாரியின் சம்மதம் அல்லது அனுமதியை எதிர்பார்ப்பதே சூழல்சார்ந்த குறிப்பு; அதை முதன்மை உரையில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: சுயசாப உறுதிமொழியின் தன்மை
  choice: தங்கள்மீது சாபத்தை வரவழைத்து உறுதிபூண்டிருக்கிறார்கள்
  alternative: சத்தியம் செய்திருக்கிறார்கள்
  rationale: வெறும் சத்தியம் என்ற மொழிபெயர்ப்பு ἀναθεματίζω என்பதிலுள்ள சாபத்தைத் தம்மீது அழைக்கும் கூறை மறைத்துவிடும்; எந்த மதப்பிரிவுச் சார்ந்த விளக்கத்தையும் சேர்க்காமல் மூலத்தின் தீவிரத்தைப் பாதுகாக்கிறது.
- issue: ἐπαγγελία என்பதன் சூழல்சார்ந்த பொருள்
  choice: ஒப்புதல்
  alternative: வாக்குறுதி
  rationale: இங்கு அவர்கள் எதிர்பார்ப்பது படைத்தளபதியின் சம்மதம் அல்லது அனுமதி என்பதால் ‘ஒப்புதல்’ வாசகருக்குத் தெளிவாகிறது; ‘வாக்குறுதி’ என்ற நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அதிகாரியை நோக்கிய மரியாதைப் பன்மையாக ‘நீர்/உம்மிடமிருந்து’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நீண்ட வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; பதுங்குத் தாக்குதல், சுயசாப உறுதி, எதிர்பார்க்கப்படும் அதிகாரப்பூர்வ ஒப்புதல் ஆகிய கருத்துகள் பாதுகாக்கப்பட்டுள்ளன.
