source:
  edition: SBLGNT
  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: ta
  text: பவுல் ஆலோசனைச் சங்கத்தை உற்றுநோக்கி, “சகோதரர்களே, இந்நாள்வரை நான் முற்றிலும் நல்ல மனச்சாட்சியுடன் கடவுளுக்கு முன்பாக வாழ்ந்திருக்கிறேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுக்கு முன்பாக ஒரு குடிமகனாக நடந்துகொண்டிருக்கிறேன்.” கிரேக்க வினையில் குடிமை வாழ்வு சார்ந்த நிழற்பொருள் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: உற்றுப் பார்த்து
  rationale: நோக்கத்தை ஒருமுகப்படுத்தி நிலையாகப் பார்ப்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல் சேர்க்கப்படவில்லை
  rationale: தமிழ் உரையோட்டத்தில் பெயரெச்ச வினை அமைப்பே மெல்லிய கதைத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது; ‘மேலும்’ அல்லது ‘அப்போது’ என்பது தேவையற்ற வலியுறுத்தலைச் சேர்க்கலாம்.
- source_word: τῷ συνεδρίῳ
  choice: ஆலோசனைச் சங்கத்தினரை
  rationale: இச்சூழலில் யூத ஆட்சிமன்றத்தைக் குறிக்கும் பொதுப்பெயரை ஒலிபெயர்ப்பின்றித் தெளிவாக வழங்குகிறது; ἀτενίζω என்பதுடன் இயல்பான தமிழுக்காக மனிதர்களைக் குறிக்கும் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἄνδρες ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்களைக் கொண்ட அவையினரிடம் பேசும் மரபுவழி நேரடி அழைப்பை இயல்பாகக் காட்டுகிறது; ‘ஆண்களே, சகோதரர்களே’ என்பது தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: முற்றிலும் நல்மனச்சாட்சியோடு
  rationale: πάσῃ என்பதன் முழுமையான வலியுறுத்தலையும், மனச்சாட்சி நன்றாக இருப்பதைக் குறிக்கும் ஒழுக்கப் பொருளையும் காக்கிறது.
- source_word: πεπολίτευμαι
  choice: வாழ்ந்திருக்கிறேன்
  rationale: நடத்தை அல்லது வாழ்க்கை முறையைக் குறிக்கும் சூழல்சார் பொருளையும், இறந்தகாலத்திலிருந்து நிகழ்காலம் வரை தொடரும் நிறைநிலை வினையின் பார்வையையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு முன்பாக
  rationale: கடவுளுடன் தொடர்புடையதும் அவரது பார்வைக்குட்பட்டதுமான வாழ்க்கையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வெறும் ‘கடவுளுக்கு’ என்பது இங்கு தெளிவற்றதாக இருக்கும்.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: இந்நாள்வரை
  rationale: கடந்த காலத்திலிருந்து பேசும் இப்பொழுதுவரையிலான தொடர்ச்சியைச் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
theological_decisions:
- issue: πεπολίτευμαι என்பதில் உள்ள வாழ்க்கை நடத்தை மற்றும் குடியுரிமை நிழற்பொருள்
  choice: முதன்மை உரையில் ‘வாழ்ந்திருக்கிறேன்’; அடிக்குறிப்பில் குடிமகனாக நடந்துகொள்ளுதல் என்ற நிழற்பொருள்
  alternative: ‘கடவுளுக்கு முன்பாக ஒரு குடிமகனாக நடந்துகொண்டிருக்கிறேன்’
  rationale: இச்சூழலில் பவுலின் முக்கியக் கூற்று கடவுளுக்கு முன்பான அவரது வாழ்க்கை நடத்தை மற்றும் மனச்சாட்சியைப் பற்றியது. அதேவேளை, கிரேக்க வினையின் குடிமை சார்ந்த உண்மையான நிழற்பொருளை அடிக்குறிப்பு காக்கிறது; பிரதான உரை அதை அரசியல் அல்லது தொழில்நுட்பக் கூற்றாக மிகைப்படுத்தவில்லை.
- issue: முற்றிலும் நல்மனச்சாட்சி என்ற கூற்றின் அளவு
  choice: மனச்சாட்சியைப் பற்றிய பவுலின் விரிவான கூற்றாகவே மொழிபெயர்த்தல்
  alternative: பாவமற்ற முழுமை அல்லது முழுமையான ஒழுக்கக் குற்றமின்மை பற்றிய கூற்றாக விளக்குதல்
  rationale: πάσῃ என்பதன் வலிமையைத் தளர்த்தாமல் காக்கிறது; ஆனால் மூலத்தில் இல்லாத பாவமற்ற தன்மை குறித்த கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஆலோசனைச் சங்கம்’ என்பது வெளிப்படையான பொதுப்பெயராக வைக்கப்பட்டுள்ளது; ‘சன்ஹெட்ரின்’ என்ற ஒலிபெயர்ப்பு தவிர்க்கப்பட்டது. அடிக்குறிப்பு குறியீடு தொடர்புடைய வினைத்தொடருக்குப் பின்னர் இடப்பட்டுள்ளது.
