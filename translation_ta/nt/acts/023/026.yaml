lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: கிளவுதியு லீசியா
  rationale: கிரேக்கப் பெயரின் ஒலிவடிவத்தைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதியுள்ளது.
- source_word: τῷ κρατίστῳ
  choice: மாண்புமிகு
  rationale: அதிகாரியிடம் மரியாதையுடன் எழுதப்படும் கடிதத்தின் முறையான தொனியைக் காக்கும் நவீனத் தமிழ் மரியாதைச் சொல்; கிரேக்க உயர்நிலை மரியாதைப் பட்டத்தின் பொருளை அளிக்கிறது.
- source_word: ἡγεμόνι
  choice: ஆளுநர்
  rationale: ரோம மாகாணத்தின் ஆட்சி அதிகாரியை இச்சூழலில் தெளிவாகவும் தேவையற்ற தொழில்நுட்பத் துல்லியத்தைத் திணிக்காமலும் குறிக்கிறது.
- source_word: Φήλικι
  choice: பெலிக்ஸ்
  rationale: கிரேக்கத்தில் வழங்கப்பட்டுள்ள தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: χαίρειν
  choice: வாழ்த்து
  rationale: இது ‘மகிழுங்கள்’ என்ற நேரடிக் கட்டளையல்ல; பண்டைய கடிதத் தொடக்கத்தில் பயன்படுத்தப்பட்ட மரபான வாழ்த்துரை. ‘வாழ்த்து’ அதன் கடிதவழக்குச் செயல்பாட்டைச் சுருக்கமாகத் தருகிறது.
