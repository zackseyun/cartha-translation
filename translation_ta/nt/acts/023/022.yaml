source:
  edition: SBLGNT
  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: ta
  text: ஆகவே, படைத்தளபதி, “நீ இவற்றை என்னிடம் தெரிவித்ததை யாரிடமும் சொல்லாதே” என்று அவனுக்குக் கட்டளையிட்டு, அந்த இளைஞனை அனுப்பிவிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: படைத்தளபதி
  rationale: ரோமப் படையின் ஒரு பெரிய பிரிவுக்குத் தலைமை வகித்த அதிகாரியைக் குறிக்கிறது. தொழில்நுட்பப் பதவிப்பெயரைத் திணிக்காமல், அவரது இராணுவ அதிகாரத்தை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπέλυσε
  choice: அனுப்பிவிட்டு
  rationale: காவலிலிருந்து விடுதலை செய்தார் என்பதைக் காட்டிலும், சந்திப்பை முடித்து அந்த இளைஞனைப் போகச் செய்தார் என்பதே சூழலுக்குப் பொருத்தமானது.
- source_word: νεανίσκον
  choice: இளைஞனை
  rationale: இளவயது ஆணைக் குறிக்கும் இயல்பான, மரியாதையான நவீனத் தமிழ்ச் சொல்.
- source_word: παραγγείλας
  choice: கட்டளையிட்டார்
  rationale: அதிகாரி கொடுத்த தெளிவான உத்தரவை வெளிப்படுத்துகிறது; கிரேக்க வினையெச்சத்தை இயல்பான தமிழ் வாக்கிய அமைப்பில் முதன்மை வினையாக வழங்குகிறது.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: யாரிடமும் சொல்லாதே
  rationale: இந்தத் தகவலை எவரிடமும் வெளியிடக்கூடாது என்ற தடையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐνεφάνισας
  choice: தெரிவித்ததை
  rationale: ஒரு அதிகாரியிடம் தகவலைக் கொண்டுவந்து அறிவித்தல் என்ற சூழல்சார்ந்த பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முன்னர் கூறப்பட்ட பல விவரங்களைக் குறிக்கும் கிரேக்கப் பன்மையைப் பாதுகாக்கிறது.
- source_word: πρὸς ἐμέ
  choice: என்னிடம்
  rationale: தகவல் தெரிவிக்கப்பட்ட நபரை நோக்கிய திசை அல்லது பெறுநரை இயல்பான தமிழில் குறிக்கிறது.
