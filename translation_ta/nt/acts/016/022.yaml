  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: ta
  text: மக்கள்கூட்டமும் அவர்களுக்கு எதிராக ஒன்றுசேர்ந்து எழுந்தது[a]. நகர அதிகாரிகள்[b] அவர்கள் இருவருடைய ஆடைகளைக் கிழித்துக் கழற்றிவிட்டு, அவர்களைத் தடிகளால் அடிக்கும்படி கட்டளையிட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைத் தாக்குவதில் ஒன்றுசேர்ந்தது.” கூட்டத்தினர் பகைமையுடன் ஒன்றிணைந்து செயல்பட்டதை கிரேக்க வினை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “நகர அதிகாரிகள்” என்பது ரோமக் குடியேற்ற நகரமான பிலிப்பியின் குடிமை அதிகாரிகளைக் குறிக்கிறது; தொழில்நுட்பமாக, “பிரேட்டர்கள்” என்றும் கூறலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: எதிராக ஒன்றுசேர்ந்து எழுந்தது
  rationale: கூட்டமாக ஒன்றிணைந்து பகைமையுடன் செயல்பட்டதையும் திடீரென எதிர்த்து எழுந்ததையும் கிரேக்கக் கூட்டு வினை உணர்த்துகிறது.
- source_word: ὄχλος
  choice: மக்கள்கூட்டம்
  rationale: உணர்ச்சிநிலையை அளவுக்கு மீறி விளக்காமல், சூழலில் கூடியிருந்த மக்களை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: κατ’ αὐτῶν
  choice: அவர்களுக்கு எதிராக
  rationale: இச்சூழலில் κατά என்பதன் பகைமை சார்ந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: στρατηγοὶ
  choice: நகர அதிகாரிகள்
  rationale: ரோமக் குடியேற்ற நகரமான பிலிப்பியின் குடிமை நிர்வாக அதிகாரிகளை வாசகருக்கு எளிதில் புரியும் வகையில் குறிக்கிறது; தொழில்நுட்பப் பதவி அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: περιρήξαντες
  choice: கிழித்து அகற்றிவிட்டு
  rationale: ஆடைகளை வலுக்கட்டாயமாகக் கிழித்து நீக்கிய செயலையும், அது கட்டளைக்கு முன் நடந்ததையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: அவர்களுடைய ஆடைகளை
  rationale: தண்டனைக்கு முன் பவுல் மற்றும் சீலாவின் உடைகள் அகற்றப்பட்டதை பொதுவாகவும் தெளிவாகவும் கூறுகிறது; தேவையின்றி ‘மேலாடைகள்’ எனக் குறுக்கவில்லை.
- source_word: ἐκέλευον
  choice: கட்டளையிட்டுக்கொண்டிருந்தார்கள்
  rationale: நிகழ்ச்சி நடந்துகொண்டிருக்கையில் தொடர்ந்த கட்டளையை உணர்த்தும் கிரேக்க இறந்தகாலத் தொடர்நிலை அம்சத்தைப் பாதுகாக்கிறது.
- source_word: ῥαβδίζειν
  choice: தடிகளால் அடிக்கும்படி
  rationale: சாட்டையால் அல்ல, தடிகளால் அடிக்கும் ரோமத் தண்டனை முறையைத் துல்லியமாகவும் வெளிப்படையாகவும் தருகிறது.
