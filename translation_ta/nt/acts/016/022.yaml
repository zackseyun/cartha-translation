translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள்கூட்டம்’ என்பது ‘கும்பல்’ போன்ற உணர்ச்சிசார் மிகைவைக் தவிர்க்கிறது; ‘நகர அதிகாரிகள்’ வரலாற்றுச் சூழலைத் தெளிவாக்குகிறது. வாக்கியத்தின் நிகழ்வுவரிசையும் கிரேக்க இறந்தகாலத் தொடர்நிலை அம்சமும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
