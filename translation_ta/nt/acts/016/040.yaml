source:
  edition: SBLGNT
  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: ta
  text: அவர்கள் சிறையிலிருந்து வெளியே வந்தபின், லீதியாவிடம் சென்றார்கள்; சகோதரர்களை[a] கண்டு, அவர்களை ஊக்கப்படுத்தி, புறப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதரர்களையும் சகோதரிகளையும்.” கிரேக்கச் சொல் ஆண்பால் பன்மையில் இருந்தாலும், ஆண்களும் பெண்களும் அடங்கிய சக விசுவாசிகள் குழுவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: வெளியே வந்தபின்
  rationale: முதன்மை வினைக்கு முன்பு நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்புச் சொல்லை, நிகழ்வுகளின் வரிசையைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்க் காலத் தொடராக மொழிபெயர்க்கிறது.
- source_word: ἀπὸ τῆς φυλακῆς
  choice: சிறையிலிருந்து
  rationale: குறிப்பிட்ட அந்தச் சிறையிலிருந்து வெளியே வந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: லீதியாளிடம் சென்றார்கள்
  rationale: ஒருவரிடம் சென்று அவரைச் சந்திப்பதைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பாகத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வீடு’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἰδόντες
  choice: கண்டு
  rationale: அவர்களைப் பார்த்ததைத் தொடர்ந்து ஊக்கப்படுத்தியதைச் சுருக்கமான, இயல்பான தமிழ்த் தொடர்வினையாகக் காட்டுகிறது.
- source_word: παρεκάλεσαν
  choice: ஊக்கப்படுத்திவிட்டு
  rationale: παρακαλέω என்பதிலுள்ள ஊக்குவித்தல், உறுதிப்படுத்துதல், ஆறுதல் கூறுதல் ஆகிய பரந்த பொருள் வாய்ப்புகளில் ஒன்றை அளவுக்கு மீறிக் குறுக்காமல், இச்சூழலுக்கு ஏற்ற பொதுவான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: τοὺς ἀδελφούς
  choice: சகோதரர்களை
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் காக்கிறது; இது ஆண், பெண் இருபாலரையும் உள்ளடக்கிய சக விசுவாசிகளைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἐξῆλθαν
  choice: புறப்பட்டார்கள்
  rationale: அவர்கள் அங்கிருந்து சென்றதைத் தெரிவிக்கிறது; அவர்கள் துல்லியமாக எதிலிருந்து அல்லது எங்கு சென்றார்கள் என்பதை மூலத்தைவிட அதிகமாக நிர்ணயிக்கவில்லை.
theological_decisions:
- issue: τοὺς ἀδελφούς என்பது ஆண், பெண் இருபாலரும் இருந்திருக்கக்கூடிய விசுவாசிகள் குழுவைக் குறித்தல்
  choice: சகோதரர்களை
  alternative: சகோதர சகோதரிகளை; விசுவாசிகளை
  rationale: மூல கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை உரையில் வெளிப்படுத்துகிறது. அதே நேரத்தில், அச்சொல் கலப்புப் பாலினக் குழுவையும் குறிக்கக்கூடிய உண்மையான பொருள் பரப்பை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘லீதியாளிடம்’ என்பது ஒருவரைச் சந்திக்கச் செல்வதைக் காட்டுகிறது; மூலத்தில் இல்லாத ‘வீடு’ சேர்க்கப்படவில்லை. ‘அங்கே’ என்பது தமிழில் தொடர்பைத் தெளிவாக்கும் சிறிய வெளிப்படுத்தல்; புதிய நிகழ்விடத்தை அறிமுகப்படுத்துவதில்லை.
