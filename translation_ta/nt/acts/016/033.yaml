  text: καὶ παραλαβὼν αὐτοὺς ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτὸς ἔλουσεν ἀπὸ τῶν πληγῶν, καὶ ἐβαπτίσθη αὐτὸς καὶ οἱ αὐτοῦ ⸀πάντες παραχρῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/033.yaml
  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: ta
  text: இரவின் அந்த நேரத்திலேயே[a] அவன் அவர்களைத் தன்னுடன் அழைத்துக்கொண்டு, அவர்களுடைய காயங்களைக் கழுவினான்[b]. உடனே அவனும் அவனுடைய வீட்டார் அனைவரும்[c] திருமுழுக்குப் பெற்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரவின் அந்த நேரத்தில்.’ இந்தச் சொற்றொடர், நேரம் வெகுவாகக் கடந்திருந்ததையும் அவன் உடனடியாகச் செயல்பட்டதையும் சுட்டிக்காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘காயங்களிலிருந்து [அவர்களைக்] கழுவினான்’; அதாவது, அவர்களுடைய காயங்களைச் சுத்தம் செய்தான்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவனுடைய குடும்பத்தினர் அனைவரும்.’ கிரேக்கச் சொற்றொடர் அணுக்கக் குடும்பத்தைவிட விரிவாக, அவனுடைய இல்லச் சூழலுக்குச் சேர்ந்தவர்களைக் குறிக்கலாம்.
    reason: alternative_reading
