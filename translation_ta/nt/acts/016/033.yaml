theological_decisions:
- issue: οἱ αὐτοῦ πάντες என்பதன் பரப்பும் திருமுழுக்குடனான தொடர்பும்
  choice: ‘அவனுடைய வீட்டார் அனைவரும்’ என்று மொழிபெயர்த்து, வயது, தனிப்பட்ட விசுவாச அறிக்கை அல்லது திருமுழுக்கு முறை ஆகியவற்றைக் குறிப்பிடாமல் விடுதல்
  alternative: ‘அவனுடைய குடும்பத்தினர் அனைவரும்’ அல்லது ‘அவனைச் சேர்ந்த அனைவரும்’
  rationale: இந்த வசனம் சிறைக்காவலனும் அவனுடைய இல்லச் சூழலுக்குச் சேர்ந்த அனைவரும் திருமுழுக்குப் பெற்றதாகச் சொல்கிறது. ஆனால் அவர்களுடைய வயதையோ திருமுழுக்கின் முறையையோ குறித்த பிற்காலச் சமயப்பிரிவு விவாதங்களை இது தனியாகத் தீர்ப்பதில்லை; ஆகவே கிரேக்க உரையின் வரம்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்கச் செயல் வரிசையும் ‘உடனே’ என்ற வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன. ‘வீட்டார்’ என்பது இல்லச் சூழலின் பரப்பைத் தக்கவைக்கிறது; திருமுழுக்கின் முறை அல்லது வீட்டாரின் வயது குறித்த சமயப்பிரிவு சார்ந்த முடிவு சேர்க்கப்படவில்லை.
