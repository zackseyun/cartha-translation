  text: καὶ ἐλάλησαν αὐτῷ τὸν λόγον τοῦ ⸀κυρίου ⸀σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: ta
  text: அவர்கள் அவனுக்கும் அவனுடைய வீட்டிலிருந்த அனைவருக்கும்[b][c] ஆண்டவருடைய வார்த்தையை[a] எடுத்துச் சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆண்டவரைப் பற்றிய செய்தியை.’ ‘ஆண்டவருடைய வார்த்தை’ என்ற கிரேக்கத் தொடர் ஆண்டவருக்குரிய, அவரிடமிருந்து வரும், அல்லது அவரைப் பற்றிய செய்தியைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘அவனுடைய வீட்டார் அனைவருக்கும்.’
    reason: lexical_alternative
  - marker: c
    text: மூலத்தின் அமைப்புக்கு இன்னும் நெருக்கமாக, ‘அவர்கள் அவனிடம், அவனுடைய வீட்டிலிருந்த அனைவருடனும் சேர்ந்து, ஆண்டவருடைய வார்த்தையை எடுத்துச் சொன்னார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλάλησαν
  choice: எடுத்துச் சொன்னார்கள்
  rationale: λαλέω இங்கு நற்செய்தியை நேரடியாக வாய்மொழியாகத் தெரிவித்ததைக் குறிக்கிறது. ‘எடுத்துச் சொன்னார்கள்’ என்பது தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘அறிவித்தார்கள்’ என்பது மூலத்தில் இல்லாத பொது பிரகடன நுணுக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: αὐτῷ
  choice: அவனுக்கு
  rationale: இது சிறைக்காவலனைக் குறிக்கும் ஒருமை வேற்றுமை வடிவம். λαλέω உடன் வருவதால் செய்தியைப் பெற்றவரைக் குறிக்கும் ‘அவனுக்கு’ என்பது இயல்பான தமிழ்.
- source_word: τὸν λόγον
  choice: வார்த்தையை
  rationale: λόγος இங்கு வாய்மொழியாகத் தெரிவிக்கப்பட்ட கிறிஸ்தவச் செய்தியைக் குறிக்கிறது. ‘வார்த்தை’ புதிய ஏற்பாட்டின் வழக்கமான சொல்லாட்சியையும் அடுத்துவரும் உடைமைத் தொடர்பின் திறந்த நுணுக்கத்தையும் காக்கிறது; ‘செய்தி’ என்பது இயல்பான மாற்று.
- source_word: τοῦ κυρίου
  choice: ஆண்டவருடைய
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்டவருடைய’ என்பது அந்த வார்த்தை ஆண்டவரிடமிருந்து வந்ததா, அவருக்குரியதா, அவரைப் பற்றியதா என்பதைத் தேவையின்றி ஒரே பொருளாகக் குறுக்காமல் கிரேக்க உடைமைத் தொடர்பைக் காக்கிறது.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: அவனுடைய வீட்டிலிருந்த அனைவருக்கும்
  rationale: σύν என்பதன் வடிவம் ‘உடன்/சேர்ந்து’ என்றாலும், சூழலில் வீட்டிலிருந்த அனைவரும் வார்த்தையைக் கேட்டவர்களாக உள்ளனர். தமிழில் இரண்டாவது பெறுநராக அமைப்பது தெளிவாகவும் இயல்பாகவும் உள்ளது; மூலத்தின் வடிவத்துக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: οἰκίᾳ
  choice: வீட்டிலிருந்த
  rationale: οἰκία வீடு என்ற கட்டிடத்தையோ வீட்டாரையோ குறிக்கலாம். ‘வீட்டிலிருந்த அனைவரும்’ என்பது அங்கு இருந்த நபர்களைக் குறிக்கும் கிரேக்கச் சொல்லாட்சியை நேரடியாகக் காக்கிறது; ‘வீட்டார் அனைவரும்’ என்பது சூழலுக்கேற்ற மாற்று.
theological_decisions:
- issue: ‘ஆண்டவருடைய வார்த்தை’ என்பதிலுள்ள உடைமைத் தொடர்பின் நுணுக்கம்
  choice: ‘ஆண்டவருடைய வார்த்தை’ என்று மொழிபெயர்த்து, அது ஆண்டவரிடமிருந்து வந்த செய்தியா அல்லது ஆண்டவரைப் பற்றிய செய்தியா என்பதைத் தீர்மானிக்காமல் விடப்பட்டுள்ளது.
  alternative: ‘ஆண்டவரைப் பற்றிய செய்தி’ அல்லது ‘ஆண்டவரிடமிருந்து வந்த செய்தி’
  rationale: τοῦ κυρίου என்ற கிரேக்க உடைமைத் தொடர் சூழலில் ஒன்றுக்கு மேற்பட்ட நெருங்கிய நுணுக்கங்களைத் தாங்கக்கூடும். மூலத்தின் இறையியல் திறந்த தன்மையைப் பாதுகாக்க முதன்மை உரை அவற்றில் ஒன்றை மட்டும் தேர்ந்தெடுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வார்த்தை’ என்ற புதிய ஏற்பாட்டு வழக்குச் சொல் காக்கப்பட்டாலும், ‘வார்த்தையைப் பேசினார்கள்’ என்ற செயற்கையான அமைப்பைத் தவிர்க்க ‘எடுத்துச் சொன்னார்கள்’ பயன்படுத்தப்பட்டுள்ளது. பெறுநர்கள் அனைவரும் தெளிவாகத் தெரியும்படி σύν தொடர் தமிழில் இணை மறைமுகச் செயப்படுபொருளாக அமைக்கப்பட்டுள்ளது; அதன் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
