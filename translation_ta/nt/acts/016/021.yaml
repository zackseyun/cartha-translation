source:
  edition: SBLGNT
  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: ta
  text: மேலும், “நாம் ரோமர்களாக இருப்பதால், ஏற்றுக்கொள்வதோ கடைப்பிடிப்பதோ நமக்குச் சட்டப்படி அனுமதிக்கப்படாத பழக்கவழக்கங்களை இவர்கள் அறிவிக்கிறார்கள்”[a] என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரோமர்களாகிய நாம்.” கிரேக்க மொழியிலுள்ள பங்கேற்பு வினைத் தொடர், இந்தப் பழக்கவழக்கங்களை மறுப்பதற்குக் குற்றஞ்சாட்டுவோர் கூறும் காரணத்தைத் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய வசனத்திலுள்ள குற்றச்சாட்டின் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: καταγγέλλουσιν
  choice: அறிவிக்கிறார்கள்
  rationale: பொதுவாக அறிவித்தல் அல்லது பிரசங்கித்தல் என்ற பொருளைத் தருகிறது; குற்றச்சாட்டுச் சூழலில் தேவையற்ற விளக்கம் சேர்க்காமல் நிகழ்காலச் செயலைக் காட்டுகிறது.
- source_word: ἔθη
  choice: பழக்கவழக்கங்கள்
  rationale: சமூகத்தில் நிலைபெற்ற வழக்கங்கள் அல்லது நடைமுறைகள் என்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: οὐκ ἔξεστιν
  choice: சட்டப்படி அனுமதிக்கப்படாத
  rationale: குற்றஞ்சாட்டுவோர் முன்வைக்கும் சட்டரீதியான தொனியைப் பாதுகாக்கிறது; அந்தக் கூற்று உண்மையான ரோமச் சட்டத்தைத் துல்லியமாக விவரிக்கிறது என்று மொழிபெயர்ப்பு உறுதிப்படுத்தவில்லை.
- source_word: παραδέχεσθαι
  choice: ஏற்றுக்கொள்வது
  rationale: இந்தப் பழக்கவழக்கங்களை ஏற்றுக்கொள்ளுதல் அல்லது தழுவிக்கொள்ளுதல் என்ற பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: οὐδὲ ποιεῖν
  choice: கடைப்பிடிப்பது
  rationale: பழக்கவழக்கங்களைச் செய்தல் அல்லது நடைமுறைப்படுத்துதல் என்பதைக் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: Ῥωμαίοις οὖσιν
  choice: நாம் ரோமர்களாக இருப்பதால்
  rationale: குற்றஞ்சாட்டுவோர் கூறும் தடைக்கான காரணத்தைத் தெளிவாக வெளிப்படுத்துகிறது; கிரேக்கப் பங்கேற்பு வினைத் தொடரின் காரண நிழலைக் காக்கிறது.
theological_decisions:
- issue: குற்றச்சாட்டில் கூறப்படும் தடையின் தன்மை
  choice: “சட்டப்படி அனுமதிக்கப்படாத” என்று சட்ட-குடிமைத் தொனியில் மொழிபெயர்த்தல்
  alternative: “நமக்குத் தகாத” அல்லது “நமக்கு அனுமதி இல்லாத”
  rationale: இது குற்றஞ்சாட்டுவோரின் கூற்று; லூக்கா அந்தச் சட்டக் கூற்றை உறுதிப்படுத்துகிறார் என்று காட்டாமல், அவர்கள் பயன்படுத்தும் சட்டரீதியான வடிவத்தை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: Ῥωμαίοις οὖσιν என்பதன் தொடர்பு
  choice: காரணப் பொருளில் “நாம் ரோமர்களாக இருப்பதால்”
  alternative: “ரோமர்களாகிய நாம்” அல்லது “ரோமர்களாய் இருந்து”
  rationale: சூழலில் ரோமக் குடிமை அந்தப் பழக்கவழக்கங்களை மறுப்பதற்கான காரணமாக முன்வைக்கப்படுகிறது; மாற்று வடிவங்களும் இலக்கணரீதியாகச் சாத்தியமானவை என்பதால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதே நேரத்தில் குற்றச்சாட்டின் முறையான சட்டத் தொனியைத் தக்கவைக்கும் நடை. மேற்கோள் குறிகள், இது விவரிப்பாளரின் தீர்ப்பு அல்லாமல் குற்றஞ்சாட்டுவோரின் பேச்சு என்பதைத் தெளிவாக்குகின்றன.
