source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: ta
  text: பரிசுத்த ஆவியால் ஆசியாவில்[a] வார்த்தையைப் பேசத் தடுக்கப்பட்ட அவர்கள், பிரிகியா மற்றும் கலாத்தியப் பகுதி[b] வழியாகச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆசியா’ என்பது இன்றைய ஆசியக் கண்டத்தைக் குறிக்காமல், ஆசியா மைனரின் மேற்குப் பகுதியில் இருந்த உரோம மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “பிரிகிய-கலாத்தியப் பகுதி.” கிரேக்கத் தொடரை ஒரே பிராந்தியத்தின் பெயராகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: பகுதி வழியாகச் சென்றார்கள்
  rationale: διέρχομαι என்பது ஒரு பகுதியினூடாகச் செல்வதைக் குறிக்கிறது; இயல்பான நவீன தமிழில் திசைசார் பொருளைத் தக்கவைக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சி இணைப்பு. தமிழ் வாக்கியத் தொடரில் தனிச் சொல் இல்லாமலேயே அந்தத் தொடர்ச்சி இயல்பாக வெளிப்படுகிறது.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: பிரிகியா மற்றும் கலாத்தியா பகுதி
  rationale: χώρα என்பதன் ‘பகுதி’ என்ற பொருளைத் தக்கவைத்து, கிரேக்கத் தொடரை இரு பகுதிகளாகவும் ஒரே பிராந்தியப் பெயராகவும் புரிந்துகொள்ளக்கூடிய தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: κωλυθέντες
  choice: தடுத்திருந்தார்
  rationale: κωλύω-வின் இறந்தகாலச் செயப்பாட்டு வினையெச்சம் முன்னதாக அல்லது அச்சமயத்தில் நிகழ்ந்த தடையைச் சுட்டுகிறது. தமிழ் வாக்கியத்தில் ஆவியானவரை இயல்பான எழுவாயாக மாற்றியும் தெய்வீகச் செயற்பாட்டைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: பரிசுத்த ஆவியானவர்
  rationale: ὑπό உடன் வரும் வேற்றுமை வடிவம் செயற்பாட்டாளரைச் சுட்டுகிறது. மரியாதை வினைமுற்றுடன் கூடிய இந்த வழக்கமான தமிழ் வடிவம் பரிசுத்த ஆவியின் தனிப்பட்ட செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: λαλῆσαι
  choice: பேசுவதற்கு
  rationale: λαλέω-வின் பொதுவான ‘பேசு’ என்ற பொருளைத் தக்கவைக்கிறது; ‘பிரசங்கிக்க’ என்று தேவையற்ற வகையில் குறுக்கவில்லை.
- source_word: τὸν λόγον
  choice: இறைவார்த்தையை
  rationale: லூக்கா–அப்போஸ்தலர் நடைகளில் λόγος நற்செய்திச் செய்தியைக் குறிக்கும் நிலையான பயன்பாடு. ‘இறைவார்த்தை’ என்பது தமிழில் இயல்பாகவும் உள்ளடக்கத்தை ‘நற்செய்தி’ என மிகத் துல்லியப்படுத்தாமலும் உள்ளது.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: ஆசியாவில்
  rationale: மூலத்தின் இடப்பெயரைத் தக்கவைக்கிறது; இது இன்றைய கண்டமல்ல, உரோம மாகாணம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: தடையில் பரிசுத்த ஆவியின் செயற்பாடு மற்றும் ஆள்தன்மை
  choice: பரிசுத்த ஆவியானவர் அவர்களைத் தடுத்திருந்தார்
  alternative: ஆவியால் அவர்கள் தடுக்கப்பட்டிருந்தார்கள்
  rationale: τοῦ ἁγίου πνεύματος என்ற தொடரும் ὑπό குறிக்கும் செயற்பாட்டாளரும் லூக்கா–அப்போஸ்தலர் சூழலில் பரிசுத்த ஆவியையே குறிக்கின்றன. செயப்பாட்டு அமைப்பை இயல்பான தமிழ் செய்வினையாக மாற்றுவது அந்தச் செயற்பாட்டை மறைக்காமல் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. இடப்பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; மூலத்தின் புவியியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
