id: ACT.16.10
reference: Acts 16:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: ta
  text: அவர் அந்தத் தரிசனத்தைக் கண்டதும், உடனே மக்கெதோனியாவுக்குப் புறப்பட முயன்றோம்; கடவுள் எங்களை அவர்களுக்கு நற்செய்தியை அறிவிக்க அழைத்திருக்கிறார் என்று முடிவுசெய்தோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ τὸ ὅραμα εἶδεν
  choice: அவர் அந்தத் தரிசனத்தைக் கண்டதும்
  rationale: ὡς δὲ என்பதன் தொடர்ச்சி மற்றும் காலத் தொடர்பையும், εἶδεν என்பதற்குப் பின் உடனடியாக நிகழ்ந்த செயல்வரிசையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: εὐθέως ἐζητήσαμεν
  choice: உடனே ... முயன்றோம்
  rationale: εὐθέως உடனடித் தன்மையைக் காட்டுகிறது; இச்சூழலில் ζητέω ஒரு செயலை மேற்கொள்ள முனைவதை அல்லது முயல்வதைக் குறிக்கிறது.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: மக்கெதோனியாவுக்குப் புறப்பட
  rationale: ἐξέρχομαι என்பதன் ‘வெளியேறு/புறப்படு’ என்ற இயக்கத்தையும் இலக்கையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: συμβιβάζοντες
  choice: முடிவுசெய்து
  rationale: தரிசனத்திலிருந்து குறிப்புகளை ஒன்றிணைத்து ஒரு தீர்மானத்திற்கு வருதல் என்ற பங்கேற்புவினையின் கருத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: προσκέκληται ἡμᾶς ὁ θεὸς
  choice: கடவுள் எங்களை அழைத்திருக்கிறார்
  rationale: Perfect வடிவின் நிறைவேறிய செயலும் அதன் தற்போதைய பொருத்தமும் ‘அழைத்திருக்கிறார்’ என்பதில் காக்கப்படுகின்றன; தெய்வீக முன்னெடுப்பும் தளர்த்தப்படவில்லை.
- source_word: εὐαγγελίσασθαι αὐτούς
  choice: அவர்களுக்கு நற்செய்தியை அறிவிக்கும்படி
  rationale: வினையின் பொருளை சமயத் தொழில்நுட்பச் சொல்லாக்கமின்றி, சாதாரண வாசகருக்குத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: முதலாம் நபர் பன்மையான ‘நாங்கள்’ என்ற உரையாடல் மாற்றம்
  choice: ‘முயன்றோம்’ என்று நேரடியாகத் தக்கவைத்தல்
  alternative: ஆசிரியர் குறித்த விளைவுகளைத் தவிர்க்க ஆளற்ற வாக்கியமாக மாற்றுதல்
  rationale: ἐζητήσαμεν என்பது முதலாம் நபர் பன்மையை வெளிப்படையாகக் கொண்டுள்ளது; ஆசிரியர் யார் என்ற கூடுதல் கோட்பாட்டைச் சேர்க்காமல் உரையின் அம்சத்தைப் பாதுகாக்கிறது.
- issue: προσκέκληται என்பதில் உள்ள தெய்வீக அழைப்பு
  choice: ‘கடவுள் எங்களை அழைத்திருக்கிறார்’
  alternative: ‘கடவுள் எங்களை வழிநடத்துகிறார்’ அல்லது ‘அழைப்பு விடுத்தார்’
  rationale: προσκαλέομαι அழைத்தல்/வரவழைத்தல் என்பதைக் குறிக்கிறது; ‘அழைத்திருக்கிறார்’ என்பது தெய்வீக முன்னெடுப்பையும் perfect வடிவின் நீடித்த பொருத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. ‘மக்கெதோனியா’ என்பது வழக்கமான தமிழ் வேதாகம இடப்பெயர் வடிவம். மூலத்தில் உண்மையான உரைவேறுபாடு அல்லது விளக்க வேண்டிய தெளிவின்மை இவ்வசனத்தில் இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
