base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: ta
  text: அவர்கள் நகரங்கள் வழியாகச் செல்லும்போது, எருசலேமிலிருந்த அப்போஸ்தலர்களும் மூப்பர்களும் முடிவுசெய்த தீர்மானங்களை அவர்கள் கடைப்பிடிக்கும்படி அவர்களிடம் ஒப்படைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆணைகளை.” கிரேக்கச் சொல் எருசலேம் கூட்டம் வெளியிட்ட அதிகாரபூர்வமான முடிவுகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύοντο
  choice: நகரங்கள் வழியாகச் சென்றபோது
  rationale: இறந்தகாலத் தொடர்நிலை வினை பல நகரங்கள் வழியாக அவர்கள் தொடர்ந்து பயணம் செய்ததைக் குறிக்கிறது; இத்தமிழாக்கம் அந்த நகர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παρεδίδοσαν
  choice: ஒப்படைத்தார்கள்
  rationale: அதிகாரபூர்வமாக நிர்ணயிக்கப்பட்டவற்றை மற்றவர்களிடம் கொண்டு சேர்த்து வழங்குதல் என்ற பொருளை இது காக்கிறது.
- source_word: αὐτοῖς
  choice: அங்கிருந்தவர்களிடம்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் இல்லாமல் பதிலிப்பெயர் மட்டுமே உள்ளது. தமிழில் சுட்டுப்பொருள் தெளிவாக இருக்க, நகரங்களில் இருந்தவர்களைக் குறிக்கும் பொதுவான சொல்லாக்கம் பயன்படுத்தப்பட்டது; ‘திருச்சபைகளிடம்’ அல்லது ‘விசுவாசிகளிடம்’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: φυλάσσειν
  choice: கடைப்பிடிக்கும்படி
  rationale: இங்கு φυλάσσω என்பது பாதுகாத்து வைப்பதை அல்ல, தீர்மானங்களுக்கு இணங்கி நடப்பதைக் குறிக்கிறது.
- source_word: δόγματα
  choice: தீர்மானங்கள்
  rationale: எருசலேமில் எடுக்கப்பட்ட அதிகாரபூர்வமான முடிவுகளைச் சுட்டுகிறது. ‘தீர்மானங்கள்’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருந்து, பிற்காலத் தொழில்நுட்ப இறையியல் பொருளைத் தேவையின்றி ஏற்றுவதில்லை.
- source_word: κεκριμένα
  choice: முடிவுசெய்திருந்த
  rationale: நிறைவுற்ற செயலின் தொடரும் விளைவை உணர்த்தும் perfect passive participle-ஐ, ஏற்கெனவே எடுக்கப்பட்டு நடைமுறையில் இருந்த முடிவாக வெளிப்படுத்துகிறது.
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: அப்போஸ்தலர்களும் மூப்பர்களும்
  rationale: அப்போஸ்தலர் மற்றும் அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்கள் என்னும் சூழல்சார் பொருளுக்கேற்ற நிலையான தமிழ் சொற்கள்.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: எருசலேமிலிருந்த
  rationale: அப்போஸ்தலர்களையும் மூப்பர்களையும் இடத்தால் அடையாளப்படுத்தும் கிரேக்க அமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: எருசலேம் கூட்டத்தின் தீர்மானங்களுக்கிருந்த அதிகாரம்
  choice: δόγματα என்பதற்கு ‘தீர்மானங்கள்’
  alternative: ‘ஆணைகள்’ அல்லது ‘கட்டளைகள்’
  rationale: இவை அப்போஸ்தலர்களும் மூப்பர்களும் அதிகாரபூர்வமாக எடுத்த முடிவுகள் என்பதை ‘தீர்மானங்கள்’ வெளிப்படுத்துகிறது; அதேவேளையில் பிற்காலச் சபைச் சட்டம் அல்லது தொழில்நுட்பக் ‘கோட்பாடு’ என்ற பொருளை உரைக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்புகள் காக்கப்பட்டுள்ளன; சுட்டுப்பெயரின் தெளிவுக்காக ‘அங்கிருந்தவர்கள்’ என்ற பொதுவான வடிவம் பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘தீர்மானங்கள்’ என்ற சொல்லோடு இணைக்கப்பட்டுள்ளது.
