revisions:
- from: அவர்கள் நகரங்கள் வழியாகச் சென்றபோது, எருசலேமிலிருந்த அப்போஸ்தலர்களும் மூப்பர்களும் முடிவுசெய்திருந்த தீர்மானங்களை[a]க் கடைப்பிடிக்கும்படி அவற்றை அங்கிருந்தவர்களிடம் ஒப்படைத்தார்கள்.
  to: அவர்கள் நகரங்கள் வழியாகச் செல்லும்போது, எருசலேமிலிருந்த அப்போஸ்தலர்களும் மூப்பர்களும் முடிவுசெய்த தீர்மானங்களை அவர்கள் கடைப்பிடிக்கும்படி அவர்களிடம் ஒப்படைத்தார்கள்.[a]
  rationale: The revision preserves the imperfect sense of ongoing travel, the formal transmission of already-decided rulings, and the purpose of observance. It replaces an unnecessary locative expansion of the Greek pronoun and improves Tamil syntax by directly linking ‘தீர்மானங்களை’ with ‘ஒப்படைத்தார்கள்.’
