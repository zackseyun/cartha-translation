source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: ta
  text: மேலும், அங்கிருந்து பிலிப்பிக்குச் சென்றோம். அது மக்கெதோனியாவின் ஒரு பகுதியின் முக்கிய நகரமும்[a] ரோமக் குடியேற்ற நகரமும்[b] ஆகும். அந்த நகரத்தில் நாங்கள் சில நாட்கள் தங்கியிருந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கெதோனியாவின் அந்தப் பகுதியின் முதல் நகரம்.” கிரேக்கச் சொற்றொடர் விளங்கிக்கொள்வதற்குக் கடினமானது; “முதல்” என்பது தரநிலை, முக்கியத்துவம், அல்லது வரிசையைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அதாவது, ரோம ஆட்சியின்கீழ் சிறப்புத் தகுதி வழங்கப்பட்ட ஒரு ரோமக் குடியேற்ற நகரம்.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν εἰς Φιλίππους
  choice: அங்கிருந்து பிலிப்பி நகருக்குச் சென்றோம்
  rationale: கிரேக்கத்தில் இயக்க வினைச்சொல் வெளிப்படையாக இல்லாமல் முந்தைய பயணத் தொடரிலிருந்து புரிந்துகொள்ளப்படுகிறது. இயல்பான தமிழுக்காக ‘சென்றோம்’ சேர்க்கப்பட்டுள்ளது; κἀκεῖθεν என்பதன் இணைப்பும் இடப்பொருளும் ‘அங்கிருந்து’ என்பதில் பாதுகாக்கப்படுகின்றன.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: மக்கெதோனியாவின் அந்தப் பகுதியிலுள்ள முதன்மையான நகரம்
  rationale: πρώτη என்பது வரிசை, தரநிலை அல்லது முக்கியத்துவத்தைக் குறிக்கக்கூடிய கடினமான சொல். ‘முதன்மையான’ என்பது முக்கியத்துவம் என்ற சாத்தியமான பொருளை இயல்பாகத் தருகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது. μερίς இங்கே பிராந்தியப் பகுதியைக் குறிக்கிறது.
- source_word: κολωνία
  choice: ரோமக் குடியேற்ற நகரம்
  rationale: இச்சொல் பிலிப்பிக்கு இருந்த அதிகாரப்பூர்வ ரோமக் காலனித் தகுதியைக் குறிக்கிறது. தமிழில் ‘குடியேற்றம்’ மட்டும் இடத்தைக் குறிக்கக்கூடும் என்பதால் ‘நகரம்’ சேர்க்கப்பட்டு, வரலாற்றுச் சுட்டு தெளிவாக ‘ரோமக்’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἦμεν ... διατρίβοντες
  choice: நாங்கள் ... தங்கியிருந்தோம்
  rationale: இந்த வினை அமைப்பு ஒரு காலப்பகுதி தொடர்ந்து அங்கே இருந்ததைக் காட்டுகிறது. ‘தங்கியிருந்தோம்’ அதன் நீடித்த இயல்பை இயற்கையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡμέρας τινάς
  choice: சில நாட்கள்
  rationale: கால அளவு துல்லியமாகக் கூறப்படவில்லை. ‘சில நாட்கள்’ அதே உறுதியின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பிலிப்பியை விவரிக்கும் πρώτη என்பதன் பொருள்
  choice: ‘முதன்மையான நகரம்’ என்று மொழிபெயர்த்து, ‘முதல் நகரம்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் தருதல்
  alternative: ‘மக்கெதோனியாவின் அந்தப் பகுதியிலுள்ள முதல் நகரம்’
  rationale: இது கோட்பாட்டுச் சிக்கல் அல்ல; வரலாற்று மற்றும் தொடரியல் ambiguity கொண்ட வாசகம். பிலிப்பிக்கு விவாதமற்ற நிர்வாக முதலிடம் இருந்ததாக மொழிபெயர்ப்பு தீர்மானித்துவிடாமல், முக்கியத்துவத்தின் பொருளை முதன்மை உரையில் கொண்டு மாற்றுப் பொருளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. பயணத் தொடரை இயல்பாக்க ‘சென்றோம்’ நிரப்பப்பட்டுள்ளது. இடப்பெயர் ‘பிலிப்பி’, பிராந்தியப்பெயர் ‘மக்கெதோனியா’ என ஒலிபெயர்க்கப்பட்டன. மூலத்தின் ‘நாங்கள்’ உரையாடல் நோக்கு வெளிப்படையாகப் பாதுகாக்கப்பட்டது; வரலாற்றுச் சொற்றொடரின் ambiguity அடிக்குறிப்பில் வைக்கப்பட்டது.
