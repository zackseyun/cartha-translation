  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: ta
  text: அவன் அப்படிப்பட்ட கட்டளையைப் பெற்றபின், அவர்களைச் சிறையின் உள் பகுதிக்குள்[a] தள்ளி, அவர்களுடைய கால்களை மரக் கால்விலங்கில்[b] உறுதியாக மாட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறையின் மிகவும் உட்புறமான பகுதிக்குள்.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “மரத்திற்குள்”; இச்சூழலில் இது கால்களைத் தடைசெய்யும் மரத்தாலான கருவியைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: இப்படிப்பட்ட கட்டளையை
  rationale: அதிகாரபூர்வமாக வழங்கப்பட்ட கட்டளை அல்லது உத்தரவை παραγγελία குறிக்கிறது. ‘கட்டளை’ என்பது இயல்பான, தெளிவான தமிழ்ச் சொல்; τοιαύτην என்பதன் தன்மையையும் ‘இப்படிப்பட்ட’ தக்கவைக்கிறது.
- source_word: λαβὼν
  choice: பெற்றுக்கொண்டு
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வடிவத்தின் தொடர்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἔβαλεν
  choice: தள்ளி
  rationale: βάλλω என்பதிலுள்ள வலுக்கட்டாயமான செயல் உணர்வைத் தக்கவைக்கிறது; வெறுமனே ‘வைத்தான்’ என்பதைக் காட்டிலும் சூழலின் கடுமையை வெளிப்படுத்துகிறது.
- source_word: ἐσωτέραν φυλακήν
  choice: சிறையின் உட்பகுதிக்குள்
  rationale: ἐσωτέραν என்பது ஒப்பீட்டு வடிவில் ‘மேலும் உள்ளே அமைந்த’ பகுதியைக் குறிக்கிறது. இது தனி அறையா அல்லது மிகவும் உட்புறமான சிறைப் பகுதியா என்பதை தேவையின்றி முடிவுசெய்யாமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: ἠσφαλίσατο
  choice: உறுதியாகப் பூட்டினான்
  rationale: ἀσφαλίζω என்பது அசையாதபடி உறுதிசெய்தல் அல்லது பாதுகாப்பாகக் கட்டுப்படுத்துதலைக் குறிக்கிறது. சிறைக் கட்டுப்பாட்டுக் கருவியின் சூழலில் ‘உறுதியாகப் பூட்டினான்’ இயல்பாக உள்ளது.
- source_word: τοὺς πόδας αὐτῶν
  choice: அவர்களுடைய கால்களை
  rationale: πούς என்பதன் நேரடியான பொருள் ‘கால்/பாதம்.’ கால்விலங்கில் பூட்டும் சூழலில் ‘கால்கள்’ என்பது இயல்பான தமிழ் வழக்கு.
- source_word: εἰς τὸ ξύλον
  choice: மரக் கால்விலங்கில்
  rationale: ξύλον என்பதன் அடிப்படைப் பொருள் ‘மரம்’ அல்லது ‘மரத்தாலான பொருள்.’ இச்சிறைச் சூழலில் கால்களைப் பூட்டும் மரச் சாதனத்தைக் குறிக்கிறது; ‘மரக் கால்விலங்கு’ பொருளையும் பொருளின் தன்மையையும் தெளிவாக அளிக்கிறது.
