translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அதிகாரப்பூர்வ செய்தியின் தன்மை பேணப்பட்டுள்ளது; ‘சமாதானத்துடன் செல்லுங்கள்’ என்ற சொற்றொடர் மூலத்தின் திறந்த நிழற்பொருள்களைத் தக்கவைக்கிறது. ஆங்கில ஆலோசனை உரையில் [b] குறி ‘இப்போது’ என்பதற்குப் பின் இருந்தாலும் அதன் குறிப்பு στρατηγοί பற்றியது என்பதால், தமிழில் அது ‘நகர அதிகாரிகள்’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
