source:
  edition: SBLGNT
  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: ta
  text: 'சிறைக்காவலன் இந்த வார்த்தைகளைப் பவுலிடம் தெரிவித்தான்: “நகர அதிகாரிகள்[b] உங்களை விடுதலை செய்யும்படி செய்தி அனுப்பியிருக்கிறார்கள்.[a] ஆகவே இப்போது வெளியே வந்து, சமாதானத்துடன் செல்லுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகர அதிகாரிகள் உங்களை விடுதலை செய்யும்படி அனுப்பியிருக்கிறார்கள்.” ‘அனுப்பியிருக்கிறார்கள்’ என்பதன் செயப்படுபொருள் கிரேக்கத்தில் வெளிப்படையாக இல்லை; பொருளைத் தெளிவாக்க முதன்மை உரையில் ‘செய்தி’ சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “நகர அதிகாரிகள்” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் பிலிப்பியின் குடிமை நிர்வாகத் தலைவர்களைக் குறிக்கிறது; தொழில்நுட்பமாக இவர்களை “பிரேட்டர்கள்” என்றும் அழைக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: தெரிவித்தான்
  rationale: ஒருவரிடமிருந்து வந்த தகவலை மற்றொருவரிடம் எடுத்துரைப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ὁ δεσμοφύλαξ
  choice: சிறைக்காவலன்
  rationale: இச்சூழலில் சிறையையும் கைதிகளையும் பொறுப்பாகக் காக்கும் நபரைத் துல்லியமாகக் குறிக்கிறது.
- source_word: τοὺς λόγους τούτους
  choice: இந்த வார்த்தைகளை
  rationale: கிரேக்கப் பன்மையைப் பேணுவதோடு, முன்பு கூறப்பட்ட செய்தியைக் குறிக்கும் இயல்பான தமிழாகவும் உள்ளது.
- source_word: Ἀπέσταλκαν
  choice: செய்தி அனுப்பியிருக்கிறார்கள்
  rationale: அனுப்பப்பட்ட பொருள் கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் அது விடுதலைக்கான செய்தி அல்லது ஆணை என்பதால், தமிழில் பொருள் தெளிவாக இருக்க ‘செய்தி’ சேர்க்கப்பட்டது. நிறைவுற்ற செயலின் தற்போதைய விளைவை வினைவடிவம் உணர்த்துகிறது.
- source_word: οἱ στρατηγοί
  choice: நகர அதிகாரிகள்
  rationale: பிலிப்பியின் குடிமை நிர்வாக அதிகாரிகளை எளிதில் புரியுமாறு குறிக்கிறது; தொழில்நுட்பமான ரோமப் பதவிப்பெயரை மூலவசனத்தில் திணிக்கவில்லை.
- source_word: ἵνα ἀπολυθῆτε
  choice: உங்களை விடுதலை செய்யும்படி
  rationale: காவலிலிருந்து விடுவிப்பதற்கான செய்தி அல்லது உத்தரவின் உள்ளடக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: νῦν οὖν
  choice: ஆகவே இப்போது
  rationale: οὖν என்பதன் முடிவுரைத்தன்மையையும் νῦν என்பதன் காலச் சுட்டையும் பேணுகிறது.
- source_word: ἐξελθόντες πορεύεσθε
  choice: வெளியே வந்து, ... செல்லுங்கள்
  rationale: முதலில் வெளியே வருதல், பின்னர் செல்லுதல் என்ற செயல் வரிசையை இயல்பான தமிழ் கட்டளையாகத் தருகிறது.
- source_word: ἐν εἰρήνῃ
  choice: சமாதானத்துடன்
  rationale: அமைதி, பாதுகாப்பு, நலன் ஆகிய நிழற்பொருள்களை உடைய கிரேக்கச் சொற்றொடரை அதிகமாக விளக்காமல் பேணுகிறது.
