  source_fidelity: 'மொத்தத்தில் மூலத்துக்கு நெருக்கமாக உள்ளது. ஆனால் «பொதுச் சந்தையிலிருந்த ஆட்சியாளர்களிடம்» என்பது கிரேக்கத்தின் இயக்கத்தைச் சற்றே மங்கலாக்குகிறது: பவுலையும் சீலாவையும் சந்தைக்குள் இழுத்துச் சென்று, அங்குள்ள/அங்குக் கூடியிருந்த அதிகாரிகள்முன் கொண்டுவந்தனர் என்பதே பொருள். «இழுத்துக்கொண்டு ... கொண்டுபோனார்கள்» என்பதும் εἵλκυσαν என்ற ஒரே வினையின் நேரடியான வலிமையை விடச் சேர்க்கைச் செயலை உருவாக்குகிறது.'
  naturalness: «தங்கள் வருவாய் நம்பிக்கை» இயல்பான நவீனத் தமிழ் இணைச்சொல் அல்ல; «தங்கள் வருவாய்க்கான நம்பிக்கை» அல்லது «தங்களுக்கு வருமானம் கிடைக்கும் என்ற நம்பிக்கை» தெளிவானது. பிந்தையது விளக்கமாக நீளுவதால், முன்னதையே தேர்ந்தெடுத்துள்ளேன். «சந்தைக்கு இழுத்துச் சென்று, அதிகாரிகள்முன் நிறுத்தினார்கள்» இயல்பாகவும் நிகழ்வின் வரிசையைத் தெளிவாகவும் கூறுகிறது.
  terminology: «எஜமானர்கள்» κύριοι என்பதற்கும் அடிமைப் பெண்ணைச் சூழ்ந்த சமூக-பொருளாதார உறவுக்கும் பொருத்தமானது. ἄρχοντες என்பதற்கு «ஆட்சியாளர்கள்» சரியான பொதுப் பதம்; அடுத்த வசனத்தின் குறிப்பிட்ட பதவியை முன்கூட்டியே ஏற்றவில்லை. ἐργασία இங்கு வேலை என்ற பொதுப் பொருளை அல்ல, வருமானம்/ஆதாயம் தரும் தொழிலைக் குறிக்கிறது; அடிக்குறிப்பு அதனைத் தெளிவாகக் காக்க வேண்டும்.
