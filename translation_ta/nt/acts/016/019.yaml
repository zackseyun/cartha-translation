  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: ta
  text: ஆனால், அவளுடைய எஜமானர்கள் தங்கள் வருவாய்க்கான நம்பிக்கை போய்விட்டதைக் கண்டபோது[a], பவுலையும் சீலாவையும் பிடித்து, சந்தைக்கு இழுத்துச் சென்று ஆட்சியாளர்கள்முன் நிறுத்தினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் ஆதாயத்திற்கான நம்பிக்கை.’ கிரேக்கச் சொற்றொடரின் நேர்ப்பொருள், ‘அவர்களுடைய சம்பாத்தியத்திற்கான நம்பிக்கை’ என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆட்சியாளர்கள்’ என்று மொழிபெயர்க்கப்பட்ட சொல் குடிமை அதிகாரிகளைக் குறிக்கும் பொதுவான சொல்; அடுத்த வசனத்தில் இன்னும் குறிப்பான ஒரு பதவிப் பெயர் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: அவளுடைய எஜமானர்கள்
  rationale: இச்சூழலில் κύριοι என்பது அந்த அடிமைப் பெண்ணின்மீது உரிமையும் கட்டுப்பாடும் செலுத்தியவர்களைக் குறிக்கிறது. ‘எஜமானர்கள்’ என்பது அந்தச் சமூக ஆதிக்கத்தையும் பொருளாதாரச் சுரண்டலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξῆλθεν
  choice: போய்விட்டது
  rationale: முடிவடைந்த இழப்பைக் காட்டுவதோடு, ‘வெளியேறியது/போனது’ என்ற கிரேக்கச் சொல்லின் உருவகத்தையும் இயல்பான தமிழில் ஓரளவு காக்கிறது.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: தங்கள் வருவாய் நம்பிக்கை
  rationale: ἐλπίς என்பதன் ‘நம்பிக்கை’ கூறையும், இங்கு ἐργασία குறிக்கும் சம்பாதிப்பு அல்லது வருவாய் கூறையும் சுருக்கமாகத் தக்கவைக்கிறது. அதாவது, அவள் மூலம் தொடர்ந்து வருமானம் கிடைக்கும் என்ற அவர்களுடைய எதிர்பார்ப்பு மறைந்தது.
- source_word: ἐπιλαβόμενοι
  choice: பிடித்து
  rationale: வலுக்கட்டாயமாகப் பற்றிக்கொண்ட hostile செயலைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: εἵλκυσαν
  choice: இழுத்துக்கொண்டு ... கொண்டுபோனார்கள்
  rationale: ἕλκω குறிக்கும் வலுக்கட்டாய இழுத்தலை வெளிப்படுத்துகிறது; தமிழில் இலக்கிடத்துக்கு அழைத்துச் சென்றதையும் இயல்பாக இணைக்கிறது.
- source_word: ἀγορὰν
  choice: பொதுச் சந்தை
  rationale: ἀγορά என்பது வாணிகம் மட்டுமல்லாமல் குடிமை மற்றும் நீதித்துறை நடவடிக்கைகளும் நடந்த பொது வெளியைக் குறிக்கலாம். ‘பொதுச் சந்தை’ இரு அம்சங்களையும் அணுகக்கூடிய வகையில் தருகிறது.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: ஆட்சியாளர்களிடம்
  rationale: ἄρχοντες என்பது பொதுவான குடிமை அதிகாரிகளைக் குறிக்கும். அடுத்த வசனத்தில் வரும் குறிப்பான அதிகாரப் பதவிப் பெயரை இங்கே முன்கூட்டியே இறக்குமதி செய்யாமல் இருக்கிறது.
