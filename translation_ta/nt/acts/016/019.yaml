translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் ‘நம்பிக்கை போய்விட்டது’ என்ற உருவகம் காக்கப்பட்டுள்ளது. ‘ஆட்சியாளர்கள்’ என்பது அடுத்த வசனத்தின் குறிப்பான பதவியுடன் வேறுபாட்டைப் பேணுகிறது; இரண்டு அடிக்குறிப்பு குறிப்பான்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
