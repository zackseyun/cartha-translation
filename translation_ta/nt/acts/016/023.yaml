source:
  edition: SBLGNT
  text: πολλάς ⸀τε ἐπιθέντες αὐτοῖς πληγὰς ἔβαλον εἰς φυλακήν, παραγγείλαντες τῷ δεσμοφύλακι ἀσφαλῶς τηρεῖν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: ta
  text: அவர்களுக்குப் பல அடிகளைக் கொடுத்தபின்[a], அவர்களைச் சிறையில் தள்ளி[b], அவர்கள் தப்பிச் செல்லாதபடி காவலில் வைக்கும்படி சிறைக்காவலனுக்குக் கட்டளையிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பல சவுக்கடிகள்’ அல்லது ‘பல தாக்குதல்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்கள் பல அடிகள் கொடுக்கப்பட்டதைக் கூறுகின்றன; இங்கு எதனால் அடித்தார்கள் என்பதைத் துல்லியமாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘சிறைச்சாலையில்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் பொதுவாகக் காவலில் அடைத்து வைக்கும் இடத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: பல அடிகள்
  rationale: πληγή என்பது அடி, சவுக்கடி அல்லது அடியால் ஏற்பட்ட காயம் ஆகியவற்றைக் குறிக்கலாம். இங்கு எந்தக் கருவியால் அடித்தார்கள் என்று குறிப்பிடப்படாததால், பொதுவான ‘பல அடிகள்’ என்பது மூலத்தின் பொருள் வரம்பைப் பாதுகாக்கிறது.
- source_word: τε
  choice: வாக்கியத் தொடர்ச்சியால் வெளிப்படுத்தப்பட்டது
  rationale: τέ முந்தைய நிகழ்வுடன் இதை இணைக்கிறது. தமிழில் தனியாக ‘மேலும்’ என்று சேர்ப்பதைவிட, ‘...பின்’ எனத் தொடரும் வாக்கிய அமைப்பு இயல்பாக அந்த இணைப்பை வெளிப்படுத்துகிறது.
- source_word: ἐπιθέντες
  choice: கொடுத்தபின்
  rationale: πληγάς என்பதுடன் சேர்ந்த இந்த வினைச்சொல் ‘அடிகளை ஏற்படுத்துதல்/கொடுத்தல்’ என்ற மரபுத்தொடர் பொருளைத் தருகிறது. இறந்தகால வினையெச்ச உறவை ‘கொடுத்தபின்’ இயல்பாகக் காட்டுகிறது.
- source_word: ἔβαλον εἰς φυλακήν
  choice: சிறையில் தள்ளி
  rationale: βάλλω என்பதிலுள்ள வலுக்கட்டாயமான இயக்கத்தை ‘தள்ளி’ தக்கவைக்கிறது; φυλακήν என்பது இச்சூழலில் அடைப்பிடமான சிறையைக் குறிக்கிறது.
- source_word: φυλακήν
  choice: சிறை
  rationale: φυλακή காவல், அடைப்பு அல்லது சிறை என்ற பொருள் வரம்புடையது. சிறைக்காவலன் பற்றிய உடனடியான சூழலில் ‘சிறை’ தெளிவான, இயல்பான சொல்.
- source_word: παραγγείλαντες
  choice: கட்டளையிட்டார்கள்
  rationale: அதிகாரப்பூர்வமான உத்தரவைக் குறிக்கும் παραγγέλλω என்பதன் வலிமையை ‘கட்டளையிட்டார்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δεσμοφύλακι
  choice: சிறைக்காவலனுக்கு
  rationale: கைதிகளைப் பொறுப்பாகக் காக்கும் அதிகாரியை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἀσφαλῶς
  choice: பாதுகாப்பாக
  rationale: இங்கு கைதிகள் தப்பிச் செல்ல முடியாதபடி உறுதியான காவலில் வைப்பதே கருத்து; ‘பாதுகாப்பாக’ என்பது τηρεῖν உடன் சேர்ந்து அந்தக் காவல் சார்ந்த பொருளை அளிக்கிறது.
- source_word: τηρεῖν
  choice: காவலில் வைக்கும்படி
  rationale: சிறைச்சூழலில் τηρέω என்பது காத்தல் அல்லது கண்காணித்து வைத்திருத்தலைக் குறிக்கிறது. ‘காவலில் வைக்க’ என்பது தமிழில் இயல்பாக அந்தப் பொருளைச் சொல்கிறது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: இது பவுலையும் சீலாவையும் குறிக்கிறது; சிறையில் தள்ளுதல் மற்றும் காவலில் வைத்தல் ஆகிய இரண்டுக்கும் அவர்களே செயப்படுபொருள்.
