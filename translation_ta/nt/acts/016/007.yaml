- from: ஆனால் அவர்கள் மூசியாவை அடுத்த பகுதிக்கு வந்தபோது[a], பித்தினியாவுக்குள் செல்ல முயன்றார்கள்; இயேசுவின் ஆவி அவர்களை அனுமதிக்கவில்லை.
  to: ஆனால் அவர்கள் மூசியாவை ஒட்டிய பகுதிக்கு வந்தபோது[a], பித்தினியாவுக்குள் செல்ல முயன்றார்கள்; இயேசுவின் ஆவி அவர்களை அனுமதிக்கவில்லை.
  rationale: கடினமாக ஒலிக்கும் “மூசியாவை அடுத்த பகுதிக்கு” என்பதற்குப் பதிலாக இயல்பான “மூசியாவை ஒட்டிய பகுதிக்கு” பயன்படுத்தப்பட்டுள்ளது. இது κατά-வின் புவியியல் நுணுக்கத்தையும், மூசியாவுக்குள் நுழைந்தனர் என்று உறுதிப்படுத்தாத மூலத்தின் தெளிவின்மையையும் காக்கிறது. மற்ற சொற்கள் மூலத்திற்கும் பொருத்தமான நவீன தமிழ் பயன்பாட்டிற்கும் ஏற்றவையாக உள்ளன.
