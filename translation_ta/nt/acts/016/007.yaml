source:
  edition: SBLGNT
  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: ta
  text: ஆனால் அவர்கள் மூசியாவை ஒட்டிய பகுதிக்கு வந்தபோது[a], பித்தினியாவுக்குள் செல்ல முயன்றார்கள்; இயேசுவின் ஆவி அவர்களை அனுமதிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மூசியாவுக்கு அருகே’ அல்லது ‘மூசியாவை ஒட்டி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர் அவர்கள் மூசியாவின் எல்லைப்பகுதியை அடைந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: வந்தபோது
  rationale: இறந்தகால வினையெச்சம் இச்சூழலில் காலத் தொடர்பைக் காட்டுகிறது; நிகழ்வுகளின் வரிசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய பயண விவரத்திலிருந்து அடுத்து ஏற்பட்ட தடைக்கான மென்மையான மாறுபாட்டைச் சுட்டுகிறது.
- source_word: κατὰ τὴν Μυσίαν
  choice: மூசியாவை அடுத்த பகுதிக்கு
  rationale: புவியியல் பயன்பாட்டில் κατά என்பது மூசியாவை ஒட்டிய அல்லது அதன் எல்லையை அண்மித்த பகுதியைச் சுட்டக்கூடும். மூசியாவுக்குள் நுழைந்ததாகத் தீர்மானித்துவிடாமல் அந்த நுணுக்கத்தை இத்தொடர் காக்கிறது.
- source_word: ἐπείραζον
  choice: செல்ல முயன்றார்கள்
  rationale: நிறைவுறாத இறந்தகால வடிவம் தொடர்ந்து மேற்கொள்ளப்பட்ட முயற்சியைக் காட்டுகிறது; தமிழ் வாக்கியம் முயற்சியையும் அதன் நிறைவேறாமையையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: பித்தினியாவுக்குள் செல்ல
  rationale: εἰς அப்பகுதியினுள் செல்லும் திசையையும், πορευθῆναι பயணம் செய்வதற்கான நோக்கத்தையும் காட்டுகின்றன.
- source_word: οὐκ εἴασεν
  choice: அனுமதிக்கவில்லை
  rationale: ἐάω என்பதன் அடிப்படைப் பொருளான அனுமதிக்காதிருத்தலைத் துல்லியமாகக் காட்டுகிறது; ‘தடைசெய்தார்’ என்பது மூலத்தைவிட வலுவாக இருக்கலாம்.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: இயேசுவின் ஆவி
  rationale: மூலத்தில் உள்ள தனித்துவமான ‘இயேசுவின் ஆவி’ என்ற கிறிஸ்துவியல் சொல்லாட்சியை ‘பரிசுத்த ஆவி’ என்று ஒத்திசைக்காமல் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: τὸ πνεῦμα Ἰησοῦ என்ற கிறிஸ்துவியல் தொடரை மொழிபெயர்த்தல்
  choice: இயேசுவின் ஆவி
  alternative: பரிசுத்த ஆவி / ஆவி
  rationale: கிரேக்க மூலத்தில் Ἰησοῦ (‘இயேசுவின்’) என்பது வெளிப்படையாக உள்ளது. ஆகவே, பரிச்சயமான வேறு சொல்லாட்சியோடு ஒத்திசைக்காமல் வசனத்தின் சொந்த இறையியல் நுணுக்கம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. இடப்பெயர்கள் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன. மூலத்தின் புவியியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
