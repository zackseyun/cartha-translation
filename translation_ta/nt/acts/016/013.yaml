source:
  edition: SBLGNT
  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: ta
  text: ஓய்வுநாளன்று நாங்கள் வாயிலுக்கு வெளியே ஆற்றங்கரைக்குச் சென்றோம். அங்கே இறைவேண்டுதலுக்கான ஓர் இடம் இருப்பதாகக் கருதினோம்[a]. பின்பு உட்கார்ந்து, அங்கே கூடியிருந்த பெண்களிடம் பேசிக்கொண்டிருந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே இறைவேண்டுதல் நடைபெறும் என்று கருதினோம்.” கிரேக்கச் சொல் இறைவேண்டுதலையே அல்லது இறைவேண்டுதலுக்கென ஒதுக்கப்பட்ட ஓர் இடத்தையோ குறிக்கலாம்; இங்குள்ள சூழல் ‘இறைவேண்டுதலுக்கான இடம்’ என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: ஓய்வுநாளன்று
  rationale: கொய்னே கிரேக்கத்தில் இந்தச் சொற்றொடர் ஓய்வுநாளைக் குறிக்கும் வழக்குச் சொல். அதன் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: நாங்கள் வாயிலுக்கு வெளியே ... சென்றோம்
  rationale: வெளிநோக்கிய நகர்வைத் தெளிவாகத் தருகிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘நகரம்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: παρὰ ποταμόν
  choice: ஆற்றங்கரைக்குச்
  rationale: ஆற்றின் அருகிலுள்ள இடத்தை நோக்கிச் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: அங்கே இறைவேண்டுதலுக்கான ஓர் இடம் இருப்பதாகக் கருதினோம்
  rationale: νομίζω என்பதற்கு ‘கருதினோம்’ என்றும், இச்சூழலில் προσευχή என்பதற்கு இறைவேண்டுதலுக்கென ஒதுக்கப்பட்ட இடம் என்றும் பொருள் கொடுக்கிறது; ‘தொழுகைக்கூடம்’ போன்ற நிறுவனப் பொருளைத் தேவையின்றி புகுத்தவில்லை.
- source_word: καὶ καθίσαντες
  choice: பின்பு உட்கார்ந்து
  rationale: உட்கார்ந்தது முதன்மை வினைக்கு முன் நிகழ்ந்ததை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐλαλοῦμεν
  choice: பேசிக்கொண்டிருந்தோம்
  rationale: முற்றுப்பெறாமல் தொடர்ந்த செயலைக் குறிக்கும் கிரேக்க இறந்தகால வினையின் கூறைத் தமிழில் காக்கிறது.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: அங்கே கூடியிருந்த பெண்களிடம்
  rationale: பெண்கள் ஏற்கெனவே அந்த இடத்தில் ஒன்றுகூடியிருந்ததை இயல்பாகத் தெரிவிக்கிறது; ‘அங்கே’ என்பது உடனுள்ள இடச்சூழலைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: இச்சூழலில் προσευχή என்பதன் பொருள்
  choice: இறைவேண்டுதலுக்கான ஓர் இடம்
  alternative: இறைவேண்டுதல்; தொழுகைக்கூடம்
  rationale: ஆற்றங்கரையில் மக்கள் கூடும் ஓர் இடத்தை விவரிக்கும் சூழலில், προσευχή என்பது இறைவேண்டுதலுக்கென அமைந்த இடத்தைக் குறிக்கக்கூடும். ‘தொழுகைக்கூடம்’ என்பது மூலச்சொல் நேரடியாகச் சொல்லாத நிறுவனப் பொருளைச் சேர்க்கும்; அதேவேளை ‘இறைவேண்டுதல்’ என்ற செயற்பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஜெபம்’ என்பதற்குப் பதிலாக சமயப் பிரிவுசார் சாயல் குறைந்த ‘இறைவேண்டுதல்’ பயன்படுத்தப்பட்டது; மூலத்தில் இல்லாத ‘நகரம்’ அல்லது ‘தொழுகைக்கூடம்’ சேர்க்கப்படவில்லை.
