source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: ta
  text: அதற்கு அவர்கள், “ஆண்டவராகிய இயேசுவின்மேல் நம்பிக்கை வை; நீயும் உன் வீட்டாரும் மீட்கப்படுவீர்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: அதற்கு அவர்கள் … என்றார்கள்
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல், சிறைக்காவலனின் கேள்விக்கான பதிலைத் தொடர்கிறது. இயல்பான தமிழ் உரையாடல் ஓட்டத்திற்காக ‘அதற்கு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Πίστευσον ἐπὶ
  choice: நம்பிக்கை வை
  rationale: πιστεύω உடன் ἐπί + வேற்றுமை உருபு நம்பிக்கை செலுத்தப்படும் நபரைச் சுட்டுகிறது. ‘நம்பிக்கை வை’ என்பது தீர்மானமான அழைப்பையும் நபர்மீதான சார்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν κύριον Ἰησοῦν
  choice: ஆண்டவராகிய இயேசு
  rationale: κύριος என்பதன் மரியாதை மற்றும் கிறிஸ்துவியல் வலிமையை ‘ஆண்டவர்’ காக்கிறது; ‘ஆகிய’ என்பது இயேசுவையே ஆண்டவர் என அடையாளப்படுத்தும் கிரேக்கச் சொற்றொடரைத் தெளிவாக இணைக்கிறது.
- source_word: σωθήσῃ
  choice: மீட்கப்படுவீர்கள்
  rationale: σῴζω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பிரதிபலிக்கிறது. இச்சூழலில் ‘மீட்கப்படுதல்’ ஆன்மீக இரட்சிப்பை மட்டும் குறுகலாக்காமல், சொல்லின் விரிந்த விடுதலைப் பொருளையும் தக்கவைக்கிறது.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: நீயும் உன் வீட்டாரும்
  rationale: οἶκος இங்கு கட்டிடத்தை அல்ல, ஒரே வீட்டைச் சேர்ந்த மக்களைக் குறிக்கிறது. ‘வீட்டார்’ என்பது இதற்கான இயல்பான, பொதுவாகப் புரியும் தமிழ் சொல்.
theological_decisions:
- issue: ‘நீயும் உன் வீட்டாரும்’ என்ற வாக்குறுதியின் வரம்பு
  choice: சிறைக்காவலனையும் அவன் வீட்டாரையும் நேரடியாக உள்ளடக்கும் வகையில் மொழிபெயர்த்து, அவனுடைய நம்பிக்கையால் மற்றவர்கள் தானாகவே மீட்கப்படுவார்கள் என்று சேர்க்காமல் விடுதல்
  alternative: சிறைக்காவலனின் நம்பிக்கையால் முழு வீட்டாரும் தனிப்பட்ட நம்பிக்கையின்றி மீட்கப்படுவார்கள் எனப் பொருள் கொள்ளுதல்; அல்லது வீட்டார் குறித்த உரையின் வரம்பைக் குறைத்தல்
  rationale: கிரேக்க உரை அவனையும் அவன் வீட்டாரையும் வாக்குறுதியில் குறிப்பிடுகிறது; ஆனால் ஒவ்வொருவரின் மீட்பு எவ்வாறு நிகழும் என்பதை இவ்வசனம் மட்டும் விளக்கவில்லை. ஆகவே இறையியல் விவாதத்தை மொழிபெயர்ப்பில் தீர்மானிக்காமல் உரையின் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ஒருமை கட்டளைக்கு ‘வை’ என்றும், ‘நீயும் உன் வீட்டாரும்’ என்ற கூட்டெழுவாய்க்கு மரியாதையற்ற பன்மை அல்லாத இயல்பான பொருத்தமாக ‘மீட்கப்படுவீர்கள்’ என்றும் பயன்படுத்தப்பட்டுள்ளது.
