review_pass:
  verdict: revise
  source_fidelity: The imperative ‘நம்பிக்கை வை’ accurately renders Πίστευσον, and ‘ஆண்டவராகிய இயேசுவின்மேல்’ suitably expresses the object of faith. ‘அப்போது’ has no counterpart in the Greek and adds a temporal/logical nuance. The future passive is appropriately represented by ‘மீட்கப்படுவீர்கள்.’
  naturalness: The draft is clear, dignified modern standard Tamil. The plural verb with the combined subject (‘நீயும் உன் வீட்டாரும்’) is natural. Removing ‘அப்போது’ makes the sentence more direct and closer to the source.
  terminology: ‘ஆண்டவர்’ appropriately renders κύριος in this Christological context. ‘வீட்டார்’ is an idiomatic rendering of οἶκος as a household rather than a building. ‘மீட்கப்படுவீர்கள்’ is a viable broad rendering of σωθήσῃ in context.
  issues:
  - severity: medium
    issue: ‘அப்போது’ is added to the translation.
    rationale: The Greek reads simply ‘and you will be saved’; it does not explicitly say ‘then.’ Tamil can express the result without this added temporal connective.
  - severity: medium
    issue: The footnote resolves a theological question not resolved by this verse alone.
    rationale: The statement denying automatic salvation apart from personal faith is an interpretive safeguard, rather than a cultural or lexical clarification. The verse should retain its stated household scope without the footnote deciding the debated mechanism.
  revised_text: அதற்கு அவர்கள், “ஆண்டவராகிய இயேசுவின்மேல் நம்பிக்கை வை; நீயும் உன் வீட்டாரும் மீட்கப்படுவீர்கள்” என்றார்கள்.
  revised_footnotes:
  - marker: a
    text: “உன் வீட்டார்” என்பது வீட்டுக் கட்டிடத்தை அல்ல, அவன் வீட்டைச் சேர்ந்த மக்களைக் குறிக்கிறது.
    reason: cultural_note
  revision_rationale: The revision removes the unsupported addition ‘அப்போது’ and limits the footnote to explaining the referent of ‘வீட்டார்.’ This preserves the Greek wording’s household scope and avoids resolving a theological issue that the verse itself does not explicitly settle.
