revisions:
- from: அதற்கு அவர்கள், “ஆண்டவராகிய இயேசுவின்மேல் நம்பிக்கை வை; அப்போது நீயும் உன் வீட்டாரும் மீட்கப்படுவீர்கள்[a]” என்றார்கள்.
  to: அதற்கு அவர்கள், “ஆண்டவராகிய இயேசுவின்மேல் நம்பிக்கை வை; நீயும் உன் வீட்டாரும் மீட்கப்படுவீர்கள்” என்றார்கள்.
  rationale: The revision removes the unsupported addition ‘அப்போது’ and limits the footnote to explaining the referent of ‘வீட்டார்.’ This preserves the Greek wording’s household scope and avoids resolving a theological issue that the verse itself does not explicitly settle.
  reviewer_model: gpt-5.6-terra
