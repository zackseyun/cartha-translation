source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: ta
  text: ஆனால் பவுல் அவர்களிடம், “ரோமக் குடிமக்களாகிய எங்களைக் குற்றவாளிகள் என்று தீர்ப்பளிக்காமலேயே[a] பொதுமக்கள் முன்னிலையில் அடித்து, சிறையில் தள்ளினார்கள். இப்போது எங்களை இரகசியமாக வெளியே அனுப்புகிறார்களா? இல்லை! மாறாக, அவர்களே நேரில் வந்து எங்களை வெளியே அழைத்துச் செல்லட்டும்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “குற்றவாளிகளென்று தீர்க்கப்படாத எங்களை” அல்லது சூழலின் பொருள்படி, “விசாரணையின்றி எங்களை.”'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “எங்களை வெளியே கொண்டுவரட்டும்” அல்லது “எங்களை வெளியே கூட்டிச் செல்லட்டும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δείραντες
  choice: அடித்து
  rationale: இறந்தகால வினையெச்சம் பிரதான செயலுக்கு முந்திய அடித்தலைக் குறிக்கிறது; கிரேக்கச் சொல் கட்டாயமாக ஒரு குறிப்பிட்ட வகை சாட்டையடியை மட்டும் குறிக்காததால் பொதுவான, வலிமையான சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: δημοσίᾳ
  choice: பொதுமக்கள் முன்னிலையில்
  rationale: செயல் மறைவின்றிப் பொதுவில் நடந்தது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀκατακρίτους
  choice: தீர்ப்பளிக்காமலேயே
  rationale: நீதிமன்றத் தீர்ப்பால் குற்றவாளிகளாக அறிவிக்கப்படாத நிலையைக் குறிக்கிறது; ‘விசாரணையின்றி’ என்பதைவிட மூலச்சொல்லின் கண்டனத் தீர்ப்பு சார்ந்த பொருளுக்கு நெருக்கமானது.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: ரோமக் குடிமக்களாகிய எங்களை
  rationale: சொல்லுக்குச் சொல் ‘ரோமர்களாக இருக்கும் மனிதர்களை’; இச்சூழலில் சட்டப் பாதுகாப்புடைய ரோமக் குடியுரிமையே வலியுறுத்தப்படுவதால் இவ்வாறு இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: சிறையில் தள்ளினார்கள்
  rationale: βάλλω என்பதிலுள்ள கடுமையை ‘வைத்தார்கள்’ என்பதைக் காட்டிலும் ‘தள்ளினார்கள்’ நன்றாகக் காக்கிறது.
- source_word: λάθρᾳ
  choice: இரகசியமாக
  rationale: மறைவாக அல்லது பிறருக்குத் தெரியாமல் செய்வதைக் குறிக்கும் நேரடியான நவீனத் தமிழ் இணை.
- source_word: ἐκβάλλουσιν
  choice: வெளியே அனுப்புகிறார்களா
  rationale: சிறையிலிருந்து மறைவாக அகற்ற முயல்வதைக் கேள்வி வடிவில் இயல்பாக வெளிப்படுத்துகிறது; நிகழ்காலத்தின் உடனடி வலிமையும் காக்கப்படுகிறது.
- source_word: οὐ γάρ
  choice: அது முடியாது!
  rationale: கூர்மையான, வலியுறுத்தப்பட்ட மறுப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐλθόντες αὐτοὶ
  choice: அவர்களே நேரில் வந்து
  rationale: αὐτοὶ தரும் ‘அவர்களே’ என்ற வலியுறுத்தலையும், அதிகாரிகள் தனிப்பட்ட முறையில் வரவேண்டும் என்ற கோரிக்கையையும் காக்கிறது.
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: எங்களை வெளியே அழைத்துச் செல்லட்டும்
  rationale: ἐξάγω என்பதன் ‘வெளியே நடத்திச் செல்லுதல்/கொண்டுவருதல்’ என்ற பொருளைக் காக்கும் இயல்பான தமிழ்; மரியாதையுடன் வழியனுப்புதல் என்பது மூலத்தில் வெளிப்படையாக இல்லாததால் பிரதான உரையில் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: பவுலின் ரோம நிலையின் சட்டக் குடியுரிமை சார்ந்த வலிமை
  choice: ‘ரோமக் குடிமக்களாகிய’ என்று மொழிபெயர்த்தல்
  alternative: ‘ரோமர்களாகிய’ அல்லது ‘ரோம மனிதர்களாகிய’
  rationale: இவ்வசனத்தின் வாதம் ரோமக் குடியுரிமையுடன் இணைந்த சட்டப் பாதுகாப்பைப் பற்றியது. ‘குடிமக்கள்’ என்பது சூழலில் உள்ள சட்டப் பொருளைத் தெளிவாக்குகிறது; எந்தப் பிரிவுசார் கருத்தையும் சேர்ப்பதில்லை.
- issue: ἀκατακρίτους என்பதன் சட்டப் பொருள்
  choice: பிரதான உரையில் ‘தீர்ப்பளிக்காமலேயே’
  alternative: ‘விசாரணையின்றி’ அல்லது ‘குற்றவாளிகளென்று தீர்க்கப்படாதவர்களாக’
  rationale: கிரேக்கச் சொல் நீதித்தீர்ப்பால் கண்டிக்கப்படாத நிலையைக் குறிக்கிறது. தமிழில் சுருக்கமாகவும் துல்லியமாகவும் இதைக் காக்க இத்தேர்வு செய்யப்பட்டது; நடைமுறை சார்ந்த ‘விசாரணையின்றி’ என்ற வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified narrative register பயன்படுத்தப்பட்டது. பவுலின் சட்டப்பூர்வ எதிர்ப்பின் கூர்மை காக்கப்பட்டுள்ளது. ‘இரகசியமாக’ மற்றும் ‘அவர்களே நேரில்’ ஆகியவை வெளிப்படை–மறைவு எதிர்மறையைத் தெளிவாக வைத்திருக்கின்றன. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
