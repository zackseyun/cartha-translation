id: ACT.16.26
reference: Acts 16:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄφνω δὲ σεισμὸς ἐγένετο μέγας ὥστε σαλευθῆναι τὰ θεμέλια τοῦ δεσμωτηρίου, ἠνεῴχθησαν ⸀δὲ παραχρῆμα αἱ θύραι πᾶσαι, καὶ πάντων τὰ δεσμὰ ἀνέθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: ta
  text: திடீரென்று பெரிய நிலநடுக்கம் ஏற்பட்டது. அதனால் சிறைச்சாலையின்[a] அஸ்திவாரங்கள் அசைந்தன. உடனே எல்லாக் கதவுகளும் திறக்கப்பட்டன; அனைவருடைய விலங்குகளும் கழன்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறைச்சாலை’ என்பதற்குப் பதிலாக ‘சிறைக்கூடம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அனைவருடைய கட்டுகளும் அவிழ்ந்தன’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்கள் δεσμά என்பது ‘விலங்குகள்’ அல்லது ‘கட்டுகள்’ என்றும், ἀνέθη என்பது ‘கழன்றன,’ ‘தளர்ந்தன’ அல்லது ‘அவிழ்ந்தன’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: திடீரென்று
  rationale: நிகழ்வு எதிர்பாராத விதமாகச் சட்டென ஏற்பட்டதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: பெரிய நிலநடுக்கம் ஏற்பட்டது
  rationale: γίνομαι உடன் வரும் பெயர்ச்சொல் அமைப்பை இயல்பான தமிழில் தருகிறது; μέγας என்பதைக் கூடுதலாக விளக்காமல் ‘பெரிய’ எனப் பாதுகாக்கிறது.
- source_word: ὥστε σαλευθῆναι
  choice: அதனால் ... அசைந்தன
  rationale: ὥστε குறிக்கும் விளைவைத் தெளிவாகக் காட்டுகிறது; σαλεύω என்பதன் அசைக்கப்படுதல் என்ற பொருளை இயல்பான தமிழ் வினையால் தருகிறது.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: சிறைச்சாலையின் அஸ்திவாரங்கள்
  rationale: θεμέλια என்பது கட்டிடத்தின் அடித்தளக் கூறுகளைக் குறிக்கிறது; ‘அஸ்திவாரங்கள்’ பொதுவாகப் புரியும் கட்டிடவியல் சொல்லாகும். δεσμωτήριον சிறை வைக்கும் இடத்தைக் குறிக்கிறது.
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: எல்லாக் கதவுகளும் திறக்கப்பட்டன
  rationale: கிரேக்கத்தின் இறப்பாட்டு வடிவத்தையும் ‘எல்லா’ என்ற முழுமையையும் பாதுகாக்கிறது.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: சற்றும் தாமதமின்றி நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πάντων
  choice: அனைவருடைய
  rationale: இது δεσμά உடன் உரிமைத் தொடர்பைக் காட்டும் பன்மை ஆறாம் வேற்றுமை வடிவம்; எல்லாக் கைதிகளையும் உள்ளடக்குகிறது.
- source_word: τὰ δεσμὰ
  choice: விலங்குகள்
  rationale: சிறைவாசிகளைப் பிணைத்த உடல்சார் கட்டுப்பாடுகளைக் குறிக்கும் தெளிவான தமிழ் சொல்; பொதுவான ‘கட்டுகள்’ என்பதும் சாத்தியம்.
- source_word: ἀνέθη
  choice: கழன்றன
  rationale: ἀνίημι இங்கு கட்டுப்பாடுகள் தளர்ந்து விடுபட்டதைக் குறிக்கிறது. ‘கழன்றன’ அவை பிடிப்பை இழந்த விளைவை இயல்பாகச் சொல்கிறது; கைதிகள் முற்றிலும் விடுதலை செய்யப்பட்டனர் என்று அளவுக்கு மீறிக் கூறுவதில்லை.
