translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் திடீர் நிகழ்வோட்டத்தைத் தக்கவைக்க குறுகிய வாக்கியங்கள் அமைக்கப்பட்டுள்ளன. ‘சிறைச்சாலை,’ ‘அஸ்திவாரங்கள்,’ ‘விலங்குகள்’ ஆகியவை பொதுவாகப் புரியும் முறையான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
