id: ACT.16.17
reference: Acts 16:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: ta
  text: அவள் பவுலையும் எங்களையும் தொடர்ந்து பின்தொடர்ந்து, “இந்த மனிதர்கள் உன்னதமான கடவுளின் அடிமைகள்; இவர்கள் உங்களுக்கு மீட்பின் வழியை[a] அறிவிக்கிறார்கள்” என்று உரக்கக் கூவிக்கொண்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘வழி’ என்பதற்கு முன் கட்டுரை இல்லை; சூழலின்படி இதை ‘மீட்புக்கான ஒரு வழி’ என்றோ ‘மீட்பின் வழி’ என்றோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: பின்தொடர்ந்துகொண்டே
  rationale: நிகழ்காலப் பெயரெச்சமும் இறந்தகாலத் தொடர்நிலை வினையும் நீடித்த செயலைக் காட்டுகின்றன; இந்தத் தமிழாக்கம் அவள் தொடர்ந்து பின்சென்றதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔκραζεν
  choice: உரக்கக் கூவிக்கொண்டிருந்தாள்
  rationale: வினைச்சொல் உரத்த குரலையும், இறந்தகாலத் தொடர்நிலை மீண்டும் மீண்டும் அல்லது தொடர்ந்து கூவியதையும் காட்டுகிறது.
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: இங்கு பவுலும் அவருடைய தோழர்களும் கடவுளுக்குச் சொந்தமானவர்கள் என்ற உறவு முன்னிலையில் இருப்பதால், 'ஊழியர்கள்' என்பதைவிட 'அடிமைகள்' மூலச்சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: உன்னதமான கடவுளின்
  rationale: ὕψιστος என்ற தெய்வீகப் பட்டத்தின் உயர்நிலையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: καταγγέλλουσιν
  choice: அறிவிக்கிறார்கள்
  rationale: பொதுவாக அறிவித்தல் அல்லது பிரகடனம் செய்தல் என்ற பொருளைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: அறிவிப்பைப் பெறும் மக்களைக் குறிக்கும் மறைமுகச் செயப்படுபொருளை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ὁδὸν σωτηρίας
  choice: மீட்பின் வழியை
  rationale: தமிழில் வேற்றுமை உருபுடன் இயல்பாக அமைந்து, கிரேக்கத்தில் கட்டுரை இல்லாததால் எழும் 'ஒரு வழி/அந்த வழி' என்ற தெளிவின்மையை எந்தச் சுட்டுச்சொல்லையும் சேர்க்காமல் காக்கிறது.
theological_decisions:
- issue: ὁδὸν σωτηρίας என்பதன் வரையறைத் தன்மை
  choice: மீட்பின் வழியை
  alternative: மீட்புக்கான ஒரு வழியை / மீட்பின் அந்த வழியை
  rationale: கிரேக்கத்தில் ὁδόν என்பதற்கு முன் கட்டுரை இல்லை. தமிழுக்கு ஆங்கிலத்தைப் போன்ற வரையறை/வரையறையின்மை கட்டுரைகள் இல்லாததால், 'மீட்பின் வழி' என்ற இயல்பான சொற்றொடர் மூலத்தின் சாத்தியமான இரு புரிதல்களையும் தீர்மானிக்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீன, மரியாதையான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடரும் செயல்களை ‘பின்தொடர்ந்துகொண்டே’ மற்றும் ‘கூவிக்கொண்டிருந்தாள்’ என்பவை வெளிப்படுத்துகின்றன; சமய மரபொன்றுக்கே உரிய சொற்களைச் சேர்க்காமல் மூலத்தின் இறையியல் பதற்றம் காக்கப்பட்டுள்ளது.
