source:
  edition: SBLGNT
  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: ta
  text: சிறைக்காவலன் விழித்தெழுந்து, சிறைக்கதவுகள் திறந்து கிடப்பதைக் கண்டு[a], கைதிகள் தப்பியோடிவிட்டார்கள் என்று எண்ணி, தன் வாளை உருவித் தன்னைக் கொல்லப் போவதாக இருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, ‘சிறைக்கதவுகள் திறக்கப்பட்டிருந்ததைக் கண்டு.’ கிரேக்க மொழியின் நிறைவுநிலைப் பங்கேற்பெயர், கதவுகள் திறக்கப்பட்ட பின்பு திறந்த நிலையில் இருந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘வாள்’ என்று மொழிபெயர்க்கப்பட்டுள்ள μάχαιρα, வாளையோ குத்துவாள் போன்ற குறுகிய கூராயுதத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: விழித்தெழுந்து
  rationale: விழிப்பு நிலைக்கு வந்ததைக் குறிக்கும் கிரேக்கச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δεσμοφύλαξ
  choice: சிறைக்காவலன்
  rationale: பொதுவான காவலன் என்பதைவிட, கைதிகளுக்குப் பொறுப்பான சிறை அதிகாரியைத் துல்லியமாகக் குறிக்கிறது.
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: சிறைக்கதவுகள் திறந்து கிடப்பதைக் கண்டு
  rationale: ἀνεῳγμένας என்ற நிறைவுநிலைப் பங்கேற்பெயர் கதவுகள் திறக்கப்பட்டதன் விளைவாகத் திறந்த நிலையில் இருந்ததை வலியுறுத்துகிறது; ‘திறந்து கிடப்பது’ தமிழில் அந்த நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: தன் வாளை உருவி
  rationale: ஆயுதத்தை உறையிலிருந்து வெளியே எடுத்த செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; μάχαιρα வாள் அல்லது குறுகிய வெட்டாயுதத்தைக் குறிக்கலாம்.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: தன்னைக் கொல்லப்போனான்
  rationale: நடக்கவிருந்த உடனடி செயலை ἤμελλεν குறிக்கிறது; தமிழில் இச்சொற்றொடர் அதன் அண்மையையும் நோக்கத்தையும் தெளிவாகத் தருகிறது.
- source_word: νομίζων
  choice: என்று எண்ணி
  rationale: திறந்த கதவுகளைக் கண்டதிலிருந்து காவலன் செய்த, ஆனால் உறுதியற்ற முடிவைத் தெரிவிக்கிறது.
- source_word: ἐκπεφευγέναι
  choice: தப்பியோடிவிட்டார்கள்
  rationale: நிறைவு வினையெச்சம் காவலன் எண்ணியபடி தப்புதல் ஏற்கெனவே முடிந்திருந்ததைக் குறிக்கிறது.
- source_word: τοὺς δεσμίους
  choice: கைதிகள்
  rationale: சிறையில் அடைக்கப்பட்டவர்களை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
