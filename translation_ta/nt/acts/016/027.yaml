translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘திறந்து கிடப்பது’ கதவுகளின் விளைவுநிலையை இயல்பாகக் காக்கிறது. கிரேக்க வாக்கியத்தின் காரணத் தொடர்பைத் தமிழில் தெளிவாக்க, கைதிகள் தப்பியதாக எண்ணிய பகுதி தற்கொலை முயற்சிக்கு முன் வைக்கப்பட்டுள்ளது; கருத்து வரிசை பாதுகாக்கப்பட்டுள்ளது.
