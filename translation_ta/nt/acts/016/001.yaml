source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: ta
  text: அவர் மேலும் தெர்பேக்கும் லிஸ்திராவுக்கும் வந்தார். இதோ, தீமோத்தேயு என்னும் சீடர் ஒருவர் அங்கே இருந்தார். அவர் விசுவாசியான ஒரு யூதப் பெண்ணின் மகன்[a]; ஆனால் அவருடைய தந்தை கிரேக்கர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையுள்ள ஒரு யூதப் பெண்ணின் மகன்.” கிரேக்கச் சொல் “விசுவாசியான” அல்லது “உண்மையுள்ள” என இருவிதமாகப் பொருள்படலாம்; இங்கே “விசுவாசியான” என்பதே அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν δὲ καὶ
  choice: அவர் ... வந்தார்
  rationale: καταντάω ஓர் இடத்தை வந்தடைவதைக் குறிக்கிறது. δὲ καὶ முந்தைய பயணக் கதையின் தொடர்ச்சியையும் சேர்க்கையையும் காட்டுகிறது; தமிழில் இயல்பான தொடர்ச்சிக்காக தனியே ‘மேலும்’ சேர்க்காமல் வினைச்சொல் வழியாகத் தரப்பட்டுள்ளது.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: தெர்பைக்கும் லிஸ்திராவுக்கும்
  rationale: இரு இடப்பெயர்களுடனும் மீண்டும் வரும் εἰς என்பதன் இலக்கைத் தமிழ் ‘-க்கும் ... -க்கும்’ அமைப்பு இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: καὶ ἰδοὺ
  choice: இதோ
  rationale: ἰδού அடுத்ததாக அறிமுகப்படுத்தப்படுகிற நபரிடம் வாசகரின் கவனத்தை ஈர்க்கும் குறியீடு; ‘இதோ’ அதன் கதைநடைச் செறிவைக் காக்கிறது.
- source_word: μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος
  choice: தீமோத்தேயு என்னும் சீடர் ஒருவர் அங்கே இருந்தார்
  rationale: τις என்பது குறிப்பிட்ட ஆனால் புதிதாக அறிமுகமாகும் ஒருவரைக் குறிக்கிறது; ‘ஒருவர்’ இயல்பான தமிழாக்கம். ἐκεῖ ‘அங்கே’ என்றும், ὀνόματι ‘என்னும்’ என்றும் தரப்பட்டுள்ளன.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: விசுவாசியான ஒரு யூதப் பெண்ணின் மகன்
  rationale: இங்கு πιστή என்பது அப்பெண் விசுவாசி என்பதைக் குறிப்பதே அப்போஸ்தலர் நடபடிகளில் உள்ள பயன்பாட்டுக்கு மிகப் பொருத்தம். பெயரடைத் தொடரின் உறவு தமிழில் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: ஆனால் அவருடைய தந்தை கிரேக்கர்
  rationale: கிரேக்கத்தில் இது ‘மகன்’ என்பதுடன் தொடர்புடைய சுருக்கமான வேற்றுமைத் தொடர். தமிழில் குழப்பமின்றி இயல்பாக இருக்க முழு வாக்கியமாகத் தரப்பட்டுள்ளது; δέ காட்டும் முரண் ‘ஆனால்’ என்பதால் வெளிப்படுகிறது.
theological_decisions:
- issue: தீமோத்தேயுவின் தாயை விவரிக்கும் πιστῆς என்பதன் பொருள்
  choice: விசுவாசியான
  alternative: உண்மையுள்ள / நம்பிக்கைக்குரிய
  rationale: அப்போஸ்தலர் நடபடிகளின் சூழலில் πιστός பொதுவாக விசுவாசி ஒருவரைக் குறிக்கிறது. இருப்பினும் ‘உண்மையுள்ள’ என்ற பண்புப் பொருளும் சொல்லியல் அடிப்படையில் சாத்தியமுள்ளதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சீடர்’, ‘விசுவாசியான’ ஆகியவை கிறிஸ்தவச் சூழலில் பரவலாக அறியப்பட்ட சொற்கள். இடப்பெயர்கள் தெர்பை, லிஸ்திரா என்றும், Τιμόθεος தீமோத்தேயு என்றும் ஒலிபெயர்க்கப்பட்டுள்ளன.
