source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: ta
  text: ஒருநாள், நாங்கள் ஜெபத்திற்கான இடத்துக்குப் போய்க்கொண்டிருந்தபோது, பைத்தோன் ஆவியைக் கொண்ட ஓர் அடிமைப் பெண் எங்களைச் சந்தித்தாள்.[a] அவள் குறிசொல்வதன் மூலம் தன் எஜமான்களுக்கு மிகுந்த வருமானம் ஈட்டிக் கொடுத்துவந்தாள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறுவகையில், “குறிசொல்லும் ஆவியைக் கொண்ட ஓர் அடிமைப் பெண்.” கிரேக்கத்தில் “பைத்தோன் ஆவி” என்று உள்ளது; இது குறிசொல்லுதலோடு தொடர்புடைய ஒரு பண்பாட்டுச் சிறப்புச் சொல்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “குறிபார்த்துச் சொல்வதன் மூலம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: …போது
  rationale: லூக்காவின் நிகழ்வை அறிமுகப்படுத்தும் தொடரைத் தமிழில் தேவையற்ற சொற்பிரதியின்றி இயல்பான காலப் பின்னணியாக வெளிப்படுத்துகிறது.
- source_word: πορευομένων ἡμῶν
  choice: நாங்கள் … போய்க்கொண்டிருந்தபோது
  rationale: ஒரே நேரத்தில் தொடர்ந்த பின்னணிச் செயலைக் குறிக்கும் genitive absolute அமைப்பின் நீடித்த தன்மையைப் பாதுகாக்கிறது.
- source_word: εἰς τὴν προσευχὴν
  choice: ஜெப இடத்துக்கு
  rationale: இது ஜெபிக்கும் செயலையே அல்லாமல், ஜெபத்திற்காக அறியப்பட்ட கூடுமிடத்தைக் குறிக்கும் வாய்ப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παιδίσκην τινά
  choice: ஓர் அடிமைப் பெண்
  rationale: அவளுக்குப் பல எஜமான்கள் இருந்ததும் அவர்கள் அவளால் வருமானம் பெற்றதும் அடிமை நிலையைக் காட்டுவதால், பணிப்பெண் என்பதைக் காட்டிலும் அடிமைப் பெண் துல்லியமானது.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: குறிசொல்லும் பைத்தோன் ஆவியைக் கொண்ட
  rationale: πύθων என்ற பண்பாட்டுச் சிறப்புடைய சொல்லைப் ‘பைத்தோன்’ எனப் பாதுகாத்து, தமிழ்வாசகருக்குப் புரிய அதன் குறிசொல்லும் தொடர்பையும் சுருக்கமாகக் காட்டுகிறது; முழுமையாக ‘குறிசொல்லும் ஆவி’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: எங்களை எதிர்கொண்டாள்
  rationale: நேருக்கு வந்த சந்திப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: மிகுந்த வருமானம் ஈட்டிக்கொடுத்துவந்தாள்
  rationale: பொருளாதார ஆதாயத்தையும் imperfect வினையின் தொடர்ச்சியையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: தன் எஜமான்களுக்கு
  rationale: இங்கு κύριοι தெய்வீகப் பட்டமல்ல; அவள்மீது உரிமையும் கட்டுப்பாடும் செலுத்தியவர்களைக் குறிக்கிறது.
- source_word: μαντευομένη
  choice: குறிசொல்வதன் மூலம்
  rationale: மறைஞான முறையில் முன்னறிவித்தல் அல்லது கணித்தல் என்ற பொருளை ordinary modern Tamil-ல் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: πνεῦμα πύθωνα என்ற பண்பாட்டுச் சுமையுள்ள சொற்றொடரை எவ்வாறு மொழிபெயர்ப்பது
  choice: குறிசொல்லும் பைத்தோன் ஆவி
  alternative: குறிசொல்லும் ஆவி
  rationale: மூலத்தின் ‘பைத்தோன்’ குறிப்பை அழிக்காமல் வைத்திருப்பதோடு, அது குறிசொல்லுதலோடு தொடர்புடையது என்பதையும் வாசகருக்கு விளங்கச் செய்கிறது. குறிப்பிட்ட ஆவியின் இயல்பை மூலத்தைவிட மேலதிகமாக வரையறுக்கவில்லை.
- issue: παιδίσκη என்பதில் அடிமை நிலையை வெளிப்படையாகக் காட்ட வேண்டுமா
  choice: அடிமைப் பெண்
  alternative: பணிப்பெண்
  rationale: எஜமான்கள் அவளது செயலால் வருமானம் பெற்றதாக அடுத்த பகுதி கூறுவதால், சுரண்டலுடனான அடிமை நிலை இச்சூழலில் முக்கியமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. ‘அடிமைப் பெண்’ சமூக நிலையைக் தெளிவாக்குகிறது. ‘பைத்தோன்’ என்ற மூலப் பண்பாட்டுச் சொல்லை அடிக்குறிப்புடன் பாதுகாத்து, பிரதான உரையில் அதன் குறிசொல்லும் தொடர்பை வாசகருக்குத் தெளிவாக்கப்பட்டுள்ளது.
