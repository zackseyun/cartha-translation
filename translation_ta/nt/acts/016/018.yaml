  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: ta
  text: 'அவள் இப்படியே பல நாட்களாகச் செய்துகொண்டிருந்தாள். ஆனால் பவுல் மிகவும் மனக்கலக்கம் அடைந்து, திரும்பி அந்த ஆவியிடம், “இயேசுவாகிய மேசியாவின் பெயரில் உனக்குக் கட்டளையிடுகிறேன்: இவளைவிட்டு வெளியே போ” என்றார். அதே நேரத்தில் அது அவளைவிட்டு வெளியேறியது.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: பல நாட்களாகச் செய்துகொண்டிருந்தாள்
  rationale: இறந்தகாலத்தில் தொடர்ந்து அல்லது திரும்பத் திரும்ப நடந்த செயலை ἐποίει குறிக்கிறது; ‘செய்துகொண்டிருந்தாள்’ என்பது அந்தத் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διαπονηθεὶς
  choice: மிகவும் மனவேதனை அடைந்து
  rationale: இந்த வினையெச்சம் வெறும் எரிச்சலைவிட ஆழமான மனக்கலக்கத்தையோ வேதனையையோ குறிக்கிறது; தமிழில் தேவையற்ற கோபநிழலைச் சேர்க்காமல் அதன் தீவிரத்தை இச்சொற்றொடர் தருகிறது.
- source_word: ἐπιστρέψας
  choice: திரும்பி
  rationale: பேசுவதற்கு முன்பு பவுல் உடலளவில் திரும்பிய செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τῷ πνεύματι
  choice: அந்த ஆவியிடம்
  rationale: கிரேக்கம் ‘ஆவியிடம்’ என்று மட்டுமே கூறுகிறது. தமிழ் உரையில் குறிப்பிட்ட சுட்டுப்பெயர் சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட ஆவியைக் காட்டுகிறது; ‘தீய’ அல்லது ‘பேய்’ என்று மூலத்தில் இல்லாத அடைமொழி சேர்க்கப்படவில்லை.
- source_word: Παραγγέλλω σοι
  choice: கட்டளையிடுகிறேன்
  rationale: ஆவியிடம் அதிகாரத்தோடு கூறப்படும் கட்டளையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ‘உனக்குக் கட்டளையிடுகிறேன்’ என்பதில் உள்ள பெறுபொருள் அடுத்த கட்டளையால் தமிழில் தெளிவாக இருப்பதால் விடப்பட்டுள்ளது.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின் பெயரில்
  rationale: Χριστός இங்கு இயேசுவின் அபிஷேகம் பெற்ற அரசர் என்ற பட்டத்தின் பொருளைத் தாங்குகிறது; ‘மெசியா’ அந்தப் பட்டத்தைப் பாதுகாக்கிறது. ‘பெயரில்’ என்பது அவருடைய அதிகாரத்தின் அடிப்படையில் சொல்லப்படுவதை இயல்பாகக் குறிக்கிறது.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: இவளைவிட்டு வெளியே போ
  rationale: ஆவியை நோக்கி நேரடியாகக் கூறப்படும் வெளியேற்றக் கட்டளைக்கு நவீனத் தமிழில் இயல்பான வடிவம்; ἀπό குறிக்கும் பிரிவை ‘இவளைவிட்டு’ தெளிவுபடுத்துகிறது.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: அதே நேரத்தில் அது வெளியேறியது
  rationale: αὐτῇ τῇ ὥρᾳ என்பது அந்தச் சமயத்திலேயே, உடனடியாக நிகழ்ந்ததை வலியுறுத்துகிறது. ‘அதே நேரத்தில்’ அந்த வலியுறுத்தலைச் சொற்சிக்கனமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐν ὀνόματι Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-ஐ எவ்வாறு மொழிபெயர்ப்பது
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός இங்கு வெறும் நிலையான பெயராக இல்லாமல் இயேசுவின் பட்டத்தையும் அதிகாரத்தையும் தாங்குகிறது. ‘மெசியா’ என்பது பட்டத்தின் பொருளைப் பாதுகாக்கிறது; தமிழ் உடைமை அமைப்பில் ‘இயேசு மெசியாவின் பெயரில்’ என்று இயல்பாக வடிவமைக்கப்பட்டுள்ளது.
- issue: ஆவியை முதன்மை உரையில் தீய ஆவி அல்லது பேய் என்று குறிப்பிட வேண்டுமா
  choice: அந்த ஆவி
  alternative: தீய ஆவி / பேய்
  rationale: இந்த வசனம் πνεῦμα என்று மட்டுமே கூறுகிறது. முந்தைய சூழல் அதன் தன்மையை விளக்கினாலும், இவ்வசனத்தின் சொற்களை மீறி அடைமொழி சேர்க்காமல் மூலத்தின் அளவான குறிப்பைத் தக்கவைத்துள்ளது.
- issue: διαπονηθεὶς குறிக்கும் பவுலின் உணர்ச்சி
  choice: மிகவும் மனவேதனை அடைந்து
  alternative: மிகவும் எரிச்சலடைந்து
  rationale: சொல் கடுமையான மனக்கலக்கம், தொந்தரவு அல்லது வேதனையை அனுமதிக்கிறது. குறிப்பாக கோபம் அல்லது எரிச்சல் என்று மட்டும் தீர்மானிக்காமல் அதன் பரந்த உணர்ச்சிநிலையைப் பாதுகாக்க ‘மனவேதனை’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. தொடர்ச்சிச் செயல், பவுலின் ஆழமான மனக்கலக்கம், ஆவியைப் பற்றிய மூலத்தின் குறிப்பளவு, கட்டளையின் அதிகாரத் தன்மை ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்புகள் தேவையில்லை; ஆகவே முதன்மை உரையில் அடிக்குறி குறியீடுகள் இல்லை.
