source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: ta
  text: தியத்தீரா நகரத்தைச் சேர்ந்த, ஊதா நிறத் துணி விற்பவளும் தேவனை வழிபட்டு வந்தவளுமான லீதியா என்ற ஒரு பெண் கேட்டுக்கொண்டிருந்தாள்[a]. பவுல் பேசிக்கொண்டிருந்தவற்றில் கவனம் செலுத்தும்படி ஆண்டவர் அவளுடைய இதயத்தைத் திறந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேவனை வழிபடுபவள்.’ இந்தச் சொற்றொடர் இஸ்ரவேலின் தேவனை வழிபட்ட யூதரல்லாத ஒருவரைக் குறிக்கலாம்.
    reason: σεβομένη τὸν θεόν என்பதன் மாற்று மொழிபெயர்ப்பையும், அது சில சூழல்களில் யூதராக மாறாத இஸ்ரவேலின் தேவன் பக்தரைக் குறிக்கக்கூடிய சாத்தியத்தையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: καί τις γυνὴ ὀνόματι Λυδία
  choice: லீதியா என்ற ஒரு பெண்
  rationale: τις என்பதன் வரையறுக்கப்படாத அறிமுகத் தன்மையைத் தமிழில் இயல்பாக ‘ஒரு பெண்’ எனத் தருகிறது; ὀνόματι என்ற அமைப்பு ‘என்ற’ என்பதால் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுகிறது.
- source_word: πορφυρόπωλις
  choice: ஊதா நிறத் துணி விற்பவள்
  rationale: ஊதா நிறச் சாயம் ஏற்றப்பட்ட துணி அல்லது அத்தகைய பொருட்களை விற்பவரைக் குறிக்கும் சொல்லை, பொருளை அளவுக்கு மீறிக் குறிப்பாக்காமல் பொதுவாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: πόλεως Θυατείρων
  choice: தியத்தீரா நகரத்தைச் சேர்ந்த
  rationale: லீதியாவின் ஊர்ச் சார்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σεβομένη τὸν θεόν
  choice: தேவனை வழிபட்டு வந்தவள்
  rationale: அவள் இஸ்ரவேலின் தேவனை மதித்து வழிபட்டதைத் தெரிவிக்கிறது. தொடர்ச்சியான நிலையை ‘வந்தவள்’ உணர்த்துகிறது; ‘தேவபயமுள்ளவள்’ என்ற தொழில்நுட்பப் பெயரை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: ἤκουεν
  choice: கேட்டுக்கொண்டிருந்தாள்
  rationale: இறந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் கிரேக்க முற்றாநிலை வினை உணர்த்துவதால், தமிழ் தொடர்நிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: அவளுடைய உள்ளத்தைத் திறந்தார்
  rationale: உள்ளார்ந்த ஏற்றுக்கொள்ளும் திறனை ஏற்படுத்தியதைச் சொல்லும் கிரேக்க உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: προσέχειν
  choice: கவனிக்கும்படி
  rationale: ‘பதிலளிக்கும்படி’ என விளைவைக் கூடுதலாகச் சேர்க்காமல், மனத்தைச் செலுத்துதல் என்ற அடிப்படைப் பொருளைத் தருகிறது.
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: பவுல் பேசிக்கொண்டிருந்தவற்றை
  rationale: பவுலால் சொல்லப்பட்டுக்கொண்டிருந்த செய்தியை இயல்பான செயப்பாட்டு வாக்கியமாக மாற்றி, தொடர்நிலை நுணுக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: ὁ κύριος என்பதன் குறிப்பு
  choice: ஆண்டவர்
  alternative: ஆண்டவராகிய இயேசு; தேவன்
  rationale: கிரேக்க உரை ‘ஆண்டவர்’ என்று மட்டுமே கூறுகிறது. அது இயேசுவையா தேவனையா குறிப்பதாக இவ்வசனத்திலேயே வெளிப்படையாகத் தீர்மானிக்கப்படாததால், அந்தத் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பான ஆனால் மதிப்புமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் நீளத்தை அப்படியே பின்பற்றாமல் மூன்று தொடர்புடைய வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டுள்ளது; கருத்துத் தொடர்பும் தொடர்நிலை நுணுக்கங்களும் காக்கப்பட்டுள்ளன.
