revisions:
- from: தியத்தீரா நகரத்தைச் சேர்ந்த லீதியா என்ற ஒரு பெண் கேட்டுக்கொண்டிருந்தாள். அவள் ஊதா நிறத் துணி விற்பவள்; தேவனை வழிபட்டு வந்தவள்[a]. பவுல் பேசிக்கொண்டிருந்தவற்றைக் கவனிக்கும்படி ஆண்டவர் அவளுடைய உள்ளத்தைத் திறந்தார்.
  to: தியத்தீரா நகரத்தைச் சேர்ந்த, ஊதா நிறத் துணி விற்பவளும் தேவனை வழிபட்டு வந்தவளுமான லீதியா என்ற ஒரு பெண் கேட்டுக்கொண்டிருந்தாள்[a]. பவுல் பேசிக்கொண்டிருந்தவற்றில் கவனம் செலுத்தும்படி ஆண்டவர் அவளுடைய இதயத்தைத் திறந்தார்.
  rationale: திருத்தம் பொருளை மாற்றவில்லை. லீதியாவைப் பற்றிய கிரேக்க விளக்கக் கூறுகள் ஒரே தமிழ் வாக்கியத்தில் இணைக்கப்பட்டுள்ளன. ‘இதயம்’ καρδία உருவகத்தை நெருக்கமாகக் காக்கிறது; ‘...வற்றில் கவனம் செலுத்தும்படி’ προσέχειν என்பதற்கு இயல்பான, துல்லியமான தமிழ் இணைப்பாகும். அடிக்குறிப்பு குறியீடு, அது சார்ந்த உரை, மற்றும் அதன் மாற்றுப் பொருள் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
