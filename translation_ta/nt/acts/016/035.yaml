id: ACT.16.35
reference: Acts 16:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἡμέρας δὲ γενομένης ἀπέστειλαν οἱ στρατηγοὶ τοὺς ῥαβδούχους λέγοντες· Ἀπόλυσον τοὺς ἀνθρώπους ἐκείνους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: ta
  text: பொழுது விடிந்தபோது, நகர அதிகாரிகள் கோல் ஏந்துபவர்களை[a] அனுப்பி, “அந்த மனிதர்களை விடுதலை செய்” என்று கூறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘லிக்டர்கள்’; ரோம நகர அதிகாரிகளின் அதிகாரச் சின்னங்களான கோல்களை ஏந்திய அதிகாரப்பூர்வ உதவியாளர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: பொழுது விடிந்தபோது
  rationale: இந்தப் பிறப்புநிலைத் தொடரின் காலப் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; δέ குறிக்கும் கதைத் தொடர்ச்சி தமிழின் வாக்கிய ஓட்டத்தில் இயல்பாக வெளிப்படுகிறது.
- source_word: ἀπέστειλαν
  choice: அனுப்பி
  rationale: ἀποστέλλω என்பதன் சாதாரண ‘அனுப்பு’ என்ற பொருளைத் தெளிவாகத் தருகிறது; அடுத்து வரும் பங்கேற்பு வினையுடன் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: οἱ στρατηγοὶ
  choice: ஆட்சித் தலைவர்கள்
  rationale: பிலிப்பி நகரின் ரோமக் குடியேற்றச் சூழலில் இச்சொல் படைத்தளபதிகளை அல்ல, குடிமை நிர்வாகத்தின் முதன்மை அதிகாரிகளைக் குறிக்கிறது. ‘ஆட்சித் தலைவர்கள்’ என்பது பதவியை எளிதில் புரியும்படி தெரிவிக்கிறது.
- source_word: τοὺς ῥαβδούχους
  choice: கோலேந்திய அதிகாரிகளை
  rationale: சொல்லின் நேரடியான ‘கோலை ஏந்துபவர்கள்’ என்ற உருவகத்தையும் அவர்களின் அதிகாரப்பூர்வப் பணியையும் காக்கிறது. வரலாற்றுத் தொழில்நுட்பச் சொல்லான ‘லிக்டர்கள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λέγοντες
  choice: என்று கூறினார்கள்
  rationale: அனுப்பப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் பங்கேற்பு வினையைத் தமிழில் தெளிவான நேரடி உரை அமைப்பாக வழங்குகிறது.
- source_word: Ἀπόλυσον
  choice: விடுதலை செய்
  rationale: காவலில் இருப்பவர்களை விடுவிக்குமாறு இடப்படும் ஒருமை கட்டளையைச் சட்ட/காவல் சூழலுக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: அந்த மனிதர்களை
  rationale: சூழலில் பவுலையும் சீலாவையும் குறிக்கும் சுட்டுத் தொடரைத் துல்லியமாகவும் இயல்பாகவும் வழங்குகிறது.
