translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வரலாற்றுச் சூழலின் அதிகாரப்பூர்வத் தன்மை குன்றாத வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி காலத்தொடருக்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் ῥαβδούχους என்பதைக் குறிப்பதால் தமிழில் அதற்குரிய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
