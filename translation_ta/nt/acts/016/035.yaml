revisions:
- from: பொழுது விடிந்தபோது, ஆட்சித் தலைவர்கள் கோலேந்திய அதிகாரிகளை[a] அனுப்பி, “அந்த மனிதர்களை விடுதலை செய்” என்று கூறினார்கள்.
  to: பொழுது விடிந்தபோது, நகர அதிகாரிகள் கோல் ஏந்துபவர்களை[a] அனுப்பி, “அந்த மனிதர்களை விடுதலை செய்” என்று கூறினார்கள்.
  rationale: The revision preserves the source’s distinction between the στρατηγοί (civic magistrates) and the ῥαβδούχοι (their rod-bearing attendants), while retaining the literal image of rod-bearing and the historical alternative in a footnote. No interpretive or theological expansion has been added.
