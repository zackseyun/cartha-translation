id: ACT.16.11
reference: Acts 16:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: ta
  text: எனவே, துரோவாவிலிருந்து கப்பலில் புறப்பட்டு, நேராகச் சமோத்ராக்கேக்குச் சென்றோம்; மறுநாள் நியாப்போலிக்குச் சென்றோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: கப்பலில் புறப்பட்டு
  rationale: ἀνάγω என்பதன் கடற்பயணப் பயன்பாடு ‘கடலுக்குள் புறப்படுதல்/கப்பற்பயணத்தைத் தொடங்குதல்’ என்பதாகும். தமிழில் இயல்பாகவும் கடற்பயணச் சூழலைத் தெளிவாகவும் காட்டுகிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய நிகழ்வின் விளைவாகப் பயணம் தொடங்கியதை இணைக்கும் தொடர்/தீர்மான இடைச்சொல்லாக οὖν உள்ளது; ‘எனவே’ அதன் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ἀπὸ Τρῳάδος
  choice: துரோவாவிலிருந்து
  rationale: ἀπό புறப்படும் இடத்தைக் குறிக்கிறது; Τρῳάς என்பதற்கான வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவம் ‘துரோவா’.
- source_word: εὐθυδρομήσαμεν
  choice: நேராகச் ... சென்றோம்
  rationale: இந்த வினைச்சொல் கப்பலில் நேரான போக்கில் செல்லுதலைக் குறிக்கிறது. முன்னரே ‘கப்பலில் புறப்பட்டு’ என்று இருப்பதால், தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து அதன் நேர்த்திச் சாரத்தைத் தக்கவைக்கிறது.
- source_word: εἰς Σαμοθρᾴκην
  choice: சமோத்திராக்கே தீவுக்குச்
  rationale: εἰς இலக்கிடத்தைக் குறிக்கிறது. பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; வாசகருக்கு இடவகை தெளிவாக இருக்க ‘தீவு’ சேர்க்கப்பட்டுள்ளது.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: மறுநாள்
  rationale: இந்தக் காலக் குறிப்பின் இயல்பான நவீனத் தமிழ் வடிவம் ‘மறுநாள்’; δέ குறிக்கும் தொடர்ச்சி வாக்கிய அமைப்பாலும் அரைப்புள்ளியாலும் வெளிப்படுகிறது.
- source_word: εἰς Νέαν Πόλιν
  choice: நெஆப்போலிக்குச்
  rationale: இது இடப்பெயர் என்பதால் ‘புதிய நகரம்’ என்று பொருளாக்காமல், நிலைபெற்ற கிரேக்கப் பெயருக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பயணக் குறிப்புக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் இயல்பானதுமான நடை. முதலாம் நபர் பன்மை ‘சென்றோம்’ மூலம் மூலத்தின் ‘நாங்கள்’ பயணச் சாட்சியம் பாதுகாக்கப்பட்டுள்ளது.
