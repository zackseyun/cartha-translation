source:
  edition: SBLGNT
  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: ta
  text: அவர்களை வெளியே அழைத்து வந்தபின், “ஐயர்களே[b], நான் மீட்கப்படுவதற்கு என்ன செய்ய வேண்டும்?[a]” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் மீட்கப்படுவதற்கு என்ன செய்வது அவசியம்?’
    reason: lexical_alternative
  - marker: b
    text: ‘ஐயர்களே’ என்பது கிரேக்கச் சொல்லான κύριοι-யை இங்கு மரியாதையான சமூக விளிப்பாக மொழிபெயர்க்கிறது; இது ‘ஆண்டவர்’ என்ற தெய்வீகப் பட்டம் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: அவர்களை வெளியே அழைத்து வந்து
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. ‘வெளியே அழைத்து வந்து’ என்பது அவர்களை வெளியே கொண்டுவந்த இயக்கத்தையும் நிகழ்வுகளின் வரிசையையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἔφη
  choice: என்று கேட்டான்
  rationale: φημί என்பதன் வடிவம் பொதுவாக உரையை அறிமுகப்படுத்தினாலும், இங்கு வரும் சொற்கள் நேரடிக் கேள்வியாக இருப்பதால் இயல்பான தமிழில் ‘என்று கேட்டான்’ என வழங்கப்பட்டுள்ளது.
- source_word: Κύριοι
  choice: ஐயா்களே
  rationale: κύριοι இங்கு பவுலையும் சீலாவையும் மரியாதையுடன் விளிக்கும் சமூகப் பயன்பாடு; தெய்வீகப் பட்டமான ‘ஆண்டவர்’ அல்ல.
- source_word: τί με δεῖ ποιεῖν
  choice: நான் என்ன செய்ய வேண்டும்
  rationale: δεῖ தேவையையும் கட்டாயத்தையும் குறிக்கிறது; ‘செய்ய வேண்டும்’ அதன் வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: ἵνα σωθῶ
  choice: நான் மீட்கப்படுவதற்கு
  rationale: ἵνα உடன் வரும் இறந்தகாலச் செயல்பாட்டு அற்ற துணைவினை நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைச் சுட்டுகிறது. ‘மீட்கப்படுவதற்கு’ செயப்பாட்டு வடிவத்தையும் நோக்க உறவையும் காக்கிறது.
theological_decisions:
- issue: சிறைக்காவலனின் கேள்வியில் σωθῶ என்பதன் பொருள்
  choice: மீட்கப்படுவதற்கு
  alternative: காப்பாற்றப்படுவதற்கு / இரட்சிக்கப்படுவதற்கு
  rationale: அப்போஸ்தலர் பணிகளில் σώζω உடல்சார் ஆபத்திலிருந்து காப்பாற்றுதலையும் விரிவான ஆன்மீக மீட்பையும் குறிக்க முடியும். அடுத்த வசனத்தின் சூழல் விரிவான மீட்பை நோக்கினாலும், ‘மீட்கப்படுதல்’ அந்தச் சொல்லின் பரப்பையும் இங்குள்ள இறையியல் அழுத்தத்தையும் தேவையின்றி குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கச் சொல் வரிசையை அப்படியே பின்பற்றாமல், நிகழ்வுகளின் வரிசை, கேள்வியின் அவசரம், செயப்பாட்டு பொருள் ஆகியவை காக்கப்பட்டுள்ளன.
