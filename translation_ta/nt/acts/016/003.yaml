source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: ta
  text: பவுல் தீமோத்தேயு தன்னுடன் பயணம் செய்ய வேண்டும் என்று விரும்பினார்.[a] பின்னர் அவரை அழைத்துக்கொண்டு, அந்தப் பகுதிகளில் இருந்த யூதர்களின் காரணமாக[b] அவருக்கு விருத்தசேதனம் செய்தார்; ஏனெனில் அவருடைய தந்தை ஒரு கிரேக்கர்[c] என்பது அவர்கள் அனைவருக்கும் தெரிந்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கில் சொற்படி, “தன்னுடன் வெளியே செல்ல.” இச்சூழலில் இது பயணத்திற்குப் புறப்பட்டுச் செல்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யூதர்களைக் கருத்தில் கொண்டு”; “யூதர்களுக்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “கிரேக்கர்” என்பது இச்சூழலில் தீமோத்தேயுவின் தந்தை யூதர் அல்லாதவர் என்பதைக் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: தீமோத்தேயுவை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நபர் தீமோத்தேயு. தமிழில் வசனத்தைத் தனியாக வாசிக்கும்போதும் சுட்டுப்பெயரின் குறிப்பு தெளிவாக இருக்கப் பெயர் பயன்படுத்தப்பட்டது.
- source_word: ἠθέλησεν
  choice: விரும்பினார்
  rationale: θέλω இங்கு பவுலின் விருப்பத்தையும் நோக்கத்தையும் குறிக்கிறது; நவீனத் தமிழில் இயல்பான இணைச்சொல்.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: தன்னுடன் பயணம் செய்ய அழைத்துச் செல்ல
  rationale: ἐξέρχομαι என்பதன் சொற்பொருள் ‘வெளியே செல்லுதல்’; இச்சூழலில் பயணத்திற்குப் புறப்பட்டுச் செல்வதைக் குறிக்கும் மரபுத்தொடரின் பொருள் இயல்பான தமிழில் தரப்பட்டது.
- source_word: λαβὼν
  choice: அழைத்துச் செல்ல
  rationale: அவரைத் தன்னுடன் கூட்டிக்கொள்வதைக் குறிக்கும் முன்நிகழ் வினையெச்சத்தின் கருத்து பயணச் சூழலுடன் இணைத்து இயல்பாகத் தரப்பட்டது; தனியாக ‘அவரைப் பிடித்து/எடுத்து’ என்பது தமிழில் தவறான உடல்சார் நிழற்பொருளைத் தரலாம்.
- source_word: περιέτεμεν αὐτόν
  choice: அவருக்கு விருத்தசேதனம் செய்தார்
  rationale: செயலின் நேரடியான, வழக்கமான தமிழாக்கம்; மறைமொழி பயன்படுத்தப்படவில்லை.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: யூதர்களின் காரணமாக
  rationale: διά + accusative இங்கு காரணம் அல்லது தூண்டுதலைக் குறிக்கிறது. அது யூதர்களின் நன்மைக்காகவா அல்லது அவர்களைக் கருத்தில் கொண்டா என்பதைத் தீர்மானிக்காமல் பொதுவான காரண உறவு காக்கப்பட்டது.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: அந்தப் பகுதிகளில் இருந்த
  rationale: τόποις என்பதைக் சூழலுக்கு ஏற்ற இயல்பான தமிழில் ‘பகுதிகள்’ என்று வழங்குகிறது; குடியிருப்பு என்பதை மூலத்தை மீறிச் சேர்க்கவில்லை.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: ஏனெனில் ... அவர்கள் அனைவருக்கும் தெரிந்திருந்தது
  rationale: γάρ என்பதன் விளக்கக் காரணமும் ἅπαντες என்பதன் முழுமையும் காக்கப்பட்டன.
- source_word: Ἕλλην
  choice: ஒரு கிரேக்கர்
  rationale: சொல்லின் நேரடியான இன/பண்பாட்டு அடையாளம் காக்கப்பட்டது; விரிவான ‘யூதரல்லாதவர்’ என்ற பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: அவருடைய தந்தை ... என்பது
  rationale: ὑπάρχω இங்கு எளிய இருப்புநிலையைச் சுட்டுகிறது; தமிழில் இயல்பான அறிவித்தல் அமைப்பு பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: தீமோத்தேயுவுக்கு விருத்தசேதனம் செய்ததற்கும் உள்ளூர் யூதர்களின் அக்கறைக்கும் உள்ள தொடர்பு
  choice: உள்ளூர் யூதர்கள் தீமோத்தேயுவின் தந்தையைப் பற்றி அறிந்திருந்ததே பவுலின் செயலுக்கான காரணம் என்று வசனம் கூறும் அளவிலேயே மொழிபெயர்க்கப்பட்டது.
  alternative: இது விசுவாசிகளின் இரட்சிப்புக்கோ உடன்படிக்கை நிலைக்கோ விருத்தசேதனம் அவசியம் என்பதற்கான ஆதரவு; அல்லது இது முற்றிலும் நற்செய்திப் பணிக்கான நடைமுறைத் தந்திரம்.
  rationale: மூலவாக்கியம் காரணத்தை வெளிப்படையாகக் கூறுகிறது; ஆனால் அந்தச் செயலின் விரிவான கோட்பாட்டுப் பொருளைத் தீர்மானிக்கவில்லை. எனவே பிற புதிய ஏற்பாட்டு இடங்களுடனான இறையியல் பதற்றம் தீர்த்துவைக்கப்படாமல் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘விருத்தசேதனம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் வைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தின் காரணத் தொடர்பு காக்கப்பட்டபோதும், தமிழில் தெளிவாக வாசிக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது; எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
