source:
  edition: SBLGNT
  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: ta
  text: அவளும் அவளுடைய வீட்டாரும் திருமுழுக்குப் பெற்றபோது, அவள் எங்களை வற்புறுத்தி, “நான் ஆண்டவருக்கு உண்மையுள்ளவள்[a] என்று நீங்கள் தீர்மானித்திருந்தால், என் வீட்டிற்கு வந்து தங்குங்கள்” என்றாள். இவ்வாறு அவள் விடாமல் வற்புறுத்தி எங்களை இணங்க வைத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரில் நம்பிக்கை கொண்டவள்.” கிரேக்கப் பெயரடை “உண்மையுள்ள,” “நம்பகமான,” அல்லது “நம்பிக்கை கொண்ட” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: பெற்றபின்
  rationale: ὡς என்பதன் காலத் தொடர்பையும் δέ என்பதன் மென்மையான தொடர்ச்சியையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: அவளும் அவளுடைய வீட்டாரும் திருமுழுக்குப் பெற்றபின்
  rationale: வினைச்சொல் ஒருமையில் முதலில் அவளைக் குறித்தாலும், தொடர்ந்து அவளுடைய வீட்டாரும் இணைக்கப்படுகின்றனர். தமிழில் இருவரையும் பன்மையாகக் கூறுவது இயல்பு.
- source_word: ὁ οἶκος αὐτῆς
  choice: அவளுடைய வீட்டார்
  rationale: இங்கு οἶκος என்பது கட்டடமாகிய வீட்டை அல்ல, அவளுடைய குடும்பம் அல்லது வீட்டைச் சேர்ந்தவர்களைக் குறிக்கிறது.
- source_word: παρεκάλεσεν
  choice: வற்புறுத்தி
  rationale: παρακαλέω இச்சூழலில் வெறும் அழைப்பைவிட earnest வேண்டுகோளையும் வலியுறுத்தலையும் குறிக்கிறது; அடுத்த வினையும் அவளுடைய விடாப்பிடியான அழைப்பை உறுதிப்படுத்துகிறது.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: நான் ஆண்டவருக்கு உண்மையுள்ளவள் என்று நீங்கள் தீர்மானித்திருந்தால்
  rationale: κεκρίκατε என்ற நிறைவுக்கால வடிவம் ஏற்கெனவே செய்யப்பட்டு நிலைத்திருக்கும் மதிப்பீட்டைக் காட்டுகிறது. πιστή என்பதன் விசுவாசம், உண்மைத்தன்மை, நம்பகத்தன்மை ஆகிய தொடர்புடைய நுணுக்கங்களை ‘உண்மையுள்ளவள்’ ஓரளவு திறந்தவையாக வைத்திருக்கிறது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவருக்கு
  rationale: πιστή என்பதுடன் வரும் உறவுசார் நான்காம் வேற்றுமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: என் வீட்டிற்கு வந்து தங்குங்கள்
  rationale: இங்கு οἶκος வாழும் இடமாகிய வீட்டைக் குறிக்கிறது. பங்கேற்பு வினையை முதன்மை வினையுடன் இணைந்த அழைப்பாக இயல்பான தமிழில் தருகிறது.
- source_word: παρεβιάσατο ἡμᾶς
  choice: அவள் விடாமல் வற்புறுத்தி எங்களை இணங்க வைத்தாள்
  rationale: παραβιάζομαι வலுவான, தொடர்ந்த வற்புறுத்தலைக் குறிக்கிறது. இத்தேர்வு கட்டாய வன்முறையை உணர்த்தாமல், அவளுடைய வலியுறுத்தல் வெற்றி பெற்றதைக் காட்டுகிறது.
theological_decisions:
- issue: அவளுடைய வீட்டாரின் திருமுழுக்கு பற்றிய பிற்காலத் திருச்சபைப் பொருள் விளக்கம்
  choice: அவளும் அவளுடைய வீட்டாரும் திருமுழுக்குப் பெற்றதாக உரை கூறுவதை மட்டும் நேரடியாக மொழிபெயர்த்தல்
  alternative: வீட்டாரில் குழந்தைகள் இருந்ததாகவோ, அனைவரும் தனிப்பட்ட விசுவாச அறிக்கை செய்ததாகவோ மொழிபெயர்ப்பில் குறிப்புணர்த்துதல்
  rationale: இவ்வசனம் வீட்டாரின் வயது அல்லது ஒவ்வொருவரின் விசுவாச நிலையை விவரிக்கவில்லை. ஆகவே பிற்காலத் திருமுழுக்குக் கோட்பாட்டு விவாதங்களில் எந்தப் பக்கத்தையும் மொழிபெயர்ப்பு சேர்த்துக் கொள்ளவில்லை.
- issue: πιστή என்பதன் பொருள்
  choice: ஆண்டவருக்கு உண்மையுள்ளவள்
  alternative: ஆண்டவரில் நம்பிக்கை கொண்டவள்; ஆண்டவருக்கு நம்பகமானவள்
  rationale: கிரேக்கச் சொல் விசுவாசித்தல், உண்மையுடன் இருத்தல், நம்பகத்தன்மை ஆகிய பொருள் நுணுக்கங்களைத் தாங்க முடியும். முதன்மை உரையும் அடிக்குறிப்பும் இந்த உண்மையான தெளிவின்மையைப் பாதுகாக்கின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டுள்ளது. ‘வீட்டார்’ மற்றும் ‘வீடு’ என்ற வேறுபாடு சமூகக் குழுவையும் வாழும் இடத்தையும் தெளிவாகப் பிரிக்கிறது; எந்தத் திருமுழுக்குக் கோட்பாட்டையும் கூடுதலாகப் புகுத்தவில்லை.
