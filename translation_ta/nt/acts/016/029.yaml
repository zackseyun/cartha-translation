- source_word: φῶτα
  choice: விளக்குகள்
  rationale: பன்மை வடிவம் ஒளி தரும் சாதனங்களைக் குறிக்கிறது. ‘விளக்குகள்’ என்பது தீப்பந்தங்கள் அல்லது வேறு குறிப்பிட்ட வகையைத் தேவையின்றி நிர்ணயிக்காத இயல்பான தமிழ் சொல்.
- source_word: εἰσεπήδησεν
