  text: அப்போது, அவன் விளக்குகளைக் கேட்டு, உள்ளே பாய்ந்தான்[a]; பயத்தால் நடுங்கியவனாய்[b], பவுலுக்கும் சீலாவுக்கும் முன்பாக விழுந்தான்[c].
