theological_decisions:
- issue: சிறைக்காவலன் பவுலுக்கும் சீலாவுக்கும் முன் விழுந்த செயலின் தன்மை
  choice: அச்சமும் பணிவும் வெளிப்படும் உடல் செயலாக ‘முன்பாக விழுந்தான்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவர்களை வணங்கினான்’ அல்லது ‘அவர்கள் முன் நெடுஞ்சாண்கிடையாக விழுந்தான்’
  rationale: சூழல் அவனுடைய அதிர்ச்சியையும் அவசரமான பணிவையும் காட்டுகிறது. கிரேக்க வினை மத வழிபாட்டை கட்டாயமாகக் குறிக்காததால், மொழிபெயர்ப்பு அந்தத் தெய்வவியல் முடிவை உரைக்குள் சேர்க்காமல் செயலை மட்டும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் செயல்வரிசையும் திடீர் இயக்கமும் உடல் நடுக்கமும் காக்கப்பட்டுள்ளன; வழிபாடு என்ற தெய்வவியல் விளக்கம் உரையில் சேர்க்கப்படவில்லை.
