  rationale: திடீரென்றும் வேகமாகவும் உள்ளே நுழைந்த செயலை இச்சொற்றொடர் உயிரோட்டமாக வெளிப்படுத்துகிறது.
- source_word: ἔντρομος γενόμενος
  choice: பயத்தால் நடுங்கியவனாய்
