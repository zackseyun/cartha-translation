translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘ஜெபித்துக்கொண்டு’ என்பதற்குப் பதிலாகப் பரந்த வாசகர் வட்டத்திற்குப் புரியும் ‘கடவுளிடம் வேண்டிக்கொண்டு’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்நிலைச் செயல்கள் ‘கொண்டிருந்தார்கள்’ வடிவத்தில் காக்கப்பட்டுள்ளன.
