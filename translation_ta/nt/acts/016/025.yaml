  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: ta
  text: ஏறக்குறைய நள்ளிரவில், பவுலும் சீலாவும் கடவுளிடம் வேண்டிக்கொண்டு, அவரைப் புகழ்ந்து பாடிக்கொண்டிருந்தார்கள்; கைதிகள் அவர்களைக் கேட்டுக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களைக் கவனமாகக் கேட்டுக்கொண்டிருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் கவனமாக அல்லது ஆர்வத்துடன் கேட்பதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: ஏறக்குறைய நள்ளிரவில்
  rationale: κατά + காலத்தைக் குறிக்கும் வேற்றுமை வடிவம் இங்கு துல்லியமான நேரத்தை அல்ல, ‘நள்ளிரவை ஒட்டிய நேரத்தில்’ என்ற பொருளைத் தருகிறது. δέ மென்மையான தொடர்ச்சிச் சொல் என்பதால் தமிழில் தனியே மொழிபெயர்க்காமல் இயல்பான வாக்கிய ஓட்டத்தில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: பவுலும் சீலாவும்
  rationale: பெயர்கள் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன; இணைப்பை இயல்பாகக் காட்ட ‘உம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: προσευχόμενοι
  choice: கடவுளிடம் வேண்டிக்கொண்டு
  rationale: நிகழ்ந்துகொண்டிருந்த இணைச் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ‘வேண்டுதல்’ என்பது இங்கு கடவுளை நோக்கிய மன்றாட்டைக் குறிக்கிறது.
- source_word: ὕμνουν
  choice: அவரைப் புகழ்ந்து பாடிக்கொண்டிருந்தார்கள்
  rationale: ὑμνέω என்பது பொதுவாகப் பாடுவதைவிட இறைவனைப் புகழ்ந்து பாடுவதைக் குறிப்பாகக் குறிக்கிறது. இறந்தகாலத் தொடர்நிலை கிரேக்க imperfect-இன் நீடித்த செயலைப் பாதுகாக்கிறது.
- source_word: τὸν θεόν
  choice: கடவுளிடம் / அவரை
  rationale: முதல் குறிப்பில் ‘கடவுள்’ தெளிவாகக் கொடுக்கப்பட்டு, தொடர்ந்து வரும் பாடலின் இலக்கு இயல்பான தமிழில் ‘அவரை’ எனக் குறிக்கப்படுகிறது.
- source_word: ἐπηκροῶντο
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை நடந்துகொண்டிருந்த கேட்புச் செயலை வெளிப்படுத்துகிறது. வினைச்சொல்லில் இருக்கக்கூடிய கவனமான அல்லது ஆர்வமிக்க கேட்பின் நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: οἱ δέσμιοι
  choice: கைதிகள்
  rationale: சிறையில் கட்டுப்பாட்டில் வைக்கப்பட்டவர்களை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் குறிக்கும் சொல்.
