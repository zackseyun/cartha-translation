  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இல்லாத “சிறையிலிருந்து” போன்ற இடவிவரம் சேர்க்கப்படவில்லை; வினைச்செயல்களின் வரிசையும் ἠρώτων என்பதன் தொடர்நிலை நுட்பமும் பாதுகாக்கப்பட்டுள்ளன.
