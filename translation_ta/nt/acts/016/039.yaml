id: ACT.16.39
reference: Acts 16:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες παρεκάλεσαν αὐτούς, καὶ ἐξαγαγόντες ἠρώτων ⸂ἀπελθεῖν ἀπὸ⸃ τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: ta
  text: அவர்கள் வந்து, அவர்களிடம் வேண்டிக்கொண்டார்கள்[a]. பின்பு அவர்களை வெளியே அழைத்துவந்து, நகரத்தைவிட்டுப் போகுமாறு கேட்டுக்கொண்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வலியுறுத்தினார்கள்” அல்லது “பணிவாக மன்றாடினார்கள்” என்றும் மொழிபெயர்க்கலாம். இந்தக் கிரேக்க வினை வேறு சூழல்களில் “தேற்றினார்கள்” என்றும் பொருள்படும்; இங்கு அதிகாரிகள் பவுலையும் சீலாவையும் சமாதானப்படுத்த முயல்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கேட்டார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இந்த வினை இறந்தகாலத் தொடர்நிலையில் இருப்பதால், அவர்கள் தொடர்ந்து அல்லது மீண்டும் மீண்டும் கேட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: அவர்கள் வந்து
  rationale: இறந்தகால வினையெச்சம் அதிகாரிகள் வந்து மேற்கொண்ட அடுத்த செயலை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான நிகழ்வுவரிசையை இது காட்டுகிறது.
- source_word: παρεκάλεσαν
  choice: அவர்களிடம் வேண்டிக்கொண்டார்கள்
  rationale: παρακαλέω என்பதற்கு வேண்டுதல், வலியுறுத்துதல், தேற்றுதல் போன்ற பரந்த பொருள்கள் உள்ளன. இச்சூழலில் அதிகாரிகள் பவுலையும் சீலாவையும் சமாதானப்படுத்தும் நோக்கில் பணிவாக வேண்டுவதை இந்தச் சொல் இயல்பாகக் காட்டுகிறது.
- source_word: αὐτούς
  choice: அவர்களிடம் / அவர்களை
  rationale: இது பவுலையும் சீலாவையும் குறிக்கும் பன்மைச் சுட்டுப்பெயர்; மூலத்தின் சுட்டுப்பெயர் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐξαγαγόντες
  choice: வெளியே அழைத்துவந்து
  rationale: ἐξάγω என்பது ஒருவரை வெளியே நடத்தி அல்லது அழைத்து வருவதைக் குறிக்கிறது. அவர்கள் எங்கிருந்து வெளியே கொண்டுவரப்பட்டார்கள் என்பதை மூலவாக்கியம் இங்கு வெளிப்படையாகச் சொல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: ἠρώτων
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவமான ἠρώτων, தொடர்ந்து அல்லது மீண்டும் கேட்டுக்கொண்டிருந்த செயலைக் குறிக்கக்கூடும்; தமிழ் தொடர்நிலை வடிவம் அந்த நுட்பத்தைத் தக்கவைக்கிறது.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: நகரத்தைவிட்டுப் போகுமாறு
  rationale: நகரத்திலிருந்து அகன்று செல்ல வேண்டும் என்ற கோரிக்கையை நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
