translation:
  language: ta
  text: பின்பு அவர்கள் மீசியாவைக் கடந்து[a] துரோவாவுக்கு இறங்கிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மீசியா வழியாகச் சென்று” அல்லது “மீசியாவைக் கடந்து சென்று” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினையெச்சத்தை இவற்றில் பல நெருக்கமான விதங்களில் புரிந்துகொள்ள முடியும்; அவர்கள் அங்கே தங்காமல் தொடர்ந்து சென்றார்கள் என்பதே பொதுவான கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: கடந்து
  rationale: παρέρχομαι என்ற வினையின் இறந்தகால வினையெச்சம். மீசியாவைத் தங்கள் பயணத்தில் கடந்து தொடர்ந்து சென்றார்கள் என்ற பொருளை இயல்பான தமிழில் தருகிறது; அந்தப் பகுதியின் வழியாகச் சென்றார்களா அல்லது அதைக் கடந்து சென்றார்களா என்ற கிரேக்கச் சொல்லின் நுட்பமான தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: δὲ
  choice: பின்பு
  rationale: இது மென்மையான கதைத் தொடர்புச் சொல். வலுவான எதிர்மறைப் பொருளை உருவாக்காமல் நிகழ்வுகளின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: Μυσίαν
  choice: மீசியா
  rationale: பண்டைய பிராந்தியப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: κατέβησαν
  choice: இறங்கிச் சென்றார்கள்
  rationale: καταβαίνω என்பதன் கீழ்நோக்கிய பயணப் பொருளைப் பாதுகாத்து, தமிழில் இயல்பான பயண விவரிப்பாக அமைகிறது.
- source_word: εἰς
  choice: -வுக்கு
  rationale: இலக்கிடத்தைச் சுட்டும் εἰς என்பதற்கு தமிழில் இயல்பான வேற்றுமை உருபு.
- source_word: Τρῳάδα
  choice: துரோவா
  rationale: பண்டைய நகரப் பெயரின் பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பு.
