  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: ta
  text: கோல் ஏந்தியவர்கள்[b] இந்தச் சொற்களை நகர அதிகாரிகளிடம்[c] தெரிவித்தார்கள். அவர்கள் ரோமர்கள்[a] என்று கேட்டபோது, அந்த அதிகாரிகள் பயந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ரோமக் குடிமக்கள்.’ கிரேக்கத்தில் ‘ரோமர்கள்’ என்று உள்ளது; ஆனால் இந்தச் சட்டச் சூழலில், ரோமக் குடியுரிமையால் அவர்களுக்கிருந்த பாதுகாக்கப்பட்ட நிலையே வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கோல் ஏந்தியவர்கள்’ என்பவர்கள் நகர அதிகாரிகளின் உதவியாளர்கள்; இவர்கள் மரபாக ‘லிக்டர்கள்’ என்று அழைக்கப்படுகின்றனர்.
    reason: cultural_note
  - marker: c
    text: ‘நகர அதிகாரிகள்’ என்பது στρατηγοί என்ற கிரேக்கச் சொல்லின் மொழிபெயர்ப்பு; பிலிப்பியின் முதன்மை நகர ஆட்சிப் பொறுப்பாளர்களை இது குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: தெரிவித்தார்கள்
  rationale: ஒரு செய்தியை அதிகாரபூர்வமாக எடுத்துச் சென்று அறிவிப்பதைக் குறிக்கும் வினை; இச்சூழலில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: στρατηγοῖς
  choice: நகர அதிகாரிகளிடம்
  rationale: பிலிப்பி நகரின் முதன்மை ஆட்சிப் பொறுப்பாளர்களைக் குறிக்கிறது. வரலாற்றுச் சிறப்புப்பெயரைப் பயன்படுத்தாமல், இன்றைய வாசகர்களுக்குப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: ῥαβδοῦχοι
  choice: கோல் ஏந்திய பணியாளர்கள்
  rationale: சொல்லின் நேரடிப் பொருளான ‘கோல் ஏந்தியவர்கள்’ என்பதையும், அவர்கள் அதிகாரிகளின் பணியாளர்கள் என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ ῥήματα ταῦτα
  choice: இந்த வார்த்தைகளை
  rationale: முன்பு கூறப்பட்ட குறிப்பிட்ட செய்தியைச் சுட்டும் கிரேக்கச் சொற்றொடரின் வடிவத்தை நெருக்கமாகப் பேணுகிறது.
- source_word: ἐφοβήθησαν
  choice: பயந்தார்கள்
  rationale: அவர்கள் கேட்ட செய்திக்குப் பதிலாக ஏற்பட்ட அச்சத்தை மிகைப்படுத்தாமல் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἀκούσαντες
  choice: கேள்விப்பட்டதும்
  rationale: கேட்ட நிகழ்வுக்கும் அதனைத் தொடர்ந்து ஏற்பட்ட அச்சத்துக்கும் உள்ள காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: Ῥωμαῖοί
  choice: ரோமர்கள்
  rationale: கிரேக்கத்தில் உள்ள நேரடிச் சொல்லைத் தக்கவைக்கிறது; சட்டச் சூழலில் இது ரோமக் குடியுரிமை பெற்றவர்கள் என்பதைக் குறிக்கிறது.
