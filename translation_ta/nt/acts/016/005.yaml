source:
  edition: SBLGNT
  text: αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ’ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: ta
  text: ஆகவே, திருச்சபைகள் கிறிஸ்தவ விசுவாசத்தில் உறுதிப்படுத்தப்பட்டுக்கொண்டும், எண்ணிக்கையில் நாளுக்கு நாள் பெருகிக்கொண்டும் இருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விசுவாசத்தில்.’ கிரேக்கச் சொற்றொடர், திருச்சபைகள் தாங்கள் பகிர்ந்துகொண்ட கிறிஸ்தவ விசுவாசத்தில் உறுதிப்படுத்தப்பட்டதைக் குறிக்கலாம்; அல்லது பொதுவாக விசுவாசத்தில் உறுதிப்படுத்தப்பட்டதையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுகளோடு தொடர்புடைய இடைநிலைச் சுருக்கத்தையும் விளைவையும் இயல்பான தமிழில் காட்டுகிறது; μέν என்பதற்கு இங்கு தனியான எதிரிணைச் சொல் தேவையில்லை.
- source_word: ἐκκλησίαι
  choice: திருச்சபைகள்
  rationale: அப்போஸ்தலர் நடபடிகளில் உள்ளூர் கிறிஸ்தவ விசுவாசக் குழுக்களைக் குறிக்கிறது; நவீனத் தமிழ் வேதாகம நடையில் தெளிவாகவும் வழக்கமாகவும் உள்ளது.
- source_word: ἐστερεοῦντο
  choice: உறுதிப்படுத்தப்பட்டு
  rationale: வினையின் இறந்தகாலத் தொடர்நிலைப் பொருளையும் செயப்பாட்டு நிலையையும், ‘பெருகிவந்தன’ என்பதோடு இணைந்த இயல்பான தமிழ் அமைப்பில் தெரிவிக்கிறது.
- source_word: τῇ πίστει
  choice: விசுவாசத்தில்
  rationale: இடவெளி அல்லது தொடர்புத் தத்துவத்தை இயல்பாகக் காட்டுகிறது. கிரேக்க உரையின் உருபு கிறிஸ்தவ விசுவாசம் என்ற பகிரப்பட்ட நம்பிக்கை மற்றும் வாழ்வுமுறையைக் குறிக்க வாய்ப்புள்ளது; அதேவேளை ‘விசுவாசத்தில்’ என்பது தனிப்பட்ட விசுவாசம் என்ற உண்மையான சாத்தியத்தையும் முற்றிலும் மூடிவிடாது.
- source_word: ἐπερίσσευον
  choice: பெருகிவந்தன
  rationale: தொடர்ச்சியாக அதிகரித்ததைக் குறிக்கும் imperfect வினையின் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῷ ἀριθμῷ
  choice: எண்ணிக்கையில்
  rationale: எந்த வகையில் பெருகின என்பதைக் காட்டும் respect dative-ஐ தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: καθ’ ἡμέραν
  choice: நாளுக்கு நாள்
  rationale: ஒவ்வொரு நாளும் தொடர்ந்து நிகழ்ந்த வளர்ச்சியின் பகிர்வுத் தன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: τῇ πίστει என்பதில் πίστις-ன் பொருள்
  choice: விசுவாசத்தில்—திருச்சபைகள் பகிர்ந்து கொண்ட கிறிஸ்தவ விசுவாசம் என்ற முதன்மைப் பொருள்
  alternative: விசுவாசத்தில்—விசுவாசிகளின் தனிப்பட்ட நம்பிக்கை என்ற பொதுப் பொருள்
  rationale: உருபும் திருச்சபைச் சூழலும் பகிரப்பட்ட கிறிஸ்தவ விசுவாசத்தைக் குறிக்கும் பொருளைச் சற்றே ஆதரிக்கின்றன. இருப்பினும் தனிப்பட்ட நம்பிக்கை என்ற பொருளும் இலக்கணரீதியாகச் சாத்தியமாதலால் அடிக்குறிப்பில் அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான நடை. ‘திருச்சபைகள்’ மற்றும் ‘விசுவாசம்’ ஆகியவை பரவலாக அறியப்பட்ட கிறிஸ்தவச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன; தொடர்நிலை வளர்ச்சி ‘பெருகிவந்தன’ என்பதால் வெளிப்படுகிறது.
