revisions:
- from: ஆகவே, திருச்சபைகள் விசுவாசத்தில் உறுதிப்படுத்தப்பட்டு, நாளுக்கு நாள் எண்ணிக்கையில் பெருகிவந்தன.[a]
  to: ஆகவே, திருச்சபைகள் கிறிஸ்தவ விசுவாசத்தில் உறுதிப்படுத்தப்பட்டுக்கொண்டும், எண்ணிக்கையில் நாளுக்கு நாள் பெருகிக்கொண்டும் இருந்தன.[a]
  rationale: The revision explicitly represents both imperfect verbs as continuing past actions. It also makes the main-text sense of the article with πίστις clear in Tamil, while retaining the alternative broader reading in a footnote without converting the dative into an instrumental expression.
