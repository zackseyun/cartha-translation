source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: ta
  text: அவர்களை மேலே தம் வீட்டுக்குள் அழைத்துச் சென்றபின், அவர்களுக்கு உணவு பரிமாறினார்[a]. கடவுளை நம்பியவராக, அவர் தம் வீட்டார் அனைவரோடும் பெரிதும் மகிழ்ந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘அவர்கள்முன் மேசையை வைத்தார்’; இந்தக் கிரேக்க மரபுத்தொடர் உணவு அளித்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: மகிழ்ச்சியில் அவருடைய வீட்டார் அனைவரும் பங்கேற்றனர் என்பதை இந்தக் கிரேக்கச் சொற்றொடர் வலியுறுத்தலாம். வீட்டார் அனைவரும் நம்பிக்கை கொண்டதையும் இது உட்பொருளாகக் காட்டுகிறது என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: மேலே அழைத்துக்கொண்டு போனபின்
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைகளுக்கு முன் நிகழ்ந்த மேல்நோக்கிய இடமாற்றத்தைக் குறிக்கிறது; சிறைக்கூடத்திலிருந்து வீட்டுக்குச் சென்ற சூழலையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: οἶκον
  choice: வீட்டுக்குள்
  rationale: குறிப்பிட்ட வீடு சிறைக்காவலரின் வீடு என்பதைச் சூழல் தெளிவாக்குகிறது; மூலத்தில் உடைமைச் சுட்டு இல்லாததால் ‘அவருடைய’ என்பதைச் சேர்க்கவில்லை.
- source_word: παρέθηκεν τράπεζαν
  choice: அவர்களுக்கு உணவு பரிமாறினார்
  rationale: சொல்லுக்கு சொல் ‘மேசையை முன்வைத்தார்’ என்றாலும், கிரேக்க மரபுத்தொடர் விருந்தோம்பலாக உணவு அளித்ததைக் குறிக்கிறது; தமிழில் அதன் இயல்பான பொருள் வழங்கப்பட்டுள்ளது.
- source_word: ἠγαλλιάσατο
  choice: மிகவும் மகிழ்ந்தார்
  rationale: மிகுந்த, பொங்கிய மகிழ்ச்சியைக் குறிக்கும் வினையின் வலிமையை வாசிக்க எளிய நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: πανοικεὶ
  choice: தம் வீட்டார் அனைவரோடும்
  rationale: வீட்டிலுள்ளோர் முழுவதும் மகிழ்ச்சியில் பங்கேற்ற கூட்டுச் சூழலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: கடவுள்மீது நம்பிக்கை கொண்டவராக
  rationale: நிறைவேற்றப்பட்டு தொடரும் நிலையை உணர்த்தும் perfect participle-ஐ வினையெச்சத் தன்மையுடன் தருகிறது; வெளிப்படையாக இல்லாத காரணப் பொருளை கட்டாயப்படுத்தாமல், ஒருமை ஆண்பால் வடிவம் சிறைக்காவலரையே குறிக்குமாறு வைத்துள்ளது.
theological_decisions:
- issue: வீட்டார் தொடர்பாக மகிழ்ச்சியும் நம்பிக்கையும் எவ்வளவு பரவலானவை
  choice: முதன்மை உரையில் சிறைக்காவலர் தம் வீட்டார் அனைவரோடும் மகிழ்ந்ததாகவும், ஒருமை வினையெச்சத்தின்படி அவர் கடவுள்மீது நம்பிக்கை கொண்டவராக இருந்ததாகவும் தரப்பட்டுள்ளது.
  alternative: வீட்டார் அனைவரும் கடவுள்மீது நம்பிக்கை கொண்டு அனைவரும் மகிழ்ந்தனர்; அல்லது தம் வீட்டார் அனைவரும் நம்பிக்கை கொண்டதற்காக அவர் மகிழ்ந்தார்.
  rationale: πανοικεὶ என்பது மகிழ்ச்சியை முழு வீட்டாருக்கும் விரிவாக்குகிறது; ஆனால் πεπιστευκώς ஒருமை ஆண்பால் என்பதால் நேரடியாகச் சிறைக்காவலரைக் குறிக்கிறது. இருப்பினும் வீட்டாரும் நம்பிக்கையில் பங்கேற்றனர் என்ற புரிதலுக்கான சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுள்’ என்பது θεός என்பதற்கான பொதுவான சமயச் சார்பற்ற தேர்வு. கிரேக்கத் தொடரின் பங்கேற்பு அமைப்பையும் வீட்டார் குறித்த இலக்கணத் தெளிவின்மையையும் முடிந்தவரை பாதுகாத்துள்ளது.
