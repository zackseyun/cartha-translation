- from: ஆனால் பவுல் உரத்த குரலில் கூப்பிட்டு, “உனக்கு எந்தத் தீங்கும் செய்துகொள்ளாதே[a]; நாங்கள் எல்லாரும் இங்கேதான் இருக்கிறோம்” என்றார்.
  to: 'ஆனால் பவுல் உரத்த குரலில் கூவிச் சொன்னார்: “உனக்கே எந்தத் தீங்கும் செய்துகொள்ளாதே[a]; நாங்கள் அனைவரும் இங்கே இருக்கிறோம்.”'
