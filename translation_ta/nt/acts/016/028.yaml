id: ACT.16.28
reference: Acts 16:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: ta
  text: 'ஆனால் பவுல் உரத்த குரலில் கூவிச் சொன்னார்: “உனக்கே எந்தத் தீங்கும் செய்துகொள்ளாதே[a]; நாங்கள் அனைவரும் இங்கே இருக்கிறோம்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைக் காயப்படுத்திக்கொள்ளாதே.” கிரேக்கச் சொல்லாட்சி இதைவிடப் பரந்த பொருளில், சொல்லுக்குச் சொல், “உனக்கே எந்தத் தீங்கும் செய்துகொள்ளாதே” என உள்ளது; ஆனால் இச்சூழலில் சிறைக்காவலன் தன்னைக் காயப்படுத்த முனைந்ததையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφώνησεν
  choice: கூப்பிட்டு
  rationale: அவசரமான சூழலில் வலிமையாகக் குரல் எழுப்பியதை இயல்பான தமிழில் தெரிவிக்கிறது; தொடர்ந்து வரும் ‘உரத்த குரலில்’ என்பது அதன் தீவிரத்தைத் தெளிவாக்குகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் சிறைக்காவலன் செய்ய முனைந்த செயலுக்கு எதிராக பவுல் உடனடியாகத் தலையிடுவதைச் சுட்டுகிறது.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: குரலின் வலிமையைக் குறிக்கும் கிரேக்கச் சொல்லாட்சியை இயல்பாகவும் நேரடியாகவும் வழங்குகிறது.
- source_word: λέγων
  choice: … என்றார்
  rationale: பவுல் கூப்பிட்டுச் சொன்னவற்றை அறிமுகப்படுத்தும் கிரேக்கப் பங்கேற்புவினையை இயல்பான தமிழ் நேர்கூற்று அமைப்பில் நிறைவு செய்கிறது.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: உனக்கு எந்தத் தீங்கும் செய்துகொள்ளாதே
  rationale: தன்னையே நோக்கிய செயலைக் காட்டும் பிரதிபெயர்ச்சிப் பொருளையும் κακόν என்பதன் பரந்த ‘தீங்கு’ என்ற பொருளையும் காக்கிறது; சூழலில் இது சிறைக்காவலன் தன்னைக் காயப்படுத்த முனைந்ததைக் குறிக்கிறது.
- source_word: ἅπαντες
  choice: எல்லாரும்
  rationale: அங்கிருந்த கைதிகளில் ஒருவரும் தப்பவில்லை என்ற முழுமையை வலியுறுத்துகிறது.
- source_word: γάρ
  choice: ;
  rationale: அடுத்த கூற்று தடைக்கான காரணம் என்பதை தமிழில் தொடர்ச்சியான நேர்கூற்றாலும் அரைப்புள்ளியாலும் இயல்பாக வெளிப்படுத்துகிறது; தனியாக ‘ஏனெனில்’ சேர்ப்பது உரையாடலில் தேவையற்ற செயற்கைத்தன்மையை உண்டாக்கும்.
- source_word: ἐσμεν ἐνθάδε
  choice: இங்கேதான் இருக்கிறோம்
  rationale: ἐνθάδε என்பதன் இடப்பொருளை ‘இங்கே’ என்றும், சூழலில் அவசியமான ‘அனைவரும் இன்னும் இங்கேயே’ என்ற வலியுறுத்தலை ‘தான்’ என்றும் இயல்பாகத் தருகிறது.
- source_word: ὁ Παῦλος
  choice: பவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற தனிப்பெயர் வடிவம்.
