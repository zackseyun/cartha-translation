translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நேர்கூற்று நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பரந்த ‘தீங்கு’ என்ற பொருள் முதன்மை உரையில் காக்கப்பட்டு, சூழலுக்கேற்ற ‘காயப்படுத்திக்கொள்ளாதே’ என்ற குறுகிய மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
