  text: ὃς ἐμαρτυρεῖτο ὑπὸ τῶν ἐν Λύστροις καὶ Ἰκονίῳ ἀδελφῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: ta
  text: அவர் லிஸ்திராவிலும் இக்கோனியாவிலும் இருந்த சகோதரர்களால்[a] நற்சான்று பெற்றிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதர சகோதரிகள்” என்றும் மொழிபெயர்க்கலாம்; இங்கு அந்த இடங்களிலிருந்த சக விசுவாசிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: அவர்
  rationale: இந்த உறவுப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தீமோத்தேயுவைக் குறிக்கிறது. தனி வசனமாக இயல்பாக வாசிக்கத் தமிழில் “அவர்” என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐμαρτυρεῖτο
  choice: நற்சான்று பெற்றிருந்தார்
  rationale: μαρτυρέω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் இங்கு மற்றவர்கள் அவரைக் குறித்து நல்ல சாட்சி அளித்ததையும் அவருக்கு நல்ல பெயர் இருந்ததையும் குறிக்கிறது. “நற்சான்று பெற்றிருந்தார்” என்பது அந்த நேர்மறையான சாட்சியை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ὑπὸ
  choice: -ஆல்
  rationale: செயப்பாட்டு வினையுடன் வரும் ὑπό, செயலைச் செய்த நபர்களைக் குறிக்கிறது; தமிழில் கருவிப்பொருள் வேற்றுமை உருபான “-ஆல்” அதைப் பாதுகாக்கிறது.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: லிஸ்திராவிலும் இக்கோனியாவிலும் இருந்த
  rationale: ἐν உடன் வரும் இரு இடப்பெயர்களும் சகோதரர்கள் இருந்த இடங்களை அடையாளப்படுத்துகின்றன. “இருந்த” என்பதை வெளிப்படுத்துவது தமிழில் உறவைத் தெளிவாக்குகிறது.
- source_word: ἀδελφῶν
  choice: சகோதரர்கள்
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மை. முதன்மை உரையில் அதன் வடிவம் பாதுகாக்கப்படுகிறது; ஆரம்பக் கிறிஸ்தவப் பயன்பாட்டில் இது சக விசுவாசிகள் அனைவரையும் உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: கிறிஸ்தவச் சமூகத்தைக் குறிக்கும் ἀδελφῶν என்பதன் பாலினப் பொருள்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; சக விசுவாசிகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை முதன்மை உரையில் தக்கவைக்கப்படுகிறது. அதேவேளையில், இச்சொல் விசுவாசச் சமூகத்திலுள்ள ஆண்களையும் பெண்களையும் உள்ளடக்கக்கூடிய உறவுமுறைச் சொல்லாகப் பயன்பட்டிருக்கலாம் என்ற உண்மையான பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “நற்சான்று பெற்றிருந்தார்” என்பது கிரேக்க இறந்தகாலச் செயப்பாட்டின் நேர்மறையான நற்பெயர்/சாட்சி பொருளைத் தெரிவிக்கிறது; “சகோதரர்கள்” என்ற மூல வடிவத்தின் உள்ளடக்க வாய்ப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
