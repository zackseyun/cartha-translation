source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: ta
  text: 'இரவில்[a] பவுலுக்கு ஒரு தரிசனம் தோன்றியது: மக்கெதோனிய மனிதன் ஒருவன்[b] நின்றுகொண்டு, “மக்கெதோனியாவுக்குக் கடந்து வந்து[c] எங்களுக்கு உதவி செய்யுங்கள்” என்று அவரிடம் வேண்டிக்கொண்டான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இரவு வேளையில்” அல்லது “இரவின்போது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மக்கெதோனியாவைச் சேர்ந்த ஒரு மனிதன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கில், “மக்கெதோனியாவுக்குக் கடந்து வந்து, எங்களுக்கு உதவி செய்யுங்கள்.” கட்டளையுடன் வரும் இந்தப் பெயரெச்ச வடிவம், மக்கெதோனியாவுக்கு அக்கரை கடந்து வருமாறு அழைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: தரிசனம்
  rationale: அப்போஸ்தலர் பணிகள் நூலின் வெளிப்பாட்டு அனுபவச் சூழலில், தெய்வீகமாக அளிக்கப்பட்ட காட்சியை இயல்பாகவும் மரியாதையான நடையிலும் குறிக்கிறது.
- source_word: διὰ νυκτός
  choice: இரவில்
  rationale: தரிசனம் நிகழ்ந்த நேரத்தைக் குறிக்கும் கிரேக்கத் தொடரைச் சுருக்கமாகவும் இயல்பான நவீனத் தமிழிலும் தருகிறது.
- source_word: τῷ Παύλῳ ὤφθη
  choice: பவுலுக்கு ... தோன்றியது
  rationale: ὁράω என்பதன் இறப்புவினை வடிவத்தையும் கொடைவேற்றுமையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அனுபவத்தின் துல்லிய இயல்பை மேலும் வரையறுக்கவில்லை.
- source_word: ἀνὴρ Μακεδών τις
  choice: மக்கெதோனிய மனிதன் ஒருவன்
  rationale: ἀνήρ என்பதன் ஆண்பால் குறிப்பையும் τις என்பதன் வரையறுக்கப்படாத தன்மையையும் காக்கிறது.
- source_word: ἑστώς
  choice: நின்றுகொண்டு
  rationale: தரிசனத்தில் அந்த மனிதன் தொடர்ந்து நின்ற நிலையில் பேசுவதாகக் காட்சியை அமைக்கிறது.
- source_word: παρακαλῶν αὐτόν
  choice: அவரிடம் வேண்டிக்கொண்டான்
  rationale: உதவிக்கான ஆர்வமான வேண்டுகோளைத் தெரிவிக்கிறது; ‘கெஞ்சினான்’ போன்ற அளவுக்கு மீறிய உணர்ச்சி வலிமையைச் சேர்க்கவில்லை.
- source_word: Διαβάς εἰς Μακεδονίαν
  choice: மக்கெதோனியாவுக்கு வந்து
  rationale: கட்டளையோடு இணைந்த இறந்தகாலப் பெயரெச்சத்தின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; ‘கடந்து’ என்ற நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: βοήθησον ἡμῖν
  choice: எங்களுக்கு உதவி செய்யுங்கள்
  rationale: உதவிக்கான நேரடியான கட்டளையை தெளிவான, மரியாதையான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ὅραμα மற்றும் ὤφθη குறிக்கும் அனுபவத்தின் இயல்பு
  choice: பவுலுக்குத் தரிசனம் தோன்றியதாக மட்டும் மொழிபெயர்த்து, அது எவ்வகையான அனுபவம் என்பதை மேலதிகமாக வரையறுக்கவில்லை.
  alternative: கனவு, உள்ளார்ந்த உணர்த்துதல், அல்லது புறவயமான உருவத்தோற்றம் என்று குறிப்பாக்குதல்.
  rationale: மூலவாக்கியம் இதைத் ‘தரிசனம்’ என்று அழைத்து அது பவுலுக்குத் தோன்றியதாகக் கூறுகிறது; அதன் நிகழ்வுமுறையைத் துல்லியமாக விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தரிசனம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் காக்கப்பட்டுள்ளது; மற்ற அமைப்புகள் தேவையற்ற பழமையான நடையைத் தவிர்க்கின்றன.
