  to: அவர்களை நகர அதிகாரிகளிடம்[a] கொண்டுவந்து, “யூதர்களாகிய[b] இந்த மனிதர்கள் நமது நகரத்தைக் கலக்குகிறார்கள்” என்று சொன்னார்கள்.
