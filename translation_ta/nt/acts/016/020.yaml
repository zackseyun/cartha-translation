id: ACT.16.20
reference: Acts 16:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: ta
  text: அவர்களை நகர அதிகாரிகளிடம்[a] கொண்டுவந்து, “யூதர்களாகிய[b] இந்த மனிதர்கள் நமது நகரத்தைக் கலக்குகிறார்கள்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிரேட்டோர்கள்”; பிலிப்பி போன்ற ரோமக் குடியேற்ற நகரத்தில் இருந்த குடிமை அதிகாரிகள்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “யூதேயர்களாகிய.” கிரேக்கச் சொல் பொதுவாக யூதர்களையோ, குறிப்பாக யூதேயாவைச் சேர்ந்தவர்களையோ குறிக்கலாம்; இங்கு இன-சமய அடிப்படையிலான குற்றச்சாட்டுக்கு “யூதர்கள்” என்பதே சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: கொண்டுவந்து
  rationale: இறந்தகால வினையெச்சம், முதன்மை வினையான ‘சொன்னார்கள்’ என்பதற்கு முன் நிகழ்ந்த செயலைக் காட்டுகிறது; தமிழில் ‘கொண்டுவந்து’ இயல்பாக அந்தத் தொடர்ச்சியைத் தருகிறது.
- source_word: στρατηγοῖς
  choice: நகர அதிகாரிகளிடம்
  rationale: ரோமக் குடியேற்ற நகரமான பிலிப்பியில் நகர நிர்வாகத்தை நடத்திய தலைமை அதிகாரிகளை இது குறிக்கிறது. ‘நகர அதிகாரிகள்’ என்பது வரலாற்றுச் சூழலையும் பொதுவாசகர் புரிதலையும் இணைக்கிறது.
- source_word: ἐκταράσσουσιν
  choice: பெரும் குழப்பத்தை உண்டாக்குகிறார்கள்
  rationale: இந்த வினை கடுமையாகக் கலக்குதல் அல்லது குழப்பத்திற்குள்ளாக்குதல் என்ற வலுவான பொருளைக் கொண்டது; குற்றச்சாட்டின் தீவிரத்தை ‘பெரும் குழப்பம்’ வெளிப்படுத்துகிறது.
- source_word: ἡμῶν τὴν πόλιν
  choice: நமது நகரத்தில்
  rationale: ἡμῶν என்பதிலுள்ள குடிமை உரிமை உணர்வை ‘நமது’ காக்கிறது. தமிழில் குழப்பம் உண்டாக்கும் இடத்தை ‘நகரத்தில்’ என்று சொல்வது இயல்பானது.
- source_word: Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: இங்கு பவுலும் சீலாவும் உள்ளூர் ரோமக் குடிமை அடையாளத்துக்கு மாறான இன-சமயக் குழுவினர் எனக் குற்றஞ்சாட்டப்படுகிறார்கள்; புலம்பெயர் சூழலில் ‘யூதர்கள்’ என்பதே பொருத்தமானது.
- source_word: ὑπάρχοντες
  choice: யூதர்களாகிய
  rationale: அவர்களின் யூத அடையாளத்தைக் குற்றச்சாட்டுடன் சுருக்கமாக இணைக்கும் வினையெச்சத்தின் திறனை ‘-ஆகிய’ காக்கிறது; காரண உறவைத் தெளிவாகச் சேர்த்து விடவில்லை.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: இந்த மனிதர்கள்
  rationale: பவுல், சீலா ஆகிய குறிப்பிட்ட ஆண் நபர்களைக் குறிக்கிறது; ‘இந்த மனிதர்கள்’ என்பது நேரடியானதும் இயல்பானதும் ஆகும்.
theological_decisions:
- issue: பகைமையான இன-சமயக் குற்றச்சாட்டில் Ἰουδαῖοι என்பதன் மொழிபெயர்ப்பு
  choice: யூதர்கள்
  alternative: யூதேயர்கள்
  rationale: பிலிப்பி என்ற புலம்பெயர் சூழலில் இச்சொல் புவியியல் பிறப்பிடத்தை மட்டும் அல்லாமல் இன-சமய அடையாளத்தைச் சுட்டுகிறது. இது குற்றஞ்சாட்டுவோரின் பகைமையான கூற்று; யூதர்கள் அனைவரையும் பற்றிய கதைசொல்லியின் தீர்ப்பு அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. குற்றஞ்சாட்டுவோரின் குடிமைப் பெருமிதத்தை ‘நமது நகரம்’ என்பதும், குற்றச்சாட்டின் தீவிரத்தை ‘பெரும் குழப்பம்’ என்பதும் வெளிப்படுத்துகின்றன. [a], [b] ஆகிய அடிக்குறிப்புக் குறிகள் உரையில் உரிய சொற்களோடு இணைக்கப்பட்டுள்ளன.
