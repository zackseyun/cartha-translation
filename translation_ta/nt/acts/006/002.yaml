review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative progression, the Twelve, the collective body of disciples, the abandonment of God's word, and the contrast with practical service. However, “பந்திகளில் பணிசெய்வது” is not the clearest modern-standard Tamil expression for διακονεῖν τραπέζαις and can suggest work at dining rows rather than service associated with tables.
  naturalness: “மேசைகளில் சேவை செய்வது” is more immediately intelligible in modern standard Tamil while retaining the source's concise, non-specific reference to tables. “அழைத்துக்கூட்டி” is also a smoother Tamil rendering of the convening action.
  terminology: “பன்னிருவர்” and “தேவனுடைய வார்த்தை” are appropriate. The revision replaces the less current/contextually narrow “பந்திகளில்” with “மேசைகளில்,” which directly corresponds to τραπέζαις without deciding whether the service concerned meals, resources, or both.
  issues:
  - severity: medium
    issue: “பந்திகளில் பணிசெய்வது” is not sufficiently transparent modern-standard Tamil for “to serve tables.”
    rationale: “பந்தி” can evoke a meal line or dining arrangement and is less broadly understood than “மேசை.” The Greek names “tables” and leaves the precise practical administration open; “மேசைகளில் சேவை செய்வது” conveys this naturally without over-specifying the activity.
  revised_text: ஆகவே, பன்னிருவரும் சீடர்களின் முழுக் கூட்டத்தையும்[a] அழைத்துக்கூட்டி, “தேவனுடைய வார்த்தையை விட்டுவிட்டு மேசைகளில் சேவை செய்வது[c] எங்களுக்கு ஏற்றதல்ல[b]” என்றார்கள்.
