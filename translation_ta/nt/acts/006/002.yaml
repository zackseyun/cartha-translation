  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: ta
  text: ஆகவே, பன்னிருவரும் சீடர்களின் முழுக் கூட்டத்தையும்[a] அழைத்துக்கூட்டி, “தேவனுடைய வார்த்தையை விட்டுவிட்டு மேசைகளில் சேவை செய்வது[c] எங்களுக்கு ஏற்றதல்ல[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “சீடர்களின் முழு எண்ணிக்கையையும்” அல்லது “சீடர்களின் திரளையும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “எங்களுக்குப் பொருத்தமானதல்ல” அல்லது “எங்களால் ஏற்றுக்கொள்ளத்தக்கதல்ல.”
    reason: lexical_alternative
  - marker: c
    text: அதாவது, சமுதாயத்தின் உணவுகளுடனும் வளங்களுடனும் தொடர்புடைய நடைமுறைப் பகிர்வைக் கவனித்துக்கொள்வது.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: தங்களிடம் அழைத்து
  rationale: இடை வினையைக் கொண்ட இந்த இறந்தகாலப் பங்கேற்பு வடிவம், சீடர்களை ஒன்றுகூடும்படி பன்னிருவர் அழைத்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் எழுந்த குறைக்கு அடுத்ததாக நிகழும் பதிலைச் சுட்டும் கதைத் தொடர்ச்சியை வெளிப்படுத்துகிறது; இங்கே வலுவான முரண்பாடு இல்லை.
- source_word: οἱ δώδεκα
  choice: பன்னிருவர்
  rationale: கிரேக்கத்தில் உள்ள நிலையான குழுப் பெயரைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘அப்போஸ்தலர்கள்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: சீடர்களின் முழுக் கூட்டம்
  rationale: πλῆθος குறிக்கும் திரளான அல்லது மொத்தமாகக் கூடிய சீடர் குழுவைத் தெளிவான நவீன தமிழில் அளிக்கிறது; சொல்லின் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: எங்களுக்கு ஏற்றதல்ல
  rationale: ἀρεστόν என்பதிலுள்ள ‘ஏற்கத்தக்கது/பொருத்தமானது’ என்ற கருத்தைச் சூழலுக்கேற்ற வகையில் தருகிறது; நடைமுறைப் பணியை இழிவுபடுத்தும் அறநெறித் தீர்ப்பாக இதை மிகைப்படுத்தவில்லை.
- source_word: ἡμᾶς καταλείψαντας
  choice: விட்டுவிட்டு
  rationale: καταλείπω என்பதன் ‘பின்னால் விட்டுவிடுதல்’ என்ற வலுவைத் தக்கவைக்கிறது; வெறுமனே சிறிது நேரம் ஒதுக்குதல் என்ற மென்மையான பொருளாக மாற்றவில்லை.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: தேவனுடைய வார்த்தை
  rationale: λόγος என்பதன் நேரடியான வடிவத்தையும், அப்போஸ்தலர் நடபடிகளில் அது குறிக்கும் அறிவிக்கப்படும் இறைச்செய்தியின் பரந்த ஒலியையும் தக்கவைக்கிறது.
- source_word: διακονεῖν
  choice: பணிசெய்வது
  rationale: நடைமுறைச் சேவையைக் குறிக்கும் எளிய, தற்போதைய தமிழ்ச் சொற்றொடர்; பின்னாளில் உருவான குறிப்பிட்ட திருச்சபைப் பதவிப் பொருளை இதில் புகுத்தவில்லை.
- source_word: τραπέζαις
  choice: பந்திகளில்
  rationale: τραπέζαις என்பதன் ‘மேசைகள்/பந்திகள்’ என்ற உருவகத் திறப்பைத் தக்கவைக்கிறது. உணவு மற்றும் வளப் பகிர்வுடன் தொடர்புடைய சூழல் அடிக்குறிப்பில் விளக்கப்படுகிறது; முதன்மை உரையில் ‘நிதி’ அல்லது ‘உணவு விநியோகம்’ என்று ஒரே பொருளாக முடிவுசெய்யப்படவில்லை.
theological_decisions:
- issue: நடைமுறைச் சேவையுடன் ஒப்பிடுகையில் அப்போஸ்தலர்களின் முன்னுரிமை
  choice: தேவனுடைய வார்த்தையை விட்டுவிடுவது தங்களுக்கு ‘ஏற்றதல்ல’ என்று பன்னிருவர் கூறுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இது சரியல்ல’ அல்லது ‘இது விரும்பத்தக்கதல்ல’ என்று மொழிபெயர்த்தல்.
  rationale: இந்த வசனம் இருவகைப் பொறுப்புகளின் மதிப்பை அளவிடாமல், பன்னிருவரின் குறிப்பிட்ட அழைப்பும் முன்னுரிமையும் எது என்பதை வேறுபடுத்துகிறது. ஆகவே வார்த்தைப் பணியின் முன்னுரிமை பாதுகாக்கப்பட்டாலும், பந்திப் பணி தாழ்ந்தது என்ற கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம வாசிப்பிற்குரிய கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘பன்னிருவர்,’ ‘தேவனுடைய வார்த்தை,’ ‘பந்திகள்’ ஆகியவை மூலத்தின் சுருக்கத்தையும் இறையியல் திறப்பையும் காக்கின்றன; அடிக்குறிப்புகள் உண்மையான சொற்பொருள் மாற்றுகளையும் பண்பாட்டுச் சூழலையும் மட்டும் விளக்குகின்றன.
