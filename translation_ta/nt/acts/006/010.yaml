source:
  edition: SBLGNT
  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: ta
  text: அவர் பேசிய ஞானத்தையும், அவர் பேசுவதற்குத் துணைநின்ற ஆவியானவரையும் அவர்களால் எதிர்த்து நிற்க முடியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவி”; πνεύματι என்பது பரிசுத்த ஆவியைக் குறிக்காமல் ஸ்தேவானின் சொந்த ஆவியைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: அவர்களால் ... முடியவில்லை
  rationale: இங்கு இறந்தகாலத் தொடர்நிலை வடிவம் அவர்களுடைய இயலாமையை வெளிப்படுத்துகிறது; தமிழில் ‘அவர்களால் ... முடியவில்லை’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀντιστῆναι
  choice: எதிர்த்து நிற்க
  rationale: வாதத்தில் ஸ்தேவானுக்கு எதிராக நின்று தாக்குப்பிடிக்க முடியாத நிலையை இச்சொல் குறிக்கிறது; ‘எதிர்த்து நிற்க’ என்பது எதிர்ப்பையும் நிலைத்து நிற்கும் கருத்தையும் தக்கவைக்கிறது.
- source_word: σοφίᾳ
  choice: ஞானத்தையும்
  rationale: கிரேக்கச் சொல் ஸ்தேவானின் பேச்சில் வெளிப்பட்ட குறிப்பிட்ட ஞானத்தைக் குறிக்கிறது. தமிழில் சூழலும் இணைப்பு அமைப்பும் அந்தக் குறிப்புத்தன்மையை இயல்பாக உணர்த்துகின்றன.
- source_word: πνεύματι
  choice: ஆவியானவரையும்
  rationale: அப்போஸ்தலர் 6:5-இல் ஸ்தேவான் பரிசுத்த ஆவியால் நிறைந்தவர் எனக் கூறப்படுவதும், இங்கு ஞானத்தோடு ஆவி இணைக்கப்படுவதும் பரிசுத்த ஆவியையே முதன்மையான பொருளாகச் சுட்டுகின்றன. ‘ஆவியானவர்’ என்பது தமிழில் தனிப்பட்ட செயலாளரை மரியாதையுடன் குறிக்கிறது.
- source_word: ᾧ ἐλάλει
  choice: அவர் பேசிக்கொண்டிருந்த
  rationale: உறவுப்பெயரின் தத்திவேற்றுமை இங்கு ஸ்தேவானின் பேச்சை ஆவியானவர் இயக்கிய கருவி/மூல உறவாகக் குறிக்கலாம். தமிழில் நேரடியாக ‘ஆவியானவரால்’ எனச் சேர்த்தால் ஞானத்துடனான கூட்டு முன்னிலையைச் சுருக்கிவிடும்; பெயரெச்சத் தொடர் கிரேக்கத்தின் இரு தத்திவேற்றுமைப் பெயர்களுடனான தொடர்பைத் திறந்தவாறே வைத்திருக்கிறது. ‘பேசிக்கொண்டிருந்த’ என்பது இறந்தகாலத் தொடர்நிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: πνεύματι என்பது பரிசுத்த ஆவியைக் குறிக்கிறதா அல்லது ஸ்தேவானின் சொந்த ஆவியைக் குறிக்கிறதா?
  choice: ஆவியானவர்
  alternative: அவர் பேசிக்கொண்டிருந்த மனவலிமை/ஆவி
  rationale: அப்போஸ்தலர் நூலின் உடனடிச் சூழல் பரிசுத்த ஆவியையே வலுவாக ஆதரிக்கிறது. ஆயினும் கிரேக்கச் சொல் தனியே மனித ஆவியையும் குறிக்கக்கூடியதால், மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘எதிர்த்து நிற்க’ என்பது வாதத்தில் தாக்குப்பிடிக்க இயலாமையைத் தெளிவாகக் காட்டுகிறது. ‘ஆவியானவர்’ முதன்மை வாசிப்பாக வைக்கப்பட்டாலும், மூலத்தின் உண்மையான பொருள் சாத்தியம் அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
