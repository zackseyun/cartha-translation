id: ACT.6.8
reference: Acts 6:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Στέφανος δὲ πλήρης ⸀χάριτος καὶ δυνάμεως ἐποίει τέρατα καὶ σημεῖα μεγάλα ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: ta
  text: கிருபையும் வல்லமையும் நிறைந்த ஸ்தேவான்[a], மக்களிடையே பெரிய அற்புதங்களையும் அடையாளங்களையும் செய்துவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘கிருபையும் வல்லமையும் நிறைந்த’ என்பதற்குப் பதிலாக ‘விசுவாசமும் வல்லமையும் நிறைந்த’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: தனி இணைப்புச் சொல் இன்றி இயல்பான வாக்கியத் தொடர்ச்சி
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் கதையை முன்னெடுத்துச் செல்லும் மென்மையான இணைப்பாக உள்ளது. தமிழில் தனியாக ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது இல்லாத கால அல்லது முரண்பாட்டுப் பொருளைத் தோற்றுவிக்கும்.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: கிருபையும் வல்லமையும் நிறைந்த
  rationale: πλήρης உடன் வரும் உருபுகள் ஸ்தேவான் இப்பண்புகளால் நிறைந்திருந்ததைச் சொல்கின்றன. ‘கிருபை’ லூக்காவின் இறையியல் மற்றும் இலக்கிய ஒலிப்பைத் தக்கவைக்கிறது; ‘வல்லமை’ அற்புதச் செயல்களின் சூழலில் δύναμις என்பதன் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐποίει
  choice: செய்துவந்தார்
  rationale: இறந்தகால imperfect வடிவம் தொடர்ச்சியாக அல்லது வழக்கமாக நடைபெற்ற செயலைக் குறிக்கிறது; ‘செய்துவந்தார்’ அந்த அம்சத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: τέρατα καὶ σημεῖα
  choice: அற்புதங்களையும் அடையாளங்களையும்
  rationale: τέρατα வியப்பை உண்டாக்கும் செயல்களையும் σημεῖα அவற்றின் சுட்டிக்காட்டும் தன்மையையும் வலியுறுத்துகின்றன. இரு சொற்களையும் தனித்தனியாக மொழிபெயர்ப்பது மூலத்தின் இணையைப் பாதுகாக்கிறது.
- source_word: μεγάλα
  choice: பெரிய
  rationale: இந்தப் பெயரடை அற்புதங்கள், அடையாளங்கள் ஆகிய இரண்டையும் விவரிக்கிறது; ‘பெரிய’ அதன் பரந்த பொருளை மிகைவிளக்கம் இன்றி தருகிறது.
- source_word: ἐν τῷ λαῷ
  choice: மக்களிடையே
  rationale: செயல்கள் நிகழ்ந்த சமூகச் சூழலைக் குறிக்கும் இச்சொற்றொடருக்கு ‘மக்களிடையே’ இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: χάριτος / πίστεως என்ற பாட வேறுபாடு
  choice: கிருபை
  alternative: விசுவாசம்
  rationale: வழங்கப்பட்ட SBLGNT மூலப்பாடம் χάριτος (‘கிருபை’) என்று வாசிப்பதால் முதன்மைப் பாடத்தில் அதைப் பின்பற்றுகிறது. பொருளுள்ள ‘விசுவாசம்’ என்ற மாற்றுப் பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘ஸ்தேவான்’ என்பது தமிழ் வேதாகமப் பயன்பாட்டில் அறிமுகமான பெயர்வடிவம். ‘செய்துவந்தார்’ மூலத்தின் தொடர்ச்சிச் செயலைத் தெளிவாகக் காட்டுகிறது.
