  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: ta
  text: ஏனெனில், நாசரேயனாகிய இந்த இயேசு[a] இந்த இடத்தை[b] அழித்து, மோசே நமக்குக் கையளித்த வழக்கங்களை[c] மாற்றுவார் என்று அவர் சொல்வதை நாங்கள் கேட்டிருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாசரேத்தைச் சேர்ந்த இந்த இயேசு.”
    reason: lexical_alternative
  - marker: b
    text: “இந்த இடம்” என்பது ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “மோசே நமக்கு ஒப்படைத்த மரபுகளை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: நாங்கள் கேட்டிருக்கிறோம்
  rationale: ἀκούω என்பதன் நிறைவுக்கால வடிவம், கடந்தகாலத்தில் கேட்டதன் தற்போதைய பொருத்தத்தை உணர்த்துகிறது; தமிழில் ‘கேட்டிருக்கிறோம்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய குற்றச்சாட்டை விளக்கும் காரணத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: αὐτοῦ λέγοντος
  choice: இவன் சொல்வதை
  rationale: குற்றஞ்சாட்டுவோரின் நேரடியாகக் கேட்டதாகக் கூறும் உரையை இயல்பான தமிழில் தருகிறது; ‘இவன்’ சூழலிலுள்ள சற்றே இழிவான அல்லது பகைமையான சுட்டுதலை வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: நாசரேயனாகிய இந்த இயேசு
  rationale: Ναζωραῖος என்பதன் அடையாளப்படுத்தும் தன்மையையும் οὗτος என்பதன் வலியுறுத்தலையும் காக்கிறது.
- source_word: καταλύσει
  choice: அழித்து
  rationale: ஆலயத்தைக் குறிக்கும் ‘இந்த இடம்’ என்ற சூழலில், கட்டிடத்தை அழித்தல் அல்லது இடித்தல் என்ற பொருள் இயல்பானது.
- source_word: τὸν τόπον τοῦτον
  choice: இந்த இடத்தை
  rationale: கிரேக்கத்தின் பொதுவான ‘இடம்’ என்ற சொல்லை அப்படியே காத்து, ஆலயம் என்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: ἀλλάξει
  choice: மாற்றுவார்
  rationale: ἀλλάσσω என்பதன் எதிர்காலச் செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὰ ἔθη
  choice: வழக்கங்களை
  rationale: சமூகத்தில் வழிவழியாகப் பின்பற்றப்பட்ட நடைமுறைகள், ஒழுங்குகள் ஆகியவற்றைக் குறிக்கும் ἔθη என்பதற்கு நவீன தமிழில் தெளிவான இணை.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: மோசே நமக்குக் கையளித்த
  rationale: παραδίδωμι குறிக்கும் ஒப்படைத்தல் அல்லது தலைமுறைக்கு வழங்குதல் என்ற கருத்தைப் பாதுகாக்கிறது; ‘நமக்கு’ என்ற பெறுநரையும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: ‘இந்த இடம்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘இந்த இடம்’ என்று மொழிபெயர்த்து, ஆலயத்தைக் குறிக்கும் பொருளை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ‘இந்த ஆலயம்’ அல்லது ‘இந்தப் பரிசுத்த இடம்’
  rationale: கிரேக்கம் τὸν τόπον τοῦτον என்று மட்டுமே கூறுகிறது. சூழலில் அது ஆலயத்தைக் குறித்தாலும், குற்றஞ்சாட்டுவோரின் சொற்களை விளக்கமாக விரிவுபடுத்தாமல் காக்கிறது.
- issue: இயேசுவைப் பற்றிய குற்றச்சாட்டின் தொனி
  choice: ‘நாசரேயனாகிய இந்த இயேசு’ என்று சுட்டுவலியுறுத்தலைக் காத்தல்.
  alternative: ‘நாசரேத்தைச் சேர்ந்த இயேசு’
  rationale: οὗτος என்ற சுட்டுப்பெயரின் வலியுறுத்தலும் குற்றஞ்சாட்டுவோரின் பகைமையான தொனியும் மறையாமல் இருக்கிறது.
- issue: ஸ்தேவானைச் சுட்டும் தொனி
  choice: αὐτοῦ என்பதை ‘இவன்’ என்று வழங்குதல்.
  alternative: ‘அவர்’ அல்லது ‘அவன்’
  rationale: குற்றஞ்சாட்டுவோரின் பேச்சுச் சூழலில் உள்ள இகழ்ச்சியையோ தூரப்படுத்தலையோ இயல்பான தமிழில் காட்டுகிறது; கூடுதல் மரியாதையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, தெளிவான நடையைக் கடைப்பிடிக்கிறது. குற்றஞ்சாட்டுவோரின் பகைமையான சுட்டுதலை ‘இந்த இயேசு’ மற்றும் ‘இவன்’ என்பவை வெளிப்படுத்துகின்றன. மூலத்தின் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், காரணத் தொடர்பு, நேரடியாகக் கேட்டதாகும் கூற்று, இரண்டு எதிர்காலச் செயல்கள் ஆகியவற்றை இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
