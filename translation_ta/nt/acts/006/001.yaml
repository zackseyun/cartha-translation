source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: ta
  text: அந்நாட்களில், சீடர்களின் எண்ணிக்கை பெருகிக்கொண்டிருந்தபோது, ஹெலனிஸ்தர்களிடமிருந்து எபிரெயர்களுக்கு எதிராக ஒரு முணுமுணுப்பு எழுந்தது[a]; ஏனெனில், அன்றாடப் பகிர்ந்தளிப்பில்[b] அவர்களுடைய விதவைகள் கவனிக்கப்படாமல் விடப்பட்டுவந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஹெலனிஸ்தர்கள்” என்போர், “எபிரெயர்கள்” என்போருக்கு மாறாக, பெரும்பாலும் கிரேக்க மொழியைப் பயன்படுத்திய யூதர்களைக் குறிக்கலாம்; “எபிரெயர்கள்” பெரும்பாலும் அரமேய அல்லது எபிரெய மொழியைப் பயன்படுத்திய யூதர்களைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: “கவனிக்கப்படாமல் விடப்பட்டுவந்தனர்” என்பதற்கு “புறக்கணிக்கப்பட்டுவந்தனர்” என்றும் மொழிபெயர்க்கலாம். “அன்றாடப் பகிர்ந்தளிப்பு” என்பதற்கு “அன்றாடச் சேவை” அல்லது “அன்றாட ஊழியம்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: அந்நாட்களில்
  rationale: காலச் சூழலை இயல்பான தமிழில் தருகிறது; δέ-யின் மென்மையான உரைத் தொடர்ச்சி தமிழில் தனிச் சொல்லால் மிகைப்படுத்தப்படவில்லை.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: சீடர்களின் எண்ணிக்கை பெருகிக்கொண்டிருந்தபோது
  rationale: எண்ணிக்கையிலான வளர்ச்சியையும் பின்னணிச் சூழலைக் குறிக்கும் genitive absolute அமைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐγένετο γογγυσμός
  choice: முறையிட்டார்கள்
  rationale: γογγυσμός குறிக்கும் அதிருப்தியுடனான முறையீட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; வெறும் முணுமுணுப்பாகக் குறுக்கவில்லை.
- source_word: τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους
  choice: கிரேக்கமொழி பேசும் யூதர்கள் எபிரெயமொழி பேசும் யூதர்களுக்கு எதிராக
  rationale: வரலாற்றுக் குழுப் பெயர்களின் இச்சூழலுக்குரிய மொழி-பண்பாட்டு வேறுபாட்டை வாசகருக்குத் தெளிவாக்குகிறது; πρός குறிக்கும் புகாரின் இலக்கை ‘எதிராக’ வெளிப்படுத்துகிறது.
- source_word: παρεθεωροῦντο
  choice: கவனிக்கப்படாமல் விடப்பட்டதாக
  rationale: முற்றாத காலப் passive வடிவம் குறிக்கும் தொடர்ச்சியான புறக்கணிப்பை வெளிப்படுத்துகிறது; அது வேண்டுமென்றே செய்யப்பட்டதாகத் தீர்மானிக்கவில்லை.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: அன்றாடப் பகிர்ந்தளிப்பில்
  rationale: διακονία பொதுவாக சேவை அல்லது ஊழியம் எனப் பொருள்படலாம்; விதவைகளுக்கான பொருள் உதவி பற்றிய உடனடிச் சூழலில் ‘பகிர்ந்தளிப்பு’ பொருத்தமான குறிப்பான பொருளைத் தருகிறது.
- source_word: αἱ χῆραι αὐτῶν
  choice: தங்கள் விதவைகள்
  rationale: αὐτῶν இயல்பாக கிரேக்கமொழி பேசும் யூதர்களைக் குறிக்கும் உறவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: Ἑλληνισταί மற்றும் Ἑβραῖοι என்னும் சமூக-மொழிக் குழுப் பெயர்கள்
  choice: முதன்மை உரையில் ‘கிரேக்கமொழி பேசும் யூதர்கள்’ மற்றும் ‘எபிரெயமொழி பேசும் யூதர்கள்’ என்று தருதல்
  alternative: ‘எலெனியர்கள்’ மற்றும் ‘எபிரெயர்கள்’ என்று ஒலிபெயர்த்து அடிக்குறிப்பில் விளக்குதல்
  rationale: இவை முதல்நூற்றாண்டு யூதர்களுக்குள் இருந்த மொழி-பண்பாட்டு வேறுபாட்டைக் குறிக்கின்றன. தமிழில் வெறும் ஒலிபெயர்ப்பு சாதாரண வாசகருக்குப் பொருள் தராததால், பெரும்பாலும் ஏற்றுக்கொள்ளப்படும் குறிப்பை உரையில் தெளிவாக்குகிறது; துல்லியத்தின் வரம்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: διακονία என்பதன் பரப்பளவு
  choice: சூழலுக்கேற்ப ‘பகிர்ந்தளிப்பு’
  alternative: ‘அன்றாடச் சேவை’ அல்லது ‘அன்றாட ஊழியம்’
  rationale: அடுத்துவரும் சூழலும் விதவைகள் பற்றிய குறிப்பும் பொருள் உதவியைப் பகிர்ந்தளிப்பதைச் சுட்டுகின்றன; எனினும் மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
