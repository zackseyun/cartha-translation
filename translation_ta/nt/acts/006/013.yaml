source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: ta
  text: மேலும், “இந்த மனிதன் இந்தப் பரிசுத்த இடத்துக்கும்[a] திருச்சட்டத்துக்கும் எதிராகப் பேசுவதை[c] நிறுத்துவதே இல்லை[b]” என்று கூறிய பொய்ச் சாட்சிகளை அவர்கள் முன்நிறுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்தப் பரிசுத்த இடம்” என்பதற்கு “பரிசுத்த இடம்” என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் கிரேக்கச் சொற்றொடர் குறிப்பாக ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பேசுவதை நிறுத்துவதில்லை.”
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் சொல்லர்த்தமாக, “எதிராக வார்த்தைகளைப் பேசுவதை”; இயல்பான தமிழில் “எதிராகப் பேசுவதை” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: முன்நிறுத்தினார்கள்
  rationale: நீதிமன்றச் சூழலில் சாட்சிகளை ஆஜர்படுத்தி முன்னிலைப்படுத்திய செயலை இயல்பான தமிழில் தெரிவிக்கிறது; அவர்களை ஏற்பாடு செய்த பகைமைச் சூழலையும் அளவுக்கு மீறாமல் உணர்த்துகிறது.
- source_word: τε
  choice: மேலும்
  rationale: முந்தைய செயலுடன் இந்தச் செயலையும் சேர்த்துக் கூறும் தொடர்ச்சியான, சேர்க்கைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: μάρτυρας ψευδεῖς
  choice: பொய்ச் சாட்சிகள்
  rationale: பொய்யான சாட்சியம் அளிப்பவர்களைக் குறிக்கும் வழக்கமான சட்டவியல் சொல்லாட்சி.
- source_word: λέγοντας
  choice: என்று கூறிய
  rationale: பங்கேற்பு வினை வடிவத்தை இயல்பான தமிழ் உறவுத் தொடராக மாற்றி, அடுத்து வரும் குற்றச்சாட்டைச் சாட்சிகளோடு தெளிவாக இணைக்கிறது.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: இந்த மனிதன்
  rationale: சூழலிலுள்ள இகழ்ச்சிச் சாயலை அதிகப்படுத்தாமல், நேரடியான சுட்டுதலைப் பாதுகாக்கிறது.
- source_word: οὐ παύεται
  choice: நிறுத்துவதே இல்லை
  rationale: தொடர்ந்து செய்துவருவதாகக் கூறும் குற்றச்சாட்டின் நீடித்த தன்மையை நவீன தமிழில் வலியுறுத்துகிறது.
- source_word: λαλῶν ῥήματα
  choice: பேசுவதை
  rationale: கிரேக்க மொழியில் உள்ள ‘வார்த்தைகளைப் பேசுதல்’ என்ற சொற்றொடரைத் தமிழில் தேவையற்ற மறுகூறலின்றி இயல்பாக வழங்குகிறது; வெளிப்படையான சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατὰ
  choice: எதிராக
  rationale: பகைமையான சட்டக் குற்றச்சாட்டில் எதிர்ப்பைக் குறிக்கும் பொருளைத் துல்லியமாகத் தெரிவிக்கிறது.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: இந்தப் பரிசுத்த இடம்
  rationale: கிரேக்கத்தில் நேரடியான சுட்டுப்பெயர் இல்லாவிட்டாலும், பேசுவோர் இருக்கும் சூழலில் குறிப்பாக அறியப்பட்ட எருசலேம் ஆலயத்தைச் சுட்டும் இடச்சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: νόμου
  choice: திருச்சட்டம்
  rationale: இந்த யூதச் சூழலில் மோசேயின் சட்டத்தைக் குறிக்கிறது என்பதைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது; ‘மோசேயின்’ என்று மூலத்தில் இல்லாத சொல்லைச் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘பரிசுத்த இடம்’ மற்றும் ‘திருச்சட்டம்’ என்பவற்றின் குறிப்பு
  choice: குற்றச்சாட்டு எருசலேம் ஆலயத்தையும் மோசேயின் சட்டத்தையும் குறிக்கிறது.
  alternative: பொதுவாக ஏதாவது புனித இடத்தையும் சட்ட மரபையும் குறிப்பதாகக் கொள்ளுதல்.
  rationale: உடனடியான கதைச்சூழல் ஸ்தேவான்மீது ஆலயத்தையும் மோசேயையும் சார்ந்து சுமத்தப்பட்ட குற்றச்சாட்டைப் பற்றியது. எனினும், மொழிபெயர்ப்பு மூலத்தின் சொற்களை விரிவான விளக்கவுரையாக மாற்றவில்லை.
- issue: குற்றச்சாட்டின் தொனி
  choice: பகைமையான சட்டவியல் தொனியைப் பாதுகாத்து, ‘எதிராகப் பேசுதல்’ என்று வழங்குதல்.
  alternative: ‘தூஷித்தல்’ அல்லது ‘அவதூறு கூறுதல்’ போன்ற வலுவான விளக்கச் சொற்களைப் பயன்படுத்துதல்.
  rationale: இந்தச் சாட்சியம் பொய்யானது என்று கதை கூறினாலும், சாட்சிகளின் சொற்கள் ‘எதிராகப் பேசுதல்’ என்பதே; அதைவிட வலுவான இறையியல் அல்லது சட்டத் தீர்ப்பை மொழிபெயர்ப்பில் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், கண்ணியமான சட்டவியல் நடை பயன்படுத்தப்பட்டுள்ளது. வாக்கியத்தின் மேற்கோள் அமைப்பும் தொடர்ச்சியான குற்றச்சாட்டின் வலிமையும் பாதுகாக்கப்பட்டுள்ளன; செயற்கையான சொல்-சொல் மொழிபெயர்ப்பு தவிர்க்கப்பட்டுள்ளது.
