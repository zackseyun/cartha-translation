  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: ta
  text: ஆனால், ‘விடுதலைபெற்றவர்களின் தொழுகைக்கூடம்’[a] என்று அழைக்கப்பட்ட தொழுகைக்கூடத்தைச் சேர்ந்தவர்களிலும், சிரேனே மற்றும் அலெக்சாந்திரியாவைச் சேர்ந்தவர்களிலும், சிலிசியா மற்றும் ஆசியா[b] பகுதிகளைச் சேர்ந்தவர்களிலும் சிலர் எழுந்து ஸ்தேவானுடன் வாதாடினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘லிபெர்த்தீனர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் விடுதலைபெற்ற முன்னாள் அடிமைகளையோ, அத்தகையோரின் வழித்தோன்றல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள ‘ஆசியா’ என்பது நவீன ஆசியக் கண்டத்தை அல்ல; மேற்கு ஆசியா மைனரில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: எழுந்து
  rationale: எதிர்ப்புச் செயல் தொடங்குவதைச் சுட்டும் ‘எழுந்தார்கள்’ என்ற நேரடியான படிமத்தைத் தக்கவைக்கிறது; தமிழில் தொடர்வினையாக இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து எதிர்ப்பு நோக்கிய மென்மையான முரண்பாட்டுத் திருப்பத்தைக் காட்டுகிறது.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: தொழுகைக்கூடத்தைச் சேர்ந்த சிலரும்
  rationale: குறிப்பிடப்படாத ஒரு பகுதியினரைச் சுட்டும் பங்கீட்டு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: συναγωγῆς
  choice: தொழுகைக்கூடம்
  rationale: யூதர்களின் கூடுகை அல்லது வழிபாட்டு இடத்தைக் குறிக்கும் சொல்லுக்கு நவீன வாசகர்கள் புரிந்துகொள்ளக்கூடிய தமிழ்ச் சொல்.
- source_word: τῆς λεγομένης
  choice: என்று அழைக்கப்பட்ட
  rationale: அந்தத் தொழுகைக்கூடத்தின் அறியப்பட்ட பெயரை நடுநிலையாகக் குறிக்கிறது.
- source_word: Λιβερτίνων
  choice: விடுதலை பெற்றவர்கள்
  rationale: அடிமைத்தனத்திலிருந்து விடுவிக்கப்பட்டவர்களையோ அவர்களது வழித்தோன்றல்களையோ குறிக்கும் வரலாற்றுப் பொருளை வழங்குகிறது.
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: சிரேனே மற்றும் அலெக்சாந்திரியாவைச் சேர்ந்த சிலர்
  rationale: இடப்பெயரிலிருந்து உருவான மக்களினப் பெயர்களைத் தமிழில் தெளிவான தோற்றக் குறிப்பாக வழங்குகிறது.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: சிலிசியா மற்றும் ஆசியா பகுதிகளைச் சேர்ந்த சிலர்
  rationale: ἀπό குறிக்கும் புவியியல் தோற்றத்தை இயல்பாக வெளிப்படுத்துகிறது; ‘ஆசியா’வின் வரலாற்றுப் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: συζητοῦντες τῷ Στεφάνῳ
  choice: ஸ்தேவானோடு வாதிட்டார்கள்
  rationale: இச்சூழலில் நடுநிலையான உரையாடலைவிட வாய்மொழி எதிர்ப்பையும் விவாதத்தையும் குறிக்கிறது; கிரேக்க நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்ச்சித் தன்மையை மிகைப்படுத்தாமல் தருகிறது.
