  text: ἡμεῖς δὲ τῇ προσευχῇ καὶ τῇ διακονίᾳ τοῦ λόγου προσκαρτερήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: ta
  text: ஆனால் நாங்களோ ஜெபத்திலும் வார்த்தையின் ஊழியத்திலும்[a] தொடர்ந்து ஈடுபட்டிருப்போம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வார்த்தைப் பணி.” கிரேக்கச் சொல் “பணி,” “சேவை,” அல்லது “ஊழியம்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: நாங்களோ
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடம்பெறும் முதலாம் நபர் பன்மைப் பெயர்ச்சொல் வலியுறுத்தலையும், முந்தைய வசனங்களில் கூறப்பட்ட மற்றவர்களின் பணியோடு உள்ள வேறுபாட்டையும் காட்டுகிறது. தமிழ் ‘நாங்களோ’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: மேசைப் பணியை மற்றவர்கள் கவனிப்பதற்கும் அப்போஸ்தலர்கள் மேற்கொள்ளும் பணிக்கும் இடையிலான வேறுபாட்டைக் குறிக்கிறது.
- source_word: τῇ προσευχῇ
  choice: ஜெபத்திலும்
  rationale: προσκαρτερέω என்பதுடன் வரும் வேற்றுமை, தொடர்ந்து அர்ப்பணித்திருக்க வேண்டிய செயலைக் குறிக்கிறது. ‘ஜெபத்திலும்’ என்பது இயல்பான, திருச்சபைச் சூழலில் பரவலாகப் புரியக்கூடிய தமிழ்.
- source_word: διακονίᾳ
  choice: ஊழியத்திலும்
  rationale: διακονία என்பதற்கு ‘பணி/சேவை’ அல்லது ‘ஊழியம்’ என்று பொருள் வரலாம். இங்கு வார்த்தையை அறிவிக்கும் அப்போஸ்தலப் பொறுப்பைக் குறிக்க ‘ஊழியம்’ பொருத்தமானது; இருப்பினும் அதன் சேவைத் தன்மையை மறைக்காமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ λόγου
  choice: வார்த்தையின்
  rationale: λόγος இங்கு அறிவிக்கப்படும் தேவசெய்தியைக் குறிக்கிறது. ‘வார்த்தை’ என்பது மூலத்தின் சொல் வடிவை வெளிப்படையாக வைத்திருப்பதுடன் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டிலும் புரிந்துகொள்ளக்கூடியது.
- source_word: προσκαρτερήσομεν
  choice: உறுதியாக நிலைத்திருப்போம்
  rationale: எதிர்கால வினை வடிவம் தொடர்ந்து விடாமுயற்சியுடன் ஈடுபட்டிருப்பதைக் குறிக்கிறது. ‘உறுதியாக நிலைத்திருப்போம்’ அதன் நீடித்த அர்ப்பணிப்பையும் உறுதியையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: உடனடி சூழலில் மேசைப் பணியுடன் ஒப்பிடப்படும் διακονία என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: வார்த்தையின் ஊழியம்
  alternative: வார்த்தைப் பணி / வார்த்தைக்கான சேவை
  rationale: ஒரே சேவை சார்ந்த சொற்புலமே நடைமுறைப் பணிக்கும் வார்த்தையை அறிவிக்கும் பணிக்கும் பின்னணியாக உள்ளது. ‘ஊழியம்’ இங்குள்ள நியமிக்கப்பட்ட அறிவிப்புப் பொறுப்பைத் தெளிவுபடுத்துகிறது; அதேவேளை மூலத்தில் இல்லாத கடுமையான குருத்துவம்–பொதுமக்கள் பிரிவைச் சேர்க்கவில்லை. உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நாங்களோ’ மூலம் மூலத்தின் வலியுறுத்தல் இயல்பாகக் காக்கப்படுகிறது. ‘ஜெபம்,’ ‘வார்த்தை,’ ‘ஊழியம்’ ஆகியவை பரிச்சயமான சொற்களாக இருந்தாலும் வாக்கிய அமைப்பு பழமையானதாக இல்லாமல் வைக்கப்பட்டுள்ளது.
