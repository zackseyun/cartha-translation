revisions:
- from: ஆனால் நாங்களோ ஜெபத்திலும் வார்த்தையின் ஊழியத்திலும்[a] உறுதியாக நிலைத்திருப்போம்.
  to: ஆனால் நாங்களோ ஜெபத்திலும் வார்த்தையின் ஊழியத்திலும்[a] தொடர்ந்து ஈடுபட்டிருப்போம்.
  rationale: The revision changes only the final verb phrase so that the Tamil more closely reflects the sustained, devoted persistence expressed by προσκαρτερήσομεν. The contrast, prayer, and the deliberately broad service/ministry sense of διακονία are preserved; the footnote retains the relevant lexical alternative.
