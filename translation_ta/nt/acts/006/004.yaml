review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explicit contrast in ἡμεῖς δέ (‘ஆனால் நாங்களோ’), prayer, and the word-related διακονία. However, ‘உறுதியாக நிலைத்திருப்போம்’ primarily expresses standing firm and does not adequately convey προσκαρτερήσομεν, which denotes persisting devotedly in an activity.
  naturalness: The sentence is generally clear and uses familiar modern Tamil Christian vocabulary. ‘தொடர்ந்து ஈடுபட்டிருப்போம்’ is more idiomatic in this collocation and better expresses sustained committed attention to prayer and the ministry/service of the word.
  terminology: ‘ஜெபம்,’ ‘வார்த்தை,’ and ‘ஊழியம்’ are suitable, dignified modern-standard Tamil terms. Retaining the lexical alternative in the footnote appropriately prevents ‘ஊழியம்’ from implying a technical clerical office.
  issues:
  - severity: medium
    issue: The rendering of προσκαρτερήσομεν is too static.
    rationale: ‘உறுதியாக நிலைத்திருப்போம்’ can mean ‘we will stand firm,’ whereas the Greek future verb conveys continued persistence/devotion in prayer and word-service. Replacing it with ‘தொடர்ந்து ஈடுபட்டிருப்போம்’ retains the ongoing aspect without adding interpretation.
  revised_text: ஆனால் நாங்களோ ஜெபத்திலும் வார்த்தையின் ஊழியத்திலும்[a] தொடர்ந்து ஈடுபட்டிருப்போம்.
  revised_footnotes:
  - marker: a
    text: அல்லது, “வார்த்தைப் பணி.” கிரேக்கச் சொல் “பணி,” “சேவை,” அல்லது “ஊழியம்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
  revision_rationale: The revision changes only the final verb phrase so that the Tamil more closely reflects the sustained, devoted persistence expressed by προσκαρτερήσομεν. The contrast, prayer, and the deliberately broad service/ministry sense of διακονία are preserved; the footnote retains the relevant lexical alternative.
