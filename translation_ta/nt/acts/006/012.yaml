source:
  edition: SBLGNT
  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: ta
  text: அவர்கள் மக்களையும் மூப்பர்களையும் வேத அறிஞர்களையும் தூண்டிவிட்டார்கள்; அவரிடம் திடீரென வந்து, அவரைப் பிடித்து, யூதத் தலைமை மன்றத்தின்[a] முன் கொண்டுபோனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மன்றம்.” இங்குள்ள கிரேக்கச் சொல் பொதுவாக ஒரு மன்றத்தைக் குறிக்கலாம்; இந்தச் சூழலில் அது ‘சனெட்ரின்’ எனப்படும் யூத ஆளும் மன்றத்தைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: தூண்டிவிட்டார்கள்
  rationale: மக்களை உணர்ச்சிவசப்படுத்தி எதிராகச் செயல்படச் செய்த causative பொருளை இயல்பான நவீன தமிழில் தருகிறது; வன்முறையைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: τε
  choice: அதனால்
  rationale: முந்தைய நிகழ்வின் தொடர்ச்சியையும் விளைவையும் இயல்பாக இணைக்கிறது; τέ-யின் மென்மையான இணைப்புச் செயல்பாட்டைத் தமிழில் தனி வலியுறுத்தலின்றி வெளிப்படுத்துகிறது.
- source_word: τὸν λαὸν
  choice: மக்களை
  rationale: λαός என்பதன் பொதுவான பொருளைத் தெளிவாகத் தருகிறது; ‘கூட்டம்’ என்று சூழலைக் குறுகச் செய்யவில்லை.
- source_word: τοὺς πρεσβυτέρους
  choice: மூப்பர்களை
  rationale: இங்கு வெறும் வயதான ஆண்கள் அல்லாமல் அங்கீகரிக்கப்பட்ட யூதத் தலைவர்களைக் குறிக்கும் வரலாற்றுச் சொல்லைத் தக்கவைக்கிறது.
- source_word: τοὺς γραμματεῖς
  choice: வேத அறிஞர்களை
  rationale: எழுத்தர்களாக மட்டும் அல்லாமல் வேதம் மற்றும் சட்டத்தில் தேர்ச்சிபெற்ற அங்கீகரிக்கப்பட்ட அறிஞர்களைக் குறிக்கும் சூழல்சார் பொருளை சாதாரண வாசகருக்குத் தெளிவாகக் கூறுகிறது.
- source_word: ἐπιστάντες
  choice: திடீரென அவரை அணுகி
  rationale: ἐφίστημι இங்கு உணர்த்தும் திடீர் நெருங்குதலைக் காக்கிறது; ‘அவர்மேல் பாய்ந்து’ போன்ற அதிகப்படியான வன்முறைச் சாயலைச் சேர்க்கவில்லை.
- source_word: συνήρπασαν
  choice: அவரைப் பிடித்து
  rationale: வலுக்கட்டாயமாகக் கைப்பற்றியதை இயல்பான தமிழில் தெரிவிக்கிறது; அடுத்துள்ள கொண்டு செல்லும் வினையின் பொருளை முன்கூட்டியே சேர்க்கவில்லை.
- source_word: ἤγαγον
  choice: கொண்டுபோனார்கள்
  rationale: முந்தைய வலுக்கட்டாயப் பிடிப்பைத் தொடர்ந்து அவரை அங்கே அழைத்துச் சென்ற நிகழ்வைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὸ συνέδριον
  choice: யூதத் தலைமைச் சங்கம்
  rationale: எருசலேம் சூழலில் இது சனெட்ரின் எனப்படும் யூத ஆளும் மன்றத்தைக் குறிக்கிறது. தமிழில் புரியாத ஒலிபெயர்ப்பை மட்டும் பயன்படுத்தாமல் அதன் நிறுவனத் தன்மையைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: συνέδριον என்பதன் வரலாற்று அடையாளம்
  choice: யூதத் தலைமைச் சங்கம்
  alternative: சங்கம்; சனெட்ரின்
  rationale: மூப்பர்களும் வேத அறிஞர்களும் இடம்பெறும் எருசலேம் நீதிமன்றச் சூழல், குறிப்பிட்ட யூத ஆளும் மன்றத்தைக் காட்டுகிறது. அதேவேளை கிரேக்கச் சொல்லின் பொதுவான ‘சங்கம்/மன்றம்’ என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: εἰς τὸ συνέδριον என்ற இலக்கைத் தமிழில் வெளிப்படுத்துதல்
  choice: சங்கத்தின் முன்
  alternative: சங்கத்திற்குக் கொண்டுபோனார்கள்
  rationale: ஒரு நீதித்துறை மன்றத்தின் முன்னிலையில் நிறுத்துவதைக் குறிக்கும் சூழலில் ‘முன்’ என்பது இயல்பான தமிழும் கருத்தளவில் துல்லியமானதும் ஆகும்; கிரேக்க முன்னிடைச்சொல்லை இடவியல் அர்த்தத்தில் மட்டும் கடினமாகப் பிரதிபலிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வரலாற்றுச் சிறப்பைத் தெளிவாக்க ‘யூதத் தலைமைச் சங்கம்’ பயன்படுத்தப்பட்டுள்ளது; ‘சனெட்ரின்’ என்ற ஒலிபெயர்ப்பு அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
