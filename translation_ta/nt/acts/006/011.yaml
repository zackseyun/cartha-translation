source:
  edition: SBLGNT
  text: τότε ὑπέβαλον ἄνδρας λέγοντας ὅτι Ἀκηκόαμεν αὐτοῦ λαλοῦντος ῥήματα βλάσφημα εἰς Μωϋσῆν καὶ τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: ta
  text: அப்போது அவர்கள் ஆண்களை இரகசியமாகத் தூண்டி, “அவன் மோசேக்கும் கடவுளுக்கும் எதிராகத் தெய்வநிந்தனையான வார்த்தைகளைப் பேசுவதை நாங்கள் கேட்டிருக்கிறோம்” என்று சொல்ல வைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்களைத் தூண்டினார்கள்” அல்லது “ஆண்களை மறைவாக உடந்தையாக்கினார்கள்.” கிரேக்க வினைச்சொல் மறைவாகத் தூண்டுதல் அல்லது சொல்லும்படி ஏற்பாடு செய்தல் என்ற பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதையில் அடுத்த செயலை அறிமுகப்படுத்தும் இயல்பான கால இணைப்பாக உள்ளது.
- source_word: ὑπέβαλον
  choice: இரகசியமாகத் தூண்டி ... சொல்ல வைத்தார்கள்
  rationale: மறைவாகத் தூண்டுதல் அல்லது சொல்லும்படி ஏற்பாடு செய்தல் என்ற வஞ்சகமான செயற்பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄνδρας
  choice: சில ஆண்களை
  rationale: ἀνήρ இங்கு ஆண் நபர்களையே குறிக்கிறது; தமிழில் எண்ணிக்கை நிர்ணயிக்கப்படாத பன்மையை இயல்பாக்க ‘சில’ சேர்க்கப்பட்டுள்ளது.
- source_word: λέγοντας
  choice: என்று சொல்ல வைத்தார்கள்
  rationale: ὑπέβαλον என்பதுடன் சேர்ந்த பங்கேற்பு வடிவத்தின் காரணவினைப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: Ἀκηκόαμεν
  choice: நாங்கள் கேட்டிருக்கிறோம்
  rationale: கேட்டதன் விளைவு தற்போதும் நிலவுவதை உணர்த்தும் நிறைவுக் காலத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: αὐτοῦ λαλοῦντος
  choice: இவன் ... பேசுவதை
  rationale: குற்றஞ்சாட்டுவோரின் நேரடிக் கூற்றில் குறிப்பிடப்படும் ஸ்தேவானை இயல்பாகச் சுட்டி, தொடர்ந்து பேசும் செயலைக் காட்டுகிறது.
- source_word: ῥήματα βλάσφημα
  choice: தெய்வநிந்தனையான வார்த்தைகளை
  rationale: சமய-சட்ட குற்றச்சாட்டின் தீவிரத்தைப் பாதுகாக்கிறது; வெறும் ‘அவதூறு’ என்று மென்மையாக்கவில்லை.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: மோசேக்கும் கடவுளுக்கும் எதிராக
  rationale: பகைமையான குற்றச்சாட்டுச் சூழலில் εἰς காட்டும் எதிர்நோக்கிய தாக்குதலை ‘எதிராக’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஸ்தேவானுக்கு எதிரான தெய்வநிந்தனைக் குற்றச்சாட்டின் தன்மை
  choice: அவர்கள் ‘தெய்வநிந்தனையான வார்த்தைகள்’ என்று குற்றஞ்சாட்டியதாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவதூறான வார்த்தைகள்’ என்று மொழிபெயர்த்தல்.
  rationale: βλάσφημα என்பதன் சமய-சட்ட வலிமையைப் பாதுகாக்கிறது. அதேவேளையில், இது தூண்டப்பட்ட ஆட்களின் கூற்றாகவே காட்டப்படுவதால் மொழிபெயர்ப்பு அந்தக் குற்றச்சாட்டை உண்மை என்று ஏற்றுக்கொள்வதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தெய்வநிந்தனை’ என்ற சமய-சட்டச் சொல்லின் துல்லியம் காக்கப்பட்டது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
