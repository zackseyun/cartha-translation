source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: ta
  text: ஆலோசனைச் சங்கத்தில்[a] அமர்ந்திருந்த அனைவரும் அவரை உற்றுப் பார்த்து, அவருடைய முகம் ஒரு தேவதூதரின் முகம்போல் இருந்ததைக் கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சன்ஹெட்ரின் மன்றத்தில்.’ கிரேக்கச் சொல் யூதர்களின் ஆளும் ஆலோசனைச் சங்கத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: உற்றுப் பார்த்து
  rationale: இது வெறுமனே பார்ப்பதையல்ல, ஒருவர்மீது பார்வையைப் பதித்து கூர்ந்து நோக்குவதைக் குறிக்கிறது. ‘உற்றுப் பார்த்து’ என்பது அந்தத் தீவிரத்தையும் தொடர்ச்சியான கவனத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: πάντες οἱ καθεζόμενοι
  choice: அமர்ந்திருந்த அனைவரும்
  rationale: πάντες என்பதன் முழுமையையும் καθεζόμενοι என்பதன் அமர்ந்திருந்த நிலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: συνεδρίῳ
  choice: ஆலோசனைச் சங்கம்
  rationale: இச்சூழலில் இது யூத ஆளும் மன்றத்தைக் குறிக்கிறது. ‘ஆலோசனைச் சங்கம்’ என்பது பொருளைத் தமிழில் நேரடியாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் தருகிறது; ‘சனெட்ரின்’ என்ற பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πρόσωπον
  choice: முகம்
  rationale: இங்கு ஸ்தேவானின் கண்ணுக்குத் தெரிந்த முகத்தையே நேரடியாகக் குறிக்கிறது; ‘முகம்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ὡσεὶ
  choice: முகத்தைப்போல்
  rationale: ὡσεὶ ஒரு ஒப்புமையைக் குறிக்கிறது. ‘போல்’ என்பது அதன் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀγγέλου
  choice: ஒரு தேவதூதர்
  rationale: இக்கதைச் சூழலில் ἄγγελος என்பது சாதாரண மனிதத் தூதுவரைவிட விண்ணுலகத் தூதரைக் குறிக்கிறது. ‘தேவதூதர்’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ‘ஒரு தேவதூதரின் முகத்தைப்போல்’ என்ற ஒப்புமையின் தன்மை
  choice: ஸ்தேவானின் முகம் ஒரு தேவதூதரின் முகத்தை ஒத்திருந்ததாக மட்டும் மொழிபெயர்த்து, அந்த ஒற்றுமையின் குறிப்பிட்ட தன்மையை வரையறுக்காமல் வைத்தல்
  alternative: அவருடைய முகம் ஒளிவீசியதாகவோ, அமைதியான குற்றமற்ற தன்மையையோ, விண்ணுலக அதிகாரத்தையோ குறிப்பாகச் சுட்டுவதாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை ஒற்றுமையைச் சொல்கிறது; ஆனால் அது ஒளி, அமைதி, மகிமை, அதிகாரம் ஆகியவற்றில் எதைக் குறிக்கிறது என்று விளக்கவில்லை. எனவே அந்தத் திறந்த தன்மை மொழிபெயர்ப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடையில் அமைக்கப்பட்டுள்ளது. ‘உற்றுப் பார்த்து’ பார்வையின் தீவிரத்தைத் தக்கவைக்கிறது; தேவதூதரின் முகத்துடனான ஒப்புமை விளக்கிச் சுருக்கப்படாமல் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
