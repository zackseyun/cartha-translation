revisions:
- from: அவர்களை அப்போஸ்தலர்களுக்கு முன்பாக நிறுத்தினார்கள்[a]. ஜெபித்த பின்பு, அவர்கள்மேல் கைகளை வைத்தார்கள்[b].
  to: அவர்களை அப்போஸ்தலர்களின் முன் நிறுத்தினார்கள்[a]. அப்போஸ்தலர்கள் ஜெபித்து, அவர்கள்மேல் கைகளை வைத்தார்கள்[b].
  rationale: The revision clarifies the contextual actor of prayer and hand-laying while retaining the Greek’s descriptive wording and avoiding conclusions about ordination or other ecclesial significance. It also improves the idiomatic quality of the lexical-alternative footnote.
