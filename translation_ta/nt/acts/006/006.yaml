base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: ta
  text: அவர்களை அப்போஸ்தலர்களின் முன் நிறுத்தினார்கள்[a]. அப்போஸ்தலர்கள் ஜெபித்து, அவர்கள்மேல் கைகளை வைத்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை அப்போஸ்தலர்களின் முன் கொண்டு வந்தார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “கைகளை வைத்தார்கள்” என்பது பொதுமக்கள் முன்னிலையில் பணிக்காக நியமித்தல் அல்லது ஆசீர்வதித்தலைக் குறிக்கக்கூடும். ஆனால் இங்கு கிரேக்கம் அந்தச் செயலை மட்டும் குறிப்பிடுகிறது; அதன் திருச்சபை சார்ந்த பொருளை மேலும் வரையறுக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: அவர்களை
  rationale: இந்த உறவுப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஏழு பேரைக் குறிக்கிறது. தமிழில் முந்தைய வசனத்தோடு இயல்பாகத் தொடர்புபடுத்தும் வகையில் ‘அவர்களை’ என மொழிபெயர்க்கப்பட்டது; மூலத்தில் இல்லாத ‘ஆண்கள்’ என்பது சேர்க்கப்படவில்லை.
- source_word: ἔστησαν
  choice: நிறுத்தினார்கள்
  rationale: ἵστημι இங்கு ஒருவரை மற்றவர்களின் முன்னிலையில் நிறுத்துதல் அல்லது முன்வைத்தல் என்ற causative பொருளில் வருகிறது. ‘நிறுத்தினார்கள்’ என்பது செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐνώπιον τῶν ἀποστόλων
  choice: அப்போஸ்தலர்களுக்கு முன்பாக
  rationale: ἐνώπιον என்பது ஒருவரின் முன்னிலையில் இருப்பதைக் குறிக்கிறது. ‘அப்போஸ்தலர்களுக்கு முன்பாக’ என்பது அந்த இடவியல் மற்றும் அதிகாரப்பூர்வ முன்னிலை ஆகிய இரண்டையும் மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: προσευξάμενοι
  choice: ஜெபித்த பின்பு
  rationale: Aorist participle முதன்மை வினைக்கு முன்னதாக நிகழ்ந்த செயலை இங்கு இயல்பாகக் குறிக்கிறது. ‘ஜெபித்த பின்பு’ நிகழ்வுகளின் வரிசையைத் தெளிவாகத் தருகிறது.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: அவர்கள்மேல் கைகளை வைத்தார்கள்
  rationale: கிரேக்கச் சொற்றொடர் கைகளை ஒருவர்மேல் வைக்கும் செயலைக் குறிப்பிடுகிறது. தமிழில் ‘அவர்கள்மேல் கைகளை வைத்தார்கள்’ என்பது இயல்பான நேரடி மொழிபெயர்ப்பு; சடங்கின் பொருளை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
theological_decisions:
- issue: கைகளை வைக்கும் செயலின் தன்மை
  choice: ‘அவர்கள்மேல் கைகளை வைத்தார்கள்’ என்று செயலை மட்டும் விவரித்தல்
  alternative: ‘அவர்களைத் திருநிலைப்படுத்தினார்கள்’ அல்லது ‘அவர்களைப் பணிக்கு நியமித்தார்கள்’
  rationale: கிரேக்கம் உடல் மற்றும் சடங்கு சார்ந்த செயலைக் குறிப்பிடுகிறது; ஆனால் அது திருநிலைப்படுத்தலா, பணியமர்த்தலா, ஆசீர்வாதமா என்பதை இவ்வசனத்திலேயே வரையறுக்கவில்லை. ஆகவே பிரிவுசார் விளக்கத்தைச் சேர்க்காமல் மூலத்தின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
- issue: வினைகளின் மறைமுக எழுவாய்
  choice: தமிழிலும் எழுவாயை வெளிப்படையாகச் சேர்க்காமல் விடுதல்
  alternative: முதல் செயலைச் சபையாருக்கும், ஜெபித்துக் கைகளை வைத்த செயலை அப்போஸ்தலர்களுக்கும் வெளிப்படையாக ஒதுக்குதல்
  rationale: கிரேக்கத்தில் இரு செயல்களின் எழுவாய் பெயரிட்டு மறுபடியும் சொல்லப்படவில்லை. சூழல் அப்போஸ்தலர்களை நோக்கிச் சுட்டக்கூடியதாக இருந்தாலும், மொழிபெயர்ப்பு அந்த அடையாளத்தை மூலத்தைவிடத் திட்டவட்டமாக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘அப்போஸ்தலர்கள்’ மற்றும் ‘ஜெபித்தல்’ ஆகியவை பரவலாக அறியப்பட்ட தமிழ் வேதாகமச் சொற்களாக இருப்பதால் பயன்படுத்தப்பட்டன. தேவையற்ற பாலினச் சேர்க்கையும் பிரிவுசார் சடங்கு விளக்கமும் தவிர்க்கப்பட்டன.
