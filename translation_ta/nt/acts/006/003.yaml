source:
  edition: SBLGNT
  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: ta
  text: ஆனால், சகோதரர்களே[a], உங்களிடமிருந்து நற்சான்று பெற்ற[b], ஆவியும் ஞானமும் நிறைந்த[c] ஏழு ஆண்களைத் தேர்ந்தெடுங்கள். அவர்களை இந்தப் பொறுப்புக்கு[d] நாங்கள் நியமிப்போம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களே’ என்பது கிரேக்கத்தின் ஆண்பால் அழைப்புமுறையை மொழிபெயர்க்கிறது; இங்கு அது விசுவாசிகள் அடங்கிய பரந்த சமூகத்தையும் உள்ளடக்கக்கூடும்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘நல்ல பெயர் பெற்ற’.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பரிசுத்த ஆவியும் ஞானமும் நிறைந்த’. கிரேக்கத்தில் ‘ஆவியும் ஞானமும் நிறைந்த’ என்றே உள்ளது.
    reason: alternative_reading
  - marker: d
    text: ‘இந்தப் பொறுப்பு’ என்பது சுற்றியுள்ள வசனங்களில் கூறப்படும் அன்றாடப் பகிர்வை நிர்வகிக்கும் நடைமுறைத் தேவையைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: தேர்ந்தெடுங்கள்
  rationale: சமூகம் தங்களிடையே தகுதியானவர்களைக் கண்டறிந்து தேர்வு செய்ய வேண்டும் என்ற நடுநிலை ஏவலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δέ
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் அப்போஸ்தலர்கள் முன்வைத்த தீர்விலிருந்து சபையாரின் நடவடிக்கைக்குச் செல்லும் சூழல்சார் விளைவுத் தொடர்பை வெளிப்படுத்துகிறது; கிரேக்கச் சொல் தனியாகப் பார்த்தால் ‘ஆனால்/இப்போது’ என்ற மெல்லிய மாற்றத்தையும் குறிக்கலாம்.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் அழைப்புமுறையைப் பாதுகாக்கிறது; அப்போஸ்தலர் பணிகள் நூலின் சூழலில் இது கூடிவந்த விசுவாசிகள் அனைவரையும் குறிக்கக்கூடும் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: ἄνδρας
  choice: ஆண்களை
  rationale: ἀνήρ இங்கு பொதுவாக மனிதர்களை அல்ல, ஆண்களைக் குறிப்பதால் பாலினச் சுட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐξ ὑμῶν
  choice: உங்களிடமிருந்து
  rationale: தேர்ந்தெடுக்கப்படுபவர்கள் அந்தச் சமூகத்திற்குள்ளிருந்தே வரவேண்டும் என்பதைக் குறுகிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μαρτυρουμένους
  choice: நற்சான்று பெற்ற
  rationale: மற்றவர்களால் சாதகமாகச் சாட்சி கூறப்பட்டவர்கள் என்ற வினையெச்சத்தின் சான்றளிப்பு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: ஆவியும் ஞானமும் நிறைந்த
  rationale: கிரேக்கத்தில் ‘பரிசுத்த’ என்ற அடைமொழி இல்லாததால் ‘ஆவி’ எனவே வைக்கப்பட்டு, அது பரிசுத்த ஆவியைக் குறிக்கும் வலுவான சூழல்சார் வாய்ப்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: καταστήσομεν
  choice: நியமிப்போம்
  rationale: ஒரு பொறுப்புக்காக முறைப்படி அமர்த்தும் அதிகாரபூர்வமான செயலைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: இந்தப் பொறுப்புக்காக
  rationale: χρεία குறிக்கும் கவனிக்கப்பட வேண்டிய நடைமுறைத் தேவையையும், அதற்காக ஒப்படைக்கப்படும் பணிப் பொறுப்பையும் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: πνεύματος என்பது பொதுவான ஆவியையா அல்லது பரிசுத்த ஆவியையா குறிக்கிறது?
  choice: ஆவி
  alternative: பரிசுத்த ஆவி
  rationale: லூக்கா–அப்போஸ்தலர் பணிகள் பயன்பாடும் ஊழியத் தகுதிகளின் சூழலும் கடவுளுடைய ஆவியை வலுவாகச் சுட்டுகின்றன. எனினும் மூலத்தில் ἁγίου (‘பரிசுத்த’) இல்லாததால் முதன்மை உரை ‘ஆவி’ என்ற வடிவை வைத்துப் பொருள்சார் இறுக்கத்தைத் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘நற்சான்று பெற்ற’ என்பது சற்று முறைசார்ந்தாலும் மூலத்தின் சாட்சியளிப்பு நுணுக்கத்தைத் தக்கவைக்கிறது. நீண்ட கிரேக்க உறவுப்பெயர் வாக்கியம் தமிழில் இயல்பாக இருக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
