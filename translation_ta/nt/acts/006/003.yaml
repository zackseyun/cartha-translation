  to: ஆனால், சகோதரர்களே[a], உங்களிடமிருந்து நற்சான்று பெற்ற[b], ஆவியும் ஞானமும் நிறைந்த[c] ஏழு ஆண்களைத் தேர்ந்தெடுங்கள். அவர்களை இந்தப் பொறுப்புக்கு[d] நாங்கள் நியமிப்போம்.
  rationale: δέ-யின் தொடர்பை ‘ஆனால்’ எனத் திருத்தி, மூலத்தின் இலக்கணப் பொருளையும் ஆங்கில POB audit trail-இன் தேர்வையும் பின்பற்றுகிறது. மேலும், நியமனத்தின் பொறுப்பு-ஒப்படைப்பு அம்சத்தைத் தமிழில் சற்று நேரடியாக்க ‘இந்தப் பொறுப்புக்கு’ எனச் சீரமைக்கப்பட்டது. பிற சொற்களும் அடிக்குறிப்புகளும் பாதுகாக்கப்பட்டுள்ளன.
