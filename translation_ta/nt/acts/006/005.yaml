source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: ta
  text: இந்தக் கருத்து முழுத் திரளுக்கும் பிடித்தது. அவர்கள் விசுவாசமும்[a] பரிசுத்த ஆவியும் நிறைந்த மனிதரான ஸ்தேவானையும், பிலிப்பு, பிரொகோர், நிக்கானோர், தீமோன், பர்மெனாஸ், அந்தியோகியாவைச் சேர்ந்த யூத மதத்திற்கு மாறிய நிக்கொலாவையும்[b] தேர்ந்தெடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசம்’ என்பதற்கு ‘உண்மைத்தன்மை’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘யூத மதத்திற்கு மாறியவர்’ என்பது பிற இனத்தவராக இருந்து யூத மதத்தை ஏற்றுக்கொண்டவரைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: இந்தக் கருத்து
  rationale: முந்தைய வசனத்தில் அப்போஸ்தலர்கள் முன்வைத்த கருத்தையே இது குறிக்கிறது; சொற்பொருளான ‘வார்த்தை’ இச்சூழலில் இயல்பாக இல்லை.
- source_word: ἤρεσεν ... ἐνώπιον παντὸς τοῦ πλήθους
  choice: திரளாயிருந்த அனைவருக்கும் பிடித்திருந்தது
  rationale: ἀρέσκω என்பதன் ஏற்பு அல்லது மனநிறைவு என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; πλῆθος என்பதன் கூட்டுத் தன்மையையும் காக்கிறது.
- source_word: ἐξελέξαντο
  choice: தேர்ந்தெடுத்தார்கள்
  rationale: தங்களுக்காகத் தேர்வு செய்தார்கள் என்ற நடுவினை வடிவத்தின் சூழல்சார் பொருளை நேரடியாகத் தருகிறது.
- source_word: ἄνδρα πλήρης πίστεως καὶ πνεύματος ἁγίου
  choice: விசுவாசத்தாலும் பரிசுத்த ஆவியாலும் நிறைந்த மனிதரான
  rationale: ஸ்தேவானைப் பற்றிய தனிப்பட்ட வருணனையாக கிரேக்கத் தொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இச்சூழலில் தேவன்மீது கொண்ட நம்பிக்கையைக் குறிக்கும் வழக்கமான, இயல்பான தமிழ் வேதாகமச் சொல்; ‘உண்மைத்தன்மை’ என்ற பொருள் சாத்தியமானாலும் இங்கு குறைவாகப் பொருந்துகிறது.
- source_word: πνεύματος ἁγίου
  choice: பரிசுத்த ஆவி
  rationale: அப்போஸ்தலர் நடபடிகளில் இந்தத் தொடர் பொதுவாகத் தெய்வீகப் பரிசுத்த ஆவியைக் குறிக்கிறது.
- source_word: προσήλυτον
  choice: யூதமதத்தைத் தழுவிய
  rationale: பிற இனத்தவராக இருந்து யூதமதத்தை ஏற்றவரைச் சுட்டும் வரலாற்றுப் பொருளை, பொதுவாசகருக்குப் புரியும் தமிழில் நேரடியாகத் தருகிறது.
- source_word: Ἀντιοχέα
  choice: அந்தியோகியாவைச் சேர்ந்த
  rationale: நிக்கொலாவின் ஊர்சார் தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: ஸ்தேவான், பிலிப்பு, பிரொகோர், நிக்கானோர், தீமோன், பர்மெனாஸ், நிக்கொலா
  rationale: தமிழில் நிலைபெற்ற அல்லது கிரேக்க உச்சரிப்பை அணுகும் ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: உண்மைத்தன்மை
  rationale: ஸ்தேவானின் தேவன்மீதான நம்பிக்கையைச் சுட்டுவதாக வாசிப்பது இச்சூழலுக்கு இயல்பானது; வேறு சாத்தியமான நுண்பொருளை வலுக்கட்டாயமாக முதன்மைப்படுத்தவில்லை.
- issue: πνεύματος ἁγίου என்பதன் அடையாளம்
  choice: பரிசுத்த ஆவி
  alternative: பரிசுத்தமான ஆவி / ஆவிக்குரிய பரிசுத்த இயல்பு
  rationale: அப்போஸ்தலர் நடபடிகளின் பயன்பாட்டில் இது தனித்த தெய்வீகச் செயல்பாட்டாளரான பரிசுத்த ஆவியைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் காக்கப்பட்டுள்ளன. கிரேக்கத்தில் பெயர்கள் பலமுறை ‘மற்றும்’ என்பதால் இணைக்கப்பட்டாலும், தமிழில் இயல்பான பட்டியலாக அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘நிக்கொலா’வுக்குப் பின் வைக்கப்பட்டுள்ளது.
