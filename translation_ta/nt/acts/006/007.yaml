source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: ta
  text: தேவனுடைய வார்த்தை வளர்ந்துகொண்டே இருந்தது; எருசலேமில் சீடர்களின் எண்ணிக்கை மிகவும் பெருகிக்கொண்டே இருந்தது; ஆசாரியர்களில் பெரும் திரளானோர் விசுவாசத்திற்குக் கீழ்ப்படிந்து வந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசத்திற்குக் கீழ்ப்பட்டார்கள்” அல்லது “விசுவாசத்திற்குக் கீழ்ப்படிந்தார்கள்.” கிரேக்கச் சொற்றொடர் உள்ளார்ந்த நம்பிக்கையை மட்டும் அல்லாமல், அறிவிக்கப்பட்ட விசுவாசச் செய்திக்குக் கீழ்ப்படிதலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: தேவனுடைய வார்த்தை
  rationale: λόγος என்பதன் வேதாகம வழக்கைத் தக்கவைத்து, இது தேவனிடமிருந்து அறிவிக்கப்பட்ட செய்தியைக் குறிக்கிறது என்பதையும், ‘செய்தி’ என்று மட்டும் பொருளைக் குறுக்கிவிடாமலும் காட்டுகிறது.
- source_word: ηὔξανεν
  choice: தொடர்ந்து வளர்ந்துகொண்டிருந்தது
  rationale: இறந்தகாலத் தொடர்நிலை வினை ongoing progress-ஐக் காட்டுகிறது; தமிழில் இயல்பாகவும், தேவனுடைய வார்த்தையின் பரவலை உணர்த்துமாறும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐπληθύνετο
  choice: பெருகிக்கொண்டிருந்தது
  rationale: தொடர்ச்சியான எண்ணிக்கைப் பெருக்கத்தை வெளிப்படுத்துகிறது; முந்தைய ‘வளர்ந்துகொண்டிருந்தது’ என்பதிலிருந்து கிரேக்கத்தின் சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: ὁ ἀριθμὸς τῶν μαθητῶν
  choice: சீடர்களின் எண்ணிக்கை
  rationale: கிரேக்க அமைப்பைத் தெளிவாகப் பிரதிபலிப்பதோடு, லூக்காவின் முக்கியச் சொல்லான μαθηταί என்பதற்கு ‘சீடர்கள்’ என்பதைத் தக்கவைக்கிறது.
- source_word: ἐν Ἰερουσαλὴμ
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் நேரடியான, வழக்கமான தமிழ் வடிவம்.
- source_word: σφόδρα
  choice: மிகவும்
  rationale: வளர்ச்சியின் தீவிரத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πολύς τε ὄχλος
  choice: பெருந்திரளானோர்
  rationale: கணிசமான மக்கள் கூட்டத்தைச் சுட்டும் ὄχλος என்பதன் கூட்டுப் பொருளை, ஆசாரியர்களுடன் இயல்பாக இணையும் தமிழில் வழங்குகிறது.
- source_word: τῶν ἱερέων
  choice: ஆசாரியர்களில்
  rationale: யூத ஆலய ஆசாரியர்களைக் குறிக்கும் ἱερεῖς என்பதற்கான நிலையான தமிழ் சொல்; பகுதி-முழுமை உறவை ‘-இல்’ உருபு இயல்பாகக் காட்டுகிறது.
- source_word: ὑπήκουον
  choice: கீழ்ப்படிந்துகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை, அநேகர் தொடர்ந்து கீழ்ப்படிதலுக்கு வந்ததை வெளிப்படுத்துகிறது; வெளிப்புற இணக்கத்தை மட்டும் அல்லாமல் ஏற்றுக்கொண்டு கீழ்ப்படிவதையும் குறிக்கிறது.
- source_word: τῇ πίστει
  choice: விசுவாசத்துக்கு
  rationale: πίστις என்பதன் ‘விசுவாசம்’ என்ற முக்கிய வேதாகமச் சொல்லைத் தக்கவைக்கிறது. இச்சூழலில் அது விசுவாசிக்கப்படும் செய்தி அல்லது நம்பிக்கையின் உள்ளடக்கம் என்ற புறநிலைப் பொருளையும் கொள்ளலாம்; தமிழில் கட்டாயமாக ‘அந்த விசுவாசம்’ எனச் சேர்க்காமல் கிரேக்கத்தின் சாத்தியமான இருபொருளையும் திறந்துவைக்கிறது.
theological_decisions:
- issue: τῇ πίστει என்பதன் பொருள்
  choice: விசுவாசத்துக்கு
  alternative: விசுவாசத்திற்குக் கீழ்ப்பட்டார்கள்; விசுவாசச் செய்திக்குக் கீழ்ப்படிந்தார்கள்
  rationale: இங்கு πίστις என்பது உள்ளார்ந்த நம்பிக்கையை மட்டும் அல்லாமல், ஏற்றுக்கொள்ளப்படும் கிறிஸ்தவச் செய்தி அல்லது விசுவாசத்தின் உள்ளடக்கத்தையும் குறிக்கலாம். முதன்மை உரை ‘விசுவாசம்’ என்ற சொல்லைத் தக்கவைத்து ambiguity-ஐப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் புறநிலைச் செய்திப் பொருளை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. தொடர்ச்சியைக் காட்டும் கிரேக்க இறந்தகால வினைகள் ‘வளர்ந்துகொண்டிருந்தது,’ ‘பெருகிக்கொண்டிருந்தது,’ ‘கீழ்ப்படிந்துகொண்டிருந்தார்கள்’ என வேறுபடுத்திப் பாதுகாக்கப்பட்டுள்ளன; ‘தேவனுடைய வார்த்தை,’ ‘சீடர்கள்,’ ‘ஆசாரியர்கள்,’ ‘விசுவாசம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
