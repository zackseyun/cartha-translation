revisions:
- from: கடவுள் பண்டைக்காலமுதல் தமது பரிசுத்த தீர்க்கதரிசிகளின் வாய்மூலம் கூறிய அனைத்தும் மீண்டும் சீராக்கப்படும் காலங்கள்வரை, அவர் பரலோகத்தில் ஏற்றுக்கொள்ளப்பட வேண்டும்.
  to: கடவுள் பண்டைக்காலமுதல் தம் பரிசுத்த தீர்க்கதரிசிகளின் வாய்மூலம் கூறிய அனைத்தும் மீண்டும் சீராக்கப்படும் காலங்கள்வரை, பரலோகம் அவரை ஏற்றுக்கொள்ள வேண்டும்.
  rationale: The sole substantive revision restores the Greek syntax and imagery by making «பரலோகம்» the subject and «அவரை» its object. «தமது» is shortened to the equally respectful and more idiomatic «தம்». The relative connection—God spoke the things that will be restored—remains as in the draft and English audit trail, without adding a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:36:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the temporal limit, the restoration of all things, and God''s speech through the prophets. However, «பரலோகத்தில் ஏற்றுக்கொள்ளப்பட வேண்டும்» makes heaven merely a location, whereas οὐρανὸν is the subject of δέξασθαι: heaven must receive him. The revision retains heaven as the grammatical subject.'
  naturalness: The revised wording is clear modern standard Tamil and keeps a dignified biblical register. «பரலோகம் அவரை ஏற்றுக்கொள்ள வேண்டும்» is both natural and closer to the Greek personification.
  terminology: «பரிசுத்த தீர்க்கதரிசிகள்», «வாய்மூலம்», and «மீண்டும் சீராக்கப்படும்» are suitable. «கடவுள்» consistently renders θεός in this draft. The wording does not resolve the scope of «all things» into a particular theological conclusion.
  issues:
  - severity: medium
    issue: οὐρανὸν is rendered as a locative rather than the subject.
    rationale: «அவர் பரலோகத்தில் ஏற்றுக்கொள்ளப்பட வேண்டும்» means that he is to be received in heaven. The Greek says that heaven itself must receive him; retaining that subject is necessary for source fidelity.
  revised_text: கடவுள் பண்டைக்காலமுதல் தம் பரிசுத்த தீர்க்கதரிசிகளின் வாய்மூலம் கூறிய அனைத்தும் மீண்டும் சீராக்கப்படும் காலங்கள்வரை, பரலோகம் அவரை ஏற்றுக்கொள்ள வேண்டும்.
  revised_footnotes: []
  revision_rationale: The sole substantive revision restores the Greek syntax and imagery by making «பரலோகம்» the subject and «அவரை» its object. «தமது» is shortened to the equally respectful and more idiomatic «தம்». The relative connection—God spoke the things that will be restored—remains as in the draft and English audit trail, without adding a doctrinal interpretation.
