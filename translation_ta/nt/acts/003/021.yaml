id: ACT.3.21
reference: Acts 3:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: ta
  text: கடவுள் பண்டைக்காலமுதல் தம் பரிசுத்த தீர்க்கதரிசிகளின் வாய்மூலம் கூறிய அனைத்தும் மீண்டும் சீராக்கப்படும் காலங்கள்வரை, பரலோகம் அவரை ஏற்றுக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: அவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கிறிஸ்துவைச் சுட்டும் தொடர்புப்பெயரைத் தமிழில் இயல்பாகத் தனிப்பெயராக வழங்குகிறது.
- source_word: δεῖ ... οὐρανὸν ... δέξασθαι
  choice: பரலோகத்தில் ஏற்றுக்கொள்ளப்பட வேண்டும்
  rationale: வானமே செய்பொருளாக வரும் கிரேக்க உருவகத்தைப் புரியத்தக்க தமிழில் இடவியல் செயலற்ற வினையாக வழங்கி, தெய்வீக அவசியத்தைக் குறிக்கும் δεῖ என்பதையும் காக்கிறது.
- source_word: ἄχρι χρόνων
  choice: காலங்கள்வரை
  rationale: χρόνων என்பதன் பன்மையைப் பேணி, குறிப்பிட்ட நிறைவேற்றக் காலப்பகுதிகளைச் சுட்டுகிறது.
- source_word: ἀποκαταστάσεως πάντων
  choice: அனைத்தும் மீண்டும் சீராக்கப்படும்
  rationale: ἀποκατάστασις என்பதிலுள்ள மீட்டமைத்தல் அல்லது உரிய நிலைக்குக் கொண்டுவருதல் என்ற கருத்தை இயல்பான தமிழில் தருகிறது; ‘அனைத்தும்’ என்பதன் பரப்பை முன்கூட்டியே கட்டுப்படுத்தவில்லை.
- source_word: διὰ στόματος
  choice: வாய்மூலம்
  rationale: எபிரேயத் தாக்கமுள்ள கிரேக்க மொழிநடையை தமிழில் தெளிவாகவும் சுருக்கமாகவும் காக்கிறது.
- source_word: ἀπ’ αἰῶνος
  choice: பண்டைக்காலமுதல்
  rationale: ‘யுகத்தின் தொடக்கத்திலிருந்து’ என்ற சொற்படிவத்தைவிட இச்சூழலில் ‘பழங்காலத்திலிருந்து’ என்ற காலப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀποκαταστάσεως πάντων என்பதன் பரப்பு
  choice: அனைத்தும் மீண்டும் சீராக்கப்படும்
  alternative: எல்லா மனிதர்களும் இறுதியில் இரட்சிக்கப்படும்
  rationale: மூலவாக்கியம் ‘அனைத்தும்’ என்று விரிவாகக் கூறினாலும், உலகளாவிய தனிநபர் இரட்சிப்பு என்ற குறிப்பிட்ட கோட்பாட்டை வெளிப்படையாகச் சொல்லவில்லை; ஆகவே உரையின் பரப்பையும் இறையியல் பதற்றத்தையும் அப்படியே விடுகிறது.
- issue: ὧν என்பதன் தொடர்பு
  choice: கடவுள் ... கூறிய அனைத்தும்
  alternative: அனைத்தும் சீராக்கப்படுவதைப் பற்றி கடவுள் கூறினார்
  rationale: ὧν என்பது இலக்கணப்படி ‘அனைத்தும்’ என்பதுடன் ஈர்க்கப்பட்ட தொடர்புப்பெயராகவோ, ‘அவற்றைப் பற்றி’ என்ற பொருளிலோ புரியலாம். முதன்மை உரை நேரடியான ‘கூறிய அனைத்தும்’ என்ற தொடர்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குத் தெளிவான, மரியாதைமிக்க வேதாகம நடை. ‘தீர்க்கதரிசிகள்’ என்பது பரவலாக அறியப்பட்ட திருச்சபைச் சொல்லாக இருப்பதால் வைக்கப்பட்டது; சாத்தியமான இடங்களில் கடினமான சொற்படியைத் தவிர்த்து மூலத்தின் எண்ணிக்கை, கால உணர்வு, இறையியல் தெளிவின்மை ஆகியவை பேணப்பட்டன.
