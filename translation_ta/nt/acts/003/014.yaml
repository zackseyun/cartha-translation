id: ACT.3.14
reference: Acts 3:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: ta
  text: ஆனால் நீங்களோ பரிசுத்தரும் நீதிமானுமானவரை மறுதலித்து, கொலைகாரனான ஒரு மனிதனை உங்களுக்குக் கொடுக்கும்படி[a] கேட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இச்சூழலில் இன்னும் வெளிப்படையாக, “உங்களுக்காக விடுதலை செய்யும்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: ஆனால் நீங்களோ
  rationale: δέ-யின் எதிர்மறைத் திருப்பத்தையும், வெளிப்படையாக வந்துள்ள ὑμεῖς தரும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: பரிசுத்தரும் நீதிமானுமானவரை
  rationale: ஒரே குறிப்பிட்ட நபரைச் சுட்டும் இணைந்த பெயரடைத் தொடரை, இயேசுவுக்கான பட்டப்பெயர் சார்ந்த வருணனையாக ஒருமையில் காக்கிறது.
- source_word: ἠρνήσασθε
  choice: மறுதலித்து
  rationale: ἀρνέομαι என்பதிலுள்ள மறுத்தல், ஏற்றுக்கொள்ளாமை, உறவை நிராகரித்தல் ஆகிய நுணுக்கங்களை இச்சூழலில் சுருக்கமாகத் தருகிறது.
- source_word: ᾐτήσασθε
  choice: கேட்டீர்கள்
  rationale: அதிகாரியிடம் ஒன்றைச் செய்யுமாறு வேண்டிய αἰτέω என்பதன் நேரடியான பொருளை இயல்பாகக் கொடுக்கிறது.
- source_word: ἄνδρα φονέα
  choice: கொலைகாரனான ஒரு மனிதனை
  rationale: ἄνδρα மற்றும் φονέα ஆகிய இரு கூறுகளையும் வெளிப்படையாகக் காத்து, பரிசுத்தரும் நீதிமானுமானவருடனான கூர்மையான முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: χαρισθῆναι ὑμῖν
  choice: உங்களுக்குக் கொடுக்கும்படி
  rationale: χαρίζομαι என்பதன் பரந்த ‘ஒருவருக்குச் சாதகமாக வழங்குதல்’ என்ற பொருளை முதன்மை உரையில் காக்கிறது; நீதிமன்றச் சூழலில் உள்ள ‘விடுதலை செய்தல்’ என்ற குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘பரிசுத்தரும் நீதிமானுமானவர்’ என்பதன் கிறிஸ்துவியல் வலிமை
  choice: இயேசுவைக் குறிக்கும் ஒன்றிணைந்த பட்டப்பெயர் சார்ந்த வருணனையாக மொழிபெயர்த்தல்
  alternative: சாதாரணமாக அவருடைய இரு பண்புகளை மட்டும் கூறும் வருணனையாக வாசித்தல்
  rationale: ஒரே உருபின்கீழ் இணைந்துள்ள பெயரடைகள் சூழலில் இயேசுவைச் சிறப்பாக அடையாளப்படுத்துகின்றன; இதற்கு மேல் எந்தக் கோட்பாட்டுச் சொல்லாட்சியையும் சேர்க்கவில்லை.
- issue: χαρισθῆναι என்பதன் நீதித்துறை நுணுக்கம்
  choice: முதன்மை உரையில் பரந்த பொருளாக ‘உங்களுக்குக் கொடுக்கும்படி’
  alternative: சூழலை வெளிப்படையாக்கி ‘உங்களுக்காக விடுதலை செய்யும்படி’
  rationale: வினைச்சொல் தன்னளவில் ‘சாதகமாக வழங்குதல்’ என்ற பரந்த பொருளைக் கொண்டது; பரபாஸ் விடுதலையான சூழல் குறிப்பான மாற்று மொழிபெயர்ப்பை ஆதரிப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் உரையின் குற்றஞ்சாட்டும் நேரடியான தொனியைத் தக்கவைக்கும் வகையிலும் அமைக்கப்பட்டது. ‘பரிசுத்தர்’, ‘நீதிமான்’, ‘மறுதலித்தல்’ ஆகியவை மரியாதைமிக்க வேதாகமப் பதிவுக்கு ஏற்றவையாக இருந்தாலும் இன்றைய தமிழிலும் புரிந்துகொள்ளத்தக்கவை.
