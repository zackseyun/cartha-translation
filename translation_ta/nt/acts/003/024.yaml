  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: ta
  text: சாமுவேல் தொடங்கி, அவருக்குப் பின் வரிசையாக வந்த இறைவாக்கினர்கள் அனைவரும்[a] பேசி, இந்த நாட்களை[c] அறிவித்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருக்குப் பின் தொடர்ச்சியாக வந்தவர்கள்’ அல்லது ‘அவரைப் பின்தொடர்ந்து வந்தவர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பிரகடனம் செய்தார்கள்’; இன்னும் விளக்கமாக, ‘முன்னறிவித்தார்கள்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘இந்தக் காலங்களை.’ இச்சொற்றொடர், பேதுருவின் உரையில் நிறைவேற்றம் நிகழும் தற்போதைய காலத்தைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: இறைவாக்கினர்கள் அனைவரும்
  rationale: πάντες என்பதன் முழுமையான உள்ளடக்கத்தை ‘அனைவரும்’ வெளிப்படுத்துகிறது. δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் தொடர்ச்சியை மட்டுமே குறிக்கிறது; இயல்பான தமிழில் அதைத் தனிச்சொல்லாக மொழிபெயர்க்கவில்லை. προφῆται என்பதற்கு, எதிர்காலத்தைச் சொல்வோர் என்ற குறுகிய பொருளைத் தவிர்த்து, தேவனுடைய செய்தியை உரைப்போர் என்ற பரந்த பொருளைத் தரும் ‘இறைவாக்கினர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀπὸ Σαμουὴλ
  choice: சாமுவேல் தொடங்கி
  rationale: ἀπό இங்கு ஒரு வரிசையின் தொடக்கப் புள்ளியைக் குறிக்கிறது. ‘சாமுவேல் தொடங்கி’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: τῶν καθεξῆς
  choice: அவருக்குப் பின் வரிசையாக வந்த
  rationale: καθεξῆς கால அல்லது தொடர் வரிசையைக் குறிக்கிறது. ‘வரிசையாக’ என்ற சொல் அந்த நுணுக்கத்தைப் பாதுகாக்கிறது; ‘அவருக்குப் பின் வந்த’ என்பதும் சாமுவேலுடனான தொடர்பைத் தெளிவாக்குகிறது.
- source_word: ὅσοι ἐλάλησαν
  choice: பேசியவர்கள் அனைவரும்
  rationale: ὅσοι என்பதிலுள்ள உள்ளடக்கிய அளவுப் பொருளை இயல்பான தமிழில் ‘அனைவரும்’ தருகிறது; ἐλάλησαν என்பதன் எளிய ‘பேசினர்’ என்ற பொருள் விளக்கமாக விரிவாக்கப்படவில்லை.
- source_word: καὶ κατήγγειλαν
  choice: அறிவித்தார்கள்
  rationale: καταγγέλλω என்பதன் அறிவித்தல் அல்லது பிரகடனம் செய்தல் என்ற அடிப்படைப் பொருளை ‘அறிவித்தார்கள்’ தருகிறது. ‘முன்னறிவித்தார்கள்’ என்பது தீர்க்கதரிசனச் சூழலை வெளிப்படையாக்கினாலும், மூல வினைச்சொல்லைவிட விளக்கமானது என்பதால் முதன்மை உரையில் தவிர்க்கப்பட்டது. இங்குள்ள καί-யின் இணைப்பு/வலியுறுத்தல் ‘இந்த நாட்களையும்’ என்பதிலுள்ள ‘-யும்’ மூலம் வெளிப்படுகிறது.
- source_word: τὰς ἡμέρας ταύτας
  choice: இந்த நாட்களை
  rationale: ἡμέρας என்பதன் நேரடியான காலச் சொல்லை ‘நாட்கள்’ பாதுகாக்கிறது. பேதுரு பேசும் நிகழ்கால நிறைவேற்றக் காலத்தைக் குறித்தாலும், ‘காலகட்டம்’ என்று விளக்கமாக மாற்றப்படவில்லை.
theological_decisions:
- issue: இறைவாக்கினர்கள் குறிப்பிட்ட நிகழ்கால மீட்பு-வரலாற்றுக் காலம்
  choice: இந்த நாட்கள்
  alternative: இந்தக் காலம்
  rationale: இந்தச் சொற்றொடர் மேசியாவோடும் பேதுரு அறிவிக்கும் நிறைவேற்ற நிகழ்வுகளோடும் தொடர்புடைய தற்போதைய காலத்தைக் குறிக்கக்கூடும். ஆனால் மூலத்தின் ‘நாட்கள்’ என்ற கால உருவகத்தைப் பாதுகாத்து, அதன் இறுதிக்கால அல்லது மீட்பு-வரலாற்றுப் பொருளை மொழிபெயர்ப்பிலேயே முழுமையாக விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘தீர்க்கதரிசிகள்’ என்பதற்குப் பதில், மூலச் சொல்லின் பரந்த பணியைத் தெளிவாகக் காட்ட ‘இறைவாக்கினர்கள்’ பயன்படுத்தப்பட்டது. இடைச்செருகல் போன்ற ὅσοι ἐλάλησαν பகுதி நீண்ட கோடுகளால் பிரிக்கப்பட்டு, வாக்கியத்தின் தொடர்பும் அதன் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
