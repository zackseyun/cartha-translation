base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: ta
  text: அவர்களிடமிருந்து ஏதாவது பெறுவான் என்று எதிர்பார்த்து, அவன் அவர்கள்மீது தன் கவனத்தைச் செலுத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைக் கவனித்துப் பார்த்தான்”; “அவர்களை உற்றுப் பார்த்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: அவன்
  rationale: ὁ என்பது முன் குறிப்பிடப்பட்ட நடக்க இயலாத மனிதனைக் குறிக்கிறது; δέ மென்மையான கதைத் தொடர்ச்சியைச் சுட்டுவதால், தமிழில் தனியே இணைப்புச்சொல் சேர்க்காமல் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐπεῖχεν
  choice: தன் கவனத்தைப் பதித்தான்
  rationale: இச்சூழலில் ἐπέχω என்பது ஒருவரை நோக்கிக் கவனத்தைச் செலுத்தி வைத்திருப்பதைக் குறிக்கிறது. முற்றுப்பெறாத இறந்தகால வடிவத்தின் நீடித்த கவனத்தையும் இச்சொற்றொடர் உணர்த்துகிறது.
- source_word: αὐτοῖς
  choice: அவர்கள்மீது
  rationale: இது பேதுருவையும் யோவானையும் குறிக்கிறது; ‘கவனத்தைப் பதித்தான்’ என்பதுடன் ‘அவர்கள்மீது’ இயல்பாக இணைகிறது.
- source_word: προσδοκῶν
  choice: எதிர்பார்த்து
  rationale: அவனுடைய கவனத்துடன் சேர்ந்திருந்த நம்பிக்கையுள்ள எதிர்பார்ப்பை நிகழ்காலப் பங்கேற்புவினை வெளிப்படுத்துகிறது.
- source_word: τι
  choice: ஏதாவது
  rationale: பெறப்போகும் பொருள் என்னவென்று குறிப்பிடப்படாததை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: παρ’ αὐτῶν
  choice: அவர்களிடமிருந்து
  rationale: παρά உடன் வரும் உடைமை வேற்றுமை, பெறப்படும் பொருளின் மூலத்தைச் சுட்டுகிறது.
- source_word: λαβεῖν
  choice: கிடைக்கும்
  rationale: பெறுவதை எதிர்பார்த்தான் என்ற பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; இச்சூழலில் அவனுக்குக் கொடுக்கப்படும் ஒன்றைப் பெறுதலே நோக்கம்.
