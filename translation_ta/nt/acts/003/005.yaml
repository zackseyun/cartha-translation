revisions:
- from: அவர்களிடமிருந்து ஏதாவது கிடைக்கும் என்று எதிர்பார்த்து, அவன் அவர்கள்மீது தன் கவனத்தைப் பதித்தான்.[a]
  to: அவர்களிடமிருந்து ஏதாவது பெறுவான் என்று எதிர்பார்த்து, அவன் அவர்கள்மீது தன் கவனத்தைச் செலுத்தினான்.[a]
  rationale: The revision replaces the less specific ‘கிடைக்கும்’ with ‘பெறுவான்’ to represent λαβεῖν faithfully and uses a more natural Tamil expression for ἐπεῖχεν. The alternative-rendering footnote remains appropriate, with only minor stylistic normalization.
