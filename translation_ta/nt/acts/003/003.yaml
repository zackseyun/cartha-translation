lexical_decisions:
- source_word: ὃς ἰδὼν
  choice: அவன் கண்டு
  rationale: ὃς முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நடக்க இயலாத மனிதனைச் சுட்டுகிறது. இறந்தகால வினையெச்சமான ἰδών, பேதுருவையும் யோவானையும் கண்டபோது அவன் கேட்டான் என்ற காலத் தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: பேதுருவையும் யோவானையும்
  rationale: தனிப்பெயர்கள் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன.
- source_word: μέλλοντας εἰσιέναι
  choice: நுழையவிருந்த
  rationale: μέλλω + வினையெச்சம் இங்கு உடனடியாக நிகழவிருந்த செயலைக் குறிக்கிறது; அவர்கள் ஆலய வளாகத்திற்குள் நுழையப் போகும் தருணத்தில் இருந்தனர்.
- source_word: εἰς τὸ ἱερόν
  choice: ஆலய வளாகத்திற்குள்
  rationale: ἱερόν என்பது உள் பரிசுத்த அறையை மட்டும் அல்லாமல் ஆலய முற்றங்களையும் உள்ளடக்கிய முழு வளாகத்தைக் குறிக்கிறது. ஆகவே ‘ஆலய வளாகம்’ மூலச்சொல்லின் பரப்பைத் தெளிவாகக் காக்கிறது.
- source_word: ἠρώτα
  choice: கேட்டுக்கொண்டிருந்தான்
  rationale: நிறைவுறா இறந்தகால வடிவம் தொடர்ந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த வேண்டுகோளைச் சுட்டலாம். ‘கேட்கத் தொடங்கினான்’ என்று தொடக்கநிலையை மட்டும் வலியுறுத்தாமல், தமிழ் தொடர்நிலை வடிவம் அந்த அம்சத்தைப் பாதுகாக்கிறது.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: தனக்குப் பிச்சை தருமாறு
  rationale: ἐλεημοσύνη என்பது ஏழைக்கு அளிக்கப்படும் உதவிப்பொருள் அல்லது பணம். ‘பிச்சை’ இச்சூழலில் சுருக்கமாகவும் பொதுமக்களுக்கு எளிதாகவும் உள்ளது. கிரேக்கத்தில் ‘பெற’ என்று இருந்தாலும், பெறுபவரின் கோணத்திலிருந்து தமிழில் இயல்பாக ‘தனக்குப் பிச்சை தருமாறு’ எனக் கூறப்படுகிறது.
