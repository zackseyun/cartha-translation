  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: ta
  text: ஆலய வளாகத்திற்குள்[a] நுழையவிருந்த பேதுருவையும் யோவானையும் அவன் கண்டு, தனக்குப் பிச்சை தருமாறு கேட்டுக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆலய வளாகம்’ என்பதற்கான கிரேக்கச் சொல் ἱερόν; இது ஆலய முற்றங்கள் உட்பட முழு வளாகத்தைக் குறிக்கிறது, ஆலயத்தின் உள் ஆலயத்தை மட்டும் அல்ல.
