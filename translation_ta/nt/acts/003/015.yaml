source:
  edition: SBLGNT
  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: ta
  text: ஆனால் வாழ்வின் நாயகரை[a] நீங்கள் கொன்றீர்கள். அவரைக் கடவுள் இறந்தோரிடமிருந்து உயிர்த்தெழுப்பினார்; இதற்கு நாங்கள் சாட்சிகள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வாழ்வின் மூலவர்,’ ‘வாழ்வின் தலைவர்,’ அல்லது ‘வாழ்வின் முன்னோடி’ என்றும் மொழிபெயர்க்கலாம். ἀρχηγός என்ற கிரேக்கச் சொல் தோற்றுவித்தல், வழிநடத்துதல், முதன்மை வகித்தல் ஆகிய பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவரைப் பற்றிய சாட்சிகள் நாங்கள்’ என்றும் பொருள் கொள்ளலாம். கிரேக்கச் சொற்றொடர் உயிர்த்தெழுந்த அவரையோ, அவர் உயிர்த்தெழுப்பப்பட்ட உண்மையையோ சுட்டக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட விடுதலைக்கும் இங்கு கூறப்படும் கொலைக்கும் இடையிலான முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; δέ-யின் மென்மையான எதிர்மறை இணைப்பையும் மிகைப்படுத்தாமல் காட்டுகிறது.
- source_word: ἀρχηγὸν τῆς ζωῆς
  choice: வாழ்வின் நாயகரை
  rationale: ἀρχηγός என்பது தொடங்குகிறவர், வழிநடத்துகிறவர், முதன்மையானவர் ஆகிய பொருள்களைக் கொண்டது. ‘நாயகர்’ என்பது தலைமை மற்றும் முதன்மையை இயல்பான, கண்ணியமான தமிழில் தருகிறது; சொல்லின் பிற சாத்தியப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: ἀπεκτείνατε
  choice: நீங்கள் கொன்றீர்கள்
  rationale: வினையின் நேரடியான குற்றச்சாட்டைத் தெளிவாகத் தருகிறது; ‘கொலை செய்தீர்கள்’ என்பதில் வரக்கூடிய கூடுதல் சட்டநுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: இறந்தோரிடமிருந்து உயிர்த்தெழுப்பினார்
  rationale: கடவுளே செய்பவர் என்பதையும், மரித்தோரிடமிருந்து எழுப்பப்பட்ட உயிர்த்தெழுதலையும் தெளிவாகக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: οὗ
  choice: இதற்கு
  rationale: உடனே முன் கூறப்பட்ட உயிர்த்தெழுப்பப்பட்ட நிகழ்வைச் சுட்டும் வாசிப்பை இயல்பான தமிழில் தருகிறது. சுட்டுப்பெயர் உயிர்த்தெழுந்த நபரையும் குறிக்கக்கூடிய இலக்கண வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μάρτυρές ἐσμεν
  choice: நாங்கள் சாட்சிகள்
  rationale: கிரேக்கத்தின் பெயர்ச்சொல் அமைப்பைத் தக்கவைத்து, அப்போஸ்தலர்களின் சாட்சி நிலையை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கிறிஸ்துவைக் குறிக்கும் ἀρχηγός என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: வாழ்வின் நாயகர்
  alternative: வாழ்வின் மூலவர் / வாழ்வின் தலைவர் / வாழ்வின் முன்னோடி
  rationale: ஒரே ஒரு குறுகிய இறையியல் பொருளுக்குள் சொல்லை அடைக்காமல், தலைமை மற்றும் முதன்மை என்ற மைய நுணுக்கங்களை இயல்பாகத் தருகிறது. தோற்றுவிப்பவர் என்ற நுணுக்கமும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: οὗ என்ற சுட்டுப்பெயரின் குறிப்பு
  choice: உயிர்த்தெழுப்பப்பட்ட நிகழ்வைக் குறிக்கும் ‘இதற்கு’
  alternative: உயிர்த்தெழுந்த அவரைக் குறிக்கும் ‘அவருக்கு/அவரைப் பற்றிய சாட்சிகள்’
  rationale: கிரேக்க வடிவம் உயிர்த்தெழுந்த நபரையோ, அவர் உயிர்த்தெழுப்பப்பட்ட உண்மையையோ சுட்டக்கூடும். பிரதான உரை உடனடி நிகழ்வைச் சுட்டுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜீவாதிபதி’ போன்ற மரபுவழி ஆனால் இன்றைய வாசகருக்கு குறைவாகத் தெளிவான வடிவம் தவிர்க்கப்பட்டு, ‘வாழ்வின் நாயகர்’ பயன்படுத்தப்பட்டுள்ளது. குற்றச்சாட்டு, கடவுளின் உயிர்த்தெழுப்பும் செயல், சாட்சிகளின் வாக்குமூலம் ஆகிய மூன்று கூறுகளும் கிரேக்க உரையின் வலியுறுத்தலோடு தக்கவைக்கப்பட்டுள்ளன.
