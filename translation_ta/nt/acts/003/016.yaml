id: ACT.3.16
reference: Acts 3:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: ta
  text: அவருடைய பெயர்மீது வைத்த விசுவாசத்தின் அடிப்படையில்[a], நீங்கள் பார்த்து அறிந்திருக்கிற இந்த மனிதனை அவருடைய பெயரே வலிமைப்படுத்தியது; அவர் வழியாக வரும் விசுவாசமே உங்கள் அனைவரின் முன்னிலையிலும் அந்த மனிதனுக்கு இந்த முழுமையான உடல்நலத்தை[b] அளித்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய பெயர்மீது வைத்த நம்பிக்கையின் அடிப்படையில்.’ கிரேக்கச் சொல் πίστις (பிஸ்திஸ்) ‘விசுவாசம்,’ ‘நம்பிக்கை’ அல்லது சில சூழல்களில் ‘உண்மைத்தன்மை’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘முழுமையான நலம்’ அல்லது ‘பூரண ஆரோக்கியம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: விசுவாசத்தின் அடிப்படையில்
  rationale: ἐπί + இடவேற்றுமை இங்கு அடிப்படை அல்லது காரணத்தைச் சுட்டுகிறது; கருவிப் பொருளாக மட்டும் குறுக்காமல் அதை வெளிப்படையாகக் காக்கிறது.
- source_word: πίστει
  choice: விசுவாசம்
  rationale: இச்சூழலில் இயேசுவின் பெயரைச் சார்ந்திருக்கும் நம்பிக்கையைக் குறிக்கிறது; ‘நம்பிக்கை’ என்ற இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: அவருடைய பெயர்மீது
  rationale: πίστις உடனான உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘பெயர்’ என்பது இயேசுவின் நபரையும் அதிகாரத்தையும் குறிக்கும் ஆகுபெயராக இருந்தாலும் மூலத்தின் சொல்லாட்சி காக்கப்படுகிறது.
- source_word: ἐστερέωσεν
  choice: வலிமைப்படுத்தியது
  rationale: உறுதியாக அல்லது வலிமையாக ஆக்குதல் என்ற பொருளையும், குணமடைந்த உடலில் காணப்பட்ட விளைவையும் தெரிவிக்கிறது.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: நீங்கள் பார்த்து அறிந்திருக்கிற
  rationale: மக்கள் நேரில் காண்பதையும் அந்த மனிதனை முன்பே அறிந்திருப்பதையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: அவருடைய பெயரே
  rationale: கிரேக்கத்தில் பெயர் வாக்கியத்தின் எழுவாயாக இருப்பதையும் அதன் வலியுறுத்தலையும் ‘ஏ’ மூலம் காக்கிறது.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: அவர் வழியாக உண்டாகும் விசுவாசம்
  rationale: δι’ αὐτοῦ என்பதன் ஊடகம் அல்லது வழிமுறை சார்ந்த திறந்த பொருளைக் காக்கிறது; விசுவாசம் யாருடையது என்பதைத் தீர்மானிக்கவில்லை.
- source_word: ἔδωκεν αὐτῷ
  choice: இவனுக்கு ... அளித்தது
  rationale: பேசுபவர் முன்னிலையில் உள்ள மனிதனைச் சுட்டும் இயல்பான தமிழையும், குணமளித்த நிறைவுற்ற செயலையும் தருகிறது.
- source_word: ὁλοκληρίαν
  choice: முழுமையான நலம்
  rationale: உடலின் முழு சீரடைதல் மற்றும் பூரண ஆரோக்கியம் ஆகிய கருத்துகளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: உங்கள் அனைவரின் முன்னிலையிலும்
  rationale: குணமடைதல் பொதுவில் நிகழ்ந்ததையும் அனைவருக்கும் நேரடி சான்றாக இருந்ததையும் காக்கிறது.
theological_decisions:
- issue: ‘அவருடைய பெயர்மீது/அவர் வழியாக’ உள்ள விசுவாசமும் குணமாக்குதலின் செயலாண்மையும்
  choice: இயேசுவின் பெயரே மனிதனை வலிமைப்படுத்தியதாகக் கூறி, விசுவாசத்தை அந்தப் பெயருடனும் இயேசுவின் வழியாகவும் தொடர்புபடுத்துகிறது; அந்த விசுவாசம் யாருடையது என்பதை உரை குறிப்பிடவில்லை.
  alternative: குணமடைந்த மனிதனின் விசுவாசம்; அப்போஸ்தலர்களின் விசுவாசம்; அல்லது இயேசுவால் உருவாக்கப்பட்ட விசுவாசம் என்று குறிப்பாக்குதல்.
  rationale: கிரேக்கம் விசுவாசத்தின் மனித எழுவாயை வெளிப்படையாக அடையாளப்படுத்தாததால், மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தையும் தெளிவின்மையையும் தீர்க்காமல் காக்கிறது.
- issue: ‘பெயர்’ என்பதன் ஆகுபெயர்ச் செயல்பாடு
  choice: ‘அவருடைய பெயரே’ என்ற மூலச் சொல்லாட்சி தக்கவைக்கப்படுகிறது.
  alternative: ‘இயேசுவே’ அல்லது ‘அவருடைய பெயரின் வல்லமை’ என்று வெளிப்படையாக விரித்துரைத்தல்.
  rationale: அப்போஸ்தலர் நடபடிகளில் ‘பெயர்’ இயேசுவின் நபரையும் அதிகாரத்தையும் குறிக்கும் இறையியல் செறிவுள்ள ஆகுபெயர்; அதை விரித்துரைப்பது லூக்காவின் வலியுறுத்தலைத் தட்டையாக்கும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் ‘பெயர்’ என்ற வலியுறுத்தப்பட்ட மீளுருவாக்கம் ‘அவருடைய பெயரே’ எனக் காக்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்புகள் தெளிவாக இருக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; விசுவாசம் யாருடையது என்ற தெளிவின்மை திட்டமிட்டு தீர்க்கப்படவில்லை.
