translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடையைக் கொண்ட மொழிபெயர்ப்பு. கிரேக்கத்தில் உள்ள இரண்டு நிகழ்காலப் பங்கேற்பு வடிவங்களும் தமிழில் இணையான தொழிற்பெயர் அமைப்புகளாக வழங்கப்பட்டுள்ளன; தேவையற்ற விளக்கமோ இறையியல் விரிவாக்கமோ சேர்க்கப்படவில்லை.
