  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂πᾶς ὁ λαὸς αὐτὸν⸃ περιπατοῦντα καὶ αἰνοῦντα τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/009.yaml
  text: And all the people saw him walking and praising God,
translation:
  language: ta
  text: அவன் நடப்பதையும் கடவுளைப் புகழ்வதையும் மக்கள் அனைவரும் கண்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: -உம் / மற்றும் என்ற ஒருங்கிணைப்புப் பொருள்
  rationale: இவ்வசனம் முந்தைய நிகழ்வுடன் தொடர்ந்தாலும், இயல்பான தமிழ் வாக்கியத்தில் தொடக்க இணைப்புச் சொல் தேவையில்லை; இரு செயற்பாடுகளும் ‘-உம்’ அமைப்பால் இணைக்கப்படுகின்றன.
- source_word: εἶδεν
  choice: கண்டார்கள்
  rationale: மக்கள் நேரடியாகக் கண்டதைச் சொல்லும் எளிய இயல்பான தமிழ் வினை; ஒருமை வடிவிலுள்ள கிரேக்க வினை, கூட்டுப் பொருளைக் குறிக்கும் ‘மக்கள் அனைவரும்’ என்பதற்கு தமிழில் மரியாதை/பலர்பால் இயைபுடன் தரப்பட்டுள்ளது.
- source_word: πᾶς ὁ λαὸς
  choice: மக்கள் அனைவரும்
  rationale: ‘மக்கள் முழுவதும்’ என்ற செயற்கையான வடிவத்தைத் தவிர்த்து, மக்களை ஒரு முழுக் குழுவாகக் குறிக்கும் கிரேக்கச் சொல்லின் கூட்டுப் பொருளை இயல்பாகத் தருகிறது.
- source_word: αὐτὸν
  choice: அவன் … -தை
  rationale: முந்தைய சூழலில் குணமடைந்த மனிதனைக் குறிக்கிறது; தமிழில் ‘அவன் நடப்பதை’ என்ற உட்பொதிந்த வாக்கிய அமைப்பு நேரடி பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: περιπατοῦντα
  choice: நடப்பதை
  rationale: குணமடைந்ததற்குத் தெளிவான அடையாளமான நடந்துகொண்டிருந்த செயலை நேரடியாகப் பாதுகாக்கிறது.
- source_word: καὶ αἰνοῦντα
  choice: -உம் … புகழ்வதையும்
  rationale: நடத்தல், புகழ்தல் ஆகிய இரு ஒரேநேரச் செயல்களையும் இணையாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τὸν θεόν
  choice: கடவுளை
  rationale: புகழ்ச்சியின் திட்டவட்டமான பொருளை நவீனத் தரத் தமிழில் தெளிவாகக் குறிக்கிறது.
