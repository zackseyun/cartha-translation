source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: ta
  text: உங்களுக்கு முதலில், கடவுள் தமது ஊழியரை[b] எழுப்பி[a], உங்கள் ஒவ்வொருவரையும் உங்கள் தீய வழிகளிலிருந்து திருப்புவதன் மூலம் உங்களை ஆசீர்வதிக்க அவரை அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எழுப்பி” என்பது இறந்தோரிலிருந்து உயிர்த்தெழச் செய்ததைக் குறிக்கலாம்; அல்லது தமது ஊழியரைத் தோன்றச்செய்து அல்லது நியமித்ததைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது “தமது பிள்ளையை”; παῖς என்ற கிரேக்கச் சொல் “ஊழியர்” அல்லது “பிள்ளை” என்று பொருள்படலாம். இங்கு ஏசாயாவின் ஊழியர் பின்னணி காரணமாக “ஊழியர்” என்பது அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: உங்களுக்கே முதலில்
  rationale: பேதுருவின் யூதக் கேட்போருக்கு அளிக்கப்பட்ட முன்னுரிமையையும், அவர்களிடமே முதலில் அனுப்பப்பட்டார் என்ற மறைமுகச் செயப்படுபொருள் நுட்பத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀναστήσας
  choice: எழுப்பி
  rationale: இது இறந்தோரிலிருந்து உயிர்த்தெழச் செய்தல் என்றும், ஒருவரைத் தோன்றச்செய்தல் அல்லது நியமித்தல் என்றும் புரிந்துகொள்ளப்படலாம்; ‘எழுப்பி’ என்ற சொல் அந்த இருபொருள் வாய்ப்பையும் திறந்துவைக்கிறது.
- source_word: τὸν παῖδα αὐτοῦ
  choice: தமது ஊழியரை
  rationale: παῖς என்பதற்கு ‘பிள்ளை’ என்றும் பொருள் வரலாம்; ஆனால் இங்குள்ள ஏசாயாவின் ஊழியர் பின்னணியை ‘ஊழியர்’ சிறப்பாகப் பிரதிபலிக்கிறது. ‘தமது’ என்பது கடவுளையே சுட்டும் இயல்பான தற்சுட்டுப் பயன்பாடு.
- source_word: ἀπέστειλεν
  choice: அவரை அனுப்பினார்
  rationale: அனுப்புதலின் அடிப்படைப் பொருளை மிகைப்படுத்தாமல் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: உங்களை ஆசீர்வதிக்க
  rationale: அனுப்பியதன் நோக்கம் அல்லது அதனோடு இணைந்த விளைவை இயல்பான தமிழ் வினையெச்சத் தொடரில் தெரிவிக்கிறது.
- source_word: ἐν τῷ ἀποστρέφειν
  choice: திருப்புவதன் மூலம்
  rationale: ஆசீர்வாதம் எவ்வாறு நிகழ்கிறது என்பதைச் சுட்டும் வழிமுறைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἕκαστον
  choice: உங்கள் ஒவ்வொருவரையும்
  rationale: ἕκαστον என்பதன் தனித்தனி நபர்களைச் சுட்டும் பகிர்நிலைப் பொருளையும், அது முன் குறிப்பிடப்பட்ட கேட்போரைக் குறிக்கிறது என்பதையும் இயல்பாகத் தருகிறது.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: உங்கள் தீய வழிகளிலிருந்து
  rationale: பன்மையில் உள்ள πονηρίαι குறிக்கும் வெளிப்படையான தீய நடத்தை மற்றும் வாழ்க்கை முறையை, அளவுக்கு மீறிய சொற்படியான நடையின்றி தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் ἀναστήσας என்பதன் பொருள்
  choice: ‘எழுப்பி’ என்று மொழிபெயர்த்து, உயிர்த்தெழுதல் அல்லது தோன்றச்செய்தல்/நியமித்தல் ஆகிய பொருள்களில் ஒன்றை மட்டும் முதன்மை உரையில் நிர்ணயிக்காமல் வைத்தல்
  alternative: ‘இறந்தோரிலிருந்து உயிர்த்தெழச் செய்து’ அல்லது ‘தோன்றச்செய்து/நியமித்து’
  rationale: கிரேக்கச் சொல் உயிர்த்தெழுதலோடும் கேட்கப்படலாம்; அதேவேளையில் கடவுள் ஒரு தீர்க்கதரிசியை அல்லது ஊழியரை எழுப்புவார் என்ற பின்னணியையும் எதிரொலிக்கிறது. ஆகவே மூலத்தின் உண்மையான இறையியல் நெருக்கடியைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: παῖς என்பதன் கிறிஸ்துவியல் நுட்பம்
  choice: ‘ஊழியர்’
  alternative: ‘பிள்ளை’ அல்லது ‘மகன்’
  rationale: ‘ஊழியர்’ என்பது ஏசாயாவின் ஊழியர் பின்னணியைப் பாதுகாக்கிறது. ‘மகன்’ என்பது இவ்வசனத்தின் கிரேக்கச் சொல்லைவிட வெளிப்படையான மகத்துவ உறவை இறக்குமதி செய்யும்; ‘பிள்ளை’ சாத்தியமான பொருளாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘உங்களுக்கே முதலில்’ முன்னுரிமையை இயல்பாக வலியுறுத்துகிறது; ‘திருப்புவதன் மூலம்’ ஆசீர்வாதத்தின் வழிமுறையைத் தெளிவாக வைத்திருக்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
