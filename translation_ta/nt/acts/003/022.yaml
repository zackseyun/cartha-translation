source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: ta
  text: 'மோசே உண்மையாகவே கூறினார்: “ஆண்டவராகிய கடவுள், உங்கள் சகோதரர்களிடமிருந்து[a] என்னைப் போன்ற ஒரு தீர்க்கதரிசியை உங்களுக்காக எழுப்புவார்.[b] அவர் உங்களிடம் கூறும் அனைத்திலும் அவருக்குச் செவிகொடுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் சக இஸ்ரயேலர்களிடமிருந்து.” கிரேக்கத்தில் “உங்கள் சகோதரர்களிடமிருந்து” என்று ஆண்பால் உறவுமுறைச் சொல் பயன்படுத்தப்பட்டுள்ளது; இங்கு அது உடன்படிக்கை மக்களைப் பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு அப்போஸ்தலர் நடபடிகள் 3:22, உபாகமம் 18:15-ஐச் சற்றே மாறுபட்ட சொற்களில் மேற்கோள் காட்டுகிறது. குறிப்பாக, அப்போஸ்தலர் நடபடிகளின் கிரேக்க வாசகம் “ஆண்டவராகிய கடவுள்” என்று கூறுகிறது; “ஆண்டவராகிய உங்கள் கடவுள்” என்று அல்ல.
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தனிப்பெயரின் தமிழில் நிலைபெற்றுள்ள விவிலிய வடிவம்.
- source_word: μὲν
  choice: உண்மையாகவே
  rationale: இத்துகள் தரும் வலியுறுத்தலையும் உரையாடல் முன்னேற்றத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἶπεν ὅτι
  choice: 'கூறினார்: “...”'
  rationale: மேற்கோள் சூத்திரத்தைத் தெளிவாகக் காட்ட நேர்கூற்று வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Προφήτην
  choice: ஒரு தீர்க்கதரிசியை
  rationale: கிரேக்கத்தில் சுட்டுச்சொல் இல்லாத ஒருமைப் பெயர்ச்சொல்லை இயல்பாக மொழிபெயர்க்கிறது; ‘மேசியா’ அல்லது ‘அந்தத் தீர்க்கதரிசி’ என்று விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἀναστήσει
  choice: எழுப்புவார்
  rationale: உபாகம மேற்கோளுடனான வினைத் தொடர்பைப் பேணுகிறது; இங்கு உயிர்த்தெழுதலே முதன்மைப் பொருள் என்று திணிப்பதில்லை.
- source_word: κύριος ὁ θεὸς
  choice: ஆண்டவராகிய கடவுள்
  rationale: ‘ஆண்டவர்’ மற்றும் ‘கடவுள்’ என்ற இரு கூறுகளையும் இயல்பான தமிழில் பேணுகிறது; மூலத்தில் இல்லாத ‘உங்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: உங்கள் சகோதரர்களிடமிருந்து
  rationale: ἐκ என்பதன் ‘மத்தியிலிருந்து/இடமிருந்து’ பொருளையும், ἀδελφῶν என்பதன் ஆண்பால் உறவுமுறை மொழியையும் பேணுகிறது.
- source_word: ὡς ἐμέ
  choice: என்னைப் போன்ற
  rationale: மோசேயோடு செய்யப்படும் நேரடியான ஒப்பீட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: அவருக்குச் செவிகொடுங்கள்
  rationale: வெறும் கேட்டலைவிடக் கீழ்ப்படிந்து கவனிப்பதைக் குறிக்கும் உடன்படிக்கை சார்ந்த கட்டளை வலிமையை வெளிப்படுத்துகிறது.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: அவர் உங்களிடம் கூறும் அனைத்திலும்
  rationale: எதையும் விலக்காத விரிவையும், ‘உங்களிடம் கூறுதல்’ என்ற உறவையும் சுருக்கமான நவீன தமிழில் பேணுகிறது.
theological_decisions:
- issue: உபாகமம் 18 மேற்கோளும் மேசியாவுடனான அடையாளப்படுத்தலும்
  choice: மூலத்தில் உள்ளபடி ‘ஒரு தீர்க்கதரிசி’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அந்தத் தீர்க்கதரிசி’ அல்லது ‘மேசியாவாகிய தீர்க்கதரிசி’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: அப்போஸ்தலர் நடபடிகளின் சூழலில் பேதுரு இதை இயேசுவுக்குப் பொருத்தினாலும், இந்த மேற்கோளின் கிரேக்க வாசகம் ‘ஒரு தீர்க்கதரிசி’ என்றே கூறுகிறது; அந்த அடையாளத்தை மொழிபெயர்ப்புக்குள் கூடுதலாகச் சேர்க்கக் கூடாது.
- issue: ἀδελφῶν என்பதன் உடன்படிக்கை மற்றும் இனச் சார்ந்த பொருள்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; சக இஸ்ரயேலர்கள்
  rationale: மூலத்தின் இலக்கண ஆண்பால் பன்மையைப் பேணுகிறது; அதேவேளை அதன் பிரதிநிதித்துவ உடன்படிக்கைப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம வாசிப்பு நடையுடன் வடிவமைக்கப்பட்டது. ‘தீர்க்கதரிசி,’ ‘ஆண்டவர்,’ ‘செவிகொடுங்கள்’ போன்ற பரவலாகப் புரிந்துகொள்ளப்படும் சமயச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மேற்கோளின் கட்டளை வலிமையும் மூலத்தின் தெளிவின்மைகளும் பேணப்பட்டுள்ளன.
