id: ACT.3.20
reference: Acts 3:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: ta
  text: ஆண்டவரின் சந்நிதியிலிருந்து புத்துணர்வின் காலங்கள் வரும்படியாகவும், உங்களுக்காக நியமிக்கப்பட்ட[a] மெசியாவாகிய இயேசுவை அவர் அனுப்பும்படியாகவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்களுக்காக நியமிக்கப்பட்ட” என்பதற்கு “உங்களிடம் நியமிக்கப்பட்ட” அல்லது “உங்களுக்காக முன்னரே நியமிக்கப்பட்ட” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ἂν
  choice: அதனால்
  rationale: முந்தைய மனந்திரும்புதலுக்கான அழைப்புடன் இவ்வசனத்தை நோக்கம்/விளைவு உறவால் இணைக்கிறது. இயல்பான நவீனத் தமிழில் அந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔλθωσιν
  choice: வரக்கூடும்
  rationale: ὅπως ἄν என்பதுடன் வரும் இறந்தகாலத் துணைவினையின் சார்புநிலை நுணுக்கத்தைத் தமிழில் அளவுக்கு மீறிய உறுதியோ உறுதியின்மையோ இன்றி வெளிப்படுத்துகிறது.
- source_word: καιροὶ
  choice: காலங்கள்
  rationale: குறிப்பிட்ட அல்லது ஏற்ற காலப்பகுதிகள் என்ற பரந்த பொருளைத் தக்கவைத்து, இறுதிக்கால விளக்கத்தைத் தேவையின்றி திணிப்பதில்லை.
- source_word: ἀναψύξεως
  choice: புத்துணர்வு
  rationale: இளைப்பாறுதல், நிவாரணம், புதுப்பிப்பு ஆகிய பொருள் நிழல்களை உள்ளடக்கும் மூல உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: ஆண்டவரின் சந்நிதியிலிருந்து
  rationale: πρόσωπον என்பதன் நேரடிப் பொருள் ‘முகம்’ என்றாலும், இந்த மரபுத்தொடரில் ஆண்டவரின் இருப்பு அல்லது முன்னிலை என்பதே பொருள். ‘சந்நிதி’ இதைச் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀποστείλῃ
  choice: அவர் அனுப்பக்கூடும்
  rationale: முந்தைய துணைவினையுடன் இணைந்துள்ள சார்புநிலை வினையைத் தக்கவைத்து, எழுவாயான ஆண்டவரைத் தமிழில் தெளிவாக்குகிறது.
- source_word: προκεχειρισμένον
  choice: நியமிக்கப்பட்ட
  rationale: முன்னதாகத் தேர்ந்தெடுத்து நியமித்தல் என்ற கருத்தைச் சுமக்கும் நிறைவுற்ற செயலெச்சத்தின் மையப் பொருளை இயல்பாக வழங்குகிறது; முன்னுரிமைக் கால நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்காக
  rationale: நான்காம் வேற்றுமை இங்கு ‘உங்களுக்காக’ அல்லது ‘உங்களிடம்’ எனப் புரிந்துகொள்ளப்படலாம். சூழலில் கேட்போருக்கென நியமிக்கப்பட்டவர் என்ற பொருள் இயல்பானது.
- source_word: χριστὸν
  choice: மெசியா
  rationale: இங்கு இது பெயரின் ஒரு பகுதியாக அல்லாமல் இயேசுவுக்குரிய அபிஷேகம் பெற்ற அரசர் என்ற பட்டமாகச் செயல்படுவதால், பட்டத்தின் பொருளை வெளிப்படுத்தும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: Ἰησοῦν
  choice: இயேசு
  rationale: தனிப்பட்ட பெயரின் வழக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: χριστὸν என்பதைப் பட்டமாக மொழிபெயர்ப்பதா, மரபான ‘கிறிஸ்து’ வடிவில் வைப்பதா
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இந்தச் சூழலில் χριστός இயேசுவை அடையாளப்படுத்தும் மெசியப் பட்டமாக உள்ளது. ‘மெசியா’ என்பது யூத மெசிய எதிர்பார்ப்பையும் பட்டத்தின் தன்மையையும் தெளிவாகக் காக்கிறது.
- issue: προκεχειρισμένον ὑμῖν என்பதன் பொருள்
  choice: உங்களுக்காக நியமிக்கப்பட்ட
  alternative: உங்களிடம் நியமிக்கப்பட்ட / உங்களுக்காக முன்னரே நியமிக்கப்பட்ட
  rationale: செயலெச்சத்தில் முந்தைய நியமனம் என்ற நுணுக்கமும், ὑμῖν என்பதில் ‘உங்களுக்காக’ அல்லது ‘உங்களிடம்’ என்ற வாய்ப்பும் உள்ளன. முதன்மை உரை இயல்பான மையப் பொருளைக் கொடுக்கிறது; உண்மையான மாற்று வாசிப்புகள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ‘சந்நிதி’ என்பது இச்சூழலில் பரவலாகப் புரியக்கூடிய மதச்சார் சொல்; மூலத்தின் ‘முகம்/முன்னிலை’ மரபுத்தொடரை இயல்பாகக் காக்கிறது. இணையான இரு சார்புநிலை வினைகளுக்கும் ‘வரக்கூடும் / அனுப்பக்கூடும்’ என ஒரே அமைப்பு வழங்கப்பட்டுள்ளது.
