source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: ta
  text: ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோரின் தேவனும், நம் முன்னோர்களின் தேவனுமாகியவர் தமது ஊழியரான இயேசுவை[a] மகிமைப்படுத்தினார். பிலாத்து அவரை விடுதலை செய்யத் தீர்மானித்திருந்தபோது, நீங்களோ அவரை ஒப்படைத்து, பிலாத்துவின் முன்னிலையில் அவரை மறுதலித்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது பிள்ளையான இயேசுவை.” παῖς என்ற கிரேக்கச் சொல் “பிள்ளை” என்றும் “ஊழியர்” என்றும் பொருள்படலாம். ஏசாயா நூலில் வரும் கர்த்தருடைய ஊழியரைப் பற்றிய மொழி இங்கு எதிரொலிப்பதாகத் தோன்றுவதால், முதன்மை உரையில் “ஊழியர்” என்று தரப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: ஆபிரகாமின் தேவனும் ஈசாக்கின் தேவனும் யாக்கோபின் தேவனும்
  rationale: உடன்படிக்கைச் சூத்திரத்தின் வேதாகமத் தொனியையும் கிரேக்கத்தில் வரும் தொடர் இணைப்புகளையும் இயன்றவரை காக்கிறது.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: நம் முன்னோர்களின் தேவன்
  rationale: πατέρων என்பதன் வம்சவழி மற்றும் உடன்படிக்கைச் சுட்டலை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; இங்கு குறிப்பது பிதாக்கள் மட்டுமல்ல, முந்தைய தலைமுறையினரையும் உள்ளடக்கிய மூதாதை மரபாகும்.
- source_word: ἐδόξασεν
  choice: மகிமைப்படுத்தினார்
  rationale: δοξάζω என்பதன் வலுவான வேதாகம மற்றும் இறையியல் பொருளைக் காக்கிறது; வெறுமனே ‘கனப்படுத்தினார்’ என்பதைக் காட்டிலும் இயேசுவைப் பற்றிய இச்சூழலுக்கு ஏற்றது.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: தமது ஊழியரான இயேசுவை
  rationale: παῖς என்பது ‘பிள்ளை’ அல்லது ‘ஊழியர்’ என்று பொருள்படலாம். ஏசாயாவின் கர்த்தருடைய ஊழியர் மொழியுடனான சாத்தியமான தொடர்பால் முதன்மை உரையில் ‘ஊழியர்’ தேர்ந்தெடுக்கப்படுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παρεδώκατε
  choice: ஒப்படைத்து
  rationale: παραδίδωμι என்பதன் நீதித்துறைச் சூழலுக்கேற்ற நேரடியான பொருளைத் தருகிறது; ‘காட்டிக்கொடுத்தீர்கள்’ என்பது தேவையற்ற விதத்தில் துரோகத்தின் நுணுக்கத்தை அதிகரிக்கலாம்.
- source_word: ἠρνήσασθε
  choice: மறுதலித்தீர்கள்
  rationale: ἀρνέομαι என்பதன் நேரடியான பொருளையும் புதிய ஏற்பாட்டின் மறுதலிப்பு மொழியுடனான தொடர்பையும் காக்கிறது.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: பிலாத்துவின் முன்னிலையில்
  rationale: ‘பிலாத்துவின் முகத்திற்கு முன்பாக’ என்ற சொல்லடியான வடிவத்தை நவீனத் தமிழில் இயல்பான பொது மற்றும் நேரடி முன்னிலைச் சொல்லாக்கமாக வழங்குகிறது.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: பிலாத்து அவரை விடுதலை செய்யத் தீர்மானித்திருந்தபோது
  rationale: கிரேக்கத்தின் genitive absolute அமைப்பை காலநிலைத் தொடர்பாக மொழிபெயர்க்கிறது; κρίναντος என்பதிலுள்ள தீர்ப்பு அல்லது முடிவு கருத்தையும் நீதித்துறைச் சூழலில் ἀπολύειν என்பதன் ‘விடுதலை செய்தல்’ பொருளையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் παῖς என்பதன் மொழிபெயர்ப்பு
  choice: ஊழியர்
  alternative: பிள்ளை
  rationale: சொல் இரு பொருள்களையும் ஏற்கிறது. ஏசாயாவின் ஊழியர் மொழியுடனான சாத்தியமான எதிரொலியை முன்னிட்டு ‘ஊழியர்’ முதன்மையாகத் தேர்ந்தெடுக்கப்படுகிறது; ஆனால் ‘பிள்ளை’ என்ற உண்மையான சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐδόξασεν என்பதன் காலம் மற்றும் வினைநிலை
  choice: மகிமைப்படுத்தினார்
  alternative: மகிமைப்படுத்தியுள்ளார்
  rationale: கிரேக்க aorist இறந்தகாலச் செயலைக் கூறுகிறது; தமிழில் எளிய இறந்தகாலம் இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது. நிகழ்காலத் தொடர்விளைவை மொழிபெயர்ப்பில் கட்டாயமாகச் சேர்க்கவில்லை.
- issue: κρίναντος என்ற participle-இன் தொடர்பு
  choice: தீர்மானித்திருந்தபோது
  alternative: தீர்மானித்திருந்தபோதிலும்
  rationale: மூலத்தின் இலக்கண வடிவம் அடிப்படையில் காலநிலைத் தொடர்பை அனுமதிக்கிறது. சூழலில் முரண்பாட்டு உணர்வு இருந்தாலும் ‘போதிலும்’ என்று அதை வெளிப்படையாகத் தீர்மானிக்காமல், ‘போது’ மூலம் மூலத்தின் திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. உடன்படிக்கைச் சூத்திரத்தின் மீளுருவாக்கத்தைப் பாதுகாக்க பெயர்கள் ஒவ்வொன்றுடனும் ‘தேவன்’ மீண்டும் வருகிறது. ‘நீங்களோ’ என்பது கிரேக்க μὲν தரும் வலியுறுத்தல் அல்லது மாறுபாட்டை தமிழில் மெதுவாக வெளிப்படுத்துகிறது.
