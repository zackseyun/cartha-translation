  source_fidelity: மூலத்தின் மென்மையான தொடர்ச்சிச் சொல் δέ-ஐத் தனியாகச் சேர்க்காமல் விடுவது தமிழில் இயல்பானது. ἀνέβαινον என்பதன் தொடர்நிகழ் இறந்தகாலமும் மேல்நோக்கிய இயக்கமும் “ஏறிச் சென்றுகொண்டிருந்தார்கள்” என்பதில் போதுமானவாறு வெளிப்படுகின்றன. ἱερόν-க்கு “ஆலயம்” என்பது வாசிக்க எளியதும் சூழலுக்குப் பொருத்தமானதுமாகும். “ஜெப நேரமான ஒன்பதாம் மணிக்கு” என்பது நியமிக்கப்பட்ட ஜெப நேரத்தையும் ஒன்பதாம் மணியையும் துல்லியமாகத் தெரிவிக்கிறது.
