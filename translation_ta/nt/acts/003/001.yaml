  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: ta
  text: ஜெப நேரமான ஒன்பதாம் மணிக்கு[a], பேதுருவும் யோவானும் ஆலயத்திற்கு ஏறிச் சென்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இன்றைய நேரக் கணக்கின்படி பிற்பகல் சுமார் மூன்று மணி.
    reason: cultural_note
lexical_decisions:
- source_word: δέ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான எதிர்மறையைக் காட்டாமல் கதையைத் தொடர்ந்து நகர்த்தும் மென்மையான இணைப்பாக உள்ளது. தமிழில் தேவையற்ற ‘அப்போது’ அல்லது ‘ஆனால்’ சேர்க்காமல் வாக்கியத் தொடர்ச்சியிலேயே அதன் பணி வெளிப்படுகிறது.
- source_word: ἀνέβαινον
  choice: ஏறிச் சென்றுகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கும் imperfect வடிவத்தை ‘சென்றுகொண்டிருந்தார்கள்’ காக்கிறது; ἀναβαίνω-வில் உள்ள மேல்நோக்கிய இயக்கத்தையும் ‘ஏறி’ வெளிப்படுத்துகிறது.
- source_word: ἱερόν
  choice: ஆலயம்
  rationale: இச்சொல் உள் பரிசுத்த அறையை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கிறது. சாதாரண வாசகருக்கு இயல்பாகவும் பரவலாகவும் புரியும் வகையில் ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: ஜெப நேரமான ... மணிக்கு
  rationale: நியமிக்கப்பட்ட ஜெப நேரத்தில் அவர்கள் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தின் காலத் தொடர்பும் காக்கப்படுகிறது.
- source_word: τὴν ἐνάτην
  choice: ஒன்பதாம் மணி
  rationale: மூல உரையின் யூத நேரக் கணக்கை முதன்மை உரையில் காக்கிறது; இன்றைய நேரக் கணக்கிலான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
