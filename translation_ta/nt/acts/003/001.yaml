translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஜெபம்’ பொதுவாகப் புரியும் வழிபாட்டு மொழியாகத் தேர்ந்தெடுக்கப்பட்டது; தொடர்ச்சியான செயலும் ஆலயத்தை நோக்கிய மேலேற்றமும் வெளிப்படுமாறு வினைச்சொல் அமைக்கப்பட்டுள்ளது.
