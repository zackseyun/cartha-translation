source:
  edition: SBLGNT
  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: ta
  text: அந்தத் தீர்க்கதரிசிக்குச் செவிகொடுக்காத ஒவ்வொருவரும் மக்கள் நடுவிலிருந்து முற்றிலும் அழிக்கப்படுவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மக்கள் நடுவிலிருந்து அறுத்துப்போடப்படுவார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: ஒவ்வொருவரும்
  rationale: சொல்லுக்கு சொல் ‘ஒவ்வோர் உயிரும்’ என்றாலும், இங்கு ψυχή என்பது தனிநபரைக் குறிக்கும் மரபுத்தொடர். ‘ஒவ்வொருவரும்’ என்பது இருமைவாத மானுடவியலைப் புகுத்தாமல் இயல்பான நவீன தமிழில் பொருளைத் தருகிறது.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: செவிகொடுக்காத
  rationale: ἥτις ἂν உடன் இறந்தகாலத் துணைவினை வடிவம் ‘யாராயினும்/எவர் ... செய்யவில்லையோ’ என்ற பொதுவான நிபந்தனையைக் குறிக்கிறது. ἀκούω இங்கு வெறுமனே ஒலி கேட்பதல்ல, பதிலளிக்கும் விதமாகக் கேட்டுக் கீழ்ப்படிவதையும் உணர்த்துவதால் ‘செவிகொடுக்காத’ எனத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: τοῦ προφήτου ἐκείνου
  choice: அந்தத் தீர்க்கதரிசிக்கு
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட மோசேயைப் போன்ற குறிப்பிட்ட தீர்க்கதரிசியை இது சுட்டுகிறது. கிரேக்கத்தில் இது தனிப்பட்ட பட்டப்பெயராகக் குறிக்கப்படாததால் தமிழிலும் இயல்பான பொதுப்பெயர் வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: ἐξολεθρευθήσεται
  choice: முற்றிலும் அழிக்கப்படுவார்கள்
  rationale: ἐξολεθρεύω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம் முழுமையான அழிவு அல்லது அகற்றலை வலியுறுத்துகிறது. ‘முற்றிலும் அழிக்கப்படுவார்கள்’ அந்த வலிமையைத் தெளிவாகக் காக்கிறது; ‘அறுத்துப்போடப்படுவார்கள்’ என்ற உடன்படிக்கைச் சமூகச் சொல்லாட்சி அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐκ τοῦ λαοῦ
  choice: மக்களிடமிருந்து
  rationale: ἐκ என்பது மக்களாகிய சமூகத்தின் நடுவிலிருந்து அகற்றப்படுவதைச் சுட்டுகிறது. மூலத்தில் உடைமைப்பெயர் இல்லாததால் ‘அவருடைய மக்கள்’ என்று சேர்க்கப்படவில்லை.
theological_decisions:
- issue: தீர்க்கதரிசிக்குச் செவிகொடுக்க மறுப்பவருக்கு அறிவிக்கப்படும் நியாயத்தீர்ப்பின் தன்மை
  choice: அழிவு மற்றும் மக்களிடமிருந்து அகற்றப்படுதல் என்ற கடுமையான எச்சரிக்கையை மட்டும் கூறி, அதன் காலத்தையோ முறையையோ வரையறுக்காமல் வைத்தல்
  alternative: உடன்படிக்கைச் சமூகத்திலிருந்து நீக்கப்படுதல் மட்டுமே; அல்லது இறுதி தெய்வீக நியாயத்தீர்ப்பு என்று குறிப்பாக்குதல்
  rationale: வசனம் கடுமையான தெய்வீக நியாயத்தீர்ப்பைத் தெளிவாக அறிவிக்கிறது; ஆனால் அது இவ்வுலகத் தண்டனையா, உடன்படிக்கைச் சமூகத்திலிருந்து நீக்கமா, இறுதி நியாயத்தீர்ப்பா என்பதைத் தனித்துத் தீர்மானிக்கவில்லை. ஆகவே மூலத்தின் தீவிரமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘செவிகொடு’ என்பது கேட்டுக் கீழ்ப்படிதல் என்ற உடன்படிக்கைச் சூழலின் நுண்ணிய பொருளைக் காக்கிறது. ‘முற்றிலும் அழிக்கப்படுவார்கள்’ என்பது கிரேக்க வினையின் வலிமையைத் தக்கவைக்கிறது; மாற்றுச் சமூக-நீக்கச் சொல்லாட்சி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
