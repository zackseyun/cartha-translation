  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: ta
  text: ஆனால் கடவுள், தம்முடைய மேசியா[a] துன்பப்படுவார் என்று எல்லா இறைவாக்கினர்களின் வாயிலாக[b] முன்பே அறிவித்ததை இவ்வாறு நிறைவேற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கில், ‘தம்முடைய கிறிஸ்து’; Χριστός இங்கு ஒரு பட்டமாக இருப்பதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘எல்லா இறைவாக்கினர்கள் மூலமாக.’ கிரேக்கில் சொல்லுக்குச் சொல், ‘எல்லா இறைவாக்கினர்களின் வாய் வழியாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் மக்களின் செயலுக்கும் இங்கு கடவுளின் நிறைவேற்றும் செயலுக்கும் உள்ள முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: προκατήγγειλεν
  choice: முன்பே அறிவித்ததை
  rationale: προ- என்பதன் முன்னதாக என்ற காலக் கூறையும், அறிவித்தல் என்ற சொல்லாற்றலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: எல்லா இறைவாக்கினர்களின் வாயிலாக
  rationale: ‘வாயின் மூலம்’ என்ற மூலமொழியின் உருவகத்தை இயல்பான தமிழில் ‘வாயிலாக’ என்று தக்கவைத்து, πάντων என்பதையும் ‘எல்லா’ என்று வெளிப்படுத்துகிறது.
- source_word: παθεῖν
  choice: துன்பப்படுவார் என்று
  rationale: முன்னறிவிப்பின் உள்ளடக்கத்தை இயல்பான தமிழில் கூறுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கட்டாயம்’ என்ற பொருளைச் சேர்ப்பதில்லை.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: தம்முடைய மேசியா
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் ‘மேசியா’ எனவும், αὐτοῦ கடவுளைக் குறிப்பதால் தமிழின் இயல்பான தற்சுட்டுப் பெயரடையாக ‘தம்முடைய’ எனவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐπλήρωσεν
  choice: நிறைவேற்றினார்
  rationale: முன்னறிவிக்கப்பட்டது நிகழச் செய்தார் என்ற வேதவாக்கு நிறைவேற்றப் பொருளைத் தெளிவாகக் காட்டும் வழக்கமான தமிழ் சொல்.
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: முன்னர் விவரிக்கப்பட்ட மேசியாவின் துன்பத்தின் வழியாகவே கடவுள் தமது அறிவிப்பை நிறைவேற்றினார் என்ற விதத்தைக் குறிக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து / அபிஷேகம் பெற்றவர்
  rationale: இங்கு இது பெயராக அல்ல, கடவுளால் நியமிக்கப்பட்டவரைக் குறிக்கும் பட்டமாக வருகிறது. ‘மேசியா’ என்பது பேதுருவின் யூத மேசியா எதிர்பார்ப்புச் சூழலைப் பாதுகாக்கிறது.
- issue: παθεῖν என்பதன் வலிமை
  choice: துன்பப்படுவார் என்று
  alternative: துன்பப்பட வேண்டும் என்று
  rationale: இறைவாக்கினர்கள் அறிவித்த உள்ளடக்கத்தைச் சொல்கிறது; இந்த வினையெச்சம் தனியாகக் கூறாத கட்டாய அவசியத்தை மொழிபெயர்ப்பில் சேர்க்காமல் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: αὐτοῦ என்பதன் தொடர்பு
  choice: தம்முடைய மேசியா
  alternative: அவருடைய மேசியா
  rationale: αὐτοῦ என்பது மேசியாவைக் கடவுளோடு தொடர்புபடுத்துகிறது. தமிழில் வாக்கியத்தின் எழுவாயான கடவுளையே திரும்பச் சுட்டுவதற்கு ‘தம்முடைய’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘இறைவாக்கினர்கள்’ என்பது προφῆται என்பதற்கான இயல்பான, சமயப் பிரிவுசார்பற்ற சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் ‘வாய்’ உருவகம் ‘வாயிலாக’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
