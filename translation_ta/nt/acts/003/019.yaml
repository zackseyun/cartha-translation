revisions:
- from: ஆகவே, மனந்திரும்பிக் கடவுளிடம் திரும்புங்கள்; அப்போது உங்கள் பாவங்கள் துடைத்தழிக்கப்படும்[a].
  to: ஆகையால், மனந்திரும்பி, திரும்புங்கள்; உங்கள் பாவங்கள் துடைத்தழிக்கப்படும்படி[a].
  rationale: “அப்போது” என்பதற்குப் பதிலாக “...படும்படி” பயன்படுத்தப்பட்டுள்ளது. இதனால் πρὸς τὸ ἐξαλειφθῆναι-யின் நோக்கம்/விளைவு சார்ந்த தொடர்பு காக்கப்படுகிறது; பாவநீக்கத்தின் கோட்பாட்டு இயங்குமுறை வரையறுக்கப்படவில்லை. மூலத்தில் வெளிப்படையாக இல்லாத “கடவுளிடம்” நீக்கப்பட்டுள்ளது. அடிக்குறிப்பு மாற்றுச் சொல்லை இயல்பாகவும், மூல வினைச்சொல்லின் அழித்தல்/துடைத்தல் உருவகத்துக்கு ஏற்பவும் தருகிறது.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:36:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the two coordinated aorist imperatives and the passive removal of sins. However, “அப்போது” (‘then/at that time’) weakens and shifts πρὸς τὸ + infinitive, which here expresses the intended purpose/result. The explicit “கடவுளிடம்” is contextually plausible but is not stated in this clause; Tamil can retain the source’s unexpressed destination.
  naturalness: The revised wording is clear, dignified modern standard Tamil, and preserves the deliberately paired commands without making the second command passive or doctrinally technical.
  terminology: “மனந்திரும்பி” appropriately renders μετανοήσατε, and “பாவங்கள்” is standard. “துடைத்தழிக்கப்படும்படி” preserves the passive image of ἐξαλειφθῆναι and the purpose construction. The footnote supplies a natural alternative that retains the record-erasure imagery.
  issues:
  - severity: medium
    issue: “அப்போது” is used for πρὸς τὸ ἐξαλειφθῆναι.
    rationale: '“அப்போது” primarily marks temporal sequence, whereas the Greek articular infinitive marks purpose/result: repentance and turning are commanded with a view to sins being wiped out. “...படும்படி” retains this connection without specifying a theological mechanism.'
  - severity: low
    issue: “கடவுளிடம்” makes explicit a destination absent from the Greek clause.
    rationale: The wider context supports turning toward God, but the source leaves the destination unexpressed. Omitting it better preserves the wording and avoids an unnecessary addition.
  revised_text: ஆகையால், மனந்திரும்பி, திரும்புங்கள்; உங்கள் பாவங்கள் துடைத்தழிக்கப்படும்படி[a].
  revised_footnotes:
  - marker: a
    text: அல்லது, “அழித்துவிடப்படும்படி.”
