  revision_rationale: “அப்போது” என்பதற்குப் பதிலாக “...படும்படி” பயன்படுத்தப்பட்டுள்ளது. இதனால் πρὸς τὸ ἐξαλειφθῆναι-யின் நோக்கம்/விளைவு சார்ந்த தொடர்பு காக்கப்படுகிறது; பாவநீக்கத்தின் கோட்பாட்டு இயங்குமுறை வரையறுக்கப்படவில்லை. மூலத்தில் வெளிப்படையாக இல்லாத “கடவுளிடம்” நீக்கப்பட்டுள்ளது. அடிக்குறிப்பு மாற்றுச் சொல்லை இயல்பாகவும், மூல வினைச்சொல்லின் அழித்தல்/துடைத்தல் உருவகத்துக்கு ஏற்பவும் தருகிறது.
