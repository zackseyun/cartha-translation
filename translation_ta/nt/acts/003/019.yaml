  text: μετανοήσατε οὖν καὶ ἐπιστρέψατε ⸀πρὸς τὸ ἐξαλειφθῆναι ὑμῶν τὰς ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: ta
  text: ஆகையால், மனந்திரும்பி, திரும்புங்கள்; உங்கள் பாவங்கள் துடைத்தழிக்கப்படும்படி[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழித்துவிடப்படும்படி.”
    reason: ἐξαλείφω என்பதற்கான மாற்று மொழிபெயர்ப்பு; பதிவிலுள்ள எழுத்தைத் துடைத்து நீக்கும் உருவகத்தை இது குறிக்கிறது.
lexical_decisions:
- source_word: μετανοήσατε
  choice: மனந்திரும்புங்கள்
  rationale: இறந்தகாலக் கட்டளை வடிவம் தீர்மானமான மனமாற்றத்தையும் வாழ்வின் திசைமாற்றத்தையும் கோருகிறது. ‘மனதை மாற்றுங்கள்’ என்பது இங்கு உள்ள ஒழுக்க மற்றும் உடன்படிக்கை சார்ந்த வலிமையைக் குறைக்கலாம்; ‘பாவங்களை விட்டு விலகுங்கள்’ என்பது அடுத்து வரும் ἐπιστρέψατε என்பதோடு தேவையற்ற முறையில் ஒன்றிவிடும்.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἐπιστρέψατε
  choice: கடவுளிடம் திரும்புங்கள்
  rationale: செயப்படுபொருள் மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், இச்சூழலில் திரும்புதலின் திசை கடவுளை நோக்கியது. வெறும் ‘திரும்புங்கள்’ என்பது தமிழில் முழுமையற்றதாக ஒலிக்கலாம்; ‘மாற்றப்படுங்கள்’ என்பது மூலத்தின் செயப்பாட்டு கட்டளை வடிவத்தை மறைத்துவிடும்.
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: அப்போது ... துடைத்தழிக்கப்படும்
  rationale: πρός + பெயர்ச்சொல் நிலையிலான வினையெச்சம் நோக்கம் அல்லது விளைவு என்ற இரு நிழல்களையும் கொண்டிருக்கலாம். ‘அப்போது’ என்பது மனந்திரும்புதல், திரும்புதல், பாவநீக்கம் ஆகியவற்றின் தொடர்பை இயல்பாகக் காட்டுகிறது; அதன் துல்லியமான கோட்பாட்டு இயங்குமுறையை நிர்ணயிப்பதில்லை.
- source_word: ἐξαλειφθῆναι
  choice: துடைத்தழிக்கப்படும்
  rationale: ἐξαλείφω என்பதிலுள்ள எழுத்தையோ பதிவையோ துடைத்து நீக்கும் உருவகத்தைத் தக்கவைத்தபடி, முழுமையான நீக்கத்தைத் தெளிவாகச் சொல்கிறது.
- source_word: ἁμαρτίας
  choice: பாவங்கள்
  rationale: ἁμαρτία என்ற பன்மைக்கான வழக்கமான, நேரடியான தமிழ் இணை; ‘பாவச் செயல்கள்’ என்று குறுக்கமாக விளக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: மனந்திரும்புதல்/கடவுளிடம் திரும்புதல் மற்றும் பாவநீக்கம் ஆகியவற்றின் உறவு
  choice: ‘அப்போது உங்கள் பாவங்கள் துடைத்தழிக்கப்படும்’ என்று அவற்றின் நெருங்கிய தொடர்பைச் சொல்லுதல்
  alternative: ‘உங்கள் பாவங்கள் துடைத்தழிக்கப்படுவதற்காக’ என்று வெளிப்படையான நோக்கக் கட்டமைப்பில் மொழிபெயர்த்தல்
  rationale: மூலம் கட்டளையிடப்பட்ட மனிதப் பதிலையும் பாவங்களின் நீக்கத்தையும் இணைக்கிறது; ஆனால் முழுமையான இரட்சிப்பு ஒழுங்கையோ காரண இயங்குமுறையையோ இவ்வசனம் தனித்து வரையறுப்பதில்லை. தமிழ் வாசிப்பில் இயல்பை காத்துக்கொண்டே அந்த இறையியல் அழுத்தத்தைத் தீர்த்துவிடாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் வேதாகம வாசிப்பிற்கேற்ற கண்ணியமான நடை. ‘மனந்திரும்புங்கள்’ மற்றும் ‘திரும்புங்கள்’ என்ற இரு தனித்த கட்டளைகளும் பாதுகாக்கப்பட்டுள்ளன. தமிழில் திசை தெளிவாக இருக்க ‘கடவுளிடம்’ என்பது சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது.
