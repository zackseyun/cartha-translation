base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: ta
  text: பேதுரு யோவானுடன் சேர்ந்து அவனை உற்றுப் பார்த்து[a], “எங்களைப் பார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூர்ந்து பார்த்து.” கிரேக்க வினை ஒருவர்மேல் பார்வையையும் கவனத்தையும் நிலைநிறுத்திப் பார்ப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: உற்றுப் பார்த்து
  rationale: இந்த வினையெச்சம் வெறுமனே பார்ப்பதை அல்ல, ஒருவர்மேல் கவனத்தைக் குவித்துக் கூர்ந்து பார்ப்பதைக் குறிக்கிறது. ‘உற்றுப் பார்த்து’ என்பது அந்தத் தீவிரத்தைக் இயல்பான தமிழில் தருகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான எதிர்மறை இணைப்பாக இல்லாமல் கதையை முன்ன நகர்த்தும் மென்மையான இணைப்பாக உள்ளது. தமிழில் தனி இணைப்புச் சொல் இல்லாமலேயே தொடர் இயல்பாக அமைகிறது.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: யோவானுடன் சேர்ந்து
  rationale: σύν உடனிருப்பதையும் செயலில் இணைந்திருப்பதையும் குறிக்கிறது; ‘உடன் சேர்ந்து’ அந்த வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἶπεν
  choice: என்றார்
  rationale: நேரடி மேற்கோளைத் தொடர்ந்து வரும் இயல்பான தமிழ் பேச்சு வினை இது; கிரேக்கத்தின் சாதாரண ‘சொன்னார்’ என்ற பொருளைச் சரியாகத் தருகிறது.
- source_word: Βλέψον
  choice: பார்
  rationale: இது ஒருமை இரண்டாம் நபருக்கான நேரடியான கட்டளை. ‘பார்’ சுருக்கமாகவும் சூழலுக்கு இயல்பாகவும் உள்ளது.
- source_word: εἰς ἡμᾶς
  choice: எங்களை
  rationale: பார்வை செலுத்தப்படும் நபர்களைத் தமிழில் ‘எங்களைப் பார்’ என்று இயல்பாகக் குறிப்பிடுவது திசைநோக்கிய கவனத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἰς αὐτόν
  choice: அவனை
  rationale: ἀτενίζω என்பதுடன் εἰς பார்வை குவிக்கப்படும் நபரைக் குறிக்கிறது; தமிழில் நேரடி செயப்படுபொருளாக ‘அவனை உற்றுப் பார்த்து’ என்பது இயல்பானது.
