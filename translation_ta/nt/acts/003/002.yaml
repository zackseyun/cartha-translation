- source_word: τις ἀνὴρ
  choice: ஒரு மனிதன்
  rationale: τις என்பது குறிப்பிட்ட ஆனால் இதுவரை அறிமுகப்படுத்தப்படாத ஒருவரைச் சுட்டுகிறது; நவீன தமிழில் ‘ஒரு மனிதன்’ இயல்பாக அந்தக் கதையாடல் தன்மையைத் தருகிறது.
- source_word: χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων
  choice: தன் தாயின் கருப்பையிலிருந்தே நடக்க இயலாதிருந்த
  rationale: χωλός குறிக்கும் நடக்க இயலாத உடல்நிலையையும், ὑπάρχων குறிக்கும் நீடித்த நிலையையும் தெளிவாகவும் மரியாதையாகவும் தெரிவிக்கிறது; மூலத்தின் கருப்பை உருவகமும் காக்கப்படுகிறது.
- source_word: ἐβαστάζετο
  choice: சுமந்துகொண்டு வரப்பட்டான்
  rationale: இறந்தகாலத்தில் தொடர்ச்சியாக அல்லது வழக்கமாக நிகழ்ந்த செயலைக் குறிக்கும் imperfect passive வடிவத்தையும், செய்பவர்கள் பெயரிடப்படாததையும் காக்கிறது.
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: அவனை நாள்தோறும் அமர்த்திவந்தார்கள்
  rationale: ἐτίθουν என்பதன் வழக்கமாகத் திரும்பத் திரும்ப நிகழும் இறந்தகாலச் செயலை ‘அமர்த்திவந்தார்கள்’ இயல்பான தமிழில் வெளிப்படுத்துகிறது; καθ’ ἡμέραν ‘நாள்தோறும்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: θύραν τοῦ ἱεροῦ
  choice: ஆலயத்தின் வாசல்
  rationale: பொது கட்டடச் சூழலில் θύρα என்பதற்கு ‘வாசல்’ இயல்பானது. ἱερόν என்பது உட்பரிசுத்த அறையை மட்டும் அல்ல, ஆலய வளாகத்தைக் குறிக்கும்; அந்த வேறுபாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: ‘அழகு வாசல்’ என்று அழைக்கப்பட்ட
  rationale: Ὡραίαν இங்கு வாசலின் பெயராகச் செயல்படுகிறது. ‘அழகு வாசல்’ என்பது அதன் பெயர்ச் செயல்பாட்டையும் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: பிச்சை கேட்பதற்காக
  rationale: articular infinitive-இன் நோக்கப் பொருளை ‘கேட்பதற்காக’ தெளிவாக்குகிறது; ἐλεημοσύνην ஏழைகளுக்கு வழங்கப்படும் உதவியை இச்சூழலில் ‘பிச்சை’ எனத் துல்லியமாகக் குறிக்கிறது.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: ஆலயத்திற்குள் செல்பவர்களிடம்
  rationale: உள்ளே சென்றுகொண்டிருப்பவர்களிடமிருந்து உதவி கேட்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
