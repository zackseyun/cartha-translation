translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையைக் கையாளுகிறது. ‘சப்பாணி’ போன்ற காலாவதியான அல்லது இழிவாக உணரப்படக்கூடிய சொல்லுக்குப் பதிலாக ‘நடக்க இயலாதிருந்த’ பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டாலும், தொடர்ச்சியான சுமத்தல், நாள்தோறும் அமர்த்துதல், பிச்சை கேட்கும் நோக்கம் ஆகிய தொடர்புகள் காக்கப்பட்டுள்ளன.
