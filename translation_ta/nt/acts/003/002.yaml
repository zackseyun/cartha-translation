base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: ta
  text: தன் தாயின் கருப்பையிலிருந்தே[b] நடக்க இயலாத ஒரு மனிதன் சுமந்து கொண்டு வரப்பட்டான். ஆலயத்தின்[a] ‘அழகு வாசல்’ என்று அழைக்கப்பட்ட வாசலில்[c] அவனை நாள்தோறும் வைத்துவந்தார்கள்; ஆலயத்திற்குள் செல்பவர்களிடம் தர்மம் கேட்பதற்காக அப்படிச் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் ἱερόν, உட்பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: cultural_note
