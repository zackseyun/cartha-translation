  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: ta
  text: நீங்கள் தீர்க்கதரிசிகளின் மகன்களும்[a], கடவுள் உங்கள் முன்னோர்களோடு செய்த உடன்படிக்கையின் வாரிசுகளுமாய் இருக்கிறீர்கள். கடவுள் ஆபிரகாமிடம், “உன் சந்ததியில்[b] பூமியிலுள்ள எல்லாக் குடும்பங்களும் ஆசீர்வதிக்கப்படும்” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிள்ளைகள்.” கிரேக்கத்தில் “மகன்கள்”; இது உடன்படிக்கையின் மரபுரிமையாளர்கள் அல்லது அதில் பங்குள்ளவர்கள் என்பதைக் குறிக்கும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வித்து.” கிரேக்கச் சொல் ஆபிரகாமின் வழிவந்தவர்களை மொத்தமாகக் குறிக்கலாம்; வேதாகம-இறையியல் சூழலில் ஒருமை பிரதிநிதியையும் சுட்டும் பொருள் நுணுக்கத்தைத் தாங்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: மகன்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மையை நேரடியாகக் காக்கிறது; இச்சூழலில் இது உயிரியல் மகன்களை மட்டும் அல்லாமல், தீர்க்கதரிசன வாக்குறுதிகளிலும் உடன்படிக்கையிலும் பங்கும் உரிமையும் உடையவர்களைக் குறிக்கும் மரபுரிமைச் சொற்றொடர்.
- source_word: προφητῶν
  choice: தீர்க்கதரிசிகளின்
  rationale: வேற்றுமைத் தொடர்பை நேரடியாக வழங்குகிறது; தீர்க்கதரிசிகளின் வாக்குறுதி மரபில் நிற்பவர்கள் என்ற பொருள் சூழலில் வெளிப்படுகிறது.
- source_word: διαθήκης
  choice: உடன்படிக்கை
  rationale: ஆபிரகாமையும் முன்னோர்களையும் குறிக்கும் வேதாகமச் சூழலில், கடவுள் ஏற்படுத்திய உறுதிப்படுத்தப்பட்ட உறவைத் தெளிவாகக் குறிக்கிறது.
- source_word: διέθετο
  choice: செய்த
  rationale: உடன்படிக்கையை ஏற்படுத்துதல் என்ற கிரேக்க இடைநிலை வினையின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: உங்கள் முன்னோர்களோடு
  rationale: இங்கு πατέρες என்பது உடனடி தந்தையரை அல்ல, இஸ்ரயேலின் முற்பிதாக்களைச் சுட்டுகிறது; உடன்படிக்கைச் செய்வதன் உறவுசார் பொருளை ‘-ஓடு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγων πρὸς Ἀβραάμ
  choice: அவர் ஆபிரகாமிடம் … என்று சொன்னார்
  rationale: கிரேக்கப் பங்கேற்பு வினையெச்சத்தை இயல்பான தமிழ் முதன்மை வாக்கியமாக மாற்றி, மேற்கோளைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: σπέρματί
  choice: வழித்தோன்றலில்
  rationale: ஆபிரகாமின் சந்ததியைக் கூட்டாகக் குறிக்கவும், ஒருமை பிரதிநிதித்துவ நுண்ணுணர்வை முற்றிலும் நீக்காமலும் உதவும் சொல்; ‘வித்து’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பானது.
- source_word: ἐνευλογηθήσονται
  choice: ஆசீர்வதிக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தை நேரடியாகக் காக்கிறது.
- source_word: πατριαὶ
  choice: குடும்பங்கள்
  rationale: குடும்ப அல்லது குலக் குழுக்களைக் குறிக்கும் சொல்லுக்கு இயல்பான, பரந்த தமிழ் இணை.
- source_word: γῆς
  choice: பூமி
  rationale: ஆபிரகாமிய வாக்குறுதியின் உலகளாவிய நோக்கத்தை வெளிப்படுத்துகிறது; ‘நாடு’ என்று வரையறுப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: υἱοὶ என்பதிலுள்ள பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: மூலத்தின் ஆண்பால் வடிவத்தையும் உடன்படிக்கை மரபுரிமைச் சொற்றொடரையும் முதன்மை உரையில் காக்கிறது; அது உள்ளடக்கும் பரந்த பிரதிநிதித்துவப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: σπέρμα என்பதிலுள்ள ஆபிரகாமிய வாக்குறுதியின் பொருள் விரிவு
  choice: வழித்தோன்றல்
  alternative: வித்து; சந்ததி
  rationale: ஆபிரகாமின் வழிவந்தவர்களை மொத்தமாகக் குறிக்கும் பொருளுக்கும், ஒருமை பிரதிநிதியைச் சுட்டக்கூடிய வேதாகம-இறையியல் நுண்ணுணர்வுக்கும் இடமளிக்கிறது; இரண்டில் ஒன்றை மட்டும் கட்டாயப்படுத்தவில்லை.
- issue: ἐν τῷ σπέρματί என்ற முன்னிடைச்சொல் கட்டமைப்பு
  choice: உன் வழித்தோன்றலில்
  alternative: உன் வழித்தோன்றல் மூலம்
  rationale: ἐν என்பதன் உருவகத் திறந்தநிலையைத் தக்கவைத்து, அதை முற்றிலும் கருவிப்பொருளாக மட்டும் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘முன்னோர்கள்’ என்பது πατέρες என்பதன் இச்சூழலுக்குரிய பொருளைத் தெளிவாக்குகிறது. ‘உடன்படிக்கையின் மகன்கள்’ என்ற சற்றே அசாதாரணமான அமைப்பு, மூலத்தின் மரபுரிமை உருவகத்தைச் சீராக்காமல் காக்கத் திட்டமிட்டு வைக்கப்பட்டுள்ளது.
