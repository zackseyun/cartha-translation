  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: ta
  text: அவனுடைய வலது கையைப் பிடித்து, அவனை எழுப்பினார்; உடனே அவனுடைய பாதங்களும் கணுக்கால்களும்[a] வலுப்பெற்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கணுக்கால் எலும்புகளும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πιάσας
  choice: பிடித்து
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த உடல் தொடர்பைக் காட்டும் இறந்தகால வினையெச்சம். நன்மை பயக்கும் இச்சூழலில் ‘பற்றிக்கொண்டு’ என்பதைவிட ‘பிடித்து’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τῆς δεξιᾶς χειρός
  choice: அவனுடைய வலது கையை
  rationale: πιάσας உடன் வரும் மரபுத்தொடரைத் தமிழில் இயல்பாகக் கருவிப் பொருளில் ‘வலது கையைப் பிடித்து’ என வழங்கலாம். யாருடைய கை என்பது கிரேக்கத்தில் வெளிப்படையாகச் சொல்லப்படாவிட்டாலும், சூழலால் அது குணம்பெற்ற மனிதனின் கை என்பது தெளிவாக இருப்பதால் தமிழுக்குத் தேவையான உரிமைப்பெயர் சேர்க்கப்பட்டுள்ளது.
- source_word: ἤγειρεν αὐτόν
  choice: அவனைத் தூக்கிவிட்டார்
  rationale: ἐγείρω இங்கு ஒருவரை எழும்பச் செய்யும் உடல் செயலைக் குறிக்கிறது. ‘தூக்கிவிட்டார்’ என்பது அவரை மேலெழுப்பிய செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘எழுப்பினார்’ என்பதில் தூக்கத்திலிருந்து எழுப்புதல் என்ற தவறான ஒலி ஏற்படலாம்.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: குணமடைதல் தாமதமின்றி நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἐστερεώθησαν
  choice: வலுப்பெற்றன
  rationale: உடல் உறுப்புகள் உறுதியும் வலிமையும் பெற்ற விளைவைத் தெரிவிக்கிறது. கிரேக்கச் செயலப்பாட்டின் மறைமுக காரணத்தைத் தமிழில் சேர்க்காமல், ஏற்பட்ட மாற்றத்தையே கூறுகிறது.
- source_word: αἱ βάσεις αὐτοῦ
  choice: அவனுடைய பாதங்கள்
  rationale: βάσεις என்பது நிற்பதற்கான ஆதாரப் பகுதிகளான பாதங்களைக் குறிக்கிறது. ‘அடிப்பகுதிகள்’ என்பது உடற்கூறியல் சூழலில் இயல்பற்றது; ‘பாதங்கள்’ பொருளையும் தமிழ் நடையையும் காக்கிறது.
- source_word: τὰ σφυδρά
  choice: கணுக்கால்கள்
  rationale: சொல் கணுக்கால் பகுதி அல்லது மூட்டுகளைக் குறிக்கிறது. ‘கணுக்கால்கள்’ இயல்பானதும் தேவையற்ற உடற்கூறியல் நுட்பத்தைத் தவிர்ப்பதும் ஆகும்; ‘கணுக்கால் எலும்புகள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: குணமாக்கப்பட்ட விதத்தின் விளக்கம்
  choice: பாதங்களும் கணுக்கால்களும் உடனே வலுப்பெற்றன என்று உடல் மாற்றத்தை நேரடியாகக் கூறுதல்
  alternative: ‘குணமடைந்தன’ என்று பொதுமைப்படுத்துதல் அல்லது இவ்வாக்கியத்திலேயே தேவனுடைய செயலை வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்க உரை நிகழ்ந்த உடல் வலுப்பெறுதலைத் தெளிவாக விவரிக்கிறது; செயலை நிகழ்த்திய இறை காரணத்தை இந்த உட்பிரிவில் வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே சூழலில் உள்ள அற்புதத் தன்மையை மறைக்காமலும், உரையில் இல்லாத விளக்கத்தைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பாதங்கள்’, ‘கணுக்கால்கள்’, ‘வலுப்பெற்றன’ ஆகிய சொற்கள் உடல் குணமடைதலைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கின்றன. அடிக்குறிப்பு குறி [a] முதன்மை உரையில் தொடர்புடைய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
