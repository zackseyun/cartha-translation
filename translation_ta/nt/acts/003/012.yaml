source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: ta
  text: 'ஆனால் பேதுரு இதைக் கண்டபோது, மக்களுக்குப் பதிலளித்தார்: “இஸ்ரயேல் ஆண்களே, இதைக் குறித்து ஏன் வியப்படைகிறீர்கள்? எங்களுடைய சொந்த வல்லமையினாலோ தேவபக்தியினாலோ நாங்களே இவனை நடக்கச் செய்ததுபோல், ஏன் எங்களை உற்றுப் பார்க்கிறீர்கள்[a]?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏன் எங்களை கூர்ந்து தொடர்ந்து பார்க்கிறீர்கள்?” இந்த வினைச்சொல் நிலைத்த அல்லது நீடித்த பார்வையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “தேவபக்தி” என்பதற்கு “இறைப்பற்று” அல்லது “பக்தி” என்றும் மொழிபெயர்க்கலாம். அந்த மனிதன் குணமடைந்தது அப்போஸ்தலர்களுடைய சொந்த சமயப் பக்தியினாலோ ஆன்மிகப் பண்பினாலோ அல்ல என்று பேதுரு மறுக்கிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: ஆனால் பேதுரு இதைக் கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை காலத் தொடர்புடன் இயல்பான தமிழில் தரப்படுகிறது; ‘இதை’ என்பது முந்தைய சூழலில் மக்களின் எதிர்வினையைக் குறிக்கிறது. δέ உரையோட்டத்தின் மென்மையான திருப்பத்தை ‘ஆனால்’ எனக் காட்டுகிறது.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: மக்களிடம் மறுமொழியாக ... என்றார்
  rationale: நேரடியான கேள்வி முன்வைக்கப்படாவிட்டாலும், நிகழ்ந்த சூழலுக்கு பேதுரு பதிலளிப்பதை ἀποκρίνομαι குறிக்கிறது. ‘மறுமொழியாக’ அந்தப் பதில்தன்மையைப் பேணுகிறது.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: இஸ்ரயேல் ஆண்களே
  rationale: கிரேக்கத்தின் ஆண்பால் விளிப்பைத் தெளிவாகப் பேணும் நேரடியான, புரிந்துகொள்ளத்தக்க தமிழ் வடிவம்.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: இதைக் குறித்து ஏன் வியப்படைகிறீர்கள்?
  rationale: θαυμάζω குறிக்கும் வியப்பு அல்லது ஆச்சரியத்தை ‘வியப்படைகிறீர்கள்’ இயல்பாக வெளிப்படுத்துகிறது; ‘இது’ குணமாக்கப்பட்ட நிகழ்வைக் குறிக்கிறது.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: ஏன் எங்களை உற்றுப் பார்க்கிறீர்கள்?
  rationale: ἀτενίζω என்பது நிலைத்த, கூர்ந்த பார்வையைக் குறிக்கிறது; ‘உற்றுப் பார்க்கிறீர்கள்’ அதன் வலிமையை இயல்பான தமிழில் பேணுகிறது.
- source_word: ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ
  choice: எங்களுடைய சொந்த வல்லமையாலோ இறைப்பற்றாலோ ... செய்ததுபோல்
  rationale: ὡς மக்கள் கொண்டிருந்த தவறான அனுமானத்தைச் சுட்டுகிறது. ἰδίᾳ தனக்கே உரியதை வலியுறுத்துகிறது; εὐσέβεια என்பதன் கடவுள்மீதான பக்தி, பயபக்தி சார்ந்த பொருளை ‘இறைப்பற்று’ தெளிவாகத் தருகிறது.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: இவனை நடக்கச் செய்ததுபோல்
  rationale: முடிவுற்ற செயலும் அதன் விளைவும் மக்கள் அப்போஸ்தலர்களுக்குச் சொந்தமானதாகக் கருதிய எண்ணத்தை, காரணவினை அமைப்பு இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: εὐσεβείᾳ என்பது அப்போஸ்தலர்களின் ஆன்மிகத் தகுதியால் அற்புதம் நிகழ்ந்ததாக உணர்த்துமா என்பது
  choice: இறைப்பற்று
  alternative: தேவபக்தி / பக்தி
  rationale: பேதுரு குணமாக்குதல் தங்களுடைய சமயப் பக்தி அல்லது ஆன்மிகப் பண்பிலிருந்து வந்தது என்பதை மறுக்கிறார். ‘இறைப்பற்று’ அதன் சமயப் பரிமாணத்தைப் பேணுகிறது; ஆனால் பிற்காலத் தகுதி அல்லது புண்ணியக் கோட்பாட்டை உரைக்குள் சேர்ப்பதில்லை.
- issue: Ἄνδρες Ἰσραηλῖται என்ற ஆண்பால் விளிப்பு
  choice: இஸ்ரயேல் ஆண்களே
  alternative: இஸ்ரயேல் மக்களே / இஸ்ரயேலரே
  rationale: மூலத்தின் ஆண்பால் விளிப்பை நடுநிலைப்படுத்தாமல் மொழிபெயர்க்கிறது; கூடிவந்த கூட்டத்தில் பெண்கள் இருந்தார்களா என்பதைக் குறித்து வசனம் தனியே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான பொது உரைநடை பயன்படுத்தப்பட்டுள்ளது. பொதுப் பேச்சின் நேரடித்தன்மைக்காகக் கேள்வி அமைப்புகள் பேணப்பட்டுள்ளன; ‘வல்லமை’, ‘இறைப்பற்று’ ஆகியவை உயர்வானதாயினும் இன்றைய வாசகருக்குப் புரியும் சொற்கள்.
