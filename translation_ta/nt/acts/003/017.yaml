- from: இப்போதும், சகோதரர்களே,[a] நீங்கள் அறியாமையால் இப்படிச் செய்தீர்கள் என்று எனக்குத் தெரியும்; உங்கள் ஆட்சியாளர்களும் அவ்வாறே செய்தார்கள்.
  to: இப்பொழுது, சகோதரர்களே,[a] நீங்கள் அறியாமையில் செயல்பட்டீர்கள் என்று நான் அறிவேன்; உங்கள் ஆட்சியாளர்களும் அவ்வாறே செய்தார்கள்.
  rationale: The revision removes the unintended “still/even now” force of “இப்போதும்” and does not add “இப்படிச்” to the source’s general verb. It retains the source’s statement that both the audience and their rulers acted in ignorance, without turning ignorance into exoneration.
