base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: ta
  text: இப்பொழுது, சகோதரர்களே,[a] நீங்கள் அறியாமையில் செயல்பட்டீர்கள் என்று நான் அறிவேன்; உங்கள் ஆட்சியாளர்களும் அவ்வாறே செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; கிரேக்க மூலத்தில் ‘சகோதரர்களே’ என்று உள்ளது. இது ஆண்களும் பெண்களும் அடங்கிய விரிவான குழுவை பிரதிநிதித்துவமாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: இப்போதும்
  rationale: καί என்ற இணைப்பையும் νῦν என்ற காலச் சுட்டையும் சுருக்கமாகத் தக்கவைத்து, முந்தைய குற்றச்சாட்டிலிருந்து தற்போதைய வேண்டுகோளுக்குச் செல்லும் உரைமாற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: அழைப்புவேற்றுமையில் உள்ள ஆண்பால் பன்மையை நேரடியாகக் காட்டுகிறது; சூழலில் இது கலந்த குழுவையும் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οἶδα
  choice: எனக்குத் தெரியும்
  rationale: பேதுரு தமக்குள்ள அறிவை உறுதியாகக் கூறுவதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατὰ ἄγνοιαν
  choice: அறியாமையால்
  rationale: அவர்களின் செயல் அறிவின்மையோடு தொடர்புடையது என்பதைக் காட்டுகிறது; அதேவேளையில் அவர்களை முற்றிலும் குற்றமற்றவர்களாக அறிவிப்பதில்லை.
- source_word: ἐπράξατε
  choice: இப்படிச் செய்தீர்கள்
  rationale: கிரேக்க வினை பொதுவாக ‘செய்தீர்கள்’ என்று பொருள்படும். முந்தைய வசனங்களில் கூறப்பட்ட செயலைத் தமிழில் இயல்பாகச் சுட்டுவதற்காக ‘இப்படி’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὥσπερ καὶ
  choice: அவ்வாறே
  rationale: மக்களின் செயலுக்கும் ஆட்சியாளர்களின் செயலுக்கும் இடையிலான ஒப்புமையையும், அவர்களும் அதையே செய்தனர் என்ற சேர்க்கைப் பொருளையும் இயல்பாகக் காட்டுகிறது.
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: உங்கள் ஆட்சியாளர்கள்
  rationale: எருசலேமின் அரசியல்-மத அதிகாரம் கொண்ட தலைவர்களைக் குறிக்கும் ἄρχοντες என்பதன் அதிகாரப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: அறியாமை குறித்த பேதுருவின் கூற்று குற்றத்தை நீக்குவதாக மொழிபெயர்க்கப்பட வேண்டுமா?
  choice: ‘அறியாமையால் ... செய்தீர்கள்’ என்று கூறி, அறியாமையை ஒரு காரணியாக ஏற்றுக்கொள்வதோடு குற்றப்பொறுப்பை நீக்காமல் விடுதல்.
  alternative: ‘தெரியாமல் செய்துவிட்டீர்கள்’ என்று மென்மையாக்கி, ஏறத்தாழ முழுமையான குற்றமின்மையைக் குறிப்பது.
  rationale: இந்த வசனம் அறியாமையை ஒப்புக்கொள்கிறது; ஆனால் 19ஆம் வசனத்தில் மனந்திரும்ப அழைக்கிறது. ஆகவே குற்றமின்மையோ தீவிரக் குற்றச்சாட்டோ என்ற ஒருதலைப்பட்ச முடிவுக்குச் செல்லாமல் மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆட்சியாளர்கள்’ என்பது அதிகாரப் பொருளைத் தக்கவைக்கிறது; ‘அறியாமையால்’ என்பது அறியாமைக்கும் பொறுப்புக்கும் இடையிலான மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
