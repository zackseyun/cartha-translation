translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்பது முன் சூழலில் குணமடைந்த மனிதரைக் குறிக்கும் சுட்டுப்பெயராகவே வைக்கப்பட்டுள்ளது; மூலத்தில் இல்லாத விளக்கப் பெயர் வசனத்துக்குள் சேர்க்கப்படவில்லை. ஆங்கில ஆலோசனை உரையில் [b] குறி வியப்புச் சொல்லருகே இருந்தாலும் அதன் அடிக்குறிப்பு கட்டிடச் சொல்லை விளக்குவதால், தமிழில் அது ‘தூண்மண்டபம்’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
