reference: Acts 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: ta
  text: அவர் பேதுருவையும் யோவானையும் பிடித்துக்கொண்டிருந்தபோது[a], மக்கள் அனைவரும் பெரிதும் வியப்படைந்து, சாலொமோனின் தூண்மண்டபம் என்று அழைக்கப்பட்ட இடத்தில்[b] அவர்களிடம் ஒருசேர ஓடிவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேதுருவையும் யோவானையும் இறுகப் பற்றிக்கொண்டிருந்தபோது.” கிரேக்க வினைச்சொல் இறுகப் பிடித்திருப்பதையோ பற்றிக்கொண்டிருப்பதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தூண்மண்டபம்” என்பது ஆலய வளாகத்திலிருந்த கூரையுள்ள தூண் வரிசை மண்டபத்தைக் குறிக்கிறது. இது மரபாகச் “சாலொமோனின் தூண்மண்டபம்” என்று அறியப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: அவர் ... பிடித்துக்கொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருந்த ஒரேகாலச் செயலைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையின் பொருளைப் பாதுகாக்கிறது. κρατέω இங்கு பிடித்திருத்தல் அல்லது பற்றிக்கொண்டிருத்தலைக் குறிக்கிறது; உணர்ச்சிசார் நோக்கத்தைச் சேர்க்காமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: பேதுருவையும் யோவானையும்
  rationale: தனிப்பெயர்களின் வழக்கமான தமிழ் ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன; இருவரையும் வினையின் நேரடிச் செயப்படுபொருள்களாகத் தெளிவாகக் காட்டுகிறது.
- source_word: συνέδραμεν
  choice: ஒருசேர ஓடிவந்தார்கள்
  rationale: συντρέχω என்பதில் உள்ள வேகமான ஓட்டத்தையும் பலர் ஒன்றாகக் கூடிவருவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πᾶς ὁ λαὸς
  choice: மக்கள் அனைவரும்
  rationale: λαός என்பதன் பொதுவான ‘மக்கள்’ என்ற பொருளையும் πᾶς என்பதன் முழுமையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: πρὸς αὐτούς
  choice: அவர்களிடம்
  rationale: ஆட்களை நோக்கிய இயக்கத்தைக் குறிக்கும் πρός என்பதற்கு இயல்பான தமிழ் வடிவம்.
- source_word: ἐπὶ τῇ στοᾷ
  choice: தூண்மண்டபம் ... இடத்தில்
  rationale: στοά என்பது கூரையுள்ள தூண் வரிசை மண்டபத்தைக் குறிக்கிறது. ‘தூண்மண்டபம்’ கட்டிட அமைப்பைச் சுருக்கமாகவும் புரியத்தக்கவாறும் தெரிவிக்கிறது; ‘இடத்தில்’ என்பது நிகழ்வு அங்கே நடந்ததை இயல்பாக்குகிறது.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: சாலொமோனின் தூண்மண்டபம் என்று அழைக்கப்பட்ட
  rationale: καλουμένῃ என்பதன் ‘என்று அழைக்கப்பட்ட’ பொருளையும், மரபான இடப்பெயராக உள்ள Σολομῶντος என்பதையும் பாதுகாக்கிறது.
- source_word: ἔκθαμβοι
  choice: பெரிதும் வியப்படைந்து
  rationale: ἔκθαμβος குறிக்கும் மிகுந்த வியப்பின் தீவிரத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
