source:
  edition: SBLGNT
  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: ta
  text: அவன் துள்ளியெழுந்து நின்று நடக்கத் தொடங்கினான். பிறகு அவர்களுடன் ஆலயத்திற்குள் சென்றான்; நடந்துகொண்டும் துள்ளிக்கொண்டும் கடவுளைப் புகழ்ந்துகொண்டும் இருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: துள்ளியெழுந்து
  rationale: ἐξάλλομαι என்பது மேலெழும்பித் துள்ளுவதைக் குறிக்கிறது; குணமடைந்தவனின் உடனடியான உடல் இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: περιεπάτει / περιπατῶν
  choice: நடக்கத் தொடங்கினான் / நடந்தும்
  rationale: முதல் imperfect வடிவம் தொடங்கிய தொடர்ச்சியான செயலைக் காட்டுவதால் ‘நடக்கத் தொடங்கினான்’ என்றும், பின்னைய participle இணைந்து நடந்த செயலைக் காட்டுவதால் ‘நடந்தும்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: ἁλλόμενος
  choice: துள்ளிக்குதித்தும்
  rationale: ἅλλομαι என்பது துள்ளுதல் அல்லது குதித்தலைக் குறிக்கிறது; முன்னுள்ள ‘துள்ளியெழுந்து’ என்பதிலிருந்து வேறுபடுத்தியும் மகிழ்ச்சியான தொடர்ச்சியான இயக்கத்தை வெளிப்படுத்தியும் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: τὸ ἱερόν
  choice: ஆலயம்
  rationale: இங்கு ஆலய வளாகத்தைக் குறிக்கும் வழக்கமான புதிய ஏற்பாட்டு சொல்லாக ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
- source_word: αἰνῶν τὸν θεόν
  choice: கடவுளைப் புகழ்ந்துகொண்டும் இருந்தான்
  rationale: நடத்தல், துள்ளுதல் ஆகியவற்றோடு தொடர்ந்த புகழ்ச்சியையும் நிகழ்காலப் பங்கேற்பு வடிவத்தின் தொடர்ச்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் வேதவசனத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் தொடர்ச்சியான இயக்க வரிசை பாதுகாக்கப்பட்டு, தமிழில் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது.
