source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: ta
  text: 'ஆனால் பேதுரு, “வெள்ளியும் பொன்னும் என்னிடம் இல்லை. ஆனால் என்னிடம் இருப்பதையே உனக்குக் கொடுக்கிறேன்: நாசரேயனாகிய இயேசு மெசியாவின்[a] பெயரில், நட!” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு கிறிஸ்துவின்.” கிரேக்க Χριστός என்ற பட்டத்தின் பொருளைக் காக்க இங்கு “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: வெள்ளியும் பொன்னும்
  rationale: கிரேக்கத்தில் குறிப்பிடப்பட்ட இரு உலோகங்களையும் நேரடியாகக் காத்து, பொருள் செல்வத்தைக் குறிக்கும் இணைப்பைத் தக்கவைக்கிறது.
- source_word: οὐχ ὑπάρχει μοι
  choice: என்னிடம் இல்லை
  rationale: உடைமையைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கான இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: ஆனால் என்னிடம் இருப்பதை உனக்குக் கொடுக்கிறேன்
  rationale: இல்லாததற்கும் இருப்பதற்கும் இடையிலான வலியுறுத்தப்பட்ட முரண்பாட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν τῷ ὀνόματι
  choice: பெயரில்
  rationale: அதிகாரம் அல்லது பிரதிநிதித்துவம் என்ற உட்பொருளை முன்கூட்டியே ஒரே விளக்கமாக முடிவுசெய்யாமல், கிரேக்கச் சொற்றொடரின் இறையியல் நிறைவைத் தக்கவைக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின்
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் அதன் பொருளைக் காட்டும் ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது; தமிழில் வேற்றுமை உருபுடன் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: τοῦ Ναζωραίου
  choice: நாசரேயனாகிய
  rationale: ஊரைக் குறிக்கும் விளக்கமாக மட்டும் மாற்றாமல், கிரேக்கத்தின் அடைமொழி/பட்டத்தன்மையைப் பாதுகாக்கிறது.
- source_word: περιπάτει
  choice: நட!
  rationale: நிகழ்கால ஏவல் வினையின் நேரடியான கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் அளிக்கிறது; ‘நடக்கத் தொடங்கு’ என்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: பெயர்ச் சூத்திரத்தில் Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இக்குணமாக்கும் அறிவிப்பில் Χριστός பட்டமாகத் தெளிவாகச் செயல்படுகிறது. ஆகவே அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ முதன்மை உரையில் வைக்கப்பட்டு, மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν τῷ ὀνόματι என்பதன் பொருள்
  choice: பெயரில்
  alternative: அதிகாரத்தால்
  rationale: இந்தச் சொற்றொடர் அதிகாரத்தையும் பிரதிநிதித்துவத்தையும் உணர்த்தலாம்; ஆனால் அவற்றில் ஒன்றை மட்டும் உரையில் நிர்ணயிக்காமல் மூலத்தின் பரப்பை ‘பெயரில்’ காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பேச்சின் நேரடித்தன்மையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘வெள்ளியும் பொன்னும்’ என்ற மூல இணைப்பு அப்படியே வைக்கப்பட்டுள்ளது. ‘நாசரேயனாகிய’ என்பது ‘நாசரேத்தைச் சேர்ந்த’ என்பதைவிட கிரேக்க அடைமொழியின் வடிவத்தை நெருக்கமாகப் பாதுகாக்கிறது.
