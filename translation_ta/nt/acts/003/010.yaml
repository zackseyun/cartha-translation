source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: ta
  text: ஆலயத்தின்[b] ‘அழகு வாசலில்’ பிச்சை பெறுவதற்காக அமர்ந்திருந்தவன் இவன்தான்[a] என்று அவர்கள் அவனை அடையாளம் கண்டார்கள். அவனுக்கு நிகழ்ந்ததைக் கண்டு அவர்கள் வியப்பாலும் திகைப்பாலும் நிறைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “பிச்சை பெறுவதற்காக அமர்ந்திருப்பவன்” என்றும் மொழிபெயர்க்கலாம். சூழலில் இது அவனுடைய வழக்கமான நிலையைக் குறிப்பதால், முதன்மை உரையில் “அமர்ந்திருந்தவன்” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “ஆலயம்” என்பதற்கான கிரேக்கச் சொல் ἱερόν; அது உட்பரிசுத்த இடத்தை மட்டும் அல்ல, ஆலய வளாகம் முழுவதையும் பொதுவாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: அடையாளம் கண்டார்கள்
  rationale: இங்கு வினைச்சொல், கூட்டத்தினர் முன்பே அறிந்திருந்த அந்த மனிதனை இப்போது தெளிவாக அடையாளம் கண்டுகொண்டதைக் குறிக்கிறது. இறந்தகாலத் தொடர்நிலையைத் தமிழில் இயல்பான கதைநடையில் இவ்வாறு தரலாம்.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல் இடப்படவில்லை
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியை மட்டும் குறிக்கிறது. முந்தைய வசனத்தோடு சேர்த்து வாசிக்கும்போது தமிழில் தனியாக ‘மேலும்’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது தேவையற்ற வலியுறுத்தலை உண்டாக்கும்.
- source_word: οὗτος ἦν
  choice: அவன்தான்
  rationale: குணமடைந்தவனே தாங்கள் அறிந்திருந்த அதே மனிதன் என்ற சுட்டும் வலியுறுத்தலும் ‘அவன்தான்’ என்பதில் இயல்பாக வெளிப்படுகின்றன.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: தர்மம் பெறுவதற்காக வழக்கமாக அமர்ந்திருப்பவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இந்நிகழ்காலப் பங்கேற்புவினை அவனுடைய வழக்கமான முந்தைய நிலையைக் குறிப்பிடுகிறது. சூழலில் உள்ள அந்த வழக்கப் பொருளை ‘வழக்கமாக’ தெளிவாக்குகிறது.
- source_word: ἐλεημοσύνην
  choice: தர்மம்
  rationale: ஏழைக்கு இரக்கத்தால் வழங்கப்படும் பணம் அல்லது பொருளை இங்கு குறிக்கிறது. ‘தர்மம் பெறுதல்’ என்பது சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான தமிழ்; பொதுவான ‘உதவி’ என்பதைவிட மூலத்தின் குறிப்பிட்ட பொருளை நெருக்கமாகக் காக்கிறது.
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: ‘அழகு வாசல்’ அருகே
  rationale: Ὡραία இங்கு வாசலின் பெயராகச் செயல்படுகிறது. மேற்கோள் குறிகள் அதை விளக்கப் பெயராக அல்ல, குறிப்பிட்ட வாசலின் பெயராக வாசிக்க உதவுகின்றன; ἐπί இச்சூழலில் ‘அருகே’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: τοῦ ἱεροῦ
  choice: ஆலயத்தின்
  rationale: ἱερόν என்பது உட்பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் பொதுவாகக் குறிக்கிறது. முதன்மை உரையில் ‘ஆலயம்’ இயல்பாக இருப்பதால், அதன் பரந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐπλήσθησαν
  choice: நிறைந்தார்கள்
  rationale: மூலத்தின் உணர்ச்சியால் நிரப்பப்படுதல் என்ற உருவகத்தையும் செயலற்ற வடிவின் பொருளையும் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: θάμβους καὶ ἐκστάσεως
  choice: வியப்பாலும் திகைப்பாலும்
  rationale: θάμβος ஆழ்ந்த வியப்பையும் ἔκστασις ஒருவரை நிலைகுலையச் செய்யும் திகைப்பையும் இச்சூழலில் குறிக்கின்றன. இரு சொற்களுக்கிடையிலான நுண்ணிய வேறுபாட்டை இந்த இணை காக்கிறது; ἔκστασις என்பதை மறைஞான ‘பரவசம்’ என்று தவறாக உணர்த்துவதில்லை.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: அவனுக்கு நிகழ்ந்ததைக் கண்டு
  rationale: அவனுக்கு நிகழ்ந்த சம்பவமே அவர்களுடைய வியப்புக்கும் திகைப்புக்கும் காரணம் என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது. நிறைவுநிலைப் பங்கேற்புவினையின் தொடரும் விளைவும் சூழலால் தெளிவாகிறது.
