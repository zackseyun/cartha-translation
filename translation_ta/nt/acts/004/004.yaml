id: ACT.4.4
reference: Acts 4:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: ta
  text: ஆனால் செய்தியைக்[a] கேட்டவர்களில் பலர் நம்பினார்கள்; ஆண்களின்[b] எண்ணிக்கை ஏறக்குறைய ஐயாயிரம் ஆனது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வார்த்தை.’ இங்கு λόγος என்பது அப்போஸ்தலர்கள் அறிவித்த செய்தியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘ஆண்களின் எண்ணிக்கை.’ இது ஆண்களை மட்டும் கணக்கிட்டதைக் குறிக்கக்கூடும்; பெண்களும் அடங்கிய முழுக் கூட்டத்தின் எண்ணிக்கையை அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: பலர்
  rationale: கிரேக்கச் சொல்லின் குறிப்பற்ற பெருந்தொகை உணர்வை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட எதிர்ப்பும் கைதும் இருந்தபோதிலும் பலர் நம்பியதைச் சுட்டும் முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: ἀκουσάντων τὸν λόγον
  choice: செய்தியைக் கேட்டவர்களில்
  rationale: இங்கு λόγος அப்போஸ்தலர்களின் அறிவிப்பைக் குறிக்கிறது; ‘செய்தி’ என்பது நவீன வாசகருக்குத் தெளிவானது. பகுதி உருபின் பொருள் தமிழில் ‘கேட்டவர்களில்’ என இயல்பாக வெளிப்படுகிறது.
- source_word: ἐπίστευσαν
  choice: நம்பினார்கள்
  rationale: πιστεύω என்பதன் எளிய வினை வடிவத்தைப் பாதுகாத்து, கூடுதல் இறையியல் விளக்கத்தைப் புகுத்தாமல் தருகிறது.
- source_word: ἐγενήθη
  choice: ஆனது
  rationale: எண்ணிக்கை அடைந்த முடிவு நிலையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘அதிகரித்தது’ என்ற விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ὁ ἀριθμὸς
  choice: எண்ணிக்கை
  rationale: பெயர்ச்சொல் தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: τῶν ἀνδρῶν
  choice: ஆண்களின்
  rationale: ἀνήρ என்பதன் பாலினக் குறிப்பை பொதுவான ‘மக்கள்’ என மாற்றாமல் பாதுகாக்கிறது.
- source_word: ὡς χιλιάδες πέντε
  choice: ஏறக்குறைய ஐயாயிரம்
  rationale: எண்ணுக்கு முன் வரும் ὡς குறிக்கும் தோராயத்தன்மையைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: τῶν ἀνδρῶν என்பதில் பாலினம் குறிப்பிட்ட எண்ணிக்கை
  choice: ஆண்களின்
  alternative: மக்களின் / விசுவாசிகளின்
  rationale: கிரேக்க ἀνδρῶν பொதுவாக ஆண்களைக் குறிக்கிறது. ஆகவே வசனத்தின் எண்ணிக்கையை பாலினப் பொதுமைப்படுத்தாமல் மொழிபெயர்க்கிறது; அதே நேரத்தில் மொத்த விசுவாசக் கூட்டத்தில் பெண்கள் இருந்தார்களா என்பதை இவ்வசனம் மட்டும் தீர்மானிப்பதாகக் காட்டவில்லை.
- issue: λόγος என்பதன் சூழல்சார் பொருள்
  choice: செய்தி
  alternative: வார்த்தை
  rationale: இங்கு அது அப்போஸ்தலர்கள் அறிவித்த செய்தியைக் குறிக்கிறது. ‘செய்தி’ சூழலைத் தெளிவாக்குகிறது; சொல்லின் நேரடி மாற்றான ‘வார்த்தை’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘பலர் நம்பினார்கள்’ என்ற எளிய அமைப்பு மூலத்தின் இறையியல் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
