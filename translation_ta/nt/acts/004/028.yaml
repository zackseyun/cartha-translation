    reason: lexical_alternative
  revision_rationale: 'The revision preserves the Greek clause order and sense: the preceding actors acted ''to do'' (ποιῆσαι) all that (ὅσα) God''s hand and purpose (ἡ χείρ σου καὶ ἡ βουλή σου) had determined beforehand (προώρισεν) would happen (γενέσθαι). It avoids adding an explicit necessity modal to γενέσθαι, makes the comprehensive scope explicit, and maintains the theological force without resolving it through a particular doctrinal system.'
