  text: ποιῆσαι ὅσα ἡ χείρ σου καὶ ἡ ⸀βουλὴ προώρισεν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/028.yaml
  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: ta
  text: உமது கையும் உமது நோக்கமும் நடக்குமென்று முன்கூட்டியே நிர்ணயித்திருந்த அனைத்தையும் செய்வதற்காக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்விதித்திருந்த” அல்லது “முன்பே தீர்மானித்திருந்த” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை நிகழ்வுகள் முன்னதாகத் தீர்மானிக்கப்பட்டதைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: செய்வதற்காக
  rationale: முந்தைய வசன அமைப்புடன் இணையும் நோக்கப் பொருளுடைய இறந்தகால வினையெச்சத்தின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: ὅσα
  choice: எது … அதையே
  rationale: நடக்கவிருந்த அனைத்தையும் உள்ளடக்கும் உறவுப்பெயரின் விரிவான பொருளை இயல்பான தமிழ் தொடர்பமைப்பில் வெளிப்படுத்துகிறது.
- source_word: χείρ
  choice: கரம்
  rationale: தேவனுடைய வல்லமை அல்லது செயலாற்றலைக் குறிக்கும் உருவகத்தை விளக்கமாக மாற்றாமல், மூலத்தின் திடமான வேதாகமப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: βουλή
  choice: நோக்கம்
  rationale: ஆலோசித்து வகுக்கப்பட்ட எண்ணம் அல்லது திட்டம் என்ற பொருளைத் தருகிறது; ‘ஆலோசனை’ என்பதைவிட இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: προώρισεν
  choice: முன்குறித்திருந்ததோ
  rationale: முன்னதாக நிர்ணயித்தல் என்ற வினையின் வலிமையையும் நிகழ்வுகளுக்கு முந்திய காலத் தொடர்பையும் காக்கிறது; கோட்பாட்டுச் சுமை குறைந்த மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: γενέσθαι
  choice: நடக்கவேண்டும் என்று
  rationale: நிகழ்வுகள் ஏற்படுதல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; இங்குள்ள ‘வேண்டும்’ மனிதக் கடமையை அல்ல, முன்குறிக்கப்பட்ட நிகழ்வின் நோக்கப்பட்ட விளைவைச் சுட்டுகிறது.
theological_decisions:
- issue: தேவனுடைய இறையாண்மையையும் மனிதப் பொறுப்பையும் தொடும் சூழலில் προώρισεν என்பதன் மொழிபெயர்ப்பு
  choice: முன்குறித்திருந்ததோ
  alternative: முன்கூட்டியே தீர்மானித்திருந்ததோ; முன்பே முடிவுசெய்திருந்ததோ
  rationale: கிரேக்க வினை முன்தீர்மானத்தைத் தெளிவாகக் குறிக்கிறது. இயேசுவின் பாடுகளைச் சூழ்ந்த நிகழ்வுகள் தேவனுடைய முந்திய நோக்கத்தின்படி நடந்ததாக உரை கூறுகிறது; ஆனால் இறையாண்மைக்கும் மனிதப் பொறுப்புக்கும் இடையிலான பரந்த உறவை இவ்வசனம் விளக்கித் தீர்ப்பதில்லை. எனவே அந்த இறையியல் அழுத்தமும் பதற்றமும் நிலைநிறுத்தப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆனாலும் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கரம்’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘நோக்கம்’ என்பது βουλή-யின் திட்டமிட்ட எண்ணத்தை இயல்பாகத் தெரிவிக்கிறது. வசனம் முந்தைய வாக்கியத்தைத் தொடரும் துணைவாக்கியம் என்பதால் இறுதியில் ‘செய்வதற்காக’ என அமைக்கப்பட்டுள்ளது.
