id: ACT.4.8
reference: Acts 4:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: ta
  text: 'அப்போது பேதுரு, பரிசுத்த ஆவியால் நிறைந்து, அவர்களிடம் கூறினார்: “மக்களின் ஆட்சியாளர்களே, மூப்பர்களே,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை வரிசையாக அறிமுகப்படுத்தும் காலக் குறிப்பு; நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகம மரபில் நன்கு அறியப்பட்ட பெயர் வடிவம்.
- source_word: πλησθεὶς
  choice: நிரப்பப்பட்டு
  rationale: πίμπλημι என்பதன் இறந்தகாலச் செயப்பாட்டு எச்சத்தின் passive பொருளைத் தக்கவைத்து, அடுத்துள்ள εἶπεν உடன் இயல்பாக இணைக்கிறது.
- source_word: πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியால்
  rationale: நிரப்பிய செயலின் தெய்வீக மூலத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘பரிசுத்த ஆவி’ என்பது நிலைபெற்ற, தெளிவான சொற்றொடர்.
- source_word: εἶπεν πρὸς αὐτούς
  choice: அவர்களிடம் … என்றார்
  rationale: நேரடி உரையை அறிமுகப்படுத்தும் இயல்பான தமிழ்ச் சொல்லமைப்பு; உரையின் பெறுநர்களையும் தெளிவாகக் காட்டுகிறது.
- source_word: Ἄρχοντες τοῦ λαοῦ
  choice: மக்களின் ஆட்சியாளர்களே
  rationale: அரசியல்-நீதித்துறை அதிகாரமுள்ளவர்களைக் குறிக்கும் ἄρχοντες என்பதன் அதிகாரப்பூர்வத் தன்மையை ‘ஆட்சியாளர்கள்’ காக்கிறது; τοῦ λαοῦ நேரடியாக ‘மக்களின்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: πρεσβύτεροι
  choice: மூப்பர்களே
  rationale: வயதில் மூத்தவர்களை மட்டும் அல்லாமல், அங்கீகரிக்கப்பட்ட சமூக-மத நிர்வாகப் பொறுப்பாளர்களைக் குறிக்கும் சூழல்சார் பொருளை வழங்குகிறது.
theological_decisions:
- issue: πνεύματος ἁγίου என்பதன் பொருள்
  choice: பரிசுத்த ஆவி
  alternative: பரிசுத்தமான ஆவி
  rationale: அப்போஸ்தலர் பணிகள் நூலின் சூழலில், சாட்சியளிக்கவும் பேசவும் வல்லமை அளிக்கும் தெய்வீகப் பரிசுத்த ஆவியையே இந்தச் சொற்றொடர் குறிக்கிறது. ‘பரிசுத்த ஆவி’ என்பது அந்தக் குறிப்பைத் தெளிவாகவும் கூடுதல் விளக்கமின்றியும் தருகிறது.
- issue: πλησθεὶς πνεύματος ἁγίου என்பதில் ஆவியின் பங்கு
  choice: பரிசுத்த ஆவியால் நிரப்பப்பட்டு
  alternative: பரிசுத்த ஆவியினால் நிறைந்து
  rationale: செயப்பாட்டு வடிவத்தை வெளிப்படையாகத் தக்கவைத்து, பேதுருவின் பேச்சுக்கு முன்னதாக நிகழ்ந்த தெய்வீக வல்லமையூட்டலைக் காட்டுகிறது; இதற்கு அப்பாற்பட்ட செயல்முறை விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அழைப்புமுறையைக் காட்ட ‘ஆட்சியாளர்களே, மூப்பர்களே’ என ஏகார முடிவு வைக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் உரையின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
