translation_notes:
  register: நவீன தரத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. செயப்பாட்டு வடிவமான ‘குணமாக்கப்பட்ட’ என்பது மூலத்தின் இலக்கண விசையைப் பாதுகாக்கிறது; ἀντειπεῖν என்பதிலுள்ள எதிர்ப்பு, மறுப்பு, பதில் ஆகிய அர்த்தவாய்ப்புகள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் திறந்தவையாக வைக்கப்பட்டுள்ளன.
