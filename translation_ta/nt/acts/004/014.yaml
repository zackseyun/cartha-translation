source:
  edition: SBLGNT
  text: τόν ⸀τε ἄνθρωπον βλέποντες σὺν αὐτοῖς ἑστῶτα τὸν τεθεραπευμένον οὐδὲν εἶχον ἀντειπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: ta
  text: குணமாக்கப்பட்ட அந்த மனிதர் அவர்களுடன் நிற்பதைப் பார்த்த அவர்கள், எதிர்த்துச் சொல்ல அவர்களிடம் எதுவும் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதற்கு எதிராக அவர்களால் எதுவும் சொல்ல முடியவில்லை’ அல்லது ‘எதிர்வாதம் செய்ய அவர்களிடம் எதுவும் இல்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: (தனி இணைப்புச் சொல் சேர்க்கப்படவில்லை)
  rationale: τε முந்தைய நிகழ்வுடன் இவ்வாக்கியத்தை இணைக்கிறது. தமிழில் தொடர்ச்சியான கதைநடையும் வினையெச்ச அமைப்பும் அந்த இணைப்பை இயல்பாக வெளிப்படுத்துவதால் தனியே ‘மேலும்’ என்று சேர்ப்பது தேவையில்லை.
- source_word: ἄνθρωπον
  choice: அந்த மனிதர்
  rationale: முந்தைய சூழலில் குணமாக்கப்பட்ட குறிப்பிட்ட ஆண் நபரையே இது குறிக்கிறது. ‘அந்த மனிதர்’ என்பது இயல்பாகவும் மரியாதையான நவீன தமிழிலும் உள்ளது.
- source_word: βλέποντες
  choice: பார்த்த அவர்கள்
  rationale: முதன்மை வினையுடன் சமகாலத்தில் நிகழும் செயலைத் தமிழின் இயல்பான வினையெச்ச அமைப்பில் தருகிறது.
- source_word: σὺν αὐτοῖς
  choice: அவர்களுடன்
  rationale: σύν உடனிருத்தலையும் துணைநிலையையும் நேரடியாகக் குறிக்கிறது.
- source_word: ἑστῶτα
  choice: நிற்பதை
  rationale: ἵστημι என்பதன் நிறைவு வடிவம் இங்கு தொடர்ந்து நிலவும் நிற்கும் நிலையைக் குறிக்கிறது; ‘நிற்பதை’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τεθεραπευμένον
  choice: குணமாக்கப்பட்ட
  rationale: θεραπεύω என்பதன் நிறைவு செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, முடிந்த குணமாக்குதலின் தொடரும் விளைவையும் அடையாளப்படுத்துகிறது.
- source_word: οὐδὲν
  choice: எதுவும் இல்லாதிருந்தார்கள்
  rationale: முற்றான இன்மையைத் தெளிவாகத் தெரிவிக்கிறது; εἶχον உடன் சேர்ந்துள்ள கட்டமைப்பின் ‘அவர்களிடம் எதுவும் இல்லை’ என்ற கருத்தையும் காக்கிறது.
- source_word: εἶχον ἀντειπεῖν
  choice: மறுத்துச் சொல்ல எதுவும் இல்லாதிருந்தார்கள்
  rationale: ἀντειπεῖν என்பதில் உள்ள எதிர்த்துப் பதிலளித்தல் அல்லது மறுத்துரைத்தல் என்ற விசையைத் தக்கவைத்து, ἔχω + வினையெச்சத்தின் வளம்/அடிப்படை இல்லாமை என்ற நுட்பத்தையும் இயல்பான தமிழில் தருகிறது.
