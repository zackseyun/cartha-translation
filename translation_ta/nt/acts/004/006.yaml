id: ACT.4.6
reference: Acts 4:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: ta
  text: (தலைமைக் குருவாகிய அன்னாவும், காய்பாவும், யோவானும், அலெக்சாந்தரும், தலைமைக் குரு வம்சத்தைச் சேர்ந்த அனைவரும்.)
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἅννας
  choice: அன்னா
  rationale: கிரேக்கப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ὁ ἀρχιερεὺς
  choice: தலைமைக் குருவாகிய
  rationale: அன்னாவுக்கு இணையாக வரும் பதவிப் பெயரை நேரடியாகப் பாதுகாக்கிறது; வரலாற்றுச் சூழலைக் கருதி ‘முன்னாள்’ என்று விளக்கிச் சேர்க்கவில்லை.
- source_word: Καϊάφας
  choice: காய்பா
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: Ἰωάννης
  choice: யோவான்
  rationale: Ἰωάννης என்பதற்கான தமிழில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: Ἀλέξανδρος
  choice: அலெக்சாந்தர்
  rationale: கிரேக்கப் பெயருக்கு இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: ὅσοι ἦσαν
  choice: அனைவரும் அங்கே இருந்தார்கள்
  rationale: பட்டியல் அமைப்பில் இயல்பான நவீன தமிழை வழங்குகிறது; ἦσαν என்பதையும் வெளிப்படையாக மொழிபெயர்க்கிறது.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: தலைமைக் குருவின் குடும்பத்தைச் சேர்ந்த
  rationale: γένος என்பதிலுள்ள குடும்பம் அல்லது வம்சக் குழு என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; பதவி வகித்தவர்கள் என்று தவறாகப் புரிந்துகொள்ளாமல் காக்கிறது.
theological_decisions:
- issue: அந்தக் காலத்தில் காய்பா பதவியில் இருந்தபோதும் அன்னாவை ὁ ἀρχιερεύς என்று அழைத்தல்
  choice: ‘தலைமைக் குருவாகிய அன்னா’ என்று மூலத்தின் பட்டத்தை அப்படியே வைத்தல்
  alternative: ‘முன்னாள் தலைமைக் குருவாகிய அன்னா’ அல்லது ‘முதன்மைக் குருவாகிய அன்னா’
  rationale: கிரேக்க உரை அன்னாவுக்கு ὁ ἀρχιερεύς என்ற பட்டத்தை வெளிப்படையாக அளிக்கிறது. வரலாற்று முரண்பாடாகத் தோன்றுவதை மொழிபெயர்ப்பில் அமைதியாகத் தீர்க்காமல், மூல உரையின் பதற்றத்தைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. வசனம் முந்தைய வாக்கியத்தின் பட்டியல் தொடராக இருப்பதால் மூலத்திலுள்ள அடைப்புக்குறிகள் தக்கவைக்கப்பட்டுள்ளன. வெளியீட்டுப் பிரதியில் குறிப்பு இல்லாததால் அடிக்குறி குறியீடு சேர்க்கப்படவில்லை.
