id: ACT.4.7
reference: Acts 4:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: ta
  text: அவர்களை நடுவில் நிறுத்தி, “எந்த வல்லமையால் அல்லது எந்தப் பெயரில் நீங்கள் இதைச் செய்தீர்கள்?” என்று கேட்கத் தொடங்கினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேள்வி கேட்டுக்கொண்டிருந்தார்கள்” அல்லது “விசாரித்தார்கள்.” கிரேக்க முற்றுப்பெறாத இறந்தகால வினை, கேள்வி கேட்கத் தொடங்கியதைவிட, அந்த விசாரணை தொடர்ந்து நடைபெற்றதை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: நிறுத்திவிட்டு
  rationale: இந்த இறந்தகால வினையெச்சம், கேள்வி கேட்பதற்கு முன் அவர்களை நடுவில் நிறுத்திய செயலைக் குறிக்கிறது. ‘நிறுத்திவிட்டு’ என்பது இயல்பான தமிழில் அந்தக் காலவரிசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῷ μέσῳ
  choice: நடுவில்
  rationale: இது சொற்சார்ந்த ‘நடுவில்’ என்ற பொருளைப் பாதுகாக்கிறது; ‘அவர்களுக்கு முன்பாக’ என நீதிமன்றச் சூழலை விளக்கிச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐπυνθάνοντο
  choice: கேட்கத் தொடங்கினார்கள்
  rationale: கிரேக்க முற்றுப்பெறாத இறந்தகால வினை இங்கு தொடக்கத்தையோ தொடர்ச்சியையோ உணர்த்தலாம். கதைச் சூழலில் தொடக்க நுணுக்கத்தை முதன்மை உரை வெளிப்படுத்துகிறது; தொடர்ச்சிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: எந்த வல்லமையால்
  rationale: ἐν இங்கு கருவிப் பொருளில் வருகிறது. δύναμις என்பதற்கு ‘வல்லமை’ நேரான இணையாக இருந்து, ‘அதிகாரம்’ என்று பொருளை மாற்றாமல் காக்கிறது.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: அல்லது எந்தப் பெயரில்
  rationale: ‘பெயரில்’ என்பது ஒருவரைப் பிரதிநிதித்துவப்படுத்தி அல்லது அவரது பெயரை முன்வைத்துச் செயல்படுதல் என்ற வேதாகமச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: ἐποιήσατε τοῦτο
  choice: நீங்கள் இதைச் செய்தீர்கள்
  rationale: எளிய இறந்தகாலம் விசாரணைக் கேள்விக்கு இயல்பாகப் பொருந்துகிறது. ‘இதை’ என்பது குணமாக்குதலை விளக்கமாகச் சேர்க்காமல் மூலத்தின் பரந்த சுட்டுதலைப் பாதுகாக்கிறது.
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள சுட்டுப்பெயர் வலியுறுத்தலைத் தருகிறது. தமிழில் ‘நீங்கள்’ என்பதை வெளிப்படையாக வைத்திருப்பது, ‘நீங்கள்தான்’ என்று அளவுக்கு மீறி வலியுறுத்தாமல் அந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: δύναμις என்பதை ‘வல்லமை’ என்றா, ‘அதிகாரம்’ என்றா மொழிபெயர்ப்பது
  choice: வல்லமை
  alternative: அதிகாரம்
  rationale: மூலத்தில் δύναμις இருப்பதால் ‘வல்லமை’ அதன் இயல்பான பொருளைப் பாதுகாக்கிறது. இணையாக வரும் ‘எந்தப் பெயரில்’ என்ற சொற்றொடர் பிரதிநிதித்துவ அதிகாரத்தை ஏற்கெனவே உணர்த்துவதால், இரண்டிற்கும் இடையிலான வேறுபாட்டை மறைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நடுவில்,’ ‘வல்லமை,’ ‘பெயரில்’ ஆகிய சொற்கள் மூலத்தின் நீதிமன்றச் சூழல், சொற்பொருள் வேறுபாடு, வேதாகமச் சொல்லாட்சி ஆகியவற்றை விளக்கிச் சேர்க்காமல் பாதுகாக்கின்றன.
