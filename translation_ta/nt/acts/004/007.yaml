    issue: The footnote alternative ‘கேட்டுக்கொண்டிருந்தார்கள்’ is ambiguous in Tamil.
    rationale: Without an object such as ‘கேள்வி,’ Tamil readers may understand it as ‘were listening’ rather than ‘were asking.’ This fails to communicate the intended imperfect alternative.
  - severity: low
    issue: ‘நிறுத்திவிட்டு’ is marginally less natural in this formal narrative context.
    rationale: ‘நிறுத்தி’ adequately conveys the participial action preceding the inquiry while reading more smoothly in modern standard Tamil.
