source:
  edition: SBLGNT
  text: καὶ ἐπέβαλον αὐτοῖς τὰς χεῖρας καὶ ἔθεντο εἰς τήρησιν εἰς τὴν αὔριον, ἦν γὰρ ἑσπέρα ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: ta
  text: அவர்கள் பேதுருவையும் யோவானையும் பிடித்து[a], மறுநாள்வரை காவலில் வைத்தார்கள்[b]; ஏனெனில் ஏற்கெனவே மாலையாகிவிட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘அவர்கள்மேல் கைகளைப் போட்டார்கள்.’ இங்கு இக்கிரேக்க மரபுத்தொடர் பகைமையுடன் அவர்களைப் பிடித்ததைக் குறிக்கிறது. ‘அவர்களைக் கைது செய்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களைச் சிறையில் வைத்தார்கள்’ அல்லது ‘காவலின் கீழ் வைத்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வாசகம் காவலில் வைக்கப்பட்டதைக் கூறுகிறது; ஆனால் அது எந்த வகையான இடம் என்பதைத் துல்லியமாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον αὐτοῖς τὰς χεῖρας
  choice: அவர்களைப் பிடித்து
  rationale: இது சொல்லர்த்தமாக ‘அவர்கள்மேல் கைகளைப் போட்டார்கள்’ எனும் கிரேக்க மரபுத்தொடர். இங்குள்ள பகைமையான சட்டச் சூழலில் உடலால் பிடித்துக் காவலுக்கு உட்படுத்தியதைக் குறிக்கிறது. நவீன தமிழில் ‘பிடித்து’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘கைது செய்து’ என்பது சட்டநடவடிக்கையைச் சற்று அதிகமாகத் துல்லியப்படுத்திவிடலாம்.
- source_word: αὐτοῖς
  choice: பேதுருவையும் யோவானையும்
  rationale: பன்மைச் சுட்டுப்பெயர் முந்தைய வசனச் சூழலில் பேதுருவையும் யோவானையும் குறிக்கிறது. தனிவசனமாக வாசிக்கும்போதும் தெளிவாக இருக்கப் பெயர்கள் வெளிப்படையாக வழங்கப்பட்டுள்ளன.
- source_word: ἔθεντο εἰς τήρησιν
  choice: காவலில் வைத்தார்கள்
  rationale: τήρησις காத்தல், கண்காணித்தல், காவலில் வைத்தல் ஆகிய பொருள்களை உடையது. குறிப்பிட்ட சிறைச்சாலைக் கட்டடத்தை மூலவாக்கியம் சொல்லாததால் ‘சிறையில் அடைத்தார்கள்’ என்று மிகைப்படுத்தாமல் ‘காவலில் வைத்தார்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εἰς τὴν αὔριον
  choice: மறுநாள்வரை
  rationale: கதைநடையில் ‘மறுநாள்வரை’ என்பது இயல்பான தமிழ் temporal expression; கிரேக்கத்தின் கால எல்லையையும் நேராகக் காட்டுகிறது.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: ஏனெனில் ஏற்கெனவே மாலையாகிவிட்டது
  rationale: விசாரணை மறுநாளுக்கு ஒத்திவைக்கப்பட்டதற்கான காரணத்தை இக்கூற்று தருகிறது. ‘மாலை’ என்ற வெளிப்படையான காலக் குறிப்பைப் பாதுகாக்கிறது; ‘நேரமாகிவிட்டது’ என்பது குறைவான துல்லியம்.
