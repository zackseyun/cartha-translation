  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க மரபுத்தொடரின் சொல்லர்த்த வடிவம் முதன்மை உரையில் இயல்பற்றதாக இருப்பதால் அதன் சூழல்சார் பொருள் தரப்பட்டு, சொல்லர்த்தமும் மாற்று மொழிபெயர்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
