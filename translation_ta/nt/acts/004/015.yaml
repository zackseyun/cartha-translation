  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: ta
  text: ஆனால், அவர்களை ஆலோசனைச் சங்கத்திலிருந்து வெளியே செல்லும்படி கட்டளையிட்ட பின்பு[a], அவர்கள் ஒருவரோடு ஒருவர் கலந்தாலோசித்துக்கொண்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சனெத்ரினுக்கு வெளியே.” கிரேக்கச் சொல் ஆலோசனைச் சங்கத்தையோ அதன் கூடிய அமர்வையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்களுக்குள் பேசிக்கொண்டிருந்தார்கள்” அல்லது “ஒருவரோடு ஒருவர் விவாதித்துக்கொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: கட்டளையிட்ட பின்பு
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது; அதிகாரபூர்வமான உத்தரவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து தனிப்பட்ட ஆலோசனைக்குத் திரும்பும் மெலிதான முரண்பாட்டையும் கதை நகர்வையும் குறிக்கிறது.
- source_word: ἔξω τοῦ συνεδρίου ἀπελθεῖν
  choice: ஆலோசனைச் சங்கத்துக்கு வெளியே போகும்படி
  rationale: συνέδριον என்பது யூத ஆட்சிமன்றத்தையோ அதன் கூடிய அமர்வையோ குறிக்கலாம். ஒலிபெயர்ப்பைவிட இச்சூழலில் பொருளை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: συνέβαλλον
  choice: கலந்தாலோசித்துக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்து நடைபெற்ற செயலைக் குறிக்கிறது; இச்சூழலில் பரஸ்பரம் விவாதித்து ஆலோசித்தல் என்பதே பொருள்.
- source_word: πρὸς ἀλλήλους
  choice: ஒருவரோடு ஒருவர்
  rationale: பரஸ்பரமாக நடந்த கலந்தாலோசனையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
