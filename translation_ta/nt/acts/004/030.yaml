id: ACT.4.30
reference: Acts 4:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: ta
  text: நீர் குணமாக்குவதற்காக உமது கையை நீட்டும்போது, உமது பரிசுத்த ஊழியரான[a] இயேசுவின் பெயரின் மூலம் அடையாளங்களும் அற்புதங்களும் நிகழட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பரிசுத்த பிள்ளையான.” παῖς என்ற கிரேக்கச் சொல் ‘பிள்ளை’ அல்லது ‘ஊழியர்’ என்று பொருள்படலாம்; இங்கு ஏசாயா நூலின் ‘ஊழியர்’ மொழி எதிரொலிப்பதால் ‘ஊழியர்’ என்பது முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: நீர் ... கையை நீட்டும்போது
  rationale: ἐν τῷ + infinitive குறிக்கும் சமகாலச் சூழ்நிலையை இயல்பான நவீனத் தமிழில் ‘நீட்டும்போது’ எனத் தருகிறது.
- source_word: τὴν χεῖρά σου
  choice: உமது கையை
  rationale: தேவனுடைய செயல் மற்றும் வல்லமையைக் குறிக்கும் வேதாகம உருவகத்தை விளக்கவுரை சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἰς ἴασιν
  choice: குணமாக்குவதற்காக
  rationale: ἴασις என்பதன் ‘குணமாக்குதல்’ என்ற பொருளையும், εἰς குறிக்கும் நோக்கத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: σημεῖα καὶ τέρατα
  choice: அடையாளங்களும் அற்புதங்களும்
  rationale: அப்போஸ்தலர் நூலில் வழக்கமாக இணைந்து வரும் இரு சொற்களையும் தனித்தனியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: γίνεσθαι
  choice: நிகழட்டும்
  rationale: அடையாளங்களும் அற்புதங்களும் நிகழ்வதைத் தெரிவிக்கிறது; இது முந்தைய வசனத்திலிருந்து தொடரும் வேண்டுதலுக்கேற்ற தமிழ்ச் சொற்றொடராகும்.
- source_word: διὰ τοῦ ὀνόματος
  choice: பெயரின் மூலம்
  rationale: διά + genitive குறிக்கும் இடைமுகம் அல்லது செயலாக்கத்தைப் பாதுகாக்கிறது; ‘பெயர்’ என்பதில் உள்ள அதிகாரப் பொருளை மொழிபெயர்ப்பிலேயே விரித்துச் சொல்லவில்லை.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: உமது பரிசுத்த ஊழியரான இயேசு
  rationale: παῖς என்பதற்கு ‘பிள்ளை’ அல்லது ‘ஊழியர்’ என்று பொருள் கொள்ளலாம். அப்போஸ்தலர் 3–4 அதிகாரங்களில் ஏசாயாவின் ஊழியர் மொழி எதிரொலிப்பதால் ‘ஊழியர்’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் παῖς என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: ஊழியர்
  alternative: பிள்ளை
  rationale: சொல் இரு பொருள்களையும் ஏற்கக்கூடியதாயினும், இப்பகுதியின் ஏசாயா ஊழியர் பின்னணி ‘ஊழியர்’ என்பதற்கு ஆதரவளிக்கிறது. உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்பது ஜெபச் சூழலுக்கு ஏற்ற மரியாதை ஒருமை. வசனம் முந்தைய வேண்டுதலின் தொடர்ச்சியாக இருப்பதால், தமிழில் வேண்டுதல் இயல்பாக நிறைவுபெற ‘நிகழட்டும்’ பயன்படுத்தப்பட்டுள்ளது.
