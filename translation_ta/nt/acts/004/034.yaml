base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: ta
  text: ஏனெனில், அவர்களிடையே தேவையில் இருந்தவர் ஒருவர்கூட இல்லை. நிலங்களையோ வீடுகளையோ உடையவர்களாக யாரெல்லாம் இருந்தார்களோ, அவர்கள் அவற்றை விற்று, விற்பனையில் கிடைத்த பணத்தை[a] கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘விற்கப்பட்டவற்றின் விலைகளை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: ஏனெனில் ... ஒருவர்கூட இல்லை
  rationale: γάρ-இன் விளக்கத் தொடர்பை ‘ஏனெனில்’ என்பதும், οὐδέ-யின் வலியுறுத்தலை ‘ஒருவர்கூட இல்லை’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: ἐνδεής
  choice: தேவையில் இருந்தவர்
  rationale: பொருளாதார வறுமைக்கு மட்டும் பொருளைச் சுருக்காமல், பற்றாக்குறை அல்லது தேவை இருந்த நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: τις ἦν ἐν αὐτοῖς
  choice: அவர்களிடையே ... ஒருவர் ... இல்லை
  rationale: கிரேக்க இருப்புநிலைக் கட்டமைப்பை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ὅσοι
  choice: யாரெல்லாம் ... அவர்களோ, அவர்கள்
  rationale: குறிப்பிடப்பட்ட வகுப்பைச் சேர்ந்த அனைவரையும் உள்ளடக்கும் பகிர்மானப் பொருளைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: κτήτορες χωρίων ἢ οἰκιῶν
  choice: நிலங்களையோ வீடுகளையோ உடையவர்கள்
  rationale: சொத்துரிமையையும், χωρίων என்பதன் நிலப்பகுதிகள் என்ற பரந்த பொருளையும் எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: πωλοῦντες ἔφερον
  choice: விற்று ... கொண்டுவந்தார்கள்
  rationale: விற்பதும் அதன் பின் பணத்தைக் கொண்டுவருவதும் தொடர்புடைய செயல்களாக இருப்பதை இயல்பான தமிழில் காட்டுகிறது; கதையோட்டத்தில் திரும்பத் திரும்ப நிகழ்ந்த செயலைச் சூழல் உணர்த்துகிறது.
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: விற்பனையில் கிடைத்த பணத்தை
  rationale: τιμάς என்பதன் நேரடி ‘விலைகள்’ என்ற வடிவத்தை விட, விற்கப்பட்டவற்றிலிருந்து பெறப்பட்ட தொகை என்ற சூழல்சார் பொருளை இன்றைய தமிழில் தெளிவாகக் கூறுகிறது.
