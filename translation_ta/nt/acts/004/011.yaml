source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: ta
  text: இவரே கட்டடக்காரர்களான உங்களால் புறக்கணிக்கப்பட்ட கல்; மூலையின் தலைக்கல்லாக ஆனவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூலைக்கல்” அல்லது “உச்சிக்கல்”; சொல்லுக்குச் சொல், “மூலையின் தலை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: இவரே
  rationale: உடனடி சூழலில் இயேசுவை வலியுறுத்திச் சுட்டுகிறது; தமிழில் மனிதரை மரியாதையுடன் நேரடியாக அடையாளப்படுத்தும் இயல்பான வடிவம்.
- source_word: λίθος
  choice: கல்
  rationale: சங்கீதம் 118:22-ஐச் சுட்டும் கட்டட உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐξουθενηθεὶς
  choice: புறக்கணிக்கப்பட்ட
  rationale: மதிப்பற்றதாகக் கருதி ஒதுக்கப்பட்டதையும், கட்டட உருவகத்தில் பயன்படுத்த மறுத்ததையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑφ’ ὑμῶν
  choice: உங்களால்
  rationale: பன்மை இரண்டாம் நபரை நோக்கிய நேரடியான குற்றச்சாட்டைப் பாதுகாக்கிறது.
- source_word: τῶν οἰκοδόμων
  choice: கட்டுகிறவர்களாகிய
  rationale: சொல்லின் கட்டட உருவகத்தையும், ‘உங்களால்’ என்பதற்கு விளக்கமாக நிற்கும் இணைப்பையும் பாதுகாக்கிறது.
- source_word: ὁ γενόμενος
  choice: இவரே ... ஆனார்
  rationale: நிகழ்ந்த நிலைமாற்றத்தையும் அதன் தற்போதைய விளைவையும் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: κεφαλὴν γωνίας
  choice: மூலைக்குத் தலைக்கல்
  rationale: ‘மூலையின் தலை’ என்ற மூலமொழி உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது; அதன் துல்லியமான கட்டடப் பங்கு உறுதியல்லாததால் மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: சங்கீதம் 118:22 மேற்கோளிலுள்ள கட்டட உருவகம்
  choice: மூலைக்குத் தலைக்கல்
  alternative: மூலைக்கல்; உச்சிக்கல்
  rationale: இயேசுவைத் தள்ளப்பட்டும் பின்னர் உயர்ந்த இடம் பெற்ற கல்லாக அடையாளப்படுத்தும் உருவகத்தைப் பாதுகாக்கிறது. எந்தக் குறிப்பிட்ட கட்டடக் கல் குறிக்கப்படுகிறது என்பதைத் தீர்மானமாகச் சொல்லாமல் உண்மையான சொற்பொருள் ஐயத்தை அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘இவரே’ என்ற மீளுரை கிரேக்க வாக்கியத்தின் வலியுறுத்தலை இயல்பாகத் தக்கவைக்கிறது; அடிக்குறிப்பு குறி பிரதான உரையில் இடம்பெற்றுள்ளது.
