revisions:
- from: கட்டுகிறவர்களாகிய உங்களால் புறக்கணிக்கப்பட்ட கல் இவரே; இவரே மூலைக்குத் தலைக்கல்லானார்.[a]
  to: இவரே கட்டடக்காரர்களான உங்களால் புறக்கணிக்கப்பட்ட கல்; மூலையின் தலைக்கல்லாக ஆனவர்.[a]
  rationale: The revision improves modern Tamil idiom and makes explicit that the accused addressees are metaphorically “the builders,” while preserving the Greek emphasis, the Psalm-derived stone imagery, and the unresolved sense of κεφαλὴ γωνίας. The footnote remains anchored to the disputed architectural expression.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:36:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the emphatic identification, the direct plural accusation, the building metaphor, and the change from rejection to honored status. However, the rendering of τῶν οἰκοδόμων as “கட்டுகிறவர்களாகிய” is less precise and less idiomatic than the noun “கட்டடக்காரர்கள்,” and the initial word order obscures the appositional force, “you, the builders.”
  naturalness: “கட்டுகிறவர்களாகிய உங்களால்” is cumbersome in modern standard Tamil. “கட்டடக்காரர்களான உங்களால்” is natural, clearly identifies the addressees as builders, and retains the metaphor. “மூலையின் தலைக்கல்” is a comprehensible close rendering of the disputed architectural phrase.
  terminology: Use “கட்டடக்காரர்கள்” for οἰκοδόμοι to preserve the construction metaphor as a noun. Retain “புறக்கணிக்கப்பட்ட” as an acceptable contextual rendering of ἐξουθενηθεὶς. Retain “மூலையின் தலைக்கல்” in the text and give “மூலைக்கல்/உச்சிக்கல்” as alternatives, without deciding the debated architectural referent.
  issues:
  - severity: medium
    issue: The expression “கட்டுகிறவர்களாகிய உங்களால்” is awkward and weakens the direct apposition “by you, the builders.”
    rationale: τῶν οἰκοδόμων is a noun identifying “you.” “கட்டடக்காரர்களான உங்களால்” is idiomatic modern Tamil and more directly reflects the Greek construction.
  - severity: low
    issue: The repeated “இவரே” is not needed to convey the Greek syntax and makes the Tamil sentence slightly heavy.
    rationale: The first “இவரே” adequately conveys the emphatic οὗτός; the relative participial clause can be expressed naturally as “ஆனவர்.”
  revised_text: இவரே கட்டடக்காரர்களான உங்களால் புறக்கணிக்கப்பட்ட கல்; மூலையின் தலைக்கல்லாக ஆனவர்.[a]
  revised_footnotes:
  - marker: a
    text: அல்லது, “மூலைக்கல்” அல்லது “உச்சிக்கல்”; சொல்லுக்குச் சொல், “மூலையின் தலை.”
    reason: lexical_alternative
  revision_rationale: The revision improves modern Tamil idiom and makes explicit that the accused addressees are metaphorically “the builders,” while preserving the Greek emphasis, the Psalm-derived stone imagery, and the unresolved sense of κεφαλὴ γωνίας. The footnote remains anchored to the disputed architectural expression.
