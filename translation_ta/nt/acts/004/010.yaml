id: ACT.4.10
reference: Acts 4:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: ta
  text: 'நீங்கள் அனைவரும், இஸ்ரவேல் மக்கள் அனைவரும் இதை அறிந்துகொள்ளுங்கள்: நீங்கள் சிலுவையில் அறைந்தவரும், கடவுள் இறந்தோரிலிருந்து எழுப்பியவருமான நாசரேத்தைச் சேர்ந்த இயேசு மெசியாவின் பெயரால்[a] இந்த மனிதர் நலமடைந்து உங்கள் முன் நிற்கிறார்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இயேசு கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல்லான Χριστός என்பது “மெசியா” என்ற பட்டமாகவோ, பெயரைப் போலப் பயன்படும் “கிறிஸ்து” என்ற வடிவிலோ வழங்கப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “இவரால் இந்த மனிதர் முழு நலத்துடன் உங்கள் முன் நிற்கிறார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் “இதனால்/இவரால்” என்பது இயேசுவையே அல்லது சற்றுமுன் குறிப்பிடப்பட்ட அவரது பெயரையே சுட்டலாம்; ὑγιής என்பது “நலமுள்ளவர்,” “முழு நலத்துடன் இருப்பவர்” என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: இதை அறிந்துகொள்ளுங்கள்
  rationale: பொதுவான அறிவிப்பின் கட்டளை வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: நீங்கள் அனைவரும், இஸ்ரவேல் மக்கள் அனைவரும்
  rationale: உடனிருக்கும் கேட்போரையும் பரந்த இஸ்ரவேல் மக்களையும் தனித்தனி குழுக்களாகத் தக்கவைக்கிறது.
- source_word: ἐν τῷ ὀνόματι
  choice: பெயரால்தான்
  rationale: குணமடைதல் இயேசுவின் பெயரின் வல்லமை அல்லது அதிகாரத்தால் நிகழ்ந்தது என்ற கருவிப்பொருளைத் தெரிவிக்கிறது; emphatic தான் கிரேக்க வாக்கியத்தின் அறிவிப்பு மையத்தை இயல்பாகச் சுட்டுகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதை குடும்பப்பெயராக அல்லாமல் 'அபிஷேகம் செய்யப்பட்டவர்' என்ற பட்டமாக வெளிப்படுத்துகிறது.
- source_word: τοῦ Ναζωραίου
  choice: நாசரேயராகிய
  rationale: நாசரேத்தைச் சேர்ந்தவர் என்ற அடையாளத்தை மரியாதையான, இயல்பான தமிழில் தருகிறது.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: நீங்கள் சிலுவையில் அறைந்தவர்
  rationale: கேட்போர்மீதான பேதுருவின் நேரடியான குற்றச்சாட்டைத் தணிக்காமல் காக்கிறது.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: கடவுள் இறந்தோரிலிருந்து உயிர்த்தெழச் செய்தவர்
  rationale: கடவுளின் செயற்பாட்டையும் உயிர்த்தெழுதலையும் தெளிவாகவும் வழக்கமான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: ἐν τούτῳ
  choice: பெயரால்தான்
  rationale: முன்னர் குறிப்பிடப்பட்ட இயேசுவின் பெயரைச் சுட்டுவதாக முதன்மையாக எடுத்துக்கொள்கிறது; இயேசுவையே சுட்டும் கருவிப்பொருள் வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν
  choice: இந்த மனிதர் ... உங்கள் முன் நிற்கிறார்
  rationale: குணமடைந்த மனிதர் அங்கே காணக்கூடிய நிலையில் நிற்பதைத் தெளிவுபடுத்துகிறது; perfect வினையின் நிகழ்நிலை விளைவை காக்கிறது.
- source_word: ὑγιής
  choice: நலமடைந்து
  rationale: உடல் நலம் மீட்கப்பட்டதைக் கூறும் இயல்பான தமிழாக்கம்; 'முழு நலத்துடன்' என்ற மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதை பட்டமாகவா, பெயரின் பகுதியாகவா மொழிபெயர்ப்பது
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இஸ்ரவேலின் தலைவர்கள்முன் இயேசுவின் அடையாளத்தை அறிவிக்கும் சூழலில் பட்டத்திற்குரிய பொருள் செயலில் உள்ளது; ஆகவே அதைத் தமிழில் பொருளுடன் வழங்குகிறது.
- issue: ἐν τούτῳ என்பதன் சுட்டுப்பொருள்
  choice: இந்தப் பெயரால்
  alternative: இவரால்
  rationale: உடனடியாக முன்வந்த 'இயேசு மெசியாவின் பெயரில்' என்ற தொடரை மீண்டும் சுட்டுவதாகக் கொள்ளப்படுகிறது; இருப்பினும் கிரேக்கம் இயேசுவையே கருவியாகச் சுட்டக்கூடும் என்பதால் அந்த ambiguity அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: உயிர்த்தெழுதல் பற்றிய சொற்றொடர்
  choice: கடவுள் இறந்தோரிலிருந்து உயிர்த்தெழச் செய்தார்
  alternative: கடவுள் இறந்தவர்களிடமிருந்து எழுப்பினார்
  rationale: கடவுளின் வெளிப்படையான செயற்பாட்டையும் இயேசுவின் உயிர்த்தெழுதலையும் மேலதிக கோட்பாட்டு விளக்கம் சேர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் வகையில் நேரடியானதாய் இருந்தாலும், பொதுச் சபை அறிவிப்புக்கேற்ற கண்ணியமான நடையைப் பேணுகிறது. குற்றச்சாட்டு, தெய்வீக செயற்பாடு, குணமடைந்த மனிதரின் கண்கூடான நிலை ஆகியவை தணிக்கப்படவில்லை.
