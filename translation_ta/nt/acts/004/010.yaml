  to: 'நீங்கள் அனைவரும், இஸ்ரவேல் மக்கள் அனைவரும் இதை அறிந்துகொள்ளுங்கள்: நீங்கள் சிலுவையில் அறைந்தவரும், கடவுள் இறந்தோரிலிருந்து எழுப்பியவருமான நாசரேத்தைச் சேர்ந்த இயேசு மெசியாவின் பெயரால்[a] இந்த மனிதர் நலமடைந்து உங்கள் முன் நிற்கிறார்.[b]'
