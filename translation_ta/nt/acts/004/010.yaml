  naturalness: நவீன நிலையான தமிழில் நடை தெளிவாக உள்ளது. «நாசரேயராகிய» என்பதற்குப் பதிலாக «நாசரேத்தைச் சேர்ந்த» என்பது பொதுவாசகருக்கு வெளிப்படையாகவும் இயல்பாகவும் உள்ளது. பொது அறிவிப்பு நடையும் நேரடியான குற்றச்சாட்டும் தக்கவைக்கப்படுகின்றன.
