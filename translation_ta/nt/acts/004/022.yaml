revisions:
- from: ஏனெனில், இந்தக் குணமாக்கும் அடையாளம்[a] நிகழ்ந்த அந்த மனிதருக்கு நாற்பது வயதுக்கு மேல் ஆகியிருந்தது.
  to: ஏனெனில் இந்தக் குணமாக்கும் அடையாளம் யாரிடம் நிகழ்ந்ததோ அந்த மனிதர் நாற்பது வயதுக்கு மேற்பட்டவராக இருந்தார்.[a]
  rationale: The revision clarifies the Greek relative relationship (the man to whom the sign had happened), retains the event-focused wording without specifying an agent, and uses a more natural modern Tamil age expression. The footnote is adjusted to give a clear alternative for the genitival relationship in τὸ σημεῖον τοῦτο τῆς ἰάσεως.
