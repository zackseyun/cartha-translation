id: ACT.4.22
reference: Acts 4:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: ta
  text: ஏனெனில் இந்தக் குணமாக்கும் அடையாளம் யாரிடம் நிகழ்ந்ததோ அந்த மனிதர் நாற்பது வயதுக்கு மேற்பட்டவராக இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்தக் குணமாக்குதலின் அடையாளம்’ அல்லது ‘இந்தக் குணமாக்கும் அற்புதம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: நாற்பது வயதுக்கு மேல் ஆகியிருந்தது
  rationale: வயதைக் குறிக்கும் இந்த ஒப்பீட்டு மரபுத்தொடரை இயல்பான நவீனத் தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை வழங்கும் γάρ என்பதன் உரையாடல் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ὁ ἄνθρωπος
  choice: அந்த மனிதர்
  rationale: சூழலில் ஏற்கெனவே அறிமுகமான குறிப்பிட்ட ஆண் நபரைக் குறிக்கிறது; மரியாதையான தமிழ்நடைக்கு ஏற்ப ‘மனிதர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐφ’ ὃν
  choice: … நிகழ்ந்த அந்த மனிதருக்கு
  rationale: அந்த நிகழ்வால் பாதிக்கப்பட்ட நபருடனான தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது; கிரேக்கத்தின் பொருளைத் தக்கவைக்கிறது.
- source_word: γεγόνει
  choice: நிகழ்ந்த
  rationale: முன்னரே நிறைவடைந்த நிகழ்வைக் குறிக்கிறது; செயற்படுத்தியவர் யார் என்பதை மூலத்தைவிட வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: τὸ σημεῖον τοῦτο
  choice: இந்த … அடையாளம்
  rationale: σημεῖον என்பதன் சான்றளிக்கும், அர்த்தம் சுட்டும் தன்மையைப் பாதுகாக்க ‘அடையாளம்’ பயன்படுத்தப்பட்டுள்ளது; ‘அற்புதம்’ என்று மட்டும் மொழிபெயர்த்து அதன் நுணுக்கத்தைக் குறைக்கவில்லை.
- source_word: τῆς ἰάσεως
  choice: குணமாக்கும்
  rationale: குணமடைதலைக் குறிக்கும் ἴασις என்பதைக் ‘அடையாளம்’ என்பதோடு இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: அற்புதச் சூழலில் σημεῖον என்பதன் மொழிபெயர்ப்பு
  choice: அடையாளம்
  alternative: அற்புதம்
  rationale: லூக்கா இந்தச் செயலை வெறும் வியப்பூட்டும் நிகழ்வாக மட்டுமல்லாமல் அர்த்தமுள்ள சான்றாகவும் காட்டுவதால், ‘அடையாளம்’ மூலத்தின் இறையியல் நுணுக்கத்தைப் பாதுகாக்கிறது.
- issue: γεγόνει என்பதில் செய்பவரின் பங்கு
  choice: நிகழ்ந்த
  alternative: செய்யப்பட்ட
  rationale: கிரேக்கத்தில் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. ‘நிகழ்ந்த’ என்பது நிகழ்வை மையப்படுத்தி, மூலத்தில் இல்லாத வலுவான செயப்பாட்டு அர்த்தத்தைச் சேர்க்காமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்த மனிதருக்கு நாற்பது வயதுக்கு மேல் ஆகியிருந்தது’ என்பது வயதைக் கூறும் இயல்பான தமிழ்முறை; ‘குணமாக்கும் அடையாளம்’ என்பது மூலத்தின் அடையாளம்/குணமாக்குதல் உறவைச் சுருக்கமாகவும் தெளிவாகவும் தக்கவைக்கிறது.
