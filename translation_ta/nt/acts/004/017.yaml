id: ACT.4.17
reference: Acts 4:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: ta
  text: ஆனால், இது மக்களிடையே மேலும் பரவாதபடி, இனி இந்தப் பெயரில் யாரிடமும் பேசக் கூடாது என்று அவர்களை மிரட்டுவோம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைக் கடுமையாக எச்சரிப்போம்.” கிரேக்க வினை அதிகாரத்துடன் அச்சுறுத்தும் வலிமையைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: பரவாதபடி
  rationale: இங்கு அந்த நிகழ்வும் அதைப் பற்றிய செய்தியும் மக்களிடையே விரிவாகச் செல்வதைக் குறிக்கிறது; ‘பரவுதல்’ என்பது இயல்பான தமிழில் இந்தச் சூழலுக்குப் பொருத்தமானது.
- source_word: ἐπὶ πλεῖον
  choice: மேலும்
  rationale: இதுவரை பரவிய அளவைத் தாண்டி இனியும் தொடர்வதைத் தடுக்கும் ஒப்பீட்டு நுட்பத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: εἰς τὸν λαόν
  choice: மக்களிடையே
  rationale: பொதுமக்களின் மத்தியில் பரவுவதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἀπειλησώμεθα
  choice: மிரட்டுவோம்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளான அதிகாரபூர்வமான அச்சுறுத்தலை நேரடியாகக் காக்கிறது; இது சாதாரண எச்சரிக்கையைவிட வலுவானது.
- source_word: μηκέτι λαλεῖν
  choice: இனி … பேசக் கூடாது
  rationale: இந்த நேரத்திலிருந்து பேசுவதை நிறுத்த வேண்டும் என்ற μηκέτι என்பதன் காலநுட்பத்தையும் தடையின் வலிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: இந்தப் பெயரில்
  rationale: அந்தப் பெயருடன் தொடர்புபட்டு அல்லது அதன் அதிகாரத்தின் அடிப்படையில் பேசுதல் என்ற மூலத்தின் பொருள் விரிவைத் தேவையின்றி குறுக்காமல் காக்கிறது.
- source_word: μηδενὶ ἀνθρώπων
  choice: யாரிடமும்
  rationale: மனிதர் எவரிடமும் பேசக்கூடாது என்ற பொதுப்பொருளை பாலினச் சாய்வின்றி இயல்பாகத் தருகிறது.
theological_decisions:
- issue: சங்கத்தாரின் நடவடிக்கையில் ἀπειλησώμεθα என்பதன் வலிமை
  choice: மிரட்டுவோம்
  alternative: கடுமையாக எச்சரிப்போம்
  rationale: நீதிமன்ற மற்றும் கட்டாயப்படுத்தும் சூழலில் கிரேக்க வினை சாதாரண அறிவுரையை அல்ல, அச்சுறுத்தலைக் குறிக்கிறது. ஆகவே வலுவான பொருள் முதன்மை உரையில் வைக்கப்பட்டு, மென்மையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘இந்தப் பெயரில்’ என்பதன் தொடர்பு அல்லது அதிகார நுட்பம்
  choice: இந்தப் பெயரில்
  alternative: இந்தப் பெயரின் அதிகாரத்தால் / இந்தப் பெயரை ஆதாரமாகக் கொண்டு
  rationale: ἐπί தொடரின் பொருள் பெயருடன் உள்ள தொடர்பையும் அதன் அதிகார அடிப்படையையும் உள்ளடக்கக்கூடும். விளக்கவுரை ஒன்றைத் தேர்ந்தெடுத்து மூலத்தின் பொருள் விரிவைக் குறுக்காமல் வழக்கமான சொற்றொடர் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாகச் சொல்லப்படாத பரவுகின்ற காரியத்தை ‘இது’ என்று மட்டும் சுட்டி, ‘செய்தி’ அல்லது ‘போதனை’ என்று விளக்கிச் சுருக்குவது தவிர்க்கப்பட்டுள்ளது.
