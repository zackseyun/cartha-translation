  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: ta
  text: அவர்கள் விடுவிக்கப்பட்ட பின்பு, தங்கள் சொந்தவர்களிடம்[a] சென்று, தலைமை ஆசாரியர்களும் மூப்பர்களும் அவர்களிடம் சொன்ன அனைத்தையும் தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் தோழர்களிடம்’; சொல்லுக்கு சொல், ‘தங்களுடையவர்களிடம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: அவர்கள் விடுவிக்கப்பட்ட பின்பு
  rationale: ἀπολύω என்பதன் இறந்தகாலச் செயப்பாட்டு வினையெச்சம், முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது. காவல் மற்றும் விசாரணைச் சூழலில் ‘விடுவிக்கப்பட்ட’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான நிகழ்வுத் தொடர்ச்சியைக் காட்டுகிறது. ‘விடுவிக்கப்பட்ட பின்பு’ என்ற காலத் தொடர் தமிழிலேயே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துவதால் தனியாக ‘ஆனால்’ அல்லது ‘பின்பு’ சேர்க்கப்படவில்லை.
- source_word: ἦλθον
  choice: சென்று
  rationale: ἔρχομαι சூழலின் பார்வைக்கேற்ப ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படும். இலக்கை நோக்கிய நகர்வைத் தமிழில் இயல்பாகச் சொல்ல ‘சென்று’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: πρὸς τοὺς ἰδίους
  choice: தங்கள் சொந்தவர்களிடம்
  rationale: τοὺς ἰδίους என்பது சொல்லுக்கு சொல் ‘தங்களுக்குரியவர்களிடம்’ அல்லது ‘தங்கள் சொந்தவர்களிடம்’ எனும் பொருளுடையது; அவர்களுடைய கூட்டாளிகள் அல்லது சமூகத்தைச் சுட்டுகிறது. குறிப்பை அளவுக்கு மீறித் தீர்மானிக்காமல் மூலத்தின் சுருக்கமும் ambiguity-யும் காக்கப்படுகிறது.
- source_word: ἀπήγγειλαν
  choice: தெரிவித்தார்கள்
  rationale: ἀπαγγέλλω என்பது பெற்ற தகவலை எடுத்துரைத்தல் அல்லது அறிக்கையிடுதல். இச்சூழலில் ‘தெரிவித்தார்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் முறையானதாகவும் உள்ளது.
- source_word: ὅσα
  choice: சொன்ன அனைத்தையும்
  rationale: ὅσα அறிக்கையின் முழு உள்ளடக்கத்தையும் உள்ளடக்குகிறது. ‘அனைத்தையும்’ அதன் விரிவான பொருளைச் சுருக்கமாகக் காக்கிறது.
- source_word: πρὸς αὐτοὺς
  choice: தங்களிடம்
  rationale: λέγω உடன் வரும் πρός + வேற்றுமை வடிவம் பொதுவாக ஒருவரிடம் பேசுவதைக் குறிக்கிறது. பிரதிபெயர்ச்சொல் பேதுருவையும் யோவானையும் குறித்தாலும், மூலத்தைப் போல பிரதிபெயர் வடிவமே வைக்கப்பட்டுள்ளது.
- source_word: οἱ ἀρχιερεῖς
  choice: முதன்மை ஆசாரியர்கள்
  rationale: பன்மையில் வரும் ἀρχιερεῖς, ஒரே தலைமை ஆசாரியரை மட்டும் அல்லாமல் முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கிறது. ‘முதன்மை ஆசாரியர்கள்’ அந்த வேறுபாட்டைக் காக்கிறது.
- source_word: οἱ πρεσβύτεροι
  choice: மூப்பர்கள்
  rationale: இந்நிறுவனச் சூழலில் πρεσβύτεροι வயதான ஆண்களைப் பொதுவாக அல்ல, அங்கீகரிக்கப்பட்ட யூதத் தலைவர்களைக் குறிக்கிறது. ‘மூப்பர்கள்’ வழக்கமான துல்லியமான சொல்.
- source_word: εἶπαν
  choice: சொன்ன
  rationale: அவர்கள் சொன்னது அதைப் பின்னர் தெரிவித்ததற்கு முந்தியது. தமிழ் வாக்கிய அமைப்பில் ‘சொன்ன’ என்ற பெயரெச்சம் காலவரிசையை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
