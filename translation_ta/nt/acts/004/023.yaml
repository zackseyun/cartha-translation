    text: அல்லது, ‘தங்கள் தோழர்களிடம்’; சொல்லுக்கு சொல், ‘தங்களுடையவர்களிடம்.’
    reason: lexical_alternative
  revision_rationale: The revision resolves the Tamil reflexive-pronoun ambiguity so that the authorities are understood to have spoken to Peter and John, as in the Greek. It also uses the conventional term “தலைமை ஆசாரியர்கள்” for “chief priests.” The broad reference of πρὸς τοὺς ἰδίους is retained, with a literal alternative in the footnote.
