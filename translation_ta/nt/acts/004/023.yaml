revisions:
- from: அவர்கள் விடுவிக்கப்பட்ட பின்பு, தங்கள் சொந்தவர்களிடம்[a] சென்று, முதன்மை ஆசாரியர்களும் மூப்பர்களும் தங்களிடம் சொன்ன அனைத்தையும் தெரிவித்தார்கள்.
  to: அவர்கள் விடுவிக்கப்பட்ட பின்பு, தங்கள் சொந்தவர்களிடம்[a] சென்று, தலைமை ஆசாரியர்களும் மூப்பர்களும் அவர்களிடம் சொன்ன அனைத்தையும் தெரிவித்தார்கள்.
  rationale: The revision resolves the Tamil reflexive-pronoun ambiguity so that the authorities are understood to have spoken to Peter and John, as in the Greek. It also uses the conventional term “தலைமை ஆசாரியர்கள்” for “chief priests.” The broad reference of πρὸς τοὺς ἰδίους is retained, with a literal alternative in the footnote.
