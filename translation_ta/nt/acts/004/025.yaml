language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: ta
  text: 'அவர்[a] பரிசுத்த ஆவியின் வழியாக, உமது ஊழியரான தாவீதின் வாயினால் கூறினார்: “நாடுகள் ஏன் கொந்தளித்தன, மக்கள் வீணானவற்றைத் திட்டமிட்டார்கள்[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சில கையெழுத்துப் பிரதிகளில் “எங்கள் தந்தையாகிய உமது ஊழியன் தாவீது” என்று வாசிக்கப்படுகிறது. அதன்படி அறிமுகம்: “அவர் பரிசுத்த ஆவியின் வழியாக, எங்கள் தந்தையாகிய உமது ஊழியன் தாவீதின் வாயினால் கூறினார்” என்றிருக்கும்.'
    reason: textual_variant
  - marker: b
    text: அல்லது, “வீணானவற்றைத் தியானித்தார்கள்.” கிரேக்க வினைச்சொல் “தியானித்தல்” என்றும், இந்தச் சூழலில் “திட்டமிடுதல்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: அவர்
  rationale: இந்த இடத்தின் உரை வேறுபாடு மற்றும் சிக்கலான தொடரமைப்பைக் கருத்தில் கொண்டு, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தேவனுடன் இயல்பாகத் தொடர்புபடுத்தும் சுட்டுப்பெயர் பயன்படுத்தப்பட்டது; ‘எங்கள் தந்தை’ என்ற வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: διὰ πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியின் வழியாக
  rationale: διά உடன் வரும் உருபு பரிசுத்த ஆவியின் கருவித்தன்மையையோ செயலாண்மையையோ குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் இதைத் தெரிவிக்கிறது.
- source_word: στόματος Δαυὶδ
  choice: தாவீதின் வாயினால்
  rationale: தீர்க்கதரிசன உரையின் மனிதப் பேச்சாளரைச் சுட்டும் வேதாகம மரபுச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: παιδός σου
  choice: உமது ஊழியரான
  rationale: παῖς என்பதற்கு ‘பிள்ளை’ அல்லது ‘ஊழியர்’ எனப் பொருள் இருக்கலாம்; இங்கு தாவீது தேவனுடைய ஊழியர் என்ற சூழலுக்கு ‘ஊழியர்’ பொருத்தமானது.
- source_word: εἰπών
  choice: கூறியது
  rationale: மேற்கோளை அறிமுகப்படுத்தும் இறந்தகால வினையெச்சம் தமிழில் இயல்பான முற்றுவினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: Ἱνατί
  choice: ஏன்
  rationale: காரணம் கேட்கும் வினாவை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐφρύαξαν
  choice: கொந்தளித்தன
  rationale: கலகத்துடன் கூடிய ஆவேசமான எழுச்சியைத் தெரிவிக்கிறது; ‘சினந்தன’ என்பதைக் காட்டிலும் கூட்டங்களின் கொந்தளிப்பை நன்றாகப் பிடிக்கிறது.
- source_word: ἔθνη
  choice: நாடுகள்
  rationale: சமய-இனப் பிரிவாக ‘புறவினத்தார்’ என்று குறுக்காமல், சங்கீத மேற்கோளின் பரந்த தேசங்களைக் குறிக்கும் பொருளைக் காக்கிறது.
- source_word: λαοὶ
  choice: மக்கள்
  rationale: பன்மைச் சமூகங்களைக் குறிக்கும் கிரேக்கச் சொல்லை இயல்பான தமிழில் தருகிறது; ‘நாடுகள்’ என்பதுடன் உள்ள கவிதை இணைப்பையும் காக்கிறது.
- source_word: ἐμελέτησαν
  choice: திட்டமிட்டார்கள்
  rationale: வினைச்சொல்லுக்கு ‘தியானித்தார்கள்’ என்ற பொருளும் உண்டு; ஆனால் எதிர்ப்புச் சூழலில் திட்டமிடுதல் என்ற பொருள் இயல்பானது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κενά
  choice: வீணானவற்றை
  rationale: வெறுமையும் பயனின்மையும் ஆகிய இரு நிழற்பொருள்களையும் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மேற்கோள் அறிமுகத்தின் உரை வடிவம்
  choice: முதன்மை உரையில் ‘அவர்’ என்று முந்தைய வசனத்தில் உள்ள தேவனுடன் தொடர்புபடுத்தி, ‘எங்கள் தந்தை’ என்ற வாசகத்தை அடிக்குறிப்பில் தருதல்
  alternative: ‘எங்கள் தந்தையாகிய உமது ஊழியன் தாவீதின் வாயினால்’ என்று முதன்மை உரையில் சேர்த்தல்
  rationale: SBLGNT-யில் τοῦ πατρὸς ἡμῶν என்பதன் இடமும் உரைச் சான்றும் சிக்கலானவை. சர்ச்சைக்குரிய சொற்றொடரைத் தீர்மானமாக முதன்மை உரையில் புகுத்தாமல், வாசிப்பின் தெளிவையும் உரை வேறுபாட்டின் வெளிப்படைத்தன்மையையும் காக்கிறது.
- issue: ἐμελέτησαν என்பதன் சூழல்சார் பொருள்
  choice: திட்டமிட்டார்கள்
  alternative: தியானித்தார்கள்
  rationale: இந்த எதிர்ப்புச் சூழலில் பகைமையான திட்டமிடுதல் முதன்மைப் பொருளாகத் தெரிகிறது; இருப்பினும் ‘தியானித்தல்’ என்ற அடிப்படைச் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, வழிபாட்டு வாசிப்புக்கும் பொதுவாசிப்புக்கும் ஏற்ற கண்ணியமான நடை. ‘உமது’ என்பது ஜெபச் சூழலின் மரியாதைத் தொனியைத் தக்கவைக்கிறது; அரிதான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
