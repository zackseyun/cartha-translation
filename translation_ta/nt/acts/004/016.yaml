  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: ta
  text: 'அவர்கள் கூறினார்கள்: “இந்த மனிதர்களை நாம் என்ன செய்வது? ஏனெனில், இவர்கள் மூலமாக நன்கு அறியப்பட்ட[a] அடையாளம் ஒன்று நிகழ்ந்துள்ளது என்பது எருசலேமில் குடியிருக்கும் அனைவருக்கும் வெளிப்படையாகத் தெரிகிறது; அதை நம்மால் மறுக்க முடியாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குறிப்பிடத்தக்க.” γνωστόν என்ற கிரேக்கச் சொல் “அறியப்பட்ட, நன்கு அறியப்பட்ட” என்று பொருள்படலாம்; இச்சூழலில் அது பொதுவாக அறியப்பட்ட அடையாளம் என்ற கருத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: அவர்கள் இவ்வாறு பேசிக்கொண்டார்கள்
  rationale: முந்தைய நிகழ்வுடன் தொடர்புடைய நிகழ்கால வினையெச்சத்தைத் தமிழ் கதைநடையில் இயல்பாகக் காட்டுகிறது; ஆலோசனைக்குள் தொடர்ந்த பேச்சு என்ற நுணுக்கத்தையும் காக்கிறது.
- source_word: Τί ποιήσωμεν
  choice: நாம் என்ன செய்வது?
  rationale: ஆலோசனையைக் குறிக்கும் aorist subjunctive கேள்வியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: இந்த மனிதர்களை
  rationale: பேதுருவையும் யோவானையும் சுட்டுகிறது; ποιέω உடனான தத்திவுப் பயன்பாட்டின் ‘இவர்களைக் குறித்து/இவர்களை வைத்து என்ன செய்வது’ என்ற பொருளைத் தமிழ் வழக்கில் சுருக்கமாகத் தருகிறது.
- source_word: ὅτι μὲν γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கேள்விக்கான விளக்கக் காரணத்தைத் தெளிவாகக் காட்டுகிறது; கிரேக்கத்தின் வலியுறுத்தல் தொடர்ந்து வரும் வெளிப்படையான உண்மையால் தமிழில் உணரப்படுகிறது.
- source_word: γνωστὸν σημεῖον
  choice: நன்கு அறியப்பட்ட அடையாளம்
  rationale: γνωστός என்பதன் ‘அறியப்பட்ட/நன்கு அறியப்பட்ட’ பொருளையும், நிகழ்வு பொதுவில் அங்கீகரிக்கப்பட்டிருந்த சூழலையும் காக்கிறது; σημεῖον என்பதன் இறையியல் சுட்டுப்பொருளை ‘அற்புதம்’ என்று மட்டும் சுருக்காமல் ‘அடையாளம்’ எனத் தருகிறது.
- source_word: γέγονεν
  choice: நிகழ்ந்துள்ளது
  rationale: நிறைவுற்ற நிகழ்வின் தற்போதைய விளைவை உணர்த்தும் perfect காலத்தின் வலிமையைத் தமிழில் காக்கிறது.
- source_word: δι’ αὐτῶν
  choice: இவர்கள் மூலமாக
  rationale: διά + genitive குறிக்கும் கருவி அல்லது இடைமுகச் செயல்பாட்டைத் தருகிறது; அடையாளம் இவர்களுடைய சுய ஆற்றலால் நிகழ்ந்தது என்று மிகைப்படுத்துவதில்லை.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: எருசலேமில் குடியிருக்கும் அனைவருக்கும் வெளிப்படையாகத் தெரிகிறது
  rationale: அந்த நிகழ்வு நகரவாசிகள் அனைவருக்கும் மறைக்க முடியாதபடி தெளிவாக இருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: அதை நம்மால் மறுக்க முடியாது
  rationale: கிரேக்கத்தில் மறைமுகமாக உள்ள செயப்படுபொருளை முந்தைய அடையாளத்தைக் குறிக்கும் ‘அதை’ எனத் தமிழில் வெளிப்படுத்தி வாக்கியத்தைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: பொதுவில் நிகழ்ந்த குணமாக்குதலை σημεῖον என அழைப்பது
  choice: அடையாளம்
  alternative: அற்புதம்
  rationale: அச்செயல் அற்புதமானது என்ற சூழல் பொருளைக் காக்கும் அதேவேளையில், அது தன்னைக் கடந்த ஓர் உண்மையைச் சுட்டுகிறது என்ற லூக்காவின் சொல்லாட்சியையும் ‘அடையாளம்’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நிகழ்ந்துள்ளது’, ‘மூலமாக’, ‘வெளிப்படையாகத் தெரிகிறது’ ஆகியவை மூலத்தின் காலம், இடைமுகம், பொதுவான தெளிவு ஆகியவற்றை இயல்பாகக் காக்கின்றன.
