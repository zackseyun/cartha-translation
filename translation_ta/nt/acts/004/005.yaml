lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: நிகழ்வைத் தனியாகச் சொல்லாமல், ‘மறுநாள்’ என நேரடியாகத் தொடங்குதல்
  rationale: இந்தக் கிரேக்கக் கதைநடைச் சூத்திரம் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது இயல்பற்றதாக இருப்பதால், அதன் கதைத் தொடர்ச்சி ‘மறுநாள்’ என்ற நேரடித் தொடக்கத்தில் வெளிப்படுகிறது.
- source_word: ἐπὶ τὴν αὔριον
  choice: மறுநாள்
  rationale: ‘அடுத்த நாள்’ என்ற காலக் குறிப்பை இயல்பான, சுருக்கமான நவீனத் தமிழில் தருகிறது.
- source_word: συναχθῆναι
  choice: ஒன்றுகூட்டப்பட்டார்கள்
  rationale: வினைச்சொல்லின் இறந்தகாலச் செயப்பாட்டு வடிவத்தையும், ஒரு குழுவாகக் கூடும் பொருளையும் பாதுகாக்கிறது. இயல்பாக ‘ஒன்றுகூடினார்கள்’ என்றும் கொள்ளலாம்; மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: கிரேக்கத்தில் உள்ள உறவைக் குறிக்கும் உருபைத் தக்கவைத்து, அது யாரைக் குறிக்கிறது என்பதை வசனத்திற்கு அப்பால் மிகக் குறிப்பாக நிர்ணயிக்காமல் விடுகிறது.
- source_word: τοὺς ἄρχοντας
  choice: ஆட்சியாளர்கள்
  rationale: இச்சூழலில் அதிகாரம் வகிக்கும் தலைவர்களைக் குறிக்கிறது; ‘ஆட்சியாளர்கள்’ என்பது அவர்களின் அதிகாரப் பங்கைத் தெளிவாகத் தருகிறது.
- source_word: τοὺς πρεσβυτέρους
  choice: மூப்பர்கள்
  rationale: வயதில் மூத்தவர்களை மட்டும் அல்லாமல், அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களைக் குறிக்கும் நிறுவனப் பொருளைத் தருகிறது.
- source_word: τοὺς γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: இவர்கள் வெறும் எழுத்தர்களல்ல; திருச்சட்டம் மற்றும் மறைநூல்களில் தேர்ந்த அங்கீகரிக்கப்பட்ட அறிஞர்கள். நவீனத் தமிழில் அவர்களின் பணியை இயல்பாக உணர்த்துகிறது.
- source_word: ἐν Ἰερουσαλήμ
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: αὐτῶν என்பதன் முன்னிலைச் சுட்டு
  choice: ‘அவர்களுடைய’ என்று மொழிபெயர்த்து உறவுச் சுட்டைத் தக்கவைத்தல்
  alternative: சுட்டுப்பெயரை விடுத்து ‘ஆட்சியாளர்களும்...’ என மட்டும் கூறுதல், அல்லது ‘யூதர்களுடைய ஆட்சியாளர்கள்’ எனக் குறிப்பாக்குதல்
  rationale: மூலத்தில் சுட்டுப்பெயர் உள்ளது; ஆனால் இந்த வசனத்திலேயே அதன் முன்னிலைச் சுட்டு வெளிப்படையாகக் குறிப்பிடப்படவில்லை. ஆகவே உறவைக் காத்து, அடையாளத்தைத் தேவையின்றிக் குறுக்கமாக நிர்ணயிக்கவில்லை.
- issue: συναχθῆναι என்ற செயப்பாட்டு வடிவம்
  choice: ‘ஒன்றுகூட்டப்பட்டார்கள்’ என்று செயப்பாட்டை வெளிப்படுத்துதல்
  alternative: ‘ஒன்றுகூடினார்கள்’ என்று தன்னிச்சையான கூடுகையாக மொழிபெயர்த்தல்
  rationale: யாரால் கூட்டப்பட்டார்கள் என்பதை உரை கூறவில்லை. செயப்பாட்டு வடிவத்தைப் பாதுகாப்பது அந்தத் திறந்தநிலையையும், அவர்களை யாரோ கூட்டியிருக்கலாம் என்ற நுணுக்கத்தையும் அழிக்காமல் வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘எழுத்தர்கள்’ என்ற சொல் இச்சூழலில் தவறாகப் புரியக்கூடும் என்பதால் γραμματεῖς என்பதற்கு ‘மறைநூல் அறிஞர்கள்’ பயன்படுத்தப்பட்டது. கிரேக்கக் கதைநடைச் சூத்திரத்தைச் சொல்லுக்குச் சொல் தராமல் இயல்பான தமிழ்க் கதைநடையில் வெளிப்படுத்தப்பட்டுள்ளது.
