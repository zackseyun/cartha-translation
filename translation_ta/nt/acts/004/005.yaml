  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: ta
  text: மறுநாள், அவர்களுடைய ஆட்சியாளர்களும் மூப்பர்களும் மறைநூல் அறிஞர்களும் எருசலேமில் கூட்டப்பட்டனர்.[a]
  philosophy: optimal-equivalence
