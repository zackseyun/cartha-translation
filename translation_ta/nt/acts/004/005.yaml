  - marker: a
    text: 'அல்லது, ‘ஒன்றுகூடினார்கள்’ அல்லது ‘கூடி வந்தார்கள்.’ கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவில் உள்ளது: ‘கூட்டப்பட்டனர்.’'
