  text: அவர்கள் மக்களுக்குக் கற்பித்ததாலும், இயேசுவில் இறந்தோரிலிருந்து உயிர்த்தெழுதலை அறிவித்ததாலும்,[a] மிகவும் எரிச்சலடைந்தனர்.
  philosophy: optimal-equivalence
