lexical_decisions:
- source_word: διαπονούμενοι
  choice: கடும் எரிச்சலடைந்தார்கள்
  rationale: அதிகாரிகள் ஆழமாகச் சினமுற்று மனம் புண்பட்ட நிலையைக் குறிக்கும் வலிமையை இது இயல்பான நவீனத் தமிழில் தருகிறது; வெறும் ‘வருத்தமடைந்தார்கள்’ என்பது போதிய வலிமையற்றது.
- source_word: διὰ τὸ διδάσκειν
  choice: கற்பித்ததாலும்
  rationale: διά உடன் வரும் பெயர்ச்சொல் வடிவ வினை காரணத்தைக் குறிக்கிறது; தமிழில் ‘-தாலும்’ என்ற அமைப்பு அந்தக் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτοὺς
  choice: அவர்கள்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட பேதுருவையும் யோவானையும் சுட்டும் பிரதிப்பெயரை, பெயர்களைச் சேர்த்து விளக்காமல் அப்படியே பேணுகிறது.
- source_word: τὸν λαὸν
  choice: மக்களுக்கு
  rationale: λαός என்பது ஒரு தற்செயலான கூட்டத்தை மட்டுமல்லாமல் மக்களைத் தொகுதியாகக் குறிக்கிறது; ‘மக்கள்’ தெளிவான, வழக்கமான இணை.
- source_word: καταγγέλλειν
  choice: அறிவித்ததாலும்
  rationale: பொதுவெளியில் அதிகாரபூர்வமாக அறிவித்தல் என்ற வினையின் பொருளை dignified, இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τῷ Ἰησοῦ
  choice: இயேசுவில்
  rationale: ἐν என்ற முன்னிடைச்சொல்லை நேரடியாகப் பேணி, உயிர்த்தெழுதல் இயேசுவில் வெளிப்பட்டது, அவரை மையமாகக் கொண்டது, அல்லது அவரது நிகழ்வில் காணப்பட்டது ஆகிய சாத்தியங்களைத் திறந்தவையாக வைக்கிறது.
- source_word: ἀνάστασιν
  choice: உயிர்த்தெழுதலை
  rationale: மரணத்திலிருந்து எழுதல் என்ற புதிய ஏற்பாட்டுச் சொல்லின் பொருளையும் இறையியல் நிறையையும் இயல்பாகத் தருகிறது.
- source_word: τὴν ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: இறந்தவர்களிடையே இருந்து எழுதல் என்ற கிரேக்கச் சொற்றொடரின் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: ἐν τῷ Ἰησοῦ என்பதற்கும் உயிர்த்தெழுதல் அறிவிப்பிற்கும் உள்ள தொடர்பு
  choice: ‘இயேசுவில்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘இயேசுவின் நிகழ்வில் இறந்தோரிலிருந்து உயிர்த்தெழுதலை’ அல்லது ‘இயேசுவின் மூலமாக உயிர்த்தெழுதலை’
  rationale: ἐν என்பது இங்கு இயேசுவின் சொந்த உயிர்த்தெழுதலை எடுத்துக்காட்டாகக் குறிக்கலாம்; அல்லது அவரில் மையங்கொண்ட/அவரில் வெளிப்பட்ட உயிர்த்தெழுதலைக் குறிக்கலாம். முதன்மை உரை இந்தத் தெளிவின்மையைத் தீர்த்துவிடாமல் பேணுகிறது.
- issue: ‘இறந்தோரிலிருந்து உயிர்த்தெழுதல்’ என்பதன் பரப்பு
  choice: இயேசுவின் உயிர்த்தெழுதலையும், அவரில் உறுதிப்படுத்தப்படும் பொதுவான உயிர்த்தெழுதல் நம்பிக்கையையும் அனுமதிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இயேசுவின் உயிர்த்தெழுதலை மட்டும் குறித்ததாகக் கட்டுப்படுத்துதல்
  rationale: கிரேக்க வாசகம் இவ்விரு தொடர்புகளையும் ஒலிக்கச் செய்யக்கூடும்; மொழிபெயர்ப்பு அதன் பொருளைத் தேவையின்றி குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. முந்தைய வசனத்துடன் இலக்கண ரீதியாக இணைந்துள்ள கிரேக்கப் பங்கேற்பு வடிவம், தனிவசன வாசிப்பில் தெளிவாக இருக்கத் தமிழில் முழுமையான இறந்தகால வாக்கியமாக வழங்கப்பட்டுள்ளது.
