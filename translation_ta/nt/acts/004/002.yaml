  - marker: a
    text: அல்லது, “இயேசுவின் விஷயத்தில் இறந்தோரிலிருந்து உயிர்த்தெழுதலை அறிவித்ததாலும்.” “இயேசுவில்” என்ற கிரேக்கச் சொற்றொடர், இயேசு தாமே உயிர்த்தெழுந்ததில் வெளிப்பட்ட உயிர்த்தெழுதலைக் குறிப்பாகச் சுட்டலாம்.
