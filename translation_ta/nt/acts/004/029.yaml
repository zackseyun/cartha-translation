id: ACT.4.29
reference: Acts 4:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: ta
  text: இப்போது, ஆண்டவரே, அவர்களுடைய மிரட்டல்களைக் கவனித்து, உமது வார்த்தையை முழுத் துணிவோடு பேச உமது ஊழியர்களுக்கு அருளும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: இப்போதும்
  rationale: செபத்தில் முன் கூறியவற்றிலிருந்து தற்போதைய வேண்டுதலுக்கு நகர்த்தும் இயல்பான தமிழ்த் தொடராக உள்ளது; ‘இப்போது’ என்ற காலப்பொருளையும் இணைப்பையும் காக்கிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: கடவுளை நேரடியாக அழைக்கும் செப மொழிக்கு ஏற்ற, மரியாதையும் இயல்பும் கொண்ட வழக்கமான தமிழ் வடிவம்.
- source_word: ἔπιδε ἐπὶ
  choice: கவனித்து
  rationale: இது வெறுமனே பார்ப்பதை அல்ல, மிரட்டல்களைக் கடவுள் நோக்கிக் கருத்தில் கொள்ள வேண்டும் என்ற வேண்டுதலைக் குறிக்கிறது.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: அவர்களுடைய மிரட்டல்களை
  rationale: பன்மையையும் உடைமைத் தொடர்பையும் தெளிவாகக் காக்கும் நேரடியான நவீனத் தமிழ்.
- source_word: δὸς
  choice: அருளும்
  rationale: சொற்பொருளில் ‘கொடும்’ என்றாலும், திறனளிக்குமாறு கடவுளிடம் கேட்கும் செபச் சூழலில் ‘அருளும்’ இயல்பான, கண்ணியமான வேண்டுதல் வடிவம்.
- source_word: τοῖς δούλοις σου
  choice: உமது ஊழியர்களுக்கு
  rationale: δοῦλος எஜமானுக்குச் சொந்தமான அடிமை அல்லது பணியாளர் என்ற வலுவான கீழ்ப்படிதல் உறவைக் குறிக்கலாம். இச்செபச் சூழலில் கடவுளுக்குப் பணிபுரியும் நிலை முன்னிலைப்படுவதால் ‘ஊழியர்கள்’ இயல்பாக உள்ளது; வலுவான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μετὰ παρρησίας πάσης
  choice: முழுத் துணிவோடு
  rationale: παρρησία குறிக்கும் அச்சமற்ற வெளிப்படையான பேச்சையும் πάσης தரும் முழுமையான வலியுறுத்தலையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: λαλεῖν τὸν λόγον σου
  choice: உமது வார்த்தையை ... பேச
  rationale: λαλεῖν என்பதன் எளிய ‘பேசுதல்’ பொருளையும் λόγος என்பதன் வேதாகமச் சொல்வழக்கையும் காக்கிறது; ‘அறிவிக்க’ என்று தேவைக்கு அதிகமாக விளக்கவில்லை.
theological_decisions:
- issue: கடவுளோடு உள்ள உறவில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: உமது ஊழியர்கள்
  alternative: உமது அடிமைகள்
  rationale: மூலச்சொல் சொந்தத்தையும் முழுக் கீழ்ப்படிதலையும் குறிக்கக்கூடியது. ஆயினும் இங்கு செபத்தில் கடவுளுக்குப் பணிபுரிவதே முன்னிலையாக இருப்பதால் பிரதான உரையில் ‘ஊழியர்கள்’ தேர்ந்தெடுக்கப்பட்டது; ‘அடிமைகள்’ என்ற வலுவான சாத்தியம் மறைக்கப்படாமல் அடிக்குறிப்பில் வைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான செப நடையில் மொழிபெயர்க்கப்பட்டது. ‘உமது’, ‘அருளும்’ ஆகியவை மரியாதைத் தொனியைத் தருகின்றன; பழமையான அல்லது மிகச் சமயவழக்கான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
