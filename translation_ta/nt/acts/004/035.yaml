  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: ta
  text: 'அதை[b] அப்போஸ்தலர்களின் காலடியில்[a] வைத்து வந்தார்கள்; ஒவ்வொருவருக்கும் அவரவர் தேவைக்கேற்ப அது பகிர்ந்தளிக்கப்பட்டு வந்தது.


    [a] அல்லது, “அப்போஸ்தலர்களின் முன்.” கிரேக்க மூலத்தில் சொல்லுக்குச் சொல், “அப்போஸ்தலர்களின் காலடியில்” என்று உள்ளது. விற்றவற்றின் தொகையை அப்போஸ்தலர்களின் பொறுப்பில் ஒப்படைத்த காட்சியை இது தக்கவைக்கிறது.


    [b] “அதை” என்பதும் “அது” என்பதும் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட, விற்கப்பட்டவற்றிலிருந்து கிடைத்த தொகையைக் குறிக்கின்றன; கிரேக்க மூலத்தில் இவை வெளிப்படையாகச் சொல்லப்படாமல் குறிப்பால் உணர்த்தப்படுகின்றன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்போஸ்தலர்களின் முன்.” கிரேக்க மூலத்தில் சொல்லுக்குச் சொல், “அப்போஸ்தலர்களின் காலடியில்” என்று உள்ளது. விற்றவற்றின் தொகையை அப்போஸ்தலர்களின் பொறுப்பில் ஒப்படைத்த காட்சியை இது தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அதை” என்பதும் “அது” என்பதும் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட, விற்கப்பட்டவற்றிலிருந்து கிடைத்த தொகையைக் குறிக்கின்றன; கிரேக்க மூலத்தில் இவை வெளிப்படையாகச் சொல்லப்படாமல் குறிப்பால் உணர்த்தப்படுகின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: வைத்து வந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை, தொடர்ந்து அல்லது வழக்கமாக நடைபெற்ற செயலைக் காட்டுகிறது; “வைத்து வந்தார்கள்” அந்த வினைநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: அப்போஸ்தலர்களின் காலடியில்
  rationale: இது அதிகாரத்தின்கீழ் அல்லது பொறுப்பில் ஒப்படைப்பதைக் குறிக்கும் மரபுத்தொடராக இருந்தாலும், மூலத்தின் நேரடியான காட்சியையும் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: διεδίδετο
  choice: பகிர்ந்தளிக்கப்பட்டு வந்தன
  rationale: முற்றுப்பெறாத இறந்தகாலச் செயப்பாட்டு வடிவம் தொடர்ந்து நடந்த பகிர்ந்தளிப்பைக் காட்டுகிறது. முந்தைய வசனத்திலிருந்து உணரப்படும் தொகைகளைச் சுட்டும் “அவை” என்பதோடு தமிழில் பன்மை இசைவு பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἑκάστῳ
  choice: ஒவ்வொருவருக்கும்
  rationale: தனித்தனி நபர்களுக்கு அளிக்கப்பட்டது என்ற பகிர்வு வலிமையைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: அவரவர் தேவைக்கேற்ப
  rationale: ஒவ்வொரு நபரின் தேவைக்கு ஏற்ப பகிர்ந்தளிக்கப்பட்டது என்ற விகித அல்லது பொருத்தக் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τις
  choice: அவரவர்
  rationale: குறிப்பிட்ட பாலினத்தைச் சுட்டாமல், பொதுவாக எந்த நபரையும் குறிக்கும் தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: χρείαν
  choice: தேவை
  rationale: தேவை அல்லது இன்றியமையாமை என்ற பொருளில் இங்கு “தேவை” தெளிவான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: வைக்கப்பட்டதும் பகிர்ந்தளிக்கப்பட்டதும் எது என்பதை வெளிப்படையாகக் கூறுவதா
  choice: முந்தைய வசனத்தைச் சார்ந்துள்ள மூலத்தின் குறிப்புணர்த்தலைத் தக்கவைத்து, தமிழின் வாசிப்புத் தெளிவுக்காக “அவற்றை/அவை” என்ற சுட்டுப்பெயர்களை மட்டும் பயன்படுத்துதல்
  alternative: “பணம்” அல்லது “விற்றவற்றிலிருந்து கிடைத்த தொகை” என்று வசனத்திலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் சொல்லப்படாமல் முந்தைய வசனத்திலிருந்து உணரப்படுகிறது. சுட்டுப்பெயர்கள் மூலம் இதைத் தக்கவைப்பது வாசிப்பை இயல்பாக்குவதோடு, மூலத்தைவிட அதிகமான பொருள் விளக்கத்தையும் சேர்க்காமல் இருக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. தொடர்ச்சியான செயல்களை “வைத்து வந்தார்கள்,” “பகிர்ந்தளிக்கப்பட்டு வந்தன” எனக் காட்டி, மூலத்தின் முற்றுப்பெறாத இறந்தகால வினைநிலையைப் பாதுகாக்கிறது.
