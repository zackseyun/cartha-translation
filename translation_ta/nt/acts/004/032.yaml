source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: ta
  text: நம்பிக்கை கொண்டிருந்த பெருந்திரளான மக்கள் ஒரே இருதயமும் ஒரே உள்ளமும் உடையவர்களாயிருந்தார்கள்[a]. அவர்களில் ஒருவர்கூடத் தனக்குச் சொந்தமான எதையும் தன்னுடையது என்று சொல்லவில்லை[b]; மாறாக, எல்லாம் அவர்களுக்குப் பொதுவாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் கருத்துவழியாக, “அவர்கள் மனதிலும் நோக்கத்திலும் ஒன்றுபட்டிருந்தார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “தனக்கு,” “தன்னுடையது” என்ற ஒருமை வடிவங்கள், ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் கிரேக்க ஒருமையைப் பிரதிபலிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: பெருந்திரளான மக்கள்
  rationale: ஒரு பெரிய எண்ணிக்கையிலான மக்களைக் குறிக்கும் πλῆθος என்பதன் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῶν πιστευσάντων
  choice: நம்பிக்கை கொண்டிருந்த
  rationale: πιστεύω என்பதன் வினைத் தன்மையையும், விவரிக்கப்படும் நிலைக்கு முன்பே அவர்கள் நம்பிக்கை கொண்டிருந்ததையும் காட்டுகிறது.
- source_word: καρδία καὶ ψυχὴ μία
  choice: ஒரே இருதயமும் ஒரே உள்ளமும் உடையவர்களாய்
  rationale: ஆழ்ந்த உள்ளார்ந்த ஒற்றுமையைக் குறிக்கும் மூலமொழியின் இரு பெயர்ச்சொற்களையும் காத்து, தமிழில் புரியத்தக்க மரியாதையான சொற்றொடராக வழங்குகிறது.
- source_word: οὐδὲ εἷς
  choice: ஒருவர்கூட
  rationale: ஒருவரும் விதிவிலக்கல்ல என்ற வலியுறுத்தலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: தனக்குச் சொந்தமான எதையும்
  rationale: ஒருவரிடம் உள்ள உடைமைகளைக் குறிக்கும் கிரேக்கத் தொடரின் பகிர்ந்தளிக்கும் ஒருமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: தன்னுடையது என்று சொல்லவில்லை
  rationale: தனிப்பட்ட உரிமைக் கோரிக்கையை விவரிக்கும் மூலவாக்கியத்திற்கு நெருக்கமாக உள்ளது; பின்னாளைய பொருளாதாரக் கருத்துகளை இதில் புகுத்தவில்லை.
- source_word: πάντα κοινά
  choice: எல்லாம் அவர்களுக்குப் பொதுவாக இருந்தன
  rationale: கிரேக்கத்தின் இணைப்புவினை அமைப்பையும், உடைமைகள் சமூகத்தினருக்குப் பொதுவாக இருந்ததையும் காக்கிறது.
theological_decisions:
- issue: எருசலேம் விசுவாசிகளிடையே உடைமைகள் பொதுவாக இருந்தமை
  choice: தனிப்பட்ட உடைமைகளைத் தமக்கே உரியவை என்று யாரும் வலியுறுத்தாமல், அனைத்தும் சமூகத்தினருக்குப் பொதுவாக இருந்ததாக விளக்கமாக மொழிபெயர்க்கப்பட்டது.
  alternative: அவர்கள் அனைத்தையும் கூட்டாகச் சொந்தமாக வைத்திருந்தார்கள் என்ற வலுவான அமைப்புசார் வாசிப்பு; அல்லது பகிர்ந்த உடைமையின் தன்மையைக் குறைத்துக் காட்டும் தனிநபர்மைய வாசிப்பு.
  rationale: மூலமொழி தனியுரிமைக் கோராமையையும் பொதுவான பயன்பாடு அல்லது உடைமை நிலையையும் ஒன்றாகக் கூறுகிறது. ஆகவே பிற்கால அரசியல், பொருளாதார அல்லது திருச்சபை அமைப்பு எதையும் வசனத்தில் புகுத்தாமல் அந்த இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “இருதயம்,” “உள்ளம்” என்ற இரட்டைக் கூறு மூலமொழியின் உருவகத்தையும் உள்ளார்ந்த ஒற்றுமையையும் காக்கிறது; “மாறாக” என்பது இரு கூறுகளுக்கிடையிலான தெளிவான எதிர்மறை மாற்றத்தை வெளிப்படுத்துகிறது.
