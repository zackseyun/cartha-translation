  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: ta
  text: தனக்குச் சொந்தமாக ஒரு வயல் இருந்த அவர், அதை விற்று, அந்தப் பணத்தைக் கொண்டுவந்து அப்போஸ்தலர்களின் காலடியில் வைத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: தனக்குச் சொந்தமான ஒரு வயல் இருந்ததால்
  rationale: இந்த genitive absolute பின்னணிச் சூழ்நிலையைத் தருகிறது. உடைமையைக் குறிக்கும் இயல்பான நவீனத் தமிழாக இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது; காரணச் சாயலை முற்றிலும் கட்டாயப்படுத்தாமல் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀγροῦ
  choice: ஒரு வயல்
  rationale: ἀγρός என்பது வயல் அல்லது நிலப்பகுதியைக் குறிக்கலாம். இங்கு நேரடியும் இயல்புமான தெரிவாக ‘வயல்’ பயன்படுத்தப்படுகிறது.
- source_word: πωλήσας
  choice: அதை விற்று
  rationale: Aorist participle முதன்மை வினைகளுக்கு முந்திய செயலைக் குறிக்கிறது. ‘அதை விற்று’ என்பது அந்த வரிசையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἤνεγκεν
  choice: கொண்டுவந்து
  rationale: φέρω இச்சூழலில் ஒன்றை எடுத்துக்கொண்டு வந்து ஒப்படைப்பதைக் குறிக்கிறது. ‘கொண்டுவந்து’ தமிழில் இயல்பாக அந்த இயக்கத்தை வெளிப்படுத்துகிறது.
- source_word: τὸ χρῆμα
  choice: அந்தப் பணத்தை
  rationale: χρῆμα இங்கு விற்பனையில் கிடைத்த பணத்தைக் குறிக்கிறது. ‘அந்தப் பணம்’ நேரடியான மொழிபெயர்ப்பு; ‘விற்றுக் கிடைத்த தொகை’ என்பது விளக்கமான மாற்று.
- source_word: ἔθηκεν
  choice: வைத்தார்
  rationale: τίθημι என்பது வைப்பதைக் குறிக்கிறது. காலடியில் வைக்கும் காட்சியுடன் ‘வைத்தார்’ இயல்பாகப் பொருந்துகிறது.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: அப்போஸ்தலர்களின் காலடியில்
  rationale: கிரேக்கத்தின் தெளிவான உடல் சார்ந்த காட்சியை இது பாதுகாக்கிறது; வெறுமனே ‘அப்போஸ்தலர்களிடம் கொடுத்தார்’ என்று பொருளை மட்டும் கூறவில்லை.
theological_decisions:
- issue: பணத்தை அப்போஸ்தலர்களின் அதிகாரத்திற்கும் நிர்வாகத்திற்கும் ஒப்படைக்கும் உடல் சார்ந்த சொற்றொடரைப் பாதுகாப்பதா
  choice: ‘அப்போஸ்தலர்களின் காலடியில் வைத்தார்’ என்ற தெளிவான காட்சி தக்கவைக்கப்பட்டது.
  alternative: ‘அப்போஸ்தலர்களிடம் கொடுத்தார்’ என்று பொருளை மட்டும் கூறுதல்.
  rationale: இவ்வசனம் நிகழ்ந்த செயலைக் காட்சிப்படுத்துவதோடு, கொடை அவர்களுடைய மேற்பார்வைக்கு ஒப்படைக்கப்பட்டதையும் உணர்த்துகிறது. மூலத்தின் சொற்றொடரைத் தக்கவைப்பது கூடுதல் திருச்சபைத் தத்துவக் கருத்துகளைச் சேர்க்காமல் இரு அம்சங்களையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலர்கள்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது. மரியாதை ஒருமை வினைமுற்றுகள் சூழலுக்கு ஏற்றவாறு பயன்படுத்தப்பட்டுள்ளன.
