source:
  edition: SBLGNT
  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: ta
  text: அப்போஸ்தலர்கள் மிகுந்த வல்லமையோடு ஆண்டவராகிய இயேசுவின் உயிர்த்தெழுதலைக் குறித்துத் தொடர்ந்து சாட்சி அளித்துவந்தார்கள்; மேலும், அவர்கள் அனைவர்மீதும் மிகுந்த தயவு இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அனைவர்மீதும் மிகுந்த அருள் இருந்தது.” χάρις என்ற கிரேக்கச் சொல் “அருள்” அல்லது “தயவு” என்று பொருள்படலாம்; இங்கு அது கடவுளின் அருள்மிகு பிரசன்னத்தையும் விசுவாசிகள்மீது இருந்த சாதகமான பார்வையையும் ஒருங்கே உள்ளடக்கியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: மிகுந்த வல்லமையோடு
  rationale: கருவி அல்லது விதத்தைக் குறிக்கும் வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. லூக்கா–அப்போஸ்தலர் நூல்களில் δύναμις கொண்டுள்ள ஆவியால் அருளப்படும் வல்லமை மற்றும் செயல்திறன் ஆகிய கருத்துகளை, அற்புதங்களை மட்டும் குறிப்பதாகச் சுருக்காமல் காக்கிறது.
- source_word: ἀπεδίδουν
  choice: தொடர்ந்து ... அளித்துவந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் அப்போஸ்தலர்களின் சாட்சி அளித்தல் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயல் என்பதை வெளிப்படுத்துகிறது.
- source_word: τὸ μαρτύριον
  choice: சாட்சி
  rationale: μαρτύριον என்பதன் சான்றுரை அல்லது சாட்சி என்ற பொருளை, ‘சாட்சி அளித்தல்’ என்ற இயல்பான தமிழ்ச் சொற்றொடரில் தருகிறது. கிரேக்கத்தின் குறிப்புச் சுட்டை தமிழில் தனியே வெளிப்படுத்த வேண்டியதில்லை.
- source_word: τῆς ἀναστάσεως
  choice: உயிர்த்தெழுதலைக் குறித்து
  rationale: μαρτύριον என்பதோடு வரும் பிறப்புவேற்றுமை சாட்சியின் உள்ளடக்கத்தைக் குறிப்பதாக இயல்பாகப் புரிகிறது; அதைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ஆண்டவராகிய இயேசுவின்
  rationale: κύριος என்பதை மரியாதையும் கிறிஸ்தவப் பயன்பாட்டின் தொடர்ச்சியும் கொண்ட ‘ஆண்டவர்’ என வழங்குகிறது; ‘ஆகிய’ தமிழில் இயேசுவை ஆண்டவர் என அடையாளப்படுத்தும் இயல்பான இணைப்பை உருவாக்குகிறது.
- source_word: χάρις
  choice: தயவு
  rationale: χάρις இங்கு இறைவனுடைய அருளையோ மக்களின் நன்மதிப்பையோ அல்லது இரண்டையும் உள்ளடக்கிய பரந்த சாதக நிலைப்பாட்டையோ குறிக்கலாம். ‘தயவு’ அந்த மூலத் தெளிவின்மையை ஓரளவு காக்கிறது; மாற்றுப் பொருளாக ‘அருள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τε
  choice: ;
  rationale: இரண்டாம் கூற்றை முதலாவதுடன் மென்மையாக இணைக்கும் τε-யின் பணியை, தமிழில் நீளமான இணைப்புச் சொல் சேர்க்காமல் அரைப்புள்ளி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ πάντας αὐτούς
  choice: அவர்கள் அனைவர்மீதும்
  rationale: ἐπί-யின் ‘மேல் நிலவுதல்’ என்ற உருவகத்தையும் சமூகத்திலுள்ள ஒவ்வொருவரையும் உள்ளடக்கும் πάντας என்பதன் வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: χάρις என்பதன் சூழல்சார் பொருள்
  choice: முழுச் சமூகத்தின்மீதும் இருந்த மிகுந்த தயவு
  alternative: மிகுந்த அருள்; அல்லது மக்களிடமிருந்து கிடைத்த நன்மதிப்பு
  rationale: χάρις எங்கிருந்து வந்தது என்பதை வசனம் குறிப்பிடவில்லை. அது கடவுளின் அருள்மிகு பிரசன்னத்தையோ மக்களின் சாதகமான பார்வையையோ இரண்டையும் சேர்ந்தோ குறிக்கலாம். முதன்மை உரையில் ‘தயவு’ என்றும் அடிக்குறிப்பில் ‘அருள்’ என்றும் தருவது இந்த இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘தொடர்ந்து ... அளித்துவந்தார்கள்’ என்பது கிரேக்க இறந்தகாலத் தொடர்நிலையைத் தெளிவாக்குகிறது. χάρις என்பதிலுள்ள மூலத் தெளிவின்மை முதன்மை உரை மற்றும் அடிக்குறிப்பு மூலம் பாதுகாக்கப்பட்டுள்ளது.
