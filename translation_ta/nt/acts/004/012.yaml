source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: ta
  text: வேறு எவரிலும் மீட்பு இல்லை; ஏனெனில், வானத்தின் கீழ் மனிதர்களிடையே கொடுக்கப்பட்ட, நாம் மீட்கப்பட வேண்டிய வேறொரு பெயர் இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωτηρία
  choice: மீட்பு
  rationale: இச்சூழலில் உடனடியான விடுவிப்பையும் இயேசுவின் இரட்சிக்கும் பங்கைச் சார்ந்த விரிவான பொருளையும் தாங்கக்கூடிய இயல்பான தமிழ் சொல்.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: வேறு ஒருவரிலும்
  rationale: வேறு எந்த நபரிடமும் மீட்பு இல்லை என்ற கிரேக்கத்தின் தனிநபர் சார்ந்த விலக்கற்ற கூற்றைத் தக்கவைக்கிறது.
- source_word: ὄνομα
  choice: பெயர்
  rationale: நபர், அதிகாரம், வெளிப்படுத்தப்பட்ட அடையாளம் ஆகிய பொருள் வளங்களை விளக்கவுரையால் குறுக்காமல், மூல உருவகத்தையே தக்கவைக்கிறது.
- source_word: ἕτερον
  choice: வேறொரு
  rationale: மறுப்புக் கட்டமைப்பில் வேறு எந்தப் பெயரும் இல்லை என்ற தனித்துவத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: வானத்தின் கீழ்
  rationale: உலகளாவிய மனிதப் பரப்பைக் குறிக்கும் வேதாகம மரபுத்தொடரையும் அதன் கண்ணியமான தொனியையும் காக்கிறது.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: மனிதர்களிடையே கொடுக்கப்படவில்லை
  rationale: ἐν என்பதன் ‘மனிதகுலத்தின் நடுவில்/மத்தியில்’ என்ற கருத்தைத் தக்கவைத்து, ἀνθρώποις எல்லா மனிதர்களையும் பொதுவாகக் குறிப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν ᾧ
  choice: அதன் வழியாக
  rationale: பெயரை முன்னிலைத் தொடர்பாக எடுத்துக்கொண்டு, மீட்பின் வழிமுறையைக் காட்டும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: தேவையான கட்டாயத்தைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: σωθῆναι
  choice: மீட்கப்பட
  rationale: செயப்பாட்டு வினை வடிவத்தைக் காத்து, முன்னர் வரும் σωτηρία என்பதுடன் சொல்லியல் ஒத்திசைவைப் பேணுகிறது.
theological_decisions:
- issue: இயேசுவைச் சார்ந்த மீட்பின் தனித்துவம்
  choice: “வேறு ஒருவரிலும் மீட்பு இல்லை” என்று நிபந்தனையற்ற தனித்துவக் கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: “மீட்புக்கு வேறு வழி இல்லை” என்று பொதுமைப்படுத்துதல்.
  rationale: கிரேக்கம் வேறு ஒருவரில் மீட்பு இல்லை என்று நேரடியாகக் கூறி, வேறொரு பெயர் இல்லை என்பதால் அதை நிறுவுகிறது; கூடுதல் கோட்பாட்டு விளக்கமின்றி அந்த இறையியல் அழுத்தம் காக்கப்படுகிறது.
- issue: ἀνθρώποις என்பதன் பொதுப்பொருள்
  choice: “மனிதர்களிடையே”
  alternative: “மனிதருக்குக் கொடுக்கப்பட்ட”
  rationale: இச்சொல் ஆண்களை மட்டும் அல்லாமல் மனிதகுலம் முழுவதையும் பொதுவாகக் குறிக்கிறது; தமிழில் “மனிதர்கள்” அதனைத் துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- issue: ἐν ᾧ மற்றும் ‘பெயர்’ இடையிலான தொடர்பு
  choice: தமிழ் தொடரில் பெயரே மீட்பின் வழியாக இருப்பதைத் தெளிவாக வைத்தல்.
  alternative: பெயரை ‘நபர்’ அல்லது ‘அதிகாரம்’ என்று விளக்கிப் பெயர்த்தல்.
  rationale: மூலத்தில் உள்ள ‘பெயர்’ என்ற இறையியல் செறிவைத் தக்கவைத்து, அதன் வழியாக மீட்கப்பட வேண்டும் என்ற கருவிப் பொருளை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான அறிவிப்பு நடை. ‘இரட்சிப்பு’ என்பதற்குப் பதில் பரந்தும் இயல்பாகவும் புரியக்கூடிய ‘மீட்பு’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு தேவைப்படும் உண்மையான மாற்றுப் பொருள் இவ்வசனத்தில் இல்லை.
