  revised_text: வேறு எவரிலும் மீட்பு இல்லை; ஏனெனில், வானத்தின் கீழ் மனிதர்களிடையே கொடுக்கப்பட்ட, நாம் மீட்கப்பட வேண்டிய வேறொரு பெயர் இல்லை.
