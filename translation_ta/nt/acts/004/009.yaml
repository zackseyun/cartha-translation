id: ACT.4.9
reference: Acts 4:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: ta
  text: ஒரு பலவீனமான மனிதருக்குச் செய்யப்பட்ட நற்செயலைக் குறித்து, இவர் எதனால் குணமடைந்தார் என்பதைக் குறித்து இன்று நாங்கள் விசாரிக்கப்படுகிறோம் என்றால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: விசாரிக்கப்படுகிறோம்
  rationale: இந்த வினைச்சொல் நீதித்துறை அல்லது அதிகாரபூர்வ விசாரணையைக் குறிக்கக்கூடும். ‘விசாரிக்கப்படுகிறோம்’ என்பது சட்டரீதியான சூழலை உணர்த்துகிறது; அதேவேளையில் ‘வழக்குக்கு உட்படுத்தப்படுகிறோம்’ என்று அளவுக்கு மீறிக் குறிப்பாக்குவதில்லை.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: நற்செயலைக் குறித்து
  rationale: ἐπί + வேற்றுமை இங்கு விசாரணைக்கான அடிப்படை அல்லது சந்தர்ப்பத்தைச் சுட்டுகிறது; εὐεργεσία நன்மை பயக்கும் செயலைக் குறிக்கிறது. இந்தத் தேர்வு, நன்மை செய்ததற்காக அவர்கள் விசாரிக்கப்படுவதிலுள்ள முரணையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: நோயுற்ற ஒரு மனிதருக்குச் செய்யப்பட்ட
  rationale: இந்த மரபுத்தொடர் நற்செயலின் பயனாளியை அடையாளப்படுத்துகிறது. சூழலில் உடல் பலவீனம் அல்லது குறைபாடு கருத்தில் இருப்பதால் ‘நோயுற்ற’ என்பது இயல்பான பொதுப்பொருளைத் தருகிறது; குறிப்பிட்ட குறைபாட்டை கிரேக்கத்தை விட அதிகமாக விவரிப்பதில்லை.
- source_word: ἐν τίνι
  choice: எதனால்
  rationale: ἐν + வினாப்பெயர் இங்கு வழி, கருவி அல்லது செயலாற்றும் காரணத்தைக் குறிக்கலாம். அடுத்த வசனம் இயேசுவைச் சுட்டினாலும், இவ்வசனத்தின் கிரேக்க வடிவம் ‘யாரால்’ என்பதைக் காட்டிலும் விரிவானது; எனவே ‘எதனால்’ அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: σέσωσται
  choice: குணமடைந்தார்
  rationale: σῴζω என்பதற்கு காப்பாற்றுதல், இரட்சித்தல், நலமாக்குதல், குணமாக்குதல் ஆகிய பொருள்கள் உண்டு. உடல் குறைபாட்டிலிருந்து மீண்ட மனிதரே உடனடி சூழலில் குறிப்பிடப்படுவதால் ‘குணமடைந்தார்’ முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது; பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: குணப்படுத்தப்பட்ட சூழலில் σέσωσται (σῴζω) என்பதன் மொழிபெயர்ப்பு
  choice: குணமடைந்தார்
  alternative: காப்பாற்றப்பட்டார்; நலமடைந்தார்
  rationale: உடனடி கதைச்சூழல் முன்பு நடக்க முடியாதிருந்த மனிதரின் உடல் மீட்சியைப் பற்றியது; ஆகவே குணமடைதல் முதன்மை. எனினும் σῴζω இரட்சிப்பு அல்லது காப்பாற்றுதல் என்ற பொருளையும் தாங்குவதால், அந்த இறையியல் ஒலியை முதன்மை உரையில் முற்றிலும் மறைக்காமல் அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘எதனால்’ என்பது மூலத்தின் வழி/கருவி சார்ந்த தெளிவின்மையைப் பாதுகாக்கிறது; ‘யாரால்’ என்று முன்கூட்டியே தீர்மானிக்கவில்லை.
