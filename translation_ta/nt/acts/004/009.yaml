revisions:
- from: நோயுற்ற ஒரு மனிதருக்குச் செய்யப்பட்ட நற்செயலைக் குறித்து—இவர் எதனால் குணமடைந்தார் என்று—இன்று நாங்கள் விசாரிக்கப்படுகிறோம் என்றால்,[a]
  to: ஒரு பலவீனமான மனிதருக்குச் செய்யப்பட்ட நற்செயலைக் குறித்து, இவர் எதனால் குணமடைந்தார் என்பதைக் குறித்து இன்று நாங்கள் விசாரிக்கப்படுகிறோம் என்றால்,
