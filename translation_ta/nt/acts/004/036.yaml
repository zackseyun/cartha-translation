source:
  edition: SBLGNT
  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: ta
  text: அப்போஸ்தலர்களால் பர்னபா என்று அழைக்கப்பட்ட யோசேப்பு—இந்தப் பெயரை மொழிபெயர்த்தால், “ஊக்குவிப்பின் மகன்”[a] என்று பொருள்—லேவியரும், பிறப்பால் சைப்பிரஸைச் சேர்ந்தவருமாவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறிவுறுத்தலின் மகன்,” “ஆறுதலின் மகன்,” அல்லது “தேற்றுதலின் மகன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஊக்குவித்தல், வலியுறுத்தி அறிவுறுத்துதல், ஆறுதல் அளித்தல் ஆகிய பொருட்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவம்.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான உரைமாற்றத்தைக் குறிக்கிறது; தமிழில் வாக்கிய அமைப்பே அந்த மாற்றத்தை இயல்பாக உணர்த்துவதால், ‘இப்போது’ அல்லது வலுவான எதிர்மறை இணைப்பைச் சேர்க்கவில்லை.
- source_word: ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: அப்போஸ்தலர்களால் பர்னபா என்று அழைக்கப்பட்ட
  rationale: ἀπό பெயரிடலின் மூலத்தைச் சுட்டுகிறது; தமிழ் செயப்பாட்டு அமைப்பு அப்போஸ்தலர்களே இந்தப் பெயரால் அழைத்தனர் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: இந்தப் பெயரை மொழிபெயர்த்தால் … என்று பொருள்
  rationale: செமித்தியப் பெயருக்கு லூக்கா தரும் விளக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: υἱὸς παρακλήσεως
  choice: ஊக்குவிப்பின் மகன்
  rationale: παράκλησις என்பதன் ஊக்குவித்தல், அறிவுறுத்துதல், ஆறுதல் ஆகிய பரந்த பொருள் வரம்பில் பொதுவாகப் புரியக்கூடிய பொருளை முதன்மை உரையில் பயன்படுத்துகிறது; மற்ற நுணுக்கங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: Λευίτης
  choice: லேவியர்
  rationale: லேவி கோத்திரத்தையும் அதனுடன் தொடர்புடைய சமய-இன அடையாளத்தையும் சுருக்கமாகவும் நிலைபெற்ற தமிழிலும் குறிக்கிறது.
- source_word: Κύπριος τῷ γένει
  choice: பிறப்பால் சைப்பிரஸ் நாட்டைச் சேர்ந்தவர்
  rationale: τῷ γένει குறிக்கும் பிறப்பு அல்லது பூர்வீகத் தோற்றத்தைத் தெளிவாக வெளிப்படுத்துகிறது; வெறும் வசிப்பிடமாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: παρακλήσεως என்பதன் பொருள் வரம்பு
  choice: முதன்மை உரையில் ‘ஊக்குவிப்பின்’
  alternative: ‘அறிவுறுத்தலின்,’ ‘ஆறுதலின்,’ அல்லது ‘தேற்றுதலின்’
  rationale: இந்தச் சொல் ஊக்குவித்தல், வலியுறுத்தி அறிவுறுத்துதல், ஆறுதல் அளித்தல் ஆகிய பொருட்களைக் கொண்டிருக்க முடியும். வசனம் ஒரே நுணுக்கத்தைத் தீர்மானிக்காததால், பரந்த பொருள் முதன்மை உரையிலும் மாற்றுப் பொருட்கள் அடிக்குறிப்பிலும் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியம் அடுத்த வசனத்தில் தொடர்ந்தாலும், தமிழில் வாசிப்புத் தெளிவுக்காக இவ்வசனம் பெயரெச்சத் தகவல் கொண்ட முழு வாக்கியமாக அமைக்கப்பட்டுள்ளது. பெயரின் பொருளை விளக்கும் இடைச்செருகல் நீள்கோடுகளால் குறிக்கப்பட்டுள்ளது.
