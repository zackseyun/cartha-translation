  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: ta
  text: அவர்கள் வேண்டிக்கொண்டபின், அவர்கள் ஒன்றுகூடியிருந்த[a] இடம் அதிர்ந்தது. அவர்கள் அனைவரும் பரிசுத்த ஆவியால் நிரப்பப்பட்டு, கடவுளுடைய வார்த்தையைத் துணிவுடன்[b] பேசிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் கூடியிருந்த.’ கிரேக்கச் சொற்றொடர் அவர்கள் ஒன்றுகூடிய நிலையில் இருந்ததை விவரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நம்பிக்கையுடன்’ அல்லது ‘அச்சமின்றி வெளிப்படையாக.’ இச்சொல் ஒளிவுமறைவற்ற, அஞ்சாத பேச்சைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: அவர்கள் வேண்டிக்கொண்டபின்
  rationale: இறந்தகாலப் பங்கேற்புவினையுடன் அமைந்த தனி ஆறாம் வேற்றுமைத் தொடர், முதன்மை நிகழ்வுக்கு முன் நடந்த கூட்டுப் பிரார்த்தனையை காலப் பின்னணியாகக் காட்டுகிறது. ‘வேண்டிக்கொண்டபின்’ என்பது δέομαι என்பதன் மன்றாட்டு நுணுக்கத்தையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: ἐσαλεύθη
  choice: அதிர்ந்தது
  rationale: செயப்பாட்டு இறந்தகால வடிவம் அந்த இடம் உடலளவில் அசைக்கப்பட்டதைச் சொல்கிறது. ‘அதிர்ந்தது’ என்பது நிகழ்வின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: அவர்கள் ஒன்றுகூடியிருந்த இடம்
  rationale: ἦσαν உடன் வரும் நிறைவுப் பங்கேற்புவினை, அவர்கள் கூடிவிட்ட நிலையில் அங்கே இருந்ததைச் சுட்டுகிறது. ‘ஒன்றுகூடியிருந்த’ அந்த நிலையைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἐπλήσθησαν ἅπαντες τοῦ ἁγίου πνεύματος
  choice: அவர்கள் அனைவரும் பரிசுத்த ஆவியால் நிரப்பப்பட்டு
  rationale: ἐπλήσθησαν என்பதன் செயப்பாட்டு வடிவத்தையும் ἅπαντες வலியுறுத்தும் முழுக் குழுவையும் இவ்வாக்கியம் காக்கிறது. தமிழ் மரபில் ‘பரிசுத்த ஆவியால் நிரப்பப்பட்டு’ என்பது ஆவியால் நிறைவுறுதலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐλάλουν
  choice: பேசிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறா இறந்தகாலம் தொடர்ந்த செயலைக் காட்டுவதால், ஒரு கணநேரச் செயல் அல்லது ‘பேசத் தொடங்கினார்கள்’ என்ற தொடக்க நுணுக்கத்தைச் சேர்க்காமல் நீடித்த பேச்சை இவ்வடிவம் வெளிப்படுத்துகிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தையை
  rationale: லூக்காவின் பயன்பாட்டில் இது அறிவிக்கப்படும் கடவுளின் செய்தியைக் குறிக்கும் நிலையான சொற்றொடர். ‘வார்த்தை’ அதன் வேதாகம மற்றும் இறையியல் செறிவைக் காக்கிறது.
- source_word: μετὰ παρρησίας
  choice: துணிவுடன்
  rationale: παρρησία இங்கு அச்சமற்ற, வெளிப்படையான அறிவிப்பைக் குறிக்கிறது. ‘துணிவுடன்’ என்பது அதன் மையப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: பரிசுத்த ஆவியால் நிரப்பப்படுதல்
  choice: அவர்கள் அனைவரும் பரிசுத்த ஆவியால் நிரப்பப்பட்டு
  alternative: அவர்கள் அனைவரும் பரிசுத்த ஆவியினால் நிறைந்தவர்களாகி
  rationale: πίμπλημι உடன் வரும் ஆறாம் வேற்றுமை ஆவியை நிறைவின் உள்ளடக்கமாகக் காட்டுகிறது. தேர்ந்த வடிவம் லூக்காவின் செயப்பாட்டு மொழிநடையைப் பேணுகிறது; இதை ஒரு குறிப்பிட்ட சபைமரபின் ‘இரண்டாம் அனுபவம்’ என்ற கோட்பாடாக வரையறுக்கவில்லை.
- issue: ἐλάλουν என்பதன் காலவகை
  choice: பேசிக்கொண்டிருந்தார்கள்
  alternative: பேசினார்கள்
  rationale: முற்றுப்பெறா இறந்தகாலம் தொடர்ந்த அறிவிப்பை முன்வைக்கிறது. ஆகவே ஆவியால் நிரப்பப்பட்டதைத் தொடர்ந்து நீடித்த துணிவான சாட்சியை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘ஒன்றுகூடியிருந்த,’ ‘அதிர்ந்தது,’ ‘துணிவுடன்’ போன்ற பொதுவாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; அதேவேளை கிரேக்க வினைகளின் காலவகையும் செயப்பாட்டுத் தன்மையும் இயன்றவரை காக்கப்பட்டுள்ளன. ஆலோசனை ஆங்கில உரையில் அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்களுடன் பொருந்தாமல் இருந்ததால், [a] ஒன்றுகூடியிருந்த என்பதற்கும் [b] துணிவுடன் என்பதற்கும் பொருத்தமாக வைக்கப்பட்டுள்ளன.
