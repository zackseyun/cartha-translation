  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: ta
  text: 'ஆனால் பேதுருவும் யோவானும் அவர்களுக்குப் பதிலளித்துச் சொன்னார்கள்: “உங்களுக்குச் செவிகொடுப்பதற்குப் பதிலாகக் கடவுளுக்குச் செவிகொடுப்பது கடவுளின் பார்வையில் சரியானதா என்பதை நீங்களே தீர்மானியுங்கள்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருளை விளக்கமாகச் சொன்னால், “உங்களுக்குக் கீழ்ப்படிவதற்குப் பதிலாகக் கடவுளுக்குக் கீழ்ப்படிவது.” கிரேக்க வினைச்சொல்லின் நேர்ப்பொருள் “கேட்பது/செவிகொடுப்பது”; ஆனால் இச்சூழலில் அது அதிகாரத்தின் சொல்லை ஏற்று நடப்பதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: ஆனால் பேதுருவும் யோவானும்
  rationale: δέ இங்கு அதிகாரிகளின் கட்டளைக்கான மாறுபட்ட பதிலை அறிமுகப்படுத்துவதால், ‘ஆனால்’ இயல்பாக அந்த எதிர்நிலையை வெளிப்படுத்துகிறது.
- source_word: ἀποκριθέντες ... εἶπον
  choice: பதிலளித்துச் சொன்னார்கள்
  rationale: பங்கேற்புவினையும் முற்றுவினையும் கொண்ட கிரேக்கத் தொடரின் இரு கூறுகளையும், தமிழில் இயல்பான ஒரே வினைத்தொடராகப் பாதுகாக்கிறது.
- source_word: δίκαιόν
  choice: சரியானது
  rationale: இங்கு கடவுளின் மதிப்பீட்டின்படி எது தகுந்தது அல்லது நீதியானது என்பதே கருத்து; நேரடி உரையில் ‘சரியானது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளின் பார்வையில்
  rationale: கடவுளுக்கு முன்பாக நிகழும் மதிப்பீடு அல்லது தீர்ப்பின் பொருளை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀκούειν
  choice: செவிகொடுப்பது
  rationale: ἀκούω என்பதன் கேட்பது/கவனித்துக் கேட்பது என்ற சொற்பொருளைப் பாதுகாப்பதோடு, அதிகாரத்தின் சொல்லை ஏற்று நடப்பது என்ற சூழல்சார் உட்பொருளையும் தமிழில் உணர்த்துகிறது; ‘கீழ்ப்படிவது’ என்று நேரடியாக்கி பொருளைத் தீர்மானித்துவிடவில்லை.
- source_word: μᾶλλον ἢ
  choice: …விட
  rationale: இரண்டு அதிகாரங்களுக்கு செவிகொடுப்பதை ஒப்பிட்டு ஒன்றை மற்றொன்றுக்கு மேலாக வைக்கும் கிரேக்க ஒப்பீட்டை இயல்பான தமிழில் தருகிறது.
- source_word: κρίνατε
  choice: நீங்களே தீர்மானியுங்கள்
  rationale: கேட்பவர்களே மதிப்பிட்டு முடிவு செய்ய வேண்டும் என்ற நேரடியான சவாலை ‘நீங்களே’ தெளிவாக்குகிறது.
- source_word: πρὸς αὐτούς
  choice: அவர்களுக்கு
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட அதிகாரிகளை இயல்பான தமிழ்ப் பதிலீட்டுப் பெயரால் சுட்டுகிறது.
theological_decisions:
- issue: ἀκούειν என்பதை மனித அதிகாரத்துக்கும் கடவுளுக்கும் கீழ்ப்படிதல் பற்றிய முரண்பாட்டில் ‘கீழ்ப்படிவது’ என்று விளக்கமாக மொழிபெயர்க்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘செவிகொடுப்பது’ என்று வைத்தல்
  alternative: ‘உங்களுக்குக் கீழ்ப்படிவது கடவுளுக்குக் கீழ்ப்படிவதைவிட…’
  rationale: சூழல் கீழ்ப்படிதலைக் குறித்தாலும், கிரேக்க உரை வெளிப்படையான கீழ்ப்படிதல் வினையை அல்லாமல் ἀκούω என்ற கேட்பதைக் குறிக்கும் வினையைப் பயன்படுத்துகிறது. ‘செவிகொடுப்பது’ மூலச் சொல்லின் உருவகத்தையும், அதிகாரத்தின் சொல்லை ஏற்று நடக்கும் உட்பொருளையும், அவற்றுக்கிடையிலான பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரை. ‘செவிகொடுப்பது’ இலக்கியச் சுமை மிகாமல் மூலத்தின் கேட்பது–கீழ்ப்படிதல் இரட்டைப் பொருளைப் பாதுகாக்கிறது; அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
