source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: ta
  text: பேதுருவும் யோவானும் காட்டிய துணிவை அவர்கள் கவனித்து, இவர்கள் முறையான கல்விப் பயிற்சி பெறாத சாதாரண மனிதர்கள்[a] என்பதை உணர்ந்தபோது வியந்தார்கள். மேலும், இவர்கள் இயேசுவோடு இருந்தவர்கள் என்பதை அறிந்துகொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு வகையில், “முறைப்படி கற்றறியாதவர்களும் அதிகாரப்பூர்வப் பதவியில்லாதவர்களும்.” கிரேக்கச் சொற்கள் இவர்களுக்கு முறையான புலமைசார் பயிற்சியும் தொழில்முறை அல்லது அதிகாரப்பூர்வ அந்தஸ்தும் இல்லை என்பதைக் குறிக்கின்றன; இவர்கள் எழுத்தறிவே இல்லாதவர்கள் என்று அவசியம் பொருள்படுவதில்லை.
    reason: ἀγράμματοι மற்றும் ἰδιῶται ஆகிய சொற்களின் மாற்று மொழிபெயர்ப்பையும் அவற்றின் சமூகப் பொருளையும் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: Θεωροῦντες
  choice: கவனித்து
  rationale: வெறுமனே பார்ப்பதைக் காட்டிலும், மதிப்பிட்டு உற்றுநோக்குவதை இந்தச் சொல் சூழலில் குறிக்கிறது.
- source_word: παρρησίαν
  choice: துணிவை
  rationale: அச்சமின்றி வெளிப்படையாகப் பேசும் தைரியத்தைச் சூழல் உணர்த்துகிறது; தமிழில் இயல்பாக இருக்க ‘காட்டிய துணிவு’ என வழங்கப்பட்டுள்ளது.
- source_word: καταλαβόμενοι
  choice: உணர்ந்தபோது
  rationale: பேதுரு, யோவான் பற்றிய ஒரு முடிவுக்கு அதிகாரிகள் வந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀγράμματοί
  choice: முறையான கல்விப் பயிற்சி பெறாத
  rationale: முழுமையான எழுத்தறிவின்மையை அல்ல, அங்கீகரிக்கப்பட்ட புலமைசார் அல்லது வேதபாரகர் பயிற்சி இல்லாத நிலையைக் குறிக்கிறது.
- source_word: ἰδιῶται
  choice: சாதாரண
  rationale: பயிற்சி பெற்ற அதிகாரப்பூர்வ நிபுணர்களுக்கு மாறாக, பதவியோ தொழில்முறை அந்தஸ்தோ இல்லாதவர்களாக அவர்கள் கருதப்பட்டதைத் தெரிவிக்கிறது.
- source_word: ἐθαύμαζον
  choice: வியந்தார்கள்
  rationale: அவர்களுடைய தொடர்ந்த ஆச்சரியத்தைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: ἐπεγίνωσκόν
  choice: அடையாளம் கண்டுகொண்டார்கள்
  rationale: அவர்கள் இயேசுவோடு முன்பு இருந்தவர்கள் என்பதை அதிகாரிகள் அறிந்து அடையாளம் கண்டதை வெளிப்படுத்துகிறது.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: இயேசுவோடு இருந்தவர்கள்
  rationale: தற்போதைய நிகழ்வுக்கு முந்திய இயேசுவுடனான தொடர்பை தமிழில் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: பேதுரு, யோவானின் சமூக மற்றும் கல்விநிலை பற்றிய வருணனை
  choice: முறையான கல்விப் பயிற்சி பெறாத சாதாரண மனிதர்கள்
  alternative: எழுத்தறிவில்லாதவர்களும் பாமரர்களும்
  rationale: கிரேக்கச் சொற்கள் அவர்களை அறிவற்றவர்கள் அல்லது முற்றிலும் எழுத்தறிவில்லாதவர்கள் என்று தீர்ப்பிடவில்லை; அங்கீகரிக்கப்பட்ட புலமைப் பயிற்சியும் அதிகாரப்பூர்வ நிபுணர் அந்தஸ்தும் இல்லாதவர்கள் என்ற அதிகாரிகளின் பார்வையையே தெரிவிக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்பை இயல்பான தமிழுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், கவனித்தல், உணர்தல், வியத்தல், அடையாளம் காணுதல் ஆகிய கருத்துகளின் வரிசை பாதுகாக்கப்பட்டுள்ளது.
