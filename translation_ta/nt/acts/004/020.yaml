id: ACT.4.20
reference: Acts 4:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ δυνάμεθα γὰρ ἡμεῖς ἃ εἴδαμεν καὶ ἠκούσαμεν μὴ λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: ta
  text: ஏனெனில், நாங்கள் கண்டதையும் கேட்டதையும் பற்றிப் பேசாமல் இருக்க எங்களால் முடியாது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “ஏனெனில், நாங்கள் கண்டதையும் கேட்டதையும் சொல்லாமல் எங்களால் இருக்க முடியாது.”'
    reason: சொல்லமைப்பு மற்றும் சொல் தேர்வுக்கான இயல்பான மாற்று; ‘பற்றிப் பேச’ என்பதற்குப் பதிலாக ‘சொல்லாமல் ... இருக்க’ என்று கிரேக்கக் கருத்தை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: οὐ δυνάμεθα ... μὴ λαλεῖν
  choice: பேசாமல் இருக்க எங்களால் முடியாது
  rationale: இயலாமையைச் சுட்டும் οὐ δυνάμεθα என்பதையும், μὴ உடன் வரும் வினையெச்சத்தின் எதிர்மறை அமைப்பையும் இயல்பான தமிழில் காக்கிறது. இது வெறும் மனவுறுதியையோ விருப்பத்தையோ அல்ல, பேசாமல் இருக்க இயலாத நிலையையே தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க இணைப்பாக γάρ செயல்படுகிறது; ‘ஏனெனில்’ அந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἡμεῖς
  choice: நாங்கள்
  rationale: வெளிப்படையாகக் கொடுக்கப்பட்டுள்ள முதல் நபர் பன்மைப் பெயர்ச்சொல்லைத் தக்கவைக்கிறது. ‘நாங்களே’ என்பது மூலத்தில் உள்ள வலியுறுத்தலை தமிழில் அளவுக்கு மீறிக் காட்டக்கூடும்.
- source_word: ἃ εἴδαμεν καὶ ἠκούσαμεν
  choice: நாங்கள் கண்டதையும் கேட்டதையும்
  rationale: சீடர்களின் நேரடி சாட்சியத்தின் இரு கூறுகளான கண்டதையும் கேட்டதையும் இணையாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: λαλεῖν
  choice: பற்றிப் பேச
  rationale: இச்சூழலில் அவர்கள் கண்டதும் கேட்டதுமே பேச்சின் பொருள் என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது; வெறும் ‘பேச’ என்பது பொருள் தொடர்பை மறைமுகமாக விடும்.
theological_decisions:
- issue: அப்போஸ்தலர்களின் பேச்சு வெறும் விருப்பமா, அல்லது மௌனமாக இருக்க இயலாத நிலையா?
  choice: அவர்கள் கண்டதையும் கேட்டதையும் பற்றிப் பேசாமல் இருக்க அவர்களால் முடியாது என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நாங்கள் தொடர்ந்து பேசத் தீர்மானித்திருக்கிறோம்’ அல்லது ‘நாங்கள் பேசுவதை நிறுத்தமாட்டோம்.’
  rationale: οὐ δυνάμεθα ... μὴ λαλεῖν என்ற கிரேக்க அமைப்பு, வெறும் தீர்மானத்தைவிடப் பேசாமல் இருக்க இயலாமையை நேரடியாகத் தெரிவிக்கிறது. மொழிபெயர்ப்பு அந்த வலிமையையும் இறையியல் பதற்றத்தையும் மெலிதாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேசாமல் இருக்க எங்களால் முடியாது’ என்பது மூலத்தின் எதிர்மறை அமைப்பையும் இயலாமை உணர்வையும் காக்கும் இயல்பான தமிழ். வசனத்தின் தொடக்க இணைப்பான ‘ஏனெனில்’ முந்தைய சூழலுடனான காரணத் தொடர்பைத் தக்கவைக்கிறது.
