id: ACT.4.18
reference: Acts 4:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: ta
  text: அவர்களை அழைத்து, இயேசுவின் பெயரில் பேசவோ கற்பிக்கவோ முற்றிலும் கூடாது என்று அவர்களுக்குக் கட்டளையிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλέσαντες
  choice: அவர்களை அழைத்து
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலை இறந்தகால வினையெச்சமாக இயல்பாகத் தருகிறது. சூழலில் அவர்கள் மீண்டும் அவையின் முன்னிலையில் அழைக்கப்பட்டதைக் குறித்தாலும், மூலத்தில் இல்லாத ‘உள்ளே’ என்பதைச் சேர்க்கவில்லை.
- source_word: παρήγγειλαν
  choice: அவர்களுக்குக் கட்டளையிட்டார்கள்
  rationale: அதிகாரத்துடன் பிறப்பிக்கப்பட்ட உத்தரவின் வலிமையை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τὸ καθόλου
  choice: முற்றிலும் கூடாது
  rationale: தடையின் முழுமையையும் வலியுறுத்துகிறது; பேசுதல், கற்பித்தல் ஆகிய இரண்டையும் உள்ளடக்கும் வகையில் தமிழில் இயல்பாக அமைந்துள்ளது.
- source_word: μὴ φθέγγεσθαι
  choice: பேசவோ ... கூடாது
  rationale: φθέγγομαι என்பதன் பொதுவான வாய்மொழிச் செயலை எளிய, இயல்பான தமிழில் தருகிறது; ‘உச்சரிக்க’ என்பது இங்கு தேவையற்ற அளவு குறுகியதாக இருக்கும்.
- source_word: μηδὲ διδάσκειν
  choice: கற்பிக்கவோ ... கூடாது
  rationale: முதல் தடையுடன் இணைக்கப்பட்ட இரண்டாவது தடையைத் தமிழின் எதிர்மறை இணைப்பமைப்பான ‘-வோ ... -வோ கூடாது’ மூலம் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: இயேசுவின் பெயரில்
  rationale: இயேசுவின் பெயரைக் குறித்து அல்லது அவரது பெயரின் அதிகாரத்தின் அடிப்படையில் பேசுவதையும் செயல்படுவதையும் குறிக்கக்கூடிய கிரேக்கச் சொற்றொடரின் இயல்பான தமிழாக்கம்; மூலத்தின் பொருள் விரிவைத் தேவையின்றி சுருக்கவில்லை.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவுடன் தொடர்புடைய பேச்சுக்கும் போதனைக்கும் விதிக்கப்பட்ட தடையின் பரப்பு
  choice: பேசுதல், கற்பித்தல் இரண்டையும் உள்ளடக்கும் முழுமையான தடை
  alternative: பொதுமக்கள் முன் அறிவிப்பதற்கு மட்டும் விதிக்கப்பட்ட தடை
  rationale: τὸ καθόλου என்ற வலியுறுத்தலும் μὴ φθέγγεσθαι μηδὲ διδάσκειν என்ற இரட்டைத் தடையும் பரந்த கட்டளையைக் காட்டுகின்றன. கிரேக்கம் குறிப்பிடாத ‘பொது அறிவிப்பு’ என்ற வரம்பை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: ‘இயேசுவின் பெயரில்’ என்பதன் உறவு
  choice: ‘பெயரில்’ என்ற பலபொருள் கொண்ட இயல்பான சொற்றொடரைப் பேணுதல்
  alternative: ‘இயேசுவைப் பற்றி’ அல்லது ‘இயேசுவின் அதிகாரத்தால்’ என்று ஒரே பொருளாக வெளிப்படுத்துதல்
  rationale: ἐπὶ τῷ ὀνόματι என்பது இயேசுவைக் குறித்துப் பேசுதல் மற்றும் அவரது பெயரின் அடிப்படையில் பேசுதல் ஆகிய நிழற்பொருள்களைத் தாங்கக்கூடும். அவற்றில் ஒன்றை மட்டும் தீர்மானமாகத் தேர்ந்தெடுக்காமல் உண்மையான பொருள் விரிவைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘முற்றிலும் கூடாது’ தடையின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது; தேவையற்ற சமயப் பிரிவுச் சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
