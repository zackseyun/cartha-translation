source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: ta
  text: ஏனெனில், நீர் அபிஷேகம் செய்த உம்முடைய பரிசுத்த ஊழியரான இயேசுவுக்கு[a] எதிராக ஏரோதும் பொந்தியு பிலாத்துவும், பிற இனத்தாரோடும் இஸ்ரவேல் மக்களோடும்[b] சேர்ந்து, உண்மையாகவே இந்த நகரத்தில் ஒன்றுகூடினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உம்முடைய பரிசுத்த பிள்ளையான இயேசு’ என்றும் மொழிபெயர்க்கலாம். παῖς என்ற கிரேக்கச் சொல் ‘ஊழியர்’ அல்லது ‘பிள்ளை’ என இரு பொருள்களைக் கொண்டது; இங்கு ஏசாயாவின் ‘கர்த்தருடைய ஊழியர்’ மொழியின் எதிரொலி காரணமாக ‘ஊழியர்’ என்பது முதன்மைப்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, ‘பிற இனங்களோடும் இஸ்ரவேலின் மக்கள் கூட்டங்களோடும்.’ கிரேக்கத்தில் ἔθνη என்பது ‘இனங்கள்/பிற இனத்தார்’ என்றும், λαοί என்பது ‘மக்கள்’ என்பதன் பன்மை வடிவிலும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: ஒன்றுகூடினர்
  rationale: இறந்தகாலத்தில் நிகழ்ந்த கூட்டுச்சேர்தலைத் தெளிவாகக் காட்டுகிறது. கிரேக்க வடிவம் இலக்கணப்படி செயல்பாட்டு வடிவமற்றதாக இருந்தாலும், தமிழில் ‘ஒன்றுகூட்டப்பட்டார்கள்’ என்பது வெளிப்புற முகவர் ஒருவரைத் தேவையின்றி முன்வைக்கும்; ‘ஒன்றுகூடினர்’ இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய சங்கீத மேற்கோள் இந்த நிகழ்வில் நிறைவேறியதை விளக்கும் காரணத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ἐπ’ ἀληθείας
  choice: உண்மையாகவே
  rationale: ‘உண்மையில்/மெய்யாகவே’ என்ற வலியுறுத்தும் வினையடைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: இந்த நகரத்தில்
  rationale: எருசலேமைக் சூழல் வழியாகச் சுட்டும் இடவுரையை, மூலத்தில் இல்லாத நகரப் பெயரைச் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: ἐπὶ τὸν
  choice: எதிராக
  rationale: பகைமையுடன் ஒன்றுகூடுதலைக் குறிக்கும் சூழலில் ἐπί + வேற்றுமை உருபின் எதிர்ப்பு நோக்கைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἅγιον παῖδά σου
  choice: உம்முடைய பரிசுத்த ஊழியர்
  rationale: παῖς என்பதற்கு ‘பிள்ளை’ என்றும் பொருள் வரலாம்; இங்கு ஏசாயாவின் கர்த்தருடைய ஊழியர் பின்னணியும் அப்போஸ்தலர் நூலின் ஒத்த பயன்பாடுகளும் ‘ஊழியர்’ என்பதற்கு ஆதரவளிக்கின்றன. ‘பரிசுத்த’ என்பது தேவனுக்கென்று பிரித்தெடுக்கப்பட்ட நிலையையும் புனிதத்தையும் பாதுகாக்கிறது.
- source_word: ὃν ἔχρισας
  choice: நீர் அபிஷேகம் செய்த
  rationale: χρίω என்பதன் நேரடியான ‘அபிஷேகம் செய்’ என்ற பொருளையும் மேசியா சார்ந்த ஒலிப்பையும் பாதுகாக்கிறது; மூலத்தில் பெயர்ச்சொல் பட்டம் இல்லாததால் ‘மேசியாவாக்கிய’ என்று விரிவாக்கவில்லை.
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: ஏரோதும் பொந்தியு பிலாத்துவும்
  rationale: இரு ஆட்சியாளர்களையும் இணைக்கும் τε καὶ அமைப்பை இயல்பான தமிழ் இணைப்பால் வெளிப்படுத்துகிறது; பெயர்கள் தமிழில் நிலைபெற்ற வடிவில் தரப்பட்டுள்ளன.
- source_word: σὺν ἔθνεσιν
  choice: பிற இனத்தாரோடும்
  rationale: இஸ்ரவேல் மக்களுடனான வேறுபாட்டைத் தெளிவாக்கும் வகையில் ἔθνη என்பதை யூதரல்லாத பிற இனத்தார் எனக் காட்டுகிறது; ‘தேசங்கள்’ என்ற அரசியல் சார்ந்த தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: λαοῖς Ἰσραήλ
  choice: இஸ்ரவேல் மக்களோடும்
  rationale: தமிழில் இயல்பாகப் புரியும் வடிவம். கிரேக்கத்தில் ‘மக்கள்’ என்பது பன்மையில் இருப்பதை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் παῖς என்பதன் மொழிபெயர்ப்பு
  choice: ஊழியர்
  alternative: பிள்ளை; மகன்
  rationale: இந்த ஜெபம் ஏசாயாவின் ஊழியர் மொழியை எதிரொலிப்பதும் அப்போஸ்தலர் 3:13, 3:26; 4:27, 4:30 ஆகிய இடங்களின் தொடர்ச்சியும் ‘ஊழியர்’ என்பதைச் சூழலுக்கு ஏற்றதாக்குகின்றன. ‘மகன்’ என்பது கிறிஸ்தவ இறையியலுக்கு ஏற்ற உண்மையாக இருந்தாலும், இந்தச் சொல்லின் குறிப்பிட்ட பொருளைத் தீர்மானித்து விடும் அளவுக்கு விளக்கமொழிபெயர்ப்பாகும்.
- issue: ἔθνεσιν என்பதையும் இஸ்ரவேலையும் வேறுபடுத்திக் காட்டுதல்
  choice: பிற இனத்தார்
  alternative: தேசங்கள்; இனங்கள்
  rationale: ‘இஸ்ரவேல் மக்கள்’ என்பதுடன் இணையாக வருவதால், அரசியல் நாடுகளைக் காட்டிலும் யூதரல்லாத இன மக்களைக் குறிக்கும் வேறுபாடே இங்கு முன்னிலையில் உள்ளது.
- issue: செயல்பாட்டு வடிவமற்ற συνήχθησαν-ஐ தமிழில் தருதல்
  choice: ஒன்றுகூடினர்
  alternative: ஒன்றுகூட்டப்பட்டார்கள்
  rationale: மூலத்தின் வடிவம் தெய்வீகச் செயற்பாட்டாளரை வெளிப்படையாகக் குறிப்பிடவில்லை. தமிழில் சொல்லுக்கு சொல் செயல்பாட்டு வடிவமற்ற மொழிபெயர்ப்பு, யாரோ அவர்களைக் கூட்டினார்கள் என்று தேவையின்றி உணர்த்தக்கூடும்; எனவே இறையியல் முகவரைச் சேர்க்காமலும் கூட்டுச்சேர்தலின் பொருளைப் பாதுகாத்தும் இயல்பான வினை தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற மரியாதை ஒருமையான ‘நீர்/உம்முடைய’ நடை பயன்படுத்தப்பட்டுள்ளது. வாக்கியத்தின் கிரேக்க வரிசை தமிழின் இயல்புக்கேற்ப மாற்றப்பட்டாலும், இடம், எதிர்ப்பு, கூட்டணியில் சேர்ந்த குழுக்கள், அபிஷேகம் ஆகிய அனைத்துப் பொருள் கூறுகளும் பாதுகாக்கப்பட்டுள்ளன. ‘ஊழியர்’ என்பது பொதுவாகப் புரியும் வேதாகமச் சொல்; ‘திருப்பணியாளர்’ போன்ற சபைப் பதவியை நினைவூட்டும் சொல்லைத் தவிர்க்கிறது.
