id: ACT.4.26
reference: Acts 4:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: ta
  text: பூமியின் அரசர்கள் அணிவகுத்து நின்றார்கள்; ஆட்சியாளர்கள் ஆண்டவருக்கும் அவருடைய மேசியாவுக்கும்[a] எதிராக ஒன்றுகூடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து”; கிரேக்கத்தில், “அவருடைய கிறிஸ்தோஸ்,” அதாவது, “அவரால் அபிஷேகம் செய்யப்பட்டவர்.”
    reason: Χριστός என்பதன் ‘மேசியா/கிறிஸ்து/அபிஷேகம் செய்யப்பட்டவர்’ என்ற தலைப்புசார் பொருள் வரம்பைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: παρέστησαν
  choice: அணிவகுத்து நின்றார்கள்
  rationale: இது வெறுமனே நிற்பதைக் காட்டாமல், சங்கீதம் 2:2-ன் பின்னணியில் திட்டமிட்டு எதிர்ப்பு நிலை எடுப்பதைக் காட்டுகிறது.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: பூமியின் அரசர்கள்
  rationale: βασιλεῖς என்பதன் குறிப்பான அரசியல் பொருளையும், γῆ என்பதன் பரந்த உலகளாவிய பொருளையும் காக்கிறது.
- source_word: οἱ ἄρχοντες
  choice: ஆட்சியாளர்கள்
  rationale: அதிகாரம் செலுத்துகிறவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; ‘அரசர்கள்’ என்பதிலிருந்து தேவையான வேறுபாட்டையும் காக்கிறது.
- source_word: συνήχθησαν ἐπὶ τὸ αὐτό
  choice: ஒன்றுகூடினார்கள்
  rationale: கிரேக்கச் சொற்றொடரின் ‘ஒன்றாக ஒரே நோக்கில் கூடுதல்’ என்ற கருத்தை இயல்பான தமிழில் தருகிறது; சொல்லுக்கு சொல் செயலப்பாட்டு வடிவமான ‘ஒன்றுகூட்டப்பட்டார்கள்’ தமிழில் தேவையற்ற வெளிப்புற முகவரை உணர்த்தக்கூடும்.
- source_word: κατὰ
  choice: எதிராக
  rationale: இரு இடங்களிலும் பகைமையான எதிர்ப்பை நேரடியாகக் குறிக்கிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவர்
  rationale: வேத மேற்கோளில் கடவுளைக் குறிக்கும் κύριος என்பதன் மரியாதையும் இறையியல் நிறையும் காக்கப்படுகின்றன.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: அவருடைய மேசியா
  rationale: சங்கீதம் 2:2 மேற்கோளில் χριστός ஒரு பட்டமாகவும் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற எபிரெயப் பின்னணியுடனும் வருவதால் ‘மேசியா’ பொருத்தமானது; αὐτοῦ என்பதன் உறவுப் பொருளும் ‘அவருடைய’ எனக் காக்கப்படுகிறது.
theological_decisions:
- issue: சங்கீதம் 2 மேற்கோளில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து; அபிஷேகம் செய்யப்பட்டவர்
  rationale: இங்கு சொல் தனிப்பெயரைப் போல அல்லாமல் ஆண்டவரால் நியமிக்கப்பட்டவரைக் குறிக்கும் பட்டமாக வருகிறது. ‘மேசியா’ பழைய ஏற்பாட்டு பின்னணியைக் காக்கிறது; வாசகர்களுக்கு நன்கு அறிமுகமான ‘கிறிஸ்து’ அடிக்குறிப்பில் மாற்றாகத் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டுள்ளது. சங்கீத மேற்கோளின் இணைநடை காக்கப்பட்டுள்ளது; ‘அணிவகுத்து நின்றார்கள்’ திட்டமிட்ட எதிர்ப்பை வெளிப்படுத்துகிறது.
