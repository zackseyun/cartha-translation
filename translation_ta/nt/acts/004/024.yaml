id: ACT.4.24
reference: Acts 4:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: ta
  text: அவர்கள் இதைக் கேட்டதும்[a], ஒருமனதாக[b] கடவுளை நோக்கிக் குரலெழுப்பி, “அதிபதியே[c], வானத்தையும் பூமியையும் கடலையும் அவற்றிலுள்ள அனைத்தையும் படைத்தவர் நீரே,” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூலமொழியில் “இதை” என்பது வெளிப்படையாக இல்லை; எதைக் கேட்டார்கள் என்பது சூழலிலிருந்து புரிகிறது.
    reason: translation_clarification
  - marker: b
    text: அல்லது, “அனைவரும் ஒன்றுபட்டு.”
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் Δέσποτα; முழுமையான அதிகாரமுள்ள எஜமானர் அல்லது அதிபதியைக் குறிக்கும் பட்டம். இது κύριος (“ஆண்டவர்”) என்பதிலிருந்து வேறுபட்ட சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: அவர்கள் இதைக் கேட்டதும்
  rationale: இறந்தகால வினையெச்சம் இங்கு காலத் தொடர்பைக் காட்டுகிறது. கிரேக்கத்தில் கேட்கப்பட்டதற்கான செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய உரையிலிருந்து அது தெளிவாக இருப்பதால் இயல்பான தமிழுக்காக ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὁμοθυμαδόν
  choice: ஒருமனதாக
  rationale: குழுவினர் ஒரே நோக்கத்துடனும் ஒற்றுமையுடனும் செயல்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἦραν φωνήν
  choice: குரலெழுப்பி
  rationale: கிரேக்கத்தில் ‘குரல்’ ஒருமையில் உள்ளது; ஒன்றுபட்ட கூட்டுப் பிரார்த்தனையை இயல்பான தமிழில் தெரிவிக்கும் சொற்றொடர் இது.
- source_word: πρὸς τὸν θεόν
  choice: கடவுளை நோக்கி
  rationale: பிரார்த்தனை கடவுளிடம் செலுத்தப்பட்டதைக் காட்டும் πρός என்பதன் திசைசார் நுட்பத்தையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: Δέσποτα
  choice: அதிபதியே
  rationale: முழுமையான அதிகாரமுள்ள தலைவர் அல்லது உரிமையாளரைக் குறிக்கும் இந்த அழைப்புப் பட்டத்தை κύριος என்பதற்குரிய வழக்கமான ‘ஆண்டவர்’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: σὺ ὁ ποιήσας
  choice: படைத்தவர் நீரே
  rationale: σὺ என்னும் வலியுறுத்தப்பட்ட பிரதிப்பெயரையும், கடவுளைப் படைத்தவராக அடையாளப்படுத்தும் பெயரெச்சத் தொடரையும் இயல்பான, மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: வானத்தையும் பூமியையும் கடலையும்
  rationale: படைப்பைக் குறிக்கும் மூன்று பகுதிகளைக் கிரேக்கத்தின் வரிசையிலும் இணைப்புமுறையிலும் காக்கிறது.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: அவற்றிலுள்ள அனைத்தையும்
  rationale: வானம், பூமி, கடல் ஆகிய மூன்றிலும் உள்ள யாவற்றையும் உள்ளடக்கும் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: Δέσποτα என்னும் தெய்வீக அழைப்புப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: அதிபதியே
  alternative: எஜமானே; பேரதிபதியே; ஆண்டவரே
  rationale: ‘அதிபதி’ என்பது முழுமையான அதிகாரத்தைத் தெரிவிப்பதோடு, κύριος என்பதற்கு பொதுவாகப் பயன்படுத்தப்படும் ‘ஆண்டவர்’ என்ற பட்டத்திலிருந்து சொல் வேறுபாட்டைக் காக்கிறது. ‘பேரதிபதி’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் தீவிரத்தைச் சேர்க்கலாம்; ‘எஜமான்’ இன்றைய தமிழில் வீட்டு உரிமையாளர் அல்லது முதலாளி போன்ற குறுகிய தொடர்புகளை எழுப்பக்கூடும்.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் ‘நீரே’ என்ற மரியாதை வடிவம் காக்கப்பட்டுள்ளது. கூட்டத்தின் ஒருமைப்பாட்டையும் கிரேக்க ஒருமை ‘குரல்’ என்பதையும் ‘ஒருமனதாக… குரலெழுப்பி’ என்ற இயல்பான தொடரால் இணைத்துக் காட்டப்பட்டுள்ளது.
