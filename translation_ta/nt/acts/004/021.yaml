- from: அவர்கள் மேலும் அச்சுறுத்திய பிறகு[a], மக்களுக்குப் பயந்து அவர்களைத் தண்டிப்பதற்கு எந்த வழியும் காணாததால், அவர்களை விடுவித்தார்கள். ஏனெனில் நடந்ததைக் குறித்து எல்லாரும் கடவுளை மகிமைப்படுத்திக்கொண்டிருந்தார்கள்.
  to: அவர்கள் மேலும் அச்சுறுத்திய பிறகு[a], மக்களைக் கருத்தில் கொண்டு, அவர்களை எப்படித் தண்டிப்பது என்பதற்கான எந்த வழியையும் காணாததால், அவர்களை விடுவித்தார்கள். ஏனெனில் நடந்ததைக் குறித்து எல்லாரும் கடவுளை மகிமைப்படுத்தினார்கள்.
  rationale: The revision replaces the interpretively stronger “மக்களுக்குப் பயந்து” with the neutral causal expression “மக்களைக் கருத்தில் கொண்டு,” preserving the force of διὰ τὸν λαόν without asserting fear. It also adjusts the word order to reflect the Greek sequence more clearly. The imperfect ἐδόξαζον is conveyed by the Tamil past tense in a context where a forced progressive would be less natural.
