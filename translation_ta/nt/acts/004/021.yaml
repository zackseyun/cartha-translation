translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகிமைப்படுத்திக்கொண்டிருந்தார்கள்’ என்பது மூலத்தின் இறந்தகாலத் தொடர்நிலையைப் பாதுகாக்கிறது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
