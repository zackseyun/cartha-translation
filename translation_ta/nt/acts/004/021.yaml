  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: ta
  text: அவர்கள் மேலும் அச்சுறுத்திய பிறகு[a], மக்களைக் கருத்தில் கொண்டு, அவர்களை எப்படித் தண்டிப்பது என்பதற்கான எந்த வழியையும் காணாததால், அவர்களை விடுவித்தார்கள். ஏனெனில் நடந்ததைக் குறித்து எல்லாரும் கடவுளை மகிமைப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் அச்சுறுத்திய பிறகு” அல்லது “இன்னும் சில அச்சுறுத்தல்களைச் சேர்த்த பிறகு.” கிரேக்கச் சொல், முன்பு விடுக்கப்பட்ட அச்சுறுத்தலுக்கு மேலாகக் கூடுதலாகவோ இன்னும் கடுமையாகவோ அச்சுறுத்தியதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: மேலும் அச்சுறுத்திய பிறகு
  rationale: πρός முன்னொட்டு ஏற்கெனவே விடுக்கப்பட்ட அச்சுறுத்தலுடன் கூடுதலான அச்சுறுத்தலைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: ἀπέλυσαν
  choice: விடுவித்தார்கள்
  rationale: காவல் அல்லது அதிகாரக் கட்டுப்பாட்டிலிருந்து விடுவித்தலைச் சூழலுக்கேற்ற நவீன தமிழில் குறிக்கிறது.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: அவர்களைத் தண்டிப்பதற்கு எந்த வழியும் காணாததால்
  rationale: சொல்லுக்குச் சொல் அமைப்பான ‘எவ்வாறு தண்டிப்பது என்று எதையும் காணாமல்’ என்பதற்குப் பதிலாக, τὸ πῶς குறிக்கும் வழி அல்லது முறையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: διὰ τὸν λαόν
  choice: மக்களுக்குப் பயந்து
  rationale: διά + accusative காரணத்தைக் குறிக்கிறது. அதிகாரிகள் மக்களின் எதிர்வினையால் கட்டுப்பட்டதைச் சூழல் உணர்த்துவதால், தமிழில் இயல்பான காரணவியல் வடிவில் தரப்பட்டுள்ளது.
- source_word: πάντες
  choice: எல்லாரும்
  rationale: சூழலில் பொதுவாக மக்களனைவரையும் குறிக்கும் முழுமையான பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐδόξαζον τὸν θεόν
  choice: கடவுளை மகிமைப்படுத்திக்கொண்டிருந்தார்கள்
  rationale: δοξάζω என்பதிலுள்ள கடவுளுக்கு மகிமை செலுத்தும் கருத்தையும், இறந்தகாலத்தில் தொடர்ந்த செயலைக் குறிக்கும் imperfect வடிவின் நீடித்த அம்சத்தையும் காக்கிறது.
- source_word: ἐπὶ τῷ γεγονότι
  choice: நடந்ததைக் குறித்து
  rationale: நிறைவேறிய நிகழ்வை அடிப்படையாகக் கொண்டு மக்கள் கடவுளை மகிமைப்படுத்தியதை இயல்பான தமிழில் தெரிவிக்கிறது.
