id: ACT.4.1
reference: Acts 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: ta
  text: அவர்கள் மக்களிடம் பேசிக்கொண்டிருந்தபோது, ஆசாரியர்களும் ஆலயக் காவல் தலைவரும்[a] சதுசேயர்களும் அவர்களிடம் வந்து நின்றார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆலயக் காவல் தலைவர்’ என்பவர் ஆலய வளாகத்தின் ஒழுங்கையும் பாதுகாப்பையும் கவனித்த அதிகாரி.
    reason: cultural_note
  - marker: b
    text: ‘அணுகி வந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை திடீரென வந்து சேர்வதையோ அருகில் அணுகுவதையோ குறிக்கக்கூடும்; இச்சூழலில் அதிகாரிகள் பேச்சை இடைமறிக்க வந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: அவர்கள் … பேசிக்கொண்டிருந்தபோது
  rationale: இயற்கையான தமிழில் இந்த உடைமை வேற்றுமைத் தனிநிலைத் தொடரை ஒரே நேரத்தில் நிகழ்ந்த செயலைக் குறிக்கும் காலத் துணைவாக்கியமாக மொழிபெயர்க்கிறது. δέ-ஐ தனியாக ‘இப்போது’ என்று மிகைப்படுத்தவில்லை.
- source_word: πρὸς τὸν λαὸν
  choice: மக்களிடம்
  rationale: λαός இங்கு ஆலயப் பகுதியில் கூடியிருந்த மக்களைக் குறிக்கிறது; ‘கூட்டத்திடம்’ என்பதைவிட ‘மக்களிடம்’ மூலச்சொல்லின் பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: ἐπέστησαν αὐτοῖς
  choice: அவர்களிடம் வந்து நின்றார்கள்
  rationale: வந்து அணுகுதல் அல்லது அருகில் வந்து நிற்றல் என்ற வினையின் பொருளை இயல்பான தமிழில் தருகிறது; ‘எதிர்த்தார்கள்’ என்று பகைமை உணர்வை வினைக்குள் தேவையின்றிச் சேர்க்கவில்லை.
- source_word: οἱ ἱερεῖς
  choice: ஆசாரியர்கள்
  rationale: மூலத்தில் சாதாரண ἱερεῖς என்பதே உள்ளது; ‘தலைமை ஆசாரியர்கள்’ என்று இல்லாத பதவிநிலையைச் சேர்க்கவில்லை.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: ஆலயக் காவல் தலைவர்
  rationale: ஆலய வளாகத்தின் ஒழுங்குக்கும் பாதுகாப்புக்கும் பொறுப்பான அதிகாரியை நவீன வாசகர்கள் புரிந்துகொள்ளும் வகையில் சுருக்கமாகக் குறிப்பிடுகிறது.
- source_word: οἱ Σαδδουκαῖοι
  choice: சதுசேயர்கள்
  rationale: இந்த யூதக் குழுவின் பெயருக்குப் பொதுவாகப் பயன்படுத்தப்படும் தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: அதிகாரிகளின் வருகையில் பகைமை அல்லது மோதல் தொனி உள்ளதா?
  choice: ‘அவர்களிடம் வந்து நின்றார்கள்’ என்று ஒப்பீட்டளவில் நடுநிலையாக மொழிபெயர்த்தல்
  alternative: ‘அவர்களை எதிர்கொண்டார்கள்’
  rationale: தொடர்ந்துவரும் சூழல் அவர்களுடைய எதிர்ப்பைக் காட்டினாலும், ἐπέστησαν என்ற வினை மட்டும் வெளிப்படையாக மோதலைக் கூறவில்லை. ஆகவே கதை உருவாக்கும் பதற்றத்தை முன்கூட்டியே தீர்மானிக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘வந்து நின்றார்கள்’ என்பது இயல்பான பேச்சுநடையையும் மூலவினையின் வருகை/அருகில் நிற்றல் கூறுகளையும் இணைக்கிறது; குறிப்பிட்ட பகைமைத் தொனியைத் திணிக்கவில்லை.
