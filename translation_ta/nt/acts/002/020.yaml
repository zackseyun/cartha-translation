  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: ta
  text: மகத்தானதும் மகிமையானதுமான[a] கர்த்தருடைய நாள் வருவதற்கு முன்பு, சூரியன் இருளாகவும் சந்திரன் இரத்தமாகவும் மாற்றப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“மகிமையான” என்பதற்கு “வெளிப்படையான” அல்லது “குறிப்பிடத்தக்க” என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: ἐπιφανῆ).'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: மாற்றப்படும்
  rationale: எதிர்காலச் செயலப்பாட்டு வடிவத்தையும் உருமாற்றத்தின் தீர்க்கதரிசனப் படிமத்தையும் காக்கிறது.
- source_word: εἰς σκότος
  choice: இருளாக
  rationale: εἰς குறிக்கும் விளைவு அல்லது புதிய நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἰς αἷμα
  choice: இரத்தமாக
  rationale: ‘இரத்தச் சிவப்பாக’ என்று விளக்கிப் பொருளைச் சுருக்காமல், கிரேக்கத்தின் கூர்மையான தீர்க்கதரிசனப் படிமத்தை அப்படியே காக்கிறது.
- source_word: πρὶν ἢ ἐλθεῖν
  choice: வருவதற்கு முன்பு
  rationale: ஒரு நிகழ்வுக்கு முன்னதாக மற்றொன்று நிகழ்வதைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἡμέραν κυρίου
  choice: கர்த்தருடைய ... நாள்
  rationale: தெய்வீகத் தலையீடு அல்லது நியாயத்தீர்ப்பைக் குறிக்கும் நிலைபெற்ற தீர்க்கதரிசனச் சொற்றொடரைப் பாதுகாக்கிறது; வாரத்தின் ஒரு நாளைக் குறிக்கும் பொருளுடன் குழப்பம் ஏற்படுவதையும் தவிர்க்கிறது.
- source_word: μεγάλην
  choice: மகத்தான
  rationale: நாளின் பெருமையை dignified prophetic register-இல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπιφανῆ
  choice: கண்கூடாக வெளிப்படும்
  rationale: இச்சொல்லின் முதன்மையான ‘தெளிவாகத் தோன்றுகிற, வெளிப்படையான, குறிப்பிடத்தக்க’ என்ற பொருள் வட்டத்தை நேரடியாகக் காக்கிறது; ‘மகிமையான’ என்று மட்டும் வழங்கி காட்சிப்படுதலின் நுணுக்கத்தை இழக்கவில்லை.
theological_decisions:
- issue: யோவேல் மேற்கோளின் பின்னணியிலுள்ள ἡμέραν κυρίου என்ற தீர்க்கதரிசனச் சொற்றொடர்
  choice: கர்த்தருடைய நாள்
  alternative: கர்த்தரின் நாள் / ஆண்டவருடைய நாள்
  rationale: பழைய ஏற்பாட்டுத் தீர்க்கதரிசனப் பின்னணியையும் இறைத் தலையீட்டின் உச்ச நாளையும் காக்கிறது; பிற்காலத்தில் ஞாயிற்றுக்கிழமையைக் குறிக்கப் பயன்படும் சொற்றொடருடன் குழப்புவதில்லை.
- issue: ἐπιφανῆ என்பதன் வெளிப்பாடு மற்றும் மகிமை சார்ந்த பொருள் பரப்பு
  choice: கண்கூடாக வெளிப்படும்
  alternative: மகிமையான / குறிப்பிடத்தக்க
  rationale: கிரேக்கச் சொல்லின் ‘தெளிவாகத் தோன்றும்’ என்ற அடிப்படை நுணுக்கத்தை முதன்மைப்படுத்துகிறது. ‘மகிமையான’ என்பதும் சூழலுக்கு ஏற்ற சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தீர்க்கதரிசனப் பாங்கின் மேன்மையையும் கூர்மையான வானியல் படிமங்களையும் காக்கும் நடை. ‘கர்த்தர்’ என்பது κύριος என்பதற்கான மரபறிந்த, தெளிவான வேதாகமத் தமிழ்; வாக்கிய வரிசை தமிழில் இயல்பாக அமைய மாற்றப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொல்லுக்குப் பதிலாக முழு வாக்கியத்தின் முடிவில் வைக்கப்பட்டாலும், அது ἐπιφανῆ என்பதன் மொழிபெயர்ப்பு மாற்றையே விளக்குகிறது.
