source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: ta
  text: '“கடைசி நாட்களில் இவ்வாறு நிகழும், என்று கடவுள் கூறுகிறார்:


    என் ஆவியிலிருந்து[a] அனைத்து மனிதர்கள்மேலும்[b] பொழிவேன்.


    உங்கள் மகன்களும் உங்கள் மகள்களும் தீர்க்கதரிசனம் உரைப்பார்கள்;


    உங்கள் இளைஞர்கள் தரிசனங்களைக் காண்பார்கள்;


    உங்கள் முதிய ஆண்கள் கனவுகள் காண்பார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ἀπό என்ற முன்னிடைச்சொல் இருப்பதால், சொற்சார்ந்து “என் ஆவியிலிருந்து” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொற்சார்ந்து, “எல்லா மாம்சத்தின்மேலும்” என்று உள்ளது; இது மனிதர் அனைவரையும் குறிக்கும் தீர்க்கதரிசன மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: கடைசி நாட்களில்
  rationale: எதிர்கால நிறைவைக் குறிக்கும் கிரேக்க காலவழக்கை மிகையாக விளக்காமல், இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: λέγει ὁ θεός
  choice: என்று கடவுள் கூறுகிறார்
  rationale: மேற்கோள் அறிமுகத்தின் நிகழ்காலத்தையும் தீர்க்கதரிசன அறிவிப்பின் வலிமையையும் காக்கிறது.
- source_word: ἐκχεῶ
  choice: பொழிவேன்
  rationale: திரவத்தைப் பொழியும் மூல உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: என் ஆவியிலிருந்து
  rationale: ἀπό என்பதன் ‘இலிருந்து’ என்ற மூலப்பொருளைக் காக்கிறது; ‘என் ஆவியை’ என்று மட்டும் மாற்றி கிரேக்க முன்னிடைச்சொல்லை மறைக்கவில்லை.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: மனிதர் அனைவர்மேலும்
  rationale: இங்கு σάρξ என்பது மனிதகுலத்தை விரிவாகக் குறிக்கும் தீர்க்கதரிசன மரபுத்தொடர். நவீனத் தமிழில் தவறாக உடல் மாம்சத்தை மட்டும் குறிக்கும் புரிதலைத் தவிர்க்க இயல்பான பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: προφητεύσουσιν
  choice: தீர்க்கதரிசனம் உரைப்பார்கள்
  rationale: தீர்க்கதரிசனப் பேச்சைக் குறிக்கும் வினையின் நேரடியான, கண்ணியமான தமிழ் வடிவம்.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: உங்கள் மகன்களும் உங்கள் மகள்களும்
  rationale: இரு பாலினங்களையும் தனித்தனியாகச் சொல்லும் கிரேக்க வலியுறுத்தலையும் ‘உங்கள்’ என்ற மறுபயன்பாட்டையும் காக்கிறது.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: உங்கள் இளைஞர்கள்
  rationale: வயதையும் ஆண்பால் குழுவையும் சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: ὁράσεις ὄψονται
  choice: தரிசனங்களைக் காண்பார்கள்
  rationale: ‘காட்சிகளைக் காண்பார்கள்’ என்பதைக் காட்டிலும் வெளிப்படுத்தல் சார்ந்த ὁράσεις என்ற சொல்லின் பொருளைத் தெளிவாகக் காட்டி, காணுதல் என்ற இணை வினையையும் காக்கிறது.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: உங்கள் முதிய ஆண்கள்
  rationale: இங்கு பதவியிலுள்ள ‘மூப்பர்கள்’ அல்ல, இளைஞர்களுக்கு எதிராக வயதில் முதிர்ந்த ஆண்களே குறிக்கப்படுவதால் அதைக் தெளிவாக்குகிறது.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: கனவுகள் காண்பார்கள்
  rationale: கிரேக்கத்தின் ஒரே வேர்ச்சொல் சார்ந்த வலியுறுத்தலை தமிழின் இயல்பான ‘கனவு காணுதல்’ என்ற தொடரால் வழங்குகிறது.
theological_decisions:
- issue: ‘எல்லா மாம்சம்’ என்பதன் பரப்பு
  choice: முதன்மை உரையில் ‘மனிதர் அனைவர்மேலும்’; சொற்சார்ந்த உருவகம் அடிக்குறிப்பில்
  alternative: எல்லா மாம்சத்தின்மேலும்
  rationale: இந்தத் தீர்க்கதரிசன மரபுத்தொடர் மனிதர்களை விரிவாகக் குறிக்கிறது. ‘அனைவர்’ என்பதன் பரப்பை எந்தக் குறிப்பிட்ட சமூகத்திற்கும் சுருக்காமல் வைத்தபடி, மூல உருவகத்தை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: πνεῦμα என்பதன் இறைசார் குறிப்பு
  choice: என் ஆவி
  alternative: என் உயிர்மூச்சு / என் மனப்பாங்கு
  rationale: பேசுபவர் கடவுள் என்பதாலும், பொழியப்படும் πνεῦμα கடவுளுடைய ஆவியைக் குறிப்பதாலும் ‘ஆவி’ என்று மொழிபெயர்க்கப்படுகிறது; ஆளற்ற சக்தி அல்லது மனநிலையாகக் குறுக்கப்படவில்லை.
- issue: ἀπὸ என்பதன் பொருள்
  choice: என் ஆவியிலிருந்து
  alternative: என் ஆவியை
  rationale: கிரேக்க உரை நேரடியாக ‘என் ஆவியிலிருந்து’ என்கிறது. இந்தச் சொற்றொடரால் எழக்கூடிய இறையியல் நுட்பத்தை மொழிபெயர்ப்பில் அமைதியாக நீக்காமல் காக்கிறது; அதேவேளை கடவுளின் ஆவி பிளவுபடுகிறது என்று விளக்கம் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில், வாசிக்க எளிதானதாயும் தீர்க்கதரிசன மேற்கோளுக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘மனிதர் அனைவரும்’ என்ற இயல்பான நடை பயன்படுத்தப்பட்டாலும், ‘மாம்சம்’ என்ற மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. ஆண் வயதுக் குழுக்களைத் தெளிவாக்க ‘இளைஞர்கள்’ மற்றும் ‘முதிய ஆண்கள்’ பயன்படுத்தப்பட்டுள்ளன.
