    reason: ἐπὶ τὸ αὐτό என்பதன் சொற்பொருள் மற்றும் தொடரியல் தெளிவின்மையைப் பாதுகாக்கிறது; இச்சூழலில் சமூகத்தோடு சேர்த்தல் என்ற சாத்தியமான பொருளையும் மாற்றாமல் வைத்திருக்கிறது.
