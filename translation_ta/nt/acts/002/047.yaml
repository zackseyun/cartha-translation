  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: ta
  text: தேவனைப் புகழ்ந்துகொண்டும், மக்கள் அனைவரின் நன்மதிப்பைப் பெற்றுக்கொண்டும் இருந்தார்கள். ஆண்டவர் நாள்தோறும் மீட்கப்படுகிறவர்களை அவர்களோடு[a] சேர்த்துவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களோடு” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொற்றொடரை “ஒருமித்து” அல்லது “ஒரே இடத்தில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: ἐπὶ τὸ αὐτό என்பதன் சொற்பொருள் மற்றும் தொடரியல் தெளிவின்மையைப் பாதுகாக்கிறது; இச்சூழலில் சமூகத்தோடு சேர்த்தல் என்ற சாத்தியமான பொருளையும் மாற்றாமல் வைத்திருக்கிறது.
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: தேவனைப் புகழ்ந்துகொண்டும்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான செயலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: மக்கள் அனைவரின் நன்மதிப்பைப் பெற்றுக்கொண்டும்
  rationale: இச்சொற்றொடர் பொதுவாக மற்றவர்களின் ஆதரவு அல்லது நன்மதிப்பைப் பெற்றிருப்பதைக் குறிக்கிறது; அவர்களுக்கு நன்மை செய்வதாக மாற்றிப் பொருள் கொள்ளவில்லை.
- source_word: ὁ δὲ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழாக்கம்; δέ-யின் மென்மையான தொடர்ச்சி தமிழ் வாக்கிய ஓட்டத்தில் தனியே வெளிப்படுத்தப்பட வேண்டியதில்லை.
- source_word: προσετίθει
  choice: சேர்த்துக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ந்து அல்லது மீண்டும் நிகழ்ந்த செயலைப் பாதுகாக்கிறது.
- source_word: τοὺς σῳζομένους
  choice: மீட்கப்பட்டுக்கொண்டிருந்தவர்களை
  rationale: நிகழ்காலச் செயப்பாட்டு பங்கேற்புவினையின் நடந்துகொண்டிருக்கும் தன்மையையும், மீட்பின் செய்பவர் மறைமுகமாக இருப்பதையும் பாதுகாக்கிறது.
- source_word: καθ’ ἡμέραν
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் தொடர்ந்து நிகழ்ந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐπὶ τὸ αὐτό
  choice: அவர்களோடு
  rationale: προσετίθει உடன் வரும் சூழலில் ஏற்கெனவே இருந்த சமூகத்தோடு சேர்த்தல் என்ற சாத்தியமான பொருளை இயல்பாகத் தருகிறது; சொற்றொடரின் பிற சாத்தியப் பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
theological_decisions:
- issue: τοὺς σῳζομένους என்பதில் மீட்பின் காலநிலை மற்றும் செயப்பாட்டு வடிவம்
  choice: மீட்கப்பட்டுக்கொண்டிருந்தவர்களை
  alternative: மீட்கப்பட்டவர்கள்
  rationale: கிரேக்க நிகழ்காலச் செயப்பாட்டு வடிவம் மீட்பை நடந்துகொண்டிருக்கும் செயலாகக் காட்டுகிறது. அதை முடிந்த நிலையாக மாற்றாமல், எந்தக் கோட்பாட்டு வரிசையையும் திணிக்காமல் மொழிபெயர்க்கிறது.
- issue: ἐπὶ τὸ αὐτό என்பதன் பொருள்
  choice: அவர்களோடு
  alternative: ஒருமித்து; ஒரே இடத்தில்
  rationale: சூழலில் ஆண்டவர் விசுவாசிகளின் சமூகத்தோடு மக்களைச் சேர்த்தார் என்பது பொருத்தமாக இருந்தாலும், கிரேக்கச் சொற்றொடரின் உண்மையான பொருள் வாய்ப்புகளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான செயல்களைத் தமிழ் துணைவினை அமைப்புகள் மூலம் வெளிப்படுத்தியுள்ளோம்; மூலத்தின் இறையியல் பதற்றமும் ἐπὶ τὸ αὐτό என்பதன் தெளிவின்மையும் தீர்த்துவிடப்படவில்லை.
