  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: ta
  text: ஆகவே, அவருடைய வார்த்தையை ஏற்றுக்கொண்டவர்கள் திருமுழுக்கு பெற்றனர்; அந்த நாளில் ஏறக்குறைய மூவாயிரம் பேர்[a] சேர்க்கப்பட்டனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “ஆத்துமாக்கள்”; இது மனிதர்களை எண்ணிக் குறிப்பிடும் வழக்கமான சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: ஆகவே, ...வர்கள்
  rationale: முந்தைய உரையிலிருந்து வரும் விளைவையும் கதைத் தொடர்ச்சியையும் இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: ἀποδεξάμενοι
  choice: ஏற்றுக்கொண்டவர்கள்
  rationale: செய்தியை மனப்பூர்வமாகவும் சாதகமாகவும் பெற்றுக்கொண்டதைக் காட்டுகிறது; தேவையற்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: τὸν λόγον αὐτοῦ
  choice: அவருடைய வார்த்தையை
  rationale: λόγος என்பதன் மூலச்சொல் தொடர்பைத் தக்கவைத்துக்கொண்டு, இங்கு பேதுருவின் அறிவிப்பைக் குறிக்கும் வகையில் தமிழில் இயல்பாக உள்ளது.
- source_word: ἐβαπτίσθησαν
  choice: திருமுழுக்குப் பெற்றார்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தை இயல்பாகத் தருகிறது; அதன் முறை அல்லது விளைவு குறித்த எந்தச் சபைப்பிரிவு சார்ந்த விளக்கத்தையும் சேர்க்கவில்லை.
- source_word: προσετέθησαν
  choice: சேர்க்கப்பட்டார்கள்
  rationale: செயப்பாட்டு வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது. யாருடன் அல்லது எதனுடன் சேர்க்கப்பட்டார்கள் என்பதை மூலவசனம் வெளிப்படையாகக் கூறாததால் அது நிரப்பப்படவில்லை.
- source_word: ψυχαὶ
  choice: பேர்
  rationale: இங்கு ψυχαί மனிதர்களை எண்ணிக் குறிப்பிடும் வழக்குச் சொல்லாக உள்ளது. நவீன தமிழில் ‘பேர்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது; ‘ஆத்துமாக்கள்’ என்ற சொல் தேவையற்ற மானிடவியல் பொருளைத் தூண்டக்கூடும். சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὡσεὶ τρισχίλιαι
  choice: ஏறக்குறைய மூவாயிரம்
  rationale: ὡσεί காட்டும் தோராயத்தன்மையைத் தெளிவான, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: அந்த நாளில்
  rationale: காலக் குறிப்பை நவீன தமிழின் இயல்பான வழக்கில் தருகிறது.
theological_decisions:
- issue: ‘சேர்க்கப்பட்டார்கள்’ என்பதன் இலக்கைச் சபை அல்லது விசுவாசிகளின் கூட்டம் என வெளிப்படையாகக் குறிப்பிடலாமா?
  choice: இலக்கை நிரப்பாமல் ‘சேர்க்கப்பட்டார்கள்’ என்று விடப்பட்டுள்ளது.
  alternative: அவர்களுடன் சேர்க்கப்பட்டார்கள்; சபையில் சேர்க்கப்பட்டார்கள்
  rationale: சூழல் விசுவாசிகளின் சமூகத்தைக் குறித்தாலும், இவ்வசனத்தின் கிரேக்க உரை இலக்கை வெளிப்படையாகக் கூறவில்லை. ஆகவே வசனம் தருவதைவிட விரிவான திருச்சபையியல் கூற்றை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: ψυχαί என்பதன் மானிடவியல் பொருள்
  choice: முதன்மை உரையில் ‘பேர்’ என்று மொழிபெயர்த்து, சொற்பொருளை அடிக்குறிப்பில் காட்டப்பட்டுள்ளது.
  alternative: ஆத்துமாக்கள்
  rationale: இங்கு இச்சொல் முழு மனிதர்களை எண்ணிக் குறிப்பிடுகிறது; உடலிலிருந்து பிரிந்த ஆத்துமாக்களைப் பற்றிய தொழில்நுட்பக் கூற்றாக வாசிக்கத் தூண்டாமல், மூலச்சொல்லின் வடிவம் அடிக்குறிப்பில் வெளிப்படுத்தப்படுகிறது.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழாகவும், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையாகவும் வைக்கப்பட்டுள்ளது. ‘திருமுழுக்கு’ என்பது இங்கு நிகழ்வைக் குறிப்பிடுகிறது; அதன் முறை அல்லது இறையியல் விளைவு மொழிபெயர்ப்பில் வரையறுக்கப்படவில்லை.
