id: ACT.2.43
reference: Acts 2:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: ta
  text: ஒவ்வொருவரையும் பயம் ஆட்கொண்டது[a]; அப்போஸ்தலர்கள் வழியாகப் பல அற்புதங்களும் அடையாளங்களும் நிகழ்ந்துகொண்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அனைவரையும் பிரமிப்பு ஆட்கொண்டது.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “ஒவ்வோர் ஆன்மாவுக்கும் பயம் உண்டாயிற்று.”
    reason: φόβος என்பது ‘பயம்’ அல்லது ‘பிரமிப்பு’ எனப் பொருள்படலாம்; πάσῃ ψυχῇ என்பதன் நேரடி கிரேக்க வடிவத்தையும் இக்குறிப்பு காட்டுகிறது.
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: பயம் ஆட்கொண்டது
  rationale: γίνομαι என்பதன் நிறைவுறாத இறந்தகால வடிவமும் φόβος என்பதும் சேர்ந்து, பயம் எழுந்து மக்கள்மேல் படர்ந்ததைத் தெரிவிக்கின்றன. ‘பயம் ஆட்கொண்டது’ என்பது இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் நிகழ்ச்சித் தொடரை மட்டும் குறிக்கிறது. தமிழில் வசனத்தின் தொடர்ச்சியே இதை இயல்பாக உணர்த்துவதால் ‘ஆனால்’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: πάσῃ ψυχῇ
  choice: ஒவ்வொருவரையும்
  rationale: சொல்லுக்குச் சொல் ‘ஒவ்வோர் ஆன்மாவுக்கும்’ என்றாலும், இச்சூழலில் ψυχή ஒவ்வொரு நபரையும் குறிக்கும் கிரேக்க மரபுத்தொடர். நவீனத் தமிழில் ‘ஒவ்வொருவரையும்’ என்பது பொருளைத் தெளிவாகத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: φόβος
  choice: பயம்
  rationale: φόβος என்பது பயத்தையும் பிரமிப்புடன் கூடிய அச்சத்தையும் குறிக்கக்கூடும். ‘பயம்’ என்ற நேரடி சொல் அந்த அர்த்தப் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- source_word: πολλά
  choice: பல
  rationale: அதிக எண்ணிக்கையை இயல்பாகவும் சுருக்கமாகவும் குறிக்கும் தமிழ் இணை.
- source_word: τέρατα
  choice: அற்புதங்கள்
  rationale: τέρατα செயல்களின் வியப்பூட்டும் தன்மையை வலியுறுத்துகிறது. ‘அற்புதங்கள்’ என்பது σημεῖα என்பதற்கான ‘அடையாளங்கள்’ என்பதிலிருந்து வேறுபாட்டையும் வழக்கமான இணைச்சொல் அமைப்பையும் காக்கிறது.
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: σημεῖα அச்செயல்கள் வேறொன்றைச் சுட்டிக்காட்டும் சான்றுகளாக இருப்பதை வலியுறுத்துகிறது; ‘அடையாளங்கள்’ அந்த நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: διὰ τῶν ἀποστόλων
  choice: அப்போஸ்தலர்கள் வழியாக
  rationale: διά + உரிமை வேற்றுமை இடைநிலை முகமை அல்லது கருவியைக் குறிக்கிறது. ‘வழியாக’ என்பது அப்போஸ்தலர்கள் கருவிகளாக இருந்ததைச் சொல்கிறது; இறுதிச் செயல்பாட்டாளரை உரையில் இல்லாதவாறு வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: ἐγίνετο
  choice: நிகழ்ந்துகொண்டிருந்தன
  rationale: இரண்டாவது ἐγίνετο நிறைவுறாத இறந்தகாலத்தில் இருப்பதால், அற்புதங்களும் அடையாளங்களும் தொடர்ந்து நிகழ்ந்ததை ‘நிகழ்ந்துகொண்டிருந்தன’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அப்போஸ்தலர் வழியாக நிகழ்ந்த செயல்களுக்கு மக்களின் எதிர்வினையாக வரும் φόβος என்பதன் நுட்பம்
  choice: பயம்
  alternative: பிரமிப்பு / பயபக்தி
  rationale: இந்தச் சொல் அச்சத்தையும் தெய்வீகச் செயலால் உண்டாகும் ஆழ்ந்த பிரமிப்பையும் உள்ளடக்க முடியும். ‘பயம்’ என்பது அதன் நேரடி வலிமையைப் பாதுகாத்து, அதை வெறும் ‘பயபக்தி’ என்று விளக்கி இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அப்போஸ்தலர்கள்’, ‘அற்புதங்கள்’, ‘அடையாளங்கள்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக இருப்பதால் வைக்கப்பட்டுள்ளன; பழமையான வாக்கிய அமைப்பு தவிர்க்கப்பட்டுள்ளது.
