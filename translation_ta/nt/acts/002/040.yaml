    rationale: “மேலும் பல வார்த்தைகளால்” பலவற்றைக் காட்டினாலும், “வேறு பல வார்த்தைகளாலும்” என்பது πλείοσιν மற்றும் ἑτέροις ஆகிய இரு கூறுகளையும் நேரடியாகக் காக்கிறது.
