source:
  edition: SBLGNT
  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: ta
  text: வேறு பல வார்த்தைகளாலும் அவர் அவர்களுக்குச் ஆணித்தரமாகச் சாட்சியளித்தார்; அவர்களைத் தொடர்ந்து வலியுறுத்தியும், “இந்த வக்கிரமான தலைமுறையிலிருந்து மீட்கப்படுங்கள்” என்று கூறினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வக்கிரமான தலைமுறையிலிருந்து உங்களைக் காப்பாற்றிக்கொள்ளுங்கள்.” கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவில், “மீட்கப்படுங்கள்” என்று உள்ளது; ஆனால் கேட்போர் பதிலளிக்க வேண்டிய அழைப்பை வெளிப்படுத்த சில மொழிபெயர்ப்புகள் அதை அதிக வினையாற்றும் வகையில் தருகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: மேலும் பல வார்த்தைகளால்
  rationale: கருவிப்பொருள் தரும் வேற்றுமையையும், பேதுரு இன்னும் பலவற்றைக் கூறியதையும் இயல்பான தமிழில் எடுத்துரைக்கிறது; ἑτέροις என்பதன் ‘வேறு/கூடுதல்’ கருத்தை ‘மேலும்’ தக்கவைக்கிறது.
- source_word: διεμαρτύρατο
  choice: ஆணித்தரமாகச் சாட்சியளித்து
  rationale: διαμαρτύρομαι என்பதிலுள்ள வலியுறுத்தப்பட்ட, பொறுப்புணர்வுமிக்க சாட்சியின் நயத்தைப் பாதுகாக்கிறது; இதை வெறும் எச்சரிக்கையாகக் குறுக்கவில்லை.
- source_word: παρεκάλει
  choice: தொடர்ந்து வலியுறுத்தினார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் காட்டும் தொடர்ந்த அல்லது திரும்பத் திரும்ப நிகழ்ந்த வேண்டுகோளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτοὺς
  choice: அவர்களுக்கு
  rationale: பேதுருவின் உரையைக் கேட்டுக்கொண்டிருந்தவர்களைக் குறிக்கும்; ‘சாட்சியளித்தார்’ என்பதுடன் தமிழில் இயல்பாக அமையும் வகையில் நான்காம் வேற்றுமையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Σώθητε
  choice: மீட்கப்படுங்கள்
  rationale: σῴζω என்பதன் இறந்தகாலச் செயலேவல், செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, உண்மையான பதிலளிப்புக்கான அழைப்பையும் தக்கவைக்கிறது; மனிதர்கள் தாங்களே தங்களை மீட்பதாகக் கூறவில்லை.
- source_word: ἀπὸ
  choice: இலிருந்து
  rationale: பிரிவு அல்லது விலகலைக் குறிக்கும் ἀπό என்பதற்கான நேரான, இயல்பான தமிழ் இணை.
- source_word: γενεᾶς
  choice: தலைமுறையிலிருந்து
  rationale: γενεά என்பதன் தலைமுறை/சமகால மக்கள் என்ற பொருளை வேதாகமப் பயன்பாட்டோடு தக்கவைக்கிறது; பொதுவாக ‘மக்கள்’ என்று விரிவுபடுத்தவில்லை.
- source_word: σκολιᾶς
  choice: கோணலான
  rationale: σκολιός என்பதிலுள்ள நேர்மையிலிருந்து வளைந்துபோன நிலையைச் சுட்டும் உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது; ‘வக்கிரமான’ என்பதைவிட இன்றைய பொதுவாசகருக்கு எளிதில் புரியும்.
theological_decisions:
- issue: Σώθητε என்பதில் செயப்பாட்டு வடிவமும் மனிதப் பதிலளிப்பும்
  choice: மீட்கப்படுங்கள்
  alternative: இந்தக் கோணலான தலைமுறையிலிருந்து உங்களைக் காப்பாற்றிக்கொள்ளுங்கள்
  rationale: கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவத்தில் உள்ளது. ஆகவே மீட்பு மனிதரின் தனித்த முயற்சியால் நிகழ்வதாகத் தோன்றாமல் அந்த வடிவம் பாதுகாக்கப்படுகிறது; அதே நேரத்தில் செயலேவல் அவர்களிடம் உண்மையான பதிலை வேண்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் உரையின் ஆணித்தரமான சாட்சி மற்றும் தொடர்ந்த வேண்டுகோளின் கண்ணியமான தொனியையும் காக்கும் வகையிலும் அமைக்கப்பட்டுள்ளது. ‘கோணலான’ என்பது மூலத்தின் ஒழுக்க உருவகத்தை நேரடியாக வைத்திருக்கிறது; ‘மீட்கப்படுங்கள்’ என்பது செயப்பாட்டு வடிவிலுள்ள இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
