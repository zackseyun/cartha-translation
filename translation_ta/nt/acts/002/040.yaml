revisions:
- from: 'மேலும் பல வார்த்தைகளால் அவர் அவர்களுக்கு ஆணித்தரமாகச் சாட்சியளித்து, தொடர்ந்து வலியுறுத்தினார்[a]: “இந்தக் கோணலான தலைமுறையிலிருந்து மீட்கப்படுங்கள்” என்றார்.'
  to: வேறு பல வார்த்தைகளாலும் அவர் அவர்களுக்குச் ஆணித்தரமாகச் சாட்சியளித்தார்; அவர்களைத் தொடர்ந்து வலியுறுத்தியும், “இந்த வக்கிரமான தலைமுறையிலிருந்து மீட்கப்படுங்கள்” என்று கூறினார்.[a]
  rationale: மேற்கோளுக்கு முன் உள்ள λέγων-ஐ “என்று கூறினார்” என ஒருமுறை மட்டுமே இயல்பாகத் தரும் வகையில் வாக்கியம் மறுசீரமைக்கப்பட்டது. “வேறு பல வார்த்தைகளாலும்” ἑτέροις τε λόγοις πλείοσιν என்பதன் இரு கூறுகளையும் காக்கிறது. “வக்கிரமான” σκολιός-இன் ஒழுக்க வளைவு உருவகத்தைத் தக்கவைக்கும் இயல்பான நவீன வேதாகமத் தமிழ் சொல். Σώθητε-க்கான “மீட்கப்படுங்கள்” மாற்றப்படவில்லை.
