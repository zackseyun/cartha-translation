source:
  edition: SBLGNT
  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: ta
  text: அந்த நாட்களில், என் ஆண் அடிமைகள்மேலும் என் பெண் அடிமைகள்மேலும்[a] கூட என் ஆவியிலிருந்து ஊற்றுவேன்[b]; அவர்களும் இறைவாக்குரைப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் ஆண் பணியாளர்கள்மேலும் என் பெண் பணியாளர்கள்மேலும்.’ கிரேக்கச் சொற்கள் பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம்; இங்கு சமூகத்தில் தாழ்ந்த நிலையினருக்கும் ஆவி அருளப்படுவதை வலியுறுத்துவதால் ‘அடிமைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் ஆவியை ஊற்றுவேன்.’ கிரேக்கத்தில் இன்னும் நேரடியாக, ‘என் ஆவியிலிருந்து’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: கூட
  rationale: முந்தைய கூற்றை வலியுறுத்தி, சமூகத்தில் தாழ்ந்த நிலையில் இருந்தவர்களையும் உள்ளடக்கும் உச்ச அழுத்தத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: என் ஆண் அடிமைகள்மேலும் பெண் அடிமைகள்மேலும்
  rationale: δοῦλος/δούλη என்பவை இங்கு அடிமை நிலையையும் ஆண்–பெண் வேறுபாட்டையும் வெளிப்படையாகக் குறிக்கின்றன; இரண்டையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: அந்த நாட்களில்
  rationale: காலத்தையும் சுட்டுப்பொருளையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐκχεῶ
  choice: ஊற்றுவேன்
  rationale: திரளாக வழங்குவதைச் சித்தரிக்கும் ஊற்றுதல் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: என் ஆவியிலிருந்து
  rationale: ἀπό என்ற முன்னிடைச்சொல்லின் ‘இலிருந்து’ பொருளை வெளிப்படையாகக் காக்கிறது; ‘என் ஆவியை’ என்று மாற்றி மூலத்தின் நுணுக்கத்தை மறைக்கவில்லை.
- source_word: προφητεύσουσιν
  choice: இறைவாக்குரைப்பார்கள்
  rationale: தெய்வத்திடமிருந்து பெற்ற செய்தியை அறிவித்தல் என்ற வினையின் பொருளை நவீன, மரியாதையான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: δοῦλος/δούλη என்பவற்றின் சமூக நிலை சார்ந்த பொருள்
  choice: ஆண் அடிமைகள் / பெண் அடிமைகள்
  alternative: ஆண் பணியாளர்கள் / பெண் பணியாளர்கள்
  rationale: ஆண், பெண் அடிமைகள் இருவரையும் குறிப்பது ஆவியின் அருள் தாழ்ந்த சமூக நிலையினரையும் சென்றடைவதை வலியுறுத்துகிறது; ‘பணியாளர்’ அந்த வலிமையைத் தணிக்கக்கூடும்.
- issue: ἀπὸ τοῦ πνεύματός μου என்பதிலுள்ள ἀπό
  choice: என் ஆவியிலிருந்து
  alternative: என் ஆவியை
  rationale: மூலத்தின் ‘இலிருந்து’ என்ற வடிவத்தைப் பாதுகாத்து, அது எழுப்பும் உருவக நுணுக்கத்தையும் தெளிவாகத் தீர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இறைவாக்குரைப்பார்கள்’ என்பது வேதாகமக் கருத்தைத் தக்கவைத்தபடியே ‘தீர்க்கதரிசனம் சொல்வார்கள்’ என்பதைக் காட்டிலும் இயல்பான வினை வடிவமாகப் பயன்படுத்தப்பட்டது. ‘அவர்களும்’ என்பது பட்டியலில் குறிப்பிடப்பட்ட அடிமைகளும் இறைவாக்குரைப்பார்கள் என்ற தொடர்ச்சியை இயல்பாக்குகிறது.
