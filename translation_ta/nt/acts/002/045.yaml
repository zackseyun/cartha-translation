  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: ta
  text: அவர்கள் தங்கள் சொத்துகளையும் உடைமைகளையும் விற்று, அவற்றை அனைவருக்கும் அவரவர் தேவைக்கேற்பப் பகிர்ந்தளித்து வந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சொத்துகளையும் உடைமைகளையும்’ என்பதற்குப் பதிலாக, ‘நிலங்களையும் உடைமைகளையும்’ என்றும் மொழிபெயர்க்கலாம். முதல் கிரேக்கச் சொல் பெரும்பாலும் நிலம் உள்ளிட்ட சொத்து வைத்திருப்புகளைக் குறிக்கலாம்; இரண்டாவது சொல் உடைமைகள் அல்லது சொந்தப் பொருட்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: நிலங்கள்
  rationale: இச்சொல் பொதுவாகச் சொத்துகளைக் குறித்தாலும், குறிப்பாக நிலம் போன்ற அசையாச் சொத்துகளைக் குறிக்க முடியும். அடுத்து வரும் ὑπάρξεις என்பதிலிருந்து வேறுபாட்டைக் காக்க இங்கு ‘நிலங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὑπάρξεις
  choice: உடைமைகள்
  rationale: ஒருவருக்குச் சொந்தமான பொருட்கள் அல்லது உடைமைகளை இச்சொல் குறிக்கிறது. κτήματα என்பதிலிருந்து இயல்பான வேறுபாட்டைக் காட்ட ‘உடைமைகள்’ பொருத்தமானது.
- source_word: ἐπίπρασκον
  choice: விற்று ... வந்தார்கள்
  rationale: இறந்தகால நிறைவுறா வினை வடிவம் தொடர்ந்து அல்லது அவ்வப்போது நிகழ்ந்த செயலைக் காட்டுகிறது; ஒரே தடவையில் அனைத்தையும் விற்றதாகக் கூறாமல் அந்த அம்சத்தை இம்மொழியாக்கம் காக்கிறது.
- source_word: διεμέριζον
  choice: பகிர்ந்தளித்து வந்தார்கள்
  rationale: சமூகத்தினரிடையே பொருட்களையோ அவற்றின் பயனையோ தேவைக்கேற்ப ஒதுக்கிக் கொடுத்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: αὐτά
  choice: அவற்றை
  rationale: கிரேக்கப் பிரதிப்பெயர் முன்கூறிய நிலங்களையும் உடைமைகளையும், அல்லது சூழலால் அவற்றை விற்றதால் கிடைத்தவற்றையும் குறிக்கலாம். ‘அவற்றை’ அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: πᾶσιν
  choice: அனைவருக்கும்
  rationale: பெறுபவர்களை விரிவாகக் குறிக்கும் பன்மை வேற்றுமையின் பொருளை நேரடியாகத் தருகிறது.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: ஒவ்வொருவருக்கும் தேவை இருந்ததற்கேற்ப
  rationale: யாருக்கு எவ்வளவு தேவை இருந்ததோ அதற்கேற்ப பகிர்ந்தளிக்கப்பட்டது என்ற நிபந்தனைசார், தனிநபர் தேவையை மையப்படுத்திய பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: நம்பிக்கையாளர்கள் உடைமைகளைப் பகிர்ந்துகொண்டதன் தன்மை
  choice: தேவைக்கு ஏற்ப நிலங்களையும் உடைமைகளையும் தொடர்ந்து அல்லது அவ்வப்போது விற்றுப் பகிர்ந்த நடைமுறையாக வசனம் விவரிக்கிறது; தனியுடைமை முற்றிலும் ஒழிக்கப்பட்டதாக மொழிபெயர்ப்பு கூறவில்லை.
  alternative: எல்லாக் கிறிஸ்தவர்களுக்கும் கட்டாயமான முழுமையான பொதுவுடைமையை இவ்வசனம் போதிக்கிறது என்று வாசித்தல்.
  rationale: நிறைவுறா வினை வடிவங்கள் தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த செயல்களைக் காட்டுகின்றன. ஆனால் தனியுடைமை அனைத்தும் ஒழிந்தது என்றோ, இது எல்லாக் காலத்திற்குமான கட்டளை என்றோ மூலவாசகம் வெளிப்படையாகக் கூறவில்லை. ஆகவே மொழிபெயர்ப்பு விவரிப்புத் தன்மையைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விற்று ... பகிர்ந்தளித்து வந்தார்கள்’ என்பது இரண்டு கிரேக்க நிறைவுறா வினைகளின் தொடர்ச்சியான அல்லது மீள்நிகழும் அம்சத்தை வெளிப்படுத்துகிறது; ‘அவற்றை’ என்பது விற்கப்பட்ட உடைமைகளையா அல்லது கிடைத்த வருவாயையா குறிக்கிறது என்ற மூலத்தின் சுருக்கமான தெளிவின்மையைத் தக்கவைக்கிறது.
