  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கேலி செய்து’ இகழ்ச்சித் தொனியைத் தக்கவைக்கிறது; ‘சொல்லிக்கொண்டிருந்தார்கள்’ மூலத்தின் imperfect aspect-ஐ இயல்பாக வெளிப்படுத்துகிறது.
