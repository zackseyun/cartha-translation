- from: ஆனால் வேறு சிலர் கேலி செய்து, “இவர்கள் இனிய திராட்சை மதுவால் நிறைந்திருக்கிறார்கள்[a]” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  to: ஆனால் வேறு சிலர் கேலி செய்து, “இவர்கள் இனிப்பான திராட்சை மதுவால் நிறைந்திருக்கிறார்கள்[a]” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  rationale: The revision changes only the potentially misleading Tamil adjective ‘இனிய’ to ‘இனிப்பான,’ preserving the lexical sense of γλεῦκος. The footnote is tightened to present the legitimate alternative ‘new wine’ while avoiding an overly definite account of fermentation.
