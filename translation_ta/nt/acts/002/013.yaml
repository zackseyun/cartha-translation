  text: ἕτεροι δὲ ⸀διαχλευάζοντες ἔλεγον ὅτι Γλεύκους μεμεστωμένοι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/013.yaml
  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: ta
  text: ஆனால் வேறு சிலர் கேலி செய்து, “இவர்கள் இனிப்பான திராட்சை மதுவால் நிறைந்திருக்கிறார்கள்[a]” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புதிய மதுவால் நிறைந்திருக்கிறார்கள்.” கிரேக்கச் சொல் γλεῦκος இனிப்பான, புதிய திராட்சை மதுவைக் குறிக்கிறது; பாரம்பரியமான ‘புதிய மது’ என்ற மொழிபெயர்ப்பும் சாத்தியமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: வேறு சிலர்
  rationale: முந்தைய வசனத்தில் வியந்தவர்களிலிருந்து வேறுபட்ட இன்னொரு குழுவைக் குறிக்கும் பெயர்ச்சொல் பயன்பாடு; தமிழில் ‘வேறு சிலர்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தின் நேர்மறையான வியப்புக்கு மாறான எதிர்வினையைத் தெளிவாகக் காட்டுகிறது.
- source_word: διαχλευάζοντες
  choice: கேலி செய்து
  rationale: இகழ்ச்சியோடு பரிகசிப்பதைக் குறிக்கும் வினையெச்சத்தின் தொனியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சை வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: நேரடிக் கூற்றை அறிமுகப்படுத்தும் மேற்கோள்
  rationale: இங்கு கூற்றின் உள்ளடக்கத்தைத் தமிழில் இயல்பான நேரடிப் பேச்சாக வழங்குகிறது.
- source_word: Γλεύκους
  choice: இனிய திராட்சை மது
  rationale: γλεῦκος என்பது இனிப்புச் சுவையுள்ள புதிய அல்லது புளித்துவரும் திராட்சை மதுவைக் குறிக்கிறது; ‘இனிய திராட்சை மது’ அதன் முதன்மையான சொல்லியல் அம்சத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: μεμεστωμένοι εἰσίν
  choice: நிறைந்திருக்கிறார்கள்
  rationale: நிறைவடைந்த நிலையில் இருப்பதைக் குறிக்கும் perfect passive participle மற்றும் copula இணைப்பை இயல்பான தமிழில் காட்டுகிறது; சூழலில் குடிபோதையைக் கேலியாகச் சுட்டுகிறது, ஆனால் மொழிபெயர்ப்பு அதை விளக்கமாகச் சேர்க்கவில்லை.
