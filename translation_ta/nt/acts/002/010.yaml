lexical_decisions:
- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: பிரிகியா, பம்பிலியா
  rationale: இரு மண்டலப் பெயர்களும் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன. τε καὶ இங்கு பட்டியலின் உறுப்புகளை இணைப்பதால், தமிழ்ப் பட்டியல் நடைக்கு ஏற்ப காற்புள்ளி போதுமானது.
- source_word: Αἴγυπτον
  choice: எகிப்து
  rationale: நாட்டின் தமிழில் பரவலாக அறியப்பட்ட பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην
  choice: சிரேனேக்கு அருகிலுள்ள லிபியாவின் பகுதிகள்
  rationale: μέρη என்பதன் ‘பகுதிகள்’ என்ற பொருள் நேரடியாக வைக்கப்பட்டுள்ளது. κατὰ Κυρήνην சிரேனேயுடன் தொடர்புடைய லிபியப் பகுதிகளைக் குறிக்கிறது; ‘அருகிலுள்ள’ என்பது திசை அல்லது நிர்வாக எல்லையை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் இயல்பான தமிழில் அந்தப் பிராந்தியத் தொடர்பைத் தெரிவிக்கிறது.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: இங்கு தற்காலிகமாகத் தங்கியிருக்கும் ரோமர்கள்
  rationale: ἐπιδημοῦντες நிரந்தரக் குடியிருப்பை அல்ல, ஒரு இடத்தில் வருகையாளர்களாக அல்லது தற்காலிகமாகத் தங்கியிருப்பதைக் குறிக்கிறது. ‘இங்கு’ என்பது பட்டியல் கூறப்படும் இடத்தில் அவர்கள் தங்கியிருந்தனர் என்ற பங்கேற்புச் சொல்லின் இயல்பான தமிழாக்கம்; Ῥωμαῖοι ‘ரோமர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
