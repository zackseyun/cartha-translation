translation_notes:
  register: நவீனத் தரத் தமிழில், புவியிடப் பெயர்களின் பட்டியல் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இது அடுத்த வசனத்துடன் தொடரும் வாக்கியத் துணுக்கு என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
