source:
  edition: SBLGNT
  text: καὶ πῶς ἡμεῖς ἀκούομεν ἕκαστος τῇ ἰδίᾳ διαλέκτῳ ἡμῶν ἐν ᾗ ἐγεννήθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: ta
  text: நாம் ஒவ்வொருவரும் நாம் பிறந்த நம் சொந்த மொழியிலே கேட்பது எப்படி?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் ஒவ்வொருவரும் நாம் பிறந்த நம் சொந்த வட்டார மொழியிலே கேட்பது எப்படி?”
    reason: 'διάλεκτος என்பதற்கு ‘மொழி’ அல்லது ‘வட்டார மொழி’ எனப் பொருள் கொள்ளலாம். ἐν ᾗ ἐγεννήθημεν என்பது அந்த மொழி அல்லது வட்டார மொழியையே குறிக்கிறது: ‘நாம் பிறந்த [மொழியில்].’'
lexical_decisions:
- source_word: πῶς
  choice: எப்படி
  rationale: வியப்புடன் எழுப்பப்படும் கேள்வியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡμεῖς … ἕκαστος
  choice: நாம் ஒவ்வொருவரும்
  rationale: ἡμεῖς என்பதன் வலியுறுத்தலையும் ἕκαστος என்பதன் தனித்தனியான பகிர்வுப் பொருளையும் காக்கிறது.
- source_word: ἀκούομεν
  choice: கேட்பது
  rationale: கிரேக்கத்தில் நேரடி கருமம் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் இச்சூழலின் பொருளை இயல்பாக்க ‘பேசப்படுவதைக் கேட்பது’ என்று வழங்கப்பட்டுள்ளது.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: தமது சொந்த மொழியிலேயே
  rationale: διάλεκτος என்பது ‘மொழி’ அல்லது ‘வட்டார மொழி’ எனப் பொருள்படலாம்; இங்கு பொதுவாசகருக்குத் தெளிவான ‘மொழி’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டு, மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. ‘-யிலேயே’ தனித்துவ வலியுறுத்தலைக் காட்டுகிறது.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: தாம் பிறந்த
  rationale: ‘அதில் நாம் பிறந்தோம்’ என்ற மூலத்தின் தொடர்புப்பிரிவைச் சுருக்காமல் வெளிப்படையாகக் காத்து, பிறப்பிடத்தோடு தொடர்புடைய மொழி என்ற பொருளைத் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் வழங்கப்பட்டுள்ளது. கிரேக்கத்தின் வியப்புக் கேள்வியும், ஒவ்வொருவரின் பிறப்போடு தொடர்புடைய சொந்த மொழி என்ற கருத்தும் காக்கப்பட்டுள்ளன.
