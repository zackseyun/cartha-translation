source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: ta
  text: 'ஆகவே, இஸ்ரவேல் குடும்பத்தார் அனைவரும் உறுதியாக அறிந்துகொள்ளட்டும்: நீங்கள் சிலுவையில் அறைந்த இந்த இயேசுவையே கடவுள் ஆண்டவராகவும் மெசியாவாகவும்[a] ஆக்கியிருக்கிறார்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்க மொழியிலுள்ள Χριστός (கிறிஸ்தோஸ்) என்பது ஒரு பட்டப்பெயர்; இஸ்ரவேலை நோக்கிப் பேதுரு உரையாற்றும் இவ்விடத்தில் அதன் பட்டப்பொருளைக் காக்க “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: “ஆண்டவராகவும் மெசியாவாகவும் ஆக்கியிருக்கிறார்” என்பது, இயேசுவின் தெய்வீக இயல்பு மாறியதைக் குறிக்காமல், கடவுள் அவரை உயர்த்தி இந்தப் பதவிகளில் வெளிப்படையாக நிறுவியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: உறுதியாக
  rationale: பேதுருவின் அறிவிப்பிலுள்ள நிச்சயத்தன்மையை இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் உயிர்த்தெழுதல் மற்றும் உயர்த்தப்படுதல் குறித்து முன்வைக்கப்பட்ட வாதத்திலிருந்து வரும் முடிவைச் சுட்டுகிறது.
- source_word: γινωσκέτω
  choice: அறிந்துகொள்ளட்டும்
  rationale: மூன்றாம் நபர் ஏவல் வினையின் கட்டளைத் தன்மையைப் பேணுகிறது; இஸ்ரவேல் மக்களை ஒருங்கிணைந்த சமூகமாக நோக்கிப் பேசுகிறது.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: இஸ்ரவேல் குடும்பத்தார் அனைவரும்
  rationale: உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் ‘இஸ்ரவேல் வீடு/குடும்பம்’ என்ற வேதாகமச் சொல்லாட்சியை, நவீன தமிழில் புரியத்தக்க வகையில் பேணுகிறது.
- source_word: κύριον
  choice: ஆண்டவராக
  rationale: உயர்ந்த அதிகாரத்தையும், இதற்கு முந்தைய மேற்கோளில் வரும் ‘ஆண்டவர்’ என்ற சொல்லுடனான தொடர்பையும் காக்கிறது.
- source_word: Χριστόν
  choice: மெசியாவாக
  rationale: இஸ்ரவேலை நோக்கிய பேதுருவின் உரையில் இது தனிப்பெயர்போல அல்லாமல் அபிஷேகம் பெற்ற அரசர்/மீட்பர் என்னும் பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐποίησεν
  choice: ஆக்கியிருக்கிறார்
  rationale: ‘ஆக்கினார்’ என்ற நேரடியான சொல்லாற்றலைப் பேணுவதோடு, நிறைவேறிய கடவுளின் செயலுக்கு நிகழ்காலத் தாக்கம் இருப்பதையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: இந்த இயேசுவையே
  rationale: குறிப்பிட்ட வரலாற்று இயேசுவைச் சுட்டும் demonstrative-இன் வலியுறுத்தலை ‘-ஏ’ மூலம் காக்கிறது.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: நீங்கள் சிலுவையில் அறைந்த
  rationale: கேட்போரின் பொறுப்பை நேரடியாக வலியுறுத்தும் சார்பு வாக்கியத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ‘கடவுள் ஆண்டவராகவும் மெசியாவாகவும் ஆக்கியிருக்கிறார்’ என்பதன் கிறிஸ்தியல் பொருள்
  choice: ἐποίησεν என்பதன் நேரடியான வலிமையைப் பேணி ‘ஆக்கியிருக்கிறார்’ என்று மொழிபெயர்த்து, சூழலில் அது இயேசுவை உயர்த்தி இப்பதவிகளில் வெளிப்படையாக நிறுவிய கடவுளின் செயலைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘நியமித்திருக்கிறார்’ அல்லது ‘நிறுவியிருக்கிறார்’ என்று மூலச் சொல்லை விளக்கமாகவே முதன்மை உரையில் மொழிபெயர்த்தல்
  rationale: ‘ஆக்கினார்’ என்ற கிரேக்கச் சொல்லின் உண்மையான சொற்பொருளை மறைக்காமல் விடுகிறது. அதேவேளை, இயேசுவின் இயல்பு மாறியது என்று வசனம் வெளிப்படையாகக் கூறாத நிலையில் அத்தகைய பொருளை மொழிபெயர்ப்பில் திணிக்காமல், மீட்பு வரலாற்றில் அவரது உயர்த்தப்படுதலும் வெளிப்படையான நிறுவுதலும் இங்கு முன்னிலைப்படுவதைத் தெளிவுபடுத்துகிறது.
- issue: Χριστός என்பதன் பட்டப்பெயர் தன்மை
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: ‘இஸ்ரவேல் குடும்பத்தார்’ என்ற நேரடியான அழைப்புச் சூழலில், அபிஷேகம் பெற்ற வாக்குத்தத்த அரசர் என்னும் பட்டப்பொருள் முக்கியமாக இருப்பதால் ‘மெசியா’ பொருத்தமானது; மரபுவழி மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘இஸ்ரவேல் குடும்பத்தார்’ என்ற வேதாகமச் சமூகச் சொல்லாட்சியைப் பேணியபோதும், வாக்கிய அமைப்பு இயல்பான தமிழாக வைக்கப்பட்டுள்ளது. ‘இந்த இயேசுவையே’ என்பது மூலத்தின் சுட்டும் வலியுறுத்தலைத் தெளிவாக எடுத்துரைக்கிறது.
