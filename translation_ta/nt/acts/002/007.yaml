id: ACT.2.7
reference: Acts 2:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: ta
  text: அவர்கள் திகைப்பும் வியப்பும் அடைந்து, “இதோ, பேசிக்கொண்டிருக்கும் இவர்கள் எல்லாரும் கலிலேயர்கள் அல்லவா?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξίσταντο
  choice: திகைப்பும் … அடைந்து
  rationale: இங்கு இந்த வினை ஆழ்ந்த திகைப்பை வெளிப்படுத்துகிறது. அடுத்த வினையுடன் இயல்பான தமிழில் இணைக்க ‘திகைப்பும் … அடைந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: δὲ
  choice: —
  rationale: இது கதையைத் தொடரும் மென்மையான இணைப்புச்சொல். தனியாக மொழிபெயர்த்தால் தமிழ் நடை செயற்கையாகும் என்பதால், வாக்கியத் தொடர்ச்சியில் உள்ளடக்கப்பட்டது.
- source_word: καὶ
  choice: -உம்
  rationale: இரண்டு எதிர்வினைகளையும் கூட்டாக இணைக்கும் பொருளை ‘திகைப்பும் வியப்பும்’ என்ற இணை அமைப்பு இயல்பாகக் காட்டுகிறது.
- source_word: ἐθαύμαζον
  choice: வியப்பும் அடைந்து
  rationale: வியத்தல் அல்லது ஆச்சரியப்படுதல் என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; ἐξίσταντο என்பதிலிருந்து வேறுபட்டிருந்தாலும் அதனுடன் சேர்ந்த வலிமையையும் காக்கிறது.
- source_word: λέγοντες
  choice: என்று சொன்னார்கள்
  rationale: பேச்சின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் பங்கேற்புவினை, இயல்பான தமிழ் நேரடி உரை அமைப்பில் இறுதி வினையாக வழங்கப்பட்டுள்ளது.
- source_word: Οὐχ
  choice: அல்லவா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் எதிர்மறைக் கேள்வியைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் துகளின் சுட்டும் வலிமையை, கண்ணியமான மற்றும் பொதுவாகப் புரியும் தமிழில் காக்கிறது.
- source_word: πάντες οὗτοί
  choice: இவர்கள் எல்லாரும்
  rationale: முழுக் குழுவையும் குறிக்கிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘ஆண்கள்’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: οἱ λαλοῦντες
  choice: பேசிக்கொண்டிருக்கும்
  rationale: தொடர்ந்து நிகழும் பேச்சுச் செயலை நிகழ்காலத் தொடர்பெயர் அமைப்பில் இயல்பாகக் காட்டுகிறது.
- source_word: Γαλιλαῖοι
  choice: கலிலேயர்கள்
  rationale: பிரதேச அடையாளத்திற்கான நேரடியான தமிழ் வடிவம்; அவர்களுடைய கல்வி, உச்சரிப்பு அல்லது சமூக நிலையைப் பற்றிய விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘கலிலேயர்கள்’ என்பதன் மறைமுகமான சமூக அல்லது பிரதேசத் தாக்கம்
  choice: பிரதேசப் பெயர் மட்டும் தக்கவைக்கப்பட்டது.
  alternative: கல்வியறிவற்ற கலிலேயர்கள்; வடபகுதியைச் சேர்ந்த கலிலேயர்கள்
  rationale: அவர்கள் கலிலேயர்கள் என்பதைக் குறித்து மக்கள் வியந்ததாக வசனம் கூறுகிறது; ஆனால் அந்த வியப்புக்கான காரணத்தை வெளிப்படையாகக் கூறவில்லை. ஆகவே ஊகம் மொழிபெயர்ப்புக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், கண்ணியமான உரைநடை. இரண்டு கிரேக்க எதிர்வினை வினைகளின் கூட்டு வலிமை ‘திகைப்பும் வியப்பும்’ எனப் பாதுகாக்கப்பட்டுள்ளது. மூலத்தில் உண்மையான உரைமாற்றுக் குறிப்பு தேவைப்படாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை; ஆங்கில அடிக்குறிப்பில் குறிப்பிடப்பட்ட Look/Behold/See வேறுபாடு தமிழில் ‘இதோ’ என்பதால் இயல்பாகத் தீர்கிறது.
