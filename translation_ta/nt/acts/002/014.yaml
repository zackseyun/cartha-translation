source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: ta
  text: 'ஆனால் பேதுரு பதினொருவரோடு நின்றுகொண்டு, தமது குரலை உயர்த்தி அவர்களிடம் உரைத்தார்: “யூத ஆண்களே[a], எருசலேமில் குடியிருக்கும் அனைவரே, இதைக் கவனத்தில் கொள்ளுங்கள்; என் வார்த்தைகளைக் கவனமாகக் கேளுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயாவைச் சேர்ந்த ஆண்களே.”
    reason: Ἰουδαῖοι என்பது யூத இன அல்லது சமய அடையாளத்தையும் யூதேயப் புவியியல் தொடர்பையும் குறிக்கக்கூடிய சொல்.
lexical_decisions:
- source_word: Σταθεὶς
  choice: எழுந்து நின்று
  rationale: இறந்தகாலப் பங்கேற்புவினை பேதுரு பேசுவதற்காக நின்றதைக் காட்சிப்படுத்துகிறது. “எழுந்து நின்று” என்பது தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கேலிக் குற்றச்சாட்டிலிருந்து பேதுருவின் பதிலுக்கு வரும் எதிர்மறையான உரைமாற்றத்தை வெளிப்படுத்துகிறது.
- source_word: σὺν τοῖς ἕνδεκα
  choice: பதினொருவரோடு
  rationale: σύν என்பதன் உடனிருப்புப் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: தமது குரலை உயர்த்தி
  rationale: பொதுமக்கள் கேட்கும்படி உரத்த குரலில் பேசினார் என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀπεφθέγξατο
  choice: உரைத்தார்
  rationale: வெறும் சாதாரணப் பேச்சைவிட முறையான பொது உரையின் கனத்தைத் தக்கவைக்கிறது; அதேவேளையில், வினைச்சொல்லில் வெளிப்படையாக இல்லாத இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: யூத ஆண்களே
  rationale: ἄνδρες என்பதன் ஆண்பால் குறிப்பையும் Ἰουδαῖοι என்பதன் யூத அடையாளப் பொருளையும் வெளிப்படையாகத் தக்கவைக்கிறது. “யூதேய ஆண்களே” என்ற புவியியல் வாசிப்பும் சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: எருசலேமில் குடியிருக்கும் அனைவரே
  rationale: தற்போதைய குடியிருப்பைக் குறிக்கும் பங்கேற்புவினையையும் πάντες என்பதன் முழுமையையும் நேரடியாகத் தருகிறது.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: இதை நீங்கள் தெரிந்துகொள்ளுங்கள்
  rationale: சொல்லுக்குச் சொல் அமைப்பான “இது உங்களுக்குத் தெரிந்திருக்கட்டும்” என்பதைவிட இயல்பான தமிழில், முறையான அறிவுறுத்தலின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: என் வார்த்தைகளைக் கவனமாகக் கேளுங்கள்
  rationale: செவிகொடுத்துக் கூர்ந்து கேட்கும்படி கட்டளையிடும் வினையின் வலிமையையும் ῥήματα என்பதன் ‘வார்த்தைகள்’ என்ற நேரடிப் பொருளையும் இணைக்கிறது.
theological_decisions:
- issue: Ἄνδρες என்பதன் பாலினக் குறிப்பை மொழிபெயர்த்தல்
  choice: யூத ஆண்களே
  alternative: யூதர்களே
  rationale: மூலத்தின் ἄνδρες வெளிப்படையாக ஆண்களைக் குறிக்கிறது. அதை பாலினப் பொதுமைப்படுத்தலால் மறைக்காமல் முதன்மை உரையில் தக்கவைத்துள்ளது.
- issue: Ἰουδαῖοι என்பதன் அடையாள அல்லது புவியியல் பொருள்
  choice: யூத
  alternative: யூதேய
  rationale: இச்சொல் யூத மக்களையும் யூதேயாவைச் சேர்ந்தவர்களையும் குறிக்கக்கூடும். இங்கு பொது அழைப்பில் யூத அடையாளப் பொருள் இயல்பாக இருப்பதால் அது முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: ἀπεφθέγξατο என்பதில் ஆவியால் ஏவப்பட்ட பேச்சை வெளிப்படையாகச் சேர்ப்பதா
  choice: உரைத்தார்
  alternative: ஆவியால் ஏவப்பட்டு அறிவித்தார்
  rationale: வினைச்சொல் கனமான அல்லது பொதுவான அறிவிப்பைக் குறிக்கலாம்; ஆனால் இந்தச் சொல் மட்டும் ஆவியால் ஏவப்பட்டதை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே அத்தகைய இறையியல் விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய முறையான பொது உரைநடை பயன்படுத்தப்பட்டுள்ளது. “உரைத்தார்,” “குரலை உயர்த்தி” போன்ற சொற்கள் வசனத்தின் கண்ணியத்தையும் பொதுப் பிரகடனத் தொனியையும் காக்கின்றன; தேவையற்ற பழமையான நடையும் சமயப் பிரிவுசார் சொற்களும் தவிர்க்கப்பட்டுள்ளன.
