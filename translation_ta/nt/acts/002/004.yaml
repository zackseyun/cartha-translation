  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: ta
  text: அவர்கள் அனைவரும் பரிசுத்த ஆவியால் நிரப்பப்பட்டார்கள். ஆவியானவர் அவர்களுக்குப் பேச அருளியபடியே, அவர்கள் வேறு மொழிகளில்[a] பேசத் தொடங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வேறு நாவுகளில்.’ கிரேக்கச் சொல் ‘நாவுகள்’ அல்லது ‘மொழிகள்’ என்ற இரு பொருள்களையும் தரலாம். தொடர்ந்து வரும் நிகழ்வில், கேட்டவர்கள் அவற்றைத் தங்கள் சொந்த மொழிகளாக அறிந்துகொண்டனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: நிரப்பப்பட்டார்கள்
  rationale: πίμπλημι என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் இங்கு பரிசுத்த ஆவியால் முழுமையாக ஆட்கொள்ளப்பட்டு வல்லமை பெறுவதைக் குறிக்கிறது. ‘நிரப்பப்பட்டார்கள்’ என்பது மூலத்தின் உருவகத்தையும் செயப்பாட்டு வடிவத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: அங்கிருந்த குழுவினர் எல்லோரையும் உள்ளடக்கும் வலியுறுத்தலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியால்
  rationale: இங்கு குறிப்பிடப்படுவது அப்போஸ்தலர் நடபடிகளில் செயல்படும் தெய்வீகப் பரிசுத்த ஆவியானவர். கிரேக்க மரபுவேற்றுமையைத் தமிழில் இயல்பாகக் கருவிப்பொருள் வேற்றுமையால் மொழிபெயர்த்துள்ளது.
- source_word: ἤρξαντο λαλεῖν
  choice: பேசத் தொடங்கினார்கள்
  rationale: ἄρχομαι உடன் வரும் வினையெச்சம் செயலின் தொடக்கத்தைச் சுட்டுகிறது; இந்தத் தமிழ் வடிவம் அதன் நிகழ்வோட்டத்தை இயல்பாகப் பதிவு செய்கிறது.
- source_word: ἑτέραις γλώσσαις
  choice: வேறு மொழிகளில்
  rationale: γλῶσσα என்பதற்கு ‘நா’ என்றும் ‘மொழி’ என்றும் பொருள் உண்டு. இங்கு ‘நாவுகளில்’ என்பது நவீனத் தமிழில் உடல் உறுப்பைக் குறிக்கும் விதமாகத் தவறாகப் புரியக்கூடும்; அடுத்துவரும் சூழல் கேட்போர் அறிந்த மனித மொழிகளைக் குறிப்பிடுவதால் ‘வேறு மொழிகளில்’ என்பது தெளிவான, இயல்பான தெரிவு. மூலச்சொல்லின் பரப்பை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: καθὼς
  choice: கொடுத்தபடியே
  rationale: பேச்சு ஆவியானவர் கொடுத்த விதத்திற்கும் அளவிற்கும் ஏற்ப நிகழ்ந்தது என்ற உறவை ‘படியே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐδίδου
  choice: கொடுத்தபடியே
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம், அவர்கள் பேசிக்கொண்டிருந்தபோது ஆவியானவர் தொடர்ந்து வழங்கியதைச் சுட்டுகிறது. சூழலில் நீடிக்கும் செயலை இந்த வடிவம் இயல்பாக உணர்த்துகிறது.
- source_word: ἀποφθέγγεσθαι
  choice: உரைத்திட
  rationale: இந்த வினை வெறுமனே பேசுவதைக் காட்டிலும் தெளிவாக அல்லது வெளிப்படையாக எடுத்துரைப்பதைக் குறிக்கலாம். ‘உரைத்திட’ அதன் வலிமையைப் பாதுகாக்கிறது; அதேவேளையில் அதைத் தீர்க்கதரிசனமாக மட்டும் குறுக்கவில்லை.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: ஆவியானவர் பேசுவதற்கான வெளிப்பாட்டை யாருக்கு வழங்கினார் என்பதைக் காட்டும் மறைமுகச் செயப்படுபொருளை நேராகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: πνεύματος ἁγίου என்பது தெய்வீக நபரைக் குறிக்கிறதா அல்லது பொதுவான ‘பரிசுத்த ஆவி’ நிலையைக் குறிக்கிறதா?
  choice: பரிசுத்த ஆவி; அடுத்த வாக்கியத்தில் ‘ஆவியானவர்’
  alternative: ஒரு பரிசுத்த ஆவி / பரிசுத்தமான ஆவி
  rationale: அப்போஸ்தலர் 2-இன் சூழலில் வாக்குத்தத்தம் செய்யப்பட்டு பேச்சை அருளும் தெய்வீக ஆவியே குறிக்கப்படுகிறார். ‘ஆவியானவர்’ என்ற மரியாதைமிக்க ஆள்சுட்டு, மூலத்தில் செயற்படும் முகவராக ஆவி வருவதைத் தெளிவாக்குகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: γλώσσαις என்பதை ‘நாவுகள்’ என்று உருவக வடிவில் தருவதா, ‘மொழிகள்’ என்று பொருளடிப்படையில் தருவதா?
  choice: வேறு மொழிகளில்
  alternative: வேறு நாவுகளில்
  rationale: கிரேக்கச் சொல் இரு பொருள்களையும் ஏற்கலாம். தமிழில் ‘நாவுகளில்’ என்பது இயல்பற்றதாகவும் உடல் உறுப்பைக் குறிப்பதாகவும் ஒலிக்கும். மேலும் 2:6–11 கேட்போர் தங்கள் சொந்த மொழிகளை அறிந்துகொண்டதாக விளக்குகிறது. எனவே முதன்மை உரையில் ‘மொழிகள்’ தேர்ந்தெடுக்கப்பட்டு, சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘உரைத்திட’ என்பது சற்று உயர்ந்த ஆனால் பரவலாகப் புரியக்கூடிய சொல்லாக இருந்து ἀποφθέγγεσθαι என்பதன் வெளிப்படையாக எடுத்துரைக்கும் நுணுக்கத்தைப் பாதுகாக்கிறது.
