id: ACT.2.29
reference: Acts 2:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: ta
  text: 'ஆண்களே, சகோதரர்களே, குலத்தந்தையான தாவீதைப் பற்றி உங்களிடம் துணிவுடன் பேச எனக்கு அனுமதி உண்டு: அவர் இறந்தார், அடக்கம் செய்யப்பட்டார்; அவருடைய கல்லறை இந்நாள்வரை நம்மிடையே இருக்கிறது.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: சகோதரர்களே
  rationale: இரண்டு ஆண்பால் அழைப்புச் சொற்களைக் கொண்ட கிரேக்க மரபுத்தொடர், கூடியிருந்த சக இஸ்ரவேலரை முறைப்படி அழைக்கிறது. தமிழில் இரண்டையும் சொற்சொல்லாகக் கொடுப்பது இயல்பற்றதால், இயல்பான அழைப்பாக ‘சகோதரர்களே’ என வழங்கி, மூலத்தின் இரட்டை வடிவத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: ἐξὸν εἰπεῖν
  choice: பேச எனக்கு அனுமதி உண்டு
  rationale: இந்த மரபுத்தொடர் வெறும் பேசும் திறனை அல்ல, பேசுவதற்கான உரிமை அல்லது சுதந்திரத்தை உணர்த்துகிறது.
- source_word: μετὰ παρρησίας
  choice: துணிவுடன்
  rationale: παρρησία வெளிப்படையான, அஞ்சாத பேச்சைக் குறிக்கிறது; ‘துணிவுடன்’ அதன் சொல்லாட்சிச் சக்தியை இயல்பான தமிழில் காக்கிறது.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: முற்பிதாவாகிய தாவீதைப் பற்றி
  rationale: πατριάρχης என்பதன் முன்னோர் தலைமை மற்றும் மரபுத் தந்தை என்ற பொருளை ‘முற்பிதா’ சுருக்கமாகவும் மரியாதையுடனும் தருகிறது; மூலத்தில் இல்லாத ‘நமது’ சேர்க்கப்படவில்லை.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: அவர் இறந்தார், அடக்கம் செய்யப்பட்டார்
  rationale: இறப்பும் அடக்கமும் ஆகிய இரு உண்மைகளும் தெளிவாக வலியுறுத்தப்படுகின்றன. தமிழில் ‘இரண்டும்... மேலும்’ போன்ற கட்டமைப்பு இயல்பற்றதால் இணையான தொடரால் தரப்படுகிறது.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: அவருடைய கல்லறை
  rationale: μνῆμα இச்சூழலில் அறியப்பட்ட அடக்க இடத்தைக் குறிக்கிறது; ‘கல்லறை’ நவீனத் தமிழில் தெளிவான இயல்பான சொல்.
- source_word: ἔστιν ἐν ἡμῖν
  choice: நம்மிடையே இருக்கிறது
  rationale: அந்தக் கல்லறை பேசுபவரும் கேட்பவர்களும் வாழும் சமூகத்திலும் இடத்திலும் இன்னும் இருப்பதை இந்தச் சொற்றொடர் உணர்த்துகிறது.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: இந்நாள்வரை
  rationale: பேசப்படும் காலம்வரை நிலை தொடர்வதைத் தெரிவிக்கும் சுருக்கமான, வழக்கான தமிழ் மரபுத்தொடர்.
theological_decisions:
- issue: தொடக்க அழைப்பிலுள்ள இரண்டு ஆண்பால் விளிச் சொற்களைத் தமிழில் வழங்குதல்
  choice: முதன்மை உரையில் ‘சகோதரர்களே’; மூலத்தின் இரட்டை அழைப்பை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘ஆண்களே, சகோதரர்களே’ என்று சொற்சொல்லாக வழங்குதல்
  rationale: Ἄνδρες ἀδελφοί என்பது ஆண்பால் வடிவிலுள்ள இரட்டை அழைப்பு. அதைத் தமிழில் சொற்சொல்லாக வழங்குவது கடினமாகவும் இயல்பற்றதாகவும் ஒலிக்கும்; ஒரே இயல்பான அழைப்பைப் பயன்படுத்துவது அதன் உரையாடல் செயல்பாட்டைக் காக்கிறது. அதேவேளை, மூலத்தின் ஆண்பால் மற்றும் இரட்டை வடிவம் மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டுள்ளது. ‘முற்பிதா,’ ‘துணிவுடன்,’ ‘இந்நாள்வரை’ ஆகிய சொற்கள் வேதாகமச் சூழலுக்குரிய கண்ணியத்தைத் தக்கவைத்தும் சாதாரண வாசகர்களுக்குப் புரியுமாறும் உள்ளன.
