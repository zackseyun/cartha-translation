id: ACT.2.31
reference: Acts 2:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: ta
  text: இதை முன்கூட்டியே கண்ட தாவீது, மேசியாவின்[a] உயிர்த்தெழுதலைக் குறித்து, “அவர் மரித்தோர் உலகத்தில் கைவிடப்படவில்லை[b][c]; அவருடைய சதையும் சிதைவைக் காணவில்லை[d]” என்று பேசினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘கிறிஸ்து’; இங்கு அது பட்டமாகப் பயன்படுத்தப்படுவதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘மரித்தோர் உலகத்திற்குக் கைவிடப்படவில்லை.’ கிரேக்க முன்னிடைச்சொல் இச்சூழலில் ‘உலகத்தில்’ அல்லது ‘உலகத்திற்கு’ எனப் புரிந்துகொள்ளப்படலாம்; இரண்டிலும் அவர் அங்கே கைவிடப்படவில்லை என்பதே கருத்து.
    reason: lexical_alternative
  - marker: c
    text: ‘மரித்தோர் உலகம்’ என்பதற்கான கிரேக்கச் சொல் ‘ஹாதேஸ்.’ இது இறந்தோரின் உலகைக் குறிக்கிறது; இறுதி நியாயத்தீர்ப்பின் இடமான நரகத்தைச் சிறப்பாகக் குறிக்கவில்லை.
    reason: cultural_note
  - marker: d
    text: 'எழுத்துப்படியான மொழிபெயர்ப்பு: ‘அவருடைய சதை அழிவைக் காணவில்லை’; அதாவது, அவருடைய சதை அழுகிச் சிதையவில்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: இதை முன்கூட்டியே கண்ட
  rationale: இறந்தகால வினையெச்சம், பின்னர் நிகழவிருந்ததை தாவீது முன்னரே உணர்ந்ததைக் குறிக்கிறது. தமிழில் வாக்கியம் இயல்பாக அமையச் சூழலிலிருந்து ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐλάλησεν
  choice: பேசினார்
  rationale: λαλέω என்பதன் பொதுவான ‘பேசு’ என்ற பொருளைத் தக்கவைக்கிறது; மேற்கோளை அறிமுகப்படுத்தும் சூழலுக்கும் பொருந்துகிறது.
- source_word: περὶ τῆς ἀναστάσεως
  choice: உயிர்த்தெழுதலைக் குறித்து
  rationale: περί + பிறப்புவேற்றுமையின் ‘குறித்து/பற்றி’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τοῦ χριστοῦ
  choice: மேசியாவின்
  rationale: இங்கு Χριστός ஒரு தனிப்பெயர் போல அல்லாமல், வேதவாக்கில் முன்னறிவிக்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாக வருகிறது.
- source_word: οὔτε ἐγκατελείφθη
  choice: கைவிடப்படவில்லை
  rationale: ἐγκαταλείπω என்பதன் ‘கைவிடு, விட்டுவிடு’ என்ற வலிமையைத் தக்கவைக்கும் இயல்பான தமிழ் செயலப்பாட்டு வடிவம்.
- source_word: εἰς ᾅδην
  choice: மரித்தோர் உலகத்தில்
  rationale: ᾅδης என்பது இறுதித் தண்டனைக்குரிய நரகத்தைச் சிறப்பாகக் குறிக்காமல், இறந்தோர் இருக்கும் உலகைக் குறிக்கிறது. εἰς இங்கு கைவிடப்பட்ட நிலை அல்லது இடத்தைக் குறிக்கக்கூடியதால் தமிழில் இடவேற்றுமை இயல்பாக உள்ளது.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: அவருடைய உடல்
  rationale: σάρξ இங்கு பாவ இயல்பை அல்ல, மேசியாவின் மரணத்துக்குட்பட்ட உடலைக் குறிக்கிறது. ‘சதை’ என்பதைவிட ‘உடல்’ நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் இதே உடல்சார் பொருளைத் தருகிறது.
- source_word: εἶδεν διαφθοράν
  choice: சிதைவைக் காணவில்லை
  rationale: ‘சிதைவைக் காணுதல்’ என்ற மூலமொழி உருவகத்தைத் தக்கவைத்து, διαφθορά என்பதன் உடல் அழுகிச் சிதையும் பொருளைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: பேதுருவின் வேதவாக்கு சார்ந்த வாதத்தில் இது வாக்குத்தத்தம் செய்யப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாக இருப்பதால் ‘மேசியா’ தெரிவுசெய்யப்பட்டது.
- issue: ᾅδης என்பதன் மொழிபெயர்ப்பு
  choice: மரித்தோர் உலகம்
  alternative: பாதாளம் / ஹாதேஸ் / நரகம்
  rationale: மூலச்சொல் இறந்தோரின் உலகைக் குறிக்கிறது; அதை இறுதி நியாயத்தீர்ப்பின் இடமான ‘நரகம்’ என்பதுடன் கலக்காமல் இருக்க விளக்கமான தமிழ் சொற்றொடர் பயன்படுத்தப்பட்டது.
- issue: σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: உடல்
  alternative: சதை
  rationale: இங்கு சொல் நேரடியான உடல்சார் பொருளில் வருகிறது. தமிழில் ‘உடல்’ அந்தப் பொருளை இயல்பாகத் தெரிவிப்பதோடு உயிர்த்தெழுதலின் உடல்சார் தன்மையையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘தாவீது’ முந்தைய வசனத்தின் தெளிவான எழுவாயைத் தொடர்ந்து தமிழில் குழப்பம் தவிர்க்கச் சேர்க்கப்பட்டுள்ளது. மேற்கோள் அமைப்பு மற்றும் உயிர்த்தெழுதலின் உடல்சார் வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளன.
