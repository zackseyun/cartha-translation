  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: ta
  text: அவர்கள் அனைவரும் வியப்பும் குழப்பமும் அடைந்து, “இதன் பொருள் என்ன?”[a] என்று ஒருவருக்கொருவர் கூறிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “இது என்னவாக இருக்க விரும்புகிறது?” கிரேக்கத்தில் இது “இதன் பொருள் என்ன?” அல்லது “இதன் முக்கியத்துவம் என்ன?” என்று கேட்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: வியப்புற்று
  rationale: தொடர்ந்து நிலவிய மிகுந்த வியப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; சொற்பிறப்பை மட்டும் பின்பற்றும் மொழிபெயர்ப்பு தவறான பொருளைத் தரக்கூடும்.
- source_word: δὲ
  choice: வாக்கிய ஓட்டத்தில் தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான எதிர்மறையைக் காட்டாமல் கதையை மெதுவாக முன்னெடுக்கும் இணைப்புச்சொல். தமிழில் தனிச் சொல்லைச் சேர்க்காமல் வாக்கியத் தொடரால் அதன் பணியை இயல்பாக வெளிப்படுத்தலாம்.
- source_word: πάντες
  choice: அவர்கள் அனைவரும்
  rationale: முந்தைய சூழலிலிருந்து எழுவாயைத் தெளிவுபடுத்தி, அனைவரையும் உள்ளடக்கும் வலியுறுத்தலைக் காக்கிறது.
- source_word: διηπόρουν
  choice: குழம்பி
  rationale: என்ன புரிந்துகொள்வது என்று தெரியாமல் திகைத்திருந்த தொடர்நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἄλλος πρὸς ἄλλον
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பரமாகப் பேசிக்கொண்டதைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: λέγοντες
  choice: சொல்லிக்கொண்டார்கள்
  rationale: பேச்சை அறிமுகப்படுத்தும் பங்கேற்பு வினையின் நடுநிலையான பொருளையும், தொடர்ந்து ஒருவரோடு ஒருவர் பேசிய நிலையையும் காக்கிறது.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: இதன் பொருள் என்ன?
  rationale: τί θέλει + வினையெச்சம் என்ற கிரேக்க மரபுத்தொடர் நிகழ்வின் பொருள் அல்லது முக்கியத்துவத்தை வினவுகிறது. தமிழில் அதன் கருத்தை மிகைப்படுத்தாமல் இயல்பாகத் தரும் வடிவம் இது.
