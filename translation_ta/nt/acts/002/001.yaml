source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: ta
  text: பெந்தெகொஸ்தே நாள் நிறைவடையும் வேளையில்[a], அவர்கள் அனைவரும் ஒன்றாக ஒரே இடத்தில் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெந்தெகொஸ்தே நாள் முழுமையாக வந்தபோது.’
    reason: συμπληροῦσθαι என்பதன் நிறைவை நோக்கிய நிகழ்வுப்போக்கையும், நாள் முழுமையாக வந்துவிட்டது என்ற மரபான விளைவுநிலை வாசிப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: நிறைவடைந்துகொண்டிருந்தபோது
  rationale: ἐν τῷ உடன் வரும் நிகழ்காலச் செயப்பாட்டு வினையெச்சம் காலத்தைக் குறிக்கும் அமைப்பாக உள்ளது. இந்தத் தேர்வு, நாள் நிறைவை அடையும் நிகழ்வுப்போக்கை இயல்பான தமிழில் காக்கிறது; முடிவு மட்டும் வலியுறுத்தப்படும் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: πεντηκοστῆς
  choice: பெந்தெகொஸ்தே
  rationale: பஸ்காவுக்குப் பின் ஐம்பதாம் நாளில் கொண்டாடப்பட்ட யூதப் பண்டிகைக்கான புதிய ஏற்பாட்டுக் கிரேக்கப் பெயர் இது. தமிழ்க் கிறிஸ்தவ வழக்கில் அறியப்பட்ட பெயர் ‘பெந்தெகொஸ்தே’.
- source_word: πάντες
  choice: அவர்கள் அனைவரும்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட முழுக் குழுவையும் குறிக்கிறது. தமிழில் மறைந்திருக்கும் எழுவாயைத் தெளிவாக்க ‘அவர்கள் அனைவரும்’ இயல்பாக உள்ளது.
- source_word: ὁμοῦ
  choice: ஒன்றுகூடி
  rationale: குழுவினர் சேர்ந்திருப்பதை இந்த வினையடை குறிக்கிறது. ‘ஒன்றுகூடி’ அதன் கூட்டுறவு சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τὸ αὐτό
  choice: ஒரே இடத்தில்
  rationale: இந்த மரபுத்தொடர் ‘அதே இடத்தில்’ அல்லது ‘ஒன்றாக’ எனப் பொருள்படலாம். ὁμοῦ ஏற்கெனவே ஒன்றுகூடியிருப்பதைக் குறிப்பதால், இடம் சார்ந்த நுணுக்கத்தைக் காக்க ‘ஒரே இடத்தில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἦσαν என்பதன் வெளிப்படையாகக் கூறப்படாத எழுவாயின் அடையாளம்
  choice: அவர்கள் அனைவரும் ஒரே இடத்தில் ஒன்றுகூடியிருந்தார்கள்
  alternative: அனைவரும் ஒரே இடத்தில் ஒன்றுகூடியிருந்தார்கள்
  rationale: கிரேக்க உரை எழுவாயை மீண்டும் வெளிப்படையாகச் சொல்லாமல் முந்தைய சூழலிலிருந்து எடுத்துக்கொள்கிறது. தமிழில் கதைத் தொடர்ச்சியை இயல்பாகக் காட்ட ‘அவர்கள்’ சேர்க்கப்பட்டுள்ளது; இது குழுவின் துல்லிய அடையாளத்தை இந்த வசனத்திலேயே இறையியல் ரீதியாக நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிறைவடைந்துகொண்டிருந்தபோது’ என்பது மூலத்தின் நிகழ்வுப்போக்கு நுணுக்கத்தைக் காக்கிறது; அடிக்குறிப்பு மரபான முடிவுறு வாசிப்பையும் தருகிறது.
