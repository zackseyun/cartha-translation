source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: ta
  text: பேதுரு அவர்களிடம், “மனந்திரும்புங்கள்; உங்களில் ஒவ்வொருவரும் இயேசு மெசியாவின்[a] பெயரில் உங்கள் பாவங்களின் மன்னிப்பிற்காக[b] திருமுழுக்கு பெறட்டும்; அப்போது நீங்கள் பரிசுத்த ஆவியின் கொடையைப் பெறுவீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இயேசு மெசியா” என்பதை “இயேசு கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல்லான Χριστός இங்கு பட்டமாகப் பயன்படுத்தப்பட்டு, “மெசியா” என்று பொருள்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: “உங்கள் பாவங்களின் மன்னிப்பிற்காக” என்பது கிரேக்கச் சொற்றொடரின் நேரடியான மொழிபெயர்ப்பு. இவ்வசனத்தில் திருமுழுக்கும் பாவமன்னிப்பும் எவ்வாறு தொடர்புபடுகின்றன என்பதில் விளக்கவுரையாளர்கள் வேறுபடுகிறார்கள்; மொழிபெயர்ப்பு அதன் சொற்களுக்கு அப்பால் அந்த விவாதத்தைத் தீர்மானிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετανοήσατε
  choice: மனந்திரும்புங்கள்
  rationale: முடிவான உள்ளமாற்றத்தையும் வாழ்வுத் திருப்பத்தையும் கோரும் பன்மை ஏவலைச் சுருக்கமாகவும் வழக்கமான வேதாகமத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: உங்களில் ஒவ்வொருவரும் ... திருமுழுக்குப் பெறட்டும்
  rationale: மூன்றாம் நபர் ஒருமைச் செயல்பாட்டு ஏவலையும் ἕκαστος என்பதன் தனித்தனி வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: பெயரில்
  rationale: இச்சூழலில் அதிகாரம், அடையாளம், அறிக்கை அல்லது அடித்தளம் ஆகிய நுணுக்கங்களில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் கிரேக்கச் சொற்றொடரை இயல்பாக வழங்குகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: அப்போஸ்தலர் 2-இன் அறிவிப்புச் சூழலில் Χριστός பட்டமாகச் செயல்படுவதால் அதன் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: உங்கள் பாவங்கள் மன்னிக்கப்படுவதற்காக
  rationale: εἰς ἄφεσιν என்பதன் நோக்கு/விளைவு சார்ந்த இயல்பை வெளிப்படுத்துகிறது; திருமுழுக்கும் மன்னிப்பும் எவ்வாறு தொடர்புபடுகின்றன என்ற கோட்பாட்டுச் சர்ச்சையை மேலதிக வார்த்தைகளால் தீர்மானிக்கவில்லை.
- source_word: λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος
  choice: பரிசுத்த ஆவியானவராகிய கொடையைப் பெறுவீர்கள்
  rationale: மரபுசார் தமிழ் மொழிபெயர்ப்புகளில் காணப்படும் தெளிவான உடைமை அமைப்புக்கு மாற்றாக, இங்கு கொடை பரிசுத்த ஆவியானவரே என்று இயல்பாகப் புரியவைக்கும் appositional rendering; கிரேக்க genitive-இன் சாத்தியமான பொருளை முன்னிறுத்துகிறது.
theological_decisions:
- issue: திருமுழுக்கும் பாவமன்னிப்பும் இடையிலான தொடர்பு
  choice: “உங்கள் பாவங்கள் மன்னிக்கப்படுவதற்காக” என்று நேரடியாக மொழிபெயர்த்து, தொடர்பின் தன்மையை விளக்கும் கூடுதல் சொற்களைச் சேர்க்கவில்லை.
  alternative: “உங்கள் பாவங்கள் மன்னிக்கப்பட்டதால்” அல்லது “உங்கள் பாவங்கள் மன்னிக்கப்படும்படி”
  rationale: εἰς ἄφεσιν நோக்கு அல்லது விளைவைச் சுட்டக்கூடும்; காரணத்தைக் குறிப்பதாக மாற்றுவது அல்லது குறிப்பிட்ட அருள்சாதனக் கோட்பாட்டை உறுதிப்படுத்துவது மூலத்தின் பதற்றத்தைத் தீர்த்துவிடும்.
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் பேதுருவின் அறிவிப்பு வெளிப்படையாக மெசியாவைப் பற்றியது; பட்டத்தின் அர்த்தத்தைத் தமிழில் காக்கிறது.
- issue: τοῦ ἁγίου πνεύματος என்பதன் genitive தொடர்பு
  choice: பரிசுத்த ஆவியானவராகிய கொடை
  alternative: பரிசுத்த ஆவியானவரின் கொடை
  rationale: இது ஆவியானவர் அருளும் கொடையையும் அல்லது ஆவியானவரே கொடையாக அளிக்கப்படுவதையும் இலக்கணரீதியாக அனுமதிக்கலாம்; உடனடியான சூழலில் ஆவியானவரைப் பெறுதல் இயல்பான பொருளாக இருப்பதால் appositional வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. “திருமுழுக்கு” பொதுமக்கள் புரிந்துகொள்ளக்கூடிய திருச்சபைச் சொலாகத் தேர்ந்தெடுக்கப்பட்டது. நீண்ட மேற்கோள் தமிழில் இயல்பாகப் பாயும்படி இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது; [a] குறிப்பு சம்பந்தப்பட்ட “இயேசு மெசியா” தொடருக்குப் பிந்தைய வாக்கிய முடிவில் வைக்கப்பட்டுள்ளது.
