  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: ta
  text: பார்த்தியர்களும் மேதியர்களும் ஏலாமியர்களும், மெசொப்பொத்தாமியா, யூதேயா மற்றும் கப்பதோக்கியா, பொந்து, ஆசியா ஆகிய இடங்களில் குடியிருப்பவர்களும்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆசியா’ என்பது நவீன ஆசியக் கண்டத்தை அல்ல, ஆசியா மைனரின் மேற்குப் பகுதியில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Πάρθοι
  choice: பார்த்தியர்கள்
  rationale: பார்த்திய மக்களைக் குறிக்கும் இனப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: Μῆδοι
  choice: மேதியர்கள்
  rationale: மேதியா பகுதியைச் சேர்ந்த மக்களைக் குறிக்கும் மரபான தமிழ் இனப்பெயர்.
- source_word: Ἐλαμῖται
  choice: ஏலாமியர்கள்
  rationale: ஏலாம் பகுதியைச் சேர்ந்த மக்களைக் குறிக்கும் இனப்பெயரை இயல்பான தமிழில் தருகிறது.
- source_word: οἱ κατοικοῦντες
  choice: குடியிருக்கிறவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பெயரெச்சத்தின் ‘அங்கு வசிப்பவர்கள்’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: τὴν Μεσοποταμίαν
  choice: மெசொப்பொத்தாமியா
  rationale: புவியியல் பெயரின் அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ἰουδαίαν
  choice: யூதேயா
  rationale: பரந்த இன அல்லது சமயப் பொருளைச் சேர்க்காமல் புவியியல் பகுதியையே குறிக்கிறது.
- source_word: τε καὶ
  choice: -இலும் ... -இலும்
  rationale: பட்டியலின் கூறுகளை இயல்பான தமிழில் இணைக்கிறது; கிரேக்க இணைப்பின் மெலிந்த சேர்க்கை நுணுக்கத்தை மிகைப்படுத்தவில்லை.
- source_word: Καππαδοκίαν
  choice: கப்பதோக்கியா
  rationale: பிரதேசப் பெயரின் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: Πόντον
  choice: பொந்து
  rationale: பொந்து பிரதேசத்தைக் குறிக்கும் வழக்கமான தமிழ் வடிவம்.
- source_word: τὴν Ἀσίαν
  choice: ஆசியா
  rationale: மூலத்தின் புவியியல் பெயரை முதன்மை உரையில் வைத்துக்கொண்டு, அது நவீன கண்டம் அல்ல என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
