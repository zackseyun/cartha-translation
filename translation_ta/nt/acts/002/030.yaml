language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: ta
  text: ஆகவே, அவர் ஒரு தீர்க்கதரிசியாக இருந்ததாலும், கடவுள் அவருக்கு சத்தியம் செய்து வாக்களித்திருந்ததை அறிந்திருந்ததாலும், அவருடைய வம்சத்தில் ஒருவரை அவருடைய அரியணையில் அமரச் செய்வதாக[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அவருடைய இடுப்பின் கனியிலிருந்து ஒருவரை.” அதாவது, அவருடைய வழிவந்த ஒருவரை.'
    reason: கிரேக்க மூலத்தின் உடல்சார்ந்த வம்சவழி உருவகத்தைப் பாதுகாத்து விளக்குதல்.
lexical_decisions:
- source_word: προφήτης
  choice: தீர்க்கதரிசி
  rationale: தெய்வீக வெளிப்பாட்டின்படி பேசுகிறவரைக் குறிக்கும் நிலையான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களிலுள்ள தாவீதைக் குறித்த வாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὑπάρχων
  choice: இருந்ததாலும்
  rationale: சூழ்நிலை மற்றும் காரணப் பொருளைத் தரும் பங்கேற்புவினையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰδὼς
  choice: அறிந்திருந்ததாலும்
  rationale: ὑπάρχων என்பதுடன் இணைந்த காரணத் தொடரைத் தக்கவைத்து, முன்பே அறிந்திருந்த நிலையை இயல்பாகக் காட்டுகிறது.
- source_word: ὅρκῳ ὤμοσεν
  choice: ஆணையிட்டு வாக்களித்திருந்ததை
  rationale: பெயர்ச்சொல் மற்றும் வினைச்சொல் இணைந்து தரும் உறுதியான, புனிதமான வாக்குறுதியின் வலிமையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: தன் வழிவந்த ஒருவரை
  rationale: உடல்சார்ந்த வம்சவழியைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளை நவீன வாசகர்களுக்குத் தெளிவாக வழங்குகிறது; சொற்சொல் உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καθίσαι
  choice: அமரச் செய்வதாக
  rationale: கடவுள் அந்த வழித்தோன்றலை அரியணையில் அமர்த்துவார் என்ற காரணவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: தனது அரியணையில்
  rationale: அரசாட்சியில் அமர்த்தப்படுவதைக் குறிக்கும் இயல்பான தமிழ்; இறுதி αὐτοῦ தாவீதைக் குறிப்பதாகச் சூழல் காட்டுகிறது.
theological_decisions:
- issue: தாவீதுக்குக் கொடுக்கப்பட்ட அரச வம்ச வாக்குறுதி
  choice: வழிவந்த ஒருவர் அரியணையில் அமர்த்தப்படுவார் என்ற வம்ச மற்றும் அரசாட்சி மொழியை அப்படியே வைத்தல்
  alternative: “மேசியாவைத் தனது அரியணையில் அமரச் செய்வார்” என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: சுற்றியுள்ள உரையில் பேதுரு இவ்வாக்குறுதியை இயேசுவுக்குப் பொருத்துகிறார்; ஆனால் இந்த வசனம் தானாகவே தாவீதின் வழித்தோன்றல் மற்றும் அரியணை என்ற மொழியில்தான் வாக்குறுதியைக் கூறுகிறது. எனவே கிறிஸ்துவியல் முடிவை வசனத்துக்குள் கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. வசனம் அடுத்த வசனத்தில் தொடரும் நீண்ட வாக்கியத்தின் ஒரு பகுதியாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. [a] குறி பிரதான உரையில் இடம்பெற்றுள்ளது.
