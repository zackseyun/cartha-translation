revisions:
- from: ஆகவே, அவர் ஒரு தீர்க்கதரிசியாக இருந்ததாலும், தன் வழிவந்த ஒருவரைத் தனது அரியணையில் அமரச் செய்வதாகக் கடவுள் தனக்கு ஆணையிட்டு வாக்களித்திருந்ததை அறிந்திருந்ததாலும்[a],
  to: ஆகவே, அவர் ஒரு தீர்க்கதரிசியாக இருந்ததாலும், கடவுள் அவருக்கு சத்தியம் செய்து வாக்களித்திருந்ததை அறிந்திருந்ததாலும், அவருடைய வம்சத்தில் ஒருவரை அவருடைய அரியணையில் அமரச் செய்வதாக[a],
  rationale: The revision replaces an inaccurate ‘commanding’ expression with an oath formula and explicitly identifies David as the referent of the dative and final possessive pronouns. It retains the verse’s incomplete, continuing syntax, causal participial sense, dynastic promise, and causative enthronement.
