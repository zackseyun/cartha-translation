id: ACT.2.32
reference: Acts 2:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: ta
  text: இந்த இயேசுவைக் கடவுள் உயிர்த்தெழச் செய்தார்[a]; அவரைக் குறித்து நாங்கள் அனைவரும் சாட்சிகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த இயேசுவைக் கடவுள் எழுப்பினார்.” இங்கு கிரேக்க வினைச்சொல் இறந்தோரிலிருந்து உயிர்த்தெழுதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: இந்த இயேசுவை
  rationale: τοῦτον என்பதன் சுட்டும் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தக்கவைத்து, முன்பு குறிப்பிடப்பட்ட இயேசுவையே குறிப்பாகச் சுட்டுகிறது.
- source_word: ἀνέστησεν
  choice: உயிர்த்தெழச் செய்தார்
  rationale: இங்கு வினைச்சொல் இறந்த நிலையிலிருந்து உயிர்த்தெழச் செய்வதைக் குறிக்கிறது; கடவுள் செய்பவராக உள்ள கிரேக்கச் செயப்பாட்டு அமைப்பையும் இத்தேர்வு தெளிவாகக் காக்கிறது.
- source_word: ὁ θεός
  choice: கடவுள்
  rationale: வாக்கியத்தின் வெளிப்படையான எழுவாயை பொதுவாகப் புரியும் நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: οὗ
  choice: அவரைக் குறித்து
  rationale: சாட்சிகள் இயேசுவையும், குறிப்பாக அவர் உயிர்த்தெழுந்ததையும் பற்றிச் சான்றளிப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தொடர்புப்பெயரின் நபர்ச் சுட்டுதலைத் தக்கவைக்கிறது.
- source_word: πάντες ἡμεῖς
  choice: நாங்கள் அனைவரும்
  rationale: πάντες மற்றும் ἡμεῖς இணைப்பிலுள்ள ‘நாங்கள் எல்லாரும்’ என்ற வலியுறுத்தலை இயல்பான தமிழ் சொல்வரிசையில் காக்கிறது.
- source_word: ἐσμεν μάρτυρες
  choice: சாட்சிகள்
  rationale: மூலத்தில் μάρτυρες பெயர்ச்சொல்லாக இருப்பதால், தமிழிலும் ‘சாட்சிகள்’ என்ற பெயர்ச்சொல் அமைப்பு தக்கவைக்கப்படுகிறது; நிகழ்வைக் கண்டறிந்து அதைப் பற்றிச் சான்றளிப்பவர்களைக் குறிக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் குறித்த சொற்றொடர்
  choice: இந்த இயேசுவைக் கடவுள் உயிர்த்தெழச் செய்தார்
  alternative: இந்த இயேசுவைக் கடவுள் எழுப்பினார்
  rationale: இயேசுவின் உயிர்த்தெழுதலைக் கடவுளின் செயலாக வசனம் நேரடியாகக் கூறுகிறது. ‘உயிர்த்தெழச் செய்தார்’ என்பது சூழலில் உள்ள பொருளைத் தெளிவாகச் சொல்கிறது; அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இந்த இயேசு’ என்ற சுட்டும் வலியுறுத்தலும், ‘நாங்கள் அனைவரும்’ என்ற கூட்டுவலியுறுத்தலும் தக்கவைக்கப்பட்டுள்ளன.
