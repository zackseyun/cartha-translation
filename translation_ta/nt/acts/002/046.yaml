id: ACT.2.46
reference: Acts 2:46
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: ta
  text: அவர்கள் ஒவ்வொரு நாளும் ஒரே மனதுடன் ஆலய வளாகத்தில் தொடர்ந்து கூடிவந்து[a], வீடுதோறும் அப்பத்தைப் பிட்டு[b], மிகுந்த மகிழ்ச்சியோடும் எளிய உள்ளத்தோடும் உணவில் பங்குகொண்டார்கள்[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆலயம்’ என்பதற்கான கிரேக்கச் சொல், ஆலயத்தின் உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: ‘அப்பத்தைப் பிட்டல்’ என்பது சாதாரணமாக ஒன்றாக உண்ணும் உணவைக் குறிக்கலாம்; சிலர் இதில் ஆண்டவரின் இராப்போஜனமும் அடங்கியிருப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘உணவை உண்டார்கள்.’
    reason: lexical_alternative
  - marker: d
    text: அல்லது, ‘நேர்மையான உள்ளத்தோடு’ அல்லது ‘தாராள உள்ளத்தோடு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: ஒவ்வொரு நாளும்
  rationale: κατά + வேற்றுமை வடிவத்தின் பகிர்வு சார்ந்த, தொடர்ச்சியான பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: προσκαρτεροῦντες
  choice: தொடர்ந்து ஒன்றுகூடினார்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினை காட்டும் நீடித்த ஈடுபாட்டைத் தெரிவிக்கிறது; சூழலில் ஆலய வளாகத்தில் தொடர்ச்சியாகக் கூடிவந்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁμοθυμαδόν
  choice: ஒரே நோக்கத்தோடு
  rationale: ஒற்றுமையையும் பகிரப்பட்ட மனநோக்கையும் தெரிவிக்கிறது; வெறும் உடனிருப்பாகக் குறுக்கவில்லை.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலய வளாகத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் முழு ஆலயத் தொகுதியைக் குறிக்கிறது.
- source_word: κλῶντές ... ἄρτον
  choice: அப்பத்தைப் பிட்டு
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகளில் வரும் வழக்குச் சொல்லை நெருக்கமாகத் தக்கவைத்து, சாதாரண உணவா ஆண்டவரின் இராப்போஜனத் தொடர்பா என்பதை முடிவுசெய்யாமல் விடுகிறது.
- source_word: κατ’ οἶκον
  choice: வீடுதோறும்
  rationale: κατά என்பதன் பகிர்வு சார்ந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் அளித்து, பல்வேறு வீடுகளில் நிகழ்ந்ததைச் சுட்டுகிறது.
- source_word: μετελάμβανον τροφῆς
  choice: உணவைப் பகிர்ந்து உண்டார்கள்
  rationale: μεταλαμβάνω என்பதன் பங்குபெறுதல்/உட்கொள்ளுதல் பொருளையும், கூட்டு உணவுச் சூழலையும் ஒருங்கே தெரிவிக்கிறது; τροφή என்பதன் அடிப்படைப் பொருளான ‘உணவு’ என்பதையும் காக்கிறது.
- source_word: ἐν ἀγαλλιάσει
  choice: மிகுந்த மகிழ்ச்சியோடு
  rationale: ἀγαλλίασις குறிக்கும் பொங்கும் அல்லது பேருவகைத் தன்மையை சாதாரண ‘மகிழ்ச்சி’யைவிட தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀφελότητι καρδίας
  choice: கபடமற்ற உள்ளத்தோடு
  rationale: ἀφελότης குறிக்கும் கலப்பற்ற தன்மை, நேர்மை, எளிமை ஆகிய பரப்பை இயல்பான தமிழில் தருகிறது; ‘தாராளம்’ என்ற ஒரே பொருளுக்குள் அதைச் சுருக்கவில்லை.
theological_decisions:
- issue: ‘அப்பத்தைப் பிட்டல்’ என்பது ஆண்டவரின் இராப்போஜனத்தை வெளிப்படையாகக் குறிக்கிறதா?
  choice: பரந்த பொருளுள்ள ‘அப்பத்தைப் பிட்டு’ என்ற சொல்லாட்சியை முதன்மை உரையில் தக்கவைத்தல்.
  alternative: இதைச் சாதாரணக் கூட்டு உணவு என்று மட்டும் மொழிபெயர்த்தல், அல்லது ஆண்டவரின் இராப்போஜனம் என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: உடனடி சூழலில் τροφή (‘உணவு’) சாதாரணக் கூட்டு உணவை ஆதரிக்கிறது; எனினும் இச்சொற்றொடர் கிறிஸ்தவப் பந்தி ஐக்கியத்தையும் ஆண்டவரின் இராப்போஜனத்தையும் எதிரொலிக்கக்கூடும். ஆகவே உள்ள இறையியல் நுணுக்கம் தீர்த்துவைக்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலய வளாகம்,’ ‘வீடுதோறும்’ ஆகியவை மூலத்தின் இடவியல் மற்றும் பகிர்வு சார்ந்த நுணுக்கங்களைத் தெளிவாக்குகின்றன. ‘அப்பத்தைப் பிட்டு’ என்ற வேதாகம வழக்குச் சொல் அதன் திட்டமிட்ட தெளிவின்மையுடன் தக்கவைக்கப்பட்டுள்ளது.
