  source_fidelity: முதன்மை உரையில் ‘உணவைப் பகிர்ந்து உண்டார்கள்’ என்பது μετελάμβανον τροφῆς என்பதிலுள்ள ‘உணவில் பங்குகொண்டார்கள்/உண்டார்கள்’ என்ற பொருளைத் தாண்டி, மூலத்தில் வெளிப்படையாக இல்லாத ‘பகிர்தல்’ செயலைச் சேர்க்கிறது. அதை நீக்குவது மூலத்திற்கு நெருக்கமானது. மற்ற முக்கியக் கூறுகள்—நாள்தோறும், ஒரே மனம், ஆலய வளாகம், வீடுதோறும், அப்பம் பிட்டல், மகிழ்ச்சி, உள்ளத்தின் எளிமை—பாதுகாக்கப்படுகின்றன.
  naturalness: ‘ஆலய வளாகத்தில் தொடர்ந்து கூடிவந்து’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும், προσκαρτεροῦντες-இன் தொடர்ச்சியான ஈடுபாட்டையும் ἐν τῷ ἱερῷ-இன் இடக்குறிப்பையும் தெளிவாகவும் தருகிறது. ‘எளிய உள்ளத்தோடு’ என்பது ‘கபடமற்ற உள்ளத்தோடு’ என்பதைக் காட்டிலும் ἀφελότης-இன் எளிமை/மனத்திறந்த தன்மை என்ற பரந்த நுணுக்கத்தை நன்றாகத் தக்கவைக்கிறது.
