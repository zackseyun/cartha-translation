id: ACT.2.26
reference: Acts 2:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: ta
  text: 'இதனால் என் இதயம் மகிழ்ந்தது;

    என் நாவும் பேருவகை கொண்டது.

    மேலும், என் மாம்சமும்கூட நம்பிக்கையில் தங்கியிருக்கும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உடல் நம்பிக்கையில் இளைப்பாறும்.”
    reason: σάρξ என்பதை ‘உடல்’ என்றும், κατασκηνώσει என்பதைச் சூழலுக்கேற்ப ‘இளைப்பாறும்’ என்றும் மொழிபெயர்க்கக்கூடிய சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்
  rationale: διά + accusative இங்குக் காரணத்தைச் சுட்டுகிறது. ‘இதனால்’ என்பது அதன் காரணவியல் தொடர்பை இயல்பான தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: என் இதயம் மகிழ்ந்தது
  rationale: செயப்பாட்டு வடிவம் இங்கு நிலையை உணர்த்தும் இயல்பான சொல்லாட்சியாக உள்ளது. ‘இதயம்’ என்ற வேதாகம உருவகத்தையும் உள்ளார்ந்த மனிதனை மிகையாக விளக்காமல் பாதுகாக்கிறது.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: என் நாவும் பேருவகை கொண்டது
  rationale: ἠγαλλιάσατο தீவிரமான மகிழ்ச்சியைச் சுட்டுகிறது; ‘பேருவகை கொண்டது’ அதன் வலிமையையும் உயர்ந்த கவிநடையையும் தருகிறது. γλῶσσα என்பதற்கு ‘நா’ என்று நேரடியாக மொழிபெயர்த்து, வாய்மொழிப் புகழ்ச்சியின் உருவகத்தை நிலைநிறுத்துகிறது.
- source_word: ἔτι δὲ καὶ
  choice: மேலும் ... கூட
  rationale: இச்சொற்கூட்டின் தொடர்ச்சியையும் வலியுறுத்தலையும் தமிழில் ‘மேலும்’ மற்றும் ‘கூட’ இணைந்து வெளிப்படுத்துகின்றன.
- source_word: ἡ σάρξ μου
  choice: என் மாம்சம்
  rationale: இங்கு σάρξ ஒழுக்கநிலை அல்லது ‘பாவ இயல்பு’ என்பதைக் குறிக்காமல், உடல்சார்ந்த மனித இருப்பைக் குறிக்கிறது. ‘மாம்சம்’ மூலச்சொல்லின் மனிதவியல் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: κατασκηνώσει
  choice: தங்கியிருக்கும்
  rationale: இந்த வினை குடியிருத்தல் அல்லது பாளயமிட்டு வசித்தல் என்ற உருவகத்தைக் கொண்டது. ‘தங்கியிருக்கும்’ என்பது அதை இயல்பான நவீன தமிழில் காத்து, ‘இளைப்பாறும்’ என்ற குறுகிய விளக்கத்துக்குள் பொருளை அடைக்கவில்லை.
- source_word: ἐπ’ ἐλπίδι
  choice: நம்பிக்கையில்
  rationale: ἐπί + dative இங்கு அடிப்படை அல்லது நிலைக்களத்தைக் குறிக்கிறது. ‘நம்பிக்கையில்’ என்பது நம்பிக்கையான பாதுகாப்பைக் காட்டுவதோடு கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் சார்ந்த மேற்கோளில் σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: என் மாம்சம்
  alternative: என் உடல்
  rationale: இங்கு சொல் ஒழுக்கரீதியான ‘பாவ இயல்பை’ அல்ல, உடல்சார்ந்த இருப்பைக் குறிக்கிறது. ‘மாம்சம்’ மூலத்தின் சொல் மற்றும் மனிதவியல் நுணுக்கத்தைப் பாதுகாக்கிறது; தெளிவுக்காக ‘உடல்’ என்பது அடிக்குறிப்பில் மாற்றாகத் தரப்படுகிறது.
- issue: κατασκηνώσει ἐπ’ ἐλπίδι என்பதன் நுணுக்கம்
  choice: நம்பிக்கையில் தங்கியிருக்கும்
  alternative: நம்பிக்கையில் இளைப்பாறும்
  rationale: தேர்ந்தெடுக்கப்பட்ட வாசகம் பாதுகாப்பாகத் தங்கியிருக்கும் உருவகத்தைப் பாதுகாக்கிறது. உயிர்த்தெழுதல் குறித்த சூழல்சார் பொருளை வசனத்துக்குள்ளே வெளிப்படையாகச் சேர்க்காமல், அதன் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதயம்’, ‘நா’, ‘மாம்சம்’ ஆகிய வேதாகம உருவகங்கள் தேவையற்ற விளக்கமின்றிப் பாதுகாக்கப்பட்டுள்ளன; வரி பிரிப்பு மூலத்தின் இணைநிலைக் கவியமைப்பைத் தெளிவாக்குகிறது.
