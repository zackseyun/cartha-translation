  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: ta
  text: வாழ்வின் பாதைகளை எனக்கு அறிவித்தீர்; உமது முன்னிலையில் என்னை மகிழ்ச்சியால் நிரப்புவீர்.[a]
