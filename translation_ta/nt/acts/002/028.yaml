    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: எனக்கு அறிவித்தீர்
  rationale: இறந்தகால வினை வடிவத்தையும் மறைமுகச் செயப்படுபொருளையும் நேரடியாகக் காக்கிறது; தமிழில் இயல்பாகவும் உள்ளது.
- source_word: ὁδοὺς ζωῆς
  choice: வாழ்வின் பாதைகளை
  rationale: ὁδούς என்பதன் பன்மையையும், ζωῆς உடனான திறந்த பொருள் உறவையும் காக்கிறது; ‘வாழ்க்கை முறைகள்’ என்ற தவறான நவீனப் பொருளைத் தவிர்க்கிறது.
- source_word: πληρώσεις με εὐφροσύνης
  choice: என்னை மகிழ்ச்சியால் நிரப்புவீர்
  rationale: எதிர்காலத்தையும், நிரப்பப்படும் உள்ளடக்கமாகிய மகிழ்ச்சியையும் தெளிவாக எடுத்துரைக்கிறது.
- source_word: μετὰ τοῦ προσώπου σου
  choice: உமது திருமுகத்தின் முன்னிலையில்
  rationale: ‘உமது முகத்துடன்’ என்ற மூலப் படிமத்தை ஓரளவு காத்தபடியே, தேவனுடைய நேரடியான முன்னிலையைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: சங்கீத மேற்கோளில் தேவனுடைய முகம்/முன்னிலை குறித்த சொற்றொடர்
  choice: உமது திருமுகத்தின் முன்னிலையில்
  alternative: உமது முன்னிலையில்
  rationale: πρόσωπον என்பதன் ‘முகம்’ என்ற படிமத்தையும் தனிப்பட்ட தெய்வீக முன்னிலை என்ற பொருளையும் காக்கிறது; எந்தக் கோட்பாட்டு முடிவையும் கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. தேவனை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; ‘திருமுகம்’ என்பது மூலத்தின் முகப் படிமத்தை இயல்பாகக் காக்கிறது.
