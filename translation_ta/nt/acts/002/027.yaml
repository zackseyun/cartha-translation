source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: ta
  text: ஏனெனில், என் உயிரைப் பாதாளத்தில் கைவிடமாட்டீர்[a]; உம்முடைய பரிசுத்தரை[b] சிதைவைக்[c] காண விடமாட்டீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஷியோல்.’ இந்த மேற்கோளின் பின்னணியிலுள்ள எபிரெய உரையில் ‘ஷியோல்’ உள்ளது; இங்குள்ள கிரேக்க உரையில் ‘ஹாதேஸ்’ உள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘உம்முடைய உண்மையுள்ளவரை.’
    reason: lexical_alternative
  - marker: c
    text: அதாவது, உடலின் அழுகலும் சிதைவும்; பாரம்பரிய மொழிபெயர்ப்புகளில் ‘அழிவு’ என்றும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: கைவிடமாட்டீர்
  rationale: ஒருவரை ஓர் இடத்திலோ நிலையிலோ விட்டுவிடுதல் என்ற வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν ψυχήν μου
  choice: என் உயிரை
  rationale: ψυχή இச்சங்கீத மேற்கோளில் ‘உயிர்’, ‘தன் முழு ஆளுமை’, ‘ஆத்துமா’ ஆகிய பொருள் வாய்ப்புகளைக் கொண்டது. ‘என் உயிரை’ என்பது தமிழில் இயல்பாகவும், மரணம்–உயிர்த்தெழுதல் சூழலுக்கு ஏற்றதாகவும் இருந்து, தனியே ஒரு தொழில்நுட்பமான மானிடவியல் கூற்றைத் திணிக்காது.
- source_word: εἰς ᾅδην
  choice: பாதாளத்தில்
  rationale: ᾅδης இறந்தோரின் உலகம் அல்லது இருப்பிடத்தைக் குறிக்கிறது; ‘நரகம்’ என மொழிபெயர்ப்பதால் உண்டாகக்கூடிய பிற்கால தண்டனை சார்ந்த கருத்தைத் தவிர்க்க ‘பாதாளம்’ பயன்படுத்தப்பட்டது. ‘கைவிடுதல்’ என்ற தமிழ் வினையுடன் இடப்பொருள் தரும் ‘-த்தில்’ இயல்பாக அமைகிறது.
- source_word: δώσεις … ἰδεῖν
  choice: காணவும் விடமாட்டீர்
  rationale: ‘காணும்படி கொடுப்பீர்’ என்ற சொற்சொல் அமைப்பைக் காட்டிலும், அனுமதித்தல் என்னும் கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τὸν ὅσιόν σου
  choice: உம்முடைய பரிசுத்தரை
  rationale: ὅσιος என்பது தேவனுக்குரிய பரிசுத்தம், பக்தி, உண்மைத்தன்மை ஆகிய பொருள் நிழல்களைக் கொண்டது. அப்போஸ்தலர் 2-ன் கிறிஸ்துவைப் பற்றிய பயன்பாட்டைப் பாதுகாக்கும் நிலைபெற்ற மொழியாக ‘பரிசுத்தர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: διαφθοράν
  choice: அழிவு
  rationale: இச்சூழலில் உடல் சிதைவைக் குறிக்கிறது. ‘அழிவு’ சுருக்கமாகவும் dignified-ஆகவும் உள்ளது; குறிப்பான ‘உடல் சிதைவு’ விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் சூழலில் ᾅδης என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: இறந்தோரின் உலகம்; ஷியோல்; கல்லறை
  rationale: கிரேக்கச் சொல்லின் இறந்தோர் இருப்பிடம் என்ற பரப்பைப் பாதுகாத்து, ‘நரகம்’ என்ற தண்டனை சார்ந்த கருத்தையோ ‘கல்லறை’ என்ற குறுகிய பொருளையோ திணிக்காமல் இருக்கிறது. எபிரெயப் பின்னணியான ‘ஷியோல்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τὸν ὅσιόν σου என்பவரின் கிறிஸ்துவியல் அடையாளம்
  choice: உம்முடைய பரிசுத்தர்
  alternative: உம்முடைய உண்மையுள்ளவர்; உம்முடைய பக்தர்
  rationale: பேதுரு இச்சங்கீதத்தை இயேசுவின் உயிர்த்தெழுதலுக்குப் பயன்படுத்தும் சூழலைப் பாதுகாக்கிறது; அதேவேளையில் ὅσιος என்பதிலுள்ள ‘உண்மையுள்ளவர்’ என்ற பொருள் வாய்ப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: மரியாதைமிக்க இறைமுகப் பேச்சுக்காக ‘உம்முடைய’, ‘விடமாட்டீர்’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. நடை நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியுமாறும் சங்கீத மேற்கோளுக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘பாதாளம்’ தமிழ்க் கிறிஸ்தவச் சொல்லாட்சியில் அறியப்பட்டதாக இருந்தாலும் ‘நரகம்’ என்பதோடு குழப்பப்படாதபடி அடிக்குறிப்பு விளக்கம் தரப்பட்டுள்ளது.
