source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: ta
  text: ஆகவே, அவர் கடவுளுடைய வலப்பக்கத்திற்கு உயர்த்தப்பட்டு[a], தந்தையிடமிருந்து பரிசுத்த ஆவியின் வாக்குறுதியைப் பெற்ற பின்பு[b], நீங்கள் பார்த்தும் கேட்டும் கொண்டிருக்கிற இதை அவர் பொழிந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய வலக்கையால் உயர்த்தப்பட்டு.” கிரேக்கத் தத்தி வேற்றுமை, இடத்தைக் குறிக்கும் பொருளிலோ (“வலப்பக்கத்திற்கு”) கருவியைக் குறிக்கும் பொருளிலோ (“வலக்கையால்”) புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “வாக்குறுதி அளிக்கப்பட்ட பரிசுத்த ஆவியைப் பெற்ற பின்பு.” கிரேக்கத் தொடர், பரிசுத்த ஆவியைப் பற்றிய வாக்குறுதியையோ, வாக்குறுதியான கொடையாகிய ஆவியையேவோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: கடவுளுடைய வலப்பக்கத்திற்கு
  rationale: ὑψωθεὶς என்பதோடு இடத்தைக் குறிக்கும் தத்தியாகப் புரிந்துகொள்வது, உடனுள்ள சங்கீதம் 110 சார்ந்த அரியணை ஏற்றப் பின்னணிக்கு நன்கு பொருந்துகிறது; கருவிப்பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உயிர்த்தெழுதல் மற்றும் தாவீதுக்குரிய தீர்க்கதரிசன வாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: ὑψωθεὶς
  choice: உயர்த்தப்பட்டு
  rationale: இறைவனால் நிகழ்த்தப்பட்ட உயர்த்துதலைக் குறிக்கும் இறந்தகாலச் செயப்பாட்டு வினையெச்சத்தின் பொருளைப் பாதுகாக்கிறது; சூழலில் மேன்மைப்படுத்தப்பட்டு அரியணை ஏற்றப்படுதல் என்ற நுண்பொருளையும் தாங்குகிறது.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: பரிசுத்த ஆவியின் வாக்குறுதியை
  rationale: கிரேக்கத்தின் உருபமைப்பை நெருக்கமாகப் பாதுகாத்து, வாக்குறுதி பரிசுத்த ஆவியைக் குறித்ததா அல்லது வாக்குறுதியான கொடை ஆவியேதானா என்ற உண்மையான இருபொருள் வாய்ப்பைத் திறந்துவைக்கிறது.
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: தந்தையிடமிருந்து ... பெற்ற பின்பு
  rationale: παρά + பிறப்புவேற்றுமை குறிக்கும் மூலத்தையும், முதன்மை வினைக்கு முன்னதாக நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகால வினையெச்சத்தின் காலத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξέχεεν
  choice: பொழிந்தருளினார்
  rationale: முடிவுற்ற பொழிதல் செயலைத் தெரிவிக்கிறது; மரியாதையான தமிழ் நடையில் தெய்வீகச் செயலை இயல்பாகக் கூறுகிறது.
- source_word: τοῦτο ὃ ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: நீங்கள் இப்போது பார்த்தும் கேட்டும் கொண்டிருக்கிற இதை
  rationale: τοῦτο என்பதைக் கூடுதல் விளக்கமின்றி ‘இதை’ என வைத்திருக்கிறது; வெளிப்படையான ὑμεῖς தரும் வலியுறுத்தலும் நிகழ்கால உணர்வும் தமிழில் இயல்பாக வெளிப்படுகின்றன.
theological_decisions:
- issue: τῇ δεξιᾷ τοῦ θεοῦ என்பது கடவுளின் வலப்பக்கத்திற்கு உயர்த்தப்படுதலா அல்லது கடவுளின் வலக்கையால் உயர்த்தப்படுதலா
  choice: கடவுளுடைய வலப்பக்கத்திற்கு உயர்த்தப்பட்டு
  alternative: கடவுளுடைய வலக்கையால் உயர்த்தப்பட்டு
  rationale: உடனுள்ள சங்கீதம் 110 மேற்கோளும் மேன்மைப்படுத்தல் பின்னணியும் இடப்பொருளை ஆதரிக்கின்றன. எனினும், கிரேக்கத் தத்தி கருவிப்பொருளையும் அனுமதிப்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου என்பது ஆவியைப் பற்றிய வாக்குறுதியா அல்லது வாக்குறுதியான ஆவியையே குறிக்கிறதா
  choice: பரிசுத்த ஆவியின் வாக்குறுதி
  alternative: வாக்குறுதி அளிக்கப்பட்ட பரிசுத்த ஆவி
  rationale: முதன்மை உரை கிரேக்க உருபமைப்பின் இயல்பான இருபொருள் வாய்ப்பைப் பாதுகாக்கிறது. அடுத்துள்ள ‘இதைப் பொழிந்தார்’ என்பது ஆவியே வாக்குறுதியான கொடை என்ற புரிதலை ஆதரிக்கலாம்; அதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது, ஆனால் ஒரே விளக்கமாகத் திணிக்கவில்லை.
translation_notes:
  register: நவீன தரமான, கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ். ‘பொழிந்தருளினார்’ என்பது வேதாகமச் சூழலுக்கேற்ற மரியாதை நடையைக் காக்கிறது; வாக்கிய அமைப்பு கிரேக்கத்தின் தர்க்கத் தொடர்பையும் செயல் வரிசையையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
