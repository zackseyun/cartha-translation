revisions:
- from: ஏனெனில், அந்த வாக்குறுதி உங்களுக்கும் உங்கள் பிள்ளைகளுக்கும் தொலைவில் இருக்கும் அனைவருக்கும் உரியது—நம் ஆண்டவராகிய கடவுள் அழைக்கும் எத்தனை பேருக்கோ அத்தனை பேருக்கும் உரியது.[a][b]
  to: ஏனெனில், அந்த வாக்குறுதி உங்களுக்கும், உங்கள் பிள்ளைகளுக்கும், தொலைவில் உள்ள அனைவருக்கும் உரியது—நம்முடைய கடவுளாகிய ஆண்டவர் அழைக்கும் எத்தனை பேருக்கோ அத்தனை பேருக்கும் உரியது.[a][b]
