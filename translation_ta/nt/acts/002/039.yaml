source:
  edition: SBLGNT
  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: ta
  text: ஏனெனில், அந்த வாக்குறுதி உங்களுக்கும், உங்கள் பிள்ளைகளுக்கும், தொலைவில் உள்ள அனைவருக்கும் உரியது—நம்முடைய கடவுளாகிய ஆண்டவர் அழைக்கும் எத்தனை பேருக்கோ அத்தனை பேருக்கும் உரியது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தொலைவில் உள்ள அனைவரும்” என்பது இடவியல் ரீதியாகத் தொலைவில் இருப்பவர்களையோ, உடன்படிக்கை உறவிலிருந்து தொலைவில் இருப்பவர்களையோ, அல்லது இரு வகையினரையுமோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'வேறு விதமாக: “நம்முடைய கடவுளாகிய ஆண்டவர் யாரையெல்லாம் அழைக்கிறாரோ அவர்கள் அனைவருக்கும்.” கிரேக்கத்தில் இதன் பொருள் சொற்சொல்லாக, “நம்முடைய கடவுளாகிய ஆண்டவர் அழைக்கக்கூடிய எத்தனை பேரோ” அல்ல, “அவர் அழைக்கும் எத்தனை பேரோ” என்பதாகும்.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் பேதுரு கூறிய அழைப்புக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: ἐπαγγελία
  choice: அந்த வாக்குறுதி
  rationale: கிரேக்கச் சொல் நேரடியாக ‘வாக்குறுதி’ என்பதைக் குறிக்கிறது; சூழலில் பரிசுத்த ஆவியின் கொடை தொடர்புடையதாக இருந்தாலும், மூலவாக்கியம் கொடையை அல்ல, வாக்குறுதியையே பெயரிடுகிறது. குறிப்பிட்ட வாக்குறுதி முன்சூழலில் இருப்பதால் ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: τέκνοις
  choice: பிள்ளைகளுக்கும்
  rationale: குடும்ப உறவை இயல்பாகப் பாதுகாக்கும் பொதுவான தமிழ்ச் சொல்; வயதையோ சந்ததியின் எல்லையையோ தேவையின்றி வரையறுப்பதில்லை.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: தொலைவில் இருக்கும் அனைவருக்கும்
  rationale: இடவியல் தொலைவையும் உடன்படிக்கை சார்ந்த தொலைவையும் சாத்தியமாக வைத்திருக்கும் இயல்பான மொழிபெயர்ப்பு; எந்த ஒரு விளக்கத்திற்கும் மட்டும் சொற்றொடரைச் சுருக்கவில்லை.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: அழைக்கும் எத்தனை பேருக்கோ அத்தனை பேருக்கும்
  rationale: ὅσους ἂν என்பதன் வரையறுக்கப்படாத ஆனால் முழுமையான பரப்பைத் தமிழில் தெளிவாகக் காட்டுகிறது. நடுத்தர வினை வடிவத்திலிருந்து ‘தம்மிடம்’ என வெளிப்படையாகச் சேர்க்காமல், சமீபத்திய திருத்தத்துடன் ஒத்தவாறு ‘அழைக்கும்’ என வைத்துள்ளது.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: நம் ஆண்டவராகிய கடவுள்
  rationale: ‘Lord our God’ என்ற அடையாளப்படுத்தும் அமைப்பை இயல்பான, மரியாதைக்குரிய தமிழில் வெளிப்படுத்துகிறது; ‘நம்’ என்ற உடைமையையும் காக்கிறது.
theological_decisions:
- issue: ‘தொலைவில் இருப்பவர்கள்’ என்பதன் பரப்பு
  choice: ‘தொலைவில் இருக்கும் அனைவரும்’ என்று பரந்தவாறு மொழிபெயர்க்கப்பட்டது.
  alternative: தொலைதூரத்தில் வாழும் யூதர்கள் மட்டும்; பிற இனத்தார் மட்டும்; அல்லது இடவியல் மற்றும் உடன்படிக்கை சார்ந்த இருவகைத் தொலைவும்.
  rationale: வசனம் இவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தவில்லை. ஆகவே உண்மையான பொருள் தெளிவின்மை மொழிபெயர்ப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: ὅσους ἂν προσκαλέσηται என்பதில் இறை அழைப்பின் இயல்பு
  choice: ‘நம் ஆண்டவராகிய கடவுள் அழைக்கும் எத்தனை பேருக்கோ’ என்று, அழைப்பின் செயல்முறையை விளக்காமல் மொழிபெயர்க்கப்பட்டது.
  alternative: தவறாமல் இரட்சிப்பை விளைவிக்கும் விசேஷ அழைப்பு; அல்லது பொதுவான அழைப்பு.
  rationale: இறைவன் அழைப்பதை கிரேக்கம் தெளிவாகக் கூறுகிறது; ஆனால் அந்த அழைப்பின் இறையியல் செயல்முறையை இவ்வசனம் வரையறுக்கவில்லை. எனவே எந்தச் சமயப்பிரிவு சார்ந்த முறையும் இறக்குமதி செய்யப்படவில்லை.
- issue: வாக்குறுதி யாருக்கு உரியது என்பதற்கும் இறை அழைப்புக்கும் உள்ள இலக்கண உறவு
  choice: நீண்ட கோட்டுக்குப் பின் மறுபடியும் ‘உரியது’ என்று கூறி, ‘எத்தனை பேரை ஆண்டவர் அழைக்கிறாரோ’ என்பது முன் கூறிய குழுக்களின் பரப்பை வரையறுப்பதைத் தெளிவாக்கியது.
  alternative: வெறும் காற்புள்ளியுடன் தொடர்வது; இதனால் தமிழில் ‘அழைக்கும்’ என்பது ‘தொலைவில் இருப்பவர்கள்’ என்பதை மட்டும் குறிக்கிறதுபோல் வாசிக்கப்படலாம்.
  rationale: மூலத்தின் qualifying force-ஐப் பாதுகாத்து, தமிழில் தவறான இணைப்பைத் தவிர்க்கும் அளவிற்கு மட்டும் வாக்கிய அமைப்பு வெளிப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. ‘வாக்குத்தத்தம்’ என்பதற்குப் பதில் தற்போதைய பொதுப்பயன்பாட்டிலுள்ள ‘வாக்குறுதி’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் நீண்ட ஒருங்கிணைந்த வாக்கியத் தொடர்பைப் பாதுகாத்தபடியே, தமிழில் இறுதி வரையறை எந்தக் குழுவைச் சார்கிறது என்பது தெளிவாக இருக்க நீண்ட கோடும் மீளுரையும் பயன்படுத்தப்பட்டுள்ளன.
