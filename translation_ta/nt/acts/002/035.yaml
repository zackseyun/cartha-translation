translation:
  language: ta
  text: நான் உம்முடைய பகைவர்களை உமது கால்களுக்குக் கால்மணையாக்கும் வரையில்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்லாக: “நான் உம்முடைய பகைவர்களை உமது கால்களின் கால்மணையாக வைக்கும் வரையில்.”'
    reason: lexical_alternative
  - marker: b
    text: இந்த வரி சங்கீதம் 110:1-ஐ எதிரொலிக்கிறது; அது அரசர்/மேசியாவின் அரியணை ஏற்றத்தைப் பற்றிய பகுதி.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: வரையில்
  rationale: முன்னுள்ள நிலை தொடரும் எதிர்கால எல்லையை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: θῶ
  choice: ஆக்கும்
  rationale: τίθημι என்பதற்கு அடிப்படையில் ‘வைப்பேன்’ என்ற பொருள் இருந்தாலும், இங்குள்ள இரண்டாம் வேற்றுமை பயனிலை அமைப்பில் ‘பகைவர்களைக் கால்மணையாக்கும்’ என்பது தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: τοὺς ἐχθρούς σου
  choice: உம்முடைய பகைவர்களை
  rationale: தனிப்பட்ட பகைமையையும் அரசருக்கு எதிரான எதிர்ப்பையும் உள்ளபடியே காக்கிறது; மேற்கோளின் மரியாதை ஒருமையை ‘உம்முடைய’ வெளிப்படுத்துகிறது.
- source_word: ὑποπόδιον
  choice: கால்மணை
  rationale: கால்களை வைக்கும் மணை என்ற தெளிவான தமிழ்ச் சொல்லால் அடக்கப்படுதலின் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: τῶν ποδῶν σου
  choice: உமது கால்களுக்கு
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘உமது கால்களின்’ என்றாலும், உடைமை வேற்றுமையை நோக்கப் பொருளில் வழங்குவது இயல்பான தமிழாக இருந்து அதே உருவகத்தைக் காக்கிறது.
theological_decisions:
- issue: சங்கீதம் 110:1 மேற்கோளிலுள்ள அரசரின் எதிரிகள் அடக்கப்படும் உருவகம்
  choice: ‘உமது கால்களுக்குக் கால்மணையாக்கும்’ என்ற தெளிவான உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘உமது பகைவர்களை முற்றிலும் உமக்குக் கீழ்ப்படுத்தும் வரை’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இது அரசாட்சி/மேசியா அரியணையேற்றப் பின்னணி கொண்ட சங்கீத மேற்கோள். முழுத் தோல்வி அல்லது கீழ்ப்படிதல் என்று உருவகத்தை விளக்கிவிடாமல் வைத்திருப்பது மூலத்தின் இலக்கியத் தொடர்பையும் இறையியல் நிறைவையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளில் உரையாடப்படுபவரைக் குறிக்க ‘உமது/உம்முடைய’ என்ற மரியாதை ஒருமை வைக்கப்பட்டுள்ளது. ‘கால்மணை’ மூல உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
