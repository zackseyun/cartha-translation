id: ACT.2.34
reference: Acts 2:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: ta
  text: 'ஏனெனில், தாவீது வானங்களுக்கு ஏறிச் செல்லவில்லை; ஆனால் அவரே கூறுகிறார்: “ஆண்டவர் என் ஆண்டவரிடம், ‘என் வலப்பக்கத்தில் அமர்ந்திரும்’ என்று சொன்னார்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சங்கீதம் 110:1. எபிரெய உரையில் முதல் ‘ஆண்டவர்’ என்பது YHWH என்ற இறைப்பெயரைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: ஏறிச் செல்லவில்லை
  rationale: ἀναβαίνω என்பதன் இறந்தகால வடிவம் இச்சூழலில் வானங்களுக்கு ஏறிச் செல்வதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: τοὺς οὐρανούς
  choice: வானங்களுக்கு
  rationale: கிரேக்க மூலத்திலுள்ள பன்மை வடிவத்தைத் தக்கவைத்து, வேதாகம மொழிநடையையும் பாதுகாக்கிறது.
- source_word: λέγει δὲ αὐτός
  choice: ஆனால் அவரே இவ்வாறு கூறுகிறார்
  rationale: δέ குறிக்கும் மென்மையான முரண்பாட்டை ‘ஆனால்’ என்பதும், αὐτός தரும் வலியுறுத்தலை ‘அவரே’ என்பதும் வெளிப்படுத்துகின்றன; நிகழ்கால λέγει ‘கூறுகிறார்’ என்று தரப்பட்டுள்ளது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: கிரேக்க κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழாக்கம்; எபிரெயப் பின்னணியிலுள்ள இறைப்பெயர் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: τῷ κυρίῳ μου
  choice: என் ஆண்டவரிடம்
  rationale: இரண்டாவது κύριος-ஐயும் கிரேக்க வடிவத்துக்கு இணங்க ‘ஆண்டவர்’ என வழங்கி, ‘என்’ என்ற உறவையும் வேற்றுமையையும் தெளிவாகக் காட்டுகிறது.
- source_word: Κάθου
  choice: அமர்ந்திரும்
  rationale: அரியணை ஏற்றும் கட்டளையின் தொடர்நிலை உணர்வையும் கண்ணியமான நேரடித் தொனியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ δεξιῶν μου
  choice: என் வலப்பக்கத்தில்
  rationale: உயர்ந்த மரியாதையும் அதிகாரமும் உடைய இடத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: சங்கீதம் 110:1 மேற்கோளில் வரும் κύριος என்ற இரு சொற்களின் தமிழாக்கம்
  choice: 'முதன்மை உரையில் இரண்டையும் ‘ஆண்டவர்’ என்று வழங்குதல்: ‘ஆண்டவர் என் ஆண்டவரிடம்’.'
  alternative: முதல் சொல்லை எபிரெய மூலத்திலுள்ள YHWH இறைப்பெயரைச் சுட்டும் வகையில் வேறுபடுத்திக் காட்டுதல்.
  rationale: இங்கு கொடுக்கப்பட்ட கிரேக்க மூலத்தில் இரு இடங்களிலும் κύριος என்பதே உள்ளது. ஆகவே முதன்மை உரை அந்த வடிவத்தைப் பின்பற்றுகிறது; முதல் சொல்லுக்குப் பின்னால் உள்ள எபிரெய இறைப்பெயர் பற்றிய தகவல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம மொழிநடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் கவித்துவத் தன்மையும் இரு ‘ஆண்டவர்’ சொற்களுக்கிடையிலான நோக்கமுள்ள வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
