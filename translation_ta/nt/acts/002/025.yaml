source:
  edition: SBLGNT
  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: ta
  text: 'தாவீது அவரைக் குறித்து இவ்வாறு சொல்கிறார்: “ஆண்டவரை என் கண்முன் எப்போதும் கண்டுகொண்டிருந்தேன்[a]. அவர் என் வலப்பக்கத்தில் இருக்கிறார்; நான் அசைக்கப்படாதபடி.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆண்டவரை என் கண்முன் எப்போதும் முன்னறிந்து கண்டேன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் சில சூழல்களில் ‘முன்னறிந்து காணுதல்’ என்ற பொருளைக் கொள்ளலாம்; ஆனால் இங்குள்ள சுற்றியுள்ள சொற்றொடர்கள் ஆண்டவரைத் தொடர்ந்து தன் கண்முன் வைத்திருப்பதையே ஆதரிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: பேதுரு சங்கீதம் 16:8-ஐ மேற்கோள் காட்டுகிறார். அதன் எபிரெய மூலத்தில் இங்கு கடவுளின் தனிப்பெயர் இடம்பெறுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: அவரைக் குறித்து இவ்வாறு சொல்கிறார்
  rationale: εἰς αὐτόν என்பது இங்கு நேரடியாக அவரிடம் பேசுவதைக் குறிக்காமல், அவரைக் குறித்துச் சொல்வதைக் குறிக்கும் மேற்கோள் அறிமுக மரபுத்தொடர்.
- source_word: Προορώμην
  choice: கண்டுகொண்டிருந்தேன்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த அல்லது வழக்கமான செயலைக் காட்டுகிறது. διὰ παντός என்பதுடன் இணைந்து, முன்னறிதலைவிட ஆண்டவரைத் தொடர்ந்து கண்முன் காணுதல் அல்லது வைத்திருத்தல் என்ற பொருள் சூழலுக்குப் பொருந்துகிறது.
- source_word: τὸν κύριον
  choice: ஆண்டவரை
  rationale: κύριος என்பதற்கான இயல்பான, மரியாதையான தமிழ் இணை. மேற்கோளில் உள்ள இறையியல் அடையாளத்தை மொழிபெயர்ப்பில் மேலதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: ἐνώπιόν μου
  choice: என் கண்முன்
  rationale: ‘எனக்கு முன்பாக’ என்ற இடவியல் உருவகத்தை இயல்பான தமிழில் உயிரோட்டத்துடன் காக்கிறது.
- source_word: διὰ παντός
  choice: எப்போதும்
  rationale: தொடர்ச்சியாக அல்லது எல்லா நேரத்திலும் என்ற பொருளைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: ἐκ δεξιῶν μού
  choice: என் வலப்பக்கத்தில்
  rationale: ஒருவரின் வலது புறத்தில் இருப்பதையும், சூழலில் ஆதரவு மற்றும் பாதுகாப்பு என்ற உட்பொருளையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἵνα μὴ σαλευθῶ
  choice: ஆகவே நான் அசைக்கப்பட மாட்டேன்
  rationale: ἵνα அமைப்பு இங்கு விளைவு அல்லது நோக்க நிழலைக் கொண்டுள்ளது. தமிழில் இயல்பாகவும் உறுதியின் உருவகத்தைப் பாதுகாக்கும் வகையிலும் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: சங்கீத மேற்கோளில் ‘ஆண்டவர்’ என்பவர் யாரைக் குறிக்கிறார்
  choice: ‘ஆண்டவர்’ என்றே வைத்தல்
  alternative: ‘யெகோவா’ அல்லது ‘மேசியா’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: அப்போஸ்தலர் பணிகளில் பேதுரு இச்சங்கீதத்தை கிறிஸ்துவை நோக்கிப் பயன்படுத்தினாலும், மேற்கோளின் கிரேக்க உரை κύριον என்றே கூறுகிறது. ஆகவே இறையியல் தொடர்பை மொழிபெயர்ப்பே தீர்த்துவிடாமல், மூல உரையின் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: ἵνα μὴ σαλευθῶ என்பதிலுள்ள நோக்கம்/விளைவு
  choice: ‘ஆகவே நான் அசைக்கப்பட மாட்டேன்’
  alternative: ‘நான் அசைக்கப்படாதபடி’
  rationale: இரு நிழல்களும் கிரேக்க அமைப்பில் சாத்தியம். இச்சூழலில் ஆண்டவர் வலப்பக்கத்தில் இருப்பதன் விளைவாக நிலைத்திருப்பது இயல்பாகத் தெரிகிறது; இருப்பினும் நோக்கப் பொருளை அடிக்குறிப்பின்றி முற்றாக வலியுறுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘என் கண்முன்’, ‘வலப்பக்கத்தில்’ ஆகியவை மூல உருவகங்களைத் தக்கவைக்கின்றன. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
