  - severity: low
    issue: The lexical-alternative footnote’s alternative ‘முன்னதாகவே கண்டேன்’ is not the clearest Tamil expression of the possible prospective sense.
    rationale: ‘முன்னறிந்து கண்டேன்’ more directly represents ‘I foresaw,’ while the note can still explain why the contextual sense is continual seeing/keeping before oneself.
