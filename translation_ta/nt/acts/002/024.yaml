  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: ta
  text: அவரைக் கடவுள் மரணத்தின் வேதனைகளை[a] அவிழ்த்து எழுப்பினார்; ஏனெனில் அவரை அது[b] பிடித்து வைத்திருக்க முடியாதிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வேதனைகள்” என்பதற்கான கிரேக்கச் சொல் “பிரசவ வேதனைகள்” என்றும் பொருள்படலாம்; மரணத்தின் பிடி அவிழ்க்கப்படுவதைச் சித்தரிக்கும் உருவகத்தை இது தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல், “அதனால்.” இந்தப் பதிலிடுபெயர் மிகவும் இயல்பாக மரணத்தைக் குறிக்கிறது: “மரணத்தால் பிடித்து வைக்கப்பட்டிருப்பது.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: அவரைக்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இயேசுவைச் சுட்டும் தொடர்புப்பெயரைத் தமிழில் இயல்பான தொடர்ச்சியுடன் வழங்குகிறது.
- source_word: ἀνέστησεν
  choice: எழுப்பினார்
  rationale: இங்கு கடவுள் இயேசுவை இறந்தோரிலிருந்து எழுப்பிய செயலைக் குறிக்கிறது; மூலத்தில் இல்லாத பிற்காலத் தொழில்நுட்பச் சொல்லைச் சேர்க்காமல் வினைச்சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: λύσας
  choice: அவிழ்த்து
  rationale: λύω என்பதிலுள்ள கட்டை அவிழ்த்தல் அல்லது விடுவித்தல் என்ற தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: மரணத்தின் வேதனைகளை
  rationale: ὠδίν என்பது கடும் வேதனைகளையும் குறிப்பாகப் பிரசவ வேதனைகளையும் குறிக்கலாம். முதன்மை உரையில் இயல்பான பொருள் தரப்பட்டு, அதன் விரிவான சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: καθότι
  choice: ஏனெனில்
  rationale: அடுத்து வரும் கூற்று கடவுளுடைய செயலுக்கான காரணத்தைத் தருவதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: οὐκ ἦν δυνατὸν
  choice: இயலாதிருந்தது
  rationale: மூலத்தின் ஆளில்லா சாத்தியக் கூற்றைச் சுருக்கமாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: κρατεῖσθαι
  choice: பிடித்து வைக்கப்பட்டிருப்பது
  rationale: κρατέω என்பதிலுள்ள ஒருவரைத் தன் பிடியில் தொடர்ந்து வைத்திருக்கும் பொருளைப் பாதுகாக்கிறது.
- source_word: ὑπ’ αὐτοῦ
  choice: அதனால்
  rationale: மூலத்தின் பதிலிடுபெயர் வடிவத்தைப் பாதுகாக்கிறது; அது இயல்பாக மரணத்தைக் குறிப்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ὑπ’ αὐτοῦ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் “அதனால்” என்று பதிலிடுபெயரைப் பாதுகாத்து, அது மரணத்தைக் குறிப்பதாக அடிக்குறிப்பில் விளக்குதல்
  alternative: “மரணத்தால்” என்று நேரடியாக மொழிபெயர்த்தல்; அல்லது “அவரால்” என்று தனிப்பட்ட ஆண்பால் குறிப்பாக வாசித்தல்
  rationale: அருகிலுள்ளதும் கருத்தோட்டத்திற்கு மிகவும் பொருத்தமானதுமான முன்னிலைச் சொல் θάνατος, ‘மரணம்’ ஆகும். எனினும் மூலத்தின் பதிலிடுபெயர் அமைப்பை முதன்மை உரையில் வைத்திருப்பது அதன் வடிவத்தை மிகையாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.
- issue: ὠδῖνας என்பதன் பொருள்
  choice: முதன்மை உரையில் “வேதனைகள்”
  alternative: “பிரசவ வேதனைகள்” அல்லது “கடும் வலிகள்”
  rationale: இச்சொல் குறிப்பாகப் பிரசவ வேதனைகளைக் குறிக்கக்கூடியது; ஆனால் இச்சூழலில் மரணத்துடன் தொடர்புடைய வேதனைகள் என்பது வாசிப்புக்கு இயல்பானது. சொற்பொருளிலுள்ள பிரசவ உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “மரணத்தின் வேதனைகளை அவிழ்த்து” என்பது தமிழில் சற்றே செறிவான உருவகமாக இருந்தாலும், மூலத்தின் திட்டமிட்ட உருவகத் தீவிரத்தைப் பாதுகாக்கிறது.
