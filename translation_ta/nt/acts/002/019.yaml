  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: ta
  text: 'மேலே வானத்தில் வியப்பூட்டும் நிகழ்வுகளையும், கீழே பூமியில் அடையாளங்களையும் அளிப்பேன்: இரத்தம், நெருப்பு, புகைத் திரள்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்சார்ந்த மொழிபெயர்ப்பு: “புகை நீராவி.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δώσω
  choice: அளிப்பேன்
  rationale: ‘கொடுப்பேன்’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பாக ஒலிக்கும் அதேவேளையில், கிரேக்க வினைச்சொல்லின் ‘கொடுப்பேன்/அளிப்பேன்’ என்ற நேரடிப் பொருளையும் காக்கிறது; ‘காட்டுவேன்’ என்று மாற்றி அதன் செயற்பாட்டை விளக்கவில்லை.
- source_word: τέρατα
  choice: வியப்பூட்டும் நிகழ்வுகள்
  rationale: அச்சத்தையும் வியப்பையும் எழுப்பும் அசாதாரண நிகழ்வுகளை இச்சொல் குறிக்கிறது. ‘அற்புதங்கள்’ என்பது அற்புதச் செயல்கள் என்ற குறுகிய பொருளைத் தரக்கூடும்; இங்கு பட்டியலிடப்படுபவை பேரண்ட அறிகுறிகளாக இருப்பதால் இந்தச் சொற்றொடர் பொருத்தமானது.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: மேலே வானத்தில்
  rationale: ἄνω என்பதன் இடக்குறிப்பையும், கீழே உள்ள பூமியோடு அமைந்த செங்குத்தான எதிரிணையையும் தெளிவாகக் காக்கிறது. ‘வானம்’ என்பது இங்கு ஆகாயத்தையும் விண்ணுலகப் பரப்பையும் திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: வெறும் விசித்திர நிகழ்வுகள் அல்லாமல் பொருளைக் குறிப்புணர்த்தும் அறிகுறிகள் என்ற σημεῖα என்பதன் வழக்கமான வேதாகமப் பொருளைத் தருகிறது.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: கீழே பூமியில்
  rationale: மேலுள்ள வானத்துக்கு எதிரிணையாக γῆ என்பதன் பேரண்ட அளவிலான ‘பூமி’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: தீர்க்கதரிசனக் காட்சியின் திடமான உருவகத்தை நேரடியாகக் காக்கும் மொழிபெயர்ப்பு.
- source_word: πῦρ
  choice: நெருப்பு
  rationale: மூலத்தின் தெளிவான, வலிமையான இயற்கைத் தோற்றத்தை நேரடியாகத் தருகிறது.
- source_word: ἀτμίδα καπνοῦ
  choice: புகைமூட்டம்
  rationale: கண்ணுக்குப் புலப்படும் அடர்ந்த புகைத்திரளை இயல்பான நவீன தமிழில் தருகிறது. ‘புகையின் நீராவி’ என்பது சொற்சார்ந்த மாற்றாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: யோவேல் மேற்கோளில் வரும் பேரண்ட இடங்களின் மொழிபெயர்ப்பு
  choice: மேலே வானத்தில் … கீழே பூமியில்
  alternative: மேலே ஆகாயத்தில் … கீழே நிலத்தில்
  rationale: இவ்வசனம் வானம்–பூமி என்ற விரிந்த பேரண்ட எதிரிணையில் இறுதிக்கால அறிகுறிகளை முன்வைக்கிறது. ‘ஆகாயம்–நிலம்’ என்று மொழிபெயர்ப்பது காட்சியை வானிலை அல்லது உள்ளூர் நிலப்பரப்பாகக் குறுக்கக்கூடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், தீர்க்கதரிசன உரைக்கேற்ற கண்ணியமும் காட்சித்தன்மையும் கொண்டதாகவும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் வானம்–பூமி எதிரிணையும், வியப்பூட்டும் நிகழ்வுகள்–அடையாளங்கள் இணையும் பாதுகாக்கப்பட்டுள்ளன.
