source:
  edition: SBLGNT
  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: ta
  text: அவர்கள் அப்போஸ்தலர்களின் போதனையிலும், கூட்டுறவிலும்[a], அப்பம் பிட்டலிலும்[b], ஜெபங்களிலும்[c] தொடர்ந்து உறுதியாய் நிலைத்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பகிர்ந்துகொள்ளுதலிலும்,’ ‘பங்கேற்பிலும்,’ அல்லது ‘ஐக்கியத்திலும்.’
    reason: lexical_alternative
  - marker: b
    text: ‘அப்பம் பிட்டல்’ என்பது பொதுவாகக் கூட்டு உணவுகளைக் குறிக்கலாம்; எனினும், இங்கே அது ஆண்டவரின் இராப்போஜனத்தையும் உள்ளடக்கும் எனப் பலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘நிர்ணயிக்கப்பட்ட ஜெபங்களிலும்’; கிரேக்கத்தின் வரையறைச் சுட்டி, அறியப்பட்ட ஜெப நேரங்களையோ ஜெப வடிவங்களையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: தொடர்ந்து உறுதியுடன் ஈடுபட்டுவந்தார்கள்
  rationale: ἦσαν என்பதுடன் நிகழ்காலப் பங்கேற்புவினை இணைந்த இந்த அமைப்பு, கடந்தகாலத்தில் தொடர்ச்சியாகவும் வழக்கமாகவும் நடைபெற்ற செயலைக் குறிக்கிறது. προσκαρτερέω என்பதிலுள்ள விடாமுயற்சியையும் உறுதியான பற்றையும் இச்சொற்றொடர் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: அப்போஸ்தலர்களின் போதனையில்
  rationale: διδαχή என்பதற்கு இச்சூழலில் இயல்பான பொருள் ‘போதனை’; ‘கோட்பாடு’ என்பது தேவையற்ற அளவு முறைப்படுத்தப்பட்ட கருத்தைத் தரலாம். உடைமை வேற்றுமை, அப்போஸ்தலர்கள் வழங்கிய போதனையைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τῇ κοινωνίᾳ
  choice: கூட்டுறவில்
  rationale: κοινωνία என்பது பகிர்வு, பங்கேற்பு, ஒன்றிணைந்த சமூக வாழ்வு ஆகியவற்றை உள்ளடக்கக்கூடிய பரந்த சொல். ‘கூட்டுறவு’ அதன் சமூகப் பரப்பைக் காக்கிறது; பொருள் பகிர்வு அல்லது சடங்குசார் திருவிருந்து என்ற ஒரே பொருளுக்குள் இதைக் குறுக்கவில்லை.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: அப்பம் பிட்குவதில்
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகளில் காணப்படும் உருவகத்தைத் தமிழிலும் நேரடியாகக் காக்கிறது. பொதுவான கூட்டு உணவா, ஆண்டவரின் இராப்போஜனத்தையும் உள்ளடக்கிய நிகழ்வா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
- source_word: ταῖς προσευχαῖς
  choice: ஜெபங்களில்
  rationale: பன்மை வடிவம் காக்கப்பட்டுள்ளது. கிரேக்க வரையறைச் சுட்டி குறிப்பிட்ட ஜெப நேரங்களையோ அங்கீகரிக்கப்பட்ட ஜெப வடிவங்களையோ சுட்டக்கூடும்; ஆனால் அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்ப்பது தெளிவின்மையைத் தீர்த்துவிடும் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: κλάσει τοῦ ἄρτου என்பது ஆண்டவரின் இராப்போஜனத்தைத் தெளிவாகக் குறிக்கிறதா?
  choice: ‘அப்பம் பிட்குவது’ என்ற பரந்த, நேரடி சொற்றொடர்
  alternative: ‘ஆண்டவரின் இராப்போஜனம்’; ‘நற்கருணை விருந்து’; ஆண்டவரின் இராப்போஜனத்தையும் உள்ளடக்கிய கூட்டு உணவுகள்
  rationale: இச்சொற்றொடர் பொதுவான உணவுப் பகிர்வைக் குறிக்கலாம்; ஆரம்பக் கிறிஸ்தவச் சூழலில் இயேசுவை நினைவுகூரும் உணவையும் உள்ளடக்கியிருக்கலாம். கிரேக்க உரை இங்கு ஒரு குறிப்பிட்ட சடங்குசார் பொருளை ஐயமின்றி கட்டாயப்படுத்தாததால், எந்தத் திருச்சபை மரபின் தனிப்பட்ட விளக்கத்தையும் முதன்மை உரையில் புகுத்தவில்லை.
- issue: κοινωνία என்பதை பொருளாதாரப் பகிர்வு அல்லது சடங்குசார் திருவிருந்தாகக் குறுக்கலாமா?
  choice: பரந்த சமூகப் பொருளுள்ள ‘கூட்டுறவு’
  alternative: உடைமைகளைப் பகிர்ந்துகொள்ளுதல்; ஐக்கியம்; திருவிருந்து ஒன்றிப்பு
  rationale: இச்சொல் பகிரப்பட்ட வாழ்வு, பங்கேற்பு, பொருளாதார மற்றும் ஆவிக்குரிய ஒன்றிணைவு ஆகியவற்றை உள்ளடக்கலாம். ஒரே அம்சத்தை மட்டும் முதன்மைப்படுத்துவது சொல்லின் நோக்கமான அகலத்தை முன்கூட்டியே குறைத்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அப்போஸ்தலர்கள்’ மற்றும் ‘ஜெபங்கள்’ போன்ற பரவலாக அறியப்பட்ட கிறிஸ்தவச் சொற்கள் வாசகர் அணுகலுக்காக வைக்கப்பட்டுள்ளன. கிரேக்கத் தொடரின் நான்கு இணையான கூறுகளும் ‘-இலும்’ அமைப்பால் காக்கப்பட்டுள்ளன.
