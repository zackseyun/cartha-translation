source:
  edition: SBLGNT
  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: ta
  text: கடவுளின் தீர்மானிக்கப்பட்ட திட்டத்தின்படியும் முன்அறிவின்படியும் ஒப்புக்கொடுக்கப்பட்ட இந்த மனிதரை, நீங்கள் சட்டமற்றவர்களின் கையால் சிலுவையில் அறைந்து கொன்றீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சட்டமற்றவர்கள்” என்பதற்கு “சட்டத்திற்கு வெளியே உள்ளவர்கள்” என்றும் பொருள் கொள்ளலாம். இச்சொல் சட்டத்தை அறியாதவர்கள் என்பதைக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: இந்த மனிதரை
  rationale: பேதுருவின் உரையில் இயேசுவைச் சுட்டும் வலுவை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: தீர்மானிக்கப்பட்ட திட்டத்தின்படி
  rationale: ὡρισμένῃ என்பதன் நிர்ணயிக்கப்பட்ட தன்மையையும் βουλή என்பதன் திட்டம்/நோக்கம் என்ற பொருளையும் தெளிவாகத் தருகிறது; இங்கு தத்தத்தை அடிப்படை அல்லது நியதியாக எடுத்துக்கொள்கிறது.
- source_word: καὶ προγνώσει
  choice: முன்அறிவின்படியும்
  rationale: πρόγνωσις என்பதன் முன்னதாக அறிதல் என்ற பொருளைக் காக்கிறது; இணைத் தத்த அமைப்பைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: ‘திட்டம்’, ‘முன்அறிவு’ இரண்டிற்கும் உரிய உடைமைத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: ἔκδοτον
  choice: ஒப்புக்கொடுக்கப்பட்ட
  rationale: ஒருவரின் அதிகாரத்திற்கோ கையிற்கோ ஒப்படைக்கப்பட்ட நிலையைச் சுட்டுகிறது; மூலத்தில் குறிப்பிடப்படாத உடனடி செய்பவரைச் சேர்க்கவில்லை.
- source_word: διὰ χειρὸς ἀνόμων
  choice: சட்டத்தை அறியாதவர்களின் கையால்
  rationale: διά + இறந்தகால உருபின் இடைமுகச் செயலாண்மையையும் χείρ என்ற ஒருமையையும் காக்கிறது. ἄνομος இங்கு யூதச் சட்டத்திற்கு உட்படாத புறவினத்தாரைக் குறிக்கக்கூடியதால், ‘சட்டமற்றவர்கள்’ என்ற தெளிவற்ற சொல்லைவிட ‘சட்டத்தை அறியாதவர்கள்’ பொருத்தமானது.
- source_word: προσπήξαντες
  choice: சிலுவையில் ஆணியடித்து
  rationale: வினைச்சொல்லின் ‘ஆணியால் பொருத்துதல்’ என்ற பொருளையும் சூழலில் உட்கிடக்கும் சிலுவைத் தண்டனையையும் தெளிவாக்குகிறது.
- source_word: ἀνείλατε
  choice: கொன்றீர்கள்
  rationale: பேதுருவின் நேரடியான குற்றச்சாட்டின் வலிமையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: கடவுளின் தீர்மானமும் மனிதப் பொறுப்பும்
  choice: இயேசு கடவுளின் தீர்மானிக்கப்பட்ட திட்டத்தின்படியும் முன்அறிவின்படியும் ஒப்புக்கொடுக்கப்பட்டார்; அதேவேளையில் ‘நீங்கள் ... கொன்றீர்கள்’ என்ற மனிதக் குற்றப்பொறுப்பும் நேரடியாக வைக்கப்படுகிறது.
  alternative: கடவுளின் தீர்மானத்தை மெலிதாக்குதல் அல்லது ரோமச் செயற்பாட்டாளர்கள்மீது மட்டும் பழியைச் சுமத்தி கேட்போரின் பொறுப்பைத் தளர்த்துதல்.
  rationale: கிரேக்க உரை தெய்வீக நோக்கத்தையும் மனிதக் குற்றப்பொறுப்பையும் இணைத்தே கூறுகிறது; எந்த ஓர் இறையியல் அமைப்பிற்காகவும் இந்தப் பதற்றம் தீர்க்கப்படவில்லை.
- issue: ἀνόμων என்பதன் குறிப்பு
  choice: சட்டத்தை அறியாதவர்கள்
  alternative: சட்டமற்றவர்கள் / பொல்லாதவர்கள்
  rationale: சூழலில் இது சிலுவைத் தண்டனையை நிறைவேற்றிய ரோமர்களை, அதாவது யூதச் சட்டத்திற்கு வெளியேயிருந்தவர்களைச் சுட்டக்கூடும். அதேசமயம் சட்டமீறல் சார்ந்த எதிர்மறை நிழற்பொருளும் முற்றிலும் நீங்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் குற்றச்சாட்டின் நேரடியான வலிமையும் காக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கிய அமைப்பு தமிழில் புரியும்படி வைக்கப்பட்டாலும், கடவுளின் திட்டம்/முன்அறிவு மற்றும் மனிதச் செயற்பாடு ஆகிய இரண்டும் ஒரே வாக்கியத்தில் பாதுகாக்கப்பட்டுள்ளன.
