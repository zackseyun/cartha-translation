  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பலத்த வேகத்துடன் வீசும் காற்று’ என்பது φερομένης πνοῆς βιαίας என்பதிலுள்ள இயக்கத்தையும் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது; [a] குறிப்பு ஒப்புமையின் எல்லையை விளக்குகிறது.
