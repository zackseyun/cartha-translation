source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: ta
  text: திடீரென்று, வானத்திலிருந்து வலிமையுடன் வீசிச் செல்லும் காற்றைப் போன்ற ஓர் ஒலி உண்டாகி,[a] அவர்கள் உட்கார்ந்திருந்த வீடு முழுவதையும் நிரப்பியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலிமையுடன் நகரும் காற்றைப் போன்ற ஓர் ஒலி.” கிரேக்க உரை, ஒலியை நகரும் வலிமையான காற்றுடன் ஒப்பிடுகிறது; உண்மையிலேயே காற்று வீசியது என்று வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: உண்டாகி
  rationale: ἦχος என்பதுடன் வரும் நிகழ்வைக் குறிக்கும் இச்சொல், தமிழில் இயல்பாகவும் கதைநடையின் தொடர்ச்சியைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἄφνω
  choice: திடீரென்று
  rationale: எதிர்பாராத உடனடி நிகழ்வைத் தெளிவாகக் குறிக்கும் நவீனத் தமிழ்ச் சொல்.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: οὐρανός என்பதன் மேலுலக அல்லது தெய்வீக மூலத்தைக் குறிக்கும் சாத்தியத்தைப் பேணுகிறது; வெறும் வளிமண்டல இருப்பிடமாகக் குறுக்கவில்லை.
- source_word: ἦχος
  choice: ஓர் ஒலி
  rationale: குறிப்பிட்ட வகையைத் தேவையின்றி சேர்க்காமல், கிரேக்கச் சொல்லின் பொதுவான செவிப்புலப் பொருளைத் தருகிறது.
- source_word: ὥσπερ
  choice: போன்ற
  rationale: இது அடையாளப்படுத்தல் அல்ல, ஒப்புமை என்பதைத் தெளிவாகப் பேணுகிறது.
- source_word: φερομένης
  choice: வேகத்துடன் வீசும்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘கொண்டு செல்லப்படுதல்/முன்னே நகர்தல்’; காற்றுடன் சேர்ந்த இச்சூழலில் அதன் இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πνοῆς
  choice: காற்றை
  rationale: மூச்சு, வீச்சு, காற்று ஆகிய பொருட்களில், βιαίας மற்றும் ஒலியொப்புமை காரணமாக ‘காற்று’ இங்கு மிகவும் பொருத்தமானது.
- source_word: βιαίας
  choice: பலத்த
  rationale: வலிமை மற்றும் தீவிரத்தைத் தருகிறது; ‘வன்முறையான காற்று’ என்ற தமிழில் இயல்பற்ற அல்லது தவறாகப் புரியக்கூடிய சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: ἐπλήρωσεν
  choice: நிரப்பியது
  rationale: இலக்கணப்படி ‘ஒலி’யையே எழுவாயாகத் தொடர்ந்து வைத்துப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: ὅλον τὸν οἶκον
  choice: வீடு முழுவதையும்
  rationale: ὅλον குறிக்கும் முழுமையை இயல்பான தமிழ்ச் சொல் வரிசையில் பேணுகிறது.
- source_word: οὗ ἦσαν καθήμενοι
  choice: அவர்கள் உட்கார்ந்திருந்த
  rationale: தொடர்ந்து நிலவிய உட்கார்ந்த நிலையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
