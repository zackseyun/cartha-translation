  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: ta
  text: அவர்கள் இதைக் கேட்டபோது, உள்ளத்தில் குத்தப்பட்டு, பேதுருவிடமும் மற்ற அப்போஸ்தலர்களிடமும், “நாங்கள் என்ன செய்ய வேண்டும், சகோதரர்களே?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: அவர்கள் இதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை பேதுருவின் முந்தைய உரையைக் கேட்டதற்குப் பின்வந்த எதிர்வினையை அறிமுகப்படுத்துகிறது. சூழலிலிருந்து ‘இதை’ என்பது இயல்பாகப் புரிகிறது. δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் உரையின் நகர்வை மட்டும் குறிப்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: உள்ளம் குத்தப்பட்டவர்களாய்
  rationale: ஆழமான மன உறுத்தலையோ வேதனையையோ குறிக்கும் கூர்மையான உருவகத்தை ‘குத்தப்பட்ட’ என்பது காக்கிறது; ‘உள்ளம்’ என்பது καρδία என்பதன் இச்சூழலுக்கேற்ற இயல்பான தமிழ் வடிவம்.
- source_word: εἶπόν τε
  choice: என்று கேட்டார்கள்
  rationale: மூலத்தில் ‘சொன்னார்கள்’ என்ற வினை இருந்தாலும், அதைத் தொடர்ந்து நேரடியான கேள்வி வருவதால் நவீன தமிழில் ‘கேட்டார்கள்’ என்பது இயல்பான உரையாடல் வடிவம்; கேள்வியின் பொருளை மாற்றுவதில்லை.
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: பேதுருவிடமும் மற்ற அப்போஸ்தலர்களிடமும்
  rationale: λοιπούς என்பது பேதுருவைத் தவிர மீதமுள்ள அப்போஸ்தலர்களைக் குறிக்கிறது. ‘மற்ற அப்போஸ்தலர்கள்’ இயல்பான தமிழில் அந்த வேறுபாட்டைக் காக்கிறது.
- source_word: Τί ποιήσωμεν
  choice: நாங்கள் என்ன செய்ய வேண்டும்?
  rationale: ஆலோசனை நாடும் aorist subjunctive, மேற்கொள்ள வேண்டிய சரியான செயலைக் கேட்கிறது. ‘செய்ய வேண்டும்’ என்பது இன்றைய தமிழில் அந்த ஆலோசனைப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: ἄνδρες ἀδελφοί
  choice: சகோதரர்களே
  rationale: இது மரியாதையுடனான மரபுவழி அழைப்பு. சொற்சொல்லாக இரு பெயர்களையும் மொழிபெயர்ப்பது தமிழில் செயற்கையாக இருப்பதால், உறவுமுறையைக் காட்டும் ἀδελφοί என்பதைக் ‘சகோதரர்களே’ என்று வழங்கி, முழு சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பாலினத்தைக் குறிக்கும் அழைப்புமுறை
  choice: சகோதரர்களே
  alternative: ஆண்களே, சகோதரர்களே; சகோதர சகோதரிகளே
  rationale: கிரேக்கச் சொற்றொடர் இலக்கணரீதியாக ஆண்பாலில் உள்ளது; எனவே முதன்மை உரையில் அதை முற்றிலும் பாலினப் பொதுமையாக்கவில்லை. அதேவேளை, இது ஒரு கூட்டத்தினருக்கான வழக்கமான பிரதிநிதித்துவ அழைப்பாகவும் செயல்படக்கூடும் என்ற உண்மையான சூழல் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உள்ளம் குத்தப்பட்டவர்களாய்’ என்ற உருவகம் மூலத்தின் தீவிரத்தைக் காக்கிறது; தேவையற்ற ‘இப்போது/அப்போது’ என்ற உரையாடல் இணைப்புச் சொல் சேர்க்கப்படவில்லை.
