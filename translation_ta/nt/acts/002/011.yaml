revisions:
- from: யூதர்களும் யூத மதத்தைத் தழுவியவர்களும், கிரேத்தர்களும் அரேபியர்களுமாகிய நாம்—கடவுளின் மகத்தான செயல்களை இவர்கள் நம்முடைய சொந்த மொழிகளில்[a] எடுத்துரைப்பதைக் கேட்கிறோமே!
  to: யூதர்களும் யூத மதத்தைத் தழுவியவர்களும், கிரேத்தர்களும் அரபியர்களுமாகிய நாமே, இவர்கள் நம்முடைய சொந்த மொழிகளில் கடவுளின் மகத்தான செயல்களைப் பேசுவதைக் கேட்கிறோம்.
  rationale: The revision preserves the Greek list and its inclusive first-person subject, renders λαλούντων with the noninterpretive ‘பேசுவதைக்,’ uses idiomatic modern Tamil ‘அரபியர்கள்,’ and removes added exclamatory emphasis. The footnote remains appropriate and its anchor is retained on ‘மொழிகளில்.’
  reviewer_model: gpt-5.6-terra
