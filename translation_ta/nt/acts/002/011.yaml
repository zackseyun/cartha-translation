id: ACT.2.11
reference: Acts 2:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: ta
  text: யூதர்களும் யூத மதத்தைத் தழுவியவர்களும், கிரேத்தர்களும் அரபியர்களுமாகிய நாமே, இவர்கள் நம்முடைய சொந்த மொழிகளில் கடவுளின் மகத்தான செயல்களைப் பேசுவதைக் கேட்கிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: யூதர்கள்
  rationale: இங்கு யூதேயாவில் வசிப்பவர்களை மட்டும் அல்லாமல், புலம்பெயர்ந்து வாழும் யூத மக்களையும் குறிக்கும் இன-மதப் பெயர்.
- source_word: τε καὶ
  choice: …உம் …உம்
  rationale: யூதர்களையும் யூத மதத்தைத் தழுவியவர்களையும் இணைக்கும் கிரேக்கச் சொல்லிணையின் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: προσήλυτοι
  choice: யூத மதத்தைத் தழுவியவர்கள்
  rationale: யூத மதத்தை ஏற்றுக்கொண்ட பிற இனத்தவரைக் குறிக்கும் பொருளை, பொதுவாசகருக்குப் புரியும் வகையில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: Κρῆτες
  choice: கிரேத்தர்கள்
  rationale: கிரேத்து தீவைச் சேர்ந்தவர்களுக்கான வழக்கமான தமிழ்ப் பெயர்.
- source_word: Ἄραβες
  choice: அரேபியர்கள்
  rationale: அரபிய மக்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: ἀκούομεν
  choice: கேட்கிறோமே
  rationale: நிகழும் தருணத்தில் நேரடியாக அனுபவிப்பதை நிகழ்காலத்தில் தெரிவிக்கிறது; வியப்பின் சூழலையும் தமிழ் வலியுறுத்தல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λαλούντων αὐτῶν
  choice: இவர்கள் … எடுத்துரைப்பதை
  rationale: அவர்கள் பேசுவதைக் கேட்பதாகிய அமைப்பைப் பாதுகாக்கிறது; அடுத்துவரும் செய்தியின் உள்ளடக்கத்துடன் இயல்பாக இணைகிறது.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: நம்முடைய சொந்த மொழிகளில்
  rationale: பெந்தெகொஸ்தே நிகழ்வில் அங்கிருந்த பல இனத்தவர் அடையாளம் கண்ட மனித மொழிகளையே சூழல் சுட்டுகிறது; ἡμετέραις என்பதன் வலியுறுத்தலை ‘சொந்த’ வெளிப்படுத்துகிறது.
- source_word: τὰ μεγαλεῖα
  choice: மகத்தான செயல்கள்
  rationale: கடவுள் செய்த பெருமையும் வல்லமையும் வாய்ந்த செயல்களைக் குறிக்கிறது; மூலத்தின் பொதுவான பரப்பை தேவையின்றிக் குறுக்கவில்லை.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: அந்த மகத்தான செயல்கள் கடவுளுக்குரியவை அல்லது அவரால் செய்யப்பட்டவை என்னும் உடைமை/தோற்றுவாய் உறவை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: பெந்தெகொஸ்தே சூழலில் γλώσσαις என்பதன் பொருள்
  choice: அடையாளம் காணக்கூடிய மனித மொழிகள்
  alternative: மனித மொழியல்லாத பரவசப் பேச்சு அல்லது ‘நாவுகள்’
  rationale: உடனடிச் சூழலில் பல நாடுகளைச் சேர்ந்தவர்கள் தங்கள் சொந்த மொழிகளில் கேட்டதாகக் கூறப்படுவதால் ‘மொழிகள்’ என்பது இக்கதையின் நேரடியான பொருளை வெளிப்படுத்துகிறது; பின்னைய இறையியல் விவாதங்களை வசனத்திற்குள் கொண்டுவரவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகருக்குப் புரியும் மதிப்புமிக்க மொழி பயன்படுத்தப்பட்டுள்ளது. முன் வசனத்திலிருந்து தொடரும் இனப்பட்டியலைத் தெளிவாக்க ‘…ஆகிய நாம்’ சேர்க்கப்பட்டுள்ளது; வியப்பை உணர்த்த ‘கேட்கிறோமே’ பயன்படுத்தப்பட்டுள்ளது.
