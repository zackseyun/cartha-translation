revisions:
- from: எருசலேமில் யூதர்கள்[a] குடியிருந்தார்கள்; அவர்கள் வானத்தின் கீழுள்ள[b] எல்லா நாடுகளிலிருந்தும் வந்த இறைபக்தியுள்ள ஆண்கள்.
  to: வானத்தின் கீழுள்ள[b] எல்லா நாடுகளையும் சேர்ந்த இறைபக்தியுள்ள யூத ஆண்கள்[a] எருசலேமில் குடியிருந்தார்கள்.
  rationale: 'The revision restores a single grammatical Tamil clause corresponding to the Greek construction: devout Jewish men from every nation under heaven were residing in Jerusalem. It preserves the source’s male reference, settled-residence sense, ethnic-religious rendering of Ἰουδαῖοι, and biblical idiom, while avoiding an unnecessary implication about a completed journey.'
