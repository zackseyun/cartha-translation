  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: ta
  text: வானத்தின் கீழுள்ள[b] எல்லா நாடுகளையும் சேர்ந்த இறைபக்தியுள்ள யூத ஆண்கள்[a] எருசலேமில் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்கள்.” இங்கு அவர்கள் வானத்தின் கீழுள்ள எல்லா நாடுகளையும் சேர்ந்தவர்கள் எனக் கூறப்படுவதால், பரந்த இன-சமயப் பொருளான “யூதர்கள்” என்பதே சூழலுக்கு மிகவும் பொருந்துகிறது.
    reason: alternative_reading
  - marker: b
    text: “வானத்தின் கீழ்” என்பது உலகெங்கும் என்ற பொருளுடைய வேதாகம மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: குடியிருந்தார்கள்
  rationale: δέ என்பது கதையை மெதுவாக முன்னெடுக்கும் இணைப்புச்சொல்; தமிழில் தேவையற்ற ‘அப்போது’ அல்லது வலுவான முரண்பாட்டுச் சொல்லைச் சேர்க்காமல் இயல்பான வாக்கிய ஓட்டத்தில் அதன் பணி வெளிப்படுகிறது.
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: எருசலேமில் ... குடியிருந்தார்கள்
  rationale: κατοικοῦντες தற்காலிகமாகத் தங்கியிருப்பதைவிட ஓர் இடத்தில் வசித்தல் அல்லது குடியிருத்தல் என்ற நீடித்த பொருளைக் கொண்டது.
- source_word: Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: ‘வானத்தின் கீழுள்ள எல்லா நாடுகளிலிருந்தும்’ வந்தவர்கள் எனச் சூழல் கூறுவதால், இங்கு வெறும் யூதேயா பகுதியைச் சேர்ந்தவர்கள் என்பதைக் காட்டிலும் பரந்த இன-சமயப் பொருள் இயல்பானது.
- source_word: ἄνδρες εὐλαβεῖς
  choice: இறைபக்தியுள்ள ஆண்கள்
  rationale: ἄνδρες ஆண்களைத் துல்லியமாகக் குறிக்கிறது; εὐλαβεῖς கடவுளிடம் பயபக்தியும் கவனமான பக்தியும் கொண்டவர்களை விவரிக்கிறது.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: எல்லா நாடுகளிலிருந்தும் வந்த
  rationale: ஒவ்வொரு நாட்டிலிருந்தும் தோன்றிய அல்லது வந்தவர்களைக் குறிக்கும் விநியோகப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: வானத்தின் கீழுள்ள
  rationale: உலகெங்கும் என்ற பொருளுடைய வேதாகம மரபுத்தொடரை அதன் உருவக வடிவத்துடன் பாதுகாக்கிறது.
theological_decisions:
- issue: Ἰουδαῖοι என்பதன் பொருள்
  choice: யூதர்கள்
  alternative: யூதேயர்கள்
  rationale: பல நாடுகளிலிருந்து வந்தவர்களைப் பற்றிய சூழல், நிலப்பகுதி சார்ந்த குறுகிய பொருளைவிட இன-சமய அடையாளத்தைக் குறிக்கும் பரந்த பொருளை ஆதரிக்கிறது.
- issue: ἄνδρες என்பதன் பாலினத் துல்லியம்
  choice: ஆண்கள்
  alternative: மக்கள்
  rationale: மூலச்சொல் பொதுவாக மனிதர்களைக் குறிக்கும் சொல் அல்ல; அது ஆண்பாலைக் குறிப்பாகக் குறிக்கிறது. ஆகவே அந்தத் துல்லியம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் ஆண்பால் குறிப்பும் ‘வானத்தின் கீழ்’ என்ற வேதாகம மரபுத்தொடரும் பாதுகாக்கப்பட்டுள்ளன; வாக்கிய ஓட்டத்திற்காக விளக்கமான ‘அவர்கள்’ சேர்க்கப்பட்டுள்ளது.
