theological_decisions:
- issue: சமூகத்தின் பகிர்ந்த வாழ்வின் தன்மை
  choice: விசுவாசிகள் எல்லாவற்றையும் பொதுவாக வைத்திருந்ததாக விவரிக்கும் வரலாற்றுக் கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: எல்லாக் கிறிஸ்தவச் சமூகங்களுக்கும் கட்டாயமான பொருளாதார முறையை விதிக்கும் கட்டளையாக வாசித்தல்.
  rationale: கிரேக்கம் அவர்கள் செய்ததை விவரிக்கிறது; வெளிப்படையான கட்டளையையோ உலகளாவிய விதியையோ வழங்கவில்லை. ஆகவே வசனத்திற்கு அப்பாற்பட்ட கோட்பாட்டு அல்லது அரசியல் முடிவு மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஒன்றுகூடியிருந்தார்கள்’ என்பது உடலளவிலான கூடுகையையும் சமூக ஒற்றுமையையும் அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது; உண்மையான இடவியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
