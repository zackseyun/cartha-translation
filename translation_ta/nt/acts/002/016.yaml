lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூட்டத்தார் கொண்ட தவறான எண்ணத்தைத் திருத்தும் எதிர்மறை இணைப்பாக இயல்பாக அமைகிறது.
- source_word: τοῦτό
  choice: இது
  rationale: அப்போது நிகழ்ந்துகொண்டிருந்த நிகழ்வைக் குறிக்கும் சுட்டுப்பெயரை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἐστιν
  choice: தான்
  rationale: கிரேக்க இணைப்புவினையின் அடையாளப்படுத்தும் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘பொருள்’ போன்ற விளக்கச் சொல்லைச் சேர்ப்பதில்லை.
- source_word: τὸ εἰρημένον
  choice: சொல்லப்பட்டது
  rationale: பெயர்ச்சொல் போன்று செயல்படும் இறந்தகாலச் செயலெச்சத்தின் செயப்பாட்டு வடிவத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: διὰ
  choice: மூலம்
  rationale: மனித இடைத்தரகருடன் வரும் διά என்பதன் வழியாக/கருவியாக என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: τοῦ προφήτου
  choice: தீர்க்கதரிசி
  rationale: யோவேலின் தீர்க்கதரிசனப் பணியை வழக்கமான நவீனத் தமிழ்ச் சொல்லால் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: Ἰωήλ
  choice: யோவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
theological_decisions:
- issue: διὰ τοῦ προφήτου Ἰωήλ என்பதில் தீர்க்கதரிசியின் இடைத்தரகுப் பங்கு
  choice: தீர்க்கதரிசி யோவேல் மூலம்
  alternative: தீர்க்கதரிசி யோவேலால்
  rationale: ‘மூலம்’ என்பது யோவேலைச் செய்தியின் இறுதி மூலமாகக் காட்டாமல், தீர்க்கதரிசனச் செய்தியின் இடைத்தரகராகக் காட்டுகிறது; அதே நேரத்தில் கிரேக்கச் சொற்றொடரில் உள்ள முகமை/கருவித்தன்மை சார்ந்த நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. ‘ஆனால்’ சூழலின் திருத்தத்தைக் காட்டுகிறது; ‘இதுதான்’ என்பது ἐστιν என்பதைக் கூடுதல் விளக்கமின்றி தமிழில் இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
