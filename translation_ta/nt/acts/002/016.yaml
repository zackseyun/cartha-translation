  text: But this is what was spoken through the prophet Joel:[a]
translation:
  language: ta
  text: ஆனால், தீர்க்கதரிசி யோவேல் மூலம் சொல்லப்பட்டது இதுதான்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீர்க்கதரிசி யோவேலால்.” கிரேக்கச் சொல் முகமையைக் குறிக்கக்கூடும்; ஆனால் “மூலம்” என்பது தீர்க்கதரிசனச் செய்தியை எடுத்துரைத்த இடைத்தரகராக யோவேலின் பங்கை இன்னும் தெளிவாகப் பாதுகாக்கிறது.
