revisions:
- from: இந்த ஒலி உண்டானபோது, மக்கள் கூட்டமாகக் கூடிவந்து குழப்பமடைந்தார்கள். ஏனெனில், அவர்கள் பேசுவதை ஒவ்வொருவரும் தத்தம் வட்டார மொழியில்[a] கேட்டுக்கொண்டிருந்தார்கள்.
  to: இந்த ஒலி எழுந்தபோது, மக்கள் திரண்டுவந்து குழப்பமடைந்தார்கள்; ஏனெனில், ஒவ்வொருவரும் அவர்கள் பேசுவதைத் தத்தம் வட்டார மொழியில்[a] கேட்டுக்கொண்டிருந்தார்கள்.
