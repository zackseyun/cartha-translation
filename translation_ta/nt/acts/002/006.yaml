source:
  edition: SBLGNT
  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: ta
  text: இந்த ஒலி எழுந்தபோது, மக்கள் திரண்டுவந்து குழப்பமடைந்தார்கள்; ஏனெனில், ஒவ்வொருவரும் அவர்கள் பேசுவதைத் தத்தம் வட்டார மொழியில்[a] கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தத்தம் மொழியில்.” கிரேக்கச் சொல் பொதுவாக ஒரு மொழியையும், குறிப்பாக ஒரு பிராந்திய அல்லது உள்ளூர் பேச்சுவகையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ... τῆς φωνῆς ταύτης
  choice: இந்த ஒலி உண்டானபோது
  rationale: மூலத்தின் genitive absolute காலச் சூழலைக் குறிக்கிறது. இங்கு φωνή என்பது குரல் என்று குறிப்பாகச் சொல்லாமல், கேட்கப்பட்ட நிகழ்வைக் குறிக்கும் ‘ஒலி’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: δέ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியை வழங்குகிறது; தமிழில் வாக்கிய ஓட்டமே அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συνῆλθε τὸ πλῆθος
  choice: மக்கள் கூட்டமாகக் கூடிவந்து
  rationale: συνέρχομαι மக்கள் ஒரே இடத்துக்கு வந்து கூடுவதைக் குறிக்கிறது; πλῆθος என்பது பெருந்திரளான மக்களைக் குறிக்கிறது. இவை இரண்டையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: συνεχύθη
  choice: குழப்பமடைந்தார்கள்
  rationale: கூட்டத்தினர் புரியாமல் திகைத்து மனக்குழப்பம் அடைந்த நிலையைச் சொல்கிறது. மனிதர்களைக் குறிக்கும் கூட்டுப் பெயருக்கேற்ப தமிழில் இயல்பான பலர்பால் வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: கூட்டம் குழப்பமடைந்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: ἤκουον
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால imperfect வடிவத்தின் தொடர்ச்சியான கேட்புச் செயலைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἷς ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: கூட்டத்திலிருந்த ஒவ்வொரு தனிநபருக்கும் ஏற்பட்ட அனுபவம் என்பதை மூலத்தின் பகிர்வுத் தன்மையுடன் காட்டுகிறது.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: தத்தம் வட்டார மொழியில்
  rationale: διάλεκτος ஒரு மொழியையோ குறிப்பிட்ட பிராந்தியப் பேச்சுவகையையோ குறிக்கலாம். ‘வட்டார மொழி’ லூக்கா பயன்படுத்திய சொல்லின் தனித்தன்மையைத் தக்கவைக்கிறது; ‘தத்தம்’ ஒவ்வொருவருக்கும் உரிய மொழி என்பதை இயல்பாகக் காட்டுகிறது.
- source_word: λαλούντων αὐτῶν
  choice: அவர்கள் பேசுவதை
  rationale: முன்னரே குறிப்பிடப்பட்டவர்களையே சுட்டுகிறது; அவர்களை ‘அப்போஸ்தலர்கள்’ என்று மூலத்தைவிடக் குறுகலாக அடையாளப்படுத்தாமல் விடுகிறது.
theological_decisions:
- issue: εἷς ἕκαστος என்பதிலுள்ள ஆண்பால் ஒருமை வடிவத்தின் தமிழ் வெளிப்பாடு
  choice: ஒவ்வொருவரும் ... தத்தம்
  alternative: ஒவ்வொரு ஆணும் ... தனது
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு கூட்டத்திலுள்ள ஒவ்வொரு நபரையும் பகிர்வாகக் குறிக்கிறது. தமிழ் ‘ஒவ்வொருவரும் ... தத்தம்’ பாலினத்தைத் தேவையின்றி வரையறுக்காமல் அந்தத் தனிநபர் வலியுறுத்தலைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ‘மக்கள் கூட்டமாகக் கூடிவந்து’ என்பது சொற்சொல் மீளுரைப்பைத் தவிர்த்து συνῆλθε மற்றும் πλῆθος ஆகிய இரண்டின் பொருளையும் தருகிறது. ‘கேட்டுக்கொண்டிருந்தார்கள்’ தொடரும் நிகழ்வை வெளிப்படுத்துகிறது.
