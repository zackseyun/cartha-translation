  source_fidelity: மூலத்தின் மறுப்பும் (οὐ), நேரடி முன்னிலைப் பன்மையும் (ὑμεῖς), சுட்டுக்குறிப்பும் (οὗτοι), போதைநிலையும், மூன்றாம் மணி நேரக் குறிப்பும் வரைவு உரையில் காக்கப்பட்டுள்ளன. ஆனால் வாக்கியத்தின் தொடக்க γάρ, முந்தைய வசனத்தில் உள்ள குற்றச்சாட்டுக்கு விளக்கம் தரும் ‘ஏனெனில்’ என்ற இணைப்பாகத் தெளிவாக இடம்பெறவில்லை.
  naturalness: ‘நீங்கள் நினைப்பதுபோல் இவர்கள் குடிபோதையில் இல்லை’ இயல்பான நவீனத் தமிழ். ‘இது பகலின் மூன்றாம் மணி நேரம்’ என்பதற்குப் பதிலாக ‘இப்போது பகலின் மூன்றாம் மணி நேரம்தான்’ என்பது இச்சூழலில் அதிக இயல்பாகவும், குற்றச்சாட்டை மறுக்கும் காரணத்தின் வலிமையையும் தெரிவிக்கிறது.
