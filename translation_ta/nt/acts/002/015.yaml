  text: οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் நினைப்பதுபோல் இவர்கள் குடிபோதையில் இல்லை; இப்போது பகலின் மூன்றாம் மணி நேரம்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, யூதர்களின் நேரக் கணக்குப்படி காலை சுமார் ஒன்பது மணி.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: இல்லை; ஏனெனில்
  rationale: οὐ குறிக்கும் மறுப்பையும், γάρ தரும் விளக்கக் காரணத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: நீங்கள் நினைப்பதுபோல்
  rationale: ὑπολαμβάνω இங்கு ‘நினைத்தல்/கருதுதல்’ என்ற பொருளில் வருகிறது; ὑμεῖς குறிக்கும் நேரடி பன்மை முன்னிலையும் காக்கப்படுகிறது.
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: குற்றஞ்சாட்டப்பட்ட குழுவைக் குறிக்கும் சுட்டுப்பெயரை, ‘ஆண்கள்’ போன்ற மூலத்தில் இல்லாத குறிப்பைச் சேர்க்காமல் வழங்குகிறது.
- source_word: μεθύουσιν
  choice: குடிபோதையில்
  rationale: இச்சூழலில் கூறப்படும் போதையடைந்த நிலையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: ஏனெனில் இது பகலின் மூன்றாம் மணி நேரம்
  rationale: பேதுரு குற்றச்சாட்டை மறுப்பதற்கான காரணத்தைப் பாதுகாப்பதுடன், யூத நேரக் கணக்கீட்டு முறையையும் முதன்மை உரையில் அப்படியே வைத்திருக்கிறது.
- source_word: ὥρα τρίτη
  choice: மூன்றாம் மணி நேரம்
  rationale: நவீன கடிகார நேரமாக முதன்மை உரையிலேயே மாற்றாமல், மூலத்தின் காலக் குறிப்பை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் காரணவாத ஓட்டமும் யூத நேரக் குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
