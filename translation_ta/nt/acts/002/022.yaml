revisions:
- from: 'இஸ்ரவேல் ஆண்களே, இந்த வார்த்தைகளைக் கேளுங்கள்: நாசரேயனாகிய இயேசு—தேவன் அவர் மூலமாக உங்கள் நடுவில் செய்த வல்ல செயல்களாலும் அற்புதங்களாலும் அடையாளங்களாலும் உங்களுக்கு முன் தேவனால் உறுதிப்படுத்தப்பட்ட ஒரு மனிதர்; இதை நீங்களே அறிந்திருக்கிறீர்கள்—'
  to: 'இஸ்ரவேல் ஆண்களே, இந்த வார்த்தைகளைக் கேளுங்கள்: நாசரேயனாகிய இயேசு[a]—தேவன் அவர் மூலமாக உங்கள் நடுவில் செய்த வல்ல செயல்கள், அற்புதங்கள், அடையாளங்கள் ஆகியவற்றால் உங்களுக்கு தேவனால் உறுதிப்படுத்தப்பட்ட ஒரு மனிதர்; நீங்களே அறிந்திருக்கிறபடியே—'
  rationale: 'திருத்தம் εἰς ὑμᾶς (‘உங்களுக்கு’) மற்றும் ἐν μέσῳ ὑμῶν (‘உங்கள் நடுவில்’) ஆகியவற்றின் வேறுபாட்டைத் தெளிவாகக் காக்கிறது. தேவன் செயல்களின் எழுவாயாகவும், இயேசு ‘அவர் மூலமாக’ என்ற வழிமுறையாகவும், இயேசு ‘ஒரு மனிதர்’ எனவும் தக்கவைக்கப்படுகிறார். δυνάμεσι-க்கான மாற்றுக் குறிப்பை உரையில் இணைக்க வேண்டுமெனில், “வல்ல செயல்கள்” என்பதற்குப் பின் [b] குறியீட்டைச் சேர்க்க வேண்டும்; மேலுள்ள முழு உரையில் அந்தக் குறியீடு தவறுதலாக விடுபட்டுள்ளது என்பதால் சரியான முழு உரை: “இஸ்ரவேல் ஆண்களே, இந்த வார்த்தைகளைக் கேளுங்கள்: நாசரேயனாகிய இயேசு[a]—தேவன் அவர் மூலமாக உங்கள் நடுவில் செய்த வல்ல செயல்கள்[b], அற்புதங்கள், அடையாளங்கள் ஆகியவற்றால் உங்களுக்கு தேவனால் உறுதிப்படுத்தப்பட்ட ஒரு மனிதர்; நீங்களே அறிந்திருக்கிறபடியே—”'
