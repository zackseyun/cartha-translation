source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: ta
  text: 'இஸ்ரவேல் ஆண்களே, இந்த வார்த்தைகளைக் கேளுங்கள்: நாசரேயனாகிய இயேசு[a]—தேவன் அவர் மூலமாக உங்கள் நடுவில் செய்த வல்ல செயல்கள், அற்புதங்கள், அடையாளங்கள் ஆகியவற்றால் உங்களுக்கு தேவனால் உறுதிப்படுத்தப்பட்ட ஒரு மனிதர்; நீங்களே அறிந்திருக்கிறபடியே—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாசரேத்தின் இயேசு” அல்லது “நசரேயனாகிய இயேசு.” கிரேக்கப் பட்டப்பெயரான Ναζωραῖος பல இயல்பான வடிவங்களில் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: இஸ்ரவேல் ஆண்களே
  rationale: ἄνδρες என்பதன் ஆண்பால் குறிப்பையும் Ἰσραηλῖται என்பதன் இன அடையாளத்தையும் நேரடியாகப் பாதுகாக்கிறது; அழைப்புமுறையும் தமிழில் தெளிவாக உள்ளது.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: இந்த வார்த்தைகளைக் கேளுங்கள்
  rationale: கவனம் செலுத்தும்படி கட்டளையிடும் ἀκούσατε என்பதையும் λόγους என்பதன் சொற்பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: நாசரேயனாகிய இயேசு
  rationale: Ναζωραῖος என்பதன் பட்டப்பெயர் அல்லது அடையாளப் பெயர் தன்மையைப் பாதுகாக்கிறது; அதை வெறுமனே புவியியல் சொற்றொடராக மாற்றவில்லை.
- source_word: ἄνδρα
  choice: ஒரு மனிதர்
  rationale: இயேசுவின் மனிதத்தன்மையை வெளிப்படையாகக் குறிப்பிடும் கிரேக்கச் சொல்லைத் தக்கவைக்கிறது; மரியாதையான தமிழ் ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ
  choice: தேவனால் உறுதிப்படுத்தப்பட்ட
  rationale: ἀποδείκνυμι இங்கு பொதுவாக நிரூபித்தல் அல்லது நம்பகத்தன்மையை வெளிப்படுத்துதல் என்ற கருத்தைக் கொண்டது. 'உறுதிப்படுத்தப்பட்ட' என்பது தேவனுடைய வெளிப்படையான சான்றுறுதியை இயல்பாகச் சொல்கிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்கு முன்
  rationale: பார்வையாளர்களுக்கு வெளிப்படுத்தப்பட்ட அல்லது அவர்கள் முன்னிலையில் உறுதிப்படுத்தப்பட்ட கருத்தைத் தெளிவாகத் தருகிறது; பின்னர் வரும் ἐν μέσῳ ὑμῶν என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: வல்ல செயல்களாலும் அற்புதங்களாலும் அடையாளங்களாலும்
  rationale: மூன்று கூறுகளையும் தனித்தனியாகப் பாதுகாக்கிறது. δυνάμεσι என்பதன் வல்லமை வெளிப்படும் செயல்கள் என்ற உணர்வை 'வல்ல செயல்கள்' நெருக்கமாகத் தருகிறது.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: தேவன் அவர் மூலமாக ... செய்த
  rationale: ὁ θεὸς என்பதைச் செய்பவராகவும் δι’ αὐτοῦ என்பதை இயேசுவின் வழியான இடைமுகச் செயலாகவும் அப்படியே வைத்திருக்கிறது.
- source_word: ἐν μέσῳ ὑμῶν
  choice: உங்கள் நடுவில்
  rationale: கிரேக்க மரபுத்தொடரின் உருவகத் தெளிவை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: இதை நீங்களே அறிந்திருக்கிறீர்கள்
  rationale: αὐτοὶ தரும் வலியுறுத்தலை 'நீங்களே' என்பதன் மூலம் காக்கிறது.
theological_decisions:
- issue: ἄνδρα என்பதன் கிறிஸ்துவியல் சொல்வடிவு
  choice: '''ஒரு மனிதர்'' என்பதை முதன்மை உரையில் தக்கவைத்தல்'
  alternative: '''ஒருவர்'' அல்லது தனிப்பட்ட மனிதக் குறிப்பை நீக்கும் சொல்வடிவு'
  rationale: கிரேக்கம் இயேசுவை வெளிப்படையாக மனிதர் என்று குறிப்பிடுகிறது. அதை மங்கச் செய்யாமல், வசனத்தின் சொந்த கிறிஸ்துவியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: அற்புதச் செயல்களின் கர்த்தൃത്വமும் வழிமுகமும்
  choice: தேவன் செய்பவர்; இயேசு மூலமாக அவை செய்யப்பட்டன
  alternative: இயேசுவை மட்டும் நேரடிச் செய்பவராகக் கூறுதல்
  rationale: ὁ θεὸς இலக்கண எழுவாய்; δι’ αὐτοῦ இயேசுவை வழிமுகமாகக் குறிக்கிறது. புதிய ஏற்பாட்டின் பரந்த கிறிஸ்துவியலை இவ்வசனத்துக்குள் விளக்கமாகச் சேர்க்காமல், இதன் சொந்த அமைப்பைப் பாதுகாக்கிறது.
- issue: ἀποδεδειγμένον என்பதன் மதிப்பீட்டு நுணுக்கம்
  choice: உறுதிப்படுத்தப்பட்ட
  alternative: அங்கீகரிக்கப்பட்ட அல்லது நிரூபிக்கப்பட்ட
  rationale: '''அங்கீகரிக்கப்பட்ட'' என்பது நிர்வாக அல்லது சமய நிறுவன நிழற்பொருளைத் தரக்கூடும்; ''நிரூபிக்கப்பட்ட'' என்பது விவாத முடிவைப் போலக் கடுமையாகலாம். ''உறுதிப்படுத்தப்பட்ட'' என்பது தேவன் அளித்த பொதுச் சான்றைச் சமநிலையுடன் தெரிவிக்கிறது.'
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. கிரேக்கத்தின் நீண்ட வாக்கிய ஓட்டத்தையும் அடுத்த வசனத்துக்கு நகரும் முடிவிலா கோட்டையும் காட்ட நீள்கோடு பயன்படுத்தப்பட்டுள்ளது. மரியாதைக்காக இயேசுவைக் குறிக்கும் இடங்களில் 'அவர்' பயன்படுத்தப்பட்டாலும், மூலத்தின் மனிதத்தன்மைக் குறிப்பான 'ஒரு மனிதர்' மங்கவில்லை.
