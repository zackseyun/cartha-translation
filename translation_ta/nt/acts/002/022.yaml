  source_fidelity: 'வரைவின் மொத்தப் பொருள் கிரேக்க மூலத்திற்கு நெருக்கமாக உள்ளது: இயேசு மனிதர் எனக் கூறப்படுதலும், தேவன் செய்பவராகவும் இயேசு வழிமுறையாகவும் காட்டப்படுதலும் சரியாக உள்ளன. ஆனால் εἰς ὑμᾶς என்பதற்கு “உங்களுக்கு முன்” என்பது ‘உங்கள் முன்னிலையில்’ என்ற பொருளுக்குச் சாய்கிறது; “உங்களுக்கு” என்பது மூலத்தின் நேரடியான திசை/பெறுநர் நுணுக்கத்தைச் சிறப்பாகக் காக்கும். καθὼς αὐτοὶ οἴδατε என்பதையும் சேர்க்கப்பட்ட “இதை” இன்றி, “நீங்களே அறிந்திருக்கிறபடியே” என இயல்பாகத் தரலாம்.'
