source:
  edition: SBLGNT
  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: ta
  text: நெருப்பைப் போன்ற பிரிக்கப்பட்ட நாவுகள் அவர்களுக்குத் தோன்றின; அது அவர்கள் ஒவ்வொருவர்மேலும் அமர்ந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நெருப்பைப் போன்ற, பகிர்ந்தளிக்கப்பட்ட நாவுகள்’ அல்லது ‘நெருப்பினாலானவை போல் தோன்றிய நாவுகள்.’ கிரேக்கச் சொற்றொடர் கண்ணுக்குத் தோன்றிய உருவத்தையும், அவை ஒவ்வொருவரிடமும் பகிர்ந்தளிக்கப்பட்டதையும் சுட்டுகிறது. இறுதி வினை கிரேக்கத்தில் ஒருமையில் உள்ளது.
    reason: சொற்பொருள் மாற்றுகளையும் பன்மை ‘நாவுகள்’ உடன் வரும் மூலத்தின் ஒருமை வினை வடிவத்தையும் பதிவு செய்தல்.
lexical_decisions:
- source_word: ὤφθησαν
  choice: தோன்றின
  rationale: செயப்பாட்டு வடிவம் இங்கு காட்சிக்குப் புலப்பட்ட நிகழ்வைக் குறிக்கிறது. இயல்பான தமிழில் ‘தோன்றின’ என்பது அவை அவர்களுக்குக் காணப்பட்டதைத் தெளிவாகச் சொல்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: இந்த வேற்றுமை வடிவம் அந்தக் காட்சி யாருக்குத் தோன்றியது என்பதைக் குறிக்கிறது.
- source_word: διαμεριζόμεναι
  choice: அவை பிரிந்துகொண்டிருந்தன
  rationale: நிகழ்கால நடுநிலை/செயப்பாட்டு வினையெச்சத்தின் தொடர்நிலையையும், நாவுகள் பலரிடையே பிரிந்து பகிரப்பட்டதையும் அளவுக்கு மீறி விளக்காமல் காக்கிறது.
- source_word: γλῶσσαι
  choice: நாவுகள்
  rationale: சொல்லின் நேரடியான உருவகத்தைத் தக்கவைத்து, அடுத்துவரும் பேச்சு மற்றும் மொழிகள் பற்றிய நிகழ்வுடனான தொடர்பையும் அழிக்காமல் விடுகிறது. ‘தீச்சுடர்கள்’ என்று மொழிபெயர்த்தால் அந்தத் தொடர்பு மறையும்.
- source_word: ὡσεὶ πυρός
  choice: நெருப்பைப் போன்ற
  rationale: ὡσεὶ ஒப்புமையைக் குறிக்கிறது; இவை உண்மையிலேயே நெருப்பு என்று கூறாமல், நெருப்பைப் போன்ற தோற்றம் கொண்டிருந்ததைச் சொல்கிறது.
- source_word: ἐκάθισεν
  choice: அது ... வந்து அமர்ந்தது
  rationale: கிரேக்கத்தில் வினை ஒருமையில் உள்ளது. பிரிந்து காணப்பட்ட வெளிப்பாட்டை ஒட்டுமொத்தமாக ஒருமையில் சுட்டும் பதற்றத்தைத் தமிழிலும் காக்க ‘அது’ பயன்படுத்தப்படுகிறது; ‘வந்து அமர்ந்தது’ என்பது காட்சிப்பொருள் ஒருவர்மேல் நிலைகொண்டதை இயல்பாகச் சொல்கிறது.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: அவர்கள் ஒவ்வொருவர்மேலும்
  rationale: அங்கிருந்த ஒவ்வொரு நபருக்கும் தனித்தனியாக ஏற்பட்ட பகிர்வின் வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: பெந்தெகொஸ்தே நாளில் தோன்றிய காட்சியின் இயல்பு
  choice: அதை உண்மையான நெருப்பு என்றோ வெறும் மொழிகள் என்றோ தீர்மானிக்காமல், ‘நெருப்பைப் போன்ற நாவுகள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘நெருப்புச் சுடர்கள்’ அல்லது ‘நெருப்பைப் போன்ற மொழிகள்’
  rationale: γλῶσσαι என்ற சொல் நாவின் காட்சி உருவகத்தையும் பேச்சு/மொழி தொடர்பையும் ஒருசேர சுமக்கிறது; ὡσεὶ இது ஒப்புமை மட்டுமே என்பதைக் காட்டுகிறது.
- issue: பன்மையான ‘நாவுகள்’ என்பதற்குப் பின் வரும் ஒருமை வினை
  choice: ‘அது ... அமர்ந்தது’ என்று கிரேக்க ஒருமையைத் தக்கவைத்தல்
  alternative: ‘அவை ... அமர்ந்தன’ என்று பொருளடிப்படையில் பன்மையாக்குதல்
  rationale: மூலத்தின் இலக்கணப் பதற்றம், பிரிந்த வெளிப்பாட்டை ஓர் ஒட்டுமொத்த நிகழ்வாகக் காணும் வாய்ப்பைத் திறந்தே வைக்கிறது; அதை அமைதியாகச் சீராக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. ‘நாவுகள்’ என்ற காட்சிமொழியும் ‘நெருப்பைப் போன்ற’ என்ற ஒப்புமையும் காக்கப்பட்டுள்ளன. மூலத்தில் பன்மை நாவுகளுக்குப் பின் வரும் ஒருமை வினை தமிழில் சற்றே அசாதாரணமாக இருந்தாலும் திட்டமிட்டே தக்கவைக்கப்பட்டுள்ளது; அரைப்புள்ளி நீண்ட வாக்கியத்தைத் தெளிவாக்குகிறது.
