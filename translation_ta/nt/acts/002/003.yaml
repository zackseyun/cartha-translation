  source_fidelity: 'முக்கிய சொற்கள் பொதுவாகச் சரியாகக் கையாளப்பட்டுள்ளன: γλῶσσαιக்கு ‘நாவுகள்’, ὡσεὶ πυρόςக்கு ஒப்புமையான ‘நெருப்பைப் போன்ற’, ὤφθησανக்கு ‘தோன்றின’, மேலும் இறுதி ஒருமை வினைக்கான ‘அது’ ஆகியவை மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கின்றன. ஆனால் ‘அவை பிரிந்துகொண்டிருந்தன’ என்பது διαμεριζόμεναιயின் பகிர்வு/பிரிப்பு கருத்தைத் துல்லியமாகச் சொல்லாமல், நாவுகள் தாமாகப் பிரிந்துகொண்டிருந்தன என்ற வேறுபட்ட தொடர்நிலைப் பொருளைத் தருகிறது.'
  naturalness: ‘நாவுகள் ... அவை ... அது’ என்ற தொடரில் முன்னிலைச் சுட்டுப்பெயர் மாற்றம் தமிழில் தடுமாற்றமாக உள்ளது. பங்கேற்புச் சொல்லை நேரடியாக ‘நாவுகள்’ என்பதற்கு முன்னால் அமைத்தால் வாக்கியம் தெளிவாகவும் நவீன நிலையான தமிழில் இயல்பாகவும் அமையும். இறுதி ‘அது’ மட்டும் திட்டமிட்டு ஒருமையாக இருக்கலாம்; அது கிரேக்க ஒருமையின் குறிப்பிடத்தக்க அம்சத்தைப் பாதுகாக்கிறது.
  terminology: ‘நாவுகள்’ காட்சியுருவகத்தையும் அடுத்தடுத்த மொழி/பேச்சுக் கருப்பொருளுடனான சொல் தொடர்பையும் காக்கிறது. ‘நெருப்பைப் போன்ற’ ὡσεὶயின் ஒப்புமையைச் சரியாகக் காட்டுகிறது. ‘பிரிக்கப்பட்ட’ என்பது இவ்வசனத்தில் அவை தனித்தனியாகப் பகிரப்பட்ட/பிரிந்த தோற்றத்தைச் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது; அது நிகழ்வின் இயல்பை இறையியல் ரீதியாக விளக்குவதில்லை.
