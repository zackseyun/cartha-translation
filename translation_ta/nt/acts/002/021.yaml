  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: ta
  text: 'அவ்வாறு நிகழும்: ஆண்டவருடைய பெயரைக் கூப்பிடுகிற ஒவ்வொருவரும் மீட்கப்படுவார்கள்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவருடைய பெயரைக் கூப்பிடுகிற எவரும்.” இந்தச் சொற்றொடர் யோவேல் 2:32-ஐ எதிரொலிக்கிறது; அங்கே “ஆண்டவர்” என்பது யாவேயைக் குறிக்கிறது. அப்போஸ்தலர் நடபடிகளில், பேதுரு இயேசுவைப் பற்றிய தனது அறிவிப்பில் இந்த மேற்கோளைப் பயன்படுத்துகிறார்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσται
  choice: அப்போது
  rationale: இங்கு ἔσται மேற்கோளின் விளைவைக் கூறும் அறிமுகச் சூத்திரமாக உள்ளது. தனியாக ‘இருக்கும்’ என்று மொழிபெயர்ப்பதைவிட, யோவேல் மேற்கோளின் முந்தைய காலக் குறிப்புடன் இயல்பாக இணையும் ‘அப்போது’ நவீனத் தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: πᾶς ὃς ἐὰν
  choice: ஒவ்வொருவரும்
  rationale: இந்த அமைப்பு விதிவிலக்கற்ற, வரையறுக்கப்படாத பொதுநிபந்தனையை வெளிப்படுத்துகிறது. ‘ஒவ்வொருவரும்’ அதன் உலகளாவிய பரப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐπικαλέσηται
  choice: சொல்லிக் கூப்பிடுகிற
  rationale: பெயருடன் வரும் ἐπικαλέω என்பது உதவிக்காகவும் வழிபாட்டுச் சார்புடனும் அழைப்பதைக் குறிக்கிறது. ‘கூப்பிடுகிற’ என்பதை மட்டும் விட ‘பெயரைச் சொல்லிக் கூப்பிடுகிற’ என்பது τὸ ὄνομα என்பதையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: τὸ ὄνομα
  choice: பெயரை
  rationale: ‘பெயரைச் சொல்லிக் கூப்பிடுதல்’ என்ற வேதாகமச் சொற்றொடரின் உடன்படிக்கை மற்றும் வழிபாட்டு நுணுக்கங்களைப் பாதுகாக்க நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κυρίου
  choice: ஆண்டவருடைய
  rationale: κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க நவீனத் தமிழ் இணை ‘ஆண்டவர்’. யோவேல் சூழலிலுள்ள இறைப் பெயரையும் அப்போஸ்தலர் நடபடிகளிலுள்ள கிறிஸ்துவை மையப்படுத்திய பயன்பாட்டையும் மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் இது பாதுகாக்கிறது.
- source_word: σωθήσεται
  choice: மீட்கப்படுவார்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. ‘மீட்கப்படுதல்’ என்பது உடனடி விடுதலை மற்றும் இரட்சிப்பு ஆகிய இரு நுணுக்கங்களையும் நவீனத் தமிழில் தாங்கக்கூடியது.
theological_decisions:
- issue: யோவேல் மேற்கோளை அப்போஸ்தலர் நடபடிகளில் பயன்படுத்தும்போது ‘ஆண்டவர்’ யாரைக் குறிக்கிறது?
  choice: மூல உரையைப் போலவே ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்த்து, பிரதான உரையில் அதன் குறிப்பைத் தீர்மானிக்காமல் விடுதல்.
  alternative: யோவேலின் மூலச் சூழலில் யாவே என்று வெளிப்படையாகக் குறிப்பிடுதல், அல்லது அப்போஸ்தலர் நடபடிகளின் கிறிஸ்துவை மையப்படுத்திய சூழலின் அடிப்படையில் இயேசு என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: கிரேக்க உரை κύριος என்றே கூறுகிறது. யோவேல் 2:32-இல் அது யாவேயைக் குறிக்கிறது; ஆனால் பேதுருவின் உரை இயேசுவைப் பற்றிய அறிவிப்புக்குள் இம்மேற்கோளை வைக்கிறது. ‘ஆண்டவர்’ என்று வைத்திருப்பது இந்த உண்மையான இறையியல் இழுவிசையைத் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஆண்டவர்’ என்ற சொல்லின் குறிப்பை பிரதான உரையில் விளக்கித் தீர்க்காமல், மூலத்தின் இறையியல் அடுக்கை அடிக்குறிப்பில் சுருக்கமாகக் காட்டுகிறது.
