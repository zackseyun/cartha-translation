source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: ta
  text: ஆனால், அவர் ஒரு யூதர்[a] என்று அவர்கள் அறிந்துகொண்டபோது, எல்லாரும் ஒரே குரலாக, “எபேசியரின் அர்த்தெமிஸ் மகத்தானவள்!” என்று ஏறக்குறைய இரண்டு மணிநேரம் முழங்கிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயாவைச் சேர்ந்தவர்.” கிரேக்கச் சொல் ஒரு யூதரையோ யூதேயாவைச் சேர்ந்த ஒருவரையோ குறிக்கலாம்; இங்கு விரிவான இன-மதப் பொருளே அதிக வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: அறிந்துகொண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் முந்திய சூழ்நிலையையும், கூட்டத்தார் அவரது அடையாளத்தை உணர்ந்ததையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் அலெக்சாந்தர் பேச முயன்றதற்கு எதிரான திருப்பத்தைச் சுட்டுகிறது.
- source_word: Ἰουδαῖός
  choice: ஒரு யூதர்
  rationale: எபேசு என்ற புலம்பெயர் சூழலில் புவியியல் சார்ந்த ‘யூதேயர்’ என்பதைக் காட்டிலும் இன-மத அடையாளமான ‘யூதர்’ பொருத்தமானது; தமிழின் மரியாதை ஒருமை இயல்புக்கு ஏற்ப ‘அவர்/யூதர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: எல்லாரிடமிருந்தும் ஒரே குரல் எழுந்தது
  rationale: கிரேக்கத்தின் ‘ஒரே குரல்’ என்ற உருவகத்தையும் கூட்டத்தின் ஒன்றுபட்ட முழக்கத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: ஏறக்குறைய இரண்டு மணிநேரம்
  rationale: ὡς அளவுக் குறிப்பில் தரும் தோராயத்தன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κραζόντων
  choice: முழங்கிக்கொண்டிருந்தார்கள்
  rationale: நீடித்துக் கொண்டிருந்த உரத்த பொதுமுழக்கத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: எபேசியர்களின் அர்த்தெமி மகத்தானவள்!
  rationale: Ἐφεσίων என்ற தொடர்பு/உடைமை வேற்றுமையை ‘எபேசியர்களின்’ என்று பாதுகாத்து, பெண் தெய்வத்தைக் குறிக்கும் பெயரெச்சத்தைத் தமிழில் இலக்கண இயல்புடன் தருகிறது.
theological_decisions:
- issue: Ἰουδαῖος என்பதன் பொருள்
  choice: யூதர்
  alternative: யூதேயர்
  rationale: இங்கு கூட்டத்தார் கண்டறிந்தது அலெக்சாந்தரின் யூதேயப் புவியியல் பிறப்பிடத்தைவிட அவரது இன-மத அடையாளமே எனச் சூழல் காட்டுகிறது. இருப்பினும் கிரேக்கச் சொல்லின் உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை. கிரேக்க வாக்கியத்தின் ‘ஒரே குரல் எழுந்தது’ என்ற உருவகம் காக்கப்பட்டுள்ளது; நீடித்த முழக்கம் தனி வாக்கியமாக அமைக்கப்பட்டு தமிழ் வாசிப்போட்டம் இயல்பாக்கப்பட்டுள்ளது.
