reference: Acts 19:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: ta
  text: இவை நிறைவடைந்த பின்பு, பவுல் மக்கெதோனியாவையும் அகாயாவையும் கடந்து எருசலேமுக்குப் போக ஆவியில்[a] தீர்மானித்தார். அவர், “நான் அங்கே இருந்த பின்பு[b], ரோமையும் பார்க்க வேண்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது ஆவியில்,” அதாவது “தமது உள்ளத்தில்.” கிரேக்கச் சொற்றொடர் பவுலின் உள்ளார்ந்த தீர்மானத்தையோ பரிசுத்த ஆவியின் வழிநடத்துதலையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நான் அங்கே சென்ற பின்பு.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐπληρώθη
  choice: நிறைவடைந்த
  rationale: முந்தைய நிகழ்வுகள் முடிவுக்கு வந்ததைக் குறிக்கிறது; தீர்க்கதரிசன நிறைவேற்றம் என்ற தேவையற்ற பொருளைச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἔθετο
  choice: தீர்மானித்து ... திட்டமிட்டார்
  rationale: தனக்குள் உறுதியாக நோக்கம் கொண்டார் என்ற இடைநிலை வினையின் கருத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ πνεύματι
  choice: ஆவியில்
  rationale: இது பவுலின் சொந்த ஆவியையோ பரிசுத்த ஆவியின் வழிநடத்துதலையோ குறிக்கக்கூடிய கிரேக்கத் தெளிவின்மையைத் தமிழ் முதன்மைப் பாடம் ஓரளவு தக்கவைக்கிறது.
- source_word: διελθὼν
  choice: கடந்து
  rationale: மக்கெதோனியாவும் அகாயாவும் வழிப் பயணத்தின் பகுதிகள் என்பதையும், எருசலேமுக்குச் செல்வதற்கு முன் அவற்றின் வழியாகச் செல்வதையும் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: πορεύεσθαι
  choice: போக
  rationale: பொதுவான இடப்பெயர்ச்சி வினைக்கான இயல்பான நவீனத் தமிழ் சொல்.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற இடப்பெயர் வடிவம்.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: நான் அங்கே சென்ற பின்பு
  rationale: அடுத்த கட்டத்திற்கு முன் அவர் அந்த இடத்தை அடைந்து அங்கே இருப்பார் என்ற காலவரிசையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகளில் காணப்படும் கட்டாயம் அல்லது நோக்கமிக்க அவசியத்தின் வலிமையைத் தக்கவைக்கிறது.
- source_word: ἰδεῖν
  choice: பார்க்க
  rationale: ‘காணுதல்’ என்ற அடிப்படைப் பொருளைத் தக்கவைக்கிறது; பயணச் சூழலில் ரோமுக்குச் செல்வதையும் இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: ἐν τῷ πνεύματι என்பதன் குறிப்பு
  choice: ஆவியில்
  alternative: தமது உள்ளத்தில் / தமது ஆவியில்
  rationale: கிரேக்கத்தில் உடைமைச் சொல் இல்லை. ஆகவே இது பவுலின் உள்ளார்ந்த தீர்மானத்தையோ பரிசுத்த ஆவியின் வழிநடத்துதலையோ குறிக்கலாம். முதன்மைப் பாடத்தில் ‘ஆவியில்’ என்று வைத்து, மாற்றுப் புரிதலை அடிக்குறிப்பில் தருவது இந்த உண்மையான இருபொருள் வாய்ப்பைத் தக்கவைக்கிறது.
- issue: δεῖ வெளிப்படுத்தும் அவசியம்
  choice: ரோமையும் பார்க்க வேண்டும்
  alternative: ரோமையும் பார்க்க வேண்டியிருக்கிறது
  rationale: தெய்வீக நோக்கம் இருக்கக்கூடிய அவசியத்தை மறுக்காமலும் அதை விளக்கமாகச் சேர்க்காமலும், கிரேக்கத்தின் வலிமையைச் சுருக்கமாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. ‘ஆவியில்’ என்ற சுருக்கமான வடிவம் மூலத்தின் தெளிவின்மையைத் தக்கவைக்கிறது; இடப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டின் வழக்கமான வடிவங்களில் தரப்பட்டுள்ளன.
