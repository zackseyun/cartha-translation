revisions:
- from: இவை நிறைவடைந்த பின்பு, பவுல் ஆவியில்[a] தீர்மானித்து, மக்கெதோனியாவையும் அகாயாவையும் கடந்து எருசலேமுக்குப் போகத் திட்டமிட்டார். அவர், “நான் அங்கே சென்ற பின்பு[b], ரோமையும் பார்க்க வேண்டும்” என்றார்.
  to: இவை நிறைவடைந்த பின்பு, பவுல் மக்கெதோனியாவையும் அகாயாவையும் கடந்து எருசலேமுக்குப் போக ஆவியில்[a] தீர்மானித்தார். அவர், “நான் அங்கே இருந்த பின்பு[b], ரோமையும் பார்க்க வேண்டும்” என்றார்.
  rationale: The revision renders ἔθετο with one direct Tamil verb, preserving Paul’s purposeful resolve without adding a second near-synonymous action. “நான் அங்கே இருந்த பின்பு” more closely reflects γενέσθαι με ἐκεῖ (‘after I have been/come to be there’); the former wording is retained as a legitimate alternative in the footnote.
