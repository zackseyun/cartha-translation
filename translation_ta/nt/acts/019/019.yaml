source:
  edition: SBLGNT
  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: ta
  text: மந்திரக் கலைகளில் ஈடுபட்டிருந்தவர்களில் பலர் தங்கள் நூல்களை ஒன்றாகக் கொண்டுவந்து, எல்லாருக்கும் முன்பாக அவற்றை எரித்துக்கொண்டிருந்தார்கள்.[a] அவற்றின் மதிப்புகளைச் சேர்த்துக் கணக்கிட்டு, மொத்தம் ஐம்பதாயிரம் வெள்ளிப் பண அலகுகள் எனக் கண்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மறைமாந்திரிக நடைமுறைகளில் ஈடுபட்டிருந்தவர்கள்.’ கிரேக்கச் சொற்றொடர் சொல்லுக்குச் சொல் ‘விசித்திரமான’ அல்லது ‘சிறப்பான’ காரியங்களைக் குறித்தாலும், இச்சூழலில் மந்திரவாத நடைமுறைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘ஐந்து மிரியாடுகள் வெள்ளி,’ அதாவது ஐம்பதாயிரம் வெள்ளிப் பண அலகுகள். அது எந்த வகை நாணயம் என்பதை மூலவாக்கியம் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: பலர்
  rationale: இங்கு இச்சொல் போதுமானவர்கள் என்பதைக் காட்டாமல், கணிசமான எண்ணிக்கையிலான மக்களைக் குறிக்கிறது; ‘பலர்’ இயல்பான நவீனத் தமிழ்.
- source_word: τὰ περίεργα πραξάντων
  choice: மாயமந்திரக் கலைகளைச் செய்துவந்தவர்கள்
  rationale: சொல்லுக்கு நேரடியாக ‘வழக்கத்திற்கு மாறானவை/சிறப்பானவை’ என்ற நிழற்பொருள் இருந்தாலும், பேயோட்டுதல், தீய ஆவிகள், மந்திர நூல்கள் ஆகிய உடனடிச் சூழலில் இது மாயமந்திர நடைமுறைகளைக் குறிக்கிறது.
- source_word: συνενέγκαντες
  choice: ஒன்றாகக் கொண்டுவந்து
  rationale: நூல்களை எரிப்பதற்காக ஒரே இடத்திற்குக் கொண்டுவந்து சேர்த்த செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὰς βίβλους
  choice: தங்கள் நூல்களை
  rationale: βίβλους என்பது எழுதப்பட்ட நூல்கள் அல்லது சுருள்களைக் குறிக்கலாம்; ‘நூல்கள்’ இயல்பாகவும் பரந்த பொருளுடனும் உள்ளது. உடைமையைக் காட்டும் ‘தங்கள்’ சூழலிலிருந்து தெளிவாகிறது.
- source_word: κατέκαιον
  choice: எரித்துக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால நிறைவுறா வினையின் தொடர்நிலைத் தோற்றத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐνώπιον πάντων
  choice: எல்லாருக்கும் முன்பாக
  rationale: அந்தச் செயல் அனைவரும் காணும்படி பொதுவில் நடைபெற்றதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: அந்த நூல்களின் மதிப்பைக் கூட்டிக் கணக்கிட்டபோது
  rationale: விலைகளை ஒன்றாகக் கூட்டி மொத்த மதிப்பைக் கணக்கிட்ட செயலைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: ஐம்பதாயிரம் வெள்ளிக்காசுகள்
  rationale: ‘ஐந்து மிரியாடுகள்’ என்பது ஐம்பதாயிரம். வெள்ளி பண அலகாக உள்ளது; குறிப்பிட்ட நாணய வகையை மூலவாக்கியம் பெயரிடாததால் அடிக்குறிப்பில் அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: எபேசு சூழலில் τὰ περίεργα என்பதன் இயல்பு
  choice: மாயமந்திரக் கலைகள்
  alternative: மறைமாந்திரிக நடைமுறைகள்; விசித்திரமான செயல்கள்
  rationale: சூழல் பேயோட்டுபவர்கள், தீய ஆவிகள், விலையுயர்ந்த மந்திர நூல்களின் அழிப்பு ஆகியவற்றைப் பற்றியது. எனவே வெறும் ‘விசித்திரமான செயல்கள்’ என்று மென்மையாக்காமல், மத-மாந்திரிக நடைமுறைகள் குறிக்கப்படுகின்றன; அதேவேளை பிற்கால சமயப் பிரிவுகளின் தொழில்நுட்பச் சொல்லாடல் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எரித்துக்கொண்டிருந்தார்கள்’ என்பது தொடர்ந்துகொண்டிருந்த செயலைக் காட்டுகிறது; ‘மாயமந்திரக் கலைகள்’ என்பது சூழலின் பொருளைத் தெளிவாக்குகிறது. பணத்தின் சரியான நாணய வகை தீர்மானிக்கப்படாமல் அடிக்குறிப்பில் மூலத்தின் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
