source:
  edition: SBLGNT
  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: ta
  text: விசுவாசித்திருந்தவர்களில் பலரும் வந்து, தங்கள் செயல்களை ஒப்புக்கொண்டு அறிவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாங்கள் செய்தவற்றை” அல்லது “தங்கள் பழக்கவழக்கங்களை.”
    reason: πρᾶξις என்பது செயல்கள், செய்தவை, நடைமுறைகள், அல்லது பழக்கவழக்கங்கள் எனப் பொருள்படலாம். இச்சூழல் முந்தைய மந்திரச் செயல்களை நினைவூட்டினாலும், சொல்லே அதற்கு மட்டும் கட்டுப்படுவதில்லை.
lexical_decisions:
- source_word: πολλοί τε
  choice: பலரும்
  rationale: πολλοί என்பதன் அளவுப் பொருளை இயல்பாகத் தருகிறது; τε-யின் தொடர்ச்சி உணர்வு தமிழ் இணைப்பும்மையால் வெளிப்படுகிறது.
- source_word: τῶν πεπιστευκότων
  choice: நம்பிக்கை கொண்டிருந்தவர்களில்
  rationale: நிறைவேற்றுக் காலப் பங்கேற்பெயர், முன்பு நம்பிக்கை கொண்டு அதன் நிலையில் தொடர்ந்தவர்களைக் குறிக்கிறது; தொழில்நுட்பக் குழுப்பெயரைத் தவிர்க்கிறது.
- source_word: ἤρχοντο
  choice: வந்து
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலைச் செயலை இயல்பான தமிழ் வாக்கிய ஓட்டத்தில் தருகிறது; பலர் தொடர்ந்து அல்லது ஒன்றன்பின் ஒன்றாக வந்த சூழலை அளவுக்கு மீறி விளக்காமல் விடுகிறது.
- source_word: ἐξομολογούμενοι
  choice: அறிக்கையிட்டு
  rationale: ஒப்புக்கொள்ளுதல் அல்லது வெளிப்படையாக அறிக்கையிடுதல் என்ற பொருளைத் தருகிறது; எதை அறிக்கையிட்டார்கள் என்பதை அடுத்த சொற்றொடர் விளக்க இடமளிக்கிறது.
- source_word: ἀναγγέλλοντες
  choice: வெளிப்படையாகத் தெரிவித்தார்கள்
  rationale: தெரியப்படுத்துதல், அறிவித்தல் என்ற பொருளைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது; மறைந்திருந்த செயல்களை வெளிக்கொணரும் நுணுக்கத்தையும் காட்டுகிறது.
- source_word: τὰς πράξεις αὐτῶν
  choice: தாங்கள் செய்தவற்றை
  rationale: πρᾶξις என்பதன் 'செயல்கள்/செய்தவை' என்ற பரந்த பொருளைப் பாதுகாக்கிறது; மந்திரச் செயல்கள் அல்லது பாவங்கள் என்று மூலத்தைவிடக் குறுக்கவில்லை.
theological_decisions:
- issue: πεπιστευκότων என்பதை நிலையான குழுப்பெயராகக் கொள்வதா, முன்பு நம்பிக்கை கொண்டிருந்தவர்களைக் குறிக்கும் வடிவமாகக் கொள்வதா
  choice: நம்பிக்கை கொண்டிருந்தவர்களில்
  alternative: விசுவாசிகளில்
  rationale: நிறைவேற்றுக் காலப் பங்கேற்பெயரின் முந்தைய நம்பிக்கையும் தொடரும் நிலையையும் காக்கிறது; தேவையில்லாமல் தொழில்நுட்பமான திருச்சபைக் குழுப்பெயரை இறக்குமதி செய்யவில்லை.
- issue: τὰς πράξεις αὐτῶν என்பது பாவங்களையா, மந்திரப் பழக்கங்களையா, பொதுவான செயல்களையா குறிப்பது
  choice: தாங்கள் செய்தவற்றை
  alternative: தங்கள் பழக்கவழக்கங்களை
  rationale: உடனடிச் சூழல் மந்திரச் செயல்களைச் சுட்டினாலும், பெயர்ச்சொல் அதைவிடப் பரந்தது. மொழிபெயர்ப்பு அந்தச் சூழலை அனுமதித்தபடியே பொருளை தேவையின்றிக் குறுக்காமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இரண்டு பங்கேற்பெயர்களும் ஒரே வருகைச் செயலோடு தொடர்புடையவையாக இயல்பாக அமைக்கப்பட்டுள்ளன; மூலத்தின் பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
