revisions:
- from: நம்பிக்கை கொண்டிருந்தவர்களில் பலரும் வந்து, தாங்கள் செய்தவற்றை[a] அறிக்கையிட்டு வெளிப்படையாகத் தெரிவித்தார்கள்.
  to: விசுவாசித்திருந்தவர்களில் பலரும் வந்து, தங்கள் செயல்களை ஒப்புக்கொண்டு அறிவித்தார்கள்.[a]
  rationale: The revision restores the confessional force of ἐξομολογούμενοι with ஒப்புக்கொண்டு and renders ἀναγγέλλοντες as அறிவித்தார்கள், avoiding redundancy while retaining public disclosure. விசுவாசித்திருந்தவர்களில் naturally reflects the perfect participle’s reference to those who had previously believed. The footnote preserves the lexical breadth of πράξεις and remains anchored to the translated term.
