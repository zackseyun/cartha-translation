source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: ta
  text: ஆனால், ஊர் ஊராகச் சுற்றித்திரிந்த யூதப் பேயோட்டிகள் சிலரும்[a], தீய ஆவிகளைக் கொண்டிருந்தவர்கள்மேல்[b] ஆண்டவராகிய இயேசுவின் பெயரைச் சொல்லிப் பயன்படுத்த முயன்றார்கள். அவர்கள், “பவுல் அறிவிக்கிற[c] இயேசுவின் பெயரால் உங்களுக்குக் கடுமையாக ஆணையிடுகிறேன்[d]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுற்றித்திரியும் யூதப் பேயோட்டிகளில் சிலரும்கூட.”
    reason: καὶ என்பதற்கு இங்கு ‘கூட/என்றுங்கூட’ என்ற வலியுறுத்தல் நுணுக்கமும் இருக்கலாம்.
  - marker: b
    text: சொல்லுக்குச் சொல், “தீய ஆவிகளைக் கொண்டிருந்தவர்கள்மேல்”; அதாவது, தீய ஆவிகளின் தாக்கத்துக்கு உட்பட்டவர்கள்மேல்.
    reason: மூலத்தின் சொல் வடிவத்தையும் அதன் சூழல்சார் பொருளையும் காட்டுகிறது; ‘ஆவி பிடித்தவர்கள்’ என்ற வலுவான விளக்கத்தை முதன்மை உரையில் தவிர்க்கிறது.
  - marker: c
    text: அல்லது, “பிரசங்கிக்கிற.”
    reason: κηρύσσει என்பது பொதுவில் அறிவித்தல் அல்லது பிரசங்கித்தல் என இருவகையிலும் மொழிபெயர்க்கப்படலாம்.
  - marker: d
    text: அல்லது, “இயேசுவை முன்னிட்டு உங்களைச் சத்தியத்துக்குக் கட்டுப்படுத்துகிறேன்”; “இயேசுவின் பெயரால் உங்களுக்குக் கண்டிப்பாகக் கட்டளையிடுகிறேன்.”
    reason: ὁρκίζω என்பது சாதாரண கட்டளையைவிட, சத்தியத்தால் கட்டுப்படுத்தும் அல்லது முறைப்படி ஆணையிடும் வலுவான சொல்லாகும்.
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: முயன்றார்கள்
  rationale: இந்த இறந்தகால வினைச்சொல் ஒரு செயலை மேற்கொள்ள அல்லது செய்யத் துணிந்து முயல்வதைக் குறிக்கிறது; அது வெற்றியடைந்ததாக முன்கூட்டியே கூறாமல் ‘முயன்றார்கள்’ எனத் தருகிறது.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: ஊர் ஊராகச் சுற்றித்திரிந்த யூதப் பேயோட்டிகள் சிலரும்
  rationale: τινες என்பது ‘சிலர்’; καὶ என்பது இங்கு ‘-உம்’; περιερχομένων என்பது இடம்விட்டு இடம் சுற்றிச் செல்வதைக் குறிக்கிறது. ‘பேயோட்டிகள்’ என்பது நவீனத் தமிழில் தெளிவாகப் புரியும் இயல்பான பெயர்.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: '...மேல் ... பெயரைச் சொல்லி அவற்றை ஓட்ட'
  rationale: இச்சூழலில் இது பெயரை வெறுமனே உச்சரிப்பதை அல்ல, பேயோட்டும் சூத்திரமாக அந்தப் பெயரைப் பயன்படுத்துவதைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் நோக்கத்தைத் தெளிவாக்க ‘பெயரைச் சொல்லி அவற்றை ஓட்ட’ என வழங்கப்பட்டுள்ளது.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: தீய ஆவிகள் இருந்தவர்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘தீய ஆவிகளை உடையவர்கள்.’ ‘பிடித்தவர்கள்’ என்பது மூலத்தைவிட சற்று வலுவான விளக்கம் என்பதால், அதன் வெளிப்பாட்டளவைப் பாதுகாக்க ‘இருந்தவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: ஆண்டவராகிய இயேசுவின் பெயர்
  rationale: κύριος என்பதன் மரியாதை மற்றும் கிறிஸ்துவியல் எடையை ‘ஆண்டவர்’ தக்கவைக்கிறது; முழுச் சொற்றொடர் தமிழில் இயல்பாக ‘ஆண்டவராகிய இயேசுவின் பெயர்’ என அமைகிறது.
- source_word: Ὁρκίζω ὑμᾶς
  choice: உங்களை ஆணையிடுகிறேன்
  rationale: ὁρκίζω என்பது ஆணையிட்டு உறுதியாகக் கட்டுப்படுத்துதல் அல்லது சத்தியப்பிரமாணத்தின் கீழ் வற்புறுத்துதல். ‘ஆணையிடுகிறேன்’ என்பது சடங்குத் தொனியைக் காக்கும் தெளிவான நவீனத் தமிழ்; பன்மை ὑμᾶς ‘உங்களை’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: τὸν Ἰησοῦν ὃν Παῦλος κηρύσσει
  choice: பவுல் அறிவிக்கிற இயேசுவின் பெயரால்
  rationale: ὁρκίζω என்பதுடன் வரும் குற்றுவேற்றுமை, யாரை முன்னிட்டு ஆணையிடப்படுகிறதோ அவரைக் குறிக்கிறது. ‘பெயரால்’ தமிழ் மொழியில் அதனை இயல்பாக வெளிப்படுத்துகிறது; κηρύσσει என்பது பொதுவில் அறிவித்தலைக் குறிப்பதால் ‘அறிவிக்கிற’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: τοῦ κυρίου Ἰησοῦ என்பதில் κύριος என்ற பட்டத்தை மொழிபெயர்த்தல்
  choice: ஆண்டவராகிய இயேசு
  alternative: எஜமானாகிய இயேசு
  rationale: ‘ஆண்டவர்’ என்பது மரியாதை மற்றும் இறையியல் பொருள் இரண்டையும் தக்கவைக்கும் வழக்கமான, துல்லியமான தமிழ்; தனிப்பட்ட சமய மரபின் கூடுதல் விளக்கம் எதையும் சேர்ப்பதில்லை.
- issue: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά என்பதில் ஆவி பிடித்திருப்பதை வெளிப்படையாக்குவதா
  choice: தீய ஆவிகள் இருந்தவர்கள்
  alternative: தீய ஆவிகள் பிடித்தவர்கள்
  rationale: கிரேக்கம் சொல்லுக்குச் சொல் ‘தீய ஆவிகளை உடையவர்கள்’ என்றே கூறுகிறது. சூழல் ஆவியின் கட்டுப்பாட்டைக் குறிப்பதாக இருந்தாலும், ‘பிடித்தவர்கள்’ என வலுப்படுத்தாமல் மூலத்தின் வெளிப்பாட்டளவு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேயோட்டிகள்’ தெளிவுக்காகத் தேர்ந்தெடுக்கப்பட்டது; ‘பெயரைச் சொல்லி அவற்றை ஓட்ட’ என்பது கிரேக்கச் சொற்றொடரின் பேயோட்டும் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது. மூலத்தில் உள்ள பன்மை ‘உங்களை’ எனத் தக்கவைக்கப்பட்டுள்ளது.
