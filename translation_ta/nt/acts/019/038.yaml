id: ACT.19.38
reference: Acts 19:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: ta
  text: ஆகவே, தெமேத்திரியுவுக்கும் அவனுடன் உள்ள கைவினைஞர்களுக்கும் யார்மீதாவது புகார் இருந்தால், நீதிமன்ற அமர்வுகள் நடைபெறுகின்றன[a]; புரோகன்சுல்களும் இருக்கிறார்கள்[b]. அவர்கள் ஒருவர்மீது ஒருவர் குற்றஞ்சாட்டட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிமன்றங்கள் அமர்வில் உள்ளன.” ἀγοραῖοι ἄγονται என்ற கிரேக்கச் சொற்றொடர் அதிகாரபூர்வமாகக் கூட்டப்பட்ட நீதித்துறை நடவடிக்கைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “புரோகன்சுல்கள் அங்கே இருக்கிறார்கள்” அல்லது “புரோகன்சுல்கள் பணியில் இருக்கிறார்கள்.” ‘புரோகன்சுல்’ என்பது ரோம மாகாண நிர்வாகப் பதவி. இங்குள்ள பன்மை, தனிப்பட்ட பல அதிகாரிகளைக் காட்டிலும் அந்தப் பதவியைப் பொதுவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: ஆகவே ... இருந்தால்
  rationale: οὖν என்பதன் முடிவுரைத் தொடர்பை ‘ஆகவே’ என்றும், εἰ என்பதன் நிபந்தனையை ‘இருந்தால்’ என்றும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது; μέν தனியாக வலிந்து மொழிபெயர்க்கப்படாமல் வாக்கிய ஓட்டத்தில் உணர்த்தப்படுகிறது.
- source_word: Δημήτριος
  choice: தெமேத்திரியு
  rationale: கிரேக்கப் பெயரின் ஒலியைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது; வேற்றுமை உருபுடன் ‘தெமேத்திரியுவுக்கும்’ என வருகிறது.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: அவனோடு இருக்கும் கைவினைஞர்கள்
  rationale: τεχνῖται என்பது திறனுடைய தொழிலாளர்கள் அல்லது கைவினைஞர்களைக் குறிக்கிறது. ‘அவனோடு இருக்கும்’ என்பது σὺν αὐτῷ கூறுவதைத் தாண்டி அவர்களுடைய உறவைச் சிறப்பித்துக் கூறாமல் காக்கிறது.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: யார்மீதாவது புகார் இருந்தால்
  rationale: இந்தச் சொற்றொடரின் சட்டமுறைப் பொருளான ஒருவருக்கு எதிரான குறை அல்லது வழக்கை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: τινα
  choice: யார்மீதாவது
  rationale: ஒரு குறிப்பிட்ட நபரை அடையாளப்படுத்தாத பொதுவான சட்ட நடைமுறையை இயல்பாக உணர்த்துகிறது.
- source_word: ἀγοραῖοι ἄγονται
  choice: நீதிமன்ற அமர்வுகள் நடைபெறுகின்றன
  rationale: அதிகாரபூர்வமாகக் கூட்டப்படும் நீதித்துறை அமர்வுகளைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் நிறுவன மற்றும் செயப்பாட்டு உணர்வைக் காக்கிறது.
- source_word: ἀνθύπατοί εἰσιν
  choice: ரோம மாகாண ஆளுநர்களும் இருக்கிறார்கள்
  rationale: ἀνθύπατοι என்ற ரோம மாகாணப் பதவியை சாதாரண வாசகருக்குப் புரியும் வகையில் தருகிறது; கிரேக்கத்தில் உள்ள பன்மையை ஒருமையாகத் திருத்தாமல் காக்கிறது.
- source_word: ἐγκαλείτωσαν
  choice: குற்றஞ்சாட்டட்டும்
  rationale: சட்டரீதியாகக் குற்றச்சாட்டைக் கொண்டுவருதல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀλλήλοις
  choice: ஒருவர்மீது ஒருவர்
  rationale: பரஸ்பரப் பெயர்ச்சொல்லையும், சட்டச் சூழலில் அது கொண்டுள்ள எதிர்நிலைத் தொடர்பையும் காக்கிறது.
