translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ரோமப் பதவியின் துல்லியத்தையும் புரிதலையும் இணைக்க ‘ரோம மாகாண ஆளுநர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்திலுள்ள பன்மையும் பரஸ்பரக் குற்றச்சாட்டு அமைப்பும் அப்படியே காக்கப்பட்டுள்ளன.
