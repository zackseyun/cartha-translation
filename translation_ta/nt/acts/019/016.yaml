revisions:
- from: தீய ஆவி குடிகொண்டிருந்த அந்த மனிதன் அவர்கள்மேல் பாய்ந்து[a], அவர்கள் இருவரையும் அடக்கி, அவர்களை மேற்கொண்டான்; அதனால் அவர்கள் நிர்வாணமாகவும் காயமடைந்தவர்களாகவும் அந்த வீட்டிலிருந்து தப்பி ஓடினார்கள்.
  to: தீய ஆவி குடிகொண்டிருந்த அந்த மனிதன் அவர்கள்மேல் பாய்ந்து[a], அவர்கள் இருவரையும் அடக்கி, அவர்களைவிட வலிமைமிக்கவனானான்; அதனால் அவர்கள் நிர்வாணமாகவும் காயமடைந்தவர்களாகவும் அந்த வீட்டிலிருந்து தப்பி ஓடினார்கள்.
