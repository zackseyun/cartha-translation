id: ACT.19.16
reference: Acts 19:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: ta
  text: தீய ஆவி குடிகொண்டிருந்த அந்த மனிதன் அவர்கள்மேல் பாய்ந்து[a], அவர்கள் இருவரையும் அடக்கி, அவர்களைவிட வலிமைமிக்கவனானான்; அதனால் அவர்கள் நிர்வாணமாகவும் காயமடைந்தவர்களாகவும் அந்த வீட்டிலிருந்து தப்பி ஓடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள்மேல் தாவி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: அவர்கள்மேல் பாய்ந்து
  rationale: திடீரெனத் தாக்கும்வகையில் மேலே பாயும் உடல் செயலை இயல்பான, வலிமையான தமிழில் தெரிவிக்கிறது.
- source_word: ὁ ἄνθρωπος
  choice: அந்த மனிதன்
  rationale: ஆண்பால் ஒருமையையும் முன் குறிப்பிடப்பட்ட நபரையும் தெளிவாகக் குறிக்கிறது.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: தீய ஆவி குடிகொண்டிருந்த
  rationale: ஆவி அந்த மனிதனுக்குள் இருந்தது என்ற மூலமொழிக் கருத்தைத் தெளிவாகத் தருகிறது; பிற்காலத் தொழில்நுட்பச் சொல்லாடலைத் திணிக்கவில்லை.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: தீய ஆவி
  rationale: இந்தச் சூழலில் πονηρόν என்பதன் தீமைமிக்க தன்மையை வழக்கமான, தெளிவான தமிழில் தருகிறது.
- source_word: κατακυριεύσας
  choice: அடக்கி
  rationale: வலுக்கட்டாயமாக ஆதிக்கம் செலுத்தி வென்ற செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀμφοτέρων
  choice: அவர்கள் இருவரையும்
  rationale: சுற்றியுள்ள சூழலில் இருவருக்கு மேற்பட்டோர் குறிப்பிடப்பட்டாலும், கிரேக்க உரையின் ‘இருவரும்’ என்ற வெளிப்படையான எண்ணிக்கையைப் பாதுகாக்கிறது.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: அவர்களை மேற்கொண்டான்
  rationale: முந்தைய ‘அடக்கி’ என்பதோடு முற்றிலும் ஒன்றாக்காமல், அவர்களைவிட வலிமைமிக்கவனாக வென்றான் என்ற தனிக் கருத்தைத் தக்கவைக்கிறது.
- source_word: γυμνούς
  choice: நிர்வாணமாக
  rationale: ஆடைகள் கிழிக்கப்பட்டன என்று ஊகிக்காமல், கிரேக்கம் கூறும் இறுதி நிலையையே நேரடியாகத் தருகிறது.
- source_word: τετραυματισμένους
  choice: காயமடைந்தவர்களாக
  rationale: காயப்படுத்தப்பட்டு அந்த நிலையில் இருந்தனர் என்ற நிறைவு வினையெச்சத்தின் விளைவைத் தெரிவிக்கிறது.
- source_word: ἐκφυγεῖν
  choice: தப்பி ஓடினார்கள்
  rationale: தப்பித்தல் மற்றும் அந்த இடத்திலிருந்து விரைந்து வெளியேறுதல் ஆகிய இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: அந்த வீட்டிலிருந்து
  rationale: குறிப்பிட்ட வீட்டைவிட்டு வெளியேறிய இயக்கத்தைத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: தீய ஆவி மனிதனில் இருந்ததை விவரிக்கும் மொழிநடை
  choice: தீய ஆவி குடிகொண்டிருந்த அந்த மனிதன்
  alternative: தீய ஆவி பிடித்திருந்த அந்த மனிதன்
  rationale: கிரேக்க உரை ஆவி மனிதனுக்குள் இருந்ததாக விவரிக்கிறது. ‘குடிகொண்டிருந்த’ என்பது அதைப் பிரதிபலிக்கிறது; ஒரு குறிப்பிட்ட கோட்பாட்டுச் சொற்றொடரைத் திணிப்பதில்லை.
- issue: பெரிய குழுவின் சூழலில் ἀμφοτέρων என்பதன் எல்லை
  choice: அவர்கள் இருவரையும்
  alternative: அவர்கள் அனைவரையும்
  rationale: முந்தைய சூழல் பல மகன்களைக் குறிப்பிட்டாலும், இவ்வசனத்தின் கிரேக்க உரை வெளிப்படையாக ‘இருவரையும்’ என்கிறது. அந்தக் கதைத் தளர்வைத் தீர்க்காமல் அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடையுடன் வடிவமைக்கப்பட்டது. வன்முறைச் செயல்களின் தொடர்ச்சி தெளிவாக வைக்கப்பட்டு, ‘இருவரையும்’ என்ற மூல உரையின் பதற்றம் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
