source:
  edition: SBLGNT
  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: ta
  text: அவர், “அப்படியானால், நீங்கள் எதில் திருமுழுக்கு பெற்றீர்கள்?” என்று சொன்னார். அவர்கள், “யோவானின் திருமுழுக்கில்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோவானின் திருமுழுக்கைப் பெற்றோம்.”
    reason: தமிழில் இயல்பான மாற்று வடிவம்; இது εἰς என்பதைக் தனியே வெளிப்படுத்தாமல் அதன் கருத்தை வினைச்சொற்றொடரில் உள்ளடக்குகிறது.
lexical_decisions:
- source_word: εἶπέν τε
  choice: அவர் … என்று கேட்டார்
  rationale: λέγω அடிப்படையில் ‘சொல்’ என்றாலும், இங்கு நேரடிக் கேள்வியை அறிமுகப்படுத்துவதால் இயல்பான தமிழில் ‘கேட்டார்’ என வழங்கப்பட்டது. τε தரும் மெலிதான தொடர்ச்சி தனியே வலியுறுத்தப்படாமல் உரையாடலின் ஓட்டத்தில் வெளிப்படுகிறது.
- source_word: Εἰς τί οὖν
  choice: அப்படியானால், … எதற்குள்
  rationale: οὖν-இன் முடிவுசார்ந்த தொடர்பை ‘அப்படியானால்’ இயல்பாகக் காட்டுகிறது. εἰς என்பதன் ‘உள்ளே/உட்பட்டு’ என்ற கருத்தையும் பதிலில் வரும் அதே முன்னிடைச்சொல்லுடனான இணைப்பையும் காக்க ‘எதற்குள்’ பயன்படுத்தப்பட்டது.
- source_word: ἐβαπτίσθητε
  choice: திருமுழுக்குப் பெற்றீர்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தை இயல்பான நவீனத் தமிழில் வழங்கும் நிலைபெற்ற சொற்றொடர் இது; சடங்கை வெறும் கழுவுதலாகக் குறுக்கவில்லை.
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: யோவானின் திருமுழுக்குக்குள்
  rationale: கேள்வியிலும் பதிலிலும் திரும்ப வரும் εἰς-ஐ ‘-க்குள்’ எனக் காத்து, கிரேக்கத்தின் சொல்லமைப்பு இணைநிலையையும் திருமுழுக்கினால் ஏற்படும் தொடர்பு அல்லது அடையாளப்படுத்தலைப் பற்றிய திறந்த கருத்தையும் பாதுகாக்கிறது.
- source_word: βάπτισμα
  choice: திருமுழுக்கு
  rationale: சூழலில் யோவானோடு தொடர்புடைய சடங்கைத் துல்லியமாகக் குறிக்கும், நவீனத் தமிழில் புரிந்துகொள்ளக்கூடிய நிலைபெற்ற சொல்.
theological_decisions:
- issue: கேள்வியிலும் பதிலிலும் வரும் εἰς என்ற முன்னிடைச்சொல்லை வெளிப்படையாகக் காப்பதா
  choice: ‘எதற்குள்’ / ‘திருமுழுக்குக்குள்’ என்று இரு இடங்களிலும் வழங்குதல்
  alternative: ‘எந்தத் திருமுழுக்கைப் பெற்றீர்கள்?’ / ‘யோவானின் திருமுழுக்கைப் பெற்றோம்’ என்று தமிழாக்குதல்
  rationale: மீண்டும் வரும் εἰς-ஐக் காப்பது பவுலின் கேள்விக்கும் அவர்களின் பதிலுக்கும் இடையிலான சொல்லமைப்பு இணைநிலையை வெளிப்படுத்துகிறது. அதேவேளை, திருமுழுக்கைப் பற்றிய குறிப்பிட்ட பிரிவுசார் விளக்கத்தை உரைக்குள் சேர்க்காமல், மூலத்தின் கருத்தியல் இறுக்கத்தைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நடை நவீனமும் கண்ணியமானதும் உரையாடலுக்கு ஏற்றதுமாக வைக்கப்பட்டது. ‘எதற்குள்’ மற்றும் ‘திருமுழுக்குக்குள்’ என்பது வழக்கமான தமிழைவிட ஓரளவு மூலவடிவத்தை நெருக்கமாகப் பின்பற்றினாலும், கிரேக்கத்தில் இருமுறை வரும் εἰς-ஐயும் அதன் இறையியல் திறந்த தன்மையையும் காக்கத் தேர்ந்தெடுக்கப்பட்டது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
