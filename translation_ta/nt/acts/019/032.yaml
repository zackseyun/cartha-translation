  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: ta
  text: அதனால், சிலர் ஒரு விஷயத்தையும் வேறு சிலர் வேறொரு விஷயத்தையும் கூச்சலிட்டுக்கொண்டிருந்தார்கள். ஏனெனில் அந்தக் கூட்டம்[a] குழப்பத்தில் இருந்தது; அவர்கள் எதற்காகக் கூடிவந்திருந்தார்கள் என்பது அவர்களில் பெரும்பாலோருக்குத் தெரியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கூடுகை” அல்லது “மக்கள் கூட்டம்.” இங்குள்ள கிரேக்கச் சொல் ἐκκλησία; இது இங்கே திருச்சபையைக் குறிக்காமல், ஒரு குடிமைச் பொதுக்கூட்டத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: அதனால், சிலர் ஒன்றையும் வேறு சிலர் வேறொன்றையும் கூச்சலிட்டுக்கொண்டிருந்தார்கள்
  rationale: ἄλλοι ... ἄλλο τι என்பதிலுள்ள பகிர்நிலை எதிர்மறையை ‘சிலர் ... வேறு சிலர் ...’ என இயல்பாக வெளிப்படுத்துகிறது. இறந்தகாலத் தொடர்நிலை ἔκραζον, தொடர்ந்து நடந்த கூச்சலைக் காட்ட ‘கூச்சலிட்டுக்கொண்டிருந்தார்கள்’ என மொழிபெயர்க்கப்பட்டது; μὲν οὖν சூழலோடு இணைக்கும் ‘அதனால்’ என வழங்கப்பட்டது.
- source_word: ἐκκλησία
  choice: கூட்டம்
  rationale: இங்கு இது கிறிஸ்தவச் சபையைக் குறிக்காமல், கூடியிருந்த பொதுமக்கள் கூட்டத்தைக் குறிக்கிறது. ‘கூட்டம்’ நவீனத் தமிழில் இயல்பாகவும் சூழலுக்குத் துல்லியமாகவும் உள்ளது.
- source_word: συγκεχυμένη
  choice: குழப்பத்தில் இருந்தது
  rationale: συγχέω என்பதன் நிறைவுநிலைப் பெயரெச்சம், ஏற்பட்டுவிட்ட குழப்பத்தின் தொடரும் நிலையைக் காட்டுகிறது; ‘குழப்பத்தில் இருந்தது’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ πλείους
  choice: அவர்களில் பெரும்பாலோர்
  rationale: கூடியிருந்தவர்களில் பெரும்பான்மையினரைச் சுட்டும் பெயர்ச்சொல் பயன்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: τίνος ἕνεκα
  choice: எதற்காக
  rationale: ‘எந்தக் காரணத்திற்காக/நோக்கத்திற்காக’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; மூலத்தின் காரணம் அல்லது நோக்கம் குறித்த இயல்பான திறந்த தன்மையையும் காக்கிறது.
- source_word: συνεληλύθεισαν
  choice: கூடிவந்திருந்தோம்
  rationale: συνέρχομαι என்பதன் முற்கடந்த நிறைவுநிலையை ‘கூடிவந்திருந்தோம்’ வெளிப்படுத்துகிறது. மறைமுக எண்ணத்தின் தமிழாக்கத்தில், கூட்டத்தினரின் பார்வைக்கேற்ப ‘தாங்கள் ... வந்திருந்தோம்’ என்ற இயல்பான நபர்மாற்றம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: ἐκκλησία என்பதன் சூழல்சார் பொருள்
  choice: கூட்டம்
  alternative: சபை
  rationale: இந்த வசனத்தில் நகரக் கலவரத்தின்போது கூடியிருந்த பொதுமக்களையே குறிக்கிறது; ‘சபை’ என்பது திருச்சபை என்ற தவறான இறையியல் பொருளைத் தூண்டக்கூடும். மூலச் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘கூச்சலிட்டுக்கொண்டிருந்தார்கள்’ தொடர்ந்த ஆரவாரத்தை உணர்த்துகிறது; ‘கூட்டம் குழப்பத்தில் இருந்தது’ என்பது மூலத்தின் விளைவுநிலையைப் பாதுகாக்கிறது.
