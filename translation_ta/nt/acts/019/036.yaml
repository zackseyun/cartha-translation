translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நகர எழுத்தரின் தர்க்கரீதியான அறிவுறுத்தல் தெளிவாகத் தொடரும்படி காரணமும் கடமையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தரப்பட்டுள்ளன.
