source:
  edition: SBLGNT
  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: ta
  text: ஆகவே, இவை மறுக்க முடியாதவை என்பதால்[a], நீங்கள் அமைதியாக இருக்கவும்[b], அவசரப்பட்டு எதையும் செய்யாமல் இருக்கவும்[c] வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இவற்றை எதிர்த்துப் பேச முடியாது’ அல்லது ‘இவை மறுப்புக்கு இடமில்லாதவை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அடக்கத்துடன் இருக்கவும்’ அல்லது ‘கலங்காமல் இருக்கவும்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘யோசிக்காமல் எதையும் செய்யாமல் இருக்கவும்’ அல்லது ‘துணிகரமாக எதையும் செய்யாமல் இருக்கவும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: மறுக்க முடியாது
  rationale: இந்தச் சொல் எதிர்த்துப் பேசவோ மறுக்கவோ இடமில்லாததைக் குறிக்கிறது. ‘மறுக்க முடியாது’ என்பது அதன் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவை அல்லது அறிவுறுத்தலைக் காட்டும் தொடர்புச் சொல்.
- source_word: ὄντων τούτων
  choice: இவற்றை ... என்பதால்
  rationale: இந்த genitive absolute அமைப்பு அறிவுறுத்தலுக்கான காரணத்தைத் தருகிறது; தமிழில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்த ‘என்பதால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: δέον ἐστίν
  choice: வேண்டும்
  rationale: இது அவசியம் அல்லது கடமையை உணர்த்துகிறது. தமிழில் இரு செயல்களையும் இயல்பாக ஆளும் விதத்தில் வாக்கியத்தின் இறுதியில் ‘வேண்டும்’ வைக்கப்பட்டுள்ளது.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: அமைதியாக இருக்கவும்
  rationale: கலக்கம் அடங்கிய, கட்டுப்பாடான நிலையில் இருப்பதைக் குறிக்கிறது. வெறும் பேசாமையைக் காட்டாமல் மனஅமைதியையும் கட்டுப்பாட்டையும் ‘அமைதியாக இருக்கவும்’ வெளிப்படுத்துகிறது.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: அவசரப்பட்டு எதையும் செய்யாமல் இருக்கவும்
  rationale: யோசிக்காமல் திடீரென அல்லது பொறுப்பின்றிச் செயல்படாதிருக்க வேண்டிய எச்சரிக்கையை இயல்பான தமிழில் தருகிறது.
