source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: ta
  text: இது இரண்டு ஆண்டுகள் நீடித்தது; இதன் விளைவாக, ஆசியாவில்[a] வாழ்ந்த அனைவரும்—யூதர்களும் கிரேக்கர்களும்—ஆண்டவருடைய வார்த்தையைக் கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆசியா’ என்பது நவீன ஆசியக் கண்டத்தை அல்ல, மேற்கு சின்ன ஆசியாவில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: இது தொடர்ந்து நடந்தது
  rationale: ἐγένετο என்பதற்கு பொதுவாக ‘நடந்தது’ என்று பொருள். ஆனால் முந்தைய வசனத்தில் கூறப்பட்ட கற்பித்தல் ஏற்பாடு இரண்டு ஆண்டுகள் நீடித்ததைச் சூழல் காட்டுவதால், ‘தொடர்ந்து நடந்தது’ என்பது காலநீட்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ ἔτη δύο
  choice: இரண்டு ஆண்டுகள்
  rationale: ἐπί உடன் வரும் கால அளவு, நிகழ்வு எவ்வளவு காலம் நீடித்தது என்பதைக் குறிக்கிறது. தமிழில் ‘இரண்டு ஆண்டுகள்’ என்பது இயல்பான காலநீட்சிக் கூறு.
- source_word: ὥστε
  choice: அதனால்
  rationale: ὥστε முந்தைய செயலின் விளைவை அறிமுகப்படுத்துகிறது. தனி வாக்கியத் தொடக்கத்தில் ‘அதனால்’ என்பது அதன் விளைவுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: ஆசியா மாகாணத்தில் வாழ்ந்த ... அனைவரும்
  rationale: κατοικοῦντας என்பது அங்கே வசித்தவர்களைக் குறிக்கிறது; πάντας அதன் முழுமையான பரப்பைத் தக்கவைக்கிறது. இங்குள்ள Ἀσία நவீன கண்டத்தை அல்ல, ரோம மாகாணத்தைச் சுட்டுவதால் ‘மாகாணத்தில்’ என உரையில் தெளிவுபடுத்தப்பட்டு, வரலாற்றுப் புவியியல் குறிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀκοῦσαι
  choice: கேட்டார்கள்
  rationale: ὥστε-க்கு பின் வரும் இறந்தகால இன்ஃபினிட்டிவ், முந்தைய செயலின் விளைவாக அவர்கள் கேட்டதைச் சொல்கிறது. ‘கேட்டார்கள்’ நேரடியான தமிழ் மொழிபெயர்ப்பு.
- source_word: τὸν λόγον
  choice: வார்த்தையை
  rationale: λόγος இங்கு அறிவிக்கப்பட்ட நற்செய்திச் செய்தியைக் குறித்தாலும், அப்போஸ்தலர் நூலில் மீண்டும் வரும் ‘வார்த்தை’ என்ற சொல்லாட்சியையும் அதன் இறையியல் நயத்தையும் பாதுகாக்க ‘வார்த்தை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவரின்
  rationale: κύριος என்பதன் வழக்கமான, மரியாதைமிக்க தமிழ் இணை ‘ஆண்டவர்’. மரபுத்தொடரும் இயல்பான தமிழும் கருதி ‘ஆண்டவரின் வார்த்தை’ என அமைக்கப்பட்டது.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: யூதர்களும் கிரேக்கர்களுமாகிய
  rationale: τε καὶ இரு குழுக்களையும் உள்ளடக்கி இணைக்கிறது. ‘யூதர்களும் கிரேக்கர்களுமாகிய அனைவரும்’ என்பது πάντας என்பதுடன் இயல்பாக இணைந்து இரு தரப்பினரையும் தெளிவாகச் சேர்க்கிறது.
theological_decisions:
- issue: ‘ஆசியா’ என்பதன் பொருள்
  choice: ரோமப் பேரரசின் ஆசியா மாகாணம்
  alternative: நவீன ஆசியக் கண்டம் அல்லது அதைவிடப் பரந்த ஆசியப் பகுதி
  rationale: அப்போஸ்தலர் நூலின் வரலாற்றுச் சூழலில் Ἀσία என்பது மேற்கு சின்ன ஆசியாவில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது. வாசகர் நவீன கண்டமாகத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க உரையிலும் அடிக்குறிப்பிலும் இது தெளிவுபடுத்தப்படுகிறது.
- issue: ‘அனைவரும் கேட்டார்கள்’ என்ற முழுமையான கூற்றின் பரப்பு
  choice: ஆசியா மாகாணத்தில் வாழ்ந்த யூதர்களும் கிரேக்கர்களுமாகிய அனைவரும்
  alternative: அந்த மாகாணத்திலிருந்த ஒவ்வொரு தனிநபரும் விதிவிலக்கின்றி தனிப்பட்ட முறையில் கேட்டார்கள் என விரிவாக்குதல்
  rationale: πάντας என்பதன் முழுமையான மொழிநடையைத் தணிக்காமல் மொழிபெயர்க்கப்படுகிறது. அதே நேரத்தில், செய்தி மாகாணம் முழுவதும் பரவியதைக் குறிக்கும் லூக்காவின் பரந்த வரலாற்றுக் கூற்றை எவ்வாறு கணக்கிடுவது என்பதை மொழிபெயர்ப்பு தனியாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் மரியாதைமிக்க வேதாகம நடையுடனும் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; காரண-விளைவு தொடர்பு ‘அதனால்’ மூலம் பாதுகாக்கப்பட்டது.
