source:
  edition: SBLGNT
  text: ἐκ δὲ τοῦ ὄχλου ⸀συνεβίβασαν Ἀλέξανδρον προβαλόντων αὐτὸν τῶν Ἰουδαίων, ὁ δὲ Ἀλέξανδρος κατασείσας τὴν χεῖρα ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: ta
  text: கூட்டத்திலிருந்து அலெக்சாந்தரை முன்னே கொண்டுவந்தார்கள்[a]; யூதர்கள் அவரை முன்னுக்குத் தள்ளியிருந்ததால். அலெக்சாந்தர் கையால் சைகை செய்து, அங்குக் கூடியிருந்த மக்களிடம்[b] தற்காப்பாகப் பேச விரும்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அலெக்சாந்தரை முன்னிறுத்தினார்கள் … யூதர்கள் அவரை முன்னிறுத்தியிருந்தார்கள்.’ அலெக்சாந்தரைப் பொதுமக்கள்முன் கொண்டுவந்து நிறுத்துவதைக் குறிக்கும் தொடர்புடைய இரண்டு வினைச்சொற்கள் கிரேக்கத்தில் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மக்களிடம்.’ இங்குள்ள சொல் குடிமக்களைக் குறிக்கும் பொது-சிவில் நுணுக்கத்தையும் கொண்டுள்ளது; வசனத்தின் தொடக்கத்தில் வரும் ‘கூட்டம்’ என்பதற்கான கிரேக்கச் சொல்லிலிருந்து இது வேறுபட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: முன்னே கொண்டுவந்தார்கள்
  rationale: ἐκ τοῦ ὄχλου மற்றும் அலெக்சாந்தரைப் பொதுமக்கள்முன் நிறுத்திய சூழல் ஆகியவற்றோடு பொருந்தும் வகையில், கூட்டத்திலிருந்து அவரை முன்புறம் கொண்டுவந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: யூதர்கள் அவரை முன்னுக்குத் தள்ளியிருந்தார்கள்
  rationale: யூதர்கள் அலெக்சாந்தரைப் பொதுவெளியில் முன்னிறுத்தியதைத் தெரிவிக்கிறது; உடல் வன்முறையைத் தேவையின்றி வலியுறுத்தாமல், நிகழ்வின் பின்னணியையும் முன்நிகழ்ந்த செயலையும் காட்டுகிறது.
- source_word: κατασείσας τὴν χεῖρα
  choice: கையசைத்துச் சைகை செய்து
  rationale: கவனத்தை ஈர்க்க அல்லது அமைதியை நாடச் செய்யப்பட்ட கைச்சைகையைத் தெளிவாகக் காட்டுகிறது; ‘அமைதியாக இருக்கும்படி’ என்று மூலத்தில் வெளிப்படையாக இல்லாத நோக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: தன் தரப்பை எடுத்துரைக்க விரும்பினார்
  rationale: ἤθελεν குறிக்கும் விருப்பம் அல்லது நோக்கத்தைப் பாதுகாக்கிறது; ἀπολογεῖσθαι என்பதன் பொதுவெளியில் தன் தரப்பை விளக்கும் நுணுக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: τῷ δήμῳ
  choice: மக்கள் அவையினரிடம்
  rationale: இங்கு கூடியிருந்த குடிமக்கள் சார்ந்த பொது அவை என்ற நுணுக்கத்தைத் தக்கவைத்து, முன்னர் வரும் பொதுவான ὄχλος என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: ὄχλου
  choice: கூட்டம்
  rationale: பொதுவான மக்கள் திரளை இயல்பான நவீன தமிழில் குறிக்கிறது; பின்னர் வரும் δῆμος என்ற மக்கள் அவையிலிருந்து வேறுபடுகிறது.
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: அலெக்சாந்தர்
  rationale: கிரேக்கப் பெயரைத் தமிழின் வழக்கமான ஒலிபெயர்ப்பு முறையில் வழங்குகிறது.
