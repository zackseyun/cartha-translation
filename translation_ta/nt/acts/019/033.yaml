  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கூட்டம்’ மற்றும் ‘மக்கள் அவை’ ஆகியவற்றின் மூலமொழி வேறுபாடு பாதுகாக்கப்பட்டுள்ளது; கைச்சைகையின் நோக்கமும் அலெக்சாந்தர் சொல்ல நினைத்த தற்காப்பின் உள்ளடக்கமும் தேவையின்றி விரிவாக்கப்படவில்லை.
