translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவரோ’ என்பது மூலத்தின் வலியுறுத்தலைச் சுருக்கமாகக் காக்கிறது; ‘பணிவிடை செய்தவர்கள்’ என்பது சேவையைத் தெரிவிக்கிறது, ஆனால் ஓர் அதிகாரப்பூர்வ சபைப் பதவியை இறக்குமதி செய்யவில்லை.
