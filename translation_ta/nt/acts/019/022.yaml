source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: ta
  text: 'பின்னர், அவருக்குப் பணிவிடை செய்து வந்தவர்களில் இருவரான தீமோத்தேயுவையும் எரஸ்துவையும் மக்கெதோனியாவுக்கு அனுப்பிவிட்டு, அவரோ ஆசியாவில்[a] சில காலம் தங்கினார்.


    [a] இங்கு “ஆசியா” என்பது இன்றைய ஆசியக் கண்டத்தைக் குறிக்காமல், ஆசியா மைனரின் மேற்குப் பகுதியில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “ஆசியா” என்பது இன்றைய ஆசியக் கண்டத்தைக் குறிக்காமல், ஆசியா மைனரின் மேற்குப் பகுதியில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது.
    reason: பண்டைய ‘ஆசியா’ என்ற இடப்பெயரை நவீன ஆசியக் கண்டத்துடன் வாசகர் குழப்பாமல் இருக்க உதவும் வரலாற்று-புவியியல் விளக்கம்.
lexical_decisions:
- source_word: ἀποστείλας
  choice: அனுப்பிவிட்டு
  rationale: இறந்தகாலப் பங்கேற்பு வினை பிரதான வினைக்கு முன் நிகழ்ந்த செயலைக் காட்டுகிறது; ‘அனுப்பிவிட்டு’ என்பது அந்த நிகழ்வரிசையை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: பின்பு
  rationale: இங்கு இது வலுவான எதிர்மறை இணைப்பல்ல; நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்தும் மென்மையான கதைத் தொடர்பு. ‘பின்பு’ நவீன தமிழில் அந்த ஓட்டத்தை இயல்பாகத் தருகிறது.
- source_word: εἰς τὴν Μακεδονίαν
  choice: மக்கெதோனியாவுக்கு
  rationale: ஒரு பிரதேசத்தை நோக்கிய இயக்கத்தைத் தமிழில் ‘-க்கு’ இயல்பாகக் குறிக்கிறது; கிரேக்க εἰς என்பதன் திசை சார்ந்த பொருள் காக்கப்படுகிறது.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: தமக்குப் பணிவிடை செய்தவர்களில் இருவரான
  rationale: διακονέω இங்கு சேவை செய்வதைக் குறிக்கிறது; ஒரு குறிப்பிட்ட திருச்சபைப் பதவியைத் தேவையின்றி உணர்த்தாமல், அவருக்குச் செய்த சேவையை ‘பணிவிடை செய்தவர்கள்’ வெளிப்படுத்துகிறது.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: தீமோத்தேயுவையும் எரஸ்துவையும்
  rationale: பெயர்கள் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளன.
- source_word: αὐτὸς
  choice: அவரோ
  rationale: வெளிப்படையாக உள்ள αὐτός, அனுப்பப்பட்ட இருவருக்கும் பவுலுக்கும் இடையிலான வலியுறுத்தப்பட்ட வேறுபாட்டைக் காட்டுகிறது; தமிழின் ‘-ஓ’ அந்த எதிர்நிலையை இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἐπέσχεν χρόνον
  choice: சிறிது காலம் தங்கினார்
  rationale: இந்தச் சொற்றொடர் ஒரு காலப்பகுதி அங்கேயே இருந்ததைக் குறிக்கிறது; ‘சிறிது காலம் தங்கினார்’ தெளிவான, இயல்பான கதைநடை வடிவம்.
- source_word: εἰς τὴν Ἀσίαν
  choice: ஆசியாவில்
  rationale: ἐπέσχεν χρόνον உடன் εἰς இடத்தைக் குறிக்கும் பொருளைப் பெறுகிறது; ஆகவே தமிழில் ‘ஆசியாவில்’ என வழங்குவது பொருளுக்கும் இயல்பான நடைக்கும் ஏற்றது.
