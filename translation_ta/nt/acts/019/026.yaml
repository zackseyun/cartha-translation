source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: ta
  text: 'நீங்கள் பார்க்கவும் கேட்கவும் செய்கிறீர்கள்: எபேசுவில் மட்டுமல்ல, ஏறக்குறைய ஆசியா முழுவதிலும்[a], இந்தப் பவுல் ஒரு கணிசமான மக்கள் கூட்டத்தை நம்பவைத்து, அவர்களைத் திருப்பியிருக்கிறான். “கைகளால் செய்யப்படுபவை தெய்வங்கள் அல்ல”[b] என்று சொல்லி அவன் இப்படிச் செய்திருக்கிறான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆசியா’ என்பது இன்றைய ஆசியக் கண்டம் அல்ல; எபேசுவை உள்ளடக்கிய ரோம மாகாணத்தைக் குறிக்கிறது.
    reason: historical_geography
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘கைகளின் வழியாக உருவாகுபவை’; மனிதர்கள் கைவினையால் உருவாக்கிய சிலைகளை இது குறிக்கிறது.'
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: நீங்கள் பார்த்தும் கேட்டும் வருகிறபடி
  rationale: இரண்டு நிகழ்கால வினைகளையும் இணைத்து, கேட்போர் நேரடியாக அறிந்திருக்கும் பொது ஆதாரத்தைச் சுட்டும் உரையாடல் வேகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: எபேசுவில் மட்டுமல்ல, ஏறக்குறைய ஆசியா மாகாணம் முழுவதிலும்
  rationale: இடப்பொருளில் அமைந்துள்ள கிரேக்க மரபுத்தொடரைத் தமிழில் தெளிவாகக் காட்டுகிறது; Ἀσία இங்கு ரோம மாகாணத்தைக் குறிப்பதால் ‘மாகாணம்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὁ Παῦλος οὗτος
  choice: இந்தப் பவுல்
  rationale: பேச்சாளரின் இகழ்ச்சிச் சாயலுடைய சுட்டுப்பெயரை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: πείσας μετέστησεν
  choice: நம்பவைத்து அவர்களுடைய நிலைப்பாட்டிலிருந்து திருப்பியிருக்கிறான்
  rationale: πείσας என்பதன் சம்மதிக்கவைத்தல்/நம்பவைத்தல் பொருளையும், μετέστησεν என்பதன் ஒரு நிலையிலிருந்து வேறொரு நிலைக்கு மாற்றுதல் பொருளையும் காக்கிறது; ‘தவறாக வழிநடத்தினான்’ என்ற கூடுதல் மதிப்பீட்டைத் தவிர்க்கிறது.
- source_word: ἱκανὸν ὄχλον
  choice: கணிசமான ஒரு மக்கள் கூட்டம்
  rationale: எண்ணிக்கையில் கவனிக்கத்தக்க அளவுடைய கூட்டம் என்ற பொருளை dignified modern Tamil-இல் தருகிறது.
- source_word: λέγων ὅτι
  choice: என்று அவன் சொல்லிவருகிறான்
  rationale: நிகழ்ந்துவரும் போதனையைச் சுட்டும் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι
  choice: கைகளால் செய்யப்படுபவை தெய்வங்கள் அல்ல
  rationale: மனிதக் கைவினையால் உருவாக்கப்பட்டவற்றின் தெய்வீக நிலையை நேரடியாக மறுக்கும் கிரேக்க வாக்கியத்தின் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: மனிதக் கைகளால் செய்யப்பட்டவற்றைப் பற்றிய பவுலின் மறுப்பின் எல்லை
  choice: கைகளால் செய்யப்படுபவை தெய்வங்கள் அல்ல
  alternative: கைகளால் செய்யப்பட்ட தெய்வங்கள் உண்மையான தெய்வங்கள் அல்ல
  rationale: மூலவாக்கியம் கைவினைப் பொருட்களின் தெய்வீக நிலையை மறுக்கிறது. ‘உண்மையான’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் அதன் நேரடியான முரண்பாட்டையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தெமெத்திரியுவின் குற்றச்சாட்டுத் தொனியும் ‘இந்தப் பவுல்’ என்ற இகழ்ச்சிச் சாயலும் காக்கப்பட்டுள்ளன; அதே நேரத்தில் மூலத்தில் இல்லாத ‘பொய்’, ‘ஏமாற்று’ போன்ற தீர்ப்புச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
