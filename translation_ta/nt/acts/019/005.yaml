  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: ta
  text: அவர்கள் இதைக் கேட்டபோது, ஆண்டவராகிய இயேசுவின் பெயரில் திருமுழுக்குப் பெற்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்கு சொல், “ஆண்டவராகிய இயேசுவின் பெயருக்குள்.”
    reason: εἰς τὸ ὄνομα என்ற கிரேக்கச் சொற்றொடரின் நேரடியான வடிவத்தையும், தமிழில் இயல்பான “பெயரில்” என்ற முதன்மை மொழிபெயர்ப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: இதைக் கேட்டதும்
  rationale: இறந்தகால வினையெச்சம் சூழலில் காலத் தொடர்பைக் காட்டுகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள், முந்தைய உரையாடலைக் குறிக்கும் வகையில் இயல்பான தமிழுக்காக ‘இதை’ எனத் தரப்பட்டுள்ளது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல் இன்றி வாக்கிய ஓட்டத்தில் வெளிப்படுத்தப்பட்டது
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் ‘அவர்கள்’ என்று தொடங்கும் இயல்பான தொடரே அதன் பணியைச் செய்கிறது. ‘ஆனால்’ என்பது தேவையற்ற முரண்பாட்டை உண்டாக்கும்.
- source_word: ἐβαπτίσθησαν
  choice: திருமுழுக்குப் பெற்றார்கள்
  rationale: கிரேக்க இறந்தகாலச் செயப்பாட்டு வடிவம் காக்கப்பட்டுள்ளது. ‘திருமுழுக்கு’ என்பது βαπτίζω என்பதன் முழுக்குதல் சார்ந்த அடிப்படைப் பொருளையும் கிறிஸ்தவச் சடங்கு சார்ந்த பயன்பாட்டையும் இயல்பாகக் காட்டுகிறது.
- source_word: εἰς τὸ ὄνομα
  choice: பெயருக்குள்
  rationale: εἰς என்பதன் திசை அல்லது ஒன்றோடு இணைக்கப்படும் நுண்பொருளைக் காக்க ‘பெயருக்குள்’ எனத் தரப்பட்டுள்ளது. வழக்கமான ‘பெயரில்’ என்ற மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவராகிய
  rationale: κύριος இங்கு இயேசுவுக்குரிய பட்டமாக உள்ளது. ‘ஆண்டவர்’ நவீனத் தமிழில் மரியாதையும் கிறிஸ்துவியல் பொருளும் கொண்ட இயல்பான இணை.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: Ἰησοῦς என்ற பெயரின் நிலையான தமிழ் வடிவம்.
theological_decisions:
- issue: திருமுழுக்கின் பெயர்சார் சொற்றொடர்
  choice: ஆண்டவராகிய இயேசுவின் பெயருக்குள்
  alternative: ஆண்டவராகிய இயேசுவின் பெயரில்
  rationale: கிரேக்கத்தில் εἰς τὸ ὄνομα என்று இருப்பதால், ‘பெயருக்குள்’ என்பது இணைப்பு அல்லது அடையாளப்படுத்தலின் திசைநோக்கைத் திறந்தவாறு காக்கிறது. ‘பெயரில்’ என்பது இயல்பான பாரம்பரிய வழக்கு என்றாலும், மூலத்தின் εἰς நுண்பொருளைச் சற்றுக் குறைக்கலாம்; ஆகவே அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பெயருக்குள்’ என்பது தமிழில் சற்றுப் புதுமையாக ஒலித்தாலும், மூல கிரேக்கத்தின் திசை/இணைப்பு நுண்பொருளைக் காக்கத் திட்டமிட்டு பயன்படுத்தப்பட்டுள்ளது; பழக்கமான வடிவம் அடிக்குறிப்பில் உள்ளது.
