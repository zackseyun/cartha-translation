source:
  edition: SBLGNT
  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: ta
  text: 'ஆனால் தீய ஆவி அவர்களுக்குப் பதிலளித்தது: “இயேசுவை நான் அறிவேன்; பவுலையும் எனக்குத் தெரியும்[a]. ஆனால் நீங்கள் யார்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசுவை நான் அறிவேன்; பவுலைப் பற்றியும் எனக்குத் தெரியும்.” கிரேக்கத்தில் ‘அறிவேன்’ என்பதற்கு γινώσκω என்றும், ‘தெரியும்’ என்பதற்கு ἐπίσταμαι என்றும் இரண்டு வேறு வினைகள் பயன்படுத்தப்பட்டுள்ளன; அவற்றின் பொருள் நுட்பத்தில் சிறு வேறுபாடு இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν … εἶπεν αὐτοῖς
  choice: அவர்களுக்குப் பதிலளித்து … கூறியது
  rationale: கிரேக்கத்தில் பதிலளிக்கும் செயலைக் குறிக்கும் வினையெச்சமும் பேச்சை அறிமுகப்படுத்தும் வினையும் உள்ளன. அவற்றை இயல்பான தமிழில் இந்தக் கட்டமைப்பு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுக்கும் தீய ஆவியின் எதிர்வினைக்கும் இடையிலான மிதமான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: தீய ஆவி
  rationale: தனிப்பட்ட ஆவிக்குரிய உயிரைக் குறிக்கும் πνεῦμα என்பதையும், இச்சூழலில் தீமையைக் குறிக்கும் πονηρόν என்பதையும் நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: இயேசுவை நான் அறிவேன்
  rationale: முன்னிலைப்படுத்தப்பட்ட ‘இயேசுவை’ என்பதன் அழுத்தத்தைத் தக்கவைத்து, γινώσκω என்பதைக் பொதுவான ‘அறிவேன்’ என மொழிபெயர்க்கிறது.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: பவுலையும் எனக்குத் தெரியும்
  rationale: முதற் கூற்றிலுள்ள γινώσκω என்பதிலிருந்து வேறுபட்ட ἐπίσταμαι என்ற வினையை தமிழிலும் வேறுபட்ட இயல்பான சொற்றொடரால் காட்டுகிறது; அதேவேளை அறிவின் அளவைப் பற்றி அளவுக்கு மீறிய பொருளைச் சேர்க்கவில்லை.
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: ஆனால் நீங்கள் யார்?
  rationale: ὑμεῖς என்பதிலுள்ள பன்மை மற்றும் அழுத்தத்தையும், δὲ குறிக்கும் முரண்பாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தீய ஆவி இயேசுவையும் பவுலையும் அறிந்திருப்பதை விவரிக்கப் பயன்படுத்தப்பட்ட γινώσκω, ἐπίσταμαι ஆகிய இரு வினைகளின் வேறுபாடு
  choice: “இயேசுவை நான் அறிவேன்; பவுலையும் எனக்குத் தெரியும்” என்று இரு வேறு தமிழ் வெளிப்பாடுகளைப் பயன்படுத்துதல்
  alternative: “இயேசுவை நான் அறிவேன்; பவுலைப் பற்றியும் எனக்குத் தெரியும்” அல்லது இரண்டையும் ‘அறிவேன்’ என மொழிபெயர்த்தல்
  rationale: மூலத்தில் இரு வேறு வினைகள் பயன்படுத்தப்பட்டுள்ளதால் சொல்லாட்சியின் வேறுபாட்டைத் தக்கவைக்கிறது. ஆனால் அவை ஆவியின் அறிவில் திட்டவட்டமான படிநிலைகளை நிறுவுகின்றன என்று உரை கூறாததால் அத்தகைய கோட்பாட்டு முடிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தீய ஆவி’ என்பது தெளிவான தற்போதைய வழக்கு; மேற்கோளில் இயேசு மற்றும் பவுல் முன்னிலைப்படுத்தப்பட்டிருப்பதும், இறுதிக் கேள்வியின் கடுமையான முரண்பாடும் தக்கவைக்கப்பட்டுள்ளன.
