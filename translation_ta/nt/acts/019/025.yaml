id: ACT.19.25
reference: Acts 19:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: ta
  text: அவர்களையும் இதுபோன்ற வேலைகளில் ஈடுபட்டிருந்த தொழிலாளர்களையும் ஒன்றுகூட்டி, அவன் அவர்களிடம், “ஆண்களே, இந்தத் தொழிலிலிருந்துதான் நமக்குச் செழிப்பு கிடைக்கிறது[a] என்பது உங்களுக்குத் தெரியும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வணிகத்திலிருந்துதான் நமக்கு வருமானம் கிடைக்கிறது.”
    reason: ἐργασία என்பது ‘தொழில்’ அல்லது ‘வணிகம்’ என்றும், εὐπορία என்பது ‘செழிப்பு,’ ‘செல்வ வளம்,’ அல்லது சூழலில் ‘வருமானம்’ என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: συναθροίσας
  choice: ஒன்றுகூட்டி
  rationale: முதன்மை வினைக்கு முன்னதாக நிகழ்ந்த ஒன்றுகூட்டுதலை அசைநிலைப் பெயரெச்ச வடிவில் இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: இதுபோன்ற வேலைகளில் ஈடுபட்டிருந்த தொழிலாளர்கள்
  rationale: ἐργάτας என்பதன் பொதுவான ‘தொழிலாளர்கள்’ என்ற பொருளையும், περὶ τὰ τοιαῦτα என்பதன் இத்தகைய பணிகளுடனான தொடர்பையும் காக்கிறது; குறிப்பிட்ட கைவினையை மூலத்தைவிடத் துல்லியமாக்கவில்லை.
- source_word: Ἄνδρες
  choice: ஆண்களே
  rationale: அங்கிருந்த ஆண் தொழில் கூட்டாளிகளை நேரடியாக அழைக்கும் ἀνήρ என்பதன் பன்மை விளியைத் துல்லியமாகத் தருகிறது.
- source_word: ἐπίστασθε
  choice: உங்களுக்குத் தெரியும்
  rationale: ஏற்கெனவே அறிந்திருக்கும் அறிவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: இந்தத் தொழிலிலிருந்துதான்
  rationale: ἐργασία இங்கு வருவாய் தரும் தொழில் அல்லது வணிக நடவடிக்கையைக் குறிக்கிறது; ‘தான்’ வருவாயின் மூலத்திற்குக் கிரேக்கத்தில் உள்ள வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: நமக்குச் செழிப்பு கிடைக்கிறது
  rationale: εὐπορία குறிக்கும் பொருளாதார வளம் அல்லது செழிப்பைத் தெளிவாகச் சொல்கிறது; கிரேக்க உரையின் உடைமை/பலன் சார்ந்த அமைப்பை இயல்பான தமிழில் தருகிறது.
