translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்களே’ என்பது சூழலிலுள்ள பாலினக் குறிப்பைத் தக்கவைக்கிறது; ‘தொழிலாளர்கள்’ என்பது மூலத்தின் பொதுவான சொல்லை மீறி ‘கைவினைஞர்கள்’ எனக் குறிப்பாக்குவதைத் தவிர்க்கிறது.
