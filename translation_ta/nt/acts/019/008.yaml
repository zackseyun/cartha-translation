id: ACT.19.8
reference: Acts 19:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: ta
  text: அவர் யூத ஜெபக்கூடத்திற்குள் சென்று, மூன்று மாதங்களாகத் துணிவுடன் பேசினார்; கடவுளின் அரசாட்சியைப் பற்றி விவாதித்து, மக்களை நம்பச் செய்ய முயன்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθὼν δὲ
  choice: பின்பு அவர் … சென்று
  rationale: δέ கதையை முன்னெடுத்துச் செல்லும் மென்மையான இணைப்பாக உள்ளது; அஓரிஸ்ட் வினையெச்சமான Εἰσελθών பிரதான செயலுக்கு முன் நிகழ்ந்த சூழலைக் காட்டுகிறது. நவீன தமிழில் ‘பின்பு … சென்று’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: συναγωγὴν
  choice: ஜெபக்கூடம்
  rationale: இங்கு யூதர்களின் கூடுகை மற்றும் வழிபாட்டு இடத்தைக் குறிக்கிறது. ‘ஜெபக்கூடம்’ தமிழ் வேதாகம வழக்கில் அறிமுகமானதும், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதும் ஆகும்.
- source_word: ἐπαρρησιάζετο
  choice: துணிவுடன் பேசிவந்தார்
  rationale: இம்பெர்ஃபெக்ட் வடிவம் தொடர்ந்து நிகழ்ந்த திறந்த, துணிவான பேச்சைக் குறிக்கிறது. ‘பேசிவந்தார்’ அதன் தொடர்ச்சித் தன்மையை வெளிப்படுத்துகிறது.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: மூன்று மாதங்கள்
  rationale: ἐπί + accusative இங்கு காலநீட்சியைக் குறிக்கிறது; தமிழில் ‘மூன்று மாதங்கள்’ என்பதே இயல்பான கால அளவுச் சொற்றொடர்.
- source_word: διαλεγόμενος
  choice: கலந்துரையாடி
  rationale: இச்சொல் வெறும் ஒருதலைப் பேச்சை அல்லாமல் விளக்கம், காரணவாதம், உரையாடல் ஆகியவற்றை உள்ளடக்கிய சொற்பரிமாற்றத்தைக் குறிக்கிறது. ‘கலந்துரையாடி’ தேவையற்ற சண்டைத் தொனியின்றி அந்த உரையாடல் அம்சத்தைப் பாதுகாக்கிறது.
- source_word: πείθων
  choice: இணங்கச் செய்துவந்தார்
  rationale: இது கேட்போரை ஏற்றுக்கொள்ளச் செய்யும் தொடர்ச்சியான வற்புறுத்தல் அல்லது மனமாற்றச் செயலைக் குறிக்கிறது. சூழலில் மறைமுகமாக உள்ள கேட்போரைத் தமிழில் வெளிப்படையாகக் குறிப்பிடுவது இயல்பானது; வெற்றியின் அளவு கிரேக்கத்தில் தீர்மானிக்கப்படாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: கடவுளுடைய அரசைப் பற்றி
  rationale: περί + genitive என்பது ‘பற்றி’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது. βασιλεία என்பது அரசாட்சி அல்லது அரசு என்ற பொருள் வரம்பைக் கொண்டது; ‘கடவுளுடைய அரசு’ பழக்கமான இறையியல் சொற்றொடரைப் பாதுகாக்கிறது.
theological_decisions:
- issue: πείθων என்பது இணங்கச் செய்ததில் வெற்றி ஏற்பட்டதையா அல்லது இணங்கச் செய்ய எடுத்த முயற்சியையா குறிக்கிறது?
  choice: இணங்கச் செய்துவந்தார்
  alternative: இணங்கச் செய்ய முயன்றுவந்தார்
  rationale: கிரேக்க நிகழ்கால வினையெச்சம் தொடர்ந்து நடந்த மனமாற்றச் செயலைக் காட்டுகிறது; அதன் விளைவு எவ்வளவு வெற்றிகரமாக இருந்தது என்பதை மட்டும் தெளிவுபடுத்தவில்லை. முதன்மை உரை வினையின் நேரடியான வலிமையை வைத்துக்கொள்கிறது; முயற்சியை வலியுறுத்தும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: βασιλεία τοῦ θεοῦ என்பதன் அரசியல்-ஆட்சிசார் பொருள் வரம்பு
  choice: கடவுளுடைய அரசு
  alternative: கடவுளுடைய ஆட்சி
  rationale: ‘அரசு’ என்பது புதிய ஏற்பாட்டில் அறிமுகமான முக்கிய சொற்றொடருடன் ஒத்திசைவாக இருக்கிறது; ‘ஆட்சி’ என்ற பொருளும் கிரேக்கச் சொல்லின் வரம்புக்குள் இருந்தாலும், இவ்வசனம் இரண்டில் ஒன்றைத் தனியாகக் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. தொடர்ச்சியான செயலைக் காட்ட ‘பேசிவந்தார்’, ‘செய்துவந்தார்’ பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தில் மறைந்துள்ள கேட்போர், தமிழின் இயல்புக்காக ‘கேட்டுக்கொண்டிருந்தவர்கள்’ என்று வெளிப்படுத்தப்பட்டுள்ளனர்.
