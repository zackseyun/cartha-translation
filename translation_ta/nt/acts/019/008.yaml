revisions:
- from: பின்பு அவர் ஜெபக்கூடத்திற்குள் சென்று, மூன்று மாதங்கள் துணிவுடன் பேசிவந்தார். கடவுளுடைய அரசைப் பற்றிக் கலந்துரையாடி, கேட்டுக்கொண்டிருந்தவர்களை இணங்கச் செய்துவந்தார்.[a]
  to: அவர் யூத ஜெபக்கூடத்திற்குள் சென்று, மூன்று மாதங்களாகத் துணிவுடன் பேசினார்; கடவுளின் அரசாட்சியைப் பற்றி விவாதித்து, மக்களை நம்பச் செய்ய முயன்றார்.
  rationale: The revision retains the narrative connective and the aorist participle (“சென்று”), represents the imperfect action across the stated period (“மூன்று மாதங்களாகத் துணிவுடன் பேசினார்”), and renders the two present participles as concurrent explanatory and persuasive activity. “மக்களை நம்பச் செய்ய முயன்றார்” supplies only the naturally implicit audience while avoiding any assertion that persuasion succeeded. No textual variant or unresolved lexical ambiguity requires a footnote here.
