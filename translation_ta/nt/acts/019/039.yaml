source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: ta
  text: ஆனால், இதற்கு மேல் வேறு ஏதாவது நீங்கள் நாடினால், அது சட்டமுறைப்படி கூட்டப்படும் பொதுக்கூட்டத்தில் தீர்க்கப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சட்டபூர்வமான கூட்டத்தில்’ அல்லது ‘முறையான கூட்டத்தில்.’ கிரேக்கச் சொல் திருச்சபையை அல்ல, சட்டப்படி அமைக்கப்பட்ட குடிமைக் கூட்டத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: இதற்கு மேல்
  rationale: தற்போதைய காரியத்திற்கு அப்பால் அல்லது கூடுதலாக என்பதைக் குறிக்கும் ஒப்பீட்டு வினையடைச் சொல்லின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπιζητεῖτε
  choice: நீங்கள் ... நாடினால்
  rationale: தேடுதல் அல்லது தொடர்ந்து கோருதல் என்ற பரந்த பொருளைப் பேணுகிறது; சூழலில் இல்லாத அளவுக்கு சட்டத் தொழில்நுட்ப அல்லது கடுமையான நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: τι
  choice: எதையாவது
  rationale: நிபந்தனை வாக்கியத்திலுள்ள வரையறுக்கப்படாத சுட்டுப்பெயரின் திறந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐννόμῳ
  choice: சட்டப்படி கூடும்
  rationale: சட்டத்திற்கு இசைவாக முறையாக அமைக்கப்பட்ட கூட்டம் என்ற குடிமைச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκκλησίᾳ
  choice: மக்கள் மன்றத்தில்
  rationale: இங்கு கிறிஸ்தவத் திருச்சபையை அல்ல, சட்டப்படி கூட்டப்பட்ட எபேசு நகரக் குடிமக்களின் பொதுக் கூட்டத்தைக் குறிக்கிறது; ‘நீதிமன்றம்’ என்பது மூலச்சொல்லைவிட மிகக் குறுகிய விளக்கமாகிவிடும்.
- source_word: ἐπιλυθήσεται
  choice: தீர்க்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவையும், ஒரு காரியம் நடைமுறைப்படி முடிவுக்குக் கொண்டுவரப்படும் என்ற பொருளையும் சுருக்கமாகப் பேணுகிறது.
theological_decisions:
- issue: கிறிஸ்தவமல்லாத குடிமைச் சூழலில் ἐκκλησία என்பதன் மொழிபெயர்ப்பு
  choice: மக்கள் மன்றம்
  alternative: திருச்சபை; கூட்டம்
  rationale: இங்கு குறிப்பிடப்படுவது எபேசுவின் சட்டபூர்வமான குடிமக்கள் கூட்டமே அன்றி கிறிஸ்தவச் சமூகம் அல்ல. ஆகவே ‘திருச்சபை’ தவறான சமயப் பொருளை உண்டாக்கும்; ‘மக்கள் மன்றம்’ சூழலையும் ஒன்றுகூடிய பொதுமக்கள் அமைப்பு என்ற அடிப்படைப் பொருளையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான குடிமை-சட்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘சட்டப்படி கூடும் மக்கள் மன்றம்’ என்பது ἐννόμῳ ἐκκλησίᾳ என்ற முழுச் சொற்றொடரின் பொருளை முதன்மை உரையிலேயே தெளிவாக்குவதால் அடிக்குறிப்பு தேவையில்லை.
