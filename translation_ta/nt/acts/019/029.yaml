source:
  edition: SBLGNT
  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: ta
  text: நகரம் குழப்பத்தால் நிறைந்தது. அவர்கள் ஒன்றுகூடி அரங்கத்துக்குள் பாய்ந்து சென்று, மக்கெதோனியர்களும் பவுலின் பயணத் தோழர்களுமான காயுவையும் அரிஸ்தர்க்குவையும் பலவந்தமாக இழுத்துச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காயுவையும் அரிஸ்தர்க்குவையும் வலுக்கட்டாயமாகப் பிடித்துக்கொண்டு சென்றார்கள்.” கிரேக்கச் சொல் வலுக்கட்டாயமாகப் பிடிப்பதை வலியுறுத்துகிறது; “இழுத்துச் சென்றார்கள்” என்பது அவர்களை அரங்கத்துக்குக் கொண்டு சென்ற கூட்டத்தின் நகர்வையும் வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: நகரம் முழுவதும் குழப்பத்தால் நிறைந்தது
  rationale: செயப்பாட்டு வடிவத்தையும் குழப்பம் நகரை ஆட்கொண்ட நிலைமையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; செயற்படுத்தியவர் யார் என்பதைச் சேர்க்கவில்லை.
- source_word: ὥρμησάν
  choice: பாய்ந்து சென்று
  rationale: திடீரான, வேகமான, தீவிரமான கூட்ட நகர்வை உணர்த்துகிறது.
- source_word: ὁμοθυμαδόν
  choice: ஒரே கூட்டமாக
  rationale: இங்கு நல்லிணக்கமான ஒருமனப்பாட்டைக் காட்டுவதற்குப் பதிலாக, கலகக்காரர்கள் கூட்டாகச் செயல்பட்டதைக் காட்டுகிறது.
- source_word: εἰς τὸ θέατρον
  choice: அரங்கத்துக்குள்
  rationale: θέατρον என்பதற்கான நேரடியான பொருளைத் தருகிறது; கிரேக்கச் சொல் குறிப்பிடாத கட்டட வகை நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: συναρπάσαντες
  choice: பலவந்தமாக இழுத்துச் சென்றார்கள்
  rationale: வலுக்கட்டாயமாகப் பிடித்ததையும் கூட்டத்தோடு அரங்கத்துக்குக் கொண்டு சென்ற நகர்வையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: Γάϊον καὶ Ἀρίσταρχον
  choice: காயுவையும் அரிஸ்தர்க்குவையும்
  rationale: தனிப்பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
- source_word: Μακεδόνας
  choice: மக்கெதோனியர்கள்
  rationale: இருவரின் புவியியல் அடையாளத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: συνεκδήμους Παύλου
  choice: பவுலின் பயணத் தோழர்கள்
  rationale: பவுலுடன் ஊருக்கு வெளியே பயணம் செய்த தோழர்கள் என்ற உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
