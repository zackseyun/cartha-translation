lexical_decisions:
- source_word: Ἐγένετο
  choice: எழுந்தது
  rationale: ஒரு நிகழ்வு தோன்றியதைக் குறிக்கும் வினை; ‘கலகம் எழுந்தது’ என்பது தமிழில் இயல்பான நிகழ்வுச் சொல்லாக்கம்.
- source_word: δὲ
  choice: தனி மொழிபெயர்ப்பு இல்லை
  rationale: இது மென்மையான உரையாடல் இணைப்புச் சொல். இங்கு ‘அந்தக் காலத்தில்’ என்ற தொடக்கமே தொடர்ச்சியை இயல்பாகக் காட்டுவதால் கூடுதல் இணைப்புச் சொல் தேவையில்லை.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: அந்தக் காலத்தில்
  rationale: குறிப்பிடப்பட்ட அதே காலப்பகுதியைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: τάραχος
  choice: கலகம்
  rationale: குழப்பமும் பொது அமைதியின்மையும் கொண்ட நிகழ்வைக் குறிக்கிறது; பின்னர் விவரிக்கப்படும் கூட்டக் கொந்தளிப்பை முன்கூட்டியே ‘கலவரம்’ என மிகக் குறிப்பாக வரையறுக்காமல் இருக்கிறது.
- source_word: οὐκ ὀλίγος
  choice: மிகுந்த
  rationale: கிரேக்கத்தில் ‘சிறிதல்லாத’ என்ற குறைத்துச் சொல்லும் நடை உள்ளது. தமிழில் ‘சிறிதல்லாத கலகம்’ செயற்கையாக ஒலிப்பதால், அதன் வலிமையை இயல்பாக ‘மிகுந்த’ என வழங்குகிறது.
- source_word: περὶ
  choice: குறித்து
  rationale: கலகம் எதைச் சார்ந்தது அல்லது எதன் நிமித்தம் ஏற்பட்டது என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: τῆς ὁδοῦ
  choice: வழியை
  rationale: அப்போஸ்தலர் நூலில் இயேசுவைப் பின்பற்றும் இயக்கத்திற்கான மீளும் பெயரைக் சொற்பொருளுக்கு நெருக்கமாகப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் குறிப்பிட்ட பயன்பாட்டை விளக்குகிறது.
theological_decisions:
- issue: τῆς ὁδοῦ என்பதை இயக்கத்தின் பெயராக வழங்குதல்
  choice: வழி
  alternative: கிறிஸ்தவ மார்க்கம்
  rationale: ‘வழி’ என்பது லூக்காவின் உருவகப் பெயரிடலைப் பாதுகாக்கிறது. ‘கிறிஸ்தவ மார்க்கம்’ வாசகருக்கு விளக்கமாக இருந்தாலும், மூலத்தில் இல்லாத பிற்காலப் பெயரையும் விளக்கத்தையும் நேரடியாக வசனத்துக்குள் சேர்த்துவிடும்.
translation_notes:
  register: நவீன, கண்ணியமான, எளிதில் புரியும் உரைநடை. கிரேக்கத்தின் நிகழ்வுச் சக்தி ‘கலகம் எழுந்தது’ என்பதில் காக்கப்பட்டுள்ளது. தமிழில் செயற்கையாக அமையும் மூலத்தின் குறைத்துச் சொல்லும் நடைக்கு பதிலாக அதன் வலிமை ‘மிகுந்த’ என இயல்பாகத் தரப்பட்டுள்ளது.
