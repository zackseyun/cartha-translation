id: ACT.19.30
reference: Acts 19:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂Παύλου δὲ⸃ βουλομένου εἰσελθεῖν εἰς τὸν δῆμον οὐκ εἴων αὐτὸν οἱ μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: ta
  text: ஆனால் பவுல் மக்கள் கூட்டத்திற்குள் செல்ல விரும்பியபோது, சீடர்கள் அவரை அனுமதிக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மக்கள் சபைக்குள்” அல்லது “கூட்டத்திற்குள்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொல் δῆμος, இந்தக் குடிமைச் சூழலில் கூடியிருந்த பொதுமக்கள் அமைப்பைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου
  choice: பவுல்
  rationale: Παῦλος என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து பவுலின் நோக்கத்திற்குத் திரும்பும் மென்மையான முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: βουλομένου
  choice: விரும்பியபோது
  rationale: இந்தப் பிறப்புநிலைத் தனித்தொடர் பவுலின் விருப்பத்தையோ நோக்கத்தையோ குறிக்கிறது; தமிழில் ‘விரும்பியபோது’ இயல்பாக உள்ளது.
- source_word: εἰσελθεῖν
  choice: செல்ல
  rationale: கூடியிருந்த மக்களின் நடுவே நுழைவதைக் குறிக்கும்; ‘கூட்டத்திற்குள்’ என்பதுடன் சேர்ந்து நுழைவு கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: εἰς τὸν δῆμον
  choice: மக்கள் கூட்டத்திற்குள்
  rationale: எபேசுவின் அரங்கச் சூழலில் δῆμος கூடியிருந்த பொதுமக்களையோ குடிமக்கள் கூட்டத்தையோ குறிக்கலாம். ‘மக்கள் கூட்டம்’ அந்தப் பொருளை இயல்பாகத் தருகிறது; குடிமைச் சபை என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: οὐκ εἴων
  choice: அனுமதிக்கவில்லை
  rationale: ἐάω என்பதன் இறந்தகாலத் தொடர்நிலை வடிவம் அவரை விடாமல் தடுத்ததையோ தொடர்ந்து அனுமதி மறுத்ததையோ குறிக்கிறது; தமிழில் இவ்வடிவம் இயல்பானது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: பவுலை மீண்டும் சுட்டும் நேரடிச் செயப்படுபொருள்; மரியாதை ஒருமை தமிழ்ச் செவ்வழக்கிற்கு ஏற்றது.
- source_word: οἱ μαθηταί
  choice: சீடர்கள்
  rationale: μαθηταί என்பதன் கற்றுப் பின்பற்றுகிறவர்கள் என்ற பொருளை நேரடியாகக் காக்கிறது; மூலத்தில் இல்லாத உடைமையைச் சேர்க்கவில்லை.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. δῆμος என்பதிலுள்ள ‘மக்கள் கூட்டம்/குடிமைச் சபை’ என்ற உண்மையான பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; οὐκ εἴων என்பதின் தொடர்ந்த தடைச் சாயல் சூழலுக்கேற்ப இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
