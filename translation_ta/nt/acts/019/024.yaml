revisions:
- from: ஏனெனில், தெமேத்திரியு என்ற பெயருடைய வெள்ளிக் கொல்லன் ஒருவன், அர்த்தெமியின் வெள்ளிச் சன்னதிகளை[a]ச் செய்து, கைவினைஞர்களுக்கு அற்பமல்லாத வருமானம்[b] கிடைக்கச் செய்துவந்தான்.
  to: ஏனெனில், தேமேத்திரியு என்னும் ஒரு வெள்ளிக் கொல்லன், அர்த்தெமியின் வெள்ளி ஆலயங்களை[a]ச் செய்து, கைவினைஞர்களுக்கு அற்பமல்லாத வணிக வாய்ப்பை[b] ஏற்படுத்திக் கொடுத்துவந்தான்.
  rationale: The revision maintains the verse’s explanatory connection and imperfect aspect, uses a direct but contextually open rendering of ναοί, and restores the broader commercial force of ἐργασία. The footnotes retain the lexical uncertainty and explain the Greek litotes without imposing a specific reconstruction of the objects.
