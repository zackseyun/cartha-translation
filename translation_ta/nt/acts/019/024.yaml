translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உரிய கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் விளக்க இணைப்பு, தொடர்ச்சியான செயற்பாடு, மற்றும் ‘அற்பமல்லாத’ என்ற குறைத்துக் கூறும் நடை இயன்றவரை பேணப்பட்டுள்ளன.
