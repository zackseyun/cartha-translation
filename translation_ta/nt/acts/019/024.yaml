source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: ta
  text: ஏனெனில், தேமேத்திரியு என்னும் ஒரு வெள்ளிக் கொல்லன், அர்த்தெமியின் வெள்ளி ஆலயங்களை[a]ச் செய்து, கைவினைஞர்களுக்கு அற்பமல்லாத வணிக வாய்ப்பை[b] ஏற்படுத்திக் கொடுத்துவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அர்த்தெமியின் வெள்ளிச் சன்னதிகளை’ அல்லது ‘அர்த்தெமியின் ஆலயத்தின் வெள்ளி மாதிரிகளை.’ கிரேக்கச் சொல் ‘ஆலயங்கள்’ என்று பொருள்படும்; இச்சூழலில் அது சிறிய வழிபாட்டுப் பொருட்களையோ ஆலய மாதிரிகளையோ குறித்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேர்மொழியாக, ‘சிறிதல்லாத தொழில்.’ இது கணிசமான வணிகம் அல்லது அதனால் கிடைக்கும் ஆதாயத்தைக் குறிக்கும் குறைத்துக் கூறும் நடை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δημήτριος
  choice: தெமேத்திரியு
  rationale: கிரேக்கத் தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; பெயரை மொழிபெயர்க்காமல் அதன் கிரேக்க வடிவைப் பின்பற்றுகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய நிகழ்வுக்கான பின்னணி விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை வெளிப்படையாகப் பேணுகிறது.
- source_word: ἀργυροκόπος
  choice: வெள்ளிக் கொல்லன்
  rationale: வெள்ளியில் பொருட்களை உருவாக்கும் திறனாளியை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: அர்த்தெமியின் வெள்ளிச் சன்னதிகள்
  rationale: ναός என்பதன் ஆலயம்/திருக்கோயில் சார்ந்த பொருளைப் பேணுவதோடு, வணிகச் சூழலில் சிறிய வழிபாட்டுப் பொருட்கள் அல்லது ஆலய மாதிரிகள் குறிக்கப்படலாம் என்ற தெளிவின்மையை மிகையாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: παρείχετο
  choice: கிடைக்கச் செய்துவந்தான்
  rationale: இறந்தகாலத்தில் தொடர்ந்து அல்லது வழக்கமாக நடந்த செயலைக் குறிக்கும் imperfect வடிவத்தையும், கைவினைஞர்களுக்கு பொருளாதார வாய்ப்பு வழங்கிய கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῖς τεχνίταις
  choice: கைவினைஞர்களுக்கு
  rationale: குறிப்பிட்ட தொழிலில் திறம்பெற்ற பணியாளர்களைக் குறிக்கும் இயல்பான, பாலினப் பொதுமையான சொல்.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: அற்பமல்லாத வருமானம்
  rationale: ‘சிறிதல்லாத’ என்ற கிரேக்க குறைத்துக் கூறும் நடையைப் பேணுகிறது; இச்சூழலில் ἐργασία தொழில் மூலம் கிடைக்கும் வருவாயைக் குறிக்கிறது.
