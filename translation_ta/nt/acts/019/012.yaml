  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: ta
  text: இதன் விளைவாக, அவருடைய உடலிலிருந்து[a] கைக்குட்டிகளோ வேலைக்கான முன்கவசங்களோ[b] நோயாளிகளிடம் எடுத்துச் செல்லப்பட்டன; நோய்கள் அவர்களை விட்டு நீங்கின; தீய ஆவிகளும் வெளியேறின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘அவருடைய தோலிலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வேலைக்கான இடுப்புத் துணிகளோ.’ இச்சொல் உடல் உழைப்பின்போது அணியப்பட்ட வேலை முன்கவசம் அல்லது இடுப்புத் துணியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: இதனால் … சென்றால்கூட
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அசாதாரண செயல்களின் விளைவை உணர்த்தும் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: நோயாளிகளிடம்
  rationale: நோயுற்றவர்களை நோக்கிப் பொருட்கள் எடுத்துச் செல்லப்பட்ட இயக்கத்தையும் இலக்கையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἀποφέρεσθαι
  choice: எடுத்துச் சென்றால்கூட
  rationale: பவுலிடமிருந்து நோயாளிகளிடம் பொருட்கள் கொண்டு செல்லப்பட்டதை இயல்பாகக் கூறுகிறது; நிகழ்வின் விளைவுத்தன்மையை ‘சென்றால்கூட’ வெளிப்படுத்துகிறது.
- source_word: ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: அவருடைய உடலிலிருந்து
  rationale: χρώς என்பதன் நேரடிப் பொருள் ‘தோல்’ என்றாலும், இச்சூழலில் உடலோடு தொடர்புபட்ட துணிகள் எடுத்துச் செல்லப்பட்டதை நவீன தமிழில் இயல்பாகக் கூறுகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: σουδάρια
  choice: கைக்குட்டிகள்
  rationale: வியர்வையையோ முகத்தையோ துடைக்கப் பயன்படுத்தப்பட்ட துணிகளைக் குறிக்கும் சொல்லுக்கு எளிதில் புரியும் இயல்பான இணைச்சொல்.
- source_word: σιμικίνθια
  choice: வேலைக்கான இடுப்புத் துணிகள்
  rationale: உடல் உழைப்பின்போது அணியப்பட்ட முன்கவசம் அல்லது வேலை உடையைச் சுட்டுகிறது; பண்டைய பொருளை விளங்கத்தக்க தமிழில் தருகிறது.
- source_word: ἀπαλλάσσεσθαι
  choice: நீங்கின
  rationale: நோய்கள் அவர்களிடமிருந்து அகன்றன என்ற கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: νόσους
  choice: நோய்கள்
  rationale: பன்மையில் வரும் உடல்நலக் கேடுகளை நேரடியாகக் குறிக்கிறது.
- source_word: πνεύματα τὰ πονηρά
  choice: தீய ஆவிகள்
  rationale: பகைமைமிக்க ஆவிக்குரிய உயிர்களை மதப்பிரிவுச் சார்பின்றி நேரடியாகக் குறிக்கிறது.
- source_word: ἐκπορεύεσθαι
  choice: வெளியேறின
  rationale: ஆவிகள் பிடிக்கப்பட்டவர்களிடமிருந்து வெளியேறியதாகக் கூறும் கிரேக்கச் சொற்றொடரின் வழக்கமான பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுலின் உடலோடு தொடர்புபட்ட துணிகள் வழியாக நிகழ்ந்த குணமாக்கலும் தீய ஆவிகள் வெளியேறியதும்
  choice: நூல் விவரிக்கும் அற்புத நிகழ்வை விளக்கக் கோட்பாடு சேர்க்காமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: இதைப் புனிதப் பொருட்கள் வணக்கத்திற்கான ஆதரவாகவோ, வெறும் அடையாள நிகழ்வாகவோ விளக்குதல்
  rationale: மூல உரை நிகழ்வை அற்புதமாக விவரிக்கிறது; அதன் இயல்பை மிகைப்படுத்தும் பிற்காலக் கோட்பாடுகளையோ அதைத் தணிக்கும் பகுத்தறிவுவாத விளக்கங்களையோ மொழிபெயர்ப்பு சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் விளைவைக் குறிக்கும் அமைப்பு தமிழில் ‘இதனால் … சென்றால்கூட’ என இயல்பாக்கப்பட்டுள்ளது; அற்புத நிகழ்வு விளக்கச் சேர்க்கையின்றி அப்படியே வைக்கப்பட்டுள்ளது.
