  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: ta
  text: அவர்கள் இதைக் கேட்டு, கடுங்கோபத்தால் நிறைந்து[a], “எபேசியர்களின் அர்த்தெமிஸ் மகத்தானவள்!” என்று தொடர்ந்து கூச்சலிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடுஞ்சினத்தால் நிறைந்து,” “வெறிகொண்ட கோபமடைந்து,” அல்லது “கடுஞ்சினம் கொண்டவர்களாகி.” கிரேக்கச் சொற்றொடர் சொல்லுக்குச் சொல், “தீவிரமான கோபத்தால் நிறைந்தவர்களாகி” எனப் பொருள்படுகிறது; இதில் θυμός என்பது தீவிரமான கோபத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: அவர்கள் இதைக் கேட்டு
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கு முந்திய சூழலைக் காட்டுகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள், முந்தைய உரையைச் சுட்டுவதால் தமிழில் இயல்பாக ‘இதை’ என்று தரப்பட்டது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான எதிர்மறை இணைப்பல்ல; மென்மையான தொடர்ச்சியை மட்டும் குறிக்கிறது. தமிழில் வினையெச்சத் தொடர் அந்த ஓட்டத்தை இயல்பாகவே வெளிப்படுத்துகிறது.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: கடுஞ்சினத்தால் நிறைந்து
  rationale: ‘θυμός-ஆல் நிறைந்தவர்களாகி’ என்ற கிரேக்க உருவகத்தையும் கடுமையான கோபத்தின் தீவிரத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἔκραζον
  choice: தொடர்ந்து கூச்சலிட்டார்கள்
  rationale: கிரேக்க இறந்தகாலத் தொடர்வினையின் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலை ‘தொடர்ந்து’ தெளிவாக்குகிறது.
- source_word: λέγοντες
  choice: என்று
  rationale: கூச்சலின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் வினையெச்சம் தமிழில் மேற்கோளுக்குப் பின்வரும் ‘என்று’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: எபேசியர்களின் அர்த்தெமி மகத்தானவள்!
  rationale: முழக்கத்தின் வலிமையையும் Ἐφεσίων என்ற பன்மை மக்களைக் குறிக்கும் உடைமைத் தொடர்பையும் காக்கிறது; பாலினம் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: Ἄρτεμις
  choice: அர்த்தெமி
  rationale: கிரேக்கப் பெயரான Ἄρτεμις என்பதன் ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: Ἐφεσίων
  choice: எபேசியர்களின்
  rationale: இது ‘எபேசிய மக்கள்’ என்பதைக் குறிக்கும் பெயர்ச்சொல்லாக்கப்பட்ட பன்மை உடைமை வடிவம்; ‘எபேசுவின்’ என்பதைவிட மூலவடிவத்துக்கு நெருக்கமானது.
theological_decisions:
- issue: புறமதத் தெய்வத்தைப் புகழும் முழக்கத்தை மொழிபெயர்த்தல்
  choice: “எபேசியர்களின் அர்த்தெமி மகத்தானவள்!”
  alternative: “எபேசியர்களின் அர்த்தெமி பெரியவள்!”
  rationale: இது கூட்டத்தாரின் நேரடி முழக்கமாக மட்டுமே வழங்கப்படுகிறது; மொழிபெயர்ப்பாளரின் ஒப்புதலாகவோ மறுப்பாகவோ மாற்றப்படவில்லை. ‘மகத்தானவள்’ முழக்கத்தின் உயர்த்திப் புகழும் தொனியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டது. தொடர்ச்சியான கூட்டக் கூச்சலை ‘தொடர்ந்து கூச்சலிட்டார்கள்’ என்றும், முழக்கத் தன்மையை நேரடி மேற்கோளிலும் ஆச்சரியக்குறியிலும் காத்துள்ளோம்.
