id: ACT.19.9
reference: Acts 19:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: ta
  text: ஆனால் சிலர் பிடிவாதமாகி, கீழ்ப்படிய மறுத்து[a], மக்கள் கூட்டத்தின் முன்னிலையில் ‘வழி’யை[b]த் தூற்றிப் பேசிக்கொண்டிருந்தபோது, அவர் அவர்களை விட்டு விலகி, சீடர்களை அவர்களிடமிருந்து பிரித்து, திரன்னுவின் விரிவுரைக் கூடத்தில்[c] நாள்தோறும் உரையாடினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்ப மறுத்து” அல்லது “இணங்க மறுத்து.”
    reason: lexical_alternative
  - marker: b
    text: ‘வழி’ என்பது அப்போஸ்தலர் பணிகள் நூலில் ஆரம்பகால கிறிஸ்தவ இயக்கத்தைக் குறித்த ஒரு பெயர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “திரன்னுவின் பள்ளியில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: மனம் கடினப்பட்டு
  rationale: முழுமையடையாத காலவினை காட்டும் தொடர்ச்சியான கடினமாதல் அல்லது பிடிவாத நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; செய்பவர் யார் என்பதைத் தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: ἠπείθουν
  choice: இணங்க மறுத்து
  rationale: செய்தியை நம்பாதிருப்பது மட்டுமல்லாமல், அதற்கு மனப்பூர்வமாக இணங்க மறுக்கும் பொருளையும் காக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: κακολογοῦντες
  choice: தூற்றிப் பேசினார்கள்
  rationale: பொதுமக்கள் முன் இழிவாகவும் எதிர்ப்பாகவும் பேசுவதை இயல்பாகக் குறிக்கிறது; சட்டரீதியான அவதூறு என்ற குறுகிய பொருளைத் திணிக்கவில்லை.
- source_word: τὴν ὁδὸν
  choice: ‘வழி’
  rationale: அப்போஸ்தலர் பணிகள் நூலில் இயேசுவைப் பின்பற்றும் இயக்கத்தைக் குறிக்கும் அடையாளப் பெயராகப் பயன்படுவதை மேற்கோள் குறிகள் தெளிவாக்குகின்றன.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: மக்கள் கூட்டத்தின் முன்னிலையில்
  rationale: எதிர்ப்பு வெளிப்படையாகவும் பொதுவாகவும் நிகழ்ந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: அவர்களைவிட்டு விலகி
  rationale: எதிர்த்தவர்களிடமிருந்து ஏற்பட்ட தீர்மானமான பிரிவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: சீடர்களைத் தனியாகப் பிரித்துக்கொண்டு
  rationale: சீடர்களை எதிர்ப்பாளர்களிடமிருந்து திட்டமிட்டுப் பிரித்த செயலைக் காட்டுகிறது; வெறும் இடமாற்றமாகக் குறுக்கவில்லை.
- source_word: καθ’ ἡμέραν
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் தொடர்ந்து நடைபெற்ற செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: διαλεγόμενος
  choice: அவர்களுடன் கலந்துரையாடினார்
  rationale: விளக்கமும் கேள்வி-பதிலும் கொண்ட காரணபூர்வ உரையாடலைக் குறிக்கிறது; பகைமையான வாக்குவாதம் என்ற பொருளைத் திணிக்கவில்லை.
- source_word: ἐν τῇ σχολῇ Τυράννου
  choice: திரன்னுவின் விரிவுரைக் கூடத்தில்
  rationale: சொற்பொழிவு அல்லது போதனை நடைபெற்ற இடம் என்பதை நவீன வாசகருக்குத் தெளிவாக்குகிறது; ‘பள்ளி’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ‘வழி’ என்பது இயக்கத்தின் பெயரா அல்லது பொதுவான உருவகமா
  choice: இயேசுவைப் பின்பற்றிய இயக்கத்தின் அடையாளப் பெயராக ‘வழி’
  alternative: ஒரு பொதுவான பாதை அல்லது போதனை என்ற பொருளில் ‘வழி’
  rationale: அப்போஸ்தலர் பணிகள் நூலின் பயன்பாட்டில் இச்சொல் ஆரம்பகால கிறிஸ்தவ இயக்கத்திற்கான அறியப்பட்ட பெயராகச் செயல்படுகிறது. மேற்கோள் குறிகள் அந்தப் பெயர்த்தன்மையை மட்டும் காட்டுகின்றன; கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. தொடர்ச்சியான எதிர்ப்பைச் சுட்டும் கிரேக்க இறந்தகால வடிவங்கள் இயல்பான நிகழ்ச்சித் தொடராக மொழிபெயர்க்கப்பட்டுள்ளன. ‘வழி’ என்ற வரலாற்றுப் பெயர் மேற்கோள் குறிகளாலும் அடிக்குறிப்பாலும் தெளிவாக்கப்பட்டுள்ளது.
