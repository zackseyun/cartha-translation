source:
  edition: SBLGNT
  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: ta
  text: 'பவுல் கூறினார்: “யோவான் மனந்திரும்புதலுக்குரிய திருமுழுக்கைக் கொடுத்தார்.[a] தமக்குப் பின் வருகிறவர்மேல்—அதாவது, இயேசுவின்மேல்—நம்பிக்கை வைக்க வேண்டும் என்று மக்களிடம் கூறினார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “யோவான் மனந்திரும்புதலின் திருமுழுக்கைத் திருமுழுக்கினார்.”'
    reason: கிரேக்கத்தின் ἐβάπτισεν βάπτισμα μετανοίας என்ற ஒரேவேர் வினை–பெயர் அமைப்பைச் சுட்டிக்காட்டும் இயல்பற்ற, சொற்சொல்லான மாற்று.
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: மனந்திரும்புதலுக்குரிய திருமுழுக்கைக் கொடுத்தார்
  rationale: கிரேக்க மூலத்திலுள்ள வினை–பெயர் ஒரேவேர் அமைப்பைத் தமிழில் சொற்சொல்லாகக் கொண்டுவருவது இயல்பற்றதாக இருப்பதால், ‘திருமுழுக்கைக் கொடுத்தார்’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது. μετανοίας என்பது அந்தத் திருமுழுக்கின் தன்மையை அல்லது தொடர்பைக் குறிக்கிறது; அதனால் ‘மனந்திரும்புதலுக்குரிய’ என வழங்கப்படுகிறது.
- source_word: τῷ λαῷ
  choice: மக்களிடம்
  rationale: λαός இங்கு ஒரு பொதுவான மக்கள் கூட்டத்தைக் குறிக்கிறது. ‘இஸ்ரயேல் மக்களிடம்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத தகவலைச் சேர்க்கும்.
- source_word: λέγων
  choice: கூறினார்
  rationale: இந்தப் பங்கேற்புவினை, யோவானின் திருமுழுக்குப் பணியுடன் சேர்ந்திருந்த அறிவுறுத்தலை அறிமுகப்படுத்துகிறது. தமிழில் தனி வினைமுற்றாக வழங்குவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: தமக்குப் பின் வருகிறவர்மேல்
  rationale: πιστεύω உடன் εἰς நம்பிக்கையின் இலக்கைக் குறிக்கிறது; தமிழில் ‘ஒருவர்மேல் நம்பிக்கை வைக்க’ என்பது இயல்பான அமைப்பு. μετ’ αὐτόν கால/பணி வரிசையில் ‘தமக்குப் பின்’ எனப் பொருள்படுகிறது.
- source_word: ἵνα πιστεύσωσιν
  choice: நம்பிக்கை வைக்க வேண்டும் என்று
  rationale: பேச்சுச் சொல்லைத் தொடர்ந்து வரும் ἵνα இங்கு நோக்கம் அல்லது அறிவுறுத்தலின் உள்ளடக்கத்தைத் தருகிறது. ‘வேண்டும் என்று’ என்பது அதன் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: τοῦτ’ ἔστιν
  choice: அதாவது
  rationale: முன்னர் கூறப்பட்ட ‘வருகிறவர்’ யார் என்பதை விளக்கும் நேரடியான அடையாளப்படுத்தும் தொடர்.
- source_word: εἰς τὸν Ἰησοῦν
  choice: இயேசுவின்மேல்
  rationale: முன் வாக்கியத்திலுள்ள ‘நம்பிக்கை வைக்க’ என்ற கருத்து இங்கும் தொடர்கிறது. மூலத்தில் ‘கிறிஸ்து’ அல்லது ‘மேசியா’ என்ற பட்டம் இல்லாததால் அது சேர்க்கப்படவில்லை.
theological_decisions:
- issue: யோவானின் திருமுழுக்குக்கும் இயேசுவின்மேலான நம்பிக்கைக்கும் உள்ள தொடர்பு
  choice: யோவானின் திருமுழுக்கு மனந்திரும்புதலுக்குரியதாக விவரிக்கப்படுகிறது; அதனுடன், தமக்குப் பின் வருபவரான இயேசுவின்மேல் நம்பிக்கை வைக்குமாறு அவர் மக்களிடம் கூறினார்.
  alternative: யோவானின் திருமுழுக்கே கிறிஸ்தவ நம்பிக்கையை உண்டாக்கியது என்று பொருள் கொள்ளுதல்.
  rationale: வாக்கிய அமைப்பு யோவானின் திருமுழுக்கையும் அதனுடன் சேர்ந்த அவரது அறிவுறுத்தலையும் தொடர்புபடுத்துகிறது; ஆனால் திருமுழுக்கே நம்பிக்கையைச் செயலாக்கியது என்ற கோட்பாட்டுச் சேர்க்கையைச் செய்யவில்லை. ‘அதாவது இயேசுவின்மேல்’ என்பது வருகிறவரை வெளிப்படையாக அடையாளப்படுத்துகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருமுழுக்கு’ என்ற சொல் baptisma என்பதைக் குறிக்கிறது; ‘மனந்திரும்புதல்’ என்பது μετανοία-வின் உள்ளார்ந்த மனப்போக்கு மற்றும் வாழ்வுத் திருப்பத்தைத் தக்கவைக்கிறது. அடைப்புக் கோடுகளால் விளக்கச் சொற்றொடர் தெளிவுபடுத்தப்பட்டுள்ளது.
