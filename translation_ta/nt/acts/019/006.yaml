  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: ta
  text: பவுல் அவர்கள்மீது கைகளை வைத்தபோது, பரிசுத்த ஆவியானவர் அவர்கள்மீது வந்தார்; அவர்கள் பாஷைகளில்[a] பேசினார்கள், இறைவாக்கும் உரைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மொழிகளில்.’ கிரேக்கச் சொல் பேசப்படும் நாவு அல்லது மொழி என்பதைக் குறிக்கலாம்; இங்கே அது சாதாரண மனித மொழிகளையா வேறுவகையான ஆவிக்குரிய பேச்சையா என்று உரை தீர்மானிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: பவுல் அவர்கள்மேல் கைகளை வைத்தபோது
  rationale: மரபுத்தொடரை இயல்பான தமிழில் தக்கவைத்து, இறந்தகாலப் பங்கேற்பெச்சத்தின் காலத் தொடர்பை ‘வைத்தபோது’ என்ற துணைவாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς
  choice: பரிசுத்த ஆவியானவர் அவர்கள்மேல் வந்தார்
  rationale: ἔρχομαι + ἐπί என்பதன் திசைநிலையையும் லூக்கா–அப்போஸ்தலர் நடபடிகளில் காணப்படும் நிகழ்வுரையையும் இயல்பாகப் பிரதிபலிக்கிறது; காரணவியல் அல்லது பிற்காலக் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ἐλάλουν
  choice: பேசவும் ... தொடங்கினார்கள்
  rationale: கதைச்சூழலில் இறந்தகாலத் தொடர்நிலை வினையின் தொடக்கத்தையும் தொடர்ச்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γλώσσαις
  choice: நாவுகளில்
  rationale: γλῶσσα என்பதன் ‘நாவுகள்/மொழிகள்’ என்ற சொற்பொருள் இருமையை முதன்மை உரையில் தீர்மானிக்காமல் பாதுகாக்கிறது; அடிக்குறிப்பு வாசகருக்குப் பொருள் வாய்ப்பைத் தெளிவுபடுத்துகிறது.
- source_word: ἐπροφήτευον
  choice: இறைவாக்கு உரைக்கவும்
  rationale: வெறும் எதிர்கால முன்னறிவிப்பு என்ற குறுகிய எண்ணத்தைத் தவிர்த்து, தீர்க்கதரிசனச் செய்தியை உரைத்தல் என்ற வினையின் பொருளை நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τε ... καί
  choice: பேசவும் ... உரைக்கவும்
  rationale: இரண்டு செயல்களையும் நெருக்கமாக இணைக்கும் கிரேக்க இணைப்பை இயல்பான தமிழ் இணை வினையமைப்பால் தெரிவிக்கிறது.
theological_decisions:
- issue: அப்போஸ்தலர் 19:6-இல் γλώσσαις என்பதன் இயல்பு
  choice: இவை அறியப்பட்ட மனித மொழிகளா அல்லது பரவசப் பேச்சா என்று தீர்மானிக்காமல் ‘நாவுகளில்’ என வழங்குதல்
  alternative: ‘மொழிகளில்’ அல்லது ‘அந்நிய மொழிகளில்’ என வழங்குதல்
  rationale: இந்த வசனத்தில் γλώσσαις இரு பொருள் வாய்ப்புகளையும் கொண்டுள்ளது. எந்த ஒரு சபைமரபின் விளக்கத்தையும் உரைக்குள் இறக்காமல், மூலத்தின் தெளிவின்மையை அடிக்குறிப்புடன் பாதுகாக்கிறது.
- issue: பரிசுத்த ஆவியானவர் அவர்கள்மேல் வந்ததற்கும் பவுல் கைகளை வைத்ததற்கும் இடையிலான தொடர்பு
  choice: நிகழ்வுகளின் வரிசையை மட்டும் கூறுதல்
  alternative: கை வைத்ததே ஆவியானவரின் வருகையை உண்டாக்கியது என காரணத் தொடர்பை வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க உரை நிகழ்வுகளின் காலத் தொடர்பைக் கூறுகிறது; அதன் முழுமையான இறையியல் காரணவியலை விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified, எளிதில் வாசிக்கக்கூடிய நடையைப் பயன்படுத்துகிறது. ‘பரிசுத்த ஆவியானவர்’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் இயல்பான மரியாதை வடிவம். ‘நாவுகளில்’ என்பது தனியே சற்றுக் குறியீட்டுத் தன்மை உடையதால், மூலத்தின் பொருள் இருமையைப் பாதுகாக்க உடனடி அடிக்குறிப்பு வழங்கப்பட்டுள்ளது.
