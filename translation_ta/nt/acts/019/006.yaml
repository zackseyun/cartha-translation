revisions:
- from: பவுல் அவர்கள்மேல் கைகளை வைத்தபோது, பரிசுத்த ஆவியானவர் அவர்கள்மேல் வந்தார். அவர்கள் நாவுகளில்[a] பேசவும் இறைவாக்கு உரைக்கவும் தொடங்கினார்கள்.
  to: பவுல் அவர்கள்மீது கைகளை வைத்தபோது, பரிசுத்த ஆவியானவர் அவர்கள்மீது வந்தார்; அவர்கள் பாஷைகளில்[a] பேசினார்கள், இறைவாக்கும் உரைத்தார்கள்.
  rationale: The revision preserves the source's temporal sequence and its non-causal narrative wording, while replacing an unidiomatic literalism with established natural Tamil. The note preserves the lexical and interpretive ambiguity of γλώσσαις rather than imposing either a human-language or ecstatic-speech reading. Removing the explicit inceptive auxiliary avoids adding a nuance not demanded by the Greek imperfects.
