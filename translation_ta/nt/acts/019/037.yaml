  source_fidelity: மூலக் கிரேக்கத்தின் விளக்கத் தொடர்பான γάρ, ‘இந்த மனிதர்கள்’ என்ற சுட்டுக்குறிப்பு, οὔτε…οὔτε என்ற இரட்டை மறுப்பு, மற்றும் இரு குற்றச்சாட்டுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ἱεροσύλους என்பதற்கு ‘கோவில் கொள்ளையர்கள்’ என்பது சூழலுக்கு ஏற்ற நேரடியான மொழிபெயர்ப்பு. βλασφημοῦντας என்பதன் தெய்வத்தை இழிவுபடுத்திப் பேசுதல் என்ற பொருளை ‘நம் தேவியைப் பழித்துப் பேசுகிறவர்கள்’ சரியாகத் தருகிறது.
  naturalness: உரை நவீன நிலையான தமிழில் தெளிவாகவும், பொதுக்கூட்டத்தில் அதிகாரி கூறும் மரியாதையான விளக்கவாதத் தொனிக்கேற்றதாகவும் உள்ளது. ‘ஏனெனில்’ மற்றும் ‘…உம் அல்ல, …உம் அல்ல’ ஆகியவை இயல்பாக அமைந்துள்ளன.
  terminology: ‘கோவில் கொள்ளையர்கள்’ மற்றும் ‘பழித்துப் பேசுகிறவர்கள்’ ஆகியவை பொதுவாசகருக்குப் புரியக்கூடியவை; அதேவேளை மூலத்தின் சட்ட/மதச் சூழலையும் காக்கின்றன. ஆர்த்தெமிஸைக் குறிக்கும் τὴν θεὸν ἡμῶν-ஐ ‘நம் தேவி’ என மொழிபெயர்த்திருப்பது சூழலியல் ரீதியாகத் துல்லியமானது. அடிக்குறிப்பு, கிரேக்கச் சொல்லின் பாலற்ற அகராதிவடிவத்துக்கும் சூழலில் உள்ள பெண் தெய்வக் குறிப்புக்கும் இடையிலான வேறுபாட்டை போதுமான வகையில் விளக்குகிறது.
