id: ACT.19.37
reference: Acts 19:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: ta
  text: ஏனெனில், நீங்கள் இங்கே கொண்டுவந்துள்ள இந்த மனிதர்கள் கோவில் கொள்ளையர்களும் அல்ல, நம் தேவியைப் பழித்துப் பேசுகிறவர்களும் அல்ல.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “நம் தெய்வம்”; இங்கு குறிப்பிடப்படுவது ஆர்த்தெமிஸ் என்பதால், “நம் தேவி” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγετε
  choice: நீங்கள் இங்கே கொண்டுவந்துள்ள
  rationale: இறந்தகாலச் செயல் தற்போதைய கூடுகையில் விளைவுடன் நிற்பதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘இங்கே’ என்பது சூழலில் அவர்களைச் சபைக்கு அழைத்து வந்திருப்பதைத் தெளிவாக்குகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοὺς ἄνδρας τούτους
  choice: இந்த மனிதர்கள்
  rationale: ἀνήρ என்பதன் ஆண்பால் குறிப்பைப் பாதுகாத்து, τούτους என்பதன் சுட்டுப்பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: οὔτε ... οὔτε
  choice: …உம் அல்ல, …உம் அல்ல
  rationale: இரண்டு குற்றச்சாட்டுகளையும் இணையாக மறுக்கும் கிரேக்க அமைப்பை இயல்பான தமிழ் எதிர்மறை இணைப்பால் காக்கிறது.
- source_word: ἱεροσύλους
  choice: கோவில் கொள்ளையர்கள்
  rationale: புனித இடம் அல்லது அதன் பொருட்களைக் கொள்ளையிடுவோரைக் குறிக்கும் சொல்லின் நேரடியான, சூழலுக்கேற்ற பொருளைத் தருகிறது.
- source_word: βλασφημοῦντας
  choice: பழித்துப் பேசுகிறவர்கள்
  rationale: ஒரு தெய்வத்தை அவமதித்தோ நிந்தித்தோ பேசுதல் என்ற செயற்பொருளை, மதச்சார்பான தொழில்நுட்பச் சொல்லில் மட்டும் முடக்காமல் பொதுவாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: τὴν θεὸν ἡμῶν
  choice: நம் தேவி
  rationale: θεός இங்கு எபேசியரின் ஆர்த்தெமிஸைக் குறிக்கிறது; பெண் தெய்வமே சூழலில் குறிப்பாக இருப்பதால் ‘தேவி’ என்பது இயல்பான மற்றும் துல்லியமான தமிழ்.
theological_decisions:
- issue: ஆர்த்தெமிஸைக் குறிக்கும் τὴν θεὸν ἡμῶν என்பதன் மொழிபெயர்ப்பு
  choice: நம் தேவி
  alternative: நம் தெய்வம்
  rationale: பேசுபவர் எபேசியப் புறமத அதிகாரி; குறிப்பிட்ட பொருள் ஆர்த்தெமிஸ். ‘தேவி’ என்பது சூழலின் பெண் தெய்வக் குறிப்பைத் தெளிவாக்குகிறது; இது அவளுடைய தெய்வீகத்தன்மையை மொழிபெயர்ப்பாளர் ஏற்றுக்கொள்வதாகாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் வகையில் கண்ணியமான உரைநடை. பொதுக்கூட்டத்தில் அதிகாரி கூறும் விளக்கவாதத் தொனி காக்கப்பட்டுள்ளது.
