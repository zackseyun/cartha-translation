translation:
  language: ta
  text: தேவன் பவுலின் கைகளால் அசாதாரணமான அற்புதங்களைச் செய்துகொண்டிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘சாதாரணமானவை அல்லாத வல்ல செயல்கள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δυνάμεις
  choice: வல்ல செயல்கள்
  rationale: பன்மையில் வரும் δύναμις இங்கு அருவமான ‘வல்லமை’யை அல்ல, வல்லமையை வெளிப்படுத்தும் அற்புதச் செயல்களைக் குறிக்கிறது. ‘வல்ல செயல்கள்’ என்பது மூலச்சொல்லின் வல்லமை சார்ந்த நுணுக்கத்தையும் நிகழ்வு சார்ந்த பொருளையும் காக்கிறது.
- source_word: τε
  choice: (தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை)
  rationale: τε முந்தைய நிகழ்வோடு இவ்வாக்கியத்தை இணைக்கிறது. தமிழில் தொடர்ச்சியான உரைநடையில் தனியே ‘மேலும்’ என்று சேர்க்காமல் இருப்பது இயல்பாக இருப்பதால், இணைப்பு சூழலால் உணரப்படுகிறது.
- source_word: οὐ τὰς τυχούσας
  choice: அசாதாரணமான
  rationale: ‘சாதாரண வகையைச் சேர்ந்தவை அல்ல’ என்ற கிரேக்க மரபுத்தொடரின் வலியுறுத்தலை இயல்பான நவீன தமிழில் ‘அசாதாரணமான’ என்பது தெளிவாகக் கொடுக்கிறது.
- source_word: ὁ θεὸς
  choice: தேவன்
  rationale: கிரேக்கத்தில் தேவனே வினையின் வெளிப்படையான எழுவாய்; இதனால் தெய்வீக செயற்பாடு தெளிவாகக் காக்கப்படுகிறது.
- source_word: ἐποίει
  choice: செய்துகொண்டிருந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்து அல்லது திரும்பத் திரும்ப நிகழ்ந்த செயலைக் காட்டும் imperfect வடிவத்தின் கூறை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: பவுலின் கைகளின் வழியாக
  rationale: διά + genitive பவுலை இடைநிலைக் கருவியாகக் காட்டுகிறது. ‘கைகள்’ என்ற உருவகமுள்ள மூல மொழிப்பயன்பாட்டையும் இத்தேர்வு காக்கிறது.
- source_word: Παύλου
  choice: பவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: வல்ல செயல்களைச் செய்பவர் யார்?
  choice: தேவனே வல்ல செயல்களைச் செய்கிறார்; பவுலின் கைகள் அவற்றிற்கான இடைநிலைக் கருவியாகக் காட்டப்படுகின்றன.
  alternative: பவுலே தன்னிச்சையாக அற்புதங்களைச் செய்தார்.
  rationale: ὁ θεὸς என்பது ἐποίει என்பதன் இலக்கண எழுவாய்; διὰ τῶν χειρῶν Παύλου என்பது பவுலின் வழியாக நிகழ்ந்த இடைநிலைச் செயற்பாட்டைக் குறிக்கிறது. ஆகவே தேவனின் முதன்மைச் செயற்பாடும் பவுலின் கருவித்தன்மையும் வேறுபடுத்திக் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அற்புதங்கள்’ என்பதற்குப் பதிலாக ‘வல்ல செயல்கள்’ எனத் தேர்ந்தெடுத்து Δυνάμεις என்பதன் வல்லமை சார்ந்த சொல்லியக்கத்தைப் பாதுகாத்துள்ளோம்; அதன் அசாதாரண தன்மை முதன்மை உரையிலும், மூல மரபுத்தொடரின் வடிவம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
