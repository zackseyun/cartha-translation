id: ACT.19.20
reference: Acts 19:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως κατὰ κράτος ⸂τοῦ κυρίου ὁ λόγος⸃ ηὔξανεν καὶ ἴσχυεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: ta
  text: இவ்வாறு ஆண்டவருடைய வார்த்தை வல்லமையோடு வளர்ந்து மேலோங்கிக்கொண்டிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வல்லமையோடு” என்பதற்கு “மிகுந்த ஆற்றலுடன்” என்றும் பொருள் கொள்ளலாம்.
    reason: κατὰ κράτος என்ற கிரேக்கச் சொற்றொடரின் இயல்பான மற்றொரு மொழிபெயர்ப்பைச் சுட்டுகிறது.
lexical_decisions:
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: முந்தைய நிகழ்வுகளின் விளைவைக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்புச் சொல்.
- source_word: κατὰ κράτος
  choice: வல்லமையோடு
  rationale: வலிமைமிக்க செயல்பாடு அல்லது ஆற்றலோடு நிகழ்தல் என்ற கிரேக்கச் சொற்றொடரின் பொருளை இயல்பாகத் தருகிறது; வளர்தல், மேலோங்குதல் ஆகிய இரு வினைகளோடும் பொருந்துகிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவருடைய
  rationale: கிரேக்கத்தில் உள்ள பட்டத்தை நேரடியாகப் பாதுகாக்கிறது; உரையில் இல்லாத ‘இயேசு’ என்ற பெயரைச் சேர்த்து அதன் குறிப்பைத் தீர்மானிக்கவில்லை.
- source_word: ὁ λόγος
  choice: வார்த்தை
  rationale: அப்போஸ்தலர் செயல்களில் மீண்டும் வரும் அறிவிக்கப்பட்ட நற்செய்தியைக் குறிக்கும் வழக்கமான சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: ηὔξανεν
  choice: வளர்ந்து
  rationale: வார்த்தையின் தொடர்ந்து நிகழ்ந்த பரவலையும் வளர்ச்சியையும் குறிக்கிறது; தொடர்நிலையை அடுத்த வினையுடன் சேர்ந்து ‘கொண்டிருந்தது’ வெளிப்படுத்துகிறது.
- source_word: ἴσχυεν
  choice: மேலோங்கிக்கொண்டிருந்தது
  rationale: வலிமைபெற்று விளைவுடன் முன்னேறுதல் என்ற சூழல்சார் பொருளைத் தருகிறது; இறந்தகாலத் தொடர்நிலையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: τοῦ κυρίου என்பதில் ‘ஆண்டவர்’ யாரைக் குறிக்கிறது
  choice: ஆண்டவர்
  alternative: ஆண்டவர் இயேசு
  rationale: சூழல் இயேசுவைக் குறிப்பதாக வலுவாக உணர்த்தினாலும், கிரேக்க உரை ‘ஆண்டவர்’ என்று மட்டுமே கூறுகிறது. எனவே பிரதான உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘கர்த்தர்’ என்பதற்குப் பதிலாக இன்றைய இயல்பான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது; இரண்டு இறந்தகாலத் தொடர்வினைகளின் முன்னேற்றத் தன்மை ‘வளர்ந்து மேலோங்கிக்கொண்டிருந்தது’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
