source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: ta
  text: நம்முடைய இந்தத் தொழில் இழிவுக்குள்ளாகும் ஆபத்து மட்டுமல்ல; மாபெரும் தேவி அர்த்தெமியின் கோவில் ஒன்றுமில்லாததாகக் கருதப்படும் ஆபத்தும், ஆசியா முழுவதும் உலகமெங்கும்[a] வழிபடும் அவளுடைய மகத்துவம்[b] தாழ்த்தப்படும் ஆபத்தும் உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனிதர் குடியிருக்கும் உலகம்.’ கிரேக்கச் சொல் பெரும்பாலும் மக்கள் வாழும் உலகத்தை, குறிப்பாக அக்காலத்தின் பரந்த ரோம உலகத்தை, குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மகத்துவம்’ என்பதற்கு ‘மாட்சிமை’ அல்லது ‘மேன்மை’ என்றும் மொழிபெயர்க்கலாம். இச்சொல் அர்த்தெமிக்குரியதாகக் கருதப்பட்ட உயர்ந்த நிலை அல்லது பெருமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: ஆபத்தில் உள்ளது
  rationale: ஆபத்து அல்லது இழப்பு நேரக்கூடிய நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; வாக்கியத்தின் எச்சரிக்கைத் தொனியையும் காக்கிறது.
- source_word: τὸ μέρος
  choice: இந்தத் தொழில்
  rationale: சூழலில் இது ஒரு பொதுவான ‘பங்கு’ அல்ல, தெமேத்திரியுவும் கைவினைஞர்களும் செய்துவந்த வாழ்வாதாரத் தொழிலைக் குறிக்கிறது.
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: மதிப்பிழக்கும்
  rationale: பழிப்புக்கும் பொதுமதிப்பின் இழப்புக்கும் உள்ளாகும் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἱερὸν
  choice: கோவில்
  rationale: எபேசுவிலிருந்த அர்த்தெமியின் புகழ்பெற்ற புனித வளாகத்தைத் தமிழில் தெளிவாகக் குறிக்கும் வழக்கமான சொல்.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: ஒன்றுமில்லாததாகக் கருதப்படும்
  rationale: எந்த மதிப்பும் இல்லாததாக எண்ணப்படுதல் என்ற கிரேக்கச் சொற்றொடரின் மதிப்பீட்டுப் பொருளை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι
  choice: தாழ்த்தப்படும்
  rationale: வரப்போகும் வீழ்ச்சி அல்லது உயர்ந்த நிலையிலிருந்து கீழிறக்கப்படுதல் என்ற அச்சத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘ஆபத்தும் உள்ளது’ என்பது κινδυνεύει என்பதன் ஆளுகையைத் தொடரச் செய்கிறது.
- source_word: τῆς μεγαλειότητος αὐτῆς
  choice: அவளுடைய மகத்துவமே
  rationale: அர்த்தெமிக்குரியதாகக் கருதப்பட்ட மேன்மை, பெருமை, உயர்ந்த நிலை ஆகியவற்றை உள்ளடக்குகிறது; ‘-ஏ’ வலியுறுத்தல் அதன் இழப்பை முன்னிறுத்துகிறது.
- source_word: ὅλη ἡ Ἀσία
  choice: ஆசியா முழுவதும்
  rationale: இங்கு ‘ஆசியா’ ரோம மாகாணத்தைக் குறிக்கிறது; கிரேக்கத்தின் விரிவான சொல்லாட்சியை இயல்பான தமிழில் காக்கிறது.
- source_word: ἡ οἰκουμένη
  choice: குடியிருக்கும் உலகம் முழுவதும்
  rationale: மனிதர்கள் குடியிருக்கும் உலகம், குறிப்பாக அக்காலத்தின் பரந்த ரோம உலகம் என்ற சொல்லின் நுண்பொருளை உரையிலேயே வெளிப்படுத்துகிறது.
- source_word: σέβεται
  choice: வழிபடும்
  rationale: அர்த்தெமியின் சமய வழிபாட்டுச் சூழலில் வெறும் மரியாதையைவிட வழிபாட்டைக் குறிக்கும் வலிமையானதும் பொருத்தமானதுமான சொல்.
theological_decisions:
- issue: பிறதெய்வ வழிபாட்டைப் பற்றிய பேச்சை மென்மைப்படுத்தாமலும் ஆதரிப்பதாகத் தோன்றாமலும் மொழிபெயர்த்தல்
  choice: மாபெரும் தேவியான அர்த்தெமி ... வழிபடும்
  alternative: மாபெரும் தேவியெனப்படும் அர்த்தெமி ... வணங்கும்
  rationale: இது தெமேத்திரியுவின் நேரடிப் பேச்சாக அறிக்கையிடப்படுகிறது. கிரேக்கத்தில் இல்லாத சந்தேக அல்லது விலகல் குறிப்பைச் சேர்க்காமல் அவனுடைய கண்ணோட்டத்தை அப்படியே காக்கிறது.
- issue: τῆς μεγαλειότητος என்பதற்கும் καθαιρεῖσθαι என்பதற்கும் இடையிலான கடினமான தொடரியல் உறவு
  choice: அவளுடைய மகத்துவமே தாழ்த்தப்படும்
  alternative: அவள் தன் மகத்துவத்தை இழந்துவிடுவாள்
  rationale: மூலத்தில் உள்ள சுருக்கமான, சற்றுக் கடினமான அமைப்பை வாசிக்கத்தக்க தமிழில் தருகிறது; அர்த்தெமியின் மேன்மை அல்லது உயர்ந்த பொதுநிலை குறைக்கப்படும் என்ற பொருளைக் காக்கிறது, ஆனால் எந்த ஒரு விளக்கத்தையும் அளவுக்கு மீறி உறுதிப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. தெமேத்திரியுவின் பொருளாதார அச்சத்திலிருந்து கோவிலின் மதிப்புக்கும் தேவியின் மகத்துவத்திற்கும் நகரும் வாத அமைப்பு தெளிவாக வைக்கப்பட்டுள்ளது. ‘அர்த்தெமி’ என்பது கிரேக்கப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
