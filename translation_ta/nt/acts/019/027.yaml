  rationale: மூலத்தின் இணை அமைப்பைத் தெளிவுபடுத்தி, οἰκουμένη-யின் பொருளைத் தவறாகக் கட்டுப்படுத்திய தொடரியலைச் சரிசெய்துள்ளேன். ஆதாரமற்ற உரைமாறுபாட்டு அடிக்குறிப்பு நீக்கப்பட்டு, audit trail-ல் தரப்பட்ட இரு சொற்பொருள் அடிக்குறிப்புகளும் அவற்றுக்குரிய சொற்களில் மீள்நிறுத்தப்பட்டுள்ளன. புறமதக் கூற்றை விலகல் அல்லது ஒப்புதல் குறிப்புகள் இன்றி, தெமேத்திரியுவின் உரையாகவே மொழிபெயர்ப்பு தருகிறது.
