translation:
  language: ta
  text: அவர்கள் அனைவரும் சேர்ந்து ஏறக்குறைய பன்னிரண்டு ஆண்கள் இருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν
  choice: அவர்கள் … ஆண்கள்
  rationale: கிரேக்கத்தில் உள்ள ‘இருந்தார்கள்’ என்னும் வினையின் கருத்து, தமிழில் எண்ணிக்கையைக் குறிப்பிடும் இயல்பான பெயர்ப் பயனிலை வாக்கியமாக வெளிப்படுகிறது.
- source_word: δὲ
  choice: —
  rationale: இது மென்மையான இணைப்புச்சொல்; இங்கு தெளிவான எதிர்மறையையோ கட்டாயமான தொடர்ச்சியையோ குறிக்காததால் இயல்பான தமிழில் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: οἱ πάντες
  choice: மொத்தம்
  rationale: குழுவிலிருந்த அனைவரையும் சேர்த்த மொத்த எண்ணிக்கையை இயல்பாகக் குறிக்கிறது.
- source_word: ἄνδρες
  choice: ஆண்கள்
  rationale: ἀνήρ இங்கு பொதுவாக மக்களைக் குறிக்காமல் ஆண்களைக் குறிப்பதால் பாலினத் துல்லியம் காக்கப்படுகிறது.
- source_word: ὡσεὶ
  choice: ஏறக்குறைய
  rationale: எண்ணிக்கை துல்லியமானதல்ல, தோராயமானது என்பதைத் தெளிவாகவும் செம்மையாகவும் காட்டுகிறது.
- source_word: δώδεκα
  choice: பன்னிரண்டு
  rationale: மூலத்திலுள்ள எண்ணின் நேரடியான தமிழ் வடிவம்.
