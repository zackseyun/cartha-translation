  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் வகையிலும் மூலத்தின் தோராய எண்ணிக்கையையும் பாலினக் குறிப்பையும் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது.
