  naturalness: “அவர்கள் மொத்தம் ஏறக்குறைய பன்னிரண்டு ஆண்கள்” is understandable, but as a standalone verse it is a compressed nominal construction and can sound incomplete or present-oriented. An explicit past-tense verb makes the sentence natural and clear.
  terminology: “ஆண்கள்” correctly retains the male reference of ἄνδρες. “ஏறக்குறைய” accurately conveys approximation, and “பன்னிரண்டு” is correct. No theological terminology is involved.
