translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தொழில்நுட்பப் பதவிப் பெயரான ‘ஆசியார்க்குகள்’ ஒலிபெயர்ப்பாக வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; கிரேக்கச் சொற்றொடரின் இயல்பற்ற நேர் வடிவத்தை முதன்மை உரையில் திணிக்காமல், அதன் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
