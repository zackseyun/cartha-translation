id: ACT.19.31
reference: Acts 19:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: ta
  text: மேலும், அவருடைய நண்பர்களாக இருந்த ஆசியார்க்குகளில்[a] சிலரும்கூட அவரிடம் செய்தி அனுப்பி[b], அரங்கத்திற்குள் செல்ல வேண்டாம்[c] என்று அவரை வற்புறுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆசியார்க்குகள்” என்பவர்கள் ரோம மாகாணமான ஆசியாவுடன் தொடர்புடைய செல்வாக்குமிக்க அதிகாரிகள்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அவரிடம் ஆளனுப்பி.” கிரேக்க மூலத்தில் எது அனுப்பப்பட்டது என்பது வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: c
    text: 'அல்லது, “அரங்கத்தில் தன்னை முன்னிறுத்த வேண்டாம்.” சொல்லுக்குச் சொல்: “தன்னை அரங்கத்திற்குள் கொடுக்க வேண்டாம்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: மேலும், … சிலரும்கூட
  rationale: δὲ கதையின் தொடர்ச்சியை மென்மையாகக் குறிக்கிறது; καὶ இங்கு எதிர்பாராத சேர்க்கையை வலியுறுத்துவதால் ‘சிலரும்கூட’ இயல்பாக அந்த நுணுக்கத்தைத் தருகிறது.
- source_word: τῶν Ἀσιαρχῶν
  choice: ஆசியார்க்குகளில்
  rationale: Ἀσιάρχης என்பது ரோம மாகாணமான ஆசியாவுடன் தொடர்புடைய ஒரு குறிப்பிட்ட பதவிப் பெயர். பொதுவான ‘அதிகாரிகள்’ என்று தளர்த்தாமல் ஒலிபெயர்த்து, விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: ὄντες αὐτῷ φίλοι
  choice: அவருடைய நண்பர்களாக இருந்த
  rationale: பின்னணித் தகவலைத் தரும் பங்கேற்புவினைத் தொடரையும் φίλοι என்பதன் உறவுசார் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: அவரிடம் செய்தி அனுப்பி
  rationale: அனுப்பப்பட்ட பொருள் கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் தூதர் அல்லது செய்தி அனுப்புதல் பொருந்துவதால், தமிழில் தேவையான மறைபொருளை ‘செய்தி’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παρεκάλουν
  choice: வற்புறுத்தினார்கள்
  rationale: παρακαλέω இங்கு தீவிரமான வேண்டுகோள் அல்லது வலியுறுத்தலைக் குறிக்கிறது. இறந்தகால முற்றாத வினையின் தொடர்ச்சித் தன்மையை அளவுக்கு மீறாமல், தமிழில் வலுவான வேண்டுகோளாகக் காட்டுகிறது.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: அரங்கத்திற்குள் செல்ல வேண்டாம்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘தன்னை அரங்கத்திற்குள் கொடுக்க வேண்டாம்’ என்றாலும், சூழலில் ஆபத்தான கூட்டத்தின் நடுவே தானாகச் சென்று நிற்காதிருப்பதே பொருள். ‘செல்ல வேண்டாம்’ என்பது தெளிவான, இயல்பான தமிழ்; மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
