base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: ta
  text: யூதரான ஒரு தலைமை ஆசாரியரான ஸ்கேவா என்பவருக்கு ஏழு மகன்கள் இருந்தார்கள்; அவர்கள் இதைச் செய்துகொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிரதான ஆசாரியர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஒரே பிரதான ஆசாரியரைக் குறிக்கலாம்; அல்லது பரந்த பொருளில் தலைமை அல்லது உயர்நிலை ஆசாரியரைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: இருந்தார்கள் / வாக்கிய அமைப்பில் இயல்பாக உட்பொருத்தப்பட்டது
  rationale: இறந்தகாலத்தில் நிலவிய சூழலைக் காட்டும் imperfect வடிவத்தையும், மென்மையான கதைத் தொடர்ச்சியைக் காட்டும் δέ-யையும் தமிழில் இயல்பான வாக்கிய அமைப்பால் வெளிப்படுத்துகிறது; வலுவான எதிர்மறை இணைப்பைச் சேர்க்கவில்லை.
- source_word: τινος Σκευᾶ
  choice: ஸ்கேவா என்பவரின்
  rationale: τινος தரும் குறிப்பிடப்படாத தன்மையை ‘என்பவர்’ என்ற இயல்பான தமிழால் வெளிப்படுத்தி, பெயரையும் உரிமைத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: Ἰουδαίου
  choice: யூத
  rationale: இங்கு புவியியல் சார்ந்த ‘யூதேயர்’ என்பதைக் காட்டிலும் இன-சமய அடையாளமே பொருத்தமானது.
- source_word: ἀρχιερέως
  choice: தலைமை ஆசாரியர்
  rationale: தனிப்பட்ட ஒரே பிரதான ஆசாரியர் என்ற பதவியை அவசியமாகக் குறிக்காமல், உயர்நிலை ஆசாரியர் அல்லது தலைமைக் குருத்துவப் பிரிவைச் சேர்ந்தவர் என்ற பரந்த சாத்தியத்தைத் தக்கவைக்கிறது.
- source_word: ἑπτὰ υἱοὶ
  choice: மகன்கள் ஏழுபேரும்
  rationale: எண்ணையும் குடும்ப உறவையும் இயல்பான தமிழ் சொல் வரிசையில் தருகிறது; இச்சூழலில் குறிப்பிடப்பட்ட ஏழு மகன்களையும் குறிக்க ‘ஏழுபேரும்’ இயல்பானது.
- source_word: τοῦτο ποιοῦντες
  choice: இப்படிச் செய்துவந்தார்கள்
  rationale: முந்தைய சூழலில் சொல்லப்பட்ட அதே செயலைக் குறிக்கும் ஒருமைச் சுட்டையும், தொடர்ந்து செய்யப்பட்ட செயலை உணர்த்தும் நிகழ்காலப் பங்கேற்பு வடிவத்தையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஸ்கேவாவைக் குறிக்கும் ἀρχιερεύς என்பதன் பொருள்
  choice: தலைமை ஆசாரியர்
  alternative: பிரதான ஆசாரியர்
  rationale: கிரேக்கச் சொல் ஒரே அதிகாரப்பூர்வ பிரதான ஆசாரியரையும், பரந்த பொருளில் உயர்நிலை அல்லது தலைமை ஆசாரியரையும் குறிக்கலாம். ஸ்கேவா அந்த ஒரே பதவியை வகித்தார் என்று வேறு சான்று இல்லாததால், ‘தலைமை ஆசாரியர்’ தேவையற்ற வரலாற்றுக் கூற்றைத் தவிர்த்து மூலத்தின் பொருள் வரம்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க வேதாகம நடையிலும் அமைக்கப்பட்டது. ‘இப்படிச் செய்துவந்தார்கள்’ என்பது முந்தைய வசனச் செயலைச் சுட்டுவதோடு தொடர்ச்சியான செயல் நுணுக்கத்தையும் தருகிறது.
