source:
  edition: SBLGNT
  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நீங்கள் விசுவாசித்தபோது[a] பரிசுத்த ஆவியைப் பெற்றீர்களா?” என்று கூறினார். அதற்கு அவர்கள், “இல்லை[b]; பரிசுத்த ஆவி இருக்கிறார் என்பதைக்கூட நாங்கள் கேள்விப்பட்டதில்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீங்கள் விசுவாசித்த பிறகு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பங்கேற்புவினை காலத் தொடர்பில் சிறிய பொருள் வேறுபாட்டுக்கு இடமளிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பரிசுத்த ஆவி இருக்கிறாரா என்பதைக்கூட நாங்கள் கேள்விப்பட்டதில்லை’ என்றும், கூடுதல் விளக்கத்துடன் ‘பரிசுத்த ஆவி அளிக்கப்பட்டிருக்கிறார் என்பதைக்கூட நாங்கள் கேள்விப்பட்டதில்லை’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: அவர் அவர்களிடம் ... என்று கேட்டார்
  rationale: τέ முந்தைய நிகழ்வுடன் மென்மையாக இணைக்கிறது; தமிழில் தனியாக இணைப்புச்சொல் சேர்க்காமலேயே தொடர்ச்சி இயல்பாக வெளிப்படுகிறது. கேள்வி உரையாதலால் λέγω இங்கு இயல்பான தமிழில் ‘கேட்டார்’ என வழங்கப்பட்டுள்ளது.
- source_word: Εἰ ... ἐλάβετε πιστεύσαντες
  choice: நீங்கள் விசுவாசித்தபோது ... பெற்றீர்களா?
  rationale: πιστεύσαντες என்னும் இறந்தகாலப் பங்கேற்புவினை, ἐλάβετε உடன் காலத் தொடர்பைக் காட்டுகிறது. ‘விசுவாசித்தபோது’ என்பது ‘விசுவாசித்த பிறகு’ என்ற கண்டிப்பான வரிசையையோ, அதே கணத்தில் என்ற கருத்தையோ திணிக்காமல் கிரேக்கத்தின் நெகிழ்வைப் பாதுகாக்கிறது.
- source_word: πνεῦμα ἅγιον
  choice: பரிசுத்த ஆவி
  rationale: இச்சூழலில் இது பொதுவான ஒரு பரிசுத்த ஆவியைக் குறிக்காமல், கடவுளுடைய பரிசுத்த ஆவியைக் குறிக்கிறது. ‘பரிசுத்த ஆவி’ என்பது நவீனத் தமிழில் தெளிவானதும் மரியாதைக்குரியதும் ஆகும்.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: அதற்கு அவர்கள் ... என்றார்கள்
  rationale: δέ உரையாடலின் பதிலை மென்மையாக முன்னெடுக்கிறது. ‘அதற்கு’ என்பது அந்தத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἀλλ’ οὐδ’
  choice: இல்லை; ... என்பதைக்கூட
  rationale: Ἀλλ’ οὐδ’ வலியுறுத்தப்பட்ட மறுப்பைக் காட்டுகிறது. ‘இல்லை’ என்ற நேரடியான பதிலும் ‘என்பதைக்கூட’ என்ற வலியுறுத்தலும் அதன் force-ஐ இயல்பாகத் தருகின்றன.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: பரிசுத்த ஆவி இருக்கிறார் என்பதைக்கூட நாங்கள் கேள்விப்பட்டதில்லை
  rationale: οὐδὲ εἰ என்பது ‘... என்று கூட’ அல்லது ‘... இருக்கிறாரா என்பதைக்கூட’ எனப் புரிந்துகொள்ளப்படலாம். முதன்மை உரை நேரடியான பொருளைப் பின்பற்றி, கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘அருளப்பட்டார்’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: விசுவாசிப்பதற்கும் பரிசுத்த ஆவியைப் பெறுவதற்கும் இடையிலான காலத் தொடர்பு
  choice: ‘விசுவாசித்தபோது’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘விசுவாசித்த பிறகு’ அல்லது ‘விசுவாசித்தவுடன்’
  rationale: πιστεύσαντες காலத் தொடர்பைக் காட்டினாலும், அடுத்தடுத்த நிகழ்வு அல்லது உடன்நிகழ்வு குறித்த விரிவான இறையியல் முடிவைத் தானாக நிர்ணயிப்பதில்லை. தேர்ந்தெடுத்த சொற்றொடர் அந்தத் தெளிவின்மையையும் இறையியல் இழுபறியையும் பாதுகாக்கிறது.
- issue: பரிசுத்த ஆவியைப் பற்றிய சீடர்களின் அறியாமையின் பொருள்
  choice: ‘பரிசுத்த ஆவி இருக்கிறார் என்பதைக்கூட ... கேள்விப்பட்டதில்லை’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘பரிசுத்த ஆவி இருக்கிறாரா என்பதைக்கூட’ அல்லது ‘பரிசுத்த ஆவி அருளப்பட்டிருக்கிறார் என்பதைக்கூட’
  rationale: கிரேக்க வாசகம் சுருக்கமானதும் ஒன்றுக்கு மேற்பட்ட நுண்பொருளுக்கு இடமளிப்பதும் ஆகும். முதன்மை உரை அதன் நேரடியான பொருளைப் பின்பற்றுகிறது; வெளிப்படையாக இல்லாத ‘அருளப்பட்டார்’ என்ற விளக்கத்தை அடிப்படை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘விசுவாசித்தபோது’ என்பது காலத் தொடர்பை இயல்பாகச் சொல்லி, குறிப்பிட்ட சமயப்பிரிவின் கருத்தைத் திணிக்காது. ‘கேள்விப்பட்டதில்லை’ என்பது ἠκούσαμεν என்பதன் இயல்பான தமிழ் வெளிப்பாடு.
