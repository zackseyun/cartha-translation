source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: ta
  text: அப்பொல்லோ கொரிந்துவில் இருந்தபோது, பவுல் உள்நாட்டுப் பகுதிகள்[a] வழியாகச் சென்று எபேசுவுக்கு வந்து சில சீடர்களைக்[b] கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேற்பகுதிகள்,’ ‘மேட்டு நிலப்பகுதிகள்’ அல்லது ‘உட்பகுதிகள்’ என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் கடற்கரைப் பாதைக்குப் பதிலாக உயரமான உள்நாட்டுப் பகுதிகள் வழியாகச் சென்ற பாதையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே ‘சீடர்கள்’ யாருடைய சீடர்கள் என்பது குறிப்பிடப்படவில்லை. அடுத்த வசனங்கள் அவர்கள் யோவானின் திருமுழுக்குடன் தொடர்புடையவர்கள் என்பதைக் காட்டுகின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: இது நிகழ்ந்தது
  rationale: லூக்காவின் கதை நகர்த்தும் இடைமாற்றுச் சொல்லை இயல்பான தமிழில் தருகிறது. δέ-யின் இணைப்புச் செயல்பாடு முந்தைய காலவாக்கியத்தின் ஓட்டத்தில் வெளிப்படுவதால், மூலத்தில் இல்லாத தனிப்பட்ட ‘இப்போது’ என்ற காலச்சொல் சேர்க்கப்படவில்லை.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: அப்பொல்லோ கொரிந்துவில் இருந்தபோது
  rationale: ἐν τῷ உடன் வரும் infinitive அமைப்பு ஒரே காலத்தில் நிகழ்வதைக் குறிக்கிறது; ‘இருந்தபோது’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: உள்நாட்டுப் பகுதிகள் வழியாகச் சென்று
  rationale: ἀνωτερικά என்பதன் அடிப்படைப் பொருள் ‘மேலான/உயரமான’ என்றாலும், இச்சூழலில் கடற்கரைப் பாதைக்கு மாறான உள்நாட்டு அல்லது மேட்டு நிலப்பாதையைக் குறிக்கிறது. ‘வழியாகச் சென்று’ என்பது διέρχομαι-வின் ஓர் இடத்தைக் கடந்து செல்லும் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: எபேசுவுக்கு வந்தார்
  rationale: எபேசுவை நோக்கிய இயக்கத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: καὶ εὑρεῖν τινας μαθητάς
  choice: அங்கே சில சீடர்களைக் கண்டார்
  rationale: τινας என்பதற்கு ‘சில’; μαθητάς என்பதற்கு புதிய ஏற்பாட்டின் வழக்கமான ‘சீடர்கள்’ பயன்படுத்தப்பட்டுள்ளன. தமிழில் இடமாற்றத்துக்குப் பிந்தைய செயலைத் தெளிவாக இணைக்க ‘அங்கே’ சேர்க்கப்பட்டுள்ளது; இது பொருளை மாற்றாது.
theological_decisions:
- issue: μαθητάς எனப்படுவோரின் அடையாளம்
  choice: முதன்மை உரையில் பொதுவாக ‘சில சீடர்கள்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘யோவானின் சீடர்கள் சிலர்’ அல்லது ‘இயேசுவின் சீடர்கள் சிலர்’
  rationale: கிரேக்க உரை இவர்களின் தொடர்பை இவ்வசனத்தில் குறிப்பிடவில்லை. அடுத்த வசனங்களே யோவானின் திருமுழுக்குடனான அவர்களுடைய தொடர்பை விளக்குகின்றன; ஆகவே அந்த அடையாளத்தை முன்கூட்டியே உரைக்குள் சேர்க்காமல், மூலத்தின் தெளிவின்மையும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட infinitive அமைப்பு தமிழின் இயல்புக்கேற்ப இரு தொடர்ச்சியான வினைச்செயல்களாக அமைக்கப்பட்டுள்ளது. [a] குறிப்பு அது விளக்கும் ‘உள்நாட்டுப் பகுதிகள்’ என்பதற்குப் பின்னும், [b] ‘சீடர்கள்’ என்பதற்குப் பின்னும் வைக்கப்பட்டுள்ளது.
