- source_word: τὸ ὄνομα
  choice: பெயர்
  rationale: ‘நற்பெயர்’ அல்லது ‘புகழ்’ என்று குறுக்காமல், மூலத்தின் ‘பெயர்’ என்ற சொல்லையும் அதன் வேதாகமச் சார்ந்த அதிகாரம், மதிப்பு போன்ற விரிவான ஒலிப்புகளையும் காக்கிறது.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ஆண்டவராகிய இயேசுவின்
  rationale: κύριος என்பதை கிறிஸ்துவுக்குரிய பட்டமாக ‘ஆண்டவர்’ என்று மொழிபெயர்க்கிறது; தமிழில் இயல்பான உடைமைத் தொடருக்காக ‘ஆண்டவராகிய இயேசுவின்’ என அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு κύριος என்பது வெறும் மனித எஜமானைக் குறிப்பதல்ல; இயேசுவுக்குரிய கிறிஸ்தவப் பட்டமாகச் செயல்படுகிறது. ‘ஆண்டவர்’ அந்தப் பட்டத்தையும் அதன் வேதாகம ஒலிப்பையும் காக்கிறது.
- issue: τὸ ὄνομα என்பதை ‘பெயர்’ என்றே வைப்பதா அல்லது ‘நற்பெயர்/புகழ்’ என்று பொருளாக்குவதா
  choice: ஆண்டவராகிய இயேசுவின் பெயர் மேன்மைப்படுத்தப்பட்டு வந்தது
  alternative: ஆண்டவராகிய இயேசுவின் புகழ் உயர்ந்து வந்தது
  rationale: ‘பெயர்’ என்பது இயேசுவின் நற்பெயரை மட்டும் அல்லாமல் அவரது நபர், அதிகாரம், மாண்பு ஆகியவற்றையும் தாங்கக்கூடியது. ஆகவே மூலத்தின் இறையியல் மற்றும் இலக்கிய நெருக்கத்தைப் பாதுகாக்கிறது.
- issue: φόβος என்பதில் சாதாரண பயமா அல்லது பயபக்தியா
  choice: பயம்
  alternative: பயபக்தி
  rationale: சூழலில் அச்சமும் வியப்பும் கலந்திருக்கலாம்; ஆனால் கிரேக்கச் சொல் அதை ‘பயபக்தி’ என்று மட்டும் வரையறுக்கவில்லை. ‘பயம்’ மூலத்தின் திறந்த நிழற்பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தெரியவந்தது’, ‘ஆட்கொண்டது’ ஆகியவை இயல்பான தமிழை வழங்குகின்றன; ‘பெயர்’, ‘ஆண்டவர்’, ‘மேன்மைப்படுத்தப்பட்டு வந்தது’ ஆகியவை மூலத்தின் வேதாகம மற்றும் இறையியல் ஒலிப்பைத் தக்கவைக்கின்றன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் சார்ந்த சொற்றொடர்களுக்குப் பின் இல்லாததால், தமிழில் [a] பயம் குறித்த மாற்றுக்குப் பின்னும் [b] பெயர் மேன்மைப்படுத்தப்பட்டது குறித்த மாற்றுக்குப் பின்னும் பொருத்தப்பட்டுள்ளன.
