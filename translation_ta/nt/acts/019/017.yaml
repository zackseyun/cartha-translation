  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: ta
  text: இந்த நிகழ்ச்சி எபேசுவில் வாழ்ந்த யூதர்கள், கிரேக்கர்கள் அனைவருக்கும் தெரியவந்தது. அவர்கள் அனைவரையும் பயம் ஆட்கொண்டது[a]; ஆண்டவராகிய இயேசுவின் பெயர் மேன்மைப்படுத்தப்பட்டு வந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அனைவர்மேலும் பயம் வந்தது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆண்டவராகிய இயேசுவின் பெயர் உயர்த்தப்பட்டது” அல்லது “மிகுந்த மதிப்புடன் போற்றப்பட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: இந்த நிகழ்ச்சி
