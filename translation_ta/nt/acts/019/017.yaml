- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: அவர்கள் அனைவரையும் பயம் ஆட்கொண்டது
  rationale: கிரேக்க மொழியின் ‘பயம் அவர்கள்மேல் விழுந்தது’ என்ற உயிரோட்டமுள்ள சொல்லாட்சியின் விளைவை, தமிழில் இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது.
- source_word: φόβος
  choice: பயம்
  rationale: இச்சொல் பயம், அச்சம், பிரமிப்புடன் கூடிய பயபக்தி ஆகிய நிழற்பொருள்களைக் கொள்ளலாம். ‘பயம்’ என்பது அவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாத பரந்த தேர்வு.
- source_word: ἐμεγαλύνετο
