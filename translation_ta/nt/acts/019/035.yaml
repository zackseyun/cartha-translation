id: ACT.19.35
reference: Acts 19:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: ta
  text: நகரச் செயலர் கூட்டத்தை அமைதிப்படுத்தி, “எபேசு ஆண்களே, எபேசியரின் நகரம் மாபெரும் அர்த்தெமியின் ஆலயத்திற்கும் வானிலிருந்து விழுந்ததாக நம்பப்படும் பொருளுக்கும் ஆலயப் பாதுகாவலராக விளங்குகிறது என்பதை அறியாத மனிதர் யார்?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταστείλας
  choice: அமைதிப்படுத்திய பின்பு
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது; தமிழில் இயல்பாக அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: ὁ γραμματεὺς
  choice: நகரச் செயலர்
  rationale: இங்கு யூத மறைநூல் அறிஞர் அல்ல, எபேசின் நகராட்சி அதிகாரி குறிக்கப்படுகிறார்.
- source_word: τὸν ὄχλον
  choice: கூட்டத்தை
  rationale: கலவரமடைந்த பொதுமக்கள் திரளை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: எபேசு நகர மக்களே
  rationale: நகர மக்களிடம் நிகழ்த்தப்படும் மரியாதையான பொது அழைப்பை இயல்பான தமிழில் தருகிறது; கிரேக்க ஆண்பால் வடிவை மரியாதைப் பன்மைச் சூழலில் கடினமாக மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: அறியாத மனிதன் யார்?
  rationale: எல்லாரும் அறிவர் என்ற கருத்துடைய வினாவடிவின் ஒருமை வலிமையைப் பாதுகாக்கிறது.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: எபேசியரின் நகரம்
  rationale: கிரேக்க உரையின் உடைமைத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: νεωκόρον
  choice: ஆலயக் காவலராக
  rationale: ஒரு கோவில் அல்லது வழிபாட்டு மரபின் அங்கீகரிக்கப்பட்ட பாதுகாவலாக விளங்கும் நகரைக் குறிக்கும் குடிமை-சமயப் பட்டத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: மாபெரும் அர்த்தெமியின்
  rationale: எபேசிய வழிபாட்டில் பயன்படுத்தப்பட்ட பெருமைப்பட்டத்தை இயல்பாகத் தருகிறது.
- source_word: τοῦ διοπετοῦς
  choice: வானிலிருந்து விழுந்த திருவுருவத்தின்
  rationale: வானிலிருந்து விழுந்ததாக நம்பப்பட்ட பொருளைக் குறிக்கிறது; சூழலில் அது அர்த்தெமியுடன் தொடர்புடைய வழிபாட்டு உருவமாக இருக்க வாய்ப்புள்ளதால் ‘திருவுருவம்’ எனத் தெளிவாக்கப்படுகிறது.
theological_decisions:
- issue: அர்த்தெமி மற்றும் வானிலிருந்து விழுந்த பொருளைப் பற்றிய புறசமயக் கூற்று
  choice: பேச்சாளர் முன்வைக்கும் குடிமை-சமயப் பெருமைக் கூற்றாக நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘வானிலிருந்து விழுந்த பொருள்’ அல்லது ‘வானிலிருந்து விழுந்த புனிதக் கல்’
  rationale: இது உரையாற்றுபவரின் கூற்றே தவிர உரையாசிரியரின் உண்மை உறுதிப்பாடு அல்ல. ‘திருவுருவம்’ சூழலின் சாத்தியமான குறிப்பைத் தெளிவாக்கினாலும், அடிக்குறிப்பு மூலச்சொல்லின் பொதுவான தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் மரியாதையான, கண்ணியமான நடை. நகராட்சி மற்றும் புறசமயச் சூழல் தெளிவாக வைக்கப்பட்டுள்ளது; பேச்சாளரின் கூற்று மொழிபெயர்ப்பாளரால் உறுதிப்படுத்தப்படவில்லை.
