id: ACT.19.40
reference: Acts 19:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: ta
  text: ஏனெனில், இன்றைய நிகழ்வுகள் தொடர்பாக நம்மீது கலவரத்தை ஏற்படுத்தியதாகக் குற்றம் சாட்டப்படும் ஆபத்து இருக்கிறது[a]. இந்தக் குழப்பமான கூடுகையைப் பற்றி நாம் கணக்குக் கொடுக்கக்கூடிய எந்தக் காரணமும் இல்லாததால் அப்படியாகும்[b]. இவற்றைச் சொன்னபின், அவர் அவையைக் கலைத்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிளர்ச்சி செய்ததாக’ அல்லது ‘அரசுக்கு எதிராகக் கலகம் செய்ததாக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் தீவிரமான குடிமைக் கிளர்ச்சியைக் குறிக்கக்கூடும்; இங்கு பொதுமக்களின் அமளிச் சூழலில் ‘கலவரம்’ பொருத்தமாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘இந்தக் குழப்பத்தைப் பற்றி’ அல்லது ‘இந்தக் கும்பலைப் பற்றி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அமளியுடன் திரண்ட கூட்டத்தைக் குறிக்கிறது; பின்னர் வரும் முறையான ‘அவை’ என்பதிலிருந்து இது வேறுபட்டது.
    reason: lexical_alternative
  - marker: c
    text: ‘அவை’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல்லே வேறு இடங்களில் பெரும்பாலும் ‘திருச்சபை’ என்று மொழிபெயர்க்கப்படுகிறது. ஆனால் இங்கு அது எபேசுவில் கூடியிருந்த குடிமக்கள் கூட்டத்தைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: ஆபத்து இருக்கிறது
  rationale: நிகழ்காலத்தில் நிலவும் அபாயத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐγκαλεῖσθαι
  choice: நம்மீது ... குற்றம் சாட்டப்படும்
  rationale: சொல்லின் சட்ட மற்றும் நீதித்துறை சார்ந்த வலிமையைச் சூழலுக்கு ஏற்றவாறு காக்கிறது.
- source_word: στάσεως
  choice: கலவரக் குற்றம்
  rationale: ரோம ஆட்சியின் பொது ஒழுங்கை மீறும் தீவிரமான குழப்பத்தைக் குறிக்கிறது; அதேவேளையில் ‘கிளர்ச்சி’ என அரசியல் நோக்கத்தை மிகைப்படுத்தவில்லை.
- source_word: περὶ τῆς σήμερον
  choice: இன்று நடந்தது தொடர்பாக
  rationale: சுருக்கமான கிரேக்கத் தொடரின் பொருளைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: அதற்கு எந்த நியாயமான காரணமும் இல்லை
  rationale: கூட்டத்துக்கு சட்டப்படி ஏற்கத்தக்க ஆதாரம் இல்லை என்ற பொருளை வெளிப்படுத்துகிறது; ‘நியாயமான’ என்பது αἴτιον என்பதன் சட்டச் சூழலைத் தெளிவாக்குகிறது.
- source_word: ἀποδοῦναι λόγον
  choice: கணக்குக் கொடுக்க
  rationale: ஒரு சம்பவத்துக்குப் பதில் சொல்லுதல் அல்லது விளக்கம் அளித்தல் என்ற வழக்குச் சொல்லின் முறையான வலிமையைப் பாதுகாக்கிறது.
- source_word: συστροφῆς
  choice: இந்தக் குழப்பம்
  rationale: குழப்பத்துடன் திரண்ட கூட்டத்தைக் குறிக்கும் சொல்லை இயல்பாகத் தருகிறது; பின்னர் வரும் முறையான ‘அவை’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: ἐκκλησίαν
  choice: அவை
  rationale: இங்கு கிறிஸ்தவத் திருச்சபையைக் குறிக்காமல் எபேசுவின் குடிமக்கள் கூட்டத்தைக் குறிக்கும் முறையான பொதுச் சொல்லாக அமைகிறது.
- source_word: ἀπέλυσεν
  choice: கலைத்தார்
  rationale: ஒரு பொதுக் கூட்டத்தை முடித்து அனுப்பிய செயலைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: καὶ γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பை இயல்பான தமிழில் காக்கிறது; கிரேக்கத்தின் வலியுறுத்தல் வாக்கியத்தின் எச்சரிக்கைத் தொனியில் வெளிப்படுகிறது.
