translation_notes:
  register: நவீன நிலையான தமிழில், ஆளுநரிடம் பேசும் நீதிமன்ற மரியாதையை வெளிப்படுத்த ‘தாங்கள்’ என்ற உயர்வு ஒருமை பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் பணிவான முறையீட்டின் தொனியைக் காக்கிறது; ἐπιείκεια என்பதிலுள்ள நீதித்துறை சார்ந்த தயவு மற்றும் பொதுவான கனிவு இரண்டையும் முதன்மை உரையும் அடிக்குறிப்பும் சேர்ந்து பாதுகாக்கின்றன.
