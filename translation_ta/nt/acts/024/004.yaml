id: ACT.24.4
reference: Acts 24:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ ἐπὶ πλεῖόν σε ἐγκόπτω, παρακαλῶ ἀκοῦσαί σε ἡμῶν συντόμως τῇ σῇ ἐπιεικείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: ta
  text: ஆனால், தங்களை இதற்கு மேலும் தாமதப்படுத்தாமல், தங்கள் கனிவினால் எங்களைச் சுருக்கமாகக் கேட்கும்படி வேண்டிக்கொள்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: ஆனால், ... எடுத்துக்கொள்ளாமல்
  rationale: δὲ குறிக்கும் மென்மையான எதிர்மாற்றத்தையும், ἵνα μή குறிக்கும் எதிர்மறை நோக்கத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ πλεῖόν
  choice: இதற்கு மேலும்
  rationale: ‘மேலும், இன்னும் நீண்ட நேரம்’ என்ற தொடர்ச்சிப் பொருளைச் சுருக்கமாகக் காக்கிறது.
- source_word: σε ἐγκόπτω
  choice: தங்களின் நேரத்தை ... எடுத்துக்கொள்ளாமல்
  rationale: ἐγκόπτω என்பதன் ‘தடைசெய்தல்/தாமதப்படுத்துதல்/பிடித்துவைத்தல்’ என்ற பொருள், ஆளுநரின் நேரத்தை அதிகமாக எடுத்துக்கொள்ளாதிருப்பது என்ற இந்த நீதிமன்றச் சூழலில் இயல்பாக வெளிப்படுகிறது.
- source_word: παρακαλῶ
  choice: வேண்டிக்கொள்கிறேன்
  rationale: மரியாதையுடனான வலுவான வேண்டுகோளை வெளிப்படுத்துகிறது; வெறும் ‘கேட்கிறேன்’ என்பதைவிட மூலத்தின் பணிவான தொனியை நன்றாகக் காக்கிறது.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: நாங்கள் ... சொல்வதைக் கேட்குமாறு தங்களை
  rationale: ‘எங்களைக் கேட்க’ என்ற நேரடிப் பொருளைத் தமிழில் தெளிவாகவும் சட்ட விசாரணைச் சூழலுக்கு ஏற்றவாறும் தருகிறது.
- source_word: συντόμως
  choice: சுருக்கமாகச் சொல்வதை
  rationale: சொல்லப்படும் உரையின் சுருக்கத்தைக் குறிக்கும் இயல்பான தமிழ் அமைப்பு; கிரேக்கத்தில் இது கேட்பதின் குறுகிய நேரத்தையும் உணர்த்தக்கூடும்.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: தங்களுடைய கனிவினால்
  rationale: ἐπιείκεια என்பதிலுள்ள கனிவு, மென்மை, நியாயமான தளர்வு ஆகிய பரப்பை, ஆட்சியாளரிடம் செய்யப்படும் பணிவான விண்ணப்பத்துக்கு ஏற்ற பொதுத் தமிழில் தருகிறது.
