source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: ta
  text: 'ஆனால், உம்மிடம் இதை ஒப்புக்கொள்கிறேன்: அவர்கள் பிரிவு[a] என்று அழைக்கிற அந்த வழியின்படி, அவ்வாறே எங்கள் முன்னோர்களின் கடவுளை[b] நான் வழிபடுகிறேன்; திருச்சட்டத்திலும் இறைவாக்கினர்களின் நூல்களிலும் எழுதப்பட்டுள்ள அனைத்தையும் நம்புகிறேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கட்சி’ என்றும் மொழிபெயர்க்கலாம். αἵρεσις என்ற கிரேக்கச் சொல் ஒரு குழுவையோ பிரிவையோ குறிக்கலாம்; பிற்காலத்தில் உருவான ‘மதப்புரட்டு’ என்ற பொருள் இங்கு தவறாக வழிநடத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொல்லுக்கு நெருக்கமாக ‘முன்னோர் சார்ந்த கடவுள்’; இஸ்ரவேலின் முன்னோர்கள் வழிபட்ட கடவுளையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: ஒப்புக்கொள்கிறேன்
  rationale: பெலிக்ஸின் முன்னிலையில் பவுல் வெளிப்படையாக ஏற்றுரைப்பதைக் காட்டுகிறது; குற்றத்தை ஒப்புக்கொள்வதாகத் தேவையின்றி உணர்த்தாமல், நீதிமன்றச் சூழலின் முறையான தொனியையும் காக்கிறது.
- source_word: κατὰ τὴν ὁδόν
  choice: அந்த வழியின்படியே
  rationale: அப்போஸ்தலர் பணிகளில் தொடக்ககால இயேசு இயக்கத்திற்கான பெயராக வரும் ‘வழி’ என்பதைப் பாதுகாக்கிறது; κατά தரும் இணக்கம் அல்லது பின்பற்றுதலை ‘இன்படியே’ தெரிவிக்கிறது.
- source_word: αἵρεσιν
  choice: ஒரு பிரிவு
  rationale: இச்சூழலில் எதிரிகள் ஒரு குழுவையோ கட்சியையோ குறிக்கும் சொல்லாகப் பயன்படுத்துகின்றனர்; பிற்காலத் தொழில்நுட்பப் பொருளான ‘மதப்புரட்டு’ என்பதைத் தவிர்க்கிறது.
- source_word: οὕτως λατρεύω
  choice: அந்த வழியின்படியே ... வழிபடுகிறேன்
  rationale: οὕτως முந்தைய ‘வழியின்படி’ என்பதோடு வழிபாட்டின் முறையை இணைக்கிறது; தமிழில் அதே பொருளை இயல்பாக ஒருங்கிணைக்கிறது.
- source_word: τῷ πατρῴῳ θεῷ
  choice: நம் முன்னோர்களின் கடவுளை
  rationale: சொல்லின் நேரடியான ‘முன்னோர் சார்ந்த கடவுள்’ என்ற கருத்தை, இஸ்ரவேலின் முன்னோர்கள் வழிபட்ட அதே கடவுள் என்ற சமூகப் பொருளுடன் இயல்பான தமிழில் தருகிறது.
- source_word: πιστεύων πᾶσι τοῖς ... γεγραμμένοις
  choice: எழுதப்பட்டுள்ள அனைத்தையும் நம்புகிறேன்
  rationale: நிலைத்தெழுதப்பட்டுள்ள முழுத் தொகுப்பையும் நம்புதல் என்ற நிகழ்காலப் பங்கேற்புச் சொல்லின் கருத்தை இயல்பான தமிழ் வாக்கியமாக்குகிறது.
- source_word: κατὰ τὸν νόμον
  choice: திருச்சட்டத்தில்
  rationale: யூத மறைநூல் தொகுப்பின் ‘சட்டம்’ என்னும் பகுதியைக் குறிக்கிறது; பொதுத் தமிழ் வாசகருக்குத் தெளிவாக ‘திருச்சட்டம்’ பயன்படுத்தப்படுகிறது.
- source_word: τοῖς ἐν τοῖς προφήταις γεγραμμένοις
  choice: இறைவாக்கினர்களின் நூல்களில் எழுதப்பட்டுள்ள
  rationale: ‘இறைவாக்கினர்கள்’ என்னும் யூத மறைநூல் பிரிவில் உள்ள எழுத்துகளைக் குறிக்கிறது; மனிதர்களில் மட்டும் எழுதப்பட்டதாகத் தோன்றாமல் ‘நூல்களில்’ என்பது வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: யூத நம்பிக்கைக்கும் ‘வழி’ எனப்பட்ட இயேசு இயக்கத்திற்கும் பவுல் காட்டும் உறவு
  choice: ‘அந்த வழியின்படியே’ இஸ்ரவேலின் முன்னோர்களின் கடவுளை வழிபட்டு, திருச்சட்டத்தையும் இறைவாக்கினர் நூல்களையும் நம்புவதாகப் பவுல் கூறுகிறார்.
  alternative: கிறிஸ்தவம் யூத மதத்திலிருந்து முற்றிலும் பிரிந்த வேறு மதம் எனப் பவுல் இங்கு கூறுகிறார்.
  rationale: கிரேக்க உரை ‘வழி’யின்படி வழிபடுவதையும் முன்னோர்களின் கடவுளையும் யூத மறைநூல்களின் முழுமையையும் நேரடியாக இணைக்கிறது. ஆகவே பிற்காலப் பிரிவை உரைக்குள் இறக்காமல் தொடர்ச்சியையும் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, கண்ணியமான நீதிமன்றப் பேச்சுத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘உம்மிடம்’ என்பது ஆளுநரிடம் பேசும் மரியாதையைத் தருகிறது. ‘வழி’ வரலாற்றுப் பெயராகத் தக்கவைக்கப்பட்டு, ‘பிரிவு’ எதிரிகளின் மதிப்பீடாக மட்டுமே வைக்கப்பட்டுள்ளது. ‘திருச்சட்டம்’ மற்றும் ‘இறைவாக்கினர்களின் நூல்கள்’ பொதுவாசகருக்குத் தெளிவாகவும் மறைநூல் பிரிவுகளை அடையாளப்படுத்துமாறும் அமைந்துள்ளன.
