source:
  edition: SBLGNT
  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: ta
  text: அதே நேரத்தில், பவுலிடமிருந்து தனக்குப் பணம் கொடுக்கப்படும் என்று பெலிக்ஸ் எதிர்பார்த்துக்கொண்டிருந்தான்.[a] அதனால், அவன் பவுலை முன்பைவிட அடிக்கடி வரவழைத்து, அவருடன் பேசினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இச்சூழலில் இன்னும் குறிப்பாக, “பவுலிடமிருந்து கையூட்டு கிடைக்கும் என்று எதிர்பார்த்தான்.” கிரேக்க மூலத்தில் “பணம்” என்றே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: அதே நேரத்தில்
  rationale: முந்தைய நிகழ்வுடன் ஒரே காலத்தில் தொடர்ந்த செயலை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: ἐλπίζων
  choice: எதிர்பார்த்துக்கொண்டிருந்தான்
  rationale: பெலிக்ஸின் தொடர்ச்சியான எதிர்பார்ப்பைக் காட்டும் நிகழ்காலப் பங்கேற்புவினையின் காலநிலையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: χρήματα
  choice: பணம்
  rationale: கிரேக்கச் சொல் நேரடியாக ‘பணம்’ என்பதையே குறிக்கிறது; சூழலில் கையூட்டு உட்குறிக்கப்பட்டாலும் அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: பவுல் தனக்குப் பணம் கொடுப்பார்
  rationale: கிரேக்கத்தின் எதிர்காலச் செயல்பாட்டையும் பவுலே பணத்தின் எதிர்பார்க்கப்பட்ட மூலமென்பதையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
- source_word: διὸ καὶ
  choice: அதனால்
  rationale: பெலிக்ஸின் பண எதிர்பார்ப்புக்கும் தொடர்ந்து வரவழைத்ததற்கும் இடையிலான காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது; καί இங்கு தொடர்ச்சியை வலுப்படுத்துகிறது.
- source_word: πυκνότερον
  choice: அடிக்கடி
  rationale: ஒப்பீட்டு வடிவம் அதிகமான நிகழ்வெண்ணைக் குறிக்கிறது; தமிழில் ‘அடிக்கடி’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: μεταπεμπόμενος
  choice: வரவழைத்து
  rationale: ஒருவரைத் தன்னிடம் அழைத்து வரச் செய்வதைக் குறிக்கும் நடுநிலை வினையின் பொருளை காவல் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: ὡμίλει αὐτῷ
  choice: அவருடன் பேசினான்
  rationale: முறையான உரையல்லாமல் உரையாடலைக் குறிக்கிறது; ‘பேசினான்’ எளிய, தற்போதைய தமிழ் நடைக்கு ஏற்றது.
theological_decisions:
- issue: பெலிக்ஸின் ஊழல் நோக்கத்தை முதன்மை உரையில் ‘கையூட்டு’ என்று வெளிப்படையாகக் கூற வேண்டுமா?
  choice: முதன்மை உரையில் ‘பணம்’ என்று வைத்து, கையூட்டு என்ற சூழல்சார் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘பவுலிடமிருந்து கையூட்டு கிடைக்கும் என்று எதிர்பார்த்தான்’
  rationale: சூழல் கையூட்டைக் கடுமையாக உணர்த்தினாலும், மூல கிரேக்கத்தில் உள்ள χρήματα என்பது பொதுவாக ‘பணம்’ என்றே பொருள்படும். ஆகவே மூலத்தின் சொற்பொருளையும் அதன் உட்குறிப்பையும் இரண்டையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. பெலிக்ஸ் மற்றும் பவுல் ஆகியோர் மாறிமாறிக் குறிப்பிடப்படுவதால் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க பெயர்கள் பயன்படுத்தப்பட்டுள்ளன.
