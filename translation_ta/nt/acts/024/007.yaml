  yaml_path: translation/nt/acts/024/007.yaml
  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: ta
  text: ஆனால்[a] படைத்தளபதியான லீசியா வந்து, மிகுந்த வலுக்கட்டாயத்துடன் அவரை எங்கள் கைகளிலிருந்து அழைத்துச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனமும், 6ஆம் வசனத்தின் இறுதிப் பகுதியும் 8ஆம் வசனத்தின் தொடக்கப் பகுதியும், மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில் காணப்படவில்லை. அவற்றில் கி.பி. 3ஆம் நூற்றாண்டைச் சேர்ந்த பப்பிரஸ் 74, கி.பி. 4ஆம் நூற்றாண்டைச் சேர்ந்த சினாய்டிகஸ் மற்றும் வாட்டிகானஸ் பிரதிகளும் அடங்கும்; பழைய காப்டிக் மொழிபெயர்ப்புகளிலும் இப்பகுதி இல்லை. ஆனால் பைசாந்தியப் பெரும்பான்மை மரபிலும், லத்தீன் மரபிலும், பிற்கால கிரேக்கக் கையெழுத்துப் பிரதிகளிலும் இது உள்ளது. பெலிக்ஸுக்கு முன் ரோமப் படைத்தளபதி தலையிட்டதை விவரிக்கும் ஆரம்பகால ஆசிரியர் சேர்க்கையாக இது தோன்றுகிறது.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών (παρέρχομαι)
  choice: வந்து
  rationale: இறந்தகால வினையெச்சம் லீசியா நிகழ்விடத்திற்கு வந்ததைச் சுட்டுகிறது; தமிழில் அடுத்த முதன்மை வினையுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: χιλίαρχος
  choice: படைத்தளபதி
  rationale: சொல்லின் நேர்ப்பொருள் ‘ஆயிரம் பேருக்குத் தலைவர்’; இங்கு ரோமப் படையின் உயரதிகாரியைக் குறிக்கிறது. நவீன வாசகர்களுக்குப் புரியும் வகையில் பதவியின் இராணுவத் தன்மையை ‘படைத்தளபதி’ வெளிப்படுத்துகிறது.
- source_word: μετὰ πολλῆς βίας
  choice: மிகுந்த வலிமையைப் பயன்படுத்தி
  rationale: βία இங்கு உடல் வலிமையையோ வற்புறுத்தலையோ குறிக்கலாம். ‘வன்முறை’ என்று தீய நோக்கத்தைச் சேர்க்காமல், வலுக்கட்டாயமான செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀπήγαγεν (ἀπάγω)
  choice: கொண்டுபோனார்
  rationale: ஒருவரை ஓரிடத்திலிருந்து அழைத்துச் செல்வதையோ எடுத்துச் செல்வதையோ குறிக்கிறது. ‘எங்கள் கைகளிலிருந்து’ என்பதுடன் சேர்ந்து, அவர்களின் கட்டுப்பாட்டிலிருந்து அகற்றிய பொருளைத் தெளிவாக்குகிறது.
- source_word: ἐκ τῶν χειρῶν ἡμῶν
  choice: எங்கள் கைகளிலிருந்து
  rationale: கிரேக்க உருவகத்தைத் தக்கவைத்து, அவர்களுடைய பிடியிலிருந்தும் அதிகாரத்திலிருந்தும் பவுலை அகற்றியதை இயல்பாகத் தெரிவிக்கிறது.
