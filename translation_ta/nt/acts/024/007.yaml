revisions:
- from: ஆனால்[a] படைத்தளபதி லீசியா வந்து, மிகுந்த வலிமையைப் பயன்படுத்தி அவரை எங்கள் கைகளிலிருந்து கொண்டுபோனார்.
  to: ஆனால்[a] படைத்தளபதியான லீசியா வந்து, மிகுந்த வலுக்கட்டாயத்துடன் அவரை எங்கள் கைகளிலிருந்து அழைத்துச் சென்றார்.
  rationale: The revision strengthens the Tamil expression of coercive force in βία, makes the title-and-name construction more idiomatic, and refines the textual-critical footnote's description of an editorial expansion. No doctrinal or interpretive claim has been added.
