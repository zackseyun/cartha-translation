translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் எதிர்மறைத் திருப்பை ‘ஆனால்’ தக்கவைக்கிறது; மரியாதை ஒருமை வினைமுற்று லீசியாவின் அதிகாரப் பதவிக்கேற்ற இயல்பான தமிழ் நடை.
