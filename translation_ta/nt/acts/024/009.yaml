  yaml_path: translation/nt/acts/024/009.yaml
  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: ta
  text: யூதர்களும் அந்தக் குற்றச்சாட்டில் இணைந்து[a], இவை அவ்வாறே உண்மை என்று உறுதிப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்களும் அந்தக் குற்றச்சாட்டுக்கு ஆதரவளித்து, இவை அவ்வாறே உண்மை என்று கூறினார்கள்.”
    reason: சυνεπέθεντο என்பது மற்றவர்களின் குற்றச்சாட்டில் இணைந்து எதிர்ப்பைக் காட்டுவதையோ, அந்தக் குற்றச்சாட்டுக்கு ஆதரவளிப்பதையோ குறிக்கலாம்.
lexical_decisions:
- source_word: συνεπέθεντο
  choice: அந்தக் குற்றச்சாட்டில் சேர்ந்துகொண்டு
  rationale: சேர்ந்து தாக்குதல் நடத்துதல் அல்லது ஒருவருக்கு எதிராகச் சேருதல் என்ற வினையின் எதிர்ப்புணர்வை, நீதிமன்றச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது. நேரடியான உடல் தாக்குதலைக் குறிக்காமல், தெர்த்துல்லுவின் குற்றச்சாட்டுகளுக்கு அவர்கள் ஆதரவாக இணைந்ததைத் தெரிவிக்கிறது.
- source_word: δὲ καὶ
  choice: யூதர்களும்
  rationale: δέ இங்கு மென்மையான தொடர்ச்சியைச் சுட்டுகிறது; καί கூடுதல் பங்கேற்பைக் காட்டுகிறது. தமிழ் வாக்கியத்தில் ‘-உம்’ இரண்டையும் இயல்பாக எடுத்துரைக்கிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: இங்கு விசாரணையில் இருந்த யூதக் குழுவையே நேரடியாகக் குறிக்கிறது; புவியியல் சார்ந்த ‘யூதேயர்கள்’ என்பதற்கான தேவை இல்லை.
- source_word: φάσκοντες
  choice: வலியுறுத்தினார்கள்
  rationale: குற்றச்சாட்டுகள் உண்மை என்று உறுதியாகக் கூறியதைச் சட்ட விசாரணைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ταῦτα οὕτως ἔχειν
  choice: இவை உண்மைதான் என்று
  rationale: ‘இவை இவ்வாறே உள்ளன’ என்ற கிரேக்க மொழிப்பாங்கின் பொருளை இயல்பான தமிழில் தருகிறது; முந்தைய குற்றச்சாட்டுகள் உண்மை என அவர்கள் கூறியதைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை. கிரேக்க வினையின் தாக்குதல் சார்ந்த நிழற்பொருளை மிகைப்படுத்தாமல் ‘குற்றச்சாட்டில் சேர்ந்துகொண்டு’ எனச் சூழலுக்கு ஏற்ப மொழிபெயர்க்கப்பட்டுள்ளது.
