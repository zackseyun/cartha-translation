  text: அவன் ஆலயத்தைக்கூடத் தீட்டுப்படுத்த முயன்றான்; நாங்கள் அவனைப் பிடித்தோம்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகள் இங்கே நீண்ட வாசகத்தைச் சேர்க்கின்றன. அதில், பவுலைத் தங்கள் சட்டத்தின்படி தீர்ப்பிட அவர்கள் விரும்பியதாகவும், தளபதி லீசியா மிகுந்த பலத்துடன் அவர்களுடைய கைகளிலிருந்து அவனை எடுத்துச் சென்றதாகவும் கூறப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς
  choice: அவன்
  rationale: இந்த உறவுப்பெயர் குற்றஞ்சாட்டப்படுகிற பவுலைக் குறிக்கிறது. தொடர்ச்சியற்ற இந்த நீதிமன்றக் குற்றச்சாட்டை இயல்பான நவீனத் தமிழில் தொடங்க ‘அவன்’ பொருத்தமானது.
- source_word: καὶ
  choice: -வும்
  rationale: இங்கு καὶ குற்றச்சாட்டை வலுப்படுத்தி, ஆலயத்தையே தீட்டுப்படுத்த முயன்றதாகக் கூறுகிறது. ‘-வும்’ அந்த வலியுறுத்தலைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: τὸ ἱερὸν
  choice: ஆலயத்தை
  rationale: ἱερόν என்பது உட்பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கலாம். பொதுவான, தெளிவான தமிழில் ‘ஆலயம்’ ஏற்றது; மூலத்தில் உள்ள பரந்த குறிப்பு இதனால் முற்றிலும் கட்டுப்படுத்தப்படவில்லை.
- source_word: ἐπείρασεν
  choice: முயன்றான்
  rationale: πειράζω என்பதன் இச்சூழல் பொருள் ‘முயற்சி செய்’ என்பதாகும். நிறைவேற்றியதாக அல்லாமல் முயன்றதாகவே குற்றச்சாட்டு கூறப்படுவதை இது காக்கிறது.
- source_word: βεβηλῶσαι
  choice: தீட்டுப்படுத்த
  rationale: βεβηλόω என்பது புனிதமானதைத் தூய்மைக் கேடுக்கு அல்லது அவமதிப்புக்கு உட்படுத்துவதைக் குறிக்கிறது. ஆலயத் தூய்மைச் சூழலில் ‘தீட்டுப்படுத்த’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ὃν
  choice: அவனை
  rationale: இந்த வினாப்பொருள் உறவுப்பெயர் மீண்டும் பவுலையே குறிக்கிறது. நவீனத் தமிழில் ‘அவனை’ இயல்பான தொடரை அளிக்கிறது.
- source_word: ἐκρατήσαμεν
  choice: நாங்கள் அவனைப் பிடித்தோம்
  rationale: κρατέω இங்கு ஒருவரைப் பலத்துடன் பற்றிப் பிடித்தல் அல்லது கைப்பற்றுதல் என்ற நுணுக்கம் உடையது. சட்டரீதியான ‘கைது செய்தோம்’ என்பதைவிட ‘பிடித்தோம்’ மூலத்தின் நேரடியான வலிமையைப் பேணுகிறது.
theological_decisions:
- issue: அப்போஸ்தலர் 24:6-இன் குறுகிய விமர்சன மூலபாடத்துக்கும் நீண்ட பைசாந்திய மூலபாடத்துக்கும் உள்ள வேறுபாடு
  choice: SBLGNT-இல் உள்ள ‘நாங்கள் அவனைப் பிடித்தோம்’ என்பதுவரையான குறுகிய வாசகத்தை மட்டும் மொழிபெயர்த்தல்
  alternative: சில கையெழுத்துப் பிரதிகள், பவுலைத் தங்கள் சட்டத்தின்படி தீர்ப்பிட விரும்பியதாகவும் தளபதி லீசியா அவர்களுடைய கைகளிலிருந்து அவனைப் பறித்துக்கொண்டதாகவும் கூறும் நீண்ட வாசகத்தைச் சேர்க்கின்றன.
  rationale: வழங்கப்பட்ட கிரேக்க மூலபாடம் குறுகிய விமர்சன வாசகத்தைக் கொண்டுள்ளது. ஆகவே பிற்கால விரிவாக்கத்தை முதன்மைப் பனுவலில் சேர்க்காமல், பரவலாக அறியப்பட்ட மாற்று வாசகத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நீதிமன்றக் குற்றச்சாட்டு நடையில் வடிவமைக்கப்பட்டது. ‘ஆலயம்’, ‘தீட்டுப்படுத்த’, ‘பிடித்தோம்’ ஆகிய சொற்கள் இயல்புத்தன்மையையும் மூலத்தின் சடங்கு-தூய்மை மற்றும் வன்மையான கைப்பற்றல் நுணுக்கங்களையும் சமநிலைப்படுத்துகின்றன. வசனம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
