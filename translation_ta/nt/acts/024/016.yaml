id: ACT.24.16
reference: Acts 24:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: ta
  text: இதைக் கருத்தில் கொண்டு, நானே கூட கடவுளுக்கும் மனிதர்களுக்கும் முன்பாக எப்போதும் குற்றமற்ற[a] மனச்சாட்சியைக் கொண்டிருக்க முயற்சி செய்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இடறலற்ற.’
    reason: ἀπρόσκοπον என்பது குற்றஞ்சாட்ட இடமில்லாதது, இடறல் அல்லது தடையை உண்டாக்காதது ஆகிய தொடர்புடைய பொருள் நிழல்களைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: இதைக் கருத்தில் கொண்டு
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட உயிர்த்தெழுதல் நம்பிக்கையைப் பின்னோக்கிச் சுட்டும் இச்சொற்றொடரின் தொடர்பையும் அதன் அடிப்படையில் வரும் நடைமுறை விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ αὐτὸς
  choice: நானும்
  rationale: καί என்பதன் சேர்க்கைப் பொருளை ‘உம்’ காக்கிறது; αὐτός தரும் தன்வலியுறுத்தல் தமிழில் ‘நான்’ என்னும் வெளிப்படையான எழுவாயால் அளவோடு வெளிப்படுகிறது.
- source_word: ἀσκῶ
  choice: முயற்சி செய்கிறேன்
  rationale: பயிற்சி செய்தல், அக்கறையுடன் பாடுபடுதல் என்ற தொடர்ச்சியான முயற்சியை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀπρόσκοπον
  choice: குற்றமற்ற
  rationale: மனச்சாட்சியோடு சேரும்போது, கடவுளுக்கும் மனிதர்களுக்கும் முன்பாகக் குற்றஞ்சாட்ட இடமில்லாத நிலையை இயல்பாகக் குறிக்கிறது; ‘இடறலற்ற’ என்ற சொற்படியான நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: συνείδησιν
  choice: மனச்சாட்சி
  rationale: ஒருவரின் உள்மன ஒழுக்க உணர்வைக் குறிக்கும் நிலையான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் இணைச்சொல்.
- source_word: ἔχειν
  choice: கொண்டிருக்க
  rationale: ἀσκῶ என்பதன் நோக்கத்தைச் சுட்டும் வினையெச்ச அமைப்பைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: கடவுளுக்கும் மனிதர்களுக்கும் முன்பாக
  rationale: கடவுளுக்கும் சக மனிதர்களுக்கும் தொடர்பான பொறுப்புணர்வை ‘முன்பாக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: διὰ παντός
  choice: எப்போதும்
  rationale: இடைவிடாத அல்லது எல்லாக் காலத்திற்குமான முயற்சியைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀνθρώπους என்பதன் பொதுமனிதக் குறிப்பு
  choice: மனிதர்கள்
  alternative: ஆட்கள் / மக்கள்
  rationale: இங்குள்ள ஆண்பால் பன்மைச் சொல் ஆண்களை மட்டும் அல்லாமல் மனிதர்களை பொதுவாகக் குறிக்கிறது. ‘மனிதர்கள்’ மூலத்தின் பொதுமனிதப் பரப்பைத் துல்லியமாகவும் பாலின வரம்பின்றியும் தெரிவிக்கிறது.
- issue: ἐν τούτῳ சுட்டும் காரணத் தொடர்பு
  choice: இதைக் கருத்தில் கொண்டு
  alternative: இதனால் / இதில்
  rationale: இச்சொற்றொடர் முந்தைய உயிர்த்தெழுதல் நம்பிக்கையைச் சுட்டுவதாகத் தோன்றினாலும், அதன் தொடர்பை கடுமையான காரணவியல் கூற்றாக மாற்றாமல் இருக்க ‘இதைக் கருத்தில் கொண்டு’ என மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கடவுள்’, ‘மனச்சாட்சி’, ‘மனிதர்கள்’ ஆகியவை தெளிவான பொதுப்பயன்பாட்டுச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
