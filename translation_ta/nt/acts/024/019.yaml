  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: ta
  text: ஆனால் ஆசியாவிலிருந்து வந்த யூதர்கள் சிலர் இருக்கிறார்கள்.[a] அவர்கள் உம்முன் ஆஜராகி, எனக்கு எதிராக ஏதாவது இருந்திருந்தால், என்மீது குற்றஞ்சாட்டியிருக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “ஆசியா” என்பது இன்றைய ஆசியக் கண்டத்தை அல்ல, ஆசியா மைனரில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “எனக்கு எதிராக வழக்குத் தொடுத்திருக்க வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: ஆனால் ... சிலர்
  rationale: δὲ முந்தைய கூற்றுடன் உள்ள முரண்பாட்டைக் குறிக்கிறது; τινὲς குறிப்பிடப்படாத சிலரைச் சுட்டுகிறது.
- source_word: ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: ஆசியாவிலிருந்து வந்த யூதர்கள்
  rationale: இது ரோமப் பேரரசின் ஆசியா மாகாணத்தைச் சேர்ந்த யூதர்களைக் குறிக்கிறது; வரலாற்றுப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἔδει ἐπὶ σοῦ παρεῖναι
  choice: அவர்கள் உம்முன் வந்து ... இருக்க வேண்டும்
  rationale: நீதித்துறைச் சூழலில் ஆளுநரின் முன்னிலையில் வந்து நிற்பதையும், நிறைவேற்றப்படாத கடமையையும் ἔδει உணர்த்துகிறது.
- source_word: κατηγορεῖν
  choice: என்மீது குற்றஞ்சாட்டியிருக்க வேண்டும்
  rationale: இது சட்டரீதியாக ஒருவர்மீது குற்றம் சுமத்துதல் அல்லது வழக்குத் தொடுப்பதைக் குறிக்கும் சொல்.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: எனக்கு எதிராக ஏதாவது குற்றச்சாட்டு இருந்திருந்தால்
  rationale: optative வடிவம் நிபந்தனைக்குரிய, நிகழாத அல்லது உறுதியற்ற சாத்தியத்தைத் தருகிறது; சட்டச் சூழல் காரணமாக ‘குற்றச்சாட்டு’ இயல்பானது, ஆனால் கிரேக்கத்தின் விரிந்த ‘ஏதாவது’ என்பதும் காக்கப்படுகிறது.
