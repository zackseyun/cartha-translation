  register: நவீன செந்தமிழ் வழக்கில், நீதிமன்றச் சூழலுக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஆளுநரை நோக்கிய மரியாதையை ‘உம்முன்’ காக்கிறது; ἔδει மற்றும் ἔχοιεν ஆகியவற்றின் நிறைவேறாத கடமை/கடந்தகால நிபந்தனை நுட்பம் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
