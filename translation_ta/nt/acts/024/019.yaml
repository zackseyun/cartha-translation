  source_fidelity: வரைவில் ἔδει-யின் நிறைவேறாத கடமை (‘...வேண்டும்’) மற்றும் εἴ τι ἔχοιεν-ன் நிபந்தனைப் பொருள் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் ‘வந்து’ என்பது παρεῖναι-யை விடச் சற்றே கூடுதலாகச் சொல்கிறது; நீதிமன்றச் சூழலில் ‘ஆஜராகி’ துல்லியமானதும் இயல்பானதும் ஆகும். நிபந்தனைச் சொற்றொடரை ‘குற்றச்சாட்டு’ எனக் குறுக்காமல், மூலத்தின் பரந்த ‘ஏதாவது’ பொருளை நேரடியாகக் காக்கலாம்.
  naturalness: ‘உம்முன் ஆஜராகி’ நவீன தரநிலைத் தமிழில் நீதிமன்றப் பதிவுக்குப் பொருத்தமானது. அடிக்குறி a-வை ‘ஆசியா’வுடனும், b-வை ‘குற்றஞ்சாட்டியிருக்க வேண்டும்’ என்பதுடனும் இணைப்பது வாசிப்பையும் குறிப்பு-இணைப்பையும் தெளிவாக்குகிறது.
  terminology: ‘யூதர்கள்,’ ‘உம்முன்,’ ‘ஆஜராகி,’ ‘குற்றஞ்சாட்டியிருக்க வேண்டும்’ ஆகியவை சூழலுக்கு ஏற்றவை. ‘வழக்குத் தொடுத்திருக்க வேண்டும்’ என்பது κατηγορεῖν-க்கு சாத்தியமான மாற்றாக இருக்கும்; ஆனால் முதன்மை உரையில் உள்ள ‘குற்றஞ்சாட்டு’ சட்டரீதியான பொருளைத் தக்கவைக்கிறது.
  issues:
