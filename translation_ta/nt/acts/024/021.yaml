reference: Acts 24:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: ta
  text: அல்லது, அவர்கள் நடுவில் நின்றபடி, ‘இறந்தோரின் உயிர்த்தெழுதலைக் குறித்தே இன்று உங்கள் முன் நான் விசாரிக்கப்படுகிறேன்’ என்று நான் உரக்கக் கூறிய இந்த ஒரே கூற்றைக்[a] குறித்துதானா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கூற்று’ என்பதற்குப் பதிலாக ‘குரல்’ அல்லது ‘முழக்கம்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் கூறப்பட்ட செய்தியையோ, அதை வெளிப்படுத்திய குரல் அல்லது முழக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இறந்தோரிலிருந்து உயிர்த்தெழுதல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: கூற்று
  rationale: φωνή என்பதற்கு ‘குரல்’ அல்லது ‘முழக்கம்’ என்ற பொருள் வரலாம்; ஆனால் இங்கு περὶ என்பதுடனும் தொடர்ந்து வரும் மேற்கோளுடனும் அமைந்திருப்பதால், உச்சரிக்கப்பட்ட குறிப்பிட்ட கூற்றையே குறிக்கிறது. ‘கூற்று’ என்பது தமிழில் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκέκραξα
  choice: நான் உரக்கக் கூறிய
  rationale: κράζω உரத்த பொதுவான அறிவிப்பைக் குறிக்கிறது. ‘உரக்கக் கூறிய’ என்பது அதன் வலிமையையும் நீதிமன்றச் சூழலையும் காக்கிறது.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: அவர்கள் நடுவில் நின்றுகொண்டு
  rationale: இந்தப் பங்கேற்புவினைத் தொடர் பவுல் பேசும்போது இருந்த நிலையையும் இடத்தையும் குறிக்கிறது; ‘நடுவில் நின்றுகொண்டு’ என்பது இரண்டையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀναστάσεως νεκρῶν
  choice: இறந்தோரின் உயிர்த்தெழுதல்
  rationale: இறந்தோருக்குரிய உயிர்த்தெழுதல் என்ற பொதுவான பொருளை இக்கட்டமைப்பு தருகிறது; வசனம் வெளிப்படையாகக் கூறாத வகையில் இதை இயேசுவின் உயிர்த்தெழுதலுக்கு மட்டும் சுருக்கவில்லை.
- source_word: κρίνομαι
  choice: நான் நியாயந்தீர்க்கப்படுகிறேன்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவம் பவுல் அப்போது நீதித்தீர்ப்புக்கு உட்படுத்தப்பட்டிருப்பதைச் சொல்கிறது. இந்தத் தேர்வு கிரேக்க வடிவத்திற்கு நெருக்கமாகவும் தமிழில் புரியத்தக்கதாகவும் உள்ளது.
- source_word: ἐφ’ ὑμῶν
  choice: உங்கள் முன்
  rationale: நீதித்துறைச் சூழலில் ἐπί + genitive ஒரு அதிகாரியின் அல்லது தீர்ப்பாயத்தின் முன் நிற்பதைக் குறிக்கலாம். ‘உங்கள் முன்’ என்பது கேட்டுக்கொண்டிருப்பவர்களே நேரடியாகத் தீர்ப்பளிக்கும் முகவர்கள் என்று தேவையின்றி கூறாமல் சூழலைக் காக்கிறது.
- source_word: ἢ
  choice: அல்லது
  rationale: முந்தைய தற்காப்புரையுடன் வசனத்தை இணைக்கும் எளிய மாற்றுச் சொல்; மூலத்தின் தொடர்பை கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: μιᾶς ταύτης
  choice: இந்த ஒரே
  rationale: ஒருமையையும் குறிப்பிட்ட தன்மையையும் வலியுறுத்துகிறது.
- source_word: σήμερον
  choice: இன்று
  rationale: நவீனத் தமிழில் இயல்பான நேரக் குறிப்பு.
theological_decisions:
- issue: சர்ச்சைக்குரிய குற்றச்சாட்டின் தன்மை
  choice: இறந்தோரின் உயிர்த்தெழுதல் என்ற பொதுவான வடிவம்
  alternative: இயேசுவின் உயிர்த்தெழுதலை மட்டும் குறிப்பதாக வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: περὶ ἀναστάσεως νεκρῶν என்பது பொதுவான சொற்றொடர். அப்போஸ்தலர் நூலின் பரந்த சூழலில் இயேசுவின் உயிர்த்தெழுதல் தொடர்புடையதாக இருந்தாலும், இவ்வசனம் வெளிப்படையாகச் சொல்லாத குறிப்பை மொழிபெயர்ப்பில் சேர்க்காமல் அதன் இறையியல் அழுத்தத்தையும் சாத்தியமான விரிவையும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. மூலத்தின் கேள்வித் தொடர்ச்சி, ஒரே கூற்றின் வலியுறுத்தல், உரத்த பேச்சு, மற்றும் உயிர்த்தெழுதல் குறித்த பொதுவான சொற்றொடர் பாதுகாக்கப்பட்டுள்ளன.
