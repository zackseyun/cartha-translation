source:
  edition: SBLGNT
  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: ta
  text: இரண்டு ஆண்டுகள் நிறைவடைந்தபோது, பெலிக்சுக்குப் பின் போர்க்கியு பேஸ்து பதவியேற்றார். யூதர்களுக்கு ஒரு சலுகை செய்ய விரும்பிய பெலிக்ஸ், பவுலைக் கட்டப்பட்டவராகவே விட்டுச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்களுடைய நன்மதிப்பைப் பெற விரும்பிய பெலிக்ஸ்.” இந்தக் கிரேக்க மரபுத்தொடர், அவர்களுக்கு ஒரு சலுகை செய்வதையோ அவர்களுடைய நல்லெண்ணத்தைப் பெறுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: இரண்டு ஆண்டுகள் நிறைவடைந்தபோது
  rationale: மரபுத்தொடர் சார்ந்த காலச் சூழலை இயல்பான தமிழில் தருகிறது; πληρωθείσης என்பதிலுள்ள ‘நிறைவடைதல்’ என்ற கருத்தையும் காக்கிறது.
- source_word: ἔλαβεν διάδοχον
  choice: பெலிக்சுக்குப் பின் ... பதவியேற்றார்
  rationale: சொல்லுக்குச் சொல் ‘வாரிசாகப் பெற்றார்’ என்பது தமிழில் இயல்பற்றது. அதிகாரப் பொறுப்பில் ஒருவர் மற்றவருக்குப் பின்வந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Πόρκιον Φῆστον
  choice: போர்க்கியு பெஸ்து
  rationale: கிரேக்கப் பெயரின் ஒலிப்பை நவீனத் தமிழ் எழுத்துப்பெயர்ப்பு முறையில் தருகிறது.
- source_word: θέλων
  choice: விரும்பிய
  rationale: பெலிக்ஸ் பவுலைக் கட்டுண்ட நிலையில் விட்டுச் சென்றதற்கான நோக்கத்தை இயல்பான பெயரெச்சத் தொடராகக் காட்டுகிறது.
- source_word: χάριτα καταθέσθαι
  choice: ஒரு சலுகை செய்ய
  rationale: இந்த மரபுத்தொடரின் ‘அவர்களுக்கு ஒரு நன்மை அல்லது ஆதரவான செயலைச் செய்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது. அவர்களுடைய நன்மதிப்பைப் பெறுதல் என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்களுக்கு
  rationale: χάριτα καταθέσθαι என்பதோடு வரும் மறைமுகச் செயப்படுபொருளை இயல்பாகக் குறிக்கிறது.
- source_word: κατέλιπε
  choice: விட்டுச் சென்றார்
  rationale: பதவி மாறியபோது பவுலை அவர் இருந்த நிலையிலேயே பெலிக்ஸ் விட்டுச் சென்றார் என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: δεδεμένον
  choice: கட்டுண்ட நிலையிலேயே
  rationale: முற்றுப்பெற்ற செயலின் தொடரும் நிலையைச் சுட்டும் கிரேக்கப் பெயரெச்சத்தைப் பாதுகாக்கிறது; ‘சிறையில்’ அல்லது ‘சங்கிலிகளில்’ என்று மூலத்தைவிடக் குறிப்பாக்குவதைத் தவிர்க்கிறது.
