  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. χάριτα καταθέσθαι என்பதிலுள்ள உண்மையான பொருள் நுட்பத்தை முதன்மை உரையும் அடிக்குறிப்பும் சேர்ந்து பாதுகாக்கின்றன.
