source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: ta
  text: சில நாட்களுக்குப் பிறகு, பெலிக்ஸ் தன் மனைவியான யூதப் பெண் துருசில்லாவுடன் வந்தான். அவன் பவுலை வரவழைத்து, மெசியா[a] இயேசுவின்மேல் கொண்ட விசுவாசத்தைப்[b] பற்றி பவுலிடமிருந்து கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து இயேசு.” Χριστός என்ற கிரேக்கப் பட்டம் இங்கு பெயராக மட்டும் அல்லாமல் பட்டமாகச் செயல்படுவதால் முதன்மை உரையில் “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நம்பிக்கையைப்.” πίστις என்ற கிரேக்கச் சொல் “நம்பிக்கை” அல்லது “நம்புதல்” என்ற பொருளையும் தரக்கூடும்; இங்கு “விசுவாசம்” முதன்மை மொழிபெயர்ப்பாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: சில நாட்களுக்குப் பிறகு
  rationale: μετά + accusative காலத்தைக் குறிக்கும் ‘சில நாட்களுக்குப் பிறகு’ என்ற பொருளைத் தருகிறது. δέ-யின் மென்மையான உரைத் தொடர்பைத் தமிழில் தனிச் சொல்லால் மிகையாக வெளிப்படுத்தாமல் வாக்கிய ஓட்டத்தில் விட்டுள்ளோம்.
- source_word: παραγενόμενος
  choice: வந்தான்
  rationale: பெலிக்ஸ் வந்து சேர்ந்ததைக் குறிக்கும் வினையெச்சத்தை இயல்பான தமிழ் கதைநடையில் முதன்மை வினையாக வழங்குகிறது.
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: தன் மனைவி துருசில்லாவுடன்
  rationale: σύν உடனிருப்பதையும் ἰδίᾳ பெலிக்ஸுக்குரிய மனைவி என்பதையும் குறிக்கிறது. ‘தன் மனைவி’ என்பது தமிழில் இயல்பாகவே அந்த உடைமை வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: யூதப் பெண்ணாகிய
  rationale: துருசில்லா யூத இன/சமய அடையாளமுடைய பெண் என்பதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: μετεπέμψατο
  choice: வரவழைத்து
  rationale: ஒருவரை அழைத்துவர ஆள் அனுப்புதல் என்ற μεταπέμπομαι-யின் நடுத்தர வினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἤκουσεν αὐτοῦ
  choice: பவுல் பேசுவதைக் கேட்டான்
  rationale: ἀκούω + genitive இங்கு பவுலின் உரையைக் கேட்பதைக் குறிக்கிறது. பெயர்ச்சுட்டுத் தெளிவுக்காக ‘பவுல் பேசுவதைக்’ என்று இயல்பாக விரித்துரைக்கப்பட்டுள்ளது.
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: மெசியா இயேசுவின்மேல் கொண்ட விசுவாசத்தைப் பற்றி
  rationale: περί உரையின் பொருளை அறிமுகப்படுத்துகிறது; πίστις + εἰς + accusative மெசியா இயேசுவை நோக்கிய விசுவாசத்தைக் குறிக்கிறது. ‘மேல் கொண்ட’ என்பது அந்தத் திசைப்பட்ட உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Χριστὸν Ἰησοῦν
  choice: மெசியா இயேசு
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் மொழிபெயர்க்கப்பட்டுள்ளது; கிரேக்கச் சொல் வரிசையும் பட்டத்தின் வலிமையும் தக்கவைக்கப்படுகின்றன.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இச்சூழலில் ஒருவர் மீது வைக்கப்படும் faith/trust என்பதே இயல்பான பொருள். வழக்கமான வேதாகமத் தமிழில் புரிந்துகொள்ளப்படும் ‘விசுவாசம்’ முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘நம்பிக்கை’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா இயேசு
  alternative: கிறிஸ்து இயேசு; மெசியாவாகிய இயேசு
  rationale: Χριστός இங்கு வெறும் பெயரைப்போல் அல்லாமல் பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்படுகிறது. மாற்று வழக்கமான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τῆς εἰς Χριστὸν Ἰησοῦν πίστεως என்பதன் பொருள்
  choice: மெசியா இயேசுவின்மேல் கொண்ட விசுவாசம்
  alternative: மெசியா இயேசுவின்மேல் கொண்ட நம்பிக்கை; மெசியா இயேசுவை நோக்கிய விசுவாசம்
  rationale: πίστις உடன் εἰς + accusative வருவதால் விசுவாசம் இயேசுவை நோக்கியது என்பதே இங்கு மிக இயல்பான வாசிப்பு. πίστις-ன் ‘நம்பிக்கை/நம்புதல்’ நுண்பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது; ‘மெசியாவின் விசுவாசத்தன்மை’ என்ற genitive வாசிப்பு இக்கட்டமைப்பில் ஆதரிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘தனது சொந்த மனைவி’ என்ற செயற்கையான சொல்லாட்சிக்குப் பதிலாக ‘தன் மனைவி’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகில் வைக்கப்பட்டுள்ளன.
