id: ACT.24.5
reference: Acts 24:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: ta
  text: ஏனெனில், இந்த மனிதன் ஒரு தொல்லை என்றும், உலகமெங்கிலும் உள்ள எல்லா யூதர்களிடையிலும் கலகங்களைத் தூண்டுகிறவன் என்றும், நாசரேயர்களின் பிரிவுக்குத் தலைவன் என்றும் நாங்கள் கண்டோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: ஒரு கொள்ளைநோய் போல இருப்பவன்
  rationale: சொல்லின் நேரடிப் பொருள் ‘கொள்ளைநோய்’; இங்கு ஒருவரைச் சமூகத்துக்கு அழிவை உண்டாக்கும் தொல்லையாகக் குற்றஞ்சாட்டும் உருவகப் பயன்பாடு. தமிழில் உருவகத்தை இயல்பாகவும் தெளிவாகவும் வைத்திருக்க ‘போல இருப்பவன்’ சேர்க்கப்பட்டது.
- source_word: κινοῦντα στάσεις
  choice: கலகங்களைத் தூண்டுகிறவன்
  rationale: στάσεις என்பது இங்கு பொதுவான அமைதியின்மையைவிடக் குழப்பம், கிளர்ச்சி, கலகம் ஆகியவற்றைக் குறிக்கும்; பன்மையும் குற்றச்சாட்டின் தீவிரமும் பாதுகாக்கப்பட்டன.
- source_word: τὴν οἰκουμένην
  choice: குடியிருக்கும் உலகம்
  rationale: கிரேக்கச் சொல்லின் மரபான பரப்புக் கருத்தைப் பாதுகாக்கிறது; அக்காலத்தில் அறியப்பட்ட குடியிருக்கும் உலகைக் குறிக்கும் மிகைப்படுத்தப்பட்ட குற்றச்சாட்டாகவும் வாசிக்க இயலும்.
- source_word: πρωτοστάτην
  choice: தலைவன்
  rationale: முன்னணியில் நிற்பவர் அல்லது தலைமை வகிப்பவர் என்ற கருத்தை இயல்பான தமிழில் தருகிறது; ‘முதன்மைத் தூண்டுபவன்’ என்ற சாத்திய நிழற்பொருளை அளவுக்கு மீறி வலியுறுத்தவில்லை.
- source_word: αἱρέσεως
  choice: பிரிவு
  rationale: அக்காலச் சூழலில் ஒரு கட்சி அல்லது சமயக் குழுவைக் குறிக்கிறது; பிற்காலத்தில் உருவான ‘மதவிரோதக் கொள்கை’ என்ற தீர்ப்பைத் தமிழில் இறக்குமதி செய்யாமல் தவிர்க்கிறது.
- source_word: Ναζωραίων
  choice: நாசரேயர்கள்
  rationale: இயேசுவைப் பின்பற்றியவர்களுக்கு எதிரிகள் பயன்படுத்திய குழுப்பெயரைப் பெயரெச்சமாக அல்லாமல் இயல்பான தமிழ்க் குழுப்பெயராக வழங்குகிறது.
theological_decisions:
- issue: αἵρεσις என்பதன் மதிப்பீட்டுச் சுமை
  choice: பிரிவு
  alternative: மதப்பிரிவு / மதவிரோதக் குழு
  rationale: வசனம் குற்றஞ்சாட்டுபவரின் மொழியைப் பதிவு செய்கிறது; மொழிபெயர்ப்பு தானாகவே பிற்காலக் கோட்பாட்டுத் தீர்ப்பைச் சேர்க்கக் கூடாது.
- issue: ‘நாசரேயர்கள்’ என்ற அடையாளத்தின் தொனி
  choice: நாசரேயர்களின் பிரிவு
  alternative: நாசரேய மதப்பிரிவு
  rationale: மூலத்தில் உள்ள எதிர்மறைச் சூழலைப் பாதுகாத்தாலும், ‘மத’ என்பதைச் சேர்த்து குழுவின் நிலையை மொழிபெயர்ப்பாளர் தீர்மானிக்கவில்லை.
translation_notes:
  register: நீதிமன்றக் குற்றச்சாட்டுக்கேற்ற முறையான, தீவிரமான தொனி பேணப்பட்டது. நீளமான கிரேக்க வாக்கிய அமைப்பு தமிழில் புரியும்படி இணையான மூன்று குற்றச்சாட்டுகளாக ஒழுங்குபடுத்தப்பட்டுள்ளது; அதேவேளை வசனத்தின் தொடர்ச்சியும் இறுதி கமாவுக்கு இணையான நிறைவு பெறாத உணர்வும் தமிழில் முழு வாக்கியமாக இயல்பாக்கப்பட்டுள்ளது.
