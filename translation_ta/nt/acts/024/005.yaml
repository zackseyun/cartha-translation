revisions:
- from: ஏனெனில், இந்த மனிதன் ஒரு கொள்ளைநோய் போல இருப்பவனென்றும், குடியிருக்கும் உலகமெங்கும் உள்ள யூதர்கள் அனைவரிடையிலும் கலகங்களைத் தூண்டுகிறவனென்றும், நாசரேயர்களின் பிரிவுக்குத் தலைவனென்றும் நாங்கள் கண்டறிந்தோம்.
  to: ஏனெனில், இந்த மனிதன் ஒரு தொல்லை என்றும், உலகமெங்கிலும் உள்ள எல்லா யூதர்களிடையிலும் கலகங்களைத் தூண்டுகிறவன் என்றும், நாசரேயர்களின் பிரிவுக்குத் தலைவன் என்றும் நாங்கள் கண்டோம்.
  rationale: The revision removes the added simile, improves idiomatic Tamil word order, and uses a natural forensic verb. It retains the source's hostile legal accusation, the plural ‘riots/disturbances,’ the expansive inhabited-world scope, and the non-pejoratively overdetermined rendering ‘பிரிவு’ for αἵρεσις.
