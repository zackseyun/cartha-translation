revisions:
- from: அல்லது, நான் ஆலோசனைச் சங்கத்தின் முன் நின்றபோது என்னிடம் என்ன குற்றத்தைக் கண்டார்கள் என்பதை இங்கே இருக்கிற இவர்களே சொல்லட்டும்.[a]
  to: அல்லது, நான் ஆலோசனைச் சங்கத்தின் முன் நின்றபோது, என்ன குற்றத்தைக் கண்டார்கள் என்று இவர்களே சொல்லட்டும்.[a]
  rationale: The revision removes an unnecessary contextual addition, makes the accusation clause idiomatic and precise, retains the emphatic “இவர்களே,” and repairs the footnote into a complete alternative-rendering note. No doctrinal interpretation has been added.
