base_translation:
  language: en
  yaml_path: translation/nt/acts/024/020.yaml
  text: Or let these men themselves say what wrongdoing they found when I stood before the council,[a]
translation:
  language: ta
  text: அல்லது, நான் ஆலோசனைச் சங்கத்தின் முன் நின்றபோது, என்ன குற்றத்தைக் கண்டார்கள் என்று இவர்களே சொல்லட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சனெத்ரின் முன்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் συνέδριον யூதர்களின் ஆட்சிமன்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: பவுலின் தற்காப்பு வாதத்தில் மாற்று வாய்ப்பை முன்வைக்கும் இணைப்புச் சொல்லின் இயல்பான தமிழாக்கம்.
- source_word: αὐτοὶ οὗτοι
  choice: இங்கே இருக்கிற இவர்களே
  rationale: சுட்டுப்பெயரின் நேரடி குறிப்பையும் αὐτοί தரும் அழுத்தத்தையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: εἰπάτωσαν
  choice: சொல்லட்டும்
  rationale: சட்ட விசாரணைச் சூழலில் வரும் மூன்றாம் நபர் கட்டளையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τί εὗρον
  choice: என்ன ... கண்டார்கள்
  rationale: பவுலிடம் கண்டதாகக் கூறக்கூடிய குறிப்பிட்ட தவறு என்ன என்று கேட்கும் கிரேக்க வினா அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἀδίκημα
  choice: குற்றம்
  rationale: தவறான செயல் அல்லது சட்டரீதியான குற்றம் ஆகிய இரு நிழற்பொருள்களுக்கும் ஏற்ற, நீதிமன்றச் சூழலில் இயல்பான சொல்.
- source_word: στάντος μου
  choice: நான் ... நின்றபோது
  rationale: கிரேக்க இறந்தகாலப் பெயரெச்சத்தின் காலத் தொடர்பைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: ஆலோசனைச் சங்கத்தின் முன்
  rationale: இங்கு யூத ஆட்சிமன்றத்தைக் குறிக்கும் συνέδριον என்பதைக் கருத்தில் கொண்டு, பொதுவாசகருக்குப் புரியும் வகையில் மொழிபெயர்க்கிறது.
