translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்றத் தற்காப்புரையின் உறுதியான தொனியைக் காக்கும் வகையில் வடிவமைக்கப்பட்டது. ‘இவர்களே’ என்பது மூலத்தின் அழுத்தத்தைப் பாதுகாக்கிறது; ‘ஆலோசனைச் சங்கம்’ பொதுவாசகருக்கான தெளிவை அளிக்கிறது.
