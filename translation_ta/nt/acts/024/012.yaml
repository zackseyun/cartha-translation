translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்றத் தற்காப்பின் அளவான தொனியைப் பேணும் கண்ணியமான நடை. கிரேக்கத்தின் தொடரமைப்பு தமிழில் இயல்பாக இருக்கும்படி இடக்குறிப்புகள் முன்னிலைப்படுத்தப்பட்டுள்ளன; ஆலயம், தொழுகைக்கூடங்கள், நகரின் பிற இடங்கள் அனைத்திலும் இரு செயல்களும் நிகழவில்லை என்ற மறுப்பு தெளிவாக வைக்கப்பட்டுள்ளது.
