  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: ta
  text: நான் யாருடனும் விவாதித்ததையோ[a], மக்கள் கூட்டத்தைக் கிளப்பியதையோ[b] அவர்கள் ஆலயத்திலோ, ஜெபஆலயங்களிலோ, நகரம் முழுவதிலுமோ கண்டதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாருடனும் வாதிட்டதையோ’ அல்லது ‘யாருடனும் கலந்துரையாடியதையோ.’ கிரேக்க வினைச்சொல் உரையாடுதல், காரணங்காட்டுதல், அல்லது விவாதித்தல் என்ற பொருள்களைக் கொண்டிருக்கலாம். இச்சூழலில் பவுல் பொதுக் குழப்பம் ஏற்படுத்தியதாகச் சாட்டப்பட்ட குற்றத்தை மறுக்கிறார்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மக்கள் கூட்டம் கூடும்படி செய்ததையோ.’ கிரேக்கச் சொற்றொடர் ஒரு கூட்டத்தை உருவாக்குவதையோ பொதுப் பரபரப்பை ஏற்படுத்துவதையோ குறிக்கலாம்; முழுமையான கலவரம் நடந்ததாக அது கட்டாயப்படுத்தவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: ஆலயத்தில்
  rationale: இங்கு ἱερόν என்பது உட்புறப் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தையும் குறிக்கக்கூடும். தமிழில் இயல்பான ‘ஆலயம்’ அந்தப் பரந்த பொருளைச் சூழலிலிருந்து தாங்குகிறது.
- source_word: εὗρόν με
  choice: அவர்கள் என்னைக் கண்டதில்லை
  rationale: நீதிமன்றத் தற்காப்புச் சூழலில், குற்றஞ்சாட்டியவர்கள் பவுலை இச்செயல்களில் ஈடுபட்டவராகக் காணவில்லை என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: πρός τινα διαλεγόμενον
  choice: நான் யாருடனும் வாதிடுவதை
  rationale: διαλέγομαι என்பது உரையாடுதல், காரணங்களை எடுத்துரைத்தல், விவாதித்தல் அல்லது வாதிடுதல் எனப் பொருள்படலாம். பொதுக் குழப்பத்தை ஏற்படுத்தியதாக வந்த குற்றச்சாட்டை பவுல் மறுக்கும் இச்சூழலில் ‘வாதிடுதல்’ பொருத்தமானது; எனினும் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: மக்கள் கூட்டத்தைக் கிளப்புவதை
  rationale: இச்சொற்றொடர் மக்கள் கூடும்படி செய்தல் அல்லது கூட்டத்தில் பரபரப்பை ஏற்படுத்துதல் ஆகிய இரு நிழற்பொருள்களையும் கொண்டிருக்கலாம். ‘கூட்டத்தைக் கிளப்புதல்’ என்பது முழுமையான கலவரம் அல்லது வன்முறை என்ற மிகைப்பைச் சேர்க்காமல் இரண்டையும் இயல்பாகத் தாங்குகிறது.
- source_word: συναγωγαῖς
  choice: தொழுகைக்கூடங்கள்
  rationale: யூதர்கள் கூடி வழிபட்டும் போதனை கேட்டும் வந்த இடங்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: κατὰ τὴν πόλιν
  choice: நகரத்தின் வேறெந்த இடத்திலும்
  rationale: நகர் முழுவதிலும் எங்கும் இச்செயல்களில் பவுல் காணப்படவில்லை என்ற பகிர்வு சார்ந்த பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
