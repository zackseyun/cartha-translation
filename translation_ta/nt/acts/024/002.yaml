base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: ta
  text: அவர் அழைக்கப்பட்டபோது, தெர்த்துல்லு அவர்மீது குற்றஞ்சாட்டத் தொடங்கி, “உம்மால் நாங்கள் மிகுந்த அமைதியை அனுபவித்து வருகிறோம்; உமது தொலைநோக்கால்[b] இந்த நாட்டிற்குச் சீர்திருத்தங்கள்[a] ஏற்பட்டுவருகின்றன,” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சீர்திருத்தங்கள்’ என்பதற்கு ‘மேம்பாடுகள்’ அல்லது ‘திருத்த நடவடிக்கைகள்’ என்றும் மொழிபெயர்க்கலாம் (διορθωμάτων).
    reason: lexical_alternative
  - marker: b
    text: ‘உமது தொலைநோக்கால்’ என்பதற்கு ‘உமது முன்யோசனையால்’ அல்லது ‘உமது விவேகமான நிர்வாகத்தால்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொல் πρόνοια, ஆட்சியாளரின் முன்னோக்கிய சிந்தனை அல்லது நிர்வாகத்தைக் குறிக்கிறது; அது அவசியமாகத் தெய்வ பரிபாலனத்தைக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: அவர் அழைக்கப்பட்டபோது
  rationale: முதன்மைச் செயல் நிகழ்ந்த சூழலைக் குறிக்கும் genitive absolute அமைப்பை இயல்பான தமிழில் தருகிறது. சட்ட விசாரணைச் சூழலில் அழைக்கப்பட்டார் என்ற பொருளையும் காக்கிறது; சுட்டப்படுபவர் பவுல்.
- source_word: ἤρξατο κατηγορεῖν
  choice: குற்றஞ்சாட்டத் தொடங்கி
  rationale: தொடக்கநிலையைக் குறிக்கும் கிரேக்கக் கட்டமைப்பையும் சட்டம் சார்ந்த ‘குற்றஞ்சாட்டு’ என்ற நேரடியான பொருளையும் காக்கிறது.
- source_word: ὁ Τέρτυλλος
  choice: தெர்த்துல்லு
  rationale: தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ
  choice: உம்மால் நாங்கள் மிகுந்த அமைதியை அனுபவித்து வருகிறோம்
  rationale: διά என்பதன் கருவி அல்லது முகமைப் பொருளையும், ஆளுநரைப் புகழ்ந்து பேசும் சொல்லாட்சியையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: διορθωμάτων γινομένων
  choice: சீர்திருத்தங்கள் ஏற்பட்டுவருகின்றன
  rationale: διορθώματα என்பதன் திருத்த நடவடிக்கைகள் அல்லது மேம்பாடுகள் என்ற அரசியல்-நிர்வாகப் பொருளை ‘சீர்திருத்தங்கள்’ தெளிவாகத் தருகிறது. γινομένων என்பதிலுள்ள நிகழ்ந்துவருதல் என்ற கருத்தை, தேவையில்லாமல் வெளிப்படையான செயப்பாட்டாளரைச் சேர்க்காமல் காக்கிறது.
- source_word: τῷ ἔθνει τούτῳ
  choice: இந்த நாட்டிற்கு
  rationale: இங்கு ἔθνος என்பது ரோம ஆட்சிக்குட்பட்ட யூத மக்களை அரசியல் சமூகமாகக் குறிக்கிறது; தடவியல் வேற்றுமையை ‘நாட்டிற்கு’ காக்கிறது.
- source_word: διὰ τῆς σῆς προνοίας
  choice: உமது தொலைநோக்கால்
  rationale: மனித ஆட்சியாளரின் முன்னோக்கிய திட்டமிடல் அல்லது நிர்வாக முன்னறிவைக் குறிக்கிறது. ‘தெய்வ பரிபாலனம்’ போன்ற தேவையற்ற இறையியல் உட்பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: πρόνοια என்ற சொல்லை மனித ஆட்சியாளரின் நிர்வாகச் சூழலில் மொழிபெயர்த்தல்
  choice: தொலைநோக்கு
  alternative: முன்னறிவு; பரிபாலனம்
  rationale: இங்கு பெலிக்ஸின் ஆட்சித் திட்டமிடலைத் தெர்த்துல்லு புகழ்கிறான்; தெய்வீக ஆளுகை என்ற கருத்தை உரை கூறவில்லை. ஆகவே ‘தொலைநோக்கு’ அந்த நிர்வாகப் பொருளைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்ற உரைக்கும் ஆளுநரிடம் செலுத்தப்படும் மரியாதைக்கும் ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தெர்த்துல்லுவின் முகஸ்துதியான தொனி காக்கப்பட்டுள்ளது. கிரேக்க வாக்கியம் அடுத்த வசனத்தில் தொடர்ந்தாலும், தமிழில் வாசிப்புத் தெளிவுக்காக மேற்கோளுக்குள் இயல்பான கூற்று வடிவம் தரப்பட்டுள்ளது.
