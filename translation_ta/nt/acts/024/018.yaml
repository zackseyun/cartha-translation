base_translation:
  language: en
  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: ta
  text: அவற்றின் போது[a], சடங்குமுறைப்படி தூய்மைப்படுத்தப்பட்டவனாக ஆலயத்தில் இருந்த என்னை அவர்கள் கண்டார்கள்; என்னுடன் கூட்டமோ அமளியோ இருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் நேரடியாக, ‘அவற்றில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: இவற்றைச் செய்துகொண்டிருந்தபோது
  rationale: முன்னர் குறிப்பிடப்பட்ட செயல்கள் அல்லது நிகழ்வுகளைச் சுட்டும் தொடர்புப்பெயரைக் காலச்சூழலை இயல்பாக வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கிறது; ‘இவற்றில்’ என்ற நேரடி வடிவத்தின் பொருளையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: εὗρόν με
  choice: என்னை அவர்கள் கண்டார்கள்
  rationale: சூழலில் பவுலை ஆலயத்தில் எதிர்கொண்டதைக் குறிக்கும் εὑρίσκω என்பதன் இயல்பான கதைநடைப் பொருள்.
- source_word: ἡγνισμένον
  choice: தூய்மைப்படுத்தப்பட்ட நிலையில்
  rationale: நிறைவுற்ற தூய்மைப்படுத்துதலின் தொடரும் நிலையைக் காட்டும் perfect passive participle-ஐப் பிரதிபலிக்கிறது; சடங்குசார் தன்மையை முதன்மை உரையில் மிகையாக விளக்காமல் அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν ஆலய வளாகத்தைக் குறிக்கிறது; ‘ஆலயத்தில்’ என்பது தமிழில் வழக்கமானதும் தேவையற்ற குறிப்பாக்கத்தைத் தவிர்ப்பதும் ஆகும்.
- source_word: οὐ μετὰ ὄχλου
  choice: என்னுடன் கூட்டமோ ... இருக்கவில்லை
  rationale: பவுலுடன் மக்கள் கூட்டம் இல்லை என்ற சட்டவாதச் சூழலை நடுநிலையாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘கும்பல்’ என்பது மூலத்தைவிடக் கடுமையானதாக இருக்கும்.
- source_word: οὐδὲ μετὰ θορύβου
  choice: கலகமோ இருக்கவில்லை
  rationale: θόρυβος குறிக்கும் பொது அமைதிக்கேடு அல்லது அமளியைச் சுருக்கமாக வெளிப்படுத்துகிறது; இங்கு ‘கலகம்’ சட்டவாதச் சூழலுக்கு ஏற்றது.
theological_decisions:
- issue: ἡγνισμένον என்பதன் சடங்குசார் பொருள்
  choice: முதன்மை உரையில் ‘தூய்மைப்படுத்தப்பட்ட நிலையில்’; அடிக்குறிப்பில் சடங்குசார் பொருள்
  alternative: ‘சடங்குமுறைப்படி தூய்மைப்படுத்தப்பட்ட நிலையில்’ என்று முதன்மை உரையிலேயே விரிவாக்குதல்
  rationale: யூதச் சடங்குத் தூய்மையே சூழலில் கருதப்பட்டாலும், மூலச் சொல்லின் சுருக்கத்தையும் அதன் இறையியல்-பண்பாட்டு நுணுக்கத்தையும் பாதுகாக்க விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நீதிமன்றத் தற்காப்புரையின் கண்ணியமான தொனியைப் பேணும் இயல்பான நடை. கிரேக்க வாக்கியத்தின் தொடர்ச்சியை அரைப்புள்ளி மூலம் காத்து, தமிழில் தெளிவுக்காக ‘இருந்த’ மற்றும் ‘என்னுடன்’ என்பவை வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளன.
