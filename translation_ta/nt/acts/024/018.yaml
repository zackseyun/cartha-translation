    reason: cultural_note
  revision_rationale: The relative phrase is rendered without adding an unstated action, and θόρυβος is translated as “அமளி” rather than the stronger “கலகம்.” The ritual sense of purification is retained clearly in the main text and supported by a footnote. Footnote b is retained as a cultural note but its anchor is relocated to the purification expression, preserving proper anchor coverage.
