revisions:
- from: இவற்றைச் செய்துகொண்டிருந்தபோது[a], தூய்மைப்படுத்தப்பட்ட நிலையில்[b] ஆலயத்தில் இருந்த என்னை அவர்கள் கண்டார்கள்; என்னுடன் கூட்டமோ கலகமோ இருக்கவில்லை.
  to: அவற்றின் போது[a], சடங்குமுறைப்படி தூய்மைப்படுத்தப்பட்டவனாக ஆலயத்தில் இருந்த என்னை அவர்கள் கண்டார்கள்; என்னுடன் கூட்டமோ அமளியோ இருக்கவில்லை.
  rationale: The relative phrase is rendered without adding an unstated action, and θόρυβος is translated as “அமளி” rather than the stronger “கலகம்.” The ritual sense of purification is retained clearly in the main text and supported by a footnote. Footnote b is retained as a cultural note but its anchor is relocated to the purification expression, preserving proper anchor coverage.
