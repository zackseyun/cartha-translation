  terminology: Replace ‘தலைமைக் குரு’ with ‘தலைமை ஆசாரியர்’ for ἀρχιερεύς. Retain the broader ‘பேச்சாளர்’ for ῥήτωρ in the text, while the footnote supplies the forensic alternative without identifying Tertullus too narrowly as a modern licensed legal professional.
