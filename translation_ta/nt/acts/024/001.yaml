translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கீழே வந்தார்’ மூலத்தின் பயணத் திசையைப் பாதுகாக்கிறது; ‘பேச்சாளர்’ என்ற சொல்லின் சட்டச் சூழல் சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
