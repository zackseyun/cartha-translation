source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: ta
  text: ஐந்து நாட்களுக்குப் பிறகு, தலைமை ஆசாரியரான அனனியா சில மூப்பர்களோடும் தெர்த்துல்லு என்ற ஒரு பேச்சாளரோடும்[a] கீழே வந்தார். அவர்கள் ஆளுநரிடம் பவுலுக்கு எதிராகக் குற்றச்சாட்டுகளை முன்வைத்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெர்த்துல்லு என்ற ஒரு வழக்குரைஞரோடும்”; கிரேக்கச் சொல் பொதுப் பேச்சாளரையோ சட்ட வழக்கில் ஒருவரின் சார்பாகப் பேசுபவரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: ஐந்து நாட்களுக்குப் பிறகு
  rationale: μετά உடன் வரும் கால அளவு, ஐந்து நாட்கள் கடந்த பின்பைக் குறிக்கிறது. δέ இங்கு மென்மையான கதைத் தொடர்ச்சியை மட்டும் காட்டுவதால், தமிழில் தனிச் சொல்லாக மிகையாக வெளிப்படுத்தப்படவில்லை.
- source_word: κατέβη
  choice: கீழே வந்தார்
  rationale: καταβαίνω என்பதன் இறங்கிவரும் திசைப் பொருளைப் பாதுகாக்கிறது; எருசலேமிலிருந்து செசரியாவுக்குச் செல்லும் பயணச் சூழலுக்கும் பொருந்துகிறது.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: தலைமைக் குருவான அனனியா
  rationale: ἀρχιερεύς யூத தலைமைக் குரு பதவியைக் குறிக்கிறது; பெயர் நவீனத் தமிழ் ஒலிபெயர்ப்பு மரபின்படி தரப்பட்டுள்ளது.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: மூப்பர்களில் சிலரோடும்
  rationale: πρεσβύτεροι இங்கு யூதத் தலைவர்களான மூப்பர்களைக் குறிக்கிறது; τινῶν குழுவிலிருந்து சிலர் வந்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: தெர்த்துல்லு என்ற ஒரு பேச்சாளரோடும்
  rationale: ῥήτωρ பொதுவில் பேசுபவரையோ சட்டச் சூழலில் சார்பாக வாதிடுபவரையோ குறிக்கலாம். முதன்மை உரையில் பரந்த பொருளுள்ள ‘பேச்சாளர்’ பயன்படுத்தப்பட்டு, சட்டப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οἵτινες ἐνεφάνισαν
  choice: இவர்கள் ... குற்றச்சாட்டுகளை முன்வைத்தனர்
  rationale: குறிப்பிடப்பட்ட முழுக் குழுவையும் ‘இவர்கள்’ சுட்டுகிறது. ἐμφανίζω இங்குள்ள நீதிமன்றச் சூழலில் ஒருவருக்கு எதிரான குற்றச்சாட்டுகளை முறையாகத் தெரிவிப்பதைக் குறிக்கிறது.
- source_word: τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: ஆளுநரிடம் பவுலுக்கு எதிராக
  rationale: ἡγεμών ரோம ஆளுநரைக் குறிக்கிறது; κατά உடன் வரும் ஆறாம் வேற்றுமை நீதிமன்றச் சூழலில் ‘எதிராக’ என்ற பொருளைத் தருகிறது.
