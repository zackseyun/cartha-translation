  source_fidelity: The draft accurately conveys the elapsed time, downward travel, accompanying elders, the formal accusation, the governor, and the accusation against Paul. The legal/public-speaking sense of ῥήτωρ is retained in the note. A small revision makes the high-priest title and the indefinite accompanying group more idiomatic and precise in standard Tamil.
