revisions:
- from: பல ஆண்டுகள் கழித்து, என் மக்களுக்கு தர்ம உதவிகள்[a] வழங்கவும் காணிக்கைகள் செலுத்தவும் நான் வந்தேன்.
  to: பல ஆண்டுகளுக்குப் பிறகு, என் மக்களுக்கு ஏழைகளுக்கான கொடைகளை வழங்கவும் காணிக்கைகள் செலுத்தவும் நான் வந்தேன்.
  rationale: The revision replaces the broad expression ‘தர்ம உதவிகள்’ with ‘ஏழைகளுக்கான கொடைகள்’ to represent the needy-focused charitable sense of ἐλεημοσύνας more explicitly. It also smooths the temporal expression to ‘பல ஆண்டுகளுக்குப் பிறகு.’ The wording for offerings remains general, preserving the source text’s ambiguity about their exact type.
