source:
  edition: SBLGNT
  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: ta
  text: பல ஆண்டுகளுக்குப் பிறகு, என் மக்களுக்கு ஏழைகளுக்கான கொடைகளை வழங்கவும் காணிக்கைகள் செலுத்தவும் நான் வந்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: பல ஆண்டுகள் கழித்து
  rationale: διά உடன் வரும் காலக் குறிப்பு, ஓர் இடைவெளி கடந்த பின்பு என்பதைக் காட்டுகிறது. πλειόνων இங்கு இயல்பாக ‘பல ஆண்டுகள்’ எனப் பொருள்படும்; δέ மென்மையான இணைப்புச்சொல் என்பதால் தமிழில் தனியே ‘ஆனால்’ என்று வலுப்படுத்தப்படவில்லை.
- source_word: ἐλεημοσύνας
  choice: தர்ம உதவிகள்
  rationale: இந்தப் பன்மைச் சொல் தேவையுள்ளவர்களுக்குச் செய்யப்படும் பொருளுதவிகளைக் குறிக்கிறது. ‘தர்ம உதவிகள்’ என்பது நவீன தமிழில் சுருக்கமாகவும் புரியும்படியாகவும் உள்ளது; அடிக்குறிப்பு அதன் குறிப்பான பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: ποιήσων
  choice: வழங்கவும் … செலுத்தவும்
  rationale: ποιέω என்பதன் சொற்பொருள் ‘செய்’ என்றாலும், ἐλεημοσύνας உடன் அது உதவி வழங்குவதையும் προσφοράς உடன் காணிக்கை செலுத்துவதையும் குறிக்கும். தமிழில் இரு பெயர்ச்சொற்களுக்கும் இயல்பான வினைகள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: εἰς τὸ ἔθνος μου
  choice: என் மக்களுக்கு
  rationale: ἔθνος இங்கு பவுலின் சொந்த யூத மக்களைக் குறிக்கிறது. ‘என் மக்கள்’ என்பது ‘என் நாடு’ என்பதைவிட நபர்களை நோக்கிய உதவியின் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘இனம்’ என்ற சொல்லின் இன்றைய தேவையற்ற நிழற்பொருள்களையும் தவிர்க்கிறது.
- source_word: παρεγενόμην
  choice: நான் வந்தேன்
  rationale: παραγίνομαι இச்சூழலில் வந்து சேர்வதைக் குறிக்கிறது. ‘நான் வந்தேன்’ என்பது நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: προσφοράς
  choice: காணிக்கைகள்
  rationale: προσφοράς என்பது, குறிப்பாக வழிபாட்டுச் சூழலில், செலுத்தப்படும் காணிக்கைகளைக் குறிக்கலாம். கிரேக்கம் அதன் சரியான வகையைச் சொல்லாததால் பொதுவான ‘காணிக்கைகள்’ என்பதே வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: எருசலேமில் பவுல் செய்த உதவியின் தன்மை
  choice: ἐλεημοσύνας என்பதை ‘தர்ம உதவிகள்’ என்று மொழிபெயர்த்தல்
  alternative: ஏழைகளுக்கான கொடைகள்; பிச்சைத் தர்மம்
  rationale: இது கோட்பாட்டுத் தீர்மானத்தைவிட சொற்பொருள் சார்ந்தது. தேர்ந்தெடுத்த சொல் தேவையுள்ளவர்களுக்கான பொருளுதவியைத் தெரிவிக்கிறது; அதேவேளை ‘பிச்சை’ என்பதன் குறுகிய அல்லது இழிவான நிழற்பொருளைத் தவிர்க்கிறது.
- issue: προσφοράς என்பதன் குறிப்பான வகை
  choice: காணிக்கைகள் என்று பொதுவாக வைத்தல்
  alternative: பலிக்காணிக்கைகள்; கடவுளுக்கான காணிக்கைகள்
  rationale: மூலவாக்கியம் காணிக்கைகளின் வகையையோ பெறுபவரையோ வெளிப்படையாகக் குறிப்பிடவில்லை. ஆலயச் சூழல் பொருளை வழிநடத்தலாம்; ஆனால் அதை மொழிபெயர்ப்புக்குள் சேர்த்து தெளிவின்மையை நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் வகையிலும் பவுலின் நீதிமன்றச் சாட்சிக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தர்ம உதவிகள்’ மற்றும் ‘காணிக்கைகள்’ ஆகியவற்றின் வேறுபாடு காக்கப்பட்டுள்ளது.
