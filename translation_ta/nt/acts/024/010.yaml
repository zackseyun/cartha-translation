source:
  edition: SBLGNT
  text: Ἀπεκρίθη ⸀τε ὁ Παῦλος νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν· Ἐκ πολλῶν ἐτῶν ὄντα σε κριτὴν τῷ ἔθνει τούτῳ ἐπιστάμενος ⸀εὐθύμως τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: ta
  text: 'ஆளுநர் அவருக்குப் பேசும்படி சைகை செய்தபோது, பவுல் பதிலளித்தார்: “நீர் பல ஆண்டுகளாக இந்த மக்களுக்கு நீதிபதியாக இருந்து வருகிறீர் என்பதை அறிந்திருப்பதால், என்னைப் பற்றிய காரியங்களில் நான் மனமுவந்து[a] தற்காப்பு வாதத்தை முன்வைக்கிறேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பிக்கையுடன்.” இந்தச் சொல் மனமுவந்த ஆயத்தம், துணிவு அல்லது உற்சாகத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε ὁ Παῦλος
  choice: பவுல் பதிலளித்தார்
  rationale: ἀποκρίνομαι என்பதன் இயல்பான பொருள் ‘பதிலளித்தல்’. τε இங்கு மென்மையான கதைத் தொடர்ச்சியைத் தருகிறது; தமிழில் காலத் துணைவாக்கியத்துடன் தொடர்ச்சி இயல்பாக வெளிப்படுவதால் தனி இணைப்புச்சொல் தேவையில்லை.
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: ஆளுநர் பேசும்படி சைகை செய்தபோது
  rationale: முற்றுப்பெறா காலத்தைக் காட்டும் genitive absolute அமைப்பு தமிழில் காலத் துணைவாக்கியமாக இயல்பாகிறது. νεύω தலை அசைத்தல் அல்லது சைகை செய்தல் எனப் பொருள்படலாம்; செய்கையின் துல்லிய வடிவத்தை அளவுக்கு மீறி நிர்ணயிக்காமல் ‘சைகை செய்தார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἡγεμόνος
  choice: ஆளுநர்
  rationale: இச்சூழலில் ரோம மாகாண அதிகாரியைக் குறிக்கும் தெளிவான, தற்போதைய தமிழ் நிர்வாகச் சொல்.
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: பல ஆண்டுகளாக
  rationale: கடந்த காலத்திலிருந்து தொடரும் நீண்ட கால அளவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὄντα σε κριτὴν
  choice: நீதிபதியாக இருந்து வருகிறீர்
  rationale: நீண்டகாலமாகத் தொடர்ந்து வகிக்கும் நீதித்துறைப் பொறுப்பை participial construction-க்கு ஏற்ப காட்டுகிறது.
- source_word: τῷ ἔθνει τούτῳ
  choice: இந்த மக்களுக்கு
  rationale: ἔθνος என்பது ‘தேசம்’ அல்லது ‘மக்கள்’ என அமையலாம். இங்கு பெலிக்ஸின் அதிகாரத்திற்குட்பட்ட யூத மக்களைச் சுட்டுவதால், இயல்பான தமிழில் ‘இந்த மக்களுக்கு’ என வழங்கப்பட்டது.
- source_word: ἐπιστάμενος
  choice: அறிந்திருப்பதால்
  rationale: பவுல் மனமுவந்து தன் தரப்பு வாதத்தை முன்வைப்பதற்கான காரணத்தை participle உணர்த்துவதால் காரணத் தொடர்பு தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: εὐθύμως
  choice: மனமுவந்து
  rationale: இந்த வினையடை ஆயத்தம், உற்சாகம், துணிவு அல்லது நம்பிக்கை ஆகிய நிழற்பொருள்களைத் தரலாம். ‘மனமுவந்து’ விருப்பத்துடனும் ஆயத்தத்துடனும் பேசுவதை இயல்பாக வெளிப்படுத்துகிறது; ‘நம்பிக்கையுடன்’ என்பது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: τὰ περὶ ἐμαυτοῦ
  choice: என்னைப் பற்றியவற்றுக்காக
  rationale: பவுலைப் பற்றிய வழக்கு விவகாரங்களைப் பொதுவாகக் குறிக்கும் கிரேக்கப் பன்மைத் தொடரைப் பாதுகாக்கிறது.
- source_word: ἀπολογοῦμαι
  choice: என் தரப்பு வாதத்தை முன்வைக்கிறேன்
  rationale: சட்ட விசாரணைச் சூழலிலுள்ள தற்காப்பு விளக்கத்தைக் குறிக்கும் forensic வினை. ‘தரப்பு வாதம்’ நீதிமன்றத் தொனியைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
