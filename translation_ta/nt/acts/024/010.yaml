translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையுள்ள நீதிமன்றத் தொனி பயன்படுத்தப்பட்டுள்ளது. பெலிக்ஸை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்’, ‘வருகிறீர்’ கையாளப்பட்டுள்ளன. கிரேக்கத்தின் நீண்ட வாக்கிய அமைப்பு வாசிப்பிற்கு இயல்பாக இருக்குமாறு தமிழில் ஒழுங்குபடுத்தப்பட்டாலும், காரணத் தொடர்பும் சட்டச் சூழலும் பாதுகாக்கப்பட்டுள்ளன.
