source:
  edition: SBLGNT
  text: παρ’ οὗ δυνήσῃ αὐτὸς ἀνακρίνας περὶ πάντων τούτων ἐπιγνῶναι ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: ta
  text: அவரிடமிருந்து[a], நீர் தாமே அவரை விசாரித்த பின்[b], நாங்கள் அவர்மீது குற்றஞ்சாட்டும் இவையனைத்தையும் குறித்து அறிந்துகொள்ள முடியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் முறையான நடையில், ‘யாரிடமிருந்து நீர் தாமே அவரை விசாரித்த பின், நாங்கள் அவர்மீது குற்றஞ்சாட்டும் இவையனைத்தையும் குறித்து அறிந்துகொள்ள முடியுமோ, அவரிடமிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகள் 7ஆம் வசனத்தில், தளபதி லீசியா பவுலைப் பலவந்தமாகக் கொண்டுபோனதாகவும், குற்றஞ்சாட்டுகிறவர்கள் பெலிக்ஸிடம் வரும்படி கட்டளையிட்டதாகவும் கூறும் கூடுதல் பகுதியைச் சேர்க்கின்றன. SBLGNT மூலப்பாடத்தில் அந்தச் சொற்கள் இங்கு இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: அவரிடமிருந்து
  rationale: παρά என்பதன் ஆறாம் வேற்றுமை வடிவம் இங்கு தகவல் கிடைக்கும் மூலத்தைச் சுட்டுகிறது. இதன் முன்னிலைச் சொல் பவுல்; இயல்பான தமிழில் ‘அவரிடமிருந்து’ என்று வழங்கப்படுகிறது.
- source_word: δυνήσῃ
  choice: அறிந்துகொள்ள முடியும்
  rationale: δύναμαι என்பதன் எதிர்கால வடிவம் திறன் அல்லது வாய்ப்பைக் குறிக்கிறது; தமிழில் சூழலுக்கு இயல்பாக ‘முடியும்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: αὐτὸς
  choice: நீர் தாமே
  rationale: அழைக்கப்படுகிற பெலிக்ஸ் நேரடியாக விசாரிப்பார் என்ற வலியுறுத்தலை αὐτός தருகிறது. மரியாதைமிக்க ஒருமை நடையில் ‘நீர் தாமே’ அதைத் தெளிவாகக் காக்கிறது.
- source_word: ἀνακρίνας
  choice: அவரை விசாரித்து
  rationale: சட்ட விசாரணைச் சூழலில் ἀνακρίνω என்பது விசாரித்தல் அல்லது கேள்வி கேட்டறிதல். செயப்படுபொருள் கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் அது பவுல் என்பதால் தமிழில் ‘அவரை’ சேர்ப்பது இயல்பும் தெளிவும் தருகிறது.
- source_word: περὶ πάντων τούτων
  choice: இவை அனைத்தையும் பற்றி
  rationale: περί + ஆறாம் வேற்றுமை ‘பற்றி/குறித்து’ என்பதைக் குறிக்கிறது; πάντων τούτων என்பதன் பன்மையும் முழுமையும் ‘இவை அனைத்தையும்’ என்பதில் காக்கப்படுகின்றன.
- source_word: ἐπιγνῶναι
  choice: அறிந்துகொள்ள
  rationale: இச்சட்டச் சூழலில் ἐπιγινώσκω உண்மைகளை விசாரணையால் தெரிந்துகொள்வதைக் குறிக்கிறது. ‘அறிந்துகொள்ள’ என்பது நவீன தமிழில் இயல்பானது; ‘முழுமையாக அறிய’ என்று தீவிரத்தை மிகைப்படுத்தாது.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: நாங்கள் அவர்மீது குற்றஞ்சாட்டுகிற
  rationale: κατηγορέω ஆறாம் வேற்றுமையுடன் ஒருவர்மீது குற்றஞ்சாட்டுதலைக் குறிக்கிறது. கிரேக்க உறவுப்பெயர் அமைப்பு தமிழில் பெயரெச்சத் தொடராக இயல்பாக மாற்றப்பட்டுள்ளது; ἡμεῖς குறிக்கும் வெளிப்படையான ‘நாங்கள்’ தக்கவைக்கப்பட்டுள்ளது.
