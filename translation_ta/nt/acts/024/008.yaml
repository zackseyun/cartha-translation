translation_notes:
  register: நவீன தரத் தமிழில், நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெலிக்ஸை நோக்கிய மரியாதை ஒருமைக்கு ‘நீர்’ என்றும், αὐτός தரும் வலியுறுத்தலுக்கு ‘தாமே’ என்றும் வழங்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் சட்டத் தன்மை காக்கப்பட்டாலும், தமிழில் இயல்பாகப் புரிய பெயரெச்ச அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
