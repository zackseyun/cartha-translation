base_translation:
  language: en
  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: ta
  text: எந்தக் காரியங்களைக் குறித்து அவர்கள் இப்போது என்மீது குற்றஞ்சாட்டுகிறார்களோ, அவற்றை உங்கள்முன் நிரூபிக்கவும் அவர்களால் முடியாது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள்முன் எடுத்துவைக்கவும்” அல்லது “உங்கள்முன் நிலைநாட்டவும்.” கிரேக்க வினை ஒன்றை முன்வைப்பதையோ நிலைநாட்டுவதையோ குறிக்கலாம்; இங்கு சட்டரீதியான குற்றச்சாட்டை ஆதாரத்துடன் மெய்ப்பிக்கும் பொருளில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: நிரூபிக்கவும் … முடியாது
  rationale: முந்தைய கூற்றைத் தொடர்ந்து வரும் இணைப்புடைய மறுப்பை, தமிழில் இயல்பாக வினையெச்சத்துடன் சேர்ந்த ‘-வும் … முடியாது’ என்ற அமைப்பு வெளிப்படுத்துகிறது.
- source_word: παραστῆσαι
  choice: நிரூபிக்க
  rationale: இந்த நீதிமன்றச் சூழலில் குற்றச்சாட்டை ஆதாரத்துடன் நிலைநாட்டுதல் என்பதே பொருள். ‘நிரூபிக்க’ என்பது அந்த சட்டச்சூழல் வலிமையைத் தெளிவாகத் தருகிறது; ‘முன்வைக்க’ என்பதும் சொற்பொருள் வாய்ப்பு என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: δύνανταί
  choice: அவர்களால் முடியாது
  rationale: திறன் அல்லது இயலாமையைக் குறிக்கும் கிரேக்க வினையை இயல்பான நவீன தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: σοι
  choice: உங்கள்முன்
  rationale: பெலிக்சை நோக்கிய ஒருமை முன்னிலை இங்கு நீதிபதியின் முன்னிலையில் ஆதாரம் நிறுவும் சட்டச்சூழலைக் கொண்டுள்ளது. மரியாதையான ‘உங்கள்’ வடிவம் நவீன தமிழுக்கு ஏற்றது.
- source_word: περὶ ὧν
  choice: எந்தக் காரியங்களைக் குறித்து … அவற்றை
  rationale: குற்றச்சாட்டு சார்ந்த விஷயங்களைச் சுட்டும் தொடர்புப்பெயர் அமைப்பை மிகையாக ‘குற்றச்சாட்டுகள்’ என்று மாற்றாமல் வெளிப்படுத்துகிறது.
- source_word: νυνὶ
  choice: இப்போது
  rationale: நடப்பு குற்றச்சாட்டின் காலத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: κατηγοροῦσίν μου
  choice: என்மீது குற்றஞ்சாட்டுகிறார்களோ
  rationale: சட்டரீதியான குற்றஞ்சாட்டுதலைத் தெளிவாகக் காட்டுகிறது. கிரேக்க நிகழ்காலத்தின் தொடரும் செயற்பாட்டையும் காக்கிறது.
