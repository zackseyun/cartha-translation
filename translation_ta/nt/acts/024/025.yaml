id: ACT.24.25
reference: Acts 24:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: ta
  text: ஆனால் அவர் நீதி, தன்னடக்கம், வரவிருக்கும் நியாயத்தீர்ப்பு ஆகியவற்றைப் பற்றிப் பேசிக்கொண்டிருந்தபோது, பேலிக்ஸ் அச்சமடைந்து, “இப்போதைக்கு நீ போ. எனக்கு வாய்ப்பு கிடைக்கும்போது உன்னை வரவழைப்பேன்” என்று பதிலளித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: பேசிக்கொண்டிருந்தபோது
  rationale: இங்கு விவாதித்தல் அல்லது உரையாடுதல் என்ற நுணுக்கம் இருந்தாலும், தொடர்ச்சியாக ஒரு பொருளை எடுத்துரைத்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δικαιοσύνης
  choice: நீதி
  rationale: ஒழுக்க மற்றும் இறையியல் பரப்பைத் திறந்தவாறே வைத்திருக்கும் பொதுவான, dignified Tamil equivalent.
- source_word: ἐγκρατείας
  choice: தன்னடக்கம்
  rationale: ஒருவருடைய ஆசைகளையும் செயல்களையும் கட்டுப்படுத்தும் பண்பை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: வரவிருக்கும் நியாயத்தீர்ப்பு
  rationale: μέλλοντος என்பதன் எதிர்கால நோக்கையும் κρίμα என்பதன் நீதித்தீர்ப்பு உணர்வையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἔμφοβος γενόμενος
  choice: அச்சமடைந்து
  rationale: பேலிக்ஸ் பயமுற்ற நிலைக்கு வந்ததை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: Τὸ νῦν ἔχον
  choice: இப்போதைக்கு
  rationale: தற்போதைய சூழ்நிலைக்கான தற்காலிக அனுப்புதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καιρὸν ... μεταλαβὼν
  choice: எனக்கு வாய்ப்பு கிடைக்கும்போது
  rationale: καίρος இங்கு ஏற்ற நேரம் அல்லது சந்தர்ப்பம் என்ற பொருளைக் கொண்டது; தமிழ் வழக்கில் ‘வாய்ப்பு’ இயல்பாக உள்ளது.
- source_word: μετακαλέσομαί
  choice: அழைப்பேன்
  rationale: மீண்டும் தன்னிடம் வருமாறு அழைப்பித்தல் என்ற சூழல்பொருளைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: δικαιοσύνη என்பதன் பரப்பு
  choice: நீதி
  alternative: நீதிமான்மை
  rationale: இந்த இடத்தில் பவுல் எடுத்துரைத்தது தனிப்பட்ட நேர்மை, நீதியான நடத்தை, அல்லது தேவனுக்கு முன்பான நீதி ஆகியவற்றில் எது என்று உரைத் துல்லியமாகக் கட்டுப்படுத்தவில்லை; ‘நீதி’ அந்தத் திறந்த பரப்பைப் பாதுகாக்கிறது.
- issue: வரவிருக்கும் κρίμα
  choice: வரவிருக்கும் நியாயத்தீர்ப்பு
  alternative: இனி வரப்போகும் தீர்ப்பு
  rationale: தீர்ப்பின் இறையியல் தீவிரத்தை வெளிப்படுத்துகிறது; ஆனால் அதன் நேரம் அல்லது விரிவைப் பற்றிய கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பான, மரியாதைமிக்க உரைநடை. கிரேக்க வாக்கியத்தின் மூன்று தலைப்புகளும் இணையாகப் பாதுகாக்கப்பட்டுள்ளன. பேலிக்ஸின் பதில் நேரடியான மேற்கோளாகவும் அவனுடைய தற்காலிகத் தள்ளிப்போடுதலைத் தெளிவாகவும் வழங்கப்பட்டுள்ளது.
