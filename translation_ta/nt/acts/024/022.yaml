source:
  edition: SBLGNT
  text: ⸂Ἀνεβάλετο δὲ αὐτοὺς ὁ Φῆλιξ⸃, ἀκριβέστερον εἰδὼς τὰ περὶ τῆς ὁδοῦ, ⸀εἴπας· Ὅταν Λυσίας ὁ χιλίαρχος καταβῇ διαγνώσομαι τὰ καθ’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: ta
  text: ஆனால், பெலிக்ஸ் ‘வழி’[b] பற்றியவற்றை இன்னும் துல்லியமாக அறிந்திருந்ததால், அவர்களுடைய வழக்கை ஒத்திவைத்து[a], “படைத்தளபதி லீசியா கீழே வரும்போது, உங்கள் வழக்கைத் தீர்மானிப்பேன்[c]” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிமன்ற நடவடிக்கையைத் தள்ளிவைத்து.” கிரேக்க வினைச்சொல் ஒரு வழக்கின் விசாரணையையோ தீர்ப்பையோ பிற்போடுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வழி’ என்பது இயேசுவைப் பின்பற்றிய ஆரம்பகால இயக்கத்தைக் குறிக்கப் பயன்படுத்தப்பட்ட பெயர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “உங்களைப் பற்றிய காரியங்களைத் தீர்மானிப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο ... αὐτοὺς
  choice: அவர்களுடைய விசாரணையை ஒத்திவைத்து
  rationale: வினைச்சொல் நீதிமன்ற நடவடிக்கையைத் தள்ளிவைப்பதைக் குறிக்கிறது; αὐτούς நேரடியாக நபர்களைக் குறித்தாலும், தமிழில் ‘அவர்களை ஒத்திவைத்தார்’ இயல்பாக இல்லாததால், அவர்களைச் சார்ந்த விசாரணை எனத் தெளிவாக்கப்பட்டுள்ளது.
- source_word: ἀκριβέστερον εἰδὼς
  choice: இன்னும் துல்லியமாக அறிந்திருந்ததால்
  rationale: ἀκριβέστερον என்பதன் ஒப்பீட்டுப் பொருளையும், பங்கேற்பு வினை முதன்மைச் செயலுக்கான பின்னணியை அல்லது காரணத்தைத் தருவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: ‘வழி’ பற்றியவற்றை
  rationale: ἡ ὁδός என்பதன் நேரடிப் பொருளான ‘வழி’யைத் தக்கவைத்து, அப்போஸ்தலர் பணிகளில் கிறிஸ்தவ இயக்கத்தைக் குறிக்கும் சிறப்புப் பயன்பாட்டை மேற்கோள் குறிகளால் உணர்த்துகிறது.
- source_word: χιλίαρχος
  choice: படைத்தளபதி
  rationale: ரோமப் படையின் உயர்நிலைத் தளபதியைக் குறிக்கும் சொல்லை, விளக்கமில்லாத ஒலிபெயர்ப்பைத் தவிர்த்து சாதாரண வாசகருக்கு புரியும் வகையில் தருகிறது.
- source_word: Ὅταν ... καταβῇ
  choice: கீழே வரும்போது
  rationale: குறிப்பிட்ட எதிர்கால வருகையைக் குறிக்கும் ὅταν உடன் வரும் துணைநிலை வினையின் பொருளையும், καταβαίνω என்பதிலுள்ள ‘கீழே வருதல்’ என்ற புவியியல் சொல்லாட்சியையும் தக்கவைக்கிறது.
- source_word: διαγνώσομαι τὰ καθ’ ὑμᾶς
  choice: உங்கள் வழக்கைத் தீர்மானிப்பேன்
  rationale: சட்டச் சூழலில் நன்கு ஆராய்ந்து முடிவுசெய்வதை διαγνώσομαι குறிக்கிறது; τὰ καθ’ ὑμᾶς என்பதை இயல்பான தமிழில் ‘உங்கள் வழக்கு’ என வழங்குகிறது.
theological_decisions:
- issue: ἡ ὁδός என்பதன் இயக்கப் பெயரான பயன்பாடு
  choice: ‘வழி’
  alternative: கிறிஸ்தவ மார்க்கம்
  rationale: மூலத்தின் உருவகத்தையும் ஆரம்பகால இயக்கப் பெயரையும் பாதுகாக்கிறது; ‘கிறிஸ்தவ மார்க்கம்’ என்பது மூலத்தில் இல்லாத பிற்கால அடையாளச் சொல்லை இறக்குமதி செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வழி’ என்ற மூல உருவகம் மேற்கோள் குறிகளுடன் தக்கவைக்கப்பட்டுள்ளது. எனினும் [b] குறிப்பு இயல்பாகத் தொடர்புபட வசன முடிவில் மீளுருவாக்காமல், பிரதான உரையிலுள்ள சொல்லோடு சேர்க்கப்பட வேண்டும்; வெளியீட்டு அமைப்பில் உரை ‘பெலிக்ஸ் ‘வழி’[b] பற்றியவற்றை...’ என அமைக்கப்படுவது விரும்பத்தக்கது.
