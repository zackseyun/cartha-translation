  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: ta
  text: அவன் நூற்றுவர் படைத்தலைவனுக்கு, பவுலைக் காவலில் வைத்திருக்கவும், அதே வேளையில் அவருக்கு ஓரளவு தளர்வு அளிக்கவும்[a], அவரைச் சேர்ந்தவர்களில் யாரையும் அவருக்கு உதவி செய்யத் தடுக்காமலிருக்கவும் கட்டளையிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓரளவு இலகுவாக இருக்க அனுமதிக்கவும்” அல்லது “ஓரளவு சுதந்திரம் அளிக்கவும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் நிவாரணம், இலகு நிலை, அல்லது கடுமையான கட்டுப்பாட்டிலிருந்து ஒரு அளவு விடுபாடு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: கட்டளையிட்டான்
  rationale: கிரேக்க இறந்தகாலப் பங்கேற்புவினையைத் தமிழின் இயல்பான கதைநடைக்கு ஏற்ற முற்றுவினையாக வழங்குகிறது; அதிகாரபூர்வ ஆணையின் வலிமையையும் காக்கிறது.
- source_word: τῷ ἑκατοντάρχῃ
  choice: நூற்றுவர் படைத்தலைவனிடம்
  rationale: ரோமப் படையில் ஏறத்தாழ நூறு வீரர்களுக்குத் தலைமை வகித்த அதிகாரியைக் குறிக்கும் பதவியை நவீன வாசகர் புரிந்துகொள்ளும் வகையில் துல்லியமாக வழங்குகிறது.
- source_word: τηρεῖσθαι αὐτόν
  choice: பவுலைக் காவலில் வைத்திருக்கவும்
  rationale: τηρέω இங்கு வெறுமனே கண்காணிப்பதை அல்ல, அதிகாரபூர்வக் காவலில் வைத்திருப்பதைக் குறிக்கிறது. முந்தைய சூழலில் சுட்டுப்பெயரின் குறிப்பு பவுல் என்பது தெளிவாக இருப்பதால் அவரது பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἔχειν τε ἄνεσιν
  choice: அவருக்கு ஓரளவு தளர்வு அளிக்கவும்
  rationale: ἄνεσις என்பது நிவாரணம், இலகு நிலை, அல்லது கட்டுப்பாட்டிலிருந்து ஒரு அளவு விடுபாடு எனப் பொருள்படலாம். முழுமையான விடுதலை என்று மிகைப்படுத்தாமல், காவலின் கடுமை தளர்த்தப்பட்டதை இந்த மொழிபெயர்ப்பு உணர்த்துகிறது.
- source_word: τε ... καὶ
  choice: அதே வேளையில் ... -வும்
  rationale: காவலில் வைத்திருத்தலுக்கும் அனுமதிக்கப்பட்ட தளர்வுக்கும் இடையிலான நடைமுறை மாறுபாட்டை இயல்பான தமிழில் காட்டுகிறது; பின்னர் வரும் இரண்டாவது கட்டளையையும் இணைக்கிறது.
- source_word: μηδένα κωλύειν
  choice: யாரும் ... தடுக்காமலிருக்கவும்
  rationale: ஒருவரைக்கூடத் தடுக்கக் கூடாது என்ற கிரேக்கத்தின் முழுமையான எதிர்மறைப் பொருளை இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
- source_word: τῶν ἰδίων αὐτοῦ
  choice: அவரைச் சேர்ந்தவர்களில்
  rationale: குடும்பத்தினர், நண்பர்கள் என்று தேவையின்றிக் குறுக்காமல், பவுலோடு தொடர்புடைய அவரது சொந்த வட்டத்தாரைக் குறிக்கும் கிரேக்கச் சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: அவரது தேவைகளைக் கவனிப்பதை
  rationale: சிறைக்காவல் சூழலில் உணவு, பொருள் அல்லது பிற நடைமுறை உதவிகளைச் செய்வதைக் குறிக்கிறது; சமயப் பணிக்குரிய சிறப்புப் பொருளைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
