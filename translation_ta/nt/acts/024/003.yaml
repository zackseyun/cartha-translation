  text: πάντῃ τε καὶ πανταχοῦ ἀποδεχόμεθα, κράτιστε Φῆλιξ, μετὰ πάσης εὐχαριστίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/003.yaml
  text: In every way and everywhere we acknowledge this[a], most excellent Felix, with all gratitude.
translation:
  language: ta
  text: மாண்புமிகு பெலிக்ஸே, இதை எல்லா வகையிலும் எங்கும் மிகுந்த நன்றியுடன் ஏற்றுக்கொள்கிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதை ஒப்புக்கொள்கிறோம்” அல்லது “இதை வரவேற்கிறோம்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஏற்றுக்கொள்வதையோ வரவேற்பதையோ குறிக்கலாம்; இங்கு பெலிக்ஸால் கிடைத்ததாகக் கூறப்படும் நன்மைகளை வெளிப்படையாக ஒப்புக்கொள்வது என்ற பொருளும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντῃ
  choice: எல்லா வகையிலும்
  rationale: ‘ஒவ்வொரு விதத்திலும் / எல்லா வகையிலும்’ என்ற பரப்பைத் தருகிறது; காலத்தைச் சுட்டும் ‘எப்போதும்’ என்பதைவிட இச்சூழலுக்கு இது பொருத்தமானது.
- source_word: τε καὶ
  choice: …உம் …உம்
  rationale: πάντῃ, πανταχοῦ ஆகிய இரு கூறுகளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: πανταχοῦ
  choice: எங்கும்
  rationale: இடம் சார்ந்த முழுப் பரப்பையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀποδεχόμεθα
  choice: ஏற்றுக்கொள்கிறோம்
  rationale: இந்த வினைச்சொல்லின் அடிப்படை ‘ஏற்றுக்கொள்ளுதல் / வரவேற்றல்’ என்ற பொருளைத் தக்கவைக்கிறது. முன் வசனத்தில் பெலிக்ஸுக்குச் சாட்டப்பட்ட நன்மைகளை ஒப்புக்கொள்வதையும் இச்சூழலில் உணர்த்தலாம்; அந்த நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κράτιστε
  choice: மாண்புமிகு
  rationale: உயர் அதிகாரிக்குரிய மரியாதைமிக்க விளிப்பை நவீன, கண்ணியமான தமிழில் இயல்பாகத் தருகிறது.
- source_word: Φῆλιξ
  choice: பெலிக்ஸ்
  rationale: கிரேக்கப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: μετὰ πάσης εὐχαριστίας
  choice: மிகுந்த நன்றியுடன்
  rationale: πάσης உணர்த்தும் நிறைவையும், εὐχαριστίας என்பதன் நன்றியுணர்வையும் இயல்பான தமிழில் தெரிவிக்கிறது.
