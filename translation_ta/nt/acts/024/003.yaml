translation_notes:
  register: நீதிமன்ற உரையின் மரியாதைமிக்க, புகழ்ச்சிச் சாயலுள்ள நடையைத் தக்கவைத்து, சாதாரண நவீன தமிழ் வாசகருக்கு இயல்பாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் சொல் வரிசையை அப்படியே பின்பற்றாமல், தமிழ் விளிப்புக்கும் வாக்கிய ஓட்டத்துக்கும் ஏற்ற வரிசை அமைக்கப்பட்டுள்ளது.
