revisions:
- from: கடவுள்மேல் நம்பிக்கை வைத்திருக்கிறேன். இவர்களும் ஏற்றுக்கொள்ளும் அந்த நம்பிக்கை என்னவென்றால், நீதிமான்களும் அநீதிமான்களும் உயிர்த்தெழுவார்கள்[a] என்பதே.
  to: 'கடவுள்மீது நம்பிக்கை கொண்டிருக்கிறேன்; இவர்களும் தாமே ஏற்றுக்கொள்ளும்[a] நம்பிக்கை இதுவே: நீதிமான்களுக்கும் அநீதிமான்களுக்கும் உயிர்த்தெழுதல் நிகழப்போகிறது.'
  rationale: The revision retains the Greek participial claim as a natural Tamil first-person statement, keeps the relative clause tied to “நம்பிக்கை,” represents the emphasis in καὶ αὐτοὶ οὗτοι with “இவர்களும் தாமே,” and restores the explicit noun-event sense and prospective force of ἀνάστασιν μέλλειν ἔσεσθαι. It does not add any doctrinal conclusion about the manner, timing, or consequences of the resurrection.
