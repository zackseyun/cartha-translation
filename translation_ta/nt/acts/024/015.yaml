review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys hope directed toward God, the shared expectation, and the inclusion of both righteous and unrighteous. However, its final finite plural verb (“will rise”) recasts the Greek’s explicit resurrection-event noun somewhat more freely than necessary, and the future force of μέλλειν ἔσεσθαι is better retained by “is going to occur.”
  naturalness: The draft is generally clear, but the relation between the hope and its content is smoother in one Tamil sentence with a colon. “கடவுள்மீது நம்பிக்கை கொண்டிருக்கிறேன்” is natural modern standard Tamil.
  terminology: “உயிர்த்தெழுதல்” is the appropriate standard rendering of ἀνάστασις. “நீதிமான்கள்” and “அநீதிமான்கள்” preserve the moral contrast. The footnote should be anchored directly to “ஏற்றுக்கொள்ளும்,” the rendering of προσδέχονται.
  issues:
  - severity: medium
    issue: The wording “நீதிமான்களும் அநீதிமான்களும் உயிர்த்தெழுவார்கள்” changes the Greek resurrection-event construction into a statement about the two groups acting as subjects.
    rationale: ἀνάστασιν ... δικαίων τε καὶ ἀδίκων means “a resurrection of the righteous and unrighteous.” Tamil can preserve this naturally as “நீதிமான்களுக்கும் அநீதிமான்களுக்கும் உயிர்த்தெழுதல் நிகழப்போகிறது.”
  - severity: low
    issue: The lexical-alternative footnote is not anchored at the Tamil rendering of προσδέχονται.
    rationale: Placing [a] after “ஏற்றுக்கொள்ளும்” makes the referenced lexical choice unambiguous.
