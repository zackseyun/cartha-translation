source:
  edition: SBLGNT
  text: ἐλπίδα ἔχων εἰς τὸν θεόν, ἣν καὶ αὐτοὶ οὗτοι προσδέχονται, ἀνάστασιν μέλλειν ⸀ἔσεσθαι δικαίων τε καὶ ἀδίκων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: ta
  text: 'கடவுள்மீது நம்பிக்கை கொண்டிருக்கிறேன்; இவர்களும் தாமே ஏற்றுக்கொள்ளும்[a] நம்பிக்கை இதுவே: நீதிமான்களுக்கும் அநீதிமான்களுக்கும் உயிர்த்தெழுதல் நிகழப்போகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இவர்களும் தாமே எதிர்பார்க்கிற.’ இங்குள்ள கிரேக்க வினைச்சொல் ‘ஏற்றுக்கொள்’ என்றும் ‘எதிர்பார்/எதிர்நோக்கு’ என்றும் பொருள்படலாம்; இச்சூழலில் அது பகிரப்பட்ட எதிர்பார்ப்பை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: கடவுள்மேல் நம்பிக்கை வைத்திருக்கிறேன்
  rationale: நம்பிக்கையின் இலக்கு கடவுள் என்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ἐλπίδα ἔχων என்பதிலுள்ள பெயர்ச்சொல் சார்ந்த அமைப்பையும் முடிந்தவரை தக்கவைக்கிறது.
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: இவர்களும் ஏற்றுக்கொள்ளும் அந்த நம்பிக்கை
  rationale: ἣν என்பது முன்சொன்ன நம்பிக்கையைக் குறிக்கிறது. αὐτοὶ οὗτοι தரும் சுட்டும் வலியுறுத்தலும் ‘இவர்களும்’ என்பதில் இயல்பாக வெளிப்படுகின்றன. προσδέχονται என்பதற்கு இச்சூழலில் பகிரப்பட்ட நம்பிக்கையை ஒப்புக்கொள்ளுதல் என்ற பொருளில் ‘ஏற்றுக்கொள்ளும்’ என மொழிபெயர்க்கப்பட்டது; ‘எதிர்பார்த்துக் காத்திருக்கும்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀνάστασιν μέλλειν ἔσεσθαι
  choice: உயிர்த்தெழுவார்கள் என்பதே
  rationale: ἀνάστασις என்பதன் நிகழ்வை நவீனத் தமிழில் இயல்பாக வினை வடிவில் கூறுகிறது. μέλλειν ἔσεσθαι குறிக்கும் எதிர்கால நிகழ்வைத் தெளிவாகத் தருகிறது; தேவையற்ற உடனடித்தன்மையைச் சேர்க்கவில்லை.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: நீதிமான்களும் அநீதிமான்களும்
  rationale: τε καὶ இணைக்கும் இரு குழுக்களையும் சமமாகப் பாதுகாத்து, ஒழுக்கநிலை சார்ந்த நேரெதிர் வேறுபாட்டை தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: உயிர்த்தெழுதலின் வரம்பு
  choice: நீதிமான்களும் அநீதிமான்களும் உயிர்த்தெழுவார்கள்
  alternative: ஒழுக்கநிலை வேறுபாட்டை வலியுறுத்தாத பொதுவான உயிர்த்தெழுதல்
  rationale: கிரேக்க உரை நீதிமான்கள், அநீதிமான்கள் ஆகிய இரு குழுக்களையும் வெளிப்படையாகக் குறிப்பிடுகிறது. அவர்களின் உயிர்த்தெழுதலின் காலம், வரிசை, அல்லது தீர்ப்பின் முறை பற்றி உரையில் இல்லாத கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்றச் சூழலுக்கு ஏற்ற கண்ணியமான மற்றும் பொதுமக்களுக்கு எளிதில் புரியும் நடை. நீண்ட கிரேக்கத் தொடரை இயல்பான இரு தமிழ் வாக்கியங்களாக அமைத்துள்ளது; உண்மையான சொற்பொருள் இருமை அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
