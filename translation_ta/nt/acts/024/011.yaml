id: ACT.24.11
reference: Acts 24:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δυναμένου σου ⸀ἐπιγνῶναι, ὅτι οὐ πλείους εἰσίν μοι ἡμέραι ⸀δώδεκα ἀφ’ ἧς ἀνέβην προσκυνήσων ⸀εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/011.yaml
  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: ta
  text: 'நீர் இதை விசாரித்து அறிந்துகொள்ள முடியும்[a]: நான் வழிபடுவதற்காக எருசலேமுக்கு ஏறிச் சென்றதிலிருந்து பன்னிரண்டு நாட்களுக்கு மேல் ஆகவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் இதை உறுதிப்படுத்திக்கொள்ள முடியும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: நீர் இதை விசாரித்து அறிந்துகொள்ள முடியும்
  rationale: ஆளுநர் நிகழ்வுகளின் உண்மையை விசாரித்து உறுதிசெய்ய முடியும் என்ற நீதிமன்றச் சூழலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. கிரேக்கத் தொடரின் சூழ்நிலை சார்ந்த பொருளைத் தக்கவைத்து, காரணத் தொடர்பை மிகைப்படுத்தவில்லை.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: பன்னிரண்டு நாட்களுக்கு மேல் ஆகவில்லை
  rationale: ‘எனக்குப் பன்னிரண்டு நாட்களுக்கு மேல் இல்லை’ என்ற கிரேக்க மரபுத்தொடரின் கடந்தகால அளவைக் குறிக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀφ’ ἧς
  choice: …திலிருந்து
  rationale: காலக்கணக்கின் தொடக்கப் புள்ளியைக் குறிக்கும் கிரேக்கத் தொடருக்கு நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: ἀνέβην
  choice: ஏறிச் சென்றதிலிருந்து
  rationale: எருசலேமுக்குச் ‘செல்வதை’ உயரே செல்வதாகக் குறிப்பிடும் மூலமொழி மரபைத் தக்கவைக்கிறது.
- source_word: προσκυνήσων
  choice: வழிபடுவதற்காக
  rationale: எதிர்காலப் பெயரெச்சம் குறிக்கும் நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கடவுளை’ என்ற செயப்படுபொருளைச் சேர்க்கவில்லை.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமுக்கு
  rationale: நகரத்தை நோக்கிய இலக்கை இயல்பான தமிழில் குறிக்கிறது.
