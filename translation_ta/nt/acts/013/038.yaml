  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: ta
  text: ஆகவே, சகோதரர்களே[a], இவர்[b] மூலமாகப் பாவங்களுக்கான மன்னிப்பு உங்களுக்கு அறிவிக்கப்படுகிறது என்பதையும், மோசேயின் சட்டத்தால் எவற்றிலிருந்தெல்லாம் நீங்கள் நீதிமானாகத் தீர்க்கப்பட முடியவில்லையோ, அவை அனைத்திலிருந்தும் அவரை நம்புகிற ஒவ்வொருவரும் நீதிமானாகத் தீர்க்கப்படுகிறார்[c] என்பதையும் நீங்கள் அறிந்துகொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கூடியிருந்த அனைவரையும் உள்ளடக்கிய அழைப்பாக இதைப் புரிந்துகொண்டால், ‘சகோதர சகோதரிகளே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இவர்’ என்பது சற்றுமுன் குறிப்பிடப்பட்ட இயேசுவைக் குறிக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, ‘நீதிமானாகக் கருதப்படுகிறார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: ஆகவே ... நீங்கள் அறிந்துகொள்ளுங்கள்
  rationale: οὖν என்பதன் முடிவுரைத் தொடர்பை ‘ஆகவே’ காட்டுகிறது; impersonal imperative அமைப்பின் அறிவிப்புத் தீவிரத்தை இயல்பான நவீன தமிழில் ‘நீங்கள் அறிந்துகொள்ளுங்கள்’ என வழங்குகிறது.
- source_word: ἄνδρες ἀδελφοί
  choice: சகோதரர்களே
  rationale: நேரடி அழைப்பையும் மூலத்தின் ஆண்பால் பன்மையையும் காக்கிறது; கூடியிருந்த அனைவரையும் உள்ளடக்கும் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: διὰ τούτου
  choice: இவர் மூலமாக
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயரையும் இடைமுகப் பொருளையும் இயல்பாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘மனிதர்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: பாவங்களுக்கான மன்னிப்பு
  rationale: இச்சூழலில் ἄφεσις என்பதன் விடுவித்தல்/மன்னித்தல் பொருளை ordinary modern Tamil-இல் தெளிவாக வழங்குகிறது.
- source_word: καταγγέλλεται
  choice: அறிவிக்கப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் பொதுவான பிரகடனத்தின் பொருளையும் தெளிவான தமிழில் காக்கிறது.
- source_word: ἀπὸ πάντων ὧν
  choice: எவற்றிலிருந்தெல்லாம் ... அவை அனைத்திலிருந்தும்
  rationale: மூலத்தின் தொடர்புச் சொற்றொடரையும் ἀπό என்பதன் ‘இலிருந்து’ பொருளையும் தமிழ் வாக்கிய அமைப்பில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: οὐκ ἠδυνήθητε
  choice: நீங்கள் ... முடியவில்லையோ
  rationale: கடந்தகால இயலாமையை இயல்பாகக் காட்டி, தொடர்புச் சொற்றொடருடன் நன்றாக இணைகிறது.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: மோசேயின் சட்டத்தால்
  rationale: ἐν இங்கு கருவி அல்லது செயல்படும் வட்டம் சார்ந்த பொருளைக் கொண்டிருப்பதால், ‘சட்டத்தால்’ என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: δικαιωθῆναι / δικαιοῦται
  choice: நீதிமான்கள் என்று தீர்ப்புப் பெற / நீதிமான் என்று தீர்ப்புப் பெறுகிறார்
  rationale: δικαιόω என்பதன் நீதிமன்றத் தீர்ப்பு சார்ந்த வலிமையை வெளிப்படுத்துகிறது; வெறும் ஒழுக்க மாற்றமாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: δικαιόω என்பதன் பொருள்
  choice: நீதிமான் என்று தீர்ப்புப் பெறுதல்
  alternative: நீதிமானாக்கப்படுதல்
  rationale: இச்சூழலில் மோசேயின் சட்டத்தால் கிடைக்காததும் இயேசுவின் வழியாக விசுவாசிக்கிறவருக்குக் கிடைப்பதுமான நீதித் தீர்ப்பு சார்ந்த நிலையை முதன்மைப்படுத்துகிறது; மாற்றுச் சொல்வழக்கு அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ἄνδρες ἀδελφοί என்ற பாலினக் குறியுடைய அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவத்தை முதன்மை உரையில் காத்து, கூட்டத்தாரை உள்ளடக்கிய அழைப்பாகப் புரிந்துகொள்ளும் வாய்ப்பை அடிக்குறிப்பில் தருகிறது.
- issue: διὰ τούτου என்பதன் குறிப்பிடுபவர்
  choice: இவர்
  alternative: இயேசு
  rationale: மூலத்தின் சுட்டுப்பெயரை முதன்மை உரையில் காக்கிறது; அது முன்பு குறிப்பிடப்பட்ட இயேசுவைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘நீதிமான் என்று தீர்ப்புப் பெறுதல்’ என்பது இறையியல் செறிவைத் தக்கவைத்தபடியே நீதிமன்றத் தீர்ப்பு சார்ந்த நுணுக்கத்தைத் தெளிவாக்குகிறது. வழங்கப்பட்ட கிரேக்கத் துணுக்கு அடுத்த வசனத்திற்குள் தொடரும் முழுமையற்ற வாக்கியமாக இருப்பதால், ஆலோசனை ஆங்கில உரையில் உறுதிப்படுத்தப்பட்ட தொடர்ச்சியான ‘விசுவாசிக்கிற ஒவ்வொருவரும்...’ என்ற நிறைவு இங்கு சேர்க்கப்பட்டுள்ளது.
