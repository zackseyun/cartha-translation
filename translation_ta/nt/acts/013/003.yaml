  choice: வேண்டுதல் செய்து
  rationale: இறைவேண்டலைக் குறிக்கும் கிரேக்கச் சொல்லை மதிப்பும் பொதுவான புரிதலும் கொண்ட தமிழில் தருகிறது; மற்ற ஆயத்தச் செயல்களுடன் இணைந்த தொடரையும் காக்கிறது.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: அவர்கள்மேல் கைகளை வைத்து
