  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: ta
  text: அப்போது அவர்கள் நோன்பிருந்து, ஜெபித்து, அவர்கள்மேல் கைகளை வைத்து, அவர்களை அனுப்பிவிட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களைப் போகவிட்டார்கள்’ அல்லது ‘அவர்களை விடுவித்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில், பர்னபாவையும் சவுலையும் பணிக்காகப் புறப்பட அனுப்பினார்கள் என்பதே கருத்து.
    reason: lexical_alternative
