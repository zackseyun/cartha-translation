theological_decisions:
- issue: கைகளை வைத்த செயலின் தன்மை
  choice: ஒரு குறிப்பிட்ட சடங்கு அல்லது பதவியளிப்பு கோட்பாட்டைச் சேர்க்காமல், செயலை ‘அவர்கள்மேல் கைகளை வைத்து’ என்று விவரித்தல்
  alternative: ‘திருநிலைப்படுத்தி’, ‘ஆசீர்வதித்து’ அல்லது ‘முறைப்படி பணியமர்த்தி’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனம் நோன்பு, வேண்டுதல், கைகளை வைத்தல், அனுப்புதல் ஆகியவற்றை விவரிக்கிறது; ஆனால் கைகளை வைத்ததன் துல்லியமான திருச்சபை அல்லது திருவருட்சாதனப் பொருளை வரையறுக்கவில்லை. எனவே மூலத்தின் இறையியல் திறந்தநிலை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மதிப்பான நடையைப் பயன்படுத்துகிறது. ‘நோன்பிருந்து’ என்பது ‘உபவாசித்து’ என்பதைக் காட்டிலும் பொதுவான தற்போதைய தமிழ்; ‘வேண்டுதல் செய்து’ என்பது ஒரு குறிப்பிட்ட பிரிவின் வழக்குச் சொல்லைத் தவிர்க்கிறது. கிரேக்கத்தில் உள்ள பங்கேற்புச் செயல்களின் வரிசையும் பன்மைச் சுட்டுப்பெயர்களும் பாதுகாக்கப்பட்டுள்ளன.
