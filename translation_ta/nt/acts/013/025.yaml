    issue: Awkward literal expression for the sandals clause
    rationale: “அவருடைய கால்களின் செருப்புகளை” mirrors the Greek wording too mechanically. “அவருடைய கால்களில் உள்ள செருப்புகளைக்” is natural modern Tamil while retaining the reference to his feet and footwear.
