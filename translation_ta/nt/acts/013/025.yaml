source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: ta
  text: யோவான் தனக்குரிய ஓட்டத்தை நிறைவு செய்துகொண்டிருந்தபோது, “என்னை யாரென்று நினைக்கிறீர்கள்? நான் அவர் அல்ல.[a] ஆனால் பாருங்கள், எனக்குப் பின் ஒருவர் வருகிறார்; அவருடைய கால்களில் உள்ள செருப்புகளைக் கூட அவிழ்க்க நான் தகுதியானவன் அல்ல.[b]” என்று சொல்லிவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, “என்னை யாரென்று நினைக்கிறீர்கள்? நான் மெசியா அல்ல” எனப் பொருள் கொள்ளலாம். கிரேக்க உரை யாருடைய அடையாளம் மறுக்கப்படுகிறது என்பதை மறைமுகமாக விட்டிருக்கிறது; எனினும் சூழல் மெசியாவைச் சுட்டுகிறது.
    reason: alternative_reading
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளும் மொழிபெயர்ப்புகளும் இதை இன்னும் குறிப்பாக, “அவருடைய செருப்புகளின் வாரை அவிழ்க்க” என்று வழங்குகின்றன. ஆனால் இங்கு அச்சிடப்பட்டுள்ள கிரேக்க உரை, “அவருடைய கால்களின் செருப்பை/செருப்புகளை ... அவிழ்க்க” என்று மட்டுமே கூறுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: தனக்குரிய ஓட்டத்தை நிறைவு செய்துகொண்டிருந்தபோது
  rationale: πληρόω நிறைவுக்குக் கொண்டுவருவதையும், δρόμος உருவகமாக நியமிக்கப்பட்ட வாழ்க்கைப் பணி அல்லது ஊழியப் பயணத்தையும் குறிக்கிறது. ‘ஓட்டம்’ என்ற சொல் மூல உருவகத்தைப் பேணுகிறது; ‘நிறைவு செய்துகொண்டிருந்தபோது’ என்பது முற்றுப்பெறாத இறந்தகாலச் செயற்பாங்கை வெளிப்படுத்துகிறது.
- source_word: ἔλεγεν
  choice: சொல்லிவந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்து அல்லது மீண்டும் மீண்டும் சொல்லப்பட்ட சாட்சியைச் சுட்டுகிறது; ‘சொல்லிவந்தார்’ இதை இயல்பான தமிழில் தருகிறது.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: என்னை யாரென்று நினைக்கிறீர்கள்?
  rationale: ὑπονοέω இங்கு ஒருவரின் அடையாளத்தை ஊகிப்பதை அல்லது கருதுவதைச் சுட்டுகிறது. கிரேக்கத்தில் τί (‘என்ன’) இருந்தாலும், தனிப்பட்ட அடையாளத்தைப் பற்றிய கேள்விக்கு ‘என்னை யாரென்று’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: நான் அவர் அல்ல
  rationale: கிரேக்கம் எதிர்பார்க்கப்பட்ட நபரின் அடையாளத்தை வெளிப்படையாகக் கூறாமல் விடுகிறது; ‘நான் அவர் அல்ல’ அதன் சுருக்கத்தையும் மறைமுகத்தையும் பேணுகிறது.
- source_word: ἀλλ’ ἰδοὺ
  choice: ஆனால் பாருங்கள்
  rationale: ἰδού கவனத்தை ஈர்க்கும் உரையாடல் குறியீடு. ‘பாருங்கள்’ என்பது பழமையான நடையின்றி அதன் நேரடி அழைப்புத் தன்மையைத் தருகிறது.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: எனக்குப் பின் ஒருவர் வருகிறார்
  rationale: நிகழ்கால வடிவம் வருகையின் உடனடியான அல்லது உயிரோட்டமான தன்மையைத் தருகிறது; மறைந்துள்ள எழுவாயைத் தமிழில் ‘ஒருவர்’ என வெளிப்படுத்துவது இயல்பானது.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: அவருடைய கால்களின் செருப்புகளை அவிழ்க்க
  rationale: அச்சிடப்பட்ட கிரேக்க உரையில் ὑπόδημα என்பது ஒருமை பொதுப்பெயராகவும் τῶν ποδῶν என்பது ‘கால்களின்’ என்றும் உள்ளது. தமிழில் பன்மையான ‘செருப்புகளை’ என்பது இயல்பானது; உரையில் இல்லாத ‘வார்’ என்பதைக் பிரதான மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: ἄξιος
  choice: தகுதியானவன்
  rationale: ἄξιος தகுதி அல்லது ஏற்ற நிலையைக் குறிக்கிறது. ‘தகுதியானவன் அல்ல’ யோவானின் தாழ்மைக் கூற்றைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: οὐκ εἰμὶ ἐγώ என்பதில் யோவான் மறுக்கும் அடையாளம்
  choice: பிரதான உரையில் ‘நான் அவர் அல்ல’ என்று மறைமுகமாகவே வைத்தல்
  alternative: ‘நான் மெசியா அல்ல’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழல் மெசியாவையே சுட்டுவதாக இருந்தாலும், கிரேக்க உரை அந்த அடையாளத்தை வெளிப்படையாகப் பெயரிடவில்லை. ஆகவே பிரதான உரை அதன் உண்மையான மறைமுகத்தையும் இறையியல் இழுவிசையையும் பேணுகிறது; அடிக்குறிப்பு சாத்தியமான குறிப்பை விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஓட்டம்’ என்ற மூல உருவகம் பேணப்பட்டுள்ளது; ‘இதோ’ என்பதைக் காட்டிலும் பேசுபவரின் கவன ஈர்ப்பை இயல்பாகத் தர ‘பாருங்கள்’ தேர்ந்தெடுக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களின் பின்னரே வைக்கப்பட்டுள்ளன.
