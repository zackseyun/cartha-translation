id: ACT.13.5
reference: Acts 13:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: ta
  text: அவர்கள் சலாமிஸில் வந்து சேர்ந்தபோது[a], யூதர்களின் ஜெபக்கூடங்களில் கடவுளின் வார்த்தையை அறிவித்தார்கள். மேலும், யோவானை உதவியாளராகவும் உடன் வைத்திருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சலாமிஸுக்கு வந்தபின்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “துணைவராக” அல்லது “பணியாளராக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: சலாமிக்கு வந்து சேர்ந்தபோது
  rationale: இடத்தைக் குறிக்கும் ἐν உடன் வரும் γενόμενοι இங்கு சலாமிக்கு வந்து சேர்ந்ததைக் குறிக்கிறது. காலத் தொடர்புடைய பங்கேற்புவினையின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατήγγελλον
  choice: அறிவித்தார்கள்
  rationale: καταγγέλλω பொதுவெளியில் அறிவிப்பதையோ பிரகடனம் செய்வதையோ குறிக்கிறது. குறிப்பாகப் பிரசங்க வடிவை மட்டும் உணர்த்தாமல் அதன் பரந்த பொருளை இச்சொல் காக்கிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளின் வார்த்தை
  rationale: மூலத்தின் உடைமைத் தொடர்பை வெளிப்படையாகக் காத்து, கடவுளிடமிருந்து வரும் செய்தி அல்லது வெளிப்பாட்டைக் கூடுதலாக விளக்காமல் தருகிறது.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: யூதர்களின் தொழுகைக்கூடங்களில்
  rationale: இச்சூழலில் συναγωγαί என்பது யூதர்களின் வழிபாட்டு மற்றும் கூடுகை இடங்களைக் குறிக்கிறது. ‘தொழுகைக்கூடங்கள்’ என்பது சாதாரண தமிழ் வாசகர்களுக்குப் புரியக்கூடிய, நிலைபெற்ற சொல்.
- source_word: εἶχον δὲ καὶ Ἰωάννην
  choice: மேலும், யோவானைத் ... கொண்டிருந்தார்கள்
  rationale: δέ குறிக்கும் மென்மையான தொடர்ச்சியையும் καί குறிக்கும் கூடுதல் தகவலையும் ‘மேலும்’ தெரிவிக்கிறது; யோவான் அவர்களுடன் ஒரு குறிப்பிட்ட பணிப்பங்கில் இருந்ததையும் வாக்கிய அமைப்பு காக்கிறது.
- source_word: ὑπηρέτην
  choice: உதவியாளராக
  rationale: ὑπηρέτης இங்கு துணைபுரிபவர் அல்லது பணியாளர் என்ற பொருளைக் கொண்டது. ‘உதவியாளர்’ பயண-ஊழியச் சூழலுக்கு இயல்பாக இருந்து, அடிமைத்தனத்தைத் தேவையின்றி உணர்த்துவதில்லை.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடவுளின் வார்த்தை’ என்ற மரபான சொற்றொடர் மூலத்தின் இறையியல் திறந்தநிலையைப் பேணுகிறது. ஆங்கில ஆலோசனை உரையில் [b] குறி ‘யூதர்கள்’ என்பதற்குப் பின் இருந்தாலும், அதற்குரிய அடிக்குறிப்பு ὑπηρέτην பற்றியது என்பதால் தமிழில் அது ‘உதவியாளராக’ என்பதற்குப் பின் சரியாக வைக்கப்பட்டுள்ளது.
