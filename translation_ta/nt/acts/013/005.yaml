revisions:
- from: அவர்கள் சலாமிக்கு வந்து சேர்ந்தபோது[a], யூதர்களின் தொழுகைக்கூடங்களில் கடவுளின் வார்த்தையை அறிவித்தார்கள். மேலும், யோவானைத் தங்கள் உதவியாளராகக் கொண்டிருந்தார்கள்[b].
  to: அவர்கள் சலாமிஸில் வந்து சேர்ந்தபோது[a], யூதர்களின் ஜெபக்கூடங்களில் கடவுளின் வார்த்தையை அறிவித்தார்கள். மேலும், யோவானை உதவியாளராகவும் உடன் வைத்திருந்தார்கள்[b].
  rationale: The revision corrects the Tamil form of Salamis and reflects the locative construction in the Greek. It also uses a clearer modern Tamil term for Jewish synagogues. “உதவியாளராகவும் உடன் வைத்திருந்தார்கள்” retains εἶχον (“they had”) and the additive force of καὶ without assigning a more specific ecclesial office to John.
