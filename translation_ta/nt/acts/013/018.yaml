  yaml_path: translation/nt/acts/013/018.yaml
  text: And for about forty years he put up with them in the wilderness[a].
translation:
  language: ta
  text: மேலும், அவர் சுமார் நாற்பது ஆண்டுகள் பாலைநிலத்தில் அவர்களைப் பொறுத்துக்கொண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘அவர்களைப் பொறுத்துக்கொண்டார்’ என்பதற்குப் பதிலாக, ‘அவர்களைப் பராமரித்தார்’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: καί
  choice: அவர்
  rationale: καί முந்தைய வரலாற்றுக் கூற்றைத் தொடரும் இணைப்புச்சொல். தனி வசனமாக இயல்பான தமிழில் வாசிக்கும்போது வெளிப்படையான ‘மேலும்’ தேவையில்லை; வினையின் எழுவாயைத் தெளிவாக்க ‘அவர்’ சேர்க்கப்படுகிறது.
- source_word: ὡς
  choice: சுமார்
  rationale: கால அளவுடன் வரும் ὡς தோராயத்தைக் குறிக்கிறது; ‘சுமார்’ அந்த நுணுக்கத்தை இயல்பாகக் காக்கிறது.
- source_word: τεσσερακονταετῆ χρόνον
  choice: நாற்பது ஆண்டுகள்
  rationale: நாற்பது ஆண்டுகளைக் கொண்ட காலப்பகுதியைக் குறிக்கிறது; தமிழில் இவ்வடிவமே இயல்பானது.
- source_word: ἐτροποφόρησεν
  choice: பொறுத்துக்கொண்டார்
  rationale: SBLGNT அச்சுப் பாடத்திலுள்ள τροποφορέω என்பது ஒருவரின் நடத்தையைச் சகித்தல் அல்லது பொறுத்துக்கொள்ளுதல் என்ற பொருளைத் தருகிறது. மாற்றுப் பாடத்தின் பராமரிக்கும் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: இஸ்ரயேல் மக்களைக் குறிக்கும் பன்மை நேர்செயப்படுபொருள்.
- source_word: ἐν τῇ ἐρήμῳ
  choice: பாலைநிலத்தில்
  rationale: இஸ்ரயேலர் அலைந்து திரிந்த குடியிருப்பற்ற வறண்ட நிலப்பகுதியைக் குறிக்கிறது; ‘பாலைநிலம்’ நவீனத் தமிழில் இயல்பாகவும் வேதாகமப் புவியியல் சூழலைக் காக்கும் வகையிலும் உள்ளது.
theological_decisions:
- issue: பாலைநிலத்தில் இஸ்ரயேலரிடம் கடவுள் நடந்துகொண்ட விதம்
  choice: அவர்களைப் பொறுத்துக்கொண்டார்
  alternative: அவர்களைப் பராமரித்தார்
  rationale: கொடுக்கப்பட்ட SBLGNT பாடம் ἐτροποφόρησεν என்பதால் ‘பொறுத்துக்கொண்டார்’ என்ற பொருள் முதன்மை உரையில் வைக்கப்படுகிறது. ‘பராமரித்தார்’ என்று பொருள்படும் நன்கு அறியப்பட்ட மாற்றுப் பாடம் உள்ளதால், உரைமரபின் வேறுபாடும் அதனால் எழும் இறையியல் நுணுக்கமும் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கடினமான மூலவினையின் முதன்மைப் பொருள் மென்மையாக்கப்படாமல் காக்கப்பட்டு, உரைவேறுபாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
