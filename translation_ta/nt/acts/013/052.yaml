translation:
  language: ta
  text: மேலும், சீடர்கள் மகிழ்ச்சியாலும் பரிசுத்த ஆவியாலும் நிரப்பப்பட்டுக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சீடர்கள் மகிழ்ச்சியாலும் பரிசுத்த ஆவியாலும் நிரப்பப்பட்டார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க இறந்தகால நிறைவுறா வினைவடிவம் தொடர்ந்து அல்லது மீண்டும் நிகழ்ந்த நிரப்புதலை உணர்த்தக்கூடும்; அதை எளிய இறந்தகாலமாகவும் மொழிபெயர்க்கலாம்.
    reason: வினைவடிவத்தின் கால-நிலை சார்ந்த மாற்று மொழிபெயர்ப்பு
lexical_decisions:
- source_word: οἵ τε μαθηταὶ
  choice: சீடர்களும்
  rationale: τε முந்தைய நிகழ்வுடன் இவ்வாக்கியத்தை இணைத்துத் தொடர்ச்சியைக் காட்டுகிறது. தமிழில் ‘சீடர்களும்’ என்பது அந்த இணைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπληροῦντο
  choice: நிரப்பப்பட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால நிறைவுறா வடிவமும் செயப்பாட்டு வினையும், நிரப்பப்படுதல் தொடர்ந்து அல்லது மீண்டும் நிகழ்ந்ததைக் குறிக்கக்கூடும். இந்தத் தமிழ் வடிவம் அந்த இரு அம்சங்களையும் காக்கிறது.
- source_word: χαρᾶς
  choice: மகிழ்ச்சியாலும்
  rationale: χαρά என்பதற்கு இங்கு இயல்பான நேரடி இணை ‘மகிழ்ச்சி’. πληρόω உடன் வரும் உள்ளடக்கத்தைத் தமிழில் கருவிப்பொருள் வேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியாலும்
  rationale: அப்போஸ்தலர் நூலின் சூழலில் இச்சொற்றொடர் திருச்சபையின் பணியில் செயல்படும் தெய்வீகப் பரிசுத்த ஆவியைக் குறிக்கிறது; ‘பரிசுத்த ஆவி’ என்பது தெளிவான, நிலைபெற்ற நவீனத் தமிழ் பயன்பாடு.
theological_decisions:
- issue: πνεύματος ἁγίου என்பது தனிப்பட்ட தெய்வீகப் பரிசுத்த ஆவியைக் குறிக்கிறதா, அல்லது பொதுவான ‘பரிசுத்த ஆவி/ஆவிக்குரிய நிலை’ என்பதைக் குறிக்கிறதா?
  choice: பரிசுத்த ஆவி
  alternative: பரிசுத்தமான ஆவி / பரிசுத்த ஆவிக்குரிய நிலை
  rationale: அப்போஸ்தலர் நூலில் πνεῦμα ἅγιον பொதுவாகத் திருச்சபையின் சாட்சிப்பணியில் செயல்படும் தெய்வீகப் பரிசுத்த ஆவியைக் குறிக்கிறது. எனவே தனிப்பட்ட குறிப்பை மொழிபெயர்ப்பு காக்கிறது; அதற்கு அப்பாற்பட்ட சமயப்பிரிவு சார்ந்த விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நிரப்பப்பட்டுக்கொண்டிருந்தார்கள்’ சற்றே விரிவான வடிவமாக இருந்தாலும், கிரேக்கத்தின் செயப்பாட்டு வினையையும் தொடர்நிலைச் சாத்தியத்தையும் தெளிவாகக் காக்கிறது.
