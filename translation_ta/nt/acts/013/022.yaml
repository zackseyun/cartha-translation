source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: ta
  text: சவுலை நீக்கிய பின்பு, அவர்களுக்காகத் தாவீதை அரசனாக எழுப்பினார். அவரைக் குறித்துச் சாட்சி அளித்து, “ஈசாயின் மகனான தாவீதை நான் கண்டுகொண்டேன்; அவன் என் இதயத்தின்படியான மனிதன்[a]; அவன் என் விருப்பங்கள் அனைத்தையும் நிறைவேற்றுவான்[b]” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இதயத்துக்கு ஏற்ற மனிதன்.” கிரேக்கத்தில் இன்னும் நேரடியாக, “என் இதயத்தின்படியான மனிதன்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘விருப்பங்கள்’ என்ற பெயர்ச்சொல் பன்மையில் உள்ளது; இதை ‘என் சித்தம் முழுவதையும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας
  choice: நீக்கிய பின்பு
  rationale: சவுலை அரச பதவியிலிருந்து கடவுள் அகற்றியதைக் குறிக்கிறது. ‘பதவிநீக்கம் செய்த பின்பு’ என்பது அரசியல் விளக்கத்தை அதிகமாகச் சேர்க்கும்; ‘நீக்கிய பின்பு’ என்பது மூலத்தின் பரந்த பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἤγειρεν
  choice: எழுப்பினார்
  rationale: ஒரு தலைவரை உருவாக்கி முன்நிறுத்துதல் அல்லது ஏற்படுத்துதல் என்ற வேதாகமச் சொல்லாட்சியைப் பாதுகாக்கிறது; தொடர்ந்து வரும் ‘அரசனாக’ என்பது இங்கு உயிர்த்தெழுதலைக் குறிக்கவில்லை என்பதைத் தெளிவாக்குகிறது.
- source_word: αὐτοῖς εἰς βασιλέα
  choice: அவர்களுக்காகத் ... அரசனாக
  rationale: தாவீது இஸ்ரவேலருக்காக அரசனாக ஏற்படுத்தப்பட்டார் என்ற நன்மை/சார்பு நுணுக்கத்தையும், அவருக்குக் கொடுக்கப்பட்ட அரசப் பங்கையும் வெளிப்படுத்துகிறது.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: அவரைக் குறித்துச் சாட்சி அளித்து ... கூறினார்
  rationale: இலக்கண வடிவம் உறவுப்பெயர் சார்ந்த தத்திவில் இருந்தாலும், சூழலில் கடவுள் தாவீதைக் குறித்துச் சாட்சி கூறுகிறார் என்பதே இயல்பான தமிழ் பொருள்.
- source_word: Εὗρον
  choice: நான் கண்டுகொண்டேன்
  rationale: நிறைவுற்ற செயலும் அதன் தற்போதைய முக்கியத்துவமும் தமிழில் இயல்பாக ஒலிக்க இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: τὸν τοῦ Ἰεσσαί
  choice: ஈசாயின் மகனான
  rationale: மூலத்தின் உரிமைவேற்றுமைத் தொடரை தமிழில் தெளிவாகவும் இயல்பாகவும் ‘மகன்’ என வெளிப்படுத்துகிறது.
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: என் இதயத்துக்கு ஏற்ற மனிதன்
  rationale: κατά என்பதின் ஒத்திசைவு/ஏற்பு நுணுக்கத்தைத் தருகிறது; வெறும் உணர்ச்சிப்பூர்வ நெருக்கம் என்று பொருள் குறுகுவதைத் தவிர்க்கிறது.
- source_word: ὃς ποιήσει πάντα τὰ θελήματά μου
  choice: அவன் என் விருப்பங்கள் அனைத்தையும் நிறைவேற்றுவான்
  rationale: θελήματα என்ற பன்மையை ‘விருப்பங்கள்’ எனப் பாதுகாக்கிறது. ποιήσει என்பதன் செயற்பொருள் தமிழில் இத்தொடருடன் இயல்பாக அமைய ‘நிறைவேற்றுவான்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: தாவீதை ‘கடவுளின் இதயத்துக்கு ஏற்றவர்’ என வருணித்தல்
  choice: என் இதயத்துக்கு ஏற்ற மனிதன்
  alternative: என் இதயத்தின்படியான மனிதன் / என் மனதுக்கு உகந்த மனிதன்
  rationale: மூலத்தின் ‘என் இதயத்தின்படி’ என்ற அமைப்பையும் கடவுளின் நோக்கத்துக்கு ஒத்திசைதல் என்ற நுணுக்கத்தையும் காக்கிறது; தாவீதின் முழுமையான பாவமின்மையை இவ்வசனத்தில் சேர்ப்பதில்லை.
- issue: தாவீதை அரசனாக ‘எழுப்பினார்’ என்ற சொல்லாட்சி
  choice: அரசனாக எழுப்பினார்
  alternative: அரசனாக நியமித்தார்
  rationale: ἐγείρω என்ற மூலச் சொல்லின் வேதாகமச் சொல்லாட்சியைப் பாதுகாக்கிறது. ‘அரசனாக’ என்ற சூழல் இது உயிர்த்தெழுதலை அல்ல, ஆட்சியாளராக முன்நிறுத்துதலைக் குறிக்கிறது என்பதை விளக்குகிறது.
- issue: θελήματα என்ற பன்மை
  choice: என் விருப்பங்கள் அனைத்தையும்
  alternative: என் சித்தம் முழுவதையும்
  rationale: மூல கிரேக்கத்தின் பன்மையைத் தெளிவாக வைத்திருக்கிறது; கடவுளின் பல்வேறு விருப்பங்கள் அல்லது நோக்கங்களை ஒரே சுருக்கச் சொல்லாக மாற்றுவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘எழுப்பினார்’ போன்ற மூலச் சொல்லாட்சியைச் சூழல் தெளிவுடன் வைத்திருக்கிறது; ‘சித்தங்கள்’ போன்ற இயல்பற்ற சமய வழக்கைத் தவிர்த்து, பன்மையை ‘விருப்பங்கள்’ எனக் காட்டுகிறது. மேற்கோளின் பேச்சாளர் கடவுள் என்பது முந்தைய சூழலிலிருந்து தொடர்வதால் தேவையற்ற பெயர்ச்சேர்ப்பு செய்யப்படவில்லை.
