id: ACT.13.23
reference: Acts 13:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: ta
  text: தேவன், வாக்குறுதியின்படி[a], இவருடைய சந்ததியிலிருந்து[b] இஸ்ரயேலுக்கு மீட்பராக இயேசுவைக் கொண்டுவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வாக்குறுதிக்கு ஏற்ப’ அல்லது ‘வாக்குறுதி அளித்தபடியே’.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘இவருடைய விதையிலிருந்து’; இங்கு இது தாவீதின் வழிவந்த சந்ததியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: இவருடைய
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தாவீதைச் சுட்டும் ஒருமை உரிமைவேற்றுமைச் சுட்டுப்பெயர். தமிழில் ‘இவருடைய’ என்பது அந்தத் தொடர்பை இயல்பாகவும் மரியாதையான நடையிலும் காட்டுகிறது.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: சந்ததியிலிருந்து
  rationale: σπέρμα என்பதன் அடிப்படைப் பொருள் ‘விதை’; இங்கு அது தாவீதின் வழிவந்த சந்ததியை அல்லது மரபுவழியை குறிக்கிறது. ‘சந்ததியிலிருந்து’ என்பது உருவகத்தின் வம்சப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: κατ’ ἐπαγγελίαν
  choice: வாக்குறுதியின்படி
  rationale: முன்னர் அளிக்கப்பட்ட வாக்குறுதிக்கு ஏற்ப நிகழ்ந்ததை இச்சொற்றொடர் குறிக்கிறது. எந்த வாக்குறுதி என்று மூலவாக்கியம் வெளிப்படையாகக் கூறாததால், மொழிபெயர்ப்பிலும் அதை விரிவுபடுத்தவில்லை.
- source_word: ἤγαγεν
  choice: கொண்டுவந்தார்
  rationale: ἄγω என்பதன் நேரடியான பொருள் ‘கொண்டுவருதல்/வழிநடத்துதல்’. இங்கு தேவன் தாவீதின் சந்ததியிலிருந்து இஸ்ரயேலுக்காக மீட்பரை வரச்செய்ததைக் குறிக்கிறது. ‘எழுப்பினார்’ என்பது உயிர்த்தெழுதல் என்ற தேவையற்ற கருத்தைத் தூண்டக்கூடும்.
- source_word: τῷ Ἰσραήλ
  choice: இஸ்ரயேலுக்கு
  rationale: மூலத்தின் நான்காம் வேற்றுமையைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது; பெறுபவர் மற்றும் நன்மைபெறுபவர் ஆகிய இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது.
- source_word: σωτῆρα
  choice: மீட்பராக
  rationale: σωτήρ என்பது காப்பவர் அல்லது விடுவிப்பவர் என்னும் பொருளுடைய பட்டம். இச்சூழலில் ‘மீட்பர்’ பொருத்தமான, வழக்கிலுள்ள இறையியல் சொல்லாகும்; ‘மீட்பராக இயேசுவை’ என்பது கிரேக்கப் பெயரெச்சப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: Ἰησοῦν
  choice: இயேசு
  rationale: தனிப்பெயர் தமிழில் நிலைபெற்ற வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது; வாக்கியத்தில் செயப்படுபொருளாக இருப்பதால் ‘இயேசுவை’ என வேற்றுமை ஏற்கிறது.
theological_decisions:
- issue: இயேசுவுக்கும் தாவீதுக்குக் கொடுக்கப்பட்ட வாக்குறுதிக்கும் உள்ள தொடர்பு
  choice: தேவன் வாக்குறுதியின்படி தாவீதின் சந்ததியிலிருந்து இயேசுவை இஸ்ரயேலுக்கு மீட்பராகக் கொண்டுவந்தார் என்று மட்டுமே கூறுதல்
  alternative: ‘தாவீதுக்குக் கொடுத்த வாக்குறுதியை நிறைவேற்றும்படி’ என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: சூழல் தாவீதையும் வாக்குறுதியையும் இணைத்தாலும், இவ்வசனத்தின் கிரேக்க உரை வாக்குறுதியின் பெறுநரையோ முழு உள்ளடக்கத்தையோ வெளிப்படையாகக் கூறவில்லை. ஆகவே நிறைவேற்றத்தின் தொடர்பைப் பாதுகாத்து, விளக்கத்தை மூலத்தைவிட அதிகமாக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் சொல்வரிசையை அப்படியே பின்பற்றாமல் இயல்பான தமிழ் வரிசை அமைக்கப்பட்டுள்ளது; அதேவேளையில் வாக்குறுதி, தாவீதின் சந்ததி, இஸ்ரயேல், இயேசுவின் மீட்பர் அடையாளம் ஆகிய கருத்துத் தொடர்புகள் பாதுகாக்கப்பட்டுள்ளன.
