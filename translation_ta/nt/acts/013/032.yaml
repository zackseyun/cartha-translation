base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: ta
  text: தந்தையருக்கு[a] அளிக்கப்பட்ட வாக்குறுதியை நற்செய்தியாக நாங்களும் உங்களுக்கு அறிவிக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முன்னோர்களுக்கு.’ கிரேக்க மூலத்தில் ‘தந்தையருக்கு’ என்று உள்ளது; இது உடன்படிக்கை வரலாற்றுச் சூழலில் இஸ்ரவேலின் மூதாதையரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: நாங்களும்
  rationale: καὶ என்னும் இணைப்பையும், வெளிப்படையாக இடப்பட்ட ἡμεῖς தரும் பொருள் அழுத்தத்தையும் இயல்பான தமிழில் ஒன்றாக வெளிப்படுத்துகிறது; செயற்கையான ‘நாங்களே’ என்பதைக் தவிர்க்கிறது.
- source_word: ὑμᾶς
  choice: உங்களுக்கு
  rationale: εὐαγγελιζόμεθα என்பதுடன் வரும் செய்தி பெறுநரைத் தமிழில் இயல்பாக நான்காம் வேற்றுமையில் காட்டுகிறது.
- source_word: εὐαγγελιζόμεθα
  choice: நற்செய்தியை ... அறிவிக்கிறோம்
  rationale: நல்ல செய்தியை அறிவித்தல் என்ற வினையின் முழுப் பொருளையும் வெளிப்படுத்துகிறது; வழக்கில் குறுகிய சமயக் கலைச்சொல்லாகப் புரிந்துகொள்ளப்படக்கூடிய சொற்றொடரை மட்டும் நம்பியிருக்கவில்லை.
- source_word: τὴν ... ἐπαγγελίαν
  choice: வாக்குறுதி
  rationale: இங்கு பொதுவான அறிவிப்பை அல்ல, கடவுள் கொடுத்த வாக்குறுதியையே குறிக்கிறது.
- source_word: πρὸς τοὺς πατέρας
  choice: தந்தையருக்கு
  rationale: மூலத்தில் உள்ள ஆண்பால் குடும்பச் சொல்லையும் உடன்படிக்கை வரலாற்றுச் சுட்டையும் காக்கிறது; கிரேக்கத்தில் இல்லாத ‘நமது’ என்ற உடைமையைச் சேர்க்கவில்லை.
- source_word: γενομένην
  choice: அளிக்கப்பட்ட
  rationale: வாக்குறுதி தந்தையருக்குச் செய்யப்பட்டதைக் குறிக்கும் attributive participle-ஐ இயல்பான தமிழில் தருகிறது; அடுத்த வசனத்தில் வரும் நிறைவேற்றத்தை முன்கூட்டியே இங்கு புகுத்தவில்லை.
theological_decisions:
- issue: πατέρες என்பதன் மொழிபெயர்ப்பு
  choice: தந்தையர்
  alternative: முன்னோர்கள்
  rationale: πατέρες என்பது நேரடியாக ஆண்பால் குடும்பச் சொல்; இங்கு இஸ்ரவேலின் உடன்படிக்கை வரலாற்றிலுள்ள மூதாதையரைக் குறிக்கிறது. அந்த வடிவம் முதன்மை உரையில் காக்கப்பட்டு, இயல்பான விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; பொதுவாசகர்களுக்கு புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘நாங்களும்’ என்பது இணைப்பையும் வலியுறுத்தலையும் இயல்பாகத் தக்கவைக்கிறது.
