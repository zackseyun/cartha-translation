id: ACT.13.29
reference: Acts 13:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: ta
  text: அவரைப் பற்றி எழுதப்பட்டிருந்த அனைத்தையும் அவர்கள் நிறைவேற்றியபோது, அவர்கள் அவரை மரத்திலிருந்து[a] இறக்கி, ஒரு கல்லறையில் வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிலுவையிலிருந்து”; கிரேக்கத்தில் “மரத்திலிருந்து” (ξύλον). இச்சொல் மரத்தால் ஆன தண்டனைக்கருவியையும் குறிக்கலாம்; உபாகமம் 21:23-ஐ எதிரொலிக்கவும் கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: பின்பு
  rationale: இது முந்தைய செயல்கள் முடிந்ததைத் தொடர்ந்து நிகழ்ந்த சம்பவத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான காலத் தொடரை அளிக்கிறது.
- source_word: ἐτέλεσαν
  choice: நிறைவேற்றிய
  rationale: τελέω என்பதன் ‘முடிவுக்குக் கொண்டுவருதல், நிறைவேற்றுதல்’ என்ற பொருளைப் பாதுகாக்கிறது; எழுதப்பட்டவை அவர்களுடைய செயல்களால் நிறைவேறின என்ற கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: அவரைப் பற்றி எழுதப்பட்டிருந்த அனைத்தையும்
  rationale: இயேசுவைக் குறித்துப் முன்பே எழுதப்பட்டிருந்த அனைத்தையும் உள்ளடக்கும் கிரேக்கச் சொற்றொடரை இயல்பாகவும் முழுமையாகவும் தருகிறது.
- source_word: καθελόντες
  choice: இறக்கி
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் கிரேக்க இறந்தகாலப் பங்கேற்பு வினையைத் தமிழின் இயல்பான தொடர்வினையாக அளிக்கிறது.
- source_word: ἀπὸ τοῦ ξύλου
  choice: மரத்திலிருந்து
  rationale: ξύλον என்பதன் நேரடியான ‘மரம்/மரக்கட்டை’ என்ற சொல்லாட்சியைப் பாதுகாப்பதோடு, மரத்தால் ஆன கொலைக்கருவியையும் உபாகமம் 21:23-ன் எதிரொலியையும் உணர்த்த இடமளிக்கிறது.
- source_word: ἔθηκαν
  choice: வைத்தார்கள்
  rationale: τίθημι என்பதன் பொதுவான ‘வைத்தல்’ என்ற பொருளை, உடலைக் கல்லறையில் வைத்த சூழலில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: εἰς μνημεῖον
  choice: ஒரு கல்லறையில்
  rationale: μνημεῖον இச்சூழலில் உடல் வைக்கப்படும் அடக்கக் கல்லறையைக் குறிக்கிறது; நவீன தமிழில் ‘கல்லறை’ தெளிவான வழக்குச் சொல்.
theological_decisions:
- issue: பாடுகளின் சூழலில் ξύλον என்பதன் மொழிபெயர்ப்பு
  choice: மரம்
  alternative: சிலுவை
  rationale: கிரேக்கத்தில் இருப்பது ξύλον; σταυρός அல்ல. ‘மரம்’ என்பது மூலச் சொல்லைவும் மரத்தில் தொங்கவிடப்பட்டவனைப் பற்றிய வேதாகம எதிரொலியையும் பாதுகாக்கிறது. சூழலுக்கேற்ற பொதுவான விளக்கமான ‘சிலுவை’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிறைவேற்றிய’ என்பது வேதாகம நிறைவேற்றத்தின் நுட்பத்தைத் தக்கவைக்கிறது; ‘மரம்’ மூலத்தின் சொல் தேர்வையும் அதன் சாத்தியமான வேதாகம எதிரொலியையும் பாதுகாக்கிறது.
