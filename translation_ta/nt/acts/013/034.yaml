id: ACT.13.34
reference: Acts 13:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: ta
  text: 'அவரை இறந்தோரிலிருந்து எழுப்பினார்; அவர் இனி சிதைவுக்குத் திரும்பமாட்டார் என்பதைக் குறித்து அவர் இவ்வாறு சொல்லியிருக்கிறார்: “தாவீதுக்குரிய பரிசுத்தமான, நம்பத்தகுந்த ஆசீர்வாதங்களை உங்களுக்குத் தருவேன்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதின் உறுதியான இரக்கங்களை உங்களுக்குத் தருவேன்” என்றும் மொழிபெயர்க்கலாம். இந்தச் சொற்றொடர் ஏசாயா 55:3-ஐ எதிரொலிக்கிறது; தாவீதுடன் தொடர்புடைய பரிசுத்தமான, நம்பத்தகுந்த உடன்படிக்கை வாக்குறுதிகளையும் நன்மைகளையும் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: அவரை இறந்தோரிலிருந்து எழுப்பி
  rationale: உயிர்த்தெழுதலைக் குறிக்கும் கிரேக்கச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது; எழுப்பியவர் கடவுள் என்பதும் சூழலால் தெளிவாக உள்ளது.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: இனி ஒருபோதும் ... திரும்பாதபடி
  rationale: இனி மீண்டும் நிகழாத நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. μέλλοντα என்பதன் எதிர்கால நோக்கை தனியாகச் சொற்சொல்லாகக் காட்டாமல் மொத்தச் சொற்றொடரின் பொருளில் தக்கவைக்கிறது.
- source_word: διαφθοράν
  choice: அழிவு
  rationale: இங்கு உடல் சிதைவைக் குறிக்கிறது. ‘அழுகல்’ என்பதைக் காட்டிலும் ‘அழிவு’ வேதாகமச் சூழலில் கண்ணியமாகவும் விரிவான பொருளைத் தக்கவைத்தும் உள்ளது; உடல் சிதைவு என்ற பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: οὕτως εἴρηκεν
  choice: அவர் இவ்வாறு சொல்லியிருக்கிறார்
  rationale: εἴρηκεν என்ற நிறைவுநிலையின் தொடர்ந்து நிலைக்கும் வேதவாக்குத் தன்மையை ‘சொல்லியிருக்கிறார்’ வெளிப்படுத்துகிறது.
- source_word: Δώσω ὑμῖν
  choice: உங்களுக்குத் தருவேன்
  rationale: எளிய எதிர்கால வாக்குறுதியை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: தாவீதுக்குரிய பரிசுத்தமான, நம்பத்தகுந்த ஆசீர்வாதங்கள்
  rationale: கிரேக்கப் பன்மை நடுநிலைச் சொற்றொடரின் மறைபொருளை ஏசாயா 55:3-ன் உடன்படிக்கைச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது. ‘தாவீதுக்குரிய’ என்பது இவை தாவீதுடன் தொடர்புடைய வாக்குறுதிகள்/நன்மைகள் என்பதைச் சொல்கிறது; ‘நம்பத்தகுந்த’ என்பது πιστά-வின் உறுதியையும் நம்பகத்தன்மையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: τὰ ὅσια Δαυὶδ τὰ πιστά என்ற ஏசாயா 55:3 மேற்கோளின் பொருள்
  choice: தாவீதுக்குரிய பரிசுத்தமான, நம்பத்தகுந்த ஆசீர்வாதங்கள்
  alternative: தாவீதின் உறுதியான இரக்கங்கள்; தாவீதுக்குக் கொடுக்கப்பட்ட பரிசுத்தமான, உறுதியான வாக்குறுதிகள்
  rationale: இந்தச் சொற்றொடர் சுருக்கமானதும் பொருள் நுணுக்கம் கொண்டதும் ஆகும். முதன்மை உரை உடன்படிக்கை சார்ந்த நன்மைகளைத் தெரிவிக்கிறது; ஆனால் அவற்றை வாக்குறுதிகள் என்று மட்டும் சுருக்கிவிடாமல், மாற்று மரபுவழி வாசிப்பை அடிக்குறிப்பில் வைக்கிறது.
- issue: μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν என்பதன் உயிர்த்தெழுதல் சார்ந்த வலிமை
  choice: இனி ஒருபோதும் அழிவுக்குத் திரும்பாதபடி
  alternative: இனி அழிவுக்குத் திரும்பவிருக்காதவராக
  rationale: இயேசு மீண்டும் உடல் சிதைவுக்கு உட்படமாட்டார் என்ற கருத்தை இயல்பான தமிழில் தெளிவாகக் கூறுகிறது; மூலத்தின் எதிர்கால நோக்கை தேவையற்ற தமிழ்ச் செயற்கைத்தன்மையின்றி காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் இயல்பாகவும், வேதவாக்குக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. மேற்கோளின் உடன்படிக்கை நுணுக்கமும் கிரேக்கத்தின் சுருக்கமான தன்மையும் அடிக்குறிப்பின் உதவியுடன் பாதுகாக்கப்பட்டுள்ளன.
