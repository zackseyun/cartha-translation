  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: ta
  text: ஆண்டவரின் வார்த்தை[a] அந்தப் பகுதி முழுவதும் பரப்பப்பட்டுக்கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆண்டவரின் செய்தி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: தொடர்ந்து பரப்பப்பட்டு வந்தது
  rationale: இறந்தகாலத்தில் தொடர்ந்த செயலைக் குறிக்கும் imperfect வடிவத்தையும், பிறரால் பரப்பப்பட்டது என்ற passive பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சியை மட்டுமே குறிக்கிறது; தமிழில் வாக்கியத் தொடர்ச்சியே அதை இயல்பாக வெளிப்படுத்துவதால், கட்டாயமாக ‘மேலும்’ அல்லது ‘அப்போது’ சேர்ப்பது மிகைப்படுத்தலாகும்.
- source_word: ὁ λόγος
  choice: வார்த்தை
  rationale: அப்போஸ்தலர் நடபடிகளில் மீண்டும் வரும் லூக்காவின் சொல்லாட்சியைத் தக்கவைக்கிறது; இச்சூழலில் அது அறிவிக்கப்பட்ட செய்தியைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவரின்
  rationale: κύριος என்பதன் மரியாதை, அதிகாரம், கிறிஸ்துவைச் சார்ந்த இறையியல் ஒலிப்பு ஆகியவற்றைக் காக்கும் நிலையான தமிழ் வடிவம்.
- source_word: δι’ ὅλης
  choice: முழுவதும்
  rationale: ஓர் இடத்தின் எல்லா பகுதிகளிலும் விரிந்த பரப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τῆς χώρας
  choice: அந்தப் பகுதி
  rationale: நவீன தேசத்தை அல்லாமல் சுற்றியுள்ள புவியியல் வட்டாரத்தைக் குறிக்கும் χώρα என்பதற்கு தெளிவான இயல்பான தமிழ் இணை.
theological_decisions:
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு வெறும் மனித அதிகாரத்தைக் காட்டிலும் உயிர்த்தெழுந்த கிறிஸ்துவைக் குறிக்கும் இலக்கிய மற்றும் இறையியல் ஒலிப்பு உள்ளது; ‘ஆண்டவர்’ அதை குறுகச் செய்யாமல் காக்கிறது.
- issue: ὁ λόγος என்பதன் பொருள்
  choice: வார்த்தை
  alternative: செய்தி
  rationale: ‘வார்த்தை’ என்ற லூக்காவின் மீளும் சொற்றொடரை முதன்மை உரையில் காத்து, அது ஆண்டவரைப் பற்றிய அல்லது அவரிடமிருந்து வரும் அறிவிக்கப்பட்ட செய்தி என்ற சூழல் பொருளை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தொடர்ந்து பரப்பப்பட்டு வந்தது’ என்பது மூலத்தின் தொடர்நிலை மற்றும் செயப்பாட்டு வடிவங்களை வெளிப்படுத்துகிறது; [a] குறியீடு முதன்மை உரையிலேயே இடப்பட்டுள்ளது.
