source:
  edition: SBLGNT
  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: ta
  text: ஆகவே, அவர்கள் பரிசுத்த ஆவியால்[a] அனுப்பப்பட்டு, செலூக்கியாவுக்கு இறங்கிச் சென்றார்கள்; அங்கிருந்து சைப்பிரஸுக்குக் கப்பலில் புறப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூய ஆவியால்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் சொற்படியாக ‘பரிசுத்த ஆவியால்’ என உள்ளது; அப்போஸ்தலர் பணிகளில் இது அனுப்பி வழிநடத்தும் தனிப்பட்ட தெய்வீக முகவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: அவர்கள்
  rationale: எழுவாய் மூலத்தில் வெளிப்படையாகவும் ஓரளவு அழுத்தத்துடனும் உள்ளது. தமிழில் வாக்கியத் தொடக்கத்தில் ‘அவர்கள்’ என்று கூறுவது அந்த அழுத்தத்தை இயல்பாகத் தாங்குகிறது; ‘அவர்களே’ என்பது தேவைக்கு அதிகமான வலியுறுத்தலாக அமையலாம்.
- source_word: μὲν οὖν
  choice: ஆகவே
  rationale: முந்தைய ஆணையிடுதலிலிருந்து வரும் விளைவையும் கதையின் தொடர்ச்சியையும் குறிக்கிறது. நவீன தமிழில் ‘ஆகவே’ இரண்டையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐκπεμφθέντες
  choice: அனுப்பப்பட்டு
  rationale: இது இறந்தகாலச் செயப்பாட்டு வினையெச்சம்; பரிசுத்த ஆவியே அனுப்பும் முகவர் என்பதையும், அடுத்த பயணச் செயல்களுக்கு முன் இது நிகழ்ந்ததையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: பரிசுத்த ஆவியால்
  rationale: ὑπό உடன் வரும் மரபுவேற்றுமை அனுப்பிய முகவரைக் குறிக்கிறது. ‘பரிசுத்த ஆவி’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்பட்டதும், தனிப்பட்ட தெய்வீகச் செயல்பாட்டைச் சூழல் காட்ட இடமளிப்பதும் ஆகும்.
- source_word: κατῆλθον
  choice: இறங்கிச் சென்றார்கள்
  rationale: கடற்கரை நோக்கிய கீழிறங்கும் பயணத்தைச் சுட்டும் வினையின் திசைநுணுக்கத்தை ‘சென்றார்கள்’ என்று மட்டும் பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: εἰς Σελεύκειαν
  choice: செலூக்கியாவுக்கு
  rationale: இலக்கிட நகரைத் தமிழில் இயல்பான நான்காம் வேற்றுமையால் குறிக்கிறது; பெயர் கிரேக்க ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: ἐκεῖθεν
  choice: அங்கிருந்து
  rationale: புறப்பட்ட இடத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் இணை.
- source_word: τε
  choice: ;
  rationale: இந்த இணைப்புச் சொல் முந்தைய செயலுடன் அடுத்த செயலை நெருக்கமாக இணைக்கிறது. தமிழில் அரைப்புள்ளியுடன் தொடரும் ‘அங்கிருந்து’ அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துவதால் தனியே ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: ἀπέπλευσαν
  choice: கப்பலில் புறப்பட்டார்கள்
  rationale: கடல் பயணமாக ஓர் இடத்திலிருந்து புறப்படும் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘பயணம் செய்தார்கள்’ என்பது புறப்பாட்டின் நுணுக்கத்தை இழக்கும்.
- source_word: εἰς Κύπρον
  choice: சைப்பிரஸுக்கு
  rationale: இலக்கிடத்தை நான்காம் வேற்றுமை காட்டுகிறது; தீவின் தற்போதைய பரவலான தமிழ்ப் பெயர் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ἁγίου πνεύματος என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்த ஆவி
  alternative: தூய ஆவி; பரிசுத்த ஆவியானவர்
  rationale: கிரேக்கச் சொற்றொடர் சொற்படியாக ‘பரிசுத்த ஆவி’ எனப் பொருள்படும்; இவ்வசனத்தில் அனுப்பும் முகவராகச் செயல்படுவது தனிப்பட்ட தெய்வீகச் செயலாண்மையை வெளிப்படுத்துகிறது. எனினும் மூலத்தில் இல்லாத மரியாதைப் பெயர்ச்சொல் வடிவத்தை முதன்மை உரையில் சேர்க்காமல், உண்மையான சொற்பொருளையும் சூழல் தரும் தனிப்பட்ட செயலாண்மையையும் ஒன்றாகக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வாசிக்க எளிதான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இறங்கிச் சென்றார்கள்’ புவியியல் திசைநுணுக்கத்தையும், ‘கப்பலில் புறப்பட்டார்கள்’ கடல்வழிப் புறப்பாட்டையும் காக்கின்றன. இடப்பெயர்கள் செலூக்கியா, சைப்பிரஸ் என பரவலான தமிழ் எழுத்துப்பெயர்ப்பில் தரப்பட்டுள்ளன.
