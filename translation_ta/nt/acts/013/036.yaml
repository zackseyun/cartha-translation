id: ACT.13.36
reference: Acts 13:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: ta
  text: ஏனெனில், தாவீது தம் தலைமுறையில் கடவுளுடைய நோக்கத்திற்குப் பணிசெய்த பின்[a], உறங்கிப்போனார்[b]; தம் மூதாதையரோடு சேர்க்கப்பட்டார்[c]; சிதைவையும் கண்டார்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய தீர்மானத்தின்படி தம் தலைமுறைக்குப் பணிசெய்த பின்.” கிரேக்கத் தொடரை இவ்வாறும் இணைத்துப் புரிந்துகொள்ளலாம்.
    reason: syntactic_alternative
  - marker: b
    text: “உறங்கிப்போனார்” என்பது இறந்தார் என்பதைக் குறிக்கும் வேதாகம மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: நேரடியாக, “தம் தந்தையரிடம் சேர்க்கப்பட்டார்”; அதாவது, மரணத்தில் தம் மூதாதையரோடு இணைந்தார் என்பதைக் குறிக்கும் எபிரேயப் பாணி மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: d
    text: அதாவது, அவருடைய உடல் சிதைவடைந்தது; அடுத்த வசனத்தில் கூறப்படும் எதிர்மறை ஒப்பீட்டைக் காண்க.
    reason: context_note
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: தம் தலைமுறையில்
  rationale: இந்த இறந்தகாலச் சூழலில் தாவீது பணிசெய்த காலக்களத்தைக் குறிக்கும் இயல்பான தமிழாக்கம். ‘தம் தலைமுறைக்காக’ என்று பயனாளிப் பொருளைத் தேவையின்றி உறுதிப்படுத்தாமல் உள்ளது.
- source_word: ὑπηρετήσας
  choice: பணிசெய்த பின்
  rationale: இறந்தகாலப் பங்கேற்புவினையின் முதன்மை வினைகளுக்கு முந்திய செயலைத் தெளிவாகக் காட்டுகிறது. ‘ஊழியம் செய்த’ என்பதைவிட பொதுவான சேவைப் பொருளைத் தக்கவைக்கிறது.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: கடவுளுடைய நோக்கத்திற்குப்
  rationale: βουλή என்பதன் நோக்கம்/திட்டம்/தீர்மானம் என்ற பொருள் வரம்பை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; குறிப்பிட்ட இறையியல் அமைப்பைத் திணிக்கவில்லை.
- source_word: ἐκοιμήθη
  choice: உறங்கிப்போனார்
  rationale: மரணத்தைக் குறிக்கும் மூலமொழியின் உருவகச் சொற்பயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: தம் மூதாதையரோடு சேர்க்கப்பட்டார்
  rationale: தன் முன்னோர்களுடன் மரணத்தில் இணைந்தார் என்பதைக் குறிக்கும் எபிரேயப் பாணி மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἶδεν διαφθοράν
  choice: சிதைவையும் கண்டார்
  rationale: ‘சிதைவைக் காணுதல்’ என்ற நேரடி உருவகத்தையும், அடுத்த வசனத்தில் வரும் எதிர்மறை ஒப்பீட்டுக்கான சொல்லொற்றுமையையும் காக்கிறது.
theological_decisions:
- issue: தாவீதின் சேவையோடு ἰδίᾳ γενεᾷ மற்றும் τῇ τοῦ θεοῦ βουλῇ ஆகிய இரு வேற்றுமைத் தொடர்களை இணைத்தல்
  choice: தம் தலைமுறையில் கடவுளுடைய நோக்கத்திற்குப் பணிசெய்த பின்
  alternative: கடவுளுடைய தீர்மானத்தின்படி தம் தலைமுறைக்குப் பணிசெய்த பின்
  rationale: ὑπηρετέω என்பதற்கு τῇ ... βουλῇ நேரடி நிரப்பியாகவும், ἰδίᾳ γενεᾷ கால/சூழல் வரம்பாகவும் அமையும் வாசிப்பு இலக்கணரீதியாக வலுவானது. எனினும் மாற்று இணைப்பு உண்மையான தொடரியல் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: மரணத்தைக் குறிக்கும் உருவகம்
  choice: உறங்கிப்போனார்
  alternative: இறந்தார்
  rationale: மூலத்தில் நேரடியான ‘இறந்தார்’ என்பதற்குப் பதிலாக κοιμάομαι பயன்படுத்தப்பட்டுள்ளதால், கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்க்காமல் வேதாகம உருவகத்தைப் பாதுகாக்கிறது.
- issue: διαφθορά என்பதன் உடல் சார்ந்த பொருள்
  choice: சிதைவையும் கண்டார்
  alternative: அவருடைய உடல் சிதைந்தது
  rationale: சங்கீத மேற்கோளுடனும் அடுத்த வசனத்தின் எதிர்மறை ஒப்பீட்டுடனும் தொடர்புடைய மூல உருவகத்தை வைத்திருக்கிறது; உடலை வெளிப்படையாகச் சேர்ப்பதை அடிக்குறிப்புக்கு ஒதுக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஊழியம்’, ‘நித்திரையடைந்தார்’ போன்ற சமயவழக்குச் சொற்களைத் தவிர்த்து, மூல உருவகங்களையும் தொடரியல் தெளிவின்மையையும் உரை மற்றும் அடிக்குறிப்புகள் வழியாகப் பாதுகாத்துள்ளது.
