source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: ta
  text: வருகிற ஓய்வுநாளில்[a], ஆண்டவரின் வார்த்தையைக்[b] கேட்பதற்காக ஏறக்குறைய நகர மக்கள் அனைவரும் ஒன்றுகூடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடுத்த ஓய்வுநாளில்’ அல்லது ‘அதைத் தொடர்ந்து வந்த ஓய்வுநாளில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆண்டவரின் வார்த்தை’ என்பதை ‘ஆண்டவருடைய செய்தி’ என்றும், சூழலின்படி ‘ஆண்டவரைப் பற்றிய செய்தி’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: வருகிற ஓய்வுநாளில்
  rationale: ἐρχομένῳ என்பது காலத்தைக் குறிக்கும் பங்கேற்புவினை வடிவம்; ‘வருகிற’ என்பது அந்த ஓய்வுநாள் அடுத்து வருவதையோ தொடர்ந்து வருவதையோ இயல்பாகக் குறிக்கிறது. δέ இங்கு உரையாடல் நகர்வை மட்டும் குறிப்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: σχεδὸν πᾶσα ἡ πόλις
  choice: ஏறக்குறைய நகரத்தார் அனைவரும்
  rationale: σχεδόν என்பதன் ‘ஏறக்குறைய’ என்ற வரம்பையும், πᾶσα ἡ πόλις என்ற சொல்லாட்சியில் நகர மக்களையே குறிப்பதையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது; ஒவ்வொரு தனிநபரும் வந்தார் என்ற முற்றுமுழுதான பொருளைத் திணிக்கவில்லை.
- source_word: συνήχθη
  choice: ஒன்றுகூடினார்கள்
  rationale: செயப்பாட்டு வடிவமாக இருந்தாலும் இங்கு மக்கள் கூடிவந்ததைக் குறிக்கும் இயல்பான பொருள் உள்ளது; ‘ஒன்றுகூடினார்கள்’ அதன் கூட்டுச் செயலையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: ἀκοῦσαι
  choice: கேட்பதற்காக
  rationale: இறந்தகால வினையோடு வரும் இந்த வினையெச்சத்தின் நோக்கப் பொருளை ‘கேட்பதற்காக’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: τὸν λόγον
  choice: வார்த்தையை
  rationale: λόγος என்பதற்கு இங்கு ‘செய்தி’ என்ற பொருளும் சாத்தியம்; எனினும் அப்போஸ்தலர் பணிகளில் மீண்டும் வரும் பிரகடனச் சொல்லாட்சியைத் தொடர ‘வார்த்தை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவரின்
  rationale: κύριος என்பதற்கான மரியாதைமிக்க, பொதுவான தமிழ் இணை ‘ஆண்டவர்’; உடைமை வேற்றுமை கிரேக்கப் பிறப்புவேற்றுமையின் தெளிவின்மையைத் தீர்த்துவிடாமல் காக்கிறது.
theological_decisions:
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இச்சூழலில் ‘ஆண்டவர்’ என்பது ஆரம்பக் கிறிஸ்தவப் பிரகடன மொழியோடு பொருந்தும் வழக்கமான மரியாதைச் சொல்; உரை குறிப்பிடாத வகையில் அதன் குறிப்பை மேலும் குறுக்கவில்லை.
- issue: τὸν λόγον τοῦ κυρίου என்பதிலுள்ள பிறப்புவேற்றுமையின் பொருள்
  choice: ஆண்டவரின் வார்த்தை
  alternative: ஆண்டவரிடமிருந்து வந்த செய்தி; ஆண்டவரைப் பற்றிய செய்தி
  rationale: கிரேக்கத் தொடர் வார்த்தை ஆண்டவருக்குரியது, அவரிடமிருந்து வந்தது, அல்லது அவரைப் பற்றியது ஆகிய ஒன்றோடொன்று தொடர்புடைய நுணுக்கங்களைத் தாங்கக்கூடும். அவற்றில் ஒன்றை மட்டும் உரைக்குள் திணிக்காமல் பாரம்பரியத் தொடரைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதான அதேவேளையில் மரியாதையும் வேதாகமப் பிரகடன நடையும் கொண்ட மொழி பயன்படுத்தப்பட்டுள்ளது. ‘நகரத்தார் அனைவரும்’ என்பது நகர மக்களை இயல்பாகக் குறிக்கிறது; ‘ஏறக்குறைய’ மூலத்தின் நோக்கமுள்ள மிகைப்படுத்தலை வரையறுக்கிறது.
