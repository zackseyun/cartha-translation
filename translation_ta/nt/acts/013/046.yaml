source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: ta
  text: 'அப்போது பவுலும் பர்னபாவும் துணிவுடன் சொன்னார்கள்: “கடவுளுடைய வார்த்தை முதலில் உங்களுக்குச் சொல்லப்பட வேண்டியது அவசியமாக இருந்தது. நீங்கள் அதை நிராகரித்து, நித்திய வாழ்வுக்குத் தகுதியற்றவர்கள் என்று உங்களை நீங்களே தீர்ப்பதால், இதோ, நாங்கள் பிற இனத்தாரிடம்[a] திரும்புகிறோம்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களினங்களிடம்.” இங்கு இந்தச் சொல் ஜெபக்கூடத்தில் இருந்த யூதக் கேட்போருக்கு மாறாக யூதரல்லாதவர்களைக் குறிக்கிறது; எனவே முதன்மை உரையில் “பிற இனத்தார்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί … εἶπαν
  choice: துணிவுடன் சொன்னார்கள்
  rationale: பங்கேற்புவினையான παρρησιασάμενοι, வெளிப்படையாகவும் அஞ்சாமலும் பேசுவதைக் குறிக்கிறது. தமிழில் முதன்மை வினையோடு வினையடையாக இணைப்பது இயல்பாகவும், εἶπαν என்பதன் பொருளையும் தேவையற்ற மறுபடியுரையின்றிப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: Ὑμῖν … πρῶτον
  choice: முதலில் உங்களுக்கு
  rationale: செய்தி அறிவிக்கப்பட்ட வரிசையில் இந்தக் கேட்போருக்கிருந்த முன்னுரிமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀναγκαῖον … λαληθῆναι
  choice: சொல்லப்பட வேண்டியது அவசியமாயிருந்தது
  rationale: ἀναγκαῖον என்பதன் அவசியத்தையும், λαληθῆναι என்பதன் இறந்தகாலச் செயலற்ற வினை வடிவையும் முறையான, இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: λόγος என்பதன் ‘வார்த்தை/செய்தி’ பரப்பைத் திறந்தே வைத்துக்கொண்டு, புதிய ஏற்பாட்டில் வரும் நிலையான சொற்றொடரின் வடிவத்தையும் காக்கிறது.
- source_word: ἀπωθεῖσθε αὐτόν
  choice: அதைத் தள்ளிவிட்டு
  rationale: ἀπωθέομαι என்பதிலுள்ள வேண்டுமென்றே ஒதுக்குதல் அல்லது நிராகரித்தல் என்ற வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அதை’ என்பது ‘வார்த்தை’யைச் சுட்டுகிறது.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτούς
  choice: தகுதியற்றவர்கள் என்று உங்களை நீங்களே தீர்ப்பதால்
  rationale: κρίνετε என்பதன் தீர்ப்பிடும் நுணுக்கத்தையும் ἑαυτούς என்பதன் தற்சுட்டுப் பொருளையும் காக்கிறது. அவர்கள்மீது பவுல் தீர்ப்பளிப்பதாக மாற்றவில்லை.
- source_word: τῆς αἰωνίου ζωῆς
  choice: நித்திய வாழ்வுக்கு
  rationale: αἰώνιος ζωή என்ற புதிய ஏற்பாட்டு கருத்தை நவீன வாசகர்களுக்குப் பரிச்சயமான, கண்ணியமான தமிழில் தருகிறது.
- source_word: ἰδοὺ στρεφόμεθα
  choice: இதோ, நாங்கள் … திரும்புகிறோம்
  rationale: ἰδού என்பதன் கவன ஈர்ப்பையும், நிகழ்கால στρεφόμεθα காட்டும் தீர்மானமான திசைமாற்றத்தையும் பாதுகாக்கிறது.
- source_word: τὰ ἔθνη
  choice: பிற இனத்தார்
  rationale: சூழலில் யூதரான ஜெபக்கூடக் கேட்போருக்கு மாறாக யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ என்பது அந்த வேறுபாட்டை இயல்பான தமிழில் காட்டுவதோடு, அடிப்படையான ‘மக்களினங்கள்’ என்ற பொருளையும் முற்றிலும் மறைக்காது.
theological_decisions:
- issue: τὰ ἔθνη என்பதன் இரட்சிப்பு-வரலாற்றுச் சூழல்
  choice: பிற இனத்தார்
  alternative: மக்களினங்கள்
  rationale: உடனடிச் சூழலில் ஜெபக்கூடக் கேட்போரான ‘உங்களுக்கு’ எதிராக யூதரல்லாதவர்களை இது குறிக்கிறது. ஆகவே வெறும் புவியியல் நாடுகள் என்ற எண்ணத்தைத் தவிர்த்து, இன-மத வேறுபாட்டை முதன்மை உரை காட்டுகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: οὐκ ἀξίους κρίνετε ἑαυτούς என்பதன் தீர்ப்புச் செயல் யாருடையது
  choice: அவர்கள் தங்களைத் தாங்களே தகுதியற்றவர்கள் என்று தீர்க்கிறார்கள்
  alternative: பவுல் அவர்களை நித்திய வாழ்வுக்குத் தகுதியற்றவர்கள் என்று தீர்க்கிறார்
  rationale: கிரேக்க உரை κρίνετε ἑαυτούς என்று தீர்ப்பை கேட்போரின் செயலாகவே வெளிப்படையாக வைக்கிறது. மொழிபெயர்ப்பு அந்தத் தற்சுட்டு வலிமையைப் பாதுகாத்து, அதற்கு அப்பாற்பட்ட கோட்பாட்டு முடிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘துணிவுடன் சொன்னார்கள்’ என்ற இயல்பான அமைப்பு கிரேக்கத்தின் பங்கேற்புவினை மற்றும் முதன்மை வினையை ஒருங்கிணைக்கிறது. ‘இதோ’ என்ற வேதாகமச் சொல் கவன ஈர்ப்புக்காகத் தக்கவைக்கப்பட்டுள்ளது; அரிதான சமயவழக்குச் சொற்களுக்குப் பதிலாக ‘பிற இனத்தார்’ பயன்படுத்தப்பட்டுள்ளது.
