  text: ἐν τούτῳ πᾶς ὁ πιστεύων δικαιοῦται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: ta
  text: அவரில் நம்பிக்கை வைக்கிற ஒவ்வொருவரும் நீதிமானாகத் தீர்க்கப்படுகிறார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த ஒருவரால், நம்பிக்கை வைக்கிற ஒவ்வொருவரும் நீதிமானாகத் தீர்க்கப்படுகிறார்.’ ἐν τούτῳ என்ற கிரேக்கச் சொற்றொடரை இன்னும் சொல்லுக்குச் சொல்லாக ‘இந்த ஒருவரில்’ அல்லது ‘இந்த ஒருவரால்’ என்று மொழிபெயர்க்கலாம்; இது இயேசுவைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: அவரில்
  rationale: முந்தைய சூழலில் இயேசுவே குறிப்பிடப்படுவதால், சுட்டுப்பெயரை அவரைக் குறிக்கும் தனிப்பட்ட குறிப்பாக எடுத்துக்கொள்கிறது. ἐν என்ற முன்னிடைச்சொல்லின் அமைப்பையும் தமிழில் இயன்றவரை காக்கிறது.
- source_word: πᾶς ὁ πιστεύων
  choice: நம்பிக்கை வைக்கும் ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல்லின் பொதுவான பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: δικαιοῦται
  choice: நீதிமான் என்று தீர்ப்பளிக்கப்படுகிறார்
  rationale: வினைச்சொல்லின் சட்டமன்றத் தீர்ப்பு சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது; இதை உள்ளார்ந்த ஒழுக்க மாற்றம் என்று தவறாகப் புரிந்துகொள்ளும் வாய்ப்பைக் குறைக்கிறது.
theological_decisions:
- issue: ἐν τούτῳ என்பதன் குறிப்பு
  choice: 'இயேசுவைக் குறிக்கும் தனிப்பட்ட வாசிப்பு: ‘அவரில்’'
  alternative: ‘இந்த ஒருவரால்’ அல்லது ‘இவரால்’ என்ற கருவிப்பொருள் வாசிப்பு
  rationale: முந்தைய வசனத்தில் பாவமன்னிப்பு இயேசுவின் மூலமாக அறிவிக்கப்படுவதாக இருப்பதால், இங்கும் அவரையே குறிக்கும் உரையோட்டம் தொடர்கிறது. எனினும் கிரேக்கத் தொடரின் கருவிப்பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பவுலின் பயன்பாட்டில் δικαιοῦται என்பதன் பொருள்
  choice: ‘நீதிமான் என்று தீர்ப்பளிக்கப்படுகிறார்’ என்ற நீதித்துறை சார்ந்த பொருள்
  alternative: ‘நீதிமானாக்கப்படுகிறார்’ அல்லது ‘சரியான நிலைக்குக் கொண்டுவரப்படுகிறார்’
  rationale: உடனடிச் சூழலில் மோசேயின் சட்டத்திற்கும் நீதிமானாகத் தீர்க்கப்படுவதற்கும் உள்ள வேறுபாடு பேசப்படுவதால், தீர்ப்பு சார்ந்த பொருள் பொருத்தமானது. இது நீதிமானாக்குதலை ஒழுக்க மாற்றத்துடன் ஒன்றாக்காமல் அதன் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவரில்’ என்பது சற்றே செறிவான வேதாகமச் சொற்றொடராக இருந்தாலும், மூலத்தின் உண்மையான இடைச்சொல் தெளிவின்மையைப் பாதுகாக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
