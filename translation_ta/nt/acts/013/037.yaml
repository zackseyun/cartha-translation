  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: ta
  text: ஆனால், கடவுள் எழுப்பியவர் அழிவைக் காணவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிதைவு.” கிரேக்கச் சொல் உடலின் சிதைவைக் குறிக்கலாம்; “அழிவு” என்ற சொல் கிரேக்க வேதாகமத்தில் சங்கீதம் 16:10-ல் வரும் சொல்லாட்சியை எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: கடவுள் உயிரோடு எழுப்பியவர்
  rationale: உறவுப்பெயர் முன் பேசப்பட்ட இயேசுவைக் குறிக்கிறது. தமிழில் இயல்பாக அமைய, அதைத் தொடர்ந்து வரும் வினைத்தொடருடன் இணைத்து ‘...எழுப்பியவர்’ என வழங்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் தாவீது அழிவைக் கண்டதற்கு மாறாக இங்கு இயேசுவைப் பற்றிக் கூறப்படுவதால், எதிர்மறை வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: θεός இங்கு வாக்கியத்தின் எழுவாய்; நவீனத் தமிழில் இயல்பான, பொதுவாகப் புரியும் வடிவம் ‘கடவுள்’.
- source_word: ἤγειρεν
  choice: உயிரோடு எழுப்பிய
  rationale: உடனடிச் சூழலில் தாவீதின் மரணமும் உடல் அழிவும் இயேசுவின் உயிர்த்தெழுதலுடன் ஒப்பிடப்படுகின்றன. ‘உயிரோடு எழுப்பிய’ என்பது உயிர்த்தெழுதல் பொருளைத் தெளிவாக்குவதோடு கடவுளின் செயலைக் காக்கிறது.
- source_word: οὐκ εἶδεν
  choice: காணவில்லை
  rationale: சங்கீதம் 16-ன் கிரேக்க வடிவத்தை எதிரொலிக்கும் ‘அழிவைக் காணுதல்’ என்ற உருவகச் சொல்லாட்சியை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: διαφθοράν
  choice: அழிவு
  rationale: இங்கு உடல் சிதைந்து அழிவதைக் குறிக்கிறது. ‘அழிவு’ சங்கீத மேற்கோளுடனான சொல் தொடர்பைக் காக்கும் சுருக்கமான, dignified தமிழ்; உடல் சார்ந்த பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
theological_decisions:
- issue: ἤγειρεν என்பதன் உயிர்த்தெழுதல் பொருள்
  choice: உயிரோடு எழுப்பிய—கடவுள் இயேசுவை இறந்தோரிலிருந்து எழுப்பியதைக் குறிக்கும்
  alternative: தோன்றச் செய்தார் அல்லது ஒரு பணிக்காக எழுப்பினார்
  rationale: தாவீது இறந்து அழிவைக் கண்டதையும், கடவுள் எழுப்பியவர் அழிவைக் காணாததையும் உடனடிச் சூழல் வேறுபடுத்துகிறது. ஆகவே இங்கு உயிர்த்தெழுதல் பொருள் சூழலால் உறுதிப்படுகிறது.
- issue: ‘அழிவைக் காணவில்லை’ என்ற உருவகத்தின் பொருள்
  choice: உடல் சிதைவை அனுபவிக்கவில்லை என்ற பொருளை உருவக வடிவிலேயே வைத்தல்
  alternative: ‘உடல் சிதையவில்லை’ என்று நேரடியாக விளக்குதல்
  rationale: ‘காணவில்லை’ என்ற மூலமொழி வடிவம் சங்கீதம் 16:10 உடனான வேதாகம எதிரொலியைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் உடல் சார்ந்த பொருளை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானவும் மதிப்புமிக்கவும் உள்ள நடை. ‘உயிரோடு எழுப்பியவர்’ என்பது சூழலிலுள்ள உயிர்த்தெழுதல் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘அழிவைக் காணவில்லை’ என்பது மூலத்தின் வேதாகம எதிரொலியையும் உருவகத்தையும் பாதுகாக்கிறது.
