source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: ta
  text: 'கடவுள் இயேசுவை எழுப்பி[b], இதை நம் பிள்ளைகளுக்காக[a] நிறைவேற்றியிருக்கிறார். இரண்டாம் சங்கீதத்திலும் எழுதப்பட்டிருப்பதுபோல்:


    “நீர் என் மகன்;

    இன்று நான் உம்மைப் பிறப்பித்தேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “நம் பிள்ளைகளுக்காக” என்று உள்ளது; வேறு சில பிரதிகள் “அவர்களுடைய பிள்ளைகளான நமக்காக” என்ற வாசகத்தை ஆதரிக்கின்றன.
    reason: textual_variant
  - marker: b
    text: “இயேசுவை இறந்தோரிலிருந்து உயிர்த்தெழச் செய்து” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொல், ஒருவரைத் தோன்றச் செய்வது அல்லது ஒரு பணிக்காக எழுப்புவது என்ற பொருளிலும் வரலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: நிறைவேற்றியிருக்கிறார்
  rationale: கிரேக்க நிறைநிலைக் காலம், செயல் நிறைவேறியதையும் அதன் விளைவு தொடர்வதையும் குறிக்கிறது. இந்தத் தெரிவு வாக்குறுதி நிறைவேறுதல் என்ற லூக்கா–அப்போஸ்தலர் நடபடிகளின் மொழிநடையையும் காக்கிறது.
- source_word: ταύτην
  choice: இதை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வாக்குறுதியையே சுட்டுகிறது; மூலத்தில் இல்லாத ‘வாக்குறுதி’ என்ற பெயர்ச்சொல்லை இங்கு சேர்க்காமல் சுட்டுப்பெயரைப் பாதுகாக்கிறது.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: நம் பிள்ளைகளுக்காக
  rationale: SBLGNT முதன்மை வாசகத்தை நேரடியாகத் தருகிறது. τέκνα என்பது பிள்ளைகள் அல்லது வழித்தோன்றல்கள் எனப் பொருள்படலாம்; பிரதிவேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀναστήσας Ἰησοῦν
  choice: இயேசுவை எழுப்பி
  rationale: ‘எழுப்பி’ என்பது உயிர்த்தெழச் செய்தல் என்றும், ஒருவரைத் தோன்றச் செய்தல் அல்லது ஒரு பணிக்காக எழுப்புதல் என்றும் கொள்ளக்கூடிய மூலத்தின் பொருள் நெகிழ்வைப் பாதுகாக்கிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டிருப்பதுபோல
  rationale: வேதாகம மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடராகவும், எழுதப்பட்டதன் நீடித்த நிலையை உணர்த்துவதாகவும் உள்ளது.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: இரண்டாம் சங்கீதத்தில்
  rationale: கிரேக்கச் சொல்லமைப்பை இயல்பான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: Υἱός μου εἶ σύ
  choice: நீர் என் மகன்
  rationale: அடையாளப்படுத்தும் வலிமையை இயல்பான தமிழ் சொல்வரிசையில் தருகிறது; மரியாதையான ஒருமை வடிவம் கண்ணியமான மேற்கோள் நடையைப் பேணுகிறது.
- source_word: σήμερον γεγέννηκά σε
  choice: இன்று நான் உம்மைப் பெற்றெடுத்தேன்
  rationale: γεννάω என்பதன் நேரடித் தோற்றுவித்தல்/பெற்றெடுத்தல் கருத்தையும் சங்கீதம் 2:7-ன் கிறிஸ்துவியல் நிறையையும் காக்கிறது; ‘உமக்குத் தந்தையானேன்’ என்று விளக்கமாக மாற்றி ஒரு குறிப்பிட்ட பொருளைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: இந்தச் சூழலில் ἀναστήσας Ἰησοῦν என்பதன் பொருள்
  choice: ‘இயேசுவை எழுப்பி’ என்று பொருள் நெகிழ்வுடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இயேசுவை இறந்தோரிலிருந்து உயிர்த்தெழச் செய்து’ அல்லது ‘இயேசுவைத் தோன்றச்/பணிக்காக எழுப்பி’
  rationale: அடுத்த வசனம் உயிர்த்தெழுதலை வெளிப்படையாகக் குறிப்பிடுகிறது; அதேவேளை அப்போஸ்தலர் நடபடிகளில் ἀνίστημι ஒரு மீட்பரையோ தலைவரையோ கடவுள் எழுப்புவதையும் குறிக்கலாம். ஆகவே முதன்மை உரை விவாதத்தைத் தீர்மானிக்காமல், மாற்றுப் பொருள்களை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: ‘இன்று நான் உம்மைப் பெற்றெடுத்தேன்’ என்பதன் கிறிஸ்துவியல் வலிமை
  choice: சங்கீதம் 2:7 மேற்கோள் விளக்க விரிவாக்கமின்றி நேரடியாக வைக்கப்பட்டது.
  alternative: அரியணையேற்றம் அல்லது தத்தெடுத்தல் மொழியாக விளக்குதல்; உயிர்த்தெழுதலின் மூலம் உறுதிப்படுத்தப்பட்டதாக விளக்குதல்
  rationale: மொழிபெயர்ப்பு, பிற்கால இறையியல் விவாதங்களில் ஒரு விளக்கத்தைத் தேர்ந்தெடுக்காமல் மேற்கோளின் சொற்களையும் அதன் உள்ளார்ந்த இறையியல் பதற்றத்தையும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வேதாகம மேற்கோளில் ‘நீர்/உம்மை’ என்ற மரியாதை ஒருமை வடிவங்கள் வைக்கப்பட்டுள்ளன. மூலத்தின் சுட்டுப்பெயரும் ἀναστήσας என்பதிலுள்ள உண்மையான பொருள் நெகிழ்வும் விளக்கச் சேர்க்கையின்றி பாதுகாக்கப்பட்டுள்ளன.
