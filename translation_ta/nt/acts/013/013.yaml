id: ACT.13.13
reference: Acts 13:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: ta
  text: பவுலும் அவருடன் இருந்தவர்களும்[a] பாப்போசிலிருந்து கப்பலில் புறப்பட்டு[b], பம்பிலியாவிலுள்ள பெர்கேவுக்கு வந்தார்கள். ஆனால் யோவான் அவர்களிடமிருந்து பிரிந்து, எருசலேமுக்குத் திரும்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, ‘பவுலைச் சுற்றியிருந்தவர்கள்’ அல்லது ‘பவுலுடன் இருந்தவர்கள்.’ இந்தக் கிரேக்கச் சொற்றொடர் பவுலையும் அவருடைய தோழர்களையும் கொண்ட குழுவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கடலுக்குள் புறப்பட்டு’ அல்லது ‘கப்பற்பயணத்தைத் தொடங்கி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: கப்பலில் புறப்பட்டு
  rationale: கடற்பயணச் சூழலில் ἀνάγω என்பதன் பங்கேற்புவினை வடிவம் ‘கடலுக்குள் புறப்படுதல்’ அல்லது ‘கப்பற்பயணத்தைத் தொடங்குதல்’ என்று பொருள்படும். ‘கப்பலில் புறப்பட்டு’ என்பது கடற்பயணப் பொருளைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: οἱ περὶ Παῦλον
  choice: பவுலும் அவருடன் இருந்தவர்களும்
  rationale: οἱ περὶ + வேற்றுமை வடிவம் ஒருவரைச் சுற்றியுள்ள அல்லது அவருடன் இணைந்துள்ள குழுவைக் குறிக்கும்; இங்கு பவுலையும் அவரது பயணத் தோழர்களையும் உள்ளடக்குகிறது. தமிழில் குழுவின் உள்ளடக்கத்தைத் தெளிவுபடுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது; சொல்லாட்சிக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἦλθον
  choice: வந்தார்கள்
  rationale: ἔρχομαι என்பது பார்வைக்கோணத்தைப் பொறுத்து ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படும். கிரேக்கப் பயண விவரிப்பைத் தொடர்ந்து ‘வந்தார்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: Πέργην τῆς Παμφυλίας
  choice: பம்பிலியாவிலுள்ள பெர்கேவுக்கு
  rationale: இங்குள்ள உரிமைவேற்றுமை பெர்கே நகரம் அமைந்திருந்த பிரதேசத்தை அடையாளப்படுத்துகிறது. ‘பம்பிலியாவிலுள்ள’ என்பது இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀποχωρήσας
  choice: அவர்களிடமிருந்து பிரிந்து
  rationale: ἀποχωρέω என்பது ‘புறப்படுதல்’, ‘விலகுதல்’, ‘பிரிதல்’ ஆகிய பொருள்களைக் கொள்ளலாம். யோவானின் நோக்கத்தையோ செயலுக்கான ஒழுக்க மதிப்பீட்டையோ சேர்க்காமல் நிகழ்வை நடுநிலையாகத் தெரிவிக்க ‘பிரிந்து’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ὑπέστρεψεν
  choice: திரும்பினார்
  rationale: ὑποστρέφω வழக்கமாக முன்பிருந்த இடத்திற்குத் திரும்பிச் செல்வதைக் குறிக்கிறது; ‘திரும்பினார்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: நகரத்தின் பெயருக்கான நிலைபெற்ற நவீனத் தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: யோவான் குழுவிலிருந்து பிரிந்ததன் உட்குறிப்பு
  choice: ‘அவர்களிடமிருந்து பிரிந்து’ என்று நடுநிலையாக மொழிபெயர்த்தல்
  alternative: ‘அவர்களைக் கைவிட்டு’ அல்லது ‘அவர்களிடமிருந்து விலகி’
  rationale: இந்த வசனம் யோவான் பிரிந்து எருசலேமுக்குத் திரும்பியதை மட்டுமே கூறுகிறது; அவரது நோக்கத்தையோ செயலின் ஒழுக்கத் தன்மையையோ குறிப்பிடவில்லை. பிந்தைய சூழல் எதிர்மறையான மதிப்பீட்டை உணர்த்தக்கூடும் என்றாலும், அதை இவ்வசனத்துக்குள் முன்கூட்டியே கொண்டுவராமல் கிரேக்க உரையின் கட்டுப்பாடு காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான பயண விவரிப்பு நடை பயன்படுத்தப்பட்டது. ‘பவுலும் அவருடன் இருந்தவர்களும்’ என்பது கிரேக்க மரபுத்தொடரின் குழுப்பொருளை இயல்பாகத் தருகிறது. யோவானின் பிரிவு குறித்து உரையில் இல்லாத குற்றச்சாட்டோ உள்நோக்கமோ சேர்க்கப்படவில்லை. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகளின் இடமும் உள்ளடக்கமும் ஒன்றுக்கொன்று மாறியிருந்ததால், கிரேக்கச் சொற்களுடன் பொருந்துமாறு [a], [b] குறியீடுகள் சரியான இடங்களில் அமைக்கப்பட்டன.
