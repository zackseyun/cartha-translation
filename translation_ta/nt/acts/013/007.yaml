reference: Acts 13:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: ta
  text: அவன் ரோம மாகாணத்தின் புரோகன்சலான செர்கியு பவுலுடன் இருந்தான். விவேகமுள்ளவரான அந்தச் செர்கியு பவுல் பர்னபாவையும் சவுலையும் தம்மிடம் அழைத்து, கடவுளுடைய வார்த்தையைக்[b] கேட்க விரும்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “கடவுளுடைய செய்தியைக்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: ரோம மாகாண ஆளுநர்
  rationale: இது ஒரு ரோம மாகாணத்தின் ‘proconsul’ என்ற குறிப்பிட்ட பதவியைக் குறிக்கிறது. சாதாரண வாசகருக்குப் புரியும் வகையில் பதவியின் ரோம மற்றும் மாகாணச் சூழல் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: σὺν
  choice: உடன் இருந்தான்
  rationale: இங்கு உடனிருத்தல் அல்லது தொடர்பைக் குறிக்கும் எளிய, இயல்பான தமிழ் நடை.
- source_word: ἀνδρὶ συνετῷ
  choice: விவேகமுள்ளவர்
  rationale: சொல் அறிவு, புரிந்துணர்வு, விவேகம் ஆகிய நுணுக்கங்களைக் கொண்டது. ‘விவேகமுள்ளவர்’ என்பது ஒழுக்க மேன்மையை மிகைப்படுத்தாமல் நல்ல புரிந்துணர்வைக் காட்டுகிறது.
- source_word: οὗτος
  choice: அவர்
  rationale: முந்தைய விளக்கத்திற்குப் பின் செர்கியு பவுலையே மீண்டும் சுட்டுகிறது. தமிழில் பெயரை முந்தைய வாக்கியத்தில் மீண்டும் கூறி, அடுத்த வாக்கியத்தில் மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்துவது தெளிவும் இயல்பும் தருகிறது.
- source_word: προσκαλεσάμενος
  choice: தம்மிடம் அழைத்து
  rationale: தன்னிடம் வரும்படி அழைத்தார் என்ற நடுவினை நுணுக்கத்தை நேரடியாகக் காட்டுகிறது; அதிகாரபூர்வமான முன்முயற்சியையும் தேவையற்ற வற்புறுத்தல் நுணுக்கமின்றி வெளிப்படுத்துகிறது.
- source_word: ἐπεζήτησεν
  choice: விரும்பினார்
  rationale: கேட்க வேண்டும் என்ற தீவிர நாட்டம் அல்லது முயற்சியைக் குறிக்கிறது. தமிழில் ‘கேட்க விரும்பினார்’ என்பது இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: ἀκοῦσαι
  choice: கேட்க
  rationale: செய்தியை செவிமடுத்துப் பெறுவதை நேரடியாகக் குறிக்கும் இயல்பான தமிழ் வினை.
- source_word: λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: மூலத்தின் சொற்றொடர் அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது; இச்சூழலில் அறிவிக்கப்படும் கடவுளின் செய்தி என்பதே பொருள்.
- source_word: Σεργίῳ Παύλῳ
  choice: செர்கியு பவுல்
  rationale: கிரேக்கப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: பர்னபாவையும் சவுலையும்
  rationale: இரு தனிப்பெயர்களும் தமிழில் ஒலிபெயர்க்கப்பட்டு, வினையின் நேரடி செயப்படுபொருள்களாக இயல்பான வேற்றுமை உருபுடன் தரப்பட்டுள்ளன.
theological_decisions:
- issue: λόγον τοῦ θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளுடைய வார்த்தை
  alternative: கடவுளுடைய செய்தி
  rationale: ‘செய்தி’ என்பது சூழற்பொருளைத் தெளிவாக்கினாலும், ‘வார்த்தை’ மூலச் சொல்லை வெளிப்படையாகப் பாதுகாத்து அதன் வேதாகமப் பயன்பாட்டின் பரப்பைச் சுருக்காமல் விடுகிறது.
- issue: செர்கியு பவுலை விவரிக்கும் συνετῷ என்பதன் நுணுக்கம்
  choice: விவேகமுள்ளவர்
  alternative: புத்திக்கூர்மையுள்ளவர்; புரிந்துணர்வுள்ளவர்
  rationale: இந்தச் சொல் அறிவாற்றல், புரிந்துணர்வு அல்லது நடைமுறை விவேகத்தைக் குறிக்கலாம். மொழிபெயர்ப்பு அதை இறையியல் அல்லது ஒழுக்க மேன்மையாக மிகைப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் மரியாதையான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க உறவுப்பெயர் அமைப்பு தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. அதிகாரியைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; முந்தைய வசனத்தில் வரும் நபரைச் சுட்டும் தொடக்க ‘அவன்’ மட்டும் மூலத்தின் உறவுப்பெயர் தொடர்பைத் தக்கவைக்கிறது.
