  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: ta
  text: “பாருங்கள், இகழ்கிறவர்களே; வியப்படுங்கள், அழிந்துபோங்கள்[a]. ஏனெனில், உங்கள் நாட்களில் நான் ஒரு செயலை நிகழ்த்துகிறேன்—அதை ஒருவர் உங்களுக்கு விரிவாக எடுத்துச் சொன்னாலும்[b], நீங்கள் நிச்சயமாக நம்பவே மாட்டீர்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழிந்துபோங்கள்’ என்பதற்கு ‘மறைந்துபோங்கள்’ அல்லது ‘நாசமடைந்துபோங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் கடுமையான அழிவு எச்சரிக்கையைத் தருகிறது.
    reason: alternative_reading
  - marker: b
    text: ‘விரிவாக எடுத்துச் சொன்னாலும்’ என்பதற்கு ‘முழுமையாக விவரித்துச் சொன்னாலும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஒரு விஷயத்தை விரிவாக எடுத்துரைத்தல் அல்லது முழுமையாக விவரித்தல் என்ற நுணுக்கத்தையும் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் பன்மை ஏவலைச் செறிவாகவும், தீர்க்கதரிசன மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் தருகிறது.
- source_word: οἱ καταφρονηταί
  choice: இகழ்கிறவர்களே
  rationale: அசட்டை செய்வதையும் அவமதிப்போடு நிராகரிப்பதையும் குறிக்கும் கிரேக்கச் சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: θαυμάσατε
  choice: வியப்படைந்து
  rationale: அதிர்ச்சியூட்டும் வியப்பைத் தருகிறது; அடுத்த ஏவலுடன் இயல்பாக இணைவதற்காக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀφανίσθητε
  choice: அழிந்துபோங்கள்
  rationale: மறைந்துபோதல் அல்லது நாசமடைதல் என்ற பரப்பைக் கொண்ட சொல்லை, இச்சூழலின் கடுமையான எச்சரிக்கைத் தொனியுடன் வழங்குகிறது.
- source_word: ἔργον ἐργάζομαι ἐγώ
  choice: நான் ஒரு செயலைச் செய்துவருகிறேன்
  rationale: வெளிப்படையாக இடம்பெறும் ἐγώ-வின் வலியுறுத்தலையும் நிகழ்ந்து கொண்டிருக்கும் தெய்வீகச் செயலையும் காக்கிறது; தமிழில் ‘செயலைச் செய்கிறேன்’ என்ற இயல்பற்ற மீளுரையைத் தவிர்க்க ‘செய்துவருகிறேன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: உங்கள் நாட்களில்
  rationale: காலக் குறிப்பையும் கேட்போருக்கான நேரடியான உடனடித்தன்மையையும் முறையாகப் பாதுகாக்கிறது.
- source_word: οὐ μὴ πιστεύσητε
  choice: நீங்கள் நிச்சயமாக நம்பவே மாட்டீர்கள்
  rationale: οὐ μή என்னும் வலியுறுத்தப்பட்ட மறுப்பை ‘நிச்சயமாக’ மற்றும் ‘நம்பவே மாட்டீர்கள்’ மூலம் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: அதை ஒருவர் உங்களுக்கு விரிவாக எடுத்துச் சொன்னாலும்
  rationale: ἐκδιηγέομαι என்பதிலுள்ள முழுமையாக அல்லது விரிவாக விவரித்துச் சொல்லும் நுணுக்கத்தைக் காக்கிறது; நிபந்தனை இங்கு வலியுறுத்தப்பட்ட மறுப்போடு இயல்பாக ‘சொன்னாலும்’ எனத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: ஆபகூக் மேற்கோளிலுள்ள தீர்ப்பின் எச்சரிக்கையை எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘அழிந்துபோங்கள்’ என்ற கடுமையான எச்சரிக்கை மொழியைப் பயன்படுத்துதல்
  alternative: ‘மறைந்துபோங்கள்’ அல்லது ‘காணாமற்போங்கள்’ என்று அதிகச் சொற்பொருள் நெருக்கத்துடன் மொழிபெயர்த்தல்
  rationale: ἀφανίσθητε மறைந்துபோதல் முதல் அழிவுறுதல் வரையிலான பொருள் பரப்பைக் கொண்டது. அப்போஸ்தலர் உரையில் இது தேவனுடைய செயலை இகழ்ந்து நிராகரிப்போருக்கான தீவிர எச்சரிக்கையாக இருப்பதால், தீர்ப்பின் வலிமையை மெலிதாக்காமல் ‘அழிந்துபோங்கள்’ என வழங்கப்பட்டுள்ளது.
- issue: ἔργον ἐργάζομαι ἐγώ என்பதில் செய்பவர் மற்றும் நிகழ்காலச் செயலின் வலியுறுத்தல்
  choice: ‘நான் ஒரு செயலைச் செய்துவருகிறேன்’
  alternative: ‘ஒரு செயல் நடைபெறுகிறது’ என்று செய்பவரை மறைமுகமாக்குதல்
  rationale: மூலத்தில் ἐγώ வெளிப்படையாக இருப்பதால், தேவனே செய்பவர் என்ற வலியுறுத்தலை மொழிபெயர்ப்பு காக்கிறது; அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், தீர்க்கதரிசன மேற்கோளுக்குரிய கண்ணியமும் கடுமையான எச்சரிக்கைத் தொனியும் காக்கப்பட்டுள்ளன. ‘இதோ’ என்பது சற்று உயர்ந்தாலும் பரவலாகப் புரியும் கவன ஈர்ப்புச் சொல். வாக்கியத்தின் முரண்பாட்டுத் தாக்கத்தை காக்க இறுதியில் வலியுறுத்தப்பட்ட மறுப்பு வைக்கப்பட்டுள்ளது.
