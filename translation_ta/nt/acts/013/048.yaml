source:
  edition: SBLGNT
  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: ta
  text: யூதரல்லாத மக்கள் இதைக் கேட்டபோது மகிழ்ந்தார்கள்; ஆண்டவரின் வார்த்தையை மகிமைப்படுத்தினார்கள். நித்திய வாழ்வுக்கென நியமிக்கப்பட்டிருந்தவர்கள் அனைவரும் நம்பினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நித்திய வாழ்வை நோக்கி மனம் சாய்ந்திருந்தவர்கள்.” இங்குள்ள கிரேக்கப் பெயரெச்ச வினைவடிவத்தை விளக்குபவர்கள் வெவ்வேறு விதமாகப் புரிந்துகொள்கிறார்கள்; எனினும், அதன் செயப்பாட்டு வடிவத்தை “நியமிக்கப்பட்டிருந்தவர்கள்” என்று மொழிபெயர்ப்பதே இங்கு மிகவும் நேரடியானது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: இதைக் கேட்டபோது
  rationale: நிகழ்வின் சூழலைக் காட்டும் நிகழ்காலப் பங்கேற்புவினையை இயல்பான தமிழில் காலத் துணைவாக்கியமாக வழங்குகிறது. ‘இதை’ என்பது முந்தைய வசனத்தில் கூறப்பட்ட செய்தியைச் சூழலிலிருந்து வெளிப்படுத்துகிறது.
- source_word: τὰ ἔθνη
  choice: பிற இனத்தவர்கள்
  rationale: இச்சூழலில் யூதர்களிலிருந்து வேறுபடுத்தப்படும் யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தவர்கள்’ என்பது நவீன தமிழில் இயல்பாகவும், ‘இனங்கள்/நாடுகள்’ என்ற மூலச்சொல்லின் பரப்பை ஓரளவு காக்கும் வகையிலும் உள்ளது.
- source_word: ἔχαιρον
  choice: மகிழ்ந்து
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியான கதைநடைச் செயலை இயல்பான தமிழில் இணைவினையாகக் காட்டுகிறது; கட்டாயமல்லாத ‘தொடங்கினர்’ என்ற தொடக்கநிலைப் பொருளைச் சேர்க்கவில்லை.
- source_word: ἐδόξαζον
  choice: மகிமைப்படுத்தினார்கள்
  rationale: δοξάζω என்பதன் ‘மகிமைப்படுத்துதல்’ என்ற வேதாகமப் பொருளைத் தக்கவைக்கிறது; வெறும் ‘புகழ்ந்தார்கள்’ என்பதைக் காட்டிலும் மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: ஆண்டவரின் வார்த்தையை
  rationale: λόγος இங்கு அறிவிக்கப்பட்ட செய்தியைக் குறித்தாலும், ‘வார்த்தை’ என்பது மூல உருவகத்தையும் வேதாகம ஒலியையும் காக்கிறது. κύριος என்பதற்கு மரியாதையான வழக்குத் தமிழ் ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπίστευσαν
  choice: நம்பினார்கள்
  rationale: எளிய இறந்தகாலச் செயலை நேரடியாக வழங்கி, மூலத்தில் இல்லாத விளக்க விரிவைத் தவிர்க்கிறது.
- source_word: ὅσοι
  choice: அனைவரும்
  rationale: ὅσοι என்பதன் அளவுசார் ‘எத்தனை பேரோ அவர்கள் அனைவரும்’ என்ற வலிமையை, தொடர்புப் பெயரெச்சத் தொடருடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τεταγμένοι
  choice: நியமிக்கப்பட்டிருந்தவர்கள்
  rationale: τάσσω என்பதன் நிறைவுற்ற செயப்பாட்டு பங்கேற்புவினையைத் தெளிவாகக் காக்கிறது. நியமித்தவர் யார் என்பதை வசனம் வெளிப்படையாகச் சொல்லாததால் மொழிபெயர்ப்பும் அதைச் சேர்க்கவில்லை.
- source_word: εἰς ζωὴν αἰώνιον
  choice: நித்திய வாழ்வுக்கென
  rationale: εἰς என்பதன் இலக்கு அல்லது நோக்கத் தொடர்பை ‘-க்கென’ இயல்பாக வெளிப்படுத்துகிறது; ‘நித்திய வாழ்வு’ என்பது தெளிவான, நிலைபெற்ற தமிழ் வேதாகமச் சொற்றொடர்.
theological_decisions:
- issue: τεταγμένοι என்பது தெய்வீக நியமிப்பையா மனித மனச்சார்பையா குறிக்கிறது
  choice: நித்திய வாழ்வுக்கென நியமிக்கப்பட்டிருந்தவர்கள்
  alternative: நித்திய வாழ்வை நோக்கி மனம் கொண்டிருந்தவர்கள்
  rationale: நிறைவுற்ற செயப்பாட்டு வடிவம் முதன்மையாக ஏற்கெனவே நியமிக்கப்பட்ட அல்லது ஒதுக்கப்பட்ட நிலையைக் குறிக்கிறது. எனினும், வசனம் நியமிப்பின் செய்பவரையோ அதன் முழுக் கோட்பாட்டு விளைவையோ வெளிப்படையாகச் சொல்லவில்லை; ஆகவே அவை முதன்மை உரையில் சேர்க்கப்படவில்லை. மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையைப் பயன்படுத்துகிறது. நீளமான கிரேக்க வாக்கியம் தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. கோட்பாட்டுச் சர்ச்சைக்குரிய சொல்லின் செயப்பாட்டு வலிமை முதன்மை உரையில் காக்கப்பட்டு, மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
