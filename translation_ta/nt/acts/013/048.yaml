revisions:
- from: பிற இனத்தவர்கள் இதைக் கேட்டபோது மகிழ்ந்து, ஆண்டவரின் வார்த்தையை மகிமைப்படுத்தினார்கள். நித்திய வாழ்வுக்கென நியமிக்கப்பட்டிருந்தவர்கள் அனைவரும் நம்பினார்கள்.[a]
  to: யூதரல்லாத மக்கள் இதைக் கேட்டபோது மகிழ்ந்தார்கள்; ஆண்டவரின் வார்த்தையை மகிமைப்படுத்தினார்கள். நித்திய வாழ்வுக்கென நியமிக்கப்பட்டிருந்தவர்கள் அனைவரும் நம்பினார்கள்.[a]
  rationale: The revision clarifies the contextual referent of τὰ ἔθνη, retains two coordinated finite verbs for the Greek imperfects, and improves the footnote’s Tamil grammatical terminology. It retains the source’s ambiguity regarding who appointed the believers and does not introduce a doctrinal conclusion.
