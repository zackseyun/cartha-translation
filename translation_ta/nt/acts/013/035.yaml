- source_word: ἐν ἑτέρῳ
  choice: வேறொரு சங்கீதத்தில்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், மேற்கோள் சங்கீதம் 16-லிருந்து வருவதால் ‘சங்கீதம்’ என்று நிரப்புவது வாசகருக்குத் தெளிவளிக்கிறது; மூலத்தின் சுருக்கத்தை அடிக்குறிப்பு தெரிவிக்கிறது.
