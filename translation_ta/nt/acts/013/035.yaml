  rationale: ὅσιος என்பதன் கடவுளுக்குரிய தூய்மை மற்றும் உண்மைத்தன்மை சார்ந்த பொருளைத் தக்கவைக்கிறது; இச்சூழலில் பவுல் இதை இயேசுவுக்குப் பயன்படுத்துகிறார்.
