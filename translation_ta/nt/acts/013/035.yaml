  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: ta
  text: 'ஆகவே, வேறொரு சங்கீதத்திலும்[a] அவர் கூறுகிறார்: ‘உம்முடைய பரிசுத்தமானவரைச் சிதைவைக்[c] காண விடமாட்டீர்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வேறொரு இடத்திலும்’ அல்லது ‘வேறொரு பகுதியில்’; கிரேக்கத்தில் ‘வேறொன்றில்’ என்று மட்டுமே உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அழிவு.’ இங்கே உடல் அழுகிச் சிதைவது குறிக்கப்படுகிறது.
    reason: lexical_alternative
