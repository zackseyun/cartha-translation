  rationale: 'முதன்மைத் திருத்தம் தமிழிலுள்ள பொருள் வேற்றுமையைத் தெளிவாக்குவதற்காக மட்டுமே செய்யப்பட்டுள்ளது: ‘பரிசுத்தமானவரைச்’ என்பது கிரேக்க τὸν ὅσιόν σου-வின் பொருள் நிலையையும், ‘காண விடமாட்டீர்’ என்ற அனுமதி மறுப்புத் தொடரையும் தெளிவாக இணைக்கிறது. [b] அடிக்குறிப்பு உரையில் மேற்கோள் சொல்லுக்கு இணைந்திருந்தும், முதன்மை உரையில் அதற்கான அடிக்குறிப்பு அழைப்பு இல்லாமையாலும், அதன் உரையை மாற்றாமல் அழைப்பை நீக்கியுள்ளேன்; இதனால் செயலிலில்லாத அடிக்குறிப்பு உருவாகாது. பிற சொற்களும் மாற்றுச் சாத்தியங்களும் பாதுகாக்கப்பட்டுள்ளன.'
