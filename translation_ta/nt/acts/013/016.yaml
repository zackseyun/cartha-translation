source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: ta
  text: பவுல் எழுந்து நின்று, கையால் சைகை செய்து, “இஸ்ரவேல் ஆண்களே, கடவுளுக்கு அஞ்சுகிறவர்களே[a], கேளுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுக்கு அஞ்சுவோர்.” இச்சொற்றொடர் கடவுளுக்கு அஞ்சுகிறவர்களைக் குறிக்கிறது; இவர்கள் யூதத் தொழுகைக்கூடத்துடன் தொடர்புடைய யூதரல்லாத வழிபாட்டாளர்களாக இருந்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: எழுந்து நின்று
  rationale: பவுல் பேசுவதற்கு முன் செய்த உடல்சார்ந்த செயலைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு வலுவான எதிர்மறை இணைப்பை அல்ல, நிகழ்வின் அடுத்த கட்டத்தை δέ குறிக்கிறது.
- source_word: κατασείσας τῇ χειρὶ
  choice: கையால் சைகை செய்து
  rationale: கவனத்தை ஈர்க்க அல்லது அமைதியைக் கோரச் செய்யப்பட்ட கைச் சைகையைச் சொல்கிறது; வெறுமனே ‘கையை அசைத்து’ என்பதால் ஏற்படக்கூடிய தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: εἶπεν
  choice: என்றார்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் இயல்பான தமிழ் கதைநடைச் சொல்.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: இஸ்ரவேல் ஆண்களே
  rationale: ἄνδρες என்பதிலுள்ள ஆண்பால் அழைப்பையும் Ἰσραηλῖται என்பதிலுள்ள இன-சமய அடையாளத்தையும் மறைக்காமல் காக்கிறது.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: கடவுளுக்கு அஞ்சுகிறவர்களே
  rationale: பங்கேற்பு வினையின் செயற்பொருளைத் தக்கவைத்து, தொழில்நுட்பப் பெயர்ச்சொல்லாக மாற்றாமல் வாசகருக்குத் தெளிவாக வழங்குகிறது.
- source_word: ἀκούσατε
  choice: கேளுங்கள்
  rationale: கவனமாகக் கேட்குமாறு கோரும் கட்டளையை நேரடியாகவும் மரியாதையான பன்மை அழைப்பிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: யூதத் தொழுகைக்கூடத்தில் இஸ்ரவேலருக்கும் கடவுளுக்கு அஞ்சிய மற்றவர்களுக்கும் விடுக்கப்பட்ட அழைப்பு
  choice: “இஸ்ரவேல் ஆண்களே, கடவுளுக்கு அஞ்சுகிறவர்களே”
  alternative: “இஸ்ரவேல் ஆண்களே, கடவுள் பயமுள்ளவர்களே” அல்லது “இஸ்ரவேல் மக்களே, கடவுளை வழிபடுகிறவர்களே”
  rationale: கிரேக்கம் இஸ்ரவேல் ஆண்களையும், கடவுளுக்கு அஞ்சுகிறவர்கள் என்று விவரிக்கப்படும் இரண்டாவது குழுவையும் வேறுபடுத்துகிறது. அவர்கள் யூதத் தொழுகைக்கூடத்துடன் தொடர்புடைய யூதரல்லாத வழிபாட்டாளர்களாக இருக்க வாய்ப்புள்ளது; ஆனால் முதன்மை உரை அந்த அடையாளத்தைத் தேவையின்றி உறுதிப்படுத்தாமல், மூலத்தின் மொழியையே காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நேரடி அழைப்பில் உள்ள ஆண்பால் குறிப்பு பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறியீடு அது விளக்கும் ‘கடவுளுக்கு அஞ்சுகிறவர்களே’ என்ற சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
