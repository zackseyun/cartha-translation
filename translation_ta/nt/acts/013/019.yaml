base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: ta
  text: கானான் நாட்டிலிருந்த ஏழு இனத்தாரை அழித்தபின், அவர்களுடைய நாட்டை இஸ்ரவேல் மக்களுக்கு மரபுரிமையாகக் கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய நாட்டை இஸ்ரவேல் மக்களுக்கு மரபுரிமையாகப் பங்கிட்டுக் கொடுத்தார்.’ கிரேக்க வினை நிலத்தை மரபுரிமையாகப் பகிர்ந்து ஒதுக்குவதையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: அழித்தபின்
  rationale: καθαιρέω என்ற வினை இச்சூழலில் கானானிய இனங்கள்மீது நிகழ்ந்த வெற்றியையும் அகற்றுதலையும் குறிக்கிறது. ‘அழித்தபின்’ என்பது அதன் வலிமையையும் முற்கால வினையெச்சத்தின் காலத் தொடர்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἔθνη ἑπτὰ
  choice: ஏழு இனத்தார்
  rationale: ἔθνη என்பது நாடுகள் அல்லது மக்கள் இனங்களைக் குறிக்கலாம். இங்கு நிலப்பரப்புகளை விட அவற்றில் வாழ்ந்த மக்களே செயலின் நேரடிப் பொருளாக இருப்பதால் ‘ஏழு இனத்தார்’ தெளிவாக உள்ளது.
- source_word: ἐν γῇ Χανάαν
  choice: கானான் நாட்டிலிருந்த
  rationale: γῇ என்பதைத் தவிர்க்காமல், தமிழில் இயல்பாக ‘கானான் நாட்டில்’ என்ற வடிவில் பாதுகாக்கிறது.
- source_word: κατεκληρονόμησεν
  choice: உரிமைச்சொத்தாகக் கொடுத்தார்
  rationale: இந்த வினை பரம்பரை உரிமையாக ஒதுக்குதல் அல்லது பங்கிட்டளித்தல் என்ற கருத்தைக் கொண்டுள்ளது. முதன்மை உரை உரிமைச்சொத்து என்ற கருத்தைப் பாதுகாக்கிறது; பகிர்ந்தளித்தல் என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὴν γῆν αὐτῶν
  choice: அவர்களுடைய நாட்டை
  rationale: αὐτῶν என்பது முன் குறிப்பிடப்பட்ட ஏழு இனத்தாரைக் குறிக்கிறது. ‘அவர்களுடைய நாட்டை’ என்பது அந்தத் தொடர்பை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: செயலின் எழுவாயும் உரிமைச்சொத்தைப் பெறுபவர்களும்
  choice: இரு செயல்களுக்கும் கடவுளே மறைமுக எழுவாய்; அந்த நாடு இஸ்ரவேல் மக்களுக்கு உரிமைச்சொத்தாகக் கொடுக்கப்பட்டது.
  alternative: பெறுபவரைக் குறிப்பிடாமல், ‘அவர்களுடைய நாட்டை உரிமைச்சொத்தாகக் கொடுத்தார்’ என்று மொழிபெயர்த்தல்.
  rationale: சுற்றியுள்ள வரலாற்றுக் கூறலில் கடவுளுடைய செயல்களே தொடர்ந்து விவரிக்கப்படுகின்றன. கிரேக்கத்தில் பெறுபவர் வெளிப்படையாகக் குறிப்பிடப்படாவிட்டாலும், முன் வரும் ஏழு இனத்தாருடன் ‘அவர்கள்’ என்று தவறாக இணைத்துப் புரிந்துகொள்ளாதபடி இஸ்ரவேல் மக்களை வெளிப்படையாகக் குறிப்பிடுவது தேவையான இயல்பான தெளிவாக்கம்; இது புதிய இறையியல் கருத்தைச் சேர்ப்பதல்ல.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. ‘உரிமைச்சொத்து’ என்பது inheritance என்ற கருத்தைச் சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது; ‘சுதந்தரம்’ என்பதன் இன்றைய முதன்மைப் பொருளான freedom உடன் ஏற்படக்கூடிய குழப்பம் தவிர்க்கப்பட்டுள்ளது.
