reference: Acts 13:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: ta
  text: 'அவர் கூறினார்: “எல்லாவித வஞ்சகமும் எல்லாவிதக் கயமையும் நிறைந்தவனே! பிசாசின் மகனே! எல்லா நீதிக்கும்[a] பகைவனே! ஆண்டவருடைய நேரான வழிகளைத் திரிப்பதை நீ நிறுத்தமாட்டாயா?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா நியாயத்துக்கும் பகைவனே.” கிரேக்கச் சொல் சூழலைப் பொறுத்து நீதியையோ நியாயத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: எல்லாவித வஞ்சகமும் நிறைந்தவனே
  rationale: πλήρης உடன் வரும் மரபுத்தொடர் ‘நிறைந்த’ என்ற பொருளைக் கொடுக்கிறது; παντός என்பதன் முழுமையான பரப்பை ‘எல்லாவித’ இயல்பாக வெளிப்படுத்துகிறது; δόλος என்பதற்கு ‘வஞ்சகம்’ பொருத்தமானது.
- source_word: πάσης ῥᾳδιουργίας
  choice: எல்லாவிதக் கயமையும்
  rationale: ῥᾳδιουργία என்பது பொதுவான தீமையை மட்டும் அல்லாமல் நேர்மையற்ற, இழிவான தீய நடத்தையையும் குறிக்கிறது. ‘கயமை’ அதன் கடுமையான குற்றச்சாட்டைத் தக்கவைக்கிறது.
- source_word: υἱὲ διαβόλου
  choice: பிசாசின் மகனே
  rationale: υἱέ என்பதன் நேரடிப் பொருள் ‘மகன்’; இங்கு அது பிசாசுடன் உள்ள ஒழுக்க ஒற்றுமையையோ சார்பையோ குறிக்கும் வலுவான வசையாக இருப்பதால் மூல உருவகம் தக்கவைக்கப்பட்டது.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: எல்லா நீதிக்கும் பகைவனே
  rationale: δικαιοσύνη இங்கு ஒழுக்கரீதியாக நேர்மையானதும் சரியானதுமான அனைத்தையும் குறிக்கிறது. ‘நீதி’ முதன்மை உரையில் வைக்கப்பட்டு, ‘நியாயம்’ என்ற சாத்தியமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐ παύσῃ
  choice: நீ நிறுத்தமாட்டாயா?
  rationale: எதிர்கால நடுநிலை வினை இங்கு கண்டனத்துடன் கூடிய வினாவாகச் செயல்படுகிறது. தமிழ் நடையில் ‘நிறுத்தமாட்டாயா?’ அதன் மோதலான தொனியை இயல்பாகத் தருகிறது.
- source_word: διαστρέφων
  choice: திரித்துக்கொண்டிருப்பதை
  rationale: διαστρέφω என்பது நேரான ஒன்றைத் திரித்தல் அல்லது பிறழ்த்தல் என்று பொருள்படும். தொடர்ச்சியான செயலைக் காட்டும் பங்கேற்புவினையின் அம்சத்தை ‘-க்கொண்டிருப்பதை’ வெளிப்படுத்துகிறது.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: ஆண்டவருடைய நேரான வழிகளை
  rationale: ὁδοί என்பதன் நேரடி மற்றும் உருவகப் பொருள்களை ‘வழிகள்’ தக்கவைக்கிறது; εὐθείας என்பதற்கு ‘நேரான’ என்றும் κύριος என்பதற்கு ‘ஆண்டவர்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: Ὦ
  choice: நேரடி விளிப்பைக் காட்டும் ‘-வனே’ வடிவங்களும் வியப்புக்குறிகளும்
  rationale: Ὦ வலியுறுத்தப்பட்ட நேரடி விளிப்பைக் குறிக்கிறது. தனியாக ‘ஓ’ என இடுவது இன்றைய தமிழில் செயற்கையாக இருக்கக்கூடும்; தொடர்ச்சியான ‘-வனே’ விளிப்புகளும் வியப்புக்குறிகளும் அதன் வலிமையை இயல்பாக வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: இந்தச் சூழலில் ஒழுக்க நேர்மையும் சரியான நிலையும் முதன்மை. எனினும், δικαιοσύνη நியாயத்தையும் குறிக்கக்கூடும் என்பதால் அந்த உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், அதே நேரத்தில் கண்டனத்தின் கடுமையும் வேதாகம உரைக்குரிய கண்ணியமும் நிலைக்குமாறும் வடிவமைக்கப்பட்டது. தொடர்ச்சியான நேரடி விளிப்புகள் மூலத்தின் வாக்கிய அமைப்பையும் தீவிரத்தையும் தக்கவைக்கின்றன.
