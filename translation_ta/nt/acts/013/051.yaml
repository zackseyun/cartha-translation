base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: ta
  text: ஆனால் அவர்கள் தங்கள் கால்களில் இருந்த தூசியை அவர்களுக்கு எதிராக உதறிவிட்டு, இக்கோனியாவுக்குச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒருவர் தமது கால்களில் இருந்த தூசியை உதறுவது, செய்தியை மறுத்தவர்களிடமிருந்து தம்மைப் பிரித்துக்கொள்வதையும் அவர்களுக்கு எதிரான சாட்சியாக இருப்பதையும் குறிக்கும் அடையாளச் செயலாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: ஆனால் அவர்கள்
  rationale: δέ இங்கு மெல்லிய எதிர்மறைத் திருப்பையோ கதை நகர்வையோ குறிக்கிறது; பெயர்ச்சொல் போல் செயல்படும் பங்கேற்புவினையுடன் உள்ள οἱ, பவுலையும் பர்னபாவையும் சுட்டுவதால் இயல்பான தமிழில் ‘அவர்கள்’ என வழங்கப்படுகிறது.
- source_word: ἐκτιναξάμενοι
  choice: உதறிவிட்டு
  rationale: ἐκτινάσσω என்பதன் இறந்தகாலப் பங்கேற்புவினை, ஒட்டியிருப்பதை வலுவாக உதறி அகற்றுவதைக் குறிக்கிறது. முதன்மை வினைக்கு முன் முடிந்த செயலை ‘உதறிவிட்டு’ இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: தங்கள் கால்களின் தூசியை
  rationale: κονιορτός என்பது தரையிலுள்ள மெல்லிய தூசியைக் குறிக்கிறது. தங்கள் கால்களில் படிந்த தூசி என்ற மூல உறவைத் தமிழ் மரபில் ‘தங்கள் கால்களின் தூசி’ இயல்பாகத் தருகிறது.
- source_word: ἐπ’ αὐτοὺς
  choice: அவர்களுக்கு எதிராக
  rationale: ἐπί + வேற்றுமை உருபு இச்சின்னச் செயல் யாரை நோக்கியது என்பதையும் அதன் எதிர்ப்பான அல்லது சாட்சியமான வலிமையையும் குறிக்கிறது. ‘எதிராக’ என்பது விளக்கத்தை மூலவசனத்திற்குள் விரிவாக்காமல் அந்த நுணுக்கத்தைப் பேணுகிறது.
- source_word: ἦλθον
  choice: சென்றார்கள்
  rationale: ἔρχομαι அடிப்படையில் ‘வருதல்’ எனினும், கதைசொல்லியின் பார்வையில் குறிப்பிடப்பட்ட இடத்தை நோக்கிய பயணம் தமிழில் இயல்பாக ‘சென்றார்கள்’ என வழங்கப்படுகிறது.
- source_word: εἰς Ἰκόνιον
  choice: இக்கோனியாவுக்கு
  rationale: εἰς நகரத்தை நோக்கிய அல்லது அதற்குள் செல்லும் இயக்கத்தைக் குறிக்கிறது; பயண இலக்கைத் தமிழில் இயல்பாக ‘இக்கோனியாவுக்கு’ எனக் கூறலாம்.
theological_decisions:
- issue: கால்களின் தூசியை உதறும் அடையாளச் செயல்
  choice: முதன்மை உரையில் அந்தச் செயலை ‘அவர்களுக்கு எதிராக’ என்று மட்டும் நேரடியாக வழங்குதல்
  alternative: ‘அவர்களுக்கு எதிரான சாட்சியாக’ அல்லது ‘அவர்கள்மேல் தீர்ப்பின் அடையாளமாக’ என்று விரித்துரைத்தல்
  rationale: இந்தச் செயலுக்கு வேதாகம மற்றும் பண்பாட்டு முக்கியத்துவம் இருந்தாலும், கிரேக்க உரை செயலும் அது யாருக்கு எதிராகச் செய்யப்பட்டது என்பதையும் மட்டுமே கூறுகிறது. ஆகவே விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் தருவது மூலத்தின் சுருக்கத்தையும் அதன் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உதறிவிட்டு’ என்பது செயல் வரிசையைத் தெளிவாகக் காட்டுகிறது; ‘இக்கோனியா’ என்பது பரவலாக அறியப்பட்ட தமிழ் இடப்பெயர் வடிவம். அடிக்குறிப்பு குறியீடு உரையில் சேர்க்கப்பட்டுள்ளது.
