source:
  edition: SBLGNT
  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: ta
  text: அப்போது, நடந்ததை[a] ரோம மாகாண ஆளுநரான புரோகொன்சல்[c] கண்டு, ஆண்டவருடைய போதனையால்[b] வியப்படைந்து நம்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிகழ்ந்ததை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆண்டவரிடமிருந்து வந்த போதனை’ அல்லது ‘ஆண்டவரைப் பற்றிய போதனை’ என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் உள்ள உடைமை வேற்றுமை ஒன்றுக்கு மேற்பட்ட தொடர்புகளைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: c
    text: ‘புரோகொன்சல்’ என்பது ரோமப் பேரரசின் குறிப்பிட்ட மாகாண நிர்வாகப் பதவிப்பெயர்.
    reason: historical_term
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதையில் அடுத்ததாக நிகழ்ந்ததைச் சுட்டும் காலத்தொடர்ச்சி வினையடை; நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: ἰδὼν
  choice: கண்டு
  rationale: ὁράω என்பதன் இறந்தகாலப் பங்கேற்பு வடிவம். முதன்மை வினைக்கு முன்னோ அல்லது அதனுடன் தொடர்பாகவோ நிகழ்ந்த செயலைத் தமிழில் இயல்பான வினையெச்சமாகக் காட்டுகிறது.
- source_word: ὁ ἀνθύπατος
  choice: மாகாண ஆளுநர்
  rationale: ரோம ஆட்சிமுறையின் குறிப்பிட்ட proconsul பதவியைக் குறிக்கிறது. புரிந்துகொள்ளக் கடினமான ஒலிபெயர்ப்பைத் தவிர்த்து, அந்தப் பதவியின் மாகாண ஆட்சிப் பொறுப்பைத் தெளிவாகத் தருகிறது.
- source_word: τὸ γεγονός
  choice: நடந்ததை
  rationale: γίνομαι என்பதன் நிறைவுற்ற பங்கேற்பு பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டு, ஏற்கெனவே நிகழ்ந்து முடிந்த சம்பவத்தைக் குறிக்கிறது. ‘நடந்ததை’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἐπίστευσεν
  choice: நம்பினார்
  rationale: πιστεύω என்பதற்கு இங்கு வெளிப்படையான செயப்படுபொருள் இல்லை. எனவே ‘ஆண்டவரை நம்பினார்’ அல்லது ‘செய்தியை நம்பினார்’ என்று பொருளை மிகைப்படுத்தாமல் கிரேக்கத்தின் சுருக்கத்தைப் பேணுகிறது.
- source_word: ἐκπλησσόμενος
  choice: வியப்படைந்து
  rationale: முதன்மை வினையுடன் இணைந்து நிகழும் மனநிலையைச் சுட்டும் நிகழ்காலப் பங்கேற்பு. தமிழில் வினையெச்சம் அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: போதனையைக் குறித்து
  rationale: ἐπί + dative இங்கு வியப்புக்கான அடிப்படை அல்லது காரணமான பொருளைச் சுட்டுகிறது. ‘குறித்து’ என்பது போதனையே வியப்பின் பொருள் என்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவருடைய
  rationale: மூலத்தின் genitive தொடர்பைத் தமிழின் உடைமை வடிவில் பேணி, அது ஆண்டவரிடமிருந்து வந்த போதனையா அல்லது ஆண்டவரைப் பற்றிய போதனையா என்பதை முதன்மை உரையில் கட்டாயமாகத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: வெளிப்படையான செயப்படுபொருள் இல்லாத πιστεύω என்பதன் பொருள்
  choice: ‘நம்பினார்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆண்டவரை நம்பினார்’ அல்லது ‘நற்செய்தியை நம்பினார்’
  rationale: சூழல் கிறிஸ்தவ நம்பிக்கையை உணர்த்தினாலும், கிரேக்க உரை நம்பிக்கையின் செயப்படுபொருளை வெளிப்படையாகக் கூறவில்லை. ஆகவே வாசகர் சூழலிலிருந்து உணருமாறு மூலத்தின் சுருக்கமும் திறந்த தன்மையும் பேணப்பட்டன.
- issue: τοῦ κυρίου என்ற genitive-ன் தொடர்பு
  choice: ‘ஆண்டவருடைய போதனை’
  alternative: ‘ஆண்டவரிடமிருந்து வந்த போதனை’ அல்லது ‘ஆண்டவரைப் பற்றிய போதனை’
  rationale: இந்த genitive மூலத்தையோ, உரிமையையோ, போதனையின் பொருளையோ குறிக்கக்கூடும். முதன்மை உரை ‘ஆண்டவருடைய’ என்று வைத்து அந்தத் தெய்வவியல் மற்றும் இலக்கணத் தெளிவின்மையைப் பேணுகிறது; அடிக்குறிப்பு சாத்தியங்களை விளக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் உள்ள நடையில் அமைக்கப்பட்டது. ‘மாகாண ஆளுநர்’ என்பது வரலாற்றுப் பதவியின் செயல்பாட்டை சாதாரண வாசகருக்குப் புரியும் வகையில் தருகிறது. வாக்கியத்தின் இறுதியில் ‘வியப்படைந்து நம்பினார்’ என்று அமைத்ததால், போதனையால் ஏற்பட்ட வியப்பும் நம்பிக்கையும் நெருக்கமாக இணைந்துள்ளன.
