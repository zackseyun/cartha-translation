source:
  edition: SBLGNT
  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: ta
  text: அவர் பல நாட்கள் தம்முடன் கலிலேயாவிலிருந்து எருசலேமுக்குச் சென்றவர்களுக்குத் தோன்றினார்[a]. அவர்களே இப்போது மக்களுக்கு[b] அவருடைய சாட்சிகளாக இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பல நாட்கள் காணப்பட்டார்.” உயிர்த்தெழுதலுக்குப் பிந்தைய காட்சியளிப்புகளைக் குறிக்கும் இடங்களில் கிரேக்க வினைச்சொல்லை இவ்வாறு இன்னும் நேரடியாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே “மக்கள்” என்பது சூழலின்படி குறிப்பாக இஸ்ரவேல் மக்களை, அதாவது யூத மக்களைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: அவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இயேசுவையே சார்புப்பெயர் குறிக்கிறது. தமிழில் புதிய வாக்கியமாக இயல்பாகத் தொடர ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὤφθη
  choice: தோன்றினார்
  rationale: உயிர்த்தெழுதலுக்குப் பிந்தைய காட்சியளிப்புகளைக் குறிக்கும் சூழலில் இந்தச் செயப்பாட்டு வடிவம் இயல்பாக ‘தோன்றினார்’ என்று பொருள்படும்; ‘காணப்பட்டார்’ என்பது நேரடியான மாற்று.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: பல நாட்களாக
  rationale: கால நீட்சியைக் குறிக்கும் தொடரை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: தம்முடன் ... சென்றவர்களுக்கு
  rationale: அவரோடு பயணம் செய்தவர்களைச் சுட்டுகிறது. எருசலேமை நோக்கிய ‘மேலே செல்லுதல்’ என்ற மூலமொழி வழக்கைத் தமிழில் செயற்கையாகத் திணிக்காமல் பயணப் பொருள் தெளிவாக வழங்கப்பட்டுள்ளது.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: கலிலேயாவிலிருந்து எருசலேமுக்கு
  rationale: பயணத்தின் தொடக்கத்தையும் இலக்கையும் நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: οἵτινες
  choice: அவர்களே
  rationale: அதே குழுவினர்தான் இப்போது சாட்சிகளாக இருப்பதை οἵτινες வலியுறுத்துவதால் ‘அவர்களே’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: νῦν
  choice: இப்போது
  rationale: முந்தைய தோற்றங்களுக்கும் அவர்களுடைய தற்போதைய சாட்சிப் பணிக்கும் உள்ள கால வேறுபாட்டைக் காக்கிறது.
- source_word: μάρτυρες αὐτοῦ
  choice: அவருடைய சாட்சிகள்
  rationale: அவர்கள் அவரைச் சார்ந்தவர்களாகவும் அவரைக் குறித்து சாட்சி அளிப்பவர்களாகவும் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πρὸς τὸν λαόν
  choice: மக்களுக்கு
  rationale: சாட்சி எந்த மக்களை நோக்கிச் செலுத்தப்படுகிறது என்ற திசை அல்லது பெறுநர் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: λαόν
  choice: மக்கள்
  rationale: சூழலில் இஸ்ரவேல் அல்லது யூத மக்களைக் குறிக்க வாய்ப்பிருந்தாலும், கிரேக்கம் வெளிப்படையாக ‘மக்கள்’ என்றே கூறுவதால் முதன்மை உரையில் அதே பொதுவான சொல்லாட்சி காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: உயிர்த்தெழுதலுக்குப் பிந்தைய காட்சியளிப்பின் தன்மை
  choice: தோன்றினார்
  alternative: காணப்பட்டார்
  rationale: ‘தோன்றினார்’ என்பது ὤφθη என்பதன் சூழல்சார் பொருளை இயல்பாகத் தருகிறது; அதே நேரத்தில் நிகழ்வின் வரலாற்றுத் தன்மையையோ சாட்சிகளின் நேரடிக் காணுதலையோ குறைக்கவில்லை. செயப்பாட்டு வடிவத்தின் நேரடியான பிரதிபலிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: ‘மக்கள்’ என்பதன் வரம்பு
  choice: மக்கள்
  alternative: இஸ்ரவேல் மக்கள் / யூத மக்கள்
  rationale: சூழல் பெரும்பாலும் இஸ்ரவேல் மக்களைக் குறித்தாலும், மூல உரை λαός என்ற பொதுச் சொல்லையே பயன்படுத்துகிறது. ஆகவே முதன்மை உரை அந்தத் திறந்த சொல்லாட்சியைப் பாதுகாக்கிறது; சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தம்முடன்’ என்பது இயேசுவை மரியாதையுடன் சுட்டும் இயல்பான தற்சுட்டுப் பயன்பாடு. மூலத்தின் இரு தொடர்புடைய உட்பிரிவுகள் தமிழில் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளன; ‘அவர்களே’ என்ற வடிவம் சாட்சிகளின் அடையாளத் தொடர்ச்சியைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
