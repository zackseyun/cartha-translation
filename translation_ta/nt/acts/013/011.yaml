id: ACT.13.11
reference: Acts 13:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: ta
  text: இப்போது இதோ, ஆண்டவரின் கை உன்மேல் இருக்கிறது; ஒரு காலத்திற்கு நீ குருடனாய், சூரியனைக் காணாமல் இருப்பாய். உடனே பனிமூட்டமும் இருளும் அவன்மேல் படர்ந்தன; அவன் அங்குமிங்கும் சென்று, தன்னைக் கைப்பிடித்து நடத்த ஆட்களைத் தேடினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லின் உயிரோட்டத்தையும் மதிப்புமிக்க நடையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: χεὶρ κυρίου
  choice: ஆண்டவரின் கை
  rationale: இங்கே தண்டனைத் தீர்ப்பாக வெளிப்படும் இறைச் செயலாற்றலைக் குறிக்கும் வேதாகம உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே காக்கிறது.
- source_word: ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον
  choice: நீ குருடனாகி, சூரியனைக் காணமாட்டாய்
  rationale: குருடாகும் நிலை தொடங்குவதையும் சூரியனைக் காணாததையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது; 'சூரியன்' என்ற மூலப்படிமம் காக்கப்படுகிறது.
- source_word: ἄχρι καιροῦ
  choice: சிறிது காலம்
  rationale: காலவரம்பு குறிப்பிடப்படாத தற்காலிக நிலையைக் குறிக்கும் இயல்பான தமிழ்; கிரேக்கத்தின் துல்லியமான கால அளவை நிர்ணயிக்கவில்லை.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: நிகழ்வு திடீரெனவும் உடனடியாகவும் நடந்ததை நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἀχλὺς καὶ σκότος
  choice: பனிமூட்டமும் இருளும்
  rationale: பார்வையை மறைக்கும் மங்கலான மூட்டம் மற்றும் இருள் என்ற இரட்டை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἔπεσεν ἐπ’ αὐτὸν
  choice: அவன்மேல் படர்ந்தன
  rationale: தமிழில் மூட்டமும் இருளும் ஒருவரைச் சூழ்ந்து மூடுவதை இயல்பாகச் சொல்கிறது; கிரேக்கத்தில் ஒருமை வினை இருந்தாலும் கூட்டெழுவாய்க்குத் தமிழ் பன்மை இயல்பானது.
- source_word: περιάγων
  choice: அங்குமிங்கும் சென்று
  rationale: சுற்றிச் செல்லுதல் என்ற பங்கேற்புச் சொல்லின் பொருளை, 'தடவித் தேடுதல்' போன்ற கூடுதல் விளக்கத்தைச் சேர்க்காமல் சூழலுக்கு ஏற்ற தமிழில் தருகிறது.
- source_word: ἐζήτει χειραγωγούς
  choice: தன்னைக் கைப்பிடித்து நடத்த ஆட்களைத் தேடினான்
  rationale: χειραγωγός என்பதன் குறிப்பான 'கையால் வழிநடத்துபவர்' என்ற பொருளைப் பொதுவான 'வழிகாட்டிகள்' என்பதைக் காட்டிலும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவரின் கை’ என்பதன் தன்மை
  choice: இறைச் செயலையும் இச்சூழலில் தீர்ப்பையும் குறிக்கும் உருவகமாக அப்படியே வைத்தல்
  alternative: ‘ஆண்டவரின் தண்டனை உன்மேல் வந்துள்ளது’ அல்லது ‘ஆண்டவர் உன்னை அடிக்கிறார்’
  rationale: சூழல் இறைத்தீர்ப்பைக் காட்டினாலும், மூலத்தின் வேதாகம உருவகத்தை நேரடி இறையியல் விளக்கமாக மாற்றாமல் பாதுகாப்பது பொருத்தமானது.
- issue: ἄχρι καιροῦ குறிக்கும் காலவரம்பு
  choice: ‘சிறிது காலம்’ என்று தற்காலிகமான, நிர்ணயிக்கப்படாத காலமாக மொழிபெயர்த்தல்
  alternative: ‘ஒரு குறிப்பிட்ட காலம் வரை’ அல்லது ‘ஒரு பருவம் வரை’
  rationale: தண்டனை நிரந்தரமல்ல என்பதை உரை சுட்டுகிறது; ஆனால் அதன் சரியான நீளத்தை உரை நிர்ணயிக்காததால் அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத்தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மதிப்புமிக்க நடை. ‘ஆண்டவரின் கை’ என்ற வேதாகம உருவகம் காக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத விளக்கவுரை அல்லது பிரிவுசார் இறையியல் சொற்கள் சேர்க்கப்படவில்லை.
