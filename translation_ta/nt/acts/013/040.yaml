  text: βλέπετε οὖν μὴ ⸀ἐπέλθῃ τὸ εἰρημένον ἐν τοῖς προφήταις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: ta
  text: 'ஆகவே, தீர்க்கதரிசிகளின் நூல்களில்[a] சொல்லப்பட்டிருப்பது உங்களுக்கு நேரிடாதபடி எச்சரிக்கையாக இருங்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீர்க்கதரிசிகளால்.’ கிரேக்க மொழியில் நேரடியாக ‘தீர்க்கதரிசிகளில்’ என்று உள்ளது; இந்த எச்சரிக்கை காணப்படும் தீர்க்கதரிசன நூல்களை இது பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: இரண்டாம் நபர் பன்மை நிகழ்காலக் கட்டளை இங்கு தீவிரமான எச்சரிக்கையாகச் செயல்படுகிறது. இத்தமிழாக்கம் இயல்பாகவும் கண்ணியமாகவும் அந்த எச்சரிக்கை வலிமையைத் தக்கவைக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய அறிவிப்பிலிருந்து வரும் முடிவையும் அதனுடன் இந்த எச்சரிக்கைக்கு உள்ள தர்க்கத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: μὴ ἐπέλθῃ
  choice: உங்களுக்கு நேரிடாதபடி
  rationale: கட்டளைக்குப் பின் μή உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் எதிர்மறை நோக்கத்தையோ அச்சுறுத்தும் சாத்தியத்தையோ குறிக்கிறது. ‘நேரிடாதபடி’ என்பது வரவிருக்கும் தீர்ப்பு ஒருவர்மேல் வந்து சேரும் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: τὸ εἰρημένον
  choice: சொல்லப்பட்டிருப்பது
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிறைவுற்ற செயப்பாட்டு எச்சவினையின் பொருளையும், சொல்லப்பட்டது தொடர்ந்து நிலைத்திருப்பதையும் இவ்வடிவம் பாதுகாக்கிறது.
- source_word: ἐν τοῖς προφήταις
  choice: தீர்க்கதரிசிகளின் நூல்களில்
  rationale: ἐν என்பதன் ‘உள்ளே/இல்’ என்ற பொருளைத் தக்கவைத்து, அடுத்து ஆபகூக் நூலிலிருந்து மேற்கோள் வருவதால் தீர்க்கதரிசன வேதநூல் தொகுப்பில் இந்த எச்சரிக்கை காணப்படுவதை இயல்பான தமிழில் உணர்த்துகிறது.
theological_decisions:
- issue: ‘தீர்க்கதரிசிகள்’ என்பதன் குறிப்பு
  choice: தீர்க்கதரிசிகளின் வேதநூல்களை ஒரு தொகுப்பாகக் குறிக்கும் வாசிப்பு
  alternative: முதன்மையாக மனிதத் தீர்க்கதரிசிகள் பேசியதைக் குறிக்கும் வாசிப்பு
  rationale: பவுல் அடுத்து ஆபகூக்கிலிருந்து மேற்கோள் காட்டுவதால், தீர்க்கதரிசன வேதநூல்களில் எழுதப்பட்டிருப்பதே இங்கு முன்னிலையில் உள்ளது. இருப்பினும், தீர்க்கதரிசிகளே சொன்னார்கள் என்ற முகவர் சார்ந்த மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வாசிக்கக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘எச்சரிக்கையாக இருங்கள்’ அவசரமான எச்சரிக்கையை வெளிப்படுத்துகிறது; ‘சொல்லப்பட்டிருப்பது’ கிரேக்க நிறைவுற்ற வடிவத்தின் தொடரும் விளைவைப் பாதுகாக்கிறது.
