  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: ta
  text: ஆனால் யூதர்கள் மக்கள் கூட்டங்களைக் கண்டபோது[a], பொறாமையால் நிறைந்து[b], பவுல் சொல்லிக்கொண்டிருந்தவற்றை[c] எதிர்த்துப் பேசி, தூஷித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு பவுலை எதிர்த்த அந்த இடத்தைச் சேர்ந்த யூதக் குழுவே குறிக்கப்படுகிறது; ஒட்டுமொத்த யூத மக்களும் அல்ல.
    reason: cultural_note
  - marker: b
    text: அல்லது, “ஆர்வத்தால் நிறைந்து.” இச்சூழலில் எதிர்மறையான “பொறாமை” என்ற பொருளே அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “பவுலால் சொல்லப்பட்டுக்கொண்டிருந்தவற்றை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தின் நேர்மறையான வரவேற்பிலிருந்து இங்குள்ள எதிர்ப்புக்கு வரும் கதைத் திருப்பைக் குறிக்கிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: மூலத்தில் உள்ள பொதுப் பெயரைச் சுருக்காமலும் ‘தலைவர்கள்’ என்று விளக்கமாகச் சேர்க்காமலும் தருகிறது; சூழல் வரம்பு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களை
  rationale: மூலத்தின் பன்மையைப் பாதுகாத்து, நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: ἐπλήσθησαν ζήλου
  choice: பொறாமையால் நிறைந்து
  rationale: ζῆλος என்பதற்கு ‘ஆர்வம்/வைராக்கியம்’ என்ற பொருளும் இருக்கலாம்; ஆனால் கூட்டங்களைக் கண்டதைத் தொடர்ந்து எதிர்ப்பும் தூஷணமும் வருவதால் இங்கு எதிர்மறையான ‘பொறாமை’ பொருள் சூழலுக்கு ஏற்றது.
- source_word: ἀντέλεγον
  choice: எதிர்த்துப் பேசி
  rationale: தொடர்ச்சியான எதிர்ப்புப் பேச்சைக் குறிக்கும் இறந்தகால imperfect வடிவை இயல்பாக வெளிப்படுத்துகிறது; ‘முரண்பட்டார்கள்’ என்பதைக் காட்டிலும் வாய்மொழி எதிர்ப்பைத் தெளிவாக்குகிறது.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: பவுல் சொல்லிக்கொண்டிருந்தவற்றை
  rationale: பவுலின் பேச்சின் உள்ளடக்கத்தையும் அப்போது தொடர்ந்துகொண்டிருந்த செயற்பாட்டையும் இயல்பான செயப்பாட்டு தமிழில் தருகிறது.
- source_word: βλασφημοῦντες
  choice: தூஷித்தார்கள்
  rationale: அவர்களின் எதிர்ப்போடு இணைந்த கடுமையான இழிவுப் பேச்சைச் சுட்டுகிறது; யாரை அல்லது எதைத் தூஷித்தார்கள் என்பதை மூலத்தைவிடத் துல்லியமாக்காமல் விடுகிறது.
theological_decisions:
- issue: οἱ Ἰουδαῖοι என்பதைக் கொண்டு எல்லா யூதர்களையும் குற்றஞ்சாட்டும் வாசிப்பு ஏற்படும் சாத்தியம்
  choice: யூதர்கள்
  alternative: யூதத் தலைவர்கள் / யூதேயர்கள்
  rationale: மூலம் ‘யூதர்கள்’ என்றே கூறுகிறது; ‘தலைவர்கள்’ என்று குறுக்குவது விளக்கச் சேர்க்கையாகிவிடும். இருப்பினும் இச்சொல் இந்த நிகழ்வில் பவுலை எதிர்த்த உள்ளூர் யூதக் குழுவைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: ζῆλος என்பதின் இருபொருள்
  choice: பொறாமை
  alternative: ஆர்வம் / வைராக்கியம்
  rationale: சொல்லின் நேர்மறை அல்லது எதிர்மறை இருபொருளையும் ஏற்றுக்கொண்டு, இங்குள்ள பகைமையான சூழலின் அடிப்படையில் ‘பொறாமை’ என்பதை முதன்மை உரையில் தேர்ந்தெடுக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் பன்மை, தொடர்ச்சியான எதிர்ப்பு, ζῆλος சொல்லின் பொருள் இழுப்பு, βλασφημοῦντες என்பதன் குறிப்பிடப்படாத இலக்கு ஆகியவை இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
