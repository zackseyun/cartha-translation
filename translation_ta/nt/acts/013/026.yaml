id: ACT.13.26
reference: Acts 13:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: ta
  text: சகோதரர்களே,[a] ஆபிரகாமின் குலத்து மகன்களே, உங்களிடையே கடவுளுக்கு அஞ்சுகிறவர்களே,[b] இந்த மீட்பின் செய்தி[c] நமக்கு அனுப்பப்பட்டுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்களே, சகோதரர்களே.” கிரேக்க அழைப்பு சொல்லுக்கு சொல் ஆண்பாலில் உள்ளது; ஆனால் கூடியிருந்த பரந்த அவையினரும் நோக்கப்பட்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களிடையே உள்ள கடவுளுக்குப் பயந்தவர்கள்.” இது இஸ்ரவேலின் கடவுளை வழிபட்டு ஜெபக்கூடத்துடன் தொடர்புகொண்டிருந்த யூதரல்லாதவர்களைக் குறிக்கும் பெயராக இருக்கலாம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “இந்த மீட்பின் வார்த்தை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: சகோதரர்களே
  rationale: தமிழில் இயல்பான நேரடி அழைப்பாக இது அமைகிறது. கிரேக்கச் சொற்றொடர் இலக்கணப்படி ஆண்பாலில் இருப்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது; கலந்திருந்திருக்கக்கூடிய அவையினரை வெளிப்படையாக ‘சகோதர சகோதரிகளே’ என்று விரிவுபடுத்தவில்லை.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: ஆபிரகாமின் குலத்து மகன்களே
  rationale: υἱοί என்பதன் ‘மகன்கள்’ என்ற ஆண்பால் உறவுமுறையையும் γένος என்பதன் குலம் அல்லது வம்சம் என்ற கருத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: உங்களிடையே கடவுளுக்கு அஞ்சுகிறவர்களே
  rationale: இதை ஒரு வரலாற்றுக் குழுவின் தொழில்நுட்பப் பெயராக மட்டும் காட்டாமல், கிரேக்கத்தில் உள்ள விளக்கமான பொருளை நேரடியாகத் தருகிறது.
- source_word: ἡμῖν
  choice: நமக்கு
  rationale: ἐξαπεστάλη என்பதோடு வரும் திசைநோக்கிய தந்தைவேற்றுமைப் பொருளைத் தக்கவைக்கிறது; பேசுகிறவரையும் கேட்கிறவர்களையும் உள்ளடக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ὁ λόγος
  choice: செய்தி
  rationale: இங்கு λόγος என்பது அறிவிக்கப்படும் உள்ளடக்கத்தைக் குறிக்கிறது; நவீன தமிழில் ‘செய்தி’ இயல்பாகப் பொருளைத் தெரிவிக்கிறது. ‘வார்த்தை’ என்ற நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῆς σωτηρίας ταύτης
  choice: இந்த மீட்பின்
  rationale: σωτηρία என்பதற்கு ‘மீட்பு’ என்பது இயல்பான, விரிவான தமிழ் சொல். ‘மீட்பைப் பற்றிய’ என்று விளக்கி முடிவுசெய்யாமல், கிரேக்கப் பிறப்புவேற்றுமையின் நெருக்கத்தை ‘மீட்பின் செய்தி’ எனப் பாதுகாக்கிறது.
- source_word: ἐξαπεστάλη
  choice: அனுப்பப்பட்டுள்ளது
  rationale: முடிவுற்ற அனுப்புதலையும் அதன் நிகழ்காலப் பொருத்தத்தையும் தமிழ் வினைவடிவம் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: φοβούμενοι τὸν θεόν என்ற கேட்போர் அடையாளம்
  choice: ‘கடவுளுக்கு அஞ்சுகிறவர்கள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  alternative: ‘கடவுளுக்குப் பயந்தவர்கள்’ என்ற வரலாற்றுக் குழுப்பெயராகக் காட்டுதல்
  rationale: இந்தத் தொடர் இஸ்ரவேலின் கடவுளை வழிபட்ட யூதரல்லாத ஜெபக்கூடச் சார்பாளர்களைக் குறிக்கக்கூடும்; எனினும் கிரேக்கம் விளக்கமான வாசிப்பையும் அனுமதிப்பதால் முதன்மை உரை தேவையற்ற வரலாற்றுச் சிறப்பைத் திணிக்கவில்லை.
- issue: Ἄνδρες ἀδελφοί என்ற ஆண்பால் அழைப்பு
  choice: ‘சகோதரர்களே’ என்ற ஆண்பால் வடிவத்தை வைத்திருத்தல்
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: கிரேக்க வடிவம் வெளிப்படையாக ஆண்பாலில் உள்ளது. பரந்த அவையினரும் நோக்கப்பட்டிருக்கலாம் என்ற சாத்தியத்தை அடிக்குறிப்பில் தெரிவித்து, மூலத்தில் இல்லாத பெண்பால் சொல்லை முதன்மை உரையில் சேர்க்கவில்லை.
- issue: σωτηρία என்பதன் மொழிபெயர்ப்பு
  choice: மீட்பு
  alternative: இரட்சிப்பு
  rationale: ‘மீட்பு’ என்பது சாதாரண நவீன வாசகருக்குப் புரியும், இயல்பான சொல்; அதே நேரத்தில் பாவம், ஆபத்து, தீர்ப்பு ஆகியவற்றிலிருந்து கடவுள் அளிக்கும் விடுதலை என்ற விரிவான வேதாகமக் கருத்தை முன்கூட்டியே குறுக்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் பொதுக்கூட்ட உரைக்கேற்ற கண்ணியமான தொனியிலும் அமைக்கப்பட்டுள்ளது. மூலத்தின் ஆண்பால் உறவுமுறைச் சொற்களும் ‘மீட்பின் செய்தி’ என்ற பொருள் நெருக்கமும் பாதுகாக்கப்பட்டுள்ளன; வரலாற்று மற்றும் சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
