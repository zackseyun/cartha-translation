source:
  edition: SBLGNT
  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: ta
  text: அதன்பின் அவர்கள் தங்களுக்கு ஓர் அரசன் வேண்டும் என்று கேட்டார்கள்[a]. கடவுள் அவர்களுக்கு கீசின் மகனும் பென்யமீன் கோத்திரத்தைச் சேர்ந்தவருமான சவுலை நாற்பது ஆண்டுகளுக்குக் கொடுத்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கிருந்து அவர்கள் தங்களுக்கு ஓர் அரசன் வேண்டும் என்று கேட்டார்கள்.” தொடக்கச் சொல் வரலாற்று நிகழ்வுகளின் தொடரில் இடம்சார்ந்த அல்லது காலவரிசை மாற்றத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நாற்பது ஆண்டுகள்” என்பது பழைய ஏற்பாட்டின் காலக்கணக்குத் தகவல்களோடு ஒப்பிடும்போது சில காலவரிசைக் கேள்விகளை எழுப்பலாம். இங்கு லூக்காவின் சொற்றொடர் விளக்கி ஒத்திசைக்கப்படாமல் உள்ளபடியே மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: அதன்பின்
  rationale: இங்கு இந்தச் சொல் முந்தைய வரலாற்று நிகழ்வைத் தொடர்ந்து அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. சொல்லுக்குச் சொல் இடம்சார்ந்த வடிவத்தைவிட இயல்பான தமிழில் அதன் காலவரிசைத் தொடர்பை இது தெளிவாகக் காட்டுகிறது; மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ᾐτήσαντο βασιλέα
  choice: தங்களுக்கு ஓர் அரசன் வேண்டும் என்று கேட்டார்கள்
  rationale: இடை வினை வடிவம் மக்கள் தங்களுக்காக அரசனைக் கேட்டதை உணர்த்துகிறது. ‘கேட்டார்கள்’ என்பது ‘வற்புறுத்தினார்கள்’ என்ற தேவையற்ற கடுமையைச் சேர்க்காமல் வேண்டுகோளின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: கடவுள் அவர்களுக்குக் கொடுத்தார்
  rationale: வாக்கியத்தின் வெளிப்படையான எழுவாயையும் பொதுவான ‘கொடுத்தார்’ என்ற வினையையும் தக்கவைக்கிறது; ‘நியமித்தார்’ அல்லது ‘அருளினார்’ போன்ற விளக்கச் சுருக்கங்களைத் தவிர்க்கிறது.
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: கீசின் மகனான சவுலை
  rationale: தமிழின் இயல்பான உறவுமுறை அமைப்பில் தந்தையின் பெயரையும் நபரின் பெயரையும் தெளிவாகத் தருகிறது.
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: பென்யமீன் கோத்திரத்தைச் சேர்ந்தவருமான
  rationale: ἄνδρα என்பது சவுலைக் குறிக்கும் ஆண்பால் ஒருமை விளக்கம். தமிழில் ‘ஒரு மனிதன்’ என்று தனியே மொழிபெயர்ப்பது செயற்கையாக இருப்பதால், மரியாதை ஒருமையுடன் அவரது கோத்திரச் சேர்ந்திருப்பை இயல்பாக இணைக்கிறது.
- source_word: ἔτη τεσσεράκοντα
  choice: நாற்பது ஆண்டுகளுக்கு
  rationale: காலநீட்டத்தைக் குறிக்கும் வேற்றுமையைத் தமிழில் இயல்பாக வெளிப்படுத்தி, உடனே முந்திய கடவுள் சவுலைக் கொடுத்தார் என்ற கூற்றோடு இணைக்கிறது.
theological_decisions:
- issue: ἔτη τεσσεράκοντα என்ற காலக்குறிப்பின் தொடர்பும் பழைய ஏற்பாட்டுத் தரவுகளுடனான காலவரிசைக் கேள்வியும்
  choice: ‘சவுலை நாற்பது ஆண்டுகளுக்குக் கொடுத்தார்’ என்று உடனுள்ள வாக்கியத்தோடு இணைத்தல்
  alternative: வரலாற்றுச் சுருக்கத்தின் பொதுவான காலக்குறிப்பாகத் தளர்வாக எடுத்தல் அல்லது பிற வேதாகமத் தரவுகளோடு ஒத்திசைக்க விளக்குதல்
  rationale: கிரேக்க வாக்கிய ஓட்டத்தில் இக்காலக்குறிப்பு கடவுள் சவுலைக் கொடுத்தார் என்ற உடனுள்ள கூற்றோடு இயல்பாக இணைகிறது. தோன்றக்கூடிய காலவரிசைச் சிக்கலை மொழிபெயர்ப்புக்குள் தீர்க்காமல், லூக்காவின் சொற்களை உள்ளபடியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கோத்திரம்’ என்பது வேதாகமச் சூழலில் வழக்கமானதும் ‘குலம்’ என்பதைக் காட்டிலும் இஸ்ரவேலின் இனப்பிரிவைக் குறிப்பாக உணர்த்துவதுமான சொல். பெயர்கள் தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் ‘சவுல்’, ‘கீஸ்’, ‘பென்யமீன்’ வடிவங்களில் தரப்பட்டுள்ளன.
