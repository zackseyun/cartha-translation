id: ACT.13.9
reference: Acts 13:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: ta
  text: ஆனால் பவுல் என்ற பெயரும் கொண்ட சவுல்[a], தூய ஆவியால் நிரப்பப்பட்டு, அவனை உற்றுப் பார்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: “பவுலாகவும் இருந்த சவுல்.”'
    reason: ὁ καὶ Παῦλος என்பதில் ‘அழைக்கப்பட்ட’ என்ற வினை வெளிப்படையாக இல்லை என்பதைச் சுட்டி, கிரேக்கச் சொற்றொடரின் சுருக்கமான மாற்று வடிவத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Σαῦλος
  choice: சவுல்
  rationale: தனிப்பெயரைத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு முறையில் வழங்குகிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து சவுலின் எதிர்வினைக்குத் திரும்பும் மென்மையான எதிர்மறைத் திருப்பத்தைக் காட்டுகிறது.
- source_word: ὁ καὶ Παῦλος
  choice: பவுல் என்ற பெயரும் கொண்ட
  rationale: சவுலுக்கு பவுல் என்னும் மற்றொரு பெயரும் இருந்ததைத் தெரிவிக்கிறது; பெயர் மாற்றம் நிகழ்ந்ததாக மூலத்தில் இல்லாத கருத்தைச் சேர்ப்பதில்லை.
- source_word: πλησθεὶς
  choice: நிரப்பப்பட்டு
  rationale: இறந்தகாலச் செயப்பாட்டு எச்சத்தின் செயப்பாட்டு தன்மையைப் பாதுகாத்து, அடுத்த செயலோடு இயல்பாக இணைக்கிறது.
- source_word: πνεύματος ἁγίου
  choice: தூய ஆவியால்
  rationale: அப்போஸ்தலர் நூலின் சூழலில் தெய்வீகத் தூய ஆவியைக் குறிக்கிறது; தமிழில் நிரப்பப்படுதல் என்ற வினையுடன் இயல்பாக அமைகிறது.
- source_word: ἀτενίσας
  choice: உற்றுப் பார்த்தார்
  rationale: தொடர்ந்து கூர்ந்து நோக்கும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς αὐτόν
  choice: அவனை
  rationale: ἀτενίζω என்பதன் நோக்குப் பொருளைத் தமிழில் நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: πνεύματος ἁγίου என்பதன் குறிப்பு
  choice: தூய ஆவி
  alternative: ஒரு தூய ஆவி
  rationale: அப்போஸ்தலர் நூலின் பயன்பாடும், ஆற்றலளித்தல் பற்றிய இச்சூழலும், இது பொதுவான ஓர் ஆவியை அல்லாமல் தெய்வீகத் தூய ஆவியைக் குறிப்பதை வலுவாக ஆதரிக்கின்றன.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பவுல் என்ற பெயரும் கொண்ட’ என்பது இயல்பான தமிழையும் மூலத்தின் இரட்டைப் பெயர் குறிப்பையும் சமநிலைப்படுத்துகிறது.
