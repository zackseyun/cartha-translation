id: ACT.13.14
reference: Acts 13:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: ta
  text: அவர்களோ பெர்காவிலிருந்து தொடர்ந்து சென்று, பிசீதியாவிலுள்ள அந்தியோகியாவுக்கு[a] வந்தார்கள். ஓய்வுநாளில் அவர்கள் தொழுகைக்கூடத்திற்குள் சென்று அமர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிசீதிய அந்தியோகியா.” கிரேக்கத்தில், “பிசீதியாவிலுள்ள அந்தியோகியா” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: அவர்களோ
  rationale: δέ குறிக்கும் தொடர்ச்சியையும் மெல்லிய வேறுபாட்டையும் இயல்பான தமிழில் ‘-ஓ’ வெளிப்படுத்துகிறது; வெளிப்படையாக உள்ள αὐτοὶ என்பதற்கான பன்மை எழுவாயும் தக்கவைக்கப்படுகிறது.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: பெர்காவிலிருந்து தொடர்ந்து சென்று
  rationale: பயணக் கதையோட்டத்தில் διέρχομαι அங்கிருந்து மேலும் பயணித்ததைக் குறிக்கிறது; ‘தொடர்ந்து சென்று’ என்பது அந்த முன்னேற்றத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: παρεγένοντο
  choice: வந்தார்கள்
  rationale: பயணச் சூழலில் παραγίνομαι ஒரு இடத்துக்கு வந்து சேர்வதைக் குறிக்கிறது; ‘வந்தார்கள்’ தெளிவான, இயல்பான தமிழ்.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: பிசீதியாவிலுள்ள அந்தியோகியா
  rationale: அந்தியோகியா என்ற நகரை பிசீதியா பகுதியுடன் இணைத்து அடையாளப்படுத்தும் கிரேக்கத் தொடரை நெருக்கமாகப் பிரதிபலிக்கிறது; மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: அவர்கள் தொழுகைக்கூடத்திற்குள் சென்று
  rationale: கிரேக்கப் பங்கேற்புவினையை தமிழின் இயல்பான தொடர்வினை அமைப்பில் தருகிறது; συναγωγή என்பது இங்கு யூதர்களின் கூடுகை/வழிபாட்டு இடத்தைக் குறிக்கிறது.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: ஓய்வுநாளில்
  rationale: சொல்லாட்சியில் பன்மை வடிவம் இருந்தாலும், இச்சொற்றொடர் யூத ஓய்வுநாளைக் குறிக்கும் வழக்குச் சொற்றொடர்; நவீன தமிழில் ஒருமை இயல்பானது.
- source_word: ἐκάθισαν
  choice: அமர்ந்தார்கள்
  rationale: எளிய இறந்தகாலச் செயலைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
