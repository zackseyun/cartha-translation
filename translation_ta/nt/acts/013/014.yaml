translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இடப்பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; ‘தொழுகைக்கூடம்’ என்பது யூத συναγωγή-யைச் சூழலுக்கு ஏற்றவாறு குறிக்கிறது.
