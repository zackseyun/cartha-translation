id: ACT.13.24
reference: Acts 13:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: ta
  text: அவர் வருவதற்கு முன்பாக[a], யோவான் மனந்திரும்புதலின் திருமுழுக்கை[b] இஸ்ரயேல் மக்கள் அனைவருக்கும் அறிவித்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் வந்து சேருவதற்கு முன்பாக.’ ‘அவருடைய நுழைவின் முகத்திற்கு முன்’ என்று கிரேக்கம் சொல்லுக்குச் சொல் கூறுகிறது; இது ஒருவரின் வருகைக்கு முன்னதாக என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மனந்திரும்புவதற்கான திருமுழுக்கை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: அறிவித்திருந்தார்
  rationale: இது முந்திய காலத்தில் நிகழ்ந்த பொதுப் பிரகடனத்தைக் குறிக்கும் இறந்தகாலப் பெயரெச்சம். அடுத்துள்ள காலக் குறிப்பே முன்னுரிமையைத் தெளிவாக்குவதால், இயல்பான தமிழில் ‘அறிவித்திருந்தார்’ என வழங்கப்பட்டது.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: அவர் வருவதற்கு முன்பாக
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய நுழைவின் முகத்திற்கு முன்’ என்ற அமைப்பு, ஒருவரின் வருகைக்கு முன்னதாக என்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடர். தமிழில் அதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: εἰσόδου
  choice: வருவதற்கு
  rationale: அடிப்படையில் ‘நுழைவு/வருகை’ எனப் பொருள்படும் இச்சொல், இங்கு இயேசுவின் வருகை அல்லது வெளிப்படுதலைக் குறிக்கிறது. ‘வருவது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: βάπτισμα μετανοίας
  choice: மனந்திரும்புதலின் திருமுழுக்கு
  rationale: μετανοίας என்னும் உரிமை வேற்றுமையின் நேரடியான தொடர்பைத் தக்கவைத்து, அதன் நோக்கம் அல்லது விளைவை மட்டும் என்று முடிவுசெய்யாமல் உள்ளார்ந்த தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: இஸ்ரயேல் மக்கள் அனைவருக்கும்
  rationale: πᾶς, λαός ஆகிய இரு கூறுகளையும் இயல்பான நவீனத் தமிழில் பாதுகாத்து, அறிவிப்பு சென்ற மக்களைக் காட்டும் நான்காம் வேற்றுமையையும் தெளிவாக வழங்குகிறது.
- source_word: Ἰωάννου
  choice: யோவான்
  rationale: Ἰωάννης என்ற பெயருக்கான நிலைபெற்ற தமிழ் வேதாகம வடிவம்.
theological_decisions:
- issue: ‘அவர் வருவதற்கு’ என்பதிலுள்ள ‘அவர்’ யாரைக் குறிக்கிறது
  choice: முந்தைய வசனத்தின் இரட்சகராகிய இயேசுவைக் குறிக்கும் சுட்டுப்பெயர் அப்படியே வைக்கப்பட்டது.
  alternative: இந்த வசனத்தைத் தனியாக வாசிக்கையில் முன்னிலை நபரைப் பொதுவாக விடுதல், அல்லது ‘இயேசு’ என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: அப்போஸ்தலர் 13:23–25 சூழலில் சுட்டுப்பெயர் இயேசுவைக் குறிக்கிறது. ஆனால் இவ்வசனத்தின் கிரேக்கத்தில் பெயர் நேரடியாக இல்லாததால், விளக்கமாக ‘இயேசு’ என்பதைச் சேர்க்காமல் சுட்டுப்பெயரையே பாதுகாக்கிறது.
- issue: βάπτισμα μετανοίας என்பதிலுள்ள உரிமை வேற்றுமையின் உறவு
  choice: ‘மனந்திரும்புதலின் திருமுழுக்கு’ என்று வடிவத்தைப் பாதுகாத்தல்.
  alternative: ‘மனந்திரும்புவதற்கான திருமுழுக்கு.’
  rationale: இச்சொற்றொடர் திருமுழுக்கும் மனந்திரும்புதலும் இடையிலான நெருங்கிய தொடர்பைக் காட்டுகிறது; ஆனால் உறவை நோக்கமாக மட்டும் வரையறுக்கவில்லை. நேரடி வடிவம் அந்தத் தெய்வவியல் மற்றும் இலக்கணத் திறந்தநிலையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘திருமுழுக்கு’ என்பது βάπτισμα என்பதற்கான வெளிப்படையான தமிழ் வடிவமாகத் தேர்ந்தெடுக்கப்பட்டது. வாக்கிய ஒழுங்கு தமிழின் இயல்புக்கு ஏற்ப மாற்றப்பட்டாலும், யோவானின் அறிவிப்பு இயேசுவின் வருகைக்கு முந்தியது என்பதும் அது இஸ்ரயேல் மக்கள் அனைவரையும் நோக்கியது என்பதும் பாதுகாக்கப்பட்டுள்ளன.
