  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: ta
  text: ஏனெனில், எருசலேமில் வாழ்பவர்களும் அவர்களுடைய ஆட்சியாளர்களும் இவரை[a] அறிந்துகொள்ளாமல், ஒவ்வொரு ஓய்வுநாளிலும் வாசிக்கப்படும் தீர்க்கதரிசிகளின் குரல்களை[b], இவரைக் குற்றவாளி எனத் தீர்ப்பளித்ததன் மூலம் நிறைவேற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரை.’ கிரேக்கத்தில் ‘இவரை’ என்ற சுட்டுப்பெயர் உள்ளது; இது இயேசுவைச் சுட்டிப் பேசுபவரின் வலியுறுத்தலைக் காட்டலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தீர்க்கதரிசிகளின் வார்த்தைகளை.’ சொல்லுக்குச் சொல், ‘தீர்க்கதரிசிகளின் குரல்களை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: எருசலேமில் வாழ்கிறவர்கள்
  rationale: பெயர்ச்சொல் செயல்பாட்டில் உள்ள பங்கேற்புவினையை இயல்பான நவீனத் தமிழில் ஒரு மக்கள் குழுவாகக் காட்டுகிறது.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: அவர்களுடைய ஆட்சியாளர்கள்
  rationale: அரசியல் மற்றும் நீதித்துறை அதிகாரத்தின் வலிமையைத் தக்கவைக்கிறது.
- source_word: τοῦτον
  choice: இவரை
  rationale: இயேசுவைச் சுட்டும் கிரேக்க அண்மைச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀγνοήσαντες
  choice: அறிந்துகொள்ளாமல்
  rationale: இயேசு யார் என்பதை உணர்ந்து ஏற்றுக்கொள்ளத் தவறிய கருத்தைத் தருகிறது; அவருடைய இருப்பையே அறியவில்லை என்று மிகைப்படுத்துவதில்லை.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: தீர்க்கதரிசிகளின் குரல்களை
  rationale: φωνάς என்பதன் நேரடியான உருவகத்தைப் பாதுகாத்து, வேதாகம வாசிப்பில் கேட்கும் தீர்க்கதரிசனச் சாட்சியை வெளிப்படுத்துகிறது.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: ஒவ்வொரு ஓய்வுநாளிலும் வாசிக்கப்படும்
  rationale: மூலத்தின் பண்புப்பெயரெச்சத் தொடரையும் வழக்கமான காலக் குறிப்பையும் தெளிவாகக் காக்கிறது.
- source_word: κρίναντες
  choice: இவருக்குத் தண்டனைத் தீர்ப்பளித்ததன் மூலம்
  rationale: இச்சூழலில் பொதுவான மதிப்பீட்டை அல்ல, இயேசுவுக்கு எதிரான நீதித்துறைத் தண்டனைத் தீர்ப்பைக் குறிக்கிறது; அது நிறைவேற்றுதலுக்கான வழியாக இருந்ததையும் காட்டுகிறது.
- source_word: ἐπλήρωσαν
  choice: நிறைவேற்றினார்கள்
  rationale: தீர்க்கதரிசன வேதவாக்கு நிறைவேறியதைக் குறிக்கும் வழக்கமான, தெளிவான சொல்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: இயேசுவைப் பற்றிய அறியாமையின் தன்மை
  choice: இவரை அறிந்துகொள்ளாமல்
  alternative: இவரை அறியாமல்
  rationale: இயேசு இருந்ததையே அவர்கள் அறியவில்லை என்று சொல்லாமல், அவர் யார் என்பதை உணரத் தவறிய நிலையை வெளிப்படுத்தி, உரையின் பொறுப்பும் அறியாமையும் இடையிலான இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: தீர்க்கதரிசன நிறைவேற்றத்திற்கும் தீர்ப்பளித்தலுக்கும் உள்ள தொடர்பு
  choice: தண்டனைத் தீர்ப்பளித்ததன் மூலம் நிறைவேற்றினார்கள்
  alternative: தண்டனைத் தீர்ப்பளித்து நிறைவேற்றினார்கள்
  rationale: 'கிரேக்கப் பங்கேற்புவினையின் கருவிப் பொருளை வெளிப்படுத்துகிறது: அவர்களுடைய கண்டனத் தீர்ப்பே தீர்க்கதரிசனச் சாட்சியை நிறைவேற்றிய செயலாக அமைந்தது.'
