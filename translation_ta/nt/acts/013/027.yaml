  register: நவீன நிலையான தமிழில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘இவரை’ மற்றும் ‘குரல்களை’ என்பவை மூலக் கிரேக்கத்தின் தனித்துவமான வலியுறுத்தல்களைக் காக்கின்றன; அவற்றின் இயல்பான மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
