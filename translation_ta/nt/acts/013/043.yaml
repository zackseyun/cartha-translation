id: ACT.13.43
reference: Acts 13:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: ta
  text: ஜெபக்கூடக் கூட்டம் கலைந்தபின்[a], யூதர்களிலும் பக்தியுள்ள யூத மத மாற்றத்தாரிலும் பலர் பவுலையும் பர்னபாவையும் பின்தொடர்ந்தார்கள். பவுலும் பர்னபாவும் அவர்களோடு பேசிக்கொண்டே, கடவுளுடைய அருளில் தொடர்ந்து நிலைத்திருக்கும்படி அவர்களை வலியுறுத்தினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஜெபக்கூடச் சபை கலைந்தபின்.” கிரேக்கத்தில் இது கட்டடத்தைக் காட்டிலும் கூடிவந்த மக்களின் கூட்டம் முடிவடைந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுளுடைய அருளில் நிலைத்திருக்கும்படி அவர்களை வற்புறுத்திக்கொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: ஜெபக்கூடக் கூட்டம் முடிந்து மக்கள் கலைந்தபின்
  rationale: இங்கு συναγωγή கட்டடத்தைவிட கூடிவந்த சபையைக் குறிக்கிறது; λυθείσης என்பது கூட்டம் முடிந்து மக்கள் கலைவதைச் சுட்டுகிறது. இயல்பான தமிழுக்காக இரு கருத்துகளும் தெளிவாகத் தரப்பட்டுள்ளன.
- source_word: ἠκολούθησαν
  choice: பின்தொடர்ந்தார்கள்
  rationale: கூட்டம் முடிந்தபின் மக்கள் பவுலையும் பர்னபாவையும் தொடர்ந்து சென்ற நேரடியான செயலைக் குறிக்கிறது.
- source_word: πολλοὶ τῶν Ἰουδαίων
  choice: யூதர்களில் பலர்
  rationale: πολλοί உடன் வரும் பகுதிப் பொருளுடைய மரபுவேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῶν σεβομένων προσηλύτων
  choice: பக்தியுள்ள யூதமத மாற்றத்தாரில் பலர்
  rationale: προσήλυτος என்பது யூத மதத்தை முறையாகத் தழுவியவரைக் குறிக்கிறது; வெறும் யூதமத அனுதாபியைக் குறிக்கவில்லை. σεβομένων அவர்களுடைய பக்தியைச் சேர்க்கிறது.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: அவர்களோடு பேசிக்கொண்டே
  rationale: தொடர்ந்து நிகழும் உடன்செயலை இயல்பான தமிழில் காட்டுகிறது; உரையாடல் சார்ந்த தொடர்பையும் காக்கிறது.
- source_word: ἔπειθον
  choice: வலியுறுத்தினார்கள்
  rationale: நிறைவுறா இறந்தகால வடிவம் தொடர்ச்சியான முயற்சியைக் காட்டுகிறது; இச்சூழலில் அறிவுறுத்தல் அல்லது ஊக்குவித்தலின் வலிமையை ‘வலியுறுத்தினார்கள்’ இயல்பாகத் தருகிறது.
- source_word: αὐτοὺς προσμένειν
  choice: தொடர்ந்து நிலைத்திருக்கும்படி அவர்களை
  rationale: προσμένω என்பதில் தொடர்தலும் நிலைத்திருத்தலும் உள்ளன; இரண்டையும் சுருக்கமாகக் காக்கிறது.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: கடவுளுடைய அருளில்
  rationale: கடவுளின் கிருபையான செயல் மற்றும் அந்த அருள் உருவாக்கும் வாழ்வின் நிலை ஆகிய இரண்டையும் குறுக்காமல் திறந்தவாறு வைத்திருக்கிறது.
theological_decisions:
- issue: ‘கடவுளுடைய அருளில்’ என்பதன் பொருள்
  choice: கடவுளுடைய அருளில் தொடர்ந்து நிலைத்திருக்க
  alternative: கடவுளின் அருளான ஆதரவில் நிலைத்திருக்க / கடவுளுடைய அருளைப் பற்றிய செய்தியில் தொடர்ந்திருக்க
  rationale: கிரேக்கச் சொற்றொடர் கடவுளின் அருளான செயலையும் அந்த அருளால் வரையறுக்கப்படும் வாழ்வின் தளத்தையும் உள்ளடக்கக்கூடும். ஒரு கோட்பாட்டு விளக்கத்துக்கு மட்டும் சுருக்காமல் மூலத்தின் இறையியல் செறிவும் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஜெபக்கூடம்’, ‘யூதமத மாற்றத்தார்’, ‘அருள்’ ஆகியவை சூழலையும் மூலச் சொற்களின் வேறுபாடுகளையும் தெளிவாகக் காக்கின்றன.
