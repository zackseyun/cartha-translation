source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: ta
  text: இஸ்ரவேல் என்னும் இந்த மக்களின் கடவுள் நம் முற்பிதாக்களைத் தேர்ந்தெடுத்தார்[a]. அவர்கள் எகிப்து நாட்டில் அந்நியராகத் தங்கியிருந்த காலத்தில், அந்த மக்களை மேன்மையடையச் செய்தார்[b]. உயர்த்திய கரத்தால்[c] அவர்களை அங்கிருந்து வெளியே நடத்திக்கொண்டு வந்தார்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் மூதாதையரை.” கிரேக்கத்தில், “நம் தந்தையரை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த மக்களை உயர்த்தினார்” அல்லது “அந்த மக்களைப் பெருகச் செய்தார்.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “உயர்ந்த கரத்தால்.” இது கடவுள் தமது வல்லமையால் விடுவித்ததைக் குறிக்கும் யாத்திராகமச் சொல்லாட்சி.
    reason: cultural_note
  - marker: d
    text: அல்லது, “அவர்களை அங்கிருந்து வெளியே கொண்டுவந்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: இஸ்ரவேல் என்னும் இந்த மக்களின் கடவுள்
  rationale: Ἰσραήλ என்பதை ‘இந்த மக்கள்’ என்பதற்கு விளக்கமாக வரும் இயற்பெயராகப் பாதுகாக்கிறது; தமிழில் இயல்பான உடைமைத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: ἐξελέξατο
  choice: தேர்ந்தெடுத்தார்
  rationale: இறந்தகாலத் தேர்வுச் செயலைத் தெளிவாகக் கூறுகிறது; கிரேக்க இடை வினையின் நுணுக்கத்தைத் தேவையின்றி விரித்துரைக்கவில்லை.
- source_word: τοὺς πατέρας ἡμῶν
  choice: நம் தந்தையரை
  rationale: πατέρας என்பதன் ஆண்பால் குடும்பச் சொல்லை நேரடியாகப் பாதுகாக்கிறது; சூழலில் முற்பிதாக்கள் அல்லது மூதாதையர் என்ற விரிந்த பொருளும் சாத்தியம்.
- source_word: ὕψωσεν
  choice: மேன்மையடையச் செய்தார்
  rationale: ὑψόω குறிக்கும் உயர்த்துதல், பெருகச் செய்தல், சிறப்புறச் செய்தல் ஆகிய சாத்தியங்களை ஓரளவு திறந்தவையாக வைத்தபடி இயல்பான தமிழில் விளைவைத் தெரிவிக்கிறது.
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: அவர்கள் எகிப்து நாட்டில் அந்நியராகத் தங்கியிருந்த காலத்தில்
  rationale: παροικία என்பதில் உள்ள அந்நிய நாட்டில் குடியிருக்கும் நிலையை வெளிப்படையாகக் காட்டுகிறது; γῇ என்பதற்காக ‘நாடு’ என்பதும் தக்கவைக்கப்படுகிறது.
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: உயர்த்திய கரத்தால்
  rationale: ‘உயர்ந்த/உயர்த்தப்பட்ட கரம்’ என்ற யாத்திராகம உருவகத்தைப் பாதுகாத்து, அதை வெறுமனே ‘வல்லமையால்’ என்று விளக்கி உருவகத்தை அகற்றவில்லை.
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: அவர்களை அங்கிருந்து வெளியே நடத்திக்கொண்டு வந்தார்
  rationale: ἐξάγω என்பதன் வெளியே வழிநடத்தும் இயக்கத்தையும், αὐτῆς எகிப்தைக் குறிப்பதையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் முன்னோர்களைக் குறிக்கும் πατέρας
  choice: நம் தந்தையரை
  alternative: நம் மூதாதையரை
  rationale: மூலத்தில் உள்ள ஆண்பால் உறவுச்சொல்லை முதன்மை உரையில் பாதுகாக்கிறது; அதன் வம்சவரலாற்றுப் பொருளை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: எகிப்தில் மக்களுக்கு நிகழ்ந்ததைச் சொல்லும் ὕψωσεν
  choice: மேன்மையடையச் செய்தார்
  alternative: உயர்த்தினார் / பெருகச் செய்தார்
  rationale: இந்த வினை சமூக உயர்வையோ எண்ணிக்கைப் பெருக்கத்தையோ குறிக்கக்கூடும். முதன்மைத் தேர்வு ஒரே விளக்கத்துக்குள் பொருளைச் சுருக்காமல், கடவுள் மக்களை உயர்ந்த நிலைக்குக் கொண்டுவந்தார் என்ற விரிந்த கருத்தைத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்நியராகத் தங்கியிருந்த’ என்பது ‘பரோய்கியா’வின் சமூக நிலையைத் தெளிவாக்குகிறது; ‘உயர்த்திய கரம்’ என்ற வேதாகம உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
