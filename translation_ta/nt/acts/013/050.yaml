source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: ta
  text: ஆனால் யூதர்கள், இறைவனை வழிபட்டுவந்த உயர்ந்த சமூக அந்தஸ்துடைய பெண்களையும்[a] நகரத்தின் முதன்மையான ஆண்களையும் தூண்டிவிட்டு, பவுலுக்கும் பர்னபாவுக்கும் எதிராகத் துன்புறுத்தலைக் கிளப்பி, அவர்களைத் தங்கள் பகுதியிலிருந்து[b] துரத்திவிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைவனுக்குப் பயந்து நடந்த பெண்கள்.” இச்சொற்றொடர் இஸ்ரவேலின் இறைவனை வழிபட்ட, ஒருவேளை ஜெபக்கூடத்துடன் தொடர்புடைய புறவினப் பெண்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்கள் பிரதேசத்திலிருந்து” அல்லது “தங்கள் எல்லைகளுக்கு வெளியே.” கிரேக்கச் சொல் எல்லைகளையோ அவற்றுக்குள் உள்ள பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρώτρυναν
  choice: தூண்டிவிட்டு
  rationale: பகைமையான நடவடிக்கைக்கு மற்றவர்களைத் தீவிரமாகத் தூண்டும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: σεβομένας γυναῖκας
  choice: இறைவனை வழிபட்டுவந்த பெண்கள்
  rationale: இஸ்ரவேலின் இறைவனை பயபக்தியுடன் வழிபட்ட பெண்களைக் குறிக்கக்கூடிய தொடரின் சமயப் பொருளைப் பாதுகாக்கிறது; அவர்கள் புறவினச் சேர்ந்தவர்கள் என்ற சாத்தியத்தை முதன்மை உரையில் உறுதிப்படுத்தவில்லை.
- source_word: εὐσχήμονας
  choice: உயர்நிலையிலிருந்த
  rationale: சமுதாய அந்தஸ்தையும் பொது மதிப்பையும் இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: நகரத்தின் முதன்மையான ஆண்கள்
  rationale: நகரின் குடிமை வாழ்வில் முதன்மை அந்தஸ்துடையவர்களைக் குறிக்கிறது; மூலத்தின் ஆண்பால் குறிப்பையும் காக்கிறது.
- source_word: ἐπήγειραν διωγμὸν
  choice: துன்புறுத்தலைக் கிளப்பி
  rationale: துன்புறுத்தல் எழும்பும்படி செய்த காரணவினைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: பவுலுக்கும் பர்னபாவுக்கும் எதிராக
  rationale: துன்புறுத்தலின் பகைமையான இலக்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐξέβαλον
  choice: துரத்திவிட்டார்கள்
  rationale: வலுக்கட்டாயமாக வெளியேற்றிய செயலை நவீன தமிழில் வலிமையுடன் வெளிப்படுத்துகிறது.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: தங்கள் பகுதியிலிருந்து
  rationale: ὅρια என்பது எல்லைகளையோ அவற்றுக்குள் உள்ள பிரதேசத்தையோ குறிக்கலாம்; இங்கு உள்ளூர் ஆட்சிப் பகுதியிலிருந்து வெளியேற்றப்பட்டதைக் கூறுகிறது.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: ஆனால் யூதர்கள்
  rationale: முந்தைய வசனத்தின் நேர்மறையான வரவேற்புக்கு மாறான நிகழ்வை δέ குறிக்கும் விதத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: σεβομένας என்பதன் சமய அடையாளம்
  choice: இறைவனை வழிபட்டுவந்த பெண்கள்
  alternative: இறைவனுக்குப் பயந்து நடந்த பெண்கள்
  rationale: அவர்கள் இஸ்ரவேலின் இறைவனை வழிபட்டவர்கள் என்பதைத் தெரிவிக்கிறது; அதேவேளை அவர்களை ஒரு திட்டவட்டமான தொழில்நுட்பப் பிரிவாக முதன்மை உரையில் அடையாளப்படுத்தாமல் மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- issue: சமூக அந்தஸ்துடைய நகரத் தலைவர்களின் ஆண்பால் குறிப்பு
  choice: நகரத்தின் முதன்மையான ஆண்கள்
  alternative: நகரத் தலைவர்கள்
  rationale: τοὺς πρώτους என்ற ஆண்பால் பன்மை வடிவத்தைப் பாதுகாத்து, அவர்களின் குடிமை முதன்மையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- issue: ὅρια என்பதன் இடவியல் பரப்பு
  choice: தங்கள் பகுதியிலிருந்து
  alternative: தங்கள் எல்லைகளுக்கு வெளியே
  rationale: சொல் எல்லையையும் எல்லைக்குள் அமைந்த பிரதேசத்தையும் குறிக்க முடியும்; சூழலில் வெளியேற்றப்பட்ட ஆட்சிப் பகுதி இயல்பான பொருளாக இருப்பினும் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான பகைமை நடவடிக்கைகள் இயல்பாக ஓட வினையெச்சங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் சமூக, பாலின மற்றும் இடவியல் குறிப்புகள் தேவையின்றி பொதுமைப்படுத்தப்படவில்லை.
