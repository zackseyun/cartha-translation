base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: ta
  text: ஏறத்தாழ நானூற்று ஐம்பது ஆண்டுகள்[a]. இவற்றுக்குப் பிறகு, இறைவாக்கினரான சாமுவேல்வரை அவர் நியாயாதிபதிகளை அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சில மொழிபெயர்ப்புகளில் காலக்குறிப்பு வேறுவிதமாக இணைக்கப்படுகிறது: “இறைவாக்கினரான சாமுவேல்வரை ஏறத்தாழ நானூற்று ஐம்பது ஆண்டுகள் அவர் நியாயாதிபதிகளை அளித்தார்.” இங்கே கிரேக்கச் சொற்றொடரின் தொடர்பும் நிறுத்தக்குறியீடும் விவாதத்திற்குரியவை.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: ஏறத்தாழ
  rationale: எண்ணிக்கையைத் துல்லியமானதாக அல்லாமல் தோராயமானதாகக் காட்டும் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: நானூற்று ஐம்பது ஆண்டுகள்
  rationale: கால அளவை முழுமையாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: καὶ μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் பன்மைச் சுட்டைத் தக்கவைக்கிறது; வாக்கியத் தொடக்கத்தில் உள்ள καί தமிழில் தேவையற்றதாக இருப்பதால் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: ἔδωκεν
  choice: அவர் ... கொடுத்தார்
  rationale: δίδωμι என்பதன் நேரடிப் பொருளையும், கடவுள் நியாயாதிபதிகளை வழங்கினார் என்ற வேதாகம வழக்கையும் தக்கவைக்கிறது.
- source_word: κριτὰς
  choice: நியாயாதிபதிகளை
  rationale: இஸ்ரவேலின் அரசாட்சிக்கு முந்தைய காலத் தலைவர்களைக் குறிக்கும் நிலைபெற்ற வேதாகமச் சொல்லாகும்.
- source_word: ἕως
  choice: வரை
  rationale: நியாயாதிபதிகளின் காலத்திற்கான முடிவெல்லையை நேரடியாகக் குறிக்கிறது.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: இறைவாக்கினரான சாமுவேல்
  rationale: சாமுவேலை அவரது பணியால் அடையாளப்படுத்தும் இணைப்பை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: “ஏறத்தாழ நானூற்று ஐம்பது ஆண்டுகள்” என்ற காலக்குறிப்பு எதனுடன் இணைகிறது என்பது
  choice: கொடுக்கப்பட்ட SBLGNT அமைப்பைப் பின்பற்றி, கால அளவைத் தனி வாக்கியமாக வைத்து, அதன்பின் நியாயாதிபதிகள் வழங்கப்பட்டதாக மொழிபெயர்த்தல்
  alternative: “இறைவாக்கினரான சாமுவேல்வரை ஏறத்தாழ நானூற்று ஐம்பது ஆண்டுகளுக்கு அவர் நியாயாதிபதிகளைக் கொடுத்தார்” என்று காலக்குறிப்பை நியாயாதிபதிகளின் காலத்துடன் இணைத்தல்
  rationale: கிரேக்கச் சொற்றொடரின் தொடர்பும் நிறுத்தக்குறியீடும் விவாதத்திற்குரியவை. தரப்பட்ட மூல உரையின் அமைப்பை முதன்மை உரையில் பின்பற்றி, வேறு சாத்தியமான தொடர்பை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. “நியாயாதிபதிகள்” என்ற வரலாற்று-வேதாகமப் பதவி தக்கவைக்கப்பட்டுள்ளது; “இறைவாக்கினர்” என்பது προφήτης என்பதற்கான தெளிவான, சமயப் பிரிவுசார்பற்ற தேர்வு.
