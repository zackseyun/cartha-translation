id: ACT.13.6
reference: Acts 13:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: ta
  text: அவர்கள் தீவு முழுவதையும் கடந்து பாப்போஸ் வரை சென்ற பின், பர்யேசு[a] என்ற பெயருடைய ஒரு மனிதனைக் கண்டார்கள். அவன் ஒரு மந்திரவாதியும் பொய்த் தீர்க்கதரிசியும் யூதனுமாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பர்யேசு” என்ற பெயர் செமித்திய மொழியில் “இயேசுவின் மகன்” அல்லது “யோசுவாவின் மகன்” என்று பொருள்பட்டிருக்கலாம்.
    reason: தனிப்பெயரின் சாத்தியமான செமித்திய அமைப்பையும் பொருளையும் விளக்குகிறது; அந்தப் பொருளை முதன்மை உரைக்குள் இறக்குமதி செய்யாமல் காக்கிறது.
lexical_decisions:
- source_word: διελθόντες δὲ ὅλην τὴν νῆσον ἄχρι Πάφου
  choice: அவர்கள் தீவு முழுவதையும் கடந்து பாப்போவரை சென்றபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையான διελθόντες, முதன்மை வினையான εὗρον-க்கு முந்திய செயலைக் குறிக்கிறது. தமிழில் ‘சென்றபோது’ இயல்பாக அந்த வரிசையைத் தருகிறது; ‘தீவு முழுவதையும் கடந்து’ என்பது பயணத்தின் பரப்பையும் ἄχρι குறிக்கும் எல்லையான பாப்போவையும் காக்கிறது.
- source_word: εὗρον ἄνδρα τινὰ
  choice: ஒரு மனிதனைக் கண்டார்கள்
  rationale: εὗρον என்பதன் எளிய கண்டடைதல் பொருளை ‘கண்டார்கள்’ தருகிறது. τινά-வின் குறிப்பிடப்படாத தன்மை தமிழின் ‘ஒரு’ என்பதில் இயல்பாக வெளிப்படுகிறது; ‘ஒரு குறிப்பிட்ட மனிதன்’ எனச் சொல்வது தேவையற்ற வலியுறுத்தலை உண்டாக்கும்.
- source_word: μάγον
  choice: மந்திரவாதி
  rationale: இச்சூழலில் μάγος மறைமாந்திரிகச் செயல்களில் ஈடுபடுபவனைக் குறிக்கிறது. ‘மந்திரவாதி’ பொதுவாசகர்களுக்குப் புரியும் சொல்; கிரேக்கச் சொல்லை அப்படியே ஒலிபெயர்ப்பதைவிடத் தெளிவானது, ‘சூனியக்காரன்’ என்பதைக் காட்டிலும் சற்றுக் குறைவாக விளக்கம்சேர்ப்பது.
- source_word: ψευδοπροφήτην
  choice: பொய்த்தீர்க்கதரிசி
  rationale: மதச்சார்ந்த தீர்க்கதரிசி உரிமைகோரலும் அதன் பொய்மையும் இரண்டையும் நேரடியாகக் காக்கும் வழக்கமான தமிழ் இணைச்சொல்.
- source_word: Ἰουδαῖον
  choice: யூதன்
  rationale: இங்கு Ἰουδαῖον அந்த மனிதனின் யூத அடையாளத்தைக் குறிப்பிடுகிறது; குறிப்பாக யூதேயா பிரதேசத்தைச் சேர்ந்தவன் என்ற பொருள் சூழலில் தேவைப்படவில்லை.
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: பர்யேசு என்ற பெயருடைய
  rationale: கிரேக்க மரபிலுள்ள தனிப்பெயரை மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கிறது. ‘என்ற பெயருடைய’ என்பது கிரேக்கச் சொல்லாட்சிக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: Βαριησοῦ என்ற தனிப்பெயரின் வடிவம்
  choice: பர்யேசு
  alternative: இயேசுவின் மகன் / யோசுவாவின் மகன்
  rationale: இது இங்கு ஒரு தனிப்பெயராகச் செயல்படுவதால் அதன் சாத்தியமான செமித்திய சொற்பொருளை முதன்மை உரையில் மொழிபெயர்ப்பது அளவுக்கு மீறிய விளக்கமாகிவிடும். ஒலிபெயர்ப்பு பெயரின் உரைச் செயல்பாட்டைக் காக்கிறது; பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: மாகோஸ் என்பதன் பொருள்
  choice: மந்திரவாதி
  alternative: சூனியக்காரன்
  rationale: எதிர்மறைச் சூழல் இருந்தாலும், மூலச்சொல் குறிப்பிடும் செயலை அதைவிடக் கடுமையான ஒழுக்கத் தீர்ப்பாக மாற்றாமல் ‘மந்திரவாதி’ என வழங்கப்படுகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பட்டியல்போன்ற கிரேக்க இணைப்புகளைத் தமிழில் இயல்பான பயனிலை அமைப்பாக மாற்றியபோதும், ‘மந்திரவாதி’, ‘பொய்த்தீர்க்கதரிசி’, ‘யூதன்’ என்ற மூன்று அடையாளங்களும் முழுமையாகக் காக்கப்பட்டுள்ளன. பாப்போ என்பது Πάφος என்பதற்கான தமிழ் ஒலிபெயர்ப்பு.
