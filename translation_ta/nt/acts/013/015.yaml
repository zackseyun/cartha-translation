id: ACT.13.15
reference: Acts 13:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: ta
  text: 'திருச்சட்டமும் இறைவாக்கினர் நூல்களும் வாசிக்கப்பட்ட பின்பு, யூத வழிபாட்டுக்கூடத் தலைவர்கள் அவர்களிடம் சொல்லியனுப்பினார்கள்: “சகோதரர்களே,[a] மக்களுக்கு ஊக்கமளிக்கும் செய்தி[b] உங்களில் யாரிடமாவது இருந்தால், பேசுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஆண்களே, சகோதரர்களே”; இது மரியாதையும் உறவுணர்வும் கொண்ட அழைப்பு.'
    reason: lexical_alternative
  - marker: b
    text: “அறிவுறுத்தும் செய்தி” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஊக்கப்படுத்துதல், அறிவுறுத்துதல் ஆகிய இரு கருத்துகளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: வாசிக்கப்பட்ட
  rationale: யூத வழிபாட்டுக்கூடத்தில் வேதப்பகுதிகள் சபையார் கேட்க வாசிக்கப்பட்ட நிகழ்வைக் குறிக்கிறது; சூழலிலேயே பொதுவாசிப்பு தெளிவாக இருப்பதால் கூடுதல் சொல்லைச் சேர்க்கவில்லை.
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: திருச்சட்டமும் இறைவாக்கினர் நூல்களும்
  rationale: யூத வேதத்தின் அங்கீகரிக்கப்பட்ட இரு பகுதிகளை இது குறிக்கிறது. ‘நூல்கள்’ என்பது இங்கு நபர்களை அல்ல, அவர்களோடு தொடர்புடைய வேதத்தொகுப்பை வாசித்தார்கள் என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: ἀπέστειλαν ... πρὸς αὐτοὺς λέγοντες
  choice: அவர்களிடம் சொல்லியனுப்பினார்கள்
  rationale: வெறுமனே ஒருவரை அனுப்பியதைக் காட்டிலும், அவர்களுக்கு ஒரு செய்தியை அனுப்பிய கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ἀρχισυνάγωγοι
  choice: யூத வழிபாட்டுக்கூடத் தலைவர்கள்
  rationale: வழிபாட்டுக் கூட்டத்தையும் அதன் ஒழுங்கையும் மேற்பார்வையிட்ட பல தலைவர்களைக் குறிக்கிறது; குடிமை ஆட்சியாளர்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: Ἄνδρες ἀδελφοί
  choice: சகோதரர்களே
  rationale: மரியாதையும் உறவுணர்வும் கொண்ட ஆண்பால் அழைப்பை இயல்பான தமிழில் தருகிறது; மூலத்தின் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: λόγος παρακλήσεως
  choice: ஊக்கமளிக்கும் செய்தி
  rationale: παράκλησις என்பதன் ஊக்கப்படுத்துதல், அறிவுறுத்துதல் ஆகிய பொருள் பரப்பில் முதன்மையான வாசிப்பைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν
  choice: உங்களில் யாரிடமாவது இருந்தால்
  rationale: ‘உங்களிடையே யாரிடமாவது இருந்தால்’ என்ற கிரேக்கக் கட்டமைப்பை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: πρὸς τὸν λαόν
  choice: மக்களுக்கு
  rationale: அந்தச் செய்தி யாரை நோக்கிச் சொல்லப்பட வேண்டும் என்பதைக் குறிக்கிறது.
- source_word: λέγετε
  choice: பேசுங்கள்
  rationale: கூடியிருந்த மக்களிடம் உரையாற்றும்படி விடுக்கப்பட்ட சுருக்கமான அழைப்பை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: யூத வழிபாட்டுக்கூடத்தில் பாலினம் குறிக்கப்பட்ட அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: Ἄνδρες ἀδελφοί என்பது வெளிப்படையாக ஆண்பால் வடிவம்; பேச அழைக்கப்பட்ட பவுலையும் அவருடைய ஆண் பயணத் தோழர்களையும் நேரடியாக நோக்குகிறது. ஆகவே உள்ளடக்கிய பொதுப்பாலாக விரிவாக்கப்படவில்லை.
- issue: παράκλησις என்பதன் இரட்டைப் பொருள்
  choice: ஊக்கமளிக்கும் செய்தி
  alternative: அறிவுறுத்தும் செய்தி
  rationale: இச்சொல் ஆறுதலூட்டி ஊக்கப்படுத்துவதையும் வலியுறுத்தி அறிவுறுத்துவதையும் குறிக்கக்கூடும். முதன்மை உரையில் ஒன்றைத் தேர்ந்தெடுத்தாலும் மற்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசிப்புக்கு ஏற்ற தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘யூத வழிபாட்டுக்கூடம்’ என்பது ‘சினகோகு’ என்ற கடன்சொல்லைவிட சாதாரண வாசகருக்கு உடனடியாகப் புரியும். மூலத்தில் வெளிப்படையான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் வசனத்தின் தொடக்கத்தில் அத்தகைய சொல் சேர்க்கப்படவில்லை.
