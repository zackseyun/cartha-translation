source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: ta
  text: அவர்கள் ஆண்டவருக்குப் பணி செய்தும் உபவாசித்தும் இருந்தபோது, தூய ஆவியானவர், “பர்னபாவையும் சவுலையும் நான் அவர்களை அழைத்திருக்கும் பணிக்காக எனக்கென்று பிரித்துவையுங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειτουργούντων
  choice: பணிசெய்து
  rationale: இச்சொல் ஆண்டவரை நோக்கிய சேவையைக் குறிக்கிறது; வழிபாட்டு அல்லது திருப்பணி சார்ந்த நிழற்பொருளும் இருக்கலாம். ‘பணிசெய்து’ என்பது அதை முற்றிலும் சடங்குசார் வழிபாடாகக் குறுக்காமல், சேவை மற்றும் வழிபாடு ஆகிய இரு பரிமாணங்களுக்கும் இடமளிக்கிறது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவருக்கு
  rationale: வேற்றுமை உருபு அந்தப் பணி யாரை நோக்கிச் செய்யப்பட்டது என்பதைத் தெரிவிக்கிறது. ‘ஆண்டவருக்கு’ என்பது நேரடியும் இயல்பானதும் ஆகும்.
- source_word: νηστευόντων
  choice: உபவாசித்துக்கொண்டிருந்தபோது
  rationale: தொடர்ந்து நடைபெற்ற செயலைப் பங்கேற்புவினை காட்டுவதால், தமிழில் நிகழ்நிலையையும் மற்ற செயல் அதே நேரத்தில் நடந்ததையும் இவ்வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: தூய ஆவியானவர்
  rationale: கிரேக்கத்தில் ஆவியானவர் பேசும் எழுவாயாகக் காட்டப்படுகிறார். நவீனத் தமிழில் மரியாதையுடனும் இயல்பாகவும் தனிப்பட்ட செயற்பாட்டை வெளிப்படுத்தும் வடிவம் இது.
- source_word: Ἀφορίσατε
  choice: பிரித்துவையுங்கள்
  rationale: ஒரு குறிப்பிட்ட நோக்கத்திற்காகத் தனியே ஒதுக்குவதே வினையின் மையப்பொருள். இது தொழில்நுட்பமான திருநிலைப்படுத்தல் அல்லது பதவி நியமனத்தைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: δή
  choice: இப்போது
  rationale: கட்டளையின் உடனடித்தன்மையையும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μοι
  choice: எனக்கென்று
  rationale: இந்தப் பிரித்துவைத்தல் ஆவியானவருக்குரிய நோக்கத்திற்காக நடைபெறுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: பர்னபாவையும் சவுலையும்
  rationale: பெயர்கள் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு மரபின்படி தரப்பட்டுள்ளன.
- source_word: εἰς τὸ ἔργον
  choice: பணிக்காக
  rationale: ἔργον என்பது பரந்த பொருளுடையது. ‘பணி’ அதன் திறந்த பொருளைப் பேணுகிறது; குறிப்பிட்ட ஊழியப் பதவி அல்லது நிறுவனச் செயலாக அதைக் குறுக்குவதில்லை.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: நான் அழைத்திருக்கிற பணிக்காக அவர்களை
  rationale: நிறைவுக்கால வினை முன்பே நிகழ்ந்த அழைப்பு இப்போதும் பொருந்துவதை உணர்த்துகிறது. ‘அழைத்திருக்கிற’ அந்த நீடித்த பொருத்தத்தை இயல்பான தமிழில் பேணுகிறது.
theological_decisions:
- issue: λειτουργούντων என்பதைக் கூட்டுத் தெய்வபக்திச் சூழலில் மொழிபெயர்த்தல்
  choice: ஆண்டவருக்குப் பணிசெய்து
  alternative: ஆண்டவரை வழிபட்டு; ஆண்டவருக்குச் சேவைசெய்து
  rationale: இச்சொல்லில் வழிபாடு அல்லது திருப்பணி சார்ந்த நிழற்பொருள் இருக்கலாம்; ஆனால் முறையான வழிபாடு மட்டுமே இங்கு குறிக்கப்படுகிறது என்று வசனம் கட்டாயப்படுத்தவில்லை. முதன்மை மொழிபெயர்ப்பு சேவை மற்றும் வழிபாடு இரண்டிற்கும் இடமளிக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τὸ πνεῦμα τὸ ἅγιον பேசும் எழுவாயாக இருப்பது
  choice: தூய ஆவியானவர் ... என்றார்
  alternative: தூய ஆவி கூறியது
  rationale: கிரேக்க உரை தூய ஆவியானவரை நேரடியாகப் பேசும் எழுவாயாக முன்வைக்கிறது. மொழிபெயர்ப்பு இந்தத் தனிப்பட்ட செயற்பாட்டைத் தளர்த்தாமல் காக்கிறது.
- issue: ἀφορίσατε ... εἰς τὸ ἔργον என்பதன் வலிமை
  choice: பணிக்காக ... எனக்கென்று பிரித்துவையுங்கள்
  alternative: ஊழியத்துக்கு நியமியுங்கள்
  rationale: உரை ஒரு குறிப்பிட்ட பணிக்கான தெய்வீகப் பிரித்துவைத்தலைக் குறிக்கிறது; ஆனால் தொழில்நுட்பமான திருநிலைப்படுத்தலையோ சபைப் பதவியையோ குறிப்பிடவில்லை. ஆகவே பின்னாளைய அமைப்புசார் கருத்துகள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணிசெய்து’ என்பது மிகத் தொழில்நுட்பமான ‘திருப்பணி’ என்பதையும், தனிச்சபை வழக்காகத் தோன்றக்கூடிய ‘ஊழியம்’ என்பதையும் தவிர்க்கிறது. கட்டளையின் உடனடித்தன்மையைப் பேண ‘இப்போது’ சேர்க்கப்பட்டுள்ளது; இது δή என்பதற்கான வெளிப்படையான பிரதிநிதித்துவம்.
