  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἤγειρεν αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/030.yaml
  text: But God raised him from the dead.
translation:
  language: ta
  text: ஆனால் கடவுள் அவரை இறந்தோரிடமிருந்து உயிர்த்தெழச் செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் மனிதர்கள் இயேசுவைக் கொன்று கல்லறையில் வைத்த செயலுக்கும், இங்கு கடவுள் செய்த செயலுக்கும் இடையிலான எதிர்மறை மாறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: θεὸς
  choice: கடவுள்
  rationale: செயலின் எழுவாயாகிய தேவனைக் குறிக்கும் பொதுவான, தெளிவான நவீனத் தமிழ் சொல்.
- source_word: ἤγειρεν
  choice: உயிர்த்தெழச் செய்தார்
  rationale: ἐγείρω இங்கு உயிர்த்தெழுதல் சூழலில் இருப்பதால், கடவுளே அவரை எழுப்பிய செயற்பாட்டாளராக இருப்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: உடனடிச் சூழலில் இயேசுவைக் குறிக்கும் ஆண்பால் ஒருமைப் பிரதிப்பெயரை மரியாதைத் தமிழ் வழக்கில் இயல்பாகக் கொடுக்கிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிடமிருந்து
  rationale: இறந்தவர்களிடமிருந்து எழுப்பப்படுதல் என்ற கிரேக்கச் சொற்றொடரின் பொருளைப் பாதுகாக்கிறது; உயிர்த்தெழுதல் கருத்தை தேவையற்ற விரிவாக்கமின்றி தெரிவிக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் பற்றிய சொல்வடிவு
  choice: ஆனால் கடவுள் அவரை இறந்தோரிடமிருந்து உயிர்த்தெழச் செய்தார்.
  alternative: ஆனால் கடவுள் அவரை இறந்தவர்களிடமிருந்து எழுப்பினார்.
  rationale: தெரிந்தெடுக்கப்பட்ட வடிவு இயேசுவின் உயிர்த்தெழுதலைக் கடவுளின் செயலாக வெளிப்படையாகக் கூறுகிறது. அதேவேளையில், கிரேக்கத்தில் இல்லாத கூடுதல் விளக்கங்களையோ குறிப்பிட்ட சமயப் பிரிவின் கோட்பாட்டையோ சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் வழிபாட்டு வாசிப்பிற்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. குறும் கிரேக்க வாக்கியத்தின் எதிர்மறை மாறுபாடும் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
