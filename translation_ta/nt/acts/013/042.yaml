  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: ta
  text: அவர்கள் வெளியே சென்றுகொண்டிருந்தபோது[a][b], அடுத்த ஓய்வுநாளில் இந்த வார்த்தைகளை அவர்களுக்குச் சொல்லும்படி அவர்கள் வற்புறுத்திக் கேட்டுக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகள் இன்னும் வெளிப்படையாக, “பவுலும் பர்னபாவும் வெளியே சென்றபோது, அடுத்த ஓய்வுநாளில் இந்த வார்த்தைகளை அவர்களுக்குச் சொல்லும்படி மக்கள் வற்புறுத்திக் கேட்டுக்கொண்டார்கள்” என்று வாசிக்கின்றன.
    reason: textual_variant
  - marker: b
    text: அல்லது, “அவர்கள் புறப்பட்டுக்கொண்டிருந்தபோது, வரவிருந்த ஓய்வுநாளில் இந்தக் காரியங்களை அவர்களுக்குச் சொல்லும்படி அவர்கள் கேட்டுக்கொண்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων
  choice: வெளியே சென்றுகொண்டிருந்தபோது
  rationale: நிகழ்காலப் பெயரெச்சத்துடன் அமைந்துள்ள genitive absolute காலச்சூழலைக் குறிக்கிறது. இந்தத் தேர்வு செயல் நடந்துகொண்டிருந்த தன்மையையும் ‘வெளியே செல்’ என்ற நேரடிப் பொருளையும் காக்கிறது; ‘புறப்பட்டபோது’ என்பதும் சாத்தியம்.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படாமல் காலவாக்கியத்துடன் இயல்பாக இணைக்கப்பட்டுள்ளது
  rationale: இங்கு δέ மென்மையான தொடர்புச்சொல். தமிழில் தனியே ‘ஆனால்’ அல்லது ‘பின்பு’ என்று சேர்த்தால் மூலத்தில் இல்லாத வலியுறுத்தல் தோன்றும்.
- source_word: αὐτῶν
  choice: அவர்கள்
  rationale: மூலப்பாடம் சுட்டுப்பெயரை மட்டுமே தருவதால், அது யாரைக் குறிக்கிறது என்பதை முதன்மைப் பனுவலில் வெளிப்படையாகத் தீர்மானிக்காமல் ‘அவர்கள்’ என்று வைக்கப்பட்டுள்ளது.
- source_word: παρεκάλουν
  choice: வற்புறுத்திக் கேட்டுக்கொண்டார்கள்
  rationale: இங்கு παρακαλέω ஆறுதல்படுத்துதல் அல்ல, ஆர்வமான வேண்டுகோளைச் சுட்டுகிறது. இறந்தகால imperfect வடிவத்தின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட வேண்டுகோள் ‘கேட்டுக்கொண்டார்கள்’ என்பதில் வெளிப்படுகிறது; ‘வற்புறுத்தி’ அதன் தீவிரத்தைக் காட்டுகிறது.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: அடுத்த ஓய்வுநாளில்
  rationale: இந்தச் சொற்றொடர் இடைப்பட்டு வரவிருந்த, அதாவது அடுத்த ஓய்வுநாளைக் குறிக்கும் மரபுத்தொடர். நவீன தமிழில் ‘அடுத்த ஓய்வுநாளில்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: λαληθῆναι
  choice: சொல்ல வேண்டும்
  rationale: மூலத்தில் aorist passive infinitive உள்ளது. தமிழில் ‘பேசப்பட வேண்டும்’ என்பது செயற்கையாக ஒலிப்பதால், இயல்பான வேண்டுகோள் அமைப்பில் ‘சொல்ல வேண்டும்’ என வழங்கப்பட்டுள்ளது; பேசுதல் என்ற கருத்து காக்கப்படுகிறது.
- source_word: αὐτοῖς
  choice: தங்களுக்குச்
  rationale: மறைமுகப் பெறுநரைத் தமிழில் இயல்பாகக் குறிக்கிறது. வேண்டுகோள் விடுப்பவர்களுக்கே வார்த்தைகள் சொல்லப்பட வேண்டும் என்ற வாக்கிய உறவை இது தெளிவாக வெளிப்படுத்துகிறது; அவர்களின் வரலாற்று அடையாளம் குறிப்பிடப்படவில்லை.
- source_word: τὰ ῥήματα ταῦτα
  choice: இந்த வார்த்தைகளை
  rationale: ῥήματα என்பது பேசப்பட்ட வார்த்தைகள் அல்லது உரைகளைச் சுட்டுகிறது. ‘இந்தச் செய்தியை’ என்பதைவிட ‘இந்த வார்த்தைகளை’ மூலச்சொல்லுக்கு நெருக்கமானது.
theological_decisions:
- issue: இவ்வசனத்திலுள்ள சுட்டுப்பெயர்கள் யாரைக் குறிக்கின்றன என்பது
  choice: முதன்மைப் பனுவலில் ‘அவர்கள்’ என்று வைத்து, வெளியே சென்றவர்களின் அடையாளத்தைத் தீர்மானிக்காமல் மூலப்பாடத்தின் தெளிவின்மையைப் பாதுகாத்தல்
  alternative: ‘பவுலும் பர்னபாவும் வெளியே சென்றபோது, மக்கள் கேட்டுக்கொண்டார்கள்’ என்று நபர்களை வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: SBLGNT முதன்மைப் பாடம் αὐτῶν என்ற சுட்டுப்பெயரையே கொண்டுள்ளது; இதனுடன் தொடர்புடைய பாடவேறுபாடும் விளக்கச் சிக்கலும் உள்ளன. ஆகவே ஒரு குறிப்பிட்ட வரலாற்று அடையாளத்தை முதன்மைப் பனுவலில் சேர்க்காமல், விரிவான வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வழிபாட்டு வாசிப்பிற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஓய்வுநாள்’ என்ற பரவலாகப் புரியக்கூடிய வேதாகமச் சொல் காக்கப்பட்டுள்ளது. தமிழில் இயல்பற்ற கடுமையான செயப்பாட்டு அமைப்பைத் தவிர்த்து optimal-equivalence முறையில் வாக்கியம் அமைக்கப்பட்டுள்ளது; சுட்டுப்பெயரின் உண்மையான தெளிவின்மை மட்டும் தீர்க்கப்படாமல் வைக்கப்பட்டுள்ளது.
