  text: ἀνθίστατο δὲ αὐτοῖς Ἐλύμας ὁ μάγος, οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ, ζητῶν διαστρέψαι τὸν ἀνθύπατον ἀπὸ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: ta
  text: ஆனால் மந்திரவாதியான எலிமாஸ் அவர்களை எதிர்த்து வந்தான்—அவனுடைய பெயர் இவ்வாறே மொழிபெயர்க்கப்படுகிறது[b]—அவன் புரோகொன்சுலை விசுவாசத்திலிருந்து விலக்க முயன்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசிப்பதிலிருந்து.” இந்தக் கிரேக்கச் சொற்றொடர், குறிப்பாகக் கிறிஸ்தவ விசுவாசத்திலிருந்து அவரை விலக்குவதையோ, பொதுவாக விசுவாசிப்பதிலிருந்து அவரை விலக்குவதையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “எலிமாஸ்” என்பது மொழிபெயர்க்கப்பட்ட அல்லது பொருள் விளக்கப்பட்ட பெயராக இங்கு கூறப்படுகிறது; அந்தப் பெயரின் துல்லியமான சொற்பிறப்பு உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: எதிர்த்துக்கொண்டிருந்தான்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த எதிர்ப்பைக் காட்டுகிறது; இந்தத் தமிழ் வடிவம் அதைப் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய சூழலில் காணப்படும் சாதகமான வரவேற்புக்கு மாறான எதிர்ப்பைத் தெளிவாகக் குறிக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களை
  rationale: முன்னரே குறிப்பிடப்பட்ட தூதுப்பணியாளர்களைக் குறிக்கும் பன்மைப் பெயர்ப்பதிலியை, தேவையின்றி பெயர்களைச் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: Ἐλύμας ὁ μάγος
  choice: மந்திரவாதியான எலிமா
  rationale: பெயரை ஒலிபெயர்த்து, μάγος என்பதன் சூழலுக்கேற்ற பொதுவான மற்றும் புரியக்கூடிய பொருளைத் தருகிறது; தேவையற்ற அளவு இழிவான நிழற்பொருளைச் சேர்க்கவில்லை.
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: அவனுடைய பெயர் இவ்வாறே மொழிபெயர்க்கப்படுகிறது
  rationale: பெயரின் மொழிபெயர்ப்பு அல்லது விளக்கத்தைக் குறிக்கும் கிரேக்கச் சொல்லின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: ζητῶν
  choice: முயன்றான்
  rationale: எதிர்ப்புடன் இணைந்த நோக்கத்தையும் முயற்சியையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: διαστρέψαι
  choice: விலக்க
  rationale: ஒரு நபரை ஒன்றிலிருந்து திருப்பிவிடுதல் என்ற இச்சூழலின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὸν ἀνθύπατον
  choice: ஆளுநரை
  rationale: தமிழ் வாசகர்களுக்கு இயல்பாகவும் புரியும்படியாகவும் ரோம நிர்வாகப் பதவியைத் தருகிறது; இதன் குறிப்பிட்ட வரலாற்றுப் பதவி தன்மையை விளக்கக்குறிப்பின்றியும் சூழல் தாங்குகிறது.
- source_word: ἀπὸ τῆς πίστεως
  choice: விசுவாசத்திலிருந்து
  rationale: πίστις என்பதற்கு நிலையான வேதாகமத் தமிழான ‘விசுவாசம்’ பயன்படுத்தப்படுகிறது; கிரேக்கத்தில் உள்ள definite article தமிழில் கட்டாயமாகத் தனிச் சொல்லால் வெளிப்படாததால், குறிப்பிட்ட கிறிஸ்தவ விசுவாசம் அல்லது விசுவாசிக்கும் பதில் என்ற இரு நுணுக்கங்களும் நிலைக்கின்றன.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசத்திலிருந்து
  alternative: கிறிஸ்தவ விசுவாசத்திலிருந்து / விசுவாசிப்பதிலிருந்து
  rationale: சூழலும் கிரேக்க உருபும் குறிப்பிட்ட கிறிஸ்தவ விசுவாசத்தைச் சுட்டக்கூடும்; அதேவேளையில் விசுவாசிக்கும் பதிலையும் இச்சொற்றொடர் குறிக்கலாம். முதன்மை உரை எந்த ஓர் பொருளையும் மிகையாக உறுதிப்படுத்தாமல், மாற்று நுணுக்கத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. விளக்க இடைச்சொற்றொடர் கோடுகளுக்குள் வைக்கப்பட்டு, கிரேக்க வாக்கியத்தின் ஓட்டமும் ஐயப்பாடும் பாதுகாக்கப்பட்டுள்ளன. ‘மந்திரவாதி’ அணுகத்தக்க சொல்; ‘விசுவாசம்’ தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்றிருந்தாலும் இங்கு இயல்பானதாக உள்ளது.
