id: ACT.13.1
reference: Acts 13:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: ta
  text: 'அந்தியோகியாவில் உள்ள திருச்சபையில் தீர்க்கதரிசிகளும் போதகர்களும் இருந்தார்கள்: பர்னபா, நீகர்[a] என்று அழைக்கப்பட்ட சிமியோன், சிரேனேவைச் சேர்ந்த லூக்கியு[b], குறுநில ஆட்சியாளரான ஏரோதோடு சேர்ந்து வளர்ந்த மனாயீன்[c], சவுல் ஆகியோர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீகர்” என்பது “கருப்பு” என்று பொருள்படும் இலத்தீன் பெயர். இங்கே அது மொழிபெயர்க்கப்படாமல் பெயராகவே தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, லூக்கியு வட ஆப்பிரிக்காவிலிருந்த சிரேனே நகரைச் சேர்ந்தவர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “குறுநில ஆட்சியாளரான ஏரோதின் வளர்ப்புச் சகோதரன்” அல்லது “அவருடன் சேர்ந்து வளர்க்கப்பட்டவர்.” கிரேக்கச் சொல் நெருங்கிய தொடர்பையோ பகிர்ந்த வளர்ப்பையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: இருந்தார்கள்
  rationale: Ἦσαν என்பதன் இருப்பைக் குறிக்கும் பொருளை இயல்பான தமிழில் தருகிறது. δέ மென்மையான தொடரிணைப்பு என்பதால் தனியாக வலுவான எதிர்மறைச் சொல்லால் மொழிபெயர்க்கப்படவில்லை.
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: அந்தியோகியாவில் இருந்த திருச்சபையில்
  rationale: அந்த இடத்தில் இருந்த உள்ளூர் கிறிஸ்தவச் சபையைக் குறிக்கும் சொற்றொடரை சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: தீர்க்கதரிசிகளும் போதகர்களும்
  rationale: பிந்தைய காலத் திருச்சபை அலுவல் அமைப்புகளை உட்புகுத்தாமல், உரையில் கூறப்படும் பணிப்பங்குகளை நேரடியாகக் குறிக்கிறது.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: நீகர் என்று அழைக்கப்பட்ட சிமியோன்
  rationale: Συμεών என்பதை சிமியோன் என ஒலிபெயர்த்து, Νίγερ என்பதை மொழிபெயர்க்காமல் பெயராகத் தக்கவைக்கிறது.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: சிரேனே ஊரானாகிய லூக்கியு
  rationale: Κυρηναῖος என்பவர் சிரேனே நகரைச் சேர்ந்தவர் என்பதைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: குறுநில மன்னன் ஏரோது
  rationale: τετράρχης என்ற ஆட்சிப் பட்டத்தை பொதுவாசகர் புரிந்துகொள்ளும் வகையில் தருகிறது; உரையில் இல்லாத ‘அந்திப்பா’ என்ற பெயர் சேர்க்கப்படவில்லை.
- source_word: σύντροφος
  choice: உடன் வளர்க்கப்பட்ட
  rationale: இச்சொல் ஒன்றாக வளர்க்கப்பட்டவர் அல்லது வளர்ப்புச் சகோதரர் எனக் குறிக்கக்கூடும். ‘உடன் வளர்க்கப்பட்ட’ என்பது அதன் முதன்மையான உறவுப்பின்னணியைத் தருவதோடு மிகக் குறிப்பான உறவைத் திணிக்காது.
theological_decisions:
- issue: அந்தியோகிய திருச்சபையில் கூறப்படும் பணிப்பங்குகளின் இயல்பு
  choice: ‘தீர்க்கதரிசிகளும் போதகர்களும்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: பிற்கால நிறுவனத் திருச்சபையின் முறையான பதவிகளாக விளக்குதல்
  rationale: வசனம் இவர்களை இவ்வாறு அடையாளப்படுத்துகிறது; ஆனால் பிற்கால சபை நிர்வாகப் படிநிலையை வரையறுக்கவில்லை.
- issue: மனாயீனுக்கும் ஏரோதுக்கும் இடையிலான σύντροφος உறவு
  choice: ‘உடன் வளர்க்கப்பட்ட’
  alternative: ‘வளர்ப்புச் சகோதரன்’ அல்லது ‘நெருங்கிய தோழன்’
  rationale: கிரேக்கச் சொல் பகிர்ந்த வளர்ப்பை உணர்த்துகிறது; சட்டரீதியான வளர்ப்புச் சகோதர உறவையோ வெறும் நட்பையோ மட்டும் உறுதிப்படுத்துவதில்லை. எனவே மூலத்தின் நிச்சயமின்மை தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நபர் மற்றும் இடப்பெயர்கள் தமிழில் இயல்பான ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; σύντροφος என்பதிலுள்ள உறவின் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
