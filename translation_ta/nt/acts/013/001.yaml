  - severity: medium
    issue: τετράρχης பட்டத்தின் அதிகப்படுத்தல்
    rationale: “மன்னன்” என்பது கிரேக்க τετράρχης-இல் அவசியமில்லாத அரசர் பட்டத்தைச் சேர்க்கிறது. “குறுநில ஆட்சியாளர்” பட்டத்தின் ஆட்சிப் பொருளைத் தக்கவைக்கிறது.
