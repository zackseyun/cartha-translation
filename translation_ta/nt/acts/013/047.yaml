source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: ta
  text: 'ஏனெனில் ஆண்டவர் எங்களுக்கு இவ்வாறு கட்டளையிட்டிருக்கிறார்: “பூமியின் கடைசிவரை[b] நீ மீட்புக்காக இருக்கும்படி, நான் உன்னை தேசங்களுக்கு ஒளியாக[a] நியமித்திருக்கிறேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதரல்லாத மக்களுக்கு ஒளியாக.” கிரேக்கச் சொல் ‘தேசங்கள்’ என்றும், பல சூழல்களில் ‘யூதரல்லாத மக்கள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பூமியின் கடைசி எல்லைகள் வரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: முன்னுள்ள செயலுக்கான அடிப்படையையும் முறையையும் அறிமுகப்படுத்தும் வினையடை; இயல்பான நவீன தமிழில் கிரேக்கத்தின் கருத்தைத் தக்கவைக்கிறது.
- source_word: ἐντέταλται
  choice: கட்டளையிட்டிருக்கிறார்
  rationale: நிறைவேற்றப்பட்டும் தொடர்ந்து செல்லுபடியாகியும் இருக்கும் அதிகாரப்பூர்வக் கட்டளையை perfect வடிவம் உணர்த்துவதால், தமிழ் நிறைவுநிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: மேற்கோள் காட்டப்படும் வேதவாக்கின் தெய்வீகப் பேச்சாளரைக் குறிக்கும் κύριος என்பதன் மரியாதையும் அதிகாரமும் தக்கவைக்கப்படுகிறது.
- source_word: Τέθεικά σε
  choice: நான் உன்னை ... நியமித்திருக்கிறேன்
  rationale: τίθημι இங்கு ஒருவரை ஒரு பணிக்காக நிலைநிறுத்துதல் அல்லது நியமித்தல் என்ற பொருளில் வருகிறது; perfect வடிவத்தின் நிலைத்த விளைவும் தக்கவைக்கப்படுகிறது.
- source_word: εἰς φῶς ἐθνῶν
  choice: தேசங்களுக்கு ஒளியாக
  rationale: εἰς நியமிக்கப்பட்ட பங்கு அல்லது விளைவை உணர்த்துகிறது; ἐθνῶν என்பதன் பரந்த ‘தேசங்கள்’ என்ற பொருள் முதன்மை உரையில் வைக்கப்பட்டு, ‘யூதரல்லாத மக்கள்’ என்ற சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ εἶναί σε
  choice: நீ ... இருக்கும்படி
  rationale: τοῦ உடனான infinitive நோக்கம் அல்லது விளைவை வெளிப்படுத்துகிறது; ‘இருக்கும்படி’ என்பது அதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἰς σωτηρίαν
  choice: மீட்புக்காக
  rationale: கிரேக்கத்தின் சுருக்கமான இலக்கு அல்லது விளைவுப் பொருளைத் தக்கவைத்து, அந்த நபரே மீட்பா அல்லது மீட்பின் கருவியா என்பதைத் தீர்மானித்து விரிவுபடுத்தாமல் விடுகிறது.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: பூமியின் கடைசிவரை
  rationale: கிரேக்கத்தில் உள்ள ஒருமை ‘பூமியின் மிகத் தொலைவான எல்லை’ என்ற கருத்தை நெருக்கமாகக் காட்டுகிறது; இயல்பான பன்மை மாற்று அடிக்குறிப்பில் வழங்கப்படுகிறது.
theological_decisions:
- issue: ஏசாயா மேற்கோளின் ஒருமை ‘உன்னை’ பவுலும் பர்னபாவும் தங்கள் பணிக்குப் பயன்படுத்துவது
  choice: நேரடி மேற்கோளில் ஒருமை ‘உன்னை’ என்பதைக் காத்து, அது அப்போஸ்தலப் பணியுடன் எவ்வாறு தொடர்புபடுகிறது என்பதை விளக்கிச் சேர்க்காமல் விடுதல்
  alternative: மேற்கோளைப் பவுலுக்கும் பர்னபாவுக்கும் நேரடியாகப் பொருத்தி பன்மையில் அல்லது விளக்கவுரையாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை வேதவாக்கை ஒருமையில் நேரடியாக மேற்கோள் காட்டி, ஊழியர் உரையும் அப்போஸ்தலப் பணியும் கொண்ட உறவை மறைமுகமாகவே விடுகிறது; அதே இறையியல் இழுபறி மொழிபெயர்ப்பிலும் பாதுகாக்கப்படுகிறது.
- issue: εἰς σωτηρίαν என்பதில் நபருக்கும் மீட்புக்கும் உள்ள உறவு
  choice: ‘மீட்புக்காக இருக்கும்படி’ என்று சுருக்கமாக வைத்தல்
  alternative: ‘மீட்பைக் கொண்டுவரும்படி’ அல்லது ‘மீட்பின் கருவியாக இருக்கும்படி’ என்று விளக்குதல்
  rationale: மூலவாக்கியம் நோக்கம் அல்லது விளைவைச் சொன்னாலும் உறவைத் துல்லியமாக விரிவுபடுத்தவில்லை; ஆகவே விளக்கத்தை முதன்மை உரையில் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. மேற்கோளின் ஒருமையும், ‘மீட்புக்காக’ என்ற சுருக்கமான இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின் இடப்பட்டுள்ளன.
