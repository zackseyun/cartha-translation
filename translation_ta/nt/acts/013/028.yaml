revisions:
- from: மரண தண்டனை விதிப்பதற்கான எந்த அடிப்படையையும் அவர்கள் காணாதபோதிலும்[a], அவரைக் கொல்லும்படி பிலாத்துவிடம் கேட்டுக்கொண்டார்கள்[b].
  to: மரண தண்டனை விதிப்பதற்கான எந்த அடிப்படையையும் அவர்கள் காணாதபோதிலும்[a], அவரை மரண தண்டனைக்கு உட்படுத்துமாறு பிலாத்துவிடம் கேட்டுக்கொண்டார்கள்[b].
  rationale: The revision replaces the more general «கொல்லும்படி» with «மரண தண்டனைக்கு உட்படுத்துமாறு» to reflect the judicial setting and the contextual force of ἀναιρεθῆναι, while retaining the original’s ambiguity about the precise method. The concessive construction, legal sense of αἰτία θανάτου, and conventional Tamil form of Pilate’s name are retained.
