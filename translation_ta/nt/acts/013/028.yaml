source:
  edition: SBLGNT
  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: ta
  text: மரண தண்டனை விதிப்பதற்கான எந்த அடிப்படையையும் அவர்கள் காணாதபோதிலும்[a], அவரை மரண தண்டனைக்கு உட்படுத்துமாறு பிலாத்துவிடம் கேட்டுக்கொண்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “மரணத்திற்குரிய எந்தக் குற்றச்சாட்டையும்” அல்லது “மரண தண்டனைக்கான எந்தச் சட்ட அடிப்படையையும்.”'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு வகையில்: “அவரைக் கொல்லும்படி” அல்லது “அவரை மரணத்திற்கு ஒப்புக்கொடுக்குமாறு.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: மரண தண்டனை விதிப்பதற்கான எந்த அடிப்படையையும்
  rationale: αἰτία என்பது காரணம், குற்றச்சாட்டு அல்லது சட்ட அடிப்படை எனப் பொருள்படலாம். இங்குள்ள நீதித்துறைச் சூழலில், மரண தண்டனையை நியாயப்படுத்தும் அடிப்படை என்பதே பொருத்தமான இயல்பான தமிழ்.
- source_word: εὑρόντες
  choice: அவர்கள் காணாதபோதிலும்
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது; சூழலில், எந்த அடிப்படையும் காணப்படாத நிலையிலும் அவர்கள் மரணத்தை வேண்டிய முரண்பாடு உள்ளதால், சலுகைப் பொருளைத் தமிழ் வெளிப்படையாகக் காட்டுகிறது.
- source_word: ᾐτήσαντο
  choice: கேட்டுக்கொண்டார்கள்
  rationale: αἰτέω என்பது கேட்பது அல்லது கோருவது. பிலாத்துவிடம் முன்வைக்கப்பட்ட கோரிக்கையை இயல்பான நவீன தமிழில் இது தெரிவிக்கிறது.
- source_word: Πιλᾶτον
  choice: பிலாத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது; வேற்றுமை உருபுடன் ‘பிலாத்துவிடம்’ என வருகிறது.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: அவரைக் கொல்லும்படி
  rationale: ἀναιρέω இச்சூழலில் ஒருவரைக் கொல்வது அல்லது மரணத்திற்கு உட்படுத்துவது என்று பொருள். ‘கொல்லும்படி’ என்பது மூலத்தின் பொதுவான வன்முறைப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; சட்டரீதியான மாற்று அடிக்குறிப்பில் வழங்கப்படுகிறது.
- source_word: καὶ
  choice: —
  rationale: καί தொடர்ச்சியைச் சுட்டுகிறது. தனி வசனமாக வாசிக்கும்போது தமிழில் தொடக்க ‘மேலும்/அப்போது’ அவசியமில்லை; வசனத்தின் ஓட்டம் தொடர்ச்சியாலும் ‘போதிலும்’ அமைப்பாலும் இயல்பாகத் தங்குகிறது.
theological_decisions:
- issue: பங்கேற்புவினைத் தொடரின் சலுகை/முரண்பாட்டுப் பொருளை வெளிப்படையாக்குவது
  choice: எந்த அடிப்படையையும் அவர்கள் காணாதபோதிலும்
  alternative: எந்த அடிப்படையையும் காணாமல் / கண்டறியாத பிறகு
  rationale: εὑρόντες வடிவில் காலச்சார்ந்த அல்லது சூழ்நிலைப் பொருள் இருக்கலாம். ஆனால் தகுந்த காரணம் இல்லாத நிலையிலும் அவர்கள் மரணத்தைக் கோரிய பதற்றத்தைச் சூழல் காட்டுவதால், ‘போதிலும்’ அந்த முரண்பாட்டைப் பாதுகாக்கிறது; புதிய கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் நீதித்துறைச் சொற்களுடன் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள சட்டச் சூழலும், காரணம் காணாதபோதும் மரணத்தைக் கோரிய முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன.
