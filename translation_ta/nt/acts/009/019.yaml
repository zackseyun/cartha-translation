  text: And after taking food[a], he regained his strength. And he was with the disciples in Damascus for some days[c][b],
translation:
  language: ta
  text: அவர் உணவு உண்டபின்[a] மீண்டும் வலிமை பெற்றார்[b]. பின்பு தமஸ்குவில் இருந்த சீடர்களுடன் சில நாட்கள் இருந்தார்[c].
