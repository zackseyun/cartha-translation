lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: உணவு உண்டபின்
  rationale: இறந்தகாலப் பங்கேற்புவினையும் τροφή என்பதும், உணவைப் பெற்றுக்கொண்டு உண்டதைக் குறிக்கின்றன. தமிழில் «உணவு உண்டபின்» என்பது நிகழ்வுகளின் வரிசையை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: ἐνίσχυσεν
  choice: மீண்டும் வலிமை பெற்றார்
  rationale: உண்ணாமையால் பலவீனமடைந்திருந்த சூழலில், இவ்வினைச்சொல் வலிமை திரும்பியதைக் குறிக்கிறது. இது கிரேக்கச் செயப்பாட்டு வடிவத்தின் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: Ἐγένετο δὲ
  choice: பின்பு … தங்கியிருந்தார்
  rationale: இங்கு ἐγένετο δὲ கதைத் தொடர்ச்சிக்கான இடைமாற்றாகச் செயல்படுகிறது. தனியாகச் சொற்சொல்லாக மொழிபெயர்ப்பதைவிட «பின்பு» என்பது தமிழில் ஓட்டத்தை இயல்பாக்குகிறது.
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: தமஸ்குவில் இருந்த சீடர்களுடன்
  rationale: μετά உடனிருப்பையும் உறவையும் குறிக்கிறது; ἐν Δαμασκῷ சீடர்களின் இருப்பிடத்தை அடையாளப்படுத்துகிறது.
- source_word: ἡμέρας τινάς
  choice: சில நாட்கள்
  rationale: கால நீட்சியைக் குறிக்கும் இச்சொற்றொடர், சரியாக எத்தனை நாட்கள் என்று குறிப்பிடாமல் ஒரு குறுகிய காலத்தைக் காட்டுகிறது.
