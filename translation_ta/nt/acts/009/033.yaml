  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதையான நடையிலும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் உறவுப்பெயர் அமைப்பை அப்படியே சுமத்தாமல் இரண்டு வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு பெறப்பட்டது; காலநீடிப்பும் உடல் முடக்க நிலையும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
