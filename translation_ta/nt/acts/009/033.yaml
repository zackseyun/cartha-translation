id: ACT.9.33
reference: Acts 9:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: ta
  text: அங்கே ஐனேயா என்ற ஒரு மனிதரை அவர் கண்டார். அந்த மனிதர் எட்டு ஆண்டுகளாகப் படுக்கையில் கிடந்தார்[a]; அவர் முடங்கியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக மொழிபெயர்த்தால், “ஒரு பாயின் மேல் படுத்திருந்தார்” அல்லது “ஓர் எளிய படுக்கையில் படுத்திருந்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: அங்கே ... அவர் கண்டார்
  rationale: δέ எளிய கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தனி வாக்கியத்தின் இயல்பான ஓட்டத்தால் அது வெளிப்படுவதால் கூடுதல் இணைப்புச்சொல் தேவையில்லை. εὗρεν மற்றும் ἐκεῖ முறையே ‘கண்டார்,’ ‘அங்கே’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டன.
- source_word: ἄνθρωπόν τινα
  choice: ஒரு மனிதரை
  rationale: τις முன்பு அறிமுகமாகாத குறிப்பிட்ட ஒருவரைக் குறிக்கிறது. தமிழில் ‘ஒரு மனிதரை’ என்பது அந்த உரையாடல் செயல்பாட்டை இயல்பாகத் தருகிறது; ‘குறிப்பிட்ட ஒரு மனிதரை’ என்பது தேவையற்ற வலியுறுத்தலாக இருக்கும்.
- source_word: ὀνόματι Αἰνέαν
  choice: ஐனேயா என்ற
  rationale: ὀνόματι உடன் வரும் பெயரைத் தமிழில் இயல்பாக ‘... என்ற’ என வழங்கலாம். Αἰνέας என்ற பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: எட்டு ஆண்டுகளாக
  rationale: இந்தக் கூறு கடந்த எட்டு ஆண்டுகளாக நீடித்த கால அளவைக் குறிக்கிறது; ‘எட்டு ஆண்டுகளாக’ என்பது அதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: படுக்கையில் கிடந்துவந்தார்
  rationale: இந்தச் சொற்றொடர் பாய் அல்லது எளிய படுக்கை போன்ற ஒன்றின்மேல் தொடர்ந்து படுத்திருந்த நிலையைக் கூறுகிறது. ‘படுக்கையில் கிடந்துவந்தார்’ நீடித்த நிலையையும் இயல்பான தமிழிலும் தருகிறது; குறிப்பான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὃς ἦν παραλελυμένος
  choice: அவருடைய உடல் முடங்கியிருந்தது
  rationale: παραλελυμένος நீடித்த உடல் முடக்க நிலையைக் குறிக்கிறது. ‘உடல் முடங்கியிருந்தது’ காரணம் அல்லது மருத்துவ நோயறிதலைச் சேர்க்காமல் அந்த நிலையைத் தெளிவாகக் கூறுகிறது.
