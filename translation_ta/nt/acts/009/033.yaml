    reason: lexical_alternative
  revision_rationale: The revision identifies Aeneas explicitly at the start of the second sentence, preventing confusion with the implied narrative subject. It renders the paralyzed condition directly and idiomatically without adding a medical diagnosis. The footnote preserves both the concrete pallet/mat sense and the action of lying stated in the Greek.
