id: ACT.9.42
reference: Acts 9:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: ta
  text: இது யோப்பா நகர் முழுவதும் தெரியவந்தது; பலர் ஆண்டவர்மேல் நம்பிக்கை வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: தெரியவந்தது
  rationale: எழுவாய் குறிப்பிடப்படாத கிரேக்கச் சொற்றொடரின் நிகழ்வு-விளைவு பொருளை இயல்பான தமிழில் தருகிறது; இதைத் தெரியப்படுத்தியவர் யார் என்று தேவையின்றிக் குறிப்பிடவில்லை.
- source_word: δὲ
  choice: ;
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சி இணைப்பாக உள்ளது. தமிழில் தனிச் சொல்லைச் சேர்ப்பதைவிட அரைப்புள்ளியால் இரு நிகழ்வுகளையும் தொடர்ச்சியாக இணைப்பது இயல்பாக உள்ளது.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: யோப்பா நகர் முழுவதும்
  rationale: κατά உடன் வரும் முழுமையைக் குறிக்கும் ὅλης, செய்தி அந்த நகரெங்கும் பரவியதைக் காட்டுகிறது. ‘நகர் முழுவதும்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: Ἰόππης
  choice: யோப்பா
  rationale: புதிய ஏற்பாட்டில் வழக்கமான இடப்பெயர் ஒலிபெயர்ப்பைப் பின்பற்றுகிறது.
- source_word: ἐπίστευσαν
  choice: நம்பிக்கை வைத்தார்கள்
  rationale: இறந்தகால வினை இங்கு பலர் விசுவாசத்துக்கு வந்த நிகழ்வைக் குறிக்கிறது; ‘நம்பிக்கை வைத்தார்கள்’ என்பது தனிப்பட்ட நம்பிக்கையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπὶ τὸν κύριον
  choice: ஆண்டவர்மேல்
  rationale: ἐπί + செயப்படுபொருள் வேற்றுமை, நம்பிக்கையின் இலக்கையும் சார்ந்திருக்கும் தன்மையையும் காட்டுகிறது. ‘ஆண்டவர்மேல் நம்பிக்கை வைத்தார்கள்’ என்பது இதைத் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் மரியாதை மற்றும் கிறிஸ்துவியல் முக்கியத்துவத்தைப் பாதுகாக்கும் நிலையான தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: πιστεύω + ἐπὶ τὸν κύριον என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்மேல் நம்பிக்கை வைத்தார்கள்
  alternative: ஆண்டவரை விசுவாசித்தார்கள்
  rationale: தொடர் ஆண்டவரை நம்பிக்கையின் இலக்காகக் காட்டுகிறது. தேர்ந்தெடுத்த வாசகம் தனிப்பட்ட நம்பிக்கை/சார்பை வெளிப்படுத்துகிறது; அதேவேளை குறிப்பிட்ட சமய மரபின் தொழில்நுட்பச் சொல்லாக்கத்தைத் திணிக்கவில்லை.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: அப்போஸ்தலர் நடபடிகளில் இயேசுவுக்குரிய இந்தப் பட்டத்தின் மரியாதை மற்றும் இறையியல் நிறையை ‘ஆண்டவர்’ காக்கிறது; ‘எஜமான்’ இங்கு பொருளைக் குறுக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சொற்றொடர் சுருக்கமாக வைக்கப்பட்டு, கிரேக்க மூலத்தின் கதைத் தொடர்ச்சியும் காரணரைச் சொல்லாத அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
