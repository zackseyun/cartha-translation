id: ACT.9.23
reference: Acts 9:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: ta
  text: பல நாட்கள் கடந்தபோது,[a] யூதர்கள்[b] அவரைக் கொல்லச் சதித்திட்டம் தீட்டினார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பல நாட்கள் கடந்தபோது” என்பதற்கு, “பல நாட்கள் நிறைவடைந்தபோது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “யூதர்கள்”; இச்சூழலில் இது சவுலை எதிர்த்த ஒரு குறிப்பிட்ட குழுவைக் குறிக்கிறது; விதிவிலக்கின்றி எல்லா யூதர்களையும் குறிக்கவில்லை.
    reason: cultural_note
  - marker: c
    text: “சதித்திட்டம் தீட்டினார்கள்” என்பதற்கு, “ஒன்றுகூடித் திட்டமிட்டார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: கடந்தபோது
  rationale: δέ-ஐத் தனியே மிகைப்படுத்தாமல், ὡς உடன் வரும் கால மாற்றத்தைத் தமிழில் இயல்பான துணைவாக்கியமாகக் காட்டுகிறது.
- source_word: ἐπληροῦντο
  choice: கடந்த
  rationale: ‘நாட்கள்’ எழுவாயாக வரும்போது πληρόω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் காலம் நிறைவடைதல் அல்லது கடந்து செல்லுதல் என்ற மரபுத்தொடர் பொருளைக் கொண்டுள்ளது; ‘கடந்த’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἡμέραι ἱκαναί
  choice: பல நாட்கள்
  rationale: இங்கு ἱκαναί என்பது வெறுமனே ‘போதுமான’ என்பதல்ல, கணிசமான கால அளவைக் குறிக்கிறது; ‘பல நாட்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: συνεβουλεύσαντο
  choice: சதித்திட்டம் தீட்டினார்கள்
  rationale: கூட்டாக ஆலோசித்து தீங்கான திட்டம் வகுத்ததைச் சூழல் காட்டுகிறது; இந்தத் தமிழ்ச் சொற்றொடர் கூட்டு இரகசியத் திட்டத்தின் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கத்தின் பொதுவான இன-சமயக் குறிப்பை மேலதிகமாக ‘தலைவர்கள்’ என்று குறுக்காமல் அப்படியே பாதுகாக்கிறது; சூழல் வரம்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἀνελεῖν
  choice: கொல்ல
  rationale: ஒருவரின் உயிரை எடுப்பதை நேரடியாகக் குறிக்கிறது; ‘கொலை செய்ய’ என்பதில் வரக்கூடிய கூடுதல் சட்ட-அற நுணுக்கத்தைத் தவிர்க்கிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: சூழலில் சவுலைக் குறிக்கும் ஆண்பால் ஒருமை வேற்றுமைச் சுட்டுப்பெயரை மரியாதையான இயல்புத் தமிழில் தருகிறது.
theological_decisions:
- issue: பகைமையான நிகழ்வுச் சூழலில் οἱ Ἰουδαῖοι என்பதன் மொழிபெயர்ப்பு
  choice: யூதர்கள்
  alternative: யூதத் தலைவர்கள் / யூதேயர்கள்
  rationale: மூலத்தில் இல்லாத ‘தலைவர்கள்’ என்ற வரம்பை முதன்மை உரையில் சேர்க்காமல் கிரேக்கச் சொல்லை பாதுகாக்கிறது. அதேவேளை, இது எல்லா யூதர்களையும் விதிவிலக்கின்றிக் குறிக்காது; சவுலை எதிர்த்த குறிப்பிட்ட குழுவைச் சூழல் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளை கண்ணியமான நடையில் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் காலத் துணைவாக்கியமும், கூட்டு விரோதத் திட்டத்தின் பொருளும் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
