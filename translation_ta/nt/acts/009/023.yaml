  source_fidelity: மூல கிரேக்கத்தின் காலக் குறிப்பு (Ὡς δὲ… ἐπληροῦντο ἡμέραι ἱκαναί), ‘பல நாட்கள்’ என்ற அளவுக் குறிப்பு, யூதர்களின் கூட்டு விரோதத் திட்டம் (συνεβουλεύσαντο), மற்றும் சவுலைக் கொல்லும் நோக்கம் (ἀνελεῖν αὐτόν) ஆகிய அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘பல நாட்கள் கடந்தபோது’ என்பது இவ்விடத்திலுள்ள காலம் கடந்து/நிறைவடைந்து கொண்டிருந்தது என்ற மரபுத்தொடர் பொருளுக்கு இயல்பான தமிழ் வடிவாகும்.
  naturalness: ‘பல நாட்கள் கடந்தபோது, யூதர்கள் அவரைக் கொல்லச் சதித்திட்டம் தீட்டினார்கள்’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் இயல்பாகவும் உள்ளது. ‘அவரைக்’ என்பது சவுலுக்கான மரியாதையான, சூழலுக்கேற்ற சுட்டுப்பெயர் பயன்பாடாகும்.
  terminology: ‘யூதர்கள்’ மூலத்தின் οἱ Ἰουδαῖοι என்பதைத் தேவையற்ற விளக்கக் குறுக்கீடின்றி மொழிபெயர்க்கிறது. எல்லா யூதர்களையும் பொதுமைப்படுத்தாத சூழல் விளக்கம் அடிக்குறிப்பில் உரியவாறு தரப்பட்டுள்ளது. ‘கொல்ல’ ἀνελεῖν-இன் நேரடியான பொருளையும், ‘சதித்திட்டம் தீட்டினார்கள்’ συνεβουλεύσαντο-இன் பகைமையான கூட்டு ஆலோசனையையும் நன்றாகத் தருகின்றன.
