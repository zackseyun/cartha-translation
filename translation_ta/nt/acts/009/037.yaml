source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: ta
  text: அந்த நாட்களில் அவள் நோயுற்று இறந்தாள். அவளைக் கழுவிய பின்பு, அவர்கள் அவளை மேல் தளத்தில் உள்ள ஓர் அறையில்[a] கிடத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலறையில்.” கிரேக்கச் சொல் மேல் தளத்தில் உள்ள ஓர் அறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: '[தனியே மொழிபெயர்க்காமல் நிகழ்வை அறிமுகப்படுத்தும் வாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டது]'
  rationale: இது அடுத்த நிகழ்வை அறிமுகப்படுத்தும் கிரேக்கக் கதைநடைச் சூத்திரம். தமிழில் ‘அது நிகழ்ந்தது’ என்று தனியே சேர்ப்பது இயல்பற்றதாக இருக்கும்; அடுத்த கூற்றை நேரடியாகச் சொல்வதே அதன் உரையாடல் செயல்பாட்டைத் தெளிவாக வழங்குகிறது.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: அந்த நாட்களில்
  rationale: கிரேக்க காலக் குறிப்பை நெருக்கமாகவும் இயல்பான நவீன தமிழிலும் தருகிறது.
- source_word: ἀσθενήσασαν
  choice: நோயுற்று
  rationale: இங்கு ἀσθενέω உடல்நோயைக் குறிக்கிறது; வினையெச்ச வடிவம் நோயுற்றதைத் தொடர்ந்து மரணம் நிகழ்ந்த வரிசையை இயல்பாகக் காட்டுகிறது.
- source_word: ἀποθανεῖν
  choice: இறந்துபோனாள்
  rationale: ἐγένετο என்பதுடன் வரும் கிரேக்க இறந்தகால வினையெச்ச–வினையெச்சமுற்று கட்டமைப்பின் பொருளைத் தமிழில் இயல்பான முற்றுவினையாக வழங்குகிறது.
- source_word: λούσαντες
  choice: அவளைக் குளிப்பாட்டிய பின்பு
  rationale: இறப்புக்குப் பின் உடலைக் கழுவிய செயல் முதன்மைச் செயலுக்கு முன்னர் நடந்ததைத் தெளிவாக்குகிறது. ‘அவளை’ என்பது மூலத்தின் αὐτήν என்பதைக் காக்கிறது; சூழலில் அது அவளுடைய உடலைக் குறிக்கிறது.
- source_word: ἔθηκαν αὐτὴν
  choice: அவர்கள் அவளை … கிடத்தினார்கள்
  rationale: τίθημι என்பதன் ‘வைத்தல்/கிடத்துதல்’ பொருளில், இறந்தவரின் உடலை ஓர் அறையில் கிடத்திய சூழலுக்கு ‘கிடத்தினார்கள்’ இயல்பாகப் பொருந்துகிறது.
- source_word: ἐν ὑπερῴῳ
  choice: மாடியிலிருந்த ஓர் அறையில்
  rationale: ὑπερῷον என்பது மேல் தளத்திலுள்ள ஓர் அறையைக் குறிக்கிறது. கிரேக்கத்தில் சுட்டுச் சுட்டுப்பெயரடை இல்லாததால் குறிப்பிட்ட புகழ்பெற்ற ‘அந்த மேலறை’ என்ற எண்ணத்தை உருவாக்காமல் ‘ஓர் அறை’ என்று வழங்கப்படுகிறது.
theological_decisions:
- issue: ὑπερῴῳ என்பதை பாரம்பரியமான ‘மேலறை’ என்று வழங்குவதா அல்லது அதன் இடவியல் பொருளை வெளிப்படையாகச் சொல்வதா
  choice: மாடியிலிருந்த ஓர் அறையில்
  alternative: மேலறையில்
  rationale: இந்தச் சொற்றொடர் கோட்பாட்டுச் சுமை மிகுந்ததல்ல. ஆயினும் ‘மேலறை’ என்பது குறிப்பிட்ட ஓர் அறையை நினைவூட்டக்கூடும்; கிரேக்கச் சொல் பொதுவாக மேல் தள அறையையே குறிக்கிறது. ஆகவே மூலத்தின் பொதுத்தன்மையைத் தக்கவைக்கும் தெளிவான இடவியல் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குளிப்பாட்டிய பின்பு’ என்பது இறந்த உடலைக் கழுவியதைச் சூழலால் உணர்த்துகிறது; மூலத்தில் இல்லாத இறுதிச்சடங்கு விவரங்கள் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறி அது விளக்கும் ‘மாடியிலிருந்த ஓர் அறையில்’ என்ற சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
