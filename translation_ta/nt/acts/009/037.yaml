  to: அந்த நாட்களில் அவள் நோயுற்று இறந்தாள். அவளைக் கழுவிய பின்பு, அவர்கள் அவளை மேல் தளத்தில் உள்ள ஓர் அறையில்[a] கிடத்தினார்கள்.
