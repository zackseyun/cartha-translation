source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: ta
  text: ஆனால் அனனியா, “ஆண்டவரே, இந்த மனிதனைப் பற்றி நான் பலரிடமிருந்து கேள்விப்பட்டிருக்கிறேன். எருசலேமில் உம்முடைய பரிசுத்தவான்களுக்கு இவன் எவ்வளவோ தீமைகள் செய்திருக்கிறான்[a]” என்று பதிலளித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமில் உம்முடைய பரிசுத்தமானவர்களுக்கு இவன் எத்தனை தீய செயல்களைச் செய்திருக்கிறான்.”
    reason: ὅσα κακά என்பதன் பன்மை வலிமையையும் τοῖς ἁγίοις என்பதற்கான இன்னொரு நேரடி சொல்லாக்கத்தையும் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: ஆனால் ... பதிலளித்தான்
  rationale: δέ இங்கு அனனியாவின் தயக்கமுள்ள மறுமொழியைக் குறிக்கும் மென்மையான எதிர்நிலை இணைப்பாக உள்ளது; ἀπεκρίθη என்பதற்கு ‘பதிலளித்தான்’ நேரான, இயல்பான இணை.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: உயிர்த்தெழுந்த இயேசுவை நேரடியாக அழைக்கும் சூழலில் மரியாதையையும் இறையியல் கனத்தையும் காக்கும் வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: நான் பலரிடமிருந்து கேள்விப்பட்டிருக்கிறேன்
  rationale: பல நபர்களிடமிருந்து கிடைத்த செய்தி தற்போதைய எதிர்வினைக்கு இன்னும் பொருத்தமானது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: இந்த மனிதனைப் பற்றி
  rationale: περί + genitive மற்றும் demonstrative ஆகியவற்றின் பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ὅσα κακὰ
  choice: எவ்வளவோ தீமைகள்
  rationale: ὅσα மற்றும் பன்மை κακά ஆகியவை தீய செயல்களின் பெருமளவையும் பன்மையையும் உணர்த்துகின்றன; ‘எவ்வளவோ தீமைகள்’ அதை இயல்பான தமிழில் காக்கிறது.
- source_word: τοῖς ἁγίοις σου
  choice: உம்முடைய பரிசுத்தவான்களுக்கு
  rationale: ἅγιοι என்பதன் நிறுவப்பட்ட புதிய ஏற்பாட்டு சொல்லையும் ‘உம்முடைய’ என்ற உடைமையுறவையும் பாதுகாக்கிறது.
- source_word: ἐποίησεν
  choice: செய்திருக்கிறான்
  rationale: ποιέω என்பதன் பரந்த பொருளுக்கு நேரான இணை; கடந்த செயல்களின் தற்போதைய பொருத்தத்தையும் தமிழில் இயல்பாக உணர்த்துகிறது.
- source_word: ἐν Ἰερουσαλήμ
  choice: எருசலேமில்
  rationale: இடப்பொருளை நேரடியாக வழங்கும் வழக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: அனனியா அழைக்கும் Κύριε என்பதன் குறிப்பு மற்றும் வலிமை
  choice: இயேசுவை நோக்கிய ‘ஆண்டவரே’ என்ற நேரடி அழைப்பு
  alternative: வெறும் மரியாதைத் தொனியுள்ள ‘ஐயா’ அல்லது ‘எஜமானே’
  rationale: உடனடிச் சூழலில் அனனியா தரிசனத்தில் உயிர்த்தெழுந்த இயேசுவுக்குப் பதிலளிக்கிறார்; ஆகவே ‘ஆண்டவரே’ என்பது கதையின் இறையியல் கனத்தை மிகைப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவமான ‘உம்முடைய’ பயன்படுத்தப்பட்டுள்ளது; ‘பரிசுத்தவான்கள்’ புதிய ஏற்பாட்டின் நிறுவப்பட்ட சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது.
