source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: ta
  text: அவரைக் கேட்ட அனைவரும் வியந்துகொண்டு, “எருசலேமில் இந்தப் பெயரை அழைப்பவர்களை நாசப்படுத்தியவன் இவன்தானே? அவர்களைக் கட்டப்பட்டவர்களாகத் தலைமை ஆசாரியர்களிடம் கொண்டுசெல்லும் நோக்கத்திற்காகத்தானே இங்கே வந்திருந்தான்?” என்று சொல்லிக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தப் பெயரை வேண்டிக்கொள்பவர்கள்.” ‘இந்தப் பெயர்’ என்பது இயேசுவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: திகைத்துப்போய்
  rationale: தொடர்ந்து நிலவிய கடும் வியப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πάντες οἱ ἀκούοντες
  choice: அவர் பேசுவதைக் கேட்ட அனைவரும்
  rationale: கிரேக்கத்தில் உள்ள மறைமுகப் பொருளைச் சூழலிலிருந்து தெளிவுபடுத்தி, பெயரெச்சத் தொடரை இயல்பான தமிழாக்கமாக வழங்குகிறது.
- source_word: πορθήσας
  choice: அழித்தொழிக்க முயன்றவன்
  rationale: வெறும் ‘துன்புறுத்தினவன்’ என்பதைவிட வலிமையான அழிவு நோக்கிய தாக்குதலைக் காட்டுகிறது; விசுவாசிகள் முற்றிலும் அழிக்கப்பட்டார்கள் என்று பொருள் வராதபடி ‘முயன்றவன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: இந்தப் பெயரை அழைத்துத் தொழுதவர்களை
  rationale: ἐπικαλέομαι என்பதின் வேண்டுதல்/வழிபாட்டு நுணுக்கத்தையும் ‘இந்தப் பெயர்’ என்ற வேதாகம மரபுத்தொடரையும் காக்கிறது.
- source_word: εἰς τοῦτο
  choice: இதற்காகத்தானே
  rationale: குறிப்பிட்ட நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐληλύθει
  choice: வந்திருந்தான்
  rationale: பேசுபவர்களின் தற்போதைய பார்வைக்கு முந்திய வருகையைப் பூர்த்தியடைந்த இறந்தகால வடிவில் காட்டுகிறது.
- source_word: δεδεμένους
  choice: கட்டி
  rationale: கட்டப்பட்ட நிலையைக் குறிக்கிறது; சங்கிலி என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்ப்பதில்லை.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: முதன்மைக் குருமார்களிடம் கொண்டுபோவதற்கு
  rationale: அதிகாரிகளிடம் கைதிகளாகக் கொண்டுசெல்லும் கருத்தை இயல்பாகத் தருகிறது; ‘முன்பாக’ என்ற நீதித்துறை நுணுக்கத்தை மிகைப்படுத்துவதில்லை.
- source_word: ἀρχιερεῖς
  choice: முதன்மைக் குருமார்
  rationale: பல தலைமை ஆசாரிய அதிகாரிகளைக் குறிக்கும் வரலாற்றுச் சூழலுக்கு ஏற்றது; ஒரே ‘தலைமைக் குரு’ என்று தவறாகக் காட்டாது.
theological_decisions:
- issue: ‘இந்தப் பெயர்’ என்பதன் குறிப்பு
  choice: மூலத்தில் இருப்பதுபோல ‘இந்தப் பெயர்’ என்று வைத்தல்
  alternative: ‘இயேசுவின் பெயர்’ என்று வெளிப்படுத்தல்
  rationale: கிரேக்கம் குறிப்பை மறைமுகமாகவே வைக்கிறது; சூழல் இயேசுவைக் குறிப்பது தெளிவு என்பதால் விளக்க விரிவாக்கம் செய்யப்படவில்லை.
- issue: πορθήσας என்பதின் வலிமை
  choice: ‘அழித்தொழிக்க முயன்றவன்’
  alternative: ‘துன்புறுத்தினவன்’ அல்லது ‘அழித்தவன்’
  rationale: வினையின் கடுமையைப் பாதுகாக்கிறது; ஆனால் எருசலேமிலிருந்த விசுவாசிகளை சவுல் உண்மையில் முற்றிலும் அழித்துவிட்டான் என்ற தவறான முடிவைத் தவிர்க்கிறது.
- issue: இரண்டாம் வாக்கியத்தின் கேள்வித்தன்மை
  choice: ‘...வந்திருந்தான்?’ என்ற தொடர்ந்த வினாவாக மொழிபெயர்த்தல்
  alternative: ‘...வந்திருந்தான்’ என்ற கூற்றாக மொழிபெயர்த்தல்
  rationale: முழுக் கிரேக்க உரையும் ஒரே வினாக்குறியுடன் நிறைவடைகிறது; முதல் மறுப்பு வினாவின் கருத்து இரண்டாம் பகுதிக்கும் தொடர்வது இயல்பான வாசிப்பு.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. தொடர்ச்சியான வியப்பையும் பேச்சையும் காட்ட ‘திகைத்துப்போய்’ மற்றும் ‘கேட்டுக்கொண்டிருந்தார்கள்’ பயன்படுத்தப்பட்டுள்ளன. ‘இந்தப் பெயர்’ என்ற மூலத்தின் மறைமுகக் குறிப்பு பாதுகாக்கப்பட்டுள்ளது.
