  text: καὶ ἦν ἡμέρας τρεῖς μὴ βλέπων, καὶ οὐκ ἔφαγεν οὐδὲ ἔπιεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/009.yaml
  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: ta
  text: அவர் மூன்று நாட்கள் பார்வையில்லாமல்[a] இருந்தார்; அவர் சாப்பிடவும் இல்லை, குடிக்கவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்படியாக, ‘பார்க்காமல்.’ சவுலால் பார்க்க முடியவில்லை என்பதை இத்தொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: மூன்று நாட்கள் ... இருந்தார்
  rationale: ἡμέρας τρεῖς கால அளவைக் குறிக்கும் வேற்றுமை வடிவம்; நவீனத் தமிழில் இயல்பாக ‘மூன்று நாட்கள்’ என்று மொழிபெயர்க்கப்படுகிறது. ἦν என்பதற்கு ‘இருந்தார்’ என நேரடியாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: μὴ βλέπων
  choice: பார்வையில்லாமல்
  rationale: βλέπω என்பதன் அடிப்படைப் பொருள் ‘பார்’; இப்பெயரெச்சத் தொடர் சொற்படி ‘பார்க்காமல்/பார்க்க முடியாதவராக’ என்பதாகும். ‘பார்வையில்லாமல்’ என்பது நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘குருடராக’ என்ற வலுவான பெயரடையைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: οὐκ ἔφαγεν
  choice: சாப்பிடவும் இல்லை
  rationale: ἔφαγεν என்பது ‘சாப்பிட்டார்’ என்று பொருள்படும். அடுத்த மறுப்பு வினையுடன் இணைந்து தமிழில் ‘சாப்பிடவும் இல்லை, குடிக்கவும் இல்லை’ என்பது இயல்பான இணை அமைப்பு.
- source_word: οὐδὲ ἔπιεν
  choice: குடிக்கவும் இல்லை
  rationale: οὐδὲ இரண்டாவது மறுப்பு வினையை முதலாவதுடன் இணைக்கிறது. தமிழில் இணையான ‘-வும் இல்லை’ அமைப்பு இரு செயல்களும் நடைபெறவில்லை என்பதைத் தெளிவாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பார்வையில்லாமல்’ என்பது மூலத்தின் μὴ βλέπων என்ற தொடரின் வினைநிலையைப் பாதுகாக்கிறது; ‘குருடராக’ என்று வெளிப்படையாக வலுப்படுத்தவில்லை.
