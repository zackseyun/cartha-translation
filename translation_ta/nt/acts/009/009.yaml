  source_fidelity: மூலத்தின் காலஅளவு (‘மூன்று நாட்கள்’), μὴ βλέπων என்பதன் பார்க்க இயலாத நிலை (‘பார்வையில்லாமல்’), மற்றும் இரட்டை மறுப்பு (‘சாப்பிடவும் இல்லை, குடிக்கவும் இல்லை’) ஆகியவை பொருளைச் சரியாகக் கொடுக்கின்றன. ‘குருடராக’ என்று மூலத்தைவிட வலுவான சொல்லைச் சேர்க்கவில்லை.
  naturalness: நவீன நிலையான தமிழில் வாக்கியம் இயல்பாகவும் தெளிவாகவும் உள்ளது. இரண்டாவது ‘அவர்’ சிறிது மீள்வடிவமாக இருந்தாலும், வாசிப்புக்கோ பொருளுக்கோ இடையூறு இல்லை.
