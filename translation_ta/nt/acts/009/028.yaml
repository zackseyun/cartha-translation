  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: ta
  text: அவர் அவர்களுடன் எருசலேமில் வந்து போய்க்கொண்டும், ஆண்டவரின் பெயரில் துணிவுடன் பேசிக்கொண்டும் இருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: அவர் அவர்களுடன் … இருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலையை உணர்த்தும் ἦν என்பதும் μετά + ஆறாம் வேற்றுமையும் நீடித்த உடனிருப்பையும் தொடர்பையும் குறிக்கின்றன. ‘அவர்களுடன்’ என்பது தங்கியிருந்தார் என்ற கூடுதல் பொருளைச் சேர்க்காமல் இதை இயல்பாகத் தருகிறது.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: போய் வந்துகொண்டிருந்து
  rationale: இணையாக வரும் இரு பங்கேற்பு வினைகளும் தொடர்ச்சியான, தடையற்ற நடமாட்டத்தையும் சீடர்களுடனான வெளிப்படையான உறவையும் குறிக்கும் மரபுத்தொடர். தமிழில் ‘போய் வந்துகொண்டிருந்து’ என்பது அதன் தொடர்ச்சியான இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமில்
  rationale: இங்கு εἰς என்பது நகருக்குள் மீண்டும் மீண்டும் நுழைவதை அல்ல, செயல்பாடு நிகழ்ந்த இடத்தைச் சுட்டுகிறது. ஆகவே இடப்பொருளில் ‘எருசலேமில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: παρρησιαζόμενος
  choice: துணிவுடன் பேசிவந்தார்
  rationale: இவ்வினை வெளிப்படையாகவும் அச்சமின்றியும் பேசுவதை உணர்த்துகிறது. ‘துணிவுடன்’ அதன் தைரியத்தையும், ‘பேசிவந்தார்’ அதன் தொடர்நிலையையும் காக்கின்றன.
- source_word: ἐν τῷ ὀνόματι
  choice: பெயரில்
  rationale: இச்சொற்றொடர் அதிகாரம், பிரதிநிதித்துவம், அறிக்கையிடுதல் ஆகிய பல தொடர்புடைய நுணுக்கங்களைத் தாங்குகிறது. ‘பெயரில்’ என்ற வேதாகம மரபுத்தொடர் அவற்றை ஒன்றாகக் காக்கிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவரின்
  rationale: κύριος என்பது பெயராக மாற்றப்படாமல் பட்டப்பெயராக ‘ஆண்டவர்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பதன் குறிப்பு
  choice: மூலத்தில் உள்ள பட்டப்பெயரான ‘ஆண்டவர்’ என்பதே முதன்மை உரையில் வைக்கப்பட்டுள்ளது; சூழலில் அது இயேசுவைக் குறிக்கிறது.
  alternative: ‘இயேசுவின் பெயரில்’ என்று வெளிப்படையாக வழங்குதல்
  rationale: கிரேக்க மூலத்தில் κυρίου என்றே உள்ளது; Ἰησοῦ என்று இல்லை. எனவே சூழல் குறிப்பை உரைக்குள் சேர்த்து பட்டப்பெயரைப் பெயராக மாற்றாமல், மூலத்தின் சொல்லாட்சியும் இறையியல் ஒலிப்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘போய் வந்துகொண்டிருந்து’ என்பது கிரேக்கத்தின் சொல்-சொல்லான ‘உள்ளே சென்று வெளியே வந்து’ என்பதைவிட இயல்பான தமிழில் அதன் மரபுத்தொடர் பொருளையும் தொடர்ச்சியையும் தருகிறது.
