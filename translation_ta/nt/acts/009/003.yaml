  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: ta
  text: அவர் பயணம் செய்துகொண்டு தமஸ்குவை நெருங்கிக்கொண்டிருந்தபோது, திடீரென்று வானத்திலிருந்து[a] ஓர் ஒளி அவரைச் சுற்றிப் பிரகாசித்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “பரலோகத்திலிருந்து.” கிரேக்கச் சொல் “வானம்” அல்லது “பரலோகம்” என இருவிதமாகவும் பொருள்படலாம்; இச்சூழலில் ஒளியின் தெய்வீக மூலமே குறிப்பாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: அவர் பயணம் செய்து…கொண்டிருந்தபோது
  rationale: ἐν உடன் வரும் பெயர்ச்சொல் தன்மையுள்ள நிகழ்கால வினையெச்சம், அதே நேரத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கிறது. தமிழில் இயல்பாக அமைய, பயணமும் தமஸ்குவை நெருங்குதலும் ஒரே காலச்சூழல் வாக்கியத்தில் இணைக்கப்பட்டுள்ளன; δέ இங்கு மென்மையான கதைத் தொடர்ச்சிக் குறியீடாக இருப்பதால் தனிச்சொல்லாக மிகைப்படுத்தப்படவில்லை.
- source_word: ἐγένετο αὐτὸν ἐγγίζειν
  choice: தமஸ்குவை நெருங்கிக்கொண்டிருந்தபோது
  rationale: ἐγένετο இங்கு லூக்காவின் கதைநடை அமைப்பாகச் செயல்படுகிறது. அதைத் தமிழில் ‘அது நடந்தது’ என்று தனியே மொழிபெயர்ப்பது செயற்கையாக இருப்பதால், தொடர்ந்து நடந்த நெருங்குதலைக் குறிக்கும் இயல்பான காலத்துணை வாக்கியமாக வழங்கப்பட்டுள்ளது.
- source_word: τῇ Δαμασκῷ
  choice: தமஸ்குவை
  rationale: ἐγγίζω உடன் வரும் வேற்றுமை உருபு, அணுகப்படும் இடத்தைக் குறிக்கிறது. நகருக்குள் நுழைந்ததாகக் கூறாமல், அதை நெருங்கியதைத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἐξαίφνης τε
  choice: திடீரென்று
  rationale: ἐξαίφνης நிகழ்வின் எதிர்பாராத, உடனடியான தொடக்கத்தைக் குறிக்கிறது. τε தரும் மென்மையான இணைப்பு தமிழ் வாக்கிய ஓட்டத்தில் நிறுத்தக்குறியாலும் தொடரமைப்பாலும் வெளிப்படுகிறது.
- source_word: περιήστραψεν
  choice: அவரைச் சுற்றிப் பிரகாசித்தது
  rationale: இந்தக் கூட்டு வினை ஒளி ஒருவரைச் சுற்றிலும் ஒளிர்ந்ததைக் குறிக்கிறது. ‘சுற்றிப் பிரகாசித்தது’ திடீர் ஒளியையும் சூழ்ந்துகொண்ட விளைவையும் இயல்பான தமிழில் தருகிறது.
- source_word: φῶς
  choice: ஓர் ஒளி
  rationale: குறிப்புச்சுட்டி இல்லாத φῶς, இங்கு புதிதாக அறிமுகமாகும் ஓர் ஒளியைக் குறிக்கிறது; உயிரெழுத்துக்கு முன் இயல்பான வடிவமாக ‘ஓர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானிலிருந்து
  rationale: οὐρανός என்பது ‘வானம்’ அல்லது ‘பரலோகம்’ எனப் பொருள்படலாம். ‘வானிலிருந்து’ மூலத்தின் உருவகத் திறப்பைத் தக்கவைத்துக்கொள்கிறது; இச்சூழலில் அதன் தெய்வீக மூலத்தை வாசகர் உணர இடமளிக்கிறது.
theological_decisions:
- issue: வெளிப்பாட்டு நிகழ்வில் οὐρανός என்பதன் பொருள்
  choice: வானிலிருந்து
  alternative: பரலோகத்திலிருந்து
  rationale: சூழல் ஒளியின் தெய்வீக மூலத்தைச் சுட்டினாலும், கிரேக்கச் சொல் வானத்தையும் பரலோகத்தையும் குறிக்கக்கூடும். முதன்மை உரையில் ‘வானிலிருந்து’ என வைத்து சொற்பொருள் விரிவைத் தக்கவைத்து, தெளிவான மாற்றை அடிக்குறிப்பில் தருவது தேவையற்ற விளக்கத் தீர்மானத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரகாசித்தது’ என்பது இயல்பாகவும் உயர்நடையாகவும் இருந்து, ஒளி அவரைச் சூழ்ந்ததைத் தெளிவுபடுத்துகிறது. எந்தச் சமயப்பிரிவுக்கே உரிய சொற்களும் விளக்கங்களும் சேர்க்கப்படவில்லை.
