  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: ta
  text: உடனே அவனுடைய கண்களிலிருந்து செதில்கள் போன்றவை விழுந்தன[a]. அவன் மீண்டும் பார்வை பெற்றான்; பின்பு எழுந்து திருமுழுக்கு பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செதில்களைப் போல அவனுடைய கண்களிலிருந்து விழுந்தன.” கிரேக்க மொழியில் இது ஓர் ஒப்புமையாகச் சொல்லப்பட்டுள்ளது; அவை உண்மையான செதில்கள் என்று அடையாளப்படுத்தப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: உடனே
  rationale: நிகழ்வு தாமதமின்றி நடந்ததை இயல்பான நவீன தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: ἀπέπεσαν
  choice: விழுந்தன
  rationale: ἀποπίπτω என்பதன் பிரிந்து கீழே விழுதல் என்ற கருத்தை, ‘கண்களிலிருந்து’ என்பதுடன் சேர்ந்து தெளிவாக வெளிப்படுத்துகிறது.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: அவனுடைய கண்களிலிருந்து
  rationale: ἀπό + மரபுவேற்றுமை காட்டும் பிரிதலை இயல்பான தமிழில் துல்லியமாகக் குறிக்கிறது.
- source_word: ὡς λεπίδες
  choice: செதில்கள் போன்றவை
  rationale: ὡς என்பது அடையாளப்படுத்தாமல் ஒப்புமையைக் காட்டுகிறது; λεπίδες என்பதன் பன்மையையும் தெளிவான காட்சிப்படிமத்தையும் ‘செதில்கள்’ காக்கிறது.
- source_word: ἀνέβλεψεν
  choice: அவன் மீண்டும் பார்வை பெற்றான்
  rationale: குருட்டுத்தன்மை நீங்கும் சூழலில் ἀναβλέπω என்பது மேலே பார்த்தல் என்பதைக் காட்டிலும் பார்வை மீளப்பெறுதலைக் குறிக்கிறது.
- source_word: τε καὶ
  choice: ; பின்பு
  rationale: தொடர்ந்து நிகழ்ந்த செயல்களைத் தமிழில் இயல்பான வரிசையுடன் இணைக்கிறது.
- source_word: ἀναστάς
  choice: எழுந்து
  rationale: அடுத்த செயலை முன்னிட்டு நிகழ்ந்த எழுதலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἐβαπτίσθη
  choice: திருமுழுக்கு பெற்றான்
  rationale: செயப்பாட்டு வடிவத்தைப் பேணும், நவீனத் தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் வழிபாட்டுச் சொல்; இவ்வசனம் கூறாத செய்முறையை மேலும் குறிப்பிட்டு விடுவதில்லை.
theological_decisions:
- issue: βαπτίζω என்பதைக் குறிப்பிட்ட திருச்சபை மரபின் செய்முறையைத் திணிக்காமல் மொழிபெயர்த்தல்
  choice: திருமுழுக்கு பெற்றான்
  alternative: மூழ்கடிக்கப்பட்டான்
  rationale: வசனம் அந்தச் செயலைக் குறிப்பிடுகிறது; ஆனால் அதன் நடைமுறையை இங்கு விரிவாக வரையறுக்கவில்லை. ‘திருமுழுக்கு பெற்றான்’ என்பது நிலைபெற்ற தமிழ் வேதாகமச் சொல்லாட்சியாக இருந்து, தேவையற்ற பிரிவுசார் மிகைவிளக்கத்தைத் தவிர்க்கிறது.
- issue: ὡς λεπίδες என்பதை உண்மையான செதில்கள் என்று உறுதிப்படுத்தாமல் ஒப்புமையாக வைத்தல்
  choice: செதில்கள் போன்றவை
  alternative: செதில்கள்
  rationale: ὡς வெளிப்படையாக ஒப்புமையைக் குறிக்கிறது. எனவே நிகழ்ந்ததன் தோற்றத்தைச் சொல்வதோடு, அவை உண்மையிலேயே செதில்கள்தான் என்று உரை கூறாததை மொழிபெயர்ப்பு மதிக்கிறது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழில் எளிமையாகவும் கண்ணியமாகவும் வைக்கப்பட்டுள்ளது. ‘செதில்கள் போன்றவை’ என்பது மூலத்தின் பன்மையையும் ஒப்புமையையும் காக்கிறது. வாக்கியப் பிரிப்பு நிகழ்வுகளின் உடனடியான தொடரை வாசகருக்குத் தெளிவாக்குகிறது.
