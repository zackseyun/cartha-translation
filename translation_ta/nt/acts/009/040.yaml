id: ACT.9.40
reference: Acts 9:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: ta
  text: ஆனால் பேதுரு எல்லாரையும் வெளியே அனுப்பிவிட்டு, முழங்காலிட்டு ஜெபித்தார். பிறகு உடலின் பக்கம் திரும்பி, “தபித்தாவே, எழுந்திரு[a]” என்றார். அவள் தன் கண்களைத் திறந்தாள்; பேதுருவைக் கண்டதும் நிமிர்ந்து உட்கார்ந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எழுந்து நில்.” கிரேக்கக் கட்டளையை இரு விதமாகவும் மொழிபெயர்க்கலாம்; இந்நிகழ்வின் கண்ணியமான தொனியையும் அதன் சூழல்சார் ஆழத்தையும் காக்க “எழுந்திரு” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν ... ἔξω πάντας
  choice: எல்லாரையும் வெளியே அனுப்பிவிட்டு
  rationale: அங்கிருந்த அனைவரையும் அறைக்கு வெளியே அனுப்பிய செயலை இயல்பான தமிழில் தெரிவிக்கிறது; வலுக்கட்டாயமாகத் துரத்தியதாக மிகைப்படுத்தவில்லை.
- source_word: θεὶς τὰ γόνατα
  choice: முழங்காலிட்டு
  rationale: ஜெபிப்பதற்காக மண்டியிட்டதைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான, சுருக்கமான தமிழ் இணை.
- source_word: προσηύξατο
  choice: ஜெபித்தார்
  rationale: προσεύχομαι என்பதன் வழக்கமான பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: உடலின் பக்கம் திரும்பி
  rationale: பேதுரு உடலை நோக்கித் திரும்பிய உடல்சார் இயக்கத்தையும் σῶμα என்பதன் நேரடிப் பொருளையும் பாதுகாக்கிறது.
- source_word: Ταβιθά
  choice: தபித்தாவே
  rationale: தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்து, நேரடியாக அழைக்கும் விளிவடிவத்தை இயல்பாகக் காட்டுகிறது.
- source_word: ἀνάστηθι
  choice: எழுந்திரு
  rationale: இக்கட்டளை எழுதல், எழுந்து நிற்றல், உயிருடன் எழுதல் ஆகிய சூழல்சார் ஒலிப்புகளைத் திறந்தவாறே வைக்கிறது; ‘உயிர்த்தெழு’ என்று மொழிபெயர்த்து பொருளைத் தேவையின்றி குறுக்கவில்லை.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: அவள் தன் கண்களைத் திறந்தாள்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: பேதுருவைக் கண்டதும்
  rationale: பார்த்ததற்குப் பின் உட்கார்ந்த நிகழ்வொழுங்கைத் தமிழில் இயல்பான காலத் தொடர்பாகக் காட்டுகிறது.
- source_word: ἀνεκάθισεν
  choice: நிமிர்ந்து உட்கார்ந்தாள்
  rationale: படுத்திருந்த நிலையிலிருந்து உடலை நிமிர்த்தி உட்கார்ந்ததைக் குறிக்கும் வினையின் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: δὲ
  choice: ஆனால் / பிறகு
  rationale: முதல் δέ முந்தைய நிகழ்விலிருந்து மாறுதலையும், அடுத்தது கதை நகர்வையும் இயல்பான தமிழில் குறிக்கின்றன.
theological_decisions:
- issue: உயிர்ப்பித்தல் நிகழ்விலுள்ள கட்டளையின் மொழிபெயர்ப்பு
  choice: எழுந்திரு
  alternative: எழுந்து நில் / உயிர்த்தெழு
  rationale: ἀνάστηθι என்பது பொதுவாக எழுமாறு கூறும் கட்டளை; இச்சூழலில் உயிர் மீட்பின் ஆழ்ந்த ஒலிப்பு இருந்தாலும், கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘உயிர்’ என்ற கூறை முதன்மை உரையில் சேர்க்காமல் அந்தத் தெய்வீகத் த tension-ஐ பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஜெபித்தார்’ என்பது தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் நேரடியான சொல். ‘உடல்’ என்பது σῶμα என்பதற்கு நெருக்கமானது; ‘பிணம்’ என்று கூறி அடுத்துவரும் உயிர் மீட்புக் காட்சிக்கு முன்பே கடுமையான விளக்கத்தைத் திணிக்கவில்லை.
