source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: ta
  text: ஆனால் சவுல் மேலும் மேலும் வலிமைபெற்றுக்கொண்டே, தமஸ்குவில் வாழ்ந்த யூதர்களை, இவரே மெசியா[a] என்பதை நிறுவிக் காட்டி, குழப்பத்தில் ஆழ்த்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கப் பட்டமான Χριστός, அதன் யூத மெசியா பொருளைத் தக்கவைக்க இங்கு “மெசியா” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον
  choice: மேலும் மேலும்
  rationale: சவுல் தொடர்ந்து அதிகமாக வலிமைபெற்றார் என்ற ஒப்பீட்டு மிகுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐνεδυναμοῦτο
  choice: வலிமைபெற்று
  rationale: முற்றுப்பெறாத காலவினையின் தொடர்ச்சியான வளர்ச்சியைக் காட்டுகிறது; அந்த வலிமை அவருக்குள்ளிருந்து வந்ததா அல்லது வழங்கப்பட்டதா என்பதைத் தேவையின்றித் தீர்மானிக்கவில்லை.
- source_word: συνέχυννεν
  choice: நிலைகுலையச் செய்தார்
  rationale: வெறுமனே குழப்புவது என்பதைக் காட்டிலும், சவுலின் வாதத்தால் எதிராளிகள் பதிலளிக்க முடியாமல் தடுமாறிய வலுவான கருத்தைச் சூழலுக்கேற்றபடி தருகிறது.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: தமஸ்குவில் வாழ்ந்துவந்த யூதர்களிடம்
  rationale: குறிப்பாக தமஸ்குவில் வசித்த யூதர்களையே குறிக்கிறது; எல்லா யூதர்களையும் பொதுப்படுத்தவில்லை.
- source_word: συμβιβάζων
  choice: ஆதாரங்களுடன் நிரூபித்து
  rationale: கருத்துகளையும் சான்றுகளையும் ஒன்றிணைத்து ஒரு முடிவை நிறுவும் வாதச் செயல்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὗτός
  choice: இவரே
  rationale: இயேசுவையே குறிப்பிட்டுச் சுட்டும் வலியுறுத்தலைப் பாதுகாக்கிறது; எளிய ‘அவர்’ என்பதைவிட மூலத்தின் சுட்டுப்பெயர் வலிமையை நன்கு தருகிறது.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: இங்கு Χριστός ஒரு பெயராக அல்லாமல், எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் யூதப் பட்டமாகப் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: ὁ χριστός என்பது இங்கு வாக்களிக்கப்பட்ட அபிஷேகம் பெற்றவரை அடையாளப்படுத்தும் பட்டம். ‘மெசியா’ என்பது அந்த யூத மெசியா எதிர்பார்ப்பைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிலைகுலையச் செய்தார்’ என்பது விவாதச் சூழலில் συνέχυννεν என்பதன் வலிமையைப் பாதுகாக்கிறது; ‘ஆதாரங்களுடன்’ என்பது συμβιβάζων என்பதன் சான்றுகளை ஒன்றிணைத்து நிறுவும் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
