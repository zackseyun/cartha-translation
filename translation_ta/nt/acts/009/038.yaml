  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: ta
  text: லித்தா யோப்பாவுக்கு அருகில் இருந்ததால், பேதுரு அங்கே இருப்பதாகக் கேள்விப்பட்ட சீடர்கள், இரண்டு ஆண்களை அவரிடம் அனுப்பி, “எங்களிடம் வரத் தயங்காதீர்[a]” என்று வேண்டிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களிடம் வரத் தாமதிக்காதீர்.” இந்த வினைச்சொல் தயங்குவதையோ தாமதிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: லித்தா யோப்பாவுக்கு அருகில் இருந்ததால்
  rationale: இனமுற்ற தனிநிலைத் தொடரானது பின்னணிச் சூழலைத் தருகிறது; சீடர்களின் நடவடிக்கைக்கான காரண நுணுக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. δέ-க்கு தனியாக ‘இப்போது’ போன்ற காலச்சொல் சேர்க்கப்படவில்லை.
- source_word: Λύδδας / Ἰόππῃ
  choice: லித்தா / யோப்பா
  rationale: புதிய ஏற்பாட்டுத் தமிழில் அறியப்பட்ட கிரேக்க இடப்பெயர் வடிவங்களை ஒலிபெயர்க்கிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: அப்போஸ்தலர் பணிகளில் விசுவாசிகளின் சமூகத்தைச் சுட்டும் μαθηταί என்பதற்கான துல்லியமான, வழக்கமான சொல்.
- source_word: ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: பேதுரு அங்கே இருப்பதாகக் கேள்விப்பட்ட
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லின் முன்நிகழ்வை இயல்பான தமிழ்ப் பெயரெச்சத் தொடராகக் காட்டுகிறது; ‘அங்கே’ என்பது லித்தாவைக் குறிக்கிறது.
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: இரண்டு ஆண்களை அவரிடம் அனுப்பி
  rationale: வினை, எண்ணிக்கை, மனித ஆண் குறிப்பு, இலக்கு ஆகியவற்றை நேரடியாகப் பாதுகாக்கிறது.
- source_word: παρακαλοῦντες
  choice: வேண்டிக்கொண்டார்கள்
  rationale: இச்சூழலில் உள்ள ஊக்கமான, அவசரமான வேண்டுகோளைத் தெரிவிக்கிறது; உணர்ச்சித் தீவிரத்தை அளவுக்கு மீறிச் சேர்ப்பதில்லை.
- source_word: Μὴ ὀκνήσῃς
  choice: தயங்காதீர்
  rationale: ὀκνέω தயங்குதல், பின்வாங்குதல் அல்லது தாமதித்தல் ஆகிய நுணுக்கங்களைக் கொள்ளலாம். தமிழ் ‘தயங்காதீர்’ மூலத்தின் மனத்தயக்க நுணுக்கத்தைப் பாதுகாத்து, சூழலில் உடனே வருமாறு கோரும் பொருளையும் இயல்பாக உணர்த்துகிறது.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: எங்களிடம் வர
  rationale: பேசுவோரின் இருப்பிடத்தை நோக்கிய பேதுருவின் பயணத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; கிரேக்க மொழிமரபைச் சொல்லுக்குச் சொல் கடினமாக்கவில்லை.
