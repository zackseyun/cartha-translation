source:
  edition: SBLGNT
  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: ta
  text: ஆனால், அவர்களுடைய சதித்திட்டம் சவுலுக்குத் தெரியவந்தது. அவரைக் கொல்வதற்காக அவர்கள் இரவும் பகலும் வாயில்களையும்[a] கண்காணித்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நகர வாயில்களையும்.’ கிரேக்க மூலத்தில் ‘வாயில்கள்’ என்று மட்டுமே உள்ளது; அவை நகர வாயில்கள் என்பது சூழலிலிருந்து விளங்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: தெரியவந்தது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தின் பொருளை இயல்பான தமிழில் தருகிறது; சதித்திட்டத்தை சவுலுக்கு யார் தெரிவித்தார் என்பதைச் சேர்த்துக் கூறவில்லை.
- source_word: ἐπιβουλή
  choice: சதித்திட்டம்
  rationale: தீங்கு விளைவிக்க, குறிப்பாகக் கொலை செய்ய வகுக்கப்பட்ட இரகசியத் திட்டத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: παρετηροῦντο
  choice: கண்காணித்துக்கொண்டிருந்தார்கள்
  rationale: தொடர்ந்து உன்னிப்பாகக் கவனித்துக்கொண்டிருந்த செயலை இறந்தகாலத் தொடர்நிலை வடிவில் வெளிப்படுத்துகிறது; ‘காவல் காத்தார்கள்’ என்று பொருளை விரிவுபடுத்தவில்லை.
- source_word: πύλας
  choice: வாயில்கள்
  rationale: கிரேக்க மூலத்தின் பொதுவான பன்மைச் சொல்லைத் தக்கவைக்கிறது; சூழலில் இவை தமஸ்கு நகரத்தின் வாயில்கள் என்பது விளங்குகிறது.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: இரவும் பகலும்
  rationale: இடைவிடாத கண்காணிப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὅπως
  choice: என்பதற்காக
  rationale: நோக்கத்தைத் தெளிவாகக் காட்டும் தமிழ்க் கட்டமைப்பாக வாக்கியத்தில் ‘அவரைக் கொல்வதற்காக’ என அமைக்கப்பட்டுள்ளது.
- source_word: ἀνέλωσιν
  choice: கொல்வதற்கு
  rationale: இச்சூழலில் ἀναιρέω என்பதன் நேரடியான பொருள் கொலை செய்வதாகும்; மழுப்பலின்றி தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: கொலைத் திட்டத்துக்கும் அது சவுலுக்குத் தெரியவந்ததற்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: καὶ
  choice: -யும்
  rationale: கதவுகளைக் கண்காணித்தது அவர்களுடைய சதித்திட்டத்துடன் சேர்ந்த கூடுதல் நடவடிக்கை என்பதை ‘வாயில்களையும்’ என்ற இணைப்பும்மை இயல்பாக வெளிப்படுத்துகிறது.
