translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. மூலத்தில் சொல்லப்படாத செய்பவரை ‘தெரிவிக்கப்பட்டது’ போன்ற வடிவால் ஊகிக்காமல், ‘தெரியவந்தது’ என அமைத்துள்ளது. ‘வாயில்கள்’ என்ற மூலத்தின் தெளிவின்மையை முதன்மை உரையில் தக்கவைத்து, சூழல்சார் விரிவாக்கத்தை அடிக்குறிப்பில் வழங்கியுள்ளது.
