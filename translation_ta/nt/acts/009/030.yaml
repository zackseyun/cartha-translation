- from: சகோதரர்கள் இதை அறிந்தபோது,[a] அவரைக் கீழே செசரியாவுக்குக் கொண்டுபோய், அங்கிருந்து தர்சுவுக்கு அனுப்பிவைத்தார்கள்.
  to: சகோதரர்கள் இதை அறிந்தபோது,[a] அவரைக் கீழே செசரியாவுக்குக் கொண்டுபோய், தர்சுவுக்கு அனுப்பிவைத்தார்கள்.
