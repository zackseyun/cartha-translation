source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: ta
  text: சகோதரர்கள் இதை அறிந்தபோது,[a] அவரைக் கீழே செசரியாவுக்குக் கொண்டுபோய், தர்சுவுக்கு அனுப்பிவைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகள்.’ கிரேக்கத்தில் ‘சகோதரர்கள்’ என்று உள்ளது; ஆனால் இச்சூழலில் அது விசுவாசிகளின் சமூகத்தை விரிவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: இதை அறிந்தபோது
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயல்களைத் தூண்டிய சூழ்நிலையை அறிமுகப்படுத்துகிறது. அதன் மறைமுகச் செயப்படுபொருள் முந்தைய வசனத்திலிருந்து புரிவதால், தமிழில் இயல்பாக ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: οἱ ἀδελφοὶ
  choice: சகோதரர்கள்
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை நேரடியாகக் காக்கிறது. இச்சொல் சூழலில் விசுவாசிகளின் விரிவான சமூகத்தையும் குறிக்கக்கூடும் என்பதால் அது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: κατήγαγον
  choice: கீழே ... கொண்டுபோய்
  rationale: κατά- கூறும் திசை அல்லது கடற்கரையை நோக்கிய நிலவியல் நகர்வை ‘கீழே’ காக்கிறது; தமிழில் இயல்பான தொடருக்காக ‘கொண்டுபோய்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Καισάρειαν
  choice: செசரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறிமுகமான இடப்பெயர் ஒலிபெயர்ப்பு.
- source_word: ἐξαπέστειλαν
  choice: அங்கிருந்து ... அனுப்பிவைத்தார்கள்
  rationale: ἐξαποστέλλω என்பதிலுள்ள வெளியே அல்லது அப்பால் அனுப்பும் நுணுக்கத்தை ‘அங்கிருந்து’ மற்றும் ‘அனுப்பிவைத்தார்கள்’ இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: Ταρσόν
  choice: தர்சு
  rationale: நகரத்தின் பெயருக்கான இயல்பான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: கலப்பு பாலின விசுவாசக் சமூகத்தைக் குறிக்கக்கூடிய ἀδελφοί என்பதன் மொழிபெயர்ப்பு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; சக விசுவாசிகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவம் முதன்மை உரையில் காக்கப்படுகிறது. அதேவேளை, சூழலில் இந்தச் சொல் விசுவாசிகளின் சமூகத்தை விரிவாகக் குறிக்கக்கூடிய வாய்ப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது; இவ்வாறு மூலத்தின் வடிவமும் பொருளின் சாத்தியமான விரிவும் இரண்டும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன, கண்ணியமான, எளிதில் புரியும் நடை. கிரேக்க வாக்கியத்தின் தொடர்ச்சியான செயலமைப்பு தமிழில் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது; ‘கீழே’ திசைநுணுக்கத்தையும் ‘அங்கிருந்து’ அனுப்பிச் செல்லும் நகர்வையும் தெளிவாக்குகின்றன.
