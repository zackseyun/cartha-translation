  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: ta
  text: பேதுரு எல்லா இடங்களிலும் சுற்றிப் பயணம் செய்துகொண்டிருந்தபோது[a], மேலும் லித்தாவில் வாழ்ந்த பரிசுத்தவான்களிடம் கீழே இறங்கிச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேர்சொல்: “அனைவரின்/அனைத்தின் வழியாகக் கடந்துசென்றபோது.” இது பல இடங்களையோ, அங்கிருந்த விசுவாசக் குழுக்களையோ குறிக்கலாம்.'
    reason: διὰ πάντων என்பதன் குறிப்பிடம் கிரேக்கத்தில் வெளிப்படையாக இல்லை; பிரதான உரை ‘இடங்கள்’ என்ற இயல்பான வாசிப்பைப் பயன்படுத்தினாலும், அடிக்குறிப்பு மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: எல்லா இடங்களிலும் சுற்றிப் பயணம் செய்துகொண்டிருந்தபோது
  rationale: διέρχομαι என்பது பல இடங்களைக் கடந்து செல்வதை அல்லது சுற்றிப் பயணம் செய்வதைக் குறிக்கிறது. πάντων என்பதன் குறிப்பிடம் வெளிப்படையாகச் சொல்லப்படாததால், தமிழில் இயல்பாகப் புரிய ‘இடங்களிலும்’ எனக் குறிக்கப்பட்டு, அதன் மூலமொழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατελθεῖν καὶ πρὸς
  choice: …இடமும் சென்றார்
  rationale: κατελθεῖν என்பதன் சொற்பொருள் ‘கீழே சென்றார்’ என்றாலும், இங்கு பயணத்தை விவரிக்கும் இயல்பான தமிழில் ‘சென்றார்’ என்பது பொருத்தமானது; καί இங்குள்ள ‘கூட/மேலும்’ என்ற நுணுக்கம் ‘இடமும்’ என்பதில் பாதுகாக்கப்படுகிறது.
- source_word: τοὺς ἁγίους
  choice: பரிசுத்தவான்கள்
  rationale: ஆதித் திருச்சபைச் சூழலில் கிறிஸ்துவைச் சேர்ந்த விசுவாசிகளைச் சுட்டும் வழக்குச் சொல்; ‘புனிதர்கள்’ என்று பிற்காலச் சிறப்புப் பட்டமாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: Λύδδα
  choice: லித்தா
  rationale: கிரேக்க இடப்பெயரின் ஒலிப்புக்கு ஏற்ப தமிழாக்கம் செய்யப்பட்டுள்ளது.
theological_decisions:
- issue: ‘பரிசுத்தவான்கள்’ என்போரின் அடையாளம்
  choice: பொதுவாக அங்கிருந்த விசுவாசிகளைக் குறிக்கும் மொழியைப் பயன்படுத்துதல்
  alternative: தனிச்சிறப்புடைய சில ‘புனிதர்கள்’ என்று வழங்குதல்
  rationale: οἱ ἅγιοι என்பது அப்போஸ்தலர் பணிகள் நூலில் விசுவாசிகளுக்கான சமூகப் பெயராக வருகிறது; பிற்காலத்தில் உருவான எந்தச் சிறப்புப் பதவியையும் வசனத்திற்குள் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. கதையோட்டத்தைத் தொடங்கும் δέ தனியாக ‘இப்போது’ என மொழிபெயர்க்கப்படவில்லை. ‘சென்றார்’ என்பது தேவையற்ற நிலவியல் வலியுறுத்தலைத் தவிர்க்கிறது; ‘இடமும்’ என்பது லித்தாவுக்குச் சென்றதும் அவரது விரிவான பயணத்தின் ஒரு பகுதியாக இருந்ததை வெளிப்படுத்துகிறது.
