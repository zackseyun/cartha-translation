id: ACT.9.34
reference: Acts 9:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: ta
  text: பேதுரு அவனிடம், “ஐனேயாவே, மெசியாவாகிய இயேசு[a] உன்னைக் குணமாக்குகிறார். எழுந்து, உன் படுக்கையை நீயே விரித்துக்கொள்[b]” என்றார். உடனே அவன் எழுந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு கிறிஸ்து.” கிரேக்கச் சொல்லான Χριστός ஒரு பட்டமாக ‘மெசியா’ என்றும், மரபாக ‘கிறிஸ்து’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உனக்காக உன் படுக்கையை விரித்துக்கொள்.”
    reason: literal_rendering
lexical_decisions:
- source_word: ἰᾶταί
  choice: குணமாக்குகிறார்
  rationale: நிகழ்கால வினை வடிவத்தையும், பேதுருவின் அறிவிப்பில் உள்ள உடனடி செயற்பாட்டு வலிமையையும் காக்கிறது; ‘குணமாக்கிவிட்டார்’ என்று நிறைவுற்ற காலமாக மிகையாக விளக்கவில்லை.
- source_word: Χριστός
  choice: மெசியாவாகிய
  rationale: இங்கு Χριστός ஒரு பெயரின் பகுதியாக மட்டும் அல்லாமல் இயேசுவின் பட்டமாகச் செயல்படுகிறது. ‘மெசியாவாகிய இயேசு’ என்பது அதன் பட்டத்தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀνάστηθι
  choice: எழுந்து
  rationale: படுக்கையில் இருந்த ஒருவருக்குக் கொடுக்கப்படும் நேரடியான கட்டளையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: στρῶσον σεαυτῷ
  choice: உன் படுக்கையை நீயே ஆயத்தப்படுத்திக்கொள்
  rationale: στρώννυμι என்பதன் படுக்கையை விரித்தல் அல்லது ஆயத்தப்படுத்துதல் என்ற பொருளையும், σεαυτῷ வலியுறுத்தும் தன்செயலாற்றலையும் தெளிவாகக் காட்டுகிறது.
- source_word: εὐθέως
  choice: உடனே
  rationale: தாமதமற்ற நிகழ்வைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀνέστη
  choice: அவன் எழுந்தான்
  rationale: முந்தைய கட்டளையுடன் சொல் தொடர்பைக் காத்து, அதன் உடனடி விளைவை விவரிக்கிறது.
- source_word: Αἰνέα
  choice: ஐனேயாவே
  rationale: தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்து, நேரடி அழைப்புக்குரிய ‘-வே’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: குணமாக்கும் அறிவிப்பில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவாகிய இயேசு
  alternative: கிறிஸ்துவாகிய இயேசு
  rationale: Χριστός என்பதன் பட்டத்தன்மையையும் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற மெசியா சார்ந்த கருத்தையும் வெளிப்படையாகக் காக்கிறது; இதை ஒரு நிலையான இரண்டாம் பெயராக மாற்றவில்லை.
- issue: ἰᾶταί என்ற நிகழ்கால வடிவத்தின் காலநிலை
  choice: உன்னைக் குணமாக்குகிறார்
  alternative: உன்னைக் குணமாக்கிவிட்டார்
  rationale: கிரேக்க நிகழ்காலத்தைப் பேதுருவின் செயற்பாட்டு அறிவிப்பாகவே வைக்கிறது; குணமாகுதல் ஏற்கெனவே முழுமையடைந்ததாக உரை வெளிப்படையாகச் சொல்லாததை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் நேரடியும் கண்ணியமுமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்’ போன்ற உயர்திணை வடிவம் இங்கு சேர்க்கப்படவில்லை; மூலத்தில் உள்ள ஒருமை நேரடி கட்டளையின் எளிமை காக்கப்பட்டுள்ளது. ‘ஆயத்தப்படுத்திக்கொள்’ என்பது படுக்கையை விரித்தல்/ஒழுங்குபடுத்துதல் என்ற மூலச் சொல்லின் பரப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
