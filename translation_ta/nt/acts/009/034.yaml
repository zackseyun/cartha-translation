revisions:
- from: பேதுரு அவனிடம், “ஐனேயாவே, மெசியாவாகிய இயேசு[a] உன்னைக் குணமாக்குகிறார். எழுந்து, உன் படுக்கையை நீயே ஆயத்தப்படுத்திக்கொள்[b]” என்றார். உடனே அவன் எழுந்தான்.
  to: பேதுரு அவனிடம், “ஐனேயாவே, மெசியாவாகிய இயேசு[a] உன்னைக் குணமாக்குகிறார். எழுந்து, உன் படுக்கையை நீயே விரித்துக்கொள்[b]” என்றார். உடனே அவன் எழுந்தான்.
  rationale: The revision narrows the bedding command to its concrete lexical sense, ‘spread/arrange your bed,’ while preserving the personal-agency emphasis of σεαυτῷ through “நீயே.” It also aligns footnote a’s Tamil alternative precisely with the alternative “Jesus Christ.”
  reviewer_model: gpt-5.6-terra
