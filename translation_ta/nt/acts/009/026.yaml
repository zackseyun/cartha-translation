source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: ta
  text: அவர் எருசலேமுக்கு வந்தபோது, சீடர்களுடன் சேர்ந்துகொள்ள[a] முயன்றார். ஆனால் அவர் ஒரு சீடர் என்பதை நம்பாததால், அவர்கள் எல்லாரும் அவருக்குப் பயந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன்னைச் சீடர்களுடன் இணைத்துக்கொள்ள.’
    reason: κολλᾶσθαι என்பதிலுள்ள ‘ஒட்டிக்கொள்/தன்னை இணைத்துக்கொள்’ என்ற வலுவான நெருக்கப் பொருளை மாற்று மொழிபெயர்ப்பாகக் காட்டுகிறது.
lexical_decisions:
- source_word: Παραγενόμενος
  choice: வந்தபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மைச் செயலுக்கு முந்திய சூழலைக் காட்டுகிறது. ‘வந்தபோது’ என்பது அதன் காலத் தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: δὲ
  choice: வாக்கிய ஓட்டத்தில் தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சிக் குறியீடு. ‘வந்தபோது’ என்று தொடங்கும் தமிழ் வாக்கியத்தில் தனி இணைப்புச்சொல் இல்லாமலேயே அந்தத் தொடர்ச்சி இயல்பாக வெளிப்படுகிறது.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமுக்கு
  rationale: நகரத்தை நோக்கிய இயக்கத்தைத் தரும் εἰς என்பதற்கு இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: ἐπείραζεν
  choice: முயன்றார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்து அல்லது செயல்பாட்டில் இருந்த முயற்சியைக் குறிக்கிறது. தமிழ் சூழலில் ‘முயன்றார்’ இதை இயல்பாகத் தெரிவிக்கிறது; ‘சோதித்தார்’ என்ற பொருள் இங்கு பொருந்தாது.
- source_word: κολλᾶσθαι
  choice: சீடர்களுடன் சேர்ந்துகொள்ள
  rationale: κολλάομαι என்பது ஒட்டிக்கொள், இணைந்துகொள், நெருக்கமாகச் சேர்ந்துகொள் என்ற பொருள்களைக் கொண்டது. இங்கு சீடர்களின் கூட்டத்துடன் தொடர்புகொண்டு ஏற்றுக்கொள்ளப்பட முயல்வதைக் ‘சேர்ந்துகொள்ள’ தெளிவாகச் சொல்கிறது; பிற்கால நிறுவன உறுப்பினர் முறையை இது புகுத்தாது.
- source_word: τοῖς μαθηταῖς
  choice: சீடர்களுடன்
  rationale: எருசலேமிலிருந்த அறியப்பட்ட சீடர் குழுவைக் குறிக்கிறது. உடனிணைவைத் தமிழில் ‘உடன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: ஆனால் ... அவர்கள் எல்லாரும் அவருக்குப் பயந்தார்கள்
  rationale: முந்தைய முயற்சிக்கும் சீடர்களின் எதிர்வினைக்கும் இடையிலுள்ள கருத்து மாறுபாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது. πάντες என்பதன் முழுமையை ‘எல்லாரும்’ காக்கிறது.
- source_word: μὴ πιστεύοντες
  choice: நம்பாததால்
  rationale: எதிர்மறைப் பங்கேற்புவினை அவர்களுடைய பயத்திற்கான காரணத்தைக் காட்டுகிறது. காரணத் தொடர்பைத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ὅτι ἐστὶν μαθητής
  choice: அவர் ஒரு சீடர் என்பதை
  rationale: ὅτι அறிமுகப்படுத்தும் கருத்தை பெயராக்கப்பட்ட உட்பிரிவாகத் தமிழ் இயல்பில் தருகிறது. ‘என்பதை’ வடிவம் கிரேக்க நிகழ்காலத்தைத் தேவையின்றி இறந்தகாலமாக மாற்றாமல், அவர் சீடர் என்ற கூற்றை அப்படியே வைத்திருக்கிறது.
- source_word: μαθητής
  choice: சீடர்
  rationale: இயேசுவைப் பின்பற்றிக் கற்றுக்கொள்பவரைக் குறிக்கும் அப்போஸ்தலர் நடபடிகளில் நிலையான, துல்லியமான தமிழ் சொல்.
theological_decisions:
- issue: எருசலேம் விசுவாசிகளுடன் சவுல் ஏற்படுத்த முயன்ற உறவின் தன்மை
  choice: ‘சீடர்களுடன் சேர்ந்துகொள்ள’
  alternative: ‘தன்னைச் சீடர்களுடன் இணைத்துக்கொள்ள’ அல்லது ‘சீடர்களுடன் நெருங்கிப் பழக’
  rationale: வசனம் அவர் சீடர்களிடையே ஏற்றுக்கொள்ளப்பட்டு அவர்களுடன் தொடர்புகொள்ள முயன்றதைச் சொல்கிறது; முறையான திருச்சபை உறுப்பினர் சடங்கையோ பிற்கால அமைப்பு வகையையோ குறிப்பிடவில்லை. ஆகவே சமூக மற்றும் குழு சார்ந்த பொருள் காக்கப்பட்டு, நிறுவனப் பொருள் புகுத்தப்படவில்லை.
- issue: சவுல் சீடர் என்ற கூற்றின் காலநிலை
  choice: ‘அவர் ஒரு சீடர் என்பதை’ என்று காலத்தை வெளிப்படையாக மாற்றாமல் மொழிபெயர்த்தல்
  alternative: ‘அவர் ஒரு சீடராக இருந்தார் என்று’
  rationale: கிரேக்கத்தில் ἐστίν நிகழ்காலத்தில் உள்ளது. தமிழ் பெயராக்கப்பட்ட உட்பிரிவு அந்தக் கூற்றை இயல்பாகவும் காலமாற்றமின்றியும் காக்கிறது; சீடத்துவத்தின் நிலையை மொழிபெயர்ப்பாளர் கூடுதலாக விளக்கித் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. சவுலைக் குறிக்க மரியாதை ஒருமை ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; கருத்துத் தொடர்பு ‘ஆனால்’ மற்றும் ‘நம்பாததால்’ மூலம் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘சேர்ந்துகொள்ள’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
