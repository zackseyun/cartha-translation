base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: ta
  text: அவர் கிரேக்க மொழி பேசும் யூதர்களுடன்[a] பேசவும் விவாதிக்கவும் செய்து வந்தார். ஆனால் அவர்களோ அவரைக் கொல்ல முயன்று கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூலமொழியில், “ஹெலனிஸ்தர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλει
  choice: பேசிக்கொண்டும்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நடந்த செயலைக் குறிக்கிறது; தமிழில் ‘பேசிக்கொண்டும் ... இருந்தார்’ என்பது அந்த நீடித்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τε καὶ
  choice: -க்கொண்டும் ... -க்கொண்டும்
  rationale: இரண்டு ஒருங்கிணைந்த செயல்களையும் இயல்பான தமிழில் இணைக்க இந்த அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: συνεζήτει
  choice: விவாதித்துக்கொண்டும்
  rationale: இச்சொல் இங்கு நடுநிலையான கலந்துரையாடலைவிட கருத்துகளை எதிர்கொண்டு விவாதிப்பதைக் குறிக்கிறது; ‘விவாதித்தல்’ தேவையற்ற கடுமையைச் சேர்க்காமல் அந்த அர்த்தத்தைத் தருகிறது.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: கிரேக்க மொழி பேசும் யூதர்களுடன்
  rationale: விவாதத்தைக் குறிக்கும் வினையுடன் πρός பரஸ்பரத் தொடர்பைக் காட்டுவதால் ‘உடன்’ இயல்பானது. அப்போஸ்தலர் பணிகளில் Ἑλληνισταί என்பது பொதுவாகப் புறவினத்தாரை அல்ல, கிரேக்க மொழி பேசும் யூதர்களைக் குறிக்கிறது.
- source_word: οἱ δὲ
  choice: ஆனால் அவர்களோ
  rationale: δέ சவுலின் செயலுக்கும் அவர்களுடைய பகைமையான எதிர்வினைக்கும் இடையிலான முரண்பாட்டைக் காட்டுகிறது; ‘அவர்களோ’ அந்தத் திருப்பத்தைத் தெளிவுபடுத்துகிறது.
- source_word: ἐπεχείρουν
  choice: முயன்றுகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை, கொலை செய்ய அவர்கள் தொடர்ந்து முயன்றதை வெளிப்படுத்துகிறது.
- source_word: ἀνελεῖν αὐτόν
  choice: அவரைக் கொல்ல
  rationale: இச்சூழலில் ἀναιρέω என்பதன் நேரடியான பொருள் ‘கொல்லுதல்’; தெளிவான நவீன தமிழில் அது அப்படியே தரப்பட்டுள்ளது.
theological_decisions:
- issue: Ἑλληνιστάς என்பவர்களின் அடையாளம்
  choice: கிரேக்க மொழி பேசும் யூதர்கள்
  alternative: ஹெலனிஸ்தர்கள்; கிரேக்கர்கள்
  rationale: அப்போஸ்தலர் பணிகள் 6:1-இல் காணப்படும் சமூக-மொழியியல் வேறுபாட்டின் அடிப்படையில், இச்சொல் கிரேக்க மொழி பேசும் யூதர்களைக் குறிக்கிறது. ‘கிரேக்கர்கள்’ என்று மொழிபெயர்த்தால் அவர்கள் புறவினத்தார் என்ற எண்ணத்தைத் தவறாக ஏற்படுத்தக்கூடும்; விளக்கமான மொழிபெயர்ப்பு அடையாளத்தைத் தெளிவாக்குகிறது, மூலச் சிறப்புப்பெயர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரண்டு இறந்தகாலத் தொடர்நிலை வினைகளின் நீடித்த தன்மையும் பாதுகாக்கப்பட்டுள்ளது; அரிதான ‘ஹெலனிஸ்தர்கள்’ என்ற பெயருக்குப் பதிலாக அதன் பொருள் முதன்மை உரையில் தெளிவாகத் தரப்பட்டு, மூலச் சொல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
