source:
  edition: SBLGNT
  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: ta
  text: லித்தாவிலும் சாரோன் பகுதியிலும் வாழ்ந்த அனைவரும் அவனைக் கண்டார்கள்; அவர்கள் ஆண்டவரிடம் திரும்பினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘ஆண்டவரிடம் திரும்பினார்கள்’ என்பதை ‘ஆண்டவரை நோக்கித் திரும்பினார்கள்’ என்றும், ‘ஆண்டவரிடம் திரும்பிவந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: கண்டார்கள்
  rationale: ὁράω என்பதன் இறந்தகால வடிவம் இங்கு ஐனேயா குணமடைந்த பின்பு மக்கள் அவனைக் கண்டதை நேரடியாகக் குறிக்கிறது.
- source_word: πάντες οἱ κατοικοῦντες
  choice: வாழ்ந்த அனைவரும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் κατοικοῦντες என்ற பங்கேற்புவினையின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: Λύδδα
  choice: லித்தா
  rationale: இந்த இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: τὸν Σαρῶνα
  choice: சாரோன் பகுதி
  rationale: Σαρών என்பது சாரோன் எனப்படும் நிலப்பகுதியைக் குறிக்கிறது. கிரேக்கச் சொல்லுக்கு முன் வரும் சுட்டைத் தமிழில் தனியே காட்ட வேண்டியதில்லை; ‘பகுதி’ என்பது பெயரின் புவியியல் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட மக்கள் செய்த அடுத்த செயலைத் தெளிவாகத் தொடர்கிறது; கிரேக்க உறவுப்பெயரின் தொடர்பைத் தமிழில் இயல்பான தனி வாக்கியமாக வழங்குகிறது.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: ஆண்டவரிடம் திரும்பினார்கள்
  rationale: மனமாற்றம் மற்றும் விசுவாசத்துடன் ஆண்டவரை நோக்கித் திரும்பும் கருத்தைப் பாதுகாக்கிறது; ‘மதம் மாறினார்கள்’ போன்ற கூடுதல் கோட்பாட்டு விளக்கத்தைத் திணிப்பதில்லை.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டில் κύριος என்ற பட்டத்திற்குரிய இயல்பான தமிழ் இணை; கிரேக்கத்தில் இல்லாத ‘இயேசு’ என்ற பெயரை இங்கு சேர்க்கவில்லை.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பவர் யார்?
  choice: மூலத்தில் உள்ளபடி ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ஆண்டவராகிய இயேசு
  rationale: உடனடிச் சூழல் உயிர்த்தெழுந்த இயேசுவைக் குறிக்கிறது; எனினும் கிரேக்க உரையில் τὸν κύριον என்று மட்டுமே இருப்பதால், வெளிப்படையாக இல்லாத பெயர் சேர்க்கப்படவில்லை.
- issue: ἐπέστρεψαν என்பதன் பொருள் வலிமை
  choice: ‘திரும்பினார்கள்’ என்று வழங்கப்பட்டது.
  alternative: மனந்திரும்பி ஆண்டவரை ஏற்றுக்கொண்டார்கள் / மதம் மாறினார்கள்
  rationale: இச்சொல் மனமாற்றத்துடனும் விசுவாசத்துடனும் ஆண்டவரை நோக்கித் திரும்புவதைக் குறிக்கலாம். தேர்ந்த சொற்றொடர் அந்தப் பொருளைத் தக்கவைத்தபடியே குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரண்டு இடப்பெயர்களுக்கும் பொருந்துமாறு ‘வாழ்ந்த அனைவரும்’ அமைக்கப்பட்டுள்ளது; οἵτινες தொடங்கும் தொடரை அரைப்புள்ளிக்குப் பின் ‘அவர்கள்’ என்று கொடுத்தது தமிழில் இயல்பான கதையோட்டத்தை உருவாக்குகிறது.
