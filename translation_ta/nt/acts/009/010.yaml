revisions:
- from: தமஸ்குவில் அனனியா என்ற பெயருடைய ஒரு சீடர் இருந்தார். ஆண்டவர் ஒரு தரிசனத்தில் அவரிடம், “அனனியாவே!” என்றார். அதற்கு அவர், “இதோ, ஆண்டவரே, அடியேன்!” என்றார்.
  to: தமஸ்குவில் அனனியா என்ற பெயருடைய ஒரு சீடர் இருந்தார். ஆண்டவர் ஒரு தரிசனத்தில் அவரிடம், “அனனியாவே!” என்றார். அதற்கு அவர், “இதோ, நான் இருக்கிறேன், ஆண்டவரே!” என்றார்.
  rationale: The revision replaces “இதோ, ஆண்டவரே, அடியேன்” with “இதோ, நான் இருக்கிறேன், ஆண்டவரே,” which represents Ἰδοὺ ἐγώ as an idiomatic declaration of presence while retaining the address “ஆண்டவரே.” No footnote is required, since the rendering is direct and the referent is left at the same level of explicitness as the Greek.
  reviewer_model: gpt-5.6-terra
