id: ACT.9.10
reference: Acts 9:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: ta
  text: தமஸ்குவில் அனனியா என்ற பெயருடைய ஒரு சீடர் இருந்தார். ஆண்டவர் ஒரு தரிசனத்தில் அவரிடம், “அனனியாவே!” என்றார். அதற்கு அவர், “இதோ, நான் இருக்கிறேன், ஆண்டவரே!” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: இருந்தார்
  rationale: ἦν ஒரு புதிய கதைமாந்தரை அறிமுகப்படுத்துகிறது; δέ மென்மையான கதைத் திருப்பைக் குறிக்கிறது. தமிழில் தனியான இணைப்புச்சொல் இன்றியே இயல்பான புதிய வாக்கியத் தொடக்கம் இதன் பணியைச் செய்கிறது.
- source_word: τις μαθητὴς
  choice: ஒரு சீடர்
  rationale: τις இங்கு முன்பு அறிமுகமில்லாத ஒருவரைக் குறிக்கும் இடைநிலைச் சொல்; ‘ஒரு சீடர்’ என்பது இயல்பாக அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: ἐν Δαμασκῷ
  choice: தமஸ்குவில்
  rationale: ἐν உடன் வரும் இடவேற்றுமையின் நேரான இடப்பொருள்.
- source_word: ὀνόματι Ἁνανίας
  choice: அனனியா என்ற பெயருடைய
  rationale: ὀνόματι என்னும் பெயரிடும் மரபுத்தொடரைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐν ὁράματι
  choice: ஒரு தரிசனத்தில்
  rationale: ஆண்டவர் அனனியாவிடம் பேசிய நிகழ்வுமுறையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான மரியாதைமிக்க வழக்கமான தமிழ் வேதாகமச் சொல்; இச்சூழலில் உயிர்த்தெழுந்த இயேசுவைக் குறிக்கிறது.
- source_word: εἶπεν πρὸς αὐτόν
  choice: அவரிடம் … என்றார்
  rationale: λέγω + πρός அமைப்பின் நேரடியான உரையாடல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: Ἁνανία
  choice: அனனியாவே
  rationale: கிரேக்க விளிவேற்றுமையைத் தமிழ் அழைப்புருபான ‘-வே’ மூலம் வெளிப்படுத்துகிறது.
- source_word: Ἰδοὺ ἐγώ
  choice: இதோ, … அடியேன்
  rationale: இது கவனம், பணிவு, ஆயத்தம் ஆகியவற்றை வெளிப்படுத்தும் மரபான பதில். ‘இதோ, அடியேன்’ என்பது அதன் கூறமைப்பையும் உரையாடல் வலிமையையும் தக்கவைக்கிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: தரிசனத்தில் பேசும் ὁ κύριος என்பவருக்கே அளிக்கப்படும் விளிவேற்றுமை அழைப்பு; இங்கு ‘ஐயா’ என்பதைவிட ‘ஆண்டவரே’ சூழலுக்குப் பொருத்தமானது.
theological_decisions:
- issue: தரிசனத்தில் ὁ κύριος / κύριε என்பவற்றின் சுட்டுப்பொருள்
  choice: இரண்டையும் ‘ஆண்டவர் / ஆண்டவரே’ என்று மொழிபெயர்த்து, உயிர்த்தெழுந்த இயேசுவைக் குறிக்க விடுதல்
  alternative: பொதுவான தெய்வீக அழைப்பாகவோ ‘ஐயா’ என்றோ மொழிபெயர்த்தல்
  rationale: அப்போஸ்தலர் 9-ன் தொடர்ச்சியில் பேசுபவர் உயிர்த்தெழுந்த இயேசு என்பது தெளிவாகிறது. உரையில் இல்லாத பெயரைச் சேர்க்காமல் கிறிஸ்துவைச் சார்ந்த வலிமையை ‘ஆண்டவர்’ தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ். ‘சீடர்’, ‘ஆண்டவர்’, ‘தரிசனம்’ ஆகியவை பொதுவாகப் புரியக்கூடிய வேதாகமச் சொற்கள். அனனியாவின் பதிலில் ‘அடியேன்’ இயல்பான பணிவையும் ஆயத்தத்தையும் வெளிப்படுத்துகிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த விரிவாக்கம் தவிர்க்கப்பட்டுள்ளது.
