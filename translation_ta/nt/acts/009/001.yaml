  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: ta
  text: ஆனால் சவுல், ஆண்டவருடைய சீடர்களுக்கு எதிராக இன்னும் அச்சுறுத்தலும் கொலைவெறியும் நிறைந்தவனாய், தலைமை ஆசாரியரிடம் சென்று,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து சவுலைப் பற்றிய கதை மீண்டும் தொடங்குவதை மென்மையான மாறுபாட்டுடன் காட்டுகிறது.
- source_word: ἔτι
  choice: இன்னும்
  rationale: சவுலின் பகைமை தொடர்ந்து நீடித்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐμπνέων
  choice: சுவாசித்துக்கொண்டே
  rationale: அச்சுறுத்தலும் கொலையும் சவுலின் மூச்சைப் போல அவனை முழுமையாக ஆட்கொண்டிருந்தன என்ற மூலத்தின் வலுவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἀπειλῆς
  choice: அச்சுறுத்தலையும்
  rationale: பகைமையான மிரட்டலைக் குறிக்கும் பெயர்ச்சொல்; இணைப்பு அமைப்புக்கேற்ப வேற்றுமை உருபுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: φόνου
  choice: கொலையையும்
  rationale: φόνος கொலை அல்லது உயிர்க்கொலையைக் குறிக்கிறது. ‘கொலை’ மூலச்சொல்லின் அறச்சார்ந்த தீவிரத்தை நேரடியாகத் தருகிறது; ‘படுகொலை’ சாத்தியமான மாற்றாக அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: εἰς τοὺς μαθητὰς
  choice: சீடர்களுக்கு எதிராக
  rationale: பகைமைச் சூழலில் εἰς குறிக்கும் எதிரான நோக்கத்தையும் திசையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μαθητὰς
  choice: சீடர்கள்
  rationale: அப்போஸ்தலர் நூலின் சூழலில் இயேசுவைப் பின்பற்றுவோரைக் குறிக்கும் துல்லியமான, வழக்கமான சொல்.
- source_word: τοῦ κυρίου
  choice: ஆண்டவருடைய
  rationale: சீடர்கள் ஆண்டவருக்குரியவர்கள் என்ற இயல்பான உடைமைத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: προσελθὼν
  choice: அணுகி
  rationale: அடுத்த வசனத்தின் முதன்மைச் செயலுக்கு முன் சவுல் தலைமைக் குருவிடம் சென்றதைத் தொடர்நிலை வினையெச்சமாகப் பாதுகாக்கிறது.
- source_word: τῷ ἀρχιερεῖ
  choice: தலைமைக் குருவை
  rationale: ἀρχιερεύς என்பதற்கான தெளிவான, நிலையான தமிழ் பதம்; ‘அணுகி’ என்ற வினைக்கு இயல்பான செயப்படுபொருள் அமைப்பு பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: τοῦ κυρίου என்பதில் κύριος-ஐ மொழிபெயர்த்தல்
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இச்சூழலில் இது இயேசுவைக் குறிக்கும் மரியாதைமிக்க பட்டமாக உள்ளது. ‘ஆண்டவர்’ தமிழ் வேதாகம நடையிலும் நவீன கிறிஸ்தவப் பயன்பாட்டிலும் தெளிவானது; தேவையற்ற தனிப்பிரிவுச் சார்பைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியக்கூடிய, கண்ணியமான தமிழ் நடை. ‘சுவாசித்துக்கொண்டே’ என்பது தமிழில் சற்றே தீவிரமான உருவகமாக இருந்தாலும், மூலத்தின் உயிரோட்டமான படிமத்தை திட்டமிட்டு பாதுகாக்கிறது. வசனம் அடுத்த வசனத்தில் தொடரும் தொடரியல் அமைப்பைக் கொண்டதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
