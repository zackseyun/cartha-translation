reference: Acts 9:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: ta
  text: சவுல் தரையிலிருந்து எழுந்தார். அவருடைய கண்கள் திறந்திருந்தபோதிலும்[a], அவரால் எதையும் பார்க்க முடியவில்லை. ஆகவே, அவர்கள் அவரைக் கைப்பிடித்து நடத்தி, தமஸ்குவுக்குள் அழைத்துச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “அவருடைய கண்கள் திறக்கப்பட்டிருந்தும், அவர் எதையும் பார்க்கவில்லை.” கண்கள் திறந்திருந்தும் அவரால் பார்க்க முடியாதிருந்த முரணை கிரேக்க வாக்கிய அமைப்பு சிறப்பாக எடுத்துக்காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: எழுந்தார்
  rationale: இங்கு ἐγείρω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் கதைச்சூழலில் தன்வினைப் பொருளில் வந்து, தரையில் விழுந்திருந்த சவுல் எழுந்ததைக் குறிக்கிறது.
- source_word: ἀπὸ τῆς γῆς
  choice: தரையிலிருந்து
  rationale: γῆ இச்சூழலில் சவுல் விழுந்திருந்த தரையைக் குறிக்கிறது; பூமியையோ ஒரு நாட்டையோ அல்ல.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: அவருடைய கண்கள் திறந்திருந்தபோதிலும்
  rationale: இந்த genitive absolute உடனிகழ்வைக் குறிக்கிறது; திறந்த கண்களுக்கும் பார்க்க இயலாத நிலைக்கும் இடையிலான முரணைச் சூழல் வலியுறுத்துவதால், விட்டுக்கொடுப்பு நிழற்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐδὲν ἔβλεπεν
  choice: அவரால் எதையும் பார்க்க முடியவில்லை
  rationale: முற்றிலும் பார்வையற்றிருந்த நிலையைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது; ‘எதையும் காணவில்லை’ என்பதும் சாத்தியம்.
- source_word: χειραγωγοῦντες
  choice: அவரைக் கைப்பிடித்து நடத்தி
  rationale: χειραγωγέω என்பது வழிகாட்டுதல் தேவைப்படுகிற ஒருவரைக் கையால் பிடித்து நடத்துவதைத் துல்லியமாகக் குறிக்கிறது; மூலத்தின் தெளிவான உடல்சார் காட்சியைப் பேணுகிறது.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: தமஸ்குவுக்குள் அழைத்துச் சென்றார்கள்
  rationale: εἰσάγω நகருக்குள் கொண்டுசென்ற இயக்கத்தைக் குறிக்கிறது. முந்தைய சொற்றொடர் நடத்திச் சென்ற முறையை ஏற்கெனவே கூறுவதால், இத்தேர்வு தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- source_word: Σαῦλος
  choice: சவுல்
  rationale: தமிழில் நிலைபெற்றுள்ள பெயரொலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: Δαμασκόν
  choice: தமஸ்கு
  rationale: தமிழில் பரவலாக நிலைபெற்றுள்ள இடப்பெயர் வடிவம் பயன்படுத்தப்படுகிறது.
