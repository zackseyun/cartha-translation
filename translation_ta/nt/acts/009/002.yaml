  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: ta
  text: அந்த ‘வழியைச்’ சேர்ந்த யாரையாவது—ஆண்களாக இருந்தாலும் பெண்களாக இருந்தாலும்—கண்டால், அவர்களைக் கட்டி எருசலேமுக்குக் கொண்டுவரும் நோக்கத்தில், தமஸ்குவிலுள்ள தொழுகைக்கூடங்களுக்குக் கடிதங்களை அவரிடம் கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: அவரிடம் கேட்டார்
  rationale: αἰτέω என்பதன் வேண்டுதல் சார்ந்த பொருளையும், παρά + ஆறாம் வேற்றுமை கோரிக்கை யாரிடம் வைக்கப்பட்டது என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐπιστολὰς
  choice: கடிதங்கள்
  rationale: சூழலில் அவை அதிகாரம் வழங்கும் கடிதங்களாக இருந்தாலும், கிரேக்கச் சொல் நேரடியாக ‘கடிதங்கள்’ என்றே கூறுவதால் கூடுதல் விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: தமஸ்குவிலுள்ள தொழுகைக்கூடங்களுக்குக்
  rationale: இரு முன்னிடைச்சொல் தொடர்களின் கூட்டு அர்த்தத்தை இயல்பான தமிழில், தமஸ்குவில் அமைந்திருந்த தொழுகைக்கூடங்களுக்கு அனுப்பப்படும் கடிதங்கள் எனத் தெளிவாக்குகிறது.
- source_word: ὅπως ἐάν
  choice: கண்டால் … கொண்டுவருவதற்காக
  rationale: ἐάν தரும் நிபந்தனையையும் ὅπως தரும் நோக்கத்தையும் தனித்தனியாகத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τινας
  choice: யாரையாவது
  rationale: நிபந்தனைச் சூழலில் வரும் காலவரையற்ற பன்மைச் சுட்டை இயல்பான தமிழில் தருகிறது.
- source_word: τῆς ὁδοῦ ὄντας
  choice: அந்த ‘வழியைச்’ சேர்ந்தவர்கள்
  rationale: ஆரம்பக் கிறிஸ்தவ இயக்கத்திற்கான வரலாற்றுப் பெயரான ‘வழி’ என்பதையும், கிரேக்க ஆறாம் வேற்றுமை காட்டும் சார்புறவையும் பாதுகாக்கிறது.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: ஆண்களானாலும் பெண்களானாலும்
  rationale: τε καὶ வெளிப்படையாகக் குறிப்பிடும் இரு பாலரையும் விடாமல், சவுலின் நடவடிக்கை இரு தரப்பினரையும் குறித்தது என்பதைத் தெரிவிக்கிறது.
- source_word: δεδεμένους
  choice: கட்டி
  rationale: δέω என்பதன் கட்டப்பட்ட நிலையை நேரடியாகத் தருகிறது; ‘சங்கிலியால்’ போன்ற மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: ἀγάγῃ εἰς Ἰερουσαλήμ
  choice: எருசலேமுக்குக் கொண்டுவர
  rationale: ἄγω என்பதன் நகர்த்திக் கொண்டுவரும் பொருளையும் εἰς குறிக்கும் இலக்கையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: τῆς ὁδοῦ என்ற ஆரம்பகால இயக்கப் பெயரை மொழிபெயர்த்தல்
  choice: அந்த ‘வழியைச்’ சேர்ந்தவர்கள்
  alternative: அந்த வழியைப் பின்பற்றுகிறவர்கள்
  rationale: ‘வழி’ என்ற வரலாற்றுப் பெயரை அப்படியே வைத்திருப்பதால், அதை வெறும் வாழ்க்கைமுறை அல்லது போதனையைப் பின்பற்றுதல் என்று விளக்கமாகச் சுருக்காமல் மூலத்தின் தனித்துவத்தையும் ஓரளவு தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: ἄνδρας τε καὶ γυναῖκας என்பதில் இரு பாலரும் வெளிப்படையாகக் குறிப்பிடப்படுதல்
  choice: ஆண்களானாலும் பெண்களானாலும்
  alternative: அனைவரையும்
  rationale: சவுல் கைது செய்ய எண்ணியவர்களில் ஆண்களும் பெண்களும் அடங்கினர் என்ற மூலத்தின் வலியுறுத்தலை பொதுப்படையான சொல்லால் மறைக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் நோக்க உறவைத் தெளிவுபடுத்த இரண்டு தமிழ் வாக்கியங்களாக அமைத்தாலும், ‘கடிதங்கள்’ என்பதை மீண்டும் குறிப்பதன் மூலம் தொடர்பு வெளிப்படையாக வைக்கப்பட்டுள்ளது. ‘தொழுகைக்கூடங்கள்’ என்பது யூத συναγωγή-களைச் சுட்டுகிறது; ‘வழி’ வரலாற்றுப் பெயராக மேற்கோள் குறிகளால் அடையாளப்படுத்தப்பட்டுள்ளது.
