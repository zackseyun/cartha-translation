source:
  edition: SBLGNT
  text: εἶπεν δέ· Τίς εἶ, κύριε; ὁ ⸀δέ· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: ta
  text: அவன், “ஆண்டவரே,[a] நீர் யார்?” என்றான். அவர், “நீ துன்புறுத்துகிற இயேசு நானே” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்கத்தில் κύριε என்பது மரியாதையான அழைப்பாகவும் இருக்கலாம்; இந்த வெளிப்பாட்டுச் சூழலில் முதன்மை உரையில் “ஆண்டவரே” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: கேட்டான் / என்றார்
  rationale: λέγω என்பதன் இறந்தகாலக் கதை வடிவம் அடிப்படையில் ‘சொன்னான்’ எனப் பொருள்படும். முதல் உரை கேள்வியாக இருப்பதால் இயல்பான தமிழில் ‘கேட்டான்’ என்றும், பதிலில் ‘என்றார்’ என்றும் சூழலுக்கேற்ப வழங்கப்பட்டது.
- source_word: δέ
  choice: அதற்கு
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் உரையாடலின் அடுத்த நகர்வை இணைக்கிறது. முதல் இடத்தில் தமிழ் நடையில் தனி இணைப்புச்சொல் தேவையில்லை; இரண்டாம் இடத்தில் ‘அதற்கு’ உரையாடல் ஓட்டத்தை இயல்பாகக் காட்டுகிறது.
- source_word: Τίς εἶ
  choice: நீர் யார்?
  rationale: கேள்வியின் நேரடியான பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: κύριε என்பது மரியாதை விளியாகவும் ‘ஆண்டவரே’ என்றும் அமையக்கூடும். வெளிப்பாட்டுச் சூழலும் κύριος என்பதற்கான வழக்கமான வேதாகமத் தமிழும் கருதி ‘ஆண்டவரே’ முதன்மை உரையில் வைக்கப்பட்டது; உண்மையான மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: Ἐγώ εἰμι
  choice: நானே
  rationale: வெளிப்படையாக உள்ள ἐγώ வலியுறுத்தலைத் தமிழின் ‘நானே’ இயல்பாகப் பிரதிபலிக்கிறது; அதற்கு மேலான தெய்வவியல் கருத்தைச் சேர்க்கவில்லை.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்ற பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ὃν σὺ διώκεις
  choice: நீ துன்புறுத்துகிற
  rationale: ὃν என்பது இயேசுவைக் குறிக்கும் தொடர்புப்பெயர்; σὺ என்பதன் வலியுறுத்தல் ‘நீ’ எனத் தெளிவாக வைக்கப்பட்டது. நிகழ்கால διώκεις சவுலின் தொடர்ந்து நடைபெறும் பகைமையான செயலைக் குறிக்கும்; ‘துன்புறுத்துகிற’ என்பது நவீனத் தமிழில் தெளிவான, வழக்கமான வெளிப்பாடு.
theological_decisions:
- issue: பேசுகிறவர் யார் என்று இன்னும் அறியும்முன் சவுல் பயன்படுத்தும் κύριε என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: கிரேக்கச் சொல் மரியாதைமிக்க ‘ஐயா’ என்ற அழைப்பாகவும் இருக்கலாம். ஆயினும் விண்ணக வெளிப்பாட்டுச் சூழலும், உடனே பேசுகிறவர் இயேசு என்று வெளிப்படுவதும் ‘ஆண்டவரே’ என்பதன் கதை-இறையியல் வலிமையைப் பாதுகாக்கின்றன. சவுல் இந்தக் கணத்திலேயே முழுமையான விசுவாச அறிக்கை செய்கிறான் என்று உரை தீர்மானிப்பதில்லை என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. விண்ணகக் குரலிடம் சவுல் பேசுவதால் மரியாதைப் பன்மையான ‘நீர்’ பயன்படுத்தப்பட்டது. ‘நீ துன்புறுத்துகிற இயேசு நானே’ என்ற சொல்வரிசை கிரேக்கத்தின் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
