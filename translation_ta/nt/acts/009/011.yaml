source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: ta
  text: ஆண்டவர் அவனிடம், “எழுந்து, ‘நேர்’ என்று அழைக்கப்படும் தெருவுக்குச் சென்று, யூதாஸின் வீட்டில் தர்சுவைச் சேர்ந்த சவுல் என்னும் ஒருவரைத் தேடு[a]; ஏனெனில், இதோ, அவன் ஜெபித்துக்கொண்டிருக்கிறான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தர்சுவின் சவுல்.” கிரேக்கச் சொல்லான Ταρσέα, சவுல் தர்சு நகரத்தைச் சேர்ந்தவர் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டில் κύριος என்பதற்குரிய இயல்பான, மரியாதைமிக்க தமிழாக்கம். இவ்வசனத்தில் மூல உரை இயேசு என்று பெயரை வெளிப்படையாகச் சேர்க்காததால் ‘ஆண்டவர்’ என்றே வைக்கப்பட்டுள்ளது.
- source_word: Ἀναστὰς πορεύθητι
  choice: நீ எழுந்து ... போ
  rationale: இறந்தகாலப் பங்கேற்புவினையும் அதைத் தொடரும் கட்டளை வினையும் இணைந்து உடனடியாகச் செயலில் இறங்கும்படி கூறுகின்றன; நவீன தமிழில் இயல்பாக ‘எழுந்து ... போ’ என வழங்கப்பட்டுள்ளது.
- source_word: ῥύμην
  choice: தெரு
  rationale: நகருக்குள் உள்ள பாதையைக் குறிக்கும் இச்சொல்லுக்கு பொதுவாகவும் தெளிவாகவும் புரியும் தமிழ்ச் சொல்.
- source_word: τὴν καλουμένην Εὐθεῖαν
  choice: ‘நேர்’ என்று அழைக்கப்படும்
  rationale: Εὐθεῖαν என்பது தெருவின் பெயராகச் செயல்படும் பெயரடை. அதன் பொருளையும் பெயரிடும் அமைப்பையும் தமிழில் பாதுகாக்கிறது.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: யூதாவின் வீட்டில்
  rationale: சவுலைத் தேட வேண்டிய இடத்தை ἐν நேரடியாகக் குறிக்கிறது; ‘வீட்டில்’ என்பது இதற்கு இயல்பான தமிழாக்கம்.
- source_word: ζήτησον
  choice: தேடு
  rationale: ζητέω இங்கு ஒருவரைத் தேடிக் கண்டுபிடிக்க முயல்வதைக் குறிக்கிறது; முடிவை முன்கூட்டியே உறுதிப்படுத்தும் ‘கண்டுபிடி’ என்பதைக் காட்டிலும் ‘தேடு’ துல்லியமானது.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: தர்சு நகரத்தைச் சேர்ந்த சவுல் என்பவனை
  rationale: ὀνόματι பெயரைச் சுட்டுகிறது; Ταρσέα தர்சுவைச் சேர்ந்தவன் என்ற பூர்வீக அல்லது ஊரடையாளத்தைக் குறிக்கிறது. தமிழில் இயல்பான வரிசையில் இரண்டும் வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: ἰδοὺ γὰρ
  choice: ஏனெனில் இதோ
  rationale: γάρ கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ἰδού அடுத்து வருவதற்குக் கவனத்தை ஈர்க்கிறது. இரு உரையாடல் செயல்பாடுகளும் விடுபடாமல் வைக்கப்பட்டுள்ளன.
- source_word: προσεύχεται
  choice: ஜெபித்துக்கொண்டிருக்கிறான்
  rationale: நிகழ்கால வினை இச்சூழலில் சவுல் அப்போது தொடர்ந்து செய்துகொண்டிருக்கும் செயலைக் காட்டுகிறது.
theological_decisions:
- issue: κύριος என்பவர் யார்?
  choice: ஆண்டவர்
  alternative: ஆண்டவராகிய இயேசு
  rationale: உடனடிச் சூழல் பேசுகிறவரை அடையாளப்படுத்தினாலும், இவ்வசனத்தின் கிரேக்க உரையில் κύριος மட்டுமே உள்ளது. ஆகவே வெளிப்படையாக இல்லாத ‘இயேசு’ என்ற பெயர் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘நேர்’ என்பது தெருவின் பெயர் என்பதைத் தெளிவாக்க மேற்கோள் குறிகள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் இல்லாத அடையாளங்களையோ இறையியல் விளக்கங்களையோ முதன்மை உரையில் சேர்க்கவில்லை.
