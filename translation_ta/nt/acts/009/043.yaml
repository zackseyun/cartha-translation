translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தோல் பதனிடுபவர்’ என்பது இன்றைய வாசகருக்குப் புரியும்படி தொழிலின் குறிப்பான பொருளைக் காக்கிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘ஒருவருடன்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
