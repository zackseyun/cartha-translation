base_translation:
  language: en
  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: ta
  text: பேதுரு யோப்பாவில் தோல் பதனிடுபவரான சீமோன் என்ற ஒருவருடன்[a] பல நாட்கள் தங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீமோன் என்ற ஒருவரின் வீட்டில்.” கிரேக்க முன்னிடைச்சொல், ஒருவரின் வீட்டில் தங்குவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: தங்கியிருந்தார்
  rationale: ἐγένετο + infinitive என்ற கிரேக்க மரபுத்தொடரைச் சொற்சொல்லாக மாற்றாமல், தமிழில் இயல்பாக முதன்மை வினையாக அளிக்கிறது. முந்தைய சூழலில் உள்ள பேதுருவே எழுவாய் என்பதைத் தெளிவுபடுத்த அவரது பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல் இன்றி
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் வாக்கிய வரிசையே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துவதால் ‘மேலும்’ அல்லது ‘அப்போது’ என்று சேர்ப்பது தேவையில்லை.
- source_word: ἡμέρας ἱκανὰς
  choice: பல நாட்கள்
  rationale: கால அளவுடன் வரும் ἱκανός என்பது ‘பல’ அல்லது ‘கணிசமான’ என்ற பொருளுடையது; ‘பல நாட்கள்’ துல்லியமும் இயல்பும் கொண்டது.
- source_word: ἐν Ἰόππῃ
  choice: யோப்பாவில்
  rationale: Ἰόππη என்ற இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: παρά τινι Σίμωνι
  choice: சீமோன் என்னும் ஒருவருடன்
  rationale: παρά + dative தங்கியிருந்த நபருடனான தொடர்பையோ அவரது வீட்டிலான தங்குதலையோ குறிக்கலாம். τινι-யின் குறிப்பிடப்படாத தன்மையை ‘ஒருவர்’ காக்கிறது; இடவியல் நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: βυρσεῖ
  choice: தோல் பதனிடுபவரான
  rationale: βυρσεύς விலங்குத் தோல்களைப் பதனிட்டு தோலாக மாற்றும் தொழிலாளியைத் துல்லியமாகக் குறிக்கிறது; பொதுவான ‘தோல் தொழிலாளி’ என்பதைவிட இச்சொற்றொடர் குறிப்பானது.
