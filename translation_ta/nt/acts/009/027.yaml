source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: ta
  text: ஆனால் பர்னபா அவரைப் பற்றிக்கொண்டு அப்போஸ்தலர்களிடம் அழைத்துச் சென்றார். சவுல் வழியில் ஆண்டவரைக் கண்டதையும், ஆண்டவர் சவுலிடம் பேசியதையும், சவுல் தமஸ்குவில் இயேசுவின் பெயரில் துணிவுடன் பேசியதையும் அவர் அவர்களுக்கு விவரித்துச் சொன்னார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος αὐτὸν
  choice: அவரைக் கைகொடுத்துக் கூட்டிக்கொண்டு
  rationale: ἐπιλαμβάνομαι என்பதன் ‘பற்றிக்கொள்/உடன் அழைத்துச் செல்’ என்ற konkreṭமான பொருளையும், சூழலில் பர்னபாவின் ஆதரவான செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வன்முறையான ‘பிடித்துக்கொண்டு’ என்பதைத் தவிர்க்கிறது.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: அப்போஸ்தலர்களிடம் சென்றார்
  rationale: முன்னுள்ள ‘கூட்டிக்கொண்டு’ என்பதுடன் சேர்ந்து ἄγω என்பதன் ‘அழைத்துச் சென்றார்/கொண்டு சென்றார்’ என்ற பொருளை மீளுரையில்லாமல் இயல்பாகத் தருகிறது.
- source_word: διηγήσατο
  choice: விவரித்துச் சொன்னார்
  rationale: இந்த வினை நிகழ்வை எடுத்துரைத்தல் அல்லது விரிவாக விவரித்தல் என்பதைக் குறிக்கிறது; வெறும் ‘சொன்னார்’ என்பதைவிட அதன் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: வழியில்
  rationale: இங்கு ὁδός என்பது தமஸ்குவுக்குச் சென்ற பயணப் பாதையைக் குறிக்கிறது; இயக்கத்தின் பெயரான ‘வழி’ என்பதை அல்ல. ‘வழியில்’ என்பது இயல்பும் தெளிவும் உடையது.
- source_word: εἶδεν τὸν κύριον
  choice: ஆண்டவரைக் கண்டதையும்
  rationale: கிரேக்க இறந்தகால நிகழ்வைத் தமிழின் பெயரெச்சத் தொகை இயல்பாக எடுத்துரைக்கிறது. κύριος என்பதன் கிறிஸ்துவியல் எடையை ‘ஆண்டவர்’ பாதுகாக்கிறது.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: ஆண்டவர் அவரிடம் பேசியதையும்
  rationale: இலக்கணப்படி மறைந்திருக்கும் வாக்கிய எழுவாய் முந்தைய ‘ஆண்டவர்’ என்பதே. தமிழில் குழப்பத்தைத் தவிர்க்க அதை மீண்டும் வெளிப்படையாகக் கூறுகிறது.
- source_word: ἐπαρρησιάσατο
  choice: துணிவுடன் பேசியதையும்
  rationale: παρρησιάζομαι என்பதன் சுதந்திரமாகவும் வெளிப்படையாகவும் துணிவுடனும் பேசுதல் என்ற பொருளைத் தருகிறது; மூலத்தில் இல்லாத குறிப்பான ‘பிரசங்கித்தார்’ என்பதைச் சேர்ப்பதில்லை.
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: இயேசுவின் பெயரில்
  rationale: இயேசுவின் அதிகாரத்துடனும் அவரை அறிக்கையிடும் தொடர்பிலும் பேசுவதைச் சுட்டும் வேதாகமச் சொற்றொடரை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: சவுலின் வழி அனுபவத்தில் ‘ஆண்டவர்’ என்பதன் குறிப்பு
  choice: ‘ஆண்டவர்’ என்பது இயேசுவைக் குறிக்கிறது
  alternative: பொதுவான இறைமைக் குறிப்பாக வாசித்தல்
  rationale: அப்போஸ்தலர் 9-ஆம் அதிகாரத்தின் உடனடிச் சூழலில் சவுல் உயிர்த்தெழுந்த இயேசுவைச் சந்திக்கிறார்; இவ்வசனத்தின் முடிவிலுள்ள ‘இயேசுவின் பெயரில்’ என்பதும் இந்த அடையாளத்தை உறுதிப்படுத்துகிறது. இருப்பினும் மொழிபெயர்ப்பு κύριος என்ற பட்டத்தை ‘ஆண்டவர்’ என்றே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அவர்’ என்ற மரியாதைப் பன்மை சவுலுக்கும் ஆண்டவருக்கும் பயன்படுத்தப்பட்டுள்ளதால், ‘ஆண்டவர்’ என்ற எழுவாய் மீண்டும் கூறப்பட்டு குறிப்பு தெளிவாக்கப்பட்டது. அடிக்குறிப்புகள் தேவையில்லை.
