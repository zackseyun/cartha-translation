revisions:
- from: ஆனால் பர்னபா அவரைக் கைகொடுத்துக் கூட்டிக்கொண்டு அப்போஸ்தலர்களிடம் சென்றார். வழியில் அவர் ஆண்டவரைக் கண்டதையும், ஆண்டவர் அவரிடம் பேசியதையும், தமஸ்குவில் அவர் இயேசுவின் பெயரில் துணிவுடன் பேசியதையும் அவர்களுக்கு விவரித்துச் சொன்னார்.
  to: ஆனால் பர்னபா அவரைப் பற்றிக்கொண்டு அப்போஸ்தலர்களிடம் அழைத்துச் சென்றார். சவுல் வழியில் ஆண்டவரைக் கண்டதையும், ஆண்டவர் சவுலிடம் பேசியதையும், சவுல் தமஸ்குவில் இயேசுவின் பெயரில் துணிவுடன் பேசியதையும் அவர் அவர்களுக்கு விவரித்துச் சொன்னார்.
  rationale: The revision replaces an imprecise Tamil idiom for ἐπιλαβόμενος, explicitly renders Barnabas's bringing Saul to the apostles, and resolves pronoun ambiguity by supplying “சவுல்” in the three reported clauses. It otherwise retains the draft's accurate terminology, sequence, and dignified modern register.
