source:
  edition: SBLGNT
  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: ta
  text: அவருடன் பயணம் செய்த ஆட்கள் பேச்சற்று நின்றுகொண்டிருந்தார்கள். அவர்கள் குரலைக்[a] கேட்டார்கள்; ஆனால் ஒருவரையும் காணவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒலியைக் கேட்டார்கள்.” ‘குரல்’ என்று மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொல் குரலையோ ஒலியையோ குறிக்கலாம்; அப்போஸ்தலர் 22:9-ஐ ஒப்பிடுக.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: ஆட்கள்
  rationale: ἄνδρες இங்கு சவுலுடன் சென்ற ஆண் பயணிகளைக் குறிக்கிறது. δέ மென்மையான தொடர்ச்சி அல்லது மாறுபாட்டைக் காட்டுகிறது; தமிழில் தனியாக ஒரு தொடக்க இணைப்புச்சொல்லைச் சேர்க்காமல் வாக்கிய அமைப்பில் அதன் பணி இயல்பாக வெளிப்படுகிறது.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: அவருடன் பயணம் செய்த
  rationale: συνοδεύω என்பது ஒருவருடன் பயணத்தில் செல்வதைக் குறிக்கிறது. இந்தத் தேர்வு உடன்செல்லுதல் மற்றும் பயணச் சூழல் இரண்டையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: εἱστήκεισαν
  choice: நின்றுகொண்டிருந்தார்கள்
  rationale: ἵστημι என்பதன் இறந்தகால நிறைவு வடிவம் இங்கு தொடர்ந்த நிலையைச் சுட்டுகிறது. ‘நின்றுகொண்டிருந்தார்கள்’ அந்த நிலைப்பொருளை இயல்பாக வெளிப்படுத்துகிறது; அவர்கள் அப்போதுதான் நின்றார்கள் அல்லது நின்றுவிட்டார்கள் என்ற கூடுதல் கருத்தைத் திணிக்கவில்லை.
- source_word: ἐνεοί
  choice: பேச்சற்று
  rationale: ἐνεός பேச இயலாத அல்லது அதிர்ச்சியால் சொற்களின்றி நிற்கும் நிலையைக் குறிக்கலாம். ‘பேச்சற்று’ என்பது வெறும் அமைதியைவிட வலுவானது; அதேவேளையில் காரணத்தை மூலத்தில் இல்லாதபடி விரிவுபடுத்தாது.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: குரலைக் கேட்டார்கள்
  rationale: φωνή என்பதற்கு ‘குரல்’ என்றும் ‘ஒலி/சத்தம்’ என்றும் பொருள் வரலாம். இங்கு முதன்மைப் பொருளான ‘குரல்’ தேர்ந்தெடுக்கப்பட்டு, உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது. μὲν ... δὲ அமைப்பின் மாறுபாடு அடுத்துள்ள ‘ஆனால்’ மூலம் வெளிப்படுகிறது.
- source_word: μηδένα δὲ θεωροῦντες
  choice: ஆனால் ஒருவரையும் காணவில்லை
  rationale: θεωρέω இங்கு கண்களால் காணுதல் அல்லது கவனித்துப் பார்த்தல் என்ற பொருளில் வருகிறது; μηδένα எந்த நபரையும் காணவில்லை என்பதைக் குறிக்கிறது. ‘ஒருவரையும் காணவில்லை’ நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: அப்போஸ்தலர் 9:7 மற்றும் 22:9-இல் சவுலுடன் சென்றவர்கள் கேட்டது பற்றித் தோன்றும் இழுபறி
  choice: φωνή என்பதை முதன்மை உரையில் ‘குரல்’ என்று மொழிபெயர்த்து, இழுபறியைத் தீர்த்துவிடாமல் விடுதல்
  alternative: ‘ஒலி’ அல்லது ‘சத்தம்’ என்று மொழிபெயர்த்து, அவர்கள் ஒலியை மட்டும் உணர்ந்தார்கள் என வேறுபடுத்துதல்
  rationale: φωνή இரு பொருள்களையும் ஏற்கக்கூடியது. ஆனால் ‘ஒலி’ என்பதைத் தேர்ந்தெடுத்து இரு வசனங்களையும் ஒத்திசைப்பது, மூல உரை வெளிப்படையாகக் கூறாத ‘ஒலியைக் கேட்டார்கள், சொல்லைப் புரிந்துகொள்ளவில்லை’ என்ற விளக்கத்தைச் சேர்க்கக்கூடும். ஆகவே ‘குரல்’ முதன்மை உரையில் வைக்கப்பட்டு, ‘ஒலி’ அடிக்குறிப்பில் தரப்படுகிறது; இதனால் சொற்பொருள் தெளிவின்மையும் இரு பகுதிகளுக்கிடையேயான இறையியல் இழுபறியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பேச்சற்று’ அதிர்ச்சியை வெளிப்படையாகச் சேர்க்காமல் ἐνεοί என்பதன் வலிமையைப் பாதுகாக்கிறது. இரண்டு குறும் வாக்கியங்களும் μὲν ... δὲ மாறுபாட்டைத் தெளிவாக எடுத்துரைக்கின்றன.
