  to: அவன் மீண்டும் பார்வை பெறும்படி, அனனியா என்னும் ஒரு மனிதன் உள்ளே வந்து அவன் மேல் கைகளை வைப்பதைத் தரிசனத்தில் கண்டிருக்கிறான்[a][b].
