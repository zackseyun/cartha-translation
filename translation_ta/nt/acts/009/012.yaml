  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: ta
  text: அவன் மீண்டும் பார்வை பெறும்படி, அனனியா என்னும் ஒரு மனிதன் உள்ளே வந்து அவன் மேல் கைகளை வைப்பதைத் தரிசனத்தில் கண்டிருக்கிறான்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண்டான்”; கிரேக்க வினை இறந்தகால வடிவில் உள்ளது. இங்கு அந்தத் தரிசனத்தின் தற்போதைய பொருத்தத்தைத் தமிழில் இயல்பாகக் காட்ட “கண்டிருக்கிறான்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மீண்டும் காணும்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: கண்டிருக்கிறான்
  rationale: கிரேக்க வினை இறந்தகால நிகழ்வைக் குறித்தாலும், சவுல் ஏற்கெனவே கண்ட தரிசனம் இப்போதைய சூழலில் பொருத்தமுடையதாக இருப்பதால், தமிழில் ‘கண்டிருக்கிறான்’ இயல்பாக அந்தத் தற்போதைய தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ἄνδρα
  choice: ஒரு மனிதன்
  rationale: இங்கு ἀνήρ வயது வந்த ஆணான அனனியாவைக் குறிக்கிறது; ‘ஒரு மனிதன்’ என்பது தெளிவான, இயல்பான மொழிபெயர்ப்பு.
- source_word: ἐν ὁράματι
  choice: தரிசனத்தில்
  rationale: சவுல் கண்டதன் ஊடகத்தையோ சூழலையோ குறிக்கும் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: Ἁνανίαν ὀνόματι
  choice: அனனியா என்னும்
  rationale: பெயரால் அடையாளப்படுத்தும் கிரேக்க மரபுத்தொடருக்கு நவீனத் தமிழில் இயல்பான வடிவம்.
- source_word: εἰσελθόντα
  choice: உள்ளே வந்து
  rationale: தரிசனத்தில் அனனியா நுழைவதை இயல்பான தமிழில் காட்டுகிறது; நிகழ்வுகளின் வரிசையை அளவுக்கு அதிகமாக வலியுறுத்தவில்லை.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: தன்மேல் கைகளை வைப்பதை
  rationale: சவுல்மேல் அனனியா கைகளை வைக்கும் உடல் செயலைப் பாதுகாக்கிறது; அதற்கு எந்தச் சடங்கு அல்லது பிரிவுசார் பொருளையும் சேர்க்கவில்லை.
- source_word: ὅπως
  choice: பெறும்படி
  rationale: கிரேக்கத்தில் உள்ள நோக்கத்தைக் குறிக்கும் உட்பொருளை இயல்பான தமிழ் வினையெச்ச அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ἀναβλέψῃ
  choice: மீண்டும் பார்வை பெற
  rationale: இந்தக் குணமாக்கும் சூழலில் ‘மேலே பார்க்க’ என்பதல்ல, இழந்த பார்வையைத் திரும்பப் பெறுவதே பொருள்.
theological_decisions:
- issue: கைகளை வைக்கும் செயலுக்கு சடங்கு அல்லது வரம் சார்ந்த குறிப்பிட்ட பொருள் தர வேண்டுமா
  choice: தன்மேல் கைகளை வைப்பதை
  alternative: தன்மேல் தன் கைகளை வைப்பதை
  rationale: மூலவாக்கியம் உடல் செயலை மட்டுமே கூறுகிறது; அது அருட்சாதனம், திருநிலைப்படுத்தல் அல்லது குறிப்பிட்ட குணமாக்கும் முறை என்று விளக்காமல் வேதாகமச் செயற்பாட்டை அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நோக்கத்தைக் குறிக்கும் ὅπως சொற்றொடர் தமிழில் முன்னிறுத்தப்பட்டுள்ளது; இதனால் நீளமான கிரேக்க வாக்கிய அமைப்பு இயல்பான தமிழாகிறது. ‘தன்மேல்’ என்பது கைகள் வைக்கப்படுபவர் சவுல் என்பதைத் தெளிவாக்குகிறது.
