- from: 'ஆகவே, யூதேயா, கலிலேயா, சமாரியா ஆகிய பகுதிகள் முழுவதிலும் இருந்த திருச்சபை[a] அமைதியுடன் இருந்தது; அது கட்டியெழுப்பப்பட்டுவந்தது. ஆண்டவருக்குப் பயந்து நடந்து, பரிசுத்த ஆவியானவரின் ஊக்கத்தால்[b] அது பெருகிவந்தது.


