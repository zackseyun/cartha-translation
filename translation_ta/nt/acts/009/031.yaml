id: ACT.9.31
reference: Acts 9:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: ta
  text: 'ஆகவே, யூதேயா, கலிலேயா, சமாரியா முழுவதிலும் உள்ள திருச்சபை[a] அமைதியுடன் இருந்தது; அது கட்டியெழுப்பப்பட்டுக் கொண்டிருந்தது. ஆண்டவருக்குப் பயந்து, பரிசுத்த ஆவியானவரின் ஊக்கத்தில் நடந்து, அது பெருகிக்கொண்டிருந்தது.


    [a] சில கையெழுத்துப் பிரதிகளில், “திருச்சபைகள்” என்று உள்ளது.


    [b] அல்லது “ஆறுதலில்” அல்லது “அறிவுறுத்தலில்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “திருச்சபைகள்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது “ஆறுதலில்” அல்லது “அறிவுறுத்தலில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: திருச்சபை
  rationale: SBLGNT-இல் ஒருமை வடிவம் உள்ளது; பல பகுதிகளில் பரவியிருந்த ஒரே திருச்சபையைத் தொகுப்பொருள் ஒருமையாக இது காட்டுகிறது. பன்மை பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: யூதேயா, கலிலேயா, சமாரியா ஆகிய பகுதிகள் முழுவதிலும்
  rationale: κατά என்பதன் இங்குள்ள பிரதேசமெங்கும் பரவியிருக்கும் பொருளையும் ὅλης என்பதன் முழுமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἶχεν εἰρήνην
  choice: அமைதியுடன் இருந்தது
  rationale: துன்புறுத்தலிலிருந்து கிடைத்த ஓய்வையும் நிலையான சமாதான நிலையையும் குறிக்கக்கூடிய கிரேக்க மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: οἰκοδομουμένη
  choice: கட்டியெழுப்பப்பட்டுவந்தது
  rationale: நிகழ்காலச் செயல்பாட்டையும் செயப்பாட்டு நிலையையும் கட்டட உருவகத்தையும் காக்கிறது.
- source_word: πορευομένη
  choice: நடந்து
  rationale: வாழ்க்கை நடத்தை என்ற உருவகப் பொருளைத் தமிழிலும் சுருக்கமாகவும் வேதாகம மொழிநடைக்கு ஏற்றவாறும் காக்கிறது.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: ஆண்டவருக்குப் பயந்து
  rationale: பயபக்தியும் கீழ்ப்படிதலுமுள்ள வாழ்க்கையைக் குறிக்கும் மூலத்தின் வலுவான வேதாகமச் சொல்லாட்சியைத் தளர்த்தாமல் தருகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான இயல்பான, கண்ணியமான நவீனத் தமிழ் இணை; குறிப்பிட்ட நபரை மொழிபெயர்ப்பிலேயே மேலதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: பரிசுத்த ஆவியானவரின் ஊக்கத்தால்
  rationale: παράκλησις என்பதன் ஊக்கம், ஆறுதல், அறிவுறுத்தல் ஆகிய பொருள் வரம்பில், வளர்ச்சிச் சூழலுக்கு ‘ஊக்கம்’ இயல்பாகப் பொருந்துகிறது; பிற உண்மையான சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: τοῦ ἁγίου πνεύματος
  choice: பரிசுத்த ஆவியானவர்
  rationale: நவீனத் தமிழ் கிறிஸ்தவ வழக்கில் பரவலாகப் புரியப்படும் கண்ணியமான பெயர்ப்பு.
- source_word: ἐπληθύνετο
  choice: பெருகிவந்தது
  rationale: தொடர்ந்து எண்ணிக்கையில் வளர்ந்துகொண்டிருந்ததை உணர்த்தும் இறந்தகாலத் தொடர்நிலையை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ἐκκλησία என்பதன் எண்ணும் குறிப்பும்
  choice: பல பகுதிகளில் இருந்த திருச்சபையைக் குறிக்கும் தொகுப்பொருள் ஒருமை
  alternative: ‘திருச்சபைகள்’ என்ற பன்மை கையெழுத்துப் பாடம்
  rationale: கொடுக்கப்பட்ட SBLGNT மூலத்தில் பெயர்ச்சொல், பங்கேற்புவினைகள், வினைகள் அனைத்தும் ஒருமையில் உள்ளன. குறிப்பிடத்தக்க பன்மை பாடம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: ‘ஆண்டவருக்குப் பயந்து’ என்பதன் பொருள்
  choice: பயபக்தியும் கீழ்ப்படிதலுமுள்ள வாழ்க்கை
  alternative: திகிலூட்டும் அச்சம் அல்லது பொதுவான சமய மரியாதை மட்டும்
  rationale: மூலத்தின் இறையியல் ஆழத்தையும் நோக்கமுள்ள இருபொருள் விரிவையும் காக்க நேரடியான சொல்லாட்சி வைக்கப்பட்டுள்ளது.
- issue: παράκλησις என்பதன் பொருள்
  choice: ஊக்கம்
  alternative: ஆறுதல் அல்லது அறிவுறுத்தல்
  rationale: அமைதி, கட்டியெழுப்பப்படுதல், பெருக்கம் ஆகிய சூழலில் ‘ஊக்கம்’ முதன்மையாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது; சொல்லின் மற்ற முக்கிய நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கட்டியெழுப்பப்பட்டுவந்தது,’ ‘பெருகிவந்தது’ என்பவை கிரேக்கத்தின் தொடர்ச்சியான செயலைக் காக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த தனிச்சொல்லாட்சிகள் தவிர்க்கப்பட்டுள்ளன.
