  to: 'ஆகவே, யூதேயா, கலிலேயா, சமாரியா முழுவதிலும் உள்ள திருச்சபை[a] அமைதியுடன் இருந்தது; அது கட்டியெழுப்பப்பட்டுக் கொண்டிருந்தது. ஆண்டவருக்குப் பயந்து, பரிசுத்த ஆவியானவரின் ஊக்கத்தில் நடந்து, அது பெருகிக்கொண்டிருந்தது.


    [a] சில கையெழுத்துப் பிரதிகளில், “திருச்சபைகள்” என்று உள்ளது.


