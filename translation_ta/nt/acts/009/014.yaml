id: ACT.9.14
reference: Acts 9:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὧδε ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων δῆσαι πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: ta
  text: இங்கேயும், உமது பெயரைச் சொல்லி அழைக்கிற அனைவரையும் கட்டிப்போடுவதற்கு அவன் தலைமை ஆசாரியர்களிடமிருந்து அதிகாரம் பெற்றிருக்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பெயரை அழைக்கிற அனைவரையும்.” இந்தக் கிரேக்கத் தொடர் ஒருவருடைய பெயரைச் சொல்லி அவரை நோக்கி அழைப்பதைக் குறிக்கும் வழக்கமான வேதாகமச் சொல்லாட்சி; பல இடங்களில் இது வேண்டுதலையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: இங்கே
  rationale: இது இடத்தைக் குறிக்கும் வினையடை; அனனியா தமஸ்குவைக் குறிப்பதால், இயல்பான தமிழில் ‘இங்கே’ பொருத்தமானது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: முதன்மைக் குருமார்களிடமிருந்து வழங்கப்பட்ட சட்டபூர்வமான அல்லது அதிகாரப்பூர்வமான அனுமதியை இது குறிக்கிறது.
- source_word: παρὰ τῶν ἀρχιερέων
  choice: முதன்மைக் குருமார்களிடமிருந்து
  rationale: γενitive உடன் வரும் παρά அதிகாரத்தின் மூலத்தைக் குறிக்கிறது; ἀρχιερεῖς என்பது எருசலேமின் தலைமை ஆசாரியக் குழுவைக் குறிக்கும் வழக்குச் சொல்.
- source_word: δῆσαι
  choice: கட்டிப்போடுவதற்கு
  rationale: வினைச்சொல்லின் நேரடியான கட்டுதல் என்ற உருவகத்தைத் தக்கவைத்தபடியே, கைது செய்து கட்டுப்படுத்தும் சூழல்சார்ந்த பொருளையும் தமிழில் உணர்த்துகிறது.
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: அனைவரையும் … சொல்லி வேண்டிக்கொள்கிற
  rationale: பெயரை அழைத்து வேண்டுதல் அல்லது ஒருவரை நோக்கி விண்ணப்பித்தல் என்ற வேதாகம வழக்கை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ ὄνομά σου
  choice: உமது பெயரை
  rationale: மூலத்தின் ‘உமது பெயர்’ என்ற வடிவத்தைப் பாதுகாக்கிறது; இங்கு பெயர் அந்த நபரையும் அவரது அதிகாரத்தையும் சுட்டலாம்.
theological_decisions:
- issue: இயேசுவிடம் கூறப்படும் ‘உமது பெயரை அழைக்கிறவர்கள்’ என்ற தொடரின் பொருள்
  choice: ‘உமது பெயரைச் சொல்லி வேண்டிக்கொள்கிற’ என்ற வேண்டுதல் சார்ந்த வேதாகம வழக்கைத் தக்கவைத்தல்
  alternative: ‘உம்மைத் தொழுகிற’ அல்லது ‘உமது அதிகாரத்தை நாடுகிற’ என்று வெளிப்படையாக விளக்குதல்
  rationale: ἐπικαλεῖσθαι τὸ ὄνομα என்பது வேண்டுதல், அழைப்பு, பற்றுறுதி ஆகிய நிழற்பொருள்களைக் கொண்டது. இயேசுவை நேரடியாக நோக்கி ‘உமது பெயர்’ என்று சொல்லப்படுவதன் இறையியல் கனத்தைப் பாதுகாத்து, மூலத்தில் இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் விடுவது சிறந்தது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். இயேசுவை நோக்கிய உரையில் ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. ‘கட்டிப்போடுதல்’ மூல உருவகத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு வேண்டுதல் சார்ந்த சொல்லாட்சியின் பரப்பை விளக்குகிறது.
