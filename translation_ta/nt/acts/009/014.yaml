revisions:
- from: மேலும், இங்கே உமது பெயரைச் சொல்லி வேண்டிக்கொள்கிற அனைவரையும் கட்டிப்போடுவதற்கு அவன் முதன்மைக் குருமார்களிடமிருந்து அதிகாரம் பெற்றிருக்கிறான்.[a]
  to: இங்கேயும், உமது பெயரைச் சொல்லி அழைக்கிற அனைவரையும் கட்டிப்போடுவதற்கு அவன் தலைமை ஆசாரியர்களிடமிருந்து அதிகாரம் பெற்றிருக்கிறான்.[a]
