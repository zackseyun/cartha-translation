source:
  edition: SBLGNT
  text: ἐγὼ γὰρ ὑποδείξω αὐτῷ ὅσα δεῖ αὐτὸν ὑπὲρ τοῦ ὀνόματός μου παθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: ta
  text: ஏனெனில், என் பெயருக்காக[a] அவன் எவ்வளவு துன்பப்பட வேண்டும் என்பதை நானே அவனுக்குக் காட்டுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் பெயரின் நிமித்தம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: நானே
  rationale: வினைச்சொல்லிலேயே எழுவாய் புலப்பட்டாலும், கிரேக்கத்தில் தனியாக இடம்பெறும் முதலாம் நபர் பதிலிப்பெயரின் வலியுறுத்தலைத் தமிழில் ‘நானே’ என்று வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ அடிப்படையையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் விசையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὑποδείξω
  choice: காட்டுவேன்
  rationale: ‘காட்டு, சுட்டிக்காட்டு, தெரியப்படுத்து’ என்ற பொருள் வரம்பில், நேரடியும் இயல்பானதுமான எதிர்கால வினை வடிவம்.
- source_word: αὐτῷ
  choice: அவனுக்கு
  rationale: கிரேக்க வேற்றுமைப் பொருளை ‘காட்டுவேன்’ என்பதன் இயல்பான தமிழ் மறைமுகச் செயப்படுபொருளாக வழங்குகிறது.
- source_word: ὅσα
  choice: எவ்வளவு
  rationale: δεῖ மற்றும் வினையெச்சத்துடன் வரும் இக்கட்டமைப்பில் தனித்தனி காரியங்களின் பட்டியலைவிடத் துன்பத்தின் அளவை அல்லது பரப்பைச் சுட்டுகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: அவசியத்தைத் தெரிவிக்கிறது; அது நியமனமா, இறைத்திட்ட அவசியமா என்பதை மொழிபெயர்ப்பிலேயே கூடுதலாகத் தீர்மானிக்கவில்லை.
- source_word: ὑπὲρ
  choice: க்காக
  rationale: இங்கு இயேசுவின் பெயரின் நிமித்தம் அல்லது அதன் சார்பில் துன்பப்படுவதை உள்ளடக்கக்கூடிய பரந்த, இயல்பான தமிழ் வடிவம்; மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: τοῦ ὀνόματός μου
  choice: என் பெயர்
  rationale: ‘பெயர்’ என்பது அந்த நபர், அவரது அதிகாரம், அவரோடு கொண்ட தொடர்பு ஆகியவற்றையும் சுட்டக்கூடிய வேதாகமச் செறிவைப் பாதுகாக்கிறது.
- source_word: παθεῖν
  choice: துன்பப்பட
  rationale: πάσχω என்பதன் இச்சூழலுக்குரிய ‘துன்பத்தை அனுபவி’ என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: δεῖ வெளிப்படுத்தும் அவசியத்தின் தன்மை
  choice: துன்பப்பட வேண்டும்
  alternative: துன்பப்படும்படி நியமிக்கப்பட்டிருக்கிறான்
  rationale: கிரேக்க வாசகம் அவசியத்தைக் கூறுகிறது; ஆனால் அதை வெளிப்படையாக விதிநியமம் அல்லது தீர்மானிக்கப்பட்ட இலக்கு என்று வரையறுப்பதில்லை. ‘வேண்டும்’ அந்த இறையியல் இறுக்கத்தைத் தீர்க்காமல் பாதுகாக்கிறது.
- issue: ‘என் பெயர்’ என்பதோடு ὑπὲρ தரும் உறவு
  choice: என் பெயருக்காக
  alternative: என் பெயரின் பொருட்டு / என் பெயரின் சார்பாக
  rationale: முதன்மை வாசகம் காரணம், நிமித்தம், சார்பு ஆகிய நுணுக்கங்களுக்கு இடமளிக்கும் இயல்பான வடிவத்தைப் பயன்படுத்துகிறது; மாற்று சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் வலியுறுத்தப்பட்ட ἐγὼ என்பதற்கு ‘நானே’ என்றும், ὅσα என்பதற்கு அளவை வெளிப்படுத்தும் ‘எவ்வளவு’ என்றும் வழங்கப்பட்டுள்ளது.
