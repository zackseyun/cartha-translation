    issue: Awkward placement of the speech-attribution phrase
    rationale: In the draft, ‘தன்னிடம் ஒரு குரல் ... சொல்வதைக் கேட்டான்’ interrupts the clause and can momentarily obscure that the voice is what Saul heard. A relative construction naturally expresses ‘he heard a voice saying to him.’
  revised_text: அவன் தரையில் விழுந்து, “சவுலே, சவுலே, நீ ஏன் என்னைத் துன்புறுத்துகிறாய்?” என்று தன்னிடம் சொன்ன ஒரு குரலைக் கேட்டான்.
