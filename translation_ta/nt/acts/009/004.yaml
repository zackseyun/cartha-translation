id: ACT.9.4
reference: Acts 9:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: ta
  text: அவன் தரையில் விழுந்து, “சவுலே, சவுலே, நீ ஏன் என்னைத் துன்புறுத்துகிறாய்?” என்று தன்னிடம் சொன்ன ஒரு குரலைக் கேட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: தரையில் விழுந்து
  rationale: இறந்தகாலப் பங்கேற்புவினையும் இயக்கத்தைக் குறிக்கும் சொற்றொடரையும் இயல்பான தமிழ் தொடர் வினையாக வழங்குகிறது; நிகழ்வுகளின் தொடரைத் தெளிவாக வைத்தாலும் தேவையற்ற கால நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ἤκουσεν φωνὴν
  choice: ஒரு குரல் ... சொல்வதைக் கேட்டான்
  rationale: தொடர்ந்து புரிந்துகொள்ளக்கூடிய பேச்சு வருவதால் φωνή என்பதற்கு ‘குரல்’ பொருத்தமானது; ‘சத்தம்’ என்பது தனிப்பட்ட அழைப்பின் தன்மையைப் போதுமான அளவு வெளிப்படுத்தாது.
- source_word: λέγουσαν αὐτῷ
  choice: தன்னிடம் ... என்று சொல்வதை
  rationale: αὐτῷ என்பது குரல் அவனையே நோக்கிப் பேசியதைத் தெளிவாக்குகிறது; ‘தன்னிடம்’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் தொடர்பை நெருக்கமாகவும் காக்கிறது.
- source_word: Σαοὺλ Σαούλ
  choice: சவுலே, சவுலே
  rationale: பெயரின் இருமுறை அழைப்பையும் அதன் வலியுறுத்தலையும் காக்கிறது; விளிவேற்றுமை உருபு நேரடி அழைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τί
  choice: ஏன்
  rationale: வினையுடன் வரும் τί இங்கு காரணம் கேட்கும் வினாவாகச் செயல்படுவதால் ‘ஏன்’ என்பது துல்லியமும் இயல்பும் உடையது.
- source_word: με
  choice: என்னை
  rationale: நேரடி செயப்படுபொருளை எந்த விளக்க விரிவாக்கமும் இல்லாமல் காக்கிறது.
- source_word: διώκεις
  choice: துன்புறுத்துகிறாய்
  rationale: இங்கு விசுவாசிகளுக்கு எதிரான தொடர்ச்சியான பகைமைச் செயல்பாட்டை διώκεις குறிக்கிறது; நிகழ்கால வடிவம் தொடரும் செயலைக் காக்கிறது.
theological_decisions:
- issue: சவுல் தாக்கியவர்களோடு பேசுகிறவர் தம்மை அடையாளப்படுத்துதல்
  choice: ‘என்னை’ என்ற நேரடி சொல்லை அப்படியே வைத்தல்
  alternative: ‘என் மக்களை’ அல்லது ‘என்னைப் பின்பற்றுகிறவர்களை’ என்று விளக்கி விரித்தல்
  rationale: மூலவசனம் துன்புறுத்தப்பட்ட சமூகத்துடன் பேசுகிறவருக்கு உள்ள தனிப்பட்ட அடையாள ஒற்றுமையை நேரடியாக முன்வைக்கிறது. அதை மொழிபெயர்ப்பு விளக்கிச் சுருக்காமலும் விரிவாக்காமலும் காக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை. ‘அவன்’ என்பது சூழலில் சவுலைக் குறிக்கிறது. நேரடி அழைப்பின் வலியுறுத்தலைப் பாதுகாக்க பெயர் இருமுறைவும் ‘-ஏ’ விளிவேற்றுமையுடனும் வழங்கப்பட்டுள்ளது.
