  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: ta
  text: உடனே அவர் ஜெபக்கூடங்களில் இயேசுவைப் பற்றி, “இவரே கடவுளின் மகன்” என்று அறிவித்துக்கொண்டிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “உடனே அவர் ஜெபக்கூடங்களில் இயேசுவைப் பற்றி, ‘இவரே கடவுளின் மகன்’ என்று பிரகடனப்படுத்தினார்.” கிரேக்க வினைச்சொல் பொதுவெளியில் அறிவிப்பதைச் சுட்டுகிறது; அதன் இறந்தகாலத் தொடர்நிலை வடிவம், “அறிவித்துக்கொண்டிருந்தார்” என்றும் மொழிபெயர்க்கப்படலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: உடனே
  rationale: செயல் தாமதமின்றி நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: ஜெபக்கூடங்களில்
  rationale: ἐν என்பதன் இடப்பொருளையும், συναγωγαῖς என்பதன் பன்மையையும் காக்கிறது; தமிழ் வேதாகமப் பயன்பாட்டில் எளிதில் புரியும் சொல்.
- source_word: ἐκήρυσσεν
  choice: அறிவிக்கத் தொடங்கினார்
  rationale: κηρύσσω குறிக்கும் பொதுவான, வெளிப்படையான பிரகடனத்தை ‘அறிவிக்க’ தருகிறது. சூழலில் செயல் தொடங்கியதை இயல்பாக வெளிப்படுத்த ‘தொடங்கினார்’ சேர்க்கப்பட்டுள்ளது; இதற்கான நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὸν Ἰησοῦν
  choice: இயேசுவைப் பற்றி
  rationale: கிரேக்கத்தில் ‘இயேசு’ நேரடி செயப்படுபொருளாக இருந்தாலும், தமிழில் ‘இயேசுவை அறிவித்தார்’ என்பது இயல்பற்றதாகவோ வேறு பொருள் தருவதாகவோ அமையலாம். ‘இயேசுவைப் பற்றி’ என்பது அடுத்த ὅτι கூற்றுடன் சேர்ந்து அறிவிப்பின் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: அறிவிப்பின் உள்ளடக்கத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: οὗτός
  choice: இவரே
  rationale: எளிய ‘அவர்’ என்பதைக் காட்டிலும் கிரேக்கச் சுட்டுப்பெயரின் அடையாளப்படுத்தும் வலியுறுத்தலைக் காக்கிறது; மரியாதையான நவீனத் தமிழுக்கும் பொருந்துகிறது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: கடவுளின் மகன்
  rationale: கிறிஸ்துவைப் பற்றிய பட்டப்பெயரை விளக்கவோ குறைக்கவோ செய்யாமல் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: சவுலின் அறிவிப்பிலுள்ள கிறிஸ்துவியல் பட்டப்பெயர்
  choice: கடவுளின் மகன்
  alternative: தேவனுடைய குமாரன்
  rationale: ὁ υἱὸς τοῦ θεοῦ என்ற தொடரின் வெளிப்படையான கிறிஸ்துவியல் உரிமைக்கூற்றைக் காக்கிறது. ‘கடவுள்/மகன்’ என்பது ordinary modern Tamil-இல் தெளிவானது; குறிப்பிட்ட திருச்சபை மரபின் சொற்பயன்பாட்டைத் தேவையின்றி முன்னிறுத்தாது.
- issue: οὗτός என்பதன் வலியுறுத்தல்
  choice: இவரே
  alternative: அவர்தான்
  rationale: இயேசுவே கடவுளின் மகன் என்ற அடையாளப்படுத்தும் வலிமையைப் பாதுகாக்கிறது; அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபக்கூடங்கள்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் பன்மையில் காக்கப்பட்டுள்ளது. மேற்கோள் அமைப்பு ὅτι அறிமுகப்படுத்தும் அறிவிப்பின் உள்ளடக்கத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; [a] குறி முதன்மை உரையில் இடம்பெற்றுள்ளது.
