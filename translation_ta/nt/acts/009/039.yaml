  naturalness: The Tamil is clear, modern, and appropriately solemn. Replacing “செய்திருந்த” with “செய்த” also makes the final relative clause more idiomatic.
  terminology: “பேதுரு,” “தொற்காள்,” and “தபித்தாள்” accord with established Tamil biblical naming. “அங்கிகள்” and “மேலாடைகள்” suitably preserve the distinction between χιτῶνες and ἱμάτια; the cultural footnote appropriately qualifies the likely inner/outer distinction.
