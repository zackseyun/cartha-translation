- source_word: μετ’ αὐτῶν οὖσα
  choice: தங்களோடு இருந்தபோது
  rationale: தொற்காள் அந்த விதவைகளோடு உயிரோடு இருந்த காலத்தைக் குறிக்கும் மூலமொழியின் அமைப்பை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: μετ’ αὐτῶν என்பதன் தொடர்பு
  choice: தங்களோடு இருந்தபோது
  alternative: அவர்களுக்காகச் செய்திருந்த
  rationale: கிரேக்கம் தொற்காள் விதவைகளோடு இருந்ததை வெளிப்படையாகச் சொல்கிறது; ஆடைகள் அவர்களுக்காகவே செய்யப்பட்டன என்று நேரடியாகக் கூறாததால் அந்தக் கருத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதானதாயும் நிகழ்வின் துக்கமிக்க கண்ணியமான தொனியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. பழமையான ‘வஸ்திரம்’ போன்ற சொல்லுக்கு மாற்றாகப் புரியக்கூடிய ‘அங்கி’, ‘மேலாடை’ ஆகியவை பயன்படுத்தப்பட்டுள்ளன; பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டோடு ஒத்த ‘பேதுரு’, ‘தொற்காள்’, ‘தபித்தாள்’ வடிவங்களில் தரப்பட்டுள்ளன.
