source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: ta
  text: அப்போது பேதுரு எழுந்து அவர்களுடன் சென்றார். அவர் அங்கு வந்ததும், அவர்கள் அவரை மாடி அறைக்கு அழைத்துச் சென்றார்கள். விதவைகள் அனைவரும் அழுதுகொண்டே அவரருகில் நின்று[a], தொற்காள்[c] தங்களோடு இருந்தபோது செய்த அங்கிகளையும் மேலாடைகளையும்[b] அவருக்குக் காட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்முன் நின்று.’ இங்குள்ள கிரேக்கச் சொற்றொடருக்கு இவ்வாறும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அங்கிகளையும் மேலாடைகளையும்’ என்பது கிரேக்கத்தில் வரும் இரண்டு வேறுபட்ட ஆடைச்சொற்களைப் பிரதிபலிக்கிறது; அவை பொதுவாக உடல்மீது அணியும் ஆடையையும் அதற்கு மேலே அணியும் ஆடையையும் குறிக்கின்றன.
    reason: cultural_note
  - marker: c
    text: தொற்காள் என்பது கிரேக்கப் பெயர்; அப்போஸ்தலர் 9:36-இல் அவள் தபித்தாள் என்றும் அழைக்கப்படுகிறாள்.
    reason: cross_reference
