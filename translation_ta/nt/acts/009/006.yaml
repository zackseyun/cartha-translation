  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: ta
  text: ஆனால் நீ எழுந்து நகரத்துக்குள் போ. நீ என்ன செய்ய வேண்டும் என்பது உனக்குச் சொல்லப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் முறையில், “நீ செய்ய வேண்டியது என்ன என்று உனக்குச் சொல்லப்படும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: சவுலின் கேள்வியிலிருந்து இயேசுவின் கட்டளைக்குத் திருப்பத்தைச் சுட்டும் எதிர்மறை இணைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνάστηθι
  choice: எழுந்து
  rationale: விழுந்திருந்த சவுலுக்குக் கொடுக்கப்படும் ஒருமை கட்டளையை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: நகரத்துக்குள் போ
  rationale: இலக்கை நோக்கிய இயக்கத்தையும் நகருக்குள் நுழைவதையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λαληθήσεταί σοι
  choice: உனக்குச் சொல்லப்படும்
  rationale: கிரேக்க மூலத்தின் எதிர்காலச் செயப்பாட்டு வடிவத்தையும், யார் சொல்வார் என்பதை வெளிப்படையாகக் குறிப்பிடாத தன்மையையும் காக்கிறது.
- source_word: ὅ τί
  choice: என்ன ... என்பது
  rationale: அறிவிக்கப்படவிருக்கும் செய்தியின் உள்ளடக்கத்தை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: σε δεῖ ποιεῖν
  choice: நீ என்ன செய்ய வேண்டும்
  rationale: δεῖ குறிக்கும் தேவையையும் கடப்பாட்டின் வலிமையையும் ‘வேண்டும்’ தெளிவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: தெய்வீக வழிநடத்தல் சூழலில் δεῖ என்பதன் வலிமை
  choice: வேண்டும்
  alternative: செய்ய வேண்டியிருக்கிறது / செய்யத் தேவை
  rationale: இங்கு உள்ள அவசியம் அல்லது கடப்பாட்டை வலுவாகக் காட்டுகிறது; அதேவேளையில் அந்த அவசியத்தின் மூலத்தை வசனம் சொல்வதைவிட அதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. செயப்பாட்டு அமைப்பும் மூலத்தில் உள்ள மறைமுகத் தன்மையும் காக்கப்பட்டுள்ளன.
