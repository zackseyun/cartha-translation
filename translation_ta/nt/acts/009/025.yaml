revisions:
- from: ஆனால் அவருடைய சீடர்கள் இரவில் அவரைத் தங்களுடன் கூட்டிக்கொண்டு, ஒரு பெரிய கூடையில் வைத்துத் தாழ இறக்கி, மதில் வழியாக அவரைக் கீழே இறக்கிவிட்டார்கள்[a][b].
  to: ஆனால் அவருடைய சீடர்கள் இரவில் அவரைக் கூட்டிக்கொண்டு, ஒரு பெரிய கூடையில் வைத்து மதில் வழியாகக் கீழே இறக்கிவிட்டார்கள்[a][b].
  rationale: 'The revision removes the misleading double, sequential descent while retaining every stated element of the Greek: the disciples’ action, the night setting, descent through the wall, and the large basket. The footnote preserves the Greek stylistic detail without forcing an unnatural or semantically misleading repetition into Tamil.'
