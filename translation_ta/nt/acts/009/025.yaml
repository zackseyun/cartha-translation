  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: ta
  text: ஆனால் அவருடைய சீடர்கள் இரவில் அவரைக் கூட்டிக்கொண்டு, ஒரு பெரிய கூடையில் வைத்து மதில் வழியாகக் கீழே இறக்கிவிட்டார்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மதிலிலிருந்த ஓர் திறப்பின் வழியாக.’ கிரேக்க மூலத்தில் சொற்சொல்லாக ‘மதில் வழியாக’ என்றுள்ளது; இது நகர மதிலிலிருந்த ஒரு திறப்பையோ சாளரத்தையோ குறித்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘கீழே இறக்குதல்’ என்ற செயலைக் குறிக்கும் இரண்டு சொற்கள் பயன்படுத்தப்பட்டுள்ளன. இரண்டாவது சொல், அவரை ஒரு கூடையில் வைத்து இறக்கிய விதத்தைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: அவரைத் தங்களுடன் கூட்டிக்கொண்டு
  rationale: இங்கு சீடர்கள் அவரைத் தங்கள் பொறுப்பில் எடுத்துக்கொண்டு தப்பிக்கச் செய்ததைக் குறிக்கிறது. தமிழில் ஒருவரை ‘எடுத்துக்கொண்டு’ என்பது இயல்பற்றதாகத் தோன்றக்கூடும் என்பதால், பொருளை மிகைப்படுத்தாமல் ‘தங்களுடன் கூட்டிக்கொண்டு’ என வழங்கப்பட்டது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கொலைத் திட்டத்திற்கு எதிரான கதைத் திருப்பை மென்மையாகக் காட்டுகிறது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: αὐτοῦ என்ற உடைமைச் சொல்லை வெளிப்படையாகக் காத்து, μαθηταί என்பதற்கு நிலையான ‘சீடர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: νυκτός
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான, சுருக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: διὰ τοῦ τείχους
  choice: மதில் வழியாக
  rationale: διά உடன் வரும் இத்தொடர் மதிலின் ஊடாகச் சென்றதைக் குறிக்கிறது. மூலத்தில் ‘திறப்பு’ அல்லது ‘சாளரம்’ வெளிப்படையாக இல்லாததால் அவை முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: καθῆκαν αὐτόν
  choice: அவரைக் கீழே இறக்கிவிட்டார்கள்
  rationale: உயரமான இடத்திலிருந்து ஒருவரைக் கீழே இறக்கிய செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: χαλάσαντες
  choice: தாழ இறக்கி
  rationale: καθῆκαν என்பதுடன் பொருளில் ஒத்திருந்தாலும், தப்பிச் சென்ற விதத்தை உயிரோட்டமாக விவரிக்கும் இரண்டாவது இறக்குதல் சொல்லையும் தமிழில் பிரதிபலிக்கிறது.
- source_word: ἐν σπυρίδι
  choice: ஒரு பெரிய கூடையில் வைத்து
  rationale: σπυρίς என்பது ஒருவரைத் தாங்கக்கூடிய பெரிய வகைக் கூடையைக் குறிக்கக்கூடும்; சூழலுக்கு ஏற்றபடி ‘பெரிய கூடை’ என வழங்கப்பட்டது.
