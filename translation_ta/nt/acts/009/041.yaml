revisions:
- from: பின்பு அவர் அவளுக்குத் தன் கையைக் கொடுத்து, அவளை எழுப்பினார்.[a] பிறகு பரிசுத்தவான்களையும் விதவைகளையும் அழைத்து, அவளை உயிருள்ளவளாக அவர்கள்முன் நிறுத்தினார்.
  to: அவர் அவளுக்குத் தம் கையைக் கொடுத்து அவளை எழுப்பினார்.[a] பின்னர் பரிசுத்தவான்களையும் விதவைகளையும் அழைத்து, அவளை உயிரோடு அவர்கள்முன் நிறுத்தினார்.
  rationale: The revision removes unnecessary repetition in the sequencing, uses the respectful possessive ‘தம்’ with ‘அவர்,’ and replaces the somewhat stiff ‘உயிருள்ளவளாக’ with idiomatic ‘உயிரோடு.’ It preserves every source element, including the distinction between saints and widows and the resurrection-related resonance of ἀνέστησεν.
