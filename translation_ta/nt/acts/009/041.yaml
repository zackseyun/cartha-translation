id: ACT.9.41
reference: Acts 9:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: ta
  text: அவர் அவளுக்குத் தம் கையைக் கொடுத்து அவளை எழுப்பினார்.[a] பின்னர் பரிசுத்தவான்களையும் விதவைகளையும் அழைத்து, அவளை உயிரோடு அவர்கள்முன் நிறுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் எழுந்து நிற்க உதவினார்” / “அவளை எழுந்து நிற்கச் செய்தார்.” கிரேக்க வினைச்சொல் ஒருவரை எழச் செய்வதையோ நிற்கச் செய்வதையோ குறிக்கலாம்; இந்தச் சூழலில் அது உயிர்த்தெழுதல் பற்றிய மொழிநடையையும் எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: அவளுக்குத் தன் கையைக் கொடுத்து
  rationale: கையை அளித்து உதவும் கிரேக்கச் சொற்றொடரைத் தமிழில் நேரடியாகவும் புரியும்படியாகவும் தருகிறது; பேதுரு அவள் எழுவதற்கு உதவிய செயலும் தெளிவாகிறது.
- source_word: ἀνέστησεν
  choice: அவளை எழுப்பினார்
  rationale: ‘எழச் செய்தார்’ என்ற உடனடி உடல்சார்ந்த செயலையும், இச்சூழலில் ஒலிக்கும் உயிர்த்தெழுதல் சார்ந்த பொருளையும் ஒரே சொல்லில் தக்கவைக்கிறது.
- source_word: φωνήσας
  choice: அழைத்து
  rationale: குழுவினரை வரவழைத்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது; அடுத்து நடந்த முதன்மைச் செயலுக்கு முன்னான செயல் என்ற பங்கேற்புவினை உறவும் காக்கப்படுகிறது.
- source_word: τοὺς ἁγίους
  choice: பரிசுத்தவான்களை
  rationale: புதிய ஏற்பாட்டில் கடவுளுக்குரிய மக்களைக் குறிக்கும் வழக்கமான பெயரிடலை, ‘விசுவாசிகள்’ என்று விளக்கவுரையாக்காமல் நேரடியாகத் தருகிறது.
- source_word: τὰς χήρας
  choice: விதவைகளை
  rationale: முந்தைய நிகழ்வில் முக்கியமாக இடம்பெற்ற தனிக் குழுவை மூலத்தைப் போலவே தெளிவாக வேறுபடுத்துகிறது.
- source_word: παρέστησεν
  choice: அவர்கள்முன் நிறுத்தினார்
  rationale: ஒருவரை மற்றவர்கள்முன் கொண்டுவந்து நிறுத்துதல் அல்லது சமர்ப்பித்தல் என்ற வினையின் காரணவினைப் பொருளைச் செயற்படத் தருகிறது.
- source_word: ζῶσαν
  choice: உயிருள்ளவளாக
  rationale: இது அவள் எந்த நிலையில் அவர்கள்முன் நிறுத்தப்பட்டாள் என்பதைச் சொல்லும் பயனிலைப் பங்கேற்புச் சொல்; உயிருடன் மீட்கப்பட்டிருப்பதை வலியுறுத்துகிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் சூழலில் ἀνέστησεν என்ற வினையை மொழிபெயர்த்தல்
  choice: அவளை எழுப்பினார்
  alternative: அவள் எழுந்து நிற்க உதவினார் / அவளை எழுந்து நிற்கச் செய்தார்
  rationale: முந்தைய வசனத்தில் தபித்தாள் உயிர்பெற்ற பின்னர், பேதுரு அவளை உடலளவில் எழச் செய்வதே உடனடிக் குறிப்பு. அதேவேளையில், ‘எழுப்பினார்’ என்பது உயிர்த்தெழுதல் மொழியின் எதிரொலியையும் அழிக்காமல் வைக்கிறது; நிகழ்வின் வரிசையை மீறி இந்த வசனத்தில்தான் உயிர்ப்பித்தார் என்றும் கட்டாயப்படுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பரிசுத்தவான்கள்’ என்பது திருச்சபைச் சூழலில் நிலைபெற்ற புதிய ஏற்பாட்டு பெயரிடலாகத் தக்கவைக்கப்பட்டுள்ளது. தொடர்வினைகளின் வரிசையை ‘பின்பு’, ‘பிறகு’ என்பவை தெளிவாக்குகின்றன.
