source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: ta
  text: ஆகவே அனனியா புறப்பட்டுச் சென்று அந்த வீட்டிற்குள் நுழைந்தார். அவர் சவுல்மேல் தமது கைகளை வைத்து, “சகோதரனாகிய சவுலே, நீ வந்துகொண்டிருந்த வழியில்[a] உனக்குக் காட்சியளித்த ஆண்டவராகிய இயேசு என்னை அனுப்பியிருக்கிறார்; நீ மீண்டும் பார்வை பெறவும்[b] பரிசுத்த ஆவியால் நிரப்பப்படவும்,” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ பயணம் செய்துகொண்டிருந்த சாலையில்.”
    reason: ὁδός மற்றும் ἤρχου ஆகியவற்றைச் சற்று பொதுவான பயணச் சொல்லாட்சியால் மொழிபெயர்க்கும் மாற்று வாய்ப்பு.
  - marker: b
    text: அல்லது, “நீ மீண்டும் காணவும்.”
    reason: ἀναβλέπω என்பதன் சொற்பொருளுக்கு நெருக்கமான மாற்று; இச்சூழலில் பார்வை மீட்பதே கருத்து.
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: ஆகவே ... புறப்பட்டுச் சென்று
  rationale: δέ முந்தைய கட்டளையைத் தொடர்ந்து நிகழும் கதை முன்னேற்றத்தைக் குறிக்கிறது; ἀπῆλθεν என்பது அனனியா அங்கிருந்து செல்வதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: அந்த வீட்டிற்குள் நுழைந்தார்
  rationale: குறிப்பிட்ட வீட்டைச் சுட்டும் கிரேக்க உருபையும், உள்ளே சென்ற செயலைக் குறிக்கும் வினையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: அவர் சவுல்மேல் தமது கைகளை வைத்து
  rationale: உடனிகழும் செயலை இயல்பான தமிழில் தருவதோடு, கைகளை வைக்கும் உடல்சார்ந்த செயலையும் பாதுகாக்கிறது.
- source_word: Σαοὺλ ἀδελφέ
  choice: சகோதரனாகிய சவுலே
  rationale: விளிவேற்றுமையையும் அன்பும் ஏற்றுக்கொள்ளுதலும் கொண்ட சகோதர அழைப்பையும் இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: ἀπέσταλκέν με
  choice: என்னை அனுப்பியிருக்கிறார்
  rationale: நிகழ்காலத் தொடர்புள்ள அனுப்புதலைக் குறிக்கும் நிறைவுக்காலத்தின் வலிமையைத் தமிழின் ‘அனுப்பியிருக்கிறார்’ வடிவம் நன்கு வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: உனக்குக் காட்சியளித்த இயேசுவே அவர்
  rationale: இயேசு ‘ஆண்டவர்’ என்பதை அடையாளப்படுத்தும் கிரேக்க ஒட்டிணைப்பைத் தெளிவாக்குகிறது; வெறுமனே ‘உன்னால் காணப்பட்டவர்’ என்று இயந்திரத்தனமாக மொழிபெயர்க்காமல் தோன்றிய நிகழ்வை இயல்பாகக் கூறுகிறது.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: நீ வந்துகொண்டிருந்த சாலையில்
  rationale: ἤρχου என்ற தொடர்நிலை இறந்தகாலத்தின் நீடித்த இயக்கத்தை ‘வந்துகொண்டிருந்த’ என்பதால் பாதுகாக்கிறது; ὁδός இங்கு நேரடியான சாலையைக் குறிக்கிறது.
- source_word: ἀναβλέψῃς
  choice: நீ மீண்டும் பார்வை பெறவும்
  rationale: குருடான நிலையிலிருந்து பார்வை திரும்பக் கிடைப்பதே சூழல்சார் பொருள்; ‘மேலே பார்க்க’ என்ற வேறு சாத்தியப் பொருள் இங்கு பொருந்தாது.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியால் நிரப்பப்படவும்
  rationale: செயப்பாட்டு வடிவத்தையும், அப்போஸ்தலர் நடபடிகளில் தெய்வீக ஆவியைக் குறிக்கும் வழக்கமான சொல்லாட்சியையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ὁ κύριος என்பவரை Ἰησοῦς அடையாளப்படுத்தும் ஒட்டிணைப்பு
  choice: ஆண்டவர் என்னை அனுப்பியிருக்கிறார்—... இயேசுவே அவர்—
  alternative: ஆண்டவராகிய இயேசு ... என்னை அனுப்பியிருக்கிறார்
  rationale: கிரேக்க மூலத்தின் சொற்றொடர் வரிசையையும் இடைச்செருகப்பட்ட அடையாளப்படுத்தலையும் பாதுகாக்கிறது; அதேவேளை ‘இயேசுவே அவர்’ என்பது ஆண்டவர் யார் என்பதைத் தமிழில் தெளிவாக்குகிறது.
- issue: உருபில்லாத πνεύματος ἁγίου என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவி
  alternative: பரிசுத்தமான ஓர் ஆவி
  rationale: கிரேக்கத்தில் உருபு இல்லாதது வரையறையற்ற ஓர் ஆவியைக் கட்டாயப்படுத்துவதில்லை; அப்போஸ்தலர் நடபடிகளின் சூழலில் இது தெய்வீக ஆவியையே குறிக்கிறது.
- issue: ἀδελφέ என்ற அழைப்பின் உறவுப்பொருள்
  choice: சகோதரனாகிய சவுலே
  alternative: சவுலே, சகோதரனே
  rationale: இது வெறும் இன உறவை மட்டுமல்லாமல் அனனியாவின் ஏற்றுக்கொள்ளுதலையும் நெருக்கத்தையும் வெளிப்படுத்துகிறது; தமிழில் பெயருடன் இணைந்த மரியாதையான நேரடி அழைப்பாக அமைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் இடைச்செருகப்பட்ட ‘ஆண்டவர்—இயேசு’ அமைப்பு நீண்ட கோடுகளால் பாதுகாக்கப்பட்டுள்ளது. மரியாதை ஒருமை வினைகள் அனனியாவைக் குறிக்கின்றன; நேரடி உரையில் சவுலை நோக்கிய ‘நீ’ மூலத்தின் ஒருமை அழைப்பை இயல்பாகத் தருகிறது.
