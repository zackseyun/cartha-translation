source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: ta
  text: ஆனால் ஆண்டவர் அவனிடம், “போ; ஏனெனில், யூதரல்லாத மக்களின்[a] முன்னிலும் அரசர்களின் முன்னிலும் இஸ்ரவேலின் மகன்களின்[b] முன்னிலும் என் பெயரைச் சுமந்து செல்ல இவன் எனக்குரிய தேர்ந்தெடுக்கப்பட்ட கருவி” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகள்.”
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேலின் மகன்கள்” என்பது இஸ்ரவேல் மக்களைக் குறிக்கும் மரபான வேதாகமச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: தமிழ் வேதாகம நடையிலும் நவீன கிறிஸ்தவப் பயன்பாட்டிலும் κύριος என்னும் அதிகாரப் பட்டத்திற்குரிய இயல்பான மொழிபெயர்ப்பு; இச்சூழலில் உயிர்த்தெழுந்த இயேசுவைக் குறிக்கிறது.
- source_word: Πορεύου
  choice: போ
  rationale: கிரேக்கக் கட்டளையின் நேரடித் தன்மையையும் வலிமையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: நான் தேர்ந்தெடுத்த கருவி
  rationale: சொல்லாட்சிப்படி ‘எனக்குரிய தேர்வின் பாத்திரம்’ என்ற உருவகம் உள்ளது; இங்கு ஒரு குறிப்பிட்ட பணிக்காக ஆண்டவர் பயன்படுத்தத் தேர்ந்தெடுத்தவரை அது குறிக்கிறது. ‘கருவி’ நவீன தமிழில் உருவகப் பொருளைத் தெளிவாகத் தருகிறது; ‘நான் தேர்ந்தெடுத்த’ என்பது μοι-யின் தனிப்பட்ட உரிமைத் தொடர்பையும் ἐκλογῆς-ன் தேர்வையும் இயல்பாக இணைக்கிறது.
- source_word: τοῦ βαστάσαι τὸ ὄνομά μου
  choice: என் பெயரை ... சுமந்து செல்வதற்காக
  rationale: நோக்கத்தைக் காட்டும் infinitive அமைப்பையும் βαστάζω-வின் ‘சுமத்தல்/தாங்கிச் செல்லுதல்’ பொருளையும் காக்கிறது. ‘பெயர்’ என்பதன் பிரதிநிதித்துவம், அதிகாரம், பொதுச் சாட்சி ஆகிய வேதாகம ஒலிவுகளையும் மொழிபெயர்ப்பு திறந்தவாறே வைக்கிறது.
- source_word: ἐνώπιον
  choice: முன்பாக
  rationale: ஒருவரின் முன்னிலையில் அல்லது அவர்களுக்கு முன் பொதுவாகச் சாட்சி வழங்கும் கருத்தைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
- source_word: ἐθνῶν
  choice: யூதரல்லாத மக்கள்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்பதுடன் காணப்படும் வேறுபாட்டால் இங்கு யூதரல்லாத மக்களே சூழல்சார்ந்த பொருள். ‘பிற இனத்தார்’ அல்லது சொல்லாட்சிப்படியான ‘நாடுகள்’ என்பதைக் காட்டிலும் இது சாதாரண வாசகருக்குத் தெளிவானது; ‘நாடுகள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: βασιλέων
  choice: அரசர்கள்
  rationale: மூலச்சொல்லின் நேரடிப் பொருளை இயல்பான தமிழில் காக்கிறது; பொதுவாக ‘ஆட்சியாளர்கள்’ என்று விரிவாக்கத் தேவையில்லை.
- source_word: υἱῶν Ἰσραήλ
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் ஆண்பால் குடும்பவழி மரபுத்தொடரைத் தெளிவாகக் காக்கிறது. இது இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கும் மரபான வேதாகமச் சொற்றொடர் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: τε ... καὶ ... τε
  choice: '...வும், ...வும், ...வும்'
  rationale: மூன்று குழுக்களையும் ஒருங்கிணைக்கும் கிரேக்க இணைப்பை இயல்பான தமிழ் பட்டியல் அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐκλογῆς என்ற சொல்லை பிற்காலத் ‘தேர்ந்தெடுப்பு’ கோட்பாடுகளின் வழியாக மிகையாக வாசிக்கும் சாத்தியம்
  choice: குறிப்பிட்ட பணிக்காக ‘நான் தேர்ந்தெடுத்த கருவி’ என்று மொழிபெயர்த்தல்
  alternative: ‘தேர்வின் பாத்திரம்’ அல்லது ‘தேர்ந்தெடுக்கப்பட்ட பாத்திரம்’
  rationale: இவ்வசனம் சவுலை ஆண்டவர் தமது பெயரைச் சுமந்து செல்லும் பணிக்காகத் தேர்ந்தெடுத்ததைத் தெளிவாகக் கூறுகிறது. ஆனால் அவரது இறுதி இரட்சிப்பைப் பற்றிய பிற்கால இறையியல் அமைப்பு எதையும் இச்சொற்றொடருக்குள் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கருவி’ உருவகத்தைத் தெளிவாக்குகிறது; ‘என் பெயர்,’ ‘முன்பாக,’ ‘இஸ்ரவேலின் மகன்கள்’ ஆகிய மூலத்தின் முக்கிய வேதாகமச் சொற்களும் உருவகங்களும் காக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் தவறான இடங்களில் இருந்ததால், தமிழில் [a] ἐθνῶν-க்கும் [b] υἱῶν Ἰσραήλ-க்கும் உரிய இடங்களில் பொருத்தப்பட்டுள்ளன.
