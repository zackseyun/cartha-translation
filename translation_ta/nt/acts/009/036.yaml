source:
  edition: SBLGNT
  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: ta
  text: யோப்பாவில் தபித்தா[a] என்ற பெயருடைய ஒரு பெண் சீடர் இருந்தார். அந்தப் பெயர் மொழிபெயர்க்கப்படும்போது தொர்க்காஸ் என்று அழைக்கப்படுகிறது. அவர் செய்துவந்த நற்செயல்களாலும் இரக்கச் செயல்களாலும் நிறைந்தவராக இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தொர்க்காஸ் என்பது தபித்தா என்பதற்கு இணையான கிரேக்கப் பெயர்; இப்பெயருக்கு “காட்டுமான்” என்று பொருள்.
    reason: பெயர்களுக்கிடையிலான மொழிபெயர்ப்பு உறவையும் அவற்றின் சொற்பொருளையும் வாசகருக்குத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: μαθήτρια
  choice: பெண் சீடர்
  rationale: கிரேக்கச் சொல் பெண்பாலுக்குரியது. தமிழில் ‘பெண் சீடர்’ என்பது அந்தத் தகவலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Ταβιθά
  choice: தபித்தா
  rationale: கிரேக்க மூலத்தில் உள்ள தனிப்பெயரின் ஒலியை நவீன தமிழில் நேரடியாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: அந்தப் பெயரை மொழிபெயர்த்தால், அவர் தொர்க்காஸ் என்று அழைக்கப்படுகிறார்
  rationale: செமித்தியப் பெயருக்கு வழங்கப்படும் கிரேக்க இணைப்பெயரை விளக்கும் மூலத்தின் மொழிபெயர்ப்பு-பெயரிடல் அமைப்பைத் தக்கவைக்கிறது.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: நற்செயல்களால் நிறைந்தவராக
  rationale: ‘நிறைந்த’ என்ற மூல உருவகத்தையும், ἔργων ἀγαθῶν என்பதன் வழக்கமான பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐλεημοσυνῶν
  choice: இரக்க உதவிகள்
  rationale: தேவையுள்ளோருக்குக் காட்டப்படும் இரக்கத்தையும் நடைமுறை உதவியையும் குறிக்கிறது; பணத் தானமாக மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: ὧν ἐποίει
  choice: அவர் செய்துவந்த
  rationale: இறந்தகாலத் தொடர்நிலையான ἐποίει காட்டும் வழக்கமான அல்லது தொடர்ச்சியான செயலைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δέ
  choice: தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ கதை நகர்வை மெதுவாக இணைக்கிறது. தமிழில் வசனத் தொடக்கத்தில் கூடுதல் இடைச்சொல் சேர்க்காமல் இயல்பான தொடர்ச்சி கிடைக்கிறது.
theological_decisions:
- issue: μαθήτρια என்பதிலுள்ள பெண்பால் தகவல்
  choice: பெண் சீடர்
  alternative: சீடர்
  rationale: இந்த அரிய பெண்பால் வடிவம் அந்த நபர் ஒரு பெண் சீடர் என்பதை வெளிப்படையாகக் கூறுகிறது. தமிழில் அதை மறைக்காமல் இயல்பாகத் தெரிவிக்க ‘பெண் சீடர்’ பயன்படுத்தப்பட்டது.
- issue: ἐλεημοσυνῶν என்பதன் பொருள் எல்லை
  choice: இரக்க உதவிகள்
  alternative: தானதருமங்கள்
  rationale: இச்சொல் ஏழைகளுக்குக் கொடுக்கும் தானத்தைக் குறிக்கக்கூடும்; எனினும் இச்சூழலில் இரக்கத்தால் செய்யப்படும் உதவிகளைச் சற்றுப் பரந்தவாறு எடுத்துரைக்கிறது. குறிப்பிட்ட சமய அல்லது நிறுவன வழக்கைத் திணிக்காமல் அந்த நெறிசார் வலிமை காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் ‘நிறைந்த’ உருவகமும் தொடர்ச்சியான செயலும் காக்கப்பட்டுள்ளன.
