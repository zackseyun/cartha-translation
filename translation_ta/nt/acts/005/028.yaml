source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: ta
  text: 'அவர் கூறினார்: “இந்தப் பெயரில் கற்பிக்கக் கூடாது என்று நாங்கள் உங்களுக்குக் கண்டிப்பாகக் கட்டளையிட்டோம். இதோ, நீங்கள் உங்கள் போதனையால் எருசலேமை நிரப்பிவிட்டீர்கள்; இந்த மனிதனின் இரத்தத்தை எங்கள்மேல் கொண்டுவர நினைக்கிறீர்கள்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, “இந்த மனிதனின் மரணத்துக்கு எங்களைப் பொறுப்பாக்க நினைக்கிறீர்கள்.” ஒருவருடைய ‘இரத்தத்தை’ மற்றவர்கள்மேல் கொண்டுவருவது, அந்த மரணத்திற்கான இரத்தப்பழியை அவர்கள்மேல் சுமத்துவதைக் குறிக்கும் கிரேக்க மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: அவர் கூறினார்
  rationale: இது முந்தைய வசனத்தில் தலைமை ஆசாரியர் கேட்ட கேள்வியை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான நேரடி உரை அறிமுகமாக இவ்வாறு வழங்கப்பட்டது.
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: நாங்கள் உங்களுக்குக் கண்டிப்பாகக் கட்டளையிட்டோம்
  rationale: பெயர்ச்சொல்லும் அதே வேரைக் கொண்ட வினைச்சொல்லும் சேர்ந்த கிரேக்க அமைப்பு கட்டளையின் தீவிரத்தை வலியுறுத்துகிறது; ‘கண்டிப்பாகக் கட்டளையிட்டோம்’ அந்த வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μὴ διδάσκειν
  choice: கற்பிக்கக் கூடாது என்று
  rationale: தடையின் உள்ளடக்கத்தை நேரடியாகக் காட்டுகிறது; ‘கற்பிப்பதை நிறுத்துங்கள்’ என்று மூலத்தைவிட விளக்கமாக்கவில்லை.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: இந்தப் பெயரில்
  rationale: அந்தப் பெயருடன் தொடர்புடைய அதிகாரத்தின் பேரில் கற்பிப்பதை இச்சொற்றொடர் குறிக்கலாம். ‘இந்தப் பெயரில்’ அந்த நுட்பத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἰδοὺ
  choice: ஆனால் பாருங்கள்
  rationale: ἰδοὺ என்பதின் கவனத்தை ஈர்க்கும், எதிர்கொள்ளும் வலிமையை ‘பாருங்கள்’ தருகிறது; தமிழில் வாக்கியத் தொடர்பை இயல்பாக்க ‘ஆனால்’ சேர்க்கப்பட்டது.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: நீங்கள் ... எருசலேமை நிரப்பிவிட்டீர்கள்
  rationale: நிறைவேறிய செயலின் தற்போதைய விளைவை கிரேக்க நிறைவுக்காலம் சுட்டுகிறது; ‘நிரப்பிவிட்டீர்கள்’ அதையும் மூல உருவகத்தையும் காக்கிறது.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: உங்கள் போதனையால்
  rationale: எருசலேம் எதனால் நிரம்பியது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது. ‘போதனை’ என்பது சமயப் பிரிவுசார் அதிகப்படியான பொருளைச் சேர்க்காமல் διδαχή என்பதைக் காட்டுகிறது.
- source_word: βούλεσθε
  choice: நினைக்கிறீர்கள்
  rationale: இங்கு விருப்பத்தையும் நோக்கத்தையும் குறிக்கும் வினைச்சொல் குற்றஞ்சாட்டும் சூழலில் ‘நினைக்கிறீர்கள்’ என்று இயல்பாக வருகிறது.
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: எங்கள்மேல் கொண்டுவர
  rationale: ஒரு பொறுப்பையோ குற்றத்தையோ ஒருவர்மேல் கொண்டு வருதல் என்ற மூல உருவகத்தை அப்படியே பாதுகாக்கிறது.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: இந்த மனிதனின் இரத்தத்தை
  rationale: இயேசுவைப் பெயரால் குறிப்பிடாமல் விலக்கிப் பேசும் குற்றஞ்சாட்டுபவர்களின் தொனியையும், மரணத்திற்கான பழியைச் சுட்டும் இரத்த உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: ‘இந்த மனிதனின் இரத்தத்தை எங்கள்மேல் கொண்டுவர’ என்பதன் பொருள்
  choice: முதன்மை உரையில் இரத்தத்தை ஒருவர்மேல் கொண்டுவரும் மூல உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘இந்த மனிதனின் மரணத்துக்கு எங்களைப் பொறுப்பாக்க நினைக்கிறீர்கள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: கிரேக்க மரபுத்தொடர் அவரது மரணத்திற்கான பொறுப்பையோ இரத்தப்பழியையோ சுமத்துவதைக் குறிக்கிறது. ஆனால் முதன்மை உரையில் அதை விளக்கவுரையாக மாற்றாமல், மூலத்தின் உருவகத்தையும் இறையியல் அழுத்தத்தையும் காத்து, பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துவது ஏற்றது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் குற்றஞ்சாட்டும் நேரடித் தொனியும் பேணப்பட்டுள்ளன. மூலத்தின் ‘பெயர்’, ‘நிரப்புதல்’, ‘இரத்தத்தை எங்கள்மேல் கொண்டுவருதல்’ ஆகிய முக்கிய உருவகங்கள் விளக்கமாகக் கரைக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
