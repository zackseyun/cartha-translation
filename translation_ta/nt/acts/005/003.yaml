source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: ta
  text: ஆனால் பேதுரு, “அனனியாவே, பரிசுத்த ஆவியிடம் பொய் சொல்லவும்[a], நிலத்தின் விற்பனைத் தொகையில் ஒரு பகுதியை மறைத்து வைத்துக்கொள்ளவும்[b] சாத்தான் உன் உள்ளத்தை ஏன் நிரப்பினான்?” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஆவியை ஏமாற்றவும்.” எனினும், கிரேக்க வினை இங்கு ஒருவரிடம் பொய் சொல்வதை நேரடியாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நிலத்தின் விற்பனைத் தொகை” என்பதை “சொத்தின் விற்பனைத் தொகை” அல்லது “வயலின் விலை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: ஆனால் பேதுரு ... என்று கேட்டார்
  rationale: δέ இங்கு அனனியாவின் செயலைப் பேதுரு எதிர்கொள்ளும் திருப்பத்தைக் குறிக்கும் மென்மையான எதிர்மறை இணைப்பாக உள்ளது; நேரடியான கேள்வி தொடர்வதால் தமிழில் ‘என்று கேட்டார்’ இயல்பாக உள்ளது.
- source_word: διὰ τί
  choice: ஏன்
  rationale: காரணத்தை வினவும் கிரேக்கச் சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: சாத்தான் உன் உள்ளத்தை ஏன் நிரப்பினான்
  rationale: ‘நிரப்பினான்’ என்ற உருவகத்தைத் தக்கவைத்து, அதை ஆட்கொள்ளுதல் அல்லது கட்டாயப்படுத்துதல் என்று மிகைவிளக்கம் செய்யவில்லை. καρδία என்பதற்கு இச்சூழலில் இயல்பான ‘உள்ளம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியிடம் பொய் சொல்லவும்
  rationale: ψεύδομαι + நபரைக் குறிக்கும் வேற்றுமை அமைப்பு இங்கு ஒருவரிடம் பொய் சொல்வதைக் குறிக்கிறது. இரு கிரேக்க வினையெச்சங்களின் இணை அமைப்பை ‘பொய் சொல்லவும் ... மறைத்து வைத்துக்கொள்ளவும்’ என்று தக்கவைத்துள்ளது.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவி
  rationale: நவீனத் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும், மரியாதையான நேரடி மொழிபெயர்ப்பு.
- source_word: νοσφίσασθαι
  choice: ஒரு பகுதியை மறைத்து வைத்துக்கொள்ளவும்
  rationale: தனக்கென ஒரு பகுதியை இரகசியமாக வைத்துக்கொள்ளும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறுமனே ‘வைத்துக்கொள்’ என்பதைக் காட்டிலும் மறைத்தலின் கூறையும் காக்கிறது.
- source_word: ἀπὸ τῆς τιμῆς τοῦ χωρίου
  choice: நிலத்தை விற்ற பணத்தில் ஒரு பகுதியை
  rationale: ἀπό முழுத் தொகையிலிருந்து ஒரு பகுதியைக் குறிக்கிறது; τιμή இச்சூழலில் விற்பனைத் தொகை. ‘நிலத்தை விற்ற பணம்’ என்பது சாதாரண வாசகருக்குத் தெளிவான தமிழ்.
theological_decisions:
- issue: அனனியாவின் உள்ளத்தைச் சாத்தான் நிரப்பியதில் உள்ள செயற்பாடு
  choice: ‘சாத்தான் உன் உள்ளத்தை ... நிரப்பினான்’ என்ற உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘சாத்தான் உன்னை ஆட்கொண்டான்’ அல்லது ‘சாத்தான் உன் உள்ளத்தை நிரப்ப நீ ஏன் அனுமதித்தாய்’
  rationale: கிரேக்கத்தில் ‘சாத்தான்’ வினையின் எழுவாய்; அதேவேளையில் கேள்வி அனனியாவின் பொறுப்பையும் முன்வைக்கிறது. பேய்ப்பிடித்தல், முழுக் கட்டுப்பாடு, அல்லது அனுமதி ஆகியவற்றில் எதையும் உரை வெளிப்படையாகக் கூறாததால் அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் காக்கப்பட்டுள்ளது.
- issue: பரிசுத்த ஆவியிடம் பொய் சொல்லுதல்
  choice: ‘பரிசுத்த ஆவியிடம் பொய் சொல்லவும்’
  alternative: ‘பரிசுத்த ஆவியை ஏமாற்றவும்’ அல்லது ‘பரிசுத்த ஆவியின் முன்னிலையில் பொய் சொல்லவும்’
  rationale: கிரேக்க அமைப்பின் நேரடியான, தனிப்பட்ட தொடர்பைத் தக்கவைக்கிறது; பரிசுத்த ஆவியைப் பற்றிய கூடுதல் கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளது. ‘அனனியாவே’ என்ற விளிவடிவம் நேரடி கண்டனத்தின் தனிப்பட்ட தொனியைத் தக்கவைக்கிறது. ‘இருதயம்’ என்பதற்குப் பதில் பொதுவாசகருக்கு இயல்பான ‘உள்ளம்’ பயன்படுத்தப்பட்டாலும், கிரேக்க உருவகம் மாற்றப்படவில்லை.
