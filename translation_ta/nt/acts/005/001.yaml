source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις Ἁνανίας ὀνόματι σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ ἐπώλησεν κτῆμα
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: ta
  text: ஆனால், அனனியா என்ற ஒருவன் தன் மனைவியான சப்பீராளுடன் சேர்ந்து ஒரு சொத்தை[a] விற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு உடைமையை.” கிரேக்கச் சொல் பொதுவாக ஒரு உடைமை அல்லது சொத்தைக் குறிக்கலாம்; சூழலில் அது அசையாச் சொத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ … τις
  choice: ஒருவன்
  rationale: இது கதையில் ஓர் ஆண் நபரை அறிமுகப்படுத்தும் இயல்பான தமிழ்ச் சொல்லாக்கம்; திருமண உறவு பின்னர் வெளிப்படையாகக் கூறப்படுவதால் ‘கணவன்’ என்று மொழிபெயர்க்கவில்லை.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய பகுதியில் பர்னபாவின் செயலைத் தொடர்ந்து வரும் அனனியாவின் மாறுபட்ட செயலை உணர்த்தும் மென்மையான எதிர்மறைத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: Ἁνανίας ὀνόματι
  choice: அனனியா என்ற
  rationale: ὀνόματι என்பதன் ‘பெயருள்ள/என்ற’ என்னும் பொருளை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: தன் மனைவியான சப்பீராளுடன் சேர்ந்து
  rationale: σύν குறிக்கும் உடன்சேர்ந்த பங்கேற்பையும் γυνή இங்கு குறிக்கும் மனைவி என்ற உறவையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπώλησεν
  choice: விற்றான்
  rationale: πωλέω என்ற வினையின் இறந்தகாலக் கதையுரைச் செயலை நேரடியாக வழங்குகிறது.
- source_word: κτῆμα
  choice: ஒரு நிலச்சொத்தை
  rationale: சொத்து அல்லது உடைமை என்ற பரந்த பொருளுடைய இச்சொல், அப்போஸ்தலர் 4–5 அதிகாரங்களின் விற்பனைச் சூழலில் அசையாச் சொத்தைச் சுட்டலாம். இருப்பினும் அதன் பரந்த சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பர்னபாவைப் பற்றிய முந்தைய நிகழ்வுடன் உள்ள கதையுரை மாறுபாடு
  choice: δέ என்பதை ‘ஆனால்’ என்று மொழிபெயர்த்தல்
  alternative: ‘இந்நிலையில்’ அல்லது ‘மேலும்’ என்று மென்மையான தொடர்ச்சியாக மொழிபெயர்த்தல்
  rationale: முந்தைய நேர்மறை எடுத்துக்காட்டுக்கும் இப்போது தொடங்கும் நிகழ்வுக்கும் இடையிலான மாறுபாட்டை உரையிலுள்ள தொடர்புச்சொல்லின் இயல்பான வரம்புக்குள் தெளிவாக்குகிறது.
- issue: κτῆμα குறிக்கும் சொத்தின் தன்மை
  choice: முதன்மை உரையில் ‘நிலச்சொத்து’ என்று வழங்கி, பரந்த பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘ஒரு சொத்து’ அல்லது ‘ஒரு உடைமை’ என்று மட்டும் வழங்குதல்
  rationale: உடனடி சூழல் நிலம் அல்லது அசையாச் சொத்து விற்பனையைச் சுட்டினாலும், கிரேக்கச் சொல் அதைவிடப் பரந்த பொருள் கொள்ளக்கூடும்; எனவே சூழலும் சொற்பொருள் தெளிவின்மையும் இரண்டும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு இயல்பாகவும் மரியாதைமிக்க கதையுரை நடையிலும் அமைக்கப்பட்டது. பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு வடிவங்களான ‘அனனியா’, ‘சப்பீராள்’ என வழங்கப்பட்டுள்ளன.
