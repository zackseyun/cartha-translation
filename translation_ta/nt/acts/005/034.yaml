source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: ta
  text: ஆனால் ஆலோசனைச் சங்கத்தில்[a] கமாலியேல் என்னும் பரிசேயர் ஒருவர் எழுந்து நின்றார். அவர் திருச்சட்டப் போதகராகவும் மக்கள் அனைவராலும் மதிக்கப்பட்டவராகவும் இருந்தார். அந்த ஆண்களைச் சிறிது நேரம் வெளியே அனுப்பும்படி அவர் கட்டளையிட்டார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது யூதர்களின் ஆளும் மன்றமான சனெத்ரினைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: கிரேக்க மொழியில் சொல்லுக்குச் சொல், “அந்த ஆண்களைச் சிறிது நேரம் வெளியே இருக்கச் செய்யும்படி”; அவர்களைத் தற்காலிகமாக வெளியேற்றுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: எழுந்து நின்றார்
  rationale: சபையில் கமாலியேல் பொதுவாக எழுந்து பேசத் தொடங்கிய உடல் செயலையும் கதை நகர்வையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து கமாலியேலின் தலையீட்டுக்குத் திரும்பும் மெல்லிய முரண்பாட்டைச் சுட்டுகிறது.
- source_word: τις
  choice: ஒருவர்
  rationale: புதிய நபரை அறிமுகப்படுத்தும் கிரேக்கச் சொல்லின் குறிப்பின்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: συνεδρίῳ
  choice: ஆலோசனைச் சங்கத்தில்
  rationale: யூதர்களின் ஆளும் மன்றத்தைக் குறிக்கும் சொல்லை நேரடியாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் வழங்குகிறது; அதன் வரலாற்றுப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Φαρισαῖος
  choice: பரிசேயர்
  rationale: அக்கால யூத சமயக் குழுவின் வழக்கமான தமிழ்ப் பெயர்.
- source_word: ὀνόματι Γαμαλιήλ
  choice: கமாலியேல் என்னும்
  rationale: பெயரை அறிமுகப்படுத்தும் கிரேக்கத் தொடருக்கான இயல்பான தமிழ் அமைப்பு.
- source_word: νομοδιδάσκαλος
  choice: திருச்சட்டப் போதகர்
  rationale: இங்கு νόμος என்பது பொதுவான சட்டத்தை அல்ல, மோசேயின் திருச்சட்டத்தைக் குறிக்கிறது; போதிக்கும் பொறுப்பையும் தெளிவாகக் காக்கிறது.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: மக்கள் அனைவராலும் மதிக்கப்பட்டவர்
  rationale: கமாலியேலுக்கு மக்களிடையே இருந்த பொது மதிப்பையும் மரியாதையையும் இயல்பான தமிழில் தெரிவிக்கிறது; 'இஸ்ரவேல் மக்கள்' என்று மூலத்தைவிடக் குறிப்பாக்கவில்லை.
- source_word: ἐκέλευσεν
  choice: கட்டளையிட்டார்
  rationale: நீதிமன்றச் சூழலில் அதிகாரத்துடன் வழங்கப்பட்ட அறிவுறுத்தலின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἔξω ... ποιῆσαι
  choice: வெளியே அனுப்பும்படி
  rationale: சொல்லுக்குச் சொல் 'வெளியே இருக்கச் செய்ய' என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: βραχύ
  choice: சிறிது நேரம்
  rationale: செயலின் குறுகிய கால அளவைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: τοὺς ἀνθρώπους என்பதன் பாலினக் குறிப்பு
  choice: அந்த ஆண்களை
  alternative: அந்த நபர்களை / அவர்களை
  rationale: இச்சூழலில் மன்றத்தின் முன் நின்ற ஆண் அப்போஸ்தலர்களையே இச்சொல் குறிக்கிறது; எனவே மூலத்தின் பாலினக் குறிப்பை மறைக்காமல் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரை. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘திருச்சட்டம்’ என்பது இங்கு மோசேயின் சட்டத்தைக் குறிக்கப் பயன்படுத்தப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இணைக்கப்பட்டுள்ளன.
