  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: ta
  text: ஆனால், அவர்கள் இதைக் கேட்டபோது கடும் சினமடைந்து[a], அவர்களைக் கொன்றுவிட விரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்படியாக, ‘அவர்கள் உள்ளுக்குள் அறுக்கப்பட்டார்கள்’ அல்லது ‘அவர்கள் உள்ளம் பிளந்துபோனது’ என மொழிபெயர்க்கலாம்; இங்கு அது அவர்களுடைய தீவிரமான பகைமை கலந்த கொந்தளிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: ஆனால், அவர்கள்
  rationale: δέ இங்கு அப்போஸ்தலர்களின் பேச்சிலிருந்து அவையின் எதிர்வினைக்குத் திரும்பும் மிதமான எதிர்மறைத் தொடர்பைக் காட்டுகிறது; substantival article முந்தைய சூழலில் குறிப்பிடப்பட்டவர்களைக் குறிக்கிறது.
- source_word: ἀκούσαντες
  choice: அவர்கள் இதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை காலத்தொடர்பாக இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது; கேட்கப்பட்டதன் பொருள் முந்தைய உரையிலிருந்து புரிவதால் ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: διεπρίοντο
  choice: கடும் சினமடைந்து
  rationale: இச்சொல் சொற்படியாக ‘அறுக்கப்படுதல்/வாளால் பிளக்கப்படுதல்’ போன்ற தீவிரமான உருவகத்தைக் கொண்டிருந்தாலும், இச்சூழலில் கொலை செய்யத் தூண்டும் பகைமையான கடுஞ்சினத்தைக் குறிக்கிறது. உருவகத்தின் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐβούλοντο
  choice: விரும்பினார்கள்
  rationale: இறந்தகால imperfect வடிவம் தொடர்ந்த மனவிருப்பம் அல்லது நோக்கத்தைக் காட்டுகிறது; தமிழில் ‘விரும்பினார்கள்’ இயல்பாக அதைப் பகர்கிறது.
- source_word: ἀνελεῖν
  choice: கொன்றுவிட
  rationale: ἀναιρέω இச்சூழலில் உயிரைப் பறிப்பதைக் குறிக்கிறது; ‘கொன்றுவிட’ நேரடியானதும் இயல்பானதும் ஆகும்.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: இப்பெயர்ப்பதிலி விசாரணைக்கு உட்பட்ட அப்போஸ்தலர்களைக் குறிக்கிறது.
