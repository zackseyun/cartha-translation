    text: ‘திருச்சபை’ என்பதற்கு மாற்றாக ‘சபை’ அல்லது ‘கூட்டம்’ என்றும் மொழிபெயர்க்கலாம் (ἐκκλησία).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ஏற்பட்டது
  rationale: φόβος என்பதை எழுவாயாகக் கொண்ட இந்த நிகழ்வை, இயல்பான நவீனத் தமிழில் ‘பயம் ஏற்பட்டது’ என்று சொல்வது கிரேக்க வினையின் நிகழ்வுத் தன்மையைப் பாதுகாக்கிறது.
- source_word: φόβος μέγας
  choice: மிகுந்த பயம்
  rationale: அனனியாவுக்கும் சப்பீராளுக்கும் நேர்ந்த தெய்வீகத் தீர்ப்பின் உடனடிச் சூழலில் φόβος என்பது முதன்மையாகப் பயத்தைக் குறிக்கிறது; μέγας அதன் தீவிரத்தை வலியுறுத்துகிறது.
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: திருச்சபை முழுவதற்கும்
  rationale: ἐκκλησία இங்கு விசுவாசிகளின் சமூகத்தைக் குறிக்கிறது. ‘திருச்சபை’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற சொல்; ὅλην குறிப்பிடும் முழுமையும் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: இவற்றைக் கேள்விப்பட்ட அனைவருக்கும்
  rationale: ταῦτα என்பதன் பன்மை ‘இவற்றை’ எனப் பாதுகாக்கப்படுகிறது. இங்கு கேட்டது சம்பவங்களைப் பற்றிய செய்தி என்ற இயல்பான பொருளைத் தமிழில் ‘கேள்விப்பட்ட’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐκκλησία என்பதன் மொழிபெயர்ப்பு
  choice: திருச்சபை
  alternative: சபை / கூடுகை
  rationale: அப்போஸ்தலர் நடபடிகளில் இச்சொல் கிறிஸ்துவை விசுவாசிக்கும் சமூகத்தைக் குறிக்கிறது. ‘திருச்சபை’ அந்தக் குறிப்பை இயல்பாகத் தருகிறது; அதேவேளை மூலச்சொல்லின் ‘சபை’ அல்லது ‘கூடுகை’ என்ற மொழிபெயர்ப்பு வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் இரு தரப்புகளையும் இணைக்கும் அமைப்பும், ‘முழுவதற்கும் / அனைவருக்கும்’ என்ற விரிவும் பாதுகாக்கப்பட்டுள்ளன.
