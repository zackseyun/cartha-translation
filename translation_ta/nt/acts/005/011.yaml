  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: ta
  text: முழுத் திருச்சபையின்மேலும், இவற்றைக் கேட்ட அனைவர்மேலும், மிகுந்த பயம் வந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
