  source_fidelity: ‘அப்போது’ என்பது கிரேக்க καί (‘மேலும்/அப்பொழுது’ அல்ல) என்பதைக் காலக் குறிப்பாகச் சற்றே குறிப்பாக்குகிறது. மேலும் ἐπί + accusative-ன் ‘மேல்/மீது வந்தது’ என்ற தாக்கம் ‘...க்கும் பயம் ஏற்பட்டது’ என்பதில் மெலிதாகிறது. ‘வந்தது’ மற்றும் ‘மேலும்’ மூலம் மூலத்தின் அமைப்பும் பொருளும் நேரடியாகப் பாதுகாக்கப்படுகின்றன.
  naturalness: ‘முழுத் திருச்சபையின்மேலும் ... அனைவர்மேலும் மிகுந்த பயம் வந்தது’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. ‘இவற்றைக் கேட்ட’ என்பது மூலத்தின் நேரடியான ‘these things’ என்பதை ‘கேள்விப்பட்ட’ என்பதைவிட நெருக்கமாகக் காட்டுகிறது.
  terminology: ‘திருச்சபை’ இச்சூழலில் ἐκκλησίαக்கு நிலைபெற்ற, பொருத்தமான சொல். அடிக்குறிப்பில் மாற்றாக ‘சபை’ மற்றும் ‘கூட்டம்’ எனக் குறிப்பிடலாம்; ‘கூடுகை’ என்பது சமூகத்தைக் காட்டிலும் கூடும் செயலைக் குறிக்கக்கூடும்.
