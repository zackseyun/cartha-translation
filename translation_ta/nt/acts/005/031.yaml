  source_fidelity: 'மூலத்தின் முக்கியக் கூறுகள் சரியாக உள்ளன: வலியுறுத்தப்பட்ட சுட்டுப்பெயர், தலைவரும் மீட்பரும் என்ற இரட்டைப் பதவி, வலப்பக்க உயர்த்துதல், இஸ்ரவேலுக்கான மனந்திரும்புதலும் பாவமன்னிப்பும். ஆனால் ‘அருளும்படி இப்படிச் செய்தார்’ என்பது கிரேக்கத்தின் எளிய நோக்க-வினையெச்ச அமைப்பை இரண்டு கூறுகளாக்கி, ‘இப்படிச் செய்தார்’ என்ற கூடுதல் சொல்லைச் சேர்க்கிறது. ‘அளிப்பதற்காக’ மூலத்தின் τοῦ δοῦναι என்பதை நேராகவும் இயல்பாகவும் தருகிறது. மேலும் ἁμαρτιῶν பன்மையை ‘பாவங்களின் மன்னிப்பு’ என வெளிப்படுத்தலாம்.'
