source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: ta
  text: இவரையே கடவுள் தலைவராகவும் மீட்பராகவும் தமது வலப்பக்கத்துக்கு உயர்த்தினார்[a], இஸ்ரவேலருக்கு மனந்திரும்புதலையும் பாவங்களின் மன்னிப்பையும் அளிப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது வலக்கையால் உயர்த்தினார்.” கிரேக்கச் சொற்றொடரை கருவிப்பொருளாகவும் புரிந்துகொள்ளலாம்; ஆனால் இங்கு அது கடவுளின் வலப்பக்கத்திலுள்ள உயரிய மரியாதைக்குரிய இடத்துக்கு உயர்த்தப்பட்டதைக் குறிப்பதாக இருக்க அதிக வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: இவரையே
  rationale: சுட்டுப்பெயரின் வலியுறுத்தலைப் பாதுகாத்து, முன் குறிப்பிடப்பட்ட இயேசுவையே குறிப்பாகச் சுட்டுகிறது.
- source_word: ἀρχηγὸν
  choice: தலைவராக
  rationale: தலைமை வகிப்பவர் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; பழமையான அரசப் பட்டத்தைத் தேவையின்றி புகுத்தவில்லை.
- source_word: σωτῆρα
  choice: மீட்பராக
  rationale: விடுவித்தல் மற்றும் இரட்சிப்பின் பொருள் இரண்டையும் இச்சூழலில் தெளிவாகத் தாங்கும் வழக்கமான தமிழ் சொல்.
- source_word: ὕψωσεν
  choice: உயர்த்தினார்
  rationale: உடலளவில் தூக்குதல் மட்டுமல்லாமல் உயரிய மதிப்பும் அதிகாரமும் உள்ள நிலைக்கு உயர்த்துதல் என்ற பொருளையும் தாங்குகிறது.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: தமது வலப்பக்கத்திற்கு
  rationale: கடவுளின் வலப்பக்கத்தில் உயரிய மரியாதை மற்றும் அதிகாரமுள்ள இடத்துக்கு உயர்த்தப்பட்டதைக் காட்டும் இடப்பொருள் வாசிப்பை முதன்மைப்படுத்துகிறது; கருவிப்பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῦ δοῦναι
  choice: அருளும்படி
  rationale: நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கொடுத்தல் இங்கு கடவுளின் அருளாக வழங்கப்படுவதைச் சூழலுக்கேற்பத் தெரிவிக்கிறது.
- source_word: μετάνοιαν
  choice: மனந்திரும்புதலை
  rationale: வெறும் எண்ணமாற்றம் அல்லாமல் கடவுளை நோக்கித் திரும்பும் தீர்மானமான மாற்றத்தைத் தெரிவிக்கும், தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற சொல்.
- source_word: τῷ Ἰσραὴλ
  choice: இஸ்ரவேலருக்கு
  rationale: கொடையின் பெறுநரைத் தெளிவாகக் காட்டுகிறது; மக்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: பாவமன்னிப்பை
  rationale: புதிய ஏற்பாட்டில் நிலைபெற்ற கருத்தைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: கடவுளின் வலப்பக்கம் என்ற சொற்றொடரில் இயேசுவின் உயர்த்தப்படுதல்
  choice: இயேசு கடவுளின் வலப்பக்கத்திலுள்ள உயரிய மரியாதை மற்றும் அதிகார நிலைக்கு உயர்த்தப்பட்டார்.
  alternative: கடவுள் தமது வல்லமையுள்ள வலக்கையால் இவரை உயர்த்தினார்.
  rationale: சொற்றொடரின் வேற்றுமை உருபு கருவிப்பொருளையும் அனுமதித்தாலும், உயர்த்துதல் பற்றிய சூழலும் புதிய ஏற்பாட்டின் அரியணை/வலப்பக்க மொழிநடையும் இடப்பொருள் வாசிப்பை ஆதரிக்கின்றன. உண்மையான மாற்று சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில், மூலத்தின் வலியுறுத்தலும் இலக்கணத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன. ‘இவரையே’ சுட்டுப்பெயரின் அழுத்தத்தைத் தருகிறது; ‘மனந்திரும்புதல்’ μετάνοια என்பதன் சமய மற்றும் செயல்முறை ஆழத்தை இயல்பாகத் தெரிவிக்கிறது.
