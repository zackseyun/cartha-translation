reference: Acts 5:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: ta
  text: அப்போஸ்தலர்களின் கைகள் வழியாக மக்களிடையே பல அடையாளங்களும் அற்புதங்களும் செய்யப்பட்டுவந்தன. அவர்கள் அனைவரும் ஒருமனப்பட்டு[a] சாலொமோனின் தூண்மண்டபத்தில்[b] இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒன்றாக.” கிரேக்கச் சொல் உடல்ரீதியாக ஒன்றுகூடியிருப்பதோடு பகிரப்பட்ட மனஒற்றுமையையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சாலொமோனின் மண்டபத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: அப்போஸ்தலர்களின் கைகளின் வழியாக
  rationale: διά உடன் வரும் genitive, செயல் நடைபெறும் கருவி அல்லது முகமையைச் சுட்டுகிறது. கிரேக்கத்தின் தெளிவான ‘கைகளின் வழியாக’ என்ற சொல்லாட்சியைத் தக்கவைத்துள்ளது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் கதைத் தொடர்ச்சியை மென்மையாக முன்னெடுக்கிறது. தமிழில் தனியான ‘இப்போது’ அல்லது ‘ஆனால்’ சேர்ப்பது தேவையற்ற வலியுறுத்தலை உண்டாக்கும்; வாக்கியத் தொடர்ச்சியே அதன் பங்கை நிறைவேற்றுகிறது.
- source_word: ἐγίνετο
  choice: செய்யப்பட்டுவந்தன
  rationale: Imperfect வடிவம் கடந்தகாலத்தில் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நடைபெற்ற செயலைக் காட்டுகிறது; passive சொல்லமைப்பு அடையாளங்களும் அற்புதங்களும் அப்போஸ்தலர்கள் வழியாகச் செய்யப்பட்டதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: σημεῖα καὶ τέρατα
  choice: அடையாளங்களும் அற்புதங்களும்
  rationale: லூக்காவின் எழுத்துகளில் காணப்படும் இணைச்சொல்லை இயல்பான, மரியாதையான நவீன தமிழில் வழங்குகிறது; மூலத்தில் இல்லாத ‘அதிசயமான’ போன்ற விளக்கச்சொல் சேர்க்கப்படவில்லை.
- source_word: πολλὰ
  choice: பல
  rationale: இச்சொல் அடையாளங்களும் அற்புதங்களும் இரண்டையும் அளவுப்படுத்துகிறது.
- source_word: ἐν τῷ λαῷ
  choice: மக்களிடையே
  rationale: செயல்கள் மக்களின் நடுவில் நிகழ்ந்தன என்ற இடம் அல்லது சூழலைத் தெரிவிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத இன அடையாளம் சேர்க்கப்படவில்லை.
- source_word: ὁμοθυμαδὸν
  choice: ஒன்றாக
  rationale: உடனிருப்பதையும் கூட்டாக இருப்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது. பகிரப்பட்ட மனஒற்றுமை என்ற கூடுதல் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἅπαντες
  choice: அவர்கள் அனைவரும்
  rationale: குறிப்பிடப்படும் முழுக் குழுவையும் உள்ளடக்குகிறது; அந்தக் குழு யார் என்பதை மொழிபெயர்ப்பு குறுக்கிப் பொருள்கொள்ளவில்லை.
- source_word: Στοᾷ Σολομῶντος
  choice: சாலொமோனின் மண்டபத்தில்
  rationale: στοά என்பது கூரையுள்ள தூண்வரிசை மண்டபத்தைக் குறிக்கிறது. ‘மண்டபம்’ பொதுவாசகருக்கு இயல்பானது; துல்லியமான கட்டடவியல் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘அவர்கள் அனைவரும்’ என்பதன் குறிப்பு
  choice: முந்தைய சூழலில் அப்போஸ்தலர்களோடு தொடர்புடைய கூடியிருந்த குழுவைக் குறிக்கும் வகையில், அதன் எல்லையைத் தீர்மானிக்காமல் விடப்பட்டுள்ளது.
  alternative: அப்போஸ்தலர்கள் மட்டும்; அல்லது விசுவாசிகள் அனைவரும்.
  rationale: கிரேக்கத்தில் ἅπαντες என்பதற்கான antecedent வெளிப்படையாகக் கூறப்படவில்லை. ஆகவே அப்போஸ்தலர்கள் மட்டும் என்றோ திருச்சபை முழுவதும் என்றோ மொழிபெயர்ப்பில் முடிவுசெய்யப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையான நடையைக் கடைப்பிடிக்கிறது. தொடர்ச்சியான கடந்தகாலச் செயலை ‘செய்யப்பட்டுவந்தன’ என்பதும், தெளிவுபடுத்தப்படாத பன்மை எழுவாயை ‘அவர்கள் அனைவரும்’ என்பதும் பாதுகாக்கின்றன.
