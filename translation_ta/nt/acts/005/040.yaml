source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: ta
  text: அப்போஸ்தலர்களை அழைத்து, அவர்களை அடித்த பின்பு, இயேசுவின் பெயரில்[a] பேசக்கூடாது என்று கட்டளையிட்டு, அவர்களை விடுவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இயேசுவின் பெயரைக் குறித்து’ அல்லது ‘இயேசுவின் பெயரின் அதிகாரத்தின் அடிப்படையில்.’ இந்தக் கிரேக்க மரபுத்தொடர் இயேசுவைக் குறித்தும் அவருடைய அதிகாரத்தின் கீழும் பேசுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: திரும்பவும் அழைத்து
  rationale: இறந்தகால நடுவினைப் பெயரெச்சம் பிரதான செயல்களுக்கு முந்திய செயலைக் குறிக்கிறது. சூழலில் அப்போஸ்தலர்கள் மீண்டும் அவைக்குள் அழைக்கப்பட்டதால் ‘திரும்பவும் அழைத்து’ என்பது இயல்பாகச் செயல்முறையை வெளிப்படுத்துகிறது.
- source_word: τοὺς ἀποστόλους
  choice: அப்போஸ்தலர்களை
  rationale: அப்போஸ்தலர் என்பது அப்போஸ்தலர் நடபடிகளில் ஆணையுடன் அனுப்பப்பட்ட சாட்சிகளைக் குறிக்கும் நிலைபெற்ற, சூழலுக்குப் பொருத்தமான சொல்.
- source_word: δείραντες
  choice: அவர்களை அடித்த பின்பு
  rationale: δέρω என்பது அடித்தல் அல்லது கடுமையாகத் தாக்குதல் எனப் பொருள்படும். எந்தக் குறிப்பிட்ட தண்டனை முறையையும் தேவையின்றி நிர்ணயிக்காமல், செயலின் கடுமையை ‘அடித்த’ தெளிவாகக் காட்டுகிறது.
- source_word: παρήγγειλαν
  choice: கட்டளையிட்டு
  rationale: παραγγέλλω அதிகாரப்பூர்வமாக உத்தரவிடுதலைக் குறிக்கிறது; ‘கட்டளையிட்டு’ என்பது வலிமையையும் வாக்கியத் தொடர்ச்சியையும் இயல்பாகப் பேணுகிறது.
- source_word: μὴ λαλεῖν
  choice: பேசக்கூடாது என்று
  rationale: μή உடன் வரும் வினையெச்சம் தடையின் உள்ளடக்கத்தைக் குறிக்கிறது. நவீன தமிழில் ‘பேசக்கூடாது என்று’ என்பது தெளிவான அதிகாரப்பூர்வத் தடையாக ஒலிக்கிறது.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: இயேசுவின் பெயரில்
  rationale: இது இயேசுவைக் குறித்து பேசுதல், அவருடைய அதிகாரத்தின் அடிப்படையில் பேசுதல் ஆகிய ஒன்றுக்கு மேற்பட்ட நுணுக்கங்களை உள்ளடக்கக்கூடிய கிரேக்க மரபுத்தொடர். ‘பெயரில்’ அந்தப் பரப்பைச் சுருக்காமல் பேணுகிறது.
- source_word: ἀπέλυσαν
  choice: அவர்களை விடுதலை செய்தார்கள்
  rationale: ἀπολύω இங்கு காவல் அல்லது கட்டுப்பாட்டிலிருந்து விடுவித்தலைக் குறிக்கிறது. சட்டநிலைச் சூழலுக்கு ‘விடுதலை செய்தார்கள்’ பொருந்துகிறது.
theological_decisions:
- issue: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ என்ற மரபுத்தொடரின் பொருள்
  choice: இயேசுவின் பெயரில்
  alternative: இயேசுவின் பெயரைப் பற்றிப்; இயேசுவின் பெயரின் அதிகாரத்தின் அடிப்படையில்
  rationale: அப்போஸ்தலர் நடபடிகளில் இந்தச் சொற்றொடர் இயேசுவைக் குறித்த பொது அறிவிப்பையும், அவருடைய அதிகாரத்துடன் தொடர்புடைய பேச்சையும் உள்ளடக்கலாம். முதன்மை உரை இந்தப் பலநுணுக்கத்தையும் பேணுகிறது; அடிக்குறிப்பு சாத்தியமான பொருள்களை விளக்குகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் செயல்வரிசை பேணப்பட்டுள்ளது; கிரேக்க மரபுத்தொடரின் உண்மையான பொருள் விரிவு அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
