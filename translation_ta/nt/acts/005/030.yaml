  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: ta
  text: நம் முன்னோர்களின் தேவன் இயேசுவை எழுப்பினார்[a]. அவரை நீங்கள் மரத்தில்[b] தொங்கவிட்டுக் கொன்றீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயிர்த்தெழச் செய்தார்’ என்றும் பொருள் கொள்ளலாம். இங்கு இந்த வினை உயிர்த்தெழுதலைக் குறிக்கக்கூடும்; ஆனால் இவ்வசனத்தின் கிரேக்கத்தில் ‘இறந்தோரிலிருந்து’ என்று வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சிலுவையில்.’ கிரேக்கத்தில் ‘மரத்தில்’ என்று உள்ளது; இது உபாகமம் 21:23-ஐ எதிரொலிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: நம் முன்னோர்களின் தேவன்
  rationale: தமிழில் இயல்பாகவும் மரியாதைக்குரிய நடையிலும் இஸ்ரவேலின் முந்தைய தலைமுறையினரைக் குறிக்கிறது; உடன்படிக்கைச் சூழலையும் தக்கவைக்கிறது.
- source_word: ἤγειρεν
  choice: எழுப்பினார்
  rationale: இங்கு உயிர்த்தெழுதலைக் குறிக்கக்கூடும்; எனினும் இவ்வசனத்தில் ‘இறந்தோரிலிருந்து’ என்று வெளிப்படையாக இல்லாததால், மூலத்தின் பொருள் விரிவைச் சுருக்காமல் காக்கிறது.
- source_word: Ἰησοῦν
  choice: இயேசுவை
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்; வாக்கியத்தில் செயப்படுபொருள் வேற்றுமையுடன் தரப்பட்டுள்ளது.
- source_word: διεχειρίσασθε
  choice: கொன்றீர்கள்
  rationale: வன்முறையாக உயிரைப் பறித்த செயலை இச்சூழலில் நேரடியாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: κρεμάσαντες
  choice: தொங்கவிட்டு
  rationale: அவர்கள் அவரைக் கொன்ற விதத்தை விளக்கும் பங்கேற்பு வினையின் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ ξύλου
  choice: மரத்தில்
  rationale: ξύλον என்பதன் ‘மரம்/மரக்கட்டை’ என்ற சொற்பொருளையும் உபாகமம் 21:23-ன் சாத்தியமான எதிரொலியையும் காக்கிறது; ‘சிலுவையில்’ என்று விளக்கமாக மாற்றவில்லை.
theological_decisions:
- issue: ἤγειρεν என்பது உயிர்த்தெழுதலை வெளிப்படையாகக் கூறுகிறதா அல்லது பொதுவாக எழுப்புதலைக் கூறுகிறதா
  choice: எழுப்பினார்
  alternative: இறந்தோரிலிருந்து உயிர்த்தெழச் செய்தார்
  rationale: உடனடிச் சூழல் உயிர்த்தெழுதலை வலுவாகச் சுட்டினாலும், இவ்வசனத்தின் கிரேக்கத்தில் ‘இறந்தோரிலிருந்து’ என்ற சொற்கள் இல்லை. ஆகவே அந்தப் பொருளை கேட்கக்கூடியவாறு வைத்தபடியே இல்லாத சொற்களைச் சேர்க்கவில்லை.
- issue: ξύλον என்பதை ‘மரம்’ என்றே தருவதா அல்லது ‘சிலுவை’ என்று விளக்குவதா
  choice: மரத்தில்
  alternative: சிலுவையில்
  rationale: மூலம் σταυρός என்பதற்குப் பதிலாக ξύλον என்கிறது. ‘மரம்’ என்பது மூலச் சொல் தேர்வையும் உபாகமம் 21:23-ன் சாத்தியமான மறைநூல் எதிரொலியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதும் மரியாதைமிக்கதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிதாக்கள்’ என்ற மரபுச் சொல்லுக்குப் பதிலாக இன்றைய வாசகர்களுக்கு இயல்பான ‘முன்னோர்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. குற்றச்சாட்டின் நேரடித் தன்மையை ‘கொன்றீர்கள்’ காக்கிறது; இரு கிரேக்கச் சொற்களின் பொருள் விரிவுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
