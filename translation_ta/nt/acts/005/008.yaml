source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ ⸂πρὸς αὐτὴν⸃ ⸀Πέτρος· Εἰπέ μοι, εἰ τοσούτου τὸ χωρίον ἀπέδοσθε; ἡ δὲ εἶπεν· Ναί, τοσούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: ta
  text: 'ஆனால் பேதுரு அவளிடம், “என்னிடம் சொல்: அந்த நிலத்தை[a] இவ்வளவு தொகைக்கா விற்றீர்கள்?” என்றார். அவள், “ஆம், இவ்வளவு தொகைக்கு” என்றாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அந்தச் சொத்தை” அல்லது “அந்த வயலை.”
    reason: χωρίον என்ற கிரேக்கச் சொல் நிலப்பகுதி, சொத்து, அல்லது வயல் ஆகியவற்றைக் குறிக்கலாம்.
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν Πέτρος
  choice: ஆனால் பேதுரு அவளிடம் ... என்றார்
  rationale: δέ கதையின் திருப்பத்தைச் சுட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. ἀπεκρίθη என்பது சொற்பட ‘பதிலளித்தார்’ என்றாலும், தமிழில் நேரடி உரையை அறிமுகப்படுத்தும் இடத்தில் ‘என்றார்’ இயல்பாக உள்ளது; πρὸς αὐτήν என்பது ‘அவளிடம்’ எனத் தெளிவாகப் பாதுகாக்கப்பட்டது.
- source_word: Εἰπέ μοι
  choice: என்னிடம் சொல்
  rationale: λέγω என்பதன் கட்டளை வடிவமும் μοι என்பதன் மறைமுக வேற்றுமைப் பொருளும் நேரடியாகவும் இயல்பாகவும் தரப்படுகின்றன.
- source_word: εἰ
  choice: -ஆ என்று வினா அமைப்பு
  rationale: εἰ இங்கு ஆம்/இல்லை வகை மறைமுகக் கேள்வியை அறிமுகப்படுத்துகிறது; தமிழில் நேரடி உரைக்குள் ‘-ஆ?’ வினா அமைப்பு இயல்பானது.
- source_word: τοσούτου
  choice: இவ்வளவுக்குத்தான்
  rationale: முன்னதாகக் குறிப்பிடப்பட்ட தொகையைச் சுட்டும் அளவுப் பொருளை ‘இவ்வளவு’ காக்கிறது; ‘-க்குத்தான்’ கேட்கப்படும் விலைத்தொகையின் துல்லியத்தை இயல்பாக வலியுறுத்துகிறது.
- source_word: τὸ χωρίον
  choice: அந்த நிலம்
  rationale: χωρίον என்பது நிலப்பகுதி, வயல் அல்லது சொத்து எனப் பொருள்படலாம். சூழலில் விற்கப்பட்ட உடைமையைச் சுட்ட ‘அந்த நிலம்’ இயல்பானதும் தேவையற்ற துல்லியத்தைத் தவிர்ப்பதும் ஆகும்.
- source_word: ἀπέδοσθε
  choice: விற்றீர்கள்
  rationale: ἀποδίδωμι வாணிகச் சூழலில் ‘விற்பது’ என்ற பொருள் தருகிறது. பன்மை வடிவத்தின் சாத்தியத்தை ‘விற்றீர்கள்’ காக்கிறது; தமிழில் இது மரியாதை ஒருமையாகவும் குழுவைக் குறிக்கும் பன்மையாகவும் வாசிக்கப்படலாம்.
- source_word: Ναί
  choice: ஆம்
  rationale: எளிய உறுதிப்படுத்தும் பதிலுக்கு நவீனத் தரத் தமிழில் இயல்பான இணைச்சொல்.
- source_word: τοσούτου
  choice: இவ்வளவுக்குத்தான்
  rationale: பதிலின் சுருக்கத்தையும் கேள்வியிலுள்ள சொல்லின் மீளுரைப்பையும் பாதுகாக்கிறது.
