translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள சுருக்கமான பதிலும் விலைத் தொகையைச் சுட்டும் மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘நிலம்’ என்ற சொல்லோடு இணைக்கப்பட்டுள்ளது.
