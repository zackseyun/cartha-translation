id: ACT.5.36
reference: Acts 5:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: ta
  text: ஏனெனில், இந்த நாட்களுக்கு முன்பு தெயுதாஸ் என்பவன் முன்வந்து, தன்னை ஒரு முக்கியமான நபர் என்று சொல்லிக்கொண்டான்.[a] ஏறக்குறைய நானூறு ஆண்கள் அவனுடன் சேர்ந்துகொண்டார்கள்.[b] அவன் கொல்லப்பட்டான்; அவனால் இணங்க வைக்கப்பட்ட அனைவரும்[c] சிதறிப்போய், ஒன்றுமில்லாமல் போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “தன்னை யாரோ ஒருவன் என்று சொல்லிக்கொண்டான்.” இது தன்னை முக்கியத்துவமுள்ள ஒருவனாகக் காட்டிக்கொண்டான் என்னும் பொருளுடைய கிரேக்க மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய பக்கம் சேர்ந்தார்கள்” அல்லது “அவனுடன் தங்களை இணைத்துக்கொண்டார்கள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவனைப் பின்பற்றிய அனைவரும்.” நேரடியாக, “அவனால் இணங்க வைக்கப்பட்ட அனைவரும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: ஏனெனில், இந்த நாட்களுக்கு முன்பு
  rationale: πρό காலத்தில் முந்தியதைச் சுட்டுகிறது; γάρ கமாலியேலின் விளக்க வாதத் தொடர்பைத் தக்கவைக்க ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἀνέστη Θευδᾶς
  choice: தெயுதாஸ் என்பவன் எழும்பி
  rationale: இங்கு ἀνέστη உயிர்த்தெழுதலை அல்ல, ஒரு தலைவனாக அல்லது இயக்கத் தொடக்குவோனாக முன்வந்ததைச் சொல்கிறது; ‘எழும்பி’ அதன் உருவக வலிமையைத் தக்கவைக்கிறது.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: தன்னை ஒரு முக்கியமானவன் என்று சொல்லிக்கொண்டான்
  rationale: τινα ἑαυτόν என்பது தன்னைச் சிறப்பும் செல்வாக்கும் உள்ள நபராகக் காட்டிக்கொள்ளும் கிரேக்க மரபுத்தொடர்; இயல்பான தமிழுக்காக அதன் உட்பொருள் வெளிப்படுத்தப்பட்டது.
- source_word: ᾧ προσεκλίθη
  choice: அவனுடன் சேர்ந்துகொண்டார்கள்
  rationale: προσεκλίθη என்பது ஒருவருடைய பக்கம் சாய்ந்து அவருடன் தங்களை இணைத்துக்கொள்வதைக் குறிக்கிறது; ‘சேர்ந்துகொண்டார்கள்’ தெளிவான நவீனத் தமிழ்.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: ஏறக்குறைய நானூறு ஆண்கள்
  rationale: ἀνδρῶν ஆண்களைத் துல்லியமாகக் குறிக்கிறது; ὡς தோராய எண்ணிக்கையைச் சுட்டுவதால் ‘ஏறக்குறைய’ பயன்படுத்தப்பட்டது.
- source_word: ὃς ἀνῃρέθη
  choice: அவன் கொல்லப்பட்டான்
  rationale: இந்தச் சூழலில் ἀναιρέω கொல்வதைக் குறிக்கிறது; செயப்பாட்டு வடிவமும் தெளிவும் காக்கப்பட்டன.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: அவனால் மனம் இணங்கியிருந்த அனைவரும்
  rationale: ἐπείθοντο வெறுமனே பின்தொடர்வதைவிட அவனால் இணங்கவைக்கப்பட்ட அல்லது அவனை நம்பிய நிலையைச் சுட்டுகிறது; மூலத்தின் செயப்பாட்டுச் சாயலை இந்தத் தேர்வு தக்கவைக்கிறது.
- source_word: διελύθησαν καὶ ἐγένοντο εἰς οὐδέν
  choice: சிதறிப்போய், ஒன்றுமில்லாமல் போனார்கள்
  rationale: முதல் வினை குழுவின் கலைந்துபோதலையும், அடுத்த மரபுத்தொடர் அதன் முயற்சி பயனற்றுப் போனதையும் குறிக்கிறது; இரண்டின் தனித்த நுணுக்கங்களும் காக்கப்பட்டன.
theological_decisions:
- issue: கமாலியேலின் உரையிலுள்ள தெயுதாஸ் பற்றிய வரலாற்றுக் குறிப்பு
  choice: கிரேக்க உரையில் உள்ளபடியே கமாலியேலின் வாதத்தின் ஒரு பகுதியாக நேரடியாக மொழிபெயர்த்தல்
  alternative: வெளிப்புற வரலாற்று மறுகட்டமைப்புகளுடன் ஒத்திசைக்க உறுதியின்மையைச் சேர்த்தல் அல்லது வாசகத்தை மாற்றுதல்
  rationale: இவ்வசனம் கமாலியேல் முன்வைக்கும் எடுத்துக்காட்டை நேரடியாகத் தருகிறது. மொழிபெயர்ப்பு வரலாற்றுத் தீர்ப்பையோ ஒத்திசைவு முயற்சியையோ உரைக்குள் இறக்காமல் மூலத்தின் பதற்றத்தை அப்படியே விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடை பயன்படுத்தப்பட்டது. ‘தெயுதாஸ்’ கிரேக்கப் பெயரின் ஒலிபெயர்ப்பு. மூலத்தில் ஆண்களைத் துல்லியமாகக் குறிக்கும் ἀνδρῶν என்பதால் ‘ஆண்கள்’ எனக் கூறப்பட்டது. அனைத்து அடிக்குறிப்பு அடையாளங்களும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
