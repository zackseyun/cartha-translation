source:
  edition: SBLGNT
  text: ὡς δὲ ἤκουσαν τοὺς λόγους τούτους ὅ ⸀τε στρατηγὸς τοῦ ἱεροῦ καὶ οἱ ἀρχιερεῖς, διηπόρουν περὶ αὐτῶν τί ἂν γένοιτο τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: ta
  text: ஆலயக் காவல்படைத் தலைவரும் முதன்மைக் குருக்களும் இந்த வார்த்தைகளைக் கேட்டபோது, அவற்றைக் குறித்து, இது என்ன ஆகுமோ[a] என்று திகைத்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதனால் என்ன நிகழுமோ.” கிரேக்கச் சொற்றொடர் இந்த நிலைமை எவ்வாறு முடியும் அல்லது என்ன விளைவு ஏற்படும் என்ற உறுதியின்மையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: கேட்டபோது
  rationale: ὡς என்பதன் காலத் தொடர்பையும் δέ என்பதன் மென்மையான கதைத் தொடர்ச்சியையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது; தேவையற்ற வெளிப்படையான இணைப்புச் சொல் சேர்க்கப்படவில்லை.
- source_word: τοὺς λόγους τούτους
  choice: இந்தச் செய்தியை
  rationale: λόγους என்பது இங்கு அதிகாரிகள் இப்போதுதான் பெற்ற அறிக்கையைக் குறிக்கிறது. சொற்சொல்லான ‘இந்த வார்த்தைகளை’ என்பதைக் காட்டிலும் சூழலில் ‘இந்தச் செய்தியை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: ஆலயக் காவல்படைத் தலைவர்
  rationale: στρατηγός என்பது அதிகாரமுள்ள தளபதி அல்லது தலைவர்; இங்கு ஆலயப் பாதுகாப்புப் படையின் அதிகாரியைக் குறிக்கிறது. ‘காவல்படைத் தலைவர்’ நவீன வாசகருக்கு அவரது பணியைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἱ ἀρχιερεῖς
  choice: முதன்மைக் குருக்கள்
  rationale: இரண்டாம் ஆலயக் காலச் சூழலில் இந்தப் பன்மை தலைமைப் பொறுப்பிலிருந்த குருக்களைக் குறிக்கிறது; ஒரே நேரத்தில் பல தலைமைக் குருக்கள் இருந்ததாகப் பொருள்படாமல் ‘முதன்மைக் குருக்கள்’ என வழங்கப்படுகிறது.
- source_word: διηπόρουν
  choice: மிகவும் குழம்பி
  rationale: διαπορέω தீவிரமான திகைப்பையும் என்ன செய்வது அல்லது என்ன நிகழும் என்ற அறியாமையையும் குறிக்கிறது. வினையின் இறந்தகாலத் தொடர்நிலையை ‘எண்ணிக்கொண்டிருந்தார்கள்’ என்பதுடன் இணைந்த அமைப்பு வெளிப்படுத்துகிறது.
- source_word: περὶ αὐτῶν
  choice: இதைக் குறித்து
  rationale: αὐτῶν முன்பு கூறப்பட்ட செய்தி அல்லது அதில் தெரிவிக்கப்பட்ட நிகழ்வுகளைச் சுட்டலாம். ‘இது’ அந்தக் குறிப்பை அளவுக்கு மீறித் தீர்மானிக்காமல் தமிழில் இயல்பாக வைத்திருக்கிறது.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: இது என்ன விளைவுக்கு வழிவகுக்குமோ
  rationale: ἄν உடனான optative உறுதியற்ற எதிர்கால விளைவைப் பற்றிய எண்ணத்தை வெளிப்படுத்துகிறது. இந்தத் தமிழ் வடிவம் நிகழ்வின் முடிவு அல்லது விளைவு என்னவாகும் என்ற கேள்வியைத் துல்லியமாகக் கொடுக்கிறது.
