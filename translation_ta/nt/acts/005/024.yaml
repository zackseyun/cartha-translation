  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயக் காவல்படைத் தலைவர்’ வரலாற்றுப் பதவியின் செயல்பாட்டைத் தெளிவாக்குகிறது. மூலத்தின் உறுதியற்ற விளைவு குறித்த நுட்பம் ‘என்ன விளைவுக்கு வழிவகுக்குமோ’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
