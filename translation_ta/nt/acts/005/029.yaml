  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: ta
  text: ஆனால் பேதுருவும் அப்போஸ்தலர்களும், “மனிதர்களுக்கு[a] கீழ்ப்படிவதைவிடக் கடவுளுக்கே கீழ்ப்படிய வேண்டும்” என்று பதிலளித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “மக்களுக்கு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் இங்கு கடவுளுக்கு எதிர்நிலையில் மனிதர்களைப் பொதுவாகவும், சூழலில் மனித அதிகாரிகளையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπαν
  choice: என்று பதிலளித்தார்கள்
  rationale: கிரேக்கத்தில் உள்ள ‘பதிலளித்து … சொன்னார்கள்’ என்ற பதில் கூறும் மரபுத்தொடரை, தேவையற்ற இரட்டிப்பைத் தவிர்த்து இயல்பான தமிழில் ஒரே வினையாக வழங்குகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய அதிகாரிகளின் பேச்சுக்கு எதிராக வரும் மிதமான முரண்பாட்டுத் திருப்பை வெளிப்படுத்துகிறது.
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: பேதுருவும் அப்போஸ்தலர்களும்
  rationale: தனிப்பெயரையும், இச்சூழலில் குறிப்பிட்ட அப்போஸ்தலர் குழுவைக் குறிக்கும் நிலைபெற்ற பதத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: Πειθαρχεῖν
  choice: கீழ்ப்படிய
  rationale: அதிகாரமுள்ள ஒருவருக்குக் கீழ்ப்படிதல் என்ற வினையின் பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: இங்கு தெரிவிக்கப்படும் அவசியத்தையும் கடமையையும் சுருக்கமான இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: θεῷ
  choice: கடவுளுக்கு
  rationale: கீழ்ப்படிதலின் மறைமுகச் செயப்படுபொருளாக உள்ள θεός என்பதற்கான தெளிவான, நவீன பொதுத்தமிழ் இணை.
- source_word: μᾶλλον ἢ
  choice: …வதைவிட…க்கே
  rationale: மனிதர்களுக்குக் கீழ்ப்படிதலுக்கு மாறாகக் கடவுளுக்குக் கீழ்ப்படிய வேண்டிய முன்னுரிமையைத் தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் காட்டுகிறது.
- source_word: ἀνθρώποις
  choice: மனிதர்களுக்கு
  rationale: பாலினத்தால் வரையறுக்காமல் மனிதர்களைப் பொதுவாகக் குறிக்கும் இச்சொல்லைத் துல்லியமாக வழங்குகிறது; சூழலில் அதிகாரிகளும் இதில் அடங்குவர்.
theological_decisions:
- issue: கடவுளுக்கும் மனித அதிகாரத்திற்கும் இடையிலான கீழ்ப்படிதலின் ஒப்பீடு
  choice: மனிதர்களுக்குக் கீழ்ப்படிவதைவிடக் கடவுளுக்கே கீழ்ப்படிய வேண்டும்
  alternative: மனிதர்களுக்குக் கீழ்ப்படிவதைவிடக் கடவுளுக்கு அதிகமாகக் கீழ்ப்படிய வேண்டும்
  rationale: μᾶλλον ἢ இங்கு முன்னுரிமையை வலியுறுத்துகிறது. ‘…வதைவிட…க்கே’ என்பது அந்த எதிர்நிலையைத் தெளிவாகக் காட்டுகிறது; அதேவேளையில், மனித அதிகாரம் பற்றிய விரிவான கோட்பாட்டை வசனத்துக்குள் சேர்க்கவில்லை.
- issue: ἀνθρώποις என்பதன் பொதுப்பொருள்
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: இச்சூழலில் கிரேக்கப் பன்மைச் சொல் ஆண் பாலினத்தவரை மட்டும் அல்லாமல், கடவுளுக்கு எதிர்நிலையில் மனிதர்களையும் குறிப்பாக மனித அதிகாரிகளையும் பொதுவாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கப் பதில் கூறும் இரட்டை வினை அமைப்பு இயல்பான ஒரே தமிழ் வினையாக வழங்கப்பட்டுள்ளது; ‘கடவுளுக்கே’ என்ற வலியுறுத்தல் மூலத்தின் ஒப்பீட்டு எதிர்நிலையைப் பாதுகாக்கிறது.
