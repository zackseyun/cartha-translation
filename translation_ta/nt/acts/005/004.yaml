id: ACT.5.4
reference: Acts 5:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: ta
  text: அது விற்கப்படாமல் இருந்தபோது, உன்னுடையதாகவே இருந்ததல்லவா? அதை விற்ற பிறகு கிடைத்த தொகையும் உன் அதிகாரத்தில்தானே இருந்தது?[a] இந்தக் காரியத்தை நீ ஏன் உன் இதயத்தில் தீர்மானித்தாய்? நீ பொய் சொன்னது மனிதர்களிடம் அல்ல, கடவுளிடமே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் வசம்தானே இருந்தது?”
    reason: ἐξουσία என்பதன் ‘அதிகாரம், உரிமை, கட்டுப்பாடு; ஒருவர் விருப்பப்படி கையாளும் நிலை’ என்ற பொருள் வரம்பைத் தெரிவிக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: விற்கப்படாமல் இருந்தபோது ... உன்னுடையதாகவே இருந்தது
  rationale: கிரேக்கத்தில் மீண்டும் வரும் μένω, விற்பனைக்கு முன் சொத்து அனனியாவின் உடைமையாகத் தொடர்ந்ததை வலியுறுத்துகிறது. தமிழில் இயல்பாகப் புரியுமாறு அந்தத் தொடர்ந்த உடைமைநிலை வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: πραθέν
  choice: அதை விற்ற பிறகும்
  rationale: இறந்தகாலச் செயல்பாட்டு வினையெச்சத்தின் செயப்பாட்டு பொருளை இயல்பான தமிழ் காலவாக்கியமாக வழங்குகிறது.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: அதற்குக் கிடைத்த பணம் உன் அதிகாரத்தில்தானே இருந்தது?
  rationale: ἐξουσία என்பது உரிமை, அதிகாரம் அல்லது ஒருவரின் விருப்பப்படி கையாளும் சுதந்திரத்தைக் குறிக்கலாம். விற்பனைக்குப் பின் கேள்விக்குரியது கிடைத்த பணம் என்பதைக் தமிழில் தெளிவாக்கி, அதை எவ்வாறு பயன்படுத்துவது அனனியாவின் அதிகாரத்திலேயே இருந்தது என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: τί ὅτι
  choice: ஏன்
  rationale: இந்த இடத்தில் கண்டனத்துடன் காரணம் கேட்கும் கிரேக்க மரபுத்தொடரை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: உன் இதயத்தில் தீர்மானித்தாய்
  rationale: சொல்லுக்குச் சொல் அமைப்பை விட, உள்ளார்ந்த எண்ணத்தையும் உறுதியான நோக்கத்தையும் குறிக்கும் மரபுத்தொடரின் பொருளை அளிக்கிறது; அதேவேளை ‘இதயம்’ என்ற உருவகத்தையும் காக்கிறது.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: இந்தக் காரியம்
  rationale: πρᾶγμα என்பதன் பொதுவான ‘காரியம்/செயல்/விஷயம்’ என்ற பொருளைச் சூழல் அதன் ஒழுக்கத் தீவிரத்தை நிர்ணயிக்குமாறு நடுநிலையாக வழங்குகிறது.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: நீ பொய் சொன்னது மனிதர்களிடம் அல்ல, கடவுளிடமே
  rationale: ἀνθρώποις என்பதை ஆண்களுக்கு மட்டும் வரையறுக்காமல் மனிதர்களைப் பொதுவாகக் குறிக்கும் வகையில் மொழிபெயர்த்து, ‘மனிதர்கள்—கடவுள்’ என்ற வலுவான முரண்பாட்டைப் பாதுகாக்கிறது.
theological_decisions:
- issue: உடனடியான சூழலில் பரிசுத்த ஆவியின் தெய்வத்தன்மை (அப் 5:3 உடன் ஒப்பிடுக)
  choice: வசனத்தில் உள்ளபடியே ‘கடவுளிடமே’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுளிடம், அதாவது பரிசுத்த ஆவியிடம்’ என்று விளக்கமாக விரிவாக்குதல்.
  rationale: இந்த வசனம் நேரடியாக τῷ θεῷ, ‘கடவுளிடம்’ என்கிறது. முந்தைய வசனத்துடனான இறையியல் தொடர்பை மொழிபெயர்ப்புக்குள் சேர்த்து விளக்காமல், சூழலே வெளிப்படுத்த அனுமதிக்கப்படுகிறது.
- issue: சொத்தின்மீதும் விற்பனைத் தொகையின்மீதும் அனனியாவுக்கு இருந்த உரிமை
  choice: சொத்தும் விற்றபின் கிடைத்த பணமும் அவனுடைய உண்மையான அதிகாரத்தில் இருந்ததாகக் காட்டப்பட்டது.
  alternative: வெறும் உடைமையைக் காட்டி, அதைத் தீர்மானிக்கும் சுதந்திரத்தைத் தெளிவாக்காமல் விடுதல்.
  rationale: குற்றம் சொத்தைக் கொடுக்காதது அல்ல, ஏமாற்றியதே என்ற பேதுருவின் வாதத்தை உரை வெளிப்படுத்துகிறது; இதற்கு எந்தச் சபைமரபுச் சிறப்புக் கருத்தும் சேர்க்கப்படவில்லை.
- issue: ἀνθρώποις என்பதன் பாலினப் பொதுப்பொருள்
  choice: ‘மனிதர்களிடம்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆண்களிடம்’ என்று மொழிபெயர்த்தல்.
  rationale: இங்குள்ள பன்மை மனிதகுலத்தினரைப் பொதுவாகக் குறிக்கிறது; நவீனத் தமிழில் ‘மனிதர்கள்’ துல்லியமும் இயல்பும் உடையது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பேதுருவின் கண்டனத் தொனி கேள்விகளாலும் இறுதியில் வரும் ‘கடவுளிடமே’ என்ற அழுத்தத்தாலும் காக்கப்பட்டுள்ளது.
