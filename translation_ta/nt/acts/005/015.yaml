source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: ta
  text: இதன் விளைவாக, மக்கள் நோயாளிகளைத் தெருக்களிலும் கூட[a] வெளியே கொண்டுவந்து, கட்டில்களிலும் படுக்கைப் பாய்களிலும்[b] கிடத்தினார்கள்; பேதுரு அவ்வழியாக வரும்போது, அவருடைய நிழலாவது அவர்களில் ஒருவர்மேல் படுமாறு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொது வெளிகளிலும் கூட.’ πλατείας என்ற கிரேக்கச் சொல் அகன்ற தெருக்களையோ திறந்த பொதுவிடங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘படுக்கைகளிலும் எளிய படுக்கைகளிலும்.’ கிரேக்கத்தில் இருவகையான படுக்கைகள் அல்லது படுக்கும் பரப்புகள் வேறுபடுத்தப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: இதன் விளைவாக
  rationale: முந்திய சூழலில் அப்போஸ்தலர்களின் செல்வாக்கு வளர்ந்ததன் விளைவை அறிமுகப்படுத்தும் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: καὶ εἰς τὰς πλατείας
  choice: தெருக்களுக்குக்கூட
  rationale: καί தரும் வலியுறுத்தலை ‘கூட’ என்பதும், πλατεῖαι குறிக்கும் அகன்ற தெருக்கள் அல்லது பொதுவெளிகளில் இச்சூழலுக்கு ஏற்ற முதன்மைப் பொருளை ‘தெருக்கள்’ என்பதும் வெளிப்படுத்துகின்றன.
- source_word: ἐκφέρειν
  choice: வெளியே கொண்டுவந்து
  rationale: நோயாளிகளை வீடுகளிலிருந்து பொது இடங்களுக்கு உடலளவில் கொண்டுவந்த செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: τοὺς ἀσθενεῖς
  choice: நோயாளிகளை
  rationale: சுகமளித்தல் பற்றிய இச்சூழலில் பொதுவான பலவீனத்தை அல்ல, நோயுற்றவர்களையே குறிக்கிறது.
- source_word: τιθέναι
  choice: கிடத்தினார்கள்
  rationale: நோயாளிகளைப் படுக்கும் பரப்புகளின்மேல் வைத்த செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: சிறு கட்டில்களிலும் படுக்கைப் பாய்களிலும்
  rationale: இரு வேறு வகையான படுக்கை அல்லது எடுத்துச் செல்லக்கூடிய படுக்கும் பரப்புகள் இருந்த வேறுபாட்டை, அளவுக்கு மீறிய தொழில்நுட்பத் துல்லியம் இன்றி வாசகருக்குப் புரியும் வகையில் காக்கிறது.
- source_word: ἵνα
  choice: படுமாறு ... அப்படிச் செய்தார்கள்
  rationale: மக்கள் நோயாளிகளை அங்கே கிடத்திய நோக்கம் அல்லது எதிர்பார்த்த விளைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐρχομένου Πέτρου
  choice: பேதுரு அவ்வழியாக வரும்போது
  rationale: பேதுரு அவர்களருகே கடந்து வரும் இயக்கத்தையும், அந்தச் செயல் நிகழ்ந்துகொண்டிருக்கும் காலத் தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κἂν
  choice: நிழலாவது
  rationale: குறைந்தபட்சமாக அவருடைய நிழல் பட்டால்கூட போதும் என்ற மக்களின் எதிர்பார்ப்பை ‘ஆவது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σκιὰ
  choice: நிழல்
  rationale: உருவகமல்லாத நேரடிப் பொருளைச் சரியாகக் காக்கிறது.
- source_word: ἐπισκιάσῃ
  choice: மேல் படுமாறு
  rationale: ஒருவர்மேல் பேதுருவின் நிழல் விழுவதை இயல்பான தமிழில் கூறுகிறது; subjunctive வடிவத்தின் நோக்கத்துடனான சாத்தியத்தையும் உறுதியாக நிகழ்ந்ததாக மாற்றவில்லை.
- source_word: τινὶ αὐτῶν
  choice: அவர்களில் யாராவது ஒருவர்மேல்
  rationale: கூடியிருந்த நோயாளிகளில் எந்த ஓர் தனிநபரையும் குறிக்கக்கூடிய கிரேக்க ஒருமை வரையறையற்ற சொல்லின் நுணுக்கத்தைத் துல்லியமாகக் காக்கிறது.
theological_decisions:
- issue: பேதுருவின் நிழலுக்கே சுகமளிக்கும் வல்லமை இருந்ததாக இவ்வசனம் கூறுகிறதா
  choice: நோயாளிகளை அங்கே வைத்த மக்களின் நோக்கத்தையும் எதிர்பார்ப்பையும் மட்டுமே உரை கூறுகிறது; நிழலே சுகப்படுத்தியதாக இவ்வசனத்தில் சேர்க்கவில்லை.
  alternative: பேதுருவின் நிழலில் தன்னிச்சையான அற்புத வல்லமை இருந்தது என்று அதிகமாக உணர்த்தும் மொழிபெயர்ப்பு.
  rationale: ἵνα மற்றும் subjunctive வடிவம் மக்களின் நோக்கம் அல்லது எதிர்பார்த்த சாத்தியத்தை முன்வைக்கின்றன. விரிந்த சூழல் பலர் குணமடைந்ததைச் சொன்னாலும், இவ்வாக்கியம் நிழலே அவர்களைக் குணப்படுத்தியது என்று வெளிப்படையாகக் கூறாது; அந்த இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் எளிதாகப் புரியும், ஆனால் வேதாகமப் பதிப்புக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘அவ்வழியாக’, ‘நிழலாவது’, ‘யாராவது ஒருவர்மேல்’ ஆகிய வடிவங்கள் இயக்கம், குறைந்தபட்ச எதிர்பார்ப்பு, வரையறையற்ற ஒருமை ஆகிய மூலமொழி நுணுக்கங்களை இயல்பாகக் காக்கின்றன.
