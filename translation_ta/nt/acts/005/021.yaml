id: ACT.5.21
reference: Acts 5:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: ta
  text: அவர்கள் இதைக் கேட்டதும், விடியற்காலையில் ஆலய வளாகத்துக்குள் சென்று கற்பித்துக்கொண்டிருந்தார்கள். தலைமை ஆசாரியரும் அவருடன் இருந்தவர்களும் வந்து, சன்ஹெட்ரினையும் இஸ்ரவேல் மக்களின் மூப்பர் பேரவை முழுவதையும்[a] கூட்டினார்கள். பின்னர், அவர்களை அழைத்து வரும்படி சிறைச்சாலைக்கு அனுப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “இஸ்ரவேலின் மகன்களுடைய மூப்பர் பேரவை முழுவதையும்”; அல்லது, “இஸ்ரவேலின் மூப்பர்கள் அனைவரையும்.”
    reason: மூலத்தின் குடும்பவழி தேசியச் சொல்லாட்சியையும், γερουσία என்பதற்கான இயல்பான மாற்று மொழிபெயர்ப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: அவர்கள் இதைக் கேட்டதும்
  rationale: இறந்தகாலப் பங்கேற்புவினை முந்தைய வசனத்தில் வானதூதர் கொடுத்த கட்டளையைக் கேட்டதைச் சுட்டுகிறது. ‘இதைக்’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் இயல்பான பின்னிணைப்பைத் தருகிறது.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: விடியற்காலையில்
  rationale: விடியலை ஒட்டிய அதிகாலை நேரத்தைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் தொடர்.
- source_word: εἰς τὸ ἱερὸν
  choice: ஆலய வளாகத்துக்குள்
  rationale: ἱερόν என்பது பரிசுத்த அறையை மட்டும் அல்லாமல் முழு ஆலய வளாகத்தையும் குறிக்கிறது; ‘வளாகம்’ அந்த வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: ἐδίδασκον
  choice: கற்பித்துக்கொண்டிருந்தார்கள்
  rationale: நிறைவுறா இறந்தகால வடிவம் தொடர்ந்துகொண்டிருந்த செயலைக் காட்டுவதால், தமிழில் தொடர்நிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: Παραγενόμενος
  choice: வந்து
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத் தொடர்புடைய பங்கேற்புவினையை இயல்பான தமிழ் வினையெச்சமாக வழங்குகிறது.
- source_word: οἱ σὺν αὐτῷ
  choice: அவருடன் இருந்தவர்கள்
  rationale: அந்தக் குழுவினரின் அடையாளத்தை மூலவாக்கியத்தைவிடக் குறிப்பாக்காமல் நேரடியாக வழங்குகிறது.
- source_word: συνεκάλεσαν
  choice: கூட்டினார்கள்
  rationale: ஒரு மன்றத்தை ஒன்றுகூட அழைத்தல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὸ συνέδριον
  choice: யூதத் தலைமை மன்றம்
  rationale: இச்சூழலில் யூதர்களின் உயர்மட்ட ஆட்சிமன்றமான சன்ஹெட்ரினைக் குறிக்கிறது. அறிமுகமில்லாத ஒலிபெயர்ப்பை மட்டும் பயன்படுத்தாமல் அதன் செயலையும் வரலாற்றுச் சூழலையும் தெளிவாக்குகிறது.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: இஸ்ரவேல் மக்களின் மூப்பர் பேரவை முழுவதும்
  rationale: γερουσία என்பது மூப்பர்களைக் கொண்ட பேரவையைக் குறிக்கிறது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொல்லாட்சியின் தேசியப் பொருளை இயல்பான தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கி, நேர் வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: δεσμωτήριον
  choice: சிறைச்சாலை
  rationale: காவலில் வைக்கப்படும் இடத்தைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: ἀχθῆναι αὐτούς
  choice: அப்போஸ்தலர்களை அழைத்து வரும்படி
  rationale: செயப்பாட்டு வினையெச்சம், அவர்களை வேறு ஆட்கள் அழைத்து வரவேண்டும் என்ற நோக்கத்தைக் காட்டுகிறது. தமிழில் ‘அழைத்து வரும்படி ... ஆட்களை அனுப்பினார்கள்’ என்பது அந்த மறைமுக ஏவுதலை இயல்பாக வெளிப்படுத்துகிறது; ‘அவர்கள்’ யார் என்பதையும் சூழலிலிருந்து தெளிவாக்க ‘அப்போஸ்தலர்கள்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்களின்
  alternative: இஸ்ரவேலின் மகன்களுடைய
  rationale: ‘மகன்கள்’ என்பது இங்கு தனிப்பட்ட ஆண்களை மட்டும் பிரித்துக் காட்டாமல், மரபுவழியான தேசியப் பெயராக இஸ்ரவேல் மக்களைக் குறிக்கிறது. நவீனத் தமிழில் தவறான பாலினக் கட்டுப்பாட்டை உணர்த்தாமல் தேசியப் பொருளைத் தெளிவாக்க ‘மக்கள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, மூலத்தின் குடும்பவழிச் சொல்லாட்சி அடிக்குறிப்பில் தரப்படுகிறது.
- issue: συνέδριον மற்றும் γερουσία ஆகிய இரு மன்றச் சொற்களின் தொடர்பு
  choice: யூதத் தலைமை மன்றத்தையும் ... மூப்பர் பேரவை முழுவதையும்
  alternative: யூதத் தலைமை மன்றமாகிய இஸ்ரவேலின் மூப்பர்கள் அனைவரையும்
  rationale: கிரேக்கத்தில் இரண்டும் καί மூலம் இணைக்கப்பட்டுள்ளதால் அவற்றை ஒரே அமைப்புக்கான விளக்கப்பெயர்கள் என்று முற்றிலும் ஒன்றிணைக்காமல், தனித்த இரு கூறுகளாகவே வைத்திருக்கிறது. இதனால் மூலத்தில் உள்ள அமைப்புச் சார்ந்த தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆலய வளாகம்’ என்பது ἱερόν/ναός வேறுபாட்டைப் பாதுகாக்கிறது. ‘கற்பித்துக்கொண்டிருந்தார்கள்’ தொடர்ந்த செயலை வெளிப்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியம் தமிழில் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
