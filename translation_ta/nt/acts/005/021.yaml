  to: அவர்கள் இதைக் கேட்டதும், விடியற்காலையில் ஆலய வளாகத்துக்குள் சென்று கற்பித்துக்கொண்டிருந்தார்கள். தலைமை ஆசாரியரும் அவருடன் இருந்தவர்களும் வந்து, சன்ஹெட்ரினையும் இஸ்ரவேல் மக்களின் மூப்பர் பேரவை முழுவதையும்[a] கூட்டினார்கள். பின்னர், அவர்களை அழைத்து வரும்படி சிறைச்சாலைக்கு அனுப்பினார்கள்.
  rationale: திருத்தம் மூலத்தில் வெளிப்படையாக இல்லாத ‘அப்போஸ்தலர்கள்’ மற்றும் ‘ஆட்கள்’ ஆகிய சேர்க்கைகளை நீக்குகிறது. συνέδριον என்பதன் சூழல்-குறிப்பான வரலாற்றுப் பெயரான ‘சன்ஹெட்ரின்’ பயன்படுத்தப்படுகிறது. γερουσία பற்றிய தனித்த, விரிவாக்கத் தன்மை கொண்ட கூறும் அடிக்குறிப்பும் பாதுகாக்கப்படுகின்றன.
