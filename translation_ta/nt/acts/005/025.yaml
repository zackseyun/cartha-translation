id: ACT.5.25
reference: Acts 5:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: ta
  text: ஆனால் ஒருவர் வந்து அவர்களிடம், “பாருங்கள், நீங்கள் சிறையில் அடைத்த அந்த மனிதர்கள் ஆலய வளாகத்தில்[a] நின்று மக்களுக்குப் போதித்துக்கொண்டிருக்கிறார்கள்” என்று அறிவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலயத்தில்”; கிரேக்கச் சொல் உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: வந்து
  rationale: தூதுவர் முதலில் வந்து சேர்ந்ததையும், பின்னர் செய்தியை அறிவித்ததையும் காட்டும் இறந்தகாலப் பங்கேற்புச் சொல்லை இயல்பான தமிழ் வினையெச்சமாகத் தருகிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுக்கு எதிர்பாராத திருப்பத்தை அறிமுகப்படுத்தும் மென்மையான மாறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: τις
  choice: ஒருவர்
  rationale: அடையாளம் குறிப்பிடப்படாத நபரைக் குறிக்கும் கிரேக்கச் சொல்லை இயல்பாகவும் தேவையற்ற விவரமின்றியும் தருகிறது.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: அவர்களிடம் ... அறிவித்தார்
  rationale: அதிகாரிகளிடம் தகவலை முறையாகத் தெரிவித்த சூழலைப் பொருத்தமாக வெளிப்படுத்துகிறது; αὐτοῖς என்பதையும் பெயர்ச்சொல்லாக விரிவாக்காமல் சுட்டுப்பெயராகவே வைத்திருக்கிறது.
- source_word: Ἰδοὺ
  choice: பாருங்கள்
  rationale: வியப்பூட்டும் செய்தியின்மீது கேட்போரின் கவனத்தைத் திருப்பும் அழைப்பை நவீன, கண்ணியமான தமிழில் தருகிறது.
- source_word: οἱ ἄνδρες
  choice: அந்த மனிதர்கள்
  rationale: முன்னர் சிறையில் வைக்கப்பட்ட குறிப்பிட்ட ஆட்களைக் குறிக்கிறது; தமிழில் இயல்பான குறிப்புத்தன்மையைத் தருகிறது.
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: நீங்கள் சிறையில் அடைத்த
  rationale: சிறையில் வைப்பது என்ற சூழ்நிலைப் பொருளை இயல்பான தமிழில் தெளிவாகக் கூறுகிறது; வெறும் ‘வைத்த’ என்பதைவிட சிறைப்பிடிப்பைக் குறிக்கிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலய வளாகத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலயக் கட்டடத் தொகுதியைக் குறிக்கும் என்பதால் ‘ஆலய வளாகம்’ துல்லியமான தேர்வு.
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: நின்று மக்களுக்குப் போதித்துக்கொண்டிருக்கிறார்கள்
  rationale: நின்றிருப்பதும் போதித்துக்கொண்டிருப்பதும் நிகழ்காலத்தில் தொடரும் செயல்களாக இருப்பதை இயல்பான தமிழில் பாதுகாக்கிறது.
