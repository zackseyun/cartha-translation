  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγοντες ὅτι ⸀Τὸ δεσμωτήριον εὕρομεν κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ καὶ τοὺς φύλακας ἑστῶτας ⸀ἐπὶ τῶν θυρῶν, ἀνοίξαντες δὲ ἔσω οὐδένα εὕρομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/023.yaml
  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: ta
  text: அவர்கள், “சிறைச்சாலை மிகப் பாதுகாப்பாகப் பூட்டப்பட்டிருந்ததையும்[a], காவலர்கள் கதவுகளருகே நின்றுகொண்டிருந்ததையும் கண்டோம்; ஆனால் கதவுகளைத் திறந்தபோது, உள்ளே ஒருவரையும் காணவில்லை” என்று கூறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழுமையான பாதுகாப்புடன் பூட்டப்பட்டிருந்ததையும்.” சிறைச்சாலை முற்றிலும் பாதுகாப்பான நிலையில் இருந்ததை கிரேக்கச் சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσμωτήριον
  choice: சிறைச்சாலை
  rationale: காவலில் அடைத்து வைக்கும் இடத்தைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: மிகப் பாதுகாப்பாகப் பூட்டப்பட்டிருந்தது
  rationale: κεκλεισμένον பூட்டப்பட்ட நிலையில் இருந்ததைக் காட்டுகிறது; ἐν πάσῃ ἀσφαλείᾳ அந்தப் பாதுகாப்பின் முழுமையை வலியுறுத்துகிறது.
- source_word: φύλακας ἑστῶτας
  choice: காவலர்கள் நின்றுகொண்டிருந்தார்கள்
  rationale: காவலர்கள் தங்கள் இடத்தில் நின்றிருந்த காட்சியைப் பாதுகாக்கிறது; அவர்கள் முறைப்படி நிறுத்தப்பட்டிருந்தார்கள் என்ற கூடுதல் பொருளைத் திணிக்கவில்லை.
- source_word: ἐπὶ τῶν θυρῶν
  choice: கதவுகளருகே
  rationale: கதவுகளின் அருகிலுள்ள இடத்தைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἀνοίξαντες
  choice: அதைத் திறந்தபோது
  rationale: இறந்தகாலப் பங்கேற்பு வடிவத்தின் காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; ‘அதை’ என்பது சூழலில் சிறைச்சாலையை, நடைமுறையில் அதன் கதவுகளைத் திறந்ததைச் சுட்டுகிறது.
- source_word: ἔσω
  choice: உள்ளே
  rationale: சிறைச்சாலையின் உட்புறத்தைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: οὐδένα
  choice: ஒருவரையும் காணவில்லை
  rationale: ஒருவர்கூட அங்கு இல்லை என்ற எதிர்மறை வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγοντες ὅτι
  choice: என்று கூறினார்கள்
  rationale: முந்தைய வசனத்தில் வந்த பணியாளர்களின் அறிக்கையை நேர்கூற்றாக அறிமுகப்படுத்தும் இயல்பான தமிழ் வடிவம்.
