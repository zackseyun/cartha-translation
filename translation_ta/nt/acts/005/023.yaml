  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. மூலத்தின் காட்சிவிவரமும் பாதுகாப்பை வலியுறுத்தும் தன்மையும் தக்கவைக்கப்பட்டுள்ளன.
