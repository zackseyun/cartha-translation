base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: ta
  text: எருசலேமைச் சுற்றியிருந்த நகரங்களிலிருந்தும் ஏராளமான மக்கள் திரண்டு வந்துகொண்டிருந்தார்கள்[a]. அவர்கள் நோயாளிகளையும் அசுத்த ஆவிகளால் துன்புறுத்தப்பட்டவர்களையும்[b] கொண்டுவந்தார்கள்; கொண்டுவரப்பட்ட அனைவரும் குணமாக்கப்பட்டு வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமைச் சுற்றியிருந்த நகரங்களிலிருந்து பெருந்திரளான மக்கள் கூடிவந்துகொண்டிருந்தார்கள்.”
    reason: lexical_alternative
  - marker: b
