- source_word: ἐθεραπεύοντο
  choice: குணமாக்கப்பட்டார்கள்
  rationale: செயப்படுபொருள் வடிவத்தைப் பாதுகாக்கிறது; தொடர்ச்சியான நிகழ்வை முந்தைய வாக்கியத்தின் ongoing சூழல் போதுமான அளவு எடுத்துக்காட்டுகிறது.
- source_word: ἅπαντες
  choice: அனைவரும்
  rationale: கொண்டுவரப்பட்டவர்களில் ஒருவரும் விலக்கப்படவில்லை என்ற முழுமையை நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: πνευμάτων ἀκαθάρτων என்பதன் மொழிபெயர்ப்பு
  choice: அசுத்த ஆவிகள்
  alternative: தீட்டான ஆவிகள்
  rationale: இச்சொற்றொடர் லூக்கா–அப்போஸ்தலர் நூல்களில் தனிப்பட்ட தீய ஆவிகளைக் குறிக்கிறது. உளவியல் அல்லது உருவக விளக்கமாகச் சுருக்காமல் வழக்கமான வேதாகமச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- issue: ἅπαντες என்பதன் வரம்பு
  choice: அவர்கள் அனைவரும் குணமாக்கப்பட்டார்கள்
  alternative: அவர்கள் ஒவ்வொருவரும் குணமடைந்தார்கள்
  rationale: இந்த நிகழ்வில் கொண்டுவரப்பட்ட இரு வகையினரையும் உள்ளடக்கும் முழுமையான கூற்றை, மேலதிக இறையியல் விளக்கம் சேர்க்காமல் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியைக் காட்டும் கிரேக்க imperfect வடிவம் முதல் வாக்கியத்தில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது; இறுதி passive வினையும் முழுமையைக் குறிக்கும் ‘அனைவரும்’ என்பதும் தக்கவைக்கப்பட்டுள்ளன.
