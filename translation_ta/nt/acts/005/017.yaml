  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: ta
  text: ஆனால், தலைமை ஆசாரியன் எழுந்தார்; அவரும் அவருடன் இருந்த அனைவரும்—அதாவது, சதுசேயர் பிரிவைச் சேர்ந்தவர்களும்[a]—பொறாமையால் நிறைந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சதுசேயர் கட்சியைச் சேர்ந்தவர்கள்.” கிரேக்கச் சொல் ஒரு பிரிவு, கட்சி அல்லது சிந்தனைப் பள்ளியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தீவிர ஆர்வத்தால்.” கிரேக்கச் சொல் ‘ஆர்வம்’ அல்லது ‘வைராக்கியம்’ அல்ல, ‘தீவிர ஆர்வம்’ என்ற பொருளிலும் வரலாம்; ஆனால் இங்குள்ள எதிர்ப்புச் சூழல் பகைமை கொண்ட பொறாமை என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: எழுந்து
  rationale: ἀνίστημι என்பதன் இறந்தகால வினையெச்சம்; அடுத்ததாக மேற்கொள்ளப்படும் உறுதியான நடவடிக்கையை அறிமுகப்படுத்தும் லூக்காவின் கதைநடைப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் மக்களிடையே அப்போஸ்தலர்களுக்குக் கிடைத்த வரவேற்புக்கு மாறாக இங்கு தொடங்கும் எதிர்ப்பை மென்மையான முரண்பாடாகக் காட்டுகிறது.
- source_word: ὁ ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: தனிப்பட்ட பிரதான ஆசாரியப் பதவியைக் குறிக்கும் ἀρχιερεύς என்பதற்கான தெளிவான, வழக்கமான நவீனத் தமிழ் இணை.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: அவருடன் இருந்த அனைவரும்
  rationale: அவரோடு இணைந்திருந்த குழுவைக் குறிக்கிறது; அவர்களின் துல்லியமான பதவியை ஊகிக்காமல் உறவுநிலையைப் பாதுகாக்கிறது.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: அதாவது, சதுசேயர் பிரிவினர்
  rationale: இது முன் கூறப்பட்டவர்களை அடையாளப்படுத்தும் விளக்கத் தொடர். αἵρεσις இங்கு யூத மதத்துக்குள் இருந்த ஒரு குழு அல்லது பிரிவைக் குறிக்கிறது; பிற்கால ‘மதப்புரட்டு’ என்ற எதிர்மறை கருத்தை ஏற்றவில்லை.
- source_word: ἐπλήσθησαν
  choice: நிறைந்தார்கள்
  rationale: πίμπλημι என்பதன் செயப்பாட்டு வடிவத்திலுள்ள ‘நிறைக்கப்படுதல்/நிறைந்திருத்தல்’ என்ற உருவகத்தை அதிகமாகப் பொழிப்புரையாக்காமல் தமிழில் பாதுகாக்கிறது.
- source_word: ζήλου
  choice: பொறாமையால்
  rationale: ζῆλος என்பதற்கு ஆர்வம், வைராக்கியம், பொறாமை ஆகிய பொருள்கள் இருக்கலாம்; அப்போஸ்தலர்களுக்கு எதிரான இச்சூழலில் பகைமையான பொறாமை என்ற பொருள் மிகவும் பொருத்தமானது.
theological_decisions:
- issue: αἵρεσις என்பதன் மொழிபெயர்ப்பு
  choice: பிரிவு
  alternative: கட்சி; மதப்பிரிவு
  rationale: இங்கு அச்சொல் இரண்டாம் ஆலயக் கால யூத மதத்துக்குள் அங்கீகரிக்கப்பட்ட ஒரு குழுவைக் குறிக்கிறது. ‘மதப்புரட்டு’ போன்ற பிற்காலத் திருச்சபை சார்ந்த கண்டனப் பொருளைச் சேர்க்காமல் சமூக-மதக் குழுவைக் காட்ட ‘பிரிவு’ தேர்ந்தெடுக்கப்பட்டது.
- issue: சூழலில் ζῆλος என்பதன் பொருள்
  choice: பொறாமை
  alternative: வைராக்கியம்; தீவிர ஆர்வம்; பொறாமை கலந்த எரிச்சல்
  rationale: அச்சொல்லின் நேர்மறை மற்றும் எதிர்மறை வாய்ப்புகள் உண்மையானவை. எனினும், அப்போஸ்தலர்களைக் கைது செய்ய வழிவகுக்கும் உடனடிச் சூழல் எதிர்மறையான பொறாமைப் பொருளை வலியுறுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் வினையெச்ச அமைப்பு ‘எழுந்து’ என்றும், முதன்மை வினை ‘நிறைந்தார்கள்’ என்றும் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே இடப்பட்டுள்ளன.
