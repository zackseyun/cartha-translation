  text: ἀναστάντες δὲ οἱ νεώτεροι συνέστειλαν αὐτὸν καὶ ἐξενέγκαντες ἔθαψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/006.yaml
  text: Then the young men rose[a], wrapped him up, carried him out, and buried him.
translation:
  language: ta
  text: அப்போது இளையவர்கள்[a] எழுந்து, அவனைச் சுற்றிப் போர்த்தி, வெளியே சுமந்து சென்று அடக்கம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இளைஞர்கள்.” கிரேக்கச் சொல்லான νεώτεροι ஒப்பீட்டுப் படிவில் இருப்பதால், அது “இளையவர்கள்” என்றோ பொதுவாக “இளைஞர்கள்” என்றோ பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: எழுந்து
  rationale: ἀνίστημι என்பதன் இறந்தகால வினையெச்சம்; அடுத்த செயலைச் செய்ய அவர்கள் எழுந்ததை இயல்பான தமிழில் தொடர்வினையாகக் காட்டுகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: கதையின் அடுத்த நிகழ்வை முன்னெடுக்கும் δέ-யின் பணியை இயல்பான தமிழ் நடையில் வெளிப்படுத்துகிறது.
- source_word: οἱ νεώτεροι
  choice: இளையவர்கள்
  rationale: νεώτεροι ஒப்பீட்டுப் படிவில் இருப்பதால் ‘இளையவர்கள்’ என்ற நுணுக்கத்தை முதன்மை உரை பாதுகாக்கிறது; சூழலில் இது ஆண்களைக் குறிக்கிறது.
- source_word: συνέστειλαν
  choice: அவனைச் சுற்றிப் போர்த்தி
  rationale: இச்சூழலில் உடலை எடுத்துச் சென்று அடக்கம் செய்வதற்காகச் சுற்றிப் போர்த்திய செயலைக் குறிக்கிறது; ‘அடக்கத்திற்காக ஆயத்தப்படுத்தி’ என்பது மூலத்தைவிட விளக்கமாகிவிடும்.
- source_word: αὐτὸν
  choice: அவனை
  rationale: அனனியாவைக் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயரைத் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: ἐξενέγκαντες
  choice: வெளியே சுமந்துகொண்டுபோய்
  rationale: ἐκφέρω இங்கு இறந்த உடலை அந்த இடத்திலிருந்து வெளியே சுமந்து சென்றதைக் குறிக்கிறது; அடக்கச் சூழலுக்கு ‘கொண்டுபோய்’ என்பதைக் காட்டிலும் இது துல்லியமானது.
- source_word: ἔθαψαν
  choice: அடக்கம் செய்தார்கள்
  rationale: θάπτω என்பதன் ‘புதைத்தல்/அடக்கம் செய்தல்’ என்ற பொருளை நவீன மரியாதையான தமிழ் வழக்கில் இயல்பாகத் தருகிறது.
