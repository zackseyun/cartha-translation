translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வினையெச்சங்களின் தொடர் இயல்பான தமிழ் தொடர்வினைகளால் காக்கப்பட்டுள்ளது; νεώτεροι என்பதிலுள்ள உண்மையான சொற்பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
