  text: ἔπεσεν δὲ παραχρῆμα ⸀πρὸς τοὺς πόδας αὐτοῦ καὶ ἐξέψυξεν· εἰσελθόντες δὲ οἱ νεανίσκοι εὗρον αὐτὴν νεκράν, καὶ ἐξενέγκαντες ἔθαψαν πρὸς τὸν ἄνδρα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: ta
  text: உடனே அவள் அவனுடைய காலடியில் விழுந்து உயிர்விட்டாள். இளைஞர்கள் உள்ளே வந்து, அவள் இறந்துகிடப்பதைக் கண்டார்கள்; அவளை வெளியே கொண்டுபோய், அவளுடைய கணவனுக்கு அருகில் அடக்கம் செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: உடனே
  rationale: நிகழ்வு தாமதமின்றி நடந்ததை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: ἐξέψυξεν
  choice: உயிர்விட்டாள்
  rationale: ‘உயிர் நீங்கியது’ என்ற கிரேக்கச் சொல்லின் உருவகத்தைத் தக்கவைத்தபடி, தமிழில் இயல்பாக மரணத்தைக் குறிக்கிறது.
- source_word: οἱ νεανίσκοι
  choice: இளைஞர்கள்
  rationale: வயதில் இளைய ஆண்களைக் குறிக்கும் பொதுவான, தெளிவான தமிழ்ச் சொல்.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: அவளுடைய கணவனுக்கு அருகில்
  rationale: இங்கு πρός அடக்கம் செய்யப்பட்ட இடத்தின் அண்மையைச் சுட்டுகிறது; ‘கணவனுடன்’ என்று கூறி ஒரே கல்லறை எனத் தேவையின்றி தீர்மானிப்பதைத் தவிர்க்கிறது.
