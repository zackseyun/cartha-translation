source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: ta
  text: ஆகவே, அவர்கள் மன்றத்தின் முன்னிலையிலிருந்து புறப்பட்டுச் சென்றார்கள்; அந்தப் பெயருக்காக[a] அவமதிக்கப்படத் தகுதியுள்ளவர்களாகக் கருதப்பட்டோம் என்று மகிழ்ந்துகொண்டே சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இயேசுவின் பெயருக்காக.’ கிரேக்கத்தில், ‘அந்தப் பெயர்’; இது மரியாதையுடன் பயன்படுத்தப்பட்ட ஒரு மறைசுட்டு.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: இறந்தகால முற்றுப்பெறா வடிவம் மன்றத்தின் முன்னிலையிலிருந்து அவர்கள் சென்றுகொண்டிருந்த நிகழ்வைச் சுட்டுகிறது. தமிழில் இயல்பான கதைநடைக்காக ‘புறப்பட்டுச் சென்றார்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: χαίροντες
  choice: மகிழ்ந்தார்கள்
  rationale: அவர்கள் புறப்பட்டுச் சென்றபோது உடனிகழ்ந்த மனநிலையை நிகழ்காலப் பெயரெச்சம் காட்டுகிறது. தமிழில் காரணத் தொடருடன் இயல்பாக இணைவதற்காக வினைமுற்றாக வழங்கப்பட்டுள்ளது.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: மன்றத்தின் முன்னிலையிலிருந்து
  rationale: ‘முகம்/முன்னிலை’ என்ற மூலமொழி மரபுத்தொடரின் பொருளைத் தக்கவைத்து, ஆட்சிமன்றத்தின் முன்னிலையிலிருந்து அவர்கள் வெளியேறியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: συνεδρίου
  choice: மன்றம்
  rationale: இது வரலாற்றில் சனெட்ரினைக் குறித்தாலும், மூலச்சொல் ஆட்சிச் சபை அல்லது மன்றம் என்ற பொதுப்பொருளைக் கொண்டது. ஒலிபெயர்ப்பைவிட ‘மன்றம்’ சாதாரண வாசகர்களுக்கு எளிதில் புரியும்.
- source_word: κατηξιώθησαν
  choice: தகுதியுள்ளவர்களாகக் கருதப்பட்டதை
  rationale: குறித்த ஒன்றைப் பெறத் தகுதியுடையவர்கள் என்று மதிப்பிடப்பட்டதைக் காட்டும் இறந்தகாலச் செயப்பாட்டு வடிவம். ‘கருதப்பட்ட’ என்பது அதன் மதிப்பீட்டு நுணுக்கத்தையும் செயப்பாட்டு நிலையையும் காக்கிறது.
- source_word: ὑπὲρ
  choice: -க்காக
  rationale: இங்கு பெயருடன் தொடர்புடைய காரணத்தை, அதாவது அந்தப் பெயரின் பொருட்டு அவமதிக்கப்பட்டதைச் சுட்டுகிறது. ‘-க்காக’ என்பது சுருக்கமான, இயல்பான தமிழ் இணைப்பு.
- source_word: τοῦ ὀνόματος
  choice: திருப்பெயர்
  rationale: கிரேக்கத்தில் தனித்து நிற்கும் ‘பெயர்’ என்பது மரியாதைமிக்க மறைசுட்டாகும். ‘திருப்பெயர்’ அதன் மரியாதைத் தொனியைத் தக்கவைக்கிறது; இயேசுவின் பெயர் என்ற சூழல்சார் பொருளை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἀτιμασθῆναι
  choice: அவமதிக்கப்பட
  rationale: ஒருவர் மரியாதையிழக்கச் செய்யப்படுவதைச் சுட்டும் செயப்பாட்டு வினையெச்சம். ‘அவமதிக்கப்பட’ என்பது மரியாதை–அவமரியாதை எதிர்நிலையையும் செயப்பாட்டு வடிவத்தையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ‘பெயர்’ என்பதன் தனித்த மரியாதைமிக்க பயன்பாடு
  choice: முதன்மை உரையில் ‘திருப்பெயர்’ என்று மறைசுட்டைத் தக்கவைத்தல்
  alternative: ‘இயேசுவின் பெயர்’ அல்லது ‘அவருடைய பெயர்’ என்று வெளிப்படுத்துதல்
  rationale: மூலத்தில் τοῦ ὀνόματος, ‘அந்தப் பெயர்’, என்ற தனித்த சொற்றொடரே உள்ளது. சூழலில் அது இயேசுவைக் குறித்தாலும், முதன்மை உரையில் அந்தக் குறிப்பை வெளிப்படையாக்காமல் இருப்பது மூலத்தின் மரியாதைத் தொனியையும் திட்டமிட்ட மறைசுட்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், dignified ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. ‘மன்றம்’ அணுகத்தக்க சொல்லாகவும், ‘திருப்பெயர்’ மூலத்தின் மரியாதைமிக்க மறைசுட்டைப் பாதுகாக்கும் சொல்லாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
