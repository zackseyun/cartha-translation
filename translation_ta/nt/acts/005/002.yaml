base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: ta
  text: விற்றுக் கிடைத்த தொகையில் ஒரு பகுதியை அவன் தனக்கென மறைத்து வைத்துக்கொண்டான்[a]; அவனுடைய மனைவியும் அதை அறிந்திருந்தாள். பிறகு, ஒரு பகுதியைக் கொண்டுவந்து அப்போஸ்தலர்களின் காலடியில் வைத்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விற்றுக் கிடைத்த தொகையில் ஒரு பகுதியை இரகசியமாகத் தனக்காக வைத்துக்கொண்டான்.” கிரேக்க வினைச்சொல், தனக்காக நேர்மையின்றி மறைத்து வைத்துக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அப்போஸ்தலர்களின் கால்களருகே வைத்தான்”; இது பணத்தை அவர்களுக்கு முன்பாக வைப்பதைக் குறிக்கும் ஒரு நேரடியான வெளிப்பாடு.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: தனக்கென மறைத்து வைத்துக்கொண்டான்
  rationale: இந்த வினைச்சொல், தனக்காக ஒரு பகுதியை நேர்மையின்றி மறைவாக வைத்துக்கொள்ளும் பொருளைக் கொண்டுள்ளது. தமிழில் இந்த எதிர்மறையான ஒழுக்கப் பொருளைத் தெளிவாகக் காட்டுகிறது; அதேவேளையில் சட்டரீதியான ‘திருடினான்’ என்ற சொல்லை உரையில் தேவையின்றி சேர்ப்பதில்லை.
- source_word: ἀπὸ τῆς τιμῆς
  choice: விற்றுக் கிடைத்த தொகையில்
  rationale: இங்கு τιμή என்பது விற்பனையால் கிடைத்த விலைத்தொகையைக் குறிக்கிறது. ‘விற்றுக் கிடைத்த தொகை’ என்பது நவீன தமிழில் இயல்பாகவும் சூழலுக்குத் தெளிவாகவும் உள்ளது.
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: அவனுடைய மனைவியும் அதை அறிந்திருந்தாள்
  rationale: மூலத்தின் genitive absolute அமைப்பை இயல்பான தமிழ் தனிவாக்கியமாகத் தருகிறது. ‘-வும்’ என்பது καί-ஐ பிரதிபலிக்கிறது; அவளுடைய அறிவை மட்டும் கூறி, உடந்தையின் அளவை மேலதிகமாக வரையறுப்பதில்லை.
- source_word: ἐνέγκας
  choice: கொண்டுவந்து
  rationale: முதன்மை வினையான ‘வைத்தான்’ என்பதற்கு முன் நடந்த செயலைத் தமிழில் இயல்பான இணைவினையாக வெளிப்படுத்துகிறது.
- source_word: μέρος τι
  choice: ஒரு பகுதியை
  rationale: τι இங்கு துல்லியமாகக் குறிப்பிடப்படாத ஒரு பகுதியைக் குறிக்கிறது. ‘ஒரு பகுதி’ என்பது இயல்பாக அந்த வரையறுக்கப்படாத தன்மையைப் பாதுகாக்கிறது.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: அப்போஸ்தலர்களின் காலடியில் வைத்தான்
  rationale: மூலத்தின் தெளிவான உடல் சார்ந்த காட்சியைப் பாதுகாக்கிறது; பணத்தை அப்போஸ்தலர்களிடம் ஒப்படைத்ததையும் சூழலில் உணர்த்துகிறது.
theological_decisions:
- issue: அனனியாவின் செயலிலுள்ள ஒழுக்கப் பொருள்
  choice: நடுநிலையான ‘வைத்துக்கொண்டான்’ என்பதற்குப் பதிலாக ‘தனக்கென மறைத்து வைத்துக்கொண்டான்’ என்று மொழிபெயர்த்தல்
  alternative: தொகையில் ஒரு பகுதியை வைத்துக்கொண்டான்
  rationale: νοσφίζομαι என்ற வினையும் கதையின் சூழலும் இது வெறும் சட்டப்பூர்வமான தனிப்பங்கு வைத்துக்கொள்ளுதல் அல்ல, நேர்மையற்ற மறைத்துவைத்தல் என்பதைக் காட்டுகின்றன. ஆனால் உரைக்கு அப்பாற்பட்டு ‘திருடினான்’ என்ற சட்டத் தீர்ப்பைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க வாக்கிய அமைப்பு வாசிப்புத் தெளிவுக்காக இரு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், செயல்களின் வரிசையும் மனைவியின் அறிவும் பாதுகாக்கப்பட்டுள்ளன. ‘அப்போஸ்தலர்கள்’ என்பது தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் சொல்.
