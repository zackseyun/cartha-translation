source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: ta
  text: இதற்குப் பிறகு,[a] கணக்கெடுப்பு நடந்த நாட்களில் கலிலேயனான யூதாஸ் எழுந்து, மக்களைத் தன் பின்னால் வரும்படி செய்தான்.[b] அவனும் அழிந்துபோனான்; அவனது பேச்சுக்கு இணங்கிய அனைவரும் சிதறடிக்கப்பட்டனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிகாரப்பூர்வப் பதிவு நடந்த காலத்தில்.” கிரேக்கச் சொல் மக்கள்தொகைக் கணக்கெடுப்பையோ அதிகாரப்பூர்வப் பதிவையோ குறிக்கலாம்.
    reason: ἀπογραφή என்பதற்கான சொற்பொருள் மாற்று.
  - marker: b
    text: அல்லது, “மக்களை அவர்களுடைய முந்தைய சார்பிலிருந்து விலகச் செய்து, தன்னைப் பின்பற்ற வைத்தான்.”
    reason: ἀπέστησε என்ற வினை, பிறரை முந்தைய சார்பிலிருந்து விலகச் செய்து தன் பக்கம் ஈர்ப்பது என்ற நுண்பொருளைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: இவனுக்குப் பிறகு
  rationale: μετά + accusative இங்கு காலவரிசையைக் குறிக்கிறது; முன்பு குறிப்பிடப்பட்ட நபருக்குப் பின்னர் யூதாஸ் தோன்றியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀνέστη
  choice: எழும்பி
  rationale: இங்கு உயிர்த்தெழுதலை அல்ல, வரலாற்றில் ஒரு தலைவன் தோன்றி நடவடிக்கையில் இறங்கியதைக் குறிக்கிறது.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: கலிலேயனான யூதாஸ்
  rationale: பெயரையும் கலிலேய அடையாளத்தையும் தமிழில் தெளிவான அடைமொழி அமைப்பில் தருகிறது.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: மக்கள்தொகைக் கணக்கெடுப்பு நடந்த நாட்களில்
  rationale: ἀπογραφή அதிகாரப்பூர்வப் பதிவையோ கணக்கெடுப்பையோ குறிக்கலாம்; இச்சூழலில் மக்கள்தொகைக் கணக்கெடுப்பு இயல்பான முதன்மைத் தேர்வு.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: மக்களில் சிலரைத் தன் பின்னால் இழுத்துக்கொண்டான்
  rationale: ἀφίστημι பிறரை முந்தைய நிலைப்பாட்டிலிருந்து விலகச் செய்வதையும் தன்னைப் பின்பற்றச் செய்வதையும் குறிக்கிறது. Article இல்லாத கூட்டு ஒருமை λαόν என்பதால் முழு மக்களையும் குறிக்காமல் இயல்பான தமிழில் ‘மக்களில் சிலரை’ எனத் தரப்பட்டுள்ளது.
- source_word: κἀκεῖνος ἀπώλετο
  choice: அவனும் அழிந்துபோனான்
  rationale: κἀκεῖνος-இன் தொடர்ச்சி மற்றும் ‘அவனும்’ என்ற வலியுறுத்தலைப் பாதுகாக்கிறது; ἀπώλετο மரணத்தின் முறையைக் குறிப்பிடாமல் அழிவைச் சந்தித்ததைச் சொல்கிறது.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: அவனால் இணங்கவைக்கப்பட்ட அனைவரும்
  rationale: πείθω இங்கு அவனால் மனம் மாற்றப்பட்டு அவனுடன் இணங்கியவர்களைக் குறிக்கிறது; வெறுமனே ‘பின்பற்றியவர்கள்’ என்று கூறி முந்தைய வினையின் தனித்தன்மையை மங்கச் செய்யவில்லை.
- source_word: διεσκορπίσθησαν
  choice: சிதறடிக்கப்பட்டார்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் கூட்டம் கலைந்து பல இடங்களுக்குச் சிதறிய பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: யூதாஸின் இயக்கத்தை வரலாற்று-அரசியல் ரீதியாக விவரித்தல்
  choice: அவன் மக்களைத் தன் பின்னால் இழுத்துக்கொண்டதாக மட்டுமே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கலகத்தை நடத்தினான்’ அல்லது ‘புரட்சிக்குத் தூண்டினான்’ என்று வெளிப்படையாகக் கூறுதல்.
  rationale: வரலாற்றுப் பின்னணியில் அவன் இயக்கம் கிளர்ச்சியுடன் தொடர்புடையதாக இருந்தாலும், இந்த வசனத்தின் கிரேக்கம் கலகம் அல்லது புரட்சி என்ற பெயர்ச்சொல்லை வெளிப்படையாகப் பயன்படுத்தவில்லை. ஆகவே மூலத்தில் இல்லாத அரசியல் மதிப்பீடு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டது. வரலாற்றுச் சொல்லாக்கம் தெளிவாக வைக்கப்பட்டு, மூலத்தில் வெளிப்படையாக இல்லாத ‘கலகம்’ போன்ற அரசியல் விவரங்கள் சேர்க்கப்படவில்லை. முதன்மை உரையில் உள்ள [a] குறி அடிக்குறிப்புடன் பொருந்துகிறது.
