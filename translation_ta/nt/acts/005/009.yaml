revisions:
- from: அப்போது பேதுரு அவளிடம், “ஆண்டவருடைய ஆவியைச் சோதிக்க நீங்கள் ஏன் உங்களுக்குள் ஒத்துக்கொண்டீர்கள்?[a] இதோ, உன் கணவனை அடக்கம் செய்தவர்களின் கால்கள் வாசலில் இருக்கின்றன; அவர்கள் உன்னையும் வெளியே சுமந்துகொண்டு போவார்கள்” என்றார்.
  to: அப்போது பேதுரு அவளிடம், “ஆண்டவருடைய ஆவியைச் சோதிக்க நீங்கள் ஏன் ஒருமனப்பட்டீர்கள்?[a] இதோ, உன் கணவனை அடக்கம் செய்தவர்களின் கால்கள் வாசலில் இருக்கின்றன; அவர்கள் உன்னை வெளியே சுமந்து செல்வார்கள்” என்றார்.
  rationale: திருத்தம் மூலத்தின் பொருளை மாற்றாது. «ஒருமனப்பட்டீர்கள்» συμφωνέω-வின் பரஸ்பர உடன்பாட்டை நவீன இயல்பான தமிழில் தருகிறது. «உன்னை வெளியே சுமந்து செல்வார்கள்» என்பது σε-வை கூடுதல் இணைப்பின்றி நேரடியாக மொழிபெயர்க்கிறது. அடிக்குறிப்பு, மாற்று விளக்கத்தின் வலிமையைத் தக்கவைத்துக்கொண்டு, மூலச் சொற்றொடரின் ‘ஆண்டவருடைய ஆவியைச் சோதிக்க’ என்ற கூறையும் முழுமையாகக் கொண்டுள்ளது.
