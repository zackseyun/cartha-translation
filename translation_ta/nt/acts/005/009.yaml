source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: ta
  text: அப்போது பேதுரு அவளிடம், “ஆண்டவருடைய ஆவியைச் சோதிக்க நீங்கள் ஏன் ஒருமனப்பட்டீர்கள்?[a] இதோ, உன் கணவனை அடக்கம் செய்தவர்களின் கால்கள் வாசலில் இருக்கின்றன; அவர்கள் உன்னை வெளியே சுமந்து செல்வார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவருடைய ஆவியைச் சோதிக்க நீங்கள் ஏன் சேர்ந்து சதி செய்தீர்கள்?”
    reason: சூழலில் உள்ள கூட்டுச் சதியின் வலிமையை வெளிப்படுத்தும் சாத்தியமான மொழிபெயர்ப்பு; ஆனால் ‘சதி’ என்ற குற்றநோக்கம் வினைச்சொல்லின் அடிப்படைப் பொருளைவிட விளக்கமானது.
lexical_decisions:
- source_word: συνεφωνήθη ὑμῖν
  choice: நீங்கள் ... உங்களுக்குள் ஒத்துக்கொண்டீர்கள்
  rationale: செயப்பாட்டு வடிவமும் ὑμῖν என்பதும் இங்கு இருவருக்கிடையிலான பரஸ்பர உடன்பாட்டை இயல்பாகக் குறிக்கின்றன. ‘சதிசெய்தீர்கள்’ என்பது சூழலுக்கு ஏற்ற சாத்தியமான வலுவான பொருள் என்றாலும், வினைச்சொல்லிலேயே இல்லாத குற்றநோக்கை முதன்மை உரையில் சேர்க்காமல் ‘ஒத்துக்கொண்டீர்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: πειράσαι
  choice: சோதிக்க
  rationale: πειράζω என்பதற்கு ‘சோதித்தல்’ அல்லது ‘சோதனைக்குட்படுத்துதல்’ என்ற பொருள் உண்டு. இங்கு ஆண்டவருடைய ஆவியே செயப்படுபொருளாக இருப்பதால் ‘சோதிக்க’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: τὸ πνεῦμα κυρίου
  choice: ஆண்டவருடைய ஆவி
  rationale: கிரேக்க உரையின் உடைமைத் தொடர்பை நேரடியாகப் பாதுகாக்கிறது. அப்போஸ்தலர் 5:3-ன் சூழலில் இது பரிசுத்த ஆவியைக் குறிப்பதாக வலுவாகத் தெரிந்தாலும், மூலத்தில் இல்லாத ‘பரிசுத்த’ என்பதை உரையில் சேர்க்கவில்லை.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை உடனடியாகத் திருப்பும் கிரேக்க இடைச்சொல்லின் உயிரோட்டத்தையும் எச்சரிக்கைத் தொனியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: அடக்கம் செய்தவர்களின் கால்கள்
  rationale: ‘கால்கள்’ என்ற மூலத்தின் தெளிவான, வலுவான உருவகத்தைப் பாதுகாக்கிறது; ‘காலடிச் சத்தம்’ என்று மாற்றுவது மூலத்தில் இல்லாத ஒன்றைச் சேர்க்கும்.
- source_word: τὸν ἄνδρα σου
  choice: உன் கணவனை
  rationale: இச்சூழலில் ἀνήρ சப்பீராவின் கணவனான அனனியாவைக் குறிப்பதால் ‘கணவன்’ என்பதே தெளிவான பொருள்.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: வாசலில்
  rationale: நுழைவிடத்தில் அவர்கள் உடனடியாக இருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐξοίσουσίν σε
  choice: உன்னையும் வெளியே சுமந்துகொண்டு போவார்கள்
  rationale: ἐκφέρω என்பதன் ‘வெளியே சுமந்துகொண்டு போதல்’ என்ற நேரடிப் பொருளையும், வரவிருக்கும் மரணத்தை வெளிப்படையாகச் சேர்க்காமல் அதன் அச்சுறுத்தும் தொனியையும் காக்கிறது.
- source_word: Τί ὅτι
  choice: ஏன்
  rationale: காரணத்தை வினவும் கண்டனக் கேள்வியின் இயல்பான தமிழ் வடிவம்; கிரேக்க மொழிநடையைச் செயற்கையாகப் பின்பற்றுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘ஆண்டவருடைய ஆவி’ என்பதன் குறிப்பு
  choice: மூலத்தின் சொற்றொடரை ‘ஆண்டவருடைய ஆவி’ என வைத்திருத்தல்
  alternative: ‘பரிசுத்த ஆவி’ என வெளிப்படையாக விரித்துரைத்தல்
  rationale: அப்போஸ்தலர் 5:3-ன் தொடர்ச்சியில் பரிசுத்த ஆவியே குறிக்கப்படுவது வலுவானது. ஆயினும், மூலச் சொற்றொடரின் வடிவத்தையும் அதன் தொடர்பையும் காக்க ‘பரிசுத்த’ என்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை.
- issue: பேதுருவின் குற்றச்சாட்டின் வலிமை
  choice: ‘உங்களுக்குள் ஒத்துக்கொண்டீர்கள்’
  alternative: ‘சதிசெய்தீர்கள்’
  rationale: சூழல் திட்டமிட்ட கூட்டுச் செயலைக் காட்டினாலும், συμφωνέω அடிப்படையில் உடன்படுதலைக் குறிக்கிறது. ஆகவே குற்றச்சாட்டின் தீவிரம் சூழலிலிருந்து வெளிப்பட அனுமதித்து, வினைச்சொல்லை அளவுக்கு மீறி வலுப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் நேரடியான கண்டனத் தொனியும் காக்கப்பட்டுள்ளன. பேதுரு சப்பீராவிடம் ஒருமையில் பேசுவதால் ‘உன்/உன்னையும்’ பயன்படுத்தப்பட்டுள்ளது; அவளும் அவள் கணவனும் செய்த பரஸ்பர உடன்பாட்டைச் சுட்ட ‘நீங்கள் ... உங்களுக்குள்’ பயன்படுத்தப்பட்டுள்ளது. ‘கால்கள் வாசலில் இருக்கின்றன’ என்ற சற்று வியப்பூட்டும் படிமம் மூலத்தின் திட்டமிட்ட உயிரோட்டத்தைக் காக்கிறது.
