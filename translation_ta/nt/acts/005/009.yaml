  naturalness: «பேதுரு அவளிடம் ... என்றார்» மற்றும் «வாசலில் இருக்கின்றன» நவீனத் தரத் தமிழில் இயல்பாக உள்ளன. கேள்வியில் «நீங்கள் ஏன் உங்களுக்குள் ஒத்துக்கொண்டீர்கள்?» என்பது புரிந்துகொள்ளத்தக்கது; ஆனால் «நீங்கள் ஏன் ஒருமனப்பட்டீர்கள்?» என்பது συμφωνέω-வின் பரஸ்பர உடன்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
  terminology: «ஆண்டவருடைய ஆவி», «சோதிக்க», «அடக்கம் செய்தவர்கள்», «கணவன்» ஆகியவை துல்லியமானவை. ‘சதி செய்தீர்கள்’ என்பதைக் குறிப்பாக மட்டும் வைத்திருப்பது பொருத்தமானது; ஆயினும் அந்தக் குறிப்பில் «சோதிக்க» என்ற எஞ்சிய பொருள் விடுபடக் கூடாது. எனவே மாற்றுக் குறிப்பை முழு வாக்கியமாக அமைத்தல் அவசியம்.
