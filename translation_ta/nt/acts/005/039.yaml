  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: ta
  text: ஆனால் இது கடவுளிடமிருந்து வந்ததானால், அவர்களை வீழ்த்த உங்களால் முடியாது.[a] ஒருவேளை நீங்கள் கடவுளையே எதிர்த்துப் போராடுகிறவர்களாகக் கூடக் காணப்படலாம்.” எனவே அவருடைய பேச்சால் அவர்கள் இணங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களை அழிக்க” அல்லது “அவர்களை முறியடிக்க” என்றும் மொழிபெயர்க்கலாம். “அவர்களை” என்பது மிக இயல்பாக அப்போஸ்தலர்களைக் குறிக்கிறது; சிலர் இதை அவர்களுடைய இயக்கம் அல்லது செயலையும் உள்ளடக்கியதாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: கடவுளிடமிருந்து வந்தது
  rationale: ἐκ இங்கு மூலத்தையும் தோற்றத்தையும் குறிக்கிறது; ‘கடவுளிடமிருந்து வந்தது’ என்பது அந்தக் கருத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: δυνήσεσθε
  choice: உங்களால் முடியாது
  rationale: எதிர்காலத் திறனைச் சுட்டும் வினை வடிவத்தைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: καταλῦσαι
  choice: வீழ்த்த
  rationale: ஒரு குழுவையோ அதன் செயலையோ முறியடித்து இல்லாமற் செய்வதைக் குறிக்கும் சூழல்சார் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: ஆண்பால் பன்மைச் சுட்டுப்பெயரைப் பாதுகாத்து, மிக இயல்பாக அப்போஸ்தலர்களைக் குறிக்கிறது; முந்தைய திட்டம் அல்லது செயல் என்ற கருத்துடனான தொடர்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: μήποτε
  choice: ஒருவேளை
  rationale: விரும்பத்தகாத முடிவு ஏற்படக்கூடும் என்ற எச்சரிக்கைத் தொனியையும் சாத்தியத்தையும் பாதுகாக்கிறது.
- source_word: θεομάχοι
  choice: கடவுளையே எதிர்த்துப் போராடுகிறவர்கள்
  rationale: ‘கடவுளோடு போரிடுகிறவர்கள்’ என்ற கூட்டுச்சொல்லின் வலிமையையும் இறையியல் தீவிரத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: εὑρεθῆτε
  choice: காணப்படலாம்
  rationale: ஒருவர் உண்மையில் எத்தகையவராக இருக்கிறார் என்பது வெளிப்படுதல் அல்லது நிரூபிக்கப்படுதல் என்ற செயப்பாட்டு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: எனவே அவர்கள் அவருடைய சொல்லுக்கு இணங்கினார்கள்
  rationale: சபையினர் கமாலியேலின் ஆலோசனையை ஏற்றுச் செயல்பட்டனர் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; δέ இங்கு தொடர்ச்சியான விளைவை அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: αὐτούς என்பதன் சுட்டுப்பொருள்
  choice: ‘அவர்களை’ என்பது மிக இயல்பாக அப்போஸ்தலர்களைக் குறிக்கிறது.
  alternative: முந்தைய வசனத்தில் கூறப்பட்ட திட்டம் அல்லது செயலை, அதைச் செய்கிறவர்களோடு இணைத்து விரிவாகக் குறிக்கலாம்.
  rationale: கிரேக்கச் சுட்டுப்பெயர் ஆண்பால் பன்மையில் இருப்பதால் நபர்களே நேரடியான சுட்டுப்பொருள். இருப்பினும், முந்தைய ‘திட்டம் அல்லது செயல்’ பற்றிய சூழலால் உருவாகும் பரந்த புரிதலை அடிக்குறிப்பில் பாதுகாக்கிறோம்; இதனால் வாக்கியத்தை எந்த மத இயக்கத்திற்குமான பொதுவான வாக்குறுதியாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதாயும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதாயும் வடிவமைக்கப்பட்டது. ‘கடவுளையே’ என்பது θεομάχοι என்பதிலுள்ள தீவிர எதிர்ப்பை வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு உரையில் இடம்பெற்றுள்ளது.
