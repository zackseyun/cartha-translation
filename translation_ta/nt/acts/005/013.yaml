id: ACT.5.13
reference: Acts 5:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: ta
  text: மற்றவர்களில் எவரும் அவர்களோடு சேர்ந்துகொள்ளத் துணியவில்லை; மாறாக, மக்கள் அவர்களை உயர்வாக மதித்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν λοιπῶν
  choice: மற்றவர்களில்
  rationale: குறிப்பிடப்பட்ட குழுவுக்கு வெளியே இருந்த எஞ்சிய மக்களை இயல்பான தமிழில் குறிக்கிறது; அவர்கள் யார் என்பதை மூலவாக்கியம் வெளிப்படையாக வரையறுக்காததால் அதனைத் தீர்மானிக்கவில்லை.
- source_word: ἐτόλμα
  choice: துணியவில்லை
  rationale: செய்யத் தைரியம் கொள்ளுதல் என்ற வினையின் நேரடியான பொருளை வழங்குகிறது.
- source_word: κολλᾶσθαι αὐτοῖς
  choice: அவர்களோடு சேர்ந்துகொள்ள
  rationale: κολλάομαι என்பதிலுள்ள நெருக்கமாக இணைதல் அல்லது தன்னைச் சேர்த்துக்கொள்ளுதல் என்ற கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀλλ’
  choice: ஆனாலும்
  rationale: முந்தைய கூற்றுக்கும் மக்கள் காட்டிய மதிப்புக்கும் இடையிலான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது; இங்கு சாதாரண ‘ஆனால்’ என்பதைக் காட்டிலும் இயல்பான எதிர்நிலையைத் தருகிறது.
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: மக்கள் அவர்களை மிகவும் மதித்தார்கள்
  rationale: சொல்லுக்கு சொல் ‘பெருமைப்படுத்தினர்’ என்பதற்குப் பதிலாக, இச்சூழலில் மக்கள் அவர்களை உயர்வாகக் கருதியதை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘மற்றவர்கள்’ மற்றும் ‘அவர்கள்’ என்போர் யார் என்பது
  choice: பிரதிப்பெயர்களையும் குழுக் குறிப்பையும் மூலத்தில் உள்ளபடியே திறந்த நிலையில் வைத்தல்
  alternative: ‘மற்ற விசுவாசிகள்’ என்றும் ‘அப்போஸ்தலர்கள்’ என்றும் வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: சூழல் சாத்தியமான அடையாளங்களைத் தரினும், இவ்வசனம் அவற்றை நேரடியாகப் பெயரிடவில்லை; ஆகவே விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இரண்டு முரண்பட்ட செயல்களை இரண்டு வாக்கியங்களாக அமைத்து தெளிவுபடுத்தப்பட்டுள்ளது; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
