  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு நிகழ்வுத் தொடர்கள் தெளிவாக இருக்க வாக்கியம் இரண்டாகப் பிரிக்கப்பட்டது; தேவையற்ற சமய அல்லது நிறுவன விளக்கம் சேர்க்கப்படவில்லை.
