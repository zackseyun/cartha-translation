  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: ta
  text: ஆனால் காவலர்கள் வந்து சேர்ந்தபோது, அவர்களைச் சிறையில் காணவில்லை; ஆகவே அவர்கள் திரும்பிச் சென்று அறிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: அங்கு வந்து சேர்ந்தபோது
  rationale: இறைச்சொல் வடிவிலுள்ள பங்கேற்புவினை, காவலர்கள் சிறைக்கு வந்து சேர்ந்த காலத்தைச் சுட்டுகிறது. தமிழில் இயல்பான காலத் தொடர்பைக் காட்ட ‘வந்து சேர்ந்தபோது’ பயன்படுத்தப்பட்டது; ‘அங்கு’ என்பது சூழலில் தெளிவாக உள்ள சிறையை குறிக்கிறது.
- source_word: ὑπηρέται
  choice: காவலர்கள்
  rationale: இங்கு இந்தச் சொல் யூதத் தலைவர்களின் அதிகாரத்தின்கீழ் செயல்பட்ட அலுவல் பணியாளர்களைக் குறிக்கிறது; வீட்டுப் பணியாளர்களை அல்ல. சிறைக்குச் சென்று கைதிகளை அழைத்துவரும் சூழலில் ‘காவலர்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘ஆலயக் காவலர்கள்’ என்பது இவ்வசனம் வெளிப்படையாகக் கூறாத தகவலைச் சேர்க்கும்.
- source_word: οὐχ εὗρον
  choice: காணவில்லை
  rationale: கதைநடையில் தேடியவர்களை அந்த இடத்தில் காண இயலாததை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τῇ φυλακῇ
  choice: சிறையில்
  rationale: கிரேக்கத்தில் குறிப்பிட்ட சிறை சுட்டப்பட்டாலும், தமிழில் முன்பே அறிமுகமான இடத்தைக் குறிக்க தனி சுட்டுச் சொல் தேவையில்லை; ‘சிறையில்’ இயல்பாக அந்தக் குறிப்பிட்ட சிறையையே உணர்த்துகிறது.
- source_word: ἀναστρέψαντες
  choice: திரும்பிச் சென்று
  rationale: அவர்களை அனுப்பியவர்களிடம் மீண்டும் சென்றதைச் சூழல் உணர்த்துகிறது. ‘திரும்பிச் சென்று’ அந்த இயக்கத்தைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀπήγγειλαν
  choice: செய்தியைத் தெரிவித்தார்கள்
  rationale: அதிகாரப்பூர்வமாகத் தகவலைத் திரும்பக் கொண்டு வந்து அறிவித்த செயலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: δέ
  choice: ஆனால் / ஆகவே
  rationale: முதல் δέ, எதிர்பார்ப்புக்கு மாறாக அப்போஸ்தலர்கள் சிறையில் காணப்படாததைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. இரண்டாவது δέ கதைத் தொடர்ச்சியை இணைக்கிறது; தமிழில் நிகழ்வுகளின் விளைவுத் தொடர்பை இயல்பாகக் காட்ட ‘ஆகவே’ பயன்படுத்தப்பட்டது.
