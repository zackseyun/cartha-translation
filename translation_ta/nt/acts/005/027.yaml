  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: ta
  text: அவர்களை அழைத்து வந்து, மன்றத்தின்[a] முன் நிறுத்தினார்கள். தலைமை ஆசாரியர் அவர்களிடம் கேள்வி கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சன்ஹெட்ரின் முன்.” கிரேக்கச் சொல் யூதர்களின் ஆளும் மன்றத்தைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: அவர்களை அழைத்து வந்து
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கு முன்னர் நடந்த செயலைக் குறிக்கிறது; ‘அழைத்து வந்து’ என்பது அந்த வரிசையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: δὲ
  choice: —
  rationale: இங்கு இது கதையை முன்னெடுக்கும் மென்மையான இணைப்புச்சொல். தமிழில் தனியே மொழிபெயர்க்காமல் விடுவது இயல்பான ஓட்டத்தைத் தருகிறது.
- source_word: ἔστησαν
  choice: முன் நிறுத்தினார்கள்
  rationale: ἵστημι இங்கு ஒருவரை நிற்கச் செய்தல் அல்லது ஒரு மன்றத்தின் முன் கொண்டுவந்து நிறுத்துதல் என்ற செயப்படுபொருள் கொண்ட பொருளில் வருகிறது; நீதிமன்றச் சூழலை ‘முன் நிறுத்தினார்கள்’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐν τῷ συνεδρίῳ
  choice: மன்றத்தின் முன்
  rationale: συνέδριον என்பது இங்கு யூதர்களின் ஆட்சிமன்றத்தைக் குறிக்கிறது. ‘மன்றம்’ அதன் பொதுப்பொருளை மொழிபெயர்க்கிறது; ‘முன்’ என்பது நிறுத்தப்பட்ட நீதிமன்றச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπηρώτησεν
  choice: கேள்வி கேட்டார்
  rationale: ἐπερωτάω என்பதன் அடிப்படைப் பொருள் கேட்பது அல்லது கேள்வி கேட்பது. முறையான விசாரணைச் சூழலைச் சூழலே தெளிவுபடுத்துவதால், ‘கேள்வி கேட்டார்’ மூலத்தின் வலிமையை மிகைப்படுத்தாமல் தருகிறது.
- source_word: ὁ ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: யூத வழிபாட்டு அமைப்பில் தலைமை வகித்த ἀρχιερεύς என்பவரைக் குறிக்கும் தெளிவான, வழக்கமான தமிழாக்கம்.
theological_decisions:
- issue: συνέδριον என்பதன் மொழிபெயர்ப்பு
  choice: மன்றம்
  alternative: சன்ஹெட்ரின்
  rationale: பாரம்பரிய ஒலிபெயர்ப்பை முதன்மை உரையில் இடுவதற்குப் பதிலாக கிரேக்கப் பொதுப்பெயரின் பொருள் மொழிபெயர்க்கப்படுகிறது. குறிப்பிட்ட மன்றம் சன்ஹெட்ரின் என்பதைக் குறிப்புரை விளக்குகிறது; இதனால் மூலச்சொல்லின் பொதுப்பொருளும் வரலாற்றுக் குறிப்பும் இரண்டும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. வாக்கிய அமைப்பு கிரேக்கத்தில் உள்ள செயல்களின் வரிசையைப் பாதுகாக்கிறது.
