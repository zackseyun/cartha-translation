id: ACT.5.32
reference: Acts 5:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: ta
  text: இந்தக் காரியங்களுக்கு நாங்கள் சாட்சிகள்[a]; கடவுள் தமக்குக் கீழ்ப்படிகிறவர்களுக்குக் கொடுத்த பரிசுத்த ஆவியும் சாட்சி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தச் சொற்களுக்கு’ அல்லது ‘இந்த விஷயங்களுக்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் நேரடியாக, ‘பரிசுத்த ஆவியும்’ என்று உள்ளது; முந்தைய கூறிலுள்ள பொருள் தொடர்ந்து, ‘பரிசுத்த ஆவியும் [சாட்சி]’ என்று புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυρες
  choice: சாட்சிகள்
  rationale: நேரில் அறிந்தவற்றைக் குறித்து சான்றளிப்பவர்களைக் குறிக்கும் இயல்பான, வழக்கமான தமிழ் சொல்; அப்போஸ்தலர் பணிகளின் சாட்சியச் சூழலுக்கும் பொருந்துகிறது.
- source_word: ῥημάτων
  choice: காரியங்கள்
  rationale: ῥῆμα என்பதற்கு ‘சொற்கள்’, ‘கூற்றுகள்’, ‘நிகழ்வுகள்/காரியங்கள்’ என்ற பொருள் வரலாம். இங்கு பேதுரு முன் கூறிய நிகழ்வுகளையும் செய்தியையும் மொத்தமாகக் குறிப்பதால் ‘காரியங்கள்’ இயல்பாக உள்ளது; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவி
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றதுடன், இன்றைய வாசகருக்கும் தெளிவாகப் புரியும் மரியாதையான மொழிபெயர்ப்பு.
- source_word: ὃ
  choice: ஆவியும்
  rationale: தமிழில் தொடர்புப்பெயரை வெளிப்படையாக மொழிபெயர்க்காமல், ‘கடவுள் ... கொடுத்த பரிசுத்த ஆவி’ என்ற பெயரெச்சத் தொடரால் இயல்பாகவும் தனிப்பட்ட செயற்பாட்டாளரைக் குறிக்கும் விதமாகவும் அமைக்கப்பட்டுள்ளது.
- source_word: ἔδωκεν
  choice: கொடுத்த
  rationale: கிரேக்க இறந்தகாலச் செயலை நேரடியாகக் காக்கிறது; தமிழ் பெயரெச்ச அமைப்பில் அதன் தற்போதைய தொடர்பும் இயல்பாகத் தொடர்கிறது.
- source_word: πειθαρχοῦσιν
  choice: கீழ்ப்படிகிறவர்களுக்கு
  rationale: அதிகாரமுள்ள ஒருவருக்குக் கீழ்ப்படிதல் என்ற πειθαρχέω-வின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; 5:29-ன் உடனடி சூழலோடும் ஒத்துள்ளது.
- source_word: αὐτῷ
  choice: தமக்கு
  rationale: முன்னுள்ள ‘கடவுள்’ என்பதையே சுட்டுகிறது. உயர்திணைத் தற்சுட்டான ‘தமக்கு’ தமிழில் கடவுளே கீழ்ப்படிதலின் இலக்கு என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: பரிசுத்த ஆவி அப்போஸ்தலர்களுடன் இணைந்து சாட்சியாகக் காட்டப்படுகிறாரா?
  choice: ‘பரிசுத்த ஆவியும் சாட்சி’ என்று முந்தைய வாக்கியத்தின் பயனிலையை இரண்டாம் கூறிலும் வெளிப்படையாக வழங்குதல்.
  alternative: ‘பரிசுத்த ஆவியும்’ என்று மட்டும் வைத்து ‘சாட்சி’ என்பதை உள்ளுறையாகப் புரிந்துகொள்ளுதல்.
  rationale: இரண்டாம் கிரேக்கக் கூறில் வினை வெளிப்படையாக இல்லாவிட்டாலும், முதல் கூறிலுள்ள ἐσμεν μάρτυρες என்ற பயனிலை இயல்பாகத் தொடர்கிறது. தமிழில் ‘சாட்சி’ என்பதை மீண்டும் கூறுவது பொருளைச் சேர்க்காமல் தொடரமைப்பைத் தெளிவாக்குகிறது.
- issue: பரிசுத்த ஆவியைச் சுட்டும் ὃ என்ற தொடர்புப்பெயரின் மொழிபெயர்ப்பு
  choice: தனி தொடர்புப்பெயரைப் பயன்படுத்தாமல், ‘கடவுள் ... கொடுத்த பரிசுத்த ஆவி’ என்ற இயல்பான தமிழ் பெயரெச்சத் தொடரைப் பயன்படுத்துதல்.
  alternative: ‘அவரைக் கடவுள்... கொடுத்தார்’ என்று தனிப்பட்ட சுட்டுப்பெயருடன் மொழிபெயர்த்தல்.
  rationale: கிரேக்கத்தில் ὃ என்பது πνεῦμα என்ற நடுநிலைப் பெயர்ச்சொல்லோடு இலக்கண ஒத்திசைவால் நடுநிலை வடிவில் உள்ளது. தமிழில் பெயரெச்சத் தொடர் அந்த இலக்கண விவரத்தை செயற்கையாகப் பெரிதுபடுத்தாமலும், ஆவியை உயிரற்றதாகக் காட்டாமலும் மூலத்தின் உறவைத் துல்லியமாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குத் தெளிவானதும் மரியாதைமிக்கதுமான நடை. ‘இந்தக் காரியங்கள்’ என்பது நிகழ்வுகளையும் அறிவிக்கப்பட்ட செய்தியையும் உள்ளடக்குகிறது. ‘தமக்கு’ என்பது கடவுளைத் தெளிவாகத் திரும்பச் சுட்டுகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
