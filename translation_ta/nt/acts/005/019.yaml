source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: ta
  text: 'ஆனால் இரவில் ஆண்டவருடைய தூதர் ஒருவர் சிறைச்சாலையின் கதவுகளைத் திறந்து, அவர்களை வெளியே அழைத்துவந்து, சொன்னார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: தூதர் ஒருவர்
  rationale: ἄγγελος என்பது சூழலில் மனிதத் தூதுவரை அல்ல, வானதூதரைச் சுட்டுகிறது. கிரேக்கத்தில் சுட்டுப்பெயர்ச்சொல் இல்லாததால், ‘ஒருவர்’ என்பது குறிப்பிடப்படாத தன்மையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: κυρίου
  choice: ஆண்டவருடைய
  rationale: κύριος என்பதற்கான வழக்கமான வேதாகமத் தமிழ் ‘ஆண்டவர்’; உடைமைத் தொடர்பை ‘ஆண்டவருடைய’ தெளிவாகக் காட்டுகிறது.
- source_word: διὰ νυκτός
  choice: இரவில்
  rationale: διά உடன் வரும் இவ்வமைப்பு காலத்தைக் குறிக்கிறது. ‘இரவில்’ என்பது இயல்பான நவீனத் தமிழ்; நிகழ்வு இரவின்போது நடந்ததைக் கூறுகிறது.
- source_word: ἤνοιξε
  choice: திறந்து
  rationale: ἀνοίγω என்பதன் நேரான பொருள் ‘திற’; ‘பூட்டைத் திறந்து’ என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத விவரத்தைச் சேர்க்கும்.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: சிறைச்சாலையின் கதவுகளை
  rationale: θύραι என்பது பன்மையில் ‘கதவுகள்’; φυλακή இச்சூழலில் ‘சிறைச்சாலை’. கிரேக்க அமைப்பையும் தமிழின் இயல்பையும் இச்சொற்றொடர் காக்கிறது.
- source_word: ἐξαγαγών
  choice: வெளியே அழைத்துவந்து
  rationale: ἐξάγω என்பது ஒருவரை வெளியே வரச் செய்வதைக் குறிக்கிறது. ‘அழைத்துவந்து’ என்பது தமிழில் இயல்பாக அந்தச் செயலை வெளிப்படுத்துகிறது; வெறும் ‘வந்து’ எனும் பொருளைத் தவிர்க்க ‘வெளியே’ சேர்க்கப்பட்டுள்ளது.
- source_word: τε
  choice: மேலும் தனியே மொழிபெயர்க்காமல் தொடர்வினை அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: τε இங்கு மென்மையான இணைப்பை அளிக்கிறது. தமிழ் தொடர்வினைகளான ‘திறந்து, ... அழைத்துவந்து, சொன்னார்’ அந்த இணைப்பை இயல்பாகவே காட்டுகின்றன.
- source_word: εἶπεν
  choice: சொன்னார்
  rationale: λέγω என்பதன் இறந்தகாலக் கதைநடை வடிவிற்கு ‘சொன்னார்’ இயல்பான மொழிபெயர்ப்பு. அடுத்த வசனத்தில் சொல்லப்பட்ட வார்த்தைகள் வருவதால் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ἄγγελος என்பவரின் இயல்பு
  choice: வானதூதரைக் குறிக்கும் ‘தூதர்’
  alternative: மனிதத் தூதுவர்
  rationale: சிறைக் கதவுகளைத் திறந்து கைதிகளை வெளியே கொண்டுவரும் இச்சூழல் தெய்வீகச் செயல்பாட்டைக் காட்டுகிறது. ஆகவே மனிதச் செய்தியாளர் என்ற வாசிப்பைவிட வானதூதர் என்ற வாசிப்பே சூழலுக்கு ஏற்றது; எனினும் தமிழில் வழக்கமான வேதாகமச் சொல்லான ‘தூதர்’ பயன்படுத்தப்படுகிறது.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: ‘ஆண்டவர்’ என்பது κύριος என்பதற்கான நிலைபெற்ற, மரியாதையான வேதாகமத் தமிழ். ‘ஆண்டவருடைய தூதர்’ என்ற மரபான சொற்றொடரையும் இது காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடை ஓட்டமும் காக்கப்பட்டுள்ளன. கிரேக்க வாக்கியத்தின் செயல்தொடர் தமிழ் தொடர்வினைகளால் இயல்பாக வழங்கப்பட்டுள்ளது. ‘தேவதூதர்’ என்பதற்குப் பதில் மூலத்தின் பொதுவான ἄγγελος சொல்லை நெருக்கமாகக் காக்க ‘ஆண்டவருடைய தூதர் ஒருவர்’ பயன்படுத்தப்பட்டுள்ளது.
