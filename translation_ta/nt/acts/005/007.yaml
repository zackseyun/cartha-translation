  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: ta
  text: சுமார் மூன்று மணி நேர இடைவெளிக்குப் பிறகு, என்ன நடந்திருந்தது என்று அறியாமல் அவனுடைய மனைவி உள்ளே வந்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: பிறகு
  rationale: இந்தச் சூழலில் Ἐγένετο என்பது அடுத்த நிகழ்வை அறிமுகப்படுத்தும் கதைநடை மரபுத்தொடர்; δὲ மென்மையான தொடர்ச்சியைச் சுட்டுகிறது. தமிழில் காலத் தொடரை இயல்பாகக் காட்டும் “பிறகு” இவ்விரண்டின் கதைநடைச் செயலையும் அளிக்கிறது.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: சுமார் மூன்று மணி நேர இடைவெளிக்குப்
  rationale: διάστημα கால இடைவெளியையும், அளவுடன் வரும் ὡς தோராயத்தையும் குறிக்கிறது. ஆகவே காலத்தைத் துல்லியமான மூன்று மணியாக்காமல் “சுமார்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: அவனுடைய மனைவி
  rationale: இங்கு γυνή, முந்தைய சூழலில் குறிப்பிடப்பட்ட அனனியாவின் மனைவியைக் குறிக்கிறது; எனவே பொதுவான “பெண்” என்பதற்குப் பதிலாக “மனைவி” பொருத்தமானது.
- source_word: μὴ εἰδυῖα τὸ γεγονὸς
  choice: என்ன நடந்திருந்தது என்று அறியாமல்
  rationale: μὴ εἰδυῖα அவள் உள்ளே வந்தபோது நிலவிய அறியாமையைக் காட்டுகிறது; perfect participle γεγονός ஏற்கெனவே நிகழ்ந்து முடிந்ததைச் சுட்டுவதால் “நடந்திருந்தது” என்று வழங்கப்பட்டுள்ளது.
- source_word: εἰσῆλθεν
  choice: உள்ளே வந்தாள்
  rationale: εἰσέρχομαι ஓர் இடத்திற்குள் நுழைவதைக் குறிக்கிறது. காட்சியின் நோக்குநிலைக்கு ஏற்ற இயல்பான தமிழ் கதைநடையாக “உள்ளே வந்தாள்” பயன்படுத்தப்பட்டுள்ளது.
