  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை. மூலத்தின் கால வரிசையும், சுமார் என்ற தோராயப் பொருளும், மனைவியின் அறியாமையும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
