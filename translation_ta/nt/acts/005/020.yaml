source:
  edition: SBLGNT
  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: ta
  text: “நீங்கள் போய், ஆலயத்தில்[a] நின்று[b], இந்த வாழ்வின் எல்லா வார்த்தைகளையும்[c] மக்களிடம் பேசுங்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆலய வளாகத்தில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ἱερόν ஆலயத்தின் உட்பரிசுத்த இடத்தை மட்டும் அல்ல, முழு ஆலய வளாகத்தையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆலயத்தில் நின்றுகொண்டு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இது வினையெச்ச வடிவில் உள்ளது.
    reason: previous_rendering
  - marker: c
    text: ‘இந்த வாழ்வைப் பற்றிய’ அல்லது ‘இந்த வாழ்க்கை முறைக்குரிய’ என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் நற்செய்தியில் அறிவிக்கப்படும் வாழ்வைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε
  choice: நீங்கள் போய்
  rationale: கட்டளையின் நேரடியான இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடுத்து வரும் வினையுடன் தொடர்ச்சியாக இணைகிறது.
- source_word: σταθέντες
  choice: நின்று
  rationale: 'இறந்தகால வினையெச்சத்தின் தொடர்நிலைச் செயல்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது: போய், நின்று, பேசுங்கள்.'
- source_word: λαλεῖτε
  choice: பேசுங்கள்
  rationale: λαλέω என்பதன் பொதுவான ‘பேசு/சொல்’ பொருளைத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘பிரசங்கியுங்கள்’ என்ற அறிவிப்பு நுட்பத்தைச் சேர்க்கவில்லை.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உட்பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தையும் குறிக்கலாம். முதன்மை உரையில் இயல்பான சுருக்கமான சொல்லாக்கம் வைக்கப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῷ λαῷ
  choice: மக்களிடம்
  rationale: அங்கு கூடியிருந்த மக்களை நேரடியாகக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத இன அல்லது கூட்ட விவரத்தைச் சேர்க்கவில்லை.
- source_word: πάντα τὰ ῥήματα
  choice: வார்த்தைகள் அனைத்தையும்
  rationale: πᾶς மற்றும் ῥῆμα ஆகிய இரண்டின் தனித்த கூறுகளையும் காக்கிறது; ‘செய்தி முழுவதையும்’ என்பதைக் காட்டிலும் மூலச் சொல்லமைப்புக்கு நெருக்கமானது.
- source_word: τῆς ζωῆς ταύτης
  choice: இந்த வாழ்வுக்குரிய
  rationale: ‘இந்த வாழ்வு’ என்பதுடன் வார்த்தைகளுக்கு உள்ள தொடர்பைச் சுருக்கமாகக் காட்டுகிறது; அது இந்த வாழ்வைப் பற்றியதா, அதற்குச் சொந்தமானதா, அல்லது அதைக் கொடுக்கும் செய்தியா என்பதை ஒரே விளக்கமாக முடிவுசெய்யவில்லை.
theological_decisions:
- issue: τῆς ζωῆς ταύτης (‘இந்த வாழ்வு’) என்பதன் பொருள்
  choice: ‘இந்த வாழ்வுக்குரிய’ என்ற திறந்த சொல்லாக்கத்தைத் தக்கவைத்தல்
  alternative: ‘இந்தப் புதிய வாழ்வைப் பற்றிய’ அல்லது ‘வாழ்வளிக்கும் செய்தி’
  rationale: இச்சொற்றொடர் இயேசுவில் அறிவிக்கப்படும் இரட்சிப்பு வாழ்வைக் குறிக்கக்கூடும்; ஆயினும் கிரேக்க உரை சுருக்கமாகவும் பல பொருள் சாத்தியத்துடனும் உள்ளது. ஆகவே ‘புதிய’ அல்லது ‘வாழ்வளிக்கும்’ போன்ற விளக்கச் சொற்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான கட்டளை மொழி பயன்படுத்தப்பட்டுள்ளது. ‘தேவாலயம்’ இன்று கிறிஸ்தவ சபைக் கட்டடம் என்று தவறாகப் புரிந்துகொள்ளப்படலாம் என்பதால் ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது; வளாகப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
