- from: “நீங்கள் போய், ஆலயத்தில்[a] நின்று[b], இந்த வாழ்வுக்குரிய[c] வார்த்தைகள் அனைத்தையும் மக்களிடம் பேசுங்கள்.”
  to: “நீங்கள் போய், ஆலயத்தில்[a] நின்று[b], இந்த வாழ்வின் எல்லா வார்த்தைகளையும்[c] மக்களிடம் பேசுங்கள்.”
