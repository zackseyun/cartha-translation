source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: ta
  text: அனனியா இந்த வார்த்தைகளைக் கேட்டதும், கீழே விழுந்து உயிர்விட்டான்.[a] கேட்ட அனைவருக்கும் மிகுந்த பயம் ஏற்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறுதி மூச்சுவிட்டான்.”
    reason: ἐξέψυξεν என்ற வினையின் சொற்படிமத்திற்கு நெருக்கமான மாற்றுச் சொல்லாக்கம்.
lexical_decisions:
- source_word: ἀκούων
  choice: கேட்டதும்
  rationale: நிகழ்வுகளின் உடனடியான தொடரை இயல்பான தமிழில் வெளிப்படுத்தும் காலப்பொருள் கொண்ட வினையெச்சமாக மொழிபெயர்க்கப்பட்டது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல் இன்றி நிகழ்வுத் தொடரால் வெளிப்படுத்தப்பட்டது
  rationale: δέ இங்கு மென்மையான கதை நகர்வைச் சுட்டுகிறது; தமிழில் தனியாக ‘ஆனால்’ சேர்ப்பது தேவையற்ற வலுவான முரண்பாட்டை உருவாக்கும்.
- source_word: λόγους τούτους
  choice: இந்த வார்த்தைகளை
  rationale: பேதுரு இப்போதுதான் கூறிய சொற்களையே நேரடியாகக் குறிக்கிறது.
- source_word: πεσὼν
  choice: கீழே விழுந்து
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த உடல் செயலை மூலத்தின் உருவகத்தைத் தக்கவைத்து நேரடியாகக் காட்டுகிறது.
- source_word: ἐξέψυξεν
  choice: உயிர்விட்டான்
  rationale: இறப்பைத் தெளிவாகச் சொல்லுவதோடு, ‘மூச்சை வெளியே விட்டான்/இறுதி மூச்சுவிட்டான்’ என்ற கிரேக்க வினையின் சொற்படிமத்தையும் இயல்பான தமிழில் ஓரளவு தக்கவைக்கிறது.
- source_word: ἐγένετο φόβος μέγας
  choice: மிகுந்த பயம் ஏற்பட்டது
  rationale: பயம் அவர்களை ஆட்கொண்டதை நவீனத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: இதைக் கேள்விப்பட்ட அனைவருக்கும்
  rationale: எதைக் கேட்டார்கள் என்பதை கிரேக்கம் வெளிப்படையாகக் குறிப்பிடாததால், நிகழ்வைப் பற்றிய செய்தியைக் கேட்டவர்களையும் உள்ளடக்கும் இயல்பான, பரந்த தமிழாக்கம்.
- source_word: Ἁνανίας
  choice: அனனியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: அனனியாவின் மரணத்தின் தன்மை
  choice: அவன் விழுந்து உயிர்விட்டான் என்று நிகழ்வை நேரடியாகக் கூறுதல்; மரணத்திற்கான செயல்முறையை விளக்காதிருத்தல்
  alternative: அதிர்ச்சியால் இயற்கையாக இறந்தான் / கடவுள் நேரடியாக அவனைச் சாகடித்தார்
  rationale: கிரேக்க உரை விழுதலையும் மரணத்தையும் மட்டுமே கூறுகிறது; அதன் காரணமுறையை வெளிப்படையாக விளக்கவில்லை. ஆகவே அந்த இறையியல் பதற்றம் தீர்மானிக்கப்படாமல் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான கதைநடையிலும் வடிவமைக்கப்பட்டது. ‘ஆனால்’ என்ற வலுவான இணைப்பைத் தவிர்த்து இயல்பான தமிழ்த் தொடர்ச்சி பயன்படுத்தப்பட்டது; மரணத்தின் காரணம் உரையில் இல்லாதபடி சேர்க்கப்படவில்லை.
