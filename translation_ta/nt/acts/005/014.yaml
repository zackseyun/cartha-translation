  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: ta
  text: ஆண்டவர்மேல் நம்பிக்கை கொண்ட இன்னும் அதிகமானோர் சேர்க்கப்பட்டு வந்தார்கள்—ஆண்களும் பெண்களுமாகப் பெருந்திரளானோர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேர்ந்துகொண்டு வந்தார்கள்” அல்லது “சேர்க்கப்பட்டார்கள்.” கிரேக்க வினைச்சொல் எண்ணிக்கை தொடர்ந்து பெருகியதைக் குறிக்கலாம்; அதன் செயப்பாட்டு வடிவம், அவர்களைச் சேர்த்தவர் கடவுள் என்பதை மறைமுகமாக உணர்த்தக்கூடும்.
    reason: lexical_alternative
