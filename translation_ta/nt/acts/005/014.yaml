theological_decisions:
- issue: ‘ஆண்டவர்’ என்பதன் குறிப்பு மற்றும் வலிமை
  choice: இச்சூழலில் ‘ஆண்டவர்’ உயிர்த்தெழுந்த இயேசுவைக் குறிக்கிறது; மக்கள் அவர்மேல் நம்பிக்கை கொள்வதைச் சொற்றொடர் தெரிவிக்கிறது.
  alternative: ‘ஆண்டவர்’ என்பது பொதுவாகக் கடவுளைக் குறிக்கிறது என்று வாசிக்கலாம்.
  rationale: அப்போஸ்தலர் பணிகளில் நற்செய்திச் சுருக்கங்களின் சூழலில் κύριος பலமுறை இயேசுவைக் குறிக்கிறது. எனினும் மூலத்தின் பட்டத்தை மட்டும் முதன்மை உரையில் வைத்து, ‘இயேசு’ என்று விளக்கமாகச் சேர்க்கவில்லை.
- issue: προσετίθεντο என்பதன் வினைக்குரலும் காலநோக்கும்
  choice: 'தொடர்ச்சியான செயப்பாட்டு பொருள்: மக்கள் சேர்க்கப்பட்டு வந்தார்கள்.'
  alternative: நடுநிலை அல்லது தன்வினை நுட்பத்தில் மக்கள் தாமே சேர்ந்துகொண்டார்கள்.
  rationale: செயப்பாட்டு வடிவம் சேர்த்தவர் கடவுள் என மறைமுகமாக உணர்த்தக்கூடும்; ஆனால் மூலத்தில் எழுவாயாகக் கூறப்படாத கடவுளை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல் அந்த நுட்பம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சேர்க்கப்பட்டு வந்தார்கள்’ என்பது சற்றே முறையானதாக இருந்தாலும், மூலத்தின் தொடர்ச்சியான செயப்பாட்டு வடிவத்தையும் இறையியல் தெளிவின்மையையும் பாதுகாக்கிறது; மாற்று தன்வினை வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
