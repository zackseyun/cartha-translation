  rationale: நம்பிக்கை செலுத்தப்படும் நபரைத் தமிழில் இயல்பாகக் குறிக்கிறது; மூலத்தின் dative உறவை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: மரியாதையையும் கிறிஸ்துவியல் முக்கியத்துவத்தையும் காக்கும் நிலையான தமிழ் வேதாகமச் சொல்; மூலத்தில் இல்லாதபடி ‘இயேசு’ என்று விரிவாக்கவில்லை.
- source_word: πλήθη
  choice: பெருந்திரளானோர்
  rationale: மிகப் பெரிய எண்ணிக்கையிலான மக்களைக் குறிக்கும் பன்மை வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: ஆண்களும் பெண்களுமாக
