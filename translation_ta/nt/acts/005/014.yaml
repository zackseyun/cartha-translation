- source_word: πιστεύοντες
  choice: நம்பிக்கை கொண்டவர்கள்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையை, ஆண்டவரை நம்புகிறவர்களைக் குறிக்கும் இயல்பான தமிழில் தருகிறது.
- source_word: τῷ κυρίῳ
