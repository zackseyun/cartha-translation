translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான உரைநடை. ‘மக்களுக்குப் பயந்தார்கள்’ என்பது தமிழ் வழக்கில் ‘மக்களால் தங்களுக்கு ஆபத்து ஏற்படும் என அஞ்சினர்’ என்ற பொருளைத் தருகிறது; இறுதிப் பகுதி அந்த அச்சத்தைத் தெளிவுபடுத்துகிறது.
