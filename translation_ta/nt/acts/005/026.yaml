id: ACT.5.26
reference: Acts 5:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἀπελθὼν ὁ στρατηγὸς σὺν τοῖς ὑπηρέταις ⸀ἤγαγεν αὐτούς, οὐ μετὰ βίας, ἐφοβοῦντο γὰρ τὸν λαόν, ⸀μὴ λιθασθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: ta
  text: அப்போது ஆலயக் காவல் தலைவர்[a] காவலர்களுடன் சென்று, அவர்களை வலுக்கட்டாயமின்றி அழைத்து வந்தார்; ஏனெனில் தாங்கள் கல்லெறியப்படலாம் என்று அவர்கள் மக்களுக்குப் பயந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு விதமாக, “ஆலயக் காவல் அதிகாரி.” கிரேக்கச் சொல் இங்கு ஆலய ஒழுங்கைக் கண்காணித்த அதிகாரியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: ஆலயக் காவல் தலைவர்
  rationale: இங்கு ரோமப் படைத்தளபதி அல்ல, ஆலய ஒழுங்கைக் கண்காணித்த அதிகாரி குறிக்கப்படுகிறார். சூழலை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ὑπηρέταις
  choice: காவலர்கள்
  rationale: ஆலயக் காவல் தலைவருடன் சென்ற கீழ்நிலை அதிகாரிகளை இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: ἤγαγεν αὐτούς
  choice: அவர்களை ... அழைத்து வந்தார்
  rationale: ἄγω என்பதன் ‘அழைத்துச் செல்/அழைத்து வா’ என்ற பொதுவான பொருளைத் தருகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத இலக்கிடத்தைச் சேர்க்கவில்லை.
- source_word: οὐ μετὰ βίας
  choice: வலுக்கட்டாயமின்றி
  rationale: பலத்தையோ வன்முறையையோ பயன்படுத்தாமல் அழைத்து வந்த முறையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐφοβοῦντο ... τὸν λαόν
  choice: அவர்கள் மக்களுக்குப் பயந்தார்கள்
  rationale: தொடர்ந்து நிலவிய சூழ்நிலைப் பயத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: μὴ λιθασθῶσιν
  choice: தாங்கள் கல்லெறியப்படலாம் என்று
  rationale: பயந்த விளைவைத் தெரிவிக்கும் μή + subjunctive அமைப்பையும், செய்பவரை வெளிப்படையாகக் குறிப்பிடாத செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: τότε ἀπελθὼν
  choice: அப்போது ... சென்று
  rationale: முதன்மை வினையுடன் தொடரும் நிகழ்வாகப் பங்கேற்பு வினையை இயல்பான தமிழ் கதைநடையில் வழங்குகிறது.
