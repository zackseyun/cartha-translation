  source_fidelity: 'மூலக் கிரேக்கத்தின் நிகழ்வுவரிசையும் முக்கியக் கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: στρατηγός ஆலயக் காவல் தலைவராகவும், ὑπηρέται காவலர்களாகவும், οὐ μετὰ βίας ‘வலுக்கட்டாயமின்றி’ என்றும், மக்கள் கல்லெறிவார்களோ என்ற அச்சத்தின் விளைவாகவும் சரியாக வெளிப்படுகின்றன. ‘தாங்கள் கல்லெறியப்படலாம்’ என்பது மூலத்தின் செயப்பாட்டு அமைப்பையும் குறிப்பிடப்படாத செய்பவரையும் பாதுகாக்கிறது.'
