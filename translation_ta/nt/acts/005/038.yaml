base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: ta
  text: 'இப்போது நான் உங்களுக்குச் சொல்கிறேன்: இந்த மனிதர்களை விட்டு விலகுங்கள்; அவர்களை விட்டுவிடுங்கள். ஏனெனில், இந்தத் திட்டமோ இந்தச் செயலோ மனிதர்களிடமிருந்து வந்தது என்றால்[a], அது ஒழிந்துபோகும்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனித மூலமுடையது என்றால்’ அல்லது ‘மனிதர்களால் உண்டானது என்றால்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அழிக்கப்படும்’ அல்லது ‘ஒன்றுமில்லாமல் போகும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: இப்போது
  rationale: கமாலியேல் தற்போதைய சூழலில் வழங்கும் ஆலோசனையை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἀπόστητε
  choice: விலகி
  rationale: இந்த மனிதர்களுக்கு எதிரான நடவடிக்கையிலிருந்து பிரிந்து நிற்க வேண்டும் என்ற கட்டளையின் நடைமுறைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἄφετε αὐτούς
  choice: இவர்களை விட்டுவிடுங்கள்
  rationale: அவர்களிடம் மேலும் தலையிடாமலும் அவர்களுக்கு எதிராக நடவடிக்கை எடுக்காமலும் இருக்க வேண்டும் என்ற சூழல்சார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: மனிதர்களிடமிருந்து வந்தது என்றால்
  rationale: அடுத்த வசனத்தில் வரும் கடவுளிடமிருந்து என்ற மூலாதார வேறுபாட்டைப் பாதுகாக்கிறது; ἀνθρώπων என்பதன் பொதுவான மனிதக் குறிப்பு தமிழில் தெளிவாகிறது.
- source_word: βουλή
  choice: திட்டம்
  rationale: நோக்கம், ஆலோசனை, திட்டம் என்ற பொருள் வரம்பில், இச்சூழலுக்கு எளிமையும் இயல்பும் கொண்ட சொல்.
- source_word: ἔργον
  choice: செயல்
  rationale: ஒரு பணி அல்லது முயற்சி என்ற பரந்த பொருளைத் தருகிறது; ‘திட்டம்’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: καταλυθήσεται
  choice: ஒழிந்துபோகும்
  rationale: ஒரு மனித முயற்சி நிலைக்காமல் சிதைந்து ஒன்றுமில்லாமல் போகும் விளைவை இயல்பான தமிழில் தருகிறது; கிரேக்கப் பதத்தின் அழிவு அல்லது கலைவு சார்ந்த பொருள் வரம்பையும் காக்கிறது.
theological_decisions:
- issue: ἐξ ἀνθρώπων என்பதில் முயற்சியின் மூலாதாரம்
  choice: மனிதர்களிடமிருந்து வந்தது
  alternative: மனிதத் தோற்றமுடையது
  rationale: இது மனித மூலாதாரத்தையும் அடுத்த வசனத்தின் தெய்வீக மூலாதாரத்தையும் எதிரெதிராக நிறுத்துகிறது. ‘மனிதர்களிடமிருந்து’ என்பது அந்த உறவை வெளிப்படையாகக் காக்கிறது; இதை ஆண் பாலினத்தாருக்கு மட்டும் வரையறுக்கவில்லை.
- issue: καταλυθήσεται என்பதன் அழிவு அல்லது கலைவு நுணுக்கம்
  choice: ஒழிந்துபோகும்
  alternative: அழிக்கப்படும்
  rationale: மனித மூலமுள்ள முயற்சி நிலைக்காது என்ற கூற்றை இயல்பாகக் காட்டுகிறது; அதை யார் அழிப்பார் என்பதை உரையில் இல்லாதவாறு தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையின் கட்டளைத் தொனியும், ‘திட்டம்—செயல்’ என்ற வேறுபாடும், மனித மூலாதாரம் குறித்த நிபந்தனையும் பாதுகாக்கப்பட்டுள்ளன.
