id: ACT.5.42
reference: Acts 5:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: ta
  text: அவர்கள் நாள்தோறும் ஆலயத்திலும் வீடுவீடாகவும் கற்பிப்பதையும், இயேசுவே மெசியா என்ற நற்செய்தியை அறிவிப்பதையும்[a] நிறுத்தவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “மெசியாவாகிய இயேசுவைப் பற்றிய நற்செய்தியை அறிவித்தார்கள்” அல்லது “இயேசுவை மெசியா என்று அறிவித்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: τὸν χριστὸν Ἰησοῦν என்ற கிரேக்கச் சொற்றொடரின் செயப்படுபொருள் மற்றும் அறிவிப்பின் உள்ளடக்கம் சார்ந்த மொழிபெயர்ப்பு வாய்ப்புகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் தொடர்ந்து நடந்த வழக்கமான செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν ஆலயத்தின் பரந்த வளாகத்தைக் குறிக்கலாம்; சூழலில் ‘ஆலயம்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: κατ’ οἶκον
  choice: வீடுவீடாக
  rationale: κατά என்பதன் பகிர்வுப்பொருளை வெளிப்படுத்தி, தனியார் வீடுகள் பலவற்றில் நடந்த செயலைக் குறிக்கிறது.
- source_word: οὐκ ἐπαύοντο
  choice: நிறுத்தவில்லை
  rationale: இறந்தகால imperfect வடிவின் தொடர்ச்சியான செயற்பொருளை தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: διδάσκοντες
  choice: கற்பிப்பதையும்
  rationale: அப்போஸ்தலர்களின் தொடர்ந்த போதனைச் செயலை நேரடியாகக் குறிக்கிறது.
- source_word: εὐαγγελιζόμενοι
  choice: நற்செய்தியை அறிவிப்பதையும்
  rationale: நல்ல செய்தியைப் பகிரங்கமாக அறிவித்தல் என்ற வினையின் பொருளை எளிதில் புரியும் தமிழில் தருகிறது.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: இயேசுவே மெசியா என்ற
  rationale: Χριστός என்பதை பெயராக ஒலிபெயர்க்காமல் அதன் பட்டப்பெயர்ப் பொருளான ‘மெசியா’ என்று தருகிறது; இங்கு அறிவிக்கப்பட்ட செய்தியின் உள்ளடக்கமாக இயேசுவின் மெசியா அடையாளத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழியாக்கம்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் Χριστός ஒரு பெயரைப்போல் அல்லாமல் இயேசுவின் பட்டத்தையும் அடையாளத்தையும் குறிக்கிறது; ஆகவே அதன் பொருளைத் தெரிவிக்கும் ‘மெசியா’ பயன்படுத்தப்பட்டது.
- issue: εὐαγγελιζόμενοι என்பதற்குப் பின் வரும் τὸν χριστὸν Ἰησοῦν என்பதன் தொடரியல் உறவு
  choice: 'அறிவிப்பின் உள்ளடக்கம்: ‘இயேசுவே மெசியா’'
  alternative: ‘மெசியாவாகிய இயேசுவை’ என்ற நேரடி செயப்படுபொருள் தொடர்
  rationale: கிரேக்கச் சொற்றொடர் செயப்படுபொருளாகவும் அறிவிப்பின் உள்ளடக்கமாகவும் புரிந்துகொள்ளப்படக்கூடிய சுருக்கத்தைக் கொண்டுள்ளது. முதன்மை உரை இயல்பான தமிழில் உள்ளடக்கத்தைத் தெளிவாக்குகிறது; மாற்று அமைப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான நடையுடன் மூலத்தின் தொடர்ச்சியான செயற்பொருளும் கிறிஸ்தியல் பட்டத்தின் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
