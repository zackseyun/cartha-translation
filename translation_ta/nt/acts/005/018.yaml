source:
  edition: SBLGNT
  text: καὶ ἐπέβαλον τὰς ⸀χεῖρας ἐπὶ τοὺς ἀποστόλους καὶ ἔθεντο αὐτοὺς ἐν τηρήσει δημοσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/018.yaml
  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: ta
  text: அவர்கள் அப்போஸ்தலர்களைப் பிடித்து, பொதுக் காவலில் வைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொதுச் சிறையில் அடைத்தார்கள்.” கிரேக்கச் சொற்றொடர் ஒரு சிறைக் கட்டடத்தை மட்டும் குறிக்காமல், பொதுவாகக் காவலில் வைக்கப்படுவதையோ அடைத்து வைக்கப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: பிடித்து
  rationale: இந்தச் சொற்றொடர் சொல்லுக்குச் சொல் ‘கைகளை அவர்கள்மேல் போட்டார்கள்’ என்றாலும், இச்சூழலில் பகைமையுடன் கைது செய்ததைக் குறிக்கிறது. ‘பிடித்து’ என்பது அந்தச் செயலை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: ἀποστόλους
  choice: அப்போஸ்தலர்களை
  rationale: அப்போஸ்தலர் பணிகளில் இது பொதுவான ‘தூதர்கள்’ என்பதைவிட, இயேசுவால் அனுப்பப்பட்டவர்களுக்கான நிலைபெற்ற அடையாளப் பெயராக வருகிறது.
- source_word: ἔθεντο
  choice: வைத்தார்கள்
  rationale: τίθημι என்பதன் எளிய பொருளைத் தருவதோடு, ‘காவலில் வைத்தார்கள்’ என்பது தமிழில் இயல்பான சொல்லிணைவு.
- source_word: ἐν τηρήσει
  choice: காவலில்
  rationale: τήρησις என்பது காவல், தடுப்புவைப்பு அல்லது அடைத்துவைத்த நிலை/இடத்தைக் குறிக்கலாம். குறிப்பிட்ட சிறைக் கட்டடம் என்று தேவையின்றி வரையறுக்காமல் ‘காவலில்’ அந்தப் பொருள் விரிவைப் பாதுகாக்கிறது.
- source_word: δημοσίᾳ
  choice: பொதுக்
  rationale: இது τηρήσει என்பதை விவரித்து, தனிப்பட்ட காவலுக்கு மாறாகப் பொது அல்லது அதிகாரப்பூர்வக் காவலைக் குறிக்கிறது. ‘பொதுக் காவல்’ மூலத்தின் அமைப்பையும் தெளிவின்மையையும் அளவோடு காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கைகளைப் போட்டார்கள்’ என்ற சொல்லுக்குச் சொல் வடிவம் தமிழில் வேறு பொருள் தரக்கூடும் என்பதால், சூழலுக்கேற்ற ‘பிடித்து’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
