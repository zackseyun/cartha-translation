  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அவையுரை. மூலத்தின் எச்சரிக்கைத் தொனியும், வரவிருக்கும் செயலைக் குறிக்கும் நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
