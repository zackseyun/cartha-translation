source:
  edition: SBLGNT
  text: εἶπέν τε πρὸς αὐτούς· Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “இஸ்ரயேல் ஆண்களே, இந்த மனிதர்களுக்கு நீங்கள் என்ன செய்யப்போகிறீர்கள் என்பதில் எச்சரிக்கையாக இருங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த மனிதர்களைக் குறித்து நீங்கள் என்ன செய்யப்போகிறீர்கள் என்பதில் உங்களைக் கவனமாகக் காத்துக்கொள்ளுங்கள்.”
    reason: προσέχετε ἑαυτοῖς என்பதிலுள்ள தற்சுட்டு எச்சரிக்கையையும், ἐπὶ τοῖς ἀνθρώποις τούτοις என்பதிலுள்ள ‘இந்த மனிதர்களைக் குறித்து’ என்ற அமைப்பையும் மேலும் சொற்சார்பாகக் காட்டும் மாற்று.
lexical_decisions:
- source_word: εἶπέν τε
  choice: அவர் ... என்றார்
  rationale: τέ முந்தைய நிகழ்வோடு மென்மையான தொடுப்பை ஏற்படுத்துகிறது. தமிழின் இயல்பான உரையாடல் அமைப்பில் வாக்கிய இறுதியிலுள்ள ‘என்றார்’ அந்த எளிய கதைத்தொடர்பைப் போதுமான அளவில் தருகிறது; மிகத் தெளிவான காலவரிசையையோ காரணவிளைவையோ சேர்க்கவில்லை.
- source_word: πρὸς αὐτούς
  choice: அவர் அவர்களிடம்
  rationale: λέγω என்பதோடு வரும் πρός + வேற்றுமை உரையின் முகவர்களைக் குறிக்கிறது; ‘அவர்களிடம்’ என்பது இயல்பான தமிழ்.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: இஸ்ரயேல் மக்களே
  rationale: இது இஸ்ரயேலரை நேரடியாக அழைக்கும் மரியாதையான விளிவடிவம். கிரேக்க ἄνδρες ஆண்களைக் குறிப்பிட்டாலும், நவீனத் தமிழில் ‘இஸ்ரயேல் மக்களே’ அந்தக் குழுவினரை இயல்பாகவும் கண்ணியமாகவும் அழைக்கிறது; சூழலில் அவையினர் ஆண்கள் என்பது மறுக்கப்படவில்லை.
- source_word: προσέχετε ἑαυτοῖς
  choice: உங்களைக் கவனித்துக்கொள்ளுங்கள்
  rationale: கட்டளை வினையும் தற்சுட்டுப் பெயர்ச்சொல்லும் சேர்ந்து, தாங்கள் எடுக்கவிருக்கும் நடவடிக்கையில் எச்சரிக்கையுடன் இருக்குமாறு வலியுறுத்துகின்றன. இந்த மொழிபெயர்ப்பு தற்சுட்டு நுணுக்கத்தைக் காக்கிறது.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: இந்த மனிதர்களுக்கு ... என்பதைக் குறித்து
  rationale: ἐπί + dative இங்கு எச்சரிக்கைக்குரிய விவகாரத்தைச் சுட்டுகிறது. ‘இந்த மனிதர்களுக்கு’ நடவடிக்கையின் இலக்கை இயல்பாகக் காட்டுகிறது; ‘எதிராக’ என்று மொழிபெயர்த்து கிரேக்கத்தில் வெளிப்படையாக இல்லாத பகைமைத் தீவிரத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: τί μέλλετε πράσσειν
  choice: நீங்கள் என்ன செய்யப்போகிறீர்கள்
  rationale: μέλλω + infinitive வரவிருக்கும் அல்லது உத்தேசித்த செயலைக் குறிக்கிறது. ‘செய்யப்போகிறீர்கள்’ இரு நுணுக்கங்களையும் இயல்பான நவீனத் தமிழில் தாங்குகிறது.
