  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: ta
  text: இவற்றைச் சொல்லியும், மக்கள் தங்களுக்குப் பலியிடுவதை அவர்கள் மிகுந்த சிரமத்துடன்தான் தடுத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: இவற்றைச் சொல்லியும்
  rationale: καί இங்கு எதிர்பார்ப்புக்கு மாறான விளைவை வலியுறுத்துகிறது; concessive தமிழாக்கமான ‘சொல்லியும்’ இயல்பாக அந்த நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: μόλις κατέπαυσαν
  choice: மிகுந்த சிரமத்துடன்தான் தடுத்தார்கள்
  rationale: μόλις என்பதன் ‘அரிதாக/மிகுந்த சிரமத்துடன்’ என்ற பொருளையும், κατέπαυσαν என்பதன் செயலை நிறுத்தச் செய்தார்கள் என்ற பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: τοὺς ὄχλους
  choice: மக்கள் கூட்டத்தை
  rationale: பன்மை வடிவம் திரண்டிருந்த மக்களைக் கூட்டாகக் குறிக்கிறது; தமிழில் இயல்பான கூட்டு ஒருமையாக வழங்கப்பட்டுள்ளது.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: தங்களுக்குப் பலியிடாதபடி
  rationale: பலியிடும் செயலைத் தடுத்தார்கள் என்ற விளைவுப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; αὐτοῖς பவுலையும் பர்னபாவையும் குறிக்கும் வகையில் ‘தங்களுக்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: அப்போஸ்தலர்களுக்குப் பலியிட முயன்ற கூட்டத்தின் செயல்
  choice: தங்களுக்குப் பலியிடாதபடி
  alternative: அவர்களுக்குப் பலியிடுவதை நிறுத்தும்படி
  rationale: மூலத்தின் நோக்க/விளைவு அமைப்பை இயல்பான தமிழில் காக்கிறது; அப்போஸ்தலர்கள் பலியை ஏற்றுக்கொண்டதாக எந்தத் தவறான எண்ணத்தையும் உருவாக்காது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது.
