  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: ta
  text: இந்த மனிதன் பவுல் பேசுவதைக் கேட்டான். பவுல் அவனை உற்றுநோக்கி, குணமடைவதற்கான விசுவாசம் அவனுக்கு இருப்பதைக் கண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் விரிவாக, “மீட்கப்படுவதற்கான விசுவாசம்.” இங்குள்ள கிரேக்க வினைச்சொல் “மீட்கப்படுதல்” அல்லது “குணமடைதல்” என்று பொருள்படலாம்; இச்சூழல் உடல் குணமடைதலைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: அந்த மனிதன்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கால்கள் செயலிழந்த மனிதனைச் சுட்டுகிறது; தமிழில் குறிப்பிட்ட நபரை இயல்பாகத் தொடர்கிறது.
- source_word: ἤκουσεν
  choice: கேட்டுக்கொண்டிருந்தான்
  rationale: பவுலின் தொடர்ந்த பேச்சை அவன் செவிகொடுத்துக் கேட்ட நிகழ்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῦ Παύλου λαλοῦντος
  choice: பவுல் பேசுவதைக்
  rationale: பவுல் பேசிக்கொண்டிருந்தபோது அந்த மனிதன் கேட்டான் என்ற பங்கேற்புச் சொற்றொடரின் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: ἀτενίσας αὐτῷ
  choice: அவனை உற்றுப் பார்த்து
  rationale: கவனத்தை ஒருமுகப்படுத்தி நோக்கியதைக் குறிக்கும் வினையின் வலிமையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἰδὼν
  choice: கண்டார்
  rationale: அடிப்படையான பார்வை/உணர்தல் மொழியைப் பாதுகாக்கிறது; இச்சூழலில் உள்ளார்ந்த நம்பிக்கையைப் பகுத்துணர்ந்த பொருளையும் ஏற்கிறது.
- source_word: ἔχει πίστιν
  choice: விசுவாசம் அவனுக்கு இருப்பதை
  rationale: πίστις இங்கு கடவுளின் உதவியை நம்பி ஏற்கும் பதிலைக் குறிக்கிறது; தனிப்பட்ட உண்மைத்தன்மையை அல்ல.
- source_word: τοῦ σωθῆναι
  choice: குணமடைவதற்கான
  rationale: அடுத்த வசனத்தில் நிகழும் உடல் நலமடைதலே உடனடிச் சூழல்; அதேவேளை σωθῆναι என்பதன் விரிவான ‘மீட்கப்படுதல்’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: குணமாக்கும் நிகழ்வில் σωθῆναι என்பதன் பொருள்
  choice: குணமடைவதற்கான
  alternative: மீட்கப்படுவதற்கான
  rationale: உடனடிச் சூழல் பிறவியிலிருந்தே நடக்க இயலாத மனிதனின் உடல் குணமடைதலைக் குறிக்கிறது. இருப்பினும் கிரேக்க வினையின் மீட்பு சார்ந்த விரிவான பொருளை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: πίστις என்பதன் தன்மை
  choice: விசுவாசம்
  alternative: நம்பிக்கை
  rationale: இங்கு நம்பிக்கையுடன் ஏற்றுக்கொள்ளும் பதில் கருத்தாக உள்ளது; வழக்கமான வேதாகமத் தமிழில் ‘விசுவாசம்’ அந்த இறையியல் ஒலிப்பையும் கிரேக்கச் சொல்லின் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத் தொடரின் நீண்ட சார்புவாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டு, பவுல்தான் உற்றுப் பார்த்தவர் என்பது தெளிவாக்கப்பட்டுள்ளது; மூலத்தின் பொருள் அல்லது இறையியல் பதற்றம் நீக்கப்படவில்லை.
