revisions:
- from: அந்த மனிதன் பவுல் பேசுவதைக் கேட்டுக்கொண்டிருந்தான். பவுல் அவனை உற்றுப் பார்த்து, குணமடைவதற்கான விசுவாசம் அவனுக்கு இருப்பதைக் கண்டார்.[a]
  to: இந்த மனிதன் பவுல் பேசுவதைக் கேட்டான். பவுல் அவனை உற்றுநோக்கி, குணமடைவதற்கான விசுவாசம் அவனுக்கு இருப்பதைக் கண்டார்.[a]
  rationale: The revision retains the contextual rendering “குணமடைவதற்கான” and its broader lexical alternative, while more closely representing the aorist hearing verb, directly rendering the demonstrative, and correcting the grammatical voice in the footnote.
