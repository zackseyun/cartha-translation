id: ACT.14.3
reference: Acts 14:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: ta
  text: ஆகவே, அவர்கள் அங்கே கணிசமான காலம் தங்கி, ஆண்டவரைச் சார்ந்து துணிவுடன் பேசினார்கள்.[a] ஆண்டவர் தமது அருளின் செய்திக்குச் சாட்சி அளித்து, அவர்களுடைய கைகளின் வழியாக அடையாளங்களும் அற்புதங்களும் நிகழும்படி அருளினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரில் துணிவுடன் பேசினார்கள்.” கிரேக்கச் சொற்றொடர், அவர்களுடைய துணிவு ஆண்டவரில் வேரூன்றியிருந்ததையோ ஆண்டவரோடு கொண்ட உறவில் வெளிப்பட்டதையோ வலியுறுத்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: கணிசமான காலம்
  rationale: இந்தச் சொற்றொடர் குறிப்பிடத்தக்க அளவு நீண்ட காலத்தைக் குறிக்கிறது; காலத்தின் அளவை மிகைப்படுத்தாமல் அதன் நீட்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: διέτριψαν
  choice: அங்கே ... தங்கி
  rationale: ஒரு இடத்தில் காலம் செலவிட்டு நிலைத்திருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: παρρησιαζόμενοι
  choice: துணிவுடன் பேசினார்கள்
  rationale: அச்சமின்றி வெளிப்படையாகப் பேசும் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: ஆண்டவரைச் சார்ந்து
  rationale: அவர்களுடைய துணிவான பேச்சு ஆண்டவரை அடிப்படையாகக் கொண்டது அல்லது அவர்மீது சார்ந்தது என்ற பொருளைத் தருகிறது; கிரேக்கத் தொடரின் வேறு சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவர்
  rationale: κύριος என்ற பட்டத்தை அதன் குறிப்பிட்ட நபரை உரையில் இல்லாத அளவுக்கு விரிவுபடுத்தாமல் வழக்கமான தமிழில் தருகிறது.
- source_word: τῷ μαρτυροῦντι
  choice: சாட்சி அளித்து
  rationale: ஆண்டவர் அவர்களுடைய செய்தியைத் தொடர்ந்து உறுதிப்படுத்திய சான்றளிக்கும் செயலை வெளிப்படுத்துகிறது.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: தமது அருளின் செய்திக்கு
  rationale: λόγος என்பதன் சூழல்சார் பொருளான ‘செய்தி’யைத் தெளிவாகத் தருவதோடு, ‘அருளின்’ என்ற தொடர்பையும் பாதுகாக்கிறது.
- source_word: χάριτος
  choice: அருள்
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகளில் காணப்படும் இறையியல் நிறையுடைய χάρις என்பதற்கான இயல்பான தமிழ் சொல்.
- source_word: διδόντι
  choice: அருளினார்
  rationale: அடையாளங்களும் அற்புதங்களும் நிகழ்வதற்கான ஆற்றலையும் வாய்ப்பையும் ஆண்டவர் வழங்கினார் என்பதைச் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: σημεῖα καὶ τέρατα
  choice: அடையாளங்களும் அற்புதங்களும்
  rationale: சான்றளிக்கும் தன்மையையும் வியப்பூட்டும் தன்மையையும் கொண்ட நிலையான வேதாகமச் சொல் இணைப்பைப் பாதுகாக்கிறது.
- source_word: γίνεσθαι
  choice: நிகழும்படி
  rationale: அந்தச் செயல்கள் அப்போஸ்தலர்களை கருவிகளாகக் கொண்டு நிகழ்ந்தன என்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: அவர்களுடைய கைகளின் வழியாக
  rationale: அவர்கள் கருவிகளாகப் பயன்படுத்தப்பட்டனர் என்ற பொருளையும் மூலத்தின் உருவகமான உடல் உறுப்புக் குறிப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பவரின் குறிப்பு
  choice: கிரேக்கத்தில் உள்ளபடியே ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘ஆண்டவராகிய இயேசு’ என்று வெளிப்படையாகக் குறிப்பிடுதல் அல்லது பொதுவாக ‘கடவுள்’ என்று விளக்குதல்
  rationale: மூல உரையில் τῷ κυρίῳ என்று மட்டுமே உள்ளது. சூழலில் உயிர்த்தெழுந்த இயேசுவைக் குறிக்கும் வாய்ப்பு வலுவாக இருந்தாலும், பெயரைச் சேர்ப்பது மூலத்தைவிட அதிகத் திட்டவட்டத்தைக் கொண்டுவரும்.
- issue: ἐπὶ τῷ κυρίῳ என்பதன் பொருள் வலிமை
  choice: ‘ஆண்டவரைச் சார்ந்து’
  alternative: ‘ஆண்டவரில்’ அல்லது ‘ஆண்டவருக்காக’
  rationale: ἐπί + வேற்றுமை வடிவம் இங்கு அடிப்படை, சார்பு அல்லது உறவுக் களம் ஆகியவற்றைக் குறிக்கக்கூடும். முதன்மை உரை சார்பைத் தெரிவிக்கிறது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அருளின் செய்தி’, ‘அடையாளங்களும் அற்புதங்களும்’, ‘கைகளின் வழியாக’ ஆகியவை மூலத்தின் முக்கிய உருவகங்களையும் இறையியல் நிறையையும் இயல்பான தமிழில் பாதுகாக்கின்றன.
