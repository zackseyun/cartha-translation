  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: ta
  text: அவர்கள் அந்த நகரத்தில் நற்செய்தியை அறிவித்து, பலரைச் சீடர்களாக்கிய பின்பு, லிஸ்திராவுக்கும் இக்கோனியாவுக்கும் அந்தியோகியாவுக்கும் திரும்பிச் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: நற்செய்தியை அறிவித்து
  rationale: εὐαγγελίζω என்பதன் நற்செய்தியைப் பிரசித்தப்படுத்தும் பொருளை, சமய வழக்குச் சொல்லாக மட்டுப்படுத்தாமல் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இறந்தகாலப் பங்கேற்புச் சொல்லின் செயல் முதன்மை வினைக்கு முன் நிகழ்ந்ததை ‘...பின்பு’ என்ற அமைப்பு தெளிவாக்குகிறது.
- source_word: τε
  choice: (தொடரமைப்பில் உட்பொருளாக்கப்பட்டது)
  rationale: τε மென்மையான இணைப்புச் சொல். தமிழில் தனியாக ‘மேலும்’ என்று சேர்ப்பது கனமாக இருப்பதால், வாக்கியத் தொடரமைப்பிலேயே அதன் இணைப்புப் பணி வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τὴν πόλιν ἐκείνην
  choice: அந்த நகரத்தில்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட தெர்பையைச் சுட்டும் நேரடியான இயல்பான மொழிபெயர்ப்பு.
- source_word: μαθητεύσαντες
  choice: சீடர்களாக்கிய
  rationale: ஒருவரைச் சீடராக ஆக்குதல் என்ற செயற்பாட்டு, காரணவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἱκανοὺς
  choice: பலரை
  rationale: இச்சூழலில் ἱκανός கணிசமான எண்ணிக்கையைக் குறிக்கிறது; ‘பலரை’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: ὑπέστρεψαν
  choice: திரும்பிச் சென்றார்கள்
  rationale: பயணத்தின் திசையை மாற்றி முன்பு சென்ற இடங்களுக்குத் திரும்பியதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: εἰς τὴν Λύστραν
  choice: லிஸ்திராவுக்கும்
  rationale: இலக்கிடத்தைக் குறிக்கும் εἰς என்பதையும் பட்டியலின் தொடர்ச்சியையும் ‘-க்கு’ வேற்றுமையுருபு வெளிப்படுத்துகிறது.
- source_word: εἰς Ἰκόνιον
  choice: இக்கோனியாவுக்கும்
  rationale: மீண்டும் வரும் εἰς என்பதற்கேற்ப இலக்கிட வேற்றுமையுருபு மீண்டும் வைக்கப்பட்டு பயண வரிசை பாதுகாக்கப்பட்டுள்ளது.
- source_word: εἰς Ἀντιόχειαν
  choice: அந்தியோகியாவுக்கும்
  rationale: இறுதி இலக்கிடத்திலும் εἰς என்பதன் திசைப்பொருளும் கிரேக்கப் பட்டியலின் ஒத்திசைவும் பாதுகாக்கப்பட்டுள்ளன.
