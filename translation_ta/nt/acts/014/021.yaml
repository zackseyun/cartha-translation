translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் dignified ஆனால் எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘நற்செய்தியை அறிவித்து’ மற்றும் ‘சீடர்களாக்கிய’ என்பவை மூலத்தின் இரண்டு தனித்த செயல்களையும் தெளிவாகப் பாதுகாக்கின்றன. இடப்பெயர்களுக்கான தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும் எழுத்துப்பெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன.
