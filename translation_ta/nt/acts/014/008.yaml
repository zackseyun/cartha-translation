revisions:
- from: லிஸ்திராவில் கால்களில் வலுவற்ற ஒரு மனிதர் உட்கார்ந்திருந்தார். அவர் தன் தாயின் கருப்பையிலிருந்தே கால் ஊனமுற்றவர்; ஒருபோதும் நடந்ததே இல்லை.
  to: லிஸ்திராவில் கால்களில் வலிமையில்லாத ஒரு மனிதர் உட்கார்ந்திருந்தார். அவர் தம் தாயின் கருப்பையிலிருந்தே கால்களில் ஊனமுற்றவராக இருந்தார்; ஒருபோதும் நடந்ததில்லை.
  rationale: 'This small revision improves modern Tamil idiom and clarity while preserving the Greek narrative layering: first, lack of strength in his feet; then, lameness from his mother’s womb; and finally, that he had never walked. No footnote is needed, since the wording itself preserves the distinction represented in the English audit trail.'
  reviewer_model: gpt-5.6-terra
