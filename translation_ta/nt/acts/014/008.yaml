source:
  edition: SBLGNT
  text: Καί τις ἀνὴρ ⸂ἀδύνατος ἐν Λύστροις⸃ τοῖς ποσὶν ἐκάθητο, χωλὸς ἐκ κοιλίας μητρὸς ⸀αὐτοῦ, ὃς οὐδέποτε ⸀περιεπάτησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: ta
  text: லிஸ்திராவில் கால்களில் வலிமையில்லாத ஒரு மனிதர் உட்கார்ந்திருந்தார். அவர் தம் தாயின் கருப்பையிலிருந்தே கால்களில் ஊனமுற்றவராக இருந்தார்; ஒருபோதும் நடந்ததில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καί
  choice: (தனி இணைப்புச்சொல் விடப்பட்டது)
  rationale: தமிழில் புதிய நிகழ்வை இயல்பாகத் தொடங்க தனியான ‘மேலும்’ தேவையில்லை; தொடர்ச்சியைச் சொல் வரிசை உணர்த்துகிறது.
- source_word: τις ἀνὴρ
  choice: ஒரு மனிதர்
  rationale: பெயர் குறிப்பிடப்படாத குறிப்பிட்ட ஒருவரை இயல்பான நவீன தமிழில் குறிக்கிறது; ‘ஒரு குறிப்பிட்ட மனிதர்’ என்பது இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: ἐν Λύστροις
  choice: லிஸ்திராவில்
  rationale: இடப்பெயரைத் தமிழில் ஒலிபெயர்த்து, இடவேற்றுமை உருபுடன் வழங்குகிறது.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: கால்களில் வலுவற்ற
  rationale: ἀδύνατος என்பதன் வலிமையின்மை என்ற பொருளைப் பாதுகாத்து, அடுத்து வரும் χωλός என்பதோடு ஒன்றாக்காமல் வைத்திருக்கிறது.
- source_word: ἐκάθητο
  choice: உட்கார்ந்திருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ந்த நிலை மற்றும் காட்சியமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: χωλός
  choice: கால் ஊனமுற்றவர்
  rationale: நடக்க இயலாத உடல்நிலையைத் தெளிவாகவும் மரியாதையாகவும் குறிக்கிறது; முந்தைய ‘வலுவற்ற’ என்ற அடுக்கிலிருந்து வேறுபடுத்துகிறது.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: தன் தாயின் கருப்பையிலிருந்தே
  rationale: பிறப்பிலிருந்தே இருந்த நிலை என்பதை விளக்கும் மூலத்தின் உயிரோட்டமான கருப்பைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: οὐδέποτε περιεπάτησεν
  choice: ஒருபோதும் நடந்ததே இல்லை
  rationale: அவரது வாழ்நாள் முழுவதும் அந்த நேரம் வரை நடக்கவில்லை என்பதை வலியுறுத்தும் இயல்பான தமிழ் வடிவம்.
