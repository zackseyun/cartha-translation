source:
  edition: SBLGNT
  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: ta
  text: நகருக்கு வெளியே இருந்த சீயுஸ் கோவிலின் பூசாரி[b], காளைகளையும் மாலைகளையும்[a] நுழைவாயில்களுக்குக் கொண்டுவந்து, மக்கள் கூட்டங்களோடு சேர்ந்து பலியிட விரும்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வளைய மாலைகளையும்.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “நகருக்கு முன்பாக இருந்த சீயுஸின் பூசாரி.” இங்கு நகருக்கு முன்புறம் அல்லது வெளியே இருந்த சீயுஸ் கோவில் குறிக்கப்படலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τε
  choice: மேலும்
  rationale: τε உடன் வரும் உறவுப்பெயர் இங்கு கதையைத் தொடரும் இணைப்பாகச் செயல்படுகிறது; தமிழில் தனியே மொழிபெயர்க்காமல் இயல்பான வாக்கியத் தொடரால் அதன் பணி வெளிப்படுகிறது.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: சீயுஸ் கோவிலின் பூசாரி
  rationale: Ζεύς என்பது கிரேக்கத் தெய்வப் பெயர் என்பதால் ரோமப் பெயரான ‘யூப்பிட்டர்’ என்பதற்குப் பதில் ‘சீயுஸ்’ பயன்படுத்தப்பட்டது. தமிழில் வழிபாட்டுச் சூழலுக்கு ‘பூசாரி’ இயல்பானது.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: நகருக்கு வெளியே இருந்த சீயுஸ் கோவில்
  rationale: சொல்லுக்கு சொல் பார்த்தால் ‘நகருக்கு முன் இருந்த சீயுஸ்’ எனும் அமைப்பு. சூழலில் நகரின் முன்புறம் அல்லது வெளியே அமைந்த அவரது கோவில் குறிக்கப்படுவது மிகச் சாத்தியம்; தமிழில் தெளிவிற்காக ‘கோவில்’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: ταύρους
  choice: காளைகள்
  rationale: ταῦρος நேரடியாகக் காளையைக் குறிக்கிறது; பலியிடும் சூழலிலும் இதுவே துல்லியமான இயல்பான சொல்.
- source_word: στέμματα
  choice: மலர் மாலைகள்
  rationale: பலிச் சடங்கு ஊர்வலங்களில் பயன்படுத்தப்பட்ட வளைய வடிவ மாலைகள் அல்லது அலங்கார மாலைகளைச் சொல் குறிக்கலாம். தமிழில் ‘மலர் மாலைகள்’ எளிதில் புரியும்; ‘வளைய மாலைகள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: நுழைவாயில்களுக்கு
  rationale: πυλών என்பது வாயில் அல்லது நுழைவாயிலைக் குறிக்கும்; மூலத்தின் பன்மை தமிழிலும் காக்கப்பட்டது. இயக்கத்தைக் காட்டும் ἐπί என்பதால் ‘நுழைவாயில்களுக்குக்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐνέγκας
  choice: கொண்டுவந்து
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முன்னணிச் செயலைக் காட்டுகிறது; தமிழில் ‘கொண்டுவந்து’ இயல்பாக அந்த உறவைத் தெரிவிக்கிறது.
- source_word: σὺν τοῖς ὄχλοις
  choice: மக்கள் கூட்டங்களோடு சேர்ந்து
  rationale: ὄχλοις பன்மையாக இருப்பதால் ‘கூட்டங்கள்’ காக்கப்பட்டது; பூசாரி மக்களுடன் இணைந்து செயல்பட்டதை ‘சேர்ந்து’ தெளிவாக்குகிறது.
- source_word: ἤθελεν θύειν
  choice: பலியிட விரும்பினான்
  rationale: θέλω + வினையெச்சம் விருப்பம் அல்லது நோக்கத்தைக் காட்டுகிறது; θύω இங்கு மதச் சடங்காகப் பலி செலுத்துவதைக் குறிக்கிறது.
theological_decisions:
- issue: τοῦ ὄντος πρὸ τῆς πόλεως என்பதன் மறைந்துள்ள குறிப்பு
  choice: நகருக்கு வெளியே இருந்த சீயுஸ் கோவில்
  alternative: நகருக்கு முன் இருந்த சீயுஸ்
  rationale: இலக்கணப்படி சொற்றொடர் நேரடியாக சீயுஸைச் சுட்டலாம்; ஆனால் பழங்காலப் பயன்பாட்டிலும் இச்சூழலிலும் நகருக்கு முன்புறம் அல்லது வெளியே இருந்த சீயுஸ் ஆலயம் குறிக்கப்படுவது அதிகச் சாத்தியம். தமிழ் வாசகருக்குத் தெளிவாக ‘கோவில்’ சேர்க்கப்பட்டாலும் மூலத்தின் நேரடி அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. ‘சீயுஸ்’ மூலம் கிரேக்கப் பெயர் காக்கப்பட்டது; ‘பூசாரி’, ‘கோவில்’, ‘பலியிட’ ஆகியவை மதச் சூழலை இயல்பாகத் தெரிவிக்கின்றன. மூலத்தில் மறைமுகமாக உள்ள கோவில் குறிப்பு உரையில் தெளிவாக்கப்பட்டு, உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டது.
