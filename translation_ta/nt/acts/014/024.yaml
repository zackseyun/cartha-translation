  text: καὶ διελθόντες τὴν Πισιδίαν ἦλθον εἰς ⸀τὴν Παμφυλίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/024.yaml
  text: And after passing through Pisidia, they came into Pamphylia.
translation:
  language: ta
  text: அவர்கள் பிசீதியா வழியாகக் கடந்து, பம்பிலியாவுக்கு வந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελθόντες
  choice: வழியாகக் கடந்து
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முந்திய பயணச் செயலைக் குறிக்கிறது. தமிழில் வினையெச்சத் தொடர் அந்த உறவை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: τὴν Πισιδίαν
  choice: பிசீதியா
  rationale: பிரதேசப் பெயர் நவீனத் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு தரப்பட்டுள்ளது; ‘வழியாக’ என்பது இங்கு ஊடாகச் சென்றதைக் காட்டுகிறது.
- source_word: ἦλθον
  choice: வந்தார்கள்
  rationale: ἔρχομαι என்பதன் எளிய கதைநடைப் பொருளைத் தருகிறது; பன்மை எழுவாயையும் மரியாதை கலந்த பொதுத் தமிழ் வினைமுற்றையும் இயல்பாகக் கொண்டுள்ளது.
- source_word: εἰς τὴν Παμφυλίαν
  choice: பம்பிலியாவுக்கு
  rationale: இலக்கை நோக்கிய நகர்வைக் குறிக்கும் εἰς என்பதற்கு ‘-க்கு’ இயல்பான தமிழாக்கம். ‘உள்ளே’ என்று சேர்ப்பது தமிழில் தேவையற்ற வலியுறுத்தலாக இருக்கும்.
- source_word: καὶ
  choice: —
  rationale: καὶ தொடர்ச்சியான கதை இணைப்பாக உள்ளது. தனி வசனமாக வாசிக்கும்போது தொடக்கத்தில் ‘மேலும்/பின்பு’ சேர்ப்பது செயற்கையாக இருப்பதால், தமிழின் இயல்பான தொடர்நடையில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதும் ஆன பயணக் கதைநடை. இடப்பெயர்கள் பொதுவான தமிழ் வேதாகம ஒலிபெயர்ப்பு வடிவங்களுக்கு அண்மையாக வைக்கப்பட்டுள்ளன.
