  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: ta
  text: ஆனால் சீடர்கள் அவரைச் சுற்றிக் கூடியபோது[a], அவர் எழுந்து நகரத்துக்குள் சென்றார்[b]. மறுநாள் அவர் பர்னபாவுடன் தெர்பைக்குப் புறப்பட்டுச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரைச் சூழ்ந்தபோது.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர் எழுந்தார்.’ கிரேக்கச் சொல்லை இவ்வாறு மொழிபெயர்க்கலாம். ஆனால் இங்கு அது உயிர்த்தெழுதலை வெளிப்படையாகக் குறிப்பிடாமல், பவுல் உடலளவில் எழுந்ததையே குறிக்க வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: சுற்றிக் கூடியபோது
  rationale: κυκλόω என்பது ஒருவரைச் சுற்றுதல் அல்லது சூழ்தல் என்பதைக் குறிக்கிறது. இச்சூழலில் சீடர்கள் பகைமையுடன் சூழ்ந்ததாகத் தோன்றாமல், பவுலைச் சுற்றிக் கூடினார்கள் என்ற இயல்பான பொருளை இந்தத் தெரிவு தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் பவுல் கல்லெறியப்பட்டு நகரத்துக்கு வெளியே இழுத்துச் செல்லப்பட்டதற்கு அடுத்ததாக நிகழும் வியப்பூட்டும் திருப்பத்தை δέ மென்மையாகக் குறிக்கிறது.
- source_word: τῶν μαθητῶν
  choice: சீடர்கள்
  rationale: அப்போஸ்தலர் நூலில் μαθητής என்பதற்கான நிலையான, இயல்பான தமிழ் இணைச்சொல் இது.
- source_word: ἀναστὰς
  choice: எழுந்து நின்று
  rationale: இங்கு ἀνίστημι பவுலின் உடல்சார்ந்த செயலைக் குறிக்கிறது. உயிர்த்தெழுதல் என்று வெளிப்படையாகக் கூறாமல், அவர் தரையிலிருந்து எழுந்தார் என்பதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: நகரத்துக்குள் சென்றார்
  rationale: εἰς உடன் வரும் εἰσέρχομαι குறிக்கும் உள்ளே செல்லும் இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῇ ἐπαύριον
  choice: மறுநாள்
  rationale: அடுத்த நாளைக் குறிக்கும் காலச் சொற்றொடருக்கான சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: ἐξῆλθεν
  choice: புறப்பட்டுச் சென்றார்
  rationale: ἐξέρχομαι என்பதன் வெளியே சென்று ஒரு இடத்தை நோக்கிப் புறப்படும் இயக்கத்தை, தொடர்ந்து வரும் இலக்குடன் இயல்பாக இணைக்கிறது.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: பர்னபாவுடன்
  rationale: σύν உடன்செல்லுதலைக் குறிக்கிறது; இந்த வடிவம் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: Δέρβην
  choice: தெர்பை
  rationale: இடப்பெயரின் மரபான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ἀναστὰς என்பது உயிர்த்தெழுதலையோ அற்புதமான உயிர்மீட்சியையோ குறிப்பிடுகிறதா
  choice: சாதாரண உடல்சார்ந்த செயலாக ‘எழுந்து நின்று’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எழுந்து’ அல்லது உயிர்த்தெழுதலை உணர்த்தும் வகையில் மொழிபெயர்த்தல்
  rationale: ἀναστὰς தனியாகப் பயன்படுத்தப்படும்போது பொதுவாக எழுதல் அல்லது எழுந்து நிற்றல் என்று பொருள்படும். கல்லெறியப்பட்ட பின்னர் பவுல் மீண்டது வியப்புக்குரியதாக இருந்தாலும், இந்த வசனம் உயிர்த்தெழுதலையோ அவர் அற்புதமாக எழுப்பப்பட்டதையோ வெளிப்படையாகக் கூறவில்லை. ஆகவே மூலத்தில் இல்லாத இறையியல் முடிவு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவான வாசகர்களுக்குப் புரியும் இயல்பான சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன. நிகழ்வின் வியப்பைத் தக்கவைத்தபோதும், மூலவசனம் வெளிப்படையாகச் சொல்லாத உயிர்த்தெழுதல் கருத்து சேர்க்கப்படவில்லை.
