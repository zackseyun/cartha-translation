  text: κἀκεῖ ⸂εὐαγγελιζόμενοι ἦσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/007.yaml
  text: And there they were preaching the good news[a].
translation:
  language: ta
  text: அங்கேயும் அவர்கள் நற்செய்தியை அறிவித்துக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கேயும் அவர்கள் சுவிசேஷத்தைப் பிரசங்கித்துக்கொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖ
  choice: அங்கேயும்
  rationale: καί + ἐκεῖ என்பதன் ‘அங்கேயும்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; முந்தைய வசனத்துடன் உள்ள தொடர்ச்சியையும் கூடுதல் இடத்தைக் குறிக்கும் நுணுக்கத்தையும் காக்கிறது.
- source_word: εὐαγγελιζόμενοι
  choice: நற்செய்தியை அறிவித்துக்கொண்டிருந்தார்கள்
  rationale: εὐαγγελίζω என்பதன் அடிப்படைப் பொருளான நற்செய்தியை அறிவித்தலைத் தெளிவாகவும் சமயக் கலைச்சொல் சாராமலும் வெளிப்படுத்துகிறது.
- source_word: ἦσαν
  choice: அறிவித்துக்கொண்டிருந்தார்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினையுடன் சேர்ந்த இறந்தகால ἦσαν தொடர்ந்துகொண்டிருந்த இறந்தகாலச் செயலைக் குறிக்கிறது; தமிழில் ‘-க்கொண்டிருந்தார்கள்’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடை. ‘நற்செய்தியை அறிவித்தல்’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டு, பரவலாக அறியப்பட்ட திருச்சபைச் சொற்களான ‘சுவிசேஷம்’, ‘பிரசங்கித்தல்’ அடிக்குறிப்பில் மாற்றாக வைக்கப்பட்டுள்ளன.
