id: ACT.14.15
reference: Acts 14:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: ta
  text: அவர்கள், “ஆண்களே, ஏன் இப்படிச் செய்கிறீர்கள்? நாங்களும் உங்களைப் போன்ற இயல்புடைய மனிதர்கள்தான்.[a] இந்தப் பயனற்றவற்றைவிட்டு உயிருள்ள கடவுளிடம் திரும்பும்படி உங்களுக்கு நற்செய்தி அறிவிக்கிறோம்.[c] வானத்தையும் பூமியையும் கடலையும் அவற்றிலுள்ள அனைத்தையும் உண்டாக்கியவர் அவரே.” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, பவுலும் பர்னபாவும் தங்கள் கேட்போரைப் போலவே அதே மனித இயல்பையும் நிலையையும் உடையவர்கள்.
    reason: lexical_alternative
  - marker: c
    text: ‘திரும்பும்படி’ என்பது இங்கே அறிவிக்கப்படும் நற்செய்தியின் அழைப்பையோ நோக்கத்தையோ வெளிப்படுத்துகிறது.
    reason: syntactic_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: ஆண்களே
  rationale: ஆண்பால் பன்மை விளியைத் துல்லியமாகப் பிரதிபலித்து, கூட்டத்தினரை நேரடியாக அழைக்கும் வடிவத்தைப் பேணுகிறது.
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: உங்களைப் போன்ற இயல்புடைய மனிதர்கள்தான்
  rationale: பவுலும் பர்னபாவும் தெய்வங்கள் அல்ல, கேட்போரின் அதே மனித நிலையைப் பகிர்பவர்கள் என்பதைக் இயல்பான தமிழில் தெரிவிக்கிறது; ‘தான்’ வலியுறுத்தலைத் தருகிறது.
- source_word: εὐαγγελιζόμενοι
  choice: நற்செய்தி அறிவிக்கிறோம்
  rationale: வினைச்சொல்லின் அறிவிப்பு சார்ந்த பொருளைப் பேணி, நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: ματαίων
  choice: பயனற்றவற்றை
  rationale: வீணான, வெறுமையான, பயனற்ற காரியங்கள் என்ற பரந்த மதிப்பீட்டுப் பொருளைப் பேணுகிறது; மூலத்தில் இல்லாத ‘சிலைகள்’ என்பதை நேரடியாகச் சேர்க்கவில்லை.
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: விலகி ... உயிருள்ள கடவுளிடம் திரும்பும்படி
  rationale: ஒருபுறம் பயனற்றவற்றிலிருந்து விலகுதலையும் மறுபுறம் உயிருள்ள கடவுளை நோக்கித் திரும்புதலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐποίησεν
  choice: உண்டாக்கிய
  rationale: படைப்புச் செயலைச் சுட்டும் ποιέω என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς
  choice: வானத்தையும் பூமியையும் கடலையும் அவற்றிலுள்ள அனைத்தையும்
  rationale: கிரேக்க மூலத்தின் தொடர்ச்சியான ‘மற்றும்’ அமைப்பையும் முழுமையான படைப்புப் பட்டியலையும் தமிழின் இணைப்புருபுகளால் பேணுகிறது.
theological_decisions:
- issue: பவுலும் பர்னபாவும் தெய்வ மரியாதையை மறுத்து தங்கள் மனித நிலையை வலியுறுத்துதல்
  choice: நாங்களும் உங்களைப் போன்ற இயல்புடைய மனிதர்கள்தான்
  alternative: நாங்களும் உங்களைப் போலவே மனிதர்கள்தான்
  rationale: ὁμοιοπαθεῖς என்பதன் பகிரப்பட்ட மனித இயல்பு/நிலை என்ற கருத்தை வெளிப்படையாகப் பேணுகிறது; அதை வெறும் உணர்ச்சிச் சாயலாகக் குறுக்கவில்லை.
- issue: ‘பயனற்றவை’ என்பதன் பரப்பு
  choice: முதன்மை உரையில் பரந்த ‘பயனற்றவை’ என்ற சொல்
  alternative: சிலைகள்
  rationale: சூழலில் புறமத வழிபாடும் பலியிடுதலும் குறிக்கப்பட்டாலும், கிரேக்கச் சொல் ‘சிலைகள்’ என்பதைக் காட்டிலும் பரந்தது; ஆகவே சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘உயிருள்ள கடவுள்’ என்ற எதிர்மறை ஒப்பீடு
  choice: உயிருள்ள கடவுள்
  alternative: ஜீவனுள்ள தேவன்
  rationale: ζῶντα என்பதன் நேரடி பொருளையும் உயிரற்ற வழிபாட்டுப் பொருட்களுடனான மறைமுக எதிர்மறையையும் நவீன, பொதுவான தமிழில் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘தேவன்’ என்பதற்குப் பதில் சமயப் பிரிவு சாராத பொதுவான ‘கடவுள்’ பயன்படுத்தப்பட்டது. கிரேக்கத்தின் நீண்ட வாக்கிய ஓட்டம் தமிழில் இயல்பாக இருக்கும்படி மறுவரிசைப்படுத்தப்பட்டாலும், காரணம், அழைப்பு, படைப்புச் சூத்திரம் ஆகிய அனைத்தும் பேணப்பட்டுள்ளன.
