  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: ta
  text: என்றாலும், அவர் நன்மை செய்து, வானத்திலிருந்து உங்களுக்கு மழைகளையும் விளைச்சல் தரும் பருவங்களையும்[b] கொடுத்து, உணவாலும் மகிழ்ச்சியாலும் உங்கள் உள்ளங்களை[c] நிரப்பி, தம்மைப் பற்றிய சாட்சி இல்லாதபடி தம்மை விட்டுவிடவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம்மைப் பற்றிய சான்று இல்லாதபடி.” கிரேக்கத்தில், தேவன் தம்மைக் குறித்த சாட்சியின்றி தம்மை விட்டுவிடவில்லை என்ற கருத்து வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பலன் தரும் பருவங்கள்.”
    reason: lexical_alternative
  - marker: c
    text: சில கையெழுத்துப் பிரதிகளில் “எங்கள் உள்ளங்களை” என்று உள்ளது; SBLGNT மூலப்பதிப்பு “உங்கள் உள்ளங்களை” என்று வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: என்றாலும்
  rationale: முந்தைய வசனத்தின் கருத்துக்கு எதிர்மறைச் சலுகைத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: ἀμάρτυρον αὑτὸν ἀφῆκεν
  choice: தம்மைப் பற்றிய சாட்சி இல்லாதபடி விட்டுவிடவில்லை
  rationale: தேவன் தம்மைக் குறித்த சாட்சியின்றி இருக்க விடவில்லை என்ற கிரேக்கத் தொடரின் சான்றளிக்கும் நுணுக்கத்தையும் αὑτόν என்பதன் தற்சுட்டுப் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀγαθουργῶν
  choice: நன்மை செய்ததன் மூலம்
  rationale: தொடர்ந்து வரும் மழை, விளைச்சல், உணவு, மகிழ்ச்சி ஆகியவை தேவன் அளித்த நன்மைகளாகவும் அவர் தம்மைப் பற்றிச் சாட்சி கொடுத்த விதமாகவும் இருப்பதைப் பங்கேற்பு வினையின் தொடர்புக்கு ஏற்ப காட்டுகிறது.
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: வானத்திலிருந்து உங்களுக்கு மழைகளைக் கொடுத்து
  rationale: οὐρανόθεν என்பதன் மூலத்தையும் ὑετούς என்பதன் பன்மையையும் நேரடியாகக் காக்கிறது.
- source_word: καιροὺς καρποφόρους
  choice: விளைச்சல் தரும் பருவங்கள்
  rationale: வேளாண் சூழலில் καρποφόρους என்பதன் பலன் தரும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ὑμῶν
  choice: உணவாலும் மகிழ்ச்சியாலும் உங்கள் உள்ளங்களை நிரப்பினார்
  rationale: நிறைத்தல் என்ற உருவகத்தையும் உணவு மற்றும் மகிழ்ச்சி என்ற இரு கொடைகளையும் பாதுகாக்கிறது; καρδίας என்பதற்கு இச்சூழலில் இயல்பான ‘உள்ளங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: படைப்பிலும் பராமரிப்பிலும் வெளிப்படும் தேவசாட்சி
  choice: மழை, விளைச்சல், உணவு, மகிழ்ச்சி ஆகிய நன்மைகளின் மூலம் தேவன் தம்மைப் பற்றிச் சாட்சி கொடுக்கிறார்
  alternative: இவை இறையியல் அர்த்தமற்ற இயற்கை நிகழ்வுகளை மட்டுமே குறிக்கின்றன
  rationale: ‘தம்மைப் பற்றிய சாட்சி’ என்ற சொற்றொடரும் தேவனுடைய செயல்களை விவரிக்கும் பங்கேற்பு வினைகளும் இந்நன்மைகளை அவருடைய சாட்சியாகவே முன்வைக்கின்றன; இதற்கு அப்பாற்பட்ட கோட்பாட்டை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட பங்கேற்பு வினை அமைப்பு, கருத்துத் தொடர்பைத் தெளிவாக்கும் வகையில் முதன்மை வாக்கியத்திற்குப் பின் விளக்கக் கூறாக அமைக்கப்பட்டுள்ளது; ‘உள்ளங்கள்’ என்பது சொற்சொல் உடல் உறுப்பைக் காட்டாமல் மனிதரின் அகநிலையைக் குறிக்கும் இயல்பான தமிழ்.
