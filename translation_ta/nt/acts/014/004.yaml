source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: ta
  text: ஆனால் நகர மக்கள் பிளவுபட்டார்கள்[a]; சிலர் யூதர்களுடன் இருந்தனர்; மற்றவர்கள் அப்போஸ்தலர்களுடன் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நகர மக்களின் திரள் பிளவுபட்டது.’
    reason: ἐσχίσθη மற்றும் τὸ πλῆθος τῆς πόλεως ஆகியவற்றின் அதிகச் சொற்சார்ந்த மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐσχίσθη
  choice: பிளவுபட்டார்கள்
  rationale: σχίζω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் ‘பிளக்கப்பட்டார்கள்/பிரிக்கப்பட்டார்கள்’ என்று நேரடியாகப் பொருள்படும். இங்கு நகர மக்களிடையே ஏற்பட்ட சமூகப் பிரிவை இயல்பான தமிழில் ‘பிளவுபட்டார்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: நகர மக்கள்
  rationale: πλῆθος என்பது திரள் அல்லது பெருந்தொகையான மக்களைக் குறிக்கலாம். இச்சூழலில் ஒரே நேரத்தில் கூடியிருந்த கூட்டத்தைவிட நகர மக்களைப் பொதுவாகக் குறிப்பதால், ‘நகர மக்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: δέ முந்தைய வசனத்திலிருந்து மென்மையான எதிர்மாற்றத்தையோ நிகழ்வின் அடுத்த வளர்ச்சியையோ குறிக்கிறது; இங்கு ஏற்பட்ட பிரிவை முன்னிலைப்படுத்த ‘ஆனால்’ பொருத்தமானது.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: சிலர் ... மற்றவர்கள்
  rationale: இந்த இணை அமைப்பு எதிரெதிரான இரு பிரிவுகளைக் குறிக்கிறது. ‘சிலர் ... மற்றவர்கள்’ என்பது நவீன தமிழில் இயல்பாக அந்த இருபிரிவையும் வெளிப்படுத்துகிறது.
- source_word: σὺν
  choice: -ஓடும் சேர்ந்திருந்தார்கள்
  rationale: σύν ஆள்களோடு இணைந்திருப்பதையோ அவர்களது பக்கம் நிற்பதையோ குறிக்கிறது. வெறும் உடனிருப்பைத் தாண்டி இங்குள்ள அணிச்சேர்க்கையை ‘சேர்ந்திருந்தார்கள்’ இயல்பாக உணர்த்துகிறது; எனினும் மூலத்தின் ‘உடன்’ என்ற அடிப்படைப் பொருளும் பின்னொட்டில் பாதுகாக்கப்படுகிறது.
- source_word: Ἰουδαίοις
  choice: யூதர்கள்
  rationale: இந்த வசனம் குறிப்பாகத் தலைவர்களை மட்டும் சுட்டுவதாகத் தெளிவுபடுத்தவில்லை. ஆகவே Ἰουδαῖοι என்பதற்கான நேரடியான ‘யூதர்கள்’ என்பதே பயன்படுத்தப்படுகிறது.
- source_word: ἀποστόλοις
  choice: அப்போஸ்தலர்கள்
  rationale: அப்போஸ்தலர் 14:14-ல் பவுலும் பர்னபாவும் ἀπόστολοι என்று அழைக்கப்படுகிறார்கள். தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்றுள்ள ‘அப்போஸ்தலர்கள்’ மூலச் சொல்லைத் துல்லியமாகவும் புரியத்தக்க வகையிலும் தருகிறது.
theological_decisions:
- issue: ‘அப்போஸ்தலர்கள்’ என்பது யாரைக் குறிக்கிறது
  choice: பவுலையும் பர்னபாவையும் குறிக்கும் கதைசார் பட்டமாக ‘அப்போஸ்தலர்கள்’ என்பதைத் தக்கவைத்தல்
  alternative: ‘தூதுவர்கள்’ என்று பொதுவாக மொழிபெயர்த்தல்
  rationale: இதே அதிகாரத்தின் 14-ஆம் வசனத்தில் லூக்கா பர்னபாவையும் பவுலையும் வெளிப்படையாக ‘அப்போஸ்தலர்கள்’ என்று அழைக்கிறார். எனவே இந்தச் சொல்லை நேரடியாகத் தக்கவைப்பது, வசனம் கூறுவதைவிட குறுகிய அல்லது விரிவான கோட்பாட்டைத் திணிக்காமல் அதன் சொற்பயன்பாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிளவுபட்டார்கள்’ சமூகப் பிரிவை இயல்பாகக் காட்டுகிறது; ‘சேர்ந்திருந்தார்கள்’ இரு தரப்பினருடனான அணிச்சேர்க்கையைத் தெளிவுபடுத்துகிறது.
