  text: συνιδόντες κατέφυγον εἰς τὰς πόλεις τῆς Λυκαονίας Λύστραν καὶ Δέρβην καὶ τὴν περίχωρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/006.yaml
  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: ta
  text: அதை அறிந்ததும்[a], அவர்கள் லிக்கவோனியாவில் உள்ள லீஸ்திரா, தெர்பே என்னும் நகரங்களுக்கும் அவற்றைச் சுற்றியுள்ள பகுதிக்கும் தப்பியோடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதை உணர்ந்தபோது’ அல்லது ‘அதைப் பற்றித் தெரியவந்ததும்.’ முந்தைய வசனத்தில் கூறப்பட்ட ஆபத்தை அவர்கள் புரிந்துகொண்டதை கிரேக்கப் பங்கேற்புவினை குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: அதை அறிந்ததும்
  rationale: சூழ்நிலையைப் புரிந்துகொள்வதையோ ஆபத்தை அறிந்துகொள்வதையோ குறிக்கும் இறந்தகாலப் பங்கேற்புவினை. முந்தைய வசனத்தில் கூறப்பட்ட சதித்திட்டமே ‘அதை’ என்பதன் சூழல் சார்ந்த பொருள். ‘அறிந்ததும்’ என்பது உடன்தொடர்பையும் இயல்பான தமிழ்நடையையும் தருகிறது.
- source_word: κατέφυγον
  choice: தப்பியோடினார்கள்
  rationale: ஆபத்திலிருந்து அடைக்கலம் தேடி விரைவாக விலகிச் செல்வதை இங்கு குறிக்கிறது. ‘தப்பியோடினார்கள்’ என்பது இந்தக் கதையோட்டத்தில் அவசரமான புறப்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰς
  choice: -க்கும் … -க்கும்
  rationale: இயக்கத்தின் சென்றடையும் இடத்தை εἰς குறிக்கிறது. தமிழில் பட்டணங்களின் பெயர்களோடு ‘-க்கு’ உருபு இயல்பாக இலக்கைச் சுட்டுகிறது.
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: லிக்கவோனியாவிலுள்ள பட்டணங்கள்
  rationale: மண்டலத் தொடர்பைக் குறிக்கும் கிரேக்க உடைமை வேற்றுமையை இயல்பான தமிழில் ‘-விலுள்ள’ என்று வழங்குகிறது; தொடர்ந்து வரும் இரு பெயர்கள் அந்தப் பட்டணங்களை விளக்குகின்றன.
- source_word: Λύστραν καὶ Δέρβην
  choice: லீஸ்திராவும் தெர்பையும்
  rationale: இடப்பெயர்களின் தமிழ் ஒலிபெயர்ப்புகள்; இவை முன்கூறிய லிக்கவோனியப் பட்டணங்களை அடையாளப்படுத்துகின்றன.
- source_word: τὴν περίχωρον
  choice: அவற்றைச் சுற்றியுள்ள பகுதி
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட περίχωρος, பெயரிடப்பட்ட பட்டணங்களைச் சுற்றியுள்ள பரந்த இடத்தைக் குறிக்கிறது. ‘பகுதி’ என்பது நகர்ப்புறம், நாட்டுப்புறம் இரண்டையும் உள்ளடக்கக்கூடியது.
- source_word: καὶ ... καὶ
  choice: லீஸ்திராவுக்கும் தெர்பைக்கும் அவற்றைச் சுற்றியுள்ள பகுதிக்கும்
  rationale: மீண்டும் வரும் καί இரண்டு பட்டணங்களையும் பின்னர் சுற்றுப்புறத்தையும் இணைக்கிறது. தமிழின் இணை வேற்றுமை அமைப்பு இந்தத் தொடர்பை இயல்பாகக் காட்டுகிறது.
