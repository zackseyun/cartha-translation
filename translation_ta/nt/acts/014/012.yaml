source:
  edition: SBLGNT
  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: ta
  text: அவர்கள் பர்னபாவைச் சேயுஸ்[a] என்றும், பவுலை ஹெர்மேஸ் என்றும் அழைத்துக்கொண்டிருந்தார்கள்; ஏனெனில், அவரே பேசுவதில் முன்னிலை வகித்தவர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ‘சேயுஸ்’ மற்றும் ‘ஹெர்மேஸ்’ என்ற பெயர்களே உள்ளன. சில பாரம்பரிய மொழிபெயர்ப்புகள் அவற்றின் ரோமப் பெயர்களான ‘யூப்பிட்டர்’ மற்றும் ‘மெர்க்குரி’ என்பவற்றைப் பயன்படுத்துகின்றன.
    reason: alternative_reading
  - marker: b
    text: 'நேரடியாக: ‘பேச்சை வழிநடத்தியவர்’; அல்லது ‘முதன்மைப் பேச்சாளர்’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: அழைத்துக்கொண்டிருந்தார்கள்
  rationale: நிறைவுறா இறந்தகால வினை வடிவம், அவர்கள் அப்பெயர்களால் தொடர்ந்து அழைத்துக்கொண்டிருந்ததைக் காட்டுகிறது.
- source_word: τε
  choice: அவர்கள்… என்றும்
  rationale: τε இங்கு முந்தைய நிகழ்வுடன் மென்மையாக இணைக்கிறது; தமிழில் தனியான இணைப்புச்சொல் சேர்க்காமல் வாக்கிய ஓட்டத்திலேயே அந்தத் தொடர்பு இயல்பாக வெளிப்படுகிறது.
- source_word: Δία
  choice: சேயுஸ்
  rationale: கிரேக்க மூலத்தில் உள்ள கிரேக்கத் தெய்வத்தின் பெயரையே ஒலிபெயர்க்கிறது; ரோமப் பெயரான ‘யூப்பிட்டர்’ பயன்படுத்தப்படவில்லை.
- source_word: Ἑρμῆν
  choice: ஹெர்மேஸ்
  rationale: கிரேக்க மூலத்தில் உள்ள பெயரை நேரடியாக ஒலிபெயர்க்கிறது; ரோமப் பெயரான ‘மெர்க்குரி’ பயன்படுத்தப்படவில்லை.
- source_word: ἐπειδὴ
  choice: ஏனெனில்
  rationale: பவுலை ஹெர்மேஸ் என்று அடையாளப்படுத்தியதற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: αὐτὸς
  choice: அவரே
  rationale: பர்னபாவிலிருந்து பவுலை வேறுபடுத்திக் காட்டும் மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: பேசுவதில் முன்னிலை வகித்தவர்
  rationale: சொல் அல்லது உரையை வழிநடத்தியவர் என்ற கிரேக்கத் தொடரின் கருத்தை இயல்பான நவீனத் தமிழில் தருகிறது; λόγος என்பதை இங்கு இறையியல் பொருளுள்ள ‘வார்த்தை’ என்று பொருள்கொள்ளாமல் பேச்சு எனப் புரிந்துகொள்கிறது.
theological_decisions:
- issue: புறவினத் தெய்வங்களின் பெயர்களை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘சேயுஸ்’, ‘ஹெர்மேஸ்’ என்ற கிரேக்கப் பெயர்களைப் பயன்படுத்துதல்
  alternative: ‘யூப்பிட்டர்’, ‘மெர்க்குரி’ என்ற ரோமப் பெயர்களைப் பயன்படுத்துதல்
  rationale: மக்கள் பர்னபாவையும் பவுலையும் கிரேக்கத் தெய்வங்களுடன் ஒப்பிட்ட நிகழ்வை வசனம் தெரிவிக்கிறது. மூலமொழிக்கு முன்னுரிமை அளிப்பதால், பிற்கால மொழிபெயர்ப்பு மரபிலுள்ள ரோமப் பெயர்களுக்குப் பதிலாக கிரேக்கப் பெயர்கள் வைக்கப்பட்டுள்ளன.
- issue: ὁ ἡγούμενος τοῦ λόγου என்பதன் பொருள்
  choice: ‘பேசுவதில் முன்னிலை வகித்தவர்’
  alternative: ‘முதன்மைப் பேச்சாளர்’ அல்லது ‘உரையை வழிநடத்தியவர்’
  rationale: இந்தத் தொடர் பவுலின் பேச்சுப் பங்கைச் சுட்டுகிறது. ‘முதன்மைப் பேச்சாளர்’ என்பது சாத்தியமான சுருக்கமான மொழிபெயர்ப்பு; ஆனால் ‘முன்னிலை வகித்தவர்’ என்பது மூலத்தின் ‘வழிநடத்துதல்’ சார்ந்த நுட்பத்தையும் அதன் இயல்பான தெளிவின்மையையும் சிறப்பாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified narrative நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான செயலை ‘அழைத்துக்கொண்டிருந்தார்கள்’ என்பதும், αὐτός-இன் வலியுறுத்தலை ‘அவரே’ என்பதும் பாதுகாக்கின்றன. தெய்வப் பெயர்கள் மூல கிரேக்க வடிவங்களுக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன.
