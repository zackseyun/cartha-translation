  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: ta
  text: ஆனால் நம்ப மறுத்த[a] யூதர்கள், யூதரல்லாத மக்களைத் தூண்டிவிட்டு, சகோதரர்களுக்கு[c] எதிராக அவர்களுடைய மனப்பாங்கைக்[b] கெடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீழ்ப்படியாதவர்களாக இருந்த.” கிரேக்கச் சொல் செய்தியை நம்ப மறுப்பதையும் கீழ்ப்படிய மறுப்பதையும் குறிக்கலாம்; இச்சூழலில் நற்செய்தியை ஏற்க மறுத்ததே முதன்மையாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “அவர்களுடைய ஆத்துமாக்களை.” இங்கு அது அவர்களுடைய உள்ளார்ந்த மனநிலை அல்லது அணுகுமுறையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இங்கு “சகோதரர்கள்” என்பது பெண்களையும் உள்ளடக்கிய சக விசுவாசிகள் அனைவரையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
