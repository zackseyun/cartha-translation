theological_decisions:
- issue: ἀδελφῶν என்பது ஆண்களை மட்டும் குறிக்கிறதா அல்லது விசுவாசிகள் அனைவரையும் குறிக்கிறதா
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; விசுவாசிகள்
  rationale: மூல கிரேக்கம் ஆண்பால் பன்மையைப் பயன்படுத்துகிறது. ஆரம்பக் கிறிஸ்தவப் பயன்பாட்டில் அது பெண்கள் உட்பட சக விசுவாசிகள் அனைவரையும் குறிக்கக்கூடும்; ஆகவே மூல வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, உள்ளடக்கிய பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀπειθήσαντες என்பதில் நம்பாமையா அல்லது கீழ்ப்படியாமையா முதன்மை
  choice: நம்ப மறுத்த
  alternative: கீழ்ப்படியாதவர்களாக இருந்த
  rationale: சுவிசேஷ அறிவிப்பின் உடனடி சூழல் நம்ப மறுத்தலை முன்னிறுத்துகிறது; எனினும் கீழ்ப்படியாமை என்ற உண்மையான சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
