  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இவ்வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் காலவாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘தங்கள் தலைவர்கள்’ என்ற தொடர் மூலத்தின் தொடர்புச் சிறு தெளிவின்மையைத் தேவையின்றி தீர்க்காமல் காக்கிறது.
