  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: ta
  text: யூதரல்லாதவர்களும் யூதர்களும்[b] தங்கள் தலைவர்களுடன் சேர்ந்து அவர்களைக் கொடுமைப்படுத்தவும் கல்லெறியவும் ஒரு முயற்சி ஏற்பட்டபோது[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு முயற்சி ஏற்பட்டபோது’ என்பதற்குப் பதிலாக ‘தாக்குவதற்குப் பாய்ந்தபோது’ அல்லது ‘தாக்குதல் தொடங்கியபோது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க ὁρμή என்பது வன்முறையான பாய்ச்சலையோ தாக்குதலின் தொடக்கத்தையோ குறிக்கக்கூடும். ஆனால் கொடுமைப்படுத்துவதும் கல்லெறிவதும் நோக்கங்களாகக் கூறப்படுவதால், அவை இவ்வசனத்திலேயே நிறைவேறிவிட்டன என்று உணர்த்தாத ‘ஒரு முயற்சி ஏற்பட்டபோது’ என்பது இங்கு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘யூதர்கள்’ என்பது சில சூழல்களில் ‘யூதேயர்கள்’ என்றும் மொழிபெயர்க்கப்படலாம். இங்கு யூதேயாவைச் சேர்ந்தவர்களை மட்டும் அல்லாமல், எதிர்த்த யூதர்களை ஒரு குழுவாகக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  choice: முயன்றபோது
  rationale: ὡς δέ அடுத்த நிகழ்வை மிதமான இணைப்புடன் காலவாக்கியமாக அறிமுகப்படுத்துகிறது. ἐγένετο ὁρμή என்ற தொடரைத் தமிழில் இயல்பாகக் கூறுவதற்கு ‘முயன்றபோது’ என வழங்கப்பட்டுள்ளது.
- source_word: ὁρμὴ
  choice: முயன்றபோது
  rationale: ὁρμή என்பது உந்துதல், பாய்ச்சல் அல்லது தாக்குதல் தொடங்குதல் என்பதைக் குறிக்கலாம். அடுத்து வரும் இரு நோக்கவினைகளும் செயல் நிறைவேறியதாகக் கூறாததால், ‘முயன்றபோது’ என்பது தொடங்கிய பகைமைச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν ἐθνῶν
  choice: யூதரல்லாத மக்களும்
  rationale: யூதர்களுடன் வேறுபடுத்திக் கூறப்படும் ἔθνη இங்கு அரசியல் நாடுகளைக் காட்டிலும் யூதரல்லாத மக்களைக் குறிக்கிறது.
- source_word: τε καὶ
  choice: …உம் …உம்
  rationale: யூதரல்லாத மக்களும் யூதர்களும் ஆகிய இரு தரப்பினரும் இதில் ஈடுபட்டதை இந்த இணைப்பு தெளிவாகக் காட்டுகிறது.
- source_word: Ἰουδαίων
  choice: யூதர்களும்
  rationale: இங்கு இந்தச் சொல் யூதேயா பகுதியில் வாழ்ந்தவர்களை மட்டும் அல்லாமல், எதிர்த்த யூதர்களை ஒரு குழுவாகக் குறிக்கிறது.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: தங்கள் தலைவர்களோடு சேர்ந்து
  rationale: ἄρχοντες அதிகாரம் அல்லது தலைமைப் பொறுப்பில் இருந்தவர்களைக் குறிக்கிறது. ‘தங்கள்’ என்பது மூலத்தில் உள்ள αὐτῶν என்பதன் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ὑβρίσαι
  choice: கொடுமைப்படுத்தவும்
  rationale: ὑβρίζω என்பது அவமதிப்புடன் கூடிய மோசமான நடத்தையையோ வன்முறையான துன்புறுத்தலையையோ குறிக்கலாம். வெறும் வாய்மொழி இகழ்ச்சியாகக் குறுக்காமல் அதன் பரப்பை ‘கொடுமைப்படுத்த’ தக்கவைக்கிறது.
- source_word: καὶ λιθοβολῆσαι
  choice: கல்லெறியவும்
  rationale: λιθοβολέω என்பது கல்லெறிதலைக் குறிக்கிறது. மரண நோக்கம் சாத்தியமானதாயினும், ‘கொல்ல’ என்று சேர்க்காமல் மூலத்தின் அளவு காக்கப்பட்டுள்ளது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: உடனடி சூழலில் பவுலையும் பர்னபாவையும் குறிக்கும் பன்மைப் பதிலிடுபெயர் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
