  source_fidelity: மிகவும் நன்று. «உரத்த குரலில்» μεγάλῃ φωνῇ என்பதையும், «உன் கால்களின்மேல் நிமிர்ந்து நில்» Ἀνάστηθι ἐπὶ τοὺς πόδας σου ὀρθός என்பதையும், «துள்ளியெழுந்து நடக்கத் தொடங்கினான்» ἥλατο καὶ περιεπάτει என்பதையும் பொருளிலும் நிகழ்ச்சித் தொடரிலும் துல்லியமாகக் கொடுக்கிறது. περιεπάτει-யின் முற்றுப்பெறாத காலத்திற்கான தொடக்கப் பொருள் அடிக்குறிப்பில் உள்ள தொடர்ச்சிச் சாத்தியத்துடன் சமநிலையாகப் பாதுகாக்கப்பட்டுள்ளது.
  naturalness: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை. «நிமிர்ந்து நில்» கட்டளையின் நேரான உடல்நிலையைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது; «துள்ளியெழுந்து» அற்புதத்துக்குப் பிந்தைய உடனடியான செயலை உயிரோட்டமாகக் காட்டுகிறது.
  terminology: பெயர்கள் அல்லது சிறப்புக் கலைச்சொற்கள் இவ்வசனத்தில் இல்லை. «உரத்த குரலில்», «நிமிர்ந்து நில்», «துள்ளியெழுந்து» ஆகிய தேர்வுகள் பதிவிற்கும் சூழலுக்கும் ஏற்றவை. அடிக்குறிப்பு a இறுதி வினைத்தொடருடன் சரியாக இணைக்கப்பட்டுள்ளது.
