source:
  edition: SBLGNT
  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: ta
  text: அவர் உரத்த குரலில், “உன் கால்களின்மேல் நிமிர்ந்து நில்” என்றார். அவன் துள்ளியெழுந்து நடக்கத் தொடங்கினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் துள்ளியெழுந்து நடந்துகொண்டிருந்தான்.” இறுதி வினைச்சொல் தொடர்ந்த செயலை அல்லது நடக்கத் தொடங்கியதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: உரத்த குரலில்
  rationale: முறையைக் குறிக்கும் இந்தத் தத்திவுத் தொடர், பொதுமக்கள் கேட்கும்படியான வலிமையான குரலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: Ἀνάστηθι
  choice: நில்
  rationale: கால்களைப் பயன்படுத்த முடியாதிருந்த மனிதன் எழுந்து நிற்க வேண்டும் என்ற கட்டளையை, தொடர்ந்து வரும் உடல்நிலைச் சொல்லோடு இணைந்து தெளிவாகத் தெரிவிக்கிறது.
- source_word: ἐπὶ τοὺς πόδας σου
  choice: உன் கால்களின்மேல்
  rationale: நிற்பதற்கான உடல் ஆதாரத்தையும் நிலைப்பாட்டையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὀρθός
  choice: நிமிர்ந்து
  rationale: ὀρθός குறிக்கும் நேரான, செங்குத்தான உடல் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἥλατο
  choice: துள்ளியெழுந்து
  rationale: ἅλλομαι வினையின் திடீரான, உயிரோட்டமுள்ள பாய்ச்சலைத் தமிழ்க் கதைநடையில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: περιεπάτει
  choice: நடக்கத் தொடங்கினான்
  rationale: முற்றுப்பெறாத கால வினை வடிவம் சூழலில் நடப்புச் செயல் தொடங்கியதைக் குறிக்கலாம்; இந்தத் தேர்வு குணமடைந்தவுடன் ஏற்பட்ட தொடர்ச்சியான நடையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அற்புதத்தின் மொழியும் உடல் நிலைக்கான கட்டளையும்
  choice: கட்டளையையும் உடனடியான உடல் சார்ந்த பதிலையும் உரையில் உள்ளபடியே நேரடியாக மொழிபெயர்த்தல்
  alternative: குணமாக்குதலின் இறையியல் பொருளை விளக்கும் சொற்களைச் சேர்த்தல்
  rationale: கிரேக்க உரை ஒரு நேரடிக் கட்டளையைத் தொடர்ந்து உடனடியாகக் காணக்கூடிய செயலை விவரிக்கிறது; உரையில் இல்லாத சமயவியல் விளக்கத்தைச் சேர்க்காமல் இந்தத் தெளிவைப் பாதுகாக்க வேண்டும்.
- issue: περιεπάτει என்ற முற்றுப்பெறாத காலத்தின் நுணுக்கம்
  choice: நடக்கத் தொடங்கினான்
  alternative: நடந்துகொண்டிருந்தான்
  rationale: இந்த வினை வடிவம் தொடரும் செயலையோ செயல் தொடங்கியதையோ குறிக்கக்கூடியது. நிகழ்ச்சித் தொடரில் தொடக்க நுணுக்கம் இயல்பானது; எனினும் மாற்று சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பான, கண்ணியமான கதைநடை. “நிமிர்ந்து நில்” என்பது Ἀνάστηθι ... ὀρθός என்ற கட்டளையின் பொருளைத் தெளிவாகத் தருகிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய இறுதி வினைத்தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
