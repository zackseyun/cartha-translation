  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: ta
  text: அவர்கள் ஒவ்வொரு திருச்சபைக்கும் மூப்பர்களை நியமித்து[a], உபவாசத்துடன் ஜெபித்து, அவர்கள் நம்பியிருந்த ஆண்டவரிடம் அவர்களை[b] ஒப்படைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு திருச்சபைக்கும் மூப்பர்களைத் தேர்ந்தெடுத்து.” கிரேக்க வினைச்சொல் சில சூழல்களில் கைகளை உயர்த்தி வாக்களித்துத் தேர்ந்தெடுப்பதைக் குறிக்கலாம்; ஆனால் இங்கு அது நியமித்தல் என்ற பொருளிலும் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “அவர்களை” என்பது விசுவாசிகள் அனைவரையும் குறிக்கலாம்; அல்லது புதிதாக நியமிக்கப்பட்ட மூப்பர்களை மட்டும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: நியமித்து
  rationale: இந்த வினை தேர்ந்தெடுத்தல் அல்லது நியமித்தலைக் குறிக்கிறது. கைகளை உயர்த்தி வாக்களித்தல் என்ற பழைய தொடர்பு இருந்தாலும், இவ்வசனம் ஒரு குறிப்பிட்ட நிர்வாக முறையைத் தெளிவாகக் கூறாததால், நடுநிலையான ‘நியமித்து’ பயன்படுத்தப்பட்டது.
- source_word: κατ’ ἐκκλησίαν
  choice: ஒவ்வொரு திருச்சபைக்கும்
  rationale: κατά ஒருமை பெயர்ச்சொல்லுடன் பகிர்ந்தளிக்கும் பொருளைத் தருவதால், ஒவ்வொரு உள்ளூர் திருச்சபையிலும் மூப்பர்கள் ஏற்படுத்தப்பட்டனர் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; αὐτοῖς என்பதன் ‘அவர்களுக்காக’ என்ற கருத்தும் இந்த அமைப்பில் அடங்குகிறது.
- source_word: πρεσβυτέρους
  choice: மூப்பர்களை
  rationale: இங்கு வயதில் மூத்த ஆண்களை மட்டும் அல்லாமல் திருச்சபையில் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது. ‘மூப்பர்கள்’ என்பது தெளிவான, பரவலாகப் புரிந்துகொள்ளப்படும் சொல்.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: உபவாசம் இருந்து ஜெபித்த பின்பு
  rationale: ஜெபத்துடன் உபவாசமும் இணைந்திருந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது. கிரேக்கப் பன்மையைத் தமிழில் செயற்பாட்டு ஒருமையாகக் கூறுவது வழக்கமானதும் பொருளுக்குத் துல்லியமானதும் ஆகும்.
- source_word: παρέθεντο
  choice: ஒப்படைத்தார்கள்
  rationale: ஒருவரை இன்னொருவரின் பாதுகாப்புக்கும் பராமரிப்புக்கும் நம்பி ஒப்படைப்பதை இந்த நடுவினை வடிவம் உணர்த்துகிறது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவரிடம்
  rationale: ஒப்படைக்கப்பட்டவர்கள் யாருடைய பராமரிப்பில் வைக்கப்பட்டார்கள் என்பதை வேற்றுமை உருபு காட்டுகிறது; κύριος என்பதற்கு ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: அவர்கள் நம்பியிருந்த
  rationale: முன்னரே தொடங்கி நிலைத்திருந்த நம்பிக்கையை இறந்தகால நிறைவுவினை காட்டுகிறது. தொடர்புப்பெயர் ‘ஆண்டவர்’ என்பதையே சுட்டுகிறது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: சுட்டுப்பெயரை அப்படியே வைத்திருப்பதால், அது விசுவாசிகள் அனைவரையா அல்லது புதிதாக நியமிக்கப்பட்ட மூப்பர்களையா குறிக்கிறது என்ற உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: χειροτονήσαντες என்பதற்கும் திருச்சபை நிர்வாக முறைக்கும் உள்ள தொடர்பு
  choice: மூப்பர்களை நியமித்து
  alternative: மூப்பர்களைக் கைகளை உயர்த்தி வாக்களித்துத் தேர்ந்தெடுத்து
  rationale: சொல்லுக்கு வாக்களித்துத் தேர்ந்தெடுப்பதுடன் வரலாற்றுத் தொடர்பு இருக்கலாம்; ஆனால் இவ்வசனம் குறிப்பிட்ட தேர்தல் முறையை உறுதிப்படுத்தவில்லை. ‘நியமித்து’ என்பது மையச் செயலைத் தெரிவித்து, எந்தச் சபை நிர்வாக முறையையும் உரைக்குள் புகுத்தாமல் இருக்கிறது.
- issue: παρέθεντο αὐτοὺς என்பதில் αὐτοὺς யாரைக் குறிக்கிறது
  choice: விசுவாசிகள் அல்லது திருச்சபையினர் அனைவரும் ஆண்டவரிடம் ஒப்படைக்கப்பட்டனர் என்பது முதன்மை வாசிப்பு; உரையில் ‘அவர்களை’ என்று வைக்கப்பட்டது
  alternative: புதிதாக நியமிக்கப்பட்ட மூப்பர்கள் மட்டும் ஆண்டவரிடம் ஒப்படைக்கப்பட்டனர்
  rationale: சுற்றியுள்ள பகுதி சீடர்களை உறுதிப்படுத்துவதைப் பற்றிப் பேசுவதால், விசுவாசிகள் அனைவரும் முதன்மையான சுட்டுப்பொருளாகத் தோன்றுகின்றனர். எனினும் மூப்பர்களும் உடனடி சூழலில் இருப்பதால், சுட்டுப்பெயரின் தெளிவின்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘திருச்சபை,’ ‘மூப்பர்கள்,’ ‘உபவாசம்,’ ‘ஆண்டவர்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக இருப்பதால் தக்கவைக்கப்பட்டன. கிரேக்கத்தின் சுட்டுப்பெயர் தெளிவின்மையும் திருச்சபை நிர்வாக முறை குறித்த திறந்த நிலையும்தீர்க்கப்படாமல் பாதுகாக்கப்பட்டன.
