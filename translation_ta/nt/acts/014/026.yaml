base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: ta
  text: அங்கிருந்து அவர்கள் கப்பலில் அந்தியோகியாவுக்குப் புறப்பட்டுச் சென்றார்கள். அந்தியோகியாவில்தான் தாங்கள் நிறைவேற்றிய[a] பணிக்காக அவர்கள் தேவனுடைய கிருபைக்கு ஒப்புவிக்கப்பட்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிறைவுசெய்த” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஒப்படைக்கப்பட்டிருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: அங்கிருந்து
  rationale: இது முந்தைய இடத்திலிருந்து தொடரும் பயணத்தையும் கதைத் தொடர்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀπέπλευσαν
  choice: கப்பலில் புறப்பட்டுச் சென்றார்கள்
  rationale: கடல் வழியாக அந்த இடத்தைவிட்டுப் புறப்பட்டார்கள் என்ற வினையின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰς Ἀντιόχειαν
  choice: அந்தியோகியாவுக்கு
  rationale: இயக்கத்தைக் குறிக்கும் εἰς என்பதற்கு இயல்பான தமிழ் இலக்கைச் சுட்டும் வடிவம்.
- source_word: ὅθεν
  choice: அங்கிருந்துதான்
  rationale: அந்தியோகியாவே அவர்கள் முன்பு ஒப்புவிக்கப்பட்டு புறப்பட்ட இடம் என்ற ‘எங்கிருந்து’ என்னும் மூலப்பொருளை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: ἦσαν παραδεδομένοι
  choice: ஒப்புவிக்கப்பட்டிருந்ததும்
  rationale: முன்னர் நிகழ்ந்த ஒப்புவித்தல் தொடர்ந்து பொருத்தமுடையதாக இருந்ததைப் பெயரெச்ச இறந்தகால அமைப்பு உணர்த்துகிறது; செயப்பாட்டு வடிவமும் பாதுகாக்கப்படுகிறது.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: தேவனுடைய கிருபைக்கு
  rationale: அவர்கள் எதற்கு ஒப்புவிக்கப்பட்டார்கள் என்பதைச் சுட்டும் மூலமொழியின் வேற்றுமைப் பொருளையும் இறையியல் நிறையையும் நேரடியாகக் காக்கிறது.
- source_word: εἰς τὸ ἔργον
  choice: பணிக்காக
  rationale: ἔργον என்பதன் பரந்த ‘பணி/வேலை’ பொருளைக் காக்கிறது; ‘ஊழியம்’ அல்லது ‘மிஷன்’ போன்ற கூடுதல் சமய விளக்கங்களைப் புகுத்தவில்லை.
- source_word: ὃ ἐπλήρωσαν
  choice: தாங்கள் நிறைவேற்றிய
  rationale: அவர்கள் அந்தப் பணியை முடிவுக்குக் கொண்டுவந்தார்கள் என்ற பொருளைத் தருகிறது; ‘நிறைவுசெய்த’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பவுலும் பர்னபாவும் முன்பு தேவனுடைய கிருபைக்கு ஒப்புவிக்கப்பட்ட செயலின் தன்மை
  choice: தேவனுடைய கிருபைக்கு ஒப்புவிக்கப்பட்டிருந்ததும்
  alternative: தேவனுடைய கிருபையின் பாதுகாப்பில் ஒப்படைக்கப்பட்டிருந்ததும்
  rationale: மூலவாக்கியத்தின் செயப்பாட்டு அமைப்பையும் தேவகிருபைமேல் சார்ந்திருப்பதையும் காக்கிறது; குறிப்பிட்ட திருச்சபை மரபின் ‘அனுப்புதல்’ அல்லது ‘நியமித்தல்’ கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அங்கிருந்துதான்’ என்பது ὅθεν என்பதிலுள்ள பிறப்பிடப் பொருளைத் தெளிவாகக் காக்கிறது. தொடர்ச்சியான முதல் வாக்கியத்திற்குப் பின் இரண்டாவது வாக்கியம் அமைக்கப்பட்டதால் நீண்ட கிரேக்க வாக்கியம் சாதாரண வாசகர்களுக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
