reference: Acts 14:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: ta
  text: அவர்கள் சீடர்களின் உள்ளங்களை உறுதிப்படுத்தி, விசுவாசத்தில்[a] நிலைத்திருக்கும்படி அவர்களை ஊக்கப்படுத்தி, “பல துன்பங்களின்[b] வழியாக நாம் தேவனுடைய அரசாட்சிக்குள் நுழைய வேண்டும்” என்று கூறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாச நெறியில்.” கிரேக்கத்தில் குறிப்புச்சொல் இருப்பதால், சீடர்கள் ஏற்றுக்கொண்ட விசுவாசத்தைக் குறிப்பாக இது சுட்டலாம்; பொதுவாக விசுவாசம் என்றும் வாசிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பல உபத்திரவங்களின்.” இச்சொல் நெருக்கடி, வேதனை, ஒடுக்குதல் ஆகியவற்றையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: உறுதிப்படுத்தி
  rationale: சீடர்கள் ஏற்கெனவே பெற்றிருந்த உறுதியை மேலும் வலுப்படுத்தும் தொடர்ச்சியான செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὰς ψυχὰς
  choice: உள்ளங்களை
  rationale: இங்கு ψυχή சீடர்களின் அக வாழ்வையும் முழு ஆளுமையையும் குறிக்கிறது; உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ என்ற பொருளைத் தேவையின்றி வலியுறுத்தாமல் அதன் அகநிலை சார்ந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: τῶν μαθητῶν
  choice: சீடர்களின்
  rationale: இயேசுவைப் பின்பற்றிக் கற்றுக்கொள்பவர்களைக் குறிக்கும் நிலைபெற்ற, தெளிவான புதிய ஏற்பாட்டுச் சொல்.
- source_word: παρακαλοῦντες
  choice: ஊக்கப்படுத்தி
  rationale: ஆறுதலும் வலியுறுத்தலும் கலந்த ஆதரவான அறிவுறுத்தலை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐμμένειν
  choice: நிலைத்திருக்கும்படி
  rationale: ஒரு நிலையில் தொடர்ந்து உறுதியாக இருப்பது என்ற வினையின் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: τῇ πίστει
  choice: விசுவாசத்தில்
  rationale: πίστις என்பதன் வழக்கமான பொருளைப் பாதுகாக்கிறது. கிரேக்கக் குறிப்புச்சொல் இதை அவர்கள் ஏற்றுக்கொண்ட விசுவாசத்தைக் குறிக்கும் குறிப்பிட்ட பொருளிலும் வாசிக்க அனுமதிக்கிறது; தமிழில் அந்த இரு நிழற்பொருள்களும் இவ்வடிவில் இயல்பாகத் திறந்திருக்கின்றன.
- source_word: διὰ πολλῶν θλίψεων
  choice: பல துன்பங்களின் வழியாக
  rationale: θλῖψις குறிக்கும் நெருக்கடி, வேதனை, உபத்திரவம் ஆகியவற்றின் தீவிரத்தை பொதுவாகப் புரியும் தமிழில் தருகிறது; διάவின் ‘வழியாக’ என்ற இயக்கத்தையும் பாதுகாக்கிறது.
- source_word: δεῖ
  choice: வேண்டியது அவசியம்
  rationale: கிரேக்கத்தில் உள்ள தவிர்க்க முடியாத அவசியத்தை வலுவாகத் தெரிவிக்கிறது; அந்த அவசியத்தின் இறையியல் காரணத்தை உரை கூறாதபடியால் அதைப் புதிதாகச் சேர்க்கவில்லை.
- source_word: εἰσελθεῖν εἰς
  choice: நுழைய
  rationale: இலக்கை நோக்கி உள்ளே செல்வதை நவீன தமிழில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: இறைவனுடைய அரசாட்சி
  rationale: βασιλεία என்பதில் உள்ள ஆளுகை மற்றும் அரச realm ஆகிய இரு பரிமாணங்களையும் ‘அரசாட்சி’ இயன்றவரை தக்கவைக்கிறது; நிலைபெற்ற இறையியல் கருத்தையும் தெளிவாகத் தருகிறது.
- source_word: ὅτι
  choice: என்று கூறினார்கள்
  rationale: தொடரும் கூற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தனித்த வசனமாக வாசிக்க இயலுமாறு முன் வரும் பன்மைப் பங்கேற்பு வினைகளின் மறைமுக எழுவாயைத் தொடர்ந்து இயல்பான முடிவுவினை அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: τῇ πίστει என்பதிலுள்ள πίστις சொல்லின் பொருள்
  choice: விசுவாசத்தில்
  alternative: விசுவாச நெறியில்
  rationale: குறிப்புச்சொல் ஒரு குறிப்பிட்ட, பகிரப்பட்ட கிறிஸ்தவ விசுவாசத்தைக் சுட்டலாம்; ஆயினும் அதை பிற்காலத்தில் வரையறுக்கப்பட்ட கோட்பாட்டுத் தொகுப்பாக மட்டும் மாற்றாமல், விசுவாசம் என்ற அகன்ற பொருளையும் திறந்தே வைத்திருக்கிறது.
- issue: δεῖ தெரிவிக்கும் அவசியம்
  choice: நாம் … நுழைய வேண்டியது அவசியம்
  alternative: நாம் … நுழைய வேண்டும்
  rationale: உரை துன்பங்களின் வழியாக நுழைவதை அவசியமானதாகக் கூறுகிறது; இது இரட்சிப்புக்கான மனிதத் தகுதி அல்லது துன்பத்தின் மூலம் புண்ணியம் ஈட்டுதல் என்று விளக்கப்படவில்லை.
- issue: βασιλεία τοῦ θεοῦ என்பதன் பரப்பு
  choice: இறைவனுடைய அரசாட்சி
  alternative: இறைவனுடைய அரசு
  rationale: இடம் அல்லது தேசம் என்ற கருத்துக்கு மட்டும் சுருக்காமல், இறைவனின் அரசாளுதலையும் அதற்குரிய ஆட்சிப் பரப்பையும் ஒருங்கே சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உள்ளங்கள்’ என்பது தேவையற்ற உடல்–ஆத்தும இருமையைத் திணிக்காமல் ψυχήயின் அக வாழ்வு சார்ந்த வலிமையைத் தக்கவைக்கிறது. வசனம் தனித்துப் படிக்க இயலுமாறு சூழலில் உள்ள பவுல் மற்றும் பர்னபாவைக் குறிக்கும் ‘அவர்கள்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; கருத்தின் உள்ளடக்கம் மாற்றப்படவில்லை.
