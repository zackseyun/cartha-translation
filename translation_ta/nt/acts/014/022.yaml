    issue: “இறைவனுடைய” is less standard than “தேவனுடைய” for θεός in this biblical context.
    rationale: “தேவனுடைய” is the conventional modern Tamil biblical term and offers a more direct lexical correspondence to τοῦ θεοῦ.
