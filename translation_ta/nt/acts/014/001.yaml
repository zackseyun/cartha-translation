revisions:
- from: இக்கோனியாவில் அவர்கள் இருவரும் ஒன்றாக யூதர்களுடைய தொழுகைக்கூடத்துக்குள்[a] சென்று, யூதர்களும் கிரேக்கர்களுமாகப் பெருந்திரளானோர் நம்பும்படி பேசினார்கள்.
  to: இக்கோனியாவில் அவர்கள் ஒன்றாக யூதர்களுடைய தொழுகைக்கூடத்துக்குள்[a] சென்று அவ்விதமாகப் பேசினார்கள்; அதன் விளைவாக, யூதர்களும் கிரேக்கர்களுமாகப் பெருந்திரளானோர் நம்பினர்.
  rationale: The revision explicitly represents the result force of οὕτως ὥστε ('spoke in such a way that … believed') and changes the verse-level subject from the explicitly dual “இருவரும்” to the source's plural “அவர்கள்.” The synagogue wording and its lexical-alternative footnote are retained.
