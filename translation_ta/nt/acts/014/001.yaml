language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: ta
  text: இக்கோனியாவில் அவர்கள் ஒன்றாக யூதர்களுடைய தொழுகைக்கூடத்துக்குள்[a] சென்று அவ்விதமாகப் பேசினார்கள்; அதன் விளைவாக, யூதர்களும் கிரேக்கர்களுமாகப் பெருந்திரளானோர் நம்பினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதத் தொழுகைக்கூடத்துக்குள்.” கிரேக்க மூலத்தில் சொல்லுக்குச் சொல், “யூதர்களுடைய தொழுகைக்கூடத்துக்குள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்காமல் இயல்பான கதைத் தொடராக அமைத்தல்
  rationale: இந்தச் சொற்றொடர் இங்கு ஒரு நிகழ்வு ‘நடந்தது’ என்பதை வலியுறுத்துவதைவிட கதைத் தொடரை முன்னெடுக்கும் அமைப்பாக உள்ளது. கிரேக்கத்தில் வெளிப்படையான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் தமிழில் அதைப் புதிதாகச் சேர்க்கவில்லை.
- source_word: ἐν Ἰκονίῳ
  choice: இக்கோனியாவில்
  rationale: இடத்தைக் குறிக்கும் சொற்றொடரைத் தெளிவாக மொழிபெயர்த்து, இடப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: κατὰ τὸ αὐτό
  choice: இருவரும் ஒன்றாக
  rationale: பவுலும் பர்னபாவும் இணைந்து செய்த செயலை இச்சொற்றொடர் குறிக்கிறது. ‘இருவரும் ஒன்றாக’ என்பது தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: சென்று
  rationale: கிரேக்கக் கதை அமைப்பிலுள்ள வினையெச்சத்தைத் தமிழின் இயல்பான தொடர்வினையாக மாற்றியுள்ளது; அடுத்துள்ள ‘உள்ளே’ என்ற பொருள் ‘-க்குள்’ என்பதில் வெளிப்படுகிறது.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: யூதர்களுடைய தொழுகைக்கூடத்துக்குள்
  rationale: τῶν Ἰουδαίων என்ற உடைமை வேற்றுமையை வெளிப்படையாகத் தக்கவைத்து, συναγωγή என்பதற்கு பொதுவாசகர்கள் புரிந்துகொள்ளும் ‘தொழுகைக்கூடம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: λαλῆσαι
  choice: பேசினார்கள்
  rationale: இங்கு அப்போஸ்தலர்களின் உரைத்தல் அல்லது அறிவித்தலைக் குறிக்கும் பொதுவான, குறைவாக விளக்கமளிக்கும் மொழிபெயர்ப்பு.
- source_word: οὕτως ὥστε
  choice: நம்பும்படி பேசினார்கள்
  rationale: பேசிய விதத்தையும் அதன் விளைவையும் சுருக்கமாக இணைக்கும் இயல்பான தமிழ் அமைப்பு. இது கட்டளை அல்லது நோக்கத்தை மட்டும் குறிக்காமல், பேச்சின் விளைவாக மக்கள் நம்பியதைச் சூழல் தெளிவாக்குகிறது.
- source_word: πιστεῦσαι
  choice: நம்பும்படி
  rationale: πιστεύω என்பதன் அடிப்படைப் பொருளான ‘நம்பு’ தக்கவைக்கப்பட்டுள்ளது; ‘விசுவாசத்துக்கு வந்தார்கள்’ அல்லது ‘செய்தியை நம்பினார்கள்’ என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: யூதர்களும் கிரேக்கர்களுமாக
  rationale: τε καὶ இணைப்பு இரு குழுக்களையும் ஒன்றாகக் குறிப்பிடுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πολὺ πλῆθος
  choice: பெருந்திரளானோர்
  rationale: மிக அதிகமான மக்களை வலியுறுத்தும் மூலத்தின் பொருளைச் சுருக்கமாகவும் கண்ணியமான நடையிலும் தருகிறது.
theological_decisions:
- issue: மனமாற்றச் சூழலில் πιστεῦσαι என்பதன் பொருள்
  choice: நம்பும்படி
  alternative: விசுவாசத்துக்கு வரும்படி; செய்தியை நம்பும்படி
  rationale: மூலம் அவர்கள் நம்பியதை மட்டும் தெரிவிக்கிறது; நம்பிக்கையின் பொருளை இவ்வசனத்தில் வெளிப்படையாக நிரப்பவில்லை. ஆகவே θεολογிய விளக்கத்தைச் சேர்க்காமல் ‘நம்பு’ என்ற அடிப்படைச் சொல்லைத் தக்கவைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெப ஆலயம்’ போன்ற சமய மரபுசார் சொல்லுக்கு மாறாக ‘தொழுகைக்கூடம்’ தேர்ந்தெடுக்கப்பட்டு, கிரேக்க உடைமை அமைப்பு முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
