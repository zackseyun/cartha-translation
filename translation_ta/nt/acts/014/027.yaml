  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: ta
  text: அவர்கள் வந்து, திருச்சபையைக் கூட்டி, கடவுள் அவர்களோடு செய்த அனைத்தையும், யூதரல்லாத மக்களுக்கு விசுவாசத்தின் கதவை அவர் திறந்ததையும் எடுத்துரைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: அவர்கள் அங்கு வந்து
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கு முன் நிகழ்ந்த வருகையைக் குறிக்கிறது; தமிழில் இயல்பாகவும் சுருக்கமாகவும் இவ்வாறு அமைகிறது.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: திருச்சபையைக் கூட்டி
  rationale: அங்கிருந்த கிறிஸ்தவச் சமூகத்தை ஒன்றுகூட்டிய செயலைத் தெளிவாகக் குறிக்கிறது; ἐκκλησία என்பதற்கு அப்போஸ்தலர் பணிகளில் நிலையான திருச்சபைச் சொல்லாக்கம் பயன்படுத்தப்படுகிறது.
- source_word: ἀνήγγελλον
  choice: எடுத்துரைத்தார்கள்
  rationale: அவர்கள் நடந்தவற்றைச் சபையாரிடம் விரிவாக அறிக்கையிட்ட சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; imperfect வடிவத்தின் தொடர்ச்சியான விவரிப்பு நயத்துக்கும் ஏற்றது.
- source_word: ὅσα
  choice: அனைத்தையும்
  rationale: அவர்கள் அறிவித்த செய்தியின் முழுமையைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: கடவுள் தங்களோடு செய்த அனைத்தையும்
  rationale: μετά என்பதன் நேரடியான ‘உடன்/ஓடு’ பொருளைப் பாதுகாக்கிறது; கடவுளே செயல்படுபவர் என்றும் பவுலும் பர்னபாவும் அவருடைய செயலுடன் இணைந்திருந்தனர் என்றும் கூறுகிறது, ஆனால் ‘அவர்கள் மூலமாக’ என்று கருவித்தன்மையை உறுதிப்படுத்தவில்லை.
- source_word: ἤνοιξεν
  choice: அவர் திறந்ததையும்
  rationale: கடவுள் நிறைவேற்றிய செயலைப் பின்னோக்கி அறிவிக்கும் aorist வடிவத்தைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: τοῖς ἔθνεσιν
  choice: யூதரல்லாதவர்களுக்கு
  rationale: இச்சூழலில் அரசியல் நாடுகளை அல்ல, யூதரல்லாத மக்களைச் சுட்டுகிறது; நவீன வாசகருக்கு உடனடியாகப் புரியும் மொழி.
- source_word: θύραν πίστεως
  choice: விசுவாசத்தின் கதவை
  rationale: மூலத்தின் கதவு உருவகத்தையும் genitive அமைப்பின் திறந்த பொருள் பரப்பையும் சுருக்காமல் பாதுகாக்கிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இங்கு πίστις நம்பிக்கை அல்லது விசுவாசப் பதிலைச் சுட்டுகிறது; ‘விசுவாசம்’ இறையியல் நயத்தையும் தமிழ் கிறிஸ்தவப் பயன்பாட்டையும் தக்கவைக்கிறது.
theological_decisions:
- issue: கடவுளுடைய செயலுடன் μετ’ αὐτῶν குறிப்பிடும் உறவு
  choice: கடவுள் தங்களோடு செய்த
  alternative: கடவுள் தங்கள் மூலமாகச் செய்த / தங்கள் நடுவில் செய்த
  rationale: ‘தங்களோடு’ என்பது μετά என்பதன் நேரடிப் பொருளைப் பாதுகாத்து, அப்போஸ்தலர்களின் கருவித்தன்மையை மொழிபெயர்ப்பே முடிவுசெய்வதைத் தவிர்க்கிறது. கடவுளே வாக்கியத்தின் செய்பவராக இருக்கிறார்.
- issue: ἔθνεσιν என்பதன் சூழல்சார் பொருள்
  choice: யூதரல்லாதவர்களுக்கு
  alternative: பிற இனத்தாருக்கு / நாடுகளுக்கு
  rationale: அப்போஸ்தலர் பணிகளின் இக்கதைச் சூழலில் யூதர்–யூதரல்லாதவர் வேறுபாடே முன்னிலையில் உள்ளது; நவீன நாடுகளைப் பற்றிய புவியரசியல் பொருள் அல்ல.
- issue: θύραν πίστεως என்ற உருவகத்தின் பொருள்
  choice: விசுவாசத்தின் கதவு
  alternative: விசுவாசிப்பதற்கான கதவு
  rationale: மூலத்தின் genitive அமைப்பு விசுவாசத்திற்கான வாய்ப்பு, விசுவாசத்துக்குள் நுழைவு ஆகிய நயங்களைத் தாங்கக்கூடும்; முதன்மை உரை அதை ஒரே விளக்கமாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘புறவினத்தார்’ என்ற மரபுச் சொல் தவிர்க்கப்பட்டு தெளிவான ‘யூதரல்லாதவர்கள்’ முதன்மை உரையில் தரப்பட்டுள்ளது; ‘திருச்சபை’, ‘விசுவாசம்’ ஆகிய பரவலாக அறியப்பட்ட இறையியல் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
