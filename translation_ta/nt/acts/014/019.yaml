revisions:
- from: ஆனால் அந்தியோகியாவிலிருந்தும் இக்கோனியாவிலிருந்தும் யூதர்கள் வந்து, மக்கள் கூட்டங்களைத் தங்கள் பக்கம் இணங்கச் செய்தார்கள். பின்னர் பவுலைக் கல்லெறிந்து, அவர் இறந்துவிட்டார் என்று எண்ணி, நகரத்திற்கு வெளியே இழுத்துச் சென்றார்கள்.[a]
