source:
  edition: SBLGNT
  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: ta
  text: ஆனால் அந்தியோகியாவிலிருந்தும் இக்கோனியாவிலிருந்தும் யூதர்கள் வந்து, மக்கள் கூட்டங்களை இணங்கச் செய்து, பவுலைக் கல்லெறிந்து, அவர் இறந்துவிட்டார் என்று எண்ணி, அவரை நகரத்துக்கு வெளியே இழுத்துச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் இறந்துபோயிருந்தார் என்று கருதி.” கிரேக்க உரை தாக்கியவர்களின் ஊகத்தையே கூறுகிறது; பவுல் உண்மையில் இறந்தார் என்று வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν
  choice: வந்து
  rationale: பகைமை கொண்டவர்கள் வேறு நகரங்களிலிருந்து வந்து சேர்ந்ததை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய சாதகமான நிகழ்விலிருந்து எதிர்மறையான திருப்பத்தைச் சுட்டும் மென்மையான எதிர்மறைப் பொருளைப் பாதுகாக்கிறது.
- source_word: Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: இங்கு யூதேயா நாட்டவர்களை மட்டும் அல்லாமல் யூத மக்களை, குறிப்பாக எதிர்த்தவர்களை, குறிக்கும் சூழலுக்கு நேரடியான சமகாலத் தமிழ் சொல்.
- source_word: πείσαντες τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களைத் தங்கள் பக்கம் இணங்கச் செய்தார்கள்
  rationale: πείθω என்பதன் இணங்க வைக்கும் பொருளையும், ὄχλους என்பதன் பன்மையையும் இயல்பாகத் தருகிறது; அவர்களை வெறுமனே ஒரு உண்மையை நம்பச் செய்தார்கள் என்பதைக் காட்டிலும் எதிர்ப்புக்குத் தங்கள் பக்கம் திருப்பிய சூழலை வெளிப்படுத்துகிறது.
- source_word: λιθάσαντες
  choice: பவுலைக் கல்லெறிந்து
  rationale: கற்களால் தாக்கிய வன்முறைச் செயலைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது; தொடரில் இழுத்துச் செல்வதற்கு முந்தைய செயலாக அமைந்துள்ளது.
- source_word: ἔσυρον
  choice: இழுத்துச் சென்றார்கள்
  rationale: σύρω குறிக்கும் வலுக்கட்டாயமான இழுத்தலைத் தெளிவாகக் காட்டுகிறது; இலக்கான நகரத்திற்கு வெளியேயும் இயல்பாக இணைகிறது.
- source_word: ἔξω τῆς πόλεως
  choice: நகரத்திற்கு வெளியே
  rationale: இழுத்துச் சென்று அடைந்த இடத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: νομίζοντες
  choice: என்று எண்ணி
  rationale: இது தாக்கியவர்களின் ஊகம் என்பதைத் தெளிவாக்கி, உறுதியான உண்மை என்று கூறுவதைத் தவிர்க்கிறது.
- source_word: τεθνηκέναι
  choice: அவர் இறந்துவிட்டார்
  rationale: Perfect infinitive சுட்டும் இறப்பின் விளைவு நிலையை இயல்பான தமிழில் தருகிறது; இது νομίζοντες என்பதற்குள் இருப்பதால் அவர்களின் எண்ணமாக மட்டுமே கூறப்படுகிறது.
theological_decisions:
- issue: பவுல் உண்மையில் இறந்தாரா, அல்லது தாக்கியவர்கள் அவர் இறந்ததாக எண்ணினார்களா
  choice: 'முதன்மை உரை தாக்கியவர்களின் எண்ணத்தை மட்டுமே கூறுகிறது: “அவர் இறந்துவிட்டார் என்று எண்ணி.”'
  alternative: பவுல் உண்மையில் இறந்து பின்னர் உயிர்பெற்றார் என்று சிலர் ஊகிக்கலாம்.
  rationale: νομίζοντες αὐτὸν τεθνηκέναι என்பது பவுலின் மரணத்தை நிகழ்வாக அறிவிக்காமல், எதிரிகளின் ஊகத்தையே இலக்கண ரீதியாகத் தெரிவிக்கிறது. ஆகவே உரை கூறாத உறுதியை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்கப் பங்கேற்புச் சங்கிலி தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், வருகை, கூட்டங்களை இணங்கச் செய்தல், கல்லெறிதல், இறந்ததாக எண்ணுதல், வெளியே இழுத்துச் செல்லுதல் என்ற நிகழ்ச்சித் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
