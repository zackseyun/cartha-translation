  rationale: 'The revision removes the unstated phrase “தங்கள் பக்கம்,” while retaining the natural sense that the crowds were persuaded. It also keeps the narrative actions in one coordinated Tamil sequence and preserves the source text’s deliberate limitation: the attackers believed Paul to be dead, but the verse does not directly state that he died.'
