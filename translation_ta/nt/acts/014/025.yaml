  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: ta
  text: மேலும், அவர்கள் பெர்கேயில் வார்த்தையைப் பேசிய பின்பு, அத்தாலியாவுக்கு இறங்கிச் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλήσαντες
  choice: பேசிய பின்பு
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது. நவீன தமிழில் ‘பேசிய பின்பு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது; ‘அறிவித்த பின்பு’ என்பது மூலத்தில் உள்ள λαλέω-வைவிட வலுவான பிரசங்க நுட்பத்தைச் சேர்க்கக்கூடும்.
- source_word: τὸν λόγον
  choice: இறைவார்த்தையை
  rationale: இங்கு λόγος என்பது அறிவிக்கப்பட்ட கிறிஸ்தவ நற்செய்தியைக் குறிக்கும் லூக்காவின் வழக்குச் சொற்றொடர். ‘இறைவார்த்தை’ அந்த நிலைபெற்ற வேதாகமப் பொருளை இயல்பான தமிழில் தருகிறது; ஆயினும் கிரேக்கத்தில் ‘ஆண்டவருடைய’ என்ற விரிவாக்கம் இல்லை.
- source_word: ἐν Πέργῃ
  choice: பெர்கேயில்
  rationale: ἐν + நகரப்பெயர் இருப்பிடத்தைக் குறிக்கிறது; தமிழில் இடவேற்றுமை உருபுடன் ‘பெர்கேயில்’ என்பது நேர்த்தியான வடிவம்.
- source_word: κατέβησαν
  choice: இறங்கிச் சென்றார்கள்
  rationale: καταβαίνω என்பதன் கீழ்நோக்கிய பயணப் பொருளைத் தக்கவைக்கிறது. உள்நாட்டிலுள்ள பெர்கேயிலிருந்து கடற்கரை அத்தாலியாவுக்குச் சென்ற நிலவியல் இயக்கத்துக்கும் இது பொருந்துகிறது.
- source_word: εἰς Ἀττάλειαν
  choice: அத்தாலியாவுக்கு
  rationale: εἰς இங்கு பயண இலக்கைக் குறிக்கிறது; நகரப்பெயருடன் தமிழில் ‘-க்கு’ இயல்பான இலக்கு வடிவம்.
- source_word: καὶ
  choice: '[தனி இணைப்புச் சொல் சேர்க்கப்படவில்லை]'
  rationale: καί பயண விவரத்தைத் தொடர்கிறது. தமிழ் வாக்கியத்தில் முந்தைய சூழலுடன் தொடர்ச்சி இயல்பாகப் புரிவதால் தொடக்கத்தில் ‘மேலும்’ அல்லது ‘பின்னர்’ சேர்ப்பது தேவையில்லை; ‘பின்பு’ என்ற காலத் தொடர்பு வினையெச்சத்திலேயே வெளிப்படுகிறது.
theological_decisions:
- issue: τὸν λόγον என்பதிலுள்ள λόγος-ன் குறிப்புப் பொருள்
  choice: இறைவார்த்தை
  alternative: செய்தி / வார்த்தை
  rationale: சூழலில் இது அவர்கள் அறிவித்த கடவுளின் செய்தியைக் குறிக்கிறது. ‘இறைவார்த்தை’ தமிழில் நிலைபெற்ற, புரியத்தக்க சொல்; ‘ஆண்டவருடைய வார்த்தை’ என்று மொழிபெயர்த்தால் மூலத்தில் இல்லாத உரிச்சொற்றொடர் சேர்க்கப்படும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரை. இடப்பெயர்கள் ‘பெர்கே’, ‘அத்தாலியா’ என கிரேக்க உச்சரிப்பை அணுகும் தமிழாக்கத்தில் தரப்பட்டுள்ளன. வசனத்தின் எளிய பயண-விவர நடையும், செயல்வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
