  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: ta
  text: பவுல் செய்ததை மக்கள் கூட்டத்தினர் கண்டபோது, தங்கள் குரலை உயர்த்தி, லிக்கவோனிய மொழியில், “தெய்வங்கள் மனிதர்களைப் போன்றவர்களாகி[a] நம்மிடம் இறங்கி வந்திருக்கிறார்கள்!” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதர்களைப் போன்றவர்களாக்கப்பட்டு.”
    reason: ὁμοιωθέντες என்பது இலக்கண வடிவில் செயலப்பாட்டு வினையெச்சம்; சூழலில் அது ‘மனிதர்களைப் போன்றவர்களாகி’ என்ற நடுநிலைப் பொருளிலும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: மக்கள் கூட்டத்தினர் கண்டபோது
  rationale: τέ தொடர்ச்சியைக் குறிக்கிறது; இறந்தகால வினையெச்சமான ἰδόντες பிரதான செயலுக்கான காலச் சூழலைக் காட்டுகிறது. ‘கண்டபோது’ என்பது இயல்பான நவீனத் தமிழ்; ὄχλοι என்பதன் கூட்டுப் பன்மையை ‘மக்கள் கூட்டத்தினர்’ வெளிப்படுத்துகிறது.
- source_word: ὃ ἐποίησεν Παῦλος
  choice: பவுல் செய்ததை
  rationale: உடனே முன்பு நிகழ்ந்த அற்புதச் செயலைக் குறிக்கும் தொடர்புச் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; கிரேக்கத்தில் உள்ளதைவிட அதிகமான விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: தங்கள் குரலை உயர்த்தி
  rationale: சத்தமாகக் குரலெழுப்புதல் என்ற மரபுத்தொடரின் பொருளைக் காக்கும்போதே, ‘குரலை உயர்த்துதல்’ என்ற மூல உருவகத்தையும் தக்கவைக்கிறது.
- source_word: Λυκαονιστί
  choice: லிக்கவோனிய மொழியில்
  rationale: லிக்கவோனியரின் மொழியில் பேசினார்கள் என்ற வினையடையின் பொருளை இன்றைய வாசகருக்குத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Οἱ θεοὶ
  choice: தெய்வங்கள்
  rationale: இங்கு கூட்டத்தாரின் பலதெய்வ நம்பிக்கையிலுள்ள தெய்வங்களே குறிக்கப்படுகின்றன. ‘தெய்வங்கள்’ பன்மையைத் தெளிவாகவும் மதிப்பீடு சேர்க்காமலும் தருகிறது.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: மனிதர்களைப் போன்றவர்களாகி
  rationale: ὁμοιόω என்பதன் இறந்தகாலப் பன்மை வினையெச்சம் மனிதர்களோடு ஒப்புமையடைவதைச் சொல்கிறது. இந்தத் தமிழ் வடிவம் ஒப்புமையையும் முன்னதாக நிகழ்ந்த நிலைமாற்றத்தையும் இயல்பாகக் காக்கிறது; கிரேக்கச் செயலப்பாட்டு வடிவம் அடிக்குறிப்பில் காட்டப்படுகிறது.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: நம்மிடம் இறங்கி வந்திருக்கிறார்கள்
  rationale: καταβαίνω என்பதன் கீழிறங்கி வருதல் என்ற திசைப் பொருளைத் தக்கவைக்கிறது. நேரடி உரையில் ‘வந்திருக்கிறார்கள்’ என்பது கூட்டத்தாரின் பரபரப்பான, நிகழ்காலத் தொடர்புள்ள அறிவிப்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: லிஸ்திரா மக்களின் பலதெய்வ விளக்கத்தை கிறிஸ்தவ அவதாரக் கோட்பாடாக மாற்றாமல் மொழிபெயர்த்தல்
  choice: தெய்வங்கள் மனிதர்களைப் போன்றவர்களாகி நம்மிடம் இறங்கி வந்திருக்கிறார்கள்
  alternative: தெய்வங்கள் மனித உருவில் நம்மிடம் இறங்கி வந்திருக்கிறார்கள்
  rationale: வசனம் கூட்டத்தாரின் தவறான பலதெய்வப் புரிதலைப் பதிவு செய்கிறது. ‘மனிதர்களைப் போன்றவர்களாகி’ என்பது ὁμοιωθέντες என்பதிலுள்ள ஒப்புமையையும் நிலைமாற்றத்தையும் காக்கிறது; ‘மனித உருவில்’ என்று கூறி குறிப்பிட்ட அவதாரக் கருத்தை உரையில் அதிகமாகச் சேர்ப்பதில்லை.
