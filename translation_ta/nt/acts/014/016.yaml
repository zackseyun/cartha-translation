source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: ta
  text: கடந்த தலைமுறைகளில், எல்லா மக்களினங்களையும் தங்கள் வழிகளில் நடக்க அவர் அனுமதித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிற இனத்தார் அனைவரையும் தங்கள் வழிகளில் செல்ல அவர் அனுமதித்தார்.”
    reason: ἔθνη என்பதற்கு ‘மக்களினங்கள்’ அல்லது ‘பிற இனத்தார்’ என்றும், πορεύεσθαι என்பதற்கு ‘நடக்க’ அல்லது ‘செல்ல’ என்றும் இச்சூழலில் மொழிபெயர்க்க இயலும்.
lexical_decisions:
- source_word: ὃς
  choice: அவர்
  rationale: இது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட உயிருள்ள கடவுளைக் குறிக்கும் தொடர்புப்பெயர். தமிழில் தனி வசனமாக இயல்பாக அமைய, ‘அவர்’ எனத் தொடரப்பட்டுள்ளது.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: கடந்த காலத் தலைமுறைகளில்
  rationale: கடந்துபோன மனிதத் தலைமுறைகள் என்ற காலப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: εἴασεν
  choice: அனுமதித்தார்
  rationale: இச்சொல் அனுமதித்தல் அல்லது தடுக்காமல் விடுதல் என்பதைக் குறிக்கிறது; அங்கீகரித்தார் என்ற பொருளைச் சேர்ப்பதில்லை.
- source_word: πάντα τὰ ἔθνη
  choice: எல்லா மக்களினங்களும்
  rationale: ἔθνη என்பதன் மக்கள்-குழு சார்ந்த விரிவான பொருளைப் பாதுகாக்கிறது. ‘பிற இனத்தார்’ என்பதும் சாத்தியம்; ஆனால் அது யூதர்/யூதரல்லாதவர் என்ற வேறுபாட்டை அதிகமாக முன்னிறுத்தலாம்.
- source_word: πορεύεσθαι
  choice: நடக்க
  rationale: அடிப்படையில் ‘செல்ல’ என்று பொருள்படும் இச்சொல், ‘வழிகள்’ என்பதுடன் சேர்ந்து வாழ்க்கை நடத்தையை உருவகமாகக் குறிக்கிறது. ‘நடக்க’ என்பது அந்த உருவகத்தையும் வேதாகம மொழிநயத்தையும் காக்கிறது.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: தங்கள் சொந்த வழிகளில்
  rationale: அந்த மக்களினங்களுக்குரிய வழிகள் என்ற உடைமைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, அவரவர் தேர்ந்தெடுத்த வாழ்க்கை நெறிகளைக் குறிக்கும் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுளின் அனுமதிப்பா அல்லது அங்கீகாரமா
  choice: மக்களினங்கள் தங்கள் வழிகளில் நடக்கக் கடவுள் அனுமதித்தார்
  alternative: அவர்களின் வழிகளைக் கடவுள் அங்கீகரித்தார் அல்லது அவற்றை அவரே நிர்ணயித்தார்
  rationale: εἴασεν என்பது அனுமதித்தலைக் குறிக்கிறது; ஒழுக்க அங்கீகாரத்தையோ நேரடியாக நிர்ணயித்தலையோ கூறவில்லை. கடவுளின் ஆளுகைக்கும் மனிதப் பொறுப்புக்கும் இடையிலான உரையின் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் மதிப்புமிக்க நடையிலும் வடிவமைக்கப்பட்டுள்ளது. ‘தங்கள் சொந்த வழிகளில் நடக்க’ என்பது மூலத்தின் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
