base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: ta
  text: ஆனால், அப்போஸ்தலர்களான பர்னபாவும் பவுலும் இதைக் கேட்டபோது, தங்கள் ஆடைகளைக் கிழித்துக்கொண்டு[a] கூட்டத்திற்குள் விரைந்து சென்று, உரத்த குரலில் கூவினார்கள்:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆடைகளைக் கிழிப்பது துயரம், திகில், அல்லது இறைநிந்தையான மரியாதைக்கு எதிர்ப்பு ஆகியவற்றைக் காட்டும் வழக்கமான அடையாளமாக இருந்தது.
    reason: cultural_note
  - marker: b
    text: ‘கூட்டத்திற்குள் பாய்ந்து சென்று, கூவினார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: இதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலச்சார்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முந்தைய நிகழ்வைச் சுட்டுவதற்காகத் தேவையான ‘இதை’ சூழலிலிருந்து வழங்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: மக்களின் செயலைத் தொடர்ந்து அப்போஸ்தலர்களின் எதிர்வினையில் ஏற்படும் மிதமான முரண்பாட்டையும் உரைத் திருப்பத்தையும் காட்டுகிறது.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: அப்போஸ்தலர்களான பர்னபாவும் பவுலும்
  rationale: கிரேக்க இணைப்புரை பர்னபாவையும் பவுலையும் அப்போஸ்தலர்கள் என்று நேரடியாக அடையாளப்படுத்துவதை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: தங்கள் ஆடைகளைக் கிழித்துக்கொண்டு
  rationale: துயரம், திகில் அல்லது எதிர்ப்பை வெளிப்படுத்தும் பண்பாட்டு செயலை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐξεπήδησαν
  choice: விரைந்து சென்று
  rationale: திடீரான, வலிமையான இயக்கத்தையும் அவசரத்தையும் நவீன தமிழில் தெரிவிக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘வெளியே’ என்ற இடக்கருத்தைச் சேர்க்கவில்லை.
- source_word: εἰς τὸν ὄχλον
  choice: கூட்டத்திற்குள்
  rationale: εἰς குறிக்கும் கூட்டத்தின் உள்ளே நோக்கிய இயக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: κράζοντες
  choice: உரத்த குரலில் கூவினார்கள்
  rationale: தொடர்ந்து உடன்நிகழும் சத்தமான பேச்சின் தீவிரத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; அதன் உள்ளடக்கம் அடுத்த வசனத்தில் வருவதால் இங்கே சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ‘அப்போஸ்தலர்கள்’ என்பது பர்னபாவையும் பவுலையும் குறித்தல்
  choice: ‘அப்போஸ்தலர்களான பர்னபாவும் பவுலும்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘அப்போஸ்தலர்கள்’ என்பதை பன்னிருவருக்கு மட்டும் உரிய பட்டமாகக் கருதி வேறு சொல்லைப் பயன்படுத்துதல்
  rationale: இவ்விடத்தில் கிரேக்க உரை பர்னபாவையும் பவுலையும் ‘அப்போஸ்தலர்கள்’ என்று இணைப்புரையாக அடையாளப்படுத்துகிறது. பிற்காலக் கோட்பாட்டு வரையறையை உரைக்குள் திணிக்காமல் அதையே பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலர்களான’ என்பது கிரேக்க இணைப்புரையைத் தெளிவாகக் காக்கிறது; ‘கூட்டத்திற்குள் விரைந்து சென்று’ என்பது இயக்கத்தின் அவசரத்தைக் காட்டி, மூலத்தில் வெளிப்படையாக இல்லாத ‘வெளியே’ என்பதைத் தவிர்க்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
