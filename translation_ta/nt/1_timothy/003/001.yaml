id: 1TI.3.1
reference: 1 Timothy 3:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: ta
  text: 'இந்தக் கூற்று நம்பத்தகுந்தது: ஒருவர் மேற்பார்வைப் பொறுப்பை[a] நாடினால், அவர் ஒரு நல்ல பணியை[b] விரும்புகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கண்காணிப்பாளரின் பதவியை’; மரபுவழியாக, ‘ஆயர் பதவியை’.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘ஓர் உயரிய பணியை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: இந்தக் கூற்று நம்பத்தகுந்தது
  rationale: மேய்ப்புப் பத்திரங்களில் நம்பத்தகுந்த ஓர் உரையை அறிமுகப்படுத்தும் சூத்திரமாக இச்சொற்றொடர் வருகிறது. இங்கு λόγος என்பதற்கு இயல்பான தமிழில் ‘கூற்று’ என்றும், πιστός என்பதற்கு ‘நம்பத்தகுந்தது’ என்றும் மொழிபெயர்ப்பது பொருத்தமானது.
- source_word: εἴ τις
  choice: ஒருவர் … நாடினால்
  rationale: τις என்பது ‘யாராவது/ஒருவர்’ என்ற பொதுப்பொருளுடைய சுட்டாப் பெயர். இந்தச் சொற்றொடரிலேயே ஆண்களுக்கு மட்டும் உரிய கட்டுப்பாட்டைச் சேர்க்காமல் ‘ஒருவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐπισκοπῆς
  choice: மேற்பார்வைப் பொறுப்பை
  rationale: ἐπισκοπή என்பது கண்காணித்தல், மேற்பார்வை செய்தல் அல்லது அதனுடன் தொடர்புடைய பொறுப்பைக் குறிக்கலாம். ‘மேற்பார்வைப் பொறுப்பு’ என்பது பிற்காலத் திருச்சபை நிர்வாகப் பதவிப் பெயரை உரைக்குள் திணிக்காமல், இயல்பான தமிழில் அதன் பணி சார்ந்த பொருளைக் காட்டுகிறது.
- source_word: ὀρέγεται
  choice: நாடினால்
  rationale: ὀρέγομαι என்பது ஒன்றை நோக்கி எட்டுதல் என்ற அடிப்படையிலிருந்து, அதை அடைய விரும்புதல் அல்லது நாடுதல் என்ற பொருளைக் கொண்டது. ‘நாடுதல்’ அந்த நோக்கமுள்ள விருப்பத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: καλοῦ ἔργου
  choice: ஒரு நல்ல பணியை
  rationale: καλός என்பது நல்ல, உயரிய, மதிப்புக்குரிய என்னும் பொருள்களையும், ἔργον செயல் அல்லது பணி என்னும் பொருளையும் கொண்டது. ‘நல்ல பணி’ என்பது பதவி அல்லது அந்தஸ்தை விடச் செய்யப்படும் பணியை வலியுறுத்துகிறது.
- source_word: ἐπιθυμεῖ
  choice: விரும்புகிறார்
  rationale: ἐπιθυμέω என்பது விரும்புதல் அல்லது ஆவல்கொள்ளுதல். இங்கு நேர்மறையான சூழலில் அளவுக்கு மீறிய தீவிரத்தைச் சேர்க்காமல் ‘விரும்புகிறார்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἐπισκοπῆς என்பதைப் பிற்காலத் திருச்சபைப் பதவிச் சொல்லால் மொழிபெயர்க்க வேண்டுமா
  choice: மேற்பார்வைப் பொறுப்பு
  alternative: கண்காணிப்பாளரின் பதவி; ஆயர் பதவி
  rationale: இச்சொல் மேற்பார்வை செய்யும் பணி அல்லது பொறுப்பைக் குறிக்கிறது; பிற்காலத்தில் நிலைபெற்ற குறிப்பிட்ட திருச்சபை ஆட்சிமுறையை அவசியமாகக் குறிக்காது. ஆகவே மூலத்தின் பொருள் விரிவையும் திருச்சபை நிர்வாகம் குறித்த மெய்யியல் பதற்றத்தையும் திறந்த நிலையில் வைத்திருக்கிறது.
- issue: εἴ τις என்பதை ஆண்பாலுக்கே உரியதாக மொழிபெயர்க்க வேண்டுமா
  choice: ஒருவர்
  alternative: ஒரு ஆண்
  rationale: τις என்னும் சுட்டாப் பெயர் இங்கு பொதுப்பொருளுடையது. அடுத்த வசனங்களின் தகுதிகள் குறித்த விளக்கத்தை முன்னரே இந்தச் சொல்லுக்குள் கொண்டுவராமல், இந்நிபந்தனை வாக்கியம் மூலத்தில் உள்ளபடியே பொதுவாக வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘கூற்று’, ‘மேற்பார்வைப் பொறுப்பு’, ‘நல்ல பணி’ ஆகிய சொற்கள் சாதாரண வாசகருக்குப் புரியுமாறும், பிற்காலச் சமயப் பதவிமுறைகளை மூலவசனத்தில் தேவையின்றி புகுத்தாதவாறும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
