  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: ta
  text: அவ்வாறே, திருத்தொண்டர்கள் மதிப்புக்குரியவர்களாகவும், இரட்டை பேச்சுப் பேசாதவர்களாகவும்[a], மிகுந்த திராட்சைமதுவில் நாட்டம் கொள்ளாதவர்களாகவும்[b], தகாத ஆதாயத்துக்கு ஆசைப்படாதவர்களாகவும்[c] இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருவரிடம் ஒன்றையும் மற்றொருவரிடம் வேறொன்றையும் சொல்லாதவர்களாக.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மிகுந்த திராட்சைமதுவுக்கு அடிமையாகாதவர்களாக.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘தகாத ஆதாயத்தை நாடாதவர்களாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: திருத்தொண்டர்கள்
  rationale: முந்தைய வசனங்களில் வரும் கண்காணிகளுக்கான தகுதிப் பட்டியலைத் தொடர்ந்து, சபையில் அங்கீகரிக்கப்பட்ட ஒரு பணிப்பொறுப்பைக் குறிக்கிறது. பொதுவான ‘ஊழியர்கள்’ அல்லது ‘பணியாளர்கள்’ என்பதைக் காட்டிலும் ‘திருத்தொண்டர்கள்’ சூழலின் பதவிசார் தன்மையைப் பாதுகாக்கிறது.
- source_word: ὡσαύτως
  choice: அவ்வாறே
  rationale: முந்தைய கண்காணிகளுக்கான தகுதிகளோடு தொடர்ச்சியைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: σεμνούς
  choice: மதிப்புக்குரியவர்களாக
  rationale: கடுமையான முகபாவத்தையோ சோகமான தீவிரத்தையோ உணர்த்தாமல், கண்ணியமும் மரியாதைக்குரிய நடத்தையும் வெளிப்படுத்துகிறது.
- source_word: μὴ διλόγους
  choice: இரட்டை நாவு பேசாதவர்களாக
  rationale: ‘இரண்டு விதமாகப் பேசுதல்’ என்ற கிரேக்க மொழிப்படிமத்தைத் தக்கவைத்து, பேச்சில் நேர்மையின்மையையும் ஆளுக்கேற்ப முரண்படப் பேசுவதையும் உணர்த்துகிறது.
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: மிகுந்த திராட்சைமதுவில் நாட்டம் கொள்ளாதவர்களாக
  rationale: προσέχω என்பதன் தொடர்ச்சியான பற்றுதல் அல்லது ஈடுபாடு என்ற பொருளை வெளிப்படுத்துகிறது; நவீன மருத்துவ வகைப்பாட்டைத் திணிக்காமல் πολλῷ என்பதையும் ‘மிகுந்த’ என்று பாதுகாக்கிறது.
- source_word: μὴ αἰσχροκερδεῖς
  choice: இழிவான ஆதாயத்துக்கு ஆசைப்படாதவர்களாக
  rationale: தகாத அல்லது அவமானகரமான முறையில் கிடைக்கும் லாபத்தின் மீதான பேராசையை, கிரேக்கச் சொல்லின் நெறிசார் வலிமையோடு இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: διάκονος என்பதற்கான சபைப் பணிப்பொறுப்புச் சொல்
  choice: ‘திருத்தொண்டர்கள்’ எனப் பணிப்பொறுப்பைக் குறிக்கும் சொல்லாக மொழிபெயர்த்தல்
  alternative: ‘பணியாளர்கள்’ அல்லது ‘ஊழியர்கள்’
  rationale: கண்காணிகளைத் தொடர்ந்து மற்றொரு அங்கீகரிக்கப்பட்ட சபைப் பொறுப்பில் இருப்பவர்களின் தகுதிகளைப் பவுல் பட்டியலிடுகிறார். ‘திருத்தொண்டர்கள்’ என்பது பிற்காலப் பிரிவுசார் அமைப்புகளைத் தேவையின்றி புகுத்தாமல், இச்சூழலின் நிறுவனத் தன்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சபை வாசிப்புக்கு ஏற்ற கண்ணியமான நடையும் சாதாரண வாசகருக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கப் பட்டியலின் இணை அமைப்பு ‘...வர்களாகவும்’ என்ற தொடரால் பாதுகாக்கப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும் தமிழில் வாக்கியம் நிறைவடைய ‘இருக்க வேண்டும்’ சேர்க்கப்பட்டுள்ளது.
