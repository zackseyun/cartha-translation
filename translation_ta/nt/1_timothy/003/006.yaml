  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: ta
  text: அவர் புதிதாக விசுவாசத்திற்கு வந்தவராக இருக்கக்கூடாது; இல்லையென்றால், தற்பெருமையால் வீங்கிப்போய், பிசாசின் நியாயத்தீர்ப்பில் விழுந்துவிடுவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிசாசுக்குக் கிடைத்த அதே தண்டனைத் தீர்ப்புக்கு உள்ளாவார்’; வேறொரு பொருளில், ‘பிசாசுடன் தொடர்புடைய நியாயத்தீர்ப்புக்கு உள்ளாவார்.’
    reason: மூலமொழியில் ‘பிசாசின்’ என்ற உரிமைவேற்றுமைத் தொடருக்கு ஒன்றுக்கு மேற்பட்ட பொருள் வாய்ப்புகள் உள்ளன.
lexical_decisions:
- source_word: νεόφυτον
  choice: புதிதாக விசுவாசத்திற்கு வந்தவர்
  rationale: சொல்லின் நேரடிப் பொருள் ‘புதிதாக நடப்பட்டவர்.’ இங்கு அது கிறிஸ்தவ விசுவாசத்திற்கு அண்மையில் வந்தவரை உருவகமாகக் குறிக்கிறது; நவீன தமிழில் இத்தேர்வு அந்தச் சபைச் சூழலைத் தெளிவாக உணர்த்துகிறது.
- source_word: τυφωθεὶς
  choice: தற்பெருமையால் வீங்கிப்போய்
  rationale: தற்பெருமையால் செருக்கடைவதைக் குறிக்கும் உருவகத்தை இது இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: κρίμα
  choice: நியாயத்தீர்ப்பு
  rationale: இச்சொல் ‘தீர்ப்பு’ அல்லது ‘தண்டனைத் தீர்ப்பு’ எனப் பொருள்படலாம். ‘நியாயத்தீர்ப்பு’ என்பது மூலத்தின் பரந்த பொருளையும் அடுத்துவரும் மரபுத்தொடரின் தெளிவின்மையையும் காக்கிறது.
- source_word: τοῦ διαβόλου
  choice: பிசாசின்
  rationale: இந்த உரிமைவேற்றுமை பிசாசுக்குக் கிடைத்த தீர்ப்பையோ பிசாசுடன் தொடர்புடைய தீர்ப்பையோ குறிக்கக்கூடும். நேரடியான இத்தேர்வு அந்த உண்மையான இருபொருள் வாய்ப்பைத் தீர்மானித்துவிடாமல் பாதுகாக்கிறது.
- source_word: ἐμπέσῃ
  choice: விழுந்துவிடுவார்
  rationale: ஆபத்தான நிலைக்குள் விழும் மூலமொழி உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἵνα μὴ
  choice: இல்லையென்றால் … விழுந்துவிடுவார்
  rationale: தகுதிநிபந்தனையை மீறுவதால் ஏற்படக்கூடிய எச்சரிக்கப்பட்ட விளைவை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου என்ற தொடரின் பொருள்
  choice: ‘பிசாசின் நியாயத்தீர்ப்பில் விழுந்துவிடுவார்’ என்று இருபொருள் வாய்ப்புடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பிசாசுக்குக் கிடைத்த அதே தண்டனைத் தீர்ப்புக்கு உள்ளாவார்’ அல்லது ‘பிசாசுடன் தொடர்புடைய நியாயத்தீர்ப்புக்கு உள்ளாவார்.’
  rationale: τοῦ διαβόλου என்ற உரிமைவேற்றுமை பிசாசின்மீது வந்த தீர்ப்பைக் குறிக்கிறதா அல்லது பிசாசுடன் வேறுவகையில் தொடர்புடைய தீர்ப்பைக் குறிக்கிறதா என்பது கிரேக்கத்தில் தெளிவாகத் தீர்மானிக்கப்படவில்லை. ஆகவே பிரதான உரை இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சபைத் தலைமைக்கான அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ‘வீங்கிப்போதல்’ மற்றும் ‘விழுதல்’ ஆகிய உருவகங்கள் இயன்றவரை காக்கப்பட்டுள்ளன.
