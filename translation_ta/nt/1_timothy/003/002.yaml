source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: ta
  text: ஆகவே, கண்காணிப்பாளர் குற்றம் சாட்ட இடமில்லாதவராகவும், ஒரே மனைவியின் கணவராகவும்[a], நிதானமுள்ளவராகவும், தன்னடக்கமுள்ளவராகவும், மதிப்புக்குரியவராகவும், விருந்தோம்புகிறவராகவும், கற்பிக்கத் திறனுள்ளவராகவும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே பெண்ணுக்குரிய ஆண்.” இந்தச் சொற்றொடர் திருமண நிலையை மட்டும் அல்லாமல், திருமண உண்மைத்தன்மையையும் வலியுறுத்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: இருக்க வேண்டும்
  rationale: இது வெறும் அறிவுரையல்ல, தகுதிக்கான கட்டாயத் தேவையைக் குறிக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையிலிருந்து வரும் முடிவுசார் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπίσκοπον
  choice: கண்காணிப்பாளர்
  rationale: பிற்காலத் திருச்சபைப் பதவிப் பெயரை இறக்குமதி செய்யாமல், கிரேக்கச் சொல்லின் மேற்பார்வை செய்யும் பொருளை நேரடியாகத் தருகிறது.
- source_word: ἀνεπίλημπτον
  choice: குற்றஞ்சாட்ட இடமில்லாதவர்
  rationale: பாவமற்ற முழுநிறைவைச் சுட்டாமல், நியாயமான குற்றச்சாட்டு நிலைநிற்காத நல்லொழுக்கப் பண்பைத் தெரிவிக்கிறது.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: ஒரே மனைவியின் கணவர்
  rationale: கிரேக்கத்தின் ஆண் சார்ந்த சொற்றொடரையும் அதன் விவாதத்திற்குரிய பரப்பையும் இயன்றவரை முறையாகப் பாதுகாக்கிறது.
- source_word: νηφάλιον
  choice: நிதானமுள்ளவர்
  rationale: மது விலக்கை மட்டும் அல்லாமல் மனத்தெளிவும் நடத்தைக் கட்டுப்பாடும் உடைய நிலையைச் சுட்டுகிறது.
- source_word: σώφρονα
  choice: தன்னடக்கமுள்ளவர்
  rationale: விவேகமான சுயக்கட்டுப்பாட்டின் ஒழுக்க வலிமையை எளிய நவீன தமிழில் தருகிறது.
- source_word: κόσμιον
  choice: மதிப்புக்குரியவர்
  rationale: ஒழுங்கும் தகுந்த நடத்தையும் பிறரின் மரியாதையைப் பெறும் தன்மையும் உள்ளடங்கும் இயல்பான தமிழாக்கம்.
- source_word: φιλόξενον
  choice: விருந்தோம்புகிறவர்
  rationale: விருந்தினரையும் அந்நியரையும் வரவேற்றுப் பேணும் பண்பைச் சுருக்கமாகவும் வழக்கமான தமிழிலும் தெரிவிக்கிறது.
- source_word: διδακτικόν
  choice: கற்பிக்கத் திறனுள்ளவர்
  rationale: கற்பிக்க விருப்பம் மட்டும் அல்லாமல் அதற்கான திறமை இருக்க வேண்டும் என்ற பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: திருச்சபைக் கண்காணிப்பாளருக்கான தகுதியில் μιᾶς γυναικὸς ἄνδρα என்பதன் விளக்கம்
  choice: முதன்மை உரையில் “ஒரே மனைவியின் கணவர்” என்று முறையாக மொழிபெயர்த்தல்
  alternative: “ஒரே பெண்ணுக்கே உண்மையுள்ள ஆண்” அல்லது “தன் மனைவிக்கு உண்மையுள்ளவர்”
  rationale: இந்தச் சொற்றொடர் திருமண உண்மைத்தன்மையை வலியுறுத்துகிறதா, பலதார மணத்தைத் தடை செய்கிறதா, அல்லது மறுமணம் குறித்த கட்டுப்பாட்டைக் குறிக்கிறதா என்பது விவாதத்திற்குரியது. எந்த ஒரு விளக்கத்தையும் உரைக்குள் முடிவாகப் புகுத்தாமல், கிரேக்க வடிவத்தையும் இறையியல் பதற்றத்தையும் முதன்மை உரை பாதுகாக்கிறது; மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான பண்புப்பட்டியல் நடையில் அமைக்கப்பட்டது. பதவிப் பெயருக்கு மரபுசார் “பிஷப்” என்பதற்குப் பதிலாக பொருளை வெளிப்படுத்தும் “கண்காணிப்பாளர்” பயன்படுத்தப்பட்டது.
