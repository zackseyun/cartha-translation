id: 1TI.3.5
reference: 1 Timothy 3:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: ta
  text: ஆனால், ஒருவர் தம் சொந்த வீட்டாரை நடத்தத்[a] தெரியாவிட்டால், கடவுளின் திருச்சபையை எப்படிக் கவனித்துக்கொள்வார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வழிநடத்த’ அல்லது ‘தலைமை தாங்க’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: ஆனால் ... தெரியாவிட்டால்
  rationale: δέ தரும் மிதமான முரண்பாட்டை ‘ஆனால்’ என்பதும், εἰ தரும் நிபந்தனையை ‘தெரியாவிட்டால்’ என்பதும் இயல்பான தமிழில் காக்கின்றன.
- source_word: τις
  choice: ஒருவர்
  rationale: குறிப்பிடப்படாத ஒருவரைக் குறிக்கும் சொல்லாகவும், நவீன மரியாதைத் தமிழுக்கு ஏற்றதாகவும் உள்ளது; உடனடி சூழல் திருச்சபைக் கண்காணிப்பாளருக்கான தகுதிகளைப் பற்றியது.
- source_word: τοῦ ἰδίου οἴκου
  choice: தம் சொந்தக் குடும்பத்தை
  rationale: οἶκος இங்கு கட்டடத்தை மட்டுமல்லாமல் ஒருவரின் பராமரிப்புக்கும் வழிநடத்தலுக்கும் உட்பட்ட குடும்பத்தாரைக் குறிக்கிறது. ‘குடும்பம்’ என்பது இச்சூழலில் இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: προστῆναι
  choice: பொறுப்புடன் நடத்த
  rationale: προΐστημι குறிக்கும் முன்னின்று வழிநடத்துதல் மற்றும் பொறுப்பேற்று ஒழுங்குபடுத்துதல் ஆகிய கருத்துகளை அதிகாரத்தனமாக ஒலிக்காமல் வெளிப்படுத்துகிறது. ‘பொறுப்புடன்’ என்பது தமிழில் ‘நடத்த’ என்பதன் நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: οὐκ οἶδεν
  choice: தெரியாவிட்டால்
  rationale: வினையெச்சத்துடன் வரும் οἶδα, ஒரு செயலை எப்படிச் செய்வது என்று அறிந்திருப்பதைக் குறிக்கிறது; தமிழில் ‘நடத்தத் தெரியாவிட்டால்’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πῶς
  choice: எப்படி
  rationale: வீட்டைப் பொறுப்புடன் நடத்துவதிலிருந்து திருச்சபையைப் பராமரிப்பதற்குச் செல்லும் வினாவடிவ முடிவுரையை நேரடியாகக் காக்கிறது.
- source_word: ἐκκλησίας θεοῦ
  choice: கடவுளின் திருச்சபையை
  rationale: ἐκκλησία இங்கு விசுவாசிகளின் திருச்சபைச் சமூகத்தைக் குறிக்கிறது. ‘கடவுளின்’ என்ற உடைமை வடிவம் இயல்பான தமிழில் θεοῦ என்பதைக் காக்கிறது.
- source_word: ἐπιμελήσεται
  choice: கவனித்துக்கொள்வார்
  rationale: ἐπιμελέομαι குறிக்கும் அக்கறையுடனான பராமரிப்பை இயல்பாக வெளிப்படுத்துகிறது; இது முதல் வினைச்சொல்லான குடும்பத்தை ‘நடத்துதல்’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: குடும்ப வழிநடத்தலுக்கும் திருச்சபைப் பராமரிப்புக்கும் உள்ள தொடர்பு
  choice: குடும்பத்தை ‘பொறுப்புடன் நடத்துதல்’ என்றும், கடவுளின் திருச்சபையை ‘கவனித்துக்கொள்ளுதல்’ என்றும் வேறுபட்ட வினைச்சொற்களால் மொழிபெயர்க்கப்பட்டது.
  alternative: இரு இடங்களிலும் ‘வழிநடத்துதல்’ என்று ஒரே சொல்லைப் பயன்படுத்துதல்; அல்லது குடும்பத்தை ‘ஆளுதல்’ என்று கூறுதல்.
  rationale: மூலத்தில் προΐστημι, ἐπιμελέομαι என இரண்டு வேறுபட்ட வினைச்சொற்கள் உள்ளன. அந்த வேறுபாட்டைக் காப்பது, திருச்சபைக் கண்காணிப்பை வெறும் அதிகாரச் செலுத்தலாக மாற்றாமல், அக்கறையுள்ள பராமரிப்பு என்ற வலியுறுத்தலை நிலைநிறுத்துகிறது.
- issue: குறிப்பிடப்படாத எழுவாயின் பாலின வெளிப்பாடு
  choice: τις என்பதற்கு ‘ஒருவர்’ என்றும், தொடர்ச்சியாக மரியாதை ஒருமை வடிவங்களையும் பயன்படுத்துதல்.
  alternative: ‘ஒருவன் ... அவன்’ என்று வெளிப்படையான ஆண்பால் வடிவத்தைப் பயன்படுத்துதல்.
  rationale: உடனடி சூழல் கண்காணிப்பாளர் தகுதிகளைப் பற்றியதாக இருந்தாலும், τις என்பது பெயரிடப்படாத ஒருவரைக் குறிக்கிறது. ‘ஒருவர்’ என்பது தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருந்து, மூலத்தைவிட அதிகமான பாலின வலியுறுத்தலைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன செந்தமிழும் பொதுப் பயன்பாட்டுத் தமிழும் சமநிலைப்படுத்தப்பட்டுள்ளன. ‘திருச்சபை’ என்பது கிறிஸ்தவச் சூழலில் பரவலாகப் புரியப்படும் கண்ணியமான சொல். வாக்கியத்தின் வினாவடிவமும், குடும்பப் பொறுப்பிலிருந்து திருச்சபைப் பராமரிப்புக்குச் செல்லும் தர்க்கமும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
