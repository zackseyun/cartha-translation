  yaml_path: translation/nt/1_timothy/003/014.yaml
  text: I am writing these things to you[a], hoping to come to you soon,
translation:
  language: ta
  text: நான் இவற்றை உனக்கு எழுதுகிறேன்; உன்னிடம் விரைவில்[a] வருவேன் என்று நம்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேகமாக” அல்லது “குறுகிய காலத்திற்குள்.”
    reason: ἐν τάχει என்பது வருகை விரைவில் நிகழ்வதையோ, வேகமாக நிகழ்வதையோ குறிக்கக்கூடும்.
lexical_decisions:
- source_word: Ταῦτά
  choice: இவற்றை
  rationale: நடுநிலைப் பன்மைச் சுட்டுப்பெயர், முன்பு கூறப்பட்ட மற்றும் தொடர்ந்து வழங்கப்படும் அறிவுறுத்தல்களை ஒரு தொகுப்பாகச் சுட்டுகிறது; பன்மையைத் தெளிவாகப் பேணுகிறது.
- source_word: σοι
  choice: உனக்கு
  rationale: γράφω என்பதுடன் வரும் நான்காம் வேற்றுமைப் பொருள், கடிதச் சூழலில் பெறுநரை இயல்பாகக் குறிக்கிறது.
- source_word: γράφω
  choice: எழுதுகிறேன்
  rationale: கடிதம் எழுதும் நிகழ்காலச் செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐλπίζων
  choice: என்று நம்புகிறேன்
  rationale: முதன்மை வினையுடன் தொடர்புடைய நிகழ்காலப் பங்கேற்பு வடிவத்தைத் தமிழில் இயல்பாகத் தனி வினைத்தொடராக மாற்றுகிறது; எதிர்பார்ப்பை உறுதியாக்காமல் பேணுகிறது.
- source_word: ἐλθεῖν
  choice: வருவேன்
  rationale: எழுத்தாளர் தீமோத்தேயுவை நோக்கிச் செல்ல எண்ணுவதை, தமிழில் ‘வருதல்’ என்ற நோக்குநிலை வினையால் இயல்பாகத் தெரிவிக்கிறது.
- source_word: πρὸς σὲ
  choice: உன்னிடம்
  rationale: ஒரு நபரை நோக்கிய இயக்கத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἐν τάχει
  choice: விரைவில்
  rationale: இச்சொற்றொடரின் சூழலுக்கேற்ற முதன்மைப் பொருளான அண்மைக் காலத்தை இயல்பாகத் தெரிவிக்கிறது; செயல் வேகத்தைக் குறிக்கும் மாற்றுப் பொருள் அடிக்குறிப்பில் பேணப்படுகிறது.
