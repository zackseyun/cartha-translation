  rationale: பணம் அல்லது வெள்ளியை நேசிக்காதவர் என்ற கூட்டுச்சொல்லின் உள்ளார்ந்த மனப்பாங்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் முறைகேடான ஆதாயத்தை மட்டும் குறுக்கவில்லை.
