  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: ta
  text: தூய மனச்சாட்சியுடன் விசுவாசத்தின் மறைபொருளைப் பற்றிக்கொண்டிருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய மனச்சாட்சியில் விசுவாசத்தின் மறைபொருளைக் கொண்டிருக்க வேண்டும்.”
    reason: ἐν மற்றும் ἔχοντας ஆகியவற்றின் மேலும் நேரடியான வடிவத்தைப் பதிவு செய்யும் மொழிபெயர்ப்பு மாற்று.
lexical_decisions:
- source_word: ἔχοντας
  choice: பற்றிக்கொண்டிருக்க வேண்டும்
  rationale: நிகழ்காலப் பங்கேற்புவினை முந்தைய வசனத்தில் கூறப்பட்ட திருப்பணியாளர்களைச் சுட்டுகிறது. இது வெறும் உடைமையையல்ல, தொடர்ந்து உறுதியாகக் கடைப்பிடிப்பதைக் காட்டுகிறது; தமிழில் வாக்கியம் இயல்பாக நிறைவுபெற ‘வேண்டும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: μυστήριον
  choice: மறைபொருள்
  rationale: பவுலின் பயன்பாட்டில் இது எப்போதும் மறைந்திருக்கும் ரகசியத்தையல்ல, தேவனால் வெளிப்படுத்தப்பட்ட ஆழ்ந்த உண்மையைக் குறிக்கலாம். ‘மறைபொருள்’ அந்தத் திறந்த அர்த்தத்தை அளவுக்கு மீறி விளக்காமல் காக்கிறது.
- source_word: τῆς πίστεως
  choice: விசுவாசத்தின்
  rationale: இங்கு இது தனிநபரின் நம்பும் செயலைவிட, நம்பிக்கையின் உள்ளடக்கமாகிய விசுவாசத்தைப் பெரும்பாலும் குறிக்கிறது. ஆனால் தமிழ் வடிவம் மூலத்தில் எஞ்சியுள்ள பொருள் நுணுக்கத்தை முற்றிலும் மூடிவிடவில்லை.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: தூய மனச்சாட்சியுடன்
  rationale: ἐν என்பதற்கு இச்சூழலில் தமிழில் இயல்பான உடனிணைவு வடிவம் ‘உடன்’. καθαρός என்பதன் தூய்மை சார்ந்த அடிப்படைப் பொருளையும், ஒழுக்க நேர்மையுள்ள மனச்சாட்சி என்ற கருத்தையும் இந்தச் சொற்றொடர் காக்கிறது.
theological_decisions:
- issue: τῆς πίστεως என்பதிலுள்ள ‘விசுவாசம்’ என்பதன் பொருள்
  choice: நம்பப்படும் விசுவாசத்தின் உள்ளடக்கம்
  alternative: தனிநபரின் நம்பிக்கை அல்லது விசுவாசமுள்ள தன்மை
  rationale: திருச்சபைப் பணியாளர்களின் தகுதிகள் பற்றிய சூழலில், அவர்கள் பற்றிக்கொள்ள வேண்டிய விசுவாசச் செய்தியே முதன்மையான பொருள். இருப்பினும் ‘விசுவாசத்தின்’ என்ற மொழிபெயர்ப்பு மூலத்தின் சுருக்கத்தையும் சாத்தியமான நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மறைபொருள்’, ‘மனச்சாட்சி’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்றவையாகவும் பொதுவாசகர்களுக்குப் புரியக்கூடியவையாகவும் உள்ளன.
