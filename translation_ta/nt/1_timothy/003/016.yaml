  source_fidelity: மூலத்தின் ஆறு இணைச்செயப்பாட்டு வரிகளும், Ὃς என்ற விமர்சனப் பாடவாசகமும், ἐν πνεύματι-யின் தெளிவின்மையும், ἐν δόξῃ-யின் மாற்றுவாசிப்பும் பெரும்பாலும் சரியாகக் காக்கப்பட்டுள்ளன. ஆனால் “அனைவரும் ஒப்புக்கொள்கிறபடி” என்பது ὁμολογουμένως-இன் பொதுவாக ஒப்புக்கொள்ளப்பட்ட/ஏற்றுக்கொள்ளப்பட்ட என்ற பொருளைத் தேவையின்றி ‘அனைவரும்’ என முழுமையாக்குகிறது.
  naturalness: “பொதுவாக ஒப்புக்கொள்ளப்படுகிறபடி” நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் கருத்துக்கு நெருக்கமாகவும் உள்ளது. “உலகத்தில் நம்பப்பட்டார்” என்பதை “உலகில் நம்பப்பட்டார்” எனச் சுருக்குவது இயல்பானது. மற்ற வரிகள் கண்ணியமான, புரிந்துகொள்ளத்தக்க செய்யுள் நடையில் உள்ளன.
  terminology: “இறைப்பற்றின் மறைபொருள்,” “மாம்சத்தில்,” “ஆவியில்,” “தேவதூதர்கள்,” மற்றும் “மகிமையில்” ஆகியவை மூலத்தின் இறையியல் மற்றும் சொற்பொருள் நுணுக்கங்களைச் சரிவரத் தக்கவைக்கின்றன. “நீதியுள்ளவர் என மெய்ப்பிக்கப்பட்டார்” δικαιόω-வின் இச்சூழல் பொருளான ‘vindicated’ என்பதற்கு ஏற்றது.
