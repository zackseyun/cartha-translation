source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: ta
  text: '1 தீமொத்தேயு 3:16


    பொதுவாக ஒப்புக்கொள்ளப்படுகிறபடி, இறைப்பற்றின் மறைபொருள் பெரியது:


    அவர்[a] மாம்சத்தில் வெளிப்பட்டார்,


    ஆவியில் நீதியுள்ளவர் என மெய்ப்பிக்கப்பட்டார்[b],


    தேவதூதர்களால் காணப்பட்டார்,


    மக்களினங்களிடையே அறிவிக்கப்பட்டார்[c],


    உலகில் நம்பப்பட்டார்,


    மகிமையில் மேலே எடுத்துக்கொள்ளப்பட்டார்[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “அவர் மாம்சத்தில் வெளிப்பட்டார்” என்பதற்குப் பதிலாக “தேவன் மாம்சத்தில் வெளிப்பட்டார்” என்று உள்ளது. இங்கு பின்பற்றப்பட்டுள்ள விமர்சன கிரேக்க உரையில் “யார்/அவர்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: “பரிசுத்த ஆவியால் நீதியுள்ளவர் என மெய்ப்பிக்கப்பட்டார்” என்றும், “ஆவிக்குரிய நிலையில் நீதியுள்ளவர் என மெய்ப்பிக்கப்பட்டார்” என்றும் புரிந்துகொள்ளலாம். கிரேக்கச் சொற்றொடர் சுருக்கமானது; அது பரிசுத்த ஆவியின் செயலையோ ஆவிக்குரிய வாழ்வின் நிலையையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “யூதரல்லாதவர்களிடையே அறிவிக்கப்பட்டார்.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “மகிமைக்குள் மேலே எடுத்துக்கொள்ளப்பட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: அனைவரும் ஒப்புக்கொள்கிறபடி
  rationale: இச்சொல் வெளிப்படையாகவும் பொதுவாகவும் ஒப்புக்கொள்ளப்படுவதைக் குறிக்கிறது. வெறும் தர்க்கரீதியான ‘மறுக்க முடியாதது’ என்பதைக் காட்டிலும், பொதுவான அறிக்கையின் நுண்ணுணர்வை இது காக்கிறது.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: இறைப்பற்றின் மறைபொருள்
  rationale: μυστήριον என்பது முற்றிலும் புரியாத புதிரை அல்ல, முன்பு மறைந்திருந்து இப்போது வெளிப்படுத்தப்பட்ட இறை உண்மையைக் குறிக்கிறது. εὐσέβεια இங்கு இறைவனை மதித்து வாழும் இறைப்பற்றைக் குறிக்கிறது.
- source_word: Ὃς
  choice: அவர்
  rationale: SBLGNT-யின் வாசகம் ஆண்பால் சார்புப்பெயரான ‘யார்/அவர்’ என்பதாகும்; ‘தேவன்’ என்பதல்ல. செய்யுள் போன்ற அறிக்கையை இயல்பான தமிழில் தொடர ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐφανερώθη ἐν σαρκί
  choice: மாம்சத்தில் வெளிப்பட்டார்
  rationale: σάρξ மனிதரின் உடல்சார்ந்த வாழ்வைச் சுட்டுகிறது. ‘மனித உடலில்’ என்று முழுமையாக விளக்கிவிடாமல், மூலத்தின் சுருக்கமான எதிரிணையை ‘மாம்சத்தில்’ காக்கிறது.
- source_word: ἐδικαιώθη
  choice: நீதியுள்ளவர் என மெய்ப்பிக்கப்பட்டார்
  rationale: இங்கு ‘நீதிமானாக்கப்பட்டார்’ என்பது பொருளல்ல; அவர் நீதியுள்ளவர் அல்லது சரியானவர் என்று உறுதிப்படுத்தப்பட்டார் என்பதே சூழலுக்கேற்ற பொருள்.
- source_word: ἐν πνεύματι
  choice: ஆவியில்
  rationale: கிரேக்கச் சொற்றொடர் பரிசுத்த ஆவியின் செயலையோ ஆவிக்குரிய நிலையையோ குறிக்கக்கூடும். ‘ஆவியில்’ என்பது இந்தச் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
- source_word: ὤφθη ἀγγέλοις
  choice: தேவதூதர்களால் காணப்பட்டார்
  rationale: செயப்பாட்டு வடிவையும் வானுலகத் தூதர்களைக் குறிக்கும் இயல்பான பொருளையும் காக்கிறது.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: மக்களினங்களிடையே அறிவிக்கப்பட்டார்
  rationale: κηρύσσω அதிகாரபூர்வமான அறிவிப்பைக் குறிக்கிறது. ἔθνη என்பதன் பரந்த ‘மக்களினங்கள்’ என்ற பொருள் முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: உலகத்தில் நம்பப்பட்டார்
  rationale: மூலத்தின் செயப்பாட்டு அமைப்பையும் கிறிஸ்துவை நம்பிக்கையின் தனிப்பட்ட பொருளாகக் காட்டும் கருத்தையும் சுருக்கமாகக் காக்கிறது.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: மகிமையில் மேலே எடுத்துக்கொள்ளப்பட்டார்
  rationale: ἀναλαμβάνω-வின் மேலே ஏற்றுக்கொள்ளப்படுதல் என்ற திசையையும் ἐν δόξῃ-யின் ‘மகிமையில்’ என்ற இயல்பான வாசிப்பையும் காக்கிறது.
theological_decisions:
- issue: அறிக்கையின் தொடக்கத்திலுள்ள Ὃς / θεός / ὅ என்ற பாடவேறுபாடு
  choice: விமர்சன கிரேக்க உரையின் Ὃς என்பதை ‘அவர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘தேவன் மாம்சத்தில் வெளிப்பட்டார்’ அல்லது ‘அது மாம்சத்தில் வெளிப்பட்டது’
  rationale: SBLGNT வாசகம் Ὃς (‘யார்/அவர்’) என்பதாகும். வசனத்தின் கிறிஸ்துவியல் குறிப்பை இயல்பாக வெளிப்படுத்த ‘அவர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; வரலாற்று முக்கியத்துவமுள்ள ‘தேவன்’ என்ற மாற்று வாசகம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ἐν πνεύματι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘ஆவியில்’ என்று தெளிவின்மையைப் பேணுதல்
  alternative: ‘பரிசுத்த ஆவியால்’ அல்லது ‘ஆவிக்குரிய நிலையில்’
  rationale: இது பரிசுத்த ஆவியின் செயலையோ, மாம்சத்துக்கு எதிரிணையான ஆவிக்குரிய நிலையையோ குறிக்கலாம். எந்த விளக்கத்தையும் கோட்பாட்டின் அடிப்படையில் உரைக்குள் திணிக்காமல் இரு சாத்தியங்களும் பாதுகாக்கப்படுகின்றன.
- issue: ἐν δόξῃ என்பதன் இலக்கு அல்லது சூழ்நிலைப் பொருள்
  choice: ‘மகிமையில்’
  alternative: ‘மகிமைக்குள்’
  rationale: ἐν என்பதன் இயல்பான இடம்/நிலைப் பொருள் முதன்மை உரையில் வைக்கப்பட்டுள்ளது; ஏற்றுக்கொள்ளப்பட்டதன் இலக்காக மகிமையைக் காணும் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான செய்யுள் நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ஆறு இணையான செயப்பாட்டு வரிகளும் இயன்றவரை காக்கப்பட்டுள்ளன. ‘மாம்சம்’, ‘ஆவி’, ‘மறைபொருள்’ போன்ற சொற்கள் இறையியல் செறிவைத் தக்கவைத்தாலும், தேவையற்ற பழமையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன.
