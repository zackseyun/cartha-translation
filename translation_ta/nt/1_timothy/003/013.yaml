source:
  edition: SBLGNT
  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: ta
  text: ஏனெனில், நன்கு சேவை செய்தவர்கள் தங்களுக்கென ஒரு நல்ல நிலையையும், மெசியாவாகிய[a] இயேசுவில் உள்ள விசுவாசத்தில்[b] மிகுந்த துணிவையும்[c] பெற்றுக்கொள்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “கிறிஸ்து”; இங்கு அந்தச் சொல் ஒரு பட்டமாகச் செயல்படுவதால் “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மெசியாவாகிய இயேசுவில் உள்ள உண்மைத்தன்மையில்.” கிரேக்க πίστις என்ற சொல் “விசுவாசம்,” “நம்பிக்கை,” அல்லது “உண்மைத்தன்மை” என்று பொருள்படலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “மிகுந்த நம்பிக்கை.” கிரேக்கச் சொல் துணிவு, நம்பிக்கை, அல்லது ஒளிவுமறைவற்ற பேச்சு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: சேவை செய்தவர்கள்
  rationale: வினைச்சொல் அடிப்படையில் ‘சேவை செய்தல்’ என்பதைக் குறிக்கிறது. சூழல் திருச்சபைப் பணியாளர்களைப் பற்றியது என்றாலும், வினைச்சொல்லிலேயே பதவிப்பெயரைச் சேர்க்காமல் அதன் இயல்பான பொருள் காக்கப்படுகிறது.
- source_word: καλῶς
  choice: நன்கு
  rationale: சேவை செய்த விதத்தைச் சுட்டும் வினையடை; நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: βαθμὸν ... καλὸν
  choice: ஒரு நல்ல நிலை
  rationale: βαθμός என்பதன் ‘படி/நிலை/தகுநிலை’ என்ற உருவகப் பொருளைத் தக்கவைக்கிறது; குறிப்பிட்ட திருச்சபைப் பதவி உயர்வையோ நிர்வாகத் தரவரிசையையோ தேவையின்றி உணர்த்துவதில்லை.
- source_word: περιποιοῦνται
  choice: தங்களுக்கென ... பெற்றுக்கொள்கிறார்கள்
  rationale: இடைநிலை வினையின் தற்சார்புப் பொருளை ‘தங்களுக்கென’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: παρρησίαν
  choice: துணிவு
  rationale: தடையற்ற, நம்பிக்கையுள்ள வெளிப்படையான துணிவை உணர்த்துகிறது; ‘நம்பிக்கை’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πίστει
  choice: விசுவாசம்
  rationale: πίστις என்பதற்கான இச்சூழலின் முதன்மையான, பரவலாகப் புரிந்துகொள்ளப்படும் மொழிபெயர்ப்பு. ‘உண்மைத்தன்மை’ என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவில் உள்ள
  rationale: முன்னுள்ள ‘விசுவாசம்’ என்பதை விளக்கும் கிரேக்கக் கட்டமைப்பைப் பாதுகாக்கிறது; ἐν என்பதையும் மறைக்காமல் ‘இல் உள்ள’ என்று வழங்குகிறது.
- source_word: Χριστῷ
  choice: மெசியா
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ என்பதில் πίστις என்பதன் பொருள்
  choice: மெசியாவாகிய இயேசுவில் உள்ள விசுவாசம்
  alternative: மெசியாவாகிய இயேசுவில் உள்ள உண்மைத்தன்மை
  rationale: இங்கு மெசியா இயேசுவை மையமாகக் கொண்ட விசுவாசமே இயல்பான வாசிப்பு. எனினும் πίστις ‘உண்மைத்தன்மை/விசுவாசத்தன்மை’ என்றும் பொருள்படக்கூடியதால் அந்த மெய்யான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘சேவை செய்தவர்கள்’ என்பது பொதுவாசகர்களுக்கு இயல்பாக இருந்து, சூழலில் உள்ள திருச்சபைப் பணியாளர் தொடர்பையும் காக்கிறது. மூலத்தின் காரணவிளக்கத் தொடர்பை ‘ஏனெனில்’ என்பதும், இரு பலன்களின் இணைப்பை ‘பெற்றுக்கொள்வதோடு ... பெற்றுக்கொள்கிறார்கள்’ என்பதும் தெளிவாக்குகின்றன.
