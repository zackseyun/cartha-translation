reference: 1 Timothy 3:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: ta
  text: மேலும், அவர் வெளியில் இருப்பவர்களிடமிருந்தும்[a] நற்சான்று பெற்றவராக இருக்க வேண்டும். அதனால் அவர் பழிச்சொல்லுக்கும்[b] பிசாசின் கண்ணிக்கும்[c] ஆளாகாமல் இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெளியாரிடமிருந்தும்.” இது கிறிஸ்தவச் சமூகத்திற்கு வெளியே இருப்பவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவமானத்துக்கும்.”
    reason: lexical_alternative
  - marker: c
    text: διάβολος என்பதைப் பொதுப் பொருளில் எடுத்தால், “அவதூறு பேசுகிறவனின் கண்ணிக்கும்” என்றும் மொழிபெயர்க்கலாம்; இங்கு அது பிசாசைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: இருக்க வேண்டும்
  rationale: கண்காணியின் தகுதிக்குரிய கட்டாயத்தையும் அவசியத்தையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: δὲ καὶ
  choice: மேலும் ... -உம்
  rationale: முந்தைய தகுதிகளுடன் இதையும் இணைத்து, கூடுதலான ஒரு தேவையாக முன்வைக்கிறது.
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: நற்சான்று பெற்றவராக இருக்க
  rationale: சமுதாயத்தில் பிறர் அளிக்கும் நல்ல சாட்சியையோ மதிப்பீட்டையோ குறிக்கிறது; ‘நற்பெயர்’ என்பதைவிட மூலச்சொல்லின் சான்று/சாட்சி நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: வெளியில் இருப்பவர்களிடமிருந்து
  rationale: கிறிஸ்தவச் சமூகத்திற்கு வெளியே உள்ளவர்களைக் குறிக்கும் மூலத்தின் சுருக்கமான சொல்லாட்சியை விளக்கத்தை நேரடியாக வசனத்தில் சேர்க்காமல் தக்கவைக்கிறது.
- source_word: ἵνα μὴ
  choice: அப்போதுதான் ... ஆளாகாமல் இருப்பார்
  rationale: எதிர்மறையான நோக்கம் அல்லது விளைவு இரண்டுக்கும் இடமளிக்கும் வகையில் தமிழில் இயல்பாகத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: பழிச்சொல்லுக்கு ஆளாக
  rationale: ὀνειδισμός என்பதிலுள்ள நிந்தை, பழி, பொதுவான அவமானம் ஆகிய சமூக நுணுக்கங்களை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: παγίδα
  choice: கண்ணி
  rationale: பிடிப்பதற்காக மறைத்து வைக்கப்படும் வலையின் உருவகத்தைத் தக்கவைக்கும் செறிவான வேதாகமத் தமிழ் சொல்.
- source_word: τοῦ διαβόλου
  choice: பிசாசின்
  rationale: புதிய ஏற்பாட்டின் வழக்கின்படி தனிப்பட்ட தீயவனைக் குறிப்பதாக எடுத்துக்கொள்கிறது; கிரேக்க வேற்றுமைத் தொடர்பையும் நேரடியாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: τοῦ διαβόλου என்பதன் குறிப்பு
  choice: தனிப்பட்ட தீயவனாகிய பிசாசு—‘பிசாசின் கண்ணி’
  alternative: ‘அவதூறு பேசுகிறவனின் கண்ணி’ அல்லது ‘அவதூறின் கண்ணி’
  rationale: διάβολος என்பதற்கு பொதுவாக ‘அவதூறு பேசுகிறவன்’ என்ற பொருள் இருக்கலாம். எனினும், மேய்ப்புக் கடிதங்களிலும் புதிய ஏற்பாட்டின் பரவலான பயன்பாட்டிலும் இங்கு அது பிசாசைச் சுட்டுவது அதிக வாய்ப்புள்ளது. மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ὀνειδισμός என்பதன் சமூக விளைவு
  choice: பழிச்சொல்
  alternative: அவமானம்
  rationale: இந்தச் சொல் வெறும் உள்ளார்ந்த வெட்கத்தைவிட பிறரிடமிருந்து வரும் நிந்தை அல்லது பழியை முன்னிறுத்துகிறது; இருந்தாலும் விளைவாக ஏற்படும் அவமானம் மாற்று மொழிபெயர்ப்பாக சாத்தியம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நற்சான்று’, ‘பழிச்சொல்’, ‘கண்ணி’ ஆகியவை மூலத்தின் சாட்சி, சமூக நிந்தை, வலை ஆகிய நுணுக்கங்களைச் சுருக்கமாகத் தக்கவைக்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
