  terminology: «நற்சான்று», «பழிச்சொல்», and «பிசாசின் கண்ணி» suitably render the key terms. «வெளியில் இருப்பவர்களிடமிருந்தும்» is intelligible; the footnote appropriately clarifies the community reference without placing that interpretation in the verse.
