review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys δεῖ, the favorable external attestation, ὀνειδισμός, and the devil''s snare. However, «அப்போதுதான்» means “only then,” adding an exclusivity not expressed by ἵνα μή. The Greek states purpose/result: “so that he may not.”'
