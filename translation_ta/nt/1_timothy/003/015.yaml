id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: ta
  text: ஆனால் நான் வரத் தாமதித்தால், கடவுளின் குடும்பத்தில் ஒருவர் எவ்வாறு நடந்துகொள்ள வேண்டும் என்பதை நீ அறியும்படி, கடவுளின் குடும்பம் உயிருள்ள கடவுளின் சபை[a], உண்மையின் தூணும் உறுதியான ஆதரவும்[b] ஆகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயிருள்ள கடவுளின் திருச்சபை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உண்மையின் தூணும் அரணும்” என்றும் மொழிபெயர்க்கலாம்; “ஆதரவு” என்பதற்குப் பதிலாக “அடித்தளம்” என்பதும் முன்மொழியப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: நான் வரத் தாமதித்தால்
  rationale: இங்கு பவுல் வருவதில் ஏற்படக்கூடிய தாமதமே குறிக்கப்படுகிறது; ‘வர’ என்பது சூழலால் புரிந்துகொள்ளப்படும் பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: ἵνα εἰδῇς
  choice: நீ அறிந்துகொள்ளும்படி
  rationale: நோக்கத்தைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: தேவையான, நெறிசார்ந்த கடமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν οἴκῳ θεοῦ
  choice: கடவுளின் குடும்பத்தில்
  rationale: οἶκος இங்கு ஒரு கட்டடத்தைவிட கடவுளுக்குரிய மக்களின் குடும்பத்தைக் குறிக்கிறது; அதைத் தொடர்ந்து வரும் ἐκκλησία இதை உறுதிப்படுத்துகிறது.
- source_word: ἀναστρέφεσθαι
  choice: நடந்துகொள்ள
  rationale: வாழ்க்கை முறை மற்றும் நடத்தையைச் சுட்டும் நடுநிலை, இயல்பான தமிழ்ச் சொல்.
- source_word: ἥτις ἐστὶν
  choice: அந்தக் குடும்பமே … ஆகும்
  rationale: சார்புப்பெயர் கடவுளின் குடும்பத்தை மீண்டும் சுட்டி, அதையே அடுத்த தொடரில் விளக்குகிறது; ‘-மே’ அந்த அடையாளப்படுத்தும் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκκλησία
  choice: சபை
  rationale: கூடிய கடவுளுடைய மக்களைக் குறிக்கும் தமிழில் நிலைபெற்ற, புரிந்துகொள்ள எளிய சொல்; வெறும் கட்டடத்தைக் குறிக்காது.
- source_word: θεοῦ ζῶντος
  choice: உயிருள்ள கடவுளின்
  rationale: கிரேக்க உரையின் இயல்பான பெயரடைத் தொடரையும் அதன் இறையியல் வலியுறுத்தலையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: στῦλος
  choice: தூண்
  rationale: கட்டடவியல் உருவகத்தைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: ἑδραίωμα
  choice: உறுதியான ஆதரவு
  rationale: உறுதிப்படுத்தி நிலைநிறுத்தும் ஒன்றைச் சுட்டும் அரிய கிரேக்கச் சொல்லின் கருத்தை வெளிப்படுத்துகிறது; ‘அடித்தளம்’ என மொழிபெயர்த்து உண்மையின் தோற்றுவாய் சபையே என்ற தேவையற்ற பொருளை உருவாக்குவதைத் தவிர்க்கிறது.
- source_word: τῆς ἀληθείας
  choice: உண்மையின்
  rationale: குறிப்பிட்ட ‘உண்மை’யைச் சுட்டும் கிரேக்க உருபின் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ἐκκλησία என்பதன் திருச்சபையியல் பொருள்
  choice: சபை
  alternative: திருச்சபை; கூடுகை
  rationale: ‘சபை’ என்பது கடவுளுடைய கூடிய மக்களை இயல்பாகக் குறிக்கிறது; பிற்கால அமைப்புசார் கருத்துகளைத் தேவையின்றி முன்னிறுத்தாமல், பாரம்பரியச் சொல்லையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: ‘உண்மையின் தூணும் ἑδραίωμα-வும்’ என்ற உருவகம்
  choice: உண்மையின் தூணும் உறுதியான ஆதரவும்
  alternative: உண்மையின் தூணும் அரணும்; உண்மையின் தூணும் அடித்தளமும்
  rationale: கிரேக்க இலக்கணம் இந்த உயரிய பங்கை உயிருள்ள கடவுளின் சபைக்கே கூறுகிறது. ‘உறுதியான ஆதரவு’ என்பது உண்மையை நிலைநிறுத்தும் பங்கைப் பாதுகாக்கிறது; சபையே உண்மையின் மூலாதாரம் என்று உரைக்கு அப்பால் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடும்பம்’ மற்றும் ‘சபை’ ஆகியவை கட்டடத்தைவிட கடவுளுடைய மக்களைச் சுட்டுகின்றன. பொதுவான கடமையைத் தெளிவாக்க ‘ஒருவர்’ பயன்படுத்தப்பட்டுள்ளது; முந்தைய வசனத்தில் உள்ள எழுதும் செயலைச் சூழலுக்கேற்ப ‘இவற்றை எழுதுகிறேன்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
