source:
  edition: SBLGNT
  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: ta
  text: திருத்தொண்டர்கள் ஒரே மனைவிக்கு கணவர்களாக[a] இருக்க வேண்டும்; தங்கள் பிள்ளைகளையும் தங்கள் சொந்த வீட்டுக்குடும்பங்களையும் நன்றாக நிர்வகிப்பவர்களாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரே பெண்ணுக்குரிய ஆண்கள்.’ இத்தொடர் மணவாழ்வில் உண்மையுடன் இருப்பதை வலியுறுத்தலாம்; சிலர் இதை இன்னும் குறிப்பாகப் பலதார மணத்தையோ மறுமணத்தையோ விலக்குவதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονοι
  choice: உதவித் திருப்பணியாளர்கள்
  rationale: திருச்சபை ஒழுங்கைப் பற்றிய இச்சூழலில் இது பொதுவான ‘பணியாளர்கள்’ என்பதைக் காட்டிலும் அங்கீகரிக்கப்பட்ட ஒரு பொறுப்பைக் குறிக்கிறது. நவீன தமிழில் அந்தப் பொறுப்பையும் சேவையின் தன்மையையும் தெளிவாகக் காட்ட ‘உதவித் திருப்பணியாளர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: ἔστωσαν
  choice: இருக்க வேண்டும்
  rationale: தகுதிப் பட்டியலில் வரும் நிகழ்காலக் கட்டளை வடிவத்தின் நியம வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: ஒரே மனைவியுடைய கணவர்கள்
  rationale: கிரேக்கத் தொடரின் ஆண் சார்ந்த மொழியையும் சுருக்கமான அமைப்பையும் நெருக்கமாகப் பாதுகாக்கிறது; திருமண உண்மை, ஒருதார மணம், அல்லது மறுமணத் தடை ஆகியவற்றில் ஒன்றை மட்டும் உரையில் தீர்மானிப்பதில்லை.
- source_word: τέκνων
  choice: தங்கள் பிள்ளைகளை
  rationale: உடைமைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், வாக்கிய அமைப்பும் அடுத்து வரும் ‘தங்கள் சொந்தக் குடும்பங்கள்’ என்பதும் இவர்களுடைய பிள்ளைகளையே குறிக்கின்றன; தமிழில் இயல்புக்காக ‘தங்கள்’ சேர்க்கப்பட்டது.
- source_word: καλῶς
  choice: நன்றாக
  rationale: வினையெச்சத்தின் செயற்பாட்டுத் தரத்தை எளிமையாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: προϊστάμενοι
  choice: நிர்வகிக்கிறவர்கள்
  rationale: பொறுப்புடன் வழிநடத்தி மேற்பார்வை செய்வதைக் குறிக்கிறது. குடும்பச் சூழலில் மிகை அதிகாரத் தொனி இல்லாமல் உண்மையான பொறுப்பை ‘நிர்வகிக்கிறவர்கள்’ வெளிப்படுத்துகிறது.
- source_word: τῶν ἰδίων οἴκων
  choice: தங்கள் சொந்தக் குடும்பங்களை
  rationale: οἶκος இங்கே கட்டிடத்தை மட்டும் அல்ல, வீட்டாரையும் குடும்ப அலகையும் குறிக்கிறது. தமிழில் ‘குடும்பங்கள்’ இந்த சமூக-குடும்பப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: திருச்சபைப் பொறுப்புக்கான தகுதியில் μιᾶς γυναικὸς ἄνδρες என்பதன் பொருள்
  choice: ‘ஒரே மனைவியுடைய கணவர்கள்’ என்று நெருக்கமாக மொழிபெயர்த்து, பொருளின் விவாதத்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
  alternative: ‘ஒரே பெண்ணுக்கே உண்மையுள்ள ஆண்கள்’; ‘தங்கள் மனைவிகளுக்கு உண்மையுள்ளவர்கள்’; ‘ஒரேமுறை மட்டுமே திருமணம் செய்தவர்கள்’
  rationale: கிரேக்கத் தொடர் சுருக்கமானதும் மரபுத்தொடர் தன்மை கொண்டதும் ஆகும். இது முதன்மையாக மணவாழ்வின் உண்மையைக் குறிக்கிறதா, பலதார மணத்தை விலக்குகிறதா, அல்லது மறுமணத்தையும் விலக்குகிறதா என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், அதன் இறையியல் பதற்றமும் உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: மொழிநடை நவீன நிலையான தமிழிலும் மரியாதைக்குரிய வேதாகமப் பதிவிலும் அமைந்துள்ளது. ‘உதவித் திருப்பணியாளர்கள்’ என்பது திருச்சபைப் பொறுப்பைக் குறிக்கிறது; ‘குடும்பங்கள்’ என்பது வெறும் வீடுகளைக் காட்டிலும் οἶκος என்பதன் வீட்டார் சார்ந்த பொருளைத் தருகிறது. மூலத்தின் ஆண் சார்ந்த சொற்றொடரும் அதன் விளக்கத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
