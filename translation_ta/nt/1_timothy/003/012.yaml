review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the imperative force, the male-specific marital idiom, and the requirement to exercise good oversight of children and one's own household. However, ‘உதவித் திருப்பணியாளர்கள்’ can denote assistant clergy or a particular ecclesial framing rather than the recognized office διάκονοι, and ‘குடும்பங்கள்’ is somewhat narrower than οἶκοι (‘households’).
  naturalness: The sentence is generally clear, but ‘ஒரே மனைவியுடைய கணவர்கள்’ is awkward and redundantly phrased in Tamil. A close but more idiomatic formulation is preferable.
  terminology: ‘திருத்தொண்டர்கள்’ is an established, suitably dignified Tamil designation for deacons in a church-order context without importing the narrower implication of ‘assistant ministers.’ ‘வீட்டுக்குடும்பங்கள்’ better represents households as domestic units than ‘குடும்பங்கள்’ alone.
  issues:
  - severity: medium
    issue: The rendering ‘உதவித் திருப்பணியாளர்கள்’ is not a secure equivalent for διάκονοι.
    rationale: It may be heard as ‘assistant ministers’ and can imply an ecclesial rank or ministerial function beyond the source term. In this qualifications context, ‘திருத்தொண்டர்கள்’ identifies the deacon office more directly.
  - severity: medium
    issue: ‘ஒரே மனைவியுடைய கணவர்கள்’ is unnatural Tamil.
    rationale: The wording is semantically cumbersome. ‘ஒரே மனைவிக்கு கணவர்களாக’ retains the formal marital expression and male-specific reference without deciding the debated scope of the Greek idiom.
  - severity: low
    issue: ‘தங்கள் சொந்தக் குடும்பங்கள்’ may narrow οἶκοι.
    rationale: οἶκος denotes the household unit, potentially broader than the nuclear family. ‘தங்கள் சொந்த வீட்டுக்குடும்பங்கள்’ more closely retains this scope.
  revised_text: திருத்தொண்டர்கள் ஒரே மனைவிக்கு கணவர்களாக[a] இருக்க வேண்டும்; தங்கள் பிள்ளைகளையும் தங்கள் சொந்த வீட்டுக்குடும்பங்களையும் நன்றாக நிர்வகிப்பவர்களாக இருக்க வேண்டும்.
