  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: ta
  text: அவ்வாறே, பெண்களும்[a] கண்ணியமுள்ளவர்களாகவும், அவதூறு பேசாதவர்களாகவும், நிதானமுள்ளவர்களாகவும், எல்லாவற்றிலும் நம்பத்தகுந்தவர்களாகவும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவ்வாறே, மனைவிகளும் கண்ணியமுள்ளவர்களாகவும்...” என்றும் மொழிபெயர்க்கலாம். இங்கே பயன்படுத்தப்பட்டுள்ள கிரேக்கச் சொல் ‘பெண்கள்’ அல்லது ‘மனைவிகள்’ என்று பொருள்படலாம்; ‘அவர்களுடைய மனைவிகள்’ என்று மூலவாக்கியம் வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: பெண்கள்
  rationale: γυνή என்பதன் பன்மை வடிவம் இச்சூழலில் ‘பெண்கள்’ அல்லது ‘மனைவிகள்’ என்று பொருள்படலாம். கிரேக்கத்தில் ‘அவர்களுடைய’ என்ற உடைமைச்சொல் இல்லாததால், முதன்மை உரையில் பொதுவான ‘பெண்கள்’ பயன்படுத்தப்பட்டு, ‘மனைவிகள்’ என்ற வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὡσαύτως
  choice: அவ்வாறே
  rationale: முந்தைய தகுதிப் பட்டியலுடன் உள்ள இணை அமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: σεμνάς
  choice: கண்ணியமுள்ளவர்களாகவும்
  rationale: மதிப்புக்குரிய தீவிரத்தையும் ஒழுக்கக் கண்ணியத்தையும் குறிக்கும் σεμνός என்பதன் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μὴ διαβόλους
  choice: அவதூறு கூறாதவர்களாகவும்
  rationale: இங்கு διάβολος என்பது ‘பிசாசு’ என்ற பெயராக அல்லாமல், பிறர்மீது பழி சுமத்தும் அல்லது அவதூறு பேசும் குணத்தைக் குறிக்கும் பெயரடையாக வருகிறது.
- source_word: νηφαλίους
  choice: நிதானமுள்ளவர்களாகவும்
  rationale: மது விலக்கின் நேரடிப் பொருளை மட்டும் அல்லாமல், தெளிந்த சிந்தனையையும் கட்டுப்பாடான நடத்தையையும் உள்ளடக்கும் νηφάλιος என்பதன் விரிந்த ஒழுக்கப் பொருளை வெளிப்படுத்துகிறது.
- source_word: πιστὰς
  choice: உண்மையுள்ளவர்களாகவும்
  rationale: πιστός இங்கு நம்பகத்தன்மை, விசுவாசம், கடமையுணர்வு ஆகிய பண்புகளைச் சுட்டுகிறது; ‘உண்மையுள்ள’ என்பது அந்தப் பரப்பைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἐν πᾶσιν
  choice: எல்லாவற்றிலும்
  rationale: கிரேக்கச் சொற்றொடரின் முழுமையான, எல்லாவற்றையும் உள்ளடக்கும் பரப்பை நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: தகுதிப் பட்டியலில் γυναῖκας யாரைக் குறிக்கிறது?
  choice: பெண்கள்
  alternative: மனைவிகள்; அவர்களுடைய மனைவிகள்
  rationale: பவுல் ஊழியப் பொறுப்பில் இருந்த பெண்களையா அல்லது ஆண் உதவிக்காரர்களின் மனைவிகளையா குறிக்கிறார் என்பது விவாதத்திற்குரியது. γυνή இரு பொருள்களையும் ஏற்கலாம். ஆனால் கிரேக்கத்தில் ‘அவர்களுடைய’ என்று வெளிப்படையாக இல்லை; மேலும் ὡσαύτως இணைத் தகுதிப் பட்டியலைத் தொடங்குகிறது. ஆகவே முதன்மை உரை ‘பெண்கள்’ என்று பரந்தவாறு தரப்பட்டு, ‘மனைவிகள்’ என்ற வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் கொண்ட எளிய நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத வினை தமிழில் முழுமையான வாக்கியத்திற்காக ‘இருக்க வேண்டும்’ என்று இயல்பாக நிரப்பப்பட்டுள்ளது.
