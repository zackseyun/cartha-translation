id: 1TI.3.10
reference: 1 Timothy 3:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: ta
  text: இவர்களும் முதலில் சோதிக்கப்படட்டும்; பின்னர், குற்றஞ்சாட்ட இடமில்லாதவர்களாக[b] இருந்து, அவர்கள் சேவை செய்யட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அதாவது, அவர்களுக்கு எதிராக நிலைநிற்கக்கூடிய குற்றச்சாட்டு எதுவும் இல்லாதவர்களாக; இது அவர்கள் பாவமே இல்லாதவர்கள் என்று பொருளல்ல.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὗτοι
  choice: இவர்களும்
  rationale: முன்னர் பேசப்பட்ட உதவிப் பணியாளர்களுக்கான தகுதியை நாடுபவர்களைச் சுட்டுகிறது; δέ தரும் தொடர்ச்சியான சேர்க்கைப் பொருளையும் ‘உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δοκιμαζέσθωσαν πρῶτον
  choice: முதலில் சோதித்து அறியப்படட்டும்
  rationale: δοκιμάζω என்பது ஒருவரின் தகுதி அல்லது நம்பகத்தன்மையைச் சோதித்து உறுதிப்படுத்துவதை குறிக்கிறது. மூலத்தின் passive imperative-ஐயும் பணிக்கு முன் நடைபெறும் வரிசையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: εἶτα
  choice: பின்னர்
  rationale: சோதனைக்குப் பின்பே சேவை தொடங்க வேண்டும் என்ற காலவரிசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: διακονείτωσαν
  choice: உதவிப் பணியாளர்களாகச் சேவை செய்யட்டும்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘சேவை செய்தல்.’ ஆனால் உடனடிச் சூழல் உதவிப் பணியாளர்களின் தகுதிகளைப் பற்றியது என்பதால், பணிப் பொறுப்பு சார்ந்த பொருளைத் தமிழில் வெளிப்படையாக்குகிறது; பொதுவான ‘சேவை செய்யட்டும்’ என்ற வாசிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ἀνέγκλητοι ὄντες
  choice: குற்றஞ்சாட்ட இடமில்லாதவர்களாக இருந்தால்
  rationale: செல்லத்தக்க குற்றச்சாட்டுக்கு இடமில்லாத நிலையை இது குறிக்கிறது; பாவமே இல்லாத முழுநிறைவை அல்ல. பங்கேற்புவினை இங்கு சேவை செய்வதற்கான சூழ்நிலை அல்லது தகுதியைக் குறிப்பதால், தமிழில் இயல்பான நிபந்தனை வடிவில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: διακονείτωσαν என்பது பொதுவான சேவையையா, உதவிப் பணியாளர் பொறுப்பில் சேவை செய்வதையா குறிக்கிறது?
  choice: உதவிப் பணியாளர்களாகச் சேவை செய்யட்டும்
  alternative: சேவை செய்யட்டும்
  rationale: உடனடிச் சூழல் சபையின் உதவிப் பணியாளர்களுக்கான தகுதிகளைப் பற்றியது. எனவே பொறுப்பு சார்ந்த பொருள் முதன்மை உரையில் தெளிவாக்கப்படுகிறது; கிரேக்க வினைச்சொல்லின் பொதுவான சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀνέγκλητοι என்பது பாவமற்ற நிலையைக் குறிக்கிறதா?
  choice: குற்றஞ்சாட்ட இடமில்லாதவர்கள்
  alternative: குற்றமற்றவர்கள்
  rationale: இச்சொல் நியாயமான அல்லது நிலைநிற்கக்கூடிய குற்றச்சாட்டுக்கு ஆளாகாத நிலையைக் குறிக்கிறது; முழுமையான பாவமின்மையை அல்ல. ‘குற்றமற்றவர்கள்’ என்ற சொல் அந்த வேறுபாட்டை மங்கச் செய்யலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உதவிப் பணியாளர்’ என்பது சூழலில் உள்ள சபைப் பொறுப்பைத் தெளிவாக்குகிறது; ‘திருத்தொண்டர்’ போன்ற மரபு அல்லது பிரிவுசார் நிழலுள்ள சொல்லைத் தவிர்க்கிறது. அரைப்புள்ளி மூலத்தில் உள்ள சோதனை—பின்னர் சேவை என்ற வரிசையைத் தெளிவாகப் பிரிக்கிறது.
