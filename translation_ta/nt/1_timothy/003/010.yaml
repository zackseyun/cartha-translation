revisions:
- from: இவர்களும் முதலில் சோதித்து அறியப்படட்டும்; பின்னர், குற்றஞ்சாட்ட இடமில்லாதவர்களாக இருந்தால்[b], உதவிப் பணியாளர்களாகச் சேவை செய்யட்டும்[a].
  to: இவர்களும் முதலில் சோதிக்கப்படட்டும்; பின்னர், குற்றஞ்சாட்ட இடமில்லாதவர்களாக[b] இருந்து, அவர்கள் சேவை செய்யட்டும்.
  rationale: The revision translates δοκιμαζέσθωσαν directly as ‘சோதிக்கப்படட்டும்,’ retains the sequence marked by πρῶτον and εἶτα, renders διακονείτωσαν without adding an unstated office noun, and preserves ἀνέγκλητοι ὄντες as a participial characterization rather than an ‘if’ condition. The remaining footnote is correctly anchored to the term it explains.
