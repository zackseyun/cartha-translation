  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: ta
  text: எல்லா மனிதர்களும் இரட்சிக்கப்படவும், உண்மையைப் பற்றிய அறிவை அடையவும் அவர் விரும்புகிறார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சித்தம் கொள்கிறார்.’ கிரேக்க வினைச்சொல்லை ‘விரும்புகிறார்,’ ‘வேண்டுகிறார்,’ அல்லது ‘சித்தம் கொள்கிறார்’ என்றும் மொழிபெயர்க்கலாம். வசனத்தின் சொற்களைக் கடந்த இறையியல் விவாதத்தைத் தீர்மானிக்காமல் இருக்க ‘விரும்புகிறார்’ என்பது பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உண்மையைப் பற்றிய முழுமையான அறிவை அடையவும்.’ இங்குள்ள கிரேக்கப் பெயர்ச்சொல் இன்னும் நிறைவான அல்லது முழுமையான அறிவு என்ற நுணுக்கத்தையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: அவர்
  rationale: இது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கடவுளைக் குறிக்கும் தொடர்புப்பெயர். தனி வசனமாகத் தமிழில் இயல்பாகவும் தெளிவாகவும் அமைய, அதன் தொடர்பை ‘அவர்’ என வெளிப்படுத்துவது பொருத்தமானது.
- source_word: πάντας ἀνθρώπους
  choice: எல்லா மனிதர்களும்
  rationale: ἄνθρωπος இங்கு ஆண்களை மட்டும் அல்ல, மனிதர்கள் அனைவரையும் குறிக்கிறது. ‘எல்லா மனிதர்களும்’ என்பது அதன் இயல்பான உலகளாவிய பரப்பைக் குறைக்காமல் தருகிறது.
- source_word: θέλει
  choice: விரும்புகிறார்
  rationale: θέλω என்பதற்கு விரும்புதல், வேண்டுதல், சித்தங்கொள்ளுதல் ஆகிய பொருள்கள் இருக்கலாம். ‘விரும்புகிறார்’ என்பது வினையின் பொருளைத் தெளிவாகத் தருவதோடு, கடவுளின் சித்தத்தைப் பற்றிய தத்துவ விவாதத்தை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் விடுகிறது.
- source_word: σωθῆναι
  choice: மீட்கப்படவும்
  rationale: இது σῴζω என்பதன் செயப்பாட்டு infinitive வடிவம்; பவுலின் சூழலில் இரட்சிப்பைச் சுட்டுகிறது. ‘மீட்கப்பட’ என்பது இன்றைய தமிழில் புரியக்கூடிய, இறையியல் பொருளையும் தக்கவைக்கும் சொல்.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: உண்மையைப் பற்றிய அறிவை
  rationale: ἐπίγνωσις அறிவு, அறிதல், அல்லது முழுமையான அறிவு என்ற நுணுக்கத்தைக் கொண்டிருக்கலாம். ‘உண்மையைப் பற்றிய அறிவு’ என்பது அடிப்படைப் பொருளை இயல்பாகத் தருகிறது; ‘முழுமையான’ என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐλθεῖν
  choice: அடையவும்
  rationale: ἔρχομαι + εἰς இங்கு ஓர் அறிவுநிலைக்கு வருவதைச் சொல்கிறது. தமிழில் ‘அறிவை அடைய’ என்பது சொற்பொருளைச் சற்றே மாற்றாமல் அந்த இயக்கத்தையும் இலக்கையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πάντας ἀνθρώπους என்பதன் பரப்பும் கடவுளின் இரட்சிப்பு விருப்பமும்
  choice: ‘எல்லா மனிதர்களும்’ என்று நேரடியாகவும், θέλει என்பதை ‘விரும்புகிறார்’ என்றும் மொழிபெயர்த்தல்
  alternative: ‘எல்லா வகையான மனிதர்களும்’; ‘சித்தங்கொள்கிறார்’
  rationale: கிரேக்கச் சொற்றொடர் இயல்பாக எல்லா மனிதர்களையும் உள்ளடக்குகிறது. அதை ‘எல்லா வகையானவர்கள்’ என்று குறுக்குவதோ, θέλει என்பதைத் தொழில்நுட்பமான இறையியல் பொருளுடைய சொல்லால் வலுப்படுத்துவதோ மூலவசனம் தானாகத் தீர்மானிக்காத விவாதத்தைத் தீர்த்துவிடும். ஆகவே உலகளாவிய பரப்பும் இறையியல் அழுத்தமும் அப்படியே பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதையும் கண்ணியமும் கொண்ட நடை. பாலினத்தைக் குறுக்காத ‘மனிதர்கள்’ பயன்படுத்தப்பட்டுள்ளது. இறையியல் விவாதத்தில் ஒரு குறிப்பிட்ட மரபின் முடிவை மொழிபெயர்ப்பு திணிக்கவில்லை.
