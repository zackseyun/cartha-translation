source:
  edition: SBLGNT
  text: ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων, τὸ μαρτύριον καιροῖς ἰδίοις·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: ta
  text: அவர் எல்லாருக்காகவும் தம்மையே மீட்புவிலையாகக் கொடுத்தார்—இதுவே உரிய காலங்களில் அளிக்கப்பட்ட சாட்சி.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எல்லாருக்காகவும்’ என்பதை ‘எல்லாரின் சார்பாகவும்’ என்றும் மொழிபெயர்க்கலாம். இது ஒவ்வொரு தனிநபரையா அல்லது எல்லா வகையான மக்களையா குறிக்கிறது என்பதை கிரேக்கத் தொடர் இங்கே தனியாகத் தீர்மானிப்பதில்லை.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் இந்த இறுதித் தொடர் சுருக்கமாக, ‘உரிய காலங்களில் சாட்சி’ என்று உள்ளது. கிறிஸ்து தம்மையே கொடுத்தது உரிய காலங்களில் வெளிப்படுத்தப்பட்ட சாட்சி என்பது இதன் சாத்தியமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ἑαυτὸν
  choice: தம்மையே கொடுத்தார்
  rationale: இறந்தகாலப் பங்கேற்புவினை முந்தைய வசனத்திலுள்ள கிறிஸ்து இயேசுவைக் குறிக்கிறது. தமிழில் இயல்பான தொடர்புடைய வாக்கியமாக்கப்பட்டு, ἑαυτόν வலியுறுத்தும் தற்கொடையைப் பிரதிபலிக்க ‘தம்மையே’ பயன்படுத்தப்பட்டது.
- source_word: ἀντίλυτρον
  choice: மீட்புவிலையாக
  rationale: விடுதலைக்காகச் செலுத்தப்படும் விலையை இச்சொல் குறிக்கிறது; ἀντί- கூறு மாற்றீட்டு நுண்பொருளையும் கொண்டுள்ளது. ‘மீட்புவிலை’ அடிப்படை மீட்புப் பொருளைக் காக்கிறது; விளக்கத்தை மூலத்துக்கு அப்பால் விரிவுபடுத்துவதில்லை.
- source_word: ὑπὲρ πάντων
  choice: எல்லாருக்காகவும்
  rationale: ὑπέρ என்பதன் ‘சார்பாக/நன்மைக்காக’ என்ற பரப்பையும் πάντων என்பதன் விரிவான பொதுமையையும் இயல்பான தமிழில் காக்கிறது; ‘ஒவ்வொரு தனிநபரும்’ அல்லது ‘எல்லா வகையினரும்’ என்று விவாதத்தைத் தீர்மானிப்பதில்லை.
- source_word: τὸ μαρτύριον
  choice: இதுவே ... சாட்சி
  rationale: முந்தைய தற்கொடையைத் தொகுத்துச் சுட்டும் appositional/resumptive அமைப்பைத் தமிழில் தெளிவாக்க ‘இதுவே’ சேர்க்கப்பட்டது. ‘சாட்சி’ என்பது μαρτύριον என்பதன் செறிவான பெயர்ச்சொல் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: καιροῖς ἰδίοις
  choice: உரிய காலங்களில் அளிக்கப்பட்ட
  rationale: பன்மை καιροῖς காக்கப்படுகிறது. தமிழில் இச்சுருக்கமான கிரேக்கத் தொடரின் உறவைத் தெளிவாக்க ‘அளிக்கப்பட்ட’ பயன்படுத்தப்பட்டது; இது சாட்சி உரிய/நியமிக்கப்பட்ட காலங்களில் வெளிப்பட்டது என்ற இயல்பான பொருளைத் தருகிறது.
theological_decisions:
- issue: கிறிஸ்துவின் மீட்புவிலையுடன் தொடர்புடைய πάντων என்பதன் பரப்பு
  choice: ‘எல்லாருக்காகவும்’ என்று பரந்தவாறே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒவ்வொருவருக்காகவும்’ அல்லது ‘எல்லா வகையினருக்காகவும்’
  rationale: வசனத்தின் பொதுமையான மொழியை அப்படியே காக்கிறது; பிற்கால மீட்பியல் விவாதங்களில் எந்த ஒரு முடிவையும் மொழிபெயர்ப்புக்குள் புகுத்துவதில்லை.
- issue: ἀντίλυτρον என்பதிலுள்ள மாற்றீட்டு வலிமை
  choice: முதன்மை உரையில் ‘மீட்புவிலை’
  alternative: ‘மாற்றீட்டு மீட்புவிலை’ அல்லது ‘பதிலாகச் செலுத்தப்பட்ட மீட்புவிலை’
  rationale: சொல்லில் மாற்றீட்டு நுண்பொருள் இருந்தாலும், அதை விரித்து எழுதுவது மூலத்தின் செறிவை மீறும் அபாயமுள்ளது. அடிப்படை மீட்பு மற்றும் விலை ஆகிய இரண்டையும் ‘மீட்புவிலை’ காக்கிறது.
- issue: τὸ μαρτύριον καιροῖς ἰδίοις தொடரின் இலக்கணத் தொடர்பு
  choice: கிறிஸ்துவின் தற்கொடையே உரிய காலங்களில் அளிக்கப்பட்ட சாட்சி எனத் தொகுத்துக் காட்டப்பட்டது.
  alternative: ‘உரிய காலங்களில் சாட்சி’ என்ற மேலும் சொல்லுக்குச் சொல் அமைப்பு
  rationale: கிரேக்கம் செறிவான appositional தொடராக இருப்பதால் அதன் தொடர்பில் ஓரளவு தெளிவின்மை உள்ளது. தமிழ் வாக்கியம் வாசிக்கத்தக்கவாறு உறவை வெளிப்படுத்துகிறது; மாற்று சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தம்மையே’ தற்கொடையின் வலியுறுத்தலைக் காக்கிறது; ‘மீட்புவிலை’ திருச்சபைச் சூழலிலும் பொதுத் தமிழிலும் புரியக்கூடிய செறிவான சொல். கிரேக்கத்தின் இறுதி appositional தொடரை இயல்பாக்க குறைந்த அளவு இலக்கணத் தெளிவாக்கம் செய்யப்பட்டுள்ளது.
