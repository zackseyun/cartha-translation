reference: 1 Timothy 2:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: ta
  text: இதற்காகவே நான் அறிவிப்பாளராகவும் அப்போஸ்தலராகவும் நியமிக்கப்பட்டேன்[a]—நான் உண்மையைச் சொல்கிறேன்; பொய் சொல்லவில்லை—விசுவாசத்திலும் உண்மையிலும் யூதரல்லாத மக்களின் ஆசிரியராகவும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதற்காக நான் நியமிக்கப்பட்டேனோ அதற்காக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விசுவாசத் தன்மையிலும் உண்மையிலும் மக்களினங்களின் ஆசிரியராகவும்.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: இதற்காகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட சாட்சிக்கும் தேவனுடைய மீட்புத் திட்டத்திற்கும் பின்னோக்கிச் சுட்டுகிறது. நோக்கத்தைக் காட்டும் இயல்பான தமிழாக இது அமைகிறது; தொடர்புச் சொற்றொடராகப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἐτέθην
  choice: நியமிக்கப்பட்டேன்
  rationale: இங்கு τίθημι என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் ஓர் ஊழியப் பொறுப்புக்கு நியமிக்கப்பட்டதைக் குறிக்கிறது; வெறுமனே ஓரிடத்தில் வைக்கப்பட்டதைக் குறிக்கவில்லை.
- source_word: κῆρυξ
  choice: அறிவிப்பாளன்
  rationale: மற்றொருவரின் சார்பில் செய்தியைப் பொதுவாக அறிவிக்கும் அதிகாரப்பூர்வ பிரதிநிதி என்ற நுணுக்கத்தைத் தருகிறது; திருச்சபை வழக்கில் குறிப்பிட்ட பதவியைக் குறிக்கக்கூடிய ‘பிரசங்கியார்’ என்பதைக் காட்டிலும் மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: பவுல் தன்னைக் குறித்துப் பயன்படுத்தும் அங்கீகரிக்கப்பட்ட ஊழியப் பெயரைத் துல்லியமாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: நான் உண்மையைச் சொல்கிறேன்; பொய் சொல்லவில்லை
  rationale: இரட்டை வலியுறுத்தலையும் இடைச்செருகல் தன்மையையும் இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: διδάσκαλος ἐθνῶν
  choice: யூதரல்லாத மக்களின் ஆசிரியன்
  rationale: பவுலின் பயன்பாட்டில் ἔθνη என்பது பெரும்பாலும் யூதரல்லாத மக்களைக் குறிக்கிறது. காலத்துக்கு ஒவ்வாத அல்லது தெளிவற்ற சமயச் சொல்லைத் தவிர்த்து, அதன் சூழல்சார் பொருளை வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: விசுவாசத்திலும் உண்மையிலும்
  rationale: ἐν என்பதன் பரப்பு அல்லது முறையைக் குறிக்கும் திறனையும், πίστις என்பதன் முதன்மைப் பொருளான ‘விசுவாசம்’ என்பதையும் தக்கவைக்கிறது. ‘நம்பிக்கைக்குரிய தன்மை’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பவுலின் பணியில் ἐθνῶν என்பதன் குறிப்பு
  choice: யூதரல்லாத மக்கள்
  alternative: மக்களினங்கள்
  rationale: பவுலின் வழக்கமான சொற்பயன்பாட்டின்படி இது யூதரல்லாதவர்களைக் குறிக்கிறது. இருப்பினும், சொல்லின் பரந்த ‘மக்களினங்கள்’ என்ற பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: ἐν πίστει καὶ ἀληθείᾳ என்பதில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கைக்குரிய தன்மை
  rationale: இங்கு விசுவாசம் பவுலின் போதனைப் பணியின் பரப்பு, உள்ளடக்கம் அல்லது முறையைக் குறிக்கலாம். மூலத்தில் அந்த உறவு முழுமையாகத் தீர்மானிக்கப்படாததால் தமிழிலும் ‘-இல்’ என்ற வடிவில் திறந்தவாறு வைக்கப்படுகிறது; குணப்பண்பைக் குறிக்கும் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘புறஜாதியார்’, ‘பிரசங்கியார்’ போன்ற மரபுசார் அல்லது குறிப்பிட்ட திருச்சபை நிழல் கொண்ட சொற்கள் தவிர்க்கப்பட்டுள்ளன. மூலத்தின் இடைச்செருகல் வலியுறுத்தலை நீள்கோடுகள் காக்கின்றன; ἐν என்பதன் திட்டமிட்ட தெளிவின்மை ‘விசுவாசத்திலும் உண்மையிலும்’ என்ற அமைப்பில் பாதுகாக்கப்படுகிறது.
