id: 1TI.2.11
reference: 1 Timothy 2:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: ta
  text: ஒரு பெண்[a] அமைதியாக[b], முழுமையான கீழ்ப்படிதலுடன் கற்றுக்கொள்ளட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு மனைவி’; கிரேக்கச் சொல் சூழலைப் பொறுத்து ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘மௌனமாக’; கிரேக்கச் சொல் முழுமையான பேச்சின்மையை அவசியம் குறிக்காமல் அமைதியையும் சாந்தமான நிலையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: ஒரு பெண்
  rationale: γυνή என்பதற்கு சூழலைப் பொறுத்து ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். இங்கு திருமண நிலை வெளிப்படையாகக் குறிக்கப்படாததால், ஒருமை வடிவத்தைக் காத்து பொதுவான ‘ஒரு பெண்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐν ἡσυχίᾳ
  choice: அமைதியாக
  rationale: ἡσυχία என்பது முழுமையான மௌனத்தை மட்டுமல்லாமல் அமைதி, சாந்தம், ஆரவாரமற்ற நடத்தை ஆகியவற்றையும் குறிக்கலாம். இயல்பான தமிழில் இந்தப் பொருள் வரம்பைப் பாதுகாக்க ‘அமைதியாக’ பயன்படுத்தப்பட்டது.
- source_word: μανθανέτω
  choice: கற்றுக்கொள்ளட்டும்
  rationale: இது நிகழ்காலச் செயப்பாட்டு மூன்றாம் நபர் ஒருமை ஏவல் வடிவம். ‘கற்றுக்கொள்ளட்டும்’ என்பது கட்டளையின் வலிமையையும் கற்றல் நேர்மறையாகக் கட்டளையிடப்படுவதையும் காக்கிறது.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: முழுமையான கீழ்ப்படிதலுடன்
  rationale: ὑποταγή என்பது கீழ்ப்படிதல் அல்லது பணிந்திருத்தலைக் குறிக்கிறது; πάσῃ அதன் முழுமையை வலியுறுத்துகிறது. கிரேக்கத்தில் கீழ்ப்படிதலுக்குரிய நபர் குறிப்பிடப்படாததால் தமிழிலும் எவரிடம் என்பது சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ἡσυχία முழுமையான மௌனத்தையா அல்லது அமைதியான நடத்தையா குறிக்கிறது?
  choice: அமைதியாக
  alternative: மௌனமாக
  rationale: இச்சொல் ‘மௌனம்’ எனவும் மொழிபெயர்க்கப்படலாம்; எனினும் அதன் பொருள் முழுமையான பேச்சின்மையை அவசியமாக்காமல் அமைதியான, சாந்தமான நிலையையும் உள்ளடக்குகிறது. முதன்மை உரை இதை மிகைப்படுத்தாமல் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: γυνή என்பதை ‘பெண்’ என்றா ‘மனைவி’ என்றா மொழிபெயர்ப்பது?
  choice: ஒரு பெண்
  alternative: ஒரு மனைவி
  rationale: உடனடிச் சூழலில் திருமண உறவு வெளிப்படையாகச் சுட்டப்படவில்லை. ஆகவே ‘பெண்’ என்பது குறிப்பைத் தேவையின்றி குறுக்காத வாசிப்பு; ‘மனைவி’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கற்றுக்கொள்ளட்டும்’ ஏவல் வலிமையை இயல்பாகக் காட்டுகிறது. ‘முழுமையான கீழ்ப்படிதலுடன்’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; கீழ்ப்படிதலின் இலக்கு மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
