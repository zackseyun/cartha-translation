source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: ta
  text: ஆயினும், பிள்ளைப்பேற்றின் வழியாக அவள் மீட்கப்படுவாள்[a]; அவர்கள் விசுவாசத்திலும்[b], அன்பிலும், பரிசுத்தத்திலும் தன்னடக்கத்தோடு நிலைத்திருந்தால்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தப் பிறப்பின் வழியாக.’ இதை ஒரு குறிப்பிட்ட பிறப்பை—ஒருவேளை மேசியாவின் பிறப்பை—குறிப்பதாகச் சிலர் புரிந்துகொள்கிறார்கள்; எனினும் இச்சொற்றொடரைப் பொதுவாக ‘பிள்ளைப்பேற்றின் வழியாக’ என்றும் வாசிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘விசுவாசம்’ என்பதை இங்கு ‘உண்மைத்தன்மை’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்க உரை ஒருமையிலுள்ள ‘அவள் மீட்கப்படுவாள்’ என்பதிலிருந்து பன்மையிலுள்ள ‘அவர்கள் நிலைத்திருந்தால்’ என்பதற்கு மாறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: மீட்கப்படுவாள்
  rationale: σῴζω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம் பவுலின் பயன்பாட்டில் பொதுவாக இறையியல் சார்ந்த ‘மீட்கப்படுதல்’ என்ற பொருளைக் கொண்டுள்ளது. ‘பாதுகாக்கப்படுவாள்’ என்பது உடல் பாதுகாப்பு என்ற பொருளுக்கு தேவையின்றி குறுக்கிவிடக்கூடும்.
- source_word: δὲ
  choice: ஆயினும்
  rationale: முந்தைய கூற்றிலிருந்து மென்மையான மாறுபாட்டை அல்லது எதிர்நிலையை δέ குறிக்கிறது; ‘ஆயினும்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διὰ τῆς τεκνογονίας
  choice: பிள்ளைப்பேற்றின் வழியாக
  rationale: τεκνογονία பிள்ளை பெறுதலைக் குறிக்கிறது. கிரேக்கக் குறிப்புச்சொல் பொதுப்பொருளிலோ ஒரு குறிப்பிட்ட பேற்றைக் குறிப்பதாகவோ புரிந்துகொள்ளப்படலாம்; முதன்மை உரை இயல்பான பொதுப்பொருளை வைத்துக்கொண்டு மாற்றுப் புரிதலை அடிக்குறிப்பில் தருகிறது.
- source_word: ἐὰν
  choice: நிலைத்திருந்தால்
  rationale: ἐάν நிபந்தனையை அறிமுகப்படுத்துவதால், தமிழில் வினைமுற்றோடு இணைந்த ‘-ஆல்’ வடிவம் இயல்பாக நிபந்தனையை வெளிப்படுத்துகிறது.
- source_word: μείνωσιν
  choice: நிலைத்திருந்தால்
  rationale: μένω இங்கு ஒரு நிலையில் தொடர்ந்து நிலைத்திருப்பதைக் குறிக்கிறது. ‘நிலைத்திரு’ நம்பிக்கை மற்றும் ஒழுக்கப் பண்புகளில் தொடர்வதைத் தெளிவாகச் சொல்கிறது.
- source_word: ἐν πίστει
  choice: விசுவாசத்தில்
  rationale: πίστις என்பதற்கான வழக்கமான இறையியல் தமிழ்ச் சொல் ‘விசுவாசம்’. இச்சூழலில் ‘உண்மைத்தன்மை’ என்ற நுண்பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀγάπῃ
  choice: அன்பில்
  rationale: ἀγάπη என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல் ‘அன்பு’.
- source_word: ἁγιασμῷ
  choice: பரிசுத்தத்தில்
  rationale: ἁγιασμός பரிசுத்த நிலை அல்லது பரிசுத்தமாக்கப்படுதலைக் குறிக்கலாம். பண்புகளின் பட்டியலில் ‘பரிசுத்தம்’ இயல்பாகவும் இறையியல் தொழில்நுட்பச் சுமை குறைவாகவும் உள்ளது.
- source_word: μετὰ σωφροσύνης
  choice: தன்னடக்கத்தோடு
  rationale: σωφροσύνη தன்னடக்கம், தெளிந்த மதிப்பீடு, நிதானம் ஆகிய பொருட்களை உடையது. இங்கு ஒழுக்கப் பண்பை ‘தன்னடக்கத்தோடு’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவள் மீட்கப்படுவாள்’ என்ற ஒருமையிலிருந்து ‘அவர்கள் ... நிலைத்திருந்தால்’ என்ற பன்மைக்கு மாறுதல்
  choice: கிரேக்க உரையின் ஒருமை–பன்மை மாற்றத்தைத் தமிழிலும் அப்படியே வைத்தல்
  alternative: இரண்டையும் பொதுவாகப் பெண்களைக் குறிப்பதாக ஒத்திசைத்து மொழிபெயர்த்தல்; அல்லது ‘அவள்’ என்பதை ஏவாளாகவும் ‘அவர்கள்’ என்பதைப் பெண்கள் பொதுவாகவும் வெளிப்படையாக விளக்குதல்
  rationale: மூல உரையே ஒருமையிலிருந்து பன்மைக்கு மாறுகிறது. இதைச் சீராக்குவது குறிப்பிடத்தக்க இலக்கண மற்றும் விளக்கத் திணறலை மறைத்துவிடும்.
- issue: ‘பிள்ளைப்பேற்றின் வழியாக மீட்கப்படுவாள்’ என்பதன் பொருள்
  choice: மீட்பின் தன்மையையோ பிள்ளைப்பேற்றின் குறிப்பிட்ட அடையாளத்தையோ முதன்மை உரையில் தீர்மானிக்காமல் சொற்றொடரின் திறந்த தன்மையைப் பேணுதல்
  alternative: பிரசவத்தில் உடலளவில் பாதுகாக்கப்படுவாள்; தாய்மையை ஏற்றதால் மீட்கப்படுவாள்; மேசியாவின் பிறப்பின் வழியாக மீட்கப்படுவாள்
  rationale: இச்சொற்றொடர் உண்மையாகவே பலவிதமாகப் புரிந்துகொள்ளப்படுகிறது. கிரேக்கம் உடல் பாதுகாப்பையோ தாய்மைப் பணியையோ மேசியாவின் பிறப்பையோ வெளிப்படையாகத் தீர்மானிக்கவில்லை; ஆகவே மொழிபெயர்ப்பு ஒரு தனிப்பட்ட கோட்பாட்டைச் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மீட்கப்படுவாள்’, ‘விசுவாசம்’, ‘பரிசுத்தம்’ ஆகியவை வேதாகமச் சூழலில் பரிச்சயமான சொற்களாக இருந்தாலும் வாக்கிய அமைப்பு இயல்பாக வைக்கப்பட்டுள்ளது. மூலத்தின் ஒருமை–பன்மை மாற்றமும் இறையியல் தெளிவின்மையும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
