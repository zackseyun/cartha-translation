  text: 'but with what is proper for women professing godliness: good works[a][b][c].'
translation:
  language: ta
  text: மாறாக, தேவபக்தி[b] உடையவர்கள் எனக் கூறிக்கொள்ளும் பெண்களுக்குத் தகுந்தவையான[a] நற்செயல்களால்[c] தங்களை அலங்கரித்துக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொருத்தமானவையான” அல்லது “ஏற்றவையான.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுள்மீது கொண்ட பக்தி” அல்லது “கடவுளுக்கான அர்ப்பணிப்பு.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “நற்செயல்களின் மூலமாக.” இங்கே நற்செயல்களே தகுந்த அலங்காரம் என்பது கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: மாறாக
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வெளிப்புற அலங்காரத்திற்கு மாறான, பொருத்தமான அலங்காரத்தை அறிமுகப்படுத்தும் எதிர்மறை இணைப்பாக வருகிறது.
- source_word: ὃ πρέπει
  choice: ஏற்றதானவற்றால்
  rationale: ‘பொருத்தமானது/தகுந்தது’ என்ற ஒழுக்கத் தகுதியின் கருத்தைப் பேணுகிறது; முந்தைய வசனத்திலிருந்து தொடரும் அலங்காரக் கருத்தோடு தமிழில் இயல்பாக இணைகிறது.
- source_word: γυναιξὶν
  choice: பெண்களுக்கு
  rationale: இச்சூழலில் இது மனைவிகளை மட்டும் அல்லாமல் பொதுவாகப் பெண்களைக் குறிக்கிறது.
- source_word: ἐπαγγελλομέναις
  choice: அறிக்கையிடும்
  rationale: ஒரு நிலைப்பாட்டையோ பக்தியையோ தமக்குரியதாக வெளிப்படையாகக் கூறுதல் என்ற பொருளைத் தருகிறது; வாக்குறுதி செய்வது என்ற மிகைப்படுத்தப்பட்ட பொருளைத் தவிர்க்கிறது.
- source_word: θεοσέβειαν
  choice: இறைப்பற்று
  rationale: கடவுள்மீது கொண்ட பயபக்தியும் அர்ப்பணிப்பும் வெளிப்படும் வாழ்வையும் குறிக்கும் சொல்லாக, நவீன தமிழில் சுருக்கமாகவும் புரியத்தக்கதாகவும் உள்ளது.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: நற்செயல்களால்
  rationale: διά + genitive என்பதன் ‘மூலமாக/வழியாக’ என்ற வடிவத்தைப் பேணுகிறது; இச்சூழலில் நற்செயல்களே தகுந்த அலங்காரம் என்பதைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: நற்செயல்களுக்கும் இறைப்பற்றை அறிக்கையிடுவதற்கும் உள்ள தொடர்பு
  choice: இறைப்பற்றை அறிக்கையிடும் பெண்களுக்கு நற்செயல்கள் தகுந்த வெளிப்புற வெளிப்பாடும் அலங்காரமும் ஆகின்றன.
  alternative: நற்செயல்கள் கடவுளால் ஏற்றுக்கொள்ளப்படுவதற்கான புண்ணிய அடிப்படை என்று வாசித்தல்.
  rationale: இலக்கணமும் முந்தைய வசனத்துடனான முரணமைப்பும் வெளிப்புற அலங்காரத்திற்குப் பதிலாகத் தகுந்த நடத்தையைச் சுட்டுகின்றன; இரட்சிப்பைப் பெறுவதில் செயல்களின் பங்கு குறித்து இவ்வசனம் நேரடியாகச் சொல்லாத கோட்பாட்டை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. முந்தைய வசனத்திலிருந்து தொடரும் ‘அலங்கரித்துக்கொள்ள வேண்டும்’ என்ற வினை தமிழில் வாக்கியத்தை இயல்பாக நிறைவு செய்ய வெளிப்படையாகத் தரப்பட்டுள்ளது; ‘அதாவது’ என்பது நற்செயல்கள் எதற்குத் தகுந்த அலங்காரம் என்பதைத் தெளிவாக்குகிறது.
