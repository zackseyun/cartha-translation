source:
  edition: SBLGNT
  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: ta
  text: ஆகவே, ஆண்கள் எல்லா இடங்களிலும் கோபமோ வாக்குவாதமோ இல்லாமல் பரிசுத்தமான கைகளை உயர்த்தி ஜெபிக்க வேண்டும் என்று விரும்புகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோபமோ ஐயமோ இல்லாமல்.” கிரேக்கச் சொல் உள்ளார்ந்த சிந்தனை அல்லது ஐயத்தைக் குறிக்கலாம்; ஆனால் இங்கு கோபத்துடன் இணைந்திருப்பதால், சச்சரவான வாக்குவாதத்தைக் குறிப்பதாகத் தோன்றுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βούλομαι
  choice: விரும்புகிறேன்
  rationale: இது விருப்பத்தையும் மனவுறுதியையும் வெளிப்படுத்துகிறது; நவீனத் தமிழில் இயல்பாகவும் பவுலின் வழிகாட்டும் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையோடு உள்ள முடிவுறுத்தும் அல்லது தொடர்ச்சியான தொடர்பைக் காட்டுகிறது.
- source_word: προσεύχεσθαι
  choice: மன்றாட வேண்டும்
  rationale: தேவனை நோக்கிச் செய்யும் ஜெபத்தை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; βούλομαι என்பதுடன் இணைந்து விருப்பத்தோடு கூடிய வழிகாட்டுதலாக அமைகிறது.
- source_word: τοὺς ἄνδρας
  choice: ஆண்கள்
  rationale: ἀνήρ இங்கு பொதுவாக மனிதர்கள் என்றல்ல, பாலினக் குறிப்புடன் ஆண்கள் எனப் பொருள்படுவது சுற்றியுள்ள சூழலுடன் பொருந்துகிறது.
- source_word: ἐν παντὶ τόπῳ
  choice: எல்லா இடங்களிலும்
  rationale: ஒவ்வோர் இடத்தையும் உள்ளடக்கும் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐπαίροντας
  choice: உயர்த்தி
  rationale: மன்றாட்டுடன் நிகழும் உடல் நிலை அல்லது செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁσίους χεῖρας
  choice: பரிசுத்தமான கைகளை
  rationale: ὅσιος என்பதன் தேவனுக்கேற்ற தூய, பக்தியுள்ள நடத்தை சார்ந்த பொருளை நேரடியாகத் தெரிவிக்கிறது.
- source_word: χωρὶς
  choice: இல்லாமல்
  rationale: குறிப்பிடப்பட்ட மனநிலைகளும் செயல்களும் இல்லாதிருப்பதை இயல்பாகக் குறிக்கிறது.
- source_word: ὀργῆς
  choice: கோபம்
  rationale: தனிநபர்களுக்கிடையிலான சூழலில் ὀργή என்பதன் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: διαλογισμοῦ
  choice: வாக்குவாதம்
  rationale: சொல் உள்ளார்ந்த சிந்தனை அல்லது ஐயத்தையும் குறிக்கக்கூடும்; இங்கு கோபத்துடன் இணைந்து சபைக் கூடுகையில் ஏற்படும் முரண்பாடான விவாதத்தைக் குறிக்கும் வாய்ப்பு அதிகம்.
theological_decisions:
- issue: τοὺς ἄνδρας என்பதன் பாலினக் குறிப்பு
  choice: ஆண்கள்
  alternative: மக்கள் / அனைவரும் / கணவர்கள்
  rationale: சுற்றியுள்ள வசனங்களில் ஆண்களுக்கும் பெண்களுக்கும் தனித்தனியான அறிவுறுத்தல்கள் வருவதால், மூலத்தின் குறிப்பிட்ட ஆண்பால் பொருளைத் தக்கவைக்கிறது; பொதுப்படுத்துவதோ திருமண உறவைத் தேவையின்றி சேர்ப்பதோ தவிர்க்கப்படுகிறது.
- issue: மன்றாட்டுச் சூழலில் διαλογισμοῦ என்பதன் பொருள்
  choice: வாக்குவாதம்
  alternative: ஐயம் / சந்தேகம் / விவாதம்
  rationale: கோபத்துடன் இணைந்திருப்பதால் சண்டைத் தன்மையுள்ள வாதமே சூழலுக்கு மிகப் பொருத்தமானது. எனினும், உள்ளார்ந்த ஐயம் என்ற அகராதிசார் வாய்ப்பை அடிக்குறிப்பில் தக்கவைத்து உண்மையான தெளிவின்மையை மறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “மன்றாட” என்பது தேவனை நோக்கிய ஜெபத்தைத் தெளிவாகக் குறிக்கிறது; “ஆண்கள்” என்பது மூலத்தின் பாலினக் குறிப்பைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் வைக்கப்பட்டுள்ளது.
