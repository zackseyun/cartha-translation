source:
  edition: SBLGNT
  text: ⸀τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: ta
  text: இது நல்லதும், நம் மீட்பரான கடவுளின் பார்வையில் ஏற்றுக்கொள்ளத்தக்கதும் ஆகும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: இது
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட வேண்டுதலையும் அதன் நோக்கத்தையும் பின்னோக்கிச் சுட்டும் நடுநிலை ஒருமைச் சுட்டுப்பெயர்; தமிழில் இயல்பாகவும் குறிப்பை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: καλὸν
  choice: நல்லது
  rationale: இங்கு அழகைக் காட்டிலும் ஒழுக்கரீதியான நன்மையையும் தகுதியையும் குறிக்கிறது; ‘நல்லது’ அதன் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: ἀπόδεκτον
  choice: ஏற்றுக்கொள்ளத்தக்கது
  rationale: வரவேற்கப்படுவது அல்லது சாதகமாக ஏற்றுக்கொள்ளப்படுவது என்ற மதிப்பீட்டுப் பொருளை நேரடியாகத் தருகிறது; ‘பிரியமானது’ என்பதைக் காட்டிலும் குறைவாக விளக்கமளிக்கும் மொழிபெயர்ப்பு.
- source_word: ἐνώπιον
  choice: பார்வையில்
  rationale: கடவுளின் முன்னிலையில் என்ற இடப்பொருளைவிட, அவருடைய மதிப்பீட்டில் என்ற கருத்து இச்சூழலில் முன்னிலை பெறுகிறது; ‘பார்வையில்’ இரண்டையும் இயல்பாகத் தாங்குகிறது.
- source_word: σωτῆρος
  choice: மீட்பர்
  rationale: காப்பாற்றி விடுவிப்பவரைக் குறிக்கும் பட்டப்பெயர்; புதிய ஏற்பாட்டுத் தமிழில் தெளிவாகவும் இறையியல் நிறையைப் பாதுகாக்கும் வகையிலும் உள்ளது.
- source_word: ἡμῶν
  choice: நம்
  rationale: ‘மீட்பர்’ என்பதைச் சார்ந்த முதலாம் நபர் பன்மை உரிமையை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: θεοῦ
  choice: கடவுள்
  rationale: ‘மீட்பர்’ என்பதுடன் ஒரே நபரை அடையாளப்படுத்தும் இணைப்பாக உள்ளது; ‘நம் மீட்பரான கடவுள்’ என்ற தமிழ் அமைப்பு இதைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: τοῦ σωτῆρος ἡμῶν θεοῦ என்பதில் உள்ள இணைப்புறவு
  choice: நம் மீட்பரான கடவுள்
  alternative: நம் மீட்பராகிய கடவுள்; நம் மீட்பர் கடவுள்
  rationale: கிரேக்கச் சொற்றொடர் கடவுளையே ‘நம் மீட்பர்’ என்று அடையாளப்படுத்துகிறது. ‘-ஆன’ அமைப்பு இவ்விணைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; உரைக்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் இரண்டு இணை மதிப்பீடுகளான ‘நல்லது’ மற்றும் ‘ஏற்றுக்கொள்ளத்தக்கது’ ஆகியவை தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
