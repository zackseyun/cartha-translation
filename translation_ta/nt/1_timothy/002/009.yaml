  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: ta
  text: அவ்வாறே, பெண்களும் கண்ணியமான உடையுடன்[a], நாணத்தோடும் தன்னடக்கத்தோடும் தங்களை அலங்கரித்துக்கொள்ள வேண்டும்; தலைமுடிப் பின்னல்களாலும் தங்கத்தாலும், முத்துகளாலும், விலையுயர்ந்த ஆடைகளாலும் அல்ல[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கண்ணியமான உடை’ என்பதை ‘தகுந்த உடை’ அல்லது ‘அடக்கமான ஆடை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தலைமுடிப் பின்னல்கள், தங்கம், முத்துகள், விலையுயர்ந்த ஆடைகள்’ என்பது எல்லாச் சூழல்களிலும் பின்னல்களையோ நகைகளையோ முற்றிலும் தடை செய்வதைவிட, செல்வத்தைப் பகட்டாகக் காட்டும் அலங்காரத்தைக் குறிப்பதாக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: அவ்வாறே, பெண்களும்
  rationale: ὡσαύτως முந்தைய அறிவுறுத்தலோடு இதை இணைக்கிறது; καί தரும் சேர்க்கைப் பொருளை ‘பெண்களும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γυναῖκας
  choice: பெண்கள்
  rationale: γυνή என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். ஆனால் திருமணத்தைக் குறிக்கும் தெளிவான அடையாளம் இங்கு இல்லாததால் பொதுவான ‘பெண்கள்’ பொருத்தமானது.
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: கண்ணியமான உடையுடன்
  rationale: καταστολή உடை அல்லது அணிவகையையும், κόσμιος ஒழுங்கான, தகுந்த, மதிப்புக்குரிய தன்மையையும் குறிக்கிறது. இவ்விரண்டையும் நவீன தமிழில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μετὰ αἰδοῦς
  choice: நாணத்தோடு
  rationale: αἰδώς தகாதவற்றைத் தவிர்க்கத் தூண்டும் நாணம், அடக்கம், மரியாதை உணர்வு ஆகியவற்றைக் குறிக்கிறது. உடை மற்றும் நடத்தையின் சூழலில் ‘நாணம்’ நேரடியான சமமான சொல்.
- source_word: σωφροσύνης
  choice: தன்னடக்கத்தோடு
  rationale: σωφροσύνη தெளிந்த சிந்தனை, நிதானம், சுயக்கட்டுப்பாடு ஆகியவற்றை உள்ளடக்குகிறது; இங்கு ‘தன்னடக்கம்’ அதன் நடைமுறைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: κοσμεῖν ἑαυτάς
  choice: தங்களை அலங்கரித்துக்கொள்ள வேண்டும்
  rationale: κοσμέω அலங்கரித்தல் அல்லது ஒழுங்குபடுத்துதல் என்று பொருள்படும். ‘வேண்டும்’ என்பது சூழலில் உள்ள அறிவுறுத்தல் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μὴ ἐν πλέγμασιν
  choice: தலைமுடிப் பின்னல்களால் அல்ல
  rationale: πλέγματα பின்னப்பட்ட தலைமுடி அமைப்புகளைக் குறிக்கிறது. ‘தலைமுடிப் பின்னல்கள்’ என்பது பொருளைத் தெளிவுபடுத்துகிறது; ‘அல்ல’ கிரேக்கத்தின் எதிர்மறை முரணைத் தக்கவைக்கிறது.
- source_word: χρυσίῳ
  choice: தங்கம்
  rationale: சொல் தங்கத்தையே குறிப்பிடுகிறது; ‘நகை’ என்று வடிவத்தைத் தேவையின்றிக் குறுக்காமல் மூலத்தின் பரந்த பொருள் காக்கப்படுகிறது.
- source_word: μαργαρίταις
  choice: முத்துகள்
  rationale: இச்சொல்லின் வழக்கமான நேரடிப் பொருள்; ஆடம்பர அலங்காரப் பட்டியலின் ஒரு பகுதி.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: விலையுயர்ந்த ஆடைகள்
  rationale: ἱματισμός ஆடையையும் πολυτελής அதிக விலையுள்ள அல்லது செலவுமிக்க தன்மையையும் குறிக்கின்றன. ‘விலையுயர்ந்த ஆடைகள்’ தெளிவான நவீனத் தமிழ்.
theological_decisions:
- issue: இவ்வசனம் பொதுவாகப் பெண்களைக் குறிக்கிறதா, மனைவிகளை மட்டும் குறிக்கிறதா?
  choice: பெண்கள் பொதுவாக
  alternative: மனைவிகள் மட்டும்
  rationale: பன்மையான γυναῖκας என்பதைக் ‘மனைவிகள்’ என்று வரையறுக்க திருமணச் சூழல் குறியீடுகள் இங்கு இல்லை. ஆகவே கிரேக்கத்தின் பரந்த குறிப்பை ‘பெண்கள்’ காக்கிறது.
- issue: பின்னல்கள், தங்கம், முத்துகள், விலையுயர்ந்த ஆடைகள் ஆகியவற்றுக்கு இது முழுமையான தடையா, அல்லது ஆடம்பரக் காட்சியை எதிர்க்கிறதா?
  choice: மூலப் பட்டியலை நேரடியாக வைத்துக் கொண்டு, சூழலில் ஆடம்பரமான வெளிப்பாட்டுடனான முரணை அடிக்குறிப்பில் சுட்டுதல்
  alternative: எல்லாச் சூழல்களிலும் இவற்றின் ஒவ்வொரு பயன்பாட்டுக்கும் முழுமையான தடை என்று மொழிபெயர்த்தல்
  rationale: வாக்கிய அமைப்பு கண்ணியம், நாணம், தன்னடக்கம் ஆகியவற்றை வெளிப்படையான செல்வக் காட்சியுடன் எதிர்நிறுத்துகிறது. எனினும் மூலத்தில் உள்ள தடையின் வலிமையை உரையில் மெலிதாக்காமல் பட்டியல் அப்படியே காக்கப்படுகிறது; அதன் பண்பாட்டுச் சூழல் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நாணம்’ மற்றும் ‘தன்னடக்கம்’ பொதுவாகப் புரியும் சொற்களாக இருந்து αἰδώς–σωφροσύνη இணையை வேறுபடுத்திக் காட்டுகின்றன. ‘அலங்கரித்துக்கொள்ள வேண்டும் … அல்ல’ என்ற அமைப்பு மூலத்தின் நேர்மறை அறிவுறுத்தலையும் எதிர்மறை முரணையும் காக்கிறது.
