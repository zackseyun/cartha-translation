source:
  edition: SBLGNT
  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: ta
  text: ஏனெனில், கடவுள் ஒருவரே; கடவுளுக்கும் மனிதர்களுக்கும் இடையில் மத்தியஸ்தரும் ஒருவரே—மனிதனாகிய மெசியா இயேசு.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘மனிதன், மெசியா இயேசு.’ கிரேக்கத்தில் ἄνθρωπος என்பதற்கு முன் உருபு இல்லை; இங்கு அது மத்தியஸ்தராகிய இயேசுவின் மனிதத்தன்மையை எடுத்துக்காட்டுகிறது.
    reason: literal_rendering
  - marker: b
    text: அல்லது, ‘கிறிஸ்து இயேசு.’ Χριστός என்பது ‘மெசியா’ என்று பொருள்படும் பட்டம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς
  choice: ஒருவரே
  rationale: இரு இடங்களிலும் ‘ஒருவரே’ என்று மொழிபெயர்த்து, ஒரே கடவுள்—ஒரே மத்தியஸ்தர் என்ற அழுத்தமான இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: θεός
  choice: கடவுள்
  rationale: θεός என்பதற்கான இயல்பான, நவீன பொதுத்தமிழ்ச் சொல்.
- source_word: μεσίτης
  choice: மத்தியஸ்தர்
  rationale: இரு தரப்பினருக்கு இடையில் நின்று உறவை அல்லது சமரசத்தை ஏற்படுத்துபவரைக் குறிக்கும் துல்லியமான, தமிழில் நிலைபெற்ற சொல்.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: கடவுளுக்கும் மனிதர்களுக்கும் இடையில்
  rationale: கிரேக்கத்தில் இரண்டும் உடைமை வேற்றுமையில் இருந்தாலும், μεσίτης உடன் அவை தொடர்பின் இரு தரப்புகளைக் குறிக்கின்றன; தமிழில் ‘இடையில்’ என்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἄνθρωπος
  choice: மனிதராகிய
  rationale: இயேசுவின் உண்மையான மனிதத்தன்மையைத் தெளிவாகக் கூறுவதோடு, மூலத்தின் பெயர்ச்சொல் சார்ந்த வலிமையையும் முடிந்தவரை தக்கவைக்கிறது. ‘மனிதர்களுக்கும் … மனிதராகிய’ என்ற சொல் தொடர்பும் பாதுகாக்கப்படுகிறது.
- source_word: Χριστὸς
  choice: மெசியா
  rationale: இங்கு Χριστός இயேசுவின் பட்டமாகச் செயல்படுவதால், ஒலிபெயர்க்கப்பட்ட மரபுச் சொல்லான ‘கிறிஸ்து’ என்பதற்குப் பதிலாக அதன் பட்டப் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்படுகிறது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
theological_decisions:
- issue: ἀνθρώπων / ἄνθρωπος என்ற சொற்களின் தொடர்பு
  choice: மனிதர்களுக்கும் … மனிதராகிய
  alternative: மக்களுக்கும் … மனிதனான
  rationale: மனிதகுலத்தைக் குறிக்கும் பன்மைக்கும் இயேசுவைக் குறிக்கும் ஒருமைக்கும் இடையிலான மூலச்சொல் தொடர்பைப் பாதுகாத்து, அவருடைய உண்மையான மனிதத்தன்மையையும் பிரதிநிதித்துவப் பங்கையும் வெளிப்படுத்துகிறது.
- issue: Χριστός என்பதன் பட்டத் தன்மை
  choice: மெசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός இங்கு வெறும் பெயரின் ஒரு பகுதியாக அல்லாமல் பட்டமாகச் செயல்படுகிறது; ஆகவே அதன் மெசியா சார்ந்த பொருள் நேரடியாகத் தெரிவிக்கப்படுகிறது.
- issue: ἄνθρωπος Χριστὸς Ἰησοῦς என்பதன் கிறிஸ்தியல் அழுத்தம்
  choice: இயேசுவின் மனிதத்தன்மையை நேரடியாக உறுதிப்படுத்துதல்
  alternative: அவரை மனிதர் மட்டுமே என்று விளக்குதல்
  rationale: வசனம் மத்தியஸ்தரின் மனிதத்தன்மையை வெளிப்படையாக வலியுறுத்துகிறது. அது இங்கு கூறாத அவரது தெய்வீகத்தை மறுக்கவோ நிரூபிக்கவோ மொழிபெயர்ப்பு கூடுதல் சொற்களைச் சேர்க்கவில்லை; மூலத்திலுள்ள இறையியல் அழுத்தமும் பதற்றமும் அப்படியே விடப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘கடவுள்’ பொதுவாகப் புரியும் சொல்லாகவும், ‘மத்தியஸ்தர்’ துல்லியமான நிலைபெற்ற சொல்லாகவும் தேர்ந்தெடுக்கப்பட்டன. அரைப்புள்ளியும் நீண்ட கோடும் மூலத்தின் இணை அமைப்பையும் இறுதி அடையாளப்படுத்தும் சொற்றொடரையும் தெளிவாக்குகின்றன.
