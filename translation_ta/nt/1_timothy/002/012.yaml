id: 1TI.2.12
reference: 1 Timothy 2:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: ta
  text: ஆனால் ஒரு பெண் போதிப்பதற்கோ ஓர் ஆண்மீது அதிகாரம் செலுத்துவதற்கோ[a][b] நான் அனுமதிப்பதில்லை; மாறாக, அவள் அமைதியுடன் இருக்க வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மனைவி ... ஒரு கணவன்மீது.” கிரேக்கச் சொற்கள் பொதுவாக “பெண்/ஆண்” என்றும், திருமண உறவில் “மனைவி/கணவன்” என்றும் பொருள்படக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அதிகாரம் கொண்டிருப்பதற்கு”; ஒருவேளை, “ஆதிக்கம் செலுத்துவதற்கு.” இங்குள்ள கிரேக்க வினை அரிதானது; அதன் துல்லியமான பொருள் விவாதத்திற்குரியது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மௌனமாக.” கிரேக்கச் சொல் சூழலுக்கேற்ப அமைதி, சாந்தமான நிலை அல்லது மௌனம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: போதிப்பதற்கு
  rationale: ἐπιτρέπω என்பதுடன் இணையும் வினையெச்சத்தின் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய அறிவுறுத்தலிலிருந்து வரும் மென்மையான மாறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: γυναικί
  choice: ஒரு பெண்
  rationale: γυνή என்பது பெண் அல்லது மனைவி எனப் பொருள்படலாம்; இச்சூழலில் பொதுவான பொருளை முதன்மை உரையில் கொண்டு, திருமணப் பொருளை அடிக்குறிப்பில் காக்கிறது.
- source_word: οὐκ ἐπιτρέπω
  choice: நான் அனுமதிப்பதில்லை
  rationale: நிகழ்காலத்தை பொதுவான நிலைப்பாடாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐδὲ
  choice: -வதற்கோ
  rationale: இரண்டு தடைசெய்யப்பட்ட செயல்களைத் தமிழில் இயல்பான ‘...வதற்கோ ...வதற்கோ’ இணைப்பால் ஒருங்கிணைக்கிறது.
- source_word: αὐθεντεῖν
  choice: அதிகாரம் செலுத்துவதற்கு
  rationale: அரிதானதும் பொருள் விவாதத்திற்குரியதுமான வினைக்கு நடுநிலையான அதிகாரப் பொருளைத் தருகிறது; கொடுங்கோன்மை என்ற பொருளைத் தேவையின்றி புகுத்தவில்லை.
- source_word: ἀνδρός
  choice: ஓர் ஆண்மீது
  rationale: ἀνήρ என்பது ஆண் அல்லது கணவன் எனப் பொருள்படலாம்; பொதுவான பொருள் முதன்மை உரையிலும் திருமணப் பொருள் அடிக்குறிப்பிலும் தரப்படுகிறது.
- source_word: ἀλλ’
  choice: மாறாக
  rationale: தடைக்குப் பின் வரும் எதிர்மறை மாற்றாகிய எதிர்பார்ப்பைத் தெளிவாகக் குறிக்கிறது.
- source_word: εἶναι
  choice: அவள் ... இருக்க வேண்டும்
  rationale: கிரேக்க வினையெச்சக் கட்டமைப்பை தெளிவான, இயல்பான தமிழாக மாற்றுகிறது.
- source_word: ἐν ἡσυχίᾳ
  choice: அமைதியுடன்
  rationale: முழுமையான மௌனத்தை கட்டாயமாகக் குறிக்காமல், அமைதியான நிலையைக் குறிக்கும் சொல்லின் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: αὐθεντεῖν என்ற அரிதான வினையின் பொருள்
  choice: அதிகாரம் செலுத்துவதற்கு
  alternative: அதிகாரம் கொண்டிருப்பதற்கு; ஆதிக்கம் செலுத்துவதற்கு
  rationale: சொல் நடுநிலையான அதிகாரத்தையோ தவறான ஆதிக்கத்தையோ குறிக்கிறதா என்பது விவாதத்திற்குரியது. முதன்மை உரை நடுநிலையான பொருளைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: γυνή / ἀνήρ என்பவை பெண்/ஆண் அல்லது மனைவி/கணவன் என்பதா
  choice: ஒரு பெண் ... ஓர் ஆண்
  alternative: ஒரு மனைவி ... தன் கணவன்
  rationale: இரு சொற்களும் பொதுவான பாலினப் பொருளையும் திருமண உறவுப் பொருளையும் ஏற்கக்கூடியவை. சூழலின் பரந்த நோக்கின் காரணமாக பொதுப் பொருள் முதன்மை உரையில் தரப்பட்டு, திருமணப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: ἡσυχία என்பது அமைதியா மௌனமா
  choice: அமைதியுடன்
  alternative: மௌனமாக
  rationale: இச்சொல் அமைதி, சாந்தமான நிலை அல்லது மௌனம் ஆகியவற்றைக் குறிக்கக்கூடும்; முழுமையான பேசாமையை உரையில் திணிக்காமல் ‘அமைதியுடன்’ என மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை. கிரேக்கச் சொல்லமைப்பை அப்படியே நகலெடுக்காமல் இயல்பான தமிழ் இணைப்புகள் பயன்படுத்தப்பட்டுள்ளன; அதேவேளை பாலின/திருமணப் பொருள், அதிகார வினையின் நுணுக்கம், அமைதி/மௌனம் ஆகிய உண்மையான தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
