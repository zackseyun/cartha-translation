source:
  edition: SBLGNT
  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: ta
  text: அரசர்களுக்காகவும், உயர்ந்த பதவிகளில் இருக்கும் அனைவருக்காகவும்[a] வேண்டிக்கொள்ள வேண்டும்; நாம் முழுமையான இறைப்பற்றுடனும் கண்ணியத்துடனும் அமைதியானதும் ஆரவாரமற்றதுமான வாழ்க்கையை நடத்தும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிகாரத்தில் இருக்கும் அனைவருக்காகவும்.” கிரேக்கச் சொற்றொடரின் நேர்ப்பொருள், “மேன்மையான நிலையில் இருக்கும் அனைவருக்காகவும்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: -க்காக
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வேண்டுதல்களின் பயனாளர்களைக் குறிக்கும் இச்சூழலில், ‘-க்காக’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: βασιλέων
  choice: அரசர்கள்
  rationale: இச்சொல் குறிப்பாக அரசர்களைக் குறிக்கிறது; பொதுவாக ‘ஆட்சியாளர்கள்’ என்று விரிவாக்காமல் அதன் சொற்பொருள் பாதுகாக்கப்படுகிறது.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: உயர்ந்த பதவிகளில் இருக்கும் அனைவரும்
  rationale: இது சட்டபூர்வ அதிகாரப் பதவிகளை மட்டுமல்லாமல், மேன்மையான அல்லது உயர்நிலையான இடத்தில் இருப்போரையும் குறிக்கக்கூடும். எனவே பரந்த பொருளைத் தக்கவைக்கும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἵνα
  choice: இதனால் … நடத்தலாம்
  rationale: வேண்டுதலின் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἤρεμον
  choice: அமைதி
  rationale: தொந்தரவு மற்றும் கலக்கம் இல்லாத நிலையைக் குறிக்கிறது; அடுத்த பெயரடையிலிருந்து வேறுபாடு ஓரளவு தக்கவைக்கப்படுகிறது.
- source_word: ἡσύχιον
  choice: சாந்தம்
  rationale: அடக்கமும் ஆரவாரமின்மையும் கொண்ட நிலையைச் சுட்டுகிறது; ἤρεμον என்பதோடு இணைந்த இரட்டை வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: βίον
  choice: வாழ்க்கை
  rationale: இவ்வுலகில் ஒருவர் நடத்தும் வாழ்க்கை முறையைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: διάγωμεν
  choice: நாம் நடத்தலாம்
  rationale: வாழ்க்கையை வாழ்ந்து கழிப்பது அல்லது நடத்துவது என்ற வினையின் செயற்பாட்டு நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: முழுமையான இறைப்பற்றுடன்
  rationale: εὐσέβεια என்பது இறைவன் மீதான பயபக்தியும் அது வாழ்க்கையில் வெளிப்படுவதும் ஆகும். πάσῃ என்பதன் முழுமை வலியுறுத்தலும் தக்கவைக்கப்படுகிறது.
- source_word: σεμνότητι
  choice: கண்ணியம்
  rationale: மற்றவர்களின் மதிப்புக்குரிய ஒழுக்கமான தீவிரத்தையும் தகுந்த நடத்தையையும் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: குடிமை ஆட்சியாளர்களுக்காக வேண்டுவதன் வரம்பும் நோக்கமும்
  choice: ஆட்சியாளர்களுக்காக வேண்டுவதையும், விசுவாசிகள் அமைதியாகவும் இறைப்பற்றுடனும் வாழ ஏற்ற சூழல் அமைய வேண்டும் என்ற நோக்கத்தையும் வசனம் வெளிப்படுத்துகிறது; அந்த ஆட்சியாளர்களுக்கு நிபந்தனையற்ற ஒப்புதல் அளிப்பதாகக் கூறவில்லை.
  alternative: ஆளும் அதிகாரங்களுக்கு அடிபணிவதை அதிகமாக வலியுறுத்துதல், அல்லது இச்சொற்றொடரை முறைப்படி அதிகாரப் பதவி வகிப்போருக்கு மட்டும் வரையறுத்தல்.
  rationale: கிரேக்க உரை யாருக்காக வேண்ட வேண்டும் என்பதையும் அதன் சமூக நோக்கத்தையும் கூறுகிறது. ஒவ்வொரு ஆட்சியாளரின் சட்டப்பூர்வத்தன்மை குறித்த விரிவான அரசியல் இறையியலை அது இங்கே முன்வைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் இலக்கணத் தொடர்ச்சியாக இருந்தாலும், தனியாக வாசிக்கத் தெளிவாக இருக்க ‘வேண்டிக்கொள்ள வேண்டும்’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. ‘அமைதியும் சாந்தமும்’ என்ற இணைச்சொற்கள் இரண்டு கிரேக்கப் பெயரடைகளின் நுண்ணிய வேறுபாட்டை இயன்றவரைத் தக்கவைக்கின்றன.
