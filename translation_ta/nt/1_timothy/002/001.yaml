source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: ta
  text: ஆகவே, எல்லாவற்றிற்கும் முன்பாக, எல்லா மக்களுக்காகவும்[a][b][c] வேண்டுதல்களும், ஜெபங்களும், பரிந்து மன்றாடுதல்களும், நன்றிசெலுத்துதல்களும் செய்யப்பட வேண்டும் என்று நான் வலியுறுத்துகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எல்லா மக்களுக்காகவும்” என்பதிலுள்ள “-க்காகவும்” என்பதை “எல்லா மக்களின் சார்பாகவும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மக்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல், இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களை பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “எல்லா மக்கள்” என்பதைச் சிலர் “எல்லா வகையான மக்கள்” என்று புரிந்துகொள்கிறார்கள்; கிரேக்க வாசகம் நேரடியாக “எல்லா மக்கள்” என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: நான் வலியுறுத்துகிறேன்
  rationale: இது வெறும் வேண்டுகோளைவிட வலிமையான, அக்கறையுள்ள அறிவுறுத்தலைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையோடு உள்ள காரணவிளைவு சார்ந்த தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: πρῶτον πάντων
  choice: முதலாவதாக
  rationale: பட்டியலின் வரிசையை மட்டும் அல்லாமல் முன்னுரிமையையும் உணர்த்தும் இயல்பான தமிழ் வடிவம்.
- source_word: ποιεῖσθαι
  choice: செய்யப்பட வேண்டும்
  rationale: நான்கு வகையான ஜெபச் செயல்களுக்கும் பொதுவாகப் பொருந்துகிறது; மூலத்தின் மறைசெய்வினை அமைப்பையும் கடமை உணர்வையும் காக்கிறது.
- source_word: δεήσεις
  choice: வேண்டுதல்கள்
  rationale: தேவையிலிருந்து எழும் குறிப்பான விண்ணப்பங்கள் அல்லது உருக்கமான கோரிக்கைகள் என்ற பொருளை எளிய தமிழில் தருகிறது.
- source_word: προσευχάς
  choice: ஜெபங்கள்
  rationale: இறைவனை நோக்கிச் செய்யப்படும் ஜெபத்திற்கான பொதுச் சொல்; தமிழ் கிறிஸ்தவ வாசகர்களிடையே இயல்பாகப் புரியக்கூடியது.
- source_word: ἐντεύξεις
  choice: பரிந்து மன்றாடுதல்கள்
  rationale: இச்சூழலில் பிறருக்காக அணுகி வேண்டுதல் செய்வதை வெளிப்படுத்துகிறது; வெறும் தனிப்பட்ட வேண்டுதலோடு இதைக் கலக்காமல் வேறுபடுத்துகிறது.
- source_word: εὐχαριστίας
  choice: நன்றிசெலுத்துதல்கள்
  rationale: மூலத்தின் பன்மையையும் மற்ற ஜெப வகைகளிலிருந்து உள்ள சொல்லியல் வேறுபாட்டையும் காக்கிறது.
- source_word: ὑπὲρ
  choice: -க்காகவும்
  rationale: ஒருவரின் நன்மைக்காக அல்லது அவர் சார்பாகச் செய்வதைக் குறிக்கும் இச்சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: πάντων ἀνθρώπων
  choice: எல்லா மனிதர்களுக்காகவும்
  rationale: ἄνθρωπος இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கிறது; மூலத்தின் வெளிப்படையான பரப்பைச் சுருக்கவில்லை.
theological_decisions:
- issue: πάντων ἀνθρώπων என்பதன் பரப்பு
  choice: எல்லா மனிதர்கள்
  alternative: எல்லா வகையான மனிதர்கள்
  rationale: கிரேக்கச் சொற்றொடர் நேரடியாக ‘எல்லா மனிதர்கள்’ என்றே கூறுகிறது. அது ஒவ்வொரு தனிநபரையுமா அல்லது எல்லா சமூக வகையினரையுமா குறிக்கிறது என்ற இறையியல் விவாதத்தை மொழிபெயர்ப்பு தானாகத் தீர்க்காமல், மூலத்தின் பரந்த சொல்லாட்சியை வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபங்கள்’ என்ற பரவலாக அறியப்பட்ட சொல்லுடன், பட்டியலிலுள்ள மற்ற மூன்று கிரேக்கச் சொற்களின் வேறுபாட்டைத் தக்கவைக்க ‘வேண்டுதல்கள்,’ ‘பரிந்து மன்றாடுதல்கள்,’ ‘நன்றிசெலுத்துதல்கள்’ பயன்படுத்தப்பட்டுள்ளன. வாக்கிய அமைப்பு தமிழில் தெளிவாக இருக்கச் சிறிது மறுவரிசைப்படுத்தப்பட்டாலும், மூலத்தின் தர்க்கத் தொடர்பு, முன்னுரிமை, நான்கு கூறுகளைக் கொண்ட பட்டியல், உலகளாவிய பரப்பு ஆகியவை காக்கப்பட்டுள்ளன.
