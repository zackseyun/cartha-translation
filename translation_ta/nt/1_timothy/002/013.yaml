id: 1TI.2.13
reference: 1 Timothy 2:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀδὰμ γὰρ πρῶτος ἐπλάσθη, εἶτα Εὕα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/013.yaml
  text: For Adam was formed first[a], then Eve.
translation:
  language: ta
  text: ஏனெனில், ஆதாம் முதலில் உருவாக்கப்பட்டார்[a]; பிறகு ஏவாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வடிவாக்கப்பட்டார்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள வினைச்சொல், ஆதியாகமப் படைப்புச் செய்தியில் மனிதனுக்கு வடிவம் கொடுத்து உருவாக்கியதைச் சொல்லும் மொழியை எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், அதன் விளக்கவுரைப் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: Ἀδὰμ
  choice: ஆதாம்
  rationale: தமிழ் வேதாகம வழக்கில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவம்.
- source_word: πρῶτος
  choice: முதலில்
  rationale: ஏவாளின் உருவாக்கத்தோடு ஒப்பிடுகையில் கால வரிசையைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἐπλάσθη
  choice: உருவாக்கப்பட்டார்
  rationale: πλάσσω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம்; வடிவம் கொடுத்து உருவாக்குவதைக் குறிக்கும். இயற்கையான தமிழில் ஆதியாகமப் படைப்புச் செய்தியின் உருவாக்கும் மொழியையும் போதுமான அளவு எதிரொலிக்கிறது.
- source_word: εἶτα
  choice: பிறகு
  rationale: அடுத்ததாக நிகழ்ந்த கால வரிசையை எளிமையாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Εὕα
  choice: ஏவாள்
  rationale: தமிழ் வேதாகம வழக்கில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவம்.
theological_decisions:
- issue: திருச்சபை சார்ந்த விவாதப் பின்னணியில் ஆதியாகமப் படைப்பு வரிசையுடன் இவ்வசனத்துக்குள்ள தொடர்பு
  choice: ஆதாம் முதலில் உருவாக்கப்பட்டார்; பிறகு ஏவாள் என்ற கால வரிசைக் கூற்றாக மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: அதிகாரம் அல்லது பங்கு வேறுபாடுகள் குறித்த உட்கருத்தை மொழிபெயர்ப்பிலேயே சேர்த்தல்.
  rationale: கிரேக்க மூலவாசகம் உருவாக்கப்பட்ட வரிசையை மட்டுமே வெளிப்படையாகக் கூறுகிறது; அந்த வரிசையிலிருந்து பெறப்படும் இறையியல் முடிவை இந்த வசனத்துக்குள் சேர்க்கவில்லை. ஆகவே அதன் இறையியல் இழுவிசை தீர்த்துவைக்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய இயல்பானதும் கண்ணியமானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. ‘உருவாக்கப்பட்டார்’ என்பது வாசிப்பில் இயல்பாக இருப்பதுடன், மூலத்தில் உள்ள செயப்பாட்டு வடிவத்தையும் படைப்பு வரிசையையும் பாதுகாக்கிறது.
