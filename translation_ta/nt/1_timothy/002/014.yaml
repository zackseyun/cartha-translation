  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: ta
  text: ஆதாம் ஏமாற்றப்படவில்லை; ஆனால் அந்தப் பெண் முற்றிலும் ஏமாற்றப்பட்டு[a], கட்டளைமீறுதலுக்குள் வந்திருக்கிறாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏமாற்றப்பட்டு’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினை, முன்பு பயன்படுத்தப்பட்ட ‘ஏமாற்றப்படுதல்’ என்ற வினையை விட வலிமையானதாக இருந்து, ‘முற்றிலும் ஏமாற்றப்பட்டு’ என்ற பொருளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கட்டளைமீறுதலில் வந்தாள்’ அல்லது ‘கட்டளைமீறுதலில் ஆனாள்.’ கிரேக்க நிறைவுக்கால வினை, நிகழ்ந்த செயலின் விளைவாகத் தொடரும் நிலையையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: ஆதாம்
  rationale: தமிழ் வேதாகமப் பெயரிடும் மரபுக்கு ஏற்ப பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: ἠπατήθη
  choice: ஏமாற்றப்படவில்லை
  rationale: ἀπατάω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் οὐκ என்னும் மறுப்பையும் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἡ γυνὴ
  choice: பெண்
  rationale: γυνή என்பதற்கு ‘மனைவி’ என்றும் பொருள் இருக்கலாம்; ஆனால் ஆதாமுடன் செய்யப்படும் ஆதியாகமக் குறிப்பின் எதிர்மறை ஒப்பீட்டில் ‘பெண்’ என்பது உரையின் தெளிவான, குறைவாக விளக்கமளிக்கும் பொருள்.
- source_word: ἐξαπατηθεῖσα
  choice: முழுமையாக ஏமாற்றப்பட்டு
  rationale: ἐξαπατάω என்ற கூட்டு வினை, முன் வந்த ἀπατάω-விலிருந்து சொல்வேறுபாட்டைக் கொண்டுள்ளது; அதன் சாத்தியமான வலியுறுத்தலை ‘முழுமையாக’ என்பதால் காட்டுகிறது. அந்த வலியுறுத்தல் கட்டாயமா என்ற ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐν παραβάσει
  choice: மீறுதலில்
  rationale: ἐν + வேற்றுமை வடிவத்தை நெருக்கமாகப் பின்பற்றி, παράβασις என்ற கருத்துப்பெயரை ஒருவருக்கான ‘மீறியவள்’ என்ற பட்டமாக மாற்றாமல் வைத்திருக்கிறது.
- source_word: γέγονεν
  choice: வந்து நின்றாள்
  rationale: γίνομαι என்பதன் நிறைவுக்கால வடிவத்தில் உள்ள நிகழ்வையும் அதன் விளைவாகத் தொடரும் நிலையையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: ஆதாமுக்கும் பெண்ணுக்கும் இடையிலான மாறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ
  choice: —
  rationale: καί முந்தைய வசனத்துடன் இணைக்கிறது; தனிவசனத் தமிழாக்கத்தில் தொடக்க ‘மேலும்’ இயல்பற்றதாகவும் தேவையற்ற வலியுறுத்தலாகவும் இருப்பதால் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
theological_decisions:
- issue: பெண்ணுக்கும் மீறுதலுக்கும் உள்ள தொடர்பை, விரிவான கோட்பாட்டுக் கூற்றாக மாற்றாமல் எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘பெண் ... மீறுதலில் வந்து நின்றாள்’ என்று வரலாற்றுக் கூற்றாகவும் கருத்துப்பெயருடனும் மொழிபெயர்த்தல்
  alternative: ‘பெண் மீறியவளானாள்’ அல்லது ‘பெண் பாவத்தில் விழுந்தாள்’
  rationale: முதன்மைத் தேர்வு கிரேக்கத்தின் παράβασις என்ற கருத்துப்பெயரையும் γέγονεν என்ற நிறைவுக்காலத்தின் விளைவு நிலையையும் காக்கிறது; பெண்ணின் இயல்பு அல்லது எல்லாப் பெண்களின் குற்றநிலை குறித்துச் செய்யுள் கூறாத முடிவுகளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வந்து நின்றாள்’ என்பது சற்றே இலக்கியத் தன்மை கொண்டிருந்தாலும், γέγονεν-இல் உள்ள நிகழ்வு–விளைவு நிலையை இயல்பாகத் தக்கவைக்கிறது; அடிக்குறிப்பு மாற்று மொழியாக்கங்களை வழங்குகிறது.
