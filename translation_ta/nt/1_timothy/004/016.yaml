source:
  edition: SBLGNT
  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: ta
  text: உன்னையும் போதனையையும் கூர்ந்து கவனித்துக்கொள்; இவற்றில் நிலைத்திரு[a]. ஏனெனில், இப்படிச் செய்வதன் மூலம் உன்னையும் உனக்குச் செவிகொடுப்பவர்களையும் இரட்சிப்பாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இவற்றில் தொடர்ந்து இரு’ அல்லது ‘இவற்றில் விடாமுயற்சியுடன் நிலைத்திரு.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘காப்பாற்றுவாய்.’ கிரேக்கச் சொல் சூழலுக்கேற்ப மீட்பு, பாதுகாப்பு அல்லது இரட்சிப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: மிகுந்த கவனமாயிரு
  rationale: இந்தக் கட்டளை ஒரு கணநேரக் கவனத்தை அல்ல, தொடர்ந்து விழிப்புடன் கவனம் செலுத்துவதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அதன் நீடித்த வலிமையை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: σεαυτῷ
  choice: உன்னையும் ... குறித்து
  rationale: கவனத்தின் பொருளாகத் தீமொத்தேயுவையே சுட்டும் தற்சுட்டுப் பெயரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τῇ διδασκαλίᾳ
  choice: போதனையையும் குறித்து
  rationale: διδασκαλία போதிக்கும் செயலையோ அதன் உள்ளடக்கத்தையோ குறிக்கலாம். இச்சூழலில் போதனையின் உள்ளடக்கத்துக்கு முக்கியத்துவம் இருந்தாலும், ‘போதனை’ அந்தப் பொருள் விரிவைச் சுருக்காமல் காக்கிறது.
- source_word: ἐπίμενε
  choice: நிலைத்திரு
  rationale: முயற்சியோடும் உறுதியோடும் தொடர்ந்து கடைப்பிடிப்பதை இந்தக் கட்டளை குறிக்கிறது. ‘நிலைத்திரு’ நீடித்த தொடர்ச்சியையும் உறுதியையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: αὐτοῖς
  choice: இவற்றில்
  rationale: அஃறிணைப் பன்மைப் பெயர்ச்சொல், முன் கூறப்பட்ட தன்னைக் கவனித்தலும் போதனையைக் கவனித்தலும் ஆகியவற்றைச் சேர்த்துச் சுட்டுகிறது.
- source_word: τοῦτο γὰρ ποιῶν
  choice: ஏனெனில், இப்படிச் செய்வதன் மூலம்
  rationale: நிகழ்காலப் பெயரெச்ச அமைப்பு இங்கு வழிமுறையைக் காட்டுகிறது; தமிழில் ‘செய்வதன் மூலம்’ அந்தத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: σώσεις
  choice: இரட்சிப்பாய்
  rationale: σῴζω என்பதன் மீட்பு அல்லது இரட்சிப்பு சார்ந்த இறையியல் கனத்தைத் தளர்த்தாமல் காக்கிறது. அதேவேளையில், அதன் துல்லியமான பரப்பை முதன்மை உரை தீர்மானித்து விடவில்லை.
- source_word: τοὺς ἀκούοντάς σου
  choice: உனக்குச் செவிகொடுப்பவர்களை
  rationale: நிகழ்காலப் பெயரெச்சம் தீமொத்தேயுவின் போதனையைத் தொடர்ந்து கேட்டு ஏற்றுக்கொள்பவர்களைக் குறிக்கிறது. ‘செவிகொடுப்பவர்கள்’ வெறும் ஒலி கேட்டலைவிட கவனித்துக் கேட்பதை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: மேய்ப்புப் பணிக்கான அறிவுறுத்தலில் ‘இரட்சிப்பாய்’ என்பதன் பொருள்
  choice: ‘இரட்சிப்பாய்’ என்பதை முதன்மை உரையில் வைத்து, அதை நித்திய இரட்சிப்பு மட்டுமாகவோ நடைமுறைப் பாதுகாப்பு மட்டுமாகவோ குறுக்கவில்லை.
  alternative: ‘காப்பாற்றுவாய்’ அல்லது ‘பாதுகாப்பாய்’ என்று மொழிபெயர்த்து நடைமுறை அல்லது ஆவிக்குரிய பாதுகாப்பை முன்னிறுத்துதல்.
  rationale: இவ்வசனம் தீமொத்தேயு தன் வாழ்விலும் போதனையிலும் நிலைத்திருப்பதை அவனுடையவும் கேட்பவர்களுடையவும் இரட்சிப்போடு இணைக்கிறது. இது தன் முயற்சியால் இரட்சிப்பைச் சம்பாதிப்பதாக உரை கூறுகிறது என்று தீர்மானிக்காமலும், கடவுளின் இரட்சிக்கும் செயலில் உண்மையுள்ள ஊழியமும் போதனையும் வகிக்கும் கருவிசார் பங்கை அழித்துவிடாமலும், கிரேக்க உரையின் இறையியல் இழுபறியை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘போதனை’ என்பது ‘கோட்பாடு’ என்பதைக் காட்டிலும் இயல்பானது; ‘இரட்சிப்பாய்’ மூலத்தின் இறையியல் கனத்தையும் தீர்க்கப்படாத பொருள் விரிவையும் காக்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
