  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: ta
  text: ஏனெனில், அது கடவுளின் வார்த்தையினாலும் வேண்டுதலினாலும்[b] புனிதப்படுத்தப்படுகிறது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தமாக்கப்படுகிறது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மன்றாட்டினாலும்” அல்லது “விண்ணப்பத்தினாலும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: தூயதாக்கப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வினையாகிய இதன் வடிவத்தையும், முந்தைய வசனத்தில் கூறப்பட்ட உணவு தூய பயன்பாட்டுக்கென ஆக்கப்படுவதையும் இது இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. இறையியல் தொழில்நுட்பச் சொல்லைத் தேவையின்றி திணிக்காமல் ‘புனிதமாக்கப்படுகிறது/பரிசுத்தமாக்கப்படுகிறது’ என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க இணைப்புச் சொல்லின் இயல்பான தமிழ் வடிவம்.
- source_word: διὰ
  choice: -இனாலும்
  rationale: ஆறாம் வேற்றுமையுடன் வரும் διά இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது; ‘வார்த்தையினாலும் வேண்டுதலினாலும்’ என்பது அந்த உறவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: λόγου θεοῦ
  choice: கடவுளின் வார்த்தை
  rationale: மூலத்தின் உரிமைத் தொடர்பை நேரடியாகத் தருகிறது; இது வேதவாக்கா, படைப்பின்போது கடவுள் உரைத்த அறிவிப்பா, அல்லது கடவுளின் அதிகாரமளிக்கும் வார்த்தையா என்பதை மொழிபெயர்ப்பு தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: ἐντεύξεως
  choice: வேண்டுதல்
  rationale: இந்தச் சொல் மன்றாட்டு அல்லது விண்ணப்பம் என்ற குறிப்பான நுணுக்கத்தைக் கொண்டிருக்கலாம். உணவை நன்றியுடன் ஏற்றுக்கொள்ளும் சூழலில் ‘வேண்டுதல்’ இயல்பாகவும் போதுமான அகலத்துடனும் உள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: சூழலில் தூயதாக்கப்படுதல் என்பதன் வரம்பு
  choice: உணவு ஏற்றுக்கொள்ளத்தக்க பயன்பாட்டுக்கெனத் தூயதாக்கப்படுவதை வசனம் கூறுகிறது; ஒழுக்கத் தூய்மையையோ மீட்பையோ நேரடியாகக் கூறவில்லை.
  alternative: இதைப் பொதுவான சமயப் பொருளில் ‘புனிதமாக்கப்படுகிறது’ அல்லது ‘பரிசுத்தமாக்கப்படுகிறது’ என்றும் வாசிக்கலாம்.
  rationale: 1 தீமோத்தேயு 4:3–4 இன் உடனடிச் சூழல் நன்றியுடன் ஏற்றுக்கொள்ளப்படும் உணவுகளைப் பற்றியது. ‘தூயதாக்கப்படுகிறது’ என்பது ἁγιάζεται என்பதன் செயப்பாட்டு வடிவத்தையும் புனிதப்படுத்தும் கருத்தையும் தக்கவைக்கிறது; அதேவேளையில், மூலத்தில் இல்லாத திருச்சடங்கு அல்லது மீட்பியல் கூற்றைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கடவுள்’ மற்றும் ‘வார்த்தை’ பரவலாகப் புரியும் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன; சமயக் குழுவுக்கே உரிய சொல்லாட்சிகள் தவிர்க்கப்பட்டன.
