- from: ஏனெனில், அது கடவுளின் வார்த்தையினாலும் வேண்டுதலினாலும்[b] தூயதாக்கப்படுகிறது[a].
  to: ஏனெனில், அது கடவுளின் வார்த்தையினாலும் வேண்டுதலினாலும்[b] புனிதப்படுத்தப்படுகிறது[a].
