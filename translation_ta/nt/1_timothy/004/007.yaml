source:
  edition: SBLGNT
  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: ta
  text: ஆனால், புனிதமற்ற, கிழவிகளுக்குரிய கட்டுக்கதைகளைப் புறக்கணி[a]. இறைப்பற்றுக்காக உன்னையேப் பயிற்றுவித்துக்கொள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிழவிகளுக்குரிய” என்பது கிரேக்கத்தில் நேரடியாக “முதிய பெண்களின் இயல்புக்குரிய” என்று பொருள்படும் இழிவான சொல்லாட்சி. இதை “கிழவிகளின் கதைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: புனிதமற்ற
  rationale: புனிதமானவற்றுக்கு எதிராக, பொதுவான அல்லது மரியாதையற்ற தன்மையைக் குறிக்கும் சொல்லின் வேறுபாட்டை இது காக்கிறது.
- source_word: γραώδεις
  choice: கிழவிகளுக்குரிய
  rationale: ‘முதிய பெண்களின் இயல்புக்குரிய’ என்ற கிரேக்கச் சொல்லின் குறிப்பிட்ட, இழிவான சொல்லாட்சியைப் பொதுவான ‘முட்டாள்தனமான’ என்று மென்மைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: μύθους
  choice: கட்டுக்கதைகள்
  rationale: இச்சூழலில் உண்மையற்ற அல்லது ஊகமாகப் புனையப்பட்ட கதைகளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: παραιτοῦ
  choice: விலக்கிவிடு
  rationale: அவற்றை ஏற்க மறுத்து அவற்றோடு தொடர்புகொள்ளாமல் இருக்கும்படி கூறும் நடுநிலை ஏவலின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γύμναζε
  choice: பயிற்றுவி
  rationale: உடற்பயிற்சி அல்லது விளையாட்டுப் பயிற்சியை நினைவூட்டும் உருவகத்தைத் தமிழில் காக்கிறது.
- source_word: σεαυτόν
  choice: உன்னை
  rationale: தீமோத்தேயுவே பயிற்சியின் நேரடி பொருள் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: πρὸς εὐσέβειαν
  choice: இறைப்பற்றில்
  rationale: தேவனை மதித்து அவரை மையமாகக் கொண்ட வாழ்வைக் குறிக்கும் εὐσέβεια என்பதையும், பயிற்சியின் இலக்கையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: δὲ … δὲ
  choice: ஆனால் … மாறாக
  rationale: முந்தைய சூழலுடனான எதிர்மறைத் தொடர்பையும், கட்டுக்கதைகளை விலக்குவதற்கு எதிரான நேர்மறைக் கட்டளையையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: γραώδεις μύθους என்ற இழிவான சொல்லாட்சியை மொழிபெயர்த்தல்
  choice: குறிப்பிட்ட பாலினம் மற்றும் வயது சார்ந்த இழிவான உருவகத்தை ‘கிழவிகளுக்குரிய கட்டுக்கதைகள்’ என்று முதன்மை உரையில் தக்கவைத்தல்
  alternative: முட்டாள்தனமான கட்டுக்கதைகள்
  rationale: மாற்று மொழிபெயர்ப்பு கருத்தை ஓரளவு தெரிவிப்பினும், கிரேக்கத்தின் பண்பாட்டுச் சார்புள்ள கூர்மையான சொல்லாட்சியை நீக்கிவிடும். முதன்மை உரை அதன் அசௌகரியத்தையும் பதற்றத்தையும் மறைக்காமல் காக்கிறது; அடிக்குறிப்பு அதன் நேர்ப்பொருளையும் இழிவான பயன்பாட்டையும் விளக்குகிறது.
- issue: εὐσέβεια என்பதன் பரப்பு
  choice: இறைப்பற்று
  alternative: பக்தி
  rationale: ‘பக்தி’ சில சூழல்களில் சடங்கு அல்லது உணர்ச்சி சார்ந்த பொருளாகச் சுருங்கக்கூடும்; ‘இறைப்பற்று’ என்பது தேவனை மதித்து அவரை மையமாகக் கொண்ட வாழ்க்கை என்ற விரிவான கருத்தைத் திறந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எனினும், மூலத்தின் வயது மற்றும் பாலினம் சார்ந்த இழிவான சொல்லாட்சியை மென்மைப்படுத்தாமல், அதன் கடுமையை விளக்கும் அடிக்குறிப்புடன் தக்கவைக்கிறது. ‘உன்னைப் பயிற்றுவி’ என்பது உடற்பயிற்சி உருவகத்தையும் நேரடி ஏவலையும் காக்கிறது.
