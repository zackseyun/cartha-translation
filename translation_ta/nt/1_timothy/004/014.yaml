id: 1TI.4.14
reference: 1 Timothy 4:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: ta
  text: உன்னில் இருக்கும் வரத்தைப் புறக்கணிக்காதே; அது இறைவாக்கின் மூலம்[a], மூப்பர் குழுவினர்[b] உன்மேல் கைகளை வைத்ததோடு உனக்குக் கொடுக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீர்க்கதரிசன உரையின் மூலம்.” இச்சொற்றொடர், வரம் கொடுக்கப்பட்டபோது இறைவாக்கு உடன் உரைக்கப்பட்டதையோ, அந்த வரம் கொடுக்கப்படுவதற்கு அது ஒரு வழிமுறையாக இருந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மூப்பர் குழு” என்பது மூப்பர்களின் கூட்டமைப்பைக் குறிக்கிறது; தனி மூப்பரையோ பிற்காலத்தில் உருவான குறிப்பிட்ட ஒரு சபை ஆட்சிமுறையையோ அவசியம் குறிக்காது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: புறக்கணிக்காதே
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை, தொடர்ந்து கவனிக்காமல் விடாதிருக்கச் சொல்லும் தடை. ‘புறக்கணிக்காதே’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: உன்னில் இருக்கும் வரத்தை
  rationale: ἐν σοὶ என்பதன் ‘உன்னில்’ என்ற இடப்பொருளைப் பாதுகாக்கிறது. χάρισμα என்பதற்கு மூலத்தில் இல்லாத ‘ஆவிக்குரிய’ என்ற அடைமொழியைச் சேர்க்காமல் ‘வரம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐδόθη σοι
  choice: உனக்குக் கொடுக்கப்பட்டது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தை நேரடியாக வெளிப்படுத்துகிறது; கொடுத்தவர் யார் என்பதை மூலத்தைவிடத் தெளிவாகக் குறிப்பிடவில்லை.
- source_word: διὰ προφητείας
  choice: இறைவாக்கின் மூலம்
  rationale: διά + genitive இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கலாம். ‘இறைவாக்கின் மூலம்’ என்பது அந்த உறவைப் பாதுகாக்கிறது; இது உரைக்கப்பட்ட தீர்க்கதரிசனச் செய்தியையும் குறிக்கக்கூடும்.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: உன்மேல் கைகளை வைத்ததோடு
  rationale: கைவைத்தல் வரம் கொடுக்கப்பட்ட நிகழ்வுடன் இணைந்து நடந்ததை μετὰ சுட்டுகிறது. வெறும் காலப்பொருளாக மட்டும் குறுக்காமல் இணைந்த நிகழ்வாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τοῦ πρεσβυτερίου
  choice: மூப்பர் குழுவினர்
  rationale: πρεσβυτέριον என்பது தனி மூப்பரை அல்ல, மூப்பர்களின் கூட்டமைப்பைக் குறிக்கிறது. ‘மூப்பர் குழுவினர்’ என்பது பிற்காலச் சபை ஆட்சிமுறைச் சொல்லாட்சியைத் திணிக்காமல் கூட்டுப் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: χάρισμα என்பதற்கு குறிப்பிட்ட ஆவிக்குரிய அல்லது ஊழியத் தன்மையை வெளிப்படையாகச் சேர்ப்பதா
  choice: வரம்
  alternative: ஆவிக்குரிய வரம்
  rationale: சூழலில் இது ஊழியத்திற்கான அருள்வரமாக இருக்கலாம்; ஆனால் மூலத்தில் ‘ஆவிக்குரிய’ என்ற அடைமொழி இல்லை. ஆகவே பொருளைத் தேவையின்றி குறுக்காமல் ‘வரம்’ என்று வைக்கப்பட்டுள்ளது.
- issue: πρεσβυτέριον என்பதைப் பிற்காலச் சபை ஆட்சிமுறைப் பதமாக மொழிபெயர்ப்பதா
  choice: மூப்பர் குழுவினர்
  alternative: பிரஸ்பிட்டரி / மூப்பராட்சி மன்றம்
  rationale: மூலச்சொல் மூப்பர்களின் கூட்டத்தைச் சுட்டுகிறது. தேர்ந்தெடுக்கப்பட்ட சொற்றொடர் அந்தக் கூட்டுப் பொருளைக் காட்டுகிறது; குறிப்பிட்ட ஒரு திருச்சபைப் பிரிவின் பிற்கால அமைப்பை வசனத்தில் புகுத்துவதில்லை.
- issue: διὰ προφητείας என்பது வரம் வழங்கப்பட்டதற்கான வழிமுறையா அல்லது அதனுடன் ஒலிக்கப்பட்ட இறைவாக்கா
  choice: இறைவாக்கின் மூலம்
  alternative: இறைவாக்கு உரைக்கப்பட்டபோது
  rationale: διά + genitive வழிமுறை அல்லது இடைமுகத்தை வலுவாகக் காட்டுகிறது; எனினும் அந்த இறைவாக்கு வழங்குதலுடன் சேர்ந்த தீர்க்கதரிசன உரையாக இருந்திருக்கலாம். முதன்மை உரை வழிமுறைப் பொருளைக் காக்கிறது; அடிக்குறிப்பு மாற்றுப் புரிதலைத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வரம்’, ‘இறைவாக்கு’, ‘மூப்பர் குழுவினர்’, ‘கைகளை வைத்தல்’ ஆகியவை பொதுவான வேதாகமச் சூழலில் அறியத்தக்க சொற்கள். கிரேக்கத்தின் வழிமுறை–உடனிகழ்வு வேறுபாடு முற்றிலும் சமப்படுத்தப்படாமல், முதன்மை உரை மற்றும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
