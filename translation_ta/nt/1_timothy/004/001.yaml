source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: ta
  text: 'ஆவியானவரோ வெளிப்படையாகச் சொல்கிறார்: பிற்காலங்களில்[a] சிலர் விசுவாசத்திலிருந்து விலகிப் போவார்கள்[b]; வஞ்சிக்கும் ஆவிகளுக்கும்[c] பேய்களின் போதனைகளுக்கும் அவர்கள் செவிகொடுப்பார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிந்திய காலங்களில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விசுவாசத்திலிருந்து வீழ்ந்துபோவார்கள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வழிதவறச் செய்யும் ஆவிகளுக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: ஆவியானவர்
  rationale: கட்டுரையுடனும் பவுலின் தீர்க்கதரிசனச் சூழலிலும் வருவதால், இது பொதுவான ஓர் ஆவியைக் காட்டிலும் பரிசுத்த ஆவியானவரைக் குறிப்பது இயல்பானது.
- source_word: δὲ
  choice: -ரோ
  rationale: வலுவான எதிர்மறையைக் காட்டாமல் மென்மையான உரைமாற்றத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ῥητῶς λέγει
  choice: வெளிப்படையாகச் சொல்கிறார்
  rationale: கூற்று தெளிவாகவும் நேரடியாகவும் சொல்லப்படுவதை நிகழ்காலத்துடன் காக்கிறது.
- source_word: ἐν ὑστέροις καιροῖς
  choice: பிற்காலங்களில்
  rationale: எழுத்தாளரின் காலத்திற்குப் பிந்திய காலங்களைக் குறிக்கிறது; இறுதிக்காலத்தை மட்டும் தொழில்நுட்பமாக வரையறுப்பதைத் தவிர்க்கிறது.
- source_word: ἀποστήσονταί τινες τῆς πίστεως
  choice: சிலர் விசுவாசத்தைவிட்டு விலகிப்போவார்கள்
  rationale: ἀφίσταμαι என்பதன் விலகுதல் அல்லது பிரிதல் என்ற பொருளையும், இங்கு விசுவாசம் நம்பிக்கையின் உள்ளடக்கத்தைக் குறிக்கும் சாத்தியத்தையும் இயல்பாகத் தருகிறது.
- source_word: προσέχοντες
  choice: செவிகொடுப்பார்கள்
  rationale: வெறுமனே கேட்பதைவிட கவனித்து ஏற்றுக்கொள்ளும் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πνεύμασι πλάνοις
  choice: வஞ்சிக்கும் ஆவிகள்
  rationale: πλάνος என்பதன் பிறரை வழிதவறச் செய்யும் செயற்பாட்டு நுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: διδασκαλίαις δαιμονίων
  choice: பேய்களின் போதனைகள்
  rationale: போதனைகள் பேய்களிடமிருந்து தோன்றுகின்றன அல்லது அவற்றோடு தொடர்புடையவை என்ற கிரேக்க உரையின் பொதுவான இயைபை, அதற்கு மேல் உறவைத் தீர்மானிக்காமல் காக்கிறது.
theological_decisions:
- issue: ‘ஆவி’ என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியானவர்
  alternative: ஒரு தீர்க்கதரிசன ஆவி அல்லது மனித ஆவி
  rationale: கட்டுரையும் பவுலின் தீர்க்கதரிசனப் பயன்பாடும் பரிசுத்த ஆவியானவரையே வலுவாகச் சுட்டுகின்றன; வெளிப்பாட்டின் முறை மட்டும் குறிப்பிடப்படவில்லை.
- issue: ‘விசுவாசம்’ என்பதன் பொருள்
  choice: நம்பப்படும் கிறிஸ்தவ விசுவாசம்
  alternative: தனிப்பட்ட நம்பிக்கை அல்லது உண்மைத்தன்மை
  rationale: கட்டுரையுடனான τῆς πίστεως மற்றும் பொய்ப் போதனைகள் பற்றிய சூழல், நம்பிக்கையின் உள்ளடக்கத்தைக் குறிக்கும் பொருளை ஆதரிக்கின்றன; எனினும் தமிழ்ச் சொல் தனிப்பட்ட நம்பிக்கை என்ற இயல்பான ஒலிப்பையும் முற்றிலும் மூடுவதில்லை.
- issue: விசுவாசத்திலிருந்து விலகுதலின் தன்மை
  choice: விசுவாசத்தைவிட்டு விலகிப்போதல்
  alternative: விசுவாசத்திலிருந்து வீழ்ந்துபோதல்
  rationale: மூல வினை கூறும் பிரிதல் அல்லது விலகுதலைக் காக்கிறது; இரட்சிப்பு நிலை குறித்த குறிப்பிட்ட கோட்பாட்டு முடிவை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்பைத் தெளிவாக்க அரைப்புள்ளி பயன்படுத்தப்பட்டது; ‘செவிகொடுப்பார்கள்’ என்பது தொடர்வினையின் விளக்கத் தொடர்பை இயல்பான தமிழில் தருகிறது.
