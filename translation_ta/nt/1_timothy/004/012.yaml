id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: ta
  text: உன் இளமையை யாரும் இகழ இடமளிக்காதே. மாறாக, பேச்சிலும் நடத்தையிலும் அன்பிலும் விசுவாசத்திலும்[a] தூய்மையிலும் விசுவாசிகளுக்கு முன்மாதிரியாக இரு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பகத்தன்மையிலும்.” இச்சூழலில் கிரேக்கச் சொல் விசுவாசத்தையோ நம்பகத்தன்மையையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: யாரும் அற்பமாக எண்ண இடம்கொடுக்காதே
  rationale: மூன்றாம் நபர் தடை கட்டளையைத் தமிழில் இயல்பான நேரடி அறிவுறுத்தலாகத் தருகிறது; καταφρονέω என்பதிலுள்ள இகழ்ந்து தாழ்வாக மதிக்கும் சமூகப் பொருளையும் காக்கிறது.
- source_word: σου τῆς νεότητος
  choice: உன் இளவயதை
  rationale: νεότης குறிக்கும் இளமை அல்லது இளம் வயது என்ற பொருளை, இங்கு ஒருவரின் வயதை முன்னிட்டு இகழ்வதைச் சுட்டும் வகையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τύπος γίνου
  choice: முன்மாதிரியாக இரு
  rationale: பிறர் பின்பற்றத்தக்க எடுத்துக்காட்டு என்ற τύπος என்பதன் பொருளையும், γίνου என்ற கட்டளையின் தொடர்ச்சியான நடைமுறை வலியுறுத்தலையும் சுருக்கமாகத் தருகிறது.
- source_word: τῶν πιστῶν
  choice: விசுவாசிகளுக்கு
  rationale: தீமோத்தேயு முன்மாதிரியாக இருக்க வேண்டிய மக்கள் குழுவை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἐν λόγῳ
  choice: பேச்சிலும்
  rationale: இப்பட்டியலில் λόγος என்பது பேசும் விதத்தைக் குறிக்கிறது; ‘பேச்சு’ நவீனத் தமிழில் தெளிவானது.
- source_word: ἐν ἀναστροφῇ
  choice: நடத்தையிலும்
  rationale: ἀναστροφή குறிக்கும் நடத்தை அல்லது வாழ்க்கை முறையைச் செறிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν ἀγάπῃ
  choice: அன்பிலும்
  rationale: ἀγάπη என்பதற்கான நேரடியான, பரவலாகப் புரியும் தமிழ் இணை.
- source_word: ἐν πίστει
  choice: விசுவாசத்திலும்[a]
  rationale: πίστις என்பதன் ‘விசுவாசம்’ என்ற முதன்மைப் பொருளை உரையில் வைத்துக்கொண்டு, இச்சூழலில் சாத்தியமான ‘நம்பகத்தன்மை’ என்ற பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: ἐν ἁγνείᾳ
  choice: தூய்மையிலும்
  rationale: ἁγνεία குறிக்கும் ஒழுக்க மற்றும் பாலியல் தூய்மையைத் தேவையின்றி ஒரே துறைக்குள் சுருக்காமல் அதன் பரந்த பொருளைக் காக்கிறது.
theological_decisions:
- issue: நற்பண்புப் பட்டியலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பகத்தன்மை
  rationale: இச்சூழலில் πίστις கடவுள்மீதான விசுவாசத்தையோ ஒருவரின் உண்மைத்தன்மை/நம்பகத்தன்மையையோ குறிக்கலாம். முதன்மை உரையில் வழக்கமான ‘விசுவாசம்’ வைக்கப்பட்டு, உண்மையான பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் நேர்த்தியும் கொண்ட நேரடி மேய்ப்புப்பணி அறிவுறுத்தல். பட்டியலின் இணையான அமைப்பைப் பாதுகாக்க ‘-இலும்’ தொடர் பயன்படுத்தப்பட்டுள்ளது; பழமையான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
