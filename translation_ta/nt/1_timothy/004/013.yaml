id: 1TI.4.13
reference: 1 Timothy 4:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: ta
  text: நான் வரும்வரை, பொதுவாசிப்பிலும்[a], அறிவுறுத்துவதிலும், போதிப்பதிலும் முழுக் கவனம் செலுத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வேதவாசிப்பிலும்.’ கிரேக்கத்தில் ‘வாசிப்பு’ என்று மட்டுமே உள்ளது; ஆனால் இச்சூழலில் அது கூடுகையில் பொதுவாக வேதத்தை வாசிப்பதைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: நான் வரும்வரை
  rationale: ἕως கூறும் கால எல்லையையும், நிகழ்கால வடிவில் இருந்தாலும் எதிர்கால நோக்கில் வரும் ἔρχομαι என்பதையும் இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: πρόσεχε
  choice: முழுக் கவனம் செலுத்து
  rationale: ஒரு கண நேரக் கவனத்தை அல்லாமல், தொடர்ந்து அக்கறையுடன் ஈடுபட வேண்டிய கட்டளையைத் தெளிவாகக் காட்டுகிறது.
- source_word: τῇ ἀναγνώσει
  choice: பொதுவாசிப்பிலும்
  rationale: ἀνάγνωσις அடிப்படையில் ‘வாசிப்பு’ என்று பொருள்படும்; திருச்சபைக் கூடுகைச் சூழலில் அது மக்கள் முன்னிலையில் நடைபெறும் வாசிப்பைக் குறிக்க வாய்ப்புள்ளது. கிரேக்கம் வாசிக்கப்படும் பொருளை வெளிப்படையாகக் குறிப்பிடாததால் ‘வேதவாசிப்பு’ என்று மூலவாக்கியத்தில் விரிவுபடுத்தப்படவில்லை.
- source_word: τῇ παρακλήσει
  choice: அறிவுறுத்துவதிலும்
  rationale: παράκλησις என்பதில் ஊக்குவித்தல், வேண்டிக்கொள்ளுதல், அறிவுறுத்துதல் ஆகிய பொருள் நிழல்கள் உள்ளன. வாசிப்பு மற்றும் போதித்தலுடன் இணைந்த ஊழியச் சூழலில் ‘அறிவுறுத்துதல்’ அதன் வழிநடத்தும் மேய்ப்புப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: τῇ διδασκαλίᾳ
  choice: போதிப்பதிலும்
  rationale: διδασκαλία இங்கு போதிக்கும் செயலையோ அதன் உள்ளடக்கத்தையோ குறிக்கலாம்; ‘போதித்தல்’ தற்போதைய தமிழில் தெளிவாகவும் சமயச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
theological_decisions:
- issue: ἀνάγνωσις என்பதை மூலவாக்கியத்திலேயே வேதவாசிப்பு என்று வெளிப்படையாக்க வேண்டுமா
  choice: பொதுவாசிப்பு
  alternative: வேதவாசிப்பு; வாசிப்பு
  rationale: திருச்சபை ஒழுங்கு மற்றும் ஊழியம் பற்றிய சூழல் பொதுவாக நடைபெறும் வேதவாசிப்பை வலுவாகச் சுட்டுகிறது. இருப்பினும் கிரேக்கத்தில் ‘வேதம்’ என்ற பொருள் வெளிப்படையாக இல்லை. ஆகவே சாத்தியமான பொதுச் சூழல் மூலவாக்கியத்தில் காட்டப்பட்டு, வாசிக்கப்படும் பொருள் குறித்த தெளிவாக்கம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஒருமை கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘முழுக் கவனம் செலுத்து’ என்பது தொடர்ச்சியான ஈடுபாட்டைக் காட்டுகிறது; ‘அறிவுறுத்துதல்’ என்பது ஊக்குவித்தல் மற்றும் வலியுறுத்திக் கூறுதல் ஆகியவற்றின் பொருள் பரப்பை முற்றிலும் நீக்காமல், இச்சூழலுக்கேற்ற வழிநடத்தும் நயத்தை அளிக்கிறது.
