id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: ta
  text: சகோதரர்களுக்கு இவற்றை முன்வைப்பதன் மூலம், விசுவாசத்தின் வார்த்தைகளாலும் நீ பின்பற்றி வந்த நல்ல போதனையின் வார்த்தைகளாலும் ஊட்டம் பெற்று, மேசியா இயேசுவின்[c] நல்ல பணியாளனாக இருப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: அல்லது, ‘கிறிஸ்து இயேசு.’ Χριστός என்ற கிரேக்கப் பட்டப்பெயரின் பொருளைக் காக்க இங்கு ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ταῦτα ὑποτιθέμενος
  choice: இவற்றைச் ... முன் எடுத்துவைத்தால்
  rationale: பன்மைச் சுட்டுப்பெயரையும், ஒருவரின் முன் காரியங்களை வைப்பது என்ற ὑποτίθημι வினையின் உருவகத்தையும் இயல்பான தமிழில் காக்கிறது; இங்கு பங்கேற்புவினை முதன்மை வாக்கியத்திற்கான வழி அல்லது நிபந்தனையை உணர்த்துகிறது.
- source_word: τοῖς ἀδελφοῖς
  choice: சகோதரர்களின்
  rationale: கிரேக்கச் சொல்லின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் காக்கிறது; சூழலில் இது பெண் விசுவாசிகளையும் உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: καλὸς ... διάκονος
  choice: நல்ல பணியாளன்
  rationale: διάκονος இங்கு திருச்சபைப் பதவிப்பெயர் என்று தெளிவாக இல்லை; சேவை செய்பவரைக் குறிக்கும் செயல்சார் பொருளை ‘பணியாளன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவின்
  rationale: Χριστός என்பதன் பட்டப்பெயர்ச் சார்ந்த ‘மேசியா’ பொருளைக் காத்து, தமிழில் இயல்பான இணைப்புக்காக ‘ஆகிய’ பயன்படுத்தப்படுகிறது.
- source_word: ἐντρεφόμενος
  choice: ஊட்டம் பெற்று
  rationale: போதனையால் தொடர்ந்து வளர்க்கப்படுதல் அல்லது ஊட்டப்படுதல் என்ற உருவகத்தை காக்கிறது; ‘பயிற்சி பெற்று’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας
  choice: விசுவாசத்தின் வார்த்தைகளாலும் ... நல்ல போதனையின் வார்த்தைகளாலும்
  rationale: λόγοις இரு மரபுத்தொடர்களையும் ஆளுகிறது என்பதை தமிழில் தெளிவாக்க ‘வார்த்தைகளாலும்’ இரண்டாம் முறையாகத் திரும்பச் சொல்லப்பட்டுள்ளது; ‘விசுவாசம்’ மற்றும் ‘நல்ல போதனை’ என்ற வேறுபாடும் காக்கப்படுகிறது.
- source_word: ᾗ παρηκολούθηκας
  choice: நீ பின்பற்றி வந்த
  rationale: கவனமாகக் கற்றறிதல் மற்றும் தொடர்ந்து பற்றிக்கொள்ளுதல் ஆகிய இரு நிழற்பொருள்களையும் அளவுக்கு மீறித் தீர்மானிக்காமல் இயல்பாகக் கொண்டுவருகிறது; தொடர்புப்பெயர் அருகிலுள்ள ‘நல்ல போதனை’ என்பதோடு இணைக்கப்படுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு பட்டப்பெயரின் பொருளை வெளிப்படையாகக் காக்க ‘மேசியா’ பயன்படுத்தப்படுகிறது; தமிழ்க் கிறிஸ்தவ மரபில் பரவலான வடிவம் மாற்று வாசிப்பாகக் குறிப்பிடப்படுகிறது.
- issue: τοῖς ἀδελφοῖς என்பதன் பாலினமும் உள்ளடக்கமும்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; சக விசுவாசிகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவம் முதன்மை உரையில் காக்கப்படுகிறது; தொடக்கக் கிறிஸ்தவப் பயன்பாட்டில் முழு விசுவாசக் குழுவையும் குறிக்கக்கூடிய வாய்ப்பு அடிக்குறிப்பில் கூறப்படுகிறது.
- issue: τῆς πίστεως என்பதன் பொருள்
  choice: விசுவாசத்தின்
  alternative: விசுவாசத்திற்குரிய; கிறிஸ்தவ விசுவாசப் போதனையின்
  rationale: πίστις என்பதைக் ‘விசுவாசம்’ என்று நேரடியாகக் காக்கிறது. இச்சூழலில் அது தனிநபரின் நம்பும் செயலை மட்டும் அல்லாமல் ஏற்றுக்கொள்ளப்பட்ட விசுவாச உள்ளடக்கத்தையும் குறிக்கலாம்; அந்த நுணுக்கம் அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் தெளிவும் கொண்ட நடையில் அமைக்கப்பட்டுள்ளது. ‘முன் எடுத்துவைத்தால்’ மற்றும் ‘ஊட்டம் பெற்று’ ஆகியவை மூலத்தின் உருவகங்களை இயன்றவரை காக்கின்றன. தமிழில் தொடர்பு தெளிவாக இருக்க λόγοις (‘வார்த்தைகள்’) இரு இணைத் தொடர்களிலும் வெளிப்படையாகத் திரும்பக் கூறப்பட்டுள்ளது.
