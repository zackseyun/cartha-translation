    text: அல்லது, ‘விசுவாசத்திற்குரிய வார்த்தைகள்.’ இங்கு ‘விசுவாசம்’ என்பது ஏற்றுக்கொள்ளப்பட்ட கிறிஸ்தவ நம்பிக்கையின் உள்ளடக்கத்தைக் குறிக்கலாம்.
