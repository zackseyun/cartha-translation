source:
  edition: SBLGNT
  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: ta
  text: அவர்கள் திருமணம் செய்துகொள்வதைத் தடைசெய்கிறார்கள்; உணவுப் பொருட்களைத் தவிர்க்கும்படி வற்புறுத்துகிறார்கள்.[a] உண்மையை அறிந்துகொண்ட விசுவாசிகள் நன்றியுடன் உட்கொள்வதற்காகவே கடவுள் அந்த உணவுப் பொருட்களைப் படைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்ந்த மொழிபெயர்ப்பு: “திருமணம் செய்துகொள்வதைத் தடைசெய்து, உணவுப் பொருட்களிலிருந்து விலகியிருக்க [கட்டளையிட்டு].” உணவுப் பொருட்களைத் தவிர்க்கும்படி அந்தப் பொய்ப் போதகர்கள் வற்புறுத்தினார்கள் என்பதை முதன்மை உரை வெளிப்படையாகக் கூறுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: தடைசெய்கிறார்கள்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் நிகழ்காலப் பங்கேற்புவினையின் செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: γαμεῖν
  choice: திருமணம் செய்துகொள்வதை
  rationale: ‘திருமணம் செய்துகொள்ள’ என்ற வினைச்சொல் பொருளை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: ἀπέχεσθαι
  choice: தவிர்க்க வேண்டும் என்றும் வற்புறுத்துகிறார்கள்
  rationale: ἀπέχεσθαι என்பதன் அடிப்படைப் பொருளான விலகியிருத்தலை ‘தவிர்க்க’ எனத் தருகிறது; கிரேக்கத்தில் விடுபட்டிருந்தாலும் சூழலில் தெளிவாக உள்ள கட்டாயப்படுத்தும் கருத்தை ‘வேண்டும் என்றும் வற்புறுத்துகிறார்கள்’ என வெளிப்படையாக்குகிறது.
- source_word: βρωμάτων
  choice: உணவுப் பொருட்களை
  rationale: பன்மை வடிவத்தைக் காத்து, சாதாரண தமிழில் தெளிவாகப் புரியும் சொல்லாக்கம்.
- source_word: ἔκτισεν
  choice: படைத்தார்
  rationale: κτίζω என்பதிலுள்ள படைப்புச் செயல் சார்ந்த இறையியல் வலிமையைப் பாதுகாக்கிறது.
- source_word: εἰς μετάλημψιν
  choice: உட்கொள்வதற்காக
  rationale: உணவைப் பங்குபெற்று உண்பதற்கான நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μετὰ εὐχαριστίας
  choice: நன்றியுடன்
  rationale: கடவுளுக்கு நன்றி செலுத்தும் மனநிலையோடு உணவை உட்கொள்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τοῖς πιστοῖς
  choice: விசுவாசித்து
  rationale: இங்கு πιστός என்பது நம்புகிறவர்களைக் குறிக்கிறது; ‘விசுவாசித்து’ என்பது அடுத்த விளக்கத்துடன் ஒரே குழுவாக இணைகிறது.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: உண்மையை அறிந்துகொண்டவர்கள்
  rationale: நிறைவுற்ற பங்கேற்புவினை குறிக்கும், அறிதலுக்கு வந்து அதன் நிலையில் தொடரும் கருத்தை ‘அறிந்துகொண்டவர்கள்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν என்பது ஒரே குழுவையா அல்லது இரண்டு குழுக்களையா குறிக்கிறது?
  choice: ‘விசுவாசித்து உண்மையை அறிந்துகொண்டவர்கள்’ என ஒரே குழுவின் இரண்டு பண்புகளாக மொழிபெயர்த்தல்
  alternative: ‘விசுவாசிகளும் உண்மையை அறிந்தவர்களும்’ என இரண்டு குழுக்களாகப் புரிந்துகொள்ளக்கூடிய மொழிபெயர்ப்பு
  rationale: பகிரப்பட்ட சுட்டுருபும் இணைக்கப்பட்ட விளக்கங்களும் ஒரே மக்களைக் இரண்டு கோணங்களில் குறிப்பிடுவதே இயல்பான இலக்கணப் புரிதல்.
- issue: ἀπέχεσθαι என்பதோடு கட்டளையிடும் வினை வெளிப்படையாக இல்லாதது
  choice: சூழலில் உட்கிடக்கும் கட்டாயப்படுத்தும் கருத்தை ‘வற்புறுத்துகிறார்கள்’ என முதன்மை உரையில் வெளிப்படுத்தல்
  alternative: ‘திருமணம் செய்துகொள்ளத் தடைசெய்தும், உணவுப் பொருட்களைத் தவிர்க்கவும்’ என்ற சொற்சார்ந்த ஆனால் தமிழில் முழுமையற்ற அமைப்பு
  rationale: கிரேக்கத்தின் சுருக்கமான தொடரமைப்பு தமிழில் தவறாகவோ முழுமையற்றதாகவோ ஒலிக்காமல் அதன் நோக்கத்தைத் தெளிவாகத் தருகிறது; அடிச்சொல் சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உணவுப் பொருட்கள்,’ ‘நன்றியுடன் உட்கொள்வது’ போன்ற சொற்கள் மூலத்தின் பொருளை இயல்பாகத் தருகின்றன; ‘ஆனால்’ என்பது தடை விதிப்புக்கும் கடவுளின் படைப்பு நோக்கத்துக்கும் இடையிலுள்ள எதிர்மறைத் தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
