revisions:
- from: இவற்றைப் பயிற்சி செய்; இவற்றிலேயே ஆழ்ந்திரு[a]. அப்போது உன் முன்னேற்றம் அனைவருக்கும் தெளிவாகத் தெரியும்.
  to: உன் முன்னேற்றம் அனைவருக்கும் தெளிவாகத் தெரியும்படி, இவற்றைப் பயிற்சி செய்; இவற்றிலேயே ஈடுபட்டிரு[a].
