source:
  edition: SBLGNT
  text: ταῦτα μελέτα, ἐν τούτοις ἴσθι, ἵνα σου ἡ προκοπὴ φανερὰ ⸀ᾖ πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/015.yaml
  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: ta
  text: உன் முன்னேற்றம் அனைவருக்கும் தெளிவாகத் தெரியும்படி, இவற்றைப் பயிற்சி செய்; இவற்றிலேயே ஈடுபட்டிரு[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றிலேயே இரு.” கிரேக்கத்தில் சொல்லுக்குச் சொல் இவ்வாறே உள்ளது; இது இவற்றில் ஆழமாக ஈடுபட்டிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முந்தைய வசனங்களில் பவுல் கூறிய அறிவுறுத்தல்களைச் சுட்டுகிறது; இயல்பான தமிழில் பன்மைச் சுட்டுப்பெயராக மொழிபெயர்க்கப்பட்டது.
- source_word: μελέτα
  choice: பயிற்சி செய்
  rationale: கவனமாகச் சிந்திப்பதோடு தொடர்ந்து நடைமுறைப்படுத்துவதையும் இச்சூழலில் குறிக்கிறது; வெறும் உள்ளார்ந்த தியானமாகக் குறுக்காமல் செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: ἐν τούτοις ἴσθι
  choice: இவற்றிலேயே ஆழ்ந்திரு
  rationale: சொல்லுக்குச் சொல் 'இவற்றில் இரு' என்று பொருள்படும் கிரேக்க மரபுத்தொடர், இக்கடமைகளில் முழுமையாக ஈடுபட்டிருப்பதை உணர்த்துகிறது. இயல்பான தமிழுக்காக 'ஆழ்ந்திரு' பயன்படுத்தப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἵνα
  choice: அப்போது
  rationale: இங்கு நோக்கம் அல்லது விளைவைக் காட்டும் ἵνα-வின் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முந்தைய கட்டளைகளைக் கடைப்பிடிப்பதன் நோக்கமுள்ள விளைவைச் சுட்டுகிறது.
- source_word: προκοπή
  choice: முன்னேற்றம்
  rationale: வளர்ச்சி அல்லது முன்னேற்றம் என்ற பரந்த பொருளைத் தக்கவைக்கிறது; ஆன்மிக வளர்ச்சி அல்லது ஊழியத் திறன் என்று தேவையின்றி குறுக்கவில்லை.
- source_word: φανερὰ ᾖ
  choice: தெளிவாகத் தெரியும்
  rationale: முன்னேற்றம் வெளிப்படையாகவும் பிறர் அறியக்கூடியதாகவும் இருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πᾶσιν
  choice: அனைவருக்கும்
  rationale: கண்ணில் உள்ள எல்லா மக்களையும் குறிக்கும் தத்துவைப் பொருளைச் சுருக்கமாகவும் நேரடியாகவும் வழங்குகிறது.
theological_decisions:
- issue: தீமோத்தேயுவின் வெளிப்படையான முன்னேற்றத்தின் பரப்பு
  choice: முந்தைய அறிவுறுத்தல்களில் அவரது ஒட்டுமொத்த முன்னேற்றம்
  alternative: ஆன்மிக முதிர்ச்சி மட்டும் அல்லது ஊழியத் திறன் மட்டும்
  rationale: சூழல் போதனை, நடத்தை, அர்ப்பணிப்பு ஆகிய அனைத்தையும் உள்ளடக்குகிறது. எனவே προκοπή என்பதன் பரந்த தன்மையைத் தக்கவைத்து, குறிப்பிட்ட ஒரு கோட்பாட்டுப் பொருளாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை முன்னிலை கட்டளை வடிவங்களுடன் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்க மரபுத்தொடரின் ஆழ்ந்த ஈடுபாட்டு கருத்து முதன்மை உரையில் இயல்பாக்கப்பட்டு, அதன் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
