source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: ta
  text: இதற்காகவே நாம் கடுமையாக உழைக்கிறோம்; நிந்திக்கப்படுகிறோம்[a]. ஏனெனில், உயிருள்ள கடவுள்மீது நம் நம்பிக்கையை வைத்திருக்கிறோம்[b]. அவரே எல்லா மனிதர்களுக்கும், குறிப்பாக விசுவாசிகளுக்கும் இரட்சகர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் பாடுபட்டு உழைக்கிறோம்; பழித்துரைக்கப்படுகிறோம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உயிருள்ள கடவுள்மீது நம் நம்பிக்கையை நிலைநிறுத்தியிருக்கிறோம்.”
    reason: lexical_alternative
  - marker: c
    text: “எல்லா மனிதர்களுக்கும், குறிப்பாக விசுவாசிகளுக்கும் இரட்சகர்” என்ற சொற்றொடர் மூலத்தில் உள்ளபடியே மொழிபெயர்க்கப்பட்டுள்ளது. இங்கு “இரட்சகர்” என்பது அனைவரையும் பாதுகாத்துப் பராமரிக்கும் கடவுளைக் குறிப்பிடுகிறதா, அனைவருக்கும் அவர் செய்துள்ள இரட்சிப்பின் ஏற்பாட்டைக் குறிப்பிடுகிறதா, அல்லது விசுவாசிகளிடம் சிறப்பாகச் செயல்படும் இரட்சிப்பைக் குறிப்பிடுகிறதா என்பதில் விளக்கவுரையாளர்கள் வேறுபடுகிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: இதற்காகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நோக்கத்தைச் சுட்டுகிறது; ‘-வே’ என்பது அந்த நோக்க வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: κοπιῶμεν
  choice: நாம் கடுமையாக உழைக்கிறோம்
  rationale: κοπιάω குறிக்கும் களைப்பூட்டும் தீவிர உழைப்பை எளிய, தற்போதைய தமிழில் தெரிவிக்கிறது.
- source_word: ὀνειδιζόμεθα
  choice: நிந்திக்கப்படுகிறோம்
  rationale: பிறரிடமிருந்து வரும் பழிப்பையும் இகழ்ச்சியையும் குறிக்கும் செயலப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
- source_word: ἠλπίκαμεν ἐπὶ
  choice: நம் நம்பிக்கையை வைத்திருக்கிறோம்
  rationale: முன்பு வைக்கப்பட்டு இப்போதும் தொடரும் உறுதியான நம்பிக்கையை கிரேக்க நிறைவுக்காலத்தின் தொடர்விளைவுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θεῷ ζῶντι
  choice: உயிருள்ள கடவுள்
  rationale: மூலத்தின் நிலையான வேதாகமச் சொல்லாட்சியை நேரடியாகவும் புரியத்தக்க வகையிலும் பாதுகாக்கிறது.
- source_word: σωτὴρ
  choice: இரட்சகர்
  rationale: காப்பவர் அல்லது விடுவிப்பவர் என்ற பொருள் வரம்பைக் கொண்ட இச்சொல்லின் ஆயர் நிருபங்களில் உள்ள தெளிவான இறையியல் கனத்தைப் பாதுகாக்கிறது.
- source_word: πάντων ἀνθρώπων
  choice: எல்லா மனிதர்களுக்கும்
  rationale: பாலினம் அல்லது மக்கள் வகை அடிப்படையில் சுருக்காமல், மனிதகுலம் முழுவதையும் உள்ளடக்கும் பொதுப்பொருளை வெளிப்படுத்துகிறது.
- source_word: μάλιστα
  choice: குறிப்பாக
  rationale: அனைவரைப் பற்றிய பொதுக் கூற்றையும் விசுவாசிகளைப் பற்றிய சிறப்புக் கூற்றையும் ஒன்றை மற்றொன்றாக மாற்றாமல் இணைக்கிறது.
- source_word: πιστῶν
  choice: விசுவாசிகளுக்கும்
  rationale: விசுவாசத்தால் அடையாளப்படுத்தப்படுகிறவர்களைத் தெளிவாகவும் வழக்கமான வேதாகமத் தமிழிலும் குறிக்கிறது.
theological_decisions:
- issue: ‘எல்லா மனிதர்களுக்கும், குறிப்பாக விசுவாசிகளுக்கும் இரட்சகர்’ என்பதன் பொருள்
  choice: அனைவரைப் பற்றிய விரிவான கூற்றையும் விசுவாசிகளுடனான சிறப்பான உறவையும் மூலத்தில் உள்ளபடியே வைத்தல்
  alternative: ‘இரட்சகர்’ என்பதை அனைவரையும் பராமரித்துக் காப்பவர் என்றும் விசுவாசிகளை மீட்பவர் என்றும் வேறுபடுத்துதல்; அல்லது இவ்வசனம் உலகளாவிய இறுதி இரட்சிப்பை உறுதிப்படுத்துவதாக எடுத்தல்; அல்லது ‘எல்லா மனிதர்களும்’ என்பதை ‘எல்லா வகையான மனிதர்களும்’ என்று குறுக்குதல்
  rationale: கிரேக்க உரை ‘எல்லா மனிதர்களும்’ என்ற பொதுமையையும் ‘குறிப்பாக விசுவாசிகள்’ என்ற தனிச்சிறப்பையும் ஒன்றாகக் கூறுகிறது. மொழிபெயர்ப்பு எந்த ஓர் கோட்பாட்டு விளக்கத்தையும் உரைக்குள் புகுத்தாமல் இந்த இறையியல் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுள்’, ‘இரட்சகர்’, ‘விசுவாசிகள்’ ஆகியவை தெளிவையும் வேதாகம இறையியல் நிறையையும் சமநிலைப்படுத்துகின்றன; எந்தச் சபைப் பிரிவின் தனிப்பட்ட விளக்கமும் உரைக்குள் சேர்க்கப்படவில்லை.
