revisions:
- from: தங்கள் சொந்த மனச்சாட்சியில் சூட்டுக்காயம் பட்ட பொய்யர்களின் பாசாங்கின் மூலமாக,[a]
  to: தங்கள் சொந்த மனச்சாட்சி சூட்டால் பொசுக்கப்பட்ட பொய்யர்களின் பாசாங்கினால்,[a]
  rationale: The revision preserves the Greek perfect passive image and its resulting state while using natural Tamil. ‘சூட்டால் பொசுக்கப்பட்ட’ allows the searing/cauterizing sense without deciding whether the metaphor specifically denotes branding or moral insensibility; the footnote preserves the branding alternative. The clause remains appropriately incomplete because it continues the preceding sentence.
