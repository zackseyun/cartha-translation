  text: ἐν ὑποκρίσει ψευδολόγων, κεκαυστηριασμένων τὴν ἰδίαν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/002.yaml
  text: through the hypocrisy of liars whose own conscience has been seared,[a]
translation:
  language: ta
  text: தங்கள் சொந்த மனச்சாட்சி சூட்டால் பொசுக்கப்பட்ட பொய்யர்களின் பாசாங்கினால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் சொந்த மனச்சாட்சியில் சூட்டுக்குறி பதிக்கப்பட்ட.” கிரேக்கப் படிமம் மனச்சாட்சியில் குறியிடப்பட்ட நிலையையோ, சூட்டால் பொசுக்கப்பட்டு உணர்விழந்த நிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: மூலமாக
  rationale: இங்கு ἐν முந்தைய கூற்றுடன் தொடர்புடைய வழிமுறை அல்லது கருவியைக் குறிக்கிறது. “மூலமாக” என்பது அந்தப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὑποκρίσει
  choice: பாசாங்கின்
  rationale: ὑπόκρισις வெளிப்படையான தோற்றத்துக்கும் உள்ளார்ந்த உண்மைக்கும் இடையிலான பொய்மையை, அதாவது பாசாங்கை, குறிக்கிறது.
- source_word: ψευδολόγων
  choice: பொய்யர்களின்
  rationale: இந்தப் பன்மைச் சொல்லுக்கு பொய்யைப் பேசுவோர் என்று பொருள். இது ὑποκρίσει என்பதுடன் இணைந்து “பொய்யர்களின் பாசாங்கு” என வருகிறது.
- source_word: κεκαυστηριασμένων
  choice: சூட்டுக்காயம் பட்ட
  rationale: இந்த நிறைவுற்ற செயலெச்சம் சூட்டுக்கோலால் குறியிடுதல் அல்லது சூட்டால் பொசுக்குதல் ஆகிய இரு படிமங்களையும் எழுப்பக்கூடும். “சூட்டுக்காயம் பட்ட” என்பது விளைவாக நீடிக்கும் நிலையைக் காட்டுவதோடு, எந்த ஒரு படிமத்தையும் அளவுக்கு மீறி உறுதிசெய்யவில்லை.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: தங்கள் சொந்த மனச்சாட்சியில்
  rationale: ἰδίαν என்பதன் வலியுறுத்தலை “சொந்த” காக்கிறது. கிரேக்கத்தில் ஒருமையாக உள்ள συνείδησις, தமிழிலும் பகிர்மானப் பொருளில் இயல்பாக ஒருமையில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: κεκαυστηριασμένων என்பதன் உருவகப் பொருள்
  choice: “சூட்டுக்காயம் பட்ட” என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: “மனச்சாட்சி மரத்துப்போன” அல்லது “மனச்சாட்சியில் சூட்டுக்குறி பதிக்கப்பட்ட”
  rationale: கிரேக்கப் படிமம் சூட்டுக்குறி இடப்பட்ட நிலையையோ, சூட்டால் பொசுக்கப்பட்டு உணர்விழந்த நிலையையோ சுட்டலாம். முதன்மை உரை மனச்சாட்சி முற்றிலும் உணர்விழந்தது அல்லது மீள முடியாத ஆன்மீக நிலையில் உள்ளது என்று கோட்பாட்டுரீதியாக முடிவுசெய்யாமல், மூலத்தின் இறையியல் இறுக்கத்தைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, ஆனால் வேதாகம மொழிபெயர்ப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இது முழு வாக்கியத்தின் முந்தைய பகுதியுடன் தொடரும் துணைச்சொற்றொடர் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
