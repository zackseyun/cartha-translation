  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கச் சூத்திரத்தின் இரு இணையான மதிப்பீடுகளையும் அரைப்புள்ளி மூலம் தெளிவாக வைத்திருக்கிறது.
