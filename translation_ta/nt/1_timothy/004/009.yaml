  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/009.yaml
  text: The saying is trustworthy and worthy of full acceptance,[a]
translation:
  language: ta
  text: இந்தக் கூற்று நம்பத்தகுந்தது; முழுமையாக ஏற்றுக்கொள்ளப்படத் தகுந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வார்த்தை நம்பத்தகுந்தது” அல்லது “இந்த அறிக்கை நம்பத்தகுந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: நம்பத்தகுந்தது
  rationale: இங்கு பெயரடை முன்னிலையாக வந்து, இந்தக் கூற்று நம்பிக்கைக்குரியது, சார்ந்திருக்கத்தக்கது என்ற பொருளைத் தருகிறது. ‘நம்பத்தகுந்தது’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ὁ λόγος
  choice: இந்தக் கூற்று
  rationale: ஆயர் திருமுகங்களில் காணப்படும் இச்சொற்றொடரில் λόγος ஒரு குறிப்பிட்ட கூற்றைச் சுட்டுகிறது. தமிழில் ‘இந்தக் கூற்று’ என்பது சூழலைத் தெளிவாகச் சுட்டுவதோடு, ‘வார்த்தை’ என்பதால் ஏற்படக்கூடிய பரந்த இறையியல் பொருளைத் தவிர்க்கிறது.
- source_word: πάσης
  choice: முழுமையாக
  rationale: πάσης ἀποδοχῆς என்ற தொடரில் முழு அளவிலான ஏற்றுக்கொள்ளுதலைக் குறிக்கிறது. தமிழில் வினையடை வடிவமான ‘முழுமையாக’ இயல்பாக உள்ளது.
- source_word: ἀποδοχῆς
  choice: ஏற்றுக்கொள்ளப்பட
  rationale: ἀποδοχή இங்கு ஒரு கூற்றை வரவேற்று ஏற்றுக்கொள்வதைக் குறிக்கிறது. தமிழில் ‘ஏற்றுக்கொள்ளப்பட’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἄξιος
  choice: தகுந்தது
  rationale: ἄξιος உடன் வரும் பிறப்புவேற்றுமை அமைப்பு ‘அதற்குத் தகுதியானது’ என்ற பொருளைத் தருகிறது. ‘தகுந்தது’ இந்தச் சூழலில் சுருக்கமாகவும் இயல்பாகவும் அமைகிறது.
theological_decisions: []
