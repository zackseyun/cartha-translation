id: 1TI.4.4
reference: 1 Timothy 4:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: ta
  text: ஏனெனில், கடவுள் படைத்த ஒவ்வொன்றும் நல்லது[a]; நன்றியுடன் ஏற்றுக்கொள்ளப்பட்டால், எதுவும் தள்ளிவிடப்பட வேண்டியதல்ல[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய ஒவ்வொரு படைப்பும் நல்லது.” κτίσμα என்ற கிரேக்கச் சொல் “படைக்கப்பட்ட ஒன்று,” “உயிரினம்,” அல்லது விரிவாக “படைப்பு” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நன்றியுடன் ஏற்றுக்கொள்ளப்படும்போது, எதுவும் தள்ளிவிடத்தக்கதல்ல.”
    reason: grammatical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச்சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: πᾶν κτίσμα θεοῦ
  choice: கடவுள் படைத்த ஒவ்வொன்றும்
  rationale: ஒருமையோடு வரும் πᾶν என்பதன் பகிர்வுப் பொருளையும், κτίσμα என்பதன் ‘படைக்கப்பட்ட ஒன்று’ என்ற பரந்த பொருளையும் இயல்பான தமிழில் காக்கிறது; இதை உணவு என்று மட்டும் குறுக்கவில்லை.
- source_word: καλόν
  choice: நல்லது
  rationale: படைப்பின் நன்மையை நேரடியாகச் சுட்டுகிறது; படைப்பைப் பற்றிய வேதாகம மொழியோடும் இயல்பாக ஒலிக்கிறது.
- source_word: οὐδὲν ἀπόβλητον
  choice: எதுவும் தள்ளிவிடப்பட வேண்டியதல்ல
  rationale: ἀπόβλητον என்பதிலுள்ள ‘நிராகரிக்கத்தக்கது/தள்ளிவிடத்தக்கது’ என்ற கருத்தைத் தெளிவான, தற்போதைய தமிழில் வெளிப்படுத்துகிறது.
- source_word: μετὰ εὐχαριστίας
  choice: நன்றியுடன்
  rationale: நன்றி செலுத்தும் மனப்பாங்கையும் செயலையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λαμβανόμενον
  choice: ஏற்றுக்கொள்ளப்பட்டால்
  rationale: செயப்பாட்டு நிகழ்காலப் பங்கேற்புச் சொல்லை, சூழலில் வெளிப்படும் நிபந்தனைத் தொடர்புடன் இயல்பான தமிழில் வழங்குகிறது; காலப்பொருளாகவும் வாசிக்கக்கூடிய வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: உணவுக் கட்டுப்பாடுகளின் சூழலில் κτίσμα என்பதன் வரம்பு
  choice: கடவுள் படைத்த ஒவ்வொன்றும்
  alternative: கடவுளுடைய ஒவ்வொரு உயிரினமும் / கடவுள் படைத்த எல்லா உணவும்
  rationale: உடனடிச் சூழல் உணவைப் பற்றியதாக இருந்தாலும், கிரேக்கச் சொல் அதைவிடப் பரந்தது. ஆகவே வசனத்தை உணவுக்கு மட்டும் குறுக்காமலும், உயிரினங்களுக்கு மட்டும் வரையறுக்காமலும் படைப்பைச் சார்ந்த பரந்த கூற்றாக மொழிபெயர்க்கிறது.
- issue: λαμβανόμενον என்பதன் நிபந்தனை அல்லது காலச் சார்பு
  choice: ஏற்றுக்கொள்ளப்பட்டால்
  alternative: ஏற்றுக்கொள்ளப்படும்போது
  rationale: நன்றியுடன் ஏற்றுக்கொள்வதற்கும் தள்ளிவிடாமல் இருப்பதற்கும் இடையிலான தொடர்பை நிபந்தனையாகத் தெளிவாக்குகிறது; கிரேக்கப் பங்கேற்புச் சொல்லின் காலவாசிப்பையும் அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. “கடவுள் படைத்த ஒவ்வொன்றும்” என்பது சொல்லுக்குச் சொல் இறுக்கத்தைத் தவிர்த்து மூலத்தின் பரந்த பொருளைக் காக்கிறது; “தள்ளிவிடப்பட வேண்டியதல்ல” என்பது பொதுவாசகருக்குப் புரியும் வகையில் ἀπόβλητον என்பதன் வலிமையைத் தருகிறது.
