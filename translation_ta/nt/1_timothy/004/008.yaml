id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: ta
  text: ஏனெனில், உடற்பயிற்சி சிறிதளவே பயனுள்ளது[a]; ஆனால் இறைப்பற்று எல்லாவற்றிற்கும் பயனுள்ளது. அது இப்போதைய வாழ்வுக்கும் வரவிருக்கும் வாழ்வுக்கும் வாக்குறுதியைக் கொண்டிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிறிது காலத்திற்கே” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொற்றொடர் குறைந்த அளவையோ குறுகிய காலத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: உடற்பயிற்சி
  rationale: உடலைச் சார்ந்த பயிற்சி அல்லது உடல் ஒழுக்கப் பயிற்சி என்ற கருத்தை இயல்பான நவீன தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: πρὸς ὀλίγον
  choice: சிறிதளவே
  rationale: இச்சொற்றொடர் குறுகிய காலத்தையோ குறைந்த அளவையோ குறிக்கக்கூடும். முதன்மை உரையில் அளவின் வரம்பை இயல்பாகக் காட்டி, மாற்று காலப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: ὠφέλιμος
  choice: பயனுள்ளது
  rationale: இரு கூற்றுகளிலும் ஒரே சொல்லால் கிரேக்கத்தின் இணையான அமைப்பைப் பேணும் தெளிவான நவீனத் தமிழ்.
- source_word: εὐσέβεια
  choice: இறைப்பற்று
  rationale: கடவுளை நோக்கிய பயபக்தி, மரியாதை, அதற்கேற்ற வாழ்க்கை ஆகியவற்றை உள்ளடக்கும் இயல்பான சொல்; வெறும் சடங்காசாரமாகக் குறுக்கவில்லை.
- source_word: πρὸς πάντα
  choice: எல்லாவற்றிற்கும்
  rationale: கிரேக்கச் சொற்றொடரின் விரிவான பரப்பை நேரடியாகப் பேணுகிறது.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: வாக்குறுதியைக் கொண்டிருக்கிறது
  rationale: இறைப்பற்றே வாக்குறுதியைக் கொண்டிருப்பதாக வரும் பங்கேற்புச் சொற்றொடரின் தொடர்பைப் பேணுகிறது; தமிழின் தெளிவுக்காக தனி வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: ζωῆς τῆς νῦν καὶ τῆς μελλούσης
  choice: இப்போதைய வாழ்வுக்கும் வரவிருக்கும் வாழ்வுக்கும் உரிய
  rationale: இப்போதைய மற்றும் வரவிருக்கும் வாழ்க்கை என்ற கால வேறுபாட்டைத் தெளிவாகக் காட்டி, கிரேக்கத்தில் இரண்டாவது இடத்தில் மறைந்துள்ள ζωή என்பதையும் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடற்பயிற்சியின் பயன் எந்த வகையில் வரம்புடையது?
  choice: உடற்பயிற்சி சிறிதளவு பயனுள்ளது; இறைப்பற்று எல்லாவற்றிற்கும் பயனுள்ளது
  alternative: உடற்பயிற்சி சிறிது காலத்திற்குப் பயனுள்ளது
  rationale: πρὸς ὀλίγον என்பது அளவிலும் காலத்திலும் வரம்பைக் குறிக்கக்கூடும். உடற்பயிற்சியைப் பயனற்றதாகக் கூறாமல், இறைப்பற்றின் விரிவான பயனோடு உள்ள ஒப்பீட்டை முதன்மை உரை பேணுகிறது; காலப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: வாக்குறுதியின் தொடர்பு
  choice: இறைப்பற்று இப்போதைய வாழ்வுக்கும் வரவிருக்கும் வாழ்வுக்கும் உரிய வாக்குறுதியைக் கொண்டிருக்கிறது
  alternative: இறைப்பற்று இவ்விரு வாழ்வுகளையும் நேரடியாக உறுதி செய்கிறது
  rationale: ἐπαγγελίαν ἔχουσα என்ற மொழியை மிகைப்படுத்தாமல், வாக்குறுதியை உடையது என்ற மூல உரையின் அமைப்பையும் இறையியல் நெருக்கடியையும் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வாசிப்பிற்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் இரு இணையான கூற்றுகளிலும் “பயனுள்ளது” மீண்டும் பயன்படுத்தப்பட்டு வாக்கிய அமைப்பு பேணப்பட்டுள்ளது.
