  text: Command these things and teach them[a].
translation:
  language: ta
  text: இவற்றைக் கட்டளையிடு; போதித்துக்கொண்டிரு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றை அறிவுறுத்து; போதித்துக்கொண்டிரு.”
    reason: παραγγέλλω என்பதற்கு வலிமை குறைந்தாலும் சாத்தியமான சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: Παράγγελλε
  choice: கட்டளையிட்டுக்கொண்டிரு
  rationale: நிகழ்காலச் செயப்பாட்டு ஏவல் வடிவம் தொடர்ந்து அதிகாரத்துடன் கட்டளையிடுவதைக் குறிக்கிறது. தமிழில் இணை வினையெச்ச அமைப்புக்கேற்ப ‘கட்டளையிட்டுப்’ என்று முதன்மை உரையில் வருகிறது; தொடர்ச்சிப் பொருள் இறுதி வினையில் வெளிப்படுகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: நடுநிலைப் பன்மைச் சுட்டுப்பெயர் முன் கூறப்பட்ட போதனைகளையும் அறிவுறுத்தல்களையும் சுட்டுகிறது; ‘இவற்றை’ அதன் பன்மையையும் பின்னோக்கிய சுட்டுதலையும் இயல்பாகக் காக்கிறது.
- source_word: καὶ
  choice: -ப் (இணைப்பு)
  rationale: இரு ஏவல்களையும் இணைக்கும் καὶ, தமிழின் இயல்பான வினையெச்சத் தொடரில் ‘கட்டளையிட்டுப் போதித்துக்கொண்டிரு’ என வெளிப்படுகிறது.
- source_word: δίδασκε
  choice: போதித்துக்கொண்டிரு
  rationale: நிகழ்கால ஏவல் தொடர்ந்து போதிக்கும் செயலைக் குறிக்கிறது. ‘போதித்துக்கொண்டிரு’ அந்த நீடித்த செயற்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது; அதன் பொருள் ‘இவற்றை’ என்பதிலிருந்து பெறப்படுகிறது.
theological_decisions:
- issue: παραγγέλλω ஏவலில் உள்ள அதிகாரத் தன்மை
  choice: ‘கட்டளையிடு’ என்ற வலிமையான பொருளை வைத்திருத்தல்
  alternative: ‘அறிவுறுத்து’ அல்லது ‘வலியுறுத்து’
  rationale: கிரேக்கச் சொல் வெறும் ஆலோசனையைக் காட்டிலும் அதிகாரமுள்ள பணிப்புரையைக் குறிக்கிறது. அதே நேரத்தில், இவ்வசனத்தைத் தாண்டிய திருச்சபை அதிகாரக் கோட்பாடு எதையும் மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. இரு கிரேக்க நிகழ்கால ஏவல்களின் தொடர்ச்சித் தன்மை ‘-க்கொண்டிரு’ மூலம் வெளிப்படுகிறது; மீளுரைப்பைத் தவிர்க்கத் தமிழுக்கேற்ற வினையெச்ச இணைப்பு பயன்படுத்தப்பட்டுள்ளது.
