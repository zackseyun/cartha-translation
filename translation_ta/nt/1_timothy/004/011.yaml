- from: இவற்றைக் கட்டளையிட்டுப் போதித்துக்கொண்டிரு.[a]
  to: இவற்றைக் கட்டளையிடு; போதித்துக்கொண்டிரு.[a]
  rationale: The revision retains the authoritative “கட்டளையிடு,” the plural reference of “இவற்றை,” and the ongoing sense naturally expressed in “போதித்துக்கொண்டிரு.” A semicolon preserves the source's coordination of two imperatives without adding a sequence or subordination between them.
