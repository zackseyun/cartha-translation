id: 1TI.1.15
reference: 1 Timothy 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: ta
  text: 'இந்தக் கூற்று நம்பத்தகுந்ததும் முழுமையாக ஏற்றுக்கொள்ளத் தகுந்ததும் ஆகும்: பாவிகளை இரட்சிப்பதற்காக மேசியா இயேசு[a] உலகத்திற்கு வந்தார்; அவர்களில் முதன்மையானவன்[b] நானே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து இயேசு.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “மிக மோசமானவன்” அல்லது “தலைசிறந்தவன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: இந்தக் கூற்று நம்பத்தகுந்தது
  rationale: மேய்ப்புப் பொறுப்பு கடிதங்களில் வரும் நிலையான அறிமுகச் சூத்திரத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; λόγος இங்கு தனிப்பட்ட ‘வார்த்தை’ என்பதைவிட சுருக்கமான கூற்றைக் குறிக்கிறது.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: முழுமையாக ஏற்றுக்கொள்ளத் தகுந்தது
  rationale: πάσης என்பதன் தீவிரத்தையும் ἀποδοχή என்பதன் ஏற்றுக்கொள்ளுதல் என்ற பொருளையும் தெளிவான தமிழில் காக்கிறது.
- source_word: Χριστὸς Ἰησοῦς
  choice: மேசியா இயேசு
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைத் தக்கவைத்திருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டது; மரபான மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: உலகத்திற்கு வந்தார்
  rationale: இயக்கத்தையும் இச்சூழலின் இறையியல் எதிரொலியையும் மிகைவிளக்கம் இன்றி இயல்பாகக் காக்கிறது.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: பாவிகளை இரட்சிப்பதற்காக
  rationale: σῶσαι என்பதன் நோக்கத்தைத் தமிழில் இயல்பாகக் காட்டும் infinitival-purpose வடிவம்; சoteriological சூழலில் ‘இரட்சிக்க’ துல்லியமான மரபுச் சொல்.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: அவர்களில் முதன்மையானவன் நானே
  rationale: πρῶτος என்பதன் வரிசை அல்லது முன்னிலை உருவகத்தைத் தக்கவைக்கிறது; வாக்கிய இறுதியிலுள்ள ‘நானே’ மூலத்தின் வலியுறுத்தலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இவ்வறிக்கை வடிவில் பட்டப்பெயர் உணர்வு தெளிவாக இருப்பதால் ‘மேசியா’ முதன்மைப் பாடமாக வைக்கப்பட்டது; பெயரைப் போன்ற மரபான பயன்பாட்டை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: πρῶτος மூலம் பவுலின் பாவிகளிடையேயான நிலை
  choice: முதன்மையானவன்
  alternative: மிக மோசமானவன் / தலைவன்
  rationale: மூலச்சொல் ‘முதல்’ அல்லது ‘முன்னிலை வகிப்பவன்’ என்று பொருள்படலாம். ‘மிக மோசமானவன்’ என்பது சூழலுக்குப் பொருத்தமான விளக்கம் என்றாலும், அது மூலத்தின் உருவகத்தை ஒரே விளக்கமாகச் சுருக்கிவிடும்; ஆகவே முதன்மைப் பாடத்தில் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. ‘கூற்று’, ‘நம்பத்தகுந்தது’, ‘முழுமையாக ஏற்றுக்கொள்ளத் தகுந்தது’ ஆகியவை சூத்திரத் தன்மையை இயல்பாக வெளிப்படுத்துகின்றன; ‘நானே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது.
