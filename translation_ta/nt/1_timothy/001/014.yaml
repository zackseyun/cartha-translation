  source_fidelity: மிகச் சிறப்பு. ὑπερεπλεόνασεν என்பதன் தீவிரமான ‘மிகுதியாய்/எல்லை கடந்து பெருகுதல்’ பொருளை ‘அளவுகடந்து பொங்கிப் பெருகியது’ துல்லியமாகத் தருகிறது. δέ-இன் முன்னைய சூழலோடான மாறுபாடு ‘ஆனால்’ மூலம் காக்கப்படுகிறது. μετὰ πίστεως καὶ ἀγάπης என்பது அருளோடு இணைக்கப்பட்டதாகவே மொழிபெயர்க்கப்பட்டுள்ளது; காரண உறவு திணிக்கப்படவில்லை. ‘மேசியாவாகிய இயேசுவுக்குள் உள்ள’ என்பது πίστεως καὶ ἀγάπης இரண்டிற்கும் பொருந்தும் ἐν Χριστῷ Ἰησοῦ-ஐ இயல்பாகத் தெரிவிக்கிறது.
