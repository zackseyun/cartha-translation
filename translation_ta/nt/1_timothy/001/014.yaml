source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: ta
  text: ஆனால் நம் ஆண்டவரின் அருள், மேசியாவாகிய இயேசுவுக்குள்[a] உள்ள விசுவாசத்தோடும் அன்போடும் சேர்ந்து, அளவுகடந்து பொங்கிப் பெருகியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து இயேசுவுக்குள்.”
    reason: Χριστός என்பதற்கான பரிச்சயமான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: அளவுகடந்து பொங்கிப் பெருகியது
  rationale: இந்த வினைச்சொல்லின் தீவிரப்படுத்தப்பட்ட ‘மிகுதியாகப் பெருகுதல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அருள் சாதாரணமாகப் பெருகியதல்ல, எல்லை கடந்து நிரம்பியதை உணர்த்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அவிசுவாசம் மற்றும் அறியாமைக்கு மாறாக ஆண்டவரின் அருளை முன்வைக்கும் எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: χάρις
  choice: அருள்
  rationale: χάρις என்பதன் இச்சூழலுக்குரிய இறையியல் மற்றும் வழக்குப் பொருளைத் தெளிவாகவும் மரியாதையான தமிழிலும் தருகிறது.
- source_word: τοῦ κυρίου ἡμῶν
  choice: நம் ஆண்டவரின்
  rationale: κύριος என்பதைக் ‘ஆண்டவர்’ என்று மொழிபெயர்த்து, முதல் நபர் பன்மை உடைமையை இயல்பாகக் காட்டுகிறது.
- source_word: μετὰ
  choice: …தோடும் …தோடும் சேர்ந்து
  rationale: அருள் விசுவாசத்துடனும் அன்புடனும் பொங்கிப் பெருகியது என்ற இலக்கணத் தொடர்பை வெளிப்படையாகக் காட்டுகிறது; அவை அருளால் உண்டாயின என்று உரையில் இல்லாத காரணத் தொடர்பைச் சேர்க்கவில்லை.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இங்கு πίστις என்பதன் நேரடியான பொருளைத் தரும் நிலையான தமிழ் வேதாகமச் சொல்.
- source_word: ἀγάπης
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கு இயல்பான, புரிந்துகொள்ள எளிய நவீன தமிழ் இணைச்சொல்.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவுக்குள் உள்ள
  rationale: ἐν என்பதன் ஒன்றிப்பைச் சுட்டும் ‘உள்ள/உள்ளே’ உறவைப் பாதுகாத்து, பின்வரும் தொடர் விசுவாசம் மற்றும் அன்பு இரண்டையும் குறிப்பதைத் தெளிவாக்குகிறது.
- source_word: Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός என்பதன் பட்டப்பெயரான ‘அபிஷேகம் செய்யப்பட்டவர்/மேசியா’ என்ற பொருளைத் தமிழில் வெளிப்படையாகக் காக்கிறது; பரிச்சயமான ‘கிறிஸ்து இயேசு’ மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘விசுவாசத்தோடும் அன்போடும்’ என்பதற்கும் ‘அருள்’ என்பதற்கும் இடையிலான தொடர்பு
  choice: ஆண்டவரின் அருள், மேசியாவாகிய இயேசுவுக்குள் உள்ள விசுவாசத்தோடும் அன்போடும் சேர்ந்து பொங்கிப் பெருகியது.
  alternative: விசுவாசமும் அன்பும் அருளால் பவுலில் உருவாக்கப்பட்ட பண்புகள்.
  rationale: μετά கொண்ட சொற்றொடர் இலக்கணப்படி பொங்கிப் பெருகிய அருளுடன் மிக இயல்பாக இணைகிறது. அருள் இப்பண்புகளை உண்டாக்குகிறது என்ற இறையியல் விளக்கம் சாத்தியமானதாயினும், மொழிபெயர்ப்பு அந்தக் காரணத் தொடர்பை உரைக்குள் கட்டாயப்படுத்தவில்லை.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பட்டப்பெயரின் பொருளைத் தக்கவைக்க ‘மேசியா’ பயன்படுத்தப்படுகிறது. தமிழில் பரவலாக அறியப்பட்ட ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாய் இருந்தாலும் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘அளவுகடந்து பொங்கிப் பெருகியது’ என்பது கிரேக்கத் தீவிரத்தை இயல்பாக எடுத்துரைக்கிறது; ‘சேர்ந்து’ என்பது μετά தொடர்பைத் தெளிவாக்குகிறது.
