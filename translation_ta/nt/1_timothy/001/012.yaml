id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: ta
  text: என்னை வலிமைப்படுத்திய நம் ஆண்டவராகிய மேசியா இயேசுவுக்கு[a] நான் நன்றி செலுத்துகிறேன்; ஏனெனில் அவர் என்னை நம்பகமானவன் என்று கருதி, ஊழியத்திற்காக நியமித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்து இயேசுவுக்கு.’ கிரேக்கப் பட்டமான Χριστός என்பதை அதன் பொருளின்படி ‘மேசியா’ என்றும், மரபான ஒலிபெயர்ப்பின்படி ‘கிறிஸ்து’ என்றும் வழங்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: நான் நன்றி செலுத்துகிறேன்
  rationale: இந்தக் கிரேக்க மரபுத்தொடர் நன்றி தெரிவிப்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் வினைச்செயலின் வலிமையைத் தக்கவைத்தும் இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐνδυναμώσαντί με
  choice: என்னை வலிமைப்படுத்திய
  rationale: இயேசு பவுலுக்குத் தேவையான வலிமையையும் செயலாற்றும் திறனையும் அளித்தார் என்பதைக் குறிக்கிறது; குறிப்பிட்ட வகை ஆவிக்குரிய அதிகாரமளிப்பை உரையில் இல்லாமல் சேர்ப்பதில்லை.
- source_word: Χριστῷ Ἰησοῦ
  choice: மேசியா இயேசுவுக்கு
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுகிறது. அதன் பட்டப்பொருளை வெளிப்படுத்த ‘மேசியா’ பயன்படுத்தப்படுகிறது; தமிழில் உறவைத் தெளிவாக்க ‘நம் ஆண்டவராகிய’ என்பதுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: κυρίῳ ἡμῶν
  choice: நம் ஆண்டவராகிய
  rationale: κύριος இங்கு அதிகாரத்தைக் குறிக்கும் கிறிஸ்தியல் பட்டம்; ‘ஆண்டவர்’ என்பது நவீன வேதாகமத் தமிழில் இயல்பானதும் கண்ணியமானதும் ஆகும்.
- source_word: πιστόν
  choice: நம்பிக்கைக்குரியவன்
  rationale: ஒப்படைக்கப்படும் பணிக்குத் தகுந்த நம்பகத்தன்மையை இச்சொல் குறிக்கிறது. ‘நம்பிக்கைக்குரியவன்’ என்பது விசுவாசம், உண்மைத்தன்மை, நம்பகத்தன்மை ஆகியவற்றில் ஒன்றை மட்டும் மிகையாகக் குறுக்காமல் சூழலுக்கேற்ற பொருளைத் தருகிறது.
- source_word: ἡγήσατο
  choice: என்று கருதி
  rationale: ஒருவரை ஒரு குறிப்பிட்ட விதமாக மதிப்பிடுதல் அல்லது கருதுதல் என்பதே இங்கு பொருள்; நீதிமன்றத் தீர்ப்பின் நிழற்பொருளைச் சேர்க்காமல் உள்ளது.
- source_word: θέμενος
  choice: அமர்த்தினார்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘வைத்தல்’; இச்சூழலில் ஒரு சேவைக்குள் ஒருவரை வைத்தல் அல்லது நியமித்தல் என்பதால் ‘அமர்த்தினார்’ இயல்பாகப் பொருளை வெளிப்படுத்துகிறது.
- source_word: εἰς διακονίαν
  choice: ஊழியத்தில்
  rationale: διακονία சேவை அல்லது ஊழியத்தைக் குறிக்கலாம். இங்கு ஒப்படைக்கப்பட்ட பணியை ‘ஊழியம்’ தெளிவாகக் காட்டுகிறது; பிற்காலத் திருச்சபைப் பதவி அமைப்பை இதில் சேர்ப்பதில்லை.
theological_decisions:
- issue: Χριστός என்பதன் மொழியாக்கம்
  choice: மேசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு Χριστός ஒரு பட்டமாகப் பொருள் தருவதால் ‘மேசியா’ அதன் பட்டத் தன்மையை வெளிப்படுத்துகிறது. தமிழில் மரபாக நிலைபெற்ற ‘கிறிஸ்து’ என்பதும் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பவுல் ஊழியத்தில் அமர்த்தப்பட்டதன் நுணுக்கம்
  choice: என்னை நம்பிக்கைக்குரியவன் என்று கருதி, ஊழியத்தில் அமர்த்தினார்
  alternative: என்னை உண்மையுள்ளவன் என்று எண்ணி, சேவைக்காக நியமித்தார்
  rationale: கிறிஸ்து பவுலை நம்பகமானவராகக் கருதியதும் அவரைச் சேவைக்குள் வைத்ததும் இரண்டும் உரையில் இணைந்துள்ளன. இந்த மொழியாக்கம் அவற்றைத் தக்கவைக்கிறது; குறிப்பிட்ட திருச்சபைப் பதவியை இறக்குமதி செய்வதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் காரண உறவு ‘ஏனெனில்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது; தமிழில் வாசிப்புத் தெளிவுக்காக ஒரே கிரேக்க வாக்கியம் இரு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. ‘ஊழியம்’ என்பது சமயச் சூழலுக்கு இயல்பான சொல் என்றாலும், அதன் பரந்த ‘சேவை’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
