source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: ta
  text: நான் மக்கெதோனியாவுக்குச் செல்லும்போது, நீ எபேசுவில் தங்கியிருக்குமாறு உன்னை வலியுறுத்தியபடியே, அங்கே சிலருக்கு வேறுபட்ட போதனையைப் போதிக்க வேண்டாமென்று கட்டளையிடுவதற்காகவும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καθὼς
  choice: அதன்படியே
  rationale: முன்பு விடுத்த வேண்டுகோளை இப்போது தொடரும் வாக்கியத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παρεκάλεσά
  choice: வேண்டிக்கொண்டேன்
  rationale: அதிகாரப்பூர்வமான சூழலிலும், இச்சொல்லின் வேண்டுதல் அல்லது வலியுறுத்தல் சார்ந்த நுணுக்கத்தை ‘கட்டளையிட்டேன்’ என மிகைப்படுத்தாமல் காக்கிறது.
- source_word: προσμεῖναι ἐν Ἐφέσῳ
  choice: எபேசுவில் தங்கியிருக்கும்படி
  rationale: ஒரு இடத்தில் தொடர்ந்து இருக்குமாறு கேட்டதைக் காலத்திற்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: நான் மக்கெதோனியாவுக்குப் புறப்பட்டபோது
  rationale: பங்கேற்புவினையின் காலச் சூழலையும், பயணம் செய்பவர் பவுல் என்பதையும் தெளிவாக்குகிறது; ‘புறப்பட்டபோது’ பயணத்தின் தொடக்கத்தையும் இயல்பாகக் குறிக்கிறது.
- source_word: ἵνα
  choice: அதன்படியே
  rationale: தமிழ் வாக்கிய அமைப்பில் முன்னைய வேண்டுகோளின் நோக்கத்தை அடுத்த கட்டளையுடன் இணைக்கிறது.
- source_word: παραγγείλῃς
  choice: கட்டளையிடு
  rationale: παραγγέλλω இச்சூழலில் அதிகாரத்துடன் வழங்கப்படும் அறிவுறுத்தலைக் குறிக்கிறது; ‘அறிவுறுத்து’ என்பதைக் காட்டிலும் அதன் வலிமையை நேரடியாகக் காக்கிறது.
- source_word: τισὶν
  choice: சிலர் … அவர்களுக்கு
  rationale: குறிப்பிட்டிருந்தும் பெயரிடப்படாத சில நபர்களைக் குறிக்கும் தத்திவை இயல்பான தமிழ் அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ἑτεροδιδασκαλεῖν
  choice: வேறுபட்ட போதனையைப் போதிக்க
  rationale: அப்போஸ்தல போதனையிலிருந்து மாறுபட்ட போதனை என்ற கருத்தைக் காக்கிறது; மூலச்சொல்லைவிட வலுவான ‘பொய்ப் போதனை’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: παραγγείλῃς என்பதன் அதிகார வலிமை
  choice: கட்டளையிடு
  alternative: அறிவுறுத்து
  rationale: சபைப் போதனையைத் திருத்தும் பிரதிநிதித்துவ அதிகாரம் சூழலில் தெளிவாக இருப்பதால், மூல வினையின் வலிமையை ‘கட்டளையிடு’ சிறப்பாகக் காக்கிறது; அடிக்குறிப்பில் மென்மையான மாற்று தரப்படுகிறது.
- issue: ἑτεροδιδασκαλεῖν என்பதிலுள்ள மதிப்பீட்டை எவ்வளவு வெளிப்படுத்துவது
  choice: வேறுபட்ட போதனையைப் போதிக்க
  alternative: பொய்ப் போதனையைப் போதிக்க
  rationale: கூட்டுச்சொல் வேறான அல்லது மாறுபட்ட போதனையை நேரடியாகக் குறிக்கிறது. ‘பொய்’ என்பது சூழலால் உணரப்படலாம்; ஆனால் அதை மொழிபெயர்ப்பில் சேர்ப்பது மூலச்சொல்லின் வெளிப்படையான பொருளைவிட வலுவான தீர்ப்பைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. நீண்ட கிரேக்க வாக்கியத்தை தமிழ் வாசிப்பின் இயல்புக்காக இரண்டு வாக்கியங்களாக அமைத்தாலும், வேண்டுகோள்–நோக்கம் என்ற தொடர்பு ‘அதன்படியே’ என்பதால் காக்கப்பட்டுள்ளது. வசனம் தொடர்வாக்கியமாக முடியும் மூல அமைப்பை விட, இங்கு தனித்த வசனமாக வாசிக்க ஏற்ற நிறுத்தக்குறி பயன்படுத்தப்பட்டுள்ளது.
