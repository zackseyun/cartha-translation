  revision_rationale: “வலியுறுத்தியபடியே” retains Καθὼς as a backward-looking, resumptive comparison/recollection. “...வேண்டாமென்று கட்டளையிடுவதற்காகவும்” explicitly renders the purpose force of ἵνα and the authoritative sense of παραγγείλῃς. The final comma appropriately signals that the Greek sentence continues in verse 4. The footnote supplies the less forceful lexical alternative without weakening the main rendering.
