id: 1TI.1.2
reference: 1 Timothy 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ta
  text: 'விசுவாசத்தில் என் உண்மையான பிள்ளையாகிய தீமோத்தேயுவுக்கு: தந்தையாகிய கடவுளிடமிருந்தும், நம் ஆண்டவராகிய மெசியா இயேசுவிடமிருந்தும் அருளும் இரக்கமும் சமாதானமும் உண்டாவதாக.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνησίῳ
  choice: உண்மையான
  rationale: தீமோத்தேயுவுக்கும் பவுலுக்கும் இடையிலான ஆன்மிக உறவின் மெய்ம்மையைக் குறிக்கிறது; உயிரியல் பிள்ளை என்ற பொருளைத் தருவதில்லை.
- source_word: τέκνῳ
  choice: பிள்ளை
  rationale: பாலினத்தைத் தேவையின்றிக் குறிப்பாக்காமல், ஆன்மிகப் பெற்றோர்–பிள்ளை உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐν πίστει
  choice: விசுவாசத்தில்
  rationale: தனிப்பட்ட நம்பிக்கைச் செயலை மட்டும் அல்லாமல், இருவரும் பகிர்ந்துகொள்ளும் விசுவாசச் சூழலையும் குறிக்கக்கூடிய மூலத்தின் விரிவைத் திறந்தவாறு வைத்திருக்கிறது.
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்துகளில் வழக்கமான θεological term; நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἔλεος
  choice: இரக்கம்
  rationale: மூலச் சொல்லின் நேரடியான பொருளையும் இவ்வாழ்த்தின் தனித்துவமான கூறையும் பாதுகாக்கிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: வாழ்த்துச் சூழலில் அமைதியை விட விரிவான நல்வாழ்வு மற்றும் கடவுளுடனான சமாதானம் ஆகிய ஒலிப்புகளையும் தக்கவைக்கிறது.
- source_word: πατρὸς
  choice: தந்தையாகிய
  rationale: θεοῦ πατρός என்பதை இயல்பான தமிழில் ‘தந்தையாகிய கடவுள்’ என்று வழங்கி, தந்தை என்னும் அடையாளத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுவதால், பாரம்பரிய ஒலிபெயர்ப்பை விட அதன் பொருளை மொழிபெயர்க்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: இயேசுவின் அதிகாரத்தையும் கிறிஸ்துவியல் முக்கியத்துவத்தையும் தக்கவைக்கும் நிலையான, மரியாதையான தமிழ் சொல்.
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός என்பதை இங்கு பெயரின் வெறும் பகுதியாகக் கருதாமல் ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பட்டமாக மொழிபெயர்க்கிறது.
- issue: ἐν πίστει என்பதன் பொருள்
  choice: விசுவாசத்தில்
  alternative: விசுவாசத்தின் அடிப்படையில்
  rationale: தீமோத்தேயுவின் தனிப்பட்ட விசுவாசமா அல்லது இருவரும் பகிரும் கிறிஸ்தவ விசுவாசச் சூழலா என்பதைத் தேவையின்றி முடிவுசெய்யாமல் மூலத்தின் இறையியல் நெகிழ்வைப் பாதுகாக்கிறது.
- issue: பெயர்ச்சொல் வடிவிலுள்ள வாழ்த்து
  choice: உண்டாவதாக
  alternative: அருள், இரக்கம், சமாதானம்
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் வாழ்த்தின் வேண்டுதல் தன்மையை இயல்பாக வெளிப்படுத்த ‘உண்டாவதாக’ சேர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் எளிய புரிதலும் இணையும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘என்’ என்பது கிரேக்கத்தில் தனியாக இல்லாவிட்டாலும், உறவுமுறைச் சொல்லான ‘பிள்ளை’ தமிழில் யாருடைய பிள்ளை என்பதை இயல்பாகத் தெரிவிக்க வேண்டியதால் சூழலின்படி சேர்க்கப்பட்டுள்ளது.
