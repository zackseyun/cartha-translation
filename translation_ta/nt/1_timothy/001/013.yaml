revisions:
- from: முன்பு நான் தேவனைப் பழித்தவனாகவும், துன்புறுத்தியவனாகவும், கொடுமையாக நடந்தவனாகவும்[a] இருந்தேன். ஆனாலும் எனக்கு இரக்கம் காட்டப்பட்டது[b]; ஏனெனில் நான் நம்பிக்கையில்லாமல், அறியாமையில்[c] அப்படிச் செய்தேன்[d].
  to: முன்பு நான் தூஷித்தவனாகவும், துன்புறுத்தியவனாகவும், கொடுமை செய்தவனாகவும்[a] இருந்தேன். ஆனாலும் எனக்கு இரக்கம் காட்டப்பட்டது[b]; ஏனெனில் நான் அறியாமல்[c], நம்பாமையில் அவ்வாறு செய்தேன்[d].
  rationale: The revision avoids adding an unstated object to βλάσφημον, strengthens the rendering of ὑβριστήν, and restores the Greek distinction between the participle ἀγνοῶν ('அறியாமல்') and the prepositional phrase ἐν ἀπιστίᾳ ('நம்பாமையில்'). The causal wording does not imply that ignorance merited mercy.
