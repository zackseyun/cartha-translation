  text: formerly a blasphemer and a persecutor and a violent man[a]; but I was shown mercy, because I acted ignorantly in unbelief[d][c][b],
translation:
  language: ta
  text: முன்பு நான் தூஷித்தவனாகவும், துன்புறுத்தியவனாகவும், கொடுமை செய்தவனாகவும்[a] இருந்தேன். ஆனாலும் எனக்கு இரக்கம் காட்டப்பட்டது[b]; ஏனெனில் நான் அறியாமல்[c], நம்பாமையில் அவ்வாறு செய்தேன்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவமதித்து வன்முறையில் ஈடுபட்டவனாக” அல்லது “மூர்க்கமாக நடந்தவனாக.” கிரேக்கச் சொல் வெறும் அகந்தையை மட்டுமல்ல, பிறரை இழிவுபடுத்திக் கொடுமைப்படுத்தும் நடத்தையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் இரக்கம் பெற்றேன்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அறியாமையில்” அல்லது “அறியாதவனாக.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “நம்பிக்கையின்மையில்” அல்லது “நம்பிக்கையற்ற நிலையில்.” இங்கு பொருள் உடன்படிக்கைத் துரோகத்தைவிட நம்பாமையே எனத் தெரிகிறது.
    reason: lexical_alternative
