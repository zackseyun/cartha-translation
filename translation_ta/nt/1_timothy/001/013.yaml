theological_decisions:
- issue: ὅτι அறிமுகப்படுத்தும் கூற்றின் தொடர்பு
  choice: அவர் நம்பிக்கையில்லாத அறியாமையில் செயல்பட்டதால் இரக்கம் காட்டப்பட்டது என்று காரணத் தொடர்புடன் மொழிபெயர்த்தல்
  alternative: அறியாமை என்பது இரக்கத்திற்கான காரணமல்ல, உடன் இருந்த சூழ்நிலை மட்டுமே என்று மொழிபெயர்த்தல்
  rationale: ὅτι இயல்பாகக் காரண அல்லது விளக்கத் தொடர்பைக் கொண்டுள்ளது. அதைப் பாதுகாக்கிறோம்; அதேவேளை அறியாமை இரக்கத்தைச் சம்பாதித்தது என்ற கருத்தை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை. தொடர்ச்சியான கிரேக்கப் பெயர்ச்சொல் வரிசை தமிழில் இயல்பாக ‘-வனாகவும்’ அமைப்பில் தரப்பட்டுள்ளது. இறுதிப் பகுதியின் சொல்வரிசை தமிழின் இயல்புக்கேற்ப மாற்றப்பட்டாலும் அறியாமை, நம்பாமை, காரணத் தொடர்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
