  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: ta
  text: பேறுபெற்ற கடவுளின் மகிமையின் நற்செய்தியின்படி; அந்த நற்செய்தி எனக்கு ஒப்படைக்கப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் இயல்பாக, “பேறுபெற்ற கடவுளின் மகிமையான நற்செய்தி.”
    reason: τῆς δόξης என்ற genitive-ஐ நற்செய்தியைப் பண்புப்படுத்துவதாக எடுத்துக்கொள்ளும் மாற்று வாசிப்பு.
lexical_decisions:
- source_word: κατὰ
  choice: நற்செய்தியின்படி
  rationale: κατά இங்கு முன் கூறப்பட்டவற்றை அளவிடும் நெறி அல்லது தரத்தைக் குறிக்கிறது; ‘-இன்படி’ என்பது இயல்பான தமிழ் இணை.
- source_word: εὐαγγέλιον
  choice: நற்செய்தி
  rationale: பவுலின் பயன்பாட்டில் நிலைபெற்றதும் இன்றைய தமிழிலும் தெளிவாகப் புரிவதுமான சொல்.
- source_word: τῆς δόξης
  choice: மகிமையைப் பற்றிய
  rationale: ‘மகிமையின் நற்செய்தி’ என்ற சொற்சொல் அமைப்பு தமிழில் கடவுளின் மகிமையா, நற்செய்தியின் மகிமையா என்ற தேவையற்ற குழப்பத்தைத் தரலாம். ‘மகிமையைப் பற்றிய’ என்பது genitive-இன் உள்ளடக்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; பண்புப்பெயராக்கும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μακαρίου
  choice: ஆசீர்பெற்ற
  rationale: கடவுளைக் குறிக்கும் போது μακάριος என்பதன் உயர்வான, தெய்வவியல் நிறைவைத் தக்கவைக்கிறது; ‘மகிழ்ச்சியான’ என்பது இங்கு மிகச் சாதாரணமாக ஒலிக்கும்.
- source_word: θεοῦ
  choice: கடவுளின்
  rationale: θεός என்பதற்கான இயல்பான நவீனத் தமிழ் வடிவம்; genitive தொடர்பும் தெளிவாகிறது.
- source_word: ὃ ἐπιστεύθην ἐγώ
  choice: அந்த நற்செய்தி என்னிடம் ஒப்படைக்கப்பட்டது
  rationale: πιστεύω இங்கு ‘நம்பு’ என்று அல்ல, passive வடிவில் ‘ஒப்படைக்கப்படு’ என்று பொருள்படுகிறது. ἐγώ தரும் வலியுறுத்தலை ‘என்னிடம்’ இயல்பாகத் தாங்குகிறது.
theological_decisions:
- issue: τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ என்பதில் genitive தொடர்பு
  choice: ஆசீர்பெற்ற கடவுளின் மகிமையைப் பற்றிய நற்செய்தி
  alternative: ஆசீர்பெற்ற கடவுளின் மகிமையான நற்செய்தி
  rationale: Greek அமைப்பு ‘மகிமையின் நற்செய்தி’ என நேரடியாக இருந்தாலும் அதன் genitive தொடர்பு பலவாறு புரியக்கூடும். முதன்மை உரை உள்ளடக்கத் தொடர்பை இயல்பான தமிழில் தருகிறது; நற்செய்தியை ‘மகிமையானது’ எனப் பண்புப்பெயராக்கும் பழக்கமான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐπιστεύθην என்பதன் பொருள்
  choice: என்னிடம் ஒப்படைக்கப்பட்டது
  alternative: நான் நம்பினேன்
  rationale: சூழலும் passive கட்டமைப்பும் பவுலிடம் நற்செய்திப் பொறுப்பு ஒப்படைக்கப்பட்டதைக் குறிக்கின்றன; ‘நான் நம்பினேன்’ என்பது இங்கு இலக்கணத்துக்கும் கருத்துக்கும் பொருந்தாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. இந்த வசனம் முந்தைய வாக்கியத்துடன் இலக்கண ரீதியாக இணைந்திருப்பதால், தனிவசனமாக வாசிக்க உதவ ‘இது உள்ளது’ சேர்க்கப்பட்டது; [a] குறியீடு மாற்று genitive வாசிப்புக்காக முதன்மை உரையில் இடப்பட்டுள்ளது.
