revisions:
- from: ஆசீர்பெற்ற கடவுளின் மகிமையைப் பற்றிய நற்செய்தியின்படி இது உள்ளது; அந்த நற்செய்தி என்னிடம் ஒப்படைக்கப்பட்டது.[a]
  to: பேறுபெற்ற கடவுளின் மகிமையின் நற்செய்தியின்படி; அந்த நற்செய்தி எனக்கு ஒப்படைக்கப்பட்டது.[a]
  rationale: The revision removes the unsupported standalone phrase ‘இது உள்ளது,’ preserves the Greek genitive more directly as ‘கடவுளின் மகிமையின் நற்செய்தி,’ and keeps the idiomatic adjectival alternative in the footnote. It also renders the passive commissioning sense of ἐπιστεύθην naturally as ‘எனக்கு ஒப்படைக்கப்பட்டது.’
  reviewer_model: gpt-5.6-terra
