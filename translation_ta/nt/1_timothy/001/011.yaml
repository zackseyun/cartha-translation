  revision_rationale: The revision removes the unsupported standalone phrase ‘இது உள்ளது,’ preserves the Greek genitive more directly as ‘கடவுளின் மகிமையின் நற்செய்தி,’ and keeps the idiomatic adjectival alternative in the footnote. It also renders the passive commissioning sense of ἐπιστεύθην naturally as ‘எனக்கு ஒப்படைக்கப்பட்டது.’
