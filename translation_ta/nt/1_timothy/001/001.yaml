  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ κατ’ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τῆς ἐλπίδος ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: ta
  text: நம் மீட்பரான கடவுளும் நம் நம்பிக்கையாகிய மேசியா இயேசுவும் அளித்த ஆணையின்படி மேசியா இயேசுவின் அப்போஸ்தலனாகிய பவுல்[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனத்தில் இருமுறையும் வரும் ‘மேசியா இயேசு’ என்பதை ‘கிறிஸ்து இயேசு’ என்றும் வழங்கலாம். Χριστός என்ற கிரேக்கச் சொல் ‘மேசியா’ என்னும் பட்டமாகவும், சில சூழல்களில் பெயரைப் போன்ற ‘கிறிஸ்து’ என்ற வடிவிலும் செயல்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: பவுல்
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: இது வெறும் செய்தியாளரைக் குறிக்காமல், அதிகாரத்துடன் அனுப்பப்பட்ட தொடக்கக்கால கிறிஸ்தவப் பணியையும் பதவியையும் குறிக்கிறது; தமிழ்க் கிறிஸ்தவ வழக்கில் புரிந்துகொள்ளப்படும் நிலையான சொல்.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மேசியா இயேசு
  rationale: Χριστός இங்கு இயேசுவின் பெயராக மட்டும் அல்லாமல், அவர் வாக்களிக்கப்பட்ட அபிஷேகம் பெற்ற அரசர் என்பதைக் குறிக்கும் பட்டமாகவும் செயல்படுகிறது. ஆகவே பட்டத்தின் பொருளாற்றலைத் தக்கவைக்க ‘மேசியா’ பயன்படுத்தப்பட்டது.
- source_word: κατ’ ἐπιταγὴν
  choice: பிறப்பித்த கட்டளையின்படி
  rationale: அதிகாரபூர்வமான தெய்வீக ஆணையின் அடிப்படையில் பவுல் அப்போஸ்தலனானார் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: நம் மீட்பரான கடவுள்
  rationale: σωτήρ கடவுளுக்குரிய அடைமொழியாக இருப்பதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: நம் நம்பிக்கையான மேசியா இயேசு
  rationale: ‘நம் நம்பிக்கை’ என்பது மேசியா இயேசுவை அடையாளப்படுத்தும் இணைப்புச் சிறப்பாக உள்ளது; கிரேக்கத்தின் சுருக்கமான இறையியல் அடையாளப்படுத்தலைத் தக்கவைக்கிறது.
- source_word: ἐλπίδος
  choice: நம்பிக்கை
  rationale: எதிர்காலத்தைப் பற்றிய வெறும் விருப்பத்தை மட்டுமல்லாமல், மீட்பில் வேரூன்றிய உறுதியான எதிர்பார்ப்பையும் தமிழில் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழியாக்கம்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்வாழ்த்துரையில் Χριστός பட்டத்தன்மையை இன்னும் தக்கவைத்துள்ளது. ‘மேசியா’ அந்தப் பட்டத்தின் வரலாற்று மற்றும் அரசர்சார் பொருளை வாசகருக்குக் காட்டுகிறது; பரவலான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘நம் நம்பிக்கை’ என்பதற்கும் மேசியா இயேசுவுக்கும் உள்ள உறவு
  choice: மேசியா இயேசுவே ‘நம் நம்பிக்கை’ எனும் இணைப்புப் பொருள்
  alternative: ‘நமக்கு நம்பிக்கை அளிக்கிற மேசியா இயேசு’ என விளக்கிப் பெயர்த்தல்
  rationale: τῆς ἐλπίδος ἡμῶν என்பது மேசியா இயேசுவை நேரடியாக ‘நம் நம்பிக்கை’ என்று அடையாளப்படுத்துகிறது. காரணவிளக்கமாக விரிவாக்காமல் அந்த இறையியல் வலிமை பாதுகாக்கப்பட்டது.
- issue: கட்டளையின் மூலமாகக் கடவுளும் மேசியா இயேசுவும் இணைக்கப்படுவது
  choice: இருவரும் பிறப்பித்த ஒரே கட்டளையாக இயல்பான தமிழில் அமைத்தல்
  alternative: ‘நம் மீட்பரான கடவுளுடையவும், நம் நம்பிக்கையான மேசியா இயேசுவினுடையவும் கட்டளையின்படி’ என்ற பெயர்ச்சொல் தொடர்
  rationale: கிரேக்கத்தில் ஒருமை ‘கட்டளை’ என்பதுடன் இரண்டு இணை மரபுத்தொடர்கள் வருகின்றன. தமிழில் இருவரையும் எழுவாய்களாகக் கொண்டு ஒரே கட்டளையுடன் இணைப்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், திருமுகத்தின் தொடக்கத்துக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. கிரேக்கத்தில் வாக்கியத்தின் தொடக்கத்தில் வரும் ‘பவுல்’ தமிழின் இயல்பான திருமுக நடைக்கேற்ப இறுதியில் வைக்கப்பட்டது. ‘கடவுள்’, ‘மீட்பர்’, ‘நம்பிக்கை’ ஆகியவை தெளிவான பொதுத் தமிழ்ச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன; ‘அப்போஸ்தலன்’ தொடக்கக்கால கிறிஸ்தவப் பதவிக்கான நிலையான சொல்லாக வைக்கப்பட்டது.
