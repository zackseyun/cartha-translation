id: 1TI.1.9
reference: 1 Timothy 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: ta
  text: 'இதனை அறிந்து: நீதிமானுக்காகச் சட்டம் விதிக்கப்படவில்லை; மாறாக, சட்டத்தை மதியாதவர்களுக்கும் அடங்காதவர்களுக்கும், இறைபக்தியற்றவர்களுக்கும் பாவிகளுக்கும், பரிசுத்தமற்றவர்களுக்கும் புனிதத்தை அவமதிக்கிறவர்களுக்கும், தந்தையைக் கொல்கிறவர்களுக்கும் தாயைக் கொல்கிறவர்களுக்கும்[a], கொலைகாரர்களுக்கும் விதிக்கப்பட்டுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தந்தையை அடிக்கிறவர்களுக்கும் தாயை அடிக்கிறவர்களுக்கும்.” இங்குள்ள கிரேக்கச் சொற்கள் பெற்றோர்மீதான வன்முறைத் தாக்குதலையும் குறிக்கலாம்; ஆனால் இச்சூழலில் “கொல்கிறவர்கள்” என்பது அதிகம் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: இதை அறிந்திருக்க வேண்டும்
  rationale: முந்தைய அறிவுறுத்தலுக்கான அடிப்படையை அறிதல் என்ற பங்கேற்புவினையின் கருத்தை, தமிழில் இயல்பான அறிவுறுத்தல் தொடராக வெளிப்படுத்துகிறது.
- source_word: δικαίῳ
  choice: நீதிமானுக்காக
  rationale: ஒருமை வடிவத்தையும் பிரதிநிதித்துவப் பொருளையும் காக்கிறது; தமிழ் ‘நீதிமான்’ சூழலில் பொதுவான வகைப்பெயராக இயங்குகிறது.
- source_word: νόμος οὐ κεῖται
  choice: சட்டம் விதிக்கப்படவில்லை
  rationale: κεῖται என்பதன் ‘வைக்கப்பட்டது/நியமிக்கப்பட்டது’ என்ற சட்டவியல் கருத்தை இயல்பான தமிழில் தருகிறது; ‘பொருந்தாது’ என்று விளக்கமாக மட்டும் மாற்றவில்லை.
- source_word: ἀνόμοις
  choice: சட்டத்தை மீறுகிறவர்கள்
  rationale: சட்டத்திற்கு எதிராக நடப்போர் என்ற ஒழுக்க-சட்டப் பொருளை சாதாரண வாசகருக்குத் தெளிவாகக் கூறுகிறது.
- source_word: ἀνυποτάκτοις
  choice: அடங்காதவர்கள்
  rationale: அதிகாரத்திற்குக் கீழ்ப்படிய மறுக்கும் கருத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἀσεβέσι
  choice: இறைப்பற்றற்றவர்கள்
  rationale: கடவுள்பால் பக்தியோ மரியாதையோ இல்லாத நிலையைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἁμαρτωλοῖς
  choice: பாவிகள்
  rationale: பாவம் செய்பவர்களைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் வேதாகமச் சொல்.
- source_word: ἀνοσίοις
  choice: பரிசுத்தமற்றவர்கள்
  rationale: புனித ஒழுங்கை மீறும் நிலையைச் சுருக்கமாக வெளிப்படுத்தி, அடுத்த βεβήλοις என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: βεβήλοις
  choice: புனிதத்தை அவமதிக்கிறவர்கள்
  rationale: புனிதமானதைச் சாதாரணமாகவோ அவமதிப்பாகவோ நடத்தும் பொருளைத் தெளிவுபடுத்துகிறது; ἀσεβέσι மற்றும் ἀνοσίοις உடன் கலக்காமல் காக்கிறது.
- source_word: πατρολῴαις
  choice: தந்தையைக் கொல்கிறவர்கள்
  rationale: தந்தையைத் தாக்குதல் அல்லது கொல்லுதல் என இருவகையில் கொள்ளக்கூடிய அரிய சொல்லுக்கு, இக்கொடிய செயல்களின் பட்டியலில் சாத்தியமான வலுவான பொருளைத் தேர்ந்தெடுக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μητρολῴαις
  choice: தாயைக் கொல்கிறவர்கள்
  rationale: πατρολῴαις என்பதற்கு இணையான அமைப்பையும் பொருளையும் காக்கிறது; தாக்குதல் என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀνδροφόνοις
  choice: கொலைகாரர்கள்
  rationale: சட்டவிரோதமாக மனித உயிரைக் கொல்வோரைக் குறிக்கும் தெளிவான, தற்போதைய தமிழ் சொல்.
theological_decisions:
- issue: δικαίῳ என்பதிலுள்ள ஒருமை ஆண்பால் வடிவம்
  choice: நீதிமானுக்காக
  alternative: நீதியுள்ள ஒருவருக்காக / நீதிமான்களுக்காக
  rationale: கிரேக்க ஒருமையைப் பாதுகாக்கிறது. தமிழில் ‘நீதிமான்’ பொதுவகையைச் சுட்டக்கூடும்; பன்மையாக்கி மூல வடிவத்தைத் தட்டையாக்கவில்லை.
- issue: πατρολῴαις / μητρολῴαις என்பவற்றின் பொருள் வரம்பு
  choice: தந்தையைக் கொல்கிறவர்கள் / தாயைக் கொல்கிறவர்கள்
  alternative: தந்தையை அடிக்கிறவர்கள் / தாயை அடிக்கிறவர்கள்
  rationale: இச்சொற்கள் பெற்றோர்மீதான வன்முறைத் தாக்குதலையோ கொலையையோ குறிக்கலாம். ἀνδροφόνοις என்பதற்கு முன் வரும் இப்பட்டியலில் ‘கொல்’ என்பது சாத்தியமான பொருள்; இருப்பினும் உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: νόμος οὐ κεῖται என்பதன் சட்டவியல் வலிமை
  choice: சட்டம் விதிக்கப்படவில்லை
  alternative: சட்டம் பொருந்தாது
  rationale: ‘பொருந்தாது’ என்பது பயன்பாட்டைப் பற்றிய விளக்கமாகத் தீர்மானித்துவிடக்கூடும். ‘விதிக்கப்படவில்லை’ என்பது சட்டம் வைக்கப்பட்ட/நியமிக்கப்பட்ட கருத்தையும் உரையிலுள்ள இறுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட பட்டியல் நடை பயன்படுத்தப்பட்டது. கிரேக்க இணைச்சொல் ஜோடிகளின் ஓசையும் வேறுபாடும் முடிந்தவரை காக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்துக்குத் தொடரும் பட்டியல் என்பதால் இறுதியில் முற்றுப்புள்ளி இருந்தாலும் தொடர்ச்சிப் பொருள் சொற்றொடரின் அமைப்பில் நிலைக்கிறது.
