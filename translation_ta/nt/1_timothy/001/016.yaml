source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: ta
  text: ஆனால், இதற்காகவே நான் இரக்கம் பெற்றேன்; முதன்மையானவனாகிய என்னில் மெசியா இயேசு தமது முழுப் பொறுமையையும் வெளிப்படுத்தி, பின்னர் அவர்மேல் நம்பிக்கை வைத்து நித்திய வாழ்வைப் பெறவிருந்தவர்களுக்கு ஒரு முன்மாதிரியாக இருக்கும்படியாக.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “கிறிஸ்து இயேசு.” கிரேக்க Χριστός என்பது “மெசியா” அல்லது “கிறிஸ்து” என்று மொழிபெயர்க்கப்படலாம்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முதலாவதாகிய என்னில்.” “முதன்மையானவன்” என்பது முந்தைய வசனத்தில் வரும் “பாவிகளில் முதன்மையானவன்” என்ற கூற்றை நினைவூட்டுகிறது; ஆனால் இவ்வசனத்தின் கிரேக்க உரையில் “பாவிகளில்” என்ற சொல் வெளிப்படையாக இல்லை.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἠλεήθην
  choice: நான் இரக்கம் பெற்றேன்
  rationale: செயப்பாட்டு வினையின் பொருளையும் முகவர் குறிப்பிடப்படாததையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πρώτῳ
  choice: பாவிகளில் முதன்மையானவனாகிய
  rationale: முந்தைய வசனத்தில் வரும் ‘பாவிகளில் முதன்மையானவன்’ என்பதைக் குறிக்கிறது; ‘மிக மோசமானவன்’ என்று பொருளை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: ἐνδείξηται
  choice: வெளிப்படுத்த வேண்டும்
  rationale: ἵνα உடனான நோக்கக் கூற்றில், அனைவரும் காணும்படி காட்டுதல் என்ற நுண்பொருளைத் தருகிறது.
- source_word: Χριστὸς Ἰησοῦς
  choice: மெசியா இயேசு
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளைத் தமிழில் நேரடியாகக் காக்கிறது.
- source_word: ἅπασαν μακροθυμίαν
  choice: தமது பொறுமை முழுவதையும்
  rationale: ἅπασαν வலியுறுத்தும் முழுமையையும், μακροθυμία குறிக்கும் நீடிய பொறுமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑποτύπωσιν
  choice: ஒரு முன்மாதிரியாக
  rationale: பின்னர் நம்புகிறவர்களுக்காக முன்வைக்கப்படும் மாதிரி அல்லது எடுத்துக்காட்டு என்ற பொருளைத் தருகிறது.
- source_word: τῶν μελλόντων πιστεύειν
  choice: வருங்காலத்தில் தம்மை நம்பி ... பெறவிருந்தவர்களுக்கு
  rationale: பவுலின் அனுபவத்துக்குப் பின்னர் நம்பவிருந்தவர்களைக் குறிக்கும் எதிர்கால நோக்கை இயல்பான தமிழில் காக்கிறது.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: தம்மை நம்பி
  rationale: இயேசுவை நம்புதல்/அவர்மீது நம்பிக்கை வைத்தல் என்ற உறவுசார் பொருளைச் சுருக்கமான தமிழில் தருகிறது.
- source_word: εἰς ζωὴν αἰώνιον
  choice: நிலைவாழ்வைப் பெற
  rationale: εἰς குறிக்கும் இலக்கு அல்லது விளைவைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு Χριστός பட்டப்பெயராகத் தெளிவாக இருப்பதால் ‘மெசியா’ அதன் பொருளைக் காக்கிறது; வழக்கமான ‘கிறிஸ்து இயேசு’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இரக்கத்தின் முகவரும் பொறுமையை வெளிப்படுத்துபவரும்
  choice: இரக்கம் காட்டிய முகவரை செயப்பாட்டு வடிவில் குறிப்பிடாமல், பொறுமையை வெளிப்படுத்துபவராக மெசியா இயேசுவை உரை கூறுவதுபோலவே வைத்தல்
  alternative: இரக்கத்தை நேரடியாக மெசியா இயேசுவே காட்டினார் என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: ἠλεήθην முகவரைக் குறிப்பிடவில்லை; நோக்கக் கூற்று மட்டும் மெசியா இயேசுவைப் பொறுமையை வெளிப்படுத்துபவராகக் குறிப்பிடுகிறது. மொழிபெயர்ப்பு இந்த வேறுபாட்டைச் சுருக்காமல் காக்கிறது.
- issue: πρώτῳ என்பதன் தொடர்பு
  choice: பாவிகளில் முதன்மையானவனாகிய என்னில்
  alternative: முதலாவதாகிய என்னில்
  rationale: முந்தைய வசனத்தின் ‘பாவிகளில் முதன்மையானவன்’ என்ற கூற்றே இயல்பான உடனடிச் சூழல்; இருப்பினும் கிரேக்கத்தில் ‘பாவிகளில்’ இவ்வசனத்தில் மீண்டும் வெளிப்படையாக இல்லை என்பதைக் காலடிக்குறிப்பு சுட்டுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதையும் வேதாகம நடையும் காக்கப்பட்டுள்ளன. ‘தம்மை/தமது’ என்பது மெசியா இயேசுவைக் குறிக்கும் மரியாதைப் பிரதிபெயர். ‘நிலைவாழ்வு’ என்பது αἰώνιος குறிக்கும் நீடித்த, வருங்கால இறைவாழ்வை இயல்பாகத் தருகிறது.
