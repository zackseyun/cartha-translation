source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: ta
  text: யுகங்களின் அரசரான, அழிவில்லாத, கண்ணுக்குப் புலப்படாத, ஒரே இறைவனுக்கு[a] என்றென்றும் மரியாதையும் மகிமையும் உண்டாவதாக. ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “ஞானமுள்ள ஒரே இறைவன்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: யுகங்களின் அரசர்
  rationale: மூலத்தின் உருபுத்தொடரை வெளிப்படையாகப் பாதுகாத்து, எல்லா யுகங்களின்மீதும் இறைவனுக்குள்ள அரசாட்சியை இயல்பான தமிழில் தெரிவிக்கிறது; ‘நித்திய அரசர்’ என்பது சாத்தியமானாலும் αἰώνων என்பதிலுள்ள ‘யுகங்கள்’ என்ற படிமத்தைச் சுருக்கிவிடும்.
- source_word: ἀφθάρτῳ
  choice: அழிவில்லாதவர்
  rationale: சிதைவு, அழிவு, மரணம் ஆகியவற்றுக்கு உட்படாத தன்மையை இறைவனைப் பற்றிய சூழலில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀοράτῳ
  choice: கண்ணுக்குப் புலப்படாதவர்
  rationale: ‘காணப்படாதவர்’ என்பதைவிட இயல்பான நவீனத் தமிழில், பார்வைக்கு எட்டாதவர் என்ற மூலப் பொருளைத் துல்லியமாக வழங்குகிறது.
- source_word: μόνῳ θεῷ
  choice: ஒரே இறைவன்
  rationale: மூலத்தில் உள்ள தனித்தன்மையையும் ஒரே இறைவன் என்ற ஏகத்துவ அறிக்கையையும் கூடுதல் விளக்கம் சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: τιμὴ καὶ δόξα
  choice: கனமும் மகிமையும்
  rationale: வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான தமிழில் τιμή என்பதற்கு ‘கனம்’, δόξα என்பதற்கு நிலைபெற்ற ‘மகிமை’ ஆகிய இணையைப் பயன்படுத்துகிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலத்தைச் சுட்டும் கிரேக்க மரபுத்தொடரின் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: தமிழ் வேதாகம மற்றும் வழிபாட்டு மரபில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல் இன்றி வாக்கியத் தொடர்ச்சியில் வெளிப்படுத்தப்பட்டது
  rationale: இங்கு δὲ மெலிந்த உரையாடல் மாற்றத்தைக் குறிக்கிறது; ‘ஆனால்’ அல்லது ‘இப்பொழுது’ என்று வெளிப்படையாக மொழிபெயர்ப்பது தமிழில் இல்லாத எதிர்மறைத் திருப்பையோ காலக் குறிப்பையோ உருவாக்கக்கூடும்.
theological_decisions:
- issue: μόνῳ θεῷ என்பதின் ஏகத்துவ வலிமையை எவ்வாறு வழங்குவது
  choice: ஒரே இறைவன்
  alternative: இறைவன் ஒருவருக்கே
  rationale: மூலத்தின் வெளிப்படையான ஒரே இறைவன் அறிக்கையை நேரடியாக வழங்குகிறது; வேறு இறையியல் விளக்கத்தைச் சேர்த்தோ, உள்ள பதற்றத்தைத் தீர்த்தோ விடவில்லை.
- issue: μόνῳ என்பதற்குப் பின் σοφῷ (‘ஞானமுள்ள’) இடம்பெறும் பாடவேறுபாடு
  choice: முதன்மைப் பாடத்தில் ‘ஞானமுள்ள’ என்பதைச் சேர்க்காமல் விடுதல்
  alternative: ஞானமுள்ள ஒரே இறைவன்
  rationale: கொடுக்கப்பட்ட SBLGNT மூலப்பாடத்தில் σοφῷ இல்லை. அறியப்பட்ட நீண்ட வாசகம் கையெழுத்துப் பிரதிப் பாடவேறுபாடாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியமான நடையையும் பொதுவாசகருக்கான தெளிவையும் இணைக்கிறது. பண்புகளைத் தொடராக அமைத்து, இறுதியில் ‘உண்டாவதாக’ என்ற இயல்பான தமிழ்த் துதிவடிவில் வாக்கியம் நிறைவுபெறுகிறது.
