  source_fidelity: 'The draft accurately reflects the SBLGNT wording: βασιλεῖ τῶν αἰώνων is preserved as “யுகங்களின் அரசர்,” the three dative descriptions are retained, μόνῳ θεῷ is rendered without importing the variant “wise,” and the unending doxological expression is conveyed by “என்றென்றும்.” The textual-variant footnote correctly represents the longer reading.'
