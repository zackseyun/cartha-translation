  terminology: “அழிவில்லாத,” “கண்ணுக்குப் புலப்படாத,” “மகிமை,” and “ஆமென்” are suitable. “மரியாதை” is a more transparent contemporary equivalent for τιμή than “கனம்,” while retaining an appropriately dignified doxological register.
