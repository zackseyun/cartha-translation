source:
  edition: SBLGNT
  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: ta
  text: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்கள், ஆண்களோடு பாலுறவு கொள்ளும் ஆண்கள்,[a] மனிதர்களை அடிமைகளாக்கி விற்பவர்கள், பொய்யர்கள், பொய்ச் சத்தியம் செய்கிறவர்கள் ஆகியோருக்காகவும், நலமான போதனைக்கு எதிரான வேறு எதற்காகவும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்-ஆண் பாலியல் செயலில் ஈடுபடுகிறவர்கள்.” ἀρσενοκοῖται என்ற கிரேக்கச் சொல் அரிதானது; அதன் துல்லியமான பொருள் எல்லை குறித்து விவாதம் உள்ளது. எனினும், அது ஆண்களுக்கு இடையிலான பாலியல் செயலைக் குறிப்பது தெளிவு.
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்கள்
  rationale: இச்சொல் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுவோரைப் பொதுவாகக் குறிக்கிறது; திருமணத்திற்கு முந்தைய பாலுறவு போன்ற ஒரு குறிப்பிட்ட வகைக்கு மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: ἀρσενοκοίταις
  choice: ஆண்களோடு பாலுறவுகொள்ளும் ஆண்கள்
  rationale: அரிதாகக் காணப்படும் இச்சொல்லின் ஆண் சார்ந்த பாலியல் குறிப்பைத் தெளிவாக வெளிப்படுத்துகிறது; நவீன பாலியல் அடையாள வகைப்பாட்டை மூல உரைக்குள் புகுத்தாமல், செயலையே மையப்படுத்துகிறது.
- source_word: ἀνδραποδισταῖς
  choice: மனிதர்களைக் கடத்தி அடிமைகளாக விற்பவர்கள்
  rationale: மனிதர்களைப் பிடித்தோ கடத்தியோ அடிமைகளாக்கி விற்பவர்களைக் குறிக்கும் சொல்லின் முழுப் பொருளையும் சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: ψεύσταις
  choice: பொய்யர்கள்
  rationale: பொய் கூறுகிறவர்களைக் குறிக்கும் நேரடியான, இயல்பான தமிழ்ச் சொல்.
- source_word: ἐπιόρκοις
  choice: பொய்ச் சத்தியம் செய்கிறவர்கள்
  rationale: பொய்யாக ஆணையிடுதல் அல்லது சத்தியத்தை மீறுதல் என்ற கருத்தை, சட்டத்துறைச் சொல்லாடலைச் சாராமல் தெளிவாகத் தெரிவிக்கிறது.
- source_word: καὶ εἴ τι ἕτερον
  choice: வேறு எதற்காகவும்
  rationale: பட்டியலில் கூறப்படாத, இதே வகையைச் சேர்ந்த மற்ற அனைத்தையும் உள்ளடக்கும் திறந்த தன்மையைப் பேணுகிறது; வாக்கியத்தின் முந்தைய சூழலில் வரும் ‘நியாயச்சட்டம் ஏற்படுத்தப்பட்டது’ என்பதோடு இணைவதற்காக வேற்றுமை உருபு பயன்படுத்தப்பட்டுள்ளது.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: நலமான போதனைக்கு
  rationale: ὑγιαίνω என்பதன் ‘ஆரோக்கியமான/நலமான’ உருவகப் பொருளைப் பேணுவதோடு, நவீன தமிழில் இயல்பாகவும் எளிதில் புரியும்படியும் உள்ளது.
- source_word: ἀντίκειται
  choice: எதிரான
  rationale: எதிர்த்து நிற்பது அல்லது முரண்படுவது என்ற பொருளை இச்சூழலில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀρσενοκοίταις என்ற அரிதானதும் விவாதிக்கப்படுவதுமான சொல்லின் மொழிபெயர்ப்பு
  choice: ஆண்களோடு பாலுறவுகொள்ளும் ஆண்கள்
  alternative: ஆண்-ஆண் பாலியல் செயலில் ஈடுபடுகிறவர்கள்
  rationale: மூலச்சொல்லின் ஆண் சார்ந்த பாலியல் குறிப்பை மொழிபெயர்ப்பு வெளிப்படுத்த வேண்டும்; அதேவேளையில், நவீன பாலியல் நாட்டம் அல்லது அடையாள வகையை அது கூறுவதாகக் கருதக்கூடாது. சொல்லின் துல்லியமான பொருள் எல்லை விவாதிக்கப்படுவதால் மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நடை நவீன, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தரத்தமிழில் அமைந்துள்ளது. இது முந்தைய வசனத்தில் தொடங்கும் வாக்கியத்தின் தொடர்ச்சி என்பதால் பட்டியலின் வேற்றுமைத் தொடர்பும் இறுதியிலுள்ள காற்புள்ளியும் பேணப்பட்டுள்ளன.
