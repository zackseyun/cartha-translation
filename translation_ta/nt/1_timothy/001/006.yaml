    text: அல்லது, “இவற்றை அடையத் தவறி.” இந்த வினைச்சொல் ஓர் இலக்கைத் தவறவிடுதல் அல்லது அதிலிருந்து வழுவுதல் என்ற பொருளைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
