lexical_decisions:
- source_word: ὧν
  choice: இவற்றை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அன்பு, தூய இதயம், நல்ல மனச்சாட்சி, வஞ்சனையற்ற விசுவாசம் ஆகியவற்றைப் பின்னோக்கிச் சுட்டுகிறது. எவற்றை என்று மட்டும் மொழிபெயர்ப்பதைவிட, தமிழில் இவற்றை என்பது தொடர்பை இயல்பாகத் தெளிவுபடுத்துகிறது; அதேவேளையில் குறிப்பிட்ட ஒன்றுக்கு மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: τινες
  choice: சிலர்
  rationale: குறிப்பிடப்படாத ஒரு பகுதியினரைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἀστοχήσαντες
  choice: இலக்குத் தவறவிட்டு
  rationale: ἀστοχέω என்பதிலுள்ள இலக்கைத் தவறுதல் என்ற உருவகத்தையும், முன்கூறியவற்றை அடையத் தவறிய கருத்தையும் காக்கிறது. தவறவிட்டு என்று மட்டும் சொல்வதைவிட உருவகப் பொருள் தெளிவாகிறது.
- source_word: ἐξετράπησαν
  choice: திரும்பிவிட்டார்கள்
  rationale: சரியான பாதையிலிருந்து வேறு திசைக்குத் திரும்பியதைக் குறிக்கிறது. வீண்பேச்சுக்குத் என்ற இலக்குடன் சேரும்போது தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: εἰς
  choice: -க்கு
  rationale: ஒரு நிலை அல்லது செயல்பாட்டை நோக்கிய நகர்வையும் அதன் விளைவையும் தமிழின் வேற்றுமை உருபால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ματαιολογίαν
  choice: வீண்பேச்சு
  rationale: பயனற்ற, வெறுமையான பேச்சைக் குறிக்கும் சுருக்கமான, பொதுவாகப் புரியும் நவீனத் தமிழ் சொல்; வெறும் அர்த்தமின்மையை மட்டுமல்ல, பயனின்மையையும் உணர்த்துகிறது.
theological_decisions:
- issue: ὧν என்ற தொடர்புப் பெயர்ச்சொல்லின் குறிப்பு
  choice: முந்தைய வசனத்தில் கூறப்பட்ட நெறி மற்றும் ஆவிக்குரிய நோக்கங்களைப் பொதுவாகச் சுட்டும் இவற்றை
  alternative: தூய இதயம், நல்ல மனச்சாட்சி, வஞ்சனையற்ற விசுவாசம் என்ற மூன்றை மட்டும் சுட்டுவது; அல்லது எவற்றிலிருந்து என்று மிக நேரடியாக மொழிபெயர்ப்பது
  rationale: இலக்கண அமைப்பு முந்தைய சூழலைச் சார்ந்துள்ளது. இவற்றை என்பது பின்னோக்கிய குறிப்பைத் தெளிவாக்குகிறது; ஆனால் அதன் எல்லையைத் தேவையின்றி குறுக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. இலக்குத் தவறவிட்டு என்ற சொற்றொடர் மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; வீண்பேச்சு இயல்பானதும் சுருக்கமானதும் ஆகும். எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
