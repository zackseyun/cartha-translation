source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: ta
  text: கட்டுக்கதைகளுக்கும் முடிவில்லாத வம்சவரலாறுகளுக்கும் கவனம் செலுத்த வேண்டாம்; அவை விசுவாசத்தில் அமைந்த கடவுளுடைய நிர்வாகத்தைவிட[b][c] பயனற்ற ஆராய்ச்சிகளையே உண்டாக்குகின்றன[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பயனற்ற ஆராய்ச்சிகள்’ என்பதற்குப் பதிலாக, ‘சர்ச்சைகள்’, ‘விசாரணைகள்’ அல்லது ‘ஊகங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் இங்கு பலனளிக்காத கேள்விகளையோ விவாதங்களையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கடவுளுடைய நிர்வாகம்’ என்பதற்குப் பதிலாக, ‘கடவுளின் திட்டம்’ அல்லது ‘கடவுளிடமிருந்து வந்த பொறுப்பாட்சி’ என்றும் பொருள் கொள்ளலாம். கிரேக்கச் சொல் நிர்வாகம், ஒழுங்கமைப்பு, திட்டம் அல்லது ஒப்படைக்கப்பட்ட பொறுப்பு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘விசுவாசத்தில்’ என்பதைக் ‘நம்பிக்கையில்’ என்றும் மொழிபெயர்க்கலாம்; சிலர் இங்கு ‘உண்மைத்தன்மை’ என்ற நுண்பொருளையும் காண்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: கவனம் செலுத்த
  rationale: ஒரு பொருளுக்கு மனத்தைச் செலுத்துதல் அல்லது அதில் ஈடுபடுதல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: μύθοις
  choice: கட்டுக்கதைகளுக்கு
  rationale: இச்சூழலில் உண்மையற்ற அல்லது ஆதாரமற்ற சமயக் கதைகள் என்ற எதிர்மறை நுண்பொருளைத் தெளிவாகக் காட்டுகிறது; ‘புராணங்கள்’ என மொழிபெயர்த்து குறிப்பிட்ட சமய இலக்கிய வகையைத் தேவையின்றி சுட்டுவதைத் தவிர்க்கிறது.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: முடிவில்லாத வம்சவரலாறுகளுக்கு
  rationale: ἀπέραντος என்பதன் முடிவோ எல்லையோ இல்லாத தன்மையையும், தொடர்ந்துகொண்டே போகும் பயனற்ற விவாதத்தின் நிழற்பொருளையும் காக்கிறது.
- source_word: ἐκζητήσεις
  choice: பயனற்ற ஆராய்ச்சிகள்
  rationale: விசாரணைகள், கேள்விகள் அல்லது சர்ச்சைகள் எனப் பொருள்படக்கூடிய சொல்லை இச்சூழலின் எதிர்மறை நோக்குடன் தருகிறது; ‘ஊகங்கள்’ என்று மட்டும் குறுக்கவில்லை.
- source_word: παρέχουσι
  choice: எழுப்புகின்றன
  rationale: ‘உண்டாக்குகின்றன/தோற்றுவிக்கின்றன’ என்ற காரணப் பொருளை இயல்பாகத் தருகிறது.
- source_word: οἰκονομίαν θεοῦ
  choice: கடவுளுடைய நிர்வாகம்
  rationale: οἰκονομία என்பதன் நிர்வாகம், ஒழுங்கமைப்பு, பொறுப்பாட்சி அல்லது திட்டம் ஆகிய பொருள் வரம்பை ஓரளவு திறந்தவாறு காக்கிறது; θεοῦ-வை உடைமைத் தொடர்பாக முதன்மையாக எடுத்துக்கொள்கிறது.
- source_word: τὴν ἐν πίστει
  choice: விசுவாசத்தில் நடைபெறும்
  rationale: ἐν என்பதன் சூழல்/செயல்பாட்டு நுண்பொருளைக் காத்து, அந்த நிர்வாகம் விசுவாசத்தின் வட்டத்தில் நிகழ்கிறது என்பதை இயல்பான தமிழில் சொல்கிறது.
theological_decisions:
- issue: οἰκονομίαν θεοῦ என்பதன் பொருள்
  choice: கடவுளுடைய நிர்வாகம்
  alternative: கடவுளின் திட்டம்; கடவுளிடமிருந்து வந்த பொறுப்பாட்சி
  rationale: இச்சொற்றொடர் கடவுள் ஒழுங்கமைத்த செயற்பாடு, அவரது திட்டம், அல்லது அவர் ஒப்படைத்த பொறுப்பாட்சி ஆகியவற்றைக் குறிக்கலாம். முதன்மை உரை சொற்பொருளின் நிர்வாக நுண்பொருளைக் காக்கிறது; அடிக்குறிப்பு மற்ற சாத்தியங்களை வெளிப்படுத்துகிறது.
- issue: πίστει என்பதன் நுண்பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இங்கு வழக்கமான பவுலின் பயன்பாட்டுக்கு ஏற்ப ‘விசுவாசம்’ முதன்மையாக வைக்கப்படுகிறது; எனினும் சொல்லின் பரந்த பொருள் வரம்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐκζητήσεις என்பதன் எதிர்மறை தன்மை
  choice: பயனற்ற ஆராய்ச்சிகள்
  alternative: சர்ச்சைகள்; விசாரணைகள்; ஊகங்கள்
  rationale: சூழல் இத்தகைய விசாரணைகளைப் பயனற்றவையாகச் சித்தரிக்கிறது; ஆனால் அவை வெறும் கருத்து மோதல்களா அல்லது ஊக விசாரணைகளா என்பதை உரை முழுமையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; மரியாதைமிக்கதாய் இருந்தாலும் பொதுவாசகர்களுக்குப் புரியும் நடை. இது முந்தைய வசனத்தில் தொடங்கிய கட்டளையைத் தொடர்வதால், தமிழில் இயல்பாகத் தனித்த கட்டளை வடிவில் தரப்பட்டுள்ளது. வசனம் அடுத்த பகுதிக்குத் தொடர்வதை இறுதி நீள்கோடு காட்டுகிறது.
