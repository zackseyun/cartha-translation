id: 1TI.1.18
reference: 1 Timothy 1:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: ta
  text: என் பிள்ளை தீமோத்தேயுவே, உன்னைக் குறித்து[a] முன்பு உரைக்கப்பட்ட தீர்க்கதரிசனங்களுக்கு ஏற்ப, அவற்றால்[b] நீ நல்ல போர்ப்பணியை[c] மேற்கொள்ளும்படி இந்தக் கட்டளையை உன்னிடம் ஒப்படைக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன்னைப் பற்றி’ என்றும் மொழிபெயர்க்கலாம்; தீமோத்தேயுவின்மேல் உரைக்கப்பட்ட தீர்க்கதரிசனங்கள் என்ற பொருளில் ‘உன்மேல்’ என்பதும் சாத்தியம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவற்றின் வழியாக’ அல்லது ‘அவற்றில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் கருவியையோ செயல்படும் களத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: 'மரபுவழி மொழிபெயர்ப்பு: ‘நல்ல போராட்டத்தைப் போராடு.’ கிரேக்கத்தில் இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக, ‘நல்ல போர்ப்பணியை மேற்கொள்’ என்ற இராணுவ உருவகம் உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: கட்டளை
  rationale: அதிகாரபூர்வமாக அளிக்கப்படும் பொறுப்புமிக்க அறிவுறுத்தலைக் குறிக்கிறது; நவீன தமிழில் ‘கட்டளை’ அதன் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: παρατίθεμαί σοι
  choice: உன்னிடம் ஒப்படைக்கிறேன்
  rationale: ஒருவரின் பொறுப்பிலும் பாதுகாப்பிலும் ஒன்றை ஒப்படைக்கும் நடுவினைச் சொல்லின் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τέκνον Τιμόθεε
  choice: என் பிள்ளை தீமோத்தேயுவே
  rationale: τέκνον என்பதன் குடும்பப் பாசமுள்ள அழைப்பைப் பாதுகாக்கிறது; கிரேக்கத்தில் இல்லாத குறிப்பான ‘மகன்’ என்ற பாலினச் சொல்லைத் தவிர்க்கிறது. இயல்பான தமிழுக்காக உறவைக் காட்டும் ‘என்’ சேர்க்கப்பட்டுள்ளது.
- source_word: κατὰ
  choice: ஏற்ப
  rationale: முன்னைய தீர்க்கதரிசனங்களோடு இசைவாக அல்லது அவற்றின் அடிப்படையில் கட்டளை வழங்கப்படுவதைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: τὰς προαγούσας ... προφητείας
  choice: முன்பு உரைக்கப்பட்ட தீர்க்கதரிசனங்கள்
  rationale: ‘முன்னே சென்ற’ என்ற சொற்பொருளின் காலச் சார்பை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; அவை தீர்க்கதரிசனச் செய்திகள் என்பதையும் காக்கிறது.
- source_word: ἐπὶ σὲ
  choice: உன்னைக் குறித்து
  rationale: தீமோத்தேயுவைச் சார்ந்த தீர்க்கதரிசனங்கள் என்ற தெளிவான இயல்பான பொருளை அளிக்கிறது; ‘உன்மேல்’ என்ற சாத்தியமான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐν αὐταῖς
  choice: அவற்றைக் கொண்டு
  rationale: தீர்க்கதரிசனங்கள் தீமோத்தேயுவின் போர்ப்பணிக்கு வழிகாட்டும் கருவி அல்லது ஆதாரமாக இருப்பதை வெளிப்படுத்துகிறது; ‘அவற்றில்’ என்ற செயற்களப் பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: στρατεύῃ ... τὴν καλὴν στρατείαν
  choice: நல்ல போர்ப்பணியை மேற்கொள்ளும்படி
  rationale: ஒரே சண்டையைவிடப் போர்ச் சேவை அல்லது படையெடுப்பு என்ற நீடித்த இராணுவ உருவகத்தைப் பாதுகாக்கிறது; தமிழில் இயல்பற்ற ஒரே வேர்ச்சொல் மீளுரைப்பைத் தவிர்க்கிறது.
theological_decisions:
- issue: தீமோத்தேயுவின் பணியளிப்புக்கும் முன்னைய தீர்க்கதரிசனங்களுக்கும் உள்ள தொடர்பு
  choice: முன்பு தீமோத்தேயுவைக் குறித்து உரைக்கப்பட்ட தீர்க்கதரிசனங்களுக்கு ஏற்ப பவுல் இக்கட்டளையை ஒப்படைக்கிறார்; அவை அவனுடைய போர்ப்பணிக்கு வழிகாட்டுகின்றன அல்லது துணைபுரிகின்றன.
  alternative: அந்தத் தீர்க்கதரிசனங்களே தீமோத்தேயுவை முறையாகத் திருப்பணியில் நியமித்தன, அல்லது அவை தனிப்பட்ட ஊக்கமளிப்புகள் மட்டுமே.
  rationale: வசனம் கட்டளைக்கும் தீர்க்கதரிசனங்களுக்கும் தெளிவான தொடர்பைக் காட்டுகிறது; ஆனால் ஒரு குறிப்பிட்ட திருநிலைப்பாட்டு அல்லது பணிநியமனக் கோட்பாட்டை வரையறுக்கவில்லை. ஆகவே அந்தத் தொடர்பு காக்கப்பட்டு, அதற்கு மேற்பட்ட கோட்பாடு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிள்ளை’ பாசமுள்ள ஆன்மிக உறவைப் பாதுகாக்கிறது; ‘போர்ப்பணி’ கிரேக்கத்தின் நீடித்த இராணுவ உருவகத்தைத் தக்கவைக்கிறது. நோக்கத்தைக் காட்டும் ἵνα அமைப்பு தமிழில் தெளிவாக இருக்க, இரண்டாம் வாக்கியத்தில் ‘இதைச் செய்கிறேன்’ மீட்டுரைக்கப்பட்டுள்ளது.
