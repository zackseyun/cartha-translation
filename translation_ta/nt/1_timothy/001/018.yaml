  terminology: ‘என் பிள்ளை,’ ‘தீர்க்கதரிசனங்கள்,’ ‘கட்டளை,’ மற்றும் ‘நல்ல போர்ப்பணி’ ஆகியவை கண்ணியமான நவீன பதிவிலும் மூலத்தின் உருவகத்திற்கும் ஏற்றவையாக உள்ளன. ‘நல்ல போர்ப்பணி’ என்பதற்கான அடிக்குறிப்பு மரபுவழி ‘நல்ல போராட்டத்தைப் போராடு’ என்ற வடிவத்தையும் கிரேக்கத்தின் இராணுவ உருவகத்தையும் சரியாக விளக்குகிறது.
