  source_fidelity: 'வரைவின் முதன்மையான சொல் தெரிவுகள் கிரேக்க மூலத்துக்கு உண்மையாக உள்ளன: παραγγελία ‘கட்டளை,’ παρατίθεμαί ‘ஒப்படைக்கிறேன்,’ προφητείες ‘தீர்க்கதரிசனங்கள்,’ மற்றும் στρατεύῃ ... στρατείαν என்பதன் நீடித்த இராணுவ உருவகம் ‘போர்ப்பணி’ வழியாகப் பாதுகாக்கப்படுகின்றன. ஆனால் ἵνα நோக்க அமைப்புக்காக மூலத்தில் இல்லாத ‘இதைச் செய்கிறேன்’ சேர்க்கப்பட்டுள்ளது; அது பவுலின் ஒப்படைப்பின் நோக்கத்தை நேரடியாகக் கூறும் சொற்றொடராக மாற்றப்பட வேண்டும்.'
