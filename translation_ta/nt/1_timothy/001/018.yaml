  to: என் பிள்ளை தீமோத்தேயுவே, உன்னைக் குறித்து[a] முன்பு உரைக்கப்பட்ட தீர்க்கதரிசனங்களுக்கு ஏற்ப, அவற்றால்[b] நீ நல்ல போர்ப்பணியை[c] மேற்கொள்ளும்படி இந்தக் கட்டளையை உன்னிடம் ஒப்படைக்கிறேன்.
  rationale: மூலத்தின் ἵνα நோக்க அமைப்பைத் தமிழில் நேரடியாக இணைத்து, மூலத்தில் இல்லாத ‘இதைச் செய்கிறேன்’ என்பதைக் களைந்துள்ளேன். மேலும் c அடிக்குறிப்பு குறியீட்டை அது விளக்கும் ‘நல்ல போர்ப்பணி’ என்ற சொல்லோடு வைத்துள்ளேன். தீர்க்கதரிசனங்கள் தொடர்பான கருவி/களம் என்ற ἐν αὐταῖς-இன் திறந்த நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
