lexical_decisions:
- source_word: Οἴδαμεν
  choice: நாம் அறிந்திருக்கிறோம்
  rationale: οἶδα இங்கு நிகழ்காலப் பொருளுடைய நிலைபெற்ற அறிவைக் குறிக்கிறது; தமிழ் இயல்பில் இதை ‘அறிந்திருக்கிறோம்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான உரைத் தொடர்பைக் காட்டுகிறது; தமிழில் செயற்கையான ‘ஆனால்/இப்போது’ சேர்க்காமல் வாக்கியத் தொடரே அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: அறியப்படுவதன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் ὅτι-க்கு தமிழில் ‘என்று’ இயல்பான இணைப்பு.
- source_word: καλὸς
  choice: நல்லது
  rationale: திருச்சட்டத்தின் நேர்மறையான தரத்தைப் பரந்த முறையில் குறிக்கிறது; தேவையற்ற பொருள் வரையறையின்றி ‘நல்லது’ அதைத் தக்கவைக்கிறது.
- source_word: ὁ νόμος
  choice: திருச்சட்டம்
  rationale: இச்சூழலில் νόμος அங்கீகரிக்கப்பட்ட இறைச்சட்டத்தைக், குறிப்பாக மோசேயின் சட்டத்தை, நோக்கினாலும் கிரேக்கம் அதை மேலும் குறுக்கிக் குறிப்பிடவில்லை; ‘திருச்சட்டம்’ தமிழில் வேதாகமச் சட்டத்தை இயல்பாகக் குறிக்கிறது.
- source_word: ἐάν τις
  choice: ஒருவர் … என்றால்
  rationale: தீர்மானிக்கப்படாத பொதுமை ஒருமையையும் நிபந்தனையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: αὐτῷ
  choice: திருச்சட்டத்தை
  rationale: சுட்டுப்பெயர் νόμος-ஐத் திரும்பச் சுட்டுகிறது; தமிழில் குழப்பமின்றி இயல்பாக இருக்க பெயர்ச்சொல் மீண்டும் பயன்படுத்தப்பட்டது.
- source_word: νομίμως
  choice: முறைப்படி
  rationale: νομίμως என்பது சட்டத்திற்கோ உரிய நெறிக்கோ ஏற்ப பயன்படுத்துவதைச் சுட்டுகிறது. ‘முறைப்படி’ நவீன தமிழில் இயல்பானது; νόμος உடனான சொல்விளையாட்டு முழுமையாகப் பிரதிபலிக்காததால் மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: χρῆται
  choice: பயன்படுத்தினால்
  rationale: χράομαι என்பதன் ‘பயன்படுத்து’ என்ற பொருளையும் நிபந்தனை அமைப்பையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ὁ νόμος என்பதன் வரம்பு
  choice: திருச்சட்டம் என்று மட்டும் மொழிபெயர்த்து, ‘மோசேயின் திருச்சட்டம்’ என்று முதன்மை உரையில் குறிப்பிடவில்லை.
  alternative: மோசேயின் திருச்சட்டம்; பொதுவான சட்டம்
  rationale: உடனடிச் சூழல் மோசேயின் சட்டத்தை முக்கியமாக நோக்கக்கூடும்; ஆயினும் மூல உரை வெறுமனே ‘சட்டம்’ என்றே கூறுகிறது. அதன் வரம்பை மொழிபெயர்ப்பில் தேவையின்றிக் குறுக்காமல் விடுவது இறையியல் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: τις என்ற பொதுமை ஒருமை
  choice: ஒருவர்
  alternative: யாராவது; எவரும்
  rationale: ‘ஒருவர்’ கிரேக்கத்தின் பொதுமை ஒருமையைத் தக்கவைத்துக்கொண்டு நவீன தமிழில் இயல்பாக உள்ளது.
- issue: νομίμως என்பதிலுள்ள νόμος உடனான சொல்லியல் தொடர்பு
  choice: முதன்மை உரையில் ‘முறைப்படி’; மாற்றாக ‘சட்டத்திற்கேற்ப’ என்று அடிக்குறிப்பில் குறிப்பிட்டல்
  alternative: சட்டத்திற்கேற்ப
  rationale: ‘சட்டத்திற்கேற்ப’ என்ற வடிவம் கிரேக்கச் சொல்விளையாட்டை நன்கு காட்டினாலும், தமிழில் சட்டத்தை ‘சட்டத்திற்கேற்ப பயன்படுத்துதல்’ சற்றுக் கடினமாக ஒலிக்கிறது. ‘முறைப்படி’ பொருளை இயல்பாகத் தருகிறது; அடிக்குறிப்பு சொல்லியல் நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. கிரேக்க வாக்கியத்தின் நிபந்தனைத் தொடர்பு இயல்பான தமிழ் சொல் வரிசையில் அமைக்கப்பட்டது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘நல்லது’ என்ற முடிவுக்குப் பின் வைக்கப்பட்டுள்ளது.
