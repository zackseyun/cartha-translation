  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: ta
  text: சட்டப் போதகர்களாக இருக்க விரும்புகிறார்கள்; ஆயினும், தாங்கள் சொல்வதையோ, எவற்றைக் குறித்து மிக உறுதியாக வலியுறுத்துகிறார்களோ அவற்றையோ புரிந்துகொள்வதில்லை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “தாங்கள் என்ன சொல்கிறார்கள் என்பதையோ, எவற்றைக் குறித்து உறுதியாக வலியுறுத்துகிறார்கள் என்பதையோ புரிந்துகொள்வதில்லை.”'
    reason: lexical_alternative
  - marker: b
    text: “சட்டப் போதகர்கள்” என்பது யூதச் சட்டத்தை (தோராவை) அதிகாரத்துடன் போதிப்பதாகக் கூறிக்கொண்டவர்களைக் குறித்திருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: θέλοντες εἶναι
  choice: இருக்க விரும்புகிறார்கள்
  rationale: தொடர்ந்து நிலவும் விருப்பத்தைக் காட்டும் நிகழ்காலப் பங்கேற்புச் சொல்லையும் அதனுடன் வரும் நிறைவிலியையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: νομοδιδάσκαλοι
  choice: திருச்சட்டப் போதகர்கள்
  rationale: சட்டத்தோடு தொடர்புடைய போதகர்கள் என்ற கூட்டுச்சொல்லின் பொருளைப் பாதுகாக்கிறது; இச்சூழலில் யூதத் திருச்சட்டம் குறிக்கப்படுவது சாத்தியம் என்றாலும், மூலவாக்கியத்தைவிட முதன்மை உரையில் அதிகமாகக் குறிப்பாக்கவில்லை.
- source_word: μὴ νοοῦντες
  choice: ஆனால் ... புரிந்துகொள்வதில்லை
  rationale: அவர்கள் போதகர்களாக விரும்புவதற்கும் அவர்களிடம் புரிதல் இல்லாததற்கும் இடையிலுள்ள முரண்பாட்டைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μήτε ... μήτε
  choice: '...யையோ ...யையோ ... இல்லை'
  rationale: இரண்டு பொருட்களையும் மறுக்கும் கிரேக்க இணைமறுப்பை இயல்பான தமிழ் அமைப்பில் தக்கவைக்கிறது.
- source_word: ἃ λέγουσιν
  choice: தாங்கள் சொல்வதை
  rationale: அவர்களுடைய பேச்சின் உள்ளடக்கத்தைக் குறிக்கும் தொடர்புப்பெயர் அமைப்பைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: περὶ τίνων διαβεβαιοῦνται
  choice: எவற்றைக் குறித்து அவ்வளவு உறுதியாக வலியுறுத்துகிறார்களோ அவற்றை
  rationale: περί என்பதன் ‘குறித்து’ என்ற தொடர்பையும், διαβεβαιοῦνται என்பதன் வலுவான, தன்னம்பிக்கையான உறுதிப்படுத்தலையும் பாதுகாக்கிறது.
theological_decisions:
- issue: νομοδιδάσκαλοι என்பதில் ‘சட்டம்’ எதைக் குறிக்கிறது?
  choice: திருச்சட்டப் போதகர்கள்
  alternative: மோசேயின் சட்டத்தைப் போதிப்பவர்கள் / தோரா போதகர்கள்
  rationale: சூழலில் யூதத் திருச்சட்டம் அல்லது தோரா குறிக்கப்படுவது மிகச் சாத்தியம். இருப்பினும் கிரேக்கக் கூட்டுச்சொல் ‘சட்டப் போதகர்கள்’ என்ற அளவிலேயே உள்ளது; ஆகவே முதன்மை உரையில் ‘மோசேயின்’ என்று வெளிப்படையாகச் சேர்க்காமல், குறிப்பில் சூழலை விளக்குகிறது.
- issue: διαβεβαιοῦνται என்பதன் வலிமை
  choice: அவ்வளவு உறுதியாக வலியுறுத்துகிறார்கள்
  alternative: உறுதியாகப் பேசுகிறார்கள் / திட்டவட்டமாக உறுதிப்படுத்துகிறார்கள்
  rationale: வெறும் நம்பிக்கையுடன் பேசுதல் மட்டுமல்லாமல் வலுவாக வற்புறுத்தி உறுதிப்படுத்துதல் என்ற நுணுக்கத்தை வெளிப்படுத்துகிறது; அவர்களின் அறியாமைக்கும் உறுதியான பேச்சுக்கும் இடையிலான பதற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திருச்சட்டம்’ யூதத் தோராவைச் சுட்டும் சூழலை உணர்த்துகிறது; ஆனால் முதன்மை உரையில் ‘மோசேயின் சட்டம்’ என்று மிகையாகத் தீர்மானிக்கவில்லை. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
