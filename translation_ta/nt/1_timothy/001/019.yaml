source:
  edition: SBLGNT
  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: ta
  text: விசுவாசத்தையும்[b] நல்ல மனச்சாட்சியையும்[a] பற்றிக்கொண்டிரு; அந்த மனச்சாட்சியைச் சிலர் தள்ளிவிட்டு, விசுவாசத்தைப் பொறுத்தவரையில் கப்பல் நொறுங்கியதுபோல் ஆனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்த மனச்சாட்சியை” என்பதற்குப் பதிலாக, “அவற்றைச் சிலர் தள்ளிவிட்டு” என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் “அதை” என்ற ஒருமைப் பெண்பால் சுட்டுப்பெயர் மிக இயல்பாக “மனச்சாட்சி” என்பதையே குறிக்கிறது; ஆனால் சிலர் அது “விசுவாசமும் நல்ல மனச்சாட்சியும்” ஆகிய இரண்டையும் விரிவாகச் சுட்டுவதாகக் கருதுகிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: “விசுவாசம்” என்பதை “நம்பிக்கை” என்றும், இங்கே குறைந்த வாய்ப்பில் “உண்மைத்தன்மை” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: பற்றிக்கொண்டிரு
  rationale: நிகழ்காலப் பங்கேற்புவினை முந்தைய வசனத்தின் அறிவுறுத்தலோடு இணைந்து தீமோத்தேயுவை நோக்குகிறது. தொடர்ந்து உறுதியாகக் காத்துக்கொள்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: இச்சூழலில் கிறிஸ்தவ விசுவாசத்தைக் குறிப்பதே மிக இயல்பு; ‘நம்பிக்கை’ என்ற பொருளும் சொற்பொருள் வரம்பில் இருப்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀγαθὴν συνείδησιν
  choice: நல்ல மனச்சாட்சி
  rationale: ἀγαθή என்பதன் ‘நல்ல’ என்ற நேரடியான பொருளையும், συνείδησις என்பதன் ஒழுக்க உணர்வையும் குறுகச் செய்யாமல் காக்கிறது.
- source_word: ἀπωσάμενοι
  choice: தள்ளிவிட்டு
  rationale: வேண்டுமென்றே விலக்குதல் அல்லது நிராகரித்தல் என்ற வலுவான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: περὶ τὴν πίστιν
  choice: விசுவாசத்தைப் பொறுத்தவரையில்
  rationale: கப்பல் நொறுங்குதல் நிகழ்ந்த துறை அல்லது தொடர்பை περί குறிக்கிறது; கிரேக்கச் சொல்லமைப்பை தேவையின்றி காரணவாக்கியமாக மாற்றவில்லை.
- source_word: ἐναυάγησαν
  choice: கப்பல் நொறுங்கியதுபோல் ஆனார்கள்
  rationale: ஆவிக்குரிய பேரழிவைக் குறிக்கும் கடற்பயண உருவகத்தை, தமிழில் உருவகம் எனத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: ἥν என்பதன் முன்குறிப்பு
  choice: ‘நல்ல மனச்சாட்சி’ என்பதைச் சுட்டுகிறது
  alternative: ‘விசுவாசமும் நல்ல மனச்சாட்சியும்’ ஆகிய இரண்டையும் தொகுத்துச் சுட்டுகிறது
  rationale: ἥν என்பது பெண்பால் ஒருமை; அருகிலுள்ள பெண்பால் ஒருமைச் சொல்லான συνείδησιν என்பதோடு இலக்கண ரீதியாக மிக இயல்பாக ஒத்துப்போகிறது. இருந்தாலும் விரிந்த தொடர்பை முற்றிலும் மறுக்காமல் அடிக்குறிப்பில் பதிவு செய்கிறது.
- issue: இரண்டாவது πίστις என்பதன் பொருள்
  choice: கிறிஸ்தவ விசுவாசம்
  alternative: தனிப்பட்ட நம்பிக்கை அல்லது உண்மைத்தன்மை
  rationale: உறுப்புரையுடன் வரும் τὴν πίστιν இச்சூழலில் கிறிஸ்தவ விசுவாசத்தை அல்லது அதன் உள்ளடக்கத்தைச் சுட்டுவது மிக இயல்பு; தேவையற்ற கோட்பாட்டு விரிவாக்கம் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்துடன் இணையும் பங்கேற்புவினையின் அறிவுறுத்தல் வலிமை ‘பற்றிக்கொண்டிரு’ என வெளிப்படுத்தப்பட்டுள்ளது. கப்பல் நொறுங்கும் உருவகம் பாதுகாக்கப்பட்டுள்ளது; ἥν குறித்த இலக்கணத் தெளிவும் மாற்று வாய்ப்பும் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
