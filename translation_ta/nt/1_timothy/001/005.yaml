source:
  edition: SBLGNT
  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: ta
  text: அறிவுறுத்தலின்[b] நோக்கம்[a], தூய உள்ளத்திலிருந்தும் நல்ல மனச்சாட்சியிலிருந்தும் பாசாங்கற்ற விசுவாசத்திலிருந்தும்[c] வரும் அன்பாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நோக்கம்” என்பதற்கு “குறிக்கோள்” அல்லது “விளைவு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அறிவுறுத்தல்” என்பதற்கு “கட்டளை” அல்லது “ஆணை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “பாசாங்கற்ற விசுவாசம்” என்பதை “உண்மையான விசுவாசம்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள கிரேக்கச் சொல் சில சூழல்களில் “நம்பகத்தன்மை” அல்லது “நம்புதல்” என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: நோக்கம்
  rationale: இங்கு முடிவைக் குறிக்காமல், அறிவுறுத்தலின் குறிக்கோள் அல்லது எதிர்பார்க்கப்படும் விளைவைக் குறிக்கிறது.
- source_word: παραγγελίας
  choice: அறிவுறுத்தல்
  rationale: கட்டளை, பொறுப்பு ஒப்படைப்பு, அறிவுறுத்தல் ஆகிய பொருள்கள் சாத்தியம்; முந்தைய வசனங்களில் தீமோத்தேயுவுக்கு அளிக்கப்படும் போதனை சார்ந்த வழிகாட்டுதலை இயல்பாக எடுத்துரைக்கிறது.
- source_word: ἀγάπη
  choice: அன்பு
  rationale: சொல்லின் பொதுவான நெறியியல் மற்றும் உறவுசார் பொருளை நேராகக் கொடுக்கிறது.
- source_word: ἐκ
  choice: …இலிருந்து வரும்
  rationale: அன்பு உருவாகும் மூலம் அல்லது தோற்றத்தைத் தெளிவான தமிழில் காட்டுகிறது.
- source_word: καθαρᾶς καρδίας
  choice: தூய உள்ளம்
  rationale: καρδία குறிக்கும் அகநிலை மற்றும் நெறித்தூய்மையை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: συνειδήσεως ἀγαθῆς
  choice: நல்ல மனச்சாட்சி
  rationale: ἀγαθῆς என்பதன் நேரான பொருளைப் பேணி, ‘குற்றமற்ற மனச்சாட்சி’ போன்ற விளக்கவுரையைத் தவிர்க்கிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இச்சூழலில் உண்மையான விசுவாசம் முதன்மையான வாசிப்பு; நம்பகத்தன்மை அல்லது நம்புதல் என்ற சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
- source_word: ἀνυποκρίτου
  choice: பாசாங்கற்ற
  rationale: ‘பாசாங்கு இல்லாத’ என்ற மூலப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் பேணுகிறது.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது மெலிதான உரைமாற்றக் குறியீடு; இத்தனி வசனத்தில் ‘ஆனால்’ அல்லது ‘இப்போது’ சேர்ப்பது தேவையற்ற வலிமையையோ காலநுணுக்கத்தையோ உருவாக்கலாம்.
theological_decisions:
- issue: πίστεως ἀνυποκρίτου என்பதன் பொருள்
  choice: பாசாங்கற்ற விசுவாசம்
  alternative: பாசாங்கற்ற நம்பகத்தன்மை; உண்மையான நம்புதல்
  rationale: πίστις என்பதற்கு இங்கு ‘விசுவாசம்’ என்பது இயல்பான முதன்மை வாசிப்பு. எனினும் அதன் பொருள் வரம்பில் நம்பகத்தன்மையும் நம்புதலும் இருப்பதால் அவை அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. மூன்று மூலங்களையும் ஒரே இலக்கண அமைப்பில் இணைத்து, அவற்றிலிருந்து அன்பு வருகிறது என்ற கிரேக்க அமைப்பு தெளிவாகப் பேணப்பட்டுள்ளது.
