id: 1TI.1.20
reference: 1 Timothy 1:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: ta
  text: அவர்களில் இமெனேயுவும் அலெக்சாந்தரும் இருக்கிறார்கள். அவர்களைச் சாத்தானிடம் ஒப்படைத்தேன்[a]; அவர்கள் பழித்துப் பேசாதிருக்கத் திருத்திப் பயிற்றுவிக்கப்படும்படி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாத்தானிடம் ஒப்படைத்தேன்” என்பது கடுமையான திருத்த ஒழுக்கத்தைக் குறிக்கலாம்; அது எவ்வாறு நடைமுறைப்படுத்தப்பட்டது என்பதை இங்கு உரை விளக்கவில்லை. இது இறுதித் தண்டனைத் தீர்ப்பைக் கட்டாயமாகக் குறிக்கவில்லை.
    reason: theological_ambiguity
  - marker: b
    text: “திருத்திப் பயிற்றுவிக்கப்படும்படி” என்பதை “கற்பிக்கப்படும்படி,” “ஒழுக்கப்படுத்தப்படும்படி,” அல்லது “திருத்தப்படும்படி” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் திருத்தத்தை நோக்கிய பயிற்சியைக் குறிக்கிறது. “பழித்துப் பேசுதல்” யாரை அல்லது எதை நோக்கியது என்று மூலத்தில் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: அவர்களில் … இருக்கிறார்கள்
  rationale: முந்தைய வசனத்தில் கூறப்பட்டவர்களில் இவர்கள் அடங்குவர் என்ற பகுதி–முழுமை உறவை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: இமெனேயுவும் அலெக்சாந்தரும்
  rationale: கிரேக்கப் பெயர்களின் ஒலிப்பைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதுகிறது.
- source_word: παρέδωκα
  choice: ஒப்படைத்தேன்
  rationale: παραδίδωμι என்பதன் நேரடியான வலிமையைத் தக்கவைத்து, தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τῷ Σατανᾷ
  choice: சாத்தானிடம்
  rationale: புதிய ஏற்பாட்டுத் தமிழில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: ἵνα παιδευθῶσι
  choice: திருத்திப் பயிற்றுவிக்கப்படும்படி
  rationale: παιδεύω என்பதில் உள்ள கற்பித்தல், பயிற்சி, ஒழுக்கத் திருத்தம் ஆகிய இணைந்த கருத்துகளைச் சூழலுக்கேற்ற வகையில் காட்டுகிறது; வெறும் தண்டனை என்று குறுக்குவதில்லை.
- source_word: μὴ βλασφημεῖν
  choice: இறைவனைப் பழித்துப் பேசாதிருக்க
  rationale: βλασφημέω என்பதன் அவதூறான அல்லது இறைநிந்தனையான பேச்சு என்ற தீவிரத்தை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது; இங்கு இறைவனே மறைமுகப் பொருள் என்பது சூழல்சார் விளக்கம்.
theological_decisions:
- issue: “சாத்தானிடம் ஒப்படைத்தேன்” என்பதன் பொருள்
  choice: மூலத்தின் உருவகமிக்க சொற்றொடரை பிரதான உரையில் அப்படியே தக்கவைத்தல்
  alternative: சபையிலிருந்து நீக்கினேன் என்று நேரடியாக விளக்குதல்; உடல் வேதனையை அற்புதமாக வரவழைத்தேன் என்று பொருள்கொள்ளுதல்; இறுதித் தண்டனைக்கு ஒப்புக்கொடுத்தேன் என்று பொருள்கொள்ளுதல்
  rationale: திருத்திப் பயிற்றுவிக்கப்பட வேண்டும் என்ற நோக்கவாக்கியம் மீட்பை நோக்கிய கடுமையான ஒழுக்க நடவடிக்கையைச் சுட்டினாலும், அதன் துல்லியமான நடைமுறையை கிரேக்க உரை கூறவில்லை. எனவே பிரதான உரை அந்த இறையியல் பதற்றத்தையும் தெளிவின்மையையும் காக்கிறது.
- issue: παιδευθῶσι என்பதில் தண்டனையா கற்பித்தலா
  choice: திருத்திப் பயிற்றுவிக்கப்படும்படி
  alternative: தண்டிக்கப்படும்படி; கற்பிக்கப்படும்படி
  rationale: இச்சொல் வடிவமைக்கும் கற்றலையும் ஒழுக்கத் திருத்தத்தையும் ஒருங்கே கொண்டுள்ளது. சூழலில் கடுமை இருந்தாலும், நோக்கம் வெறும் பழிவாங்கும் தண்டனை அல்ல.
- issue: βλασφημεῖν என்பதன் இலக்கு
  choice: இறைவனைப் பழித்துப் பேசுதல்
  alternative: பழித்துப் பேசுதல்; அவதூறு பேசுதல்
  rationale: சூழல் நம்பிக்கையையும் நல்ல மனசாட்சியையும் கைவிட்டவர்களைப் பற்றியது என்பதால் இறைநிந்தனைப் பொருள் வலுவாக உள்ளது. இருப்பினும் கிரேக்க வினைக்கு இலக்கு வெளிப்படையாகக் கொடுக்கப்படாததை அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. “ஒப்படைத்தேன்” என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது. “திருத்திப் பயிற்றுவிக்கப்படும்படி” என்பது இயல்புத் தன்மையையும் கிரேக்கச் சொல்லின் பலவகை அர்த்தங்களையும் சமநிலைப்படுத்துகிறது; அடிக்குறிப்புகள் பிரதான உரையில் தீர்க்கப்படாத சொற்பொருள் மற்றும் இறையியல் தெளிவின்மைகளை வெளிப்படுத்துகின்றன.
