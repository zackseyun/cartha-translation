id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: ta
  text: ஆகவே, இளைய விதவைகள் திருமணம் செய்துகொள்ளவும்[a], பிள்ளைகளைப் பெற்றெடுக்கவும், தங்கள் இல்லங்களை நிர்வகிக்கவும், எதிர்ப்பவருக்குப் பழித்துப் பேச எந்த வாய்ப்பையும் கொடுக்காமலும் நான் விரும்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘திருமணம் செய்துகொள்ள’ என்றே உள்ளது. இங்கு விதவைகள் பேசப்படுவதால், மறுமணம் செய்துகொள்வது உட்பொருளாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: βούλομαι
  choice: நான் விரும்புகிறேன்
  rationale: பவுலின் தனிப்பட்ட விருப்பத்தையும் நோக்கத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய விவாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: νεωτέρας
  choice: இளைய கைம்பெண்கள்
  rationale: சொல் தனியாக ‘இளைய பெண்கள்’ என்று பொருள்படலாம்; ஆனால் உடனடிச் சூழல் கைம்பெண்களைப் பற்றியது என்பதால் மறைந்துள்ள பெயர்ச்சொல் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: γαμεῖν
  choice: திருமணம் செய்துகொள்ளவும்
  rationale: கிரேக்க வினை ‘திருமணம் செய்துகொள்’ என்றே கூறுகிறது; கைம்பெண்கள் குறிக்கப்படுவதால் மறுமணம் சூழலில் உட்பொருளாக இருந்தாலும், ‘மீண்டும்’ என்பது மூலத்தில் வெளிப்படையாக இல்லை.
- source_word: τεκνογονεῖν
  choice: பிள்ளைகளைப் பெற்றெடுக்கவும்
  rationale: பிள்ளைகளைப் பெற்றெடுப்பதை நேரடியாகக் குறிக்கும் வினையின் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: οἰκοδεσποτεῖν
  choice: தங்கள் குடும்பங்களை நிர்வகிக்கவும்
  rationale: வீட்டுப் பொறுப்பையும் மேற்பார்வையையும் குறிக்கிறது; கடுமையான ஆதிக்கம் என்ற தேவையற்ற பொருளைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: எந்த வாய்ப்பையும் கொடுக்காமல் இருக்கவும்
  rationale: எதிரான பேச்சுக்கு ஓர் இடமோ சந்தர்ப்பமோ அளிக்காதிருத்தல் என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: τῷ ἀντικειμένῳ
  choice: எதிர்ப்பவர்
  rationale: ‘எதிர்த்து நிற்பவர்’ என்ற கிரேக்கப் பங்கேற்புவினையின் பொதுவான பொருளைப் பாதுகாக்கிறது; அது சாத்தானையே குறிக்கிறது என்று பிரதியில் தீர்மானிக்கவில்லை.
- source_word: λοιδορίας χάριν
  choice: பழித்துப் பேசுவதற்கு
  rationale: இழிவாகவோ அவதூறாகவோ பேசுவதற்கான வாய்ப்பைச் சுட்டும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τῷ ἀντικειμένῳ என்பவரின் அடையாளம்
  choice: குறிப்பிடப்படாத எதிர்ப்பவர்
  alternative: சாத்தான் எனப் புரிந்துகொள்ளப்படும் ‘எதிராளி’
  rationale: கிரேக்கச் சொல் எதிர்ப்பவரின் அடையாளத்தைத் தெளிவாகக் குறிப்பிடவில்லை. ஆகவே பிரதியில் பொதுவான பொருள் வைக்கப்பட்டு, சாத்தானைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கைம்பெண்கள்’ என்பது சூழலில் உள்ள விதவைகளைக் குறிக்கிறது; ‘குடும்பங்களை நிர்வகிக்க’ என்பது வீட்டின் செயற்பாட்டு மேற்பார்வையை இயல்பாகத் தெரிவிக்கிறது. கிரேக்கத்தின் இறுதிநோக்குச் சொற்றொடர் தமிழில் தெளிவாக அமைய ‘எதிர்ப்பவர் பழித்துப் பேசுவதற்கு’ என்று அமைக்கப்பட்டுள்ளது.
