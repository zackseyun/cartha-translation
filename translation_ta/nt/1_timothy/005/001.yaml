source:
  edition: SBLGNT
  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: ta
  text: வயதில் மூத்த ஆணைக்[a] கடிந்துகொள்ளாதே; மாறாக, அவரைத் தந்தையாகக் கருதி அறிவுறுத்து; இளைய ஆண்களைச் சகோதரர்களாகக் கருதி அறிவுறுத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மூப்பரைக் கடுமையாகக் கண்டிக்காதே.” கிரேக்கச் சொல் ‘வயதில் மூத்த ஆண்’ அல்லது ‘மூப்பர்’ என இருவிதமாகப் பொருள்படலாம்; இச்சூழலில் இளைய ஆண்களுடன் செய்யப்படும் ஒப்பீடு ‘வயதில் மூத்த ஆண்’ என்ற பொருளை ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: வயதில் மூத்த ஓர் ஆணை
  rationale: இச்சொல் ‘மூத்தவர்’ அல்லது திருச்சபைப் பொறுப்பைக் குறிக்கும் ‘மூப்பர்’ என இருவிதமாகப் பொருள்படலாம். இதே வசனத்திலுள்ள νεωτέρους (‘இளைய ஆண்கள்’) என்பதுடனும் அடுத்த வசனத்தின் வயது–பால் அமைப்புடனும் காணப்படும் எதிரிணை, வயதை அடிப்படையாகக் கொண்ட பொருளை வலுப்படுத்துகிறது.
- source_word: μὴ ἐπιπλήξῃς
  choice: கடிந்துகொள்ளாதே
  rationale: வாய்மொழியாகக் கடுமையாகத் தாக்குதல், கண்டித்தல் என்ற வினையின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; மூலத்தில் இல்லாத அளவுக்கு தீவிரத்தை மிகைப்படுத்தவில்லை.
- source_word: ἀλλὰ παρακάλει
  choice: மாறாக ... எடுத்துச் சொல்
  rationale: παρακαλέω என்பது வேண்டுதல், வலியுறுத்துதல், அறிவுறுத்துதல் போன்ற பரந்த பொருள் கொண்டது. கடிந்துகொள்வதற்கு மாறாக, குடும்ப உறவுக்குரிய மரியாதையோடு ஒருவரிடம் ஒரு காரியத்தை எடுத்துச் சொல்லும் தன்மையை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὡς πατέρα
  choice: ஒரு தந்தையிடம் பேசுவதுபோல்
  rationale: ὡς குறிக்கும் ஒப்புமையைத் தெளிவாகவும், தமிழில் உறவுசார் பேச்சுமுறையாகவும் வழங்குகிறது.
- source_word: νεωτέρους
  choice: இளைய ஆண்கள்
  rationale: ஆண்பால் பன்மை வடிவத்தையும், அடுத்த வசனத்தில் பெண்கள் தனியே குறிப்பிடப்படுவதையும் காக்கிறது.
- source_word: ὡς ἀδελφούς
  choice: சகோதரர்களிடம் பேசுவதுபோல்
  rationale: இங்கு வயது மற்றும் பால் அடிப்படையில் தனித்தனிக் குழுக்கள் பேசப்படுவதால், ஆண்பால் பொருளை ‘சகோதரர்கள்’ என்று பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘விசுவாசத்தில்’ போன்ற சொற்கள் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: Πρεσβυτέρῳ என்பது திருச்சபை மூப்பரைக் குறிக்கிறதா, வயதில் மூத்த ஆணைக் குறிக்கிறதா?
  choice: வயதில் மூத்த ஓர் ஆண்
  alternative: திருச்சபை மூப்பர்
  rationale: மூத்த ஆண்/தந்தை, இளைய ஆண்கள்/சகோதரர்கள், பின்னர் மூத்த பெண்கள்/தாய்மார்கள், இளைய பெண்கள்/சகோதரிகள் என்ற சூழலமைப்பு வயது சார்ந்த பொருளை வலுவாக ஆதரிக்கிறது. ஆயினும் கிரேக்கச் சொல்லின் பதவிசார் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀδελφούς என்பதை அனைவரையும் உள்ளடக்கும் சொல்லாக மொழிபெயர்க்கலாமா?
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்
  rationale: உடனடிச் சூழலில் ஆண்களும் பெண்களும் தனித்தனியாகக் குறிப்பிடப்படுவதால், இங்குள்ள ஆண்பால் பன்மை குறிப்பிட்ட இளைய ஆண்களையே குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவரிடம்’ என்ற மரியாதைப் பன்மை வயதில் மூத்த ஆணுக்குரிய உறவுசார் மரியாதையை இயல்பாக வெளிப்படுத்துகிறது; இளைய ஆண்களுக்கு மூலத்தின் பன்மை அமைப்பு காக்கப்பட்டுள்ளது.
