revisions:
- from: வயதில் மூத்த ஓர் ஆணைக்[a] கடிந்துகொள்ளாதே. மாறாக, ஒரு தந்தையிடம் பேசுவதுபோல் அவரிடம் எடுத்துச் சொல்; இளைய ஆண்களிடம் சகோதரர்களிடம் பேசுவதுபோல் எடுத்துச் சொல்.
  to: வயதில் மூத்த ஆணைக்[a] கடிந்துகொள்ளாதே; மாறாக, அவரைத் தந்தையாகக் கருதி அறிவுறுத்து; இளைய ஆண்களைச் சகோதரர்களாகக் கருதி அறிவுறுத்து.
