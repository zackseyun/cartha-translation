  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: ta
  text: மூத்த பெண்களைத் தாய்மார்களைப்போலவும், இளைய பெண்களைச் சகோதரிகளைப்போலவும், எல்லாத் தூய்மையுடனும் அறிவுரை கூறு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முழுத் தூய்மையுடன்’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் இந்தச் சொற்றொடர் கற்புத் தூய்மை அல்லது பாலியல் ஒழுக்கம் என்ற வலுவான பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: மூத்த பெண்களை
  rationale: பெண்பால் பன்மை வடிவமான இச்சொல் இங்கு திருச்சபைப் பதவியைக் குறிக்காமல், νεωτέρας என்பதற்கு எதிராக வயதில் மூத்த பெண்களைக் குறிக்கிறது.
- source_word: ὡς μητέρας
  choice: தாய்மார்களைப்போல
  rationale: ὡς காட்டும் ஒப்புமையையும் குடும்ப உறவு உருவகத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘உன்’ சேர்க்கப்படவில்லை.
- source_word: νεωτέρας
  choice: இளம் பெண்களை
  rationale: பெண்பால் பன்மையாகப் பெயர்ச்சொல் நிலையில் வந்து, வயதில் இளைய பெண்களைக் குறிக்கிறது.
- source_word: ὡς ἀδελφὰς
  choice: சகோதரிகளைப்போல
  rationale: குடும்ப உறவு உருவகத்தின் இணை அமைப்பைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத உடைமைச்சொல் சேர்க்கப்படவில்லை.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: எல்லாத் தூய்மையுடனும்
  rationale: πάσῃ என்பதின் முழுமையான பரப்பையும் ἁγνεία என்பதின் ஒழுக்க மற்றும் பாலியல் தூய்மை சார்ந்த பொருள் வீச்சையும் குறுக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: ἁγνεία என்பதன் பொருள் வீச்சு
  choice: எல்லாத் தூய்மையுடனும்
  alternative: முழுக் கற்புத் தூய்மையுடன்
  rationale: சூழலில் பாலியல் ஒழுக்கம் வலுவாக உட்பட்டிருந்தாலும், கிரேக்கச் சொல் அதற்கு மட்டும் வரையறுக்கப்படாமல் விரிவான ஒழுக்கத் தூய்மையையும் குறிக்கலாம். ஆகவே முதன்மை உரை அந்தப் பொருள் வீச்சைத் திறந்தே வைக்கிறது.
- issue: முந்தைய வசனத்திலிருந்து தொடரும் வினைச்சொல்
  choice: அறிவுரை கூறு
  alternative: வார்த்தை அமைப்பைத் துண்டாகவே விடுதல்
  rationale: கிரேக்கத்தில் இவ்வசனத்தின் கூறுகள் 5:1-இல் உள்ள παρακάλει என்ற வினைச்சொல்லைத் தொடர்ந்து சார்ந்துள்ளன. தனி வசனமாகத் தமிழில் தெளிவாக வாசிக்க அதற்குரிய பொருள் மீண்டும் வெளிப்படுத்தப்பட்டது; ‘கருதி’ என்பது ὡς காட்டும் உறவுமுறை ஒப்புமையை இயல்பாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. இணையான ‘தாய்மார்களைப்போலவும் … சகோதரிகளைப்போலவும்’ அமைப்பு காக்கப்பட்டுள்ளது; ‘எல்லாத் தூய்மையுடனும்’ என்பது மூலத்தின் பரந்த பொருள் வீச்சைப் பாதுகாக்கிறது.
