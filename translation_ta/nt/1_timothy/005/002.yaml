revisions:
- from: மூத்த பெண்களைத் தாய்மார்களைப்போலவும், இளம் பெண்களைச் சகோதரிகளைப்போலவும் கருதி, எல்லாத் தூய்மையுடனும்[a] அறிவுரை கூறு.
  to: மூத்த பெண்களைத் தாய்மார்களைப்போலவும், இளைய பெண்களைச் சகோதரிகளைப்போலவும், எல்லாத் தூய்மையுடனும் அறிவுரை கூறு.[a]
  rationale: ‘இளைய’ மூலம் வயது ஒப்புமை தெளிவாக்கப்பட்டுள்ளது; ‘கருதி’ நீக்கப்பட்டதால் மூலத்தின் ஒப்புமை அமைப்பும் முந்தைய வசனத்திலிருந்து தொடரும் அறிவுரையும் நேரடியாக வெளிப்படுகின்றன. அடிக்குறிப்பு மூலச் சொற்றொடரின் பரந்த பொருள் வீச்சைத் தக்கவைக்கிறது.
