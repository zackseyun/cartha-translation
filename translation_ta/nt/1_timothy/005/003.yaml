  yaml_path: translation/nt/1_timothy/005/003.yaml
  text: Honor widows who are truly widows[a].
translation:
  language: ta
  text: விதவைகளில் உண்மையிலேயே விதவைகளாய் இருப்பவர்களைக் கண்ணியப்படுத்து[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விதவைகளில் உண்மையிலேயே விதவைகளாய் இருப்பவர்களுக்கு ஆதரவு அளி”; இச்சூழலில், “கண்ணியப்படுத்து” என்பது பொருளுதவி செய்வதையும் உள்ளடக்கியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χήρας
  choice: விதவைகளாக இருப்பவர்களுக்கு
  rationale: χήρα என்பது கணவனை இழந்த பெண்களைக் குறிக்கிறது. தமிழில் வாக்கியம் இயல்பாக அமைய, கிரேக்கத்தின் நேரடி செயப்படுபொருள் அமைப்பு ‘மதிப்பளி’ என்பதுடன் நான்காம் வேற்றுமையில் வழங்கப்பட்டுள்ளது.
- source_word: τίμα
  choice: மதிப்பளி
  rationale: τιμάω என்பதன் அடிப்படைப் பொருள் மதித்தல், கண்ணியப்படுத்தல் என்பதாகும். இச்சூழலில் நடைமுறை அல்லது பொருளாதார உதவியும் இதில் அடங்கலாம்; எனினும் அதை ‘ஆதரவளி’ என்று மட்டும் குறுக்காமல், சொல்லின் விரிவான பொருள் காக்கப்பட்டுள்ளது.
- source_word: τὰς ὄντως χήρας
  choice: உண்மையிலேயே விதவைகளாக இருப்பவர்களுக்கு
  rationale: மீண்டும் வரும் χήρας என்பதையும் ὄντως தரும் தகுதிப்படுத்தும் வலியுறுத்தலையும் இந்தத் தொடர் வெளிப்படுத்துகிறது. தொடர்ந்து வரும் வசனங்கள் விளக்கும் விதத்தில், உண்மையாகவே ஆதரவற்ற விதவைகளை இது வேறுபடுத்திக் காட்டுகிறது.
- source_word: ὄντως
  choice: உண்மையிலேயே
  rationale: இது வெறும் அழுத்தத்திற்காக அல்லாமல், உண்மையான நிலையை வேறுபடுத்திக் காட்டும் வினையுரிச்சொல்; ‘உண்மையிலேயே’ அந்த நுட்பத்தை இயல்பான நவீன தமிழில் காக்கிறது.
theological_decisions:
- issue: இச்சூழலில் τιμάω என்பதன் பொருள் வரம்பு
  choice: மரியாதையையும், சூழலின்படி பொருளுதவியையும் உள்ளடக்கக்கூடிய ‘மதிப்பளி’ என்பது முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது.
  alternative: உண்மையிலேயே விதவைகளாக இருப்பவர்களுக்கு ஆதரவளி.
  rationale: 1 தீமோத்தேயு 5-ன் உடனடிச் சூழல் விதவைகளுக்கான பொருளாதாரப் பராமரிப்பைப் பேசுகிறது. ஆனாலும் கிரேக்க வினைச்சொல் நிதியுதவியை மட்டும் குறிக்காமல் விரிவான பொருளுடையது. ஆகவே முதன்மை உரை அந்த விரிவைத் தக்கவைத்து, சூழல்சார்ந்த மாற்று மொழிபெயர்ப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட ஒருமை கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘மதிப்பளி’ என்பது மரியாதையைத் தெளிவாகக் காட்டுவதுடன், சூழல் வெளிப்படுத்தும் நடைமுறைப் பராமரிப்பையும் விலக்குவதில்லை.
