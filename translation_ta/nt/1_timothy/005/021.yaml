  source_fidelity: 'Greek syntax and sense are accurately represented: the solemn charge is made before God, Messiah Jesus, and the chosen angels; the two related but distinct prohibitions—prejudgment (χωρὶς προκρίματος) and partiality (κατὰ πρόσκλισιν)—are retained without interpretive expansion.'
