id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: ta
  text: 'கடவுளுக்கும் மெசியாவாகிய இயேசுவுக்கும் தேர்ந்தெடுக்கப்பட்ட தேவதூதர்களுக்கும்[a] முன்னிலையில், நான் உனக்கு ஆணையிட்டுக் கூறுகிறேன்: நீ முன்கூட்டிய தீர்ப்பு ஏதுமின்றி[b] இவற்றைக் கடைப்பிடிக்க வேண்டும்; ஒருதலைச்சார்புடன்[c] எதையும் செய்யக் கூடாது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “தேர்ந்தெடுக்கப்பட்ட தூதர்கள்.”'
    reason: ἄγγελος என்பதற்கு அடிப்படையில் ‘தூதர்’ என்று பொருள்; இச்சூழலில் அது தேவதூதர்களைக் குறிக்கிறது.
  - marker: b
    text: அல்லது, “முன்தீர்மானம் ஏதுமின்றி.”
    reason: πρόκριμα என்பது முன்கூட்டியே வழங்கப்படும் தீர்ப்பையோ முன்பே உருவாக்கிக்கொண்ட முடிவையோ குறிக்கலாம்.
  - marker: c
    text: அல்லது, “பாரபட்சத்தினால்.”
    reason: πρόσκλισις என்பது ஒரு பக்கம் சாய்தல், சார்புகாட்டுதல் அல்லது பாரபட்சம் ஆகிய நெருங்கிய பொருள்களைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: நான் உனக்கு ஆணையிட்டுக் கூறுகிறேன்
  rationale: இச்சூழலில் இது வெறும் சாட்சியமளித்தலை அல்ல, கடவுளையும் பரலோக சாட்சிகளையும் முன்னிறுத்தி அளிக்கப்படும் வலிமையான, முறைமையான கட்டளையைக் குறிக்கிறது.
- source_word: ἐνώπιον
  choice: முன்னிலையில்
  rationale: கடவுளும் மற்ற பரலோகச் சாட்சிகளும் காணும்படி கூறப்படும் ஆணையின் முறைமையையும் தீவிரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மெசியாவாகிய இயேசு
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைத்துள்ளது; ‘மெசியாவாகிய’ என்பது தமிழில் இயல்பாக அந்தப் பட்டத்தைக் காட்டுகிறது.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: தேர்ந்தெடுக்கப்பட்ட தேவதூதர்கள்
  rationale: ἐκλεκτός என்பதன் ‘தேர்ந்தெடுக்கப்பட்ட’ என்ற பொருளையும், இங்கு ἄγγελοι பரலோகத் தூதர்கள் என்பதையும் தெளிவாகவும் பொதுவாசகருக்குப் புரியும்படியும் தருகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: அருகிலுள்ள முந்தைய அறிவுறுத்தல்களைச் சுட்டுகிறது; அவற்றை அளவுக்கு மீறி விளக்காமல் கிரேக்கப் பன்மைச் சுட்டுப்பெயரைத் தக்கவைக்கிறது.
- source_word: φυλάξῃς
  choice: கடைப்பிடிக்க வேண்டும்
  rationale: இங்கு φυλάσσω என்பது அறிவுறுத்தல்களைக் கவனமாகக் காத்து நடைமுறைப்படுத்துவதைக் குறிக்கிறது; ‘கடைப்பிடி’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: χωρὶς προκρίματος
  choice: முன்கூட்டிய தீர்ப்பு ஏதுமின்றி
  rationale: πρόκριμα என்பது முழுமையாக ஆராய்வதற்கு முன்பே செய்யப்படும் தீர்ப்பு அல்லது முன்தீர்மானத்தைக் குறிக்கிறது; அடுத்துவரும் சார்புநிலையிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: μηδὲν ποιῶν κατὰ πρόσκλισιν
  choice: ஒருதலைச்சார்புடன் எதையும் செய்யக் கூடாது
  rationale: πρόσκλισις குறிக்கும் ஒரு பக்கம் சாய்தல் அல்லது பாரபட்சத்தைத் தெளிவான தமிழில் தருகிறது; கிரேக்கத்தின் முழுமையான தடையையும் ‘எதையும் ... கூடாது’ என்பதால் காக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இந்த முறைமையான அழைப்பில் Χριστός பட்டப்பெயரின் பொருளை இன்னும் கொண்டிருப்பதால், ஒலிபெயர்ப்பை மட்டும் பயன்படுத்தாமல் ‘மெசியா’ என்ற பொருளை வெளிப்படுத்துவது ஏற்றது.
- issue: ‘தேர்ந்தெடுக்கப்பட்ட தேவதூதர்கள்’ என்பதன் குறிப்பு
  choice: எந்தக் குழுவை அல்லது தேர்ந்தெடுப்பின் தன்மையை விளக்காமல் சொற்றொடரைத் தக்கவைத்தல்
  alternative: நல்ல தேவதூதர்கள் என்று விளக்குதல்
  rationale: கிரேக்கம் அவர்களை ‘தேர்ந்தெடுக்கப்பட்டவர்கள்’ என்று மட்டுமே அழைக்கிறது; அவர்கள் எதற்காக அல்லது எதிலிருந்து தேர்ந்தெடுக்கப்பட்டனர் என்பதை விளக்குவது மூலத்தில் இல்லாத இறையியல் முடிவைச் சேர்க்கும்.
translation_notes:
  register: முறைமையானதும் கண்ணியமானதும் ஆன நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆணையிட்டுக் கூறுகிறேன்’ வசனத்தின் தீவிரத்தைக் காக்கிறது; ‘முன்கூட்டிய தீர்ப்பு’ மற்றும் ‘ஒருதலைச்சார்பு’ ஆகியவை கிரேக்கத்தில் உள்ள தொடர்புடைய ஆனால் வேறுபட்ட இரண்டு கருத்துகளாகத் தனித்தனியே வைக்கப்பட்டுள்ளன.
