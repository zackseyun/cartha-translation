base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: ta
  text: இரண்டு அல்லது மூன்று சாட்சிகளின் ஆதாரத்தின் பேரில் அல்லாமல், ஒரு மூப்பருக்கு எதிரான குற்றச்சாட்டை ஏற்றுக்கொள்ளாதே.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மூப்பர்’ என்பதற்குப் பதிலாக, πρεσβυτέρου வயதைக் குறிக்கும் பொருளில் கொள்ளப்பட்டால், ‘வயதில் மூத்த ஒருவர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: 'ஒரு காரியம் ‘இரண்டு அல்லது மூன்று சாட்சிகளால்’ நிலைநாட்டப்பட வேண்டும் என்ற பழைய ஏற்பாட்டுச் சட்டக் கொள்கையை இச்சொற்றொடர் பிரதிபலிக்கிறது (காண்க: உபாகமம் 19:15).'
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: ஒரு மூப்பருக்கு எதிரான
  rationale: πρεσβύτερος வயதில் மூத்தவரையோ திருச்சபைத் தலைவரான மூப்பரையோ குறிக்கலாம். உடனடிச் சூழல் மூப்பர்களைப் பற்றிய வழிநடத்தலும் ஒழுங்கு நடவடிக்கையும் என்பதால், பதவிசார் பொருளில் ‘மூப்பர்’ எனத் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: κατηγορίαν
  choice: குற்றச்சாட்டை
  rationale: இச்சொல் முறையான குற்றச்சாட்டு அல்லது வழக்குச் சாட்டைக் குறிக்கிறது. ‘குற்றச்சாட்டு’ என்பது அதன் நீதிமுறைத் தன்மையை இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μὴ παραδέχου
  choice: ஏற்றுக்கொள்ளாதே
  rationale: குற்றச்சாட்டை விசாரணைக்காக ஏற்றுக்கொள்வதையோ பரிசீலனைக்கு எடுத்துக்கொள்வதையோ தடைசெய்யும் நிகழ்கால கட்டளையின் பொருளை இது இயல்பாகத் தருகிறது; குற்றச்சாட்டு உண்மை எனத் தீர்ப்பளிப்பதை மட்டும் இது குறிக்கவில்லை.
- source_word: ἐκτὸς εἰ μὴ
  choice: இருந்தாலன்றி
  rationale: விதிவிலக்கை அறிமுகப்படுத்தும் கிரேக்க மரபுத்தொடரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: இரண்டு அல்லது மூன்று சாட்சிகளின் அடிப்படையில்
  rationale: ἐπί என்பதன் சான்றாதார வலிமையையும் உபாகமச் சட்ட மொழியின் எதிரொலியையும் காக்கிறது. சாட்சிகளின் எண்ணிக்கை மட்டும் அல்ல, அவர்களின் சாட்சியமே குற்றச்சாட்டை ஏற்கும் ஆதாரம் என்பதையும் தெரிவிக்கிறது.
theological_decisions:
- issue: திருச்சபைச் சூழலில் πρεσβυτέρου என்பதன் பொருள்
  choice: திருச்சபைத் தலைவரான ‘மூப்பர்’
  alternative: வயதில் மூத்த ஆண்
  rationale: 1 தீமோத்தேயு 5-ன் உடனடிச் சூழலும் மேய்ப்புக் கடிதங்களில் வரும் பயன்பாடும் பதவிசார் பொருளையே அதிகம் ஆதரிக்கின்றன. இருப்பினும் வயதுசார் பொருள் மொழியியல் ரீதியில் சாத்தியமானதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: இரண்டு அல்லது மூன்று சாட்சிகள் பற்றிய நிபந்தனையின் தன்மை
  choice: குற்றச்சாட்டை ஏற்றுப் பரிசீலிப்பதற்கான சான்றாதார நிபந்தனை
  alternative: குற்றச்சாட்டு உண்மையென இறுதியாகத் தீர்மானிப்பதற்கான நிபந்தனை
  rationale: παραδέχου என்பது இங்கு குற்றச்சாட்டை ஏற்றுக்கொள்வது அல்லது விசாரணைக்கு எடுத்துக்கொள்வதைச் சுட்டுகிறது. ஆகவே வசனம் இறுதித் தீர்ப்பை விட நடைமுறை நுழைவாயிலை முதன்மையாகக் குறிப்பிடும் வகையில் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாயும் நீதிமுறைத் தொனியை இழக்காததாயும் வடிவமைக்கப்பட்டது. ‘மூப்பர்’ என்பது தமிழ் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற பதவிசார் சொல். அடிக்குறிப்பு குறிகள் முதன்மை உரையில் வரிசையாக [a][b] என இடப்பட்டுள்ளன.
