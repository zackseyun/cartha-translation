id: 1TI.5.18
reference: 1 Timothy 5:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Βοῦν ἀλοῶντα οὐ φιμώσεις, καί· Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: ta
  text: 'ஏனெனில், வேதவாக்கியம் சொல்கிறது: “போரடிக்கிற மாட்டின் வாயைக் கட்டாதே”[a] என்றும், “வேலை செய்கிறவர் தமது கூலியைப் பெறத் தகுதியுள்ளவர்”[b] என்றும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தானியத்தை மிதித்துப் பிரிக்கிற மாட்டின் வாயைக் கட்டாதே.” கிரேக்கப் பெயரெச்சம் போரடிக்கும் பணியில் ஈடுபட்டுள்ள மாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வேலை செய்கிறவர் தமது ஊதியத்தைப் பெறத் தகுதியுள்ளவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: ஏனெனில், வேதவாக்கியம் சொல்கிறது
  rationale: γάρ முந்தைய வசனத்துடனான விளக்கத் தொடர்பைச் சுட்டுவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது. ἡ γραφή என்பது வெறும் எழுத்தை அல்ல, அதிகாரமுள்ள புனித எழுத்தைச் சுட்டுவதால் ‘வேதவாக்கியம்’ எனத் தரப்பட்டது; நிகழ்கால λέγει நிலைத்த சாட்சியை இயல்பாக வெளிப்படுத்த ‘சொல்கிறது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: Βοῦν
  choice: மாட்டின்
  rationale: βοῦς இங்கு தானியத்தைப் போரடிக்கப் பயன்படுத்தப்படும் மாட்டை பொதுவாகக் குறிக்கிறது. தமிழ் மேற்கோளின் இயல்பான வேற்றுமை அமைப்புக்கேற்ப ‘மாட்டின்’ எனத் தரப்பட்டது.
- source_word: ἀλοῶντα
  choice: போரடிக்கிற
  rationale: இந்த நிகழ்காலப் பெயரெச்சம் தானியக் கதிர்களிலிருந்து மணிகளைப் பிரிக்கும் பணியில் ஈடுபட்டிருக்கும் மாட்டைக் குறிக்கிறது. ‘போரடிக்கிற’ என்பது அந்தப் பழங்கால வேளாண் செயலைச் சுருக்கமாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: οὐ φιμώσεις
  choice: வாயைக் கட்டாதே
  rationale: φιμόω என்பதன் நேரடிப் பொருள் வாயை மூடுதல் அல்லது முகவாய்க்கட்டு போடுதல். எதிர்காலக் கூறு இங்கு தடைக் கட்டளையாக இருப்பதால், தமிழில் இயல்பான வேதக் கட்டளை நடையில் ‘வாயைக் கட்டாதே’ எனத் தரப்பட்டது.
- source_word: καί
  choice: என்றும் ... என்றும்
  rationale: καί இரண்டு மேற்கோள்களையும் இணைக்கிறது. தமிழில் இரண்டும் ‘வேதவாக்கியம் சொல்கிறது’ என்பதன் கீழ் வருவதைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘என்றும் ... என்றும்’ என்ற இணை அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: வேலை செய்கிறவர் ... தகுதியுள்ளவர்
  rationale: ἐργάτης வேலை செய்பவர் அல்லது உழைப்பவர் என்பதைக் குறிக்கிறது. ‘வேலை செய்கிறவர்’ என்பது இன்றைய பொதுத் தமிழில் தெளிவானது; ἄξιος என்பதன் தகுதி அல்லது உரிமை சார்ந்த பொருளை ‘தகுதியுள்ளவர்’ காக்கிறது.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: தமது கூலியைப் பெற
  rationale: μισθός இங்கு வேலைக்கான ஊதியம் என்பதால் ‘கூலி’ எனத் தரப்பட்டது. αὐτοῦ ஒருமை வடிவை ‘தமது’ காக்கிறது; தமிழில் ‘கூலிக்குத் தகுதியுள்ளவர்’ என்பதைவிட ‘கூலியைப் பெறத் தகுதியுள்ளவர்’ இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: γραφή என்ற அறிமுகத்தின் கீழ் இரு மேற்கோள்களும் வருகிறதா
  choice: இரண்டு மேற்கோள்களையும் ‘வேதவாக்கியம் சொல்கிறது’ என்ற ஒரே அறிமுகத்தின் கீழ் நேரடியாக மொழிபெயர்த்தல்
  alternative: முதல் மேற்கோளை மட்டும் வேதவாக்கியமாகவும் இரண்டாவதை பழமொழி அல்லது ஆண்டவரின் கூற்றாகவும் தனியே கருதுதல்
  rationale: கிரேக்க வாக்கிய அமைப்பு இரண்டு மேற்கோள்களையும் ஒரே அறிமுகத்துடன் இணைக்கிறது. இதன் திருமுறை சார்ந்த விரிவான விளைவுகளை மொழிபெயர்ப்பில் முடிவுசெய்யாமல், பவுலின் சொற்றொடர் அமைப்பு காக்கப்பட்டது.
- issue: αὐτοῦ என்பதன் ஒருமை வடிவம்
  choice: தமது கூலி
  alternative: அவர்களுடைய கூலி
  rationale: மூலத்தில் ஒருமை வடிவம் உள்ளது. தமிழ் மரியாதை ஒருமையான ‘தமது’ அதைக் காக்கிறது; பொதுப்பொருளை பன்மையாக்கி மூல இலக்கணத்தைத் தட்டையாக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதநடை பயன்படுத்தப்பட்டுள்ளது. ‘போரடிக்கிற’ என்ற வேளாண் சொல் மூலச் செயலைத் துல்லியமாகக் காக்கிறது; அதை விளக்கும் அடிக்குறிப்பும் சேர்க்கப்பட்டுள்ளது. மேற்கோள்களின் சட்ட/ஞானவாக்கியத் தொனி சுருக்கமாகப் பாதுகாக்கப்பட்டுள்ளது.
