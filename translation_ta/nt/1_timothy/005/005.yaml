source:
  edition: SBLGNT
  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: ta
  text: ஆனால், உண்மையிலேயே விதவையாக இருந்து தனித்து விடப்பட்டவள்[a][b], கடவுள்மேல் தன் நம்பிக்கையை வைத்திருக்கிறாள்[c]; இரவும் பகலும் வேண்டுதல்களிலும் ஜெபங்களிலும் நிலைத்திருக்கிறாள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உண்மையிலேயே விதவை’ என்பது கணவனை இழந்தவர் என்ற சமூகப் பெயரை மட்டும் அல்லாமல், இந்தப் பகுதியின் சூழலில் உண்மையாக ஆதரவற்ற விதவையைக் குறிக்கிறது.
    reason: contextual_clarification
  - marker: b
    text: அல்லது ‘தனியாக இருப்பவள்.’ கிரேக்கச் சொல், ஆதரவளிக்கும் குடும்பத்தினர் இல்லாமல் தனித்து விடப்பட்ட நிலையைக் குறிப்பாக உணர்த்தலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘கடவுளில் நம்பிக்கை கொண்டிருக்கிறாள்.’ கிரேக்க நிறைவுக்காலம், நிலைபெற்று தொடர்ந்து விளைவளிக்கும் நம்பிக்கையை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘வேண்டுதல்கள்’ என்பது குறிப்பிட்ட தேவைகளுக்கான மன்றாட்டுகளையும், ‘ஜெபங்கள்’ என்பது ஜெபத்தைப் பொதுவாகவும் குறிக்கிறது; கிரேக்கத்தில் உள்ள இரண்டு சொற்களும் இங்கு தனித்தனியாகக் காக்கப்பட்டுள்ளன.
    reason: lexical_clarification
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் குடும்ப ஆதரவுள்ள விதவையைப் பற்றிச் சொல்லப்பட்டதற்கு மாறாக, இங்கு உண்மையாக ஆதரவற்ற விதவை விவரிக்கப்படுகிறாள். எனவே மிதமான எதிர்மறைத் தொடர்பைக் காட்டும் ‘ஆனால்’ பொருத்தமானது.
- source_word: ὄντως χήρα
  choice: உண்மையிலேயே விதவையாக இருப்பவள்
  rationale: ὄντως என்பது வெறும் சமூகப் பெயரை அல்லாமல், உடனுள்ள சூழலில் வரையறுக்கப்படும் உண்மையான அல்லது தகுதிபெற்ற விதவை நிலையைக் குறிக்கிறது; அதற்கு மேலான நிறுவனம் சார்ந்த பொருளை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- source_word: μεμονωμένη
  choice: தனியாக விடப்பட்டிருப்பவள்
  rationale: நிறைவுற்ற வினையெச்சம், ஒருவர் தனியாக விடப்பட்டதால் தொடரும் நிலையைக் காட்டுகிறது. குடும்ப ஆதரவின்றி இருப்பதன் சூழல்சார் நுணுக்கத்தையும் இந்தத் தேர்வு இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: கடவுள்மேல் தன் நம்பிக்கையை வைத்திருக்கிறாள்
  rationale: கிரேக்க நிறைவுக்காலம், முன்பு நிலைநிறுத்தப்பட்டு இப்போதும் தொடரும் நம்பிக்கையைச் சுட்டலாம். ‘வைத்திருக்கிறாள்’ அந்தத் தொடரும் விளைவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: προσμένει
  choice: தொடர்ந்து செய்கிறாள்
  rationale: நிகழ்கால வினை, இந்தச் செயலில் தொடர்ந்து நிலைத்திருப்பதை உணர்த்துகிறது. தமிழில் வேண்டுதல்களையும் ஜெபங்களையும் ‘தொடர்ந்து செய்கிறாள்’ என்பது இயல்பான நடை.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: வேண்டுதல்களையும் ஜெபங்களையும்
  rationale: δέησις என்பதிலுள்ள குறிப்பிட்ட தேவைக்கான மன்றாட்டையும், προσευχή என்பதிலுள்ள பொதுவான ஜெபத்தையும் வேறு சொற்களால் காக்கிறது.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: இரவும் பகலும்
  rationale: கிரேக்கச் சொல் வரிசையையும் தொடர்ச்சியான பழக்கத்தை உணர்த்தும் வழக்குச் சொல்லையும் காக்கிறது.
theological_decisions:
- issue: ‘உண்மையான விதவை’ என்ற characterization
  choice: சபையின் பராமரிப்புக்கான சூழலில் உண்மையாக ஆதரவற்ற விதவையை, கடவுள்மேல் நம்பிக்கை வைத்து இடைவிடாது ஜெபிப்பவளாக வசனம் விவரிக்கிறது.
  alternative: இது எந்தத் தகுதி வேறுபாடுமின்றி எல்லா விதவைகளையும் பொதுவாக விவரிக்கிறது.
  rationale: ὄντως என்பதும் 1 தீமோத்தேயு 5-ன் உடனடி சூழலும் ஒரு குறிப்பிட்ட வகையினரை வேறுபடுத்துகின்றன. அதே நேரத்தில், மொழிபெயர்ப்பு எந்தச் சபைப் பிரிவின் நிர்வாக விதியையும் சேர்க்கவில்லை.
- issue: கடவுள்மேலுள்ள நம்பிக்கையின் காலநிலை
  choice: நிலைநிறுத்தப்பட்டு இன்றும் தொடரும் நம்பிக்கை
  alternative: கடந்த காலத்தில் ஒருமுறை நம்பினாள்
  rationale: ἤλπικεν என்ற நிறைவுக்கால வடிவம், நிகழ்காலத் தாக்கமுள்ள நிலையான நம்பிக்கையை இயல்பாக உணர்த்துகிறது; குறிப்பில் நேரடியான மாற்றும் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. ‘கடவுள்’, ‘நம்பிக்கை’, ‘வேண்டுதல்’, ‘ஜெபம்’ போன்ற பொதுவாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் இலக்கண நுணுக்கங்கள் தமிழில் மிகையாகக் கடினப்படுத்தப்படாமல், அடிக்குறிப்புகளில் உண்மையான மாற்றுவாசிப்புகள் பாதுகாக்கப்பட்டுள்ளன.
