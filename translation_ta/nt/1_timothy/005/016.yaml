id: 1TI.5.16
reference: 1 Timothy 5:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: ta
  text: விசுவாசியான ஒரு பெண்ணின் பொறுப்பில் விதவைகள் இருந்தால்[a], அவள் அவர்களுக்கு தேவையான உதவியை அளிக்கட்டும். திருச்சபைக்குப் பாரம் ஏற்படாதிருக்கட்டும்; அதனால் அது உண்மையிலேயே விதவைகளாக இருப்பவர்களுக்கு தேவையான உதவியை அளிக்க முடியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “விசுவாசியான ஆணிடமாவது பெண்ணிடமாவது விதவைகள் இருந்தால்” அல்லது “விசுவாசி ஒருவரிடம் விதவைகள் இருந்தால்” என்று உள்ளது; இதனால் இந்த அறிவுரை குறிப்பாக ஒரு பெண்ணை மட்டும் குறிப்பிடாமல் விரிவுபடுத்தப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: விசுவாசியான ஒரு பெண்
  rationale: πιστή பெண்பால் ஒருமையில் இருப்பதால், இங்குள்ள எழுவாய் பொதுவான ‘விசுவாசி’ அல்ல, குறிப்பாக ஒரு விசுவாசியான பெண். ‘விசுவாசமுள்ள’ என்றும் பொருள் கொள்ள இயன்றாலும், இச்சூழலில் கிறிஸ்தவ அடையாளத்தைக் குறிக்கும் ‘விசுவாசியான’ இயல்பானது.
- source_word: χήρας
  choice: விதவைகள்
  rationale: χήρα என்பதன் பன்மை; இவ்வதிகாரத்தின் சூழலில் பொருளாதார ஆதரவு தேவைப்படக்கூடிய விதவைகளைக் குறிக்கிறது.
- source_word: ἐπαρκείτω / ἐπαρκέσῃ
  choice: வேண்டிய உதவியை வழங்கட்டும் / வேண்டிய உதவியை வழங்க முடியும்
  rationale: ἐπαρκέω போதுமான நடைமுறை ஆதரவை அளிப்பதைக் குறிக்கிறது. இரண்டு இடங்களிலும் ஒரே கருத்தைத் தக்கவைத்து, தமிழ் வாக்கிய அமைப்புக்கேற்ப வடிவம் மாற்றப்பட்டுள்ளது.
- source_word: βαρείσθω
  choice: பாரம் சுமக்க வேண்டாதபடி இருக்கட்டும்
  rationale: சபையின் மீது ஆதரவளிக்கும் கடமை பாரமாகச் சுமத்தப்படாதிருக்க வேண்டும் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡ ἐκκλησία
  choice: திருச்சபை
  rationale: இங்கு கிறிஸ்தவ விசுவாசிகளின் உள்ளூர் சமூகத்தைக் குறிக்கிறது; நவீன நிலையான தமிழில் ‘திருச்சபை’ தெளிவான வழக்குச் சொல்.
- source_word: ταῖς ὄντως χήραις
  choice: உண்மையாகவே விதவைகளாய் இருப்பவர்கள்
  rationale: ὄντως தரும் வலியுறுத்தலைப் பாதுகாக்கிறது. வெறும் திருமணநிலையை மட்டுமல்லாமல், முன்னைய சூழலில் விளக்கப்பட்டபடி ஆதரவின்றி உண்மையில் விதவையாகத் தனித்திருப்பவர்களைக் குறிக்கும் சொல்லாட்சியின் திறந்த தன்மையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: தொடக்கக் கூறின் எழுவாய்ப் பாலினம்
  choice: 'குறிப்பாகப் பெண்பால்: ‘விசுவாசியான ஒரு பெண்’'
  alternative: ‘விசுவாசி எவரிடமாவது’ அல்லது ‘விசுவாசியான ஆணிடமாவது பெண்ணிடமாவது’
  rationale: கொடுக்கப்பட்ட SBLGNT வாசகம் τις πιστή என்று பெண்பால் ஒருமையில் உள்ளது. ஆகவே முதன்மை உரை பாலினத்தைப் பொதுமைப்படுத்தாமல் பெண்ணையே குறிப்பிடுகிறது; விரிவான மாற்று வாசகங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: ‘உண்மையான விதவைகள்’ என்ற வகைப்பாடு
  choice: ‘உண்மையாகவே விதவைகளாய் இருப்பவர்கள்’ என்ற வலியுறுத்தலை அப்படியே தக்கவைத்தல்
  alternative: ‘உதவி தேவைப்படும் விதவைகள்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: சூழல் ஆதரவின்றித் தனித்திருப்பவர்களை நோக்கினாலும், மூலத்தின் சுருக்கமான வகைப்பாட்டை முழுமையாக விளக்கி முடிவுசெய்யாமல் அதன் இறையியல் மற்றும் சமூகத் திணறலைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டிய உதவியை வழங்குதல்’ என்பது பொருளாதார மற்றும் நடைமுறை ஆதரவு ஆகிய இரண்டையும் உள்ளடக்கும். முதன்மை உரையில் [a] குறியீடு உரிய இடத்தில் சேர்க்கப்பட்டுள்ளது.
