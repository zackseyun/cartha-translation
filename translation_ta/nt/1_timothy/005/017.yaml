source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: ta
  text: நன்றாகத் தலைமை தாங்கும் மூப்பர்கள் இரட்டிப்பு மரியாதைக்குத் தகுதியானவர்களாகக் கருதப்படட்டும்[a]; குறிப்பாக[b], வார்த்தையிலும் போதனையிலும் கடுமையாக உழைப்பவர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரட்டிப்பு மரியாதை’ என்பது மரியாதையையும் பொருளாதார ஆதரவையும் உள்ளடக்கலாம்; குறிப்பாக அடுத்த வசனம் பொருளாதார ஆதரவைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘குறிப்பாக’ என்பதைச் சிலர் ‘அதாவது’ என்றும் புரிந்துகொள்கிறார்கள்; அப்படியானால் இங்கு குறிப்பிடப்படும் மூப்பர்கள் வார்த்தையிலும் போதனையிலும் உழைப்பவர்களே என்று அது அடையாளப்படுத்தும்.
    reason: alternative_reading
  - marker: c
    text: ‘வார்த்தையிலும் போதனையிலும்’ என்பது பிரசங்கம் மற்றும் போதனை போன்ற வாய்மொழி ஊழியத்தைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: மூப்பர்கள்
  rationale: இங்கு வயதில் மூத்த ஆண்களை மட்டும் அல்லாமல், திருச்சபையில் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது. ‘மூப்பர்கள்’ என்பது பிற்காலத் திருச்சபைப் பதவி அமைப்பைத் தேவையின்றி இறக்குமதி செய்யாமல் அந்தப் பொருளைத் தருகிறது.
- source_word: καλῶς προεστῶτες
  choice: நன்றாகத் தலைமை தாங்கும்
  rationale: προΐστημι இச்சூழலில் தலைமை அல்லது மேற்பார்வைப் பொறுப்பைச் செயல்படுத்துவதைக் குறிக்கிறது. ‘தலைமை தாங்கும்’ என்பது அதிகாரத்தின் உண்மையைத் தக்கவைத்தபடி இயல்பான நவீனத் தமிழாக உள்ளது.
- source_word: διπλῆς τιμῆς
  choice: இரட்டிப்பு மதிப்பு
  rationale: இந்தச் சொற்றொடர் மரியாதையையும் பொருளாதார ஆதரவையும் உள்ளடக்கக்கூடியது. இரண்டில் ஒன்றாகக் குறுக்காமல் கிரேக்கத்தின் பொருள் விரிவைத் தக்கவைக்கிறது.
- source_word: ἀξιούσθωσαν
  choice: தகுதியுள்ளவர்களாகக் கருதப்படட்டும்
  rationale: சமூகம் அவர்களுடைய தகுதியை ஏற்று மதிக்க வேண்டும் என்ற செயல்பாட்டு இறைவேண்டல் பொருளுடைய கட்டளையைத் தமிழில் பிரதிபலிக்கிறது.
- source_word: μάλιστα
  choice: குறிப்பாக
  rationale: முழுக் குழுவினுள் சிறப்பு வலியுறுத்தல் பெறும் ஒரு பகுதியை இயல்பாகச் சுட்டுகிறது; ‘அதாவது’ என்று மொழிபெயர்த்து அடையாளப் பொருளை முடிவுசெய்யவில்லை.
- source_word: κοπιῶντες
  choice: கடுமையாக உழைப்பவர்கள்
  rationale: κοπιάω சிரமத்தோடும் தீவிர முயற்சியோடும் உழைப்பதைக் குறிக்கிறது. ‘கடுமையாக உழைப்பவர்கள்’ என்பது அந்த உழைப்பின் தீவிரத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν λόγῳ
  choice: இறைவார்த்தையை அறிவிப்பதில்
  rationale: இங்கு λόγος பெரும்பாலும் வாய்மொழி ஊழியத்தை, குறிப்பாக அறிவித்தல் அல்லது பிரசங்கித்தலைக் குறிக்கிறது. தமிழில் ‘வார்த்தையில்’ என்பது தெளிவற்றதாக இருப்பதால், சூழலுக்கேற்ற இயல்பான விளக்கமொழி பயன்படுத்தப்படுகிறது; ‘இறைவார்த்தை’ என்பது ஊழியத்தின் உள்ளடக்கத்தைச் சுட்டுகிறது.
- source_word: διδασκαλίᾳ
  choice: கற்பிப்பதில்
  rationale: கற்பித்தல் பணியை எளிய, தற்போதைய தமிழில் நேரடியாகக் குறிக்கிறது; ‘கோட்பாடு’ போன்ற தேவையற்ற தொழில்நுட்ப நயத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: திருச்சபைத் தலைவர்களுக்குரிய ‘இரட்டிப்பு மதிப்பு’ என்பதன் பொருள்
  choice: மரியாதை மட்டும் அல்லது பொருளாதார ஆதரவு மட்டும் என்று குறுக்காமல் ‘இரட்டிப்பு மதிப்பு’ என்ற விரிவான சொற்றொடரைத் தக்கவைத்தல்
  alternative: இரட்டிப்பு மரியாதை; இரட்டிப்பு ஊதியம்; பொருளாதார ஆதரவையும் உள்ளடக்கும் மதிப்பு
  rationale: அடுத்த வசனம் பொருளாதார ஆதரவை வலுவாகச் சுட்டினாலும், τιμή மதிப்பையும் மரியாதையையும் குறிக்க முடியும். விரிவான மொழிபெயர்ப்பு இரு கூறுகளுக்கும் இடமளித்து, குறிப்பிட்ட திருச்சபை நிர்வாக அல்லது ஊதியக் கோட்பாட்டைத் திணிப்பதைத் தவிர்க்கிறது.
- issue: μάλιστα என்பதன் வலிமை
  choice: ‘குறிப்பாக’ என்று மொழிபெயர்த்தல்
  alternative: ‘அதாவது’ என்று மொழிபெயர்த்து, இங்கு குறிப்பிடப்படும் மூப்பர்கள் அனைவரையும் வார்த்தை மற்றும் போதனையில் உழைப்பவர்களாக அடையாளப்படுத்துதல்
  rationale: ‘குறிப்பாக’ என்பது மூப்பர்கள் பொதுவாகக் குறிப்பிடப்பட்ட பின்னர் ஒரு பகுதியினருக்கு அளிக்கப்படும் சிறப்பு வலியுறுத்தலைத் தக்கவைக்கிறது; எல்லா மூப்பர்களும் கற்பிக்கிறார்களா அல்லது சிலர் அதில் சிறப்பாக ஈடுபடுகிறார்களா என்ற விளக்கக் கேள்வியை மொழிபெயர்ப்பிலேயே முடிவுசெய்யாது.
- issue: ἐν λόγῳ என்பதன் ஊழியச் சார்ந்த பொருள்
  choice: ‘இறைவார்த்தையை அறிவிப்பதில்’ என்று இயல்பாகத் தெளிவுபடுத்துதல்
  alternative: ‘வார்த்தையில்’; ‘பிரசங்கிப்பதில்’; ‘பேசுவதில்’
  rationale: இச்சூழலில் இது சாதாரணப் பேச்சைக் காட்டிலும் வார்த்தை சார்ந்த ஊழியத்தைக் குறிக்கிறது. ‘அறிவித்தல்’ என்பது ‘பிரசங்கித்தல்’ என்பதை விடச் சற்றுப் பரந்ததாக இருந்து, வாய்மொழி ஊழியத்தின் பொருள் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆளுகிற’ என்பதற்குப் பதில் ‘தலைமை தாங்கும்’ என்றும், தெளிவற்ற ‘வார்த்தையில்’ என்பதற்குப் பதில் சூழல்சார்ந்த ‘இறைவார்த்தையை அறிவிப்பதில்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தில் உள்ள ‘இரட்டிப்பு மதிப்பு’ மற்றும் μάλιστα சார்ந்த விளக்கத் திறந்தநிலை முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் பாதுகாக்கப்பட்டுள்ளது.
