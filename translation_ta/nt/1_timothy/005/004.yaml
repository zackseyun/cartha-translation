id: 1TI.5.4
reference: 1 Timothy 5:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: ta
  text: ஆனால் ஒரு விதவைக்குப் பிள்ளைகளோ பேரப்பிள்ளைகளோ[a] இருந்தால், அவர்கள் முதலில் தங்கள் சொந்தக் குடும்பத்தாரைப் பராமரிப்பதன் மூலம் இறைப்பற்றைக் காட்டவும்[b], தங்கள் முன்னோருக்குக் கைம்மாறு செய்யவும்[c] கற்றுக்கொள்ளட்டும். ஏனெனில் இது கடவுளுக்கு முன்பாக ஏற்றுக்கொள்ளத்தக்கது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிள்ளைகளோ வழித்தோன்றல்களோ.’ ἔκγονα என்ற கிரேக்கச் சொல் ‘பேரப்பிள்ளைகள்’ என்பதைவிடப் பரந்த பொருளைக் கொண்டிருக்கலாம்; இச்சூழலில் அடுத்த தலைமுறை குடும்பத்தினரைக் குறிப்பது அதிகம் சாத்தியம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தங்கள் சொந்தக் குடும்பத்தாரிடம் பக்தியைக் கடைப்பிடிக்கவும்.’ கிரேக்கச் சொற்றொடர் குடும்பப் பராமரிப்பை இறைப்பற்றுடன் இணைக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘முன்னோர்’ என்பதற்கான கிரேக்கச் சொல் ‘பெற்றோர்,’ ‘மூதாதையர்,’ அல்லது பொதுவாக ‘முந்தைய தலைமுறையினர்’ என்றும் மொழிபெயர்க்கப்படலாம். இங்கு பெற்றோர் அல்லது பாட்டன்-பாட்டி போன்ற குடும்பத்தின் முந்தைய தலைமுறையினர் கருத்தில் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: விதவை
  rationale: கணவனை இழந்த பெண்ணைக் குறிக்கும் வழக்கமான, சூழலுக்கு ஏற்ற சொல்.
- source_word: τέκνα ἢ ἔκγονα
  choice: பிள்ளைகளோ பேரப்பிள்ளைகளோ
  rationale: τέκνα என்பது பிள்ளைகளையும், ἔκγονα என்பது பரந்த பொருளில் வழித்தோன்றல்களையும் குறிக்கலாம்; இந்தக் குடும்பப் பராமரிப்புச் சூழலில் ‘பேரப்பிள்ளைகள்’ இயல்பான முதன்மைப் பொருள். பரந்த சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: μανθανέτωσαν
  choice: அவர்கள் ... கற்றுக்கொள்ளட்டும்
  rationale: மூன்றாம் நபர் பன்மை நிகழ்காலக் கட்டளை வடிவத்தின் அறிவுறுத்தல் வலிமையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது; ‘அவர்கள்’ என்பது அருகிலுள்ள பிள்ளைகள் அல்லது பேரப்பிள்ளைகளைக் குறிக்கிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: குடும்பக் கடமைக்கு அளிக்கப்படும் முன்னுரிமையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: τὸν ἴδιον οἶκον
  choice: தங்கள் சொந்தக் குடும்பத்தினரிடம்
  rationale: οἶκος இங்கு கட்டடத்தைவிட குடும்பம் அல்லது வீட்டாரைக் குறிக்கிறது. εὐσεβεῖν உடன் வரும் செயற்பாட்டு உறவை இயல்பான தமிழில் காட்ட ‘குடும்பத்தினரிடம்’ என வழங்கப்பட்டது.
- source_word: εὐσεβεῖν
  choice: இறைப்பற்றுடன் நடந்துகொள்ள
  rationale: சொல்லின் பக்தி/இறைநெறி சார்ந்த பொருளைத் தக்கவைத்தபடி, அது குடும்பப் பராமரிப்பில் செயலாக வெளிப்படுவதை உணர்த்துகிறது.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: கைம்மாறு செய்ய
  rationale: முன்பு பெற்ற பராமரிப்புக்குப் பதிலாக உரிய நன்மையைத் திருப்பிச் செய்வதைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: τοῖς προγόνοις
  choice: தங்களை வளர்த்த முந்தைய தலைமுறையினருக்கு
  rationale: πρόγονοι என்பதன் ‘முன்னோர்/முந்தைய தலைமுறையினர்’ என்ற பரப்பைத் தக்கவைத்து, இங்கு உயிருடன் இருந்து பராமரிப்பு பெறும் பெற்றோர் அல்லது பாட்டன்-பாட்டி போன்றோரே கருத்தில் உள்ளனர் என்பதைச் சூழலுக்கேற்ப தெளிவாக்குகிறது; மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ἀπόδεκτον
  choice: ஏற்றுக்கொள்ளத்தக்கது
  rationale: கடவுளால் சாதகமாக ஏற்றுக்கொள்ளப்படும் நடத்தை என்ற பொருளுக்கு நெருக்கமான தமிழ் இணை.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: கடவுளின் முன்னிலையிலும் மதிப்பீட்டிலும் என்ற கிரேக்க மரபுத்தொடரின் சுருக்கமான, தெளிவான வடிவம்.
theological_decisions:
- issue: μανθανέτωσαν என்ற பன்மைக் கட்டளையின் எழுவாய்
  choice: விதவையின் பிள்ளைகள் அல்லது பேரப்பிள்ளைகளுக்கே கட்டளை வழங்கப்படுகிறது.
  alternative: எண்ணில் மாற்றம் அல்லது மறைமுக எழுவாயுடன் விதவைகளுக்கே கட்டளை வழங்கப்படுகிறது.
  rationale: அருகிலுள்ள பன்மைப் பெயர்கள் τέκνα ἢ ἔκγονα என்பவையே இயல்பான எழுவாய். குடும்பத்தினர் விதவையைப் பராமரித்து முந்தைய தலைமுறைக்குக் கைம்மாறு செய்ய வேண்டும் என்ற தொடர்ச்சிக்கும் இது பொருந்துகிறது.
- issue: εὐσεβεῖν என்பதன் குடும்பப் பராமரிப்புடனான உறவு
  choice: குடும்பத்தைப் பராமரிப்பது இறைப்பற்றின் செயல்முறை வெளிப்பாடாகக் கூறப்படுகிறது.
  alternative: இச்சொல் சமய நுணுக்கமின்றி குடும்பக் கடமையை நிறைவேற்றுவதை மட்டும் குறிக்கிறது.
  rationale: εὐσεβεῖν தெளிவான பக்தி/இறைப்பற்று நுணுக்கமுடையது; இந்த நடத்தை கடவுளுக்கு முன்பாக ஏற்றது என்ற காரணவாக்கியமும் அந்த நுணுக்கத்தை உறுதிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘இறைப்பற்று’ மூலம் εὐσεβεῖν என்பதன் சமய நுணுக்கம் பாதுகாக்கப்படுகிறது; ‘கைம்மாறு செய்ய’ என்பது குடும்பப் பராமரிப்பின் நடைமுறைத் தன்மையை இயல்பாகத் தெரிவிக்கிறது. எல்லா அடிக்குறிப்பு குறிப்பான்களும் உரையில் அவற்றின் தொடர்புடைய இடங்களில் இடம்பெற்றுள்ளன.
