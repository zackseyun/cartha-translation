id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: ta
  text: ஆனால், ஒருவர் தமக்குரியவர்களை[a]—குறிப்பாகத் தமது வீட்டாரை—பராமரிக்காவிட்டால், அவர் விசுவாசத்தை மறுதலித்திருக்கிறார்[b]; விசுவாசிக்காத ஒருவரைவிடவும் மோசமானவராக இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தமது சொந்த மக்களை.’ இந்தச் சொற்றொடர் ஒரே வீட்டில் வாழ்பவர்களை மட்டும் அல்லாமல், ஒருவருடைய உறவினர் மற்றும் அவரைச் சார்ந்தோரையும் உள்ளடக்கும் பரந்த பொருளுடையது; ‘வீட்டார்’ என்பது அவர்களுள் சிறப்பான கடமை உள்ளவர்களைக் குறிப்பாகச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விசுவாசத்தைத் துறந்திருக்கிறார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: ஒருவர்
  rationale: பால் வேறுபாட்டைக் கட்டாயப்படுத்தாமல், பொதுவாக எந்த ஒருவரையும் குறிக்கும் கிரேக்கச் சொல்லின் தன்மை இயல்பான தமிழில் பாதுகாக்கப்படுகிறது.
- source_word: τῶν ἰδίων
  choice: தமக்குரியவர்களை
  rationale: ஒரே வீட்டில் வசிப்பவர்களை மட்டும் அல்லாமல், ஒருவரின் உறவினர் மற்றும் அவரைச் சார்ந்தோர் ஆகிய பரந்த வட்டத்தையும் உள்ளடக்குகிறது; அடுத்து வரும் ‘வீட்டார்’ அதற்குள் சிறப்புக் கவனம் பெறும் உட்பிரிவைக் குறிக்கிறது.
- source_word: μάλιστα
  choice: குறிப்பாக
  rationale: பரந்த ஒரு குழுவுக்குள் சிறப்பான கடமை உள்ள உட்பிரிவை வலியுறுத்துகிறது.
- source_word: οἰκείων
  choice: தமது வீட்டாரை
  rationale: ஒருவருடைய குடும்ப இல்லத்தைச் சேர்ந்தவர்களையும் அவரைச் சார்ந்து வாழ்பவர்களையும் இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: προνοεῖ
  choice: பராமரிக்காவிட்டால்
  rationale: இச்சூழலில் முன்கூட்டியே அக்கறை கொண்டு தேவையான நடைமுறை மற்றும் பொருளாதார ஆதரவை வழங்குவதைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: τὴν πίστιν
  choice: விசுவாசத்தை
  rationale: இங்கு பொதுவான நம்பிக்கையைவிட ஒருவர் அறிக்கையிடும் கிறிஸ்தவ விசுவாசமே கருத்தாக உள்ளது; கிரேக்க உரையின் இறையியல் செறிவைத் தக்கவைக்கிறது.
- source_word: ἤρνηται
  choice: மறுதலித்திருக்கிறார்
  rationale: நிறைவேறிய செயல் தற்போது நிலவும் விளைவைக் கொண்டிருப்பதை கிரேக்க நிறைவு கால வடிவுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: ἀπίστου
  choice: விசுவாசிக்காத ஒருவரைவிடவும்
  rationale: நம்பகமற்ற ஒருவரை அல்ல, விசுவாசத்திற்கு வெளியே உள்ள ஒருவரை இச்சூழலில் குறிக்கிறது.
- source_word: χείρων
  choice: மோசமானவராக
  rationale: ஒழுக்கரீதியான தீவிரமான ஒப்பீட்டை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பொதுப்பொருளுடைய ஆண்பால் ஒருமை அமைப்பு
  choice: ‘ஒருவர் … அவர்/தமது’ என்ற அனைவருக்கும் பொருந்தும் தமிழ் அமைப்பு
  alternative: ஆணை மட்டும் சுட்டும் ‘ஒரு ஆண் … அவனுடைய’ என்ற அமைப்பு
  rationale: கிரேக்க ஒருமை இலக்கண வடிவைப் பேணியபடியே, இந்த அறிவுரை ஆண்களுக்கு மட்டும் உரியது என்ற தவறான வரையறையைத் தவிர்க்கிறது.
- issue: τὴν πίστιν என்பதன் பொருள்
  choice: அறிக்கையிடப்பட்ட கிறிஸ்தவ ‘விசுவாசம்’
  alternative: தனிப்பட்ட நம்பிக்கை அல்லது பொதுவான விசுவாசத்தன்மை
  rationale: ஒருவர் தமது நடத்தையால் தாம் அறிக்கையிட்ட விசுவாசத்தை நடைமுறையில் மறுதலிப்பதே இங்கு உள்ள எதிர்மறைத் தொடர்பு; ஆயினும் மூலத்தின் சுருக்கமான இறையியல் பதற்றம் விரிவுரையால் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதாகப் புரியும், ஆனால் வேதவாக்கியத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தமக்குரியவர்கள்’ மற்றும் ‘வீட்டார்’ என்ற இரு நிலைகளுக்கிடையிலான பரந்த குழு–சிறப்பு உட்பிரிவு வேறுபாடு கோடுகளால் தெளிவாக்கப்பட்டுள்ளது; மூலத்தின் கடுமையான ஒழுக்க மற்றும் இறையியல் தீர்ப்பு மென்மையாக்கப்படவில்லை.
