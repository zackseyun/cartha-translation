source:
  edition: SBLGNT
  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: ta
  text: சிலருடைய பாவங்கள் வெளிப்படையாகத் தெரிகின்றன[a]; அவை அவர்களுக்கு முன்பாக நியாயத்தீர்ப்புக்குச் செல்கின்றன[b]. வேறு சிலருடைய பாவங்களோ அவர்களுக்குப் பின்னால் தொடர்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிலருடைய பாவங்கள் தெளிவாக அறியப்படுகின்றன.”
    reason: lexical_alternative
  - marker: b
    text: இங்கே “நியாயத்தீர்ப்பு” என்பது உடனடிச் சூழலில் நடைபெறும் மதிப்பீட்டைக் குறிக்கலாம்; எனினும், இச்சொற்றொடர் இறைவனுடைய நியாயத்தீர்ப்பு என்ற விரிவான பொருளையும் தரக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: சிலருடைய பாவங்கள்
  rationale: மரபுத்தொடரின் உடைமைப் பொருளை இயல்பான தமிழில் தருகிறது. ἄνθρωπος இங்கு பொதுவாக மனிதர்களைக் குறிப்பதால் பாலினத்தைத் தேவையின்றிக் குறிப்பிடவில்லை.
- source_word: πρόδηλοί
  choice: வெளிப்படையாக இருக்கின்றன
  rationale: பாவங்கள் மறைவாக இல்லாமல் தெளிவாக அறியப்படுகின்றன என்ற பொருளை நவீன, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: προάγουσαι
  choice: அவர்களுக்கு முன்னே செல்கின்றன
  rationale: பெண்பால் பன்மை வினையெச்சம் ‘பாவங்கள்’ என்பதோடு இயைந்து, அவை சம்பந்தப்பட்டவர்களுக்கு முன்பாகச் செல்கின்றன என்ற உருவகத்தைத் தக்கவைக்கிறது.
- source_word: εἰς κρίσιν
  choice: நியாயத்தீர்ப்புக்கு
  rationale: εἰς என்பதன் திசைநோக்கையும் κρίσις என்பதன் தீர்ப்பு/மதிப்பீடு சார்ந்த பரந்த பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: வேறு சிலருடைய பாவங்களோ அவர்களுக்குப் பின்னால் தொடர்கின்றன
  rationale: முதல் குழுவுடனான வேறுபாட்டைத் தெளிவாக்கி, பாவங்களே பின்னால் தொடர்கின்றன என்ற ஆளுருவகத்தைப் பாதுகாக்கிறது; கிரேக்கத்தில் மறைமுகமாக உள்ள நபர் தொடர்பு தமிழில் தெளிவாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: κρίσις என்பதன் வரம்பு
  choice: நியாயத்தீர்ப்பு என்று பொதுவாக மொழிபெயர்த்து, மனித மதிப்பீடா இறுதி இறைத் தீர்ப்பா என்பதை மூலவசனத்தை விடக் குறுகலாக வரையறுக்கவில்லை.
  alternative: உடனடிச் சூழலில் சபை சார்ந்த பரிசீலனை அல்லது இறுதி இறை நியாயத்தீர்ப்பு என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: முந்தைய சூழல் ஒருவரை அவசரமாக அங்கீகரிப்பதைப் பற்றியதாக இருந்தாலும், κρίσις என்ற சொல் விரிவான தீர்ப்புப் பொருளையும் ஏற்கக்கூடும். ஆகவே பொருளியல் இறுக்கத்தைத் தீர்க்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘முன்னே செல்கின்றன / பின்னால் தொடர்கின்றன’ என்ற இணை உருவகம் கிரேக்கத்தின் சொல்லோவியத்தைப் பாதுகாக்கிறது; தேவையற்ற பாலினக் குறிப்பும் சமயப்பிரிவுக்குரிய விளக்கமும் தவிர்க்கப்பட்டுள்ளன.
