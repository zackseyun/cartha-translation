base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: ta
  text: பாவம் செய்கிறவர்களை[a][b] எல்லாருக்கும் முன்பாகக் கண்டி; அதனால் மற்றவர்களும் அச்சம் கொள்ளும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாவத்தில் தொடர்ந்து நிலைத்திருப்பவர்களை’; நிகழ்காலப் பங்கேற்புவினை தொடர்ச்சியான பாவச் செயலைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: உடனடிச் சூழல் குறிப்பாகப் பாவம் செய்யும் மூப்பர்களைக் குறிக்கக்கூடும்; ஆனால் இந்த வசனம் தன்னளவில் ‘பாவம் செய்கிறவர்கள்’ என்று மட்டுமே கூறுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: பாவம் செய்துகொண்டிருப்பவர்களை
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்புவினை, பாவம் செய்யும் செயல் தொடர்வதைச் சுட்டக்கூடும். ‘பாவத்தில் தொடர்ந்து நிலைத்திருப்பவர்கள்’ என்பது சற்றுக் கூடுதல் விளக்கமாக இருப்பதால் மாற்றுவாசிப்பாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐνώπιον πάντων
  choice: எல்லாருக்கும் முன்பாக
  rationale: ‘அனைவருக்கும் முன்’ என்ற மூலமொழியின் வெளிப்படையான பொதுச் சூழலை இயல்பான நவீனத் தமிழில் காக்கிறது; ‘பகிரங்கமாக’ என்பதைக் காட்டிலும் சொற்றொடரின் வடிவத்தையும் தெளிவாகப் பேணுகிறது.
- source_word: ἔλεγχε
  choice: கண்டித்துத் திருத்து
  rationale: ἐλέγχω என்பது தவற்றை வெளிப்படுத்துதல், குற்றத்தை உணர்த்துதல், கண்டித்தல் ஆகிய பொருட்களைக் கொண்டது. இங்கே சபை ஒழுங்கு சார்ந்த சூழலில் வெறும் கண்டனத்தை அல்ல, திருத்தத்தை நோக்கிய கடிந்துரைத்தலைக் குறிக்க இந்த இணைச்சொற்றொடர் இயல்பாக உள்ளது.
- source_word: οἱ λοιποὶ
  choice: மற்றவர்கள்
  rationale: தவறு செய்பவர்களைத் தவிர மீதமுள்ள சமூகத்தினரைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: φόβον ἔχωσιν
  choice: அச்சம் கொள்வார்கள்
  rationale: ‘அச்சம் உடையவர்களாக இருப்பார்கள்’ என்ற மூலமொழி வழக்கை இயல்பான தமிழில் தருகிறது. இது வெறும் பீதியா அல்லது நல்வழிப்படுத்தும் எச்சரிக்கையுணர்வா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
theological_decisions:
- issue: குற்றஞ்செய்பவர்கள் யார் என்பதன் வரம்பு
  choice: வசனத்தில் வெளிப்படையாக இருப்பதுபோல, ‘பாவம் செய்துகொண்டிருப்பவர்கள்’ என்று பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: முந்தைய வசனத்தின் உடனடிச் சூழலைக் கொண்டு, குறிப்பாகப் பாவம் செய்யும் மூப்பர்களையே இது குறிக்கிறது என்று புரிந்துகொள்ளலாம்.
  rationale: இந்த வசனத்தின் கிரேக்க உரையில் ‘மூப்பர்கள்’ என்ற சொல் மீண்டும் இடம்பெறவில்லை. எனினும் 19–20ஆம் வசனங்களின் சூழல் மூப்பர்களைப் பற்றியதாக இருக்கக்கூடும். ஆகவே பிரதான உரையில் ‘மூப்பர்கள்’ என்பதைச் சேர்க்காமல், சூழல்சார் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ஒருமை கட்டளை வடிவமான ‘திருத்து’ பவுல் தீமொத்தேயுவிடம் நேரடியாகச் சொல்வதைப் பேணுகிறது. ‘அச்சம்’ என்பது பயபக்தி அல்லது பீதி என்று குறிப்பாக வரையறுக்காமல் மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
