revisions:
- from: பாவம் செய்துகொண்டிருப்பவர்களை[a][b] எல்லாருக்கும் முன்பாகக் கண்டித்துத் திருத்து; அப்போது மற்றவர்களும் அச்சம் கொள்வார்கள்.
  to: பாவம் செய்கிறவர்களை[a][b] எல்லாருக்கும் முன்பாகக் கண்டி; அதனால் மற்றவர்களும் அச்சம் கொள்ளும்படி.
  rationale: The revision retains the source’s broad designation of the offenders, its public setting, and its undetermined sense of fear. It replaces the temporal-future rendering with a Tamil purpose construction corresponding to ἵνα ... ἔχωσιν, and removes the added explicit notion of correction from the command. The footnotes continue to preserve the ongoing-force possibility of the present participle and the contextual question of whether sinning elders are especially in view.
  reviewer_model: gpt-5.6-terra
