lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: நற்செயல்களுக்காக நற்சான்று பெற்றவளாகவும் இருக்க வேண்டும்
  rationale: மற்றவர்கள் அவளுடைய நற்செயல்களின் அடிப்படையில் அளிக்கும் நற்சாட்சியைச் செயப்பாட்டு நுணுக்கத்துடன் இயல்பான தமிழில் தெரிவிக்கிறது; தொடரின் இலக்கணத் தேவைக்காக ‘இருக்க வேண்டும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐτεκνοτρόφησεν
  choice: பிள்ளைகளை வளர்த்திருந்தால்
  rationale: பிள்ளைகளைப் பேணி வளர்த்தல் என்ற பொருளைத் தருகிறது; அவர்கள் உயிரியல் பிள்ளைகளே என்று கிரேக்கம் வரையறுக்கவில்லை.
- source_word: ἐξενοδόχησεν
  choice: அந்நியர்களை உபசரித்திருந்தால்
  rationale: அந்நியர்களையோ விருந்தினர்களையோ வீட்டில் ஏற்று விருந்தோம்புதல் என்ற குறிப்பான பொருளைப் பாதுகாக்கிறது.
- source_word: ἁγίων πόδας ἔνιψεν
  choice: பரிசுத்தவான்களின் கால்களைக் கழுவியிருந்தால்
  rationale: தாழ்மையான, நடைமுறைச் சேவையான கால்களைக் கழுவும் செயலை உருவகமாக்காமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: துன்பப்படுகிறவர்களுக்கு உதவியிருந்தால்
  rationale: அழுத்தம், இடர் அல்லது துயரத்தை அனுபவிப்போருக்குச் செய்யும் நடைமுறை உதவியைப் பரந்த பொருளில் தெரிவிக்கிறது; துன்புறுத்தலுக்கு மட்டும் குறுக்கவில்லை.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: ஒவ்வொரு நற்செயலிலும் முழுமனதுடன் ஈடுபட்டிருந்தால்
  rationale: சொல்லுக்குச் சொல் ‘பின்பற்றுதல்’ என்ற உருவகத்தை இயல்பற்ற தமிழாகத் தராமல், நற்செயலை முனைப்புடன் நாடி அதில் நிலைத்திருக்கும் கருத்தை வெளிப்படுத்துகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: ἁγίων என்பதன் குறிப்பு
  choice: பரிசுத்தவான்கள்
  alternative: விசுவாசிகள் / பரிசுத்த மக்கள்
  rationale: பவுலின் பயன்பாட்டில் இது கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட சக விசுவாசிகளைக் குறிக்கிறது. மூலச் சொல்லின் இறையியல் நிறையை முதன்மை உரையில் தக்கவைத்து, அதன் குறிப்பை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- issue: ἐπηκολούθησεν என்பதிலுள்ள செயற்பாட்டு முனைப்பு
  choice: முழுமனதுடன் ஈடுபட்டிருந்தால்
  alternative: நாடிப் பின்பற்றியிருந்தால்
  rationale: தொடர்ச்சியான அர்ப்பணிப்பையும் முனைப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் வெளிப்புறப் பின்பற்றலாகக் குறுக்காமல், சொல்லுக்கு நெருக்கமான மாற்றையும் அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. பட்டியலின் மீளும் εἰ அமைப்பு ஒவ்வொரு வினையிலும் ‘-இருந்தால்’ எனத் தக்கவைக்கப்பட்டுள்ளது. ‘உபசரித்தல்,’ ‘பரிசுத்தவான்கள்,’ ‘நற்சான்று’ போன்ற திருவிவிலியச் சூழலில் பரிச்சயமான சொற்கள் தெளிவான அடிக்குறிப்புகளுடன் பயன்படுத்தப்பட்டுள்ளன.
