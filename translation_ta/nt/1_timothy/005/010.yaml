source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: ta
  text: 'நற்செயல்களால் நற்சான்று பெற்றவளாகவும் இருக்க வேண்டும்: அவள் பிள்ளைகளை வளர்த்திருந்தால்,[a] அந்நியர்களை உபசரித்திருந்தால்,[b] பரிசுத்தவான்களின் கால்களைக் கழுவியிருந்தால்,[c] துன்பப்படுகிறவர்களுக்கு உதவியிருந்தால், ஒவ்வொரு நற்செயலையும் நாடியிருந்தால்.[d]


    [a] இங்கு குறிப்பிடப்படுபவர்கள் அவளுடைய சொந்தப் பிள்ளைகளாக மட்டுமே இருக்க வேண்டும் என்று கிரேக்கச் சொல் கூறவில்லை.


    [b] அல்லது, “விருந்தினர்களை வரவேற்றிருந்தால்.” கிரேக்க வினைச்சொல் அந்நியர்களையோ விருந்தினர்களையோ தன் வீட்டில் ஏற்றுக்கொள்வதைக் குறிப்பாகச் சுட்டுகிறது.


    [c] “பரிசுத்தவான்கள்” என்பது கடவுளுக்குரிய பரிசுத்த மக்களாகிய சக விசுவாசிகளைக் குறிக்கிறது.


    [d] சொல்லுக்கு நெருக்கமாக, “ஒவ்வொரு நற்செயலையும் பின்பற்றியிருந்தால்.” கிரேக்க வெளிப்பாடு நற்செயல்களைச் செயல்வீரியத்துடன் நாடுவதையும் தொடர்ந்து மேற்கொள்வதையும் வலியுறுத்துகிறது.'
  philosophy: optimal-equivalence
