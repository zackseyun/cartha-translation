source:
  edition: SBLGNT
  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: ta
  text: ஆனால், வயதில் இளைய கைம்பெண்களை ஏற்றுக்கொள்ளாதே. ஏனெனில், அவர்கள் மேசியாவுக்கு எதிராகச் சிற்றின்ப ஆசைகளுக்கு இடங்கொடுக்கும்போது[a][b], திருமணம் செய்துகொள்ள விரும்புகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் உணர்ச்சிவசப்படும்போது” அல்லது “அவர்களுடைய ஆசைகள் அவர்களை விலக்கிச் செல்லும்போது.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் நேரடியாக, “மேசியாவுக்கு எதிராக.” அவர்களுடைய ஆசைகள், அவருக்கான முந்தைய அர்ப்பணிப்பு அல்லது உறுதிப்பாட்டுடன் முரண்படுகின்றன என்பது இதன் பொருளாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτέρας χήρας
  choice: வயதில் இளைய கைம்பெண்கள்
  rationale: νεωτέρας என்பதன் ஒப்பீட்டுப் பொருளை ‘வயதில் இளைய’ தெளிவாகக் காக்கிறது; χήρας என்பதற்கு நவீனமும் கண்ணியமானதுமான ‘கைம்பெண்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் பட்டியலில் சேர்க்கத்தக்க கைம்பெண்களைப் பற்றிய அறிவுறுத்தலிலிருந்து மாறுபடும் கட்டளையை இது குறிக்கிறது.
- source_word: παραιτοῦ
  choice: ஏற்றுக்கொள்ளாதே
  rationale: இச்சூழலில் குறிப்பிட்ட பட்டியலுக்காக அவர்களை ஏற்றுக்கொள்ள மறுப்பதைக் குறிக்கிறது; நபர்களுடன் எந்தத் தொடர்பும் வைத்துக்கொள்ளக் கூடாது என்ற மிக விரிவான பொருளைத் தவிர்க்கிறது.
- source_word: ὅταν γὰρ
  choice: ஏனெனில், ... இடங்கொடுக்கும்போது
  rationale: γὰρ தரும் காரணவிளக்கத்தையும் ὅταν தரும் பொதுவான காலச் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καταστρηνιάσωσιν
  choice: சிற்றின்ப ஆசைகளுக்கு இடங்கொடுக்கும்போது
  rationale: அரிதான இவ்வினைச்சொல், வெறும் திருமண விருப்பத்தைக் காட்டிலும், ஒருவரை முன் அர்ப்பணிப்புக்கு முரணாக இழுக்கும் வலுவான இன்பநாட்டம் அல்லது உணர்ச்சித் தூண்டுதலுக்கு இடங்கொடுப்பதைச் சுட்டுகிறது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவுக்கு எதிராக
  rationale: Χριστός இங்கு பட்டமாக இருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது. கடினமான கிரேக்க உருபுத் தொடர்பைத் தீர்த்துவிடாமல், ‘எதிராக’ என்பது அதன் முரண்பாட்டுத் தன்மையை நேரடியாகக் காக்கிறது.
- source_word: γαμεῖν θέλουσιν
  choice: திருமணம் செய்துகொள்ள விரும்புகிறார்கள்
  rationale: θέλω உடன் வரும் வினையெச்சம் விருப்பம் அல்லது நோக்கத்தைத் தெரிவிக்கிறது; இத்தமிழாக்கம் இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: Χριστός இங்கு பெயர்போல அல்லாமல் பட்டமாகச் செயல்படுகிறது; ஆகவே ‘மேசியா’ மூலத்தின் பட்டப்பொருளைக் காக்கிறது.
- issue: καταστρηνιάσωσιν τοῦ Χριστοῦ என்பதன் தொடர்பு
  choice: மேசியாவுக்கு எதிராகச் சிற்றின்ப ஆசைகளுக்கு இடங்கொடுத்தல்
  alternative: அவர்களுடைய ஆசைகள் மேசியாவுக்கான முந்தைய அர்ப்பணிப்பிலிருந்து அவர்களை விலக்குதல்
  rationale: கிரேக்கத் தொடர் சுருக்கமானதும் பொருளுறவில் கடினமானதுமாக உள்ளது. பிரதான உரை அதன் ‘எதிராக’ என்ற பதற்றத்தைக் காக்கிறது; மறுமணம் செய்வதே தன்னிலேயே கண்டிக்கப்படுகிறது என்ற முடிவை மொழிபெயர்ப்பு சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கைம்பெண்கள்’ மரியாதையான சொல்லாகவும், ‘சிற்றின்ப ஆசைகளுக்கு இடங்கொடுக்குதல்’ அரிதான கிரேக்க வினைச்சொல்லின் உணர்ச்சி மற்றும் ஒழுக்கத் தீவிரத்தை மிகையாக விளக்காமல் தெரிவிக்கும் தொடராகவும் தேர்ந்தெடுக்கப்பட்டன.
