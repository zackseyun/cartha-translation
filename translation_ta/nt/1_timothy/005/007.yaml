  text: καὶ ταῦτα παράγγελλε, ἵνα ἀνεπίλημπτοι ὦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/007.yaml
  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: ta
  text: இவற்றையும் கட்டளையிடு[a], அவர்கள் குற்றஞ்சாட்ட இடமில்லாதவர்களாக இருக்கும்படி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறிவுறுத்து’ அல்லது ‘உத்தரவிடு’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள வினைச்சொல் அதிகாரபூர்வமான வலிமையைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்கள்’ என்பதற்குரிய பன்மை எழுவாய் கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படவில்லை. சூழலில், முந்தைய அறிவுறுத்தல்களில் குறிப்பிடப்பட்டவர்கள்—குறிப்பாக விதவைகளும் அவர்களுடைய குடும்பத்தினரும்—என்பதே அதிக வாய்ப்புள்ள பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: -யும்
  rationale: முந்தைய அறிவுறுத்தல்களுடன் இவ்வசனத்தை இயல்பாக இணைக்கும் தொடர் இணைப்பாகத் தமிழில் பின்னொட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முன்னும் சுற்றியுள்ள பகுதிகளிலும் கூறப்பட்ட அறிவுறுத்தல்களைச் சுட்டும் நடுநிலைப் பன்மைச் சுட்டுப்பெயரின் பொருளை விளக்கவுரை சேர்க்காமல் காக்கிறது.
- source_word: παράγγελλε
  choice: கட்டளையிடு
  rationale: நிகழ்காலக் கட்டளை வடிவத்திலுள்ள அதிகாரபூர்வமான அறிவுறுத்தலின் வலிமையைப் பாதுகாக்கிறது; தமிழில் இயல்பான நேரடிக் கட்டளையாகவும் உள்ளது.
- source_word: ἵνα
  choice: இருக்கும்படி
  rationale: கிரேக்கச் சொல் தெரிவிக்கும் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை இயல்பான தமிழ் நோக்கத் தொடராக எடுத்துரைக்கிறது.
- source_word: ἀνεπίλημπτοι
  choice: குற்றஞ்சாட்டப்படுவதற்கு இடமில்லாதவர்களாய்
  rationale: முற்றிலும் பாவமற்றவர்கள் என்ற அளவுக்கு பொருளை மிகைப்படுத்தாமல், நியாயமான குற்றச்சாட்டுக்கு ஆளாகாத நன்னடத்தை என்ற கருத்தைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ὦσιν
  choice: அவர்கள் ... இருக்க
  rationale: ἵνα தொடரிலுள்ள நிகழ்காலத் துணைநிலை வினையின் நோக்கப் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத பன்மை எழுவாய் தமிழில் தேவைக்கேற்ப ‘அவர்கள்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: ‘குற்றஞ்சாட்டப்படுவதற்கு இடமில்லாதவர்களாய் இருக்க’ என்பதன் மறைந்துள்ள பன்மை எழுவாய் யாரைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘அவர்கள்’ என்று பொதுவாக வழங்கி, குறிப்பிட்ட குழுவை நிர்ணயிக்கவில்லை.
  alternative: உடனடி சூழலில் பேசப்படும் விதவைகளும் அவர்களுடைய குடும்பத்தினரும்; அல்லது தீமோத்தேயுவும் திருச்சபைச் சமூகமும்.
  rationale: கிரேக்கத்தில் பன்மை எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை. உடனடி சூழல் விதவைகளையும் அவர்களுடைய குடும்பத்தினரையும் சுட்டுவதற்கான வாய்ப்பு அதிகம் என்றாலும், உரை தானே இங்கே எழுவாயை மீண்டும் குறிப்பிடாததால் அந்தத் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘குற்றமற்றவர்கள்’ என்பது முழுமையான பாவமின்மையை உணர்த்தக்கூடும் என்பதால், ἀνεπίλημπτοι என்பதன் சமூக-ஒழுக்கப் பொருளைத் தெளிவாகக் காட்ட ‘குற்றஞ்சாட்டப்படுவதற்கு இடமில்லாதவர்கள்’ என வழங்கப்பட்டுள்ளது. ‘அவர்கள்’ என்பதன் குறிப்பு திட்டமிட்டு பொதுவாக வைக்கப்பட்டு, அடிக்குறிப்பில் சூழல் விளக்கம் தரப்பட்டுள்ளது.
