revisions:
- from: அவர்கள் குற்றஞ்சாட்டப்படுவதற்கு இடமில்லாதவர்களாய் இருக்கும்படி, இவற்றையும் கட்டளையிடு[a][b].
  to: இவற்றையும் கட்டளையிடு[a], அவர்கள் குற்றஞ்சாட்ட இடமில்லாதவர்களாக இருக்கும்படி[b].
  rationale: திருத்தம் கிரேக்கத்தின் கட்டளை-தொடர்ந்து-நோக்கம் என்ற ஓட்டத்தை மீட்டெடுக்கிறது; ἀνεπίλημπτοι என்பதன் பொருளை நவீனத் தமிழில் இயல்பாகச் சொல்கிறது; மேலும், παράγγελλε என்பதற்குப் பொருந்தாத மென்மையான மாற்றுச்சொல்லை அடிக்குறிப்பிலிருந்து நீக்குகிறது. மறைந்துள்ள பன்மை எழுவாயின் உரைத் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
