  text: ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: ta
  text: ஏனெனில், சிலர் ஏற்கெனவே வழிவிலகி சாத்தானைப் பின்பற்றிச் சென்றுவிட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “சாத்தானுக்குப் பின்னால் திரும்பிச் சென்றார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: நிகழ்காலத்துக்கு முன்பே இந்த வழிவிலகல் நடந்துவிட்டது என்ற காலக் குறிப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: τινες
  choice: சிலர்
  rationale: குறிப்பிடப்படாத ஒரு பகுதியினரைக் குறிக்கும் இயல்பான, துல்லியமான தமிழ்ச் சொல்.
- source_word: ἐξετράπησαν
  choice: வழிவிலகி ... சென்றுவிட்டார்கள்
  rationale: சரியான பாதையிலிருந்து விலகுதல் என்ற உருவகத்தைப் பாதுகாக்கிறது; அவர்களை வேறொருவர் தவறாக வழிநடத்தியதாக மூலத்தில் இல்லாத காரணத்தைச் சேர்க்கவில்லை. ‘சென்றுவிட்டார்கள்’ நிகழ்ந்த செயலின் தற்போதைய விளைவையும் இயல்பாக உணர்த்துகிறது.
- source_word: ὀπίσω
  choice: பின்பற்றிச்
  rationale: ஒரு நபருக்குப் பின்னால் செல்லுதல் என்ற சொற்பொருளை, இவ்விடத்தில் உள்ள பின்பற்றுதல் அல்லது சார்ந்து செல்லுதல் என்ற கருத்தாக இயல்பான தமிழில் தருகிறது; மேலும் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Σατανᾶ
  choice: சாத்தான்
  rationale: புதிய ஏற்பாட்டுத் தமிழில் பரவலாக அறியப்படும் பெயரின் நிலையான ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ὀπίσω τοῦ Σατανᾶ என்பதை சொற்சார்ந்து ‘சாத்தானுக்குப் பின்னால்’ என மொழிபெயர்ப்பதா அல்லது கருத்துசார்ந்து ‘சாத்தானைப் பின்பற்றி’ என மொழிபெயர்ப்பதா?
  choice: சாத்தானைப் பின்பற்றிச்
  alternative: சாத்தானுக்குப் பின்னால்
  rationale: இத்தொடர் சாத்தானின் பாதையைப் பின்பற்றுவதைக் குறிக்கிறது. ‘பின்பற்றிச்’ என்பது அந்த எச்சரிக்கையை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது; அதேவேளையில் மூலத்தின் இடவியல் உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிவிலகி’ என்பது மூலத்தின் பாதை உருவகத்தைப் பாதுகாக்கிறது; ‘சாத்தானைப் பின்பற்றிச்’ என்பது ὀπίσω என்ற சொல்லின் சூழல்சார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
