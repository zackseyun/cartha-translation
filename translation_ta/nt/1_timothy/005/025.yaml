source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: ta
  text: அதேபோல, நல்ல செயல்களும் வெளிப்படையாகத் தெரியும்; வேறுவிதமாக இருப்பவையும்[a] மறைந்திருக்க முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறுபட்டவையும்” அல்லது “அவ்வாறு இல்லாதவையும்.” முந்தைய வசனத்துடன் ஒப்பிட்டுப் பார்க்கும்போது, இது குறிப்பாகத் தீய செயல்களைக் குறிக்கிறது என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: மூலத்திலுள்ள τὰ ἄλλως ἔχοντα என்ற தொடர், வேறுவிதமான அல்லது உடனடியாக வெளிப்படாத செயல்களைக் குறிக்கலாம்; சூழலின் அடிப்படையில் அதைத் தீய செயல்கள் என்றும் சிலர் புரிந்துகொள்கிறார்கள்.
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: அவ்வாறே ... உம்
  rationale: ὡσαύτως முந்தைய வசனத்துடன் நெருங்கிய ஒப்புமையை ஏற்படுத்துகிறது; καί-இன் இணைப்பும் வலியுறுத்தலும் ‘நல்ல செயல்களும்’ என்பதிலுள்ள ‘உம்’ மூலம் இயல்பான தமிழில் வெளிப்படுகின்றன.
- source_word: ἔργα τὰ καλά
  choice: நல்ல செயல்கள்
  rationale: ἔργα என்பதன் செயல்/செயல்கள் என்ற பொருளையும் καλά என்பதன் ஒழுக்கநலப் பண்பையும் எளிய, தற்காலத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: πρόδηλα
  choice: வெளிப்படையானவை
  rationale: கண்ணுக்குப் புலப்படும் அல்லது தெளிவாக அறியப்படும் நிலையைச் சுருக்கமாகக் காட்டி, பின்னர் வரும் ‘மறைந்திருக்க’ என்பதுடன் உள்ள எதிர்மறை ஒப்புமையைப் பேணுகிறது.
- source_word: τὰ ἄλλως ἔχοντα
  choice: வேறுவிதமாக உள்ளவையும்
  rationale: உடனடியாக வெளிப்படாத செயல்களையோ வேறு தன்மையுள்ள செயல்களையோ குறிக்கக்கூடிய கிரேக்கத் தொடரின் தெளிவின்மையைப் பேணுகிறது; ‘தீய செயல்கள்’ என்று வெளிப்படையாகச் சேர்த்து விளக்கவில்லை.
- source_word: κρυβῆναι οὐ δύνανται
  choice: மறைந்திருக்க முடியாது
  rationale: δύνανται உடன் வரும் மறுப்பு இயலாமையைத் தெரிவிக்கிறது; சூழலில் அவை தொடர்ந்து மறைவாக நிலைக்க முடியாது என்ற கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τὰ ἄλλως ἔχοντα என்பது குறிப்பாகத் தீய செயல்களைக் குறிக்கிறதா, அல்லது உடனடியாக வெளிப்படாத/வேறுவிதமான செயல்களைப் பொதுவாகக் குறிக்கிறதா?
  choice: வேறுவிதமாக உள்ள செயல்கள் என்ற பொதுவான, தெளிவின்மையைப் பேணும் மொழிபெயர்ப்பு
  alternative: தீய செயல்கள்
  rationale: கிரேக்க மூலத்தில் ‘தீய’ என்ற சொல் இல்லை. முந்தைய வசனத்தின் ஒப்புமையால் தீய செயல்கள் எனப் புரிந்துகொள்ள வாய்ப்பிருந்தாலும், அதை முதன்மை உரையில் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் தெரிவிப்பது மூலத்தின் கருத்து இழுபறியைப் பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘வெளிப்படையானவை’—‘மறைந்திருக்க’ என்ற சொல் எதிர்மறை ஒப்புமை மூலவசனத்தின் அமைப்பைத் தெளிவாகத் தருகிறது; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
