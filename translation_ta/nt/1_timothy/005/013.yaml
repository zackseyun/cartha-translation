source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: ta
  text: அதே வேளையில், அவர்கள் வீடு வீடாகச் சென்று, சோம்பலாக இருக்கப் பழகிக்கொள்கிறார்கள். சோம்பலாக இருப்பவர்கள் மட்டுமல்லாமல், வம்பு பேசுபவர்களாகவும்[a] பிறர் காரியங்களில் தலையிடுபவர்களாகவும்[b] இருந்து, பேசத் தகாதவற்றைப் பேசுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீண்பேச்சுப் பேசுபவர்களாக.” கிரேக்கச் சொல் அறிவற்ற அல்லது வெறுமையான பேச்சை விரிவாகக் குறிக்கலாம்; இச்சூழலில் அது வம்புப் பேச்சையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பிறர் விவகாரங்களில் குறுக்கிடுபவர்களாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: அதே சமயத்தில், அவர்கள் ...வும்
  rationale: ஒரே நேரத்தில் நிகழ்வதையும் முந்தைய கருத்துடன் கூடுதலாக இணைவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀργαὶ
  choice: சோம்பலாக இருப்பது
  rationale: வெறுமனே குணக்கேடான சோம்பேறித்தனத்தை மட்டும் அல்லாமல், வேலை செய்யாமல் இருப்பதைக் குறிக்கிறது; கிரேக்கத்தில் உள்ள இருமுறை பயன்பாடும் தமிழில் காக்கப்படுகிறது.
- source_word: μανθάνουσιν
  choice: பழகிக்கொண்டு
  rationale: முறையான கற்றலைவிட ஒரு பழக்கம் உருவாவதை இச்சூழலில் குறிக்கிறது. ‘சோம்பலாக இருக்கவும் பழகிக்கொண்டு’ என்பது இயல்பான தமிழில் அந்தப் பொருளைத் தருகிறது.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: வீடு வீடாகச் சுற்றித் திரிகிறார்கள்
  rationale: ஒரு வீட்டிலிருந்து இன்னொரு வீட்டுக்குச் செல்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: φλύαροι
  choice: வம்பு பேசுகிறவர்கள்
  rationale: வீணான, அறிவற்ற அல்லது பிறரைப் பற்றிய முறையற்ற பேச்சைக் குறிக்கும் சொல்லின் சூழல்சார் வலிமையை நவீன தமிழில் வெளிப்படுத்துகிறது; பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: περίεργοι
  choice: பிறர் காரியங்களில் தலையிடுகிறவர்கள்
  rationale: தமக்குச் சம்பந்தமில்லாத விவகாரங்களில் முறையின்றித் தலையிடுவதைத் தெளிவாகக் குறிக்கிறது.
- source_word: λαλοῦσαι τὰ μὴ δέοντα
  choice: பேசக்கூடாதவற்றைப் பேசுகிறார்கள்
  rationale: பேச்சே முறையற்றது என்பதைத் தெளிவாக்கி, கிரேக்கத்தின் எளிய நேரடியான அமைப்பைக் காக்கிறது.
theological_decisions:
- issue: பெண்பால் பன்மை வடிவங்களின் குறிப்பு
  choice: அவர்கள்
  alternative: இந்தப் பெண்கள்
  rationale: கிரேக்க இலக்கண வடிவங்கள் பெண்பால் பன்மையில் இருந்து, சூழலில் இளம் விதவைகளைக் குறிக்கின்றன. தமிழில் பால்வேறுபாடற்ற ‘அவர்கள்’ முந்தைய சூழலிலுள்ள குறிப்பை இயல்பாகத் தொடர்கிறது; பாலினக் குறிப்பை மாற்றுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சோம்பலாக’ என்ற சொல் இருமுறையும் பயன்படுத்தப்பட்டு மூலத்தின் வலியுறுத்தல் காக்கப்பட்டுள்ளது; ‘வம்பு பேசுகிறவர்கள்’ மற்றும் ‘தலையிடுகிறவர்கள்’ ஆகியவை இயல்பான சமகாலச் சொற்றொடர்கள்.
