- from: அதே சமயத்தில், அவர்கள் சோம்பலாக இருக்கவும் பழகிக்கொண்டு, வீடு வீடாகச் சுற்றித் திரிகிறார்கள். சோம்பலாக இருப்பது மட்டுமல்லாமல், வம்பு பேசுகிறவர்களாகவும்[a] பிறர் காரியங்களில் தலையிடுகிறவர்களாகவும்[b] இருந்து, பேசக்கூடாதவற்றைப் பேசுகிறார்கள்.
  to: அதே வேளையில், அவர்கள் வீடு வீடாகச் சென்று, சோம்பலாக இருக்கப் பழகிக்கொள்கிறார்கள். சோம்பலாக இருப்பவர்கள் மட்டுமல்லாமல், வம்பு பேசுபவர்களாகவும்[a] பிறர் காரியங்களில் தலையிடுபவர்களாகவும்[b] இருந்து, பேசத் தகாதவற்றைப் பேசுகிறார்கள்.
