id: 1TI.5.9
reference: 1 Timothy 5:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα, ἑνὸς ἀνδρὸς γυνή,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: ta
  text: அறுபது வயதுக்குக் குறையாதவரும், ஒரே கணவனுக்கு மனைவியாக இருந்தவருமான ஒரு கைம்பெண் மட்டுமே பட்டியலில் சேர்க்கப்பட வேண்டும்[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “ஒரே ஆணின் பெண்.” இச்சொற்றொடர் திருமணத்தில் உண்மையுள்ளவராக இருந்ததையோ அத்தகைய நற்பெயரைப் பெற்றிருந்ததையோ குறிக்கலாம்; ஆனால் “ஒருமுறை மட்டுமே திருமணம் செய்தவர்” என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: கைம்பெண்
  rationale: கணவனை இழந்த பெண்ணைக் குறிக்கும் மரியாதையான, நவீனத் தமிழ்ச் சொல்; இங்கு அதிகாரபூர்வமாகப் பட்டியலில் சேர்க்கப்பட வேண்டியவரைப் பற்றிப் பேசப்படுகிறது.
- source_word: καταλεγέσθω
  choice: பட்டியலில் சேர்க்கப்பட வேண்டும்
  rationale: அதிகாரபூர்வமான பட்டியலில் பதிவு செய்வதைக் குறிக்கும் நிர்வாகப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα
  choice: அறுபது வயதுக்குக் குறையாதவர்
  rationale: கிரேக்கச் சொற்றொடர் விதிக்கும் குறைந்தபட்ச வயது வரம்பை நேரடியாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: γεγονυῖα
  choice: குறையாதவரும் … இருந்தவருமான
  rationale: அடைந்த வயது அல்லது நிலையைச் சுட்டும் பங்கேற்புவினையின் பொருள், தமிழில் இணைநிலைப் பெயரெச்ச அமைப்பால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: ஒரே கணவனுக்கு மனைவியாக இருந்தவர்
  rationale: கிரேக்க மரபுத்தொடரின் வடிவத்தையும் அதன் பொருள் தெளிவின்மையையும் பெருமளவு காக்கிறது; திருமண உண்மைத்தன்மை அல்லது ஒருமுறை மட்டுமே திருமணம் செய்திருத்தல் என்று ஒருதலைப்பட்சமாகத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: ἑνὸς ἀνδρὸς γυνή என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘ஒரே கணவனுக்கு மனைவியாக இருந்தவர்’ என்ற மரபுத்தொடருக்கு நெருக்கமான மொழிபெயர்ப்பை வைத்திருத்தல்
  alternative: ‘தன் கணவனுக்கு உண்மையுள்ளவர்’ அல்லது ‘ஒருமுறை மட்டுமே திருமணம் செய்தவர்’
  rationale: இச்சொற்றொடர் திருமண உண்மைத்தன்மை மற்றும் நற்பெயரைக் குறிக்கலாம்; அல்லது ஒரே ஒரு திருமண வரலாற்றைக் குறிக்கிறது என்றும் சிலர் புரிந்துகொள்கிறார்கள். கிரேக்க உரை இதைத் தெளிவாகத் தீர்மானிக்காததால், எந்த ஒரு இறையியல் முடிவையும் முதன்மை உரைக்குள் திணிக்காமல் தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பட்டியலில் சேர்க்கப்பட வேண்டும்’ என்பது அதிகாரபூர்வப் பதிவின் பொருளைக் காக்கிறது; விவாதத்திற்குரிய திருமணத் தகுதி அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
