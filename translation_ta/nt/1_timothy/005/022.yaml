  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: ta
  text: யார்மீதும் அவசரமாகக் கைகளை வைக்காதே[a]; மற்றவர்களுடைய பாவங்களில் பங்குகொள்ளாதே. உன்னைத் தூயவனாகக் காத்துக்கொள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இந்தச் சூழலில் இன்னும் குறிப்பாக, “யாரையும் அவசரமாக நியமிக்காதே.” கிரேக்கத்தில் நேரடியாக “கைகளை வைக்காதே” என்று உள்ளது; இந்த மரபுத்தொடர் ஊழியத்திற்காக ஒருவரை நியமிப்பது அல்லது அங்கீகரிப்பதோடு அடிக்கடி தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: கைகளை வைக்காதே
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான உருவகத்தையும் சபைச் சூழலில் ஊழியத்திற்கான அங்கீகாரம் அல்லது பொறுப்பு அளித்தலைக் குறிக்கக்கூடிய அதன் பரந்த பொருளையும் காக்கிறது; ‘நியமிக்காதே’ அல்லது ‘திருநிலைப்படுத்தாதே’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: ταχέως
  choice: அவசரப்பட்டு
  rationale: வெறும் வேகத்தை அல்லாமல், போதிய பரிசீலனையின்றி முன்னதாகச் செயல்படுவதைக் குறிக்கும் எச்சரிக்கையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: μηδενὶ
  choice: யார்மீதும்
  rationale: மறுப்பு கட்டளையுடன் சேர்ந்து எல்லாரையும் உள்ளடக்கும் கிரேக்கச் சொல்லின் பரப்பைத் தெளிவாகக் காக்கிறது.
- source_word: μηδὲ κοινώνει
  choice: பங்குகொள்ளாதே
  rationale: மற்றவர்களின் செயல்களில் பங்கேற்பது அல்லது அவற்றுக்கான பொறுப்பில் உடந்தையாக இருப்பது என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: மற்றவர்களுடைய பாவங்களில்
  rationale: ‘வேறொருவருக்குச் சொந்தமான பாவங்கள்’ என்ற கிரேக்கப் பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: σεαυτὸν
  choice: உன்னை
  rationale: இரண்டாம் நபர் ஒருமைத் தற்சுட்டுப் பொருளை நேரடியாக வழங்குகிறது.
- source_word: ἁγνὸν
  choice: தூயவனாக
  rationale: இங்கு குறிக்கப்படும் பரந்த ஒழுக்கத் தூய்மையைப் பாதுகாக்கிறது; பாலியல் கற்புக்கு மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: τήρει
  choice: காத்துக்கொள்
  rationale: தூய்மையைத் தொடர்ந்து பேண வேண்டும் என்ற நிகழ்காலக் கட்டளையின் தொடர்ச்சியான நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘கைகளை வைப்பது’ என்பதன் சூழல்சார் பொருள்
  choice: மூல மொழியின் ‘கைகளை வை’ என்ற மரபுத்தொடரை முதன்மை உரையில் வைத்திருத்தல்.
  alternative: ‘யாரையும் அவசரமாக நியமிக்காதே’ அல்லது ‘திருநிலைப்படுத்தாதே’ என்று மொழிபெயர்த்தல்.
  rationale: மூப்பர்கள் மற்றும் பொறுப்புக்கூறல் பற்றிய உடனடிச் சூழலில் இது ஊழிய நியமனம் அல்லது அங்கீகாரத்தைக் குறிக்கலாம். இருப்பினும், கிரேக்கம் வெளிப்படையான ‘நியமி’ என்ற வினையைப் பயன்படுத்தாததால், குறிப்பிட்ட சபை நடைமுறையை உரைக்குள் திணிக்காமல் உண்மையான பொருள் அகலத்தைப் பாதுகாக்கிறது.
- issue: இரு தடைகளுக்கும் இடையிலான தொடர்பு
  choice: இரண்டாவது கட்டளையை மற்றவர்களின் பாவங்களில் உடந்தையாகாதிருக்கும்படி கூறும் பரந்த எச்சரிக்கையாக மொழிபெயர்த்தல்.
  alternative: அவசர நியமனத்தால் மட்டும் ஏற்படும் குற்றப்பங்கைக் குறிப்பதாக வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: இரு வாக்கியக்கூறுகளின் அருகாமை, அவசரமான அங்கீகாரம் மற்றவர்களின் பாவங்களில் பங்காளியாக்கலாம் என்று உணர்த்துகிறது. ஆனால் அந்தத் தொடர்பை கிரேக்கம் வெளிப்படையாக வரையறுக்காததால், முதன்மை உரை அதைத் தீர்மானித்து விடவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் நேரடியான கட்டளைத் தொனியும் காக்கப்பட்டுள்ளன. தீமோத்தேயு ஆண் என்பதால் ‘தூயவனாக’ பயன்படுத்தப்பட்டது. ‘கைகளை வைக்காதே’ என்ற மரபுத்தொடரின் இயல்பான தெளிவின்மையை அடிக்குறிப்பு விளக்குகிறது.
