translation:
  language: ta
  text: அவர்கள் தங்களுடைய முந்தைய விசுவாசத்தைத் தள்ளிவிட்டதால், தீர்ப்புக்கு உள்ளாகிறார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்களுடைய முதல் உறுதிமொழி’ அல்லது ‘தங்களுடைய முந்தைய அர்ப்பணிப்பு.’ கிரேக்கச் சொல் ‘விசுவாசம்’ என்றும் பொருள்படும்; ஆனால் இச்சூழலில், விதவையாகப் பட்டியலில் சேர்க்கப்படுவதுடன் தொடர்புடைய முன்பிருந்த உறுதிமொழி அல்லது அர்ப்பணிப்பை இது குறிக்கிறது என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: உள்ளாகிறார்கள்
  rationale: ἔχω என்பதன் நேரடியான பொருள் ‘கொண்டிருத்தல்’; ஆனால் κρίμα என்பதுடன் இங்கு ‘தீர்ப்புக்கு உட்படுதல்’ என்ற இயல்பான தமிழ்ப் பொருளைத் தருகிறது. பெண்பால் பன்மை எழுவாயை முந்தைய சூழல் தெளிவுபடுத்துவதால் பொதுவான மரியாதைநடைப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: κρίμα
  choice: தீர்ப்பு
  rationale: இந்தச் சொல் தீர்ப்பு, கண்டனத் தீர்ப்பு, தண்டனை எனப் பொருள்படலாம். வசனம் நித்தியத் தண்டனையை வெளிப்படையாகக் குறிப்பிடாததால், பரந்த பொருளைத் தக்கவைக்கும் ‘தீர்ப்பு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ὅτι
  choice: -தால்
  rationale: தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்துவதால், இயல்பான தமிழில் காரண விகுதியான ‘-தால்’ பயன்படுத்தப்பட்டது.
- source_word: τὴν πρώτην πίστιν
  choice: தங்களுடைய முந்தைய விசுவாசத்தை
  rationale: πρώτην இங்கு காலத்தால் முந்தியதைக் குறிக்கிறது; πίστιν என்பதற்கு அடிப்படைப் பொருளான ‘விசுவாசம்’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது. சூழலில் ‘முதல் உறுதிமொழி’ அல்லது ‘முந்தைய அர்ப்பணிப்பு’ என்ற பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἠθέτησαν
  choice: புறக்கணித்ததால்
  rationale: ἀθετέω என்பது ஒதுக்கிவைத்தல், நிராகரித்தல், செல்லாததாக்குதல் ஆகிய பொருள்களைக் கொண்டது. ‘புறக்கணித்தல்’ முன்பிருந்த விசுவாசம் அல்லது பொறுப்பை மதிக்காமல் ஒதுக்கும் கருத்தைத் தருகிறது; உறுதிமொழி என்ற மாற்றுப் பொருளையும் முற்றிலும் மூடிவிடாது.
theological_decisions:
- issue: τὴν πρώτην πίστιν என்பதன் சூழல்சார் பொருள்
  choice: தங்களுடைய முந்தைய விசுவாசம்
  alternative: தங்களுடைய முதல் உறுதிமொழி; தங்களுடைய முந்தைய அர்ப்பணிப்பு
  rationale: πίστις என்பதன் இயல்பான பொருள் ‘விசுவாசம்’. இருப்பினும், இளம் விதவைகள் பட்டியலில் சேர்க்கப்பட்ட சூழலில் இது முன்பு அளித்த உறுதிமொழி அல்லது ஏற்றுக்கொண்ட அர்ப்பணிப்பைக் குறிக்கலாம். கிரேக்கத்தின் உண்மையான இருபொருள் வாய்ப்பைத் தீர்த்துவிடாமல், முதன்மை உரையில் ‘விசுவாசம்’ என்றும் அடிக்குறிப்பில் மாற்றுப் புரிதல்களும் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தீர்ப்பு’ என்ற சொல் மூலத்தின் தீவிரத்தைத் தக்கவைத்தாலும், ‘கண்டனத் தீர்ப்பு’ அல்லது ‘நித்தியத் தண்டனை’ என்று அளவுக்கு மீறிக் குறிப்பாக்கவில்லை. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
