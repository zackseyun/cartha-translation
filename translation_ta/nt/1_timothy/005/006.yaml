  text: ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: ta
  text: ஆனால், இன்பத்தை நாடி வாழ்கிறவளோ[a] உயிரோடு இருக்கும்போதே இறந்தவளாய் இருக்கிறாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுகபோகமாக வாழ்கிறவள்.”
    reason: σπαταλῶσα என்பதற்கு தன்னிச்சையான இன்பம் அல்லது சுகபோக வாழ்க்கை என்ற நுண்பொருளும் உண்டு.
lexical_decisions:
- source_word: σπαταλῶσα
  choice: இன்பத்தை நாடி வாழ்கிறவள்
  rationale: இந்த நிகழ்காலப் பங்கேற்புவினை, வெறும் மகிழ்ச்சியை அல்லாமல், தன்னலமான இன்பத்தையே நோக்கமாகக் கொண்ட தொடர்ச்சியான வாழ்க்கை முறையைக் குறிக்கிறது. இத்தமிழாக்கம் அந்த வாழ்க்கைமுறை சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ζῶσα
  choice: உயிரோடு இருக்கும்போதே
  rationale: இது அடுத்து வரும் நிறைவுக்கால வினையுடன் கால அல்லது விட்டுக்கொடுப்பு உறவைக் கொண்டுள்ளது. ‘உயிரோடு இருக்கும்போதே’ என்பது உடல் வாழ்வுக்கும் மரணநிலைக்கும் இடையிலான திட்டமிட்ட முரணைத் தெளிவாகக் காக்கிறது.
- source_word: τέθνηκεν
  choice: இறந்தவளாக இருக்கிறாள்
  rationale: θνῄσκω என்பதன் நிறைவுக்கால வடிவம், இறப்பின் விளைவாகத் தொடரும் தற்போதைய நிலையைக் கவனப்படுத்துகிறது. எனவே ‘இறந்தவளாக இருக்கிறாள்’ என்பது அந்த நிலையை வெளிப்படுத்துகிறது; அதை உடல் மரணம் என்று தவறாகக் குறுக்குவதில்லை.
- source_word: ἡ ... σπαταλῶσα
  choice: இன்பத்தை நாடி வாழ்கிறவளோ
  rationale: பெண்பால் ஒருமைச் சுட்டுரையும் பங்கேற்புவினையும் சேர்ந்து ஒரு பெண்ணைக் குறிக்கும் பெயர்ச்சொல் தொடராகச் செயல்படுகின்றன. உடனடிச் சூழல் விதவைகளைப் பற்றியதாக இருப்பதால், பெண்பால் குறிப்பை மொழிபெயர்ப்பு காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் தேவனை நம்பி வேண்டுதலில் நிலைத்திருக்கும் உண்மையான விதவைக்கும் இங்கே கூறப்படும் பெண்ணுக்கும் உள்ள முரணை δέ குறிக்கிறது; ‘ஆனால்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உயிரோடு இருக்கும்போதே ‘இறந்தவள்’ என்பதன் தன்மை
  choice: உடலால் உயிருடன் இருந்தாலும் உருவகமான அல்லது ஆவிக்குரிய மரணநிலையில் இருப்பது
  alternative: சமூக ரீதியில் இறந்தவளைப் போன்றவள்; ஒழுக்க ரீதியில் இறந்தவள்
  rationale: ‘உயிரோடு இருக்கும்போதே’ என்பதையும் ‘இறந்தவளாக இருக்கிறாள்’ என்பதையும் அருகருகே வைப்பது உடல் சாராத மரணத்தைச் சுட்டும் நோக்கமுள்ள முரணை உருவாக்குகிறது. அது ஆவிக்குரியதா, ஒழுக்க ரீதியானதா என்பதை மொழிபெயர்ப்பு மேலும் வரையறுக்காமல் மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உயிரோடு இருக்கும்போதே இறந்தவளாக இருக்கிறாள்’ என்ற சொற்றொடர் மூலத்திலுள்ள முரண்பாட்டை விளக்கித் தீர்க்காமல் அப்படியே காக்கிறது.
