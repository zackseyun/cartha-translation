revisions:
- from: இனிமேல் தண்ணீர் மட்டுமே குடிக்காமல்,[a] உன் வயிற்றுக்காகவும் உனக்கு அடிக்கடி ஏற்படும் நோய்களுக்காகவும் கொஞ்சம் திராட்சைமது பயன்படுத்து.
  to: இனிமேல் தண்ணீரை மட்டுமே குடித்துக்கொண்டிருக்காதே; உன் வயிற்றுக்காகவும், அடிக்கடி உனக்கு ஏற்படும் உடல்நலக்குறைவுகளுக்காகவும் கொஞ்சம் திராட்சைமதுவைப் பயன்படுத்திக்கொள்.
