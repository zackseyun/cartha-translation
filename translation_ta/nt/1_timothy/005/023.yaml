id: 1TI.5.23
reference: 1 Timothy 5:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: ta
  text: இனிமேல் தண்ணீரை மட்டுமே குடித்துக்கொண்டிருக்காதே; உன் வயிற்றுக்காகவும், அடிக்கடி உனக்கு ஏற்படும் உடல்நலக்குறைவுகளுக்காகவும் கொஞ்சம் திராட்சைமதுவைப் பயன்படுத்திக்கொள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηκέτι
  choice: இனிமேல் … குடிக்காமல்
  rationale: முன்பு தொடர்ந்த ஒரு பழக்கத்தை நிறுத்தும்படியான கட்டளையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὑδροπότει
  choice: தண்ணீர் மட்டுமே குடிக்காமல்
  rationale: சொல்லின் நேரடிப் பொருள் ‘தண்ணீர் குடி’ என்பதாக இருந்தாலும், ἀλλά மூலம் வரும் எதிர்மறை ஒப்பீடு தண்ணீரை மட்டும் குடிக்கும் பழக்கத்தைக் குறிக்கிறது; தண்ணீரையே முற்றிலும் நிறுத்த வேண்டும் என்ற தவறான புரிதலை இது தவிர்க்கிறது.
- source_word: ἀλλὰ
  choice: …ஆமல் … பயன்படுத்து
  rationale: தண்ணீரை மட்டும் குடிப்பதற்குப் பதிலாகக் கொஞ்சம் திராட்சைமதுவைப் பயன்படுத்தும் முரணைத் தமிழின் இயல்பான எதிர்மறை வினையெச்ச அமைப்பு வெளிப்படுத்துகிறது.
- source_word: οἴνῳ ὀλίγῳ
  choice: கொஞ்சம் திராட்சைமது
  rationale: ὀλίγῳ காட்டும் குறைந்த அளவைப் பாதுகாக்கிறது; οἶνος என்பதைக் கலாச்சார அல்லது கோட்பாட்டு காரணங்களால் பொதுமைப்படுத்தாமல் குறிப்பாக மொழிபெயர்க்கிறது.
- source_word: χρῶ
  choice: பயன்படுத்து
  rationale: χράομαι என்பதன் ‘பயன்படுத்து’ என்ற பரந்த பொருளைப் பாதுகாத்து, இங்கு உடல்நலக் காரணத்திற்காக உட்கொள்வதைக் குறிக்கிறது.
- source_word: διὰ
  choice: …க்காக
  rationale: குற்றுவேற்றுமையுடன் வரும் διά இங்கு காரணத்தைச் சுட்டுகிறது; தமிழில் ‘வயிற்றுக்காகவும் … நோய்களுக்காகவும்’ என்பது இயல்பாக அந்தக் காரணத்தைத் தெரிவிக்கிறது.
- source_word: στόμαχον
  choice: வயிறு
  rationale: உடலுறுப்பைக் குறிக்கும் வழக்கமான, அனைவருக்கும் புரியும் தமிழ்ச் சொல்.
- source_word: πυκνάς
  choice: அடிக்கடி ஏற்படும்
  rationale: மீண்டும் மீண்டும் நிகழ்வதை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀσθενείας
  choice: நோய்கள்
  rationale: ἀσθένεια ‘பலவீனம்’ என்றும் பொருள்படலாம்; ஆனால் வயிறும் நிவாரணப் பயன்பாடும் இடம்பெறும் இச்சூழலில் உடல் நோய்கள் என்பதே பொருத்தமான பொருள்.
theological_decisions:
- issue: தீமோத்தேயுவின் முந்தைய பழக்கம் தண்ணீரை மட்டும் குடிப்பது என்று வெளிப்படையாகக் காட்ட வேண்டுமா?
  choice: தண்ணீர் மட்டுமே குடிக்காமல்
  alternative: இனிமேல் தண்ணீர் குடிக்காமல்
  rationale: ‘ஆனால் கொஞ்சம் திராட்சைமது பயன்படுத்து’ என்ற முரண், தண்ணீரையே முற்றிலும் தவிர்க்கும்படி அல்லாமல், தண்ணீர் மட்டுமே குடிப்பதை நிறுத்தும்படி கூறுகிறது. ‘மட்டுமே’ என்பது அந்த உள்ளார்ந்த பொருளைத் தெளிவாக்குகிறது.
- issue: οἶνος என்பதைச் சொற்பொருள்படி மொழிபெயர்ப்பதா அல்லது மருத்துவப் பானமாகப் பொதுமைப்படுத்துவதா?
  choice: திராட்சைமது
  alternative: மருத்துவப் பானம்
  rationale: கிரேக்க மூலம் οἶνος என்று குறிப்பாகக் கூறுகிறது. ‘கொஞ்சம்’ என்பது அளவுக் கட்டுப்பாட்டைப் பாதுகாக்கிறது; கூடுதலான கோட்பாட்டு அல்லது கலாச்சார விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திராட்சைமது’ என்பது οἶνος என்பதைக் குறிப்பாகவும் இயல்பாகவும் தருகிறது; ‘பயன்படுத்து’ என்பது χρῶ என்பதன் சொற்பொருளையும் மருத்துவச் சூழலின் திறந்த தன்மையையும் பாதுகாக்கிறது.
