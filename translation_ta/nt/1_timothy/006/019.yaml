  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: ta
  text: வருங்காலத்திற்காகத் தங்களுக்கென நல்ல அடித்தளத்தைச் சேமித்து வைத்துக்கொண்டு, மெய்யான வாழ்வைப்[a] பற்றிக்கொள்ளும்படி செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “உண்மையிலேயே வாழ்வாக இருக்கும் வாழ்வை.”
    reason: τῆς ὄντως ζωῆς என்பதில் ζωή என்ற பெயர்ச்சொல்லும் ὄντως-இன் வலியுறுத்தலும் வெளிப்படையாக உள்ளன; முதன்மை உரையின் இயல்பான «மெய்யான வாழ்வு» மொழிபெயர்ப்புக்கான நேரடியான மாற்றை இது தருகிறது.
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: சேமித்துவைத்து
  rationale: தொடர்ந்து செல்வத்தைச் சேர்த்துவைக்கும் பொருளை இயல்பான நவீன தமிழில் தருகிறது; முந்தைய வசனத்தின் அறிவுறுத்தலைத் தொடரும் நிகழ்காலப் பங்கேற்புவினையின் கருத்தும் காக்கப்படுகிறது.
- source_word: ἑαυτοῖς
  choice: தங்களுக்கென
  rationale: செயலின் பயன் அவர்களுக்கே சேருவதை இயல்பாகக் காட்டுகிறது.
- source_word: θεμέλιον καλὸν
  choice: ஒரு நல்ல அடித்தளத்தை
  rationale: θεμέλιον என்பதன் கட்டுமான உருவகத்தையும் καλόν என்பதன் நன்மை/தகுதி சார்ந்த பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: εἰς τὸ μέλλον
  choice: வருங்காலத்திற்காக
  rationale: எதிர்வரவிருப்பதைச் சுட்டும் பரந்த பொருளைக் காக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘வரவிருக்கும் யுகம்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἵνα
  choice: பற்றிக்கொள்ளும்படி
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα-வின் தொடர்பைத் தமிழில் இயல்பான நோக்கவாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: ἐπιλάβωνται
  choice: பற்றிக்கொள்ள
  rationale: உறுதியாகப் பிடித்துக்கொள்ளுதல் என்ற உயிரோட்டமான உருவகத்தைப் பேணுகிறது; வெறுமனே ‘பெறுதல்’ என்று தளர்த்தவில்லை.
- source_word: τῆς ὄντως ζωῆς
  choice: உண்மையான வாழ்வை
  rationale: ὄντως என்பதன் ‘மெய்யாக/உண்மையாக’ என்ற வலியுறுத்தலையும் ζωή என்ற பெயர்ச்சொல்லையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: εἰς τὸ μέλλον என்பதை குறிப்பாக இறுதிக்கால ‘வரவிருக்கும் யுகம்’ என்று மொழிபெயர்க்க வேண்டுமா
  choice: வருங்காலத்திற்காக
  alternative: வரவிருக்கும் யுகத்திற்காக
  rationale: சூழலில் இறுதிக்கால எதிர்நோக்கு இருந்தாலும், கிரேக்கச் சொற்றொடர் ‘யுகம்’ என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே அதன் பரந்த முன்னோக்கிய பொருள் காக்கப்படுகிறது.
- issue: τῆς ὄντως ζωῆς என்பதன் வலியுறுத்தலை எவ்வாறு வெளிப்படுத்துவது
  choice: உண்மையான வாழ்வு
  alternative: உண்மையிலேயே வாழ்வாக இருப்பது / மெய்யான வாழ்வு
  rationale: செல்வத்தை அடிப்படையாகக் கொண்ட தோற்ற வாழ்வுக்கும் மெய்யான வாழ்வுக்கும் இடையிலான கருத்து வேறுபாட்டைக் காக்கும் இயல்பான தமிழ்; அதன் தன்மையை மேலதிகமாக விளக்கி இறையியல் பதற்றத்தைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. வசனம் முந்தைய வாக்கியத்தைத் தொடரும் சார்பு அமைப்பாக இருப்பதால், தமிழிலும் தொடர்ச்சியான அறிவுறுத்தல் வடிவம் பேணப்பட்டுள்ளது.
