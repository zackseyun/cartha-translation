source:
  edition: SBLGNT
  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: ta
  text: அதை அவர் தமக்குரிய காலங்களில்[a] வெளிப்படுத்துவார்—பேறுபெற்றவரும் ஒரே ஆட்சியாளருமான அவர், ஆட்சி செய்கிறவர்களின் அரசரும் அதிகாரம் செலுத்துகிறவர்களின் ஆண்டவருமானவர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்கே உரிய காலங்களில்.” இந்தச் சொற்றொடர் அவர் நிர்ணயித்த காலங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'வழக்கமான மொழிபெயர்ப்பு: “அரசர்களின் அரசரும் ஆண்டவர்களின் ஆண்டவரும்.” ஆனால் கிரேக்கத்தில் பெயர்ச்சொற்களுக்குப் பதிலாக, சொல்லுக்கு சொல் “ஆட்சி செய்கிறவர்களின் அரசரும் அதிகாரம் செலுத்துகிறவர்களின் ஆண்டவரும்” என வினையெச்ச வடிவங்கள் வருகின்றன.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: அதை
  rationale: பெண்பால் ஒருமை உறவுப்பெயர், முந்தைய வசனத்தில் உள்ள ἐπιφάνειαν (‘தோன்றுதல்’) என்பதைக் குறிக்கிறது; தமிழில் உயிரற்ற நிகழ்வைக் குறிக்கும் ‘அதை’ இயல்பானது.
- source_word: καιροῖς ἰδίοις
  choice: தமக்குரிய காலங்களில்
  rationale: καιρός என்பது நிர்ணயிக்கப்பட்ட காலம் அல்லது தருணத்தைக் குறிக்கிறது; கிரேக்கத்தின் பன்மையைத் தக்கவைத்தும், காலங்கள் அவருக்குரியவை என்ற பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δείξει
  choice: வெளிப்படுத்துவார்
  rationale: δείκνυμι என்பதன் எதிர்கால வடிவம்; மறைந்திருப்பதை வெளிப்படையாகக் காணச் செய்வது என்ற பொருளை இச்சூழலில் தெளிவாகக் கொடுக்கிறது.
- source_word: ὁ μακάριος
  choice: பேறுபெற்றவர்
  rationale: இங்கு பெயர்ச்சொல்லாகப் பயன்படும் தெய்வீகப் பட்டம். ‘மகிழ்ச்சியானவர்’ என்பதைவிட கண்ணியமும் நிறைவும் கொண்ட நிலையை ‘பேறுபெற்றவர்’ தெரிவிக்கிறது.
- source_word: μόνος δυνάστης
  choice: ஒரே ஆட்சியாளர்
  rationale: δυνάστης ஆளும் வல்லமையுடையவரைக் குறிக்கிறது. ‘ஆட்சியாளர்’ நவீன தமிழில் தெளிவானது; μόνος என்பதன் தனித்தன்மையை ‘ஒரே’ தக்கவைக்கிறது.
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: ஆட்சி செய்கிறவர்களின் அரசர்
  rationale: βασιλευόντων என்பது ‘அரசர்கள்’ என்ற பெயர்ச்சொல் அல்ல, ‘ஆட்சி செய்கிறவர்கள்’ என்ற வினையெச்ச வடிவம்; அதன் வினைத் தன்மையை மொழிபெயர்ப்பு காக்கிறது.
- source_word: κύριος τῶν κυριευόντων
  choice: அதிகாரம் செலுத்துகிறவர்களின் ஆண்டவர்
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என்றும், κυριευόντων என்பதன் ஆளுகை அல்லது அதிகாரம் செலுத்துதல் என்ற வினைப் பொருளை வெளிப்படையாகவும் தருகிறது.
theological_decisions:
- issue: தோன்றுதலை வெளிப்படுத்தப்போகிறவரின் அடையாளம்
  choice: எழுவாயைத் தனிப்பெயரால் குறிப்பிடாமல், கிரேக்கத்தில் வரும் உயரிய பட்டங்களாலேயே அடையாளப்படுத்துதல்
  alternative: இயேசு கிறிஸ்துவின் தோன்றுதலைப் பிதாவாகிய தேவன் வெளிப்படுத்துவார் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இவ்வசனம் எழுவாயைத் தனிப்பெயரால் சொல்லாமல் பட்டங்களால் அறிமுகப்படுத்துகிறது. மொழிபெயர்ப்பு அதே தெளிவின்மையையும் இறையியல் அழுத்தத்தையும் தக்கவைத்து, சூழலிலிருந்து வாசகர் புரிந்துகொள்ள இடமளிக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, கண்ணியமும் பொதுவாசிப்புக்கான தெளிவும் கொண்ட நடை. கிரேக்கப் பன்மை, வினையெச்ச அமைப்பு, தெய்வீகப் பட்டங்கள் ஆகியவை இயன்றவரை காக்கப்பட்டுள்ளன; மரபுவழி சுருக்கமான பட்டப்பெயர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
