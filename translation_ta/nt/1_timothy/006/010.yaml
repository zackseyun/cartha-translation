id: 1TI.6.10
reference: 1 Timothy 6:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: ta
  text: ஏனெனில், பண ஆசை எல்லா வகையான தீமைகளுக்கும் ஒரு வேராக இருக்கிறது[a]. பணத்தை நாடி ஏங்கிய சிலர் விசுவாசத்தை விட்டு வழிவிலகி[b], பல வேதனைகளால் தங்களையே துளைத்துக்கொண்டார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, பாரம்பரியமாக: ‘பண ஆசையே எல்லாத் தீமைக்கும் வேர்.’ எனினும், ‘எல்லா வகையான தீமைகளுக்கும் ஒரு வேர்’ என்ற பொருளை கிரேக்கம் இயல்பாக அனுமதிக்கிறது; ஒவ்வொரு தீமைக்கும் ஒரே காரணம் உண்டு என்ற எண்ணத்தையும் இது தவிர்க்கிறது.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘நம்பிக்கையிலிருந்து வழிவிலகி.’ இங்கு ‘விசுவாசம்’ என்பது கிறிஸ்தவ விசுவாசத்தை ஒரு புறநிலை நம்பிக்கைத் தொகுப்பாகக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பல துயரங்களால்’ அல்லது ‘பல கடும் வருத்தங்களால் தங்களையே துளைத்துக்கொண்டார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: ஒரு வேர்
  rationale: வினைக்கு முன் வரும் இச்சொல்லுக்கு கிரேக்கத்தில் குறிப்புச் சுட்டு இல்லை. எனவே பண ஆசையே எல்லாத் தீமைக்கும் ஒரே வேர் என்று கூறாமல், பல வேர்களில் ஒன்றாகக் காட்டும் ‘ஒரு வேர்’ என்பது சூழலுக்கும் இலக்கணத்துக்கும் ஏற்றது.
- source_word: πάντων τῶν κακῶν
  choice: எல்லா வகையான தீமைகளுக்கும்
  rationale: பன்மை வடிவிலுள்ள இத்தொடரின் பரந்த, பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; விதிவிலக்கின்றி ஒவ்வொரு தீமையையும் குறிக்கும் முழுமையான கூற்றாக இதை மாற்றுவதில்லை.
- source_word: φιλαργυρία
  choice: பண ஆசை
  rationale: ‘வெள்ளியின்மேல் அன்பு’ என்ற சொற்பிறப்புப் பொருளை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது; பொதுவான பேராசையைவிட குறிப்பாகப் பணத்தின்மேலுள்ள ஆசையைக் குறிக்கிறது.
- source_word: ὀρεγόμενοι
  choice: நாடி ஏங்கிய
  rationale: ஒன்றை அடைய நீட்டுதல் அல்லது தீவிரமாக விரும்புதல் என்ற வினையின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: விசுவாசத்தைவிட்டு வழிவிலகி
  rationale: முன்பு இருந்த நிலையிலிருந்து விலகிச் செல்வதைக் காட்டும் இயக்க உருவகத்தைப் பாதுகாக்கிறது; கிரேக்க இறந்தகால நிகழ்வைத் தமிழின் இயல்பான வினையெச்சத் தொடரில் அடுத்த வினையுடன் இணைக்கிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இங்கு இடைநிலைச் சுட்டுடன் வரும் சொல், ஆயர் நிருபங்களின் சூழலில் கிறிஸ்தவ விசுவாசத்தைக் குறிக்கும் வாய்ப்பு மிகுதி. தமிழில் ‘விசுவாசத்தைவிட்டு’ என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: περιέπειραν
  choice: தங்களையே துளைத்துக்கொண்டார்கள்
  rationale: ஊடுருவிக் குத்துதல் என்ற கூர்மையான கிரேக்க உருவகத்தை வாசிக்க எளிய தமிழில் காக்கிறது.
- source_word: ὀδύναις πολλαῖς
  choice: பல வேதனைகளால்
  rationale: உடல் வலி, மனத் துயரம், கடும் வருத்தம் ஆகியவற்றை உள்ளடக்கக்கூடிய சொல்லின் பரப்பை ‘வேதனைகள்’ தக்கவைக்கிறது.
theological_decisions:
- issue: பண ஆசைக்கும் தீமைகளுக்கும் உள்ள தொடர்பின் வரம்பு
  choice: பண ஆசை எல்லா வகையான தீமைகளுக்கும் ஒரு வேர்.
  alternative: பண ஆசையே எல்லாத் தீமைக்கும் வேர்.
  rationale: ῥίζα என்பதற்குக் குறிப்புச் சுட்டு இல்லாததும், κακῶν பன்மையில் இருப்பதும், பண ஆசையை ஒவ்வொரு தீமைக்கும் ஒரே காரணமாக்காத வாசிப்பை ஆதரிக்கின்றன. இருப்பினும் பாரம்பரிய வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τῆς πίστεως என்பதன் பொருள்
  choice: கிறிஸ்தவ விசுவாசம் என்ற புறநிலைப் பொருள்
  alternative: ஒருவரின் தனிப்பட்ட நம்பிக்கை என்ற அகநிலைப் பொருள்
  rationale: ஆயர் நிருபங்களில் இடைநிலைச் சுட்டுடன் வரும் ‘விசுவாசம்’ கிறிஸ்தவ நம்பிக்கையின் உள்ளடக்கம் அல்லது கிறிஸ்தவ விசுவாசத்தைக் குறிப்பது வழக்கம். தனிப்பட்ட நம்பிக்கை என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பண ஆசை,’ ‘வழிவிலகி,’ ‘துளைத்துக்கொண்டார்கள்’ ஆகியவை மூலத்தின் கருத்தையும் உருவகத்தையும் காக்கும் இயல்பான சொற்கள். கிரேக்கத்தின் காரண இணைப்பான γάρ ‘ஏனெனில்’ என்று வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது.
