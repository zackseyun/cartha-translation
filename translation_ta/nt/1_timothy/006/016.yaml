source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: ta
  text: அவர் ஒருவரே மரணமின்மை உடையவர்; அணுக முடியாத ஒளியில் வசிப்பவர்; மனிதர்களில் ஒருவரும்[a] அவரைக் கண்டதில்லை; காணவும் முடியாது. அவருக்கு கனம் மற்றும் என்றென்றும் நிலைக்கும் வல்லாட்சி உண்டாவதாக. ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, எந்த மனிதரும் அவரைக் கண்டதில்லை; காணவும் முடியாது.
    reason: ‘மனிதர்களில் ஒருவரும்’ என்ற பகுதிப்பொருள் அமைப்பை, நவீனத் தமிழில் இயல்பான உள்ளடக்கமான சொல்லாக்கத்தில் வழங்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ὁ μόνος ἔχων ἀθανασίαν
  choice: அவர் ஒருவரே மரணமின்மை உடையவர்
  rationale: μόνος என்பதன் தனித்தன்மையை ‘ஒருவரே’ தெளிவாகக் காட்டுகிறது; ἀθανασία என்பதற்கு இயல்பானதும் துல்லியமானதுமான ‘மரணமின்மை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: அணுக முடியாத ஒளியில் வாழ்கிறவர்
  rationale: ἀπρόσιτον என்பதிலுள்ள அணுக இயலாமையைப் பாதுகாத்து, οἰκῶν என்பதை நவீனத் தமிழில் இயல்பான ‘வாழ்கிறவர்’ என வழங்குகிறது.
- source_word: οὐδεὶς ἀνθρώπων
  choice: மனிதர்களில் ஒருவரும்
  rationale: பகுதிப்பொருள் தரும் கிரேக்கப் பன்மை உடைமை வேற்றுமையை நேரடியாகப் பிரதிபலிப்பதோடு, எல்லா மனிதர்களையும் உள்ளடக்கும் பொருளையும் தெளிவாகத் தருகிறது.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: காணவும் முடியாது
  rationale: δύναται குறிக்கும் இயலாமையை விடாமல், தமிழில் சுருக்கமாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: τιμὴ
  choice: கனம்
  rationale: துதிப்புகழ் சூழலில் τιμή குறிக்கும் கௌரவத்தையும் மேன்மைப்படுத்துதலையும் மரியாதைமிக்க தமிழில் வெளிப்படுத்துகிறது.
- source_word: κράτος αἰώνιον
  choice: என்றென்றும் நிலைக்கும் வல்லாட்சி
  rationale: κράτος என்பதை வெறும் ஆற்றலாக அல்லாமல் ஆளும் வல்லமையாகக் காட்டுகிறது; αἰώνιον குறிக்கும் முடிவற்ற நிலைத்தன்மையையும் தெளிவாக்குகிறது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: தமிழ் வேதாகம மற்றும் வழிபாட்டு மொழியில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: சார்புப்பெயர்த் தொடர்களும் துதிப்புகழும் யாரைக் குறிக்கின்றன?
  choice: முந்தைய சூழலில் ‘பாக்கியமுள்ள ஒரே பேரரசர்’ என விவரிக்கப்படும் கடவுளைக் குறிக்கின்றன என்று முதன்மை உரை திறந்த சார்புப்பெயரால் தொடர்கிறது.
  alternative: விரிந்த வாக்கிய அமைப்பில் அருகிலுள்ள குறிப்பை முன்னிறுத்தி, சிலர் இதை ஆண்டவர் இயேசு மெசியாவோடு இன்னும் நேரடியாக இணைத்துப் புரிந்துகொள்கிறார்கள்.
  rationale: யாரும் கண்டதில்லை, காணவும் முடியாது என்ற மறைவுத்தன்மை கடவுளைக் குறிப்பதை மிகவும் இயல்பாக்குகிறது. எனினும், கிரேக்கத்தின் சார்புப்பெயர் தனியே பெயரை மீண்டும் குறிப்பிடாததால், மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் துதிப்புகழுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘வல்லாட்சி’ என்பது அரிதான தொழில்நுட்பச் சொல்லாக இல்லாமல், ஆளும் வல்லமையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
