translation:
  language: ta
  text: ஆனால், மனநிறைவோடு கூடிய இறைப்பற்று பெரும் ஆதாயமாகும்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெரும் இலாபம்’ அல்லது ‘ஆதாயம் பெறுவதற்கான பெரும் வழி’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொல் முந்தைய வசனத்திலும் வரும் ஆதாயம் அல்லது இலாபம் குறித்த சொல்லோடு தொடர்புடையது.
    reason: lexical_alternative
  - marker: b
    text: ‘தன்னிறைவு’ அல்லது ‘போதுமான நிலை’ என்றும் மொழிபெயர்க்கலாம். இங்கே சுயாதீனமான தற்சார்பைவிட மனநிறைவு அல்லது கிடைத்திருப்பதில் திருப்தியடையும் நிலையே பெரும்பாலும் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் இறைப்பற்றை ஆதாயத்திற்கான வழியாகக் கருதுவோருக்கும் இவ்வசனத்தின் உண்மையான ஆதாயத்திற்கும் இடையிலான மென்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: πορισμὸς
  choice: ஆதாயம்
  rationale: ‘ஆதாயம், இலாபம், ஆதாயம் பெறும் வழி’ என்ற பொருள் பரப்பை உடைய சொல்லாகும். முந்தைய வசனத்துடனான சொல்விளையாட்டைத் தக்கவைத்தும் பொருளாதாரச் செல்வம் என்று மிகையாகக் குறுக்காமலும் ‘ஆதாயம்’ அமைகிறது.
- source_word: μέγας
  choice: பெரும்
  rationale: ஆதாயத்தின் மதிப்பை வலியுறுத்தும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: εὐσέβεια
  choice: இறைப்பற்று
  rationale: கடவுளை மதித்து அவரை நோக்கி வாழும் பக்தியுள்ள வாழ்க்கையை இயல்பான தமிழில் குறிக்கிறது; வெறும் வெளிப்புறச் சமயச்சடங்காகப் பொருளைக் குறுக்குவதில்லை.
- source_word: μετὰ
  choice: உடன் கூடிய
  rationale: உடனிருத்தல் அல்லது இணைந்திருத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐταρκείας
  choice: மனநிறைவு
  rationale: அடுத்த வசனங்களில் அடிப்படைத் தேவைகள் கிடைத்தால் திருப்தியடைவது விளக்கப்படுவதால், சுயாதீனமான தன்னிறைவைவிட ‘மனநிறைவு’ சூழலுக்கு ஏற்றது.
theological_decisions:
