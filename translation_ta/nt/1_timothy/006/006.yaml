- issue: இறைப்பற்றுக்கும் ஆதாயத்திற்கும் உள்ள உறவு
  choice: மனநிறைவுடன் கூடிய இறைப்பற்றே பெரும் ஆதாயம்
  alternative: மனநிறைவுடன் இருக்கும்போது இறைப்பற்று பெரும் ஆதாயத்தைப் பெறும் வழி
  rationale: கிரேக்க வாக்கிய அமைப்பு இரு நிழற்பொருள்களுக்கும் இடமளித்தாலும், தெரிவுசெய்த வடிவம் முந்தைய வசனத்தின் சொல்விளையாட்டைக் காத்து, பயன் பெறுவதற்கான கருவியே இறைப்பற்று என்ற கருத்தை பவுல் ஆதரிப்பதாகத் தோன்றுவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவபக்தி’ என்பதற்குப் பதிலாக இயல்பாகவும் கடவுளை நோக்கிய வாழ்க்கையைத் தெளிவாகவும் உணர்த்தும் ‘இறைப்பற்று’ தேர்ந்தெடுக்கப்பட்டது; பொருளிலுள்ள உண்மையான இருமையை அடிக்குறிப்புகள் காக்கின்றன.
