  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: ta
  text: ஓ தீமொத்தேயுவே, உன்னிடம் ஒப்படைக்கப்பட்டதைப் பாதுகாத்துக்கொள்; பரிசுத்தமற்ற வெற்றுப் பேச்சுகளையும், பொய்யாக ‘அறிவு’ என அழைக்கப்படுவதின்[b] முரண்பாடுகளையும்[a] தவிர்த்து விலகு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எதிர்ப்புகளையும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அறிவு என்று சொல்லிக்கொள்ளப்படுவதின்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: ஓ தீமொத்தேயுவே
  rationale: Ὦ என்னும் அழைப்பிடைச்சொல்லின் உணர்ச்சிமிக்க, வலியுறுத்தப்பட்ட நேரடி அழைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: παραθήκην
  choice: உன்னிடம் ஒப்படைக்கப்பட்டதை
  rationale: பாதுகாப்பாக வைத்திருக்க ஒருவரிடம் ஒப்படைக்கப்பட்ட பொருள் அல்லது பொறுப்பு என்ற சொல்லின் உட்பொருளைத் தெளிவாகத் தருகிறது; அது எது என்பதை வசனம் குறிப்பிடாததால் மொழிபெயர்ப்பும் குறிப்பிடவில்லை.
- source_word: φύλαξον
  choice: பாதுகாத்துக்கொள்
  rationale: ஒப்படைக்கப்பட்டதை விழிப்புடன் காத்துப் பேண வேண்டும் என்ற கட்டளையின் வலிமையை வெளிப்படுத்துகிறது.
- source_word: ἐκτρεπόμενος
  choice: விட்டு விலகு
  rationale: ஒன்றிலிருந்து திரும்பி விலகுதல் அல்லது அதைத் தவிர்த்தல் என்ற செயற்படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: βεβήλους
  choice: பரிசுத்தமற்ற
  rationale: புனிதமானதற்கு எதிரான, புனிதத் தன்மையில்லாத பேச்சு என்ற மத-நெறிசார் வேறுபாட்டைக் காக்கிறது.
- source_word: κενοφωνίας
  choice: வெற்றுப் பேச்சுகள்
  rationale: உள்ளடக்கமோ பயனோ இல்லாத பேச்சு என்ற இகழ்ச்சிப் பொருளைத் தெளிவாகவும் நவீனமாகவும் தெரிவிக்கிறது.
- source_word: ἀντιθέσεις
  choice: முரண்பாடுகள்
  rationale: ஒன்றுக்கொன்று அல்லது உண்மைக்கெதிராக நிறுத்தப்படும் கூற்றுகள் என்ற பொருளைத் தருகிறது; ‘எதிர்ப்புகள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: அறிவு என்று பொய்யாக அழைக்கப்படுவதன்
  rationale: அந்தப் போதனை உண்மையான அறிவு அல்ல; ‘அறிவு’ என்ற பெயர் அதற்குப் பொய்யாக வழங்கப்படுகிறது என்பதைக் கிரேக்கச் சொற்றொடருக்கு ஏற்ப வெளிப்படுத்துகிறது.
theological_decisions:
- issue: παραθήκη என்பதன் உள்ளடக்கம்
  choice: ‘உன்னிடம் ஒப்படைக்கப்பட்டதை’ என்று பொதுவாக மொழிபெயர்த்து, அதன் உள்ளடக்கத்தைக் குறிப்பிடாமல் வைத்தல்
  alternative: நற்செய்தி; அப்போஸ்தல போதனை; தீமொத்தேயுவுக்குக் கொடுக்கப்பட்ட ஊழியப் பொறுப்பு
  rationale: சூழலில் அப்போஸ்தல செய்தி குறிக்கப்படலாம்; ஆனால் இவ்வசனமே அதன் உள்ளடக்கத்தை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
- issue: ἀντιθέσεις என்பதன் பொருள்
  choice: முரண்பாடுகள்
  alternative: எதிர்ப்புகள்
  rationale: இச்சொல் எதிர்நிலைகள், எதிர்ப்புகள் அல்லது முரண்படும் வாதங்களைக் குறிக்கலாம். முதன்மை உரையில் ‘முரண்பாடுகள்’ தெளிவாக உள்ளது; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. அழைப்பின் வலிமைக்காக ‘ஓ’ காக்கப்பட்டுள்ளது. παραθήκη என்பதின் மறைபொருளை ஒரு குறிப்பிட்ட கோட்பாட்டு உள்ளடக்கமாகச் சுருக்காமல் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
