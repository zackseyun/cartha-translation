translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான அறிவுறுத்தல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இது முந்தைய வசனத்தில் தொடங்கும் கட்டளையின் உள்ளடக்கத்தைத் தொடர்வதால், தமிழ் வாக்கிய நிறைவுக்காக இறுதியில் ‘வேண்டும்’ சேர்க்கப்பட்டுள்ளது.
