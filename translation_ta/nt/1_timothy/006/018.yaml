translation:
  language: ta
  text: நன்மை செய்யவும், நற்செயல்களில் செல்வந்தர்களாக இருக்கவும், தாராளமாகக் கொடுக்கவும், பகிர்ந்துகொள்ள மனமுள்ளவர்களாக இருக்கவும் வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: நன்மை செய்யவும்
  rationale: நன்மையானதைச் செய்கிற செயற்பாட்டு வலிமையை இயல்பான நவீனத் தமிழில் நேரடியாகக் கூறுகிறது; பெயர்ச்சொல் வடிவில் ‘நற்செயல்கள் செய்யவும்’ என்று மாற்றுவதைத் தவிர்க்கிறது.
- source_word: πλουτεῖν
  choice: செல்வந்தர்களாக இருக்கவும்
  rationale: சுற்றியுள்ள சூழலில் பொருட்செல்வத்துடன் நோக்கமாய் அமைக்கப்பட்டுள்ள முரண்பாட்டைப் பேணுகிறது; இங்கு செல்வ உருவகம் நற்செயல்களின் தளத்துக்குப் பயன்படுத்தப்படுகிறது.
- source_word: ἐν ἔργοις καλοῖς
  choice: நற்செயல்களில்
  rationale: ἐν என்பதன் தளம் அல்லது வட்டம் சார்ந்த பொருளையும், ἔργοις καλοῖς என்பதன் நெறிசார் நன்மையையும் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: εὐμεταδότους
  choice: தாராளமாகக் கொடுக்கவும்
  rationale: தம்மிடமுள்ளவற்றை மனமுவந்து பிறருக்குக் கொடுக்கும் பண்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κοινωνικούς
  choice: பகிர்ந்துகொள்ள மனமுள்ளவர்களாக இருக்கவும்
  rationale: பிறருடன் பகிர்வதற்கான ஆயத்தமான மனப்பாங்கை வெளிப்படுத்துகிறது; ‘கூட்டுறவானவர்கள்’ போன்ற தெளிவற்ற அல்லது வேறு பொருள் தரக்கூடிய சொற்களைத் தவிர்க்கிறது.
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: தாராளமாகக் கொடுக்கவும், பகிர்ந்துகொள்ள மனமுள்ளவர்களாக இருக்கவும்
  rationale: முதல் சொல் கொடுப்பதில் தாராளத்தையும், இரண்டாவது சொல் பகிர்வதற்கான மனப்பாங்கையும் வலியுறுத்துவதால், தொடர்புடைய ஆனால் முற்றிலும் ஒன்றல்லாத இரு கருத்துகளையும் தனித்தனியாகப் பேணுகிறது.
