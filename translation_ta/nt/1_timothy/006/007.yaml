id: 1TI.6.7
reference: 1 Timothy 6:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ⸀ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: ta
  text: ஏனெனில், நாம் உலகத்திற்குள் எதையும் கொண்டுவரவில்லை[a]; எதையும் வெளியே கொண்டுபோகவும் நம்மால் முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “ஏனெனில், நாம் உலகத்திற்குள் எதையும் கொண்டுவரவில்லை; ஏனென்றால்—அல்லது, அதுபோலவே—எதையும் வெளியே கொண்டுபோகவும் நம்மால் முடியாது.” கிரேக்க இணைப்புச் சொல்லை காரணப் பொருளில் (“ஏனென்றால்”) எடுத்துக்கொள்ளலாம்; அல்லது அதற்கு இணையான இரண்டாவது கூற்றை அறிமுகப்படுத்துவதாகப் புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: எதையும் … இல்லை
  rationale: வினையின் செயப்படுபொருளாக வரும் முழுமையான மறுப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ அடிப்படையையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: εἰσηνέγκαμεν
  choice: கொண்டுவரவில்லை
  rationale: εἰσφέρω என்பதன் ‘உள்ளே கொண்டுவருதல்’ என்ற பொருளை, உலகிற்குள் பிறந்து வருவதைக் குறிக்கும் உருவகத்துடன் இயல்பாகத் தருகிறது.
- source_word: εἰς τὸν κόσμον
  choice: உலகத்திற்குள்
  rationale: இங்கு κόσμος என்பது மனிதர் பிறந்து நுழையும் உலகைக் குறிக்கிறது; εἰς என்பதன் உள்ளே செல்லும் திசையையும் ‘உலகத்திற்குள்’ தெளிவாகக் காட்டுகிறது.
- source_word: ὅτι
  choice: ;
  rationale: முதன்மை உரையில் இரு இணையான கூற்றுகளின் சமநிலையை அரைப்புள்ளி மூலம் இயல்பாகக் காட்டுகிறது; இச்சொல்லுக்குள்ள காரணப் பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οὐδὲ … τι
  choice: எதையும் … முடியாது
  rationale: மறுப்பின் கீழ் வரும் காலவரையற்ற சுட்டுப்பெயரை நவீனத் தமிழில் முழுமையான மறுப்பாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξενεγκεῖν
  choice: வெளியே கொண்டுபோக
  rationale: ἐκφέρω என்பதன் ‘வெளியே எடுத்துச் செல்லுதல்’ என்ற இயக்கப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: δυνάμεθα
  choice: நம்மால் முடியாது
  rationale: δύναμαι குறிக்கும் இயலாமையைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ὅτι அறிமுகப்படுத்தும் இரண்டாவது உட்கூற்றின் தொடர்பு
  choice: உலகத்திற்குள் எதையும் கொண்டுவரவில்லை; வெளியே எதையும் கொண்டுபோகவும் முடியாது என்ற இணையான இரு கூற்றுகளாக முதன்மை உரையில் வழங்கப்பட்டது.
  alternative: ‘ஏனென்றால் எதையும் வெளியே கொண்டுபோகவும் நம்மால் முடியாது’ என்ற காரணப் பொருள்.
  rationale: சூழலில் இவ்வசனம் ஒன்றுக்கொன்று இணையான இரண்டு பழமொழித் தன்மையுள்ள உண்மைகளை முன்வைக்கிறது. ஆயினும் ὅτι என்பதைக் காரண இணைப்பாகவும் புரிந்துகொள்ள முடிவதால், அந்த உண்மையான மொழியியல் இருபொருள் வாய்ப்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உலகத்திற்குள் / வெளியே’ என்ற எதிரிணை மூலத்தின் இயக்கப் படிமத்தையும் இரு கூற்றுகளின் சமநிலையையும் காக்கிறது.
