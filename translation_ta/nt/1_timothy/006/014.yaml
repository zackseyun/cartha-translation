id: 1TI.6.14
reference: 1 Timothy 6:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: ta
  text: நம் ஆண்டவராகிய இயேசு மெசியா[a] தோன்றும்வரை, நீ அந்தக் கட்டளையைக் கறைபடாததாகவும் குற்றஞ்சாட்ட இடமில்லாததாகவும் கைக்கொள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு கிறிஸ்து.” கிரேக்க Χριστός என்பது “மெசியா” என்ற பட்டமாகவும், மரபில் பெயரைப்போல் வழங்கப்படும் “கிறிஸ்து” என்ற வடிவிலும் செயல்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “கறைபடாததாகவும் குற்றஞ்சாட்ட இடமில்லாததாகவும்” என்ற சொற்கள் இலக்கணப்படி “கட்டளை” என்பதை விவரிக்கின்றன; ஆனால் கட்டளையைத் தீமொத்தேயு கைக்கொள்ளும் விதத்தையும் அவை கருத்தளவில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῆσαί
  choice: கைக்கொள்
  rationale: முந்தைய வசனத்தில் கொடுக்கப்பட்ட கட்டளையை உண்மையுடன் கடைப்பிடித்துப் பேணுவதைக் குறிக்கிறது; நவீனத் தமிழில் ‘கைக்கொள்’ இந்த இரு நுணுக்கங்களையும் சுருக்கமாகத் தருகிறது.
- source_word: ἐντολήν
  choice: அந்தக் கட்டளை
  rationale: குறிப்பிட்ட ஒருமைச் சொல்; உடனடி சூழலில் முன்பு கொடுக்கப்பட்ட கட்டளையைச் சுட்டுகிறது. தமிழில் ‘அந்த’ என்பது அதன் குறிப்புத்தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄσπιλον
  choice: கறைபடாததாக
  rationale: கறையோ மாசோ இல்லாத நிலையைத் தருகிறது. கிரேக்கத்தில் இது ‘கட்டளை’ என்பதோடு இலக்கண ஒத்திசைவில் இருந்தாலும், கட்டளையைக் கைக்கொள்ளும் விதத்தையும் கருத்தளவில் குறிக்கக்கூடும்.
- source_word: ἀνεπίλημπτον
  choice: குற்றஞ்சாட்ட இடமில்லாததாக
  rationale: நியாயமான குற்றச்சாட்டுக்கு இடமளிக்காத நிலையைக் குறிக்கும் தெளிவான, இயல்பான தமிழ் தொடர்.
- source_word: μέχρι
  choice: வரை
  rationale: எதிர்கால நிகழ்வு வரையிலான கால நீடிப்பைக் குறிக்கிறது.
- source_word: ἐπιφανείας
  choice: தோன்றுதல்
  rationale: காணத்தக்க விதத்தில் வெளிப்படுவதைச் சுட்டுகிறது. வாக்கியத்தில் ‘தோன்றும்வரை’ என வினை வடிவில் வழங்குவது நவீனத் தமிழில் இயல்பானது; ‘மறுபடியும்’ என்று மூலத்தில் இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: இயேசுவுக்குரிய கிறிஸ்தவப் பட்டமாக மரியாதையுடனும் வழக்கமான தமிழிலும் வழங்கப்படுகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு இறுதிக்காலத் தோன்றுதலைச் சார்ந்த முழுப் பட்டத்தில் வருவதால், அதன் பட்டப் பொருளைத் தெளிவாகக் காட்ட ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது; ‘கிறிஸ்து’ என்ற மரபு வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-ஐ வழங்குதல்
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இந்த இறுதிக்காலச் சூழலில் Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பட்ட வலிமை கேட்கிறது. இருப்பினும் அது பெயரைப்போலவும் செயல்படக்கூடியதால் மரபு வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἄσπιλον, ἀνεπίλημπτον ஆகிய பெயரடிகளின் தொடர்பு
  choice: அவற்றை வெளிப்படையாக ‘கட்டளை’ என்பதோடு இணைத்தல்
  alternative: தீமொத்தேயுவின் கட்டளைக் கைக்கொள்ளுதலைக் கறையற்றதும் குற்றமற்றதுமாக விவரித்தல்
  rationale: கிரேக்கப் பெயரடிகள் இலக்கண வடிவில் τὴν ἐντολήν என்பதோடு நேரடியாக ஒத்திசைகின்றன. அதேவேளை, சுருக்கமான கிரேக்க அமைப்பு கைக்கொள்ளும் முறையையும் கருத்தளவில் அனுமதிப்பதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் சுருக்கமான அமைப்பைத் தமிழில் இயல்பாக்கினாலும், பெயரடிகளின் பொருள் தொடர்பிலுள்ள உண்மையான தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
