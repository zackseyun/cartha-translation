base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: ta
  text: விசுவாசிகளான எஜமான்களைக் கொண்டிருப்பவர்கள், அவர்கள் சகோதரர்கள்[a] என்பதால் அவர்களை இகழக் கூடாது. மாறாக, அந்த நற்பயனைப் பெறுகிறவர்கள்[b] விசுவாசிகளும் அன்புக்குரியவர்களுமாய் இருப்பதால், அவர்களுக்கு இன்னும் அதிகமாகப் பணி செய்ய வேண்டும். இவற்றைக் கற்பித்து வலியுறுத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகள்”; கிரேக்கத்தில், “சகோதரர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “அந்த நற்பயனைப் பெறுகிறவர்கள்” என்ற தொடர் பொருள் காணக் கடினமானது. அடிமைகள் செய்யும் பணியால் பயனடையும் விசுவாசிகளான எஜமான்களையே இது பெரும்பாலும் குறிப்பதாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: விசுவாசிகளான
  rationale: இங்கு எஜமான்கள் கிறிஸ்துவில் நம்பிக்கை கொண்டவர்கள் என்பதே சூழல்சார் பொருள்; ‘நம்பத்தகுந்த’ என்பதல்ல.
- source_word: δεσπότας
  choice: எஜமான்கள்
  rationale: அடிமைத்தன வீட்டமைப்பில் உரிமையும் அதிகாரமும் உடையவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: καταφρονείτωσαν
  choice: இகழக் கூடாது
  rationale: அவமதித்தல் அல்லது துச்சமாகக் கருதுதல் என்ற வலுவான தடையைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்கள்
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தையும், சக விசுவாசிகள் என்ற குடும்ப உறவையும் காக்கிறது.
- source_word: μᾶλλον δουλευέτωσαν
  choice: இன்னும் அதிகமாகப் பணிசெய்ய வேண்டும்
  rationale: δουλεύω அடிமை நிலையில் செய்யும் பணியைச் சுட்டினாலும், சமூகச் சூழல் ஏற்கெனவே தெளிவாக இருப்பதால் இயல்பான தமிழில் ‘பணிசெய்ய’ என மொழிபெயர்க்கப்பட்டது; μᾶλλον என்பது ‘இன்னும் அதிகமாக’ எனக் காக்கப்பட்டது.
- source_word: πιστοί
  choice: விசுவாசிகள்
  rationale: கிறிஸ்துவில் நம்பிக்கை கொண்டவர்களைக் குறிக்கும் பெயரடைப் பெயர்ச்சொல் பயன்பாட்டைத் தெளிவாக்குகிறது.
- source_word: ἀγαπητοὶ
  choice: அன்புக்குரியவர்கள்
  rationale: கிறிஸ்தவச் சமூகத்தில் அன்பு செலுத்தப்படுகிறவர்கள் என்ற உறவுசார் பொருளை இயல்பாகத் தருகிறது.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: அந்த நற்பயனைப் பெறுகிறவர்கள்
  rationale: சுருக்கமானதும் விவாதத்துக்குரியதுமான கிரேக்கத் தொடரை மிகையாக விளக்காமல் காக்கிறது; εὐεργεσία-வின் நன்மை/நற்பயன் பொருளையும் ἀντιλαμβάνομαι-யின் பெறுதல்/பயனடைதல் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: இவற்றைக் கற்பித்து வலியுறுத்து
  rationale: தீமோத்தேயுவுக்குக் கொடுக்கப்பட்ட இரு நிகழ்காலக் கட்டளைகளின் போதித்தல் மற்றும் வற்புறுத்தி அறிவுறுத்துதல் ஆகிய வலிமைகளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ἀδελφοί என்பதன் பாலின மற்றும் திருச்சபைச் சமூகப் பொருள்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; உடன்பிறந்தவர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மையை முதன்மை உரையில் காத்து, அது சக விசுவாசிகளை உள்ளடக்கமாகக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: அடிமைத்தனச் சூழலில் சமூக நிலைச் சொற்கள்
  choice: எஜமான்கள் ... பணிசெய்ய வேண்டும்
  alternative: உரிமையாளர்கள் ... அடிமைகளாக இன்னும் அதிகம் உழைக்க வேண்டும்
  rationale: δεσπόται-யின் அதிகார உறவை மறைக்காமல், இவ்வசனத்தில் δοῦλος என்ற பெயர்ச்சொல் இல்லாததால் தமிழில் மிகையாகச் சொற்களைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- issue: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι என்பதன் குறிப்பு
  choice: நற்பயனைப் பெறுகிறவர்கள் என்பது விசுவாசிகளான எஜமான்களைக் குறிப்பதாக வாக்கிய அமைப்பு சுட்டுகிறது
  alternative: பணி செய்கிற அடிமைகள் நன்மையில் பங்குபெறுகிறார்கள்; இரு தரப்பினரும் நன்மையைப் பகிர்கிறார்கள்
  rationale: அருகிலுள்ள இலக்கணத் தொடர்பும் சூழலும் எஜமான்களைப் பயனாளிகளாகச் சுட்டுகின்றன; ஆயினும் கிரேக்கத் தொடர் கடினமும் விவாதத்துக்குரியதும் என்பதால் முதன்மை உரை ‘பணி’ என்று கூடுதல் விளக்கம் சேர்க்காமல் ஓரளவு திறந்தவாறு வைக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமான நடை. அடிமைத்தனத்தின் வரலாற்றுச் சமூக உறவு மறைக்கப்படவில்லை; அதேவேளை மூலத்தில் இல்லாத விளக்கச் சொற்கள் முதன்மை உரையில் திணிக்கப்படவில்லை. [a], [b] குறியீடுகள் உரையில் இடம்பெற்றுள்ளன.
