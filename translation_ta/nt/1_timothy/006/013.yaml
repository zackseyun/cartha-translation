source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: ta
  text: 'எல்லாவற்றுக்கும் உயிரளிக்கும்[a] தேவனுக்கும், பொந்தியு பிலாத்துவின் முன்னிலையில் நல்ல அறிக்கைக்குச் சாட்சியளித்த[c] மெசியாவாகிய இயேசுவுக்கும்[b] முன்பாக, நான் உனக்குக் கட்டளையிடுகிறேன்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாவற்றையும் உயிரோடு காக்கிற,” அல்லது “எல்லாவற்றையும் உயிர்ப்பிக்கிற.” ζῳογονοῦντος என்ற கிரேக்கச் சொல் உயிரைக் கொடுப்பதையோ உயிரோடு காப்பதையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கிறிஸ்து இயேசு.” Χριστός என்பது “மெசியா” என்ற பட்டப்பெயர்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “பொந்தியு பிலாத்துவின் காலத்தில் (அல்லது ஆட்சிக்கீழ்) நல்ல அறிக்கைக்குச் சாட்சியளித்த.”
    reason: source_ambiguity
lexical_decisions:
- source_word: παραγγέλλω
  choice: நான் உனக்குக் கட்டளையிடுகிறேன்
  rationale: இவ்வினைச்சொல் அதிகாரபூர்வமான, உறுதியான கட்டளையைக் குறிக்கிறது. தேவனுக்கும் மெசியாவாகிய இயேசுவுக்கும் முன்பாக வழங்கப்படும் ஆணையின் கனமான தொனியை ‘கட்டளையிடுகிறேன்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἐνώπιον
  choice: முன்பாக
  rationale: தேவனும் இயேசுவும் சாட்சிகளாக இருக்கிறார்கள் என்ற ஆணையின் பயபக்தியான சூழலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ζῳογονοῦντος
  choice: உயிரளிக்கிற
  rationale: இச்சொல் உயிரைக் கொடுப்பதையும் உயிரோடு காப்பதையும் குறிக்கக்கூடும். ‘உயிரளிக்கிற’ என்பது அதன் பரந்த உயிரூட்டும் பொருளைத் தேவையின்றிக் குறுக்காமல் தருகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: τὰ πάντα
  choice: எல்லாவற்றுக்கும்
  rationale: ζῳογονοῦντος என்பதுடன் இணைந்து, படைக்கப்பட்ட அனைத்தையும் உள்ளடக்கும் அதன் முழுமையான பரப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மெசியாவாகிய இயேசு
  rationale: Χριστός இங்கு வெறும் பெயர்போல் அல்லாமல் பட்டப்பெயரின் வலிமையையும் கொண்டிருப்பதால் ‘மெசியாவாகிய’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. வாசகர்களுக்குப் பழக்கமான ‘கிறிஸ்து இயேசு’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: μαρτυρήσαντος
  choice: சாட்சியாகக் கூறிய
  rationale: இயேசு விசாரணைச் சூழலில் வெளிப்படையாக அளித்த சாட்சியைத் தெரிவிக்கிறது; தமிழில் ‘அறிக்கையைச் சாட்சியாகக் கூறிய’ என்பது சட்டரீதியான சாயலையும் நேரடி பொருளையும் இணைக்கிறது.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: பொந்தியு பிலாத்துவின் முன்னிலையில்
  rationale: சாட்சி கூறுதல் என்ற உடனடி சூழலில், பிலாத்துவின் நேர்முக முன்னிலையில் இயேசு சாட்சி அளித்ததை இவ்வாசிப்பு இயல்பாகக் காட்டுகிறது. ‘பிலாத்துவின் காலத்தில்/ஆட்சிக்கீழ்’ என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: நல்ல அறிக்கை
  rationale: ὁμολογία என்பது அறிக்கை, ஒப்புதல் அல்லது விசுவாச அறிக்கை எனப் பொருள்படலாம். ‘நல்ல அறிக்கை’ என்பது καλὴν என்பதையும் அருகிலுள்ள சூழலில் தீமோத்தேயுவின் அறிக்கையுடனான சொல்லிணைப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: சாட்சியும் அறிக்கையும் மையமாக உள்ள இச்சூழலில் அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பெயரின் வலிமை இன்னும் செயலில் உள்ளது. இருப்பினும் பாரம்பரிய ஒலிபெயர்ப்பு மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ζῳογονοῦντος என்பதன் பொருள்
  choice: எல்லாவற்றுக்கும் உயிரளிக்கிற
  alternative: எல்லாவற்றையும் உயிரோடு காக்கிற; எல்லாவற்றையும் உயிர்ப்பிக்கிற
  rationale: கிரேக்கப் பங்கேற்புவினை உயிரைக் கொடுத்தல், உயிர்ப்பித்தல் அல்லது உயிரோடு காத்தல் ஆகிய நுட்பங்களை ஏற்கக்கூடும். முதன்மை உரை பரந்த பொருளைத் தருகிறது; இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: ἐπὶ Ποντίου Πιλάτου என்பதன் தொடர்பு
  choice: பொந்தியு பிலாத்துவின் முன்னிலையில்
  alternative: பொந்தியு பிலாத்துவின் காலத்தில் அல்லது ஆட்சிக்கீழ்
  rationale: விசாரணைச் சூழலில் ‘முன்னிலையில்’ என்பது வலுவான வாசிப்பு. ஆயினும் ἐπί + genitive காலம் அல்லது ஆட்சியையும் குறிக்கக்கூடும்; ஆகவே அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடியதாக இருந்தாலும், சாட்சிகளின் முன்னிலையில் வழங்கப்படும் உறுதியான அப்போஸ்தல ஆணையின் கண்ணியமும் கனமும் தக்கவைக்கப்பட்டுள்ளன. ‘நான் உனக்குக் கட்டளையிடுகிறேன்’ என்பது ஒருமை இரண்டாம் நபரைத் தெளிவாகக் காட்டுகிறது. வாக்கிய முடிவிலுள்ள முக்காற்புள்ளி அடுத்த வசனத்தில் கட்டளையின் உள்ளடக்கம் தொடர்வதைச் சுட்டுகிறது.
