  text: ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις ⸂μεθ’ ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: ta
  text: அதைத் தாங்கள் கொண்டிருப்பதாக உரிமைகோரிய சிலர்[a], விசுவாசத்தைப் பொறுத்தவரை[b] குறி தவறிப் போனார்கள். அருள் உங்கள் அனைவரோடும்[c] இருப்பதாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைத் தாங்கள் கொண்டிருப்பதாகக் கூறிய சிலர்.” கிரேக்கத்தில் முந்தைய வசனத்திலுள்ள ‘அறிவு’ என்பதைக் குறிக்கும் உறவுப்பெயர் வெளிப்படையாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கே “விசுவாசம்” என்பது கிறிஸ்தவ விசுவாசத்தை ஒரு மொத்த நம்பிக்கைத் தொகுப்பாகக் குறிப்பதாகத் தோன்றுகிறது; எனினும் தனிப்பட்ட விசுவாசம் என்றும் புரிந்துகொள்ள முடியும்.
    reason: alternative_reading
  - marker: c
    text: கிரேக்கத்தில் “உங்கள்” என்பது பன்மை; அதனால் வாழ்த்து தீமோத்தேயுவை மட்டுமல்லாமல் அவருடன் இருப்பவர்களையும் உள்ளடக்குகிறது.
    reason: source_detail
lexical_decisions:
- source_word: ἥν
  choice: அதை
  rationale: பெண்பால் ஒருமை உறவுப்பெயர் முந்தைய வசனத்திலுள்ள ‘அறிவு’ என்பதைக் குறிக்கிறது. தமிழில் அதன் தொடர்பை இயல்பாகவும் தெளிவாகவும் காட்ட ‘அதை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπαγγελλόμενοι
  choice: கொண்டிருப்பதாகக் கூறிக்கொண்ட
  rationale: இச்சூழலில் இது வாக்குறுதி அளிப்பதை அல்ல, ஒன்றைத் தாங்கள் பெற்றிருப்பதாக உரிமைபாராட்டுவதைக் குறிக்கிறது.
- source_word: περὶ τὴν πίστιν
  choice: விசுவாசத்தைப் பொறுத்தவரை
  rationale: περί + வேற்றுமை வடிவம் இங்கு தொடர்பு அல்லது விவகாரத்தைச் சுட்டுகிறது; தமிழ் வழக்கில் இதைத் துல்லியமாகத் தெரிவிக்கும் இயல்பான சொற்றொடர் இதுவாகும்.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: இச்சூழலில் கிறிஸ்தவ விசுவாசத்தைக் குறிக்கும் வழக்கமான, கண்ணியமான தமிழ்ச் சொல்; தனிப்பட்ட நம்பிக்கை என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ἠστόχησαν
  choice: குறிதவறிப் போனார்கள்
  rationale: ἀστοχέω என்பதில் உள்ள இலக்கைத் தவறவிடும் உருவகத்தைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது; வெறுமனே ‘தவறு செய்தார்கள்’ என்று பொருளைத் தட்டையாக்கவில்லை.
- source_word: Ἡ χάρις
  choice: அருள்
  rationale: பவுலின் கடித முடிப்பு வாழ்த்தில் χάρις என்பதற்கு இயல்பான, பரவலாகப் புரியக்கூடிய தமிழாக்கம்.
- source_word: μεθ’ ὑμῶν
  choice: உங்கள் அனைவரோடும் இருப்பதாக
  rationale: தமிழில் ஆசிவாக்கியத்தை முழுமைப்படுத்த ‘இருப்பதாக’ சேர்க்கப்பட்டுள்ளது; ὑμῶν பன்மை என்பதை ‘அனைவரோடும்’ வெளிப்படையாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘விசுவாசம்’ என்பதன் பொருள்
  choice: கிறிஸ்தவ விசுவாசம் என்ற மொத்த நம்பிக்கைப் பொருள்
  alternative: ஒருவரின் தனிப்பட்ட விசுவாசம் அல்லது நம்பிக்கை
  rationale: முந்தைய வசனத்தின் பொய்யாக ‘அறிவு’ எனப்படுவதையும், மேய்ப்புக் கடிதங்களில் வரும் பயன்பாட்டையும் கருத்தில் கொண்டால், கிறிஸ்தவ விசுவாசத்திலிருந்து வழுவுதல் என்பது முதன்மையான வாசிப்பு. இருப்பினும் கிரேக்கச் சொல் தனிப்பட்ட விசுவாசத்தையும் குறிக்கக்கூடியதால் அந்த வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: முடிப்பு வாழ்த்தின் பெறுநர்கள்
  choice: பன்மையை வெளிப்படையாகப் பாதுகாத்தல்
  alternative: தீமோத்தேயுவை மட்டும் குறிக்கும் ஒருமையாக மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் ὑμῶν பன்மை. ஆகவே கடிதம் தீமோத்தேயுவுக்கு எழுதப்பட்டிருந்தாலும், இறுதி வாழ்த்து அவருடன் இருக்கும் பரந்த விசுவாசச் சமூகத்தையும் உள்ளடக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், கடித முடிப்புக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘குறிதவறிப் போனார்கள்’ என்பது மூலத்தின் உருவகத்தை இயல்பாகப் பாதுகாக்கிறது. பன்மைத் தன்மை தமிழில் மறைந்துவிடாதபடி ‘அனைவரோடும்’ சேர்க்கப்பட்டுள்ளது.
