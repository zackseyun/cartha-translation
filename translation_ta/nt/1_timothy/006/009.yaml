source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: ta
  text: செல்வந்தராக விரும்புகிறவர்களோ[a] சோதனையிலும், கண்ணியிலும்[b], மதியற்ற, தீங்கு விளைவிக்கும் பல ஆசைகளிலும் விழுகிறார்கள். அந்த ஆசைகள் மனிதர்களை[c] நாசத்திலும் அழிவிலும் மூழ்கடிக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செல்வம் சேர்க்க விரும்புகிறவர்களோ’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் செல்வந்தராக இருப்பதை மட்டுமல்ல, செல்வந்தராக ஆக விரும்புவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பொறி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இங்கே ‘மனிதர்கள்’ என்பது ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι
  choice: விரும்புகிறவர்களோ
  rationale: βούλομαι இங்கு நிலையான விருப்பத்தையோ நோக்கத்தையோ குறிக்கிறது. ‘விரும்புகிறவர்கள்’ என்பது இயல்பான நவீனத் தமிழ்; δέ காட்டும் எதிர்மறைத் திருப்பத்தை ‘-ஓ’ வெளிப்படுத்துகிறது.
- source_word: πλουτεῖν
  choice: செல்வந்தர்களாக
  rationale: இந்த இறந்தகாலமற்ற வினையெச்சம் செல்வம் உடையவர்களாக இருப்பதையோ ஆவதையோ குறிக்கலாம். முதன்மை உரை அந்த விருப்பத்தை இயல்பாகக் கூறுகிறது; ‘செல்வம் சேர்க்க’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐμπίπτουσιν
  choice: விழுகிறார்கள்
  rationale: தீங்கான ஒரு நிலைக்குள் அகப்படுவதைச் சித்தரிக்கும் மூல உருவகத்தைத் தமிழ் இயல்பாகப் பாதுகாக்கிறது.
- source_word: πειρασμόν
  choice: சோதனை
  rationale: இச்சூழலில் பாவத்திற்கு இழுக்கும் சோதனையே முதன்மையான பொருள். ‘சோதனை’ என்பது தமிழில் புரிந்துகொள்ளத்தக்கதும் மூலச்சொல்லின் உருவக அகலத்தை தேவையின்றி சுருக்காததும் ஆகும்.
- source_word: παγίδα
  choice: கண்ணி
  rationale: பிடித்துக்கொள்ள அமைக்கப்படும் பொறி என்ற உயிரோட்டமான உருவகத்தையும் அதன் ஒழுக்க எச்சரிக்கையையும் ‘கண்ணி’ காக்கிறது.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: மதியற்றதும் தீங்கு விளைவிப்பதுமான பல ஆசைகள்
  rationale: ἐπιθυμίαι என்பதற்கு ‘ஆசைகள்’ இயல்பான விரிவுடைய சொல்; ἀνόητος என்பதற்கு ‘மதியற்ற’, βλαβερός என்பதற்கு ‘தீங்கு விளைவிக்கும்’ என்பவை தெளிவான நவீனத் தமிழ்ச் சொற்கள்.
- source_word: αἵτινες
  choice: அந்த ஆசைகள்
  rationale: உறவுப்பெயரின் முன்னிலையைத் தமிழில் தெளிவுபடுத்தி, மனிதர்களை மூழ்கடிப்பது ஆசைகளே என்பதை இயல்பாகக் காட்டுகிறது.
- source_word: βυθίζουσι
  choice: மூழ்கடிக்கின்றன
  rationale: மூழ்கச் செய்வது அல்லது ஆழத்தில் அமிழ்த்துவது என்ற வலுவான செயப்படுத்தும் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τοὺς ἀνθρώπους
  choice: மனிதர்களை
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ‘மனிதர்கள்’ அந்தப் பொதுப்பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: நாசத்திலும் அழிவிலும்
  rationale: இரு நெருங்கிய சொற்களின் திரட்டிய தீவிரத்தைப் பாதுகாத்து, அவற்றை ஒரே சொல்லாகச் சுருக்காமல் வேறுபடுத்துகிறது.
theological_decisions:
- issue: ὄλεθρον καὶ ἀπώλειαν என்பது குறிப்பாக நித்திய தண்டனையையே குறிக்கிறதா
  choice: ‘நாசத்திலும் அழிவிலும்’ என்று பரந்த எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘நித்திய நாசத்திலும் அழிவிலும்’ போன்ற இறுதித் தண்டனையை வெளிப்படையாகக் குறிக்கும் மொழிபெயர்ப்பு
  rationale: இந்தச் சொற்கள் மிகக் கடுமையான விளைவைக் குறிக்கின்றன; ஆனால் இவ்வசனத்திலேயே அதன் கால அளவையோ இறையியல் எல்லையையோ குறிப்பாக வரையறுக்கவில்லை. ஆகவே மூலத்தின் தீவிரமும் திறந்துள்ள பொருள் எல்லையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம எச்சரிக்கையின் வலிமையும் காக்கப்பட்டுள்ளன. ‘கண்ணி’, ‘மூழ்கடிக்கின்றன’ ஆகியவை மூலத்தின் உருவகங்களைப் பாதுகாக்கின்றன; மிகப் பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
