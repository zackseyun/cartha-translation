id: 1TI.6.4
reference: 1 Timothy 6:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: ta
  text: அவன் தற்பெருமையால் வீங்கியிருக்கிறான்[a]; எதையும் புரிந்துகொள்ளாதவனாய், விவாதங்களையும் சொற்போர்களையும் பற்றிய நோயுற்ற பேரார்வம் கொண்டிருக்கிறான்[b]. இவற்றிலிருந்து பொறாமை, சச்சரவு, அவதூறுகள்[c], தீய சந்தேகங்கள் ஆகியவை உண்டாகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தற்பெருமை கொண்டவனாகியிருக்கிறான்.” கிரேக்கச் சொல், பெருமையால் ஒருவர் வீங்கியிருப்பதைப் படிமமாகக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சொற்களைப் பற்றிய சண்டைகள்” அல்லது “சொல் வாக்குவாதங்கள்.”
    reason: lexical_alternative
  - marker: c
    text: இங்கே இது மக்களுக்கு எதிரான அவதூறு அல்லது பழிப்புப் பேச்சைக் குறிக்கிறது; இதே கிரேக்கச் சொல் வேறு சூழல்களில் “தேவதூஷணங்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: தற்பெருமையால் வீங்கியிருக்கிறான்
  rationale: வினைச்சொல்லின் நிறைவுற்ற நிலை உணர்வையும், பெருமையால் வீங்கியிருக்கும் உருவகத்தையும் காக்கிறது; வெறுமனே ‘தற்பெருமை கொண்டிருக்கிறான்’ என்பதைக் காட்டிலும் கிரேக்கத்தின் படிமம் தெளிவாகிறது.
- source_word: μηδὲν ἐπιστάμενος
  choice: எதையும் புரிந்துகொள்ளாமல்
  rationale: வெறும் தகவல் அறிவின்மையை விட, பொருளை உணர்ந்து கொள்ளாத நிலையைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: νοσῶν
  choice: நோயுற்ற பேராவல் கொண்டிருக்கிறான்
  rationale: நோய் என்ற கிரேக்க உருவகத்தைத் தக்கவைத்தபடி, இங்கு அது விவாதங்களுக்கான இயல்பற்ற, தீங்கான நாட்டத்தைக் குறிப்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: περὶ ζητήσεις
  choice: விவாதங்களின்மீது
  rationale: ζητήσεις இச்சூழலில் சர்ச்சைக்குரிய விசாரணைகள் அல்லது விவாதங்களைக் குறிக்கிறது; ‘விவாதங்கள்’ பொதுவாசகருக்கு இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: λογομαχίας
  choice: சொற்போர்கள்
  rationale: λόγος மற்றும் μάχη ஆகியவற்றின் கூட்டுச்சொல் தரும் ‘சொற்களை மையமாகக் கொண்ட போர்/சண்டை’ என்ற வலிமையான படிமத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἐξ ὧν γίνεται
  choice: இவற்றிலிருந்து … உண்டாகின்றன
  rationale: முன்சொல்லப்பட்ட விவாதங்களும் சொற்போர்களும் பின்வரும் தீமைகளுக்குக் காரணமாவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: φθόνος
  choice: பொறாமை
  rationale: பிறருடைய நன்மையைக் கண்டு மனம் புழுங்கும் உணர்வைக் குறிக்கும் வழக்கமான துல்லியமான சொல்.
- source_word: ἔρις
  choice: சச்சரவு
  rationale: மோதல், பிணக்கு, பூசல் ஆகியவற்றை உள்ளடக்கும் சுருக்கமான மதிப்புமிக்க நடைச்சொல்.
- source_word: βλασφημίαι
  choice: அவதூறுகள்
  rationale: இந்த மனித உறவுகள் சார்ந்த தீமைகளின் பட்டியலில், பிறரை இழிவுபடுத்தும் அல்லது பழிக்கும் பேச்சு என்பதே சூழலுக்குப் பொருத்தம்; வேறு சூழல்களில் இதே கிரேக்கச் சொல் தேவதூஷணத்தையும் குறிக்கலாம்.
- source_word: ὑπόνοιαι πονηραί
  choice: தீய சந்தேகங்கள்
  rationale: ὑπόνοιαι என்பதன் சந்தேகம் அல்லது ஐயப்பாடு என்ற பொருளையும், πονηραί தரும் ஒழுக்கத் தீமையையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: βλασφημίαι மனிதர்களுக்கு எதிரான அவதூறையா அல்லது கடவுளுக்கு எதிரான தூஷணத்தையா குறிக்கிறது?
  choice: அவதூறுகள்
  alternative: தேவதூஷணங்கள் / தூஷணப் பேச்சுகள்
  rationale: பொறாமை, சச்சரவு, தீய சந்தேகங்கள் ஆகிய மனித உறவு சார்ந்த தீமைகளின் நடுவில் வருவதால், பிறருக்கு எதிரான பழிப்புப் பேச்சு முதன்மையான சூழல்பொருள். இருப்பினும் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வீங்கியிருக்கிறான்’ மற்றும் ‘நோயுற்ற பேராவல்’ ஆகியவை மூலத்தின் இரு வலுவான உருவகங்களையும் தக்கவைக்கின்றன; அரிதாகத் தோன்றக்கூடிய ‘சொற்போர்கள்’ அடிக்குறிப்பில் விளக்கப்படுகிறது.
