id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: ta
  text: இக்காலத்தில் செல்வந்தர்களாக இருப்பவர்களுக்கு, அகந்தை கொள்ளவோ நிலையற்ற செல்வத்தின்மேல் தங்கள் நம்பிக்கையை வைக்கவோ வேண்டாம்; மாறாக, நாம் அனுபவிப்பதற்காக எல்லாவற்றையும் நமக்குத் தாராளமாக வழங்குகிற கடவுள்மேல்[a] நம்பிக்கை வைக்கும்படி கட்டளையிடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “உயிருள்ள கடவுள்மேல்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι
  choice: இப்போதைய காலத்தில் செல்வந்தர்களாக இருப்பவர்கள்
  rationale: செல்வந்தர்களைக் குறிக்கும் பெயரெச்சப் பயன்பாட்டையும், αἰών என்பதன் காலம்/யுகம் சார்ந்த பொருளையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: παράγγελλε
  choice: கட்டளையிடு
  rationale: இறை மேய்ப்புப் பணிச் சூழலில் வினைச்சொல்லின் அதிகாரபூர்வமான வலிமையை வெளிப்படுத்துகிறது.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: அகந்தை கொள்ளாமல்
  rationale: தன்னை உயர்வாக எண்ணும் மனப்பான்மையைத் தெளிவான, வழக்கிலுள்ள தமிழில் தெரிவிக்கிறது.
- source_word: μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι
  choice: நிலையற்ற செல்வத்தின்மேல் தங்கள் நம்பிக்கையை வைக்காமல்
  rationale: செல்வத்தின் நிச்சயமின்மையைப் பண்பாக வெளிப்படுத்தி, நம்பிக்கையை நிலையாக வைத்திருக்கும் கருத்தையும் காக்கிறது.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: கடவுள்மேல் நம்பிக்கை வைக்கும்படி
  rationale: முந்தைய நம்பிக்கையின் பொருளோடு உள்ள தெளிவான முரண்பாட்டையும் தமிழின் இயல்பான தொடரையும் காக்கிறது.
- source_word: τῷ παρέχοντι ἡμῖν πάντα πλουσίως
  choice: எல்லாவற்றையும் நமக்கு வளமாய் வழங்குகிற
  rationale: தெய்வீக வழங்குதலின் விரிவையும் πλουσίως என்பதன் செல்வச் சொல் தொடர்பையும் முடிந்தவரை காக்கிறது.
- source_word: εἰς ἀπόλαυσιν
  choice: நாம் அனுபவிப்பதற்காக
  rationale: வழங்குதலின் நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; ἡμῖν என்பதால் உள்ளடங்கிய ‘நாம்’ என்பதையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: αἰών என்பதன் நெறி-இறுதிக்காலப் பொருள்
  choice: இப்போதைய காலம்
  alternative: இப்போதைய உலகம்
  rationale: பவுலின் காலப்பிரிவுச் சாயலைக் காக்கிறது; இதை வெறும் பொருளுலகாகக் குறுக்கவில்லை.
- issue: πάντα என்ற தெய்வீக வழங்குதலின் பரப்பு
  choice: எல்லாவற்றையும்
  alternative: தேவையான எல்லாவற்றையும்
  rationale: மூலத்தின் விரிவான சொல்லைத் தேவைகள் மட்டுமே எனக் கட்டுப்படுத்தாமலும், செழிப்பு வாக்குறுதியாக விரிவுபடுத்தாமலும் வைத்திருக்கிறது.
- issue: πλούτου ἀδηλότητι என்ற இலக்கண உறவு
  choice: நிலையற்ற செல்வம்
  alternative: செல்வத்தின் நிச்சயமின்மை
  rationale: செல்வத்தை நம்ப முடியாதது என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; மாற்று வடிவம் அதே கருத்தை பெயர்ச்சொல் அமைப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘வளமாய்’ என்பது செல்வம்/வளம் என்ற சொல் எதிரொலியை ஓரளவு காக்கிறது. SBLGNT உரையில் θεῷ என்பதற்கு முன் ἐπὶ இருப்பதும், சில பிரதிகளில் θεῷ என்பதற்கு ‘உயிருள்ள’ என்ற விரிவாக்கம் இருப்பதும் குறிப்பு மூலம் சுட்டப்படுகிறது.
