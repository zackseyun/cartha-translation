id: 1TI.6.1
reference: 1 Timothy 6:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: ta
  text: நுகத்தின் கீழ் இருக்கும் அடிமைகள்[a] அனைவரும், தங்கள் சொந்த எஜமானர்களை எல்லா மரியாதைக்கும் உரியவர்களாகக் கருதட்டும்; அவ்வாறு கடவுளுடைய பெயரும் போதனையும்[b] இழிவுபடுத்தப்படாதபடி[c] இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘பணியாளர்கள்’ அல்லது ‘அடிமைப் பணியாளர்கள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கம்: δοῦλοι. ‘நுகத்தின் கீழ்’ என்ற சொற்றொடர் கட்டுப்பட்ட அடிமை நிலையை வெளிப்படையாக்குவதால் இங்கு ‘அடிமைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘உபதேசமும்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘தூஷிக்கப்படாதபடி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: ὑπὸ ζυγόν (‘நுகத்தின்கீழ்’) என்ற சொற்றொடர் கட்டுப்பட்ட அடிமை நிலையைக் குறிப்பாக வெளிப்படுத்துவதால், பொதுவான ‘பணியாளர்கள்’ என்பதைக் காட்டிலும் ‘அடிமைகள்’ மூலத்தின் சமூக உண்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὑπὸ ζυγὸν
  choice: நுகத்தின்கீழ்
  rationale: அடிமைப்படுத்தப்பட்ட கீழ்ப்படிதல் நிலையைக் காட்டும் கிரேக்க உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: δεσπότας
  choice: எஜமானர்கள்
  rationale: இங்கு அடிமைகள்மீது அதிகாரம் செலுத்தும் வீட்டுத் தலைவர்களைக் குறிக்கிறது; ‘எஜமானர்கள்’ என்பது சூழலுக்கேற்ற, புரிந்துகொள்ள எளிய தமிழ் சொல்.
- source_word: ἰδίους
  choice: தங்கள் சொந்த
  rationale: பொதுவாக எல்லா எஜமானர்களையும் அல்ல, அவரவர் தொடர்புடைய குறிப்பிட்ட எஜமானர்களையே கிரேக்கம் சுட்டுவதைக் காக்கிறது.
- source_word: πάσης τιμῆς ἀξίους
  choice: முழு மதிப்புக்கும் உரியவர்கள்
  rationale: πάσης என்பதன் முழுமையான பரப்பையும் ἀξίους என்பதன் தகுதிக் கருத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἡγείσθωσαν
  choice: கருதட்டும்
  rationale: தொடர்ந்து கொண்டிருக்க வேண்டிய மதிப்பீட்டு மனப்பாங்கைக் குறிக்கும் நிகழ்காலக் கட்டளையின் வலிமையைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: கடவுளுடைய பெயர்
  rationale: கடவுளின் வெளிப்பட்ட அடையாளத்தையும் நற்பெயரையும் குறிக்கும் வேதாகமக் கருத்தை நேரடியாகக் காக்கிறது.
- source_word: ἡ διδασκαλία
  choice: போதனை
  rationale: பிற்காலத் தொழில்நுட்பச் சமயப் பொருளை தேவையின்றி ஏற்றாமல், கிறிஸ்தவச் செய்தியாகப் போதிக்கப்படுவதைக் குறிக்கும் எளிய நவீன சொல்.
- source_word: βλασφημῆται
  choice: பழித்துப் பேசப்படாதபடி
  rationale: கடவுளுடைய பெயர் மற்றும் போதனை ஆகிய இரண்டையும் இழிவாகப் பேசுதல் என்ற பொருளை, இரண்டுக்கும் இயல்பாகப் பொருந்தும் தமிழில் அளிக்கிறது; ‘தூஷிக்கப்படுதல்’ என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ὅσοι εἰσὶν
  choice: இருக்கும் அனைவரும்
  rationale: ὅσοι என்பதன் உள்ளடக்கும் முழுமையை இயல்பான தமிழ் தொடரில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சமூக மற்றும் ஒழுக்க உணர்வுள்ள சூழலில் δοῦλοι என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: பணியாளர்கள்; அடிமைப் பணியாளர்கள்
  rationale: ‘நுகத்தின்கீழ்’ என்பது கட்டுப்பட்ட அடிமை நிலையை வெளிப்படையாகச் சுட்டுவதால் ‘அடிமைகள்’ மூலத்தின் வரலாற்றுச் சமூக நிலையை மறைக்காமல் காட்டுகிறது. இது அடிமை முறையை ஆதரிப்பதாக அல்ல; உரை முன்வைக்கும் சூழலைத் துல்லியமாக பிரதிபலிப்பதாகும்.
- issue: διδασκαλία என்பதன் மொழிபெயர்ப்பு
  choice: போதனை
  alternative: உபதேசம்
  rationale: இங்கு கிறிஸ்தவச் செய்தியின் பொதுமக்கள் மத்தியிலான நற்பெயர் கருத்தில் உள்ளது. ‘போதனை’ என்பது கிரேக்கத்தின் பொருளை இயல்பாகக் காட்டி, தேவையற்ற தொழில்நுட்பச் சமயச் சாயலைத் தவிர்க்கிறது.
- issue: βλασφημῆται என்பதன் ஒரே வினைச்சொல் கடவுளின் பெயருக்கும் போதனைக்கும் பொருந்துவது
  choice: பழித்துப் பேசப்படாதபடி
  alternative: தூஷிக்கப்படாதபடி
  rationale: கிரேக்கத்தில் ஒரே வினைச்சொல் இரண்டு எழுவாய்களுக்கும் பொருந்துகிறது. ‘பழித்துப் பேசப்படுதல்’ இரண்டுடனும் இயல்பாக இணைந்து, அவதூறு அல்லது நிந்தனை என்ற பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்துக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘நுகம்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டுள்ளது; ‘அடிமைகள்’ என்ற வரலாற்று ரீதியாகக் கடினமான சொல்லும் மென்மையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது. வாக்கியத்தின் நோக்கப்பகுதி தமிழில் இயல்பாக அமைய நடுப்பகுதிக்கு நகர்த்தப்பட்டாலும், மூலத்தின் தர்க்கத் தொடர்பும் கட்டளையின் வலிமையும் காக்கப்பட்டுள்ளன.
