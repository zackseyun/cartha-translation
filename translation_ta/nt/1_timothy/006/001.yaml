revisions:
- from: நுகத்தின்கீழ் அடிமைகளாக[a] இருக்கும் அனைவரும், கடவுளுடைய பெயரும் போதனையும்[b] பழித்துப் பேசப்படாதபடி[c], தங்கள் சொந்த எஜமானர்களை முழு மதிப்புக்கும் உரியவர்களாகக் கருதட்டும்.
  to: நுகத்தின் கீழ் இருக்கும் அடிமைகள்[a] அனைவரும், தங்கள் சொந்த எஜமானர்களை எல்லா மரியாதைக்கும் உரியவர்களாகக் கருதட்டும்; அவ்வாறு கடவுளுடைய பெயரும் போதனையும்[b] இழிவுபடுத்தப்படாதபடி[c] இருக்கும்.
  rationale: The revision clarifies the passive force of βλασφημῆται, improves the rendering of πάσης τιμῆς, and uses a natural Tamil command-then-purpose structure. It retains the original’s social-historical specificity and its single passive predicate governing both ‘God’s name’ and ‘the teaching.’
