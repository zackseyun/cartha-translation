id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: ta
  text: யாராவது வேறுபட்ட போதனையைப் போதித்து, நம் ஆண்டவராகிய இயேசு மெசியாவின் ஆரோக்கியமான வார்த்தைகளுக்கும் இறைப்பற்றுக்கு இசைவான போதனைக்கும் இணங்காதிருந்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: வேறுபட்ட போதனையைப் போதித்து
  rationale: ஏற்றுக்கொள்ளப்பட்ட அப்போஸ்தலப் போதனையிலிருந்து வேறான ஒன்றைப் போதிப்பதைச் சொல்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘பொய்யான’ என்ற மதிப்பீட்டைச் சேர்க்காமல் வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: προσέρχεται
  choice: ஏற்றுக்கொள்ளாதவன்
  rationale: சொல்லுக்குச் சொல் ‘அணுகுதல்’ என்றாலும், இங்கு வேற்றுமை உருபுடன் ஒரு போதனையை ஏற்றுக்கொண்டு அதைப் பற்றிக்கொள்வது என்ற சூழல்சார் பொருள் உள்ளது. நவீன தமிழில் ‘ஏற்றுக்கொள்ளுதல்’ இயல்பாக உள்ளது.
- source_word: ὑγιαίνουσι λόγοις
  choice: நலமான வார்த்தைகள்
  rationale: ὑγιαίνω என்பதிலுள்ள ஆரோக்கிய உருவகத்தையும் λόγοις என்பதிலுள்ள ‘வார்த்தைகள்’ என்ற பொருளையும் தக்கவைக்கிறது; ‘சரியான போதனை’ எனச் சுருக்கி விடவில்லை.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: நம் ஆண்டவராகிய இயேசு மெசியாவின்
  rationale: ‘நலமான வார்த்தைகள்’ யாருடையவை அல்லது யாரிடமிருந்து வந்தவை என்பதை மரபுத்தொடர் காட்டுகிறது. தமிழில் உரிமைத் தொடர்பால் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: இங்கு Ἰησοῦ Χριστοῦ என்ற முழுப் பட்டப்பெயரில் அபிஷேகம் செய்யப்பட்டவர் என்ற தலைப்புப் பொருள் செயலில் உள்ளது; ஆகவே ஒலிபெயர்ப்பான ‘கிறிஸ்து’ என்பதற்குப் பதில் பொருள் வெளிப்படும் ‘மெசியா’ பயன்படுத்தப்பட்டது.
- source_word: κατ’ εὐσέβειαν
  choice: இறைப்பற்றுக்கு இசைவான
  rationale: κατά இங்கு ஒத்திசைவு அல்லது பொருந்துதலைக் குறிக்கிறது. காரண விளைவாக மிகைப்படுத்தாமல், போதனையும் இறைநோக்கிய வாழ்வும் ஒன்றுக்கொன்று இசைவதைத் தெரிவிக்கிறது.
- source_word: διδασκαλίᾳ
  choice: போதனை
  rationale: கற்பிக்கும் செயல் அல்லது கற்பிக்கப்படும் உள்ளடக்கம் இரண்டையும் குறிக்கக்கூடிய சொல்லாகும்; இச்சூழலில் போதனையின் உள்ளடக்கம் முன்னிலையில் உள்ளது.
- source_word: εὐσέβειαν
  choice: இறைப்பற்று
  rationale: கடவுளை மதித்து அவரை நோக்கிய பக்தியுடனும் நடத்தையுடனும் வாழ்வதைக் குறிக்கிறது. ‘பக்தி’ மட்டும் தரக்கூடிய குறுகிய சமய உணர்வைத் தவிர்த்து, நவீன தமிழில் தெளிவான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-வை எவ்வாறு வழங்குவது
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός இங்கு வெறும் நிலைபெற்ற பெயராக மட்டுமல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பட்டப்பொருளையும் தாங்குகிறது. எனவே பட்டத்தின் அர்த்தத்தை வெளிப்படுத்தும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: κατ’ εὐσέβειαν என்பதன் தொடர்பு
  choice: இறைப்பற்றுக்கு இசைவான
  alternative: இறைப்பற்றை உண்டாக்கும்
  rationale: மூலம் போதனை இறைப்பற்றுடன் ஒத்துப்போகிறதா அல்லது அதற்கு வழிநடத்துகிறதா என்ற அர்த்த நிழலுக்கு இடமளிக்கலாம். காரணத்தை மட்டும் நிர்ணயிக்காமல் ஒத்திசைவை முதன்மைப்படுத்துகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டது. ‘நலமான வார்த்தைகள்’ மூலம் மூலத்தின் ஆரோக்கிய உருவகம் பாதுகாக்கப்பட்டது.
