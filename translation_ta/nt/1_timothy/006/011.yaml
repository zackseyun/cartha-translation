id: 1TI.6.11
reference: 1 Timothy 6:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: ta
  text: நீயோ, தேவனுடைய மனிதனே, இவற்றைவிட்டு ஓடிப்போ; நீதியையும்[a], இறைப்பற்றையும், விசுவாசத்தையும்[b], அன்பையும், தளராமையையும், மென்மையையும்[c] நாடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நியாயம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நம்பகத்தன்மை’ அல்லது ‘நம்பிக்கை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அரிதாகப் பயன்படும் கிரேக்கச் சொல்லை ‘தாழ்மை,’ ‘சகிப்புத்தன்மை,’ அல்லது ‘பொறுமையுள்ள மென்மை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: நீயோ
  rationale: வலியுறுத்தப்பட்ட இரண்டாம் நபர் சுட்டுப்பெயரையும், முந்தைய கருத்துகளுடன் δέ காட்டும் தெளிவான முரண்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: தேவனுடைய மனிதனே
  rationale: தீமோத்தேயுவை நோக்கிய ஆண்பால் ஒருமை விளிப்பையும், வேதாகமத்தில் காணப்படும் ‘தேவனுடைய மனிதன்’ என்ற அடையாளத்தையும் காக்கிறது.
- source_word: ταῦτα φεῦγε
  choice: இவற்றைவிட்டு ஓடிப்போ
  rationale: முன்னர் குறிப்பிடப்பட்ட தீய காரியங்களைத் தொடர்ந்து தவிர்க்க வேண்டும் என்ற நிகழ்காலக் கட்டளையின் அவசரத்தையும் வலிமையையும் வெளிப்படுத்துகிறது.
- source_word: δίωκε
  choice: நாடு
  rationale: தீமையிலிருந்து விலகுவது மட்டுமல்லாமல் நற்குணங்களைச் செயலோடு பின்தொடர வேண்டும் என்ற இணைக் கட்டளையை இயல்பான தமிழில் தருகிறது.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: ஒழுக்கமும் உறவுகளும் சார்ந்த நேர்மையான நிலையைச் சுருக்கமாகக் குறிக்கிறது; ‘நியாயம்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εὐσέβειαν
  choice: இறைப்பற்று
  rationale: கடவுளை மதித்து அவரை மையமாகக் கொண்டு வாழும் பக்திநிறைந்த வாழ்க்கையை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: πίστις என்பதற்கான முதன்மையான வேதாகமப் பொருளைத் தருகிறது; நற்குணப் பட்டியலில் சாத்தியமான ‘நம்பகத்தன்மை’ மற்றும் ‘நம்பிக்கை’ ஆகிய பொருள்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: இந்த நற்குணத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தும் வழக்கமான தமிழ் சொல்.
- source_word: ὑπομονήν
  choice: நிலைத்திருத்தல்
  rationale: அழுத்தம் மற்றும் துன்பத்தின் கீழும் தளராமல் தொடரும் உறுதியைக் குறிக்கிறது; வெறும் காத்திருக்கும் பொறுமை என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: πραϋπαθίαν
  choice: சாந்தம்
  rationale: அரிதான இச்சொல்லிலுள்ள மென்மை, தன்னடக்கம், பொறுமையான சகிப்பு ஆகிய நுணுக்கங்களுக்கு வாசிக்க எளிதான முதன்மைத் தமிழாக்கமாகும்; விரிந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ὦ ἄνθρωπε θεοῦ என்பதிலுள்ள பாலினம் குறித்த நேரடி அழைப்பு
  choice: தேவனுடைய மனிதனே
  alternative: தேவனுக்குரியவரே
  rationale: மூலத்தில் தீமோத்தேயுவை நோக்கிய ஆண்பால் ஒருமை விளிப்பு இருப்பதால் அதை பாலினப் பொதுமையாக்காமல் பாதுகாக்கிறது.
- issue: δικαιοσύνη என்பதன் பொருள் பரப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: நற்குணப் பட்டியலில் ஒழுக்க நேர்மையைக் குறிக்கும் வாசிப்பு பொருத்தமானது; சமூக அல்லது நீதித்துறை நியாயம் என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: நற்குணப் பட்டியலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பகத்தன்மை அல்லது நம்பிக்கை
  rationale: ‘விசுவாசம்’ முதன்மைப் பொருளைத் தருகிறது; ஆனால் இச்சூழலில் ஒருவரின் நம்பகத்தன்மையையோ நம்பிக்கையையோ குறிக்கக்கூடிய தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: அரிதான πραϋπαθία என்பதன் நுணுக்கம்
  choice: சாந்தம்
  alternative: மென்மை, சகிப்புத்தன்மை, அல்லது பொறுமையான சாந்தம்
  rationale: இச்சொல் அரிதாக இருப்பதால் அதன் துல்லியமான நுணுக்கத்தை உறுதியாகக் குறுக்காமல், வாசிக்க இயல்பான முதன்மைச் சொல்லுடன் மாற்று வாய்ப்புகளும் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நீயோ’ என்பது வாக்கியத்தின் தொடக்க முரண்பாட்டை இயல்பாகக் காட்டுகிறது. பட்டியலின் ஒவ்வொரு பெயர்ச்சொல்லுக்கும் ‘-ஐயும்’ உருபு சேர்த்து ஓசை மற்றும் இலக்கண ஒற்றுமை பேணப்பட்டுள்ளது; அரிதான இறுதிக் கிரேக்கச் சொல்லின் நுணுக்கம் முதன்மை உரையைச் சுமையாக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
