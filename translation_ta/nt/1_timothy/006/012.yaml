source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: ta
  text: விசுவாசத்தின் நல்ல போராட்டத்தைப் போராடு[a]. நீ அழைக்கப்பட்ட நித்திய வாழ்வைப் பற்றிக்கொள்; பல சாட்சிகள் முன்னிலையில் நீ நல்ல ஒப்புதலை வெளிப்படுத்தினாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசத்தால் வகைப்படுத்தப்படும் நல்ல போராட்டம்’ என்றும், ‘கிறிஸ்தவ விசுவாசத்திற்கான நல்ல போராட்டம்’ என்றும் கிரேக்கச் சொற்றொடரைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘நீ அழைக்கப்பட்ட நித்திய வாழ்வைப் பற்றிக்கொள்; அதைப் பற்றி பல சாட்சிகள் முன்னிலையில் நீ நல்ல ஒப்புதலை வெளிப்படுத்தினாய்.’ ஒப்புதலின் உள்ளடக்கம் என்ன என்பதை கிரேக்க உரை வெளிப்படையாகக் கூறவில்லை; எனினும் நித்திய வாழ்வுக்கான அழைப்புடன் அது நெருக்கமாக இணைக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: நல்ல போராட்டத்தைப் போராடு
  rationale: வினைச்சொல்லிலும் பெயர்ச்சொல்லிலும் உள்ள ஒரே வேர்ச்சொல் சார்ந்த வலியுறுத்தலை முடிந்தவரைத் தக்கவைக்கிறது; தொடர்ச்சியான, தீவிரமான முயற்சியைக் கோரும் கட்டளையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῆς πίστεως
  choice: விசுவாசத்தின்
  rationale: கிரேக்க உரையின் உரிமைவேற்றுமை அமைப்பைத் தக்கவைத்து, விசுவாசத்தால் பண்புபெறும் போராட்டமா அல்லது கிறிஸ்தவ விசுவாசத்திற்கான போராட்டமா என்ற உண்மையான இருபொருள் வாய்ப்பைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: ἐπιλαβοῦ
  choice: பற்றிக்கொள்
  rationale: உறுதியாகப் பிடித்துக்கொள்ளுமாறு கூறும் தீர்மானமான கட்டளையையும் உருவகத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῆς αἰωνίου ζωῆς
  choice: நித்திய வாழ்வை
  rationale: குறிப்பிட்ட இறுதிக்கால வாழ்வைக் குறிக்கும் சொற்றொடரைத் தெளிவாகவும் வழக்கமான நவீன தமிழிலும் தருகிறது.
- source_word: εἰς ἣν ἐκλήθης
  choice: நீ அழைக்கப்பட்ட
  rationale: நித்திய வாழ்வே அழைப்பின் இலக்கு என்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; அழைப்பின் இறையியல் செயல்முறையை மேலதிகமாக விளக்கவில்லை.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: நல்ல அறிக்கையை
  rationale: பொதுவாக வெளிப்படுத்தப்பட்ட ஒப்புதல் அல்லது விசுவாச அறிக்கை என்ற பொருளைத் தருகிறது; καλός என்பதன் மதிப்பீட்டு நுணுக்கத்தையும் முந்தைய ‘நல்ல போராட்டம்’ என்பதுடனான இணைப்பையும் காக்கிறது.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: பல சாட்சிகளுக்கு முன்பாக
  rationale: பலர் முன்னிலையில் நிகழ்ந்த பொது அறிக்கையை நேரடியாகக் கூறுகிறது; μάρτυρες என்பதற்கு இங்கு ‘சாட்சிகள்’ என்ற பொருளையே தருகிறது.
theological_decisions:
- issue: τῆς πίστεως என்பதில் πίστις சொல்லின் பொருள்
  choice: ‘விசுவாசத்தின்’ என்று அமைப்பைத் தக்கவைத்தல்
  alternative: ‘விசுவாசத்திற்கான’ அல்லது ‘விசுவாசத்தினால் நடத்தப்படும்’ போராட்டம்
  rationale: மேய்ப்பர் திருமுகங்களில் இது கிறிஸ்தவ விசுவாசத்தைத் திட்டவட்டமாகக் குறிக்கக்கூடும்; அதேவேளை தனிப்பட்ட விசுவாசத்தால் பண்புபெறும் போராட்டம் என்ற வாசிப்பும் இலக்கணரீதியாகச் சாத்தியம். தமிழ் உரிமைவேற்றுமை இரண்டையும் ஓரளவு திறந்தே வைக்கிறது; அடிக்குறிப்பு வேறுபாட்டை விளக்குகிறது.
- issue: நல்ல அறிக்கைக்கும் நித்திய வாழ்வுக்கான அழைப்புக்கும் இடையிலான தொடர்பு
  choice: அறிக்கையை தனித்த இணைநிலை வாக்கியமாக வழங்குதல்
  alternative: ‘அதைக் குறித்து நீ நல்ல அறிக்கையை அளித்தாய்’ என்று நித்திய வாழ்வோடு வெளிப்படையாக இணைத்தல்
  rationale: கிரேக்க καί அறிக்கையை அழைப்புடன் இணைக்கிறது; ஆனால் அறிக்கையின் உள்ளடக்கம் நித்திய வாழ்வே என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே முதன்மை உரை உறவைத் திறந்துவைத்து, சாத்தியமான நெருக்கமான தொடர்பை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘போராட்டத்தைப் போராடு’ என்ற வேர்ச்சொல் மீளுரைத்தல் தமிழில் சற்றுக் கூர்மையாக ஒலித்தாலும், மூலத்தின் ἀγωνίζου/ἀγῶνα சொல்லணியை வேண்டுமென்றே பிரதிபலிக்கிறது. ‘அறிக்கை அளித்தாய்’ என்பது பொதுமக்கள் புரிந்துகொள்ளும் மொழியாகவும், குறிப்பிட்ட சபை மரபின் தொழில்நுட்பச் சொல்லைத் திணிக்காததாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளது.
