  text: But if we have food and covering[a], we will be content with these.
translation:
  language: ta
  text: ஆனால், உணவும் மூடிக்கொள்ளத் தேவையானவையும்[a] நமக்கு இருந்தால், இவற்றோடு திருப்தியடைவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உடை’; கிரேக்கச் சொல் ஒருவரை மூடுவதை விரிவாகக் குறிக்கலாம்; உறைவிடமும் இதில் அடங்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: நமக்கு இருந்தால்
  rationale: இந்தப் பங்கேற்புவினை முதன்மை வினைக்கான சூழ்நிலையைச் சுட்டுகிறது. தமிழில் நிபந்தனைத் தொனியுடன் அமைப்பது இயல்பாகவும், கிரேக்கத்தின் பொதுவான சூழ்நிலை அல்லது நிபந்தனைப் பொருளைத் திறந்தவாறும் வைத்திருக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தின் கருத்திலிருந்து இங்கு வரும் மென்மையான மாறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: διατροφὰς
  choice: உணவு
  rationale: வாழ்வாதாரத்திற்கு வேண்டிய ஊட்டத்தை, குறிப்பாக உணவை, இச்சொல் குறிக்கிறது; நவீன தமிழில் இதுவே இயல்பான தெரிவு.
- source_word: σκεπάσματα
  choice: மூடிக்கொள்ளத் தேவையானவை
  rationale: உடலை மூடும் உடை போன்றவற்றைக் குறிக்கும் இச்சொல்லின் அடிப்படைப் பொருளைப் பாதுகாக்கிறது; ‘உடை’ என்று மட்டும் குறுக்காமல், சாத்தியமான விரிவான பொருளுக்கும் இடமளிக்கிறது.
- source_word: τούτοις
  choice: இவற்றோடு
  rationale: முன் குறிப்பிடப்பட்ட அடிப்படைத் தேவைகளையே சுட்டும் பன்மைச் சுட்டுப்பெயரின் வலிமையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἀρκεσθησόμεθα
  choice: திருப்தியடைவோம்
  rationale: எதிர்காலக் குறிப்பு வினையின் வடிவத்தையும், போதுமென்று மனநிறைவு அடையும் பொருளையும் காக்கிறது; இதை ‘திருப்தியடைவோமாக’ என்ற அறிவுரையாக மாற்றவில்லை.
theological_decisions:
- issue: σκεπάσματα என்பதன் பொருள் வரம்பு
  choice: உடையை உள்ளடக்கும், ஆனால் அதற்கு மட்டும் கட்டுப்படாத ‘மூடிக்கொள்ளத் தேவையானவை’
  alternative: ‘உடை’ மட்டும் அல்லது ‘உறைவிடம்’ மட்டும்
  rationale: கிரேக்கச் சொல் மூடுவது என்ற விரிவான பொருளைக் கொண்டிருப்பதால், மொழிபெயர்ப்பு அதை உடை அல்லது உறைவிடம் என்ற ஒன்றுக்கு மட்டும் செயற்கையாகக் கட்டுப்படுத்தக் கூடாது. அடிப்படைத் தேவைகள் கிடைத்தால் திருப்தியாய் இருப்பது என்ற வசனத்தின் வலிமையும் இதனால் நிலைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மூடிக்கொள்ளத் தேவையானவை’ என்பது சற்றே விளக்கத் தன்மை கொண்டிருந்தாலும், மூலச்சொல்லின் பொருள் அகலத்தைத் தமிழில் பாதுகாக்கிறது.
