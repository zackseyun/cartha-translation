  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: ta
  text: மனம் சீர்கெட்டவர்களும் உண்மையிலிருந்து விலக்கப்பட்டவர்களுமான மனிதர்களிடையே ஓயாத உரசல்கள்[a] உண்டாகின்றன. இறைப்பற்று ஆதாயம் பெறுவதற்கான வழி என்று அவர்கள் கருதுகிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஓயாத சச்சரவுகள்’ அல்லது ‘தொடர்ந்த வாக்குவாதங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல், ஒருவரோடு ஒருவர் தொடர்ந்து உரசிக்கொள்வதைப் போன்ற மோதலைச் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இறைப்பற்றே ஆதாயம்’ அல்லது ‘இறைப்பற்று ஆதாயத்தின் ஊற்று’ என்றும் மொழிபெயர்க்கலாம். கடவுள்மீதான பற்றை பொருளாதார நன்மைக்காகப் பயன்படுத்தக்கூடிய ஒன்றாக அவர்கள் கருதுகிறார்கள் என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: ஓயாத உரசல்கள்
  rationale: தொடர்ந்து ஒருவரோடு ஒருவர் உரசிக்கொள்வதை உருவகமாகக் காட்டும் அரிய கிரேக்கச் சொல்லின் தொடர்ச்சியையும் மோதல் சார்ந்த படிமத்தையும் இது இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: διεφθαρμένων … τὸν νοῦν
  choice: மனம் சீர்கெட்டவர்கள்
  rationale: மனம் அல்லது சிந்தனை ஊழலடைந்து அதன் விளைவில் நிலைத்திருக்கும் நிலையைக் குறிக்கும் நிறைவுற்ற செயப்பாட்டு வடிவத்தைத் தெளிவாக வெளிப்படுத்துகிறது; ‘முற்றிலும் ஒழுக்கங்கெட்டவர்கள்’ என்று பொருளை மிகைப்படுத்தவில்லை.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: உண்மையை இழந்தவர்கள்
  rationale: உண்மையிலிருந்து விலக்கப்பட்டதன் விளைவாக அது இல்லாத நிலையில் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; யார் அதைப் பறித்தார் என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: νομιζόντων
  choice: கருதுகிறார்கள்
  rationale: இவர்கள் கொண்டிருக்கும் தவறான மதிப்பீட்டை இயல்பாகக் குறிக்கிறது. அதன் தவறான தன்மையைச் சுற்றியுள்ள கண்டனச் சூழல் தெளிவுபடுத்துகிறது.
- source_word: πορισμὸν
  choice: ஆதாயம் பெறுவதற்கான வழி
  rationale: ‘ஆதாயம்’ என்பதோடு, இறைப்பற்றைத் தமக்குப் பயன் ஈட்டும் கருவியாகக் கருதும் கருத்தையும் predicative construction-இன் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: εὐσέβειαν
  choice: இறைப்பற்று
  rationale: கடவுளை நோக்கிய பயபக்தியும் அதற்கேற்ற வாழ்வும் என்ற நேர்மறையான பொருளைக் காக்கிறது; வெறும் வெளிப்புற மதச்சடங்கு என்று குறுக்கவில்லை.
theological_decisions:
- issue: εὐσέβεια உண்மையான கடவுள் நோக்கிய பற்றைக் குறிக்கிறதா, வெறும் வெளிப்புற மதத்தைக் குறிக்கிறதா
  choice: இறைப்பற்று
  alternative: மதப்பற்று; பக்தி; தேவபக்தி
  rationale: கிரேக்கச் சொல் இங்கே தனக்குள் நேர்மறையானது. கண்டிக்கப்படுவது இறைப்பற்றே அல்ல; அதை ஆதாயத்திற்கான கருவியாக நடத்தும் இவர்களது மனப்பான்மையே.
- issue: διεφθαρμένων என்பதிலுள்ள ஒழுக்க மற்றும் அறிவுசார் சீர்கேட்டை எவ்வளவு வலுவாகக் கூறுவது
  choice: மனம் சீர்கெட்டவர்கள்
  alternative: மனத்தில் முற்றிலும் கெட்டுப்போனவர்கள்
  rationale: வசனத்தின் கடுமையான கண்டனத்தை வைத்திருக்கிறது; அதேவேளையில் கிரேக்கச் சொல்லைவிட வலுவான, பிற்காலக் கோட்பாட்டு அர்த்தத்தைச் சேர்க்கவில்லை.
- issue: ἀπεστερημένων என்ற செயப்பாட்டு வடிவத்தில் உண்மையை அகற்றிய செயற்பாட்டாளரை அடையாளப்படுத்துவது
  choice: உண்மையை இழந்தவர்கள்
  alternative: உண்மை பறிக்கப்பட்டவர்கள்
  rationale: கிரேக்கத்தில் செயற்பாட்டாளர் குறிப்பிடப்படவில்லை. இயல்பான தமிழுக்காக விளைவு நிலை முன்னிலைப்படுத்தப்படுகிறது; கடவுளோ வேறொருவரோ உண்மையைப் பறித்தார் என்று மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. ‘ஓயாத உரசல்கள்’ மூலமொழியின் உருவகத்தை வைத்திருக்கிறது; அடிக்குறிப்பு அதன் நேரடியான மோதல் சார்ந்த மாற்றுகளைக் கொடுக்கிறது. தனி வசனமாக வாசிக்க இயலுவதற்காக தமிழில் இயல்பான முழு வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
