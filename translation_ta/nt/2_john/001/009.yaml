revisions:
- from: மெசியாவைப் பற்றிய போதனையில்[a] நிலைத்திராமல் அதற்கு அப்பால் செல்கிற எவருக்கும் கடவுள் இல்லை. அந்தப் போதனையில் நிலைத்திருப்பவருக்கோ தந்தையும் மகனும் ஆகிய இருவரும் உண்டு.
  to: மெசியாவின் போதனையில்[a] நிலைத்திருக்காமல் முன்னே செல்கிற[b] எவரும் கடவுளை உடையவரல்ல; அந்தப் போதனையில் நிலைத்திருப்பவரே தந்தையையும் மகனையும் உடையவர்.
  rationale: The revision retains the Greek genitive’s ambiguity in the text, renders προάγων with its forward-motion metaphor rather than a settled interpretive gloss, and replaces “கடவுள் இல்லை” with a possessive expression corresponding to θεὸν οὐκ ἔχει. It also preserves the emphatic positive counterpart and separates the two footnote issues under appropriate anchors.
