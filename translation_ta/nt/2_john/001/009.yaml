id: 2JN.1.9
reference: 2 John 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: ta
  text: மெசியாவின் போதனையில்[a] நிலைத்திருக்காமல் முன்னே செல்கிற[b] எவரும் கடவுளை உடையவரல்ல; அந்தப் போதனையில் நிலைத்திருப்பவரே தந்தையையும் மகனையும் உடையவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மெசியாவின் போதனை’ என்பது மெசியா அளித்த போதனையையோ மெசியாவைப் பற்றிய போதனையையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘முன்னே செல்கிற’ என்பதற்கு ‘அப்பால் செல்கிற,’ ‘அளவுக்கு மீறிச் செல்கிற’ என்றும் மொழிபெயர்க்கலாம். சில கையெழுத்துப் பிரதிகளில் இதற்குப் பதிலாக ‘மீறுகிற’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: அதற்கு அப்பால் செல்கிற எவரும்
  rationale: πᾶς உடன் வரும் பெயரெச்ச வினைச்சொல் பொதுவாக ‘எவரும்’ எனப் பொருள்படுகிறது. προάγων என்பதன் முன்னே செல்லுதல் என்ற உருவகம் காக்கப்படுகிறது; சூழலில் போதனையின் எல்லையைத் தாண்டிச் செல்லும் எதிர்மறை நிழற்பொருளை ‘அதற்கு அப்பால் செல்கிற’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μὴ μένων
  choice: நிலைத்திராமல்
  rationale: யோவானிய எழுத்துகளில் முக்கியமான μένω என்பதின் ‘தொடர்ந்து இரு/நிலைத்திரு’ என்ற பொருளையும் கருத்துத் தொடர்ச்சியையும் ‘நிலைத்திரு’ காக்கிறது.
- source_word: ἐν τῇ διδαχῇ τοῦ Χριστοῦ
  choice: மெசியாவைப் பற்றிய போதனையில்
  rationale: διδαχήக்கு நவீன தமிழில் இயல்பான ‘போதனை’ பயன்படுத்தப்பட்டது. τοῦ Χριστοῦ என்ற உருபுத்தொடர், மெசியாவைக் குறித்த போதனை அல்லது அவரிடமிருந்து வரும் போதனை ஆகிய இரு நுண்பொருள்களுக்கும் இடமளிக்கலாம்; தமிழின் இயல்புக்காக முதன்மை உரையில் உள்ளடக்கப் பொருள் தேர்ந்தெடுக்கப்பட்டு மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: θεὸν οὐκ ἔχει
  choice: கடவுள் இல்லை
  rationale: ἔχει என்பதைக் கூடுதல் விளக்கமின்றி நேரடியாகத் தருகிறது. ‘கடவுளோடு உறவு இல்லை’ என்று விரிவுபடுத்தாமல் மூலத்தின் கடுமையான யோவானிய சொல்லமைப்பு காக்கப்படுகிறது.
- source_word: ὁ μένων ἐν τῇ διδαχῇ
  choice: அந்தப் போதனையில் நிலைத்திருப்பவர்
  rationale: முதல் கூறுடன் உள்ள இணை அமைப்பைத் தக்கவைத்து, தமிழில் இயல்பான பெயரெச்ச வடிவில் தரப்பட்டுள்ளது.
- source_word: οὗτος
  choice: -வருக்கோ
  rationale: οὗτος தரும் வலியுறுத்தல், தமிழில் எதிர்மறை–நேர்மறை மாறுபாட்டைச் சுட்டும் ‘-க்கோ’ இணைப்பால் இயல்பாக வெளிப்படுகிறது.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: தந்தையும் மகனும் ஆகிய இருவரும் உண்டு
  rationale: καὶ...καὶ என்ற இரட்டைப் பொருத்தத்தை ‘இருவரும்’ தெளிவாக்குகிறது; ‘தந்தை’, ‘மகன்’ என்னும் உறவுப் பட்டங்கள் அப்படியே காக்கப்படுகின்றன.
theological_decisions:
- issue: προάγων என்பதன் பொருள்
  choice: அதற்கு அப்பால் செல்கிற
  alternative: முன்னே செல்கிற; அளவுக்கு மீறிச் செல்கிற; சில கையெழுத்துப் பிரதிகளின்படி ‘மீறுகிற’
  rationale: SBLGNT உரை προάγων என வாசிக்கிறது; παραβαίνων அல்ல. எனவே ‘மீறுகிற’ என்று உரையிலேயே தீர்மானிக்காமல் நகர்வின் உருவகமும் சூழலின் எதிர்மறை நிழற்பொருளும் காக்கப்பட்டன.
- issue: τοῦ Χριστοῦ என்ற உருபுத்தொடரின் தொடர்பு
  choice: மெசியாவைப் பற்றிய போதனை
  alternative: மெசியாவின் போதனை
  rationale: கிரேக்க உருபுத்தொடர் போதனையின் உள்ளடக்கத்தையோ அதன் மூலத்தையோ குறிக்கக்கூடும். இயல்பான தமிழுக்காக முதன்மை வாசிப்பு உரையில் தரப்பட்டு, மற்ற உண்மையான சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: Χριστοῦ என்னும் பட்டம்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டது; அதை வெறும் தனிப்பெயராக மாற்றவில்லை.
- issue: θεὸν οὐκ ἔχει என்ற இறையியல் சொல்லமைப்பு
  choice: கடவுள் இல்லை
  alternative: கடவுளோடு உறவு இல்லை
  rationale: மூலத்தின் நேரடியான, தீவிரமான கூற்றைத் தக்கவைத்து, ‘உறவு’ அல்லது ‘ஐக்கியம்’ போன்ற விளக்கக் கருத்துகள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கோட்பாடு’ என்பதற்குப் பதில் இயல்பான ‘போதனை’, archaic தன்மை இல்லாத ‘நிலைத்திரு’, பட்டத்தைக் குறிக்கும் ‘மெசியா’ ஆகியவை பயன்படுத்தப்பட்டன. கிரேக்கத்தின் இரண்டு கூறுகளுக்கிடையேயான எதிர்மறை–நேர்மறை இணை அமைப்பு தமிழில் இயல்பாகக் காக்கப்பட்டது.
