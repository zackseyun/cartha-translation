  text: Ἀσπάζεταί σε τὰ τέκνα τῆς ἀδελφῆς σου τῆς ⸀ἐκλεκτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/013.yaml
  text: The children of your chosen sister greet you.
translation:
  language: ta
  text: தேர்ந்தெடுக்கப்பட்ட உன் சகோதரியின் பிள்ளைகள் உனக்கு வாழ்த்துச் சொல்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: வாழ்த்துச் சொல்கிறார்கள்
  rationale: கடிதத்தின் இறுதி வாழ்த்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ஒருமை வினை வடிவம் நடுநிலைப் பன்மை எழுவாயுடன் வரும் கிரேக்க இலக்கண அமைப்பு என்பதால் தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: τὰ τέκνα
  choice: பிள்ளைகள்
  rationale: வயதை வரையறுக்காமல் உறவைக் குறிக்கும் இயல்பான தமிழ் இணை.
- source_word: τῆς ἀδελφῆς σου
  choice: உன் சகோதரியின்
  rationale: ἀδελφή என்பதன் உறவுப் பொருளைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: τῆς ἐκλεκτῆς
  choice: தேர்ந்தெடுக்கப்பட்ட
  rationale: ἐκλεκτός என்பதன் தேர்வு/தெரிந்தெடுத்தல் சார்ந்த பொருளைப் பாதுகாக்கிறது; யாரால் தேர்ந்தெடுக்கப்பட்டார் என்பதை மூலத்தை மீறி நிரப்பவில்லை.
- source_word: σε
  choice: உனக்கு
  rationale: தமிழில் ‘வாழ்த்துச் சொல்’ என்பதுடன் இயல்பாக வரும் வேற்றுமை வடிவம்.
theological_decisions:
- issue: ‘தேர்ந்தெடுக்கப்பட்ட சகோதரி’ என்பது தனிப்பட்ட பெண்ணையா சபையையா குறிக்கிறது?
  choice: மூலத்தின் உருவகத் தெளிவின்மையைப் பாதுகாத்து ‘தேர்ந்தெடுக்கப்பட்ட உன் சகோதரி’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தேர்ந்தெடுக்கப்பட்ட உன் சகோதரி சபை’ அல்லது ஒரு குறிப்பிட்ட பெண்ணைக் குறிக்கும் வகையில் விளக்குதல்.
  rationale: வசனம் தானாகவே அந்த அடையாளத்தைத் தீர்மானிக்கவில்லை; மொழிபெயர்ப்பில் ‘சபை’ போன்ற விளக்கச் சொல்லைச் சேர்ப்பது தேவையற்ற தீர்மானமாகிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான கடித நிறைவு நடை. மூலத்தின் சொல் வரிசையைப் பின்பற்றாமல் தமிழின் இயல்பான உடைமைத் தொடரான ‘தேர்ந்தெடுக்கப்பட்ட உன் சகோதரியின்’ பயன்படுத்தப்பட்டுள்ளது.
