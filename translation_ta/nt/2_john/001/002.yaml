source:
  edition: SBLGNT
  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: ta
  text: நம்மில் நிலைத்திருக்கும்[a], என்றென்றும் நம்மோடு இருக்கும் உண்மையின் காரணமாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மில் தங்கியிருக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: காரணமாகவே
  rationale: Accusative உடன் வரும் διά இங்கு முந்தைய வசனத்தில் கூறப்பட்ட அன்பின் காரணத்தைச் சுட்டுகிறது. ‘காரணமாகவே’ என்பது காரணப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀλήθειαν
  choice: உண்மை
  rationale: ἀλήθεια என்பதன் நேரடியான, பொதுவான பொருள் ‘உண்மை.’ யோவானின் எழுத்துகளில் இதற்கு ஆழமான இறையியல் நிறை இருந்தாலும், நற்செய்தி, போதனை, கிறிஸ்து எனக் குறிப்பாக விரித்து மொழிபெயர்க்காமல் மூலத்தின் பரந்த பொருள் காக்கப்படுகிறது.
- source_word: τὴν μένουσαν
  choice: நிலைத்திருக்கிறதும்
  rationale: μένω என்பதன் நிகழ்காலப் பெயரெச்சம் தொடர்ந்திருத்தல் அல்லது நீடித்திருத்தலைக் குறிக்கிறது. ‘நிலைத்திருக்கிற’ என்பது அந்த நீடிப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν ἡμῖν
  choice: நம்மில்
  rationale: ἐν உடன் வரும் வேற்றுமை இங்கு ‘நம்மில்’ என்ற உட்பொருந்திய இருப்பை இயல்பாகக் குறிக்கிறது; ‘நம்மிடையே’ என்பதும் சாத்தியம் என்றாலும் அது மூலத்தின் நேரடியான சொல்லாட்சியிலிருந்து சற்றே விலகுகிறது.
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: என்றென்றும் நம்மோடு இருக்கப்போகிறதுமான
  rationale: μετά என்பது ‘நம்மோடு’ என்றும் ἔσται எதிர்கால இருப்பைச் சுட்டுவதால் ‘இருக்கப்போகிற’ என்றும் தரப்பட்டுள்ளது. முன் வரும் μένω-வின் நீடித்திருக்கும் பொருளை இங்கே மீண்டும் சேர்த்து மிகைமொழிபெயர்ப்பு செய்யவில்லை.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: இந்த கிரேக்க மரபுத்தொடர் முடிவில்லாத நீடிப்பைக் குறிக்கிறது; ‘என்றென்றும்’ என்பது தெளிவான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: யோவானின் எழுத்துகளில் ‘உண்மை’ என்பதன் இறையியல் பொருள்
  choice: ‘உண்மை’ என்ற பரந்த சொல்லையே வைத்திருத்தல்
  alternative: ‘நற்செய்தியின் உண்மை’ அல்லது ‘உண்மையான போதனை’ என்று குறிப்பாக்குதல்
  rationale: உடனடிச் சூழல் வளமான யோவானியப் பொருளை அனுமதித்தாலும், கிரேக்கப் பெயர்ச்சொல் அது நற்செய்தியா, போதனையா, கிறிஸ்துவைக் குறிக்கிறதா என்று வெளிப்படையாகக் குறுக்கவில்லை. ஆகவே மூலத்தின் இறையியல் ஆழமும் தெளிவுறாத பரப்பும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வசனத்தின் வாக்கியத்தைத் தொடரும் காரணத் தொடர் என்பதால், மூலத்தைப் போலவே தனித்த முழு வாக்கியமாக மாற்றப்படவில்லை.
