source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: ta
  text: 'மூப்பரிடமிருந்து தேர்ந்தெடுக்கப்பட்ட அம்மையாருக்கும்[a] அவருடைய பிள்ளைகளுக்கும்: இவர்களை நான் உண்மையோடு[b] அன்புகூருகிறேன்; நான் மட்டுமல்ல, உண்மையை அறிந்திருக்கும் அனைவரும்—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தேர்ந்தெடுக்கப்பட்ட அம்மையார்’ என்பது ஒரு குறிப்பிட்ட பெண்ணைக் குறிக்கலாம்; சிலர் இதை ஓர் உள்ளூர் திருச்சபையின் உருவகமாகப் புரிந்துகொள்கிறார்கள். ‘அம்மையார்’ என்பதற்கான கிரேக்கச் சொல்லை ‘கிரியா’ என்ற பெண்ணின் தனிப்பெயராகவும் எடுத்துக்கொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘உண்மையாக’; இந்தச் சொற்றொடர் யோவானின் எழுத்துகளில் காணப்படும் ‘உண்மைக்குள்’ என்ற பொருளையும் சுமக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: மூப்பர்
  rationale: கடிதத்தின் தொடக்கத்தில் இது வெறும் வயதைக் குறிப்பதைவிட, எழுத்தாளரின் அங்கீகரிக்கப்பட்ட நிலை அல்லது தலைமையைச் சுட்டும் சுயஅடையாளமாக இயங்குகிறது. ‘மூப்பர்’ என்பது நவீனத் தமிழில் இயல்பாகவும், வயது, மதிப்பு, தலைமை ஆகிய நுணுக்கங்களை ஓரளவு திறந்தவாறும் வைக்கிறது.
- source_word: ἐκλεκτῇ κυρίᾳ
  choice: தேர்ந்தெடுக்கப்பட்ட அம்மையாருக்கு
  rationale: ‘தேர்ந்தெடுக்கப்பட்ட’ என்பது ἐκλεκτῇ என்பதன் இயல்பான பொருளைத் தருகிறது. ‘அம்மையார்’ என்பது மரியாதைக்குரிய பெண்ணையும், உருவகமாகக் கூறப்படும் திருச்சபையையும் குறிக்கக்கூடியதால் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: அவருடைய பிள்ளைகளுக்கு
  rationale: τέκνα என்பது ஆண் பிள்ளைகளை மட்டும் அல்லாமல் பிள்ளைகளைப் பொதுவாகக் குறிக்கிறது. பெண் ஒருவரின் பிள்ளைகள் என்ற நேரடிப் பொருளுக்கும், சபை உறுப்பினர்கள் என்ற உருவகப் பொருளுக்கும் இச்சொற்றொடர் இடமளிக்கிறது.
- source_word: οὓς
  choice: இவர்களை
  rationale: இந்தப் பன்மை உறவுப்பெயர் பிள்ளைகளையோ, அம்மையாரும் பிள்ளைகளும் அடங்கிய முகவரிக் குழுவையோ குறிக்கலாம். ‘இவர்களை’ என்பது மனிதர்களைக் குறிக்கும் பன்மையை இயல்பாகத் தந்து, குறிப்பு யாரை உள்ளடக்குகிறது என்பதை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: ἀγαπῶ
  choice: அன்புகூருகிறேன்
  rationale: ἀγαπάω என்பதற்கு நிதானமான, கண்ணியமான தமிழ் இணையாக இது அமைகிறது; மூலத்தில் இல்லாத தீவிரத்தையும் சேர்ப்பதில்லை.
- source_word: ἐν ἀληθείᾳ
  choice: உண்மையில்
  rationale: இது ‘உண்மையாக’ என்ற மனப்பூர்வமான பொருளையும், யோவானின் எழுத்துகளில் காணப்படும் ‘உண்மைக்குள்’ என்ற ஆழமான பொருளையும் சுமக்கக்கூடிய இயல்பான தமிழ் வடிவம். இரு நுணுக்கங்களும் அடிக்குறிப்பில் வெளிப்படுத்தப்படுகின்றன.
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: நான் மட்டுமல்ல, ... அனைவரும்
  rationale: எழுத்தாளருக்கும் உண்மையை அறிந்த அனைவருக்கும் இடையிலான கிரேக்க வலியுறுத்தலையும் எதிரிணையையும் இயல்பான தமிழ் தொடரால் காக்கிறது.
- source_word: οἱ ἐγνωκότες τὴν ἀλήθειαν
  choice: உண்மையை அறிந்திருக்கும் அனைவரும்
  rationale: ἐγνωκότες என்ற நிறைவுநிலை வினையெச்சம், முன்பு அறிய வந்ததன் விளைவாக இப்போது அறிந்திருக்கும் நிலையைக் குறிக்கிறது. ‘அறிந்திருக்கும்’ அந்தத் தொடர்நிலையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐκλεκτῇ κυρίᾳ என்பவரின் அடையாளம்
  choice: ‘தேர்ந்தெடுக்கப்பட்ட அம்மையார்’ என்று பொதுப்பெயராக மொழிபெயர்த்து, ஒரு குறிப்பிட்ட பெண்ணையும் உருவகப்படுத்தப்பட்ட உள்ளூர் திருச்சபையையும் சாத்தியமான வாசிப்புகளாகத் திறந்துவைத்தல்.
  alternative: ‘கிரியா’ என்ற தனிப்பெயர்; அல்லது நேரடியாக ‘தேர்ந்தெடுக்கப்பட்ட திருச்சபை’ என்று விளக்குதல்.
  rationale: கிரேக்கம் ஒரு கிறிஸ்தவப் பெண்ணையோ, பெண்ணாக உருவகப்படுத்தப்பட்ட சபையையோ குறிக்க அனுமதிக்கிறது. முதன்மை உரையில் ஒன்றை மட்டும் உறுதிப்படுத்துவது மூலத்தின் உண்மையான தெளிவின்மையை நீக்கிவிடும்.
- issue: ἐν ἀληθείᾳ என்பதன் பொருள்
  choice: ‘உண்மையில்’ என்று மொழிபெயர்த்து, மனப்பூர்வமாக அல்லது மெய்யாக அன்புகூருதல் என்ற பொருளையும் ‘உண்மைக்குள்’ அன்புகூருதல் என்ற யோவானிய இறையியல் ஒலியையும் பாதுகாத்தல்.
  alternative: ‘உண்மையாக’; ‘உண்மைக்குள்’.
  rationale: ‘உண்மையாக’ என்பது இறையியல் ஒலியை இழக்கக்கூடும்; ‘உண்மைக்குள்’ என்பது மூலத்தில் கட்டுரை இல்லாத இடத்தில் பொருளை அளவுக்கு மீறிக் குறிப்பாக்கக்கூடும். தேர்ந்த வடிவமும் அடிக்குறிப்பும் இரு சாத்தியங்களையும் தக்கவைக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கடிதநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘எழுதுவது’ என்பது தமிழில் முகவரி அமைப்பை இயல்பாக்கச் சேர்க்கப்பட்டுள்ளது; இறுதிக் கோடு வாக்கியம் அடுத்த வசனத்தில் தொடர்வதை உணர்த்துகிறது. ‘திருச்சபை மூப்பர்’ போன்ற கூடுதல் நிறுவனச் சொல்லாக்கம் தவிர்க்கப்பட்டுள்ளது.
