source:
  edition: SBLGNT
  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: ta
  text: ஒருவன் உங்களிடம் வந்து இந்தப் போதனையைக் கொண்டுவராவிட்டால், அவனை உங்கள் வீட்டிற்குள் ஏற்றுக்கொள்ளாதீர்கள்; அவனுக்கு வாழ்த்துச் சொல்லாதீர்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சுருக்கமாக, “அவனை வாழ்த்தாதீர்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொல்லுக்கு நெருக்கமாக, “அவனுக்கு வாழ்த்துச் சொல்லாதீர்கள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சூழலில், “இந்தப் போதனையை” கொண்டுவராதவன் என்பது சுற்றிப் பயணம் செய்து போதிக்கும் ஒருவரைக் குறிக்கலாம்; அவனுடைய செய்தி முந்தைய வசனங்களில் கூறப்பட்ட கிறிஸ்துவைப் பற்றிய அறிக்கையிலிருந்து விலகியதாக இருக்கும். ஆனால் இந்த வசனம் தடையின் எல்லையை இதற்கு மேல் வெளிப்படையாக வரையறுக்கவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: ஒருவன் ... வந்தால்
  rationale: பொதுவான, காலவரையற்ற நிபந்தனையை இயல்பான தமிழில் தருகிறது; மூலத்தின் ஒருமை வடிவத்தையும் காக்கிறது.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: உங்களிடம் வந்து
  rationale: பெறுநர்களை நோக்கி வருவதைக் நேரடியாகக் காட்டுகிறது; சபைக் கூடுகை அல்லது தனிப்பட்ட வருகை என்று தேவையின்றி வரையறுக்கவில்லை.
- source_word: ταύτην τὴν διδαχήν
  choice: இந்தப் போதனையை
  rationale: διδαχή என்பதன் கற்பித்தல் அல்லது போதனை சார்ந்த பொருளைத் தெளிவாகவும் நவீனமாகவும் தருகிறது; ταύτην என்பதன் சுட்டுப்பொருளும் காக்கப்படுகிறது.
- source_word: οὐ φέρει
  choice: கொண்டுவராவிட்டால்
  rationale: ஒரு போதனையைத் தன்னுடன் கொண்டு வருதல் அல்லது முன்வைத்தல் என்ற உருவகப் பொருளை, மூலத்திற்கு நெருக்கமாக இயல்பான தமிழில் தருகிறது.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: அவனை உங்கள் வீட்டிற்குள் ஏற்றுக்கொள்ளாதீர்கள்
  rationale: λαμβάνω என்பதன் ஏற்றுக்கொள்ளுதல் மற்றும் விருந்தோம்புதல் சார்ந்த பொருளையும், εἰς οἰκίαν என்பதன் வீட்டிற்குள் என்ற இடவியல் வடிவத்தையும் காக்கிறது.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: அவனுக்கு வாழ்த்துச் சொல்லாதீர்கள்
  rationale: χαίρειν என்பதை வாழ்த்து உரையாகவும் λέγετε என்பதை சொல்லுதல் எனவும் வெளிப்படையாகக் காக்கிறது; வெறுமனே 'வாழ்த்தாதீர்கள்' என்பதைக் காட்டிலும் கிரேக்கச் சொல்லமைப்பிற்கு நெருக்கமானது.
theological_decisions:
- issue: தடை எவ்வளவு விரிவானது
  choice: இந்தப் போதனையைக் கொண்டுவராதவனை வீட்டிற்குள் ஏற்றுக்கொள்ளவும் அவனுக்கு வாழ்த்துச் சொல்லவும் வேண்டாம் என்ற மூலத்தின் குறிப்பிட்ட செயல்களை அப்படியே வைத்தல்
  alternative: எல்லா சமூகத் தொடர்பையும் முழுமையாகத் தடைசெய்வதாகவோ, சபை ஆசிரியராக அதிகாரபூர்வமாக ஏற்றுக்கொள்வதை மட்டும் தடைசெய்வதாகவோ விரிவுபடுத்துதல்
  rationale: சூழல் வழிதவறிய போதனையுடன் வரும் ஆசிரியரைப் பற்றியதாகத் தோன்றினாலும், வசனம் வீட்டிற்குள் ஏற்றல் மற்றும் வாழ்த்துச் சொல்லல் என்ற சொற்களையே பயன்படுத்துகிறது. மொழிபெயர்ப்பு தடையை அதற்கு மேல் குறுக்கவோ விரிக்கவோ கூடாது.
- issue: αὐτόν / αὐτῷ என்பவற்றின் பாலினம் மற்றும் எண்ணிக்கை
  choice: அவனை / அவனுக்கு
  alternative: அவர்களை / அவர்களுக்கு
  rationale: மூலத்தில் ஒருமை ஆண்பால் பிரதிப்பெயர்கள் உள்ளதால் அவற்றைத் தமிழிலும் ஒருமை ஆண்பாலாகத் தக்கவைத்துள்ளது; குறிப்பு பொதுவான சூழலைச் சேர்ந்தது என்பதும் மறுக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் கட்டளையின் தீவிரமும் காக்கப்பட்டுள்ளன. “போதனை,” “வீட்டிற்குள் ஏற்றுக்கொள்ளுதல்,” “வாழ்த்துச் சொல்லுதல்” ஆகியவை இயல்பானவையாகவும் மூலச் சொல்லமைப்பிற்கு நெருக்கமாகவும் உள்ளன. அடிக்குறிப்பு குறிகள் முதன்மை உரையில் இடம்பெற்றுள்ளன.
