id: 2JN.1.12
reference: 2 John 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: ta
  text: உங்களுக்கு எழுதுவதற்கு எனக்கு பல விஷயங்கள் இருந்தாலும், அவற்றைக் காகிதத்தாலும் மையாலும் எழுத நான் விரும்பவில்லை. ஆனால், உங்களிடம் வரவும் நேருக்கு நேர் பேசவும் நம்புகிறேன்; அதனால் உங்கள் மகிழ்ச்சி[a] நிறைவடையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “உங்கள் மகிழ்ச்சி” என்பதற்குப் பதிலாக “நமது மகிழ்ச்சி” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: உங்களுக்கு எழுத வேண்டியவை பல இருந்தாலும்
  rationale: பங்கேற்புவினை அமைப்பின் concessive நுணுக்கத்தை இயல்பான தமிழில் தருகிறது; Πολλά என்பதன் பன்மையையும் காக்கிறது.
- source_word: οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος
  choice: அவற்றைக் காகிதத்தாலும் மையாலும் எழுத நான் விரும்பவில்லை
  rationale: βούλομαι என்பதின் விருப்பம்/மனவுறுதி சார்ந்த பொருளையும், διά என்பதின் கருவிப்பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: மாறாக, உங்களிடம் வந்து ... என்று நம்புகிறேன்
  rationale: πρός என்பதின் திசைநோக்கையும், வருகை புரிந்து உடனிருப்பது என்ற இயல்பான சூழற்பொருளையும் காக்கிறது.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: நேருக்கு நேர் பேசுவேன்
  rationale: சொல்லுக்கு சொல் ‘வாயோடு வாய்’ என்பது நவீன தமிழில் தவறாகப் புரியக்கூடும்; இங்கு நேரடியான தனிப்பட்ட உரையாடலைக் குறிக்கும் மரபுத்தொடர் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: அப்போது உங்கள் மகிழ்ச்சி நிறைவடையும்
  rationale: ἵνα நோக்கம்/எதிர்பார்க்கப்படும் விளைவைக் காட்டுகிறது; perfect participle உடன் உள்ள அமைப்பு மகிழ்ச்சி முழுநிறைவு பெறும் நிலையைக் குறிக்கிறது.
theological_decisions:
- issue: யாருடைய மகிழ்ச்சி என்பதைக் குறிக்கும் பிரதிப்பெயரின் பாடவேறுபாடு
  choice: உங்கள் மகிழ்ச்சி
  alternative: நமது மகிழ்ச்சி
  rationale: வழங்கப்பட்ட SBLGNT மூலப்பாடம் ὑμῶν (‘உங்கள்’) என்று வாசிப்பதால் அது முதன்மை உரையில் பின்பற்றப்படுகிறது. ἡμῶν (‘நமது’) என்ற பொருளுள்ள சான்றும் விளக்கக் குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் கடித நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நேருக்கு நேர்’ என்பது கிரேக்க மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
