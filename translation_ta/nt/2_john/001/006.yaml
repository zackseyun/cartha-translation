reference: 2 John 1:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: ta
  text: 'அன்பு என்பது இதுவே: நாம் அவருடைய கட்டளைகளின்படி நடப்பதே. தொடக்கத்திலிருந்து நீங்கள் கேட்டபடி, இதுவே அந்தக் கட்டளை: நீங்கள் அதில்[a] நடக்க வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் அன்பில் நடக்க வேண்டும்.” ‘அதில்’ என்பது ‘கட்டளை’யைக் குறிக்காமல் ‘அன்பு’ என்பதைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: அன்பு
  rationale: யோவானின் எழுத்துகளில் வரும் ἀγάπη என்பதற்கான இயல்பான நவீனத் தமிழ் இணை; சுற்றியுள்ள பகுதிகளுடனான சொல் தொடர்பையும் காக்கிறது.
- source_word: ἵνα περιπατῶμεν
  choice: நாம் ... நடப்பதே
  rationale: இங்கு ἵνα அன்பு நடைமுறையில் எது என்பதை விளக்குகிறது. தமிழ் வாக்கியத்தில் வரையறையின் உள்ளடக்கத்தை இயல்பாகத் தெரிவிக்க ‘நடப்பதே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: περιπατέω
  choice: நட
  rationale: ஒழுக்க வாழ்வைக் குறிக்கும் யோவானிய உருவகத்தை ‘வாழ்’ என்று தட்டையாக்காமல், இரு இடங்களிலும் ‘நட’ எனக் காக்கிறது.
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: அவருடைய கட்டளைகளின்படி
  rationale: κατά இங்கு இணக்கம் அல்லது ஒத்திசைவைச் சுட்டுகிறது; பன்மையான கட்டளைகளையும் தெளிவாகக் காக்கிறது.
- source_word: ἐντολάς / ἐντολή
  choice: கட்டளைகள் / கட்டளை
  rationale: மூலத்தில் உள்ள பன்மையிலிருந்து ஒருமைக்கான மாற்றத்தையும், இரு வடிவங்களுக்கிடையிலான சொல் தொடர்பையும் காக்கிறது.
- source_word: αὕτη ἡ ἐντολή ἐστιν
  choice: இதுவே அந்தக் கட்டளை
  rationale: கிரேக்கத்தில் வெளிப்படையான உடைமைச் சொல் இல்லாததால் ‘அவருடைய கட்டளை’ என்று சேர்க்காமல், குறிப்பிட்ட கட்டளையைச் சுட்டும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: நீங்கள் தொடக்கத்திலிருந்தே கேட்டபடி
  rationale: யோவானிய ‘தொடக்கத்திலிருந்து’ என்ற வழக்கையும், ἠκούσατε என்பதன் இறந்தகாலக் கருத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: நீங்கள் அதில் நடக்க வேண்டும்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயரின் குறிப்பை விளக்கிச் சேர்க்காமல் ‘அதில்’ என வைத்ததால், நடக்கும் உருவகமும் மூலத்தின் இருபொருள் வாய்ப்பும் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள αὐτῇ என்பதன் குறிப்பு
  choice: அருகில் முன்வரும் ஒருமைச் சொல்லான ‘கட்டளை’யைக் குறிப்பதாக முதன்மை உரையில் வாசிக்கப்படுகிறது.
  alternative: முதல் கூறிலுள்ள ‘அன்பு’ என்பதைக் குறிப்பதாகவும் வாசிக்கலாம்.
  rationale: ἐντολή மற்றும் ἀγάπη இரண்டும் கிரேக்கத்தில் பெண்பால் ஒருமைச் சொற்கள். இலக்கண அருகாமை ‘கட்டளை’க்கு முன்னுரிமை அளித்தாலும், கருத்தியல் தொடர்பு ‘அன்பு’ என்ற வாசிப்பையும் சாத்தியமாக்குகிறது; ஆகவே அந்தத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நட’ என்ற வேதாகம ஒழுக்க உருவகம் இருமுறையும் காக்கப்பட்டு, தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கம் தவிர்க்கப்பட்டுள்ளது.
