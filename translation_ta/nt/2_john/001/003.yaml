source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: ta
  text: பிதாவாகிய கடவுளிடமிருந்தும், பிதாவின் மகனாகிய இயேசு மெசியாவிடமிருந்தும், அருளும் இரக்கமும் சமாதானமும் உண்மையிலும் அன்பிலும் நம்மோடு இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மெசியா” என்பதற்குப் பதிலாக “கிறிஸ்து” என்றும் வழங்கலாம். கிரேக்க Χριστός என்பது அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டம்; இங்கு அதன் பட்டப் பொருளைப் பேண “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: இருக்கும்
  rationale: எதிர்காலக் குறிப்பு வினைமுற்றை நேரடியாகவும் இயல்பாகவும் தருகிறது; இதை வேண்டுதலாக மாற்றாமல் கூற்றின் வடிவத்தைப் பேணுகிறது.
- source_word: μεθ’ ἡμῶν
  choice: நம்மோடு
  rationale: μετά + மரபுவேற்றுமையின் அடிப்படைப் பொருளான ‘உடன்’ என்பதைக் காட்டுகிறது; கடித வாழ்த்துச் சூழலுக்கும் இயல்பாக உள்ளது.
- source_word: χάρις ἔλεος εἰρήνη
  choice: அருளும் இரக்கமும் சமாதானமும்
  rationale: மூன்று பெயர்ச்சொற்களையும் வாக்கிய எழுவாய்களாகப் பேணி, தமிழில் இயல்பான இணைப்பும்மையுடன் வழங்குகிறது.
- source_word: παρὰ θεοῦ πατρός
  choice: பிதாவாகிய கடவுளிடமிருந்து
  rationale: παρά + மரபுவேற்றுமை மூலத்தைக் குறிப்பதால் ‘இடமிருந்து’ என மொழிபெயர்க்கப்படுகிறது; மூலத்தில் இல்லாத ‘நம்’ சேர்க்கப்படவில்லை.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: மெசியா இயேசுவிடமிருந்து
  rationale: παρά குறிக்கும் மூல உறவு பேணப்படுகிறது. Χριστός பெயராக ஒலிபெயர்க்கப்படாமல் அபிஷேகம் பெற்ற அரசருக்குரிய பட்டத்தின் பொருளில் ‘மெசியா’ என வழங்கப்படுகிறது; தமிழில் பெயருக்கு முன் பட்டத்தை வைப்பது இயல்பு.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: பிதாவின் மகனாகிய
  rationale: இது மெசியா இயேசுவை பிதாவின் மகன் என்று அடையாளப்படுத்தும் உடனிலைத் தொடராகத் தெளிவாகவும் இயல்பாகவும் தரப்படுகிறது.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: உண்மையிலும் அன்பிலும்
  rationale: ἐν என்பதன் ‘இல்’ பொருளையும், இரு பண்புப்பெயர்களின் உருபற்ற தரநிலையையும் பேணுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός இங்கு இயேசுவோடு இணைந்த பட்டமாகச் செயல்படுகிறது. அதன் பட்டப் பொருளைப் பேண ‘மெசியா’ பயன்படுத்தப்படுகிறது; மரபான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τοῦ υἱοῦ τοῦ πατρός என்பதற்கும் இயேசுவுக்கும் உள்ள உறவு
  choice: மெசியா இயேசுவை ‘பிதாவின் மகன்’ என்று அடையாளப்படுத்தும் உடனிலை விளக்கம்
  alternative: இயேசுவுக்குப் பின் வரும் தளர்வான வருணனை
  rationale: கிரேக்கத் தொடர் இயேசு மெசியாவையே பிதாவின் மகனாக நேரடியாக அடையாளப்படுத்துவது இயல்பான வாசிப்பு; இதற்கு மேல் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: ἔσται என்பதன் வாக்கிய வலிமை
  choice: 'எதிர்கால உறுதிக்கூற்று: ‘இருக்கும்’'
  alternative: 'ஆசீர்வாத வேண்டுதல்: ‘இருப்பதாக’'
  rationale: மூலத்தில் எதிர்காலக் குறிப்பு வடிவம் உள்ளது; வேண்டுதல் அல்லது கட்டளை வடிவம் இல்லை. எனவே அதன் இலக்கணத் தொனியைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடை. ‘பிதா’, ‘அருள்’, ‘சமாதானம்’, ‘மெசியா’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கச் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், இரு மூலங்களையும் முதலில் வைத்து ஆசீர்வாதப் பொருட்களைப் பின்னர் கூறும் இயல்பான தமிழ் அமைப்பு தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறியீடு மாற்றுச் சொல்லுடன் தொடர்புடைய வாக்கிய முடிவில் வைக்கப்பட்டுள்ளது.
