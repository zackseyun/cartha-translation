base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: ta
  text: ஏனெனில், ஏமாற்றுகிறவர்கள் பலர் உலகத்திற்குள் புறப்பட்டுச் சென்றிருக்கிறார்கள்; மனித உடலில் வருபவராகிய இயேசு மெசியாவை அறிக்கையிடாதவர்களே அவர்கள்.[a] இப்படிப்பட்டவனே ஏமாற்றுகிறவனும் அந்திக்கிறிஸ்துவும் ஆவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனித உடலில் வந்தவராகிய இயேசு மெசியாவை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் நேரடியாக “மனித உடலில் வருபவராகிய இயேசு மெசியாவை” என்று உள்ளது; இயேசு மெசியாவின் உண்மையான உடல்சார்ந்த மனிதத்தன்மையை இச்சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: πολλοὶ πλάνοι
  choice: ஏமாற்றுகிறவர்கள் பலர்
  rationale: πλάνος என்பது தாமே தவறியவர்கள் என்பதைவிட பிறரைத் தவறாக வழிநடத்துகிறவர்களைக் குறிக்கிறது; பின்னர் வரும் ஒருமை வடிவத்துடனும் சொற்பொருள் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: உலகத்திற்குள் புறப்பட்டுச் சென்றிருக்கிறார்கள்
  rationale: அவர்கள் பொதுவெளியில் பரவிச் செயல்படத் தொடங்கியதையும் அதன் தற்போதைய விளைவையும் தெரிவிக்கிறது; κόσμος என்பதற்கு தேவையற்ற 'உலக அமைப்பு' என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: அறிக்கையிடுவதில்லை
  rationale: ὁμολογέω என்பதிலுள்ள வெளிப்படையான ஒப்புதல் அல்லது விசுவாச அறிக்கையின் வலிமையைத் தக்கவைக்கிறது.
- source_word: Ἰησοῦν Χριστόν
  choice: இயேசுவே மெசியா
  rationale: Χριστός இங்கு இயேசுவின் அடையாளத்தைப் பற்றிய அறிக்கையின் பட்டமாக வலியுறுத்தப்படுவதால் 'மெசியா' என மொழிபெயர்க்கப்படுகிறது; தமிழில் பயனிலையைத் தெளிவாக்க 'ஏ' சேர்க்கப்பட்டுள்ளது.
- source_word: ἐρχόμενον ἐν σαρκί
  choice: அவர் மனித உடலில் வருகிறவர்
  rationale: நிகழ்காலப் பங்கேற்பு வடிவமான ἐρχόμενον என்பதன் 'வருகிற' என்ற திறந்த காலநிலையைப் பாதுகாக்கிறது; ἐν σαρκί என்பது உண்மையான உடல்சார்ந்த மனிதத்தன்மையைக் குறிப்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: οὗτός ἐστιν
  choice: இப்படிப்பட்டவனே ... ஆவான்
  rationale: பன்மையில் விவரிக்கப்பட்டவர்களில் ஒவ்வொருவரையும் அல்லது அந்த வகையைச் சேர்ந்த ஒருவனையும் ஒருமைப்படுத்தும் சுட்டுப்பெயரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ὁ πλάνος
  choice: ஏமாற்றுகிறவன்
  rationale: முன்னர் வந்த πλάνοι என்பதுடன் சொற்பொருள் ஒருமைப்பாட்டைத் தக்கவைக்கிறது.
- source_word: ὁ ἀντίχριστος
  choice: அந்திக்கிறிஸ்து
  rationale: யோவானிய எழுத்துகளில் வழக்காக நிலைபெற்றுள்ள தமிழ்ச் சொல்; 'மெசியாவுக்கு எதிரானவன்' என்று விளக்கமாக விரித்துச் சொல்லாமல் மூலத்தின் பெயர்ச்சொல் வடிவத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இந்த வசனத்தில் இயேசுவைப் பற்றிய அறிக்கையின் உள்ளடக்கமே மையமாக இருப்பதால் Χριστός பெயரைப்போல அல்லாமல் பட்டமாகச் செயல்படுகிறது.
- issue: ἐρχόμενον ἐν σαρκί என்பதன் காலநிலை
  choice: மனித உடலில் வருகிறவர்
  alternative: மனித உடலில் வந்தவர்
  rationale: மூலத்தில் நிகழ்காலப் பங்கேற்பு உள்ளது. அதை இறந்தகாலமாக மட்டும் மாற்றாமல் அதன் உண்மையான மனித உடல்நிலையை உறுதிப்படுத்தும் சொற்றொடரின் திறந்த காலநிலையைப் பாதுகாக்கிறது.
- issue: σάρξ என்பதன் பொருள்
  choice: மனித உடல்
  alternative: மாம்சம்; பாவ இயல்பு
  rationale: இக்கிறிஸ்துவியல் சூழலில் σάρξ உண்மையான மனித உடலெடுத்தலைக் குறிக்கிறது; ஒழுக்க ரீதியான 'பாவ இயல்பு' என்று பொருள்படாது.
- issue: οὗτος என்ற ஒருமைச் சுட்டு
  choice: இப்படிப்பட்டவனே
  alternative: இவனே; இதுவே
  rationale: முன்னுள்ள பன்மைக் குழுவைத் தொடர்ந்து வரும் ஒருமை, அந்த வகையைச் சேர்ந்த ஒவ்வொருவரையும் தனிப்படுத்தலாம். 'இப்படிப்பட்டவன்' அந்த பொதுவகைச் சுட்டை இயல்பாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை. 'மாம்சம்' என்ற மரபுச் சொல் இன்றைய வாசகருக்கு தவறாக 'பாவ இயல்பு' என்ற பொருளைத் தரக்கூடும் என்பதால், இச்சூழலில் σάρξ என்பதன் உடல்சார்ந்த பொருளை 'மனித உடல்' எனத் தெளிவாக்கப்பட்டுள்ளது. பிரதான உரையில் உள்ள [a] குறி அடிக்குறிப்புடன் பொருந்துகிறது.
