revisions:
- from: நாங்கள் உழைத்துப் பெற்றதை[a] நீங்கள் இழந்துவிடாமல், முழு வெகுமதியைப் பெற்றுக்கொள்ளும்படி உங்களைக் கவனித்துக்கொள்ளுங்கள்.
  to: உங்களையே கவனித்துக்கொள்ளுங்கள்; நாங்கள் உழைத்ததை நீங்கள் இழந்துவிடாமல், முழு வெகுமதியைப் பெறும்படி.
  rationale: The revision removes the unsupported ‘பெற்ற’ from the object of ‘we labored,’ retains the SBLGNT first-person plural reading in the main text, preserves the significant second-person textual variant in the footnote, and clarifies the reflexive force of the opening warning. The semicolon preserves the Greek warning followed by its purpose clause.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:02:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'The main sense is largely retained: the readers are warned not to lose the result of the author''s/missionaries'' labor and to receive a full reward. However, the phrase “நாங்கள் உழைத்துப் பெற்றதை” adds ‘obtained/earned,’ which is not stated by εἰργασάμεθα (‘we worked/labored’). The warning is better rendered directly as ‘உங்களைக் குறித்து எச்சரிக்கையாயிருங்கள்’ or ‘உங்களையே கவனித்துக்கொள்ளுங்கள்’; the latter is retained in a clear, natural form.'
  naturalness: The draft is generally understandable, but “உங்களைக் கவனித்துக்கொள்ளுங்கள்” can suggest taking care of yourselves rather than being watchful/guarded. “உங்களையே கவனித்துக்கொள்ளுங்கள்” more clearly retains the reflexive focus, and removing the added ‘பெற்ற’ produces more idiomatic wording.
  terminology: “முழு வெகுமதி” is suitable for μισθὸν πλήρη in this context. “பெறும்படி” appropriately represents the purpose clause without imposing a ‘receive back’ nuance.
  issues:
  - severity: medium
    issue: Added meaning in “நாங்கள் உழைத்துப் பெற்றதை”
    rationale: εἰργασάμεθα means ‘we worked/labored’ and does not explicitly say that the workers obtained or earned the object. The relative pronoun refers to what their labor accomplished/produced; Tamil should avoid adding ‘பெற்ற’.
  - severity: low
    issue: Reflexive warning could be clearer
    rationale: “உங்களைக் கவனித்துக்கொள்ளுங்கள்” is possible Tamil, but may be heard as self-care. Adding “-ஏ” makes the reflexive emphasis of ἑαυτούς clearer while retaining a natural imperative.
  revised_text: உங்களையே கவனித்துக்கொள்ளுங்கள்; நாங்கள் உழைத்ததை நீங்கள் இழந்துவிடாமல், முழு வெகுமதியைப் பெறும்படி.
  revised_footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “நாங்கள் உழைத்ததை” என்பதற்குப் பதிலாக, “நீங்கள் உழைத்ததை” என்று உள்ளது.
    reason: textual_variant
  revision_rationale: The revision removes the unsupported ‘பெற்ற’ from the object of ‘we labored,’ retains the SBLGNT first-person plural reading in the main text, preserves the significant second-person textual variant in the footnote, and clarifies the reflexive force of the opening warning. The semicolon preserves the Greek warning followed by its purpose clause.
