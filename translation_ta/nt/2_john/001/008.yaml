source:
  edition: SBLGNT
  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: ta
  text: உங்களையே கவனித்துக்கொள்ளுங்கள்; நாங்கள் உழைத்ததை நீங்கள் இழந்துவிடாமல், முழு வெகுமதியைப் பெறும்படி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: உங்களைக் கவனித்துக்கொள்ளுங்கள்
  rationale: நிகழ்காலப் பன்மை ஏவல் தொடர்ந்து விழிப்புடன் இருக்கும்படி வாசகர்களை எச்சரிக்கிறது. இயல்பான நவீனத் தமிழில் எச்சரிக்கையின் வலிமையையும் தன்னைப் பற்றிய கவனத்தையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: ἵνα μὴ ἀπολέσητε
  choice: நீங்கள் இழந்துவிடாமல்
  rationale: ἵνα உடன் வரும் மறுப்பு நோக்கத்தையோ தவிர்க்க வேண்டிய விளைவையோ குறிக்கிறது. இங்கு ἀπόλλυμι அழிப்பதைக் காட்டிலும் உழைப்பின் பயனை இழப்பதைக் குறிக்கிறது.
- source_word: ἃ εἰργασάμεθα
  choice: நாங்கள் உழைத்துப் பெற்றதை
  rationale: கொடுக்கப்பட்ட SBLGNT வாசகத்திலுள்ள முதலாம் நபர் பன்மையைப் பாதுகாக்கிறது. வினையின் நிறைவு மற்றும் தொடர்ந்து நிலைக்கும் விளைவை இயல்பான தமிழில் தெரிவிக்க ‘உழைத்துப் பெற்றதை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μισθὸν πλήρη
  choice: முழு வெகுமதியை
  rationale: ம spiritual exhortation context? வெகுமதி என்பது μισθός என்பதன் இச்சூழலுக்குப் பொருத்தமான பொருள்; πλήρη அதன் முழுமையை வலியுறுத்துகிறது.
- source_word: ἀπολάβητε
  choice: பெற்றுக்கொள்ளும்படி
  rationale: இணையான இறந்தகாலத் துணைவினை வடிவத்தின் நோக்கத்தைத் தெளிவாகக் காட்டுகிறது. ‘திரும்பப் பெறுதல்’ என்ற சாத்தியமான நுணுக்கத்தை மூலச்சூழல் கட்டாயப்படுத்தாததால் அது சேர்க்கப்படவில்லை.
theological_decisions:
- issue: εἰργασάμεθα என்பதன் எழுவாய்
  choice: நாங்கள் உழைத்துப் பெற்றதை
  alternative: நீங்கள் உழைத்துப் பெற்றதை
  rationale: கொடுக்கப்பட்ட SBLGNT உரை முதலாம் நபர் பன்மையான εἰργασάμεθα என்று வாசிக்கிறது; ஆகவே அப்போஸ்தலப் பணியாளர்களின் உழைப்பின் விளைவை வாசகர்கள் இழக்காதிருக்க வேண்டும் என்ற பொருள் முதன்மை உரையில் வைக்கப்பட்டுள்ளது. வாசகர்களின் சொந்த உழைப்பைக் குறிக்கும் இரண்டாம் நபர் பன்மை வாசகம் முக்கியமான பாடவேறுபாடாக அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாயும் வேதாகம அறிவுரைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. எச்சரிக்கை, இழப்பு, முழு வெகுமதி ஆகியவற்றுக்கிடையிலான இறையியல் பதற்றம் விளக்கிச் சமனாக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
