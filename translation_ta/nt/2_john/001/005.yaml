id: 2JN.1.5
reference: 2 John 1:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: ta
  text: 'இப்போது, அம்மையே[a], உம்மிடம் ஒரு வேண்டுகோள் விடுக்கிறேன்: புதியதொரு கட்டளையை உமக்கு எழுதுவதுபோல் அல்ல; தொடக்கத்திலிருந்தே நமக்கு இருந்த கட்டளையின்படி நாம் ஒருவரை ஒருவர் அன்புகூர வேண்டும் என்பதே என் வேண்டுகோள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அம்மையே’ என்பது உருவகமாக ஒரு திருச்சபையைக் குறிக்கக்கூடும்; வேறு சிலர் இதை ‘கிரியா’ என்ற இயற்பெயராகக் கொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: கேட்டுக்கொள்கிறேன்
  rationale: ἐρωτάω இங்கு பணிவான வேண்டுகோளைத் தெரிவிக்கிறது. ‘கேட்டுக்கொள்கிறேன்’ என்பது கடிதத்தின் மென்மையான தொனியைப் பேணுகிறது; ‘வற்புறுத்துகிறேன்’ என வலிமையை மிகைப்படுத்துவதில்லை.
- source_word: κυρία
  choice: அம்மையே
  rationale: κυρία என்பது ‘பெண்மணி/அம்மை’ என்ற மரியாதை விளியின் ஒருமை வடிவம். ‘அம்மையே’ இயல்பான தமிழ் விளியாக இருந்து, இது ஒரு பெண்ணையா, உருவகமாக ஒரு திருச்சபையையா, அல்லது பெயரையா குறிக்கிறது என்பதை முதன்மை உரையில் தீர்மானிக்காமல் விடுகிறது.
- source_word: ἐντολὴν καινὴν
  choice: புதியதொரு கட்டளை
  rationale: பெயர்ச்சொல்–பெயரடைத் தொடரை நேர்த்தியாகக் காட்டுவதோடு யோவானிய எழுத்துகளில் காணப்படும் ‘புதிய கட்டளை’ என்ற தொடர்பையும் பேணுகிறது.
- source_word: γράφων σοι
  choice: நான் உமக்கு ... எழுதுவதுபோல்
  rationale: எழுதுகிறவன் என்ற கிரேக்கப் பங்கேற்பு வடிவம் தமிழில் ஒப்பீட்டுக் கட்டமைப்புக்கேற்ற வினைத் தொடராக இயல்பாக்கப்பட்டுள்ளது.
- source_word: ἣν εἴχομεν
  choice: நமக்கு இருந்த கட்டளை
  rationale: இறந்தகாலத் தொடர்ச்சியைச் சுட்டும் εἴχομεν, தொடக்கத்திலிருந்து அவர்களிடம் இருந்த கட்டளையைக் குறிக்கிறது. தமிழ் சூழலில் ‘நமக்கு இருந்த’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπ’ ἀρχῆς
  choice: தொடக்கத்திலிருந்தே
  rationale: யோவானிய வழக்கிலுள்ள ‘தொடக்கத்திலிருந்து’ என்ற கருத்தைத் தெளிவாகப் பேணுகிறது; ‘-ஏ’ நீண்டகாலமாக இருப்பதற்கான வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: நாம் ஒருவரிலொருவர் அன்புகூர வேண்டும்
  rationale: ἵνα உடன் வரும் துணைவினை வடிவத்தின் கட்டளைசார் உள்ளடக்கத்தை ‘வேண்டும்’ வெளிப்படுத்துகிறது. ἀλλήλους என்பதற்கு பரஸ்பரத் தன்மையைத் தெளிவாகக் காட்டும் ‘ஒருவரிலொருவர்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: κυρία என்பதன் சுட்டுப்பொருள்
  choice: ஒரு குறிப்பிட்ட பெண்ணாகவோ திருச்சபையாகவோ அடையாளப்படுத்தாமல் ‘அம்மையே’ என்று மொழிபெயர்த்தல்
  alternative: இதை ஓர் உள்ளூர் திருச்சபையின் உருவகக் குறிப்பாக எடுத்துக்கொள்ளலாம்; அல்லது ‘கிரியா’ என்ற இயற்பெயராகக் கொள்ளலாம்.
  rationale: கிரேக்கச் சொல் இவ்விளக்கங்கள் அனைத்திற்கும் இடமளிக்கிறது. ஆகவே முதன்மை உரை அந்த மெய்யியல் மற்றும் வரலாற்றுத் தெளிவின்மையைத் தீர்த்துவிடாமல் பேணுகிறது.
- issue: ἵνα தொடரின் செயல்பாடு
  choice: கட்டளையின் உள்ளடக்கமாக ‘நாம் ... அன்புகூர வேண்டும் என்பதே அது’ என்று வழங்குதல்
  alternative: ‘நாம் ஒருவரிலொருவர் அன்புகூருவதற்காக’ என்ற நோக்கப் பொருளாக வழங்கலாம்.
  rationale: இங்கு ἵνα, அவர்களிடம் தொடக்கத்திலிருந்த கட்டளை என்ன என்பதை விளக்கும் உள்ளடக்கத் தொடராக இயல்பாகப் புரிகிறது; அதேவேளை ‘வேண்டும்’ அதன் அறிவுறுத்தல் வலிமையைப் பேணுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், கடிதத்திற்குரிய மரியாதையும் மென்மையும் பேணப்பட்டுள்ளன. ஒருமை மரியாதை முகவரிக்காக ‘உமக்கு/உம்மிடம்’ பயன்படுத்தப்பட்டுள்ளது. ‘அம்மையே’ என்ற விளி இயல்பாகவும் கண்ணியமாகவும் இருந்து மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
