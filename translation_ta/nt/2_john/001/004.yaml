source:
  edition: SBLGNT
  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: ta
  text: பிதாவிடமிருந்து நாம் பெற்ற கட்டளையின்படியே, உன் பிள்ளைகளில் சிலர்[a] சத்தியத்தில்[b] நடப்பதைக் கண்டு நான் மிகவும் மகிழ்ந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் பிள்ளைகளில் இருந்து.’ கிரேக்கச் சொல்லமைப்பு எல்லாரையும் அவசியமாகக் குறிக்காமல், அவர்களில் ஒரு பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சத்தியத்தின்படி.’ இது வெறும் உண்மையோடு இருப்பதை மட்டுமல்லாமல், வெளிப்படுத்தப்பட்ட சத்தியத்துக்கு ஏற்ப வாழ்வதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: மிகவும் மகிழ்ந்தேன்
  rationale: இறந்தகால வினைச்சொல்லின் நிறைவுற்ற மகிழ்ச்சியையும் λίαν தரும் வலியுறுத்தலையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὕρηκα
  choice: கண்டதால்
  rationale: சூழலில் இது நேரில் கண்டறிந்ததையோ அறிந்துகொண்டதையோ குறிக்கிறது. கிரேக்க நிறைவுக்காலத்தின் தொடரும் விளைவு தமிழில் வாக்கியத்தின் காரணத் தொடர்பால் இயல்பாக உணர்த்தப்படுகிறது; ‘கண்டிருக்கிறேன்’ என்பது இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: ἐκ τῶν τέκνων σου
  choice: உன் பிள்ளைகளில் சிலர்
  rationale: ἐκ + வேற்றுமை வடிவம் முழுத் தொகுதியிலிருந்து ஒரு பகுதியைக் குறிக்கிறது; எல்லாப் பிள்ளைகளையும் குறிக்காமல் அந்தப் பகுத்துணர்வைத் தெளிவாகக் காக்கிறது.
- source_word: περιπατοῦντας
  choice: நடப்பதை
  rationale: யோவானின் நெறிசார் உருவகத்தை ‘வாழ்வதை’ என்று விளக்கமாக மாற்றாமல், ‘நடத்தல்’ என்ற மூல உருவகத்தையே தக்கவைக்கிறது.
- source_word: ἐν ἀληθείᾳ
  choice: சத்தியத்தில்
  rationale: வெறும் நேர்மையைக் காட்டிலும் வெளிப்படுத்தப்பட்ட சத்தியத்துக்கு ஏற்ப வாழும் தளத்தையோ நெறியையோ குறிக்கக்கூடிய யோவானிய சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: καθὼς ἐντολὴν ἐλάβομεν
  choice: நாம் பெற்ற கட்டளையின்படியே
  rationale: καθὼς காட்டும் ஒத்திசைவையும் ἐλάβομεν என்ற இறந்தகாலப் பன்மையையும் இயல்பாகக் காக்கிறது.
- source_word: παρὰ τοῦ πατρός
  choice: பிதாவிடமிருந்து
  rationale: மூலத்தில் உள்ள ‘பிதா’ என்ற உறவுப்பெயரை ‘பிதாவாகிய தேவன்’ என்று விரிவாக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘பிதா’ என்பவரின் குறிப்பு
  choice: பிதாவிடமிருந்து
  alternative: பிதாவாகிய தேவனிடமிருந்து
  rationale: மூல உரை τοῦ πατρός என்று மட்டுமே கூறுகிறது. யோவானியச் சூழலில் இது தேவனைக் குறித்தாலும், மொழிபெயர்ப்பு மூலத்தில் இல்லாத ‘தேவன்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- issue: ‘உன் பிள்ளைகள்’ என்பதன் பரப்பு
  choice: உன் பிள்ளைகளில் சிலர்
  alternative: உன் பிள்ளைகள்
  rationale: ἐκ என்ற பகுத்துக் காட்டும் அமைப்பு அவர்களில் ஒரு பகுதியைக் குறிக்கிறது; அனைவரும் சத்தியத்தில் நடக்கிறார்கள் என்று உரை கூறாததை மொழிபெயர்ப்பு கூறாது.
- issue: ‘சத்தியத்தில் நடத்தல்’ என்பதன் பொருள்
  choice: உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: சத்தியத்தின்படி வாழ்தல்
  rationale: இது வெறும் மனப்பூர்வ நேர்மையா அல்லது வெளிப்படுத்தப்பட்ட சத்தியத்துக்கு ஏற்ப வாழ்வா என்ற நுண்மையை முழுமையாகத் தீர்மானிக்காமல், யோவானின் நெறிசார் நடை உருவகத்தைப் பாதுகாக்கிறது.
