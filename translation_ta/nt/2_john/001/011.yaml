id: 2JN.1.11
reference: 2 John 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ⸂λέγων γὰρ⸃ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: ta
  text: ஏனெனில், அவனுக்கு “வணக்கம்”[a] என்று சொல்கிறவர் அவனுடைய தீய செயல்களில் பங்குகொள்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகிழ்க.” கிரேக்கச் சொல் χαίρειν வழக்கமான வாழ்த்துச் சூத்திரம். இந்தச் சூழலில் அது வெறும் மரியாதைப் பேச்சை மட்டுமல்லாமல், வரவேற்பையோ ஆதரவையோ தெரிவிப்பதையும் உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: சொல்கிறவர்
  rationale: இறந்தகாலமல்லாத பங்கேற்புவினையுடன் வரும் சுட்டுருபு, இவ்வாறு செய்கிற எவரையும் பொதுவாகக் குறிக்கிறது; தமிழில் “சொல்கிறவர்” அந்தப் பொதுப்பொருளை இயல்பாகத் தருகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் தடைக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐτῷ
  choice: அவனிடம்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நபரைச் சுட்டும் வேற்றுமை உருபுடைய பதிலிப்பெயரை, கூடுதல் விளக்கம் சேர்க்காமல் நேரடியாகத் தருகிறது.
- source_word: χαίρειν
  choice: “வாழ்த்துகள்”
  rationale: λέγων என்பதற்குப் பின் வரும் இச்சொல் இங்கு வழக்கமான வாழ்த்துச் சொல்லாகச் செயல்படுகிறது; “மகிழ்க” என்ற சொற்பொருளைவிட “வாழ்த்துகள்” என்பது அதன் பயன்பாட்டுப் பொருளை இயல்பாகத் தருகிறது.
- source_word: κοινωνεῖ
  choice: பங்குகொள்கிறார்
  rationale: வேற்றுமை உருபுடன் இணைந்து ஒன்றில் பங்கேற்பதையோ பங்குபெறுவதையோ குறிக்கிறது; இங்கு தீய செயல்களுடனான உடந்தைப் பொறுப்பைத் தருகிறது, ஆனால் அதை விளக்கமாக விரிவாக்குவதில்லை.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: அவனுடைய தீய செயல்களில்
  rationale: ἔργα என்பதற்கு இயல்பான “செயல்கள்” என்பதையும், πονηρά என்பதன் அறநெறிசார் தன்மைக்கு “தீய” என்பதையும் பயன்படுத்தி, பங்கேற்பின் பொருளாக இருப்பதை “-இல்” வேற்றுமை காட்டுகிறது.
theological_decisions:
- issue: இந்த வாழ்த்து வெறும் மரியாதையைக் குறிக்கிறதா, அல்லது ஆதரவு மற்றும் உடந்தையைக் குறிக்கிறதா?
  choice: வசனம் வாழ்த்துச் சொல்லை அப்படியே வைத்துக்கொண்டு, அத்தகைய வாழ்த்தைச் சொல்வது அந்த நபரின் தீய செயல்களில் பங்குகொள்வதாகும் எனக் கூறுகிறது.
  alternative: எந்தச் சூழலிலும் எந்தவித மரியாதை வாழ்த்தையும் கூறக்கூடாது என்ற முழுமையான தடை.
  rationale: χαίρειν ஒரு வழக்கமான வாழ்த்துச் சூத்திரமாக இருந்தாலும், κοινωνεῖ என்பதும் முந்தைய வசனத்தில் உள்ள வீட்டில் ஏற்றுக்கொள்வது பற்றிய சூழலும் ஆதரவு அல்லது உடந்தை என்ற தீவிரத்தைத் தருகின்றன. பிரதான உரை அந்தத் தெய்வவியல் பதற்றத்தை விளக்கச் சேர்க்கையால் முடிவுசெய்யாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் dignified, concise wording. “பங்குகொள்கிறார்” என்பது சபைச்சார்ந்த குறுகிய தொழில்நுட்பப் பொருளைத் தவிர்த்து, அறநெறிசார் உடந்தையை இயல்பாக வெளிப்படுத்துகிறது.
