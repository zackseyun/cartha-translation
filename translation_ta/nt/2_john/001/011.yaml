revisions:
- from: ஏனெனில், அவனிடம் “வாழ்த்துகள்”[a] என்று சொல்கிறவர் அவனுடைய தீய செயல்களில் பங்குகொள்கிறார்.
  to: ஏனெனில், அவனுக்கு “வணக்கம்”[a] என்று சொல்கிறவர் அவனுடைய தீய செயல்களில் பங்குகொள்கிறார்.
  rationale: 'The revision makes a limited lexical and idiomatic correction: “வணக்கம்” is a natural Tamil salutation for Greek χαίρειν in this construction, whereas “வாழ்த்துகள்” can imply congratulations. The main text continues to preserve the source''s wording and leaves the contextual question of welcome or endorsement to the footnote rather than resolving it interpretively.'
