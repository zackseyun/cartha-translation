source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: ta
  text: ஏனெனில், இயேசுவே ஆண்டவர் என்று[a] உன் வாயால் அறிக்கையிட்டு, கடவுள் அவரை இறந்தோரிலிருந்து உயிர்த்தெழச் செய்தார் என்று உன் இதயத்தில் நம்பினால், நீ மீட்கப்படுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசுவை ஆண்டவராக அறிக்கையிட்டு.” கிரேக்கத் தொடரை இவ்வாறு சுருக்கமாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது; சூழலில் இதன் காரணப்பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: ἐὰν
  choice: நம்பினால்
  rationale: ὁμολογήσῃς மற்றும் πιστεύσῃς ஆகிய இரு வினைகளையும் உள்ளடக்கும் நிபந்தனைத் தொடராகத் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: ὁμολογήσῃς
  choice: அறிக்கையிட்டு
  rationale: வாய்மொழியாக வெளிப்படையாக ஒப்புக்கொண்டு அறிவிக்கும் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐν τῷ στόματί σου
  choice: உன் வாயால்
  rationale: வாய்மொழி அறிக்கையின் கருவியையும் வெளிப்படையான தன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: κύριον Ἰησοῦν
  choice: இயேசுவே ஆண்டவர் என்று
  rationale: இயேசுவைப் பற்றிய அறிக்கையின் உள்ளடக்கத்தைத் தெளிவாக்கி, κύριος என்பதைக் ‘ஆண்டவர்’ என்று மொழிபெயர்க்கிறது; வலியுறுத்தும் ‘ஏ’ உருபு கூறுபயனைக் காட்டுகிறது.
- source_word: πιστεύσῃς
  choice: நம்பினால்
  rationale: பின்வரும் ὅτι தொடரில் சொல்லப்படும் நிகழ்வை உண்மையென உள்ளார்ந்து நம்புவதைக் குறிக்கிறது.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: உன் இதயத்தில்
  rationale: கிரேக்கத்தின் ‘இதயம்’ என்ற உருவகத்தையும் உள்ளார்ந்த நம்பிக்கையின் பொருளையும் பாதுகாக்கிறது.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: கடவுள் அவரை உயிர்த்தெழச் செய்தார்
  rationale: கடவுளே இயேசுவை மரணத்திலிருந்து எழுப்பினார் என்ற செயப்பொருளையும் இறந்தகால நிகழ்வையும் தெளிவாகத் தருகிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: ‘இறந்தவர்களிடமிருந்து’ என்ற மூலப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: σωθήσῃ
  choice: நீ மீட்கப்படுவாய்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் பவுலின் இரட்சிப்புச் சூழலையும் காக்கும் நவீன, புரிந்துகொள்ளத்தக்க தமிழ்.
theological_decisions:
- issue: κύριος என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு அதிகாரத்தை மட்டும் அல்லாமல் சுற்றியுள்ள வேதவாக்கியச் சூழலையும் தாங்கும் அறிக்கைப் பட்டமாக இருப்பதால் ‘ஆண்டவர்’ பொருத்தமானது.
- issue: κύριον Ἰησοῦν என்ற அறிக்கைத் தொடரின் வடிவம்
  choice: இயேசுவே ஆண்டவர் என்று
  alternative: இயேசுவை ஆண்டவராக
  rationale: எதை அறிக்கையிடுகிறார்கள் என்பதை முதன்மை உரை வெளிப்படையாகக் கூறுகிறது; மாற்று இலக்கண அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: σωθήσῃ என்பதன் இரட்சிப்பியல் வலிமை
  choice: நீ மீட்கப்படுவாய்
  alternative: நீ காப்பாற்றப்படுவாய்
  rationale: பொதுவான ஆபத்திலிருந்து காப்பாற்றப்படுதல் என்ற அளவில் பொருளைச் சுருக்காமல், இச்சூழலின் இரட்சிப்புப் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதவாக்கியத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘இதயம்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; கிறிஸ்தவ வட்டாரத்திற்கு மட்டும் உரிய கடினமான சொற்களைத் தவிர்த்து ‘மீட்கப்படுவாய்’ பயன்படுத்தப்பட்டுள்ளது.
