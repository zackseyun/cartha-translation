source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: ta
  text: ஆனால் எல்லாரும் நற்செய்திக்குக் கீழ்ப்படியவில்லை.[a] ஏனெனில் ஏசாயா, “ஆண்டவரே, எங்கள் செய்தியை[b] நம்பியவர் யார்?” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுவிசேஷத்துக்குக் கீழ்ப்படியவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எங்கள் அறிக்கையை”; சொல்லர்த்தமாக, “எங்கள் கேட்டலை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள முரண்பாட்டை இயல்பான நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: οὐ πάντες
  choice: எல்லாரும் … இல்லை
  rationale: முழுமையான மறுப்பாக அல்லாமல், கிரேக்கத்தில் உள்ள பகுதி மறுப்பை அப்படியே காக்கிறது.
- source_word: ὑπήκουσαν
  choice: கீழ்ப்படியவில்லை
  rationale: வெறுமனே கேட்டல் அல்லது ஏற்றுக்கொள்ளுதல் என்பதைக் காட்டிலும் ὑπακούω கூறும் கீழ்ப்படிதலின் வலுவான பொருளைக் காக்கிறது.
- source_word: τῷ εὐαγγελίῳ
  choice: நற்செய்திக்கு
  rationale: εὐαγγέλιον என்பதன் அடிப்படைப் பொருளை இன்றைய வாசகர்களுக்குத் தெளிவான தமிழில் வழங்குகிறது; மரபான ‘சுவிசேஷம்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἠσαΐας
  choice: ஏசாயா
  rationale: தீர்க்கதரிசியின் பெயருக்கான பரவலாக அறியப்பட்ட தமிழ் வடிவம்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கு வேதவசன ஆதாரத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைக் காக்கிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: வேதவாக்கை நிகழ்காலத்தில் உயிருள்ள சாட்சியாக மேற்கோள் காட்டும் கிரேக்க நிகழ்காலத்தைத் தக்கவைக்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: விளி வேற்றுமையையும் மரியாதைமிக்க, இயல்பான தமிழ் அழைப்பையும் வெளிப்படுத்துகிறது.
- source_word: τίς
  choice: யார்
  rationale: கிரேக்க வினாப்பெயர்ச்சொல்லின் நேரான, இயல்பான தமிழ் இணை.
- source_word: ἐπίστευσεν
  choice: நம்பியவர்
  rationale: மேற்கோளின் சொல்லாட்சிக்கு இயல்பான தமிழை வழங்குவதோடு, நம்பிக்கையுடன் பதிலளித்த செயலைக் காக்கிறது.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: எங்கள் செய்தியை
  rationale: ἀκοή இங்கு கேட்கப்பட்ட அறிவிப்பு அல்லது செய்தியின் உள்ளடக்கத்தைக் குறிக்கிறது. ‘செய்தி’ என்பது தெளிவான நவீன தமிழ்; ‘அறிக்கை’ மற்றும் சொல்லர்த்தமான ‘கேட்டல்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: ὑπήκουσαν τῷ εὐαγγελίῳ என்பதில் நற்செய்தி கோரும் பதிலின் இயல்பு
  choice: ‘நற்செய்திக்குக் கீழ்ப்படியவில்லை’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நற்செய்தியைக் கேட்கவில்லை’ அல்லது ‘நற்செய்திக்குச் செவிசாய்க்கவில்லை’
  rationale: கிரேக்க வினைச்சொல் வெளிப்படையாகக் கீழ்ப்படிதலைக் குறிக்கிறது. இரட்சிப்பின் செயல்முறை குறித்து ஒரு குறிப்பிட்ட சமயக்கோட்பாட்டைச் சேர்க்காமல், விசுவாசத்துக்கும் கீழ்ப்படிதலுள்ள பதிலுக்கும் பவுல் ஏற்படுத்தும் தொடர்பை இது காக்கிறது.
- issue: ஏசாயா மேற்கோளில் ἀκοή என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘செய்தி’ என்று தரப்பட்டது.
  alternative: ‘அறிக்கை’ அல்லது ‘கேட்டல்’
  rationale: இந்தச் சொல் கேட்டல் என்ற செயலையோ கேட்கப்பட்ட அறிவிப்பின் உள்ளடக்கத்தையோ குறிக்கலாம். இங்கு உள்ளடக்கப் பொருள் தமிழில் மிகவும் இயல்பானது; உண்மையான சொற்பொருள் நெகிழ்வு அடிக்குறிப்பில் வெளிப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேத மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எல்லாரும் … இல்லை’ என்ற அமைப்பு பகுதி மறுப்பைத் தெளிவாகக் காக்கிறது. அடிக்குறிப்பு [b] பொருள்படும் ‘செய்தி’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
