base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: ta
  text: அல்லது, “ஆழ்குழிக்குள்[a] யார் இறங்குவார்?” (அதாவது, மேசியாவை[b] இறந்தோரிலிருந்து மேலே கொண்டுவருதல்.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பேராழத்திற்குள்” என்றும் மொழிபெயர்க்கலாம். பவுல் உபாகமம் 30:13-ஐ எதிரொலிக்கிறார்; ஆனால் இங்கே “ஆழ்குழி” என்ற சொல்லைப் பயன்படுத்தி, மேசியாவை இறந்தோரிலிருந்து மேலே கொண்டுவருவதற்கு அந்த மொழியைப் பொருத்துகிறார்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “கிறிஸ்து”; இங்கே Χριστός ஒரு பட்டமாகச் செயல்படுவதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: அல்லது
  rationale: முந்தைய வசனத்தின் மேற்கோளுடன் முரண்பாட்டுத் தொடர்பில் இரண்டாவது வினாவை அறிமுகப்படுத்தும் எளிய, இயல்பான இணைப்புச்சொல்.
- source_word: Τίς
  choice: யார்
  rationale: நேரடியான வினாப்பெயரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: καταβήσεται
  choice: இறங்கப்போகிறவர்
  rationale: எதிர்காலச் செயலைத் தெளிவாகக் காட்டுகிறது; தமிழில் ‘யார் இறங்குவார்?’ என்பதும் சாத்தியம், ஆனால் மேற்கோளின் வினாவை இயல்பாக அமைக்க இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: εἰς τὴν ἄβυσσον
  choice: ஆழ்குழிக்குள்
  rationale: ἄβυσσος குறிக்கும் அளவிடமுடியாத ஆழத்தின் உருவகத்தைத் தக்கவைக்கிறது; அதை ‘கல்லறை,’ ‘பாதாளம்’ அல்லது ‘இறந்தோரின் உலகம்’ என்று விளக்கமாகச் சுருக்கவில்லை.
- source_word: τοῦτ’ ἔστιν
  choice: அதாவது
  rationale: பவுலின் விளக்கக் கூற்றை நவீனத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: Χριστόν
  choice: மேசியாவை
  rationale: இங்கு Χριστός ஒரு பெயராக அல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டமாகச் செயல்படுவதால் அதன் பட்டப் பொருளை வெளிப்படுத்துகிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: கிரேக்க மரபுத்தொடரின் கூட்டுப் பொருளையும், இறந்தவர்களிடமிருந்து வெளியே கொண்டுவரும் கருத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀναγαγεῖν
  choice: மேலே கொண்டுவருவது
  rationale: ἀνάγω என்பதன் இடஞ்சார்ந்த ‘மேலே கொண்டுவருதல்’ என்ற உருவகத்தைத் தக்கவைத்து, ‘உயிர்த்தெழச் செய்வது’ என்று நேரடியாக விளக்கிவிடாமல் இருக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இந்த இடத்தில் சொல் பட்டமாக வலுவாகச் செயல்படுகிறது. ‘மேசியா’ அதன் பொருளை வெளிப்படுத்துகிறது; ‘கிறிஸ்து’ என்ற மரபுவழி ஒலிபெயர்ப்பும் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ἄβυσσος குறிக்கும் இடம்
  choice: ஆழ்குழி என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: பாதாளம் / இறந்தோரின் உலகம்
  rationale: பவுல் உபாகமம் 30-ன் மொழியை மாற்றிப் பயன்படுத்தி, அதை மேசியாவை இறந்தோரிலிருந்து மேலே கொண்டுவருவதுடன் தொடர்புபடுத்துகிறார். குறிப்பிட்ட ஓர் இறப்புலகக் கோட்பாடாக இதைச் சுருக்காமல் மூலத்தின் உருவகத்தையும் இறையியல் இழுபறியையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம மேற்கோளுக்குரிய கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. அடைப்புக்குறிக்குள் உள்ள விளக்கம் கிரேக்கத்தின் சுருக்கமான விளக்க வடிவத்தைப் பாதுகாக்கிறது.
