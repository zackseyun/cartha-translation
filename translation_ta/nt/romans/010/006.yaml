  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: ta
  text: 'ஆனால் விசுவாசத்திலிருந்து வரும் நீதியோ[a] இவ்வாறு கூறுகிறது: “உன் உள்ளத்தில், ‘யார் வானத்திற்கு ஏறிச் செல்வார்?’ என்று சொல்லாதே.” (அதாவது,[c] மெசியாவைக்[b] கீழே கொண்டுவருவது.)'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதி’ என மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொல், சூழலின்படி ‘நியாயம்’ அல்லது ‘சரியான நிலை’ என்ற பொருள் நிழல்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘கிறிஸ்து’; இங்கு அது ஒரு பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: பவுல் உபாகமம் 30:12-ஐ எதிரொலித்து, அதை மெசியாவுக்குப் பொருத்துகிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: நீதி
  rationale: பவுலின் சொல்லில் உள்ள சரியான நிலை மற்றும் நியாயம் ஆகிய இரு பொருள் நிழல்களையும் தமிழ் ‘நீதி’ இயன்றவரை தக்கவைக்கிறது; சூழலில் விசுவாசத்திலிருந்து வரும் நீதியைச் சுட்டுகிறது.
- source_word: ἐκ πίστεως
  choice: விசுவாசத்திலிருந்து வரும்
  rationale: ἐκ என்பதன் மூலத்தோற்றப் பொருளை நேரடியாக வெளிப்படுத்தி, முந்தைய வசனத்தில் நியாயப்பிரமாணத்தை அடிப்படையாகக் கொண்ட நீதியுடன் உள்ள எதிர்மறை ஒப்பீட்டையும் காக்கிறது.
- source_word: οὕτως λέγει
  choice: இவ்வாறு கூறுகிறது
  rationale: நீதியைப் பேசும் ஒருவர்போல் உருவகப்படுத்தும் கிரேக்க இலக்கண அமைப்பை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: உன் உள்ளத்தில் ... என்று சொல்லாதே
  rationale: καρδία இங்கு உள்ளார்ந்த சிந்தனையையும் நோக்கத்தையும் குறிக்கிறது; உபாகம மேற்கோளின் வடிவமும் காக்கப்படுகிறது.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: யார் வானத்திற்கு ஏறிச் செல்வார்?
  rationale: ἀναβαίνω என்பதன் மேலே செல்லும் இயக்கத்தையும் εἰς என்பதன் இலக்கையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: Χριστόν
  choice: மெசியாவை
  rationale: இங்கு Χριστός பெயரைப் போல அல்லாமல் பட்டமாகச் செயல்படுவதால் அதன் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற மெசியத் தன்மையைத் தக்கவைக்கிறது.
- source_word: καταγαγεῖν
  choice: கீழே கொண்டுவருவது
  rationale: வானத்திற்கு ஏறுவது மெசியாவைக் கீழே கொண்டுவருவதாக அமையும் என்ற பவுலின் விளக்கத்தை, மூலத்தில் இல்லாத ‘வானிலிருந்து’ போன்ற சொற்களைச் சேர்க்காமல் தருகிறது.
theological_decisions:
- issue: ‘விசுவாசத்திலிருந்து வரும் நீதி’ உருவகமாகப் பேசுவது
  choice: ‘நீதியோ ... கூறுகிறது’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘விசுவாசத்தால் வரும் நீதியைப் பற்றி இவ்வாறு கூறப்பட்டுள்ளது’ என்று உருவகத்தை நீக்குதல்
  rationale: δικαιοσύνη என்பதே λέγει என்பதன் இலக்கண எழுவாய்; ஆகவே பவுலின் சொல்லாட்சியையும் முந்தைய வசனத்துடனான முரண்பாட்டையும் தக்கவைக்கிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: வேதவாக்கை மெசியாவுக்குப் பொருத்தும் இவ்விடத்தில் இது பட்டமாகத் தெளிவாகச் செயல்படுகிறது; இருப்பினும் கிரேக்க வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘கூறுகிறது’ என்பது நீதியின் உருவகப் பேச்சைத் தக்கவைக்கிறது; அடைப்புக்குறிக்குள் உள்ள விளக்கத்தின் சுருக்கமான, நிறைவுறாத அமைப்பு கிரேக்க மூலத்தின் சொல்லாட்சியைப் பிரதிபலிக்கிறது.
