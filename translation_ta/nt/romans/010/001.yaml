id: ROM.10.1
reference: Romans 10:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: ta
  text: சகோதரர்களே,[a] அவர்களுடைய மீட்புக்காக என் உள்ளத்தின் விருப்பமும், அவர்களுக்காகக் கடவுளிடம் நான் செய்யும் வேண்டுதலும் இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளே”; கிரேக்கத்தில் ஆண்பால் பன்மை வடிவம் பயன்படுத்தப்பட்டிருந்தாலும், அது ஆண்களும் பெண்களும் சேர்ந்த குழுவை அழைக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவத்தை முதன்மை உரையில் இயல்பான தமிழில் காக்கிறது; கலப்புப் பாலினச் சபையினரையும் இது உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: εὐδοκία τῆς ἐμῆς καρδίας
  choice: என் உள்ளத்தின் விருப்பம்
  rationale: இங்கு εὐδοκία என்பது நல்விருப்பம் என்ற கருத்தை விட பவுலின் ஆழ்ந்த ஏக்கத்தையோ விருப்பத்தையோ குறிக்கிறது; καρδία என்பதற்கு இயல்பான தமிழில் ‘உள்ளம்’ பொருத்தமானது.
- source_word: δέησις
  choice: வேண்டுதல்
  rationale: சாதாரண ஜெபம் என்பதைக் காட்டிலும் கடவுளிடம் வைக்கப்படும் தீவிரமான விண்ணப்பம் என்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: πρὸς τὸν θεόν
  choice: கடவுளிடம்
  rationale: πρός உடன் வரும் திசைநோக்கிய பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑπὲρ αὐτῶν
  choice: அவர்களுக்காக
  rationale: ὑπέρ இங்கு அவர்களுடைய நன்மைக்காக அல்லது அவர்கள் சார்பாக வேண்டுதல் செய்வதைக் குறிக்கிறது; சுட்டுப்பெயரையே மூலத்தைப் போலத் தக்கவைக்கிறது.
- source_word: εἰς σωτηρίαν
  choice: அவர்களுடைய மீட்புக்காகவே
  rationale: εἰς குறிக்கும் இலக்கை வெளிப்படுத்துகிறது; மீட்பு ‘அவர்களுக்கு’ உரியது என்பதைத் தமிழில் தெளிவாக்குகிறது. ‘-வே’ இரு ஒருமை எழுவாய்களுக்கும் பொதுவான இலக்கை இயல்பாக இணைக்கிறது.
- source_word: μέν
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு μέν மென்மையான உரையாடல்/எதிர்மறை அமைப்புச் சுட்டியாக உள்ளது; வெளிப்படையான δέ இல்லாததால் தனிச் சொல்லாக மொழிபெயர்த்தால் தமிழில் தேவையற்ற வலியுறுத்தல் தோன்றும்.
theological_decisions:
- issue: Ἀδελφοί என்ற பாலினக் குறியுடைய அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரை காக்கிறது; அதேவேளையில், சபையின் பெண்களையும் உள்ளடக்கிய வழக்கமான அழைப்பாக இருக்கக்கூடிய பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: σωτηρία என்பதன் மொழிபெயர்ப்பு
  choice: மீட்பு
  alternative: இரட்சிப்பு
  rationale: σωτηρία என்பதன் காப்பாற்றுதல்/விடுவித்தல் சார்ந்த பரப்பை நவீன பொதுத் தமிழில் ‘மீட்பு’ இயல்பாகத் தருகிறது; குறிப்பிட்ட சமய மரபின் சொல்லாட்சியை மட்டும் முன்னிறுத்தாமல் இருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘உள்ளம்’, ‘வேண்டுதல்’, ‘மீட்பு’ ஆகியவை இயல்பையும் மூலச்சொற்களின் நுணுக்கத்தையும் சமநிலைப்படுத்துகின்றன; சுட்டுப்பெயரான ‘அவர்கள்’ முந்தைய சூழலைச் சார்ந்ததாகவே வைக்கப்பட்டுள்ளது.
