  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: ta
  text: ஏனெனில், நம்புகிற ஒவ்வொருவருக்கும் நீதி[b] உண்டாகும்படி, மெசியா திருச்சட்டத்தின் முடிவாக[a] இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முடிவு’ என்பதற்குப் பதிலாக ‘இலக்கு’ அல்லது ‘நிறைவு’ என்றும் மொழிபெயர்க்கலாம். இதற்கான கிரேக்கச் சொல் முடிவுறுதல், இலக்கு, அல்லது உச்சநிறைவு ஆகியவற்றைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: பவுலின் பயன்பாட்டில் ‘நீதி’ என்பதை ‘நியாயம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: முடிவு
  rationale: ‘முடிவு’ என்பது முடிவுறுதல் என்ற பொருளோடு, ஒரு செயலின் முடிவுப்புள்ளி அல்லது நிறைவு என்ற நுண்பொருளையும் தாங்கக்கூடியது. கிரேக்கச் சொல்லிலுள்ள ‘முடிவுறுதல்’ மற்றும் ‘இலக்கு/நிறைவு’ ஆகிய இரு சாத்தியங்களையும் பிரதான உரையில் ஓரளவு திறந்துவைக்கிறது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: νόμου
  choice: திருச்சட்டத்தின்
  rationale: இங்கு νόμος என்பது பொதுவான எந்தச் சட்டத்தையும் அல்லாமல், பவுலின் சூழலில் இஸ்ரவேலுக்குக் கொடுக்கப்பட்ட மோசேயின் சட்டத்தைக் குறிக்கிறது. நவீனத் தமிழில் அந்த அறியப்பட்ட உடன்படிக்கைச் சட்டத்தைக் கண்ணியமாகவும் தெளிவாகவும் குறிக்க ‘திருச்சட்டம்’ பயன்படுத்தப்படுகிறது.
- source_word: Χριστὸς
  choice: மெசியா
  rationale: இஸ்ரவேலின் திருச்சட்டத்துடனும் உடன்படிக்கை நம்பிக்கைகளுடனும் இயேசுவுக்கு உள்ள உறவை இவ்வசனம் கூறுவதால், Χριστός என்பதன் பட்டப்பெயர்ச் சார்ந்த பொருளை ‘மெசியா’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: εἰς δικαιοσύνην
  choice: நீதியை அடைவதற்கு
  rationale: εἰς என்பதன் நோக்கம்/விளைவு சார்ந்த திசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘அடைவதற்கு’ என்பது வாக்கியத்தைத் தெளிவாக்கினாலும், அந்த நீதி எவ்வாறு கிடைக்கிறது என்ற தனிப்பட்ட கோட்பாட்டைச் சேர்க்கவில்லை.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: δικαιοσύνη என்பதற்கு பவுலின் பயன்பாட்டில் வழக்கமானதும் பரந்த பொருளுடையதுமான தமிழ்ச் சொல் ‘நீதி’. ‘நியாயம்’ என்ற சட்ட/சமூக நீதி சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: παντὶ τῷ πιστεύοντι
  choice: நம்புகிற ஒவ்வொருவரும்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான ‘நம்புகிற’ என்ற பொருளையும், παντί என்பதன் உள்ளடக்கமான ‘ஒவ்வொருவரும்’ என்ற வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது. தமிழின் நோக்கவாக்கிய அமைப்புக்கேற்ப இது எழுவாயாக வடிவமைக்கப்பட்டுள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கத்தை அறிமுகப்படுத்தும் γάρ என்பதன் உரையாடல் தொடர்பை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: τέλος νόμου என்பது மோசேயின் திருச்சட்டத்துடன் மெசியாவுக்கு உள்ள உறவை எவ்வாறு குறிக்கிறது?
  choice: பிரதான உரையில் ‘திருச்சட்டத்தின் முடிவு’
  alternative: ‘திருச்சட்டத்தின் இலக்கு’ அல்லது ‘திருச்சட்டத்தின் நிறைவு’
  rationale: τέλος என்பது திருச்சட்டம் முடிவுக்கு வருதல் என்றும், அது நோக்கிச் சென்ற இலக்கு அல்லது நிறைவு என்றும் புரிந்துகொள்ளப்படலாம். பிரதான உரை ‘முடிவு’ என்று கூறி இந்த இறையியல் இழுபறியைத் தீர்த்துவிடாமல் வைக்கிறது; இலக்கு/நிறைவு வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: Χριστός என்பதன் பட்டப்பெயர்ச் சார்ந்த பொருள்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இஸ்ரவேலின் திருச்சட்டமும் உடன்படிக்கையும் மையமாக இருப்பதால், அபிஷேகம் செய்யப்பட்ட அரசர்/மீட்பர் என்ற பட்டப்பெயரின் பொருளை ‘மெசியா’ முன்னிறுத்துகிறது.
- issue: δικαιοσύνη என்பதன் பவுலியப் பொருள்
  choice: நீதி
  alternative: நியாயம்
  rationale: ‘நீதி’ என்பது தேவனுக்கு முன்பான நேர்மை, சரியான உறவு, நீதியான செயல் ஆகிய பொருள் எல்லைகளைத் திறந்துவைக்கிறது. ‘நியாயம்’ என்ற மாற்று சமூக அல்லது நீதித்துறைச் சாயலை அதிகமாகக் கேட்கச் செய்யலாம்; எனவே அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கமான அமைப்பு தமிழில் தெளிவாக அமைய நோக்கவாக்கியமாக மாற்றப்பட்டுள்ளது. ‘முடிவு’ என்ற சொல்லின் திட்டமிட்ட இருபொருள் தன்மை அடிக்குறிப்பின் உதவியுடன் பாதுகாக்கப்பட்டுள்ளது.
