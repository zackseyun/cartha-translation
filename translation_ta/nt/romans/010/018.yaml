source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: ta
  text: 'ஆனால் நான் கேட்கிறேன்: அவர்கள் கேட்கவில்லையா? ஆம், நிச்சயமாகக் கேட்டார்கள்:


    “அவர்களுடைய ஒலி பூமியெங்கும் சென்றது;[a]


    அவர்களுடைய சொற்கள் மக்கள் வாழும் உலகத்தின் எல்லைகள் வரை சென்றன.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பவுல் சங்கீதம் 19:4-ஐ மேற்கோள் காட்டி, அதன் மொழியை அறிவிக்கப்பட்ட செய்தி பரவியதற்குப் பயன்படுத்துகிறார்.
    reason: cross_reference
  - marker: b
    text: ‘மக்கள் வாழும் உலகம்’ என்பதற்கான கிரேக்கச் சொல்லைச் சுருக்கமாக ‘உலகம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: அவர்கள் கேட்கவில்லையா?
  rationale: μή οὐκ அமைப்பு நேர்மறையான பதிலை எதிர்பார்க்கும் வினாவாக உள்ளது. தமிழில் இந்த எதிர்மறை வினா அதன் சொல்லாட்சியையும் வாதத்திறனையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: μενοῦνγε
  choice: ஆம், நிச்சயமாகக் கேட்டார்கள்
  rationale: இச்சொல் வலியுறுத்தும் உறுதியான பதிலைத் தருகிறது. கிரேக்கத்தில் மறைந்துள்ள ‘கேட்டார்கள்’ என்ற வினையைத் தமிழில் வெளிப்படையாகக் கூறுவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: φθόγγος
  choice: ஒலி
  rationale: இச்சொல்லுக்கு ‘ஒலி’, ‘குரல்’ ஆகிய பொருள்கள் இருக்கலாம். மேற்கோள் காட்டப்படும் சங்கீதத்தின் கவித்துவச் சூழலுக்கும் ῥήματα என்பதுடன் உள்ள இணைப்புக்கும் ‘ஒலி’ பொருத்தமாக உள்ளது; இது உரையாற்றுபவர்கள் யார் என்று தேவையின்றி தீர்மானிப்பதையும் தவிர்க்கிறது.
- source_word: γῆ
  choice: பூமி
  rationale: உலகளாவிய பரப்பைக் குறிக்கும் இக்கவித்துவ மேற்கோளில் ஒரு குறிப்பிட்ட நாட்டையோ நிலப்பகுதியையோ விட ‘பூமி’ என்பதே பொருத்தமானது.
- source_word: ἐξῆλθεν
  choice: சென்றது
  rationale: கிரேக்க இறந்தகால வினையின் நேரடியான காலநிலையைப் பாதுகாக்கிறது. இரண்டாம் கவித்துவ வரியிலும் அதே வினை இயல்பாக நிரப்பப்பட்டுள்ளது.
- source_word: πέρατα
  choice: எல்லைகள்
  rationale: ‘மக்கள் வாழும் உலகத்தின் எல்லைகள் வரை’ என்பது பரவலின் மிகத் தொலைவான வரம்புகளைக் குறிக்கும் இயல்பான தமிழ் சொல்லாட்சி.
- source_word: οἰκουμένης
  choice: மக்கள் வாழும் உலகம்
  rationale: οἰκουμένη என்பது குடியிருப்புள்ள அல்லது மக்கள் வாழும் உலகைக் குறிக்கும் நுணுக்கத்தை உடையது. வெறுமனே ‘உலகம்’ என்று மொழிபெயர்ப்பதைவிட இத்தேர்வு அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ῥήματα
  choice: சொற்கள்
  rationale: இது கிரேக்கச் சொல்லின் நேரடியான பொருளைப் பாதுகாத்து, முதல் வரியிலுள்ள ‘ஒலி’ என்பதுடன் கவித்துவ இணைநிலையைத் தக்கவைக்கிறது; ‘செய்தி’ என்பது இங்கு அதிக விளக்கமளிக்கும் மொழிபெயர்ப்பாகிவிடும்.
theological_decisions:
- issue: சங்கீத மேற்கோளிலுள்ள ‘அவர்களுடைய’ என்பதன் சுட்டுப்பொருள்
  choice: சுட்டுப்பெயரை விளக்க விரிவாக்கமின்றி அப்படியே வைத்தல்
  alternative: அது சங்கீதம் 19-இல் உள்ள வானங்களைக் குறிக்கிறது என்றோ, பவுலின் பயன்பாட்டில் நற்செய்தி அறிவிப்பவர்களைக் குறிக்கிறது என்றோ வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: பவுல் சங்கீதம் 19:4-இன் மொழியைத் தமது வாதத்தில் பயன்படுத்துகிறார். ‘அவர்களுடைய’ என்பதன் சுட்டுப்பொருளை மொழிபெயர்ப்பிலேயே முடிவு செய்துவிடாமல் வைத்திருப்பது மூலத்தின் இடைநூல் தொடர்பையும் விளக்கவியல் இழுபறியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கேள்வி–பதில் அமைப்பின் வலிமையையும் மேற்கோளின் கவித்துவ இணைநிலையையும் பாதுகாக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்கள்’ என்பதன் சுட்டுப்பொருள் விளக்கவுரையால் நிரப்பப்படவில்லை.
