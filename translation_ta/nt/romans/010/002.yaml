  text: ஏனெனில், அவர்களுக்கு கடவுள்மீது பேரார்வம் உண்டு என்று அவர்களைக் குறித்து நான் சாட்சி கூறுகிறேன்; ஆனால் அது அறிவுக்கு ஏற்ப அமைந்ததல்ல[b].
  philosophy: optimal-equivalence
