lexical_decisions:
- source_word: μαρτυρῶ
  choice: சாட்சி கூறுகிறேன்
  rationale: நிகழ்காலத் தன்மை ஒருமை வினையை நேரடியாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது; பவுல் தமக்குத் தெரிந்ததைக் குறித்துச் சான்றளிக்கும் வலிமையையும் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துடன் உள்ள விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐτοῖς
  choice: அவர்களைக் குறித்து
  rationale: இங்கு வேற்றுமை உருபு சாட்சி யாரிடம் கூறப்படுகிறது என்பதைக் காட்டாமல், சாட்சி யாரைப்பற்றியது என்பதைக் காட்டுகிறது.
- source_word: ζῆλον
  choice: பேரார்வம்
  rationale: தீவிரமான சமய ஈடுபாட்டை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘வைராக்கியம்’ என்பதற்கு இன்றைய தமிழில் துறவுணர்வு என்ற வேறு பொருளும் இருப்பதால் அது தவிர்க்கப்பட்டது.
- source_word: θεοῦ
  choice: கடவுள்மீது
  rationale: இச்சூழலில் இறைவனை நோக்கிய ஆர்வம் என்ற புறநிலை உடைமைப் பொருள் வாய்ப்பைத் தெளிவாக வெளிப்படுத்துகிறது; கிரேக்க உடைமை வேற்றுமையின் மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἔχουσιν
  choice: உண்டு
  rationale: ‘அவர்கள் கொண்டிருக்கிறார்கள்’ என்பதைக் காட்டிலும் சுருக்கமாகவும் இயல்பாகவும் அவர்களிடம் அந்த ஆர்வம் இருப்பதைத் தெரிவிக்கிறது.
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: அவர்களின் ஆர்வத்தை ஏற்றுக்கொள்வதற்கும் அதன் குறையைச் சுட்டிக்காட்டுவதற்கும் இடையிலான கூர்மையான முரண்பாட்டைக் காக்கிறது.
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: அறிவுக்கு ஏற்ப அமைந்ததல்ல
  rationale: κατά + வேற்றுமை அமைப்பின் ‘அறிவின்படி/அறிவுக்கு ஏற்ப’ என்ற தொடர்பைக் காக்கிறது; ‘முழுமையான அறிவு’ அல்லது ‘உண்மையான அறிவு’ என்று உரையில் இல்லாத வரையறையைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இஸ்ரவேலரின் ஆர்வத்தின் தன்மை
  choice: அவர்களுடைய பேரார்வம் கடவுளை நோக்கியது; ஆனால் அது அறிவுக்கு ஏற்ப அமைந்ததல்ல
  alternative: அவர்களிடம் கடவுளுடைய சொந்த ஆர்வம் உள்ளது; அல்லது ஆர்வத்தின் நோக்கம் குறிப்பிடப்படவில்லை
  rationale: ζῆλον θεοῦ என்பதைச் சூழலில் கடவுளை நோக்கிய ஆர்வம் எனப் புரிந்துகொள்வது அடுத்த வசனங்களுடன் நன்கு பொருந்துகிறது. அதேவேளையில், அவர்களுடைய உண்மையான தீவிரத்தை ஏற்றுக்கொண்டு அதன் அறிவுசார் குறையை மறுக்கிற உரையின் இறையியல் பதற்றம் தீர்த்துவைக்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பேரார்வம்’ என்பது சமயத் தீவிரத்தை இயல்பாகக் காட்டுகிறது; ‘அந்த ஆர்வம்’ என்ற மீள்குறிப்பு கிரேக்கத்தில் மறைந்திருக்கும் கருத்தைத் தமிழில் தெளிவாக்குகிறது.
