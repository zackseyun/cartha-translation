  text: Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: ta
  text: ஏனெனில், ஆண்டவரின் பெயரைச் சொல்லி வேண்டிக்கொள்ளும் ஒவ்வொருவரும் மீட்கப்படுவார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பவுல் இங்கே யோவேல் 2:32-ஐ மேற்கோள் காட்டுகிறார். யோவேலில் ‘ஆண்டவர்’ என்பது YHWH-ஐக் குறிக்கிறது; இங்கே பவுல் சூழலின்படி இந்த வசனத்தை இயேசுவுக்குப் பொருத்துகிறார்.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘பெயரைச் சொல்லி முறையிடும்.’ கிரேக்கச் சொற்றொடர் ஆண்டவரின் பெயரை உச்சரித்து அவரை நோக்கி வேண்டுவதையோ முறையிடுவதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: ஒவ்வொருவரும்
  rationale: இந்தக் கட்டமைப்பு பாலின வேறுபாடின்றி யாராக இருந்தாலும் என்ற பொதுவான, எல்லாரையும் உள்ளடக்கும் பொருளைத் தருகிறது. ‘ஒவ்வொருவரும்’ என்பது அதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான வேதவசன ஆதாரத்தையோ விளக்கத்தையோ γάρ அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அந்த இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: ἐπικαλέσηται
  choice: பெயரைச் சொல்லி வேண்டிக்கொள்ளும்
  rationale: இங்கு வினைச்சொல் வெறுமனே ஒருவரை அழைப்பதைக் குறிக்காமல், ஆண்டவரின் பெயரை உச்சரித்து அவரை நோக்கி வேண்டுதல் அல்லது முறையிடுதலைக் குறிக்கிறது. இந்தத் தமிழாக்கம் அந்த வேதாகம வழக்கின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ ὄνομα
  choice: பெயரை
  rationale: ‘பெயர்’ என்பது அழைக்கப்படுகிறவரின் வெளிப்படுத்தப்பட்ட அடையாளத்தையும் அதிகாரத்தையும் அவரையே சார்ந்திருப்பதையும் உணர்த்தும் வேதாகமச் சொல்லாட்சி; ஆகவே அதை மறைபொருளாக்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: κυρίου
  choice: ஆண்டவரின்
  rationale: κύριος என்பதற்கு நவீன, கண்ணியமான தமிழில் ‘ஆண்டவர்’ பொருத்தமானது. மூலத்தில் இல்லாத ‘இயேசு’ அல்லது ‘யெகோவா’ என்பதை முதன்மை உரையில் சேர்க்காமல், மேற்கோளின் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: σωθήσεται
  choice: மீட்கப்படுவார்
  rationale: இங்குள்ள எதிர்காலச் செயப்பாட்டு வடிவம் பவுலின் சூழலில் இறையியல் சார்ந்த மீட்பைக் குறிக்கிறது. ‘மீட்கப்படுவார்’ அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: யோவேல் மேற்கோளில் வரும் ‘ஆண்டவர்’ யாரைக் குறிக்கிறார்?
  choice: முதன்மை உரையில் ‘ஆண்டவர்’ என்றே வைத்தல்; ரோமர் 10 சூழலில் பவுல் இதை இயேசுவுக்குப் பொருத்துவதை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ‘யெகோவா’ அல்லது ‘ஆண்டவராகிய இயேசு’ என்று விரிவாக்குதல்.
  rationale: கிரேக்க உரையில் κυρίου என்று மட்டுமே உள்ளது. யோவேல் 2:32-இல் அது YHWH-ஐக் குறித்தாலும், ரோமர் 10-இன் உடனடிச் சூழல் அதை இயேசுவோடு இணைக்கிறது. மூலத்தின் சொல்லாட்சியையும் அதன் இறையியல் பதற்றத்தையும் காக்க, விளக்கத்தை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பழமையான ‘நாமம்,’ ‘தொழுதுகொள்ளுதல்,’ ‘இரட்சிக்கப்படுதல்’ போன்ற வடிவங்களுக்குப் பதிலாக இயல்பான ‘பெயர்,’ ‘வேண்டிக்கொள்ளுதல்,’ ‘மீட்கப்படுதல்’ பயன்படுத்தப்பட்டுள்ளன; அதேவேளை வேதாகமச் சொல்லாட்சியின் இறையியல் ஆழம் காக்கப்பட்டுள்ளது.
