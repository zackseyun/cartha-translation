id: ROM.10.3
reference: Romans 10:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் தேவனின் நீதியை[a][b] அறியாமல், தங்களுடைய சொந்த நீதியை நிலைநாட்ட முயன்று, தேவனின் நீதிக்குக் கீழ்ப்படியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரு இடங்களிலும் வரும் “நீதி” என்பதற்கான கிரேக்கச் சொல் “நியாயம்” என்ற பொருளையும் தரலாம். பவுலின் பயன்பாட்டில் அது அறநேர்மை, நியாயம், அல்லது மக்களைத் தம்மோடு சரியான உறவில் நிறுத்தும் தேவனுடைய நீதியான வழி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தேவனின் நீதி” என்பதை “தேவனிடமிருந்து வரும் நீதி” அல்லது “தேவனுக்கே உரிய நீதி” என்றும் புரிந்துகொள்ளலாம்; கிரேக்கச் சொற்றொடர் இந்த ஒன்றுக்கு மேற்பட்ட நுணுக்கங்களுக்கு இடமளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: அறியாமல்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் காரணச் சூழலை இயல்பான தமிழில் தருகிறது; அறியாமையைச் சொல்கிறது, ஆனால் அதை வெளிப்படையான வேண்டுமென்ற மறுப்பாக மிகைப்படுத்தவில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான விளக்கக் காரணத்தைத் தெளிவாக இணைக்கிறது.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: நீதி
  rationale: பவுலின் பயன்பாட்டில் அறநேர்மை, நியாயம், சரியான நிலை, மக்களைச் சரியான உறவுக்குள் கொண்டுவரும் தேவனுடைய செயல் ஆகிய நுணுக்கங்களைத் தாங்கக்கூடிய வழக்கமான, கண்ணியமான தமிழ்ச் சொல்.
- source_word: τοῦ θεοῦ
  choice: தேவனின்
  rationale: தமிழில் இயல்பான உரிமைத் தொடர்பைத் தருகிறது; இது தேவனுக்குரிய நீதி, தேவனிடமிருந்து வரும் நீதி ஆகிய சாத்திய நுணுக்கங்களை முற்றிலும் தீர்மானிக்காதவாறு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἰδίαν
  choice: தங்களுடைய சொந்த நீதியை
  rationale: கிரேக்கத்தில் முன் வந்த ‘நீதி’ என்பது இங்கு விடுபட்டிருந்தாலும் பொருளில் தொடர்கிறது; தமிழில் தெளிவுக்காக அந்தப் பெயர்ச்சொல் மீண்டும் சேர்க்கப்பட்டுள்ளது.
- source_word: ζητοῦντες
  choice: முயன்று
  rationale: அவர்கள் தங்கள் நீதியை நிலைநாட்ட நாடிய செயலை இயல்பான தமிழில் தெரிவிக்கிறது; நோக்கத்தைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: στῆσαι
  choice: நிலைநாட்ட
  rationale: ἵστημι என்ற வினையின் இங்குள்ள ‘நிறுவுதல்/நிலைப்படுத்துதல்’ என்ற மரபுத்தொடர்ப் பொருளைத் துல்லியமாக வழங்குகிறது.
- source_word: ὑπετάγησαν
  choice: கீழ்ப்படியவில்லை
  rationale: இச்சூழலில் வரும் நடுவினைப் பொருள் கொண்ட செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் தருகிறது; தேவனின் நீதியின் ஆளுகைக்கு உட்படாததைக் குறிக்கிறது.
theological_decisions:
- issue: ‘தேவனின் நீதி’ என்ற பவுலின் சொற்றொடரின் பொருள்
  choice: முதன்மை உரையில் ‘தேவனின் நீதி’ என வைத்து, அது தேவனுக்குரிய நீதியா, தேவனிடமிருந்து வரும் நீதியா, அல்லது தேவன் நீதியுடன் மக்களைச் சரியானவர்களாக்கும் இரட்சிப்புச் செயலா என்பதைத் தீர்மானிக்காமல் விடப்பட்டுள்ளது.
  alternative: ‘தேவனிடமிருந்து வரும் நீதி’ அல்லது ‘தேவனுக்கே உரிய நீதி’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: τοῦ θεοῦ என்ற கிரேக்க வேற்றுமைத்தொடர் ஒன்றுக்கு மேற்பட்ட தொடர்பு நுணுக்கங்களைத் தாங்குகிறது. ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தை மட்டும் முதன்மை உரையில் திணிக்காமல் அந்த அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டுள்ளது. பங்கேற்புவினைத் தொடர்கள் தமிழில் சுருக்கமான வினையெச்சங்களாக வழங்கப்பட்டுள்ளன; கிரேக்கத்தின் காரணத் தொடரும் கருத்து முன்னேற்றமும் காக்கப்பட்டுள்ளன.
