id: ROM.10.21
reference: Romans 10:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: ta
  text: 'ஆனால் இஸ்ரவேலைக் குறித்து அவர் கூறுகிறார்[a]: “நாள் முழுவதும் கீழ்ப்படியாத[b], எதிர்த்துப் பேசுகிற[c] மக்களை நோக்கி என் கைகளை நீட்டினேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆனால் இஸ்ரவேலிடம் அவர் கூறுகிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர் இஸ்ரவேலிடம் நேரடியாகக் கூறப்படுவதையோ, இஸ்ரவேலைக் குறித்துக் கூறப்படுவதையோ உணர்த்தலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘கீழ்ப்படியாத’ என்பதற்கு ‘நம்பாத’ அல்லது ‘இணங்க மறுக்கிற’ என்ற பொருளும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘எதிர்க்கிற,’ ‘முரண்படுகிற,’ அல்லது ‘மறுத்துப் பேசுகிற’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: ஆனால் இஸ்ரவேலைக் குறித்து
  rationale: πρός + λέγει என்பதை இங்கு இஸ்ரவேலைப் பற்றிய கூற்றாக இயல்பாக வெளிப்படுத்துகிறது; நேரடியாக ‘இஸ்ரவேலிடம்’ என்று பொருள்கொள்ளும் வாய்ப்பும் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: λέγει
  choice: அவர் கூறுகிறார்
  rationale: பவுலின் உயிரோட்டமுள்ள நிகழ்கால மேற்கோள் முறையைப் பேணுகிறது. சூழலில் பேசுபவர் கடவுள் என்றாலும், கிரேக்கத்தில் எழுவாய் வெளிப்படையாக இல்லை.
- source_word: Ὅλην τὴν ἡμέραν
  choice: நாள் முழுவதும்
  rationale: கால நீட்சியைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐξεπέτασα
  choice: நீட்டிக்கொண்டிருந்தேன்
  rationale: நாள் முழுவதும் தொடர்ந்த செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது; கைகளை விரித்து அழைக்கும் மூல உருவகத்தையும் காக்கிறது.
- source_word: τὰς χεῖράς μου
  choice: என் கைகளை
  rationale: தெய்வீக அழைப்பு அல்லது வேண்டுகோளை உணர்த்தும் மனித உருவகத்தை நேரடியாகப் பேணுகிறது.
- source_word: πρὸς λαὸν
  choice: மக்களை நோக்கி
  rationale: கைகள் நீட்டப்படும் திசையை இயல்பாகக் குறிக்கிறது.
- source_word: λαὸν
  choice: மக்கள்
  rationale: λαός என்பதன் கூட்டு மற்றும் உடன்படிக்கைச் சார்ந்த பொருளை ‘தேசம்’ என்று அரசியல் பொருளில் குறுக்காமல் தருகிறது.
- source_word: ἀπειθοῦντα
  choice: கீழ்ப்படியாத
  rationale: நம்ப மறுத்தல், இணங்க மறுத்தல், கீழ்ப்படியாமை ஆகிய பொருள் வளையத்தில் இங்கு நெறிசார் எதிர்ப்பைத் தெளிவாகத் தருகிறது; மற்ற நிழற்பொருள்கள் அடிக்குறிப்பில் உள்ளன.
- source_word: ἀντιλέγοντα
  choice: எதிர்த்துப் பேசுகிற
  rationale: ἀντιλέγω என்பதிலுள்ள வாய்மொழியாக மறுத்தல் அல்லது முரண்பட்டுப் பேசுதல் என்ற செயற்பொருளை ‘எதிர்க்கிற’ என்பதைவிடத் துல்லியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் பதிலை வருணித்தல்
  choice: ‘கீழ்ப்படியாத, எதிர்த்துப் பேசுகிற மக்கள்’ என்று இரு செயற்பண்புகளையும் பேணுதல்
  alternative: ‘நம்பாத, எதிர்க்கிற மக்கள்’
  rationale: தெய்வீக முன்முயற்சிக்கும் மனித மறுப்புக்கும் இடையிலான தீர்க்கதரிசனத் தளராத பதற்றத்தை வசனம் கூறும் அளவிலேயே காக்கிறது; இன இஸ்ரவேலின் விரிவான இறையியல் நிலையைப் பற்றி கூடுதல் முடிவைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மேற்கோளின் கவித்துவ உருவகமும், கிரேக்கத்தின் பொருள் நுட்பங்களும் தேவையான அடிக்குறிப்புகளுடன் பேணப்பட்டுள்ளன.
