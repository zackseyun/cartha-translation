  source_fidelity: முதன்மை உரையில் “அவற்றைச் ... அவற்றால்” எனப் பன்மையாக வழங்கப்பட்டுள்ளது; ஆனால் SBLGNT-இல் ὁ ποιήσας என்பதன் வெளிப்படையான பொருள் τὴν δικαιοσύνην, மேலும் ἐν αὐτῇ ஒருமைப் பெண்பால் வடிவம் அதையே சுட்டுகிறது. லேவியராகமம் 18:5-ன் எதிரொலி பன்மைப் பொருளை விளக்கினாலும், மூலத்தின் ஒருமையை முதன்மை உரையில் இழக்கக் கூடாது.
