id: ROM.10.5
reference: Romans 10:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: ta
  text: 'ஏனெனில், திருச்சட்டத்திலிருந்து வரும் நீதியைக் குறித்து மோசே எழுதுகிறார்: “அந்த நீதியை நிறைவேற்றுகிற மனிதன் அதில் வாழ்வான்.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீதி” என்பதற்குப் பதிலாக “நியாயம்” என்றும் மொழிபெயர்க்கலாம் (δικαιοσύνη).
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “மனிதன்” என்பது இலக்கணப்படி ஆண்பால் ஒருமையில் உள்ளது; இங்கு அந்த நீதியை நிறைவேற்றுகிற எந்த மனிதரையும் அது பிரதிநிதித்துவப்படுத்துகிறது.
    reason: cultural_note
  - marker: c
    text: “அதனால் வாழ்வான்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் “அதில்” என்பது ஒருமை; பவுல் லேவியராகமம் 18:5-ஐ எதிரொலிக்கிறார்; அங்கு கட்டளைகள் பன்மையில் கூறப்படுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: γράφει
  choice: எழுதுகிறார்
  rationale: வேதவாக்கை மேற்கோள் காட்டும் நிகழ்காலச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: ரோமர் திருமுகத்தில் வரும் பவுலின் இறையியல் மற்றும் நீதித்துறை சார்ந்த பொருள் வளத்தைத் தக்கவைக்கும் வழக்கமான, இயல்பான தமிழ்ச் சொல்.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: திருச்சட்டத்திலிருந்து வரும்
  rationale: ἐκ குறிக்கும் மூலம் அல்லது தோற்றத்தை வெளிப்படுத்தி, சுற்றியுள்ள பகுதியில் ஒப்பிடப்படும் இருவகை நீதிகளின் வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: νόμου
  choice: திருச்சட்டம்
  rationale: இங்கு அறியப்பட்ட மோசேயின் சட்டத்தைக் குறிப்பதால், சாதாரண சட்டத்திலிருந்து வேறுபடுத்தும் தெளிவான தமிழாக்கம்.
- source_word: ὁ ποιήσας
  choice: செய்கிற
  rationale: ஒரு தனித்த கடந்தகாலச் செயலாக அல்லாமல், கட்டளைகளின்படி செய்கிறவரைப் பற்றிய பொதுக் கோட்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἄνθρωπος
  choice: மனிதன்
  rationale: கிரேக்கத்தின் ஒருமை வடிவையும் மனித நபரைக் குறிக்கும் பிரதிநிதித்துவப் பயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: ζήσεται
  choice: வாழ்வான்
  rationale: எதிர்கால வினையை நேரடியாகக் காட்டி, லேவியராகமம் 18:5-ன் எதிரொலியையும் தக்கவைக்கிறது.
- source_word: ἐν αὐτῇ
  choice: அவற்றால்
  rationale: கிரேக்கத்தில் ஒருமை வடிவம் இருந்தாலும், லேவியராகமம் 18:5-ல் உள்ள விதிமுறைகளையும் கட்டளைகளையும் செய்து அவற்றினால் வாழ்வது என்ற மேற்கோளின் பொருளை இயல்பான தமிழில் எடுத்துரைக்கிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பவுலின் முரண்பாட்டில் δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: சூழலில் திருச்சட்டத்திலிருந்து வரும் நீதியும் விசுவாசத்திலிருந்து வரும் நீதியும் ஒப்பிடப்படுகின்றன. “நீதி” இந்த இறையியல் தொடர்பைத் தக்கவைக்கிறது; நீதித்துறை சார்ந்த “நியாயம்” என்ற பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἄνθρωπος என்பதன் பிரதிநிதித்துவப் பொருள்
  choice: மனிதன்
  alternative: மனிதர் / ஒருவர்
  rationale: மூலத்தின் ஒருமை வடிவத்தைத் தக்கவைத்தபடியே, இது ஆண்களை மட்டும் அல்லாமல் இவற்றைச் செய்கிற எவரையும் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: ἐν αὐτῇ என்பதன் ஒருமை வடிவமும் லேவியராகம மேற்கோளின் பொருளும்
  choice: அவற்றால்
  alternative: அதில் / அதனால்
  rationale: பவுல் எதிரொலிக்கும் லேவியராகமம் 18:5-ன் கட்டளைகள் சார்ந்த பொருளை முதன்மை உரை இயல்பாக வெளிப்படுத்துகிறது; கிரேக்கத்தின் நேரடியான ஒருமை வடிவம் அடிக்குறிப்பில் விடப்படாமல் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதவாக்கு மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. “திருச்சட்டம்” மோசேயின் νόμος-ஐத் தெளிவாகக் குறிக்கிறது; மிகப் பழமையான “நியாயப்பிரமாணம்” தவிர்க்கப்பட்டுள்ளது.
