revisions:
- from: அப்படியானால், தாங்கள் நம்பாதவரிடம் அவர்கள் எப்படி வேண்டிக்கொள்வார்கள்? தாங்கள் கேட்டிராதவரை எப்படி நம்புவார்கள்?[a] ஒருவர் அறிவிக்காமல் அவர்கள் எப்படி கேட்பார்கள்?
  to: அப்படியானால், அவர்கள் நம்பாதவரை நோக்கி எப்படி வேண்டிக்கொள்வார்கள்? அவர்கள் கேட்டிராதவரை எப்படி நம்புவார்கள்?[a] ஒருவர் அறிவிக்காமல் அவர்கள் எப்படிக் கேட்பார்கள்?
  rationale: சுட்டுப்பெயர்களை மூலத்தின் மூன்றாம் நபர் பன்மைக்கு ஏற்ப ‘அவர்கள்’ எனத் திருத்தினேன். முதல் வினாவில் நம்பிக்கையின் பொருளும் வேண்டுதலின் இலக்கும் தெளிவாக இணையும் வகையில் ‘அவரை நோக்கி’ சேர்க்கப்பட்டது. கேட்டல் குறித்த கிரேக்கத்தின் சுருக்கமான அமைப்பு முதன்மை உரையில் காக்கப்பட்டு, ‘அவரைக் குறித்து’ என்ற இயல்பான சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
