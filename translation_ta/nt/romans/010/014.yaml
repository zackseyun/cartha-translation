id: ROM.10.14
reference: Romans 10:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: ta
  text: அப்படியானால், அவர்கள் நம்பாதவரை நோக்கி எப்படி வேண்டிக்கொள்வார்கள்? அவர்கள் கேட்டிராதவரை எப்படி நம்புவார்கள்?[a] ஒருவர் அறிவிக்காமல் அவர்கள் எப்படிக் கேட்பார்கள்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் யாரைக் குறித்துக் கேள்விப்பட்டதில்லையோ, அவரை எப்படி நம்புவார்கள்?”
    reason: οὗ என்ற உறவுப்பெயர் ἀκούω வினையுடன் வரும்போது, சூழலுக்கு ஏற்ப ‘அவரைக் குறித்து கேள்விப்படுதல்’ என்ற பொருளை வெளிப்படுத்தலாம்.
lexical_decisions:
- source_word: Πῶς οὖν
  choice: அப்படியானால், ... எப்படி
  rationale: οὖν என்பதன் முடிவைச் சுட்டும் பொருளையும், பவுலின் தொடர்ச்சியான வினாவடிவ வாதத்தையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἐπικαλέσωνται
  choice: வேண்டிக்கொள்வார்கள்
  rationale: இங்கு வினைச்சொல் ஒருவரை வெறுமனே பெயரிட்டு அழைப்பதை அல்ல, அவரை நோக்கி உதவி வேண்டி அழைப்பதைக் குறிக்கிறது; முந்தைய வசனத்தின் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: தாங்கள் நம்பாதவரிடம்
  rationale: εἰς உடன் வரும் நம்பிக்கையின் திசையையும், வேண்டுதல் செலுத்தப்படும் நபரையும் தமிழில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πιστεύσωσιν
  choice: நம்புவார்கள்
  rationale: πιστεύω என்பதற்கான நேரடியான, பொதுவாகப் புரியும் தமிழ்ச் சொல்; வசனத்திலுள்ள நம்புதல் சார்ந்த சொல் தொடுப்பைக் காக்கிறது.
- source_word: οὗ οὐκ ἤκουσαν
  choice: தாங்கள் கேட்டிராதவரை
  rationale: கிரேக்கத்தின் சுருக்கமான அமைப்பையும், அவரையே கேட்டார்களா அல்லது அவரைக் குறித்துக் கேட்டார்களா என்ற பொருள் நுட்பத்தையும் அளவுக்கு மீறி விளக்காமல் காக்கிறது.
- source_word: ἀκούσωσιν
  choice: கேட்பார்கள்
  rationale: முந்தைய வாக்கியத்திலுள்ள கேட்டல் என்ற கருத்துடன் நேரான சொல் தொடுப்பைக் காக்கிறது.
- source_word: χωρὶς κηρύσσοντος
  choice: ஒருவர் அறிவிக்காமல்
  rationale: κηρύσσοντος என்பது ஓர் அதிகாரப்பதவியைவிட அறிவிக்கும் செயலை முன்னிறுத்துகிறது; ஆகவே ‘பிரசங்கியார் இல்லாமல்’ என்பதற்குப் பதிலாகச் செயலைத் தெளிவாகச் சொல்கிறது.
theological_decisions:
- issue: πιστεύω சார்ந்த நம்பிக்கை மொழி
  choice: நம்பு
  alternative: நம்பிக்கை வை / விசுவாசி
  rationale: ‘நம்பு’ என்பது இயல்பான நவீனத் தமிழிலும் இறையியல் சார்பற்ற பொதுப் பயன்பாட்டிலும் பொருந்துகிறது; பவுலின் வினைச்சொல் தொடுப்பையும் நேரடியாகக் காக்கிறது.
- issue: οὗ οὐκ ἤκουσαν என்பதில் கேட்டதன் நபர் அல்லது பொருள்
  choice: தாங்கள் கேட்டிராதவரை
  alternative: தாங்கள் யாரைக் குறித்துக் கேள்விப்பட்டதில்லையோ, அவரை
  rationale: கிரேக்க மரபுத்தொடர் அந்த நபரிடமிருந்து கேட்டல் அல்லது அவரைக் குறித்துக் கேட்டல் என்ற நுண்ணிய இரு வாசிப்புகளுக்கும் இடமளிக்கலாம். முதன்மை உரை அதைச் சுருக்கமாக வைத்திருக்கிறது; செய்தி அவரைக் குறித்தது என்ற வெளிப்படையான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வினாவடிவ நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டிக்கொள்வார்கள்’ என்பது இறை உதவிக்காக அழைக்கும் பொருளைத் தருகிறது; ‘ஒருவர் அறிவிக்காமல்’ என்பது ஒரு சமயப் பதவியைச் சேர்க்காமல் அறிவிக்கும் செயலை முன்னிறுத்துகிறது.
