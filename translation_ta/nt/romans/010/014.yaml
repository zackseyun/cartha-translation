    rationale: இது ‘நம்பாதவர்’ என்பவரிடம் வேண்டுதல் செய்வதாகப் புரிய வாய்ப்புள்ளது. ‘அவர்கள் நம்பாதவரை நோக்கி’ என்பது நம்பிக்கையின் பொருளையும் வேண்டுதலின் இலக்கையும் தெளிவாக இணைக்கிறது.
  - severity: low
    issue: அடிக்குறிப்பின் காரணவிளக்கம் ‘அவரையே கேட்டல்’ என்பதை மிக வலுவாக முன்வைக்கிறது.
    rationale: οὗ உடனான ἀκούω அமைப்பு சூழலில் பொதுவாக அவரைக் குறித்துக் கேள்விப்படுதலைக் குறிக்கும்; மாற்று வாசிப்பைத் தரலாம், ஆனால் இரு பொருள்களும் சம அளவில் உறுதியானவை எனக் கூறக் கூடாது.
  revised_text: அப்படியானால், அவர்கள் நம்பாதவரை நோக்கி எப்படி வேண்டிக்கொள்வார்கள்? அவர்கள் கேட்டிராதவரை எப்படி நம்புவார்கள்?[a] ஒருவர் அறிவிக்காமல் அவர்கள் எப்படிக் கேட்பார்கள்?
