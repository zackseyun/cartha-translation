- from: 'ஏனெனில், வேதவாக்கியம் கூறுகிறது: “அவர்மேல் நம்பிக்கை வைக்கிற எவரும் வெட்கத்திற்கு உள்ளாக்கப்படமாட்டார்.”[a]'
  to: 'ஏனெனில், வேதவாக்கியம் கூறுகிறது: “அவர்மேல் நம்பிக்கை வைப்பவர் எவரும் அவமானப்படுத்தப்படமாட்டார்.”[a]'
  rationale: The revision replaces only an awkward Tamil passive expression with a natural equivalent that retains the Greek future passive and the Isaianic sense of public vindication. It also slightly regularizes the participial phrase as ‘நம்பிக்கை வைப்பவர் எவரும்’ without changing its generic scope or theological content.
