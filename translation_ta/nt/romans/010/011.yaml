id: ROM.10.11
reference: Romans 10:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: ta
  text: 'ஏனெனில், வேதவாக்கியம் கூறுகிறது: “அவர்மேல் நம்பிக்கை வைப்பவர் எவரும் அவமானப்படுத்தப்படமாட்டார்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்மேல் நம்பிக்கை வைப்பவர் எவரும் வெட்கமடையமாட்டார்.”
    reason: καταισχυνθήσεται என்பது எதிர்காலச் செயப்பாட்டு வடிவம்; ‘அவமானப்படுத்தப்படமாட்டார்’ அதன் செயப்பாட்டு, பொதுவான அவமான நுணுக்கத்தை வெளிப்படுத்துகிறது. மாற்று வாசகம் விளைவுநிலையை முன்னிறுத்துகிறது.
lexical_decisions:
- source_word: λέγει
  choice: கூறுகிறது
  rationale: வேதவாக்கிய மேற்கோளை அறிமுகப்படுத்தும் கிரேக்க நிகழ்காலத்தை இயல்பான தமிழ் நிகழ்காலமாகப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான ஆதாரத்தை அறிமுகப்படுத்தும் பவுலின் வாதத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ἡ γραφή
  choice: வேதவாக்கியம்
  rationale: இங்கு γραφή என்பது பொதுவான எழுத்தை அல்ல, அதிகாரமுள்ள புனித வேதப்பகுதியைக் குறிக்கிறது.
- source_word: Πᾶς ὁ πιστεύων
  choice: நம்பிக்கை வைக்கிற எவரும்
  rationale: ஆண்பாலுக்கு மட்டும் உரியதல்லாத பொதுவான, அனைவரையும் உள்ளடக்கும் கிரேக்கத் தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπ’ αὐτῷ
  choice: அவர்மேல்
  rationale: ἐπί + தத்திவின் நம்பிக்கை அல்லது சார்ந்திருத்தல் என்ற திசையைத் தக்கவைத்து, தமிழ் வேதாகம நடையில் இயல்பாக உள்ளது.
- source_word: καταισχυνθήσεται
  choice: வெட்கத்திற்கு உள்ளாக்கப்படமாட்டார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், இறுதியில் ஏமாற்றம் அல்லது பொது அவமானம் அடையாதிருத்தல் என்ற கருத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: Πᾶς ὁ πιστεύων என்பதிலுள்ள இலக்கண ஆண்பால்
  choice: நம்பிக்கை வைக்கிற எவரும்
  alternative: நம்புகிற ஒவ்வொரு மனிதனும்
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு ஆண்களை மட்டும் குறிக்காமல் பொதுப்படையான பிரதிநிதித் தன்மை கொண்டது.
- issue: αὐτῷ என்பதன் சுட்டுப்பொருள்
  choice: அவர்மேல்
  alternative: கிறிஸ்துவின்மேல்
  rationale: உடனடிச் சூழல் சுட்டுப்பொருளை விளக்கினாலும், மூலத்தின் பிரதிப்பெயரை விரிவாக்காமல் வைத்திருப்பது மேற்கோளின் வடிவத்தையும் அதன் அளவான தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. ‘அவர்மேல் நம்பிக்கை வைக்கிற’ என்பது நம்புதல் மட்டுமல்லாமல் அவரைச் சார்ந்திருக்கும் நுணுக்கத்தையும் வெளிப்படுத்துகிறது; ‘வெட்கத்திற்கு உள்ளாக்கப்படமாட்டார்’ என்பது கிரேக்கச் செயப்பாட்டு வடிவத்தைத் தெளிவாகக் காக்கிறது.
