id: ROM.10.20
reference: Romans 10:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: ta
  text: 'ஆனால் ஏசாயா மிகவும் துணிவாகச் சொல்கிறார்: “என்னைத் தேடாதவர்களால் நான் கண்டடையப்பட்டேன்[a]; என்னைக் குறித்து விசாரிக்காதவர்களுக்கு நான் வெளிப்பட்டேன்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைத் தேடாதவர்களிடையே நான் காணப்பட்டேன்.”
    reason: ἐν என்பதன் ‘இடையில்/மத்தியில்’ என்ற நேரடியான பொருளைக் காக்கும் மாற்று.
  - marker: b
    text: அல்லது, “என்னைக் குறித்து விசாரிக்காதவர்களுக்கு என்னை அறியச் செய்தேன்.”
    reason: ἐμφανὴς ἐγενόμην என்பதன் சூழல்சார், அதிக விளக்கமான மாற்று.
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: மிகவும் துணிவாகச் சொல்கிறார்
  rationale: இந்த வினைச்சொல் துணிந்து பேசுவதையும் அஞ்சாமையையும் குறிக்கிறது. நிகழ்காலத்தின் உயிரோட்டத்தையும் καὶ λέγει என்பதுடனான இயல்பான தமிழ்ச் சொற்றொடரையும் இத்தேர்வு காக்கிறது.
- source_word: Εὑρέθην
  choice: நான் கண்டடையப்பட்டேன்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் மேற்கோளில் கடவுள் தம்மைக் குறித்துப் பேசுவதையும் நேரடியாகக் காக்கிறது.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: என்னைத் தேடாதவர்களால்
  rationale: ἐν என்பதன் அடிப்படைப் பொருள் ‘இடையில்/மத்தியில்’ என்றாலும், இங்கு செயப்பாட்டு வினையுடன் சேர்ந்தபோது யாரால் அவர் கண்டடையப்பட்டார் என்பதைக் குறிக்கும் மரபுத்தொடராகப் புரிந்துகொள்ளலாம். முன்னிடைச்சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ζητοῦσιν
  choice: தேடாத
  rationale: ζητέω என்பதன் நேரடியான பொருளையும் வேதாகமச் சூழலில் உள்ள கருத்துச் செறிவையும் ‘தேடு’ இயல்பாகக் காக்கிறது.
- source_word: ἐμφανὴς ἐγενόμην
  choice: நான் வெளிப்பட்டேன்
  rationale: ‘வெளிப்படையானவராக/காணக்கூடியவராக ஆனேன்’ என்ற கிரேக்கக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது; கடவுள் தம்மை அறியச் செய்தார் என்று வெளிப்படையாக விளக்கிச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐπερωτῶσιν
  choice: என்னைக் குறித்து விசாரிக்காதவர்களுக்கு
  rationale: இங்கு வினைச்சொல் கேட்டல் அல்லது விசாரித்தலைக் குறிக்கிறது. ‘அழைத்தல்’ என்ற கூடுதல் இறையியல் பொருளை இறக்குமதி செய்யாமல், முந்தைய ‘தேடுதல்’ என்பதுடனான இணைநிலையை இது காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வாதத்துடனும் மேற்கோளுடனும் உள்ள எதிர்மறைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἠσαΐας
  choice: ஏசாயா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் கடவுளின் தம்மை வெளிப்படுத்துதல்
  choice: என்னைக் குறித்து விசாரிக்காதவர்களுக்கு நான் வெளிப்பட்டேன்
  alternative: என்னைக் குறித்து விசாரிக்காதவர்களுக்கு என்னை அறியச் செய்தேன்
  rationale: கிரேக்க வாசகம் வெளிப்படுதல்/காணப்படுதல் என்பதை முன்னிறுத்துகிறது; ‘என்னை அறியச் செய்தேன்’ என்பது பொருத்தமான விளக்கமாக இருந்தாலும், அது மூலத்தில் இல்லாத தன்வினைச் செயலை மேலும் வெளிப்படையாகக் கூறுகிறது. ஆகவே மூலத்தின் வடிவமும் இறையியல் இழுவிசையும் முதன்மை உரையில் காக்கப்பட்டு, விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மிகவும் துணிவாக’, ‘கண்டடையப்பட்டேன்’, ‘வெளிப்பட்டேன்’ ஆகியவை மூலத்தின் வலிமை, செயப்பாட்டு வடிவம், வெளிப்படுத்துதல் குறித்த உண்மையான தெளிவின்மை ஆகியவற்றைக் காக்கின்றன. அடிக்குறிப்பு குறிகள் அவை சார்ந்த சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
