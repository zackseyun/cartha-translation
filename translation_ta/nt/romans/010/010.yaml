source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: ta
  text: ஏனெனில், நீதிநிலைக்காக இதயத்தால் நம்பப்படுகிறது; இரட்சிப்புக்காக வாயால் அறிக்கை செய்யப்படுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீதிநிலை” என மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொல் “நீதி” அல்லது “நியாயம்” என்றும் மொழிபெயர்க்கப்படலாம்; பவுலின் எழுத்துகளில் “நீதிநிலை” அதன் பரந்த பொருளைச் சிறப்பாகக் காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίᾳ
  choice: இதயத்தால்
  rationale: கருவிப் பொருளைக் காட்டும் வேற்றுமையையும் உள்ளார்ந்த நம்பிக்கையையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திற்கான விளக்கத் தொடர்பைத் தெளிவாகப் பேணுகிறது.
- source_word: πιστεύεται
  choice: ஒருவர் ... நம்புவது
  rationale: பொதுவாக எல்லாருக்கும் பொருந்தும் கிரேக்கச் செயப்பாட்டு வடிவத்தின் பொருளை இயல்பான தமிழில் தருகிறது; செயற்கையான செயப்பாட்டு வாக்கியத்தைத் தவிர்க்கிறது.
- source_word: εἰς δικαιοσύνην
  choice: நீதிக்கு வழிவகுக்கிறது
  rationale: εἰς காட்டும் இலக்கு அல்லது விளைவு சார்ந்த உறவை வெளிப்படுத்துகிறது; அந்த உறவைத் துல்லியமான காரணவியல் வரிசையாகக் குறுக்கிவிடவில்லை.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: பவுலின் பயன்பாட்டிலுள்ள நீதிநிலை, நேர்மை, நியாயம் ஆகிய பொருள் பரப்பை முடிந்தவரை திறந்தவையாக வைத்திருக்கிறது.
- source_word: στόματι
  choice: வாயால்
  rationale: καρδίᾳ என்பதற்கு இணையான கருவிப் பொருளையும் உள்ளார்ந்த நம்பிக்கை–வெளிப்படையான அறிக்கை என்ற இணைப்பையும் பேணுகிறது.
- source_word: δὲ
  choice: ;
  rationale: தமிழில் எதிர்ப்பைக் காட்டாமல் இரு இணையான, ஒன்றுக்கொன்று நிறைவூட்டும் கூறுகளை அரைப்புள்ளி இயல்பாக இணைக்கிறது.
- source_word: ὁμολογεῖται
  choice: அறிக்கையிடுவது
  rationale: முந்தைய சூழலில் இயேசுவைக் கர்த்தர் என்று வெளிப்படையாக ஒப்புக்கூறுவதைக் குறிக்கிறது; பொதுவான கூற்றின் தன்மையையும் பேணுகிறது.
- source_word: εἰς σωτηρίαν
  choice: மீட்புக்கு வழிவகுக்கிறது
  rationale: εἰς என்பதன் இலக்கு அல்லது விளைவு நுட்பத்தை முதல் கூறுக்கு இணையாகக் காட்டுகிறது.
- source_word: σωτηρίαν
  choice: மீட்பு
  rationale: பவுலின் சூழலில் தற்போதையதும் இறுதிக்காலத்திற்குரியதுமான இரட்சிப்புப் பொருளை நவீன, புரிந்துகொள்ளத்தக்க தமிழில் தருகிறது.
theological_decisions:
- issue: நம்பிக்கை மற்றும் அறிக்கை நீதி மற்றும் மீட்புடன் கொண்டுள்ள உறவு
  choice: உள்ளார்ந்த நம்பிக்கை நீதிக்கு வழிவகுக்கிறது என்றும் வாய்மொழி அறிக்கை மீட்புக்கு வழிவகுக்கிறது என்றும் இணையான இரு கூறுகளாக மொழிபெயர்க்கப்பட்டது.
  alternative: அறிக்கை மீட்பின் சான்று மட்டுமே என்று கூறுதல், அல்லது மீட்பைச் சம்பாதிக்கும் கூடுதல் செயல் என்று கூறுதல்.
  rationale: கிரேக்கம் இரு இணையான εἰς தொடர்களைத் தருகிறது. அவை காட்டும் இறையியல் அழுத்தத்தைப் பேணி, நீதிமானாக்கப்படுதல் மற்றும் மீட்பின் துல்லியமான செயல்முறை வரிசையை மொழிபெயர்ப்பிலேயே தீர்மானிப்பது தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வசனத்தின் இணை அமைப்பும் இறையியல் செறிவும் நிலைக்குமாறும் மொழிநடை அமைக்கப்பட்டது. “இரட்சிப்பு” என்பதற்குப் பதிலாக இயல்பான “மீட்பு” பயன்படுத்தப்பட்டது.
