revisions:
- from: ஏனெனில், ஒருவர் இதயத்தால் நம்புவது நீதிக்கு[a] வழிவகுக்கிறது; வாயால் அறிக்கையிடுவது மீட்புக்கு வழிவகுக்கிறது.
  to: ஏனெனில், நீதிநிலைக்காக இதயத்தால் நம்பப்படுகிறது; இரட்சிப்புக்காக வாயால் அறிக்கை செய்யப்படுகிறது.[a]
  rationale: The revision retains the generalizing impersonal construction of πιστεύεται and ὁμολογεῖται, preserves the symmetrical εἰς phrases with “...க்காக,” and avoids turning either clause into a more explicit causal or doctrinal formulation. Key Pauline terms are rendered with established, broad Tamil equivalents, while the footnote preserves the lexical alternative for δικαιοσύνη.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:25:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the explanatory γάρ, the heart/mouth parallel, and the two parallel goal/result phrases. However, the repeated addition “வழிவகுக்கிறது” makes the concise εἰς constructions into explicit causal statements. A closer Tamil rendering can retain the source’s compact, paired formulation without deciding the precise theological mechanism.
  naturalness: “ஒருவர் இதயத்தால் நம்புவது … வாயால் அறிக்கையிடுவது” is understandable modern Tamil, but the finite “வழிவகுக்கிறது” clauses are more interpretive than necessary. The revised wording is clear, idiomatic enough for a formal Bible register, and retains the impersonal/generalizing force of the Greek.
  terminology: “நீதிநிலை” better represents δικαιοσύνη here than bare “நீதி,” which commonly suggests justice alone in modern Tamil. “இரட்சிப்பு” is the established Tamil biblical equivalent for σωτηρία and preserves its broad Pauline sense more reliably than “மீட்பு.” “அறிக்கை செய்யப்படுகிறது” suitably represents ὁμολογεῖται in the immediate context.
  issues:
  - severity: medium
    issue: “வழிவகுக்கிறது” is added in both clauses.
    rationale: Although εἰς can express goal or result, “leads to” explicitly formulates a causal process not stated by the compact Greek parallelism. “...க்காக” retains goal-oriented ambiguity more closely.
  - severity: medium
    issue: “நீதி” is too narrow/ambiguous for δικαιοσύνη in this Pauline context.
    rationale: In current Tamil, “நீதி” most readily denotes justice. “நீதிநிலை” better keeps the broader righteousness/rightness sense without imposing a detailed doctrinal definition.
  - severity: low
    issue: “மீட்பு” may underrepresent the established soteriological range of σωτηρία.
    rationale: “இரட்சிப்பு” is standard contemporary biblical Tamil and can encompass both deliverance and salvation in Paul’s usage.
  revised_text: ஏனெனில், நீதிநிலைக்காக இதயத்தால் நம்பப்படுகிறது; இரட்சிப்புக்காக வாயால் அறிக்கை செய்யப்படுகிறது.[a]
  revised_footnotes:
