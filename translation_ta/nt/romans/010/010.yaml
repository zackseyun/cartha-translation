    text: “நீதிநிலை” என மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொல் “நீதி” அல்லது “நியாயம்” என்றும் மொழிபெயர்க்கப்படலாம்; பவுலின் எழுத்துகளில் “நீதிநிலை” அதன் பரந்த பொருளைச் சிறப்பாகக் காக்கிறது.
    reason: lexical_alternative
  revision_rationale: The revision retains the generalizing impersonal construction of πιστεύεται and ὁμολογεῖται, preserves the symmetrical εἰς phrases with “...க்காக,” and avoids turning either clause into a more explicit causal or doctrinal formulation. Key Pauline terms are rendered with established, broad Tamil equivalents, while the footnote preserves the lexical alternative for δικαιοσύνη.
