  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: ta
  text: ஆனால் அது என்ன சொல்கிறது? “வார்த்தை உனக்கு அருகில் உள்ளது; உன் வாயிலும் உன் இதயத்திலும் உள்ளது.”[b] அதாவது, நாங்கள் அறிவிக்கிற விசுவாசத்தின் வார்த்தை[a] இதுவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசத்தின் செய்தி’ என்றும் மொழிபெயர்க்கலாம்; மேலும் πίστις என்பது சில சூழல்களில் ‘நம்பிக்கை’ அல்லது ‘உண்மைத்தன்மை’ என்றும் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு பவுல் உபாகமம் 30:14-ன் மொழியை எதிரொலித்து, அதைத் தாம் அறிவிக்கும் நற்செய்திக்குப் பயன்படுத்துகிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கருத்துக்கு மாறான திருப்பத்தை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: τί λέγει
  choice: அது என்ன சொல்கிறது?
  rationale: கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘வேதவாக்கியம்’ என்ற பெயரைச் சேர்க்காமல், சொல்லப்பட்டுள்ள மறைமுகச் சுட்டைத் தக்கவைக்கிறது.
- source_word: Ἐγγύς σου
  choice: உனக்கு அருகில்
  rationale: இடத்தையும் உருவக நெருக்கத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τὸ ῥῆμα
  choice: அந்த வார்த்தை
  rationale: மேற்கோளில் வரும் ῥῆμα என்பதையும் பின்னர் பவுல் விளக்கும் அதே சொல்லுடனான தொடர்பையும் தக்கவைக்கிறது; ‘செய்தி’ என்பது சாத்தியமான மாற்று.
- source_word: ἐν τῷ στόματί σου
  choice: உன் வாயில்
  rationale: மூலத்தின் உடல் சார்ந்த படிமத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: உன் இதயத்தில்
  rationale: καρδία என்பதன் வழக்கமான வேதாகமப் படிமத்தையும் உள்ளார்ந்த சிந்தனை மற்றும் பற்றுறுதியின் பரப்பையும் காக்கிறது.
- source_word: τοῦτ’ ἔστιν
  choice: அதாவது ... இதுவே
  rationale: மேற்கோளைப் பவுல் விளக்குவதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: விசுவாசத்தின் வார்த்தை
  rationale: முன்னர் வந்த ῥῆμα உடனான சொல் தொடர்பையும், τῆς πίστεως என்ற சுருக்கமான உறவின் பொருள் சார்ந்த தெளிவின்மையையும் தேவையின்றித் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: பவுலின் பயன்பாட்டில் நிலையான தமிழ்ச் சொல்லைத் தேர்ந்தெடுக்கிறது; ‘நம்பிக்கை’, சில சூழல்களில் ‘உண்மைத்தன்மை’ என்பன மாற்றுகளாகக் குறிப்பில் தரப்படுகின்றன.
- source_word: ὃ κηρύσσομεν
  choice: நாங்கள் அறிவிக்கிற
  rationale: κηρύσσω என்பதிலுள்ள பொதுவான, வெளிப்படையான பிரகடனத்தின் பொருளை எளிய நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τὸ ῥῆμα τῆς πίστεως என்பதில் πίστις சொல்லின் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இங்கு அறிவிக்கப்படும் வார்த்தைக்கும் விசுவாசத்திற்கும் உள்ள உறவை கிரேக்க உரை சுருக்கமாகவே வைக்கிறது. ‘விசுவாசம்’ என்பதை முதன்மை உரையில் வைத்திருப்பது பவுலின் வழக்கமான சொல்லாட்சியைப் பாதுகாக்கிறது; அது செய்தியின் உள்ளடக்கமா, தன்மையா, அல்லது அது அழைக்கும் பதிலா என்பதைத் தேவையின்றி ஒரே விதமாக நிர்ணயிக்கவில்லை.
- issue: உபாகமம் 30:14 மொழியின் பயன்பாடு
  choice: மேற்கோளின் சொற்களையும் வாயும் இதயமும் என்ற படிமங்களையும் தக்கவைத்தல்
  alternative: மேற்கோளை நற்செய்தி பற்றிய விளக்கவுரையாக விரிவாக்குதல்
  rationale: பவுல் உபாகம மொழியைத் தொடர்ந்து தாம் அறிவிக்கும் வார்த்தைக்குப் பயன்படுத்துகிறார்; முதன்மை உரையில் கூடுதல் விளக்கத்தைச் சேர்க்காமல் இந்த இறையியல் தொடர்பை அடிக்குறிப்பில் சுட்டுவது மூலத்தின் பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை பயன்படுத்தப்பட்டுள்ளது. ‘வார்த்தை’, ‘வாய்’, ‘இதயம்’ ஆகிய மூலப் படிமங்கள் காக்கப்பட்டுள்ளன; ‘விசுவாசத்தின் வார்த்தை’ என்ற சுருக்கமான அமைப்பு விளக்கத்தால் மிகையாகத் தீர்மானிக்கப்படவில்லை.
