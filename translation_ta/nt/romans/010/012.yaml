  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: ta
  text: ஏனெனில், யூதருக்கும் கிரேக்கருக்கும்[a] எந்த வேறுபாடும் இல்லை; ஏனெனில், அனைவருக்கும் ஒரே ஆண்டவரே[b]. தம்மை நோக்கிக் கூப்பிடுகிற அனைவருக்கும் அவர் தாராளமாக அளிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ‘கிரேக்கர்’ என்றே உள்ளது; இங்கு ‘யூதர்—கிரேக்கர்’ என்ற இணை, யூதர்—யூதரல்லாதவர் என்ற வேறுபாட்டைக் குறிக்கிறது. சில மொழிபெயர்ப்புகள் ‘பிற இனத்தவர்’ என வழங்குகின்றன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அனைவர்மேலும் ஒரே ஆண்டவர் இருக்கிறார்.’
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: வேறுபாடு
  rationale: இங்கு இச்சொல் இரு மக்கள் குழுக்களுக்கு இடையே செய்யப்படும் பிரிவையோ வேறுபாட்டையோ குறிக்கிறது. ‘வேறுபாடு’ என்பது இயல்பான நவீனத் தமிழ்; மதிப்பில் ஏற்றத்தாழ்வு என்ற கருத்தைத் தேவையின்றி சேர்க்காது.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: யூதருக்கும் கிரேக்கருக்கும்
  rationale: மூலத்தில் பொதுவான ‘பிற இனத்தவர்’ என்பதற்குப் பதிலாகக் குறிப்பாக ‘கிரேக்கர்’ என்றே உள்ளது. ரோமர் திருமுகத்தில் இந்த இணை யூதர்/யூதரல்லாதவர் என்ற எதிர்மறையைச் செயல்படுத்தினாலும், மூலச்சொல் பிரதான உரையில் தக்கவைக்கப்படுகிறது.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: எல்லாருக்கும் ஆண்டவர் ஒருவரே
  rationale: தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் கிரேக்கப் பெயர்ச்சொல் வாக்கியத்தை வெளிப்படுத்துகிறது. πάντων என்பதன் உறவுப் பொருளை ‘எல்லாருக்கும்’ காட்டுகிறது; ‘எல்லார்மேலும் ஒரே ஆண்டவர்’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: ரோமர் 10-இன் கிறிஸ்துவியல் சூழலுக்கும் வேதாகம வழக்குக்கும் ஏற்ற மரியாதைத் தலைப்பு. ‘எஜமான்’ என்பது இங்கு தலைப்பின் இறையியல் ஒலியைச் சுருக்கக்கூடும்.
- source_word: πλουτῶν εἰς πάντας
  choice: அனைவருக்கும் அவர் தமது செல்வத்தைப் பெருக வழங்குகிறார்
  rationale: ‘செல்வமுள்ளவராய்’ என்ற உருவகத்தை ‘தமது செல்வம்’ எனத் தக்கவைத்து, εἰς என்பதன் பயனாளரை நோக்கிய திசையையும் இயல்பான தமிழில் காட்டுகிறது. ‘பெருக வழங்குகிறார்’ என்பது வெறும் பொருளாதாரச் செல்வத்தைக் குறிப்பிடுவதாகத் தவறாகப் புரிந்துகொள்வதைத் தவிர்த்து, ஆண்டவரின் நிறைவான கொடையைக் காட்டுகிறது.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: தம்மை நோக்கிக் கூப்பிடுகிற அனைவருக்கும்
  rationale: ἐπικαλέω என்பது இங்கு விசுவாசத்துடன் ஆண்டவரை அழைப்பதைக் குறிக்கிறது. ‘நோக்கிக் கூப்பிடுகிற’ என்பது வெறும் பெயரிட்டு அழைத்தல் அல்ல, உதவிக்காக அவரை அழைத்தல் என்ற பொருளைத் தெளிவாக்கி அடுத்த வசனத்துடனான தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பவர் யார்?
  choice: சுற்றியுள்ள வசனங்களில் ஆண்டவராக அறிக்கையிடப்படும் இயேசுவையே சூழல் சுட்டுகிறது; அதேவேளை, ஆண்டவரை நோக்கிக் கூப்பிடுதல் என்ற வேதாகம ஒலியும் மொழிபெயர்ப்பில் தக்கவைக்கப்படுகிறது.
  alternative: கிறிஸ்துவைக் குறிப்பாகச் சுட்டாமல் பொதுவாகக் கடவுளைக் குறித்தல்.
  rationale: ரோமர் 10:9–13 இயேசுவை ஆண்டவர் என்று அறிக்கையிடுவதை மையமாகக் கொண்டு, பின்னர் ஆண்டவரை நோக்கிக் கூப்பிடுவது பற்றிய யோவேல் மேற்கோளை இணைக்கிறது. உரை ‘இயேசு’ என்று இங்கே சேர்க்காமல் ‘ஆண்டவர்’ என்ற தலைப்பையே வைத்திருப்பதால், பவுலின் கூற்று சூழலிலிருந்தே வெளிப்படுகிறது.
- issue: ‘அனைவருக்கும்’ என்பதன் வரம்பு
  choice: ‘அனைவரும்’ என்பது ‘தம்மை நோக்கிக் கூப்பிடுகிற’ என்ற தொடரால் வரையறுக்கப்படுகிறது.
  alternative: எந்த வரையறையும் இல்லாத உலகளாவிய இரட்சிப்புக் கூற்றாக வாசித்தல்.
  rationale: கிரேக்க இலக்கணம் பயனாளர்களை ஆண்டவரை நோக்கிக் கூப்பிடுகிற அனைவராகத் தெளிவாகக் குறிக்கிறது. மொழிபெயர்ப்பு யூதர்/கிரேக்கர் எல்லையைத் தாண்டிய அனைவருக்குமான அணுகலையும், பங்கேற்பாளரால் தரப்படும் வரையறையையும் இரண்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டது. ‘யூதர்—கிரேக்கர்’ என்ற மூல எதிரிணை பாதுகாக்கப்பட்டுள்ளது. தொடர் வாக்கியத்தைத் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், இரு γάρ காரணத் தொடர்புகளும் ‘ஏனெனில்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு அடையாளங்களும் பிரதான உரையில் இடம்பெற்றுள்ளன.
