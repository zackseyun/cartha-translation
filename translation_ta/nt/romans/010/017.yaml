  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: ta
  text: ஆகவே, விசுவாசம் கேட்பதிலிருந்து வருகிறது; கேட்பதோ மேசியாவின் வார்த்தையின் வழியாக வருகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியாவைப் பற்றிய வார்த்தையின் வழியாக” அல்லது “மேசியாவைக் குறித்த செய்தியின் வழியாக.” கிரேக்க மூலத்தில் உள்ள வேற்றுமைத் தொடர்பை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து பெறப்படும் முடிவைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இச்சூழலில் அறிவிக்கப்பட்ட நற்செய்தியைக் கேட்டதற்கு மனிதர் அளிக்கும் நம்பிக்கைமிக்க பதிலைக் குறிக்கிறது; ‘உண்மைத்தன்மை’ என்பது இங்கு முதன்மையான பொருள் அல்ல.
- source_word: ἐξ ἀκοῆς
  choice: கேட்பதிலிருந்து உண்டாகிறது
  rationale: ἐξ தோற்றுவாயைக் குறிக்கிறது. வினைச்சொல் இல்லாத கிரேக்க வாக்கியத்தின் பொருளை இயல்பான தமிழில் வெளிப்படுத்த ‘உண்டாகிறது’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀκοή
  choice: கேட்பது
  rationale: ἀκοή கேட்டல் என்ற செயலையோ கேட்கப்பட்ட செய்தியையோ குறிக்கலாம். உடனடிச் சூழலில் கேட்டல் என்ற செயல் முன்னிலையில் இருப்பதால் ‘கேட்பது’ தேர்ந்தெடுக்கப்பட்டது; இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது பவுலின் சொல் மீளுருவாக்கத்தைப் பேணுகிறது.
- source_word: δὲ
  choice: கேட்பதோ
  rationale: δέ இங்கு வலுவான எதிர்மறையை அல்ல, அடுத்த கூற்றுக்கான மென்மையான மாற்றத்தைத் தருகிறது; ‘-ஓ’ அமைப்பு அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διὰ
  choice: வழியாக
  rationale: Genitive-உடன் வரும் διά வழிமுறை அல்லது இடைமுகத்தைக் குறிக்கிறது.
- source_word: ῥήματος
  choice: வார்த்தை
  rationale: ῥῆμα குறிப்பாகச் சொல்லப்பட்ட சொல் அல்லது உரைத்த செய்தியைக் குறிக்கலாம். ‘வார்த்தை’ அதன் சொற்பொருளையும் இச்சூழலின் அறிவிப்பு சார்ந்த நயத்தையும் பேணுகிறது.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு பட்டமாகப் பயன்படுகிறது. Genitive வடிவத்தை நேரடியாகப் பேண ‘மேசியாவின்’ என்று முதன்மை உரையில் தரப்பட்டுள்ளது; ‘மேசியாவைப் பற்றிய’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: இங்கு πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: ரோமர் 10:14–16 சூழல் அறிவிக்கப்பட்ட செய்திக்கு மனிதர் அளிக்கும் பதிலைப் பற்றியது. ஆகவே ‘விசுவாசம்’ பொருத்தமானது; வேறு சிறப்புப் பொருளை உரைக்குள் திணிக்கவில்லை.
- issue: ῥήματος Χριστοῦ என்பதில் Χριστοῦ-வின் genitive தொடர்பு
  choice: மேசியாவின் வார்த்தை
  alternative: மேசியாவைப் பற்றிய வார்த்தை; மேசியாவைக் குறித்த செய்தி
  rationale: இக்கிரேக்க genitive-ஐ மேசியாவிடமிருந்து வரும் அல்லது அவருக்குரிய வார்த்தை என்றும், மேசியாவைப் பற்றிய செய்தி என்றும் புரிந்துகொள்ள முடியும். முதன்மை உரை வடிவரீதியான தொடர்பைப் பேணுகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் இணையான இரண்டு வினையற்ற கூறுகளையும் தமிழில் தெளிவாக்க ‘உண்டாகிறது’ இருமுறை பயன்படுத்தப்பட்டுள்ளது; ‘மேசியா’ பட்டமாகவே வைக்கப்பட்டுள்ளது.
