revisions:
- from: அவர்கள் அனுப்பப்படாவிட்டால், எப்படி அறிவிப்பார்கள்? எழுதப்பட்டிருப்பதுபோல, “நல்லவற்றைக் குறித்த நற்செய்தியைக் கொண்டுவருகிறவர்களின் பாதங்கள் எவ்வளவு அழகானவை![a]”
  to: அவர்கள் அனுப்பப்படாவிட்டால், எப்படி அறிவிப்பார்கள்? எழுதப்பட்டிருக்கிறபடி, “நல்லவற்றின் நற்செய்தியைக் கொண்டுவருகிறவர்களின் பாதங்கள் எவ்வளவு அழகானவை![a]”
  rationale: The revision replaces the awkward and less precise ‘நல்லவற்றைக் குறித்த’ with ‘நல்லவற்றின்,’ preserving the distinct Greek expression τὰ ἀγαθά as the content of the good news. ‘எழுதப்பட்டிருக்கிறபடி’ is a natural Tamil Scripture-citation formula. All other source-sensitive choices are retained.
