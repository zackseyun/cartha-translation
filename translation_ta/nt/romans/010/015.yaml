source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: ta
  text: அவர்கள் அனுப்பப்படாவிட்டால், எப்படி அறிவிப்பார்கள்? எழுதப்பட்டிருக்கிறபடி, “நல்லவற்றின் நற்செய்தியைக் கொண்டுவருகிறவர்களின் பாதங்கள் எவ்வளவு அழகானவை![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அழகானவை” என்பதற்கு “எவ்வளவு வரவேற்கத்தக்கவை” அல்லது “எவ்வளவு தக்க நேரத்தில் வந்தவை” என்றும் பொருள் கொள்ளலாம். கிரேக்கச் சொல் அழகோடு, செய்தியாளரின் பொருத்தமான, மகிழ்ச்சியளிக்கும் வருகையையும் உணர்த்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: அறிவிப்பார்கள்
  rationale: பொதுவெளியில் ஒரு செய்தியைப் பிரகடனப்படுத்துதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; இதை முறைப்படியான பிரசங்கத்திற்கு மட்டும் வரையறுக்கவில்லை.
- source_word: ἀποσταλῶσιν
  choice: அனுப்பப்படாவிட்டால்
  rationale: வேறொருவரால் அனுப்பப்படுதல் என்ற இறைவினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: καθὼς γέγραπται
  choice: எழுதப்பட்டிருப்பதுபோல
  rationale: வேதமேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடரை இயல்பாகவும் கண்ணியமாகவும் வழங்குகிறது.
- source_word: ὡραῖοι
  choice: அழகானவை
  rationale: மேற்கோளிலுள்ள தூதரின் வருகையைப் போற்றும் உருவகத்தைத் தெளிவாகக் காக்கிறது; வரவேற்கத்தக்க அல்லது தக்க நேரத்தில் நிகழும் வருகை என்ற சாத்தியமான நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πόδες
  choice: பாதங்கள்
  rationale: செய்தியாளர்களின் வருகையைக் குறிக்கும் மூல உருவகத்தை அப்படியே பாதுகாக்கிறது.
- source_word: εὐαγγελιζομένων
  choice: நற்செய்தியைக் கொண்டுவருகிறவர்களின்
  rationale: நற்செய்தியை அறிவித்தல் என்ற பொருளையும் பயணித்து வரும் செய்தியாளர் உருவகத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: τὰ ἀγαθά
  choice: நல்லவற்றைக் குறித்த
  rationale: ‘நல்லவை’ என்ற தனித்த கூறைப் பாதுகாத்து, அதை முந்தைய ‘நற்செய்தி’ என்பதோடு முழுமையாக ஒன்றாக்காமல் விடுகிறது.
theological_decisions:
- issue: செய்தியாளர்களைப் பற்றிய மேற்கோளுக்கும் நற்செய்தி அறிவிப்புக்கும் உள்ள தொடர்பு
  choice: அனுப்பப்படுதல் மற்றும் அறிவித்தல் ஆகிய தர்க்கத் தொடர்பையும், நற்செய்தி கொண்டுவரும் செய்தியாளர்களின் வருகையைப் போற்றும் ஏசாயா மேற்கோளின் விரிவான உருவகத்தையும் பாதுகாத்தல்
  alternative: ‘பிரசங்கிப்பார்கள்’, ‘சுவிசேஷத்தைப் பிரசங்கிக்கிறவர்கள்’ என்று மொழிபெயர்த்து, இதை முறைப்படியான திருச்சபைப் பணியோடு நெருக்கமாகக் கட்டுப்படுத்துதல்
  rationale: பவுலின் கருத்தோட்டம் அனுப்பப்படுதலையும் அறிவித்தலையும் இணைக்கிறது; ஆனால் மூலச்சொற்கள் குறிப்பிட்ட ஒரு திருச்சபைப் பதவியை கட்டாயப்படுத்துவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதமேற்கோள் நடையுடன் வடிவமைக்கப்பட்டது. ‘பாதங்கள்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘அறிவிப்பார்கள்’ என்பது செயலை முறைப்படியான பிரசங்கத்திற்கு மட்டும் குறுக்காமல் வைத்திருக்கிறது.
