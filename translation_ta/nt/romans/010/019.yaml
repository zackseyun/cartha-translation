id: ROM.10.19
reference: Romans 10:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: ta
  text: 'ஆனால் நான் கேட்கிறேன்: இஸ்ரவேல் அறியவில்லையா?[a] முதலில் மோசே கூறுகிறார்: “தேசம் அல்லாத ஒன்றைக் கொண்டு உங்களைப் பொறாமைப்பட வைப்பேன்; புரிதலற்ற ஒரு தேசத்தைக் கொண்டு உங்களுக்குக் கோபமூட்டுவேன்.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் புரிந்துகொள்ளவில்லையா?” கிரேக்க வினைச்சொல் ‘அறிதல்’ அல்லது ‘புரிந்துகொள்ளுதல்’ என்று பொருள்படலாம்; இங்கே கேட்ட செய்தியின் பொருளைப் பற்றிக்கொள்வது கருத்தாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: உபாகமம் 32:21-இலிருந்து மேற்கோள். “தேசம் அல்லாத ஒன்று” என்பது உண்மையான தேசமாகக் கருதப்படாத மக்களைக், அதாவது பிற இனத்தாரைக் குறிக்கக்கூடும்.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: இஸ்ரவேல் அறிந்துகொள்ளவில்லையா?
  rationale: γινώσκω என்பதன் ‘அறிதல்’ மற்றும் ‘புரிந்துகொள்ளுதல்’ ஆகிய பொருள் பரப்பை ‘அறிந்துகொள்ளுதல்’ இயல்பாகத் தக்கவைக்கிறது; கேள்வியின் சொல்லாட்சியையும் தீர்மானித்துவிடாமல் விடுகிறது.
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: முதலில் மோசே சொல்கிறார்
  rationale: மோசே முதற்கட்ட வேதச்சாட்சியாக மேற்கோள் காட்டப்படுவதை πρῶτος குறிக்கிறது; நிகழ்கால λέγει-ஐ இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: παραζηλώσω ὑμᾶς
  choice: உங்களுக்கு பொறாமையை உண்டாக்குவேன்
  rationale: வினைச்சொல்லின் காரணவினைப் பொருளான பொறாமைக்குத் தூண்டுதலைத் தெளிவாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐπ’ οὐκ ἔθνει
  choice: ஒரு தேசமல்லாததைக் கொண்டு
  rationale: οὐκ ἔθνος என்ற திட்டமிட்ட முரண்பாட்டையும், ἐπί உடைய கருவிப் பொருளையும் பாதுகாக்கிறது; குறிப்பிட்ட மக்களை முதன்மை உரையில் அடையாளப்படுத்தவில்லை.
- source_word: ἐπ’ ἔθνει ἀσυνέτῳ
  choice: புரிந்துகொள்ளாத ஒரு தேசத்தைக் கொண்டு
  rationale: ἀσύνετος என்பதிலுள்ள புரிதலின்மையை ‘மூட’ போன்ற அதிக மதிப்பீட்டுச் சொல்லாக மாற்றாமல் நேரடியாகத் தருகிறது.
- source_word: παροργιῶ ὑμᾶς
  choice: உங்களுக்குக் கோபமூட்டுவேன்
  rationale: கோபத்திற்கு ஆளாக்கும் காரணவினை நுட்பத்தையும் முந்தைய இணை அமைப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘தேசமல்லாதது’ மற்றும் ‘புரிந்துகொள்ளாத தேசம்’ என்பவற்றின் குறிப்பு
  choice: முதன்மை உரையில் மேற்கோளின் தெளிவின்மையை அப்படியே வைத்தல்
  alternative: இவை பிற இனத்தாரைக் குறிக்கின்றன என்று உரையிலேயே வெளிப்படையாகக் கூறுதல்
  rationale: பவுல் உபாகமம் 32:21-ஐ மேற்கோள் காட்டுகிறார்; குறிக்கப்படுகிறவர்களை மொழிபெயர்ப்பே தீர்மானிக்காமல், வேத மேற்கோளின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: ἔγνω என்பதன் பொருள்
  choice: அறிந்துகொள்ளவில்லையா?
  alternative: புரிந்துகொள்ளவில்லையா? / அறியவில்லையா?
  rationale: கேட்ட செய்தியின் பொருளைப் பற்றிக்கொள்ளுதல் என்ற சூழல்சார் நுட்பத்தையும் ‘அறிதல்’ என்ற அடிப்படைப் பொருளையும் ஒன்றாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மோசேயின் மேற்கோளில் உள்ள இணை அமைப்பும் ‘தேசம்/தேசமல்லாதது’ என்ற சொல்லாட்டமும் பாதுகாக்கப்பட்டுள்ளன; இரண்டாம் நபர் பன்மை தமிழ் வடிவங்களில் வெளிப்படுகிறது.
