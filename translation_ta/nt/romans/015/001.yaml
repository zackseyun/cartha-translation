source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: ta
  text: வலிமையுள்ளவர்களாகிய நாம், வலிமையற்றவர்களின் பலவீனங்களைத் தாங்கிக்கொள்ள வேண்டும்[a]; நம்மையே திருப்திப்படுத்திக்கொள்ளாமல் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வலிமையற்றவர்களின் குறைபாடுகளை.’ கிரேக்கச் சொல் பலவீனங்கள், வரம்புகள் அல்லது குறைபாடுகளைக் குறிக்கலாம்; இங்கே அது முந்தைய அதிகாரத்தில் பேசப்பட்ட மனச்சாட்சிசார் தயக்கங்கள் அல்லது வரம்புகளைச் சுட்டுவதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: வேண்டும்
  rationale: அறநெறிசார் கடமையையும் பவுலின் அறிவுறுத்தல் தொனியையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது முந்தைய விவாதத்திலிருந்து வரும் மென்மையான தொடர்ச்சியைக் குறிக்கிறது; தமிழில் இவ்வசனத்தின் இயல்பான ஓட்டமே அந்தத் தொடர்பை வெளிப்படுத்துவதால் தேவையற்ற ‘ஆனால்/இப்போது’ சேர்க்கப்படவில்லை.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: வலிமையுள்ளவர்களாகிய நாம்
  rationale: வலியுறுத்தப்பட்ட ‘நாம்’ என்பதையும், சூழலில் மனச்சாட்சிசார் உறுதியைக் குறிக்கும் ‘வலிமையுள்ளவர்கள்’ என்பதையும் தெளிவாகக் காக்கிறது.
- source_word: τὰ ἀσθενήματα
  choice: பலவீனங்களை
  rationale: குறைபாடுகள், வரம்புகள், மனச்சாட்சிசார் தயக்கங்கள் ஆகியவற்றை உள்ளடக்கக்கூடிய மூலச்சொல்லின் பரந்த பொருளைக் காக்கிறது; இதை நேரடியாகப் பாவங்களாகத் தீர்மானிப்பதில்லை.
- source_word: τῶν ἀδυνάτων
  choice: வலிமையற்றவர்களின்
  rationale: முந்தைய அதிகாரத்தில் உள்ள வலிமை–பலவீனம் என்ற எதிரிணையைப் பேணுகிறது; சமூக அல்லது உடல் வலிமை என்று மட்டும் குறுக்குவதில்லை.
- source_word: βαστάζειν
  choice: தாங்கிக்கொள்ள
  rationale: மற்றவரின் சுமையைச் சுமப்பது அல்லது ஆதரிப்பது என்ற உருவகத்தைப் பேணுகிறது; வெறுமனே சகித்துக்கொள்வது என்பதைக் காட்டிலும் செறிவானது.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: நமக்கே விருப்பமானதைச் செய்யக் கூடாது
  rationale: ‘நம்மையே திருப்திப்படுத்துதல்’ என்ற சொற்சொல் நடையைத் தவிர்த்து, பிறரின் நலனைப் பொருட்படுத்தாமல் சொந்த விருப்பத்தையே நாடாதிருத்தல் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘வலிமையுள்ளவர்கள்’ மற்றும் ‘வலிமையற்றவர்கள்’ என்போரின் அடையாளம்
  choice: ரோமர் 14-ன் சூழலில், மனச்சாட்சிசார் சுதந்திரம் அல்லது உறுதியில் வேறுபடும் விசுவாசிகளை முதன்மையாகக் குறிக்கிறது
  alternative: சமூக அதிகாரம் உடையோர்–அதிகாரமற்றோர் அல்லது உடல் வலிமையுள்ளோர்–பலவீனமுள்ளோர்
  rationale: உணவு மற்றும் நாட்கள் குறித்த முந்தைய விவாதமே உடனடிச் சூழல். ஆயினும் இந்த விளக்கத்தை வசனத்திற்குள் விரிவாக்கிச் சேர்க்காமல், மூலத்தின் வலிமை–பலவீனம் என்ற மொழி பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தாங்கிக்கொள்ள’ என்பது வெறும் பொறுத்துக்கொள்வதைவிட சுமையை ஏந்தி ஆதரிக்கும் பொருளைத் தருகிறது. ‘நமக்கே விருப்பமானதைச் செய்யக் கூடாது’ என்பது இயல்பான தமிழுக்காகத் தேர்ந்தெடுக்கப்பட்ட பொருள்சார் மொழிபெயர்ப்பு.
