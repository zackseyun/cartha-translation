  source_fidelity: 'வரைவு மூலத்தின் முக்கிய கூறுகளைச் சரியாகக் கொண்டுள்ளது: மேசியா, விருத்தசேதனம் செய்யப்பட்டவர்கள், கடவுளின் உண்மை/உண்மைத்தன்மை, முன்னோர்களுக்குக் கொடுக்கப்பட்ட வாக்குறுதிகளை உறுதிப்படுத்துதல். எனினும் கிரேக்கத்தில் ஒரே நோக்கத் தொடராக உள்ளதை இரண்டு வாக்கியங்களாகப் பிரித்து, இரண்டாவது வாக்கியத்தில் மூலத்தில் இல்லாத ‘அவர் அப்படி ஆனார்’ என்பதைச் சேர்த்துள்ளது. மேலும் γεγενῆσθαι-யின் நிறைவுநிலையை ‘ஆகியிருக்கிறார்’ தெளிவாக வெளிப்படுத்துகிறது.'
