revisions:
- from: ஏனெனில், விருத்தசேதனம் செய்யப்பட்டவர்களுக்கு மேசியா ஊழியராக ஆனார் என்று நான் சொல்கிறேன். கடவுளின் உண்மைக்காக[a]—முன்னோர்களுக்குக் கொடுக்கப்பட்ட வாக்குறுதிகளை உறுதிப்படுத்துவதற்காகவே அவர் அப்படி ஆனார்.
  to: ஏனெனில், கடவுளின் உண்மைக்காகவும்[a], முன்னோர்களுக்குக் கொடுக்கப்பட்ட வாக்குறுதிகளை உறுதிப்படுத்துவதற்காகவும், மேசியா விருத்தசேதனம் செய்யப்பட்டவர்களுக்கு ஊழியராகியிருக்கிறார் என்று நான் சொல்கிறேன்.
  rationale: மூலத்தின் ஒற்றை வாக்கிய அமைப்பும் இரண்டு நோக்க உறவுகளும் மீட்டமைக்கப்பட்டன. மூலத்தில் இல்லாத ‘அவர் அப்படி ஆனார்’ நீக்கப்பட்டது. ‘ஊழியராகியிருக்கிறார்’ perfect infinitive-ன் விளைவுநிலையை வெளிப்படுத்துகிறது. அடிக்குறிப்பு ἀλήθεια θεοῦ-வின் சாத்தியமான ‘உண்மைத்தன்மை’ நுணுக்கத்தை, பிரதான உரையில் அதை ஒரே பொருளாகக் கட்டுப்படுத்தாமல் காக்கிறது.
