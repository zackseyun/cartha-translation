id: ROM.15.8
reference: Romans 15:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: ta
  text: ஏனெனில், கடவுளின் உண்மைக்காகவும்[a], முன்னோர்களுக்குக் கொடுக்கப்பட்ட வாக்குறுதிகளை உறுதிப்படுத்துவதற்காகவும், மேசியா விருத்தசேதனம் செய்யப்பட்டவர்களுக்கு ஊழியராகியிருக்கிறார் என்று நான் சொல்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் உண்மைத்தன்மைக்காக”; தமது உடன்படிக்கை வாக்குறுதிகளை நிறைவேற்றுவதில் கடவுள் நம்பகமானவர் என்பதையும் இது வலியுறுத்தலாம்.
    reason: ἀλήθεια θεοῦ என்பது ‘கடவுளின் உண்மை’ என்றும், இச்சூழலில் குறிப்பாகக் கடவுளின் உண்மைத்தன்மை அல்லது நம்பகத்தன்மை என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: λέγω γὰρ
  choice: ஏனெனில் ... என்று நான் சொல்கிறேன்
  rationale: γάρ முந்தைய கருத்துக்கான விளக்கத் தொடர்பைக் காட்டுவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது; λέγω என்பதன் நேரடியான உரையாடல் வலிமையும் காக்கப்பட்டது.
- source_word: Χριστόν
  choice: மேசியா
  rationale: இஸ்ரவேல், விருத்தசேதனம், முன்னோர்களுக்கான வாக்குறுதிகள் ஆகிய மீட்பு-வரலாற்றுச் சூழலில் Χριστός பெயரைவிட பட்டமாகச் செயல்படுகிறது.
- source_word: διάκονον
  choice: ஊழியராக
  rationale: இங்கு சபைப் பதவியான ‘டீக்கன்’ அல்ல, பிறருக்காகச் சேவை செய்பவர் என்ற பொதுப் பொருளே உள்ளது. ‘ஊழியர்’ dignified and natural in Tamil biblical discourse.
- source_word: γεγενῆσθαι
  choice: ஆனார்
  rationale: γίνομαι என்பதன் perfect infinitive, ஏற்பட்டதன் தொடரும் விளைவை உணர்த்துகிறது. தமிழில் ‘ஆனார்’ இயல்பானது; அடுத்த வாக்கியத்தின் ‘அப்படி ஆனார்’ நோக்கத்தையும் விளைவையும் தெளிவாக இணைக்கிறது.
- source_word: περιτομῆς
  choice: விருத்தசேதனம் செய்யப்பட்டவர்களுக்கு
  rationale: இந்த genitive விருத்தசேதனம் செய்யப்பட்ட மக்களை, அதாவது இச்சூழலில் யூதர்களைக் குறிக்கிறது. உறவை இயல்பான தமிழில் இலக்கு/சேவை பெறுவோர் என்ற நான்காம் வேற்றுமையால் வெளிப்படுத்துகிறது; ‘யூதர்கள்’ என்று விளக்கமாக மாற்றாமல் மூல உருவகத்தை காக்கிறது.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: கடவுளின் உண்மைக்காக
  rationale: ὑπέρ நோக்கம் அல்லது நலன் சார்ந்த பொருளைத் தருகிறது. ἀλήθεια θεοῦ என்பது கடவுளின் உண்மை அல்லது உண்மைத்தன்மை/நம்பகத்தன்மை எனப் பொருள்படக்கூடியதால் முதன்மை உரை சுருக்கமான வடிவைக் காக்கிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: உறுதிப்படுத்துவதற்காக
  rationale: εἰς τὸ + infinitive நோக்கத்தைக் குறிக்கிறது; βεβαιόω வாக்குறுதிகளை நிலைநாட்டுதல் அல்லது உறுதிசெய்தல் என்ற பொருளில் வருகிறது.
- source_word: τὰς ἐπαγγελίας
  choice: வாக்குறுதிகளை
  rationale: பவுலின் உடன்படிக்கைச் சூழலில் ἐπαγγελία என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: τῶν πατέρων
  choice: முன்னோர்களுக்குக் கொடுக்கப்பட்ட
  rationale: Greek genitive with ‘promises’ semantically denotes promises made to the fathers. தமிழில் வெறும் ‘முன்னோர்களின் வாக்குறுதிகள்’ என்பது அவர்கள் கொடுத்த வாக்குறுதிகள் எனத் தவறாகப் புரியக்கூடும்; ‘முன்னோர்களுக்குக் கொடுக்கப்பட்ட’ மூல உறவைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: விருத்தசேதனம் மற்றும் முன்னோர்களுக்கான வாக்குறுதிகள் பேசப்படும் சூழலில் இது அபிஷேகம் பெற்றவர் என்ற பட்டத்தின் வலிமையைக் கொண்டுள்ளது.
- issue: ἀλήθεια θεοῦ என்பதன் நுணுக்கம்
  choice: கடவுளின் உண்மை
  alternative: கடவுளின் உண்மைத்தன்மை / நம்பகத்தன்மை
  rationale: சொற்றொடர் பரந்த ‘உண்மை’யையும், வாக்குறுதிகளைக் காக்கும் கடவுளின் உண்மைத்தன்மையையும் குறிக்கலாம். அடுத்த நோக்கவாக்கியம் உடன்படிக்கை நம்பகத்தன்மையை வலுப்படுத்தினாலும், அந்தப் பொருளை மட்டும் முதன்மை உரையில் நிர்ணயிக்காமல் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: διάκονον περιτομῆς என்பதன் உறவு
  choice: விருத்தசேதனம் செய்யப்பட்டவர்களுக்கு ... ஊழியராக
  alternative: விருத்தசேதனம் செய்யப்பட்டவர்களின் ஊழியராக
  rationale: Genitive தொடர்பு இலக்கண ரீதியாகச் சுருக்கமானது. தமிழில் நான்காம் வேற்றுமை மேசியாவின் சேவை அவர்களை நோக்கியது என்பதை இயல்பாக வெளிப்படுத்துகிறது; உடைமைப் பொருளைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. மிக நீண்ட ஒரே வாக்கியமாக அமைந்தால் இயல்பற்றதாக இருப்பதால், Greek infinitival content இரண்டு தொடர்புடைய தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘விருத்தசேதனம்’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல்; ‘முன்னோர்கள்’ என்பது சாதாரண வாசகருக்குப் புரியக்கூடியதோடு இஸ்ரவேலின் பிதாக்களையும் உள்ளடக்குகிறது.
