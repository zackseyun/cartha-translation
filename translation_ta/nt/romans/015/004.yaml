source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: ta
  text: முன்னதாக எழுதப்பட்டவை யாவும் நமக்குப் போதனைக்காக எழுதப்பட்டன; நிலைத்திருத்தலின் மூலமாகவும் வேதவசனங்கள் அளிக்கும் ஊக்கத்தின் மூலமாகவும் நாம் நம்பிக்கையைக் கொண்டிருக்கும்படியாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσα
  choice: எழுதப்பட்டவை அனைத்தும்
  rationale: நடுநிலைப் பன்மை உறவுப்பெயரின் விரிவான பொருளை இயல்பான தமிழில் முழுமையாகக் காட்டுகிறது.
- source_word: προεγράφη
  choice: முன்னமே எழுதப்பட்டவை
  rationale: προ- என்பதன் காலப் பொருளைக் காத்து, முன்பு எழுதப்பட்ட வேதவசனங்களைக் குறிக்கிறது.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: நமக்குப் போதிப்பதற்காக
  rationale: εἰς என்பதன் நோக்கப் பொருளையும் διδασκαλία என்பதன் கற்பித்தல்/அறிவுறுத்தல் பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐγράφη
  choice: எழுதப்பட்டன
  rationale: மூலத்தின் எழுதுதல் என்ற வினையை மீண்டும் பயன்படுத்தி அதன் சொல்லாட்சிசார் வலியுறுத்தலைக் காக்கிறது.
- source_word: ἵνα
  choice: இதனால்
  rationale: முந்திய எழுதுதலின் நோக்கத்தையும் எதிர்பார்க்கப்படும் விளைவையும் தமிழில் சீராக இணைக்கிறது.
- source_word: διὰ τῆς ὑπομονῆς
  choice: பொறுமையுடன் நிலைத்திருப்பதன் மூலமாகவும்
  rationale: ὑπομονή என்பது இடரின்கீழ் பொறுமையுடன் தொடர்ந்து நிலைத்திருத்தலைக் குறிக்கிறது; வெறும் காத்திருப்பை விட இதன் செயற்பொருளைத் தெளிவாக்குகிறது.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: வேதவசனங்கள் தரும் மனவுறுதியின் மூலமாகவும்
  rationale: παράκλησις என்பதன் ஊக்கம்/ஆறுதல்/அறிவுரை என்ற பொருள் பரப்பில், நம்பிக்கையைத் தாங்கும் வலுப்படுத்தும் செயல்பாட்டை ‘மனவுறுதி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν γραφῶν
  choice: வேதவசனங்கள்
  rationale: பவுலின் சூழலில் புனித எழுத்துக்களைக் குறிக்கும் γραφαί என்பதற்கான பொதுவாகப் புரியும் நவீனத் தமிழ் சொல்.
- source_word: τὴν ἐλπίδα ἔχωμεν
  choice: நாம் நம்பிக்கை கொண்டிருக்கலாம்
  rationale: ἵνα உடன் வரும் நிகழ்காலத் துணைவினையின் நோக்க/விளைவு நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: நம்பிக்கையை உருவாக்குவதில் வேதவசனங்களின் பங்கு
  choice: வேதவசனங்கள் மனவுறுதியைத் தருகின்றன; பொறுமையுடன் நிலைத்திருத்தலும் அதனுடன் சேர்ந்து நம்பிக்கைக்கான வழியாக அமைகிறது.
  alternative: ‘பொறுமையும் மனவுறுதியும் வேதவசனங்களால் இரண்டுமே வழங்கப்படுகின்றன’ அல்லது ‘அவை வேதவசனங்களில் எடுத்துக்காட்டப்படுகின்றன’ என்று தொடர்பை விரிவாகப் புரிந்துகொள்ளலாம்.
  rationale: கிரேக்கச் சொல் வரிசையில் ‘வேதவசனங்களின்’ என்ற மரபுத்தொடர் நேரடியாக ‘மனவுறுதி’ என்பதோடு இணைகிறது. மொழிபெயர்ப்பு அதைத் தெளிவாக வைத்தாலும், பொறுமையின் மூலத்தைத் தனியே கோட்பாட்டுரீதியாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மனவுறுதி’ என்பது ஊக்கம் மற்றும் ஆறுதல் ஆகிய நுணுக்கங்களை ஓரளவு தாங்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது. மூலத்திலுள்ள இரட்டை διά அமைப்பை ‘மூலமாகவும் ... மூலமாகவும்’ எனத் தக்கவைத்துள்ளது.
