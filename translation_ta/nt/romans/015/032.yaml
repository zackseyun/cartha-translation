  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: ta
  text: கடவுளுடைய விருப்பத்தினால் நான் மகிழ்ச்சியோடு உங்களிடம் வந்து, உங்களோடு சேர்ந்து புத்துணர்வு பெறும்படியாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களோடு பரஸ்பரம் புத்துணர்வு பெற” அல்லது “உங்களோடு சேர்ந்து இளைப்பாற.” கிரேக்க வினைச்சொல் ஒன்றாகப் பெறும் புத்துணர்வு அல்லது ஓய்வைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: அதனால்
  rationale: முந்தைய வேண்டுகோளின் நோக்கத்தையும் எதிர்பார்க்கப்படும் விளைவையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: ἐν χαρᾷ
  choice: மகிழ்ச்சியோடு
  rationale: வருகையோடு இணைந்த மனநிலையையோ சூழலையோ இயல்பாக வெளிப்படுத்துகிறது; ‘மகிழ்ச்சி’ என்ற பெயர்ச்சொல்லின் கருத்தையும் காக்கிறது.
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: நான் ... உங்களிடம் வந்து
  rationale: முதன்மை வினையுடன் சார்ந்து நிற்கும் இறந்தகாலப் பெயரெச்சத்தைத் தமிழின் இயல்பான தொடர்வினை அமைப்பில் தருகிறது.
- source_word: διὰ θελήματος θεοῦ
  choice: கடவுளுடைய விருப்பத்தின்படி
  rationale: வருகை கடவுளின் விருப்பத்திற்கு ஏற்ப நிகழ வேண்டும் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: συναναπαύσωμαι
  choice: உங்களோடு சேர்ந்து புத்துணர்வு பெறுவேனாக
  rationale: συν- முன்னொட்டு காட்டும் பகிர்ந்த அனுபவத்தையும், ஓய்வு அல்லது புத்துணர்வு பெறுதல் என்ற வினையின் பொருளையும் காக்கிறது.
theological_decisions:
- issue: பவுலும் ரோம விசுவாசிகளும் பகிர்ந்துகொள்ளும் புத்துணர்வு
  choice: உங்களோடு சேர்ந்து புத்துணர்வு பெறுவேனாக
  alternative: உங்களுடன் இளைப்பாறுவேனாக
  rationale: பவுல் அவர்களுக்கு மட்டும் ஊழியம் செய்வார் என்ற ஒருதலைப்பட்ச எண்ணத்தைத் தவிர்த்து, அவர்களுடன் சேர்ந்து அவர் பெற எதிர்பார்க்கும் ஓய்வு அல்லது புத்துணர்வை வெளிப்படுத்துகிறது; அதேவேளை பரஸ்பரத்தன்மையை மூலச்சொல் கூறுவதைக் காட்டிலும் அதிகமாக வலியுறுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. நோக்கத்தைக் காட்டும் ἵνα-வை முந்தைய வசனத்துடன் தொடர்புபடுத்த ‘அதனால்’ எனவும், subjunctive எதிர்பார்ப்பு அல்லது வேண்டுதலின் மென்மையை ‘பெறுவேனாக’ எனவும் வழங்கப்பட்டுள்ளது.
