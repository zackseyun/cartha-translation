- from: ஏனெனில், அதைச் செய்ய அவர்கள் மனமுவந்தார்கள்; அவர்களுக்கு இவர்கள் கடன்பட்டவர்களும்கூட. ஏனெனில், யூதரல்லாத மக்கள்[a] அவர்களுடைய ஆன்மீக நன்மைகளில்[b] பங்குபெற்றிருந்தால், இவர்களும் அவர்களுக்குப் பொருள்சார்ந்த உதவிகளைச் செய்து பணியாற்றக் கடமைப்பட்டிருக்கிறார்கள்[c].
