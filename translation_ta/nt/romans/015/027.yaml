id: ROM.15.27
reference: Romans 15:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: ta
  text: ஏனெனில், யூதரல்லாத மக்கள் அதைச் செய்ய மனமுவந்தார்கள்; அவர்கள் அவர்களுக்குக் கடன்பட்டவர்களும் ஆவர். ஏனெனில், யூதரல்லாத மக்கள் அவர்களுடைய ஆன்மீகமானவற்றில் பங்குபெற்றிருந்தால், அவர்களுக்குப் பொருள்சார்ந்தவற்றில் சேவை செய்யவும் கடமைப்பட்டிருக்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐδόκησαν
  choice: மனமுவந்தார்கள்
  rationale: விருப்பத்துடனான ஒப்புதலையும் மகிழ்ச்சியான முனைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; முந்தைய வசனத்தில் கூறப்பட்ட நன்கொடையை ‘அதை’ என்பது சுட்டுகிறது.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: அவர்களுக்கு இவர்கள் கடன்பட்டவர்களும்கூட
  rationale: பணக்கடன் மட்டுமல்லாமல் பவுல் வலியுறுத்தும் அறநெறிசார் கடமையையும் ‘கடன்பட்டவர்கள்’ காக்கிறது.
- source_word: τὰ ἔθνη
  choice: யூதரல்லாத மக்கள்
  rationale: இங்கு யூதர்களுடன் வேறுபடுத்தப்படும் பிற இன மக்களைக் குறிக்கும் பவுலின் பயன்பாட்டை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: அவர்களுடைய ஆன்மீக நன்மைகளில்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட πνευματικοῖς என்பதன் ‘ஆன்மீகமானவை’ என்ற பொருளை இயல்பாக்குகிறது; ‘நன்மைகள்’ என்பது சூழலில் பெற்ற ஆன்மீகப் பயன்களைக் குறிக்கிறது, ஆனால் மூலத்தின் சொல்லாக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐκοινώνησαν
  choice: பங்குபெற்றிருந்தால்
  rationale: κοινωνέω குறிக்கும் பங்குபெறுதல் அல்லது பகிர்ந்துகொள்ளுதலை நிபந்தனை வாக்கியத்தில் இயல்பாக வழங்குகிறது.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: பொருள்சார்ந்த உதவிகளைச் செய்து
  rationale: உடல் மற்றும் பொருள் தேவைகளைச் சார்ந்தவற்றை இங்கு குறிக்கிறது; பாவத்தன்மையை அல்ல. எருசலேம் விசுவாசிகளுக்கான நன்கொடை என்ற உடனடிச் சூழலுக்கு ஏற்றது.
- source_word: λειτουργῆσαι
  choice: பணியாற்ற
  rationale: சாதாரண உதவியை விடப் பொறுப்பும் மதிப்பும் கொண்ட சேவையை உணர்த்துகிறது; மதகுருக்களுக்கு மட்டும் உரிய பணியாகக் கட்டுப்படுத்தவில்லை.
theological_decisions:
- issue: σαρκικοῖς என்பதன் பொருள் πνευματικοῖς என்பதற்கு எதிராக
  choice: பொருள்சார்ந்த உதவிகள்
  alternative: மாம்சத்துக்குரியவை
  rationale: எருசலேமிலுள்ள பரிசுத்தவான்களுக்கான பண உதவி பற்றிய உடனடிச் சூழலில் இது உடல் அல்லது பொருள் தேவைகளுக்கான ஆதரவைக் குறிக்கிறது; பாவமுள்ள ‘மாம்சம்’ என்ற நெறிசார் பொருளை அல்ல.
- issue: αὐτῶν / αὐτοῖς ஆகிய பிரதிப்பெயர்களின் சுட்டுப்பொருள்
  choice: எருசலேமிலுள்ள யூத விசுவாசிகள்
  alternative: இஸ்ரவேல் மக்கள் பொதுவாக
  rationale: ரோமர் 15:25–26 இன் உடனடிச் சூழல் எருசலேமிலுள்ள பரிசுத்தவான்களுக்கான நன்கொடையைப் பற்றியது. இருப்பினும், பவுலின் காரணவாதம் யூதர்களிடமிருந்து வந்த இரட்சிப்புசார் ஆன்மீக நன்மைகளின் விரிவான பின்னணியையும் கொண்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யூதரல்லாத மக்கள்’ தெளிவுக்காகத் தேர்ந்தெடுக்கப்பட்டது. ‘ஆன்மீக நன்மைகள்’ மற்றும் ‘பொருள்சார்ந்த உதவிகள்’ இயல்பான எதிரிணையாக உள்ளன; மூலத்தின் நேரடி சொல்லாக்கம் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
