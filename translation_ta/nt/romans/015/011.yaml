source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: ta
  text: 'மீண்டும்: “எல்லா நாடுகளே[b], ஆண்டவரைப்[a] புகழுங்கள்; எல்லா மக்களும் அவரைப் போற்றட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேவைப் புகழுங்கள்” என்றும் மொழிபெயர்க்கலாம். மேற்கோளின் எபிரெய மூலத்தில் இறைப்பெயர் உள்ளது; கிரேக்கத்தில் அதற்கு κύριος (“ஆண்டவர்”) பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது “பிற இனத்தாரே.” கிரேக்க ἔθνη என்பது “நாடுகள்” அல்லது “பிற இனத்தார்” எனப் பொருள்படலாம். இங்கு மேற்கோள் உலகளாவிய அழைப்பாக உள்ளது; அதேவேளையில், பிற இனத்தாரைப் பற்றிய பவுலின் வாதத்துக்கும் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: மேலும் இவ்வாறு சொல்லப்பட்டுள்ளது
  rationale: பவுல் மேற்கோள்களின் தொடரில் இன்னொரு வேதவசனத்தை அறிமுகப்படுத்துகிறார். தமிழில் மேற்கோள் தொடங்குவதை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: Αἰνεῖτε
  choice: புகழுங்கள்
  rationale: இரண்டாம் நபர் பன்மை கட்டளையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: πάντα τὰ ἔθνη
  choice: நாடுகளே, நீங்கள் அனைவரும்
  rationale: ἔθνη என்பதன் விரிந்த, உலகளாவிய பொருளைத் தக்கவைத்து, விளிவேற்றுமையையும் ‘அனைத்தும்’ என்ற முழுமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν κύριον
  choice: ஆண்டவரை
  rationale: κύριος என்பதற்கான இயல்பான தமிழ் இணை; கிரேக்க உரையிலுள்ள சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ἐπαινεσάτωσαν
  choice: போற்றட்டும்
  rationale: மூன்றாம் நபர் பன்மை கட்டளை உணர்வை ‘-ட்டும்’ வடிவில் தக்கவைக்கிறது; முன்வரும் புகழ்ச்சிச் சொல்லுடன் உள்ள பொருள் இணைப்பையும் சற்றே வேறுபட்ட சொல்வடிவத்தையும் காட்டுகிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆண்டவரையே சுட்டுகிறது; தமிழில் மரியாதைக்குரிய ஒருமைச் சுட்டுப்பெயர் இயல்பானது.
- source_word: πάντες οἱ λαοί
  choice: மக்களினத்தார் அனைவரும்
  rationale: λαοί என்பதை ἔθνη என்பதிலிருந்து வேறுபடுத்தி, பல்வேறு மக்கள் குழுக்களைக் குறிக்கும் இணைப்பாட்டைத் தக்கவைக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் தேவனைக் குறிக்கும் பழைய ஏற்பாட்டு மேற்கோளில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா
  rationale: புதிய ஏற்பாட்டின் கிரேக்க உரையில் κύριος உள்ளது; ஆகவே முதன்மை உரையில் ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது. மேற்கோளின் எபிரெய மூலத்தில் இறைப்பெயர் இருப்பதால் ‘யெகோவா’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பவுலின் யூதர்–பிற இனத்தார் சூழலில் ἔθνη என்பதன் பொருள்
  choice: நாடுகள்
  alternative: பிற இனத்தார்
  rationale: மேற்கோளில் உலக மக்கள் அனைவரையும் அழைக்கும் விரிந்த பொருளை ‘நாடுகள்’ வெளிப்படுத்துகிறது. ரோமர் 15-ன் வாதத்தில் யூதரல்லாத பிற இனத்தாரையும் இது குறிக்கக்கூடும் என்பதால் அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு மேற்கோளுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நாடுகள்’ மற்றும் ‘மக்களினத்தார்’ மூலம் ἔθνη–λαοί வேறுபாடு பாதுகாக்கப்பட்டுள்ளது; ‘புகழுங்கள்/போற்றட்டும்’ மூலம் இணைப்பாட்டின் இயல்பும் கட்டளை வலிமையும் தக்கவைக்கப்பட்டுள்ளன.
