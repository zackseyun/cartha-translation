revisions:
- from: 'மேலும் இவ்வாறு சொல்லப்பட்டுள்ளது: “நாடுகளே[b], நீங்கள் அனைவரும் ஆண்டவரைப்[a] புகழுங்கள்; மக்களினத்தார் அனைவரும் அவரைப் போற்றட்டும்.”'
