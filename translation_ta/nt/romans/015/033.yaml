  text: May the God of peace be with all of you. Amen.
translation:
  language: ta
  text: சமாதானத்தின் கடவுள் உங்கள் அனைவரோடும் இருப்பாராக. ஆமென்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான எதிர்மறைப் பொருளைக் காட்டாமல், முடிவுரையான ஆசீர்வாதத்திற்கான மென்மையான தொடர்பை மட்டும் தருகிறது. தமிழில் தேவையற்ற ‘இப்போது’ அல்லது ‘ஆனால்’ என்பதைக் கூட்டாமல் இருப்பது இயல்பானது.
- source_word: θεὸς τῆς εἰρήνης
  choice: சமாதானத்தின் கடவுள்
  rationale: கிரேக்கச் சொற்றொடரின் உறவுநிலை அமைப்பையும் பவுல் பயன்படுத்தும் சிறப்புப் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἰρήνης
  choice: சமாதானம்
  rationale: இச்சொல் அமைதி, முழுநலம், ஒப்புரவு ஆகிய பரந்த நுண்பொருள்களைத் தாங்கினாலும், இந்த ஆசீர்வாதச் சூழலில் ‘சமாதானம்’ இயல்பானதும் போதுமானதுமான மொழிபெயர்ப்பு.
- source_word: μετὰ πάντων ὑμῶν
  choice: உங்கள் அனைவரோடும் இருப்பாராக
  rationale: கிரேக்கத்தில் வெளிப்படையான வினைச்சொல் இல்லை. இது ஆசீர்வாத வேண்டுதலாகச் செயல்படுவதால், தமிழில் ‘இருப்பாராக’ சேர்க்கப்பட்டுள்ளது; ‘அனைவரோடும்’ என்பது πάντων என்பதன் உள்ளடக்கும் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: வழிபாட்டு முடிவுரையாக நிலைபெற்றுள்ள வடிவம் என்பதால் மொழிபெயர்த்துப் பொருள் கூறாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: வினைச்சொல் இல்லாத கிரேக்க வாக்கியத்தை நிகழ்நிலை அறிக்கையாகவா, ஆசீர்வாத வேண்டுதலாகவா வழங்குவது
  choice: ‘இருப்பாராக’ என்று ஆசீர்வாத வேண்டுதலாக வழங்கப்பட்டது.
  alternative: ‘சமாதானத்தின் கடவுள் உங்கள் அனைவரோடும் இருக்கிறார்’ என்ற நிகழ்நிலை அறிக்கை.
  rationale: நிருப முடிவுகளில் இத்தகைய வினையற்ற அமைப்பு இயல்பாக ஒரு வேண்டுதல் அல்லது ஆசீர்வாதமாகச் செயல்படுகிறது. அதைக் தமிழில் தெளிவாக வெளிப்படுத்த ‘இருப்பாராக’ பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைந்த சுருக்கமான ஆசீர்வாத வாக்கியம். ‘தேவன்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது; கிரேக்கத்தின் உறவுநிலைச் சிறப்புப் பெயர் விளக்கவுரையாக மாற்றப்படவில்லை.
