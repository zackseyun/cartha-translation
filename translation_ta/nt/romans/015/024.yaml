source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: ta
  text: ஏனெனில், நான் ஸ்பானியாவுக்குப் போகும்போது[a], அங்குச் செல்லும் வழியில் உங்களைச் சந்தித்துவிட்டு, முதலில் உங்களோடு ஓரளவு மனநிறைவு அடைந்த பின்பு[c], நீங்கள் என்னை அங்கே பயணம் தொடர வழியனுப்புவீர்கள் என்று நம்புகிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நான் ஸ்பானியாவுக்குப் போகும் எந்த வேளையிலோ’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க அமைப்பு உறுதியாகக் குறிக்கப்படாத ஓர் எதிர்கால நேரத்தை உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அங்கே செல்லும் என் பயணத்தில் நீங்கள் எனக்கு உதவவும்’ என்றும் மொழிபெயர்க்கலாம். இங்கே வரும் வினைச்சொல், அடுத்த பயணக்கட்டத்திற்குத் தேவையான உதவி செய்வதையோ உடன்சென்று அனுப்புவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘உங்களால் ஓரளவு நிரப்பப்பட்ட பின்பு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொற்சொல்லாக ‘ஓரளவு நிரப்பப்படுதல்’ என்று உள்ளது; தொடர்ந்து பயணிப்பதற்கு முன் அவர்களுடன் வரம்புள்ள அளவில் உறவாடி நிறைவு பெறுதலை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι εἰς τὴν Σπανίαν
  choice: நான் ஸ்பானியாவுக்குப் போகும்போது
  rationale: ὡς ἄν உடன் வரும் subjunctive உறுதியாகக் குறிக்கப்படாத எதிர்கால நேரத்தை உணர்த்துகிறது. தமிழில் ‘போகும்போது’ இயல்பாகவும், அந்த எதிர்காலத் திறந்தநிலையைத் தேவையின்றி மிகைப்படுத்தாமலும் காட்டுகிறது.
- source_word: ἐλπίζω γὰρ
  choice: என்று நம்புகிறேன்
  rationale: ἐλπίζω விருப்பம் கலந்த எதிர்பார்ப்பைக் குறிக்கிறது. γάρ தரும் விளக்கத் தொடர்பு, தமிழ்ச் சொற்றொடரின் அமைப்புக்குள் இயல்பாக உட்பொதிக்கப்பட்டுள்ளது.
- source_word: διαπορευόμενος θεάσασθαι ὑμᾶς
  choice: வழியில் உங்களைச் சந்திக்கவும்
  rationale: διαπορευόμενος வேறொரு இலக்கை நோக்கிப் பயணிக்கையில் இடைவழியாகச் செல்வதைக் குறிக்கிறது; θεάσασθαι இச்சூழலில் வெறுமனே பார்ப்பதைவிட நேரில் சந்திப்பதை உணர்த்துகிறது.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: அங்கே செல்ல நீங்கள் என்னை வழியனுப்பவும்
  rationale: προπέμπω அடுத்த பயணக்கட்டத்திற்காக அனுப்புதல், துணைசெய்தல் அல்லது உடன்செல்லுதல் ஆகியவற்றை உள்ளடக்கலாம். ‘வழியனுப்ப’ அதன் பொது பொருளைக் காக்கிறது; உதவியின் வகையை நிர்ணயிக்கவில்லை.
- source_word: ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ
  choice: முதலில் உங்களோடு இருந்து ஓரளவு மனநிறைவு பெற்ற பின்பு
  rationale: ἐμπλησθῶ என்பதிலுள்ள நிறைவடைதல் என்ற உருவகத்தை ‘மனநிறைவு’ இயல்பான தமிழில் வெளிப்படுத்துகிறது. ἀπὸ μέρους என்பதன் வரம்பை ‘ஓரளவு’ காக்கிறது; ὑμῶν என்பதன் உறவுசார் கருத்தை ‘உங்களோடு இருந்து’ தெளிவாக்குகிறது.
theological_decisions:
- issue: ரோம விசுவாசிகள் பவுலின் அடுத்த பயணத்திற்கு அளிக்கவிருந்த உதவியின் தன்மை
  choice: நீங்கள் என்னை வழியனுப்பவும்
  alternative: நீங்கள் என் பயணத்திற்கு உதவவும் / நீங்கள் என்னுடன் சிறிது தூரம் வரவும்
  rationale: மூல வினைச்சொல் நடைமுறை உதவி, தேவையான ஏற்பாடு அல்லது உடன்செல்லுதல் ஆகியவற்றில் ஒன்றையோ பலவற்றையோ குறிக்கலாம். பண உதவி அல்லது அதிகாரபூர்வ மிஷன் ஆதரவு என்று உரை சொல்லாததை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: பவுல் ரோமர்களுடன் இருப்பதால் பெற விரும்பிய நிறைவு
  choice: உங்களோடு இருந்து ஓரளவு மனநிறைவு பெற்ற பின்பு
  alternative: உங்களால் ஓரளவு நிரப்பப்பட்ட பின்பு / சிறிது காலம் உங்கள் உறவை அனுபவித்த பின்பு
  rationale: இந்தச் சொற்றொடர் உறவினால் வரும் நிறைவு, மகிழ்ச்சி அல்லது புத்துணர்ச்சி ஆகிய நிழற்பொருள்களைத் தரலாம். வாசிக்க இயல்பாக இருக்கும்போதே ‘ஓரளவு’ என்ற வரம்பையும் உறவுசார் கருத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் இயல்பான ஓட்டமும் காக்கப்பட்டுள்ளன. கிரேக்கத்தில் நீளமாகத் தொடரும் வாக்கியம் தமிழில் தெளிவான வரிசைக்கு மாற்றப்பட்டுள்ளது. வசன முடிவின் தொடர்ச்சிச் சாயல் அடுத்த வசனத்துடன் இணையும் சூழலில் வெளிப்படும்; தனிவசனமாக வாசிக்க இயல்பாக முற்றுப்புள்ளி இடப்பட்டுள்ளது.
