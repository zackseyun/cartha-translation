revisions:
- from: நான் ஸ்பானியாவுக்குப் போகும்போது[a], வழியில் உங்களைச் சந்திக்கவும், முதலில் உங்களோடு இருந்து ஓரளவு மனநிறைவு பெற்ற பின்பு, அங்கே செல்ல நீங்கள் என்னை வழியனுப்பவும்[b] செய்வீர்கள் என்று நம்புகிறேன்.
  to: ஏனெனில், நான் ஸ்பானியாவுக்குப் போகும்போது[a], அங்குச் செல்லும் வழியில் உங்களைச் சந்தித்துவிட்டு, முதலில் உங்களோடு ஓரளவு மனநிறைவு அடைந்த பின்பு[c], நீங்கள் என்னை அங்கே பயணம் தொடர வழியனுப்புவீர்கள் என்று நம்புகிறேன்[b].
  rationale: 'The revision retains the draft’s meaning while resolving the main Tamil syntactic ambiguity: Paul hopes to meet the Romans on his way to Spain, to receive some limited satisfaction from fellowship with them first, and then to be sent onward by them. ‘அங்கே பயணம் தொடர’ makes the destination-oriented force of ἐκεῖ clear without specifying what kind of support προπεμφθῆναι entails. The added footnote preserves the source’s fullness metaphor and its interpretive openness.'
