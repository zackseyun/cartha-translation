  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: ta
  text: ஏனெனில், பிற இனத்தார்[a] கீழ்ப்படியும்படி, சொல்லாலும் செயலாலும் மெசியா என் வழியாக நிறைவேற்றியவற்றைத் தவிர வேறு எதையும் குறித்துப் பேச நான் துணியமாட்டேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இனங்கள்” அல்லது “நாடுகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மெசியா என் வழியாக நிறைவேற்றியவற்றை மட்டுமே பேச நான் துணியமாட்டேன்.”
    reason: alternative_reading
lexical_decisions:
- source_word: τολμήσω
  choice: நான் துணியமாட்டேன்
  rationale: எதிர்கால வினையையும், எதையாவது செய்யத் ‘துணிதல்’ அல்லது ‘முனைதல்’ என்ற கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τι λαλεῖν … ὧν οὐ
  choice: நிறைவேற்றியவற்றைத் தவிர வேறு எதையும் குறித்துப் பேச
  rationale: கிரேக்கத் தொடரின் கட்டுப்படுத்தும் பொருளைத் தமிழில் தெளிவாகக் காட்ட ‘தவிர வேறு எதையும்’ பயன்படுத்தப்பட்டுள்ளது; இதனால் மெசியா செய்தவற்றைப் பற்றி மட்டுமே பவுல் பேசுவார் என்ற கருத்து நிலைக்கிறது.
- source_word: κατειργάσατο
  choice: நிறைவேற்றிய
  rationale: ஒரு விளைவைச் செயல்படுத்துதல் அல்லது சாதித்தல் என்ற வினையின் பொருளை இது இயல்பாகத் தருகிறது.
- source_word: Χριστὸς
  choice: மெசியா
  rationale: இங்கு இயேசுவின் அபிஷேகம் பெற்ற அரசர்/மீட்பர் என்ற பட்டப்பொருளை வெளிப்படுத்துகிறது; வெறும் பெயர்போல மாற்றப்படவில்லை.
- source_word: δι’ ἐμοῦ
  choice: என் வழியாக
  rationale: முதன்மையாகச் செயல்படுபவர் மெசியா என்றும், பவுல் அவர் பயன்படுத்தும் கருவி என்றும் காட்டும் διά + genitive அமைப்பைத் தக்கவைக்கிறது.
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: பிற இனத்தார் கீழ்ப்படியும்படி
  rationale: இலக்கு அல்லது விளைவைக் குறிக்கும் εἰς என்பதையும், ரோமர் நூலில் யூதரல்லாத மக்களைக் குறிக்கும் ἔθνη என்பதன் சூழல்சார் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: λόγῳ καὶ ἔργῳ
  choice: சொல்லாலும் செயலாலும்
  rationale: அறிவிப்பும் நடைமுறைச் செயலும் ஆகிய இரு வழிகளைக் குறிக்கும் கருவிப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இந்த இடத்தில் சொல் பட்டமாகச் செயல்படுவதாக வாசிக்க முடிவதால் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது; பெயர்போன்ற வழக்கை முன்னிறுத்தினால் ‘கிறிஸ்து’ என்பதும் சாத்தியம்.
- issue: ἐθνῶν என்பதன் சூழல்சார் பொருள்
  choice: பிற இனத்தார்
  alternative: நாடுகள் / இனங்கள்
  rationale: ரோமர் நூலின் யூதர்–யூதரல்லாதவர் விவாதத்தில், இச்சொல் யூதரல்லாத மக்களைச் சுட்டுகிறது. எனினும் அதன் அடிப்படைப் பொருளான ‘இனங்கள்/நாடுகள்’ அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: கீழ்ப்படிதலின் இலக்கு அல்லது விளைவு
  choice: கீழ்ப்படியும்படி
  alternative: பிற இனத்தாரின் கீழ்ப்படிதலுக்காக
  rationale: εἰς ὑπακοὴν என்ற சொற்றொடர் இலக்கையும் அதன் விளைவையும் குறிக்கலாம். தமிழ் முதன்மை உரை இயல்பாக இலக்கைத் தெரிவிக்கிறது; கீழ்ப்படிதலின் துல்லிய தன்மை மேலும் வரையறுக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘என் வழியாக’ என்பது மெசியாவை முதன்மைச் செயற்பாட்டாளராகவும் பவுலைக் கருவியாகவும் காட்டுகிறது. வாக்கியத்தின் கிரேக்கச் சொல்வரிசையை அப்படியே பின்பற்றாமல், அதன் கட்டுப்படுத்தும் தர்க்கத்தைத் தெளிவாகக் காட்ட இயல்பான தமிழ் வரிசை பயன்படுத்தப்பட்டுள்ளது.
