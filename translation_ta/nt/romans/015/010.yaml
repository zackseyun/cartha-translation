  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: ta
  text: 'மீண்டும் அவர் கூறுகிறார்: “பிற இனத்தவர்களே, அவருடைய மக்களுடன் சேர்ந்து மகிழுங்கள்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இனங்களே, அவருடைய மக்களுடன் சேர்ந்து மகிழுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: மேலும்
  rationale: இங்கு மற்றொரு வேதமேற்கோளை அறிமுகப்படுத்துவதால், தமிழில் இயல்பாகத் தொடர்ச்சியைக் காட்டும் ‘மேலும்’ பொருத்தமானது; ‘மறுபடியும்’ என்பதும் சாத்தியம்.
- source_word: λέγει
  choice: அவர் கூறுகிறார்
  rationale: வேதவாக்கு இப்போதும் பேசுவதாகக் காட்டும் கிரேக்க நிகழ்காலத்தைத் தக்கவைக்கிறது. எழுவாய் வெளிப்படையாகக் கூறப்படாதபோதிலும், மேற்கோளின் சூழலில் ‘அவர்’ இயல்பான மொழிபெயர்ப்பு.
- source_word: Εὐφράνθητε
  choice: மகிழுங்கள்
  rationale: கட்டளை வலிமையையும் உயர்வான, அதேவேளை இன்றைய வாசகருக்குப் புரியும் நடையையும் வழங்குகிறது.
- source_word: ἔθνη
  choice: பிற இனத்தவர்களே
  rationale: ரோமர் 15-இல் யூதரல்லாதோர் கடவுளுடைய மக்களுடன் இணைந்து துதிப்பது மையமாக இருப்பதால், வெறும் அரசியல் ‘நாடுகள்’ என்பதைவிட மனிதக் குழுக்களைக் குறிக்கும் ‘பிற இனத்தவர்கள்’ தெளிவானது. ‘இனங்களே’ என்ற பரந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: அவருடைய மக்களுடன் சேர்ந்து
  rationale: μετά என்பதன் உடனிணைவு பொருளை ‘உடன் சேர்ந்து’ இயல்பாக வெளிப்படுத்துகிறது; λαός என்பதைக் ‘மக்கள்’ என வைத்திருப்பதால் ‘இஸ்ரவேல்’ என்று விளக்கமாகச் சேர்ப்பது தவிர்க்கப்படுகிறது.
theological_decisions:
- issue: யூதர்–பிற இனத்தவர் ஒற்றுமையைப் பற்றிய பவுலின் மேற்கோளில் ἔθνη என்பதன் மொழிபெயர்ப்பு
  choice: பிற இனத்தவர்களே
  alternative: இனங்களே
  rationale: உடனடிச் சூழல் யூதரல்லாதோர் கடவுளுடைய மக்களுடன் சேர்ந்து மகிழ்வதை வலியுறுத்துகிறது. ஆகவே ‘பிற இனத்தவர்கள்’ பவுலின் கருத்தைத் தெளிவாக்குகிறது; அதே நேரத்தில், பழைய ஏற்பாட்டு மேற்கோளில் உள்ள பரந்த ‘இனங்கள்’ என்ற பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: λαός என்பதன் உடன்படிக்கைச் சூழல்
  choice: மக்கள்
  alternative: இஸ்ரவேல் மக்கள்
  rationale: சூழலில் குறிப்பு இஸ்ரவேலை நோக்கியதாக இருக்கலாம்; எனினும் கிரேக்க உரை நேரடியாக ‘மக்கள்’ என்றே கூறுவதால், விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அதன் திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான மேற்கோள் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிற இனத்தவர்கள்’ என்பது ‘புறஜாதியார்’ போன்ற சமயவழக்குச் சொல்லைவிட பொதுவாசகருக்கு உடனடியாகப் புரியும்; ‘மக்கள்’ என்பதன் உடன்படிக்கைத் தொடர்பு விளக்கமாக விரிவாக்கப்படவில்லை.
