  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: ta
  text: ஆகவே, இந்தப் பணியை முடித்து, இந்தக் கனியை அவர்களிடம் முத்திரையிட்டுக் கொடுத்தபின்[a][b], உங்கள் வழியாக[c] ஸ்பானியாவுக்குப் போவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: ‘இந்தக் கனியை அவர்களிடம் பாதுகாப்பாக ஒப்படைத்தபின்.’ ‘முத்திரையிடுதல்’ என்பது காணிக்கையை அதன் பெறுநர்களிடம் முறையாக உறுதிப்படுத்தி ஒப்படைப்பதைக் குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: ‘இந்தக் கனி’ என்பது எருசலேமிலுள்ள பரிசுத்தவான்களுக்காகப் புறவின விசுவாசிகள் திரட்டிய பண உதவியைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘உங்கள் ஊடாக.’ பவுல் ஸ்பானியாவுக்குச் செல்லும் வழியில் உரோமை வழியாகப் பயணம் செய்யத் திட்டமிட்டிருந்தார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: இந்தப் பணியை
  rationale: முந்தைய வசனங்களில் பேசப்பட்ட பங்களிப்பை எருசலேமுக்குக் கொண்டு சேர்க்கும் பொறுப்பைக் குறிக்கிறது; தமிழில் வெறும் ‘இதை’ என்பதைக் காட்டிலும் குறிப்பு தெளிவாகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையிலிருந்து வரும் முடிவையும் தொடர்ச்சியையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἐπιτελέσας
  choice: முடித்து
  rationale: முதன்மை எதிர்கால வினைக்கு முன் நிறைவேறும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: σφραγισάμενος
  choice: முத்திரையிட்டுக் கொடுத்தபின்
  rationale: σφραγίζω என்பதன் முத்திரை உருவகத்தைத் தக்கவைத்து, பெறுநர்களிடம் உறுதியாக ஒப்படைக்கும் சூழல்சார் பொருளையும் தமிழ் தொடரில் உணர்த்துகிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்காக
  rationale: எருசலேமிலுள்ள பரிசுத்தவான்களாகிய பெறுநர்களைக் குறிக்கும் தத்துவை இயல்பான தமிழில் வழங்குகிறது; ‘அவர்களிடம்’ என்பதும் சாத்தியம்.
- source_word: τὸν καρπὸν τοῦτον
  choice: இந்தக் கனியை
  rationale: புறவின விசுவாசிகளின் கொடையின் கண்கூடான பலனைக் குறிக்கும் பவுலின் ‘கனி’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἀπελεύσομαι
  choice: போவேன்
  rationale: அடுத்த இலக்கை நோக்கிய எதிர்காலப் பயணத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: δι’ ὑμῶν
  choice: உங்கள் வழியாக
  rationale: διά + genitive என்பதன் ‘வழியாக/மூலம்’ என்ற இடவழிப் பொருளைத் தக்கவைத்து, உரோமை வழியாகப் பயணிப்பதைச் சுட்டுகிறது.
- source_word: εἰς Σπανίαν
  choice: ஸ்பானியாவுக்கு
  rationale: இலக்கைச் சுட்டும் εἰς என்பதற்கான இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: ‘இந்தக் கனியை அவர்களுக்காக முத்திரையிடுதல்’ என்ற உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் ‘முத்திரையிட்டுக் கொடுத்தபின்’ என்ற உருவக மொழியைத் தக்கவைத்தல்
  alternative: ‘இந்தக் காணிக்கையை அவர்களிடம் பாதுகாப்பாக ஒப்படைத்தபின்’
  rationale: இது காணிக்கையைப் பெறுநர்களிடம் உறுதிப்படுத்தி ஒப்படைப்பதைக் குறிக்கலாம்; ஆனால் விளக்கமான மாற்றீட்டை மட்டும் பயன்படுத்தினால் σφραγίζω என்ற மூல உருவகம் மறைந்துவிடும். ஆகவே உருவகமும் சூழல்சார் செயலும் ஒன்றாகத் தெரிவிக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘கனி’ மற்றும் ‘முத்திரை’ என்ற பவுலின் உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; அடிக்குறிப்புகள் சூழல்சார் பொருளை விளக்குகின்றன.
