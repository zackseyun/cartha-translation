  terminology: ‘கனி’ appropriately preserves καρπός as Paul’s metaphor, and ‘முத்திரையிட்டுக் கொடுத்தபின்’ retains σφραγίζω without imposing a specific interpretation. ‘ஸ்பானியா’ and ‘உரோமை’ are standard Tamil biblical forms.
