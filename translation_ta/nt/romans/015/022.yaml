lexical_decisions:
- source_word: Διὸ
  choice: இதனால்தான்
  rationale: முந்தைய வசனங்களில் பவுல் கூறிய பணிமுறையிலிருந்து வரும் காரணவிளைவை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ
  choice: —
  rationale: கிரேக்கத்தில் இது இணைப்புப் பொருள் கொண்டிருந்தாலும், தமிழில் ‘இதனால்தான்’ என்பதுடன் ‘மேலும்/கூட’ சேர்ப்பது செயற்கையாக இருக்கும்; தொடர்பு வாக்கிய அமைப்பிலேயே இயல்பாக வெளிப்படுகிறது.
- source_word: ἐνεκοπτόμην
  choice: தடைசெய்யப்பட்டேன்
  rationale: இறந்தகாலத்தில் மீண்டும் மீண்டும் நேர்ந்த தடையை வெளிப்படுத்துகிறது; தடையை ஏற்படுத்தியவர் அல்லது காரணி யார் என்பதை மூலத்தைப் போலவே குறிப்பிடாமல் விடுகிறது.
- source_word: τὰ πολλὰ
  choice: பலமுறை
  rationale: இது வினையடையாகப் பயன்படும் மரபுத்தொடர்; இச்சூழலில் ‘பெரும்பாலும்’ என்பதைக் காட்டிலும் ‘பல சந்தர்ப்பங்களில்/திரும்பத் திரும்ப’ என்ற பொருளே பொருத்தமானது.
- source_word: τοῦ ἐλθεῖν
  choice: வருவதற்கு
  rationale: தடைப்பட்ட செயலைக் குறிக்கும் தொடர்; தமிழில் ‘வருவதற்கு ... தடைசெய்யப்பட்டேன்’ என்பது நேரடியும் இயல்புமான அமைப்பு.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம்
  rationale: ரோமிலுள்ள விசுவாசிகளை நோக்கிய வருகையை இயல்பான தமிழில் குறிக்கிறது; ‘வருதல்’ என்பதே இயக்கத்தை வெளிப்படுத்துகிறது.
