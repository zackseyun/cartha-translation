  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: ta
  text: நம்மில் ஒவ்வொருவரும் தம் அடுத்தவரை அவரது நன்மைக்காக[a], அவரைக் கட்டியெழுப்புவதற்காக[b] பிரியப்படுத்தட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நன்மையை நோக்கி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர் வெறும் விருப்பத்தை நிறைவேற்றுவதை அல்ல, பயனளிக்கும் நன்மையை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வளர்ச்சிக்காக’ என்றும் மொழிபெயர்க்கலாம். ‘கட்டியெழுப்புதல்’ என்பது ஒருவரை வலுப்படுத்துவதை உருவகமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: நம்மில் ஒவ்வொருவரும்
  rationale: பகுதிப் பொருளுடைய ἡμῶν என்பதையும், ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் ἕκαστος என்பதையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: τῷ πλησίον
  choice: தமக்கு அடுத்தவரின் / அவருக்கு
  rationale: πλησίον என்பது வெறும் வீட்டருகே வசிப்பவரை மட்டுமல்ல, ஒருவரோடு தொடர்புடைய சக மனிதரையும் குறிக்கிறது. ஒருமை அமைப்பைத் தமிழில் இயல்பாகத் தொடர ‘தமக்கு அடுத்தவர்’ என்றும் பின்னர் ‘அவர்’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: ἀρεσκέτω
  choice: உகந்தவாறு நடக்கட்டும்
  rationale: மூன்றாம் நபர் கட்டளை வடிவத்தின் அறிவுறுத்தல் வலிமையை ‘நடக்கட்டும்’ காக்கிறது. ‘மகிழ்விக்கட்டும்’ என்பது வெறும் மனநிறைவு அளிப்பதாகத் தவறாகப் புரியக்கூடும்; ‘உகந்தவாறு நட’ என்பது பின்வரும் நன்மை மற்றும் கட்டியெழுப்புதல் ஆகிய வரம்புகளோடு பொருந்துகிறது.
- source_word: εἰς τὸ ἀγαθὸν
  choice: நன்மைக்காக
  rationale: செயலின் இலக்கு அல்லது பயனைச் சுட்டுகிறது. சூழலால் அந்த நன்மை அடுத்தவருக்குரியது என்பதால் ‘அடுத்தவரின் நன்மைக்காக’ எனத் தெளிவாக்கப்பட்டுள்ளது.
- source_word: πρὸς οἰκοδομήν
  choice: அவரைக் கட்டியெழுப்பும்படி
  rationale: οἰκοδομή என்பதன் கட்டிடம் எழுப்பும் உருவகத்தைத் தக்கவைத்து, இங்கு ஒருவரை வலுப்படுத்தி வளரச் செய்வதைக் குறிக்கும் வகையில் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: அடுத்தவருக்கு உகந்தவாறு நடப்பதன் நெறிசார் வரம்பு
  choice: அடுத்தவரின் நன்மையையும் அவரைக் கட்டியெழுப்புவதையும் நோக்கமாகக் கொண்ட நடத்தை
  alternative: எந்த வரம்புமின்றி பிறரைத் திருப்திப்படுத்துதல் அல்லது அவர்களின் ஒப்புதலை நாடுதல்
  rationale: εἰς τὸ ἀγαθὸν, πρὸς οἰκοδομήν என்ற இரு நோக்கத் தொடர்களும் ἀρεσκέτω என்பதற்கான வரம்பை உரையிலேயே அமைக்கின்றன. ஆகவே கட்டளை வெறும் மனிதரைத் திருப்திப்படுத்துவதாக மொழிபெயர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரியப்படுத்துதல்’ போன்ற பழைய அல்லது எளிதில் தவறாகப் புரியக்கூடிய சொல்லுக்கு மாற்றாக ‘உகந்தவாறு நடக்கட்டும்’ தேர்ந்தெடுக்கப்பட்டது; கட்டியெழுப்புதல் என்ற மூல உருவகம் தக்கவைக்கப்பட்டுள்ளது.
