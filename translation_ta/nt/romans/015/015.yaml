  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: ta
  text: ஆனால், உங்களுக்கு மீண்டும் நினைவூட்டும் விதமாக, சில விஷயங்களில் மேலும் துணிவுடன்[a] நான் எழுதியிருக்கிறேன்; கடவுள் எனக்கு அளித்த அருளின் காரணமாகவே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓரளவு மேலும் துணிவுடன்” என்றும் மொழிபெயர்க்கலாம். பவுல் மேலும் துணிவுடன் எழுதினார் என்றோ, குறிப்பிட்ட சில விஷயங்களைப் பற்றி துணிவுடன் எழுதினார் என்றோ இச்சொற்றொடரைப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கடவுள் எனக்கு அளித்த அருள்” என்பது இங்கு பொதுவான இறைத் தயவை மட்டும் அல்லாமல், பவுலுக்குக் கடவுள் அளித்த பணியையும் அதற்கான ஆற்றலையும் சுட்டுகிறது; அடுத்த வசனத்தைப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: சற்றுக் கூடுதல் துணிவுடன்
  rationale: ஒப்பீட்டுப் பொருளுடைய வினையடை என்பதால் ‘கூடுதல் துணிவுடன்’ என மொழிபெயர்க்கப்பட்டது; ‘சற்று’ என்பது தமிழில் இதன் மென்மையான சொல்லாட்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனாலும்
  rationale: முந்தைய பாராட்டிலிருந்து மென்மையான மாறுபாட்டையும் கருத்துத் திருப்பத்தையும் குறிக்கிறது.
- source_word: ἔγραψα
  choice: எழுதியிருக்கிறேன்
  rationale: கடிதம் எழுதும் சூழலில் வரும் இறந்தகால வினையை, வாசகருக்கு முன்புள்ள கடிதத்தைக் குறிக்கும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀπὸ μέρους
  choice: சில பகுதிகளில்
  rationale: எழுத்தின் சில பகுதிகள் அல்லது சில குறிப்பிட்ட விஷயங்கள் என்ற இரு தொடர்புடைய பொருள்களுக்கும் இடமளிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: உங்களுக்கு மீண்டும் நினைவூட்டும் விதமாக
  rationale: பங்கேற்புவினையின் முறை அல்லது நோக்கத்தை இயல்பாகக் காட்டுவதோடு, கூட்டு வினைச்சொல்லிலுள்ள மீண்டும் நினைவூட்டும் நுண்பொருளையும் வெளிப்படுத்துகிறது.
- source_word: διὰ τὴν χάριν
  choice: அருளின் காரணமாகவே
  rationale: διά + வேற்றுமை உருபு காரணத்தையோ அடிப்படையையோ குறிக்கிறது; χάρις என்பதற்கு பவுலின் வழக்கமான விரிவான சொல்லான ‘அருள்’ பாதுகாக்கப்படுகிறது.
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: கடவுள் எனக்கு அளித்த
  rationale: கடவுளைச் செய்பவராகக் காட்டும் செயப்பாட்டு அமைப்பை இயல்பான தமிழ் செய்வினை அமைப்பில் துல்லியமாகத் தருகிறது.
theological_decisions:
- issue: இச்சூழலில் χάρις என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘அருள்’ என்ற விரிவான சொல்லைப் பேணுதல்; பவுலுக்குக் கடவுள் அளித்த திருத்தூதுப் பணியையும் அதற்கான ஆற்றலையும் இது இங்கு சுட்டுகிறது என்பதை அடிக்குறிப்பில் விளக்குதல்
  alternative: பொதுவான இறைத் தயவு என்ற பொருள் மட்டும்; அல்லது முதன்மை உரையிலேயே ‘பணி/அதிகாரம்’ என்று குறுக்குதல்
  rationale: அடுத்த வசனம் இந்த அருளைப் புறவினத்தாருக்கான பவுலின் பணியுடன் இணைக்கிறது. எனினும், கிரேக்கச் சொல் ‘பணி’ என்று நேரடியாகக் கூறாததால், அதன் விரிவையும் இறையியல் அழுத்தத்தையும் முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; இரண்டாவது வாக்கியிலுள்ள ‘இவ்வாறு எழுதினேன்’ காரணத் தொடர்பை வெளிப்படையாகத் தக்கவைக்கிறது.
