  source_fidelity: 'முதன்மை உரை கிரேக்கத்தின் முக்கியக் கூறுகளைப் பெரும்பாலும் தக்கவைக்கிறது: பவுலின் ஒப்பீட்டுத் துணிவு, ஓரளவு/சில அம்சங்கள் என்ற வரம்பு, நினைவூட்டுதல், கடவுள் அளித்த அருள் ஆகியவை உள்ளன. ஆனால் “சில பகுதிகளில்” என்பது கடிதத்தின் பகுதிகளையே குறிப்பதாகச் சற்றுக் குறுகலாக்குகிறது; ἀπὸ μέρους என்பதன் மாற்று வாய்ப்பை முதன்மை உரையில் இயல்பாகத் திறந்துவிடலாம். மேலும் அடிக்குறிப்பில் “மற்ற இடங்களைவிட இங்கு” என்பது கிரேக்கத்தில் இல்லாத ஒப்பீட்டு அளவுகோலைச் சேர்க்கிறது.'
