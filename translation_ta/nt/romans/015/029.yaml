id: ROM.15.29
reference: Romans 15:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: ta
  text: மேலும், நான் உங்களிடம் வரும்போது, மெசியாவின்[a] ஆசீர்வாதத்தின் நிறைவோடு வருவேன் என்பதை அறிந்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின்.”
    reason: Χριστός என்ற பட்டத்திற்கான மரபுவழி மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: οἶδα
  choice: அறிந்திருக்கிறேன்
  rationale: பவுலின் உறுதியான அறிவை அல்லது நிச்சயத்தை நேரடியாக வெளிப்படுத்துகிறது; இதை வெறும் கருத்தாக மென்மைப்படுத்தவில்லை.
- source_word: δὲ
  choice: மேலும்
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் உரையை முன்னெடுத்துச் செல்லும் மென்மையான இணைப்பாக உள்ளது.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: நான் உங்களிடம் வரும்போது
  rationale: எதிர்கால முதன்மை வினையுடன் தொடர்புடைய பங்கேற்புவினையின் காலப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐλεύσομαι
  choice: வருவேன்
  rationale: ἔρχομαι என்பதன் எதிர்கால வடிவத்தை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: ἐν πληρώματι
  choice: முழுநிறைவோடு
  rationale: ἐν இங்கு உடனிருக்கும் சூழல் அல்லது முறையைக் குறிக்கிறது; πλήρωμα கொண்டுள்ள முழுமை மற்றும் நிரம்பிய அளவு என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: εὐλογίας
  choice: ஆசீர்வாதத்தின்
  rationale: πλήρωμα என்பதுடன் உள்ள இறைவேற்றுமை உறவைப் பாதுகாத்து, அந்த நிறைவு ஆசீர்வாதத்தால் அமைந்தது என்பதைத் தெளிவாக்குகிறது.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது; இறைவேற்றுமை வடிவமும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு Χριστός ஒரு பட்டமாக இருப்பதால் ‘மெசியா’ அதன் பொருளை வெளிப்படுத்துகிறது. தமிழ் கிறிஸ்தவ வழக்கில் பரிச்சயமான ‘கிறிஸ்து’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது; இரண்டும் கிரேக்கச் சொல்லையே குறிக்கின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வரும்போது … வருவேன்’ என்ற மீளுரைத்தல் கிரேக்கத்தின் பங்கேற்புவினை–முதன்மை வினை அமைப்பையும் பவுலின் வலியுறுத்தலையும் இயல்பாகப் பாதுகாக்கிறது.
