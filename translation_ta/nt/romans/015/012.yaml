id: ROM.15.12
reference: Romans 15:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: ta
  text: 'மேலும் ஏசாயா கூறுகிறார்: “ஈசாயின் வேர் தோன்றும்; பிற இனத்தாரை ஆள எழும்புகிறவரும் அவரே. அவர்மேல் பிற இனத்தார் நம்பிக்கை வைப்பார்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: ஈசாயின் வேர்
  rationale: மூல உருவகத்தை அப்படியே காக்கிறது; ஈசாயின் வம்சத்திலிருந்து வரும் மேசியாவைக் குறிக்கும் சொல்லாட்சியின் வேதாகமத் தொடர்பையும் பாதுகாக்கிறது.
- source_word: Ἔσται
  choice: தோன்றும்
  rationale: சொல்லடியாக ‘இருக்கும்’ என்றாலும், ஒருவரின் வருகை/வெளிப்பாட்டைக் குறிக்கும் இந்த இறைவாக்குச் சூழலில் இயல்பான தமிழில் ‘தோன்றும்’ என்று வழங்கப்பட்டது; ‘வருவார்’ எனக் கூறி மூலத்தில் இல்லாத தெளிவைச் சேர்ப்பது தவிர்க்கப்பட்டது.
- source_word: ὁ ἀνιστάμενος
  choice: எழும்புகிறவர்
  rationale: எழுதல் அல்லது எழுந்து நிற்றல் என்ற மூலச் சொல்லின் இயக்க உருவகத்தைக் காக்கிறது; உயிர்த்தெழுதலை மட்டும் கட்டாயமாக்காமல் அதன் இயல்பான தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: ἄρχειν ἐθνῶν
  choice: பிற இனத்தாரை ஆள
  rationale: ἄρχειν என்பதன் ஆட்சிசெய்தல் பொருளையும், ἔθνη என்பதன் யூதரல்லாத பிற மக்கள்/இனங்கள் என்ற பரப்பையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐπ’ αὐτῷ ... ἐλπιοῦσιν
  choice: அவர்மேல் ... நம்பிக்கை வைப்பார்கள்
  rationale: ἐπί + dative அமைப்பின் சார்ந்திருக்கும் நம்பிக்கையை ‘அவர்மேல்’ எனப் பாதுகாத்து, எதிர்கால வினையையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ‘ஈசாயின் வேர்’ மற்றும் ‘ஆள எழும்புகிறவர்’ இடையிலான தொடர்பு
  choice: “பிற இனத்தாரை ஆள எழும்புகிறவரும் அவரே”
  alternative: “ஈசாயின் வேரும், பிற இனத்தாரை ஆள எழும்புகிறவரும் இருப்பார்”
  rationale: καί தொடரமைப்பு இரண்டு தனி நபர்களைக் குறிக்கவில்லை; ஒரே நபரை இரு வகையில் விவரிக்கிறது. ‘அவரே’ என்பது தமிழில் அந்த அடையாள ஒற்றுமையை இயல்பாக வெளிப்படுத்துகிறது.
- issue: ἀνιστάμενος என்பதில் உயிர்த்தெழுதல் குறிப்பு உள்ளதா
  choice: “எழும்புகிறவர்”
  alternative: “உயிர்த்தெழுகிறவர்”
  rationale: இந்தச் சூழலில் ஆட்சி செய்ய எழுதல் முதன்மையான பொருள். ‘உயிர்த்தெழுதல்’ எனத் தீர்மானமாக மொழிபெயர்ப்பது மூலத்தின் பரந்த பொருளை தேவையின்றிக் குறுக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. மேற்கோளின் இறைவாக்குத் தன்மையைப் பேணியபடி மிகப் பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
