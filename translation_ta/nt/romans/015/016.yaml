source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: ta
  text: பிற இனத்தாருக்காக மெசியா இயேசுவின் ஊழியனாக நான் இருந்து, கடவுளின் நற்செய்தியை ஆசாரியப் பணியாகச் செய்து, பிற இனத்தாரின் காணிக்கை தூய ஆவியால் புனிதமாக்கப்பட்டு கடவுளுக்கு ஏற்றுக்கொள்ளத்தக்கதாக ஆகும்படி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειτουργὸν
  choice: ஊழியன்
  rationale: சமயச் சேவை உள்ளிட்ட பொது அல்லது புனிதப் பணியைச் செய்பவரைக் குறிக்கும் சொல்லாகும். அருகிலுள்ள ஆசாரியப் பணியைச் சுட்டும் வினையெச்சத்துடன் சேர்ந்து, சேவை என்ற பொருளையும் புனிதப் பணியின் நயத்தையும் இது காக்கிறது.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மெசியா இயேசு
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைக் கொண்டிருப்பதால், அதன் பொருளை வெளிப்படுத்தும் வகையில் “மெசியா” என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: εἰς τὰ ἔθνη
  choice: பிற இனத்தாருக்காக
  rationale: ரோமர் நூலின் யூதர்–யூதரல்லாதார் சூழலில் ἔθνη என்பது பொதுவாக யூதரல்லாத மக்களைக் குறிக்கிறது. “பிற இனத்தார்” என்பது நவீன தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: ἱερουργοῦντα
  choice: ஆசாரியப் பணியாற்றி
  rationale: இது பொதுவான ஊழியத்தை மட்டுமல்ல, குறிப்பாக ஆசாரியருக்குரிய புனிதப் பணியைச் சுட்டுகிறது; ஆகவே மூலத்தின் பலியிடும் உருவகம் காக்கப்படுகிறது.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: கடவுளின் நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் பொருளை ordinary modern Tamil-ல் நேரடியாகவும் தெளிவாகவும் தெரிவிக்க “நற்செய்தி” பயன்படுத்தப்படுகிறது.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: பிற இனத்தாராகிய காணிக்கை
  rationale: உடனடியான ஆசாரிய உருவகத்திலும் பவுலின் பணிச்சூழலிலும் பிற இனத்தாரே கடவுளுக்குச் செலுத்தப்படும் காணிக்கை என்பது மிகச் சாத்தியம். ஆயினும் கிரேக்க உரையில் உள்ள வேற்றுமைத் தொகை மாற்றுப் பொருளுக்கும் இடமளிப்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εὐπρόσδεκτος
  choice: கடவுளுக்கு ஏற்றதாக
  rationale: பலிக் காணிக்கை கடவுளால் ஏற்றுக்கொள்ளத்தக்கதாக இருப்பதைக் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வாக்கியத்தில் ஏற்றுக்கொள்பவர் கடவுள் என்பது உருவகத்தால் தெளிவாகிறது.
- source_word: ἡγιασμένη
  choice: புனிதமாக்கப்பட்டு
  rationale: நிறைவேற்றப்பட்ட புனிதப்படுத்தும் செயலின் தொடரும் விளைவை இச்செயப்பாட்டு வடிவம் தெரிவிக்கிறது; சாதாரண வாசகருக்கும் தெளிவாக உள்ளது.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: தூய ஆவியால்
  rationale: ἐν இங்கு காணிக்கையைப் புனிதமாக்கும் கருவி அல்லது செயற்பாட்டாளரைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது. இடம் அல்லது செயல்தளத்தைச் சுட்டும் வாசிப்பும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பவுல் தமது பணியை ஆசாரியப் பணியாக வருணித்தல்
  choice: பிற இனத்தாருக்கான தமது அப்போஸ்தலப் பணியைப் பவுல் ஆசாரிய உருவகத்தில் வருணிக்கிறார்; நற்செய்திப் பணியின் பயனாகிய மக்களே காணிக்கையாக முன்வைக்கப்படுகின்றனர்.
  alternative: இதை முறையான ஆசாரியப் பதவிக்கான உரிமைகோரலாகப் படித்தல், அல்லது ஆசாரிய உருவகத்தை முற்றிலும் நீக்கிப் பொதுவான சேவையாக மட்டும் படித்தல்.
  rationale: λειτουργός, ἱερουργέω, προσφορά ஆகிய மூன்று சொற்களும் சேர்ந்து தெளிவான ஆசாரிய–காணிக்கை உருவகத்தை உருவாக்குகின்றன. ஆனால் இவ்வசனம் பாவநிவாரணப் பலியைப் பற்றியோ பிற்கால திருச்சபைப் பதவி அமைப்பைப் பற்றியோ கூறவில்லை.
- issue: “பிற இனத்தாரின் காணிக்கை” என்பதன் குறிப்பு
  choice: நற்செய்திப் பணியால் கடவுளிடம் கொண்டுவரப்பட்ட பிற இனத்தாரே காணிக்கையாக முன்வைக்கப்படுகின்றனர்.
  alternative: பிற இனத்தார் செலுத்தும் காணிக்கை.
  rationale: ஆசாரிய உருவகமும் பவுலின் பிற இனத்தார் பணியும் முதல் வாசிப்பை ஆதரிக்கின்றன. எனினும் τῶν ἐθνῶν என்ற கிரேக்க வேற்றுமைத் தொகை இரண்டாவது வாசிப்பையும் இலக்கணரீதியாக அனுமதிப்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கொண்டுள்ளது. மூலத்தின் ஆசாரிய–காணிக்கை உருவகம் தெளிவாக வைக்கப்பட்டுள்ளது. பயனர் அளித்த அடிக்குறிப்பு b உண்மையில் ἱερουργοῦντα குறித்த மாற்றுச் சொற்றொடராக இருந்தாலும், முதன்மை உரை “ஆசாரியப் பணியாற்றி” என்று நேரடியாக இருப்பதால் தனி அடிக்குறிப்பு அவசியமில்லை; கொடுக்கப்பட்ட ஆங்கில அடிக்குறிப்பு வரிசையில் b/d உள்ளடக்கம் இடமாறியிருப்பதையும் கருத்தில் கொண்டு, தேவையான உண்மையான மாற்றுகள் மட்டும் குறிக்கப்பட்டுள்ளன.
