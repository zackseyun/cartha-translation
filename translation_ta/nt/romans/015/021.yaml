  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: ta
  text: 'ஆனால், எழுதப்பட்டுள்ளபடி:


    “எவர்களுக்கு அவரைப் பற்றி அறிவிக்கப்படவில்லையோ, அவர்கள் காண்பார்கள்;[a][b]


    கேள்விப்படாதவர்கள் புரிந்துகொள்வார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பவுல் இங்கே ஏசாயா 52:15-ஐ மேற்கோள் காட்டுகிறார். ஏசாயாவின் சூழலில் “அவர்” என்பது ஊழியக்காரர் உருவத்தைக் குறிக்கிறது; இங்கே பவுல் அதைத் தாம் அறிவிக்கும் நற்செய்தியோடு பொருத்துகிறார்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “அவரைக் குறித்து எதுவும் அறிவிக்கப்படாதவர்கள் காண்பார்கள்; கேள்விப்படாதவர்கள் புரிந்துகொள்வார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் பவுல் கூறிய ஊழிய நோக்கத்தோடு வேதாகம மேற்கோளை எதிர்மறைத் தொடர்பில் இணைக்கிறது.
- source_word: καθὼς γέγραπται
  choice: எழுதப்பட்டிருக்கிறபடி
  rationale: வேதாகம மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடர்; கிரேக்க நிறைவுற்ற செயப்பாட்டு வடிவத்தின் தொடரும் நிலையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: அவரைப் பற்றி அறிவிக்கப்படாதவர்கள்
  rationale: சொல்லாட்சியில் உள்ள ‘யாருக்கு ... அறிவிக்கப்படவில்லையோ’ என்ற தத்துவத்தை இயல்பான தமிழில் பெயரெச்சத் தொடராகத் தருகிறது; அறிவிப்பின் பொருளான ‘அவர்’ என்பதையும் காக்கிறது.
- source_word: ὄψονται
  choice: காண்பார்கள்
  rationale: ‘பார்ப்பார்கள்/காண்பார்கள்’ என்ற நேரடிப் பொருளைத் தக்கவைத்து, அதை ‘உணர்வார்கள்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: கேள்விப்படாதவர்கள்
  rationale: இதுவரை கேள்விப்படாத நிலையைக் குறிக்கும் கிரேக்க நிறைவுற்ற வடிவத்தைச் சுருக்கமான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: συνήσουσιν
  choice: புரிந்துகொள்வார்கள்
  rationale: வருங்காலத்தில் புரிந்துகொள்ளுதல் என்ற தீர்க்கதரிசன வாக்குறுதியைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் வரும் αὐτοῦ (‘அவர்’) என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘அவர்’ என்ற பதிற்பெயரை அப்படியே வைத்தல்
  alternative: ‘மேசியா’ அல்லது ‘கிறிஸ்து’ என்று விரித்துரைத்தல்
  rationale: பவுலின் நற்செய்திப் பணிச்சூழல் இதை கிறிஸ்துவுக்குப் பொருத்தினாலும், கிரேக்க உரை αὐτοῦ என்ற பதிற்பெயரையே பயன்படுத்துகிறது. அதை விரிவாக்காமல் இருப்பது மூலத்தின் மறைமுகத்தன்மையையும் ஏசாயா மேற்கோளின் அமைப்பையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘காண்பார்கள்’ மற்றும் ‘புரிந்துகொள்வார்கள்’ என்ற இணை அமைப்பு மூலத்தின் தீர்க்கதரிசனத் தாளத்தைக் காக்கிறது.
