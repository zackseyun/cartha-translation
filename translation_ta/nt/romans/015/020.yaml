  source_fidelity: மூலக் கிரேக்கத்தின் கருத்தும் அமைப்பும் நம்பகமாகக் காக்கப்பட்டுள்ளன. φιλοτιμούμενον என்பதன் தனிப்பட்ட ஊழிய-இலட்சியமும், Χριστός ஏற்கெனவே பெயரிட்டு அறிவிக்கப்பட்ட இடங்களைத் தவிர்க்கும் குறிப்பு மற்றும் ἵνα μὴ மூலம் வரும் நோக்கமும் தெளிவாக உள்ளன. ‘மற்றொருவருடைய அஸ்திவாரத்தின்மேல்’ என்பது ἐπ’ ἀλλότριον θεμέλιον என்ற கட்டட உருவகத்தைத் துல்லியமாகத் தருகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் கண்ணியமாகவும் புரியத்தக்கதாகவும் உள்ளது. தொடக்கத்தில் நோக்கத் தொடரை முன்வைத்திருப்பது சற்றே இலக்கியமான சொல்லொழுங்கு என்றாலும் இயல்பானது; பொருளில் குழப்பம் ஏற்படுத்தாது.
  terminology: ‘மேசியா’ என்பது இச்சூழலில் பட்டப்பெயராகச் செயல்படும் Χριστός என்பதற்குச் சரியான தேர்வு. ‘நற்செய்தி,’ ‘இலட்சியம்,’ ‘அஸ்திவாரம்’ ஆகியவை பொதுவாகப் புரியக்கூடியவையும் மூலத்தின் பதிவுக்கும் உருவகத்துக்கும் ஏற்றவையும் ஆகும். மாற்றுவடிவமான ‘கிறிஸ்து’ அடிக்குறிப்பில் முறையாக வழங்கப்பட்டுள்ளது.
