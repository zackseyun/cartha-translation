id: ROM.15.20
reference: Romans 15:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: ta
  text: இவ்வாறே, மற்றொருவருடைய அஸ்திவாரத்தின்மேல் நான் கட்டாதபடி, மேசியாவின்[a] பெயர் ஏற்கெனவே சொல்லப்பட்ட இடங்களில் அல்லாமல் நற்செய்தியை அறிவிப்பதையே என் இலட்சியமாகக் கொண்டிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின்.” கிரேக்கச் சொல் Χριστός; இங்கு அது ஒரு பட்டமாகப் பயன்படுவதால் முதன்மை உரையில் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: இவ்வாறே
  rationale: முந்தைய வசனங்களில் பவுல் விளக்கிய ஊழிய முறையுடன் இந்தக் கூற்றை இணைக்கும் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: φιλοτιμούμενον
  choice: என் இலட்சியமாகக் கொண்டிருக்கிறேன்
  rationale: ஆர்வமிக்க தனிப்பட்ட நோக்கம் அல்லது உயர்ந்த விருப்பம் என்ற பொருளைத் தருகிறது; இதை எல்லாருக்குமான கட்டளையாக மாற்றாமல் பவுலின் சொந்த ஊழிய இலட்சியமாகவே வைத்திருக்கிறது.
- source_word: εὐαγγελίζεσθαι
  choice: நற்செய்தியை அறிவிப்பதை
  rationale: வினைச்சொல்லின் அறிவித்தல் சார்ந்த பொருளைத் தெளிவாகவும், சமயக் குழுச்சொல்லாடலைத் தவிர்த்தும் தருகிறது.
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: மேசியாவின் பெயர் ஏற்கெனவே சொல்லப்பட்ட இடங்களில் அல்லாமல்
  rationale: ὠνομάσθη என்பதின் ‘பெயர் சொல்லப்படுதல்’ என்ற நேரடிப் படிமத்தைப் பாதுகாக்கிறது. தமிழின் இயல்புக்காக கிரேக்கச் செயப்பாட்டு அமைப்பு உடைமைத் தொடராக மாற்றப்பட்டுள்ளது; ‘ஏற்கெனவே’ என்பது சூழலில் உள்ள முன்னுரிமையை வெளிப்படுத்துகிறது.
- source_word: ἵνα μὴ
  choice: கட்டாதபடி
  rationale: எதிர்மறை நோக்கத்தைச் சுருக்கமான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπ’ ἀλλότριον θεμέλιον
  choice: மற்றொருவருடைய அஸ்திவாரத்தின்மேல்
  rationale: ἀλλότριος என்பதின் ‘வேறொருவருக்குரிய’ பொருளையும், முந்தைய அப்போஸ்தலப் பணியைச் சுட்டும் கட்டட உருவகத்தையும் காக்கிறது.
- source_word: οἰκοδομῶ
  choice: நான் கட்ட
  rationale: ‘அஸ்திவாரம்’ என்பதுடன் இணைந்த கட்டட உருவகத்தை விளக்கவுரை சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்பதின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அந்தச் சொல் அறிவிக்கப்படும் நபரின் பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என்று தரப்பட்டுள்ளது; தமிழில் வழக்கமான ‘கிறிஸ்து’ என்ற வடிவமும் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பவுலின் ஊழியக் கொள்கையின் வரம்பு
  choice: பவுலின் தனிப்பட்ட ஊழிய இலட்சியமாக மொழிபெயர்த்தல்
  alternative: ஏற்கெனவே நற்செய்தி அறிவிக்கப்பட்ட இடங்களில் யாரும் பணியாற்றக்கூடாது என்ற பொதுத் தடை
  rationale: φιλοτιμούμενον என்பது பவுலின் ஆர்வமிக்க தனிப்பட்ட நோக்கத்தைச் சொல்கிறது; வசனத்தை எல்லா ஊழியர்களுக்குமான கட்டளையாக விரிவுபடுத்தாமல் மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அஸ்திவாரம்’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டிலும் பொதுவழக்கிலும் அறியப்பட்ட சொல்லாக இருப்பதுடன், மூலத்தின் கட்டட உருவகத்தையும் தெளிவாகக் காக்கிறது.
