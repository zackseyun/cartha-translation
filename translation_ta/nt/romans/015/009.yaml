id: ROM.15.9
reference: Romans 15:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: ta
  text: 'மேலும், கடவுளின் இரக்கத்திற்காகப் பிற இனத்தார்[a] அவரை மகிமைப்படுத்தும்படியாகவும் கிறிஸ்து பணிசெய்தார். எழுதப்பட்டிருப்பதுபோல:


    “ஆகவே, பிற இனத்தாரிடையே உம்மைப் போற்றுவேன்;


    உமது பெயரைப் புகழ்ந்து பாடுவேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிற இனத்தார்’ என்று வரும் இரு இடங்களிலும், ‘நாடுகள்’ என்றும் மொழிபெயர்க்கலாம். பவுலின் வாதம் இந்த மேற்கோளை யூதரல்லாத மக்களுக்குச் சிறப்பாகப் பொருத்துகிறது; ஆனால் அடிப்படை மேற்கோளில் ‘நாடுகள்’ என்ற விரிவான பொருளும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη / ἔθνεσι
  choice: பிற இனத்தார் / பிற இனத்தாரிடையே
  rationale: ரோமர் திருமுகத்தின் சூழலில் யூதரல்லாத மக்களைச் சுட்டுவதால் ‘பிற இனத்தார்’ என்பது பவுலின் வாதத்தைத் தெளிவாகக் காட்டுகிறது. அதேவேளை, மேற்கோளின் மூலச் சூழலில் ‘நாடுகள்’ என்ற விரிவான பொருளும் சாத்தியம்; அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ὑπὲρ ἐλέους
  choice: அவருடைய இரக்கத்திற்காக
  rationale: ὑπέρ உடன் வரும் மரபுத்தொடர் காரணம் அல்லது அடிப்படையைக் குறிக்கிறது. சூழலின்படி இரக்கம் கடவுளுடையது என்பதைக் ‘அவருடைய’ தெளிவாக்குகிறது.
- source_word: δοξάσαι
  choice: மகிமைப்படுத்தும்படியாக
  rationale: முந்தைய வசனத்தைச் சார்ந்த இறந்தகால infinitive நோக்கம் அல்லது விளைவை உணர்த்துகிறது; இந்தத் தமிழ் வடிவம் அந்தச் சார்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καθὼς γέγραπται
  choice: எழுதப்பட்டிருப்பதுபோல
  rationale: வேதாகம மேற்கோளை அறிமுகப்படுத்தும் நிலையான சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐξομολογήσομαί
  choice: போற்றுவேன்
  rationale: இங்கு பாவ அறிக்கையல்ல, கடவுளை வெளிப்படையாகப் புகழ்தல் அல்லது நன்றி செலுத்துதல் என்ற பொருள்; அடுத்துள்ள பாடுதலுடன் இணையாக ‘போற்றுவேன்’ பொருந்துகிறது.
- source_word: ψαλῶ
  choice: புகழ்ந்து பாடுவேன்
  rationale: கொய்னே பயன்பாட்டில் கடவுளைப் புகழ்ந்து பாடுதல் என்ற வழிபாட்டு வலிமையைத் தருகிறது; சங்கீத நூலை மட்டும் பாடுதல் என வரம்பிடுவதில்லை.
- source_word: τῷ ὀνόματί σου
  choice: உமது பெயரை
  rationale: தமிழில் இயல்பாக அமையும் செயப்படுபொருள் வடிவத்தைப் பயன்படுத்தி, கடவுளின் பெயரைப் புகழும் வேதாகம மரபுத்தொடரின் கருத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தொடக்க infinitive கூறின் சார்பும் வலிமையும்
  choice: இந்தக் கூறு முந்தைய வசனத்திலிருந்து தொடர்வதைத் தெளிவாக்க, கிறிஸ்துவின் பணியைக் குறிக்கும் ‘அவர் பணிசெய்தார்’ என்பதையும் நோக்கத்தைக் குறிக்கும் ‘மகிமைப்படுத்தும்படியாகவும்’ என்பதையும் பயன்படுத்துதல்
  alternative: ‘மேலும், பிற இனத்தார் இரக்கத்திற்காகக் கடவுளை மகிமைப்படுத்தவும்’ என்ற இலக்கண ரீதியாகத் துண்டான, சொற்சொல்லான வடிவம்
  rationale: கிரேக்கத்தில் இக்கூறு ரோமர் 15:8-ஐ இலக்கண ரீதியாகச் சார்ந்துள்ளது. தமிழில் தனி வசனமாக வாசிக்கும்போது அதன் தொடர்பை உணர்த்துவது அவசியம். சேர்க்கப்பட்ட சொற்கள் புதிய இறையியல் கருத்தை உருவாக்காமல், முந்தைய வசனத்தில் வெளிப்படையாக உள்ள கிறிஸ்துவின் பணியையே மீண்டும் சுட்டுகின்றன; வாக்குத்தத்தங்கள் இஸ்ரவேலுக்கு உறுதிசெய்யப்படுவதும் பிற இனத்தார் இரக்கத்திற்காக மகிமைப்படுத்துவதும் இடையிலான பவுலின் பதற்றம் நிலைநிறுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மேற்கோளில் கடவுளை நேரடியாக அழைப்பதால் மரியாதைப் பன்மையான ‘உம்மை/உமது’ வடிவங்கள் இடம்பெறுகின்றன. வசனம் 15:8-ஐ இலக்கண ரீதியாகச் சார்ந்திருப்பதைத் தனியாக வாசிக்கும் தமிழிலும் புரியச் செய்ய மிகக் குறைந்த தெளிவாக்கம் சேர்க்கப்பட்டுள்ளது.
