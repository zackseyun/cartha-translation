  text: ἔχω οὖν ⸀τὴν καύχησιν ἐν Χριστῷ Ἰησοῦ τὰ πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: ta
  text: ஆகையால், கடவுளுக்குரிய காரியங்களில் மெசியா இயேசுவில் பெருமை கொள்ள எனக்கு அடிப்படை உண்டு[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெருமை கொள்ள எனக்கு இடமுண்டு’ அல்லது ‘பெருமை கொள்வதற்கான காரணம் எனக்கு உண்டு.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘கிறிஸ்து இயேசுவில்’; Χριστός இங்கு ஒரு பட்டமாக இருப்பதால் ‘மெசியா இயேசு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘கடவுளைப் பற்றிய காரியங்களில்’ அல்லது ‘கடவுளோடு தொடர்புடைய விவகாரங்களில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: எனக்குக் காரணம் உண்டு
  rationale: ἔχω என்பதன் ‘எனக்கு உண்டு’ என்ற நேரடிப் பொருளை, καύχησιν உடன் இணைத்து இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: καύχησιν
  choice: பெருமைப்பட ... காரணம்
  rationale: இச்சொல் ‘பெருமைப்படுதல்’ என்பதையும் ‘பெருமைப்படுவதற்கான அடிப்படை/காரணம்’ என்பதையும் குறிக்கலாம்; இவ்விடத்தில் இயல்பான தமிழுக்காக இரண்டாவது நுட்பம் எடுத்துக்கொள்ளப்பட்டது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மெசியா இயேசுவுக்குள்
  rationale: ἐν என்பதன் ஒன்றிப்பையும் செயல்படும் வட்டத்தையும் ‘உக்குள்’ காக்கிறது; Χριστός இங்கு பட்டமாக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: τὰ πρὸς τὸν θεόν
  choice: கடவுளுக்குரிய காரியங்களைப் பொறுத்தவரை
  rationale: கடவுளோடு தொடர்புடைய காரியங்கள் என்ற சொற்றொடரின் பரந்த பொருளைக் காக்கிறது; அதை வழிபாடு அல்லது ஊழியம் என மட்டும் குறுக்கவில்லை.
- source_word: θεόν
  choice: கடவுள்
  rationale: இச்சூழலில் θεός என்பதற்கான இயல்பான நவீனத் தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός தனிப்பெயராக அல்லாமல் இயேசுவின் பட்டமாகச் செயல்படுவதால் அதன் பொருளை மொழிபெயர்ப்பது பொருத்தமானது.
- issue: பவுலின் καύχησις என்பதன் தன்மை
  choice: மெசியா இயேசுவுக்குள், கடவுளுக்குரிய காரியங்களில் பெருமைப்படுவதற்கான காரணம்
  alternative: பொதுவான தனிப்பட்ட பெருமை அல்லது தன்னம்பிக்கை
  rationale: ἐν Χριστῷ Ἰησοῦ மற்றும் τὰ πρὸς τὸν θεόν ஆகிய வரம்புகள், இது கட்டுப்பாடற்ற சுயபெருமை அல்ல என்பதை உரையின் பதற்றத்தை நீக்காமல் காட்டுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெருமைப்பட எனக்குக் காரணம் உண்டு’ என்பது இயல்பான தமிழை வழங்குகிறது; அதேவேளை ‘மெசியா இயேசுவுக்குள்’ என்ற சொற்றொடர் மூலத்தின் ஒன்றிப்பு/வட்டம் சார்ந்த நுட்பத்தைக் காக்கிறது.
