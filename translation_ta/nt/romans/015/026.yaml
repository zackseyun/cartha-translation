  verdict: revise
  source_fidelity: 'வரைவின் பொருள் பெரும்பாலும் கிரேக்க மூலத்துக்கு உண்மையாக உள்ளது: γάρ-இன் விளக்கத் தொடர்பு, பிரதேசப் பெயர்களின் ஆகுபெயர்ப் பயன்பாடு, பொருளுதவியைக் குறிக்கும் κοινωνία, மற்றும் எருசலேமிலுள்ள பரிசுத்தவான்களின் ஏழைகள் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் εὐδόκησαν-இல் உள்ள மனமுவந்த சாதக விருப்பத்தைத் தெளிவாக வெளிப்படுத்துவதும், அடிக்குறிப்பில் κοινωνίαனின் மாற்று வாசிப்பை மூலத்துக்கு நெருக்கமாக அமைப்பதும் நன்று.'
  naturalness: ‘எருசலேமில் உள்ள பரிசுத்தவான்களிடையே இருக்கும் ஏழைகள்’ என்பது புரிந்துகொள்ளத்தக்கது; ஆயினும் ‘எருசலேமிலுள்ள பரிசுத்தவான்களில் ஏழைகள்’ என்பது நவீனத் தரத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது. ‘மனமுவந்து விரும்பின’ என்பது இச்சூழலில் ‘were pleased’ என்பதன் விருப்பத்தையும் நேர்மறை மனநிலையையும் இயல்பாகக் காட்டுகிறது.
  terminology: ‘பங்களிப்பு,’ ‘பரிசுத்தவான்கள்,’ ‘எருசலேம்,’ ‘மக்கெதோனியா,’ மற்றும் ‘அகாயா’ ஆகியவை பொருத்தமானவை. அடிக்குறிப்பின் ‘தங்களுக்குள்ளவற்றைப் பகிர்ந்துகொள்ள’ என்பது சுட்டுப்பெயரையும் உடைமைப் பொருளையும் சேர்க்கிறது; மூலத்தின் வரையறுக்கப்படாத ‘some sharing’ என்பதற்கு ‘ஒருவகைப் பகிர்வைச் செய்ய’ நெருக்கமானது.
