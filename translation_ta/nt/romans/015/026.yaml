source:
  edition: SBLGNT
  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: ta
  text: ஏனெனில், மக்கெதோனியாவும் அகாயாவும் எருசலேமிலுள்ள பரிசுத்தவான்களில் ஏழைகளுக்காக ஒரு பங்களிப்பைச் செய்ய மனமுவந்து விரும்பின[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருவகைப் பகிர்வைச் செய்ய’; இந்தக் கிரேக்கச் சொற்றொடர் பொருளுதவியின் வழியாக வெளிப்படும் பங்கேற்பையும் உறவையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: விருப்பம் கொண்டன
  rationale: இந்த வினைச்சொல் மனமுவந்த விருப்பத்தையும் சாதகமான தீர்மானத்தையும் குறிக்கிறது. வெறும் ‘தீர்மானித்தன’ என்பதைவிட ‘விருப்பம் கொண்டன’ அதன் நேர்மறையான மனநிலையையும் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக இங்கு இயல்பாக அமைகிறது.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: மக்கெதோனியாவும் அகாயாவும்
  rationale: கிரேக்கத்தில் பிரதேசங்களே ஆகுபெயராக எழுவாய்களாக வருகின்றன. ‘சபைகள்’ அல்லது ‘விசுவாசிகள்’ என்று மூலத்தில் இல்லாத சொற்களைச் சேர்க்காமல் இடப்பெயர்கள் தக்கவைக்கப்பட்டுள்ளன.
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: ஒரு பங்களிப்பைச் செய்ய
  rationale: இந்தச் சூழலில் κοινωνία என்பது பொருளுதவியாக வெளிப்படும் பகிர்வைக் குறிக்கிறது. ‘பங்களிப்பு’ நடைமுறை உதவியை இயல்பாகத் தெரிவிக்கிறது; ‘ஒரு’ என்பது τινά-வின் வரையறுக்கப்படாத தன்மையைப் பிரதிபலிக்கிறது. பகிர்வு/ஐக்கியத்தின் உட்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: εἰς τοὺς πτωχοὺς
  choice: ஏழைகளுக்காக
  rationale: εἰς இங்கு உதவி யாருடைய நன்மைக்காகச் செய்யப்படுகிறது என்பதைக் காட்டுகிறது; ‘ஏழைகளுக்காக’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: τῶν ἁγίων
  choice: பரிசுத்தவான்களிடையே இருக்கும்
  rationale: ஏழைகள் எருசலேமிலுள்ள பரிசுத்தவான்கள் என்னும் குழுவைச் சேர்ந்தவர்கள் என்பதை உறவுநிலை வேற்றுமை காட்டுகிறது. ‘இடையே இருக்கும்’ என்பது அந்த உறவைத் தமிழில் தெளிவாக்குகிறது.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: எருசலேமில் உள்ள
  rationale: இந்தச் சொற்றொடர் பரிசுத்தவான்கள் எங்கிருக்கிறார்கள் என்பதை நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: பவுலின் பயன்பாட்டில் ἅγιοι என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்தவான்கள்
  alternative: பரிசுத்த மக்கள் / இறைமக்கள்
  rationale: இது விசுவாசிகளுக்கான பவுலின் வழக்கமான குழுப்பெயர். ‘பரிசுத்தவான்கள்’ மூலச்சொல்லின் பரிசுத்த அடையாளத்தையும் பவுலின் திருச்சபை சார்ந்த சொல்லாட்சியையும் தக்கவைக்கிறது; பிற்காலப் புனிதர் பட்டம் என்ற கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பிரதேசப் பெயர்களை ஆகுபெயர் எழுவாய்களாகவே வைத்திருப்பதால், தமிழில் அவற்றுடன் பொருந்தும் அஃறிணைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
