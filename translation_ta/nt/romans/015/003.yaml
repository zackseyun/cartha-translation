id: ROM.15.3
reference: Romans 15:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: ta
  text: 'ஏனெனில், மேசியாவும்கூட தமக்கே விருப்பமானதைச் செய்யவில்லை; ஆனால், எழுதப்பட்டிருக்கிறபடி: “உம்மைப் பழித்தவர்களின் பழிச்சொற்கள் என்மேல் விழுந்தன.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில், ...கூட
  rationale: γὰρ முந்தைய அறிவுரைக்கான காரணத்தைச் சுட்டுகிறது; καὶ இங்கு மேசியாவையும் வலியுறுத்திச் சேர்க்கிறது. இந்த இரு செயல்களையும் நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ὁ Χριστός
  choice: மேசியா
  rationale: இங்கு Χριστός பெயர்போல அல்லாமல் பட்டமாகவும், நம்பிக்கையாளர்களுக்கு எடுத்துக்காட்டாக நிற்பவரைக் குறிக்கவும் பயன்படுகிறது. ‘மேசியா’ அந்தப் பட்டப் பொருளைப் பாதுகாக்கிறது.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: தமக்கே விருப்பமானதைச் செய்யவில்லை
  rationale: சொல்லுக்குச் சொல் ‘தம்மை மகிழ்விக்கவில்லை’ என்பது தமிழில் வேறுபொருள் தரக்கூடும். இத்தேர்வு, தமது சொந்த விருப்பத்தை நாடவில்லை என்ற சூழல்சார் பொருளை இயல்பாகத் தெரிவிக்கிறது; மரியாதைப் பன்மையான ‘தமக்கு’ பயன்படுத்தப்படுகிறது.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: மாறாக, எழுதப்பட்டிருக்கிறபடி
  rationale: ἀλλά-வின் எதிர்மறை மாற்றத்தையும், வேத மேற்கோளுக்குரிய γέγραπται என்ற நிலைத்த விளைவுடைய நிறைவுக் காலச் சூத்திரத்தையும் காக்கிறது.
- source_word: ὀνειδισμοί
  choice: பழிச்சொற்கள்
  rationale: வாய்மொழியாக இழிவுபடுத்துதல், நிந்தித்தல் ஆகிய கருத்துகளைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது; வெறும் ‘பழிகள்’ என்பதைக் காட்டிலும் மொழிசார் தாக்குதலை வெளிப்படுத்துகிறது.
- source_word: τῶν ὀνειδιζόντων σε
  choice: உம்மைப் பழித்தவர்களின்
  rationale: பெயரெச்சத் தொடரை இயல்பான தமிழ்ச் சொற்றொடராக மாற்றுகிறது; ὀνειδισμοί / ὀνειδιζόντων ஆகிய ஒரே வேர்ச்சொல் மீளலை ‘பழித்தவர்கள் / பழிச்சொற்கள்’ என இயன்றவரை காக்கிறது.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: என்மேல் விழுந்தன
  rationale: கிரேக்க உருவகத்தையும் இறந்தகாலச் செயலையும் நேரடியாகவும் இயல்பாகவும் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: கட்டுருபுடன் வரும் இச்சொல் இங்கு பட்டப் பொருளில், நம்பிக்கையாளர்களுக்கான எடுத்துக்காட்டைச் சுட்டுகிறது. எனவே ‘மேசியா’ முதன்மை உரையில் வைக்கப்பட்டு, பரவலான மாற்று ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: சங்கீத மேற்கோளில் பேசுபவரின் அடையாளம்
  choice: ‘என்மேல்’ என்று மேற்கோளை விளக்கமின்றி அப்படியே வைத்தல்
  alternative: ‘மேசியாவாகிய என்மேல்’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: பவுல் இந்த மேற்கோளை மேசியாவுக்குப் பயன்படுத்தினாலும், மேற்கோள் தானாகக் கூறாத அடையாளத்தை மொழிபெயர்ப்பில் சேர்க்காமல் அதன் இறையியல் இழுவிசையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வேத மேற்கோளில் தேவனை நோக்கும் இரண்டாம் நபருக்கு ‘உம்மை’ என்ற மரியாதை வடிவமும், மேசியாவைக் குறிக்க ‘தமக்கு’ என்ற மரியாதைத் தற்சுட்டு வடிவமும் பயன்படுத்தப்பட்டுள்ளன. மேற்கோளின் சுருக்கமும் உருவகமும் காக்கப்பட்டுள்ளன.
