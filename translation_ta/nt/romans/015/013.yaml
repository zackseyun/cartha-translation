source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: ta
  text: நம்பிக்கையின் கடவுள், பரிசுத்த ஆவியின் வல்லமையால் நீங்கள் நம்பிக்கையில் பெருகும்படியாக, நீங்கள் நம்புவதில் எல்லா மகிழ்ச்சியாலும் சமாதானத்தாலும் உங்களை நிரப்புவாராக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: நம்பிக்கையின் கடவுள்
  rationale: δὲ இங்கு மென்மையான இணைப்புச் சொல்; தமிழில் அதைத் தனியாக மொழிபெயர்க்காமல் வாக்கிய ஓட்டத்தில் உணர்த்துவது இயல்பு. τῆς ἐλπίδος என்ற சொற்றொடர் கடவுளை நம்பிக்கையுடன் தொடர்புடையவராகவும் அதன் ஊற்றாகவும் சுட்டுகிறது; ‘நம்பிக்கையின் கடவுள்’ அந்தச் செறிவையும் மூலத்தின் அமைப்பையும் காக்கிறது.
- source_word: πληρώσαι
  choice: நிரப்புவாராக
  rationale: இறைவேண்டல் அல்லது ஆசீர்வாத விருப்பத்தை வெளிப்படுத்தும் optative வினையை ‘நிரப்புவாராக’ இயல்பாகவும் மரியாதையுடனும் தருகிறது; நிரம்புதல் என்ற உருவகமும் காக்கப்படுகிறது.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: எல்லா மகிழ்ச்சியாலும் சமாதானத்தாலும்
  rationale: πάσης என்பதன் முழுமைத் தன்மையை ‘எல்லா’ காக்கிறது. πληρόω என்பதுடன் வரும் உள்ளடக்கத்தைத் தமிழில் கருவி/உள்ளடக்க வேற்றுமை வடிவான ‘-ஆல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ πιστεύειν
  choice: நீங்கள் நம்புவதில்
  rationale: இது πίστις என்ற பெயர்ச்சொல் அல்ல, πιστεύω என்ற நம்பும் செயலைக் குறிக்கும் articular infinitive. ‘நீங்கள் நம்புவதில்’ அதன் செயற்பாட்டு மற்றும் சூழல் சார்ந்த பொருளை காக்கிறது.
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: இதனால் ... நீங்கள் ... பெருகுவீர்களாக
  rationale: εἰς τὸ + infinitive நோக்கம் அல்லது விளைவு என இரண்டுக்கும் இடமளிக்கிறது. ‘இதனால்’ விளைவு/நோக்கத் தொடர்பைத் தெளிவாக்குகிறது; ‘பெருகுவீர்களாக’ வேண்டுதல் தொனியையும் தொடர்கிறது.
- source_word: ἐν τῇ ἐλπίδι
  choice: நம்பிக்கையில்
  rationale: முன்னுள்ள ἐλπίδος உடனான சொல் தொடர்பை ஒரே தமிழ்ச் சொல்லால் காக்கிறது; ἐν என்பதன் தளம் அல்லது நிலைச் சார்ந்த பொருளையும் ‘-இல்’ தருகிறது.
- source_word: ἐν δυνάμει
  choice: வல்லமையால்
  rationale: இங்கு ஆவியின் வல்லமை வழிமுறையாகச் செயல்படுவதால், கருவிப் பொருளை ‘-ஆல்’ தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியின்
  rationale: பவுலின் பயன்பாட்டில் இது தெய்வீக பரிசுத்த ஆவியைக் குறிக்கிறது. தமிழ்க் கிறிஸ்தவச் சொல்வழக்கில் தெளிவாகவும் கண்ணியமாகவும் உள்ள ‘பரிசுத்த ஆவி’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: πνεύματος ἁγίου என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவி
  alternative: பரிசுத்தமான ஆவி / தூய ஆவி
  rationale: சூழலில் இது ஒரு மனப்பாங்கையோ பெயரற்ற ஆற்றலையோ அல்லாமல் தெய்வீக ஆவியைக் குறிக்கிறது. ‘பரிசுத்த ஆவி’ மூலத்தின் இயல்பான குறிப்பைத் தருகிறது; வசனம் சொல்லாத மேலதிக கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: εἰς τὸ என்பதில் நோக்கமா விளைவா
  choice: இதனால்
  alternative: இதற்காக / அப்போது
  rationale: கிரேக்க அமைப்பு நோக்கத்தையும் எதிர்பார்க்கப்படும் விளைவையும் தாங்கக்கூடும். ‘இதனால்’ காரண-விளைவு தொடர்பை இயல்பாகக் காட்டி, அந்த இரண்டையும் கடுமையாகப் பிரித்து முடிவு செய்வதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான இறைவேண்டல் நடை. ‘மகிழ்ச்சி’, ‘சமாதானம்’, ‘நம்பிக்கை’, ‘வல்லமை’, ‘பரிசுத்த ஆவி’ ஆகிய பரவலாக அறியப்பட்ட சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ஒரே நீண்ட ஆசீர்வாத வாக்கிய அமைப்பு தமிழில் அரைப்புள்ளியுடன் வாசிக்க எளிதாக வைக்கப்பட்டுள்ளது.
