id: ROM.15.31
reference: Romans 15:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: ta
  text: யூதேயாவில் கீழ்ப்படியாதவர்களிடமிருந்து நான் மீட்கப்படவும்[a], எருசலேமுக்கான என் பணி பரிசுத்தவான்களுக்கு ஏற்புடையதாக அமையவும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதேயாவில் நம்ப மறுப்பவர்களிடமிருந்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பங்கேற்புவினை நம்ப மறுப்பதையும், அதனால் கீழ்ப்படியாமல் இருப்பதையும் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: …வும் …வும்
  rationale: பவுல் வேண்டிக்கொள்ளச் சொல்வதன் நோக்கத்தை அறிமுகப்படுத்தும் ἵνα-வின் கீழ் இரண்டு இணையான வினைமுற்றுகள் உள்ளன. தமிழில் அவற்றை இயல்பாக இணைக்க ‘…வும் …வும்’ என்ற அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: ῥυσθῶ
  choice: நான் மீட்கப்படவும்
  rationale: ῥύομαι என்பதன் இறந்தகாலச் செயப்பாட்டு வாய்ப்பாட்டு வடிவம். ஆபத்திலிருந்து விடுவிக்கப்படுதல் என்ற பொருளை ‘மீட்கப்படவும்’ தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: கீழ்ப்படியாதவர்களிடமிருந்து
  rationale: ἀπειθέω என்பது கீழ்ப்படியாமையையும் நம்ப மறுப்பதையும் குறிக்கக்கூடும். முதன்மை உரை அதன் விரிவான சொற்பொருளை வைத்திருக்கிறது; நம்பாமை சார்ந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: யூதேயாவில்
  rationale: Ἰουδαία என்ற இடப்பெயரின் வழக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: διακονία
  choice: பணி
  rationale: இங்கு எருசலேமுக்குக் காணிக்கையைக் கொண்டு செல்லும் பவுலின் நடைமுறைச் சேவையைக் குறிக்கிறது. ‘பணி’ என்பது நிறுவனமயமான தனிப்பொருளைச் சேர்க்காமல் சேவையின் விரிவான பொருளைத் தக்கவைக்கிறது.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: எருசலேமுக்கான என் பணி
  rationale: εἰς இங்கு பணியின் இலக்கு அல்லது பயனைச் சுட்டுகிறது. ‘எருசலேமுக்கான’ என்பது தமிழில் இயல்பாக அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: εὐπρόσδεκτος
  choice: ஏற்புடையதாக
  rationale: நன்றாக ஏற்றுக்கொள்ளப்படுதல் அல்லது அங்கீகாரத்துக்கு உரியதாக இருத்தல் என்ற மதிப்பீட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τοῖς ἁγίοις
  choice: பரிசுத்தவான்களுக்கு
  rationale: விசுவாசிகளைக் குறிக்க பவுல் வழக்கமாகப் பயன்படுத்தும் ‘பரிசுத்தமானவர்கள்’ என்ற இறையியல் நிறையுடைய சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: γένηται
  choice: அமையவும்
  rationale: γίνομαι என்பதன் வாய்ப்பாட்டு வடிவம் ‘ஆகுதல்/அமைதல்’ என்ற இயக்கமுள்ள பொருளைக் கொண்டது. ‘ஏற்புடையதாக அமையவும்’ என்பது வெறும் நிலையை அல்ல, எதிர்பார்க்கப்படும் வரவேற்பின் விளைவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யூதேயாவில் இருந்த எதிர்ப்பாளர்களைக் குறிக்கும் ἀπειθούντων என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘கீழ்ப்படியாதவர்கள்’
  alternative: ‘நம்ப மறுப்பவர்கள்’ அல்லது ‘நம்பாதவர்கள்’
  rationale: இந்தப் பங்கேற்புவினை நம்ப மறுப்பதையும் அதனால் வெளிப்படும் கீழ்ப்படியாமையையும் குறிக்கலாம். ஒரு பொருளை மட்டும் இறுதியானதாக நிர்ணயிக்காமல், விரிவான பொருள் முதன்மை உரையிலும் சூழலுக்குரிய மாற்றுப் பொருள் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வேண்டுகோளின் நோக்கத்தைத் தொடரும் துணை வாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘ஊழியம்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘பணி’ தேர்ந்தெடுக்கப்பட்டது; பவுலின் வழக்கமான அழைப்பைத் தக்கவைக்க ‘பரிசுத்தவான்கள்’ பயன்படுத்தப்பட்டது.
