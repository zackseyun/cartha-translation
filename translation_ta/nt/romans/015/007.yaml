source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: ta
  text: ஆகையால், மேசியாவும் உங்களை கடவுளின் மகிமைக்காக ஏற்றுக்கொண்டதுபோல, நீங்களும் ஒருவரையொருவர் ஏற்றுக்கொள்ளுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“கடவுளின் மகிமைக்காக” என்பது முழு அறிவுறுத்தலின் நோக்கமாகவும் புரிந்துகொள்ளப்படலாம்: “நீங்களும் கடவுளின் மகிமைக்காக ஒருவரையொருவர் ஏற்றுக்கொள்ளுங்கள்.”'
    reason: இறுதியிலுள்ள εἰς δόξαν τοῦ θεοῦ தொடர் அருகிலுள்ள ‘ஏற்றுக்கொண்டது’ என்ற வினையுடன் முதன்மையாக இணைகிறது; எனினும் அதன் தொடர்பை முழு அறிவுறுத்தலுக்கும் விரிவாகப் புரிந்துகொள்ளும் சாத்தியம் உள்ளது.
lexical_decisions:
- source_word: Διὸ
  choice: ஆகையால்
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: προσλαμβάνεσθε ... προσελάβετο
  choice: ஏற்றுக்கொள்ளுங்கள் ... ஏற்றுக்கொண்டதுபோல
  rationale: ஒரே கிரேக்க வினையின் இரு வடிவங்களுக்கிடையிலான திட்டமிட்ட ஒப்புமையைப் பாதுகாக்கிறது; இச்சூழலில் சமூகத்துக்குள் மனமுவந்து ஏற்றுக்கொள்வதை உணர்த்துகிறது.
- source_word: ἀλλήλους
  choice: ஒருவரையொருவர்
  rationale: பரஸ்பரச் செயலைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: καθὼς καὶ
  choice: '...போல, ...உம்'
  rationale: ஒப்புமையையும் καί தரும் இணைப்பு வலியுறுத்தலையும் தமிழின் இயல்பான வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ὁ Χριστὸς
  choice: மேசியா
  rationale: இங்கு பெயர்போன்ற வடிவத்தைவிட அபிஷேகம் பெற்ற அரசர்/மீட்பர் என்னும் பட்டப்பொருள் முன்னிலையில் உள்ளது.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: இரண்டாம் நபர் பன்மை நேர்செயப்படுபொருளைத் துல்லியமாகத் தருகிறது.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: இது கடவுளுக்கு மகிமை உண்டாகும்படி இருக்கட்டும்
  rationale: εἰς என்பதன் நோக்கம் அல்லது விளைவு சார்ந்த நுணுக்கத்தை இயல்பான தமிழில் தருகிறது; இறுதித் தொடரின் தொடர்பில் உள்ள உண்மையான இலக்கணத் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: ὁ Χριστός இங்கு பட்டமாகச் செயல்படுவதால் அதன் யூத மெசியானியப் பொருளை வெளிப்படுத்துகிறது; கிறிஸ்தியல் கருத்தை மாற்றுவதில்லை.
- issue: προσλαμβάνομαι என்பதன் சமூகச் சூழல்
  choice: ஏற்றுக்கொள்ளுங்கள்
  alternative: வரவேற்றுக்கொள்ளுங்கள் / சேர்த்துக்கொள்ளுங்கள்
  rationale: ரோமர் 14–15 சூழலில் வேறுபாடுகளைக் கடந்த பரஸ்பர அங்கீகாரத்தையும் உறவுசார் ஏற்பையும் கூறுகிறது; தேவையற்ற குறுகிய கோட்பாட்டுப் பொருளைத் திணிக்கவில்லை.
- issue: εἰς δόξαν τοῦ θεοῦ தொடரின் தொடர்பு
  choice: முழு அறிவுறுத்தலின் நோக்கம் அல்லது விளைவாக முதன்மை உரையில் வெளிப்படுத்தப்பட்டது
  alternative: மேசியா உங்களை ஏற்றுக்கொண்டதன் நோக்கம் அல்லது விளைவுடன் மட்டும் இணைத்தல்
  rationale: கிரேக்கத்தில் இறுதித் தொடர் அருகிலுள்ள வினையுடனும் அல்லது மொத்த அறிவுறுத்தலுடனும் பொருந்தக்கூடும்; முதன்மை வாசிப்பு தமிழில் தெளிவாக இருக்க, மாற்றுச் சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் எளிமையும் கொண்ட பொதுவாசகர் நடைக்கு ஏற்ற வடிவம். ‘ஏற்றுக்கொள்’ என்ற வினை இருமுறையும் பயன்படுத்தப்பட்டு பவுலின் சொல்லிணைப்பு பாதுகாக்கப்பட்டுள்ளது. ‘கடவுள்’ என்பது இயல்பான பொதுத் தமிழ் இறைச்சொல்.
