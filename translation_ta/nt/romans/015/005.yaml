  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: ta
  text: மனவுறுதியையும் ஊக்கத்தையும் அளிக்கும் கடவுள், மெசியாவாகிய இயேசுவுக்கு ஏற்ப[b] நீங்கள் ஒருவருக்கொருவர் ஒரே மனப்பான்மையுடன் இருக்கும்படி[a] அருள்வாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே விதமாகச் சிந்திக்கும்படி” அல்லது “ஒத்த மனமுடையவர்களாக இருக்கும்படி.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “மெசியா இயேசு”; Χριστός என்னும் பட்டப்பெயரின் பொருளை வெளிப்படுத்த “மெசியாவாகிய இயேசு” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: title_rendering
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: கடவுள்
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் முந்தைய கருத்திலிருந்து வேண்டுதலுக்கு நகர்த்துகிறது. தமிழில் தனியாக ஒரு இணைப்புச் சொல்லைச் சேர்க்காமல் இயல்பாக விடப்பட்டுள்ளது.
- source_word: τῆς ὑπομονῆς
  choice: மனவுறுதியை அளிக்கும்
  rationale: ὑπομονή என்பது வெறும் பொறுமையைவிட, அழுத்தத்திலும் துன்பத்திலும் நிலைத்திருக்கும் மனவுறுதியைக் குறிக்கிறது. இறைவனை இந்தப் பண்பின் மூலமாகக் காட்டும் இயல்பான தமிழாக்கம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: τῆς παρακλήσεως
  choice: ஊக்கத்தை அளிக்கும்
  rationale: παράκλησις என்பதற்கு ஊக்கம், ஆறுதல், அறிவுரை ஆகிய பொருள் நிழல்கள் உள்ளன. முந்தைய வசனத்தின் சூழலில் வலுப்படுத்தும் பரந்த பொருளை ‘ஊக்கம்’ நன்றாகத் தருகிறது.
- source_word: δῴη
  choice: அருள்வாராக
  rationale: δίδωμι என்பதன் வேண்டுதல் சார்ந்த optative வடிவத்தைத் தமிழின் மரியாதையான வேண்டுதல் வடிவமான ‘அருள்வாராக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: ஒரே மனப்பான்மையுடன் இருக்க
  rationale: φρονέω சிந்தனை, நோக்கு, மனப்பான்மை ஆகியவற்றைக் குறிக்கிறது. எல்லா விஷயங்களிலும் ஒரே கருத்து வேண்டும் என்று மிகைப்படுத்தாமல், பகிர்ந்த மனநிலையை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: ἐν ἀλλήλοις
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பர உறவுக்குள் இந்த ஒருமனப்பான்மை நிலவ வேண்டும் என்ற சமூகப் பரிமாணத்தை இயல்பான தமிழில் தருகிறது.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: மெசியாவாகிய இயேசுவுக்கு ஏற்ப
  rationale: κατά இங்கு ஒத்திசைவு அல்லது நெறியளிக்கும் அளவுகோலைக் குறிக்கிறது. Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளை ‘மெசியா’ பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός இங்கு வெறும் பெயரின் பகுதியாக மட்டும் இல்லாமல் அபிஷேகம் செய்யப்பட்ட அரசர் என்ற பட்டப்பெயர் சார்ந்த பொருளையும் தக்கவைக்கிறது; எனவே ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது.
- issue: τὸ αὐτὸ φρονεῖν என்பதன் வரம்பு
  choice: ஒரே மனப்பான்மையுடன் இருக்க
  alternative: எல்லாவற்றிலும் ஒரே கருத்தைக் கொண்டிருக்க
  rationale: மூலவாக்கியம் விசுவாசிகளிடையேயான ஒத்த மனநிலையைக் கோருகிறது; ஒவ்வொரு விவகாரத்திலும் முழுமையான கருத்தொற்றுமையைத் தெளிவாகக் கோருவதில்லை. அந்த இறையியல் இழுபறி தீர்மானிக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
- issue: Genitives τῆς ὑπομονῆς καὶ τῆς παρακλήσεως
  choice: மனவுறுதியையும் ஊக்கத்தையும் அளிக்கும் கடவுள்
  alternative: மனவுறுதியின் மற்றும் ஊக்கத்தின் கடவுள்
  rationale: மூலத்தின் genitive அமைப்பு கடவுளை இப்பண்புகளின் மூலமாகச் சுட்டலாம். தமிழில் இயல்பற்ற பெயர்ச்சொல் அடுக்கைத் தவிர்த்து மூல/வழங்குபவர் என்ற பொருள் வெளிப்படுத்தப்பட்டுள்ளது; இதற்கான நேரடி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேண்டுதல் வாக்கியத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘அருள்வாராக’ என்பது வழிபாட்டு மொழியின் மிகை இல்லாமல் optative வேண்டுதலைத் தெளிவாகக் காட்டுகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
