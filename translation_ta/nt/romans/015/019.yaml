reference: Romans 15:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: ta
  text: அடையாளங்கள் மற்றும் அற்புதங்களின் வல்லமையாலும், ஆவியானவரின் வல்லமையாலும்[a], எருசலேமிலிருந்து சுற்றியுள்ள பகுதிகளெங்கும் இல்லிரிக்கம் வரை மெசியாவின் நற்செய்தியை நான் முழுமையாக அறிவித்திருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசுத்த ஆவியானவரின் வல்லமையாலும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘மெசியாவின் நற்செய்தியை நான் நிறைவேற்றியிருக்கிறேன்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: வல்லமையாலும்
  rationale: மீண்டும் வரும் இச்சொற்றொடர் செயலுக்கான வழிமுறையையும் செயலாற்றும் வல்லமையையும் குறிக்கிறது; தமிழில் கருவிப்பொருளை இயல்பாக வெளிப்படுத்த ‘வல்லமையாலும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: σημείων καὶ τεράτων
  choice: அடையாளங்கள் மற்றும் அற்புதங்கள்
  rationale: கடவுளின் செயலை உறுதிப்படுத்தும் அசாதாரண நிகழ்வுகளைக் குறிக்கும் வழக்கமான வேதாகமச் சொற்றொடர்; இரு கூறுகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: πνεύματος
  choice: ஆவியானவர்
  rationale: இச்சூழலில் இது பரிசுத்த ஆவியானவரையே பெரும்பாலும் குறிக்கிறது. எனினும் கிரேக்கத்தில் ‘பரிசுத்த’ என்ற சொல் இல்லாததால் அது முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: எருசலேமிலிருந்து அதைச் சுற்றியுள்ள பகுதிகள் வழியாக
  rationale: κύκλῳ என்பது சுற்றுப்புறப் பிரதேசங்களைக் கடந்து சென்ற விரிவான ஊழியப் பரப்பைக் குறிக்கிறது; சொல்லுக்குச் சொல் மொழிபெயர்ப்பின் தெளிவின்மையைத் தவிர்த்து இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: இல்லிரிக்கம் வரைக்கும்
  rationale: பவுலின் ஊழியம் சென்றடைந்த புவியியல் எல்லையை μέχρι குறிக்கிறது.
- source_word: πεπληρωκέναι
  choice: முழுமையாக அறிவித்திருக்கிறேன்
  rationale: நிறைவுற்ற செயலைக் காட்டும் வினைவடிவம், இச்சூழலில் ஒரு பரப்பெங்கும் நற்செய்தியை முழுமையாக எடுத்துரைத்ததைச் சுட்டுகிறது. நேரடியான ‘நிறைவேற்றியிருக்கிறேன்’ என்பதைக் காட்டிலும் இது நவீன தமிழில் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: மெசியாவின் நற்செய்தி
  rationale: εὐαγγέλιον என்பதற்கு அறிமுகமான ‘நற்செய்தி’ பயன்படுத்தப்பட்டுள்ளது; Χριστός இங்கு பட்டப்பெயராக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டு, கிரேக்க உரையின் உடைமை வேற்றுமை அமைப்பும் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: πνεύματος என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியானவரைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: ‘பரிசுத்த ஆவியானவர்’ அல்லது பொதுவான ‘ஆவி’
  rationale: அடையாளங்கள், அற்புதங்கள் மற்றும் இறை வல்லமையால் நடைபெற்ற அப்போஸ்தல ஊழியம் என்ற சூழல் பரிசுத்த ஆவியானவரைக் குறிக்கிறது. ஆயினும் மூல உரையில் ἁγίου இல்லாததால் ‘பரிசுத்த’ என்பது முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- issue: πεπληρωκέναι τὸ εὐαγγέλιον என்பதன் பொருள்
  choice: நற்செய்தியை முழுமையாக அறிவித்திருக்கிறேன்
  alternative: நற்செய்தியை நிறைவேற்றியிருக்கிறேன்
  rationale: πληρόω என்ற வினை ‘நிறைவு செய்தல்’ என்ற அடிப்படை எண்ணத்தைக் கொண்டிருந்தாலும், நற்செய்தி மற்றும் புவியியல் ஊழியப் பரப்பு என்ற இச்சூழலில் அதை முழுமையாக எடுத்துரைத்தல் அல்லது பரப்புதல் என்பதே இயல்பான பொருள். அதிக நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τοῦ Χριστοῦ என்ற உடைமை வேற்றுமையின் உறவு
  choice: மெசியாவின் நற்செய்தி
  alternative: மெசியாவைப் பற்றிய நற்செய்தி
  rationale: கிரேக்க உடைமை வேற்றுமை நற்செய்தியின் மூலத்தையும் உள்ளடக்கத்தையும் சார்பையும் ஒரே நேரத்தில் அனுமதிக்கிறது. ‘மெசியாவின்’ என்பது அந்தப் பொருள் விரிவைத் தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இல்லிரிக்கம்’ பண்டைய புவியியல் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது; மூலத்தின் மீளுரையான ‘வல்லமை’ இரு இடங்களிலும் பாதுகாக்கப்பட்டுள்ளது.
