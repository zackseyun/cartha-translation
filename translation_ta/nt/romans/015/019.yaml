- from: அடையாளங்கள் மற்றும் அற்புதங்களின் வல்லமையாலும், ஆவியானவரின் வல்லமையாலும்[a], எருசலேமிலிருந்து அதைச் சுற்றியுள்ள பகுதிகள் வழியாக இல்லிரிக்கம் வரைக்கும் மெசியாவின் நற்செய்தியை நான் முழுமையாக அறிவித்திருக்கிறேன்[b].
