reference: Romans 15:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: ta
  text: என் சகோதரர்களே[a], நீங்களே நற்குணம் நிறைந்தவர்களாகவும், எல்லா அறிவாலும் நிறைந்தவர்களாகவும், ஒருவருக்கொருவர் அறிவுறுத்த[b] வல்லவர்களாகவும் இருக்கிறீர்கள் என்று உங்களைக் குறித்து நானே உறுதியாக நம்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பது ἀδελφοί (adelphoi) என்ற கிரேக்கச் சொல்லின் மொழிபெயர்ப்பு; இது ஆண்களையும் பெண்களையும் உள்ளடக்கிய சக விசுவாசிகள் அனைவரையும் கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஒருவருக்கொருவர் புத்திசொல்ல” அல்லது “ஒருவருக்கொருவர் எச்சரிக்க” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: உறுதியாக நம்புகிறேன்
  rationale: முன்னர் ஏற்பட்ட நம்புறுத்தலின் விளைவாகத் தொடரும் உறுதியான மனநிலையை இந்த நிறைவுக்கால வடிவம் காட்டுகிறது; நவீன தமிழில் ‘உறுதியாக நம்புகிறேன்’ என்பது அந்த நிலையான நம்பிக்கையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: அழைப்புவேற்றுமையையும் μου என்பதன் தனிப்பட்ட பாசத்தையும் நேரடியாகப் பாதுகாக்கிறது. கலப்புப் பாலின விசுவாசிகள் அடங்கிய குழுவைக் குறிக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: καὶ αὐτὸς ἐγὼ
  choice: நானும்
  rationale: καί என்பதன் சேர்க்கைப் பொருளையும் பவுலின் தனிப்பட்ட உறுதியையும் இயல்பான தமிழில் தெரிவிக்கிறது; வாக்கியத்தின் இறுதியில் வரும் ‘உறுதியாக’ வலியுறுத்தலை மேலும் தாங்குகிறது.
- source_word: περὶ ὑμῶν
  choice: உங்களைக் குறித்து
  rationale: περί உடன் வரும் தொடர்புப்பொருளைத் தெளிவாகவும் மரியாதையான நவீன தமிழிலும் தருகிறது.
- source_word: καὶ αὐτοὶ
  choice: நீங்களே
  rationale: αὐτοί தரும் வலியுறுத்தலை ‘நீங்களே’ பாதுகாக்கிறது; தமிழில் செயற்கையாகத் தோன்றக்கூடிய ‘நீங்களேகூட’ என்ற வடிவம் தவிர்க்கப்பட்டுள்ளது.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: நற்குணம் நிறைந்தவர்களாக இருக்கிறீர்கள்
  rationale: μεστός என்பதன் ‘நிறைந்த’ பொருளையும் ἀγαθωσύνη என்பதன் ஒழுக்கரீதியான நன்மை அல்லது நல்லியல்பையும் ‘நற்குணம்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: எல்லா அறிவும் நிறைந்தவர்களாக
  rationale: நிறைவுக்காலப் பங்கேற்புவினை காட்டும் தற்போதைய நிறைவு நிலையையும் πάσης γνώσεως என்பதன் விரிந்த பொருளையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: δυνάμενοι
  choice: வல்லவர்களாக
  rationale: முன்னர்க் கூறப்பட்ட நற்குணமும் அறிவும் காரணமாக அவர்களுக்கு உள்ள திறனைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பரச் செயலைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் வடிவம்.
- source_word: νουθετεῖν
  choice: அறிவுறுத்த
  rationale: கற்பித்தல், புத்திசொல்லுதல், திருத்துதல் ஆகியவற்றை உள்ளடக்கக்கூடிய νουθετέω என்பதன் பரந்த பொருளை ‘அறிவுறுத்த’ நன்றாகத் தாங்குகிறது; கூர்மையான மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: கலப்புப் பாலினச் சபைக்கான ἀδελφοί என்ற அழைப்பு
  choice: என் சகோதரர்களே
  alternative: என் சகோதர சகோதரிகளே
  rationale: மூலமொழியின் இலக்கணரீதியான ஆண்பால் பன்மை வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது. அதேவேளை, இச்சொல் பெண்கள் உட்பட சக விசுவாசிகள் அனைவரையும் கூட்டாகக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: νουθετεῖν என்பதன் அறிவுரையும் திருத்தமும் கலந்த நுண்பொருள்
  choice: ஒருவருக்கொருவர் அறிவுறுத்த
  alternative: ஒருவருக்கொருவர் புத்திசொல்ல / எச்சரிக்க
  rationale: பவுல் அவர்களைப் பாராட்டும் சூழலில் ‘அறிவுறுத்த’ என்பது ஆக்கபூர்வமான போதனையையும் தேவையான திருத்தத்தையும் ஒருங்கே தாங்குகிறது. திருத்தம் அல்லது எச்சரிக்கை என்ற கூர்மையான சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியத்தின் தர்க்கத் தொடர்பு தமிழில் இயல்பாக அமைய, பவுலின் உறுதியைக் கூறும் முதன்மை வினை வாக்கிய இறுதியில் வைக்கப்பட்டுள்ளது. ‘நீங்களே’ மூலம் கேட்போர்மீதான வலியுறுத்தலும், இணையான ‘-வர்களாகவும்’ தொடர்கள் மூலம் மூன்று பண்புகளின் ஒத்த அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
