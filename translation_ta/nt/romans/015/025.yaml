revisions:
- from: ஆனால் இப்போது, பரிசுத்தவான்களுக்குப் பணிசெய்வதற்காக நான் எருசலேமுக்குப் போகிறேன்.[a]
  to: இப்போதோ, பரிசுத்தவான்களுக்குச் சேவை செய்துகொண்டு[a] நான் எருசலேமுக்குப் போகிறேன்.
  rationale: The revision retains the mild discourse contrast and present-time emphasis of νυνὶ δέ, renders πορεύομαι directly as an intended/current journey, and preserves διακονῶν as a participial accompaniment rather than making it an explicit purpose. The note provides the contextually likely aid-delivery sense without inserting it into the main text.
