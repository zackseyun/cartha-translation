    reason: διακονῶν என்பதன் ‘சேவை செய்தல்’ என்ற பொருளையும், உடனடியான சூழலில் காணிக்கையை வழங்குவதைக் குறிக்கக்கூடிய சாத்தியமான பொருளையும் தெரிவிக்கிறது.
