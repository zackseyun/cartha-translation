id: ROM.15.25
reference: Romans 15:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: ta
  text: இப்போதோ, பரிசுத்தவான்களுக்குச் சேவை செய்துகொண்டு[a] நான் எருசலேமுக்குப் போகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரிசுத்தவான்களுக்குச் சேவை செய்துகொண்டு” அல்லது “பரிசுத்தவான்களுக்கு உதவி கொண்டு சென்று” என்றும் மொழிபெயர்க்கலாம். இங்கு பவுல் எருசலேமிலுள்ள நம்பிக்கையாளர்களுக்கான காணிக்கையை எடுத்துச் செல்வதைக் குறிப்பதாகத் தெரிகிறது (ரோமர் 15:26 பார்க்கவும்).
    reason: διακονῶν என்பதன் ‘சேவை செய்தல்’ என்ற பொருளையும், உடனடியான சூழலில் காணிக்கையை வழங்குவதைக் குறிக்கக்கூடிய சாத்தியமான பொருளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: ஆனால் இப்போது
  rationale: νυνί நிகழ்காலத்தை வலியுறுத்துகிறது; δέ முந்தைய கருத்திலிருந்து மென்மையான மாறுபாட்டை அல்லது தொடர்ச்சியைச் சுட்டுகிறது. “ஆனால் இப்போது” இரண்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: πορεύομαι
  choice: நான் ... போகிறேன்
  rationale: இங்கு நிகழ்கால வினை, எருசலேமை நோக்கிய பவுலின் தற்போதைய பயணத்தையோ உறுதியான பயண நோக்கத்தையோ நேரடியாகக் குறிக்கிறது.
- source_word: εἰς Ἰερουσαλὴμ
  choice: எருசலேமுக்கு
  rationale: εἰς நகரப்பெயருடன் வரும்போது செல்லும் இலக்கைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: διακονῶν
  choice: பணிசெய்வதற்காக
  rationale: διακονέω நடைமுறைச் சேவை அல்லது உதவியை வழங்குவதைக் குறிக்கலாம். தொடரும் சூழலில் காணிக்கை எடுத்துச் செல்வது குறிக்கப்பட்டாலும், அதை முதன்மை உரையில் மிகையாக வெளிப்படுத்தாமல் சேவைப் பொருளைத் தக்கவைக்கிறது.
- source_word: τοῖς ἁγίοις
  choice: பரிசுத்தவான்களுக்கு
  rationale: பவுலின் பயன்பாட்டில் οἱ ἅγιοι பொதுவாக கிறிஸ்துவை நம்புகிறவர்களைக் குறிக்கிறது. “பரிசுத்தவான்கள்” மூலச்சொல்லின் வடிவத்தையும் திருச்சபைச் சார்ந்த பொருளையும் காக்கும் புரிந்துகொள்ளத்தக்க தமிழ் மரபுச் சொல்.
theological_decisions:
- issue: “பரிசுத்தவான்கள்” என்பதன் குறிப்பு
  choice: முதன்மை உரையில் பொதுவான திருச்சபைச் சொல்லைத் தக்கவைத்து, சூழலின்படி எருசலேமிலுள்ள நம்பிக்கையாளர்களைக் குறிக்க விடுதல்
  alternative: “எருசலேமிலுள்ள ஏழை நம்பிக்கையாளர்கள்” என்று வெளிப்படையாகக் கூறுதல்
  rationale: உடனடியான சூழல், குறிப்பாக ரோமர் 15:26, எருசலேமிலுள்ள பரிசுத்தவான்களில் ஏழைகளுக்கான காணிக்கையைச் சுட்டுகிறது. ஆனால் இவ்வசனம் தானாக அந்த எல்லா விவரங்களையும் வெளிப்படையாகக் கூறாததால், மொழிபெயர்ப்பு மூலத்தின் அளவிலேயே நிற்கிறது.
- issue: διακονῶν என்பதன் சேவைத் தன்மை
  choice: “பணிசெய்வதற்காக”
  alternative: “உதவி கொண்டுசெல்வதற்காக”
  rationale: சூழலில் பொருளுதவி கொண்டுசெல்லுதல் மிகச் சாத்தியமான பொருள். இருப்பினும், பங்கேற்புவினை பொதுவான சேவைப் பொருளையும் தாங்குவதால், அந்த நெகிழ்வை முதன்மை உரையில் காத்து அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. “பரிசுத்தவான்கள்” என்ற மரபுச் சொல் மூலத்தின் திருச்சபைச் சார்ந்த சொல்லாட்சியைப் பாதுகாக்கிறது; “பணிசெய்வதற்காக” என்பது இயல்பான தமிழில் நோக்கம்/சூழ்நிலையை வெளிப்படுத்துகிறது.
