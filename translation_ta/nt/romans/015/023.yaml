  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: ta
  text: ஆனால் இப்போது, இந்தப் பகுதிகளில் இனி எனக்கு இடம் இல்லாததாலும்[a], உங்களிடம் வருவதற்கு பல ஆண்டுகளாக ஏக்கம் கொண்டிருப்பதாலும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தப் பகுதிகளில் இனி எனக்குச் செயல்படுவதற்கான இடமோ வாய்ப்போ இல்லாததாலும்.” இங்குள்ள கிரேக்கச் சொற்றொடர் வெறும் புவியியல் இடத்தைக் குறிக்காமல், அங்கே ஊழியம் செய்வதற்கான பரப்பு இனி மீதியில்லை என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: ஆனால் இப்போது
  rationale: δέ தரும் நிலைமாற்றத்தையும் νυνί தரும் நிகழ்காலக் குறிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μηκέτι
  choice: இனி ... இல்லாததாலும்
  rationale: முன்பு இருந்த நிலை இப்போது தொடரவில்லை என்பதைக் குறிக்கும் கால மறுப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: τόπον ἔχων
  choice: எனக்கு இடம்
  rationale: τόπος என்பதன் ‘இடம்/வாய்ப்பு/செயல்படுவதற்கான பரப்பு’ என்ற உருவகத் திறப்பை ‘இடம்’ தக்கவைக்கிறது; ஊழிய வாய்ப்பு என்ற பொருளை முதன்மை உரையிலேயே முழுமையாக விளக்கிவிடாமல் அடிக்குறிப்பில் தெரிவிக்கிறது.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: இந்தப் பகுதிகளில்
  rationale: κλίματα குறிக்கும் புவியியல் வட்டாரங்களை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ἐπιποθίαν ... ἔχων
  choice: ஏக்கம் கொண்டிருப்பதாலும்
  rationale: ἐπιποθία என்பதன் வலுவான விருப்பத்தை ‘ஏக்கம்’ வெளிப்படுத்துகிறது; தொடரும் வாக்கிய அமைப்புக்கு ஏற்றவாறு பங்கேற்புச் சொல்லின் தொடர்பையும் காக்கிறது.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: உங்களிடம் வரவேண்டும் என்று
  rationale: வருகையை நேரடியாகக் கூறுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘சந்திக்க’ அல்லது ‘வருகை தர’ போன்ற கூடுதல் நுணுக்கங்களைச் சேர்க்கவில்லை.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: பல ஆண்டுகளாக
  rationale: கடந்த பல ஆண்டுகளிலிருந்து நிகழ்காலம் வரை நீடிக்கும் காலத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது.
