source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: ta
  text: நீங்கள் ஒருமனத்துடன், ஒரே வாயால்[a], நம் ஆண்டவரும் மேசியாவுமான இயேசுவின்[b] கடவுளும் தந்தையுமானவரை மகிமைப்படுத்தும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை இயல்பான தமிழில், ‘ஒரே குரலில்’ என்றும் கூறலாம். கிரேக்க மூலம் ‘ஒரே வாயால்’ என்று கூறி, ஒன்றுபட்ட துதியை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'மரபான மொழிபெயர்ப்பு: ‘இயேசு கிறிஸ்து.’ கிரேக்கப் பட்டப்பெயரான Χριστός என்பதன் பொருள் ‘மேசியா.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: …மகிமைப்படுத்தும்படி
  rationale: முந்தைய கருத்திலிருந்து தொடரும் நோக்கம் அல்லது விளைவைத் தமிழில் இயல்பான நோக்கவினை வடிவில் வெளிப்படுத்துகிறது.
- source_word: ὁμοθυμαδόν
  choice: ஒருமனப்பட்டு
  rationale: ஒரே எண்ணமும் நோக்கமும் கொண்ட சமூக ஒற்றுமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν ἑνὶ στόματι
  choice: ஒரே வாயினால்
  rationale: கிரேக்க மூலத்தின் உயிர்ப்பான ‘ஒரே வாய்’ உருவகத்தைத் தக்கவைத்து, ஒன்றுபட்ட துதியை வலியுறுத்துகிறது.
- source_word: δοξάζητε
  choice: மகிமைப்படுத்தும்படி
  rationale: வழிபாட்டுச் சூழலுக்குப் பொருத்தமான, தற்போதைய தமிழிலும் பரவலாகப் புரியும் சொல்லாக்கம்.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: கடவுளும் தந்தையுமானவரை
  rationale: ஒரே சுட்டுச் சொல் இரு பெயர்ச்சொற்களையும் ஆளுவதால், இரண்டு தனித்தனி நபர்கள் என்று தோன்றாதவாறு ஒரே நபரைக் குறிக்கும் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τοῦ κυρίου ἡμῶν
  choice: நம் ஆண்டவரும்
  rationale: κύριος என்பதற்கு மரியாதையும் வேதாகமப் பயன்பாட்டுத் தொடர்ச்சியும் கொண்ட ‘ஆண்டவர்’ பயன்படுத்தப்பட்டு, ‘நம்’ என்பதும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மேசியாவுமான இயேசுவின்
  rationale: Χριστός என்பதை பெயராக ஒலிபெயர்க்காமல் அதன் பட்டப்பெயர் பொருளான ‘மேசியா’ என்று மொழிபெயர்க்கிறது; தமிழில் இயல்பாக அமைய இணைப்புப் பெயரெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστός-ஐ எவ்வாறு வழங்குவது
  choice: மேசியாவுமான இயேசு
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός இங்கு இயேசுவின் மேசியப் பட்டத்தைக் குறிக்கிறது. எனவே அதன் பொருளை வெளிப்படையாகத் தரும் ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது; தமிழின் இயல்புக்காக ‘மேசியாவுமான இயேசு’ என்று அமைக்கப்பட்டது.
- issue: τὸν θεὸν καὶ πατέρα ஒருவரையா இருவரையா குறிக்கிறது
  choice: கடவுளும் தந்தையுமானவர்
  alternative: கடவுளையும் தந்தையையும்
  rationale: கிரேக்கத்தில் ஒரே கட்டுரை இரு பெயர்ச்சொற்களையும் இணைப்பதால், இரண்டும் ஒரே நபரைக் குறிக்கும் நெருங்கிய இணைப்பைத் தமிழ் வடிவம் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஒரே வாயினால்’ என்ற மூல உருவகம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது; ‘ஒருமனப்பட்டு’ அதனுடன் இயல்பாக இணைக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
