source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: ta
  text: 'சகோதரர்களே[a], நம் ஆண்டவராகிய இயேசு மெசியாவினாலும்[b], ஆவியானவரின் அன்பினாலும்[c] உங்களை வேண்டிக்கொள்கிறேன்: எனக்காகக் கடவுளிடம் செய்யும் மன்றாட்டுகளில் என்னோடு இணைந்து பாடுபடுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களே’ என்பது கிரேக்கத்தில் இலக்கணப்படி ஆண்பால் வடிவம்; இது சகோதரர்களும் சகோதரிகளுமாகிய முழு விசுவாசக் குழுவையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘கிறிஸ்து’. கிரேக்கச் சொல்லான Christos என்பது ‘அபிஷேகம் செய்யப்பட்டவர்’ அல்லது ‘மெசியா’ என்று பொருள்படும் பட்டம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது ‘ஆவியானவர் உண்டாக்கும் அன்பினாலும்’. கிரேக்க உடைமைத் தொடர்பை ஆவியானவருடைய அன்பு அல்லது அவரால் உண்டாகும் அன்பு என ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: வேண்டிக்கொள்கிறேன்
  rationale: இங்கு வினைச்சொல் சாதாரண வேண்டுகோளைவிட வலுவான, உருக்கமான அழைப்பைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது வலுவான முரண்பாட்டை அல்ல, உரையின் நகர்வைச் சுட்டுகிறது; தமிழில் தனி இணைப்புச்சொல் சேர்க்காமலேயே இந்நகர்வு இயல்பாக உள்ளது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க ஆண்பால் பன்மை அழைப்பின் வடிவத்தைப் பாதுகாக்கிறது; முழு விசுவாசக் குழுவையும் உள்ளடக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: நம் ஆண்டவராகிய இயேசு மெசியாவின் பெயராலும்
  rationale: διά இங்கு வேண்டுகோளின் அடிப்படை அல்லது ஆதாரத்தைக் காட்டுகிறது. தமிழில் ‘பெயராலும்’ என்பது அந்த வேண்டுகோள் ஆண்டவர் இயேசு மெசியாவை முன்னிறுத்திச் செய்யப்படுவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀγάπης τοῦ πνεύματος
  choice: ஆவியானவரின் அன்பினாலும்
  rationale: ἀγάπη ‘அன்பு’ எனவும், πνεῦμα பரிசுத்த ஆவியானவரைக் குறிக்கும் வகையில் மரியாதை வடிவிலும் வழங்கப்படுகிறது; உடைமைத் தொடர்பின் பொருள் திட்டமிட்டு தெளிவுபடுத்தப்படாமல் வைக்கப்படுகிறது.
- source_word: συναγωνίσασθαί μοι
  choice: என்னோடு சேர்ந்து போராடுங்கள்
  rationale: συν- என்பதன் கூட்டுச் செயலும் ἀγωνίζομαι என்பதன் தீவிரப் போராட்ட உணர்வும் இரண்டையும் பாதுகாக்கிறது.
- source_word: ἐν ταῖς προσευχαῖς
  choice: செய்யும் மன்றாட்டுகளில்
  rationale: பன்மை வடிவத்தையும் ஜெப முயற்சியின் தீவிரத்தையும் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘உங்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: எனக்காகக் கடவுளிடம்
  rationale: ὑπέρ பவுலுக்காகச் செய்யப்படும் பரிந்துரையையும் πρός மன்றாட்டுகள் கடவுளை நோக்கியிருப்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: τοῦ πνεύματος என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியானவர்
  alternative: மனித ஆவி அல்லது தனிப்பட்டவரல்லாத ஆவிக்குரிய கருத்து
  rationale: பவுலின் பயன்பாட்டிலும் இச்சூழலிலும் பரிசுத்த ஆவியானவரே மிக இயல்பான குறிப்பு; எனினும் அன்பு ஆவியானவருடையதா அல்லது அவரால் உருவாக்கப்படுவதா என்ற உறவு தீர்மானிக்கப்படவில்லை.
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός இங்கு ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டமாக வருகிறது; பழக்கமான மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀδελφοί என்பதன் சமூகப் பரப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது; முழுச் சபையையும் உள்ளடக்கக்கூடிய பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘மன்றாட்டுகள்’ ஜெபத்தைக் குறிப்பதுடன், ‘போராடுங்கள்’ கூட்டு ஆன்மிக முயற்சியின் தீவிரத்தையும் தக்கவைக்கிறது.
