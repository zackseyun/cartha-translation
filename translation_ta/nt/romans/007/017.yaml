id: ROM.7.17
reference: Romans 7:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: ta
  text: ஆனால் இப்போது, அதைச் செய்பவன் இனி நான் அல்ல; எனக்குள் குடியிருக்கும் பாவமே அதைச் செய்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இனி அதைச் செய்வது நான் அல்ல; எனக்குள் குடியிருக்கும் பாவமே.”
    reason: கிரேக்க வாக்கியத்தின் சுருக்கமான இணை அமைப்பை இன்னும் நெருக்கமாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: ஆனால் இப்போது
  rationale: முந்தைய வாதத்துடன் உள்ள கால மற்றும் கருத்து மாறுபாட்டை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: οὐκέτι
  choice: இனி ... அல்ல
  rationale: முன்னிருந்த நிலையிலிருந்து விலகுதலைத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἐγὼ
  choice: செய்பவன் ... நான்
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் வலியுறுத்தலுடனும் வரும் ‘நான்’ என்பதை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: κατεργάζομαι αὐτὸ
  choice: அதைச் செய்பவன்
  rationale: முன்னர் குறிப்பிடப்பட்ட செயலைச் செய்துமுடிப்பதைக் குறிக்கும் வினையின் பொருளை எளிமையாகவும் சூழலுக்கேற்றவாறும் தருகிறது.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: எனக்குள் குடியிருக்கும் பாவம்
  rationale: பாவத்தை ஒருவரைப் போல் சித்தரிக்கும் பவுலின் உருவகத்தையும், οἰκοῦσα என்பதிலுள்ள ‘குடியிருத்தல்’ என்ற வலுவான படிமத்தையும் காக்கிறது.
theological_decisions:
- issue: ‘நான்’ என்பதற்கும் ‘எனக்குள் குடியிருக்கும் பாவம்’ என்பதற்கும் இடையிலான கூர்மையான வேறுபாடு பொறுப்பைத் தவிர்ப்பதாகப் புரிந்துகொள்ளப்படலாம்.
  choice: மூலத்தில் உள்ள வேறுபாட்டையும் இறையியல் பதற்றத்தையும் விளக்கிச் சமன்படுத்தாமல் அப்படியே தக்கவைத்தல்.
  alternative: இது உள்ளார்ந்த போராட்டத்தை மட்டுமே குறிக்கிறது என்று விளக்கமாகப் பொழிப்புரை செய்தல்.
  rationale: வசனம் செயற்பாட்டாளரைப் பற்றிய வேறுபாட்டைத் திட்டவட்டமாக முன்வைக்கிறது; மொழிபெயர்ப்பு அந்தத் தெளிவின்மையையும் பதற்றத்தையும் அமைதியாகத் தீர்த்துவிடக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘வாழும்’ என்பதற்குப் பதிலாக ‘குடியிருக்கும்’ என்பது மூல உருவகத்தைத் தக்கவைக்கிறது; முதன்மை உரையில் தமிழுக்குத் தேவையான ‘அதைச் செய்கிறது’ மீண்டும் சேர்க்கப்பட்டுள்ளது.
