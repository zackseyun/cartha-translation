id: ROM.7.7
reference: Romans 7:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: ta
  text: அப்படியானால் நாம் என்ன சொல்வோம்? திருச்சட்டமே பாவமா? ஒருபோதும் இல்லை! மாறாக, திருச்சட்டத்தின் மூலமாக அல்லாமல் பாவத்தை நான் அறிந்திருக்க மாட்டேன். ஏனெனில், திருச்சட்டம், “இச்சிக்காதே” என்று சொல்லியிருக்காவிட்டால், இச்சை[a] என்னவென்று நான் அறிந்திருக்க மாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இச்சை” என்பதற்கு “பேராசை” அல்லது “பிறருக்குரியதை விரும்புதல்” என்றும் மொழிபெயர்க்கலாம். இங்கு உடனடியாக மேற்கோள் காட்டப்படும் கட்டளை, பிறருக்குரியதைத் தனக்கென விரும்பும் குறிப்பிட்ட பொருளைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: அப்படியானால் நாம் என்ன சொல்வோம்?
  rationale: பவுலின் வாத நகர்வைக் குறிக்கும் வினாவை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: ὁ νόμος
  choice: திருச்சட்டம்
  rationale: இச்சூழலில் மோசேயின் சட்டத்தைக் குறிப்பதால், தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் தெளிவானதும் மரியாதைமிக்கதுமான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἁμαρτία
  choice: பாவம்
  rationale: மூலத்தின் இறையியல் பொருளையும், சட்டத்தையே பாவத்துடன் அடையாளப்படுத்துகிறதா என்ற கூர்மையான வினாவையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: μὴ γένοιτο
  choice: ஒருபோதும் இல்லை!
  rationale: சாதாரண மறுப்பைவிட வலுவான பவுலின் அதிரடியான நிராகரிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: முந்தைய கருத்தைத் தீவிரமாக மறுத்த பின் வரும் எதிர்மறைத் திருப்பத்தைத் தெளிவுபடுத்துகிறது.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: திருச்சட்டத்தின் மூலமாகத்தான் பாவம் என்னவென்று நான் அறிந்தேன்
  rationale: சட்டம் பாவத்தை உண்டாக்கியது என்று கூறாமல், அதன் வழியாகப் பாவம் அறியப்பட்டது என்ற கருவிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπιθυμίαν
  choice: அத்தகைய இச்சை
  rationale: ἐπιθυμία என்பதன் பரந்த ‘இச்சை’ பொருளைத் தக்கவைத்தபடியே, உடனுள்ள பத்துக் கட்டளையின் மேற்கோள் சுட்டும் பிறருக்குரியதை விரும்பும் குறிப்பிட்ட பொருளுடன் இணைக்கிறது.
- source_word: οὐκ ᾔδειν
  choice: நான் அறிந்திருக்க மாட்டேன்
  rationale: முந்தைய அறிதல் கருத்துடன் தமிழில் இயல்பான இணைநிலையைத் தருகிறது; கிரேக்கத்தில் வேறு வினைச்சொல் இருப்பினும் பொருள் வேறுபாட்டை மிகைப்படுத்தவில்லை.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: பிறருக்குரியதை இச்சிக்காதே
  rationale: மேற்கோள் காட்டப்படும் கட்டளையின் சூழலில் ἐπιθυμέω என்பது பிறருடையதைத் தனக்கென விரும்புதலைக் குறிக்கிறது; வெறும் எல்லா ஆசையையும் தடை செய்வதாகப் புரியாதபடி பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: திருச்சட்டத்துக்கும் பாவத்துக்கும் உள்ள உறவு
  choice: திருச்சட்டமே பாவமா? ஒருபோதும் இல்லை!
  alternative: திருச்சட்டம் பாவமானதா?
  rationale: கிரேக்கத்தில் ‘பாவம்’ என்பது பெயர்ச்சொல் பயனிலை; சட்டம் பாவத்தன்மையுடையதா என்பதைக் காட்டிலும், சட்டமே பாவமா என அடையாளப்படுத்தும் கூர்மையான கேள்வியை இது பாதுகாக்கிறது.
- issue: சட்டத்தின் மூலம் பாவத்தை அறிதல்
  choice: திருச்சட்டத்தின் மூலமாகத்தான் பாவம் என்னவென்று நான் அறிந்தேன்
  alternative: திருச்சட்டம் இல்லாவிட்டால் பாவத்தை நான் அறிந்திருக்க மாட்டேன்
  rationale: இரண்டுமே சாத்தியமான தமிழாக்கங்கள்; தேர்ந்த வடிவம் διὰ νόμου என்ற ‘சட்டத்தின் மூலம்’ என்னும் வலியுறுத்தலை முன்வைத்து, சட்டம் பாவத்தின் காரணம் என்ற தவறான முடிவைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. பவுலின் வினா–மறுப்பு–விளக்கம் என்ற வாத ஓட்டம் பாதுகாக்கப்பட்டுள்ளது; கட்டளை மேற்கோளில் பழமையான எதிர்கால வடிவுக்குப் பதிலாக இயல்பான தடை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
