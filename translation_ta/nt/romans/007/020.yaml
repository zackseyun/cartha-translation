id: ROM.7.20
reference: Romans 7:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: ta
  text: ஆனால் நான் விரும்பாததையே செய்கிறேன் என்றால், அதைச் செய்வது இனி நான் அல்ல; எனக்குள் குடியிருக்கும் பாவமே அதைச் செய்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: ஆனால் … என்றால்
  rationale: முந்தைய வாதத்தை நிபந்தனையாகத் தொடரும் மென்மையான எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: நான் விரும்பாததையே செய்கிறேன்
  rationale: உறவுப்பெயர்–சுட்டுப்பெயர் அமைப்பின் வலியுறுத்தலை ‘-அதையே’ என்பதால் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: அதைச் செய்வது இனி நான் அல்ல
  rationale: οὐκέτι என்பதன் ‘இனி அல்ல’ என்ற பொருளையும், வெளிப்படையாக உள்ள ἐγώ தரும் ‘நான்’ என்ற அழுத்தத்தையும் காக்கிறது. இச்சூழலில் κατεργάζομαι என்பதற்கு ‘செய்வது’ இயல்பான தமிழ்; வேறு வினைச்சொல் கொண்டு தேவையற்ற பொருள் வேறுபாடு உருவாக்கப்படவில்லை.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: எனக்குள் குடியிருக்கும் பாவமே
  rationale: οἰκοῦσα என்பதன் தொடர்ந்து உள்ளே வசிக்கும் உருவகத்தையும், ἁμαρτία என்பதை ‘பாவம்’ என்றே கூறும் மூலத்தின் நேரடித் தன்மையையும் காக்கிறது. ‘-மே’ என்பது ‘நான் அல்ல … பாவம்’ என்ற முரண்பாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘நான்’ என்பதற்கும் ‘எனக்குள் குடியிருக்கும் பாவம்’ என்பதற்கும் இடையிலான பவுலின் வேறுபாடு தனிப்பட்ட பொறுப்பைக் குறைக்கிறதா என்பதைக் மொழிபெயர்ப்பிலேயே தீர்மானித்தல்
  choice: ‘அதைச் செய்வது இனி நான் அல்ல; எனக்குள் குடியிருக்கும் பாவமே அதைச் செய்கிறது’ என்று பதற்றத்தை அப்படியே வைத்தல்
  alternative: ‘என் பாவ இயல்புதான் என்னை அப்படிச் செய்ய வைக்கிறது’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலம் ἁμαρτία (‘பாவம்’) என்றே கூறுகிறது; ‘பாவ இயல்பு’ என்ற விளக்கத்தையோ, பொறுப்பை மென்மைப்படுத்தும் காரணவுரை ஒன்றையோ சேர்ப்பதில்லை. ஆகவே பவுலின் திட்டமிட்ட முரண்பாடு தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருக்கும்’ என்பது பவுலின் உருவகத்தைத் தெளிவாகக் காக்கிறது; இறுதியில் ‘அதைச் செய்கிறது’ என்று மீண்டும் கூறுவது தமிழில் வாக்கியத்தை முழுமையாக்கி, பாவத்தைச் செயற்படும் சக்தியாக வர்ணிக்கும் மூலத்தின் நபராக்கத்தையும் பாதுகாக்கிறது.
