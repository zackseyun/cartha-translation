id: ROM.7.6
reference: Romans 7:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: ta
  text: ஆனால் இப்போது, நாம் கட்டுண்டிருந்ததற்கு இறந்ததால், சட்டத்திலிருந்து விடுவிக்கப்பட்டிருக்கிறோம். இதனால், எழுத்தின் பழைமையில் அல்லாமல், ஆவியின் புதுமையில் நாம் சேவை செய்கிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆவி’ என்பது இங்கு பரிசுத்த ஆவியானவரைக் குறிக்கலாம்; அல்லது பொதுவாக ஆவியைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: திருச்சட்டத்திலிருந்து விடுவிக்கப்பட்டிருக்கிறோம்
  rationale: செயப்பாட்டு வடிவம், திருச்சட்டமே இல்லாமற்போனது என்று கூறாமல், அதன் கட்டுப்பாட்டிலிருந்து விசுவாசிகள் விடுவிக்கப்பட்டிருப்பதைக் குறிக்கிறது. νόμος இங்கு மோசேயின் சட்டத்தைக் குறிப்பதால், இயல்பான நவீனத் தமிழில் ‘திருச்சட்டம்’ என வழங்கப்பட்டுள்ளது.
- source_word: ἀποθανόντες ἐν ᾧ κατειχόμεθα
  choice: நம்மைப் பிடித்து வைத்திருந்ததற்கு நாம் இறந்ததால்
  rationale: ἀποθανόντες என்பதன் எழுவாய் ‘நாம்’; இறந்தது திருச்சட்டம் அல்ல என்பதை இவ்வடிவம் தெளிவாகக் காக்கிறது. ἐν ᾧ என்பதில் உள்ள தொடர்பு இயல்பான தமிழில் ‘எதற்கு’ என்ற பொருளில் வழங்கப்படுகிறது; κατειχόμεθα-வின் கட்டுண்டிருந்த நிலையும் ‘பிடித்து வைத்திருந்தது’ என்பதில் நிலைக்கிறது.
- source_word: δουλεύειν
  choice: பணிசெய்கிறோம்
  rationale: அடிமையாகச் சேவை செய்தல் என்ற பின்னணி இருந்தாலும், இவ்விடத்தில் சேவையின் புதிய முறையே முதன்மை. ‘பணிசெய்கிறோம்’ என்பது இயல்பாகவும் நோக்கத்தைத் தெளிவாகவும் தருகிறது.
- source_word: καινότητι πνεύματος
  choice: ஆவியானவரின் புதுமையில்
  rationale: καινότης என்ற கருத்துப்பெயரையும் παλαιότης உடனான சொல்லமைப்பு எதிரிணையையும் காக்க ‘புதுமை’ பயன்படுத்தப்பட்டுள்ளது. பவுலின் ஆவி–எழுத்து எதிர்மறை அமைப்பின் அடிப்படையில் πνεῦμα பரிசுத்த ஆவியானவரைக் குறிப்பதாக முதன்மை உரையில் எடுக்கப்பட்டுள்ளது.
- source_word: παλαιότητι γράμματος
  choice: எழுத்தின் பழைமையில்
  rationale: கிரேக்கத்தின் கருத்துப்பெயர் எதிரிணையைத் தக்கவைக்க ‘பழைமை’ என்றும், பவுலின் சுருக்கமான உருவகச் சொல்லை விளக்கவுரையாக்காமல் காக்க γράμμα-வை ‘எழுத்து’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறந்தது திருச்சட்டமா, அல்லது விசுவாசிகளா?
  choice: '‘நாம்’ இறந்தோம்: ‘நம்மைப் பிடித்து வைத்திருந்ததற்கு நாம் இறந்ததால்.’'
  alternative: திருச்சட்டம் நம்மைப் பொறுத்தவரை இறந்தது.
  rationale: ἀποθανόντες என்பது எழுவாய் வேற்றுமை பன்மையில் இருந்து மறைந்துள்ள ‘நாம்’ என்ற எழுவாயைக் குறிக்கிறது. ஆகவே இறந்தவர்கள் விசுவாசிகளே என்பதைக் கிரேக்க இலக்கணத்தின்படி முதன்மை உரை காக்கிறது.
- issue: πνεύματος என்பது பரிசுத்த ஆவியானவரையா அல்லது மனித ஆவியையா குறிக்கிறது?
  choice: ‘ஆவியானவர்’
  alternative: ‘ஆவி’ அல்லது ‘ஆவியின் புதுமை’
  rationale: பவுலின் எழுத்து–ஆவி எதிரிணையும் புதிய உடன்படிக்கைச் சூழலும் பரிசுத்த ஆவியானவரைக் குறிக்கும் வாசிப்பை வலுப்படுத்துகின்றன. இருப்பினும் கிரேக்கத்தில் இச்சொல் இலக்கணரீதியாகத் தீர்மானமற்றதால் மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மதிப்புமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘புதுமை/பழைமை’ என்ற இணை கிரேக்கத்தின் சொற்பொழிவு சமச்சீரைக் காக்கிறது. ஒரே அடிக்குறிப்பு குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
