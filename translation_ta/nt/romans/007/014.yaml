revisions:
- from: ஏனெனில், சட்டம் ஆவிக்குரியது என்பதை நாம் அறிந்திருக்கிறோம். ஆனால் நானோ சதைக்குரியவன்[a]; பாவத்திற்குக் கீழ் விற்கப்பட்டவன்[b].
  to: ஏனெனில், சட்டம் ஆவிக்குரியது என்பதை நாம் அறிவோம்; ஆனால் நானோ சதையாலானவன்[a], பாவத்திற்குக் கீழ் விற்கப்பட்டவன்[b].
  rationale: The revision changes only the rendering of σάρκινος and its corresponding lexical alternative. It retains the source’s compact contrast, the sale/slavery metaphor, and the unexpanded ‘under sin’ expression in the main text; the explanatory force of the latter remains in the footnote.
