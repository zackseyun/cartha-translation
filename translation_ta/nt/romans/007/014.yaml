source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: ta
  text: ஏனெனில், சட்டம் ஆவிக்குரியது என்பதை நாம் அறிவோம்; ஆனால் நானோ சதையாலானவன்[a], பாவத்திற்குக் கீழ் விற்கப்பட்டவன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சதைக்குரியவன்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பாவத்திற்குக் கீழ் அடிமையாக விற்கப்பட்டவன்’; அதாவது, பாவத்தின் அதிகாரத்திற்குக் கீழ்ப்பட்டவன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: நாம் அறிந்திருக்கிறோம்
  rationale: பவுலுக்கும் வாசகர்களுக்கும் பொதுவான, நிலைபெற்ற அறிவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὁ νόμος
  choice: சட்டம்
  rationale: கிரேக்கச் சொல்லின் பொதுவான வடிவத்தைப் பேணுகிறது; உடனடி உரையிலேயே ‘மோசேயின் திருச்சட்டம்’ என்று வெளிப்படையாகக் குறிப்பிடாததால் அதனை மொழிபெயர்ப்பில் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: πνευματικός
  choice: ஆவிக்குரியது
  rationale: சட்டம் ஆவியின் வட்டாரத்தையும் இயல்பையும் சார்ந்தது என்ற பொருளைத் தருகிறது; ‘ஆவியால் உண்டானது’ என்று காரண உறவை மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: σάρκινός
  choice: சதைக்குரியவன்
  rationale: πνευματικός என்பதோடு உள்ள நேரடியான முரண்பாட்டைப் பேணுகிறது; ‘பாவ இயல்புள்ளவன்’ போன்ற விளக்கவுரையை மூலத்தில் இல்லாமல் சேர்ப்பதில்லை.
- source_word: πεπραμένος
  choice: விற்கப்பட்டவன்
  rationale: முற்றுப்பெற்ற செயப்படுவினைப் பங்கேற்பெயர் காட்டும் தற்போதைய நிலையைச் சுருக்கமாகப் பேணி, விற்பனை அல்லது அடிமைத்தன உருவகத்தைத் தக்கவைக்கிறது.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: பாவத்திற்குக் கீழ்
  rationale: பாவத்தின் ஆதிக்கத்திற்குட்பட்ட நிலையை கிரேக்கத்தின் செறிவான சொல்லமைப்புக்கு நெருக்கமாகக் கூறுகிறது; ‘பாவத்தின் அதிகாரத்திற்குக் கீழ்’ என்ற விரிவான விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: பவுலின் ‘சதை’ மொழியை எவ்வளவு விளக்கமாக மொழிபெயர்ப்பது
  choice: ‘சதைக்குரியவன்’ என்று முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘பாவ இயல்புள்ளவன்’ அல்லது ‘ஆவிக்குரியவன் அல்லாதவன்’
  rationale: இந்த இடத்தில் ‘சதை’ சார்ந்த கிரேக்கச் சொல்லைத் தக்கவைப்பது ‘ஆவிக்குரியது’ என்பதுடனான முரண்பாட்டைப் பாதுகாக்கிறது; பவுலின் மனித இயல்பு பற்றிய மொழியைப் பிற்கால இறையியல் சூத்திரமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- issue: ‘விற்கப்பட்டவன்’ என்ற உருவகத்தின் வலிமை
  choice: உருவகத்தை முதன்மை உரையில் சுருக்கமாகப் பேணி, அடிமைத்தன நுண்பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘பாவத்தின் அதிகாரத்துக்கு அடிமையாக விற்கப்பட்டவன்’ என்று முதன்மை உரையிலேயே விரிவாக்குதல்
  rationale: மூலத்தின் செறிவையும் பாவத்திற்குக் கீழ்ப்பட்டிருக்கும் இறையியல் அழுத்தத்தையும் ஒருங்கே காக்கிறது; உருவகத்தை மறைக்காமல் அதன் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘சட்டம்’, ‘ஆவிக்குரியது’, ‘சதைக்குரியவன்’ ஆகிய இணைகள் மூலத்தின் சுருக்கத்தையும் எதிர்மறை ஒப்புமையையும் பேணுகின்றன.
