base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: ta
  text: நானோ இறந்தேன்; வாழ்வுக்கான இந்தக் கட்டளை எனக்கு மரணத்துக்கானதாக அமைந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாழ்வுக்கான இந்தக் கட்டளையே எனக்கு மரணத்துக்கே வழிவகுப்பதாகத் தெரியவந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανον
  choice: இறந்தேன்
  rationale: இறந்தகால நிகழ்வை நேரடியாகக் கூறும் முதலாம் நபர் ஒருமை வினையாக இருப்பதால், எளிமையாகவும் தெளிவாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: εὑρέθη μοι
  choice: எனக்கு ... அமைந்தது
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்ப்பான ‘என்னால் கண்டறியப்பட்டது’ என்பதைத் தவிர்த்து, அனுபவத்தில் அதன் விளைவு அவ்வாறு தெரியவந்தது என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἡ ἐντολή
  choice: அந்தக் கட்டளை
  rationale: ஒருமையில் உள்ள சட்டக் கட்டளையைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘திருச்சட்டத்தின்’ போன்ற விளக்கச் சொல் சேர்க்கப்படவில்லை.
- source_word: ἡ εἰς ζωὴν
  choice: வாழ்வுக்கான
  rationale: εἰς என்பதன் நோக்கம் அல்லது விளைவு சார்ந்த திறந்த பொருளைச் சுருக்கமாகக் காக்கிறது; ‘வாழ்வைக் கொடுக்க வேண்டிய’ என்று நோக்கத்தை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: αὕτη
  choice: அந்தக் கட்டளை
  rationale: முன்னரே குறிப்பிடப்பட்ட கட்டளையைச் சுட்டும் demonstrative வலிமையைத் தமிழில் ‘அந்த’ என்பதால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς θάνατον
  choice: மரணத்துக்கானதாக
  rationale: முந்தைய ‘வாழ்வுக்கான’ என்பதுடன் உள்ள மூலமொழியின் இணையான அமைப்பையும் வாழ்வு–மரணம் முரண்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: கட்டளை மரணத்தை எவ்வாறு சார்ந்தது என்பதை காரணவியல் விளக்கமாகச் சொல்லலாமா
  choice: ‘எனக்கு மரணத்துக்கானதாக அமைந்தது’ என்ற நடுநிலையான வடிவம்
  alternative: ‘எனக்கு மரணத்தைக் கொண்டுவந்தது’
  rationale: கட்டளையே நேரடியாக மரணத்தை உண்டாக்கியது என்று மூலத்தைவிட அதிகமாக காரணத்தை விளக்காமல், பவுலின் அனுபவத்தில் தெரியவந்த முடிவையும் மூலத்தின் இறையியல் இழுபறியையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘வாழ்வுக்கான / மரணத்துக்கான’ என்ற இணை அமைப்பு கிரேக்கத்தின் சொற்பொழிவு முரண்பாட்டைத் தக்கவைக்கிறது; ஒரே மாற்று வாசிப்பு அடிக்குறிப்பில் கொடுக்கப்பட்டுள்ளது.
