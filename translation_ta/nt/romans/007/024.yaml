  rationale: Changed only the rendering of ταλαίπωρος from “பரிதாபத்துக்குரிய” to “அவலமான,” which better represents the Greek speaker’s wretched and afflicted condition in natural modern Tamil. The difficult final phrase, its ambiguity, both footnote anchors, and the lexical alternatives are retained.
