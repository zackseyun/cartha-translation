  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: ta
  text: எவ்வளவு அவலமான மனிதன் நான்! இந்த மரண உடலிலிருந்து என்னை மீட்பவர் யார்?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு சொல் மொழிபெயர்த்தால், “இந்த மரணத்தின் உடலிலிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னை விடுவிப்பவர் யார்?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: பரிதாபத்துக்குரிய
  rationale: கடும் துயரத்தையும் அவல நிலையையும் வெளிப்படுத்தும் சொல்லாக, பவுலின் வேதனை நிறைந்த கூக்குரலின் உணர்ச்சி வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐγὼ ἄνθρωπος
  choice: நான் ... மனிதன்
  rationale: பேசுகிறவர் தம்மையே ஆண்பால் ஒருமையில் குறிப்பிடுவதைக் காத்து, தமிழில் இயல்பாக அமைக்கிறது.
- source_word: τίς
  choice: யார்
  rationale: விடுவிக்கக்கூடிய ஒருவரைப் பற்றிய தனிநபர் வினாவை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ῥύσεται
  choice: மீட்பவர்
  rationale: ஆபத்து அல்லது அடிமைத்தன நிலையிலிருந்து காப்பாற்றி வெளியே கொண்டுவரும் வினையின் வலிமையைத் தெளிவாகக் காட்டுகிறது; ‘விடுவிப்பவர்’ என்பதும் சாத்தியமான மாற்று.
- source_word: ἐκ
  choice: இலிருந்து
  rationale: பிரிவு அல்லது வெளியேற்றத்தின் பொருளைத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: σώματος
  choice: உடல்
  rationale: மூலத்தின் திடமான உடல் உருவகத்தை மங்கச் செய்யாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: τοῦ θανάτου τούτου
  choice: இந்த மரண உடல்
  rationale: சொல்லுக்கு சொல் அமைப்பான ‘இந்த மரணத்தின் உடல்’ தமிழில் கடினமாக இருப்பதால், சுட்டுப்பொருளையும் மரணத்தோடு உடலுக்குள்ள தொடர்பையும் காத்து இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: இறுதிச் சொற்றொடரைச் சொல்லுக்கு சொல் மொழிபெயர்ப்பதா அல்லது தமிழில் இயல்பாக அமைப்பதா
  choice: இந்த மரண உடலிலிருந்து
  alternative: இந்த மரணத்தின் உடலிலிருந்து
  rationale: இயல்பான வடிவம் மூலத்தின் உடல்–மரணம் உருவகத்தையும் வேதனை நிறைந்த வினாவின் வலிமையையும் காக்கிறது; அதேவேளை அந்த உடல் எவ்வகையில் மரணத்துடன் தொடர்புடையது என்பதை விளக்கி இறையியல் பதற்றத்தைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பவுலின் வேதனை நிறைந்த திடீர் கூக்குரலுக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘பரிதாபத்துக்குரிய’ என்பது தன்னை இரங்கும் மென்மையான தொனியல்ல; கடும் அவலத்தில் இருப்பதைக் குறிக்கிறது. இரு அடிக்குறிப்பு குறிகளும் அவற்றுக்குரிய இடத்தில் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
