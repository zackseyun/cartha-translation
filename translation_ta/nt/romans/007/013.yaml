id: ROM.7.13
reference: Romans 7:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: ta
  text: அப்படியானால், நன்மையானது எனக்கு மரணமாகிவிட்டதா? நிச்சயமாக இல்லை! மாறாக, பாவம் பாவமாக வெளிப்படுவதற்காக,[a] நன்மையானதைக் கொண்டு எனக்குள் மரணத்தை உண்டாக்கியது; கட்டளையின் மூலம் பாவம் அளவுகடந்த பாவமுள்ளதாக ஆகும்படியாகவும் உண்டாக்கியது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவம் பாவமாகவே காணப்படுவதற்காக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கட்டளையின் மூலம் பாவம் அளவுக்கு மிஞ்சிப் பாவமுள்ளதாக ஆகும்படியாகவும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: நன்மையானது
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நடுநிலைப் பெயரடை. கட்டளையைச் சுட்டினாலும், கிரேக்கத்தின் பொதுவான ‘நன்மையானது’ என்ற வடிவத்தைத் தக்கவைக்கிறது.
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: எனக்கு மரணமாகிவிட்டதா?
  rationale: தனிநபர் தொடர்பைக் குறிக்கும் வேற்றுமையையும் γίνομαι என்பதன் ‘ஆகுதல்’ பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: μὴ γένοιτο
  choice: நிச்சயமாக இல்லை!
  rationale: பவுலின் வலுவான மறுப்பை நவீன, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: ἡ ἁμαρτία
  choice: பாவமே
  rationale: ἀλλά கொண்டுவரும் முரண்பாட்டையும் மரணத்தை உண்டாக்கும் உண்மையான செயலாளி பாவமே என்பதையும் வலியுறுத்துகிறது; பாவத்தின் உருவக ஆளுமைப்படுத்தலும் தக்கவைக்கப்படுகிறது.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: அது பாவம் என்று வெளிப்படவும்
  rationale: மீண்டும் வரும் ‘பாவம்’ என்பதன் பயனிலை வலிமையைப் பாதுகாத்து, பாவத்தின் இயல்பு வெளிப்படுத்தப்படுவதைத் தெளிவாக்குகிறது.
- source_word: διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον
  choice: நன்மையானதின் மூலம் எனக்குள் மரணத்தை உண்டாக்கியது
  rationale: διά என்பதன் கருவிப் பொருளையும் κατεργάζομαι என்பதன் விளைவை ஏற்படுத்தும் பொருளையும் தெளிவான தமிழில் வழங்குகிறது.
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: அளவுகடந்த பாவத்தன்மை கொண்டதாக
  rationale: ‘மிகுதியின் அளவையும் மீறி’ என்ற தீவிரத்தையும் ἁμαρτωλός என்பதன் பெயரடைத் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: διὰ τῆς ἐντολῆς
  choice: கட்டளையின் மூலம்
  rationale: ἐντολή என்பதற்கு இச்சூழலில் பொருத்தமான ‘கட்டளை’ என்பதைப் பயன்படுத்தி, διάவின் கருவிப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: நல்ல கட்டளைக்கும் மரணத்திற்கும் இடையிலான தொடர்பு
  choice: நன்மையானதே மரணமாகிவிட்டது என்பதை மறுத்து, அதன் மூலம் மரணத்தை உண்டாக்கிய செயலாளியாகப் பாவத்தைக் காட்டுகிறது.
  alternative: கட்டளையே குற்றத்துக்குரிய விதத்தில் மரணத்தை உண்டாக்கியது எனப் பொருள்படும்படி சுதந்திரமாக மொழிபெயர்க்கலாம்.
  rationale: μὴ γένοιτο என்பதற்குப் பின் வரும் ἀλλὰ ἡ ἁμαρτία என்ற முரண்பாடு பொறுப்பை நன்மையான கட்டளையின்மீது அல்ல, பாவத்தின்மீது வைக்கிறது.
- issue: இரண்டு ἵνα உட்பிரிவுகளின் நோக்கம் அல்லது விளைவு
  choice: ‘வெளிப்படவும் ... ஆகவும்’ என்று நோக்கத்தைத் திறந்தவாறே வைத்திருக்கிறது.
  alternative: இவற்றை வெறும் விளைவுகளாக ‘இதன் விளைவாக’ என்று வெளிப்படையாக விளக்கலாம்.
  rationale: ἵνα நோக்கத்தை வலுவாகச் சுட்டினாலும், இச்சூழலில் நோக்கம் மற்றும் விளைவு ஒன்றோடொன்று நெருக்கமாக உள்ளன; மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தைத் தீர்மானித்து விடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பவுலின் மறுப்பு, ‘பாவம்’ என்ற சொல்லின் மீளுரை, பாவத்தின் செயற்பாடு, கட்டளையின் நன்மை ஆகியவை சுருக்கமாகவும் தெளிவாகவும் தக்கவைக்கப்பட்டுள்ளன. அனைத்து அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
