id: ROM.7.8
reference: Romans 7:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: ta
  text: ஆனால் பாவம், கட்டளையின் வழியாக ஒரு வாய்ப்பைப் பற்றிக்கொண்டு,[a] எனக்குள் எல்லா வகையான பேராசையையும்[b] உண்டாக்கியது. ஏனெனில், சட்டம் இல்லாமல் பாவம் இறந்திருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு சந்தர்ப்பத்தை எடுத்துக்கொண்டு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எல்லா வகையான ஆசையையும்.” இச்சூழலில் பிறருக்குரியதை ஆசைப்படுதல் குறிப்பாகக் கருதப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν
  choice: ஒரு வாய்ப்பு
  rationale: பாவம் கட்டளையைத் தனக்குச் சாதகமான தொடக்கப்புள்ளியாகப் பயன்படுத்துவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மூலத்தின் உருவகத்தையும் காக்கிறது.
- source_word: λαβοῦσα
  choice: பற்றிக்கொண்டு
  rationale: வாய்ப்பைச் செயலூக்கத்துடன் கைப்பற்றிப் பயன்படுத்தும் பொருளைத் தருகிறது; வினையெச்சம் முதன்மை வினைக்கு முன்னான செயலை இயல்பாக இணைக்கிறது.
- source_word: ἡ ἁμαρτία
  choice: பாவம்
  rationale: பாவத்தைச் செயல்படும் ஓர் ஆற்றலாக பவுல் உருவகப்படுத்துவதை விளக்கிக் குறைக்காமல் அப்படியே காக்கிறது.
- source_word: διὰ τῆς ἐντολῆς
  choice: கட்டளையின் வழியாக
  rationale: முந்தைய வசனத்தில் மேற்கோள் காட்டப்பட்ட குறிப்பிட்ட கட்டளையைச் சுட்டும் ஒருமையையும், பாவம் அதையே ஒரு கருவியாகப் பயன்படுத்துவதையும் வெளிப்படுத்துகிறது.
- source_word: κατειργάσατο
  choice: உண்டாக்கியது
  rationale: ஒரு விளைவை ஏற்படுத்துதல் என்ற வினையின் வலிமையைத் தெளிவான தற்போதைய தமிழில் தருகிறது.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: எல்லா வகையான பேராசையையும்
  rationale: உடனடி சூழல் பிறருக்குரியதை ஆசைப்படக் கூடாது என்ற கட்டளையைப் பற்றியதால், ἐπιθυμία என்பதன் சூழல்சார் பொருளாக ‘பேராசை’ தேர்ந்தெடுக்கப்படுகிறது; πᾶσαν என்பது ‘எல்லா வகையான’ என இயல்பாக வெளிப்படுகிறது.
- source_word: χωρὶς γὰρ νόμου
  choice: ஏனெனில், சட்டம் இல்லாமல்
  rationale: γάρ என்பதன் விளக்கத் தொடர்பையும் χωρὶς νόμου என்பதன் நேரடியான பொருளையும் எளிய, நவீன தமிழில் காக்கிறது.
- source_word: νεκρά
  choice: இறந்திருக்கிறது
  rationale: ‘செயலற்றது’ என்று பொருளை விளக்கிவிடாமல், மூலத்தின் கூர்மையான ‘இறந்தது’ என்ற உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பாவத்தை ஆளுமைப்படுத்திக் கூறுவதையும் ‘இறந்திருக்கிறது’ என்ற உருவகத்தையும் எவ்வாறு கையாளுவது
  choice: பாவமே வாய்ப்பைப் பற்றிக்கொண்டு பேராசையை உண்டாக்கும் செயற்படும் எழுவாயாகவும், சட்டம் இல்லாமல் ‘இறந்திருக்கிறது’ என்றும் மொழிபெயர்க்கப்பட்டது.
  alternative: பாவத்தை அருவமான கருத்தாக மாற்றுதல் அல்லது ‘இறந்திருக்கிறது’ என்பதை ‘செயலற்றிருக்கிறது’ என விளக்கி மொழிபெயர்த்தல்.
  rationale: கிரேக்கம் பாவத்தைச் செயல்படும் ஓர் ஆற்றலாக ஆளுமைப்படுத்தி, νεκρά என்ற வலுவான உருவகத்தைப் பயன்படுத்துகிறது. அதன் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் காப்பது மூலத்திற்கு உண்மையாகும்.
- issue: νόμος என்பது பொதுவான சட்டமா அல்லது மோசேயின் திருச்சட்டமா
  choice: ‘சட்டம்’ என்று மொழிபெயர்த்து, சூழல் தீர்மானிக்க இடமளிக்கப்பட்டது.
  alternative: ‘மோசேயின் திருச்சட்டம்’ என்று வெளிப்படையாகக் குறிப்பிட்டு பொருளைச் சுருக்குதல்.
  rationale: இச்சூழல் மோசேயின் சட்டத்தை வலுவாக நினைவூட்டினாலும், கிரேக்கத்தில் இங்கு பெயரும் குறிப்பும் சேர்க்கப்படவில்லை. ஆகவே மொழிபெயர்ப்பு மூலத்தின் வெளிப்பாட்டு அளவை மீறவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பழமையான ‘நியாயப்பிரமாணம்’ என்பதற்குப் பதிலாக ‘சட்டம்’ பயன்படுத்தப்பட்டுள்ளது. ‘பாவம்’ செயற்படும் எழுவாயாகத் தொடர்ந்து வைக்கப்பட்டதால் பவுலின் ஆளுமைப்படுத்தல் தெளிவாகத் தங்குகிறது.
