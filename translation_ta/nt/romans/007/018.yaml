id: ROM.7.18
reference: Romans 7:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: ta
  text: ஏனெனில், என்னில்—அதாவது, என் மாம்சத்தில்[a]—நன்மை எதுவும் குடியிருப்பதில்லை என்று நான் அறிவேன். நன்மையை விரும்புவது என்னிடம் இருக்கிறது; ஆனால் நன்மையைச் செய்வது இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவ இயல்பில்.”
    reason: σάρξ என்பதற்கான சூழல்சார் விளக்க மொழிபெயர்ப்பை மாற்று வாசகமாக வழங்குகிறது; முதன்மை உரையில் ‘மாம்சம்’ என்ற மூல உருவகம் காக்கப்படுகிறது.
lexical_decisions:
- source_word: οἶδα
  choice: நான் அறிந்திருக்கிறேன்
  rationale: முற்றுவினை வடிவம் இங்கு நிகழ்காலப் பொருளில் வருகிறது; தமிழில் இயல்பாகவும் உறுதியான அறிவைக் குறிக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: οἰκεῖ
  choice: குடியிருப்பதில்லை
  rationale: உள்ளே குடியிருத்தல் என்ற பவுலின் உருவகத்தைப் பாதுகாக்கிறது; வெறுமனே ‘இல்லை’ என்று கூறுவதைவிட மூலத்தின் சொல்லாட்சிக்கு நெருக்கமானது.
- source_word: ἀγαθόν
  choice: நன்மை எதுவும்
  rationale: οὐκ என்பதன் மறுப்புடன், பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலை ஒருமைச் சொல் தமிழில் இயல்பாக ‘நன்மை எதுவும் ... இல்லை’ என அமைகிறது.
- source_word: σάρξ
  choice: மாம்சம்
  rationale: பவுலின் சொல்லை நேரடியாக வைத்திருப்பதோடு, அதை ‘பாவ இயல்பு’ என்று விளக்கி இறையியல் பதற்றத்தை முன்கூட்டியே தீர்த்துவிடாமல் காக்கிறது.
- source_word: θέλειν
  choice: விரும்புவது
  rationale: பெயர்ச்சொல் தன்மையில் வரும் வினையெச்சக் கருத்தை நவீன தமிழில் தெளிவாகக் கூறுகிறது; வெறும் ஆசையைவிட மனவிருப்பத்தையும் நோக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: παράκειταί μοι
  choice: என்னிடம் இருக்கிறது
  rationale: விருப்பம் தன்னிடம் அண்மையில் அல்லது கிடைக்கக்கூடியதாக உள்ளது என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατεργάζεσθαι
  choice: அதைச் செய்வது
  rationale: செயலாற்றுதல் அல்லது நிறைவேற்றுதல் என்ற பொருளைத் தருகிறது; முந்தைய ‘விரும்புவது’ என்பதுடன் தெளிவான எதிர்நிலையை உருவாக்குகிறது.
- source_word: τὸ καλόν
  choice: நன்மை
  rationale: அறநெறிசார் நல்லதைச் சுருக்கமாகக் குறிக்கிறது. இரண்டாம் வாக்கியத்தில் ‘அதை’ எனக் குறிப்பதன் மூலம் தமிழில் தேவையற்ற மறுபடியுரைத்தல் தவிர்க்கப்படுகிறது.
- source_word: οὔ
  choice: இல்லை
  rationale: மூலத்தில் இறுதி மறுப்பு சுருக்கமாக உள்ளது; தமிழிலும் குறைந்தபட்ச நிரப்புதலுடன் அந்தத் திடீர் எதிர்மறை முடிவு காக்கப்படுகிறது.
theological_decisions:
- issue: அறநெறிசார் பவுலின் பயன்பாட்டில் σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: மாம்சம்
  alternative: பாவ இயல்பு
  rationale: ‘மாம்சம்’ என்பது மூலச்சொல்லின் உருவகத்தையும் பவுல் ஏற்படுத்தும் ‘நான்—அதாவது, என் மாம்சம்’ என்ற வேறுபாட்டையும் பாதுகாக்கிறது. ‘பாவ இயல்பு’ என்பது சாத்தியமான விளக்கமாக இருந்தாலும், வசனத்தின் பொருளை ஒரு குறிப்பிட்ட இறையியல் விளக்கத்திற்குள் முன்கூட்டியே கட்டுப்படுத்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருப்பது’ என்ற உருவகமும், விரும்புதல்–செய்தல் என்ற எதிர்நிலையும் பாதுகாக்கப்பட்டுள்ளன; இறுதி பகுதியின் கிரேக்கச் சுருக்கம் தமிழிலும் சுருக்கமாக வைக்கப்பட்டுள்ளது.
