  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ‘நான் அறிந்திருக்கிறேன்’ இலக்கணப்படி ஏற்கத்தக்கது; எனினும் οἶδα-வின் நிகழ்காலப் பொருளுக்கு ‘நான் அறிவேன்’ நேரடியானதும் தமிழில் சீரானதுமாகும். ‘நன்மையைச் செய்வது’ என்ற மறுபதிப்பு தேவையற்றதாக இல்லாமல், இவ்வசனத்தில் கருத்துத் துல்லியத்தை அளிக்கிறது.
  terminology: ‘மாம்சம்’ என்பது σάρξ-க்கு மூல உருவகத்தைப் பாதுகாக்கும் பொருத்தமான மொழிபெயர்ப்பு. மாற்று அடிக்குறிப்பில் ‘பாவ இயல்பு’ என்பதை விளக்க மாற்றாக மட்டுமே வைத்திருப்பது, உரையின் இறையியல் தெளிவின்மையை முன்கூட்டியே தீர்மானிக்காமல் காக்கிறது.
