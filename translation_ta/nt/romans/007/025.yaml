base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: ta
  text: நம் ஆண்டவராகிய இயேசு மேசியாவின்[c] வழியாகக் கடவுளுக்கு நன்றி! ஆகவே, நானே என் மனத்தால் கடவுளின் சட்டத்துக்குப் பணிகிறேன்; ஆனால் என் மாம்சத்தால்[a] பாவத்தின் சட்டத்துக்குப்[b] பணிகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாம்சம்’ என்பதற்கு மாற்றாக, ‘பாவ இயல்பு’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பாவத்தின் சட்டம்’ என்பதற்கு மாற்றாக, ‘பாவத்தின் நியதி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: c
    text: 'கிரேக்கத்தில்: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν, ‘நம் ஆண்டவராகிய இயேசு கிறிஸ்துவின் வழியாக.’ இங்குள்ள Χριστός (கிறிஸ்தோஸ்) என்பதை ஒரு பட்டப்பெயராக ‘மேசியா’ என்று மொழிபெயர்த்துள்ளோம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: கடவுளுக்கு நன்றி
  rationale: தரப்பட்டுச் சொல்லப்படும் இந்த வியப்புத் தொடரில் χάρις என்பது ‘அருள்’ என்ற பண்பைக் குறிக்காமல், கடவுளுக்கு நன்றி தெரிவிக்கும் மரபுத்தொடராகச் செயல்படுகிறது.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: நம் ஆண்டவராகிய மேசியாவாகிய இயேசுவின் வழியாக
  rationale: διά + பிறப்புவேற்றுமை ‘வழியாக’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது. Χριστός இங்கு பட்டப்பெயராக உள்ளதால் ‘மேசியா’ எனவும், τοῦ κυρίου ἡμῶν இயல்பான தமிழில் ‘நம் ஆண்டவராகிய’ எனவும் தரப்படுகிறது.
- source_word: Ἄρα οὖν
  choice: ஆகவே
  rationale: இரு முடிவுரைக் கூறுகளின் தொகுக்கவும் முடிவுக்கு வரவும் செய்கிற வலிமையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτὸς ἐγώ
  choice: நானே
  rationale: αὐτός உடன் வந்துள்ள ἐγώ-வின் வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: νοῒ
  choice: மனத்தால்
  rationale: கடவுளின் சட்டத்தோடு இணங்கும் உள்ளார்ந்த சிந்தனைத் திறனை இங்கு ‘மனம்’ தெளிவாகக் குறிக்கிறது; கருவிப்பொருளை ‘-ஆல்’ வெளிப்படுத்துகிறது.
- source_word: δουλεύω
  choice: பணிகிறேன்
  rationale: δουλεύω-வில் உள்ள கீழ்ப்படிதல் மற்றும் அடிமைத்தனச் சாயலை ‘சேவை செய்கிறேன்’ என்பதைவிட ‘பணிகிறேன்’ இயல்பாக உணர்த்துகிறது; அதே வினை இரு இணை உறுப்புகளிலும் மீண்டும் தரப்பட்டு எதிர்மறை இணைப்பு தெளிவாக்கப்படுகிறது.
- source_word: νόμῳ θεοῦ
  choice: கடவுளின் சட்டத்துக்கு
  rationale: ரோமர் 7-இன் வாதத்தில் νόμος என்பதன் தொடர்ச்சியைக் காக்க ‘சட்டம்’ பயன்படுத்தப்படுகிறது.
- source_word: σαρκὶ
  choice: மாம்சத்தால்
  rationale: σάρξ என்பதைக் கருத்துவிளக்கமாக ‘பாவ இயல்பு’ என்று தீர்மானிக்காமல், பவுலின் சொல் மற்றும் மனம்–மாம்சம் இடையிலான இறையியல் இழுவை காக்கிறது.
- source_word: νόμῳ ἁμαρτίας
  choice: பாவத்தின் சட்டத்துக்கு
  rationale: ‘கடவுளின் சட்டம்’ என்பதோடு உள்ள திட்டமிட்ட இணை அமைப்பையும் νόμος என்ற சொல்லின் மறுபயன்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: ஒழுக்கச் சார்புடைய பவுலின் சூழலில் σάρξ என்பதன் பொருள்
  choice: மாம்சம்
  alternative: பாவ இயல்பு
  rationale: கிரேக்கத்தில் வெளிப்படையாக ‘பாவ இயல்பு’ என்று சொல்லப்படவில்லை. ‘மாம்சம்’ என்பது மனத்துடனான எதிர்மறை அமைப்பையும் மனித நிலையைப் பற்றிய பவுலின் இறையியல் இழுவையையும் விளக்கத்தால் முன்கூட்டியே தீர்க்காமல் காக்கிறது.
- issue: Χριστός என்பது பட்டமா அல்லது பெயரின் நிலையான பகுதியா
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός-ன் பட்டப்பெயர்ச் சாயலை வெளிப்படையாகக் காக்க ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டுள்ளது; குறிப்பில் கிரேக்க வடிவமும் வழக்கமான மாற்றும் தெரிவிக்கப்படுகின்றன.
- issue: νόμος ἁμαρτίας என்பதிலுள்ள νόμος
  choice: பாவத்தின் சட்டம்
  alternative: பாவத்தின் நியதி
  rationale: ‘நியதி’ என்பது விளக்கவுரையாக இருக்கலாம்; ஆனால் ‘சட்டம்’ என்பது கடவுளின் சட்டத்தோடு உள்ள சொல் மற்றும் கருத்து இணைப்பைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நானே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; அரைப்புள்ளி மனம்–மாம்சம் எதிர்மறை இணைப்பைத் தெளிவாக்குகிறது. ‘மாம்சம்’ மற்றும் இருமுறை வரும் ‘சட்டம்’ ஆகியவை விளக்கவுரையால் மென்மையாக்கப்படாமல் மூலத்தின் பதற்றத்தையும் இணை அமைப்பையும் காக்கின்றன.
