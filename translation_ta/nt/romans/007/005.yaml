id: ROM.7.5
reference: Romans 7:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: ta
  text: ஏனெனில், நாம் மாம்சத்தில் இருந்தபோது[a], சட்டத்தின் வழியாகச் செயல்பட்ட பாவ இச்சைகள்[b], மரணத்திற்காகக் கனி தரும்படி நம் உடல் உறுப்புகளில்[c] செயல்பட்டுக்கொண்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாம்சத்தில்” என்பது இங்கு “பாவத்துக்குட்பட்ட மனித இயல்பில்” அல்லது “வீழ்ச்சியுற்ற மனித நிலையில்” என்றும் பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: 'சொல்லுக்கு சொல்: “பாவங்களின் இச்சைகள்.”'
    reason: lexical_alternative
  - marker: c
    text: “உடல் உறுப்புகள்” என்பது செயலுக்கான கருவிகளாகப் பயன்படும் உடலின் பாகங்களையும் திறன்களையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: σάρξ
  choice: மாம்சம்
  rationale: பவுலின் உருவகச் சொல்லையும் மாம்சம்/ஆவி என்ற இறையியல் பதற்றத்தையும் விளக்கித் தீர்த்துவிடாமல் காக்கிறது; பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: παθήματα τῶν ἁμαρτιῶν
  choice: பாவ இச்சைகள்
  rationale: இங்கு παθήματα என்பது துன்பங்கள் அல்ல, பாவத்தால் தன்மைப்படுத்தப்படும் உள்ளார்ந்த தூண்டுதல்கள்; இயல்பான தமிழில் பண்புத் தொடர்பாக வழங்கப்படுகிறது.
- source_word: διὰ τοῦ νόμου
  choice: சட்டத்தின் வழியாக
  rationale: διά + genitive என்பதன் வழிமுறை/இடைமுகப் பொருளைக் காக்கிறது; சட்டமே அவற்றை உருவாக்கியது அல்லது தூண்டியது என்று தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: ἐνηργεῖτο
  choice: செயல்பட்ட
  rationale: இறந்தகாலத்தில் தொடர்ந்து இயங்கிக்கொண்டிருந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μέλεσιν
  choice: உடல் உறுப்புகளில்
  rationale: μέλη என்பதன் உடல் சார்ந்த பொருளைத் தெளிவாகத் தருகிறது; செயலுக்கான கருவிகளாகிய உறுப்புகள் என்ற பவுலின் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: καρποφορῆσαι
  choice: கனியை விளைவித்தன
  rationale: கனி தருதல் என்ற உயிரியல் உருவகத்தைத் தக்கவைத்தபடி தமிழில் இயல்பான வினைத்தொடராக அமைக்கிறது.
- source_word: τῷ θανάτῳ
  choice: மரணத்திற்கான
  rationale: மரணத்தை நோக்கிய அல்லது மரணத்தில் முடியும் விளைவு என்ற தத்தம் உறவைச் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: ἐν τῇ σαρκί என்பதை விளக்கமாக மொழிபெயர்ப்பதா அல்லது பவுலின் உருவகத்தைத் தக்கவைப்பதா
  choice: மாம்சத்தில்
  alternative: பாவத்துக்குட்பட்ட மனித இயல்பில் / வீழ்ச்சியுற்ற மனித நிலையில்
  rationale: σάρξ இங்கு வெறும் உடல் வாழ்வை மட்டும் குறிக்காமல் பழைய மனித நிலையைச் சுட்டலாம். முதன்மை உரையில் ‘மாம்சம்’ என்பதை வைத்திருப்பது பவுலின் சொல்வடிவத்தையும் மாம்சம்/ஆவி எதிர்வையும் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: διὰ τοῦ νόμου என்பதில் சட்டத்தின் பங்கை எவ்வாறு காட்டுவது
  choice: சட்டத்தின் வழியாகச் செயல்பட்ட
  alternative: சட்டத்தால் தூண்டப்பட்ட
  rationale: கிரேக்க உரை ‘சட்டத்தின் வழியாக’ என்று கூறுகிறது; ‘தூண்டப்பட்ட’ என்பது ரோமர் 7 இன் விரிந்த வாதத்திலிருந்து சாத்தியமான விளக்கம் என்றாலும், இவ்வசனத்தின் சொற்களைக் காட்டிலும் குறிப்பான காரணவிளக்கமாகிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மாம்சம்’, ‘கனி’ ஆகிய பவுலின் முக்கிய உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன; அரிதான ‘அவயவங்கள்’ என்பதற்குப் பதில் தெளிவான ‘உடல் உறுப்புகள்’ பயன்படுத்தப்பட்டுள்ளது.
