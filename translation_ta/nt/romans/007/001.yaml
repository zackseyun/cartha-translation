    issue: Idiomatic rendering of ἀγνοεῖτε
    rationale: The phrase ‘அறியாமல் இருக்கிறீர்களா?’ can suggest being in a state of ignorance and sounds somewhat cumbersome in this rhetorical question. ‘அறியவில்லையா?’ is standard modern Tamil and more naturally communicates Paul’s appeal to shared knowledge.
