id: ROM.7.1
reference: Romans 7:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: ta
  text: அல்லது, சகோதரர்களே[a], நீங்கள் அறியவில்லையா?—சட்டத்தை அறிந்தவர்களிடம் நான் பேசுகிறேன்—ஒருவர் உயிரோடிருக்கும் காலமெல்லாம் சட்டம் அவர்மேல் அதிகாரம் செலுத்துகிறது[b] அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களே’ என்பது ஆண்பால் பன்மையான ἀδελφοί என்ற சொல்லின் மொழிபெயர்ப்பு; இச்சூழலில் பவுல் உரையாற்றிய பெண்களும் இதில் உள்ளடங்கியிருக்கலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘ஆளுகிறது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: அல்லது
  rationale: முந்தைய வாதத்துடன் பவுல் இணைக்கும் மாற்றுச் சிந்தனையை நேரடியாகத் தக்கவைக்கிறது.
- source_word: ἀγνοεῖτε
  choice: நீங்கள் அறியாமல் இருக்கிறீர்களா?
  rationale: பகிரப்பட்ட அறிவை நினைவூட்டும் நிகழ்கால வினாவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க ஆண்பால் பன்மை அழைப்பை முதன்மை உரையில் தக்கவைக்கிறது; இங்கு பெண்களையும் உள்ளடக்கும் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: சட்டத்தை அறிந்தவர்களிடம் நான் பேசுகிறேன்
  rationale: γάρ தரும் விளக்க இடைச்செருகலையும், சட்டத்தை அறிந்தவர்கள் என்ற பங்கேற்பு கருத்தையும் தெளிவாகக் கொடுக்கிறது.
- source_word: νόμον / ὁ νόμος
  choice: சட்டம்
  rationale: மோசேயின் சட்டத்தை மட்டும் வெளிப்படையாகக் குறிப்பதாக மொழிபெயர்ப்பைச் சுருக்காமல், கிரேக்கச் சொல்லின் பொதுவான அகலத்தைப் பாதுகாக்கிறது.
- source_word: κυριεύει
  choice: அதிகாரம் செலுத்துகிறது
  rationale: ஆளுகை அல்லது மேலாதிக்கம் செலுத்துதல் என்ற வினையின் வலிமையை நவீன, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῦ ἀνθρώπου
  choice: ஒருவர் / அவர்மேல்
  rationale: இங்கு ἄνθρωπος குறிப்பாக ஆணை அல்ல, பொதுவாக ஒரு மனித நபரைக் குறிக்கிறது; பாலினம் சுட்டாத இயல்பான தமிழ் பயன்படுத்தப்படுகிறது.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: உயிரோடிருக்கும் காலமெல்லாம்
  rationale: ஒருவர் வாழும் முழுக் காலத்தையும் குறிக்கும் காலவியல் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
theological_decisions:
- issue: νόμος என்பதன் பொருள் வரம்பு
  choice: ‘சட்டம்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மோசேயின் சட்டம்’ அல்லது ‘திருச்சட்டம்’ என்று குறிப்பாக்குவது.
  rationale: உடனடியான சூழலில் மோசேயின் சட்டம் முக்கியமாக இருந்தாலும், கிரேக்க வாசகம் அதன் பொருள் வரம்பை இவ்வசனத்திலேயே முழுமையாகக் கட்டுப்படுத்தவில்லை; ஆகவே அந்த அகலமும் இறையியல் இழுபறியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. விளக்க இடைச்செருகல் கோடுகளால் வேறுபடுத்தப்பட்டுள்ளது; இறுதியிலுள்ள ‘அல்லவா?’ முழு வாக்கியத்தின் சொல்லாட்சிசார் வினாத் தன்மையை இயல்பான தமிழில் தெளிவாக்குகிறது.
