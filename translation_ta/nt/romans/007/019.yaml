reference: Romans 7:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: ta
  text: ஏனெனில், நான் விரும்புகிற நன்மையைச் செய்வதில்லை; மாறாக, நான் விரும்பாத தீமையையே செய்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனத்தில் கிரேக்கம் முதலில் ποιῶ, பின்னர் πράσσω என்ற இரண்டு வேறு வினைச்சொற்களைப் பயன்படுத்துகிறது. இரண்டிற்கும் பொருள் பெருமளவு ஒத்திருந்தாலும், பின்னையதை “நடைமுறைப்படுத்துகிறேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: விரும்புகிற
  rationale: விருப்பத்தையும் மனவுறுதியையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; தேவையற்ற தத்துவச் சாயலைச் சேர்ப்பதில்லை.
- source_word: ποιῶ
  choice: செய்வதில்லை
  rationale: செயலைக் குறிக்கும் பொதுவான, நேரடியான வினைச்சொல்; πράσσω என்பதுடனான பொருள் ஒட்டுமையையும் வாசிப்பின் இயல்பையும் காக்கிறது.
- source_word: ἀγαθόν
  choice: நன்மையை
  rationale: இங்கு நோக்கப்படும் அறநெறி சார்ந்த நன்மையைப் பெயர்ச்சொல் வடிவில் தெளிவாகக் காட்டுகிறது.
- source_word: κακὸν
  choice: தீமையை
  rationale: ἀγαθόν என்பதற்கு இணையான வலுவான அறநெறி எதிர்மறையைப் பேணுகிறது; வெறும் ‘கெட்டதை’ என்பதைக் காட்டிலும் பொருத்தமானது.
- source_word: πράσσω
  choice: செய்துவருகிறேன்
  rationale: ποιῶ என்பதிலிருந்து மென்மையான சொல் வேறுபாட்டைக் காட்டி, நடைமுறையில் நிகழும் செயலை உணர்த்துகிறது; அதே நேரத்தில் மூலத்தில் இல்லாத கடுமையான பழக்கவழக்கப் பொருளை வற்புறுத்துவதில்லை.
- source_word: τοῦτο
  choice: தீமையையே
  rationale: தனியான சுட்டுப்பெயரை இயல்பற்ற முறையில் சேர்க்காமல், ‘-ஏ’ என்னும் வலியுறுத்தல் மூலம் ‘இதையே’ என்ற மூலத்தின் அழுத்தத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐ γὰρ
  choice: ஏனெனில் ... செய்வதில்லை
  rationale: γάρ என்பதன் விளக்கத் தொடர்பையும் οὐ என்பதன் மறுப்பையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: பவுலின் அறநெறி எதிர்மறையை மென்மைப்படுத்தலாமா
  choice: ‘நன்மை’ / ‘தீமை’ என்ற நேரடியான அறநெறிப் பிரிவுகளைப் பேணுதல்
  alternative: ‘நல்லது’ / ‘கெட்டது’ அல்லது ‘சரியானது’ / ‘தவறானது’
  rationale: ἀγαθόν மற்றும் κακόν இங்கு வலுவான அறநெறிப் பொருளைக் கொண்டுள்ளன; பவுலின் உள்ளார்ந்த முரண்பாட்டையும் இறையியல் அழுத்தத்தையும் மொழிபெயர்ப்பு தளர்த்தக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘மாறாக’ எதிர்மறையைத் தெளிவாக்குகிறது; ‘தீமையையே’ என்பது τοῦτο அளிக்கும் வலியுறுத்தலை இயல்பான தமிழில் தக்கவைக்கிறது.
