translation:
  language: ta
  text: ஏனெனில், என் உள்ளான மனிதனுக்கேற்ப, கடவுளின் சட்டத்தில் நான் மனமகிழ்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் உள்ளார்ந்த சுயத்திற்கேற்ப’ அல்லது ‘என் உள்ளார்ந்த இருப்புக்கேற்ப’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήδομαι
  choice: மனமகிழ்கிறேன்
  rationale: வெறும் அறிவுசார் உடன்பாட்டை அல்லாமல், மகிழ்ச்சியுடன் ஏற்றுக்கொள்வதையும் இன்புறுவதையும் இந்த வினை வெளிப்படுத்துகிறது.
- source_word: νόμῳ τοῦ θεοῦ
  choice: கடவுளின் சட்டத்தில்
  rationale: νόμος என்பதன் பவுலிய இறையியல் நிறையை ‘சட்டம்’ காக்கிறது; தத்த வேற்றுமை இங்கு மனமகிழ்வதன் பொருளுடன் தமிழில் இயல்பாக ‘சட்டத்தில்’ என வழங்கப்படுகிறது.
- source_word: κατὰ
  choice: -க்கேற்ப
  rationale: κατά குறிக்கும் நோக்கு அல்லது அளவுகோலை ‘-க்கேற்ப’ நெருக்கமாகப் பிரதிபலிக்கிறது; அதை வெறும் இடம்சார்ந்த ‘உள்ளே’ என்று மாற்றவில்லை.
- source_word: τὸν ἔσω ἄνθρωπον
  choice: உள்ளான மனிதன்
  rationale: பவுலின் உருவகச் சொல்லாட்சியைத் தக்கவைக்கிறது; அதேவேளையில் இதை மனித அமைப்பைப் பற்றிய ஒரு குறிப்பிட்ட கோட்பாடாக விளக்கவில்லை. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘என்’ முதன்மை உரையில் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ‘உள்ளான மனிதன்’ என்பதன் மானுடவியல் நுட்பம்
  choice: உள்ளான மனிதனுக்கேற்ப
  alternative: என் உள்ளார்ந்த சுயத்தில் / என் உள்ளார்ந்த இயல்பில்
  rationale: மூலத்தின் உருவகத்தையும் κατὰ என்பதன் உறவையும் காக்கிறது; ஆனாலும் ஆன்மா, மனம், அல்லது மனித இயல்பின் ஒரு தனிக் கூறு என்று சர்ச்சைக்குரிய கோட்பாட்டு விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமும் வாசிப்புத் தெளிவும் பேணப்பட்டுள்ளன. ‘உள்ளான மனிதன்’ என்பது சற்றே இலக்கியத் தன்மை கொண்டிருந்தாலும், மூல உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது; மாற்று இயல்பான சொற்றொடர்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
