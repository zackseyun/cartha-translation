- from: ஆகவே, என் சகோதரர்களே[a], நீங்களும் மேசியாவின்[b] உடல் வழியாகத் திருச்சட்டத்துக்கு இறந்தவர்களாக்கப்பட்டீர்கள். நீங்கள் வேறொருவருக்கு உரியவர்களாகும்படி[c]—அதாவது, இறந்தோரிலிருந்து உயிர்த்தெழுப்பப்பட்டவருக்கு உரியவர்களாகும்படி—இது நிகழ்ந்தது; நாம் கடவுளுக்காகக் கனி கொடுக்கவே இவ்வாறு நிகழ்ந்தது.
  to: ஆகவே, என் சகோதரர்களே[a], நீங்களும் மேசியாவின்[b] உடலின் மூலம் சட்டத்திற்கு இறந்தவர்களாக்கப்பட்டீர்கள்; நீங்கள் வேறொருவருக்கு உரியவர்களாகும்படியாக[c]—அதாவது, இறந்தோரிலிருந்து எழுப்பப்பட்டவருக்கு—நாம் கடவுளுக்காகக் கனி கொடுக்கும்படியாகவும்.
  rationale: மூலத்தின் செயப்பாட்டு வினை, கருவிப் பொருள், இரு நோக்கத் தொடர்கள், மற்றும் இறுதி நபர்மாற்றம் ஆகியவை நேரடியாகப் பிரதிபலிக்கப்படுகின்றன. தேவையற்ற ‘இது நிகழ்ந்தது’ மீளுரைகள் அகற்றப்பட்டுள்ளன; அடிக்குறிப்பு அடையாளங்களும் அவை விளக்கும் சொற்களிலேயே நிலைநிறுத்தப்பட்டுள்ளன.
