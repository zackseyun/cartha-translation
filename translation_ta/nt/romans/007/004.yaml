id: ROM.7.4
reference: Romans 7:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: ta
  text: ஆகவே, என் சகோதரர்களே[a], நீங்களும் மேசியாவின்[b] உடலின் மூலம் சட்டத்திற்கு இறந்தவர்களாக்கப்பட்டீர்கள்; நீங்கள் வேறொருவருக்கு உரியவர்களாகும்படியாக[c]—அதாவது, இறந்தோரிலிருந்து எழுப்பப்பட்டவருக்கு—நாம் கடவுளுக்காகக் கனி கொடுக்கும்படியாகவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் சகோதர சகோதரிகளே’ என்றும் மொழிபெயர்க்கலாம்; ‘சகோதரர்கள்’ என்பதற்கான கிரேக்கச் சொல் ஆண்களும் பெண்களும் சேர்ந்த ஒரு குழுவை அழைக்கவும் பயன்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘கிறிஸ்து’; இங்கு அந்தப் பட்டத்தின் பொருளை வெளிப்படுத்த ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: ‘நீங்கள் வேறொருவருடையவர்கள் ஆகும்படி’; இச்சொற்றொடர் முந்தைய வசனங்களில் உள்ள திருமண ஒப்புமையைத் தொடர்கிறது.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: ஆகவே
  rationale: முந்தைய திருமண ஒப்புமையிலிருந்து வரும் முடிவையும் உரையாடலின் தொடர்ச்சியையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: ஆண்பால் பன்மையான கிரேக்க அழைப்பை நேரடியாகப் பிரதிபலிக்கிறது; கலப்புப் பாலினக் குழுவையும் இச்சொல் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐθανατώθητε τῷ νόμῳ
  choice: திருச்சட்டத்துக்கு இறந்தவர்களாக்கப்பட்டீர்கள்
  rationale: வினையின் இறந்தகாலச் செயப்பாட்டைத் தக்கவைத்து, திருச்சட்டத்துடனான முந்தைய கட்டுப்பாடு மரணத்தின் மூலம் முடிவடைந்தது என்ற உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: மேசியாவின் உடல் வழியாக
  rationale: διά உடன் வரும் உடைமை வேற்றுமையின் கருவி அல்லது இடைமுகப் பொருளைத் தக்கவைக்கிறது; மேசியாவின் உடல்சார்ந்த மரணமே இதற்கான வழி என்பதைக் காட்டுகிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: இங்கு Χριστός அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளுடன் செயல்படுவதால், அதன் பொருளை வெளிப்படுத்தும் ‘மேசியா’ பயன்படுத்தப்படுகிறது.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: நீங்கள் வேறொருவருக்கு உரியவர்களாகும்படி
  rationale: முந்தைய வசனங்களின் திருமண ஒப்புமையைத் தொடரும் உறவுமாற்றத்தைத் தெளிவாகவும், ‘இணைக்கப்பட்டீர்கள்’ என்று கூடுதலாக விளக்காமலும் கூறுகிறது.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: இறந்தோரிலிருந்து உயிர்த்தெழுப்பப்பட்டவருக்கு
  rationale: கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும், இறந்தோரிடமிருந்து எழுப்பப்பட்டார் என்ற குறிப்பையும் தக்கவைக்கிறது.
- source_word: ἵνα καρποφορήσωμεν τῷ θεῷ
  choice: நாம் கடவுளுக்காகக் கனி கொடுக்கவே
  rationale: நோக்கத்தையும் கனி கொடுத்தல் என்ற உருவகத்தையும், ‘நீங்கள்’ என்பதிலிருந்து ‘நாம்’ என்பதற்கு மூலத்தில் நிகழும் நபர்மாற்றத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுலின் உரையில் Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் இச்சொல் வெறும் பெயராக அல்லாமல் பட்டமாகவும் மீட்புச் சார்ந்த அடையாளமாகவும் செயல்படுகிறது; ‘மேசியா’ அந்தப் பட்டப்பொருளை வெளிப்படையாகத் தக்கவைக்கிறது.
- issue: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ என்பதில் உள்ள திருமண/உறவு உருவகம்
  choice: வேறொருவருக்கு உரியவர்களாகும்படி
  alternative: வேறொருவரோடு இணைக்கப்படும்படி
  rationale: மரணத்தால் பழைய உறவு முடிந்து புதிய உறவு ஏற்படுகிறது என்ற சூழலின் உருவகத்தைத் தக்கவைக்கிறது; அதேவேளை கிரேக்கத்தில் நேரடியாக இல்லாத ‘இணைக்கப்படுதல்’ என்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான பொதுநடை பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சட்டம்’, ‘இறந்தவர்களாக்கப்பட்டீர்கள்’, ‘உரியவர்களாகும்படி’ ஆகியவை பவுலின் சட்ட, மரணம், திருமண உருவகங்களை விளக்கவுரை மூலம் கரைத்துவிடாமல் வாசிக்கத்தக்க தமிழில் தக்கவைக்கின்றன.
