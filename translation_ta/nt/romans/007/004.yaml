  source_fidelity: 'மூலத்தின் முக்கியக் கூறுகள் பாதுகாக்கப்பட்டுள்ளன: செயப்பாட்டு ‘இறந்தவர்களாக்கப்பட்டீர்கள்,’ சட்டத்துடனான உறவு முடிவுறுதல், மேசியாவின் உடல் மூலம் நிகழ்தல், வேறொருவருக்கு உரியவராதல், உயிர்த்தெழுப்பப்பட்டவர், மேலும் ‘நீங்கள்’ என்பதிலிருந்து ‘நாம்’ என்பதற்கான மாற்றம் ஆகியவை உள்ளன. ஆனால் ‘இது நிகழ்ந்தது … இவ்வாறு நிகழ்ந்தது’ என்ற சேர்க்கை கிரேக்கத்தின் தொடர்ச்சியான நோக்க அமைப்பைத் தேவையின்றி விளக்கவுரையாக்கி மீளுரைக்கிறது.'
