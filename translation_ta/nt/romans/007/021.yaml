id: ROM.7.21
reference: Romans 7:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: ta
  text: ஆகவே, நன்மை செய்ய விரும்பும் எனக்குத் தீமை அருகிலேயே இருக்கிறது என்பதே நான் காணும் சட்டம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நியதி’ அல்லது ‘விதிமுறை’.
    reason: νόμος என்ற சொல் இச்சூழலில் சட்டத்தைக் குறிக்கலாம்; செயல்படும் ஒரு நியதி அல்லது விதிமுறையையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: Εὑρίσκω
  choice: நான் காணும்
  rationale: நிகழ்காலத்தில் தொடரும் உணர்தல் அல்லது கண்டறிதலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἄρα
  choice: ஆக
  rationale: முந்தைய வாதத்திலிருந்து பெறப்படும் முடிவைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: νόμον
  choice: சட்டம்
  rationale: νόμος என்பதன் அடிப்படைச் சொல்லைத் தக்கவைத்து, மோசேயின் சட்டமா அல்லது செயல்படும் நியதியா என்ற சூழல்சார் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: நான் நன்மை செய்ய விரும்பும்போது
  rationale: கிரேக்க வேற்றுமை அமைப்பைச் சொற்சொல்லாகப் பின்பற்றாமல், θέλω என்பதன் விருப்பப் பொருளையும் செயலைச் செய்யும் நோக்கத்தையும் தெளிவாகத் தருகிறது.
- source_word: τὸ καλὸν
  choice: நன்மை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் உரிச்சொல்லின் ‘நல்லது/நன்மை’ என்ற பொருளை இச்சூழலில் இயல்பாக வழங்குகிறது.
- source_word: τὸ κακὸν
  choice: தீமை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் கிரேக்க உரிச்சொல்லைச் சுருக்கமாகவும் நேரடியாகவும் மொழிபெயர்க்கிறது.
- source_word: παράκειται
  choice: என் அருகிலேயே இருக்கிறது
  rationale: ‘அருகில் கிடக்கிறது/உடனிருக்கிறது’ என்ற கருத்தை, தீமை உடனடியாக அருகில் இருப்பதன் வலிமையுடன் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: νόμον என்பது மோசேயின் சட்டத்தைக் குறிக்கிறதா, அல்லது செயல்படும் நியதி/முறையைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘சட்டம்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: நியதி; விதி
  rationale: பவுலின் νόμος சொல்லாட்சியின் ஒலிப்பையும் இறையியல் பதற்றத்தையும் ‘சட்டம்’ தக்கவைக்கிறது; அதேவேளையில், இங்கு அது ஒரு செயல்படும் நியதியைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு காட்டுகிறது.
translation_notes:
  register: 'நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் சிக்கலான வேற்றுமை அமைப்பு, பொருளை மாற்றாமல் ‘இதுதான்: ...ும்போது’ என்ற இயல்பான தமிழ் கட்டமைப்பாக மறுவடிவமைக்கப்பட்டது.'
