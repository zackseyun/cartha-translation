  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: ta
  text: ஏனெனில் பாவம், கட்டளையின் வழியாக வாய்ப்பைப் பயன்படுத்திக்கொண்டு[a], என்னை ஏமாற்றி, அதன் வழியாக[b] என்னைக் கொன்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சந்தர்ப்பத்தைப் பயன்படுத்திக்கொண்டு.’
    reason: lexical_alternative
  - marker: b
    text: ‘அதன்’ என்பது ‘கட்டளை’யைக் குறிக்கிறது.
    reason: referent_clarification
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἁμαρτία
  choice: பாவம்
  rationale: இங்கே பாவமே செயல்களைச் செய்யும் இலக்கண எழுவாயாக உள்ளது; பவுல் பயன்படுத்தும் ஆளுருவாக்கப்பட்ட செயற்பாட்டை கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: ἀφορμὴν λαβοῦσα
  choice: வாய்ப்பைப் பயன்படுத்திக்கொண்டு
  rationale: கிடைத்த சந்தர்ப்பத்தைத் தனக்குச் சாதகமாகப் பயன்படுத்திக்கொள்ளுதல் என்ற தொடரின் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ τῆς ἐντολῆς
  choice: கட்டளையின் வழியாக
  rationale: διὰ என்பதன் கருவிசார் பொருளையும் ἐντολή என்பதன் ஒருமையையும் பாதுகாக்கிறது.
- source_word: ἐξηπάτησέν με
  choice: என்னை ஏமாற்றி
  rationale: வினையின் ஏமாற்றுதல் அல்லது வழிதவறச் செய்தல் என்ற மையப் பொருளை மிகைப்படுத்தாமல் தெளிவாகத் தருகிறது.
- source_word: δι’ αὐτῆς
  choice: அதன் வழியாக
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன்வந்த ‘கட்டளை’யைக் குறிக்கிறது; கருவிசார் உறவையும் மீளுரைப்பைத் தவிர்க்கும் மூலத்தின் வடிவத்தையும் காக்கிறது.
- source_word: ἀπέκτεινεν
  choice: என்னைக் கொன்றது
  rationale: ἀποκτείνω என்பதன் நேரடியான உயிரைப் போக்கும் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: பாவத்தைச் செயற்படும் ஆற்றலாக ஆளுருவாக்கிக் காட்டும் அளவு
  choice: பாவத்தை ‘பயன்படுத்திக்கொண்டது, ஏமாற்றியது, கொன்றது’ ஆகிய செயல்களின் எழுவாயாகவே வைத்தல்
  alternative: பாவத்தை வெறும் கருத்தாகக் காட்டும் வகையில் அதன் செயற்பாட்டை மென்மைப்படுத்துதல்
  rationale: கிரேக்கத்தில் பாவமே தொடர்ச்சியான செயல்களின் இலக்கண எழுவாய். ஆகவே விளக்கவுரை சேர்க்காமலும் அதன் தீவிரத்தைத் தணிக்காமலும் பவுலின் இறையியல் மற்றும் இலக்கிய அழுத்தம் பாதுகாக்கப்படுகிறது.
- issue: கட்டளைக்கும் மரணத்திற்கும் உள்ள கருவிசார் தொடர்பு
  choice: ‘கட்டளையின் வழியாக’ என்றும் ‘அதன் வழியாக’ என்றும் மொழிபெயர்த்து, பாவமே ஏமாற்றிக் கொல்லும் எழுவாய் என்பதைத் தெளிவாக வைத்தல்
  alternative: கட்டளையே நேரடியாகக் கொன்றதாக வெளிப்படுத்துதல்
  rationale: மூலத்தில் கொல்லும் செயலைச் செய்வது பாவம்; கட்டளை அதனால் பயன்படுத்தப்படும் வழி. இந்த வேறுபாட்டை மொழிபெயர்ப்பு தீர்க்கவோ மாற்றவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பாவம்’ செயற்படும் எழுவாயாக இருப்பதும், ‘கட்டளை’ கருவிசார் வழியாக இருப்பதும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
