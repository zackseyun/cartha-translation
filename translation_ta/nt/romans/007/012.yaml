id: ROM.7.12
reference: Romans 7:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: ta
  text: ஆகவே, சட்டம் பரிசுத்தமானது; கட்டளையும் பரிசுத்தமானதும் நீதியானதும் நல்லதுமானது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவைக் குறிக்கும் தொடர்பை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: νόμος
  choice: திருச்சட்டம்
  rationale: இச்சூழலில் மோசேயின் சட்டத்தைக் குறிக்கும் சொல்லாகத் தெளிவுபடுத்துகிறது; அதேவேளையில் வசனம் கூறுவதைவிட மேலதிக விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ἅγιος
  choice: பரிசுத்தமானது
  rationale: ஒதுக்கிவைக்கப்பட்ட தன்மையையும் ஒழுக்கத் தூய்மையையும் தாங்கும் நிலையான இறையியல் சொல்லாட்சி.
- source_word: ἐντολή
  choice: கட்டளை
  rationale: திருச்சட்டத்திற்குள் உள்ள குறிப்பிட்ட கட்டளையை இயல்பான, தெளிவான தமிழில் குறிக்கிறது.
- source_word: δικαία
  choice: நீதியானது
  rationale: கட்டளையின் நேர்மையான, நியாயத்துக்கேற்ற தன்மையைப் பவுலின் சொல்லாட்சிக்கு ஏற்றவாறு காக்கிறது.
- source_word: ἀγαθή
  choice: நல்லது
  rationale: ஒழுக்க நன்மையையும் பயனளிக்கும் தன்மையையும் தேவையற்ற விரிவாக்கமின்றி வெளிப்படுத்துகிறது.
- source_word: μὲν
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு வெளிப்படையான δέ எதிரிணை இல்லாததால், அதன் மெலிந்த வலியுறுத்தலைத் தமிழில் தனிச் சொல்லாகச் சேர்ப்பது செயற்கையாக இருக்கும்.
theological_decisions:
- issue: νόμος என்பதன் குறிப்பிடம்
  choice: திருச்சட்டம்
  alternative: சட்டம்
  rationale: ரோமர் 7-ன் சூழலில் இது மோசேயின் சட்டத்தைக் குறிக்கிறது. ‘திருச்சட்டம்’ அந்தச் சூழலை உணர்த்தினாலும், வசனத்தில் இல்லாத தனிப்பட்ட பிரிவையோ கோட்பாட்டையோ சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் முடிவுரைக் தொடர்பும், ‘திருச்சட்டம்’ மற்றும் ‘கட்டளை’ என்பவற்றின் வேறுபாடும், கட்டளைக்கு வழங்கப்படும் மூன்று இணை மதிப்பீடுகளும் காக்கப்பட்டுள்ளன.
