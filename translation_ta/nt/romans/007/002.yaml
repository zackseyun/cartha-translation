id: ROM.7.2
reference: Romans 7:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: ta
  text: ஏனெனில், திருமணமான பெண் தன் கணவன் உயிரோடிருக்கும் காலம்வரை சட்டத்தால் அவனுடன் பிணைக்கப்பட்டிருக்கிறாள்; ஆனால் கணவன் இறந்துவிட்டால், கணவனைச் சார்ந்த சட்டத்திலிருந்து அவள் விடுவிக்கப்படுகிறாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு விதமாக, “கணவனின் சட்டத்திலிருந்து.” இங்குள்ள கிரேக்கத் தொடர், கணவனோடு அவளைப் பிணைத்திருந்த திருமணச் சட்டக் கட்டுப்பாட்டைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: திருமணமான பெண்
  rationale: திருமண உறவின் கீழுள்ள பெண்ணைக் குறிக்கும் கிரேக்கச் சொற்றொடரைத் தெளிவான, நவீன தமிழில் அளிக்கிறது.
- source_word: τῷ ζῶντι ἀνδρί
  choice: தன் கணவன் உயிரோடிருக்கும் காலம்வரை அவனுடன்
  rationale: கணவன் உயிருடன் இருப்பதே சட்டப் பிணைப்பின் காலவரம்பு என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δέδεται
  choice: பிணைக்கப்பட்டிருக்கிறாள்
  rationale: கடந்த பிணைக்கும் செயலின் விளைவாகத் தொடரும் தற்போதைய நிலையைக் குறிக்கும் கிரேக்க நிறைவுக்கால வினையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: νόμῳ
  choice: சட்டத்தால்
  rationale: இங்கு குறிப்பாக மோசேயின் சட்டம் என்று முடிவுசெய்யாமல், திருமணத்தை ஒழுங்குபடுத்தும் சட்ட நியதியைப் பொதுவாகக் குறிக்கிறது.
- source_word: κατήργηται
  choice: விடுவிக்கப்படுகிறாள்
  rationale: அந்தச் சட்டத்தின் கட்டுப்பாடும் செயல்திறனும் அவள்மீது இனி இல்லை என்ற சட்டரீதியான விடுதலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: கணவனைச் சார்ந்த சட்டத்திலிருந்து
  rationale: சுருக்கமான கிரேக்க உடைமை வேற்றுமைத் தொடரின் தெளிவின்மையை ஓரளவு காத்து, கணவனே சட்டம் இயற்றுபவர் என்ற தவறான எண்ணத்தையும் தவிர்க்கிறது.
theological_decisions:
- issue: νόμῳ / τοῦ νόμου என்பது மோசேயின் சட்டத்தையா அல்லது திருமணத்தின் பொதுவான சட்டப் பிணைப்பையா குறிக்கிறது?
  choice: திருமணத்தைச் சார்ந்த பொதுவான சட்ட நியதி அல்லது சட்டப் பிணைப்பு
  alternative: திருமணத்திற்குப் பொருந்தும் மோசேயின் சட்டம்
  rationale: உடனடிச் சூழல் திருமணப் பிணைப்பையும் மரணத்தால் அதிலிருந்து ஏற்படும் விடுதலையையும் எடுத்துக்காட்டாகப் பயன்படுத்துகிறது; முதல் νόμῳ கட்டுரையின்றி இருப்பதும் பொதுவான சட்ட நியதி என்ற வாசிப்புக்கு ஏற்றதாகும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “பிரமாணம்” போன்ற பழைய சமய வழக்குச் சொல்லுக்குப் பதிலாக “சட்டம்” பயன்படுத்தப்பட்டுள்ளது; சட்ட மற்றும் திருமண உருவகம் காக்கப்பட்டுள்ளது.
