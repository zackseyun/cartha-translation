id: ROM.7.16
reference: Romans 7:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ θέλω τοῦτο ποιῶ, σύμφημι τῷ νόμῳ ὅτι καλός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: ta
  text: ஆனால், நான் விரும்பாததைச் செய்கிறேன் என்றால், சட்டம் நல்லது என்பதை ஒப்புக்கொள்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: ஆனால் … என்றால்
  rationale: εἰ என்பதன் நிபந்தனைப் பொருளையும் δέ என்பதன் மென்மையான மாறுபாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὃ … τοῦτο
  choice: விரும்பாததையே
  rationale: கிரேக்கத் தொடர்புறு–சுட்டு அமைப்பை தமிழில் இயல்பாக ஒருங்கிணைக்கிறது; ஏகார வலியுறுத்தல் τοῦτο-வின் சுட்டுப்பொருளைத் தெளிவாக்குகிறது.
- source_word: θέλω
  choice: விரும்பு
  rationale: செயலுக்கு மாறாக உள்ளார்ந்த விருப்பத்தைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: ποιῶ
  choice: செய்கிறேன்
  rationale: எளிய நிகழ்காலச் செயலை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: σύμφημι
  choice: ஒத்துக்கொள்கிறேன்
  rationale: திருச்சட்டத்தின் மதிப்பீட்டுடன் பேச்சாளர் உடன்படுகிறார் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τῷ νόμῳ
  choice: திருச்சட்டம் … அதனுடன்
  rationale: குறிப்பிட்ட νόμος-ஐ, இச்சூழலில் மோசேயின் சட்டமாகப் புரிந்துகொள்ளப்படும் அறியப்பட்ட கருத்தை, தமிழ் வேதாகம நடையில் தெளிவாகக் குறிக்கிறது.
- source_word: καλός
  choice: நல்லது
  rationale: சட்டத்தின் நேர்மறையான ஒழுக்கத் தன்மையை மிகைப்படுத்தாமல் நேரடியாகக் கூறுகிறது.
theological_decisions:
- issue: பவுலின் கூற்று திருச்சட்டத்தையே நல்லது என்று மதிப்பிடுகிறதா
  choice: திருச்சட்டம் நல்லது என்று அதனுடன் ஒத்துக்கொள்கிறேன்
  alternative: திருச்சட்டம் சரியானது என்று ஏற்றுக்கொள்கிறேன்
  rationale: καλός என்பதன் ‘நல்லது’ என்ற நேரடிப் பொருளையும், விருப்பத்துக்கும் செயலுக்கும் இடையிலான பதற்றத்தின் நடுவே சட்டத்தைப் பற்றிய நேர்மறை மதிப்பீட்டையும் விரிவாக்கமின்றிக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘திருச்சட்டம்’ என்பது νόμος-ஐ மதச்சூழலில் தெளிவாகக் குறிக்கிறது; வாக்கியத்தின் நிபந்தனை அமைப்பும் முதல் நபர் நிகழ்காலமும் பாதுகாக்கப்பட்டுள்ளன.
