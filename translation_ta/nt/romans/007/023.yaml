source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: ta
  text: ஆனால், என் உறுப்புகளில் வேறொரு சட்டத்தைக் காண்கிறேன்; அது என் மனதின் சட்டத்திற்கு எதிராகப் போராடி, என் உறுப்புகளில் இருக்கும் பாவத்தின் சட்டத்துக்குள்[b] என்னைச் சிறைப்படுத்துகிறது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனத்தில் மீண்டும் வரும் “சட்டம்” என்பதற்கு, சூழலைப் பொறுத்து “நியதி,” “கோட்பாடு,” அல்லது “சக்தி” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “பாவத்தின் சட்டத்தில்” என உள்ளது. “பாவத்தின் சட்டத்துக்குள்” என்பது அந்தச் சட்டத்தின் ஆட்சிக்குள் சிறைப்படுத்தப்படுதல் என்ற கருத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: காண்கிறேன்
  rationale: நிகழ்காலத்தில் பவுல் நேரடியாக உணர்ந்து காண்பதை எளிய, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἕτερον
  choice: வேறொரு
  rationale: முன்னர் குறிப்பிடப்பட்ட சட்டத்தோடு உள்ள வேறுபாட்டைக் கூடுதல் விளக்கமின்றி இயல்பாகக் காட்டுகிறது.
- source_word: νόμον / νόμῳ
  choice: சட்டம்
  rationale: νόμος மீண்டும் மீண்டும் வருவதால் உருவாகும் சொல்லாட்சியையும் இறையியல் இழுபறியையும் காக்க, எல்லா இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துகிறது.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: என் உறுப்புகளில்
  rationale: உடல் சார்ந்த பவுலின் உருவகத்தை ‘என் உடலில்’ என்று பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: ἀντιστρατευόμενον
  choice: எதிராகப் போரிட்டு
  rationale: மூலத்தில் உள்ள இராணுவப் படிமத்தைத் தெளிவாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: τοῦ νοός μου
  choice: என் மனதின்
  rationale: νοῦς குறிக்கும் சிந்திக்கும், தீர்மானிக்கும் உள்ளார்ந்த ஆற்றலை நேரடியாகவும் வாசிக்க எளிதாகவும் தெரிவிக்கிறது.
- source_word: αἰχμαλωτίζοντά με
  choice: என்னைச் சிறைப்பிடிக்கிற
  rationale: போரின் படிமத்தைத் தொடர்வதோடு, சிறைக்கைதியாக்கும் வலிமையான செயலை வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: பாவத்தின் சட்டத்துக்குள்
  rationale: ἐν என்பதன் அடிப்படை ‘உள்ளே/உட்பட்டு’ என்ற இடவியல் மற்றும் ஆட்சிக்குட்படும் நுணுக்கத்தைத் தமிழில் தக்கவைக்கிறது.
- source_word: ἁμαρτίας
  choice: பாவத்தின்
  rationale: இச்சூழலில் நிலையானதும் துல்லியமானதுமான தமிழ் இணைச்சொல்.
theological_decisions:
- issue: இவ்வசனத்தில் νόμος என்பதை ‘சட்டம்’ என மொழிபெயர்ப்பதா, ‘கோட்பாடு’ அல்லது ‘சக்தி’ என விளக்குவதா?
  choice: முதன்மை உரையில் எல்லா இடங்களிலும் ‘சட்டம்’ என்று மொழிபெயர்த்தல்.
  alternative: ஒன்று அல்லது அதற்கு மேற்பட்ட இடங்களில் ‘கோட்பாடு’, ‘நியதி’ அல்லது ‘சக்தி’ என்று மொழிபெயர்த்தல்.
  rationale: மீண்டும் வரும் νόμος என்ற சொல்லால் பவுல் உருவாக்கும் சொல்லாட்சியையும், மனதின் சட்டத்திற்கும் பாவத்தின் செயல்படும் எதிர்ச் சட்டத்திற்கும் இடையிலான இறையியல் இழுபறியையும் விளக்கத்தின் மூலம் முன்கூட்டியே தீர்த்துவிடாமல் காக்கிறது.
- issue: ἐν τῷ νόμῳ என்பதை இலக்கு அல்லது கீழ்ப்படிதல் என வெளிப்படையாக விளக்குவதா?
  choice: ‘பாவத்தின் சட்டத்துக்குள்’ என்று மொழிபெயர்த்து ἐν என்பதன் உருவகத்தை வைத்திருத்தல்.
  alternative: ‘பாவத்தின் சட்டத்துக்கு’ அல்லது ‘பாவத்தின் சட்டத்தின் கீழ்’ என்று மொழிபெயர்த்தல்.
  rationale: ‘சிறைப்பிடித்தல்’ என்ற படிமத்தோடு சேர்ந்து ஆட்சிக்குட்படுதல் என்ற பொருள் புரிந்தாலும், மூலத்தின் ἐν அமைப்பைத் தக்கவைத்து அதன் நுணுக்கத்தை ஒரே விளக்கமாகச் சுருக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘உறுப்புகள்,’ ‘போரிட்டு,’ ‘சிறைப்பிடிக்கிற’ ஆகிய சொற்கள் மூலத்தின் உடல் மற்றும் இராணுவ உருவகங்களைப் பாதுகாக்கின்றன. தமிழ் வாக்கிய ஓட்டத்திற்காகப் பெயரெச்சத் தொடர்கள் முன்வைக்கப்பட்டுள்ளன; மூலத்தின் முக்கிய சொல் மறுமொழி காக்கப்பட்டுள்ளது.
