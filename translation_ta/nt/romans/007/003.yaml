id: ROM.7.3
reference: Romans 7:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: ta
  text: ஆகவே, கணவன் உயிரோடிருக்கும்போது அவள் வேறொரு ஆணின் மனைவியானால்[a], விபசாரி என்று அழைக்கப்படுவாள். ஆனால் கணவன் இறந்துவிட்டால், அவள் அந்தச் சட்டத்திலிருந்து விடுதலையானவள்[b]; ஆகவே, வேறொரு ஆணின் மனைவியாகியிருந்தாலும் அவள் விபசாரி அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறொரு ஆணுக்கு உரியவளானால்” அல்லது “வேறொரு ஆணுடன் இணைந்தால்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “அந்தச் சட்டம்” என்பது உடனடியாகத் திருமண உறவைப் பிணைக்கும் சட்டத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: கணவன் உயிரோடிருக்கும்போது
  rationale: இணைநிகழ் காலச் சூழலைத் தெரிவிக்கும் genitive absolute அமைப்பைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: μοιχαλὶς
  choice: விபசாரி
  rationale: திருமண உறவை மீறிய பெண்ணைக் குறிக்கும் சொல்லின் பொருளைத் துல்லியமாகத் தருகிறது; தமிழில் பாலினம் சூழலால் தெளிவாகிறது.
- source_word: χρηματίσει
  choice: என்று அழைக்கப்படுவாள்
  rationale: இச்சூழலில் ‘அவ்வாறு அழைக்கப்படுதல்/கருதப்படுதல்’ என்ற designation பொருளையும் எதிர்காலத் தன்மையையும் காக்கிறது.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: வேறொரு ஆணுக்கு உரியவளானால் / உரியவளானாலும்
  rationale: γίνομαι உடன் வரும் dative குறிக்கும் உறவுநிலையைப் பாதுகாக்கிறது; ‘மனைவியானால்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத சொல்லைச் சேர்த்து மிகுதியாகக் குறிப்பதைக் தவிர்க்கிறது.
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: அவள் அந்தச் சட்டத்திலிருந்து விடுதலையானவள்
  rationale: சட்டத்தின் கட்டுப்பாட்டிலிருந்து விடுபட்ட நிலையைக் காட்டுகிறது; ‘அந்தச்’ என்பது உடனடி திருமணச் சட்டச் சூழலைச் சுட்டுகிறது, அதேவேளை νόμος என்பதைக் ‘சட்டம்’ என்றே வைத்திருக்கிறது.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: ஆகவே ... விபசாரி அல்ல
  rationale: articular infinitive-ன் விளைவு/தொடர்பு பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: νόμος என்பதன் பொருள் வரம்பு
  choice: முதன்மை உரையில் ‘அந்தச் சட்டம்’ என்று மொழிபெயர்த்து, அடிக்குறிப்பில் திருமண உறவைப் பிணைக்கும் சட்டம் என்பதைக் குறிப்பிடுதல்
  alternative: ‘திருமணச் சட்டம்’ என்று முதன்மை உரையிலேயே வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது பவுலின் விரிவான ‘நியாயப்பிரமாணம்’ கருத்தாக எடுத்தல்
  rationale: உடனடிச் சூழல் கணவன் உயிரோடிருப்பதாலும் இறப்பதாலும் மாறும் திருமணப் பிணைப்பைப் பற்றியது. இருப்பினும் νόμος என்பதின் பொதுவான வடிவத்தை முற்றிலும் விளக்கவுரையாக்காமல் காக்கிறது.
- issue: γένηται ἀνδρὶ ἑτέρῳ என்ற உறவின் தன்மை
  choice: ‘வேறொரு ஆணுக்கு உரியவளானால்’ என்று மொழிபெயர்த்தல்
  alternative: ‘வேறொரு ஆணின் மனைவியானால்’ அல்லது ‘வேறொரு ஆணுடன் இணைந்தால்’
  rationale: திருமண-சட்டச் சூழல் உறவைத் தெளிவாக்கினாலும், கிரேக்கம் ‘மனைவி’ என்ற பெயர்ச்சொல்லை நேரடியாகக் கூறவில்லை. தேர்ந்த மொழியாக்கம் அந்தத் தெளிவின்மையை ஓரளவு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விபசாரி’ என்பது துல்லியமானதாயினும் சற்றுக் கடுமையான சட்ட-நெறிசார் சொல்லாக இருப்பதால் மூலத்தின் வலிமையைப் பாதுகாக்கிறது. இரண்டு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம் பெற்றுள்ளன.
