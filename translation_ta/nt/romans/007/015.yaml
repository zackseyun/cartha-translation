id: ROM.7.15
reference: Romans 7:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: ta
  text: நான் செய்வது என்னவென்று எனக்குப் புரிவதில்லை. ஏனெனில், நான் விரும்புவதைச் செய்வதில்லை; மாறாக, நான் வெறுப்பதையே செய்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: நான் செய்வது
  rationale: இங்கு செயலாற்றுதல் அல்லது விளைவித்தல் என்ற பொருளுடைய சொல்லை, சூழலுக்கு இயல்பான பொதுவான தமிழில் வழங்குகிறது.
- source_word: οὐ γινώσκω
  choice: எனக்குப் புரிவதில்லை
  rationale: γινώσκω என்பதன் அடிப்படைப் பொருள் ‘அறிதல்’ என்றாலும், ஒருவர் தமது செயலைப் புரிந்துகொள்ள முடியாத உள்முரண்பாட்டை இங்கு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θέλω
  choice: நான் விரும்புவதை
  rationale: மனவிருப்பம் அல்லது நோக்கத்தைச் சுட்டும் சொல்லின் நேரடியான, தெளிவான தமிழ் வடிவம்.
- source_word: πράσσω / ποιῶ
  choice: செய்வதில்லை / செய்கிறேன்
  rationale: கிரேக்கத்தில் இரு வேறு செயல்வினைகள் உள்ளன; இச்சூழலில் அவற்றுக்கிடையிலான நுண்ணிய வேறுபாடு உறுதியல்ல. செயற்கையான வேறுபாட்டை உருவாக்காமல் தமிழில் ஒரே இயல்பான வினை பயன்படுத்தப்படுகிறது.
- source_word: μισῶ
  choice: நான் வெறுப்பதையே
  rationale: வலுவான எதிர்ப்பை நேரடியாகப் பாதுகாக்கிறது; ‘-ஏ’ என்பது τοῦτο தரும் வலியுறுத்தலை எடுத்துரைக்கிறது.
theological_decisions:
- issue: பேசுபவரின் அடையாளமும் அனுபவத்தின் காலநிலையும்
  choice: வசனத்தில் உள்ள முதல் நபர் உரையை அதன் இயல்பான வடிவிலேயே வைத்தல்
  alternative: இது மனந்திரும்புதலுக்கு முந்தைய அல்லது பிந்தைய அனுபவம் என மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: இந்த வசனம் மட்டும் பேசுபவரின் நிலையைத் தீர்மானிக்கவில்லை; நீண்டகால விளக்கவுரை விவாதத்தை மொழிபெயர்ப்பில் முடிவு செய்யாமல் விடுகிறது.
- issue: γάρ என்பதன் உறவு
  choice: ஏனெனில்
  alternative: உண்மையில் / ஆகவே
  rationale: இரண்டாம் கூற்று முதல் கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ தருவதைத் தெளிவாகப் பிரதிபலிக்கிறது; ஆங்கில ஆலோசனை உரையுடனும் பொருந்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் அதே நேரத்தில் கண்ணியமாகவும் அமைந்த உரை. மூலத்தின் உள்முரண்பாடும் ‘விரும்புவது—வெறுப்பது’ என்ற எதிர்மறை இணையும் பாதுகாக்கப்பட்டுள்ளன.
