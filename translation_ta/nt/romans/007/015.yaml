  source_fidelity: 'மூலத்தின் தொடர்ச்சியான முதல் நபர் உள்முரண்பாடு துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளது: செய்கிறதைப் புரிந்துகொள்ளாமை, விரும்பியதைச் செய்யாமை, வெறுப்பதையே செய்தல் ஆகிய மூன்று கூறுகளும் உள்ளன. δεύτερο γάρ-இன் விளக்க/காரண உறவை “ஏனெனில்” இயல்பாகத் தருகிறது. πράσσω மற்றும் ποιῶ இடையிலான இச்சூழலில் உறுதியற்ற நுண்வேறுபாட்டைத் தமிழில் செயற்கையாக வேறுபடுத்தவில்லை.'
  naturalness: “நான் செய்வது என்னவென்று எனக்குப் புரிவதில்லை” என்பது நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. “மாறாக” மூலம் எதிர்மறைத் திருப்பம் தெளிவாகிறது; வாக்கியம் கண்ணியமான பொதுவாசகர் பதிவில் அமைந்துள்ளது.
  terminology: “விரும்புவது,” “வெறுப்பது,” “செய்வது,” “புரிவதில்லை” ஆகியவை பொருளுக்கு நேர்மையான, சமயவியல் விளக்கத்தைத் திணிக்காத சொற்கள். “வெறுப்பதையே” என்பதிலுள்ள வலியுறுத்தல் τοῦτο-வின் சுட்டுதலைப் போதுமான அளவு வெளிப்படுத்துகிறது.
