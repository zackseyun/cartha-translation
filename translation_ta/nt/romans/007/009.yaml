reference: Romans 7:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: ta
  text: ஒரு காலத்தில் நான் திருச்சட்டத்துக்கு அப்பாற்பட்டு உயிரோடு இருந்தேன்; ஆனால் கட்டளை வந்தபோது, பாவம் உயிர்பெற்றது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவம் மீண்டும் உயிர்பெற்றது.”
    reason: ἀνέζησεν என்பது ‘உயிர்பெற்றது’ அல்லது ‘மீண்டும் உயிர்பெற்றது’ எனப் பொருள்படலாம்.
lexical_decisions:
- source_word: ἔζων
  choice: உயிரோடு இருந்தேன்
  rationale: வெறுமனே ‘வாழ்ந்தேன்’ என்பதற்குப் பதிலாக, அடுத்தடுத்த வசனங்களில் வரும் வாழ்வு–இறப்பு முரண்பாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: χωρὶς νόμου
  choice: திருச்சட்டத்துக்கு அப்பாற்பட்டு
  rationale: χωρίς என்பதன் பிரிவைக் குறிக்கும் பொருளைப் பாதுகாக்கிறது; இச்சூழலில் νόμος மோசேயின் திருச்சட்டத்தைக் குறிப்பதாக இயல்பாகப் புரிகிறது.
- source_word: ποτέ
  choice: ஒரு காலத்தில்
  rationale: பவுல் பின்னோக்கிக் குறிப்பிடும் காலத்தைக் காட்டும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: கட்டளை வந்தபோது
  rationale: கிரேக்க genitive absolute அமைப்பை அதன் காலப்பொருளையும் நிகழ்வுத் தன்மையையும் காத்து இயல்பான தமிழில் தருகிறது.
- source_word: ἐντολῆς
  choice: கட்டளை
  rationale: νόμος என்பதிலிருந்து வேறுபாட்டைக் காத்து, குறிப்பிட்ட ஆணையைச் சுட்டும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἁμαρτία
  choice: பாவம்
  rationale: பவுலின் உருவக ஆளுமைப்படுத்தலைக் காக்கும் வகையில் ஒருமையிலேயே தரப்பட்டுள்ளது.
- source_word: ἀνέζησεν
  choice: உயிர்பெற்றது
  rationale: ஆளுமைப்படுத்தப்பட்ட பாவம் உயிரடைந்தது என்ற உருவகத்தை இயல்பான தமிழில் தருகிறது; ‘மீண்டும் உயிர்பெற்றது’ என்பதும் சொற்பிறப்பியல் ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: பவுலின் ‘நான்’ என்பது தனிப்பட்ட சுயசரிதையா, இஸ்ரவேலை அல்லது மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்தும் கூற்றா?
  choice: முதலாம் நபர் ஒருமையை எந்த விளக்க விரிவாக்கமும் இன்றி அப்படியே வைத்தல்
  alternative: இதைப் பவுலின் தனிப்பட்ட அனுபவமாகவோ, இஸ்ரவேல் அல்லது மனிதகுலத்தின் பிரதிநிதிக் கூற்றாகவோ வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: இந்த வசனத்தின் கிரேக்க உரை மட்டும் அந்தப் பெரிய விளக்கக் கேள்வியைத் தீர்மானிக்கவில்லை; ஆகவே மொழிபெயர்ப்பு அதன் இறையியல் பதற்றத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. வாழ்வு–இறப்பு உருவகமும் பாவத்தின் ஆளுமைப்படுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
