id: ROM.8.14
reference: Romans 8:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: ta
  text: ஏனெனில், கடவுளின் ஆவியால் வழிநடத்தப்படுகிறவர்கள் எவர்களோ, அவர்களே கடவுளின் மகன்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் பிள்ளைகள்.” “மகன்கள்” என்பது கிரேக்கச் சொல்லை அப்படியே பிரதிபலிப்பதுடன், இச்சூழலில் உள்ள தத்தெடுப்பு மற்றும் உரிமைப்பேறு நுணுக்கத்தையும் காக்கிறது; இங்கு பெண்களும் உட்பட கடவுளுக்குரிய அனைவரும் குறிக்கப்படுகிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: எவர்களோ
  rationale: பன்மைத் தொடர்புக் கட்டமைப்பின் முழு வகுப்பையும் உள்ளடக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பின்னர் வரும் οὗτοι என்பதுடன் ‘எவர்களோ, அவர்களே’ என்று இணைகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்தோடு இவ்வாக்கியத்தை இணைக்கும் விளக்கக் காரணப் பொருளைப் பாதுகாக்கிறது.
- source_word: πνεύματι θεοῦ
  choice: கடவுளின் ஆவியால்
  rationale: ἄγονται என்பதோடு சேர்ந்த கருவிப் பொருளுடைய வேற்றுமையை ‘ஆவியால்’ எனவும், மூலத்தின் இறைச் சொற்றொடரை ‘கடவுளின் ஆவி’ எனவும் தெளிவாகக் காட்டுகிறது.
- source_word: ἄγονται
  choice: வழிநடத்தப்படுகிறவர்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் தொடரும் தன்மையையும், செயலைப் பெறும் நிலையைவும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: οὗτοι
  choice: அவர்களே
  rationale: கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதியால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: υἱοί
  choice: மகன்கள்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மையைத் துல்லியமாகக் காக்கிறது; ரோமர் 8-இன் தத்தெடுப்பு மற்றும் உரிமைப்பேறு சார்ந்த மகன்-நிலை நுணுக்கத்தையும் சுருக்காமல் விடுகிறது.
- source_word: θεοῦ
  choice: கடவுளின்
  rationale: இரு இடங்களிலும் வரும் மரபுத்தொடரை நேரடியாகவும் ஒரே விதமாகவும் வழங்குகிறது.
theological_decisions:
- issue: υἱοί θεοῦ என்பதை ‘கடவுளின் மகன்கள்’ எனவா அல்லது அனைவரையும் வெளிப்படையாக உள்ளடக்கும் சொல்லால் மொழிபெயர்ப்பதா?
  choice: கடவுளின் மகன்கள்
  alternative: கடவுளின் பிள்ளைகள்
  rationale: மூல உரை υἱοί என்ற ஆண்பால் பன்மையைப் பயன்படுத்துகிறது; சூழலில் தத்தெடுப்பு மற்றும் உரிமைப்பேறு சார்ந்த மகன்-நிலை ஒலிப்பும் உள்ளது. ஆகவே முதன்மை உரையில் ‘மகன்கள்’ வைக்கப்பட்டு, இங்கு பெண்களும் உட்பட கடவுளுக்குரிய அனைவரும் குறிக்கப்படலாம் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘எவர்களோ, அவர்களே’ என்ற அமைப்பு மூலத்தின் தொடர்பு மற்றும் சுட்டு வலியுறுத்தலை இயல்பாகக் காக்கிறது.
