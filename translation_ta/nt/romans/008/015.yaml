id: ROM.8.15
reference: Romans 8:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: ta
  text: ஏனெனில், மீண்டும் அச்சத்திற்குள் கொண்டுசெல்லும் அடிமைத்தனத்தின் ஆவியை நீங்கள் பெற்றுக்கொள்ளவில்லை. மாறாக, மகன்களாகத் தத்தெடுக்கப்படுதலின் ஆவியைப் பெற்றுக்கொண்டீர்கள்[a]. அந்த ஆவியால்[b] நாம், “அப்பா! தந்தையே!” என்று கூக்குரலிடுகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகன்களாகத் தத்தெடுக்கப்படுதல்’ என்பது சட்டபூர்வமான மகன்-நிலையையும் அதனுடன் தொடர்புடைய வாரிசுரிமையையும் குறிக்கிறது. இதை ‘தத்தெடுக்கப்பட்ட மகன்-நிலை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் சொற்சொல்லாக, ‘அந்த ஆவியில்.’ இங்குள்ள கிரேக்கத் தொடர்புச்சொல் ‘ஆவி’ என்பதோடு ஒத்துப்போக நடுநிலை வடிவில் உள்ளது; சூழலில் பரிசுத்த ஆவியைத் தனிப்பட்டவராகக் குறித்தால், ‘அவரால்’ என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: அடிமைத்தனத்தின் ஆவி
  rationale: πνεῦμα என்பதை ‘ஆவி’ என்றும் δουλεία என்பதன் அடிமைப்பட்ட நிலையை ‘அடிமைத்தனம்’ என்றும் மொழிபெயர்த்து, அடுத்துள்ள தத்தெடுக்கப்பட்ட உரிமைநிலையோடு காணப்படும் முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: πάλιν εἰς φόβον
  choice: மீண்டும் அச்சத்திற்குள் கொண்டுசெல்லும்
  rationale: πάλιν என்பதன் ‘மீண்டும்’ என்ற பொருளையும் εἰς φόβον என்பதன் ‘அச்சத்திற்குள்’ என்ற திசைநோக்கிய வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: πνεῦμα υἱοθεσίας
  choice: மகன்களாகத் தத்தெடுக்கப்பட்ட உரிமைநிலையின் ஆவி
  rationale: υἱοθεσία குறிக்கும் சட்டபூர்வமான மகன்-நிலையையும் அதனுடன் தொடர்புடைய உரிமையையும் வெளிப்படுத்துகிறது; அதேவேளையில் πνεῦμα என்பதைக் ‘ஆவி’ எனவே வைத்திருக்கிறது.
- source_word: ἐν ᾧ
  choice: அந்த ஆவியால்
  rationale: சூழலில் ஆவியின் செயலால் இந்தக் கூக்குரல் எழுகிறது என்ற கருவிப் பொருளை இயல்பான தமிழில் தருகிறது; ‘அந்த ஆவியில்’ என்ற நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κράζομεν
  choice: நாம் ... கூக்குரலிடுகிறோம்
  rationale: வினைச்சொல்லின் வலிமையான, உள்ளார்ந்த அழைப்புத் தன்மையைப் பாதுகாக்கிறது.
- source_word: Αββα ὁ πατήρ
  choice: அப்பா! தந்தையே!
  rationale: அரமேய அழைப்பான Αββα-வை ‘அப்பா’ எனவும் அதை விளக்கும் கிரேக்க ὁ πατήρ-ஐ ‘தந்தையே’ எனவும் தருவதால் இரட்டை அழைப்பும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: πνεῦμα υἱοθεσίας என்பது பரிசுத்த ஆவியை நேரடியாகக் குறிக்கிறதா, அல்லது தத்தெடுக்கப்பட்ட மகன்-நிலைக்குரிய ஆவியை இணை அமைப்பில் கூறுகிறதா?
  choice: முதன்மை உரையில் ‘மகன்களாகத் தத்தெடுக்கப்பட்ட உரிமைநிலையின் ஆவி’ என்று மொழிபெயர்த்து, ஆவியின் தனிப்பட்ட செயலைச் சூழல் உணர்த்த அனுமதிக்கப்பட்டுள்ளது.
  alternative: ‘மகன்களாகத் தத்தெடுக்கும் பரிசுத்த ஆவி’
  rationale: ரோமர் 8-ன் சூழல் பரிசுத்த ஆவியை வலுவாகச் சுட்டினாலும், மூலத்தில் ‘அடிமைத்தனத்தின் ஆவி’ என்பதோடு உள்ள இணை அமைப்பையும் பெயர்ச்சொல் தொடரின் தெளிவின்மையையும் வெளிப்படையாகத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: υἱοθεσία என்பதில் உள்ள ஆண்பால் மகன்-நிலையும் சட்டபூர்வ வாரிசுரிமை நுணுக்கமும்
  choice: ‘மகன்களாகத் தத்தெடுக்கப்பட்ட உரிமைநிலை’
  alternative: ‘தத்தெடுக்கப்பட்ட பிள்ளைநிலை’
  rationale: பவுலின் காலச் சட்டச் சூழலில் மகனுக்குரிய நிலை மற்றும் வாரிசுரிமை சார்ந்த நுணுக்கத்தைப் பாதுகாக்க ஆண்பால் வடிவம் வைக்கப்பட்டுள்ளது; இது இரட்சிப்பு ஆண்களுக்கு மட்டும் என்ற பொருளை அளிப்பதற்கல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பழமையான ‘புத்திரசுவிகாரம்’ போன்ற சொல் தவிர்க்கப்பட்டு, υἱοθεσία-வின் சட்ட மற்றும் வாரிசுரிமை நுணுக்கம் விளக்கமான தொடரால் பாதுகாக்கப்பட்டது. ‘ஆவி’ தொடர்பான மூலமொழியின் பொருள் விரிவை உரையும் அடிக்குறிப்பும் இணைந்து தக்கவைக்கின்றன.
