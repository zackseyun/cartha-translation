  source_fidelity: 'மூலத்தின் இணை அமைப்பும் எதிரிணையும் துல்லியமாகத் தக்கவைக்கப்பட்டுள்ளன: κατὰ σάρκα / κατὰ πνεῦμα என்பவை ‘மாம்சத்தின்படி / ஆவியின்படி’ என்றும், τὰ τῆς σαρκὸς / τὰ τοῦ πνεύματος என்பவை ‘மாம்சத்துக்குரியவை / ஆவிக்குரியவை’ என்றும் இயல்பாகத் தரப்பட்டுள்ளன. ‘வாழ்கிறவர்கள்’ என்பது ὄντες என்பதின் சொல்லுக்குச்சொல் வடிவத்தைவிட விளக்கமானது; ஆயினும் ஆங்கில POB audit trail-உடன் ஒத்துப்போகிறது மற்றும் இச்சூழலில் வாழ்க்கைநிலையைக் குறிக்கும் பாதுகாப்பான மொழியாக்கம். ‘எண்ணுகிறார்கள்’ φρονοῦσιν என்பதன் மனப்போக்கு/அக்கறை நுணுக்கத்தை முழுமையாக விரிவாக்காமல், ஏற்ற அளவில் காக்கிறது.'
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் சமச்சீராகவும் உள்ளது. இரு கூறுகளிலும் ‘வாழ்கிறவர்கள் ... எண்ணுகிறார்கள்’ என்ற மறுமொழி பவுலின் வாதநடையை நன்றாக வெளிப்படுத்துகிறது. ‘-வற்றையே’ வலியுறுத்தல் மூலத்தின் தனிப் பிரதான வலியுறுத்தலைச் சேர்க்கவில்லை என்றாலும், தமிழில் எதிரிணையைச் செம்மையாக்கும் இயல்பான நடை; பொருளை மாற்றுவதில்லை.
