id: ROM.8.5
reference: Romans 8:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: ta
  text: ஏனெனில், மாம்சத்தின்படி வாழ்கிறவர்கள் மாம்சத்துக்குரியவற்றையே எண்ணுகிறார்கள்; ஆனால் ஆவியின்படி வாழ்கிறவர்கள் ஆவிக்குரியவற்றையே எண்ணுகிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: மாம்சத்தின்படி வாழ்கிறவர்கள்
  rationale: சொல்லர்த்தமாக ‘மாம்சத்தின்படி இருப்பவர்கள்’ என்றாலும், இங்கு வாழ்க்கையின் போக்கையும் நிலைப்பாட்டையும் குறிக்கும் இயல்பான தமிழாக ‘வாழ்கிறவர்கள்’ பயன்படுத்தப்பட்டது. σάρξ என்பதன் பவுலின் கருத்துச் செறிவை காக்க ‘மாம்சம்’ தக்கவைக்கப்பட்டது.
- source_word: τὰ τῆς σαρκὸς
  choice: மாம்சத்துக்குரியவற்றையே
  rationale: உடைமைத் தொடர்புடைய கிரேக்க அமைப்பை இயல்பான தமிழில் ‘மாம்சத்துக்குரியவை’ எனத் தருகிறது; எதிரெதிர் அமைப்பை வலுப்படுத்த ‘-ஏ’ பயன்படுத்தப்பட்டது.
- source_word: φρονοῦσιν
  choice: எண்ணுகிறார்கள்
  rationale: இச்சொல் வெறும் தற்செயல் சிந்தனையை அல்லாமல் மனப்போக்கு, அக்கறை, நோக்கம் ஆகியவற்றையும் உள்ளடக்கலாம். சூழலில் சுருக்கமாகவும் தெளிவாகவும் ‘எண்ணுகிறார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: κατὰ πνεῦμα
  choice: ஆவியின்படி
  rationale: πνεῦμα இங்கு பரிசுத்த ஆவியைக் குறிக்கக்கூடியதாக இருந்தாலும், கிரேக்கத்தில் பெயருக்கு முன் உருபு இல்லை. மூலத்தின் வடிவத்தையும் இணை அமைப்பையும் காக்க ‘ஆவியின்படி’ என வழங்கப்பட்டது.
- source_word: τὰ τοῦ πνεύματος
  choice: ஆவிக்குரியவற்றையே
  rationale: முதல் கூறுடன் உள்ள நேரடியான எதிரிணையைத் தக்கவைத்து, ஆவியுடன் தொடர்புடையவற்றை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: σάρξ என்பதன் பொருள்
  choice: மாம்சம்
  alternative: பாவ இயல்பு / மனித இயல்பு
  rationale: ‘பாவ இயல்பு’ போன்ற விளக்க மொழிபெயர்ப்பு கருத்தை முன்கூட்டியே குறுக்கிவிடும். பவுலின் σάρξ சொல்லில் உள்ள உடல், மனித பலவீனம், தேவனுக்கு எதிரான வாழ்க்கைநிலை ஆகிய தொடர்புகளின் பதற்றத்தை ‘மாம்சம்’ பாதுகாக்கிறது.
- issue: πνεῦμα என்பது பரிசுத்த ஆவியா அல்லது மனித ஆவியா
  choice: ஆவி
  alternative: பரிசுத்த ஆவி / மனித ஆவி
  rationale: சூழல் பரிசுத்த ஆவியை வலுவாகச் சுட்டினாலும், இவ்வசனத்தின் கிரேக்க வடிவத்தில் உள்ள சுருக்கத்தையும் சிறிதளவு ambiguity-யையும் காக்க விளக்கச் சேர்க்கை தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் பவுலின் ‘மாம்சம்—ஆவி’ எதிரிணையைத் தக்கவைக்கும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தின் இரு இணை கூறுகளும் தமிழில் சமச்சீராக அமைக்கப்பட்டுள்ளன.
