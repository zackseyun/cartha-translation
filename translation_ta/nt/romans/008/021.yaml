id: ROM.8.21
reference: Romans 8:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: ta
  text: ஏனெனில், படைப்பேகூட சிதைவின் அடிமைத்தனத்திலிருந்து கடவுளுடைய பிள்ளைகளின் மகிமையின் சுதந்திரத்திற்குள் விடுவிக்கப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய பிள்ளைகளுக்குரிய மகிமைமிக்க சுதந்திரத்திற்குள்.”
    reason: τῆς δόξης என்ற உரிமைவேற்றுமையைப் பண்புப்பெயர் பொருளில் புரிந்துகொள்ளும் இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நம்பிக்கைக்கான காரணத்தை அறிமுகப்படுத்தும் சொல்லாக இங்கு இயல்பாக அமைகிறது.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: படைப்பேகூட
  rationale: καὶ என்பதன் சேர்க்கைப் பொருளையும் αὐτὴ என்பதன் வலியுறுத்தலையும் சுருக்கமான, இயல்பான தமிழில் காக்கிறது; κτίσις இச்சூழலில் படைக்கப்பட்ட உலகம் முழுவதையும் குறிக்கிறது.
- source_word: ἐλευθερωθήσεται
  choice: விடுவிக்கப்பட்டு ... கொண்டுவரப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, படைப்பு தானாக விடுபடாமல் விடுவிக்கப்படும் என்பதைத் தெரிவிக்கிறது; εἰς குறிக்கும் புதிய நிலைக்குள் நுழைவதையும் ‘கொண்டுவரப்படும்’ தெளிவாக்குகிறது.
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: சிதைவின் அடிமைத்தனத்திலிருந்து
  rationale: δουλεία என்பதன் வலுவான அடிமைத்தன உருவகத்தைக் காக்கிறது. படைப்புலகச் சூழலில் φθορά என்பது முதன்மையாக அழுகை, நிலையின்மை, சிதைவு ஆகியவற்றைக் குறிப்பதால் ‘சிதைவு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: சுதந்திரத்திற்குள்
  rationale: εἰς குறிக்கும் ஒரு புதிய நிலைக்குள் செல்லும் இயக்கத்தைப் பாதுகாக்கிறது.
- source_word: τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: கடவுளின் பிள்ளைகளுடைய மகிமையின்
  rationale: கிரேக்க மூலத்தின் தொடர் உரிமைவேற்றுமை அமைப்பை இயன்றவரை காத்து, மகிமைக்கும் சுதந்திரத்திற்கும் உள்ள உறவை ஒரே விதமாகத் தீர்மானிக்காமல் விடுகிறது. τέκνα பாலினம் சாராத குடும்ப உறவைக் குறிப்பதால் ‘பிள்ளைகள்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ என்ற தொடர் உரிமைவேற்றுமை அமைப்பை எவ்வாறு மொழிபெயர்ப்பது
  choice: கடவுளின் பிள்ளைகளுடைய மகிமையின் சுதந்திரம்
  alternative: கடவுளின் பிள்ளைகளுக்குரிய மகிமைமிக்க சுதந்திரம்
  rationale: முதன்மை உரை கிரேக்க அமைப்பையும் அதன் உண்மையான பொருள் நுணுக்கத்தையும் காக்கிறது; மாற்று வாசகம் இயல்பான தமிழில் பண்புப்பெயர் சார்ந்த புரிதலைக் காட்டுகிறது, ஆனால் அதை மட்டுமே கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘படைப்பேகூட’ வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது; ‘சிதைவின் அடிமைத்தனம்’ மூலத்தின் வலுவான உருவகத்தை மென்மைப்படுத்தாமல் காக்கிறது.
