revisions:
- from: ஏனெனில், படைப்பேகூட சிதைவின் அடிமைத்தனத்திலிருந்து விடுவிக்கப்பட்டு, கடவுளின் பிள்ளைகளுடைய மகிமையின் சுதந்திரத்திற்குள் கொண்டுவரப்படும்.[a]
  to: ஏனெனில், படைப்பேகூட சிதைவின் அடிமைத்தனத்திலிருந்து கடவுளுடைய பிள்ளைகளின் மகிமையின் சுதந்திரத்திற்குள் விடுவிக்கப்படும்.[a]
