revisions:
- from: இதயங்களை ஆராய்கிறவர், ஆவியானவரின் சிந்தை என்ன என்பதை அறிந்திருக்கிறார்; ஏனெனில், அவர் கடவுளுக்கு ஏற்பப் பரிசுத்தவான்களுக்காகப் பரிந்துபேசுகிறார்.[a]
  to: இதயங்களை ஆராய்கிறவர், ஆவியானவரின் சிந்தை என்னவென்று அறிந்திருக்கிறார்; ஏனெனில், ஆவியானவர் பரிசுத்த மக்களுக்காகக் கடவுளுக்கு இசைவாக[a]ப் பரிந்துபேசுகிறார்.
  rationale: The Spirit is explicitly named as the subject of intercession to prevent a misleading Tamil antecedent. ‘கடவுளுக்கு இசைவாக’ gives a natural equivalent for κατὰ θεόν without importing ‘சித்தம்’ into the main text. The footnote is anchored directly to that phrase and preserves the common explanatory rendering.
