    text: அல்லது, “கடவுளுடைய சித்தத்தின்படி.”
    reason: lexical_alternative
  revision_rationale: The Spirit is explicitly named as the subject of intercession to prevent a misleading Tamil antecedent. ‘கடவுளுக்கு இசைவாக’ gives a natural equivalent for κατὰ θεόν without importing ‘சித்தம்’ into the main text. The footnote is anchored directly to that phrase and preserves the common explanatory rendering.
