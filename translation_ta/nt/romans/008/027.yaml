source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: ta
  text: இதயங்களை ஆராய்கிறவர், ஆவியானவரின் சிந்தை என்னவென்று அறிந்திருக்கிறார்; ஏனெனில், ஆவியானவர் பரிசுத்த மக்களுக்காகக் கடவுளுக்கு இசைவாக[a]ப் பரிந்துபேசுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய சித்தத்தின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐραυνῶν
  choice: ஆராய்கிறவர்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான, ஆழ்ந்து தேடும் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: καρδίας
  choice: இதயங்களை
  rationale: மனிதரின் உள்ளார்ந்த மையத்தைக் குறிக்கும் மூலமொழி உருவகத்தை விரிவாக்காமல் பாதுகாக்கிறது.
- source_word: τί τὸ φρόνημα
  choice: சிந்தை என்ன
  rationale: வெறும் அறிவைக் காட்டிலும் எண்ணப்போக்கு, நோக்கு ஆகியவற்றை உள்ளடக்கும் φρόνημα என்பதற்கு இயல்பானதும் சூழலுக்கேற்றதுமான தமிழ்.
- source_word: τοῦ πνεύματος
  choice: ஆவியானவரின்
  rationale: ரோமர் 8-ன் உடனடிச் சூழலில் இது பரிசுத்த ஆவியானவரைக் குறிக்கிறது; தமிழ் மரியாதைமிக்க ஆளுமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐντυγχάνει
  choice: பரிந்துபேசுகிறார்
  rationale: முந்தைய வசனத்துடன் தொடர்புடைய வேண்டுதல் மற்றும் பிறருக்காக மன்றாடுதல் என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: ὑπὲρ ἁγίων
  choice: பரிசுத்தவான்களுக்காக
  rationale: ὑπέρ + ஆறாம் வேற்றுமையின் ‘சார்பாக/நலனுக்காக’ என்ற பொருளையும் பவுலின் ἅγιοι என்ற வழக்குச் சொல்லையும் தக்கவைக்கிறது.
- source_word: κατὰ θεὸν
  choice: கடவுளுக்கு ஏற்ப
  rationale: ‘சித்தம்’ என்று மூலத்தில் இல்லாத சொல்லை முதன்மை உரையில் சேர்க்காமல், சுருக்கமான கிரேக்கச் சொற்றொடரின் திறந்த பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: κατὰ θεὸν என்பதை ‘கடவுளுடைய சித்தத்தின்படி’ என்று வெளிப்படையாக்கலாமா?
  choice: கடவுளுக்கு ஏற்ப
  alternative: கடவுளுடைய சித்தத்தின்படி
  rationale: சூழலில் கடவுளின் சித்தத்துடன் ஒத்திசைவு என்பது இயல்பான விளக்கம்; எனினும் θεὸν மட்டும் உள்ளது, ‘சித்தம்’ என்பதற்கான சொல் இல்லை. ஆகவே முதன்மை உரை மூலத்தின் சுருக்கத்தையும் இறையியல் திறந்தநிலையையும் காக்கிறது; பொதுவான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியும், மரியாதைமிக்க வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஆவியானவர்’ என்பது சூழலில் பரிசுத்த ஆவியைத் தெளிவுபடுத்துகிறது; ‘சிந்தை’ φρόνημα என்பதன் எண்ணப்போக்கு/நோக்கு நுணுக்கத்தைச் சுருக்கமாகக் காக்கிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் κατὰ θεὸν சொற்றொடருக்குப் பிந்தைய வாக்கிய முடிவில் இடப்பட்டுள்ளது.
