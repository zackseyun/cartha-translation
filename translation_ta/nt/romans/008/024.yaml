id: ROM.8.24
reference: Romans 8:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: ta
  text: ஏனெனில், நம்பிக்கையில் நாம் மீட்கப்பட்டோம்.[a] ஆனால், கண்ணுக்குத் தெரிகிற நம்பிக்கை நம்பிக்கையே அல்ல.[b] ஒருவர் தான் காண்பதை எதிர்நோக்குவாரா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பிக்கையினால் நாம் மீட்கப்பட்டோம்.”
    reason: alternative_reading
  - marker: b
    text: அதாவது, இன்னும் காணப்படாததையே நம்பிக்கை எதிர்நோக்குகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: நம்பிக்கையில்
  rationale: வேற்றுமை உருபை நம்பிக்கை நிலவும் சூழல் அல்லது நிலையாகப் புரிந்துகொண்டு மொழிபெயர்க்கிறது. இதனால் மீட்பு இப்போதே உண்மையானது என்றாலும் அதன் முழுநிறைவு இன்னும் காணப்படவில்லை என்ற பவுலின் அழுத்தம் நிலைக்கிறது; நம்பிக்கையே மீட்பின் கருவி அல்லது காரணம் என்று கூறப்படவில்லை.
- source_word: ἐσώθημεν
  choice: நாம் மீட்கப்பட்டோம்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் தக்கவைக்கிறது; செய்பவரை உரையில் சேர்க்கவில்லை.
- source_word: ἐλπὶς ... βλεπομένη
  choice: கண்ணுக்குத் தெரிகிற நம்பிக்கை
  rationale: நிகழ்காலச் செயப்பாட்டு எச்சத்தின் பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, நம்பிக்கைக்கும் காண்பதற்கும் உள்ள முரண்பாட்டைக் காக்கிறது.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: நம்பிக்கையே அல்ல
  rationale: கிரேக்கத்தின் தரவகை மறுப்பைத் தெளிவான, அழுத்தமுள்ள தமிழில் தருகிறது.
- source_word: ὃ γὰρ βλέπει τίς ἐλπίζει;
  choice: ஒருவர் தான் காண்பதை எதிர்நோக்குவாரா?
  rationale: கிரேக்க வினாவை பாலினம் சாராத இயல்பான தமிழில் தருகிறது. இங்கு ἐλπίζει என்பதற்கு மீண்டும் ‘நம்பிக்கை வைப்பார்’ என்பதற்குப் பதில், இன்னும் கிடைக்காத ஒன்றை நோக்கியிருக்கும் பொருளைத் தெளிவாக்க ‘எதிர்நோக்குவார்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: τῇ ἐλπίδι ἐσώθημεν என்பதில் மீட்புக்கும் நம்பிக்கைக்கும் உள்ள உறவு
  choice: முதன்மை உரையில் ‘நம்பிக்கையில் நாம் மீட்கப்பட்டோம்’ என்று கொடுத்து, மீட்பு இப்போது பெற்ற உண்மை என்றாலும் அதன் முழுநிறைவு இன்னும் எதிர்நோக்கப்படுகிறது என்ற பதற்றத்தைப் பாதுகாத்தல்
  alternative: ‘நம்பிக்கையினால் நாம் மீட்கப்பட்டோம்’ என்று நம்பிக்கையை ஒரு கருவியாகக் காட்டக்கூடிய மொழிபெயர்ப்பு
  rationale: சுற்றியுள்ள பகுதி ஏற்கெனவே பெற்ற மீட்பையும் இன்னும் காணப்படாத அதன் நிறைவையும் இணைக்கிறது. ‘நம்பிக்கையில்’ என்பது நம்பிக்கையை மீட்பின் செயல்திறன் வாய்ந்த காரணமாகக் கூறாமல் அந்த ஏற்கெனவே/இன்னும் இல்லை என்ற இறையியல் பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நம்பிக்கையில்’ என்ற சற்றே செறிவான சொற்றொடர் மூலத்தின் உண்மையான இலக்கணத் தெளிவின்மையையும் இறையியல் பதற்றத்தையும் காக்கிறது. இறுதி வினா பாலினம் சாராத ‘ஒருவர்’ என்பதுடன் இயல்பாக அமைக்கப்பட்டுள்ளது.
