id: ROM.8.34
reference: Romans 8:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: ta
  text: கண்டனம் விதிப்பவர் யார்? இறந்தவரும்—அதற்கும் மேலாக, உயிர்த்தெழுப்பப்பட்டவரும்—மேசியாவே[a]. அவர் கடவுளின் வலப்பக்கத்தில்[b] இருக்கிறார்; நமக்காகப் பரிந்துபேசுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.”
    reason: lexical_alternative
  - marker: b
    text: “கடவுளின் வலப்பக்கம்” என்பது மிக உயர்ந்த மரியாதையும் அதிகாரமும் கொண்ட நிலையைக் குறிக்கும் வேதாகம வழக்கு.
    reason: cultural_note
lexical_decisions:
- source_word: κατακρινῶν
  choice: கண்டனம் விதிக்கிறவர்
  rationale: பெயர்ச்சொல் தன்மையுடன் வரும் நிகழ்காலப் பங்கேற்புவினையை இயல்பான தமிழில் நபரைக் குறிக்கும் தொடராக வழங்குகிறது; நீதித்தீர்ப்புடன் தொடர்புடைய ‘கண்டனம்’ என்ற கருத்தையும் காக்கிறது.
- source_word: Χριστός
  choice: மேசியா
  rationale: இங்கு இது வெறும் பெயராக அல்லாமல் பட்டப்பெயரின் பொருளுடன் செயல்படுவதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: ἀποθανών
  choice: இறந்தவர்
  rationale: ஒருமுறை நிகழ்ந்த வரலாற்றுச் செயலைச் சுருக்கமான இறந்தகாலப் பெயரெச்ச வடிவில் இயல்பாகத் தருகிறது.
- source_word: μᾶλλον δὲ
  choice: அதற்கும் மேலாக
  rationale: இறப்பிலிருந்து உயிர்த்தெழுப்பப்படுதலுக்குச் செல்லும் வலியுறுத்தலையும் உயர்வையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐγερθείς
  choice: உயிர்த்தெழுப்பப்பட்டவர்
  rationale: கிரேக்கத்தின் செயப்பாட்டு வினை வடிவைக் காத்து, மேசியா உயிர்த்தெழுப்பப்பட்டார் என்பதைக் காட்டுகிறது.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: கடவுளின் வலப்பக்கத்தில்
  rationale: உயர்ந்த மரியாதை மற்றும் அதிகார நிலையைச் சுட்டும் வேதாகம மரபுத் தொடரை நேரடியாகவும் புரியத்தக்க வகையிலும் வழங்குகிறது.
- source_word: ἐντυγχάνει
  choice: பரிந்துபேசுகிறார்
  rationale: ஒருவருக்காகக் கடவுளிடம் வேண்டுதல் அல்லது பிரதிநிதித்துவம் செய்வதைக் குறிக்கும் சூழல்சார் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: ὑπὲρ ἡμῶν
  choice: நமக்காக
  rationale: பயனும் பிரதிநிதித்துவமும் இரண்டையும் சூழலில் உணர்த்தும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருள்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: பவுலின் இரட்சிப்புச் சார்ந்த வாதத்தில் பட்டப்பெயரின் அர்த்தம் செயல்படுவதால் அதன் பொருளை வெளிப்படையாகக் காக்கிறது; மரபான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐγερθείς என்பதன் செயப்பாட்டு வினை வடிவம்
  choice: உயிர்த்தெழுப்பப்பட்டவர்
  alternative: உயிர்த்தெழுந்தவர்
  rationale: உயிர்த்தெழுதல் மேசியாவுக்கு நிகழ்த்தப்பட்ட செயல் என கிரேக்கம் அமைத்துள்ள விதத்தை மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தொடர்ச்சியான ‘அவரே’ வலியுறுத்தலை இயல்பான தமிழ் வாக்கிய அமைப்பில் காத்துள்ளோம்; மூலத்தில் இல்லாத ‘இயேசு’ சேர்க்கப்படவில்லை.
