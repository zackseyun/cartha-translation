id: ROM.8.6
reference: Romans 8:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: ta
  text: ஏனெனில், மாம்சத்தின்[a] மனப்பாங்கு மரணம்; ஆவியின்[b] மனப்பாங்கோ வாழ்வும் சமாதானமும் ஆகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவ இயல்பு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆவி” என்பது பரிசுத்த ஆவியைக் குறிக்காமல், மனித ஆவி அல்லது பொதுவான ஆவியைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றை விளக்கும் இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: φρόνημα
  choice: மனப்பாங்கு
  rationale: வெறும் அறிவுசார் சிந்தனையை மட்டுமல்லாமல், நிலையான உள்ளார்ந்த நோக்கையும் மனச்சாய்வையும் குறிக்கிறது.
- source_word: σάρξ
  choice: மாம்சம்
  rationale: பவுலின் முக்கியமான உருவகச் சொல்லையும் அதன் இறையியல் அழுத்தத்தையும் நேரடியாகப் பேணுகிறது; விளக்கமான மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: θάνατος
  choice: மரணம்
  rationale: கிரேக்கச் சொல்லின் நேரடியான பொருளையும் அதன் இறையியல் கனத்தையும் பேணுகிறது.
- source_word: πνεῦμα
  choice: ஆவி
  rationale: ரோமர் 8-ன் உடனடிச் சூழலில் இது பரிசுத்த ஆவியைக் குறிக்கிறது என்று புரிந்துகொள்ளப்படுகிறது; தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால் மாற்றுப் புரிதல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ζωή
  choice: வாழ்வு
  rationale: ‘மரணம்’ என்பதற்கு எதிரான சுருக்கமான இணைப்பை இயல்பான தமிழில் பேணுகிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: பவுலின் சொல்லாட்சிக்கேற்ற நிலையான வேதாகமத் தமிழ்ச் சொல்லாக இருந்து, கடவுளுடனும் மனிதர்களுடனும் உள்ள நலநிலையின் பரப்பைத் திறந்தவாறே வைக்கிறது.
theological_decisions:
- issue: πνεῦμα என்பது பரிசுத்த ஆவியையா மனித ஆவியையா குறிக்கிறது?
  choice: பரிசுத்த ஆவி
  alternative: மனித ஆவி அல்லது பொதுவான ஆன்மிக மனப்பாங்கு
  rationale: ரோமர் 8-ன் உடனடிச் சூழல் மாம்சத்தையும் உயிரளிக்கும் தெய்வீக ஆவியையும் மீண்டும் மீண்டும் எதிரெதிராக நிறுத்துகிறது. இருப்பினும், மூலமொழியில் உள்ள சாத்தியமான மாற்றுப் புரிதல் அடிக்குறிப்பில் பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான பவுலிய எதிர்மறை இணைப்பை பேணும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சம்’ என்ற முக்கிய உருவகம் விளக்கமாக மாற்றப்படாமல் வைக்கப்பட்டுள்ளது; ‘மனப்பாங்கு’ என்பது நிலையான சிந்தனை நோக்கை இயல்பாக எடுத்துரைக்கிறது.
