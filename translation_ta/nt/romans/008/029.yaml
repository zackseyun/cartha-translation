id: ROM.8.29
reference: Romans 8:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: ta
  text: ஏனெனில், யாரை அவர் முன்கூட்டியே அறிந்தாரோ[a], அவர்களைத் தமது மகனின் சாயலுக்கு ஒத்தவர்களாகும்படி முன்குறித்தார்; அவர் அநேக சகோதரர்களிடையே[b] முதற்பேறானவராய் இருப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்பே அறிந்தாரோ.” இங்கே “அறிந்தார்” என்பது உறவுசார் பொருளில், அதாவது “முன்பே தமது அக்கறையை அவர்கள்மேல் வைத்தார்” என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: “சகோதரர்கள்” என்பது கிரேக்கத்தில் இலக்கணப்படி ஆண்பால் சொல்; தேவனுடைய குடும்பத்தைச் சேர்ந்த ஆண்களும் பெண்களும் இங்கே குறிக்கப்படலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: προέγνω
  choice: முன்கூட்டியே அறிந்தார்
  rationale: வினைச்சொல்லின் நேரடியான காலப்பொருளைப் பாதுகாக்கிறது; இது வெறும் முன்னறிவையா அல்லது முன்பே உறவுரீதியாக அறிந்துகொண்டதையா குறிக்கிறது என்பதை மூலவசனம் தீர்மானிக்காததால், அந்தத் தெளிவின்மையை அடிக்குறிப்பில் வைத்திருக்கிறது.
- source_word: προώρισεν
  choice: முன்குறித்தார்
  rationale: προ- என்ற முன்காலக் கூறையும், ஒருவரை ஒரு குறிப்பிட்ட முடிவுக்காக முன்னதாகவே நிர்ணயித்தல் என்ற வினையின் வலிமையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: συμμόρφους
  choice: ஒத்தவர்களாக இருக்கும்படி
  rationale: வடிவிலும் இயல்பிலும் ஒத்துப்போகும் கருத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; வெறும் வெளித்தோற்ற ஒற்றுமையாகக் குறுக்கவில்லை.
- source_word: εἰκόνος
  choice: சாயல்
  rationale: εἰκών என்பதன் உருவம்/பிரதிபலிப்பு சார்ந்த வேதாகமப் பொருளைத் தமிழில் இயல்பாகத் தருகிறது; இங்கு மகனோடு ஒத்த தன்மையைச் சுட்டுகிறது.
- source_word: υἱοῦ
  choice: மகன்
  rationale: வெளிப்படையான உறவுப் பட்டத்தையும் அதன் கிறிஸ்துவியல் முக்கியத்துவத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἰς τὸ εἶναι
  choice: இதனால் ... இருப்பார்
  rationale: இலக்கு மற்றும் விளைவு ஆகிய இரண்டும் ஒலிக்கக்கூடிய கிரேக்க அமைப்பை இயல்பான தமிழில் தருகிறது; இவ்விரண்டில் ஒன்றை மட்டும் கட்டாயமாக்கவில்லை.
- source_word: πρωτότοκον
  choice: முதற்பேறானவர்
  rationale: ‘முதலில் பிறந்தவர்’ என்ற உருவகத்தையும் அதனுடன் தொடர்புடைய முதன்மையையும் பாதுகாக்கிறது; அதை வெறும் ‘முதன்மையானவர்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: ἀδελφοῖς
  choice: சகோதரர்கள்
  rationale: கிரேக்கத்தின் இலக்கண ஆண்பால் பன்மையைப் பிரதிபலிக்கிறது; தேவனுடைய குடும்பத்தில் ஆண்களும் பெண்களும் உள்ளடங்கலாம் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான விளக்க அடிப்படையை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: προέγνω என்பது வெறும் முன்னறிவையா அல்லது முன்பே ஏற்படுத்திய உறவுசார் அறிவையா குறிக்கிறது?
  choice: முன்கூட்டியே அறிந்தார்
  alternative: முன்பே தமது அன்புக்குரியவர்களாக அறிந்துகொண்டார்
  rationale: கிரேக்கச் சொல்லின் அடிப்படை வடிவத்தைப் பாதுகாத்து, முன்னறிவு மற்றும் உறவுசார் தேர்வு பற்றிய இறையியல் விவாதத்தை மொழிபெயர்ப்பிலேயே தீர்த்துவிடாமல் விடுகிறது.
- issue: προώρισεν என்பதன் இறையியல் வலிமையை எவ்வாறு தருவது?
  choice: முன்குறித்தார்
  alternative: முன்கூட்டியே தீர்மானித்தார்
  rationale: முன்னதாக நிர்ணயித்தல் என்ற பொருளைப் பாதுகாக்கிறது; அந்த நிர்ணயத்தின் முறை அல்லது காரணம் குறித்து வசனம் கூறாத விளக்கங்களைச் சேர்க்கவில்லை.
- issue: ἀδελφοῖς என்பதை பாலின உள்ளடக்கத்துடன் எவ்வாறு வழங்குவது?
  choice: முதன்மை உரையில் ‘சகோதரர்கள்’; உள்ளடக்க வாய்ப்பை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சகோதர சகோதரிகள்
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவத்தைப் பிரதிபலிக்கிறது; அதேவேளை தேவனுடைய குடும்பத்தைச் சேர்ந்த பெண்களும் குறிக்கப்படலாம் என்பதை மறைக்கவில்லை.
- issue: εἰς τὸ εἶναι என்பது நோக்கமா அல்லது விளைவா?
  choice: இதனால் ... இருப்பார்
  alternative: அவர் ... இருப்பதற்காக
  rationale: கிரேக்க அமைப்பில் இருக்கும் நோக்கம்/விளைவு சார்ந்த இயல்பான பதற்றத்தை முற்றிலும் ஒரே திசையில் தீர்க்காமல் தமிழில் வாசிக்கத்தக்க வடிவில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘முன்குறித்தார்,’ ‘சாயல்,’ ‘முதற்பேறானவர்’ ஆகிய சொற்கள் வசனத்தின் இறையியல் செறிவையும் வேதாகம உருவகங்களையும் பாதுகாக்கின்றன. தெளிவுக்காக இறுதி உட்பிரிவில் ‘அவர்’ என்பதற்குப் பதிலாக ‘அவருடைய மகன்’ என்று குறிப்பிடப்பட்டுள்ளது; இது கிரேக்கத்தில் αὐτόν குறிக்கும் நபரைத் தெளிவாக்குகிறது, புதிய பொருளைச் சேர்ப்பதில்லை.
