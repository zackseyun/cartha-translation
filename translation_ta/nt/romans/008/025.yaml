  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: ta
  text: ஆனால், நாம் காணாததை நம்பிக்கையோடு எதிர்பார்த்தால், பொறுமையுடன் நிலைத்திருந்து அதை காத்திருக்கிறோம்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விடாமுயற்சியுடன்.”
    reason: lexical_alternative
  - marker: b
    text: “காத்திருக்கிறோம்” எனும் வினை, “ஆவலுடன் எதிர்பார்த்துக் காத்திருக்கிறோம்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ஆனால், ... என்றால்
  rationale: εἰ என்பதன் நிபந்தனைப் பொருளையும் δέ என்பதன் மென்மையான மாறுபாட்டு அல்லது தொடர்ச்சி நுணுக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: ὃ οὐ βλέπομεν
  choice: நாம் காணாததை
  rationale: நடுநிலை உறவுப்பெயரான ὃ-வை இயல்பான தமிழில் ‘அதை’ சார்ந்த வடிவில் தருகிறது; βλέπομεν என்பதற்கு ‘காணாத’ என்று கூறி, ‘காண முடியாத’ என்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: ἐλπίζομεν
  choice: நம்பிக்கையோடு எதிர்பார்த்தால்
  rationale: ἐλπίζω என்பதில் உள்ள நம்பிக்கையும் எதிர்நோக்குதலும் தமிழில் தெளிவாக வெளிப்படுகின்றன; நிகழ்காலச் செயற்பாட்டு நுணுக்கமும் நிலைக்கிறது.
- source_word: δι’ ὑπομονῆς
  choice: மனவுறுதியுடன்
  rationale: ὑπομονή என்பது வெறுமனே செயலற்ற பொறுமையை அல்ல, தாமதம் அல்லது துன்பத்தின் மத்தியிலும் நிலைத்திருப்பதைச் சுட்டுகிறது. இயல்பான சுருக்கமான தமிழில் இதை ‘மனவுறுதியுடன்’ தருகிறது.
- source_word: ἀπεκδεχόμεθα
  choice: அதை ... காத்திருக்கிறோம்
  rationale: எதிர்பார்ப்புடன் காத்திருத்தல் என்ற வினையின் அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது; அதன் தீவிரமான எதிர்நோக்குதல் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: காணப்படாத எதிர்கால நிறைவேற்றத்துக்கும் கிறிஸ்தவ நம்பிக்கைக்கும் உள்ள தொடர்பு
  choice: கிரேக்க உரையைப் போலவே நம்பிக்கையின் பொருளை ‘நாம் காணாதது’ என்று மட்டும் குறிப்பிட்டு, தொடர்ந்து நம்பிக்கையோடு எதிர்பார்ப்பதையும் காத்திருப்பதையும் மொழிபெயர்த்தல்
  alternative: சூழலின் அடிப்படையில் அதை மீட்பு, இரட்சிப்பு அல்லது உயிர்த்தெழுதல் என்று விரிவுபடுத்துதல்
  rationale: அருகிலுள்ள சூழல் அதன் பொருளை விளக்கினாலும், இவ்வசனம் தானாகவே ‘நாம் காணாதது’ என்ற கட்டுப்பட்ட சொல்லாட்சியையே பயன்படுத்துகிறது. ஆகவே ஒரு குறிப்பிட்ட கோட்பாட்டு நிறைவை உரைக்குள் சேர்க்காமல் அதன் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் நிபந்தனை அமைப்பும், காணாத பொருளைப் பற்றிய திட்டமிட்ட தெளிவின்மையும், பொறுமையுடன் நிலைத்துக் காத்திருக்கும் நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
