  text: Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: ta
  text: ஆகவே, மெசியாவாகிய இயேசுவுக்குள்[b] இருப்பவர்களுக்கு இப்போது தண்டனைத் தீர்ப்பு எதுவும் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பிற்காலக் கையெழுத்துப் பிரதிகள், “மாம்சத்தின்படி நடக்காதவர்களுக்கு” என்று கூடுதலாகச் சேர்க்கின்றன. தொடக்ககால கிரேக்கச் சான்றுகள் இங்குள்ள குறுகிய வாசகத்தையே ஆதரிக்கின்றன.
    reason: textual_variant
  - marker: b
    text: அல்லது, “கிறிஸ்து இயேசு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: எதுவும் இல்லை
  rationale: κατάκριμα என்பதுடன் சேர்ந்து வரும் வலியுறுத்தப்பட்ட மறுப்பை இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἄρα
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து பவுல் வருவிக்கும் முடிவைச் சுட்டும் தர்க்கத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: மெசியாவில் நிகழ்ந்துள்ள செயலின் விளைவாகத் தற்போது நிலவும் உண்மையை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: κατάκριμα
  choice: தண்டனைத் தீர்ப்பு
  rationale: வெறும் குற்ற உணர்வை அல்லாமல், குற்றவாளி என்று அறிவித்து தண்டனை விதிக்கும் நீதித்துறை சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவுக்குள் இருப்பவர்களுக்கு
  rationale: தத்தம் வாழ்வில் அவரை முன்மாதிரியாகக் கொள்வது போன்ற தளர்ந்த பொருளாக மாற்றாமல், பவுலின் ‘அவருக்குள்’ என்ற இணைவு மற்றும் பங்கேற்பு மொழியைப் பாதுகாக்கிறது.
- source_word: Χριστῷ
  choice: மெசியாவாகிய
  rationale: Χριστός என்பதை வெறும் பெயராக ஒலிபெயர்க்காமல், ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பதவிப் பொருள் உயிரோடு இருக்கும் வகையில் ‘மெசியா’ என வழங்குகிறது.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: Ἰησοῦς என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
theological_decisions:
- issue: ‘மெசியாவாகிய இயேசுவுக்குள்’ என்ற சொற்றொடரின் பொருள்
  choice: மெசியாவாகிய இயேசுவைச் சேர்ந்தவர்களையும் அவரோடு இணைக்கப்பட்டவர்களையும் அடையாளப்படுத்தும் பங்கேற்பு/இணைவு மொழியாக ‘உள்ளே’ என்ற உருவகத்தைத் தக்கவைத்தல்.
  alternative: ‘மெசியாவாகிய இயேசுவினால்’ அல்லது ‘அவர் காரணமாக’ என்று காரணப் பொருளில் தளர்த்திக் கூறுதல்.
  rationale: இங்குள்ள ἐν என்ற முன்னிடைச்சொல்லின் பவுலுக்குரிய செறிவையும் இறையியல் பதற்றத்தையும் ஒரே விளக்கமாகச் சுருக்காமல் பாதுகாக்க ‘உள்ளே’ என்ற மொழி தக்கவைக்கப்படுகிறது.
- issue: κατάκριμα என்பதன் நீதித்துறை சார்ந்த வலிமை
  choice: ‘தண்டனைத் தீர்ப்பு’ என்று மொழிபெயர்த்தல்.
  alternative: ‘குற்றச்சாட்டு’ அல்லது ‘குற்ற உணர்வு’ என்று மொழிபெயர்த்தல்.
  rationale: இச்சொல் வெறும் குற்றஞ்சாட்டுதலையோ மனநிலையையோ அல்லாமல், எதிரான நீதித் தீர்ப்பையும் அதன் தண்டனைத் தன்மையையும் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் தர்க்க வரிசையை இயல்பான தமிழாக்கத்துடன் இணைத்துள்ளோம்; ‘மெசியாவாகிய இயேசுவுக்குள்’ என்பது திட்டத்தின் பதவிப்பெயர் கொள்கையையும் பவுலின் இணைவு மொழியையும் காக்கிறது.
