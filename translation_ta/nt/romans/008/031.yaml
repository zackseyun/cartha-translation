id: ROM.8.31
reference: Romans 8:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: ta
  text: அப்படியானால், இவற்றைக் குறித்து நாம் என்ன சொல்வோம்?[a] கடவுள் நம் பக்கம் இருந்தால்,[b] நமக்கு எதிராக யார் இருக்க முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றுக்கு நாம் என்ன பதில் சொல்வோம்?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுள் நம் பக்கம் இருப்பதால், நமக்கு எதிராக யார் இருக்க முடியும்?”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: அப்படியானால் … நாம் என்ன சொல்வோம்?
  rationale: οὖν முந்தைய வாதத்திலிருந்து வரும் முடிவையும் மாற்றத்தையும் குறிக்கிறது; எதிர்கால வினைச்சொல் இங்கு ஆலோசனைத் தன்மையுள்ள சொல்லாட்சிக் கேள்வியாக இருப்பதால், இயல்பான தமிழில் இவ்வாறு வழங்கப்பட்டது.
- source_word: πρὸς ταῦτα
  choice: இவற்றைக் குறித்து
  rationale: முன்னர் சொல்லப்பட்ட அனைத்தையும் சுட்டும் இந்தத் தொடர், தமிழில் தெளிவாகவும் இயல்பாகவும் ‘இவற்றைக் குறித்து’ என்று தரப்படுகிறது; ‘இவற்றுக்குப் பதிலாக’ என்பதும் சாத்தியம்.
- source_word: εἰ
  choice: இருந்தால்
  rationale: சூழலில் உண்மை என ஏற்றுக்கொள்ளப்பட்ட நிபந்தனை என்ற வலிமை இருந்தாலும், கிரேக்கத்தின் நிபந்தனை வடிவத்தையும் சொல்லாட்சிக் கேள்வியின் தாக்கத்தையும் காக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: θεός என்பதற்கான இயல்பான நவீனத் தமிழ் இணை.
- source_word: ὑπὲρ ἡμῶν
  choice: நம் பக்கம்
  rationale: இங்கு ὑπέρ நமக்குச் சாதகமாக இருப்பதையும் ஆதரவாக நிற்பதையும் குறிக்கிறது; ‘நம் பக்கம்’ சுருக்கமாகவும் இயல்பாகவும் அந்த உறவுசார் பொருளைக் காக்கிறது.
- source_word: τίς καθ’ ἡμῶν
  choice: நமக்கு எதிராக யார் இருக்க முடியும்?
  rationale: κατά எதிர்ப்பைக் குறிக்கிறது. கிரேக்கத்தில் ‘இருக்கிறார்’ என்ற வினை வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் சொல்லாட்சிக் கேள்வியின் பொருளையும் சவாலான தொனியையும் தெளிவாக்க ‘இருக்க முடியும்’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: εἰ ὁ θεὸς ὑπὲρ ἡμῶν என்பதன் நிபந்தனைத் தன்மை
  choice: முதன்மை உரையில் ‘கடவுள் நம் பக்கம் இருந்தால்’
  alternative: ‘கடவுள் நம் பக்கம் இருப்பதால்’
  rationale: εἰ என்ற கிரேக்க வடிவத்தை ‘இருந்தால்’ காக்கிறது. இது கடவுளின் ஆதரவைப் பற்றிய ஐயத்தை வெளிப்படுத்துவதல்ல என்பதைச் சூழலும் சொல்லாட்சிக் கேள்வியும் காட்டுகின்றன; ‘இருப்பதால்’ என்பது அதன் உறுதிப்படுத்தும் உட்பொருளை வெளிப்படையாக்கும் மாற்று.
- issue: இறுதி சொல்லாட்சிக் கேள்வியின் வலிமை
  choice: ‘நமக்கு எதிராக யார் இருக்க முடியும்?’
  alternative: ‘நமக்கு எதிராக யார்?’
  rationale: சுருக்கமான கிரேக்க வடிவம் எந்த எதிரியும் இறுதியில் வெல்ல முடியாது என்ற சவாலான கருத்தைக் கொண்டுள்ளது. தமிழில் ‘இருக்க முடியும்’ என்பது அந்த நடைமுறை வலிமையை இயல்பாக வெளிப்படுத்துகிறது; மாற்று வடிவம் மூலத்தின் சுருக்கத்தை நெருக்கமாகப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பவுலின் தொடர்ச்சியான வாதத்தை ‘அப்படியானால்’ இணைக்கிறது; இரண்டு கேள்விகளின் சொல்லாட்சித் தாக்கமும் பாதுகாக்கப்பட்டுள்ளது.
