id: ROM.8.7
reference: Romans 8:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: ta
  text: ஏனெனில், மாம்சத்தின்[a] மனப்போக்கு கடவுளுக்கு எதிரான பகை[b]; அது கடவுளுடைய சட்டத்திற்குக் கீழ்ப்படிவதில்லை; ஏனெனில், அந்தச் சட்டத்திற்குக் கீழ்ப்படிவதற்குக்கூட அதனால் முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாவ இயல்பின் மனப்போக்கு.’
    reason: ‘மாம்சம்’ என்பது இங்கு மனித உடலை மட்டும் அல்லாமல், கடவுளுக்கு எதிராக அமைந்த விழுந்துபோன மனித இயல்பை உருவகமாகக் குறிக்கலாம்.
  - marker: b
    text: அல்லது, ‘கடவுளுக்கு எதிரான பகைமை.’
    reason: ἔχθρα என்பது எதிர்ப்பு, பகை, பகைமை ஆகிய தொடர்புடைய பொருள்களைக் கொண்ட பெயர்ச்சொல்; ‘பகைமை’ என்பது சாத்தியமான தமிழ் மாற்று.
lexical_decisions:
- source_word: διότι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் சொல்லாக, கிரேக்கத்தின் காரணப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: φρόνημα
  choice: மனப்போக்கு
  rationale: வெறும் அறிவுசார் சிந்தனையை அல்லாமல், மனத்தின் நிலையான நோக்குநிலையையும் சார்பையும் குறிக்கும் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: σάρξ
  choice: மாம்சம்
  rationale: பவுலின் உருவகப் பயன்பாட்டை விளக்கச் சொல்லால் மாற்றாமல், மூலச்சொல்லின் உருவகத்தையும் அதன் இறையியல் அழுத்தத்தையும் பிரதான உரையில் பாதுகாக்கிறது.
- source_word: ἔχθρα εἰς θεόν
  choice: கடவுளுக்கு எதிரான பகை
  rationale: ἔχθρα என்பது பெயர்ச்சொல்லாக இருப்பதைப் பாதுகாத்து, அந்தப் பகை கடவுளை நோக்கிய எதிர்ப்பாக இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τῷ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται
  choice: கடவுளுடைய சட்டத்திற்குக் கீழ்ப்படிவதில்லை
  rationale: கடவுளின் சட்டத்திற்கு உட்படாத நிலையைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: οὐδὲ γὰρ δύναται
  choice: உண்மையில், அதனால் கீழ்ப்படியவும் முடியாது
  rationale: οὐδέ தரும் வலியுறுத்தலை ‘-வும்’ என்பதாலும், δύναται கூறும் இயலாமையை ‘முடியாது’ என்பதாலும் பாதுகாக்கிறது; γάρ இங்கு முந்தைய கூற்றை உறுதிப்படுத்தி விளக்குவதால் ‘உண்மையில்’ என இயல்பாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: σάρξ என்பதை விளக்கமாக ‘பாவ இயல்பு’ என்று மொழிபெயர்ப்பதா, அல்லது மூல உருவகத்தைப் பாதுகாத்து ‘மாம்சம்’ என்று மொழிபெயர்ப்பதா
  choice: பிரதான உரையில் ‘மாம்சம்’ என்று வைத்து, விளக்க மாற்றை அடிக்குறிப்பில் தருதல்
  alternative: பாவ இயல்பு
  rationale: இங்கு உடலை மட்டும் குறிக்காமல், கடவுளுக்கு எதிராக அமைந்த மனித நோக்குநிலையை உருவகமாகக் குறித்தாலும், ‘மாம்சம்’ என்ற மூல உருவகத்தைப் பாதுகாப்பது தேவையற்ற கோட்பாட்டு விளக்கத்தை உரைக்குள் புகுத்தாமல் பதற்றத்தை நிலைநிறுத்துகிறது.
- issue: இறுதிக் கூற்றை விருப்பமின்மையாக மென்மைப்படுத்துவதா, அல்லது இயலாமையாகவே மொழிபெயர்ப்பதா
  choice: ‘அதனால் கீழ்ப்படியவும் முடியாது’ என்று இயலாமையை நேரடியாகக் கூறுதல்
  alternative: அது கீழ்ப்படிய விரும்புவதில்லை
  rationale: δύναται திறன் அல்லது இயல்தகுதியைக் குறிக்கிறது. ஆகவே உரை கூறும் இயலாமையை வேறு இறையியல் அமைப்பால் விளக்காமலும் மென்மைப்படுத்தாமலும் அப்படியே பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதவாக்கியத்திற்குரிய செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனப்போக்கு’ சாதாரண வாசகருக்குப் புரியும்படி φρόνημα என்பதன் நிலையான மனநோக்கைத் தருகிறது. அரைப்புள்ளிகள் கிரேக்கத்தின் தொடர்ச்சியான காரணவாதக் கட்டமைப்பை வாசிக்க எளிதாகப் பிரிக்கின்றன.
