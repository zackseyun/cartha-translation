  source_fidelity: 'மூலத்தின் நிபந்தனை அமைப்பும் விளக்கத் தொடர்பும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: «ஏனெனில்» γάρ-இன் காரண/விளக்கப் பணியைத் தருகிறது; «மாம்சத்தின்படி வாழ்ந்தால்» κατὰ σάρκα ζῆτε-யை உருவகத்துடன் தருகிறது; «சாகப்போகிறீர்கள்» μέλλετε ἀποθνῄσκειν-இன் எதிர்நோக்கிய மரணத்தைத் தேவையற்ற உடனடித்தன்மையின்றி வெளிப்படுத்துகிறது. «ஆவியினால்» πνεύματι-யின் கருவிப் பொருளையும், «உடலின் செயல்களைச் சாகடித்தால்» τὰς πράξεις τοῦ σώματος θανατοῦτε-யின் வலுவான மரண உருவகத்தையும், «வாழ்வீர்கள்» ζήσεσθε-யின் எதிர்கால வாக்குறுதியையும் காக்கின்றன.'
