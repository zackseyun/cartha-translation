id: ROM.8.13
reference: Romans 8:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் மாம்சத்தின்படி[a] வாழ்ந்தால், சாகப்போகிறீர்கள்; ஆனால் ஆவியினால் உடலின் செயல்களைச் சாகடித்தால், வாழ்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாம்சத்தின்படி’ என்பது இங்கு கடவுளுடைய ஆவிக்கு எதிரான, பாவத்தால் ஆளப்படும் வாழ்க்கை முறையைக் குறிக்கிறது.
    reason: ‘மாம்சம்’ என்ற மூல உருவகத்தைப் பாதுகாத்தபடியே, இச்சூழலில் அது வெறும் உடல் வாழ்வை மட்டும் குறிக்கவில்லை என்பதை விளக்குகிறது.
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் கருத்தை விளக்கும் இணைப்புச் சொல்லாக γὰρ செயல்படுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: κατὰ σάρκα
  choice: மாம்சத்தின்படி
  rationale: σάρξ என்ற மூலச்சொல்லின் உருவகத்தைப் பாதுகாக்கிறது; அதை நேரடியாக ‘பாவ இயல்பு’ என்று விளக்கி, பவுலின் மாம்சம்–ஆவி எதிர்மறை இணைப்பைச் சுருக்கிவிடவில்லை.
- source_word: ζῆτε
  choice: வாழ்ந்தால்
  rationale: நிபந்தனை வாக்கியத்தில் நிகழ்காலத் தொடர்ச்சியான வாழ்க்கை முறையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: சாகப்போகிறீர்கள்
  rationale: μέλλω உடன் வரும் வினையெச்சத்தின் எதிர்நோக்கிய விளைவை இயல்பாகக் காட்டுகிறது; ‘உடனே சாகப் போகிறீர்கள்’ என்ற தேவையற்ற கால நெருக்கத்தைச் சேர்க்கவில்லை.
- source_word: πνεύματι
  choice: ஆவியினால்
  rationale: வேற்றுமை வடிவத்தின் கருவிப்பொருளை வெளிப்படுத்துகிறது. ரோமர் 8-ன் சூழலில் இது கடவுளுடைய ஆவியைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘தூய’ என்ற அடைமொழியை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: உடலின் செயல்களை
  rationale: πράξεις என்பதன் நடைமுறைச் செயல்கள் என்ற பொருளையும், σώματος என்பதன் ‘உடல்’ என்ற நேரடிப் பொருளையும் பாதுகாக்கிறது.
- source_word: θανατοῦτε
  choice: சாகடித்தால்
  rationale: செயல்களை மரணத்திற்குள்ளாக்கும் வலுவான உருவகத்தைத் தமிழில் தக்கவைக்கிறது; வெறுமனே ‘நிறுத்தினால்’ அல்லது ‘அழித்தால்’ என்று மென்மைப்படுத்தவில்லை.
- source_word: ζήσεσθε
  choice: வாழ்வீர்கள்
  rationale: எதிர்கால வாக்குறுதியைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: πνεύματι என்பது தூய ஆவியையா மனித ஆவியையா குறிக்கிறது?
  choice: சூழலின்படி கடவுளுடைய ஆவி; முதன்மை உரையில் ‘ஆவி’
  alternative: மனித ஆவி அல்லது திட்டமிட்ட இருபொருள் நிலை
  rationale: ரோமர் 8 முழுவதிலும் மீண்டும் மீண்டும் வரும் பயன்பாடு, பாவச் செயல்களைச் சாகடிக்க வல்லவராகக் கடவுளுடைய ஆவியையே வலுவாகச் சுட்டுகிறது. அதேவேளை, மூலத்தில் ἅγιον இல்லாததால் ‘தூய’ என்பதை உரைக்குள் சேர்க்காமல் சூழல் சார்ந்த அடையாளத்தைப் பாதுகாக்கிறது.
- issue: σάρξ என்பதைக் ‘பாவ இயல்பு’ என்று விளக்கலாமா அல்லது ‘மாம்சம்’ என்ற உருவகத்தைப் பாதுகாக்கலாமா?
  choice: மாம்சம்
  alternative: பாவ இயல்பு
  rationale: ‘பாவ இயல்பு’ இச்சூழலின் நெறிசார் கருத்தை விளக்கினாலும், அது σάρξ என்பதிலுள்ள உடல் சார்ந்த உருவகத்தையும் பவுலின் திட்டமிட்ட மாம்சம்–ஆவி பதற்றத்தையும் முன்கூட்டியே தீர்த்துவிடுகிறது. ஆகவே உருவகம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மாம்சம்’ என்பது இறையியல் மரபில் அறியப்பட்ட சொல் என்பதாலும் மூல உருவகத்தைப் பாதுகாப்பதாலும் வைக்கப்பட்டுள்ளது; அதன் சூழற்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது. ‘சாகடித்தால்’ என்ற வலுவான வினை, θανατοῦτε என்பதிலுள்ள மரண உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
