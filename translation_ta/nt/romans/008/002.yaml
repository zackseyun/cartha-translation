  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: ta
  text: ஏனெனில், உயிரளிக்கும் ஆவியானவரின் சட்டம் மெசியா இயேசுவுக்குள் உன்னை[b] பாவம் மற்றும் மரணத்தின் சட்டத்திலிருந்து விடுதலையாக்கியது.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “நியதி”: “உயிரளிக்கும் ஆவியானவரின் நியதி.”'
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் “உன்னை” என்பதற்குப் பதிலாக “என்னை” என்று உள்ளது.
    reason: textual_variant
  - marker: c
    text: '“மெசியா இயேசுவுக்குள்” என்பதை “உயிரளிக்கும் ஆவியானவரின் சட்டம்” என்பதுடன் இணைத்து, “மெசியா இயேசுவுக்குள்ள உயிரளிக்கும் ஆவியானவரின் சட்டம்” என்றும் மொழிபெயர்க்கலாம். மரபுவழிச் சொற்றொடர்: “கிறிஸ்து இயேசுவுக்குள்.”'
    reason: syntactical_and_lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: சட்டம்
  rationale: இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி பவுலின் திரும்பவரும் பெயர்ச்சொல்லையும் உருவகத்தின் அழுத்தத்தையும் காக்கிறது; ‘நியதி’ என்பது சாத்தியமான விளக்க மாற்று.
- source_word: πνεύματος τῆς ζωῆς
  choice: உயிரளிக்கும் ஆவியானவர்
  rationale: ரோமர் 8-ன் சூழலில் இது பரிசுத்த ஆவியானவரைக் குறிக்கிறது; இயல்பான நவீன தமிழுக்காக உறவுநிலைத் தொடரை ‘உயிரளிக்கும்’ எனத் தருகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மெசியா இயேசுவுக்குள் இருக்கிற
  rationale: Χριστός என்பதைக் பட்டமான ‘மெசியா’ என்று தருவதோடு, ἐν என்பதையும் பவுலின் ஒன்றிப்பைக் குறிக்கும் மொழியையும் பாதுகாக்கிறது.
- source_word: ἠλευθέρωσέν
  choice: விடுதலையாக்கியது
  rationale: நிறைவேற்றப்பட்ட விடுதலைச் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: σε
  choice: உன்னை
  rationale: SBLGNT அச்சிட்டுள்ள இரண்டாம் நபர் ஒருமை வாசகமான σε-ஐப் பின்பற்றுகிறது; மாற்றுவாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἁμαρτίας καὶ τοῦ θανάτου
  choice: பாவம் மற்றும் மரணம்
  rationale: இரு பெயர்ச்சொற்களையும் ஒருங்கிணைந்த உறவுநிலைத் தொடராக வைத்து, பாவத்தையும் மரணத்தையும் ஆளும் சக்திகளாக உணர்த்தும் பவுலின் சுருக்கமான மொழியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: πνεύματος என்பது பரிசுத்த ஆவியானவரையா, மனித ஆவியையா, அல்லது ஓர் ஆன்மீக நியதியையா குறிக்கிறது?
  choice: பரிசுத்த ஆவியானவர்
  alternative: மனித ஆவி அல்லது ஆன்மீக நியதி
  rationale: ரோமர் 8-ல் மாம்சம், பாவம், மரணம் ஆகியவற்றுக்கு எதிராக உயிரளிக்கும் தெய்வீக ஆவியானவர் பேசப்படுவதால், பரிசுத்த ஆவியானவரே இயல்பான குறிப்பு.
- issue: ἐν Χριστῷ Ἰησοῦ எதனுடன் இலக்கண ரீதியாக இணைகிறது?
  choice: ‘ஆவியானவரின் சட்டம்’ என்பதுடன் இணையும் வகையில் மொழிபெயர்க்கப்பட்டது
  alternative: ‘உன்னை விடுதலையாக்கியது’ என்பதுடன் இணைத்து, ‘மெசியா இயேசுவுக்குள் உன்னை விடுதலையாக்கியது’ என வாசித்தல்
  rationale: கிரேக்கச் சொல் வரிசை முந்தைய பெயர்ச்சொல் தொடருடன் இணைப்பதை இயல்பாக்குகிறது; எனினும் வினையுடன் இணைக்கும் வாய்ப்பும் உண்மையான இலக்கணத் தெளிவின்மையாக இருப்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘மெசியா’ திட்டக் கொள்கைப்படி பட்டமாக வைக்கப்பட்டது. ‘சட்டம்’ இரு இடங்களிலும் ஒரேபடி தரப்பட்டு மூலத்தின் மீளுரையும் இறையியல் அழுத்தமும் காக்கப்பட்டுள்ளன.
