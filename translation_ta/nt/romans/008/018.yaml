id: ROM.8.18
reference: Romans 8:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: ta
  text: ஏனெனில், இப்போதைய காலத்தின் துன்பங்கள் நமக்கு வெளிப்படுத்தப்படவிருக்கும் வருங்கால மகிமையோடு ஒப்பிடத் தகுந்தவை அல்ல என்று நான் கருதுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மில் வெளிப்படுத்தப்படவிருக்கும்.”
    reason: εἰς ἡμᾶς என்பதற்கான பொருள் ‘நமக்கு’ என்றும் ‘நம்மில்’ என்றும் புரிந்துகொள்ளப்படலாம்; இந்த உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Λογίζομαι
  choice: நான் கருதுகிறேன்
  rationale: இது வெறும் உணர்ச்சியை அல்ல, சிந்தித்து எட்டிய மதிப்பீட்டைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் உள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ அடிப்படையையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைப் பேணுகிறது.
- source_word: οὐκ ἄξια ... πρὸς
  choice: ஒப்பிடத் தகுந்தவை அல்ல
  rationale: ἄξια மற்றும் πρὸς இணைந்து காட்டும் அளவிட முடியாத வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ παθήματα
  choice: துன்பங்கள்
  rationale: அனுபவிக்கப்படும் பாடுகளைக் குறிக்கும் பொதுவான, தெளிவான தமிழ் சொல்.
- source_word: τοῦ νῦν καιροῦ
  choice: இப்போதைய காலத்தின்
  rationale: καιρός என்பதை இங்கு கூடுதல் காலயுகக் கருத்தைச் சேர்க்காமல் தற்போதைய காலம் என நேரடியாக வழங்குகிறது.
- source_word: τὴν μέλλουσαν δόξαν
  choice: வருங்கால மகிமை
  rationale: μέλλουσαν என்பதன் எதிர்நோக்கிய, இனி வரவிருக்கும் தன்மையைத் தனித்துவமாகப் பேணுகிறது.
- source_word: ἀποκαλυφθῆναι
  choice: வெளிப்படுத்தப்படவிருக்கும்
  rationale: வெளிப்படுத்துதல் என்ற பொருளையும், செயல்படுபவர் குறிப்பிடப்படாத இறைவினை வடிவையும், எதிர்கால நோக்கையும் பேணுகிறது.
- source_word: εἰς ἡμᾶς
  choice: நமக்கு
  rationale: மகிமை விசுவாசிகளுக்கு வெளிப்படுத்தப்படுவதை இயல்பாகக் கூறுகிறது; ‘நம்மில்’ என்ற பங்கேற்பு சார்ந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: εἰς ἡμᾶς என்பதில் மகிமை வெளிப்படும் விதம்
  choice: நமக்கு
  alternative: நம்மில்
  rationale: εἰς என்ற முன்னிடைச்சொல் இச்சூழலில் மகிமை நமக்கு வெளிப்படுத்தப்படுவதையோ நம்மில் வெளிப்படுவதையோ குறிக்கக்கூடும். முதன்மை உரையில் இயல்பான ‘நமக்கு’ தேர்ந்தெடுக்கப்பட்டாலும், இறையியல் முக்கியத்துவமுள்ள மாற்றுப் பொருள் அடிக்குறிப்பில் பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. பவுலின் காரண இணைப்பு, சிந்தித்த மதிப்பீடு, தற்போதைய துன்பங்களுக்கும் வருங்கால மகிமைக்கும் இடையிலான ஒப்பீடு, மேலும் εἰς ἡμᾶς என்பதின் தெளிவின்மை ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
