source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: ta
  text: 'திருச்சட்டத்தால் செய்ய இயலாததை[a]—மாம்சத்தினால்[b] அது வலுவற்றிருந்ததால்—கடவுள் செய்தார்: தமது சொந்த மகனைப் பாவமுள்ள மாம்சத்தின் சாயலில்[d], பாவத்திற்காக[c] அனுப்பி, மாம்சத்தில் பாவத்துக்குத் தண்டனைத் தீர்ப்பளித்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “திருச்சட்டத்தின் இயலாமையை.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “மாம்சம்” என்பது பாவத்தால் பலவீனமடைந்த மனித நிலையைச் சுட்டுவதாக இருக்கலாம்; சில மொழிபெயர்ப்புகள் சில சூழல்களில் இதை விளக்கமாக “பாவ இயல்பு” என்று தருகின்றன.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பாவநிவாரணப் பலியாக.” “பாவத்திற்காக” என்ற கிரேக்கத் தொடர் பலியியல் பொருளையும் கொள்ளக்கூடும்.
    reason: alternative_reading
  - marker: d
    text: “பாவமுள்ள மாம்சத்தின் சாயலில்” என்பது மகன் உண்மையாக மனிதராக வந்ததை உறுதிப்படுத்துவதோடு, அவரையே பாவமுள்ளவர் என்று கூறுவதையும் தவிர்க்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: திருச்சட்டத்தால் செய்ய இயலாததை
  rationale: கிரேக்க மொழியின் நடுநிலைப் பெயரெச்சத் தொடர் திருச்சட்டத்தின் இயலாமையைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க வினைமுகத் தொடராக மொழிபெயர்க்கப்பட்டது; அதன் சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: νόμος
  choice: திருச்சட்டம்
  rationale: இச்சூழலில் மோசேயின் சட்டத்தைக் குறிக்கும் பொருள் தெளிவாக இருப்பதால், நவீன தமிழில் வெறும் ‘சட்டம்’ என்பதைக் காட்டிலும் வேதாகமச் சூழலைத் தெளிவுபடுத்தும் ‘திருச்சட்டம்’ பயன்படுத்தப்பட்டது.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: மாம்சத்தின் காரணமாக அது வலுவற்றிருந்ததால்
  rationale: ἐν ᾧ விளக்கக் காரணத்தைத் தருகிறது; διά உடன் வரும் மரபுவேற்றுமை இங்கு காரணப் பொருளை இயல்பாகத் தருகிறது. சட்டம் தன்னளவில் தீயது என்று கூறாமல், மாம்சத்தின் காரணமாக அதன் செயலாற்றல் வலுவற்றிருந்ததைப் பேணுகிறது.
- source_word: τὸν ἑαυτοῦ υἱὸν πέμψας
  choice: தமது சொந்த மகனை ... அனுப்பி
  rationale: ἑαυτοῦ தரும் வலியுறுத்தலை ‘சொந்த’ பேணுகிறது. அயோரிஸ்ட் வினையெச்சம் கடவுள் எவ்வாறு செயல்பட்டார் என்பதைத் தமிழில் இயல்பான ‘அனுப்பி’ என்ற வடிவில் தெரிவிக்கிறது.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: பாவமுள்ள மாம்சத்தின் சாயலில்
  rationale: ὁμοίωμα என்பதன் ஒற்றுமை/சாயல் பொருளையும், σαρκὸς ἁμαρτίας என்பதன் கடினமான தொடர்பையும் மிகையாக விளக்காமல் பேணுகிறது. மகனின் உண்மையான மனிதத்தன்மையையும் அவர் பாவமுள்ளவர் என்று கூறாத வேறுபாட்டையும் மூலத்தின் பதற்றத்தோடு விடுகிறது.
- source_word: περὶ ἁμαρτίας
  choice: பாவத்திற்காக
  rationale: இது கிரேக்கத் தொடரின் பரந்த, நேரடியான பொருளைப் பேணுகிறது. எழுபதின்மர் மொழிபெயர்ப்பின் பலியியல் பயன்பாட்டின்படி ‘பாவநிவாரணப் பலியாக’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: பாவத்துக்குத் தண்டனைத் தீர்ப்பளித்தார்
  rationale: κατακρίνω என்பதன் நீதித்துறைச் சார்ந்த கண்டனத் தீர்ப்பைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ σαρκί
  choice: மாம்சத்திலேயே
  rationale: மூலத்தில் உடைமைப் பெயரடை இல்லாததால் ‘அவருடைய மாம்சத்தில்’ என்று மிகையாகக் குறிப்பாக்கவில்லை. ‘-இலேயே’ என்பது பாவம் கண்டனம் செய்யப்பட்ட களத்தை வலியுறுத்துகிறது.
theological_decisions:
- issue: σάρξ என்பதன் பொருள்
  choice: இரு இடங்களிலும் ‘மாம்சம்’
  alternative: ‘பாவ இயல்பு’ அல்லது ‘மனித உடல்’
  rationale: ‘பாவ இயல்பு’ என்பது பவுலின் அடுக்கான சொல்லாட்சியை முன்கூட்டியே விளக்கிவிடும்; ‘மனித உடல்’ என்பது உடல்மட்டும் என்ற தவறான குறுக்கத்தைக் கொடுக்கலாம். ஒரே கிரேக்கச் சொல்லின் தொடர்பைப் பேண ‘மாம்சம்’ வைக்கப்பட்டு அதன் சூழற்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: περὶ ἁμαρτίας என்பதன் பலியியல் சாத்தியம்
  choice: முதன்மை உரையில் ‘பாவத்திற்காக’
  alternative: ‘பாவநிவாரணப் பலியாக’
  rationale: பலியியல் பொருள் வலுவான சாத்தியமாக இருந்தாலும், கிரேக்கத் தொடர் அதைவிடப் பரந்ததாகவும் வாசிக்கப்படலாம். உண்மையான தெளிவின்மையைத் தீர்த்துவிடாமல் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘பாவமுள்ள மாம்சத்தின் சாயலில்’ என்பதன் கிறிஸ்துவியல் வலி
  choice: மூலத்தின் ‘சாயல்’ மற்றும் ‘பாவமுள்ள மாம்சம்’ ஆகிய இரண்டையும் வைத்திருத்தல்
  alternative: மகன் பாவமற்றவர் அல்லது வெறும் வெளித்தோற்றத்தில் மனிதர் என்று விளக்கமாகச் சேர்த்தல்
  rationale: மூலம் மகனின் மெய்யான மனித வருகையையும் பாவத்திலிருந்து அவருக்குள்ள வேறுபாட்டையும் நுணுக்கமாக இணைக்கிறது. முதன்மை உரையில் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அந்தத் திண்மையைப் பேணுகிறது.
- issue: ἐν τῇ σαρκί என்பதன் குறிப்பு
  choice: ‘மாம்சத்திலேயே’ என்று உடைமையைச் சேர்க்காமல் மொழிபெயர்த்தல்
  alternative: ‘அவருடைய மாம்சத்தில்’
  rationale: சூழல் மகனுடைய மாம்சத்தை வலுவாகச் சுட்டினாலும், கிரேக்கத்தில் ‘அவருடைய’ என்பது வெளிப்படையாக இல்லை. எனவே மூலத்தின் செறிவும் சாத்தியமான பரந்த ஒலியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘மாம்சம்’ போன்ற மூலத்தின் முக்கிய உருவகச் சொல் திட்டமிட்டே பேணப்பட்டு அடிக்குறிப்பால் விளக்கப்பட்டது. இடைக்கோடுகள் நீண்ட கிரேக்க வாக்கியத்தின் விளக்க உட்பிரிவைத் தெளிவாக்குகின்றன; அடிக்குறி வரிசை உரையில் அவை தோன்றும் இடத்திற்கேற்ப அமைந்துள்ளது.
