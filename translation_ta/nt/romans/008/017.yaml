revisions:
- from: நாம் பிள்ளைகளென்றால், வாரிசுகளும்கூட—தேவனுடைய வாரிசுகளும், மெசியாவுடன்[a] உடன் வாரிசுகளும் ஆவோம். நாம் உண்மையிலேயே அவருடன் பாடுபடுகிறோம் என்றால், அவருடன் மகிமைப்படுத்தப்படவும் செய்வோம்.
  to: நாம் பிள்ளைகள் என்றால், வாரிசுகளும்கூட—தேவனுடைய வாரிசுகளும் மெசியாவுடன்[a] இணை வாரிசுகளும். உண்மையிலேயே நாம் அவருடன் துன்பப்படுகிறோம் என்றால், நாமும் அவருடன் மகிமைப்படுத்தப்படுவோம்.
  rationale: கிரேக்கத்தின் சுருக்கமான நிபந்தனை அமைப்பை நவீன தமிழில் இரண்டு வாக்கியங்களாகத் தக்கவைத்துள்ளோம். ‘இணை வாரிசுகள்’ συγκληρονόμοι-யின் பகிர்ந்த வாரிசுரிமையையும், ‘அவருடன்’ மெசியாவுடனான பங்கேற்பையும் தெரிவிக்கிறது. εἴπερ-ன் வலிமை ‘உண்மையிலேயே ... என்றால்’ மூலம் பேணப்படுகிறது; துன்பப்படுதல் மகிமைக்கான தகுதியைச் சம்பாதிக்கிறது என விளக்காமல், நிபந்தனை-விளைவு உறவு மட்டுமே வழங்கப்படுகிறது.
