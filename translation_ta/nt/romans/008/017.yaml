id: ROM.8.17
reference: Romans 8:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: ta
  text: நாம் பிள்ளைகள் என்றால், வாரிசுகளும்கூட—தேவனுடைய வாரிசுகளும் மெசியாவுடன்[a] இணை வாரிசுகளும். உண்மையிலேயே நாம் அவருடன் துன்பப்படுகிறோம் என்றால், நாமும் அவருடன் மகிமைப்படுத்தப்படுவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவுடன்.”
    reason: Χριστός என்ற பட்டப்பெயரை “மெசியா” என்றும் “கிறிஸ்து” என்றும் வழங்கலாம்; முதன்மை உரை அதன் பட்டப்பெயர்ச் சார்ந்த பொருளை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: τέκνα
  choice: பிள்ளைகள்
  rationale: பாலினத்தைக் குறிப்பிடாத பன்மைச் சொல்; தேவனுடனான பிள்ளை உறவையும் வாரிசுரிமை வாதத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κληρονόμοι
  choice: வாரிசுகள்
  rationale: சட்ட மற்றும் குடும்பச் சூழலில் சுதந்தரத்தைப் பெறுவோரைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: θεοῦ
  choice: தேவனுடைய
  rationale: உடைமை அல்லது மூலத்தைச் சுட்டும் கிரேக்கப் பிறப்புவேற்றுமையை நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: συγκληρονόμοι
  choice: உடன் வாரிசுகள்
  rationale: συν- கூறு குறிக்கும் பகிரப்பட்ட வாரிசுரிமையைத் தெளிவாகப் பேணுகிறது.
- source_word: Χριστοῦ
  choice: மெசியாவுடன்
  rationale: அபிஷேகம் பெற்ற அரசரைச் சுட்டும் பட்டப்பெயரின் பொருளை இச்சூழலில் பேணுகிறது; உடனிகழ்ச்சியை συγκληρονόμοι என்பதோடு இணைத்து இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἴπερ
  choice: உண்மையிலேயே ... என்றால்
  rationale: உண்மையான நிபந்தனையையும் பவுலின் எதிர்பார்ப்புடன் கூடிய வலியுறுத்தலையும் ஒருங்கே பேணுகிறது.
- source_word: συμπάσχομεν
  choice: அவருடன் பாடுபடுகிறோம்
  rationale: συν- கூறின் ‘உடன்’ என்ற பகிர்வுப் பொருளை வெளிப்படையாகக் காட்டுகிறது; சூழலிலிருந்து குறிக்கப்படும் நபர் மெசியா.
- source_word: ἵνα
  choice: '...வும் செய்வோம்'
  rationale: தமிழில் இயல்பாக நோக்கம்/விளைவு உறவைத் தொடர்ச்சியாக வெளிப்படுத்துகிறது; பாடுபடுதல் மகிமையைச் சம்பாதிக்கிறது என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: συνδοξασθῶμεν
  choice: அவருடன் மகிமைப்படுத்தப்படவும் செய்வோம்
  rationale: இறைவனால் பெறப்படும் மகிமையைக் குறிக்கும் செயப்பாட்டு வடிவத்தையும், συν- கூறின் பகிரப்பட்ட பங்கேற்பையும் பேணுகிறது.
theological_decisions:
- issue: εἴπερ συμπάσχομεν என்பது துன்பத்தைத் தகுதி சம்பாதிக்கும் நிபந்தனையாகக் காட்டுகிறதா, அல்லது மெசியாவுடனான ஒன்றிப்பின் எதிர்பார்க்கப்படும் வடிவமாகக் காட்டுகிறதா?
  choice: “நாம் உண்மையிலேயே அவருடன் பாடுபடுகிறோம் என்றால்” என்று உண்மையான நிபந்தனையாக மொழிபெயர்க்கப்பட்டது; பாடுபடுதல் மகிமையைச் சம்பாதிக்கிறது என்று சேர்க்கப்படவில்லை.
  alternative: “நாம் அவருடன் பாடுபடுவதால்” என்று நிபந்தனையைத் தளர்த்துதல், அல்லது பாடுபடுதலைப் புண்ணிய அடிப்படையாக விளக்குதல்.
  rationale: εἴπερ என்பதன் நிபந்தனை வலிமையை கிரேக்கம் பேணுகிறது; அதேவேளை, சூழல் மெசியாவுடன் பகிர்ந்து கொள்வதைப் பேசுகிறது. ஆகவே அந்த இறையியல் இழுவைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கிரேக்க வசனத்தின் நீண்ட நிபந்தனை அமைப்பு தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், வாரிசுரிமை, உடன் பாடுபடுதல், உடன் மகிமைப்படுத்தப்படுதல் ஆகிய தொடர்புகள் பேணப்பட்டுள்ளன.
