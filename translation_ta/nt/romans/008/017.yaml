    rationale: வசனத்தின் வாரிசுரிமைக் கூற்று நிகழ்கால அடையாளமாக உள்ளது; ἵνα-வின் நோக்கம்/விளைவு உறவைத் தமிழ் வழக்கில் இயல்பாகத் தர நிபந்தனைத் தொடருடன் ‘நாமும் ... மகிமைப்படுத்தப்படுவோம்’ என வழங்கலாம். இது துன்பம் மகிமையைச் சம்பாதிக்கிறது என்ற கருத்தைச் சேர்ப்பதில்லை.
  - severity: low
    issue: ‘பாடுபடுகிறோம்’ என்பதன் பொருள்வீச்சு
    rationale: இது உழைத்தல் அல்லது முயற்சி செய்தல் என்றும் பொருள்படலாம். συμπάσχομεν குறிக்கும் துன்பத்தில் பங்குபெறுதலை ‘அவருடன் துன்பப்படுகிறோம்’ தெளிவாகக் காட்டுகிறது.
  revised_text: நாம் பிள்ளைகள் என்றால், வாரிசுகளும்கூட—தேவனுடைய வாரிசுகளும் மெசியாவுடன்[a] இணை வாரிசுகளும். உண்மையிலேயே நாம் அவருடன் துன்பப்படுகிறோம் என்றால், நாமும் அவருடன் மகிமைப்படுத்தப்படுவோம்.
