review_pass:
  verdict: revise
  source_fidelity: திருத்தம் தேவை. வரைவில் συγκληρονόμοι-யின் உடனிணைவு பொருள் இருமுறை (‘மெசியாவுடன் உடன்’) சொல்லப்பட்டுள்ளது; மேலும் நிகழ்காலமான κληρονόμοι மற்றும் நிபந்தனைக்குப் பின்வரும் ἵνα-உறவு தேவையற்ற வகையில் எதிர்கால ‘ஆவோம்/செய்வோம்’ அமைப்பாகியுள்ளது. திருத்தம் வாரிசுரிமையின் தற்போதைய நிலை, மெசியாவுடனான பகிர்ந்த வாரிசுரிமை, அவருடன் துன்பப்படுதல், மற்றும் அவருடன் மகிமைப்படுத்தப்படுதல் ஆகியவற்றைப் பேணுகிறது.
  naturalness: ‘மெசியாவுடன் உடன் வாரிசுகள்’ இயல்பற்றதும் மீளுரைப்பும் ஆகும். ‘மெசியாவுடன் இணை வாரிசுகள்’ நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘மகிமைப்படுத்தப்படவும் செய்வோம்’ தமிழில் செயற்கையானது; ‘நாமும் அவருடன் மகிமைப்படுத்தப்படுவோம்’ இயல்பான வினைநடை.
  terminology: ‘பிள்ளைகள்,’ ‘வாரிசுகள்,’ ‘தேவனுடைய,’ மற்றும் பட்டப்பெயரின் பொருளை முன்னிறுத்தும் ‘மெசியா’ ஆகியவை பொருத்தமானவை. συμπάσχομεν-க்கு ‘துன்பப்படுகிறோம்’ என்பது ‘பாடுபடுகிறோம்’ என்பதைக் காட்டிலும் இச்சூழலில் suffering என்னும் பொருளைத் துல்லியமாகக் குறிக்கிறது. மாற்று ‘கிறிஸ்து’ அடிக்குறிப்பு பாதுகாக்கப்படுகிறது.
  issues:
  - severity: medium
    issue: ‘மெசியாவுடன்[a] உடன் வாரிசுகள்’ என்ற மீளுரை
    rationale: συγκληρονόμοι-யில் உள்ள συν- பொருளை ‘உடன் வாரிசுகள்’ எனவும், Χριστοῦ-வை ‘மெசியாவுடன்’ எனவும் வழங்குவதால் ‘உடன்’ இருமுறை வருகிறது. ‘மெசியாவுடன் இணை வாரிசுகள்’ ஒரேமுறை பகிர்ந்த வாரிசுரிமையைத் துல்லியமாக வெளிப்படுத்துகிறது.
  - severity: medium
