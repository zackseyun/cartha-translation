reference: Romans 8:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: ta
  text: இயேசுவை இறந்தோரிலிருந்து எழுப்பியவருடைய ஆவி உங்களில் குடியிருக்கிறதென்றால், மேசியாவாகிய இயேசுவை இறந்தோரிலிருந்து எழுப்பிய அவர், உங்களில் குடியிருக்கும் தம்முடைய ஆவியின் காரணமாக[a] மரணத்துக்குட்பட்ட உங்கள் உடல்களுக்கும் உயிரளிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களில் குடியிருக்கும் தம்முடைய ஆவியின் மூலமாக.”
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: ஆவி
  rationale: இரு இடங்களிலும் பவுலின் வாதத்தில் கடவுளுடைய பரிசுத்த ஆவியே குறிக்கப்படுகிறார்; மனித ஆவியோ உயிரற்ற ஆற்றலோ அல்ல.
- source_word: ἐγείραντος / ἐγείρας
  choice: எழுப்பிய
  rationale: இறந்தோரிலிருந்து உடலுடன் உயிர்த்தெழச் செய்த செயலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: இறந்தவர்களின் நிலையிலிருந்து உயிர்த்தெழுதலைத் தெளிவாகக் கூறும் இயல்பான நவீனத் தமிழ்.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: குடியிருக்கிறது / குடியிருக்கும்
  rationale: இரு சொற்களுக்கிடையேயுள்ள கருத்துத் தொடர்ச்சியைப் பாதுகாத்து, ஆவியின் உள்ளுறைதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Χριστὸν Ἰησοῦν
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός இங்கு வெறும் பெயராக அல்லாமல், அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப் பொருளைத் தக்கவைக்கிறது.
- source_word: ζῳοποιήσει
  choice: உயிரளிப்பார்
  rationale: எதிர்காலத்தில் அவர் உயிரைக் கொடுக்கும் செயலைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: θνητὰ σώματα
  choice: சாவுக்குரிய உங்கள் உடல்கள்
  rationale: உடல்களின் நாசமடையும், இறப்புக்குட்பட்ட இயல்பையும் அவை உண்மையான உடல்கள் என்பதையும் பாதுகாக்கிறது.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: தம்முடைய ஆவியின் காரணமாக
  rationale: SBLGNT-யில் διά என்பதுடன் வேற்றுமை உருபின் இரண்டாம் நிலை வடிவம் (accusative) வருவதால் அதன் இயல்பான காரணப் பொருளைப் பிரதான உரையில் தருகிறது.
theological_decisions:
- issue: இறுதி சொற்றொடரில் διὰ என்பதன் காரணப் பொருளையா கருவிப் பொருளையா தருவது
  choice: தம்முடைய ஆவியின் காரணமாக
  alternative: தம்முடைய ஆவியின் மூலமாக
  rationale: அச்சிடப்பட்ட SBLGNT வாசகத்தின் இலக்கணத்திற்கு முன்னுரிமை கொடுத்து காரணப் பொருள் பிரதான உரையில் வைக்கப்பட்டுள்ளது; பரவலான கருவிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: Χριστός என்பதில் பட்டப் பொருளைப் பாதுகாப்பது
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இச்சூழலில் Χριστός பட்டமாகச் செயல்படுவதால் அதன் பொருளை வாசகருக்குத் தெளிவுபடுத்துகிறது; அதை குடும்பப்பெயரைப் போல ஒலிக்கவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘குடியிருக்கிறது/குடியிருக்கும்’ என்ற சொல் மீளுருவாக்கம் கிரேக்கத்தின் கருத்துத் தொடர்ச்சியைப் பாதுகாக்கிறது; ‘உடல்களுக்கும்’ என்பதிலுள்ள ‘-க்கும்’ καί என்பதன் ‘மேலும்/கூட’ என்ற வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
