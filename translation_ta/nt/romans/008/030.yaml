source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: ta
  text: யாரை அவர் முன்குறித்தாரோ[a], அவர்களையும் அழைத்தார்; யாரை அழைத்தாரோ, அவர்களை நீதிமான்கள் என்று அறிவித்தார்; யாரை நீதிமான்கள் என்று அறிவித்தாரோ, அவர்களை மகிமைப்படுத்தினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்னரே தீர்மானித்தார்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “மகிமைப்படுத்தினார்” என்று இறந்தகால வடிவில் உள்ளது. எதிர்காலத்தில் கிடைக்கவிருக்கும் மகிமை மிகவும் உறுதியானது என்பதால், அது ஏற்கெனவே நிறைவேறியதுபோல் இங்கே கூறப்பட்டுள்ளதாகச் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: முன்னரே நியமித்தார்
  rationale: முன்கூட்டியே தீர்மானித்தல் அல்லது நியமித்தல் என்ற கிரேக்கப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; எந்த ஒரு குறிப்பிட்ட இறையியல் முறையையும் கூடுதலாகப் புகுத்தவில்லை.
- source_word: ἐκάλεσεν
  choice: அழைத்தார்
  rationale: καλέω என்பதன் வழக்கமான பொருளைச் சுருக்கமாகத் தருவதோடு, பவுலின் தொடர்ச்சியான வாதத்தையும் காக்கிறது.
- source_word: ἐδικαίωσεν
  choice: நீதிமான்கள் என்று அறிவித்தார்
  rationale: பவுலின் பயன்பாட்டில் காணப்படும் நீதிமன்றத் தீர்ப்பு சார்ந்த பொருளைத் தெளிவாகத் தருகிறது; ‘நீதிமான்களாக்கினார்’ என்று கூறி உள்ளார்ந்த மாற்றத்தை மட்டும் குறிக்கும் வகையில் பொருளைக் குறுக்கவில்லை.
- source_word: ἐδόξασεν
  choice: மகிமைப்படுத்தினார்
  rationale: கிரேக்க வினைச்சொல்லின் இறந்தகால வடிவை அப்படியே காத்து, பவுலின் சுருக்கமான தொடர் அமைப்பை நிலைநிறுத்துகிறது.
- source_word: οὓς ... τούτους
  choice: யாரை ... அவர்களை
  rationale: ஒவ்வொரு கட்டத்திலும் அதே மக்களையே சுட்டும் கிரேக்கத் தொடர்பமைப்பை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: -வும் செய்தார்
  rationale: ஒவ்வொரு செயலும் முந்திய செயலோடு சேர்ந்து தொடர்வதை உணர்த்தும் καί என்பதன் சேர்க்கைப் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் மென்மையான தொடர்ச்சியையே குறிக்கிறது; தமிழின் தொடர்புடைய வாக்கிய அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: προώρισεν என்பதன் முன்தீர்மானப் பொருளை இறையியல் சர்ச்சையைத் தவிர்ப்பதற்காக மென்மையாக்க வேண்டுமா?
  choice: முன்னரே நியமித்தார்
  alternative: முன்குறித்தார்
  rationale: கிரேக்கச் சொல் முன்கூட்டிய தீர்மானம் அல்லது நியமிப்பைத் தெளிவாகக் குறிக்கிறது. அதன் இறையியல் பதற்றத்தைத் தீர்த்து வைக்கும் விளக்கத்தைச் சேர்க்காமல் மூலத்தின் வலிமை காக்கப்படுகிறது.
- issue: ἐδόξασεν என்பதை இறந்தகாலமாகவா எதிர்காலமாகவா மொழிபெயர்ப்பது?
  choice: மகிமைப்படுத்தினார்
  alternative: மகிமைப்படுத்துவார்
  rationale: மூலத்தில் இறந்தகாலத்தைக் குறிக்கும் aorist indicative வடிவம் உள்ளது. இது உறுதியாக நிகழவிருக்கும் எதிர்கால மகிமையை ஏற்கெனவே நிறைவேறியதுபோல் கூறுகிறது என்ற புரிதல் அடிக்குறிப்பில் தரப்படுகிறது; பிரதான உரையில் காலவடிவம் மாற்றப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் மூன்று கட்ட இணை அமைப்பும் ஒரே மக்களைக் குறிக்கும் ‘யாரை ... அவர்களை’ என்ற மறுமொழியும் காக்கப்பட்டுள்ளன.
