  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: ta
  text: 'ஏனெனில் நான் உறுதியாக நம்புகிறேன்: மரணமோ வாழ்வோ, தேவதூதர்களோ ஆளும் அதிகாரங்களோ,[a] இப்போது இருப்பவையோ இனி வரவிருப்பவையோ, வல்லமைகளோ—எதுவும்…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆளும் அதிகாரங்கள்’ என்பதற்கு ‘அதிகாரத் தலைமைகள்’ என்றும் மொழிபெயர்க்கலாம்; இது அண்ட அல்லது ஆவிக்குரிய அதிகாரங்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: நான் உறுதியாக நம்புகிறேன்
  rationale: முற்றுப்பெற்ற வினைவடிவத்தின் நிகழ்கால விளைவாகத் தொடரும் நிலையான உறுதியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ ஆதாரத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: οὔτε ... οὔτε
  choice: …ஓ …ஓ … எதுவும்
  rationale: தொடர்ந்து வரும் மறுப்பு இணைப்புகளின் பட்டியல் ஓசையைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது; வாக்கியம் அடுத்த வசனத்தில் நிறைவடைவதால் ‘எதுவும்’ அதனுடன் தொடர்கிறது.
- source_word: θάνατος
  choice: மரணம்
  rationale: நேரடியான, வழக்கமான பொருள்; ‘வாழ்வு’ என்பதுடன் எதிரிணையாக உள்ளது.
- source_word: ζωή
  choice: வாழ்வு
  rationale: ‘மரணம்’ என்பதற்கு எதிரிணையான நேரடியான, இயல்பான தமிழ்ச் சொல்.
- source_word: ἄγγελοι
  choice: தேவதூதர்கள்
  rationale: சொல் ‘தூதர்கள்’ என்றும் பொருள்படலாம்; ஆனால் சுற்றியுள்ள அண்ட அல்லது மனிதருக்கு அப்பாற்பட்ட ஆற்றல்களின் பட்டியல் இங்கு தேவதூதர்களைக் குறிக்கிறது.
- source_word: ἀρχαὶ
  choice: ஆளுகை செலுத்துவோர்
  rationale: ஆட்சியாளர்கள் அல்லது அண்ட/ஆவிக்குரிய அதிகாரங்கள் என்ற பரந்த பொருளை, குறிப்பிட்ட இறையியல் வகைப்பாட்டுக்குள் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: ἐνεστῶτα
  choice: இப்போது இருப்பவை
  rationale: நிகழ்கால உண்மைகள் அனைத்தையும் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள பங்கேற்பு வடிவத்தை இயல்பான தமிழில் தருகிறது.
- source_word: μέλλοντα
  choice: இனி வரவிருப்பவை
  rationale: எதிர்கால உண்மைகளைக் குறிக்கும் வடிவத்தை ‘இப்போது இருப்பவை’ என்பதற்கு இணையான இயல்பான தொடராக வழங்குகிறது.
- source_word: δυνάμεις
  choice: வல்லமைகள்
  rationale: தனிப்பட்ட அல்லது ஆவிக்குரிய சக்திகளையும், ஆளற்ற ஆற்றல்களையும் குறிக்கக்கூடிய கிரேக்கச் சொல்லின் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀρχαὶ மற்றும் δυνάμεις என்பவை ஆவிக்குரிய உயிரினங்களின் தொழில்நுட்பப் பெயர்களாக மொழிபெயர்க்கப்பட வேண்டுமா?
  choice: முதன்மை உரையில் ‘ஆளுகை செலுத்துவோர்’ மற்றும் ‘வல்லமைகள்’ என்ற பரந்த சொற்கள் பயன்படுத்தப்பட்டன.
  alternative: ‘அதிகாரத் தலைமைகள் மற்றும் ஆவிக்குரிய வல்லமைகள்’ போன்ற குறிப்பான மொழிபெயர்ப்பு.
  rationale: இவை அண்ட அல்லது ஆவிக்குரிய அதிகாரங்களைக் குறிக்க வாய்ப்புள்ளது; எனினும் கிரேக்கச் சொற்கள் பரந்த பொருள் கொண்டவை. குறிப்பிட்ட இறையியல் அமைப்பைத் திணிக்காமல் அந்தப் பொருள் விரிவை மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பட்டியலின் திரும்பத் திரும்ப வரும் ஓசை ‘…ஓ’ அமைப்பால் தக்கவைக்கப்பட்டுள்ளது. இந்த வசனம் அடுத்த வசனத்தில் இலக்கண ரீதியாக நிறைவடைவதால் இறுதியில் நீள்கோடு இடப்பட்டுள்ளது.
