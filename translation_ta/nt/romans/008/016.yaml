  text: αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: ta
  text: ஆவியானவர் தாமே[a], நாம் கடவுளின் பிள்ளைகள் என்று நமது ஆவியோடு சேர்ந்து சாட்சி கூறுகிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவி தானே.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நமது ஆவிக்குச் சாட்சி கூறுகிறார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: ஆவியானவர் தாமே
  rationale: αὐτό தரும் வலியுறுத்தலை “தாமே” இயல்பாக வெளிப்படுத்துகிறது. இங்கு செயல்படும் பரிசுத்த ஆவியானவரைக் குறிப்பதால், நவீனத் தமிழில் தனிப்பட்ட செயற்பாட்டைக் காட்டும் “ஆவியானவர்” பயன்படுத்தப்பட்டது.
- source_word: συμμαρτυρεῖ
  choice: சேர்ந்து சாட்சி கூறுகிறார்
  rationale: συν- முன்னொட்டு உடனிணைந்த அல்லது கூட்டு சாட்சியைச் சுட்டுகிறது; “சேர்ந்து சாட்சி கூறுகிறார்” என்பது அந்த உறவைக் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: τῷ πνεύματι ἡμῶν
  choice: நமது ஆவியோடு
  rationale: இங்குள்ள வேற்றுமை வடிவம் உடனிணைவு அல்லது கூட்டுறவாகப் புரிந்துகொள்ளப்படலாம்; ஆகவே ஆவியானவர் நமது ஆவியுடன் சேர்ந்து சாட்சி கூறுகிறார் என்ற பொருள் முதன்மைப்படுத்தப்பட்டது.
- source_word: ὅτι ἐσμὲν
  choice: நாம் ... என்று
  rationale: ὅτι அறிமுகப்படுத்தும் கூற்றின் உள்ளடக்கத்தைத் தமிழில் இயல்பான மறைமுகக் கூற்று அமைப்பில் தருகிறது.
- source_word: τέκνα θεοῦ
  choice: கடவுளின் பிள்ளைகள்
  rationale: τέκνα பாலினத்தைச் சுட்டாமல் பிள்ளைகளைக் குறிக்கிறது; “கடவுளின் பிள்ளைகள்” குடும்ப உறவையும் உள்ளடக்கத் தன்மையையும் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: τῷ πνεύματι ἡμῶν என்பதன் தொடர்பு
  choice: நமது ஆவியோடு சேர்ந்து சாட்சி கூறுகிறார்
  alternative: நமது ஆவிக்குச் சாட்சி கூறுகிறார்
  rationale: συμμαρτυρεῖ பொதுவாக உடன் அல்லது இணைந்து சாட்சி கூறுதல் என்ற பொருளை ஆதரிக்கிறது. எனினும், இடைநிலை வேற்றுமையை பெறுநராகப் புரிந்துகொள்ளும் மாற்று வாசிப்பும் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: αὐτὸ τὸ πνεῦμα என்பதில் தனிப்பட்ட செயற்பாடு
  choice: ஆவியானவர் தாமே
  alternative: ஆவி தானே
  rationale: மூலத்தில் πνεῦμα இலக்கண ரீதியாக நடுநிலைப் பாலாக இருந்தாலும், தமிழ் இலக்கணத்தில் அதே கட்டுப்பாடு இல்லை. “தாமே” என்பது வலியுறுத்தலையும் இங்கு ஆவியானவர் மேற்கொள்ளும் தனிப்பட்ட சாட்சி செயலையும் இயல்பாக வெளிப்படுத்துகிறது; மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. “சாட்சியளிக்கிறார்” என்பதைக் காட்டிலும் அன்றாடத் தமிழுக்கு இயல்பான “சாட்சி கூறுகிறார்” தேர்ந்தெடுக்கப்பட்டது; “தாமே” மூலத்தின் வலியுறுத்தலைக் காக்கிறது.
