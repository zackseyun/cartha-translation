source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: ta
  text: அதுமட்டுமல்ல; ஆவியின் முதற்பலனைப் பெற்றிருக்கிற நாமும் கூட, நாமே நமக்குள்ளே பெருமூச்சுவிடுகிறோம்; மகன்களாகத் தத்தெடுக்கப்படுவதை[b]—அதாவது, நம் உடல்களின் மீட்பை[c]—ஆவலுடன் எதிர்பார்த்துக் காத்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது எளிமையாக, “தத்தெடுக்கப்படுவதை.” கிரேக்கச் சொல் மகனுக்குரிய நிலையையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில், “நம் உடலின் மீட்பை”; இங்கு ஒருமை ஒவ்வொருவருடைய உடலையும் குறிக்கும் பகிர்வுப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: அதுமட்டுமல்லாமல்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் பவுலின் எதிர்மறை ஒப்பீட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: நாமும்கூட
  rationale: விசுவாசிகளும் படைப்புடன் சேர்ந்து பெருமூச்சுவிடுகிறார்கள் என்ற வலியுறுத்தலைத் தமிழில் அளவுக்கு மீறிய மீளுரையின்றித் தெளிவாகக் காட்டுகிறது.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: ஆவியின் முதற்பலன்
  rationale: ἀπαρχή என்பதன் முதல் பகுதி அல்லது முதற்பலன் என்ற உருவகத்தைப் பாதுகாக்கிறது; ஆவியால் கிடைத்த முதற்பலனா, ஆவியே முதற்பலனா என்ற கிரேக்கத் தொடரின் சாத்தியமான இருபொருளையும் அடிக்குறிப்புடன் விடுகிறது.
- source_word: ἔχοντες
  choice: பெற்றிருக்கிற
  rationale: தங்களிடம் கொண்டிருக்கிறார்கள் என்ற நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν ἑαυτοῖς
  choice: நமக்குள்ளே
  rationale: பெருமூச்சு உள்ளார்ந்தது என்பதைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: στενάζομεν
  choice: பெருமூச்சுவிடுகிறோம்
  rationale: முந்தைய சூழலில் படைப்பு பெருமூச்சுவிடுவதுடன் உள்ள சொல் தொடர்பைப் பாதுகாக்கிறது.
- source_word: υἱοθεσίαν
  choice: மகன்களாகத் தத்தெடுக்கப்படுவது
  rationale: υἱοθεσία என்பதில் உள்ள மகனுக்குரிய சட்டப்பூர்வ நிலை மற்றும் வாரிசுரிமை நுணுக்கத்தைப் பாதுகாக்கிறது; இது பெண்களை விலக்காமல் எல்லா விசுவாசிகளுக்கும் வழங்கப்படும் நிலையைச் சுட்டுகிறது.
- source_word: ἀπεκδεχόμενοι
  choice: ஆவலுடன் எதிர்பார்த்துக் காத்திருக்கிறோம்
  rationale: தீவிரமான, எதிர்நோக்குடன் கூடிய காத்திருப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν ἀπολύτρωσιν
  choice: மீட்பு
  rationale: பவுலின் இறுதிக்கால விடுதலை சார்ந்த இறையியல் சொல்லாட்சியையும் அதன் வலிமையையும் தக்கவைக்கிறது.
- source_word: τοῦ σώματος ἡμῶν
  choice: நம் உடல்களின்
  rationale: கிரேக்கத்தில் ஒருமை பகிர்வுப் பொருளில் வந்திருந்தாலும், ஒவ்வொருவருடைய உடலையும் குறிக்கத் தமிழில் இயல்பான பன்மை பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: υἱοθεσία என்பதிலுள்ள மகனுக்குரிய நிலை மற்றும் வாரிசுரிமை உருவகத்தை எவ்வாறு பாதுகாப்பது
  choice: மகன்களாகத் தத்தெடுக்கப்படுவது
  alternative: தத்தெடுக்கப்படுவது
  rationale: கிரேக்கச் சொல் மகனுக்குரிய நிலையை வெளிப்படையாக உள்ளடக்குகிறது. பவுலின் சட்டப்பூர்வ வாரிசுரிமை உருவகத்தை முதன்மை உரை பாதுகாக்கிறது; அது ஆண்களுக்கும் பெண்களுக்கும் உரிய விசுவாசிகளின் பொது நிலையாகும்.
- issue: τὴν ἀπαρχὴν τοῦ πνεύματος என்பது ஆவியிடமிருந்து கிடைக்கும் முதற்பலனையா அல்லது முதற்பலனாகிய ஆவியையே குறிக்கிறதா
  choice: ஆவியின் முதற்பலன்
  alternative: முதற்பலனாகிய ஆவி
  rationale: கிரேக்க உருபுத் தொடர்பை ஒரே விளக்கமாக முடிவுசெய்யாமல் முதன்மை உரையில் நேரடியாகத் தக்கவைத்து, மற்ற சாத்தியத்தை அடிக்குறிப்பில் தருகிறது.
- issue: υἱοθεσίαவும் உடலின் மீட்பும் ஒன்றுக்கொன்று எவ்வாறு தொடர்புடையவை
  choice: மகன்களாகத் தத்தெடுக்கப்படுவதை—அதாவது, நம் உடல்களின் மீட்பை—
  alternative: மகன்களாகத் தத்தெடுக்கப்படுவதையும் நம் உடல்களின் மீட்பையும்
  rationale: இரண்டாவது பெயர்த்தொடர் முதலாவதை விளக்கும் பொருத்துநிலைத் தொடராக உள்ளது; எனவே உடல்களின் மீட்பு எதிர்பார்க்கப்படும் தத்தெடுப்பின் நிறைவை விளக்குவதாகக் கோடுகளால் காட்டப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “புத்திரசுவிகாரம்” போன்ற பழமையான திருச்சபைச் சொல்லுக்குப் பதிலாக “மகன்களாகத் தத்தெடுக்கப்படுவது” எனத் தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது. வசனத்தின் நீண்ட கிரேக்க வாக்கிய அமைப்பு வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; விளக்குநிலை உறவு கோடுகளால் பாதுகாக்கப்பட்டுள்ளது.
