id: ROM.8.20
reference: Romans 8:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: ta
  text: ஏனெனில், படைப்பு பயனற்ற நிலைக்கு[a] உட்படுத்தப்பட்டது; அது தன் விருப்பத்தால் அல்ல, அதை உட்படுத்தியவரின் காரணமாகவே[b], நம்பிக்கையில்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெறுமையான நிலைக்கு” அல்லது “நிறைவேறாத நிலைக்கு.”
    reason: lexical_alternative
  - marker: b
    text: “அதை உட்படுத்தியவர்” யார் என்று கிரேக்க உரை வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “நம்பிக்கையோடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: பயனற்ற நிலைக்கு
  rationale: இங்கு படைப்பு தனது உரிய இலக்கை அடைய முடியாத, பலனற்ற நிலைக்குக் கொண்டுவரப்பட்டதைக் குறிக்கிறது. ‘பயனற்ற நிலை’ என்பது ஒழுக்கத் தீமை என்ற பொருளைச் சேர்க்காமல், கருத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: κτίσις
  choice: படைப்பு
  rationale: ரோமர் 8:19–22 சூழலில் இது தனிப்பட்ட ஒரு உயிரினத்தை அல்ல, ஒட்டுமொத்தமாகப் படைக்கப்பட்ட உலகைக் குறிக்கிறது.
- source_word: ὑπετάγη
  choice: உட்படுத்தப்பட்டது
  rationale: வினையின் செயப்பாட்டு வடிவத்தையும், படைப்பின்மீது இந்த நிலை சுமத்தப்பட்டது என்பதையும் காக்கிறது.
- source_word: οὐχ ἑκοῦσα
  choice: அது தன் விருப்பத்தினால் அல்ல
  rationale: படைப்பு தானாக விரும்பி இந்நிலையை ஏற்கவில்லை என்ற செயற்பாட்டின்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: அதை உட்படுத்தியவரால்
  rationale: διά + accusative இங்குக் காரணத்தை அல்லது காரணமான நபரைச் சுட்டுகிறது. கிரேக்கத்தில் அந்த நபர் யார் என்று வெளிப்படையாகக் கூறப்படாததால் பொதுவான வடிவம் காக்கப்படுகிறது.
- source_word: ἐφ’ ἑλπίδι
  choice: நம்பிக்கையுடன்
  rationale: இந்தச் சுருக்கமான சொற்றொடரின் எதிர்நோக்குள்ள உணர்வைக் காக்கிறது; அதேவேளை ‘நம்பிக்கையின் அடிப்படையில்’ என்ற மாற்றுப் பொருளுக்கும் இடமுண்டு.
theological_decisions:
- issue: படைப்பை உட்படுத்தியவர் யார்?
  choice: முதன்மை உரையில் ‘அதை உட்படுத்தியவர்’ என்று அடையாளம் குறிப்பிடாமல் விடப்பட்டது.
  alternative: கடவுள் தீர்ப்பின்போது மீட்பின் நோக்குடன் படைப்பை உட்படுத்தினார்; அல்லது ஆதாமின் வீழ்ச்சி இதற்குக் காரணமானது; சிலர் சாத்தானையும் முன்வைக்கின்றனர்.
  rationale: கிரேக்க உரை இவ்வசனத்தில் அந்த நபரை வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே விளக்கவுரையால் தீர்மானிக்காமல் மூலத்தின் இறையியல் அழுத்தமும் தெளிவின்மையும் காக்கப்படுகின்றன.
- issue: ἐφ’ ἑλπίδι எதனோடு இணைகிறது?
  choice: தமிழில் இயல்பும் பொருள் தெளிவும் கருதி ‘உட்படுத்தப்பட்டது’ என்பதோடு இணைக்கப்பட்டு ‘நம்பிக்கையுடன் உட்படுத்தப்பட்டது’ என வழங்கப்பட்டது.
  alternative: ‘நம்பிக்கையின் அடிப்படையில்’ அல்லது அடுத்த வசனத்தின் விடுதலை எதிர்பார்ப்போடு நெருக்கமாக இணைத்துப் புரிந்துகொள்ளலாம்.
  rationale: சொற்றொடரின் இடமும் தொடரும் வாக்கிய அமைப்பும் பலவித இணைப்புக்கு இடமளிக்கின்றன; அடிக்குறிப்பு அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் செயப்பாட்டு அமைப்பு காக்கப்பட்டுள்ளது. ‘அதை உட்படுத்தியவர்’ என்ற சொல்லாட்சி நபரின் அடையாளத்தை இறையியல் ரீதியாக முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது; இறுதிச் சொற்றொடரின் அழுத்தத்தைத் தெளிவாக்க சிறு மீளுரைத்தல் பயன்படுத்தப்பட்டுள்ளது.
