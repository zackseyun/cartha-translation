revisions:
- from: ஏனெனில், படைப்பு பயனற்ற நிலைக்கு[a] உட்படுத்தப்பட்டது; அது தன் விருப்பத்தினால் அல்ல, அதை உட்படுத்தியவரால்[b]—நம்பிக்கையுடன்[c] உட்படுத்தப்பட்டது.
  to: ஏனெனில், படைப்பு பயனற்ற நிலைக்கு[a] உட்படுத்தப்பட்டது; அது தன் விருப்பத்தால் அல்ல, அதை உட்படுத்தியவரின் காரணமாகவே[b], நம்பிக்கையில்[c].
  rationale: The revision corrects the causal force of διὰ + accusative, removes an added repeated passive verb, and retains the ambiguity of the unnamed subject. The footnote for ἐφ’ ἑλπίδι is adjusted to give the close alternative “நம்பிக்கையோடு,” consistent with the English audit trail’s “with hope.”
