  text: Ἄρα οὖν, ἀδελφοί, ὀφειλέται ἐσμέν, οὐ τῇ σαρκὶ τοῦ κατὰ σάρκα ζῆν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: ta
  text: ஆகவே, சகோதரர்களே,[a] நாம் கடன்பட்டவர்களாக இருக்கிறோம்; மாம்சத்தின்படி வாழ்வதற்காக மாம்சத்திடம்[b] கடன்பட்டவர்கள் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதர சகோதரிகளே” என்றும் பொருள்படலாம்; கிரேக்கத்தில் “சகோதரர்களே” என்ற ஆண்பால் வடிவம் பயன்படுத்தப்பட்டாலும், விசுவாசக் குழுவினர் அனைவரையும் அழைக்கும் சொல்லாக இங்கு அமைந்துள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “மாம்சம்” என்பது வெறும் உடலை மட்டும் குறிக்காமல், பாவத்தின் ஆட்சிக்குட்பட்ட மனித வாழ்வுநிலையைக் குறிக்கிறது; “பாவ இயல்பு” என்பது ஒரு மாற்று மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: ஆகவே
  rationale: இரு தொடர்ச்சியான முடிவுரைப் பகுதிகளின் கருத்தையும் இயல்பான நவீன தமிழில் சுருக்கமாகத் தெரிவிக்கிறது; முந்தைய வாதத்திலிருந்து வரும் முடிவைச் சுட்டுகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை அழைப்புமுறையைத் தக்கவைக்கிறது; இங்கு முழு விசுவாசக் குழுவும் உள்ளடங்கலாம் என்பதைக் குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: ὀφειλέται ἐσμέν
  choice: நாம் கடன்பட்டவர்களாக இருக்கிறோம்
  rationale: நிதிக் கடனை மட்டும் குறிக்காமல், உருவகமான கடமை அல்லது கட்டுப்பாட்டை உணர்த்தும் ὀφειλέται என்பதன் ‘கடன்பட்டவர்கள்’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: τῇ σαρκί / κατὰ σάρκα
  choice: மாம்சத்திடம் / மாம்சத்தின்படி
  rationale: பவுலின் மாம்சம்–ஆவி எதிர்மறை அமைப்பையும் ஒரே மூலச்சொல்லின் மீளுரைப்பையும் காக்கிறது; ‘பாவ இயல்பு’ என்று விளக்கி முடிவுசெய்வதைத் தவிர்க்கிறது.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: மாம்சத்தின்படி வாழ்வதற்கு
  rationale: மாம்சத்துக்குக் கடன்பட்டவர்கள் அல்ல என்பதன் விளைவாக அல்லது உள்ளடக்கமாகக் கூறப்படும் வாழ்வுமுறையைத் தெளிவாகவும் மூலத்தின் அமைப்புக்கு நெருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: பவுலின் σάρξ என்ற சொல்லை விளக்கவுரையாக மொழிபெயர்க்க வேண்டுமா?
  choice: மாம்சம்
  alternative: பாவ இயல்பு
  rationale: இப்பகுதியில் உடலை மட்டும் குறிக்காத உருவகப் பொருள் இருந்தாலும், ‘பாவ இயல்பு’ என்று நேரடியாக மொழிபெயர்ப்பது பவுலின் சொற்பயன்பாட்டையும் அதன் இறையியல் பதற்றத்தையும் முன்கூட்டியே தீர்த்துவிடும். எனவே முதன்மை உரையில் ‘மாம்சம்’ வைக்கப்பட்டு மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற செறிவும் கொண்ட நடை. ‘கடன்பட்டவர்கள்’ மற்றும் ‘மாம்சம்’ என்ற உருவகச் சொற்கள் மூலத்தின் சொற்பிணைப்பையும் இறையியல் தெளிவின்மையையும் காக்கின்றன; அடிக்குறிப்புகள் சாதாரண வாசகருக்குத் தேவையான விளக்கத்தை வழங்குகின்றன.
