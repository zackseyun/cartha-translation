id: ROM.8.19
reference: Romans 8:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: ta
  text: ஏனெனில், படைப்புலகம் கடவுளுடைய மகன்கள்[a] வெளிப்படுத்தப்படுவதை ஆவலோடு எதிர்பார்த்துக் காத்திருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய பிள்ளைகள்.” கிரேக்க மூலத்தில் “மகன்கள்” என்று உள்ளது; இது மகனுக்குரிய நிலையையும் வாரிசுரிமையையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றை விளக்கும் காரணத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀποκαραδοκία
  choice: ஆவலோடு எதிர்பார்த்து
  rationale: தீவிரமான, முன்னோக்கிய எதிர்பார்ப்பைத் தமிழில் இயல்பாக வினையடைத் தொடராக வெளிப்படுத்துகிறது.
- source_word: κτίσεως
  choice: படைப்புலகம்
  rationale: தனிப்பட்ட ஒரு படைப்புயிரை அல்லாமல், சூழலில் உள்ள ஒட்டுமொத்தப் படைப்பின் பரப்பைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἀποκάλυψιν
  choice: வெளிப்படுத்தப்படுவதை
  rationale: இப்போது மறைந்திருக்கும் அடையாளம் வருங்காலத்தில் வெளிப்படையாகத் தெரியவருவதைக் குறிக்கிறது.
- source_word: υἱῶν
  choice: மகன்கள்
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மையைப் பாதுகாப்பதோடு, பவுலின் சூழலில் மகனுக்குரிய நிலை மற்றும் வாரிசுரிமை சார்ந்த ஒலிப்பையும் தக்கவைக்கிறது.
- source_word: θεοῦ
  choice: கடவுளுடைய
  rationale: உறவைக் குறிக்கும் கிரேக்க உடைமை வேற்றுமையை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: ἀπεκδέχεται
  choice: காத்திருக்கிறது
  rationale: முன்னோக்கிய காத்திருப்பைத் தெரிவிக்கிறது; அதன் தீவிரம் ஏற்கெனவே ‘ஆவலோடு எதிர்பார்த்து’ என்பதில் வெளிப்படுவதால் தேவையற்ற மறுகூறலைத் தவிர்க்கிறது.
theological_decisions:
- issue: υἱῶν θεοῦ என்பதை ‘கடவுளுடைய மகன்கள்’ என ஆண்பால் வடிவில் தருவதா, அல்லது உள்ளடக்கப் பொருளை முன்னிறுத்தி ‘கடவுளுடைய பிள்ளைகள்’ எனத் தருவதா?
  choice: கடவுளுடைய மகன்கள்
  alternative: கடவுளுடைய பிள்ளைகள்
  rationale: மூல கிரேக்கம் ஆண்பால் பன்மையைப் பயன்படுத்துகிறது. ‘மகன்கள்’ என்பது அந்த வடிவத்தையும், மகனுக்குரிய நிலை அல்லது வாரிசுரிமை பற்றிய சாத்தியமான பவுலிய ஒலிப்பையும் பாதுகாக்கிறது; அதேவேளை மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘படைப்புலகம்’ என்பது கூட்டுத்தொகையான பிரபஞ்சப் படைப்பைக் குறிக்கிறது; ‘ஆவலோடு எதிர்பார்த்துக் காத்திருக்கிறது’ என்பது ἀποκαραδοκία மற்றும் ἀπεκδέχεται ஆகிய இரண்டின் கூட்டு வலிமையை இயல்பாகத் தக்கவைக்கிறது.
