  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: ta
  text: கடவுளால் தேர்ந்தெடுக்கப்பட்டவர்களுக்கு[a] எதிராக யார் குற்றச்சாட்டு சுமத்துவார்?[b] அவர்களை நீதிமான்கள் என்று அறிவிப்பவர் கடவுளே.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் தேர்ந்தெடுக்கப்பட்டவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யார் அவர்கள்மேல் குற்றஞ்சாட்டுவார்?”
    reason: lexical_alternative
  - marker: c
    text: “நீதிமான்கள் என்று அறிவிப்பவர்” என்பது நீதிமன்றச் சூழலுக்குரிய மொழி; கடவுள் அவர்களை நீதிமான்கள் என்று அறிவிக்கிறார் என்ற பொருளைத் தருகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: யார்
  rationale: வினாவுக்குரிய சுட்டுப்பெயரை நேரடியாகவும் இயல்பாகவும் தருகிறது; இங்கு இது விடையை எதிர்பார்க்காத வலியுறுத்தும் வினாவாக உள்ளது.
- source_word: ἐγκαλέσει
  choice: குற்றம் சுமத்துவார்
  rationale: ஒருவருக்கு எதிராகச் சட்டரீதியான குற்றச்சாட்டைக் கொண்டுவரும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατὰ
  choice: மீது
  rationale: குற்றச்சாட்டு தொடர்பான தமிழ்ப் பயன்பாட்டில் எதிரான நோக்கை இயல்பாகக் குறிக்கிறது.
- source_word: ἐκλεκτῶν θεοῦ
  choice: கடவுள் தேர்ந்தெடுத்தவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் ἐκλεκτῶν என்பதையும் θεοῦ உடனான உறவையும் தெளிவாக வெளிப்படுத்துகிறது; பிற்காலக் கோட்பாட்டுச் சொல்லாட்சியைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
- source_word: θεὸς ὁ δικαιῶν
  choice: நீதிமான்கள் எனத் தீர்ப்பளிப்பவர் கடவுளே
  rationale: முன்னிலைப்படுத்தப்பட்ட θεὸς என்பதன் வலியுறுத்தலை ‘கடவுளே’ எனக் காக்கிறது; δικαιόω என்பதன் நீதிமன்றச் சூழலிலான ‘நீதிமான் எனத் தீர்ப்பளித்தல்’ என்ற பொருளையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐκλεκτῶν என்பதைக் கோட்பாட்டுத் தொழில்நுட்பச் சொல்லாக மாற்றாமல் மொழிபெயர்த்தல்
  choice: கடவுள் தேர்ந்தெடுத்தவர்கள்
  alternative: கடவுளுடைய தெரிந்துகொள்ளப்பட்டவர்கள்
  rationale: கடவுள் தேர்ந்தெடுத்தார் என்ற மூலப்பொருளைத் தெளிவாகக் காத்து, குறிப்பிட்ட பிற்காலத் தத்துவ அமைப்பை மொழிபெயர்ப்பில் முன்கூட்டியே புகுத்தாமல் இருக்கிறது.
- issue: θεὸς ὁ δικαιῶν என்பதன் சுருக்கமான, வலியுறுத்தப்பட்ட அமைப்பு
  choice: நீதிமான்கள் எனத் தீர்ப்பளிப்பவர் கடவுளே
  alternative: நீதிமான்களாக்குகிறவர் கடவுளே
  rationale: பவுலின் நீதிமன்றப் பின்னணியை வெளிப்படுத்தி, கடவுள்தாமே சாதகமான தீர்ப்பு வழங்குபவர் என்ற வலியுறுத்தலைக் காக்கிறது; ‘ஆக்குதல்’ என்ற மாற்று வாசிப்பால் ஏற்படக்கூடிய பொருள் தீர்மானிப்பைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமானவும் எளிதில் புரிந்துகொள்ளக்கூடியவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தின் நீதிமன்ற உருவகத்தை ‘குற்றம் சுமத்துதல்’ என்பதும், அடுத்த கூறின் வலியுறுத்தலை ‘கடவுளே’ என்பதும் காக்கின்றன.
