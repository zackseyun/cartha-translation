  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: ta
  text: உயரமோ, ஆழமோ, வேறெந்தப் படைக்கப்பட்ட ஒன்றுமோ, நம் ஆண்டவராகிய மெசியா இயேசுவில் இருக்கும் கடவுளின் அன்பிலிருந்து நம்மைப் பிரிக்க வல்லதாக இருக்காது.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வேறெந்தப் படைக்கப்பட்ட ஒன்றும்” என்பதை “படைப்பில் உள்ள வேறு எதுவும்” அல்லது “வேறு எந்தப் படைப்புயிரும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மெசியா இயேசு” என்பது மரபாக “கிறிஸ்து இயேசு” என வழங்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: இங்கு “கடவுளின் அன்பு” என்பது பெரும்பாலும் கடவுள் நம்மீது கொண்டுள்ள அன்பைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: உயரம்
  rationale: βάθος என்பதுடன் இணைந்த எதிர்மறைச் சொல்லிணையாக வருவதால், இடவெளி சார்ந்த நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: βάθος
  choice: ஆழம்
  rationale: ὕψωμα என்பதற்கு இயல்பான எதிரிணையாக இருந்து, மூலத்தின் சொல்லாட்சியையும் விரிந்த எல்லைகளின் உணர்வையும் காக்கிறது.
- source_word: κτίσις ἑτέρα
  choice: படைக்கப்பட்ட வேறெதுவும்
  rationale: κτίσις என்பதின் ‘படைப்பு/படைக்கப்பட்ட ஒன்று’ என்ற பொருள் வரம்பையும், ἑτέρα மற்றும் τις தரும் ‘வேறு எதுவும்’ என்ற உறுதியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δυνήσεται
  choice: வல்லதாக இருக்காது
  rationale: எதிர்காலத் திறனைச் சுட்டும் வினை வடிவத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: χωρίσαι
  choice: பிரிக்க
  rationale: ஒருவரை அன்பிலிருந்து துண்டிக்கும் அல்லது விலக்கும் கருத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀγάπης τοῦ θεοῦ
  choice: கடவுளின் அன்பு
  rationale: மூலத்தின் உரிமை வேற்றுமை அமைப்பைத் தக்கவைத்து, அன்பின் திசையை முதன்மை உரையில் தேவையின்றித் தீர்மானிக்காமல் விடுகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மெசியா இயேசுவில்
  rationale: Χριστός இங்கு பட்டப்பெயராக இருப்பதால் ‘மெசியா’ எனப் பொருள் மொழிபெயர்க்கப்படுகிறது; ἐν என்பதற்கு ‘-இல்’ தக்கவைக்கப்படுகிறது.
- source_word: κυρίῳ ἡμῶν
  choice: நம் ஆண்டவராகிய
  rationale: κύριος என்பதின் கிறிஸ்துவியல் பட்டப்பெயரை மரியாதையான, வழக்கமான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘கடவுளின் அன்பு’ என்பதில் உள்ள உரிமை வேற்றுமையின் பொருள்
  choice: முதன்மை உரையில் ‘கடவுளின் அன்பு’ என்று அமைப்பைத் தக்கவைத்தல்
  alternative: ‘கடவுள் நம்மீது கொண்டுள்ள அன்பு’ என்று வெளிப்படையாகத் தீர்மானித்தல்
  rationale: ரோமர் 8:31–39 சூழல் கடவுள் விசுவாசிகள்மீது கொண்ட அன்பை வலுவாகக் குறிக்கிறது; எனினும் மூலத்தின் சுருக்கமான உரிமை வேற்றுமை அமைப்பை முதன்மை உரையில் காத்து, சூழலால் அதிகம் சாத்தியமான பொருளை அடிக்குறிப்பில் தெரிவிப்பது பொருத்தமானது.
- issue: ἐν Χριστῷ Ἰησοῦ என்பதின் தொடர்பு
  choice: தமிழில் இயல்புக்காக ‘மெசியா இயேசுவில் வெளிப்படும்’
  alternative: சொல்லுக்குச் சொல் ‘மெசியா இயேசுவில் இருக்கும்’
  rationale: கடவுளின் அன்பு மெசியா இயேசுவில் கிடைக்கிறது அல்லது அறியப்படுகிறது என்ற தொடர்பை ‘வெளிப்படும்’ இயல்பாகச் சொல்கிறது; ஆனால் ἐν என்பதின் பரந்த தொடர்பை அளவுக்கு மீறி விளக்காதிருக்க மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு தெளிவாகவும் வேதவாக்கியத்துக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘மெசியா’ பட்டப்பெயராக மொழிபெயர்க்கப்பட்டுள்ளது; ‘கிறிஸ்து’ என்ற மரபுவழி ஒலிபெயர்ப்பு முதன்மைப்படுத்தப்படவில்லை.
