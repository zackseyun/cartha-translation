  source_fidelity: முதன்மை உரையில் இருந்த “வெளிப்படும்” என்பது ἐν ('-இல்') என்பதைக் காட்டிலும் குறிப்பான விளக்கத்தைச் சேர்த்தது. அதை “இருக்கும்” என மாற்றுவது மூலத்தின் தொடர்பைத் திறந்தவாறே காக்கிறது. மற்ற முக்கிய கூறுகள்—உயரம்/ஆழம், எதிர்கால இயலாமை, பிரித்தல், கடவுளின் அன்பு, மெசியா இயேசு, நம் ஆண்டவர்—மூலத்துடன் பொருந்துகின்றன.
