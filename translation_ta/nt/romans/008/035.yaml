id: ROM.8.35
reference: Romans 8:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: ta
  text: மேசியாவின் அன்பிலிருந்து நம்மை யார் பிரிப்பார்? துன்பமோ, நெருக்கடியோ, துன்புறுத்தலோ, பஞ்சமோ, ஆடையின்மையோ, ஆபத்தோ, வாளோ நம்மைப் பிரிக்குமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியாவிடம் நாம் கொண்ட அன்பிலிருந்து.” கிரேக்க உடைமை வேற்றுமையை இவ்வாறும் புரிந்துகொள்ளலாம்; எனினும், சூழல் “மேசியா நம்மீது கொண்ட அன்பு” என்ற பொருளையே ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: யார்
  rationale: ஆளைக் குறிக்கும் வினாப்பெயரை இயல்பாக மொழிபெயர்த்து, பவுலின் சொல்லாட்சிக் கேள்வியைப் பாதுகாக்கிறது.
- source_word: χωρίσει
  choice: பிரிப்பார் / பிரிக்குமா
  rationale: எதிர்காலத்தில் அல்லது சாத்தியமாக நிகழக்கூடிய பிரித்தலைக் குறிக்கும் வினையைத் தமிழில் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; தொடரும் பட்டியலில் எழுவாய் உயிரற்றதாக இருப்பதால் ‘பிரிக்குமா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀγάπης
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான தெளிவான, வழக்கமான நவீனத் தமிழ் இணைச்சொல்.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு பட்டப்பெயராக இருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது; பிரதான உரையில் சூழல் ஆதரிக்கும் எழுவாய்சார் உடைமைப் பொருள் காட்டப்படுகிறது.
- source_word: θλῖψις
  choice: துன்பம்
  rationale: அழுத்தத்தையும் வேதனையையும் உள்ளடக்கும் பரந்த பொருளை, சாதாரண வாசகருக்குப் புரியும் கண்ணியமான தமிழில் தருகிறது.
- source_word: στενοχωρία
  choice: நெருக்கடி
  rationale: இடுக்கண், நெருக்கம், கடும் அழுத்தம் ஆகிய கருத்துகளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; θλῖψις என்பதிலிருந்து ஓரளவு வேறுபாட்டையும் காக்கிறது.
- source_word: διωγμός
  choice: துன்புறுத்தல்
  rationale: விசுவாசம் அல்லது அடையாளம் காரணமாக ஒருவரைத் தொடர்ந்து ஒடுக்குவதைக் குறிக்கும் துல்லியமான தமிழ் சொல்.
- source_word: λιμός
  choice: பஞ்சம்
  rationale: தனிப்பட்ட பசியை மட்டும் அல்லாமல், கடுமையான உணவுப் பற்றாக்குறையைக் குறிக்கும் சொல்லின் இயல்பான தமிழ் இணை.
- source_word: γυμνότης
  choice: ஆடையின்மை
  rationale: ‘நிர்வாணம்’ என்பதால் உருவாகக்கூடிய தேவையற்ற பாலியல் அல்லது சடங்கு நுண்ணுணர்வைத் தவிர்த்து, உடையின்றி வறுமையில் இருப்பதைக் தெளிவாகக் குறிக்கிறது.
- source_word: κίνδυνος
  choice: ஆபத்து
  rationale: சமகாலத் தமிழில் பரவலாகப் புரியும் நேரடி இணைச்சொல்.
- source_word: μάχαιρα
  choice: வாள்
  rationale: மூலத்தின் நேரடியான படிமத்தையும் உயிர்க்கொல்லும் வன்முறையின் அச்சுறுத்தலையும் பாதுகாக்கிறது.
theological_decisions:
- issue: τοῦ Χριστοῦ என்ற சொற்றொடரிலுள்ள வேற்றுமை உறவு
  choice: மேசியா நம்மீது கொண்ட அன்பு என்பதைக் குறிக்கும் ‘மேசியாவின் அன்பு’
  alternative: மேசியாவிடம் நாம் கொண்ட அன்பு
  rationale: கிரேக்க உடைமை வேற்றுமை இலக்கண ரீதியாக இருவிதமாகப் புரிந்துகொள்ளப்படலாம். ரோமர் 8:31–39 சூழல் மேசியா விசுவாசிகள்மீது கொண்ட அன்பை வலுவாக ஆதரிப்பதால் அது பிரதான உரையில் தரப்படுகிறது; உண்மையான மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. முதல் கேள்வியின் ‘யார்’ என்பதையும் தொடர்ந்து வரும் உயிரற்ற துன்பங்களின் பட்டியலையும் தமிழில் இயல்பாக இணைக்க, இரண்டாவது கேள்வியில் ‘நம்மைப் பிரிக்குமா?’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டது. பட்டியலின் மீளும் ‘-ஓ’ அமைப்பு கிரேக்க ἢ தொடரின் சொல்லாட்சித் தாக்கத்தைப் பாதுகாக்கிறது.
