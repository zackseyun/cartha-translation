reference: Romans 8:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: ta
  text: அதேபோல, ஆவியும் நமது பலவீனத்தில் நமக்குத் துணையாக இருக்கிறது. ஏனெனில், எதற்காகத் தகுந்த முறையில் வேண்டிக்கொள்ள வேண்டும் என்பதை நாம் அறியவில்லை; ஆனால் ஆவியே சொற்களால் வெளிப்படுத்த முடியாத பெருமூச்சுகளோடு நமக்காகப் பரிந்துபேசுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως
  choice: அவ்வாறே
  rationale: முந்தைய கருத்துடன் பவுல் இணைத்துக் கூறுவதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: συναντιλαμβάνεται
  choice: நமக்குத் துணைசெய்கிறார்
  rationale: ஒருவரின் சுமையை அவருடன் சேர்ந்து ஏற்றுக்கொண்டு உதவும் வலுவான பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: நமது பலவீனத்தில்
  rationale: ஒருமை வடிவத்தையும் உடல் அல்லது ஆன்மிக வரம்பு என்று குறுக்காமல் பொதுவான பொருளையும் காக்கிறது.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: நாம் வேண்டியபடி எதற்காக மன்றாட வேண்டும்
  rationale: τί என்பதன் பொருளை ‘எதற்காக’ என்றும் καθὸ δεῖ என்பதைக் ‘வேண்டியபடி’ என்றும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: தூய ஆவியானவர் தாமே
  rationale: αὐτό தரும் வலியுறுத்தலையும், உதவி செய்து பரிந்துபேசும் தனிப்பட்ட செயலையும் மரியாதையான தமிழில் காட்டுகிறது.
- source_word: ὑπερεντυγχάνει
  choice: நமக்காகப் பரிந்துபேசுகிறார்
  rationale: மற்றொருவருக்காக வேண்டிக்கொள்ளுதல் அல்லது பரிந்துரைத்தல் என்ற இடைநிலைச் செயலைத் தெளிவாகத் தருகிறது; ‘நமக்காக’ என்பது சூழலால் உணர்த்தப்படும் பயனாளியை வெளிப்படுத்துகிறது.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: சொற்களால் வெளிப்படுத்த முடியாத பெருமூச்சுகளோடு
  rationale: ἀλάλητος என்பது பேசப்படாதது அல்லது சொற்களால் சொல்ல இயலாதது என்ற இரு நெருங்கிய சாத்தியங்களைக் கொண்டுள்ளது; முதன்மை உரை வெளிப்படுத்த இயலாமையைத் தேர்ந்து, அடிக்குறிப்பில் மாற்றைத் தருகிறது.
theological_decisions:
- issue: πνεῦμα என்பதன் இலக்கண நடுநிலை வடிவத்தையும் ஆவியின் தனிப்பட்ட செயலையும் எவ்வாறு தமிழில் காட்டுவது
  choice: தூய ஆவியானவர் தாமே
  alternative: ஆவி தானே
  rationale: கிரேக்க இலக்கணப் பாலை தமிழில் இயந்திரமாகப் பிரதிபலிக்காமல், வசனத்தில் ஆவி உதவி செய்து பரிந்துபேசும் தனிப்பட்ட செயலை வெளிப்படுத்துகிறது. ‘தாமே’ αὐτόவின் வலியுறுத்தலைக் காக்கிறது.
- issue: στεναγμοῖς யாருடைய பெருமூச்சுகள் என்பதைத் தீர்மானிப்பது
  choice: உரிமையாளரை வெளிப்படையாகச் சேர்க்காமல் ‘பெருமூச்சுகளோடு’ என்று வைத்தல்
  alternative: ஆவியானவரின் பெருமூச்சுகளோடு / நமது பெருமூச்சுகளின் வழியாக
  rationale: கிரேக்க உரை பெருமூச்சுகளை ஆவியின் செயல் சார்ந்து கூறினாலும், அவற்றின் அனுபவ உரிமையாளரைத் தனியாகத் தெளிவுபடுத்தவில்லை; எனவே உண்மையான விளக்கத் திறப்பை மூடவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘மன்றாடுதல்’, ‘பரிந்துபேசுதல்’ ஆகியவை திருச்சபைச் சொற்களாக மட்டும் இல்லாமல் சாதாரண வாசகருக்கும் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டன. ‘தூய ஆவியானவர்’ தனிப்பட்ட செயலை இயல்பாகக் காட்டுகிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கம் தவிர்க்கப்பட்டது.
