revisions:
- from: மாம்சத்துக்கு உட்பட்டவர்களோ கடவுளுக்கு உகந்தவர்களாய் இருக்க முடியாது.[a]
  to: மாம்சத்தில் இருப்பவர்களோ கடவுளைப் பிரியப்படுத்த முடியாது.[a]
  rationale: 'The revision more closely follows the Greek wording and verbal force: ἐν σαρκὶ is represented as “மாம்சத்தில்,” while θεῷ ἀρέσαι is rendered directly as “கடவுளைப் பிரியப்படுத்த.” The explanatory alternative remains in the footnote, preserving the debated Pauline nuance without imposing it on the main text.'
