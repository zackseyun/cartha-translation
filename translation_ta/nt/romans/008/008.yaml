id: ROM.8.8
reference: Romans 8:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν σαρκὶ ὄντες θεῷ ἀρέσαι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/008.yaml
  text: Those who are in the flesh cannot please God[a].
translation:
  language: ta
  text: மாம்சத்தில் இருப்பவர்களோ கடவுளைப் பிரியப்படுத்த முடியாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “பாவ இயல்புக்கு உட்பட்டவர்கள்.” கிரேக்க மூலத்தில் “மாம்சத்தில் இருப்பவர்கள்” என்று உள்ளது; இச்சூழலில் இது பவுல் பயன்படுத்தும் முக்கியமான சொற்றொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: உட்பட்டவர்கள்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் குறிப்புப் பெயரெச்சம் ஒரு வகையினரின் தற்போதைய நிலையைச் சுட்டுகிறது. ‘உட்பட்டவர்கள்’ என்பது ἐν σαρκὶ என்பதன் நிலை மற்றும் ஆதிக்கம் சார்ந்த பொருளை இயல்பான தமிழில் இணைத்துத் தருகிறது.
- source_word: δὲ
  choice: -ஓ
  rationale: δέ முந்தைய கருத்துடன் தொடர்ச்சியையும் முரண்பாட்டையும் குறிக்கிறது. தனிச் சொல்லைச் சேர்ப்பதைவிட ‘அவர்களோ’ என்பதிலுள்ள -ஓ தமிழில் அந்த மாறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν σαρκὶ
  choice: மாம்சத்துக்கு உட்பட்ட
  rationale: σάρξ என்பதற்கான ‘மாம்சம்’ என்ற பவுலின் முக்கியச் சொல்லைப் பாதுகாத்தபடியே, இங்கு உடலினுள் இருப்பதை அல்லாமல் மாம்சத்தால் வரையறுக்கப்படும் நிலையைச் சுட்டுவதைத் தமிழில் தெளிவாக்குகிறது. ‘பாவ இயல்பு’ என்று முழுமையாக விளக்கிப் பொருள் முடிவுசெய்யவில்லை.
- source_word: θεῷ ἀρέσαι
  choice: கடவுளுக்கு உகந்தவர்களாய் இருக்க
  rationale: ἀρέσκω என்பதன் தத்துவார்த்தம் ‘ஒருவருக்கு உகந்ததாக/பிரியமானதாக இருத்தல்.’ ‘கடவுளைப் பிரியப்படுத்த’ என்பதும் சாத்தியம்; இங்கு நிலையைச் சுட்டும் சூழலில் ‘கடவுளுக்கு உகந்தவர்களாய் இருக்க’ என்பது இயல்பான, கண்ணியமான தமிழ்.
- source_word: οὐ δύνανται
  choice: முடியாது
  rationale: மறுக்கப்பட்ட ஆற்றல் அல்லது இயலாமையைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ரோமர் 8-இல் σάρξ என்ற பவுலின் பலபொருள் கொண்ட சொல்லை மொழிபெயர்த்தல்
  choice: மாம்சத்துக்கு உட்பட்ட
  alternative: பாவ இயல்புக்கு உட்பட்ட
  rationale: ‘மாம்சம்’ என்ற மூல உருவகத்தையும் இவ்வதிகாரத்தின் கருத்துத் தொடர்பையும் முதன்மை உரை பாதுகாக்கிறது. அதேவேளை ‘உட்பட்ட’ என்பது இது வெறும் உடலைக் குறிக்காமல் வாழ்வை வரையறுக்கும் நிலையைச் சுட்டுவதை இயல்பாக உணர்த்துகிறது. ‘பாவ இயல்பு’ என்ற விளக்கமான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மாம்சம்’ என்ற வேதாகமச் சொல் அதன் பவுலிய கருத்துச் சுமையைப் பாதுகாக்க வைக்கப்பட்டுள்ளது; ‘மாம்சத்தில் இருப்பவர்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பின் இயல்பின்மையைத் தவிர்க்க ‘மாம்சத்துக்கு உட்பட்டவர்கள்’ என வழங்கப்பட்டுள்ளது.
