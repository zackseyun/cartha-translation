id: ROM.8.4
reference: Romans 8:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: ta
  text: சட்டத்தின் நீதியான கோரிக்கை[a], மாம்சத்தின்படி[b] நடக்காமல் ஆவியின்படி[c] நடக்கிற நம்மில் நிறைவேறும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சட்டத்தின் கோரிக்கை.’
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘மாம்சம்’ என்பது வெறும் உடலைக் குறிக்காமல், கடவுளைவிட்டு விலகிய வீழ்ச்சியுற்ற மனித இயல்பையோ அதற்கேற்ப அமைந்த வாழ்க்கையையோ குறிக்கிறது; சிலர் ‘பாவ இயல்பு’ என்று மொழிபெயர்க்கிறார்கள்.
    reason: lexical_alternative
  - marker: c
    text: ‘ஆவியின்படி’ என்பதை ‘ஆவிக்கேற்ப’ என்றும் மொழிபெயர்க்கலாம். ரோமர் 8-ன் சூழலில் இது பெரும்பாலும் தூய ஆவியைக் குறிக்கிறது; ஆனால் கிரேக்கச் சொல் தனியாகப் பார்க்கும்போது ‘ஆவி’ என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: நிறைவேறும்படியாக
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் ἵνα என்பதன் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது; முந்தைய வசனத்துடன் இணையும் துணைவாக்கிய அமைப்பையும் பாதுகாக்கிறது.
- source_word: δικαίωμα
  choice: நீதியான கோரிக்கை
  rationale: இங்கு சட்டம் விதிக்கும் நியாயமான கடப்பாட்டைக் குறிக்கிறது; சட்டரீதியான ‘கோரிக்கை’ என்பதையும் அதன் நீதியான தன்மையையும் சேர்த்துப் பாதுகாக்கிறது.
- source_word: νόμος
  choice: சட்டம்
  rationale: பவுலின் இச்சூழலில் வரும் சட்டத்தைக் குறிக்கும் நேரடியான, நவீன தமிழ்ச் சொல்.
- source_word: πληρωθῇ
  choice: நிறைவேறும்படியாக
  rationale: இறந்தகால வினை அடிப்படையிலான passive subjunctive வடிவத்தின் நோக்கம்/விளைவு மற்றும் செயப்பாட்டு உணர்வைத் தக்கவைக்கிறது; யாரால் நிறைவேற்றப்படுகிறது என்பதைச் சேர்க்கவில்லை.
- source_word: ἐν ἡμῖν
  choice: நம்மில்
  rationale: ἐν என்பதன் நேரடியான பொருளைப் பாதுகாக்கிறது; ‘நம்மால்’ என்று மனிதச் செயலாண்மையை வலுப்படுத்துவதையோ ‘நமக்காக’ என்று மாற்றுவதையோ தவிர்க்கிறது.
- source_word: περιπατοῦσιν
  choice: நடக்கிற
  rationale: வாழ்க்கை நடத்தையைச் சுட்டும் பவுலின் நடை உருவகத்தைத் தக்கவைக்கிறது; தமிழிலும் இந்த உருவகம் புரிந்துகொள்ளத்தக்கது.
- source_word: σάρξ
  choice: மாம்சம்
  rationale: உடலை மட்டும் அல்லாமல் கடவுளைவிட்டு விலகிய மனித வாழ்க்கை நோக்கைச் சுட்டும் பவுலின் உருவகச் சொல்லை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: πνεῦμα
  choice: ஆவி
  rationale: ரோமர் 8 சூழலில் தூய ஆவியைக் குறிக்கும் வாய்ப்பு மிகுந்தது; எனினும் கிரேக்கச் சொல்லிலுள்ள ‘ஆவி/மனித ஆவி’ என்ற சாத்தியமான தெளிவின்மையைத் தமிழில் அழித்துவிடாமல் அடிக்குறிப்பில் விளக்குகிறது.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: மாம்சத்தின்படி ... ஆவியின்படி
  rationale: κατά என்பதன் அளவுகோல் அல்லது வாழ்க்கை நோக்கைச் சுட்டும் பொருளையும், இரு சொற்றொடர்களின் இணையான எதிர்மறை அமைப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: πνεῦμα என்பது மனித ஆவியையா தூய ஆவியையா குறிக்கிறது
  choice: ஆவி; சூழலில் தூய ஆவி எனப் புரிந்துகொள்ளப்படுகிறது
  alternative: மனித ஆவி அல்லது பொதுவாக ஆவி
  rationale: ரோமர் 8-ன் உடனடிச் சூழல் தூய ஆவியின் செயலையும் ஆட்சிப்பரப்பையும் வலியுறுத்துகிறது. ஆனால் தமிழில் ‘தூய ஆவி’ என்று விரிவாக்கி கிரேக்கத்தில் வெளிப்படையாக இல்லாத சொல்லை முதன்மை உரையில் சேர்க்காமல், தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐν ἡμῖν என்பது நிறைவேற்றம் நம்மால் நிகழ்கிறது என்பதையா நம்மில் நிகழ்கிறது என்பதையா குறிக்கிறது
  choice: நம்மில் நிறைவேறுதல்
  alternative: நம்மால் நிறைவேறுதல்; நம்மிடையே நிறைவேறுதல்
  rationale: ἐν என்பதற்கு ‘நம்மில்’ என்பது நேரடியான இணை. இதனால் மாற்றம் மனிதர்களின் உள்ளும் வாழ்க்கையிலும் நிகழ்வதற்கான இடம் விடப்படுகிறது; ஆனால் வசனம் வெளிப்படையாகக் கூறாத மனிதச் செயலாண்மை திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வேதாகம உரைக்கு ஏற்ற நடை பயன்படுத்தப்பட்டுள்ளது. மூலவாக்கியம் முந்தைய வசனத்தைச் சார்ந்த நோக்கத் துணைவாக்கியமாக இருப்பதால், அதனைத் தனி முற்றுவாக்கியமாக மாற்றி இல்லாத எழுவாயையோ செயலையோ சேர்க்காமல் அந்த அமைப்பு பாதுகாக்கப்பட்டுள்ளது. ‘மாம்சம்’ மற்றும் ‘நடத்தல்’ ஆகிய பவுலின் முக்கிய உருவகங்கள் விளக்கமாக மாற்றப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
