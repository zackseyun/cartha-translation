  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: ta
  text: ஆனால், இவை அனைத்திலும் நம்மை நேசித்தவர் மூலம் நாம் மிகப்பெரும் வெற்றி பெறுகிறோம்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “நாம் அளவுகடந்த வெற்றி பெறுகிறோம்.”'
    reason: lexical_alternative
  - marker: b
    text: உடனடிச் சூழலில், இது பெரும்பாலும் கிறிஸ்துவைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் சொல்லப்பட்ட துன்பங்களால் தோல்வி ஏற்படுமா என்ற எண்ணத்துக்கு வலுவான எதிர்மறை மாற்றத்தைக் குறிக்கிறது.
- source_word: ἐν τούτοις πᾶσιν
  choice: இவை அனைத்திலும்
  rationale: முந்தைய வசனத்தில் பட்டியலிடப்பட்ட துன்பங்களின் நடுவிலும் என்ற பொருளை இயல்பான தமிழில் கூறி, கிரேக்க முன்னிடைச்சொல் தொடரின் வடிவத்தையும் காக்கிறது.
- source_word: ὑπερνικῶμεν
  choice: நாம் முற்றிலும் வெற்றிபெறுகிறோம்
  rationale: இது νικάω என்பதைக் காட்டிலும் வலுப்படுத்தப்பட்ட வினைச்சொல்; தமிழிலும் வினை வடிவத்தையும் முழுமையான, தீர்மானமான வெற்றியின் தீவிரத்தையும் வெளிப்படுத்துகிறது.
- source_word: διὰ
  choice: மூலமாக
  rationale: இங்கே ஆறாம் வேற்றுமைத் தொடருடன் வரும் διά, ஒருவர் வழியாக அல்லது அவரது செயலால் கிடைக்கும் வெற்றியைக் குறிக்கிறது.
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: நம்மை அன்புகூர்ந்தவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகால வினையெச்சத்தை இயல்பான, மரியாதைக்குரிய தமிழில் வழங்குகிறது; மூலத்தில் இல்லாத பெயரைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘நம்மை அன்புகூர்ந்தவர்’ என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் பெயரைக் குறிப்பிடாமல் ‘நம்மை அன்புகூர்ந்தவர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: உடனடிச் சூழலின் அடிப்படையில் ‘கிறிஸ்து’ என்று வெளிப்படையாகக் குறிப்பிடுதல்; அல்லது ‘கிறிஸ்துவில் தேவன்’ என்று புரிந்துகொள்ளுதல்.
  rationale: ரோமர் 8:35-ன் உடனடிச் சூழல் கிறிஸ்துவை வலுவாகச் சுட்டுகிறது. இருப்பினும் இவ்வசனத்தின் கிரேக்க உரை பெயரை வெளிப்படையாகக் கூறாததால், அந்தத் தெளிவின்மையை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முற்றிலும் வெற்றிபெறுகிறோம்’ என்பது ὑπερνικῶμεν என்ற வலுப்படுத்தப்பட்ட வினையின் தீவிரத்தையும் அதன் வினை வடிவத்தையும் காக்கிறது.
