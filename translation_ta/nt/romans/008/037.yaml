revisions:
- from: ஆனால், இவை அனைத்திலும் நம்மை அன்புகூர்ந்தவர் மூலமாக நாம் முற்றிலும் வெற்றிபெறுகிறோம்.[a][b]
  to: ஆனால், இவை அனைத்திலும் நம்மை நேசித்தவர் மூலம் நாம் மிகப்பெரும் வெற்றி பெறுகிறோம்.[a][b]
  rationale: The revision retains the verse's syntax and deliberate anonymity of ‘the one who loved us,’ while using more natural modern Tamil and representing the intensifying force of ὑπερνικῶμεν more clearly. The footnote markers and their anchors are retained.
  reviewer_model: gpt-5.6-terra
