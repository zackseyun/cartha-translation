id: ROM.8.36
reference: Romans 8:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: ta
  text: 'எழுதப்பட்டிருப்பதுபோல:


    “உமக்காக நாள் முழுவதும் நாங்கள் கொல்லப்படுகிறோம்;

    அறுப்புக்கான செம்மறியாடுகளைப்போல் கருதப்பட்டோம்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எண்ணப்பட்டோம்.”
    reason: λογίζομαι என்பதற்கு இச்சூழலில் ‘கருதப்பட்டோம்’ என்றும் ‘எண்ணப்பட்டோம்’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: καθὼς
  choice: எழுதப்பட்டிருப்பதுபோல
  rationale: வேதமேற்கோளை அறிமுகப்படுத்தும் ஒப்புமைத் தொடர்பை இயல்பான தமிழில் தருகிறது; γέγραπται என்பதையும் இதனுடன் இணைத்துள்ளது.
- source_word: γέγραπται
  choice: 'எழுதப்பட்டிருக்கிறது (இணைந்த வடிவில்: எழுதப்பட்டிருப்பதுபோல)'
  rationale: முன்பு எழுதப்பட்டு இன்றும் நிலைத்திருக்கும் வேதவாக்கைக் குறிக்கும் நிறைவுற்ற வினையின் தாக்கத்தைப் பாதுகாக்கிறது.
- source_word: Ἕνεκεν σοῦ
  choice: உமக்காக
  rationale: தேவனை நேரடியாக அழைக்கும் மேற்கோளின் தன்மையையும், ‘உமது நிமித்தம்’ என்ற காரணப் பொருளையும் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: θανατούμεθα
  choice: நாங்கள் கொல்லப்படுகிறோம்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் தொடர்ச்சியான உயிர்க்கொல்லும் துன்புறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅλην τὴν ἡμέραν
  choice: நாள் முழுவதும்
  rationale: காலத்தின் முழு நீட்சியையும் தொடர்ச்சியான ஆபத்தையும் தெளிவாகத் தரும் நவீன தமிழ்ச் சொற்றொடர்.
- source_word: ἐλογίσθημεν
  choice: கருதப்பட்டோம்
  rationale: λογίζομαι என்பதன் ‘ஒரு நிலையில் உள்ளவர்களாக மதிப்பிடப்படுதல் அல்லது கருதப்படுதல்’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘எண்ணப்பட்டோம்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὡς
  choice: -ஐப்போல்
  rationale: ஒப்புமையைத் தெளிவாகவும் தமிழுக்கு இயல்பாகவும் குறிக்கிறது.
- source_word: πρόβατα σφαγῆς
  choice: அறுப்புக்கான செம்மறியாடுகள்
  rationale: கொல்லப்படுவதற்காக ஒதுக்கப்பட்ட செம்மறியாடுகள் என்ற உருவகத்தை விளக்கவுரை சேர்க்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: துன்பத்தின் சூழலில் சங்கீதம் 44:22 மேற்கோள் காட்டப்படுதல்
  choice: தேவனுக்காக ஒரு சமூகமாகத் தொடர்ந்து மரண ஆபத்துக்கு உட்படுத்தப்பட்டு, அறுப்புக்கென ஒதுக்கப்பட்ட ஆடுகளைப்போல் கருதப்படுகிறோம் என்ற மேற்கோளின் நேரடிப் பொருளைப் பாதுகாத்தல்
  alternative: இதைக் குறிப்பாக இரத்தசாட்சித்துவத்தை மட்டும் குறிக்கும் வகையில் விளக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை சமூகத் துயரத்தையும் தொடர்ச்சியான மரண ஆபத்தையும் நேரடியாக முன்வைக்கிறது; அதை ஒரு குறிப்பிட்ட கோட்பாட்டு பயன்பாட்டுக்குள் குறுக்குவது உரையில் இல்லாத விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. கவிதை மேற்கோளின் இரு இணை வரிகளும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன; தேவனை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘உமக்காக’ பயன்படுத்தப்பட்டுள்ளது.
