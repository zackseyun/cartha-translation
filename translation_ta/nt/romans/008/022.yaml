- from: ஏனெனில், முழுப் படைப்பும்[a] இன்றுவரை ஒருசேரப் பெருமூச்சுவிட்டு, ஒருசேரப் பிரசவ வேதனைப்படுகிறது[b] என்பதை நாம் அறிவோம்.
  to: ஏனெனில், முழுப் படைப்பும்[a] இன்றுவரை ஒருசேரப் பெருமூச்சுவிடுகிறது; ஒருசேரப் பிரசவ வேதனையில் துடிக்கிறது[b] என்பதை நாம் அறிவோம்.
