  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: ta
  text: ஏனெனில், முழுப் படைப்பும்[a] இன்றுவரை ஒருசேரப் பெருமூச்சுவிடுகிறது; ஒருசேரப் பிரசவ வேதனையில் துடிக்கிறது[b] என்பதை நாம் அறிவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘படைப்பு அனைத்தும்’; ‘படைக்கப்பட்ட ஒவ்வொன்றும்’ என்றும் பொருள்கொள்ளலாம். ஆனால் இச்சூழலில் ஒட்டுமொத்தப் படைப்புலகைக் குறிக்கும் பரந்த பொருளே அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பிரசவ வேதனையில் துடிக்கிறது’ என்பது பிள்ளைப்பேற்று வலியை நினைவூட்டுகிறது; இது துன்பத்தை மட்டுமல்ல, புதிய வாழ்வை நோக்கிய துன்பத்தையும் உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: நாம் அறிவோம்
  rationale: வடிவத்தில் நிறைநிலைக் காலமாக இருந்தாலும், οἶδα இங்கு நிகழ்காலத்தில் நிலைத்த அறிவைக் குறிக்கிறது; பகிரப்பட்ட உறுதியான அறிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் கருத்தை விளக்கும் இணைப்பைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: πᾶσα ἡ κτίσις
  choice: முழுப் படைப்பும்
  rationale: பெயர்ச்சொல்லோடு வரும் πᾶσα இங்கு ஒவ்வொரு தனிப்பட்ட உயிரினத்தையும் விட ஒட்டுமொத்தப் படைப்பைக் கூட்டாகக் குறிக்கிறது; ரோமர் 8:19–23-இன் பரந்த படைப்புலகச் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: συστενάζει
  choice: ஒருசேரப் பெருமூச்சுவிட்டு
  rationale: στενάζω என்பதன் வேதனைமிகுந்த பெருமூச்சையும் συν- முன்னொட்டின் கூட்டான தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: συνωδίνει
  choice: ஒருசேரப் பிரசவ வேதனைப்படுகிறது
  rationale: பொதுவான துன்பத்தை மட்டும் அல்லாமல் பிரசவ வலியின் குறிப்பிட்ட உருவகத்தையும், συν- முன்னொட்டின் ‘ஒருசேர’ என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: ἄχρι τοῦ νῦν
  choice: இன்றுவரை
  rationale: கடந்த காலத்திலிருந்து தற்போதுவரை தொடரும் நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: κτίσις என்பது ‘படைப்பு’ என்ற ஒட்டுமொத்த பொருளிலா, ‘படைக்கப்பட்ட ஒவ்வொன்றும்’ என்ற பகிர்மானப் பொருளிலா?
  choice: முழுப் படைப்பு
  alternative: படைக்கப்பட்ட ஒவ்வொன்றும்
  rationale: ரோமர் 8:19–23-இல் பயனற்ற நிலைக்கு உட்படுத்தப்பட்டு விடுதலையை எதிர்பார்க்கும் மனிதரல்லாத படைப்புலகம் கூட்டாக மனித உருவகத்தில் பேசப்படுகிறது. ஆகவே பரந்த பொருளைச் சுருக்காமல் ‘முழுப் படைப்பு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: பிரசவ வேதனை உருவகம் பொதுவான துன்பமாக மட்டும் மொழிபெயர்க்கப்பட வேண்டுமா?
  choice: பிரசவ வேதனைப்படுகிறது
  alternative: வேதனைப்படுகிறது
  rationale: συνωδίνει பிரசவ வலியைத் திட்டவட்டமாகக் குறிக்கிறது. அந்த உருவகம் தற்போதைய துன்பத்தையும் பிறப்பை நோக்கிய எதிர்பார்ப்பையும் ஒன்றாகத் தாங்குவதால், அதை விளக்கி நீக்காமல் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஒருசேர’ என்ற சொல்லின் மீளுரை கிரேக்கத்தின் இரு συν- முன்னொட்டுகளையும் கூட்டான அனுபவத்தையும் திட்டமிட்டே தக்கவைக்கிறது.
