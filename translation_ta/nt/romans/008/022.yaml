    issue: The expression ‘ஒருசேரப் பிரசவ வேதனைப்படுகிறது’ is grammatically and idiomatically awkward in Tamil.
    rationale: ‘பிரசவ வேதனை’ is a noun phrase and does not naturally take ‘படுகிறது’ in this construction. The revision uses the standard idiom ‘பிரசவ வேதனையில் துடிக்கிறது,’ retaining the childbirth-pain imagery and the ongoing verbal force.
