source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: ta
  text: ஆனால் நீங்களோ மாம்சத்தில்[a] இல்லை; ஆவியில் இருக்கிறீர்கள்—கடவுளின் ஆவி உண்மையாகவே உங்களில் குடியிருக்கிறார் என்றால். யாராவது மெசியாவின்[b] ஆவியைக் கொண்டிராவிட்டால், அவர் அவருக்குரியவர் அல்ல.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவ இயல்பின் ஆளுகையில்.” கிரேக்கத்தில், “மாம்சத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கிறிஸ்துவின் ஆவி.” கிரேக்கச் சொல் அபிஷேகம் செய்யப்பட்டவராகிய மெசியாவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “இந்த நபர் அவருடையவர் அல்ல.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: மாம்சம்
  rationale: பவுலின் ‘மாம்சம்’ என்ற முக்கியச் சொல்லையும், அது உடலை மட்டும் குறிக்காமல் மனிதரின் பாவத்துக்குட்பட்ட வாழ்வுத் தளத்தையும் சுட்டும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
- source_word: πνεῦμα
  choice: ஆவி
  rationale: உடனடியான சூழலில் இது ‘கடவுளின் ஆவி’ என்றும் ‘மெசியாவின் ஆவி’ என்றும் அடையாளப்படுத்தப்படுவதால் பரிசுத்த ஆவியைக் குறிக்கிறது.
- source_word: οἰκεῖ
  choice: குடியிருக்கிறார்
  rationale: தற்காலிகமாக இருப்பதைவிட நிலையாக உள்ளே வாசம்செய்யும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός இங்கு பட்டமாகப் பயன்படுவதால் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற மெசியா சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: அவர் மெசியாவுக்குரியவர் அல்ல
  rationale: கிரேக்க உரையின் உடைமை/உறவு சார்ந்த மரபுத்தொடரை இயல்பான தமிழில் தருகிறது; அருகிலுள்ள ‘மெசியா’வையே சுட்டுப்பெயரின் இயல்பான முன்னிலையாக வெளிப்படுத்துகிறது.
- source_word: εἴπερ
  choice: உண்மையாகவே … என்றால்
  rationale: நிபந்தனை வடிவத்தையும், அது உண்மையென எதிர்பார்த்துக் கூறும் வலியுறுத்தலையும் ஒருசேரப் பாதுகாக்கிறது.
- source_word: Ὑμεῖς δὲ
  choice: ஆனால் நீங்களோ
  rationale: வெளிப்படையாகவும் வலியுறுத்தப்பட்டும் உள்ள பன்மைச் சுட்டுப்பெயரையும் முந்தைய கருத்துடனான முரண்பாட்டையும் காட்டுகிறது.
theological_decisions:
- issue: ‘மாம்சத்தில்’ என்பதற்கும் ‘ஆவியில்’ என்பதற்கும் இடையிலான முரண்பாடு
  choice: இரண்டு சொற்களையும் வாழ்வின் தளம் அல்லது நிலை குறிக்கும் மொழியாக அப்படியே வைத்தல்
  alternative: ‘பாவ இயல்பின் ஆட்சியில்’ மற்றும் ‘ஆவியின் ஆட்சியில்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: பவுலின் சொந்த இறையியல் சொற்களையும் அவற்றிலுள்ள விரிவான பொருள் மற்றும் அழுத்தத்தையும் குறுகிய உளவியல் விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: ‘அவருக்குரியவர் அல்ல’ என்பதிலுள்ள சுட்டுப்பெயரின் முன்னிலை
  choice: உடனடியாக முன்வரும் மெசியாவைக் குறிக்கும் வகையில் மொழிபெயர்த்தல்
  alternative: பரந்த சூழலின் அடிப்படையில் கடவுளைக் குறிக்கிறது என்று கொள்ளுதல்
  rationale: இலக்கண ரீதியாக மிக அருகிலுள்ள முன்னிலை ‘மெசியா’; எனினும் கடவுளின் ஆவியும் மெசியாவின் ஆவியும் இணையாகக் கூறப்படுவதிலுள்ள இறையியல் பதற்றத்தை உரை மாற்றுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘மாம்சம்,’ ‘ஆவி,’ ‘குடியிருக்கிறார்’ போன்ற முக்கிய வேதாகமச் சொற்கள் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
