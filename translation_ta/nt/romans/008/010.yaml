id: ROM.8.10
reference: Romans 8:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: ta
  text: ஆனால் மேசியா உங்களுக்குள் இருந்தால், பாவத்தின் காரணமாக உடல் இறந்தது[b]; நீதியின் காரணமாக[c] ஆவியோ[a] வாழ்வு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆவி’ என்பது கடவுளால் உயிர்ப்பிக்கப்பட்ட மனித ஆவியையோ தூய ஆவியையோ குறிக்கலாம்; கிரேக்கச் சொல் இருவிதமாகவும் புரிந்துகொள்ள இடமளிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘உடல் மரணத்திற்குட்பட்டது’ அல்லது ‘உடல் சாகக்கூடியது.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நியாயத்தின் காரணமாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: மேசியா
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைத் தக்கவைத்திருப்பதால், வெறும் பெயர்போல் ஒலிக்கும் வடிவத்திற்குப் பதிலாக ‘மேசியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: σῶμα
  choice: உடல்
  rationale: σῶμα என்பதன் வழக்கமான பொருள் ‘உடல்’; இது πνεῦμα என்பதுடனான தெளிவான முரண்பாட்டையும் காக்கிறது.
- source_word: νεκρὸν
  choice: இறந்தது
  rationale: கிரேக்கச் சொல் நேரடியாக ‘இறந்தது’ என்று பொருள்படும். இங்கு மரணத்திற்குட்பட்ட நிலை குறிக்கப்படலாம் என்றாலும், முதன்மை உரை மூலத்தின் கூர்மையான சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: διὰ ἁμαρτίαν
  choice: பாவத்தின் காரணமாக
  rationale: accusative உடன் வரும் διά இங்கு காரணத்தைக் குறிக்கிறது; இந்தத் தமிழாக்கம் அந்தக் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πνεῦμα
  choice: ஆவி
  rationale: இது உயிர்ப்பிக்கப்பட்ட மனித ஆவியையோ தூய ஆவியையோ குறிக்கக்கூடிய சூழல் சார்ந்த தெளிவின்மையைக் கொண்டுள்ளது. ‘ஆவி’ அந்தத் தெளிவின்மையைத் தீர்த்துவிடாமல் காக்கிறது.
- source_word: ζωὴ
  choice: வாழ்வு
  rationale: ζωή பெயர்ச்சொல் என்பதால், ‘உயிருடன் இருக்கிறது’ என்று பெயரடையாக்காமல் பவுலின் சுருக்கமான ‘வாழ்வு’ என்ற அமைப்பு காக்கப்படுகிறது.
- source_word: διὰ δικαιοσύνην
  choice: நீதியின் காரணமாக
  rationale: διά என்பதன் காரணப் பொருளையும் δικαιοσύνη என்பதன் பவுலிய ‘நீதி/நீதித்தன்மை’ கருத்தையும் இந்த வடிவம் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: ஆவி
  alternative: தூய ஆவி
  rationale: இவ்வாக்கியம் விசுவாசியின் உடலுக்கும் ஆவிக்கும் இடையிலான முரண்பாட்டைக் குறிக்கலாம்; அதேவேளையில் முந்தைய சூழலில் தூய ஆவியின் செயலும் முன்னிலையில் உள்ளது. பொதுவான ‘ஆவி’ என்ற வடிவம் இந்த இறையியல் இழுபறியைத் தீர்க்காமல் விடுகிறது.
- issue: σῶμα உடன் வரும் νεκρὸν என்பதன் வலிமை
  choice: உடல் இறந்தது
  alternative: உடல் மரணத்திற்குட்பட்டது / சாகக்கூடியது
  rationale: பாவத்தின் ஆட்சிக்குக் கீழான உடலின் மரணத்தன்மையை பவுல் குறிக்கக்கூடும். இருப்பினும் கிரேக்கத்தில் நேரடியாக ‘இறந்தது’ என்றே இருப்பதால் அது முதன்மை உரையில் காக்கப்பட்டு, மென்மையான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. μὲν…δὲ என்ற எதிரிணை அமைப்பு ‘உடல்…; ஆவியோ…’ என இயல்பாக வெளிப்படுத்தப்பட்டது. ‘ஆவி’ என்ற சொல்லில் தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால், அதன் சுட்டுப்பொருள் குறித்த தெளிவின்மை அடிக்குறிப்பில் விளக்கப்பட்டது.
