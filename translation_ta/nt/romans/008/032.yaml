revisions:
- from: தம்முடைய சொந்த மகனையே விட்டுவைக்காமல், நம் அனைவருக்காகவும்[a] அவரை ஒப்புக்கொடுத்த[b] அவரே, அவரோடுகூட எல்லாவற்றையும் நமக்கு அருளிக் கொடுக்காமல்[c] எப்படி இருப்பார்?
  to: தம்முடைய சொந்த மகனையே விட்டுவைக்காமல், நம் அனைவருக்காகவும் அவரை ஒப்புக்கொடுத்த அவரே, அவரோடு எல்லாவற்றையும் நமக்கு அருளிக் கொடுக்காமல் எப்படி இருப்பார்?
  rationale: The revision preserves the Greek syntax, rhetorical future question, broad scope of τὰ πάντα, and nontechnical benefactive sense of ὑπὲρ ἡμῶν πάντων. It makes only small idiomatic and footnote-precision improvements, without adding doctrinal interpretation.
