id: ROM.8.32
reference: Romans 8:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: ta
  text: தம்முடைய சொந்த மகனையே விட்டுவைக்காமல், நம் அனைவருக்காகவும் அவரை ஒப்புக்கொடுத்த அவரே, அவரோடு எல்லாவற்றையும் நமக்கு அருளிக் கொடுக்காமல் எப்படி இருப்பார்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅς γε
  choice: அவரே
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட கடவுளையே இது சுட்டுகிறது; γε தரும் வலியுறுத்தலை ‘அவரே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: தம்முடைய சொந்த மகனையே
  rationale: ἴδιος உணர்த்தும் தனிப்பட்ட உறவையும் உடைமையையும் ‘சொந்த’ காக்கிறது; ‘-ஏ’ வாக்கியத்தின் வலியுறுத்தலையும் இயல்பாகத் தருகிறது.
- source_word: οὐκ ἐφείσατο
  choice: விட்டுவைக்காமல்
  rationale: φείδομαι என்பதன் ‘தப்பவிடுதல்/காத்துவைத்தல்’ சார்ந்த பொருளை, இங்கு மகனை மரணத்திலிருந்து விலக்கி வைக்காத செயலைக் குறிக்கும் வகையில் இயல்பான தமிழில் தருகிறது.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: நம் அனைவருக்காகவும்
  rationale: ὑπέρ என்பதன் நன்மைக்காக அல்லது சார்பாக என்ற பரப்பைத் தொழில்நுட்பமான பரிகாரக் கோட்பாட்டு சொல்லால் குறுக்காமல் காக்கிறது.
- source_word: παρέδωκεν αὐτόν
  choice: அவரை ஒப்புக்கொடுத்த
  rationale: παραδίδωμι இங்கு துன்பத்திற்கும் மரணத்திற்கும் ஒப்படைத்ததைக் குறிக்கிறது; ‘ஒப்புக்கொடுத்த’ அதன் தீவிரத்தைக் காக்கும் தற்போதைய இயல்பான நடை.
- source_word: σὺν αὐτῷ
  choice: அவரோடுகூட
  rationale: σύν கூறும் ‘அவருடன் சேர்த்து’ என்ற தொடர்பைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: τὰ πάντα
  choice: எல்லாவற்றையும்
  rationale: பவுலின் பரந்த சொற்றொடரைத் தேவையின்றிக் குறுக்காமல் இயல்பான தமிழில் காக்கிறது.
- source_word: ἡμῖν χαρίσεται
  choice: நமக்கு அருளிக் கொடுக்காமல் எப்படி இருப்பார்?
  rationale: χαρίζομαι என்பதில் உள்ள கிருபையுடன் கொடுத்தல் என்ற நுணுக்கத்தை ‘அருளிக் கொடுக்க’ வெளிப்படுத்துகிறது; எதிர்மறை வினாவானது உறுதியான எதிர்பார்ப்பை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ὑπὲρ ἡμῶν πάντων என்பது பதிலீட்டைத் திட்டவட்டமாகக் குறிப்பிடுகிறதா, அல்லது நன்மைக்காக/சார்பாகச் செய்யப்பட்ட செயலைப் பரந்த வகையில் குறிப்பிடுகிறதா?
  choice: நம் அனைவருக்காகவும்
  alternative: நம் அனைவரின் சார்பாகவும்
  rationale: கிரேக்கச் சொற்றொடர் பலியுணர்வுக்கு இடமளித்தாலும், இவ்விடத்தில் மட்டும் அது கூறுவதைவிடக் குறுகிய தொழில்நுட்பப் பரிகார விளக்கத்தை மொழிபெயர்ப்பில் திணிக்காமல் அதன் பொருள் பரப்பை நிலைநிறுத்துகிறது.
- issue: τὰ πάντα என்பதன் பரப்பை குறிப்பிட்ட ஆவிக்குரிய நன்மைகளாக மட்டுப்படுத்த வேண்டுமா?
  choice: எல்லாவற்றையும்
  alternative: அனைத்தையும்
  rationale: வசனத்தின் பரந்த மொழியை அப்படியே வைத்திருக்கிறது; அதன் பரப்பைச் சூழல் விளக்க அனுமதிக்கிறது, மொழிபெயர்ப்பு முன்கூட்டியே வரையறுப்பதில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இறைமகன் குறித்த உறவு, ஒப்படைப்பு, கிருபையுடன் கொடுத்தல் ஆகிய நுணுக்கங்கள் காக்கப்பட்டுள்ளன; வினாவாக்கியத்தின் வாத வலிமையும் நிலைநிறுத்தப்பட்டுள்ளது.
