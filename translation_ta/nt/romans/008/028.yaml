revisions:
- from: மேலும், கடவுளிடம் அன்புகூருகிறவர்களுக்கு எல்லாம் ஒன்றுசேர்ந்து நன்மைக்காகச் செயல்படுகிறது[a] என்பதை நாம் அறிந்திருக்கிறோம்—அவர்கள் நோக்கத்தின்படி[b] அழைக்கப்பட்டவர்கள்.
  to: மேலும், கடவுளை நேசிப்பவர்களுக்கு எல்லாமும் ஒன்றுசேர்ந்து நன்மைக்காகச் செயல்படுகின்றன[a] என்பதை நாம் அறிந்திருக்கிறோம்; அதாவது, நோக்கத்தின்படி அழைக்கப்பட்டவர்களுக்கு[b].
  rationale: The revision corrects the erroneous possessive force of “அவர்கள்,” restores the two parallel dative descriptions, and uses idiomatic Tamil for loving God. It retains the source text's ambiguity by not supplying “அவருடைய” in the main line, while retaining that contextual alternative in the footnote. Footnote a continues to distinguish the explicit-God textual variant from the SBLGNT main text.
