  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: ta
  text: மேலும், கடவுளை நேசிப்பவர்களுக்கு எல்லாமும் ஒன்றுசேர்ந்து நன்மைக்காகச் செயல்படுகின்றன[a] என்பதை நாம் அறிந்திருக்கிறோம்; அதாவது, நோக்கத்தின்படி அழைக்கப்பட்டவர்களுக்கு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “கடவுள் எல்லாவற்றையும் நன்மைக்காக ஒன்றுசேர்ந்து செயல்படச் செய்கிறார்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: “அவருடைய நோக்கத்தின்படி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: நாம் அறிந்திருக்கிறோம்
  rationale: நிலைத்த, உறுதியான அறிவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: மேலும்
  rationale: எதிர்மறை வேறுபாட்டை மிகைப்படுத்தாமல், முந்தைய கருத்தைத் தொடர்ந்து வாதத்தை முன்னெடுக்கும் மென்மையான இணைப்பாக அமைகிறது.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: கடவுளிடம் அன்புகூருகிறவர்களுக்கு
  rationale: வேற்றுமை உருபின் பயனாளர் சார்ந்த பொருளைக் காத்து, குழுவைத் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: πάντα
  choice: எல்லாம்
  rationale: நடுநிலைப் பன்மையின் பரந்த பொருளைச் சுருக்கமின்றிக் காக்கிறது; தமிழில் அஃறிணைப் பொதுமையாக இயல்பாக உள்ளது.
- source_word: συνεργεῖ
  choice: ஒன்றுசேர்ந்து ... செயல்படுகிறது
  rationale: SBLGNT வாசகத்தில் கடவுளை வெளிப்படையான எழுவாயாகச் சேர்க்காமல், கூட்டு அல்லது ஒருங்கிணைந்த செயல்பாட்டைத் தெரிவிக்கிறது.
- source_word: εἰς ἀγαθόν
  choice: நன்மைக்காக
  rationale: நன்மையை நோக்கிய விளைவு அல்லது திசை என்ற பொருளை இயல்பாகத் தருகிறது; குறிப்பிட்ட ஒரு நன்மையைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: அவர்கள் நோக்கத்தின்படி அழைக்கப்பட்டவர்கள்
  rationale: கடவுளிடம் அன்புகூருகிறவர்கள் யார் என்பதை விளக்கும் மறுபெயரிடும் கூறாகக் காக்கிறது; மூலத்தில் இல்லாத உடைமைப்பெயரை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: πρόθεσιν
  choice: நோக்கம்
  rationale: சூழலில் உள்ள திட்டமிட்ட எண்ணம் அல்லது தீர்மானத்தைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: κλητοῖς
  choice: அழைக்கப்பட்டவர்கள்
  rationale: பவுலின் சொல்லாட்சித் தொடர்ச்சியைக் காக்கும், சூழலுக்கேற்ற நிலையான தமிழ்ச் சொல்.
theological_decisions:
- issue: συνεργεῖ என்பதன் மறைமுக எழுவாய்
  choice: முதன்மை உரையில் ‘எல்லாம் ஒன்றுசேர்ந்து ... செயல்படுகிறது’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுள் எல்லாவற்றையும் ஒன்றுசேர்த்து நன்மைக்காகச் செயல்படச் செய்கிறார்.’
  rationale: கொடுக்கப்பட்ட SBLGNT உரையில் θεός வெளிப்படையான எழுவாயாக இல்லை. ஆகவே கடவுளை முதன்மை உரையில் எழுவாயாகச் சேர்க்காமல், அந்த வாசகத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: κατὰ πρόθεσιν என்பதில் உடைமைப்பெயர் உள்ளதா
  choice: ‘நோக்கத்தின்படி’ என்று உடைமைப்பெயர் சேர்க்காமல் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவருடைய நோக்கத்தின்படி.’
  rationale: சூழல் கடவுளுடைய நோக்கத்தைக் குறிப்பதாக வலுவாகச் சுட்டினாலும், கிரேக்கச் சொற்றொடரில் வெளிப்படையான உடைமைப்பெயர் இல்லை; எனவே மூலத்தின் சுருக்கத்தையும் உள்ளார்ந்த பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் மறுபெயரிடும் அமைப்பைத் தெளிவுபடுத்த நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது; ‘எல்லாம்’ என்ற அஃறிணைப் பொதுமைக்கு இயல்பான ஒருமை வினை அமைந்துள்ளது.
