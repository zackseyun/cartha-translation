id: ROM.4.9
reference: Romans 4:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: ta
  text: அப்படியானால், இந்தப் பேறு விருத்தசேதனம் செய்யப்பட்டவர்களுக்கு மட்டும்தானா, அல்லது விருத்தசேதனம் செய்யப்படாதவர்களுக்கும் கூடவா? ஏனெனில், “விசுவாசம் ஆபிரகாமுக்கு நீதியாகக் கணக்கிடப்பட்டது” என்று நாம் சொல்கிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρισμός
  choice: பேறு
  rationale: முந்தைய வசனங்களில் அறிவிக்கப்பட்ட ஆசீர்வதிக்கப்பட்ட நிலையைக் குறிக்கிறது; ‘பேறு’ என்பது சுருக்கமாகவும் இயல்பாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: περιτομή
  choice: விருத்தசேதனம் செய்யப்பட்டவர்கள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘விருத்தசேதனம்’ என்றாலும், இங்கு அது விருத்தசேதனம் பெற்ற மக்களைக் குறிக்கும் ஆகுபெயராகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀκροβυστία
  choice: விருத்தசேதனம் செய்யப்படாதவர்கள்
  rationale: இங்கு ‘விருத்தசேதனம் இல்லாமை’ என்பதைவிட, விருத்தசேதனம் பெறாத மக்கள் குழுவே குறிக்கப்படுவதால் குழுவைக் தெளிவாகக் காட்டுகிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: ஆபிரகாமைப் பற்றிய மேற்கோளிலும் பவுலின் வாதத்திலும் நம்பிக்கையைச் சுட்டும் வழக்கமான, பொருத்தமான தமிழ்ச் சொல்.
- source_word: ἐλογίσθη
  choice: கணக்கிடப்பட்டது
  rationale: λογίζομαι என்பதிலுள்ள கணக்கிடுதல் அல்லது ஒன்றாகக் கருதுதல் என்ற உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: δικαιοσύνη
  choice: நீதி
  rationale: பவுலின் வாதத்தில் தேவனுக்கு முன்பான நீதியான நிலையைக் குறிக்கிறது; தமிழ் ‘நீதி’ என்பதே righteousness மற்றும் justice ஆகிய பொருள் வட்டங்களைச் சூழலுக்கேற்ப தாங்கக்கூடியது.
- source_word: εἰς δικαιοσύνην
  choice: நீதியாக
  rationale: விசுவாசம் நீதியாகக் கணக்கிடப்பட்டது என்ற கிரேக்கத் தொடர்பைச் சுருக்கமாகவும் பாரம்பரியத் தெளிவுடனும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆபிரகாமின் விசுவாசத்துக்கும் நீதிக்கும் இடையிலான தொடர்பு
  choice: “ஆபிரகாமின் விசுவாசம் அவருக்கு நீதியாகக் கணக்கிடப்பட்டது.”
  alternative: “ஆபிரகாமின் விசுவாசம் அவருக்கு நீதிக்காக வரவு வைக்கப்பட்டது.”
  rationale: வசனத்திலுள்ள கணக்கீட்டு மொழியையும் இறையியல் அழுத்தத்தையும் பாதுகாத்து, அது எவ்வாறு செயல்படுகிறது என்பதைக் குறித்து மொழிபெயர்ப்பிலேயே கூடுதல் கோட்பாட்டு விளக்கம் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பெயர்ச்சொற்கள் குறிக்கும் இரு மக்கள் குழுக்களும் தமிழில் வெளிப்படையாகக் கூறப்பட்டுள்ளன. ‘δικαιοσύνη’ என்பதற்கான righteousness/justice வேறுபாடு தமிழின் ‘நீதி’ என்ற ஒரே சொல்லில் இயல்பாக அடங்குவதால் தேவையற்ற அடிக்குறிப்பு சேர்க்கப்படவில்லை.
