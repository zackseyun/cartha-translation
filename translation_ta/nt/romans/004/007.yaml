  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: ta
  text: '“சட்டமீறல்கள் மன்னிக்கப்பட்டவர்களும்,

    பாவங்கள் மூடப்பட்டவர்களும் பேறுபெற்றவர்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: இது வெறும் மனநிலையான ‘மகிழ்ச்சி’யைக் குறிக்காமல், கடவுளின் அருளால் ஒருவர் பெற்றுள்ள நல்வாழ்வின் நிலையை அறிவிக்கிறது; நவீனத் தமிழில் கண்ணியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀφέθησαν
  choice: மன்னிக்கப்பட்ட
  rationale: ἀφίημι என்பதன் இறையியல் சூழலிலான பாவமன்னிப்பு பொருளைத் தெளிவாக வழங்குகிறது; கிரேக்க இறந்தகாலச் செயப்பாட்டு வடிவத்தின் நிறைவேறிய செயலைத் தமிழ்ப் பெயரெச்சம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνομίαι
  choice: சட்டமீறல்கள்
  rationale: பொதுவான தீச்செயல்களை மட்டும் அல்லாமல், சட்டத்தை மீறும் செயல்கள் என்ற ἀνομία-வின் வலிமையை அணுகத்தக்க நவீனத் தமிழில் காக்கிறது.
- source_word: ἐπεκαλύφθησαν
  choice: மூடப்பட்ட
  rationale: சங்கீத மேற்கோளிலுள்ள ‘மூடுதல்’ உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: ἁμαρτίαι
  choice: பாவங்கள்
  rationale: ἁμαρτίαι என்பதற்கான நிலையான, தெளிவான தமிழ் இணைச்சொல்.
theological_decisions:
- issue: ‘சட்டமீறல்கள்’ மற்றும் ‘பாவங்கள்’ ஆகியவற்றின் தொடர்பு
  choice: இரு தொடர்புடைய கிரேக்கச் சொற்களையும் தமிழில் வேறுபடுத்தி வழங்குதல்
  alternative: இரண்டையும் ‘பாவங்கள்’ என்ற ஒரே பொதுச்சொல்லால் மொழிபெயர்த்தல்
  rationale: வசனத்தின் கவிதை இணைநிலையைப் பாதுகாப்பதோடு, மூலத்தில் உள்ள தொடர்புடைய ஆனால் ஒன்றல்லாத சொற்களின் வேறுபாட்டையும் காக்கிறது; அவற்றுக்கிடையே மூலத்தைவிடக் கூர்மையான இறையியல் வேறுபாட்டை உருவாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் இருவரிசை இணைநிலையும் ‘மூடப்பட்ட’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
