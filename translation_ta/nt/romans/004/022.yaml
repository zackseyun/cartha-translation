lexical_decisions:
- source_word: διό
  choice: ஆகையால்
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: ἐλογίσθη
  choice: கணக்கிடப்பட்டது
  rationale: கிரேக்க வினைச்சொல்லின் இறப்பினை வடிவத்தைப் பாதுகாப்பதோடு, ரோமர் 4-ல் தொடரும் கணக்கு சார்ந்த உருவகத்தையும் கூடுதல் கோட்பாட்டு விளக்கமின்றி வெளிப்படுத்துகிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: ஆபிரகாமைக் குறிக்கும் ஒருமை தந்தைவேற்றுமையை இயல்பான, மரியாதையான தமிழில் தருகிறது.
- source_word: εἰς
  choice: ஆக
  rationale: ἐλογίσθη ... εἰς δικαιοσύνην என்ற சொற்றொடரில் ஏற்படும் மதிப்பு அல்லது நிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: பவுலின் பயன்பாட்டில் உள்ள நேர்மை/சரியான நிலை மற்றும் நியாயம் ஆகிய பொருள் பரப்பை ‘நீதி’ இயல்பாகத் தாங்குகிறது; ‘நியாயம்’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பவுலின் கணக்கிடுதல் சார்ந்த மொழியை மேலதிக கோட்பாட்டு சொற்கள் இன்றி மொழிபெயர்த்தல்
  choice: அது அவருக்கு நீதியாகக் கணக்கிடப்பட்டது
  alternative: அது அவருக்கு நீதியாக வரவு வைக்கப்பட்டது
  rationale: இது மூலத்தின் இறப்பினை வடிவத்தையும் கணக்கு உருவகத்தையும் காக்கிறது; எது அல்லது யார் கணக்கிட்டார் என்பதை மூலத்தைவிட வெளிப்படையாக விளக்காமல் விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கணக்கிடப்பட்டது’ என்பது சாதாரண வாசகருக்குப் புரியும் வகையில் கணக்கு உருவகத்தைத் தக்கவைக்கிறது; அடிக்குறிப்புகள் பொருத்தமான மாற்றுச் சொற்களைப் பாதுகாக்கின்றன.
