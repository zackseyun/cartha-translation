id: ROM.4.15
reference: Romans 4:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: ta
  text: ஏனெனில், சட்டம்[a] கடுங்கோபத்தை விளைவிக்கிறது; ஆனால் சட்டம் இல்லாத இடத்தில் மீறுதலும்[b] இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோசேயின் திருச்சட்டம்.”
    reason: νόμος என்பது இங்கே பொதுவாகச் சட்டத்தையோ, குறிப்பாக மோசேயின் திருச்சட்டத்தையோ சுட்டலாம்.
  - marker: b
    text: அல்லது, “வரம்புமீறலும்.”
    reason: παράβασις என்பது நிறுவப்பட்ட கட்டளை அல்லது வரம்பைக் கடப்பதைச் சிறப்பாகக் குறிக்கிறது.
lexical_decisions:
- source_word: νόμος
  choice: சட்டம்
  rationale: பவுலின் சொல்லை இங்கே மோசேயின் திருச்சட்டத்திற்கு மட்டும் குறுக்காமல், சட்டம் என்ற பரந்த பொருளில் வைத்திருக்கிறது. அதேவேளையில், சூழலில் மோசேயின் திருச்சட்டம் பின்னணியாக இருக்கக்கூடிய வாய்ப்பையும் மறுப்பதில்லை.
- source_word: ὀργή
  choice: கடுங்கோபம்
  rationale: சாதாரண எரிச்சலைவிட நீதித்தீர்ப்புடன் தொடர்புடைய வலிமையான கோபத்தைச் சுட்டுவதற்காகத் தேர்ந்தெடுக்கப்பட்டது. அது யாருடைய கோபம் என்பதை மூலவாக்கியம் வெளிப்படையாகக் கூறாததால், ‘இறைவனின் கோபம்’ என்று விரிவாக்கப்படவில்லை.
- source_word: κατεργάζεται
  choice: விளைவிக்கிறது
  rationale: சட்டம் கடுங்கோபம் ஏற்படக் காரணமாகிறது என்ற வினையின் விளைவுண்டாக்கும் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: οὗ δὲ
  choice: ஆனால் ... இடத்தில்
  rationale: οὗ என்பதன் இடப்பொருளையும் δέ தரும் மிதமான எதிர்மறைத் தொடர்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: παράβασις
  choice: மீறுதல்
  rationale: அறியப்பட்ட கட்டளை அல்லது வரம்பைக் கடப்பதைக் குறிக்கும் சொல்லின் பொருளைப் பாதுகாக்கிறது; ‘பாவம்’ என்று பொதுமைப்படுத்தி, பவுல் இங்கே பயன்படுத்தும் குறிப்பான கருத்தை மங்கச் செய்யவில்லை.
theological_decisions:
- issue: பவுலின் வாதத்தில் νόμος என்பதன் எல்லை
  choice: சட்டம்
  alternative: மோசேயின் திருச்சட்டம்
  rationale: இந்த வசனம் சட்டத்திற்கும் அதன் மீறுதலுக்கும் இடையிலான பொதுக் கோட்பாட்டை முன்வைக்கிறது. எனவே பிரதான உரை அதை மோசேயின் திருச்சட்டத்திற்கு மட்டும் முன்கூட்டியே கட்டுப்படுத்தவில்லை; அந்தக் குறிப்பான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ὀργή யாருடையது என்பது
  choice: கடுங்கோபம்
  alternative: இறைவனின் கடுங்கோபம்
  rationale: ரோமர் நிருபத்தின் விரிந்த சூழல் இறைவனின் நீதித்தீர்ப்பை நினைவூட்டினாலும், இந்தக் கிரேக்க வாக்கியத்தில் கோபத்தின் உரியவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. அந்த மறைபொருளை மொழிபெயர்ப்பில் தீர்மானித்து விடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கடுங்கோபம்’ நீதித்தீர்ப்பு சார்ந்த வலிமையைத் தக்கவைக்கிறது; ‘மீறுதல்’ எளிதில் புரியும்படியும் மூலச்சொல்லின் குறிப்பான பொருளுக்கு நெருக்கமாகவும் உள்ளது.
