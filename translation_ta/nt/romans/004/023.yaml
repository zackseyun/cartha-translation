  yaml_path: translation/nt/romans/004/023.yaml
  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: ta
  text: “அது அவருக்குக் கணக்கிடப்பட்டது” என்று எழுதப்பட்டது அவருக்காக மட்டுமே அல்ல.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எண்ணப்பட்டது” அல்லது “அவருடைய கணக்கில் வரவு வைக்கப்பட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγράφη
  choice: எழுதப்பட்டது
  rationale: இறைவேதத்தில் எழுதப்பட்ட கூற்றைக் குறிக்கும் எளிய செயப்பாட்டு வடிவத்தைத் தக்கவைக்கிறது.
- source_word: δὲ
  choice: தனி மொழிபெயர்ப்பு இன்றி வாக்கிய அமைப்பில் உணர்த்தப்பட்டது
  rationale: இங்கு δέ வலுவான எதிர்மறையை விட வாதத்தின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் இயல்பான சொற்றொடர் வரிசையே அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: δι’ αὐτὸν μόνον
  choice: அவருக்காக மட்டுமல்ல
  rationale: இந்தக் கூற்று ஆபிரகாமை மட்டும் கருத்தில் கொண்டு எழுதப்படவில்லை என்ற வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: எழுதப்பட்ட கூற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ் மேற்கோள் இணைப்பாக உள்ளது.
- source_word: ἐλογίσθη
  choice: கணக்கிடப்பட்டது
  rationale: λογίζομαι என்பதிலுள்ள கணக்கு வைத்தல் அல்லது ஒருவரின் கணக்கில் சேர்த்தல் என்ற உருவகத்தைத் தக்கவைக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: செயப்பாட்டு வினையுடன் வரும் பயனிலைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: நீதிமானாக்குதல் பற்றிய பவுலின் வாதத்தில் λογίζομαι என்பதன் மொழிபெயர்ப்பு
  choice: கணக்கிடப்பட்டது
  alternative: எண்ணப்பட்டது; வரவு வைக்கப்பட்டது
  rationale: ‘கணக்கிடப்பட்டது’ என்பது கணக்கியல் சார்ந்த உருவகத்தையும், யாருடைய கணக்கில் ஒன்றைச் சேர்ப்பது என்ற பொருளையும் திறந்த நிலையில் வைத்திருக்கிறது; நீதியைப் பற்றிய முந்தைய சூழலை இவ்வசனத்திற்குள் வெளிப்படையாகச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் மேற்கோள் அமைப்பு தமிழில் இயல்பாக அமைய முன்வைக்கப்பட்டுள்ளது; δέ-க்கு தேவையற்ற ‘இப்போது’ சேர்க்கப்படவில்லை.
