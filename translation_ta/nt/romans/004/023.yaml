  source_fidelity: The draft accurately represents the passive ἐγράφη, the content clause introduced by ὅτι, the limitation μόνον, and ἐλογίσθη αὐτῷ as an accounting-style passive. The omission of an explicit equivalent for δέ is acceptable in Tamil, where a separate connector is not required here.
