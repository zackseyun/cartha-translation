  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: ta
  text: கர்த்தர் எவருக்கு எதிராகப் பாவத்தைக் ஒருபோதும் கணக்கில் கொள்ளமாட்டாரோ, அந்த மனிதன்[a] பேறுபெற்றவன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கர்த்தர் எவருக்கு எதிராகப் பாவத்தைக் ஒருபோதும் கணக்கில் கொள்ளமாட்டாரோ, அவர் பேறுபெற்றவர்.” இங்குள்ள “மனிதன்” ஆணை மட்டும் குறிக்காமல், மனிதரைப் பொதுவாகப் பிரதிநிதித்துவப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கர்த்தர் அவனுக்கு எதிராகப் பாவத்தைக் நிச்சயமாகக் கணக்கில் கொள்ளமாட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: பேறுபெற்றவன்
  rationale: இது வெறும் மனநிலை சார்ந்த ‘மகிழ்ச்சியானவன்’ என்பதைக் காட்டிலும், வேதவாக்கியத்தின் இறை ஆசீர்வாதத்தையும் நற்பேற்றையும் இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀνήρ
  choice: மனிதன்
  rationale: கிரேக்க மூலத்தின் ஆண்பால் ஒருமை வடிவத்தைத் தக்கவைத்தபடியே, இவ்விடத்தில் அது ஆண்களை மட்டும் குறிக்காமல் மனிதரைப் பொதுவாகப் பிரதிநிதித்துவப்படுத்துகிறது.
- source_word: οὗ
  choice: எந்த மனிதனுடைய
  rationale: உறவுப்பெயரின் உடைமை வேற்றுமையைத் தமிழில் இயல்பாகக் கொண்டு வந்து, ‘அவனுடைய பாவம்’ என்பதோடு நேரடியாக இணைக்கிறது.
- source_word: οὐ μὴ
  choice: ஒருபோதும் ... மாட்டாரோ
  rationale: οὐ μή என்னும் வலியுறுத்தப்பட்ட மறுப்பை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λογίσηται
  choice: கணக்கில் கொள்ளமாட்டாரோ
  rationale: ரோமர் 4-இன் சூழலில் முக்கியமான கணக்கியல் உருவகத்தைப் பாதுகாக்கிறது; அதேவேளையில் தேவையற்ற தொழில்நுட்ப இறையியல் சொல்லைத் திணிக்கவில்லை.
- source_word: κύριος
  choice: கர்த்தர்
  rationale: வேத மேற்கோள் சூழலில் κύριος என்பதற்கான நிலைபெற்ற, கண்ணியமான தமிழ் வடிவம்.
- source_word: ἁμαρτίαν
  choice: பாவத்தை
  rationale: கிரேக்க ஒருமையைத் தக்கவைத்து, பாவத்தை ஒரு பொதுவகையாக இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: முதன்மை உரையில் ‘மனிதன்’ என்று வைத்து, அதன் பொதுப்பிரதிநிதித்துவப் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துதல்.
  alternative: ‘ஒருவர்’ என்று பாலினக் குறியீடின்றி மொழிபெயர்த்தல்.
  rationale: ἀνήρ இலக்கணரீதியாக ஆண்பால் ஒருமையாக இருந்தாலும், இங்கு ஆண்களை மட்டும் விலக்காகக் குறிக்கவில்லை. ‘மனிதன்’ மூலவடிவத்தின் தன்மையையும் பொதுவான மனிதப் பொருளையும் தமிழில் இணைத்துக் காட்டுகிறது.
- issue: οὐ μή என்பதின் வலியுறுத்தப்பட்ட மறுப்பு
  choice: ‘ஒருபோதும் ... மாட்டார்’ என்று காலவிரிவுடன் வலியுறுத்துதல்.
  alternative: ‘நிச்சயமாகக் கணக்கில் கொள்ளமாட்டார்’ என்று உறுதியை முன்னிறுத்துதல்.
  rationale: இரண்டு வடிவங்களும் வலியுறுத்தப்பட்ட மறுப்பைச் சுமக்கின்றன; முதன்மை வடிவம் தமிழில் இயல்பாக இருந்து, ‘will never’ என்ற காலவிரிவையும் தெளிவாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேத மேற்கோளுக்கேற்ற கண்ணியமான நடையும் பொதுவாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. ‘பேறுபெற்றவன்’ ஆசீர்வாத மொழியின் நிறையைத் தக்கவைக்கிறது; ‘கணக்கில் கொள்ளுதல்’ சுற்றியுள்ள அதிகாரத்தின் கணக்கியல் உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
