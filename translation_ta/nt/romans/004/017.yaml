  source_fidelity: வரைவில் மேற்கோளும், இறந்தோருக்கு உயிரளிக்கும் கடவுள் என்ற விளக்கமும், இறுதிச் சொற்றொடரின் விளக்கத் திறந்தநிலையும் பெரும்பாலும் சரியாக உள்ளன. ஆனால் கிரேக்க உரையில் இல்லாத ‘அவர் நம் அனைவருக்கும் தந்தை’ என்ற முழுக் கூறு வசனத்தின் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது. அது 4:16-இன் தொடர்புடைய கருத்தாக இருந்தாலும், 4:17-ன் மூல உரையில் இடம்பெறுவதில்லை.
