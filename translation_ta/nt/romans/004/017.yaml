revisions:
- from: 'எழுதப்பட்டுள்ளபடி, “பல நாடுகளுக்குத்[a] தந்தையாக உன்னை ஏற்படுத்தியிருக்கிறேன்.” ஆபிரகாம் நம்பிய கடவுளின் முன்னிலையில் அவர் நம் அனைவருக்கும் தந்தை. அந்தக் கடவுள் இறந்தவர்களுக்கு உயிரளித்து, இல்லாதவற்றை இருப்பவைபோல் அழைக்கிறார்.[b]


    [a] இங்கே “நாடுகள்” என்பதை “பிற இனத்தார்” என்றும் புரிந்துகொள்ளலாம். ஆனால் ஆதியாகமத்திலிருந்து மேற்கோள் காட்டப்படும் இந்த இடத்தில், பல்வேறு நாடுகளையும் மக்களினங்களையும் குறிக்கும் விரிவான பொருளே அதிகம் பொருந்துகிறது.

    [b] அல்லது, பொருளை விளக்கிக் கூறினால், “இல்லாதவற்றை இருக்கும்படி அழைக்கிறார்.”'
  to: எழுதப்பட்டுள்ளபடி, “பல நாடுகளுக்குத்[a] தந்தையாக உன்னை ஏற்படுத்தியிருக்கிறேன்”—அவர் நம்பிய, இறந்தோருக்கு உயிரளிப்பவரும் இல்லாதவற்றை இருப்பவைபோல் அழைப்பவருமான கடவுளின் முன்னிலையில்.[b]
  rationale: மூலத்தில் இல்லாத ‘நம் அனைவருக்கும் தந்தை’ என்ற சேர்க்கை நீக்கப்பட்டுள்ளது. κατέναντι οὗ ἐπίστευσεν θεοῦ என்ற தொடர் முந்தைய வசனத்தின் வாக்கிய அமைப்பைச் சார்வதால், அதன் சார்புத் தன்மையைத் தமிழிலும் ‘கடவுளின் முன்னிலையில்’ எனக் காக்கப்பட்டுள்ளது. இறுதிக் கூறு கிரேக்கத்தின் சுருக்கமான, விளக்கத்திற்குத் திறந்த அமைப்பைத் தக்கவைக்கிறது; வெளிப்படையான ‘இருப்புக்கு அழைக்கிறார்’ என்ற விளக்கம் அடிக்குறிப்புக்கு மட்டுமே வரையறுக்கப்பட்டுள்ளது.
