source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: ta
  text: எழுதப்பட்டுள்ளபடி, “பல நாடுகளுக்குத்[a] தந்தையாக உன்னை ஏற்படுத்தியிருக்கிறேன்”—அவர் நம்பிய, இறந்தோருக்கு உயிரளிப்பவரும் இல்லாதவற்றை இருப்பவைபோல் அழைப்பவருமான கடவுளின் முன்னிலையில்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “நாடுகள்” என்பதை “பிற இனத்தார்” என்றும் புரிந்துகொள்ளலாம். ஆனால் ஆதியாகமத்திலிருந்து மேற்கோள் காட்டப்படும் இந்த இடத்தில், பல்வேறு நாடுகளையும் மக்களினங்களையும் குறிக்கும் விரிவான பொருளே அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, பொருளை விளக்கிக் கூறினால், “இல்லாதவற்றை இருப்புக்கு அழைக்கிறார்.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: எழுதப்பட்டுள்ளபடி
  rationale: வேதமேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடர்; நிறைவேற்றப்பட்டு தொடர்ந்து நிலைக்கும் எழுத்தின் வலிமையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: பல நாடுகளுக்குத் தந்தையாக
  rationale: ஆதியாகம மேற்கோளின் சூழலில் ἐθνῶν என்பது யூதரல்லாதவர்களை மட்டும் அல்லாமல் பல நாடுகளையும் மக்களினங்களையும் விரிவாகக் குறிக்கிறது.
- source_word: τέθεικά σε
  choice: உன்னை ஏற்படுத்தியிருக்கிறேன்
  rationale: τέθεικα என்ற நிறைவுற்ற வினை வடிவம், கடவுள் ஆபிரகாமை அந்த நிலையில் ஏற்படுத்தியதையும் அதன் தொடரும் செல்லுபடியையும் வெளிப்படுத்துகிறது.
- source_word: κατέναντι οὗ ἐπίστευσεν θεοῦ
  choice: ஆபிரகாம் நம்பிய கடவுளின் முன்னிலையில்
  rationale: κατέναντι என்பதன் முன்னிலை/சந்நிதி சார்ந்த பொருளையும், ஆபிரகாமின் நம்பிக்கை கடவுளை நோக்கியது என்பதையும் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: இறந்தவர்களுக்கு உயிரளித்து
  rationale: கடவுளின் உயிர்ப்பிக்கும் வல்லமையை இயல்பாகவும் மூலத்தின் நிகழ்காலப் பண்புப்பெயர் கருத்துக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: καλοῦντος τὰ μὴ ὄντα ὡς ὄντα
  choice: இல்லாதவற்றை இருப்பவைபோல் அழைக்கிறார்
  rationale: சுருக்கமான கிரேக்கச் சொல்லமைப்பையும் அதன் விளக்கத் திறந்தநிலையையும் காக்கிறது; படைப்பை இருப்புக்கு அழைத்தல் என்ற விளக்கத்தை முதன்மை உரைக்குள் கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: இறுதி சொற்றொடர் இல்லாதவற்றைப் படைத்து இருப்புக்குக் கொண்டுவருவதை நேரடியாகக் கூறுகிறதா, அல்லது அதைவிட விரிவான கடவுளின் அழைப்புச் செயலைக் குறிக்கிறதா?
  choice: இல்லாதவற்றை இருப்பவைபோல் அழைக்கிறார்
  alternative: இல்லாதவற்றை இருக்கும்படி அழைக்கிறார்
  rationale: மூல கிரேக்கம் படைப்பாற்றலை உணர்த்தக்கூடியது; இருப்பினும் அதன் சொற்கள் சுருக்கமாகவும் விளக்கத்திற்கு இடமளிப்பவையாகவும் உள்ளன. எனவே முதன்மை உரை அந்த இறுக்கத்தைக் காக்கிறது; வெளிப்படையான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: 17ஆம் வசனத்தின் தொடக்கம் முந்தைய வசனத்தின் ‘நம் அனைவருக்கும் தந்தை’ என்ற கருத்தை இலக்கண ரீதியாகத் தொடர்கிறது.
  choice: ஆபிரகாம் நம்பிய கடவுளின் முன்னிலையில் அவர் நம் அனைவருக்கும் தந்தை
  alternative: மேற்கோளுக்குப் பின் வினைமுற்றற்ற தொடராக விடுதல்
  rationale: கிரேக்கத்தில் முந்தைய வசனத்திலிருந்து தொடரும் வாக்கியத் தொடர்பை தமிழில் தெளிவுபடுத்துகிறது. ‘நம் அனைவருக்கும் தந்தை’ என்பது ரோமர் 4:16-இல் வெளிப்படையாக உள்ள உடனடி முன்னுரையை மீளெடுத்ததே தவிர புதிய கருத்தைச் சேர்ப்பது அல்ல.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தை’, ‘கடவுள்’, ‘உயிரளித்து’ ஆகிய சொற்கள் இயல்பான தற்போதைய பயன்பாட்டைத் தருகின்றன. மூல வசனம் முந்தைய வசனத்துடன் இலக்கண ரீதியாக இணைந்திருப்பதால், தமிழில் முழுமையான வாக்கியமாக அமைய உடனடி முன்னுரையிலுள்ள ‘நம் அனைவருக்கும் தந்தை’ என்ற பகுதி வெளிப்படையாக மீள்கூறப்பட்டுள்ளது.
