  source_fidelity: மூல கிரேக்கத்தின் நிபந்தனை அமைப்பு (εἰ γὰρ …), οἱ ἐκ νόμου என்ற உறவுசார் குறிப்பு, κληρονόμοι, மேலும் κεκένωται / κατήργηται ஆகிய perfect passive விளைவுநிலை ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘திருச்சட்டத்தைச் சார்ந்தவர்கள்’ என்பது சட்டத்தைக் கடைப்பிடிப்பவர்கள் என்று தேவையற்ற வகையில் குறுக்காமல், மூலத்தின் சுருக்கமான சொல்லாட்சியை இயல்பாக வெளிப்படுத்துகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘விசுவாசம் வெறுமையாக்கப்பட்டிருக்கிறது’ மூல உருவகத்தைப் பாதுகாக்கிறது; ‘வாக்குறுதியும் செயலற்றதாக்கப்பட்டிருக்கிறது’ பவுலின் இணையான வலியுறுத்தலை நன்றாகத் தருகிறது.
  terminology: ‘திருச்சட்டம்’, ‘வாரிசுகள்’, ‘விசுவாசம்’, ‘வாக்குறுதி’ ஆகியவை இச்சூழலுக்கு நிலையான, புரிந்துகொள்ளக்கூடிய சொற்கள். ‘செயலற்றதாக்கப்பட்டிருக்கிறது’ κατήργηται என்பதன் செயல்பாட்டை நீக்கும் பொருளை, முற்றழிப்பு என மிகையாக்காமல் உரியவாறு தருகிறது. அடிக்குறிப்பு மாற்றுகள் மூலச் சொல்லின் பொருள் எல்லைக்குள் உள்ளன; அடிக்குறிப்பு அடையாளங்களும் உரிய இடங்களில் உள்ளன.
