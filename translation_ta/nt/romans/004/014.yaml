source:
  edition: SBLGNT
  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: ta
  text: ஏனெனில், திருச்சட்டத்தைச் சார்ந்தவர்கள் வாரிசுகள் என்றால்[a], விசுவாசம் வெறுமையாக்கப்பட்டிருக்கிறது[b]; வாக்குறுதியும் செயலற்றதாக்கப்பட்டிருக்கிறது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருச்சட்டத்திலிருந்து வருகிறவர்கள்.”
    reason: οἱ ἐκ νόμου என்ற சுருக்கமான கிரேக்கச் சொற்றொடரின் நேரடியான மாற்றைச் சுட்டுகிறது.
  - marker: b
    text: அல்லது, “விசுவாசம் பயனற்றதாக்கப்பட்டிருக்கிறது.”
    reason: κεκένωται என்பதிலுள்ள ‘வெறுமையாக்குதல்’ உருவகம், நடைமுறையில் பயனற்றதாக்குதல் என்ற பொருளையும் தரலாம்.
  - marker: c
    text: அல்லது, “வாக்குறுதி செல்லாததாக்கப்பட்டிருக்கிறது.”
    reason: κατήργηται என்பது செயலற்றதாக்குதல் அல்லது செல்லுபடியாகாததாக்குதல் என்ற நெருங்கிய பொருள்களைக் கொள்ளலாம்.
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: திருச்சட்டத்தைச் சார்ந்தவர்கள்
  rationale: திருச்சட்டத்தோடு உள்ள உறவால் அடையாளப்படுத்தப்படும் மக்களைக் குறிக்கும் பவுலின் சுருக்கமான சொற்றொடரை, வெறும் சட்டக் கடைப்பிடிப்பாக மிகையாக விளக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: κληρονόμοι
  choice: வாரிசுகள்
  rationale: உரிமைச் சொத்தையும் வாக்குறுதியின் நிறைவேற்றத்தில் பங்குபெறுவதையும் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: κεκένωται
  choice: வெறுமையாக்கப்பட்டிருக்கிறது
  rationale: மூலத்தின் உருவகத்தையும் perfect passive வடிவம் உணர்த்தும் விளைவுநிலையையும் காக்கிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: ரோமர் 4-இல் திருச்சட்டத்துக்கு எதிர்நிலையில் வரும் நம்பிக்கையைச் சுட்டும் வழக்கமான, தெளிவான வேதாகமத் தமிழ் சொல்.
- source_word: κατήργηται
  choice: செயலற்றதாக்கப்பட்டிருக்கிறது
  rationale: முற்றிலும் அழிக்கப்பட்டது என்று மிகைப்படுத்தாமல், செயல்படும் வலிமை இழக்கச் செய்யப்பட்டதைக் காட்டுகிறது; perfect passive விளைவுநிலையும் காக்கப்படுகிறது.
- source_word: ἐπαγγελία
  choice: வாக்குறுதி
  rationale: முன்னர் விவாதிக்கப்பட்ட குறிப்பிட்ட இறை வாக்குறுதியை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: திருச்சட்டத்துடன் தொடர்புடைய οἱ ἐκ νόμου என்பதன் பொருள்
  choice: திருச்சட்டத்தைச் சார்ந்தவர்கள்
  alternative: திருச்சட்டத்தின்படி வாழ்கிறவர்கள்
  rationale: மூலத்தின் உறவுசார் சுருக்கத்தைப் பாதுகாத்து, இதை சட்டத்தைக் கடைப்பிடிக்கும் நடத்தைக்கு மட்டும் வரையறுப்பதைத் தவிர்க்கிறது.
- issue: νόμος என்பதன் மொழிபெயர்ப்பு
  choice: திருச்சட்டம்
  alternative: சட்டம்
  rationale: இங்கு மோசேயின் சட்டத்தையும் பவுலின் இறையியல் வாதத்தையும் சுட்டுவதால், சாதாரண குடிமைச் சட்டத்திலிருந்து வேறுபடுத்துகிறது; அதேவேளை ஒரு குறிப்பிட்ட சமய மரபின் பழைய தொழில்நுட்பச் சொல்லைத் திணிக்கவில்லை.
- issue: திருச்சட்டத்துடன் எதிர்நிலையில் வரும் πίστις
  choice: விசுவாசம்
  alternative: நம்பிக்கை
  rationale: பவுலின் வாதத்தில் உள்ள இறையியல் பதற்றத்தை விளக்கிச் சுருக்காமல், நிலைபெற்ற மற்றும் புரிந்துகொள்ளக்கூடிய சொல்லால் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் நிபந்தனை வாக்கிய அமைப்பும் ‘விசுவாசம் வெறுமையாக்கப்படுதல்’ என்ற கூர்மையான உருவகமும் காக்கப்பட்டுள்ளன; விளக்கவுரையாக விரிவாக்கப்படவில்லை.
