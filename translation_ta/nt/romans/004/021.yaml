  text: καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/021.yaml
  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: ta
  text: மேலும், அவர்[c] வாக்குறுதி அளித்ததைச் செய்யவும் அவரால் முடியும்[b] என்று முழுமையாக உறுதிப்பட்டார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முழுமையாக நம்பினார்’ அல்லது ‘முழு நிச்சயமடைந்தார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் நிகழ்காலமாக, ‘வல்லவராக இருக்கிறார்’ என்ற பொருள்.
    reason: lexical_alternative
  - marker: c
    text: சுற்றியுள்ள உரையின்படி, இங்கு ‘அவர்’ என்பது கடவுளைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: முழு உறுதியடைந்தார்
  rationale: முழுமையான நிச்சயத்தையும் மனவுறுதியையும் குறிக்கும் கிரேக்கச் சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. கிரேக்கத்தில் இது பங்கேற்புவினை வடிவில் இருந்தாலும், முந்தைய வசனத்துடன் தொடரும் கருத்தைத் தனிவசனமாகத் தெளிவாக வாசிக்கத் தமிழில் முற்றுவினையாக வழங்கப்பட்டுள்ளது.
- source_word: ὅτι
  choice: என்று
  rationale: ஆபிரகாம் எதைப் பற்றி முழு உறுதியடைந்தார் என்பதைக் கூறும் உள்ளடக்க வாக்கியத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: ὃ ἐπήγγελται
  choice: வாக்குறுதி அளித்ததை
  rationale: கிரேக்க நிறைவுக்காலம், ஏற்கெனவே அளிக்கப்பட்டு தொடர்ந்து செல்லுபடியாக இருக்கும் வாக்குறுதியைக் குறிக்கிறது. தமிழ் வடிவம் முன் நிகழ்ந்த வாக்குறுதியை இயல்பாகத் தெரிவிக்கிறது.
- source_word: δυνατός ἐστιν
  choice: அவரால் ... முடியும்
  rationale: கிரேக்கத்தின் நிகழ்காலத் திறனைத் தமிழிலும் நிகழ்காலமாகப் பாதுகாக்கிறது; இது கடந்தகாலச் சம்பவத்தில் மட்டும் கட்டுப்பட்ட திறன் அல்ல.
- source_word: καὶ ποιῆσαι
  choice: செய்யவும்
  rationale: καί என்பதன் ‘மேலும்/கூட’ என்ற வலியுறுத்தலை ‘-வும்’ வெளிப்படுத்துகிறது; ποιέω என்ற பொதுவான வினையின் பரப்பைச் சுருக்காமல் ‘செய்ய’ என வழங்குகிறது.
theological_decisions:
- issue: வாக்குறுதி அளித்து அதைச் செய்ய வல்லவரின் மறைமுக எழுவாய்
  choice: முதன்மை உரையில் ‘அவர்’ என்ற சுட்டுப்பெயரை வைத்திருத்தல்
  alternative: ‘கடவுள்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: சுற்றியுள்ள உரையில் குறிக்கப்படுபவர் கடவுள் என்பது தெளிவு; ஆனால் இவ்வசனத்தின் கிரேக்க உரை அவரது பெயரை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே உரையின் மறைமுகத்தன்மையைப் பாதுகாத்து, குறிப்பில் விளக்கம் தரப்படுகிறது.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அவரால் செய்யவும் முடியும்’ என்பது மூலத்தின் நிகழ்காலத் திறனையும் ‘மேலும் செய்ய வல்லவர்’ என்ற வலியுறுத்தலையும் காக்கிறது. எல்லா குறிப்புக் குறியீடுகளும் அவற்றுக்குரிய சொல்லுக்குப் பின்னர் முதன்மை உரையில் இடப்பட்டுள்ளன.
