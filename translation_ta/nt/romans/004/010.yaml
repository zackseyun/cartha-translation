revisions:
- from: அப்படியானால், அது எவ்வாறு கணக்கிடப்பட்டது[a]? அவர் விருத்தசேதனம் செய்யப்பட்டிருந்த நிலையிலா, அல்லது விருத்தசேதனம் செய்யப்படாத நிலையிலா? விருத்தசேதனம் செய்யப்பட்டிருந்த நிலையில் அல்ல; விருத்தசேதனம் செய்யப்படாத நிலையில்தான்.
