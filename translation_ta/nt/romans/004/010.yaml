id: ROM.4.10
reference: Romans 4:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: ta
  text: அப்படியானால், அது எவ்வாறு கணக்கிடப்பட்டது[a]? அவர் விருத்தசேதனம் பெற்றிருந்தபோதா, அல்லது விருத்தசேதனம் பெறாதிருந்தபோதா? விருத்தசேதனம் பெற்றிருந்தபோது அல்ல; விருத்தசேதனம் பெறாதிருந்தபோதுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கணக்கிடப்பட்டது” என்பதற்கு “வரவு வைக்கப்பட்டது” அல்லது “எண்ணப்பட்டது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: எவ்வாறு
  rationale: பவுலின் வாதத்தில், கணக்கிடுதல் எந்தச் சூழ்நிலையில் நிகழ்ந்தது என்ற கேள்வியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடுத்துவரும் இரு நிலைகளுடனான கேள்வியையும் இணைக்கிறது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: முந்தைய வாதத்திலிருந்து எழும் முடிவுசார் வினாவை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἐλογίσθη
  choice: கணக்கிடப்பட்டது
  rationale: λογίζομαι என்பதன் இறையியல் சார்ந்த ‘ஒருவருடையதாகக் கணக்கிடுதல்’ என்ற கருத்தைத் தக்கவைத்து, மிகையாக நிதித்துறைச் சொல்லாக்கத்தைத் திணிக்காமல் உள்ளது.
- source_word: ἐν περιτομῇ ὄντι
  choice: விருத்தசேதனம் செய்யப்பட்டிருந்த நிலையில்
  rationale: பெயர்ச்சொல் மற்றும் பங்கேற்பு வினை வடிவில் உள்ள கிரேக்கத் தொடரை, ஆபிரகாமின் அப்போதைய நிலையைக் குறிக்கும் இயல்பான தமிழாக வழங்குகிறது.
- source_word: ἐν ἀκροβυστίᾳ
  choice: விருத்தசேதனம் செய்யப்படாத நிலையில்
  rationale: இங்கு ἀκροβυστία என்பது உடல் உறுப்பை அல்ல, விருத்தசேதனம் செய்யப்படாத நிலையைக் குறிக்கிறது; எதிர்மறை இணை அமைப்பையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: οὐκ ... ἀλλ’
  choice: அல்ல; ... நிலையில்தான்
  rationale: கிரேக்கத்தின் வலியுறுத்தப்பட்ட மறுப்பு–எதிர்மறை அமைப்பை இயல்பான தமிழ் வாக்கிய அழுத்தத்துடன் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கணக்கிடப்பட்டதன் பொருள்
  choice: முதன்மை உரையில் ‘கணக்கிடப்பட்டது’ என்று வைத்து, மாற்றுச் சொற்களை அடிக்குறிப்பில் தருதல்
  alternative: ‘வரவு வைக்கப்பட்டது’ அல்லது ‘எண்ணப்பட்டது’ என்பவற்றை முதன்மை உரையில் பயன்படுத்துதல்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் நீதியாகக் கணக்கிடப்படுதல் என்ற கருத்தைத் திறந்தவாறே வைத்திருக்கிறது; அதை வெறும் நிதிப் பரிவர்த்தனையாகவோ மனதளவிலான கருத்தாகவோ சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வாதத்தின் கேள்வி–பதில் ஓட்டமும் ‘விருத்தசேதனம் செய்யப்பட்ட/செய்யப்படாத நிலை’ என்ற தெளிவான எதிர்மறை இணையும் பாதுகாக்கப்பட்டுள்ளன. மொழிநடை மரியாதையானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமாக உள்ளது.
