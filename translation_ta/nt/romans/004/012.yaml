id: ROM.4.12
reference: Romans 4:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: ta
  text: மேலும், வெறுமனே விருத்தசேதனம் செய்யப்பட்டவர்களாக இருப்பவர்கள் மட்டுமல்லாமல், நம் தந்தையாகிய ஆபிரகாம் விருத்தசேதனம் செய்யப்படாத நிலையில் கொண்டிருந்த விசுவாசத்தின் அடிச்சுவடுகளில் நடப்பவர்களாகவும் இருப்போருக்கு அவர் விருத்தசேதனம் செய்யப்பட்டவர்களின் தந்தையாக இருக்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: விருத்தசேதனம் செய்யப்பட்டவர்களுக்கு அவர் தந்தையாக இருக்கிறார்
  rationale: சொல்லுக்கு நெருக்கமான ‘விருத்தசேதனத்தின் தந்தை’ என்பது தமிழில் சடங்கின் தோற்றுவிப்பவர் என்ற தவறான பொருளைத் தரக்கூடும். சூழலில் விருத்தசேதனம் செய்யப்பட்ட மக்களுக்கான ஆபிரகாமின் தந்தைநிலையே குறிக்கப்படுகிறது.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: விருத்தசேதனம் செய்யப்பட்டவர்கள் என்பதால் மட்டும் அல்ல
  rationale: ‘விருத்தசேதனத்திலிருந்து மட்டும் அல்ல’ என்ற சொற்சொல் அமைப்பைவிட இது இயல்பான தமிழ்; வெளிப்புற விருத்தசேதனம் மட்டும் போதாது என்ற எதிர்மறை வரம்பையும் காக்கிறது.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: அடிச்சுவடுகளில் நடப்பவர்கள்
  rationale: στοιχέω-வின் ஒழுங்காகப் பின்பற்றும் நடத்தைப் பொருளையும் ἴχνη-யின் காலடித்தட உருவகத்தையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இங்கு ஆபிரகாம் நம்பிய செயற்பாட்டைக் குறிக்கிறது; ‘நம்பகத்தன்மை’ அல்ல. ரோமர் 4-ன் வாதத்துக்கும் ‘விசுவாசம்’ பொருந்துகிறது.
- source_word: ἐν ἀκροβυστίᾳ
  choice: விருத்தசேதனம் செய்யப்படாத நிலையில்
  rationale: ஆபிரகாம் விருத்தசேதனம் பெறுவதற்கு முன் இருந்த நிலையைக் குறிக்கும் சொற்றொடரை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: நம் தந்தையாகிய ஆபிரகாம் ... கொண்டிருந்த
  rationale: கிரேக்க உரையின் உரிமை வேற்றுமையை தமிழில் இயல்பாக விரித்து, ‘நம் தந்தை’ என்ற சமூக அடையாளத்தையும் காக்கிறது.
theological_decisions:
- issue: ஆபிரகாம் விருத்தசேதனம் செய்யப்பட்ட அனைவருக்கும் நிபந்தனையின்றித் தந்தையா, அல்லது அவருடைய விசுவாசத்தைப் பின்பற்றுகிறவர்களுக்கா?
  choice: விருத்தசேதனம் மட்டுமே உடையவர்களாக இல்லாமல், ஆபிரகாமின் விசுவாச அடிச்சுவடுகளில் நடக்கும் விருத்தசேதனம் செய்யப்பட்டவர்களுக்கே இங்கு அவரது தந்தைநிலை கூறப்படுகிறது.
  alternative: விசுவாசத்தைப் பின்பற்றுகிறார்களா இல்லையா என்பதைப் பொருட்படுத்தாமல், விருத்தசேதனம் செய்யப்பட்ட அனைவருக்கும் ஆபிரகாம் தந்தை.
  rationale: οὐκ ... μόνον ἀλλὰ καί என்ற அமைப்பும் στοιχοῦσιν என்ற பங்கேற்பு வடிவமும் விருத்தசேதனம் செய்யப்பட்ட குழுவைத் தகுதிப்படுத்துகின்றன. மொழிபெயர்ப்பு இதை விளக்கவுரையாக மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘விருத்தசேதனம்’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல் என்பதால் வைக்கப்பட்டுள்ளது. கிரேக்கத்தில் நீளமான தொடரை தமிழில் தெளிவாக்கக் கோடு பயன்படுத்தப்பட்டுள்ளது; புதிய கருத்து சேர்க்கப்படவில்லை.
