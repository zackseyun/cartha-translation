revisions:
- from: மேலும், விருத்தசேதனம் செய்யப்பட்டவர்களுக்கு அவர் தந்தையாக இருக்கிறார்—விருத்தசேதனம் செய்யப்பட்டவர்கள் என்பதால் மட்டும் அல்ல, நம் தந்தையாகிய ஆபிரகாம் விருத்தசேதனம் செய்யப்படாத நிலையில் கொண்டிருந்த விசுவாசத்தின் அடிச்சுவடுகளில் நடப்பவர்களுக்கும் தந்தையாக இருக்கிறார்.
  to: மேலும், வெறுமனே விருத்தசேதனம் செய்யப்பட்டவர்களாக இருப்பவர்கள் மட்டுமல்லாமல், நம் தந்தையாகிய ஆபிரகாம் விருத்தசேதனம் செய்யப்படாத நிலையில் கொண்டிருந்த விசுவாசத்தின் அடிச்சுவடுகளில் நடப்பவர்களாகவும் இருப்போருக்கு அவர் விருத்தசேதனம் செய்யப்பட்டவர்களின் தந்தையாக இருக்கிறார்.
  rationale: 'The revision keeps Abraham as father in relation to the circumcised while attaching both coordinated qualifications to the same people: they are not merely circumcised, but also follow the footsteps of Abraham’s faith. It retains the temporal/state sense of ἐν ἀκροβυστίᾳ (“விருத்தசேதனம் செய்யப்படாத நிலையில்”) and the metaphor of στοιχοῦσιν τοῖς ἴχνεσιν (“அடிச்சுவடுகளில் நடப்பவர்கள்”). No footnote is required because the rendering does not introduce an unresolved textual or lexical ambiguity.'
