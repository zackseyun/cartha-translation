- from: ஆனால் செயல்கள் செய்யாமல், மாறாக இறைப்பற்று இல்லாதவனை நீதிமானாக்குகிறவரை[b] நம்புகிறவனுக்கோ[a], அவனுடைய நம்பிக்கை நீதியாக[d] கணக்கிடப்படுகிறது[c].
