source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: ta
  text: ஆனால் செயல்கள் செய்யாமல், மாறாக இறைப்பற்று இல்லாதவனை நீதிமான் என்று அறிவிக்கிறவரை[b] நம்புகிறவனுக்கோ[a], அவனுடைய நம்பிக்கை நீதியாக[d] கணக்கிடப்படுகிறது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நம்பிக்கை வைக்கிறவனுக்கோ” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீதிமானாக்குகிறவரை.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவனுடைய கணக்கில் வைக்கப்படுகிறது” அல்லது “அவனுக்குரியதாகக் கருதப்படுகிறது.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “நீதிநிலையாக.” இச்சொல் சில சூழல்களில் “நியாயம்” என்ற கருத்தையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: செயல்கள் செய்யாமல் ... நம்புகிறவனுக்கோ
  rationale: கிரேக்க இடைச்சொல் வடிவத்தின் ‘செயல்படாதவன்’—‘நம்புகிறவன்’ என்ற முரண்பாட்டைப் பேணுகிறது; ‘வேலை செய்யாதவன்’ என்று மொழிபெயர்த்து சோம்பேறித்தனம் அல்லது ஊதிய வேலை பற்றிய தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: மாறாக ... நம்புகிறவனுக்கோ
  rationale: πιστεύω என்பதன் நம்புதல் என்ற அடிப்படைப் பொருளையும், ἐπί கட்டமைப்பில் உள்ள ஒருவர்மீது சார்ந்த நம்பிக்கையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν δικαιοῦντα
  choice: நீதிமானாக்குகிறவரை
  rationale: பவுலின் வாதத்தில் மையமான δικαιόω சொல்லின் இறையியல் வலிமையையும் δικαιοσύνη உடனான சொற்பொருள் தொடர்பையும் பேணுகிறது; அதன் நீதித்தீர்ப்பு சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὸν ἀσεβῆ
  choice: இறைப்பற்று இல்லாதவனை
  rationale: ἀσεβής குறிக்கும் கடவுள்மீதான பயபக்தி அல்லது பற்றின்மையை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது; ‘தீயவன்’ என்பது பொதுவான ஒழுக்கக்கேட்டை அளவுக்கு மீறி முன்னிறுத்தும்.
- source_word: λογίζεται
  choice: கணக்கிடப்படுகிறது
  rationale: λογίζομαι சொல்லில் உள்ள கணக்கில் கொள்ளுதல் அல்லது ஒருவருக்குரியதாகக் கருதுதல் என்ற உருவகத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: ἡ πίστις αὐτοῦ
  choice: அவனுடைய நம்பிக்கை
  rationale: முந்தைய πιστεύοντι உடனான சொல் தொடர்பைப் பேணி, இங்கு செயலைவிட நம்புதலே எதிர்மறையாக நிறுத்தப்படுவதை வெளிப்படுத்துகிறது; ‘உண்மைத்தன்மை’ என்பது இச்சூழலில் குறைவாகச் சாத்தியமானது.
- source_word: εἰς δικαιοσύνην
  choice: நீதியாக
  rationale: λογίζεται ... εἰς என்ற சொற்றொடரின் ‘ஒன்றாகக் கணக்கிடுதல்’ என்ற முடிவுப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: 'δικαιοῦντα என்பதன் பொருள்: நீதிமானாக்குதல் அல்லது நீதிமான் என்று அறிவித்தல்'
  choice: நீதிமானாக்குகிறவர்
  alternative: நீதிமான் என்று அறிவிக்கிறவர்
  rationale: முதன்மை உரை கிரேக்க வினையின் பரந்த இறையியல் வலிமையையும் δικαιοσύνη உடனான தொடர்பையும் தக்கவைக்கிறது. அது உள்ளார்ந்த மாற்றமா அல்லது நீதித்தீர்ப்பு சார்ந்த அறிவிப்பா என்பதைத் தனியாக முடிவுசெய்யாமல், மாற்று வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: πίστις/πιστεύω என்பவற்றை நம்பிக்கை/நம்புதல் அல்லது உண்மைத்தன்மை என்று மொழிபெயர்த்தல்
  choice: நம்பிக்கை / நம்புகிறவன்
  alternative: நம்பிக்கை வைத்தல்; உண்மைத்தன்மை
  rationale: செயல்கள் செய்யாதிருத்தலுக்கும் நம்புவதற்கும் இடையிலான நேரடி முரண்பாடு இங்கு நம்பிக்கை/நம்புதல் என்ற பொருளை ஆதரிக்கிறது. ‘உண்மைத்தன்மை’ இச்சூழலில் சாத்தியம் குறைந்ததால் முதன்மை உரையிலோ அடிக்குறிப்பிலோ முன்னிறுத்தப்படவில்லை.
- issue: δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நீதிநிலை
  rationale: ‘நீதி’ என்பது சுருக்கமான, இயல்பான தமிழ்; அது பவுலின் சொல்லில் உள்ள நீதியான நிலை மற்றும் நீதி ஆகிய பொருள் பரப்பை மிகையாகச் சுருக்காது. தனிநபரின் நீதிநிலை என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேலை செய்யாமல்’ என்பது ஊதிய வேலை அல்லது சோம்பேறித்தனத்தைத் தவறாகக் குறிக்கக்கூடும் என்பதால் ‘செயல்கள் செய்யாமல்’ எனத் தேர்ந்தெடுக்கப்பட்டது. ‘இறைப்பற்று இல்லாதவன்’ என்பது பழமையான அல்லது குறிப்பிட்ட சமய மரபுடன் நெருக்கமாக ஒலிக்கக்கூடிய ‘அபக்தன்’ போன்ற சொற்களைத் தவிர்க்கிறது.
