  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: ta
  text: வேலை செய்கிறவருக்குக் கூலி கொடையாகக் கணக்கிடப்படுவதில்லை; அது செலுத்த வேண்டிய கடனாகவே கணக்கிடப்படுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: வேலை செய்கிறவருக்கு
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்பு வடிவம், பொதுவாக வேலை செய்கிற ஒருவரைக் குறிக்கிறது. இந்தத் தமிழாக்கம் அந்தப் பொதுவான பொருளை இயல்பாகத் தருகிறது.
- source_word: μισθὸς
  choice: கூலி
  rationale: வேலைக்கும் அதற்குரிய ஊதியத்திற்கும் இடையிலான சூழலில், சம்பாதிக்கப்பட்ட ஈட்டைத் துல்லியமாகக் குறிக்கிறது.
- source_word: λογίζεται
  choice: கணக்கிடப்படுகிறது
  rationale: கணக்கில் சேர்த்தல் அல்லது ஒருவருக்குரியதாகக் கணித்தல் என்ற பவுலின் கணக்கியல் உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: κατὰ χάριν
  choice: அருளாக
  rationale: சம்பாதித்த கூலிக்கு எதிராக, தகுதியால் பெறாத கொடை அல்லது தயவு என்ற நிலையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; χάρις என்பதன் ‘அருள்’ சார்ந்த இறையியல் ஒலிப்பையும் காக்கிறது.
- source_word: ὀφείλημα
  choice: செலுத்த வேண்டிய கடன்
  rationale: ஒருவருக்குக் கொடுக்கப்பட வேண்டியதை அல்லது செலுத்தும் கடப்பாட்டைத் தெளிவாக்கி, அருளுக்கும் சம்பாதித்த கூலிக்கும் இடையிலான எதிர்மறையைப் பாதுகாக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்திலிருந்து வரும் ஒப்பீட்டு முரணைத் தமிழில் வெளிப்படையாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: வேலைக்கான கூலியின் சூழலில் χάρις என்பதன் மொழிபெயர்ப்பு
  choice: அருளாக
  alternative: அருளின்படி; கொடையாக
  rationale: ‘அருள்’ என்ற மூலச்சொல்லின் இறையியல் பரப்பை வைத்துக்கொண்டே, கூலி அருளின் அடிப்படையில் வழங்கப்படுவது அல்ல என்ற வசனத்தின் முரணைத் தெளிவாக்குகிறது. ‘கொடையாக’ என்பது சூழலை நன்றாக விளக்கினாலும் மூலச்சொல்லின் முக்கிய ஒலிப்பை ஓரளவு குறைக்கலாம்.
- issue: ὀφείλημα என்பதில் கடன் மற்றும் கடப்பாடு இடையிலான நுட்பம்
  choice: செலுத்த வேண்டிய கடன்
  alternative: கடப்பாடு; கொடுக்க வேண்டியது
  rationale: முதலாளி சம்பாதித்த கூலியைத் தர வேண்டிய நிலையைச் சுட்டுகிறது; அதே நேரத்தில் ‘கடன்’ என்ற மூல உருவகத்தையும் மறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்கு எளிதாகப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கணக்கிடப்படுகிறது’ என்ற சொல் மூலத்தின் கணக்கியல் உருவகத்தைத் தக்கவைக்கிறது; ‘வேலை செய்கிறவர்’ என்பது குறிப்பிட்ட தொழிலாளியை மட்டும் அல்லாமல் பொதுவாக உழைப்பவரைக் குறிக்கிறது.
