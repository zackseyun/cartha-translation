  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: ta
  text: ஆனால் நமக்காகவும்—இறந்தோரிலிருந்து நம் ஆண்டவராகிய இயேசுவை உயிர்த்தெழச் செய்தவர்மேல் நம்பிக்கை வைக்கும்[b] நமக்கு அது வரவாகக் கணக்கிடப்படும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எண்ணப்படும்” அல்லது “கணக்கில் எடுத்துக்கொள்ளப்படும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நம்புகிற.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ δι’ ἡμᾶς
  choice: நமக்காகவும்
  rationale: முந்தைய வசனத்திலுள்ள எதிர்மறை–இணைப்பு தொடரை இயல்பான தமிழில் தொடர்கிறது; διά + வேற்றுமை இங்கு ‘நம்மை மனதில் கொண்டு / நமக்காக’ என்ற பொருளைத் தருகிறது.
- source_word: μέλλει λογίζεσθαι
  choice: அது வரவாகக் கணக்கிடப்படும்
  rationale: μέλλω தரும் எதிர்கால நோக்கையும், λογίζομαι தரும் கணக்குப்பதிவு உருவகத்தையும் காக்கிறது. கிரேக்கத்தில் விடப்பட்டுள்ள செயப்படுபொருளைத் தமிழில் ‘அது’ என்று மட்டும் குறிப்பதால் முந்தைய சூழலைத் தாண்டி விளக்கவில்லை.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: நம்பிக்கை வைக்கிற நமக்கு
  rationale: ἐπί உடன் வரும் πιστεύω, ஒருவரை நோக்கி வைக்கப்படும் நம்பிக்கை அல்லது சார்பை உணர்த்துகிறது; ‘நம்பிக்கை வைக்கிற’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: τὸν ἐγείραντα
  choice: உயிர்த்தெழச் செய்தவர்மேல்
  rationale: கடவுளை அவரது செயலால் சுட்டும் பெயர்ச்சொல் தன்மையுள்ள பங்கேற்பு வடிவத்தைப் பாதுகாக்கிறது.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: நம் ஆண்டவராகிய இயேசுவை
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என்ற மரியாதையான வழக்குச் சொல்லைப் பயன்படுத்தி, இயேசுவுடனான இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: உயிர்த்தெழுதல் தொடர்பான கிரேக்கச் சொற்றொடரின் ‘இறந்தவர்களிடையிலிருந்து’ என்ற பன்மை உணர்வைச் சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: λογίζεσθαι என்பதன் வெளிப்படையாகச் சொல்லப்படாத செயப்படுபொருள்
  choice: ‘அது’ என்று குறிப்பிடப்பட்டது
  alternative: ‘நீதி’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: முந்தைய சூழலில் நீதியே கருத்தில் இருந்தாலும், இவ்வசனத்தின் கிரேக்கம் அதை மீண்டும் பெயரிட்டுச் சொல்லவில்லை. ‘அது’ என்பது அந்த விடுபாட்டைப் பாதுகாத்து, தமிழில் தேவையான இலக்கணத் தெளிவைத் தருகிறது.
- issue: πιστεύω ἐπί என்பதில் நம்புதல் மற்றும் சார்ந்திருத்தல் ஆகிய நுணுக்கங்கள்
  choice: ‘அவர்மேல் நம்பிக்கை வைக்கிற’
  alternative: ‘அவரை விசுவாசிக்கிற’
  rationale: குறிப்பிட்ட ஒருவர்மேல் செலுத்தப்படும் நம்பிக்கையை வெளிப்படுத்துகிறது; வெறும் ஒரு கருத்தை உண்மையென ஏற்றுக்கொள்வதாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை. வசனம் முந்தைய வாக்கியத்தைத் தொடர்வதால் தொடக்கத்தில் உள்ள இணைப்புத் தன்மை கோடால் காட்டப்பட்டுள்ளது. [a] கணக்குப்பதிவு உருவகத்திற்குப் பின்னும், [b] நம்பிக்கைச் சொல்லிற்குப் பின்னும் பொருள் சார்ந்த இடத்தில் வைக்கப்பட்டுள்ளன.
