source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: ta
  text: ஏனெனில், வேதவாக்கியம் என்ன சொல்கிறது? “ஆபிரகாமோ கடவுளை நம்பினார்; அது அவருக்கு நீதியாகக்[b] கணக்கிடப்பட்டது[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது அவருக்கு நீதியாக எண்ணப்பட்டது” அல்லது “அது அவருடைய கணக்கில் நீதியாக வரவு வைக்கப்பட்டது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நியாயமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: வேதவாக்கியம்
  rationale: இங்கு ἡ γραφή என்பது பொதுவான ஓர் எழுத்தைக் குறிக்காமல், அதிகாரமுள்ள புனித வேதப்பகுதியைக் குறிக்கிறது. ‘வேதவாக்கியம்’ என்பது ஒருமையையும் மேற்கோளிடப்பட்ட வசனத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἐπίστευσεν
  choice: நம்பினார்
  rationale: πιστεύω என்பதன் இறந்தகால வினையை நேரடியாகவும் இயல்பாகவும் தருகிறது; ‘விசுவாசம் வைத்தார்’ போன்ற விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளை
  rationale: πιστεύω உடன் வரும் வேற்றுமை உருபு, கடவுள் கூறியதை ஆபிரகாம் நம்பினார் என்ற பொருளைச் சுமக்கிறது. ‘கடவுளை நம்பினார்’ என்பது தமிழில் இயல்பாக இருந்து, நம்புதல் மற்றும் சார்ந்திருத்தல் ஆகிய பொருள் நுணுக்கங்களை தேவையின்றி பிரித்துவிடாமல் காக்கிறது.
- source_word: ἐλογίσθη
  choice: கணக்கிடப்பட்டது
  rationale: இச்சொல் செயப்பாட்டு வடிவத்தைப் பாதுகாப்பதோடு, ஒன்றை ஒருவருடையதாகக் கணக்கில் கொள்ளுதல் என்ற λογίζομαι-வின் பொருளையும் தெளிவாகத் தருகிறது. ‘எண்ணப்பட்டது’ என்பதைக் காட்டிலும் இச்சூழலில் இது இயல்பானது.
- source_word: εἰς δικαιοσύνην
  choice: நீதியாக
  rationale: பவுலின் இச்சூழலில் δικαιοσύνη குறிக்கும் நேர்மை/சரியான நிலை மற்றும் இறைத் தீர்ப்பு சார்ந்த பொருள் பரப்பை ‘நீதி’ தக்கவைக்கிறது. εἰς என்பதன் இங்குள்ள முடிவுநிலை அல்லது மதிப்பீட்டு உறவை ‘நீதியாக’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் நீதிப்படுத்துதல் சார்ந்த சூழலில் δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதியாக
  alternative: நியாயமாக
  rationale: ‘நீதி’ என்பது தமிழில் நெறிசார் நேர்மையையும் கடவுளுக்கு முன்பான சரியான நிலையையும் உள்ளடக்கக்கூடியது; எனவே இங்கு உள்ள இறையியல் அழுத்தத்தை ஒரு குறிப்பிட்ட விளக்கத்துக்குள் அடைத்துவிடாது. ‘நியாயம்’ என்பது சட்டநீதி என்ற நுணுக்கத்தைத் தெளிவாக்கக்கூடிய செல்லத்தக்க மாற்றாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: ἐλογίσθη என்பதில் கணக்கிடப்பட்டதன் அடிப்படை அல்லது செய்பவர்
  choice: செயப்பாட்டு வடிவத்தையும் மறைமுக எழுவாயையும் அப்படியே காத்தல்
  alternative: ‘கடவுள் அதை அவருக்கு நீதியாகக் கணக்கிட்டார்’ என்று செய்பவரை வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க உரை செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. கடவுள் செய்பவர் என்பது சூழலிலிருந்து புரிந்தாலும், அதை முதன்மை உரையில் சேர்க்காமல் இருப்பது மூலத்தின் வடிவத்தையும் இறையியல் நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவான வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கேள்வியில் γάρ என்பதற்கு ‘ஏனெனில்’ தரப்பட்டுள்ளது; மேற்கோளின் தொடக்கத்திலுள்ள δέ-யின் மெலிந்த எதிர்நிலை/தலைப்புமாற்ற நுணுக்கம் ‘ஆபிரகாமோ’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
