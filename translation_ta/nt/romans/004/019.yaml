source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: ta
  text: விசுவாசத்தில் பலவீனமடையாமல், தமது உடல் மரித்துப்போனதுபோல் இருந்ததையும்[a]—அவர் ஏறக்குறைய நூறு வயதுடையவராயிருந்தார்—சாராளின் கருப்பை உயிரற்றிருந்த நிலையையும்[b] அவர் கருத்தில் கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறொரு மூலப்பிரதி மரபின்படி: “மரித்துப்போனதுபோல் இருந்த தமது உடலை அவர் கருத்தில் கொள்ளவில்லை.”'
    reason: textual_variant
  - marker: b
    text: “உயிரற்றிருந்த நிலை” என்பதற்கு மாற்றாக “மலட்டுத்தன்மை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: பலவீனமடையாமல்
  rationale: எதிர்மறைப் பொருளுடைய இறந்தகால வினையெச்சத்தை இயல்பான தமிழில் வெளிப்படுத்தி, ஆபிரகாமின் விசுவாசம் வலுவிழக்கவில்லை என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: πίστει
  choice: விசுவாசத்தில்
  rationale: இங்கு தேவனுடைய வாக்குறுதியை நம்பிய ஆபிரகாமின் விசுவாசத்தைக் குறிக்கிறது; கிரேக்க வேற்றுமைத் தொடர்பும் தமிழில் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: κατενόησεν
  choice: கருத்தில் கொண்டார்
  rationale: உண்மை நிலையை உணர்ந்து கவனத்தில் எடுத்தார் என்ற திட்டமிட்ட மனச்செயலைக் காட்டுகிறது; வெறுமனே பார்த்தார் என்ற பொருளைவிட சூழலுக்கு ஏற்றது.
- source_word: νενεκρωμένον
  choice: செத்ததுபோலிருந்த
  rationale: ஆபிரகாமின் உடல் சொல்லர்த்தமாக இறந்திருந்தது என்று கூறாமல், பிள்ளைபெறும் ஆற்றலைப் பொறுத்தவரை இறந்ததற்கு ஒப்பான நிலையில் இருந்தது என்ற வலுவான மரண உருவகத்தைத் தக்கவைக்கிறது.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: ஏறக்குறைய நூறு வயதாகியிருந்த அவர்
  rationale: πού என்பதன் தோராயப் பொருளை ‘ஏறக்குறைய’ என வெளிப்படுத்தி, கிரேக்க வினையெச்சத் தொடரை இயல்பான தமிழாக்கமாக வழங்குகிறது.
- source_word: νέκρωσιν
  choice: உயிரற்ற நிலை
  rationale: முந்தைய மரணச் சொல்லோடு உள்ள தொடர்பைப் பாதுகாக்கிறது; ‘மலட்டுத்தன்மை’ என்று மட்டும் மொழிபெயர்த்து பவுலின் இணையான மரண உருவகத்தை மங்கச் செய்யவில்லை.
- source_word: μήτρας Σάρρας
  choice: சாராளின் கருப்பை
  rationale: கிரேக்கத்தின் தெளிவான உடற்கூறு உருவகத்தை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: ஆபிரகாமின் உடலையும் சாராளின் கருப்பையையும் குறித்த மரண உருவகத்தை மென்மையாக்கலாமா
  choice: ‘செத்ததுபோலிருந்த’ என்றும் ‘உயிரற்ற நிலை’ என்றும் மரண உருவகத்தை இரு கூறுகளிலும் தக்கவைத்தல்
  alternative: ஆபிரகாமின் உடல் பிள்ளைபெறும் ஆற்றலற்றிருந்தது; சாராளின் கருப்பை மலடாக இருந்தது
  rationale: தேவனுடைய வாக்குறுதி மனிதரீதியாகச் சாத்தியமற்றதாகத் தோன்றியதை வலியுறுத்த பவுல் தொடர்புடைய இரு மரணச் சொற்களைப் பயன்படுத்துகிறார். விளக்கமான மருத்துவச் சொற்களால் அந்த இறையியல் அழுத்தத்தைத் தீர்த்துவிடாமல் பாதுகாப்பது பொருத்தமானது.
- issue: ஆபிரகாம் தமது உடல் நிலையைக் கருத்தில் கொண்டாரா இல்லையா என்பதிலுள்ள மூலப்பிரதி வேறுபாடு
  choice: SBLGNT முதன்மை உரைப்படி அவர் அதை ‘கருத்தில் கொண்டார்’ என்று முதன்மை உரையில் வழங்குதல்
  alternative: அவர் தமது உடலைக் கருத்தில் கொள்ளவில்லை
  rationale: கொடுக்கப்பட்ட விமர்சனப் பதிப்பின் உரையை முதன்மையாகப் பின்பற்றி, உண்மையான மூலப்பிரதி வேறுபாட்டை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘செத்ததுபோலிருந்த’ என்பது வலுவான கிரேக்க மரண உருவகத்தை இயல்பாகத் தருகிறது; ‘உயிரற்ற நிலை’ அதே உருவகத்தை சாராளின் கருப்பைக்கும் தொடர்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் தொடர்புடைய இடங்களில் இடம்பெற்றுள்ளன.
