  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: ta
  text: ஏனெனில், ஆபிரகாம் செயல்களால் நீதிமானாக்கப்பட்டிருந்தால்,[a] அவர் பெருமைபாராட்டுவதற்கு ஆதாரம் உண்டு;[b] ஆனால் கடவுளுக்கு முன்பாக அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நீதிமான் என்று அறிவிக்கப்பட்டிருந்தால்.”'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “அவர் பெருமைபாராட்ட ஒன்று உண்டு.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ஏனெனில் ... இருந்தால்
  rationale: γάρ முந்தைய கருத்துடன் காரணவாதத் தொடர்பை ஏற்படுத்துவதால் ‘ஏனெனில்’ என்றும், εἰ நிபந்தனையைத் திறந்தவாறே வைப்பதால் ‘இருந்தால்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: Ἀβραὰμ
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: ἐξ ἔργων
  choice: செயல்களால்
  rationale: ἐκ இங்கு நீதிமானாக்கப்படுவதற்கான அடிப்படை அல்லது காரணத்தைக் குறிக்கிறது; ‘செயல்களால்’ என்பது சுருக்கமாகவும் இயல்பாகவும் அதைப் பதிவு செய்கிறது.
- source_word: ἐδικαιώθη
  choice: நீதிமானாக்கப்பட்டிருந்தால்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும், நீதிமன்றத் தீர்ப்பை நினைவூட்டும் δικαιόω என்பதன் பவுலியச் சொல்லாட்சியையும் காக்கிறது; அறிவிப்பு சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔχει καύχημα
  choice: அவர் பெருமைபாராட்டுவதற்கு ஆதாரம் உண்டு
  rationale: καύχημα என்பது ‘பெருமை’ மட்டுமல்லாமல் பெருமைபாராட்டுவதற்கான காரணம் அல்லது ஆதாரம் என்ற பொருளையும் தரக்கூடும்; தமிழில் இயல்பாகவும் வாதத்தின் நோக்கிற்கு ஏற்றவாறும் இவ்வாறு தரப்பட்டது.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: ஆனால் கடவுளுக்கு முன்பாக அல்ல
  rationale: πρὸς θεόν என்பதன் தெய்வீக மதிப்பீடு சார்ந்த உறவைத் தீர்மானித்து விரிவாக்காமல், ‘கடவுளுக்கு முன்பாக’ என நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: நிபந்தனை உண்மையான சாத்தியமா அல்லது வெறும் கருதுகோளா
  choice: ‘ஆபிரகாம் ... நீதிமானாக்கப்பட்டிருந்தால்’ என்று நேரடியான நிபந்தனையாக வழங்கப்பட்டது.
  alternative: ‘ஆபிரகாம் உண்மையிலேயே செயல்களால் நீதிமானாக்கப்பட்டிருந்தால்’
  rationale: மூலத்தின் εἰ நிபந்தனையை அதன் வாதத் திறனுடன் காக்கிறது; பவுலின் அடுத்தடுத்த முடிவை இவ்வசனத்தின் சொற்களுக்குள் முன்கூட்டியே புகுத்தவில்லை.
- issue: καύχημα என்பதன் பொருள்
  choice: ‘பெருமைபாராட்டுவதற்கு ஆதாரம்’
  alternative: ‘பெருமைபாராட்ட ஒன்று’
  rationale: இது மனிதர்முன் பெருமைக்கான ஆதாரத்தையா அல்லது பெருமையின் பொருளையா குறிக்கிறது என்ற சிறிய பொருள் நிழலை முற்றிலும் ஒழிக்காமல், சூழலுக்கு இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் பவுலின் சுருக்கமான வாதநடையையும் வேதாகமத்திற்குரிய கண்ணியத்தையும் காக்கும் பதிவு. ‘நீதிமானாக்கப்பட்ட’ என்ற நிலைபெற்ற இறையியல் சொல்லுக்கு விளக்கமான மாற்று அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
