id: ROM.4.20
reference: Romans 4:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: ta
  text: ஆனால், கடவுளுடைய வாக்குறுதியைக் குறித்து அவர் அவநம்பிக்கையில் தடுமாறவில்லை[a]. மாறாக, விசுவாசத்தில் பலப்படுத்தப்பட்டு[b], கடவுளுக்கு மகிமை செலுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவநம்பிக்கையால் ஐயப்படவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விசுவாசத்தால் பலப்படுத்தப்பட்டு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: ஆனால், கடவுளுடைய வாக்குறுதியைக் குறித்து
  rationale: εἰς என்பது இங்கு திசையைக் குறிக்காமல் ‘குறித்து’ என்ற தொடர்புப் பொருளைத் தருகிறது; δέ முந்தைய கருத்துடன் மென்மையான மாறுபாட்டைக் காட்டுகிறது. ἐπαγγελία என்பதற்கு இயல்பானதும் துல்லியமானதும் ‘வாக்குறுதி’.
- source_word: οὐ διεκρίθη
  choice: தடுமாறவில்லை
  rationale: διακρίνω இச்சூழலில் வெறும் அறிவுசார் சந்தேகத்தைவிட உள்ளார்ந்த இருமனம் அல்லது நிலைகுலைதலைக் குறிக்கிறது; ‘தடுமாறவில்லை’ அந்த விரிந்த பொருளையும் விசுவாசத்துடனான மாறுபாட்டையும் காக்கிறது.
- source_word: τῇ ἀπιστίᾳ
  choice: அவநம்பிக்கையில்
  rationale: இத்தொடரின் வேற்றுமை உருபை நிலை அல்லது செயல்சூழலாகப் புரிந்து ‘அவநம்பிக்கையில்’ என மொழிபெயர்த்தது; பின்னுள்ள ‘விசுவாசத்தில்’ என்பதுடனான இணைமாறுபாடும் இதனால் காக்கப்படுகிறது.
- source_word: ἀλλὰ ἐνεδυναμώθη
  choice: மாறாக, ... பலப்படுத்தப்பட்டு
  rationale: ἀλλά வலுவான மாறுபாட்டைத் தருவதால் ‘மாறாக’ எனப்பட்டது. வினையின் இறைச்செயப்பாட்டு வடிவத்தை மறைக்காமல் ‘பலப்படுத்தப்பட்டு’ என வழங்கப்பட்டது.
- source_word: τῇ πίστει
  choice: விசுவாசத்தில்
  rationale: πίστις என்பதற்கு இச்சூழலில் ‘விசுவாசம்’ பொருத்தமானது. ‘அவநம்பிக்கையில்’ என்பதற்கு எதிரிணையாக அமையும் வகையில் வேற்றுமை உருபு ‘விசுவாசத்தில்’ எனக் காக்கப்பட்டது.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: கடவுளுக்கு மகிமை செலுத்தினார்
  rationale: இறந்தகாலப் பெயரெச்சம் முதன்மை வினையோடு இணைந்த செயலைக் குறிக்கிறது. தமிழில் இயல்பாக வாசிக்க ‘கடவுளுக்கு மகிமை செலுத்தினார்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: ஆபிரகாமின் பதில் வெறும் அறிவுசார் சந்தேகமின்மையா, அல்லது விரிந்த உள்ளார்ந்த நிலைகுலையாமையா?
  choice: அவநம்பிக்கையில் தடுமாறவில்லை
  alternative: அவநம்பிக்கையால் ஐயப்படவில்லை
  rationale: διακρίνω என்பதன் சூழல்சார் பொருள் இருமனம் அல்லது நிலைகுலைதலையும் உள்ளடக்குகிறது. ‘தடுமாறவில்லை’ என்பது இதை வெறும் அறிவுசார் ஐயமாகக் குறுக்காமல், விசுவாசத்தில் பலப்படுத்தப்படுதலுடனான இறையியல் பதற்றத்தைக் காக்கிறது.
- issue: விசுவாசம் பலப்படுத்தப்பட்ட நிலையின் களமா அல்லது அதற்கான கருவியா?
  choice: விசுவாசத்தில் பலப்படுத்தப்பட்டு
  alternative: விசுவாசத்தால் பலப்படுத்தப்பட்டு
  rationale: τῇ πίστει என்ற வேற்றுமை உருபு இருவகையாகப் புரிந்துகொள்ளப்படலாம். முதன்மை உரை ‘அவநம்பிக்கையில்’ என்பதுடனான இணைமாறுபாட்டை முன்னிறுத்துகிறது; கருவிப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வாக்குறுதி’, ‘தடுமாறவில்லை’, ‘பலப்படுத்தப்பட்டு’ ஆகிய சொற்கள் மூலத்தின் கருத்தோட்டத்தையும் செயப்பாட்டு வடிவத்தையும் காக்கின்றன; மாற்றாகப் புரிந்துகொள்ளக்கூடிய வேற்றுமை உருபுப் பொருள்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
