theological_decisions:
- issue: τῷ ἐκ πίστεως Ἀβραάμ என்பது ஆபிரகாமின் விசுவாசத்தைப் பகிர்கிறவர்களைக் குறிக்கிறதா, அல்லது சொற்சொல்லாக ‘ஆபிரகாமின் விசுவாசத்திலிருந்து வருகிறவர்’ எனத் தரப்பட வேண்டுமா?
  choice: ஆபிரகாமின் விசுவாசத்தைச் சார்ந்தவர்கள்
  alternative: ஆபிரகாமின் விசுவாசத்திலிருந்து வருகிறவர்
  rationale: இலக்கண ஒருமை கூட்டாகப் பயன்படுத்தப்பட்டுள்ளது. தேர்ந்த மொழிபெயர்ப்பு அந்தக் கூட்டுப்பொருளைத் தெளிவாக்குகிறது; ஆனால் ‘பகிர்ந்துகொள்கிறவர்கள்’ என்று கூடுதல் விளக்கத்தைச் சேர்க்காமல் கிரேக்கத்தின் சுருக்கத்தையும் ஓரளவு பாதுகாக்கிறது.
- issue: ἐκ πίστεως என்பதில் πίστις-ஐ ‘விசுவாசம்’, ‘நம்பிக்கை’, அல்லது ‘உண்மைத்தன்மை’ என மொழிபெயர்ப்பது
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: ரோமர் 4-இல் ஆபிரகாம் தேவனையும் அவருடைய வாக்குத்தத்தத்தையும் நம்புவதே மையமாக இருப்பதால் ‘விசுவாசம்’ பொருத்தமானது. ‘நம்பிக்கை’ சாத்தியம்; ‘உண்மைத்தன்மை’ இச்சூழலில் குறைவாகச் சாத்தியமானது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சட்டம்’, ‘கிருபை’, ‘வாக்குத்தத்தம்’, ‘விசுவாசம்’ ஆகியவை ரோமர் நிருபத்தின் கருத்துத் தொடர்ச்சியைப் பாதுகாக்கின்றன. மூலவாக்கியம் அடுத்த வசனத்திற்குத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
