  rationale: பவுலின் உடன்படிக்கைச் சூழலுக்கு ஏற்ற, தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் அறியப்பட்ட சொல்.
- source_word: σπέρματι
  choice: சந்ததியினர்
  rationale: சொல்லின் நேரடிப் பொருள் ‘விதை’ என்றாலும், இங்கு ஆபிரகாமின் வழிவந்த மக்களைக் கூட்டாகக் குறிக்கிறது; ‘சந்ததியினர்’ நவீனத் தமிழில் இயல்பாக உள்ளது.
