source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: ta
  text: அவர் விருத்தசேதனத்தின் அடையாளத்தைப் பெற்றார்; அது, அவர் விருத்தசேதனம் செய்யப்படாத நிலையில் கொண்டிருந்த விசுவாசத்தின் நீதியின்[a] முத்திரையாக இருந்தது. இவ்வாறு, விருத்தசேதனம் செய்யப்படாத நிலையிலேயே விசுவாசிக்கிற அனைவருக்கும் அவர் தந்தையாக இருப்பதற்கும்[b], அவர்களுக்கும் நீதி கணக்கிடப்படுவதற்கும்[c] இது அமைந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீதி” என்பதற்கு “நியாயம்” என்றும் மொழிபெயர்க்கலாம்; வசனத்தின் பிற்பகுதியிலும் இதுவே பொருந்தும்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “விருத்தசேதனமின்மையில்”; அதாவது, விருத்தசேதனம் செய்யப்படாத நிலையில்.'
    reason: lexical_alternative
  - marker: c
    text: “கணக்கிடப்படுவதற்கு” என்பதற்கு “வரவு வைக்கப்படுவதற்கு” அல்லது “எண்ணப்படுவதற்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: உடன்படிக்கைச் சூழலில் வெளிப்படையாகக் காணப்படும் குறியீடு என்ற பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: περιτομή
  choice: விருத்தசேதனம்
  rationale: பவுலின் வாதத்தில் குறிப்பிடப்படும் சமயச் சடங்கிற்கான துல்லியமான, வழக்கிலுள்ள தமிழ்ச் சொல்.
- source_word: σφραγίς
  choice: முத்திரை
  rationale: உறுதிப்படுத்துதல் அல்லது சான்றளித்தல் என்ற கருத்தை விளக்கவுரையாக மாற்றாமல், மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: δικαιοσύνη
  choice: நீதி
  rationale: பவுலின் பயன்பாட்டிலுள்ள நீதியான நிலை மற்றும் சரியான உறவு ஆகிய பொருள் பரப்பைச் சுருக்காமல் வழங்குகிறது; ‘நியாயம்’ என்பது அடிக்குறிப்பில் மாற்றாகக் கொடுக்கப்படுகிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இங்கு நம்புதல் என்ற மையப் பொருளைத் தெளிவாகக் காட்டுகிறது; ‘விசுவாசத்தின் நீதி’ என்ற தொடர்பை விளக்கவுரையால் மிகையாகத் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: விருத்தசேதனம் செய்யப்படாத நிலையில்
  rationale: ஆபிரகாம் விசுவாசம் கொண்டிருந்த காலநிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: விசுவாசிக்கிற அனைவருக்கும் தந்தை
  rationale: பவுலின் பிரதிநிதித்துவத் தந்தை மொழியை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: δι’ ἀκροβυστίας
  choice: விருத்தசேதனம் செய்யப்படாத நிலையிலேயே
  rationale: இங்கு διά கருவியைக் காட்டுவதைவிட, அவர்கள் விசுவாசிக்கும் நிலையைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது; ‘-லேயே’ அந்தச் சேர்க்கை வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: λογισθῆναι
  choice: கணக்கிடப்படுவதற்கு
  rationale: கணக்கில் சேர்த்தல் அல்லது ஒருவருக்குரியதாக மதித்தல் என்ற பவுலின் கணக்கியல் மொழியை இறையியல் விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: καί
  choice: அவர்களுக்கும்
  rationale: விருத்தசேதனம் செய்யப்படாத விசுவாசிகளுக்கும் நீதி கணக்கிடப்படுகிறது என்ற உள்ளடக்க வலியுறுத்தலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: விருத்தசேதனத்துக்கும் நீதிக்கும் உள்ள தொடர்பு
  choice: விருத்தசேதனம், ஆபிரகாம் விருத்தசேதனம் செய்யப்படாதபோதே விசுவாசத்தோடு தொடர்புடையதாக இருந்த நீதியின் அடையாளமும் முத்திரையும் என மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: விருத்தசேதனமே நீதியை அளிக்கும் வழி என்பதுபோல் வாக்கியத்தை அமைக்க முடியும்.
  rationale: கிரேக்க வாக்கியம், விருத்தசேதனத்திற்கு முன்பே இருந்த விசுவாசத்தின் நீதியை விருத்தசேதனம் பின்னர் முத்திரையிட்டதாக வரிசைப்படுத்துகிறது. பின்னாளைய எந்தச் சடங்கு சார்ந்த கோட்பாட்டையும் சேர்க்காமல் அந்த வரிசையும் இறையியல் இழுபறியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், இரண்டு εἰς τὸ நோக்கக் கூறுகளின் தொடர்பு பாதுகாக்கப்பட்டுள்ளது. ‘விசுவாசத்தின் நீதி’ என்ற தொடர் மூலத்திலுள்ள தொடர்பின் திறந்த தன்மையை வைத்திருக்கிறது.
