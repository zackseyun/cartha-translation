    rationale: “அதனால் ... தந்தையானார்” asserts that he became father, whereas the Greek infinitival construction is prospective and can express purpose or result. “தந்தையாகும்படி” preserves the source form without deciding the debated nuance.
  - severity: medium
    issue: The offspring lexical alternative is absent
    rationale: The audit trail explicitly records σπέρμα’s singular collective image and its “seed” alternative. A Tamil note supplies the corresponding literal alternative (“விதை”) while retaining “சந்ததி” in the text.
