id: ROM.4.18
reference: Romans 4:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: ta
  text: எதிர்பார்ப்புக்கு மாறாக[a], நம்பிக்கையில் அவர் நம்பினார்; பல தேசங்களுக்குத் தந்தையாகும்படி[d], சொல்லப்பட்டிருந்தபடி, “இவ்வாறே உன் சந்ததி இருக்கும்”[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “எதிர்பார்ப்பையும் கடந்து” அல்லது “எதிர்பார்ப்பதற்கு இடமில்லாதபோதும்.”
    reason: lexical_alternative
  - marker: b
    text: ஆதியாகமம் 15:5-லிருந்து மேற்கோள்; ஆதியாகமம் 17:5-ஐயும் ஒப்பிடுக.
    reason: cross_reference
  - marker: c
    text: அல்லது “உன் விதை”; கிரேக்கத்தில் ஒருமை வடிவில் வரும் இந்தச் சொல் கூட்டாகச் சந்ததியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: அல்லது “அவர் தந்தையானதன் விளைவாக”; கிரேக்கச் சொற்றொடர் நோக்கத்தையோ விளைவையோ குறிக்கக்கூடும்.
    reason: translation_ambiguity
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: எதிர்பார்ப்பதற்கு இடமே இல்லாதபோதும்
  rationale: παρά + ஏவல் வேற்றுமை இயல்பான மனித எதிர்பார்ப்புக்கு மாறான அல்லது அதைக் கடந்த சூழலைக் குறிக்கிறது. தமிழில் இயல்பாகவும் முரண்பாட்டின் வலிமையுடனும் இதை வெளிப்படுத்துகிறது.
- source_word: ἐπ’ ἐλπίδι
  choice: நம்பிக்கையுடன்
  rationale: முந்தைய நம்பிக்கையற்ற சூழலோடு உள்ள சொல்லாட்சிசார் எதிர்மறையைத் தக்கவைத்து, ஆபிரகாம் எந்த மனநிலையில் நம்பினார் என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐπίστευσεν
  choice: நம்பினார்
  rationale: πιστεύω என்பதன் நேரடியான வினைச்சொல் பொருளைத் தக்கவைத்து, தேவையற்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: அதனால் ... தந்தையானார்
  rationale: εἰς τό + வினையெச்சத்தின் நோக்கம் அல்லது விளைவு என்ற இரு சாத்தியங்களையும் அளவுக்கு மீறித் தீர்மானிக்காமல், இங்கு வாக்குறுதியின் நிறைவேற்ற விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: பல மக்களினங்களுக்குத் தந்தை
  rationale: ἔθνη என்பதை இங்கு யூதரல்லாதோர் என்று குறுக்காமல், ஆதியாகம வாக்குறுதியின் பல மக்கள் கூட்டங்கள் என்ற பரப்பில் மொழிபெயர்க்கிறது.
- source_word: κατὰ τὸ εἰρημένον
  choice: அவரிடம் சொல்லப்பட்டிருந்தபடி
  rationale: நிகழ்காலத்திற்கும் பொருந்தும் முந்தைய உரைத்தலைக் குறிக்கும் நிறைவுற்ற செயலின் நுணுக்கத்தைக் காக்கிறது.
- source_word: Οὕτως ἔσται τὸ σπέρμα σου
  choice: உன் சந்ததி இவ்வாறே இருக்கும்
  rationale: மேற்கோளின் கண்ணியமான தொனியைத் தக்கவைத்து, σπέρμα என்பதன் ஒருமை-கூட்டுப்பொருளை இயல்பான தமிழில் ‘சந்ததி’ என வழங்குகிறது.
theological_decisions:
- issue: ஆபிரகாமிய வாக்குறுதியில் πολλῶν ἐθνῶν என்பதன் குறிப்பு
  choice: பல மக்களினங்கள்
  alternative: யூதரல்லாத பலர் / பல தேசங்கள்
  rationale: இப்பகுதி ஆதியாகம வாக்குறுதியை எதிரொலிப்பதால், பவுலின் யூதர்–யூதரல்லாதோர் வேறுபாட்டை முன்கூட்டியே இங்கு திணிக்காமல் பல மக்கள் கூட்டங்கள் என்ற உடன்படிக்கைப் பரப்பைத் தக்கவைக்கிறது.
- issue: εἰς τὸ γενέσθαι என்பதில் நோக்கமா விளைவா
  choice: அதனால் ... தந்தையானார்
  alternative: தந்தையாகும்படி / தந்தையாகும் நோக்கில்
  rationale: கிரேக்கக் கட்டமைப்பு நோக்கம் அல்லது விளைவை வெளிப்படுத்தலாம். இச்சூழலில் ஆபிரகாமின் நம்பிக்கைக்கும் வாக்குறுதியின் நிறைவேற்றத்திற்கும் உள்ள தொடர்பை ‘அதனால்’ இயல்பாகக் காட்டுகிறது; கடவுளின் வாக்குறுதியே அவரது தந்தை நிலைக்கு அடிப்படை என்பதையும் மறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘நம்பிக்கையுடன் நம்பினார்’ என்ற மீளொலி கிரேக்கத்தின் ἐλπίς/πιστεύω எதிர்மறைச் சொல்லாட்சியைச் சற்றே வெளிப்படையாகத் தக்கவைக்கிறது. வேதாகம மேற்கோள் இயல்பான ஆனால் உயர்ந்த தொனியில் உள்ளது.
