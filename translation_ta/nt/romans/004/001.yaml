id: ROM.4.1
reference: Romans 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: ta
  text: அப்படியானால், மனித வம்சத்தின்படி நம் மூதாதையான[a][b] ஆபிரகாம் எதைக் கண்டார் என்று நாம் சொல்வோம்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மூதாதை’ என்பதற்கு ‘முன்னோர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மனித வம்சத்தின்படி’ என்பதை ‘கண்டார்’ என்பதோடு இணைத்தும் கிரேக்கத்தைப் புரிந்துகொள்ளலாம். அப்போது, ஆபிரகாம் மனித முயற்சியால் அல்லது மனிதக் கண்ணோட்டத்தில் எதைக் கண்டார் என்று கேட்பதாகப் பொருள் வரும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: அப்படியானால், ... என்று நாம் சொல்வோம்?
  rationale: பவுலின் வாதத்தில் வரும் முடிவுரைக் கேள்வியையும் அடுத்த கருத்தை ஆராயும் தொனியையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: εὑρηκέναι
  choice: எதைக் கண்டடைந்தார்
  rationale: நிகழ்ந்து முடிந்து அதன் விளைவு நிலைக்கும் கிரேக்க perfect infinitive-இன் வலிமையைத் தக்கவைக்கிறது; ‘கண்டுபிடித்தார்’ என்பதைவிட இச்சூழலில் குறைவான விளக்கச் சேர்க்கையைக் கொண்டது.
- source_word: προπάτορα
  choice: மூதாதையான
  rationale: ஆபிரகாமின் முன்னோர் நிலையைக் குறிக்கும் ஒருமைச் சொல்லாகத் தெளிவாகவும் இன்றைய வாசகருக்கு இயல்பாகவும் உள்ளது.
- source_word: ἡμῶν
  choice: நம்
  rationale: ஆபிரகாமோடு பவுலும் அவர் உரையாடுவோரும் பகிர்ந்துகொள்ளும் வம்சத் தொடர்பை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: κατὰ σάρκα
  choice: மனித வம்சத்தின்படி
  rationale: இங்கு σάρξ பாவ இயல்பைக் காட்டாமல் உடல்சார்ந்த வம்சத் தொடர்பைக் குறிப்பதைத் தெளிவான தமிழில் சொல்கிறது; கிரேக்கத் தொடரின் மாற்று இலக்கணத் தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: κατὰ σάρκα என்பதன் இலக்கணத் தொடர்பு
  choice: ‘மனித வம்சத்தின்படி நம் மூதாதை’ என்று ஆபிரகாமின் வம்ச உறவை விவரிப்பதாக முதன்மை உரையில் கொள்ளப்பட்டது.
  alternative: இதை ‘கண்டடைந்தார்’ என்பதோடு இணைத்து, ஆபிரகாம் மனித முயற்சியால் அல்லது மனிதக் கண்ணோட்டத்தில் எதைக் கண்டடைந்தார் எனப் புரிந்துகொள்ளலாம்.
  rationale: ‘ஆபிரகாம், நம் மூதாதை’ என்ற இணைப்புச் சொற்றொடருடன் இது இயல்பாகப் பொருந்துகிறது; எனினும் கிரேக்க வாக்கிய அமைப்பு மாற்று தொடர்பை முற்றிலும் நீக்காததால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மரபான ‘மாம்சத்தின்படி’ என்ற சொல்லாட்சி இச்சூழலில் பாவ இயல்பு என்ற தவறான பொருளைத் தூண்டக்கூடும் என்பதால், வம்சத் தொடர்பைத் தெளிவாக்கும் ‘மனித வம்சத்தின்படி’ தேர்ந்தெடுக்கப்பட்டது.
