  naturalness: ‘விசுவாசத்தின் நீதியின் வழியாக’ என்பது வாசிக்கத்தக்கது; இருப்பினும் ‘விசுவாசத்தால் உண்டாகும் நீதியின் வழியாக’ என்ற அடிக்குறிப்பு மாற்று நவீனத் தமிழில் இயல்பாகவும், மூலத்தின் சாத்தியமான உறவையும் அளவோடு தெரிவிக்கிறது. பிரதான உரையின் கண்ணியமான நவீன நடையும் வாக்கிய ஓட்டமும் ஏற்றவை.
