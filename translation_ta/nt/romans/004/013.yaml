id: ROM.4.13
reference: Romans 4:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: ta
  text: ஏனெனில், ஆபிரகாமுக்கோ அவருடைய சந்ததிக்கோ[a] அவர் உலகத்தின் வாரிசாக இருப்பார் என்ற வாக்குறுதி திருச்சட்டத்தின் வழியாக வந்ததல்ல; விசுவாசத்தின்[d] நீதியின்[b][c] வழியாகவே வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வித்து’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஒருமையில் இருந்தாலும், ‘சந்ததி’ அல்லது ‘வழித்தோன்றல்கள்’ என்று கூட்டாகக் குறிக்க முடியும்.
    reason: lexical_alternative
  - marker: b
    text: ‘விசுவாசத்தால் உண்டாகும் நீதியின் வழியாக’ அல்லது ‘விசுவாசத்தை அடிப்படையாகக் கொண்ட நீதியின் வழியாக’ என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘நீதி’ என்பதற்கு இங்கு சூழலைப் பொறுத்து ‘நியாயம்’ என்ற பொருளும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘விசுவாசம்’ என்பதற்கு சூழலைப் பொறுத்து ‘நம்புதல்’ அல்லது ‘நம்பகத்தன்மை’ என்ற பொருள்களும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: வாக்குறுதி
  rationale: இது கடவுள் அளிக்கும் உறுதியான வாக்கைக் குறிக்கும் பவுலின் வழக்கமான சொல்லாட்சியை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: σπέρματι
  choice: சந்ததி
  rationale: கிரேக்கச் சொல் ஒருமையில் இருந்தாலும் ஒருவரையோ கூட்டாக வழித்தோன்றல்களையோ குறிக்க முடியும்; ‘சந்ததி’ அந்த நெகிழ்வைத் தமிழில் காக்கிறது.
- source_word: κληρονόμον ... κόσμου
  choice: உலகத்தின் வாரிசு
  rationale: பவுலின் வாரிசுரிமைச் சொல்லாட்சியையும் κόσμος என்பதன் பரந்த பொருளையும் குறுக்காமல் காக்கிறது.
- source_word: διὰ νόμου
  choice: திருச்சட்டத்தின் வழியாக
  rationale: இங்கு பவுலின் வாதத்தில் மோசேயின் சட்டம் இயல்பாகக் குறிப்பாகிறது; ‘திருச்சட்டம்’ தமிழில் அந்த வேதாகமச் சூழலைத் தெளிவுபடுத்துகிறது.
- source_word: δικαιοσύνης
  choice: நீதி
  rationale: δικαιοσύνη என்பதன் நீதியான நிலை மற்றும் நீதித்தீர்ப்பு சார்ந்த பொருள் பரப்பைச் சுருக்காமல் வழங்கும் வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இச்சூழலில் சட்டத்திற்கு எதிர்நிலையாக வரும் πίστις என்பதற்கான இயல்பான பவுலியச் சொல்; ‘நம்பிக்கை,’ ‘உண்மைத்தன்மை’ ஆகிய சாத்தியங்களை அடிக்குறிப்பு காக்கிறது.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: விசுவாசத்தின் நீதியின் வழியாக
  rationale: கிரேக்கத்தின் சுருக்கமான வேற்றுமைத் தொகையைத் தீர்மானமாக விரித்துரைக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: δικαιοσύνης πίστεως என்பதிலுள்ள உறவு
  choice: ‘விசுவாசத்தின் நீதி’ என்று சுருக்கமான வடிவில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘விசுவாசத்தினால் வரும் நீதி’ அல்லது ‘விசுவாசத்தின் அடிப்படையிலான நீதி.’
  rationale: பவுல் திருச்சட்டத்தையும் விசுவாசத்தையும் எதிரெதிராக வைக்கிறார்; ஆனால் இந்த வேற்றுமைத் தொடர் அவற்றின் துல்லியமான உறவை வெளிப்படையாக வரையறுப்பதில்லை. எனவே அந்த இறையியல் அழுத்தமும் பலவகை வாசிப்பிற்கான இடமும் காக்கப்படுகிறது.
- issue: αὐτὸν என்பதன் சுட்டுப்பொருள்
  choice: ஒருமை வடிவான ‘அவர்’ பயன்படுத்தப்பட்டு, அது ஆபிரகாமைச் சுட்டும் இயல்பான வாசிப்பு காக்கப்பட்டது.
  alternative: ‘அவர்கள்’ என்று ஆபிரகாமையும் அவரது சந்ததியையும் கூட்டாகக் குறிப்பிடுதல்.
  rationale: மூலத்தில் αὐτὸν ஒருமையில் உள்ளது. தமிழிலும் ஒருமையை வைத்திருப்பது மூல வடிவை மதிக்கிறது; அதேவேளை முந்தைய ‘சந்ததி’ ஒருமைக் கூட்டுப்பெயராக இருப்பதால் சுட்டுப்பொருளை தேவையின்றி முற்றாக முடிவுசெய்வதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வந்ததல்ல ... வந்தது’ என்ற இயல்பான தமிழ் அமைப்பு, கிரேக்கத்தில் வெளிப்படையாக இல்லாத இணைப்பை மிகையாக விளக்காமல் வாக்கியத்தை முழுமைப்படுத்துகிறது. ‘விசுவாசத்தின் நீதி’ என்ற சுருக்கம் மூலத்தின் இறையியல் தெளிவின்மையைப் பாதுகாக்கிறது.
