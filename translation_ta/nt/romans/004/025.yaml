  verdict: revise
  source_fidelity: The draft accurately preserves the two Greek passive verbs and renders the first διά + accusative phrase causally. The second phrase appropriately takes the prospective sense in the main text while retaining the grammatically possible causal sense in a footnote.
  naturalness: The wording is generally clear and modern, but “நாம் நீதிமான்களாகத் தீர்க்கப்படுவதற்காக” is somewhat heavy. A direct object construction, “நம்மை நீதிமான்கள் என்று அறிவிப்பதற்காக,” is more idiomatic modern Tamil and clearly conveys the judicial sense.
  terminology: “மீறல்கள்” is an appropriate non-flattening rendering of παραπτώματα. For δικαίωσις, “நீதிமான்கள் என்று அறிவித்தல்” communicates forensic justification naturally, without suggesting moral transformation. The alternate footnote has been aligned with that wording.
