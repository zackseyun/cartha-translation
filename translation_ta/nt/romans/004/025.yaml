  text: ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: ta
  text: அவர் நமது மீறல்களின் காரணமாக ஒப்புக்கொடுக்கப்பட்டார்; நம்மை நீதிமான்கள் என்று அறிவிப்பதற்காக எழுப்பப்பட்டார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மை நீதிமான்கள் என்று அறிவித்ததன் காரணமாக.”
    reason: alternative_reading
  - marker: b
    text: “நீதிமான்கள் என்று அறிவித்தல்” என்பதை “விடுதலை” அல்லது “நீதிமான்களாக்கப்படுதல்” என்றும் கூறலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: ஒப்புக்கொடுக்கப்பட்டார்
  rationale: கிரேக்க வினையின் செயப்பாட்டு வடிவத்தையும், செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படாத நிலையையும் காக்கிறது; நவீனத் தமிழிலும் இயல்பாகப் புரிகிறது.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: நமது மீறல்களின் காரணமாக
  rationale: διά என்பதுடன் வேற்றுமை உருபு கொண்ட இத்தொடர் இங்கு காரணத்தைக் குறிப்பது இயல்பானது; ‘காரணமாக’ அந்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: παραπτώματα
  choice: மீறல்கள்
  rationale: παράπτωμα குறிக்கும் ஒழுக்கரீதியான வரம்புமீறுதலைக் காக்கிறது; பொதுவான ‘பாவங்கள்’ என்று பொருளை விரிவாக்காமல், நவீன வாசகருக்கும் புரியும்படி உள்ளது.
- source_word: ἠγέρθη
  choice: எழுப்பப்பட்டார்
  rationale: கிரேக்கத்தின் எளிய செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத சொற்களைச் சேர்க்கவில்லை.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: நாம் நீதிமான்களாகத் தீர்க்கப்படுவதற்காக
  rationale: இரண்டாவது διά தொடர் நோக்கம் அல்லது விளைவைச் சுட்டுவதாக முதன்மை உரையில் வழங்கப்படுகிறது; காரணத்தைக் குறிக்கும் இலக்கண வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: δικαίωσιν
  choice: நீதிமான்களாகத் தீர்க்கப்படுதல்
  rationale: δικαίωσις என்பதன் நீதிமன்றம் சார்ந்த, பவுலின் பயன்பாட்டுக்குரிய வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் ஒழுக்க மாற்றமாகப் பொருள் கொள்ளப்படுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: διὰ τὴν δικαίωσιν ἡμῶν என்பது நோக்கம்/விளைவை (‘நீதிமான்களாகத் தீர்க்கப்படுவதற்காக’) குறிக்கிறதா, காரணத்தை (‘நீதிமான்களாகத் தீர்க்கப்பட்டதன் காரணமாக’) குறிக்கிறதா?
  choice: நாம் நீதிமான்களாகத் தீர்க்கப்படுவதற்காக
  alternative: நாம் நீதிமான்களாகத் தீர்க்கப்பட்டதன் காரணமாக
  rationale: சூழலில் கிறிஸ்துவின் உயிர்த்தெழுதல் விசுவாசிகளின் நீதித் தீர்ப்போடு முன்னோக்கி இணைக்கப்படுவது பொருத்தமான முதன்மை வாசிப்பாகும். எனினும் διά + accusative காரணத்தையும் குறிக்கக்கூடும் என்பதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இரு செயப்பாட்டு வினைகளும் காக்கப்பட்டுள்ளன. இறையியல் தொழில்சொல்லை மட்டும் பயன்படுத்தாமல், δικαίωσις என்பதன் நீதிமன்றச் சார்ந்த பொருளைத் தெளிவாகச் சொல்லும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டுள்ளது.
