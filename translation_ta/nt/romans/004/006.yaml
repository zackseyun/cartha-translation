- source_word: καθάπερ
  choice: அதுபோலவே
  rationale: முந்தைய வாதத்துடன் தாவீதின் சாட்சியை ஒப்பிட்டு இணைக்கும் தொடரை இயல்பான தமிழில் காட்டுகிறது.
- source_word: καὶ
  choice: -உம் (தாவீதும்)
  rationale: தாவீதையும் கூடுதல் சாட்சியாகச் சேர்க்கும் பொருளைத் தமிழ் இணைவேற்றுமை உருபு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: மேற்கோள் அறிமுகத்தில் உள்ள நிகழ்காலத்தைத் தக்கவைத்து, மரியாதையான நவீனத் தமிழில் தருகிறது.
- source_word: μακαρισμός
  choice: பெறும் பேறு
  rationale: ஒருவர் பேறுபெற்றவர் என அறிவிக்கப்படும் நிலையைக் குறிக்கும் பெயர்ச்சொல் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀνθρώπου
  choice: ஒருவன்
  rationale: கிரேக்கத்தின் ஒருமை ஆண்பால் வடிவத்தைத் தக்கவைக்கிறது; இங்கு அது ஆண்களுக்கு மட்டும் வரையறுக்கப்படாமல் பிரதிநிதித்துவப் பொருளில் வருகிறது.
- source_word: λογίζεται
  choice: கணக்கில் சேர்க்கும்போது
  rationale: λογίζομαι என்பதிலுள்ள கணக்கிடுதல் அல்லது ஒருவருக்குரியதாகக் கருதுதல் என்ற உருவகத்தைத் தெளிவான நவீனத் தமிழில் காக்கிறது.
- source_word: δικαιοσύνην
  choice: நீதியை
  rationale: தமிழ் வேதாகம மற்றும் இறையியல் பயன்பாட்டில் ‘நீதி’ என்பது δικαιοσύνη-யின் நிலை அல்லது சரியான உறவைக் குறிக்கும் கருத்தைச் சுருக்கமாகத் தாங்குகிறது.
- source_word: χωρὶς ἔργων
  choice: செயல்கள் இல்லாமலேயே
  rationale: செயல்களை அடிப்படையாகக் கொள்ளாமல் கடவுள் கணக்கிடுகிறார் என்ற பவுலின் முரண்பாட்டை வலியுறுத்துகிறது.
theological_decisions:
- issue: ἀνθρώπου என்பதிலுள்ள பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: ஒருவன்
  alternative: ஒரு மனிதர் / ஒருவர்
  rationale: மூலத்தின் ஒருமை ஆண்பால் வடிவம் முதன்மை உரையில் தக்கவைக்கப்படுகிறது; அது ஆண்களை மட்டும் குறிக்கவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: பவுலின் δικαιοσύνη
  choice: நீதி
  alternative: நீதியான நிலை / நியாயம்
  rationale: ‘நீதி’ என்பது பவுலின் சொல்லின் இறையியல் செறிவையும் தமிழில் நிலைபெற்ற பயன்பாட்டையும் காக்கிறது; ‘நியாயம்’ என்ற பொருள் வாய்ப்பை அடிக்குறிப்பில் விடுகிறது.
- issue: λογίζεται என்ற கணக்கியல் உருவகம்
  choice: ஒருவனுடைய கணக்கில் சேர்க்கும்போது
  alternative: நீதிமானாகக் கருதும்போது / நீதியாக எண்ணும்போது
  rationale: கடவுள் நீதியை அந்த நபருக்குரியதாகக் கணக்கிடுகிறார் என்ற இலக்கண அமைப்பைத் தக்கவைத்து, ‘நீதிமானாக்குதல்’ போன்ற விளக்கவுரையை மூலத்துக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கணக்கில் சேர்க்குதல்’ என்ற சொற்றொடர் மூலத்தின் கணக்கியல் உருவகத்தை இயல்பாகக் காக்கிறது; ‘செயல்கள் இல்லாமலேயே’ என்பது χωρὶς ἔργων என்ற வலுவான வேறுபாட்டை வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறிப்பான்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
