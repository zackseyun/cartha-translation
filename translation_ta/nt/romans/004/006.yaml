  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: ta
  text: அதுபோலவே, செயல்களைச் சாராமல் கடவுள் நீதியை எவருடைய கணக்கில் சேர்த்தளிக்கிறாரோ, அந்த மனிதரின் பேறுபெற்ற நிலையைப் பற்றித் தாவீதும் கூறுகிறார்:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நபரின்”; கிரேக்கத்தில் ஆண்பால் ஒருமை வடிவம் உள்ளது; இங்கு அது பிரதிநிதித்துவப் பொருளில் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: “கணக்கில் சேர்த்தளிக்கிறார்” என்பதற்கு, “எண்ணுகிறார்” அல்லது “கணக்கிடுகிறார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “நீதி” என்பதற்கு, “நியாயம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
