- from: ஏனெனில், அது உன் நன்மைக்காகச் செயல்படும் கடவுளின் பணியாளர். ஆனால் நீ தீமை செய்தால், அஞ்சு; அது வாளை வீணாகச் சுமக்கவில்லை[a]. ஏனெனில், அது கடவுளின் பணியாளர்; தீமை செய்கிறவன்மேல் கோபத்தீர்ப்பை நிறைவேற்றும் பழிதீர்ப்பாளர்[b].
