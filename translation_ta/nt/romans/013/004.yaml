id: ROM.13.4
reference: Romans 13:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: ta
  text: ஏனெனில், அது உன் நன்மைக்காகக் கடவுளின் பணியாளாக இருக்கிறது. ஆனால் நீ தீமை செய்தால், அஞ்சு; அது வாளைத் தாங்குவது வீணாக அல்ல[a]. ஏனெனில், அது கடவுளின் பணியாளர்; தீமை செய்கிறவன்மேல் கோபத்தைச் செயல்படுத்தும் பழிதீர்ப்பவர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வீணாக” என்பதை “காரணமில்லாமல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தீமை செய்கிறவன்மேல் கோபத்தை நிறைவேற்றுகிறவர்.”
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονός
  choice: பணியாளர்
  rationale: ஆளும் அதிகாரம் கடவுளின் சார்பில் ஒரு பணியைச் செய்கிறது என்ற முகவர் கருத்தை இது தெளிவாகத் தருகிறது; திருச்சபைப் பதவியை மட்டும் குறிக்கும் சொல்லாக இதைச் சுருக்குவதையும் தவிர்க்கிறது.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: உன் நன்மைக்காக
  rationale: திசையை மட்டுமல்லாமல், வாசகருக்கு உண்டாகும் நன்மையையும் நோக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ κακὸν ποιῇς
  choice: நீ தீமை செய்தால்
  rationale: κακόν என்பதன் ஒழுக்கநெறி சார்ந்த தீமை என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: φοβοῦ
  choice: அஞ்சு
  rationale: தண்டிக்கும் அதிகாரத்தை முன்னிட்டு அச்சப்பட வேண்டும் என்ற ஒருமை கட்டளையை நேரடியாகத் தருகிறது.
- source_word: εἰκῇ
  choice: வீணாக
  rationale: நோக்கமின்றி அல்லது பயனின்றி அல்ல என்ற பொருளைக் காக்கும் இயல்பான தமிழ்; ‘காரணமில்லாமல்’ என்பது அடிக்குறிப்பில் மாற்றாகத் தரப்பட்டுள்ளது.
- source_word: μάχαιραν φορεῖ
  choice: வாளைச் சுமக்கிறது
  rationale: வாள் என்ற தெளிவான உருவகத்தையும், அதை அதிகாரத்தின் அடையாளமாகத் தொடர்ந்து தாங்குதல் என்ற φορέω வின் நுணுக்கத்தையும் காக்கிறது.
- source_word: ἔκδικος
  choice: பழிதீர்ப்பாளர்
  rationale: நீதி அல்லது தண்டனையை நிறைவேற்றும் முகவர் என்ற மறுதீர்ப்பு சார்ந்த வலிமையைத் தக்கவைக்கிறது; தனிப்பட்ட பகை என்று உரையை விளக்கிவிடாமல் சூழல் அதன் பொருளைக் கட்டுப்படுத்துகிறது.
- source_word: εἰς ὀργὴν
  choice: கோபத்தீர்ப்பை நிறைவேற்றும்
  rationale: கோபம் தண்டனைத் தீர்ப்பாகச் செயல்படுகிறது என்ற நோக்கம்/விளைவை இயல்பான தமிழில் தருகிறது; அது வெளிப்படையாக ‘கடவுளின் கோபம்’ என்று கிரேக்கத்தில் இல்லாததைச் சேர்க்கவில்லை.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: தீமை செய்கிறவன்மேல்
  rationale: தீமையான நடத்தையில் ஈடுபடுகிற நபர்மீது நடவடிக்கை செலுத்தப்படுவதைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ஆளும் அதிகாரத்தின் தண்டனைப் பணி தெய்வீகக் கோபத்துடன் கொண்டுள்ள உறவு
  choice: ‘கோபத்தீர்ப்பை நிறைவேற்றும்’ என்று மொழிபெயர்த்து, அது ‘கடவுளின் கோபம்’ என்று முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘கடவுளின் கோபத்தை நிறைவேற்றும்’ அல்லது ‘தண்டனை வழங்கும்’.
  rationale: சூழல் அந்த அதிகாரத்தை கடவுளின் பணியாளராகக் காட்டினாலும், εἰς ὀργὴν என்பதில் ‘கடவுளின்’ என்பது வெளிப்படையாக இல்லை. தற்போதைய மொழிபெயர்ப்பு தொடர்பை உணர்த்தியபடியே மூலத்தின் சுருக்கத்தையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
- issue: ἔκδικος என்பதில் நீதி மற்றும் பழிதீர்ப்பு ஆகிய பொருள் நிழல்கள்
  choice: ‘பழிதீர்ப்பாளர்’ என்று வைத்து மறுதீர்ப்பு சார்ந்த வலிமையைக் காத்தல்.
  alternative: ‘நீதித் தண்டனையை நிறைவேற்றுபவர்’.
  rationale: மாற்று வாசகம் தனிப்பட்ட பழிவாங்குதல் என்ற தவறான புரிதலைக் குறைக்கலாம்; ஆனால் மூலச்சொல்லின் வலிமையை ஓரளவு மங்கச் செய்யும். ‘கடவுளின் பணியாளர்’ என்ற உடனடி சூழல் இங்கு அதிகாரப்பூர்வமான நீதிச் செயலைக் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணியாளர்’ என்பது திருச்சபைச் சிறப்புப் பதவியைத் தவிர்த்து அரசதிகாரத்தின் கடவுள் சார்ந்த முகவர் பணியை வெளிப்படுத்துகிறது. ‘வாள்’ என்ற மூல உருவகம் மாற்றமின்றிக் காக்கப்பட்டுள்ளது.
