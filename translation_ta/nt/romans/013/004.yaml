  rationale: மூலத்தின் இரு ‘கடவுளின் பணியாளர்’ என்ற வலியுறுத்தலையும், வாள் என்ற உருவகத்தையும், தீமை செய்பவருக்கு எதிரான கோபத்தின் நோக்கத்தையும் காத்துள்ளோம். முதல் இடத்தில் ‘செயல்படும்’ என்ற விளக்கச்சேர்க்கை நீக்கப்பட்டது. இறுதியில் ‘கோபத்தீர்ப்பு’ என்பதிலுள்ள மூலத்திற்கு அப்பாற்பட்ட ‘தீர்ப்பு’ நீக்கப்பட்டு, εἰς ὀργήν-இன் சுருக்கமான பொருள் பாதுகாக்கப்பட்டது. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களுக்கு உரிய இடத்தில் உள்ளன.
