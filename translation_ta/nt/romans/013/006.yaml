id: ROM.13.6
reference: Romans 13:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: ta
  text: இதனால்தான் நீங்கள் வரிகளையும் செலுத்துகிறீர்கள். ஏனெனில் அதிகாரத்தில் இருப்பவர்கள் கடவுளின் பணியாளர்கள்; அவர்கள் இதே பணியில் தொடர்ந்து ஈடுபட்டிருக்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους
  choice: வரிகள்
  rationale: அரசாட்சிக்கு செலுத்தப்படும் நேரடி வரி அல்லது கப்பத்தைக் குறிக்கும் சொல்லை, இன்றைய வாசகர்களுக்குப் பொதுவாகவும் தெளிவாகவும் இருக்கும் ‘வரிகள்’ என மொழிபெயர்த்தோம்.
- source_word: τελεῖτε
  choice: செலுத்துகிறீர்கள்
  rationale: வரி அல்லது கடனைச் செலுத்துதல் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: λειτουργοὶ θεοῦ
  choice: கடவுளின் பணியாளர்கள்
  rationale: λειτουργός இங்கு பொது கடமையை நிறைவேற்றுகிறவர்களைக் குறிக்கிறது; வழிபாட்டுச் சூழலை மட்டும் உணர்த்தக்கூடிய ‘ஊழியர்கள்’ என்பதற்குப் பதிலாக பரந்த பொருளுள்ள ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: προσκαρτεροῦντες
  choice: தொடர்ந்து ஈடுபட்டிருக்கிறார்கள்
  rationale: ஒரு பணியில் நிலைத்திருந்து கவனம் செலுத்துதல் என்ற தொடர்ச்சியான செயற்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அரசு அதிகாரிகளை ‘கடவுளின் பணியாளர்கள்’ என்று குறிப்பிடுதல்
  choice: மூலத்தின் நேரடியான உரிமைத் தொடர்பை அப்படியே வைத்தோம்
  alternative: ‘கடவுளுக்காகப் பணிபுரிபவர்கள்’
  rationale: θεοῦ என்பது ‘கடவுளின்’ என்ற தொடர்பை நேரடியாகத் தருகிறது; இந்த வசனத்தின் கூற்றை மெலிதாக்கவோ, அவர்களின் நோக்கங்களைப் பற்றிய கூடுதல் விளக்கத்தைச் சேர்க்கவோ கூடாது.
- issue: εἰς αὐτὸ τοῦτο என்பதன் குறிப்பு
  choice: ‘இதே பணியில்’ என்று மொழிபெயர்த்தோம்
  alternative: ‘இந்த நோக்கத்திற்காகவே’
  rationale: இச்சொற்றொடர் வரி வசூலை மட்டும் குறிக்கிறதா அல்லது முந்தைய வசனங்களில் கூறப்பட்ட ஆட்சிப் பொறுப்பை விரிவாகக் குறிக்கிறதா என்பது ஓரளவு திறந்துள்ளது; ‘இதே பணியில்’ அந்தச் சூழல்சார் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதைமிக்கதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. கிரேக்கத்தின் இரு γὰρ தொடர்களை தமிழில் இயல்பாகப் பிரித்து, காரணத் தொடர்பை ‘இதனால்தான்’ மற்றும் ‘ஏனெனில்’ மூலம் தெளிவாக்கியுள்ளோம்.
