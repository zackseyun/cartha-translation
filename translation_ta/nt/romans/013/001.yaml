id: ROM.13.1
reference: Romans 13:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: ta
  text: ஒவ்வொருவரும் மேலான ஆளும் அதிகாரங்களுக்குக் கீழ்ப்பட்டிருக்கட்டும்[a]. ஏனெனில், கடவுளிடமிருந்து வராத அதிகாரம் எதுவும் இல்லை; இருக்கும் அதிகாரங்கள் கடவுளால் ஒழுங்குபடுத்தப்பட்டிருக்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேலான அதிகாரங்களுக்கு’ அல்லது ‘தங்களைவிட உயர்ந்த அதிகாரங்களுக்கு.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளால் நியமிக்கப்பட்டிருக்கின்றன’ அல்லது ‘கடவுளால் நிறுவப்பட்டிருக்கின்றன.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: ஒவ்வொருவரும்
  rationale: சொல்லெழுத்தாக ‘ஒவ்வோர் ஆன்மாவும்’ என்றாலும், கொய்னே கிரேக்க வழக்கில் இது ஒவ்வொரு நபரையும் குறிக்கிறது. ‘ஒவ்வொருவரும்’ என்பது பகிர்ந்தளிக்கும் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: தங்களுக்கு மேலுள்ள ஆளும் அதிகாரங்களுக்கு
  rationale: ἐξουσίαις என்பது அதிகாரம் உடையவர்களையோ அமைப்புகளையோ குறிக்கிறது; ὑπερεχούσαις என்பது மேல்நிலையில் இருப்பதைச் சுட்டுகிறது. இரண்டையும் இணைத்த இச்சொற்றொடர் குடியாட்சி சூழலையும் ‘மேலான’ என்ற இடம்சார் நுணுக்கத்தையும் காக்கிறது.
- source_word: ὑποτασσέσθω
  choice: கீழ்ப்பட்டிருக்கட்டும்
  rationale: நிகழ்காலக் கட்டளை வடிவம் தொடர்ச்சியான ஒழுங்குபட்ட கீழ்ப்படிதலைக் குறிக்கிறது. இத்தேர்வு கிரேக்கத்தின் நடுநிலை/செயப்பாட்டு நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: ஏனெனில், கடவுளிடமிருந்து வராத அதிகாரம் எதுவும் இல்லை
  rationale: இங்கு ὑπὸ θεοῦ அதிகாரத்தின் இறுதி மூலத்தைச் சுட்டுகிறது. ‘கடவுளிடமிருந்து வராத’ என்பது அந்த மூலப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: αἱ δὲ οὖσαι
  choice: இப்போது இருக்கும் அதிகாரங்கள்
  rationale: பெண்பால் பன்மை வடிவம் முன் கூறப்பட்ட அதிகாரங்களையே குறிக்கிறது. ‘இப்போது’ என்பது ‘இருக்கும்’ அதிகாரங்களின் நடைமுறை இருப்பைத் தெளிவுபடுத்துகிறது; கிரேக்கத்தில் இல்லாத காலவரம்பை விதிப்பதில்லை.
- source_word: τεταγμέναι
  choice: ஒழுங்குபடுத்தப்பட்டிருக்கின்றன
  rationale: τάσσω என்பதன் நிறைவு செயப்பாட்டு வடிவம், கடவுளின் ஒழுங்கமைக்கும் செயலால் ஏற்பட்டுத் தொடரும் நிலையைச் சுட்டுகிறது. ‘ஒழுங்குபடுத்தப்பட்டிருக்கின்றன’ என்பது நியமித்தல், நிறுவுதல், ஒழுங்கில் வைத்தல் ஆகிய சாத்திய நுணுக்கங்களை தேவையின்றி ஒன்றாகக் குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: குடியாட்சி அதிகாரங்களுக்கும் கடவுளுக்கும் உள்ள உறவின் வரம்பும் வலிமையும்
  choice: நடைமுறையில் இருக்கும் ஆளும் அதிகாரங்கள் கடவுளிடமிருந்து அதிகாரம் பெறுகின்றன என்றும், கடவுளால் ஒழுங்கில் வைக்கப்பட்டுள்ளன என்றும் மொழிபெயர்த்தல்; ஒவ்வொரு ஆட்சியாளரின் ஒவ்வொரு செயலுக்கும் நிபந்தனையற்ற தெய்வீக ஒப்புதல் உண்டு என்று விரிவுபடுத்தாதிருத்தல்.
  alternative: ஒவ்வொரு குறிப்பிட்ட ஆட்சியும் அதன் எல்லாச் செயல்களும் கடவுளால் நேரடியாக அங்கீகரிக்கப்பட்டவை என்ற வலுவான வாசிப்பு; அல்லது பவுல் நடைமுறை அதிகாரிகளைப் பற்றி அல்லாமல் அதிகாரம் என்ற கருத்தை மட்டும் பேசுகிறார் என்ற பலவீனமான வாசிப்பு.
  rationale: கிரேக்கம் அதிகாரங்களைத் தெளிவாகக் குறிப்பிட்டு, இருப்பவை கடவுளால் τεταγμέναι என்கிறது. ‘ஒழுங்குபடுத்தப்பட்டிருக்கின்றன’ என்பது இக்கூற்றைத் தக்கவைத்து, எல்லா அரசுச் செயல்களுக்கும் ஒழுக்க அங்கீகாரம் உண்டு என்ற கூடுதல் முடிவை வசனத்துக்குள் புகுத்தாமல் இருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆளும் அதிகாரங்கள்’ குடியாட்சி சூழலைத் தெளிவாக்குகிறது; ‘தங்களுக்கு மேலுள்ள’ என்பது ὑπερεχούσαις என்பதின் நிலைமுறை நுணுக்கத்தை காக்கிறது. ‘ஒழுங்குபடுத்தப்பட்டிருக்கின்றன’ என்பது τεταγμέναι என்பதின் நிறைவு நிலையை வெளிப்படுத்தி, தேவையற்ற சமயப் பிரிவுசார் விளக்கத்தைத் தவிர்க்கிறது.
