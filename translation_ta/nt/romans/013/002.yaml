id: ROM.13.2
reference: Romans 13:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: ta
  text: ஆகவே, அதிகாரத்தை எதிர்த்து நிற்பவர் கடவுளின் ஏற்பாட்டையே எதிர்த்திருக்கிறார்; எதிர்த்தவர்கள் தங்கள்மீதே தீர்ப்பைப் பெறுவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீர்ப்பு” என்பதை “தண்டனைத் தீர்ப்பு” என்றும் மொழிபெயர்க்கலாம்; ஆனால் இங்கே உள்ள கிரேக்கச் சொல் இறுதி ஆக்கினை என்ற வலுவான பொருளைக் கட்டாயப்படுத்தவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வசனத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ ἀντιτασσόμενος
  choice: எதிர்த்து நிற்பவர்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் பொதுவான, தொடர்ந்து எதிர்க்கும் நிலையை வெளிப்படுத்துகிறது.
- source_word: τῇ ἐξουσίᾳ
  choice: அதிகாரத்தை
  rationale: ஒருமையைப் பேணுகிறது; இது ஆட்சி அதிகாரத்தைக் குறிக்கிறது என்பதை உடனடிச் சூழல் தெளிவுபடுத்துகிறது.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: கடவுள் ஏற்படுத்திய ஒழுங்கை
  rationale: διαταγή என்பதிலுள்ள கடவுளால் நிறுவப்பட்ட ஏற்பாடு அல்லது ஒழுங்கு என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘கட்டளை’ என்று மொழிபெயர்த்து வெறும் வாய்மொழிக் கட்டளையாகக் குறுக்கவில்லை.
- source_word: ἀνθέστηκεν
  choice: எதிர்த்து நிற்கிறார்
  rationale: முன்பு எடுத்த எதிர்ப்பு நிலை இப்போதும் பொருந்துகிறது என்ற நிறைவுக்கால நுணுக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ஒரே கிரேக்க வேர்ச்சொல்லின் தொடர்பையும் பேணுகிறது.
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: அப்படி எதிர்த்து நிற்பவர்கள்
  rationale: முந்தைய செயலைத் திரும்பச் சுட்டி, அவ்வாறு நிலைப்பாடு எடுத்தவர்களைப் பொதுவாகக் குறிக்கிறது.
- source_word: ἑαυτοῖς
  choice: தங்கள்மீதே
  rationale: எதிர்ப்பின் விளைவு எதிர்ப்பவர்கள்மீதே திரும்புகிறது என்ற தற்சுட்டுப் பொருளையும் வலியுறுத்தலையும் வெளிப்படுத்துகிறது.
- source_word: κρίμα
  choice: தீர்ப்பு
  rationale: இச்சூழலில் சாத்தியமான ‘தண்டனைத் தீர்ப்பு’ என்ற வலுவான பொருளை நிராகரிக்காமல், இறுதி நித்திய ஆக்கினை என்று தேவையின்றி முடிவுசெய்யாத பரந்த சொல்லாக உள்ளது.
- source_word: λήμψονται
  choice: பெறுவார்கள்
  rationale: எதிர்கால வினையின் நேரடியான பொருளைப் பேணுகிறது; தீர்ப்பின் தன்மையை மொழிபெயர்ப்பிலேயே அதிகமாக விளக்கவில்லை.
theological_decisions:
- issue: κρίμα என்பதன் வரம்பு
  choice: தீர்ப்பு
  alternative: தண்டனைத் தீர்ப்பு / ஆக்கினை
  rationale: இங்கு எச்சரிக்கை உண்மையானது; ஆனால் இது இறுதி நித்திய ஆக்கினையையே குறிப்பதாக கிரேக்கச் சொல் கட்டாயப்படுத்தவில்லை. ஆகவே அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் பேணப்படுகிறது.
- issue: ἐξουσία என்பதன் குறிப்பு
  choice: அதிகாரம்
  alternative: ஆட்சி அதிகாரம்
  rationale: ரோமர் 13:1-ன் சூழலில் இது ஆட்சி அதிகாரத்தைக் குறிக்கிறது. இருந்தாலும் மூலத்தின் ஒருமையையும் சுருக்கத்தையும் பேணுவதற்காக பொதுவான ‘அதிகாரம்’ பயன்படுத்தப்படுகிறது.
- issue: கடவுளுடைய διαταγή-க்கும் அதிகாரத்திற்கும் உள்ள தொடர்பு
  choice: கடவுள் ஏற்படுத்திய ஒழுங்கு
  alternative: கடவுளின் கட்டளை / கடவுளின் ஏற்பாடு
  rationale: அதிகாரம் தொடர்பான ஒழுங்கு கடவுளால் நிறுவப்பட்டது என்று வசனம் கூறுகிறது; எந்த ஓர் குறிப்பிட்ட ஆட்சியாளரின் ஒவ்வொரு செயலும் கடவுளின் கட்டளை என்று விரிவுபடுத்தாமல் மூலத்தின் கூற்றை மட்டும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘எதிர்த்து நிற்பவர் / எதிர்த்து நிற்பவர்கள்’ என்ற மீளுரைத்தல் கிரேக்க மூலத்திலுள்ள சொல்வேர்த் தொடர்பைப் பேணுகிறது. ‘ஒழுங்கையே’ என்பதிலுள்ள ‘ஏ’ எதிர்ப்பின் உண்மையான இலக்கை வலியுறுத்துகிறது.
