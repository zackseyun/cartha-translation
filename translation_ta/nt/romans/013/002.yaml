revisions:
- from: ஆகவே, அதிகாரத்தை எதிர்த்து நிற்பவர் கடவுள் ஏற்படுத்திய ஒழுங்கையே எதிர்த்து நிற்கிறார்; அப்படி எதிர்த்து நிற்பவர்கள் தங்கள்மீதே தீர்ப்பைப் பெறுவார்கள்.[a]
  to: ஆகவே, அதிகாரத்தை எதிர்த்து நிற்பவர் கடவுளின் ஏற்பாட்டையே எதிர்த்திருக்கிறார்; எதிர்த்தவர்கள் தங்கள்மீதே தீர்ப்பைப் பெறுவார்கள்.[a]
  rationale: The revision preserves the draft’s clear modern-standard Tamil while representing the perfect aspect of ἀνθέστηκεν more faithfully. ‘கடவுளின் ஏற்பாடு’ gives διαταγή a direct, suitably broad equivalent, and the existing footnote continues to preserve the contextual ambiguity of κρίμα.
