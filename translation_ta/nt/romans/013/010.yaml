  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: ta
  text: அன்பு பிறருக்குத் தீங்கு செய்வதில்லை; ஆகவே, அன்பே திருச்சட்டத்தின் நிறைவு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  choice: அன்பு
  rationale: நவீனத் தமிழில் இயல்பானதும் விரிவானதும் ஆகிய இணைச்சொல்; வசனத்தின் இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி வலியுறுத்தலைக் காக்கிறது.
- source_word: τῷ πλησίον
  choice: பிறருக்கு
  rationale: சூழலில் ஒருவருக்கு அருகில் இருப்பவரை மட்டும் அல்லாமல் சகமனிதரைப் பொதுவாகக் குறிக்கிறது; தமிழில் ‘பிறருக்கு’ என்பது இந்தப் பொதுவான அறநெறிப் பொருளை இயல்பாகத் தருகிறது.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: தீங்கு செய்வதில்லை
  rationale: ἐργάζεται என்பதன் ‘செய்கிறது/விளைவிக்கிறது’ என்ற செயற்பொருளையும், κακόν என்பதன் இச்சூழலுக்குரிய ‘தீங்கு’ என்ற பொருளையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து எடுக்கப்படும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: πλήρωμα
  choice: நிறைவு
  rationale: பெயர்ச்சொல் அமைப்பைக் காத்து, திருச்சட்டத்தை அதன் நோக்கத்துக்குக் கொண்டுசெல்லும் நிறைவைச் சுட்டுகிறது; ‘நிறைவேற்றுதல்’ என்ற வினைமயமாக்கலைத் தவிர்க்கிறது.
- source_word: νόμου
  choice: திருச்சட்டத்தின்
  rationale: இச்சூழலில் மோசேயின் சட்டத்தைச் சுட்டும் νόμος என்பதற்கு, சாதாரணச் சட்டத்திலிருந்து வேறுபடுத்தும் தெளிவான மற்றும் வழக்கமான தமிழ் இணைச்சொல்.
theological_decisions:
- issue: அன்புக்கும் திருச்சட்டத்துக்கும் உள்ள உறவு
  choice: அன்பே திருச்சட்டத்தின் நிறைவு
  alternative: அன்பு திருச்சட்டத்தை நிறைவேற்றுகிறது
  rationale: கிரேக்கத்தில் இது வினைச்சொல் கூற்றாக அல்லாமல் பெயர்ச்சொல் பயனிலையைக் கொண்ட வாக்கியம். ஆகவே அன்பு எவ்வாறு ஒவ்வொரு கட்டளையையும் நிறைவேற்றுகிறது என்று மேலதிகமாக விளக்காமல், மூலத்தின் இறையியல் அழுத்தத்தையும் இலக்கண வடிவத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. மூலத்தில் தனிப்பட்ட அடிக்குறிப்பு தேவைப்படும் அளவிலான உரை வேறுபாடு இல்லை.
