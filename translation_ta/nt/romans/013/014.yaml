id: ROM.13.14
reference: Romans 13:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: ta
  text: ஆனால், ஆண்டவராகிய இயேசு மெசியாவை அணிந்துகொள்ளுங்கள்; மாம்சத்தின் ஆசைகளுக்காக எந்த ஏற்பாடும் செய்யாதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவ இயல்பின் ஆசைகளுக்காக எந்த ஏற்பாடும் செய்யாதீர்கள்.” கிரேக்கத்தில் “மாம்சம்” என்று உள்ளது; கடவுளால் வழிநடத்தப்படும் வாழ்வுக்கு எதிரான, வீழ்ச்சியுற்ற மனித உந்துதல்களைக் குறிக்க பவுல் இச்சொல்லை அடிக்கடி பயன்படுத்துகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: அணிந்துகொள்ளுங்கள்
  rationale: ஆடை அணியும் உருவகத்தை நேரடியாகவும் இயல்பான தமிழிலும் காக்கிறது; இயேசு மெசியாவுடன் அடையாளப்படுத்தப்பட்ட வாழ்க்கைமுறையை ஏற்கும் பொருளையும் சுமக்கிறது.
- source_word: τὸν κύριον Ἰησοῦν Χριστόν
  choice: ஆண்டவராகிய இயேசு மெசியா
  rationale: κύριος என்பதன் பட்டப்பெயர்ச் சிறப்பை ‘ஆண்டவர்’ எனவும், Χριστός என்பதன் அபிஷேகம் பெற்ற அரசரைக் குறிக்கும் பட்டப்பெயரை ‘மெசியா’ எனவும் காக்கிறது. தமிழ் வேற்றுமை அமைப்பில் முழுத் தொடரும் ‘ஆண்டவராகிய இயேசு மெசியாவை’ என வருகிறது.
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: எந்த ஏற்பாடும் செய்யாதீர்கள்
  rationale: முன்கூட்டியே திட்டமிடுதல் அல்லது தேவையானவற்றை ஆயத்தப்படுத்துதல் என்ற πρόνοιαν-ποιεῖσθε இணைப்பின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: σάρξ
  choice: மாம்சம்
  rationale: நெறிசார் சூழல் இருந்தாலும், பவுலின் பலபொருள் கொண்ட உருவகச் சொல்லை ‘பாவ இயல்பு’ என்று குறுகலாகத் தீர்மானிக்காமல் காக்கிறது.
- source_word: εἰς ἐπιθυμίας
  choice: ஆசைகளுக்காக
  rationale: εἰς என்பதன் நோக்கம் அல்லது விளைவை அளவுக்கு மீறி விரித்துரைக்காமல், கிரேக்கத்தின் சுருக்கத்தையும் ‘ஆசைகள்’ என்ற பரந்த பொருளையும் காக்கிறது.
theological_decisions:
- issue: நெறிசார் பவுலியச் சூழலில் σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: மாம்சம்
  alternative: பாவ இயல்பு
  rationale: இங்கு சீர்கெட்ட மனித உந்துதல்கள் குறிக்கப்படலாம்; ஆனாலும் ‘பாவ இயல்பு’ என்பது பவுலின் மனிதவியல் உருவகத்தை ஒரே கோட்பாட்டு விளக்கத்துக்குள் சுருக்கிவிடும். ஆகவே மூலத்தின் இறையியல் இழுபறியை முதன்மை உரை காக்கிறது; மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: Χριστός என்பது பெயரா பட்டப்பெயரா
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இத்தொடரில் Χριστός இயேசுவின் பட்டப்பெயரின் பொருளைத் தாங்குகிறது. ‘மெசியா’ அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயர்ச் சிறப்பை வாசகருக்குத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் தெளிவும் கொண்ட கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘அணிந்துகொள்ளுங்கள்’ என்ற ஆடை உருவகமும் ‘மாம்சம்’ என்ற பவுலியச் சொல்லும் திட்டமிட்டு காக்கப்பட்டுள்ளன; இறுதி சொற்றொடர் மூலத்தின் சுருக்கமான அமைப்புக்கு நெருக்கமாக உள்ளது.
