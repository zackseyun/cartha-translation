- from: ஆனால், ஆண்டவராகிய இயேசு மெசியாவை அணிந்துகொள்ளுங்கள்; மாம்சத்தின் ஆசைகளுக்காக அதற்கு எந்த ஏற்பாடும் செய்யாதீர்கள்.[a]
  to: ஆனால், ஆண்டவராகிய இயேசு மெசியாவை அணிந்துகொள்ளுங்கள்; மாம்சத்தின் ஆசைகளுக்காக எந்த ஏற்பாடும் செய்யாதீர்கள்.[a]
  rationale: The revision removes the extraneous pronoun “அதற்கு,” which caused an awkward and potentially confusing duplicate reference. The revised final clause remains compact, reflects the purpose-oriented force of εἰς ἐπιθυμίας, and does not add a more specific interpretive verb such as ‘gratify’ or ‘fulfill.’ The footnote is aligned with the revised wording.
