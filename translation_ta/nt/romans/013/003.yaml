id: ROM.13.3
reference: Romans 13:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: ta
  text: ஏனெனில், ஆட்சியாளர்கள் நற்செயலுக்கு அச்சுறுத்தலாக இருப்பதில்லை; தீய செயலுக்கே அச்சுறுத்தலாக இருக்கிறார்கள்.[a] அதிகாரத்துக்கு அஞ்சாமல் இருக்க விரும்புகிறாயா?[b] நல்லதைச் செய்; அப்போது அதனிடமிருந்து பாராட்டைப் பெறுவாய்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நல்ல நடத்தைக்கு … தீய நடத்தைக்கே.” கிரேக்கம் பொதுவான நெறிசார் பொருளில் நல்லதையும் தீயதையும் எதிரெதிராக வைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதிகாரத்துக்கு அஞ்ச விரும்பவில்லையா?”
    reason: lexical_alternative
  - marker: c
    text: அதாவது, ஆளும் அதிகாரத்திடமிருந்து.
    reason: referent_clarification
lexical_decisions:
- source_word: ἄρχοντες
  choice: ஆட்சியாளர்கள்
  rationale: ஆட்சி செய்பவர்களையோ ஆட்சிப் பதவி வகிப்பவர்களையோ குறிக்கிறது; அரசியல் சூழலைத் தேவையின்றி மிகக் குறிப்பாக்காமல் இயல்பாகத் தருகிறது.
- source_word: φόβος
  choice: அச்சுறுத்தலாக
  rationale: ஆட்சியாளர்கள் அச்சத்தை உண்டாக்கும் காரணமாக அல்லது அஞ்சத்தக்கவர்களாக இருப்பதைக் குறிக்கும் பயனிலைப் பயன்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῷ ἀγαθῷ ἔργῳ … τῷ κακῷ
  choice: நற்செயலுக்கு … தீய செயலுக்கே
  rationale: ἔργον ஒருமையில் இருந்தாலும் இங்கு பொதுவான நெறிசார் நடத்தையைச் சுட்டுகிறது; விடுபட்ட ἔργῳ என்பதை இரண்டாம் கூறிலும் தமிழில் வெளிப்படையாகக் கொடுத்து எதிர்மறை இணைப்பைத் தெளிவாக்குகிறது.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: அஞ்சாமல் இருக்க விரும்புகிறாயா?
  rationale: θέλεις மற்றும் எதிர்மறை வினையெச்சத்தின் நேரடி வினா அமைப்பைப் பாதுகாத்து, இயல்பான தமிழில் தருகிறது.
- source_word: τὴν ἐξουσίαν
  choice: அதிகாரத்துக்கு
  rationale: குறிப்பிட்ட ஆளும் அதிகார அமைப்பைக் குறிக்கும் ஒருமையைப் பாதுகாக்கிறது; தனிப்பட்ட அதிகாரியைக் குறிப்பதாகத் தேவையின்றி மாற்றவில்லை.
- source_word: τὸ ἀγαθὸν ποίει
  choice: நல்லதைச் செய்
  rationale: பெயர்ச்சியாகப் பயன்படும் உரிச்சொல்லை பொதுவான நெறிசார் நன்மையாகத் தருகிறது; தனித்தனி நற்செயல்களாக மட்டுப்படுத்தவில்லை.
- source_word: ἕξεις ἔπαινον ἐξ αὐτῆς
  choice: அதனிடமிருந்து பாராட்டைப் பெறுவாய்
  rationale: தமிழில் இயல்பான பெறுதல் சொற்றொடரைப் பயன்படுத்துகிறது; பெண்பால் ஒருமைச் சுட்டுப்பெயர் ἐξουσίαவைச் சுட்டுவதால், பாலற்ற ‘அதனிடமிருந்து’ என்று மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ஆட்சியாளர்கள், நன்மை, தீமை குறித்த பவுலின் கூற்றின் வரம்பு
  choice: ஆளும் அதிகாரத்தின் இயல்பான அல்லது நோக்கப்பட்ட செயல்பாட்டைப் பற்றிய விளக்கக் கூற்றாக மொழிபெயர்த்தல்
  alternative: எல்லா ஆட்சியாளர்களும் எல்லாக் காலங்களிலும் நன்மையைப் பாராட்டி தீமையைத் தண்டிப்பார்கள் என்ற விதிவிலக்கற்ற கூற்றாகவோ, உரையில் குறியீடு இல்லாத நையாண்டியாகவோ மொழிபெயர்த்தல்
  rationale: மூலத்தின் நேரடியான கூற்றைத் தக்கவைத்தாலும், ஒவ்வொரு ஆட்சியாளரின் எல்லாச் செயல்களுக்கும் முழுமையான இறையியல் ஒப்புதலை மொழிபெயர்ப்பில் சேர்க்கவில்லை; உரையிலுள்ள பதற்றம் தீர்க்கப்படாமல் விடப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் அமைக்கப்பட்டது. கிரேக்கத்தின் நேரடி வினா அமைப்பு பாதுகாக்கப்பட்டுள்ளது; முதல் வாக்கியத்தின் சுருக்கமான எதிர்மறை இணைப்பு தமிழில் தெளிவுக்காக இணையான சொற்றொடர்களாக வழங்கப்பட்டுள்ளது.
