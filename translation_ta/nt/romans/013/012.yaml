reference: Romans 13:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: ta
  text: இரவு வெகுவாகக் கழிந்துவிட்டது[a]; பகல் நெருங்கிவிட்டது. ஆகவே, இருளின் செயல்களைக் களைந்தெறிவோமாக; ஒளியின் போர்க்கவசத்தை அணிந்துகொள்வோமாக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரவு முன்னேறிவிட்டது.” கிரேக்க வினைச்சொல் இரவு முன்னோக்கிச் சென்றிருப்பதாகச் சித்தரிக்கிறது; அதாவது, இரவின் பெரும்பகுதி கழிந்துவிட்டது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒளியின் ஆயுதங்களை.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ νὺξ
  choice: இரவு
  rationale: ‘பகல்’ என்பதுடன் எதிர்நிற்கும் கால உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; இதை ‘இருள்’ என்று மாற்றி அதன் அறநெறிப் பொருளை முன்கூட்டியே முடிவுசெய்யவில்லை.
- source_word: προέκοψεν
  choice: வெகுவாகக் கழிந்துவிட்டது
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘முன்னேறியது’ என்பதாக இருந்தாலும், இரவைப் பற்றிய இயல்பான தமிழில் அது பெருமளவு கடந்துவிட்டதைக் குறிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἡ ἡμέρα
  choice: பகல்
  rationale: ‘இரவு’ என்பதற்கு எதிரான கால மற்றும் அறநெறி உருவகத்தைப் பாதுகாக்கும் நேரடி மொழிபெயர்ப்பு.
- source_word: ἤγγικεν
  choice: நெருங்கிவிட்டது
  rationale: நெருங்கி இப்போது அருகில் இருக்கும் நிலையைக் கிரேக்க நிறைவுக்கால வடிவத்துக்கு ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀποβαλώμεθα
  choice: களைந்தெறிந்து
  rationale: ஆடையைக் கழற்றும் உருவகத்தின் வலிமையையும், அடுத்து வரும் ‘அணிந்துகொள்வோமாக’ என்ற இணை உருவகத்தையும் காக்கிறது.
- source_word: τὰ ἔργα
  choice: செயல்கள்
  rationale: அறநெறி சார்ந்த செயல்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; ‘கிரியைகள்’ என்பதைக் காட்டிலும் பொதுவாகப் புரியும்.
- source_word: τοῦ σκότους
  choice: இருளின்
  rationale: தீமை என்று விளக்கமாக மாற்றாமல், மூலத்தின் உருவகத்தையும் ‘ஒளி’ உடனான எதிர்மறையையும் பாதுகாக்கிறது.
- source_word: ἐνδυσώμεθα
  choice: அணிந்துகொள்வோமாக
  rationale: முதல் நபர் பன்மை அறிவுறுத்தலையும் ஆடை அணியும் உருவகத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: τὰ ὅπλα
  choice: போர்க்கவசம்
  rationale: ‘அணிந்துகொள்’ என்ற வினை காரணமாக அணியப்படும் போரணிகளைக் குறிக்கும் ‘போர்க்கவசம்’ முதன்மையாகத் தேர்ந்தெடுக்கப்பட்டது; ‘ஆயுதங்கள்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῦ φωτός
  choice: ஒளியின்
  rationale: இருளுக்கு எதிரான மூல உருவகத்தை விளக்கச் சேர்க்கையின்றி நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: இரவு–பகல் இறுதிக்கால உருவகம்
  choice: ‘இரவு’ மற்றும் ‘பகல்’ என்ற உருவகங்கள் அப்படியே வைக்கப்பட்டுள்ளன.
  alternative: ‘இருண்ட காலம் முடிவடைகிறது; புதிய காலம் வருகிறது’ போன்ற விளக்க மொழிபெயர்ப்பு.
  rationale: இந்த உருவகம் காலம், அறநெறி, மீட்பு வரலாறு ஆகிய பல பரிமாணங்களை ஒருங்கே கொண்டுள்ளது. அவற்றில் ஒன்றை மட்டும் வெளிப்படையாகத் தேர்ந்தெடுக்காமல் மூலத்தின் இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
- issue: ὅπλα τοῦ φωτός என்பதன் பொருள்
  choice: ஒளியின் போர்க்கவசம்
  alternative: ஒளியின் ஆயுதங்கள்
  rationale: ‘அணிந்துகொள்வோமாக’ என்பது அணியத்தக்க போரணியைச் சுட்டுவதால் ‘போர்க்கவசம்’ முதன்மை உரையில் பொருத்தமாகிறது. எனினும் ὅπλα என்பது ‘ஆயுதங்கள்’ என்றும் பொருள்படுவதால் அந்த உண்மையான பொருள் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதவாக்கியத்திற்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘களைந்தெறிந்து / அணிந்துகொள்வோமாக’ என்ற இணைச்சொற்கள் ஆடை உருவகத்தை இயல்பாகக் காக்கின்றன; ‘போர்க்கவசம்’ போரியல் உருவகத்தையும் தெளிவுபடுத்துகிறது.
