id: ROM.13.9
reference: Romans 13:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: ta
  text: ஏனெனில், “விபசாரம் செய்யாதே; கொலை செய்யாதே[a]; திருடாதே; இச்சிக்காதே” என்ற கட்டளைகளும், வேறு ஏதேனும் கட்டளையும், “உன்னைப் போல உன் அயலாரை அன்புகூரு” என்ற இந்தக் கூற்றில்[b] தொகுத்துச் சொல்லப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘கொலை செய்யாதே’ என்பதே துல்லியமான பொருள்; கிரேக்க வினைச்சொல் பொதுவாக எல்லாவகை உயிர்க்கொல்லுதலையும் அல்ல, சட்டவிரோதமான கொலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இந்த வார்த்தையில்’ அல்லது ‘இந்த வாக்கில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் இச்சூழலில் ‘வார்த்தை,’ ‘கூற்று,’ அல்லது ‘சொல்லுரை’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: ஏனெனில்
  rationale: γάρ என்பதன் விளக்கமளிக்கும் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; அதைத் தொடர்ந்து கட்டளைகளின் உள்ளடக்கம் நேரடியாக வருகிறது.
- source_word: μοιχεύσεις
  choice: விபசாரம் செய்யாதே
  rationale: பத்துக் கட்டளையின் மேற்கோளில் எதிர்கால வினை வடிவம் கட்டளையாகச் செயல்படுகிறது. தமிழில் இயல்பான தடை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: φονεύσεις
  choice: கொலை செய்யாதே
  rationale: φονεύω பொதுவாக எல்லாவகை உயிர்க்கொல்லுதலையும் அல்ல, கொலை செய்வதையே குறிக்கிறது.
- source_word: κλέψεις
  choice: திருடாதே
  rationale: மேற்கோள் செய்யப்பட்ட தடைச் சட்டத்தின் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: ἐπιθυμήσεις
  choice: பிறருக்குரியதை இச்சிக்காதே
  rationale: பத்துக் கட்டளையின் சூழலில் ἐπιθυμέω என்பது பொதுவான விருப்பத்தை அல்ல, பிறருக்குரியதைத் தனதாக்க விரும்பும் இச்சையைச் சுட்டுகிறது. தமிழில் பொருளைத் தெளிவுபடுத்த குறிக்கப்படும் பொருள் வெளிப்படையாகச் சொல்லப்பட்டுள்ளது.
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: வேறு எந்தக் கட்டளை இருந்தாலும்
  rationale: τις என்பதன் வரையறுக்கப்படாத விரிவையும் ἑτέρα என்பதன் ‘வேறு’ என்ற பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀνακεφαλαιοῦται
  choice: தொகுத்துக் கூறப்படுகிறது
  rationale: பல கட்டளைகள் ஒரே தலைப்புச் சொல்லில் ஒன்றுசேர்த்து சுருக்கப்படுகின்றன என்ற வினையின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: இந்தக் கூற்றில்
  rationale: λόγος இங்கு தனி வார்த்தையைவிட பின்வரும் முழுக் கூற்றைக் குறிக்கிறது; ‘கூற்று’ அந்தச் சூழற்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἀγαπήσεις
  choice: அன்புகூரு
  rationale: வேதாகம மேற்கோளிலுள்ள எதிர்கால வடிவத்தின் கட்டளைச் செயல்பாட்டை நவீனத் தமிழின் நேரடி கட்டளை வடிவில் தருகிறது.
- source_word: πλησίον
  choice: அயலார்
  rationale: லேவியராகம மேற்கோளுடனான தொடர்பைப் பாதுகாக்கும், தமிழில் நிலைபெற்றதும் புரிந்துகொள்ளத்தக்கதுமான இணைச்சொல்.
- source_word: ὡς σεαυτόν
  choice: உன்னைப் போல
  rationale: கிரேக்கத்தின் சுருக்கமான ஒப்பீட்டை விளக்கவுரை சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: மேற்கோள் செய்யப்பட்ட பத்துக் கட்டளைகளின் இலக்கண வடிவம்
  choice: 'தமிழில் நேரடி எதிர்மறைக் கட்டளை வடிவம்: ‘செய்யாதே’'
  alternative: சடங்கு/பழைய நடையிலான ‘செய்யாதிருப்பாயாக’
  rationale: கிரேக்க எதிர்கால வடிவம் இங்கு பொருளில் கட்டளையாக உள்ளது. நவீனத் தமிழில் நேரடி கட்டளை வடிவம் அதே சட்ட வலிமையை இயல்பாக வெளிப்படுத்துகிறது; மேற்கோள் குறிகள் அதன் வேதாகம மேற்கோள் தன்மையைப் பாதுகாக்கின்றன.
- issue: λόγος என்பதன் பரப்பு
  choice: முழுச் சுருக்கக் கூற்றைக் குறிக்கும் ‘கூற்று’
  alternative: ‘வார்த்தை’ அல்லது ‘வாக்கு’
  rationale: பவுல் ஒரு தனிச் சொல்லைக் குறிப்பிடாமல், தொடர்ந்து வரும் வேதாகம வாக்கியத்தைச் சுட்டுகிறார். ‘கூற்று’ இதைத் தெளிவுபடுத்துகிறது; இருப்பினும் மூலச்சொல்லின் மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘உன்னைப் போல’ என்ற ஒப்பீட்டின் பொருள்
  choice: மூலத்தின் சுருக்கமான ஒப்பீட்டை அப்படியே வைத்தல்
  alternative: ‘உன்மீது நீ அன்புகூருவதுபோல’ என்று விரித்துரைத்தல்
  rationale: விரித்த வடிவம் தன்னன்பைப் பற்றிய வெளிப்படையான கருத்தைச் சேர்க்கக்கூடும். மூலத்தில் உள்ள சுருக்கத்தையும் அதன் இயல்பான இறையியல் நெருக்கடியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் நேரடி கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘அயலார்’ வேதாகம இடைஉரைத் தொடர்பைப் பாதுகாக்கும் நிலைபெற்ற சொல். மேற்கோளின் கண்ணியமும் பவுலின் சுருக்கமான வாத அமைப்பும் காக்கப்பட்டுள்ளன.
