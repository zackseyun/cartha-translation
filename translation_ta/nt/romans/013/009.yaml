revisions:
- from: ஏனெனில், “விபசாரம் செய்யாதே; கொலை செய்யாதே[a]; திருடாதே; பிறருக்குரியதை இச்சிக்காதே” என்பதும், வேறு எந்தக் கட்டளை இருந்தாலும், அதுவும் “உன்னைப் போல உன் அயலாரிடமும் அன்புகூரு” என்ற இந்தக் கூற்றில்[b] தொகுத்துக் கூறப்படுகிறது.
