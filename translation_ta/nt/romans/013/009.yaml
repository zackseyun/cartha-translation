  rationale: The revision makes explicit in idiomatic Tamil that the enumerated commandments and any other command are all summed up in the command to love one’s neighbor. It removes the unexpressed object from ‘covet,’ preserves the concise Decalogue form, and renders the neighbor as the direct object of love. Footnote anchors and their lexical functions are retained.
