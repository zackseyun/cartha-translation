revisions:
- from: ஆகவே, நீங்கள் ஆட்சியாளர்களுக்குக் கீழ்ப்பட்டிருக்க வேண்டியது அவசியம்[a]; சினத்தின் காரணமாக மட்டுமல்ல[b], மனச்சாட்சியின் காரணமாகவும் அவசியம்.
  to: ஆகவே, ஆட்சியாளர்களுக்குக் கீழ்ப்பட்டிருக்க[a] வேண்டியது அவசியம்; சினத்தின் காரணமாக மட்டுமல்ல[b], மனச்சாட்சியின் காரணமாகவும்.
  rationale: The revision removes the duplicated predicate of necessity, so that both “சினத்தின் காரணமாக” and “மனச்சாட்சியின் காரணமாக” clearly modify the one necessity to be subject. It also relocates the lexical-alternative footnote to its proper anchor. The ambiguity of ὀργή is retained without identifying it as exclusively human or divine.
