source:
  edition: SBLGNT
  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: ta
  text: ஆகவே, ஆட்சியாளர்களுக்குக் கீழ்ப்பட்டிருக்க[a] வேண்டியது அவசியம்; சினத்தின் காரணமாக மட்டுமல்ல[b], மனச்சாட்சியின் காரணமாகவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களைக் கீழ்ப்படுத்திக்கொள்ள.”
    reason: lexical_alternative
  - marker: b
    text: “சினம்” என்பது ஆட்சியாளரின் தண்டனை நடவடிக்கையையோ, இன்னும் விரிவாக ஆட்சி அதிகாரத்தின் மூலம் செயல்படும் இறைச் சினத்தையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் ஆட்சி அதிகாரங்களைப் பற்றிக் கூறியதிலிருந்து முடிவை வருவிக்கும் இணைப்புச் சொல்; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀνάγκη
  choice: வேண்டியது அவசியம்
  rationale: தவிர்க்க முடியாத கடமை அல்லது தேவையைச் சுட்டும் ஆளற்ற கூற்றின் வலிமையைத் தக்கவைக்கிறது.
- source_word: ὑποτάσσεσθαι
  choice: கீழ்ப்பட்டிருக்க
  rationale: ஆட்சி அதிகாரங்களுடன் தொடர்புடைய சூழலில், அவர்களுக்குக் கீழான நிலையில் தன்னை வைத்துக்கொள்ளும் நிலைப்பாட்டை வெளிப்படுத்துகிறது; எல்லையற்ற கீழ்ப்படிதலை உரையில் சேர்க்கவில்லை.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: மட்டுமல்ல … காரணமாகவும்
  rationale: கிரேக்கத்தின் இணையான எதிர்மறை–சேர்க்கை அமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: διὰ τὴν ὀργὴν
  choice: சினத்தின் காரணமாக
  rationale: διά + வேற்றுமை வடிவம் காரணம் அல்லது தூண்டுதலைக் குறிக்கிறது. ὀργή என்பதன் அடிப்படைப் பொருளைத் தக்கவைத்து, அது ஆட்சியாளரின் தண்டனை நடவடிக்கையையா அல்லது ஆட்சி அதிகாரத்தின் மூலம் செயல்படும் இறைச் சினத்தையா குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: διὰ τὴν συνείδησιν
  choice: மனச்சாட்சியின் காரணமாக
  rationale: வெளிப்புறத் தண்டனை அச்சத்தைத் தாண்டிய உள்ளார்ந்த ஒழுக்க உணர்வை, மூலத்தின் காரணப்பொருளுடன் நேரடியாகக் கூறுகிறது.
theological_decisions:
- issue: ὀργή (‘சினம்’) என்பதன் குறிப்பு
  choice: ‘சினம்’ என்று மட்டும் மொழிபெயர்த்து, அதன் உரியவரைத் தீர்மானிக்காமல் வைத்தல்
  alternative: ‘ஆட்சியாளரின் தண்டனை’ அல்லது ‘கடவுளின் சினம்’
  rationale: உடனடிச் சூழலில் கடவுள் ஏற்படுத்திய ஆட்சி அதிகாரமும் வாளை ஏந்தும் ஆட்சியாளரும் இடம்பெறுகின்றனர்; இவ்வசனத்தில் கிரேக்கம் சினத்தின் உரியவரை வெளிப்படையாகக் குறிப்பிடவில்லை.
- issue: ὑποτάσσεσθαι என்பதன் வலிமை
  choice: கீழ்ப்பட்டிருக்க
  alternative: கீழ்ப்படிய அல்லது தன்னை உட்படுத்திக்கொள்ள
  rationale: ஆட்சி அதிகாரங்களுக்கு உரிய நிலைப்பாட்டைத் தெரிவிக்கிறது; உரை வெளிப்படையாகச் சொல்லாத முழுமையான அல்லது நிபந்தனையற்ற கீழ்ப்படிதல் என்ற கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. சூழலில் உள்ள ஆட்சி அதிகாரங்கள் தெளிவாகத் தெரிய ‘ஆட்சியாளர்களுக்கு’ என்பது தமிழில் வெளிப்படுத்தப்பட்டுள்ளது. ‘சினம்’ என்ற சொல் மூலத்தின் கருத்தியல் தெளிவின்மையைப் பாதுகாக்கிறது.
