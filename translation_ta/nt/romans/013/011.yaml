id: ROM.13.11
reference: Romans 13:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: ta
  text: 'மேலும், காலத்தை அறிந்தவர்களாக, இதைச் செய்யுங்கள்: நீங்கள் தூக்கத்திலிருந்து விழித்தெழ வேண்டிய நேரம் ஏற்கெனவே ஆகிவிட்டது[a]. ஏனெனில், நாம் நம்பியபோது இருந்ததைவிட இப்போது நமது மீட்பு நெருங்கியுள்ளது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘நீங்கள்’ என்பதற்குப் பதிலாக ‘நாம்’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: ‘நாம் முதலில் நம்பியபோது இருந்ததைவிட’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க மூலத்தில் ‘நாம் நம்பியபோது’ என்றே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: மேலும், ... இவற்றைச் செய்யுங்கள்
  rationale: τοῦτο முந்தைய வசனங்களின் அறநெறி அறிவுறுத்தல்களைச் சுட்டுகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க, சூழலில் உள்ள மறைமுகக் கட்டளை வெளிப்படுத்தப்பட்டுள்ளது; பன்மையான அறிவுறுத்தல்களைச் சுட்டுவதால் ‘இவற்றை’ என வழங்கப்பட்டுள்ளது.
- source_word: εἰδότες τὸν καιρόν
  choice: காலத்தை அறிந்தவர்களாக
  rationale: பங்கேற்புவினையின் அமைப்பை முடிந்தவரை காத்து, καιρός குறிக்கும் தீர்மானமான காலச்சூழலை ‘காலம்’ என இயல்பாக வழங்குகிறது.
- source_word: ὅτι ὥρα ἤδη ὑμᾶς ἐξ ὕπνου ἐγερθῆναι
  choice: நீங்கள் தூக்கத்திலிருந்து விழித்தெழ வேண்டிய நேரம் ஏற்கெனவே வந்துவிட்டது
  rationale: ὥρα-வின் அவசரத்தையும் ἤδη-யின் ‘ஏற்கெனவே’ என்ற வலியுறுத்தலையும் காக்கிறது. ἐγερθῆναι குறிக்கும் தூக்கத்திலிருந்து எழும் உருவகம் இயல்பான நவீன தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: ஏனெனில், ... இப்போது நமது மீட்பு நெருங்கியுள்ளது
  rationale: γάρ காரணத்தை அறிமுகப்படுத்துவதையும் νῦν நிகழ்கால அவசரத்தையும் தெளிவாக்குகிறது. σωτηρία-வை இங்கு எதிர்நோக்கப்படும் நிறைவைத் திறந்துவைக்கும் வகையில் ‘மீட்பு’ என வழங்குகிறது.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: நாம் நம்பிக்கை கொண்டபோது இருந்ததைவிட
  rationale: ἐπιστεύσαμεν என்பதில் இல்லாத ‘முதலில்’ என்ற சொல்லைச் சேர்க்காமல், நம்பிக்கை கொண்ட கடந்த தருணத்துடன் செய்யப்படும் ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நம்பிக்கை கொண்டவர்களுக்கு இன்னும் நெருங்கிவரும் ‘மீட்பு’
  choice: ‘நமது மீட்பு’ என வரையறுக்காமல் வைத்தல்
  alternative: ‘இறுதி மீட்பு’ அல்லது ‘ஆண்டவரின் வருகையில் கிடைக்கும் மீட்பு’
  rationale: மீட்பு விசுவாசிகளுக்குரியது என்றும் அது இன்னும் நெருங்கிவருகிறது என்றும் வசனம் ஒரே நேரத்தில் கூறுகிறது. அதன் ஏற்கெனவே/இன்னும் இல்லை என்ற இறையியல் இழுவையை மொழிபெயர்ப்பு சுருக்கித் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், அதேவேளையில் கண்ணியமான வேதாகம நடையுடன் அமைக்கப்பட்டது. தூக்கம்–விழித்தெழுதல் உருவகமும் மீட்பின் எதிர்நோக்கும் தன்மையும் காக்கப்பட்டுள்ளன.
