id: ROM.13.7
reference: Romans 13:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: ta
  text: 'எல்லாருக்கும் அவரவருக்குரியதைச் செலுத்துங்கள்: வரி பெற வேண்டியவருக்கு வரியையும், சுங்கம் பெற வேண்டியவருக்கு சுங்கத்தையும், அஞ்சப்பட வேண்டியவருக்கு அச்சத்தையும், மதிக்கப்பட வேண்டியவருக்கு மதிப்பையும் செலுத்துங்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: செலுத்துங்கள்
  rationale: கடன்பட்டதைத் திருப்பிக் கொடுத்தல் அல்லது உரியதைச் செலுத்துதல் என்ற கட்டளைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ὀφειλάς
  choice: செலுத்த வேண்டியதை
  rationale: பணம் மட்டுமல்லாமல் அச்சம், மதிப்பு உள்ளிட்ட எல்லா உரிய கடமைகளையும் உள்ளடக்கும் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: φόρον
  choice: வரி
  rationale: பொதுவாக நேரடியாக விதிக்கப்படும் வரி அல்லது குடிமக்கள் செலுத்தும் வரியைச் சுட்டும் இயல்பான தமிழ் சொல்.
- source_word: τέλος
  choice: சுங்கம்
  rationale: φόρος என்பதிலிருந்து வேறுபடுத்தி, பொருட்கள் அல்லது பரிவர்த்தனைகள்மீது வசூலிக்கப்படும் கட்டணம்/சுங்கம் என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: φόβον
  choice: அச்சம்
  rationale: மூலச்சொல்லின் நேரடியான ‘fear’ பொருளையும், அதிகாரத்தின் முன் உரிய அஞ்சுதலையும் பாதுகாக்கிறது; அதை வெறும் ‘மரியாதை’ என மென்மைப்படுத்தவில்லை.
- source_word: τιμήν
  choice: மதிப்பு
  rationale: ஒருவருக்கு உரிய கண்ணியமான மதிப்பளித்தலைக் குறிக்கிறது; φόβος என்பதிலிருந்து சொற்பொருள் வேறுபாட்டைப் பாதுகாக்கிறது.
theological_decisions:
- issue: φόβος என்பதன் வலிமை
  choice: அச்சம்
  alternative: மரியாதை / பயபக்தி
  rationale: இங்கு மூல உரை φόβος மற்றும் τιμή ஆகியவற்றைத் தனித்தனியாகக் குறிப்பிடுகிறது. ‘அச்சம்’ என்பது அந்த வேறுபாட்டையும் வசனத்தின் பதற்றத்தையும் மறைக்காமல் வைக்கிறது.
- issue: அரசு அதிகாரங்களுக்கு உரிய கடமைகளின் பட்டியல்
  choice: மூலத்தில் உள்ள இணை அமைப்பையும் மீளுரைப்பையும் பாதுகாத்தல்
  alternative: வரி, சுங்கம், மரியாதை முதலிய அனைத்தையும் செலுத்துங்கள் எனச் சுருக்குதல்
  rationale: ஒவ்வொருவருக்கும் அவரவருக்கு உரியதை அளிக்க வேண்டும் என்ற வலியுறுத்தலை மூலத்தின் நான்கு மடங்கு அமைப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான பன்மைக் கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கமான இணை அமைப்பு தமிழில் தெளிவாக இருக்க தேவையான வினைச்சொல் இறுதியில் மீண்டும் வழங்கப்பட்டுள்ளது; தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
