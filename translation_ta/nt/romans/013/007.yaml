review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the fourfold structure and distinguishes φόρος (tax) from τέλος (customs duty/revenue), φόβος (fear), and τιμή (honor). However, in each paired phrase, “வரி செலுத்த வேண்டியவருக்கு” and analogous wording can mean “to the person who must pay tax,” reversing the Greek ellipsis: the recipient is the person to whom tax, duty, fear, or honor is owed.'
  naturalness: The opening and overall register are natural modern standard Tamil. Recasting the four recipients as those who are to receive tax/duty or to be feared/honored removes the role ambiguity and yields more idiomatic Tamil.
  terminology: வரி and சுங்கம் suitably distinguish φόρος and τέλος. அச்சம் preserves the lexical force of φόβος without conflating it with honor. மதிப்பு appropriately conveys τιμή in this parallel, though the construction is revised for clarity.
  issues:
  - severity: medium
    issue: The recipient phrases are semantically ambiguous and may reverse who owes and who receives.
    rationale: Greek τῷ τὸν φόρον / τῷ τὸ τέλος etc. means “to the one to whom tax/duty/fear/honor is due.” Tamil “வரி செலுத்த வேண்டியவருக்கு” most readily describes one who is obliged to pay tax, rather than one owed tax. The same issue affects the remaining three pairs.
  revised_text: 'எல்லாருக்கும் அவரவருக்குரியதைச் செலுத்துங்கள்: வரி பெற வேண்டியவருக்கு வரியையும், சுங்கம் பெற வேண்டியவருக்கு சுங்கத்தையும், அஞ்சப்பட வேண்டியவருக்கு அச்சத்தையும், மதிக்கப்பட வேண்டியவருக்கு மதிப்பையும் செலுத்துங்கள்.'
