id: ROM.13.13
reference: Romans 13:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: ta
  text: பகல்வேளையில் இருப்பதுபோல, கண்ணியமாக[a] நடந்துகொள்வோமாக—வெறிக் களியாட்டங்களிலும் குடிபோதைகளிலும் அல்ல; முறைகேடான பாலுறவுகளிலும் கட்டுப்பாடற்ற காம நடத்தைகளிலும் அல்ல; சண்டையிலும் பொறாமையிலும்[b] அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கண்ணியமாக’ என்பதற்கு ‘ஒழுங்காக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘பொறாமை’ என்று மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொல், சூழலைப் பொறுத்து ‘ஆர்வம்’ அல்லது ‘பிறர்பெற்றதை விரும்புதல்’ என்றும் பொருள்படும்; இந்தத் தீய நடத்தைகளின் பட்டியலில் அது எதிர்மறைப் பொருளில் வருகிறது.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: பகல்வேளையில் இருப்பதுபோல
  rationale: சுற்றியுள்ள பகல்–இருள் உருவகத்தை விளக்கமாக விரித்துவிடாமல், பகலில் வெளிப்படையாக வாழ்வதற்கு ஏற்ற நடத்தையைச் சுட்டும் சொற்றொடராக இயல்பான தமிழில் தருகிறது.
- source_word: εὐσχημόνως
  choice: கண்ணியமாக
  rationale: மதிப்புக்குரிய, ஒழுக்கமான, தகுந்த நடத்தையை குறிக்கும் வினையடையின் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: περιπατήσωμεν
  choice: நடந்துகொள்வோமாக
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் பவுலின் ‘நடத்தல்’ உருவகத்தையும், அனைவரையும் உட்படுத்தும் அறிவுறுத்தல் வடிவத்தையும் ஒருங்கே காக்கிறது.
- source_word: κώμοις
  choice: வெறிக் களியாட்டங்கள்
  rationale: மது அருந்துதலோடு தொடர்புடைய கட்டுப்பாடற்ற, கூச்சலான விருந்தாட்டங்களைக் குறிக்கிறது; சாதாரண மகிழ்ச்சிக் கொண்டாட்டம் என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘வெறிக்’ சேர்க்கப்பட்டுள்ளது.
- source_word: μέθαις
  choice: குடிபோதைகள்
  rationale: மது அருந்தி போதையடையும் நிலைகள் அல்லது குடிவெறிச் செயல்களை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: κοίταις
  choice: முறைகேடான பாலுறவுகள்
  rationale: சொல்லின் நேர்ப்பொருள் ‘படுக்கைகள்’ என்றாலும், இங்கு முறைகேடான பாலியல் உறவுகளைக் குறிக்கும் மரபுத்தொடர்; நேர்ப்பெயர்ப்பு தமிழில் பொருளை மறைத்துவிடும்.
- source_word: ἀσελγείαις
  choice: கட்டுப்பாடற்ற காம நடத்தைகள்
  rationale: வெட்கமற்ற, வரம்புமீறிய நடத்தையைக் குறிக்கிறது; முந்தைய பாலியல் சொல்லுடன் இணைந்துள்ள சூழலில் அதன் காமப் பரிமாணத்தைத் தெளிவாக்குகிறது, ஆனால் ஒரு குறிப்பிட்ட செயலை மட்டும் குறுக்கவில்லை.
- source_word: ἔριδι
  choice: சண்டை
  rationale: பிணக்கு, போட்டி மனப்பான்மை, வாக்குவாதம் ஆகியவற்றை உள்ளடக்கும் பொதுவானதும் தெளிவானதும் ஆன தமிழ் சொல்.
- source_word: ζήλῳ
  choice: பொறாமை
  rationale: ζῆλος நேர்மறையாக ‘ஆர்வம்’ என்றும் வரலாம்; ஆனால் இந்தத் தீய நடத்தைகளின் பட்டியலில் எதிர்மறையான பொறாமை அல்லது எரிச்சலான போட்டி மனப்பான்மையே பொருந்துகிறது.
theological_decisions:
- issue: பகல்–இருள் உருவகத்தின் அறநெறிப் பயன்பாடு
  choice: ‘பகல்வேளையில் இருப்பதுபோல’ என்று உருவகத்தை அப்படியே காத்தல்
  alternative: ‘எல்லாருக்கும் வெளிப்படையாக’ என்று அதன் உட்பொருளை மட்டும் கூறுதல்
  rationale: வசனம் சுற்றியுள்ள பகல்–இருள் எதிர்மறையோடு இணைந்துள்ளது. மொழிபெயர்ப்பு அந்த உருவகத்தைப் பாதுகாக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: κοίταις என்பதிலுள்ள பாலியல் மரபுத்தொடர்
  choice: ‘முறைகேடான பாலுறவுகள்’ என்று பொருள்வழி மொழிபெயர்த்தல்
  alternative: ‘படுக்கைகள்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: நேர்ப்பொருளான ‘படுக்கைகள்’ தமிழ் வாசகருக்கு அறநெறி சார்ந்த பாலியல் குறிப்பைத் தெளிவாக உணர்த்தாது. சூழலில் உறுதியான பொருளை மட்டும் வெளிப்படுத்துவது தெளிவையும் மூலத்தின் நோக்கையும் காக்கிறது.
- issue: ἀσελγείαις என்பதின் பரந்த அல்லது பாலியல் சார்ந்த பொருள்
  choice: ‘கட்டுப்பாடற்ற காம நடத்தைகள்’
  alternative: ‘வெட்கங்கெட்ட நடத்தைகள்’
  rationale: இச்சொல் பொதுவாக கட்டுப்பாடற்ற வெட்கமின்மையைக் குறிக்கக்கூடியது. இங்கு κοίταις உடன் இணைக்கப்பட்டிருப்பதால் பாலியல் சார்பு வலுவாக உள்ளது; இருப்பினும் குறிப்பிட்ட ஒரு பாலியல் செயல் என்று வரையறுக்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று ‘அல்ல’ தொடர்களின் இணை அமைப்பை அரைப்புள்ளிகளால் காத்து, வசனத்தின் தீய நடத்தைகள் பட்டியல் தெளிவாக ஒலிக்கச் செய்யப்பட்டுள்ளது.
