source:
  edition: SBLGNT
  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: ta
  text: ஒருவருக்கொருவர் அன்புகூருவதைத் தவிர, யாருக்கும் எதையும் கடன்பட்டிருக்காதீர்கள்; ஏனெனில் மற்றவரை[a] அன்புகூருகிறவர் திருச்சட்டத்தை நிறைவேற்றியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறொருவரை.” கிரேக்கத்தில், “மற்றவரை.”
    reason: τὸν ἕτερον என்பது ‘அயலாரை’ என்று அல்லாமல், பொதுவாக ‘மற்றவரை’ அல்லது ‘வேறொருவரை’ என்று பொருள்படக்கூடிய சொற்றொடர்.
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: யாரிடமும் எதையும் கடன்பட்டிருக்காதீர்கள்
  rationale: இரட்டை எதிர்மறையின் முழுமையான பரப்பையும் ‘கடன்பட்டிருத்தல்’ என்ற நிதி/கடமை சார்ந்த உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν
  choice: ஆனால் ஒருவருக்கொருவர் அன்புகூர வேண்டிய கடன் மட்டும் இருக்கட்டும்
  rationale: ‘தவிர’ என்று மட்டும் மொழிபெயர்த்தால் தமிழில் வாக்கியம் இறுக்கமாக ஒலிக்கும்; இவ்வடிவம் அன்பைத் தொடர்ந்து நிலைக்கும் ஒரே கடமையாகக் காட்டி, மூலத்தின் விதிவிலக்குக் கட்டமைப்பைப் பாதுகாக்கிறது.
- source_word: ἀγαπᾶν / ἀγαπῶν
  choice: அன்புகூர / அன்புகூருகிறவர்
  rationale: ἀγαπάω என்பதன் செயற்பாட்டு அர்த்தத்தையும் வேதாகமச் சொற்பயன்பாட்டின் தொடர்ச்சியையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τὸν ἕτερον
  choice: மற்றவரிடம்
  rationale: மூலத்தில் உள்ள ‘the other’ என்ற பொதுமையான ஒருமைச் சுட்டலைப் பாதுகாக்கிறது; இங்கு நேரடியாக இல்லாத ‘அயலார்’ என்ற சொல்லை இறக்குமதி செய்யவில்லை.
- source_word: νόμον
  choice: திருச்சட்டத்தை
  rationale: இச்சூழலில் பவுல் குறிப்பிடும் அறியப்பட்ட இறைச்சட்டத்தைத் தெளிவாகக் குறிக்கிறது; சாதாரண சட்டம் என்று தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
- source_word: πεπλήρωκεν
  choice: நிறைவேற்றியிருக்கிறார்
  rationale: நிறைவேற்றி அதன் விளைவு தொடர்ந்து நிலைப்பதைக் காட்டும் கிரேக்க நிறைநிலைக் காலத்தின் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடன்படுதலைப் பற்றிய தடை எந்த அளவுக்கு பொருந்துகிறது
  choice: கடன்பட்டிராதீர்கள் என்ற கட்டளையை நேரடியாக மொழிபெயர்த்து, பரஸ்பர அன்பை மட்டும் தொடரும் கடனாக வைத்தல்
  alternative: எல்லாவிதமான கடன் வாங்குதலுக்கும் முழுமையான தடை என்று விளக்குதல்; அல்லது இதை நெறிக்கடமை குறித்த உருவகம் மட்டுமே என்று கருதுதல்
  rationale: கிரேக்க வாசகம் கடன்படுதலைக் குறிப்பிடுகிறது; பின்னர் அன்பை விதிவிலக்காக வைக்கிறது. எல்லா நிதிக் கடன்களையும் குறித்த விரிவான கோட்பாட்டை வசனத்துக்குள் சேர்க்காமல் அதன் இறையியல் இழுவிசையை மொழிபெயர்ப்பு காக்கிறது.
- issue: νόμος என்பதன் குறிப்பு
  choice: ‘திருச்சட்டம்’ என்று மொழிபெயர்த்தல்
  alternative: பொதுவான ‘சட்டம்’ என்று மொழிபெயர்த்தல்
  rationale: அடுத்த வசனங்களில் மோசேயின் கட்டளைகள் எடுத்துரைக்கப்படுவதால், இங்கு நோக்கப்படுவது இறைச்சட்டம் என்பதைத் தமிழ் வாசகருக்குத் தெளிவாக்குகிறது; அதேவேளை குறிப்பிட்ட பிரிவுசார் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடன் மட்டும் இருக்கட்டும்’ என்பது மூலத்தின் தொடரும் அன்புக் கடமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அயலார்’ போன்ற சூழலிலிருந்து ஊகிக்கப்படும் சொல்லைச் சேர்க்காமல் மூலத்தின் பொதுமையைப் பாதுகாக்கிறது.
