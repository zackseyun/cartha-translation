  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: ta
  text: அப்படியானால் நாம் என்ன சொல்வோம்? கடவுளின் தரப்பில் அநீதி உண்டா?[a] ஒருபோதும் இல்லை![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளிடம் அநீதி இருக்கிறதா?’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘அப்படி ஆகாதிருப்பதாக!’ மிகவும் வலியுறுத்தப்பட்ட மறுப்பு; ‘நிச்சயமாக இல்லை!’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: அப்படியானால் நாம் என்ன சொல்வோம்?
  rationale: பவுல் ஒரு முடிவையோ எதிர்வினாவையோ அறிமுகப்படுத்த வழக்கமாகப் பயன்படுத்தும் வினா வடிவத்தை இயல்பான நவீனத் தமிழில் காக்கிறது; ἐροῦμεν என்பதன் எதிர்கால வினை வடிவமும் பிரதிபலிக்கிறது.
- source_word: μὴ
  choice: உண்டா?
  rationale: μή எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவைக் குறிக்கிறது. தமிழில் இயல்பான சொல்லாட்சியுடன் கூடிய வினாவாக மொழிபெயர்ப்பது அந்தச் சொல்லின் உரையாடல் செயல்பாட்டைத் தருகிறது.
- source_word: ἀδικία
  choice: அநீதி
  rationale: இச்சூழலில் கடவுளின் செயல்பாட்டில் நியாயமின்மை இருக்கிறதா என்ற எதிர்வினையே முன்வைக்கப்படுகிறது. ‘அநீதி’ என்பது அதன் ஒழுக்க மற்றும் நீதிசார் பொருளைத் தெளிவாகத் தரும் பொதுவான நவீனத் தமிழ்ச் சொல்.
- source_word: παρὰ τῷ θεῷ
  choice: கடவுளிடம்
  rationale: இங்கு παρά உடன் வரும் சொற்றொடர் ‘கடவுளின் பக்கத்தில்’ அல்லது ‘கடவுளில்’ அநீதி உள்ளதா என்னும் பொருளுடையது. ‘கடவுளிடம்’ என்பது கிரேக்கத்தின் உறவுசார் சொல்லமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: μὴ γένοιτο
  choice: ஒருபோதும் இல்லை!
  rationale: இது பவுலின் மிகவும் வலியுறுத்தப்பட்ட மறுப்பு. சொற்சொல்லான ‘அப்படி ஆகாதிருப்பதாக’ என்பதைக் காட்டிலும் ‘ஒருபோதும் இல்லை!’ நவீனத் தமிழில் அதே மறுப்பின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ரோமர் 9-ன் விரிந்த இறையியல் விவாதத்தை இவ்வசனத்தின் சுருக்கமான எதிர்வினைக்குள் சேர்க்கலாமா என்பது
  choice: கடவுளிடம் அநீதி உண்டா என்ற எதிர்வினையையும் அதன் வலுவான மறுப்பையும் மட்டுமே மொழிபெயர்த்தல்
  alternative: ‘கடவுள் அநீதியானவரா?’ என்று கடவுளின் தன்மையை நேரடியாக விவரித்தல், அல்லது தெரிந்தெடுத்தல் குறித்த விளக்கத்தைச் சேர்த்தல்
  rationale: கிரேக்கம் அநீதி குறித்த எதிர்வினையைச் சுருக்கமாக முன்வைத்து அதைத் திட்டவட்டமாக மறுக்கிறது. தெரிந்தெடுத்தல், நிராகரித்தல் அல்லது தெய்வீக நியாயம் பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டை இவ்வசனத்தில் சேர்ப்பது மூலத்தில் இல்லாத விளக்கமாகிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கேள்வி–மறுப்பு என்ற பவுலின் சுருக்கமான சொல்லாற்றலும் இறையியல் பதற்றமும் விளக்கச் சேர்க்கையின்றிக் காக்கப்பட்டுள்ளன.
