- source_word: οὐκ ἐκ πίστεως
  choice: விசுவாசத்திலிருந்து அல்ல
  rationale: ἐκ என்பதன் ‘இலிருந்து/அடிப்படையிலிருந்து’ என்ற கருத்தைத் தக்கவைத்து, πίστις என்பதை வழக்கமான இறையியல் சொல்லான ‘விசுவாசம்’ என்று மொழிபெயர்க்கிறது.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: செயல்களிலிருந்து வருவதுபோல்
  rationale: ὡς தரும் ‘உண்மையில் அப்படியே என்று கூறாமல், அப்படியிருப்பதுபோல்’ என்ற நுணுக்கத்தைப் பாதுகாக்கிறது; ἔργα என்பதற்கு தெளிவான ‘செயல்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: προσέκοψαν
  choice: இடறினார்கள்
  rationale: ஒரு தடையில் கால் தடுக்கி இடறும் உருவகத்தை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: இடறச் செய்யும் கல்
  rationale: πρόσκομμα என்பதன் தடையாகி இடறச் செய்யும் பொருளையும், προσέκοψαν உடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: πίστις என்பதன் பொருள்—விசுவாசம், நம்பிக்கை, அல்லது உண்மைத்தன்மை
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இங்கு செயல்களுடன் எதிரெதிராக நிறுத்தப்படும் பவுலின் கருத்துப்பிரிவை ‘விசுவாசம்’ தெளிவாகக் காட்டுகிறது; இச்சூழல் ‘உண்மைத்தன்மை’ என்ற பொருளைக் கட்டாயப்படுத்தவில்லை.
- issue: ὡς ἐξ ἔργων என்பதில் ὡς தரும் நுணுக்கம்
  choice: செயல்களிலிருந்து வருவதுபோல்
  alternative: செயல்களால்
  rationale: ‘செயல்களால்’ என்று நேரடியாக்காமல், ‘அப்படியிருப்பதுபோல்’ என்ற கிரேக்கத்தின் திட்டமிட்ட மிதப்படுத்தலைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தில் விடுபட்டுள்ள ‘நாடினார்கள்’ என்ற கருத்து தமிழில் வாக்கியத் தெளிவுக்காகச் சேர்க்கப்பட்டு அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது. ‘இடறு’ என்ற சொல் வினையிலும் பெயரடையிலும் மீண்டும் பயன்படுத்தப்பட்டு கிரேக்கச் சொல்விளையாட்டு இயன்றவரை காக்கப்பட்டுள்ளது.
