  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: ta
  text: ஏன்? அவர்கள் அதை விசுவாசத்தின் அடிப்படையில் தேடாமல், செயல்களின் அடிப்படையில் தேடுவதுபோல் தேடினார்கள்[a][b]. அவர்கள் இடறச் செய்யும் கல்லின்மேல் இடறினார்கள்[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசத்தினால் அல்ல” அல்லது “விசுவாசத்திலிருந்து அல்ல.” கிரேக்கத்தில் எழுத்துப்படி, “விசுவாசத்திலிருந்து அல்ல.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘தேடினார்கள்’ என்ற வினைச்சொல் இவ்வசனத்தில் வெளிப்படையாக இல்லை; அது முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படுகிறது. அல்லது, “ஆனால் செயல்களின் அடிப்படையில் தேடுவதுபோல்.”
    reason: ellipsis_and_lexical_alternative
  - marker: c
    text: அல்லது, “தடைக்கல்லின்மேல்” அல்லது “இடறலின் கல்லின்மேல்.”
    reason: lexical_alternative
  - marker: d
    text: இது ஏசாயா 8:14-ஐச் சுட்டுகிறது; அடுத்த வசனத்தில் வரும் ஏசாயா 28:16-ஐயும் ஒப்பிடுக.
    reason: cross_reference
