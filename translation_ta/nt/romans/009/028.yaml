  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: ta
  text: ஏனெனில், ஆண்டவர் தமது வார்த்தையைப் பூமியின்மேல் நிறைவேற்றுவார்[a][c]; அதை முடிவுக்குக் கொண்டுவந்து சுருக்குவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவர் அந்தக் காரியத்தை/தீர்ப்பை பூமியின்மேல் நிறைவேற்றுவார்.”
    reason: lexical_alternative
  - marker: b
    text: “சுருக்குவார்” என்பதை “குறுக்கி முடிப்பார்” என்றும், அதன் உட்கருத்தின்படி “விரைவாக நிறைவேற்றுவார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: ஏசாயா நூலின் மூலச் சூழலைக் கருத்தில் கொண்டு சிலர் ἐπὶ τῆς γῆς என்பதை “நாட்டில்” என மொழிபெயர்க்கிறார்கள்; இங்கு ரோமர் கடிதத்தின் கிரேக்க வாசகம் “பூமியின்மேல்” என உள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: தமது வார்த்தையை
  rationale: இங்கு λόγον என்பது ஆண்டவர் உரைத்ததை அவர் செயல்படுத்துவதைச் சுட்டுகிறது. ‘வார்த்தை’ என்பது உரைத்தல்/அறிவித்தல் என்ற பொருளைப் பாதுகாக்கிறது; ‘தமது’ என்பது κύριος என்னும் எழுவாயிலிருந்து தமிழில் இயல்பாக வருவிக்கப்பட்டது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை γάρ அறிமுகப்படுத்துவதால், பவுலின் வாத ஓட்டத்தை ‘ஏனெனில்’ தெளிவாகக் காட்டுகிறது.
- source_word: συντελῶν
  choice: அதை முடிவுக்குக் கொண்டுவந்து
  rationale: செயலை அதன் நிர்ணயிக்கப்பட்ட முடிவுக்கு எடுத்துச் செல்லும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ συντέμνων
  choice: சுருக்கி நிறைவேற்றுவார்
  rationale: συντέμνω என்பதிலுள்ள ‘குறுக்குதல்/சுருக்குதல்’ என்ற உருவக வலிமையையும், தெய்வச் செயல் முடிவுறுவதையும் பாதுகாக்கிறது; ‘விரைவாக’ என்று மட்டும் மொழிபெயர்த்து பொருளை ஒரே விளக்கத்துக்குள் அடைக்கவில்லை.
- source_word: ποιήσει
  choice: நிறைவேற்றுவார்
  rationale: λόγον என்பதுடன் சேர்ந்து, ஆண்டவர் தாம் உரைத்ததைச் செயலாக்குவார் என்ற பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: வேதாகம மேற்கோளில் தேவனைக் குறிக்கும் κύριος என்பதற்கான இயல்பான, கண்ணியமான நவீனத் தமிழ் வடிவம்.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியின்மேல்
  rationale: ரோமர் கடிதத்தில் உள்ள கிரேக்கச் சொற்றொடரின் விரிவான ‘பூமியின்மேல்’ என்ற பொருளை முன்னிலைப்படுத்துகிறது; ஏசாயாவின் மூலச் சூழலைக் கொண்டு அதை ‘நாட்டில்’ எனக் குறுக்கவில்லை.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் தெய்வச் செயலின் தன்மை
  choice: ஆண்டவர் தாம் உரைத்த வார்த்தையை வரலாற்றிலும் நியாயத்தீர்ப்பிலும் உறுதியாக முடிவுக்குக் கொண்டுவருகிறார் என்ற பொதுவான பொருள் பாதுகாக்கப்பட்டது.
  alternative: ஆண்டவர் ஒரு நீதித்தீர்ப்பை விரைவாக நிறைவேற்றுகிறார்; அல்லது இரட்சிப்பு/நியாயத்தீர்ப்புச் செயலைச் சுருக்கி முடிக்கிறார்.
  rationale: இணையான வினையெச்சங்களில் நீதித்தீர்ப்பின் நிழல் இருக்கலாம்; ஆனால் கிரேக்கம் குறிப்பாகத் தீர்மானிக்காத ஒரு கோட்பாட்டு அமைப்பை மொழிபெயர்ப்பில் புகுத்தாமல், நிறைவு மற்றும் குறுக்குதல் ஆகிய இரு பதற்றங்களும் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் செறிவையும் ‘முடிவுக்குக் கொண்டுவருதல்/சுருக்குதல்’ என்ற பொருள் பதற்றத்தையும் காக்க சிறு மறுபடிச் சொல்லல் அனுமதிக்கப்பட்டுள்ளது.
