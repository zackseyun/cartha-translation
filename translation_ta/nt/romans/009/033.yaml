id: ROM.9.33
reference: Romans 9:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: ta
  text: 'எழுதியிருக்கிறபடி[a]: “இதோ, சீயோனில் தடுக்கி விழச் செய்யும் ஒரு கல்லையும், இடறலுண்டாக்கும் ஒரு பாறையையும் வைக்கிறேன்; அவர்மேல்[b] நம்பிக்கை வைக்கிறவர் அவமானத்துக்கு உள்ளாகமாட்டார்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு பவுல் ஏசாயா 8:14 மற்றும் ஏசாயா 28:16 ஆகியவற்றின் சொற்களை இணைத்து மேற்கோள் காட்டுகிறார்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “அதன்மேல்.” கிரேக்கச் சொல் கல்/பாறையையோ ஒரு நபரையோ சுட்டக்கூடும்; பவுலின் சூழல் இந்த உருவகத்தை மேசியாவுக்குப் பொருத்துகிறது.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “ஏமாற்றமடையமாட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: எழுதியிருக்கிறபடி
  rationale: வேதவசன மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது; கிரேக்க நிறைவேற்றப்பட்ட செயற்பாட்டு வடிவத்தின் தொடரும் பொருத்தத்தையும் காக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லின் சுட்டிக்காட்டும் வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: τίθημι
  choice: வைக்கிறேன்
  rationale: நிகழ்காலத்தைப் பாதுகாக்கிறது; கட்டுமானக் கல் உருவகத்துக்கும் பொதுவான தமிழ்ப் பயன்பாட்டுக்கும் பொருந்துகிறது.
- source_word: ἐν Σιὼν
  choice: சீயோனில்
  rationale: ἐν என்பதன் இடப்பொருளை நேரடியாகத் தருகிறது; தீர்க்கதரிசன மேற்கோளின் இடப்பெயரையும் வழக்கமான வடிவில் காக்கிறது.
- source_word: λίθον προσκόμματος
  choice: தடுக்கி விழச் செய்யும் ஒரு கல்
  rationale: πρόσκομμα குறிக்கும் கால்தடுக்கல் அல்லது தடுமாற்றத்தை நவீன வாசகருக்குத் தெளிவாக வெளிப்படுத்துகிறது; வெறும் ‘இடறற்கல்’ என்பதைக் காட்டிலும் இயல்பானது.
- source_word: πέτραν σκανδάλου
  choice: இடறலுண்டாக்கும் ஒரு பாறை
  rationale: முந்தைய தொடருடன் உள்ள இணைப்பை வைத்துக்கொண்டே λίθος என்பதிலிருந்து πέτρα என்பதை ‘பாறை’ என வேறுபடுத்துகிறது; σκάνδαλον குறிக்கும் வீழ்ச்சிக்கான காரணத்தை மிகையாக விளக்காமல் தருகிறது.
- source_word: ὁ πιστεύων
  choice: நம்பிக்கை வைக்கிறவர்
  rationale: பாலினத்தைக் குறிப்பாக்காமல், பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்பு வடிவத்தை இயல்பான ஒருமைத் தமிழில் தருகிறது.
- source_word: ἐπ’ αὐτῷ
  choice: அவர்மேல்
  rationale: ἐπί என்பதன் ‘மேல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; ரோமர் 9:32–33 மற்றும் 10:11 சூழலில் கல் உருவகம் மேசியாவுக்குப் பயன்படுத்தப்படுவதால் தனிநபர் சுட்டான ‘அவர்’ பயன்படுத்தப்படுகிறது.
- source_word: οὐ καταισχυνθήσεται
  choice: அவமானத்துக்கு உள்ளாகமாட்டார்
  rationale: எதிர்கால மறுப்பையும் செயல்பாட்டுக்கு உட்படும் பொருளையும் காக்கிறது; மரியாதை–அவமானம் சார்ந்த வினையின் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐπ’ αὐτῷ என்பதிலுள்ள αὐτῷ-ன் சுட்டுப்பொருள்
  choice: மேசியாவைக் குறிக்கும் தனிநபர் சுட்டாக ‘அவர்மேல்’
  alternative: கல் அல்லது பாறையை இலக்கண முன்னிலையாகக் கொண்டு ‘அதன்மேல்’
  rationale: கிரேக்க αὐτῷ வடிவம் ஆண்பாலும் அஃறிணைப் பாலுமாக இருக்கக்கூடியதால் வடிவம் மட்டும் சுட்டுப்பொருளைத் தீர்மானிப்பதில்லை. எனினும் ரோமர் 9:32–33 மற்றும் 10:11-ல் பவுல் இந்தக் கல் உருவகத்தை மேசியாவுக்குப் பயன்படுத்தும் சூழல் தனிநபர் சுட்டை ஆதரிக்கிறது; மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: καταισχυνθήσεται என்பதன் விளைவு
  choice: அவமானத்துக்கு உள்ளாகமாட்டார்
  alternative: ஏமாற்றமடையமாட்டார்
  rationale: முதன்மை மொழிபெயர்ப்பு வினையின் வெட்கம்/அவமானம் சார்ந்த அடிப்படைப் பொருளையும் மறைமுகச் செயப்பாட்டு நிழலையும் காக்கிறது; எதிர்பார்ப்பு பொய்க்காது என்ற விளைவுப் பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேத மேற்கோளுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கல்’ மற்றும் ‘பாறை’ என்ற இணை உருவகங்களும், ‘தடுக்கி விழச் செய்தல்’ மற்றும் ‘இடறலுண்டாக்குதல்’ என்ற நெருங்கிய ஆனால் வேறுபட்ட சொற்படிமங்களும் பாதுகாக்கப்பட்டுள்ளன. தனிநபர்/பொருள் சுட்டின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
