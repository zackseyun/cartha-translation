source:
  edition: SBLGNT
  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: ta
  text: ஏனெனில், அவர்கள் இன்னும் பிறக்காமலும், நல்லதோ தீயதோ[c] எதையும் செய்யாமலும் இருந்தபோது, தேர்ந்தெடுப்புக்கு ஏற்ப[a] கடவுளின் நோக்கம் நிலைத்திருக்கும்படி[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளின் தேர்ந்தெடுக்கும் நோக்கம்’ / ‘தேர்ந்தெடுப்பின்படியான கடவுளின் நோக்கம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நிலைத்து நிற்கும்படி’ / ‘தொடர்ந்து இருக்கும்படி.’ கிரேக்க வினைச்சொல் ‘நிலைத்திரு’ அல்லது ‘தொடர்ந்து இரு’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நல்லதோ கெட்டதோ.’ கிரேக்கச் சொல் கெட்டது, இழிவானது, அல்லது ஒழுக்கரீதியாகத் தீயது என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω
  choice: இன்னும் ... பிறக்காமலும்
  rationale: ‘இன்னும் இல்லை’ என்ற காலப்பொருளை, தொடரும் பிறப்பைக் குறிக்கும் பங்கேற்புவினையுடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துடன் பவுல் ஏற்படுத்தும் விளக்கத் தொடர்பைப் பேணுகிறது.
- source_word: γεννηθέντων
  choice: அவர்கள் ... பிறக்காமலும்
  rationale: இறந்தகாலச் செயப்பாட்டு பங்கேற்புவினையும் அதன் காலத் தொடர்பையும் தமிழில் எதிர்மறை வினையெச்ச அமைப்பால் இயல்பாகக் காட்டுகிறது.
- source_word: μηδὲ πραξάντων
  choice: எதையும் செய்யாமலும்
  rationale: இரண்டாவது ஒருங்கிணைந்த மறுப்பைத் தெளிவாகப் பேணி, முதல் வினையெச்சத்துடன் இயல்பாக இணைக்கிறது.
- source_word: τι ἀγαθὸν ἢ φαῦλον
  choice: நல்லதோ தீயதோ எதையும்
  rationale: எதிரிணையை இயல்பான தமிழில் தருகிறது; φαῦλον என்பதன் ‘தீய/கெட்ட’ பொருளை அளவுக்கு மீறி விளக்காமல் வைத்திருக்கிறது.
- source_word: ἵνα
  choice: நிலைத்திருக்கும்படி
  rationale: ἵνα குறிக்கும் நோக்கப்பொருளைத் தக்கவைத்து, வெறும் விளைவாகத் தளர்த்துவதையும் தத்துவார்த்தமாக விரிவாக்குவதையும் தவிர்க்கிறது.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις
  choice: தேர்ந்தெடுப்பின்படியான ... நோக்கம்
  rationale: κατά உடைய ‘இன்படியான’ உறவை வெளிப்படையாகப் பேணி, ἐκλογή என்பதை விளக்கவுரையாக மாற்றாமல் ‘தேர்ந்தெடுப்பு’ என வழங்குகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: மூலத்தின் உரிமை/சார்பு வேற்றுமை உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: μένῃ
  choice: நிலைத்திருக்க
  rationale: ‘தொடர்ந்து இரு, நிலைத்திரு’ என்ற பொருளைச் சூழலுக்கு ஏற்றபடி தருகிறது; ‘நிறுவப்பட’ என்ற மேலதிகக் கருத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: முன்நியமனம் தொடர்பான சூழலில் ἵνα என்பதன் வலிமை
  choice: நோக்கத்தைக் குறிக்கும் ‘... நிலைத்திருக்கும்படி’
  alternative: விளைவை மட்டும் குறிக்கும் ‘அதன் விளைவாக ... நிலைத்திருந்தது’
  rationale: இலக்கணம் இயல்பாக நோக்கத்தைக் குறிக்கிறது; ஆனால் விரிவான முன்நியமனக் கோட்பாட்டு விவாதத்தை மொழிபெயர்ப்பே தீர்மானிக்காதபடி இறையியல் இழுவிசையைப் பேணுகிறது.
- issue: ἐκλογή என்பதன் மொழிபெயர்ப்பு
  choice: தேர்ந்தெடுப்பு
  alternative: தெரிவு / தேர்வு
  rationale: இங்கு கடவுளுடைய நோக்கத்தோடு தொடர்புடைய தேர்ந்தெடுக்கும் செயலைத் தெளிவாகக் குறிக்கிறது; யார் எவ்வாறு தேர்ந்தெடுக்கப்படுகிறார்கள் என்ற விரிவான இறையியல் முடிவை உரைக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் நீண்ட கிரேக்க வாக்கியத்தின் ஒரு பகுதி என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘தேர்ந்தெடுப்பின்படியான’ என்ற சற்று முறையான அமைப்பு, மூலத்தின் κατ’ ἐκλογὴν கட்டமைப்பையும் அதன் உண்மையான இறையியல் திறந்தநிலையையும் பேணுவதற்காகத் தேர்ந்தெடுக்கப்பட்டது.
