id: ROM.9.4
reference: Romans 9:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: ta
  text: அவர்கள் இஸ்ரவேலர்கள்; மகன்களாக ஏற்றுக்கொள்ளப்படுதலும்[a], மகிமையும்[b], உடன்படிக்கைகளும், திருச்சட்டம் வழங்கப்படுதலும், இறைவழிபாடும்[c], வாக்குறுதிகளும் அவர்களுக்கு உரியவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “தத்தெடுக்கப்பட்ட மகனுரிமை” அல்லது “மகனுரிமை.” இங்கு இஸ்ரவேல் தேவனுடைய மக்களாக ஏற்றுக்கொள்ளப்பட்ட உடன்படிக்கை உறவு குறிக்கப்படுகிறது.'
    reason: lexical_alternative
  - marker: b
    text: “மகிமை” என்பது இஸ்ரவேலின் நடுவே வெளிப்பட்ட தேவனுடைய பிரசன்னத்தைக் குறிக்கக்கூடும்.
    reason: cross_reference
  - marker: c
    text: அதாவது, தேவனுக்கு முன்பாக இஸ்ரவேலுக்கு நியமிக்கப்பட்ட உடன்படிக்கை சார்ந்த வழிபாடும் பணிவிடையும்.
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: அவர்கள் இஸ்ரவேலர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களை விளக்கமாக அடையாளப்படுத்தும் சார்புத்தொடரைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: ὧν
  choice: அவர்களுக்கே உரியவை
  rationale: உடைமை அல்லது உரிமையைக் குறிக்கும் பன்மை உறவுப்பெயரின் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘ஏ’ வலியுறுத்தல் இப்பட்டியலின் உரிமைத் தன்மையைத் தெளிவாக்குகிறது.
- source_word: υἱοθεσία
  choice: மகன்களாக ஏற்றுக்கொள்ளப்பட்ட நிலை
  rationale: சொல்லின் மகனுரிமை/தத்தெடுத்தல் உருவகத்தைப் பாதுகாத்து, இங்கு இஸ்ரவேல் மக்களுக்குரிய உடன்படிக்கை உறவுநிலையைக் குறிக்கிறது.
- source_word: δόξα
  choice: மகிமை
  rationale: கிரேக்கத்தின் சுருக்கத்தையும் இறையியல் செறிவையும் காக்கிறது; தேவனுடைய வெளிப்பட்ட பிரசன்னத்தைக் குறிக்கக்கூடிய பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: διαθῆκαι
  choice: உடன்படிக்கைகள்
  rationale: கிரேக்கப் பன்மையைப் பாதுகாக்கும் வழக்கமான, தெளிவான வேதாகமச் சொல்.
- source_word: νομοθεσία
  choice: திருச்சட்டம் அருளப்பட்டது
  rationale: வெறும் ‘சட்டம்’ என்று அல்லாமல், சட்டம் வழங்கப்பட்ட நிகழ்வைச் சுட்டும் பெயர்ச்சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: λατρεία
  choice: இறைவழிபாடு
  rationale: தேவனுக்குச் செலுத்தப்பட்ட இஸ்ரவேலின் ஒழுங்குபடுத்தப்பட்ட வழிபாடு/பணிவிடையைக் குறிக்கிறது; ஆலயப்பணி என்று தேவையின்றி சுருக்கவில்லை.
- source_word: ἐπαγγελίαι
  choice: வாக்குறுதிகள்
  rationale: கிரேக்கப் பன்மையைப் பாதுகாத்து, இஸ்ரவேலுக்குக் கொடுக்கப்பட்ட இறை வாக்குறுதிகளைத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: υἱοθεσία என்பதன் இஸ்ரவேலுக்குரிய பொருள்
  choice: மகன்களாக ஏற்றுக்கொள்ளப்பட்ட நிலை
  alternative: தத்துப்பிள்ளை உரிமை; மகனுரிமை
  rationale: இது தனிநபரின் இரட்சிப்பு அனுபவத்தை மட்டும் குறிப்பதாகச் சுருக்காமல், இஸ்ரவேல் மக்களுக்குரிய உடன்படிக்கை மகன்-உறவை வெளிப்படுத்துகிறது.
- issue: ἡ δόξα என்பதன் குறிப்பு
  choice: மகிமை என்று முதன்மை உரையில் திறந்தவாறு வைக்கப்பட்டது
  alternative: இறைமகிமை; மகிமையான பிரசன்னம்
  rationale: இது இஸ்ரவேலின் நடுவே வெளிப்பட்ட தேவபிரசன்னத்தைச் சுட்டுவது சாத்தியம்; ஆனாலும் கிரேக்கம் ‘மகிமை’ என்று மட்டுமே கூறுவதால் முதன்மை உரை அதே இறையியல் செறிவைப் பாதுகாக்கிறது.
- issue: λατρεία என்பதன் வரம்பு
  choice: இறைவழிபாடு
  alternative: ஆலயப் பணி; ஆராதனைப் பணி
  rationale: இஸ்ரவேலின் உடன்படிக்கை சார்ந்த, ஒழுங்குபடுத்தப்பட்ட வழிபாட்டைக் காட்டுகிறது; அதை ஆசாரிய அல்லது ஆலயப் பணிக்கு மட்டும் கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுமக்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. பட்டியலின் சமநிலை பாதுகாக்கப்பட்டுள்ளது. ‘திருச்சட்டம்’ என்பது இங்கு மோசேயின் சட்டத்தைக் குறிக்கும் இயல்பான வேதாகமப் பயன்பாடு; ‘அருளப்பட்டது’ சட்டம் வழங்கப்பட்ட செயலை வெளிப்படுத்துகிறது.
