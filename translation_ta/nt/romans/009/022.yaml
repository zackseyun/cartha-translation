  choice: ‘ஆயத்தமாக்கப்பட்ட’ என்று மட்டும் மொழிபெயர்த்து, செய்பவரைச் சொல்லாமல் விடுதல்.
  alternative: தேவனால் அழிவுக்காக ஆயத்தமாக்கப்பட்ட; தாங்களே அழிவுக்கு ஏற்றவர்களான; அழிவுக்கு ஏற்ற நிலையில் இருந்த
  rationale: கிரேக்கச் செயப்பாட்டு வடிவம் ஆயத்தமான நிலையைச் சொன்னாலும் செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே சர்ச்சைக்குரிய இறையியல் முடிவை மொழிபெயர்ப்பில் புகுத்தாமல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: εἰ என்று தொடங்கி அடுத்த வசனத்தில் தொடரும் முடிவுறாத நிபந்தனை வாக்கியத்தின் வலிமை
  choice: ‘ஆனால் ... என்றால்—’ என நிபந்தனையைத் திறந்த நிலையில் விட்டு அடுத்த வசனத்தோடு தொடரச் செய்தல்.
  alternative: இதை நேரடி உறுதிக்கூற்றாக மாற்றுதல்; இந்த வசனத்திலேயே முழுமையான கேள்வியாக முடித்தல்
  rationale: பவுலின் வாக்கிய அமைப்பு 23ஆம் வசனத்தில் தொடர்கிறது. அதை இங்கே முடிப்பது அல்லது உறுதிக்கூற்றாக்குவது மூலத்தின் மொழியியல் தயக்கத்தை நீக்கும்.
- issue: θέλων என்ற பெயரெச்ச வினையின் தொடர்பு
  choice: ‘விரும்பி’ என்று நடுநிலையாக வைத்தல்.
  alternative: ‘விரும்பியபோதிலும்’; ‘விரும்பியதால்’
  rationale: இது விட்டுக்கொடுப்பு கருத்தையா காரணக் கருத்தையா வெளிப்படுத்துகிறது என்பதை கிரேக்கம் வெளிப்படையாகத் தீர்மானிக்கவில்லை; எளிய பெயரெச்ச வினை அந்தத் திறந்த தன்மையைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உருவகத் தொடர்ச்சியும் காக்கப்பட்டுள்ளன. தேவனைச் சுட்டும் இடங்களில் ‘தமது’ பயன்படுத்தப்பட்டுள்ளது. ‘கோபத்தின் பாத்திரங்கள்’ என்பது அன்றாட வழக்கில் அரிதாயினும், உடனடியான குயவன்–பாத்திர உருவகத்தைப் பாதுகாக்கத் தேவையானதாக வைக்கப்பட்டுள்ளது. அடுத்த வசனத்தில் வாக்கியம் தொடர்வதை நீள்கோடு காட்டுகிறது.
