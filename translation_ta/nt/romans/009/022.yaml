source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: ta
  text: ஆனால், தேவன் தமது கோபத்தை வெளிப்படுத்தவும் தமது வல்லமையை[b] அறியச் செய்யவும் விரும்பி, அழிவுக்காக ஆயத்தமாக்கப்பட்ட[c] கோபத்தின் பாத்திரங்களை மிகுந்த பொறுமையோடு சகித்துக்கொண்டார் என்றால் என்ன—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆனால், ... என்றால்.’ கிரேக்கத்தில் இங்கு தொடங்கும் நிபந்தனை வாக்கியம் அடுத்த வசனத்தில் தொடர்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தம்மால் இயல்வதை.’ இக்கிரேக்கத் தொடர் சொற்சார்ந்த முறையில் அவரால் இயல்வதைக் குறிக்கிறது; இங்கு அது தேவனுடைய வல்லமையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘ஆயத்தமாக்கப்பட்ட’ என்ற செயப்பாட்டு வடிவம், இந்தப் பாத்திரங்களை யார் ஆயத்தமாக்கினார் என்று கூறவில்லை. இது தேவனுடைய செயலா, மனிதர்கள் தங்களைத் தாங்களே கடினப்படுத்திக்கொண்டதன் விளைவா, அல்லது நியாயத்தீர்ப்புக்கு ஆயத்தமான நிலையைக் குறிப்பதா என்பதில் விளக்கங்கள் வேறுபடுகின்றன.
    reason: alternative_reading
