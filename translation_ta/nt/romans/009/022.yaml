  rationale: எதிர்மறைத் தொடர்பையும் அடுத்த வசனத்தில் தொடரும் நிபந்தனை அமைப்பையும் இயல்பான தமிழில் காக்கிறது. முடிவுறாத வாக்கியத்தை நீள்கோடு சுட்டுகிறது.
