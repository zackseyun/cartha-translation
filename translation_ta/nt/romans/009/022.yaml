- source_word: ἐνδείξασθαι τὴν ὀργὴν
  choice: தமது கோபத்தை வெளிப்படுத்தவும்
  rationale: நோக்கமுள்ள வெளிப்படுத்துதலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘கோபம்’ இங்கு தெய்வீக நியாயத்தீர்ப்பின் சூழலில் வாசிக்கப்படுகிறது.
- source_word: γνωρίσαι
  choice: அறியச் செய்யவும்
  rationale: பிறர் அறியும்படி செய்வது என்ற causative பொருளைப் பாதுகாக்கும் இயல்பான தமிழ்.
- source_word: τὸ δυνατὸν αὐτοῦ
  choice: தமது வல்லமையை
  rationale: சூழலில் தேவனுடைய ஆற்றலைக் குறிக்கும் இயல்பான தமிழ்; கிரேக்கத்தின் சொற்சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἤνεγκεν
  choice: சகித்துக்கொண்டார்
  rationale: ‘மிகுந்த பொறுமையோடு’ என்பதுடன் சேர்ந்து, பொறுமையாகத் தாங்கிக்கொண்டார் என்ற சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἐν πολλῇ μακροθυμίᾳ
  choice: மிகுந்த பொறுமையோடு
  rationale: நீண்டகாலம் கோபத்தை அடக்கித் தாங்கும் தன்மையை நவீன வாசகருக்கு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σκεύη ὀργῆς
  choice: கோபத்தின் பாத்திரங்கள்
  rationale: முந்தைய வசனங்களிலுள்ள குயவன்–பாத்திர உருவகத்தையும் சுருக்கமான இறைச்சொல் தொடர்பின் தெளிவின்மையையும் காக்கிறது.
- source_word: κατηρτισμένα
  choice: ஆயத்தமாக்கப்பட்ட
  rationale: நிறைவுற்ற செயப்பாட்டு பெயரெச்சத்தின் ஆயத்தமான நிலையைத் தருகிறது; அதைச் செய்தவர் யார் என்பதைச் சேர்க்கவில்லை.
- source_word: εἰς ἀπώλειαν
  choice: அழிவுக்காக
  rationale: இலக்கு அல்லது முடிவைத் திறந்தவாறு காட்டும் நேரடியான, புரிந்துகொள்ளக்கூடிய மொழிபெயர்ப்பு.
theological_decisions:
