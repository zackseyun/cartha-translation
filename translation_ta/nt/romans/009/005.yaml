  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: ta
  text: முன்னோர்களும் அவர்களுக்கே உரியவர்கள்; அவர்களிலிருந்தே, மாம்சத்தின்படி[a], மெசியா வந்தவரும், எல்லாவற்றின்மேலும் இருக்கிறவரும், என்றென்றும் போற்றப்படுகிற தேவனுமானவர். ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ‘மனித வம்சவழியின்படி.’ சொல்லுக்குச் சொல்: ‘மாம்சத்தின்படி.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες
  choice: முற்பிதாக்கள்
  rationale: இஸ்ரவேலின் மதிப்புக்குரிய உடன்படிக்கை வரலாற்று முன்னோர்களைக் குறிக்கிறது. ‘கோத்திரத் தலைவர்கள்’ என்பது பொருளைத் தேவையின்றிக் குறுக்கக்கூடும்; ‘முற்பிதாக்கள்’ பவுலின் வரலாற்றுச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: ἐξ ὧν
  choice: அவர்களிடமிருந்தே
  rationale: முன்னர் குறிப்பிடப்பட்ட இஸ்ரவேலர்களையே சார்புப்பெயர் சுட்டுகிறது. ‘-ஏ’ கிரேக்க வாக்கியத்தின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: இங்கு Χριστός தனிப்பெயராக அல்லாமல், இஸ்ரவேலின் வாக்குறுதிகளோடு தொடர்புடைய பட்டமாகச் செயல்படுகிறது.
- source_word: τὸ κατὰ σάρκα
  choice: மாம்சத்தின்படி
  rationale: பவுலின் சொற்றொடரை நெருக்கமாகத் தக்கவைத்து, இங்கு மனித வம்சவழி குறிக்கப்படுவதை அடிக்குறிப்பில் விளக்குகிறது; பாவ இயல்பு என்பது இங்கு பொருளல்ல.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: அவரே எல்லாவற்றிற்கும் மேலானவர்
  rationale: உருபுடன் வரும் பங்கேற்புவினை இயல்பாக மெசியாவைப் பற்றிய விளக்கத்தைத் தொடர்கிறது. ‘அவரே’ அதன் தொடர்பையும் வலியுறுத்தலையும் தமிழில் தெளிவாக்குகிறது.
- source_word: θεὸς εὐλογητὸς
  choice: போற்றுதலுக்குரிய தேவன்
  rationale: εὐλογητός என்பதன் புகழ்ச்சிசார் பொருளை இயல்பான, கண்ணியமான தமிழில் அளிக்கிறது; இது மெசியாவை விவரிக்கும் முதன்மை வாசிப்புடன் பொருந்துகிறது.
- source_word: εἰς τοὺς αἰῶνας
  choice: என்றென்றும்
  rationale: காலங்கள் முழுவதையும் குறிக்கும் புகழ்ச்சித் தொடருக்கான சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: வழிபாட்டு உறுதிப்பாட்டுச் சொல் தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας என்ற இறுதிக் கூறு மெசியாவை விவரிக்கிறதா, அல்லது தேவனை நோக்கிய தனிப் புகழுரையாகத் தொடங்குகிறதா?
  choice: 'இக்கூறு மெசியாவைப் பற்றிய விளக்கத்தைத் தொடர்வதாக மொழிபெயர்க்கப்பட்டது: ‘அவரே எல்லாவற்றிற்கும் மேலானவர், என்றென்றும் போற்றுதலுக்குரிய தேவன்.’'
  alternative: 'அதைத் தனிப் புகழுரையாக எடுத்தால்: ‘எல்லாவற்றிற்கும் மேலான தேவன் என்றென்றும் போற்றப்படுவாராக. ஆமென்.’'
  rationale: ὁ ὢν என்ற உருபுடைய பங்கேற்புவினை ὁ χριστός என்பதுடன் இணைந்து நிற்பது கிரேக்கத் தொடரின் இயல்பான வாசிப்பு. எனினும், மிகப் பழமையான கையெழுத்துப் பிரதிகளில் நவீன நிறுத்தக்குறிகள் இல்லாததாலும் இவ்வாசிப்பு நீண்டகாலமாக விவாதிக்கப்பட்டதாலும் மாற்று புகழுரை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘மாம்சத்தின்படி’ என்ற பவுலின் இறுக்கமான சொற்றொடர் மூலத்தின் பலஅர்த்தத் தன்மையைப் பாதுகாக்கத் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. [a], [b] குறியீடுகள் அவை சார்ந்த இடங்களிலேயே முதன்மை உரையில் வைக்கப்பட்டுள்ளன.
