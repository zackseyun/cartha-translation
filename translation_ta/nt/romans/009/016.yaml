source:
  edition: SBLGNT
  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: ta
  text: ஆகவே[a], விரும்புபவரையோ ஓடுபவரையோ[b] அது சார்ந்திருப்பதில்லை; மாறாக, இரக்கம் காட்டுகிற கடவுளையே சார்ந்திருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் வடிவில்: «ஆகவே, விரும்புபவருடையதும் அல்ல, ஓடுபவருடையதும் அல்ல; இரக்கம் காட்டுகிற கடவுளுடையதே.» கிரேக்க வாக்கியத்தில் எழுவாயும் முதன்மை வினைத் தொடரும் விடப்பட்டுள்ளன; கடவுளின் நோக்கத்தையும் இரக்கத்தையும் பற்றிய சூழலிலிருந்து அவை புரிந்துகொள்ளப்படுகின்றன.'
    reason: lexical_alternative
  - marker: b
    text: «ஓடுபவர்» என்பது இங்கு மனித முயற்சி அல்லது தீவிர முனைப்பைக் குறிக்கும் உருவகமாக இருக்கலாம்; எனினும் கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் «ஓடுதல்».
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ஆகவே
  rationale: இரண்டு முடிவுரைக் கூறுகளும் முந்தைய வாதத்திலிருந்து பவுல் எடுக்கும் தீர்மானத்தை வலுப்படுத்துகின்றன. நவீன தமிழில் «ஆகவே» அவற்றின் இயல்பான தர்க்க வலிமையைத் தருகிறது.
- source_word: τοῦ θέλοντος
  choice: விரும்புகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இப்பெயரெச்சம் ஒருவரின் விருப்பத்தையோ மனவுறுதியையோ குறிக்கிறது. «விரும்புகிறவர்» என்பது தேவையற்ற விளக்கம் சேர்க்காமல் அதன் செயற்பாட்டு நுணுக்கத்தைப் பேணுகிறது.
- source_word: οὐδὲ τοῦ τρέχοντος
  choice: ஓடுகிறவரையோ
  rationale: τρέχω என்பதன் நேரடிப் பொருள் «ஓடு». சூழலில் மனித முயற்சியைக் குறிக்கும் உருவக நயம் இருந்தாலும், பவுலின் தெளிவான படிமத்தை முதன்மை உரை தக்கவைக்கிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: மனித விருப்பம் மற்றும் முயற்சிக்கும் இரக்கம் காட்டும் கடவுளுக்கும் இடையிலான வலுவான முரண்பாட்டைக் குறிக்கிறது.
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: இரக்கம் காட்டுகிற கடவுளையே
  rationale: கடவுளை அவரது இரக்கச் செயலால் அடையாளப்படுத்தும் பெயரெச்சத்தின் செயற்பாட்டு வலிமையை இது பேணுகிறது. «-ஏ» என்ற வலியுறுத்தல் ἀλλά குறிக்கும் எதிர்மறை ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: implied predicate/expression
  choice: அது சார்ந்திருப்பதில்லை … சார்ந்திருக்கிறது
  rationale: கிரேக்கத்தில் எழுவாயும் ஆளும் வினைத் தொடரும் வெளிப்படையாக இல்லை. «அது» என்பதன் குறிப்பைச் சூழலே நிரப்புமாறு விட்டு, இரட்சிப்பு, தேர்ந்தெடுப்பு அல்லது கடவுளின் நோக்கம் என்று முதன்மை உரையில் குறுக்கிப் பொருள் கூறாமல் இயல்பான தமிழை வழங்குகிறது.
theological_decisions:
- issue: விடுபட்ட எழுவாயும் சார்பின் வரம்பும்
  choice: «அது சார்ந்திருப்பதில்லை» என்ற பொதுவான தொடரைப் பயன்படுத்தி, «அது» எதைக் குறிக்கிறது என்பதைச் சூழலே நிர்ணயிக்கும்படி விடுதல்
  alternative: «இரட்சிப்பு மனித விருப்பத்தையோ முயற்சியையோ சார்ந்ததல்ல» அல்லது «கடவுளின் தேர்வு மனித விருப்பத்தையோ முயற்சியையோ சார்ந்ததல்ல»
  rationale: உடனடிச் சூழல் கடவுளின் நோக்கத்தையும் இரக்கத்தையும் பற்றியது; ஆனாலும் கிரேக்க வாக்கியம் குறிப்பிட்ட எழுவாயை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே ஒரு குறுகிய கோட்பாட்டு விளக்கத்தை உரைக்குள் சேர்க்காமல் அதன் இறையியல் இறுக்கமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. «சார்ந்திருப்பது» என்ற தொடர் கிரேக்க வாக்கியத்தின் விடுபட்ட அமைப்பை வாசிக்கத்தக்க தமிழில் நிரப்புகிறது; அதேவேளை «அது» என்பதன் குறிப்பைத் திட்டவட்டமாக வரையறுக்காமல் மூலத்தின் உண்மையான தெளிவின்மையைப் பேணுகிறது. «ஓடுகிறவர்» என்ற நேரடிப் படிமமும் தக்கவைக்கப்பட்டுள்ளது.
