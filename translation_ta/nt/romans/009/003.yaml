source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: ta
  text: ஏனெனில், என் உடல் வழி இனத்தாரான என் சகோதரர்களுக்காக, நானே சாபத்துக்குள்ளானவனாகவும் மெசியாவிடமிருந்து பிரிக்கப்பட்டவனாகவும் இருக்கும்படிக்கூட நான் விரும்புவேன்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மெசியாவிடமிருந்து சாபத்துக்குள்ளானவனாக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் சாபத்துக்குள்ளாகுதல் மற்றும் மெசியாவிடமிருந்து பிரிக்கப்படுதல் ஆகிய கருத்துகளை நெருக்கமாக இணைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உடல் வழி’ என்பது இங்கு உடல் பிறப்பு அல்லது இனவழி மரபைக் குறிக்கிறது; ‘பாவ இயல்பு’ என்பதைக் குறிக்கவில்லை. பவுல் தன் சக இஸ்ரவேலரைச் சுட்டுகிறார்.
    reason: cultural_note
lexical_decisions:
- source_word: ηὐχόμην
  choice: விரும்புவேன்
  rationale: இறந்தகாலச் செயலை மட்டும் குறிப்பதாக இல்லாமல், நிறைவேற இயலாத அல்லது மிகக் கடினமான ஓர் அனுமான விருப்பத்தை இச்சூழலில் வெளிப்படுத்துகிறது; ‘இருக்கக்கூட விரும்புவேன்’ என்பது அந்த உணர்வுத் தீவிரத்தை இயல்பான தமிழில் தருகிறது.
- source_word: γὰρ
  choice: (முந்தைய வசனத்துடன் தொடரும் விளக்க உறவு)
  rationale: இவ்வசனம் முந்தைய கூற்றிற்கான விளக்கமாக வருகிறது. தனித்து வழங்கப்பட்ட வசனத்தில் செயற்கையான ‘ஏனெனில்’ என்பதைத் தவிர்த்து, வாக்கிய ஓட்டத்தின் மூலம் உறவு விடப்பட்டுள்ளது.
- source_word: ἀνάθεμα
  choice: சாபத்துக்குள்ளானவன்
  rationale: தெய்வீகச் சாபத்திற்கும் அழிவுக்கு ஒப்புக்கொடுக்கப்பட்ட நிலைக்கும் உரிய வலுவான பொருளை, பொதுவாகப் புரியும் நவீன தமிழில் தெரிவிக்கிறது.
- source_word: αὐτὸς ἐγὼ
  choice: நானே
  rationale: பவுல் தன்னையே வலியுறுத்தும் இரட்டைப் பிரதிப்பெயரின் அழுத்தத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: மெசியாவிடமிருந்து பிரிக்கப்பட்டு
  rationale: ἀπό குறிக்கும் பிரிவைத் தெளிவாக்குகிறது; Χριστός இங்கு பட்டப்பெயரின் பொருளுடன் இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: ὑπὲρ
  choice: …க்காக
  rationale: பிறரின் நன்மைக்காகத் தன்னை அர்ப்பணிக்கத் தயாரான பயன்நோக்குப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: τῶν ἀδελφῶν μου
  choice: என் சகோதரர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மையைப் பாதுகாக்கிறது; அடுத்த சொற்றொடர் இவர்கள் பவுலின் இனத்தார் என்பதை விளக்குகிறது.
- source_word: τῶν συγγενῶν μου
  choice: என் இனத்தார்
  rationale: இங்கு வீட்டாரான உறவினரை மட்டும் அல்லாமல் பவுலின் இனவழி மக்களான இஸ்ரவேலரைக் குறிக்கும் கூட்டுப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: κατὰ σάρκα
  choice: உடல் வழியில்
  rationale: இங்கு σάρξ பாவ இயல்பை அல்ல, உடல் பிறப்பு அல்லது இனவழி மரபைச் சுட்டுகிறது; சொற்றொடரின் பவுலிய வடிவத்தையும் இயல்பான தமிழையும் சமநிலைப்படுத்துகிறது.
theological_decisions:
- issue: பவுல் உண்மையில் வேண்டிக்கொண்டாரா, அல்லது அனுமானமான விருப்பத்தை வெளிப்படுத்துகிறாரா?
  choice: ‘இருக்கக்கூட விரும்புவேன்’ என்று அனுமான அல்லது சாத்திய விருப்பமாக மொழிபெயர்த்தல்
  alternative: ‘நான் விரும்பிக்கொண்டிருந்தேன்’ அல்லது ‘நான் வேண்டினேன்’
  rationale: பவுல் உண்மையிலேயே மெசியாவிடமிருந்து பிரிக்கப்படும்படி வேண்டினார் என்று மிகைப்படுத்தாமல், அவரது மனவேதனையின் தீவிரத்தைப் பாதுகாக்கிறது.
- issue: Χριστός என்பது பட்டப்பெயரா அல்லது பெயர்போன்ற வடிவமா?
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயரின் வலிமை பொருத்தமாக இருப்பதால் அதனை வெளிப்படையாக மொழிபெயர்க்கிறது.
- issue: κατὰ σάρκα என்பதில் σάρξ-ன் பொருள்
  choice: உடல் பிறப்பு மற்றும் இனவழி மரபு
  alternative: பாவ இயல்பு
  rationale: பவுல் இங்கு தன் இனத்தாரை அடையாளப்படுத்துகிறார்; மனிதரின் ஒழுக்க அல்லது பாவ இயல்பைப் பற்றி பேசவில்லை.
- issue: ἀνάθεμα மற்றும் ἀπὸ τοῦ Χριστοῦ ஆகியவற்றின் உறவு
  choice: சாபத்துக்குள்ளாகுதல் மற்றும் மெசியாவிடமிருந்து பிரிக்கப்படுதல் ஒன்றோடொன்று நெருக்கமாக இணைந்த நிலையாக வழங்கப்பட்டது
  alternative: ‘மெசியாவிடமிருந்து சாபத்துக்குள்ளானவன்’ அல்லது இரண்டு முற்றிலும் தனித்த நிலைகள்
  rationale: கிரேக்கத்தின் சுருக்கமான அமைப்பில் உள்ள உண்மையான தொடர்பைத் தக்கவைத்து, பிரிவே சாபத்தின் விளைவா அல்லது அதன் விளக்கமா என்பதை அளவுக்கு மீறித் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் மரியாதையும் உணர்வுத் தீவிரமும் காக்கப்பட்டுள்ளன. ‘மெசியா’, ‘சாபத்துக்குள்ளானவன்’ போன்ற சொற்கள் இறையியல் வலிமையைத் தக்கவைக்கின்றன; ‘என் இனத்தார்’ என்பது சூழலின் இனவழிப் பொருளை வீட்டாரான உறவினர்கள் எனச் சுருக்காமல் தெரிவிக்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
