id: ROM.9.9
reference: Romans 9:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: ta
  text: 'ஏனெனில், வாக்குறுதியின் வார்த்தை இதுதான்: “இந்தக் காலத்தில் நான் வருவேன்[a]; சாராளுக்கு ஒரு மகன் இருப்பான்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் திரும்பி வருவேன்.” இங்குள்ள கிரேக்க வாசகம் “நான் வருவேன்” என்று உள்ளது; ஆதியாகமப் பின்னணியின் சொற்றொடரைப் பிரதிபலிக்கும் சில மொழிபெயர்ப்புகள் “திரும்பி வருவேன்” என வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: வாக்குறுதியின்
  rationale: λόγος என்பதைக் குறிக்கும் உறவுநிலைச் சொல்; பவுலின் சூழலில் இறைவாக்குறுதியைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: λόγος
  choice: வார்த்தை
  rationale: இங்கு மேற்கோள் காட்டப்படும் உரைத்த வாக்கையே குறிக்கிறது; தேவையற்ற விரிவாக்கமின்றி மூலத்தின் வடிவத்தைப் பேணுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் காரணத் தொடர்பைப் பேணுகிறது.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: இந்தக் காலத்தில்
  rationale: குறிக்கப்பட்ட நிறைவேற்றக் காலத்தைச் சுட்டும் இயல்பான தமிழ்; ‘நியமிக்கப்பட்ட’ என்ற விளக்கத்தை மூலத்தில் இல்லாமல் சேர்ப்பதில்லை.
- source_word: ἐλεύσομαι
  choice: நான் வருவேன்
  rationale: கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் ‘வருவேன்’; ஆதியாகமப் பின்னணியால் சாத்தியமான ‘திரும்பி வருவேன்’ என்பதை அடிக்குறிப்பில் தருகிறது.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: சாராளுக்கு ஒரு மகன் இருப்பான்
  rationale: ‘சாராளுக்கு ஒரு மகன் இருப்பான்’ என்ற தமிழின் உடைமை அமைப்பு கிரேக்க மொழிநடைக்கு நெருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: Σάρρᾳ
  choice: சாராள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்; வேற்றுமை உருபுடன் ‘சாராளுக்கு’ என வருகிறது.
- source_word: υἱός
  choice: மகன்
  rationale: சொல் குறிப்பாக ஆண் பிள்ளையைக் குறிக்கிறது; ஆபிரகாம்–சாராள் வாக்குறுதி சூழலில் அந்தக் குறிப்பு பொருத்தமானது.
theological_decisions:
- issue: ஆபிரகாமுக்கான வாக்குறுதியின் மேற்கோளும் இறைச் செயற்பாடும்
  choice: இறைவனின் நேரடிப் பேச்சாக வாக்குறுதியை எளிமையாக மொழிபெயர்த்து, ἐλεύσομαι என்பதற்கு ‘நான் வருவேன்’ என வழங்குதல்.
  alternative: ஆதியாகம மொழிபெயர்ப்பு மரபோடு வெளிப்படையாக ஒத்திசைக்க ‘நான் திரும்பி வருவேன்’ என வழங்குதல்.
  rationale: பவுலின் வாதத்தில் ஈசாக்கின் பிறப்புக்கு அடித்தளமாக இறைவாக்குறுதி உள்ளது. ரோமர் உரையின் கிரேக்கச் சொல்லுக்கு முன்னுரிமை அளித்து, ஆதியாகமப் பின்னணியிலுள்ள மாற்றை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘வாக்குறுதியின் வார்த்தை’ என்பது சற்றே முறையான வேதாகமத் தொனியைப் பேணுகிறது; மேற்கோளின் தெய்வீக நேரடிப் பேச்சும் மூலத்தின் சுருக்கமும் காக்கப்பட்டுள்ளன.
