id: ROM.9.27
reference: Romans 9:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: ta
  text: 'ஆனால் ஏசாயா இஸ்ரவேலைக் குறித்து உரத்துக் கூறுகிறார்: “இஸ்ரவேல் மக்களின் எண்ணிக்கை கடலின் மணலைப்போல் இருந்தாலும்[a], மீந்திருப்போரே இரட்சிக்கப்படுவார்கள்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் மக்களின் எண்ணிக்கை கடலின் மணலைப்போல் இருந்தால்.” கிரேக்கத்தில் இது நிபந்தனை வடிவில் உள்ளது; இச்சூழலில் அதற்கு “இருந்தாலும்” என்ற விட்டுக்கொடுப்பு பொருள் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “விடுவிக்கப்படுவார்கள்.” இந்தச் சொல் ஏசாயாவின் தீர்க்கதரிசனத்தில் உயிர்தப்பி மீந்திருக்கும் மக்களைப் பற்றிய பின்னணியை எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள மென்மையான எதிர்மறைத் தொடர்பையும் பவுலின் வாதத் திருப்பத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: κράζει
  choice: உரத்துக் கூறுகிறார்
  rationale: கிரேக்க நிகழ்காலத்தின் உயிரோட்டத்தையும் வலிமையான அறிவிப்பின் தொனியையும் பாதுகாக்கிறது.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: இஸ்ரவேலைக் குறித்து
  rationale: இந்தத் தீர்க்கதரிசன மேற்கோளில் ὑπέρ என்பது ‘சார்பாக’ என்பதைக் காட்டிலும் ‘குறித்து’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: Ἐὰν ᾖ
  choice: இருந்தாலும்
  rationale: பெரும் எண்ணிக்கைக்கும் மீந்தோரின் மீட்புக்கும் இடையிலான முரண்பாட்டைக் காட்டும் விட்டுக்கொடுப்பு பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; நேரடி நிபந்தனை வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கை மக்களைக் குறிக்கும் கூட்டுப்பெயரை நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் வழங்குகிறது.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: கடலின் மணலைப்போல்
  rationale: வேதாகமத்தில் அறிமுகமான உவமையைத் தெளிவான, இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: τὸ ὑπόλειμμα
  choice: மீந்திருப்போரே
  rationale: ஒரு சமூகத்திலிருந்து எஞ்சியுள்ள மக்களைக் குறிக்கும் தீர்க்கதரிசனக் கருத்தை இயல்பாகத் தருகிறது; ஏக எண்ணிலுள்ள கூட்டுப்பெயரின் பொருளையும் காக்கிறது.
- source_word: σωθήσεται
  choice: மீட்கப்படுவார்கள்
  rationale: பவுலின் இரட்சிப்பு சார்ந்த சூழலையும் ஏசாயா மேற்கோளின் விடுவிப்பு நிழற்பொருளையும் தமிழில் தாங்கக்கூடிய சொல்.
theological_decisions:
- issue: Ἐὰν ᾖ என்ற நிபந்தனைத் தொடரின் பொருள்
  choice: விட்டுக்கொடுப்பு பொருளில் ‘இருந்தாலும்’
  alternative: நேரடி நிபந்தனையாக ‘இருந்தால்’
  rationale: இஸ்ரவேலின் எண்ணிக்கை மிகுந்திருந்தபோதும் மீந்தோர் மட்டுமே மீட்கப்படுவார்கள் என்ற மேற்கோளின் அழுத்தத்தைத் தெளிவாக்குகிறது; கிரேக்கத்தின் நேரடி நிபந்தனை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: σωθήσεται என்பதன் மொழிபெயர்ப்பு
  choice: ‘மீட்கப்படுவார்கள்’
  alternative: ‘இரட்சிக்கப்படுவார்கள்’ அல்லது ‘விடுவிக்கப்படுவார்கள்’
  rationale: ரோமர் 9–11 இன் இரட்சிப்பு சார்ந்த வலிமையைத் தக்கவைத்தபடியே, ஏசாயா தீர்க்கதரிசனப் பின்னணியிலுள்ள விடுவிப்பு பொருளையும் முற்றிலும் நீக்காமல் விடுகிறது.
- issue: τὸ ὑπόλειμμα என்பதின் வரம்பு
  choice: ‘மீந்திருப்போரே’ என்று மட்டும் கூறி, அவர்கள் யார் அல்லது எவ்வாறு மீட்கப்படுகிறார்கள் என்பதை விளக்காமல் விடுதல்
  alternative: ‘மீதியானவர்கள்’ அல்லது விளக்கமளிக்கும் கோட்பாட்டுச் சொற்றொடர்
  rationale: உரை கூறும் மீந்தோர் கருத்தை மட்டும் பாதுகாத்து, எந்தச் சமயப் பிரிவின் தனிப்பட்ட விளக்கத்தையும் புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்படி வடிவத்திற்கு பதிலாக இயல்பான கூட்டுப்பெயரான ‘இஸ்ரவேலின் மக்கள்’ பயன்படுத்தப்பட்டது. மூலத்தின் வலிமையைத் தக்கவைக்க ‘உரத்துக் கூறுகிறார்’ என்றும், மீந்தோர் மட்டுமே என்பதன் அழுத்தத்தைக் காட்ட ‘மீந்திருப்போரே’ என்றும் வழங்கப்பட்டது.
