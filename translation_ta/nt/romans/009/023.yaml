source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: ta
  text: மேலும், தமது மகிமையின் செல்வத்தை இரக்கத்தின் பாத்திரங்கள்மேல் தெரியப்படுத்துவதற்காகவும்—மகிமைக்காக அவர் முன்கூட்டியே ஆயத்தப்படுத்திய பாத்திரங்கள்மேல்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: தமது மகிமையின் செல்வத்தை
  rationale: மூலத்தின் உருவகத்தையும் உடைமைத் தொடர்பையும் காத்து, இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: இரக்கத்தின் பாத்திரங்கள்மேல்
  rationale: ἐπί என்பதன் ‘மேல்/மீது’ என்ற திசையைப் பாதுகாக்கிறது; σκεύη என்ற உருவகத்தையும் விளக்கமாக மாற்றாமல் வைத்திருக்கிறது.
- source_word: προητοίμασεν
  choice: முன்கூட்டியே ஆயத்தப்படுத்தினார்
  rationale: προ- என்ற முன்னுருபின் காலப் பொருளையும் ἑτοιμάζω என்பதன் ஆயத்தப்படுத்துதல் என்ற பொருளையும் வெளிப்படுத்துகிறது.
- source_word: εἰς δόξαν
  choice: மகிமைக்காக
  rationale: εἰς குறிக்கும் நோக்கம் அல்லது இலக்கைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: ἵνα உட்பிரிவின் தொடர்பும் முழுமையற்ற வாக்கிய அமைப்பும்
  choice: ‘தெரியப்படுத்துவதற்காகவும் அவர் இவ்வாறு செய்தார்’ என்று முந்தைய வசனத்துடன் தொடர்பைக் காட்டுதல்
  alternative: ‘மேலும், ... தெரியப்படுத்துவதற்காகவும்’ என்று மட்டும் மொழிபெயர்த்து வாக்கியத்தை இலக்கண ரீதியாக முழுமையற்றதாக விடுதல்
  rationale: καὶ ἵνα முந்தைய சூழலுடன் இணைகிறது. ‘இவ்வாறு செய்தார்’ என்பது தனிப்பட்ட இறையியல் காரணத்தைச் சேர்க்காமல் தமிழில் வாக்கியத்தை வாசிக்கத்தக்கதாக்கும் குறைந்தபட்ச இணைப்பாகும்.
- issue: ‘இரக்கத்தின் பாத்திரங்கள்’ யாரைக் குறிக்கிறது என்பதைக் குறிப்பாக்குதல்
  choice: மூல உருவகத்தையும் அதன் குறிப்பிடாமையையும் அப்படியே காத்தல்
  alternative: ‘இரக்கம் பெற்ற மக்கள்’ என்று விளக்கிப் பொருளுரைத்தல்
  rationale: உருவகமும் அதிலுள்ள இறையியல் பதற்றமும் விளக்கத்தால் சுருக்கப்படாமல் இருக்க வேண்டும்.
- issue: முன்கூட்டிய ஆயத்தத்தின் செய்பவர்
  choice: ‘அவர்’ என்று கடவுளையே இலக்கண எழுவாயாக வைத்தல்
  alternative: செயப்பாட்டு வடிவில் ‘முன்கூட்டியே ஆயத்தப்படுத்தப்பட்ட’ என்று செய்பவரை மறைத்தல்
  rationale: προητοίμασεν செயப்பாட்டு அல்ல; ஒருமை வினை முந்தைய சூழலில் கடவுளைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பாத்திரங்கள்’ என்ற வேதாகம உருவகம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது. வசனம் கிரேக்கத்தில் முந்தைய வாக்கியத்துடன் சார்ந்திருப்பதால், தமிழில் ‘அவர் இவ்வாறு செய்தார்’ என்ற குறைந்தபட்ச இணைப்பு சேர்க்கப்பட்டுள்ளது.
