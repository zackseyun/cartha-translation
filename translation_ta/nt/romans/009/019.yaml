reference: Romans 9:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: ta
  text: அப்படியானால் நீ என்னிடம், “அப்படியானால் அவர் ஏன் இன்னும் குறை கூறுகிறார்? அவருடைய நோக்கத்தை எதிர்த்து நின்றவர் யார்?” என்று சொல்வாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρεῖς
  choice: சொல்வாய்
  rationale: எதிர்கால வினை வடிவத்தைத் தக்கவைத்து, பவுல் எதிர்பார்க்கும் மறுப்புரையை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: μοι
  choice: என்னிடம்
  rationale: மறைமுகச் செயப்படுபொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: முந்தைய வாதத்திலிருந்து எழும் முடிவையும் அடுத்த எதிர்வினையையும் குறிக்கிறது; இரண்டாவது οὖν கேள்வியின் ‘ஏன்’ அமைப்போடு இயல்பாகப் பொருந்துகிறது.
- source_word: Τί οὖν ἔτι
  choice: ஏன் இன்னும்
  rationale: இங்கு τί காரணத்தை வினவுகிறது; ἔτι என்பதன் ‘இன்னும்’ என்ற வலியுறுத்தலையும் தக்கவைக்கிறது.
- source_word: μέμφεται
  choice: குற்றம் சாட்டுகிறார்
  rationale: குறை கூறுதல் அல்லது பழி சுமத்துதல் என்ற பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: அவருடைய நோக்கத்தை
  rationale: βούλημα குறிக்கும் தீர்மானிக்கப்பட்ட எண்ணம் அல்லது நோக்கத்தைத் தருகிறது; ‘சித்தம்’ என்ற இறையியல் மரபுச் சொல்லால் பொருளை முன்கூட்டியே குறுக்காமல் இருக்கிறது.
- source_word: τίς ἀνθέστηκεν
  choice: எதிர்த்து நின்றிருப்பவர் யார்?
  rationale: ἀνθίστημι என்பதன் எதிர்த்து நிற்கும் பொருளையும், நிறைவுக்கால வடிவத்தின் தற்போதைய தொடர்பையும் தமிழில் பிரதிபலிக்கிறது.
theological_decisions:
- issue: இறை ஆட்சியுரிமை மற்றும் மனிதப் பொறுப்பு பற்றிய சூழலில் βούλημα என்பதன் மொழிபெயர்ப்பு
  choice: அவருடைய நோக்கம்
  alternative: அவருடைய விருப்பம் / எண்ணம்
  rationale: ‘நோக்கம்’ என்பது தீர்மானிக்கப்பட்ட எண்ணத்தை வெளிப்படுத்தினாலும், மனிதப் பொறுப்புக்கும் கடவுளின் நோக்கத்துக்கும் இடையிலுள்ள வசனத்தின் இறையியல் பதற்றத்தைத் தீர்த்துவிடாது. மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எதிர்பார்க்கப்படும் மறுப்புரையின் கூர்மையும் இரு சொல்லாட்சிக் கேள்விகளின் வலிமையும் தக்கவைக்கப்பட்டுள்ளன.
