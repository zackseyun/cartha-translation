id: ROM.9.18
reference: Romans 9:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: ta
  text: ஆகவே, அவர் தாம் விரும்புகிறவருக்கு இரக்கம் காட்டுகிறார்; தாம் விரும்புகிறவரையோ கடினப்படுத்துகிறார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடினப்படுத்துகிறார்’ என்பதை ‘பிடிவாதமாக்குகிறார்’ அல்லது ‘முரண்டுபோகச் செய்கிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் செய்வினை வினை பயன்படுத்தப்பட்டுள்ளது; இதை வெறும் அனுமதியாக மென்மைப்படுத்தக் கூடாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ஆகவே
  rationale: இரண்டு முடிவுரைக் கூறுகளின் வலிமையை இயல்பான நவீனத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது; முந்தைய வாதத்திலிருந்து வரும் முடிவைத் தெளிவாக்குகிறது.
- source_word: ὃν θέλει
  choice: தாம் விரும்புகிறவருக்கு / தாம் விரும்புகிறவரை
  rationale: இரு கூற்றுகளிலும் இறைவனுடைய விருப்பத்தை நேரடியாகவும் இணையான அமைப்பிலும் தக்கவைக்கிறது. முதல் வினைக்குத் தேவையான வேற்றுமை உருபு ‘-க்கு’; இரண்டாவது வினைக்குத் தேவையானது ‘-ஐ’.
- source_word: ἐλεεῖ
  choice: இரக்கம் காட்டுகிறார்
  rationale: இரக்கத்தைச் செயலில் வெளிப்படுத்துதல் என்ற வினைநுணுக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὃν δὲ θέλει
  choice: தாம் விரும்புகிறவரையோ
  rationale: δέ காட்டும் எதிர்மறை ஒப்புமையை ‘-யோ’ இயல்பாக வெளிப்படுத்துகிறது; அதேவேளையில் முதல் கூற்றுடனான திட்டமிட்ட இணை அமைப்பையும் காக்கிறது.
- source_word: σκληρύνει
  choice: கடினப்படுத்துகிறார்
  rationale: கிரேக்கச் சொல்லின் செயப்பாட்டு வலிமையையும் பார்வோன் நிகழ்வுடனான வேதாகமத் தொடர்பையும் காக்கிறது; வெறும் அனுமதியாக மென்மைப்படுத்தவில்லை.
theological_decisions:
- issue: θέλει என்பதில் இறை விருப்பம்
  choice: ‘தாம் விரும்புகிறவருக்கு / விரும்புகிறவரை’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: இறைவன் வெறுமனே அனுமதிக்கிறார் எனப் பொருள்விரித்தல்
  rationale: கிரேக்க உரை இரண்டு கூற்றுகளிலும் இறைவனுடைய விருப்பத்தை நேரடியாகக் கூறுகிறது. முன்தீர்மானம் மற்றும் மனிதப் பொறுப்பு குறித்த விவாதத்தை மொழிபெயர்ப்பிலேயே தீர்க்காமல், உரையின் இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
- issue: σκληρύνει என்பதில் செயலின் காரணர்
  choice: ‘அவர் ... கடினப்படுத்துகிறார்’ என்ற செயப்பாட்டு வடிவம்
  alternative: ‘கடினமாவதற்கு அவர் அனுமதிக்கிறார்’
  rationale: மூலத்தில் செயப்பாட்டு வினை உள்ளது; அதை வெறும் அனுமதியாக மாற்றுவது மூலச்சொல்லின் நேரடியான கூறலைத் தளர்த்திவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்பது சூழலில் இறைவனைக் குறிக்கிறது; மரியாதை ஒருமையை ஒத்த ‘தாம்’ பயன்படுத்தப்பட்டுள்ளது. இரு கூற்றுகளின் இணை அமைப்பும் எதிர்மறை ஒப்புமையும் பாதுகாக்கப்பட்டுள்ளன.
