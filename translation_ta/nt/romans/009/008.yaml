id: ROM.9.8
reference: Romans 9:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: ta
  text: அதாவது, மாம்சத்தின் பிள்ளைகள்[a] கடவுளின் பிள்ளைகள் அல்ல; மாறாக, வாக்குறுதியின் பிள்ளைகளே சந்ததியாக[b] எண்ணப்படுகின்றனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ‘இயற்கையான வம்சவழியில் பிறந்த பிள்ளைகள்.’ கிரேக்கத்தில் சொல்லுக்குச் சொல்: ‘மாம்சத்தின் பிள்ளைகள்.’'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விதையாக எண்ணப்படுகின்றனர்.’ இங்கு ‘விதை’ என்பதற்கான கிரேக்கச் சொல் வழிவந்தோரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: அதாவது
  rationale: முந்தைய கூற்றை பவுல் விளக்கத் தொடங்குவதைக் காட்டும் இயல்பான, சுருக்கமான தமிழ் இணைப்புச்சொல்.
- source_word: τέκνα
  choice: பிள்ளைகள்
  rationale: ஆண், பெண் இருபாலரையும் உள்ளடக்கும் τέκνα என்பதையும், வசனத்தில் மீண்டும் வரும் சொல் ஒற்றுமையையும் காக்கிறது.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: மாம்சத்தின் பிள்ளைகள்
  rationale: உடல் சார்ந்த வம்சவழியைக் குறிக்கும் பவுலின் உருவகமான சொற்றொடரைத் தெளிவுபடுத்திச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: τέκνα τοῦ θεοῦ
  choice: கடவுளின் பிள்ளைகள்
  rationale: மூலத்தின் உடைமைத் தொடர்பையும், மாம்சத்தின் பிள்ளைகள் என்பதுடனான நேரடி முரண்பாட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: வாக்குறுதியின் பிள்ளைகள்
  rationale: கடவுள் அளித்த வாக்குறுதியால் வரையறுக்கப்படும் பிள்ளைகள் என்ற உறவை, பொதுவாசகருக்கு புரியும் நவீன தமிழில் காக்கிறது.
- source_word: λογίζεται
  choice: எண்ணப்படுகின்றனர்
  rationale: அவர்கள் அந்த வகையைச் சேர்ந்தவர்களாகக் கணக்கிடப்படுதல் அல்லது கருதப்படுதல் என்ற செயப்பாட்டு பொருளைத் தருகிறது; யார் எண்ணுகிறார் என்பதை மூலத்தைவிட வெளிப்படையாக்கவில்லை.
- source_word: εἰς σπέρμα
  choice: சந்ததியாக
  rationale: ஆபிரகாமின் வழிவந்தோர் என்ற சூழலில் σπέρμα குறிக்கும் கூட்டுப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சொல்லுக்குச் சொல் வடிவான ‘விதை’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: உடல் சார்ந்த இஸ்ரவேல் வம்சத்தாருக்கும் வாக்குறுதியால் வரையறுக்கப்படும் பிள்ளைகளுக்கும் இடையிலான முரண்பாடு
  choice: மாம்சத்தின் பிள்ளைகள் கடவுளின் பிள்ளைகள் அல்ல; வாக்குறுதியின் பிள்ளைகளே சந்ததியாக எண்ணப்படுகின்றனர்
  alternative: இந்தக் கூற்றை முழுவதும் கூட்டு-வரலாற்று தேர்வாகவோ, தனிநபர் முன்நியமனமாகவோ மொழிபெயர்ப்பிலேயே வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க உரை வேறுபாட்டை உறுதியாகச் சொல்கிறது; ஆனால் ரோமர் 9 பற்றிய விரிவான கோட்பாட்டு விவாதத்தை இந்த வசனத்திலேயே தீர்ப்பதில்லை. ஆகவே அந்த இறையியல் அழுத்தமும் தெளிவுபடுத்தப்படாத எல்லைகளும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாக்குத்தத்தம்’ என்ற மரபுவழி சமயச் சொல்லுக்குப் பதிலாக இயல்பான ‘வாக்குறுதி’ தேர்ந்தெடுக்கப்பட்டது; ‘மாம்சம்’ என்ற பவுலின் முக்கிய உருவகம் மட்டும் முதன்மை உரையில் காக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
