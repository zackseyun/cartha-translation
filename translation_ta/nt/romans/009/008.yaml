  source_fidelity: மூலக் கிரேக்கத்தின் விளக்கத் தொடக்கமான τοῦτ’ ἔστιν ‘அதாவது’ எனத் துல்லியமாகத் தரப்பட்டுள்ளது. ‘மாம்சத்தின் பிள்ளைகள்’ மற்றும் ‘வாக்குறுதியின் பிள்ளைகள்’ என்ற எதிர்நிலை, ‘கடவுளின் பிள்ளைகள் அல்ல’ என்ற மறுப்பு, மேலும் λογίζεται εἰς σπέρμα என்பதன் செயப்பாட்டு/வகைப்படுத்தும் பொருளான ‘சந்ததியாக எண்ணப்படுகின்றனர்’ ஆகியவை பொருளுடன் பொருந்துகின்றன. மூலத்தில் இல்லாத கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘மாறாக’ எதிர்மறைத் தொடர்பை இயல்பாகக் காட்டுகிறது; ‘சந்ததியாக எண்ணப்படுகின்றனர்’ ஆபிரகாமிய வம்சச் சூழலில் புரியத்தக்கது.
