  naturalness: ‘முன்பே கூறியிருக்கிறபடி’ என்பது ‘முன்பே கூறியிருப்பதுபோல’ என்பதைக் காட்டிலும் சுருக்கமாகவும் இயல்பாகவும் உள்ளது. ‘நமக்காகச் சந்ததியை விட்டுவைத்திருக்காவிட்டால்’ என்பது இங்கே உள்ள ἡμῖν-இன் பயனாளி நுணுக்கத்தைத் தெளிவாகத் தருகிறது.
