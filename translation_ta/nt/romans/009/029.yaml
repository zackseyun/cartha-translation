reference: Romans 9:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: ta
  text: 'மேலும், ஏசாயா முன்பே கூறியிருக்கிறபடி[c]: “படைகளின் ஆண்டவர்[a] நமக்காகச் சந்ததியை[b] விட்டுவைத்திருக்காவிட்டால், நாம் சோதோமைப் போல் ஆகியிருப்போம்; கொமோராவைப் போல் ஆக்கப்பட்டிருப்போம்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சபயோத்தின் ஆண்டவர்.” கிரேக்க Σαβαώθ என்பது “படைகள்” என்று பொருள்படும் எபிரெய சொல்லின் ஒலிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “விதை.” இங்கு உயிர்தப்பிய சந்ததியினரை அல்லது வழித்தோன்றல்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ஏசாயா 1:9-இலிருந்து மேற்கோள்.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς
  choice: கூறியிருப்பதுபோல
  rationale: καθὼς என்பதன் ஒப்புமைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: προείρηκεν
  choice: முன்பே கூறியிருக்கிறார்
  rationale: முன்னரே கூறப்பட்ட வார்த்தை இப்போதும் பொருத்தமுடையது என்ற நிறைவேற்றுக் காலத்தின் நுணுக்கத்தைத் தக்கவைக்கிறது; இதை முன்னறிவிப்பு என்று தேவையின்றி விளக்கவில்லை.
- source_word: κύριος Σαβαὼθ
  choice: படைகளின் ஆண்டவர்
  rationale: Σαβαώθ என்பது எபிரெய இறைப்பட்டத்தின் கிரேக்க ஒலிபெயர்ப்பு. ‘படைகள்’ என்பது அதன் பொருளைத் தெளிவாகத் தருகிறது; ‘ஆண்டவர்’ κύριος என்பதற்கு இயல்பான மரியாதைமிக்க தமிழ்.
- source_word: ἐγκατέλιπεν
  choice: விட்டுவைத்திராவிட்டால்
  rationale: எஞ்சியிருக்கும்படி விட்டுவைத்தல் என்ற அடிப்படைப் பொருளையும், இறந்தகால எதிர்மறை நிபந்தனையையும் வெளிப்படுத்துகிறது.
- source_word: σπέρμα
  choice: சந்ததி
  rationale: சொல்லுக்கு நேரடியாக ‘விதை’ என்று பொருள் இருந்தாலும், இங்கு உயிர்தப்பிய வழித்தோன்றல்களைக் குறிக்கிறது. ‘மீதியானோர்’ என்று மொழிபெயர்த்து விளக்கவியலை வசனத்துக்குள் கொண்டுவராமல் இருக்கிறது.
- source_word: ἂν ἐγενήθημεν
  choice: ஆகியிருப்போம்
  rationale: நிகழாத கடந்தகால விளைவைச் சுட்டும் ἄν உடனான கட்டமைப்பையும் γίνομαι என்பதன் ‘ஆதல்’ பொருளையும் காக்கிறது.
- source_word: ἂν ὡμοιώθημεν
  choice: ஆக்கப்பட்டிருப்போம்
  rationale: ὁμοιόω என்பதன் செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, முந்தைய ‘ஆகியிருப்போம்’ என்பதிலிருந்து பவுலின் இணை வினைச்சொற்களை வேறுபடுத்துகிறது.
theological_decisions:
- issue: பழைய ஏற்பாட்டு மேற்கோளிலுள்ள κύριος Σαβαώθ என்ற இறைப்பட்டம்
  choice: படைகளின் ஆண்டவர்
  alternative: சபயோத்தின் ஆண்டவர்; சேனைகளின் ஆண்டவர்
  rationale: கிரேக்கத்தில் எபிரெய பட்டம் ஒலிபெயர்க்கப்பட்டிருந்தாலும், அதன் பொருளைத் தமிழில் தருவது வாசகருக்குத் தெளிவாகும். ‘சேனைகள்’ என்பதைக் காட்டிலும் ‘படைகள்’ இன்றைய பொதுத்தமிழில் இயல்பானது.
- issue: σπέρμα என்பதைக் ‘மீதியானோர்’ என்று மொழிபெயர்க்கலாமா
  choice: சந்ததி
  alternative: விதை; வழித்தோன்றல்கள்; மீதியானோர்
  rationale: சூழலில் மீதியானோர் என்ற கருத்து இருந்தாலும், மூலச்சொல் ‘விதை/சந்ததி’ என்பதாகும். ஆகவே இறையியல் விளக்கத்தைச் சொல்லுக்குள் சேர்க்காமல் மூலத்தின் உருவகத்துக்கு நெருக்கமான பொருள் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதைமிக்க வேதாகம நடையைப் பயன்படுத்துகிறது. ‘சோதோமைப் போல் ஆகியிருப்போம்; கொமோராவைப் போல் ஆக்கப்பட்டிருப்போம்’ என்று இரண்டு வேறுபட்ட கிரேக்க வினைச்சொற்களும் தமிழில் வேறுபடுத்தப்பட்டுள்ளன.
