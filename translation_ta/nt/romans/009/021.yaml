  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: ta
  text: அல்லது, ஒரே களிமண் திரளிலிருந்து, ஒன்றை மரியாதைக்கான பாத்திரமாகவும் மற்றொன்றை அவமரியாதைக்கான பாத்திரமாகவும் செய்யக் குயவனுக்குக் களிமண்ணின் மீது அதிகாரம் இல்லையா?[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘களிமண்ணின் மீது உரிமை இல்லையா?’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒரே பிசைந்த தொகுதியிலிருந்து’ அல்லது ‘ஒரே திரளிலிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘ஒரு பாத்திரத்தை மதிப்புக்குரிய பயன்பாட்டிற்காகவும், மற்றொன்றைச் சாதாரண பயன்பாட்டிற்காகவும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: d
    text: இந்த உருவகம் ஏசாயா 29:16; 45:9; எரேமியா 18:1–6 போன்ற பழைய ஏற்பாட்டின் குயவன்–களிமண் பகுதிகளை எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: பவுலின் வாதத்தில் அடுத்த சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்துகிறது; கூடுதல் வலியுறுத்தலைச் சேர்க்காமல் தொடர்பைத் தக்கவைக்கிறது.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: அதிகாரம் இல்லையா?
  rationale: வெறும் திறனைவிட உரிமையுடனான அதிகாரத்தை ἐξουσία குறிக்கிறது; தமிழிலும் சொல்லாட்சிக் கேள்வியின் வடிவம் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: ὁ κεραμεὺς
  choice: குயவன்
  rationale: களிமண்ணைப் பாத்திரமாக வடிவமைக்கும் தொழிலாளிக்கான துல்லியமான, பொதுவாகப் புரியும் சொல்; தீர்க்கதரிசன நூல்களின் குயவன்–களிமண் உருவகத்தையும் தக்கவைக்கிறது.
- source_word: τοῦ πηλοῦ
  choice: களிமண்ணின்மேல்
  rationale: ἐξουσία என்பதுடன் வரும் உரிமை அல்லது ஆளுகை உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: ஒரே களிமண் திரளிலிருந்து
  rationale: φυράμα என்பது பிசைந்து ஒன்றாக்கப்பட்ட திரள் அல்லது தொகுதியைக் குறிக்கிறது. சூழலைத் தெளிவாக்க ‘களிமண் திரள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ποιῆσαι
  choice: செய்ய
  rationale: உருவாக்குதல் என்ற எளிய பொருளை நேரடியாகத் தருகிறது; தேவையற்ற இலக்கிய உயர்வைச் சேர்ப்பதில்லை.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: ஒரு ... மற்றொன்று
  rationale: இரண்டு மாறுபட்ட விளைவுகளை இயல்பான தமிழில் தெளிவாக இணைக்கிறது.
- source_word: εἰς τιμὴν
  choice: மதிப்புக்குரியதாக
  rationale: τιμή-யின் மதிப்பு மற்றும் கனம் சார்ந்த பொருளைத் தக்கவைக்கிறது; குறிப்பிட்ட பயன்பாட்டை உரையில் சேர்ப்பதில்லை.
- source_word: σκεῦος
  choice: பாத்திரம்
  rationale: குயவன் உருவகத்தில் இயல்பாகவும் துல்லியமாகவும் அமையும் தமிழ் இணைச்சொல்.
- source_word: εἰς ἀτιμίαν
  choice: மதிப்பற்றதாக
  rationale: ἀτιμία-வை τιμή-க்கு நேரெதிராக வெளிப்படுத்துகிறது; ‘பொதுப் பயன்பாடு’ என்ற சூழல்சார் விளக்கத்தை முதன்மை உரைக்குள் கொண்டு வராமல் விடுகிறது.
theological_decisions:
- issue: ἐξουσία என்பதை அதிகாரம், உரிமை, அல்லது வல்லமை என்று மொழிபெயர்ப்பது
  choice: அதிகாரம்
  alternative: உரிமை; வல்லமை
  rationale: ‘அதிகாரம்’ என்பது உரிமையுடனான தீர்மான அதிகாரத்தைச் சுட்டுகிறது; இறை இறையாண்மை மற்றும் மனிதப் பொறுப்பு குறித்த கோட்பாட்டு விவாதத்தை உரைக்கு அப்பால் தீர்மானிப்பதில்லை.
- issue: εἰς τιμὴν / εἰς ἀτιμίαν என்பதை பயன்பாட்டு வகைகளாக விளக்குவதா அல்லது மதிப்பு–மதிப்பின்மை எதிர்மறையைத் தக்கவைப்பதா
  choice: மதிப்புக்குரியதாக ... மதிப்பற்றதாக
  alternative: மதிப்புக்குரிய பயன்பாட்டிற்கு ... சாதாரண பயன்பாட்டிற்கு
  rationale: கிரேக்கம் நேரடியாக மதிப்பு–மதிப்பின்மை சொற்களைப் பயன்படுத்துகிறது. அவற்றைத் தக்கவைப்பது உருவகத்தை வீட்டு உபயோகப் பாத்திரங்களின் பணிகளுக்கு மட்டும் சுருக்காமல், பவுலின் சொல்லாட்சித் திட்பத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘பாத்திரம்’, ‘குயவன்’, ‘அதிகாரம்’ ஆகிய பரவலாக அறியப்பட்ட சொற்கள் பயன்படுத்தப்பட்டுள்ளன. முதன்மை உரை கிரேக்கத்தின் சுருக்கமான மதிப்பு–மதிப்பின்மை எதிர்மறையைப் பாதுகாக்கிறது; மாற்று பயன்பாட்டு விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
