  source_fidelity: முதன்மை உரை கேள்வி வடிவம், குயவன்–களிமண் உருவகம், ‘அதிகாரம்,’ ஒரே பிசைந்த திரள், மற்றும் இரண்டு பாத்திரங்களின் வேறுபாடு ஆகியவற்றைச் சரியாகப் பாதுகாக்கிறது. ஆனால் εἰς τιμήν / εἰς ἀτιμίαν என்பவை ‘மதிப்புக்குரியதாக / மதிப்பற்றதாக’ எனப் பொருள்படுத்தப்பட்டுள்ளன. இவை பாத்திரத்தின் உள்ளார்ந்த மதிப்பை மட்டுமல்ல, ‘மரியாதைக்காக / அவமரியாதைக்காக’ என்ற நோக்கு அல்லது வகைப்பாட்டைக் குறிக்கின்றன; குறிப்பாக ‘மதிப்பற்ற’ என்பது ἀτιμίαனைவிட ‘worthless’ என்ற அதிகமான பொருளைத் தருகிறது.
  naturalness: மொழிநடை நவீனத் தமிழில் இயல்பாக உள்ளது. ‘களிமண்ணின்மேல்’ என்பதற்குப் பதிலாக ‘களிமண்ணின் மீது’ என்பது சற்றே வழக்கமான எழுத்துநடை. ‘மரியாதைக்கான பாத்திரம் / அவமரியாதைக்கான பாத்திரம்’ என்பது மூலத்தின் சுருக்கத்தையும் எதிர்மறையையும் இயல்பாகத் தருகிறது.
  terminology: ‘குயவன்,’ ‘களிமண்,’ ‘அதிகாரம்,’ ‘பாத்திரம்’ ஆகியவை துல்லியமும் நிலையான பயன்பாடும் உடையவை. ‘மதிப்பற்ற’ என்பதற்குப் பதிலாக ‘அவமரியாதைக்கான’ பயன்படுத்தப்பட வேண்டும்; அது τιμή/ἀτιμία என்ற மரியாதை–அவமரியாதை எதிரிணையைப் பாதுகாக்கிறது.
