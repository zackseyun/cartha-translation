id: ROM.9.24
reference: Romans 9:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: ta
  text: யூதர்களிலிருந்து மட்டுமல்ல, யூதரல்லாத மக்களிலிருந்தும் அவர் மேலும் அழைத்த நம்மையே—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: அவர் அழைத்த நம்மையே
  rationale: οὓς என்பதன் தொடர்புப்பெயர் பங்கையும் ἡμᾶς என்பதன் விளக்கமான வலியுறுத்தலையும் இயல்பான தமிழில் ஒன்றிணைக்கிறது; முந்தைய வசனத்தில் கூறப்பட்ட இரக்கத்தின் பாத்திரங்கள் ‘நாம்’ என்பதையும் காட்டுகிறது.
- source_word: καὶ ἐκάλεσεν
  choice: அவர் அழைத்த
  rationale: καλέω என்பதற்கு பவுலின் பயன்பாட்டில் முக்கியமான ‘அழைத்தார்’ என்ற பொருளைத் தக்கவைக்கிறது. καί தரும் சேர்க்கை வலியுறுத்தல் தமிழில் ‘நம்மையே’ மற்றும் தொடர்ச்சியான சூழலால் வெளிப்படுகிறது.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: மட்டுமல்ல ... -உம்
  rationale: இரு குழுக்களையும் இணைக்கும் கிரேக்க எதிரிணை அமைப்பை இயல்பான தமிழ் ‘மட்டுமல்ல ... -உம்’ வடிவில் தருகிறது.
- source_word: ἐξ Ἰουδαίων
  choice: யூதர்களிலிருந்து
  rationale: ἐξ குறிக்கும் குழுவிலிருந்து அழைத்தல் என்ற மூலப் பொருளையும் Ἰουδαίων என்ற மக்கள் அடையாளத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐξ ἐθνῶν
  choice: பிற இனத்தாரிலிருந்தும்
  rationale: யூதர்களுக்கு மாறான யூதரல்லாத மக்களை இச்சூழலில் தெளிவாகக் குறிக்கிறது; ‘நாடுகள்’ என்று மொழிபெயர்ப்பதால் ஏற்படக்கூடிய அரசியல்-புவியியல் தவறான புரிதலைத் தவிர்க்கிறது.
theological_decisions:
- issue: முந்தைய வசனத்தின் ‘இரக்கத்தின் பாத்திரங்கள்’ என்பவர்களுடன் உள்ள தொடர்பு
  choice: அவர் அழைத்த நம்மையே
  alternative: அவர் அழைத்தவர்களாகிய நம்மை
  rationale: ‘நம்மை’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களை அடையாளப்படுத்துகிறது; அழைப்பு அல்லது தேர்வு குறித்த மேலதிக இறையியல் முடிவை உரைக்குள் சேர்க்கவில்லை.
- issue: ἐθνῶν என்பதன் யூதர்/யூதரல்லாதவர் வேறுபாடு
  choice: பிற இனத்தார்
  alternative: நாடுகள்
  rationale: உடனடி சூழலில் யூதர்களுடன் வேறுபடுத்தப்படும் யூதரல்லாத மக்களையே குறிக்கிறது. ‘பிற இனத்தார்’ அந்த வரலாற்று-மக்களின வேறுபாட்டை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. வசனம் முந்தைய வாக்கியத்தைத் தொடர்வதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது; கிரேக்கச் சொல்வரிசையை அப்படியே பின்பற்றாமல், அதன் தொடர்பும் வலியுறுத்தலும் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
