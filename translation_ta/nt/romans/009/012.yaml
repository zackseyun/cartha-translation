  text: οὐκ ἐξ ἔργων ἀλλ’ ἐκ τοῦ καλοῦντος, ἐρρέθη αὐτῇ ὅτι Ὁ μείζων δουλεύσει τῷ ἐλάσσονι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: ta
  text: செயல்களின் அடிப்படையில் அல்ல, அழைப்பவரின் அடிப்படையிலேயே—அவளிடம், “மூத்தவன் இளையவனுக்குப் பணிசெய்வான்” என்று சொல்லப்பட்டது.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ஆதி 25:23-இலிருந்து மேற்கோள்.
    reason: cross_reference
  - marker: c
    text: அல்லது, “பெரியவன் சிறியவனுக்குப் பணிசெய்வான்.” யாக்கோபு–ஏசா சூழலை முன்னிட்டு “மூத்தவன்/இளையவன்” என்று முதன்மை உரையில் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: செயல்களினால் அல்ல
  rationale: ἐκ இங்கு மூலம் அல்லது அடிப்படையைக் குறிக்கிறது. தமிழில் “செயல்களினால் அல்ல” என்பது பவுலின் சுருக்கமான முரண்பாட்டைக் காத்து, இயல்பாகவும் விளங்குகிறது.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: அழைக்கிறவரினாலேயே
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை வடிவத்தை “அழைக்கிறவர்” காக்கிறது. “-ஏ” செயல்களுக்கும் அழைக்கிறவருக்கும் இடையிலான வலுவான எதிர்மறை ஒப்புமையை வெளிப்படுத்துகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத “தேவன்” என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ἐρρέθη αὐτῇ
  choice: அவளிடம் ... என்று சொல்லப்பட்டது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும், சொல்லுபவர் யார் என்பதை வெளிப்படையாகச் சேர்க்காத மேற்கோள் அறிமுகத்தையும் இது காக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: ὅτι இங்கு நேர்க் கூற்றை அறிமுகப்படுத்துகிறது. தமிழில் மேற்கோள் குறிகளுடன் “என்று” பயன்படுத்துவது இயல்பான நேர்க் கூற்று அமைப்பு.
- source_word: Ὁ μείζων
  choice: மூத்தவன்
  rationale: யாக்கோபு–ஏசா சூழலில் வயதில் மூத்தவன் என்பதே கருத்து. அதேவேளையில் “பெரியவன்” என்ற சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: δουλεύσει
  choice: பணிசெய்வான்
  rationale: δουλεύω அடிமையாகச் சேவிப்பதையும் கீழ்ப்பட்டுப் பணியாற்றுவதையும் குறிக்கலாம். இங்கு சகோதரர்கள்/மக்களினங்களுக்கிடையிலான கீழ்ப்பட்ட நிலையை மிகைப்படுத்தாமல் “பணிசெய்வான்” எடுத்துரைக்கிறது.
- source_word: τῷ ἐλάσσονι
  choice: இளையவனுக்கு
  rationale: சூழலில் ἐλάσσων என்பது மூத்தவனுக்கு எதிரான இளைய சகோதரனைச் சுட்டுகிறது. “சிறியவன்” என்ற நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: “செயல்களினால் அல்ல, அழைக்கிறவரினாலேயே” என்ற முரண்பாட்டை நிபந்தனையற்ற தேர்வு குறித்த வெளிப்படையான கோட்பாட்டுக் கூற்றாக விரிவாக்க வேண்டுமா?
  choice: மூலத்தின் சுருக்கமான முரண்பாடு மட்டும் காக்கப்பட்டது.
  alternative: செயல்களின் காரணமாக அல்ல, அழைக்கிற தேவனின் காரணமாகவே
  rationale: வசனம் செயல்களையும் அழைப்பவரையும் எதிரெதிராக நிறுத்துகிறது. ஆனால் “தேவன்” என்பதையும் விரிவான கோட்பாட்டு முடிவையும் மொழிபெயர்ப்புக்குள் சேர்ப்பது, சூழலிலிருந்து பெற வேண்டிய விளக்கத்தை வசனத்திலேயே புகுத்திவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடையைக் கொண்டுள்ளது. வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால் தொடக்கத் துணைவாக்கியத்தின் சுருக்கம் காக்கப்பட்டு, நீண்ட கோடு மூலம் மேற்கோள் அறிமுகத்துடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
