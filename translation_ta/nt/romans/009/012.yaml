revisions:
- from: செயல்களினால் அல்ல, அழைக்கிறவரினாலேயே[a]—அவளிடம், “மூத்தவன் இளையவனுக்குப் பணிசெய்வான்”[b][c] என்று சொல்லப்பட்டது.
  to: செயல்களின் அடிப்படையில் அல்ல, அழைப்பவரின் அடிப்படையிலேயே—அவளிடம், “மூத்தவன் இளையவனுக்குப் பணிசெய்வான்” என்று சொல்லப்பட்டது.[b][c]
  rationale: The revision clarifies the source/basis force of the Greek preposition while retaining the verse’s deliberately compact, context-dependent syntax. The Genesis-contextual rendering ‘மூத்தவன்/இளையவன்’ remains in the text, and the more literal comparative alternative remains available in the footnote. Footnote a is retained as supplied, although it is not anchored in the revised text because the revised wording adopts that basis-oriented alternative.
