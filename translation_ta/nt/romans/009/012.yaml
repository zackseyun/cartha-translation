review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the contrast between works and the calling one, the impersonal passive ‘it was said to her,’ and the future relationship in the Genesis quotation. However, ‘அழைக்கிறவரினாலேயே’ is most naturally instrumental/causal (‘by/because of the one who calls’) and its emphatic ending can imply exclusivity. Rendering the phrase explicitly as a matter of basis more accurately represents ἐκ in this argument.
  naturalness: The quotation and its introduction are natural modern Tamil. ‘மூத்தவன் இளையவனுக்குப் பணிசெய்வான்’ is clear and appropriately restrained. The revised first phrase is more idiomatic for an abstract contrast of grounds or basis.
  terminology: ‘செயல்கள்,’ ‘அழைப்பவர்,’ ‘மூத்தவன்,’ and ‘இளையவன்’ are suitable modern-standard Tamil choices. ‘பணிசெய்வான்’ appropriately conveys the relational subordination without importing an unnecessarily specific institutional sense of slavery.
  issues:
  - severity: medium
    issue: ‘அழைக்கிறவரினாலேயே’ can be read as instrumental or causal and adds a stronger ‘only’ nuance.
    rationale: The Greek ἐκ marks source/basis in contrast to ἐξ ἔργων. ‘அழைப்பவரின் அடிப்படையிலேயே’ communicates that contrast more directly in Tamil, without suggesting that the cited statement itself was spoken by the caller or adding an exclusivist claim.
  revised_text: செயல்களின் அடிப்படையில் அல்ல, அழைப்பவரின் அடிப்படையிலேயே—அவளிடம், “மூத்தவன் இளையவனுக்குப் பணிசெய்வான்” என்று சொல்லப்பட்டது.[b][c]
