source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: ta
  text: 'ஏனெனில், வேதவாக்கியம் பார்வோனிடம் இவ்வாறு சொல்கிறது: “இந்த நோக்கத்திற்காகவே நான் உன்னை எழுப்பினேன்[a]: உன்னில் என் வல்லமையை வெளிப்படுத்துவதற்காகவும், பூமியெங்கும் என் பெயர்[b] அறிவிக்கப்படுவதற்காகவும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன்னை நிலைநிறுத்தினேன்” அல்லது “உன்னை உயிரோடு வைத்தேன்” என்றும் பொருள் கொள்ளலாம்; யாத்திராகம மேற்கோளின் சூழலில், இந்த வினைச்சொல் இத்தகைய பரந்த பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “என் பெயர்” என்பது வெறும் அழைப்புப் பெயரை மட்டுமல்ல, கடவுள் தம்மை வெளிப்படுத்தியதால் அறியப்படும் அவருடைய புகழையும் பெருமையையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφὴ τῷ Φαραώ
  choice: ஏனெனில், வேதவாக்கியம் பார்வோனிடம் இவ்வாறு சொல்கிறது
  rationale: γὰρ முந்தைய வாதத்துடனான விளக்கத் தொடர்பைத் தக்கவைக்க ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது. நிகழ்கால λέγει மற்றும் வேதவாக்கியம் பேசுவதாகக் கூறும் ஆளுருவாக்கம் இரண்டும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: இந்த நோக்கத்திற்காகவே
  rationale: αὐτὸ வலியுறுத்தும் குறிப்பிட்ட நோக்கத்தையும் εἰς உணர்த்தும் நோக்கச் சார்பையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐξήγειρά σε
  choice: நான் உன்னை எழுப்பினேன்
  rationale: ஒருவரை எழுப்புதல், முன்னிலைக்குக் கொண்டுவருதல், நிலைநிறுத்துதல் ஆகிய பரந்த பொருள்களை ஏற்கக்கூடிய கிரேக்கச் சொல்லின் வலிமையைச் சுருக்காமல் தக்கவைக்கிறது.
- source_word: ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου
  choice: உன்னில் என் வல்லமையை வெளிப்படுத்துவதற்காகவும்
  rationale: ὅπως என்பதன் நோக்கப் பொருளையும் ἐν σοὶ என்பதன் ‘உன்னில்’ என்ற வடிவத்தையும் பாதுகாக்கிறது; ‘உன் மூலமாக’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: καὶ ὅπως διαγγελῇ τὸ ὄνομά μου
  choice: என் பெயர் அறிவிக்கப்படுவதற்காகவும்
  rationale: διαγγελῇ என்பதன் பரவலான பொது அறிவிப்பையும் அதன் செயப்பாட்டு வடிவத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: பூமியெங்கும்
  rationale: அறிக்கையின் உலகளாவிய பரப்பைச் சுருக்காமல், நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: பார்வோனைக் குறித்து ἐξήγειρά σε என்பதன் பொருளும் இறை ஆளுகையும்
  choice: “நான் உன்னை எழுப்பினேன்” என்று பரந்த பொருளுடன் மொழிபெயர்க்கப்பட்டது.
  alternative: “நான் உன்னை நிலைநிறுத்தினேன்” அல்லது “நான் உன்னை உயிரோடு வைத்தேன்”
  rationale: சொல் பார்வோனை இந்தப் பங்கிற்காகக் கடவுள் முன்னிலைக்குக் கொண்டுவந்ததையோ நிலைத்திருக்கச் செய்ததையோ குறிக்கலாம். படைத்தார், உயிர்த்தெழச் செய்தார், அல்லது வெறுமனே உயிரோடு காத்தார் என்ற ஒரே விளக்கத்திற்குள் வசனத்தைச் சுருக்காமல், இறை ஆளுகைக்கும் மனிதப் பொறுப்புக்கும் இடையிலான வேதவாக்கியத்தின் பதற்றம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வேதவாக்கியம்’ என்பது ஒருமை வடிவத்தையும் அது பேசுவதாகக் கூறும் மூலத்தின் ஆளுருவாக்கத்தையும் தக்கவைக்கிறது. இணையான இரு நோக்கக் கூறுகளும் ‘வெளிப்படுத்துவதற்காகவும் … அறிவிக்கப்படுவதற்காகவும்’ என்ற சமச்சீர் அமைப்பில் வழங்கப்பட்டுள்ளன.
