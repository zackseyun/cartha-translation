  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: ta
  text: 'எழுதியிருக்கிறபடி: “யாக்கோபை நான் நேசித்தேன்; ஆனால் ஏசாவை நான் வெறுத்தேன்.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிராகரித்தேன்” அல்லது “குறைவாக நேசித்தேன்.” இங்குள்ள “வெறுத்தேன்” என்பதைச் சிலர் உணர்ச்சிப்பூர்வமான பகைமையாக அல்லாமல், உடன்படிக்கை சார்ந்த நிராகரிப்பாகவோ ஒப்பீட்டளவிலான விருப்பமாகவோ புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: மல்கியா 1:2–3-இலிருந்து மேற்கோள்.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς
  choice: எழுதப்பட்டிருக்கிறபடி
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் καθὼς γέγραπται என்ற சொற்றொடரை இயல்பான, மரியாதைக்குரிய நவீனத் தமிழில் ஒருங்கிணைத்து வழங்குகிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: நிறைவேற்றுச் செயப்பாட்டு வடிவத்தின் தொடரும் நிலையைத் தக்கவைத்து, புதிய ஏற்பாட்டின் வழக்கமான வேத மேற்கோள் சூத்திரத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἰακώβ
  choice: யாக்கோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்; வேற்றுமை உருபுடன் ‘யாக்கோபை’ என வருகிறது.
- source_word: ἠγάπησα
  choice: நான் நேசித்தேன்
  rationale: இறந்தகால வினை வடிவத்தையும் ἀγαπάω என்பதன் நேரான பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: யாக்கோபுக்கும் ஏசாவுக்கும் இடையிலான தெளிவான முரணைக் காட்டுகிறது.
- source_word: Ἠσαῦ
  choice: ஏசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்; வேற்றுமை உருபுடன் ‘ஏசாவை’ என வருகிறது.
- source_word: ἐμίσησα
  choice: நான் வெறுத்தேன்
  rationale: μισέω என்பதன் நேரான, வலுவான பொருளை மென்மைப்படுத்தாமல் காக்கிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: தெய்வீகத் தெரிந்துகொள்ளுதல் குறித்த விவாதத்தின் காரணமாக ‘வெறுத்தேன்’ என்பதை மென்மைப்படுத்த வேண்டுமா
  choice: முதன்மை உரையில் ‘நான் வெறுத்தேன்’ என நேரடியாக வைத்தல்
  alternative: ‘நான் நிராகரித்தேன்’ அல்லது ‘குறைவாக நேசித்தேன்’
  rationale: கிரேக்க மேற்கோள் μισέω என்ற வலுவான சொல்லையே பயன்படுத்துகிறது. அதனை மென்மைப்படுத்துவது ஓர் விளக்கத்தை உரைக்குள் கொண்டுவரும்; ஆகவே இறையியல் பதற்றம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, சாத்தியமான உடன்படிக்கை சார்ந்த அல்லது ஒப்பீட்டு நுணுக்கங்கள் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. மூலத்தின் வலுவான சொல்லாட்சியும் இறையியல் பதற்றமும் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளன.
