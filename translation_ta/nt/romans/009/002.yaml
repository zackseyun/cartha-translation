  text: ὅτι λύπη μοί ἐστιν μεγάλη καὶ ἀδιάλειπτος ὀδύνη τῇ καρδίᾳ μου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/002.yaml
  text: that I have great sorrow and unceasing pain in my heart[a][b][c].
translation:
  language: ta
  text: எனக்குப் பெருந்துயரமும், என் இதயத்தில் இடைவிடாத வேதனையும் உண்டு.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துயரம்’ என்பதற்கு ‘துக்கம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வேதனை’ என்பதற்கு ‘மனவலி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொற்பட ‘என் இதயத்திற்கு’ என்று உள்ளது; இது இங்கே இயல்பான தமிழில் ‘என் இதயத்தில்’ என வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: எனக்கு…உண்டு
  rationale: முந்தைய வசனத்தில் தொடங்கிய உறுதிமொழியின் உள்ளடக்கத்தை ὅτι அறிமுகப்படுத்துகிறது. தனி வசனமாக இயல்பான தமிழில் வாசிக்கும்போது இதற்கென வெளிப்படையான இணைப்புச் சொல் தேவையில்லை.
- source_word: λύπη
  choice: துயரம்
  rationale: ஆழ்ந்த வருத்தம் அல்லது மனத்துயரைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: μοί ἐστιν
  choice: எனக்கு…உண்டு
  rationale: εἰμί என்பதுடன் வரும் உடைமை/அனுபவ வேற்றுமையை இயல்பான தமிழில் அனுபவத்தைச் சுட்டும் ‘எனக்கு…உண்டு’ என வழங்குகிறது.
- source_word: μεγάλη
  choice: பெரும்
  rationale: துயரத்தின் தீவிரத்தை நேரடியாகக் காட்டும் இயல்பான அடைமொழி.
- source_word: καὶ
  choice: -உம்…-உம்
  rationale: இரு துயர வெளிப்பாடுகளையும் தமிழுக்கேற்ற இணை அமைப்பில் ஒருங்கிணைக்கிறது.
- source_word: ἀδιάλειπτος
  choice: இடைவிடாத
  rationale: தொடர்ச்சியாக நிற்காமல் நீடிப்பதைத் தெளிவாகவும் தீவிரமாகவும் தெரிவிக்கிறது.
- source_word: ὀδύνη
  choice: வேதனை
  rationale: கடுமையான உள்ளார்ந்த மனவலியைக் குறிக்கிறது; ‘வலி’ என்பதைவிட இச்சூழலில் உணர்ச்சிசார் ஆழத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῇ καρδίᾳ μου
  choice: என் உள்ளத்தில்
  rationale: கிரேக்கத்தின் ‘என் இருதயத்திற்கு’ என்ற சொல்லமைப்பு உள்ளார்ந்த உணர்வின் இருப்பிடத்தைக் குறிக்கும் மொழிமரபு; நவீனத் தமிழில் ‘என் உள்ளத்தில்’ அதனை இயல்பாக வழங்குகிறது.
