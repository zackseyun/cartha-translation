revisions:
- from: ஆனால் நீதிக்குரிய[a] ஒரு சட்டத்தை நாடிய இஸ்ரவேலோ, அந்தச் சட்டத்தை எட்டவில்லை.[b]
  to: ஆனால் நீதியைச் சார்ந்த ஒரு சட்டத்தை நாடிய இஸ்ரவேலோ, அந்தச் சட்டத்தை எட்டவில்லை.
  rationale: “நீதிக்குரிய” என்பதற்குப் பதிலாக “நீதியைச் சார்ந்த” என மாற்றப்பட்டுள்ளது. இதனால் νόμον δικαιοσύνης என்பதிலுள்ள உறவு திறந்தவாறே பேணப்படுகிறது; சட்டம் நீதியை அளிக்கிறது அல்லது சட்டமே நீதியானது என்ற விளக்கம் உரையில் சேர்க்கப்படவில்லை. அடிக்குறிப்பு a புதிய சொல்லாக்கத்துடன் ஒத்திசைக்கப்பட்டுள்ளது. பிற கூறுகள் மூலத்திற்கும் நவீனத் தரத் தமிழுக்கும் ஏற்றவையாக உள்ளன.
