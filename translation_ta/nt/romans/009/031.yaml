  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: ta
  text: ஆனால் நீதியைச் சார்ந்த ஒரு சட்டத்தை நாடிய இஸ்ரவேலோ, அந்தச் சட்டத்தை எட்டவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰσραήλ
  choice: இஸ்ரவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்; இங்கு பவுலின் வாதத்தில் இன/தேசிய இஸ்ரவேலைக் குறிக்கிறது.
- source_word: δέ
  choice: ஆனால் … இஸ்ரவேலோ
  rationale: முந்தைய வசனத்தில் பிற இனத்தாரைப் பற்றிக் கூறியதற்கு இங்கு வரும் முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: διώκων
  choice: நாடிய
  rationale: இலக்கைத் தீவிரமாகப் பின்தொடர்தல் என்ற கருத்தைச் சுருக்கமாகத் தருகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘இருந்தபோதிலும்’ என்ற concessive தொடர்பைச் சேர்ப்பதில்லை.
- source_word: νόμον δικαιοσύνης
  choice: நீதிக்குரிய ஒரு சட்டம்
  rationale: உறுப்பில்லாத νόμον என்பதைக் ‘ஒரு சட்டம்’ என்று தருகிறது. δικαιοσύνης என்பதற்கும் νόμον என்பதற்கும் இடையிலான உறவை மிகையாக விளக்காமல், நீதியைச் சார்ந்த அல்லது நீதியால் பண்புபெற்ற சட்டம் என்ற திறந்த பொருளைப் பேணுகிறது.
- source_word: δικαιοσύνης
  choice: நீதி
  rationale: பவுலின் பயன்பாட்டில் தேவனுக்கு முன்பான சரியான நிலை/நேர்மை என்ற கருத்தைத் தாங்கக்கூடிய இயல்பான தமிழ் சொல்; ‘நியாயம்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: εἰς νόμον
  choice: அந்தச் சட்டத்தை
  rationale: முன்னர் கூறப்பட்ட νόμον என்பதையே மீண்டும் சுட்டும் வகையில் தருகிறது; ‘சட்டத்தின் இலக்கு’ போன்ற விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
- source_word: οὐκ ἔφθασεν
  choice: எட்டவில்லை
  rationale: நாடிய இலக்கை அடையவோ சென்றடையவோ இல்லை என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பவுலின் சூழலில் δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: இச்சூழலில் ‘நீதி’ என்பது தேவனுக்கு முன்பான சரியான நிலை மற்றும் நேர்மை ஆகிய பவுலின் கருத்தோட்டத்துடன் இயல்பாகப் பொருந்துகிறது; ‘நியாயம்’ என்பதும் சொற்பொருள் வாய்ப்பாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: νόμον δικαιοσύνης என்ற தொடர் எதைக் குறிக்கிறது
  choice: நீதிக்குரிய ஒரு சட்டம்
  alternative: நீதியை அளிக்கும் ஒரு சட்டம்
  rationale: மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் பேணுவதற்காக, சட்டம் நீதியை அளிக்கிறது என்று காரண/விளைவு உறவை உரைக்குள் தீர்மானித்துச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சட்டம்’ என்பது νόμος என்பதற்கான தெளிவான பொதுச்சொல்; வாக்கியத்தின் எதிர்மறைத் திருப்பத்தை ‘ஆனால் … இஸ்ரவேலோ’ இயல்பாகக் காட்டுகிறது.
