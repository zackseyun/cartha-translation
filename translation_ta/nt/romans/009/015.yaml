  source_fidelity: மூல கிரேக்கத்தின் காரணத் தொடர்பான γάρ, மோசேயை நோக்கிய மேற்கோள் அறிமுகம், மற்றும் எதிர்கால வாக்குறுதி–மீளுரைப்பான அமைப்பு ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ἐλεέω மற்றும் οἰκτίρω ஆகிய இணைச்சொற்கள் முறையே ‘இரக்கம் காட்டுதல்’, ‘பரிவு கொள்ளுதல்’ என வேறுபடுத்தப்பட்டுள்ளன. ‘தேர்ந்தெடுப்பவர்’ போன்ற விளக்கச் சேர்க்கை எதுவும் இல்லை.
  naturalness: ‘ஏனெனில் அவர் மோசேயிடம் கூறுகிறார்’ மற்றும் ‘யாருக்கு… அவருக்கு…; யார்மேல்… அவர்மேல்…’ ஆகியவை நவீன நிலையான தமிழில் இயல்பாகவும், மேற்கோளின் வலியுறுத்தும் இணை அமைப்பைத் தக்கவைத்தும் உள்ளன.
