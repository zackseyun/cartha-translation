id: ROM.9.15
reference: Romans 9:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: ta
  text: 'ஏனெனில் அவர் மோசேயிடம் கூறுகிறார்: “நான் யாருக்கு இரக்கம் காட்டுவேனோ, அவருக்கு இரக்கம் காட்டுவேன்; யார்மேல் பரிவு கொள்வேனோ, அவர்மேல் பரிவு கொள்வேன்.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நான் யாருக்கு இரங்குவேனோ, அவருக்கு இரங்குவேன்; யார்மேல் மனதுருகுவேனோ, அவர்மேல் மனதுருகுவேன்.”'
    reason: lexical_alternative
  - marker: b
    text: யாத்திராகமம் 33:19-லிருந்து மேற்கோள்.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: மோசேயிடம்
  rationale: λέγει என்பதுடன் வரும் வேற்றுமை வடிவம் உரை யாரை நோக்கிக் கூறப்படுகிறது என்பதைக் குறிக்கிறது; நவீனத் தமிழில் ‘மோசேயிடம்’ இயல்பான வடிவம்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான பவுலின் விளக்கக் காரணத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: λέγει
  choice: அவர் ... கூறுகிறார்
  rationale: கிரேக்கத்தின் நிகழ்கால மேற்கோள் நடையைப் பேணுகிறது. யாத்திராகமச் சூழலில் பேசுபவர் கடவுள் என்பதால் தனிப்பட்ட எழுவாய் பயன்படுத்தப்பட்டுள்ளது; பெயர் உரையில் புதிதாகச் சேர்க்கப்படவில்லை.
- source_word: Ἐλεήσω ... ἐλεῶ
  choice: இரக்கம் காட்டுவேன் ... இரக்கம் காட்டுவேன்
  rationale: ஒரே வினைச்சொல்லின் மறுபயன்பாட்டையும் வலியுறுத்தும் இணை அமைப்பையும் காக்கிறது. கிரேக்கத்தின் எதிர்கால–நிகழ்கால subjunctive அமைப்பு எபிரேயத் தாக்கமுள்ள சூத்திரமாக இருப்பதால், இயல்பான தமிழில் உறுதியான எதிர்கால வடிவால் தரப்பட்டுள்ளது.
- source_word: ὃν ἂν
  choice: யாருக்கு ... அவருக்கு / யார்மேல் ... அவர்மேல்
  rationale: குறிப்பிடப்படாத நபரைச் சுட்டும் தொடர்பு அமைப்பை இயல்பான தமிழ் ‘யார்... அவர்...’ வடிவில் தருகிறது; இரு வினைகளுக்கும் ஏற்ற உருபுகள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: οἰκτιρήσω ... οἰκτίρω
  choice: பரிவு கொள்வேன் ... பரிவு கொள்வேன்
  rationale: ἐλεέω என்பதிலிருந்து உள்ள சொற்பொருள் வேறுபாட்டைக் காத்து, இழிவுணர்வு தரக்கூடிய ‘பரிதாபப்படுதல்’ என்பதற்குப் பதிலாக ஆழ்ந்த இரக்கத்தைக் குறிக்கும் இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது.
theological_decisions:
- issue: மேற்கோள் அறிமுகத்தில் பேசுபவரின் அடையாளம்
  choice: ‘அவர் கூறுகிறார்’ என்று தனிப்பட்ட எழுவாயுடன் மொழிபெயர்த்தல்
  alternative: ‘வேதவாக்கு மோசேயிடம் கூறுகிறது’ என்று உயிரற்ற எழுவாயாக மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் எழுவாய் வெளிப்படையாக இல்லாவிட்டாலும், யாத்திராகமம் 33:19-ல் நேரடியாகப் பேசுபவர் கடவுள். ‘அவர்’ என்பது அந்தச் சூழலைப் பிரதிபலிக்கிறது; உரையில் இல்லாத பெயரைச் சேர்ப்பதில்லை.
- issue: இரக்கத்திலும் பரிவிலும் கடவுளின் சுதந்திரம்
  choice: மீளுரைக்கும் இறுக்கமான அமைப்பை விளக்கிச் சீராக்காமல் அப்படியே பேணுதல்
  alternative: ‘நான் தேர்ந்தெடுப்பவருக்கு இரக்கம் காட்டுவேன்’ என்று ‘தேர்ந்தெடுப்பது’ பற்றிய விளக்கத்தைச் சேர்த்தல்
  rationale: ‘தேர்ந்தெடுப்பேன்’ என்ற சொல் கிரேக்கத்தில் இல்லை. இறையியல் விவாதத்தை மொழிபெயர்ப்பிலேயே தீர்க்காமல், மூலத்தின் மறுபடியான சொல்லமைப்பையும் அதன் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘இரக்கம் காட்டுதல்’ மற்றும் ‘பரிவு கொள்ளுதல்’ என்ற இரு சொற்றொடர்கள் கிரேக்க இணைச்சொற்களின் வேறுபாட்டையும் கவிதைநயமான இணை அமைப்பையும் பேணுகின்றன.
