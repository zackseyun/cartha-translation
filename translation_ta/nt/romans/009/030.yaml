source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: ta
  text: அப்படியானால், நாம் என்ன சொல்வோம்? நீதியைத் தொடர்ந்து நாடாதிருந்த பிற இனத்தார்[b] நீதியை[a] அடைந்தார்கள்—அதாவது, அவர்கள் அடைந்தது விசுவாசத்திலிருந்து வரும் நீதியே[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதி’ என்பதற்கான கிரேக்கச் சொல் (δικαιοσύνη) இவ்வசனத்தில் வரும் எல்லா இடங்களிலும் ஒழுக்க நேர்மை, நியாயமான நிலை, உடன்படிக்கை சார்ந்த நீதி ஆகிய பொருள் நிழல்களை உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘பிற தேசத்தார்’; இங்கு இஸ்ரவேலரல்லாத மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘விசுவாசத்தின் மூலம் வரும் நீதி’; இங்கு சாத்தியம் குறைவாக இருந்தாலும், ‘உண்மைத்தன்மையிலிருந்து வரும் நீதி’ என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: அப்படியானால், நாம் என்ன சொல்வோம்?
  rationale: பவுல் வாதத்தின் அடுத்த கட்டத்துக்குச் செல்லப் பயன்படுத்தும் ஆலோசனைத் தன்மையுள்ள கேள்வியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἔθνη
  choice: பிற இனத்தார்
  rationale: இங்கு இஸ்ரவேலருக்கு மாறாக யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ என்பது பொருளைத் தெளிவாகவும் மரியாதையுடனும் தெரிவிக்கிறது.
- source_word: τὰ μὴ διώκοντα
  choice: நாடிக்கொண்டிராத
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான அல்லது வழக்கமான முயற்சி என்ற நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: தமிழில் ‘நீதி’ என்பது ஒழுக்க நேர்மை, கடவுளுக்கு முன்பான சரியான நிலை, நியாயம் ஆகிய பரப்புகளை ஓரளவு தக்கவைக்கக்கூடிய வழக்கமான பவுலியச் சொல்; ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாக இதைச் சுருக்கவில்லை.
- source_word: κατέλαβεν
  choice: அடைந்தார்கள்
  rationale: நாடாத ஒன்றை எட்டிப் பெற்றார்கள் என்ற சூழல்சார் பொருளை இயல்பாகத் தருகிறது; சொல்லின் உடல்சார்ந்த ‘பற்றிக்கொண்டார்கள்’ என்ற படிமத்தைத் தேவையின்றி முன்னிறுத்தவில்லை.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: அதாவது, விசுவாசத்திலிருந்து வரும் நீதியை
  rationale: மீண்டும் வரும் ‘நீதி’ எந்த வகையானது என்பதை இத்தொடர் குறிப்பதாகத் தமிழில் தெளிவுபடுத்துகிறது. δέ-ஐ கட்டாயமான எதிர்மறை இணைப்பாக மாற்றாமல், விளக்க/குறிப்பாக்கத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: πίστις என்பதற்கான நிலையான இறையியல் சொல்லைத் தக்கவைக்கிறது; இங்கு ‘உண்மைத்தன்மை’ என்று தீர்மானித்து மொழிபெயர்க்காமல் மாற்று வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுலின் வாதத்தில் δικαιοσύνη என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘நீதி’ என்று மொழிபெயர்த்து, அதை ‘கணக்கிடப்பட்ட நீதி’ அல்லது ‘உடன்படிக்கை உறுப்பினர் நிலை’ என மட்டும் குறுக்கவில்லை.
  alternative: நியாயம்; கடவுளுக்கு முன்பான சரியான நிலை; உடன்படிக்கைச் சமூகத்தில் ஏற்றுக்கொள்ளப்பட்ட நிலை
  rationale: இந்த வசனம் நீதியின் கோட்பாட்டு செயல்முறையை முழுமையாக விளக்கவில்லை. ‘நீதி’ என்ற சொல் பவுலின் கருத்துப் பரப்பையும் இறையியல் அழுத்தத்தையும் திறந்தவையாக வைத்திருக்கிறது.
- issue: ἐκ πίστεως என்பதன் பொருள்
  choice: ‘விசுவாசத்திலிருந்து வரும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: விசுவாசத்தின் மூலம் வரும்; விசுவாசத்தை அடிப்படையாகக் கொண்ட; உண்மைத்தன்மையிலிருந்து வரும்
  rationale: ἐκ என்ற முன்னிடைச்சொல்லின் மூல/தோற்றத் தொடர்பைத் தக்கவைத்து, மூலத்தில் இல்லாத ‘விசுவாசத்தினால் மட்டுமே’ போன்ற பிற்காலக் கோட்பாட்டு விரிவாக்கத்தைச் சேர்க்கவில்லை.
- issue: δικαιοσύνην δὲ என்ற மறுபடியான தொடரின் உறவு
  choice: ‘அதாவது’ என்ற குறிப்பாக்க உறவாக வழங்கப்பட்டது.
  alternative: ‘ஆனால்’ என்று எதிர்மறை இணைப்புடன் வழங்குதல்
  rationale: இங்கு இரண்டாவது ‘நீதி’ முதலாவதற்கு முரணான வேறொரு நீதியை அறிமுகப்படுத்துவதைவிட, பிற இனத்தார் அடைந்த நீதியின் தன்மையை விளக்குகிறது. அதேவேளை δέ-இன் லேசான திருப்பம் மறுபடியான அமைப்பில் உணரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையைப் பயன்படுத்துகிறது. ‘புறஜாதியார்’ போன்ற பழைய அல்லது சமூக ரீதியாகக் கடினமாக ஒலிக்கக்கூடிய சொல்லுக்கு மாறாக ‘பிற இனத்தார்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் ‘நீதி’ என்ற மறுபடியான சொல்லமைப்பு தமிழிலும் தக்கவைக்கப்பட்டுள்ளது.
