  to: அப்படியானால், நாம் என்ன சொல்வோம்? நீதியைத் தொடர்ந்து நாடாதிருந்த பிற இனத்தார்[b] நீதியை[a] அடைந்தார்கள்—அதாவது, அவர்கள் அடைந்தது விசுவாசத்திலிருந்து வரும் நீதியே[c].
  rationale: மூலத்தில் உள்ள ஒரே ‘அடைதல்’ வினையை மட்டும் வைத்துக்கொண்டு, இரண்டாவது ‘நீதி’யை அதன் தன்மையை விளக்கும் குறிப்பாக்கமாகத் தமிழில் மறுசீரமைத்துள்ளேன். ‘தொடர்ந்து நாடாதிருந்த’ என்பது நிகழ்காலப் பங்கேற்புவினையின் வழக்கமான/நடந்துகொண்டிருந்த முயற்சியின்மையை வெளிப்படுத்துகிறது. δέ-இன் லேசான குறிப்பாக்கத் திருப்பம் ‘அதாவது’ மூலம் தக்கவைக்கப்படுகிறது; அதை வலுவான முரண்பாடாக மாற்றவில்லை.
