id: ROM.9.7
reference: Romans 9:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: ta
  text: அவர்கள் ஆபிரகாமின் சந்ததியினர்[a] என்பதாலேயே அவர்கள் எல்லாரும் பிள்ளைகள் என்பதில்லை. மாறாக, “ஈசாக்கின் வழியாக உன் சந்ததி அழைக்கப்படும்[b]”[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஆபிரகாமின் வித்து.” கிரேக்கச் சொல் ஒருமையில் இருந்தாலும், சந்ததியாரைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அழைக்கப்படும்” என்பதைச் சூழலின்படி “பெயரிடப்படும்,” “அங்கீகரிக்கப்படும்,” அல்லது “கணக்கிடப்படும்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'ஆதியாகமம் 21:12-இன் மேற்கோள். இன்னும் சொல்லுக்குச் சொல்லான வடிவம்: “ஈசாக்கில் உன் வித்து அழைக்கப்படும்.”'
    reason: cross_reference
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: என்பதாலேயே ... என்பதில்லை
  rationale: οὐδέ முந்தைய கருத்தோடு இணையும் கூடுதல் மறுப்பைத் தருகிறது; ὅτι காரணத்தைக் குறிக்கிறது. தமிழில் இந்த அமைப்பு தர்க்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σπέρμα Ἀβραάμ
  choice: ஆபிரகாமின் சந்ததியினர்
  rationale: σπέρμα ஒருமை வடிவிலுள்ள கூட்டுப்பொருள் சொல். ‘சந்ததியினர்’ என்பது உடல்வழி வந்தவர்களைக் குறிக்கும் இவ்விடத்தின் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: πάντες τέκνα
  choice: அவர்கள் எல்லாரும் பிள்ளைகள்
  rationale: τέκνα பாலினப் பாகுபாடின்றி ‘பிள்ளைகள்’ என்று பொருள்படும். யாருடைய பிள்ளைகள் என்பதை மொழிபெயர்ப்பிலேயே நிர்ணயிக்காமல் மூலத்தின் சுருக்கத்தையும் இறையியல் இழுப்பையும் காக்கிறது.
- source_word: ἀλλ’
  choice: மாறாக
  rationale: முன்னைய கூற்றைத் திருத்தும் வலுவான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἐν Ἰσαὰκ
  choice: ஈசாக்கின் வழியாக
  rationale: ἐν இங்கு செமிய வழக்கில் வம்சம் வரும் வழியைக் குறிக்கிறது. ‘ஈசாக்கில்’ என்பது தமிழில் தெளிவற்றதாக இருப்பதால், ‘வழியாக’ என்பது பொருளை மிகைப்படுத்தாமல் இயல்பாகத் தருகிறது.
- source_word: κληθήσεταί
  choice: அழைக்கப்படும்
  rationale: καλέω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்துடன் நேரடியான சொற்பொருள் தொடர்பைக் காக்கிறது; ‘கணக்கிடப்படும்’ அல்லது ‘நியமிக்கப்படும்’ என்ற விளக்கப் பொருளை உரைக்குள் திணிக்கவில்லை.
- source_word: σοι σπέρμα
  choice: உன் சந்ததி
  rationale: σοι என்னும் வேற்றுமை வடிவத்தைத் தமிழில் இயல்பான உடைமைத் தொடராகவும், σπέρμα என்னும் கூட்டொருமையை ‘சந்ததி’ என்றும் தருகிறது.
theological_decisions:
- issue: உடல்வழிச் சந்ததிக்கும் பிள்ளைகள் எனப்படுவோருக்கும் உள்ள தொடர்பு
  choice: ஆபிரகாமின் உடல்வழிச் சந்ததியினர் அனைவரும் அதனாலேயே ‘பிள்ளைகள்’ அல்ல என்று மட்டும் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இங்கேயே அவர்களை ‘வாக்குத்தத்தத்தின் பிள்ளைகள்’ அல்லது ‘தேவனுடைய பிள்ளைகள்’ என்று வெளிப்படையாக விளக்குவது.
  rationale: இந்த வசனம் உடல்வழி உறவுக்கும் வாக்குறுதியால் அடையாளப்படுத்தப்படும் வழிக்கும் வேறுபாடு காட்டுகிறது; ஆனால் ‘பிள்ளைகள்’ என்பதன் முழு இறையியல் விளக்கத்தை அடுத்துள்ள வாதத்திற்கே விட்டுவைக்கிறது.
- issue: ஆதியாகம மேற்கோளில் κληθήσεταί என்பதன் வலிமை
  choice: அழைக்கப்படும்
  alternative: கணக்கிடப்படும் / நியமிக்கப்படும்
  rationale: ‘அழைக்கப்படும்’ என்பது அழைத்தல் அல்லது பெயரிடுதல் என்ற மூலச் சொல்லின் திறந்த பொருளைக் காக்கிறது. ‘கணக்கிடப்படும்’ என்பது பவுலின் நோக்கத்தை முன்கூட்டியே விளக்கும் அதிகப் பொருளுரை ஆகும்.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘சந்ததியினர்’ மற்றும் ‘சந்ததி’ என்ற வேறுபாடு முதல் பயன்பாட்டின் மனிதக் கூட்டத்தையும் மேற்கோளிலுள்ள கூட்டொருமையையும் இயல்பாக வெளிப்படுத்துகிறது. வசனத்தின் சுருக்கமான வாதநடையும் ‘பிள்ளைகள்’ என்பதிலுள்ள இறையியல் திறந்தநிலையும் பாதுகாக்கப்பட்டுள்ளன.
