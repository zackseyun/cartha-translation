id: ROM.9.20
reference: Romans 9:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: ta
  text: ஆனால்[a] மனிதனே,[b] கடவுளை எதிர்த்துப் பதில் சொல்லும் நீ யார்? உருவாக்கப்பட்டது, தன்னை உருவாக்கியவரிடம், “நீர் ஏன் என்னை இப்படி உருவாக்கினீர்?” என்று சொல்லுமா?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாறாக’ அல்லது ‘உண்மையில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் முந்தைய கருத்துக்கு எதிரான அல்லது அதைத் திருத்தி வலியுறுத்தும் திருப்பத்தைத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மனிதனே’ என்பது ஒருமை அழைப்பு; இங்கு அது மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்தும் ஒருவரைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: 'இந்தக் கிரேக்க வினா ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கிறது: உருவாக்கப்பட்டது தன்னை உருவாக்கியவரிடம் இப்படிச் சொல்லாது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: ஆனால்
  rationale: முந்தைய எதிர்வாதத்தைத் திருத்தி மறுக்கும் வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘மாறாக’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὦ ἄνθρωπε
  choice: மனிதனே
  rationale: நேரடி அழைப்பின் கூர்மையையும், கடவுளுக்கு முன் நிற்கும் ஒரு மனிதரை மனிதகுலத்தின் பிரதிநிதியாகச் சுட்டும் ஒருமை வடிவையும் காக்கிறது.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: கடவுளை எதிர்த்துப் பதில் சொல்லும்
  rationale: ἀνταποκρίνομαι என்பது நடுநிலையான பதிலைக் குறிக்காமல், எதிர்த்துப் பேசும் அல்லது மறுமொழி கூறும் நயத்தைக் கொண்டுள்ளது.
- source_word: τὸ πλάσμα
  choice: உருவாக்கப்பட்டது
  rationale: உருவாக்கப்பட்ட பொருளுக்கும் அதை உருவாக்கியவருக்கும் இடையிலான சொல்லிணைப்பையும் படைப்பு–படைத்தவர் வேறுபாட்டையும் காக்கிறது.
- source_word: τῷ πλάσαντι
  choice: தன்னை உருவாக்கியவரிடம்
  rationale: πλάσμα மற்றும் πλάσαντι ஆகிய ஒரே வேர்ச் சொற்களுக்கு இணையான தமிழ்ச் சொல்லிணைப்பை வழங்குகிறது; பொருளின் தொடர்பை ‘தன்னை’ தெளிவாக்குகிறது.
- source_word: Τί με ἐποίησας οὕτως;
  choice: நீர் ஏன் என்னை இப்படி உருவாக்கினீர்?
  rationale: ‘ஏன் என்னை இவ்வாறு செய்தீர்?’ என்ற மூலத்தின் பொருளை இயல்பான, கண்ணியமான நவீன தமிழில் அளிக்கிறது.
theological_decisions:
- issue: மனிதன் கடவுளை எதிர்த்துக் கேள்வி எழுப்பும் சொல்லாட்சியின் வலிமை
  choice: ‘எதிர்த்துப் பதில் சொல்லும்’ என்று கூர்மையாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘பதில் சொல்லும்’ அல்லது ‘மறுமொழி கூறும்’
  rationale: இங்கு வினைச்சொல் சாதாரண உரையாடலை அல்ல, கடவுளுக்கு எதிராக மறுத்துப் பேசுவதைக் குறிக்கிறது; படைத்தவருக்கும் படைப்புக்கும் இடையிலான பதற்றத்தை மென்மைப்படுத்தாமல் காக்க வேண்டும்.
- issue: ἄνθρωπε என்பதன் பிரதிநிதித்துவ ஒருமை
  choice: ‘மனிதனே’
  alternative: ‘மனிதப் பிறவியே’
  rationale: பவுல் ஓர் ஆண் நபரை மட்டும் அல்ல, கடவுளுக்கு முன் எதிர்வாதம் செய்யும் மனிதரைப் பிரதிநிதியாக விளிக்கிறார். தமிழில் ‘மனிதனே’ இந்த நேரடி ஒருமை அழைப்பையும் பொதுவான மனிதப் பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
- issue: μή உடைய வினாவிற்கு எதிர்பார்க்கப்படும் பதில்
  choice: தமிழில் இயல்பான ‘சொல்லுமா?’ என்ற வினா
  alternative: ‘அப்படிச் சொல்லாது அல்லவா?’
  rationale: கிரேக்க வினா எதிர்மறைப் பதிலை எதிர்பார்த்தாலும், அதை உரைக்குள்ளேயே வெளிப்படையாகச் சேர்ப்பது வாக்கியத்தின் வடிவத்தை அதிகமாக விளக்கிவிடும்; அந்த நயம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மனிதனே’ என்ற நேரடி அழைப்பும் ‘நீர்… உருவாக்கினீர்’ என்ற மரியாதை ஒருமையும் பவுலின் கூர்மையான வினாவைத் தக்கவைக்கின்றன; ‘உருவாக்கப்பட்டது/உருவாக்கியவர்’ என்ற சொல்லிணைப்பு மூலத்தின் வடிவமைத்தல் உருவகத்தைப் பாதுகாக்கிறது.
