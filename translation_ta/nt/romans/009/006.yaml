source:
  edition: SBLGNT
  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: ta
  text: ஆனால், கடவுளுடைய வார்த்தை தவறிப்போய்விட்டது என்பதல்ல. ஏனெனில், இஸ்ரவேலிலிருந்து வந்த அனைவரும்[a] இஸ்ரவேல் அல்ல[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலின் வம்சத்தில் வந்த அனைவரும்.’ கிரேக்கச் சொற்றொடர் தோற்றம் அல்லது வம்சவழியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இரண்டாவது ‘இஸ்ரவேல்’ முதலாவது பயன்பாட்டிலிருந்து வேறுபட்ட, குறுகிய பொருளில் உள்ளது. வெறும் வம்சவழி மட்டுமே இங்கு ‘இஸ்ரவேல்’ என்பதற்கான அளவுகோல் அல்ல என்று பவுல் வேறுபடுத்துகிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: ஆனால், ... என்று இதனால் பொருளல்ல
  rationale: பவுலின் முந்தைய புலம்பலிலிருந்து எழக்கூடிய தவறான முடிவை மறுத்துத் திருத்தும் கிரேக்கத் தொடரின் செயல்பாட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκπέπτωκεν
  choice: நிறைவேறாமல் போய்விட்டது
  rationale: இறைவார்த்தை பயனற்றதாகவோ தோல்வியுற்றதாகவோ ஆகிவிட்டதா என்ற சூழல்சார் பொருளையும், கடந்த நிகழ்வின் தற்போதைய விளைவைக் குறிக்கும் perfect வடிவின் நுணுக்கத்தையும் தருகிறது.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: λόγος என்பதை ‘வாக்குத்தத்தம்’ என்று குறுக்காமல், இறைவனின் உரைக்கப்பட்ட அல்லது வாக்குறுதியளிக்கப்பட்ட வார்த்தை என்ற பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: οὐ γὰρ πάντες
  choice: ஏனெனில், ... எல்லாரும் ... அல்ல
  rationale: γάρ முந்தைய மறுப்புக்கான விளக்கத்தை அறிமுகப்படுத்துவதால் ‘ஏனெனில்’ இயல்பாக தர்க்கத் தொடர்பைக் காட்டுகிறது.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: இஸ்ரவேலிலிருந்து வந்தவர்கள்
  rationale: ἐξ குறிக்கும் தோற்றம் அல்லது வம்சவழியை நேரடியாக வைத்துக்கொண்டு, அடுத்துவரும் இருவகைப் பயன்பாட்டை முன்கூட்டியே விளக்கிவிடாமல் பாதுகாக்கிறது.
- source_word: οὗτοι Ἰσραήλ
  choice: இஸ்ரவேல் அல்ல
  rationale: தமிழ் வாக்கிய அமைப்பில் ‘எல்லாரும் இஸ்ரவேல் அல்ல’ என்று இணைப்பது கிரேக்கத்தின் சுருக்கமான சமன்பாட்டுக் கூற்றையும் அதன் திட்டவட்டமான முரண்பாட்டையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘இஸ்ரவேல்’ என்ற இரண்டாவது பயன்பாட்டின் பொருள்
  choice: முதலாவது பயன்பாட்டைவிடக் குறுகிய உடன்படிக்கைசார் அல்லது இறையியல்சார் பொருளை முதன்மை உரை விளக்காமல் தக்கவைத்தல்
  alternative: இனத்தால் இஸ்ரவேலருக்குள் தேர்ந்தெடுக்கப்பட்டவர்கள்; அல்லது இன்னும் பரந்த பொருளில் கடவுளின் உண்மையான மக்கள் என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: உடல்சார் வம்சம் மட்டும் கடவுளின் மீட்புத் திட்டத்தில் ‘இஸ்ரவேல்’ என்பதன் முழுப் பொருளையும் நிர்ணயிக்காது என்பதே உடனடிக் கருத்து. ஆனால் அதன் துல்லியமான எல்லையைப் பவுல் இவ்வசனத்தில் வெளிப்படையாக வரையறுக்காததால், முதன்மை உரை அந்த இறையியல் இழுபறியைத் தீர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘கடவுளுடைய வார்த்தை’ என்ற மரபான, தெளிவான சொற்றொடர் காக்கப்பட்டது; ‘இஸ்ரவேல்’ என்ற இரு பயன்பாடுகளின் இறையியல் வேறுபாடு முதன்மை உரையில் விளக்கித் தீர்க்கப்படாமல் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
