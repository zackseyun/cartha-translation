  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: ta
  text: மேசியாவில்[a] நான் உண்மையைச் சொல்கிறேன்; நான் பொய் சொல்லவில்லை; பரிசுத்த ஆவியில்[c] என் மனச்சாட்சி என்னுடன் சேர்ந்து சாட்சி கொடுக்கிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவில்.” கிரேக்கச் சொல் Χριστός “மேசியா” என்ற பட்டமாகவோ, “கிறிஸ்து” என்ற பெயராகவோ அமையலாம்; இங்கு அது பட்டமாக மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் மனச்சாட்சி என்னுடன் சேர்ந்து சாட்சி கொடுக்கும்போது” அல்லது “என் மனச்சாட்சி என்னுடன் சாட்சியமளிக்கிறது.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பரிசுத்தமான ஓர் ஆவியில்.” ஆனால் பவுலின் பயன்பாட்டில் இது பரிசுத்த ஆவியைக் குறிப்பதாகப் புரிந்துகொள்வதே மிகவும் இயல்பு.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: நான் உண்மையைச் சொல்கிறேன்
  rationale: ἀλήθειαν λέγω என்பது உண்மையாகப் பேசுவதைச் சுட்டும் வழக்குச் சொற்றொடர். தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் அமைகிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவில்
  rationale: Χριστός இங்கு அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளைத் தக்கவைக்கிறது; ἐν என்பதன் உறவு/வட்டாரப் பொருளை ‘-இல்’ பாதுகாக்கிறது.
- source_word: οὐ ψεύδομαι
  choice: நான் பொய் சொல்லவில்லை
  rationale: நிகழ்கால மறுப்பின் நேரடியான, இயல்பான தமிழ் வடிவம்; பவுலின் வலியுறுத்திய மறுப்பைப் பாதுகாக்கிறது.
- source_word: συμμαρτυρούσης
  choice: என்னுடன் சேர்ந்து சாட்சி கொடுக்கிறது
  rationale: συν- என்ற ‘உடன்’ பொருளை வெளிப்படையாகப் பாதுகாத்து, உடன்நிகழும் மரபுத்தொடரின் கருத்தை இயல்பான தமிழ் வாக்கியமாக வழங்குகிறது.
- source_word: τῆς συνειδήσεώς μου
  choice: என் மனச்சாட்சி
  rationale: பவுலின் பயன்பாட்டில் συνείδησις என்பதற்கான நிலையான, புரிந்துகொள்ளத்தக்க தமிழ் இணை.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: பரிசுத்த ஆவியில்
  rationale: பவுலின் மொழிநடையில் தெய்வீக பரிசுத்த ஆவியைக் குறிக்கும் இயல்பான வாசிப்பு; ἐν என்பதை கருவிப்பொருளாக மாற்றாமல் ‘-இல்’ எனத் தக்கவைக்கிறது.
theological_decisions:
- issue: πνεύματι ἁγίῳ என்பதன் குறிப்பு
  choice: தெய்வீக பரிசுத்த ஆவி
  alternative: பரிசுத்தமான ஓர் ஆவி அல்லது பவுலின் பரிசுத்தப்படுத்தப்பட்ட மனித ஆவி
  rationale: கட்டுரைச் சொல் இல்லாவிட்டாலும், பவுலின் வழக்கிலும் இந்த ஆணையுறுதி போன்ற கூற்றின் சூழலிலும் ‘பரிசுத்த ஆவி’ என்பதே மிக இயல்பான வாசிப்பு. இருப்பினும் இலக்கண ரீதியான மாற்றுவாய்ப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: Χριστός என்பதன் செயல்பாடு
  choice: பட்டமாக ‘மேசியா’
  alternative: பெயரைப் போல் ‘கிறிஸ்து’
  rationale: கிரேக்கச் சொல் பட்டமாகவும் பெயரைப் போலவும் இயங்க முடியும். இங்கு அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளை முன்னிறுத்தி ‘மேசியா’ பயன்படுத்தப்படுகிறது; பரிச்சயமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நடை. கிரேக்கத்தின் ஆணையுறுதி போன்ற வலிமை, ‘உடன்’ என்ற கூட்டுச்சாட்சி நுட்பம், ἐν என்பதன் ‘-இல்’ வடிவம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
