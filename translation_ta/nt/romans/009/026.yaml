source:
  edition: SBLGNT
  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: ta
  text: மேலும், “நீங்கள் என் மக்கள் அல்ல” என்று அவர்களுக்குச் சொல்லப்பட்ட அதே இடத்தில்,[a] அங்கே அவர்கள் “வாழும் கடவுளின் மகன்கள்”[b] என்று அழைக்கப்படுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஓசியா 1:10-ஐக் காண்க (செப்டுவஜிந்தில் 2:1); இது உடன்படிக்கை உறவு மீண்டும் நிலைநாட்டப்படுவதைக் குறிக்கும் மொழியைப் பயன்படுத்துகிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, “பிள்ளைகள்.” கிரேக்கத்தில் “மகன்கள்” என்று உள்ளது; மகன்நிலை மற்றும் உரிமைப்பேறு சார்ந்த அதன் ஒலிப்பைக் காக்க அது முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய வசனத்துடன் மேற்கோளை இணைக்கும் எளிய இணைப்புச் சொல்லாக இயல்பாக அமைகிறது; கூடுதல் காரணவியல் பொருளைச் சேர்க்கவில்லை.
- source_word: ἔσται
  choice: என நிகழும்
  rationale: எதிர்காலத்தில் நிகழவிருப்பதை அறிமுகப்படுத்தும் εἰμί வினையின் பயன்பாட்டை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ τόπῳ οὗ
  choice: சொல்லப்பட்ட அதே இடத்தில்
  rationale: τόπος என்பதன் ‘இடம்’ என்ற பொருளையும், மறுப்பு கூறப்பட்ட இடத்திலேயே புதிய அடையாளம் வழங்கப்படும் வலியுறுத்தலையும் காக்கிறது.
- source_word: ἐρρέθη αὐτοῖς
  choice: அவர்களுக்குச் சொல்லப்பட்ட
  rationale: λέγω வினையின் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, செய்பவரை மூலத்தைப் போலவே குறிப்பிடாமல் விடுகிறது.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: நீங்கள் என் மக்கள் அல்ல
  rationale: ஓசியாவின் உடன்படிக்கைச் சூழலில் வரும் ‘என் மக்கள்’ என்ற அடையாளச் சொற்றொடரைத் தெளிவாகவும் நேரடியாகவும் காக்கிறது.
- source_word: ἐκεῖ
  choice: அதே இடத்தில்
  rationale: மறுப்பு கூறப்பட்ட இடத்திலேயே மாற்றம் நிகழ்வதைத் தமிழில் இயல்பாக வலியுறுத்துகிறது.
- source_word: κληθήσονται
  choice: அழைக்கப்படுவீர்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைக் காத்து, அழைப்பவர் யார் என்பதை மூலத்தைப் போல வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: υἱοὶ
  choice: மகன்கள்
  rationale: கிரேக்கச் சொல்லின் ஆண்பால் பன்மை வடிவத்தையும், மகன்நிலை மற்றும் உரிமைப்பேறு சார்ந்த சாத்தியமான ஒலிப்பையும் காக்கிறது; உள்ளடக்கிய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: θεοῦ ζῶντος
  choice: வாழும் கடவுளின்
  rationale: ‘வாழும் கடவுள்’ என்ற நிலைபெற்ற வேதாகமச் சொல்லாட்சியை இயல்பான தமிழில் காத்து, உயிரற்ற விக்கிரகங்களுடனான மறைமுக வேறுபாட்டையும் தக்கவைக்கிறது.
theological_decisions:
- issue: υἱοὶ என்ற பிரதிநிதித்துவப் பன்மையின் மொழிபெயர்ப்பு
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: மூலத்தில் பொதுவான τέκνα அல்ல, υἱοὶ என்ற சொல் உள்ளது. ஆகவே மகன்நிலை மற்றும் உரிமைப்பேறு சார்ந்த ஒலிப்பை அழிக்காமல் ‘மகன்கள்’ என்று முதன்மை உரையில் வைக்கப்படுகிறது; குறிப்பிடப்படுவோரில் பெண்களும் அடங்குவதால் ‘பிள்ளைகள்’ என்ற உள்ளடக்கிய பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: λαός μου என்பதிலுள்ள உடன்படிக்கை அடையாளம்
  choice: என் மக்கள்
  alternative: எனக்குரிய மக்கள்
  rationale: ஓசியா பின்னணியின் நிலையான உடன்படிக்கைச் சூத்திரத்தைப் பாதுகாக்க ‘என் மக்கள்’ என்ற நேரடி வடிவம் பயன்படுத்தப்படுகிறது.
- issue: κληθήσονται என்ற செயப்பாட்டில் மறைந்துள்ள செய்பவர்
  choice: அழைக்கப்படுவீர்கள்
  alternative: கடவுளால் அழைக்கப்படுவீர்கள்
  rationale: கிரேக்கம் செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. அது கடவுளைக் குறிக்கலாம் என்றாலும், அந்த விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் மறைமுகத்தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஓசியா மேற்கோளின் கவித்துவமான இடமாற்றத் திருப்பத்தைத் தக்கவைக்க ‘அதே இடத்தில்’ பயன்படுத்தப்பட்டுள்ளது. நேரடி உரைக்குள் இரண்டாம் நபர் வடிவத்தைத் தொடர்ந்து பயன்படுத்துவது தமிழில் மேற்கோளின் தாக்கத்தை இயல்பாகக் காக்கிறது.
