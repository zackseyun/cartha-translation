base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: ta
  text: 'ஓசியா நூலிலும்[a] அவர் கூறுவதுபோல:


    “என் மக்களாக இல்லாதவர்களை ‘என் மக்கள்’ என்றும்,[b]


    அன்பு பெறாதவளை ‘அன்பு பெற்றவள்’ என்றும்[c] அழைப்பேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது ஓசியா 2:23-இலிருந்து எடுக்கப்பட்ட மேற்கோள். செப்துவஜிந்திலும் எபிரேய உரை மரபிலும் வசன எண் சில மரபுகளில் மாறுபடுகிறது. ஓசியாவின் மீட்பு மொழியை, கடவுள் தமக்கென ஒரு மக்களை அழைப்பதற்குப் பவுல் பயன்படுத்துகிறார்.
    reason: cross_reference
  - marker: b
    text: 'இன்னும் சொற்சொல்லாக: “என் மக்களல்லாதவரை ‘என் மக்கள்’ என்று.” கிரேக்கத்தில் இலக்கண ஒருமை வடிவம் உள்ளது; ஆனால் “மக்கள்” என்பது கூட்டுப்பொருள் கொண்டது.'
    reason: lexical_alternative
  - marker: c
    text: “அன்புக்குரியவள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இரு சொற்களும் ஒரே ‘அன்பு செலுத்துதல்’ சொற்குடும்பத்தைச் சேர்ந்தவை; பெண்பால் ஒருமை வடிவமும் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: கூறுவதுபோல
  rationale: முன்னர் சொல்லப்பட்ட கருத்தை ஆதரிக்கும் வேதமேற்கோளை அறிமுகப்படுத்தும் ஒப்புமைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; καί-யின் கூடுதல் வலிமை ‘ஓசியா நூலிலும்’ என்பதில் தக்கவைக்கப்பட்டுள்ளது.
- source_word: ἐν τῷ Ὡσηὲ
  choice: ஓசியா நூலிலும்
  rationale: இது ஓசியாவின் நபரைக் காட்டிலும் அவரது தீர்க்கதரிசன நூலில் உள்ள மேற்கோளைக் குறிக்கும் வழக்கமான மேற்கோள் சூத்திரம். ‘நூல்’ என்பது தமிழில் பொருளைத் தெளிவாக்கும் இயல்பான விரிவாக்கம்.
- source_word: λέγει
  choice: அவர் கூறுவதுபோல
  rationale: கிரேக்கத்தில் உள்ள தனிப்பட்ட ஒருமை வினையைப் பேணுகிறது. சூழலில் பேசுபவர் கடவுள் என்பது விளங்குவதால், மூலத்தில் இல்லாத பெயரை வசனத்தில் சேர்க்கவில்லை.
- source_word: Καλέσω
  choice: அழைப்பேன்
  rationale: καλέω என்பதன் நேரடியான எதிர்காலப் பொருளையும், ஒருவருக்கு அடையாளம் அல்லது உறவுநிலையை வழங்கும் உடன்படிக்கை சார்ந்த நுண்ணுணர்வையும் பேணுகிறது.
- source_word: τὸν οὐ λαόν μου
  choice: என் மக்களாக இல்லாதவர்களை
  rationale: கிரேக்க வடிவம் ஒருமையாக இருந்தாலும் λαός கூட்டுப்பொருள் கொண்டது. தமிழில் ‘மக்கள்’ இயல்பாகப் பன்மைத் தொடர்பைக் கோருவதால் கூட்டுப்பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: λαόν μου
  choice: என் மக்கள்
  rationale: தேவனுக்கும் ஒரு மக்களுக்கும் இடையிலான உடன்படிக்கை உறவைக் குறிக்கும் சுருக்கமான, நிலைபெற்ற வேதாகமச் சொல்லாட்சியைப் பேணுகிறது.
- source_word: τὴν οὐκ ἠγαπημένην
  choice: அன்புபெறாதவளை
  rationale: பெண்பால் ஒருமையைப் பேணுவதோடு, அன்பு அவளுக்குக் கிடைக்காத நிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἠγαπημένην
  choice: அன்புபெற்றவள்
  rationale: முன் சொல்லுடன் ஒரே ‘அன்பு’ சொற்குடும்பத் தொடர்பைப் பேணி, அன்பைப் பெற்றவள் என்ற நிறைவு நிலையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஓசியா மேற்கோளில் கூட்டுப்பொருளா, தனிநபர் பொருளா
  choice: முதல் கூற்றை ‘என் மக்களாக இல்லாதவர்கள்’ என்று கூட்டுப்பொருளில் வழங்கி, இரண்டாம் கூற்றின் பெண்பால் ஒருமையை ‘அன்புபெறாதவள்’ என்று தக்கவைத்தல்.
  alternative: இரு கூற்றுகளையும் கண்டிப்பான ஒருமையில் வழங்குதல், அல்லது ‘என் மக்கள் அல்ல’, ‘அன்புபெறாதவள்’ என்ற பெயர்ப்பட்டங்களாக வழங்குதல்.
  rationale: λαός இயல்பாக ஒரு சமூகத்தைக் குறிக்கிறது; பவுலின் சூழலும் கடவுள் தமக்கென ஒரு மக்களை அழைப்பதைப் பற்றியது. அதேவேளை, இரண்டாம் கூற்றின் பெண்பால் வடிவம் ஓசியா பின்னணியின் உண்மையான அம்சம் என்பதால் அதைச் சமப்படுத்தாமல் பேண வேண்டும்.
- issue: λέγει என்பதன் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்று தனிப்பட்ட ஒருமையைப் பேணி, வசனத்தில் ‘கடவுள்’ என்று வெளிப்படையாகச் சேர்க்காமல் விடுதல்.
  alternative: ‘கடவுள் கூறுகிறார்’ அல்லது ‘அது கூறுகிறது’ என்று மொழிபெயர்த்தல்.
  rationale: மேற்கோளில் பேசுபவர் கடவுள் என்பது சூழலால் தெளிவாக இருந்தாலும், கிரேக்க உரை பெயரை வெளிப்படையாகக் கூறவில்லை. இம்மொழிபெயர்ப்பு அந்தத் தெளிவையும் மூலத்தின் மறைமுகத்தன்மையையும் ஒன்றாகப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் கவிதைநடை இரு இணையான வரிகளால் காட்டப்பட்டுள்ளது. ‘அன்புபெறாதவள் / அன்புபெற்றவள்’ என்ற இணைச்சொற்கள் மூலத்தின் சொல் மீளுருவாக்கத்தையும் பெண்பால் வடிவத்தையும் இயல்பாகப் பேணுகின்றன.
