  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: ta
  text: அது மட்டுமல்ல; ரெபெக்காளும் ஒரே மனிதரான நம் தந்தை ஈசாக்கால் கருத்தரித்திருந்தாள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘ஒருவரிடமிருந்து கருத்தரிப்பைப் பெற்றவளாய், நம் தந்தை ஈசாக்கிடமிருந்து.’ இது ஒரே மனிதரால் கருத்தரித்ததைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: அது மட்டுமல்ல; ... உம்
  rationale: பவுல் முந்தைய எடுத்துக்காட்டுடன் இன்னொன்றைச் சேர்க்கும் தொடர்பமைப்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: Ῥεβέκκα
  choice: ரெபெக்காள்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர்வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: ἐξ ἑνός
  choice: ஒரே மனிதரால்
  rationale: ‘ஒருவரிடமிருந்து’ என்ற மூலத்தின் சுருக்கத்தை இயல்பான தமிழில் தெளிவாக்கி, ஒரே ஆண் பெற்றோரைக் குறிக்கிறது.
- source_word: κοίτην ἔχουσα
  choice: கருத்தரித்திருந்தாள்
  rationale: படுக்கை/பாலுறவைக் குறிக்கும் கிரேக்க மரபுத்தொடர் இச்சூழலில் கருத்தரிப்பைக் குறிப்பதால், அதன் பொருளை கண்ணியமாகவும் தெளிவாகவும் தருகிறது.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: நம் தந்தையாகிய ஈசாக்கால்
  rationale: மூதாதை சார்ந்த ‘தந்தை’ என்னும் நேரடியான உறவுச் சொல்லைப் பேணி, ‘ஒரே மனிதர்’ யார் என்பதையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: தேர்ந்தெடுத்தலைப் பற்றிய பவுலின் வாதத்தில் கருத்தரிப்பு/பாலுறவு மரபுத்தொடரை எவ்வளவு வெளிப்படையாக மொழிபெயர்ப்பது
  choice: ரெபெக்காள் நம் தந்தையாகிய ஈசாக்கு என்னும் ஒரே மனிதரால் கருத்தரித்தாள் என்று தருதல்
  alternative: ‘ஒருவரிடமிருந்து படுக்கையை உடையவளாய்’ என்று சொற்சொல்லாகவோ, ‘ஒருவரால் கருத்தரித்தாள்’ என்று குறைந்த விளக்கத்துடனோ தருதல்
  rationale: இரட்டையர்களுக்கு ஒரே தாயும் ஒரே தந்தையும் இருந்தனர் என்பதே சூழலின் வாதத்திற்குப் பொருத்தமான குறிப்பு. ‘மனிதர்’ என்பதை வெளிப்படுத்துவது கிரேக்கத்தில் உள்ள மறைபொருளைத் தெளிவாக்குகிறது; கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ். மூலத்தின் சுருக்கமான அமைப்பையும் கருத்தரிப்பு மரபுத்தொடரின் பொருளையும் சமநிலைப்படுத்துகிறது.
