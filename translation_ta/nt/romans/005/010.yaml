id: ROM.5.10
reference: Romans 5:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: ta
  text: ஏனெனில், நாம் பகைவர்களாக இருந்தபோதே அவருடைய மகனின் மரணத்தின் மூலம் கடவுளோடு ஒப்புரவாக்கப்பட்டோம் என்றால், ஒப்புரவாக்கப்பட்டுவிட்ட நாம் அவருடைய மகனின் வாழ்வினால்[a] இன்னும் எவ்வளவு அதிகமாகக் காப்பாற்றப்படுவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய மகனின் வாழ்வில்.”
    reason: ἐν என்பது இங்கு கருவிப் பொருளில் ‘வாழ்வினால்’ என்றும், இடவியல் அல்லது இணைவு சார்ந்த பொருளில் ‘வாழ்வில்’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ஏனெனில் … என்றால்
  rationale: γάρ முந்தைய கூற்றுக்கான காரணத் தொடர்பைத் தருவதால் ‘ஏனெனில்’ என்றும், εἰ நிபந்தனை முன்மொழிவைத் தருவதால் ‘என்றால்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: ἐχθροὶ ὄντες
  choice: நாம் பகைவர்களாக இருந்தபோதே
  rationale: ὄντες குறிக்கும் முந்தைய நிலையையும், ἐχθροί குறிக்கும் உறவுசார் பகைநிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατηλλάγημεν
  choice: ஒப்புரவாக்கப்பட்டோம்
  rationale: இறைவனோடு முறிந்த உறவு சீராக்கப்பட்டதைச் சுட்டும் καταλλάσσω என்பதன் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளோடு
  rationale: καταλλάσσω என்பதோடு வரும் வேற்றுமையைத் தமிழில் இயல்பாக உறவுசார் பொருளில் தெரிவிக்கிறது.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: அவருடைய மகனின் மரணத்தின் மூலம்
  rationale: διά + genitive குறிக்கும் வழிமுறை அல்லது கருவிப் பொருளையும், υἱός என்பதன் தந்தை–மகன் உறவையும் நேரடியாகக் காக்கிறது.
- source_word: πολλῷ μᾶλλον
  choice: இன்னும் எவ்வளவு அதிகமாக
  rationale: பவுலின் குறைவிலிருந்து மிகுதிக்குச் செல்லும் வாதத்தின் வலிமையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καταλλαγέντες
  choice: ஒப்புரவாக்கப்பட்டுவிட்ட நாம்
  rationale: இறுதி மீட்புக்கு முன்னதாக ஏற்கெனவே நிகழ்ந்த ஒப்புரவாக்குதலை aorist passive participle-க்கு ஏற்றவாறு காட்டுகிறது.
- source_word: σωθησόμεθα
  choice: காப்பாற்றப்படுவோம்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், σῴζω என்பதன் மீட்பு சார்ந்த பொருளையும் பொதுமக்களுக்கு இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: அவருடைய வாழ்வினால்
  rationale: ἐν என்பதைக் கருவி அல்லது காரணப் பொருளில் எடுத்துக்கொண்டு, மகனுடைய மரணம்–வாழ்வு என்ற இணைமுரணைத் தெளிவாக வைத்திருக்கிறது; இடவியல் அல்லது இணைவு சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ἐν τῇ ζωῇ αὐτοῦ என்பதன் பொருள்
  choice: 'கருவி/காரணப் பொருள்: ‘அவருடைய வாழ்வினால்’'
  alternative: 'இடவியல்/இணைவு சார்ந்த பொருள்: ‘அவருடைய வாழ்வில்’'
  rationale: ‘அவருடைய மகனின் மரணத்தின் மூலம்’ என்பதற்கு இணையாக, ஒப்புரவாக்குதல் மரணத்தின் மூலம் வந்தது; எதிர்காலக் காப்பு அவருடைய வாழ்வினால் வருகிறது என்ற மரணம்–வாழ்வு அமைப்பை முதன்மை வாசிப்பு வெளிப்படுத்துகிறது. அதேவேளை ἐν என்பதன் உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒப்புரவாக்கப்பட்டோம்’ என்பது பவுலின் உறவுசார் சொல்லாட்சியையும் செயப்பாட்டு வடிவத்தையும் காக்கிறது; ‘காப்பாற்றப்படுவோம்’ என்பது தேவாலயச் சிறப்புச் சொல்லாட்சியை மட்டும் சாராமல் எதிர்கால σωθησόμεθα-வை இயல்பாகத் தருகிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
