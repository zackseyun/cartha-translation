source:
  edition: SBLGNT
  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: ta
  text: ஏனெனில், நாம் இன்னும் வலிமையற்றவர்களாக இருந்தபோதே, உரிய நேரத்தில் மெசியா இறைபக்தியற்றவர்களுக்காக[a] இறந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைபக்தியற்றவர்களின் சார்பாக.”
    reason: ὑπὲρ என்பதன் பிரதிநிதித்துவ நுணுக்கத்தை வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Χριστὸς
  choice: மெசியா
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால், மரபுவழி ஒலிபெயர்ப்பை விட அதன் பட்டப்பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்பட்டது.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: நாம் இன்னும் வலுவற்றவர்களாக இருந்தபோதே
  rationale: மூலத்தின் genitive absolute அமைப்பு இயல்பான தமிழில் காலத்தைக் குறிக்கும் உட்பிரிவாக வழங்கப்பட்டது. ‘வலுவற்றவர்கள்’ என்பது உடல் பலவீனம் என்று மட்டும் குறுக்காமல், மனித இயலாமையின் விரிவான பொருளைப் பேணுகிறது.
- source_word: ἔτι
  choice: இன்னும்
  rationale: தொடர்ந்து நிலவிய நிலையைக் குறிக்கும் வினையடை தமிழில் இயல்பாக ஒருமுறை வெளிப்படுத்தப்பட்டது; மூலச் சான்றிலுள்ள மீள்கூறலை சொற்சொல்லாகப் பின்பற்றுவது தமிழில் தேவையற்ற தடுமாற்றத்தை உண்டாக்கும்.
- source_word: κατὰ καιρὸν
  choice: உரிய நேரத்தில்
  rationale: பொருத்தமான அல்லது நியமிக்கப்பட்ட காலம் என்ற பொருளை, அளவுக்கு மீறிய விளக்கமின்றி இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ὑπὲρ
  choice: க்காக
  rationale: இச்சூழலில் பயன், பிரதிநிதித்துவம் அல்லது பதிலீடு ஆகிய நுணுக்கங்களை முன்கூட்டியே ஒன்றாகத் தீர்மானிக்காமல் திறந்த நிலையில் வைத்திருக்கும் இயல்பான தமிழ் உருபு.
- source_word: ἀσεβῶν
  choice: இறைப்பற்றற்றவர்கள்
  rationale: கடவுளிடம் பக்தியும் மரியாதையும் இல்லாதவர்களைச் சுட்டும் அற-சமயப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ἀπέθανεν
  choice: இறந்தார்
  rationale: கிரேக்க இறந்தகால வினையின் நேரடியான, இயல்பான தமிழ் வடிவம்; மூலத்தில் இல்லாத விளக்கம் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ὑπὲρ ἀσεβῶν என்பதில் மெசியாவின் மரணத்தின் தொடர்பு
  choice: இறைப்பற்றற்றவர்களுக்காக
  alternative: இறைப்பற்றற்றவர்களின் சார்பாக
  rationale: மெசியாவின் மரணம் இறைப்பற்றற்றவர்களின் நலனுக்காக நிகழ்ந்தது என்பதை முதன்மை வாசகம் தெளிவுபடுத்துகிறது. அதேவேளை, ‘க்காக’ என்பது பிரதிநிதித்துவம் அல்லது பதிலீட்டின் துல்லியமான கோட்பாட்டு வடிவத்தை மொழிபெயர்ப்பிலேயே இறுதியாக நிர்ணயிக்காமல் மூலத்தின் இறையியல் செறிவையும் திறந்த நுணுக்கத்தையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. வாக்கிய ஓட்டத்திற்காக ‘ஏனெனில்’ தொடக்கத்தில் வைக்கப்பட்டு, கால உட்பிரிவும் முதன்மை நிகழ்வும் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
