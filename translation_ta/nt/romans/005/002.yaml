source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: ta
  text: அவர் மூலமாக, விசுவாசத்தினால் நாமும் இந்தக் கிருபைக்குள் நுழையும் வாய்ப்பைப் பெற்றுள்ளோம்; அதில் நிலைத்திருக்கிறோம். மேலும், கடவுளுடைய மகிமை குறித்த நம்பிக்கையில் நாம் பெருமைபாராட்டுகிறோம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகிழ்கிறோம்” அல்லது “களிகூருகிறோம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: நுழையும் வாய்ப்பு
  rationale: கடவுளின் கிருபை என்னும் நிலைக்குள் வந்து சேரக் கிடைத்த அணுகலை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் அறிமுகம் என்ற பொருளைத் தவிர்க்கிறது.
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: வேற்றுமை உருபின் கருவிப் பொருளைப் பாதுகாத்து, πίστις என்பதற்கான நிலையான தமிழ் இறையியல் சொல்லையும் தக்கவைக்கிறது.
- source_word: χάριν
  choice: கிருபை
  rationale: பவுலின் இச்சூழலில் கடவுள் அருளும் தயவையும் அதனால் கிடைக்கும் நிலையையும் குறிக்கும் நிலைபெற்ற, புரிந்துகொள்ளக்கூடிய சொல்.
- source_word: ἑστήκαμεν
  choice: இப்போது நிலைத்திருக்கிற
  rationale: முன்பு நிகழ்ந்ததன் விளைவாகத் தொடரும் தற்போதைய நிலையை கிரேக்க நிறைவுக்கால வடிவத்துக்கு ஏற்ப வெளிப்படுத்துகிறது; ‘உறுதியாக’ போன்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: καυχώμεθα
  choice: பெருமிதம் கொள்கிறோம்
  rationale: வினைச்சொல்லின் நேர்மறையான, தன்னம்பிக்கைமிக்க பெருமைப்படுதலைத் தக்கவைத்து, தமிழில் வெறும் அகந்தையாக மட்டுமே ஒலிக்காமல் இயல்பாக அமைகிறது.
- source_word: ἐπ’ ἐλπίδι
  choice: நம்பிக்கையில்
  rationale: நம்பிக்கை பெருமிதத்தின் தளமாக அல்லது வட்டமாக இருப்பதைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: δόξης τοῦ θεοῦ
  choice: கடவுளுடைய மகிமையைப் பற்றிய
  rationale: இறைவனின் மகிமை என்ற பிறப்புவேற்றுமைத் தொடர்பைப் பாதுகாக்கிறது; அந்த மகிமையைப் பார்ப்பது, பெறுவது அல்லது அதில் பங்குபெறுவது என்று மூலத்தில் வெளிப்படையாக இல்லாத ஒன்றைத் தீர்மானித்துச் சேர்க்கவில்லை.
theological_decisions:
- issue: καυχώμεθα என்பதிலுள்ள பவுலின் இறையியல் பதற்றத்தைத் தக்கவைத்தல்
  choice: பெருமிதம் கொள்கிறோம்
  alternative: மகிழ்கிறோம் / களிகூருகிறோம்
  rationale: ‘மகிழ்கிறோம்’ என்பது தமிழில் மென்மையாக இருந்தாலும், பவுல் நோக்கத்துடன் பயன்படுத்தும் பெருமைப்படுதல் என்ற வலிமையை மங்கச் செய்யும். தேர்ந்த வடிவம் நேர்மறையான பெருமிதத்தைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘கடவுளுடைய மகிமையின் நம்பிக்கை’ என்பதன் பொருளை விரிவுபடுத்தாமல் இருத்தல்
  choice: கடவுளுடைய மகிமையைப் பற்றிய நம்பிக்கை
  alternative: கடவுளுடைய மகிமையைப் பெறுவோம் என்ற நம்பிக்கை
  rationale: கிரேக்கப் பிறப்புவேற்றுமை, மகிமையைப் பெறுதல், காணுதல் அல்லது அதில் பங்குபெறுதல் என்பதில் ஒன்றை வெளிப்படையாகத் தேர்ந்தெடுக்கவில்லை. ஆகவே மூலத்தின் உண்மையான திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘விசுவாசம்’, ‘கிருபை’, ‘மகிமை’ ஆகிய பரவலாக அறியப்பட்ட திருவிவிலியச் சொற்கள் தொடர்ச்சிக்காகத் தக்கவைக்கப்பட்டுள்ளன; வாக்கியத்தின் அடர்த்தியைக் குறைக்க கிரேக்க வாக்கியம் இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
