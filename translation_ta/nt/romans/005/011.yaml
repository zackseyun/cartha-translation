reference: Romans 5:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: ta
  text: அது மட்டுமல்லாமல், நம் ஆண்டவராகிய இயேசு மெசியாவின் வழியாகக் கடவுளில் பெருமிதமும் கொள்கிறோம். அவர் வழியாக இப்போது அந்த ஒப்புரவைப் பெற்றிருக்கிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καυχώμενοι
  choice: பெருமிதம் கொள்கிறோம்
  rationale: இந்தச் சூழலில் தன்னை உயர்த்திப் பேசுவதைக் காட்டாமல், கடவுளை அடிப்படையாகக் கொண்ட மகிழ்ச்சியும் நம்பிக்கையும் நிறைந்த பெருமிதத்தை வெளிப்படுத்துகிறது; அதேவேளையில் καυχάομαι என்பதன் ‘பெருமைபாராட்டுதல்’ சார்ந்த வலிமையையும் காக்கிறது.
- source_word: ἐν τῷ θεῷ
  choice: கடவுளில்
  rationale: ἐν என்பதன் சொற்படிமத்தையும், பெருமிதத்தின் அடிப்படை அல்லது பொருள் கடவுளே என்ற இரு நுணுக்கங்களையும் தமிழில் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவராகிய
  rationale: புதிய ஏற்பாட்டின் கிறிஸ்துவியல் பயன்பாட்டில் κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழாக்கம்.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: Χριστός இங்கு வெறும் பெயர்ப் பகுதியாக அல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டத்தைக் குறிக்கிறது; ‘மெசியா’ அந்தப் பட்டத்தின் பொருளைத் தெளிவாக வைத்திருக்கிறது.
- source_word: καταλλαγὴν
  choice: ஒப்புரவு
  rationale: பகை அல்லது பிரிவுக்குப் பின் உறவு சீராக்கப்படுவதை καταλλαγή குறிக்கிறது. ‘ஒப்புரவு’ இந்த உறவுசார் பொருளைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: ἐλάβομεν
  choice: பெற்றிருக்கிறோம்
  rationale: νῦν என்பதோடு சேர்ந்து, நிறைவேறிய செயலில் கிடைத்த பலன் இப்போது நமக்குரியதாக இருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதைப் பட்டமாக மொழிபெயர்த்தல்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός இயேசுவின் அபிஷேகம் செய்யப்பட்ட அரசருக்குரிய பட்டமாகச் செயல்படுகிறது. ‘மெசியா’ அதன் பொருளை வெளிப்படையாகக் காட்டுகிறது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: καυχώμενοι என்பதிலுள்ள நேர்மறையான பெருமைபாராட்டுதல்
  choice: கடவுளில் பெருமிதம் கொள்கிறோம்
  alternative: கடவுளில் மகிழ்கிறோம்
  rationale: பவுலின் சொல் மகிழ்ச்சியை மட்டுமல்ல, கடவுளை அடிப்படையாகக் கொண்ட வெளிப்படையான நம்பிக்கையையும் பெருமையையும் உள்ளடக்குகிறது. ‘பெருமிதம்’ அந்த இறுக்கத்தைத் தக்கவைக்கிறது; அது சுயபெருமை அல்ல என்பதை ‘கடவுளில்’ தெளிவாக்குகிறது.
- issue: τὴν καταλλαγὴν என்பதிலுள்ள குறிப்புத்தன்மை
  choice: அந்த ஒப்புரவு
  alternative: ஒப்புரவு
  rationale: கிரேக்க உரையின் உருபு, முந்தைய வசனங்களில் விவரிக்கப்பட்ட குறிப்பிட்ட ஒப்புரவையே சுட்டுகிறது. தமிழில் ‘அந்த’ இதை இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெருமிதம் கொள்கிறோம்’ என்பது சுயபெருமையைக் குறிக்காமல் கடவுளில் வைக்கப்படும் மகிழ்ச்சியான நம்பிக்கையைத் தருகிறது. ‘ஒப்புரவு’ உறவு சீராக்கப்படுதல் என்ற கருத்தைத் தக்கவைக்கிறது; அரிதாகத் தோன்றக்கூடிய இடத்தில் அடிக்குறிப்பு விளக்கம் அளிக்கிறது.
