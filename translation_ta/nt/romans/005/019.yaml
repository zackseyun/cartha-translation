source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: ta
  text: ஏனெனில், அந்த ஒரே மனிதனின் கீழ்ப்படியாமையின் மூலம் அந்தப் பலர் பாவிகளாக ஆக்கப்பட்டார்கள்போல[a], அந்த ஒருவரின் கீழ்ப்படிதலின் மூலம் அந்தப் பலர் நீதிமான்களாக ஆக்கப்படுவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவிகள் என்ற நிலையில் வைக்கப்பட்டார்கள்போல.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீதிமான்கள் என்ற நிலையில் வைக்கப்படுவார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: கீழ்ப்படியாமை
  rationale: கட்டளைக்குக் கீழ்ப்படியத் தவறுவதை நேரடியாகக் குறிக்கிறது; ὑπακοή என்பதுடனான எதிரிணையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: ஒரே மனிதனின்
  rationale: கட்டுருபுடன் வரும் ‘ஒருவர்’ சூழலில் ஆதாமைச் சுட்டுகிறது; ‘ஒரே மனிதன்’ என்ற மொழிபெயர்ப்பு பிரதிநிதித்துவ எதிரிணையைப் பாதுகாக்கிறது.
- source_word: ἁμαρτωλοὶ
  choice: பாவிகளாக
  rationale: இங்கு பெயர்ச்சொல் தன்மையில் பயன்படும் அடைமொழியை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κατεστάθησαν
  choice: ஆக்கப்பட்ட
  rationale: ஒரு நிலையில் வைக்கப்பட்டதையோ நிறுவப்பட்டதையோ குறிக்கும் καθίστημι என்பதன் வலிமையை இயல்பான தமிழில் தருகிறது; மேலும் குறுகிய கோட்பாட்டு விளக்கத்தைத் திணிப்பதில்லை.
- source_word: οἱ πολλοί
  choice: பலர்
  rationale: கிரேக்கத்தின் பன்மைக் குழுவைக் குறிக்கும் சொல்லை ‘அனைவரும்’ என்று விளக்கமாக விரிவுபடுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: ὑπακοῆς
  choice: கீழ்ப்படிதல்
  rationale: παρακοή என்பதற்கான நேரடியான எதிரிணை; ஆதாம்–கிறிஸ்து ஒப்புமையைத் தக்கவைக்கிறது.
- source_word: τοῦ ἑνὸς
  choice: அந்த ஒருவரின்
  rationale: இரண்டாம் பகுதியில் ἀνθρώπου மீண்டும் வராததால் ‘மனிதன்’ என்பதைச் சேர்க்காமல், முன் குறிப்பிடப்பட்டவரை ‘அந்த ஒருவர்’ என்று இயல்பாகச் சுட்டுகிறது.
- source_word: δίκαιοι
  choice: நீதிமான்களாக
  rationale: பவுலின் δικ- சொற்குடும்பத்துடன் தொடர்பைப் பேணும், இச்சூழலுக்குப் பொருத்தமான வழக்கமான தமிழ் இணைச்சொல்.
- source_word: κατασταθήσονται
  choice: ஆக்கப்படுவார்கள்
  rationale: முதல் பகுதியிலுள்ள இறந்தகாலச் செயலுடன் வடிவ ஒற்றுமையைப் பேணி எதிர்காலச் செயப்பாட்டு வினையைத் தெளிவாகக் காட்டுகிறது; ‘நீதிமான்கள் என்று அறிவிக்கப்படுவார்கள்’ என்ற அதிக விளக்கமான மொழியைத் தவிர்க்கிறது.
theological_decisions:
- issue: οἱ πολλοί என்பதன் வரம்பை ‘பலர்’ என்றே வைப்பதா அல்லது ‘அனைவரும்’ என்று விளக்குவதா
  choice: பலர்
  alternative: அனைவரும்
  rationale: மூலத்தில் οἱ πολλοί என்றே உள்ளது. அதன் வரம்பைப் பற்றிய இறையியல் கேள்வியை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் பவுலின் சொற்றொடரைப் பாதுகாக்கிறது.
- issue: κατασταθήσονται δίκαιοι என்பதை நிலைமொழியாக மொழிபெயர்ப்பதா அல்லது ‘நீதிமான்கள் என்று அறிவிக்கப்படுவார்கள்’ என்ற சட்டவியல் விளக்கத்தைப் பயன்படுத்துவதா
  choice: நீதிமான்களாக ஆக்கப்படுவார்கள்
  alternative: நீதிமான்கள் என்று அறிவிக்கப்படுவார்கள்
  rationale: கிரேக்கத்தில் δικαιόω அல்ல, καθίστημι என்பதே பயன்படுத்தப்பட்டுள்ளது. தேர்ந்தெடுத்த மொழிபெயர்ப்பு மூலத்தின் சொல்வடிவத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முதல் மற்றும் இரண்டாம் பகுதிகளின் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது; ‘மூலம்’ என்பது διά என்ற காரண/வழி உறவைத் தெளிவாக்குகிறது.
