  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: ta
  text: நிலைத்திருத்தல் மெய்ப்பிக்கப்பட்ட குணநிலையை[a] உண்டாக்குகிறது; மெய்ப்பிக்கப்பட்ட குணநிலை நம்பிக்கையை உண்டாக்குகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சோதிக்கப்பட்ட குணநிலை’ அல்லது ‘அங்கீகாரம்.’
    reason: δοκιμή என்பதன் குறிப்பிடத்தக்க சொற்பொருள் மாற்றுகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ὑπομονή
  choice: விடாமுயற்சி
  rationale: துன்பத்தின் கீழ் தளராமல் நிலைத்திருப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; சூழலில் வரும் படிப்படியான வளர்ச்சிக்கும் பொருந்துகிறது.
- source_word: δοκιμή
  choice: சோதனையில் மெய்ப்பிக்கப்பட்ட குணம்
  rationale: வெறும் பொதுவான நற்குணத்தை அல்லாமல், சோதிக்கப்பட்டு உண்மையானது எனத் தெரியவந்த குணநிலையை இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: ἐλπίς
  choice: நம்பிக்கை
  rationale: தமிழில் இயல்பான நிலையான இணைச்சொல்; இச்சூழலில் தேவனைச் சார்ந்த எதிர்நோக்கை கூடுதல் விளக்கமின்றியே தாங்குகிறது.
- source_word: δὲ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: கிரேக்கத்தில் இது தொடர் வளர்ச்சியின் அடுத்த படியை இணைக்கிறது. தமிழில் இணையான வாக்கிய அமைப்பும் அரைப்புள்ளியும் அந்தத் தொடர்பை இயல்பாகத் தெரிவிக்கின்றன.
- source_word: ellipsis of verb
  choice: உருவாக்குகிறது
  rationale: முந்தைய வசனத்திலுள்ள κατεργάζεται என்ற வினை இங்கு இரு முறை கருத்தளவில் தொடர்கிறது; சங்கிலித் தொடரைத் தெளிவாக்க தமிழில் வெளிப்படையாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: பரிசுத்தமாக்கல் தொடரில் δοκιμή என்பதன் பொருள்
  choice: சோதனையால் உண்மையானது என மெய்ப்பிக்கப்பட்ட குணநிலை
  alternative: சோதிக்கும் செயல்முறை; அங்கீகாரம்
  rationale: இத்தொடரில் இது விடாமுயற்சியின் விளைவாக வருகிறது; ஆகவே சோதனை நிகழ்வைக் காட்டிலும் அதன் வழியாக மெய்ப்பிக்கப்பட்ட குணநிலையைக் குறிப்பது பொருத்தமானது. அதேவேளை ‘அங்கீகாரம்’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கமான சங்கிலி அமைப்பு தமிழில் இணையான இரு கூறுகளாக வைக்கப்பட்டுள்ளது.
