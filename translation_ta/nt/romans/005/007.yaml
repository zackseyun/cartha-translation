id: ROM.5.7
reference: Romans 5:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: ta
  text: நீதிமானுக்காக ஒருவர் இறப்பது அரிது[a]; ஆனால் நல்லவருக்காக ஒருவர் இறக்கத் துணியக்கூட வாய்ப்புண்டு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதிமான்’ என்பதற்கும் ‘நல்லவர்’ என்பதற்கும் இடையிலான வேறுபாடு வெறும் நடையியல் வேறுபாடாக இல்லாமல் கருத்துள்ள வேறுபாடாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: அரிது
  rationale: ஒருவர் இவ்வாறு இறப்பது மிகவும் அபூர்வம் என்ற கருத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὑπὲρ
  choice: -க்காக
  rationale: இச்சூழலில் ஒருவரின் நன்மைக்காக அல்லது அவருக்குப் பதிலாக இறப்பதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: δικαίου
  choice: நீதிமான்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் உரிச்சொல்லின் நீதியுள்ள நபர் என்ற ஒழுக்க வகையைப் பேணுகிறது; தமிழில் பொதுவாக ஒரு நபரைக் குறிக்க முடியும்.
- source_word: ἀποθανεῖται
  choice: இறப்பது
  rationale: கிரேக்க எதிர்கால வடிவத்தின் பொதுவான கூற்றைத் தமிழில் இயல்பான பெயரெச்சத் தொழிற்பெயர் அமைப்பில் வழங்குகிறது.
- source_word: τοῦ ἀγαθοῦ
  choice: நல்லவர்
  rationale: δικαίου என்பதிலிருந்து வேறுபட்ட ἀγαθοῦ என்ற சொல்லைத் தனியே காட்டி, நல்ல அல்லது நன்மை செய்கிற நபர் என்ற சாத்தியமான நுணுக்கத்தைத் திறந்தவாறே வைக்கிறது.
- source_word: τάχα
  choice: வாய்ப்புண்டு
  rationale: உறுதியல்லாத சாத்தியத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: -க்கூட
  rationale: ஏறுநிலை வலியுறுத்தலைத் தமிழின் ‘கூட’ மூலம் வெளிப்படுத்துகிறது.
- source_word: τολμᾷ
  choice: துணிய
  rationale: ஆபத்தான அல்லது அசாதாரண செயலை மேற்கொள்ள மனந்துணிதல் என்ற கருத்தைப் பேணுகிறது.
- source_word: ἀποθανεῖν
  choice: இறக்க
  rationale: முதல் கூறிலுள்ள இறப்பு எண்ணத்தை மீண்டும் தெளிவாகப் பேணும் நேரடியான மொழிபெயர்ப்பு.
theological_decisions:
- issue: δικαίου மற்றும் ἀγαθοῦ ஆகியவற்றுக்கிடையிலான வேறுபாட்டைப் பேணுவதா
  choice: ‘நீதிமான்’ மற்றும் ‘நல்லவர்’ என்று வேறுபடுத்தி மொழிபெயர்த்தல்
  alternative: இரண்டையும் ஒரே பொருளுடைய சொற்களாக மொழிபெயர்த்தல்
  rationale: பவுலின் இரு தொடர்புடைய, ஆனால் ஒரே மாதிரியல்லாத ஒழுக்க வகைகளுக்கிடையிலான சாத்தியமான வேறுபாட்டை அழிக்காமல் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. கிரேக்கத்தின் இரு இணை கூறுகளும் அவற்றிலுள்ள சொற்பொருள் வேறுபாடும் பேணப்பட்டுள்ளன.
