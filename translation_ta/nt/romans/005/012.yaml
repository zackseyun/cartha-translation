source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: ta
  text: ஆகவே, ஒரு மனிதன் வழியாகப் பாவம் உலகத்திற்குள் நுழைந்தது; பாவத்தின் வழியாக மரணமும் நுழைந்தது. இவ்வாறு, எல்லாரும் பாவம் செய்ததால் மரணம் அனைவருக்கும் பரவியது—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: ஒரே மனிதன் வழியாக
  rationale: διά என்பதன் இடைமுறை அல்லது கருவிப் பொருளைப் பேணுகிறது; இங்கு ஆதாம் என்னும் குறிப்பிட்ட ஆண் பிரதிநிதியைச் சுட்டுவதால் ‘மனிதன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἡ ἁμαρτία
  choice: பாவம்
  rationale: பவுலின் பயன்பாட்டில் உள்ள பெயர்ச்சொல்லை விளக்கவுரை சேர்க்காமல் அதன் வழக்கமான பொருளில் தருகிறது.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: உலகத்திற்குள் நுழைந்தது
  rationale: εἰς என்பதன் உள்நோக்கிய இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: பாவத்தின் வழியாக மரணம் நுழைந்தது
  rationale: ஒரு மனிதன் வழியாகப் பாவம் நுழைந்தது; பாவத்தின் வழியாக மரணம் நுழைந்தது என்ற இணை அமைப்பைத் தெளிவாக்குகிறது. இரண்டாம் ‘நுழைந்தது’ கிரேக்கத்தில் உள்ள இணை அமைப்பிலிருந்து தமிழில் இயல்பாக நிரப்பப்பட்டுள்ளது.
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: முன் கூறிய நிகழ்வின் விளைவான தொடர்ச்சியைச் சுட்டுகிறது.
- source_word: εἰς πάντας ἀνθρώπους
  choice: எல்லா மனிதர்களுக்கும்
  rationale: இது ஆண்களை மட்டும் அல்ல, மனிதகுலம் முழுவதையும் உள்ளடக்குவதைக் காட்டுகிறது.
- source_word: ὁ θάνατος διῆλθεν
  choice: மரணம் … பரவியது
  rationale: மரணம் மனிதகுலம் முழுவதையும் எட்டிய இயக்கத்தையும் பரப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐφ’ ᾧ
  choice: செய்ததால்
  rationale: இச்சூழலில் இத்தொடரின் காரணப் பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது; வேறொரு பாரம்பரியப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: πάντες ἥμαρτον
  choice: எல்லாரும் பாவம் செய்தார்கள்
  rationale: கிரேக்க இறந்தகால வினையின் எளிய இறந்தகாலப் பொருளைப் பேணுகிறது; முதன்மை உரையில் ‘செய்ததால்’ என்ற காரணத் தொடராக இணைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἐφ’ ᾧ πάντες ἥμαρτον என்பதன் பொருள்
  choice: 'காரணப் பொருள்: ‘எல்லாரும் பாவம் செய்ததால்’'
  alternative: 'பிரதிநிதித்துவ அல்லது உள்ளடக்கப் பொருள்: ‘அவரில் எல்லாரும் பாவம் செய்ததால்’'
  rationale: இச்சூழலில் கிரேக்கத் தொடர் காரணப் பொருளை இயல்பாக ஏற்கிறது. ஆதாமுக்கும் மனிதகுலத்துக்கும் உள்ள உறவைப் பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டை உரைக்குள் கட்டாயமாகப் புகுத்தாமல், இறையியல் முக்கியத்துவமுள்ள பாரம்பரிய மாற்றுப் புரிதலை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. கிரேக்க வாக்கியம் அடுத்த வசனங்களில் தொடரும் ஒப்பீட்டை முழுமைப்படுத்தாமல் நிற்பதால், இறுதியில் உள்ள நீண்ட கோடு பாதுகாக்கப்பட்டுள்ளது.
