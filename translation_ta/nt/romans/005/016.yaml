id: ROM.5.16
reference: Romans 5:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: ta
  text: மேலும், பாவம் செய்த அந்த ஒருவன் வழியாக வந்த விளைவைப் போன்றதல்ல இந்தக் கொடை[a]. ஏனெனில், ஒரே மீறுதலிலிருந்து வந்த தீர்ப்பு தண்டனைத் தீர்ப்புக்கு வழிவகுத்தது[b]; ஆனால் பல மீறுதல்களிலிருந்து வந்த அருள்கொடை, நீதிமானாக்கும் தீர்ப்புக்கு வழிவகுத்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவம் செய்த ஒருவன் வழியாக வந்த விளைவைப் போன்றதல்ல இந்தக் கொடை.”
    reason: lexical_alternative
  - marker: b
    text: “ஒரே மீறுதலிலிருந்து” என்பதற்குப் பதிலாக, “ஒருவனிடமிருந்து” என்றும் பொருள் கொள்ளலாம்.
    reason: source_ambiguity
  - marker: c
    text: அல்லது, “நீதியான தீர்ப்பு” அல்லது “விடுதலைத் தீர்ப்பு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: கொடை
  rationale: கொடுக்கப்பட்ட பரிசு அல்லது கொடை என்பதே சொல்லின் அடிப்படைப் பொருள். ‘கொடை’ என்பது இயல்பான நவீனத் தமிழாகவும், மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் கருத்தைச் சேர்க்காததாகவும் உள்ளது.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: பாவம் செய்த அந்த ஒருவன் வழியாக வந்த விளைவு
  rationale: கிரேக்கத் தொடர் சுருக்கமானதும் விடுபட்ட ஒப்பீட்டைக் கொண்டதும் ஆகும். சூழலில் குறிக்கப்படும் ஆதாமை பெயரிட்டு விளக்காமல், ஒருவரைப் பற்றிய குறிப்பையும் அந்தச் சுருக்கத்தையும் இச்சொற்றொடர் காக்கிறது.
- source_word: κρίμα
  choice: தீர்ப்பு
  rationale: இங்கு இது நீதிமன்றத் தன்மையுள்ள முடிவைக் குறிக்கிறது. ‘தீர்ப்பு’ என்பது κατάκριμα மற்றும் δικαίωμα ஆகியவற்றோடு உள்ள நீதித்துறை சார்ந்த முரணைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐξ ἑνὸς
  choice: ஒரே ஒரு மீறுதலைத் தொடர்ந்து
  rationale: பின்னர் வரும் ‘பல மீறுதல்கள்’ என்பதற்கு எதிரிணையாக, ἑνός என்பது ஒரே ஒரு மீறுதலைக் குறிப்பதாகப் புரிந்துகொள்வது இயல்பானது. எனினும், அது ஒருவனைக் குறிக்கும் வாய்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κατάκριμα
  choice: தண்டனைத் தீர்ப்பு
  rationale: இச்சொல் குற்றவாளி எனத் தீர்த்து தண்டனை விதிக்கும் நீதித்துறை முடிவைக் குறிக்கிறது. பொதுவான குறைகூறலைக் குறிக்கக்கூடிய ‘கண்டனம்’ என்பதைக் காட்டிலும் ‘தண்டனைத் தீர்ப்பு’ இங்கு துல்லியமானது.
- source_word: χάρισμα
  choice: அருள்கொடை
  rationale: χάρισμα என்பது அருளால் வழங்கப்படும் கொடையை வலியுறுத்துகிறது. ‘அருள்கொடை’ இந்த நுணுக்கத்தைக் காத்து, முன்னர் வரும் δώρημα என்பதற்கான ‘கொடை’யிலிருந்து வேறுபடுத்துகிறது.
- source_word: παραπτωμάτων
  choice: மீறுதல்கள்
  rationale: παράπτωμα என்பது தவறான அடி, குற்றம் அல்லது மீறுதல் என்ற அறநெறி-சட்டப் பொருளைக் கொண்டது. ‘மீறுதல்கள்’ நவீனத் தமிழில் தெளிவாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: δικαίωμα
  choice: நீதிமானாக்கும் தீர்ப்பு
  rationale: κατάκριμα என்பதற்கு எதிராக இங்கு δικαίωμα நீதிமன்றத் தன்மையுள்ள சாதகமான முடிவைக் குறிக்கிறது. ‘நீதிமானாக்கும் தீர்ப்பு’ அந்த நீதித்துறை முரணையும் ஒருவரை நீதிமான் என்று அறிவிக்கும் விளைவையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: κατάκριμα என்பதற்கு எதிராக δικαίωμα கொண்டுள்ள நீதித்துறை சார்ந்த பொருள்
  choice: நீதிமானாக்கும் தீர்ப்பு
  alternative: நீதியான தீர்ப்பு; விடுதலைத் தீர்ப்பு
  rationale: வசனத்தின் அமைப்பு தீர்ப்பு/தண்டனைத் தீர்ப்பு என்பவற்றையும் அருள்கொடை/δικαίωμα என்பவற்றையும் எதிரெதிராக நிறுத்துகிறது. ‘நீதிமானாக்கும் தீர்ப்பு’ அந்த நீதித்துறை சார்ந்த எதிரிணையைத் தெளிவாகத் தெரிவிக்கிறது; அதேவேளை ‘நீதியான தீர்ப்பு’ அல்லது ‘விடுதலைத் தீர்ப்பு’ என்ற சாத்தியமான நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீதித்துறை உருவகத்தைத் தெளிவாக வைத்திருக்க ‘தீர்ப்பு’, ‘தண்டனைத் தீர்ப்பு’, ‘நீதிமானாக்கும் தீர்ப்பு’ என்ற இணையான சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. கிரேக்கத்தின் சுருக்கமான ஒப்பீடு தமிழில் புரிய ‘விளைவு’ சேர்க்கப்பட்டுள்ளது; மூலத்தின் உண்மையான தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
