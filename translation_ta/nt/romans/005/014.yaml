source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: ta
  text: ஆனாலும், ஆதாம் முதல் மோசே வரை மரணம் ஆட்சி செய்தது; ஆதாமின் கட்டளைமீறுதலைப் போன்ற வகையில் பாவம் செய்யாதவர்கள்மீதும் அது ஆட்சி செய்தது. ஆதாம் வரவிருப்பவருக்கு ஒரு மாதிரியாக[a] ஆவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்னடையாளம்.”
    reason: lexical_alternative
  - marker: b
    text: “வரவிருப்பவர்” என்பது இச்சூழலில் கிறிஸ்துவைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனாலும்
  rationale: முந்தைய கூற்றுடன் உள்ள வலுவான முரண்பாட்டை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: மரணம் ஆட்சி செய்தது
  rationale: மரணத்தை ஆளும் அதிகாரமாக உருவகப்படுத்தும் பவுலின் அரசாட்சி மொழியைப் பாதுகாக்கிறது.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: ஆதாம்முதல் மோசேவரை
  rationale: குறிப்பிடப்பட்ட கால எல்லையைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: பாவம் செய்யாதவர்கள்மீதும்
  rationale: மரணத்தின் ஆட்சி வியப்பூட்டும் விதத்தில் இவர்களையும் எட்டியது என்பதை ‘உம்’ வலியுறுத்துகிறது.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: ஆதாமின் மீறுதலைப் போன்ற விதத்தில்
  rationale: ஆதாமின் செயலும் மற்றவர்களின் பாவமும் எந்தப் பொருளில் ஒத்தவை என்பதை விளக்கத்தில் தீர்மானிக்காமல் ஒப்புமையைப் பாதுகாக்கிறது.
- source_word: παράβασις
  choice: மீறுதல்
  rationale: ஒரு கட்டளை அல்லது வரம்பை மீறும் கருத்தை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: τύπος
  choice: முன்மாதிரி
  rationale: ஆதாமுக்கும் வரவிருந்தவருக்கும் இடையிலான முன்னோடி ஒப்புமையை வெளிப்படுத்துகிறது; அதேவேளை அதன் முழு இறையியல் பொருளை விரித்துரைக்கவில்லை.
- source_word: τοῦ μέλλοντος
  choice: வரவிருந்தவர்
  rationale: ஆதாமுக்குப் பின்பு வரவிருந்த பிரதிநிதித்துவ நபரைச் சுட்டுகிறது; பெயரை நேரடியாக உரைக்காமல் மூலத்தின் மறைமுகக் குறிப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘வரவிருந்தவர்’ என்பவரின் அடையாளம்
  choice: மூலவசனத்தைப் போல நபரின் பெயரை உரையில் நேரடியாகச் சேர்க்காமல் ‘வரவிருந்தவர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கிறிஸ்து’ என்று உரையிலேயே வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: ரோமர் 5:12–21 சூழலில் இவர் கிறிஸ்துவைக் குறிக்கிறார்; இருப்பினும் மூலவசனம் பெயரைச் சொல்லாததால் அதை அடிக்குறிப்பில் மட்டும் தெளிவுபடுத்துவது உரையின் இறையியல் நுட்பத்தைப் பாதுகாக்கிறது.
- issue: ஆதாம் எந்த விதத்தில் τύπος ஆவார்
  choice: ‘முன்மாதிரி’ என்ற விரிவான சொல்லைப் பயன்படுத்துதல்
  alternative: ‘முன்னடையாளம்’ என்று மொழிபெயர்த்து தீர்க்கதரிசன முன்னறிவிப்பை அதிகமாக வலியுறுத்துதல்
  rationale: τύπος இங்கு ஆதாம்–கிறிஸ்து ஒப்புமையைச் சுட்டினாலும், அது வெறும் தீர்க்கதரிசன அடையாளம் மட்டுமே என்று குறுக்காமல் திறந்த நிலையில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மரணத்தின் உருவக ஆட்சி, ஆதாமின் மீறுதலுடனான ஒப்புமை, ஆதாம்–வரவிருந்தவர் தொடர்பு ஆகியவை விளக்கவுரையால் அளவுக்கு மீறித் தீர்மானிக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
