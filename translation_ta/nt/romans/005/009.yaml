  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: ta
  text: ஆகவே, இப்போது அவருடைய இரத்தத்தால்[b] நீதிமான்களாக்கப்பட்டுள்ள நாம்[a], இன்னும் அதிகமாக அவர் மூலமாகக் கோபத்திலிருந்து[c] இரட்சிக்கப்படுவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீதிமான்கள் என்று அறிவிக்கப்பட்டுள்ள நாம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவருடைய இரத்தத்தின் மூலமாக.’
    reason: lexical_alternative
  - marker: c
    text: அதாவது, சூழல் குறிப்பால் உணர்த்தப்படும் தெய்வீகக் கோபம்.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: ஆகவே ... இன்னும் அதிகமாக
  rationale: οὖν காட்டும் முந்தைய வசனத்துடனான தர்க்கத் தொடர்பை ‘ஆகவே’ என்பதும், πολλῷ ... μᾶλλον காட்டும் வலுப்படுத்தப்பட்ட ஒப்பீட்டை ‘இன்னும் அதிகமாக’ என்பதும் இயல்பான தமிழில் காக்கின்றன.
- source_word: δικαιωθέντες
  choice: நீதிமான்களாக்கப்பட்டுள்ள
  rationale: முதன்மை வினைக்கு முன்பே நிறைவேறி, தற்போது தொடரும் நிலையை இறந்தகாலச் செயப்பாட்டு வினையெச்சம் குறிக்கிறது. பவுலின் δικαιόω சொற்பயன்பாட்டுடன் ஒருமைப்பாட்டைத் தக்கவைக்க இந்தத் தேர்வு செய்யப்பட்டது; அறிவிப்பை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: νῦν
  choice: இப்போது
  rationale: நீதிமான்களாக்கப்பட்டதன் தற்போதைய நிலையை நேரடியாகக் குறிக்கும் காலவினையடை.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: அவருடைய இரத்தத்தால்
  rationale: ἐν இங்கு வழிமுறை அல்லது அடிப்படையைச் சுட்டுகிறது. ‘இரத்தத்தால்’ என்பது இயல்பான தமிழில் அந்தப் பொருளைக் காக்கிறது; சொல் நெருக்கமுள்ள மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: σωθησόμεθα
  choice: இரட்சிக்கப்படுவோம்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, இன்னும் எதிர்காலத்தில் நிறைவேறவிருக்கும் இரட்சிப்பைக் குறிக்கிறது.
- source_word: δι’ αὐτοῦ
  choice: அவர் மூலமாக
  rationale: διά உடன் வரும் உருபு இங்கு வழிமுறை அல்லது செயற்பாட்டாளரைச் சுட்டுகிறது; ‘அவர் மூலமாக’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: கோபத்திலிருந்து
  rationale: மூலத்தில் ‘தேவனுடைய’ என்பது வெளிப்படையாக இல்லாததால் அதை முதன்மை உரையில் சேர்க்காமல், சூழலால் குறிப்பாக அறியப்படும் கோபத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: δικαιωθέντες என்பதிலுள்ள நீதிமானாக்குதல் மொழியின் தன்மை
  choice: முதன்மை உரையில் ‘நீதிமான்களாக்கப்பட்டுள்ள’ என்று வைத்தல்
  alternative: ‘நீதிமான்கள் என்று அறிவிக்கப்பட்டுள்ள’
  rationale: δικαιόω என்ற முக்கியச் சொல்லின் பவுலின் பயன்பாட்டுடனான தொடர்ச்சியை இது காக்கிறது; அது எவ்வாறு செயல்படுகிறது என்பதைக் குறித்த ஒரு குறிப்பிட்ட சமயப்பிரிவின் விளக்கத்தை முதன்மை உரைக்குள் புகுத்தவில்லை.
- issue: ἡ ὀργή என்பதன் குறிப்பு
  choice: ‘கோபம்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘தேவனுடைய கோபம்’
  rationale: சூழல் இது தெய்வீகக் கோபம் என்பதை வலுவாகச் சுட்டினாலும், கிரேக்க உரையில் ‘தேவனுடைய’ என்பது வெளிப்படையாக இல்லை. ஆகவே மூலத்தின் மறைமுகத்தன்மை முதன்மை உரையில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. பவுலின் தர்க்க முன்னேற்றத்தைத் தெளிவாக வைத்தபடியே, ‘நீதிமான்களாக்குதல்’ மற்றும் ‘கோபம்’ குறித்த மூலத்தின் இறையியல் செறிவும் மறைமுகத்தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
