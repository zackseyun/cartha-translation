  to: பாவம் மரணத்தில் அரசாண்டதுபோலவே, அருளும் நீதியின் வழியாக நித்திய வாழ்வுக்கு இயேசு மெசியாவாகிய நம் ஆண்டவரின் வழியாக அரசாளும்படி.
  rationale: மூலத்தின் இணையான அரசாட்சி உருவகத்தைப் பாதுகாத்து, பாவம் மரணத்தில் அரசாண்டதற்கும் அருள் நீதியின் வழியாக நித்திய வாழ்வுக்கு அரசாள வேண்டியதற்கும் உள்ள எதிரிணையைத் தெளிவாக்கினோம். இயேசு மெசியா முழு நிகழ்வின் வழிமுறையாக இருப்பதும் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு அடையாளங்கள் திருத்தப்பட்ட உரையில் முறையே «மரணத்தில்[a]», «நீதியின்[b]», «மெசியாவாகிய[c]» என இணைக்கப்பட வேண்டும்.
