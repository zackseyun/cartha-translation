source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: ta
  text: பாவம் மரணத்தில் அரசாண்டதுபோலவே, அருளும் நீதியின் வழியாக நித்திய வாழ்வுக்கு இயேசு மெசியாவாகிய நம் ஆண்டவரின் வழியாக அரசாளும்படி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: அதனால் … வழிநடத்தும்படி ஆனது
  rationale: ἵνα அறிமுகப்படுத்தும் நோக்கம் அல்லது விளைவு சார்ந்த உட்பொருளைத் தமிழில் இயல்பான நிறைவுற்ற வாக்கியமாக வெளிப்படுத்துகிறது; முந்தைய வசனத்துடனான தொடர்பையும் ‘அதனால்’ காட்டுகிறது.
- source_word: ἐβασίλευσεν / βασιλεύσῃ
  choice: அரசாண்டது / அரசாண்டு
  rationale: பாவத்தையும் அருளையும் அரசர்களாக உருவகிக்கும் பவுலின் மொழிநடையைத் தக்கவைக்கிறது.
- source_word: ἐν τῷ θανάτῳ
  choice: மரணத்தில்
  rationale: ἐν என்பதன் முதன்மையான இடம் அல்லது ஆட்சிக்கோளம் சார்ந்த பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἡ χάρις
  choice: அருள்
  rationale: χάρις என்பதற்கான இயல்பான, கண்ணியமான தமிழ்; பாவத்துக்கு எதிராக ஆளுமைப்படுத்தப்பட்டுள்ள கருத்தையும் தக்கவைக்கிறது.
- source_word: διὰ δικαιοσύνης
  choice: நீதியின் வழியாக
  rationale: διά உடன் வரும் மரபுவேற்றுமை உருபு காட்டும் வழிமுறைப் பொருளையும், δικαιοσύνη என்பதிலுள்ள நேர்மை மற்றும் நியாயம் சார்ந்த பரப்பையும் ‘நீதி’ தக்கவைக்கிறது.
- source_word: εἰς ζωὴν αἰώνιον
  choice: நிலைவாழ்வுக்கு
  rationale: εἰς காட்டும் இலக்கு அல்லது விளைவு நோக்கையும் ζωὴ αἰώνιος என்பதன் நீடித்த வாழ்வு கருத்தையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் பட்டப்பெயரான ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பொருளை வெளிப்படையாகக் காட்டுகிறது; பெயர்போலப் பயன்படும் ‘கிறிஸ்து’ என்ற வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῦ κυρίου ἡμῶν
  choice: நம் ஆண்டவராகிய
  rationale: இயேசு மெசியாவை விளக்கும் உடைமைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: δικαιοσύνη என்பதன் நீதி/நீதிநிலைப் பொருள்
  choice: நீதியின் வழியாக
  alternative: நீதிநிலையின் வழியாக
  rationale: ‘நீதி’ என்பது தமிழில் நேர்மையான நிலை மற்றும் நியாயம் ஆகிய இரு பரிமாணங்களையும் சுமக்கக்கூடியதால், மூலத்தின் கருத்துப் பரப்பைத் தேவையின்றிச் சுருக்கவில்லை.
- issue: Χριστός என்பது பட்டப்பெயரா, பெயர்போன்ற வடிவமா
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இங்கு Χριστός-இன் மெசியாப் பட்டப்பொருளை முதன்மை உரை வெளிப்படையாக்குகிறது; இருப்பினும் கிரேக்கத்தில் அது பெயருடன் நெருக்கமாக இணைந்திருப்பதால் மரபான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἵνα உட்பிரிவின் நோக்கம் அல்லது விளைவு
  choice: வழிநடத்தும்படி ஆனது
  alternative: வழிநடத்துவதற்காக
  rationale: நோக்கத்தையும் விளைவையும் முற்றிலும் ஒன்றாகத் தீர்மானிக்காமல், இரண்டுக்கும் இடமளிக்கும் தமிழ்க் கட்டமைப்பு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பின்பற்றுகிறது. ‘பாவம் அரசாண்டது’ மற்றும் ‘அருள் அரசாண்டது’ என்ற இணையான அரசாட்சி உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது. வசனம் 20-ஆம் வசனத்திலிருந்து தொடரும் ἵνα உட்பிரிவாக இருப்பதால், ‘அதனால்’ மூலம் தொடர்பு காட்டப்பட்டு தமிழில் வாசிக்கத்தக்க நிறைவு வழங்கப்பட்டுள்ளது.
