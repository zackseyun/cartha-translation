    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: சட்டம்
  rationale: இச்சூழலில் இது மோசேயின் சட்டத்தைக் குறிக்கிறது. பழமையான அல்லது குறிப்பிட்ட மரபுசார் சொல்லாட்சியைத் தவிர்த்து, நவீன வாசகருக்குத் தெளிவான ‘சட்டம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: παρεισῆλθεν
  choice: இடையில் நுழைந்தது
  rationale: வெறுமனே ‘வந்தது’ என்பதைக் காட்டிலும், ஏற்கெனவே நடந்துகொண்டிருந்த ஒன்றின் பக்கத்தில் அல்லது கூடுதலாக நுழைதல் என்ற παρά- முன்னொட்டின் நுட்பத்தை இது காக்கிறது.
- source_word: ἵνα πλεονάσῃ
  choice: பெருகும்படியாக
  rationale: ἵνα மற்றும் இறந்தகாலத் துணைவினை அமைப்பின் நோக்கப் பொருளை இயல்பான தமிழில் காக்கிறது; இதனால் எழும் இறையியல் பதற்றம் விளக்கி நீக்கப்படவில்லை.
- source_word: τὸ παράπτωμα
  choice: மீறல்
  rationale: ஒரு வரம்பையோ கட்டளையையோ மீறும் செயலைக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் சொல்; ஆதாமின் மீறலை மையப்படுத்தும் உடனடிச் சூழலுக்கும் ஏற்றது.
- source_word: οὗ
  choice: எங்கே ... அங்கே
  rationale: கிரேக்க உறவுநிலை இடவினையுரையின் பொருளைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἁμαρτία
  choice: பாவம்
  rationale: பவுலின் பயன்பாட்டிற்குரிய நிலையான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் மொழிபெயர்ப்பு.
- source_word: ὑπερεπερίσσευσεν
  choice: அதைவிட அளவில்லாமல் பொங்கிப் பெருகியது
  rationale: சாதாரணமாகப் பெருகுவதைவிட மிக அதிகமாக நிரம்பி வழியும் வலியுறுத்தலைக் கூட்டுவினை கொண்ட கிரேக்கச் சொல் தருகிறது; தமிழ் சொற்றொடர் அந்த மிகைப்பையும் பாவத்தோடு உள்ள ஒப்பீட்டையும் வெளிப்படுத்துகிறது.
- source_word: ἡ χάρις
  choice: அருள்
  rationale: χάρις என்பதற்கான இயல்பான, கண்ணியமான தமிழ் இறையியல் சொல்.
theological_decisions:
- issue: சட்டம் வந்ததன் நோக்கமாக மீறல் பெருகுதல் கூறப்படுவதை எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘மீறல் பெருகும்படியாக’ என்ற நோக்கவாக்கியமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அதன் விளைவாக மீறல் பெருகியது’
  rationale: ἵνα உடன் வரும் துணைவினை நோக்கத்தை நேரடியாகக் காட்டுகிறது. பாவத்தை இறைவன் அங்கீகரித்தார் என்று கூறாமலும், பவுலின் வாக்கியத்தில் உள்ள இறையியல் பதற்றத்தை விளைவு வாக்கியமாக மாற்றித் தீர்க்காமலும் மூல அமைப்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ போன்ற பழமையான சொல்லுக்குப் பதிலாக ‘சட்டம்’ தேர்ந்தெடுக்கப்பட்டது. ‘சட்டமோ ... ஆனால்’ என்ற அமைப்பு கிரேக்க δὲ தரும் மாறுபாட்டையும் தொடர்ச்சியையும் இயல்பாகக் காட்டுகிறது.
