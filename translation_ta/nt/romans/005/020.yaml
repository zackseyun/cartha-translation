  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: ta
  text: மீறல்[b] பெருகும்படியாகச் சட்டமோ கூடுதலாக வந்தது[a]; ஆனால் பாவம் எங்கே பெருகியதோ, அங்கே அருள் அதைவிட அளவுகடந்து பெருகியது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
