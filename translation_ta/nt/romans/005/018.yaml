theological_decisions:
- issue: இரண்டாவது ‘எல்லா மனிதர்களுக்கும்’ என்பதன் பரப்பை இறையியல் காரணங்களால் குறுக்க வேண்டுமா?
  choice: இரு பகுதிகளிலும் ‘எல்லா மனிதர்களுக்கும்’ என்பதை மாற்றமின்றி வைத்தல்
  alternative: ‘விசுவாசிக்கிற அனைவருக்கும்’ அல்லது ‘நீதிமானாக்கப்பட்ட அனைவருக்கும்’ என்று குறுக்குதல்
  rationale: கிரேக்கத்தில் ஒப்பீட்டின் இரு பகுதிகளிலும் πάντας ἀνθρώπους என்ற அதே சொற்றொடர் மீண்டும் வருகிறது. மொழிபெயர்ப்பிலேயே அதன் பரப்பைக் குறைப்பது, உரை விட்டுவைக்கும் இறையியல் இழுபறியை முன்கூட்டியே தீர்த்துவிடும்.
- issue: δικαίωμα என்பது கிறிஸ்துவின் செயல் என்று வசனத்திலேயே வெளிப்படையாகச் சொல்ல வேண்டுமா?
  choice: ‘ஒரே ஒரு நீதியான செயல்’ என்று மூலத்தின் மறைநிலையைப் பாதுகாத்தல்
  alternative: ‘கிறிஸ்துவின் ஒரே நீதியான செயல்’ என்று விளக்கிச் சேர்த்தல்
  rationale: சுற்றியுள்ள பகுதி அந்தச் செயலை விளக்கினாலும், இவ்வசனத்தின் கிரேக்க உரையில் கிறிஸ்துவின் பெயர் நேரடியாக இல்லை. ஆகவே விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ஆதாம்–கிறிஸ்து ஒப்பீட்டின் சமச்சீர் அமைப்பைக் காக்க ‘ஒரே ஒரு… மூலம்… எல்லா மனிதர்களுக்கும்…’ என்ற வடிவம் இரு பகுதிகளிலும் தொடர்கிறது. ‘நீதிமானாக்குதல்’ என்பது சற்றுத் தொழில்நுட்பமான சொல்லாக இருந்தாலும், δικαίωσις என்பதன் நீதித்துறை சார்ந்த பொருளையும் பவுலின் சொல் தொடர்பையும் காக்கிறது.
