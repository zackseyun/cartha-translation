    reason: δικαίωσιν ζωῆς என்ற கிரேக்கத் தொடரிலுள்ள உருபுத்தொடர் உறவைப் பல விதமாகப் புரிந்துகொள்ள முடியும்; முதன்மை உரை அதன் வாழ்வளிக்கும் விளைவைத் தெளிவாக்குகிறது.
