  language: ta
  text: ஆகவே, ஒரே ஒரு மீறுதலின் மூலம் எல்லா மனிதர்களுக்கும் தண்டனைத் தீர்ப்பு வந்ததுபோல, ஒரே ஒரு நீதியான செயலின் மூலம் எல்லா மனிதர்களுக்கும் வாழ்வைத் தரும் நீதிமானாக்குதல்[a] வந்தது.
