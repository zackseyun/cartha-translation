id: ROM.5.3
reference: Romans 5:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: ta
  text: அது மட்டுமல்லாமல், துன்பங்களிலும்[b] நாம் மகிழ்கிறோம்[a]; துன்பம் சகிப்புத்தன்மையை[c] உருவாக்குகிறது என்பதை அறிந்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெருமிதம் கொள்கிறோம்” அல்லது “களிகூர்கிறோம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நெருக்கடிகளிலும்” அல்லது “வேதனைகளிலும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “விடாமுயற்சியை” அல்லது “நிலைத்திருக்கும் தன்மையை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: மகிழ்கிறோம்
  rationale: இச்சூழலில் தன்னை உயர்த்திப் பேசும் பெருமை அல்ல, கடவுளின் செயல்மீது கொண்ட நம்பிக்கையால் எழும் மகிழ்ச்சியே முன்னிலையில் உள்ளது. ‘மகிழ்கிறோம்’ என்பது நவீனத் தமிழில் இயல்பாக இதைத் தெரிவிக்கிறது; ‘பெருமிதம் கொள்கிறோம்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: θλίψεσιν
  choice: துன்பங்களிலும்
  rationale: அழுத்தம், நெருக்கடி, வேதனை ஆகியவற்றை உள்ளடக்கும் சொல்லாக ‘துன்பங்கள்’ பொதுவாசகருக்கு இயல்பாக உள்ளது. கிரேக்கத்தின் பன்மையும் ‘-இலும்’ என்ற இடவியல் நயமும் பாதுகாக்கப்படுகின்றன.
- source_word: θλῖψις
  choice: துன்பம்
  rationale: முந்தைய பன்மையிலிருந்து பொதுவான கோட்பாட்டைக் கூறும் ஒருமைக்கு கிரேக்கம் மாறுவதைக் காட்ட ஒருமை பயன்படுத்தப்படுகிறது.
- source_word: ὑπομονήν
  choice: சகிப்புத்தன்மையை
  rationale: அழுத்தத்தின் கீழ் நிலைத்து நிற்கும் பொறுமையான ஆற்றலை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது. ‘விடாமுயற்சி’ அல்லது ‘நிலைத்திருத்தல்’ என்பவையும் சாத்தியம்.
- source_word: κατεργάζεται
  choice: உருவாக்குகிறது
  rationale: துன்பம் சகிப்புத்தன்மையை விளைவாக ஏற்படுத்துகிறது என்ற காரண–விளைவு நயத்தை இயல்பாகத் தருகிறது.
- source_word: εἰδότες
  choice: அறிந்திருக்கிறோம்
  rationale: முதன்மை வினையுடன் தொடர்புடைய அறிவைத் தெரிவிக்கிறது; வெளிப்படையான ‘ஏனெனில்’ என்பதைக் கூட்டாமல் கிரேக்கப் பங்கேற்பு வினையின் தொடர்பைத் திறந்தவாறே வைக்கிறது.
theological_decisions:
- issue: καυχώμεθα என்பதன் ஆன்மீகச் சூழலிலான பொருள்
  choice: கடவுளின் செயலில் நம்பிக்கை கொண்ட மகிழ்ச்சி
  alternative: பெருமிதம் கொள்கிறோம் / களிகூர்கிறோம்
  rationale: பவுலின் கருத்து சுயபெருமையைப் பற்றியது அல்ல; துன்பத்தின் வழியாக கடவுள் உண்டாக்கும் விளைவின்மீது கொண்ட உறுதியான மகிழ்ச்சியைப் பற்றியது. இருப்பினும் மூலச்சொல்லின் ‘பெருமிதம்/களிகூருதல்’ நயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் வரும் ‘துன்பங்கள்’ என்ற பன்மையிலிருந்து ‘துன்பம்’ என்ற பொதுமைப்படுத்தும் ஒருமைக்கு நிகழும் மாற்றம் பாதுகாக்கப்பட்டுள்ளது. εἰδότες என்பதற்கு காரணத்தைக் கட்டாயமாக விளக்கும் இணைப்புச்சொல் சேர்க்காமல் ‘அறிந்திருக்கிறோம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
