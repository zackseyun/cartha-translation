id: ROM.5.17
reference: Romans 5:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: ta
  text: ஏனெனில், ஒருவனுடைய மீறுதலினால் அந்த ஒருவன் வழியாக மரணம் ஆட்சி செய்ததென்றால், கிருபையின் பெருக்கையும் நீதியின் வரத்தையும்[a] பெற்றுக்கொள்கிறவர்கள் அந்த ஒருவரான இயேசு மெசியாவின் வழியாக[b] வாழ்வில் எவ்வளவோ அதிகமாக ஆட்சி செய்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயத்தின் வரத்தையும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இயேசு கிறிஸ்துவின் வழியாக.” “மெசியா” என்பதற்கு “அபிஷேகம் செய்யப்பட்டவர்” என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: மீறுதல்
  rationale: தவறான அடி அல்லது வரம்புமீறிய செயல் என்ற கருத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ஆதாம்–கிறிஸ்து ஒப்பீட்டில் சட்டமீறலின் வலிமையையும் தக்கவைக்கிறது.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: ஆட்சி செய்தது / ஆட்சி செய்வார்கள்
  rationale: மரணம் ஆட்சி செய்வதும், வரத்தைப் பெறுகிறவர்கள் ஆட்சி செய்வதும் ஆகிய அரசாட்சிசார் உருவகத்தையும் இரு வினைகளுக்கிடையிலான இணைப்பையும் காக்கிறது.
- source_word: περισσείαν
  choice: பெருக்கு
  rationale: அளவுக்கு மேலான நிறைவையும் மிகுதியையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: χάριτος
  choice: கிருபை
  rationale: பவுலின் பயன்பாட்டில் கடவுளுடைய அருளும் கொடையும் சேர்ந்த கருத்தைத் தாங்கும், தமிழ்க் கிறிஸ்தவ வழக்கில் நன்கு அறியப்பட்ட சொல்.
- source_word: δωρεᾶς
  choice: வரம்
  rationale: இலவசமாக வழங்கப்படும் கொடை என்ற பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது; அருகிலுள்ள ‘கிருபை’ அதன் இலவசத் தன்மையை வலுப்படுத்துகிறது.
- source_word: δικαιοσύνης
  choice: நீதி
  rationale: ஒருவரைச் சரியான நிலையில் நிறுத்துதல், நீதிநிலை, நியாயம் ஆகிய பவுலின் பரந்த கருத்துவட்டத்தைத் தமிழில் சுமக்கக்கூடிய சொல்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λαμβάνοντες
  choice: பெற்றுக்கொள்கிறவர்கள்
  rationale: தொடர்ந்து பெறுகிறவர்களாக அடையாளப்படுத்தப்படும் மக்களை நிகழ்காலப் பங்கேற்புவினையின் இயல்புடன் வெளிப்படுத்துகிறது.
- source_word: ἐν ζωῇ
  choice: வாழ்வில்
  rationale: கிரேக்கத்தின் சுருக்கத்தையும் முன் வரும் மரணத்துடனான முரண்பாட்டையும் காக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் அபிஷேகம் செய்யப்பட்ட அரசர் என்ற பட்டப்பொருளைத் தெளிவாக வைத்திருக்கிறது; தமிழில் பரவலான பெயர்வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: δικαιοσύνης என்பதன் பவுலியப் பொருள்
  choice: நீதியின் வரம்
  alternative: நீதிநிலையின் வரம்; நியாயத்தின் வரம்
  rationale: உடனடியான ஆதாம்–இயேசு ஒப்பீட்டிலும் நீதிமானாக்குதல் சார்ந்த சூழலிலும் ‘நீதி’ பொருந்துகிறது; அதேவேளை சொல்லை வெறும் ஒழுக்கநற்குணமாகவோ சட்டநியாயமாகவோ மட்டும் சுருக்காமல் மாற்றுப் பொருளை அடிக்குறிப்பில் காக்கிறது.
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστός-ன் பட்டப்பொருள்
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இங்கு ὁ Χριστός என்ற தனி வரையறைச் சுட்டு இல்லாவிட்டாலும், Χριστός-ன் மெசியா/அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளை முதன்மை உரை வெளிப்படுத்துகிறது; வழக்கமான பெயர்வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πολλῷ μᾶλλον உடன் எதிர்கால ஆட்சி
  choice: இன்னும் மிகுதியாக ஆட்சி செய்வார்கள்
  alternative: ஆட்சி செய்வது எவ்வளவு அதிக உறுதி
  rationale: கிரேக்கத்தின் அளவுசார் வலியுறுத்தலையும் எதிர்கால வினையையும் நேரடியாகக் காக்கிறது; முடிவின் உறுதியை விளக்கமாகச் சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஒருவன்’/‘ஒரே ஒருவர்’ என்ற மீளுரைகள் ஆதாம்–இயேசு ஒப்பீட்டையும் διὰ τοῦ ἑνός என்ற வலியுறுத்தலையும் காக்கின்றன. கிரேக்கத்தில் தொடக்கத்தில் உள்ள γάρ-ஐ தனித்த ‘ஏனெனில்’ என இயந்திரமாகச் சேர்க்காமல், தமிழில் காரணநிபந்தனை அமைப்பான ‘…என்றால்’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
