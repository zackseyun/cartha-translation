  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: ta
  text: மேலும், நம்பிக்கை நம்மை வெட்கத்திற்கு உள்ளாக்குவதில்லை[a]. ஏனெனில், நமக்குக் கொடுக்கப்பட்ட தூய ஆவியின் வழியாகக் கடவுளின் அன்பு[b] நம் உள்ளங்களில் ஊற்றப்பட்டுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏமாற்றுவதில்லை.”
    reason: καταισχύνει என்பதற்கான சூழல்சார்ந்த மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: அல்லது, சாத்தியம் குறைவாக, “கடவுள்மீது நமக்குள்ள அன்பு.”
    reason: τοῦ θεοῦ என்ற கிரேக்கப் பிறப்புவேற்றுமையில் உள்ள உண்மையான இலக்கண இருபொருள்தன்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: δέ
  choice: மேலும்
  rationale: இது கிரேக்கத்தில் உள்ள மென்மையான இணைப்பைத் தெரிவிக்கிறது; தேவையற்ற எதிர்மறை வேறுபாட்டை உருவாக்குவதில்லை.
- source_word: ἐλπίς
  choice: நம்பிக்கை
  rationale: பொதுப்பொருளில் வரும் இச்சொல்லுக்கான இயல்பான, நேரடியான தமிழ் இணை.
- source_word: οὐ καταισχύνει
  choice: நம்மை வெட்கத்திற்கு உள்ளாக்குவதில்லை
  rationale: καταισχύνω என்பதிலுள்ள வெட்கம்–மானம் சார்ந்த அடிப்படைப் பொருளைப் பேணுகிறது; தமிழில் தேவையான மறைபொருள் செயப்படுபொருளாக ‘நம்மை’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: கடவுளின் அன்பு
  rationale: கிரேக்கச் சொற்றொடரின் மரபுவழிப் பொருளை இயல்பான தமிழில் தருகிறது; சூழலில் இது கடவுள் நம்மீது காட்டும் அன்பைக் குறிக்க அதிக வாய்ப்புள்ளது, ஆனால் இலக்கண ரீதியான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐκκέχυται
  choice: ஊற்றப்பட்டுள்ளது
  rationale: நிறைவேற்றப்பட்ட செயலும் அதன் தொடரும் விளைவும் சேர்ந்துள்ள கிரேக்க நிறைவுக் காலத்தின் வலிமையைப் பேணுகிறது.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: நம் உள்ளங்களில்
  rationale: ‘இதயங்கள்’ என்ற உடலியல் ஒலியைத் தவிர்த்து, எண்ணம், உணர்வு, உள்ளார்ந்த வாழ்வு ஆகியவற்றைக் குறிக்கும் இயல்பான நவீனத் தமிழைத் தருகிறது.
- source_word: διὰ πνεύματος ἁγίου
  choice: தூய ஆவியின் வழியாக
  rationale: διά உடன் வரும் பிறப்புவேற்றுமையின் கருவி அல்லது இடைமுகப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: நமக்குக் கொடுக்கப்பட்ட
  rationale: இறந்தகாலப் பெயரெச்சம் ‘தூய ஆவி’யை விளக்குவதைத் தமிழின் இயல்பான முன்நிலைப் பெயரெச்ச அமைப்பில் தருகிறது.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ என்பதிலுள்ள τοῦ θεοῦ என்ற பிறப்புவேற்றுமையின் பொருள்
  choice: கடவுள் நம்மீது காட்டும் அன்பு என்பதை முதன்மைப் பொருளாகக் கொண்ட ‘கடவுளின் அன்பு’
  alternative: கடவுள்மீது நமக்குள்ள அன்பு
  rationale: தூய ஆவியின் வழியாக இந்த அன்பு நம் உள்ளங்களில் ஊற்றப்பட்டுள்ளது என்ற உடனடிச் சூழல், அன்பின் மூலமாகக் கடவுளைக் காட்டும் வாசிப்பை வலுவாக ஆதரிக்கிறது. இருப்பினும் கிரேக்கப் பிறப்புவேற்றுமையில் உண்மையான இலக்கண இருபொருள்தன்மை இருப்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த ஆவி’ என்பதற்குப் பதிலாக மூலத்தின் ἅγιος என்ற பொருளை நேரடியாகவும் பொதுவாகவும் தெரிவிக்கும் ‘தூய ஆவி’ தேர்ந்தெடுக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
