source:
  edition: SBLGNT
  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: ta
  text: ஆகவே, நம்பிக்கையினால்[b] நாம் நீதிமான்களாக்கப்பட்டிருப்பதால், நம் ஆண்டவராகிய இயேசு மெசியா[c] வழியாகக் கடவுளோடு சமாதானம் கொண்டிருக்கிறோம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “கடவுளோடு சமாதானம் கொண்டிருப்போமாக” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “நம்பிக்கையின் அடிப்படையில்.”
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் கிறிஸ்தோஸ்; இதன் பொருள் “மெசியா”; மரபாக “கிறிஸ்து” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: நாம் நீதிமான்களாக்கப்பட்டிருப்பதால்
  rationale: δικαιόω என்பதன் இறந்தகாலச் செயப்பாட்டு வினையெச்சம். இறைவனுடைய நீதிப்படுத்தும் செயலைச் சுருக்கமாகக் கூறுகிறது; அதை ‘குற்றமற்றவர்கள் என்று தீர்ப்பளிக்கப்பட்டோம்’ என்ற சட்டவியல் விளக்கமாகவோ, ‘உள்ளார்ந்த முறையில் நீதியுள்ளவர்களாக்கப்பட்டோம்’ என்ற விளக்கமாகவோ குறுக்கவில்லை.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκ πίστεως
  choice: நம்பிக்கையினால்
  rationale: ἐκ என்பதன் அடிப்படையான ‘இருந்து’ என்ற பொருளைவிட, இந்தப் பவுலின் தொடரில் காரணம் அல்லது அடிப்படையைக் குறிக்கும் இயல்பான தமிழாக்கம் இது. மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰρήνην ἔχομεν πρὸς τὸν θεὸν
  choice: கடவுளுடன் சமாதானம் பெற்றிருக்கிறோம்
  rationale: εἰρήνη என்பதன் உறவுசார் விரிவை ‘சமாதானம்’ காக்கிறது; அதை வெறும் மனஅமைதியாகவோ முழுமையாக விளக்கப்பட்ட ‘ஒப்புரவாகவோ’ மாற்றவில்லை. பெற்றிருக்கிறோம் என்பது நிகழ்ந்த நீதிப்படுத்தலின் தற்போதைய விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான மரியாதைமிக்க, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மெசியா இயேசு
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் அதன் பொருளான ‘மெசியா’ பயன்படுத்தப்படுகிறது; இயேசுவுடன் இயல்பான தமிழ் பெயர்த்தொடராக அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பவுலின் பயன்பாட்டில் δικαιωθέντες என்பதன் பொருள்
  choice: நீதிமான்களாக்கப்பட்டிருப்பதால்
  alternative: நீதிமான்கள் என்று தீர்ப்பளிக்கப்பட்டிருப்பதால் / நீதியுள்ளவர்களாக்கப்பட்டிருப்பதால்
  rationale: இந்த வசனம் இறைவனுடைய நீதிப்படுத்தும் செயலைக் கூறினாலும், அதன் முழு இறையியல் செயல்முறையை வரையறுப்பதில்லை. தேர்ந்த வடிவம் சட்டவியல் மற்றும் மாற்றமளிக்கும் நுணுக்கங்களுக்கிடையிலான பதற்றத்தைத் தேவையின்றித் தீர்க்காமல் விடுகிறது.
- issue: கடவுளுடன் சமாதானம் என்பதன் தன்மை
  choice: கடவுளுடன் சமாதானம்
  alternative: கடவுளிடமிருந்து கிடைக்கும் உள்ளார்ந்த மனஅமைதி / கடவுளுடன் ஒப்புரவு
  rationale: πρὸς τὸν θεὸν என்பது முதன்மையாகக் கடவுளுடனான உறவைக் குறிக்கிறது. எனினும் மூலச்சொல் ‘சமாதானம்’ என்பதே; எனவே ‘ஒப்புரவு’ என்ற விளக்கச் சொல்லால் அதன் பொருள் குறுக்கப்படவில்லை.
- issue: ἔχομεν / ἔχωμεν பாடவேறுபாடு
  choice: பெற்றிருக்கிறோம்
  alternative: சமாதானமாக இருப்போமாக
  rationale: கொடுக்கப்பட்டுள்ள SBLGNT மூலத்தில் குறிப்பு வினையான ἔχομεν உள்ளது. அறிவுறுத்தல் வினையான ἔχωμεν என்ற முக்கிய பாடவேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நீதிமான்களாக்கப்பட்டிருப்பதால்’ என்ற வடிவம் சற்று இறையியல் செறிவுடையதாக இருந்தாலும், மூலத்தின் சுருக்கத்தையும் திட்டமிட்ட தெளிவின்மையையும் காக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் தொடர்புடைய சொற்றொடர்களுடன் இணைக்கப்பட்டுள்ளன.
