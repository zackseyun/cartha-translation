  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: ta
  text: ஆனால், நாம் இன்னும் பாவிகளாக இருந்தபோதே மெசியா[b] நமக்காக[c] இறந்தார் என்பதன் மூலம், கடவுள் நம்மீது[a] தமது சொந்த அன்பை வெளிப்படுத்துகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறுவிதமாக, ‘நம்மை நோக்கி’ என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘கிறிஸ்தோஸ்’; மரபாக ‘கிறிஸ்து’ என்று வழங்கப்படுகிறது. இங்கு அது ஒரு தலைப்பாக இருப்பதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: வேறுவிதமாக, ‘நமது சார்பாக’ என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: வெளிப்படுத்துகிறார்
  rationale: நிகழ்கால வினைச்சொல் கடவுள் தமது அன்பைச் செயலில் தெளிவாகக் காட்டுவதைச் சுட்டுகிறது; ‘வெளிப்படுத்துகிறார்’ என்பது நவீனத் தமிழில் இயல்பாகவும் ஆதாரப்படுத்திக் காட்டும் பொருளுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள மென்மையான முரண்பாட்டையும் வாதத்தின் திருப்பத்தையும் காட்டுகிறது.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: தாம் கொண்டுள்ள அன்பை
  rationale: ἑαυτοῦ தரும் வலியுறுத்தலை ‘தாம்’ தக்கவைக்கிறது; ‘கொண்டுள்ள அன்பு’ என்பது தமிழில் இயல்பான சொல்லாக்கம்.
- source_word: εἰς ἡμᾶς
  choice: நம்மீது
  rationale: கடவுளுடைய அன்பு நம்மை நோக்கிச் செலுத்தப்படுவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: என்பதன் மூலம்
  rationale: கடவுள் தமது அன்பை எவ்வாறு வெளிப்படுத்துகிறார் என்பதைத் தொடர்ந்து வரும் நிகழ்வு விளக்குவதைக் காட்டுகிறது.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: நாம் இன்னும் பாவிகளாக இருந்தபோதே
  rationale: மூலத்தின் genitive absolute அமைப்பை இயல்பான காலநிலைத் துணைவாக்கியமாக மாற்றி, ἔτι என்பதன் ‘இன்னும்’ என்ற வலிமையையும் காக்கிறது.
- source_word: Χριστὸς
  choice: மெசியா
  rationale: இங்கு Χριστός ஒரு மெசியத் தலைப்பாகச் செயல்படுகிறது; ‘மெசியா’ அதன் தலைப்புச் சார்ந்த பொருளை வெளிப்படையாகக் காக்கிறது.
- source_word: ὑπὲρ ἡμῶν
  choice: நமக்காக
  rationale: நமது நன்மைக்காக அல்லது நமது சார்பாக என்ற பரந்த பொருளை இயல்பாகத் தருகிறது; பதிலீடு குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டை வசனத்தில் கட்டாயப்படுத்தவில்லை.
- source_word: ἀπέθανεν
  choice: இறந்தார்
  rationale: எளிய இறந்தகாலச் செயலை நேரடியாகவும் மரியாதைநிறைந்த தமிழிலும் வழங்குகிறது.
theological_decisions:
- issue: பவுலின் உரையில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இச்சொல் வெறும் பெயரைப்போல அல்லாமல் மெசியத் தலைப்பாகப் பயன்படுகிறது; ஆகவே தலைப்பின் பொருளை மொழிபெயர்ப்பது மூலத்தின் கருத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- issue: ὑπὲρ ἡμῶν என்பதன் பொருள் வீச்சு
  choice: நமக்காக
  alternative: நமது சார்பாக; நமது இடத்தில்
  rationale: இறப்பு நமது நன்மைக்காக நிகழ்ந்தது என்பதை உரை தெளிவாகக் கூறினாலும், அந்த முன்னிடைச்சொல் இவ்வசனத்தில் மட்டும் பதிலீட்டின் குறிப்பிட்ட வடிவத்தை நிர்ணயிக்கவில்லை. ‘நமக்காக’ அந்த இறையியல் விரிவையும் பதற்றத்தையும் திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நம்மீது தாம் கொண்டுள்ள அன்பு’ என்பது திசையையும் ἑαυτοῦ தரும் வலியுறுத்தலையும் சேர்த்துக் காக்கிறது. முதன்மை வாக்கியம் மூலத்தின் கருத்து வரிசையை மதித்தாலும், தமிழில் தெளிவாக வாசிக்கும்படி காரணத்தை விளக்கும் பகுதி முன்னிலைப்படுத்தப்பட்டுள்ளது.
