id: ROM.5.13
reference: Romans 5:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: ta
  text: ஏனெனில், திருச்சட்டம் கொடுக்கப்படும்வரை பாவம் உலகத்தில் இருந்தது; ஆனால், திருச்சட்டம் இல்லாதபோது பாவம் கணக்கில் கொள்ளப்படுவதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவருடைய கணக்கில் சுமத்தப்படுவதில்லை” அல்லது “குற்றமாகக் கணக்கிடப்படுவதில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: ஏனெனில், திருச்சட்டம் கொடுக்கப்படும்வரை
  rationale: ἄχρι νόμου என்பது திருச்சட்டம் வழங்கப்பட்ட காலம் வரையிலான காலப்பகுதியைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சூழல்படி தெளிவாகவும் இருக்க ‘கொடுக்கப்படும்வரை’ சேர்க்கப்பட்டது.
- source_word: νόμου
  choice: திருச்சட்டம்
  rationale: ரோமர் 5:14-இல் மோசே குறிக்கப்படுவதால், இங்கு மோசேயின் திருச்சட்டமே சூழலால் சுட்டப்படுகிறது. ‘திருச்சட்டம்’ என்பது அந்த உடன்படிக்கைச் சட்டத்தை இயல்பாகக் குறிக்கிறது; ‘மோசேயின்’ என்று மூலத்தில் இல்லாததைச் சேர்க்கவில்லை.
- source_word: ἁμαρτία
  choice: பாவம்
  rationale: பவுலின் ஒருமை அரூபப் பயன்பாட்டையும், பாவம் ஒரு ஆளும் சக்திபோல் தோன்றக்கூடிய நுட்பத்தையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἐν κόσμῳ
  choice: உலகத்தில்
  rationale: மனித உலகில் பாவம் இருந்ததை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐλλογεῖται
  choice: கணக்கில் கொள்ளப்படுவதில்லை
  rationale: கணக்குப் பதிவில் ஒருவருக்குச் சுமத்துதல் என்ற வினையின் பொருளை நவீன தமிழில் தெளிவாகக் காட்டுகிறது; கனமான கோட்பாட்டுச் சொல்லை முதன்மை உரையில் தவிர்க்கிறது.
- source_word: μὴ ὄντος νόμου
  choice: திருச்சட்டம் இல்லாதபோது
  rationale: திருச்சட்டம் இல்லாமையே கூற்றுக்கான சூழ்நிலை அல்லது நிபந்தனை என்பதை இயல்பான தமிழில் காட்டுகிறது; கிரேக்கத்தில் காலத்திற்கும் நிலைக்கும் இடமுள்ள நுட்பத்தை முற்றிலும் இடவியல் பொருளாகக் கட்டுப்படுத்தவில்லை.
theological_decisions:
- issue: νόμος என்பதன் குறிப்பு
  choice: ‘திருச்சட்டம்’ என்று மொழிபெயர்த்து, மோசேயின் திருச்சட்டம் என்ற குறிப்பைச் சூழலால் உணர விட்டுள்ளது.
  alternative: பொதுவாக ‘சட்டம்’ என்று மொழிபெயர்த்தல்; அல்லது வெளிப்படையாக ‘மோசேயின் திருச்சட்டம்’ என்று கூறுதல்.
  rationale: ஆதாமிலிருந்து மோசேவரையிலான காலத்தை அடுத்த வசனம் குறிப்பிடுவதால் மோசேயின் திருச்சட்டம் இங்கு முதன்மையாகக் கருதப்படுகிறது. ஆனால் மூலத்தில் ‘மோசேயின்’ இல்லை என்பதால் அதை உரையில் சேர்க்கவில்லை.
- issue: ἐλλογεῖται என்பதன் இறையியல் வலிமை
  choice: முதன்மை உரையில் ‘கணக்கில் கொள்ளப்படுவதில்லை’ என்று கொடுக்கப்பட்டுள்ளது.
  alternative: ‘ஒருவருடைய கணக்கில் சுமத்தப்படுவதில்லை’ அல்லது ‘குற்றமாகக் கணக்கிடப்படுவதில்லை’.
  rationale: இந்த வினைக்கு கணக்கியல் அல்லது சுமத்துதல் சார்ந்த வலிமை உண்டு. இருப்பினும், குறிப்பிட்ட பாவச்சுமத்தல் கோட்பாட்டை உரை தானாகத் தீர்மானிப்பதுபோல் காட்டாமல் அதன் இறையியல் இழுபறியைப் பாதுகாக்க பொதுவான சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதவாக்கியத்திற்குரிய செறிவும் காக்கப்பட்டுள்ளன. நீளமான கிரேக்க வாக்கியத்தின் எதிர்மறை அமைப்பு தமிழிலும் தெளிவாகத் தொடர்கிறது; அடிக்குறிப்பு குறியீடு தொடர்புடைய வினைத்தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
