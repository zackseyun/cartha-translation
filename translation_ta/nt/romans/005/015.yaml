  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: ta
  text: ஆனால் அருள்கொடை, மீறுதலைப் போன்றதல்ல. ஏனெனில், ஒரே மனிதனின் மீறுதலால் அந்தப் பலர் இறந்தார்கள் என்றால், கடவுளின் அருளும், ஒரே மனிதரான இயேசு மெசியாவின் அருளால் வந்த கொடையும் அந்தப் பலருக்கு எவ்வளவோ மிகுதியாகப் பெருகின.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, «ஒரே மனிதரான இயேசு மெசியாவின் அருளில் உள்ள கொடையும்».
    reason: ἐν χάριτι என்பதன் தொடர்பு அல்லது கருவிப் பொருளுக்கான சொற்சார் மாற்று.
lexical_decisions:
- source_word: παράπτωμα
  choice: மீறுதல்
  rationale: தவறான செயல் அல்லது வரம்புமீறலைக் குறிக்கும் சொல்லாக, ஆதாம்–மெசியா ஒப்பீட்டிலுள்ள அறநெறிசார் வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: χάρισμα
  choice: அருள்கொடை
  rationale: சாதாரணக் ‘கொடை’ என்பதிலிருந்து வேறுபடுத்தி, χάρις என்பதோடு உள்ள சொற்பிறப்புச் சார்பையும் இலவசமாக அருளப்பட்ட தன்மையையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: அந்தப் பலர் / அந்தப் பலருக்கு
  rationale: கிரேக்கத்தில் உள்ள குறிப்புச் சுட்டை உணர்த்தி, ‘ஒருவர்–பலர்’ என்ற பவுலின் பிரதிநிதித்துவ முரணை ‘அனைவர்’ என்று தீர்மானிக்காமல் காக்கிறது.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: கடவுளின் அருள்
  rationale: கிரேக்க உடைமைத் தொடர்பைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: அருளால் வந்த ... கொடை
  rationale: ἐν χάριτι என்பதன் கருவி அல்லது தொடர்புப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கொடை அருளின் வழியாக வந்தது என்பதைத் தெளிவாக்குகிறது.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: ஒரே மனிதரான
  rationale: ‘ஒருவர்–பலர்’ இணைப்பைத் தக்கவைத்து, இயேசுவைக் குறிக்கும் இடத்தில் தமிழின் மரியாதை ஒருமையைப் பயன்படுத்துகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் பட்டப்பெயர்சார் பொருளை ‘மெசியா’ என்று வெளிப்படுத்துகிறது; பெயர்–பட்டப்பெயர் அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐπερίσσευσεν
  choice: மிகுதியாகப் பெருகின
  rationale: περισσεύω என்பதிலுள்ள அளவுக்கு மீறிய நிறைவையும் πολλῷ μᾶλλον எனும் வலியுறுத்தலையும் தெளிவான தமிழில் தருகிறது.
theological_decisions:
- issue: ஆதாம்–மெசியா இணைப்பில் ‘பலர்’ என்பதன் பரப்பு
  choice: ‘அந்தப் பலர்’ என்று வைத்தல்
  alternative: ‘அனைவர்’ என்று மொழிபெயர்த்தல்
  rationale: இவ்வசனம் திட்டமிட்டு ‘ஒருவர்–பலர்’ மொழியைப் பயன்படுத்துகிறது. ‘அனைவர்’ என்று மாற்றுவது பரந்த பகுதியிலிருந்து ஒரு முடிவை இவ்வசனத்துக்குள் முன்கூட்டியே கொண்டுவரும்; ‘அந்தப் பலர்’ மூலத்தின் இறையியல் இழுபறியைத் தக்கவைக்கிறது.
- issue: ἐν χάριτι என்பதன் தொடர்பு
  choice: கொடை ‘அருளால் வந்தது’ என்று எடுத்தல்
  alternative: ‘அருளில் உள்ள கொடை’ என்று இடவியல்/சூழலியல் நெருக்கத்துடன் மொழிபெயர்த்தல்
  rationale: இங்கு ἐν கருவி அல்லது தொடர்பைக் குறிக்கலாம். தேர்ந்த வடிவம் தமிழில் இயல்பாக இருந்தாலும், கொடையும் அருளும் ஒன்றே என்று கலக்காமல் இரண்டையும் தனித்தனியாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடை. ‘அருள்கொடை’ மற்றும் ‘கொடை’ என χάρισμα/δωρεά வேறுபாடு ஓரளவு காக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத விளக்கங்களைச் சேர்க்காமல், நீண்ட கிரேக்க வாக்கியத்தின் காரண–விளைவு மற்றும் ஒருவர்–பலர் இணைநிலைகள் தெளிவாக வைக்கப்பட்டுள்ளன.
