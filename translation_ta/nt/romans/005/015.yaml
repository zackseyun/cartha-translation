  to: ஆனால் அருள்கொடை, மீறுதலைப் போன்றதல்ல. ஏனெனில், ஒரே மனிதனின் மீறுதலால் அந்தப் பலர் இறந்தார்கள் என்றால், கடவுளின் அருளும், ஒரே மனிதரான இயேசு மெசியாவின் அருளால் வந்த கொடையும் அந்தப் பலருக்கு எவ்வளவோ மிகுதியாகப் பெருகின.[a]
