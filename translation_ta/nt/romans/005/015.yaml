  source_fidelity: முக்கியமாக, வரைவில் «ஒரே மனிதரான இயேசு மெசியாவின் அருளால் வந்த கடவுளின் அருளும் கொடையும்» என்று அமைந்திருப்பது, கடவுளின் அருளும் கொடையும் இரண்டையும் இயேசுவின் அருளால் வந்தவைபோல் இலக்கண ரீதியாக இணைக்கிறது. கிரேக்கத்தில் «கடவுளின் அருள்» தனியான முதற் பொருளாகவும், «ஒரே மனிதரான இயேசு மெசியாவின் அருளில்/அருளால் உள்ள கொடை» தனியான இரண்டாம் பொருளாகவும் உள்ளன. திருத்தம் இந்த இணைநிலையையும் ἐν χάριτι-யின் தொடர்பையும் காக்கிறது.
