id: ROM.14.11
reference: Romans 14:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: ta
  text: 'ஏனெனில், இவ்வாறு எழுதப்பட்டுள்ளது: “என் உயிர்மேல் ஆணையாக, எனக்கு முன்பாக ஒவ்வொரு முழங்காலும் மண்டியிடும்; ஒவ்வொரு நாவும் கடவுளுக்கு அறிக்கையிடும் என்று ஆண்டவர் கூறுகிறார்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: இவ்வாறு எழுதப்பட்டுள்ளது
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் நிறைவு வினை வடிவத்தின் நிலைத்த எழுத்து அதிகாரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ζῶ ἐγώ
  choice: என் உயிர்மேல் ஆணையாக
  rationale: சொல்லுக்குச் சொல் ‘நான் உயிரோடிருப்பது உறுதி’ என்பதற்குப் பதிலாக, தெய்வீக உறுதிமொழியின் ஆணைத் தன்மையை நவீன தமிழில் இயல்பாகக் கடத்துகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான மரியாதையும் வேத வழக்குமுள்ள பொதுவான தமிழ் இணைச்சொல்; மூலத்தில் இல்லாத தெய்வப் பெயரைச் சேர்க்கவில்லை.
- source_word: ἐμοὶ κάμψει πᾶν γόνυ
  choice: முழங்கால் ஒவ்வொன்றும் எனக்கு முன்பாக மண்டியிடும்
  rationale: முழங்காலின் உருவகத்தைப் பாதுகாத்து, வணக்கம் அல்லது கீழ்ப்படிதலைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடரைப் பயன்படுத்துகிறது; ἐμοί-யின் நோக்கை ‘எனக்கு முன்பாக’ எனத் தெளிவாக்குகிறது.
- source_word: πᾶσα γλῶσσα
  choice: நாவு ஒவ்வொன்றும்
  rationale: ஒவ்வொருவரின் பொது வாய்மொழி ஒப்புதலைக் குறிக்கும் உடல் உறுப்பின் வேத உருவகத்தை அப்படியே பாதுகாக்கிறது.
- source_word: ἐξομολογήσεται
  choice: அறிக்கையிடும்
  rationale: வெளிப்படையாக ஒப்புக்கொள்ளுதல் அல்லது ஏற்றுக்கொள்ளுதல் என்ற பரப்பைத் தாங்குகிறது; தன்னுடைய பாவத்தை அறிக்கையிடுதல் என்ற குறுகிய பொருளுக்கு மட்டும் வாசிப்பைச் சுருக்கவில்லை.
- source_word: τῷ θεῷ
  choice: கடவுளிடம்
  rationale: தத்தி வேற்றுமையின் திசையைத் தெளிவாகக் காட்டி, முன் வரும் ‘எனக்கு’ என்பதோடு உள்ள உரைத் தன்மையான மாற்றத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: மேற்கோளில் ‘ஆண்டவர்’ மற்றும் ‘கடவுள்’ ஆகியவற்றின் தொடர்பு
  choice: ‘எனக்கு முன்பாக ... கடவுளிடம்’ என்ற மூல உரையின் மாற்றத்தை அப்படியே வைத்தல்
  alternative: இணை அமைப்பைச் சீராக்க இறுதியில் ‘என்னிடம்’ என மாற்றுதல் அல்லது கிறிஸ்துவியல் அடையாளத்தை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: பவுலின் சொற்களில் உள்ள முதல் நபர் தெய்வீக உரைக்கும் ‘கடவுளிடம்’ என்ற இறுதித் தொடருக்கும் இடையேயான பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதநடை. ‘மண்டியிடும்’ மற்றும் ‘நாவு ஒவ்வொன்றும்’ ஆகியவை மூலத்தின் தெளிவான உருவகங்களைப் பாதுகாக்கின்றன; ‘அறிக்கையிடும்’ என்பது ஒப்புதல், ஏற்றுக்கொள்ளுதல், புகழ்தல் ஆகிய சாத்திய நுணுக்கங்களை அளவுக்கு மீறி தீர்மானிக்காமல் நிறுத்துகிறது.
