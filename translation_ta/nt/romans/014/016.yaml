revisions:
- from: ஆகவே, உங்களுக்குரிய நன்மை பழித்துப் பேசப்பட இடங்கொடுக்காதீர்கள்.[a]
  to: எனவே, உங்கள் நன்மை இழிவாகப் பேசப்படுவதற்கு இடங்கொடுக்காதீர்கள்.[a]
  rationale: The revision makes the prohibition idiomatic in modern standard Tamil by using a nominalized passive clause with ‘இடங்கொடுக்காதீர்கள்.’ It also streamlines the possessive expression while preserving the source text’s broad and unresolved reference to ‘your good.’ The footnote is adjusted to match the revised wording and retains the lexical ambiguity of βλασφημέω.
  reviewer_model: gpt-5.6-terra
