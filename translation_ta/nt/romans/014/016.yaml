  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ βλασφημείσθω οὖν ὑμῶν τὸ ἀγαθόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: ta
  text: எனவே, உங்கள் நன்மை இழிவாகப் பேசப்படுவதற்கு இடங்கொடுக்காதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இழிவாகப் பேசப்பட’ என்பதற்கு ‘தூற்றப்பட’ அல்லது ‘அவதூறாகப் பேசப்பட’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் இழிவான அல்லது அவதூறான பேச்சைக் குறிக்கலாம்; இங்கு அது குறிப்பாகக் கடவுளை நிந்திப்பதைக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: இடங்கொடுக்காதீர்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு ஏவல் வினையுடன் வரும் μή தடையை வெளிப்படுத்துகிறது. தமிழில் ‘இடங்கொடுக்காதீர்கள்’ என்பது அந்தத் தடைப் பொருளை இயல்பாகக் கூறுகிறது.
- source_word: βλασφημείσθω
  choice: பழித்துப் பேசப்பட
  rationale: βλασφημέω இங்கு கடவுளை நிந்திப்பதை மட்டும் குறிக்காமல், ஒன்றைப் பழித்து அல்லது அவதூறாகப் பேசுவதைக் குறிக்கிறது. ‘பழித்துப் பேசப்பட’ என்பது செயப்பாட்டு வடிவத்தையும் இழிவுபடுத்தும் பேச்சையும் காக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை அல்லது அறிவுறுத்தலை οὖν குறிக்கிறது; ‘ஆகவே’ அந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὑμῶν
  choice: உங்களுக்குரிய
  rationale: இந்த உருபு τὸ ἀγαθόν என்பதுடன் உடைமை அல்லது தொடர்பைக் குறிக்கிறது. ‘உங்களுக்குரிய’ என்பது இயல்பான தமிழில் அந்த உறவைத் தெரிவிக்கிறது.
- source_word: τὸ ἀγαθόν
  choice: நன்மை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலைப் பெயரடை ‘நல்லது/நன்மை’ என்ற பரந்த பொருளைக் கொண்டது. ‘நன்மை’ என்பது அதன் சுருக்கத்தையும் குறிப்பிடப்படாத பரந்த சுட்டையும் காக்கிறது.
theological_decisions:
- issue: ‘உங்களுக்குரிய நன்மை’ (τὸ ἀγαθόν) எதைக் குறிக்கிறது?
  choice: குறிப்பிட்ட ஒன்றாகச் சுருக்காமல் ‘உங்களுக்குரிய நன்மை’ என்று பரந்த வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: உங்கள் சுதந்திரம்; உங்கள் உரிமை; உங்கள் நல்ல சாட்சி அல்லது போதனை
  rationale: பவுலின் சொற்றொடர் சுருக்கமாகவும் பலவகையில் புரிந்துகொள்ளக்கூடியதாகவும் உள்ளது. அதை ‘சுதந்திரம்’ அல்லது ‘உரிமை’ என்று மட்டும் கூறுவது கிரேக்கத்தில் வெளிப்படையாக இல்லாத விளக்கத்தை மொழிபெயர்ப்புக்குள் கொண்டுவரும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நன்மை’ என்பதன் சுட்டை விளக்கி வரையறுக்காமல், மூலத்தின் பொருள் அகலமும் இறையியல் பதற்றமும் காக்கப்பட்டுள்ளன.
