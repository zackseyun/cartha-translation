base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: ta
  text: 'ஏனெனில், இதற்காகவே மெசியா இறந்து, மீண்டும் உயிர்பெற்றார்[a]: இறந்தவர்களையும் உயிரோடிருப்பவர்களையும் அவர் ஆளும்படியாக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வாழ்ந்தார்’; இன்னும் வெளிப்படையாக, ‘உயிர்த்தெழுந்தார்.’ கிரேக்கத்தில் ‘இறந்தார், வாழ்ந்தார்’ என்று உள்ளது; இங்கு அதன் சூழல் உயிர்த்தெழுந்த வாழ்வைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: இதற்காகவே
  rationale: நோக்கத்தைச் சுட்டும் கிரேக்கத் தொடரை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது; ‘வே’ அதன் வலியுறுத்தலைக் காக்கிறது.
- source_word: γὰρ
  choice: சூழலுடன் இணைந்த விளக்கத் தொடர்பு
  rationale: முந்தைய வசனத்திற்கான விளக்கத்தை γάρ அறிமுகப்படுத்துகிறது. தனியாக ‘ஏனெனில்’ என்று சேர்ப்பது இத்தமிழ் வாக்கியத்தைச் சற்றுக் கடினமாக்குவதால், ‘இதற்காகவே’ என்ற தொடக்கத்தின் மூலம் அதன் தொடர்பு இயல்பாக வெளிப்படுகிறது.
- source_word: Χριστὸς
  choice: மெசியா
  rationale: இங்கு இயேசுவைக் குறிக்கும் பட்டமாக இருப்பதால், அபிஷேகம் செய்யப்பட்ட அரசர் என்ற பொருளுடைய ‘மெசியா’ பயன்படுத்தப்படுகிறது.
- source_word: ἀπέθανεν
  choice: இறந்து
  rationale: இறந்தார் என்ற நேரடியான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἔζησεν
  choice: மீண்டும் உயிர்பெற்றார்
  rationale: ‘இறந்தார்’ என்பதுடன் இணைந்து வருவதால், மரணத்திற்குப் பிந்தைய உயிரைச் சூழல் சுட்டுகிறது. ‘மீண்டும் உயிர்பெற்றார்’ அதைத் தெளிவாக்கினாலும், கிரேக்கத்தின் சொற்சுருக்கத்தை மிகையாக விரிவாக்கவில்லை.
- source_word: ἵνα
  choice: ஆளும்படியாகவே
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα-வின் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: νεκρῶν
  choice: இறந்தவர்களையும்
  rationale: பெயர்ச்சொல் போலப் பயன்படுத்தப்பட்ட பன்மை வடிவத்தை நேரடியாகத் தருகிறது.
- source_word: ζώντων
  choice: உயிரோடிருப்பவர்களையும்
  rationale: இறந்தவர்களுக்கு எதிர்மறை இணையாக, தற்போது உயிருடன் இருப்பவர்களைக் குறிக்கும் பங்கேற்பு வடிவத்தைத் தெளிவாகத் தருகிறது.
- source_word: κυριεύσῃ
  choice: அவர் ஆளும்படியாக
  rationale: ஆதிக்கம் செலுத்துதல் அல்லது அதிகாரத்துடன் ஆளுதல் என்ற வினைப் பொருளை நேரடியாகக் காக்கிறது; ‘ஆண்டவராக இருக்க’ என்று பெயர்ப்பட்டமாக மாற்றவில்லை.
theological_decisions:
- issue: ἔζησεν என்பதிலுள்ள உயிர்த்தெழுதல் சார்ந்த பொருள்
  choice: மீண்டும் உயிர்பெற்றார்
  alternative: வாழ்ந்தார்; உயிர்த்தெழுந்தார்
  rationale: ‘இறந்து’ என்பதற்குப் பின் வருவதும், இறந்தவர்களையும் உயிரோடிருப்பவர்களையும் ஆளும் நோக்கம் குறிப்பிடப்படுவதும் உயிர்த்தெழுந்த வாழ்வைச் சுட்டுகின்றன. இருப்பினும், மூலத்தின் எளிய ‘வாழ்ந்தார்’ என்ற வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: κυριεύσῃ என்பதின் கிறிஸ்துவியல் அதிகாரப் பொருள்
  choice: அவர் ஆளும்படியாக
  alternative: அவர் ஆண்டவராக இருக்கும்படியாக
  rationale: கிரேக்கத்தில் இது வினைச்சொல்லாக இருப்பதால், ஆட்சி மற்றும் அதிகாரத்தை ‘ஆள’ என்று நேரடியாக வெளிப்படுத்துகிறது; அதேவேளை அதை ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றி விளக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நோக்க அமைப்பையும் ‘இறந்தவர்கள்—உயிரோடிருப்பவர்கள்’ என்ற எதிரிணையையும் காத்தபடி, தமிழில் தேவையான இடத்தில் ‘இப்படிச் செய்தார்’ சேர்க்கப்பட்டுள்ளது.
