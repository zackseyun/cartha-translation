  to: அந்த நாளைக் கடைப்பிடிக்கிறவர்[a] ஆண்டவருக்காக அதைக் கடைப்பிடிக்கிறார். சாப்பிடுகிறவர் ஆண்டவருக்காகச் சாப்பிடுகிறார்; ஏனெனில் அவர் கடவுளுக்கு நன்றி செலுத்துகிறார். சாப்பிடாதவர் ஆண்டவருக்காகச் சாப்பிடுவதில்லை; அவரும் கடவுளுக்கு நன்றி செலுத்துகிறார்.
  rationale: The revision keeps the draft’s faithful rendering of the day, the Lord, eating, and thanksgiving, while making the final negative clause a direct and natural equivalent of οὐκ ἐσθίει. It also removes unnecessary emphatic ‘வே,’ without narrowing the intentionally general reference to the day.
