source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: ta
  text: அந்த நாளைக் கடைப்பிடிக்கிறவர்[a] ஆண்டவருக்காக அதைக் கடைப்பிடிக்கிறார். சாப்பிடுகிறவர் ஆண்டவருக்காகச் சாப்பிடுகிறார்; ஏனெனில் அவர் கடவுளுக்கு நன்றி செலுத்துகிறார். சாப்பிடாதவர் ஆண்டவருக்காகச் சாப்பிடுவதில்லை; அவரும் கடவுளுக்கு நன்றி செலுத்துகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாளை மதிக்கிறவர்” அல்லது “அந்த நாளைக் கருத்தில் கொள்கிறவர்.” கிரேக்க வினைச்சொல் மனத்தை ஒன்றில் செலுத்துவதையோ, அதற்குச் சிறப்புக் கவனம் கொடுப்பதையோ குறிக்கலாம். இங்கு ஒரு நாளைக் கடைப்பிடிப்பது என்பதே பொருத்தமான பொருளாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: கடைப்பிடிக்கிறவர் / கடைப்பிடிக்கிறார்
  rationale: இங்கு φρονέω என்பது ஒரு நாளை மனத்தில் நினைப்பதை மட்டும் அல்லாமல், அதற்கு சிறப்புக் கவனம் கொடுத்து நடைமுறையில் அனுசரிப்பதைக் குறிக்கிறது. ‘கடைப்பிடி’ என்பது இயல்பான நவீனத் தமிழில் அந்த நடைமுறைப் பொருளைத் தருகிறது; அதேவேளையில் மாற்றுப் பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: τὴν ἡμέραν
  choice: அந்த நாளை
  rationale: கிரேக்க உரையின் குறிப்புச் சுட்டைத் தமிழில் இயல்பாக வெளிப்படுத்தி, முந்தைய வசனத்தில் விவாதிக்கப்பட்ட நாளைக் குறிக்கிறது; அது எந்த நாள் என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: κυρίῳ
  choice: ஆண்டவருக்காகவே
  rationale: இந்த வேற்றுமைச் சொல் செயல் ஆண்டவரை நோக்கியும் அவருக்காகவும் செய்யப்படுவதை உணர்த்துகிறது. ‘வே’ இணைப்பு கிரேக்க இணைப்பமைப்பில் உள்ள நோக்குச் சுட்டை இயல்பாக வலியுறுத்துகிறது.
- source_word: ἐσθίων / ἐσθίει
  choice: சாப்பிடுகிறவர் / சாப்பிடுகிறார்
  rationale: உணவு தொடர்பான வழக்கமான நடைமுறையைத் தெளிவாகவும் பொதுமக்களுக்கு இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εὐχαριστεῖ
  choice: நன்றி செலுத்துகிறார்
  rationale: கடவுளை நோக்கிய வெளிப்படையான நன்றிச் செயலைத் தமிழில் கண்ணியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁ μὴ ἐσθίων
  choice: சாப்பிடாதவர் / சாப்பிடாமல் இருக்கிறார்
  rationale: சாப்பிடுகிறவருடன் உள்ள கிரேக்க இணைநிலையைப் பாதுகாக்கிறது; ‘விரதமிருக்கிறார்’ என்று கூறி குறிப்பிட்ட நடைமுறையை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘அந்த நாள்’ என்பதைக் கடைப்பிடிப்பதன் பொருள்
  choice: ரோமர் 14-இல் விவாதிக்கப்படும் ஒரு குறிப்பிட்ட நாளுக்குச் சிறப்புக் கவனம் கொடுத்து அதைக் கடைப்பிடித்தல்; அது எந்த நாள் என்று குறிப்பிடாமல் விடுதல்
  alternative: ஓய்வுநாள், யூதப் பண்டிகை நாள், அல்லது நோன்பு நாள் என்று குறிப்பாக அடையாளப்படுத்துதல்
  rationale: பவுலின் சொற்கள் இங்கு பொதுவாக உள்ளதால், உரையில் இல்லாத சமய அல்லது வரலாற்று அடையாளத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: κύριος என்பதன் குறிப்பு
  choice: ஆண்டவர்
  alternative: கடவுள்
  rationale: பவுலின் இந்தச் சூழலில் κύριος இயல்பாக ஆண்டவராகிய இயேசுவைக் குறிக்கலாம்; அதே சமயம் நன்றி வெளிப்படையாகக் கடவுளுக்குச் செலுத்தப்படுகிறது. மூல உரையின் சொல் வேறுபாடு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடைப்பிடி’ நடைமுறை அனுசரிப்பைத் தெரிவிக்கிறது; ‘அந்த நாள்’ எந்த நாளென்பதைத் தீர்மானிக்காமல் மூலத்தின் பொதுத்தன்மையைப் பாதுகாக்கிறது. ‘சாப்பிடுகிறவர்/சாப்பிடாதவர்’ என்ற இணைநிலை கிரேக்க உரையின் சமச்சீரைத் தக்கவைக்கிறது.
