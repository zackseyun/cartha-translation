  source_fidelity: மூல கிரேக்கத்தின் எதிரிணை அமைப்பும் பொருளும் நம்பகமாகக் காக்கப்பட்டுள்ளன. κρίνει இங்கு கண்டனம் செய்வதைக் காட்டிலும் நாட்களை மதிப்பீடு செய்து வேறுபடுத்துவதைச் சுட்டுகிறது; ‘கருதுகிறார்’ பொருத்தமானது. ἡμέραν παρ’ ἡμέραν என்பதன் ஒப்பீட்டு வலிமை ‘மற்றொரு நாளைவிட மேலானதாக’ என்பதில் தெளிவாகிறது. πᾶσαν ἡμέραν-இன் சூழல்சார் ‘வேறுபாடின்றி’ என்ற கருத்து ‘ஒரேபோல’ என்பதால் இயல்பாக வெளிப்படுகிறது; அது அடிக்குறிப்பிலும் வெளிப்படையாகக் குறிக்கப்பட்டுள்ளது. இறுதிப் பணிவடிவத்தின் முழு உறுதி/நம்பிக்கை பொருளையும் ‘முழுமையாக உறுதிகொள்ளட்டும்’ காக்கிறது.
