id: ROM.14.5
reference: Romans 14:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: ta
  text: ஒருவர் ஒரு நாளை மற்றொரு நாளைவிட மேலானதாகக் கருதுகிறார்[a]; மற்றொருவரோ எல்லா நாட்களையும் ஒரேபோலக் கருதுகிறார்[b]. ஒவ்வொருவரும் தன் மனதில் முழுமையாக உறுதிகொள்ளட்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருவர் ஒரு நாளை மற்றொரு நாளைவிட முக்கியமானதாகக் கருதுகிறார்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘எல்லா நாட்களையும்’; சூழலில், எல்லா நாட்களையும் ஒரேபோலக் கருதுவது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘முழு நிச்சயம் உடையவராக இருக்கட்டும்’ அல்லது ‘முழுமையாக நம்பிக்கை கொள்ளட்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: கருதுகிறார்
  rationale: இங்கு κρίνω என்பது குற்றம் தீர்ப்பதைக் குறிக்காமல், மதிப்பிட்டு வேறுபடுத்திப் பார்ப்பதைக் குறிக்கிறது. ‘கருதுகிறார்’ என்பது அந்தப் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: ஒரு நாளை மற்றொரு நாளைவிட மேலானதாக
  rationale: παρά அமைப்பு நாட்களுக்கிடையிலான ஒப்பீட்டையும் மதிப்பு வேறுபாட்டையும் காட்டுகிறது. எந்த வகையான நாட்கள் என்று மூலவசனம் குறிப்பிடாததால், ‘ஓய்வுநாள்’ அல்லது ‘பண்டிகை நாள்’ என்று விளக்கிச் சேர்க்கப்படவில்லை.
- source_word: πᾶσαν ἡμέραν
  choice: எல்லா நாட்களையும் ஒரேபோல
  rationale: சொல்லுக்குச் சொல் பொருள் ‘ஒவ்வொரு நாளையும்/எல்லா நாட்களையும்’ என்பதாகும். முதல் கூற்றுடனான முரண்பாட்டு அமைப்பு, இரண்டாமவர் நாட்களுக்கிடையில் வேறுபாடு காணவில்லை என்பதை உணர்த்துவதால் ‘ஒரேபோல’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: தனித்தனி நபரை வலியுறுத்தும் பகிர்மான ஒருமையை இயல்பான தமிழில் இது தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: தன் மனதில்
  rationale: νοῦς என்பது மனம் அல்லது சிந்திக்கும் அறிவைக் குறிக்கிறது. ἰδίῳ வலியுறுத்தும் தனிப்பட்ட பொறுப்பை ‘தன்’ காக்கிறது.
- source_word: πληροφορείσθω
  choice: முழுமையாக உறுதிகொள்ளட்டும்
  rationale: நிறைவான நம்பிக்கை அல்லது உறுதியை அடைந்த நிலையில் இருக்க வேண்டும் என்ற நிகழ்காலப் பணிப்பொருளை இந்தச் சொற்றொடர் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: இங்கு குறிப்பிடப்படும் ‘நாட்கள்’ எவை என்பது
  choice: ‘நாள்’ என்ற பொதுவான குறிப்பையே காக்குதல்
  alternative: யூத ஓய்வுநாட்கள், பண்டிகை நாட்கள், நோன்பு நாட்கள் அல்லது சிறப்பு வழிபாட்டு நாட்கள் என்று குறிப்பாக்குதல்
  rationale: பவுல் இவ்வசனத்தில் அந்த நாட்களை அடையாளப்படுத்தவில்லை. ஆகவே மொழிபெயர்ப்பு வசனம் திறந்துவைக்கும் விளக்க வாய்ப்பைத் திறந்தவாறே வைக்கிறது.
- issue: πᾶσαν ἡμέραν என்பதில் ஒப்புமையை வெளிப்படுத்துதல்
  choice: ‘எல்லா நாட்களையும் ஒரேபோல’
  alternative: ‘எல்லா நாட்களையும்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: ‘ஒரேபோல’ என்பதற்குத் தனியான கிரேக்கச் சொல் இல்லாவிட்டாலும், முதல் நபர் நாட்களை வேறுபடுத்துவதற்கு எதிராக இரண்டாம் நபர் எல்லா நாட்களையும் மதிப்பிடுகிறார் என்ற சூழல்சார் எதிர்மறை ஒப்புமையை இது வெளிப்படுத்துகிறது; இதை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது.
- issue: தனிப்பட்ட மனவுறுதியின் தன்மை
  choice: ‘தன் மனதில் முழுமையாக உறுதிகொள்ளட்டும்’
  alternative: தன் விருப்பப்படி நடக்கட்டும் அல்லது தனது கருத்தை மற்றவர்மீது திணிக்கட்டும் என்று பொருள்கொள்ளுதல்
  rationale: மூலச்சொல் முழு நம்பிக்கை அல்லது உறுதியைக் கோருகிறது; கட்டுப்பாடற்ற தனிச்செயலையோ பிறரைத் தீர்ப்பதையோ கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கருதுகிறார்’ என்பது நீதித்தீர்ப்பு என்ற தவறான எண்ணத்தைத் தவிர்த்து மதிப்பீட்டுப் பொருளைக் காக்கிறது; ‘மற்றொருவரோ’ இரு நிலைப்பாடுகளுக்கிடையிலான எதிர்மறை ஒப்புமையை இயல்பாக வெளிப்படுத்துகிறது.
