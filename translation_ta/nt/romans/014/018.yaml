reference: Romans 14:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: ta
  text: ஏனெனில், இவ்விதமாகக் கிறிஸ்துவுக்குப் பணிசெய்கிறவர் கடவுளுக்கு உகந்தவராகவும், மனிதர்களால் ஏற்றுக்கொள்ளப்பட்டவராகவும் இருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இவ்விதமாக” என்பதற்கு, “இதில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: ἐν τούτῳ என்ற கிரேக்கத் தொடரின் சுருக்கமான, உண்மையான குறிப்புத் தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: δουλεύων
  choice: பணிசெய்கிறவர்
  rationale: கிறிஸ்துவுக்குக் கீழ்ப்பட்டு அவருக்குச் சேவை செய்வதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மூலத்தில் உள்ள அடிமைச் சேவைப் பின்னணியை முற்றிலும் முன்னிறுத்தாமல், அதன் கீழ்ப்படிதல் சார்ந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: τῷ Χριστῷ
  choice: கிறிஸ்துவுக்கு
  rationale: Χριστός என்பதற்கான நிலையான தமிழ் வேதாகமச் சொல்; இங்கு சேவையின் இலக்கைத் தெளிவாகக் காட்ட நான்காம் வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: εὐάρεστος τῷ θεῷ
  choice: கடவுளுக்கு உகந்தவராக
  rationale: கடவுளுக்கு மகிழ்ச்சியளிக்கும் அல்லது அவரால் விரும்பத்தக்கவராக இருப்பது என்ற பொருளை dignified, natural Tamil-ல் தருகிறது.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: மனிதர்களால் ஏற்றுக்கொள்ளப்பட்டவராக
  rationale: δόκιμος என்பதன் சோதிக்கப்பட்டு அங்கீகரிக்கப்பட்ட/ஏற்றுக்கொள்ளப்பட்ட நிலையை வெளிப்படுத்துகிறது; ἀνθρώποις இங்கு பாலினப் பொதுமையான மனிதர்களைக் குறிக்கிறது.
theological_decisions:
- issue: ἐν τούτῳ என்பதன் குறிப்பு
  choice: இவ்விதமாக
  alternative: இதில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நீதி, சமாதானம், பரிசுத்த ஆவியினால் உண்டாகும் மகிழ்ச்சி ஆகியவற்றின் அடிப்படையில் கிறிஸ்துவுக்குச் சேவை செய்வதைச் சுட்டுவதாக இயல்பாக வாசிக்கிறது. எனினும், கிரேக்கத்தின் சுட்டுப்பெயர் இலக்கண ரீதியாகச் சுருக்கமானதும் ஓரளவு தெளிவற்றதுமானதால், மாற்று நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: δόκιμος என்பதில் தெய்வீக அங்கீகாரமா மனித மதிப்பீடா
  choice: மனிதர்களால் ஏற்றுக்கொள்ளப்பட்டவர்
  alternative: மனிதர்களிடையே மதிப்புக்குரியவர்
  rationale: வாக்கியத்தின் இணை அமைப்பில் கடவுளுக்கு உகந்தவர் என்பதோடு மனிதர்களின் சாதகமான அங்கீகாரமும் சேர்க்கப்படுகிறது; இதை இரட்சிப்புக்கான மனிதத் தீர்ப்பாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் மரியாதைமிக்கதுமான நடை. பாலினப் பொதுமையான ἀνθρώποις என்பதற்கு “மனிதர்கள்” பயன்படுத்தப்பட்டுள்ளது.
