source:
  edition: SBLGNT
  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: ta
  text: உன்னிடம் உள்ள விசுவாசத்தை[a] கடவுளுக்கு முன்பாக உன்னிடமே வைத்துக்கொள். தான் ஏற்றுக்கொள்வதில் தன்னையே நியாயந்தீர்க்காதவர்[b] பேறுபெற்றவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு இருக்கும் உறுதியான நம்பிக்கையை.” இங்கு “விசுவாசம்” என்பது விவாதத்திற்குரிய விஷயத்தைப் பற்றி ஒருவருக்கு இருக்கும் தனிப்பட்ட உறுதியான நம்பிக்கையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன்னையே குற்றவாளி என்று தீர்க்காதவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: விசுவாசத்தை
  rationale: πίστις என்பதற்கான வழக்கமான முக்கியச் சொல் இணைப்பைப் பேணுகிறது. இச்சூழலில் இது இரட்சிக்கும் விசுவாசத்தை மட்டும் குறிக்காமல், விவாதத்திற்குரிய நடைமுறையைப் பற்றி கடவுளுக்கு முன்பாக ஒருவருக்கு இருக்கும் உறுதியான நம்பிக்கையையும் குறிக்கலாம்.
- source_word: κατὰ σεαυτὸν
  choice: உன்னிடமே
  rationale: தன் நம்பிக்கையை மற்றவர்கள்மீது திணிக்காமல் தனக்குள் வைத்திருக்க வேண்டும் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: அந்த நம்பிக்கை கடவுளிடமிருந்து மறைக்கப்படுவது அல்ல; அவரது முன்னிலையில் பொறுப்புணர்வுடன் கொள்ளப்படுவது என்ற கருத்தைப் பேணுகிறது.
- source_word: μακάριος
  choice: பேறுபெற்றவர்
  rationale: வெறும் மனமகிழ்ச்சியைக் காட்டிலும், கடவுளின் பார்வையில் நல்வாய்ப்பும் நலநிலையும் பெற்றவர் என்ற அறநெறி மற்றும் இறையியல் கனத்தைத் தருகிறது.
- source_word: κρίνων ἑαυτὸν
  choice: தன்னையே நியாயந்தீர்க்காதவர்
  rationale: κρίνω என்பதன் அடிப்படைத் தீர்ப்பிடும் பொருளைப் பேணுகிறது; இங்கு குற்றவாளியாகத் தீர்த்துக்கொள்ளுதல் என்ற வலுவான நுண்பொருளும் சாத்தியம் என்பதால் அதை அடிக்குறிப்பில் தருகிறது.
- source_word: ἐν ᾧ δοκιμάζει
  choice: தான் ஏற்றுக்கொள்வதைக் கொண்டு
  rationale: δοκιμάζω இங்கு ஆராய்ந்து சரியென ஏற்றுக்கொள்வதைக் குறிக்கிறது. ἐν என்பதன் கருவி அல்லது அடிப்படை நுண்பொருளை ‘கொண்டு’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: விவாதத்திற்குரிய நடைமுறைகள் பற்றிய சூழலில் πίστις என்பதன் பொருள்
  choice: ‘விசுவாசம்’ என்ற முக்கியச் சொல்லை வைத்துக்கொண்டு, அதை இவ்விஷயத்தைப் பற்றிய தனிப்பட்ட உறுதியான நம்பிக்கையாகச் சூழல் விளக்க அனுமதித்தல்
  alternative: ‘உறுதியான நம்பிக்கை’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழல் உணவு மற்றும் நாட்கள் போன்ற மனச்சாட்சி சார்ந்த கருத்து வேறுபாடுகளைப் பற்றியது. இருப்பினும் πίστις என்ற சொல்லின் இறையியல் பரப்பைச் சுருக்காமல், சூழல்சார் மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாப்பது பொருத்தமானது.
- issue: κρίνων என்பதன் தீர்ப்பு அல்லது கண்டனப் பொருள்
  choice: முதன்மை உரையில் ‘நியாயந்தீர்க்காதவர்’
  alternative: ‘தன்னையே குற்றவாளி என்று தீர்க்காதவர்’
  rationale: முதன்மை உரை கிரேக்கச் சொல்லின் பரந்த பொருளைப் பேணுகிறது; செய்கிறதை மனச்சாட்சி கண்டிப்பதால் தன்னைத்தானே குற்றவாளியாக்குதல் என்ற சூழல்சார் வலுவான பொருளை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை முன்னிலையை ‘நீ’ என்றும் பொதுவான ஒருமை நபரை மரியாதை கலந்த ‘அவர்’ என்றும் வழங்கப்பட்டுள்ளது. வாக்கியத்தின் தொடக்கத்தில் முன்னிறுத்தப்பட்ட πίστιν இயன்ற அளவு தமிழிலும் முன்னிறுத்தப்பட்டுள்ளது; மொழிநடை கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமாக வைக்கப்பட்டுள்ளது.
