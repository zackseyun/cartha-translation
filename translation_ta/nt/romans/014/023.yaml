source:
  edition: SBLGNT
  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: ta
  text: ஆனால், சந்தேகப்படுகிறவன் சாப்பிட்டால் கண்டிக்கப்பட்டிருக்கிறான்; ஏனெனில் அவன் சாப்பிடுவது விசுவாசத்திலிருந்து வருவதல்ல. விசுவாசத்திலிருந்து வராத அனைத்தும் பாவமே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விசுவாசத்திலிருந்து வருவது” என்பதற்கு “உறுதியான நம்பிக்கையிலிருந்து வருவது” என்றும் மொழிபெயர்க்கலாம். கிரேக்க மூலத்தில் “விசுவாசத்திலிருந்து” என்று உள்ளது; கடவுளுக்கு முன்பாக உறுதியான மனநிலையுடன் செயல்படுவதையும் இது உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: சந்தேகப்படுகிறவன்
  rationale: உணவைப் பற்றிய இந்தச் சூழலில், பிறரோடு வாதிடுவதைவிட உள்ளத்தில் தயங்குவதையும் உறுதியில்லாமல் இருப்பதையும் குறிக்கிறது.
- source_word: ἐὰν φάγῃ
  choice: சாப்பிட்டால்
  rationale: ἐάν உடன் வரும் இறந்தகாலத் துணைவினை நிபந்தனையைக் குறிக்கிறது; ‘சாப்பிட்டால்’ என்பது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: κατακέκριται
  choice: கண்டனத்துக்குள்ளாகிறான்
  rationale: நிகழ்ந்த செயலின் விளைவாகத் தொடரும் கண்டன நிலையைக் கிரேக்க நிறைவுக்காலச் செயப்பாட்டு வடிவம் காட்டுகிறது; கண்டிப்பவர் யார் என்பதைத் தமிழ் மொழிபெயர்ப்பு குறிப்பிடாமல் விடுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கண்டனத்திற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ἐκ πίστεως
  choice: விசுவாசத்திலிருந்து பிறப்பது
  rationale: ἐκ என்பதன் மூலத்திலிருந்து தோன்றும் செயல் என்ற உருவகத்தையும் பவுலின் πίστις சொல்லாட்சியையும் காக்கிறது; இச்சூழலில் கடவுளுக்கு முன்பான உறுதியான மனநிலையையும் இது உள்ளடக்கலாம்.
- source_word: πᾶν ... ὃ
  choice: அனைத்தும்
  rationale: எந்த விதிவிலக்கும் இன்றி எல்லாவற்றையும் உள்ளடக்கும் கிரேக்க நடுநிலை ஒருமைக் கட்டமைப்பின் விரிவான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἁμαρτία ἐστίν
  choice: பாவமே
  rationale: ‘பாவமானது’ என்ற பண்புப்பெயர் வடிவத்தைவிட, பவுலின் திட்டவட்டமான பயனிலைப் பெயர்ச்சொல் கூற்றை வலிமையாகக் காக்கிறது.
theological_decisions:
- issue: ஒழுக்கத் தீர்மானம் சார்ந்த பவுலின் சூழலில் πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: உறுதியான நம்பிக்கை / மனவுறுதி
  rationale: இங்கு தனிப்பட்ட உறுதியான மனச்சாட்சியின் நுண்பொருள் இருந்தாலும், ‘விசுவாசம்’ என்பது பவுலின் விரிவான இறையியல் சொல்லாட்சியைக் காக்கிறது; சூழல்சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: κατακέκριται என்பதில் கண்டனத்தின் மூலமும் வரம்பும்
  choice: கண்டனத்துக்குள்ளாகிறான்
  alternative: தன்னையே கண்டனத்துக்குள்ளாக்குகிறான் / கடவுளால் கண்டிக்கப்படுகிறான்
  rationale: கிரேக்கச் செயப்பாட்டு வடிவம் கண்டனம் செய்பவர் யார் என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே அது கடவுளின் தீர்ப்பா, மனச்சாட்சியின் கண்டனமா, இரண்டுமா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் இறையியல் சொல்லாட்சியைத் தொடர ‘விசுவாசம்’ காக்கப்பட்டுள்ளது; ‘பிறப்பது’ என்பது ἐκ என்பதன் மூலத்தோற்ற உறவை இயல்பாக வெளிப்படுத்துகிறது.
