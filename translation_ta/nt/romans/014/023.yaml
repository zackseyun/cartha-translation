revisions:
- from: ஆனால் சந்தேகப்படுகிறவன் சாப்பிட்டால் கண்டனத்துக்குள்ளாகிறான்; ஏனெனில், அவன் சாப்பிடுவது விசுவாசத்திலிருந்து பிறப்பதல்ல.[a] விசுவாசத்திலிருந்து பிறக்காத அனைத்தும் பாவமே.
  to: ஆனால், சந்தேகப்படுகிறவன் சாப்பிட்டால் கண்டிக்கப்பட்டிருக்கிறான்; ஏனெனில் அவன் சாப்பிடுவது விசுவாசத்திலிருந்து வருவதல்ல. விசுவாசத்திலிருந்து வராத அனைத்தும் பாவமே.[a]
  rationale: The revision uses a clearer Tamil expression for the perfect passive condemnation and replaces a literal but awkward source-origin expression with idiomatic modern Tamil. It retains the conditional, the causal connection, the comprehensive final statement, the faith terminology, and the Greek passive ambiguity. The footnote is retained and its wording is aligned with the revised main text and anchor placement.
