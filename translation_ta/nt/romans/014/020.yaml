id: ROM.14.20
reference: Romans 14:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: ta
  text: உணவின் பொருட்டு கடவுளின் செயலை இடித்துத் தள்ளாதே. எல்லாமே உண்மையில் தூயவைதான்[a]; ஆனால் இடறலுக்கு வழிவகுக்கும் விதத்தில் உண்கிறவருக்கு அவ்வாறு உண்பது தீமையானது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழல் உணவைப் பற்றியது. ஆகவே, “எல்லா உணவுகளுமே உண்மையில் தூயவைதான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒருவரை இடறச் செய்யும்படி உண்கிறவருக்கு அவ்வாறு உண்பது தீமையானது.” கிரேக்கத் தொடர் யார் இடறுகிறார் என்பதை வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: ambiguity
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: உணவின் பொருட்டு
  rationale: ἕνεκεν உடன் வரும் வேற்றுமை வடிவம் காரணத்தையோ நோக்கத்தையோ குறிக்கிறது. உணவை முன்னிட்டு கடவுளின் செயலைச் சீர்குலைக்கக் கூடாது என்ற எதிர்மறை ஒப்பீட்டை இத்தொடர் இயல்பாகக் காட்டுகிறது.
- source_word: κατάλυε
  choice: இடித்துத் தள்ளாதே
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை தடைச்சொல்லாக உள்ளது. κατάλυε என்பதிலுள்ள கட்டப்பட்ட ஒன்றைத் தகர்க்கும் உருவகத்தை ‘இடித்துத் தள்ளாதே’ தக்கவைக்கிறது.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: கடவுளுடைய செயல்
  rationale: இந்த இறைமரபுத் தொடர் கடவுள் சக விசுவாசியிலும் சமூகத்திலும் செய்து வருவதை உள்ளடக்கக்கூடிய பரந்த பொருளோடு நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: πάντα μὲν καθαρά
  choice: எல்லாமே உண்மையில் தூயவைதான்
  rationale: πάντα என்பதின் பரந்த வடிவம் காக்கப்படுகிறது; சூழலில் அது உணவைக் குறிக்கிறது. μέν-இன் உறுதிப்படுத்தும் நுணுக்கத்தை ‘உண்மையில் ... தான்’ காட்டுகிறது; καθαρά என்பதின் தூய்மை சார்ந்த மொழியும் பாதுகாக்கப்படுகிறது.
- source_word: κακὸν
  choice: தீமையானது
  rationale: κακόν என்பதின் அறநெறி வலிமையை ‘தவறு’ போன்ற மென்மையான சொல்லைவிட ‘தீமையானது’ தெளிவாகக் காக்கிறது.
- source_word: τῷ ἀνθρώπῳ
  choice: உண்கிறவருக்கு
  rationale: ἄνθρωπος இங்கு பொதுவான மனிதரைக் குறிக்கிறது. தமிழில் பாலினத்தைக் கட்டாயமாகச் சேர்க்காமல், பெயரெச்சத் தொடரான ‘உண்கிறவருக்கு’ இயல்பாக அந்தப் பொதுப்பொருளைத் தருகிறது.
- source_word: διὰ προσκόμματος
  choice: இடறலுக்கு வழிவகுக்கும் விதத்தில்
  rationale: πρόσκομμα என்பது இடறச் செய்யும் தடையையோ இடறலுக்கான காரணத்தையோ குறிக்கிறது. உண்பதன் முறை அல்லது விளைவைச் சுட்டும் கிரேக்கத் தொடரை இம்மொழியாக்கம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐσθίοντι
  choice: உண்கிறவருக்கு
  rationale: இந்நிகழ்காலப் பெயரெச்சம் முன்னுள்ள குறிப்புச் சொற்களுடன் சேர்ந்து அப்படிப்பட்ட உண்பவரை அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: ‘தூயவை’ என்ற கூற்றின் பரப்பு மற்றும் உணவுச் சட்டங்களுடனான தொடர்பு
  choice: கிரேக்கத்தில் உள்ள பரந்த ‘எல்லாமே ... தூயவை’ என்ற வடிவத்தைக் காத்து, உணவுச் சூழலை அடிக்குறிப்பில் தெளிவுபடுத்துதல்.
  alternative: ‘எல்லா உணவுகளுமே தூயவை’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: உடனடிச் சூழல் உணவைப் பற்றியது என்றாலும், கிரேக்க மூலத்தில் ‘உணவுகள்’ என்ற பெயர்ச்சொல் இங்கு இல்லை. பரந்த கூற்றையும் தூய்மை மொழியையும் காப்பது விளக்கத்தை மொழிபெயர்ப்புக்குள் அதிகமாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: διὰ προσκόμματος என்பதின் தொடர்பும் இடறலின் திசையும்
  choice: உண்பது இடறலுக்கு வழிவகுக்கும் விதத்தைச் சுட்டுவதாக மொழிபெயர்த்தல்.
  alternative: ‘ஒருவரை இடறச் செய்யும்படி உண்கிறவருக்கு’ என்று இடறுவது வேறொருவர் என வெளிப்படையாகக் கூறுதல்; அல்லது ‘இடறலோடு உண்கிறவருக்கு’ எனச் சுருக்கமாக விடுதல்.
  rationale: ரோமர் 14-ன் சூழலில் மற்றவருக்கு இடறல் உண்டாக்குவது முக்கியமாக உள்ளது. ஆயினும் கிரேக்கத் தொடர் இடறுபவர் யார் என்பதை இவ்வசனத்திலேயே வெளிப்படையாகச் சொல்லாததால், முதன்மை உரை அந்த இடைவெளியை நிரப்பவில்லை.
- issue: τῷ ἀνθρώπῳ என்பதின் பொதுமனிதப் பொருள்
  choice: பாலினத்தைக் குறிப்பிடாத இயல்பான தமிழ் வடிவமான ‘உண்கிறவருக்கு’ என்பதைப் பயன்படுத்துதல்.
  alternative: ‘அந்த மனிதனுக்கு’ என்று இலக்கண ஒருமையைச் சொற்சொல்லாக வெளிப்படுத்துதல்.
  rationale: ἄνθρωπος இங்கு ஆண் ஒருவரை மட்டும் குறிக்காமல் பிரதிநிதித்துவமான பொதுமனிதப் பொருளில் வருகிறது. தமிழ் வடிவம் அந்தப் பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இடித்துத் தள்ளாதே’ என்பது கட்டுமான உருவகத்தை உயிரோட்டமாகக் காக்கிறது; ‘தூயவை’ என்பது சமயத் தூய்மை சார்ந்த மூலமொழி நுணுக்கத்தைப் பாதுகாக்கிறது. ‘கடவுள்’ பொதுவான நவீனத் தமிழ் இறைப்பெயராகப் பயன்படுத்தப்பட்டுள்ளது.
