review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the rhetorical question, the household-slave image, the standing/falling contrast, the future passive in ‘நிலைநிறுத்தப்படுவான்,’ and the final causal assurance. The final Tamil construction ‘ஆண்டவரால் ... முடியும்,’ however, is less direct than the Greek subject construction ‘the Lord is able.’
  naturalness: The verse is generally clear and appropriately dignified in modern standard Tamil. Recasting the final clause as ‘ஆண்டவர் ... வல்லவர்’ is more natural and makes the Lord, as in Greek, the explicit subject of ability.
  terminology: ‘வீட்டு அடிமை’ responsibly retains the bonded household relationship denoted by οἰκέτης. ‘ஆண்டவன்’ in the analogy and ‘ஆண்டவர்’ in the theological clause preserve the lexical echo of κύριος while allowing natural Tamil register. The footnotes appropriately retain the alternative referent of the final ‘ஆண்டவர்.’
  issues:
  - severity: low
    issue: The final clause uses an indirect and somewhat awkward ability construction.
    rationale: ‘ஏனெனில் அவனை நிலைநிறுத்த ஆண்டவரால் முடியும்’ can be understood, but it does not naturally reproduce δυνατεῖ γὰρ ὁ κύριος, where ‘the Lord’ is the grammatical subject. ‘ஏனெனில் ஆண்டவர் அவனை நிலைநிறுத்த வல்லவர்’ is both idiomatic and closer in structure and force.
