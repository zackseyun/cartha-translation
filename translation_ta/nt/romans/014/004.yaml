  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: ta
  text: வேறொருவருடைய வீட்டு அடிமையை[a] நியாயந்தீர்க்க நீ யார்? தன் சொந்த ஆண்டவனுக்கு முன்பாக[b] அவன் நிலைநிற்கிறான் அல்லது விழுகிறான். ஆனால் அவன் நிலைநிறுத்தப்படுவான்; ஏனெனில் ஆண்டவர்[c] அவனை நிலைநிறுத்த வல்லவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீட்டு அடிமை’ என்பதற்குப் பதிலாக ‘வீட்டுப் பணியாளர்’ என்றும் மொழிபெயர்க்கலாம். οἰκέτης என்பது ஒரு வீட்டைச் சேர்ந்த பணியாளரைக் குறிக்கிறது; அக்காலத்தில் அது அடிமையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆண்டவன்’ என்பதற்குப் பதிலாக ‘எஜமான்’ என்றும் மொழிபெயர்க்கலாம். இங்கும் பின்னர் வரும் ‘ஆண்டவர்’ என்பதிலும் கிரேக்கத்தில் κύριος என்ற ஒரே சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: இங்குள்ள ‘ஆண்டவர்’ என்பது வீட்டு அடிமையின் எஜமானை உருவகத்துக்குள் தொடர்ந்து குறிப்பதாகச் சிலர் புரிந்துகொள்கிறார்கள். ஆனால் விசுவாசியை நிலைநிறுத்தும் வல்லமையுள்ள ஆண்டவரை இறையியல் பொருளில் பவுல் குறிப்பிடுவது அதிக சாத்தியம்.
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: நியாயந்தீர்க்க நீ யார்?
  rationale: வலியுறுத்தப்பட்ட σὺ τίς εἶ என்ற வினாவையும், ὁ κρίνων என்பதன் கண்டிக்கும் தொனியையும் இயல்பான நவீன தமிழில் நேரடியாகக் காக்கிறது.
- source_word: ἀλλότριον οἰκέτην
  choice: வேறொருவருடைய வீட்டு அடிமையை
  rationale: οἰκέτης என்பது வீட்டைச் சேர்ந்த பணியாள் அல்லது அடிமையைக் குறிக்கிறது. பிணைக்கப்பட்ட சமூக உறவை மறைக்காமல் இருக்க ‘வீட்டு அடிமை’ பயன்படுத்தப்பட்டுள்ளது; ἀλλότριον என்பதன் உடைமைத் தொடர்பு ‘வேறொருவருடைய’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: தன் சொந்த ஆண்டவனுக்கு முன்பாக
  rationale: தத்திவேற்றுமை இங்கு அவன் யாருக்குப் பொறுப்புள்ளவன் என்ற தொடர்பைக் காட்டுகிறது. ‘முன்பாக’ என்பது அந்தப் பொறுப்புறுதலை இயல்பாக வெளிப்படுத்துகிறது; ‘ஆண்டவன்’ என்பது பின்னர் வரும் ‘ஆண்டவர்’ என்பதுடனான κύριος சொல்லிணைப்பையும் ஓரளவு காக்கிறது.
- source_word: στήκει ἢ πίπτει
  choice: அவன் நிலைநிற்கிறான் அல்லது விழுகிறான்
  rationale: நிற்றல்–விழுதல் என்ற எதிரிணை உருவகத்தை விளக்கிச் சுருக்காமல் காக்கிறது. στήκω என்பதிலுள்ள உறுதியாய் நிற்றல் என்ற நுட்பத்தை ‘நிலைநிற்கிறான்’ வெளிப்படுத்துகிறது.
- source_word: σταθήσεται
  choice: அவன் நிலைநிறுத்தப்படுவான்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைத் தெளிவாகக் காத்து, அடுத்த கூறில் வெளிப்படும் ஆண்டவரின் செயற்பாட்டை முன்குறிக்கிறது.
- source_word: δυνατεῖ γὰρ ὁ κύριος
  choice: ஏனெனில் ... ஆண்டவரால் முடியும்
  rationale: γάρ தரும் காரணத் தொடர்பையும் δυνατέω குறிக்கும் ஆற்றலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: στῆσαι αὐτόν
  choice: அவனை நிலைநிறுத்த
  rationale: σταθήσεται என்பதுடனான வேர்ச்சொல் தொடர்பையும் காரணவினைப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள ὁ κύριος யாரைக் குறிக்கிறது?
  choice: இறையியல் பொருளில் ‘ஆண்டவர்’
  alternative: வீட்டு அடிமை உருவகத்திலுள்ள அவனுடைய மனித ஆண்டவன்
  rationale: பவுல் வீட்டு அடிமை உருவகத்திலிருந்து விசுவாசியை நிலைநிறுத்த வல்ல ஆண்டவரின் ஆற்றலுக்குச் செல்கிறார் என்பது சூழலில் அதிக சாத்தியம். ஆயினும் ஒரே κύριος சொல் இரு இடங்களிலும் வருவதால் உருவகத் தொடர்பும் மாற்று வாசிப்பும் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வீட்டு அடிமை’ வரலாற்றிலிருந்த பிணைக்கப்பட்ட நிலையை மறைக்காது; ‘நிலைநிற்கிறான்/நிலைநிறுத்தப்படுவான்/நிலைநிறுத்த’ என்ற மீளுரைகள் கிரேக்கத்தின் சொல்லிணைப்பைத் தெளிவாகக் காக்கின்றன.
