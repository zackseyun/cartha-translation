  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: ta
  text: ஒருவர் எல்லாவற்றையும் உண்ணலாம் என்று நம்புகிறார்[a]; ஆனால் பலவீனமானவர்[b] காய்கறிகளை உண்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எல்லாவற்றையும் உண்ணலாம் என்று உறுதியாக நம்புகிறார்.’
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘பலவீனமானவர்’ என்பது உணவுப் பழக்கங்கள் குறித்த விசுவாசம் அல்லது மனச்சாட்சியில் பலவீனமானவரைச் சூழலின்படி குறிக்கிறது (ரோமர் 14:1 பார்க்க).
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: ஒருவர்
  rationale: முதல் தரப்பை அறிமுகப்படுத்தும் பிரதிநிதித்துவ ஒருமையை இயல்பான தமிழில் தருகிறது; பாலினத்தைத் தேவையின்றிக் குறிப்பிடாமல், அடுத்த தரப்புடனான முரண்பாட்டையும் காக்கிறது.
- source_word: πιστεύει
  choice: நம்புகிறார்
  rationale: இங்கு இது இரட்சிப்புக்குரிய விசுவாசத்தை அல்ல, உணவு குறித்த ஒருவரின் நம்பிக்கையையோ உறுதியையோ குறிக்கிறது. மூலச்சொல்லின் அடிப்படைத் தொடர்பைக் காக்க ‘நம்புகிறார்’ பயன்படுத்தப்பட்டுள்ளது; ‘உறுதியாக நம்புகிறார்’ என்பது சாத்தியமான மாற்று.
- source_word: φαγεῖν πάντα
  choice: எல்லாவற்றையும் உண்ணலாம்
  rationale: உணவு வகைகளில் கட்டுப்பாடு இல்லை என்ற சூழல்சார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. அனுமதி அல்லது மனச்சாட்சி சார்ந்த சுதந்திரம் இங்கு உட்கருத்தாக இருப்பதால் ‘உண்ணலாம்’ பொருத்தமானது.
- source_word: ὁ δὲ
  choice: ஆனால் …வர்
  rationale: வாக்கியத்தின் இரண்டாம், முரண்பட்ட தரப்பைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ἀσθενῶν
  choice: பலவீனமானவர்
  rationale: இது பெயர்ச்சொல் தன்மையில் வரும் பங்கேற்புவினை. வசனத்தில் உள்ள மதிப்பீட்டுச் சொல்லை விரிவாக்காமல் காக்கிறது; உடல் பலவீனம் என்று மொழிபெயர்ப்பிலேயே முடிவு செய்யவில்லை.
- source_word: λάχανα
  choice: காய்கறிகளை
  rationale: தோட்டப் பயிர்களையோ காய்கறிகளையோ குறிக்கும் சொல்லுக்கு, இன்றைய பொதுத் தமிழில் தெளிவான இணைச்சொல்.
- source_word: ἐσθίει
  choice: உண்கிறார்
  rationale: கிரேக்க வினை கூறுவதை நேரடியாகத் தருகிறது. ‘காய்கறிகளை மட்டுமே’ என்பது சூழலில் உட்குறிப்பாக இருந்தாலும் ‘மட்டுமே’ மூலத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ἀσθενῶν என்பதில் பலவீனத்தின் தன்மை
  choice: ‘பலவீனமானவர்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘விசுவாசத்தில் பலவீனமானவர்’
  rationale: ரோமர் 14:1 உணவு நடைமுறைகள் தொடர்பான விசுவாசம் அல்லது மனச்சாட்சியின் பலவீனம் என்ற சூழலை அளிக்கிறது. ஆனால் இவ்வசனம் ‘பலவீனமானவர்’ என்று மட்டுமே சொல்வதால், விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘உண்ணலாம்’ உணவு குறித்த அனுமதி/உறுதியின் சூழல்சார் பொருளை இயல்பாகத் தருகிறது; ‘மட்டுமே’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத வலியுறுத்தல் தவிர்க்கப்பட்டுள்ளது.
