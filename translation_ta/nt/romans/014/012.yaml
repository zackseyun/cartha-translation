  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: ta
  text: ஆகவே, நம்மில் ஒவ்வொருவரும் தன்னைப் பற்றிக் கணக்குக் கொடுப்பார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன்னைக் குறித்து’ என்றும், பொருள் வழக்கில் ‘தனக்காக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொற்படியாக ‘தன்னைப் பற்றி’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: ἕκαστος ἡμῶν
  choice: நம்மில் ஒவ்வொருவரும்
  rationale: ἕκαστος என்பதன் தனித்தனியான பகிர்வுப் பொருளையும் ἡμῶν என்பதன் ‘நம்மில்’ என்ற பகுதி உறவையும் தெளிவாகக் காக்கிறது.
- source_word: περὶ ἑαυτοῦ
  choice: தன்னைப் பற்றி
  rationale: περί + பிறப்புவேற்றுமையின் ‘தன்னைக் குறித்து/தன்னைப் பற்றி’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; ஒருமைத் தற்சுட்டுப் பெயரையும் காக்கிறது.
- source_word: λόγον
  choice: கணக்கு
  rationale: λόγον δώσει என்ற மரபுத்தொடரில் மதிப்பீடு அல்லது தீர்ப்பின் முன் அளிக்கப்படும் ‘கணக்கு’ என்பதே பொருத்தமான பொருள்; வெறும் ‘சொல்’ அல்ல.
- source_word: δώσει
  choice: கொடுப்பார்
  rationale: எதிர்காலச் செயலைக் காக்கிறது; ‘கணக்குக் கொடு’ என்பது தமிழில் இயல்பான மரபுத்தொடர்.
theological_decisions:
- issue: தனிநபர் பொறுப்பைக் குறிக்கும் ஒருமைத் தற்சுட்டுப் பெயர்
  choice: தன்னைப் பற்றி
  alternative: தங்களைப் பற்றி / தனக்காக
  rationale: கிரேக்க வாசகம் ஒவ்வொருவரையும் தனித்தனியாக ஒருமையில் சுட்டுகிறது. தமிழ் ‘தன்னை’ பாலினத்தைத் தேவையின்றி சேர்க்காமல் அந்த ஒருமைத் தனிநபர் பொறுப்பைக் காக்கிறது.
- issue: கணக்கு யாரிடம் கொடுக்கப்படுகிறது என்பது
  choice: பெறுபவரை உரையில் சேர்க்கவில்லை
  alternative: கடவுளிடம் கணக்குக் கொடுப்பார்
  rationale: வழங்கப்பட்ட SBLGNT வாசகத்தில் கணக்கைப் பெறுபவரைக் குறிக்கும் சொற்றொடர் இல்லை. சூழலில் அது புரிந்தாலும், இவ்வசனத்தின் வழங்கப்பட்ட மூல உரைக்குள் அதை வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘கணக்குக் கொடுப்பார்’ என்ற இயல்பான தமிழ் மரபுத்தொடர் λόγον δώσει என்பதன் மதிப்பீட்டு நுணுக்கத்தைத் தருகிறது; ‘தன்னை’ என்பது பிரதிநிதித்துவ ஒருமையை இயல்பாக வெளிப்படுத்துகிறது.
