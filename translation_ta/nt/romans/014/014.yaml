id: ROM.14.14
reference: Romans 14:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: ta
  text: ஆண்டவர் இயேசுவுக்குள், எதுவும் தன்னிலேயே தீட்டானது[a] அல்ல என்று நான் அறிந்தும் உறுதியாக நம்பியும் இருக்கிறேன்; ஆயினும், ஒருவர் எதையாவது தீட்டானது என்று கருதினால், அவருக்கு அது தீட்டானதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொதுவானது.’ இச்சூழலில் இக்கிரேக்கச் சொல் சடங்குரீதியாகத் தீட்டுப்பட்டதாக அல்லது புனிதமற்றதாகக் கருதப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: நான் அறிந்து
  rationale: அறிவை நேரடியாகக் குறிக்கும் வினை; அடுத்த வினையுடன் இயல்பான தமிழ்த் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: πέπεισμαι
  choice: உறுதியாக நம்புவது
  rationale: நிலைத்த, தீர்மானமான நம்பிக்கையைக் குறிக்கும் நிறைவுநிலைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: ஆண்டவர் இயேசுவுக்குள்
  rationale: ἐν என்பதன் உறவை ‘மூலமாக’ அல்லது ‘இயேசு எனக்கு அறிவித்தார்’ என்று மிகையாக விளக்காமல், மூலத்தின் அமைப்பையும் தெளிவின்மையையும் காக்கிறது.
- source_word: κοινόν
  choice: தீட்டானது
  rationale: இங்கு ‘பொதுவானது’ என்ற சாதாரண பொருள் அல்லாமல், தூய்மைச் சூழலில் விலக்கப்பட்ட அல்லது சடங்குரீதியாகத் தூய்மையற்றதாகக் கருதப்படுவதைக் குறிக்கிறது. நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δι’ ἑαυτοῦ
  choice: தன்னிலேயே
  rationale: ஒரு பொருளின் இயல்பிலேயே அல்லது உள்ளார்ந்த நிலையில் என்பதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: τῷ λογιζομένῳ
  choice: கருதுகிறவருக்கு
  rationale: λογίζομαι இங்கு ஒன்றை ஒரு குறிப்பிட்ட விதமாக மதிப்பிடுதல் அல்லது எண்ணுதல் என்ற அறிவுசார் பொருளைக் கொண்டுள்ளது.
- source_word: τι
  choice: எதையாவது
  rationale: பொதுவான நியதிக்குள் குறிப்பிடப்படாத எந்தவொரு பொருளையும் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐκείνῳ κοινόν
  choice: அது தீட்டானதே
  rationale: அந்த நபருக்குரிய பொருந்துதலை முந்தைய ‘கருதுகிறவருக்கு’ என்பதுடன் இணைத்துக் காட்டுகிறது; இறுதி ஏகாரம் வாக்கியத்தின் தனிப்பட்ட வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: κοινός என்ற சொல்லின் தூய்மை சார்ந்த பொருள்
  choice: ‘தீட்டானது’ என்று மொழிபெயர்த்து, எதுவும் உள்ளார்ந்த விதத்தில் தீட்டானது அல்ல என்ற கூற்றையும், ஒருவரின் கருதுதலின்படி அவருக்கு அது தீட்டானதாக இருப்பதையும் அப்படியே வைத்தல்.
  alternative: ‘பொதுவானது’ அல்லது ‘புனிதமற்றது’
  rationale: ரோமர் 14-ன் உணவு மற்றும் மனச்சாட்சி சூழலில் ‘தீட்டானது’ என்பது வாசகருக்கு நோக்கப்பட்ட பொருளைத் தெளிவாகக் கூறுகிறது. அதேவேளையில், கடைசி கூற்று வெறும் உளவியல் உணர்வு மட்டுமே என்று விளக்காமல் அதன் இறையியல் அழுத்தத்தையும் பதற்றத்தையும் காக்கிறது.
- issue: ἐν κυρίῳ Ἰησοῦ என்பதன் உறவு
  choice: ‘ஆண்டவர் இயேசுவுக்குள்’ என்று வடிவத்தைப் பாதுகாத்தல்.
  alternative: ‘ஆண்டவர் இயேசுவினால்’ அல்லது ‘ஆண்டவர் இயேசுவோடு ஒன்றிணைந்த நிலையில்’
  rationale: கிரேக்க முன்னிடைச்சொல் அறிவின் மூலம், அதிகாரம், அல்லது கிறிஸ்துவுடனான உறவு ஆகியவற்றில் ஒன்றை மட்டும் வெளிப்படையாகத் தீர்மானிக்கவில்லை; ஆகவே மொழிபெயர்ப்பும் அந்தத் திறந்த தன்மையை வைத்திருக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் அமைந்தாலும் மரியாதையும் பவுலின் வாதத்தின் வலிமையும் காக்கப்பட்டுள்ளன. ‘ஆண்டவர் இயேசுவுக்குள்’ என்பது சற்று செறிவான வேதாகமச் சொற்றொடராக இருந்தாலும், மூலத்தின் உண்மையான பொருள்-திறப்பை பாதுகாப்பதற்காகத் தேர்ந்தெடுக்கப்பட்டது.
