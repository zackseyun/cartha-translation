revisions:
- from: 'ஆண்டவர் இயேசுவுக்குள் நான் அறிந்து, உறுதியாக நம்புவது இதுதான்: எதுவும் தன்னிலேயே தீட்டானது[a] அல்ல; ஆனால் எதையாவது தீட்டானது என்று கருதுகிறவருக்கு, அது தீட்டானதே.'
  to: ஆண்டவர் இயேசுவுக்குள், எதுவும் தன்னிலேயே தீட்டானது[a] அல்ல என்று நான் அறிந்தும் உறுதியாக நம்பியும் இருக்கிறேன்; ஆயினும், ஒருவர் எதையாவது தீட்டானது என்று கருதினால், அவருக்கு அது தீட்டானதே.
