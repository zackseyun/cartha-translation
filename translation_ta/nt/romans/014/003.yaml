id: ROM.14.3
reference: Romans 14:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: ta
  text: சாப்பிடுகிறவர் சாப்பிடாதவரை இகழக் கூடாது[a]; சாப்பிடாதவரும் சாப்பிடுகிறவரைத் தீர்ப்பிடக் கூடாது[b]. ஏனெனில், கடவுள் அவரை ஏற்றுக்கொண்டார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அற்பமாக எண்ணக் கூடாது” அல்லது “அவமதிக்கக் கூடாது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவரைப் பற்றி நியாயத் தீர்ப்பு வழங்கக் கூடாது.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வரவேற்றார்” அல்லது “தம்மோடு சேர்த்துக்கொண்டார்.” இவ்வினை உறவுக்குள் வரவேற்று ஏற்றுக்கொள்ளும் பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: சாப்பிடுகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் ஒரு வகை நபரைக் குறிக்கும் வகையில் தருகிறது.
- source_word: τὸν μὴ ἐσθίοντα
  choice: சாப்பிடாதவரை
  rationale: சாப்பிடுகிறவர்/சாப்பிடாதவர் என்ற கிரேக்க இணைமுரணை நேரடியாகப் பேணுகிறது; எதைச் சாப்பிடவில்லை என்று வசனம் கூறாததால் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ἐξουθενείτω
  choice: இகழக் கூடாது
  rationale: ஒருவரை அற்பமாக எண்ணி அவமதிக்கும் வலுவான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: சாப்பிடாதவரும்
  rationale: δέ குறிக்கும் எதிரிணையை தமிழின் ‘-உம்’ இணைப்பால் இயல்பாகவும் இணையான கட்டமைப்புடனும் வெளிப்படுத்துகிறது.
- source_word: κρινέτω
  choice: தீர்ப்பிடக் கூடாது
  rationale: மற்றொருவரைப் பற்றி நியாயத் தீர்ப்பு வழங்கும் பொருளைப் பேணுகிறது; ‘குற்றவாளியாகத் தீர்க்க’ என்று குறுக்காமல் பரந்த பொருளை வைத்திருக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: இறைவனைச் சுட்டும் பொதுவான, நவீன தரத் தமிழ்ச் சொல்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய இரு தடைகளுக்கும் காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: ஒருமைச் சுட்டுப்பெயரைப் பேணுவதோடு தமிழில் மனிதரைக் குறிப்பிடும் மரியாதையான இயல்பான வடிவத்தைப் பயன்படுத்துகிறது; அதன் குறிப்பீட்டைத் தேவையின்றித் தீர்மானிக்கவில்லை.
- source_word: προσελάβετο
  choice: ஏற்றுக்கொண்டார்
  rationale: ஒருவரைத் தம்மோடு சேர்த்துக்கொண்டு வரவேற்கும் தொடர்புசார் பொருளைத் தருகிறது; தமிழ் வேதாகம நடையிலும் பொதுப் பயன்பாட்டிலும் இயல்பானது.
theological_decisions:
- issue: சாப்பிடுதல்/சாப்பிடாமை என்ற முரணின் வரம்பு
  choice: வசனம் கூறுகிறபடியே பொதுவாக ‘சாப்பிடுகிறவர்’ மற்றும் ‘சாப்பிடாதவர்’ என்று மொழிபெயர்த்தல்
  alternative: எல்லா உணவுகளையும் உண்பவர் மற்றும் சில உணவுகளைத் தவிர்ப்பவர் என்று வெளிப்படையாக விளக்குதல்
  rationale: சுற்றுப்பகுதி உணவுப் பழக்கங்களைப் பற்றிய சர்ச்சையை விளக்கினாலும், இவ்வசனம் உணவின் வகையையோ தவிர்ப்பின் காரணத்தையோ குறிப்பிடவில்லை. ஆகவே மூலத்தின் பொதுவான சொல்லாட்சியே பேணப்படுகிறது.
- issue: ‘அவரை’ என்பதன் குறிப்பீடு
  choice: ஒருமைச் சுட்டுப்பெயரை அப்படியே வைத்திருத்தல்
  alternative: அது குறிப்பாகச் சாப்பிடுகிறவரை மட்டுமே குறிக்கிறது என்று வெளிப்படுத்துதல் அல்லது ‘அந்த நபரை’ என்று மாற்றுதல்
  rationale: உடனடி இலக்கண முன்னோடி சாப்பிடுகிறவர் என்றாலும், பரஸ்பர அறிவுறுத்தலின் விரிந்த தர்க்கம் இரு தரப்பினருக்கும் பொருந்துகிறது. கிரேக்கத்தின் ஒருமையையும் அதன் உண்மையான குறிப்பீட்டு நெகிழ்வையும் மொழிபெயர்ப்பு பேணுகிறது.
- issue: προσελάβετο என்பதன் தொடர்புசார் இறையியல் நுணுக்கம்
  choice: ‘ஏற்றுக்கொண்டார்’ என்று முதன்மை உரையில் வைத்து, வரவேற்றல்/உறவுக்குள் சேர்த்துக்கொள்ளுதல் என்ற நுணுக்கத்தை அடிக்குறிப்பில் தருதல்
  alternative: ‘வரவேற்றார்’ என்று முதன்மை உரையில் மொழிபெயர்த்தல்
  rationale: இரு தமிழ்ச் சொற்களும் சாத்தியம். ‘ஏற்றுக்கொண்டார்’ இயல்பாகவும் பரவலாகவும் புரியும்; அடிக்குறிப்பு இந்த வினையின் வெறும் ஒப்புதல் அல்லாத, உறவுக்குள் வரவேற்கும் பொருளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. இணையான இரு தடைகளும் தெளிவாகப் பேணப்பட்டுள்ளன. ‘சாப்பிடு’ என்பது இன்றைய இயல்பான பொதுத் தமிழ்; ‘புசி’ போன்ற பழைய அல்லது வழிபாட்டு நடையைத் தவிர்க்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
