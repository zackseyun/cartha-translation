  source_fidelity: 'மூலக் கிரேக்கத்தின் இணையான இரு அறிவுறுத்தல்களும் துல்லியமாகப் பேணப்பட்டுள்ளன: சாப்பிடுகிறவர் சாப்பிடாதவரை இகழக்கூடாது; சாப்பிடாதவர் சாப்பிடுகிறவரைத் தீர்ப்பிடக்கூடாது. γάρ-இன் காரணத் தொடர்பும், προσελάβετο-வின் நிறைவுற்ற செயல் உணர்வும் ‘ஏனெனில்’ மற்றும் ‘ஏற்றுக்கொண்டார்’ மூலம் சரியாகத் தரப்பட்டுள்ளன. ‘அவரை’ என்பது மூலத்தின் தீர்மானிக்கப்படாத ஒருமைக் குறிப்பீட்டைத் தேவையின்றி வரையறுக்கவில்லை.'
