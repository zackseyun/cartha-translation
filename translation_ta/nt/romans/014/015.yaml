  terminology: ‘உணவு,’ ‘சகோதரன்,’ ‘அன்பின்படி,’ ‘மெசியா,’ மற்றும் ‘அழித்துவிடாதே’ ஆகிய தேர்வுகள் பொருத்தமானவை. ‘அழித்துவிடாதே’ ἀπόλλυε-யின் வலிமையைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் இறையியல் விளைவைத் தீர்மானிக்காமல் சரியாக விளக்குகிறது.
