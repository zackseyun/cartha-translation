  source_fidelity: 'முதன்மைக் கருத்து மூலக் கிரேக்கத்துக்கு உண்மையாக உள்ளது: உணவினால் ஏற்படும் துயரம், அன்பின்படியான நடத்தை, அழிக்க வேண்டாம் என்ற கடுமையான தடை, மற்றும் மெசியாவின் மரணம் ஆகியவை சரியாக வெளிப்படுகின்றன. ஆனால் ἀδελφός-க்கான அடிக்குறிப்பு குறியீடு உரையில் தவறான இடத்தில் உள்ளது; அது ‘சகோதரன்’ என்பதோடு இணைக்கப்பட வேண்டும்.'
