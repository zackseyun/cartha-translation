id: ROM.14.15
reference: Romans 14:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: ta
  text: ஏனெனில், உணவின் காரணமாக உன் சகோதரன்[a] மனவேதனை அடைந்தால், நீ இனி அன்பின்படி நடப்பதில்லை. உன் உணவினால் அவனை அழித்துவிடாதே[b]—அவனுக்காகவே மெசியா[c] இறந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரன்’ என்பதற்கு ‘சகோதரன் அல்லது சகோதரி’ என்றும் பொருள் கொள்ளலாம்; கிரேக்கச் சொல் உடன் விசுவாசி ஒருவரைப் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சீரழித்துவிடாதே’ அல்லது ‘அழிவுக்குள்ளாக்காதே.’ கிரேக்க வினைச்சொல் கடுமையான ஆவிக்குரிய தீங்கைக் குறிக்கலாம்; அதன் துல்லியமான இறையியல் விளைவை இவ்வசனம் குறிப்பிடவில்லை.
    reason: alternative_reading
  - marker: c
    text: கிரேக்கத்தில் ‘கிறிஸ்து’; Χριστός இங்கு பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: உணவு / உன் உணவினால்
  rationale: இச்சொல் இங்கே இறைச்சியை மட்டும் அல்லாமல் பொதுவாக உணவைக் குறிக்கிறது. வேற்றுமை உருபின் கருவிப்பொருளை ‘உன் உணவினால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀδελφός
  choice: சகோதரன்
  rationale: கிரேக்கச் சொல் ஆண்பால் ஒருமையில் இருப்பதால் அதை முதன்மை உரையில் தக்கவைத்துள்ளோம்; உடன் விசுவாசிக்கும் பெண்ணையும் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λυπεῖται
  choice: மனவேதனை அடைந்தால்
  rationale: சோகம், வருத்தம் அல்லது உள்ளார்ந்த வேதனைக்கு ஆளாவதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; பாதிப்பின் துல்லிய தன்மையை மிகையாக வரையறுக்கவில்லை.
- source_word: κατὰ ἀγάπην
  choice: அன்பின்படி
  rationale: κατά என்பதன் அளவுகோல் அல்லது நெறிக்கு ஏற்ப என்ற பொருளையும் ἀγάπη என்பதன் ‘அன்பு’ என்ற பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: περιπατεῖς
  choice: நடக்கிறவன்
  rationale: பவுலின் ஒழுக்கவாழ்வைக் குறிக்கும் ‘நடத்தல்’ உருவகத்தைத் தக்கவைக்கிறது; தமிழில் வாக்கியத்தோடு இயல்பாக அமைய பயனிலை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀπόλλυε
  choice: அழித்துவிடாதே
  rationale: வினைச்சொல்லின் கடுமையான எச்சரிக்கையைப் பாதுகாக்கிறது; இது தற்காலிக ஆவிக்குரிய சீரழிவா அல்லது இறுதி அழிவா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: ὑπὲρ οὗ
  choice: அவனுக்காகவே
  rationale: ‘அவனுக்காக’ என்பது பிரதிநிதித்துவ அல்லது பலிசார்ந்த நுணுக்கத்தை இயல்பாகத் தருகிறது; ‘வே’ தனிநபர்மீது உள்ள வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: Χριστός
  choice: மெசியா
  rationale: இங்கு Χριστός பட்டமாகச் செயல்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀπέθανεν
  choice: இறந்தார்
  rationale: இறப்பைக் குறிக்கும் இறந்தகால வினையை நேரடியாகவும், மெசியாவைக் குறிக்கும் மரியாதை ஒருமையுடனும் வழங்குகிறது.
- source_word: ἐκεῖνον
  choice: அவனை
  rationale: தமிழில் இயல்பான சுட்டுப்பெயர்; அடுத்துள்ள ‘அவனுக்காகவே’ என்பதன் வலியுறுத்தல் கிரேக்கச் சுட்டின் தனிநபர் மையத்தை வெளிப்படுத்துகிறது.
- source_word: εἰ γὰρ
  choice: ஏனெனில், ... அடைந்தால்
  rationale: γάρ முந்தைய வாதத்துடனான காரணத் தொடர்பையும் εἰ நிபந்தனை அமைப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀπόλλυε என்பதன் வலிமையும் பலவீனமான விசுவாசியின் முடிவும்
  choice: ‘அழித்துவிடாதே’ என்ற கடுமையான எச்சரிக்கை
  alternative: ‘சீரழித்துவிடாதே’ அல்லது ‘அழிவுக்குள்ளாக்காதே’
  rationale: வினைச்சொல் கடுமையானது; ஆனால் வசனம் நித்திய அழிவையா, கடுமையான ஆவிக்குரிய சேதத்தையா குறிப்பிடுகிறது என்பதைத் துல்லியமாகத் தீர்மானிக்கவில்லை. ஆகவே இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
- issue: ἀδελφός என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘சகோதரன்’
  alternative: ‘சகோதரன் அல்லது சகோதரி’ / ‘உடன் விசுவாசி’
  rationale: மூலத்தின் ஆண்பால் ஒருமை தக்கவைக்கப்படுகிறது; திருச்சபையின் பிற விசுவாசிகளுக்கும் பிரதிநிதித்துவமாகப் பொருந்தக்கூடிய விரிவு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அது வெறும் பெயர்போல அல்லாமல் பட்டமாகச் செயல்படுகிறது; எனவே பட்டத்தின் பொருள் முன்னிலைப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமான நடை. பவுலின் ‘நடத்தல்’ உருவகம் தக்கவைக்கப்பட்டுள்ளது. ஆண்பால் ஒருமையும் அழிவைக் குறிக்கும் வினையின் இறையியல் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன. ஒவ்வொரு அடிக்குறிப்பு குறியீடும் முதன்மை உரையில் இடம்பெறுகிறது.
