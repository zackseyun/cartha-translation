id: ROM.14.13
reference: Romans 14:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: ta
  text: 'ஆகவே, இனி நாம் ஒருவரையொருவர் நியாயந்தீர்க்காமல் இருப்போம். மாறாக, இதையே தீர்மானியுங்கள்: ஒரு சகோதரரின்[a] வழியில் இடறற்கல்லையோ கண்ணியையோ[b] வைக்காதிருப்போம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு சகோதரரின் அல்லது சகோதரியின்’; கிரேக்கத்தில் ‘சகோதரர்’ என்பது ஒருமையில் உள்ளது; இங்கு அது உடன்விசுவாசியைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘விழுவதற்கான காரணத்தையோ’ அல்லது ‘தடையையோ’; இது ஒருவரின் உணர்வைப் புண்படுத்துவதை மட்டும் குறிக்காமல், அவரைத் தவறில் அல்லது பாவத்தில் இடறச் செய்யக்கூடிய ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: ஆகவே, இனி ... இல்லாமல் இருப்போம்
  rationale: οὖν முந்தைய வாதத்திலிருந்து வரும் முடிவைக் குறிக்கிறது; μηκέτι தொடர்ந்த பழக்கத்தை நிறுத்துமாறு வலியுறுத்துகிறது.
- source_word: ἀλλήλους κρίνωμεν
  choice: நாம் ஒருவரையொருவர் நியாயந்தீர்க்காமல் இருப்போம்
  rationale: முதல் நபர் பன்மை அறிவுரைத் துணைவினையின் அழைப்புத் தொனியை இயல்பான தமிழில் தருகிறது; κρίνω என்பதன் தீர்ப்பிடும் பொருளையும் காக்கிறது.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: மாறாக, ... என்று தீர்மானியுங்கள்
  rationale: κρίνω என்ற வினையின் இரண்டாம் பயன்பாடு இங்கு பிறரைத் தீர்ப்பிடுவதைக் காட்டாமல், தமது நடத்தையைப் பற்றிய உறுதியான முடிவைக் குறிக்கிறது; μᾶλλον-ன் எதிர்மாற்று வலிமை ‘மாறாக’ என்பதில் வெளிப்படுகிறது.
- source_word: τὸ μὴ τιθέναι
  choice: வைக்கக் கூடாது என்று
  rationale: இந்த articular infinitive, எதைத் தீர்மானிக்க வேண்டும் என்பதன் உள்ளடக்கத்தைத் தருகிறது; தமிழில் தடைப் பொருளுடன் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: πρόσκομμα
  choice: இடற வைக்கும் தடை
  rationale: ஒருவரின் ஆன்மீக அல்லது ஒழுக்க நடையில் இடறலை உண்டாக்கும் தடையைக் குறிக்கும் உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: τῷ ἀδελφῷ
  choice: ஒரு சகோதரருக்கு முன்பாக
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமையை முதன்மை உரையில் காக்கிறது; இச்சூழலில் உடன்விசுவாசியைப் பொதுவாகக் குறிக்கும் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: σκάνδαλον
  choice: பாவத்தில் விழச் செய்யும் கண்ணி
  rationale: வெறும் மனவருத்தம் அல்லாமல், மற்றொருவரைத் தவறிலும் பாவத்திலும் சிக்கவைக்கும் காரணம் என்ற நெறிசார் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது; கண்ணி என்ற உருவகமும் காக்கப்படுகிறது.
theological_decisions:
- issue: ἀδελφῷ என்ற ஆண்பால் ஒருமையின் பிரதிநிதித்துவப் பயன்பாடு
  choice: சகோதரர்
  alternative: சகோதரர் அல்லது சகோதரி; உடன்விசுவாசி
  rationale: மூலத்தின் இலக்கண வடிவம் முதன்மை உரையில் காக்கப்படுகிறது; இங்கு அது பொதுவாக சக விசுவாசியைக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: σκάνδαλον என்பதன் நெறிசார் பொருள்
  choice: பாவத்தில் விழச் செய்யும் கண்ணி
  alternative: விழுவதற்கான காரணம்; இடறல்
  rationale: இது உணர்வைப் புண்படுத்துவதை மட்டும் அல்லாமல், மற்றொருவரைப் பாவத்தில் சிக்கவைக்கும் காரணத்தைக் குறிக்கிறது. πρόσκομμα உடன் உள்ள நெருங்கிய பொருள் தொடர்பையும் தனித்த கண்ணி உருவகத்தையும் இந்த மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் அறிவுரைத் தொனியும் பேணப்பட்டுள்ளன. ‘நியாயந்தீர்க்க’ என்பது பவுலின் κρίνω/κρίνατε சொல்விளையாட்டின் தொடர்பை ஓரளவு காக்க, இரண்டாவது பயன்பாடு இயல்பாக ‘தீர்மானியுங்கள்’ என வேறுபடுத்தப்பட்டுள்ளது. இரண்டு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
