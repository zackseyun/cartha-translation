  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: ta
  text: ஏனெனில், நம்மில் எவரும் தனக்காக வாழ்வதில்லை[a]; எவரும் தனக்காக இறப்பதுமில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தனக்கு.’ கிரேக்கத் தற்சுட்டு நான்காம் வேற்றுமையை இவ்வாறு இன்னும் சொற்சார்ந்து மொழிபெயர்க்கலாம்; ஆனால் இங்கே ஒருவர் தன்னையே இறுதி நோக்கமாகக் கொண்டு வாழ்வதையோ இறப்பதையோ குறிக்கும் வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: எவரும் ... இல்லை
  rationale: இரு வாக்கியக் கூறுகளிலும் உள்ள முழுமையான மறுப்பை இயல்பான தமிழ் எதிர்மறை அமைப்பில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கமாக இவ்வசனம் வருவதைக் காட்டும் காரண/விளக்க இணைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἡμῶν
  choice: நம்மில்
  rationale: οὐδεὶς உடன் வரும் பகுதி மரபுவேற்றுமையை இயல்பாக ‘நம்மில் எவரும்’ என்று வழங்குகிறது.
- source_word: ἑαυτῷ
  choice: தனக்காக
  rationale: ஒருவர் தம்மையே இறுதி நோக்கமாகக் கொண்டு வாழ்வதையோ இறப்பதையோ குறிக்கும் வாய்ப்பை இயல்பாக வெளிப்படுத்துகிறது; ‘தனக்கே’ என்பது சொற்சார்ந்த மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ζῇ
  choice: வாழ்வதில்லை
  rationale: பவுல் கூறும் பொதுவான உண்மையைத் தமிழில் இயல்பான நிகழ்கால எதிர்மறை வடிவில் காட்டுகிறது.
- source_word: καὶ
  choice: -உம்
  rationale: இரண்டாம் இணை வாக்கியத்தில் ‘இறப்பதுமில்லை’ என்ற இணைப்பியல் விகுதி கிரேக்க καὶ-யின் கூட்டிணைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀποθνῄσκει
  choice: இறப்பதுமில்லை
  rationale: ζῇ என்பதுடனான இணை அமைப்பையும் பொதுவான உண்மை என்ற பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இரு இடங்களிலும் வரும் ἑαυτῷ என்ற தற்சுட்டு நான்காம் வேற்றுமையின் பொருள்
  choice: தனக்காக
  alternative: தனக்கே
  rationale: அடுத்த வசனத்தில் வெளிப்படும் ஆண்டவரை நோக்கிய வாழ்வு/இறப்பு என்ற பின்னணியில், தன்னையே நோக்கமாகக் கொள்வது என்ற பொருளை இது இயல்பாகத் தருகிறது. அதேவேளையில், கிரேக்க வடிவின் ‘தனக்கே’ என்ற தொடர்பு சார்ந்த வாசிப்பை அடிக்குறிப்பு மூலம் திறந்துவைக்கிறது.
- issue: கிரேக்க ஒருமை ஆண்பால் தற்சுட்டின் தமிழ் வெளிப்பாடு
  choice: தனக்காக
  alternative: அவனுக்காகவே
  rationale: தமிழின் ‘தன்’ பொதுப்பாலாகவும் வாக்கிய எழுவாயைத் திரும்பச் சுட்டுவதாகவும் இருப்பதால், கிரேக்கத்தின் பொதுப்பொருளை ஆண்பாலைத் தேவையின்றி வலியுறுத்தாமல் துல்லியமாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘நம்மில் எவரும்’ என்ற இணை அமைப்பும் ‘வாழ்வதில்லை / இறப்பதுமில்லை’ என்ற ஒத்திசைவும் மூலத்தின் வலியுறுத்தலையும் இணைத்தன்மையையும் காக்கின்றன.
