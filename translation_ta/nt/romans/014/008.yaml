  terminology: ‘ஆண்டவர்’ என்பது κύριος என்பதற்கான நிலையான, சூழலுக்கு ஏற்ற மொழிபெயர்ப்பு. ‘ஆண்டவருடையவர்கள்’ என்பது இறுதிக் கிரேக்க உடைமை அமைப்பை நன்றாக வெளிப்படுத்துகிறது. அடிக்குறிப்புகள் மாற்று மொழிபெயர்ப்பைத் தெளிவாகக் குறிக்கின்றன; அடையாளங்கள் உரையில் சரியான இடத்தில் உள்ளன.
