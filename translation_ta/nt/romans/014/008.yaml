  verdict: approve
  source_fidelity: மூலக் கிரேக்கத்தின் நிபந்தனை இணைநிலை, κύριος என்பதன் மீளுரை, τῷ κυρίῳ என்பதன் பரந்த உறவுநுணுக்கு, மற்றும் τοῦ κυρίου ἐσμέν என்பதன் சொந்தத்துவ வலிமை ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘ஆண்டவருக்கென்று’ என்பது ‘ஆண்டவருக்காக’ என்பதைவிடச் சேவை/நன்மை என்ற ஒரே பொருளுக்குள் சுருக்காமல், ஆண்டவரை நோக்கிய அர்ப்பணிப்பு மற்றும் உறவை இயல்பாகத் தருகிறது.
