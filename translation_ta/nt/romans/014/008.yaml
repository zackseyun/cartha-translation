id: ROM.14.8
reference: Romans 14:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: ta
  text: ஏனெனில், நாம் வாழ்ந்தால், ஆண்டவருக்கென்று[a] வாழ்கிறோம்; நாம் இறந்தால், ஆண்டவருக்கென்று இறக்கிறோம். ஆகவே, நாம் வாழ்ந்தாலும் இறந்தாலும், நாம் ஆண்டவருடையவர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இங்கு இருமுறை வரும் சொற்றொடர்களை ‘ஆண்டவருக்காக வாழ்கிறோம்’, ‘ஆண்டவருக்காக இறக்கிறோம்’ என மொழிபெயர்க்கலாம். கிரேக்க வேற்றுமை உறவு, நோக்கு அல்லது நன்மை ஆகிய நுணுக்கங்களைத் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நாம் ஆண்டவருக்குச் சொந்தமானவர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: ஏனெனில், நாம் வாழ்ந்தால்
  rationale: γάρ முந்தைய கருத்தை விளக்கும் தொடர்பைத் தருவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது. ἐάν τε தொடங்கும் நிபந்தனைத் தொடர் தமிழில் இயல்பாக ‘வாழ்ந்தால் ... இறந்தால்’ என அமைக்கப்பட்டது.
- source_word: ζῶμεν / ζῶμεν
  choice: நாம் வாழ்ந்தால் / வாழ்கிறோம்
  rationale: முதல் வினை நிபந்தனையையும், இரண்டாவது அதன் விளைவாகக் கூறப்படும் பொதுவான உண்மையையும் வெளிப்படுத்துகிறது; ζάω என்பதற்கு ஒரே சீராக ‘வாழ்’ பயன்படுத்தப்பட்டது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவருக்கென்று
  rationale: இந்த வேற்றுமை உறவு, நோக்கு அல்லது நன்மைக்கான செயல் ஆகிய நுணுக்கங்களைத் தரக்கூடும். ‘ஆண்டவருக்கென்று’ என்பது சேவை என்ற ஒரே பொருளுக்குள் சுருக்காமல், ஆண்டவரை நோக்கிய வாழ்க்கை மற்றும் மரணம் என்ற பரந்த உறவை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் அதிகாரத்தையும் இறையியல் நிறைவையும் காக்கும் வழக்கமான, கண்ணியமான தமிழ்ச் சொல். உடனடிச் சூழல் கிறிஸ்துவைச் சுட்டினாலும் மொழிபெயர்ப்பு பெயரைச் சேர்த்து மிகைப்படுத்தவில்லை.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: நாம் இறந்தால் / இறக்கிறோம்
  rationale: வினைச்சொல் பொதுவாக மரணமடைவதைக் குறிக்கிறது; தொடர்ச்சியான மரணநிலையாக அல்லாமல் பொதுவான நிகழ்வாகத் தமிழில் தரப்பட்டுள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய இரு இணையான வாக்கியங்களிலிருந்து வரும் முடிவைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: τοῦ κυρίου ἐσμέν
  choice: நாம் ஆண்டவருடையவர்கள்
  rationale: மூலத்தின் உடைமைக்குறிக்கும் மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது; ‘ஆண்டவருக்குச் சொந்தமானவர்கள்’ என்பது இதன் விளக்கமான மாற்று.
theological_decisions:
- issue: κύριος என்பவர் யார் என்பது
  choice: ‘ஆண்டவர்’ என்ற பட்டப்பெயர் மட்டும் பயன்படுத்தப்பட்டது; உடனடிச் சூழலில் அது ஆண்டவர் இயேசுவைச் சுட்டுகிறது, ஆனால் வசனம் சொல்லாத பெயர் சேர்க்கப்படவில்லை.
  alternative: ‘தேவன்’ அல்லது ‘ஆண்டவர் இயேசு’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: ரோமர் 14:9 கிறிஸ்துவை நோக்கிய சூழலை வழங்கினாலும், இவ்வசனத்தின் κύριος என்ற சொல்லைத் திறந்தபடியே வைத்திருப்பது மூலத்தின் சொல்லாட்சியையும் அதன் பரந்த இறையியல் ஒலியையும் காக்கிறது.
- issue: ஆண்டவருக்கென்று வாழ்தல் மற்றும் இறத்தல் என்பதன் உறவுநுணுக்கம்
  choice: ஆண்டவரை நோக்கிய உறவு, அர்ப்பணிப்பு, அவருக்குரிய நிலை ஆகியவற்றை ஒரே குறிப்பிட்ட செயலாகச் சுருக்காமல் வைத்தல்
  alternative: ‘ஆண்டவருக்காக வாழ்கிறோம்/இறக்கிறோம்’ அல்லது ‘ஆண்டவரின் அதிகாரத்தின்கீழ் வாழ்கிறோம்/இறக்கிறோம்’
  rationale: மீண்டும் வரும் தத்திவ் அமைப்பும் இறுதியிலுள்ள உடைமைக்குறிப்பும் சேர்ந்து நோக்கும் சொந்தத்துவமும் கொண்ட உறவைத் தெரிவிக்கின்றன; ஆகவே சேவை அல்லது அதிகாரம் என்ற ஒரே விளக்கத்துக்குள் பொருள் குறுக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. இணையான கிரேக்க வாக்கிய அமைப்பு தமிழிலும் மீளுரைப்பாகப் பாதுகாக்கப்பட்டது; ‘ஆண்டவருக்கென்று’ என்பது இயல்பையும் மூலத்தின் உறவுநுணுக்கப் பரப்பையும் சமநிலைப்படுத்துகிறது.
