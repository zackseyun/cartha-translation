  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: ta
  text: ஆனால் நீ, உன் சகோதரனை[a] ஏன் தீர்ப்பிடுகிறாய்? அல்லது நீயும் உன் சகோதரனை ஏன் இகழ்கிறாய்? ஏனெனில், நாம் எல்லாரும் கடவுளின்[b] நீதியாசனத்திற்கு முன்பாக நிற்போம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் சகோதரனையோ சகோதரியையோ.” கிரேக்கில், “உன் சகோதரனை.”
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில், “கிறிஸ்துவின்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: ஆனால் நீ
  rationale: δέ என்பதன் எதிர்மறைத் திருப்பத்தையும், முன்வைக்கப்பட்ட σύ என்பதன் அழுத்தத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τί κρίνεις
  choice: ஏன் தீர்ப்பிடுகிறாய்
  rationale: இவ்வினாவில் τί என்பது ‘ஏன்’ என்ற பொருளில் வருகிறது. κρίνω என்பதை ‘குற்றவாளி என்று தீர்க்கிறாய்’ என மிகைப்படுத்தாமல், மற்றவரைக் குறித்து மதிப்பிட்டுத் தீர்ப்பளிக்கும் செயலைக் குறிக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: τὸν ἀδελφόν σου
  choice: உன் சகோதரனை
  rationale: ἀδελφός இலக்கணப்படி ஆண்பால் ஒருமை. மூலத்தின் வடிவை முதன்மை உரையில் தக்கவைத்து, சூழலில் சக விசுவாசிகளான ஆண்களையும் பெண்களையும் உள்ளடக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: ἢ καὶ σὺ
  choice: அல்லது நீயும்
  rationale: ἤ என்பதன் மாற்றுக் கேள்வியையும் καί என்பதன் ‘நீயும்’ என்ற சேர்க்கை அழுத்தத்தையும் காக்கிறது.
- source_word: τί ἐξουθενεῖς
  choice: ஏன் இகழ்கிறாய்
  rationale: ἐξουθενέω என்பது ஒருவரை மதிப்பற்றவராக எண்ணி அவமதிப்பதைக் குறிக்கிறது; ‘இகழ்கிறாய்’ அதன் வலிமையைச் சுருக்கமாகத் தருகிறது.
- source_word: πάντες γὰρ
  choice: ஏனெனில், நாம் எல்லாரும்
  rationale: γάρ தரும் காரண விளக்கத்தையும், பவுலும் வாசகர்களும் அடங்கிய πάντες என்பதன் உள்ளடக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: παραστησόμεθα
  choice: முன்பாக நிற்போம்
  rationale: நீதிமன்றச் சூழலில் ஒரு நீதியாசனத்தின் முன் ஆஜராகி நிற்பது என்ற எதிர்காலப் பொருளை இயல்பாகத் தருகிறது.
- source_word: τῷ βήματι
  choice: நீதியாசனத்திற்கு
  rationale: βῆμα இங்கு தீர்ப்பு வழங்கப்படும் நீதிபதியின் ஆசனம் அல்லது நீதிமன்ற மேடையைக் குறிக்கிறது; ‘நீதியாசனம்’ சட்டவியல் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: SBLGNT உரையிலுள்ள நேரடியான இறைபெயர் உடைமைத் தொடர்பைத் தருகிறது.
theological_decisions:
- issue: அனைவரும் யாருடைய நீதியாசனத்திற்கு முன் நிற்பார்கள்?
  choice: கடவுளின்
  alternative: கிறிஸ்துவின்
  rationale: கொடுக்கப்பட்ட SBLGNT மூல உரை τοῦ θεοῦ (‘கடவுளின்’) என்று வாசிக்கிறது. சில கையெழுத்துப் பிரதிகளிலுள்ள ‘கிறிஸ்துவின்’ என்ற மாற்று வாசகம் முதன்மை உரையோடு ஒத்திசைக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘இகழ்கிறாய்’ என்ற வலுவான சொல்லும் ‘நீதியாசனம்’ என்ற நீதிமன்ற உருவகமும் மூலத்தின் கண்டனத்தையும் சட்டவியல் பின்னணியையும் தக்கவைக்கின்றன.
