review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the threefold abstention and the broad, elliptical final category ('anything' that harms a fellow believer). However, rendering σκανδαλίζεται as “பாவத்தில் விழுவது” specifies sin/falling into sin more narrowly than the Greek states. The verb denotes being caused to stumble, being ensnared, or taking offense; the text itself does not explicitly say 'sin.'
  naturalness: The sentence is fluent modern standard Tamil and has an appropriate biblical register. Replacing the over-specific middle expression with “தடுமாறவோ” is natural and preserves a meaningful distinction from “இடறவோ.”
  terminology: “இறைச்சி,” “திராட்சரசம்,” “உன் சகோதரன்,” and “பலவீனமடையவோ” are suitable. The inclusive explanatory footnote is appropriate and correctly anchored. “தடுமாறவோ” avoids importing an unstated moral conclusion for σκανδαλίζεται.
  issues:
  - severity: medium
    issue: σκανδαλίζεται is rendered as “பாவத்தில் விழுவது.”
    rationale: This makes the result explicitly a fall into sin, whereas the Greek can more broadly express being caused to stumble, being ensnared, or taking offense. A less interpretively narrowed Tamil rendering better preserves the source's semantic range.
  revised_text: இறைச்சி சாப்பிடாமலும், திராட்சரசம் குடிக்காமலும், உன் சகோதரன் இடறவோ, தடுமாறவோ, பலவீனமடையவோ காரணமாகும் எதையும் செய்யாமலும் இருப்பது நல்லது.[a]
