  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: ta
  text: இறைச்சி சாப்பிடாமலும், திராட்சரசம் குடிக்காமலும், உன் சகோதரன் இடறவோ, தடுமாறவோ, பலவீனமடையவோ காரணமாகும் எதையும் செய்யாமலும் இருப்பது நல்லது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “சகோதரன்” என்பது சூழலின்படி சகோதரியையும் உள்ளடக்கி, சக விசுவாசியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: நல்லது
  rationale: இந்தச் சூழலில் ஒழுக்கரீதியாகத் தகுந்ததும் பாராட்டத்தக்கதுமான செயல்முறையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: இறைச்சி சாப்பிடாமல் இருப்பது
  rationale: κρέα இங்கு உணவாகிய இறைச்சியைக் குறிக்கிறது; articular infinitive-இன் கருத்தை இயல்பான தமிழ் வினைப்பெயர் அமைப்பில் தருகிறது.
- source_word: μηδὲ πιεῖν οἶνον
  choice: திராட்சரசம் குடிக்காமல் இருப்பது
  rationale: οἶνος என்பதன் குறிப்பான பொருளைப் பாதுகாத்து, μηδέ இணைக்கும் இரண்டாவது விலக்குதலைத் தெளிவாகத் தருகிறது.
- source_word: μηδὲ ἐν ᾧ
  choice: காரணமாகும் எதையும் செய்யாமல் இருப்பது
  rationale: கிரேக்கத்தில் விடப்பட்டுள்ள செயலைத் தமிழில் தேவையான அளவு நிரப்பி, எந்த நடத்தையும் சக விசுவாசிக்குத் தீங்கு விளைவிக்கக் கூடாது என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: ὁ ἀδελφός σου
  choice: உன் சகோதரன்
  rationale: ஆண்பால் ஒருமை வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது; சூழலில் சக விசுவாசியைப் பிரதிநிதித்துவமாகக் குறிக்கலாம் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: προσκόπτει
  choice: இடறுவது
  rationale: ஆவிக்குரிய அல்லது ஒழுக்கரீதியான தடையைச் சுட்டும் பவுலின் உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: σκανδαλίζεται
  choice: பாவத்தில் விழுவது
  rationale: προσκόπτει என்பதோடு உள்ள பொருள் ஒட்டுமையை வைத்துக்கொண்டே, passive கருத்தான சிக்கவைக்கப்படுதல் அல்லது தவறில் விழச் செய்யப்படுதல் என்பதைக் தனித்த தமிழ்ச்சொற்றொடரில் தருகிறது.
- source_word: ἀσθενεῖ
  choice: பலவீனமடைவது
  rationale: உடல் பலவீனம் என்று வரையறுக்காமல், இச்சூழலில் மனச்சாட்சி அல்லது விசுவாசத்தில் வலிமை குறைவதற்கான திறந்த பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀδελφός என்பதன் பிரதிநிதித்துவப் பயன்பாடு
  choice: உன் சகோதரன்
  alternative: உன் சகோதரனோ சகோதரியோ; உன் சக விசுவாசி
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமையை முதன்மை உரையில் காக்கிறது; அதேவேளை சூழலில் எந்தச் சக விசுவாசியையும் குறிக்கக்கூடிய உள்ளடக்கமான பயன்பாட்டை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: προσκόπτει, σκανδαλίζεται, ἀσθενεῖ ஆகிய மூன்று விளைவுகளின் வேறுபாடு
  choice: இடறுவது, பாவத்தில் விழுவது, பலவீனமடைவது
  alternative: இடறுவது, மனவருத்தம் அடைவது, பலவீனமடைவது
  rationale: மூன்று கிரேக்க வினைகளையும் ஒன்றாகக் கலக்காமல் வேறுபடுத்துகிறது. σκανδαλίζεται என்பதை வெறும் உணர்ச்சி ரீதியான புண்படுதலாகக் குறுக்காமல், ஒழுக்க அல்லது விசுவாசத் தவறில் சிக்கச் செய்யப்படுதல் என்ற வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. இணையான மூன்று விளைவுகளும் தனித்தனியாகத் தெளிவாக இருக்க வாக்கிய அமைப்பு சீராக்கப்பட்டது.
