revisions:
- from: இறைச்சி சாப்பிடாமலும், திராட்சரசம் குடிக்காமலும், உன் சகோதரன் இடறுவதற்கோ, பாவத்தில் விழுவதற்கோ, பலவீனமடைவதற்கோ காரணமாகும் எதையும் செய்யாமலும் இருப்பது நல்லது.[a]
  to: இறைச்சி சாப்பிடாமலும், திராட்சரசம் குடிக்காமலும், உன் சகோதரன் இடறவோ, தடுமாறவோ, பலவீனமடையவோ காரணமாகும் எதையும் செய்யாமலும் இருப்பது நல்லது.[a]
