translation:
  language: ta
  text: ஆகவே[a], சமாதானத்திற்கானவற்றையும் ஒருவரை ஒருவர் கட்டியெழுப்புவதற்கானவற்றையும் நாம் நாடுவோமாக.
  philosophy: optimal-equivalence
