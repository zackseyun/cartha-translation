lexical_decisions:
- source_word: ἄρα οὖν
  choice: ஆகவே
  rationale: இரண்டு முடிவுரைக் கூறுகளின் ஒருங்கிணைந்த பொருளை இயல்பான நவீன தமிழில் தெரிவித்து, முந்தைய வாதத்திலிருந்து வரும் முடிவைக் குறிக்கிறது.
- source_word: τὰ τῆς εἰρήνης
  choice: சமாதானத்தை உண்டாக்குகிறவற்றை
  rationale: சமாதானத்தோடு தொடர்புடைய செயல்களையும் அணுகுமுறைகளையும் குறிக்கும் கிரேக்க மரபுத்தொடரைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: διώκωμεν
  choice: நாம் தீவிரமாக நாடுவோமாக
  rationale: நிகழ்கால அறிவுறுத்தல் வினையின் தொடர்ச்சியான, கூட்டு முயற்சியையும் διώκω என்பதன் தீவிரத்தையும் காக்கிறது.
- source_word: τὰ τῆς οἰκοδομῆς
  choice: வளரச் செய்கிறவற்றை
  rationale: ‘கட்டுதல்’ என்ற உருவகத்தின் சமூகத்தை ஆன்மிகமாக வலுப்படுத்தும் பொருளை, வழக்கற்ற சமயக் கலைச்சொல் இல்லாமல் நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τῆς εἰς ἀλλήλους
  choice: ஒருவரையொருவர்
  rationale: சமூகத்தினரிடையேயான பரஸ்பர வளர்ச்சியைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: சமூக வளர்ச்சியின் வரம்பு
  choice: விசுவாசிகள் சமாதானத்தையும் பரஸ்பர வளர்ச்சியையும் கூட்டாக நாட வேண்டும் என்ற அறிவுறுத்தல்
  alternative: தனிநபரின் ஒழுக்க முன்னேற்றத்தை மட்டும் மையப்படுத்தும் வாசிப்பு
  rationale: முதல் நபர் பன்மை அறிவுறுத்தலும் ἀλλήλους என்ற பரஸ்பரச் சொல்லும் சமூக வாழ்வை வலியுறுத்துகின்றன; மொழிபெயர்ப்பு இதை எந்தப் பிரிவுசார் விளக்கத்தையும் சேர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மதிப்புமிக்க அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீவிரமாக நாடுவோமாக’ என்பது மூல வினையின் வலிமையையும் கூட்டுச் செயலுக்கான அழைப்பையும் காக்கிறது.
