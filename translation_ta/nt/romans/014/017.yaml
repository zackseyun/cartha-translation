id: ROM.14.17
reference: Romans 14:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: ta
  text: ஏனெனில், கடவுளின் அரசாட்சி உண்பதும் குடிப்பதும் அல்ல; மாறாக, தூய ஆவியிலுள்ள நீதியும் சமாதானமும் மகிழ்ச்சியும் ஆகும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία τοῦ θεοῦ
  choice: கடவுளின் அரசாட்சி
  rationale: βασιλεία என்பதில் ‘அரசு’ மற்றும் ‘ஆட்சி’ ஆகிய இரு கருத்துகளும் அடங்கலாம். ‘அரசாட்சி’ என்பது கடவுளின் ஆளுகையையும் அவருடைய அரசின் பரந்த கருத்தையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: βρῶσις καὶ πόσις
  choice: உண்பதையும் குடிப்பதையும் பற்றியது
  rationale: இரு கிரேக்கச் சொற்களும் செயற்பாட்டுப் பெயர்களாக இணையாக அமைந்துள்ளதால், உணவு மற்றும் பானம் என்ற பொருட்களாக அல்லாமல் உண்பது மற்றும் குடிப்பது என்ற நடைமுறைகளாக மொழிபெயர்க்கப்பட்டுள்ளது. தமிழில் இயல்பான எதிர்மறைப் பயனிலைக்காக ‘பற்றியது’ சேர்க்கப்பட்டுள்ளது.
- source_word: δικαιοσύνη
  choice: நீதிநிலை
  rationale: δικαιοσύνη குறிக்கும் ஒழுக்க மற்றும் உறவு சார்ந்த சரியான நிலையை ‘நீதிநிலை’ வெளிப்படுத்துகிறது; அதன் ‘நீதி/நியாயம்’ என்ற சமூகப் பரிமாணம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: இச்சூழலில் தனிப்பட்ட அமைதியையும் விசுவாசிகளிடையேயான ஒற்றுமையையும் குறிக்கக்கூடிய வழக்கமான, கண்ணியமான தமிழ்ச் சொல்.
- source_word: χαρά
  choice: மகிழ்ச்சி
  rationale: χαρά என்பதற்கான இயல்பான நவீனத் தமிழ் இணை; பவுலின் நேர்மறையான எதிர்மறை-ஒப்பீட்டின் வலிமையையும் தக்கவைக்கிறது.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: தூய ஆவியில்
  rationale: ἐν என்பதிலுள்ள சூழல் அல்லது செயலாற்றும் வழி ஆகிய இரு சாத்தியங்களையும் காரணவுரையாக மாற்றாமல் தக்கவைக்கிறது; πνεῦμα ἅγιον இங்கு தூய ஆவியைக் குறிப்பதாக இயல்பாகப் புரிகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கத்தை இவ்வசனம் அளிப்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: δικαιοσύνη என்பதன் பவுல் சார்ந்த பொருள்
  choice: நீதிநிலை
  alternative: நீதி அல்லது நியாயம்
  rationale: முதன்மைப் பாடம் கடவுளுக்கு முன்பும் மனித உறவுகளிலும் சரியானதாக இருக்கும் நிலை என்ற பரந்த பொருளைக் காக்கிறது. சமூக நீதியை வலியுறுத்தும் சாத்தியத்தை அடிக்குறிப்பு மறைக்காமல் குறிப்பிடுகிறது.
- issue: ἐν πνεύματι ἁγίῳ என்பதில் ἐν-ன் நுணுக்கம்
  choice: தூய ஆவியில்
  alternative: தூய ஆவியினால்
  rationale: ‘-இல்’ என்பது ஆவிக்குரிய தளம் மற்றும் ஆவியின் செயலாற்றல் ஆகியவற்றுக்கிடையிலான உண்மையான தெளிவின்மையைத் தக்கவைக்கிறது; ‘-ஆல்’ என்று மட்டும் மொழிபெயர்த்தால் கருவிப் பொருள் தேவையின்றி உறுதிப்படுத்தப்படும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அரசாட்சி’ என்பது ‘ராஜ்யம்’ என்ற பழமையான அல்லது சமயச் சிறப்புச் சொல்லைத் தவிர்த்து βασιλεία-வின் ஆளுகை சார்ந்த பரப்பைத் தக்கவைக்கிறது. மூன்று நேர்மறைப் பெயர்களின் இணை அமைப்பும், இறுதிச் சொல்லை வலியுறுத்தும் ‘-மே’ வடிவமும் கிரேக்க எதிர்மறை-ஒப்பீட்டின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
