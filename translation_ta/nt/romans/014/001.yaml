  source_fidelity: 'முதன்மை உரை மூலத்தின் முக்கிய கருத்தை நன்றாகத் தருகிறது: விசுவாசத்தில் பலவீனமானவரைச் சமூக உறவில் ஏற்றுக்கொள்வதும், கருத்து வேறுபாடுகளைச் சார்ந்த சர்ச்சைக்காக அவரை ஏற்றுக்கொள்ளாமையும் தெளிவாக உள்ளது. எனினும், கிரேக்க δέ முதல் ஏவலுடன் இணைந்த மென்மையான தொடர்ச்சிக் குறியீடு; தமிழில் அரைப்புள்ளிக்குப் பின் ‘ஆனால்’ என வருவது மூலத்தில் இல்லாத எதிர்மறைத் தொடர்பை இரண்டாம் துண்டுக்கு அளிக்கிறது. மேலும் εἰς διακρίσεις διαλογισμῶν என்பதன் நோக்கப் பொருளை ‘கருத்துகளைப் பற்றிய வாக்குவாதங்களுக்காக அல்ல’ எனப் பெயர்த்தொடராக அமைப்பது துல்லியமானது.'
  naturalness: ‘விசுவாசத்தில் பலவீனமாயிருப்பவரை ஏற்றுக்கொள்ளுங்கள்’ இயல்பான, மரியாதையான நவீனத் தமிழ். திருத்தப்பட்ட இரண்டாம் பகுதி முழுமையானதும் சீரானதுமாக இருக்கும். அடிக்குறிப்பு a-வில் ‘வரவேற்றுக்கொள்ளுங்கள்’ என்பதற்குப் பதில் பொதுவான ‘வரவேற்குங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
