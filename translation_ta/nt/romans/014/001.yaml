  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: ta
  text: விசுவாசத்தில் பலவீனமாயிருப்பவரை ஏற்றுக்கொள்ளுங்கள்[a]; கருத்துகளைப் பற்றிய வாக்குவாதங்களுக்காக அல்ல[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏற்றுக்கொள்ளுங்கள்’ என்பதற்குப் பதிலாக ‘வரவேற்குங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஒருவரைத் தமது உறவிலும் கூட்டுறவிலும் சேர்த்துக்கொள்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதனை ‘மாறுபட்ட எண்ணங்களைத் தீர்ப்பிடுவதற்காக அல்ல’ அல்லது ‘காரணவாதங்களைக் குறித்து சச்சரவு செய்வதற்காக அல்ல’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: பலவீனமாயிருப்பவரை
  rationale: இது நிகழ்காலப் பங்கேற்புவினை பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட வடிவம். பலவீனம் எதில் உள்ளது என்பதை அடுத்துள்ள τῇ πίστει தெரிவிப்பதால், ‘மனசாட்சியில் பலவீனமானவர்’ என்று விளக்கத்தைச் சேர்க்காமல் மூலத்தின் பொதுத்தன்மை காக்கப்படுகிறது.
- source_word: τῇ πίστει
  choice: விசுவாசத்தில்
  rationale: இங்கு தத்திவேற்றுமை, அந்த நபர் எந்தத் துறையில் பலவீனமாக இருக்கிறார் என்பதைக் குறிக்கிறது. சூழல் குறிப்பிட்ட நடைமுறைகளைப் பற்றிய உறுதியைச் சார்ந்திருந்தாலும், ‘விசுவாசம்’ என்ற மூலச்சொல்லின் பரப்பைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: προσλαμβάνεσθε
  choice: ஏற்றுக்கொள்ளுங்கள்
  rationale: இந்த நடுவினை ஏவல் வடிவம் ஒருவரைத் தம்முடன் சேர்த்துக்கொள்வதையும் உறவிலும் கூட்டுறவிலும் வரவேற்பதையும் குறிக்கிறது. ‘ஏற்றுக்கொள்ளுங்கள்’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பரந்த பொருளைத் தருகிறது.
- source_word: μὴ εἰς
  choice: செய்வதற்காக அல்ல
  rationale: தவிர்க்கப்பட வேண்டிய நோக்கத்தை இந்த அமைப்பு குறிக்கிறது. தமிழில் நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: διακρίσεις
  choice: வாக்குவாதம்
  rationale: இந்தச் சூழலில் இது நடுநிலையான வேறுபடுத்துதலைவிட, கருத்துகளை மதிப்பிட்டு முரண்படும் அல்லது சர்ச்சை செய்யும் செயலையே குறிக்கிறது. ‘வாக்குவாதம்’ அதன் உறவுசார், சர்ச்சைக்குரிய தன்மையைத் தெரிவிக்கிறது.
- source_word: διαλογισμῶν
  choice: கருத்துகளைப் பற்றி
  rationale: இச்சொல் எண்ணங்கள், காரணவாதங்கள் அல்லது கருத்துகள் எனப் பொருள்படலாம். ‘கருத்துகள்’ என்பது வாசகருக்கு இயல்பாக இருப்பதுடன், ‘மனசாட்சியின் தயக்கங்கள்’ போன்ற குறுகிய விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: 'δέ இங்கு அறிவுரையின் இரு பகுதிகளுக்கிடையிலான மென்மையான எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது: அந்த நபரை ஏற்றுக்கொள்ள வேண்டும், ஆனால் தவறான நோக்கத்திற்காக அல்ல. தமிழில் ‘ஆனால்’ இந்தத் தொடர்பைத் தெளிவாக்குகிறது.'
theological_decisions:
- issue: πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை; விசுவாச உண்மைநிலை
  rationale: இங்கு ஒருவரின் விசுவாசம் சார்ந்த பலவீனமே நேரடியாகக் குறிப்பிடப்படுகிறது. உடனடிச் சூழல் நடைமுறைகள் குறித்த உள்ளார்ந்த உறுதியை உள்ளடக்கினாலும், ‘மனசாட்சி’ அல்லது ‘கொள்கைத் தொகுப்பு’ என்று பொருளைத் தீர்மானித்துவிடாமல் ‘விசுவாசம்’ மூலத்தின் இறையியல் பரப்பையும் தெளிவின்மையையும் காக்கிறது.
- issue: διακρίσεις διαλογισμῶν என்ற தொடரின் உறவு
  choice: கருத்துகளைப் பற்றி வாக்குவாதம்
  alternative: எண்ணங்களைத் தீர்ப்பிடுதல்; காரணவாதங்களைக் குறித்த சச்சரவு
  rationale: இந்தப் பிறப்பியல் தொடரை சர்ச்சைக்குரிய கருத்துகள் வாக்குவாதத்தின் பொருளாக உள்ளன என்று முதன்மை உரை எடுத்துக்கொள்கிறது. தீர்ப்பிடுதல் அல்லது பகுத்தறிதல் என்ற சாத்தியத்தை முற்றிலும் நீக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவான வாசகருக்கு புரியும் வகையில் மரியாதையும் நேரடியான அறிவுரைத் தொனியும் காக்கப்பட்டுள்ளன. ‘விசுவாசம்’ கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற சொல்லாக இருப்பதால் பயன்படுத்தப்பட்டுள்ளது; ‘மனசாட்சி’ போன்ற சூழல் விளக்கங்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
