  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: ta
  text: ஆனால் இப்போது வெளிப்படுத்தப்பட்டு, இறைவாக்கு வேத எழுத்துகள் வழியாகவும் நித்திய கடவுளின் கட்டளையின்படியும் எல்லா மக்களினங்களுக்கும் அறிவிக்கப்பட்டு, விசுவாசக் கீழ்ப்படிதலுக்காக—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φανερωθέντος
  choice: வெளிப்படுத்தப்பட்டு
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட மறைபொருளையே இப்பெயரெச்சம் குறிக்கிறது; முன்பு மறைக்கப்பட்டிருந்தது இப்போது வெளிக்கொணரப்பட்டதைத் தெளிவாகக் காட்டுகிறது.
- source_word: γραϕῶν προφητικῶν
  choice: இறைவாக்கு உரைக்கும் வேத எழுத்துகள்
  rationale: பன்மையிலுள்ள γραφαί புனித வேத எழுத்துகளைக் குறிக்கிறது; προφητικῶν அவற்றின் இறைவாக்குத் தன்மையைச் சுட்டுகிறது. இயல்பான தமிழுக்காக பெயரடைத் தொடர் விளக்கத் தொடராக வழங்கப்படுகிறது.
- source_word: ἐπιταγή
  choice: கட்டளை
  rationale: கடவுளின் அதிகாரமிக்க ஆணையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὑπακοὴν πίστεως
  choice: விசுவாசத்திற்குக் கீழ்ப்படியும்படி
  rationale: உருபுத் தொடர்பிலுள்ள திட்டமிட்ட தெளிவின்மையை முற்றிலும் தீர்க்காமல், விசுவாசமும் கீழ்ப்படிதலும் நெருங்கிய தொடர்புடையவை என்பதை வைத்திருக்கிறது; ரோமர் 1:5 உடனான சொற்றொடர் ஒற்றுமையையும் பேணுகிறது.
- source_word: πάντα τὰ ἔθνη
  choice: எல்லா மக்களினங்களுக்கும்
  rationale: யூதரல்லாதவர்களை மட்டும் வெளிப்படையாகக் கட்டுப்படுத்தாமல், எல்லா இனமக்களையும் உள்ளடக்கும் உலகளாவிய நோக்கத்தைச் சொல்கிறது.
- source_word: γνωρισθέντος
  choice: தெரியப்படுத்தப்பட்டுள்ளது
  rationale: மறைபொருள் அனைத்து மக்களினங்களுக்கும் அறிவிக்கப்பட்ட செயலைக் குறிக்கிறது; φανερωθέντος என்பதிலிருந்து வேறுபாட்டையும் பேணுகிறது.
theological_decisions:
- issue: ὑπακοὴ πίστεως என்ற சொற்றொடரில் உள்ள உருபுத் தொடர்பு
  choice: விசுவாசத்திற்குக் கீழ்ப்படியும்படி
  alternative: விசுவாசத்தினால் வரும் கீழ்ப்படிதலுக்காக / விசுவாசமாகிய கீழ்ப்படிதலுக்காக
  rationale: πίστεως என்பதை தோற்றுவிக்கும் காரணம், விளக்கம், அல்லது கீழ்ப்படிதலின் குறிக்கோள் எனப் பலவாறு புரிந்துகொள்ள முடியும். தேர்ந்த வடிவம் பொருளை ஒரே இறையியல் விளக்கத்திற்குள் அடைக்காமல் மூலத்தின் பதற்றத்தை ஓரளவு காக்கிறது.
- issue: τὰ ἔθνη என்பதன் வரம்பு
  choice: எல்லா மக்களினங்கள்
  alternative: யூதரல்லாத எல்லா மக்கள்
  rationale: πάντα உடன் வரும் இச்சூழலில் உலகளாவிய பரப்பை முன்னிறுத்துகிறது; யூதர்–புறவினத்தார் என்ற குறிப்பிட்ட எதிர்மறைப்பாட்டை மொழிபெயர்ப்பில் தேவையின்றி புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் வாசிப்புத் தெளிவும் பேணப்பட்டுள்ளன. இது 16:25-இல் தொடங்கி 16:27 வரை நீளும் ஒரே தொடரின் பகுதி என்பதால் வாக்கியம் நிறைவடையாத தொடராகவும் இறுதியில் நீள்கோட்டுடனும் தரப்பட்டுள்ளது. ‘கடவுள்’ பொதுவான தெய்வக் குறிப்பாகவும், ‘இறைவாக்கு உரைக்கும்’ என்பது prophetic என்பதைக் குழப்பமின்றி இயல்பாகச் சொல்லவும் பயன்படுத்தப்பட்டுள்ளது.
