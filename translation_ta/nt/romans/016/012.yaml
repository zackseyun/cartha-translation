source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: ta
  text: கர்த்தருக்குள் உழைத்த திரிபைனாவையும் திரிபோசாவையும்[a] வாழ்த்துத் தெரிவியுங்கள். கர்த்தருக்குள் மிகவும் உழைத்த அன்புக்குரிய பெர்சிஸையும்[b] வாழ்த்துத் தெரிவியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கர்த்தருக்குள் உழைக்கிற திரிபைனாவையும் திரிபோசாவையும்.”
    reason: கிரேக்கப் பங்கேற்பு வடிவம் இவர்களுடைய அறியப்பட்ட உழைப்பைச் சுட்டுகிறது; தமிழில் அதை கடந்தகால உழைப்பாகவோ தொடரும் பண்பாகவோ வெளிப்படுத்தலாம்.
  - marker: b
    text: சில மொழிபெயர்ப்புகள், “எனக்கு அன்புக்குரிய பெர்சிஸ்” என்று தருகின்றன; கிரேக்கத்தில் ‘என்’ என்ற சொல் வெளிப்படையாக இல்லை.
    reason: மூலத்தில் இல்லாத உடைமை நுணுக்கத்தைச் சேர்க்கும் மாற்று மொழிபெயர்ப்பை விளக்குகிறது.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துச் சொல்லுங்கள்
  rationale: கடிதத்தின் இறுதி வாழ்த்துப் பட்டியலில் வரும் பன்மை ஏவல் வடிவத்தை, இயல்பான நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: திரிபேனாவுக்கும் திரிபோசாவுக்கும்
  rationale: தனிப்பட்ட பெயர்கள் அவற்றின் கிரேக்க ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
- source_word: τὰς κοπιώσας
  choice: கடினமாக உழைத்த
  rationale: κοπιάω என்பதில் உள்ள கடுமையான முயற்சி அல்லது பாடுபாடு என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பின்னர் வரும் அதே வினைச்சொல்லுடனான சொற்பொருள் தொடர்பும் காக்கப்படுகிறது.
- source_word: ἐν κυρίῳ
  choice: கர்த்தருக்குள்
  rationale: பவுலின் செறிவான சொற்றொடரில் உள்ள உறவு மற்றும் செயல்படும் தளம் ஆகிய இரு நுணுக்கங்களையும் குறுக்காமல் காக்கிறது; அதை வெறுமனே ‘கர்த்தருக்காக’ என்று நோக்கப்பொருளாக மட்டும் மாற்றவில்லை.
- source_word: Περσίδα
  choice: பெர்சிஸ்
  rationale: தனிப்பட்ட பெயர் கிரேக்க வடிவத்துக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: τὴν ἀγαπητήν
  choice: அன்புக்குரிய
  rationale: கிரேக்கத்தில் வெளிப்படையான ‘எனக்கு’ அல்லது ‘என்’ என்ற உடைமைச் சொல் இல்லாததால், அதைச் சேர்க்காமல் அன்பும் மதிப்பும் பெற்றவர் என்ற பொருளைத் தருகிறது.
- source_word: πολλὰ ἐκοπίασεν
  choice: மிகவும் உழைத்த
  rationale: πολλὰ தரும் அளவு வலியுறுத்தலை ‘மிகவும்’ என்பதும், κοπιάω தரும் கடின முயற்சியை ‘உழைத்த’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: ἐν κυρίῳ என்ற பவுலின் ஊழியச் சொற்றொடரின் பொருள்
  choice: கர்த்தருக்குள்
  alternative: கர்த்தருக்காக / கர்த்தருக்குச் சேவை செய்து
  rationale: இந்த உழைப்பு கர்த்தரோடுள்ள உறவிலும் அவருடைய ஆட்சிக்குட்பட்ட தளத்திலும் நிகழ்ந்தது என்ற விரிவான நுணுக்கத்தைப் பாதுகாக்கிறது; நோக்கத்தை மட்டும் குறிப்பிடும் வகையில் பொருளைக் குறுக்கவில்லை.
- issue: τὴν ἀγαπητήν என்பதில் உடைமைப் பொருளைச் சேர்ப்பதா
  choice: அன்புக்குரிய
  alternative: எனக்கு அன்புக்குரிய / என் அன்புக்குரிய
  rationale: மூலத்தில் μου (‘என்’) இல்லை. ஆகவே பவுலின் தனிப்பட்ட உடைமையையோ நெருக்கத்தையோ வெளிப்படையாகச் சேர்க்காமல், கிரேக்கத்தின் உண்மையான தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் எளிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கர்த்தருக்குள்’ என்ற பரிச்சயமான பவுலின் சொற்றொடர் அதன் இறையியல் செறிவுக்காகப் பேணப்பட்டுள்ளது. இரண்டு பெண்களின் உழைப்புக்கும் ஒரே ‘உழைத்த’ வினை பயன்படுத்தப்பட்டு, பெர்சிஸைப் பற்றிய πολλὰ என்பதன் வலியுறுத்தல் ‘மிகவும்’ எனக் காட்டப்பட்டுள்ளது.
