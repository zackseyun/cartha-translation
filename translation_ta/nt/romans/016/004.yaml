  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: ta
  text: அவர்கள் என் உயிர்க்காகத் தங்கள் கழுத்தையே பணயம் வைத்தார்கள்.[a] அவர்களுக்கு நன்றி செலுத்துவது நான் மட்டுமல்ல; பிற இனத்தாரின் திருச்சபைகள் அனைத்தும் நன்றி செலுத்துகின்றன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘தங்கள் சொந்தக் கழுத்தை வைத்தார்கள்.’ கிரேக்கத்தில் ‘கழுத்து’ ஒருமையில் வருகிறது; இது சாவுக்குரிய ஆபத்துக்குத் தம்மை உட்படுத்துவதைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
  - marker: b
