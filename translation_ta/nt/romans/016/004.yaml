  source_fidelity: 'மையப் பொருள் சரியாக உள்ளது: பிரிஸ்காவும் ஆக்கில்லாவும் பவுலின் உயிர்க்காக உயிராபத்துக்கு தங்களை உட்படுத்தினர்; அவர்களுக்கு பவுல் மட்டும் அல்ல, புறஜாதியருடன் தொடர்புடைய எல்லாச் சபைகளும் நன்றி செலுத்துகின்றன. ஆனால் ‘என் உயிரைக் காக்கத்’ என்பது மூலத்தின் ὑπέρ (‘என் உயிர்க்காக’) என்பதைக் காட்டிலும் நோக்கத்தைச் சற்றே வெளிப்படையாகச் சேர்க்கிறது. ‘என் உயிர்க்காக’ மூலத்துக்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் உள்ளது.'
