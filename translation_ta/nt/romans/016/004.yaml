    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பிரிஸ்காவையும் ஆக்கில்லாவையும் விளக்கும் தொடர்புச் சொல். தனி வசனமாகவும் இயல்பாக வாசிக்கத் தமிழில் ‘அவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: என் உயிரைக் காக்க
  rationale: இங்கு ψυχή என்பது உடலற்ற ‘ஆத்துமா’ என்பதையல்ல, பவுலின் உயிரைக் குறிக்கிறது. உயிருக்கு ஏற்பட்ட ஆபத்தின் சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: தங்கள் கழுத்தையே பணயம் வைத்தார்கள்
  rationale: சாவுக்குரிய ஆபத்துக்குத் தம்மை உட்படுத்தியதைச் சுட்டும் கிரேக்க உருவகத்தை, தமிழில் புரியும் அதே போன்ற உயிர்ப்புள்ள சொல்லாட்சியால் வெளிப்படுத்துகிறது.
- source_word: οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: அவர்களுக்கு நான் மட்டுமல்ல ... நன்றி செலுத்துகின்றன
  rationale: நன்றி கூறுவது பவுல் மட்டும் அல்ல என்ற வலியுறுத்தலையும் எதிர்மறை–நேர்மறை அமைப்பையும் காக்கிறது.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: திருச்சபைகள் அனைத்தும்
  rationale: குறிப்பிடப்படும் முழுத் திருச்சபைக் கூட்டத்தையும் பன்மையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τῶν ἐθνῶν
  choice: பிற இனத்தாரின்
  rationale: பவுலின் பயன்பாட்டில் யூதரல்லாத மக்களைக் குறிக்கும் பொருளைத் தெளிவாகத் தருகிறது; ‘தேசங்கள்’ என்று மொழிபெயர்த்து அரசியல் நாடுகள் என்ற தவறான எண்ணத்தை ஏற்படுத்துவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ψυχή என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: சாவுக்குரிய ஆபத்தையும் ஒருவருக்காக மற்றவர்கள் தங்களை ஆபத்துக்கு உட்படுத்தியதையும் குறிக்கும் சூழலில், இது பவுலின் உயிரையே குறிக்கிறது.
- issue: ἐθνῶν என்பதன் அடையாளம்
  choice: பிற இனத்தார்
  alternative: தேசங்கள்
  rationale: ரோமர் நிருபத்தில் உள்ள யூதர்–பிற இனத்தார் வேறுபாட்டைக் காக்கிறது; அதேவேளையில் ஒரு குறிப்பிட்ட சமய மரபின் சொல்லாட்சியைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு உடனடியாகப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கழுத்தைப் பணயம் வைத்தார்கள்’ என்ற சொல்லாட்சி மூலத்தின் உயிர்ப்புள்ள உருவகத்தையும் அதன் ஆபத்து சார்ந்த பொருளையும் இணைக்கிறது. ‘திருச்சபை’ என்பது கிறிஸ்தவச் சூழலில் பரவலாக அறியப்படும் சொல்.
