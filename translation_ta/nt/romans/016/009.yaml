revisions:
- from: மேசியாவில்[a] எங்கள் உடன் பணியாளரான உர்பானையும், எனக்கு அன்பான ஸ்தாக்குவையும் வாழ்த்துங்கள்.
  to: மேசியாவில்[a] எங்களுடைய உடன்பணியாளரான உர்பானுஸையும், என் அன்புக்குரிய ஸ்தாக்கீஸையும் வாழ்த்துங்கள்.
  rationale: The revision preserves the Greek syntax and sense while using more natural modern Tamil for ‘our fellow worker.’ It also restores fuller transliterated forms of both personal names. The Messiah/Christ alternative and its anchor are retained.
