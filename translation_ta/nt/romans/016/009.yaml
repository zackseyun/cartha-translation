id: ROM.16.9
reference: Romans 16:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: ta
  text: மேசியாவில்[a] எங்களுடைய உடன்பணியாளரான உர்பானுஸையும், என் அன்புக்குரிய ஸ்தாக்கீஸையும் வாழ்த்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவில்.”
    reason: Χριστός என்பதற்கான பரவலாக வழக்கிலுள்ள மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துங்கள்
  rationale: வாழ்த்துப் பட்டியலில் வரும் பன்மை கட்டளை வடிவத்தை இயல்பான, சுருக்கமான தமிழில் தெரிவிக்கிறது.
- source_word: Οὐρβανὸν
  choice: உர்பான்
  rationale: கிரேக்கத்தில் பிரதிபலிக்கும் இலத்தீன் ஆண்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; வேற்றுமை உருபுடன் உர்பானையும் என வருகிறது.
- source_word: συνεργὸν ἡμῶν
  choice: எங்கள் உடன் பணியாளர்
  rationale: சேர்ந்து உழைப்பவர் என்ற συνεργός என்பதன் கூட்டுப்பணி உணர்வையும் ἡμῶν என்பதன் எங்கள் என்ற பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவில்
  rationale: ἐν என்பதன் உறவு அல்லது செயல்படும் வட்டம் சார்ந்த நெகிழ்வை -இல் வடிவம் பாதுகாக்கிறது; Χριστός இங்கு பட்டப்பெயர் தன்மையைத் தக்கவைத்திருப்பதால் மேசியா என மொழிபெயர்க்கப்படுகிறது.
- source_word: Στάχυν
  choice: ஸ்தாக்கு
  rationale: கிரேக்க ஆண்பெயரான Στάχυς என்பதன் தமிழ் ஒலிபெயர்ப்பு; வேற்றுமை உருபுடன் ஸ்தாக்குவையும் என வருகிறது.
- source_word: ἀγαπητόν μου
  choice: எனக்கு அன்பான
  rationale: பவுலின் தனிப்பட்ட பாசத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அதிகப்படியான காதல் சார்ந்த தொனியைத் தவிர்க்கிறது.
theological_decisions:
- issue: ἐν Χριστῷ என்பதில் Χριστός-ஐ மொழிபெயர்த்தல்
  choice: மேசியாவில்
  alternative: கிறிஸ்துவில்
  rationale: இங்கு Χριστός பட்டப்பெயரின் பொருளைத் தெளிவாகத் தக்கவைக்க முடிவதால் மேசியா முன்னுரிமை பெறுகிறது; பரவலாக வழக்கிலுள்ள கிறிஸ்து வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதையுள்ள பன்மைக் கட்டளை பயன்படுத்தப்பட்டுள்ளது. வாக்கிய அமைப்பு கிரேக்க வாழ்த்துப் பட்டியலின் சுருக்கத்தையும் பவுலின் அன்பான தொனியையும் காக்கிறது.
