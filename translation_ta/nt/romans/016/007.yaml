id: ROM.16.7
reference: Romans 16:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: ta
  text: என் உறவினர்களும் இனத்தாருமான, என்னோடு சிறையில் இருந்த அந்திரோனீக்குவுக்கும் யூனியாவுக்கும்[a] வாழ்த்துச் சொல்லுங்கள். அவர்கள் அப்போஸ்தலர்களிடையே குறிப்பிடத்தக்கவர்கள்[b]; மேலும், அவர்கள் எனக்கு முன்பே மேசியாவுக்குள் வந்தவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூனியா’ என்பதற்குப் பதிலாக ‘யூனியாஸ்’ என்ற ஆண்பெயர் என்றும் சிலர் புரிந்துகொள்கிறார்கள்; ஆனால் கிரேக்க வடிவமும் வரலாற்றுப் பெயர்ப் பயன்பாடும் பெண்பெயரான ‘யூனியா’ என்பதையே அதிகம் ஆதரிக்கின்றன.
    reason: alternative_reading
  - marker: b
    text: ‘அப்போஸ்தலர்களிடையே சிறப்புப் பெற்றவர்கள்’ என்றும் மொழிபெயர்க்கலாம்; இச்சொற்றொடரை ‘அப்போஸ்தலர்களுக்கு நன்கு அறியப்பட்டவர்கள்’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துச் சொல்லுங்கள்
  rationale: நிருபங்களில் வரும் நேரடி கட்டளையின் இயல்பையும், நவீன தமிழின் இயல்பான வழக்கையும் காக்கிறது.
- source_word: Ἀνδρόνικον καὶ Ἰουνίαν
  choice: அந்திரோனீக்குவுக்கும் யூனியாவுக்கும்
  rationale: கிரேக்கப் பெயர்களைத் தமிழில் ஒலிபெயர்க்கிறது; Ἰουνίαν என்பது வரலாற்றுப் பயன்பாட்டின் அடிப்படையில் பெண்பெயரான யூனியா என முதன்மையாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: τοὺς συγγενεῖς μου
  choice: என் இனத்தார்
  rationale: συγγενής என்பது உறவினரையோ ஒரே இனத்தைச் சேர்ந்தவர்களையோ குறிக்கலாம். பவுலின் பயன்பாட்டில் யூத இனத்தாரைக் குறிக்கும் வாய்ப்பு வலுவாக இருப்பதால், உறவுமுறையை மட்டும் நிர்ணயிக்காத ‘இனத்தார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: συναιχμαλώτους μου
  choice: என்னோடு சிறையில் இருந்தவர்கள்
  rationale: உடன் சிறைப்பட்டவர்கள் என்ற நேரடியான பொருளை எளிய, இயல்பான தமிழில் தருகிறது; ஒரே சிறைவாசத்தின் காலம் குறித்த தேவையற்ற துல்லியத்தைத் தவிர்க்கிறது.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: அப்போஸ்தலர்களிடையே குறிப்பிடத்தக்கவர்கள்
  rationale: ἐπίσημοι என்பதன் ‘குறிப்பிடத்தக்க/சிறப்புப் பெற்ற’ பொருளையும் ἐν என்பதன் இயல்பான ‘இடையே’ பொருளையும் நெருக்கமாகக் காக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πρὸ ἐμοῦ γέγοναν ἐν Χριστῷ
  choice: எனக்கு முன்பே மேசியாவுக்குள் இருந்தவர்கள்
  rationale: கால முன்னுரிமையையும் ‘மேசியாவுக்குள்’ என்ற பவுலின் இறையியல் சொற்றொடரையும் விளக்கவுரையாக மாற்றாமல் காக்கிறது.
theological_decisions:
- issue: Ἰουνίαν என்ற பெயரின் பாலின அடையாளம்
  choice: பெண்பெயரான ‘யூனியா’
  alternative: ஆண்பெயரான ‘யூனியாஸ்’
  rationale: கிரேக்க வடிவமும் பண்டைய பெயர்ப் பயன்பாடும் பெண்பெயரை அதிகம் ஆதரிக்கின்றன; வரலாற்றில் செல்வாக்குப் பெற்ற மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
- issue: ἐπίσημοι ἐν τοῖς ἀποστόλοις என்பதன் பொருள்
  choice: ‘அப்போஸ்தலர்களிடையே குறிப்பிடத்தக்கவர்கள்’
  alternative: ‘அப்போஸ்தலர்களுக்கு நன்கு அறியப்பட்டவர்கள்’
  rationale: இச்சொற்றொடர் அவர்களை அப்போஸ்தலர்களுள் சேர்த்துக் குறிப்பிடுகிறதா அல்லது அப்போஸ்தலர்களால் நன்கு அறியப்பட்டவர்கள் என்கிறதா என்பது உண்மையான மொழியியல் விவாதமாகும். முதன்மை உரை கிரேக்கத்தின் இயல்பான உள்ளடக்கப் பொருளைப் பின்பற்றுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ἐν Χριστῷ என்ற மேசியா சார்ந்த சொற்றொடர்
  choice: ‘மேசியாவுக்குள்’
  alternative: ‘கிறிஸ்துவுக்குள்’ அல்லது ‘மேசியாவை நம்பியவர்கள்’
  rationale: Χριστός என்பதைக் பட்டமான ‘மேசியா’ என மொழிபெயர்த்து, ‘உள்ளிருத்தல்’ என்ற பவுலின் உருவகத்தையும் அதன் இறையியல் செறிவையும் விளக்கவுரையால் குறுக்காமல் காக்கிறது.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமாக அமைக்கப்பட்டுள்ளது. ‘அப்போஸ்தலர்’, ‘மேசியா’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; மூலத்தின் உண்மையான பாலின மற்றும் தொடரியல் தெளிவின்மை அடிக்குறிப்புகளில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
