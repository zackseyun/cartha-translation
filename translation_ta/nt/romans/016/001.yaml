source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: ta
  text: கெங்கிரேயாவில் உள்ள திருச்சபையின் பணியாளராகவும்[a] இருக்கும் நம் சகோதரி பெபேயை உங்களுக்குப் பரிந்துரைக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருத்தொண்டராகவும்” அல்லது “ஊழியராகவும்.” கிரேக்கச் சொல் குறிப்பிட்ட திருச்சபைப் பணிப் பொறுப்பையோ, பொதுவாகச் சேவை செய்பவரையோ குறிக்கலாம்.
    reason: διάκονον என்பதன் அங்கீகரிக்கப்பட்ட பணிப் பதவி மற்றும் பொதுச் சேவை ஆகிய இரு சாத்தியமான பொருள்களையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Συνίστημι
  choice: பரிந்துரைக்கிறேன்
  rationale: கடிதச் சூழலில் ஒருவரை வாசகர்களிடம் நன்மதிப்புடன் அறிமுகப்படுத்தி ஏற்றுக்கொள்ளுமாறு கூறும் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: δὲ
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது எதிர்மறை மாறுபாட்டைக் காட்டாமல் மென்மையான உரைமாற்றத்தைக் குறிக்கிறது; தமிழில் புதிய வாக்கியமும் சொல் வரிசையும் அந்த மாற்றத்தை இயல்பாக உணர்த்துகின்றன. ‘இப்போது’ என்று சேர்ப்பது மூலத்தில் இல்லாத காலப்பொருளைத் தோற்றுவிக்கலாம்.
- source_word: Φοίβην
  choice: பெபே
  rationale: கிரேக்கப் பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: நம் சகோதரி
  rationale: பவுலின் திருச்சபைக் குடும்ப மொழியை விளக்கச் சொற்கள் சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: οὖσαν καὶ
  choice: ஆகவும் இருக்கும்
  rationale: பெபேயைப் பற்றிய கூடுதல் அடையாளத் தகவலையும் καί என்பதன் சேர்க்கைப் பொருளையும் தமிழில் இயல்பாகத் தருகிறது.
- source_word: διάκονον
  choice: திருத்தொண்டர்
  rationale: குறிப்பிட்ட உள்ளூர் திருச்சபையுடன் தொடர்புடைய அங்கீகரிக்கப்பட்ட பணிப் பொறுப்பாக இருக்கக்கூடிய பொருளைப் பாதுகாக்கிறது; பிற்காலச் சபை அமைப்புகளின் விவரங்களைச் சேர்க்கவில்லை. பொதுவான ‘பணியாளர்’ என்ற பொருளும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τῆς ἐκκλησίας
  choice: திருச்சபையின்
  rationale: பவுலின் கடிதங்களில் கிறிஸ்தவ விசுவாசிகளின் உள்ளூர் கூடுகையைச் சுட்டும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: கெங்கிரேயாவில் உள்ள
  rationale: இடப்பெயரை எழுத்துப்பெயர்த்து, ἐν என்பதன் இடப்பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: διάκονον என்பது பொதுவான சேவையைக் குறிக்கிறதா அல்லது அங்கீகரிக்கப்பட்ட திருச்சபைப் பணிப் பொறுப்பைக் குறிக்கிறதா
  choice: திருத்தொண்டர்
  alternative: பணியாளர்; ஊழியர்
  rationale: ‘கெங்கிரேயாவில் உள்ள திருச்சபையின்’ என்ற தொடர்பு, ஒரு குறிப்பிட்ட உள்ளூர் திருச்சபையோடு பெபே கொண்டிருந்த அடையாளப்படுத்தத்தக்க பணிப் பொறுப்பைக் காட்டக்கூடும். ‘திருத்தொண்டர்’ அந்த வாய்ப்பைப் பாதுகாக்கிறது; ஆனால் கிரேக்கச் சொல்லின் பரந்த பொருள் உண்மையான மொழிபெயர்ப்பு ஐயமாக இருப்பதால் மாற்றுகள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நம் சகோதரி’ என்ற திருச்சபைக் குடும்ப மொழி அப்படியே வைக்கப்பட்டுள்ளது. ‘திருத்தொண்டர்’ என்பது பெண்ணைக் குறித்தாலும் பாலினத்தைச் சுட்டும் செயற்கையான பதவிப்பெயரை உருவாக்காமல், பொறுப்பின் பெயராகப் பயன்படுத்தப்பட்டுள்ளது.
