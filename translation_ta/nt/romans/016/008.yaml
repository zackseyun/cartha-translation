  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: ta
  text: ஆண்டவருக்குள் என் அன்புக்குரிய அம்பிலியாத்துஸுக்கு[a] வாழ்த்துச் சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தக் கிரேக்கப் பெயர் வடிவம் ‘அம்பிலியாஸ்’ என்றும் வழங்கப்படலாம்; இங்குள்ள SBLGNT வாசகம் ‘அம்பிலியாத்துஸ்’ என்ற வடிவத்தை ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துச் சொல்லுங்கள்
  rationale: கடிதங்களில் ஒருவருக்கு வாழ்த்தைத் தெரிவிக்கும்படி கூறும் இரண்டாம் நபர் பன்மை கட்டளையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἀμπλιᾶτον
  choice: அம்பிலியாத்து
  rationale: SBLGNT-இன் Ἀμπλιᾶτον என்ற வேற்றுமை வடிவம் Ἀμπλιᾶτος (Ampliatus) என்ற பெயரைக் குறிக்கிறது; தமிழில் பெயரின் எழுவாய் வடிவமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀγαπητόν μου
  choice: எனக்கு அன்பான
  rationale: பவுலின் தனிப்பட்ட பாசத்தையும் கிரேக்கத்தின் சுருக்கத்தையும் இயல்பான தமிழில் காக்கிறது; ‘என் அன்புக்குரிய’ என்பதும் சாத்தியம்.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் வழக்கமான சொற்றொடரில் காணப்படும் ஆண்டவருடனான உறவு அல்லது வாழ்வின் தளத்தைச் சுருக்கமாகக் காக்கிறது; கிரேக்கத்தில் இல்லாத ‘இயேசு’ சேர்க்கப்படவில்லை.
theological_decisions:
- issue: பவுலின் அன்புக்கும் ἐν κυρίῳ என்பதற்கும் இடையிலான தொடர்பு
  choice: ‘ஆண்டவருக்குள் எனக்கு அன்பான’ என்பது அம்பிலியாத்துவை விவரிப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ἐν κυρίῳ என்பதை வாழ்த்துச் சொல்லும் செயலுடன் இணைத்தல், அல்லது இதை வெறும் தனிப்பட்ட நட்பாகத் தளர்த்துதல்.
  rationale: கிரேக்கச் சொல் வரிசையும் இலக்கண அமைப்பும் τὸν ἀγαπητόν μου ἐν κυρίῳ என்ற முழுத் தொடரையும் அம்பிலியாத்துவுடன் இயல்பாக இணைக்கின்றன. இம்மொழிபெயர்ப்பு கிறிஸ்தவ உறவுக்குள் அமைந்த பவுலின் பாசத்தைத் தக்கவைக்கிறது; அதன் துல்லியமான தத்துவ இயல்பை மேலதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ‘வாழ்த்துச் சொல்லுங்கள்’ என்பது கடிதச் சூழலுக்கு இயல்பானது; ‘ஆண்டவருக்குள்’ என்பது பவுலின் சுருக்கமான இறையியல் மொழியைத் தக்கவைக்கிறது.
