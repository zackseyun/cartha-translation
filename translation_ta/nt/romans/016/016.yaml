id: ROM.16.16
reference: Romans 16:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: ta
  text: தூய முத்தத்துடன் ஒருவரையொருவர் வாழ்த்துங்கள்.[a] மெசியாவுக்குரிய சபைகள் அனைத்தும் உங்களை வாழ்த்துகின்றன.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூய முத்தம்’ என்பது விசுவாசிகளிடையே தூய அன்பையும் உறவையும் வெளிப்படுத்திய, அக்காலத்தில் அறியப்பட்ட வாழ்த்தும் முறையாகும்.
    reason: cultural_note
  - marker: b
    text: ‘மெசியாவுக்குரிய’ என்பதை ‘கிறிஸ்துவுக்குரிய’ என்றும் மொழிபெயர்க்கலாம்.
    reason: translation_alternative
  - marker: c
    text: சில கையெழுத்துப் பிரதிகளில் ‘அனைத்தும்’ என்ற சொல் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: ஒருவரையொருவர் வாழ்த்துங்கள்
  rationale: ἀσπάσασθε என்பது வாழ்த்தும்படியான கட்டளை; ἀλλήλους பரஸ்பரச் செயலைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இரண்டையும் தெளிவாகக் கொடுக்கிறது.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: தூய முத்தத்துடன்
  rationale: ἐν இங்கு வாழ்த்தும் முறையையோ உடன்நிகழும் செயலையோ குறிக்கிறது. φίλημα என்பது முத்தம்; ἁγίῳ என்பது விசுவாசிகளின் உறவுக்கேற்ற தூய தன்மையைச் சுட்டுகிறது.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: உங்களை வாழ்த்துகின்றன
  rationale: கடிதச் சூழலில் ἀσπάζονται என்பது வாழ்த்துத் தெரிவிப்பதைக் குறிக்கிறது; ὑμᾶς பன்மை முன்னிலையைச் சுட்டுகிறது. ‘உங்களை’ என்பது தமிழில் சூழலுக்கு ஏற்ற இயல்பான வடிவம்.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: சபைகள் அனைத்தும்
  rationale: பெயர்ச்சொல்லுடன் வரும் πᾶσαι-யின் முழுமை வலியுறுத்தலை ‘அனைத்தும்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: τοῦ Χριστοῦ
  choice: மெசியாவுக்குரிய
  rationale: Χριστός இங்கு சபைகள் யாருக்குரியவை என்பதைக் காட்டும் பட்டமாகப் புரிந்துகொள்ளலாம். ‘மெசியாவுக்குரிய’ என்பது பட்டத்தின் எபிரேயப் பின்னணியையும் உடைமை/தொடர்பு பொருளையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவுக்குரிய
  alternative: கிறிஸ்துவுக்குரிய
  rationale: Χριστός-ஐ பெயரைப்போல் மட்டும் அல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டமாக வாசிக்க இச்சூழல் இடமளிக்கிறது. ஆகவே ‘மெசியா’ முதன்மை உரையில் வைக்கப்படுகிறது; மரபான ‘கிறிஸ்து’ மாற்று மொழிபெயர்ப்பாகக் குறிப்பில் தரப்படுகிறது.
- issue: சபைகளின் முழுமையைச் சுட்டும் πᾶσαι
  choice: அனைத்தும் என்பதை முதன்மை உரையில் வைத்தல்
  alternative: சபைகள் உங்களை வாழ்த்துகின்றன
  rationale: SBLGNT முதன்மை உரையில் πᾶσαι உள்ளது; அதேவேளை அதற்கான உரைவேறுபாட்டு குறியீடும் உள்ளது. எனவே முதன்மை வாசகம் உரையில் வைக்கப்பட்டு, குறுகிய வாசகம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருமுத்தம்’ போன்ற குறுகிய சமயவழக்குச் சொல்லுக்குப் பதிலாக மூலத்தின் பொருளை நேரடியாகத் தரும் ‘தூய முத்தம்’ தேர்ந்தெடுக்கப்பட்டது; ‘சபைகள்’ என்பது பரவலாக அறியப்பட்ட திருச்சபைச் சொல்வழக்கைத் தக்கவைக்கிறது.
