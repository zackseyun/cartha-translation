source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: ta
  text: உங்களுடைய கீழ்ப்படிதல் அனைவரிடமும் சென்றடைந்துள்ளது[a]. ஆகையால், உங்களைக் குறித்து நான் மகிழ்கிறேன்[b]. ஆனால் நீங்கள் நன்மையைக் குறித்து ஞானமுள்ளவர்களாகவும், தீமையைக் குறித்து களங்கமற்றவர்களாகவும்[c] இருக்க வேண்டுமென்று விரும்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுடைய கீழ்ப்படிதல் அனைவருக்கும் தெரியவந்துள்ளது.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “உங்களுடைய கீழ்ப்படிதல் அனைவரிடமும் சென்றடைந்துள்ளது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களால் நான் மகிழ்கிறேன்.”
    reason: lexical_alternative
  - marker: c
    text: “களங்கமற்றவர்களாக” என்பதற்கு “தூயவர்களாக” அல்லது “கபடமற்றவர்களாக” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: கீழ்ப்படிதல்
  rationale: பவுலின் பயன்பாட்டில் இது வெறுமனே கேட்டலை அல்ல, கீழ்ப்படிந்து மறுமொழி அளிப்பதைக் குறிக்கிறது.
- source_word: εἰς πάντας ἀφίκετο
  choice: எல்லாரிடமும் எட்டியுள்ளது
  rationale: ‘எட்டியது/சென்றடைந்தது’ என்ற கிரேக்க உருவகத்தை இயல்பான தமிழில் காக்கிறது; அவர்களுடைய கீழ்ப்படிதல் பரவலாக அறியப்பட்டதையும் சூழலில் உணர்த்துகிறது.
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: உங்களைக் குறித்து நான் மகிழ்கிறேன்
  rationale: ἐπί + வேற்றுமை வடிவம் மகிழ்ச்சிக்கான காரணத்தையோ பொருளையோ குறிக்கலாம்; இந்தத் தமிழ் இரண்டையும் இயல்பாகத் தாங்குகிறது.
- source_word: σοφοὺς ... εἰς τὸ ἀγαθόν
  choice: நன்மையானவற்றைக் குறித்து ஞானமுள்ளவர்களாக
  rationale: நன்மை சார்ந்த நடைமுறைப் பகுத்தறிவை வெளிப்படுத்துகிறது; εἰς குறிக்கும் தொடர்பு அல்லது துறையை மிகையாக விளக்கவில்லை.
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: தீமையானவற்றைக் குறித்து களங்கமற்றவர்களாக
  rationale: ἀκέραιος என்பதன் கலப்பற்ற, தூய, குற்றமற்ற என்ற பொருள் வரம்பை ‘களங்கமற்ற’ இயல்பாக எடுத்துரைக்கிறது; அறியாமை அல்லது வெகுளித்தனத்தைப் புகுத்துவதில்லை.
theological_decisions:
- issue: πάντας என்பதன் பரப்பு
  choice: ‘எல்லாரிடமும்’ என்று பரந்த, சொல்லாட்சிசார் பாராட்டாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எல்லா மக்களிடமும்’ அல்லது ‘எல்லாச் சபைகளிலும்’
  rationale: இது கணிதரீதியான முழுமையைக் கட்டாயப்படுத்தாமல், அவர்களுடைய கீழ்ப்படிதல் பரவலாக அறியப்பட்டதைச் சொல்கிறது; சபைகள் என்ற வரம்பை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
- issue: σοφούς ... ἀκεραίους என்ற அறநெறி எதிரிணை
  choice: நன்மையைக் குறித்து ஞானமும் தீமையைக் குறித்து களங்கமின்மையும் என்ற எதிரிணை காக்கப்பட்டது.
  alternative: நன்மையில் திறமையும் தீமையைப் பற்றிய அறியாமையும்
  rationale: முதிர்ந்த அறப்பகுத்தறிவையும் தீமையால் மாசுபடாத நிலையையும் உரை வலியுறுத்துகிறது; தீமையைப் பற்றிய வெறும் அறியாமை என்ற கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நன்மை/தீமை குறித்த இணை அமைப்பும், மூலத்தின் அறநெறி எதிரிணையும் காக்கப்பட்டுள்ளன.
