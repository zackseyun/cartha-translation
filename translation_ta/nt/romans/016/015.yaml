reference: Romans 16:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: ta
  text: பிலொலோகுவுக்கும் யூலியாவுக்கும்[a], நேரேயுவுக்கும் அவனுடைய சகோதரிக்கும், ஒலிம்பாவுக்கும், அவர்களோடு இருக்கும் எல்லாப் பரிசுத்தவான்களுக்கும் வாழ்த்துத் தெரிவியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இப்பெயரை ஆண்பால் பெயராக எடுத்தால், “யூலியாஸ்” என இருக்கலாம்; எனினும் கிரேக்க வடிவம் பொதுவாகப் பெண்பால் பெயரான “யூலியா” என்றே புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துச் சொல்லுங்கள்
  rationale: கடிதச் சூழலில் வாழ்த்தைத் தெரிவிக்கும்படி கூறும் பன்மை ஏவல்; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Φιλόλογον
  choice: பிலொலொகு
  rationale: தனிப்பெயரான Φιλόλογος என்பதன் கிரேக்க ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்; வேற்றுமை உருபு இணைக்கப்பட்டுள்ளது.
- source_word: Ἰουλίαν
  choice: யூலியாள்
  rationale: இவ்வடிவம் இயல்பாகப் பெண்பால் பெயரான Julia-வைக் குறிக்கிறது; தமிழில் பெண்பால் தனிப்பெயர் என்பதைத் தெளிவாக்கும் மரபான வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Νηρέα
  choice: நேரேயு
  rationale: தனிப்பெயரான Νηρεύς என்பதன் கிரேக்க ஒலிப்பை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: அவனுடைய சகோதரி
  rationale: ἀδελφή என்பதற்கு இயல்பான தமிழ் ‘சகோதரி’; αὐτοῦ நேரேயுவைக் குறிப்பதால் ஆண்பால் ஒருமை உடைமைச் சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ὀλυμπᾶν
  choice: ஒலிம்பா
  rationale: தனிப்பெயரான Ὀλυμπᾶς என்பதன் கிரேக்க வடிவத்தைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: τοὺς σὺν αὐτοῖς
  choice: அவர்களோடு இருக்கும்
  rationale: σύν உடனிருப்பதையும் தொடர்பையும் குறிக்கிறது; பெயரிடப்பட்ட நபர்களோடு இருப்பவர்களைத் தமிழில் இயல்பாகச் சுட்டுகிறது.
- source_word: πάντας ἁγίους
  choice: பரிசுத்தவான்கள் அனைவரும்
  rationale: பவுலின் பயன்பாட்டில் ἅγιοι சக விசுவாசிகளைக் குறிக்கும் வழக்கமான திருச்சபைச் சொல்; πάντας என்பதன் முழுமையும் ‘அனைவரும்’ மூலம் காக்கப்படுகிறது.
theological_decisions:
- issue: பவுலின் வாழ்த்துப் பட்டியலில் ἅγιοι என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்தவான்கள்
  alternative: பரிசுத்த மக்கள்; இறைவனுக்குரிய மக்கள்
  rationale: இங்கு பெயரிடப்பட்டவர்களுடன் இருக்கும் சக விசுவாசிகளைக் குறிக்கிறது. ‘பரிசுத்தவான்கள்’ பவுலின் வழக்கமான அடையாளச் சொல்லைப் பாதுகாக்கிறது; பின்னாளைய புனிதர் பட்டமளிப்பு என்ற கருத்தைச் சேர்க்க வேண்டியதில்லை.
- issue: Ἰουλίαν என்ற பெயரின் பாலினம்
  choice: யூலியாள்
  alternative: யூலியாஸ்
  rationale: கிரேக்க வடிவமும் பொதுவான பெயரியல் பயன்பாடும் பெண்பால் Julia என்ற புரிதலையே அதிகம் ஆதரிக்கின்றன. ஆயினும் மொழிபெயர்ப்பு வரலாற்றில் முன்வைக்கப்பட்ட ஆண்பால் சாத்தியம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கடித நடையில் அமைக்கப்பட்டுள்ளது. பெயர்கள் மூலக் கிரேக்க ஒலிப்பை நெருக்கமாகப் பின்பற்றுகின்றன; ‘பரிசுத்தவான்கள்’ என்ற நிறுவப்பட்ட பவுலிய சொல் தக்கவைக்கப்பட்டுள்ளது.
