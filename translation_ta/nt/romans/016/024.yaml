id: ROM.16.24
reference: Romans 16:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: ta
  text: நம் ஆண்டவராகிய இயேசு மேசியாவின்[b] அருள் உங்கள் அனைவரோடும் இருப்பதாக.[a] ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் இந்த வசனம் உள்ளது; வேறு சிலவற்றில் இது இல்லை. ரோமர் திருமுகத்தின் முடிவில் காணப்படும் உரைவேறுபாடாகப் பல நவீன பதிப்புகள் இதைக் குறிக்கின்றன.
    reason: textual_variant
  - marker: b
    text: 'அல்லது: ‘இயேசு கிறிஸ்துவின்.’ கிரேக்க Χριστός என்ற பட்டத்தை மரபான ஒலிபெயர்ப்பில் ‘கிறிஸ்து’ என்றும் வழங்கலாம்; இங்கு அதன் பொருளை வெளிப்படுத்த ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: alternative_rendering
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்துகளில் கடவுளின் இலவசமான தயவையும் கொடையையும் குறிக்கும் சொல்லாக இருப்பதால், இயல்பானதும் இறையியல் செறிவுடையதுமான ‘அருள்’ பயன்படுத்தப்பட்டது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: இங்கு இயேசுவின் ஆளுகையையும் உயர்ந்த நிலையையும் குறிக்கும் பட்டமாக κύριος வருவதால், வழக்கமான தமிழ் வேதாகமச் சொல்லான ‘ஆண்டவர்’ பொருத்தமானது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மேசியா
  rationale: Χριστός இங்கு வெறும் பெயரின் பகுதியாக மட்டுமல்லாமல் பட்டத்தின் பொருளையும் தக்கவைத்துள்ளது. ஆகவே அதன் பொருளை வெளிப்படுத்த ‘மேசியா’ என மொழிபெயர்க்கப்பட்டது; மூலத்தின் பெயர்–பட்ட வரிசையும் காக்கப்பட்டது.
- source_word: μετὰ πάντων ὑμῶν
  choice: உங்கள் அனைவரோடும்
  rationale: μετά உடனிருப்பதைக் குறிக்கிறது; πάντων ὑμῶν முழுச் சபையாரையும் உள்ளடக்குகிறது. ‘உங்கள் அனைவரோடும்’ என்பது இயல்பாகவும் முழுமையாகவும் இதைத் தெரிவிக்கிறது.
- source_word: Ἀμήν
  choice: ஆமென்
  rationale: வழிபாட்டு உறுதிப்பாட்டைக் குறிக்கும் மரபான தமிழ் ஒலிபெயர்ப்பு தக்கவைக்கப்பட்டது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστός-ஐ மொழிபெயர்த்தல்
  choice: இயேசு மேசியா
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர் / மேசியா’ என்ற பட்டப் பொருளை வாசகருக்கு வெளிப்படையாகக் காட்ட ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது. மரபான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் வழங்கப்படுகிறது; இதனால் இரு பிரதிநிதித்துவங்களும் தெளிவாகின்றன.
- issue: வசனத்தின் உரைநிலை
  choice: வசனத்தை முதன்மை உரையில் வைத்து உரைவேறுபாட்டைக் குறித்தல்
  alternative: வசனத்தை முதன்மை உரையிலிருந்து விடுதல்
  rationale: SBLGNT இந்த வாசகத்தை உரையில் குறியீடுகளுடன் வழங்குகிறது; கையெழுத்துப் பிரதிகளின் முக்கிய வேறுபாட்டை மறைக்காமல் அடிக்குறிப்பில் தெரிவிப்பது மூல ஆதாரத்தின் ஐயப்பாட்டைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஆசீர்வாத நடையில் வடிவமைக்கப்பட்டது. ‘இருப்பதாக’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாத வினைச்சொல்லை தமிழில் இயல்பான வாழ்த்தாக நிறைவு செய்கிறது. உரைவேறுபாட்டு குறி முழு ஆசீர்வாத வாக்கியத்திற்குப் பின் வைக்கப்பட்டுள்ளது; பட்டத்திற்கான மாற்று வடிவக் குறி ‘மேசியா’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
