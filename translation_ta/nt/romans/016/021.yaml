id: ROM.16.21
reference: Romans 16:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: ta
  text: என் உடன் பணியாளரான தீமோத்தேயு உங்களுக்கு வாழ்த்துச் சொல்கிறார். என் உறவினர்களான[a] லூக்கியு, யாசோன், சோசிபத்தர் ஆகியோரும் உங்களுக்கு வாழ்த்துச் சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் உறவினர்கள்” என்பதற்கு “என் இனத்தவர்கள்” அல்லது “என் சக யூதர்கள்” என்றும் பொருள் கொள்ளலாம். கிரேக்கச் சொல் குடும்ப உறவையோ, விரிவான இன உறவையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: வாழ்த்துச் சொல்கிறார்
  rationale: கடிதச் சூழலில் ἀσπάζομαι என்பது ஒருவருக்கு வாழ்த்துத் தெரிவிப்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தனிப்பட்ட வாழ்த்தின் உணர்வுடனும் அமையும் சொற்றொடர் இது.
- source_word: ὑμᾶς
  choice: உங்களுக்கு
  rationale: இது இரண்டாம் நபர் பன்மை வடிவம்; ரோமிலுள்ள பெறுநர்கள் அனைவரையும் கூட்டாகக் குறிக்கிறது.
- source_word: συνεργός
  choice: உடன் பணியாளர்
  rationale: பவுலுடன் சேர்ந்து ஒரே பணியில் உழைப்பவரைக் குறிக்கிறது. ‘உடன் பணியாளர்’ என்பது ஒத்துழைத்துப் பணியாற்றும் பொருளை இயல்பான நவீன தமிழில் தருகிறது; பணியின் தன்மையை மூலத்தைவிடக் குறுக்கி விளக்குவதில்லை.
- source_word: Τιμόθεος
  choice: தீமோத்தேயு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: Λούκιος
  choice: லூக்கியு
  rationale: கிரேக்கப் பெயரின் ஒலியைத் தெளிவாகக் காட்டும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: Ἰάσων
  choice: யாசோன்
  rationale: கிரேக்கப் பெயருக்குரிய வழக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: Σωσίπατρος
  choice: சோசிபத்தர்
  rationale: இந்த வசனத்தில் உள்ள முழு கிரேக்கப் பெயர் வடிவத்தைப் பிரதிபலிக்கும், தமிழில் அறியப்பட்ட எழுத்துப்பெயர்ப்பு.
- source_word: συγγενεῖς
  choice: உறவினர்கள்
  rationale: இச்சொல் இரத்த உறவினர்களையோ, விரிவான இன அல்லது சமூக உறவுடையவர்களையோ குறிக்கலாம். ‘உறவினர்கள்’ குடும்பத் தொடர்பின் முதன்மை உணர்வைத் தருகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: συγγενεῖς μου என்ற சொற்றொடரின் பரப்பளவு
  choice: என் உறவினர்கள்
  alternative: என் இனத்தவர்கள்; என் சக யூதர்கள்
  rationale: பவுல் நெருங்கிய குடும்ப உறவினர்களைக் குறிப்பிடுகிறாரா அல்லது தம்மைப் போன்ற யூதர்களைக் குறிப்பிடுகிறாரா என்பதை வசனம் தெளிவுபடுத்தவில்லை. ஆகவே முதன்மை உரை உறவைக் குறிக்கும் பொதுவான சொல்லைப் பயன்படுத்தி, சாத்தியமான இனச் சார்ந்த பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் முதலில் தீமோத்தேயுவை ஒருமை வினையுடன் குறிப்பிட்டு, பின்னர் மற்றவர்களை இணைக்கும் அமைப்பு தமிழில் தெளிவாக இருக்க இரண்டு வாக்கியங்களாகத் தரப்பட்டுள்ளது. பெயர்கள் தமிழ் கிறிஸ்தவ வாசகர்களுக்கு அறிமுகமான வடிவங்களில் வழங்கப்பட்டுள்ளன.
