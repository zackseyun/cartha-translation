source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: ta
  text: எனக்கும் முழுத் திருச்சபைக்கும் விருந்தோம்பல் செய்கிறவரான காயு உங்களுக்கு வாழ்த்துத் தெரிவிக்கிறார். நகரப் பொருளாளரான[a] எரஸ்து உங்களுக்கு வாழ்த்துத் தெரிவிக்கிறார். சகோதரரான குவார்த்து உங்களுக்கு வாழ்த்துத் தெரிவிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நகர நிர்வாகி.’ கிரேக்கச் சொல் நகரத்தின் அலுவல்களை நிர்வகித்த பொறுப்பாளரைப் பொதுவாகவும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: வாழ்த்துத் தெரிவிக்கிறார் / வாழ்த்துத் தெரிவிக்கிறார்கள்
  rationale: பவுலின் கடித முடிவுகளில் இச்சொல் ஒருவருடைய வாழ்த்தை மற்றவர்களுக்கு அறிவிப்பதைக் குறிக்கிறது. தமிழில் எழுவாயின் எண்ணிக்கைக்கேற்ப ஒருமை மற்றும் பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ξένος
  choice: விருந்தோம்பல் செய்கிறவர்
  rationale: இங்கு காயு அந்நியர் அல்லது விருந்தினர் என்ற பொருள் அல்ல; பவுலையும் திருச்சபையினரையும் ஏற்று உபசரிப்பவர் என்பதே சூழலுக்குப் பொருந்துகிறது. ‘விருந்தோம்பல் செய்கிறவர்’ என்பது அந்த உறவையும் செயலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: திருச்சபை முழுவதற்கும்
  rationale: ἐκκλησία இங்கு கிறிஸ்தவ நம்பிக்கையாளர் சமூகத்தைக் குறிக்கிறது. ὅλης என்பதன் விரிவை ‘முழுவதற்கும்’ தக்கவைக்கிறது.
- source_word: οἰκονόμος τῆς πόλεως
  choice: நகரப் பொருளாளர்
  rationale: οἰκονόμος என்பது நிர்வாகி அல்லது பொறுப்பாளர் என்ற பரந்த பொருளையும் கொள்ளலாம். நகராட்சி அலுவல் சூழலில் நிதிப் பொறுப்புடைய அதிகாரி என்பது சாத்தியமான பொருள்; பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀδελφός
  choice: சகோதரனாகிய
  rationale: ஆண்பால் ஒருமையில் வரும் குடும்ப உறவுச் சொல் இங்கு குவார்த்தை சக விசுவாசியாகக் குறிப்பிடுகிறது. மூலத்தில் இல்லாத ‘நமது’ என்ற உடைமைச்சொல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ἐκκλησία என்பதன் மொழிபெயர்ப்பு
  choice: திருச்சபை
  alternative: சபை / விசுவாசிகள் கூட்டம்
  rationale: பவுலின் பயன்பாட்டில் இது கிறிஸ்தவ விசுவாசிகள் சமூகத்தைக் குறிக்கிறது. ‘திருச்சபை’ நவீனத் தமிழில் புரிந்துகொள்ளத்தக்க நிலையான சொல்; குறிப்பிட்ட திருச்சபை அமைப்பியல் கோட்பாட்டை இங்கு கூடுதலாகச் சேர்ப்பதில்லை.
- issue: ὁ ἀδελφός என்பதில் உறவுமுறை
  choice: சகோதரனாகிய
  alternative: நமது சகோதரன் / சக விசுவாசி
  rationale: மூலத்தின் ஆண்பால் ஒருமையையும் குடும்ப உருவகத்தையும் காக்கிறது. ‘நமது’ என்பது மூலத்தில் இல்லாத விரிவாக்கம்; ‘சக விசுவாசி’ என்பது உருவகத்தை விளக்கமாக மாற்றிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், கடிதத்தின் வாழ்த்து நடையை இயல்பாகவும் கண்ணியமாகவும் வைத்திருக்கிறது. ‘விருந்தோம்பல் செய்கிறவர்’ என்ற சொற்றொடர் ξένος என்பதன் சூழல்சார் பொருளைத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறி அது விளக்கும் ‘நகரப் பொருளாளர்’ என்பதன் உடனேயே வைக்கப்பட்டுள்ளது.
