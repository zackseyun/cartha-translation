source:
  edition: SBLGNT
  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: ta
  text: நான், கடிதத்தை எழுதிய தெர்த்தியு, ஆண்டவருக்குள் உங்களை வாழ்த்துகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சாத்தியம் குறைவாக: “நான், ஆண்டவருக்குள் கடிதத்தை எழுதிய தெர்த்தியு, உங்களை வாழ்த்துகிறேன்.” கிரேக்கத்தில் “ஆண்டவருக்குள்” என்ற சொற்றொடரை “எழுதிய” என்பதுடன் இணைத்தும் புரிந்துகொள்ளலாம்; எனினும், அது “வாழ்த்துகிறேன்” என்பதுடன் இணைவதே அதிக இயல்பானது.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: வாழ்த்துகிறேன்
  rationale: கடிதத்தின் நிறைவுப் பகுதியில் ஒருவருக்குத் தனது வாழ்த்தைத் தெரிவிப்பதைக் குறிக்கும் இயல்பான, சுருக்கமான நவீனத் தமிழ் சொல்.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: இரண்டாம் நபர் பன்மைச் சுட்டுப்பெயரின் நேரடி பொருள்; தமிழில் பன்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐγὼ Τέρτιος
  choice: தெர்த்தியுவாகிய நான்
  rationale: வெளிப்படையாக இடம்பெறும் ‘நான்’ என்பதையும், பேசுபவர் தெர்த்தியு என்ற தனித்த அடையாளத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ὁ γράψας
  choice: எழுதிய
  rationale: தெர்த்தியுவை இந்தக் கடிதத்தை எழுதிய நபராக அடையாளப்படுத்தும் இறந்தகாலப் பெயரெச்சத்தின் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: τὴν ἐπιστολήν
  choice: இந்தக் கடிதத்தை
  rationale: ἐπιστολή என்பதற்கு நவீனத் தமிழில் ‘கடிதம்’ இயல்பானது. கிரேக்கத்தில் சுட்டுப்பெயர் இல்லாவிட்டாலும், பேசுபவர் எழுதிக்கொண்டிருக்கும் குறிப்பிட்ட கடிதத்தைத் தமிழில் இயல்பாகச் சுட்ட ‘இந்த’ பயன்படுத்தப்படுகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் கடிதங்களில் வழக்கமான உறவு அல்லது ஐக்கியத்தின் வட்டத்தைச் சுட்டும் சொற்றொடரை விளக்கிச் சுருக்காமல் பாதுகாக்கிறது; κύριος என்பது ‘ஆண்டவர்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ἐν κυρίῳ (‘ஆண்டவருக்குள்’) எந்தச் செயலுடன் இணைகிறது?
  choice: 'முதன்மை வினையான ‘வாழ்த்துகிறேன்’ என்பதுடன் இணைக்கப்பட்டுள்ளது: தெர்த்தியு ஆண்டவருக்குள் வாசகர்களை வாழ்த்துகிறார்.'
  alternative: ‘இந்தக் கடிதத்தை எழுதிய’ என்பதுடன் இணைத்து, தெர்த்தியு ஆண்டவருக்குள் கடிதத்தை எழுதியதாக வாசித்தல்.
  rationale: கடித நிறைவின் வாழ்த்துச் சூழலில் இச்சொற்றொடர் முதன்மை வாழ்த்தை இயல்பாகத் தகுதிப்படுத்துகிறது. எனினும், கிரேக்கச் சொல்வரிசை மற்ற இணைப்பையும் இலக்கணரீதியாக அனுமதிப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘தெர்த்தியுவாகிய நான்’ என்பது எழுத்தாளரின் தனித்த சுயஅடையாளத்தைப் பாதுகாக்கிறது; ‘ஆண்டவருக்குள்’ என்ற இறையியல் சார்ந்த உறவுச் சொற்றொடர் விளக்கமாக மாற்றப்படாமல் வைக்கப்பட்டுள்ளது.
