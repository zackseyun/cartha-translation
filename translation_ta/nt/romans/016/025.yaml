  text: '[a] என் நற்செய்தியின்படியும், இயேசு மெசியாவின் அறிவிப்பின்படியும், நெடுங்காலங்களாக வெளிப்படுத்தப்படாமல் இருந்த மறைபொருளின் வெளிப்பாட்டின்படியும் உங்களை உறுதிப்படுத்த வல்லவருக்கு—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 25–27 வசனங்கள் நிறைவு புகழுரையாக அமைகின்றன; பழைய கையெழுத்துப் பிரதிகளில் இது வெவ்வேறு இடங்களில் காணப்படுகிறது. பைசாந்தியப் பெரும்பான்மை மரபில் இது 14ஆம் அதிகாரத்தின் முடிவிலும், இன்று கிடைக்கும் மிகப் பழைய பப்பிரஸ் பிரதியில் 15ஆம் அதிகாரத்திற்குப் பின்னரும், முக்கியமான நான்காம் நூற்றாண்டுப் பிரதிகளிலும் இலத்தீன் மரபிலும் இங்குள்ளபடி 16ஆம் அதிகாரத்தின் முடிவிலும் உள்ளது. சில பிரதிகள் இதை ஒன்றுக்கு மேற்பட்ட இடங்களில் கொண்டுள்ளன; சில பிரதிகள் இதை முற்றிலும் விடுகின்றன. பெரும்பாலான நவீன மொழிபெயர்ப்புகள் பவுலின் கடிதத்தின் முடிவாக இதை இங்கேயே வைக்கின்றன.
