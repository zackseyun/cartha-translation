  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: ta
  text: கர்த்தருக்குள் தேர்ந்தெடுக்கப்பட்ட ரூபுவுக்கும், அவருடைய தாயாருக்கும்—அவர் எனக்கும் தாயானவர்—வாழ்த்துச் சொல்லுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துச் சொல்லுங்கள்
  rationale: பன்மை கட்டளை வடிவில் வரும் இந்த வினை, பவுலின் நிறைவு வாழ்த்துகளின் சூழலில் ஒருவருக்கு வாழ்த்துத் தெரிவிப்பதைக் குறிக்கிறது; நவீன தமிழில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Ῥοῦφον
  choice: ரூபு
  rationale: Ῥοῦφος என்ற நபர்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு; வேற்றுமை உருபுடன் ‘ரூபுவுக்கும்’ என வருகிறது.
- source_word: ἐκλεκτὸν
  choice: தேர்ந்தெடுக்கப்பட்டவர்
  rationale: ‘தேர்ந்தெடுக்கப்பட்டவர்’ என்ற முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது; இது வெறும் தொழில்நுட்ப இறையியல் சொல்லாகச் சுருங்காமல், ‘சிறப்புக்குரியவர்’ என்ற சாத்தியமான நிழற்பொருளுக்கும் குறிப்பில் இடமளிக்கிறது.
- source_word: ἐν κυρίῳ
  choice: கர்த்தருக்குள்
  rationale: கர்த்தரோடு உள்ள உறவு அல்லது அவரில் உள்ள நிலை என்ற பொருளை இயல்பான திருவிவிலியத் தமிழில் காக்கிறது; ‘கர்த்தரால்’ என்று காரணத்தைத் தீர்மானித்துவிடவில்லை.
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: அவருக்கும் எனக்கும் தாயானவர்
  rationale: ஒரே பெண் ரூபுவின் தாயாகவும் பவுலுக்கு அன்பிலும் பராமரிப்பிலும் தாய்போன்றவராகவும் இருந்தார் என்பதைத் தெளிவாக்குகிறது; மூலத்தின் ‘அவருடையதும் என்னுடையதும் [தாய்]’ என்ற சுருக்கமான அமைப்பை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ἐκλεκτὸν ἐν κυρίῳ என்பதன் பொருள்
  choice: கர்த்தருக்குள் தேர்ந்தெடுக்கப்பட்டவர்
  alternative: கர்த்தருக்குள் சிறந்தவர் / சிறப்புக்குரியவர்
  rationale: இச்சொற்றொடர் இறைவனால் தேர்ந்தெடுக்கப்பட்ட நிலையை அல்லது கிறிஸ்தவச் சமூகத்தில் சிறப்புக்குரியவராக இருப்பதைச் சுட்டலாம். முதன்மை மொழிபெயர்ப்பு ‘தேர்ந்தெடுக்கப்பட்டவர்’ என்பதை வைத்துக்கொண்டு, மாற்றுப் பொருளைக் குறிப்பில் தருவதால் இறையியல் இழுபறி தீர்த்துவிடப்படவில்லை.
- issue: ‘அவருக்கும் எனக்கும் தாயானவர்’ என்பதன் உறவு
  choice: ரூபுவின் தாயை பவுல் தமக்கும் தாயானவர் என அன்புறவின் அடிப்படையில் குறிப்பிடுகிறார்
  alternative: அவர் பவுலின் உடன்பிறப்புத் தாயும் ஆவார்
  rationale: கடிதச் சூழல் அன்பு, பராமரிப்பு சார்ந்த உருவகக் குடும்ப உறவையே வலுவாகச் சுட்டுகிறது. இருப்பினும் மொழிபெயர்ப்பு ‘தாய்’ என்ற மூலச் சொல்லைக் காத்து, அதற்கு மேலான விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, மரியாதையான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அவருக்கும் எனக்கும் தாயானவர்’ என்பது ஒரே நபரைக் குறிப்பதைத் தெளிவாக்குவதோடு பவுலின் அன்பான குடும்ப மொழியையும் காக்கிறது.
