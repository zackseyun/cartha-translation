  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: ta
  text: மேசியாவில் தகுதி நிரூபிக்கப்பட்ட அப்பெல்லேக்கு வாழ்த்துச் சொல்லுங்கள். அரிஸ்தொபூலுவின் வீட்டாரைச் சேர்ந்தவர்களுக்கு வாழ்த்துச் சொல்லுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துச் சொல்லுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தையும், ரோமர் 16-இல் திரும்பத் திரும்ப வரும் வாழ்த்து தெரிவிக்கும் நடையையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: Ἀπελλῆν
  choice: அப்பெல்லே
  rationale: கிரேக்க ஆள்பெயரைத் தமிழின் ஒலியமைப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
- source_word: τὸν δόκιμον
  choice: சோதிக்கப்பட்டுத் தகுதியுள்ளவர் என நிரூபிக்கப்பட்ட
  rationale: δόκιμος என்பதில் உள்ள சோதிக்கப்பட்டு உண்மையானவர் அல்லது தகுதியானவர் என ஏற்றுக்கொள்ளப்பட்டவர் என்ற பாராட்டுப் பொருளை வெளிப்படுத்துகிறது; வெறுமனே ‘அங்கீகரிக்கப்பட்டவர்’ என்று கூறுவதைவிட மூலச்சொல்லின் சோதனை சார்ந்த நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவுக்குள்
  rationale: பவுலின் உறவு அல்லது ஆன்மிகச் சூழலைக் குறிக்கும் ‘ἐν’ மொழிநடையை விளக்கவுரையாக மாற்றாமல் காக்கிறது; Χριστός இங்கு பட்டப்பெயரின் வலிமையுடன் இருப்பதால் ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: அரிஸ்தொபூலுவின் வீட்டாரைச் சேர்ந்தவர்கள்
  rationale: சொல்லுக்கு சொல் ‘அரிஸ்தொபூலுவினுடையவர்களில் உள்ளவர்கள்’ என்பது தமிழில் தெளிவற்றது. கிரேக்கத் தொடர் அரிஸ்தொபூலுவின் குடும்பம் அல்லது இல்ல நிர்வாகத்தைச் சேர்ந்தவர்களைக் குறிக்கும் சாத்தியத்தை இயல்பாக வெளிப்படுத்துகிறது; அரிஸ்தொபூலுவும் அவர்களில் ஒருவர் என்று உரை கூறுவதில்லை.
theological_decisions:
- issue: ἐν Χριστῷ என்பதிலுள்ள Χριστῷ-ஐத் தமிழில் வழங்குதல்
  choice: மேசியாவுக்குள்
  alternative: கிறிஸ்துவுக்குள்
  rationale: Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மேசியா’ என்ற பட்டப்பெயர் தன்மையை முதன்மை உரை காக்கிறது. அதேவேளை, தமிழ்க் கிறிஸ்தவ மரபில் பரவலாக அறியப்படும் ‘கிறிஸ்துவுக்குள்’ என்ற வடிவம் அடிக்குறிப்பில் தரப்படுகிறது. ‘உள்ளே’ என்பதை ‘விசுவாசியாக’ என்று விளக்கி விடாமல், பவுலின் உறவு/ஒன்றிப்பு சார்ந்த மொழியின் திறந்த பொருள் பாதுகாக்கப்படுகிறது.
- issue: δόκιμον ἐν Χριστῷ என்பதன் தொடர்பு
  choice: அப்பெல்லே மேசியாவுடனான உறவில் சோதிக்கப்பட்டுத் தகுதியுள்ளவர் என நிரூபிக்கப்பட்டவர்
  alternative: மேசியாவால் அங்கீகரிக்கப்பட்டவர்
  rationale: ἐν என்பது இங்கு செய்பவரைக் குறிக்கும் ‘மேசியாவால்’ என்று கட்டாயப்படுத்துவதில்லை. ஆகவே பவுலின் ‘மேசியாவுக்குள்’ என்ற சூழல் அல்லது உறவைக் குறிக்கும் அமைப்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மீளும் ἀσπάσασθε இரு வாக்கியங்களிலும் ஒரே விதமாக வழங்கப்பட்டுள்ளது. ‘வீட்டார்’ என்பது பண்டைய குடும்பம், பணியாளர்கள், இல்ல நிர்வாகத்தினர் ஆகியோரை உள்ளடக்கக்கூடிய விரிவான தொடர்பைக் குறிக்கும் வகையில் பயன்படுத்தப்பட்டுள்ளது.
