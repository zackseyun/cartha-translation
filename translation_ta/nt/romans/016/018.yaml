id: ROM.16.18
reference: Romans 16:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: ta
  text: ஏனெனில், இப்படிப்பட்டவர்கள் நம் ஆண்டவராகிய மெசியாவுக்கு[a] ஊழியம் செய்வதில்லை; தங்கள் வயிற்றுக்கே[b] ஊழியம் செய்கிறார்கள். நயமான பேச்சாலும் புகழ்ச்சிப் பேச்சாலும் கபடமற்றவர்களின்[c] உள்ளங்களை ஏமாற்றுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் ஆண்டவராகிய கிறிஸ்து.”
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், “தங்கள் வயிறு”; இது சுயநல ஆசைகளுக்கும் தன்னின்ப நாட்டத்துக்கும் உரிய தெளிவான உருவகம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தீங்கற்றவர்களின்” அல்லது “எச்சரிக்கையற்றவர்களின்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: இப்படிப்பட்டவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பிரிவினை உண்டாக்குகிறவர்களைச் சுட்டுகிறது; கிரேக்கத்தின் சுட்டுப்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: நம் ஆண்டவராகிய மெசியா
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என்றும், அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருளுடைய Χριστός என்பதற்கு ‘மெசியா’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது; கிரேக்கத்தில் இல்லாத ‘இயேசு’ சேர்க்கப்படவில்லை.
- source_word: δουλεύουσιν
  choice: ஊழியம் செய்கிறார்கள்
  rationale: அடிமையாகச் சேவை செய்தல் என்ற அடிப்படை நிழற்பொருள் இருந்தாலும், இங்கு ஆண்டவருக்குச் செய்வதையும் தங்கள் வயிற்றுக்குச் செய்வதையும் எதிரெதிராகக் காட்டும் விதத்தில் இயல்பான தமிழ் பயன்படுத்தப்பட்டுள்ளது.
- source_word: κοιλίᾳ
  choice: வயிறு
  rationale: சுயநல ஆசைகளுக்கும் தன்னின்ப நாட்டத்துக்கும் உருவகமாக வரும் பவுலின் தெளிவான உடல்சார் படிமத்தை அப்படியே காக்கிறது.
- source_word: χρηστολογίας
  choice: நயமான பேச்சு
  rationale: கேட்பவரைக் கவர்ந்து நம்பவைக்கும் இனிமையான, சாதகமாக ஒலிக்கும் பேச்சைக் குறிக்கிறது.
- source_word: εὐλογίας
  choice: முகஸ்துதி
  rationale: இச்சூழலில் உண்மையான ஆசீர்வாதத்தை அல்ல, ஏமாற்றுவதற்குப் பயன்படுத்தப்படும் புகழ்ச்சிப் பேச்சைக் குறிக்கிறது.
- source_word: ἐξαπατῶσι
  choice: ஏமாற்றுகிறார்கள்
  rationale: வஞ்சித்து வழிதவறச் செய்வதைக் காட்டும் இயல்பான தமிழ் வினைச்சொல்.
- source_word: καρδίας
  choice: உள்ளங்கள்
  rationale: கிரேக்கத்தில் ‘இதயங்கள்’ என்று இருந்தாலும், இங்கு மனிதரின் உள்ளார்ந்த சிந்தனை, உணர்வு, விருப்பம் ஆகியவற்றை ஒருங்கே குறிக்க இயல்பான ‘உள்ளங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀκάκων
  choice: எதையும் சந்தேகிக்காதவர்கள்
  rationale: கள்ளங்கபடமற்றவர், தீங்கற்றவர், சூதறியாதவர் என்ற பொருள் பரப்பில், ஏமாற்றப்படக்கூடிய நிலையைக் கூறும் இச்சூழலுக்கு ‘எதையும் சந்தேகிக்காதவர்கள்’ தெளிவாகப் பொருந்துகிறது.
theological_decisions:
- issue: பவுலின் பட்டப்பெயர் தொடரில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός இங்கு வெறும் பெயர்போன்ற கூறாக அல்லாமல் ‘அபிஷேகம் பெற்றவர்’ என்ற பட்டமாக வருகிறது; ஆகவே பிரதான உரையில் ‘மெசியா’ என்றும், திருச்சபை வழக்கில் பரவலான ‘கிறிஸ்து’ என்பதை அடிக்குறிப்பில் மாற்றாகவும் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் காரண இணைப்பு ‘ஏனெனில்’ மூலம் காக்கப்பட்டு, நீண்ட வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
