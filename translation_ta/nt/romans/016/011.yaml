source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: ta
  text: என் உறவினரான[a] ஹெரோதியோனை வாழ்த்துங்கள். நர்கிசுவைச் சேர்ந்தவர்களில்[b] ஆண்டவருக்குள் இருப்பவர்களை வாழ்த்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் உறவினர்” என்பதற்கு “என் சொந்த இனத்தவர்” அல்லது “என் சக யூதர்” என்றும் பொருள் இருக்கலாம். கிரேக்கச் சொல் இரத்த உறவினரையோ பவுலின் சொந்த மக்களைச் சேர்ந்த ஒருவரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இது நர்கிசுவின் வீட்டார் அல்லது அவரது உடைமையோடு தொடர்புடைய விசுவாசிகளைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துங்கள்
  rationale: கடித வாழ்த்துச் சூழலில் வரும் பன்மை ஏவல் வடிவத்தை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: Ἡρῳδίωνα
  choice: ஏரோதியோன்
  rationale: கிரேக்கப் பெயரின் ஒலியைத் தமிழில் வழக்கமான முறையில் எழுத்துப்பெயர்த்தது.
- source_word: συγγενῆ μου
  choice: என் உறவினரான
  rationale: தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது; கிரேக்கச் சொல் இரத்த உறவினரையோ பரந்த பொருளில் சொந்த இனத்தவரையோ குறிக்கக்கூடியதால், அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: நர்கீசுவைச் சேர்ந்தவர்களில்
  rationale: நர்கீசுவுடன் உள்ள தொடர்பை மட்டும் முதன்மை உரையில் காட்டி, கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘வீட்டார்’ என்பதைச் சேர்க்காமல் அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: ஆண்டவருக்குள் இருப்பவர்களை
  rationale: நர்கீசுவைச் சேர்ந்தவர்களில் ஒரு குறிப்பிட்ட பகுதியினரை அடையாளப்படுத்தும் பவுலின் ‘ஆண்டவருக்குள்’ என்ற இறையியல் நிறைந்த சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: κυρίῳ
  choice: ஆண்டவர்
  rationale: இங்கு பவுல் பயன்படுத்தும் நிலையான கிறிஸ்தவச் சொற்றொடருக்கு ஏற்ற, இயல்பான மற்றும் மரியாதைமிக்க தமிழ்ச் சொல்.
theological_decisions:
- issue: συγγενής என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘என் உறவினர்’ என்று மொழிபெயர்த்து, பரந்த இனத் தொடர்பை அடிக்குறிப்பில் வைத்தல்
  alternative: என் இனத்தவர்; என்னோடு யூத இனத்தைச் சேர்ந்தவர்
  rationale: வசனம் இரத்த உறவா அல்லது இனத் தொடர்பா என்பதைத் தீர்மானிக்கவில்லை; ஆகவே ஒரு பொருளை மட்டும் இறுதியாக நிர்ணயிக்காமல் மூலத்தின் பொருள் விரிவை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: நர்கீசுவுடன் தொடர்புடையவர்களின் வட்டம்
  choice: ‘நர்கீசுவைச் சேர்ந்தவர்கள்’ என்று கட்டுப்பட்ட முறையில் மொழிபெயர்த்தல்
  alternative: நர்கீசுவின் வீட்டார்; நர்கீசுவின் குடும்பம் அல்லது உடைமைக்குட்பட்டோர்
  rationale: கிரேக்கம் தொடர்பைத் தெரிவிக்கிறது; ஆனால் ‘வீட்டார்’ என்ற பெயர்ச்சொல்லை வெளிப்படையாகக் கூறவில்லை. சாத்தியமான வீட்டார் என்ற பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: ἐν κυρίῳ என்ற பவுலின் சொற்றொடர்
  choice: ஆண்டவருக்குள் இருப்பவர்கள்
  alternative: ஆண்டவரைச் சேர்ந்தவர்கள்; ஆண்டவரை விசுவாசிப்பவர்கள்
  rationale: விளக்க உரையாகக் குறுக்காமல், கிறிஸ்துவோடு உள்ள ஒன்றிப்பையோ அவருக்குரிய நிலைமையையோ சுட்டும் மூலத்தின் இறையியல் செறிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. ‘ஆண்டவருக்குள்’ என்ற பவுலின் தனித்துவமான சொற்றொடர் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்கு உடனடியாக இணைக்கப்பட்டுள்ளன.
