  text: Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: ta
  text: மேசியா இயேசுவில்[b] என்னுடன் பணியாற்றுபவர்களான பிரிஸ்காவுக்கும்[a] ஆக்கில்லாவுக்கும் வாழ்த்துத் தெரிவியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பிரிஸ்கா என்பது இங்கு மூலத்தில் வரும் பெயர்வடிவம்; இதே நபருக்குப் பிற இடங்களில் பிரிஸ்கில்லா என்ற அதிகம் பரிச்சயமான வடிவம் வருகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘கிறிஸ்து இயேசுவில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: வாழ்த்துத் தெரிவியுங்கள்
  rationale: கடிதங்களில் பிறருக்கு வாழ்த்தைத் தெரிவிக்குமாறு கூறும் பன்மை ஏவல் வடிவை, இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Πρίσκαν
  choice: பிரிஸ்கா
  rationale: மூலத்தில் உள்ள Πρίσκα என்ற பெயர்வடிவத்தை ஒலிபெயர்க்கிறது; இதே நபருக்குப் பிற இடங்களில் வரும் பிரிஸ்கில்லா என்ற பழக்கமான வடிவத்துடன் இதைக் கலக்கவில்லை.
- source_word: Ἀκύλαν
  choice: ஆக்கில்லா
  rationale: Ἀκύλας என்ற தனிப்பெயரின் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பைத் தொடர்கிறது.
- source_word: συνεργούς μου
  choice: என் உடன் பணியாளர்களான
  rationale: பவுலோடு ஒரே பணியில் இணைந்து உழைப்பவர்களைக் குறிக்கும் கூட்டுழைப்பின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியா இயேசுவில்
  rationale: ἐν என்பதன் உறவு அல்லது செயல்பாட்டுக் களத்தைக் குறிக்கும் நெகிழ்வை ‘இல்’ காக்கிறது; Χριστός இங்கு இயேசுவின் பட்டமாக உள்ளதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: பவுலின் ἐν Χριστῷ Ἰησοῦ என்ற தொடரில் Χριστῷ-ஐ மொழிபெயர்த்தல்
  choice: மேசியா இயேசுவில்
  alternative: கிறிஸ்து இயேசுவில்
  rationale: Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மேசியா’ என்ற பட்டப் பொருளை முதன்மை உரை வெளிப்படுத்துகிறது. தமிழ்க் கிறிஸ்தவ மரபில் பரிச்சயமான ‘கிறிஸ்து’ என்ற மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது; ἐν குறிக்கும் ஒன்றிப்பு, உறவு, அல்லது செயல்பாட்டுக் களம் ஆகியவற்றில் ஒன்றை மட்டும் இறுக்கமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. வாக்கிய ஒழுங்கு தமிழுக்கு இயல்பாக அமைக்கப்பட்டாலும், பிரிஸ்கா முதலில் குறிப்பிடப்படும் மூல வரிசை காக்கப்பட்டுள்ளது.
