id: ROM.16.6
reference: Romans 16:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀσπάσασθε ⸀Μαριάμ, ἥτις πολλὰ ἐκοπίασεν εἰς ⸀ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: ta
  text: உங்களுக்காக மிகவும் கடினமாக உழைத்த மரியாளுக்கு வாழ்த்துச் சொல்லுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘உங்களுக்காக’ என்பதற்குப் பதிலாக ‘எங்களுக்காக’ அல்லது ‘உங்களிடையே’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துச் சொல்லுங்கள்
  rationale: கடிதத்தின் இறுதி வாழ்த்துப் பகுதியில், வாழ்த்தைத் தெரிவிக்குமாறு கூறும் பன்மை ஏவலை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: Μαριάμ
  choice: மரியாள்
  rationale: Μαριάμ என்ற பெயருக்கு தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட மரியாள் என்ற வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: ἥτις
  choice: உழைத்த
  rationale: மரியாளைப் பற்றிய விளக்கத் தொடர்பைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக அமைக்கிறது; கிரேக்கச் சொல்லின் மெல்லிய பண்புவிளக்க நிழல் தனியாக விரிவாக்கப்படவில்லை.
- source_word: πολλὰ
  choice: மிகவும் கடினமாக
  rationale: ἐκοπίασεν என்பதோடு வினையடைபோல் வந்து உழைப்பின் மிகுதியைச் சுட்டுகிறது; தற்போதைய தமிழில் கடுமையான முயற்சியைத் தெளிவாக உணர்த்துகிறது.
- source_word: ἐκοπίασεν
  choice: உழைத்த
  rationale: κοπιάω குறிக்கும் சிரமமிக்க உழைப்பை, πολλὰ என்பதற்கான மொழிபெயர்ப்புடன் சேர்ந்து இயல்பாகவும் வலுவாகவும் தெரிவிக்கிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்காக
  rationale: SBLGNT ஏற்றுள்ள வாசகத்தில் செயல் வாசகர்களின் நலனை நோக்கியது என்பதை இயல்பாகக் காட்டுகிறது; வேறு வாசகங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: இறுதிச் சொற்றொடரிலுள்ள பாட வேறுபாடு
  choice: உங்களுக்காக
  alternative: எங்களுக்காக; உங்களிடையே
  rationale: வழங்கப்பட்ட SBLGNT மூலத்தில் εἰς ὑμᾶς, ‘உங்களுக்காக’ என்று உள்ளது. εἰς ἡμᾶς, ‘எங்களுக்காக’ என்றும் ἐν ὑμῖν, ‘உங்களிடையே’ என்றும் வாசிக்கும் கையெழுத்துப் பிரதிகளின் சான்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதைமிக்கதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. ‘வாழ்த்துச் சொல்லுங்கள்’ என்பது கடித வாழ்த்தின் சூழலை இயல்பாகக் காட்டுகிறது; ‘மிகவும் கடினமாக உழைத்த’ என்பது உழைப்பின் தீவிரத்தைத் தெளிவுபடுத்துகிறது.
