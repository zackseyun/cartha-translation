  naturalness: “உங்களுக்காக மிகவும் கடினமாக உழைத்த மரியாளுக்கு வாழ்த்துச் சொல்லுங்கள்” என்பது நவீனத் தரத் தமிழில் இயல்பான, தெளிவான கடித நடையாக உள்ளது.
