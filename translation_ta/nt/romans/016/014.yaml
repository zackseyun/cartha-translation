id: ROM.16.14
reference: Romans 16:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: ta
  text: அசிங்கிரீத்து, பிளெகோன், எர்மேஸ், பத்ரொபாஸ், எர்மாஸ் ஆகியோருக்கும், அவர்களுடன் இருக்கும் சகோதரர்களுக்கும்[a] வாழ்த்துச் சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பது இங்கு இவர்களுடன் தொடர்புடைய சக விசுவாசிகளைக் குறிக்கக்கூடும்.
    reason: ἀδελφούς என்ற சொல்லின் சூழல்சார் பொருளை விளக்கி, மூலத்தில் இல்லாத பாலின விரிவாக்கத்தை முதன்மை உரையில் சேர்க்காமல் அதன் சாத்தியமான சமூகப் பொருளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துச் சொல்லுங்கள்
  rationale: கடிதத்தின் இறுதி வாழ்த்துப் பகுதியில் வரும் பன்மை ஏவல் வினையை, இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் மரியாதையாகவும் வெளிப்படுத்துகிறது.
- source_word: Ἀσύγκριτον
  choice: அசிங்கிரித்து
  rationale: ஆள்பெயர்; கிரேக்க ஒலிவடிவத்தைத் தமிழில் வாசிக்க இயலுமாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: Φλέγοντα
  choice: பிளெகோன்
  rationale: ஆள்பெயர்; கிரேக்க ஒலிக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ἑρμῆν
  choice: எர்மேஸ்
  rationale: ஆள்பெயர்; அடுத்து வரும் Ἑρμᾶν என்ற பெயரிலிருந்து வேறுபாடு தெளிவாக இருக்கும்படி ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: Πατροβᾶν
  choice: பத்ரொபாஸ்
  rationale: ஆள்பெயர்; மூலமொழி உச்சரிப்பை இயன்றவரை பின்பற்றும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ἑρμᾶν
  choice: எர்மாஸ்
  rationale: ஆள்பெயர்; முந்தைய Ἑρμῆν (‘எர்மேஸ்’) என்பதிலிருந்து தெளிவாக வேறுபடுத்தப்பட்டுள்ளது.
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: அவர்களுடன் இருக்கும் சகோதரர்கள்
  rationale: σὺν αὐτοῖς என்பதைக் ‘அவர்களுடன்’ என்றும், இலக்கணத்தில் ஆண்பால் பன்மையாக உள்ள ἀδελφούς என்பதைக் ‘சகோதரர்கள்’ என்றும் நேரடியாக வெளிப்படுத்துகிறது; சூழலில் இது உடன் இணைந்த சக விசுவாசிகளைக் குறிக்கக்கூடும்.
theological_decisions:
- issue: சமூக வாழ்த்தில் ἀδελφούς என்பதன் பொருள்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; சக விசுவாசிகள்
  rationale: கிரேக்கச் சொல் வெளிப்படையாக ஆண்பால் பன்மையில் உள்ளது. இந்தச் சுருக்கமான சூழல் கலப்புப் பாலினக் குழுவைத் தெளிவாகக் காட்டாததால், பாலினத்தைப் பொதுமைப்படுத்தாமல் மூலவடிவம் பாதுகாக்கப்பட்டுள்ளது; இருப்பினும் பவுலின் பயன்பாட்டில் இது சக விசுவாசிகளைக் குறிக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கடிதநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் ஒன்றோடொன்று தெளிவாக வேறுபடுமாறு கிரேக்கத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன; பட்டியலின் இயல்பான தமிழ் ஓட்டத்திற்காக ‘ஆகியோருக்கும்’ சேர்க்கப்பட்டுள்ளது.
