id: ROM.16.5
reference: Romans 16:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: ta
  text: அவர்களுடைய வீட்டில் கூடிவரும் திருச்சபைக்கும் வாழ்த்துச் சொல்லுங்கள்.[a] என் அன்புக்குரிய எப்பெனேத்துவுக்கு வாழ்த்துச் சொல்லுங்கள். அவர் மெசியாவுக்கென்று ஆசியாவின் முதற்கனியாக இருப்பவர்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய வீட்டிலுள்ள திருச்சபைக்கும்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “ஆசியா” என்பது இன்றைய ஆசியக் கண்டத்தை அல்ல, ரோமப் பேரரசின் ஆசியா மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அதாவது, “ஆசியாவில் மெசியாவை விசுவாசித்த முதலாமவர்.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: அவர்களுடைய வீட்டில் கூடிவரும் திருச்சபை
  rationale: இந்தச் சொற்றொடர் அவர்களுடைய வீட்டுடன் தொடர்புடைய, அங்கே கூடிவந்த சபையைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘கூடிவரும்’ என வெளிப்படுத்தப்பட்டுள்ளது; ‘அவர்களுடைய வீட்டிலுள்ள திருச்சபை’ என்ற சொற்கிட்டிய வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀσπάσασθε
  choice: வாழ்த்துச் சொல்லுங்கள்
  rationale: கடிதத்தின் வாழ்த்துப் பட்டியல் சூழலில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Ἐπαίνετον
  choice: எப்பெனேத்து
  rationale: தனிப்பட்ட பெயர் தமிழில் வாசிக்க ஏற்ற வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀγαπητόν μου
  choice: என் அன்புக்குரிய
  rationale: பவுலின் தனிப்பட்ட அன்பையும் மரியாதையான நடையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἀπαρχὴ
  choice: முதற்கனி
  rationale: முதல் விளைச்சலின் காணிக்கை என்ற அடிப்படை உருவகத்தையும், ஒரு பெரிய தொகுதியின் ஆரம்பப் பகுதி என்ற கருத்தையும் காக்கிறது; ‘முதலில் விசுவாசியானவர்’ எனப் பொருளை மட்டும் கூறி உருவகத்தை நீக்கவில்லை.
- source_word: τῆς Ἀσίας
  choice: ஆசியாவின்
  rationale: மூலத்தின் பிறப்புப்பொருள் வேற்றுமையை நெருக்கமாகப் பிரதிபலிக்கிறது. இது இன்றைய கண்டத்தை அல்ல, ரோம மாகாணத்தைச் சுட்டுகிறது என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: εἰς Χριστόν
  choice: மெசியாவுக்கென்று
  rationale: εἰς என்பதன் நோக்கம் அல்லது தொடர்பைக் காக்கும் இயல்பான தமிழ். Χριστός இங்கே பட்டமாக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστόν என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கே Χριστός ஒரு பெயராக மட்டும் அல்லாமல் பட்டமாகச் செயல்படுகிறது; ‘மெசியா’ அதன் பொருளை வெளிப்படுத்துகிறது.
- issue: ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν என்பதன் பொருள்
  choice: மெசியாவுக்கென்று ஆசியாவின் முதற்கனி
  alternative: ஆசியாவில் மெசியாவை விசுவாசித்த முதலாமவர்
  rationale: முதன்மை உரை பவுலின் ‘முதற்கனி’ உருவகத்தையும் εἰς காட்டும் தொடர்பையும் காக்கிறது. சூழலில் அது முதல் விசுவாசியைக் குறிக்கலாம் என்ற விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது; பொருள் அமைதியாகத் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. ‘திருச்சபை’, ‘மெசியா’, ‘முதற்கனி’ ஆகியவை வேதாகமச் சூழலின் உயர்ந்த தன்மையையும் மூல உருவகத்தையும் காக்கின்றன; வாக்கிய அமைப்பு இயல்பான தமிழுக்கேற்ப உள்ளது.
