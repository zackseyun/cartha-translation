source:
  edition: robinson-pierpont-2005-byzantine
  text: μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/027.yaml
  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: ta
  text: ஒருவரே ஞானமுள்ள கடவுளுக்கு, இயேசு மேசியாவின் வழியாக, என்றென்றும் மகிமை உண்டாவதாக.[a] ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் ரோமர் 16:25–27-இல் உள்ள நிறைவு மகிமைப் புகழுரையை முடிக்கிறது. இந்தப் புகழுரையின் இடமும் சேர்க்கையும் பழமையான கையெழுத்துப் பிரதிகளில் குறிப்பிடத்தக்க அளவில் வேறுபடுகின்றன; இங்கு அது பைசாந்தியப் பெரும்பான்மை மரபில் உள்ளபடி இடம்பெறுகிறது.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ
  choice: ஒரே
  rationale: μόνῳ என்பது ‘ஞானமுள்ள கடவுள்’ என்பதோடு இணைந்து, கடவுள் ஒருவரே ஒப்பற்ற ஞானமுள்ளவர் என்பதை வலியுறுத்துகிறது.
- source_word: σοφῷ
  choice: ஞானமுள்ள
  rationale: σοφός என்பதன் இயல்பான பண்புப்பெயர் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: διὰ
  choice: வழியாக
  rationale: ஆறாம் வேற்றுமையுடன் வரும் διά, இங்கு இயேசு மெசியா வழியாக மகிமை செலுத்தப்படுவதைச் சுட்டும் இடைநிலைக் கருத்தை வெளிப்படுத்துகிறது.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற மெசியப் பட்டம்; தமிழில் ‘மெசியா’ என்று வழங்குவது பட்டத்தின் தன்மையைப் பேணுகிறது.
- source_word: ᾧ
  choice: உண்டாவதாக
  rationale: தமிழில் இயல்பான புகழுரையாக அமைக்கப்பட்டுள்ளது; கிரேக்க உறவுப்பெயரின் முன்னிலைத் தொடர்பு கடவுளையோ இயேசு மெசியாவையோ குறிக்கக்கூடிய சிறு இலக்கணத் தெளிவின்மையைத் தீர்மானித்து விடாமல் வாக்கிய அமைப்பு காக்கிறது.
- source_word: εἰς τοὺς αἰῶνας
  choice: என்றென்றும்
  rationale: ‘யுகங்களுக்குள்’ என்ற சொற்பொருளுடைய இந்த நிலையான கிரேக்க மரபுத்தொடர் முடிவில்லாத காலத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: δόξα
  choice: மகிமை
  rationale: δόξα என்பதன் புகழ், மேன்மை ஆகிய வேதாகமச் சார்புடைய பொருளை நிலையான தமிழ்ச் சொல்லால் தருகிறது.
theological_decisions:
- issue: ᾧ என்ற உறவுப்பெயரின் முன்னிலை
  choice: கடவுளையோ இயேசு மெசியாவையோ வெளிப்படையாக மீண்டும் பெயரிடாத தமிழ் அமைப்பு
  alternative: ‘அவருக்கே மகிமை’ என்று மொழிபெயர்த்து கடவுளைத் தெளிவான முன்னிலையாகக் கொள்ளுதல்
  rationale: கிரேக்கத்தில் ᾧ என்பதன் இலக்கண முன்னிலை சிறிதளவு தெளிவற்றது. மூலத்தில் இல்லாத தீர்மானத்தைச் சேர்க்காமல் அந்த இறையியல் நெருக்கடியைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான புகழுரை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கிறிஸ்து’ என்பதற்குப் பதிலாக மூலத்தின் பட்டத் தன்மையை வெளிப்படுத்த ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது; கிரேக்க இலக்கணத் தெளிவின்மை இயன்றவரை தீர்க்கப்படாமல் வைக்கப்பட்டுள்ளது.
