reference: Romans 16:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: ta
  text: சமாதானத்தின் தேவன் சாத்தானை உங்கள் கால்களின் கீழ் விரைவில் நசுக்குவார். நம்முடைய ஆண்டவராகிய இயேசு மேசியாவின்[a] அருள் உங்களோடு இருப்பதாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபுவழியாக, “இயேசு கிறிஸ்து.”
    reason: Χριστός என்பதற்கான மரபான பெயர்வடிவ மொழிபெயர்ப்பை வாசகர்கள் அறியச் செய்கிறது.
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: சமாதானத்தின் தேவன்
  rationale: பவுலின் நிலைபெற்ற இறையியல் அடைமொழியை விளக்கவுரையாக விரிக்காமல், கிரேக்க மரபுத்தொடரின் இயல்பையும் தமிழின் கண்ணியமான நடையையும் காக்கிறது.
- source_word: συντρίψει
  choice: நசுக்கிப்போடுவார்
  rationale: எதிர்காலத்தில் நிகழும் உறுதியான செயலைக் காட்டுகிறது; ‘கால்களின்கீழ்’ என்ற வெற்றி மற்றும் அடக்குதல் உருவகத்தோடு இயல்பாகப் பொருந்துகிறது.
- source_word: τὸν Σατανᾶν
  choice: சாத்தானை
  rationale: கிரேக்கத்தில் தனிப்பெயராக உள்ளதை புதிய ஏற்பாட்டுத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது; ‘எதிராளி’ என்று பொருள்விரிவாக்கம் செய்யவில்லை.
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: உங்கள் கால்களின்கீழ்
  rationale: வெற்றி மற்றும் கீழ்ப்படுத்துதலைக் குறிக்கும் உருவகத்தைப் பாதுகாக்கிறது. ‘உங்கள்’ என்பது பன்மைச் சுட்டாக இருந்து ரோம விசுவாசிகள் அனைவருக்கும் உரிய கூட்டுமுகவரியைத் தக்கவைக்கிறது.
- source_word: ἐν τάχει
  choice: சீக்கிரத்தில்
  rationale: செயல் எவ்வளவு வேகமாக நடைபெறும் என்பதைக் காட்டுவதைவிட, அது விரைவில் நிகழும் என்ற கால அண்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்துச் சூத்திரத்தில் வரும் முக்கிய இறையியல் சொல்லுக்கான நிலைபெற்ற, இயல்பான தமிழ் இணை.
- source_word: τοῦ κυρίου ἡμῶν
  choice: நம்முடைய ஆண்டவராகிய
  rationale: உடைமைத் தொடர்பைத் தமிழில் இயல்பாகக் காட்டி, இயேசுவைக் குறிக்கும் κύριος என்பதற்கு நிலைபெற்ற ‘ஆண்டவர்’ என்ற சொல்லைப் பயன்படுத்துகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மேசியாவின்
  rationale: இங்கு Χριστός இயேசுவோடு இணைந்த பட்டமாக இன்னும் உணரப்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மேசியா’ பயன்படுத்தப்படுகிறது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μεθ’ ὑμῶν
  choice: உங்களோடு இருப்பதாக
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், தமிழ் ஆசீர்வாத வாக்கியத்திற்கு தேவையான வினையை இயல்பாக நிரப்புகிறது.
theological_decisions:
- issue: இறுதி ஆசீர்வாதத்தில் Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இந்த இடத்தில் சொல் இயேசுவின் பட்டமாகப் புரிந்துகொள்ளத்தக்கதால் அதன் பொருளைத் தெரிவிக்கும் ‘மேசியா’ முதன்மை உரையில் வைக்கப்படுகிறது. திருச்சபைத் தமிழ் மரபில் நிலைபெற்ற ‘கிறிஸ்து’ வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. வெற்றி உருவகம், கூட்டுமுகவரி, எதிர்கால உறுதி, ஆசீர்வாதச் சூத்திரம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
