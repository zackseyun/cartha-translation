revisions:
- from: சமாதானத்தின் தேவன் சாத்தானை உங்கள் கால்களின்கீழ் சீக்கிரத்தில் நசுக்கிப்போடுவார். நம்முடைய ஆண்டவராகிய இயேசு மேசியாவின்[a] அருள் உங்களோடு இருப்பதாக.
  to: சமாதானத்தின் தேவன் சாத்தானை உங்கள் கால்களின் கீழ் விரைவில் நசுக்குவார். நம்முடைய ஆண்டவராகிய இயேசு மேசியாவின்[a] அருள் உங்களோடு இருப்பதாக.
