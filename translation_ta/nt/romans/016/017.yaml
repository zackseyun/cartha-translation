  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் தக்கவைக்கப்பட்டுள்ளன: போதனைக்கு மாறான பிரிவுகளையும் இடறலுக்கான காரணங்களையும் உண்டாக்குவோரை விழிப்புடன் கவனித்தல், அவர்களிடமிருந்து விலகல், மற்றும் பவுலின் வலியுறுத்தும் வேண்டுகோள். ஆனால் “உங்களை வேண்டிக்கொள்கிறேன்” என்பது நவீனத் தமிழில் இயல்பான வினை-பொருள் அமைப்பு அல்ல; வேண்டுகோளின் இலக்கைத் தெளிவாகவும் இயல்பாகவும் மாற்றுதல் வேண்டும்.'
