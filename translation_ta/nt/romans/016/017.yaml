source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: ta
  text: சகோதரர்களே[a], நீங்கள் கற்றுக்கொண்ட போதனைக்கு மாறாகப் பிரிவுகளையும் இடறலுக்கான காரணங்களையும் உண்டாக்குகிறவர்களை எச்சரிக்கையாகக் கவனியுங்கள்; அவர்களிடமிருந்து விலகுங்கள் என்று உங்களைக் வலியுறுத்திக் கேட்டுக்கொள்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளே”; கிரேக்க மூலத்தில் “சகோதரர்களே” என்று உள்ளது; இது சபை முழுவதையும் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: உங்களை வேண்டிக்கொள்கிறேன்
  rationale: வலுவான மேய்ப்புப்பணி சார்ந்த வேண்டுகோளை இயல்பான, கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது; வெறும் ஆலோசனையாக அதன் வலிமையைக் குறைக்கவில்லை.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவை முதன்மை உரையில் துல்லியமாகத் தக்கவைக்கிறது; இது சபை முழுவதையும் குறிக்க வாய்ப்புள்ளதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: σκοπεῖν
  choice: எச்சரிக்கையாக இருக்கும்படி
  rationale: குறிப்பிட்டவர்களை உன்னிப்பாகக் கவனிப்பதோடு அவர்களைக் குறித்து விழிப்பாக இருக்க வேண்டிய எச்சரிக்கை உணர்வையும் இயல்பான தமிழில் தருகிறது.
- source_word: διχοστασίας
  choice: பிரிவுகள்
  rationale: சமூகத்திற்குள் பிளவை உண்டாக்கும் செயல்களைத் தெளிவாகவும் பொதுவாகப் புரியும் வகையிலும் குறிக்கிறது.
- source_word: σκάνδαλα
  choice: இடறலுக்கான காரணங்கள்
  rationale: ஒருவரைத் தடுமாறச் செய்யும் பொருள் அல்லது காரணம் என்ற உருவகத்தைத் தக்கவைக்கிறது; இதை வெறும் மனவருத்தம் என்று குறுக்கவில்லை.
- source_word: παρὰ τὴν διδαχήν
  choice: போதனைக்கு மாறாக
  rationale: παρά + குற்றுவேற்றுமை இங்கு பெற்ற போதனையின் அளவுகோலிலிருந்து விலகுதல் அல்லது அதற்கு எதிராக இருத்தல் என்பதைக் குறிக்கிறது.
- source_word: διδαχήν
  choice: போதனை
  rationale: அதிகாரமுள்ள அறிவுறுத்தலைத் தெரிவிக்கும், நவீனத் தமிழில் இயல்பான வேதாகமச் சொல்.
- source_word: ἐμάθετε
  choice: நீங்கள் கற்றுக்கொண்ட
  rationale: வாசகர்கள் ஏற்கெனவே கற்றறிந்த போதனையை நேரடியாகக் குறிக்கிறது.
- source_word: ποιοῦντας
  choice: உண்டாக்குகிறவர்களை
  rationale: பிரிவுகளையும் இடறலுக்கான காரணங்களையும் உருவாக்கும் நபர்களைக் குறிக்கும் பங்கேற்புவினையின் செயற்பாட்டு வலிமையைத் தெளிவாக்குகிறது.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: அவர்களைவிட்டு விலகும்படி
  rationale: அவர்களிடமிருந்து திரும்பி விலக வேண்டும் என்ற திசைசார் உருவகத்தையும் கட்டளை வலிமையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ரோமச் சபைக்கான அழைப்பில் ἀδελφοί என்பதன் பிரதிநிதித்துவப் பரப்பு
  choice: முதன்மை உரையில் “சகோதரர்களே” என்று வைத்து, அது சபை முழுவதையும்—பெண்களையும் உட்பட—குறிக்க வாய்ப்புள்ளதை அடிக்குறிப்பில் தெரிவிப்பது.
  alternative: முதன்மை உரையிலேயே “சகோதர சகோதரிகளே” என்று மொழிபெயர்ப்பது.
  rationale: கிரேக்க மூலத்தின் ஆண்பால் பன்மை வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது; அதேவேளை பவுலின் பயன்பாட்டில் கலப்புப் பாலினச் சபை முழுவதையும் அது அழைக்கக்கூடிய பொருள் அடிக்குறிப்பால் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான வேண்டுகோள் நடையில் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் வேண்டுகோள், எச்சரிக்கை, விலகுதல் ஆகிய தொடர்புகள் ஒரே வாக்கியத்தில் இயல்பாக இணைக்கப்பட்டுள்ளன.
