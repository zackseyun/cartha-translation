id: ROM.16.2
reference: Romans 16:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: ta
  text: நீங்கள் கர்த்தருக்குள் பரிசுத்தவான்களுக்கு ஏற்ற விதத்தில் அவளை வரவேற்று, அவளுக்கு எந்தக் காரியத்தில் உங்களுடைய உதவி தேவைப்பட்டாலும் அவளுக்குத் துணைநில்லுங்கள். ஏனெனில், அவள் பலருக்கும் எனக்கும்கூட புரவலியாக இருந்திருக்கிறாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “புரவலி” என்பதற்கு “நன்மை செய்தவர்,” “ஆதரவாளர்,” அல்லது “உதவியாளர்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல், பிறருக்கு நடைமுறை அல்லது பொருளாதார ஆதரவு வழங்கிய ஒரு பெண்ணைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: வரவேற்று
  rationale: சபைச் சமூகத்திற்குள் பெபேயாளை அன்புடனும் உபசரிப்புடனும் ஏற்றுக்கொள்வதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἐν κυρίῳ
  choice: கர்த்தருக்குள்
  rationale: கிறிஸ்துவோடு உள்ள உறவையும் கிறிஸ்தவ ஐக்கியத்தின் தளத்தையும் குறிக்கும் பவுலின் வழக்கமான சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: ἀξίως τῶν ἁγίων
  choice: பரிசுத்தவான்களுக்கு ஏற்ற விதத்தில்
  rationale: ἀξίως என்பதன் விதத்தைக் குறிக்கும் பொருளையும், ἅγιοι என்பதன் பவுலியப் பயன்பாட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: παραστῆτε αὐτῇ
  choice: அவளுக்குத் துணைநில்லுங்கள்
  rationale: அவளுக்காக நின்று தேவையான உதவியையும் ஆதரவையும் வழங்க வேண்டும் என்ற சூழல்சார் பொருளை, உதவியின் வடிவத்தை அளவுக்கு மீறிக் குறிப்பாக்காமல் தருகிறது.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: உங்களிடமிருந்து அவளுக்கு எந்தக் காரியத்தில் உதவி தேவைப்பட்டாலும்
  rationale: πρᾶγμα என்பதன் பரந்த ‘காரியம்/விவகாரம்’ பொருளையும், χρῄζῃ ὑμῶν என்பதன் ‘உங்களிடமிருந்து தேவைப்படுதல்’ பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: προστάτις
  choice: ஆதரவளித்த புரவலர்
  rationale: வெறும் பொதுவான உதவியைக் காட்டிலும் சமூக, பொருளாதார அல்லது நடைமுறை ஆதரவு வழங்கிய முக்கியமான பங்கைச் சுட்டுகிறது; ‘புரவலர்’ மட்டும் சில வாசகர்களுக்குத் தெளிவில்லாமலிருக்கக்கூடும் என்பதால் ‘ஆதரவளித்த’ எனச் சூழல் விளக்கம் சேர்க்கப்பட்டுள்ளது.
- source_word: ἐγενήθη
  choice: இருந்திருக்கிறாள்
  rationale: கடந்தகாலத்தில் நிலைபெற்ற அவளுடைய பங்கு தற்போதைய பரிந்துரைக்கு தொடர்புடையதாக இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐμοῦ αὐτοῦ
  choice: எனக்கும்கூட
  rationale: καί என்பதன் சேர்க்கைப் பொருளையும் αὐτοῦ தரும் வலியுறுத்தலையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: பெபேயாளைக் குறிக்கும் προστάτις என்பதன் மொழிபெயர்ப்பு
  choice: ஆதரவளித்த புரவலர்
  alternative: உதவியாளர்; நன்மை செய்தவர்; பாதுகாவலர்
  rationale: இச்சொல் சாதாரண உதவியை விட பிறருக்கு ஆதரவோ புரவலோ வழங்கிய குறிப்பிடத்தக்க சமூகப் பங்கைக் குறிக்கலாம். ‘புரவலர்’ அந்த வலிமையைப் பாதுகாக்கிறது; பின்னாளைய குறிப்பிட்ட திருச்சபைப் பதவியை இதில் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘கர்த்தருக்குள்,’ ‘பரிசுத்தவான்கள்’ ஆகியவை பவுலிய இறையியல் சொற்பயன்பாட்டைப் பாதுகாக்கின்றன. ‘துணைநில்லுங்கள்’ என்பது கட்டளையின் நடைமுறை ஆதரவு உணர்வை இயல்பாகத் தருகிறது.
