base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: ta
  text: முதற்பலன் பரிசுத்தமானது என்றால், பிசைந்த மாவு முழுவதும் பரிசுத்தமானதே[a]; வேர் பரிசுத்தமானது என்றால், கிளைகளும் பரிசுத்தமானவையே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாவுத் திரள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பிசையப்பட்ட அல்லது கலக்கப்பட்ட மாவுத் தொகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: முதற்பங்கு
  rationale: தேவனுக்குச் செலுத்தப்படும் விளைச்சல் அல்லது மாவின் முதல் பகுதி என்ற காணிக்கைச் சார்ந்த பொருளைத் தக்கவைக்கிறது; இவ்வசனத்தில் முழு மாவுடன் உள்ள தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἁγία
  choice: பரிசுத்தமானது
  rationale: உடன்படிக்கை சார்ந்ததா, அர்ப்பணிப்பு சார்ந்ததா, இரட்சிப்பு சார்ந்ததா என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், மூலத்தின் வேதாகமக் கருத்தையும் இரு உருவகங்களின் இணை அமைப்பையும் காக்கிறது.
- source_word: φύραμα
  choice: பிசைந்த மாவு முழுவதும்
  rationale: கலக்கப்பட்ட அல்லது பிசையப்பட்ட மாவுத் திரளைத் தெளிவான நவீன தமிழில் குறிக்கிறது; முதற்பங்கிற்கும் மீதமுள்ள முழுத் தொகுதிக்கும் உள்ள வேறுபாட்டையும் காட்டுகிறது.
- source_word: ῥίζα
  choice: வேர்
  rationale: தாவரவியல் உருவகத்திற்கான இயல்பான, துல்லியமான தமிழ்ச் சொல்.
- source_word: κλάδοι
  choice: கிளைகள்
  rationale: சுற்றியுள்ள ஒலிவமர உருவகத்துடன் பொருந்தும் பொதுவான தமிழாக்கம்.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: … என்றால், … பரிசுத்தமானதே; … என்றால், … பரிசுத்தமானவையே
  rationale: மூலத்தில் பின்னர் விடுபட்டுள்ள வினையடையைத் தமிழில் இயல்பாக நிறைவு செய்து, இரு ஒப்புமைகளின் தர்க்கத்தையும் சுருக்கத்தையும் காக்கிறது. δέ-க்கு தனியான காலச்சுட்டுச் சொல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: முதற்பங்கு/வேர் ஆகியவற்றின் பரிசுத்தம் மாவு/கிளைகளுக்கு எவ்வகையில் தொடர்புபடுகிறது
  choice: இரு தரப்புகளுக்கும் ‘பரிசுத்தம்’ என்றே மொழிபெயர்த்து, அதன் துல்லியமான இறையியல் இயல்பை வரையறுக்காமல் விடுதல்
  alternative: ‘உடன்படிக்கைக்கென அர்ப்பணிக்கப்பட்டது’ அல்லது ‘இரட்சிப்புக்காகப் பரிசுத்தமாக்கப்பட்டது’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் சார்ந்திருக்கும் உறவை வலியுறுத்துகிறது; ஆனால் அந்தப் பரிசுத்தம் உடன்படிக்கை சார்ந்ததா, பிரதிநிதித்துவமானதா, இரட்சிப்பு சார்ந்ததா என்பதைத் தானாக விளக்கவில்லை. ஆகவே மூலத்தின் இறையியல் இழுவிசை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான பழமொழி போன்ற இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது. ‘பரிசுத்தம்’ என்ற பரிச்சயமான வேதாகமச் சொல் தக்கவைக்கப்பட்டாலும், வாக்கிய அமைப்பு சாதாரண வாசகருக்குத் தெளிவாக வைக்கப்பட்டுள்ளது.
