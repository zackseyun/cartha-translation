id: ROM.11.33
reference: Romans 11:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: ta
  text: ஆ! கடவுளுடைய செல்வம், ஞானம், அறிவு ஆகியவற்றின் ஆழம் எவ்வளவு![a] அவருடைய தீர்ப்புகள் எவ்வளவு ஆராய்ந்து அறிய முடியாதவை! அவருடைய வழிகள் எவ்வளவு தடம் பின்தொடர்ந்து அறிய முடியாதவை![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய ஞானம் மற்றும் அறிவு ஆகியவற்றின் செல்வத்தின் ஆழம் எவ்வளவு!” கிரேக்கச் சொற்றொடர் ‘செல்வம்’ என்பதை அடுத்து வரும் ‘ஞானம்’, ‘அறிவு’ ஆகியவற்றோடு இன்னும் நெருக்கமாக இணைத்துப் புரிந்துகொள்ளவும் இடமளிக்கிறது. முதன்மை உரை செல்வம், ஞானம், அறிவு ஆகிய மூன்றையும் கடவுளுக்குரியவையாகக் கொள்கிறது.
    reason: alternative_reading
  - marker: b
    text: “தடம் பின்தொடர்ந்து அறிய முடியாதவை” என்பதற்கான கிரேக்கச் சொல், சுவட்டைப் பின்தொடர்ந்து கண்டறிய இயலாதது என்ற பொருளைக் கொண்டது. இவ்வாறு மொழிபெயர்ப்பது, “ஆராய்ந்து அறிய முடியாதவை” என்பதிலிருந்து அதன் தனித்த நுணுக்கத்தைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: ஆ!
  rationale: வியப்பும் துதிப்பரவசமும் நிறைந்த இடைச்சொல்லின் உணர்ச்சிவலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: βάθος
  choice: ஆழம்
  rationale: அளந்தறிய முடியாத பெருமையை உருவகமாகக் குறிக்கும் கிரேக்கப் பெயர்ச்சொல்லுக்கு நேரான, இயல்பான இணைச்சொல்.
- source_word: πλούτου
  choice: செல்வம்
  rationale: πλοῦτος என்பதிலுள்ள வளமை மற்றும் மிகுதியின் உருவகத்தைத் தக்கவைக்கிறது; வெறும் பொருளாதாரச் சொத்தாக மட்டும் குறுக்கவில்லை.
- source_word: σοφίας
  choice: ஞானம்
  rationale: கடவுளின் ஞானமிக்க ஆலோசனையையும் செயல்முறையையும் குறிக்கும் வழக்கமான, தெளிவான மொழிபெயர்ப்பு.
- source_word: γνώσεως
  choice: அறிவு
  rationale: ஞானத்திலிருந்து வேறுபட்ட தனிச் சொல்லாக கிரேக்க உரையில் இருப்பதால் அந்த வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: θεοῦ
  choice: கடவுளுடைய
  rationale: முன்னுள்ள செல்வம், ஞானம், அறிவு ஆகிய மூன்றையும் இயல்பாகச் சார்ந்த உடைமைத் தொடர்பைத் தமிழில் காட்டுகிறது.
- source_word: ὡς
  choice: எவ்வளவு
  rationale: வியப்பை அறிமுகப்படுத்தும் கிரேக்கப் பயன்பாட்டைத் தமிழில் இயல்பான வியப்புத் தொடராக வெளிப்படுத்துகிறது.
- source_word: ἀνεξεραύνητα
  choice: ஆராய்ந்தறிய முடியாதவை
  rationale: முழுமையாக ஆராய்ந்து கண்டறிய இயலாத தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: κρίματα
  choice: தீர்ப்புகள்
  rationale: கடவுளின் மதிப்பீடுகள், முடிவுகள், நீதித் தீர்மானங்கள் ஆகிய பரந்த பொருள் வரம்பைத் தக்கவைக்கிறது.
- source_word: ἀνεξιχνίαστοι
  choice: தடம்பிடிக்க முடியாதவை
  rationale: தேடுதல் அல்லது ஆராய்தலை மட்டும் அல்லாமல், சுவட்டைப் பின்தொடர்ந்து கண்டறிதல் இயலாதது என்ற கிரேக்க உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ὁδοὶ
  choice: வழிகள்
  rationale: கடவுளின் செயல்முறைகளையும் அவர் மேற்கொள்ளும் போக்குகளையும் குறிக்கும் மூல உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: கடவுளைக் குறிக்கும் மீண்டும் வரும் உடைமைச் சுட்டைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘கடவுளுடைய’ என்பது செல்வம், ஞானம், அறிவு ஆகியவற்றுடன் கொண்டுள்ள தொடர்பு
  choice: ‘கடவுளுடைய’ என்பது செல்வம், ஞானம், அறிவு ஆகிய மூன்றையும் சார்ந்ததாக முதன்மை உரையில் கொள்ளப்பட்டுள்ளது.
  alternative: ‘கடவுளுடைய ஞானம் மற்றும் அறிவு ஆகியவற்றின் செல்வத்தின் ஆழம்’ என்று ‘செல்வம்’ என்பதை அடுத்து வரும் இரண்டோடும் நெருக்கமாக இணைத்துப் புரிந்துகொள்ளலாம்.
  rationale: கிரேக்கச் சொற்றொடர் இரு வகையான தொடரியல் புரிதலுக்கும் இடமளிக்கிறது. சூழலில் மூன்று பண்புகளையும் கடவுளுக்குரியவையாகக் குவித்துச் சொல்வது இயல்பான வாசிப்பு; மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀνεξεραύνητα மற்றும் ἀνεξιχνίαστοι ஆகிய இரு சொற்களின் வேறுபாடு
  choice: முறையே ‘ஆராய்ந்தறிய முடியாதவை’ என்றும் ‘தடம்பிடிக்க முடியாதவை’ என்றும் வேறுபடுத்தப்பட்டுள்ளது.
  alternative: இரண்டையும் ‘அறிந்துகொள்ள முடியாதவை’ போன்ற ஒரே பொருளுடைய சொற்களால் மொழிபெயர்க்கலாம்.
  rationale: முதல் சொல் ஆராய்ந்து கண்டறிய முடியாததையும், இரண்டாவது சொல் சுவட்டைப் பின்தொடர முடியாததையும் வலியுறுத்துகிறது. அவற்றை வேறுபடுத்துவது மூலத்தின் சொல்லாட்சிச் செறிவைப் பாதுகாக்கிறது; தேவையற்ற கோட்பாட்டு வேறுபாட்டை உருவாக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், துதிப்பரவசமும் வியப்பும் நிறைந்த கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆ!’ என்ற தொடக்கம் மூலத்தின் உணர்ச்சிவலிமையைத் தக்கவைக்கிறது. இரு இணை வாக்கியங்களிலும் சுருக்கமான பெயரடை அமைப்பு பயன்படுத்தப்பட்டு பவுலின் வாக்கிய ஓசை பாதுகாக்கப்பட்டுள்ளது.
