id: ROM.11.24
reference: Romans 11:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: ta
  text: 'இயல்பாகக் காட்டு ஒலிவ மரத்திலிருந்து நீ வெட்டியெடுக்கப்பட்டு, இயல்புக்கு மாறாகப் பண்படுத்தப்பட்ட ஒலிவ மரத்தில் ஒட்டிவைக்கப்பட்டாய் என்றால், இயல்பின்படியான இந்தக் கிளைகள்[a] தங்களுக்குரிய ஒலிவ மரத்தில் இன்னும் எவ்வளவு அதிகமாக ஒட்டிவைக்கப்படுவார்கள்[b]!


    [a] கிரேக்க மூலத்தில், “இயல்பின்படியான இவர்கள்” என்றே உள்ளது. இங்கு ஒலிவ மர உருவகத்தின் அடிப்படையில் “கிளைகள்” என்பது சேர்க்கப்பட்டுள்ளது.


    [b] “தங்களுக்குரிய ஒலிவ மரத்தில் மீண்டும் ஒட்டிவைக்கப்படுவார்கள்” என்றும் மொழிபெயர்க்கலாம். திரும்பச் சேர்க்கப்படுவது சூழலில் புலப்பட்டாலும், “மீண்டும்” என்பது கிரேக்க வினைச்சொல்லில் வெளிப்படையாக இல்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில், “இயல்பின்படியான இவர்கள்” என்றே உள்ளது. இங்கு ஒலிவ மர உருவகத்தின் அடிப்படையில் “கிளைகள்” என்பது சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “தங்களுக்குரிய ஒலிவ மரத்தில் மீண்டும் ஒட்டிவைக்கப்படுவார்கள்” என்றும் மொழிபெயர்க்கலாம். திரும்பச் சேர்க்கப்படுவது சூழலில் புலப்பட்டாலும், “மீண்டும்” என்பது கிரேக்க வினைச்சொல்லில் வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: வெட்டியெடுக்கப்பட்டு
  rationale: ἐκκόπτω என்பதன் வெட்டி அகற்றுதல் என்ற பொருளையும் ஒலிவ மர உருவகத்தையும் தெளிவாகக் காக்கிறது; அருகிலுள்ள வசனங்களின் தாக்கத்தால் ‘முறித்தெடுக்கப்பட்டு’ என்று மாற்றவில்லை.
- source_word: ἀγριελαίου
  choice: காட்டு ஒலிவ மரம்
  rationale: பண்படுத்தப்படாத ஒலிவ மரத்தைக் குறிக்கிறது; καλλιέλαιον என்பதற்கு நேரான வேறுபாட்டை உருவாக்குகிறது.
- source_word: παρὰ φύσιν
  choice: இயல்புக்கு மாறாக
  rationale: κατὰ φύσιν என்பதுடன் பவுல் அமைக்கும் சொல்லாட்சிசார் எதிர்மறையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: ஒட்டவைக்கப்பட்டாய் / ஒட்டவைக்கப்படுவார்கள்
  rationale: மரக்கிளையை இன்னொரு மரத்தில் ஒட்டுதல் என்ற தோட்டக்கலைச் செயலைத் துல்லியமாகவும் புரியத்தக்க தமிழிலும் தெரிவிக்கிறது; இரு வடிவங்களின் செயப்பாட்டு நிலையையும் காக்கிறது.
- source_word: καλλιέλαιον
  choice: பண்படுத்தப்பட்ட ஒலிவ மரம்
  rationale: காட்டு ஒலிவ மரத்துக்கு மாறாகப் பயிரிட்டு வளர்க்கப்பட்ட ஒலிவ மரம் என்பதைக் காட்டுகிறது; மதிப்பீட்டுத் தொனியுள்ள ‘நல்ல ஒலிவ மரம்’ என்பதைக் தவிர்க்கிறது.
- source_word: πόσῳ μᾶλλον
  choice: இன்னும் எவ்வளவு அதிகமாக
  rationale: குறைந்த சாத்தியத்திலிருந்து அதிக சாத்தியத்துக்குச் செல்லும் பவுலின் வலியுறுத்தும் ஒப்பீட்டை வெளிப்படுத்துகிறது.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: இயல்பாகவே அந்த மரத்துக்குரிய இந்தக் கிளைகள்
  rationale: கிரேக்கத்தில் ‘கிளைகள்’ வெளிப்படையாக இல்லாவிட்டாலும், உடனடிச் சூழலின் ஒலிவ மர உருவகத்திலிருந்து அது தெளிவாகப் பெறப்படுகிறது; ‘இஸ்ரவேலர்’ அல்லது ‘யூதர்’ என்பதை வசனத்தில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: தங்களுக்குரிய ஒலிவ மரத்தில்
  rationale: ἰδίᾳ வலியுறுத்தும் சொந்தச் சார்பையும், ஒட்டுதல் உருவகத்துக்கேற்ற இடப்பொருளையும் இயல்பான தமிழில் அளிக்கிறது.
theological_decisions:
- issue: ‘இவர்கள்’ யாரைக் குறிக்கிறது என்பதை இஸ்ரவேலர் அல்லது யூதர் என்று வெளிப்படையாக்கலாமா
  choice: ஒலிவ மர உருவகத்துக்குள் ‘அந்த மரத்துக்குரிய இந்தக் கிளைகள்’ என்று வைத்தல்
  alternative: ‘இந்த இஸ்ரவேலர்’ அல்லது ‘இந்த யூதர்கள்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: ரோமர் 11-ன் சூழல் இன அடிப்படையிலான இஸ்ரவேலைச் சுட்டினாலும், இவ்வசனத்தின் கிரேக்கம் இனப்பெயரைப் பயன்படுத்தாமல் ‘இயல்பின்படியான இவர்கள்’ என்கிறது. எனவே சூழல் குறிப்பிடுபவர்களை அடையாளப்படுத்த அனுமதிக்கப்படுகிறது.
- issue: கிரேக்கத்தில் இல்லாத ‘கிளைகள்’ என்ற சொல்லை முதன்மை உரையில் சேர்த்தல்
  choice: தெளிவுக்காக ‘கிளைகள்’ என்பதைச் சேர்த்து, அதை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘இயல்பின்படியான இவர்கள்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: முந்தைய வசனங்களின் முறிக்கப்பட்டதும் ஒட்டப்பட்டதுமான கிளைகள் இந்தச் சொல்லின் விடுபட்ட பெயர்ச்சொல்லை நிரப்புகின்றன. தமிழில் உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் தொடரச் செய்வதற்கான குறைந்தபட்சச் சேர்க்கை இது.
- issue: இறுதி வினையில் ‘மீண்டும்’ என்பதைச் சேர்த்தல்
  choice: முதன்மை உரையில் ‘மீண்டும்’ என்பதைச் சேர்க்காமல் அடிக்குறிப்பில் மாற்றாக வழங்குதல்
  alternative: ‘மீண்டும் ஒட்டவைக்கப்படுவார்கள்’ என்று மொழிபெயர்த்தல்
  rationale: திரும்ப இணைக்கப்படுதல் சூழலில் வலுவாக உணர்த்தப்பட்டாலும், ἐγκεντρισθήσονται என்ற வினைச்சொல்லில் ‘மீண்டும்’ என்பது வெளிப்படையாக இல்லை. ஆகவே மூலத்தின் சொற்பொருளையும் சூழலின் உட்பொருளையும் வேறுபடுத்திக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒட்டவைத்தல்’ தோட்டக்கலை உருவகத்தைத் தெளிவாகக் காக்கிறது. நீண்ட கிரேக்க நிபந்தனை வாக்கியத்தின் தர்க்க ஓட்டம் தமிழிலும் ஒரே வாக்கியமாகப் பேணப்பட்டுள்ளது.
