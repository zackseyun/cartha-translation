id: ROM.11.34
reference: Romans 11:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: ta
  text: ஏனெனில், ஆண்டவரின் மனதை அறிந்தவர் யார்? அல்லது அவருக்கு ஆலோசகரானவர் யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பவுல் இங்கு ஏசாயா 40:13-ஐ எதிரொலிக்கிறார். அங்குள்ள கிரேக்க உரையும் ஆண்டவரின் மனதை அறிந்தவர் யார் அல்லது அவருக்கு ஆலோசகரானவர் யார் என்று இதேபோல் கேட்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: யார்
  rationale: விடையை எதிர்பார்க்காத வினாவை அறிமுகப்படுத்தும் வினாப்பெயர்; எளிய ‘யார்’ என்பது இயல்பாகவும் மூலத்தின் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணவிளக்கத் தொடர்பைக் காட்டுகிறது; பவுலின் வாத ஓட்டத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἔγνω
  choice: அறிந்தவர்
  rationale: γινώσκω என்பதன் இறந்தகால வடிவம்; வேதாகம மேற்கோளின் பொதுவான, விடையை எதிர்பார்க்காத வினாவில் ‘அறிந்தவர் யார்?’ என்பது காலநுட்பத்தை இயல்பாக வெளிப்படுத்தி, ‘புரிந்துகொண்டவர்’ என்ற விளக்கத்தைச் சேர்க்காமல் மூலத்திற்கு நெருக்கமாக உள்ளது.
- source_word: νοῦν
  choice: மனதை
  rationale: இங்கு மனம், எண்ணம், நோக்கம் ஆகிய பொருள் பரப்பைக் கொண்டது; ‘மனம்’ நேரடியானதும் தமிழில் தெளிவானதும் ஆகும்.
- source_word: κυρίου
  choice: ஆண்டவரின்
  rationale: κύριος என்பதற்கான இயல்பான, மரியாதைக்குரிய தமிழ் இணை; ஏசாயா பின்னணியைத் தக்கவைத்தபடி புதிய ஏற்பாட்டு கிரேக்கச் சொல்லையே மொழிபெயர்க்கிறது.
- source_word: ἢ
  choice: அல்லது
  rationale: இணையான இரண்டாவது வினாவை மாற்றுத் தொடர்புடன் இணைக்கும் கிரேக்க அமைப்பைப் பாதுகாக்கிறது.
- source_word: σύμβουλος
  choice: ஆலோசகரானவர்
  rationale: ஆலோசனை வழங்குபவரைக் குறிக்கும் பெயர்ச்சொல்லுக்கு நேரடியான, நடப்புத் தமிழில் தெளிவான இணை.
- source_word: αὐτοῦ
  choice: அவருக்கு
  rationale: தமிழில் ‘ஒருவருக்கு ஆலோசகராக இருத்தல்’ என்பது இயல்பான வேற்றுமை அமைப்பு; குறிக்கப்படுபவருக்குரிய மரியாதையையும் காக்கிறது.
- source_word: ἐγένετο
  choice: ஆலோசகரானவர்
  rationale: γίνομαι என்பதன் ‘ஆகுதல்’ பொருள், ‘ஆலோசகரானவர்’ என்ற வினையாலணையும் பெயர் வடிவத்தில் இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: ஏசாயாவிலிருந்து எதிரொலிக்கும் மேற்கோளில் ‘ஆண்டவர்’ என்பதன் குறிப்பு
  choice: ‘ஆண்டவர்’ என்று மொழிபெயர்த்து, வசனத்தின் சொற்கள் கூறுவதைவிடக் குறிப்பை மேலும் குறுக்கவில்லை.
  alternative: ஏசாயாவின் எபிரெயப் பின்னணியை முன்னிறுத்தி இறைப்பெயருடன் தொடர்புடைய தனி வடிவத்தைப் பயன்படுத்துதல்.
  rationale: கிரேக்க மூலத்தில் κυρίου உள்ளது. பவுல் ஏசாயா 40:13-ஐ கிரேக்க மரபின் சொற்களில் எதிரொலிப்பதால், முதன்மை உரையில் பழைய ஏற்பாட்டின் எபிரெய வடிவத்தை இறக்குமதி செய்யாமல் புதிய ஏற்பாட்டு வடிவம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் அமைந்துள்ளது. இணையான இரு வினாக்களும் மூலத்தின் வாதத்தையும் ஓசையையும் காக்கின்றன.
