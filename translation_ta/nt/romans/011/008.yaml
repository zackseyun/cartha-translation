  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: ta
  text: 'எழுதியிருக்கிறபடியே: “தேவன் அவர்களுக்கு மந்தநிலையின் ஆவியையும்,[a] காணாத கண்களையும் கேளாத காதுகளையும் இன்றுவரை கொடுத்தார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆழ்ந்த தூக்கத்தின் ஆவி.” இந்தச் சொற்றொடர் ஏசாயா 29:10-ஐ எதிரொலிக்கிறது; எனினும் இங்குள்ள கிரேக்கச் சொல் உணர்வு மழுங்கிய அல்லது மந்தமான நிலையைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: எழுதப்பட்டிருக்கிறபடியே
  rationale: வேதவாக்கிய மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடர்; καθώς என்பதன் ஒப்புமை வலியுறுத்தலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: தேவன் அவர்களுக்குக் கொடுத்தார்
  rationale: இறந்தகால வினையையும், தேவனே வெளிப்படையான செய்பவர் என்பதையும் மென்மைப்படுத்தாமல் நேரடியாகக் காட்டுகிறது.
- source_word: πνεῦμα κατανύξεως
  choice: உணர்வுமழுங்கிய ஆவி
  rationale: κατάνυξις குறிக்கும் மந்தநிலை, உணர்வின்மை அல்லது திகைப்புற்ற மழுங்கிய நிலையைச் சுருக்கமாகவும் புரியத்தக்க வகையிலும் தெரிவிக்கிறது; ஏசாயா 29:10-ஐ எதிரொலிக்கும் ‘ஆழ்ந்த தூக்கத்தின் ஆவி’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: காணாத கண்கள்
  rationale: τοῦ μὴ + வினையெச்சக் கட்டமைப்பின் நோக்கம்/விளைவு நிழலை அளவுக்கு மீறித் தீர்மானிக்காமல், தமிழில் செறிவான வேதவாக்கிய நடையை வழங்குகிறது.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: கேளாத காதுகள்
  rationale: முந்தைய இணை அமைப்பைத் தக்கவைத்து, கேட்கும் திறனற்ற நிலையைக் குறிக்கும் ἀκούειν என்பதைக் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: இன்றுவரை
  rationale: மேற்கோளின் நிலை பவுலின் நிகழ்காலம்வரை தொடர்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: கடினப்படுத்துதல் அல்லது உணர்வின்மையில் தேவனுடைய செயற்பாடு
  choice: ‘தேவன் ... கொடுத்தார்’ என்ற நேரடியான கூற்றைத் தக்கவைத்தல்
  alternative: ‘தேவன் அனுமதித்தார்’ அல்லது ‘அவர்கள் அப்படியிருக்க விட்டார்’
  rationale: கிரேக்கத்தில் Ἔδωκεν என்பதன் வெளிப்படையான எழுவாய் ὁ θεός. இதை வெறும் அனுமதியாக மாற்றுவது உரையில் இல்லாத இறையியல் தணிப்பைச் சேர்க்கும்; நேரடி மொழிபெயர்ப்பு தெய்வீக நியாயத்தீர்ப்புக்கும் மனிதப் பொறுப்புக்கும் இடையிலான பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- issue: τοῦ μὴ + வினையெச்சத்தின் நோக்கம்/விளைவு தெளிவின்மை
  choice: ‘காணாத கண்கள், கேளாத காதுகள்’ என்ற சுருக்கமான அமைப்பு
  alternative: ‘காணாதபடிக்கும் கேளாதபடிக்கும்’
  rationale: கிரேக்கக் கட்டமைப்பு நோக்கத்தையோ விளைவையோ சுட்டலாம். தமிழ் உரையில் ஒன்றை மட்டும் வலியுறுத்தாமல், மேற்கோளின் இணைநடையையும் உண்மையான தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதவாக்கிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘உணர்வுமழுங்கிய’ என்பது அரிய தொழில்நுட்பச் சொல்லைத் தவிர்த்து κατάνυξις என்பதன் பொருளை எடுத்துரைக்கிறது. அடிக்குறி [a] தொடர்புடைய சொற்றொடருக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளது.
