id: ROM.11.30
reference: Romans 11:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: ta
  text: ஏனெனில், நீங்கள் முன்பு கடவுளுக்குக் கீழ்ப்படியாமல் இருந்தும், இப்போது இவர்களுடைய கீழ்ப்படியாமையினால் இரக்கம் பெற்றிருக்கிறீர்கள்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ஏனெனில், ... பெற்றிருக்கிறீர்களோ
  rationale: γάρ தரும் விளக்கத் தொடர்பை ‘ஏனெனில்’ வெளிப்படுத்துகிறது; ὥσπερ தொடங்கும் ஒப்பீடு அடுத்த வசனத்தில் நிறைவடைவதால், ‘-ஓ’ விகுதி அதன் தொடரும் ஒப்பீட்டு அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை. உடனடி கிரேக்க வாசகத்தில் இல்லாத ‘பிற இனத்தாராகிய’ போன்ற விளக்கத்தைச் சேர்க்காமல் பன்மையை இயல்பாகக் காட்டுகிறது.
- source_word: ποτε
  choice: முன்பு
  rationale: கடந்த நிலையை νῦν (‘இப்போது’) என்பதுடன் தெளிவாக எதிர்நிறுத்தும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἠπειθήσατε
  choice: கீழ்ப்படியாமல் இருந்தீர்கள்
  rationale: ἀπειθέω கீழ்ப்படியாமையையும் நம்ப மறுத்தலையும் குறிக்கக்கூடும். இங்கு பெயர்ச்சொல்லான ἀπείθεια உடனான சொல் தொடர்பையும், கடவுளை நோக்கிய ஒழுக்க-உறவு சார்ந்த பொருளையும் இது காக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: ἀπειθέω வினையின் இலக்கைச் சுட்டும் வேற்றுமையைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: νῦν δὲ
  choice: இப்போதோ
  rationale: முந்தைய கீழ்ப்படியாமைக்கும் தற்போதைய இரக்கப் பெறுதலுக்கும் இடையிலான வலுவான மாறுபாட்டைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ἠλεήθητε
  choice: இரக்கம் பெற்றிருக்கிறீர்கள்
  rationale: ἐλεάω என்பதன் இறைவினைப் பாட்டை இயல்பான தமிழில் தருவதோடு, இரக்கம் அவர்களுக்கு வழங்கப்பட்டது என்ற கவனத்தையும் காக்கிறது.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: இவர்களுடைய கீழ்ப்படியாமையினால்
  rationale: τούτων என்பதன் அருகாமைச் சுட்டுப் பொருளை ‘இவர்கள்’ காக்கிறது. ‘-இனால்’ காரண அல்லது கருவிப் பொருள் இரண்டிற்கும் இடமளித்து, கிரேக்க வேற்றுமையின் அளவுக்கு மீறிய விளக்கத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: பவுலின் மீட்பு வரலாற்றுச் சூழலில் ἀπειθέω / ἀπείθεια என்பவற்றின் பொருள்
  choice: கீழ்ப்படியாமல் இருந்தீர்கள் / கீழ்ப்படியாமை
  alternative: நம்ப மறுத்தீர்கள் / நம்ப மறுத்தல்
  rationale: இச்சொற்களில் நம்பாமையும் கீழ்ப்படியாமையும் ஒன்றோடொன்று பின்னியுள்ளன. முதன்மை உரையில் ‘கீழ்ப்படியாமை’ என்ற பொருளைத் தேர்ந்தெடுப்பது வினை-பெயர்ச்சொல் தொடர்பைக் காத்து, பவுலின் சொல்லை வெறும் அறிவுசார் நம்பாமையாகக் குறுக்காமல் விடுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் ஒப்பீட்டின் முதல் பகுதி என்பதால் இறுதியில் ‘-ஓ’ அமைப்பும் காற்புள்ளியும் வைக்கப்பட்டுள்ளன.
