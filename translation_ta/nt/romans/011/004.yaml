  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: ta
  text: ஆனால் அவருக்கு இறைவன் அளித்த பதில்[a] என்ன சொல்கிறது? “எனக்கென்று ஏழாயிரம் ஆண்களை விட்டுவைத்திருக்கிறேன்[b]; அவர்கள் பாகாலுக்கு முழங்கால் மடக்கவில்லை.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைவனிடமிருந்து வந்த மறுமொழி” அல்லது “இறைவாக்கு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்காக ஒதுக்கிவைத்திருக்கிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: இறைவன் அளித்த பதில்
  rationale: இங்கு இது எலியாவுக்கு இறைவனிடமிருந்து வந்த அதிகாரப்பூர்வமான பதிலைக் குறிக்கிறது. ‘இறைவன் அளித்த பதில்’ என்பது அதன் தெய்வீக மூலத்தைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: Κατέλιπον
  choice: விட்டுவைத்திருக்கிறேன்
  rationale: இறைவன் அவர்களைத் தனக்கென்று வைத்திருக்கும் நிறைவேறிய செயலையும் அதன் தொடரும் விளைவையும் இந்தத் தமிழ் வினைவடிவு வெளிப்படுத்துகிறது; ‘பாதுகாத்தேன்’ என்று பொருளை விரிவுபடுத்தாமல் மூலச்சொல்லின் நுணுக்கத்தையும் காக்கிறது.
- source_word: ἐμαυτῷ
  choice: எனக்கென்று
  rationale: தற்சுட்டுப் பொருளுடைய இந்த வேற்றுமை வடிவம், அந்த ஏழாயிரம் பேரையும் இறைவன் தனக்காக விட்டுவைத்தார் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: ஏழாயிரம் ஆண்கள்
  rationale: ἄνδρας என்பது பொதுவாக மக்களைக் குறிக்கும் பாலினச் சார்பற்ற சொல் அல்ல; குறிப்பாக ஆண்களைக் குறிக்கும் சொல். எனவே மூலத்தின் பாலினக் குறிப்பை மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: குறிப்பிட்ட அந்த ஏழாயிரம் ஆண்களை விவரிக்கும் தொடர்பை தமிழில் தெளிவாகவும் இயல்பாகவும் தொடங்குகிறது.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: முழங்கால் மடக்காதவர்கள்
  rationale: வழிபாட்டுக்குரிய பணிவைக் குறிக்கும் உருவகத்தை விளக்கமாக மாற்றாமல், மூலத்தில் உள்ள முழங்கால் மடக்கும் காட்சியைப் பாதுகாக்கிறது.
- source_word: τῇ Βάαλ
  choice: பாகாலுக்கு
  rationale: Βάαλ என்ற தெய்வப் பெயர் தமிழில் வழக்கமான ‘பாகால்’ என ஒலிபெயர்க்கப்படுகிறது; இலக்கண உருபு தமிழின் இயல்புக்கு ஏற்ப சேர்க்கப்படுகிறது.
theological_decisions:
- issue: மேற்கோளில் பதில் அளிப்பவர் இறைவன் என்பதை வெளிப்படையாகக் குறிப்பிடுவதா
  choice: χρηματισμός என்பதை ‘இறைவன் அளித்த பதில்’ என்று மொழிபெயர்த்து, மேற்கோளில் இறைவனின் முதலாம் நபர் பேச்சைத் தக்கவைத்தல்
  alternative: தெய்வீக மூலத்தை வெளிப்படையாகச் சொல்லாமல் ‘பதில்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: சூழலும் 1 இராஜாக்கள் 19 பின்னணியும் இது எலியாவுக்கு இறைவன் அளித்த பதில் என்பதைத் தெளிவாக்குகின்றன. இதை வெளிப்படுத்துவது உரையின் பொருளை இயல்பாகத் தருகிறது; கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: ἄνδρας என்பதன் பாலினக் குறிப்பை மொழிபெயர்ப்பில் காப்பதா
  choice: ஆண்கள்
  alternative: மக்கள்
  rationale: மூல உரை குறிப்பாக ஆண்களைக் குறிக்கும் சொல்லைப் பயன்படுத்துவதால், அதை பாலினச் சார்பற்ற பொதுச்சொல்லாக மாற்றாமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘முழங்கால் மடக்குதல்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘மீதியானோர்’ போன்ற விளக்கச் சொல்லை வசனத்தில் சேர்க்காமல் உரையின் இறுக்கமும் இறையியல் அழுத்தமும் தக்கவைக்கப்பட்டுள்ளன.
