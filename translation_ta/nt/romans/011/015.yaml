source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: ta
  text: ஏனெனில், அவர்களுடைய புறக்கணிப்பு உலகத்தின் ஒப்புரவாக இருந்தால், அவர்களுடைய ஏற்றுக்கொள்ளப்படுதல் இறந்தோரிலிருந்து உயிர் உண்டாதலாக அல்லாமல் வேறென்னவாக இருக்கும்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இறந்தோரிலிருந்து உயிர்” என்பது அசாதாரணமான ஆவிக்குரிய புதுப்பித்தலை உருவகமாகக் குறிக்கலாம்; அல்லது இன்னும் குறிப்பாக உயிர்த்தெழுதலைக் குறிக்கலாம். பவுல் இச்சொற்றொடரைச் சுருக்கமாகவும் பல்வேறு தொடர்புகளைத் தூண்டும் வகையிலும் விட்டுள்ளார்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: புறக்கணிக்கப்பட்டது
  rationale: இச்சூழலில் இஸ்ரவேலர் ஒதுக்கப்பட்டதன் உறவுசார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் ‘இழப்பு’ என்ற பொருளாகக் குறுக்கவில்லை.
- source_word: καταλλαγὴ
  choice: ஒப்புரவாக்கப்படுவது
  rationale: முறிந்த உறவு சீராக்கப்பட்டு இணக்கம் ஏற்படுதல் என்ற பவுலின் வழக்கமான கருத்தைத் தெரிவிக்கிறது.
- source_word: κόσμου
  choice: உலகம்
  rationale: கிரேக்கச் சொல்லின் பரந்த வடிவத்தைப் பேணுகிறது; முதன்மை உரையிலேயே அதை புறவினத்தாருக்கு மட்டும் வரையறுக்கவில்லை.
- source_word: πρόσλημψις
  choice: ஏற்றுக்கொள்ளப்படுவது
  rationale: ἀποβολή என்பதற்கு இயல்பான எதிரிணையாக இருந்து, மீண்டும் ஏற்றுக்கொள்ளப்படுதல் என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து உயிர் உண்டாவது
  rationale: கிரேக்கத்தின் சுருக்கமான, உயிர்த்தெழுதல் சார்ந்திருக்கக்கூடிய உருவகத்தைப் பேணி, அதன் பொருளை ஒரே விளக்கத்துக்குள் அடைக்கவில்லை.
- source_word: εἰ μὴ
  choice: அல்லாமல் வேறென்ன
  rationale: வினாவுக்குள் எதிர்பார்க்கப்படும் வலியுறுத்தப்பட்ட பதிலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்துடனான காரணவியல் தொடர்பைப் பேணுகிறது.
theological_decisions:
- issue: ‘இறந்தோரிலிருந்து உயிர்’ என்பதன் பொருள்
  choice: ஆவிக்குரிய பெரும் புதுப்பித்தலா அல்லது உயிர்த்தெழுதலா என்பதைத் தீர்மானிக்காமல் திறந்த இறுதிக்கால வெளிப்பாடாகப் பேணுதல்
  alternative: இதைப் பெரிய ஆவிக்குரிய மறுமலர்ச்சி என்று மட்டும் அல்லது இறுதி உயிர்த்தெழுதல் என்று மட்டும் வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: பவுலின் சொற்றொடர் சுருக்கமாகவும் பல்வேறு தொடர்புகளைத் தூண்டுவதாகவும் உள்ளது; கிரேக்கம் தீர்மானிக்காத இறையியல் நெருக்கடியை மொழிபெயர்ப்பு தீர்த்துவிடக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. எதிரிணையான ‘புறக்கணிக்கப்பட்டது / ஏற்றுக்கொள்ளப்படுவது’ என்ற அமைப்பும், வசனத்தின் வினாவடிவமும் பேணப்பட்டுள்ளன.
