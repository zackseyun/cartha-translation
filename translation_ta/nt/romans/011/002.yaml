id: ROM.11.2
reference: Romans 11:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: ta
  text: தேவன் தாம் முன்பே அறிந்திருந்த தம் மக்களைத் தள்ளிவிடவில்லை. அல்லது, எலியாவைப் பற்றிய பகுதியில், அவர் இஸ்ரவேலுக்கு எதிராக தேவனிடம் எவ்வாறு முறையிடுகிறார் என்று வேதம் என்ன சொல்கிறது என்பது உங்களுக்குத் தெரியாதா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπώσατο
  choice: தள்ளிவிடவில்லை
  rationale: இச்சூழலில் ἀπωθέομαι என்பது ‘நிராகரித்தல்’ அல்லது ‘ஒதுக்கித் தள்ளுதல்’ என்று பொருள்படும். ‘தள்ளிவிடவில்லை’ என்பது தேவன் தமது மக்களை முற்றிலும் கைவிடவில்லை என்ற பவுலின் மறுப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: τὸν λαὸν αὐτοῦ
  choice: தமது மக்களை
  rationale: λαός இங்கு தேவனுக்குரிய உடன்படிக்கை மக்களைக் குறிக்கிறது. பின்னர் ‘இஸ்ரவேல்’ வெளிப்படையாக வருவதால், முதல் வாக்கியத்தில் அதைச் சேர்க்காமல் ‘தமது மக்கள்’ என்ற உறவுணர்வைப் பேணுகிறது.
- source_word: προέγνω
  choice: முன்பே அறிந்திருந்த
  rationale: προγινώσκω என்பதன் அடிப்படைப் பொருள் ‘முன்னதாக அறிதல்.’ ‘முன்பே அறிந்திருந்த’ என்பது இதைத் தெளிவான தமிழில் தருகிறது; ‘முன்பே தேர்ந்தெடுத்தார்’ என்ற வலுவான இறையியல் விளக்கத்தை மூலவாக்கியத்திற்குள் சேர்க்கவில்லை.
- source_word: ἢ οὐκ οἴδατε
  choice: அல்லது, ... உங்களுக்குத் தெரியாதா?
  rationale: பவுலின் சொல்லாட்சியிலுள்ள எதிர்வினாவை இயல்பான தமிழ்க் கேள்வியாகப் பேணுகிறது.
- source_word: ἐν Ἠλίᾳ
  choice: எலியாவைப் பற்றிய பகுதியில்
  rationale: சொல்லுக்குச் சொல் ‘எலியாவில்’ என்றிருந்தாலும், இது எலியாவைப் பற்றிய வேதப்பகுதியைக் குறிக்கும் வழக்குச் சொற்றொடர். பொருளை வெளிப்படையாகத் தருவது தமிழில் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: ἡ γραφή
  choice: வேதம்
  rationale: பவுலின் பயன்பாட்டில் γραφή பரிசுத்த வேத எழுத்தைக் குறிக்கிறது. ‘வேதம்’ என்பது நவீனத் தமிழில் இயல்பானதும் கண்ணியமானதும் ஆகும்.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: தேவனிடம் எப்படி முறையிடுகிறார்
  rationale: ἐντυγχάνω என்பது வேண்டுதல், முறையீடு செய்தல், பரிந்து பேசுதல் ஆகிய பொருட்களை உடையது. தொடர்ந்து ‘இஸ்ரவேலுக்கு எதிராக’ என்று வருவதால், நேர்மறையான பரிந்துரையை உணர்த்தாமல் ‘முறையிடுகிறார்’ என்பது சூழலுக்குப் பொருந்துகிறது.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: κατά உடன் வரும் பிறப்புவேற்றுமை இங்கு எதிரான நிலைப்பாட்டைக் குறிக்கிறது. ‘இஸ்ரவேல்’ என்ற பெயர் அப்படியே பேணப்பட்டுள்ளது.
theological_decisions:
- issue: προέγνω என்பதற்கும் தெய்வீகத் தேர்ந்தெடுப்பிற்கும் உள்ள தொடர்பு
  choice: முன்பே அறிந்திருந்த
  alternative: முன்னறிந்திருந்த; முன்பே நேசித்திருந்த; முன்பே தேர்ந்தெடுத்திருந்த
  rationale: இச்சொல் பவுலின் தேர்ந்தெடுப்பு பற்றிய விரிவான விவாதங்களோடு தொடர்புடையதாக இருந்தாலும், கிரேக்கச் சொல் மட்டும் அந்த இறையியல் விவாதத்தைத் தீர்மானிப்பதில்லை. ஆகவே ‘முன்பே அறிந்திருந்த’ என்று மொழிபெயர்த்து, வலுவான குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை முதன்மை உரையில் புகுத்தாமல் பதற்றத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தாம்/தமது’ என்பது தேவனைச் சுட்டும் இயல்பான தற்சுட்டுப் பயன்பாடு. கிரேக்க வாக்கியத்தின் எதிர்வினாவும், προέγνω சொல்லிலுள்ள இறையியல் திறந்தநிலையும் பேணப்பட்டுள்ளன.
