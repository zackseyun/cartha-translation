  rationale: முதல் வாக்கியத்தில் ‘தமது’ என்பதற்குப் பதில் இயல்பான ‘தம்’ பயன்படுத்தப்பட்டது. இரண்டாம் வாக்கியம், எலியாவைப் பற்றிய வேதப்பகுதியில் வேதம் கூறுவதைப் பற்றிய கேள்வியாகத் தெளிவாக மறுசீரமைக்கப்பட்டது. பொருள், காலநிலை, பெயர்கள், மற்றும் προέγνω-வின் இறையியல் திறந்தநிலை மாற்றப்படவில்லை. அடிக்குறிப்பு குறியீடுகளும் அவற்றின் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
