revisions:
- from: 'சகோதரர்களே,[a] நீங்கள் உங்களையே ஞானிகளாக எண்ணிக்கொள்ளாதபடி, இந்த மறைபொருளை நீங்கள் அறியாமல் இருப்பதை நான் விரும்பவில்லை: பிற இனத்தாரின் நிறைவு உள்ளே வரும் வரைக்கும், இஸ்ரவேலின் ஒரு பகுதியினருக்கு கடினமடைதல் ஏற்பட்டிருக்கிறது.[b]'
  to: 'சகோதரர்களே,[a] நீங்கள் உங்களையே ஞானிகளாக எண்ணிக்கொள்ளாதபடி, இந்த மறைபொருளை நீங்கள் அறியாமல் இருக்க நான் விரும்பவில்லை: பிற இனத்தாரின் நிறைவு[b] உள்ளே வரும்வரை, இஸ்ரவேலுக்கு ஓரளவு கடினத்தன்மை ஏற்பட்டிருக்கிறது.'
  rationale: The revision corrects the scope of “in part” so that it modifies the hardening without identifying a particular subset of Israel. It also places footnote b directly after “நிறைவு,” the expression it explains, and smooths the Tamil syntax while preserving the source’s unresolved sense of the Gentiles’ “fullness” and their “coming in.”
