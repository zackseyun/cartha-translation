source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: ta
  text: 'சகோதரர்களே,[a] நீங்கள் உங்களையே ஞானிகளாக எண்ணிக்கொள்ளாதபடி, இந்த மறைபொருளை நீங்கள் அறியாமல் இருக்க நான் விரும்பவில்லை: பிற இனத்தாரின் நிறைவு[b] உள்ளே வரும்வரை, இஸ்ரவேலுக்கு ஓரளவு கடினத்தன்மை ஏற்பட்டிருக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளே”; கிரேக்கத்தில் “சகோதரர்களே” என்று உள்ளது; அது ஆண்களும் பெண்களும் அடங்கிய குழுவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “பிற இனத்தாரின் நிறைவு” என்பது “பிற இனத்தாரின் முழு எண்ணிக்கை” என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: அறியாமல் இருப்பது
  rationale: பவுலின் வழக்கமான சொல்லமைப்பை இயல்பான தமிழில் தருகிறது; இழிவான அறியாமை என்ற பொருளைத் தவிர்த்து, தகவல் அறியாத நிலையைக் குறிக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க ஆண்பால் பன்மை அழைப்புமுறையைப் பாதுகாக்கிறது; கலப்புப் பாலினக் குழுவையும் குறிக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: μυστήριον
  choice: மறைபொருள்
  rationale: முன்பு மறைந்திருந்து இப்போது வெளிப்படுத்தப்பட்ட தெய்வீகத் திட்டம் என்ற பவுலின் கருத்தை, வெறும் இரகசியம் எனச் சுருக்காமல் தெரிவிக்கிறது.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: நீங்கள் உங்களையே ஞானிகளாக எண்ணிக்கொள்ளாதபடி
  rationale: தங்கள் சொந்த மதிப்பீட்டில் ஞானிகள் எனக் கருதும் தற்பெருமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πώρωσις
  choice: கடினமடைதல்
  rationale: ஆவிக்குரிய உணர்வின்மை அல்லது இருதயக் கடினநிலையைச் சுட்டுகிறது; யார் கடினப்படுத்தினார் என்பதை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- source_word: ἀπὸ μέρους
  choice: ஒரு பகுதியினருக்கு
  rationale: கடினமடைதல் இஸ்ரவேல் முழுவதையும் அல்ல, ஒரு பகுதியைச் சார்ந்தது என்ற அளவுசார் பொருளைத் தெளிவாக்குகிறது; கால அளவாக மாற்றவில்லை.
- source_word: τῷ Ἰσραήλ γέγονεν
  choice: இஸ்ரவேலின் ஒரு பகுதியினருக்கு ... ஏற்பட்டிருக்கிறது
  rationale: γέγονεν என்பதன் நிகழ்ந்து தற்போதும் நீடிக்கும் விளைவை தமிழ் நிறைவுநிலையில் தெரிவிக்கிறது.
- source_word: πλήρωμα
  choice: நிறைவு
  rationale: முழு எண்ணிக்கை, முழுச் சேர்க்கை, அல்லது நிறைவுநிலை ஆகிய விவாதத்திற்குரிய நுணுக்கங்களைத் தீர்மானிக்காமல் மூலத்தின் விரிவைத் தக்கவைக்கிறது.
- source_word: τῶν ἐθνῶν
  choice: பிற இனத்தாரின்
  rationale: இங்கு இஸ்ரவேலுக்கு மாறாக யூதரல்லாத மக்களைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: εἰσέλθῃ
  choice: உள்ளே வரும்
  rationale: ἄχρι οὗ உடன் வரும் எல்லைநிகழ்வை நேரடியாகத் தருகிறது; எதற்குள் வருகின்றனர் என்பதை மூலம்போலவே குறிப்பிடாமல் விடுகிறது.
theological_decisions:
- issue: “பிற இனத்தாரின் நிறைவு” என்பதன் பொருள்
  choice: முதன்மை உரையில் “பிற இனத்தாரின் நிறைவு” என்று திறந்த பொருளுடன் வைக்கப்பட்டது.
  alternative: “பிற இனத்தாரின் முழு எண்ணிக்கை” அல்லது “பிற இனத்தார் முழுமையாகச் சேர்க்கப்படுதல்.”
  rationale: πλήρωμα இங்கு எண்ணிக்கை, சேர்க்கை, அல்லது இறுதிக்கால நிறைவு ஆகியவற்றில் எதைத் துல்லியமாகக் குறிக்கிறது என்பது விவாதத்திற்குரியது; மொழிபெயர்ப்பு அதைத் தீர்மானிக்கவில்லை.
- issue: ἀδελφοί என்பதன் பாலினச் சார்பு மற்றும் உரையாடல் வட்டம்
  choice: “சகோதரர்களே” என மூலத்தின் ஆண்பால் பன்மை வடிவம் தக்கவைக்கப்பட்டது.
  alternative: “சகோதர சகோதரிகளே.”
  rationale: கிரேக்க வடிவத்தை முதன்மை உரை பாதுகாக்கிறது; பெண்களும் உள்ள கலப்புக் குழுவை இச்சொல் அழைக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ἀπὸ μέρους என்பதன் தொடர்பு
  choice: கடினமடைதல் இஸ்ரவேலின் ஒரு பகுதியினரைச் சார்ந்ததாக மொழிபெயர்க்கப்பட்டது.
  alternative: “இஸ்ரவேலுக்கு ஓரளவு கடினமடைதல் ஏற்பட்டிருக்கிறது.”
  rationale: இச்சொற்றொடர் கடினமடைதலின் அளவைச் சுட்டுகிறது; அதன் காலநீளத்தை மட்டும் குறிக்கிறது என மொழிபெயர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில் இயல்பான, கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. “மறைபொருள்,” “கடினமடைதல்,” “நிறைவு” ஆகியவை இறையியல் செறிவையும் மூலத்தின் தெளிவின்மையையும் பாதுகாக்கின்றன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
