revisions:
- from: அப்படியானால், “நான் ஒட்டவைக்கப்படுவதற்காகக் கிளைகள் முறித்துப்போடப்பட்டன” என்று நீ சொல்வாய்.
  to: அப்படியானால், “நான் ஒட்டப்படுவதற்காகக் கிளைகள் முறிக்கப்பட்டன” என்று நீ சொல்வாய்.
  rationale: The revision preserves the imagined interlocutor’s direct claim and its purpose wording without treating it as Paul’s own theological conclusion. It replaces the causative-passive grafting expression with a direct passive and uses a more idiomatic expression for branches broken off.
