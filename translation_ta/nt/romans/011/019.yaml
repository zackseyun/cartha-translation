id: ROM.11.19
reference: Romans 11:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: ta
  text: அப்படியானால், “நான் ஒட்டப்படுவதற்காகக் கிளைகள் முறிக்கப்பட்டன” என்று நீ சொல்வாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: நீ சொல்வாய்
  rationale: λέγω என்பதன் எதிர்காலச் செயப்பாட்டு வினை, இரண்டாம் நபர் ஒருமை. பவுல் கற்பனையான உரையாடுபவரை நேரடியாகச் சுட்டும் வாதநடையை இது தக்கவைக்கிறது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: முன் கூறியதிலிருந்து எழும் அனுமானத்தைக் குறிக்கும் இணைப்புச்சொல். வாத உரையாடலில் இயல்பான நவீனத் தமிழாகவும் தர்க்கத் தொடரைத் தெளிவாகவும் காட்டுகிறது.
- source_word: Ἐξεκλάσθησαν
  choice: முறித்துப்போடப்பட்டன
  rationale: ἐκκλάω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம். ஒலிவமர உருவகத்திலுள்ள கிளைகள் மரத்திலிருந்து முறிக்கப்பட்ட கருத்தையும் செயப்பாட்டு நிலையையும் பாதுகாக்கிறது.
- source_word: κλάδοι
  choice: கிளைகள்
  rationale: ஒலிவமர உருவகத்துக்குரிய பெயர்ச்சொல்லின் நேரடியும் இயல்புமான தமிழ் இணை.
- source_word: ἵνα
  choice: என்பதற்காக
  rationale: நோக்கம் அல்லது விளைவை அறிமுகப்படுத்தும் இணைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; உரையாடுபவர் முன்வைக்கும் நோக்கக் கூற்றைத் தீர்த்துவிடாமல் அப்படியே வைக்கிறது.
- source_word: ἐγὼ
  choice: நான்
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் வலியுறுத்தலுடனும் உள்ள முதல் நபர் சுட்டுப்பெயரைத் தமிழிலும் வெளிப்படையாக வைத்துள்ளது.
- source_word: ἐγκεντρισθῶ
  choice: ஒட்டவைக்கப்படுவதற்காக
  rationale: ἐγκεντρίζω என்பதன் இறந்தகாலச் செயப்பாட்டு வேண்டுநிலை வடிவம். மரத்தில் கிளையை ஒட்டும் உருவகத்தையும் செயப்பாட்டு பொருளையும் பாதுகாக்கிறது; இவ்வசனத்தில் இல்லாத ‘அவற்றிடையே’ போன்ற சொற்கள் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: பேசுபவர் பவுலின் வாதத்தில் உள்ள கற்பனையான உரையாடுபவர் என்பதை முதன்மை உரையில் வெளிப்படையாகச் சேர்ப்பதா
  choice: விளக்கச் சொற்களைச் சேர்க்காமல் ‘நீ சொல்வாய்’ என்ற நேரடி இரண்டாம் நபர் உரையைத் தக்கவைத்தல்
  alternative: ‘ஒருவன் சொல்லலாம்’ அல்லது ‘நீ சொல்லக்கூடும்’
  rationale: சூழல் கற்பனையான உரையாடலை உணர்த்தினாலும், கிரேக்க உரை நேரடியாக ‘நீ சொல்வாய்’ என்றே கூறுகிறது. ‘ஒருவன்’ எனச் சேர்ப்பது அல்லது சாத்தியநிலையாக மாற்றுவது தேவையற்ற விளக்கமாகும்.
- issue: ἵνα கூறும் நோக்கத்தை தேவனுடைய நோக்கம் என்று வலுப்படுத்துவதா
  choice: உரையாடுபவரின் கூற்றாக ‘நான் ஒட்டவைக்கப்படுவதற்காக’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘நான் ஒட்டவைக்கப்பட முடிவதற்காக’
  rationale: இது புறஜாதியாரைச் சேர்ந்த கற்பனையான பேசுபவரின் அனுமானம்; பவுல் அக்கூற்றைத் தனது இறையியல் முடிவாக ஏற்றுக்கொள்கிறார் என்று வசனம் தனியே கூறவில்லை. ஆகவே ஒப்புதலோ மறுப்போ சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட வாதநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒட்டவைக்கப்படுதல்’ என்பது தோட்டக்கலை உருவகத்தைப் பொதுவாசகருக்குப் புரியும் வகையில் காக்கிறது. மேற்கோள் அமைப்பு பேசுபவரின் கூற்றையும் ஆசிரியரின் உரையையும் வேறுபடுத்துகிறது.
