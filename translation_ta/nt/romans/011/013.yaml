source:
  edition: SBLGNT
  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: ta
  text: யூதரல்லாதவர்களாகிய உங்களிடம் நான் சொல்கிறேன்.[a] யூதரல்லாதவர்களுக்கு நான் அப்போஸ்தலனாக இருக்கிற அளவில், என் பணியை மேன்மைப்படுத்துகிறேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, முதல் இடத்தில் “பிற இனத்தவர்களாகிய உங்களிடம்,” இரண்டாம் இடத்தில் “பிற இனத்தவர்களுக்கு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் பணியை மகிமைப்படுத்துகிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: யூதரல்லாதவர்களாகிய உங்களிடம் நான் சொல்கிறேன்
  rationale: Ὑμῖν மற்றும் τοῖς ἔθνεσιν ஆகியவை ஒரே நேரடி அழைப்பாக இயல்பான தமிழில் இணைக்கப்பட்டுள்ளன. δέ இங்கே மென்மையான உரைமாற்றத்தைக் குறிக்கிறது; வலுவான எதிர்மறைப் பொருள் இல்லாததால் தனியே ‘ஆனால்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: இருக்கிற அளவில்
  rationale: இந்தச் சொற்றொடர் காரணத்தையும் அளவையும் சுட்டக்கூடும். ‘இருக்கிற அளவில்’ என்பது அதன் அளவுசார் நுணுக்கத்தைத் தக்கவைத்து, μὲν οὖν தரும் மென்மையான தொடர்ச்சியை தமிழில் மிகைப்படுத்தாமல் விடுகிறது.
- source_word: ἐθνῶν ἀπόστολος
  choice: யூதரல்லாதவர்களுக்கு ... அப்போஸ்தலன்
  rationale: ரோமர் 9–11 இன் சூழலில் ἔθνη என்பது இஸ்ரவேலருக்கு மாறான யூதரல்லாத மக்களைக் குறிக்கிறது. ἀπόστολος என்பது பொதுவான தூதரை அல்ல, பவுலின் நியமிக்கப்பட்ட அப்போஸ்தலப் பணியைச் சுட்டுகிறது.
- source_word: τὴν διακονίαν μου
  choice: என் பணி
  rationale: διακονία பவுலின் அப்போஸ்தலச் சேவையையும் பொறுப்பையும் குறிக்கிறது. ‘பணி’ என்பது தற்போதைய பொதுத் தமிழில் இயல்பாகவும், குறிப்பிட்ட திருச்சபை மரபுச் சொல்லைத் திணிக்காமலும் உள்ளது.
- source_word: δοξάζω
  choice: மேன்மைப்படுத்துகிறேன்
  rationale: இங்கே வினைச்சொல்லின் பொருள் பவுல் தன்னையே மகிமைப்படுத்துவது அல்ல; தன் பணியின் மதிப்பையும் பெருமையையும் உயர்த்திக் காட்டுவது. ‘மேன்மைப்படுத்துகிறேன்’ அதன் வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பவுல் தன் பணியை மேன்மைப்படுத்துவதாகக் கூறுவதன் பொருள்
  choice: பவுல் தன்னை அல்ல, யூதரல்லாதவர்களுக்கான தன் அப்போஸ்தலப் பணியை உயர்வாக மதித்து அதன் மேன்மையை எடுத்துக்காட்டுகிறார்.
  alternative: பவுல் தன் பணியை மகிமைப்படுத்துகிறார் அல்லது அதைப் பற்றிப் பெருமைபாராட்டுகிறார்.
  rationale: δοξάζω என்பதன் நேரடி பொருள் மகிமை அல்லது மதிப்பு அளிப்பதாக இருந்தாலும், அதன் பொருள் τὴν διακονίαν μου என்ற பணியையே நோக்குகிறது. சுற்றியுள்ள வசனங்கள் இதைத் தனிப்பட்ட சுயமேன்மையாக அல்ல, தேவனுடைய மீட்புத் திட்டத்திற்குச் சேவை செய்யும் பணியாகக் காட்டுகின்றன.
- issue: ἔθνη / ἐθνῶν என்பதன் குறிப்பு
  choice: யூதரல்லாதவர்கள்
  alternative: பிற இனத்தவர்கள் அல்லது தேசங்கள்
  rationale: ரோமர் 9–11 இல் இஸ்ரவேலுக்கும் மற்ற மக்களுக்கும் இடையிலான வேறுபாடே முன்னிலையில் உள்ளது. எனவே ‘யூதரல்லாதவர்கள்’ சூழலுக்குப் பொருத்தமானது; மூலச்சொல்லின் பரந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யூதரல்லாதவர்கள்’ என்பது சூழலைத் தெளிவாக்குகிறது; ‘அப்போஸ்தலன்’ மூலத்தில் உள்ள தொழில்நுட்பப் பதவிப் பொருளைத் தக்கவைக்கிறது. ἐφ’ ὅσον என்பதிலுள்ள அளவு/காரண நுணுக்கத்தை முற்றிலும் காரணவாக்கியமாக மாற்றாமல் ‘இருக்கிற அளவில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
