revisions:
- from: ஏனெனில், அனைத்தும் அவரிடமிருந்தே வருகின்றன; அவர் மூலமாகவே இருக்கின்றன; அவரை நோக்கியே செல்கின்றன. மகிமை என்றென்றும் அவருக்கே உரியதாகுக.[a] ஆமென்.
  to: ஏனெனில் அனைத்தும் அவரிடமிருந்தும், அவர் மூலமாகவும், அவரை நோக்கியும் உள்ளன. மகிமை அவருக்கே என்றென்றும். ஆமென்.[a]
  rationale: 'The revision restores the source’s single, balanced assertion: all things are from him, through him, and toward him. It avoids adding separate notions of coming, existing, and going. The final ascription remains concise and doxological, and the footnote gives a closer literal gloss while explaining the idiom.'
  reviewer_model: gpt-5.6-terra
