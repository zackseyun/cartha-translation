  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: ta
  text: ஏனெனில் அனைத்தும் அவரிடமிருந்தும், அவர் மூலமாகவும், அவரை நோக்கியும் உள்ளன. மகிமை அவருக்கே என்றென்றும். ஆமென்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “யுகங்களுக்குள்”; இது முடிவில்லாத காலத்தைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய புகழுரைக்கான காரணத்தையோ அடிப்படையையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξ αὐτοῦ
  choice: அவரிடமிருந்தே வருகின்றன
  rationale: ἐκ/ἐξ குறிக்கும் மூலம் அல்லது தோற்றத்தைத் தெளிவாக்குகிறது; ‘-ஏ’ கிரேக்கத் தொடரின் வலியுறுத்தலை தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: δι’ αὐτοῦ
  choice: அவர் மூலமாகவே இருக்கின்றன
  rationale: διά + பிறப்புவேற்றுமை குறிக்கும் வழிமுறை அல்லது செயலாண்மைப் பொருளைப் பாதுகாக்கிறது.
- source_word: εἰς αὐτὸν
  choice: அவரை நோக்கியே செல்கின்றன
  rationale: εἰς என்பதிலுள்ள திசை, இலக்கு, இறுதி நோக்கம் ஆகியவற்றின் பரப்பை ‘நோக்கி’ பாதுகாக்கிறது; ‘அவருக்காக’ என்று மட்டும் கூறி நோக்கப் பொருளை மிகையாகக் குறுக்கவில்லை.
- source_word: τὰ πάντα
  choice: அனைத்தும்
  rationale: படைப்பின் முழுமையையும் உள்ளடக்கும் கிரேக்க நடுநிலைப் பன்மையின் விரிவான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: αὐτῷ ἡ δόξα
  choice: மகிமை அவருக்கே உரியதாகுக
  rationale: வினைச்சொல் இல்லாத கிரேக்கப் புகழுரையை மரியாதையான, வழிபாட்டுக்குரிய தமிழில் வழங்குகிறது; ‘உரியதாகுக’ என்பது புகழை அவருக்குச் சாற்றும் தன்மையை வெளிப்படுத்துகிறது.
- source_word: εἰς τοὺς αἰῶνας
  choice: என்றென்றும்
  rationale: சொல்லுக்குச் சொல் ‘காலங்களுக்குள்/காலங்கள் தோறும்’ என்றாலும், முடிவில்லாத காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: தமிழ் கிறிஸ்தவ வழிபாட்டு வழக்கில் நிலைபெற்ற ஒலிபெயர்ப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: αὐτοῦ/αὐτόν/αὐτῷ என்ற பிரதிப்பெயர்களின் சுட்டுப்பொருள்
  choice: சுற்றியுள்ள ரோமர் 11:33–35 வசனங்களின்படி அவை தேவனைச் சுட்டுகின்றன; எனினும் உரையில் ‘அவர்’ என்ற பிரதிப்பெயரே வைக்கப்பட்டுள்ளது.
  alternative: ஒவ்வொரு இடத்திலும் ‘தேவன்’ என்று வெளிப்படையாகப் பெயரிடுதல்
  rationale: மூலத்தின் மீளும் பிரதிப்பெயர் அமைப்பையும் சொல்லாட்சியின் ஓசையையும் பாதுகாக்கிறது; மொழிபெயர்ப்பு சூழல் தருவதைக் காட்டிலும் அதிகமாக விளக்குவதில்லை.
- issue: εἰς αὐτόν என்பதின் இறையியல் மற்றும் இலக்குப் பொருள்
  choice: அவரை நோக்கியே
  alternative: அவருக்காகவே
  rationale: எல்லாவற்றின் இறுதி இலக்கு அவரே என்ற பொருளை வெளிப்படுத்துவதோடு, திசை மற்றும் நோக்கம் ஆகிய இரண்டையும் தாங்கும் εἰς என்பதின் நெகிழ்வைத் தக்கவைக்கிறது.
- issue: αὐτῷ ἡ δόξα என்ற வினையற்ற புகழுரை
  choice: மகிமை அவருக்கே உரியதாகுக
  alternative: மகிமை அவருக்கே உரியது
  rationale: கிரேக்கத்தின் வினையற்ற அமைப்பில் உள்ள புகழ்சாற்றும் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வெறும் கருத்துக் கூற்றாக மட்டும் மாற்றுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் புகழுரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘அவரிடமிருந்தே… அவர் மூலமாகவே… அவரை நோக்கியே’ என்ற இணை அமைப்பு மூலத்தின் மூன்று மடங்கு சொல்லோசையையும் வலியுறுத்தலையும் பிரதிபலிக்கிறது.
