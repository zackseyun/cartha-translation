id: ROM.11.20
reference: Romans 11:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: ta
  text: சரி; அவிசுவாசத்தினால் அவர்கள் முறித்துப்போடப்பட்டார்கள்; நீயோ விசுவாசத்தினால் நிலைத்து நிற்கிறாய். மேட்டிமையாக எண்ணாதே, மாறாக அஞ்சு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “அஞ்சு” என்பது பீதியடைவதைக் காட்டிலும், கடவுளுக்கு முன்பாக மேட்டிமையின்றி பயபக்தியுடனும் எச்சரிக்கையுடனும் இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: சரி
  rationale: முந்தைய வசனத்தில் கூறப்பட்டதைக் ஏற்றுக்கொள்ளும் பதிலாக வரும் சொல்லின் உறுதிப்படுத்தும் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἀπιστίᾳ
  choice: அவிசுவாசத்தினால்
  rationale: இங்கு வேற்றுமை உருபு காரணத்தை அல்லது அடிப்படையைச் சுட்டுகிறது; மேலும் πίστις என்பதுடன் உள்ள நேரடி முரண்பாட்டைப் பேணுகிறது.
- source_word: ἐξεκλάσθησαν
  choice: முறித்துப்போடப்பட்டார்கள்
  rationale: சுற்றியுள்ள ஒலிவமரக் கிளை உருவகத்தைத் தெளிவாகப் பேணுகிறது; வெறுமனே விலக்கப்பட்டார்கள் என்று பொதுமைப்படுத்தவில்லை.
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: இங்கு நிற்பதற்கான அடிப்படை அல்லது வழிமுறையைச் சுட்டுகிறது; ἀπιστία என்பதற்கெதிரான மனிதரின் விசுவாசப் பதிலை வெளிப்படுத்துகிறது.
- source_word: ἕστηκας
  choice: நிலைத்து நிற்கிறாய்
  rationale: நிகழ்ந்து முடிந்த செயலின் விளைவாகத் தொடரும் தற்போதைய நிலையை உணர்த்தும் கிரேக்க நிறைவுக்காலத்தின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑψηλὰ φρόνει
  choice: மேட்டிமையாக எண்ணாதே
  rationale: தன்னைப்பற்றி உயர்வாகவும் பெருமையாகவும் எண்ணும் மனநிலையைச் சுட்டும் சொற்றொடரை, வெறும் வெளிப்புற நடத்தையாகக் குறுக்காமல் தருகிறது.
- source_word: φοβοῦ
  choice: அஞ்சு
  rationale: கிரேக்கக் கட்டளையின் கூர்மையை மென்மைப்படுத்தாமல் பேணுகிறது; சூழலில் இது கடவுளுக்கு முன்பான தாழ்மையான பயத்தையும் எச்சரிக்கையையும் குறிக்கிறது.
theological_decisions:
- issue: πίστις மற்றும் ἀπιστία ஆகியவற்றின் முரண்பாடு
  choice: விசுவாசம் / அவிசுவாசம்
  alternative: நம்பிக்கை / நம்பாமை
  rationale: இவ்வசனத்தில் அவிசுவாசத்துக்கு நேர்மாறாக மனிதரின் விசுவாசப் பதிலே முதன்மையாகத் தெரிகிறது. இருப்பினும் 'நம்பிக்கை' என்ற கருத்து உட்பொருளில் உள்ளது; 'விசுவாசம்' என்பது பவுலின் சொல்லாட்சியோடும் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டோடும் தொடர்ச்சியைப் பேணுகிறது.
- issue: φοβοῦ என்பதன் வலிமை
  choice: அஞ்சு
  alternative: பயபக்தியோடு இரு; பயப்படு
  rationale: வசனத்தின் எச்சரிக்கையையும் இறையியல் அழுத்தத்தையும் அப்படியே வைத்திருக்கிறது. அதை வெறும் மரியாதையாக மென்மைப்படுத்தவோ, பீதியாக மிகைப்படுத்தவோ இல்லை; அடிக்குறிப்பு சூழல்சார் நுணுக்கத்தை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒலிவமரக் கிளை உருவகம் காக்கப்பட்டுள்ளது. 'மேட்டிமையாக எண்ணாதே' என்பது உள்ளார்ந்த பெருமைமிகு சிந்தனையைத் தெளிவாகக் காட்டுகிறது; 'அஞ்சு' என்ற நேரடியான கட்டளை இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல் வைத்திருக்கிறது.
