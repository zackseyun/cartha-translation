  source_fidelity: 'மூலக் கிரேக்கத்தின் வலிமைகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: καλῶς என்பதன் உடன்பாட்டு மறுமொழி, ἀπιστίᾳ/πίστει என்ற காரண/வழிமுறை முரண்பாடு, ἐξεκλάσθησαν என்பதிலுள்ள ஒலிவமர உருவகம், ἕστηκας என்பதன் தொடரும் நிலை, மற்றும் ὑψηλὰ φρόνει ... ἀλλὰ φοβοῦ என்ற எச்சரிக்கைக் கட்டளை ஆகியவை அனைத்தும் முறையாக வெளிப்பட்டுள்ளன. ‘நிலைத்து நிற்கிறாய்’ என்பது நிறைவுக்காலத்தால் குறிக்கப்படும் தற்போதைய நிலையைச் சரியாக உணர்த்துகிறது.'
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘சரி;’, ‘நீயோ’, ‘மாறாக அஞ்சு’ ஆகியவை பவுலின் வாதநடையையும் நேரடி எச்சரிக்கையையும் தெளிவாகத் தருகின்றன. ‘மேட்டிமையாக எண்ணாதே’ என்பது உள்ளார்ந்த பெருமைமிகு மனப்பாங்கை நன்றாகக் குறிக்கிறது.
  terminology: ‘அவிசுவாசம் / விசுவாசம்’ என்ற இணைச்சொற்கள் கிரேக்க ἀπιστία / πίστις என்பவற்றின் நோக்கமுள்ள முரண்பாட்டைத் தக்கவைத்துள்ளன; நிறுவப்பட்ட தமிழ்க் கிறிஸ்தவப் பயன்பாட்டிலும் இவை புரிந்துகொள்ளத்தக்கவை. ‘அஞ்சு’ என்பது φοβοῦ என்பதன் கூர்மையைத் தளர்த்தவில்லை. அடிக்குறிப்பு இதை வெறும் பீதியாகப் புரிந்துகொள்ளாமல், கடவுள்முன் தாழ்மையான பயபக்தி மற்றும் எச்சரிக்கை என்ற சூழல்சார் பொருளில் விளக்குகிறது.
