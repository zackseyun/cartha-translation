id: ROM.11.11
reference: Romans 11:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: ta
  text: 'ஆகவே நான் கேட்கிறேன்: அவர்கள் விழுந்துபோகும்படி இடறினார்களா?[a] ஒருபோதும் இல்லை! மாறாக, அவர்களுடைய மீறுதலினால்[b] யூதரல்லாத மக்களுக்கு[c] மீட்பு வந்தது, அவர்களைப் பொறாமைப்படச் செய்வதற்காக.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘இடறுதல்’ மற்றும் ‘விழுதல்’ என்பவை வேறு சொற்கள்; இந்த வினா ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கிறது. ‘அவர்கள் விழுந்துபோக வேண்டும் என்பதற்காக இடறினார்களா?’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுடைய குற்றத்தினால்.’
    reason: lexical_alternative
  - marker: c
    text: நேரடியாக, ‘இனங்களுக்கு’; இச்சூழலில் இது யூதரல்லாத மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, ‘அவர்களில் பொறாமையை எழுப்புவதற்காக.’ அதே மீட்பை நாடும்படி அவர்களைத் தூண்டும் நுணுக்கமும் இதில் இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: ஆகவே நான் கேட்கிறேன்
  rationale: λέγω உரையாடலில் ஒரு வினாவை அறிமுகப்படுத்துகிறது; οὖν முந்தைய கருத்திலிருந்து வரும் முடிவுறு தொடர்பைக் காட்டுகிறது. இயல்பான தமிழில் இரண்டையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: μὴ ἔπταισαν ἵνα πέσωσιν
  choice: அவர்கள் விழுந்துபோகும்படி இடறினார்களா?
  rationale: μή உடனான வினா மறுப்பான பதிலை எதிர்பார்க்கிறது. πταίω என்பதற்கு ‘இடறு’ என்றும் πίπτω என்பதற்கு ‘விழு’ என்றும் வேறுபடுத்தி, இறுதியான அழிவு என்ற விளக்கத்தைச் சேர்க்காமல் கிரேக்க உருவகத்தைப் பாதுகாக்கிறது.
- source_word: μὴ γένοιτο
  choice: ஒருபோதும் இல்லை!
  rationale: பவுலின் வலுவான மறுப்பை நவீனத் தமிழில் இயல்பாகவும் அழுத்தமாகவும் தெரிவிக்கிறது.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: அவர்களுடைய மீறுதலினால்
  rationale: παράπτωμα ஒரு தவறான அடி அல்லது வரம்புமீறிய குற்றத்தைக் குறிக்கலாம். ‘மீறுதல்’ அதன் அறநெறிச் செறிவைக் காக்கிறது; தத்தி வேற்றுமையின் கருவி/காரணப் பொருளை ‘-இனால்’ வெளிப்படுத்துகிறது.
- source_word: ἡ σωτηρία
  choice: மீட்பு
  rationale: σωτηρία இங்கு தேவன் அளிக்கும் இரட்சிக்கும் விடுதலையைக் குறிக்கிறது. ‘மீட்பு’ நவீன வாசகருக்கு இயல்பாகவும் வேதாகமச் செறிவுடனும் உள்ளது.
- source_word: τοῖς ἔθνεσιν
  choice: யூதரல்லாத மக்களுக்கு
  rationale: ரோமர் 9–11 இன் யூதர்–பிற இனத்தார் சூழலில் ἔθνη என்பது யூதரல்லாத மக்களைக் குறிக்கிறது. இத்தேர்வு அந்தச் சூழற்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: அவர்களுக்குப் பொறாமையைத் தூண்டுவதற்காகவே
  rationale: εἰς + உறுப்பு கொண்ட வினையெச்சம் நோக்கம் அல்லது விளைவைக் குறிக்கிறது. παραζηλόω பொறாமையை அல்லது அதே நன்மையை நாடும் ஆர்வத்தைத் தூண்டுதல் என்ற இரு நுணுக்கங்களையும் கொண்டிருக்கலாம்; முதன்மை உரை பொதுவான பொருளை வைத்திருக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் இடறுதல் இறுதியான வீழ்ச்சியா என்பது
  choice: அவர்கள் விழுந்துபோகும்படி இடறினார்கள் என்ற கருத்தை வினாவும் வலுவான மறுப்பும் நிராகரிக்கின்றன.
  alternative: இது உடனடியான வீழ்ச்சியை மட்டும் மறுக்கிறது; இறுதியான முடிவைப் பற்றி முழுமையாகத் தீர்மானிக்கவில்லை என்றும் கொள்ளலாம்.
  rationale: πταίω மற்றும் πίπτω ஆகிய இரு வினைகளின் வேறுபாடு காக்கப்படுகிறது. ‘முற்றிலும்’ அல்லது ‘மீள முடியாதபடி’ போன்ற விளக்கச் சொற்களைச் சேர்க்காமல் பவுலின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: பொறாமையைத் தூண்டும் மொழியின் பொருள்
  choice: யூதரல்லாத மக்கள் மீட்பைப் பெறுவது, இஸ்ரவேலருக்குப் பொறாமையைத் தூண்டும் நோக்கம் அல்லது விளைவைக் கொண்டுள்ளது.
  alternative: இது வெறும் எதிர்மறையான பொறாமையைக் குறிக்கலாம்; அல்லது அதே மீட்பை நாடத் தூண்டும் விருப்பத்தைக் குறிக்கலாம்.
  rationale: παραζηλόω இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது. முதன்மை உரை ‘பொறாமை’ என்பதைக் காத்து, சாதகமான பின்பற்றல் என்ற விளக்கத்தை உரைக்குள் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இடறு/விழு’ என்ற உருவக வேறுபாடு காக்கப்பட்டுள்ளது. ‘பிறஜாதியார்’ போன்ற பழைய அல்லது சமயக்குழு சார்ந்த சொல்லுக்குப் பதிலாக ‘யூதரல்லாத மக்கள்’ பயன்படுத்தப்பட்டுள்ளது. ‘மீட்பு’ என்பது இயல்பான தமிழையும் σωτηρία-வின் இறையியல் செறிவையும் சமநிலைப்படுத்துகிறது.
