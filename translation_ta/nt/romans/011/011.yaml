- from: 'ஆகவே நான் கேட்கிறேன்: அவர்கள் விழுந்துபோகும்படி இடறினார்களா?[a] ஒருபோதும் இல்லை! மாறாக, அவர்களுடைய மீறுதலினால்[b] யூதரல்லாத மக்களுக்கு[c] மீட்பு கிடைத்தது; அவர்களுக்குப் பொறாமையைத் தூண்டுவதற்காகவே இது நடந்தது.[d]'
  to: 'ஆகவே நான் கேட்கிறேன்: அவர்கள் விழுந்துபோகும்படி இடறினார்களா?[a] ஒருபோதும் இல்லை! மாறாக, அவர்களுடைய மீறுதலினால்[b] யூதரல்லாத மக்களுக்கு[c] மீட்பு வந்தது, அவர்களைப் பொறாமைப்படச் செய்வதற்காக.[d]'
  rationale: மூலத்தின் ‘மீட்பு ... மக்களுக்கு [வந்தது]’ என்ற சொல்லாட்சியை ‘வந்தது’ மூலம் காத்துள்ளேன். மேலும் εἰς τὸ παραζηλῶσαι αὐτούς என்ற நோக்கத் தொடரை நேரடியாக இணைத்து, தேவையற்ற ‘இது நடந்தது’ என்பதை நீக்கியுள்ளேன். இடறுதல்–விழுதல் வேறுபாடு, மறுப்பான வினாவின் வலிமை, மற்றும் பொறாமை/பின்பற்றும் ஆர்வம் ஆகிய இரட்டை நுணுக்கம் மாற்றமின்றி பாதுகாக்கப்பட்டுள்ளன.
