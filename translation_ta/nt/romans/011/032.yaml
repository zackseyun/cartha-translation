  source_fidelity: 'மூல கிரேக்கத்தின் வரிசையும் முக்கியப் பொருள்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன: γάρ-இன் விளக்கத் தொடர்பு, συνέκλεισεν-இன் அடைத்தல் உருவகம், இருமுறை வரும் τοὺς πάντας-இன் விரிவும் சமச்சீரும், εἰς ἀπείθειαν-இன் நிலை/உள்ளாக்கம், ἵνα-இன் நோக்கம், ἐλεήσῃ-இன் இரக்கம் காட்டுதல் ஆகியவை அனைத்தும் பொருத்தமாக உள்ளன. தமிழில் நோக்கத் தொடரை முன்னிலைப்படுத்துவது கிரேக்கச் சொல்லொழுங்கை மாற்றினாலும் பொருளையோ நோக்க உறவையோ மாற்றவில்லை.'
