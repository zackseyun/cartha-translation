id: ROM.11.32
reference: Romans 11:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: ta
  text: ஏனெனில், கடவுள் அனைவருக்கும் இரக்கம் காட்டுவதற்காக, அனைவரையும்[c] கீழ்ப்படியாமைக்குள்[b] அடைத்துவைத்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அனைவரையும் ஒரே கட்டுக்குள் வைத்தார்’ அல்லது ‘அனைவரையும் அடைத்தார்.’
    reason: lexical_alternative
  - marker: b
    text: சில சூழல்களில் ‘கீழ்ப்படியாமை’ என்பதை ‘நம்பாமை’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் இங்கே கீழ்ப்படிய மறுத்தல் என்ற விரிவான பொருள் பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘அனைவர்’ என்பது மூலத்தில் இருமுறை வருகிறது. அதன் வரம்பை மொழிபெயர்ப்பிலேயே குறுக்காமல் இங்கு அப்படியே காக்கப்பட்டுள்ளது; சூழலில் யூதரும் பிற இனத்தவரும் ஒன்றாகக் கருத்தில் கொள்ளப்படுகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: அடைத்துவைத்தார்
  rationale: συγκλείω என்பதிலுள்ள ‘ஒன்றாக அடைத்தல், எல்லைக்குள் வைத்தல்’ என்ற உருவகத்தை இது இயல்பான தமிழில் காக்கிறது. ‘சிறையில் அடைத்தார்’ என்பது தண்டனை சார்ந்த பொருளை அளவுக்கு மீறி வலியுறுத்தும்; ‘ஒப்படைத்தார்’ என்பது அடைத்தல் என்ற உருவகத்தை மறைக்கும்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கத்தை அறிமுகப்படுத்தும் γάρ என்பதன் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοὺς πάντας
  choice: அனைவரையும் / அனைவருக்கும்
  rationale: ஒரே கிரேக்கச் சொற்றொடர் இருமுறை வருவதால், தமிழிலும் ‘அனைவர்’ என்பதை இருமுறை பயன்படுத்தி அதன் விரிவையும் சொல்லாட்சிச் சமச்சீரையும் காக்கிறது; யூதர், பிற இனத்தவர் என்று மொழிபெயர்ப்பிலேயே குறுக்கவில்லை.
- source_word: εἰς ἀπείθειαν
  choice: கீழ்ப்படியாமைக்குள்
  rationale: εἰς என்பதன் ‘உள்ளே/நிலைக்குள்’ என்ற நுணுக்கத்தையும், ἀπείθεια என்பதன் நம்ப மறுப்பதைவிட விரிவான கீழ்ப்படிய மறுக்கும் பொருளையும் காக்கிறது.
- source_word: ἵνα
  choice: காட்டுவதற்காக
  rationale: ἵνα குறிக்கும் நோக்கத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐλεήσῃ
  choice: இரக்கம் காட்ட
  rationale: ἐλεέω என்பதன் செயற்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ἵνα உடன் வரும் வினைமுறையைத் தமிழில் நோக்கத் தொடர் மூலம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இரு இடங்களிலும் வரும் ‘அனைவர்’ என்பதன் வரம்பு
  choice: இரண்டு இடங்களிலும் ‘அனைவர்’ என்றே மொழிபெயர்த்து, பவுலின் சமச்சீரான விரிவான சொல்லாட்சியைப் பாதுகாத்தல்.
  alternative: ‘எல்லா மனிதர்களும்’, ‘யூதரும் பிற இனத்தவரும்’ என்று வெளிப்படையாகக் குறித்தல்.
  rationale: சூழலில் யூதரும் பிற இனத்தவரும் ஒன்றாக விவாதிக்கப்படுகின்றனர். ஆயினும், கிரேக்க வாசகம் இரு இடங்களிலும் ஒரே விரிவான சொல்லையே பயன்படுத்துவதால், இரட்சிப்பின் வரம்பைப் பற்றிய இறையியல் விவாதத்தை மொழிபெயர்ப்பே முன்கூட்டியே தீர்மானிக்காமல் அந்தப் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடைத்துவைத்தார்’ என்ற சொல் மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது; வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்க நோக்கத் தொடர் முன்னிலைப்படுத்தப்பட்டுள்ளது.
