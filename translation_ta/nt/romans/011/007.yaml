  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: ta
  text: அப்படியானால் என்ன? இஸ்ரவேல் தேடிக்கொண்டிருப்பதை அடையவில்லை; ஆனால் தேர்ந்தெடுக்கப்பட்டவர்கள்[a] அதை அடைந்தார்கள்; மற்றவர்களோ கடினப்படுத்தப்பட்டனர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “தேர்ந்தெடுத்தல்” அல்லது “தேர்வு”; இங்கு இது தேர்ந்தெடுக்கப்பட்ட மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உணர்வற்றவர்களாக்கப்பட்டனர்.” இந்த வினை கடினமாக்கப்படுவதையோ ஆவிக்குரிய உணர்வற்ற நிலைக்குக் கொண்டுவரப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: அப்படியானால் என்ன?
  rationale: பவுல் முந்தைய வாதத்திலிருந்து எழும் முடிவை வினா வடிவில் அறிமுகப்படுத்துகிறார்; இச்சொற்றொடர் அந்தத் தர்க்கத் தொடர்பையும் சொல்லாட்சியின் வலிமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὃ ἐπιζητεῖ Ἰσραήλ
  choice: இஸ்ரவேல் தேடிக்கொண்டிருப்பதை
  rationale: ἐπιζητεῖ என்பதன் நிகழ்காலத் தொடர்ச்சியையும், இஸ்ரவேலை ஒரு கூட்டு மக்களாகக் குறிப்பிடும் ஒருமை அமைப்பையும் வெளிப்படுத்துகிறது.
- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: அது அடையவில்லை
  rationale: ἐπιτυγχάνω இங்கு தேடிய ஒன்றை அடைதல் என்ற பொருளுடையது. அடுத்த உட்பிரிவிலும் அதே வினை மீண்டும் வருவதால் தமிழிலும் ‘அடை’ மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἡ δὲ ἐκλογὴ
  choice: ஆனால் தேர்ந்தெடுக்கப்பட்டவர்கள்
  rationale: ἐκλογή என்பதன் சொற்பொருள் ‘தேர்ந்தெடுத்தல்/தேர்வு’ என்றாலும், ‘மற்றவர்கள்’ என்பதுடனான எதிர்மறை ஒப்பீட்டில் இது தேர்ந்தெடுக்கப்பட்ட மக்களைக் குறிக்கும் ஆகுபெயராக உள்ளது.
- source_word: οἱ δὲ λοιποὶ
  choice: மற்றவர்களோ
  rationale: தேர்ந்தெடுக்கப்பட்டவர்களுக்கு மாறாக எஞ்சிய மக்களை இயல்பான, சுருக்கமான தமிழில் குறிக்கிறது.
- source_word: ἐπωρώθησαν
  choice: கடினப்படுத்தப்பட்டார்கள்
  rationale: கிரேக்க வினையின் கடினமாக்குதல் அல்லது உணர்வற்றதாக்குதல் என்ற உருவகத்தைப் பாதுகாக்கிறது; செயலைச் செய்தவர் யார் என்பதைச் சேர்க்காமல் அதன் இறப்புவினை வடிவையும் காக்கிறது.
theological_decisions:
- issue: ἡ ἐκλογὴ என்பதன் பொருள்
  choice: தேர்ந்தெடுக்கப்பட்டவர்கள்
  alternative: தேர்ந்தெடுத்தல் / தேர்வு
  rationale: ‘மற்றவர்கள்’ என்ற மனிதக் குழுவுடனான மாறுபாடு காரணமாக, இங்கு அருவமான தேர்வு அல்லாமல் தேர்ந்தெடுக்கப்பட்ட மக்களே குறிக்கப்படுகின்றனர். அடிக்குறிப்பு சொற்பொருள் மாற்றைத் தெரிவிக்கிறது.
- issue: ἐπωρώθησαν என்பதில் செய்பவரின் அடையாளம்
  choice: கடினப்படுத்தப்பட்டார்கள்
  alternative: தேவன் அவர்களைக் கடினப்படுத்தினார் / அவர்கள் தங்களைக் கடினப்படுத்திக்கொண்டார்கள்
  rationale: கிரேக்கத்தில் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. எனவே இறைச் செயல், மனிதப் பொறுப்பு ஆகியவற்றுக்கிடையிலான இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேல்’ கூட்டு ஒருமையாக இருப்பதால் ‘அது’ எனத் தொடரப்பட்டுள்ளது. கிரேக்க மூலத்தின் எதிர்மறை ஒப்பீடும், மீளுரையும், குறிப்பிடப்படாத செயற்பாட்டாளரும் பாதுகாக்கப்பட்டுள்ளன.
