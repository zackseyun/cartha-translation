id: ROM.11.22
reference: Romans 11:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: ta
  text: 'ஆகவே, கடவுளின் கனிவையும் கடுமையையும் கவனித்துப் பார்: விழுந்தவர்கள்மீது கடுமை; ஆனால் உன்மீது கடவுளின் கனிவு—நீ அவரது கனிவில் தொடர்ந்து நிலைத்திருந்தால்; இல்லையெனில், நீயும் வெட்டி அகற்றப்படுவாய்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒடித்துப் போடப்படுவாய்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் “வெட்டி அகற்றப்படுதல்”; சுற்றியுள்ள ஒலிவமர உருவகத்தை முன்னிட்டு “ஒடித்துப் போடப்படுதல்” என்பது சூழல்சார் மாற்றாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: கவனித்துப் பார்
  rationale: கவனம் செலுத்திச் சிந்திக்க அழைக்கும் கட்டளைத் தொனியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: χρηστότητα / χρηστότης
  choice: கனிவு
  rationale: கடவுளின் அருள்நிறைந்த நன்மையையும் அன்பான அணுகுமுறையையும் குறிக்கிறது; ‘கண்டிப்பு’ என்பதற்கான உறவுசார் எதிர்மறையாகத் தெளிவாக உள்ளது.
- source_word: ἀποτομίαν / ἀποτομία
  choice: கண்டிப்பு
  rationale: நியாயத்தீர்ப்பில் வெளிப்படும் கடுமையையும் உறுதியையும் தெரிவிக்கிறது; ‘கொடுமை’ என்று மிகைப்படுத்தாமல் மூலத்தின் வலிமையைப் பேணுகிறது.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: விழுந்தவர்கள்மீது
  rationale: ἐπί காட்டும் நோக்கு/சார்பைச் சுருக்கமாக வெளிப்படுத்தி, ஒலிவமர உருவகத்துடன் தொடர்புடைய விழுதலையும் பேணுகிறது.
- source_word: ἐπὶ δὲ σὲ
  choice: உன்மீதோ
  rationale: முந்தைய இணை அமைப்பைப் பேணி, நேரடியாக ஒருமையில் உரையாடப்படுவதைத் தெளிவாக்குகிறது.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: நீ அவரது கனிவில் தொடர்ந்து நிலைத்திருந்தால்
  rationale: ἐπιμένω என்பதன் தொடர்தல்/நிலைத்திருத்தல் பொருளையும் தந்தைவேற்றுமையின் ‘கனிவில்’ என்ற வட்டாரப் பொருளையும் இயல்பாகத் தருகிறது.
- source_word: ἐπεὶ
  choice: இல்லையெனில்
  rationale: இந்தச் சூழலில் நிபந்தனை நிறைவேறாதபோது வரும் எதிர்மறை விளைவைத் தொடங்குகிறது.
- source_word: ἐκκοπήσῃ
  choice: வெட்டிப்போடப்படுவாய்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் ἐκκόπτω என்பதன் நேரடியான ‘வெட்டியகற்றுதல்’ பொருளையும், சுற்றியுள்ள மர உருவகத்தையும் பேணுகிறது.
theological_decisions:
- issue: கடவுளின் கனிவில் தொடர்வது குறித்த நிபந்தனை எச்சரிக்கை
  choice: நிபந்தனையையும் ‘நீயும் வெட்டிப்போடப்படுவாய்’ என்ற நேரடியான எச்சரிக்கையையும் முழுமையாகப் பேணுதல்
  alternative: எச்சரிக்கையை வெறும் கற்பனையான வாய்ப்பாக மென்மைப்படுத்துதல் அல்லது இரட்சிப்பை இழத்தல்/நிலைத்திருத்தல் குறித்த குறிப்பிட்ட சமயக்கோட்பாட்டை மொழிபெயர்ப்பில் சேர்த்தல்
  rationale: கிரேக்க உரை உண்மையான நிபந்தனை எச்சரிக்கையை முன்வைக்கிறது; அது தனிநபரையா குழுவையா குறிக்கிறது, அல்லது விசுவாச நிலைத்திருத்தம் பற்றிய பிந்தைய கோட்பாட்டு விவாதங்களை எவ்வாறு தீர்க்கிறது என்பதைக் குறிப்பாக முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடி ஒருமை உரையாடலைப் பேணிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கனிவு—கண்டிப்பு’ என்ற எதிரிணை தெளிவாக வைக்கப்பட்டுள்ளது; செயப்பாட்டு எச்சரிக்கையும் இறையியல் ரீதியாக மென்மைப்படுத்தப்படவில்லை.
