  rationale: கடவுளின் தீர்ப்பின் கடுமையைத் தெரிவிக்கும் ἀποτομίαக்கு கண்டிப்பு என்பதற்குப் பதிலாக கடுமை இடப்பட்டுள்ளது. வெட்டப்படுதல் குறித்த முதன்மை மொழிபெயர்ப்பு கிரேக்க வினைச்சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது; ஒலிவமர உருவகத்திற்கேற்ற மாற்று அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது. நிபந்தனை எச்சரிக்கை எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்காமல் பேணப்பட்டுள்ளது.
