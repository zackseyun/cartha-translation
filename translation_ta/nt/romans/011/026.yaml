id: ROM.11.26
reference: Romans 11:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: ta
  text: 'இவ்விதமாக[a] இஸ்ரவேலர் அனைவரும்[b] இரட்சிக்கப்படுவார்கள்; எழுதப்பட்டுள்ளபடி:


    “விடுவிப்பவர் சீயோனிலிருந்து[c] வருவார்;


    யாக்கோபிடமிருந்து இறைபக்தியின்மைகளை விலக்குவார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இவ்வாறே’ அல்லது ‘இப்படியே’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க οὕτως என்பது ‘அவ்வாறு/இவ்வாறு’ என்று பொருள்படலாம்; இங்கு அது முன்பு விவரிக்கப்பட்ட முறையைச் சுட்டுவதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இஸ்ரவேலர் அனைவரும்’ என்பது விளக்கத்தில் சர்ச்சைக்குரிய சொற்றொடர். இது இனரீதியான இஸ்ரவேல் முழுவதையா, விசுவாசமுள்ள மீதியானோரையா, அல்லது பிற இனத்தவரையும் உள்ளடக்கிய இறைமக்கள் அனைவரையா குறிக்கிறது என்பதை மொழிபெயர்ப்பு முடிவுசெய்யவில்லை.
    reason: alternative_reading
  - marker: c
    text: இதனை ‘சீயோனிலிருந்து வெளியே’ என்றும், சொல்லுக்குச் சொல் நெருக்கமாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: இவ்விதமாக
  rationale: முந்தைய வசனங்களில் விவரிக்கப்பட்ட முறையைச் சுட்டும் விதமாக மொழிபெயர்க்கப்பட்டுள்ளது. அதே நேரத்தில், ‘இவ்வாறே/இப்படியே’ என்ற விளைவு சார்ந்த வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πᾶς Ἰσραήλ
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: கிரேக்கச் சொற்றொடரின் ‘அனைத்து இஸ்ரவேல்’ என்ற பரப்பை இயல்பான நவீனத் தமிழில் தருகிறது; அது யாரைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- source_word: σωθήσεται
  choice: இரட்சிக்கப்படுவார்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், பவுலின் பயன்பாட்டிலுள்ள மீட்பு சார்ந்த இறையியல் வலிமையையும் காக்கிறது.
- source_word: καθὼς γέγραπται
  choice: எழுதப்பட்டிருக்கிறபடியே
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சூத்திரத்தை இயல்பாகவும் துல்லியமாகவும் வழங்குகிறது.
- source_word: ὁ ῥυόμενος
  choice: விடுவிப்பவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நிகழ்காலப் பங்கேற்பு வடிவத்தை, ஒருவரைக் குறிக்கும் கண்ணியமான பட்டப்பெயர் போன்ற சொல்லாக வழங்குகிறது.
- source_word: ἐκ Σιὼν
  choice: சீயோனிலிருந்து
  rationale: ἐκ என்பதன் மூலத்திலிருந்து வருதல் என்ற பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀποστρέψει
  choice: விலக்குவார்
  rationale: ஒன்றை ஒருவரிடமிருந்து திருப்பி அகற்றும் வினைப்படிமத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀσεβείας
  choice: இறைபக்தியற்ற செயல்களை
  rationale: பன்மை வடிவத்தையும் இறைவனுக்கு எதிரான ஒழுக்க-சமயக் குறைபாட்டையும் தெளிவாக வெளிப்படுத்துகிறது; ‘இறைபக்தியின்மைகள்’ என்ற செயற்கையான சொல்லாக்கம் தவிர்க்கப்படுகிறது.
- source_word: ἀπὸ Ἰακώβ
  choice: யாக்கோபிடமிருந்து
  rationale: மேற்கோளின் ‘யாக்கோபு’ என்ற பெயரையும் ἀπό குறிக்கும் விலக்கப்படும் மூலத்தையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘இஸ்ரவேலர் அனைவரும்’ என்பதன் குறிப்பு
  choice: எந்தக் குழுவை மட்டும் குறிக்கிறது என்று விரிவுபடுத்தாமல் சொற்றொடர் அப்படியே திறந்த நிலையில் வைக்கப்பட்டது.
  alternative: இனரீதியான இஸ்ரவேல் முழுவதும்; இஸ்ரவேலிலுள்ள விசுவாசமுள்ள மீதியானோர்; பிற இனத்தவரையும் உள்ளடக்கிய இறைமக்கள் அனைவரும்
  rationale: இந்தச் சொற்றொடரின் குறிப்பு இறையியல் விளக்கத்தில் சர்ச்சைக்குரியது. கிரேக்க உரை தானாகத் தீர்மானிக்காததைத் தமிழ் மொழிபெயர்ப்பு தீர்மானிக்காமல், அதன் பதற்றத்தைக் காக்கிறது.
- issue: ‘விடுவிப்பவர்’ என்பவரின் மேசியா சார்ந்த அடையாளம்
  choice: தலைப்புத்தன்மையுள்ள ‘விடுவிப்பவர்’ என்ற சொல் பயன்படுத்தப்பட்டது; ஆனால் பெயரை விளக்கத்தில் சேர்க்கவில்லை.
  alternative: விடுவிக்கிறவர்; மீட்பவர்
  rationale: மேற்கோள் பவுலின் சூழலில் மேசியா சார்ந்து செயல்பட்டாலும், கிரேக்க உரையில் இல்லாத அடையாளப் பெயரைச் சேர்க்காமல் பெயர்ச்சொல் தன்மையுள்ள பங்கேற்பு வடிவம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேத மேற்கோளுக்கேற்ற கண்ணியமான நடையும் சாதாரண வாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. ‘இரட்சிக்கப்படுவார்கள்’ என்பது பவுலின் மீட்பு சார்ந்த கருத்தைத் துல்லியமாகக் காக்கும் பரவலாக அறியப்பட்ட சொல். கவிதை வடிவ மேற்கோள் இரு வரிகளாக அமைக்கப்பட்டுள்ளது.
