id: ROM.11.31
reference: Romans 11:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: ta
  text: அவ்வாறே, இவர்களும் இப்போது கீழ்ப்படியாமல் போயிருக்கிறார்கள்; உங்களுக்குக் காட்டப்பட்ட இரக்கத்தின் மூலம் இவர்களும் இப்போது இரக்கம் பெறும்படியாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ
  choice: அவ்வாறே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிலைக்கு ஒப்பான தொடர்பை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: சூழலில் இஸ்ரவேலரைச் சுட்டும் குறிப்புப்பெயரின் வலிமையைத் தக்கவைக்கிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: இரட்சிப்பு வரலாற்றின் தற்போதைய கட்டத்தைச் சுட்டும் காலக் குறிப்பை இரண்டு இடங்களிலும் தக்கவைக்கிறது.
- source_word: ἠπείθησαν
  choice: கீழ்ப்படியாமல் போனது
  rationale: ἀπειθέω என்பதில் உள்ள கீழ்ப்படியாமை மற்றும் நம்ப மறுத்தல் ஆகிய பரப்பை, வெறும் அறிவுசார் அவநம்பிக்கையாகக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: உங்களுக்குக் காட்டப்பட்ட இரக்கத்தின் மூலம்
  rationale: இது புறவின விசுவாசிகள் காட்டும் இரக்கம் அல்ல, அவர்களுக்கு இறைவனால் காட்டப்பட்ட இரக்கம் என்பதே ரோமர் 11:30–32ன் ஓட்டத்திற்கு ஏற்றது; அதேவேளை அடிக்குறிப்பில் சொற்சார்ந்த மாற்று வாசிப்பு தரப்படுகிறது.
- source_word: ἵνα
  choice: பெறுவதற்காகவே
  rationale: கிரேக்கச் சொற்றொடரின் நோக்கத்தை வலியுறுத்தும் விதத்தில் இயல்பான தமிழில் தருகிறது.
- source_word: καὶ αὐτοὶ
  choice: இவர்களும்
  rationale: இஸ்ரவேலரும் இரக்கம் பெறுவதில் சேர்க்கப்படுகிறார்கள் என்ற வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: ἐλεηθῶσιν
  choice: இரக்கம் பெற
  rationale: இரக்கத்தை வழங்குபவர் இறைவன் என்பதைக் குறிக்கும் இறைச்செயப்பாட்டு வடிவத்தின் பொருளை தெளிவான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: “உங்கள் இரக்கம்” என்பது புறவின விசுவாசிகள் காட்டும் இரக்கத்தையா அல்லது அவர்களுக்கு இறைவன் காட்டிய இரக்கத்தையா குறிக்கிறது?
  choice: உங்களுக்குக் காட்டப்பட்ட இரக்கம்
  alternative: உங்கள் இரக்கம்
  rationale: ரோமர் 11:30–32ல் இரு குழுக்களும் கீழ்ப்படியாமையிலிருந்து இறை இரக்கத்தைப் பெறுவது ஒப்பிடப்படுகிறது. ஆகவே, புறவினத்தாருக்குக் காட்டப்பட்ட இறை இரக்கமே இங்கு முதன்மையாகக் குறிக்கப்படுவது சூழலுக்கு ஏற்றது; கிரேக்கத்தின் சுருக்கமான தத்திவ் அமைப்பிலுள்ள உண்மையான மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘கீழ்ப்படியாமல் போனது’ என்பது நம்பாமை/கீழ்ப்படியாமை என்ற மூலச்சொல்லின் பரப்பைத் திறந்தே வைக்கிறது. நோக்கத்தைக் காட்டும் ἵνα அமைப்பு ‘பெறுவதற்காகவே’ எனத் தக்கவைக்கப்பட்டுள்ளது.
