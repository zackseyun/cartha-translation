- from: அவ்வாறே, இவர்களும் இப்போது கீழ்ப்படியாமல் போனது, உங்களுக்குக் காட்டப்பட்ட இரக்கத்தின் மூலம்[a] இவர்களும் இப்போது இரக்கம் பெறுவதற்காகவே.
  to: அவ்வாறே, இவர்களும் இப்போது கீழ்ப்படியாமல் போயிருக்கிறார்கள்; உங்களுக்குக் காட்டப்பட்ட இரக்கத்தின் மூலம் இவர்களும் இப்போது இரக்கம் பெறும்படியாக.
