  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: ta
  text: அல்லது, அவருக்கு முதலில் கொடுத்தவன் யார்? அவனுக்குத் திருப்பிச் செலுத்தப்படுமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘முதலில் கொடுத்தவன்’ என்பதற்கு: ‘முன்கூட்டியே கொடுத்தவன்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: முந்தைய வசனத்திலுள்ள தொடர்ச்சியான வினாக்களில் அடுத்த வினாவை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: τίς
  choice: யார்
  rationale: ஒரு நபரைக் குறிக்கும் வினாப்பெயராகத் தமிழில் இயல்பாக உள்ளது.
- source_word: προέδωκεν
  choice: முதலில் கொடுத்தவன்
  rationale: கடவுளுக்கு முன்பாக ஒருவர் கொடுத்து, அவரைக் கடன்பட்டவராக்க முடியும் என்ற கருத்தை மறுக்கும் வகையில், வினையின் முன்னுரிமை நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: சூழலில் கடவுளைக் குறிக்கும் கிரேக்கப் பதிலிப்பெயரைப் பெயர்ச்சொல்லாக மாற்றாமல் மரியாதை ஒருமையில் வழங்குகிறது.
- source_word: καὶ
  choice: அப்படியிருக்க, … -மா?
  rationale: கிரேக்கத்தில் இணைப்புச் சொல் இருந்தாலும், தமிழில் இந்த வினாவின் தர்க்கத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்த வினா அமைப்பில் உட்பொருளாக்கப்பட்டுள்ளது.
- source_word: ἀνταποδοθήσεται
  choice: திருப்பிக் கொடுக்கப்படுமா
  rationale: எதிரீடாகத் திருப்பிச் செலுத்துதல் என்ற எதிர்காலச் செயலப்பாட்டு பொருளைப் பாதுகாக்கிறது; தமிழில் சொல்லாட்சிக்கு ஏற்றவாறு வினாவாக வடிவமைக்கப்பட்டுள்ளது.
- source_word: αὐτῷ
  choice: அவனுக்கு
  rationale: முதலில் கொடுத்ததாகக் கருதப்படும் நபரையே இரண்டாவது பதிலிப்பெயர் குறிக்கிறது; கிரேக்கத்தின் குறிப்பு வேறுபாட்டைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: இரண்டு αὐτῷ பதிலிப்பெயர்களின் குறிப்புகள்
  choice: முதல் ‘அவருக்கு’ கடவுளையும், இரண்டாவது ‘அவனுக்கு’ கொடுத்ததாகக் கருதப்படும் மனிதனையும் குறிக்குமாறு மொழிபெயர்க்கப்பட்டது.
  alternative: இரண்டையும் ‘அவருக்கு’ என்று ஒரே வடிவில் வழங்குதல்
  rationale: கிரேக்கத்தில் ஒரே வடிவம் இருந்தாலும், முதல் பதிலிப்பெயர் கடவுளையும் இரண்டாவது பதிலிப்பெயர் τίς எனும் நபரையும் குறிக்கிறது. தமிழ் பாலின-மரியாதை வடிவங்கள் இந்த உறவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகின்றன.
- issue: προέδωκεν மற்றும் கடவுள் கடன்படுதல்
  choice: ‘முதலில்’ என்ற முன்னுரிமை நுட்பம் வெளிப்படையாக வைக்கப்பட்டது.
  alternative: ‘கொடுத்தவன் யார்?’ என்று மட்டும் வழங்குதல்
  rationale: யாரும் கடவுளுக்கு முன்னதாகக் கொடுத்து அவரைத் திருப்பிச் செலுத்த வேண்டிய கடப்பாட்டுக்குள் கொண்டுவரவில்லை என்ற வாக்கியத்தின் இறையியல் அழுத்தத்தை இது பாதுகாக்கிறது.
- issue: இரண்டாம் உட்கூற்றின் வாக்கிய வகை
  choice: சூழலும் யோபு 41:11 பின்னணியும் காட்டும் எதிர்பார்க்கப்படும் மறுப்பைத் திணிக்காமல், தமிழில் நேரடி வினாவாக வழங்கப்பட்டது.
  alternative: ‘அவனுக்குத் திருப்பிக் கொடுக்கப்படும்’ என்ற அறிக்கை வடிவம்
  rationale: கிரேக்க வடிவம் தொடரின் சொல்லாட்சியில் வினாவாகச் செயல்படுகிறது; வினா வடிவம் பதில் ‘ஒருவருமில்லை’ என்பதை உணர்த்தினாலும் அதை உரையில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் இடத்தில் ‘அவர்’, கற்பனையாக முதலில் கொடுத்த நபரைக் குறிக்கும் இடத்தில் ‘அவன்’ பயன்படுத்தப்பட்டதால் குறிப்புகள் தெளிவாகின்றன. மூலத்தின் சொல்லாட்சிசார் வினாவும் முன்னுரிமை நுட்பமும் பாதுகாக்கப்பட்டுள்ளன.
