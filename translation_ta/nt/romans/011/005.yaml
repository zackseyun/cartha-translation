source:
  edition: SBLGNT
  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: ta
  text: ஆகவே, அதுபோலவே இக்காலத்திலும், கிருபை சார்ந்த தேர்ந்தெடுப்பின்படி எஞ்சிய ஒரு பகுதி உண்டாயிருக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிருபையின் தேர்ந்தெடுப்பின்படி” அல்லது “கிருபையினால் உண்டான தேர்ந்தெடுப்பின்படி.”
    reason: κατ’ ἐκλογὴν χάριτος என்ற சொற்றொடரில் χάριτος என்பதற்கும் ἐκλογή என்பதற்கும் இடையிலான உறவை ஒன்றுக்கு மேற்பட்ட முறையில் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: ஆகவே, அதுபோலவே ... உம்
  rationale: οὖν முந்தைய எலியா எடுத்துக்காட்டிலிருந்து வரும் முடிவைக் குறிக்கிறது; οὕτως அந்த எடுத்துக்காட்டுடனான ஒப்புமையையும், καὶ நிகழ்காலத்திற்கும் அது பொருந்துவதையும் காட்டுகிறது.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: இக்காலத்தில்
  rationale: καιρός இங்கு ஒரு குறிப்பிட்ட காலகட்டத்தைக் குறிக்கிறது. ‘இக்காலத்தில்’ என்பது எலியாவின் காலத்துக்கும் பவுலின் நிகழ்காலத்துக்கும் உள்ள வேறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λεῖμμα
  choice: எஞ்சியோர்
  rationale: இச்சொல் மீதமுள்ள ஒரு சிறுபான்மையைக் குறிக்கிறது. மக்கள் கூட்டத்தைக் குறிக்கும் இச்சூழலில் ‘எஞ்சியோர்’ நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: கிருபையின் தெரிந்துகொள்ளுதலின்படி
  rationale: ἐκλογή என்பதன் தேர்ந்தெடுக்கும் செயல் சார்ந்த பொருளையும் χάριτος உடனான சுருக்கமான பிறப்புவேற்றுமை உறவையும் இச்சொற்றொடர் காக்கிறது; கிருபை அதன் மூலம், அடிப்படை, அல்லது தன்மை என்பதில் ஒன்றை மட்டும் நிர்ணயிக்கவில்லை.
- source_word: γέγονεν
  choice: உருவாகியிருக்கிறார்கள்
  rationale: γίνομαι என்பதன் நிறைவேற்றுக் கால வடிவம், முன்பு நிகழ்ந்ததன் விளைவாக இப்போது நிலவும் நிலையைக் குறிக்கிறது. பன்மை நபர்களைக் குறிக்கும் ‘எஞ்சியோர்’ என்பதுடன் இயல்பான தமிழுக்காகப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: பவுலின் இறையியல் சூழலில் ἐκλογή என்பதன் மொழிபெயர்ப்பு
  choice: தெரிந்துகொள்ளுதல்
  alternative: தேர்வு; தேர்ந்தெடுக்கப்பட்ட நிலை
  rationale: ‘தெரிந்துகொள்ளுதல்’ மூலச்சொல்லின் இறையியல் கனத்தைத் தக்கவைத்தாலும், குறிப்பிட்ட ஒரு திருச்சபைப் பிரிவின் கோட்பாட்டு முறையை உரைக்குள் இறக்குமதி செய்யாது.
- issue: κατ’ ἐκλογὴν χάριτος என்பதில் கிருபைக்கும் தெரிந்துகொள்ளுதலுக்கும் உள்ள உறவு
  choice: கிருபையின் தெரிந்துகொள்ளுதலின்படி
  alternative: கிருபையினால் தெரிந்துகொள்ளப்பட்டபடி; கிருபையான தெரிந்துகொள்ளுதலின்படி
  rationale: பிறப்புவேற்றுமையின் உண்மையான தெளிவின்மையை இவ்வடிவம் பாதுகாக்கிறது; கிருபை மூலம், அடிப்படை, அல்லது பண்பு என்று ஒற்றை விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமான நடை. ‘எஞ்சியோர்’ மக்கள் சார்ந்த λεῖμμα-வின் பொருளை இயல்பாகத் தருகிறது; அடிக்குறிப்பு மூலத்தின் இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறது.
