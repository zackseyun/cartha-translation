source:
  edition: SBLGNT
  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: ta
  text: மேலும், நான் அவர்களுடைய பாவங்களை நீக்கும்போது, இதுவே அவர்களுக்கான என்னுடைய உடன்படிக்கை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “என்னிடமிருந்து அவர்களுக்கு வரும் உடன்படிக்கை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: உடன்படிக்கை
  rationale: பவுலின் வேதாகம மேற்கோள் சூழலில் இது இறைவனின் கட்டுப்படுத்தும் வாக்குறுதியையும் உடன்படிக்கை உறவையும் குறிக்கிறது; ‘ஏற்பாடு’ அல்லது ‘உயில்’ என்பவற்றைவிட ‘உடன்படிக்கை’ பழைய ஏற்பாட்டு ஒலிப்பையும் இறையியல் நிறையையும் தெளிவாகக் காக்கிறது.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: நான் செய்யும் உடன்படிக்கை
  rationale: சொல்லுக்குச் சொல் ‘என்னிடமிருந்து வரும் உடன்படிக்கை’ என்று பொருள். இயல்பான தமிழில் ‘நான் செய்யும் உடன்படிக்கை’ அதன் தெய்வீக மூலத்தையும் உறவுசார் செயலையும் தெரிவிக்கிறது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: αὐτοῖς
  choice: அவர்களுடன்
  rationale: மூலத்தில் வேற்றுமை வடிவம் ‘அவர்களுக்கு’ என்று நேரடியாக வரக்கூடியதாயினும், உடன்படிக்கை உறவைக் குறிக்கும் இயல்பான தமிழில் ‘அவர்களுடன்’ பொருத்தமானது.
- source_word: ὅταν
  choice: நீக்கும்போது
  rationale: இது மீண்டும் மீண்டும் நிகழும் சந்தர்ப்பங்களைக் காட்டாமல், தீர்க்கதரிசன வாக்குறுதி நிறைவேறும் காலத்தைக் குறிக்கிறது.
- source_word: ἀφέλωμαι
  choice: நான் ... நீக்கும்போது
  rationale: ἀφαιρέω இங்கு பாவங்களை அகற்றுவதைக் குறிக்கிறது. ‘நீக்குதல்’ நவீன தமிழில் இயல்பாகவும் வேதாகமப் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: அவர்களுடைய பாவங்களை
  rationale: பன்மை வடிவத்தையும் ஒழுக்க மற்றும் இறையியல் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: καὶ αὕτη
  choice: மேலும், ... இதுவே
  rationale: καί முந்தைய கருத்தோடு இணைப்பதை ‘மேலும்’ காட்டுகிறது; αὕτη வலியுறுத்தும் சுட்டை ‘இதுவே’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் தீர்க்கதரிசன மேற்கோளில் διαθήκη என்பதன் தன்மை
  choice: உடன்படிக்கை
  alternative: உயில்; ஏற்பாடு
  rationale: இப்பகுதி இஸ்ரவேலுக்கான இறைவனின் மீட்பு வாக்குறுதியைக் கொண்ட தீர்க்கதரிசன உடன்படிக்கை மொழியை எதிரொலிக்கிறது. ‘உடன்படிக்கை’ என்று மொழிபெயர்ப்பது பின்னாளைய தனிப்பட்ட கோட்பாடுகளைச் சேர்க்காமல் அந்த வேதாகம இடைஉரைத்தொடர்பைக் காக்கிறது.
- issue: ὅταν ἀφέλωμαι என்பதன் காலப் பொருள்
  choice: நான் ... நீக்கும்போது
  alternative: நான் ... நீக்கும் போதெல்லாம்
  rationale: சூழல் மீண்டும் நிகழும் பொதுவான நிபந்தனையை அல்ல, மீட்பு வரலாற்றில் நிறைவேறும் உறுதியான வாக்குறுதியைக் குறிக்கிறது. குறிப்பான காலத்தைத் தேவையின்றி நிர்ணயிக்காமல் ‘நீக்கும்போது’ அந்தத் தீர்க்கதரிசன உறுதியைப் பாதுகாக்கிறது.
- issue: வினைச்சொல் இல்லாத ἡ παρ’ ἐμοῦ διαθήκη தொடரின் காலநிலை
  choice: நான் செய்யும் உடன்படிக்கை இதுவே
  alternative: இது அவர்களுடன் நான் செய்யவிருக்கும் உடன்படிக்கையாக இருக்கும்
  rationale: கிரேக்கத்தில் வெளிப்படையான எதிர்கால வினைச்சொல் இல்லை. தமிழில் இயல்பான பெயர்ப்பயனிலை வாக்கியத்தைப் பயன்படுத்தி மூலத்தின் சுருக்கத்தைக் காக்கிறது; ‘நீக்கும்போது’ என்ற காலத் தொடர் எதிர்நோக்கும் வாக்குறுதியை போதுமான அளவு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘உடன்படிக்கை’, ‘பாவங்கள்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. மூலத்தின் தெய்வீக மூலப் பொருளை முதன்மை உரை இயல்பாகச் சொல்கிறது; அதன் நேரடி இலக்கண வடிவம் [a] அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
