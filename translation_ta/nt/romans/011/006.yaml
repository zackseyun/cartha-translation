  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: ta
  text: அது அருளினால் என்றால், இனி செயல்களினால் அல்ல; இல்லையெனில், அருள் இனி அருளாக இருப்பதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: அருளினால்
  rationale: கிரேக்கத் தரவு ஒருமையில் கருவிப்பொருளைக் காட்டுகிறது; தேர்வு தேவனுடைய இலவச அருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξ ἔργων
  choice: செயல்களினால்
  rationale: ἐξ இங்கு அடிப்படை அல்லது மூலத்தைச் சுட்டுகிறது; தமிழில் இயல்பாக காரண/அடிப்படைப் பொருளைத் தரும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: γίνεται χάρις
  choice: அருளாக இருப்பதில்லை
  rationale: γίνεται என்பதன் நேரடி 'ஆகிறது' என்ற கூறைத் தமிழில் சொற்படியே வைத்தால் செயற்கையாக ஒலிக்கும்; சூழலில் அருள் தனது இயல்பையே இழக்கும் என்ற பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: அருளுக்கும் செயல்களுக்கும் இடையிலான முரண்பாடு
  choice: அருளினால் என்றால், இனி செயல்களினால் அல்ல
  alternative: அருளின் அடிப்படையில் என்றால், செயல்களின் அடிப்படையில் அல்ல
  rationale: பவுலின் கூர்மையான எதிர்மறை அமைப்பைத் தக்கவைத்து, எந்த வகையான செயல்கள் என்று மூலத்தில் குறிப்பிடப்படாததைத் தமிழிலும் குறிப்பிடாமல் விடுகிறது.
- issue: γίνεται என்ற வினையின் வெளிப்பாடு
  choice: அருள் இனி அருளாக இருப்பதில்லை
  alternative: அருள் இனி அருளாக ஆவதில்லை
  rationale: இறையியல் முடிவைச் சேர்க்காமல், அருள் செயல்களின் அடிப்படையில் இருந்தால் அது அருள் என்ற தன்மையில் நிலைக்காது என்ற மூல வாதத்தை இயல்பான தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. மூலத்தின் நிபந்தனை அமைப்பும் தர்க்க முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன.
