  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: ta
  text: அவர்களும்கூட தங்கள் அவிசுவாசத்தில் தொடர்ந்து நிலைத்திருக்காவிட்டால், ஒட்டப்படுவார்கள்; ஏனெனில் அவர்களை மீண்டும் ஒட்டுவதற்கு கடவுள் வல்லவர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: அவர்களும்
  rationale: καί என்பதன் சேர்க்கைப் பொருளையும் ἐκεῖνοι என்பதன் பின்னோக்குச் சுட்டையும் இயல்பான தமிழில் தருகிறது; சூழலில் இது வெட்டப்பட்ட இஸ்ரயேலர்களைக் குறிக்கிறது.
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: தொடர்ந்து நிலைத்திருக்காவிட்டால்
  rationale: ἐπιμένω என்பதிலுள்ள நீடித்திருத்தல் அல்லது தொடர்ந்திருத்தல் என்ற அம்சத்தை நிபந்தனை அமைப்பில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τῇ ἀπιστίᾳ
  choice: தங்கள் அவிசுவாசத்தில்
  rationale: ரோமர் 11-இல் விசுவாசம்–அவிசுவாசம் என்ற நேரடி எதிர்மறையைப் பாதுகாக்கிறது; உடைமைத் தொடர்பை இயல்பாக்க ‘தங்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐγκεντρισθήσονται
  choice: ஒட்டவைக்கப்படுவார்கள்
  rationale: ஒலிவமரக் கிளை ஒட்டும் உருவகத்தையும் எதிர்காலச் செயப்பாட்டு வடிவத்தையும் இயல்பான தமிழில் தருகிறது; இவ்விடத்தில் மூலத்தில் இல்லாத ‘மீண்டும்’ என்பதைக் கூட்டவில்லை.
- source_word: δυνατὸς
  choice: வல்லவர்
  rationale: கடவுளின் ஆற்றல் அல்லது இயலுமையைச் சுருக்கமாகவும் கண்ணியமான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: மீள்சேர்த்தல் அல்லது மறுபடியும் நிகழ்தல் என்ற மூலத்தின் வெளிப்படையான பொருளைப் பாதுகாக்கிறது.
- source_word: ἐγκεντρίσαι αὐτούς
  choice: அவர்களை ... ஒட்டவைக்க
  rationale: முந்தைய ஒட்டுதல் உருவகத்தை ஒரே சொல்லாட்சியுடன் தொடர்கிறது; πάλιν உடன் சேர்ந்து மீள ஒட்டவைக்கும் பொருளைத் தருகிறது.
- source_word: δὲ
  choice: —
  rationale: தமிழில் வாக்கியத் தொடர்பு சூழலால் தெளிவாக இருப்பதால் தனி இணைப்புச்சொல் இடாமல் இயல்பாகத் தொடங்கப்பட்டுள்ளது; மிதமான எதிர்மறைத் தொடர்பு கருத்தமைப்பிலேயே நிலைக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: வெளிப்படையாகக் கூறப்பட்ட எழுவாயை வழக்கமான நவீனத் தமிழில் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: ἀπιστία என்பதன் பொருள்
  choice: அவிசுவாசம்
  alternative: உண்மையின்மை
  rationale: ரோமர் 11-இன் உடனடிச் சூழலில் விசுவாசம் மற்றும் அவிசுவாசம் சேர்த்தல் மற்றும் வெட்டப்படுதல் ஆகியவற்றோடு நேரடியாக எதிரெதிராக வருகின்றன. ஆகவே ‘அவிசுவாசம்’ உடனடிக் கருத்தைச் சிறப்பாகப் பாதுகாக்கிறது; விரிவான உடன்படிக்கை சார்ந்த பொருளைத் திணிக்கவில்லை.
- issue: முதல் ஒட்டுதல் வினையிலேயே மீள்சேர்த்தலை வெளிப்படுத்தலாமா
  choice: முதல் கூறில் ‘ஒட்டவைக்கப்படுவார்கள்’ என்றும் இரண்டாம் கூறில் மட்டும் ‘மீண்டும்’ என்றும் தரப்பட்டது
  alternative: முதல் கூறிலேயே ‘மீண்டும் ஒட்டவைக்கப்படுவார்கள்’ என்று தருதல்
  rationale: πάλιν என்பது கிரேக்கத்தில் இரண்டாம் கூறில்தான் வெளிப்படையாக உள்ளது. அதன் அமைவிடத்தைப் பாதுகாப்பதால் மூலத்தில் குறிக்கப்பட்ட வலியுறுத்தல் மாறாமல் இருக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடை. ஒலிவமரத்தில் கிளையை ஒட்டும் உருவகம் ‘ஒட்டவைக்க’ என்ற சொல்லால் தொடர்ச்சியாகப் பாதுகாக்கப்பட்டுள்ளது. வசனத்தில் அடிக்குறிப்புகள் தேவையில்லை.
