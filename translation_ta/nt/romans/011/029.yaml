  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: ta
  text: ஏனெனில், கடவுளுடைய அருள்கொடைகளும் அழைப்பும் திரும்பப் பெறப்படுவதில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றைக் குறித்து மனம் மாறுவதில்லை” அல்லது “திரும்ப எடுத்துக்கொள்ளப்படுவதில்லை.”
    reason: ἀμεταμέλητα என்பதன் ‘மனம் மாறாத/வருந்தாத’ மற்றும் ‘திரும்பப் பெறாத’ தொடர்புடைய பொருள் நிழல்களைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: திரும்பப் பெறப்படாதவை
  rationale: இந்தச் சொல் ‘வருந்த வேண்டியதல்ல’ அல்லது ‘திரும்பப் பெறப்படாதது’ என்ற பொருள்களைத் தருகிறது. இச்சூழலில் கடவுளுடைய அருள்கொடைகளும் அழைப்பும் ரத்து செய்யப்படுவதில்லை என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; அதேவேளையில் ‘மாறாதவை’ என்று பொருளை மிகைப்படுத்தவில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τὰ χαρίσματα
  choice: அருள்கொடைகள்
  rationale: χάρισμα என்பது அருளினால் வழங்கப்படும் கொடையைக் குறிக்கிறது. ‘அருள்கொடைகள்’ என்பது அதன் அருள் சார்ந்த தன்மையையும் பன்மையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἡ κλῆσις
  choice: அழைப்பு
  rationale: கடவுளிடமிருந்து வரும் அழைப்பு என்ற பவுலின் இறையியல் நிறையை வைத்திருக்கிறது; ‘கட்டளை’ அல்லது ‘அழைப்பாணை’ போன்ற மிகக் குறுகிய பொருளைச் சேர்ப்பதில்லை.
- source_word: τοῦ θεοῦ
  choice: கடவுளுடைய
  rationale: கொடைகளுக்கும் அழைப்புக்கும் கடவுளே மூலமா அல்லது அவை அவருக்குரியவையா என்ற இயல்பான மரபுத்தொடர் அகலத்தைத் தமிழிலும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘கடவுளுடைய அருள்கொடைகளும் அழைப்பும்’ என்பதன் சூழல்சார் எல்லை
  choice: இது இஸ்ரவேலை மட்டும் குறிக்கிறதா அல்லது பொதுவாகக் கடவுளின் அருள்கொடைகளையும் அழைப்பையும் குறிக்கிறதா என்பதை மொழிபெயர்ப்பில் வெளிப்படையாகத் தீர்மானிக்காமல், மூலத்தின் சொற்றொடரைப் பாதுகாத்தல்.
  alternative: ரோமர் 9–11 சூழலைக் கொண்டு இஸ்ரவேலின் உடன்படிக்கைச் சலுகைகளும் அழைப்பும் என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது எல்லாருக்குமான பொதுக் கோட்பாடாக விரிவுபடுத்தல்.
  rationale: உடனடிச் சூழல் இஸ்ரவேலை வலுவாகக் குறித்தாலும், கிரேக்க வசனம் பொருளை மீண்டும் வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே இறையியல் பதற்றத்தையும் பொருள் அகலத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘அருள்கொடைகள்’ மூலம் χάρισμα என்பதின் அருள் சார்ந்த நுணுக்கம் பாதுகாக்கப்பட்டுள்ளது; ‘திரும்பப் பெறப்படாதவை’ என்பது இயல்பான தமிழில் மையப் பொருளைத் தருகிறது. அடிக்குறி குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
