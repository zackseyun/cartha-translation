id: ROM.11.12
reference: Romans 11:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: ta
  text: அவர்களுடைய மீறுதல் உலகத்திற்குச் செல்வமாகவும், அவர்களுடைய இழப்பு[a] பிற இன மக்களுக்குச் செல்வமாகவும் இருக்குமானால், அவர்களுடைய நிறைவு[b] எவ்வளவு அதிகச் செல்வத்தைக் கொண்டுவரும்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோல்வி” அல்லது “குறைவு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய முழு எண்ணிக்கை” அல்லது “அவர்கள் முழுமையாக இணைக்கப்படுதல்.”
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: மீறுதல்
  rationale: தவறான அடி, குற்றம், மீறல் என்ற ஒழுக்கப் பொருளைத் தக்கவைக்கிறது; இச்சூழலில் குற்றத்தின் தன்மையை அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: πλοῦτος
  choice: செல்வம்
  rationale: தேவ ஆசீர்வாதத்தின் மிகுதியைக் குறிக்கும் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: κόσμου
  choice: உலகம்
  rationale: இஸ்ரவேலுக்கு அப்பால் பயனடையும் பரந்த மனித உலகைக் குறிக்கும் கிரேக்கச் சொல்லின் அகலத்தைப் பாதுகாக்கிறது.
- source_word: ἥττημα
  choice: இழப்பு
  rationale: இச்சொல்லில் உள்ள இழப்பு, தோல்வி, குறைவு ஆகிய சாத்தியமான நுணுக்கங்களில் ஒன்றை மட்டும் கடுமையாக நிர்ணயிக்காமல், இணை அமைப்புக்கு ஏற்ற பொதுவான சொல்லாக உள்ளது.
- source_word: ἐθνῶν
  choice: பிற இனத்தார்
  rationale: ரோமர் நிருபத்தில் இஸ்ரவேலர் அல்லது யூதர்களுக்கு மாறாகக் குறிக்கப்படும் யூதரல்லாத மக்களை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πόσῳ μᾶλλον
  choice: இன்னும் எவ்வளவு அதிகமானதாக
  rationale: குறைந்த நிலையிலிருந்து அதிக நிலையை வலியுறுத்தும் கிரேக்க ஒப்பீட்டு வாதத்தை இயல்பாக எடுத்துரைக்கிறது.
- source_word: πλήρωμα
  choice: நிறைவு
  rationale: முழு எண்ணிக்கை, முழுமையான சேர்க்கை, நிறைவேற்றம் ஆகிய அளவு மற்றும் தன்மை சார்ந்த சாத்தியங்களைத் திறந்தவையாக வைத்திருக்கிறது.
theological_decisions:
- issue: τὸ πλήρωμα αὐτῶν என்பதன் குறிப்பு மற்றும் நுணுக்கம்
  choice: அவர்களுடைய நிறைவு
  alternative: அவர்களுடைய முழு எண்ணிக்கை; அவர்கள் முழுமையாக இணைக்கப்படுதல்; அவர்களுடைய நிறைவேற்றம் அல்லது மீட்பு
  rationale: இது இஸ்ரவேலரின் முழு எண்ணிக்கையையா, முழுமையான சேர்க்கையையா, இறுதிக்கால மீட்பையா குறிக்கிறது என்பதை வசனம் வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே மூலத்தின் இறையியல் அழுத்தமும் திறந்த தன்மையும் பிரதான உரையில் பாதுகாக்கப்படுகின்றன.
- issue: இறுதி தொடரில் விடுபட்டுள்ள பெயர்ச்சொல்
  choice: “இன்னும் எவ்வளவு அதிகமானதாக இருக்கும்” என்று சுருக்கத்தைத் தக்கவைத்தல்
  alternative: “இன்னும் எவ்வளவு அதிகமான செல்வமாக இருக்கும்” என்று ‘செல்வம்’ என்பதை மீண்டும் சேர்த்தல்
  rationale: கிரேக்கத்தில் இறுதிக் கேள்வி சுருக்கமாக உள்ளது. தமிழில் பொருள் புரியும்படியும், மூலத்தில் வெளிப்படையாக இல்லாத ‘செல்வம்’ என்பதை கட்டாயமாகச் சேர்க்காமலும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. “பிற இனத்தார்” என்பது யூதர்–யூதரல்லாதவர் என்ற சூழல்சார் வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
