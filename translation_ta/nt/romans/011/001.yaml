id: ROM.11.1
reference: Romans 11:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: ta
  text: 'ஆகவே நான் கேட்கிறேன்: கடவுள் தமது மக்களைத் தள்ளிவிட்டாரா?[a] ஒருபோதும் இல்லை![b] ஏனெனில் நானும் ஓர் இஸ்ரவேலன்; ஆபிரகாமின் வழிவந்தவன்,[c] பென்யமீன் கோத்திரத்தைச் சேர்ந்தவன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது மக்களை நிராகரித்தாரா?”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் இது கடுமையான மறுப்பைத் தெரிவிக்கும் சொற்றொடர்; “நிச்சயமாக இல்லை!” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “ஆபிரகாமின் விதையிலிருந்து வந்தவன்.” அதாவது, ஆபிரகாமின் சந்ததியைச் சேர்ந்தவன்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: ஆகவே நான் கேட்கிறேன்
  rationale: λέγω இங்கு சொல்லைக் குறிப்பிடுவதற்குப் பதிலாக வினாவை அறிமுகப்படுத்துகிறது; οὖν-இன் முடிவுறுத்தும் தொடர்பை ‘ஆகவே’ காக்கிறது.
- source_word: μὴ ἀπώσατο
  choice: புறக்கணித்துவிட்டாரா
  rationale: ἀπωθέομαι தள்ளிவிடுதல் அல்லது நிராகரித்தலைக் குறிக்கிறது. கேள்வியிலுள்ள μή எதிர்மறையான பதிலை எதிர்பார்க்கிறது; தமிழ் வடிவம் அதன் வினாவியல் இயல்பை இயல்பாகத் தருகிறது.
- source_word: τὸν λαὸν αὐτοῦ
  choice: தமது மக்களை
  rationale: λαός என்பது மக்களைக் குறிக்கிறது; αὐτοῦ காட்டும் கடவுளுடனான உரிமைத் தொடர்பை மரியாதை ஒருமை ‘தமது’ தெளிவாகக் காக்கிறது.
- source_word: μὴ γένοιτο
  choice: ஒருபோதும் இல்லை!
  rationale: இது சாதாரண மறுப்பைவிட வலுவான பவுலின் கண்டிப்பான மறுப்பு. சொற்சொல் வடிவத்தை விட இயல்பான நவீன தமிழில் அதன் வலிமையைத் தருகிறது.
- source_word: καὶ γὰρ ἐγὼ
  choice: ஏனெனில் நானும்
  rationale: γάρ காரணத்தை அறிமுகப்படுத்துகிறது; καὶ மற்றும் வலியுறுத்தப்பட்ட ἐγώ ஆகியவை பவுல் தம்மையே சான்றாக முன்வைப்பதை ‘நானும்’ மூலம் காட்டுகின்றன.
- source_word: Ἰσραηλίτης
  choice: ஓர் இஸ்ரவேலன்
  rationale: இன மற்றும் உடன்படிக்கை அடையாளத்தைத் தரும் இயல்பான தமிழ் பெயர்ப்பு.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: ஆபிரகாமின் வழிவந்தவன்
  rationale: σπέρμα என்பதன் அடிப்படைப் பொருள் ‘விதை’; இங்கு அது சந்ததி அல்லது மரபுவழித் தோற்றத்தைக் குறிக்கிறது. ‘வழிவந்தவன்’ தனிநபரான பவுலின் வம்சத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φυλῆς Βενιαμίν
  choice: பென்யமீன் கோத்திரத்தைச் சேர்ந்தவன்
  rationale: φυλή என்பதற்கான மரபான வேதாகமத் தமிழ் ‘கோத்திரம்’; ‘சேர்ந்தவன்’ மரபுக் குழு அடையாளத்தைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: பவுலின் கேள்வி இன இஸ்ரவேலை முழுமையாக அல்லது என்றென்றும் நிராகரிப்பதைக் குறிக்கிறதா
  choice: ‘கடவுள் தமது மக்களைப் புறக்கணித்துவிட்டாரா?’ என்று கூடுதல் வரையறையின்றி மொழிபெயர்த்தல்
  alternative: ‘கடவுள் தமது மக்களை முற்றிலும்/என்றென்றும் புறக்கணித்துவிட்டாரா?’
  rationale: கிரேக்கத்தில் ‘முற்றிலும்’ அல்லது ‘என்றென்றும்’ என்பதற்கான வெளிப்படையான வினையடை இல்லை. கேள்வியின் வரம்பை அடுத்துள்ள சூழல் விளக்குமாறு அதன் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கொண்டுள்ளது. ‘கோத்திரம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல்லை வைத்துக்கொண்டு, அரிதான சொற்சொல் அமைப்புகள் தவிர்க்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
