  source_fidelity: ‘புறக்கணித்துவிட்டாரா?’ என்பது ἀπώσατο என்ற வினை தரும் ‘தள்ளிவிடுதல்/நிராகரித்தல்’ என்பதைக் காட்டிலும் கவனிக்காமல் விடுதல் என்ற மெலிந்த பொருளைத் தரக்கூடும். பிரதான உரையில் ‘தள்ளிவிட்டாரா?’ என்பது மூலத்தின் வலிமையையும் வினாவியல் வடிவத்தையும் நன்றாகக் காக்கிறது. மற்ற கூறுகள்—வலியுறுத்தப்பட்ட மறுப்பு, பவுலின் இஸ்ரவேல அடையாளம், ஆபிரகாமிய வம்சம், பென்யமீன் கோத்திரம்—மூலத்தோடு ஒத்திருக்கின்றன.
