id: ROM.11.17
reference: Romans 11:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: ta
  text: ஆனால், கிளைகளில் சில முறிக்கப்பட்டிருக்க, காட்டு ஒலிவமரமாக இருந்த நீ[a] அவற்றின் நடுவே ஒட்டப்பட்டு, ஒலிவமரத்தின் வேரிலும் செழுமையிலும் அவற்றோடு பங்குபெறுபவனானாய்[b] என்றால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காட்டு ஒலிவக் கிளையாக இருந்த நீ.”
    reason: ἀγριέλαιος என்பது சொற்பொருளில் காட்டு ஒலிவமரத்தைக் குறிக்கிறது; ஒட்டுதல் உருவகத்தின் சூழலில் ஒட்டப்படும் கிளை அல்லது தளிர் உட்கருத்தாக இருக்கலாம்.
  - marker: b
    text: “ஒலிவமரத்தின் செழுமைமிக்க வேரில் அவற்றோடு பங்குபெறுபவனானாய்” என்றும் மொழிபெயர்க்கலாம். மரபாக, “ஒலிவமரத்தின் வேரிலும் கொழுமையிலும்” என வழங்கப்பட்டுள்ளது.
    reason: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας என்ற நெருக்கமான இறைவேற்றுமைத் தொடர், ‘செழுமைமிக்க வேர்’ என்ற ஒருங்கிணைந்த பொருளாகவும், வேர் மற்றும் ஒலிவமரத்தின் செழுமை என்ற தொடர்புடைய இரு கூறுகளாகவும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: Εἰ δέ
  choice: ஆனால் … என்றால்
  rationale: δέ குறிக்கும் மென்மையான எதிர்மறைத் தொடர்பையும் εἰ குறிக்கும் நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τινες τῶν κλάδων
  choice: கிளைகளில் சில
  rationale: τινες என்பதன் குறிப்பிடப்படாத ‘சில’ என்ற பொருளையும், τῶν κλάδων என்பதன் பகுதிப்பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: ἐξεκλάσθησαν
  choice: முறித்துப்போடப்பட்டிருக்க
  rationale: ἐκκλάω என்பதன் கிளையை முறித்து அகற்றும் உருவகத்தை ‘வெட்டப்பட்டு’ என்பதைக் காட்டிலும் துல்லியமாகத் தருகிறது; நிபந்தனை வாக்கியத்தில் முடிந்த செயலைத் தமிழ் இயல்பில் இணைக்கிறது.
- source_word: ἀγριέλαιος ὢν
  choice: காட்டு ஒலிவமரமாக இருந்த
  rationale: ἀγριέλαιος என்பதைக் ‘பிற இனத்தவர்’ என விளக்கிவிடாமல் ஒலிவமர உருவகத்தையே காக்கிறது; ὢν இங்கு பின்னணிச் சூழலைக் காட்டுகிறது.
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: அவற்றின் நடுவே ஒட்டவைக்கப்பட்டு
  rationale: ἐγκεντρίζω என்ற தோட்டக்கலைச் சொல்லுக்கு ‘ஒட்டவைக்கப்படுதல்’ இயல்பான தமிழ் இணை; ἐν αὐτοῖς மீதமுள்ள கிளைகளின் நடுவிலான சேர்க்கையைச் சுட்டுகிறது.
- source_word: συγκοινωνὸς … ἐγένου
  choice: அவற்றோடு பங்குபெறுகிறவனானாய்
  rationale: συγκοινωνός குறிக்கும் மற்றவர்களுடனான கூட்டுப்பங்கேற்பையும் ἐγένου குறிக்கும் புதிய நிலைக்குள் வந்ததையும் வெளிப்படுத்துகிறது.
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: ஒலிவமரத்தின் வேரிலும் அதன் செழுமையிலும்
  rationale: தொடர்ச்சியான இறைவேற்றுமை அமைப்பை ஒரே விளக்கமாகச் சுருக்காமல், வேர் மற்றும் ஊட்டமிக்க செழுமை ஆகிய இரு கருத்துகளின் நெருக்கமான தொடர்பை வாசிக்கத்தக்க தமிழில் காக்கிறது.
theological_decisions:
- issue: ἀγριέλαιος என்ற உருவகத்தின் அடையாளம்
  choice: ‘காட்டு ஒலிவமரம்’ என்று உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘பிற இனத்தவன்’ அல்லது ‘காட்டு ஒலிவக் கிளை’ என்று விளக்குதல்
  rationale: பவுலின் வாதம் ஒலிவமர உருவகத்தின் வழியாகவே இயங்குகிறது. மொழிபெயர்ப்பு அதன் இறையியல் குறியீட்டை நேரடியாகத் தீர்மானித்து எழுதாமல், உருவகத்தை வாசகரிடம் விட்டுவைக்கிறது.
- issue: வேர் மற்றும் செழுமைக்கு இடையிலான இலக்கண உறவு
  choice: ‘வேரிலும் அதன் செழுமையிலும்’ என்று இரண்டிலும் பங்கேற்பதை வெளிப்படுத்துதல்
  alternative: ‘ஒலிவமரத்தின் செழுமைமிக்க வேரில்’ அல்லது ‘ஒலிவமரத்தின் செழுமைக்குரிய வேரில்’
  rationale: கிரேக்கத்தில் தொடர்ச்சியாக வரும் இறைவேற்றுமைகள் பலவாறு தொடர்புபடுத்தப்படலாம். முதன்மை உரை வேர் மற்றும் செழுமை இரண்டையும் தெளிவாக வைத்தாலும், மாற்று இலக்கணப் புரிதலை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உருவகத்தின் செறிவும் காக்கப்பட்டுள்ளன. தோட்டக்கலைச் செயலைக் குறிக்க பொதுவாகப் புரியும் ‘ஒட்டவைக்கப்பட்டு’ பயன்படுத்தப்பட்டது. வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் நிபந்தனை வாக்கியத்தின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
