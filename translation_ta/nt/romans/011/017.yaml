  source_fidelity: திருத்தப்பட்ட உரை Εἰ δέ-யின் நிபந்தனைத் தொடக்கத்தையும், ‘கிளைகளில் சில’ என்ற பகுதிப்பொருளையும், ἐξεκλάσθησαν-இன் செயலற்ற ‘முறிக்கப்பட்ட’ உருவகத்தையும், ἀγριέλαιος-இன் காட்டு ஒலிவ உருவகத்தையும், ἐνεκεντρίσθης-இன் ஒட்டுதல் செயலைவும், συγκοινωνὸς ... ἐγένου-இன் இணைந்த பங்கேற்பையும் காக்கிறது. வேர் மற்றும் ஒலிவமரத்தின் செழுமை இரண்டையும் முதன்மை உரையில் தனித்தனியாக வெளிப்படுத்துகிறது.
  naturalness: ‘முறித்துப்போடப்பட்டிருக்க’ என்பதற்குப் பதிலாக ‘முறிக்கப்பட்டிருக்க’ என்பது கிளைகள் ‘முறிந்து அகற்றப்பட்ட’ உருவகத்திற்கு இயல்பாகவும் நேரடியாகவும் அமைகிறது. ‘ஒட்டப்பட்டு’ என்பது நவீனத் தமிழில் grafted என்பதற்கான சுருக்கமான, இயல்பான தோட்டக்கலைச் சொல்லாகும். அடிக்குறிப்பு அடையாளங்கள் அவை விளக்கும் சொற்றொடர்களின் உடனடியாகப் பின்னர் வைக்கப்பட்டுள்ளன.
  terminology: ‘காட்டு ஒலிவமரம்,’ ‘ஒட்டப்பட்டு,’ ‘வேர்,’ ‘செழுமை’ ஆகியவை உருவகத்தையும் நவீன நிலையான தமிழ் நடையையும் காக்கின்றன. ‘அவற்றோடு பங்குபெறுபவனானாய்’ என்பது συγκοινωνός-இன் உடனிணைந்த பங்கேற்பைக் காட்டுகிறது; அதை இறையியல் விளக்கமாக மாற்றவில்லை.
