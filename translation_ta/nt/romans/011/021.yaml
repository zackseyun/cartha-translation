id: ROM.11.21
reference: Romans 11:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: ta
  text: ஏனெனில், கடவுள் இயல்பான கிளைகளைத் தப்பவிடவில்லை என்றால், உன்னையும் அவர் தப்பவிடமாட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ஏனெனில் ... என்றால்
  rationale: γάρ குறிக்கும் முந்தைய வசனத்துடனான விளக்கத் தொடர்பையும், εἰ குறிக்கும் நிபந்தனையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: θεός என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்; வாக்கியத்தின் எழுவாயாகத் தெளிவாக நிற்கிறது.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: இயல்பாகச் சேர்ந்த கிளைகளையே
  rationale: κατὰ φύσιν என்பதன் ‘இயல்பின்படி/இயல்பாகச் சேர்ந்த’ பொருளைப் பாதுகாத்து, ஒலிவமர உருவகத்தில் அந்த மரத்துக்கு இயல்பாக உரிய கிளைகள் என்ற தொடர்பைத் தமிழில் தெளிவாக்குகிறது. ‘-ஏ’ அடுத்துவரும் ‘உன்னையும்’ என்பதுடனான வலியுறுத்தப்பட்ட ஒப்புமையை இயல்பாக்குகிறது.
- source_word: οὐκ ἐφείσατο
  choice: தப்பவிடவில்லை
  rationale: φείδομαι என்பதன் ‘தீங்கிலிருந்து விட்டுவைத்தல், spare’ என்ற பொருளை கிளைகள் வெட்டப்படும் உருவகச் சூழலில் இயல்பான தமிழில் தருகிறது; ‘இரக்கம் காட்டவில்லை’ என்று மாற்றி உருவகத்தைத் தளர்த்தவில்லை.
- source_word: οὐδὲ σοῦ φείσεται
  choice: உன்னையும் அவர் தப்பவிடமாட்டார்
  rationale: οὐδέ குறிக்கும் எதிர்மறைத் தொடர்ச்சியை ‘உன்னையும்’ என்பதால் வெளிப்படுத்தி, σοῦ ஒருமை முன்னிலையை அப்படியே பாதுகாக்கிறது. எதிர்கால எச்சரிக்கையின் நேரடித் தன்மையும் நிலைக்கிறது.
theological_decisions:
- issue: ‘இயல்பாகச் சேர்ந்த கிளைகள்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் கிளைகள் என்ற உருவகமே பாதுகாக்கப்பட்டது.
  alternative: அதை ‘இஸ்ரவேலர்’ என்று நேரடியாக விளக்குதல்.
  rationale: சூழலில் அது இஸ்ரவேலைக் குறிப்பது வலுவாக இருந்தாலும், இவ்வசனத்தில் பவுல் உருவகமாகவே கூறுகிறார்; மொழிபெயர்ப்பு அந்தக் குறிப்பை விளக்கவுரையாக மாற்றக்கூடாது.
- issue: ‘உன்னை’ நோக்கிய எச்சரிக்கையின் இறையியல் பரப்பு
  choice: ஒருமையில் உள்ள நேரடி எச்சரிக்கை எந்தக் கோட்பாட்டு வரையறையும் சேர்க்காமல் மொழிபெயர்க்கப்பட்டது.
  alternative: தனிநபர் அல்லது சமூகத் தேர்வு, நிலைத்திருத்தல் அல்லது விசுவாசத்திலிருந்து விலகுதல் ஆகிய குறிப்பிட்ட இறையியல் அமைப்புகளின் அடிப்படையில் விரிவாக்குதல்.
  rationale: கிரேக்க உரை உண்மையான எச்சரிக்கையைத் தருகிறது; ஆனால் அந்த விரிவான விவாதங்களை இங்கே தீர்மானிக்கவில்லை. எனவே அதன் பதற்றம் அப்படியே விடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமானவும் நேரடியாகப் புரியக்கூடியவுமான நடை. ‘இயல்பாகச் சேர்ந்த’ என்பது ‘இயற்கையான’ என்பதால் ஏற்படக்கூடிய உயிரியல் நிழற்பொருளைத் தவிர்த்து, மரத்துக்கு இயல்பாக உரிய கிளைகள் என்ற உருவகத் தொடர்பை வெளிப்படுத்துகிறது. வாசிப்பைத் தடுக்கும் அவசியமில்லாத அடிக்குறிப்பு சேர்க்கப்படவில்லை.
