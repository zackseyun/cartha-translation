review_pass:
  verdict: revise
  source_fidelity: The conditional-explanatory structure (εἰ γὰρ), the singular address (σοῦ), and the future warning are retained. However, “இயல்பாகச் சேர்ந்த” makes the metaphor’s implication (“belonging/attached to the tree”) more explicit than κατὰ φύσιν itself, and the emphatic “-ஏ” adds emphasis not required by the Greek.
  naturalness: The proposed revision is concise, dignified modern Tamil and reads naturally in a scriptural register. “தப்பவிட” is an established contextual Tamil rendering of ‘spare’ in this warning.
  terminology: “இயல்பான கிளைகள்” directly represents κατὰ φύσιν κλάδοι while preserving Paul’s olive-tree metaphor without identifying the branches in the text. “கடவுள்” is consistent modern standard Tamil terminology for θεός.
  issues:
  - severity: medium
    issue: “இயல்பாகச் சேர்ந்த கிளைகளையே” is interpretively expanded and emphatic.
    rationale: κατὰ φύσιν means ‘according to nature/natural’; it does not explicitly state ‘joined/attached,’ though that idea coheres with the metaphor. The focus suffix -ஏ can suggest ‘even the natural branches,’ an emphasis not explicit in the Greek.
  revised_text: ஏனெனில், கடவுள் இயல்பான கிளைகளைத் தப்பவிடவில்லை என்றால், உன்னையும் அவர் தப்பவிடமாட்டார்.
