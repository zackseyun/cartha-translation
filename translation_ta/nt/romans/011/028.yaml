source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: ta
  text: நற்செய்தியைப் பொறுத்தவரை, உங்கள் நிமித்தம் அவர்கள் பகைவர்கள்; ஆனால் தேர்ந்தெடுப்பைப் பொறுத்தவரை, முற்பிதாக்களின் நிமித்தம் அவர்கள் அன்புக்குரியவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முற்பிதாக்கள்” என்பது இஸ்ரவேலின் முற்பிதாக்களை, குறிப்பாக ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோரைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: நற்செய்தியைப் பொறுத்தவரை
  rationale: κατά + வேற்றுமை உருபு இங்கு ஒரு காரியத்தை எந்தக் கோணத்தில் கருதுவது என்பதைக் குறிக்கிறது. μέν...δέ அமைக்கும் முரண்பாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: εὐαγγέλιον
  choice: நற்செய்தி
  rationale: பவுலின் சூழலில் அறிவிக்கப்படும் மீட்புச் செய்தியைக் குறிக்கும் நிலைபெற்ற, தெளிவான தமிழ் சொல்.
- source_word: ἐχθροὶ
  choice: பகைவர்கள்
  rationale: பெயரடையின் பயனிலைத்தன்மையைப் பெயர்ச்சொல் வடிவில் காத்து, உறவுசார் எதிர்நிலையைத் தெளிவாக வெளிப்படுத்துகிறது; ‘வெறுக்கப்பட்டவர்கள்’ என்று மொழிபெயர்த்து தேவனுடைய மனப்பாங்கைத் தேவையின்றி நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: δι’ ὑμᾶς
  choice: உங்கள் நிமித்தம்
  rationale: διά + accusative காரணம் அல்லது ஒருவருக்கான பயன் ஆகிய நிழல்களை உடையது. ‘உங்கள் நிமித்தம்’ இந்த இரு சாத்தியங்களையும் அளவுக்கு மீறித் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: ஆனால் தேர்ந்தெடுத்தலைப் பொறுத்தவரை
  rationale: முந்தைய κατὰ சொற்றொடருக்கு இணையான அமைப்பையும் δέ குறிக்கும் எதிர்மறைத் திருப்பத்தையும் காக்கிறது.
- source_word: ἐκλογὴν
  choice: தேர்ந்தெடுத்தல்
  rationale: தேவனுடைய தெரிவுச் செயலைக் குறிக்கும் ἐκλογή என்பதன் செயற்பொருளை இயல்பான தமிழில் தருகிறது; ‘தேர்வு’ என்பது பொதுவான மனிதத் தீர்மானமாகப் புரியக்கூடியதால் தவிர்க்கப்பட்டது.
- source_word: ἀγαπητοὶ
  choice: அன்புக்குரியவர்கள்
  rationale: அவர்கள் அன்பு செலுத்தப்படுகிறவர்கள் என்ற நிலையைத் தெரிவித்து, ‘பகைவர்கள்’ என்பதுடன் வசனம் வைத்திருக்கும் பதற்றத்தைத் தக்கவைக்கிறது.
- source_word: διὰ τοὺς πατέρας
  choice: முற்பிதாக்களின் நிமித்தம்
  rationale: διά குறிக்கும் காரணம்/அடிப்படையை ‘நிமித்தம்’ தக்கவைக்கிறது. οἱ πατέρες இச்சூழலில் இஸ்ரவேலின் உடன்படிக்கை முற்பிதாக்களைக் குறிக்கிறது.
theological_decisions:
- issue: ‘அவர்கள்’ என்பதன் குறிப்பு
  choice: ரோமர் 9–11 இன் வாதத்தில் இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகச் சுட்டும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: பவுலின் காலத்தில் நம்பாத யூதர்களை மட்டும் குறுக்கமாகச் சுட்டுதல்.
  rationale: கிரேக்க வசனம் குறிப்பை மேலும் குறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அதன் கூட்டுமக்கள் சார்ந்த பரப்பைத் திறந்தே வைக்கிறது.
- issue: ‘பகைவர்கள்’ என்பதன் பொருள்
  choice: நற்செய்தியைப் பொறுத்த உறவுநிலையாக அப்படியே வைக்கப்பட்டது.
  alternative: தேவன் அவர்களை முற்றிலும் வெறுக்கிறார் என்று விளக்குதல் அல்லது அவர்கள் சமூக எதிர்ப்பாளர்கள் மட்டுமே என்று மென்மைப்படுத்துதல்.
  rationale: வசனமே ‘பகைவர்கள்’ என்பதையும் ‘அன்புக்குரியவர்கள்’ என்பதையும் இணையாக வைத்துள்ளது. இரண்டில் ஒன்றையும் தணிக்காமல் பவுலின் இறையியல் பதற்றம் காக்கப்படுகிறது.
- issue: ‘முற்பிதாக்கள்’ என்பதன் பொருள்
  choice: ஆபிரகாம், ஈசாக்கு, யாக்கோபு முதலிய இஸ்ரவேலின் உடன்படிக்கை முன்னோர்களைக் குறிக்கும் சொல்.
  alternative: பொதுவான இன முன்னோர்கள் அனைவரும்.
  rationale: ரோமர் 9–11 சூழலில் இந்தச் சொல் தேவனுடைய வாக்குறுதிகளைப் பெற்ற முற்பிதாக்களை இயல்பாக நினைவூட்டுகிறது; அடிக்குறிப்பு அதனை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. κατὰ μὲν... κατὰ δὲ என்ற இணை-முரண்பாட்டு அமைப்பு ‘...பொறுத்தவரை ...; ஆனால் ...பொறுத்தவரை ...’ எனக் காக்கப்பட்டது. காரணம் மற்றும் பயன் இடையிலான δι’ ὑμᾶς என்பதன் நுண்ணிய தெளிவின்மையை ‘உங்கள் நிமித்தம்’ தக்கவைக்கிறது.
