source:
  edition: SBLGNT
  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: ta
  text: அந்தக் கிளைகளுக்கு எதிராகப் பெருமைபாராட்டாதே.[a] ஆனால், நீ பெருமைபாராட்டினால், வேரைத் தாங்குவது நீ அல்ல; வேர் உன்னைத் தாங்குகிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கிளைகளின்மேல் பெருமைபாராட்டாதே.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வேரைச் சுமப்பது நீ அல்ல; வேர் உன்னைச் சுமக்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: உன்னை உயர்வாக எண்ணிப் பெருமைபாராட்டாதே / பெருமைபாராட்டினாலும்
  rationale: இந்த வினைச்சொல் மற்றவர்களுக்கு மேலாக அல்லது அவர்களுக்கு எதிராகப் பெருமைபாராட்டும் பொருளைக் கொண்டது. முதல் இடத்தில் ஒப்பீட்டு மேன்மை உணர்வை இயல்பான தமிழில் வெளிப்படுத்த விரிவாக்கப்பட்டுள்ளது; இரண்டாம் இடத்தில் நிபந்தனை அமைப்பு காக்கப்பட்டுள்ளது.
- source_word: τῶν κλάδων
  choice: அந்தக் கிளைகளைவிட
  rationale: குறிப்பிட்ட கிளைகளைக் குறிக்கும் சுட்டுத்தன்மையை ‘அந்த’ காக்கிறது; κατακαυχάομαι உடனான தொடர்பை ‘-விட’ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ῥίζαν / ῥίζα
  choice: வேர் / வேரே
  rationale: ஒலிவமர உருவகத்தை இரு இடங்களிலும் ஒரே சொல்லால் காக்கிறது; இரண்டாம் இடத்திலுள்ள எதிர்மறை ஒப்பீட்டு வலியுறுத்தலை ‘வேரே’ வெளிப்படுத்துகிறது.
- source_word: βαστάζεις
  choice: தாங்குவது / தாங்குகிறது
  rationale: உருவகத்தில் சுமத்தல், ஆதரித்தல், நிலைநிறுத்தல் ஆகிய பொருள் பரப்பை ‘தாங்கு’ இயல்பாகக் காக்கிறது; வெறும் கருத்துரையான ‘ஆதரித்தல்’ என்பதைவிட மர உருவகத்துக்கும் நெருக்கமாக உள்ளது.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: வேரைத் தாங்குவது நீ அல்ல; வேரே உன்னைத் தாங்குகிறது
  rationale: ‘நீ’ மற்றும் ‘வேர்’ இடையிலான வலுவான எதிர்மறை ஒப்பீட்டையும் சார்பு நிலையின் தலைகீழ் மாற்றத்தையும் தமிழ் வாக்கிய அமைப்பில் தெளிவாகக் காக்கிறது.
- source_word: μὴ
  choice: பெருமைபாராட்டாதே
  rationale: நிகழ்கால கட்டளையுடன் வரும் நேரடி தடையை இயல்பான ஒருமைத் தமிழ் கட்டளை வடிவில் தருகிறது; செயல் ஏற்கெனவே தொடர்கிறது என்று தேவையின்றி முடிவுசெய்யவில்லை.
theological_decisions:
- issue: பவுலின் ஒலிவமர உருவகத்தில் வேர் மற்றும் கிளைகளின் அடையாளம்
  choice: வேர், கிளைகள் என்ற உருவகங்களை விளக்கமின்றி அப்படியே வைத்தல்
  alternative: வேரை முற்பிதாக்கள், ஆபிரகாம் அல்லது உடன்படிக்கை வாக்குத்தத்தங்கள் என்று மொழிபெயர்ப்பிலேயே அடையாளப்படுத்துதல்
  rationale: கிரேக்க உரை உருவகத்தை மட்டும் கூறுகிறது; வேரின் குறிப்பிட்ட அடையாளத்தை வெளிப்படையாக நிர்ணயிக்கவில்லை. அதை மொழிபெயர்ப்பில் சேர்ப்பது உரையின் இறையியல் திறந்தநிலையைச் சுருக்கி, விளக்கவுரையை உரைக்குள் கொண்டுவரும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் நேரடியான எச்சரிக்கைத் தொனியும் காக்கப்பட்டுள்ளன. ஒருமை இரண்டாம் நபர் கட்டளை கிரேக்க உரையுடன் ஒத்திருக்கிறது. ‘தாங்கு’ என்ற சொல் மர உருவகத்தையும் வாழ்வூட்டும் ஆதரவையும் ஒருசேர உணர்த்துகிறது.
