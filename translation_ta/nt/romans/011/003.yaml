source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: ta
  text: “ஆண்டவரே, அவர்கள் உம்முடைய தீர்க்கதரிசிகளைக் கொன்றார்கள்; உம்முடைய பலிபீடங்களை இடித்துத் தள்ளினார்கள்; நான் ஒருவன் மட்டுமே மீதியாக விடப்பட்டேன்; அவர்கள் என் உயிரைத் தேடுகிறார்கள்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: கடவுளை நேரடியாக அழைக்கும் κύριος என்பதன் விளிவடிவத்தை, நவீனத் தமிழில் இயல்பாகவும் மரியாதையுடனும் வழங்குகிறது.
- source_word: ἀπέκτειναν
  choice: கொன்றார்கள்
  rationale: வினையின் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது; ‘கொலைசெய்தார்கள்’ என்பதில் வெளிப்படையாகக் கூடும் சட்ட அல்லது அறநெறிச் சாயலைத் தவிர்க்கிறது.
- source_word: θυσιαστήριά
  choice: பலிபீடங்களை
  rationale: பலியிடுவதற்கான பீடங்களைக் குறிக்கும் சொல்லின் வழக்கமான, தெளிவான தமிழ் இணை.
- source_word: κατέσκαψαν
  choice: இடித்துத் தள்ளினார்கள்
  rationale: தோண்டித் தரைமட்டமாக்குதல் அல்லது முற்றிலும் இடித்தல் என்ற வலுவான செயலை, பலிபீடங்களின் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: நான் ஒருவன் மட்டுமே எஞ்சியிருக்கிறேன்
  rationale: ‘நானும்’ என்று இயந்திரமாக மொழிபெயர்ப்பதைவிட, எலியா தாம் மட்டுமே எஞ்சியிருப்பதாகக் கூறும் எண்ணிக்கை சார்ந்த தனித்தன்மையைத் தெளிவாகக் காக்கிறது; கிரேக்க இறந்தகால வடிவம் மேற்கோள் சூழலில் நிகழ்நிலை விளைவாக இயல்பாக்கப்பட்டுள்ளது.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: என் உயிரையும் பறிக்கத் தேடுகிறார்கள்
  rationale: இங்கு ψυχή என்பது உடலிலிருந்து வேறான ‘ஆத்துமா’ அல்ல, உயிரைக் குறிக்கிறது. உயிரைப் பறிக்கும் நோக்கத்தைத் தமிழ் மரபுத்தொடரில் தெளிவாகத் தருகிறது; ‘தேடுகிறார்கள்’ என்பது மூலத்தின் நிகழ்காலச் செயலைக் காக்கிறது.
theological_decisions:
- issue: அச்சுறுத்தல் மரபுத்தொடரில் ψυχή என்பதன் பொருள்
  choice: என் உயிரையும் பறிக்கத் தேடுகிறார்கள்
  alternative: என் ஆத்துமாவைத் தேடுகிறார்கள்
  rationale: இச்சூழலில் எலியாவின் உயிரைக் கொல்ல முயல்வதே பொருள்; மனித இயல்பைப் பற்றிய தனிப்பட்ட இறையியல் கருத்தை இங்கு புகுத்தாமல் மூலத்தின் நோக்கத்தை அளிக்கிறது.
translation_notes:
  register: மரியாதையான நவீனத் தரத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் ‘உம்முடைய’ எனும் உயர்திணை மரியாதை வடிவம் வைக்கப்பட்டுள்ளது. வசனம் முந்தைய தொடரின் மேற்கோளாக இருப்பதால் இறுதியில் ‘என்று சொல்லியிருக்கிறார்’ சேர்க்கப்பட்டுள்ளது.
