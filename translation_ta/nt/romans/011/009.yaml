source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: ta
  text: 'தாவீதும் சொல்கிறார்: “அவர்களுடைய மேசை அவர்களுக்குக் கண்ணியாகவும், வேட்டைப் பொறியாகவும்,[a] இடறலுக்குக் காரணமாகவும், கைம்மாறாகவும்[b] ஆகட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கண்ணியும் பொறியும்” என்றும் மொழிபெயர்க்கலாம்; இவ்விரு சொற்களும் பிடிபடச் செய்யும் சாதனங்களைக் குறிக்கும் நெருங்கிய பொருளுடைய சொற்கள்.
    reason: lexical_alternative
  - marker: b
    text: “பதில்செலுத்தல்,” “தண்டனையான கைம்மாறு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: தாவீது
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர்வடிவம்.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: மேற்கோளை அறிமுகப்படுத்தும் கிரேக்க இலக்கிய நிகழ்காலத்தை இயல்பான தமிழ் நிகழ்காலமாகத் தக்கவைக்கிறது.
- source_word: Γενηθήτω
  choice: ஆகட்டும்
  rationale: கிரேக்க கட்டளை வடிவத்தின் வேண்டுதல்/தீர்ப்புரைக்கும் வலிமையை முன்னறிவிப்பாக மென்மைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: τράπεζα
  choice: பந்தி
  rationale: உணவு மற்றும் விருந்தின் சூழலை உணர்த்தும் concrete image-ஐ இயல்பான தமிழில் காக்கிறது; வெறும் பொருளாகிய மேசை என்ற குறுகிய புரிதலைத் தவிர்க்கிறது.
- source_word: παγίδα
  choice: கண்ணி
  rationale: பிடிப்பதற்காக மறைத்து வைக்கப்படும் கண்ணி என்ற உருவகத்தைத் தெளிவாகத் தருகிறது.
- source_word: θήραν
  choice: பொறி
  rationale: παγίδα என்பதிலிருந்து ஓரளவு வேறுபட்டாலும் அதனுடன் இணைந்துள்ள பிடிப்புச் சாதன உருவகத்தைத் தக்கவைக்கிறது.
- source_word: σκάνδαλον
  choice: இடறலுக்குக் காரணம்
  rationale: விழ்ச்சியை உண்டாக்கும் தடையின் உருவகப் பொருளை நவீன வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: ἀνταπόδομα
  choice: தக்க கைம்மாறு
  rationale: செயலுக்கேற்ற பதிலளிப்பு அல்லது பலன் என்ற பொருளைத் தருகிறது; சூழலிலுள்ள தண்டனைத் தன்மையை உணர்த்தினாலும் அளவுக்கு மீறி விளக்குவதில்லை.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: கைம்மாறு அவர்களை நோக்கி வருவதைச் சுட்டும் தத்திவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சங்கீதம் 69:22-இலிருந்து வரும் தீர்ப்பை வேண்டுகிற மேற்கோள்
  choice: “ஆகட்டும்” என்று நேரடியான வேண்டுதல்/கட்டளை வலிமையைத் தக்கவைத்தல்
  alternative: “ஆகும்” அல்லது “ஆகலாம்”
  rationale: Γενηθήτω என்பது வெறும் எதிர்கால முன்னறிவிப்பு அல்ல; தீர்ப்பை வேண்டுகிற கட்டளை வடிவம். அதன் கடுமையை மென்மைப்படுத்தாமல் காக்க வேண்டும்.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ். மேற்கோளின் கவித்துவ இணைப்புகளையும் தீவிரமான தீர்ப்புரைத் தொனியையும் காக்கிறது. “பந்தி” என்பது உணவு வைக்கப்படும் மேசையையும் விருந்தையும் இயல்பாகச் சுட்டுகிறது; “கண்ணி/பொறி” என்ற இணைச்சொற்கள் மூலத்தின் நெருங்கிய இணைப்பைத் தக்கவைக்கின்றன.
