source:
  edition: SBLGNT
  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: ta
  text: அவர்கள் பார்க்காதபடி அவர்களுடைய கண்கள் இருளடையட்டும்[a]; அவர்களுடைய முதுகைத் தொடர்ந்து[b] வளைப்பீராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வையிழக்கட்டும்.” கிரேக்கத்தில் சொல்லுக்குச் சொல் “இருளடையட்டும்” என்று உள்ளது; இதனால் மூல மேற்கோளின் இருள் உருவகம் பாதுகாக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எப்போதும்.” இச்சொற்றொடர் தொடர்ச்சியான அல்லது நிலையான கால அளவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: இருளடையட்டும்
  rationale: மூன்றாம் நபர் பன்மைச் செயல்படுபொருள் குன்றிய கட்டளை/வேண்டுதல் வினையின் வலிமையையும், மூலத்திலுள்ள இருள் உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது; ‘பார்வையிழக்கட்டும்’ என்பது சாத்தியமானதாயினும் அதிக விளக்கமானது.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: அவர்களுடைய கண்கள்
  rationale: உடல் உறுப்பை மையமாகக் கொண்ட உருவகத்தை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: τοῦ μὴ βλέπειν
  choice: அவர்கள் பார்க்காதபடி
  rationale: μή உடன் வரும் பெயராக்கப்பட்ட வினையெச்சத்தின் நோக்கம்/விளைவு சார்ந்த தெளிவின்மையைத் தீர்மானிக்காமல், இரு நிழற்பொருள்களுக்கும் இடமளிக்கிறது.
- source_word: τὸν νῶτον αὐτῶν
  choice: அவர்களுடைய முதுகை
  rationale: கிரேக்க ஒருமையைப் பாதுகாத்து, பலருக்குப் பகிர்ந்தளிக்கப்படும் உடல் உருவகத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διὰ παντός
  choice: எப்போதும்
  rationale: தொடர்ந்த அல்லது நிலையான கால அளவைக் குறிக்கிறது; ‘என்றென்றும்’ என மொழிபெயர்த்து மூலத்தில் அவசியமில்லாத முடிவற்ற காலப் பொருளைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: σύγκαμψον
  choice: குனியச் செய்வீராக
  rationale: கடவுளை நோக்கிய ஒருமைச் செயப்பாட்டு கட்டளையின் வலிமையையும், முதுகு வளைந்து குனியும் உடல் உருவகத்தையும் கண்ணியமான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: சாப வேண்டுதலாக வரும் மேற்கோளும் இறைச் செயலாண்மையும்
  choice: ‘கண்கள் இருளடையட்டும் ... முதுகை ... குனியச் செய்வீராக’ என்று வேண்டுதல்/கட்டளை வலிமையைத் தக்கவைத்தல்
  alternative: இதை ‘அவர்களுடைய கண்கள் இருளடையும்’ என்ற வெறும் முன்னறிவிப்பாகவோ, இறை முகவரியை மறைக்கும் செயல்படுபொருள் குன்றிய விளைவாகவோ மொழிபெயர்த்தல்
  rationale: மேற்கோளின் கடுமையான நியாயத்தீர்ப்பு வேண்டுதலை மூல உரை வெளிப்படுத்தும் வடிவிலேயே வைத்திருக்கிறது; அதை மென்மையாக்கவோ, கூடுதல் இறையியல் விளக்கம் சேர்க்கவோ இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. முதல் வினையில் மூன்றாம் நபர் வேண்டுதல் வடிவமும், இரண்டாம் வினையில் கடவுளை நோக்கிய மரியாதை ஒருமைக் கட்டளை வடிவமும் கிரேக்க இலக்கண வேறுபாட்டுக்கு ஏற்ப பாதுகாக்கப்பட்டுள்ளன.
