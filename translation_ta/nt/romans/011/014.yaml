  text: εἴ πως παραζηλώσω μου τὴν σάρκα καὶ σώσω τινὰς ἐξ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/014.yaml
  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: ta
  text: எப்படியாவது என் சொந்த இனத்தாரைப்[a] பொறாமைகொள்ளத் தூண்டி, அவர்களில் சிலரை இரட்சிப்பேனோ என்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, பவுலின் சக யூதர்கள்; கிரேக்கத்தில் நேரடியாக, “என் மாம்சம்.”
    reason: மூலத்தின் உறவுமுறை உருவகத்தையும் அதன் சூழல்சார்ந்த பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: εἴ πως
  choice: எப்படியாவது ... காப்பாற்றுவேனோ என்று
  rationale: பவுலின் உறுதியான முடிவை அல்ல, அவர் கொண்டிருக்கும் ஏக்கமும் உறுதியற்ற எதிர்பார்ப்பும் வெளிப்படும்படி இந்தத் தொடர் அமைக்கப்பட்டுள்ளது.
- source_word: παραζηλώσω
  choice: பொறாமைகொள்ளத் தூண்டி
  rationale: புறவினத்தார் சேர்க்கப்பட்டதன் மூலம் இஸ்ரவேலரிடையே பொறாமையை எழுப்புதல் என்ற சூழல்சார்ந்த பொருளையும் வினையின் வலிமையையும் காக்கிறது.
- source_word: μου τὴν σάρκα
  choice: என் சொந்த இனத்தாரை
  rationale: இங்கு σάρξ பாவ இயல்பைக் குறிக்காமல் பவுலின் இயற்கையான இன உறவினர்களாகிய சக யூதர்களைக் குறிக்கிறது. தமிழில் இயல்பாகப் புரியும்படி பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடிச் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: σώσω
  choice: காப்பாற்றுவேனோ
  rationale: பவுலின் பயன்பாட்டிலுள்ள இரட்சிப்புச் சார்ந்த பொருளைத் தெளிவாகவும் சாதாரண வாசகருக்குப் புரியும் நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: τινὰς ἐξ αὐτῶν
  choice: அவர்களில் சிலரை
  rationale: முன்பு குறிப்பிடப்பட்ட குழுவிலிருந்து ஒரு பகுதியினரைச் சுட்டும் கிரேக்கத் தொடரை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
theological_decisions:
- issue: பவுலின் இன உறவைக் குறிக்கும் σάρξ என்பதன் பொருள்
  choice: முதன்மை உரையில் “என் சொந்த இனத்தார்”; அடிக்குறிப்பில் “என் மாம்சம்” என்ற நேரடிப் பொருள்
  alternative: முதன்மை உரையிலேயே “என் சொந்த மாம்சம்”
  rationale: இங்கு அந்தச் சொல் பாவ இயல்பை அல்ல, பவுலின் இனத்தாரான சக யூதர்களைக் குறிக்கிறது. “என் சொந்த மாம்சம்” என்பது தமிழில் இயல்பற்றதோடு நோக்கப்பட்ட பொருளையும் மறைக்கக்கூடும்; அடிக்குறிப்பு மூல உருவகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், கண்ணியமானதும் பொதுவாசகருக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்துடன் தொடரும் கிரேக்க நிபந்தனைத் துணைவாக்கியத்தின் தன்மை “... காப்பாற்றுவேனோ என்று” என்பதால் காக்கப்பட்டுள்ளது.
