id: ROM.12.4
reference: Romans 12:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: ta
  text: ஏனெனில், ஒரே உடலில் நமக்குப் பல உறுப்புகள்[a] இருப்பதுபோல, எல்லா உறுப்புகளுக்கும் ஒரே செயல்பாடு[b] இருப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பல பாகங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒரே செயல்.’ கிரேக்கச் சொல் செயல் அல்லது செயல்பாடு என்பதைக் குறிக்கலாம்; உடல் உருவகத்திற்கும் வெவ்வேறு பணிகள் பற்றிய சூழலுக்கும் ‘செயல்பாடு’ பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: ஏனெனில், ... இருப்பதுபோல
  rationale: γὰρ முந்தைய அறிவுரையுடன் உள்ள விளக்கத் தொடர்பை ‘ஏனெனில்’ என்று காக்கிறது; καθάπερ அடுத்த வசனத்தில் நிறைவுபெறும் ஒப்புமையை இயல்பான தமிழில் ‘இருப்பதுபோல’ என அறிமுகப்படுத்துகிறது.
- source_word: ἐν ἑνὶ σώματι
  choice: ஒரே உடலில்
  rationale: இடப்பொருளையும் உடல் உருவகத்தின் ஒருமையையும் நேரடியாகக் காக்கிறது; இவ்வசனத்திலேயே திருச்சபை என்ற விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: πολλὰ μέλη
  choice: பல உறுப்புகள்
  rationale: μέλη என்பதன் உடற்கூறு உருவகத்தையும் பலர் சேர்ந்த அமைப்பைக் குறிக்கும் விரிவான பயன்பாட்டையும் ‘உறுப்புகள்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἔχομεν
  choice: நமக்கு ... இருக்கின்றன
  rationale: கிரேக்கத்தின் எளிய நிகழ்காலப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: எல்லா உறுப்புகளுக்கும் ... இருப்பதில்லை
  rationale: மறுப்பு ஒவ்வொரு உறுப்பையும் தனித்தனியாக மறுப்பதல்ல; அனைத்தும் ஒரே செயல்பாட்டைக் கொண்டவை அல்ல என்பதே அதன் வரம்பு. தமிழ் அமைப்பு இதைத் தெளிவாகக் காக்கிறது.
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: ஒரே செயல்பாடு இருப்பதில்லை
  rationale: πρᾶξις ‘செயல்’ அல்லது ‘செயல்பாடு’ எனப் பொருள்படலாம்; உடல் உருவகத்திலும் வெவ்வேறு பணிகள் குறித்த சூழலிலும் ‘செயல்பாடு’ பொருத்தமாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: உடல் உருவகத்தின் திருச்சபை சார்ந்த பொருள்
  choice: ‘ஒரே உடல்’, ‘பல உறுப்புகள்’ என்ற உருவகத்தை அப்படியே வழங்கி, இவ்வசனத்தில் ‘திருச்சபை’ என்பதை வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘திருச்சபை என்னும் ஒரே உடல்’ என்று விளக்கிப் பெயர்த்தல்.
  rationale: அடுத்த வசனத்தில் உருவகத்தின் குறிப்பு தெளிவாகிறது; இவ்வசனம் ஒப்புமையை மட்டுமே முன்வைக்கிறது. ஆகவே மூலத்தின் கருத்து முன்னேற்றமும் இறையியல் நெருக்கடியும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். நீண்ட கிரேக்க வாக்கிய அமைப்பை இயல்பான தமிழாக்கமாக மாற்றினாலும், விளக்கத் தொடர்பு, ஒப்புமை, மறுப்பின் வரம்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
