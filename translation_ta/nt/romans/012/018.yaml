  revision_rationale: 'The revision distinguishes the two Greek qualifications: εἰ δυνατόν is rendered as an impersonal possibility condition (“அது சாத்தியமானால்”), and τὸ ἐξ ὑμῶν as the limit of what the readers can do (“உங்களால் இயன்றவரை”). It retains the inclusive scope and continuing exhortation of the source.'
