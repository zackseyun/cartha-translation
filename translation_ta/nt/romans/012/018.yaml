  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: ta
  text: அது சாத்தியமானால்[a], உங்களால் இயன்றவரை, எல்லாரோடும் சமாதானமாக வாழுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது இயலுமானால், உங்கள் பங்கிற்கு, எல்லாரோடும் சமாதானமாக இருங்கள்.”
    reason: εἰ δυνατόν, τὸ ἐξ ὑμῶν, மற்றும் εἰρηνεύοντες ஆகியவற்றுக்கான மேலும் நேரடியான மாற்று மொழிபெயர்ப்பை வழங்குகிறது.
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: முடிந்தால்
  rationale: இந்த நிபந்தனைத் தொடர் கட்டளையை முற்றிலும் நிபந்தனையற்றதாக ஆக்காமல், சமாதானம் நடைமுறையில் சாத்தியமாயிருப்பதைப் பொறுத்தது என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τὸ ἐξ ὑμῶν
  choice: உங்களைப் பொறுத்தவரையில்
  rationale: சமாதானத்தை ஏற்படுத்துவதில் வாசகர்களின் பொறுப்புக்கும் அவர்களால் செய்யக்கூடியவற்றுக்கும் உள்ள எல்லையை இந்தத் தமிழ் மரபுத்தொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: எல்லாரோடும்
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் குறிக்காமல் மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கிறது; ‘எல்லாரோடும்’ என்பது அந்த விரிவான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: εἰρηνεύοντες
  choice: சமாதானமாக வாழுங்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினை சூழலில் அறிவுறுத்தலாகச் செயல்பட்டு, தொடர்ந்து கடைப்பிடிக்க வேண்டிய வாழ்க்கை முறையைச் சுட்டுகிறது; ‘வாழுங்கள்’ அந்த நீடித்த அம்சத்தைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: சமாதானத்திற்கான அறிவுறுத்தலின் பரப்பும் வரம்பும்
  choice: எல்லாரோடும் சமாதானமாக வாழும்படி அறிவுறுத்தப்படுகிறது; அதேவேளையில், அது சாத்தியமாயிருப்பதும் வாசகர்களின் பங்கில் செய்யக்கூடியதும் என்ற இரு வரம்புகளும் காக்கப்படுகின்றன.
  alternative: விசுவாசிகள் சரியாக நடந்துகொண்டால் சமாதானம் எப்போதும் ஏற்பட்டே ஆகும் என்ற நிபந்தனையற்ற கட்டளையாகப் புரிந்துகொள்வது.
  rationale: εἰ δυνατόν மற்றும் τὸ ἐξ ὑμῶν ஆகிய இரு தொடர்களும் சமாதானத்தை நாட வேண்டிய உலகளாவிய பொறுப்பை மறுக்காமல், அதன் விளைவு ஒருவரின் கட்டுப்பாட்டில் மட்டும் இல்லை என்ற பதற்றத்தைப் பாதுகாக்கின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. ‘சமாதானமாக வாழுங்கள்’ என்பது தொடர்ச்சியான வாழ்க்கை முறையை உணர்த்துகிறது; ‘எல்லாரோடும்’ என்பது பாலின வேறுபாடின்றி அனைத்து மனிதர்களையும் உள்ளடக்குகிறது.
