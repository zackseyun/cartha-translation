review_pass:
  verdict: revise
  source_fidelity: The three coordinated Greek exhortations are retained. ‘முயற்சியில் சோம்பல் கொள்ளாதீர்கள்’ conveys the contrast between σπουδῇ (diligence/earnest effort) and ὀκνηροί (lazy/sluggish) more idiomatically than the draft. ‘ஆவியில் தீவிரமாயிருங்கள்’ appropriately renders the metaphorical ζέοντες without deciding whether πνεύματι refers to the human spirit or the Holy Spirit. ‘ஆண்டவருக்குச் சேவை செய்யுங்கள்’ accurately communicates δουλεύοντες in a natural exhortational register.
  naturalness: The draft is understandable, but ‘முயற்சியில் சோம்பலாயிராதீர்கள்’ is somewhat awkward Tamil, and ‘அனல் கொண்டவர்களாயிருங்கள்’ is less natural in this ethical instruction. The revised wording is modern, concise, and preserves the parallel rhythm.
  terminology: ‘ஆவி’ rightly preserves the ambiguity of πνεύματι; the footnote retains the alternative Holy-Spirit reading. ‘ஆண்டவர்’ is an appropriate established rendering for κύριος, and ‘சேவை செய்யுங்கள்’ is a clear idiomatic rendering of δουλεύοντες without unnecessarily foregrounding the slavery metaphor.
  issues:
  - severity: low
    issue: Awkward expression for the first exhortation
    rationale: ‘முயற்சியில் சோம்பலாயிராதீர்கள்’ is intelligible but less idiomatic than ‘முயற்சியில் சோம்பல் கொள்ளாதீர்கள்.’ The revision keeps the source’s contrast intact.
  - severity: low
    issue: Less natural rendering of ζέοντες
    rationale: ‘அனல் கொண்டவர்களாயிருங்கள்’ conveys ardor but is stylistically cumbersome. ‘ஆவியில் தீவிரமாயிருங்கள்’ naturally expresses the metaphorical fervor intended by ζέοντες while retaining the ambiguity of ‘ஆவி.’
  - severity: low
    issue: Service verb can be more direct
    rationale: ‘ஆண்டவருக்குப் பணியாற்றுங்கள்’ is possible, but ‘ஆண்டவருக்குச் சேவை செய்யுங்கள்’ more directly communicates devoted service to the Lord in contemporary Tamil.
  revised_text: முயற்சியில் சோம்பல் கொள்ளாதீர்கள்; ஆவியில் தீவிரமாயிருங்கள்[a]; ஆண்டவருக்குச் சேவை செய்யுங்கள்.
