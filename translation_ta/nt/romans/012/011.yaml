  text: τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: ta
  text: முயற்சியில் சோம்பல் கொள்ளாதீர்கள்; ஆவியில் தீவிரமாயிருங்கள்[a]; ஆண்டவருக்குச் சேவை செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘ஆவி’ என்பது ஒருவருடைய ஆவியைக் குறிக்கலாம்; அல்லது பரிசுத்த ஆவியைக் குறிக்கலாம்.
    reason: மூலக் கிரேக்கத்தில் πνεύματι என்பதன் குறிப்பு வெளிப்படையாகத் தீர்மானிக்கப்படாததால் மாற்று வாசிப்பைப் பாதுகாத்தல்.
lexical_decisions:
- source_word: σπουδῇ
  choice: முயற்சியில்
  rationale: σπουδή என்பதன் ஊக்கம், அக்கறை, விடாமுயற்சி ஆகிய பொருள்களில், ὀκνηροί என்பதற்கு எதிராக நிற்கும் நடைமுறை சார்ந்த கருத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὀκνηροί
  choice: சோம்பலாயிராதீர்கள்
  rationale: தயக்கம் அல்லது மந்தம் என்ற நிழற்பொருளையும் உள்ளடக்கக்கூடிய இச்சொல், இங்கு σπουδή உடன் வரும் நேர்மாறான இணைப்பில் செயலில் சோம்பியிருப்பதைக் குறிக்கிறது.
- source_word: πνεύματι
  choice: ஆவியில்
  rationale: கிரேக்கத்தில் இது ஒருவரின் ஆவியையோ பரிசுத்த ஆவியையோ குறிக்கக்கூடிய தெளிவுபடுத்தப்படாத வடிவில் உள்ளது. ‘ஆவியில்’ என்பது அந்த உண்மையான இருபொருள் வாய்ப்பையும் தமிழில் காக்கிறது.
- source_word: ζέοντες
  choice: அனல் கொண்டவர்களாயிருங்கள்
  rationale: சொல்லுக்குச் சொல் ‘கொதித்தல்’ என்ற உருவகத்தை, உள்ளார்ந்த தீவிரத்தையும் ஊக்கத்தையும் உணர்த்தும் இயல்பான தமிழில் காக்கிறது.
- source_word: κυρίῳ
  choice: ஆண்டவருக்கு
  rationale: பவுலின் சூழலில் இது பெரும்பாலும் ஆண்டவராகிய இயேசுவைக் குறித்தாலும், மூலத்தின் பட்டத்தை மேலதிக விளக்கமின்றி அப்படியே காக்கிறது.
- source_word: δουλεύοντες
  choice: பணியாற்றுங்கள்
  rationale: δουλεύω அடிமையாகப் பணிசெய்தல் என்ற வலுவான பின்னணியைக் கொண்டிருந்தாலும், இக்கட்டளைச் சூழலில் ஆண்டவருக்கு அர்ப்பணிப்புடனும் கீழ்ப்படிதலுடனும் சேவை செய்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: τῷ πνεύματι ζέοντες என்பதில் πνεύματι எதைக் குறிக்கிறது?
  choice: மனித ஆவி அல்லது உள்ளார்ந்த நிலை என்பதைக் முதன்மை வாசிப்பாகக் கொள்ளுதல்; ஆனால் மொழிபெயர்ப்பில் தெளிவுபடுத்தாமல் விடுதல்
  alternative: பரிசுத்த ஆவி
  rationale: கிரேக்கச் சொல்லில் மனித ஆவியா பரிசுத்த ஆவியா என்பது வெளிப்படையாகக் குறிக்கப்படவில்லை. சூழலின் அறநெறி அறிவுரைகளோடு மனித ஆவி என்ற வாசிப்பு நன்றாகப் பொருந்தினாலும், இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் ‘ஆவியில்’ என்று மொழிபெயர்த்து மாற்று வாய்ப்பை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூன்று இணையான அறிவுரைகளின் ஓட்டம் அரைப்புள்ளிகளால் காக்கப்பட்டுள்ளது; கடினமான திருச்சபைச் சொற்களைத் தவிர்த்து சாதாரண வாசகர்களுக்கும் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
