revisions:
- from: முயற்சியில் சோம்பலாயிராதீர்கள்; ஆவியில் அனல் கொண்டவர்களாயிருங்கள்[a]; ஆண்டவருக்குப் பணியாற்றுங்கள்.
  to: முயற்சியில் சோம்பல் கொள்ளாதீர்கள்; ஆவியில் தீவிரமாயிருங்கள்[a]; ஆண்டவருக்குச் சேவை செய்யுங்கள்.
  rationale: The revision improves idiomatic modern Tamil while maintaining the source’s threefold participial exhortation, its diligence-versus-laziness contrast, and the unresolved referent of πνεύματι. The footnote remains anchored to ‘ஆவியில்’ and does not impose a theological resolution.
