base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: ta
  text: அன்பு பாசாங்கில்லாததாக இருக்கட்டும்.[a] தீமையை அருவருங்கள்; நன்மையைப் பற்றிக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அன்பு உண்மையானதாக இருக்கட்டும்.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “அன்பு பாசாங்கில்லாதது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான இயல்பான, பரந்த நெறிசார் பொருளை நவீனத் தமிழில் தெளிவாகக் கொடுக்கிறது.
- source_word: ἀνυπόκριτος
  choice: பாசாங்கில்லாததாக
  rationale: நடிப்போ போலித்தனமோ இல்லாத தன்மையை நேரடியாகப் பாதுகாக்கிறது; வெறும் ‘உண்மையான’ என்பதைவிட மூலச்சொல்லின் எதிர்மறை வடிவத்துக்கு நெருக்கமானது.
- source_word: ἀποστυγοῦντες
  choice: வெறுத்து ஒதுக்குங்கள்
  rationale: இந்த வினைச்சொல் குறிக்கும் கடுமையான அருவருப்பையும் விலகுதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. அறிவுரைத் தொடரின் சூழலால் ஏவல் வலிமையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὸ πονηρόν
  choice: தீமையை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலைப் பெயரடை குறிக்கும் பரந்த நெறிசார் தீமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: κολλώμενοι
  choice: உறுதியாகப் பற்றிக்கொள்ளுங்கள்
  rationale: நெருக்கமாக ஒட்டியிருத்தல் அல்லது விடாமல் பற்றியிருத்தல் என்ற வலுவான பொருளைத் தருகிறது; தமிழில் ஏவலாக இயல்பாக உள்ளது.
- source_word: τῷ ἀγαθῷ
  choice: நன்மையை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலைப் பெயரடை குறிக்கும் பரந்த நெறிசார் நன்மையைத் தெளிவாகத் தருகிறது; ‘தீமையை’ என்பதோடு இணையான அமைப்பையும் பேணுகிறது.
theological_decisions:
- issue: வினையில்லா தொடர் மற்றும் பங்கேற்பு வினைகளின் அறிவுரை வலிமை
  choice: ‘அன்பு ... இருக்கட்டும்; ... ஒதுக்குங்கள்; ... பற்றிக்கொள்ளுங்கள்’ என்ற தொடர் அறிவுரைகளாக வழங்குதல்
  alternative: ‘பாசாங்கில்லாத அன்பு, தீமையை வெறுத்து, நன்மையைப் பற்றிக்கொண்டு’ என்ற துண்டுத்தொடர் வடிவம்
  rationale: கிரேக்கத்தில் முதல் தொடர் வினையில்லாமலும் அடுத்தவை பங்கேற்பு வினைகளாகவும் இருந்தாலும், ரோமர் 12-இன் சூழல் தொடர்ச்சியான அறிவுரைகளைக் கொண்டது. ஏவல் வலிமையை வெளிப்படுத்துவது ஆசிரியரின் நோக்கத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது; அதேவேளை இலக்கண வடிவம் குறித்த தகவல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுரை நடையில் அமைக்கப்பட்டுள்ளது. ‘பாசாங்கில்லாததாக’ மூலத்தின் தெளிவான நெறிசார் எதிர்மறையைப் பேணுகிறது; ‘வெறுத்து ஒதுக்குங்கள்’ மற்றும் ‘உறுதியாகப் பற்றிக்கொள்ளுங்கள்’ ஆகியவை இரு பங்கேற்பு வினைகளின் வலிமையான எதிரெதிர் இயக்கத்தை இயல்பாக வெளிப்படுத்துகின்றன.
