source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: ta
  text: ஆனால், உன் பகைவன் பசியாயிருந்தால், அவனுக்கு உணவளி; அவன் தாகமாயிருந்தால், அவனுக்குக் குடிக்கக் கொடு. ஏனெனில், இப்படிச் செய்வதன் மூலம் அவனுடைய தலையின்மேல் எரியும் தணல்களைக் குவிப்பாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, ‘நெருப்பின் தணல்கள்.’ இந்த உருவகம் மனந்திரும்புதலுக்கு வழிநடத்தும் வெட்கத்தையோ, வேதனை தரும் மனச்சாட்சி உறுத்தலையோ, வரவிருக்கும் தீர்ப்பையோ குறிக்கலாம்; அதன் பொருள் முதன்மை உரையில் தீர்மானிக்கப்படவில்லை.
    reason: சொற்பொருள் மாற்றும் உருவகத்தின் விளக்கத் தெளிவின்மையும்
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: ஆனால், ... இருந்தால்
  rationale: ἀλλά முந்தைய பழிவாங்காமைக் கட்டளையுடன் உள்ள எதிர்மறைத் தொடர்பைக் குறிக்கிறது; ἐάν நிபந்தனையை அறிமுகப்படுத்துகிறது. இந்தத் தேர்வு இரண்டையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: உன் பகைவன் பசியாயிருந்தால்
  rationale: தனிப்பட்ட ஒருமையைத் தக்கவைத்து, நிகழ்கால நிபந்தனையை இயல்பான தமிழில் வழங்குகிறது.
- source_word: ψώμιζε αὐτόν
  choice: அவனுக்கு உணவளி
  rationale: ψωμίζω உணவு கொடுப்பதைக் குறிப்பாகக் குறிக்கிறது; ஒருமை ஏவல் வடிவமும் சுருக்கமாகத் தக்கவைக்கப்படுகிறது.
- source_word: ἐὰν διψᾷ, πότιζε αὐτόν
  choice: அவன் தாகமாயிருந்தால், அவனுக்குக் குடிக்கக் கொடு
  rationale: ποτίζω என்பது குடிக்க ஏதாவது கொடுப்பதைக் குறிக்கிறது. ‘தண்ணீர் கொடு’ என்பது மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: τοῦτο γὰρ ποιῶν
  choice: ஏனெனில், இப்படிச் செய்வதன் மூலம்
  rationale: γάρ தரும் விளக்கத் தொடர்பையும், பங்கேற்புவினையின் கருவிப்பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἄνθρακας πυρὸς
  choice: எரியும் தணல்கள்
  rationale: சொல்லுக்கு நெருக்கமான ‘நெருப்பின் தணல்கள்’ என்பதைக் காட்டிலும் இயல்பாக இருந்து, தீப்பற்றிய கரித்துண்டுகளின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: அவனுடைய தலையின்மேல் ... குவிப்பாய்
  rationale: எதிர்கால வினையையும், தலையின்மேல் குவிக்கும் உறுதியான உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அவனுடைய தலையின்மேல் எரியும் தணல்களைக் குவிப்பாய்’ என்ற உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் உருவகத்தை விளக்கித் தீர்மானிக்காமல் அப்படியே தக்கவைத்தல்
  alternative: மனந்திரும்பச் செய்யும் வெட்கம், வேதனைமிக்க மனச்சாட்சி உறுத்தல், அல்லது வரவிருக்கும் தெய்வீகத் தீர்ப்பு என்று நேரடியாக விளக்குதல்
  rationale: இந்த உருவகத்தின் துல்லியமான நோக்கம் விவாதத்திற்குரியது. கிரேக்க உரை எந்த ஓர் விளக்கத்தையும் வெளிப்படையாகத் தீர்மானிக்காததால், அதன் இறையியல் பதற்றமும் பலபொருள் வாய்ப்பும் தமிழிலும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், நேரடியான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ஒருமை ‘உன்/அவன்’ வடிவங்களில் தக்கவைக்கப்பட்டுள்ளது; உருவகம் மென்மைப்படுத்தப்படவோ ஓர் இறையியல் விளக்கமாக மாற்றப்படவோ இல்லை.
