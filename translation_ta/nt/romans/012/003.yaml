id: ROM.12.3
reference: Romans 12:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: ta
  text: 'எனக்குக் கொடுக்கப்பட்ட அருளினால், உங்களிடையே உள்ள ஒவ்வொருவருக்கும் நான் சொல்வது இதுதான்: ஒருவர் தன்னைப் பற்றி எண்ணவேண்டியதைவிட உயர்வாக எண்ணாமல், கடவுள் ஒவ்வொருவருக்கும் பகிர்ந்தளித்த விசுவாசத்தின் அளவுக்கு ஏற்பத் தெளிந்த விவேகத்துடன் எண்ண வேண்டும்.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிதானமான மனநிலையை அடையும் வகையில் எண்ண வேண்டும்.”
    reason: lexical_alternative
  - marker: b
    text: “விசுவாசத்தின் அளவு” என்பது “விசுவாசத்தின் ஓர் அளவு,” “விசுவாசம் என்னும் அளவுகோல்,” அல்லது ஒருவேளை “நம்பிக்கை/நம்பகத்தன்மையின் ஓர் அளவு” என்றும் பொருள்படலாம். கடவுள் கொடுத்த இந்த அளவு விசுவாசத்துடன் எவ்வாறு தொடர்புடையது என்பதை கிரேக்கம் துல்லியமாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: எனக்குக் கொடுக்கப்பட்ட அருளின் மூலம்
  rationale: διά + பிறப்புவேற்றுமை இங்கு கருவி அல்லது அடிப்படையைக் குறிக்கிறது; பவுலுக்குக் கொடுக்கப்பட்ட அருள்சார்ந்த பணியதிகாரத்தை விரித்துரைக்காமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: உங்களிடையே உள்ள ஒவ்வொருவருக்கும்
  rationale: παντί என்பதன் ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் வலிமையையும், சமூகத்துக்குள் இருப்பதைக் குறிக்கும் தொடரையும் காக்கிறது.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: ஒருவர் தன்னைப் பற்றி எண்ணவேண்டியதைவிட உயர்வாக எண்ணாமல்
  rationale: ὑπερφρονέω மற்றும் φρονέω ஆகியவற்றின் எண்ணுதல் சார்ந்த சொல்விளையாட்டை முடிந்தவரைத் தக்கவைத்து, முறையற்ற சுயமதிப்பீட்டை வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: தெளிந்த மதிப்பீட்டுடன் எண்ண வேண்டும்
  rationale: σωφρονεῖν என்பதிலுள்ள தெளிவு, நிதானம், கட்டுப்பாடான விவேகம் ஆகிய நுணுக்கங்களை இயல்பான நவீனத் தமிழில் தருகிறது; கிரேக்கத் தொடரின் நோக்கப் பொருளுக்கு மாற்று அடிக்குறிப்பும் வழங்கப்படுகிறது.
- source_word: ἐμέρισεν
  choice: பகிர்ந்தளித்த
  rationale: μερίζω என்பதன் பங்கிட்டு அளித்தல் என்ற விநியோகப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: μέτρον πίστεως
  choice: விசுவாசத்தின் அளவு
  rationale: πίστις என்பதற்கு வழக்கமான 'விசுவாசம்' என்பதைப் பயன்படுத்தி, அளவு என்பது விசுவாசத்தின் பங்கு, தரநிலை, அல்லது அதனுடன் தொடர்புடைய திறன் ஆகியவற்றில் எதைக் குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: μέτρον πίστεως என்பதன் பொருள்
  choice: விசுவாசத்தின் அளவு என்ற பரந்த சொற்றொடரைத் தக்கவைத்தல்
  alternative: விசுவாசிக்கிற திறனின் அளவு; விசுவாசம் என்னும் தரநிலை; நம்பகத்தன்மையின் ஒரு பங்கு
  rationale: அடுத்த வசனங்கள் வெவ்வேறு வரங்களைப் பற்றிப் பேசினாலும், இச்சொற்றொடர் இரட்சிக்கும் விசுவாசத்தையா, ஊழியத் திறனையா, தரநிலையையா என்று தெளிவாகக் குறுக்கவில்லை. ஆகவே இறையியல் பதற்றமும் பொருள் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
- issue: ὡς என்பதன் தொடர்பு
  choice: கடவுள் பகிர்ந்தளித்த விசுவாசத்தின் அளவுக்கு ஏற்ப நிதானமாகச் சிந்தித்தல்
  alternative: ஒவ்வொருவருக்கும் கடவுள் ஒரு விசுவாச அளவை அளித்திருக்கிறார் என்ற தனிப்பட்ட கூற்று
  rationale: ὡς என்பதை 'அளவுக்கு ஏற்ப' எனக் காட்டுவது சுயமதிப்பீட்டுக்கான வரம்போடு தொடரை இணைக்கிறது; இருந்தாலும் μέτρον πίστεως என்பதன் துல்லியமான இயல்பை விளக்கிச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனச் செந்தமிழுக்கும் பொதுப் பேச்சுத் தமிழுக்கும் இடைப்பட்ட, வழிபாட்டு வாசிப்பிற்கேற்ற கண்ணியமான நடை. 'எண்ண' என்ற சொல்லை மீண்டும் பயன்படுத்தி φρονέω குடும்பச் சொற்களின் ஒலிப்பொருள் தொடர்பை ஓரளவு காக்கிறது; கடினமான சொற்சொல் மொழிபெயர்ப்பைத் தவிர்க்க 'தெளிந்த மதிப்பீடு' பயன்படுத்தப்பட்டுள்ளது.
