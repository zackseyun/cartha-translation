  source_fidelity: 'வரைவில் கிரேக்கத்தின் முக்கியக் கூறுகள் நன்றாகக் காக்கப்பட்டுள்ளன: பவுலுக்குக் கொடுக்கப்பட்ட அருள், அனைவருக்குமான அறிவுறுத்தல், அளவுக்கு மீறிய சுயமதிப்பீட்டுக்கான தடை, σωφρονεῖν-இன் நிதானமான/விவேகமான சிந்தனை, மற்றும் கடவுள் ஒவ்வொருவருக்கும் பகிர்ந்தளித்த μέτρον πίστεως. எனினும் அடிக்குறி a, σωφρονεῖν-ஐ விளக்கும் சொற்றொடருக்குப் பதிலாக வசனத்தின் இறுதியில் இடப்பட்டிருப்பதால், அதன் துல்லியமான தொடுப்பிடம் தெளிவாக இல்லை. திருத்தத்தில் அதைச் சரியான சொற்றொடருக்குப் பின் நகர்த்துகிறேன்.'
