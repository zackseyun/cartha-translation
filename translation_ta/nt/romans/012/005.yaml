  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: ta
  text: அதுபோல, பலராகிய நாம் மேசியாவில்[a] ஒரே உடலாக இருக்கிறோம்; தனித்தனியாக, ஒருவருக்கொருவர் உறுப்புகளாக இருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கிறிஸ்துவில்.” Χριστός என்ற கிரேக்கப் பட்டப்பெயரை “மேசியா” என்றும் “கிறிஸ்து” என்றும் வழங்கலாம்; இங்கு அதன் பட்டப்பெயர் பொருளைப் பேண “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: அதுபோல
  rationale: முந்தைய வசனத்திலுள்ள ஒரே உடல்–பல உறுப்புகள் என்ற ஒப்புமையை இவ்வசனத்துடன் இயல்பாக இணைக்கிறது.
- source_word: οἱ πολλοὶ
  choice: பலராகிய நாம்
  rationale: கிரேக்கச் சொற்றொடரின் பன்மையையும், சூழலில் பவுல் தம்மையும் வாசகர்களையும் உள்ளடக்கிப் பேசுவதையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἓν σῶμά
  choice: ஒரே உடல்
  rationale: ஒற்றுமையையும் உடல் உருவகத்தையும் நேரடியாகப் பேணுகிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவில்
  rationale: ἐν என்பதன் உறவுசார் பொருளைப் பேணுவதோடு, Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளையும் மொழிபெயர்க்கிறது.
- source_word: τὸ δὲ καθ’ εἷς
  choice: தனித்தனியாகவோ
  rationale: ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் பகிர்ந்தளிக்கும் நுண்பொருளை இயல்பான தமிழில் தருகிறது; δέ குறிக்கும் மெல்லிய மாறுபாட்டை ‘வோ’ வெளிப்படுத்துகிறது.
- source_word: ἀλλήλων μέλη
  choice: ஒருவருக்கொருவர் உறுப்புகள்
  rationale: விசுவாசிகள் பரஸ்பரம் ஒன்றுக்கொன்று உரியவர்கள் என்ற உறவையும் உடல் உருவகத்தையும் பேணுகிறது.
theological_decisions:
- issue: ἐν Χριστῷ என்பதில் Χριστός-ஐ மொழிபெயர்த்தல்
  choice: மேசியாவில்
  alternative: கிறிஸ்துவில்
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைத் தக்கவைத்துள்ளது. ‘மேசியா’ அந்தப் பட்டத்தின் பொருளை வெளிப்படுத்துகிறது; அதேவேளை ‘கிறிஸ்துவில்’ என்பது பரவலாகப் பயன்படுத்தப்படும் மாற்று என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உடல்’ மற்றும் ‘உறுப்புகள்’ என்ற பவுலின் உருவகம் அப்படியே பேணப்பட்டுள்ளது; ஒருமையையும் தனிநபர்களின் பரஸ்பரச் சார்பையும் வாக்கிய அமைப்பு வெளிப்படுத்துகிறது.
