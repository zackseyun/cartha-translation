  source_fidelity: முதல் வாக்கியம் οὕτως, οἱ πολλοί, ἓν σῶμα, ἐν Χριστῷ ஆகியவற்றைத் துல்லியமாகத் தருகிறது. ‘மேசியாவில்’ என்பது ἐν Χριστῷ என்பதிலுள்ள பட்டப்பெயரையும் ‘இல்’ உறவையும் பேணுகிறது. ஆனால் τὸ δὲ καθ’ εἷς என்பதற்கு ‘தனித்தனியாகவோ’ என வருவது தேவையற்ற மாற்றுத் தேர்வு/ஐயப் பொருளைச் சேர்க்கிறது; மூலத்தில் அத்தகைய ‘அல்லது’ பொருள் இல்லை.
