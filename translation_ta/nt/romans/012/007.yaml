  text: εἴτε διακονίαν ἐν τῇ διακονίᾳ, εἴτε ὁ διδάσκων ἐν τῇ διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/007.yaml
  text: if service[a], in service; if the one teaching, in teaching[b];
translation:
  language: ta
  text: சேவை என்றால், சேவை செய்வதில்[a]; கற்பிக்கிறவர் என்றால், கற்பிப்பதில்[b] ஈடுபடட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஊழியம் என்றால், அந்த ஊழியத்தில்.’ கிரேக்கச் சொல் பொதுவான சேவையையோ ஊழியத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கற்பிப்பவர், கற்பிப்பதில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: என்றால்
  rationale: வரங்களையும் செயல்பாடுகளையும் பட்டியலிடும் இந்தச் சுருக்கமான தொடரில், நிபந்தனைபோன்ற இணை அமைப்பை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: διακονίαν / ἐν τῇ διακονίᾳ
  choice: சேவை / சேவை செய்வதில்
  rationale: διακονία என்பது பொதுவான சேவையையோ ஊழியத்தையோ குறிக்கலாம். ‘சேவை’ அதன் பரந்த பொருளைப் பாதுகாத்து, இதை முறையான திருச்சபைப் பதவியாகத் தேவையின்றி குறுக்குவதைக் தவிர்க்கிறது. தமிழின் இயல்புக்காக இரண்டாம் இடத்தில் வினைநிலை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ διδάσκων
  choice: கற்பிக்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை, ஒரு பதவிப் பெயரை விட கற்பிக்கும் செயலில் ஈடுபடும் நபரை வலியுறுத்துகிறது.
- source_word: διδασκαλίᾳ
  choice: கற்பிப்பதில்
  rationale: இங்கு சொல் கற்பிக்கும் செயலை அல்லது துறையைச் சுட்டுகிறது. ‘கற்பிப்பதில்’ என்பது இயல்பானதும் நேரடியானதும் ஆகும்; ‘கோட்பாடு’ போன்ற குறுகிய தொழில்நுட்பப் பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: διακονία என்பதற்கு திருச்சபை சார்ந்த முறையான சொல்லைப் பயன்படுத்த வேண்டுமா
  choice: சேவை
  alternative: ஊழியம்
  rationale: இந்தப் பகுதி அருள் வரங்களையும் அவற்றின் செயல்பாடுகளையும் பட்டியலிடுகிறது. ‘சேவை’ என்பது சொல்லின் பரப்பைப் பாதுகாத்து, ஒரு குறிப்பிட்ட திருச்சபைப் பதவியையோ அமைப்பையோ உரைக்குள் சேர்க்காமல் விடுகிறது.
- issue: ὁ διδάσκων என்பதை ஒரு பதவிப் பெயராக மொழிபெயர்க்க வேண்டுமா
  choice: கற்பிக்கிறவர்
  alternative: போதகர் / ஆசிரியர்
  rationale: கிரேக்கப் பங்கேற்புவினை பதவியைத் தெளிவாகப் பெயரிடாமல், கற்பிக்கும் செயலைச் செய்கிற நபரைச் சுட்டுகிறது. ஆகவே செயல்சார் வலியுறுத்தல் பாதுகாக்கப்படுகிறது.
- issue: கிரேக்க மூலத்தில் வெளிப்படையாக இல்லாத வினையைத் தமிழில் நிரப்புவது
  choice: ஈடுபடட்டும்
  alternative: வினையில்லாத சுருக்கமான பட்டியல் வடிவம்
  rationale: கிரேக்க வாக்கியம் சூழலால் நிறைவுபெறும் சுருக்க அமைப்பாக உள்ளது. தமிழில் புரிதலுக்காகச் சேர்க்கப்பட்ட ‘ஈடுபடட்டும்’ இரு கூறுகளுக்கும் பொதுவாகச் செயல்படுகிறது; எந்தப் புதிய பதவியையோ கோட்பாட்டையோ சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான பட்டியல் அமைப்பை இயன்றவரைத் தக்கவைத்துள்ளோம். கிரேக்கத்தில் உள்ள மறைமுகமான அறிவுறுத்தலைத் தமிழில் இயல்பாக முடிக்க ‘ஈடுபடட்டும்’ சேர்க்கப்பட்டுள்ளது. மொழிநடை மரியாதையானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமானதும் ஆகும்.
