source:
  edition: SBLGNT
  text: τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/012.yaml
  text: rejoicing in hope[a], enduring in affliction, persisting in prayer[b],
translation:
  language: ta
  text: நம்பிக்கையில் மகிழுங்கள்; துன்பத்தில் நிலைத்திருங்கள்[a]; இறைவேண்டலில் விடாமல் தொடருங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “துன்பம்” என்பதற்கு “நெருக்கடி” என்றும் மொழிபெயர்க்கலாம்; θλῖψις கடும் அழுத்தம், வேதனை அல்லது ஒடுக்கத்தைச் சுட்டலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இறைவேண்டலில் உங்களை அர்ப்பணித்திருங்கள்” என்றும் மொழிபெயர்க்கலாம்; προσκαρτερέω விடாமல் தொடர்வதோடு உறுதியான ஈடுபாட்டையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: நம்பிக்கையில்
  rationale: ἐλπίς என்பது எதிர்பார்ப்புடன் கூடிய நம்பிக்கையைக் குறிக்கிறது. இங்குள்ள இடவேற்றுமைப் பொருளையும் சுருக்கமான அறிவுரை நடையையும் “நம்பிக்கையில்” இயல்பாகப் பேணுகிறது.
- source_word: χαίροντες
  choice: மகிழுங்கள்
  rationale: இது நிகழ்காலப் பங்கேற்புவினை வடிவமாக இருந்தாலும், சுற்றியுள்ள அறிவுரைத் தொடரில் கட்டளைப் பொருளில் செயல்படுகிறது. தமிழில் நேரடி ஏவல் வடிவம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: θλίψει
  choice: துன்பத்தில்
  rationale: θλῖψις அழுத்தம், நெருக்கடி, வேதனை ஆகியவற்றால் வரும் கடுமையான துன்பத்தைக் குறிக்கலாம். “துன்பம்” பொதுவாகப் புரியும் சொல்லாக இருந்து அதன் பொருள் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: ὑπομένοντες
  choice: நிலைத்திருங்கள்
  rationale: ὑπομένω கடினச் சூழலில் விலகாமல் தாங்கி நிற்பதைச் சுட்டுகிறது. “நிலைத்திருங்கள்” அந்த உறுதியான சகிப்பைச் சுருக்கமாக வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத “பொறுமை” என்ற உணர்ச்சி நுணுக்கத்தைச் சேர்ப்பதையும் தவிர்க்கிறது.
- source_word: προσευχῇ
  choice: இறைவேண்டலில்
  rationale: προσευχή என்பது கடவுளை நோக்கிய வேண்டுதல் அல்லது ஜெபம். “இறைவேண்டல்” நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் இருந்து, செயல் நடைபெறும் தளத்தைக் “-இல்” வடிவம் காட்டுகிறது.
- source_word: προσκαρτεροῦντες
  choice: விடாமல் தொடருங்கள்
  rationale: προσκαρτερέω ஒரு செயலில் உறுதியாகத் தொடர்ந்து ஈடுபடுதல், அதில் நிலைத்திருத்தல், அல்லது அதற்குத் தன்னை அர்ப்பணித்தல் ஆகிய பொருட்களைக் கொண்டது. “விடாமல் தொடருங்கள்” தொடர்ச்சியையும் விடாமுயற்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பங்கேற்புவினை வடிவங்களின் அறிவுரைப் பொருள்
  choice: மூன்று சொற்றொடர்களும் நேரடி ஏவல் வடிவில் மொழிபெயர்க்கப்பட்டன
  alternative: “மகிழ்கிறவர்களாக, நிலைத்திருக்கிறவர்களாக, தொடர்கிறவர்களாக” என்று பங்கேற்புவினைத் தொடரை வடிவரீதியாகப் பேணுதல்
  rationale: கிரேக்கப் பங்கேற்புவினைகள் சூழலில் அறிவுரைகளாகச் செயல்படுகின்றன. தமிழில் பங்கேற்புவினைத் தொடரை அப்படியே அமைப்பது முழுமையற்ற அல்லது செயற்கையான வாக்கியமாக ஒலிக்கும்; ஏவல் வடிவம் அதன் உரைநடைச் செயல்பாட்டைத் துல்லியமாக அளிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான அறிவுரை நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மூவகை இணை அமைப்பைப் பேண அரைப்புள்ளிகள் இடப்பட்டுள்ளன. “ஜெபம்” என்பதற்குப் பதிலாகப் பரவலாகப் புரியக்கூடிய தூய தமிழ்ச் சொல்லான “இறைவேண்டல்” தேர்ந்தெடுக்கப்பட்டது; அதேவேளை குறிப்பிட்ட திருச்சபை மரபின் சொல்வழக்கை முன்னிறுத்துவது தவிர்க்கப்பட்டது.
