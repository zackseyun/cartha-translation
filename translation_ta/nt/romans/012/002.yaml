id: ROM.12.2
reference: Romans 12:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: ta
  text: இந்தக் காலத்தின் போக்கிற்கு ஏற்ப உங்களை வடிவமைத்துக்கொள்ளாதீர்கள்[a]. மாறாக, உங்கள் மனம் புதுப்பிக்கப்படுவதன் மூலம் உருமாற்றம் அடையுங்கள். அப்பொழுது கடவுளின் விருப்பம் எது என்பதைப் பகுத்தறிய முடியும்—அது நல்லதும், மகிழ்வளிப்பதும்[c], நிறைவானதும் ஆகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “இந்த உலகத்திற்கு ஒத்தவர்களாக ஆகாதீர்கள்.” கிரேக்கச் சொல் αἰών படைக்கப்பட்ட உலகைவிடத் தற்போதைய காலத்தையும் அதன் ஒழுங்கையும் குறிப்பாகக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “கடவுளின் விருப்பம் எது என்பதைச் சோதித்து ஏற்றுக்கொள்ள முடியும்.” கிரேக்க வினைச்சொல் சோதித்தல், அதன்மூலம் ஏற்றதென்று கண்டறிதல் ஆகிய இரு நுணுக்கங்களையும் கொண்டிருக்கலாம்.'
    reason: lexical_alternative
  - marker: c
    text: “மகிழ்வளிப்பது” என்பது கடவுளுக்கு மகிழ்வளிப்பதைக் குறிக்கலாம்; “ஏற்புடையது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: போக்கிற்கு ஏற்ப உங்களை வடிவமைத்துக்கொள்ளாதீர்கள்
  rationale: வெளிப்புற மாதிரி அல்லது ஒழுங்கிற்கு ஒத்த வடிவம் பெறுவதைத் தடைசெய்யும் நடுப்பொருள்/செயப்பாட்டு கட்டளையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; μεταμορφοῦσθε என்பதுடனான எதிர்மறை ஒப்புமையையும் காக்கிறது.
- source_word: αἰῶνι τούτῳ
  choice: இந்தக் காலத்தின் போக்கிற்கு
  rationale: αἰών படைக்கப்பட்ட உலகைக் காட்டிலும் தற்போதைய காலத்தையும் அதன் ஒழுங்கையும் குறிக்கிறது. ‘போக்கு’ என்பது தமிழில் அதன் ஒழுக்க-சமூகத் தாக்கத்தைத் தெளிவாக்குகிறது; ‘இந்தக் காலம்’ என்ற நேரக் கருத்தையும் காக்கிறது.
- source_word: μεταμορφοῦσθε
  choice: உருமாற்றம் அடையுங்கள்
  rationale: மேலோட்டமான மாற்றமல்ல, ஆழமான வடிவ/நிலை மாற்றத்தைச் சுட்டுகிறது. செயப்பாட்டு நுணுக்கத்தைத் தமிழில் இயல்பாக வைத்திருக்கிறது.
- source_word: τῇ ἀνακαινώσει
  choice: புதுப்பிக்கப்படுவதன் மூலம்
  rationale: வேற்றுமை உருபின் கருவிப் பொருளை வெளிப்படையாகக் காட்டி, உருமாற்றம் நிகழும் வழிமுறையைத் தெரிவிக்கிறது.
- source_word: τοῦ νοός
  choice: உங்கள் மனம்
  rationale: νοῦς என்பது இங்கு எண்ணம், புரிதல், ஒழுக்கப் பகுத்தறிவு ஆகியவற்றின் மையமான மனத்தைக் குறிக்கிறது. கிரேக்கத்தில் உடைமைப்பெயர் வெளிப்படையாக இல்லாவிட்டாலும், பன்மை வாசகர்களை நோக்கிய தமிழில் ‘உங்கள்’ இயல்பாகத் தேவைப்படுகிறது.
- source_word: εἰς τὸ δοκιμάζειν
  choice: அப்பொழுது ... பகுத்தறிய முடியும்
  rationale: நோக்கம்/விளைவை இயல்பான தமிழில் காட்டுகிறது. δοκιμάζω என்பதில் சோதித்தல், மதிப்பிடுதல், ஏற்றதென்று அறிதல் ஆகிய நுணுக்கங்கள் உள்ளன; முதன்மை உரையில் ‘பகுத்தறிதல்’ நடைமுறை விளைவைத் தெளிவாகச் சொல்கிறது.
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: கடவுளின் விருப்பம் எது
  rationale: τί என்ற வினாப்பொருளையும் τοῦ θεοῦ என்ற உடைமைத் தொடர்பையும் நேரடியாகக் காக்கிறது. ‘விருப்பம்’ என்பது தற்போதைய பொதுத் தமிழில் தெளிவானது.
- source_word: τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον
  choice: நல்லதும், மகிழ்வளிப்பதும், நிறைவானதும்
  rationale: மூன்று பெயரடைகளையும் கடவுளின் விருப்பத்தை விளக்கும் ஒரே தொடராக வைத்திருக்கிறது. ‘நிறைவானது’ τέλειον என்பதன் முழுமை/குறைவற்ற தன்மையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: αἰών என்பதன் ஒழுக்க-கால எதிர்மறை
  choice: இந்தக் காலத்தின் போக்கு
  alternative: இந்த உலகம்
  rationale: ‘உலகம்’ என்று மட்டும் மொழிபெயர்த்தால் படைப்புலகமே தீயது என்ற தேவையற்ற பொருள் தோன்றக்கூடும். இச்சொற்றொடர் தற்போதைய கால ஒழுங்கையும் அதன் வடிவமைக்கும் தாக்கத்தையும் சுட்டுவதைத் தேர்ந்த மொழிபெயர்ப்பு காக்கிறது.
- issue: δοκιμάζειν என்பதன் வலிமை
  choice: பகுத்தறிய முடியும்
  alternative: சோதித்து ஏற்றுக்கொள்ள முடியும்
  rationale: மனிதர் கடவுளின் விருப்பத்தைத் தீர்ப்பிடுகிறார் என்ற கருத்தை உருவாக்காமல், புதுப்பிக்கப்பட்ட மனம் அதைச் சோதித்துணர்ந்து ஏற்றதென்று அறியும் பொருளைத் தருகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: εὐάρεστον யாருக்கு மகிழ்வளிக்கிறது என்பது
  choice: மகிழ்வளிப்பது
  alternative: கடவுளுக்கு உகந்தது
  rationale: கிரேக்கப் பெயரடை யாருக்கு மகிழ்வளிக்கிறது என்பதை இவ்விடத்தில் வெளிப்படையாகச் சொல்லவில்லை. முதன்மை உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது; சாத்தியமான கடவுள்-நோக்கிய வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உருமாற்றம்’, ‘புதுப்பிக்கப்படுதல்’, ‘பகுத்தறிதல்’ ஆகிய சொற்கள் பவுலின் கருத்து அடர்த்தியைத் தக்கவைத்தபடியே சமகால வாசிப்பிற்கு ஏற்றவை. மிகச் சமயவழக்கான ‘சித்தம்’ என்பதற்குப் பதிலாகப் பொதுவாகப் புரியும் ‘விருப்பம்’ தேர்ந்தெடுக்கப்பட்டது.
