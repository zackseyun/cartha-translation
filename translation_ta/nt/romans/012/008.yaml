  to: ஊக்குவிப்பவர், ஊக்குவிப்பதில் ஈடுபடட்டும்[a]; பகிர்ந்துகொடுப்பவர், தாராளத்துடன் பகிர்ந்துகொடுக்கட்டும்[b][c]; முன்னின்று வழிநடத்துபவர், சிரத்தையுடன் வழிநடத்தட்டும்[d][e]; இரக்கம் காட்டுபவர், மகிழ்ச்சியுடன் இரக்கம் காட்டட்டும்.
  rationale: திருத்தம் பொருளை மாற்றாமல், ஒவ்வொரு கிரேக்கப் பங்கேற்பும் குறிக்கும் செயலைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது. இது முந்தைய வசனத்திலிருந்து தொடரும் அறிவுறுத்தல் நயத்தையும் காக்கிறது; தலைமைக்கான சொல் எந்தக் குறிப்பிட்ட திருச்சபைப் பதவியையும் திணிக்கவில்லை. அடிக்குறிப்பு குறியீடுகளும் அவற்றின் சொல்-ஆதார மாற்றுகளும் தக்கவைக்கப்பட்டுள்ளன.
