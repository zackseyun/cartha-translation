id: ROM.12.8
reference: Romans 12:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: ta
  text: ஊக்குவிப்பவர், ஊக்குவிப்பதில் ஈடுபடட்டும்[a]; பகிர்ந்துகொடுப்பவர், தாராளத்துடன் பகிர்ந்துகொடுக்கட்டும்[b][c]; முன்னின்று வழிநடத்துபவர், சிரத்தையுடன் வழிநடத்தட்டும்[d][e]; இரக்கம் காட்டுபவர், மகிழ்ச்சியுடன் இரக்கம் காட்டட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறிவுறுத்துபவர், அறிவுறுத்துவதில் ஈடுபடட்டும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் இணை ஊக்குவித்தல், அறிவுறுத்துதல் ஆகிய இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘கொடுப்பவர்’ அல்லது ‘பங்களிப்பவர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘நேர்மையுடன்,’ ‘கபடமின்றி’ அல்லது ‘எளிமையாக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சூழலுக்கு ஏற்ப ஒருமுகத்தன்மையையோ தாராளத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘நிர்வகிப்பவர்’ அல்லது ‘மேற்பார்வை செய்பவர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: e
    text: ‘முனைப்புடன்’ அல்லது ‘தீவிர அக்கறையுடன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: என்றால் / தொடரின் நிபந்தனை அமைப்பில் மறைமுகமாக வெளிப்படுத்தப்பட்டது
  rationale: இது முந்தைய வசனத்திலிருந்து தொடரும் சுருக்கமான பட்டியல். தமிழில் ஒவ்வொரு பணியுடனும் ‘செய்யட்டும்’ எனச் சேர்ப்பது அந்த மறைந்துள்ள கட்டளையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ παρακαλῶν … ἐν τῇ παρακλήσει
  choice: ஊக்குவிப்பவர், ஊக்குவிப்பதில் ஈடுபடட்டும்
  rationale: παρακαλέω / παράκλησις ஆகிய ஒரே வேரைச் சேர்ந்த சொற்களின் தொடர்பைத் தமிழிலும் மீட்டுரைப்பால் காட்டுகிறது; இச்சொற்கள் அறிவுறுத்துதல் மற்றும் ஊக்கமளித்தல் ஆகிய இரு பொருள் நிழல்களையும் கொண்டுள்ளன.
- source_word: ὁ μεταδιδοὺς
  choice: பகிர்ந்துகொடுப்பவர்
  rationale: ஒருவர் தமது வளங்களிலிருந்து பிறருக்குப் பகிர்ந்தளிக்கும் செயலைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἐν ἁπλότητι
  choice: தாராளமாக
  rationale: வளங்களைப் பகிர்ந்துகொடுக்கும் உடனடிச் சூழலில் தாராளம் என்பது மிகச் சாத்தியமான பொருள்; நேர்மை அல்லது கபடமின்மை என்ற மாற்றுப் பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ὁ προϊστάμενος
  choice: முன்னின்று வழிநடத்துபவர்
  rationale: தலைமை அல்லது மேற்பார்வையைத் தெரிவிக்கிறது; குறிப்பிட்ட திருச்சபைப் பதவியை உரையில் திணிக்காமல் பொதுவான பரப்பை நிலைநிறுத்துகிறது.
- source_word: ἐν σπουδῇ
  choice: முழு அக்கறையுடன்
  rationale: σπουδή என்பதிலுள்ள சிரத்தை, முனைப்பு, தீவிரம் ஆகிய பொருள் நிழல்களை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ὁ ἐλεῶν
  choice: இரக்கம் காட்டுபவர்
  rationale: வினைச்செயல் சார்ந்த பங்கேற்பு வடிவத்தைத் தக்கவைத்து, இரக்கம் செயலாக வெளிப்படுவதைச் சொல்கிறது.
- source_word: ἐν ἱλαρότητι
  choice: மகிழ்ச்சியுடன்
  rationale: ἱλαρότης குறிக்கும் மகிழ்ச்சியான, மனமுவந்த மனப்பாங்கை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: προϊστάμενος என்பதன் பரப்பு
  choice: குறிப்பிட்ட பதவியைக் குறிக்காமல் ‘முன்னின்று வழிநடத்துபவர்’ என்று பொதுவாக மொழிபெயர்க்கப்பட்டது
  alternative: ஆளுபவர் / நிர்வகிப்பவர் / திருச்சபையில் தலைமை வகிப்பவர்
  rationale: இவ்வசனம் அருள்வரங்களைப் பரந்த பங்கேற்பு வடிவங்களில் பட்டியலிடுகிறது; ஒரு குறிப்பிட்ட திருச்சபை ஆட்சிமுறையை இதில் சேர்க்காமல் மூலத்தின் பரப்பைப் பாதுகாக்க வேண்டும்.
- issue: பகிர்ந்துகொடுக்கும் சூழலில் ἁπλότης என்பதன் பொருள்
  choice: தாராளம்
  alternative: நேர்மை / எளிமை / ஒருமுகமான நோக்கம்
  rationale: பொருள்வளங்களைப் பகிரும் உடனடிச் சூழலில் தாராளம் மிகச் சாத்தியமானது; இருப்பினும் சொல்லின் உண்மையான மாற்றுப் பொருள் நிழல்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட பட்டியல் நடை பயன்படுத்தப்பட்டது. கிரேக்கத்தின் சுருக்கமான அமைப்பைத் தக்கவைத்தபடியே, முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் கட்டளையைத் தமிழில் ‘ஈடுபடட்டும் / செய்யட்டும்’ என இயல்பாக வெளிப்படுத்துகிறது. பெயரிடப்பட்ட திருச்சபைப் பதவிச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
