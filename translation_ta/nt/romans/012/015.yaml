id: ROM.12.15
reference: Romans 12:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: χαίρειν μετὰ ⸀χαιρόντων, κλαίειν μετὰ κλαιόντων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: ta
  text: மகிழ்கிறவர்களோடு மகிழுங்கள்; அழுகிறவர்களோடு அழுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: மகிழுங்கள்
  rationale: இது வடிவத்தில் நிகழ்கால வினையெச்சமாக இருந்தாலும், ரோமர் 12:9–21 அறிவுரைத் தொடரில் கட்டளைப் பொருளில் வருகிறது. ‘மகிழுங்கள்’ அதன் உணர்வையும் அறிவுரையின் வலிமையையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: μετὰ
  choice: -ஓடு
  rationale: மரபுத்தொடரிலுள்ள μετά இங்கு உடனிருப்பு அல்லது பங்கேற்பைக் குறிக்கிறது. தமிழில் ‘மகிழ்கிறவர்களோடு’ மற்றும் ‘அழுகிறவர்களோடு’ என்பது அந்தச் சேர்நிலையை இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: χαιρόντων
  choice: மகிழ்கிறவர்கள்
  rationale: நிகழ்கால செய்பாட்டு எச்சம் பன்மையில் பெயர்ச்சொல்லாகப் பயன்படுகிறது. ‘மகிழ்கிறவர்கள்’ பொதுவான பன்மைப் பொருளையும் மூலத்தின் தொடர்ச்சியான செயற்பாட்டு நிழலையும் காக்கிறது.
- source_word: κλαίειν
  choice: அழுங்கள்
  rationale: இது அறிவுரைச் சூழலில் கட்டளைப் பொருள் கொண்ட வினையெச்சம். κλαίω குறிக்கும் கண்ணீர் அல்லது வெளிப்படையான துயரத்தை ‘அழுங்கள்’ நேரடியாகவும் இயல்பாகவும் தருகிறது; ‘துக்கப்படுங்கள்’ என்பது பொருளை அளவுக்கு மீறி விரிவாக்கக்கூடும்.
- source_word: κλαιόντων
  choice: அழுகிறவர்கள்
  rationale: நிகழ்கால செய்பாட்டு எச்சம் பன்மையில் பெயர்ச்சொல்லாக வருகிறது. ‘அழுகிறவர்கள்’ என்பது தெளிவாக இருந்து, ‘மகிழ்கிறவர்கள்’ என்பதோடு மூலத்தின் இணை அமைப்பைக் காக்கிறது.
theological_decisions:
- issue: அறிவுரைத் தொடரில் வினையெச்சங்களின் கட்டளை வலிமை
  choice: 'இரு வினையெச்சங்களையும் கட்டளை வடிவில் மொழிபெயர்த்தல்: ‘மகிழுங்கள் … அழுங்கள்’'
  alternative: ‘மகிழ்கிறவர்களோடு மகிழ்வது; அழுகிறவர்களோடு அழுவது’
  rationale: கிரேக்கத்தில் வினையெச்ச வடிவங்கள் இருந்தாலும், ரோமர் 12:9–21 பகுதியில் அவை அறிவுரைகளாகச் செயல்படுகின்றன. தமிழ் கட்டளை வடிவம் எந்தக் கோட்பாட்டுச் சேர்க்கையும் இன்றி அந்த உரையாடல் வலிமையைத் தெளிவாகக் கொண்டுவருகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் சுருக்கமான, கண்ணியமான அறிவுரை நடை பயன்படுத்தப்பட்டுள்ளது. இரு கூறுகளின் இணை அமைப்பும் ஒலிநயமும் காக்கப்பட்டுள்ளன; தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
