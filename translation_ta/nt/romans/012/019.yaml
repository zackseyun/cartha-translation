source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: ta
  text: அன்புக்குரியவர்களே, நீங்களே பழிவாங்காதீர்கள். மாறாக, கோபத்திற்கு இடம் கொடுங்கள்[a]. ஏனெனில், “பழிவாங்குதல் எனக்குரியது; நானே திருப்பிச் செலுத்துவேன்,” என்று ஆண்டவர் சொல்கிறார் என எழுதப்பட்டுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கோபத்திற்கு இடம் கொடுங்கள்” என்பதை “கோபம் செயல்பட இடம்விடுங்கள்” என்றும் மொழிபெயர்க்கலாம். தொடர்ந்து வரும் மேற்கோளின் அடிப்படையில், இது பெரும்பாலும் கடவுளுடைய கோபத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: நீங்களே பழிவாங்காதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலப் பங்கேற்புவினை இச்சூழலில் கட்டளையாகச் செயல்படுகிறது. “நீங்களே” என்பது ἑαυτούς என்பதன் தற்சுட்டுப் பொருளையும், பழிவாங்குவதைத் தாங்களே மேற்கொள்ளக்கூடாது என்ற வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்புடன் அழைக்கும் விளிவேற்றுமையையும் அதன் ஆழமான உறவுத்தன்மையையும் நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: மாறாக, கடுங்கோபத்திற்கு இடம்கொடுங்கள்
  rationale: δότε τόπον என்ற ‘இடம் கொடுங்கள்’ உருவகத்தைத் தக்கவைக்கிறது. ὀργή என்பது சாதாரண எரிச்சலைவிடத் தீர்ப்புடன் தொடர்புடைய கடுங்கோபத்தைக் குறிக்கக்கூடும்; எனவே “கடுங்கோபம்” தேர்ந்தெடுக்கப்பட்டது. அது யாருடைய கடுங்கோபம் என்பதை மூலவாக்கியம் வெளிப்படையாகச் சொல்லாததால் முதன்மை உரையிலும் சேர்க்கப்படவில்லை.
- source_word: γέγραπται γάρ
  choice: ஏனெனில் … என எழுதப்பட்டுள்ளது
  rationale: வேதாகம மேற்கோளை அறிமுகப்படுத்தும் நிறைநிலைச் செயலற்ற வாய்பாட்டை இயல்பான தமிழில் வழங்குகிறது.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: பழிவாங்குதல் எனக்குரியது
  rationale: தன்மை ஒருமை இடவேற்றுமையுடன் வரும் பெயர்ச்சொல் உடைமை அல்லது உரிமையை வெளிப்படுத்துகிறது. “எனக்குரியது” என்பது அந்தத் தெய்வீக உரிமையைத் தெளிவாகவும் நேரடியாகவும் காட்டுகிறது.
- source_word: ἐγὼ ἀνταποδώσω
  choice: நானே கைம்மாறு செய்வேன்
  rationale: ἐγώ என்பதன் வெளிப்படையான வலியுறுத்தலை “நானே” காக்கிறது. ἀνταποδίδωμι என்பதன் திருப்பிச் செலுத்துதல் அல்லது தக்க பதிலளித்தல் என்ற நீதித்தீர்ப்புச் சார்ந்த பொருளை “கைம்மாறு செய்வேன்” சுருக்கமாகத் தருகிறது.
- source_word: λέγει κύριος
  choice: என்று ஆண்டவர் சொல்கிறார்
  rationale: மேற்கோள் முடிவில் வரும் உரைப்புச் சூத்திரத்தை இயல்பான தமிழ் சொல்வரிசையில் வழங்குகிறது; κύριος என்பதற்கு திட்டத்தின் வழக்கமான “ஆண்டவர்” பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: τῇ ὀργῇ என்பதில் ‘கடுங்கோபம்’ யாருடையது?
  choice: முதன்மை உரையில் உரியவரை வெளிப்படையாகச் சேர்க்காமல், “கடுங்கோபத்திற்கு” என்று சுருக்கமாக வைத்தல்
  alternative: “கடவுளுடைய கடுங்கோபத்திற்கு இடம்கொடுங்கள்” என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது மனிதக் கோபத்தைப் பொதுவாகக் குறித்தல்
  rationale: தொடர்ந்து வரும் உபாகமம் 32:35 மேற்கோள், பழிவாங்குதலும் கைம்மாறும் ஆண்டவருக்குரியவை என்று கூறுவதால் கடவுளுடைய கடுங்கோபமே பெரும்பாலும் உத்தேசிக்கப்படுகிறது. ஆயினும் கிரேக்க உரை ‘கடவுளுடைய’ என்று வெளிப்படையாகச் சொல்லாததால், அதன் சுருக்கத்தையும் ஓரளவு தெளிவின்மையையும் முதன்மை உரை காக்கிறது.
- issue: Ἐμοὶ ἐκδίκησις என்ற கூற்றின் வலிமை
  choice: “பழிவாங்குதல் எனக்குரியது”
  alternative: “பழிவாங்குவது என்னுடையது” அல்லது “பழிவாங்கும் உரிமை எனக்கே உரியது”
  rationale: முதல் மாற்று தமிழில் சற்றே செயற்கையாக ஒலிக்கும்; இரண்டாவது ‘உரிமை’ மற்றும் ‘எனக்கே’ என்பவற்றை விளக்கமாகச் சேர்த்து மூலத்தைவிட அதிகமாகத் தீர்மானிக்கிறது. தேர்ந்த வடிவம் உடைமைக்கும் தனியுரிமைக்கும் இடையிலான மூலச் சுருக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. “அன்புக்குரியவர்களே” என்ற அழைப்பு பாசத்தையும் மரியாதையையும் காக்கிறது. கிரேக்கத்தின் உருவகமான “இடம்கொடுங்கள்” தக்கவைக்கப்பட்டாலும், புரிதலுக்காக “கடுங்கோபம்” என்ற சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது. மேற்கோள் தமிழில் இயல்பாக வாசிக்கப்படும்படி உரைப்புச் சொற்றொடர் இறுதியில் அமைக்கப்பட்டுள்ளது.
