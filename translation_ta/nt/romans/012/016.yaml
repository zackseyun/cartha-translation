id: ROM.12.16
reference: Romans 12:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: ta
  text: ஒருவருக்கொருவர் ஒரே மனப்பான்மையுடன் இருங்கள். மேன்மையானவற்றில் மனம் வைக்காமல்[a], தாழ்நிலையில் இருப்பவர்களோடு பழகுங்கள்[b]. உங்கள் பார்வையில் நீங்களே ஞானிகளாகிவிடாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயர்வானவற்றை நாடாமல்”; அல்லது, “பெருமைகொள்ளாமல்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தாழ்மையானவர்களோடு பழகுங்கள்”; கிரேக்கச் சொல் தாழ்நிலையில் உள்ள மனிதர்களையோ தாழ்வான காரியங்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: ஒருவருக்கொருவர் ஒரே மனப்பான்மையுடன் இருங்கள்
  rationale: இந்த மரபுத்தொடர் எல்லாரும் ஒரே கருத்தையே கொண்டிருக்க வேண்டும் என்பதைக் காட்டிலும், ஒருவரை ஒருவர் நோக்கிய இணக்கமான மனப்பான்மையை வலியுறுத்துகிறது. தமிழ் வாசகத்தில் பரஸ்பர நோக்கமும் சமூக இசைவும் தெளிவாகின்றன.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: மேன்மையானவற்றில் மனம் வைக்காமல்
  rationale: ‘உயர்ந்தவற்றைச் சிந்தித்தல்’ என்ற கிரேக்க உருவகத்தை இயல்பான தமிழில் காக்கிறது; பெருமையான மனநிலை, உயர்ந்த அந்தஸ்து அல்லது உயர்வான இலக்குகளை நாடுதல் ஆகிய சாத்திய நுணுக்கங்களை ஒன்றாகவே திறந்துவைக்கிறது.
- source_word: τοῖς ταπεινοῖς
  choice: தாழ்நிலையில் இருப்பவர்களோடு
  rationale: சூழலின் சமூகப் பரிமாணத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது. கிரேக்கப் பெயரடை தாழ்ந்த மனிதர்களையோ தாழ்வான காரியங்களையோ குறிக்கக்கூடும் என்பதால் மாற்று பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: συναπαγόμενοι
  choice: பழகுங்கள்
  rationale: இச்சூழலில் தாழ்நிலையில் உள்ளவர்களோடு தம்மை இணைத்துக்கொண்டு உறவாடுதல் என்பதே வினையின் நடைமுறை வலிமை. சொற்படியான ‘அவர்களோடு இழுத்துச் செல்லப்படுங்கள்’ என்பது தமிழில் தவறான கட்டாய அல்லது எதிர்மறை உணர்வைத் தரக்கூடும்.
- source_word: μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς
  choice: உங்கள் பார்வையில் நீங்களே ஞானிகளாகிவிடாதீர்கள்
  rationale: γίνεσθε என்பதிலுள்ள ‘ஆகுதல்’ என்ற நிகழ்வுப் பொருளை ‘ஆகிவிடாதீர்கள்’ காக்கிறது; παρ’ ἑαυτοῖς என்பது சொந்த மதிப்பீட்டில் தம்மை ஞானிகளாகக் கருதும் தற்பெருமையைக் குறிக்கிறது.
theological_decisions:
- issue: τὰ ὑψηλά மற்றும் τοῖς ταπεινοῖς ஆகியவற்றின் சமூக மற்றும் மனப்பான்மை சார்ந்த பொருள்
  choice: மேன்மையானவற்றில் மனம் வைக்காமல், தாழ்நிலையில் இருப்பவர்களோடு பழகுங்கள்
  alternative: பெருமைகொள்ளாமல், தாழ்மையானவர்களோடு பழகுங்கள்; அல்லது உயர்வானவற்றை நாடாமல், தாழ்வான காரியங்களில் ஈடுபடுங்கள்
  rationale: கிரேக்கம் உட்புறப் பெருமையையும் சமூக உயர்வை நாடுவதையும் சுட்டக்கூடும்; மேலும் τοῖς ταπεινοῖς மனிதர்களையோ காரியங்களையோ குறிக்கலாம். முதன்மை உரை சமூகப் பொருளை இயல்பாகத் தருகிறது; அடிக்குறிப்புகள் மற்ற உண்மையான சாத்தியங்களைப் பாதுகாக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேன்மையானவை’ என்ற சொல் திட்டமிட்டே பரந்த பொருளில் வைக்கப்பட்டுள்ளது; ‘தாழ்ந்தவர்கள்’ என்பது ஒழுக்கக் குறைவு என்று தவறாகப் புரியாமல் இருக்க ‘தாழ்நிலையில் இருப்பவர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
