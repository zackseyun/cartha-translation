  source_fidelity: மூலக் கிரேக்கத்தின் முக்கியக் கூறுகள் தக்கவாறு வெளிப்பட்டுள்ளன. “ஒருவருக்கொருவர் ஒரே மனப்பான்மையுடன்” என்பது τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες என்பதன் பரஸ்பர இணக்கப் பொருளை இயல்பாகத் தருகிறது. “மேன்மையானவற்றில் மனம் வைக்காமல்” τὰ ὑψηλά என்பதன் பரந்த, திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது. συναπαγόμενοι-க்கு “பழகுங்கள்” என்பது இச்சூழலில் பொருத்தமான நடைமுறை மொழிபெயர்ப்பு; τοῖς ταπεινοῖς-இன் மனிதர்/காரியங்கள் என்ற இரு சாத்தியங்களும் அடிக்குறிப்பில் காக்கப்படுகின்றன. இறுதி வாக்கியம் γίνεσθε மற்றும் φρόνιμοι παρ’ ἑαυτοῖς ஆகியவற்றின் ஆகிவரும் சுயஞானப் பெருமை என்னும் கருத்தைத் துல்லியமாகத் தருகிறது.
