id: ROM.12.6
reference: Romans 12:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: ta
  text: நமக்குக் கொடுக்கப்பட்ட அருளுக்கு ஏற்ப நம்மிடம் வெவ்வேறு வரங்கள் உள்ளன; இறைவாக்கு உரைப்பதாக இருந்தால், விசுவாசத்தின் அளவுக்கு ஏற்ப உரைக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவருடைய விசுவாசத்தின் அளவுக்கு ஏற்ப”; வேறொரு விளக்கம், “விசுவாசத்தோடு ஒத்துப்போகும் வகையில்.” கிரேக்கத் தொடர், இறைவாக்கு உரைப்பவருக்குக் கொடுக்கப்பட்ட விசுவாசத்தின் அளவையோ, கிறிஸ்தவ விசுவாசத்தின் உள்ளடக்கத்தோடு உள்ள ஒத்திசைவையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: நமக்கு உள்ளன
  rationale: முந்தைய வசனத்தின் சிந்தனையைத் தொடர்ந்து, தமிழில் இயல்பான முழு வாக்கியமாக அமைக்கப்பட்டுள்ளது; δέ இங்குள்ள மென்மையான தொடர்ச்சி தனியே வலுவான எதிர்மறை இணைப்பாக மொழிபெயர்க்கப்படவில்லை.
- source_word: χαρίσματα
  choice: வரங்கள்
  rationale: பவுலின் பயன்பாட்டில் அருளால் வழங்கப்படும் திறன்கள் அல்லது பணிகளைச் சுட்டும் வழக்கமான, புரிந்துகொள்ள எளிய தமிழ் சொல்.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: நமக்குக் கொடுக்கப்பட்ட அருளுக்கு ஏற்ப
  rationale: κατά குறிக்கும் ஒத்திசைவு அல்லது ஏற்பைத் தக்கவைத்து, χάρις என்பதைக் கடவுளின் அருளான வழங்குதலாக வெளிப்படுத்துகிறது.
- source_word: διάφορα
  choice: வெவ்வேறு
  rationale: வரங்களின் பல்வகைத் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἴτε προφητείαν
  choice: அது இறைவாக்குரைக்கும் வரமானால்
  rationale: மூலத்தின் சுருக்கப்பட்ட பட்டியல் அமைப்பைத் தமிழில் தெளிவாக்குகிறது; προφητεία என்பது இங்கு ஒரு வரம் அல்லது செயற்பாடு என்பதைச் சூழலிலிருந்து வெளிப்படுத்துகிறது.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: விசுவாசத்தின் அளவுக்கு ஏற்ப
  rationale: ἀναλογία என்பதிலுள்ள அளவு அல்லது பொருத்தம் என்ற பரந்த கருத்தைத் தக்கவைக்கிறது; πίστις யாருடைய விசுவாசம் அல்லது விசுவாசத்தின் உள்ளடக்கம் என்பதைக் பிரதான உரை முடிவுசெய்யவில்லை.
theological_decisions:
- issue: κατὰ τὴν ἀναλογίαν τῆς πίστεως என்பதன் பொருள்
  choice: விசுவாசத்தின் அளவுக்கு ஏற்ப
  alternative: ஒருவருடைய விசுவாசத்தின் அளவுக்கு ஏற்ப; அல்லது கிறிஸ்தவ விசுவாசத்தோடு ஒத்துப்போகும் வகையில்
  rationale: கிரேக்கத் தொடர் இறைவாக்குரைப்பவருக்குக் கொடுக்கப்பட்ட விசுவாசத்தின் அளவையோ, கிறிஸ்தவ விசுவாசத்தின் உள்ளடக்கத்துடனான ஒத்திசைவையோ குறிக்கக்கூடும். பிரதான உரை இந்தத் தெளிவின்மையைத் தக்கவைத்து, விளக்கங்களை அடிக்குறிப்பில் தருகிறது.
- issue: προφητείαν என்பதன் மொழிபெயர்ப்பு
  choice: இறைவாக்குரைக்கும் வரம்
  alternative: தீர்க்கதரிசனம்; இறைவாக்கு
  rationale: இங்கு எதிர்காலத்தை முன்னறிவிப்பது மட்டுமல்லாமல், கடவுளிடமிருந்து பெற்ற செய்தியை உரைப்பதையும் குறிக்கக்கூடியதால், நவீன வாசகர்களுக்கு அகலமான பொருளைத் தரும் வினைச்சொல் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் சுருக்கப்பட்ட இலக்கணத்தைத் தமிழில் தெளிவான வாக்கியமாக விரித்தாலும், சர்ச்சைக்குரிய ‘விசுவாசத்தின் அளவு/ஒத்திசைவு’ என்ற பொருள் திட்டமிட்டு தீர்மானிக்கப்படவில்லை.
