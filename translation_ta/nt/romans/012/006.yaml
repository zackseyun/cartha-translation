revisions:
- from: நமக்குக் கொடுக்கப்பட்ட அருளுக்கு ஏற்ப வெவ்வேறு வரங்கள் நமக்கு உள்ளன. அது இறைவாக்குரைக்கும் வரமானால், விசுவாசத்தின் அளவுக்கு ஏற்ப இறைவாக்குரைக்க வேண்டும்.[a]
  to: நமக்குக் கொடுக்கப்பட்ட அருளுக்கு ஏற்ப நம்மிடம் வெவ்வேறு வரங்கள் உள்ளன; இறைவாக்கு உரைப்பதாக இருந்தால், விசுவாசத்தின் அளவுக்கு ஏற்ப உரைக்க வேண்டும்.[a]
  rationale: The revision retains the source’s participial/exhortational flow in idiomatic Tamil, removes the unintended implication that the gift itself prophesies, and keeps the contested meaning of “in proportion to faith” open in the main text and footnote.
  reviewer_model: gpt-5.6-terra
