  source_fidelity: மூல கிரேக்கத்தின் செயப்பாட்டு எதிர்மறை ஏவல் (‘தீமையால் தோற்கடிக்கப்படாதே’) மற்றும் செய்வினை ஏவல் (‘தீமையைத் தோற்கடி’) இரண்டையும் மொழிபெயர்ப்பு துல்லியமாகக் காக்கிறது. ὑπό-வினையாளர் உறவு ‘தீமையால்’ என்பதிலும், ἐν-வழிமுறை உறவு ‘நன்மையால்’ என்பதிலும் சரியாக வெளிப்படுகின்றன. நடுநிலைப் பால் வடிவங்களின் பொதுவான ஒழுக்கக் கருத்தான ‘தீமை/நன்மை’ பாதுகாக்கப்பட்டுள்ளது; தனிப்பட்ட தீயவனைச் சுட்டும் பொருள் ஏற்றப்படவில்லை.
  naturalness: ‘தீமையால் தோற்கடிக்கப்படாதே; மாறாக, நன்மையால் தீமையைத் தோற்கடி’ என்பது நவீன தரநிலைத் தமிழில் தெளிவான, நேரடியான ஏவல் நடை. ‘தோற்கடிக்கப்படாதே/தோற்கடி’ என்ற இணைப்பு கிரேக்கத்தின் சொல் மீளுரைப்பையும் செயப்பாட்டு–செய்வினை மாறுபாட்டையும் இயல்பாகத் தருகிறது.
  terminology: ‘தீமை’ மற்றும் ‘நன்மை’ ஆகியவை இச்சூழலுக்கு நிலையான, பரவலாகப் புரியப்படும் ஒழுக்கச் சொற்கள். அடிக்குறிப்பு ‘தீயது/நல்லது’ என்ற சாத்தியமான மாற்று மொழிபெயர்ப்பை உரியவாறு விளக்குகிறது; அது மூலத்தின் இலக்கணத் தெளிவின்மையை பாதுகாக்கிறது.
