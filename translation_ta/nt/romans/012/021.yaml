  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: ta
  text: தீமையால் தோற்கடிக்கப்படாதே; மாறாக, நன்மையால் தீமையைத் தோற்கடி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீயதனால் நீ தோற்கடிக்கப்படாதே; மாறாக, நல்லதனால் தீயதைத் தோற்கடி.” கிரேக்கத்தில் பெயர்ச்சொற்களாகப் பயன்படும் நடுநிலைப் பால் அடைமொழிகள் உள்ளன; அவற்றை “தீமை/நன்மை” என்றும் “தீயது/நல்லது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: தோற்கடிக்கப்படாதே
  rationale: μή உடன் வரும் நிகழ்காலச் செயப்பாட்டு ஏவல் வடிவத்தின் தடையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. νικάω என்பதிலுள்ள வெற்றி–தோல்வி உருவகத்தையும் செயப்பாட்டு நிலையையும் காக்கிறது.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: தீமையால்
  rationale: ὑπό + பிறப்புவேற்றுமை செய்பவரையோ செயலாற்றும் காரணியையோ குறிக்கிறது. பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலை ஒருமை அடைமொழியான τοῦ κακοῦ இங்கே பொதுவாக ‘தீமை’ அல்லது ‘தீயது’ எனப் பொருள்படலாம்.
- source_word: ἀλλὰ νίκα
  choice: மாறாக, ... தோற்கடி
  rationale: ἀλλά வலுவான முரண்பாட்டைக் காட்டுகிறது. νίκα நிகழ்காலச் செய்பாட்டு ஏவல் வடிவம்; முதல் கூற்றிலுள்ள வெற்றி–தோல்வி சொற்படிமத்தை ‘தோற்கடி’ தொடர்ந்து காக்கிறது.
- source_word: ἐν τῷ ἀγαθῷ
  choice: நன்மையால்
  rationale: ἐν + கொடைவேற்றுமை இங்கே கருவி அல்லது வழிமுறையைக் குறிக்கிறது. ‘நன்மையால்’ என்பது தீமையை வெல்லும் வழியைச் சுருக்கமாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: τὸ κακόν
  choice: தீமையை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலை ஒருமை அடைமொழி பொதுவான ஒழுக்கத் தீமையைக் குறிக்கிறது. ‘தீமை’ என்ற சொல் கிரேக்கத்தின் சுருக்கமான தீமை–நன்மை எதிர்மறையைக் காக்கிறது.
theological_decisions:
- issue: κακός/ἀγαθός ஆகியவற்றை ஒழுக்கப் பண்புகளாகக் கொள்வதா, தனிநபர்களைக் குறிப்பதாகக் கொள்வதா
  choice: ‘தீமை’, ‘நன்மை’ என்ற பொதுவான ஒழுக்கப் பண்புகள்
  alternative: ‘தீயவன்’ போன்ற தனிநபரைக் குறிக்கும் வாசிப்பு
  rationale: இரு வடிவங்களும் நடுநிலைப் பாலில் உள்ளன; உடனடியான தொடரமைப்பு தனிப்பட்ட ஒருவரை, குறிப்பாகச் சாத்தானை, குறிக்க வேண்டும் என்று வற்புறுத்தவில்லை. சுற்றியுள்ள பகுதியும் தீங்கிற்கு ஒருவர் எவ்வாறு பதிலளிக்க வேண்டும் என்ற ஒழுக்க அறிவுறுத்தலைப் பற்றியது. ஆகவே, மூலத்தில் இல்லாத தனிப்பட்ட இறையியல் குறிப்பை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, நேரடியான ஒருமை ஏவல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தோற்கடிக்கப்படாதே/தோற்கடி’ என்ற இணைச்சொல் அமைப்பு மூலத்தின் செயப்பாட்டு–செய்வினை மாறுபாட்டையும் νικάω என்ற சொல்லின் மீளுரைப்பையும் காக்கிறது. அடிக்குறிப்பு குறி தொடர்புடைய கூற்றின் முடிவில் இடம்பெற்றுள்ளது.
