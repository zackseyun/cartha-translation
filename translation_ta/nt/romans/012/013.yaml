revisions:
- from: பரிசுத்த மக்களின் தேவைகளில் பங்குகொள்ளுங்கள்.[a] விருந்தோம்பலை ஆர்வத்துடன் நாடுங்கள்.[b]
  to: பரிசுத்த மக்களின் தேவைகளுக்குப் பங்களியுங்கள்.[a] விருந்தோம்பலை ஆர்வத்துடன் நாடுங்கள்.[b]
  rationale: 'The first clause has been revised to express naturally and precisely the contextual sense of κοινωνοῦντες: contributing toward the practical needs of the holy people. The alternative rendering preserves the broader participation wording. The second clause and its note require no change.'
