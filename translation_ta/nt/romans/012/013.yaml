  text: ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/013.yaml
  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: ta
  text: பரிசுத்த மக்களின் தேவைகளுக்குப் பங்களியுங்கள்.[a] விருந்தோம்பலை ஆர்வத்துடன் நாடுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த மக்களின் தேவைகளை நிறைவேற்றுவதில் பங்குகொள்ளுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “விருந்தோம்பல்” என்பது அந்நியர்களை வரவேற்று உபசரிப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: தேவைகளில்
  rationale: இங்கு χρεία நடைமுறை வாழ்க்கைத் தேவைகளைக் குறிக்கிறது. ‘தேவைகள்’ என்பது இயல்பான நவீனத் தமிழாகவும், பொருள் அல்லது பிற உதவிகளை உள்ளடக்கும் பரந்த சொல்லாகவும் உள்ளது.
- source_word: ἁγίων
  choice: பரிசுத்த மக்களின்
  rationale: பவுலின் வழக்கில் ἅγιοι என்பது கிறிஸ்துவைச் சேர்ந்த விசுவாசிகள் அனைவரையும் குறிக்கிறது. ‘பரிசுத்த மக்கள்’ என்பது பின்னாளில் தனிப்பட்ட சிலருக்கு மட்டும் வழங்கப்பட்ட பட்டம் என்ற எண்ணத்தைத் தவிர்த்து, தேவனுக்கெனப் பிரித்தெடுக்கப்பட்ட மக்கள் என்ற அடையாளத்தைப் பாதுகாக்கிறது.
- source_word: κοινωνοῦντες
  choice: பங்குகொள்ளுங்கள்
  rationale: κοινωνέω என்பது பங்குகொள்ளுதல், பகிர்ந்துகொள்ளுதல், உதவியளித்தல் ஆகிய பொருட்களைத் தரலாம். தேவைகளைச் சந்திப்பதில் செயல்படையாகப் பங்கேற்பதை ‘பங்குகொள்ளுங்கள்’ காட்டுகிறது; இதை பண உதவிக்கு மட்டும் சுருக்கவில்லை.
- source_word: φιλοξενίαν
  choice: விருந்தோம்பலை
  rationale: φιλοξενία குறிப்பாக அந்நியரையும் வரவேற்று உபசரிக்கும் அன்பைக் குறிக்கலாம். ‘விருந்தோம்பல்’ இயல்பான தமிழ் இணைச்சொல்; அதன் அந்நியரை வரவேற்கும் பரிமாணம் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: διώκοντες
  choice: ஆர்வத்துடன் நாடுங்கள்
  rationale: διώκω என்பதில் தீவிரமாகப் பின்தொடர்தல் அல்லது முனைப்புடன் நாடுதல் என்ற வலிமை உள்ளது. ‘ஆர்வத்துடன் நாடுங்கள்’ என்பது விருந்தோம்புவதற்கான வாய்ப்புகளைச் செயல்படையாகத் தேடும் கருத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘பரிசுத்த மக்கள்’ என்பவர்களின் அடையாளம்
  choice: கிறிஸ்துவைச் சேர்ந்த விசுவாசிகள், தேவனுக்கெனப் பிரித்தெடுக்கப்பட்ட மக்கள்
  alternative: பின்னாளில் திருச்சபையால் சிறப்பாக அங்கீகரிக்கப்பட்ட சில ‘புனிதர்கள்’ மட்டும்
  rationale: பவுலின் கடிதங்களில் οἱ ἅγιοι என்பது பொதுவாக விசுவாசிகளின் சமூகத்தைக் குறிக்கிறது. எனவே மொழிபெயர்ப்பு அதை ஒரு பிற்காலச் சிறப்புப் பிரிவாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பங்கேற்பு வினை வடிவங்கள் சூழலுக்கேற்ற கட்டளை வாக்கியங்களாக வழங்கப்பட்டுள்ளன; இரு அறிவுறுத்தல்களின் செயற்பாட்டு வலிமையும் காக்கப்பட்டுள்ளது.
