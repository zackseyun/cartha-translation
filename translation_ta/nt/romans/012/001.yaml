id: ROM.12.1
reference: Romans 12:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: ta
  text: 'ஆகையால், சகோதரர்களே,[a] கடவுளுடைய இரக்கங்களை முன்னிட்டு நான் உங்களிடம் வேண்டிக்கொள்கிறேன்: உங்கள் உடல்களை உயிருள்ளதும் பரிசுத்தமானதும் கடவுளுக்கு உகந்ததுமான பலியாக அர்ப்பணியுங்கள். இதுவே உங்கள் பகுத்தறிவுக்கேற்ற வழிபாடு.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளே”; கிரேக்கத்தில் “சகோதரர்களே” என்று உள்ளது. ஆண்பால் வடிவிலுள்ள இச்சொல் கலப்புக் குழுவையும் அடிக்கடி குறிக்கும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உங்கள் ஆவிக்குரிய வழிபாடு” அல்லது “உங்கள் அறிவார்ந்த சேவை.” கிரேக்கச் சொற்றொடர் பகுத்தறிவான, பொருத்தமான, அறிவார்ந்த அல்லது ஆவிக்குரிய சேவை/வழிபாடு என்ற பொருள் நிழல்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: நான் உங்களை வேண்டிக்கொள்கிறேன்
  rationale: இது வெறும் கோரிக்கையல்ல, அக்கறையுடனும் அதிகாரத்துடனும் விடுக்கப்படும் ஊக்கமான வேண்டுகோள்; நவீனத் தமிழில் இயல்பாக அந்த வலிமையைத் தருகிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: ரோமர் 1–11 இல் முன்வைக்கப்பட்டவற்றிலிருந்து வரும் முடிவையும் நடைமுறை அழைப்பையும் தெளிவாகக் குறிக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை அழைப்பை முதன்மை உரையில் காக்கிறது; கலப்புக் குழுவையும் குறிக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: கடவுளுடைய இரக்கங்களை முன்னிட்டு
  rationale: διά + genitive இங்கு வேண்டுகோளின் அடிப்படையைக் குறிக்கிறது; οἰκτιρμῶν என்பதன் பன்மையையும் காக்கிறது.
- source_word: παραστῆσαι
  choice: அர்ப்பணியுங்கள்
  rationale: பலியிடும் சூழலில் ஒருவருடைய உடலைக் கடவுளிடம் ஒப்புவித்தலை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் 'முன்வையுங்கள்' என்பதைவிட பலி உருவகத்தைத் தெளிவாக இணைக்கிறது.
- source_word: τὰ σώματα ὑμῶν
  choice: உங்கள் உடல்களை
  rationale: சரீரம் என்ற சொல் குறிக்கக்கூடிய முழு உடல்சார் வாழ்வை மிகைப்படுத்தி விளக்காமல், மூலத்தின் தெளிவான 'உடல்கள்' என்ற சொல்லைக் காக்கிறது.
- source_word: θυσίαν ζῶσαν
  choice: உயிருள்ள ... பலியாக
  rationale: இறந்த பலிக்கு மாறான பவுலின் நோக்கமுள்ள முரணுருவகத்தை காக்கிறது.
- source_word: ἁγίαν
  choice: பரிசுத்தமான
  rationale: கடவுளுக்கெனப் பிரித்துவைக்கப்பட்ட பலியின் தன்மையைத் தெரிவிக்கும் நிலையான, கண்ணியமான வேதாகமத் தமிழ்.
- source_word: εὐάρεστον τῷ θεῷ
  choice: கடவுளுக்கு உகந்ததுமான
  rationale: கடவுளால் ஏற்றுக்கொள்ளத்தக்கதும் அவருக்கு மகிழ்ச்சியளிப்பதுமான பொருளை இயல்பாகத் தருகிறது; 'வெறும் அனுமதிக்கத்தக்கது' என்ற பலவீனமான உணர்வைத் தவிர்க்கிறது.
- source_word: λογικὴν
  choice: பகுத்தறிவுக்குரிய
  rationale: λογικός என்பதிலுள்ள அறிவார்ந்த, பொருத்தமான, சிந்தனையுடன் கூடிய என்ற பரப்பை முற்றிலும் 'ஆவிக்குரிய' என்று தீர்மானிக்காமல் காக்கிறது.
- source_word: λατρείαν
  choice: வழிபாடு
  rationale: கடவுளுக்குச் செலுத்தப்படும் ஆராதனைச் சேவையைக் குறிக்கிறது; இச்சூழலின் பலி மொழி அதன் சேவை சார்ந்த நிழற்பொருளையும் தாங்குகிறது.
theological_decisions:
- issue: கலப்புப் பாலின சபையைக் குறிக்கக்கூடிய ἀδελφοί என்ற அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவம் முதன்மை உரையில் காக்கப்படுகிறது; அச்சொல் முழுச் சபையையும் உள்ளடக்கக்கூடியது என்பது அடிக்குறிப்பில் வெளிப்படையாகத் தரப்படுகிறது.
- issue: λογικὴν λατρείαν என்பதன் பொருள்
  choice: உங்கள் பகுத்தறிவுக்குரிய வழிபாடு
  alternative: உங்கள் ஆவிக்குரிய வழிபாடு; உங்கள் அறிவார்ந்த சேவை
  rationale: இந்தச் சொற்றொடர் அறிவுக்குப் பொருத்தமானது, சிந்தனையுடன் கூடியது, ஆவிக்குரியது ஆகிய பொருள் நிழல்களைத் தாங்கக்கூடும். முதன்மை உரை மூலத்துக்கு நெருக்கமான வாசிப்பைத் தருகிறது; மாற்று வாசிப்புகள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- issue: διά + genitive மூலம் வேண்டுகோளின் அடிப்படை அல்லது கருவி
  choice: கடவுளுடைய இரக்கங்களை முன்னிட்டு
  alternative: கடவுளுடைய இரக்கங்களினால்
  rationale: இங்கு பவுல் கடவுளின் இரக்கச் செயல்களைத் தனது வேண்டுகோளின் அடிப்படையாக முன்வைக்கிறார் என்பதைக் காட்டுகிறது; கருவி என்ற சாத்திய நிழற்பொருளை முற்றிலும் மறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. 'உடல்கள்', 'உயிருள்ள பலி' போன்ற மூல உருவகங்கள் காக்கப்பட்டுள்ளன. 'கடவுள்', 'பரிசுத்தம்', 'வழிபாடு' ஆகியவை தெளிவான பொதுக் கிறிஸ்தவச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன; குறிப்பிட்ட திருச்சபை மரபின் தனிச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
