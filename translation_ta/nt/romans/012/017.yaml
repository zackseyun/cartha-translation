  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: ta
  text: யாருக்கும் தீமைக்குத் தீமை செய்யாதீர்கள்; எல்லா மக்களின் பார்வையிலும் நல்லவை எவையோ, அவற்றைச் செய்ய முன்கூட்டியே சிந்தியுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மதிப்புக்குரியவை” அல்லது “மாண்பானவை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: யாருக்கும்
  rationale: ἀποδιδόντες என்பதுடன் மறைமுகச் செயப்படுபொருளாக வரும் வேற்றுமை வடிவம்; எந்த நபரும் விலக்கல்ல என்ற பொதுவான வீச்சை இயல்பான தமிழில் தருகிறது.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: தீமைக்குத் தீமை
  rationale: முதல் κακόν ஒழுக்கத் தீமையைத் தக்கவைக்கிறது; ἀντί இங்கு பதில்செயல் அல்லது கைம்மாறு என்ற பொருளுடையதால், நிலையான தமிழ் இணைப்பு அதைப் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: ἀποδιδόντες
  choice: செய்யாதீர்கள்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘திருப்பிக் கொடுத்தல்/கைம்மாறு செய்தல்.’ ஆனால் ‘தீமைக்குத் தீமை செய்யாதீர்கள்’ என்பது பழிவாங்கும் பதில்செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; சூழலில் பங்கேற்பெயருக்கு அறிவுறுத்தல் வலிமை உள்ளது.
- source_word: προνοούμενοι
  choice: செய்யக் கவனமாயிருங்கள்
  rationale: முன்கூட்டியே சிந்தித்து அக்கறையுடன் பார்த்துக்கொள்வது என்ற deliberative பொருளைத் தருகிறது; வெறும் மனச்சிந்தனையாக மட்டுப்படுத்தாமல் நடைமுறை நோக்கையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καλὰ
  choice: நல்லவை எவையோ அவற்றை
  rationale: ஒழுக்கரீதியாக நல்லது என்பதையும், மதிப்புக்குரியது/மாண்பானது என்பதையும் உள்ளடக்கக்கூடிய அகலமான சொல்லாட்சி.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: எல்லா மனிதர்களின் பார்வையிலும்
  rationale: ἐνώπιον என்பதன் ‘முன்பாக/பார்வையில்’ என்ற பொது வெளிப்படைத் தன்மையையும், ἀνθρώπων என்பதன் பாலினம் சாராத மனிதகுலப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: பொது வெளியில் καλά என்பதன் ஒழுக்க மற்றும் மாண்பு நுணுக்கம்
  choice: நல்லவை
  alternative: மதிப்புக்குரியவை / மாண்பானவை
  rationale: முதன்மை உரையில் ‘நல்லவை’ என்பது ஒழுக்க நன்மையைச் சமூகத் தோற்றத்துக்குள் சுருக்காமல் அகலமாக வைத்திருக்கிறது; பொதுமக்களின் பார்வையில் மதிப்புக்குரியது அல்லது மாண்பானது என்ற உண்மையான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. இரண்டு கிரேக்கப் பங்கேற்பெயர்களின் அறிவுறுத்தல் வலிமை நேரடி ஏவல் வடிவில் வெளிப்படுத்தப்பட்டுள்ளது; இரண்டாம் பகுதியின் முன்நோக்கிச் சிந்திக்கும் நுணுக்கம் ‘கவனமாயிருங்கள்’ என்பதில் காக்கப்பட்டுள்ளது.
