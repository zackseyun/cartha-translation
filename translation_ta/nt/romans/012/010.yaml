  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: ta
  text: சகோதர அன்பில் ஒருவருக்கொருவர் உறவுப்பாசமுள்ளவர்களாய் இருங்கள்; மதிப்பளிப்பதில் ஒருவருக்கொருவர் முந்திச் செல்லுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவருக்கொருவர் மதிப்பளிப்பதில் முன்னுரிமை அளியுங்கள்.”
    reason: προηγούμενοι என்பதன் ‘முன்னிலை எடுத்தல்’ என்ற பொருளிலிருந்து வரும், பிறருக்கு மரியாதை காட்டுவதில் அவர்களை முன்னிலைப்படுத்தும் விளக்க வாய்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: சகோதர அன்பில்
  rationale: இது விசுவாசச் சமூகத்தினரிடையே நிலவும் குடும்பத்தன்மையுள்ள அன்பைக் குறிக்கிறது; பாலின வரம்பை உணர்த்தாமல், தமிழில் நிலைபெற்றுள்ள உள்ளடக்கமிக்க சொற்றொடர்.
- source_word: φιλόστοργοι
  choice: ஆழ்ந்த பாசம் கொண்டிருங்கள்
  rationale: குடும்ப உறுப்பினர்களிடையே இயல்பாகக் காணப்படும் கனிவான பாசத்தை φιλόστοργοι குறிக்கிறது. ‘அன்பாயிருங்கள்’ என்பதைக் காட்டிலும் இதன் குடும்பப் பாச நுண்ணர்த்தத்தை இத்தொடர் தெளிவாகத் தருகிறது.
- source_word: τιμῇ
  choice: மதிப்புக் கொடுப்பதில்
  rationale: τιμή இங்கு பிறருக்கு அளிக்கப்படும் கண்ணியம் அல்லது மதிப்பைக் குறிக்கிறது; நவீனத் தமிழில் செயற்பாட்டுத் தன்மையுடன் இயல்பாக ஒலிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: προηγούμενοι
  choice: முந்திக்கொள்ளுங்கள்
  rationale: சொல் முன்னே செல்வது அல்லது வழிநடத்துவது என்ற படிமத்தைக் கொண்டது. பிறருக்கு மதிப்பளிப்பதில் மற்றவர்களை மிஞ்ச முயலும் தீவிரத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது; மாற்று புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: τῇ τιμῇ ἀλλήλους προηγούμενοι என்பதன் பொருள்
  choice: ஒருவருக்கொருவர் மதிப்புக் கொடுப்பதில் முந்திக்கொள்ளுங்கள்
  alternative: ஒருவருக்கொருவர் மதிப்புக் கொடுப்பதில் முன்மாதிரியாக இருங்கள்; அல்லது, ஒருவரை ஒருவர் தங்களுக்கு முன்னானவர்களாகக் கருதுங்கள்
  rationale: προηγέομαι என்பதற்கு ‘முன்னே செல்லுதல்/முன்னிலை வகித்தல்’ என்ற பொருளும், சில விளக்கங்களில் ‘மற்றவரை முன்னிலைப்படுத்துதல்’ என்ற பொருளும் கொள்ளப்படுகின்றன. பிரதான உரை ஊக்கமிக்க கட்டளையையும் ஆங்கில ஆலோசனை அடுக்கின் ‘outdo’ என்பதையும் பிரதிபலிக்கிறது; உண்மையான விளக்க வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதவாக்கியத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘ஒருவர்மேல் ஒருவர்’ குடும்பப் பாசத்தின் பரஸ்பரத் தன்மையையும், ‘ஒருவருக்கொருவர்’ மதிப்பளிப்பின் பரஸ்பரச் செயலையும் தெளிவுபடுத்துகின்றன.
