  edition: SBLGNT
  text: εὐλογεῖτε τοὺς ⸀διώκοντας, εὐλογεῖτε καὶ μὴ καταρᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: ta
  text: உங்களைத் துன்புறுத்துகிறவர்களை[a] ஆசீர்வதியுங்கள்; ஆசீர்வதியுங்கள், சபிக்காதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களைப் பின்தொடர்கிறவர்களை.’ கிரேக்க வினைச்சொல் ‘பின்தொடர்’ என்றும் பொருள்படலாம்; ஆனால் இங்கு விரோதமாகத் துன்புறுத்துவதையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: ஆசீர்வதியுங்கள்
  rationale: εὐλογέω என்பதன் பன்மை ஏவல் வடிவம். கடவுளின் நன்மையை வேண்டுவதையும் நன்மையாகப் பேசுவதையும் உள்ளடக்கும் இயல்பான, சுருக்கமான தமிழ் இணை இது. பவுலின் வலியுறுத்தலைக் காக்க மறுபடியும் வரும் சொல்லும் அப்படியே வைக்கப்பட்டுள்ளது.
- source_word: τοὺς διώκοντας
  choice: உங்களைத் துன்புறுத்துகிறவர்களை
  rationale: கட்டுரையுடன் வரும் நிகழ்காலப் பங்கேற்புவினை பெயர்ச்சொல் போலச் செயல்பட்டு, விரோதமாகத் துன்புறுத்துவோரைக் குறிக்கிறது. கிரேக்கச் சொல் பொதுவாகப் ‘பின்தொடர்தல்’ என்றும் பொருள்படலாம்; ஆனால் இச்சூழலில் ‘துன்புறுத்துதல்’ பொருத்தமானது. தமிழில் கருத்தை இயல்பாகத் தெளிவுபடுத்த ‘உங்களை’ சேர்க்கப்பட்டுள்ளது.
- source_word: καὶ
  choice: (தமிழில் தனிச் சொல்லாக வெளிப்படுத்தப்படவில்லை)
  rationale: இங்கு καὶ மீண்டும் கூறப்படும் நேர்மறைக் கட்டளையையும் எதிர்மறைத் தடையையும் இணைக்கிறது. தமிழ் நடைமுறையில் அரைப்புள்ளியும் அடுத்தடுத்த கட்டளைகளும் அந்த இணைப்பை இயல்பாக வெளிப்படுத்துவதால், தனியாக ‘மற்றும்’ சேர்ப்பது கடினமான நடையை உண்டாக்கும்.
- source_word: μὴ καταρᾶσθε
  choice: சபிக்காதீர்கள்
  rationale: μή உடன் வரும் ஏவல் வடிவம் தடையைத் தெரிவிக்கிறது. ‘சபிக்காதீர்கள்’ என்பது சுருக்கமாகவும் தெளிவாகவும் இருந்து, ‘ஆசீர்வதியுங்கள்’ என்பதுடனான நேரெதிர் வேறுபாட்டைக் காக்கிறது.
theological_decisions:
- issue: இச்சூழலில் διώκω என்பதன் பொருள் வரம்பு
  choice: விரோதமாகத் துன்புறுத்துகிறவர்கள்
  alternative: உங்களைப் பின்தொடர்கிறவர்கள்
  rationale: διώκω என்பதற்கு ‘பின்தொடர்’ என்ற பரந்த பொருள் இருக்கலாம். எனினும், பவுலின் நெறிப் போதனைச் சூழலும் ஆசீர்வதித்தல்–சபித்தல் என்ற முரணும் இங்கு விரோதமான துன்புறுத்தலைச் சுட்டுகின்றன. மூலத்தின் சொற்பொருள் அகலத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மரியாதைப் பன்மை ஏவல் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் மீளுரையும் ஆசீர்வாதம்–சாபம் என்ற வலுவான எதிர்மறையும் பாதுகாக்கப்பட்டுள்ளன.
