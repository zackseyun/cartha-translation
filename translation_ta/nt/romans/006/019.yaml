source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: ta
  text: உங்கள் மாம்சத்தின்[a] பலவீனத்தினால் நான் மனிதருக்குரிய முறையில் பேசுகிறேன். நீங்கள் முன்பு உங்கள் உடல் உறுப்புகளை அசுத்தத்திற்கும் அக்கிரமத்திற்கும் அடிமைகளாக ஒப்புக்கொடுத்தீர்கள்; அது அக்கிரமத்திற்கு வழிவகுத்தது. அதுபோல, இப்போது உங்கள் உடல் உறுப்புகளை நீதிக்கு[b] அடிமைகளாக ஒப்புக்கொடுங்கள்; அது பரிசுத்தத்திற்கு வழிவகுக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “மாம்சம்” என்பதை விளக்கமாக “பாவ இயல்பு” என்றும் புரிந்துகொள்ளலாம்; ஆனால் கிரேக்கச் சொல் அதைவிட விரிவான பொருளைத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நியாயத்திற்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: நான் மனிதர்கள் புரிந்துகொள்ளும் முறையில் பேசுகிறேன்
  rationale: மனிதப் புரிதலுக்கு ஏற்ற சொல்லாட்சியைப் பவுல் பயன்படுத்துகிறார் என்பதைக் காட்டும் இயல்பான தமிழ்; இதை குறிப்பாக ‘உவமை’ என்று சுருக்கவில்லை.
- source_word: ἀσθένειαν
  choice: பலவீனம்
  rationale: உடல் அல்லது ஒழுக்க வரம்பு என்று தேவையின்றிக் குறுக்காமல், கிரேக்கச் சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: σαρκὸς
  choice: மாம்சத்தின்
  rationale: ‘பாவ இயல்பு’ என்று விளக்கி முடிவுசெய்யாமல், உடல்சார்ந்த மனித இருப்பையும் அதன் வீழ்ச்சியுற்ற பலவீனத்தையும் உள்ளடக்கக்கூடிய கிரேக்கச் சொல்லின் அகலத்தைத் தக்கவைக்கிறது.
- source_word: παρεστήσατε / παραστήσατε
  choice: ஒப்புக்கொடுத்தீர்கள் / ஒப்புக்கொடுங்கள்
  rationale: கடந்தகால நடத்தைக்கும் தற்போதைய கட்டளைக்கும் இடையிலுள்ள ஒரே வினைச்சொல் தொடர்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: μέλη
  choice: உடல் உறுப்புகள்
  rationale: வெறும் ‘உறுப்புகள்’ என்பதைக் காட்டிலும் சாதாரண வாசகருக்குத் தெளிவாக இருந்து, உடல் உறுப்புகள் மற்றும் அவற்றின் செயல்திறன்களைக் குறிக்கும் பவுலின் பயன்பாட்டை வெளிப்படுத்துகிறது.
- source_word: δοῦλα
  choice: அடிமைகளாக
  rationale: ரோமர் 6-இல் மையமான எஜமானத்துவம் மற்றும் முழுக் கட்டுப்பாடு என்ற அடிமைத்தன உருவகத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἀκαθαρσίᾳ
  choice: அசுத்தத்திற்கு
  rationale: ஒழுக்கக் களங்கம் என்ற பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: அக்கிரமத்திற்கும் / அக்கிரமத்துக்கு
  rationale: இரு இடங்களிலும் ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்தி, அக்கிரமம் மேலும் அக்கிரமத்துக்கு இட்டுச் செல்லும் என்ற சொல்லடுக்கைத் தக்கவைக்கிறது.
- source_word: εἰς τὴν ἀνομίαν
  choice: அக்கிரமத்துக்கு இட்டுச் செல்லும்படி
  rationale: εἰς காட்டக்கூடிய திசை அல்லது விளைவு இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δικαιοσύνῃ
  choice: நீதிக்கு
  rationale: அசுத்தம் மற்றும் அக்கிரமத்திற்கு எதிரான ஒழுக்கநிலையைச் சுட்டுகிறது; ‘நியாயம்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἰς ἁγιασμόν
  choice: பரிசுத்தமடைவதற்கு இட்டுச் செல்லும்படி
  rationale: பரிசுத்த நிலையை நோக்கிய நகர்வு அல்லது அதன் விளைவு என்ற செயல்முறைத் தன்மையை, கடினமான பெயர்ச்சொல் நடையைத் தவிர்த்து இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘உங்கள் மாம்சத்தின் பலவீனம்’ என்பதில் σάρξ என்பதன் பொருள்
