- issue: பவுலின் பயன்பாட்டில் δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: இவ்வசனத்தில் அசுத்தத்திற்கும் அக்கிரமத்திற்கும் எதிரான நீதியான வாழ்வு முதன்மையாக உள்ளது; நீதி/நியாயம் என்ற பொருள் அகலத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: ἁγιασμός என்பதில் நிலை அல்லது செயல்முறை
  choice: பரிசுத்தமடைவது
  alternative: பரிசுத்தம்
  rationale: εἰς உடன் வரும் இச்சொல் பரிசுத்தத்தை நோக்கிய நகர்வையோ அதன் விளைவையோ குறிக்கிறது; மொழிபெயர்ப்பு அந்த இயக்கத்தை வெளிப்படுத்துகிறது, ஆனால் அது மனித முயற்சியால் மட்டும் நிகழ்கிறது என்று தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சம்’, ‘அடிமைகள்’, ‘பரிசுத்தமடைவது’ போன்ற பவுலின் முக்கிய உருவக மற்றும் இறையியல் சொற்கள் மெலிதாக்கப்படாமல் வைக்கப்பட்டுள்ளன; ‘உடல் உறுப்புகள்’ மற்றும் ‘ஒப்புக்கொடுங்கள்’ போன்ற சொற்கள் சாதாரண வாசகருக்கான தெளிவை வழங்குகின்றன.
