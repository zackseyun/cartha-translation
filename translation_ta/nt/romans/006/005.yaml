source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: ta
  text: ஏனெனில், அவருடைய மரணத்தின் சாயலில் நாம் அவரோடு ஒன்றிணைந்தவர்களாக[a] ஆகியிருக்கிறோம் என்றால், அவருடைய உயிர்த்தெழுதலின் சாயலிலும் அவரோடு ஒன்றிணைந்தவர்களாக இருப்போம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரோடு சேர்ந்து வளர்ந்தவர்களாக.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொல்லுக்கு நெருக்கமாக, ‘ஆனால் உயிர்த்தெழுதலுக்கும் இருப்போம்’ என்று உள்ளது. முதல் கூறிலுள்ள ‘அவரோடு ஒன்றிணைந்தவர்களாக’ என்பதும் ‘சாயல்’ என்பதும் இங்கே பொருளில் எடுத்துக்கொள்ளப்பட்டுள்ளன.
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: அவரோடு ஒன்றிணைந்தவர்களாக
  rationale: இந்தச் சொல் இயற்கையாக ஒன்றாக வளர்தல் அல்லது உயிரோட்டமுள்ள இணைப்பில் பங்குகொள்ளுதல் என்ற கருத்தைக் கொண்டுள்ளது. ‘அவரோடு ஒன்றிணைந்தவர்களாக’ என்பது கிறிஸ்துவுடனான உறவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இணைப்பு எவ்வாறு நிகழ்கிறது என்பதைத் தேவையின்றி வரையறுப்பதில்லை.
- source_word: γεγόναμεν
  choice: ஆகியிருக்கிறோம்
  rationale: இறந்தகாலத்தில் நிகழ்ந்து இப்போது தொடரும் விளைவை கிரேக்க நிறைவுக்காலம் சுட்டுகிறது. ‘ஆகியிருக்கிறோம்’ அந்தக் காலநிலையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: τῷ ὁμοιώματι
  choice: சாயலில்
  rationale: உறவு அல்லது நிலையைக் குறிக்கக்கூடிய வேற்றுமையை ‘சாயலில்’ இயல்பாக வெளிப்படுத்துகிறது; ‘ஒத்த தன்மை’ என்ற கருத்தைப் பாதுகாத்து, பங்கேற்பின் துல்லியமான விதத்தை விளக்கிச் சொல்லவில்லை.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: அவருடைய மரணத்தின்
  rationale: நேரடியான உரிமைத் தொடர்பைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: ἀλλὰ καὶ
  choice: நிச்சயமாக ... உம்
  rationale: முதல் கூறிலிருந்து இரண்டாம் கூறுக்குச் செல்லும் வலியுறுத்தலை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τῆς ἀναστάσεως
  choice: அவருடைய உயிர்த்தெழுதலின் சாயலிலும்
  rationale: கிரேக்கத்தில் ‘அவருடைய’ என்பதும் ‘சாயல்’ என்பதும் மீண்டும் எழுதப்படாவிட்டாலும், முந்தைய கூறின் இணை அமைப்பு அவற்றை உணர்த்துகிறது. தமிழில் அவற்றைத் திரும்பச் சொல்வது பொருளைத் தெளிவாக்குகிறது; அந்த நிரப்புதலை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: ἐσόμεθα
  choice: ஒன்றிணைந்தவர்களாக இருப்போம்
  rationale: கிரேக்கத்தில் ‘இருப்போம்’ என்ற வினைக்கு முதல் கூறிலுள்ள σύμφυτοι என்பதன் பயனிலை மனத்தில் நிரப்பப்படுகிறது. தமிழில் அதை மீண்டும் கூறுவது வாக்கியத்தை முழுமையாக்குகிறது.
theological_decisions:
- issue: கிறிஸ்துவின் மரணத்திலும் உயிர்த்தெழுதலிலும் பங்குபெறும் ஒன்றிணைப்பு எந்த விதத்தில் நிகழ்கிறது என்பது
  choice: ‘அவரோடு ஒன்றிணைந்தவர்களாக ... சாயலில்’ என்று மொழிபெயர்த்து, உண்மையான பங்கேற்பையும் ‘சாயல்’ என்ற வரையறையையும் இரண்டையும் பாதுகாத்தல்
  alternative: இதைச் சடங்கு சார்ந்ததாகவோ, மறைஞான ஒன்றிப்பாகவோ, வெறும் உருவக ஒற்றுமையாகவோ வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க உரை உண்மையான இணைப்பைக் கூறினாலும், அதன் செயல்முறையை இவ்வசனத்தில் வரையறுப்பதில்லை. ஆகவே அதன் இறையியல் இழுபறி தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்டதாக அமைக்கப்பட்டுள்ளது. ‘சாயல்’ என்ற சொல் ὁμοίωμα என்பதன் திறந்த பொருளைத் தக்கவைக்கிறது; ‘ஒன்றிணைந்தவர்களாக’ என்பது அளவுக்கு மீறிய சமயப் பிரிவுச் சொற்களைத் தவிர்க்கிறது.
