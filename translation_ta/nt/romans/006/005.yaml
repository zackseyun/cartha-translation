revisions:
- from: ஏனெனில், அவருடைய மரணத்தின் சாயலில் நாம் அவரோடு ஒன்றிணைந்தவர்களாக[a] ஆகியிருக்கிறோம் என்றால், அவருடைய உயிர்த்தெழுதலின் சாயலிலும் நிச்சயமாக அவரோடு ஒன்றிணைந்தவர்களாக இருப்போம்.[b]
  to: ஏனெனில், அவருடைய மரணத்தின் சாயலில் நாம் அவரோடு ஒன்றிணைந்தவர்களாக[a] ஆகியிருக்கிறோம் என்றால், அவருடைய உயிர்த்தெழுதலின் சாயலிலும் அவரோடு ஒன்றிணைந்தவர்களாக இருப்போம்.[b]
  rationale: The revision removes an unsupported intensifier while retaining the Greek’s coordinated resurrection affirmation through ‘சாயலிலும்.’ It also revises the explanatory footnote to reflect the Greek ellipsis faithfully, while clearly identifying the Tamil elements supplied from the first clause. No theological mechanism of union is added or resolved.
