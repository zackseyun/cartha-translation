  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: ta
  text: ஏனெனில், பாவம் உங்கள்மேல் ஆட்சி செலுத்தாது[a]; நீங்கள் சட்டத்தின் கீழ் அல்ல, அருளின் கீழ் இருக்கிறீர்களே, அதற்குக் காரணம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களை ஆண்டுகொள்ளாது.’
    reason: lexical_alternative
  - marker: b
    text: ‘சட்டத்தின் கீழ்’ என்பது சட்டத்தின் அதிகாரம் அல்லது ஆளுகைக்கு உட்பட்டிருப்பதைக் குறிக்கும் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: பாவம்
  rationale: பவுலின் வழக்கமான சொல்லாட்சிக்கேற்ற நிலையான மொழிபெயர்ப்பு. பாவம் இங்கு ஆட்சி செலுத்தும் ஓர் ஆற்றலாக உருவகப்படுத்தப்பட்டாலும், அதைத் தனிப்பெயர்போல் காட்டாமல் மூலத்தின் அளவிலேயே உருவகத்தைப் பேணுகிறது.
- source_word: κυριεύσει
  choice: ஆட்சி செலுத்தாது
  rationale: ஆண்டுகொள்ளுதல் அல்லது அதிகாரம் செலுத்துதல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; பாவம் ஓர் ஆட்சியாளரைப்போல் உருவகிக்கப்படுவதையும் பேணுகிறது.
- source_word: ὑπὸ νόμον
  choice: சட்டத்தின் கீழ்
  rationale: சட்டத்தின் அதிகாரம் அல்லது ஆளுகைக்கு உட்பட்ட நிலையைச் சுட்டும் பவுலின் சொல்லாட்சியைப் பேணுகிறது. சூழலில் இது மோசேயின் சட்ட ஒழுங்கை இயல்பாகக் குறித்தாலும், மொழிபெயர்ப்பு அதை விளக்கமாகச் சேர்த்து குறுக்கவில்லை.
- source_word: χάριν
  choice: அருள்
  rationale: பவுலின் சட்டம்–அருள் எதிரிணைக்கு ஏற்ற, நிலைபெற்றதும் இறையியல் வலிமை கொண்டதுமான தமிழ் சொல்.
- source_word: γὰρ … γάρ
  choice: ஏனெனில் … ;
  rationale: முதல் γὰρ முந்தைய கருத்துக்கான காரணத் தொடர்பாக ‘ஏனெனில்’ என்று வெளிப்படுத்தப்படுகிறது. இரண்டாவது γάρ-இன் விளக்கத் தொடர்பு தமிழில் அரைப்புள்ளிக்குப் பின்வரும் வாக்கிய அமைப்பால் இயல்பாகத் தெளிவாகிறது; மீண்டும் ‘ஏனெனில்’ எனச் சொல்வது தவிர்க்கப்படுகிறது.
theological_decisions:
- issue: பாவத்தை ஆளும் ஓர் ஆற்றலாக உருவகப்படுத்துவதை எவ்வளவு வெளிப்படையாக்குவது
  choice: ‘பாவம் உங்கள்மேல் ஆட்சி செலுத்தாது’ என்று மொழிபெயர்த்தல்
  alternative: ‘பாவம் உங்களை ஆண்டுகொள்ளாது’
  rationale: மூலம் பாவத்தை ஆட்சிசெய்யும் ஆற்றலாக உருவகிக்கிறது; தேர்ந்தெடுத்த மொழி அந்த உருவகத்தைப் பேணுகிறது, ஆனால் தனிப்பெயராக்குதல் அல்லது கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: ὑπὸ νόμον என்பதில் νόμος எந்தச் சட்டத்தைக் குறிக்கிறது என்பதை உரையிலேயே வெளிப்படையாகக் குறிப்பிடுவதா
  choice: ‘சட்டத்தின் கீழ்’ என்று பொதுவான வடிவைப் பேணுதல்
  alternative: ‘மோசேயின் சட்டத்தின் கீழ்’
  rationale: ரோமர் எழுதிய சூழலில் மோசேயின் சட்ட ஒழுங்கு இயல்பான குறிப்பு என்றாலும், கிரேக்க உரையில் ‘மோசேயின்’ என்பது வெளிப்படையாக இல்லை. ஆகவே மொழிபெயர்ப்பு அந்தச் சூழல்சார் புரிதலைக் கட்டாய விளக்கமாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ போன்ற பழைய அல்லது குறிப்பிட்ட மரபுசார் சொல்லுக்குப் பதிலாக ‘சட்டம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘கீழ்’ என்ற இணை அமைப்பு சட்டம்–அருள் எதிரிணையைத் தெளிவாகப் பேணுகிறது.
