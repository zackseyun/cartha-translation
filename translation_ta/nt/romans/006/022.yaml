id: ROM.6.22
reference: Romans 6:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: ta
  text: ஆனால் இப்போது, பாவத்திலிருந்து விடுவிக்கப்பட்டு, கடவுளுக்கு அடிமைகளாக்கப்பட்ட நீங்கள், பரிசுத்தமாகுதலுக்கு வழிநடத்தும் உங்கள் கனியைப் பெற்றிருக்கிறீர்கள்; இறுதி விளைவோ நித்திய வாழ்வு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முடிவு.”
    reason: τέλος இச்சூழலில் வெறும் நிறுத்தத்தை அல்லாமல் எட்டப்படும் இறுதி விளைவைக் குறிக்கலாம்.
lexical_decisions:
- source_word: νυνὶ δέ
  choice: ஆனால் இப்போது
  rationale: முந்தைய பாவ அடிமைத்தன நிலையோடு பவுல் காட்டும் வலுவான முரண்பாட்டை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: பாவத்திலிருந்து விடுவிக்கப்பட்டு
  rationale: இறந்தகாலச் செயலின் விளைவையும் செயப்படுபொருள் நிலையையும் காத்து, பாவம் ஓர் ஆளும் வல்லமை அல்லது ஆட்சித்தளம் என்ற ஒருமை உருவகத்தையும் தக்கவைக்கிறது.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: கடவுளுக்கு அடிமைகளாக்கப்பட்ட நீங்கள்
  rationale: δουλόω என்பதிலுள்ள வலுவான அடிமைத்தன உருவகத்தையும் செயப்படுபொருள் பொருளையும் மென்மைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: கனியைப் பெற்றிருக்கிறீர்கள்
  rationale: καρπός என்பதன் வேளாண்மை உருவகத்தைத் தக்கவைத்து, ἔχετε என்பதைக் காலநிலைக்கு ஏற்ற இயல்பான தமிழில் கூறுகிறது.
- source_word: εἰς ἁγιασμόν
  choice: பரிசுத்தமாகுதலுக்கு வழிநடத்தும்
  rationale: εἰς குறிக்கும் நோக்கம் அல்லது விளைவை வெளிப்படுத்தி, ἁγιασμός என்பதிலுள்ள பரிசுத்தமாகும் நிகழ்வுநிலையையும் காக்கிறது.
- source_word: τὸ δὲ τέλος
  choice: அதன் முடிவோ
  rationale: τέλος என்பதன் முடிவு, இறுதி விளைவு ஆகிய இரு சாத்தியங்களையும் தமிழில் ஓரளவு திறந்த நிலையில் வைக்கிறது; δέ குறிக்கும் மாறுபாட்டை ‘-ஓ’ வெளிப்படுத்துகிறது.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: நவீனத் தமிழில் பரவலாகப் புரியக்கூடிய, சொற்பொருளுக்குத் துல்லியமான இறையியல் வழக்கைத் தக்கவைக்கிறது.
theological_decisions:
- issue: கடவுளுடனான உறவில் அடிமைத்தன உருவகம்
  choice: கடவுளுக்கு அடிமைகளாக்கப்பட்ட
  alternative: கடவுளுக்குச் சேவை செய்கிறவர்களாக்கப்பட்ட
  rationale: ரோமர் 6-இல் பாவத்திற்கான முன்னைய அடிமைத்தனத்துக்கும் கடவுளுக்கான புதிய அடிமைத்தனத்துக்கும் இடையிலான திட்டமிட்ட எதிர்மறை ஒப்புமை முக்கியமானது; ‘சேவை’ என்று மென்மைப்படுத்துவது அந்த அழுத்தத்தைக் குறைக்கும்.
- issue: ἁγιασμός என்பதன் பொருள்
  choice: பரிசுத்தமாகுதல்
  alternative: பரிசுத்த நிலை
  rationale: இச்சூழலில் நிகழ்முறையும் அதன் விளைவான நிலையும் இரண்டும் சாத்தியம். முதன்மை உரை நிகழ்முறை நுணுக்கத்தைத் தக்கவைக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: τέλος என்பதன் நுணுக்கம்
  choice: முடிவு
  alternative: இறுதி விளைவு
  rationale: ‘முடிவு’ மூலச்சொல்லின் நேரடியான பொருளைக் காக்கிறது; இங்கு வெறும் நிறுத்தம் அல்ல, எட்டப்படும் விளைவு என்றும் பொருளாகலாம் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பாவத்திலிருந்து விடுதலை மற்றும் கடவுளுக்கான அடிமைத்தனம் என்ற பவுலின் இணையான உருவகங்கள் வலுவாகத் தக்கவைக்கப்பட்டுள்ளன; வாக்கியம் வாசிக்க எளிதாக இருக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
