id: ROM.6.4
reference: Romans 6:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: ta
  text: ஆகவே, தந்தையின் மகிமையால் மேசியா[a] இறந்தோரிலிருந்து எழுப்பப்பட்டதுபோல, நாமும் வாழ்வின் புதுமையில் நடக்கும்படியாக, திருமுழுக்கின் வழியாக மரணத்திற்குள் அவரோடு அடக்கம் செய்யப்பட்டோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: கிறிஸ்து.'
    reason: Χριστός என்பதற்கான பரவலான மரபு மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: συνετάφημεν
  choice: அவரோடு அடக்கம் செய்யப்பட்டோம்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் συν- என்பதன் ‘உடன்’ என்ற பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் பவுலின் முடிவுரைத்தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: διὰ τοῦ βαπτίσματος
  choice: திருமுழுக்கின் வழியாக
  rationale: διά + genitive குறிக்கும் வழிமுறை அல்லது கருவிப் பொருளைப் பேணுகிறது; திருமுழுக்கின் விளைவைப் பற்றிய குறிப்பிட்ட திருச்சபைக் கோட்பாட்டை மொழிபெயர்ப்பே தீர்மானிக்கவில்லை.
- source_word: εἰς τὸν θάνατον
  choice: மரணத்திற்குள்
  rationale: εἰς என்பதன் திசைநோக்கிய பொருளையும் மரணத்திற்குள் இணைக்கப்படுதல் என்ற உருவகத்தையும் காக்கிறது.
- source_word: ἵνα
  choice: நடக்கும்படி
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα-வின் வலிமையை இயல்பான தமிழ் வினையெச்ச அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: Χριστὸς
  choice: மேசியா
  rationale: இங்கு Χριστός பட்டப்பெயராக உள்ளதால் அதன் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற மேசியத் தன்மையைப் பேணுகிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: இறந்தோரின் நிலையிலிருந்து எழுப்பப்படுதல் என்ற மூலமொழியின் கருத்தை நேரடியாகத் தருகிறது.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: தந்தையின் மகிமையால்
  rationale: διά என்பதன் கருவி அல்லது செயலாற்றும் வழிமுறைப் பொருளையும் δόξα என்பதன் ‘மகிமை’ என்ற விரிவான பொருளையும் பேணுகிறது.
- source_word: ἐν καινότητι ζωῆς
  choice: வாழ்வின் புதுமையில்
  rationale: பவுலின் கருத்துச் செறிவுள்ள அப்ஸ்ட்ராக்ட் சொற்றொடரைத் தட்டையான ‘புதிய வாழ்க்கை’ என மாற்றாமல் காக்கிறது.
- source_word: περιπατήσωμεν
  choice: நடக்கும்படி
  rationale: வாழ்க்கை நடத்தையை ‘நடத்தல்’ என்று கூறும் பவுலின் உருவகத்தைப் பேணுகிறது; நோக்கத்தைக் குறிக்கும் subjunctive-ஐ தமிழ் அமைப்பில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: διὰ τοῦ βαπτίσματος ஒரு குறிப்பிட்ட திருமுழுக்குக் கோட்பாட்டை கட்டாயப்படுத்துகிறதா
  choice: திருமுழுக்கின் வழியாக
  alternative: திருமுழுக்கினால்
  rationale: மூலத்தின் கருவி/வழிமுறைத் தொடர்பைப் பேணுகிறது; அதேவேளை திருமுழுக்கும் கிறிஸ்துவுடனான ஒன்றிப்பும் எவ்வாறு தொடர்புபடுகின்றன என்பதில் ஒரு பிரிவுசார்ந்த முடிவைத் திணிக்கவில்லை.
- issue: Χριστός என்பதை பட்டப்பெயராகவா மரபுப் பெயராகவா வழங்குவது
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் பட்டப்பெயரின் வலிமையை வெளிப்படையாகப் பேணுகிறது; பரவலான மரபு வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: διὰ τῆς δόξης τοῦ πατρός என்பதில் ‘மகிமை’யை ‘வல்லமை’ என விளக்கிப் பெயர்ப்பதா
  choice: தந்தையின் மகிமையால்
  alternative: தந்தையின் வல்லமையால்
  rationale: δόξα என்பதன் பரந்த இறையியல் நிறையைப் பேணி, அதன் பொருளை வல்லமை என்ற ஒரே அம்சத்திற்குள் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘திருமுழுக்கு’ தெளிவான தமிழ்ச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; ‘ஞானஸ்நானம்’ தவிர்க்கப்பட்டது. ‘வாழ்வின் புதுமையில் நடக்க’ என்பது மூலத்தின் அப்ஸ்ட்ராக்ட் சொல்லாட்சியையும் நடத்தல் உருவகத்தையும் நோக்கத்துடன் பேணுகிறது.
