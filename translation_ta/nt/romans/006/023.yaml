id: ROM.6.23
reference: Romans 6:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: ta
  text: ஏனெனில், பாவத்தின் கூலி மரணம்; ஆனால் கடவுளின் அருள்கொடையோ, நம் ஆண்டவராகிய மெசியா இயேசுவில்[a] உள்ள நித்திய வாழ்வு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மெசியா இயேசுவின் மூலமாக’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் ‘-இல்’ என்பது அவருடனான ஒன்றிப்பு அல்லது அவருக்குள் இருக்கும் வாழ்வுத் தளம் என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: கூலி
  rationale: உழைத்துப் பெறப்படும் ஊதியம் அல்லது கைம்மாறு என்ற உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்தி, சம்பாதிக்கப்படும் கூலிக்கும் இலவசமாக வழங்கப்படும் கொடைக்கும் இடையிலான பவுலின் எதிர்மறை ஒப்புமையைப் பாதுகாக்கிறது.
- source_word: ἁμαρτίας
  choice: பாவத்தின்
  rationale: பாவத்துக்குரிய அல்லது பாவம் வழங்கும் கூலி என்ற கிரேக்க உரையின் சுருக்கமான உடைமை வேற்றுமைத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: θάνατος
  choice: மரணம்
  rationale: மரணத்தின் வகையை விளக்கிச் சுருக்காமல், சொல்லின் நேரடியான பொருளையும் இறையியல் கனத்தையும் தக்கவைக்கிறது.
- source_word: χάρισμα
  choice: அருள்கொடை
  rationale: χάρισμα என்பதில் உள்ள அருளால் இலவசமாக வழங்கப்படும் கொடை என்ற நுட்பத்தை இயல்பான ஒரே தமிழ்ச் சொல்லில் வெளிப்படுத்துகிறது; இது ‘கூலி’ என்பதுடனான வேறுபாட்டையும் தெளிவாக்குகிறது.
- source_word: ζωὴ αἰώνιος
  choice: நித்திய வாழ்வு
  rationale: முடிவில்லாத காலநீட்சியையும் புதிய வாழ்வின் இறையியல் நிறைவையும் சுமக்கும் வழக்கமான, புரிந்துகொள்ள எளிய தமிழ் சொற்றொடர்.
- source_word: ἐν
  choice: -இல்
  rationale: கிறிஸ்துவுடனான ஒன்றிப்பையோ அவர் ஆளும் வாழ்வுத் தளத்தையோ குறிக்கக்கூடிய பவுலின் சொற்பயன்பாட்டை, வெறும் காரணம் அல்லது கருவி என்று குறுக்காமல் பாதுகாக்கிறது.
- source_word: Χριστῷ
  choice: மெசியா
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது; தமிழில் பெயருடன் இயல்பாக இணைய ‘மெசியா இயேசு’ என அமைக்கப்பட்டுள்ளது.
- source_word: κυρίῳ
  choice: ஆண்டவர்
  rationale: ஆரம்பக் கிறிஸ்தவ அறிக்கையின் கனத்தையும் κύριος என்பதன் அதிகாரப் பொருளையும் தக்கவைக்கும் நிலையான தமிழ் சொல்.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ என்பதன் பொருள் வலிமை
  choice: ‘மெசியா இயேசுவில்’ என்று மொழிபெயர்த்தல்
  alternative: ‘மெசியா இயேசுவின் மூலமாக’
  rationale: ἐν என்பது இங்கு கருவியை மட்டும் குறிக்காமல், கிறிஸ்துவுடனான ஒன்றிப்பு அல்லது அவருக்குள் இருக்கும் வாழ்வுத் தளத்தையும் குறிக்கக்கூடும். ‘-இல்’ என்பது அந்த இறையியல் பரப்பைத் திறந்தவாறே வைத்திருக்கிறது.
- issue: χάρισμα என்பதிலுள்ள அருள் நுட்பம்
  choice: ‘அருள்கொடை’
  alternative: ‘கொடை’
  rationale: கூலி சம்பாதிக்கப்படுவது; χάρισμα அருளால் வழங்கப்படுவது. ‘அருள்கொடை’ இந்த எதிர்மறை ஒப்புமையைத் தெளிவாக்குகிறது; அதேவேளையில் குறிப்பிட்ட அருளியல் கோட்பாட்டை வசனத்திற்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை. ‘கூலி—அருள்கொடை’ என்ற தெளிவான எதிர்மறை ஒப்புமை மூலவாக்கியத்தின் வலிமையைத் தக்கவைக்கிறது. ‘தேவன்’ என்பதற்குப் பதில் பொதுவாகப் புரியும் ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது; ‘நம் ஆண்டவராகிய’ என்பது தமிழில் இயல்பான மரியாதைமிக்க தொடர்பமைப்பு.
