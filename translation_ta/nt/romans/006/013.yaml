source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: ta
  text: உங்கள் உடலுறுப்புகளைப் பாவத்திற்கு அநீதியின் ஆயுதங்களாக ஒப்புக்கொடுக்காதீர்கள். மாறாக, இறந்தோரிலிருந்து உயிரோடு இருப்பவர்களைப்போல் உங்களையே கடவுளுக்கு ஒப்புக்கொடுங்கள்; உங்கள் உடலுறுப்புகளையும் கடவுளுக்கு நீதியின் ஆயுதங்களாக ஒப்புக்கொடுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: ஒப்படைக்காதீர்கள் / ஒப்படையுங்கள்
  rationale: ஒருவரையோ உடலுறுப்புகளையோ மற்றொருவரின் அதிகாரத்துக்கும் பயன்பாட்டுக்கும் அளிப்பது என்ற கிரேக்கச் சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது; இரு கட்டளைகளிலும் ஒரே வினைச்சொல் தொடர்வதால் பாவம்–கடவுள் எதிர்மறையும் காக்கப்படுகிறது.
- source_word: μέλη
  choice: உடலுறுப்புகள்
  rationale: ‘உறுப்புகள்’ என்பது மட்டும் தெளிவற்றதாக இருக்கக்கூடும்; ‘உடலுறுப்புகள்’ பவுல் குறிப்பிடும் உடலின் பகுதிகளைச் சாதாரண வாசகருக்குத் தெளிவாக உணர்த்துகிறது.
- source_word: ὅπλα
  choice: ஆயுதங்கள்
  rationale: மோதல் அல்லது போராட்ட உருவகத்தைத் தெளிவாகக் காக்கிறது; ‘கருவிகள்’ என்ற விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀδικίας
  choice: அநீதி
  rationale: தார்மிகத் தவறும் நீதிக்கு எதிரான நிலையும் ஆகிய இரண்டையும் சுருக்கமாக வெளிப்படுத்தி, δικαιοσύνης என்பதுடன் உள்ள நேரடி எதிரிணையைப் பேணுகிறது.
- source_word: ἁμαρτίᾳ
  choice: பாவத்திடம்
  rationale: பாவத்தைச் செயலாற்றும் எஜமானனைப்போல் பவுல் உருவகப்படுத்துவதை விளக்கிச் சேர்க்காமல், கிரேக்க வேற்றுமை உறவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: இறந்தோரிலிருந்து உயிருள்ளவர்களாக
  rationale: ὡσεὶ என்பதன் ஒப்புமைத் தன்மையையும், இறப்பு–வாழ்வு முரணையும் காக்கிறது; ‘உயிர்ப்பிக்கப்பட்டவர்கள்’ அல்லது ‘உயிர்த்தெழுந்தவர்கள்’ என்று கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் கருத்தைச் சேர்க்கவில்லை.
- source_word: δικαιοσύνης
  choice: நீதி
  rationale: இச்சூழலில் கடவுளுக்கேற்ற நேர்மையான நிலை மற்றும் செயல் என்ற தார்மிக-இறையியல் பொருளைத் தருகிறது; சமூக நியாயம் என்ற மாற்று நுணுக்கம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: பாவமும் கடவுளும் எதிரெதிர் அதிகாரங்களாக நிறுத்தப்படுதல்
  choice: ‘பாவத்திடம்’ மற்றும் ‘கடவுளிடம்’ என்ற நேரடி உறவுகள் காக்கப்பட்டுள்ளன.
  alternative: ‘பாவத்துக்குச் சேவை செய்ய’ / ‘கடவுளுக்குச் சேவை செய்ய’
  rationale: சேவை மற்றும் கீழ்ப்படிதல் என்ற கருத்து சூழலில் உட்கிடக்கிறது; ஆனால் அதை விளக்கவுரையாக மூலவசனத்தில் சேர்க்காமல் கிரேக்கத்தின் சுருக்கமான இறையியல் அழுத்தம் காக்கப்படுகிறது.
- issue: ὡσεὶ ἐκ νεκρῶν ζῶντας என்பதன் உயிர்த்தெழுதல் சார்ந்த நுணுக்கம்
  choice: ‘இறந்தோரிலிருந்து உயிருள்ளவர்களாக’ என்று ஒப்புமையும் தெளிவின்மையும் காக்கப்பட்டுள்ளது.
  alternative: ‘இறந்தோரிலிருந்து உயிர்ப்பிக்கப்பட்டவர்களாக’ அல்லது ‘உயிர்த்தெழுந்தவர்களாக’
  rationale: சூழல் உயிர்த்தெழுதல் சார்ந்த பங்கேற்பை உணர்த்தினாலும், இத்தொடரில் வெளிப்படையான ‘உயிர்ப்பித்தல்’ அல்லது ‘எழுதல்’ வினை இல்லை; ஆகவே அதை மொழிபெயர்ப்பே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் அதே நேரத்தில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஒப்படை’ என்ற வினை மீண்டும் பயன்படுத்தப்பட்டு மூலத்தின் கட்டளை எதிரிணை காக்கப்பட்டுள்ளது; ‘அநீதி/நீதி’ மற்றும் ‘பாவம்/கடவுள்’ என்ற இணை எதிர்மறைகளும் தெளிவாகப் பேணப்பட்டுள்ளன.
