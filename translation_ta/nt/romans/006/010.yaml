revisions:
- from: ஏனெனில், அவர் அடைந்த மரணத்தைப் பொறுத்தவரை[a], பாவத்திற்கு ஒரே முறையாக இறந்தார்; ஆனால் அவர் வாழும் வாழ்வைப் பொறுத்தவரை, கடவுளுக்காக வாழ்கிறார்.
  to: ஏனெனில், அவர் இறந்ததைப் பொறுத்தவரை, பாவத்திற்கு[a] ஒரே முறையாக இறந்தார்; ஆனால் அவர் வாழும் வாழ்வைப் பொறுத்தவரை, கடவுளுக்கு வாழ்கிறார்.
