base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: ta
  text: ஏனெனில், அவர் இறந்ததைப் பொறுத்தவரை, பாவத்திற்கு[a] ஒரே முறையாக இறந்தார்; ஆனால் அவர் வாழும் வாழ்வைப் பொறுத்தவரை, கடவுளுக்கு வாழ்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் பாவத்திற்காக இறந்தார்” அல்லது “அவர் பாவத்தைப் பொறுத்தவரை இறந்தார்.”
    reason: τῇ ἁμαρτίᾳ என்ற சொற்றொடரின் வேற்றுமைத் தொடர்பு ‘பாவத்திற்கு,’ ‘பாவத்திற்காக,’ அல்லது ‘பாவத்தைப் பொறுத்தவரை’ எனப் புரிந்துகொள்ளப்படலாம்; இந்த உண்மையான பொருள் மாறுபாட்டை அடிக்குறிப்பு காக்கிறது.
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: ஏனெனில், அவர் அடைந்த மரணத்தைப் பொறுத்தவரை
  rationale: நடுநிலை உறவுப்பெயரும் மீண்டும் வரும் வினையும் சேர்ந்து அவர் இறந்த நிகழ்வை அல்லது அதன் தொடர்பைச் சுட்டுகின்றன. தமிழில் இயல்பாகவும் கிரேக்க அமைப்பின் வலியுறுத்தலைக் காக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது; γάρ முந்தைய கூற்றுக்கான விளக்கத் தொடர்பை ‘ஏனெனில்’ எனக் காட்டுகிறது.
- source_word: τῇ ἁμαρτίᾳ
  choice: பாவத்திற்கு
  rationale: இங்குள்ள வேற்றுமை பாவத்துடனான தொடர்பை வெளிப்படுத்துகிறது. ‘பாவத்திற்கு’ என்பது எதிர்ப்பாதியில் வரும் ‘கடவுளுக்காக’ என்பதுடனான தொடர்பையும் திசைநோக்கையும் சுருக்கமாகக் காக்கிறது; ‘பாவங்களுக்காக’ என்று விரிவாக்கி பரிகாரப் பொருளை மட்டும் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: ἀπέθανεν
  choice: இறந்தார்
  rationale: இறந்த செயலை நிறைவுற்ற வரலாற்று நிகழ்வாக எளிய இறந்தகாலத்தில் தெரிவிக்கிறது.
- source_word: ἐφάπαξ
  choice: ஒரே முறையாக
  rationale: ஒருமுறை நிகழ்ந்து மீண்டும் நிகழ வேண்டாத தனித்த, முடிவான செயல் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὃ δὲ ζῇ
  choice: ஆனால் அவர் வாழும் வாழ்வைப் பொறுத்தவரை
  rationale: முதல் கூறின் உறவுப்பெயர்–வினை அமைப்புக்கு இணையான வடிவத்தையும் மரணம்–வாழ்வு எதிர்மறையையும் தமிழில் தெளிவாகக் காக்கிறது; δέ-யின் மாறுபாட்டை ‘ஆனால்’ காட்டுகிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்காக
  rationale: அவருடைய வாழ்வு கடவுளை நோக்கியதும் கடவுளுக்குரியதுமாக இருப்பதை இயல்பான தமிழில் காட்டுகிறது. இதை வெறும் பயனாளிப் பொருளாக மட்டுமே கட்டுப்படுத்தாமல், தொடர்பு மற்றும் அர்ப்பணிப்பு என்ற பரப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: τῇ ἁμαρτίᾳ என்பது கிறிஸ்துவுக்குத் தனிப்பட்ட பாவம் இருந்ததாகத் தோன்றச் செய்யாமல், அதேவேளையில் அதன் உண்மையான பொருள் பரப்பை எவ்வாறு காப்பது?
  choice: பாவத்திற்கு
  alternative: பாவத்திற்காக; பாவத்தைப் பொறுத்தவரை
  rationale: ‘பாவத்திற்கு’ என்பது பவுலின் ‘பாவம் / கடவுள்’ எதிரிணையைச் சுருக்கமாகக் காக்கிறது; கிறிஸ்துவின் மரணம் பாவத்துடன் கொண்ட தொடர்பைச் சொல்கிறது, ஆனால் அந்தத் தொடர்பை விளக்கவுரையால் ஒரே கோட்பாட்டுப் பொருளாக முடிவுசெய்யவில்லை. மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மரணம்–வாழ்வு மற்றும் பாவம்–கடவுள் என்ற இணை எதிர்மறை அமைப்பு காக்கப்பட்டுள்ளது. ‘அவர்’ என்பது முந்தைய சூழலில் குறிப்பிடப்படும் கிறிஸ்துவைக் குறிக்கிறது; வசனத்திலேயே பெயரைச் சேர்க்காமல் மூலத்தின் குறிப்புமுறையைப் பாதுகாக்கிறது.
