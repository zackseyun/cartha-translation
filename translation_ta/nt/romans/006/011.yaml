revisions:
- from: அவ்வாறே நீங்களும், மெசியாவாகிய இயேசுவுக்குள்[c] பாவத்தைப் பொறுத்தவரை இறந்தவர்களாகவும், கடவுளுக்கென்று உயிரோடிருப்பவர்களாகவும்[b] உங்களைக் கருதுங்கள்[a].
  to: அவ்வாறே, நீங்களும் உங்களைப் பாவத்திற்கு இறந்தவர்களாகவும், கடவுளுக்கு உயிருள்ளவர்களாகவும், மெசியாவாகிய இயேசுவுக்குள்[c] இருப்பவர்களாகக் கருதுங்கள்[a].
  rationale: The revision gives the two Greek dative phrases matching Tamil forms, strengthens the compact dead/alive antithesis, and places ‘இருப்பவர்களாக’ after the final locative phrase so that ‘மெசியாவாகிய இயேசுவுக்குள்’ is syntactically explicit without changing the source’s theological openness. Footnote b is retained as a valid alternative and its anchor remains available for the revised wording.
