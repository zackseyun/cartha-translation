source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: ta
  text: அவ்வாறே, நீங்களும் உங்களைப் பாவத்திற்கு இறந்தவர்களாகவும், கடவுளுக்கு உயிருள்ளவர்களாகவும், மெசியாவாகிய இயேசுவுக்குள்[c] இருப்பவர்களாகக் கருதுங்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களை எண்ணுங்கள்’ அல்லது ‘உங்களைக் கணித்துக்கொள்ளுங்கள்.’
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில், ‘கிறிஸ்து இயேசுவுக்குள்’; Χριστός என்ற பட்டப்பெயர் இங்கு ‘மெசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: அவ்வாறே நீங்களும்
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவையும், வாசகர்களுக்கும் அது பொருந்துவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λογίζεσθε
  choice: கருதுங்கள்
  rationale: ஒன்றை உண்மையென எண்ணி ஏற்றுக்கொள்ளும் மனக்கணக்கீட்டுச் சாயலைத் தக்கவைத்தபடி, நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: ἑαυτοὺς εἶναι
  choice: உங்களைக் ... ஆக ... கருதுங்கள்
  rationale: கிரேக்கத்தின் தற்சுட்டுப் பெயரையும் ‘இருத்தல்’ என்ற நிறைவுச்சொல் அமைப்பையும் தமிழுக்கேற்ற வாக்கிய வடிவில் வெளிப்படுத்துகிறது.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: பாவத்தைப் பொறுத்தவரை இறந்தவர்களாக
  rationale: τῇ ἁμαρτίᾳ என்பதன் தொடர்பை மிகையாக விளக்காமல் ‘பொறுத்தவரை’ எனக் காட்டுகிறது; μέν–δέ எதிரிணையின் முதல் பகுதியையும் தக்கவைக்கிறது.
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: கடவுளுக்கென்று உயிரோடிருப்பவர்களாக
  rationale: ‘இறந்தவர்கள்’ என்பதற்கு எதிரான ζῶντας என்பதையும், கடவுளை நோக்கிய தத்த உறவைக் காட்டும் தத்திவையும் இயல்பான தமிழில் அளிக்கிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவுக்குள்
  rationale: Χριστός என்பதன் பட்டப்பெயர் வலிமையை ‘மெசியா’ எனவும், ἐν என்பதன் பவுலிய ஒன்றிப்பு/சூழல் மொழியை ‘உள்’ எனவும் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστῷ என்பதைப் பட்டப்பெயராகவா, பெயரைப்போன்ற வடிவமாகவா வழங்குவது
  choice: மெசியாவாகிய
  alternative: கிறிஸ்துவாகிய / கிறிஸ்து
  rationale: இங்கு Χριστός என்பதன் பட்டப்பெயர் பொருள் இன்னும் தெளிவாக இருப்பதால் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது; தமிழில் இயல்பாக இயேசுவுடன் இணைக்க ‘ஆகிய’ பயன்படுத்தப்பட்டது.
- issue: ἐν Χριστῷ Ἰησοῦ என்பதன் தொடர்பு
  choice: மெசியாவாகிய இயேசுவுக்குள்
  alternative: மெசியாவாகிய இயேசுவின் மூலம் / மெசியாவாகிய இயேசுவினால்
  rationale: ‘மூலம்’ அல்லது ‘காரணமாக’ என்று உறவைத் தீர்மானிக்காமல், ἐν என்பதன் ஒன்றிப்பு அல்லது ஆட்சிச்சூழல் சார்ந்த திறந்த பொருளைத் தக்கவைக்கிறது.
- issue: τῷ θεῷ என்ற தத்திவின் வலிமை
  choice: கடவுளுக்கென்று
  alternative: கடவுளைப் பொறுத்தவரை / கடவுளுக்காக
  rationale: கடவுளை நோக்கிய வாழ்வையும் அவருக்குரிய வாழ்வையும் சுருக்கமாகத் தெரிவிக்கிறது; வெறும் ஒப்பீடாகவோ நோக்கக் காரணமாகவோ மட்டும் அதைச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் அதேவேளையில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பாவத்தைப் பொறுத்தவரை’ என்பது தமிழில் உறவைத் தெளிவாக்குகிறது; ‘கடவுளுக்கென்று’ என்பது எதிரிணையை இயல்பாக்குகிறது. ‘இயேசுவுக்குள்’ என்பது அன்றாடத் தமிழில் அரிதானதாயினும், பவுலின் ἐν மொழியின் இறையியல் திறந்த தன்மையைப் பாதுகாக்க நோக்கமுடன் வைக்கப்பட்டுள்ளது.
