id: ROM.6.16
reference: Romans 6:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: ta
  text: கீழ்ப்படிவதற்காக நீங்கள் யாரிடம் உங்களை அடிமைகளாக ஒப்படைக்கிறீர்களோ, அவருக்கே நீங்கள் அடிமைகள் என்பது உங்களுக்குத் தெரியாதா? மரணத்துக்கு இட்டுச் செல்லும் பாவத்துக்கு அடிமைகளாகவோ, அல்லது நீதிக்கு[a] இட்டுச் செல்லும் கீழ்ப்படிதலுக்கு அடிமைகளாகவோ இருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, நியாயத்துக்கு.
    reason: δικαιοσύνη என்பதற்கான சாத்தியமான சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: உங்களை ... ஒப்படைக்கிறீர்களோ
  rationale: ஒருவரின் அதிகாரத்துக்கும் பயன்பாட்டுக்கும் தன்னை முன்வைத்து ஒப்படைக்கும் கருத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δούλους / δοῦλοί
  choice: அடிமைகளாக / அடிமைகள்
  rationale: δοῦλος குறிக்கும் உடைமையாக்கப்பட்ட, கட்டுப்பட்ட நிலையையும் பவுலின் முரண்பாட்டின் தீவிரத்தையும் ‘அடிமை’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: εἰς ὑπακοήν
  choice: கீழ்ப்படிவதற்காக
  rationale: εἰς என்பதன் நோக்கப் பொருளைத் தெளிவாகக் காட்டுகிறது; தமிழில் வினைப்பெயர் வடிவத்தைவிட இவ்வமைப்பு இயல்பாக உள்ளது.
- source_word: ᾧ ὑπακούετε
  choice: யாரிடம் ... அவருக்கே
  rationale: சூழலில் எஜமானரிடம் செலுத்தப்படும் கீழ்ப்படிதலை வெளிப்படுத்துகிறது; பாவமும் கீழ்ப்படிதலும் தொடர்ந்து ஆளும் சக்திகளாக உருவகிக்கப்படுகின்றன.
- source_word: ἁμαρτίας
  choice: பாவம்
  rationale: பாவத்தை ஆளும் சக்தியாக உருவகிக்கும் சூழலைப் பாதுகாத்தபடியே, கிரேக்கத்தின் நேரடியான சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: εἰς θάνατον
  choice: மரணத்துக்கு இட்டுச் செல்லும்
  rationale: εἰς என்பதன் முடிவு அல்லது திசையைக் குறிக்கும் ஆற்றலை வாசிக்க எளிதான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑπακοῆς
  choice: கீழ்ப்படிதல்
  rationale: பாவத்துக்கு எதிராக நிறுத்தப்படும் மறுபக்கத்தை அருவப்பெயராகவே வைத்திருந்து கிரேக்க இணைநிலையைப் பாதுகாக்கிறது.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: பவுலின் அறநெறி மற்றும் இறையியல் பொருள் பரப்பைச் சுருக்காமல் தரும் நிலைபெற்ற தமிழ் சொல்; ‘நியாயம்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பவுலின் முரண்பாட்டில் δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: இங்கு பாவம்–மரணம் என்பதற்கு எதிராக கீழ்ப்படிதல்–δικαιοσύνη நிறுத்தப்படுகிறது. ‘நீதி’ பவுலின் பரந்த அறநெறி மற்றும் இறையியல் பதிவைப் பாதுகாக்கிறது; சமூக அல்லது நீதித்துறை நியாயத்தையும் குறிக்கக்கூடிய ‘நியாயம்’ சாத்தியமான மாற்றாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் அடிமைத்தன உருவகமும் பாவம் மற்றும் கீழ்ப்படிதல் ஆளும் சக்திகளாக நிற்கும் இறையியல் இழுப்பும் தக்கவைக்கப்பட்டுள்ளன.
