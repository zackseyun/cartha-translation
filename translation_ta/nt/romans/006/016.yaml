- from: கீழ்ப்படிவதற்காக நீங்கள் யாரிடம் உங்களை அடிமைகளாக ஒப்படைக்கிறீர்களோ, அவருக்கே நீங்கள் அடிமைகள் என்பது உங்களுக்குத் தெரியாதா? ஒன்று, மரணத்துக்கு இட்டுச் செல்லும் பாவத்துக்கு அடிமைகள்; அல்லது, நீதிக்கு[a] இட்டுச் செல்லும் கீழ்ப்படிதலுக்கு அடிமைகள்.
