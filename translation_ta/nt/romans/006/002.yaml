lexical_decisions:
- source_word: μὴ γένοιτο
  choice: நிச்சயமாக இல்லை!
  rationale: பவுல் பயன்படுத்தும் இந்தச் சொற்றொடர் மிக வலுவான மறுப்பை வெளிப்படுத்துகிறது. நவீனத் தமிழில் இயல்பாகவும் அழுத்தமாகவும் ஒலிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது; சொற்பொருள் சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: οἵτινες
  choice: நாம்
  rationale: விசுவாசிகளைத் தம்முடன் இணைத்துப் பேசும் பவுலின் முதலாம் நபர் பன்மை தொடர்கிறது. அதைத் தொடர்ந்து வரும் பெயரெச்சத் தொடர் ‘பாவத்திற்கு இறந்துவிட்ட நாம்’ என்பதில் தொடர்புப்பெயரின் செயல்பாடு இயல்பாக வெளிப்படுகிறது.
- source_word: ἀπεθάνομεν
  choice: இறந்துவிட்ட
  rationale: இறப்பின் உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே காக்கிறது; இறந்த நிகழ்வு ஏற்பட்டுவிட்டது என்ற இறந்தகால நிறைவு உணர்வையும் தமிழில் இயல்பாகத் தருகிறது.
- source_word: τῇ ἁμαρτίᾳ
  choice: பாவத்திற்கு
  rationale: இங்கு வேற்றுமை உருபு பாவத்துடனான உறவைப் பொறுத்த இறப்பைக் குறிக்கிறது. ‘பாவத்திற்கு இறந்துவிட்ட’ என்பது மூலத்தின் சுருக்கமான உருவகத்தையும் அதன் திறந்த இறையியல் பொருளையும் பாதுகாக்கிறது.
- source_word: πῶς ἔτι
  choice: இனியும் ... எப்படி
  rationale: தொடர்ந்து வாழ்வது எவ்வாறு சாத்தியம் என்ற வியப்பும் மறுப்பும் கலந்த வினாவையும், ἔτι என்பதன் காலத் தொடர்ச்சி உணர்வையும் வெளிப்படுத்துகிறது.
- source_word: ζήσομεν
  choice: வாழ முடியும்
  rationale: எதிர்கால வினை இங்கு வலுவான சொல்லாட்சிவினாவாக வருகிறது. தமிழில் ‘எப்படி வாழ முடியும்?’ என்பது அதன் நடைமுறைச் சாத்தியமின்மையையும் வினாவின் அழுத்தத்தையும் இயல்பாகத் தருகிறது.
- source_word: ἐν αὐτῇ
  choice: அதில்
  rationale: பெண்பால் ஒருமைப் பதிலிப்பெயர் பாவத்தைத் திரும்பச் சுட்டுகிறது. ‘அதில்’ என்பது பாவத்தை ஒருவர் வாழும் ஆட்சிப்பரப்பு அல்லது நிலைபோல் சித்தரிக்கும் மூல உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இந்த வசனம் ஒழுக்க முன்னேற்றத்தைக் குறிக்கிறதா, அல்லது பாவத்துடனான தீர்மானமான முறிவைக் குறிக்கிறதா?
  choice: ‘பாவத்திற்கு இறந்துவிட்ட’ என்ற மூல உருவகம் விளக்கமின்றி நேரடியாகப் பாதுகாக்கப்பட்டது.
  alternative: ‘பாவத்தை விட்டு விலகிய’ அல்லது ‘பாவ உணர்வற்றவர்களான’ என்று விளக்கிப் பெயர்த்தல்.
  rationale: கிரேக்கம் பாவத்தைப் பொறுத்த இறப்பை உருவகமாக நேரடியாகக் கூறுகிறது. அதன் துல்லியமான செயல்முறை அல்லது கோட்பாட்டுப் பொருளை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், பவுலின் இறையியல் அழுத்தத்தையும் பொருள் செறிவையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாவத்திற்கு இறந்துவிட்ட’ என்ற சுருக்கமான உருவகம், சிறிது அசாதாரணமாக இருந்தாலும், மூலத்தின் இறையியல் செறிவையும் உறவுசார் வேற்றுமையையும் காக்க வேண்டி விடப்பட்டுள்ளது.
