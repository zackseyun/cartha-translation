  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: ta
  text: நாம் மேசியாவோடு[a] இறந்திருந்தால், அவரோடு நாமும் வாழ்வோம் என்று நம்புகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “கிறிஸ்துவோடு”; கிரேக்கம்: Χριστῷ (கிறிஸ்தோ).'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: இறந்திருந்தால்
  rationale: εἰ நிபந்தனையைச் சுட்டுகிறது; δέ முந்தைய வாதத்தைத் தொடர்ந்து மென்மையான முன்னேற்றம் அல்லது வேறுபாட்டைக் காட்டுகிறது. தமிழில் தனிக் கூடுதல் இணைப்புச்சொல் இல்லாமலேயே நிபந்தனை வடிவம் இயல்பாக இத்தொடர்ச்சியை ஏந்துகிறது.
- source_word: ἀπεθάνομεν
  choice: நாம் ... இறந்திருந்தால்
  rationale: இறந்த செயலைக் குறிக்கும் aorist indicative; தமிழில் நிபந்தனைத் தொடருடன் ‘இறந்திருந்தால்’ என்பது முன்பு நிகழ்ந்த இணை-மரணத்தைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: σὺν Χριστῷ
  choice: மேசியாவோடு
  rationale: σύν உடனிருப்பையும் இணைப்பையும் குறிக்கிறது; Χριστός இங்கு பட்டப்பெயராக இருப்பதால் ‘மேசியா’ என்றும், dative உடனான உறவை ‘-ஓடு’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: πιστεύομεν
  choice: நம்புகிறோம்
  rationale: πιστεύω என்பதன் நேரடியான, இயல்பான தமிழ் இணை; இங்கு ஒரு நம்பிக்கையின் உள்ளடக்கத்தை அறிவிக்கிறது.
- source_word: ὅτι
  choice: என்றும்
  rationale: நம்பப்படுகிற கருத்தை அறிமுகப்படுத்தும் ὅτι, தமிழில் மேற்கோள் சார்ந்த ‘என்று’ அமைப்பால் இயல்பாக வெளிப்படுகிறது; ‘-உம்’ வாக்கிய இணைப்பை நிறைவு செய்கிறது.
- source_word: καὶ
  choice: -ஓடு வாழ்வோம்
  rationale: καί முன்னுள்ள இணை-மரணத்துக்கு ஒத்த இணை-வாழ்வையும் சேர்க்கிறது. தமிழில் ‘அவரோடு’ என்ற இணைச்சொல் மற்றும் வாக்கிய அமைப்பு இந்த ‘also’ உறவை இயல்பாகத் தெரிவிக்கின்றன; ‘கூட’ சேர்த்தால் தேவையற்ற பேச்சுவழக்கு அல்லது வலியுறுத்தல் உருவாகலாம்.
- source_word: συζήσομεν
  choice: வாழ்வோம்
  rationale: எதிர்காலத்தில் சேர்ந்து வாழ்வதைச் சுட்டும் வினை; αὐτῷ உடன் சேர்ந்து ‘அவரோடு வாழ்வோம்’ என்பது இயல்பான தமிழ்.
- source_word: αὐτῷ
  choice: அவரோடு
  rationale: συζάω உடன் வரும் dative, அவருடன் பகிரப்படும் வாழ்வைச் சுட்டுவதால் மரியாதைமிக்க தமிழ் ஒருமை வடிவமான ‘அவரோடு’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பட்டப்பெயர் தன்மையுடன் செயல்படுகிறது. ‘மேசியா’ அந்தத் தலைப்பின் பொருளைத் தக்கவைக்கிறது; பரவலான ‘கிறிஸ்து’ மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: συζήσομεν αὐτῷ குறிக்கும் எதிர்கால வாழ்வின் இயல்பு
  choice: அவரோடு வாழ்வோம்
  alternative: அவரோடு உயிர்த்தெழுந்து வாழ்வோம்
  rationale: கிரேக்க வாசகம் அவருடன் பகிரப்படும் எதிர்கால வாழ்வைக் கூறுகிறது; அது எவ்வாறு நிகழும் என்பதை மொழிபெயர்ப்பு கூடுதலாகக் குறுக்கி விளக்காமல் அதன் பரப்பையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான நடை. ‘அவரோடு’ என்பது இயேசுவைக் குறிக்கும் மரியாதை ஒருமையை இயல்பாகக் காக்கிறது. நிபந்தனை வாக்கியம் தமிழ் சொல்லொழுங்குக்கேற்ப அமைக்கப்பட்டு, மூலத்தின் எதிர்கால நம்பிக்கை தீர்மானிக்கப்படாத பரப்புடன் பாதுகாக்கப்பட்டுள்ளது.
