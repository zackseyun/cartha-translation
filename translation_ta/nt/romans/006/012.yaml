source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: ta
  text: ஆகையால், உங்கள் இறப்புக்குரிய உடலில் அந்த உடலின் ஆசைகளுக்குக் கீழ்ப்படியும்படி பாவம் ஆட்சி செய்ய அனுமதிக்காதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவத்தின் ஆசைகளுக்குக் கீழ்ப்படியும்படி.”
    reason: αὐτοῦ என்பதை இலக்கணப்படி ‘உடல்’ என்பதுடன் இணைப்பதே இயல்பானது; ஆயினும் சூழலில் அதை ‘பாவம்’ என்பதுடன் கருத்தளவில் இணைத்துப் புரிந்துகொள்ளவும் வாய்ப்புள்ளது.
lexical_decisions:
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: βασιλευέτω
  choice: ஆட்சி செய்து ... விட்டுவிடாதீர்கள்
  rationale: தொடர்ந்து அனுமதிக்கக்கூடாது என்ற கட்டளை வலிமையையும், பாவத்தை அரசாளும் சக்தியாகச் சித்தரிக்கும் உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἁμαρτία
  choice: பாவம்
  rationale: பவுல் பாவத்தை ஆட்சி செய்யும் சக்தியாக ஆளுருவப்படுத்துவதை வினையுடன் சேர்ந்து வெளிப்படுத்துகிறது; தேவையற்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: θνητῷ
  choice: இறப்புக்குரிய
  rationale: மரணத்திற்கு உட்பட்ட தற்போதைய உடல் நிலையைக் குறிக்கும் கிரேக்கச் சொல்லை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: σώματι
  choice: உடலில்
  rationale: சூழலில் விரிவாக்கம் தேவையில்லாத நேரடியான பொருள்.
- source_word: εἰς τὸ ὑπακούειν
  choice: கீழ்ப்படியும்படி
  rationale: நோக்கம் அல்லது விளைவு ஆகிய இரண்டுக்கும் இடமளிக்கும் கிரேக்க அமைப்பைச் சுருக்கமான இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: ἐπιθυμίαις
  choice: ஆசைகளுக்கு
  rationale: பாலியல் இச்சையாக மட்டும் பொருளைக் குறுக்காமல், ஒழுக்கச் சூழலில் உள்ள விருப்பங்களைப் பரந்த விதத்தில் குறிக்கிறது.
- source_word: αὐτοῦ
  choice: அந்த உடலின்
  rationale: ஒருமை ஆண்பால்/அஃறிணை வடிவம் அருகிலுள்ள அஃறிணை ஒருமையான ‘உடல்’ என்பதுடன் இயல்பாகப் பொருந்துவதால், தமிழில் முன்னிலைச் சொல்லைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: பாவம் வெறும் செயல்களாக மட்டுமா, ஆட்சி செய்யும் சக்தியாகவா சித்தரிக்கப்படுகிறது?
  choice: ‘பாவம் ஆட்சி செய்து’ என்று ஆளுருவாக்கத்தையும் அரசாட்சி உருவகத்தையும் காத்தல்.
  alternative: பாவச்செயல்கள் கட்டுப்பாட்டைப் பெறுகின்றன என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: βασιλεύω என்ற வினை அரசாட்சி உருவகத்தைக் கொண்டுள்ளது; அதைத் தக்கவைப்பது பவுலின் இறையியல் அழுத்தத்தை விளக்கவுரை சேர்க்காமல் பாதுகாக்கிறது.
- issue: αὐτοῦ என்பதன் முன்னிலைச் சொல்
  choice: ‘அந்த உடலின் ஆசைகள்’ என்று ‘உடல்’ என்பதைக் குறிப்பதாக முதன்மை உரையில் தருதல்.
  alternative: ‘பாவத்தின் ஆசைகள்’ என்று பாவத்துடன் கருத்தளவில் இணைத்துப் புரிந்துகொள்ளுதல்.
  rationale: இலக்கண வடிவம் அஃறிணை ஒருமையான σώματι என்பதுடன் நேரடியாகப் பொருந்துகிறது; எனினும் சூழல் காரணமாக பாவத்துடன் கருத்தளவில் இணைக்கும் வாசிப்பும் சாத்தியமுள்ளதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆட்சி’ என்ற சொல் அரசாட்சி உருவகத்தைப் பாதுகாக்கிறது; ‘இறப்புக்குரிய’ என்பது θνητός என்பதன் சுருக்கமான இயல்பான இணைச்சொல்.
