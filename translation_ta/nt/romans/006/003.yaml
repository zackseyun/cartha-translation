  edition: SBLGNT
  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: ta
  text: அல்லது, மெசியாவாகிய இயேசுவுக்குள் திருமுழுக்குப் பெற்ற நாம் அனைவரும் அவருடைய மரணத்துக்குள் திருமுழுக்குப் பெற்றோம் என்பது உங்களுக்குத் தெரியாதா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“கிறிஸ்து இயேசு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில்: “Χριστὸν Ἰησοῦν.”'
    reason: Χριστός என்பதன் பட்டப்பொருளையும் தமிழில் வழக்கமான பெயர்வடிவத்தையும் வாசகருக்குக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: முந்தைய வாதத்துடன் இக்கேள்வியை இணைக்கும் பவுலின் மாற்றுச் சொல்லையும் மென்மையான கடிந்துரைத்தலையும் காக்கிறது.
- source_word: ἀγνοεῖτε
  choice: உங்களுக்குத் தெரியாதா?
  rationale: பகிரப்பட்ட அறிவை நினைவூட்டும் கிரேக்க வினாவை இயல்பான நவீன தமிழில் சொல்லுகிறது.
- source_word: ὅσοι
  choice: நாம் அனைவரும்
  rationale: முதலாம் நபர் பன்மை வினையோடு சேர்ந்து வரும் உள்ளடக்கமான முழு வரம்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐβαπτίσθημεν
  choice: திருமுழுக்குப் பெற்றோம்
  rationale: இறந்தகாலச் செயலையும் செயப்பாட்டு வடிவத்தையும் காக்கிறது; திருமுழுக்கின் செயல்முறையைப் பற்றிய எந்தச் சபைப் பிரிவின் விளக்கத்தையும் சேர்க்கவில்லை.
- source_word: εἰς
  choice: உள்ளே / உக்குள்
  rationale: இரு இடங்களிலும் காணப்படும் இணைதல் அல்லது உட்புகுதல் சார்ந்த வலுவான படிமத்தைத் தமிழில் காக்கிறது; அதன் துல்லியமான இறையியல் செயல்முறையைத் தீர்மானிப்பதில்லை.
- source_word: Χριστὸν Ἰησοῦν
  choice: மெசியாவாகிய இயேசு
  rationale: Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பட்டப்பொருளை வெளிப்படுத்துகிறது; பழக்கமான ‘கிறிஸ்து இயேசு’ என்ற வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: θάνατον αὐτοῦ
  choice: அவருடைய மரணம்
  rationale: மரணத்தையும் இயேசுவைச் சுட்டும் உடைமை உறவையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: திருமுழுக்குடன் வரும் εἰς என்பது திருவருட்சாதனச் செயல்திறன், அடையாளரீதியான ஒன்றிப்பு, அல்லது உடன்படிக்கை ஒன்றிப்பு ஆகியவற்றில் எதைக் குறிக்கிறது?
  choice: இரு இடங்களிலும் ‘உக்குள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தொடர்பாக’ அல்லது ‘ஒன்றிப்புக்குள்’
  rationale: கிரேக்கத்தின் வலுவான இணைதல்/உட்புகுதல் மொழியை இது காக்கிறது; அதேவேளையில் திருமுழுக்கின் இறையியல் செயல்பாட்டைப் பற்றிய ஒரு குறிப்பிட்ட சபைப் பிரிவின் கருத்தைத் திணிப்பதில்லை.
- issue: Χριστός என்பதை பட்டமாகவா அல்லது பெயரைப் போன்ற வழக்கமான வடிவமாகவா காட்டுவது?
  choice: முதன்மை உரையில் ‘மெசியாவாகிய இயேசு’
  alternative: ‘கிறிஸ்து இயேசு’
  rationale: இங்கு பட்டப்பொருளைத் தெளிவாக்குகிறது; வழக்கமான மாற்று வடிவத்தை அடிக்குறிப்பில் வைத்திருப்பதால் மூலத்தின் இரு வாசிப்பு நுணுக்கங்களும் அணுகத்தக்கவையாக உள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘திருமுழுக்குப் பெற்றோம்’ என்பது கிரேக்கச் செயப்பாட்டு வடிவத்தைத் தக்கவைக்கிறது. ‘உக்குள்’ என்ற மீளுரைத்தல் மூலத்தின் இரட்டை εἰς அமைப்பையும் வாதத்தின் ஒற்றுமையையும் பாதுகாக்கிறது.
