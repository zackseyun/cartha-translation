revisions:
- from: இறந்தோரிலிருந்து உயிருடன் எழுப்பப்பட்ட மெசியா[a] இனி மரிப்பதில்லை என்றும், மரணம் இனி அவர்மேல் ஆட்சி செலுத்துவதில்லை என்றும் அறிந்திருக்கிறோம்.
  to: இறந்தோரிடமிருந்து எழுப்பப்பட்ட மெசியா[a] இனி மரிப்பதில்லை என்றும், மரணம் இனி அவர்மேல் ஆட்சி செலுத்துவதில்லை என்றும் நாம் அறிந்திருக்கிறோம்.
  rationale: The revision removes the potentially misleading ‘உயிருடன்’ while preserving the Greek passive participle and its resurrection-from-the-dead sense. It retains the source's participial grounding through a natural Tamil finite expression and preserves both clauses without adding a specified agent for the passive.
