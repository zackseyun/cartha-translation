source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: ta
  text: இறந்தோரிடமிருந்து எழுப்பப்பட்ட மெசியா[a] இனி மரிப்பதில்லை என்றும், மரணம் இனி அவர்மேல் ஆட்சி செலுத்துவதில்லை என்றும் நாம் அறிந்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: அறிந்திருக்கிறோம்
  rationale: இந்தப் பங்கேற்புவினைச் சொல், சூழலில் பவுலும் வாசகர்களும் பகிர்ந்துகொள்ளும் அறிவை அடிப்படையாக முன்வைக்கிறது. தனித்து நிற்கும் தமிழ் வசனமாக இயல்பாக இருக்க, உள்ளடங்கிய ‘நாம்’ என்பதை வெளிப்படுத்தி வினைமுற்றாக மொழிபெயர்க்கப்பட்டுள்ளது; காரணப் பொருள் தேவையின்றி சேர்க்கப்படவில்லை.
- source_word: Χριστὸς
  choice: மெசியா
  rationale: இங்கு Χριστός பொருளுள்ள பட்டமாகச் செயல்படுகிறது. ‘மெசியா’ என்பது அந்தப் பட்டத்தின் அடையாளத்தையும் வரலாற்றுப் பொருளையும் காக்கிறது; பரவலான மாற்று ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐγερθεὶς
  choice: உயிருடன் எழுப்பப்பட்ட
  rationale: இறந்தோரிலிருந்து மீண்டும் உயிர்பெறச் செய்யப்பட்டதையும் கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும் தெளிவாகக் காக்கிறது. இந்த நிகழ்வு ‘இனி மரிப்பதில்லை’ என்பதற்கு முன்னதாக நிகழ்ந்தது என்பதும் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: கிரேக்கச் சொற்றொடரின் பன்மை வடிவத்தையும், இறந்தவர்களின் மத்தியிலிருந்து எழுப்பப்பட்டார் என்ற உயிர்த்தெழுதல் கருத்தையும் நேரடியாகக் காக்கிறது.
- source_word: οὐκέτι
  choice: இனி … இல்லை / இனி … இல்லை
  rationale: இரு இடங்களிலும் முன்பு இருந்த நிலை இனிமேல் தொடராது என்ற இறுதித்தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀποθνῄσκει
  choice: மரிப்பதில்லை
  rationale: நிகழ்கால வடிவம் தெரிவிக்கும் நிலையான உண்மையைத் தமிழ் எதிர்மறை நிகழ்கால வடிவில் இயல்பாகக் கூறுகிறது.
- source_word: θάνατος
  choice: மரணம்
  rationale: மூலத்தின் பெயர்ச்சொல்லை நேரடியாகக் காத்து, அடுத்த வினையில் ஆளுமைப்படுத்தப்பட்ட அதிகார சக்தியாக வர அனுமதிக்கிறது.
- source_word: κυριεύει
  choice: ஆட்சி செலுத்துவதில்லை
  rationale: ஆளுகை, அதிகாரம், மேலாதிக்கம் ஆகிய நுண்பொருள்களை நவீன தமிழில் இயல்பாகத் தருகிறது; ‘ஆண்டவனாக இருக்கிறது’ போன்ற தவறாகப் புரியக்கூடிய சொற்றொடரைத் தவிர்க்கிறது.
theological_decisions:
- issue: பவுலின் உரையில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இச்சொல் வெறும் பெயரின் பகுதியாக இல்லாமல் அபிஷேகம் செய்யப்பட்ட அரசர்/மீட்பர் என்ற பட்டமாகப் புரிந்துகொள்ளப்பட முடிகிறது. அந்தப் பட்டப் பொருளை முதன்மை உரை காக்கிறது; பாரம்பரிய வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: எழுப்பப்பட்டவர் யாரால் எழுப்பப்பட்டார் என்பது
  choice: 'செயப்பாட்டு வடிவத்தை மட்டும் காத்தல்: ‘எழுப்பப்பட்ட’'
  alternative: ‘கடவுளால் எழுப்பப்பட்ட’
  rationale: இந்த வசனத்தின் கிரேக்க உரை செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. சூழல் கடவுளைக் குறித்தாலும், இவ்வசனத்தில் இல்லாத சொல்லைச் சேர்க்காமல் அந்த மறைமுகத்தன்மை காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் தனித்து வாசிக்க இயல்பாக இருக்க εἰδότες என்பதிலுள்ள உள்ளடங்கிய பன்மை எழுவாய் ‘அறிந்திருக்கிறோம்’ என வெளிப்படுத்தப்பட்டுள்ளது. ‘மரணம் … அவர்மேல் ஆட்சி செலுத்துவதில்லை’ என்பது பவுலின் ஆளுமைப்படுத்தப்பட்ட அதிகார உருவகத்தைத் தக்கவைக்கிறது.
