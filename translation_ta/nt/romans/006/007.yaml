id: ROM.6.7
reference: Romans 6:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ γὰρ ἀποθανὼν δεδικαίωται ἀπὸ τῆς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: ta
  text: ஏனெனில், இறந்தவர் பாவத்திலிருந்து விடுதலை பெற்றிருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவத்திலிருந்து நீதிமான் என அறிவிக்கப்பட்டிருக்கிறார்”; “பாவத்திலிருந்து குற்றவிடுதலை பெற்றிருக்கிறார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: இறந்தவர்
  rationale: கட்டுரையுடன் வரும் இறந்தகாலப் பெயரெச்சம் பெயர்ச்சொல்லாகச் செயல்பட்டு, ‘இறந்த ஒருவர்’ என்ற பொதுவான பொருளைத் தருகிறது; தமிழில் ‘இறந்தவர்’ இயல்பாகவும் பாலினத்தைத் தேவையின்றிக் குறிப்பிடாமலும் உள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அல்லது விளக்கத்தை γάρ அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அந்த இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: δεδικαίωται
  choice: குற்றமற்றவர் என்று தீர்ப்பளிக்கப்பட்டிருக்கிறார்
  rationale: δικαιόω என்பதன் நீதிமன்றச் சார்ந்த ‘நீதிமானாக அறிவித்தல்/விடுவித்தல்’ என்ற வலிமையை இது காக்கிறது. நிறைவுற்ற செயல் தொடர்ந்து நிலவும் விளைவை கிரேக்க நிகழ்கால நிறைவுவினை காட்டுவதால், ‘தீர்ப்பளிக்கப்பட்டிருக்கிறார்’ என வழங்கப்பட்டுள்ளது.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: பாவத்திலிருந்து
  rationale: ἀπό பிரிவையோ விடுதலையையோ குறிக்கிறது. ‘பாவத்திலிருந்து’ என்பது பாவத்தின் குற்றச்சுமை அல்லது ஆட்சி என்ற ஒரே அம்சத்துக்குள் பொருளைக் குறுக்காமல் மூலத்தின் விரிவைத் தக்கவைக்கிறது.
theological_decisions:
- issue: δικαιόω என்பதை இங்கு முற்றிலும் நீதிமன்றப் பொருளிலா அல்லது பாவத்தின் ஆட்சியிலிருந்து விடுதலை என்ற பொருளிலா வழங்குவது
  choice: முதன்மை உரையில் ‘குற்றமற்றவர் என்று தீர்ப்பளிக்கப்பட்டிருக்கிறார்’ என்று நீதிமன்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘நீதிமானாக்கப்பட்டிருக்கிறார்’ அல்லது சூழல்படி ‘விடுவிக்கப்பட்டிருக்கிறார்’
  rationale: ரோமர் 6 பாவத்தின் ஆட்சியிலிருந்து விடுதலையை வலியுறுத்தினாலும், பவுல் பொதுவான விடுதலை வினைக்குப் பதிலாக δικαιόω என்பதைப் பயன்படுத்துகிறார். ஆகவே முதன்மை உரை நீதித்தீர்ப்பின் நுணுக்கத்தைக் காக்கிறது; அடிக்குறிப்பு நீதிமானாக்குதல் மற்றும் விடுதலை ஆகிய இரு சாத்தியங்களையும் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘குற்றமற்றவர் என்று தீர்ப்பளிக்கப்பட்டிருக்கிறார்’ என்பது சற்றே விரிவானதாயினும், மூலவினையின் நீதிமன்ற நுணுக்கத்தையும் பாவத்திலிருந்து பிரிதல் என்ற சூழலையும் ஒன்றாகத் தக்கவைக்கிறது.
