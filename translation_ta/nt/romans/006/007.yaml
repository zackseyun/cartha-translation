    reason: lexical_alternative
  revision_rationale: The revision adopts the contextually natural Tamil expression “பாவத்திலிருந்து விடுதலை பெற்றிருக்கிறார்,” which reflects the separation/release denoted by ἀπὸ τῆς ἁμαρτίας and the argument of Romans 6. The note preserves the formal judicial sense of δεδικαίωται (“declared righteous”) and the acquittal-related alternative, without reducing the verse to either courtroom imagery alone or liberation imagery alone.
