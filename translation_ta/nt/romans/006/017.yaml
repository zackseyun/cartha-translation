source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: ta
  text: ஆனால், முன்பு பாவத்திற்கு அடிமைகளாக இருந்த நீங்கள், நீங்கள் ஒப்புவிக்கப்பட்ட போதனையின் வடிவத்திற்கு[a] உள்ளத்திலிருந்து கீழ்ப்படிந்தீர்கள் என்பதற்காகக் கடவுளுக்கு நன்றி![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போதனையின் மாதிரி” அல்லது “போதனையின் நெறிமுறை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீங்கள் ஒப்புவிக்கப்பட்ட போதனையின் வடிவத்துக்குள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: ஆனால் … கடவுளுக்கு நன்றி
  rationale: χάρις τῷ θεῷ என்பது கடவுளை நோக்கிய நன்றியறிவிப்பைக் குறிக்கும் மரபுத்தொடர். δέ முன் கருத்துடன் உள்ள மாறுபாட்டைச் சுட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: பாவத்திற்கு அடிமைகள்
  rationale: ரோமர் 6 முழுவதிலும் உரிமை மற்றும் ஆதிக்கத்தை வலியுறுத்தும் அடிமைத்தன உருவகம் தொடர்வதால், மென்மையாக்கப்பட்ட ‘ஊழியர்கள்’ என்பதற்குப் பதிலாக ‘அடிமைகள்’ பயன்படுத்தப்பட்டது.
- source_word: ὑπηκούσατε
  choice: கீழ்ப்படிந்தீர்கள்
  rationale: இவ்வினைச்சொல் வெறுமனே கேட்டதைக் குறிக்காமல், கீழ்ப்படிதலின் செயலைக் குறிக்கிறது.
- source_word: ἐκ καρδίας
  choice: உள்ளத்திலிருந்து
  rationale: καρδία என்பதன் உருவகத்தைப் பேணுவதோடு, உள்ளார்ந்த உண்மையான கீழ்ப்படிதலையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τύπον διδαχῆς
  choice: போதனை மாதிரி
  rationale: τύπος என்பது வடிவம், வார்ப்பு அல்லது முன்மாதிரியைக் குறிக்கலாம்; ‘போதனை மாதிரி’ இங்கு உள்ள வழிகாட்டும் வடிவம் என்ற கருத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: παρεδόθητε
  choice: ஒப்புவிக்கப்பட்டீர்கள்
  rationale: விசுவாசிகளே போதனை மாதிரிக்கு ஒப்புவிக்கப்பட்டதாகக் கூறும் கிரேக்கச் செயல்பாட்டு எதிர்மறை வடிவத்தையும் அதன் குறிப்பிடத்தக்க உருவகத்தையும் தக்கவைக்கிறது.
- source_word: εἰς ὃν
  choice: எந்த … மாதிரிக்கு
  rationale: εἰς குறிக்கும் திசையை ‘-க்கு’ மூலம் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘-க்குள்’ என்ற இன்னும் நேரடியான இடவியல் வாசிப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: δοῦλοι என்பதை ‘ஊழியர்கள்’ என்று மென்மையாக்குவதா அல்லது ‘அடிமைகள்’ என்று மொழிபெயர்ப்பதா
  choice: பாவத்திற்கு அடிமைகள்
  alternative: பாவத்தின் ஊழியர்கள்
  rationale: இந்த அதிகாரத்தில் பாவத்தின் ஆதிக்கமும் உரிமையும் நீதிக்கான அடிமைத்தனத்துடனான எதிர்மறை ஒப்பீடும் மையமாக இருப்பதால் ‘அடிமைகள்’ உருவகத்தின் முழு வலிமையைப் பேணுகிறது.
- issue: போதனை விசுவாசிகளிடம் ஒப்புவிக்கப்பட்டதாக மாற்றிக் கூறுவதா அல்லது விசுவாசிகள் போதனை மாதிரிக்கு ஒப்புவிக்கப்பட்டதாகக் கூறுவதா
  choice: எந்தப் போதனை மாதிரிக்கு ஒப்புவிக்கப்பட்டீர்களோ
  alternative: உங்களிடம் ஒப்புவிக்கப்பட்ட போதனை வடிவம்
  rationale: கிரேக்க உரை விசுவாசிகளையே போதனை மாதிரிக்கு ஒப்புவிக்கப்பட்டவர்களாக முன்வைக்கிறது. அதை மாற்றாமல் வைத்திருப்பது உரையின் வியப்பூட்டும் உருவகத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்புகள் தமிழில் தெளிவாக இருக்க ‘எந்த … -ஓ, அதற்கு’ என்ற இணை அமைப்பு பயன்படுத்தப்பட்டது; அடிமைத்தனமும் ஒப்புவிக்கப்படுதலும் குறித்த மூல உருவகங்கள் மென்மையாக்கப்படவில்லை.
