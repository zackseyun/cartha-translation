base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: ta
  text: அப்படியானால் நாம் என்ன சொல்வோம்? அருள் பெருகும்படி பாவத்தில் தொடர்ந்து இருக்க வேண்டுமா?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவத்தில் நிலைத்திருக்க வேண்டுமா?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அருள் மிகுதியாகும்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: அப்படியானால்
  rationale: முந்தைய வாதத்திலிருந்து பவுல் எழுப்பும் முடிவுசார் வினாவை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: ἐροῦμεν
  choice: நாம் என்ன சொல்வோம்?
  rationale: எதிர்கால வடிவிலுள்ள ஆலோசனைசார் சொல்லாட்சியையும் வாதரீதியான வினாவையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐπιμένωμεν
  choice: தொடர்ந்து நிலைத்திருக்க வேண்டுமா?
  rationale: நடந்து கொண்டிருக்கும் ஒரு போக்கில் விடாமல் தொடர்வதை நிகழ்கால உபவினை வடிவம் சுட்டுகிறது; ‘வேண்டுமா’ என்பது ஒழுக்கநெறிசார் ஆலோசனை வினாவை வெளிப்படுத்துகிறது.
- source_word: τῇ ἁμαρτίᾳ
  choice: பாவத்தில்
  rationale: பாவம் என்னும் நிலை அல்லது நடைமுறையில் தொடர்ந்து இருப்பதைக் குறிக்கும் வேற்றுமைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἵνα
  choice: பெருகும்படி
  rationale: முன்வைக்கப்படும் செயல் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ἡ χάρις
  choice: அருள்
  rationale: இங்கு தேவனுடைய தகுதியற்றவர்களுக்கான நற்கருணையைக் குறிக்கும் χάρις என்பதற்கான நிலைபெற்ற, dignified Tamil rendering.
- source_word: πλεονάσῃ
  choice: பெருக
  rationale: அளவு அல்லது விரிவு அதிகரிப்பதை நவீன தமிழில் நேரடியாகக் காட்டுகிறது; மிகுதியாகுதல் என்ற மாற்றும் சாத்தியம்.
theological_decisions:
- issue: பவுலின் வினாவை அனுமதி, கடமை, அல்லது வெறும் எதிர்காலக் கணிப்பு என அமைப்பது
  choice: 'ஒழுக்கநெறிசார் ஆலோசனை வினா: ‘பாவத்தில் தொடர்ந்து நிலைத்திருக்க வேண்டுமா?’'
  alternative: ‘பாவத்தில் தொடர்ந்து நிலைத்திருப்போமா?’
  rationale: கிரேக்க உபவினை முன்மொழியப்படும் நடத்தையைப் பற்றிய வாதரீதியான வினாவை எழுப்புகிறது. ‘வேண்டுமா’ அதன் ஆலோசனை மற்றும் ஒழுக்கநெறிசார் வலிமையை வெளிப்படுத்தினாலும், பவுலின் அடுத்த பதிலை இங்கே முன்கூட்டியே சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified வாதநடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்படியானால்’ பவுலின் தர்க்கத் தொடரை இணைக்கிறது; ‘தொடர்ந்து நிலைத்திருக்க’ என்பது ἐπιμένωμεν-இன் நீடித்திருக்கும் நுணுக்கத்தைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
