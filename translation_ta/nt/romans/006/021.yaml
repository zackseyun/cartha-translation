id: ROM.6.21
reference: Romans 6:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: ta
  text: அப்படியானால், இப்போது நீங்கள் வெட்கப்படுகிற அந்தச் செயல்களிலிருந்து அப்போது என்ன கனியைப் பெற்றீர்கள்? ஏனெனில், அவற்றின் முடிவு மரணம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முடிவு” என்பதற்கு “விளைவு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: என்ன
  rationale: வினாவின் சொல்லாட்சியை எளிமையாகவும் அதன் சொல்லாட்சிசார் வலிமையைத் தக்கவைத்தும் வழங்குகிறது.
- source_word: καρπὸν
  choice: கனி
  rationale: முன்னைய செயல்கள் உண்டாக்கிய பலனைப் பற்றிய பவுலின் உருவகத்தைச் சுருக்காமல் தக்கவைக்கிறது.
- source_word: εἴχετε
  choice: பெற்றீர்கள்
  rationale: தமிழில் ‘கனியைப் பெறுதல்’ இயல்பான இணைச்சொல்லாக இருப்பதோடு, கடந்தகால அனுபவத்தைக் குறிக்கும் வினாவின் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: τότε
  choice: அப்போது
  rationale: பின்னர் வரும் ‘இப்போது’ என்பதுடனான கால முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐφ’ οἷς
  choice: அந்தச் செயல்களிலிருந்து
  rationale: முன்பு செய்தவற்றிலிருந்து கிடைத்த கனியைப் பற்றிய கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மறைமுகமாக உள்ள செயல்கள் என்ற குறிப்பையும் தெளிவாக்குகிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: ‘அப்போது’ என்பதற்கு எதிரான தற்போதைய நிலையை நேரடியாகக் குறிக்கிறது.
- source_word: ἐπαισχύνεσθε
  choice: வெட்கப்படுகிற
  rationale: தார்மிகக் கனமுள்ள அவமான உணர்வை நேரடியாகக் காட்டுகிறது; வெறும் சங்கடம் என்ற பலவீனமான பொருளைத் தவிர்க்கிறது.
- source_word: τέλος
  choice: முடிவு
  rationale: இறுதி நிலை மற்றும் விளைவு ஆகிய இரு சாத்திய நுண்பொருள்களையும் திறந்தவாறு வைத்திருக்கிறது.
- source_word: ἐκείνων
  choice: அவற்றின்
  rationale: முந்தைய துணைவாக்கியத்தில் குறிப்பிடப்பட்ட செயல்களை இயல்பாகச் சுட்டுகிறது.
- source_word: θάνατος
  choice: மரணம்
  rationale: மூலத்தின் நேரடியான, இறையியல் கனமுள்ள பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: τέλος என்பதை ‘முடிவு’ என்றா அல்லது ‘விளைவு’ என்றா மொழிபெயர்ப்பது
  choice: முடிவு
  alternative: விளைவு
  rationale: ‘முடிவு’ என்பது அந்த வாழ்க்கை முறையின் இறுதி நிலையையும் அதன் விளைவையும் ஒருங்கே உணர்த்த முடியும்; குறிப்பிட்ட ஓர் விளக்கத்திற்கு பொருளைச் சுருக்காமல், மாற்று நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கனி’ என்ற பவுலின் உருவகம் பாதுகாக்கப்பட்டு, ‘அப்போது/இப்போது’ என்ற கால முரண்பாடு தெளிவாக வைக்கப்பட்டுள்ளது.
