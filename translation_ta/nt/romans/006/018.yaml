id: ROM.6.18
reference: Romans 6:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/018.yaml
  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: ta
  text: பாவத்திலிருந்து விடுவிக்கப்பட்டு, நீதிக்கு[a] அடிமைகளாக்கப்பட்டீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயத்திற்கு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீதியின் அடிமைகளானீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: விடுவிக்கப்பட்டு
  rationale: இறந்தகாலச் செயப்பாட்டு வினையெச்சத்தின் பொருளைத் தக்கவைத்து, பாவத்தின் ஆட்சியிலிருந்து விடுதலை பெற்ற செயல் இவர்கள்மேல் நிகழ்ந்தது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: வினையெச்சத் தொடரால் வெளிப்படும் இணைப்பு
  rationale: இங்கு δέ மென்மையான தொடர் இணைப்பாக வருகிறது. தனியாக ‘ஆனால்’ அல்லது ‘மேலும்’ என்று சேர்ப்பது தமிழில் தேவையற்ற எதிர்மறையையோ கூடுதல் வலியுறுத்தலையோ உண்டாக்கலாம்; ஆகவே வாக்கியத் தொடர்பு ‘விடுவிக்கப்பட்டு’ என்ற அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: ἁμαρτίας
  choice: பாவத்திலிருந்து
  rationale: ஒருமையில் வரும் ‘பாவம்’ என்பது பவுலின் சூழலில் பாவத்தை ஆளும் வல்லமையாகவும் பொதுவான தீமையாகவும் உணர்த்த முடியும்; தமிழ் சொல் இந்த இரு பரிமாணங்களையும் தக்கவைக்கிறது.
- source_word: ἐδουλώθητε
  choice: அடிமைகளாக்கப்பட்டீர்கள்
  rationale: δουλόω என்பதிலுள்ள அடிமைத்தனத்தின் கடுமையான உருவகத்தையும் செயப்பாட்டு வடிவத்தையும் மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: δικαιοσύνῃ
  choice: நீதிக்கு
  rationale: δικαιοσύνη என்பதன் ஒழுக்க, உறவு மற்றும் நீதித்துறை சார்ந்த பொருள் வீச்சை ‘நீதி’ தக்கவைக்கிறது; மாற்றாக ‘நியாயம்’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: δουλόω என்ற அடிமைத்தன உருவகத்தை மொழிபெயர்த்தல்
  choice: நீதிக்கு அடிமைகளாக்கப்பட்டீர்கள்
  alternative: நீதியின் அடிமைகளானீர்கள்
  rationale: பாவத்தின் ஆட்சியிலிருந்து நீதியின் ஆட்சிக்கான மாற்றமே பவுலின் வாதத்தின் மையம். ‘அடிமைகளாக்கப்பட்டீர்கள்’ என்பது அந்தக் கடுமையான உருவகத்தையும் இறையியல் பதற்றத்தையும் மென்மைப்படுத்தாமல், மூலத்தின் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- issue: δικαιοσύνη என்பதன் பொருள் வீச்சு
  choice: நீதி
  alternative: நியாயம்
  rationale: ‘நீதி’ என்பது பவுலின் பயன்பாட்டிலுள்ள நேர்மை, சரியான உறவு, நீதித்துறை சார்ந்த நுணுக்கங்கள் ஆகியவற்றைத் திறந்தவாறு வைத்திருக்கிறது; ‘நியாயம்’ சாத்தியமான மாற்றாகக் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அடிமை’ உருவகம் மென்மைப்படுத்தப்படவில்லை; வாக்கியத்தின் வினையெச்ச அமைப்பு கிரேக்க மூலத்தின் செயல் தொடரை இயல்பாகப் பிரதிபலிக்கிறது.
