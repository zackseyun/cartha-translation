  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: ta
  text: அப்படியானால் என்ன? நாம் சட்டத்தின் கீழ் இல்லாமல் அருளின் கீழ் இருப்பதால் பாவம் செய்யலாமா?[a] ஒருபோதும் இல்லை![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாம் பாவம் செய்வோமா?’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நிச்சயமாக இல்லை!’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: அப்படியானால் என்ன?
  rationale: பவுலின் வாதத்தில் வரும் சுருக்கமான முடிவுநோக்கிய இடைமாற்றுக் கேள்வியை, மூலத்தில் இல்லாத சொற்களைச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἁμαρτήσωμεν
  choice: நாம் ... பாவம் செய்யலாமா?
  rationale: முதல் நபர் பன்மை இறந்தகாலச் சாத்திய வினை இங்கு ஆலோசனைக் கேள்வியாக வருகிறது. ‘செய்யலாமா?’ என்பது முன்வைக்கப்படும் சாத்தியத்தைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: இருப்பதால்
  rationale: பாவம் செய்வதற்காக முன்வைக்கப்படும் காரணத்தை—சட்டத்தின் கீழ் அல்ல, அருளின் கீழ் இருப்பதை—இயல்பான தமிழில் இணைக்கிறது.
- source_word: ὑπὸ νόμον
  choice: சட்டத்தின் கீழ்
  rationale: νόμος என்பதைக் குறிப்பாக ‘மோசேயின் சட்டம்’ என்று குறுக்காமல், பவுலின் சட்டம்–அருள் எதிரிணையைப் பாதுகாக்கிறது. இயல்பான தமிழுக்காக உடைமை வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὑπὸ χάριν
  choice: அருளின் கீழ்
  rationale: χάρις என்பதன் இறையியல் நிறைவையும் சட்டத்துடனான எதிரிணையையும் ‘அருள்’ துல்லியமாகப் பாதுகாக்கிறது.
- source_word: μὴ γένοιτο
  choice: ஒருபோதும் கூடாது!
  rationale: பவுலின் வலுவான மறுப்பை கண்ணியமான, தெளிவான நவீன தமிழில் எடுத்துரைக்கிறது; வெறும் ‘இல்லை’ என்பதைக் காட்டிலும் மூலத்தின் தீவிரத்தை நன்றாகக் காக்கிறது.
theological_decisions:
- issue: பவுலின் எதிரிணையில் νόμος என்பதன் வரம்பு
  choice: முதன்மை உரையில் ‘சட்டம்’ என்று பொதுவாக மொழிபெயர்த்தல்
  alternative: ‘திருச்சட்டம்’ அல்லது ‘மோசேயின் சட்டம்’ என்று குறிப்பாக்குதல்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு முன் சுட்டு உருபு இல்லை. மொழிபெயர்ப்பிலேயே அதன் இறையியல் வரம்பைச் சுருக்காமல், சூழலும் விளக்கவுரையும் தீர்மானிக்க இடமளிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், ஆனால் வேதாகம உரைக்கேற்ற கண்ணியத்துடன் வடிவமைக்கப்பட்டது. ‘சட்டத்தின் கீழ் / அருளின் கீழ்’ என்ற இணையான அமைப்பு மூலத்தின் இறையியல் எதிரிணையைத் தெளிவாக வைத்திருக்கிறது; அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
