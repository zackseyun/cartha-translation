source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: ta
  text: 'நாம் இதை அறிந்திருக்கிறோம்: நம்முடைய பழைய மனிதன் அவரோடு சிலுவையில் அறையப்பட்டான்; பாவத்தின் உடல் செயலற்றதாக்கப்படவும்[a], இனி நாம் பாவத்திற்கு அடிமைகளாய் இராதிருக்கவும்[b] இவ்வாறு நடந்தது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒழிக்கப்படவும்” அல்லது “பயனற்றதாக்கப்படவும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இனி நாம் பாவத்திற்குச் சேவை செய்யாதிருக்கவும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: நாம் இதை அறிந்திருக்கிறோம்
  rationale: சூழலோடு இணைக்கும் பங்கேற்புவினையின் கருத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது; இதைக் காரணவாக்கியமாகத் தீர்மானித்துவிடவில்லை.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: நம்முடைய பழைய மனிதன்
  rationale: பவுலின் மனிதவியல் உருவகத்தையும் ஒருமை வடிவத்தையும் காக்கிறது; ‘பழைய இயல்பு’ அல்லது ‘பழைய சுயம்’ என்று விளக்கமாகச் சுருக்கவில்லை.
- source_word: συνεσταυρώθη
  choice: அவரோடு சிலுவையில் அறையப்பட்டான்
  rationale: συν- முன்னொட்டிலுள்ள உடனிணைந்த சிலுவையறைதலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: καταργηθῇ
  choice: செயலற்றதாக்கப்படவும்
  rationale: முழுமையாக அழிக்கப்படுதல் என்ற மிகைவான பொருளைத் தவிர்த்து, செயல்படும் வல்லமை நீக்கப்படுவதைக் குறிக்கிறது.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: பாவத்தின் உடல்
  rationale: மூலத்தின் இறுக்கமான உடைமைத் தொடர்பை அப்படியே காத்து, ‘பாவமுள்ள உடல்’ அல்லது ‘பாவம் ஆளும் உடல்’ என்று அதன் பொருளை முன்கூட்டியே தீர்மானிக்கவில்லை.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: இனி நாம் பாவத்திற்கு அடிமைகளாய் இராதிருக்கவும்
  rationale: δουλεύω என்பதிலுள்ள அடிமைத்தனம் மற்றும் எஜமானனுக்குக் கீழ்ப்பட்டிருத்தல் ஆகிய வலிமையான உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ὁ παλαιὸς ἡμῶν ἄνθρωπος என்ற மனிதவியல் சொற்றொடர்
  choice: நம்முடைய பழைய மனிதன்
  alternative: நம்முடைய பழைய சுயம்
  rationale: ‘பழைய மனிதன்’ என்பது மூல உருவகத்தையும் பவுலின் பழைய-புதிய மனிதன் எதிர்மறையையும் காக்கிறது; இது ஆண்களை மட்டும் குறிப்பதாகத் தமிழில் கட்டாயம் புரிந்துகொள்ள வேண்டியதில்லை.
- issue: καταργηθῇ என்பதன் வலிமை
  choice: செயலற்றதாக்கப்படவும்
  alternative: ஒழிக்கப்படவும் / பயனற்றதாக்கப்படவும்
  rationale: பாவத்தின் உடல் இருப்பிலிருந்து முற்றாக அழிக்கப்படுகிறது என்று வலுப்படுத்தாமல், அதன் செயலாற்றல் முடக்கப்படுவதை வெளிப்படுத்துகிறது.
- issue: இரண்டு நோக்கத் தொடர்களின் தொடர்பு
  choice: செயலற்றதாக்கப்படவும் … அடிமைகளாய் இராதிருக்கவும்
  alternative: செயலற்றதாக்கப்படுவதன் விளைவாக நாம் இனி அடிமைகளாய் இராதிருக்க
  rationale: ἵνα மற்றும் τοῦ ஆகியவற்றின் நோக்கம்/விளைவு தொடர்பைத் தமிழ் வாக்கியத்தில் இயல்பாகக் காட்டுகிறது; அவற்றுக்கிடையிலான தர்க்கத் தொடர்பை அளவுக்கு மீறி விளக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘பழைய மனிதன்,’ ‘பாவத்தின் உடல்’ ஆகிய மூல உருவகங்கள் விளக்கவுரையாக மாற்றப்படாமல் காக்கப்பட்டுள்ளன.
