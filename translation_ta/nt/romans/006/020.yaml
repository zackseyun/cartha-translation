  source_fidelity: 'The main rendering accurately represents the Greek: γάρ is explanatory, δοῦλοι τῆς ἁμαρτίας is conveyed as being enslaved to sin, and the dative τῇ δικαιοσύνῃ is appropriately rendered as a relation of reference, not as an unambiguous separation from righteousness. The contrast and irony in Paul''s wording are retained.'
  naturalness: 'The main text is clear, dignified modern standard Tamil. The wording in footnote a, however, is not idiomatic Tamil: “நீதியைச் சார்ந்தவரை” uses a personal/relative form and does not naturally express “with respect to righteousness.”'
  terminology: “அடிமைகளாக” properly preserves the force of δοῦλοι in this context. “நீதி” is a viable established Tamil rendering for δικαιοσύνη, though its semantic range includes justice; the explanatory note appropriately signals the contextual sense of righteous standing or rectitude.
