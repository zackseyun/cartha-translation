  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் பாவத்திற்கு அடிமைகளாக இருந்தபோது, நீதியைப் பொறுத்தவரை சுதந்திரமானவர்களாக இருந்தீர்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியைச் சார்ந்து.”
    reason: lexical_alternative
  - marker: b
    text: “நீதி” என்பது இங்கே நீதியான நிலை அல்லது நேர்மையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: ரோமர் 6-ல் பவுல் ஒன்றுக்கொன்று எதிரான இரு அடிமைத்தனங்களை ஒப்பிடுவதால், கட்டுப்பட்ட நிலையைக் காட்டும் ‘அடிமைகள்’ என்பது பொருத்தமானது.
- source_word: ἁμαρτίας
  choice: பாவத்திற்கு
  rationale: தமிழில் ‘பாவத்திற்கு அடிமைகள்’ என்பது பாவத்தின் ஆட்சிக்கும் உடைமைக்கும் உட்பட்ட நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐλεύθεροι
  choice: சுதந்திரமானவர்கள்
  rationale: பாவத்திற்கு அடிமைகளாக இருந்தவர்கள் நீதியுடன் தொடர்புடைய கட்டுப்பாட்டிலிருந்து விடுபட்டிருந்தனர் என்ற பவுலின் கூர்மையான முரண்பாட்டை இது காக்கிறது.
- source_word: τῇ δικαιοσύνῃ
  choice: நீதியைப் பொறுத்தவரை
  rationale: இங்குள்ள வேற்றுமை உருபை தொடர்பு அல்லது வரம்பைக் குறிப்பதாக எடுத்துக்கொண்டு, நீதியே ஒடுக்குகிற எஜமானாக இருந்தது என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: δικαιοσύνῃ
  choice: நீதி
  rationale: δικαιοσύνη என்பதன் நெறிசார் சரியான நிலை மற்றும் நீதியான தன்மை ஆகிய பொருள் அகலத்தை ‘நீதி’ சுருக்கமாகக் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கத் தொடர்பை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: நீதியுடனான உறவை எவ்வாறு வெளிப்படுத்துவது
  choice: நீதியைப் பொறுத்தவரை சுதந்திரமானவர்களாக இருந்தீர்கள்
  alternative: நீதியிலிருந்து விடுதலையானவர்களாக இருந்தீர்கள்
  rationale: முதன்மைத் தேர்வு கிரேக்கத்தின் தொடர்பு/வரம்பு சார்ந்த சாத்தியத்தை காத்து, நீதியை எதிர்மறையான கட்டுப்பாடாகச் சித்தரிப்பதைத் தவிர்க்கிறது; அதே நேரத்தில் பவுலின் நோக்கமுள்ள இறையியல் பதற்றத்தையும் மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அடிமைகள்’ என்ற வலுவான சொல்லும் ‘நீதியைப் பொறுத்தவரை’ என்ற தொடர்புக் கூறும் மூலத்தின் முரண்பாட்டைத் தெளிவாகக் காக்கின்றன.
