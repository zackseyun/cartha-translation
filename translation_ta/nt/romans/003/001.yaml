  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: ta
  text: அப்படியானால், யூதருக்கு[b] என்ன சிறப்பு இருக்கிறது? அல்லது விருத்தசேதனத்திற்கு என்ன பயன் கிடைக்கிறது?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விருத்தசேதனத்தின் மதிப்பு என்ன?”
    reason: lexical_alternative
  - marker: b
    text: “யூதர்” என்பது இங்கு யூத மக்களை ஒரு வகையாகக் குறிக்கும் பிரதிநிதித்துவ ஒருமை.
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: அப்படியானால்
  rationale: முந்தைய வாதத்திலிருந்து பவுல் எழுப்பும் முடிவுசார் வினாவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ περισσὸν
  choice: என்ன சிறப்பு
  rationale: யூதருக்குள்ள தனிப்பட்ட சாதகம் அல்லது அனுகூலம் என்ன என்ற பொருளைத் தருகிறது; இன மேன்மை என்ற மிகைப்படுத்தப்பட்ட கருத்தைச் சேர்க்கவில்லை.
- source_word: τοῦ Ἰουδαίου
  choice: யூதருக்கு
  rationale: கிரேக்க ஒருமை ஒரு வகையைச் சுட்டும் பிரதிநிதித்துவ ஒருமை. தமிழில் மரியாதையும் இயல்பும் குன்றாமல் அதைப் பேணுகிறது.
- source_word: ἢ τίς
  choice: அல்லது ... என்ன
  rationale: இரண்டாவது இணையான வினாவைத் தெளிவாக இணைத்து, மூலத்தின் வினா அமைப்பைப் பேணுகிறது.
- source_word: ἡ ὠφέλεια
  choice: என்ன பயன் கிடைக்கிறது
  rationale: ὠφέλεια என்பதன் நடைமுறை நன்மை அல்லது பயன் என்ற பொருளை இயல்பான தமிழில் தருகிறது; περισσόν என்பதற்குப் பயன்படுத்திய ‘சிறப்பு’ என்பதிலிருந்து உள்ள சொற்பொருள் வேறுபாட்டையும் பேணுகிறது.
- source_word: τῆς περιτομῆς
  choice: விருத்தசேதனத்தால்
  rationale: யூத உடன்படிக்கையின் அடையாளமான சடங்கைத் தமிழில் பரவலாக அறியப்பட்ட வேதாகமச் சொல்லால் குறிப்பிடுகிறது; தமிழின் இயல்பான கேள்வி அமைப்புக்கேற்ப காரண/கருவிப் பொருளில் அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: Ἰουδαίου என்பதைப் பிரதிநிதித்துவ ஒருமையாக மொழிபெயர்ப்பதா அல்லது பன்மையாக மாற்றுவதா
  choice: யூதருக்கு
  alternative: யூதர்களுக்கு
  rationale: பவுல் ஒரு வகையைச் சுட்டும் ஒருமையைப் பயன்படுத்துகிறார். அதை பன்மையாக விரிவாக்காமல், தமிழில் கண்ணியமான பிரதிநிதித்துவ ஒருமையாகப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வினா நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சிறப்பு’ மற்றும் ‘பயன்’ ஆகியவை கிரேக்கத்தின் இரண்டு வேறுபட்ட சொற்களைத் தனித்தனியாக பிரதிபலிக்கின்றன; ‘யூதர்’ என்ற ஒருமை மூலத்தின் சொல்லாட்சியைப் பேணுகிறது.
