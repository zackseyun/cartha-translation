  edition: SBLGNT
  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: ta
  text: அப்படியானால், விசுவாசத்தின் மூலம் நாம் திருச்சட்டத்தைச் செல்லாததாக்குகிறோமா? ஒருபோதும் இல்லை! மாறாக, திருச்சட்டத்தை நிலைநிறுத்துகிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருச்சட்டத்தை நிலைநாட்டுகிறோம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: திருச்சட்டத்தை
  rationale: இங்கு சொல் சுட்டுவது பவுலின் வாதத்தில் ஏற்கெனவே பேசப்பட்டுள்ள இறைச்சட்டத்தை, குறிப்பாக தோராவை. பழமையான ‘நியாயப்பிரமாணம்’ என்பதற்குப் பதிலாக, நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ள ‘திருச்சட்டம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: முந்தைய வாதத்திலிருந்து எழும் சொல்லாட்சிக் கேள்வியை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καταργοῦμεν
  choice: செல்லாததாக்குகிறோம்
  rationale: ஒன்றைச் செயலற்றதாகவோ செல்லுபடியாகாததாகவோ ஆக்கும் பொருளைத் தருகிறது; ‘ஒழித்துவிடுகிறோம்’ என்று மொழிபெயர்த்து சட்டமே அகற்றப்படுகிறது என்ற மிகையான பொருளைத் தவிர்க்கிறது.
- source_word: διὰ τῆς πίστεως
  choice: விசுவாசத்தின் மூலம்
  rationale: διά + மரபுவேற்றுமையின் கருவிப்பொருளைப் பாதுகாக்கிறது; πίστις என்பதற்கு திட்டத்தின் வழக்கமான ‘விசுவாசம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μὴ γένοιτο
  choice: ஒருபோதும் இல்லை!
  rationale: கிரேக்க மரபுத்தொடரின் வலிமையான மறுப்பைச் சுருக்கமாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: முந்தைய கேள்விக்கான கூர்மையான எதிர்மறைத் திருப்பத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἱστάνομεν
  choice: நிலைநிறுத்துகிறோம்
  rationale: திருச்சட்டத்தைச் செல்லாததாக்குவதற்கு நேரெதிரான கருத்தைத் தருகிறது; அதை புதிதாக உருவாக்குகிறோம் என்று கூறாமல் அதன் நிலை அல்லது வலிமையைப் பேணுகிறோம் என்ற பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: விசுவாசத்துக்கும் திருச்சட்டத்துக்கும் உள்ள உறவு
  choice: திருச்சட்டத்தை நிலைநிறுத்துகிறோம்
  alternative: திருச்சட்டத்தை நிலைநாட்டுகிறோம்
  rationale: ἱστάνομεν என்பதற்கு இரு பொருள்களும் சாத்தியம். சூழலில் பவுல் விசுவாசம் திருச்சட்டத்தைச் செல்லாததாக்குவதில்லை என்று மறுப்பதால், ‘நிலைநிறுத்துகிறோம்’ என்பது குறிப்பிட்ட சமயக்கோட்பாட்டைத் திணிக்காமல் அந்த எதிர்மறை இணைப்பைத் தெளிவாகக் காட்டுகிறது; ‘நிலைநாட்டுகிறோம்’ என்ற நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, செம்மையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ போன்ற பழமையான சொல்லைத் தவிர்த்து ‘திருச்சட்டம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; வாக்கியத்தின் சொல்லாட்சிக் கேள்வி மற்றும் வலிமையான மறுப்பு பாதுகாக்கப்பட்டுள்ளன.
