    issue: Main-text renderings ‘நீதியின்மை’ and especially ‘நீதித்தன்மை’ are somewhat abstract.
    rationale: In this rhetorical contrast, ‘அநீதி’ and ‘நீதி’ are more concise, natural modern Tamil and preserve the lexical opposition of ἀδικία and δικαιοσύνη. The alternative wording can be retained in the footnote.
  - severity: low
    issue: ‘தமது கோபத்தைச் சுமத்தும்’ is less idiomatic for ἐπιφέρων τὴν ὀργήν.
    rationale: ‘கோபத்தைச் செலுத்தும்’ naturally conveys the judicial act of bringing or inflicting wrath and does not add ‘punishment’ beyond the Greek.
