id: ROM.3.5
reference: Romans 3:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: ta
  text: ஆனால், நம்முடைய அநீதி கடவுளின் நீதியைத் தெளிவாகக் காட்டுகிறது என்றால்[a], நாம் என்ன சொல்வோம்? கோபத்தைச் செலுத்தும் கடவுள் அநீதியானவரா? (நான் மனிதக் கண்ணோட்டத்தில் பேசுகிறேன்.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்முடைய நீதியின்மை கடவுளின் நீதித்தன்மையைத் தெளிவாகக் காட்டுகிறது என்றால்.”
    reason: ἀδικία மற்றும் δικαιοσύνη ஆகிய சொற்கள் இச்சூழலில் முறையே ‘நீதியின்மை’ மற்றும் ‘நீதித்தன்மை’ என்ற விரிவான ஒழுக்க/உறவுசார் பொருள்களையும் கொள்ளலாம்.
lexical_decisions:
- source_word: ἀδικία
  choice: நீதியின்மை
  rationale: மனிதரின் ஒழுக்க மற்றும் உறவுசார் தவற்றை, கடவுளின் δικαιοσύνη என்பதற்கு நேர்மாறாக இயல்பான நவீனத் தமிழில் காட்டுகிறது; ‘அநீதி’ என்பதும் சூழலுக்கேற்ற மாற்றாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: δικαιοσύνη
  choice: நீதித்தன்மை
  rationale: இங்கு கடவுளுக்குரிய நேர்மையான, நீதியுள்ள இயல்பையும் செயலையும் குறிக்கிறது; வெறும் சட்டநீதியாக மட்டும் சுருக்காமல் பவுலின் விரிவான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: συνίστησιν
  choice: தெளிவாகக் காட்டுகிறது
  rationale: மனிதரின் நீதியின்மை கடவுளின் நீதித்தன்மையை வெளிப்படச் செய்கிறது என்ற வாதத்தின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μὴ ἄδικος
  choice: கடவுள் அநீதியானவரா?
  rationale: μή எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவைக் குறித்தாலும், மூலத்தின் கேள்வி வடிவத்தையும் அதன் இறையியல் பதற்றத்தையும் கூடுதல் மறுப்புத் தொடரின்றிப் பாதுகாக்கிறது.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: தமது கோபத்தைச் சுமத்தும்
  rationale: ἐπιφέρω என்பதிலுள்ள ஒருவர்மேல் கொண்டுவருதல் அல்லது சுமத்துதல் என்ற நியாயத்தீர்ப்புச் சார்ந்த உணர்வை, ‘தண்டனை’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் தெரிவிக்கிறது.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: நான் மனிதக் கண்ணோட்டத்தில் பேசுகிறேன்
  rationale: இது பவுல் முன்வைக்கும் வாதம் மனிதருக்குரிய சிந்தனை முறையிலிருந்து சொல்லப்படுவதாகக் காட்டும் இடைச்சொல்லைத் தெளிவான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: கடவுளின் நீதியைப் பற்றிய பவுலின் எதிர்மறைப் பதிலை எதிர்பார்க்கும் வினாவை எவ்வாறு மொழிபெயர்ப்பது
  choice: “கடவுள் அநீதியானவரா?” என்ற நேரடி கேள்வி வடிவம்
  alternative: “கடவுள் அநீதியானவர் அல்லவே?”
  rationale: கிரேக்க μή எதிர்மறைப் பதிலை எதிர்பார்த்தாலும், நேரடி கேள்வி மூலத்தின் எதிர்ப்புரையையும் இறையியல் பதற்றத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது; பதிலை வசனத்துக்குள்ளேயே வெளிப்படையாகச் சேர்ப்பதில்லை.
- issue: δικαιοσύνη என்பதன் நீதி/நீதித்தன்மை பொருள் பரப்பு
  choice: முதன்மை உரையில் “நீதித்தன்மை”
  alternative: “நீதி”
  rationale: கடவுளின் நீதியான இயல்பும் செயலும் ஆகிய விரிவான பொருளை முதன்மை உரை தக்கவைக்கிறது; சட்டநீதி சார்ந்த வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வாதநடையின் செறிவும் காக்கப்பட்டுள்ளன. பழமையான வேதாகமச் சொற்றொடர்கள் தவிர்க்கப்பட்டுள்ளன; அடைப்புக்குறிக்குள் உள்ள பவுலின் இடைச்சொல் தனித்துவமாகப் பாதுகாக்கப்பட்டுள்ளது.
