source:
  edition: SBLGNT
  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: ta
  text: கடவுள் தண்டனையைத் தாமதித்துப் பொறுத்துக்கொண்டிருந்த நிலையில், தற்போதைய காலத்தில் தமது நீதியை[a] வெளிப்படுத்துவதற்காகவும், தாம் நீதியுள்ளவராகவும், இயேசுவின்மேல் நம்பிக்கை கொண்டவரை[b] நீதிமானென்று அறிவிக்கிறவராகவும்[c] இருப்பதற்காகவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயத்தை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இயேசுவின் உண்மைத்தன்மையைச் சார்ந்தவரை.”
    reason: alternative_reading
  - marker: c
    text: அல்லது, “நீதிமானாக்குகிறவராகவும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοχῇ
  choice: பொறுமையுடன் தண்டனையைத் தாமதித்ததால்
  rationale: இச்சொல் வெறும் பொறுமையை மட்டுமல்லாமல், தண்டனையை உடனடியாக நிறைவேற்றாமல் கடவுள் கட்டுப்பாட்டுடன் பொறுத்திருப்பதையும் குறிக்கிறது; அந்தக் கருத்தை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: ἔνδειξιν
  choice: வெளிப்படுத்துவதற்காக
  rationale: கடவுளுடைய நீதி வெளிப்படையாகக் காட்டப்படுதல் என்ற சான்றளிக்கும் கருத்தை, நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: δικαιοσύνης
  choice: நீதியை
  rationale: பவுலின் சொல்லில் உள்ள ஒழுக்க மற்றும் நீதித்தீர்ப்பு சார்ந்த பரப்பை ‘நீதி’ தக்கவைக்கிறது; ‘நியாயம்’ என்ற சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: இப்போதைய காலத்தில்
  rationale: νῦν என்பதன் நிகழ்கால வலியுறுத்தலையும் καιρός குறிக்கும் குறிப்பிட்ட காலச்சூழலையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: δίκαιον
  choice: நீதியுள்ளவராக
  rationale: கடவுளுடைய நீதியான இயல்பைக் குறிக்கிறது; அடுத்துவரும் δικαιοῦντα உடனான ஒரே சொல்வேரைத் தமிழிலும் இயன்றவரை தக்கவைக்கிறது.
- source_word: δικαιοῦντα
  choice: நீதிமானாக்குகிறவராக
  rationale: நிகழ்காலச் செயப்பெயரின் தொடர்ச்சியான செயற்பாட்டையும் δίκαιον உடனான சொல் தொடர்பையும் தக்கவைக்கிறது; ‘நீதிமானென்று அறிவித்தல்’ என்ற நீதிமன்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: இயேசுவின்மேல் நம்பிக்கை வைக்கிறவரை
  rationale: Ἰησοῦ என்பதை நம்பிக்கையின் இலக்காகக் கொள்ளும் பரவலான objective-genitive வாசிப்பை முதன்மை உரையில் இயல்பாக வழங்குகிறது; இயேசுவின் உண்மைத்தன்மை என்ற subjective-genitive வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ἐκ πίστεως Ἰησοῦ என்பதன் பொருள்
  choice: இயேசுவின்மேல் நம்பிக்கை வைக்கிறவர்
  alternative: இயேசுவின் உண்மைத்தன்மையைச் சார்ந்தவர்
  rationale: வேற்றுமைத் தொகை இலக்கணரீதியாக இரு வாசிப்புகளுக்கும் இடமளிக்கிறது. முதன்மை உரை நம்பிக்கையின் இலக்கு இயேசு என்ற வாசிப்பைப் பின்பற்றினாலும், மாற்று வாசிப்பை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: δικαιοῦντα என்பதன் நீதித்தீர்ப்பு நுணுக்கம்
  choice: நீதிமானாக்குகிறவர்
  alternative: நீதிமானென்று அறிவிக்கிறவர்
  rationale: முதன்மைத் தேர்வு δίκαιον/δικαιοῦντα சொல்லிணைப்பைத் தமிழில் பிரதிபலிக்கிறது; மாற்றுத் தேர்வு நீதிமன்ற அறிவிப்பு என்ற சாத்தியமான பொருளைத் தெளிவுபடுத்துகிறது, ஆனால் அதை மட்டும் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் பேணப்பட்டுள்ளன. வசனம் கிரேக்கத்தில் முந்தைய வாக்கியத்தின் தொடர்ச்சியாக இருப்பதால், தமிழில் பொருள் நிறைவடைய ‘இவ்வாறு செய்தார்’ சேர்க்கப்பட்டுள்ளது. ‘நீதியுள்ளவர்/நீதிமானாக்குகிறவர்’ என்ற இணைப்பு பவுலின் δίκαιον/δικαιοῦντα சொல் விளையாட்டை இயன்றவரை எதிரொலிக்கிறது.
