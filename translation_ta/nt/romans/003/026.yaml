revisions:
- from: கடவுள் பொறுமையுடன் தண்டனையைத் தாமதித்ததால், இப்போதைய காலத்தில் தமது நீதியை[a] வெளிப்படுத்துவதற்காகவும், தாம் நீதியுள்ளவராக இருந்து, இயேசுவின்மேல் நம்பிக்கை வைக்கிறவரை[b] நீதிமானாக்குகிறவராகவும்[c] இருப்பதற்காகவும் இவ்வாறு செய்தார்.
  to: கடவுள் தண்டனையைத் தாமதித்துப் பொறுத்துக்கொண்டிருந்த நிலையில், தற்போதைய காலத்தில் தமது நீதியை[a] வெளிப்படுத்துவதற்காகவும், தாம் நீதியுள்ளவராகவும், இயேசுவின்மேல் நம்பிக்கை கொண்டவரை[b] நீதிமானென்று அறிவிக்கிறவராகவும்[c] இருப்பதற்காகவும்.
