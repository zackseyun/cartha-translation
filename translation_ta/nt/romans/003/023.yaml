  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: ta
  text: ஏனெனில் எல்லோரும் பாவம் செய்திருக்கிறார்கள்; கடவுளின் மகிமையை அடையத் தவறுகிறார்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் மகிமை இல்லாதவர்களாக இருக்கிறார்கள்” அல்லது “கடவுளின் மகிமையில் குறைவுபடுகிறார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “கடவுளின் மகிமை” என்பது கடவுளுடைய சொந்த மகிமையையோ, மனிதர்கள் பிரதிபலிக்க வேண்டிய மகிமையையோ, கடவுள் அளிக்கும் மகிமையையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: எல்லோரும்
  rationale: சூழலில் மனிதர்கள் அனைவரையும் உள்ளடக்கும் பொருளை இயல்பான நவீன தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கக் காரணத்தைத் தெரிவிக்கும் γάρ என்பதன் தொடர்புப்பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ἥμαρτον
  choice: பாவம் செய்திருக்கிறார்கள்
  rationale: மனிதர்கள் பாவம் செய்துவிட்டார்கள் என்ற ஒருங்கிணைந்த உண்மையையும் அதன் நிகழ்காலத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑστεροῦνται
  choice: அடையாமல் இருக்கிறார்கள்
  rationale: நிகழ்காலத்தில் தொடரும் குறைநிலையை உணர்த்துகிறது; அதேவேளையில் ‘குறைவுபடுகிறார்கள்’ போன்ற இயல்பற்ற சொல்லாக்கத்தைத் தவிர்க்கிறது.
- source_word: δόξης
  choice: மகிமையை
  rationale: δόξα என்பதற்கான நிலைபெற்ற, இறையியல் ஆழத்தைத் தக்கவைக்கும் தமிழ் இணைச்சொல்.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: மூலத்தின் பிறப்புவேற்றுமைத் தொடர்பை நேரடியாகக் காத்து, அந்த மகிமை கடவுளுடையதா, அவரிடமிருந்து வருவதா, மனிதருக்கு அளிக்கப்படுவதா என்பதை முதன்மை உரையில் முடிவுசெய்யவில்லை.
theological_decisions:
- issue: ‘கடவுளின் மகிமை’ என்பதன் பொருள்
  choice: ‘கடவுளின் மகிமை’ என்று விளக்க விரிவாக்கமின்றி மொழிபெயர்க்கப்பட்டது.
  alternative: கடவுளிடமிருந்து வரும் மகிமை; மனிதர்கள் பிரதிபலிக்க வேண்டிய கடவுளின் மகிமை; கடவுள் வழங்கும் மகிமை
  rationale: τῆς δόξης τοῦ θεοῦ என்பது பல தொடர்புடைய பொருள்களுக்கு இடமளிக்கும் சுருக்கமான சொற்றொடர். ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தை முதன்மை உரையில் திணிக்காமல் அதன் உண்மையான திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘எல்லோரும்’ என்பது உலகளாவிய நோக்கத்தைத் தெளிவாக்குகிறது. ‘அடையாமல் இருக்கிறார்கள்’ என்பது ὑστεροῦνται குறிக்கும் தொடரும் குறைநிலையை இயல்பாகத் தெரிவிக்கிறது; அதன் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
