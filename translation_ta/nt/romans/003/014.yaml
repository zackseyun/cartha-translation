translation:
  language: ta
  text: அவர்களுடைய வாய் சாபத்தாலும் கசப்பாலும் நிறைந்திருக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: அவர்களுடைய
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்டவர்களைச் சுட்டும் பன்மை உறவுப்பெயரின் உடைமைப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ στόμα
  choice: வாய்
  rationale: கிரேக்கத்தில் ஒருமையாக உள்ள சொல்லை, ஒரு குழுவினரின் பேச்சைத் தொகுப்பாகக் குறிக்கும் ஒருமை வடிவிலேயே காக்கிறது.
- source_word: ἀρᾶς
  choice: சாபத்தாலும்
  rationale: தீங்கு வர வேண்டுமெனச் சொல்லும் சாபப் பேச்சைக் குறிக்கும் பெயர்ச்சொல்லின் அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: πικρίας
  choice: கசப்பாலும்
  rationale: கசப்புணர்வையும் அதிலிருந்து வெளிப்படும் கடுமையான பேச்சையும் உள்ளடக்கக்கூடிய மூலச்சொல்லின் உருவக வலிமையைப் பாதுகாக்கிறது.
- source_word: γέμει
  choice: நிறைந்திருக்கிறது
  rationale: நிகழ்காலத்தில் தொடரும் நிறைவான நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
