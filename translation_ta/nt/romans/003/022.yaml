source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: ta
  text: மேலும், கடவுளின் நீதி[a], இயேசு மெசியாவின்மேல் உள்ள விசுவாசத்தின் மூலம் விசுவாசிக்கிற அனைவருக்கும் உரியது; ஏனெனில் வேறுபாடு இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் நியாயம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοσύνη
  choice: நீதி
  rationale: δικαιοσύνη என்பதன் நீதியான தன்மை, செயல், நிலை ஆகிய பரந்த பொருள் வாய்ப்புகளை ‘நீதி’ இயல்பாகத் தக்கவைக்கிறது; ‘நியாயம்’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: θεοῦ
  choice: கடவுளின்
  rationale: கிரேக்க உரையின் உடைமை வேற்றுமையை நேரடியாகக் காட்டுகிறது; ‘கடவுளிடமிருந்து வரும்’ என்று விளக்கி அதன் பொருள் எல்லையைச் சுருக்கவில்லை.
- source_word: διὰ πίστεως
  choice: விசுவாசத்தின் மூலம்
  rationale: πίστις என்பதற்கு இச்சூழலில் வழக்கமான இறையியல் சொல்லான ‘விசுவாசம்’ பயன்படுத்தப்படுகிறது; ‘உண்மைத்தன்மை’ என்ற பொருள் தொடர்புடைய விவாதம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகப் புரிந்துகொள்ளப்பட்டு ‘மெசியா’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: விசுவாசிக்கிற அனைவருக்கும்
  rationale: அனைவரையும் உள்ளடக்கும் πάντας என்பதையும் நிகழ்காலப் பங்கேற்பு வடிவமான πιστεύοντας என்பதையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: διαστολή
  choice: வேறுபாடு
  rationale: இச்சூழலில் மக்களுக்கிடையே வேறுபடுத்திப் பார்ப்பது இல்லை என்ற கருத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின்மேலுள்ள விசுவாசம்
  alternative: இயேசு மெசியாவின் உண்மைத்தன்மை
  rationale: இந்த உடைமை வேற்றுமைத் தொடர் இயேசுவில் வைக்கும் விசுவாசத்தையோ இயேசுவின் உண்மைத்தன்மையையோ குறிக்கலாம். பொதுவான நோக்குநிலை உடைமை வாசிப்பு முதன்மை உரையில் இடம்பெறுகிறது; உண்மையான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: δικαιοσύνη θεοῦ
  choice: கடவுளின் நீதி
  alternative: கடவுளின் நியாயம்
  rationale: ‘கடவுளின் நீதி’ என்பது கிரேக்கத் தொடரின் பரந்த இறையியல் வாய்ப்புகளை—கடவுளின் நீதியான இயல்பு அல்லது செயல், அவர் அளிக்கும் நீதிநிலை—ஒரே விளக்கமாகச் சுருக்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் வகையில் ‘கடவுள்’, ‘நீதி’, ‘வேறுபாடு’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன. வசனம் முந்தைய வாக்கியத்தைத் தொடர்ந்தாலும், தனியாகவும் இயல்பாக வாசிக்க ‘உரியது’ என்ற மறைமுக இணைப்புச் சொல் வெளிப்படுத்தப்பட்டுள்ளது; இது கிரேக்கத்தின் பொருளை விளக்குகிறது, புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
