revisions:
- from: ஏனெனில், ஒரு மனிதர் திருச்சட்டத்தின் செயல்கள் இல்லாமல் விசுவாசத்தினாலேயே நீதிமானாக்கப்படுகிறார்[a] என்று முடிவுசெய்கிறோம்.
  to: ஏனெனில், ஒருவர் விசுவாசத்தினால், திருச்சட்டத்தின் செயல்களுக்கு அப்பாற்பட்டு, நீதிமானாக்கப்படுகிறார்[a] என்று நாங்கள் முடிவுசெய்கிறோம்.
  rationale: The revision removes the potentially over-translating emphatic ‘-ஏ’ from ‘விசுவாசத்தினாலேயே’ and renders χωρὶς ἔργων νόμου explicitly as ‘திருச்சட்டத்தின் செயல்களுக்கு அப்பாற்பட்டு.’ It also uses the inclusive generic ‘ஒருவர்’ for ἄνθρωπον and explicitly retains the first-person plural force of λογιζόμεθα. The justification footnote remains correctly anchored to ‘நீதிமானாக்கப்படுகிறார்.’
