  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: ta
  text: ஏனெனில், ஒருவர் விசுவாசத்தினால், திருச்சட்டத்தின் செயல்களுக்கு அப்பாற்பட்டு, நீதிமானாக்கப்படுகிறார்[a] என்று நாங்கள் முடிவுசெய்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிமான் என்று அறிவிக்கப்படுகிறார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: முடிவுசெய்கிறோம்
  rationale: பவுலின் தர்க்கரீதியான மதிப்பீட்டையும் முடிவையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கக் காரணத் தொடர்பைப் பேணுகிறது.
- source_word: δικαιοῦσθαι
  choice: நீதிமானாக்கப்படுகிறார்
  rationale: செயப்பாட்டு வடிவத்தையும் பவுலின் நீதிமானாக்குதல் சார்ந்த மொழியையும் பேணுகிறது; அறிவிக்கப்படுதல் என்ற நீதிமன்ற நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πίστει
  choice: விசுவாசத்தினாலேயே
  rationale: கருவிப்பொருளை இயல்பாகக் காட்டுகிறது; χωρὶς என்பதன் விலக்குக் கருத்தைத் தமிழில் தெளிவாக்க ‘-ஏ’ வலியுறுத்தல் சேர்க்கப்பட்டுள்ளது.
- source_word: ἄνθρωπον
  choice: ஒரு மனிதர்
  rationale: இங்கு ஆண் ஒருவரை மட்டும் குறிக்காமல் பொதுவாக மனித நபரைக் குறிக்கிறது; மரியாதையான ஒருமைத் தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: χωρὶς
  choice: இல்லாமல்
  rationale: திருச்சட்டத்தின் செயல்களிலிருந்து பிரிந்த அல்லது அவற்றைச் சாராத நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἔργων νόμου
  choice: திருச்சட்டத்தின் செயல்கள்
  rationale: பவுலின் சொற்றொடரின் வடிவத் தொடர்பைப் பேணுகிறது; அதை வெறும் நல்ல செயல்கள் அல்லது ஒழுக்க முயற்சி என்று குறுக்கவில்லை.
theological_decisions:
- issue: δικαιοῦσθαι என்பதன் பவுலிய நுண்பொருள்
  choice: நீதிமானாக்கப்படுகிறார்
  alternative: நீதிமான் என்று அறிவிக்கப்படுகிறார்
  rationale: முதன்மை உரை வழக்கமான இறையியல் சொல்லாட்சியையும் செயப்பாட்டு அமைப்பையும் பேணுகிறது; அறிவிப்புசார் நுண்பொருளை அடிக்குறிப்பு வெளிப்படுத்துகிறது, ஆனால் அதையே ஒரே விளக்கமாகத் திணிக்கவில்லை.
- issue: ἄνθρωπον என்பதன் பொதுப்பொருள்
  choice: ஒரு மனிதர்
  alternative: ஒரு மனிதன்
  rationale: கிரேக்கச் சொல் இலக்கணத்தில் ஆண்பால் வடிவமுடையதாக இருந்தாலும், இங்கு எல்லா மனிதர்களையும் பிரதிநிதித்துவமாகக் குறிக்கிறது; தமிழ் மரியாதை ஒருமை பாலினக் கட்டுப்பாட்டைத் தவிர்க்கிறது.
- issue: πίστει மற்றும் χωρὶς ἔργων νόμου ஆகியவற்றின் எதிர்மறை அமைப்பு
  choice: திருச்சட்டத்தின் செயல்கள் இல்லாமல் விசுவாசத்தினாலேயே
  alternative: திருச்சட்டத்தின் செயல்களுக்கு அப்பாற்பட்டு விசுவாசத்தினால்
  rationale: செயல்களை விலக்கும் வாதத்தைத் தெளிவாகக் காட்டுகிறது; அதேவேளை ‘திருச்சட்டத்தின் செயல்கள்’ என்பதைக் குறிப்பிட்ட ஒரு பிரிவாக முன்கூட்டியே விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘திருச்சட்டம்’, ‘விசுவாசம்’, ‘நீதிமானாக்கப்படுதல்’ ஆகியவை பவுலின் வாதத்துடன் தொடர்ச்சியைப் பேணும் வேதாகமச் சொல்லாட்சிகளாகப் பயன்படுத்தப்பட்டுள்ளன.
