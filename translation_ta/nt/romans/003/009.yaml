id: ROM.3.9
reference: Romans 3:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: ta
  text: அப்படியானால் என்ன? நாம் மேலானவர்களா? எவ்விதத்திலும் இல்லை[a]. ஏனெனில், யூதர்களும் கிரேக்கர்களும் எல்லாரும் பாவத்தின் கீழ் இருக்கிறார்கள்[b] என்று நாம் ஏற்கெனவே குற்றஞ்சாட்டியிருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நமக்கு ஏதாவது அனுகூலம் உண்டா?”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “பாவத்தின் அதிகாரத்திற்குக் கீழ் இருக்கிறார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: அப்படியானால் என்ன?
  rationale: οὖν என்பதன் முடிவுரைக்கும் தொடர்பை வெளிப்படையாக வைத்துக்கொண்டு, பவுலின் சுருக்கமான வாதக் கேள்வியை இயல்பான தமிழில் தருகிறது.
- source_word: προεχόμεθα
  choice: நாம் மேலானவர்களா?
  rationale: வினையின் விவாதத்திற்குரிய இடைநிலைப் பொருளையும், யூதர்கள் மற்றவர்களைவிட உயர்ந்த நிலையில் உள்ளார்களா என்ற சூழல்சார் ஒப்பீட்டையும் சுருக்கமாகக் காக்கிறது. ‘நமக்கு ஏதாவது அனுகூலம் உண்டா?’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐ πάντως
  choice: எவ்விதத்திலும் இல்லை
  rationale: சூழலில் உள்ள வலுவான மறுப்பைத் தெளிவான, கண்ணியமான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: προῃτιασάμεθα
  choice: நாம் ஏற்கெனவே குற்றஞ்சாட்டியிருக்கிறோம்
  rationale: முன்னரே முன்வைக்கப்பட்ட குற்றச்சாட்டைக் குறிக்கும் வினையின் நீதிமன்றத் தன்மையைப் பாதுகாக்கிறது.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: யூதர்களும் கிரேக்கர்களும் ஆகிய
  rationale: τε καὶ என்ற இணை அமைப்பையும், மூலத்தில் உள்ள யூதர்–கிரேக்கர் வேறுபாட்டையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: πάντας
  choice: அனைவரும்
  rationale: இரு குழுக்களையும் விதிவிலக்கின்றி உள்ளடக்கும் முழுமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: பாவத்தின் கீழ் இருக்கிறார்கள்
  rationale: பாவத்திற்குக் கீழ்ப்பட்டிருக்கும் நிலையைச் சுட்டும் பவுலின் செறிவான உருவகத்தை விளக்கமாக விரித்துவிடாமல் காக்கிறது.
theological_decisions:
- issue: προεχόμεθα என்பதில் முதலாம் நபர் பன்மையின் பொருள்
  choice: யூதர்களின் ஒப்பீட்டு மேன்மையைப் பற்றிய கேள்வியாக ‘நாம் மேலானவர்களா?’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நமக்கு ஏதாவது அனுகூலம் உண்டா?’
  rationale: ரோமர் 3:1–9 யூதர்களின் சிறப்புரிமையையும் பொறுப்பையும் ஆராய்கிறது. முதன்மை மொழிபெயர்ப்பு ஒழுக்க அல்லது நிலைசார் மேன்மை மறுக்கப்படுவதை வெளிப்படுத்துகிறது; ஆனால் வினையின் ‘அனுகூலம்’ என்ற சாத்தியமான பொருளை அடிக்குறிப்பு மூலம் திறந்தே வைக்கிறது.
- issue: ὑφ’ ἁμαρτίαν என்பதிலுள்ள பாவத்தின் ஆட்சி அல்லது கீழ்ப்பட்ட நிலை
  choice: ‘பாவத்தின் கீழ்’ என்ற செறிவான உருவகம் காக்கப்பட்டது.
  alternative: ‘பாவத்தின் அதிகாரத்திற்குக் கீழ்’
  rationale: மூலத்தின் சொற்றொடர் பாவத்தை ஆளும் சக்தியாக உணர்த்தலாம்; எனினும் அந்த விளக்கத்தை முதன்மை உரைக்குள் கட்டாயமாகச் சேர்க்காமல், அடிக்குறிப்பில் மாற்று வாசிப்பாக வழங்குவது உண்மையான பொருள் விரிவை பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. பவுலின் சுருக்கமான வாத ஓட்டமும் நீதிமன்றச் சொல்லாட்சியும் பாதுகாக்கப்பட்டுள்ளன; விவாதத்திற்குரிய இரு பொருள் நுணுக்கங்கள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
