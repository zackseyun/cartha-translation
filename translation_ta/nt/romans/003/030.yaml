source:
  edition: SBLGNT
  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: ta
  text: தேவன் ஒருவரே என்பதால்[a], அவர் விருத்தசேதனம் பெற்றவர்களை விசுவாசத்தினாலும், விருத்தசேதனம் பெறாதவர்களை விசுவாசத்தின் மூலமாகவும் நீதிமான்கள் என்று அறிவிப்பார்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையாகவே தேவன் ஒருவரே என்றால்.”
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் நேரடியாக “விருத்தசேதனம்” என்றும் “விருத்தசேதனமின்மை” என்றும் உள்ளது; அவை முறையே விருத்தசேதனம் பெற்றவர்களையும் பெறாதவர்களையும் குறிக்கின்றன.
    reason: cultural_note
  - marker: c
    text: பவுல் “விசுவாசத்தினால்” என்றும் “விசுவாசத்தின் மூலமாக” என்றும் இரண்டு வேறுபட்ட சொற்றொடர்களைப் பயன்படுத்துகிறார்; இந்த வேறுபாடு கூர்மையான கருத்து வேறுபாட்டைக் காட்டாமல் நடையியல் வேறுபாடாக இருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: என்பதால்
  rationale: இங்கு பவுல் ஐயத்தை வெளிப்படுத்தாமல், அனைவரும் ஏற்றுக்கொள்ளும் ஒரே-தேவன் நம்பிக்கையைத் தமது முடிவுக்கான காரணமாக முன்வைக்கிறார். எனினும், கிரேக்கச் சொல்லின் நிபந்தனைத் தொனி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἷς ὁ θεός
  choice: தேவன் ஒருவரே
  rationale: ஒரே தேவன் என்ற வலியுறுத்தலை இயல்பான, சுருக்கமான தமிழில் காக்கிறது.
- source_word: δικαιώσει
  choice: நீதிமான்கள் என்று அறிவிப்பார்
  rationale: δικαιόω என்பதன் நீதித்துறை சார்ந்த அறிவிப்பு உணர்வையும் எதிர்கால வினையையும் தெளிவாகக் காக்கிறது.
- source_word: περιτομήν
  choice: விருத்தசேதனம் பெற்றவர்களை
  rationale: சடங்கைக் குறிக்கும் பெயர்ச்சொல் இங்கு அந்தச் சடங்கைப் பெற்ற மக்களைக் குறிக்கும் ஆகுபெயராகப் பயன்படுகிறது; அதை இன அடையாளமாக மிகையாக விளக்காமல் மக்கள் குழுவைக் குறிக்கிறது.
- source_word: ἐκ πίστεως
  choice: விசுவாசத்தினால்
  rationale: விசுவாசத்தை அடிப்படை அல்லது வழிமுறை எனக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: ἀκροβυστίαν
  choice: விருத்தசேதனம் பெறாதவர்களை
  rationale: கிரேக்கப் பெயர்ச்சொல் இங்கு விருத்தசேதனம் பெறாத மக்களைக் குறிக்கும் ஆகுபெயர்; ‘பிற இனத்தார்’ என்று விளக்கமாக மாற்றாமல் அதன் உருவக அமைப்பைக் காக்கிறது.
- source_word: διὰ τῆς πίστεως
  choice: விசுவாசத்தின் மூலமாக
  rationale: முதல் தொடரிலுள்ள ἐκ என்பதிலிருந்து வேறுபட்ட διά என்ற முன்னிடைச்சொல்லைத் தமிழிலும் வேறுபடுத்திக் காட்டுகிறது; கிரேக்கக் குறிப்புச் சுட்டியை இங்கு தனியாக மொழிபெயர்ப்பது தமிழில் இயல்பாக இருக்காது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இச்சூழலில் πίστις என்பதற்கு இயல்பான பவுலிய சொல்லாக ‘விசுவாசம்’ பயன்படுத்தப்படுகிறது; ‘உண்மைத்தன்மை’ என்ற பொருள் இங்கு சூழலால் கோரப்படவில்லை.
theological_decisions:
- issue: ἐκ πίστεως மற்றும் διὰ τῆς πίστεως ஆகியவற்றுக்கிடையில் பவுல் இறையியல் வேறுபாட்டைக் குறிக்கிறாரா?
  choice: ‘விசுவாசத்தினால்’ மற்றும் ‘விசுவாசத்தின் மூலமாக’ என்று முன்னிடைச்சொல் வேறுபாட்டைப் பாதுகாத்தல்; ஆனால் தனித்த இறையியல் வேறுபாட்டை வலியுறுத்தாமல் இருத்தல்.
  alternative: இரண்டையும் ‘விசுவாசத்தினால்’ என்று ஒரேவிதமாக மொழிபெயர்த்தல்; அல்லது அடிப்படை மற்றும் வழிமுறை என்ற கூர்மையான கோட்பாட்டு வேறுபாட்டை முன்வைத்தல்.
  rationale: கிரேக்கம் இரண்டு வேறுபட்ட முன்னிடைச்சொற்களைப் பயன்படுத்துகிறது. அவற்றை மொழிபெயர்ப்பில் காணச்செய்வது பொருத்தமானது; ஆனால் சூழல் அவற்றுக்கிடையில் உறுதியான கோட்பாட்டு வேறுபாட்டைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல் என்பதால் தக்கவைக்கப்பட்டு, ஆகுபெயர் பயன்பாடு வாசகருக்குத் தெளிவாக மக்கள் குழுக்களாக மொழிபெயர்க்கப்பட்டுள்ளது. ‘நீதிமான்கள் என்று அறிவிப்பார்’ என்பது சட்டரீதியான அறிவிப்பு நுணுக்கத்தைத் தெளிவாக்குகிறது.
