  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: ta
  text: ஒருபோதும் இல்லை![a] இல்லையென்றால், கடவுள் உலகத்தை எப்படி நியாயந்தீர்ப்பார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்படியெல்லாம் இல்லை!”; இன்னும் சொல்லுக்குச் சொல் முறையில், “அப்படி ஒருபோதும் ஆகாதிருக்கட்டும்!”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: ஒருபோதும் இல்லை!
  rationale: இது வெறும் விருப்பவாக்கியம் அல்ல; முன்வைக்கப்பட்ட முடிவை மிக வலுவாக மறுக்கும் பவுலின் வழக்கமான சொற்றொடர். நவீனத் தமிழில் அதன் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπεὶ
  choice: இல்லையென்றால்
  rationale: மறுக்கப்பட்ட கருத்தை ஏற்றுக்கொண்டால் எழும் முரண்பாட்டை அறிமுகப்படுத்துகிறது; பவுலின் வாத ஓட்டத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: κρινεῖ
  choice: எப்படி நியாயந்தீர்ப்பார்
  rationale: எதிர்காலக் குறிப்பைக் கொண்ட வினைச்சொல்லின் நேரடிப் பொருளையும், கேள்வியின் சொல்லாட்சியையும் காக்கிறது.
- source_word: κόσμον
  choice: உலகத்தை
  rationale: இங்கே கடவுளின் தீர்ப்புக்கு உட்படும் உலகத்தை விரிவான பொருளில் குறிக்கிறது; இயல்பானதும் மரபாகப் புரிந்துகொள்ளப்படுவதுமான தமிழ்ச் சொல்.
theological_decisions:
- issue: μὴ γένοιτο என்ற பவுலின் மறுப்புச் சொற்றொடரின் வலிமை
  choice: முந்தைய முடிவை வலுவாக மறுக்கும் இயல்பான தமிழ்ச் சொற்றொடராக மொழிபெயர்த்தல்
  alternative: அப்படி ஒருபோதும் ஆகாதிருக்கட்டும்!
  rationale: சொல்லுக்குச் சொல் விருப்பவாக்கியமாக மாற்றாமல், மூலத்தில் உள்ள தீவிர மறுப்பைத் தெளிவான நவீனத் தமிழில் காக்கிறது; கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகருக்கு உடனடியாகப் புரியும் அதே நேரத்தில் கண்ணியமான நடை. பவுலின் தீவிர மறுப்பும் அதைத் தொடரும் சொல்லாட்சிக் கேள்வியும் காக்கப்பட்டுள்ளன.
