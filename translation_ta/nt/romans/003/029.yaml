source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: ta
  text: அல்லது, அவர் யூதர்களுக்கு மட்டுமே கடவுளா? யூதரல்லாத மக்களுக்கும் அவர் கடவுள் அல்லவா? ஆம், யூதரல்லாத மக்களுக்கும் அவர் கடவுள்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதரல்லாத மக்கள்’ என்பதற்குப் பதிலாக, ἐθνῶν என்பதை இன்னும் நேரடியான முறையில் ‘நாடுகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: பவுலின் வாதத்தில் அடுத்த சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்தும் இணைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: Ἰουδαίων
  choice: யூதர்களுக்கு
  rationale: θεός என்பதுடன் வரும் உடைமைத் தொடர்பைத் தமிழில் இயல்பாக ‘யூதர்களுக்கு ... கடவுள்’ என வெளிப்படுத்துகிறது.
- source_word: ὁ θεὸς
  choice: அவர் ... கடவுள்
  rationale: θεός என்பதற்கான வழக்கமான மொழிபெயர்ப்பு ‘கடவுள்’; கேள்வித் தொடரில் குறிப்பிட்ட கடவுளைக் குறிக்கும் கிரேக்கச் சுட்டைத் தமிழில் ‘அவர்’ இயல்பாகத் தாங்குகிறது.
- source_word: μόνον
  choice: மட்டும்தான்
  rationale: யூதர்களுக்கே என்ற விலக்குத் தன்மையைத் தெளிவாகவும் சொல்லாட்சிக் கேள்வியின் வலிமையுடனும் தெரிவிக்கிறது.
- source_word: οὐχὶ
  choice: அல்லவா?
  rationale: உடன்பாட்டான பதிலை எதிர்பார்க்கும் கிரேக்க எதிர்மறைக் கேள்வியின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐθνῶν
  choice: பிற இனத்தவருக்கு
  rationale: யூதர்களுடன் வேறுபடுத்தப்படும் யூதரல்லாத மக்களைத் தெளிவாகக் குறிக்கிறது; ‘நாடுகள்’ என்ற அரசியல் அல்லது புவியியல் தவறுணர்வைத் தவிர்க்கிறது.
- source_word: ναὶ
  choice: ஆம்
  rationale: சொல்லாட்சிக் கேள்விக்கான சுருக்கமான உறுதிப்பாட்டை நேரடியாகக் கொடுக்கிறது.
- source_word: καὶ
  choice: -உம்
  rationale: யூதர்களோடு பிற இனத்தவரையும் சேர்த்துக்கொள்ளும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐθνῶν என்பதை ‘பிற இனத்தவர்’ எனவா ‘நாடுகள்’ எனவா மொழிபெயர்ப்பது
  choice: பிற இனத்தவர்
  alternative: நாடுகள்
  rationale: இவ்வசனத்தில் யூதர்களுக்கும் ἔθνη என்பவர்களுக்கும் இடையிலான வெளிப்படையான வேறுபாடு காணப்படுகிறது. ஆகவே இது அரசியல் நாடுகளை அல்ல, யூதரல்லாத மக்களைச் சுட்டுகிறது. ‘பிற இனத்தவர்’ என்பது ஒரே கடவுள் இரு குழுக்களுக்கும் கடவுள் என்ற பவுலின் வாதத்தைத் தெளிவாகக் காக்கிறது.
- issue: இரண்டாம் மற்றும் இறுதிக் கூறுகளில் ‘கடவுள்’ என்பதை வெளிப்படையாக மீண்டும் கூறுவதா
  choice: தமிழின் தெளிவுக்காக வெளிப்படையாகக் கூறுதல்
  alternative: கிரேக்கத்தைப் போல் ‘பிற இனத்தவருக்கும் அல்லவா? ஆம், பிற இனத்தவருக்கும்’ என்று விடுதல்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள பெயர்ச்சொல் சூழலால் தெளிவாகிறது; தமிழிலும் பொருள் ஊகிக்கக்கூடியதாயினும் ‘கடவுள்’ என்பதை மீண்டும் கூறுவது கருத்தை மாற்றாமல் கேள்வி-பதில் தொடரைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கும் புரியும் கண்ணியமான சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது. ‘மட்டும்தான்’ மற்றும் ‘அல்லவா?’ ஆகியவை பவுலின் சொல்லாட்சிக் கேள்விகளின் இயல்பான வலிமையைத் தக்கவைக்கின்றன; ‘பிற இனத்தவர்’ என்பது சமகாலத் தமிழில் ‘யூதரல்லாத மக்கள்’ என்ற பொருளைத் தெளிவாகத் தருகிறது.
