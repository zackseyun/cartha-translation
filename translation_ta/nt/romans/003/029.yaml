    issue: ‘பிற இனத்தவர்’ is somewhat broader than ἐθνῶν in this explicit Jews/non-Jews contrast.
    rationale: It may denote people of any other ethnicity from a given speaker’s perspective. ‘யூதரல்லாத மக்கள்’ directly conveys the contextual reference without importing an archaic or socially loaded label.
  - severity: low
    issue: ‘மட்டும்தான்’ is slightly colloquial for the register of this rhetorical question.
    rationale: ‘மட்டுமே’ retains the exclusivity of μόνον in a smoother modern-standard literary register.
