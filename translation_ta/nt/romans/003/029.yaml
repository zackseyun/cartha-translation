- from: அல்லது, அவர் யூதர்களுக்கு மட்டும்தான் கடவுளா? பிற இனத்தவருக்கும் கடவுள் அல்லவா? ஆம், பிற இனத்தவருக்கும் கடவுள்தான்.[a]
  to: அல்லது, அவர் யூதர்களுக்கு மட்டுமே கடவுளா? யூதரல்லாத மக்களுக்கும் அவர் கடவுள் அல்லவா? ஆம், யூதரல்லாத மக்களுக்கும் அவர் கடவுள்தான்.[a]
  rationale: The revision preserves the source’s rhetorical questions, expected affirmative force, and concluding affirmation. It makes the contextual Jewish/non-Jewish sense of ἐθνῶν explicit in idiomatic modern Tamil, while the footnote preserves ‘நாடுகள்’ as the more literal lexical alternative. Repeating ‘அவர் கடவுள்’ is retained as a natural clarification of the Greek ellipsis and does not alter the meaning.
