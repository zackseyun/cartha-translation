review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands the Greek passive in «when you are judged» and preserves the judicial-vindication sense of δικαιωθῇς. However, «ஏனெனில்» means “for/because,” whereas καθὼς γέγραπται introduces a citation, “as it is written.” The revised wording restores that relation. «உண்மையுள்ளவர்» is also a more precise Tamil expression for God’s truthfulness in the contrast with human falsehood than «உண்மையானவர்», which can suggest “real.”
  naturalness: The revision removes the cumbersome repeated purpose ending «-ப்படும்படிக்கும்» and uses a clear, dignified modern Tamil quotation. «ஒவ்வொரு மனிதரும் பொய்யர்» is retained as a compact literary-Biblical predicate construction that is comprehensible in modern standard Tamil.
  terminology: «நீதியுள்ளவர் என்று நிரூபிக்கப்படவும்» conveys forensic vindication without implying that God is made righteous. The respectful second-person forms «உமது/நீர்» are appropriate within the quotation. The alternative reading concerning the Hebrew Psalm wording remains explicitly footnoted.
  issues:
  - severity: medium
    issue: Citation formula rendered as causal conjunction
    rationale: «ஏனெனில்» does not translate καθὼς γέγραπται (“as it is written”) and changes the stated relationship to the quotation. It should be «எழுதப்பட்டிருக்கிறபடி» or an equivalent citation formula.
  - severity: low
    issue: «உண்மையானவர்» can be semantically imprecise
    rationale: In Tamil it may mean “real/genuine.” In this antithesis with ψεύστης, «உண்மையுள்ளவர்» more naturally expresses God’s truthfulness and reliability.
  - severity: low
    issue: Quoted purpose clauses are stylistically cumbersome
    rationale: The repeated «-ப்படும்படிக்கும்» is understandable but unnatural in modern Tamil. Finite-purpose coordination with «-வும்» is clearer while retaining ὅπως ἄν.
