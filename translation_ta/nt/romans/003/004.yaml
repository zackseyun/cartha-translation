id: ROM.3.4
reference: Romans 3:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: ta
  text: 'அப்படி ஒருபோதும் ஆகாதிருக்கட்டும்! மாறாக, கடவுள் உண்மையுள்ளவர் என்றும், ஒவ்வொரு மனிதரும் பொய்யர் என்றும் விளங்கட்டும். எழுதப்பட்டிருக்கிறபடி:


    “உமது வார்த்தைகளில் நீர் நீதியுள்ளவர் என்று நிரூபிக்கப்படவும்[a],


    நீர் தீர்ப்பிடப்படும்போது வெல்லவும்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் சரியானவர் என்று காட்டப்படவும்” அல்லது “நீர் நீதியுள்ளவர் என்று உறுதிப்படுத்தப்படவும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீர் தீர்ப்பிடும்போது.” இது சங்கீதம் 51:4-இன் எபிரெயச் சொற்றொடரை இன்னும் நேரடியாகப் பிரதிபலிக்கிறது; ஆனால் ரோமர் கடிதத்தின் கிரேக்கச் சொற்றொடரை இயல்பாக “நீர் தீர்ப்பிடப்படும்போது” என்று வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: அப்படி ஒருபோதும் ஆகாதிருக்கட்டும்!
  rationale: பவுலின் வலுவான மறுப்பையும், கிரேக்கத்தில் உள்ள விருப்பநிலைத் தொனியையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: γινέσθω ... ὁ θεὸς ἀληθής
  choice: கடவுள் உண்மையானவர் என ... விளங்கட்டும்
  rationale: γινέσθω என்பதன் கட்டளை வலிமையைப் பேணுவதோடு, கடவுள் உண்மையானவராக ஆகிறார் என்ற தவறான பொருளைத் தவிர்த்து, அவரது உண்மைத்தன்மை வெளிப்படுவதைச் சொல்கிறது.
- source_word: πᾶς ... ἄνθρωπος
  choice: ஒவ்வொரு மனிதரும்
  rationale: ἄνθρωπος இங்கு ஆண் பாலினத்தை மட்டும் அல்லாமல் எல்லா மனிதரையும் பொதுவாகக் குறிக்கிறது; πᾶς என்பதன் பகிர்ந்தளிக்கும் வலிமையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: ψεύστης
  choice: பொய்யர்
  rationale: பொய் சொல்பவர் அல்லது பொய்மையானவர் என்ற கிரேக்கப் பெயர்ச்சொல்லின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: καθὼς γέγραπται
  choice: இவ்வாறு எழுதப்பட்டுள்ளது
  rationale: வேதாகம மேற்கோளை அறிமுகப்படுத்தும் நிலையான சூத்திரத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: δικαιωθῇς
  choice: நீதியுள்ளவர் என்று உறுதிப்படுத்தப்படும்படி
  rationale: கடவுள் நீதியுள்ளவராக மாற்றப்படுகிறார் என்று அல்லாமல், அவர் நீதியுள்ளவர் எனத் தீர்ப்பில் நிறுவப்படுகிறார் என்ற தடயவியல் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: λόγοις
  choice: வார்த்தைகளில்
  rationale: கிரேக்கச் சொல்லையும் சங்கீத மேற்கோளின் சூழலையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: νικήσεις
  choice: வெற்றிபெறும்படி
  rationale: நீதித்தீர்ப்பு சார்ந்த சூழலில் வெற்றி அல்லது மேலோங்குதல் என்ற பொருளை, தேவையற்ற போரியல் தொனி இல்லாமல் தெரிவிக்கிறது.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: நீர் தீர்ப்பிடப்படும்போது
  rationale: ரோமர் கடிதத்தின் கிரேக்க வடிவிலுள்ள இயல்பான செயப்பாட்டு வாசிப்பை அப்படியே காக்கிறது.
theological_decisions:
- issue: கடவுளைப் பற்றிய δικαιωθῇς என்பதன் தடயவியல் பொருள்
  choice: நீதியுள்ளவர் என்று உறுதிப்படுத்தப்படுதல்
  alternative: நீதிமானாக்கப்படுதல்; நீதியுள்ளவர் என்று விளங்குதல்
  rationale: இங்கு கடவுள் நீதியுள்ளவராக மாற்றப்படுவது பொருள் அல்ல; மனிதப் பொய்மைக்கு எதிராக அவரது உண்மையும் நீதியும் நிரூபிக்கப்படுவதே கருத்து.
- issue: ἐν τῷ κρίνεσθαί σε என்பதன் செயப்பாட்டு அல்லது செய்வினை வாசிப்பு
  choice: நீர் தீர்ப்பிடப்படும்போது
  alternative: நீர் தீர்ப்பிடும்போது
  rationale: ரோமர் 3:4-இன் கிரேக்க இலக்கணம் இயல்பாகச் செயப்பாட்டுப் பொருளைக் கொடுக்கிறது; ஆனால் சங்கீதம் 51:4-இன் எபிரெய வடிவம் செய்வினை வாசிப்பை ஆதரிப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிதில் புரியக்கூடிய, ஆனால் வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாகக் குறிப்பிடும் மேற்கோளில் மரியாதைப் பன்மையான “நீர்/உமது” வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
