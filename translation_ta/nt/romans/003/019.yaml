  source_fidelity: 'முதன்மைச் செய்தி நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: νόμος, சட்டத்தின் அதிகார வரம்புக்குட்பட்டோர், வாய் அடைக்கப்படுதல், உலகளாவிய சட்டவியல் பொறுப்புநிலை ஆகியவை மூலத்துடன் ஒத்துள்ளன. ஆனால் ‘இருப்பவர்களிடமே’ என்பதில் உள்ள -மே, மூலத்தில் இல்லாத வலியுறுத்தலான ‘அவர்களிடமே/அவர்களுக்கு மட்டுமே’ என்ற நுணுக்கத்தைச் சேர்க்கிறது. மேலும் ‘இதனால்’ நோக்கத்தைவிட விளைவை முன்னிறுத்துகிறது; ἵνα-வின் நோக்கத் தொடர்பைத் தெளிவாக்குவது பாதுகாப்பானது.'
