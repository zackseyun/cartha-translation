id: ROM.3.19
reference: Romans 3:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: ta
  text: சட்டம் சொல்வதெல்லாம் சட்டத்தின் கீழ் இருப்பவர்களிடம் பேசுகிறது என்பதை நாம் அறிவோம்; ஒவ்வொரு வாயும் அடைக்கப்படவும், உலகம் முழுவதும் கடவுளுக்குப் பதில் சொல்ல வேண்டிய நிலைக்கு வரவும் அது அப்படிச் செய்கிறது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “சட்டத்திற்குள் இருப்பவர்களிடம்.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது “கடவுளுக்கு முன் பொறுப்புக்குரியதாகும்,” “கடவுளின் தீர்ப்புக்கு உட்படும்,” அல்லது “குற்றவாளியாகக் காணப்படும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: என்பது நமக்குத் தெரியும்
  rationale: Οἴδαμεν என்பதன் பகிரப்பட்ட அறிவை இயல்பான தமிழில் தருகிறது. δέ இங்கு மென்மையான உரையாடல் இணைப்பாக இருப்பதால், சூழலில் இல்லாத காலப்பொருளைச் சேர்க்காமல் தமிழ் வாக்கிய ஓட்டத்தில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ὁ νόμος
  choice: சட்டம்
  rationale: பவுல் குறிப்பிட்டுத் தெரிந்த ஓர் அதிகாரபூர்வச் சட்டத்தைக் குறிப்பிடுவதைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: சட்டத்தின் கீழ் இருப்பவர்களிடம்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘சட்டத்திற்குள் இருப்பவர்கள்’ என்றாலும், அதன் அதிகார வரம்புக்கு உட்பட்டவர்களை நவீன தமிழில் இயல்பாகக் குறிக்க ‘சட்டத்தின் கீழ்’ எனத் தரப்பட்டுள்ளது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: λαλεῖ
  choice: பேசுகிறது
  rationale: முன்னுள்ள λέγει என்பதற்கான ‘சொல்கிறது’ என்பதிலிருந்து மூலத்தின் வினைச்சொல் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: ἵνα
  choice: இதனால்
  rationale: சட்டத்தின் பேச்சால் ஏற்படும் நோக்கத்தையும் விளைவையும் தமிழில் இயல்பாக இணைக்கிறது; கிரேக்கத்தின் நோக்கம்–விளைவு நுணுக்கத்தை மிகையாகத் தீர்மானிப்பதில்லை.
- source_word: πᾶν στόμα φραγῇ
  choice: ஒவ்வொரு வாயும் அடைக்கப்பட்டு
  rationale: தற்காப்பாகப் பேச இயலாத நீதிமன்றப் படிமத்தையும் ‘வாய்’ என்ற உருவகத்தையும் அப்படியே வைத்திருக்கிறது.
- source_word: ὑπόδικος
  choice: கடவுளுக்குப் பதில் சொல்ல வேண்டிய நிலை
  rationale: கடவுளின் நீதித்தீர்ப்புக்கு உட்பட்ட பொறுப்புநிலையைத் தெளிவாகச் சொல்கிறது; ‘குற்றவாளி என்று தீர்க்கப்பட்டது’ என்ற அளவுக்கு மூலத்தை வலுப்படுத்தவில்லை.
- source_word: γένηται
  choice: நிலைக்கு வரும்
  rationale: வெறுமனே அந்த நிலையில் இருப்பதை அல்ல, அந்த நிலைக்கு வருவதைச் சுட்டும் γίνομαι வினையின் பொருளைப் பாதுகாக்கிறது.
- source_word: πᾶς ὁ κόσμος
  choice: உலகம் முழுவதும்
  rationale: மனிதகுலம் அனைத்தையும் உள்ளடக்கும் விரிவை இயல்பான தமிழில் தருகிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: ὑπόδικος உடன் வரும் தத்திவேற்றுமையின் திசையைப் பாதுகாத்து, பொறுப்புக் கூற வேண்டியது கடவுளுக்கே என்பதைத் தெரிவிக்கிறது.
theological_decisions:
- issue: ὑπόδικος என்பதன் சட்டவியல் வலிமையும் கடவுளின் நீதித்தீர்ப்புடனான தொடர்பும்
  choice: உலகம் முழுவதும் கடவுளுக்குப் பதில் சொல்ல வேண்டிய நிலைக்கு வருகிறது
  alternative: உலகம் முழுவதும் கடவுளுக்கு முன் குற்றவாளியாகிறது; அல்லது கடவுளின் தீர்ப்புக்கு உட்படுகிறது
  rationale: இந்தச் சொல் கடவுளின் நீதிமன்றத்திற்கு முன் மனிதகுலம் பொறுப்புக்குரியதாக இருப்பதை வலியுறுத்துகிறது. ஏற்கெனவே இறுதியாகக் குற்றவாளி எனத் தீர்க்கப்பட்டதாகச் சொல்லாமல் அதன் சட்டவியல் வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘சட்டம்’ என்ற சொல்லை மீண்டும் பயன்படுத்துவது கிரேக்கத்தில் உள்ள νόμος–νόμος தொடர்பைத் தெளிவாக வைத்திருக்கிறது. நீதிமன்ற உருவகமும் உலகளாவிய பொறுப்பும் விளக்கவுரையால் மென்மையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
