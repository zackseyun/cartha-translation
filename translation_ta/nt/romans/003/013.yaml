  text: τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: ta
  text: அவர்களுடைய தொண்டை திறந்த கல்லறை; தங்கள் நாவுகளால் அவர்கள் வஞ்சிக்கிறார்கள்[a]; ஆஸ்ப் பாம்புகளின்[b] நஞ்சு[c] அவர்களுடைய உதடுகளுக்குக் கீழே இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் நாவுகளால் அவர்கள் வஞ்சித்துக்கொண்டிருந்தார்கள்”; கிரேக்க முற்றாத இறந்தகால வினை தொடர்ச்சியான செயலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆஸ்ப்’ என்பது ஒரு நச்சுப்பாம்பு வகை; பொதுவாக “விரியன் பாம்புகள்” அல்லது “விஷப்பாம்புகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “நஞ்சு” என்பதற்கு “விஷம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: கல்லறை
  rationale: மரணத்தையும் அழுகலையும் குறிக்கும் மூல உருவகத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: ἀνεῳγμένος
  choice: திறந்த
  rationale: நிறைவுற்ற செயலில் விளைந்த தற்போதைய நிலையைக் குறிக்கும் கிரேக்க வடிவத்தை, தமிழில் இயல்பான பெயரடைத் தொடராக வழங்குகிறது.
- source_word: λάρυγξ
  choice: தொண்டை
  rationale: உடல் உறுப்பைக் குறிக்கும் தெளிவான, பொதுவாகப் புரியும் தமிழ்ச் சொல்; மூலத்தின் உயிருள்ள உருவகத்தையும் காக்கிறது.
- source_word: ἐδολιοῦσαν
  choice: வஞ்சிக்கிறார்கள்
  rationale: நீடித்த அல்லது வழக்கமான வஞ்சகப் பேச்சை இயல்பான தமிழ்ப் பொதுநிகழ்காலத்தில் வெளிப்படுத்துகிறது; கிரேக்க இறந்தகால நீடிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἰὸς
  choice: நஞ்சு
  rationale: பாம்புடன் தொடர்புடைய சூழலில் இயல்பாகவும் துல்லியமாகவும் பயன்படும் தமிழ்ச் சொல்.
- source_word: ἀσπίδων
  choice: விரியன் பாம்புகள்
  rationale: நஞ்சுள்ள பாம்பு வகையைக் குறிக்கும் கிரேக்கச் சொல்லுக்கு வாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய தமிழ் இணை; இனவகை அடையாளத்தின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: அவர்களுடைய உதடுகளுக்குக் கீழே
  rationale: மூலத்தின் இடவியல் மற்றும் உடல் சார்ந்த உருவகத்தை நேரடியாகத் தக்கவைக்கிறது.
