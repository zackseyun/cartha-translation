id: ROM.3.11
reference: Romans 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: ta
  text: புரிந்துகொள்பவர் யாரும் இல்லை; கடவுளைத் தேடுபவர்[a] யாரும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளை நாடுபவர்.’
    reason: ἐκζητέω என்ற கூட்டுவினையின் தீவிரமான அல்லது நோக்கமுள்ள தேடுதலின் நுண்பொருளைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: συνίων
  choice: புரிந்துகொள்கிறவன்
  rationale: இந்த நிகழ்காலப் பெயரெச்சம் அறிவோடும் உள்ளுணர்வோடும் புரிந்துகொள்வதைக் குறிக்கிறது. ‘புரிந்துகொள்கிறவன்’ என்பது அதன் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐκζητῶν
  choice: தேடுகிறவன்
  rationale: இந்தக் கூட்டுவினை தீவிரமாகத் தேடுதல் அல்லது நாடித் தேடுதல் என்ற வலிமையைக் கொண்டிருக்கலாம். முதன்மை உரையில் ‘தேடுகிறவன்’ இயல்பாக உள்ளது; கூடுதல் வலிமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οὐκ ἔστιν
  choice: ஒருவனும் இல்லை
  rationale: கிரேக்கத்தின் திட்டவட்டமான பொதுமறுப்பைத் தமிழில் இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது. இரண்டு முறையும் இதே அமைப்பு வைக்கப்பட்டுள்ளது.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: புரிந்துகொள்கிறவன் / தேடுகிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கப் பெயரெச்சங்களைத் தமிழில் இயல்பான வினையாலணையும் பெயர் வடிவங்களால் வழங்குகிறது.
- source_word: τὸν θεόν
  choice: கடவுளை
  rationale: இச்சூழலில் ஒரே கடவுளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்; வேற்றுமை உருபு கிரேக்கத்தில் தேடுதலின் நேரடிச் செயப்படுபொருளைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: பவுலின் மேற்கோள் தொடரில் மறுப்பின் வரம்பு
  choice: ‘ஒருவனும் இல்லை’ என்பதை இருமுறையும் எந்தத் தளர்த்தலும் இல்லாமல் வைத்தல்
  alternative: ‘உண்மையாகப் புரிந்துகொள்கிறவன் ஒருவனும் இல்லை; மெய்யாகக் கடவுளைத் தேடுகிறவன் ஒருவனும் இல்லை’
  rationale: கிரேக்க உரை திட்டவட்டமான மறுப்பைக் கூறுகிறது. ‘உண்மையாக’ அல்லது ‘மெய்யாக’ போன்ற விளக்கச் சொற்களைச் சேர்ப்பது மூலத்தில் இல்லாத தகுதிப்பாட்டைப் புகுத்தும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. இணையான இரு கூறுகளின் அமைப்பும் திட்டவட்டமான மறுப்பும் பாதுகாக்கப்பட்டுள்ளன.
