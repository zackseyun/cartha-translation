id: ROM.3.8
reference: Romans 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: ta
  text: மேலும், எங்கள்மீது அவதூறு சுமத்தப்படுவதாகவும், சிலர் நாங்கள் இப்படிச் சொல்கிறோம் எனக் கூறுவதாகவும் இருக்கையில், “நன்மை வருவதற்காகத் தீமை செய்வோமாக” என்று ஏன் சொல்லக்கூடாது? அவர்களுக்கான தீர்ப்பு நியாயமானதே.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில் வாக்கியத்தின் தொடக்கம் முந்தைய வாதத்தைத் தொடர்ந்து வரும் சுருக்கமான அமைப்பாக உள்ளது. சொல்லமைப்பை இன்னும் நெருக்கமாகப் பின்பற்றினால்: “மேலும்—எங்கள்மீது அவதூறு சுமத்தப்படுவதுபோலவும், சிலர் நாங்கள் சொல்கிறோம் எனக் கூறுவதுபோலவும்—‘நன்மை வரும்படி தீமை செய்வோமாக’ என்று ஏன் சொல்லக்கூடாது?”'
    reason: lexical_alternative
  - marker: b
    text: “அவர்களுக்கான” என்பது முதன்மையாக இந்தப் பொய்க்குற்றச்சாட்டையும் அதில் உள்ள வாதத்தையும் முன்வைப்பவர்களைக் குறிக்கிறது; சுட்டுப்பெயரின் துல்லியமான எல்லை குறித்து வேறுபட்ட விளக்கங்கள் உள்ளன.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: எங்கள்மீது அவதூறு சுமத்தப்படுவதுபோலவும்
  rationale: இங்கு பவுலின் செய்தி பகைமையுடன் திரித்துக் கூறப்படுவதையே வினைச்சொல் குறிக்கிறது; கடவுளைத் தூஷிப்பது என்ற பொருள் இச்சூழலில் இல்லை.
- source_word: φασίν τινες
  choice: சிலர் ... கூறுவதுபோலவும்
  rationale: φασίν என்பதன் ‘சிலர் கூறுகின்றனர்/வலியுறுத்துகின்றனர்’ என்ற செய்தியறிக்கைத் தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: λέγειν
  choice: நாங்கள் இப்படிச் சொல்வதாக
  rationale: ‘போதிக்கிறோம்’ என்று பொருளை விரிவுபடுத்தாமல், ‘சொல்கிறோம்’ என்ற நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: Ποιήσωμεν
  choice: செய்வோமாக
  rationale: முதல் நபர் பன்மை, தூண்டுதல் பொருளுடைய aorist subjunctive வடிவத்தை ‘செய்வோமாக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ κακὰ
  choice: தீமை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை அடைமொழியை நவீன தமிழில் இயல்பான ஒருமைத் தொகுப்புப் பொருளாகக் கொடுக்கிறது.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: நன்மை வருவதற்காக
  rationale: ἵνα தொடரின் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவு என்ற நுணுக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: κρίμα
  choice: தண்டனைத் தீர்ப்பு
  rationale: இங்கு பொதுவான ‘தீர்ப்பு’ அல்ல, குற்றத்தீர்ப்பாகிய பாதகமான நீதித்துறை முடிவே கருத்தில் இருப்பதைத் தெளிவாக்குகிறது.
- source_word: ἔνδικόν
  choice: நீதியானது
  rationale: சட்டநீதியும் அறநீதியும் இணைந்த ‘நியாயமானது’ என்ற கனமான பொருளைத் தருகிறது.
- source_word: καὶ μὴ
  choice: மேலும் ... ஏன் சொல்லக்கூடாது?
  rationale: முந்தைய வசனத்தின் வாதத்தைத் தொடரும் சுருக்கப்பட்ட கிரேக்க வாக்கியத்தை தமிழில் புரியும்படி கேள்வியாக நிறைவு செய்கிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: ὧν என்பதன் முன்னிலைச் சுட்டு
  choice: அவர்களுக்கு விதிக்கப்படும்
  alternative: அத்தகைய வாதத்திற்குரிய
  rationale: இலக்கணப்படி ὧν அருகிலுள்ள ‘சிலர்’ என்பவர்களைச் சுட்டுவது மிக இயல்பானது. எனினும் சுட்டின் எல்லை வாசகருக்குத் தெளிவாக இருக்க அடிக்குறிப்பில் விளக்கப்படுகிறது; குற்றத்தீர்ப்பு ஒரு கோட்பாட்டுக்கே அல்ல, அந்தப் பொய்க்குற்றச்சாட்டையும் வாதத்தையும் முன்வைப்பவர்களுக்கே உரியது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், அப்போஸ்தலரின் வாதத்திற்குரிய கண்ணியமும் தீவிரமும் நிலைக்குமாறும் வடிவமைக்கப்பட்டது. மேற்கோளில் உள்ள தீய தர்க்கம் பவுலின் போதனை அல்ல, அவர்மீது சுமத்தப்பட்ட அவதூறு என்பது வாக்கிய அமைப்பில் தெளிவாகிறது.
