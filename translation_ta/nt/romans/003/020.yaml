id: ROM.3.20
reference: Romans 3:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: ta
  text: ஏனெனில், திருச்சட்டத்தின்படி செய்யப்படும் செயல்களால் எந்த மனிதரும் அவருடைய முன்னிலையில் நீதிமானாக அறிவிக்கப்படமாட்டார்; ஏனெனில், திருச்சட்டத்தின் மூலமாகப் பாவத்தைப் பற்றிய அறிவு உண்டாகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: திருச்சட்டம் கோரும் செயல்களால்
  rationale: ‘சட்டத்தின் செயல்கள்’ என்ற இறுக்கமான சொற்றொடரைவிட, νόμου என்பதுடன் ἔργων கொண்டுள்ள உறவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; சட்டத்தைக் கடைப்பிடிக்கச் செய்யப்படும் செயல்கள் என்ற பொருளைத் தருகிறது.
- source_word: οὐ δικαιωθήσεται
  choice: நீதிமானாக அறிவிக்கப்படமாட்டார்
  rationale: எதிர்காலச் செயலற்ற வினைவடிவத்தையும், நீதித்துறை சார்ந்த ‘நீதிமான் என்று தீர்ப்பளித்தல்/அறிவித்தல்’ என்ற δικαιόω சொல்லின் பொருளையும் காக்கிறது.
- source_word: πᾶσα σὰρξ
  choice: எந்த மனிதரும்
  rationale: சொல்லுக்கு சொல் ‘எந்த மாம்சமும்’ என்பது நவீன தமிழில் தவறாகப் புரியக்கூடும். இங்கு அனைத்து மனிதர்களையும் குறிக்கும் செமித்திய வழக்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐνώπιον αὐτοῦ
  choice: அவருடைய முன்னிலையில்
  rationale: தேவனுடைய மதிப்பீடு அல்லது தீர்ப்பின் முன்னிலையில் என்பதைக் குறிப்பிட்ட மூல உருவகத்துடன் காக்கிறது.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: பாவத்தைப் பற்றிய அறிவு
  rationale: பாவத்தை அடையாளம் கண்டு உணரும் அறிவைக் குறிக்கிறது; ‘முழுமையான அறிவு’ என்று தேவையின்றி தீவிரப்படுத்தவில்லை.
theological_decisions:
- issue: ‘சட்டத்தின் செயல்கள்’ என்பதன் பரப்பு
  choice: ‘திருச்சட்டம் கோரும் செயல்கள்’ என்று பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: யூத அடையாளச் சின்னங்களான செயல்கள் மட்டும் என்று குறுக்குதல்.
  rationale: மூலச் சொற்றொடர் இவ்வசனத்திலேயே அதன் பரப்பை அத்தகைய குறிப்பிட்ட நடைமுறைகளுக்கு மட்டும் கட்டுப்படுத்தவில்லை; ஆகவே அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: δικαιόω என்பதன் நுண்பொருள்
  choice: ‘நீதிமானாக அறிவிக்கப்படுதல்’ என்ற நீதித்துறை சார்ந்த மொழி பயன்படுத்தப்பட்டது.
  alternative: ‘நீதிமானாக்கப்படுதல்’.
  rationale: செயலற்ற வினையின் தீர்ப்பு/அறிவிப்பு சார்ந்த வலிமையை வெளிப்படுத்துகிறது; அதேவேளை விரிவான இரட்சிப்பியல் முறையை வசனத்துக்குள் இறக்குமதி செய்யவில்லை.
- issue: திருச்சட்டத்தின் பங்கு
  choice: திருச்சட்டத்தின் மூலமாகப் பாவ அறிவு உண்டாகிறது என்று நேரடியாகக் கூறப்பட்டது.
  alternative: திருச்சட்டம் பாவத்தை உண்டாக்குகிறது அல்லது இரட்சிக்கிறது என்று விளக்கிச் சேர்த்தல்.
  rationale: வசனம் கூறும் அறிவூட்டும் பங்கை மட்டும் காக்கிறது; காரணத்தையும் நோக்கத்தையும் மேலதிகமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. νόμος என்பதற்கு வேதாகமச் சூழலை உணர்த்த ‘திருச்சட்டம்’ பயன்படுத்தப்பட்டது. வசனத்தின் இரு காரணவாக்கியங்களும் அரைப்புள்ளியால் இணைக்கப்பட்டு கிரேக்க வாத அமைப்பு பாதுகாக்கப்பட்டது.
