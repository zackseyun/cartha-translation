id: ROM.3.10
reference: Romans 3:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Οὐκ ἔστιν δίκαιος οὐδὲ εἷς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: ta
  text: 'எழுதப்பட்டிருக்கிறபடி: “நீதிமான் ஒருவன்கூட இல்லை.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: எழுதப்பட்டிருக்கிறபடி
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் καθὼς γέγραπται என்ற தொடரை இயல்பான தமிழில் ஒருங்கிணைத்துக் காட்டுகிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: நிறைவுற்ற செயப்பாட்டு வடிவத்தின் நிலைத்த விளைவைத் தக்கவைத்தபடி, வேத மேற்கோட்டு வாய்ப்பாட்டை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ὅτι
  choice: ':'
  rationale: மேற்கோட்டை அறிமுகப்படுத்தும் இவ்விடத்தில் தனிச் சொல்லைவிட முக்காற்புள்ளி தமிழில் இயல்பாக உள்ளது.
- source_word: Οὐκ ἔστιν
  choice: இல்லை
  rationale: இருப்பு மறுப்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: δίκαιος
  choice: நீதிமான்
  rationale: பவுலின் பயன்பாட்டிலுள்ள நீதி மற்றும் கடவுள்முன் சரியான நிலை ஆகிய பொருளடுக்குகளைத் தக்கவைக்கும் வழக்கமான வேதாகமத் தமிழ் சொல்.
- source_word: οὐδὲ εἷς
  choice: ஒருவன்கூட
  rationale: ‘ஒருவரும் இல்லை’ என்பதைக் காட்டிலும் கிரேக்கத்தின் ‘ஒருவன்கூட இல்லை’ என்ற வலியுறுத்தலை நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: வாக்கியத்தின் பொதுவான, முற்றுமுழுதான மறுப்பை எவ்வாறு காப்பது
  choice: நீதிமான் ஒருவன்கூட இல்லை
  alternative: ஒருவரும் நீதிமான் இல்லை
  rationale: தனிப்பட்ட விதிவிலக்கு எதுவும் இல்லை என்ற οὐδὲ εἷς என்பதன் வலியுறுத்தலையும் δίκαιος என்பதன் பெயர்ச்சொல் சார்ந்த அமைப்பையும் தெளிவாகக் காக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான வேத மேற்கோட்டு நடை. ‘நீதிமான்’ என்பது பொதுவாசகர்களுக்குப் பரிச்சயமான வேதாகமச் சொல்லாக இருப்பதோடு மூலத்தின் கருத்துச் செறிவையும் காக்கிறது.
