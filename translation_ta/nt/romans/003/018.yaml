  text: There is no fear of God before their eyes[a][b].
translation:
  language: ta
  text: அவர்களுடைய கண்களுக்கு முன்பாகக் கடவுளுக்கான பயம் இல்லை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய கண்களுக்கு முன்பாகக் கடவுளுக்கான பயபக்தி இல்லை.”
    reason: lexical_alternative
  - marker: b
    text: சங்கீதம் 36:1-இலிருந்து மேற்கோள் காட்டப்பட்டுள்ளது (எழுபதின்மர் மொழிபெயர்ப்பில் 35:2).
    reason: cross_reference
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: இல்லை
  rationale: கிரேக்கத்தின் மறுக்கப்பட்ட நிகழ்கால இருப்புக் கூற்றை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: φόβος θεοῦ
  choice: கடவுளைப் பற்றிய பயம்
  rationale: φόβος என்பதன் முதன்மையான பொருளான ‘பயம்’ என்பதைக் காத்து, θεοῦ குறிக்கும் இலக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘பயபக்தி’ என மொழிபெயர்த்து விளக்கத்தை முதன்மை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἀπέναντι
  choice: முன்பாக
  rationale: கண்களுக்கு எதிரே அல்லது பார்வைக்கு முன் இருப்பது என்ற இடஞ்சார்ந்த உருவகத்தைத் தமிழில் காக்கிறது.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: அவர்களுடைய கண்களுக்கு
  rationale: ‘கண்கள்’ என்ற தெளிவான வேதாகமப் படிமத்தைப் பாதுகாக்கிறது; அதை ‘பார்வை’ என்று அருவமாக்கவில்லை.
theological_decisions:
- issue: φόβος θεοῦ என்பதில் பயமா அல்லது பயபக்தியா
  choice: முதன்மை உரையில் ‘கடவுளைப் பற்றிய பயம்’
  alternative: ‘கடவுளிடம் பயபக்தி’
  rationale: ‘பயம்’ என்பது நேரடியான சொற்பொருள்; சூழலில் மரியாதை அல்லது பயபக்தி என்ற நுண்பொருள் இருக்கக்கூடும் என்பதால் அதை அடிக்குறிப்பில் மாற்று மொழிபெயர்ப்பாகக் கொடுத்து தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. மூலத்தின் ‘கண்களுக்கு முன்பாக’ என்ற உருவகம் காக்கப்பட்டுள்ளது; ‘பயம்’ என்பதன் பயபக்தி நுண்பொருள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
