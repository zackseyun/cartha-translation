revisions:
- from: அவர்களுடைய கண்களுக்கு முன்பாகக் கடவுளைப் பற்றிய பயம் இல்லை.[a][b]
  to: அவர்களுடைய கண்களுக்கு முன்பாகக் கடவுளுக்கான பயம் இல்லை.[a][b]
  rationale: The revision changes only the Tamil expression of the θεοῦ relationship, making clear that the fear is directed toward God. It preserves the source’s negation, present existential sense, and ‘before their eyes’ metaphor. The alternative note retains ‘பயபக்தி’ as a legitimate contextual nuance rather than making it the primary translation.
