lexical_decisions:
- source_word: σύντριμμα
  choice: அழிவு
  rationale: வன்முறையாக நொறுக்கப்படுவதால் விளையும் சிதைவையும் பேரழிவையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘நொறுக்குதல்’ என்ற செயற்பொருளைவிட இங்கு விளைவைக் குறிக்கும் பெயர்ச்சொல் பொருத்தமானது.
- source_word: ταλαιπωρία
  choice: துயரம்
  rationale: கடுமையான துன்பத்தையும் அவலநிலையையும் நவீன வாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் எடுத்துரைக்கிறது.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: அவர்கள் செல்லும் பாதைகளில்
  rationale: ὁδοῖς என்பதன் பாதை உருவகத்தைத் தக்கவைத்து, அவர்கள் பின்பற்றும் வாழ்க்கை நெறியையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: இரண்டு இணையான பெயர்ச்சொற்களைத் தமிழுக்கேற்ற இணைப்புமுறையில் ஒருங்கிணைக்கிறது.
