source:
  edition: SBLGNT
  text: δικαιούμενοι δωρεὰν τῇ αὐτοῦ χάριτι διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: ta
  text: அவர்கள் அவருடைய அருளால் இலவசமாக, மேசியாவாகிய[b] இயேசுவில் உள்ள மீட்பின் மூலம் நீதிமான்களாக்கப்படுகிறார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிமான்கள் என்று அறிவிக்கப்படுகிறார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: 'மரபான மொழிபெயர்ப்பு: “கிறிஸ்து இயேசு.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιούμενοι
  choice: நீதிமான்களாக்கப்படுகிறார்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தின் பொருளையும் முந்தைய வசனத்துடன் அதன் தொடர்பையும் இயல்பான தமிழில் தருகிறது. பவுலின் சட்டமன்றத் தன்மையுள்ள நீதிப்படுத்துதல் மொழியையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: δωρεὰν
  choice: இலவசமாக
  rationale: எந்தத் தகுதியாலோ விலையாலோ சம்பாதிக்கப்படாமல் கொடையாகக் கிடைப்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: χάριτι
  choice: அருளால்
  rationale: பவுலின் பயன்பாட்டில் கடவுளின் தகுதியற்றவர்களுக்குக் காட்டப்படும் தயவையும் செயலையும் குறிக்கும் நிலையான, கண்ணியமான தமிழ்ச் சொல்.
- source_word: ἀπολυτρώσεως
  choice: மீட்பு
  rationale: விடுதலை மற்றும் விலைகொடுத்து விடுவித்தல் ஆகிய பின்னணிப் பொருள்களை அளவுக்கு மீறி விளக்காமல் தக்கவைக்கிறது.
- source_word: Χριστῷ
  choice: மேசியாவாகிய
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகப் பொருள்படுவதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்படுகிறது; ‘ஆகிய’ என்பது தமிழில் பட்டத்தையும் பெயரையும் இயல்பாக இணைக்கிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவில் உள்ள
  rationale: மீட்பு இயேசு மேசியாவில் அமைந்துள்ளது என்ற கிரேக்க முன்னிடைச்சொல் தொடரின் தொடர்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுலின் நீதிப்படுத்துதல் மொழி
  choice: நீதிமான்களாக்கப்படுகிறார்கள்
  alternative: நீதிமான்கள் என்று அறிவிக்கப்படுகிறார்கள்
  rationale: முதன்மை உரை δικαιόω என்பதன் செறிவான சட்டமன்ற மற்றும் உடன்படிக்கைச் சார்ந்த பொருளை ஒரே விளக்கத்திற்குள் குறுக்காமல் தக்கவைக்கிறது; அறிவிப்பு சார்ந்த செல்லத்தக்க மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: Χριστός என்பது பட்டமா அல்லது மரபான ஒலிபெயர்ப்பா
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு Χριστός பட்டத்தின் பொருளைத் தக்கவைக்க ‘மேசியா’ பயன்படுத்தப்படுகிறது; தமிழில் மரபாக உள்ள வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வழிபாட்டு மரியாதையையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கும் நடை. தனி வசனமாக இயல்பாக வாசிக்கப் பன்மை எழுவாய் வெளிப்படுத்தப்பட்டுள்ளது; அது முந்தைய வசனத்தின் ‘அனைவரும்’ என்பதைக் குறிக்கிறது.
