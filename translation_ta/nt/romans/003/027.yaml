source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: ta
  text: அப்படியானால், பெருமை பேசுவதற்கு இடம் எங்கே? அது விலக்கப்பட்டுவிட்டது. எப்படிப்பட்ட நியமத்தின் மூலம்[a]? செயல்களின் நியமமா? இல்லை; விசுவாசத்தின் நியமத்தின் மூலமே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘நியமம்’ என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் ‘சட்டம்’ அல்லது ‘செயல்படும் கோட்பாடு/நெறி’ என்றும் பொருள்படலாம்.
    reason: νόμος என்ற சொல்லின் பொருள் விரிவையும் இவ்விடத்திலுள்ள தெளிவின்மையையும் வாசகருக்குக் காட்டுகிறது.
lexical_decisions:
- source_word: καύχησις
  choice: பெருமை பேசுவது
  rationale: தன்னைப் பற்றிப் பெருமைப்படுதல் அல்லது மேன்மை பாராட்டுதல் என்ற பொருளை, நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξεκλείσθη
  choice: விலக்கப்பட்டுவிட்டது
  rationale: முற்றிலும் வெளியேற்றப்பட்டது என்ற இறந்தகாலச் செயப்பாட்டு வடிவத்தையும், அதன் விளைவு தொடர்வதையும் வெளிப்படுத்துகிறது.
- source_word: νόμος
  choice: நியமம்
  rationale: இங்கு மோசேயின் சட்டத்தைக் குறிப்பதாக மட்டும் முடிவுசெய்யாமல், ‘சட்டம்’, ‘நெறிமுறை’, அல்லது செயல்படும் கோட்பாடு என்ற கிரேக்கச் சொல்லின் விரிவைத் தக்கவைக்கிறது.
- source_word: ἔργων
  choice: செயல்கள்
  rationale: ‘கிரியைகள்’ என்ற பழைய சமயச் சொல்லுக்குப் பதிலாக, ἔργα என்பதன் பொதுவான பொருளை நவீனத் தமிழில் தருகிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: நம்பிக்கை, நம்பியிருத்தல், உண்மைப்பற்று ஆகிய நுணுக்கங்களை உள்ளடக்கக்கூடிய நிலைபெற்ற வேதாகமத் தமிழ்ச் சொல்.
theological_decisions:
- issue: νόμος என்பதன் பொருள்
  choice: ‘நியமம்’ என்று மொழிபெயர்த்து, சட்டம் அல்லது செயல்படும் கோட்பாடு என்ற இரு சாத்தியங்களையும் திறந்துவைத்தல்
  alternative: ‘சட்டம்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: இந்த வசனத்தில் பவுல் νόμος என்ற சொல்லைச் சொல்விளையாட்டாக அல்லது விரிவான நெறி/கோட்பாடு என்ற பொருளில் பயன்படுத்தியிருக்கலாம்; அதை மோசேயின் சட்டமாக மட்டும் முன்கூட்டியே வரையறுக்கக்கூடாது.
- issue: νόμος πίστεως என்ற சொற்றொடரின் தொடர்பு
  choice: ‘விசுவாசத்தின் நியமம்’ என்று உறவைத் திறந்தவாறே வைத்தல்
  alternative: ‘விசுவாசத்தை அடிப்படையாகக் கொண்ட நியமம்’ என்று விளக்கமாக்குதல்
  rationale: πίστεως என்ற பிறப்புவேற்றுமையின் துல்லியமான உறவை மூலவசனம் விளக்கவில்லை; மொழிபெயர்ப்பு அதைத் தீர்மானிக்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் தொடர் வினாக்களும் ‘நியமம்’ என்ற சொல்லின் மும்முறைத் திருப்பமும் பாதுகாக்கப்பட்டுள்ளன.
