id: ROM.3.12
reference: Romans 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: ta
  text: எல்லோரும் வழிவிலகிப்போனார்கள்; ஒருசேர பயனற்றவர்களானார்கள்[a]. நன்மை செய்கிறவர் எவரும் இல்லை[b]; ஒருவர்கூட இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருசேர தகுதியற்றவர்களானார்கள்” / “சீர்கெட்டுப்போனார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நற்குணத்தை வெளிப்படுத்துகிறவர் எவரும் இல்லை”; χρηστότητα என்பதற்கு “தயவு” என்ற பொருளும் உண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: எல்லோரும்
  rationale: வெளிப்படையாக ஒரு பெயர்ச்சொல்லைச் சேர்க்காமல், கிரேக்கப் பன்மையின் உலகளாவிய நோக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐξέκλιναν
  choice: வழிவிலகிப்போனார்கள்
  rationale: நெறியிலிருந்து விலகியதைக் குறிக்கும் உருவகத்தையும், நிகழ்ந்துவிட்ட செயல் தரும் விளைவையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἅμα
  choice: ஒருசேர
  rationale: இங்கு மனிதர்கள் அனைவருக்கும் பொதுவான கூட்டு நிலையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἠχρεώθησαν
  choice: பயனற்றவர்களானார்கள்
  rationale: செயலற்ற அல்லது பயனில்லாத நிலைக்கு வந்தார்கள் என்ற வலுவான எதிர்மறை மதிப்பீட்டையும், கிரேக்க வினையின் விளைவுநிலையையும் தக்கவைக்கிறது.
- source_word: ποιῶν
  choice: செய்கிறவர்
  rationale: பெயரெச்சத்தின் பொதுவான அல்லது வழக்கமான செயல் பொருளை நவீன தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: χρηστότητα
  choice: நன்மை
  rationale: அறச்சூழலில் 'goodness' என்ற பரந்த பொருளை இயல்பாகத் தருகிறது; இச்சொல்லுக்கு 'தயவு' என்ற பொருளும் இருக்கலாம் என்பதைக் குறிப்பில் பாதுகாக்கிறது.
- source_word: οὐκ ἔστιν
  choice: எவரும் இல்லை
  rationale: வலியுறுத்தப்பட்ட மறுப்பைத் தெளிவான, தற்போதைய தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἕως ἑνός
  choice: ஒருவர்கூட இல்லை
  rationale: கிரேக்கத் தொடரின் வலியுறுத்தும் முடிவை இயல்பான தமிழ் மரபில் துல்லியமாக வழங்குகிறது.
