  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: ta
  text: அப்படியானால் என்ன? சிலர் விசுவாசமற்றவர்களாய் இருந்தால்[a], அவர்களுடைய விசுவாசமின்மை கடவுளின் நம்பகத்தன்மையைப் பயனற்றதாக்குமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நம்பாமல் இருந்தால்’ என்றும் மொழிபெயர்க்கலாம்; அதற்கேற்ப ‘விசுவாசமின்மை’ என்பதையும் ‘அவநம்பிக்கை’ என்று மொழிபெயர்க்கலாம். ‘கடவுளின் நம்பகத்தன்மை’ என்பதற்கான கிரேக்கச் சொற்றொடர் சொல்லடியாக ‘கடவுளின் விசுவாசம்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: அப்படியானால் என்ன?
  rationale: பவுலின் வாதத்தில் எழும் எதிர்வினையையோ முடிவையோ அறிமுகப்படுத்தும் சுருக்கமான வினாவாக இருப்பதால், இயல்பான நவீன தமிழில் இந்த argumentative turn-ஐப் பாதுகாக்கிறது.
- source_word: ἠπίστησάν
  choice: உண்மையற்றவர்களாய் இருந்தால்
  rationale: இந்தச் சொல் ‘நம்பவில்லை’ என்றும் பொருள்படலாம்; ஆனால் தொடர்ந்து வரும் ἀπιστία மற்றும் கடவுளின் πίστις ஆகியவற்றுடனான முரண்பாடு, நம்பகத்தன்மை/விசுவாசத்தன்மை சார்ந்த பொருளை இங்கு முன்னிறுத்துகிறது.
- source_word: τινες
  choice: சிலர்
  rationale: குறிப்பிடப்படாத பன்மையைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: ἀπιστία
  choice: உண்மையின்மை
  rationale: ἠπίστησάν என்பதுடனான சொல்வேர்த் தொடர்பையும் கடவுளுடைய πίστις உடனான எதிர்மறை ஒப்புமையையும் முடிந்தவரை காக்கிறது; ‘அவநம்பிக்கை’ என்பதும் சாத்தியம்.
- source_word: πίστιν τοῦ θεοῦ
  choice: கடவுளுடைய உண்மைத்தன்மை
  rationale: சொல்லடியாக ‘கடவுளுடைய விசுவாசம்/நம்பிக்கை’ என்றாலும், மனிதரின் ἀπιστία-க்கு எதிராக இங்கு கடவுளின் நம்பகமான உண்மைத்தன்மையைக் குறிப்பதே சூழலுக்கு மிகவும் பொருத்தமானது.
- source_word: καταργήσει
  choice: செல்லாததாக்குமா
  rationale: ஒன்றை பயனற்றதாகவோ நடைமுறையில் செல்லுபடியாகாததாகவோ ஆக்கும் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πίστιν τοῦ θεοῦ என்ற விவாதத்திற்குரிய பவுலிய சொற்றொடரின் மொழிபெயர்ப்பு
  choice: கடவுளுடைய உண்மைத்தன்மை
  alternative: கடவுளுடைய விசுவாசம்
  rationale: மனிதரின் உண்மையின்மைக்கும் கடவுளின் πίστις-க்கும் இடையிலான நேரடி முரண்பாடு, இங்கு ‘உண்மைத்தன்மை’ என்ற பொருளை வலுப்படுத்துகிறது. இருப்பினும் கிரேக்கச் சொற்றொடரின் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், பவுலின் சுருக்கமான வாதநடையையும் வினாவின் கூர்மையையும் காக்கும் கண்ணியமான நடை. ‘உண்மையற்றவர்/உண்மையின்மை/உண்மைத்தன்மை’ என்ற தொடரால் மூலத்தின் சொல்விளையாட்டு ஓரளவு பாதுகாக்கப்பட்டுள்ளது.
