- from: அப்படியானால் என்ன? சிலர் உண்மையற்றவர்களாய் இருந்தால்[a], அவர்களுடைய உண்மையின்மை கடவுளுடைய உண்மைத்தன்மையைச் செல்லாததாக்குமா?
  to: அப்படியானால் என்ன? சிலர் விசுவாசமற்றவர்களாய் இருந்தால்[a], அவர்களுடைய விசுவாசமின்மை கடவுளின் நம்பகத்தன்மையைப் பயனற்றதாக்குமா?
  rationale: The revision avoids the Tamil honesty/truthfulness sense introduced by ‘உண்மை,’ preserves the Greek πιστ-/ἀπιστ- contrast with coordinated Tamil terminology, and keeps the alternative belief/unbelief sense in a concise footnote. ‘கடவுளின் நம்பகத்தன்மை’ gives the contextually likely sense of πίστιν τοῦ θεοῦ without suppressing the literal expression.
