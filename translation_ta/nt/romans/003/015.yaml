lexical_decisions:
- source_word: ὀξεῖς
  choice: விரைகின்றன
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘கூர்மையானவை’ என்றாலும், வன்முறைக்குச் செல்லும் கால்களைப் பற்றிய இச்சூழலில் வேகத்தையும் உடனடித் தயார்நிலையையும் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘விரைகின்றன’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: οἱ πόδες αὐτῶν
  choice: அவர்களுடைய கால்கள்
  rationale: உடல் உறுப்பை மையப்படுத்தும் மூலமொழிப் படிமத்தையும், αὐτῶν என்பதன் உடைமைப் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐκχέαι
  choice: சிந்த
  rationale: வினைச்சொல் நேரடியாக ‘ஊற்ற’ எனப் பொருள்படலாம்; ஆனால் இரத்தத்துடன் வரும் இச்சூழலில் ‘இரத்தம் சிந்த’ என்பது வன்முறையைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: மூலச்சொல்லின் வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
