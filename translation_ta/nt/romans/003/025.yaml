revisions:
- from: கடவுள் அவரையே, அவருடைய இரத்தத்தின்மேல் கொண்ட விசுவாசத்தின் வழியாகப் பாவநிவாரண பலியாக[a] முன்வைத்தார்.[b] முன்பு செய்யப்பட்ட பாவங்களை அவர் உடனே தண்டிக்காமல் விட்டிருந்ததால், தமது நீதியை[c] விளங்கச் செய்வதற்காக இப்படிச் செய்தார்.
  to: கடவுள் அவரையே, அவருடைய இரத்தத்தில் விசுவாசம் வைத்து[b] பாவநிவாரண பலியாக[a] முன்வைத்தார். முன்பு செய்யப்பட்ட பாவங்களைக் கடந்து செல்ல விட்டதன் காரணமாக, தமது நீதியை[c] வெளிப்படுத்துவதற்காக இப்படிச் செய்தார்.
  rationale: The revision removes the unsupported temporal addition in the rendering of πάρεσις and uses a direct Tamil expression for God’s passing over earlier sins. It also makes the faith-and-blood construction more natural in modern Tamil and relocates its footnote marker to the relevant phrase. The contested range of ἱλαστήριον and the justice/righteousness nuance remain visible in the footnotes without forcing a narrower theological interpretation.
