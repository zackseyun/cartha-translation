id: ROM.3.25
reference: Romans 3:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: ta
  text: கடவுள் அவரையே, அவருடைய இரத்தத்தில் விசுவாசம் வைத்து[b] பாவநிவாரண பலியாக[a] முன்வைத்தார். முன்பு செய்யப்பட்ட பாவங்களைக் கடந்து செல்ல விட்டதன் காரணமாக, தமது நீதியை[c] வெளிப்படுத்துவதற்காக இப்படிச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோபத்தைத் தணிக்கும் பலி”; அல்லது, “கிருபாசனம்”—பழைய ஏற்பாட்டில் உடன்படிக்கைப் பெட்டியின் தங்க மூடி; அதன்மேல் பாவநிவாரண இரத்தம் தெளிக்கப்பட்டது.
    reason: lexical_alternative
  - marker: b
    text: “விசுவாசத்தின் வழியாக, அவருடைய இரத்தத்தினால்” என்றும் இத்தொடரைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “நியாயத்தை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: முன்வைத்தார்
  rationale: சூழலில் கடவுள் கிறிஸ்துவை வெளிப்படையாக அளித்தார் அல்லது அனைவருக்கும் முன்பாக நிறுவினார் என்ற பொருளை இயல்பாகத் தருகிறது; ‘முன்தீர்மானித்தார்’ என்ற வேறொரு சாத்தியத்தைத் தேவையின்றி முன்னிலைப்படுத்தவில்லை.
- source_word: ἱλαστήριον
  choice: பாவநிவாரண பலி
  rationale: பாவத்திற்குப் பரிகாரம் உண்டாக்கும் பலி என்ற செயல்பாட்டு பொருளை பொதுவாசகர்களுக்குப் புரியுமாறு தருகிறது. கடவுளின் கோபத்தைத் தணித்தல், உடன்படிக்கைப் பெட்டியின் கிருபாசனம் ஆகிய முக்கிய விளக்கச் சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: διὰ πίστεως
  choice: விசுவாசத்தின் வழியாக
  rationale: πίστις என்பதற்கான வழக்கமான வேதாகமத் தமிழ்ச் சொல்லைத் தக்கவைத்து, διά-வின் வழிமுறைப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: அவருடைய இரத்தத்தின்மேல் கொண்ட
  rationale: முதன்மை வாசிப்பில் விசுவாசம் கிறிஸ்துவின் இரத்தத்தை நோக்கியதாக உள்ளது. எனினும், இத்தொடரின் இலக்கண இணைப்பு விவாதத்திற்குரியது என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰς ἔνδειξιν
  choice: விளங்கச் செய்வதற்காக
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் கிரேக்கத் தொடரை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δικαιοσύνης
  choice: நீதி
  rationale: கடவுளின் சரியான, நீதியான தன்மையையும் செயலையும் உள்ளடக்கும் சுருக்கமான இயல்பான சொல். ‘நியாயம்’ என்ற நீதி வழங்கும் நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πάρεσιν
  choice: உடனே தண்டிக்காமல் விட்டிருந்ததால்
  rationale: முழுமையான மன்னிப்புடன் ஒன்றாக்காமல், முன்பு செய்த பாவங்களுக்கு அப்போது தண்டனை நிறைவேற்றப்படாதது அல்லது அவை கடந்து செல்ல விடப்பட்டது என்ற தனித்த பொருளைத் தெளிவாக்குகிறது.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: முன்பு செய்யப்பட்ட பாவங்கள்
  rationale: கால முன்னுரிமையையும் பாவங்கள் செய்யப்பட்டவை என்ற பங்கேற்புவினைச் சிறப்பையும் தெளிவான தற்போதைய தமிழில் தருகிறது.
theological_decisions:
- issue: ἱλαστήριον என்ற சர்ச்சைக்குரிய சொல்லின் மொழிபெயர்ப்பு
  choice: பாவநிவாரண பலி
  alternative: கோபத்தைத் தணிக்கும் பலி; கிருபாசனம்
  rationale: முதன்மை உரை பலிசார் பாவநிவாரணச் செயல்பாட்டை அணுகத்தக்க மொழியில் தருகிறது; கடவுளை நோக்கிய கோபத்தணிப்பு மற்றும் பழைய ஏற்பாட்டுக் கிருபாசனப் பின்னணி ஆகியவற்றில் ஒன்றை மட்டும் இறுதியானதாகத் தீர்மானிக்காமல் இரண்டையும் அடிக்குறிப்பில் வைக்கிறது.
- issue: διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι தொடரின் இலக்கண உறவு
  choice: அவருடைய இரத்தத்தின்மேல் கொண்ட விசுவாசத்தின் வழியாக
  alternative: விசுவாசத்தின் வழியாக, அவருடைய இரத்தத்தினால்
  rationale: முதன்மை உரை விசுவாசம் கிறிஸ்துவின் இரத்தத்தை நோக்குகிறது என்ற பரவலான வாசிப்பைப் பின்பற்றுகிறது. ἐν τῷ αὐτοῦ αἵματι பலியின் வழிமுறையைக் குறிக்கலாம் என்ற உண்மையான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: δικαιοσύνη என்பதில் வலியுறும் பொருள்
  choice: நீதி
  alternative: நியாயம்
  rationale: ‘நீதி’ பவுலின் பரந்த சொற்பொருள் வரம்பைத் தக்கவைக்கிறது; இச்சூழலில் கடவுளின் நியாயமான தீர்ப்புச் செயல் முன்னிலையாகலாம் என்பதைக் ‘நியாயம்’ என்ற மாற்றுச் சொல் காட்டுகிறது.
- issue: முந்தைய பாவங்களைக் கடந்து விட்டதன் இயல்பு
  choice: உடனே தண்டிக்காமல் விட்டிருந்ததால்
  alternative: முன்பு செய்யப்பட்ட பாவங்களைக் கடந்து செல்ல விட்டதால்
  rationale: πάρεσις என்பதை முழுமையான மன்னிப்பு என்று மாற்றாமல், கடவுள் அப்பாவங்களுக்கு உடனடியாகத் தண்டனை நிறைவேற்றாமல் இருந்தார் என்ற பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாவநிவாரண பலி’ போன்ற வேதாகமச் சொல்லாக்கம் தேவையான இடத்தில் மட்டும் வைக்கப்பட்டு, அதைச் சுற்றிய வாக்கியம் எளிமைப்படுத்தப்பட்டுள்ளது. மூலத்தின் நீண்ட அமைப்பு தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் காரண–நோக்க உறவு காக்கப்பட்டுள்ளது; அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
