source:
  edition: SBLGNT
  text: πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν ⸀γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: ta
  text: மிகுந்த நன்மை உண்டு—எல்லா வகையிலும். ஏனெனில், முதலில், கடவுளின் வாக்குகள்[a] அவர்களிடம் ஒப்படைக்கப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் வார்த்தைகள்.”
    reason: λόγια என்பதற்கு ‘தெய்வீக வாக்குகள்’ என்ற சிறப்புப் பொருளும், பொதுவாக ‘வார்த்தைகள்’ என்ற மொழிபெயர்ப்பும் சாத்தியம் என்பதைக் காட்டுகிறது.
lexical_decisions:
- source_word: πολὺ
  choice: மிகவும் உண்டு
  rationale: முந்தைய வசனத்தில் கேட்கப்பட்ட நன்மையைச் சுட்டும் சுருக்கமான பதிலாக வரும் கிரேக்கச் சொல்லின் நீள்வட்ட அமைப்பைப் பாதுகாக்கிறது; ‘நன்மை’ என்ற சொல்லை வெளிப்படையாகச் சேர்க்காமல் பொருளை இயல்பாகத் தருகிறது.
- source_word: κατὰ πάντα τρόπον
  choice: எல்லா வகையிலும்
  rationale: யூதருக்குள்ள நன்மை விரிவானது என்பதைத் தெரிவிக்கும் இயல்பான நவீனத் தமிழ் மரபுத்தொடர்.
- source_word: πρῶτον μὲν γὰρ
  choice: ஏனெனில், முதலாவதாக
  rationale: γὰρ தரும் காரண இணைப்பையும் πρῶτον μὲν அறிமுகப்படுத்தும் முதல் குறிப்பையும் பாதுகாக்கிறது; உடனடியாக இரண்டாவது குறிப்பு வராத பதற்றத்தையும் தீர்க்காமல் விடுகிறது.
- source_word: ἐπιστεύθησαν
  choice: அவர்களிடம் ஒப்படைக்கப்பட்டன
  rationale: இங்கு πιστεύω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் ‘நம்பினார்கள்’ என்று அல்லாமல், பொறுப்பாக ஒப்படைக்கப்பட்டது என்ற பொருளைக் கொண்டுள்ளது. தமிழில் பொருளை இயல்பாகத் தெரிவிக்க வாக்குகள் வாக்கிய எழுவாயாக வைக்கப்பட்டுள்ளன.
- source_word: τὰ λόγια
  choice: வாக்குகள்
  rationale: கடவுளிடமிருந்து வந்த அதிகாரமுள்ள உரைப்பாடுகளைக் குறிக்கும் λόγια என்பதன் தனித்தன்மையை ‘வார்த்தைகள்’ என்பதைவிடச் செறிவாகக் காட்டுகிறது; பொதுவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: உடைமை அல்லது மூலத்தைக் குறிக்கக்கூடிய கிரேக்க வேற்றுமையை நேரடியாகவும் தேவையற்ற விளக்கமின்றியும் தருகிறது.
