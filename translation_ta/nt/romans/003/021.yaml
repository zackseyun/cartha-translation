    text: ‘கடவுளின் நீதிமை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கடவுளிடமிருந்து வரும் நீதி’ என்பதும் சாத்தியம்.
