lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: ஆனால் இப்போது
  rationale: δὲ-யின் மாறுபாட்டுச் சாயலையும் Νυνὶ-யின் காலச் சுட்டையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: χωρὶς νόμου
  choice: திருச்சட்டத்தைச் சாராமலேயே
  rationale: χωρίς குறிக்கும் பிரிவை வெறும் ‘இல்லாமல்’ என்பதைக் காட்டிலும் தெளிவாகச் சொல்கிறது; சூழலில் νόμος மோசேயின் திருச்சட்டத்தைக் குறிப்பதால் ‘திருச்சட்டம்’ பயன்படுத்தப்பட்டது.
- source_word: δικαιοσύνη θεοῦ
  choice: கடவுளின் நீதி
  rationale: δικαιοσύνη-க்கு இயல்பான ‘நீதி’ என்பதையும் θεοῦ என்ற உறவுநிலை வடிவின் திட்டமிட்ட தெளிவின்மையையும் முடிந்தவரை தக்கவைக்கிறது.
- source_word: πεφανέρωται
  choice: வெளிப்படுத்தப்பட்டுள்ளது
  rationale: முன்பு நிகழ்ந்த வெளிப்படுத்தலின் விளைவு இப்போதும் நிலவுவதை உணர்த்தும் நிறைவுற்ற வினை வடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μαρτυρουμένη
  choice: சான்றளிக்கின்றனர்
  rationale: பங்கேற்பு வினையின் சாட்சி கூறும் பொருளைத் தெளிவாகத் தருகிறது; தமிழின் இயல்புக்காக செயப்பாட்டு அமைப்பு செய்பாட்டு தொடராக மாற்றப்பட்டுள்ளது.
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: திருச்சட்டமும் இறைவாக்கினர்களும்
  rationale: வேதாகமச் சாட்சியின் மரபான இருபிரிவுக் குறிப்பை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: δικαιοσύνη θεοῦ என்பதில் θεοῦ என்ற உறவுநிலையின் பொருள்
  choice: கடவுளின் நீதி
  alternative: கடவுளிடமிருந்து வரும் நீதி
  rationale: இச்சொற்றொடர் கடவுளின் சொந்த நீதியான தன்மையையும் செயலையும் குறிக்கக்கூடும்; கடவுள் அளிக்கும் நீதியையும் உணர்த்தக்கூடும். முதன்மை உரை இந்த இறையியல் இழுபறியை ஒரே விளக்கமாக முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நியாயப்பிரமாணம்’, ‘தீர்க்கதரிசிகள்’ போன்ற இன்றைய பொதுப்பயன்பாட்டில் குறைந்துள்ள வடிவங்களுக்கு மாற்றாக ‘திருச்சட்டம்’, ‘இறைவாக்கினர்கள்’ பயன்படுத்தப்பட்டன; இறையியல் தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டது.
