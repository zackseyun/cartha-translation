base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: ta
  text: ஆனால் இப்போது, திருச்சட்டத்திற்கு அப்பாற்பட்டு கடவுளின் நீதி[a][b] வெளிப்படுத்தப்பட்டுள்ளது; திருச்சட்டமும் இறைவாக்கினர்களும்[c] அதற்குச் சான்றளிக்கின்றனர்.
  philosophy: optimal-equivalence
  footnotes:
