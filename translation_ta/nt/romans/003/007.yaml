id: ROM.3.7
reference: Romans 3:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: ta
  text: ஆனால், என் பொய்யின் மூலமாக[b] கடவுளின் உண்மைத்தன்மை[a] அவருடைய மகிமைக்காக[c] பெருகியிருந்தால், நானும் ஏன் இன்னும் ஒரு பாவியாகத் தீர்ப்பிடப்படுகிறேன்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் உண்மை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் பொய்மையின் வாயிலாக.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “அவருடைய மகிமைக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: கடவுளின் உண்மைத்தன்மை
  rationale: ரோமர் 3:4–7இல் கடவுள் உண்மையுள்ளவர் என்பதும் மனிதன் பொய்யன் என்பதும் நேரடியாக எதிர்நிறுத்தப்படுகின்றன. ஆகவே, வெறும் கருத்தாகிய ‘உண்மை’ என்பதைவிட கடவுளின் பண்பைக் காட்டும் ‘உண்மைத்தன்மை’ இச்சூழலுக்குப் பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: என் பொய்யின் மூலமாக
  rationale: ἐν இங்கு இடத்தைக் குறிப்பதைவிட கருவி அல்லது வழிமுறையைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது. ‘மூலமாக’ என்பது அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ψεύσματι
  choice: பொய்
  rationale: ‘பொய்’ என்பது நேரடியான, பொதுவாகப் புரியும் தமிழ் சொல்; ‘பொய்மை’ என்ற மாற்றும் சாத்தியம்.
- source_word: ἐπερίσσευσεν
  choice: பெருகியிருந்தால்
  rationale: வினைச்சொல் மிகுதி அல்லது அதிகரிப்பைக் குறிக்கிறது. நிபந்தனை வாக்கியத்தில் நிகழ்ந்து முடிந்ததாக முன்வைக்கப்படும் கருத்தை ‘பெருகியிருந்தால்’ இயல்பாகக் காட்டுகிறது.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: அவருடைய மகிமைக்காக
  rationale: εἰς குறிக்கக்கூடிய விளைவு அல்லது நோக்கத்தின் நுணுக்கத்தை இயல்பான தமிழில் தருகிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் உள்ளது.
- source_word: τί ἔτι
  choice: ஏன் இன்னும்
  rationale: ἔτι காட்டும் தொடர்நிலையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: κἀγὼ
  choice: நானும்
  rationale: καί + ἐγώ என்பதிலுள்ள சேர்க்கை நுணுக்கத்தை ‘நானும்’ பாதுகாக்கிறது.
- source_word: κρίνομαι
  choice: தீர்ப்பிடப்படுகிறேன்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும், இறுதிக் கண்டனமாக முன்கூட்டியே குறுக்காமல் ‘தீர்ப்பிடுதல்’ என்ற பரந்த பொருளையும் காக்கிறது.
- source_word: ὡς ἁμαρτωλὸς
  choice: ஒரு பாவியாக
  rationale: ஒருவரை ‘பாவி’ என்ற நிலையில் மதிப்பிடுவதை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀλήθεια τοῦ θεοῦ என்பது கருத்தியல் ‘கடவுளின் உண்மை’யையா அல்லது கடவுளின் ஒழுக்கப் பண்பான ‘உண்மைத்தன்மை’யையா குறிக்கிறது?
  choice: கடவுளின் உண்மைத்தன்மை
  alternative: கடவுளின் உண்மை
  rationale: அருகிலுள்ள சூழலில் கடவுள் உண்மையுள்ளவர் என்றும் மனிதர்கள் பொய்யர்கள் என்றும் கூறப்படுவதால், ‘உண்மைத்தன்மை’ அந்த எதிர்மறை இணைப்பைத் தெளிவாக வெளிப்படுத்துகிறது. எனினும், கிரேக்கத் தொடரின் பரந்த சாத்தியத்தை மறைக்காமல் ‘கடவுளின் உண்மை’ அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: εἰς τὴν δόξαν αὐτοῦ என்பதில் நோக்கமா விளைவா முதன்மை?
  choice: அவருடைய மகிமைக்காக
  alternative: அவருடைய மகிமைக்கு
  rationale: ‘மகிமைக்காக’ என்பது நோக்கம் அல்லது விளைவு ஆகிய இரண்டையும் சூழலில் திறந்தவாறு வைத்திருக்கும் இயல்பான தமிழ். மிகவும் சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பவுலின் வாதத்தில் ஒலிக்கும் எதிர்வாதக் கேள்வியின் தன்மை காக்கப்பட்டுள்ளது. ‘நானும்’ என்பது κἀγώவின் சேர்க்கை நுணுக்கத்தையும், ‘இன்னும்’ என்பது ἔτιயின் தொடர்நிலையையும் வெளிப்படுத்துகின்றன.
