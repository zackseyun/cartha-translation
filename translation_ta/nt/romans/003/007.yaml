  terminology: “உண்மைத்தன்மை” is a defensible contextual rendering of ἀλήθεια in light of the contrast between divine truthfulness and human falsehood in the surrounding context. The alternative “கடவுளின் உண்மை” is properly supplied in a footnote. “பொய்,” “மகிமை,” and “பாவி” are clear and appropriate biblical-register terms.
