source:
  edition: SBLGNT
  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: ta
  text: நான் எப்போதும் என் ஜெபங்களில், எப்படியாவது இப்போதாவது கடவுளுடைய திருவுளத்தின்படி உங்களிடம் வருவதில் எனக்கு வெற்றி கிடைக்குமோ என்று மன்றாடுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களிடம் வருவதற்கான என் பயணம் வெற்றியடையுமோ என்று” அல்லது “உங்களிடம் வருவதற்கு என் வழி செவ்வையாகுமோ என்று.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ந்து கடைப்பிடிக்கும் ஜெபப் பழக்கத்தை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: என் ஜெபங்களில்
  rationale: கிரேக்க முன்னிடைச்சொல் தொடரின் பொருளைத் தமிழில் மரபான, இயல்பான ஜெபச் சொல்லாட்சியாக வழங்குகிறது.
- source_word: δεόμενος
  choice: மன்றாடுகிறேன்
  rationale: சாதாரணமாகக் கேட்பதைவிட ஊக்கமான விண்ணப்பத்தைக் குறிக்கும் வினையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: εἴ πως
  choice: எப்படியாவது
  rationale: பவுலின் ஆவலையும், அது எவ்வாறு நிறைவேறும் என்பது குறித்த உறுதியின்மையையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: ἤδη ποτὲ
  choice: இப்போதாவது
  rationale: நீண்டகாலமாக எதிர்பார்த்த ஒன்று இறுதியாக நிகழ வேண்டும் என்ற வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: εὐοδωθήσομαι
  choice: நான் வெற்றிபெற வேண்டுமென்று
  rationale: வழி செவ்வையாகி நோக்கம் நிறைவேறுதல் என்ற சூழல்சார் பொருளைத் தருகிறது; பொருளாதார வளம் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது. வினையின் பயணப் பின்னணியிலான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: கடவுளுடைய திருவுளத்தின்படி
  rationale: பவுலின் பயணம் கடவுளுடைய விருப்பத்திற்கும் தீர்மானத்திற்கும் உட்பட்டது என்பதைத் தெளிவாகக் காட்டுகிறது; காரணம் அல்லது கருவி என்று அளவுக்கு மீறி முடிவுசெய்யவில்லை.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: உங்களிடம் வருவதில்
  rationale: ‘வருதல்’ என்ற மூல வினையைப் பாதுகாக்கிறது; ‘சந்திக்க’ அல்லது ‘வருகை தர’ போன்ற கூடுதல் கருத்துகளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: மனிதத் திட்டமும் கடவுளுடைய திருவுளமும் கொண்ட உறவு
  choice: கடவுளுடைய திருவுளத்தின்படி
  alternative: கடவுளுடைய திருவுளத்தால்
  rationale: ἐν என்பதைக் கருவியாக மட்டும் வரையறுக்காமல், பவுலின் விருப்பம் கடவுளுடைய திருவுளத்தின் ஆளுகைக்குள் இருப்பதைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் விதத்திலும் ஜெபத்தின் கண்ணியமான தொனியுடனும் மொழியாக்கப்பட்டுள்ளது. ‘மன்றாடுகிறேன்’ விண்ணப்பத்தின் தீவிரத்தையும், ‘இப்போதாவது’ நீண்டகால எதிர்பார்ப்பையும் வெளிப்படுத்துகின்றன.
