  source_fidelity: 'முதன்மை உரை கிரேக்கத்தின் வாக்கிய அமைப்பையும் முக்கியச் சொற்களையும் நம்பகமாகக் காக்கிறது: ἐν αὐτῷ என்பதற்கான “அதில்,” δικαιοσύνη θεοῦ என்பதற்கான திறந்த உடைமைத் தொடர் “கடவுளின் நீதி,” நிகழ்காலச் செயப்பாட்டு “வெளிப்படுத்தப்படுகிறது,” மற்றும் ἐκ πίστεως εἰς πίστιν என்பதின் மறுமொழியுடனான “விசுவாசத்திலிருந்து விசுவாசத்திற்கு” ஆகியவை பொருத்தமானவை. ஆபகூக் மேற்கோளில் ἐκ πίστεως-இன் இணைப்பு தெளிவின்மையும் அடிக்குறிப்பில் முறையாகக் காக்கப்பட்டுள்ளது. δὲ-ஐ முதன்மை உரையில் விடுத்தது இச்சூழலில் இயல்பானதும் பொருளுக்கு உண்மையானதுமாகும்.'
