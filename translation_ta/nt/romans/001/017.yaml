source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: ta
  text: ஏனெனில், அதில் கடவுளின் நீதி[a] விசுவாசத்திலிருந்து விசுவாசத்திற்கு[b] வெளிப்படுத்தப்படுகிறது. எழுதப்பட்டிருப்பதுபோல, “நீதியுள்ளவர் விசுவாசத்தினால் வாழ்வார்.”[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் நியாயம்.”
    reason: lexical_alternative
  - marker: b
    text: '“விசுவாசத்திலிருந்து விசுவாசத்திற்கு” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொற்றொடர் மிகவும் கடினமானதும் பலவாறு புரிந்துகொள்ளப்படுவதுமாகும். மாற்று மொழிபெயர்ப்புகள்: “விசுவாசத்திலிருந்து விசுவாசத்திற்காக,” “தொடக்கம் முதல் முடிவுவரை விசுவாசத்தினால்,” அல்லது “விசுவாசத்தின் வழியாக, விசுவாசத்திற்காக.”'
    reason: alternative_reading
  - marker: c
    text: அல்லது, “விசுவாசத்தினால் நீதியுள்ளவராக இருப்பவர் வாழ்வார்.”
    reason: alternative_reading
  - marker: d
    text: அல்லது, “ஆனால் நீதியுள்ளவர் விசுவாசத்தினால் வாழ்வார்.”
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη θεοῦ
  choice: கடவுளின் நீதி
  rationale: δικαιοσύνη என்பதன் நீதிநிலை, நீதியான செயல், நியாயம் ஆகிய பொருள் பரப்பைத் தமிழ் ‘நீதி’ இயல்பாகத் தாங்குகிறது. θεοῦ என்ற உடைமை வேற்றுமையை ‘கடவுளின்’ என வெளிப்படையாக வைத்திருப்பதால், இது கடவுளுக்குரிய நீதியா அல்லது கடவுளிடமிருந்து வரும் நீதியா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
- source_word: ἐν αὐτῷ
  choice: அதில்
  rationale: αὐτῷ நடுநிலை ஒருமை; முந்தைய வசனத்தில் கூறப்பட்ட நற்செய்தியையே இயல்பாகச் சுட்டுகிறது. ஆகவே ஆண்பால் நபரைக் குறிக்கும் வடிவம் தவிர்க்கப்பட்டது.
- source_word: ἀποκαλύπτεται
  choice: வெளிப்படுத்தப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் நேரடியான பொருளைத் தக்கவைத்து, வெளிப்பாடு நிகழ்கிறது என்பதைத் தெளிவாகச் சொல்கிறது.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: விசுவாசத்திலிருந்து விசுவாசத்திற்கு
  rationale: ἐκ...εἰς என்ற இரு முன்னிடைச்சொற்களின் இயக்கத்தையும் πίστις மீண்டும் வருவதையும் அப்படியே காக்கிறது; கடவுளின் உண்மைத்தன்மையிலிருந்து மனித விசுவாசத்திற்கா, தொடக்கம் முதல் முடிவு வரையிலான விசுவாசமா போன்ற சர்ச்சைக்குரிய விளக்கங்களில் ஒன்றை உரைக்குள் புகுத்தவில்லை.
- source_word: δίκαιος
  choice: நீதியுள்ளவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையை இயல்பான நவீன தமிழில் ஒருமை நபராகக் காட்டுகிறது; ‘நீதிமான்’ என்பதில் இன்றைய வாசகர் உணரக்கூடிய தேவையற்ற ஆண்பால் வரம்பைத் தவிர்க்கிறது.
- source_word: ἐκ πίστεως
  choice: விசுவாசத்தினால்
  rationale: வாழ்வதற்கான முறை அல்லது அடிப்படையாக விசுவாசத்தை இயல்பாகக் காட்டுகிறது; அதே நேரத்தில் சொற்றொடரின் இணைப்பு குறித்த மாற்று வாசிப்பை அடிக்குறிப்பில் காக்கிறது.
- source_word: ζήσεται
  choice: வாழ்வார்
  rationale: எதிர்கால வினையின் பொருளையும் மேற்கோளுக்கேற்ற கண்ணியமான நடையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: δικαιοσύνη θεοῦ என்பதன் பொருள்
  choice: கடவுளின் நீதி
  alternative: கடவுளிடமிருந்து வரும் நீதி; கடவுளின் நியாயம்
  rationale: கிரேக்க உடைமை வேற்றுமை பலவாறு புரிந்துகொள்ளப்படலாம். ‘கடவுளின் நீதி’ அதன் இலக்கணத் திறந்தநிலையையும் ரோமர் கடிதத்தின் இறையியல் அழுத்தத்தையும் தீர்க்காமல் காக்கிறது.
- issue: ἐκ πίστεως εἰς πίστιν என்பதன் பொருள்
  choice: விசுவாசத்திலிருந்து விசுவாசத்திற்கு
  alternative: விசுவாசத்திலிருந்து விசுவாசத்திற்காக; தொடக்கம் முதல் முடிவுவரை விசுவாசத்தினால்; விசுவாசத்தின் வழியாக, விசுவாசத்திற்காக
  rationale: இது புகழ்பெற்ற கடினமான சொற்றொடர். தேர்ந்த மொழிபெயர்ப்பு இரு முன்னிடைச்சொற்களையும் மறுமொழியையும் காத்து, குறிப்பிட்ட இறையியல் விளக்கத்தைத் திணிக்கவில்லை.
- issue: ஆபகூக் மேற்கோளில் ἐκ πίστεως எதனுடன் இணைகிறது
  choice: நீதியுள்ளவர் விசுவாசத்தினால் வாழ்வார்
  alternative: விசுவாசத்தினால் நீதியுள்ளவராக இருப்பவர் வாழ்வார்
  rationale: கிரேக்கத்தில் இச்சொற்றொடரை ‘நீதியுள்ளவர்’ என்பதுடனோ ‘வாழ்வார்’ என்பதுடனோ இணைத்துப் புரிந்துகொள்ள முடியும். இயல்பான பாரம்பரிய வாசிப்பு முதன்மை உரையில் வைக்கப்பட்டு, மாற்று இணைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: மேற்கோளிலுள்ள δὲ
  choice: முதன்மை உரையில் தனியே மொழிபெயர்க்கப்படவில்லை
  alternative: ஆனால் நீதியுள்ளவர் விசுவாசத்தினால் வாழ்வார்
  rationale: δὲ சில இடங்களில் மென்மையான தொடரிணைப்பாக அமைகிறது. இங்கு ‘ஆனால்’ எனச் சொல்வது முன் கூற்றுக்கு முரண்பாடு இருப்பதுபோல் தவறாக உணர்த்தலாம்; இருப்பினும் வடிவச் சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விசுவாசத்திலிருந்து விசுவாசத்திற்கு’ என்பது தமிழில் வழக்கமற்றதாகத் தோன்றினாலும், மூலத்தின் நோக்கமுள்ள மறுமொழியையும் உண்மையான பொருள் தெளிவின்மையையும் காப்பதற்காக வைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் உரிய இடங்களில் இடம்பெற்றுள்ளன.
