  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: ta
  text: ஆகவே, என்னைப் பொறுத்தவரை, ரோமில் இருக்கும் உங்களுக்கும் நற்செய்தியை அறிவிக்க[a] ஆவலாயிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நற்செய்தியைப் பிரசங்கிக்க.”
    reason: εὐαγγελίσασθαι என்பதற்கான மரபான மாற்று மொழிபெயர்ப்பைக் குறிப்பிடுகிறது.
lexical_decisions:
- source_word: οὕτως
  choice: ஆகவே
  rationale: முந்தைய விளக்கத்திலிருந்து பவுலின் நோக்கத்துக்கு இட்டுச் செல்லும் முடிவுரைத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: என்னைப் பொறுத்தவரை, ... ஆவலாயிருக்கிறேன்
  rationale: சொல்லெச்சமான கிரேக்கத் தொடரைத் தமிழில் இயல்பாக விரித்து, வெறும் ஆயத்தநிலையை மட்டுமல்லாமல் மனமார்ந்த விருப்பத்தையும் πρόθυμον என்பதற்கேற்ப வெளிப்படுத்துகிறது.
- source_word: καὶ ὑμῖν
  choice: உங்களுக்கும்
  rationale: மற்ற இடத்தாரோடு ரோமிலுள்ளவர்களும் உட்படுத்தப்படுகிறார்கள் என்ற καὶ-யின் உள்ளடக்கும் வலியுறுத்தலைச் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: ரோமில் இருக்கும்
  rationale: பெறுநர்களை அடையாளப்படுத்தும் கிரேக்கச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: εὐαγγελίσασθαι
  choice: நற்செய்தியை அறிவிக்க
  rationale: நற்செய்தியை அறிவித்தல் என்ற வினையின் பரந்த பொருளைத் தருகிறது; அதை முறையான பிரசங்கச் செயலுக்கு மட்டும் குறுக்குவதில்லை.
theological_decisions: []
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கமான சொற்றொடர் தமிழில் தெளிவுக்காக விரிக்கப்பட்டாலும், ‘என்னைப் பொறுத்தவரை’ என்ற வரம்பும் ‘உங்களுக்கும்’ என்ற உள்ளடக்கும் வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
