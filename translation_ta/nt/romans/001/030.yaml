reference: Romans 1:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: ta
  text: அவதூறு பேசுகிறவர்கள், கடவுளை வெறுப்பவர்கள்[a], பிறரை அவமதித்து நடப்பவர்கள், அகந்தையுள்ளவர்கள், வீண்பெருமை பேசுகிறவர்கள், தீமை செய்யப் புதுப்புது வழிகளைக் கண்டுபிடிக்கிறவர்கள், பெற்றோருக்குக் கீழ்ப்படியாதவர்கள்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளால் வெறுக்கப்படுபவர்கள்.”
    reason: θεοστυγεῖς என்ற கிரேக்கச் சொல்லுக்கு செய்வினை மற்றும் செயப்பாட்டு என இரு பொருள் விளக்கங்களும் வரலாற்றில் வழங்கப்பட்டுள்ளன.
lexical_decisions:
- source_word: καταλάλους
  choice: அவதூறு பேசுகிறவர்கள்
  rationale: பிறருக்கு எதிராக அவர்களது பெயரைக் கெடுக்கும் விதத்தில் பேசுவோரைக் குறிக்கிறது; இத்தமிழாக்கம் சொல்லின் ஒழுக்கக் கடுமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θεοστυγεῖς
  choice: கடவுளை வெறுப்பவர்கள்
  rationale: தீய குணங்களின் பட்டியலில் மனிதர்களின் மனப்பாங்கைக் குறிக்கும் செயப்பாட்டு பொருள் இயல்பாகப் பொருந்துகிறது; செயப்பாட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὑβριστάς
  choice: பிறரை அவமதித்து நடப்பவர்கள்
  rationale: செருக்குடன் பிறரை இழிவுபடுத்தி முறைகேடாக நடத்தும் மனப்பாங்கையும் செயலையும் இது உள்ளடக்குகிறது; உடல் வன்முறைக்கு மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: ὑπερηφάνους
  choice: அகந்தையுள்ளவர்கள்
  rationale: தம்மை உயர்வாக எண்ணும் செருக்கைத் தெளிவாகக் குறிக்கிறது; அடுத்துள்ள தற்புகழ்ச்சியைக் குறிக்கும் சொல்லிலிருந்தும் வேறுபடுகிறது.
- source_word: ἀλαζόνας
  choice: வீண்பெருமை பேசுகிறவர்கள்
  rationale: தம்மைக் குறித்து ஆதாரமின்றிப் பெருமை பாராட்டும் தற்புகழ்ச்சியாளர்களைக் குறிக்கும் கிரேக்கச் சொல்லின் மையப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐφευρετὰς κακῶν
  choice: தீமை செய்யப் புதுப்புது வழிகளைக் கண்டுபிடிக்கிறவர்கள்
  rationale: தீய செயல்களைப் புதுமையாகத் திட்டமிடுவோர் என்ற உயிரோட்டமான கிரேக்கப் படிமத்தை, தமிழில் ஏற்படும் செயற்கைத்தன்மையைத் தவிர்த்து வெளிப்படுத்துகிறது.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: பெற்றோருக்குக் கீழ்ப்படியாதவர்கள்
  rationale: பெற்றோருடனான உறவில் கீழ்ப்படியாமையை நேரடியாகவும் தெளிவாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: θεοστυγεῖς என்பதன் பொருள்
  choice: 'செய்வினைப் பொருள்: “கடவுளை வெறுப்பவர்கள்”'
  alternative: 'செயப்பாட்டு பொருள்: “கடவுளால் வெறுக்கப்படுகிறவர்கள்”'
  rationale: இந்தத் தீய குணங்களின் பட்டியலில் மனித மனப்பாங்குகள் மற்றும் செயல்களோடு செய்வினைப் பொருள் நன்கு பொருந்துகிறது. எனினும், சொல்லின் வரலாற்றுச் செயப்பாட்டு விளக்கம் உண்மையான மாற்றுப் பொருளாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் தீய குணங்களின் பட்டியல் ஒரே இலக்கண வடிவில் அமைக்கப்பட்டுள்ளது. வசனம் தொடரும் பட்டியலின் ஒரு பகுதி என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
