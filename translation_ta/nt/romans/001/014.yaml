- from: கிரேக்கருக்கும் பிற இனத்தாருக்கும்[a], ஞானிகளுக்கும் அறிவற்றவர்களுக்கும் நான் கடமைப்பட்டிருக்கிறேன்.
  to: கிரேக்கருக்கும் கிரேக்கரல்லாதவர்களுக்கும்[a], ஞானிகளுக்கும் அறிவிலிகளுக்கும் நான் கடமைப்பட்டிருக்கிறேன்.
  rationale: The revision retains the source’s two coordinated social contrasts, makes the Greek/non-Greek scope of βαρβάροις explicit in the text, and strengthens the wise/foolish contrast. The footnote preserves the historical-cultural nuance and alternative Tamil renderings without using a modern term that would imply moral savagery.
