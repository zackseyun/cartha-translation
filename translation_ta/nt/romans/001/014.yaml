  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: ta
  text: கிரேக்கருக்கும் கிரேக்கரல்லாதவர்களுக்கும்[a], ஞானிகளுக்கும் அறிவிலிகளுக்கும் நான் கடமைப்பட்டிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அயல்நாட்டாருக்கும்” அல்லது “பிற இனத்தாருக்கும்.” கிரேக்கச் சொல் அக்காலப் பண்பாட்டு வழக்கில் கிரேக்கருக்கு எதிரான, கிரேக்க மொழி பேசாதவர்களையும் உள்ளடக்கியவர்களைக் குறித்தது; அவர்கள் நாகரிகமற்றவர்கள் என்ற ஒழுக்கத் தீர்ப்பை அவசியம் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: கிரேக்கருக்கும்
  rationale: இது கிரேக்கரை இன-பண்பாட்டுக் குழுவாகக் குறிக்கிறது; அடுத்த சொல்லுடன் அமைந்துள்ள சமூக வேறுபாட்டையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: βαρβάροις
  choice: பிற இனத்தாருக்கும்
  rationale: முதல் நூற்றாண்டுக் கிரேக்க வழக்கில், இந்தச் சொல் கிரேக்கர் அல்லாதவர்களை, குறிப்பாகக் கிரேக்க மொழி பேசாதவர்களைக் குறித்தது. நவீன தமிழில் ‘காட்டுமிராண்டிகள்’ என்பது தேவையற்ற இழிவுப் பொருளைத் தருவதால், இயல்பான பொருள் முதன்மை உரையில் தரப்பட்டு வரலாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: σοφοῖς
  choice: ஞானிகளுக்கும்
  rationale: ἀνοήτοις என்பதற்கு எதிரிணையாக அமைந்துள்ள ‘ஞானமுள்ளவர்கள்’ என்ற நேரடியான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀνοήτοις
  choice: அறிவற்றவர்களுக்கும்
  rationale: ‘ஞானிகள்’ என்பதற்கு எதிரான கருத்தைப் பாதுகாக்கிறது; ‘மூடர்கள்’ என்பதிலுள்ள கடுமையான இழிவுத் தொனியைத் தவிர்த்து, சொல்லின் அறிவுசார் பரப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὀφειλέτης
  choice: கடமைப்பட்டிருக்கிறேன்
  rationale: சொல் நேரடியாக ‘கடன்பட்டவன்’ எனப் பொருள்படலாம்; இச்சூழலில் பணக்கடனை அல்ல, பவுலின் கட்டுப்படுத்தும் பொறுப்பை அல்லது கடமையைச் சுட்டுவதால் இந்த வினைச்சொல் அமைப்பு தெளிவாக உள்ளது.
- source_word: τε ... καὶ / τε ... καὶ
  choice: …க்கும் …க்கும் / …க்கும் …க்கும்
  rationale: கிரேக்கத்தில் உள்ள இரண்டு சமநிலை இணைத் தொடர்களையும் தமிழுக்கேற்ற இணைப்புமுறையில் பாதுகாக்கிறது.
