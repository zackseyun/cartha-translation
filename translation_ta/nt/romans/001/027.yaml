id: ROM.1.27
reference: Romans 1:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: ta
  text: அவ்வாறே, ஆண்களும் பெண்ணுடனான இயற்கையான உறவை[a] விட்டுவிட்டு, ஒருவர்மீது ஒருவர் கொண்ட வேட்கையில்[b] பற்றியெரிந்தார்கள். ஆண்கள் ஆண்களுடன் வெட்கக்கேடானதைச் செய்து[c], தங்களுடைய வழிதவறுதலுக்குத் தகுந்த கைம்மாறை[d] தங்களிலேயே பெற்றுக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்படியான மற்றொரு மொழிபெயர்ப்பு: “பெண்ணின் இயற்கையான பயன்பாட்டை.” இச்சூழலில் இது பாலுறவைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒருவருக்காக ஒருவர் கொண்ட இச்சையில் எரிந்தார்கள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “இழிவான செயலைச் செய்து.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “உரிய பிரதிபலனை” அல்லது “உரிய தண்டனையை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: ஆண்கள் / பெண்
  rationale: கிரேக்கத்தில் உள்ள உயிரியல் பாலைக் குறிக்கும் சொற்களை உறவுமுறைச் சொற்களாக மாற்றாமல் காக்கிறது; ஆண்–பெண் எதிரிணையையும் ஆண்கள் என்ற சொல்லின் மீளுரைப்பையும் தக்கவைக்கிறது.
- source_word: ἀφέντες
  choice: விட்டுவிட்டு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலை இயல்பான நவீனத் தமிழில் காட்டுகிறது; கைவிடுதல் என்ற கருத்தையும் தருகிறது.
- source_word: φυσικὴν χρῆσιν τῆς θηλείας
  choice: பெண்ணுடனான இயற்கையான உறவு
  rationale: சூழலில் உள்ள பாலுறவுக் குறிப்பை இயல்பாக உணர்த்துகிறது; அதேவேளையில் கிரேக்கத்தின் சொற்படியான ‘பெண்ணின் இயற்கையான பயன்பாடு’ என்பதைக் குறிப்பில் பாதுகாக்கிறது.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: வேட்கையில் பற்றியெரிந்தார்கள்
  rationale: வினையின் நெருப்பு உருவகத்தைத் தக்கவைத்து, ὄρεξις என்பதைக் கூடுதல் தீவிரம் சேர்க்காமல் ‘வேட்கை’ என மொழிபெயர்க்கிறது.
- source_word: εἰς ἀλλήλους
  choice: ஒருவர்மேல் ஒருவர் கொண்ட
  rationale: பரஸ்பர நோக்குடைய வேட்கையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: ஆண்கள் ஆண்களுடன்
  rationale: மூலத்தில் வேண்டுமென்றே மீண்டும் வரும் பால்குறித்த சொல்லாட்சியையும் அதன் சொல்லாற்றல் வலிமையையும் காக்கிறது.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: வெட்கக்கேடானதைச் செய்து
  rationale: பெயர்ச்சொல்லின் ஒழுக்க மதிப்பீட்டைத் தக்கவைக்கிறது; ஆனால் மூலத்தில் இல்லாத குறிப்பிட்ட செயற்பெயரைச் சேர்ப்பதில்லை.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: தகுந்த கைம்மாறு
  rationale: செயலுக்கு ஏற்ற பதில்விளைவு அல்லது பிரதிபலன் என்ற கருத்தைத் தருகிறது; ‘தண்டனை’ என்று மட்டும் தீர்மானித்து மூலத்தின் பரப்பைக் குறைக்கவில்லை.
- source_word: τῆς πλάνης αὐτῶν
  choice: தங்களுடைய வழிதவறுதலுக்கு
  rationale: πλάνη என்பதன் தவறிப்போதல் அல்லது வழிவிலகல் சார்ந்த உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: தங்களிலேயே பெற்றுக்கொண்டார்கள்
  rationale: ἑαυτοῖς என்பதன் தற்சுட்டுப் பொருளைக் காக்கிறது; அது உடலுக்குள், தனிநபர்களில், அல்லது அவர்களிடையே எவ்வாறு நிகழ்ந்தது என்பதை மேலதிகமாக நிர்ணயிப்பதில்லை.
theological_decisions:
- issue: உயிரியல் பாலைக் குறிக்கும் சொற்களை உறவுமுறைச் சொற்களாக மென்மைப்படுத்தலாமா
  choice: ஆண்கள் … பெண் … ஆண்கள் ஆண்களுடன்
  alternative: ஆடவர்கள் … பெண்களுடனான உறவு … ஆடவர்கள் ஆடவர்களுடன்
  rationale: மூலம் பொதுவான உறவுமுறைச் சொற்களை அல்ல, பாலைக் குறிப்பாகச் சுட்டும் சொற்களைப் பயன்படுத்துகிறது. அதைக் காப்பது கூடுதல் கோட்பாட்டுக் கருத்துகளைச் சேர்க்காமல் மூலத்திற்கு நெருக்கமாக உள்ளது.
- issue: ἀσχημοσύνη என்பதன் ஒழுக்க மதிப்பீட்டை எவ்வளவு வெளிப்படையாக மொழிபெயர்ப்பது
  choice: வெட்கக்கேடானதைச் செய்து
  alternative: ஓரினப் பாலுறவுச் செயல்களைச் செய்து
  rationale: மூலத்தின் எதிர்மறையான ஒழுக்க மதிப்பீடு காக்கப்படுகிறது; ஆனால் கிரேக்கத்தில் இல்லாத நவீன வகைப்பாட்டுப் பெயர் சேர்க்கப்படவில்லை.
- issue: ἀντιμισθία என்பதைத் தண்டனை என்று மட்டுமே நிர்ணயிப்பதா
  choice: தகுந்த கைம்மாறு
  alternative: உரிய தண்டனை
  rationale: சொல் உரிய பதில், பிரதிபலன், அல்லது விளைவு என்ற பரப்பைக் கொண்டிருக்கலாம். ‘கைம்மாறு’ அந்தத் தொடர்பைக் காக்கிறது; குறிப்பில் ‘தண்டனை’ என்ற சாத்தியமும் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் நெருப்பு உருவகம், பாலைக் குறிக்கும் சொல்லாட்சி, ஒழுக்க மதிப்பீடு, மற்றும் கைம்மாறு/தண்டனை குறித்த பொருள் பரப்பு ஆகியவை இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
