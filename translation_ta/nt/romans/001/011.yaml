source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: ta
  text: ஏனெனில், ஏதாவது ஓர் ஆவிக்குரிய வரத்தை[a] உங்களுக்குப் பகிர்ந்தளித்து, நீங்கள் உறுதிப்படுத்தப்படுவதற்காக[b] உங்களைப் பார்க்க நான் ஏங்குகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏதாவது ஓர் ஆவிக்குரிய வரத்தை உங்களோடு பகிர்ந்துகொள்ள.’ ‘ஆவிக்குரிய’ என்பது குறிப்பிட்ட அற்புத வரத்தை மட்டும் கட்டாயப்படுத்தாது; பரந்த ஆவிக்குரிய நன்மையையும் குறிக்கலாம்.
    reason: lexical_alternative; theological_ambiguity
  - marker: b
    text: அல்லது, ‘உங்களை உறுதிப்படுத்துவதற்காக.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: நான் ஏங்குகிறேன்
  rationale: வலுவான தனிப்பட்ட விருப்பத்தையும் பாசத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்தை விளக்கும் இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: ἰδεῖν ὑμᾶς
  choice: உங்களைப் பார்க்க
  rationale: ‘பார்க்க’ என்ற மூலப் பொருளை நேரடியாகக் காக்கிறது; சந்திக்கச் செல்வது சூழலில் உட்குறிப்பாக உள்ளது.
- source_word: ἵνα
  choice: விரும்புகிறேன்
  rationale: கிரேக்க நோக்கக் கட்டமைப்பை தமிழில் இயல்பாக வெளிப்படுத்த, பிரதான வினையுடன் இணைத்து விருப்பத்தின் நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: τι
  choice: ஏதாவது ஒன்றை
  rationale: குறிப்பிடப்படாத தன்மையை மிகைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: μεταδῶ
  choice: பகிர்ந்தளிக்க
  rationale: வெறுமனே கொடுப்பதைவிட, ஒருவரிடம் உள்ளதை மற்றவருடன் பகிரும் பொருளை வெளிப்படுத்துகிறது.
- source_word: χάρισμα πνευματικὸν
  choice: ஆவிக்குரிய வரம்
  rationale: ஒரு குறிப்பிட்ட அற்புத வரமாகக் குறுக்காமல், கிரேக்கச் சொற்றொடரின் பரந்த பொருளையும் தெளிவின்மையையும் காக்கிறது.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: நீங்கள் உறுதிப்படுத்தப்படும்படி
  rationale: மூலத்தில் உள்ள இறைச்செயப்பாட்டு வடிவத்தையும் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவு என்ற நுணுக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: ‘ஆவிக்குரிய வரம்’ என்பது ஒரு குறிப்பிட்ட அற்புதமான அருள்வரத்தையா அல்லது பரந்த ஆவிக்குரிய நன்மையையா குறிக்கிறது?
  choice: ஆவிக்குரிய வரம்
  alternative: ஆவியானவர் அருளும் வரம்; ஆவிக்குரிய நன்மை
  rationale: πνευματικόν என்ற சொல் இங்கு குறிப்பிட்ட வகை வரத்தை கட்டாயப்படுத்தவில்லை. ஆகவே எந்தப் பிரிவுசார் விளக்கத்தையும் புகுத்தாமல் மூலத்தின் பரந்த பொருள் பாதுகாக்கப்படுகிறது.
- issue: உறுதிப்படுத்தும் செயலைப் பவுல் நேரடியாகச் செய்கிறாரா அல்லது அவர்கள் உறுதிப்படுத்தப்படுகிறார்களா?
  choice: நீங்கள் உறுதிப்படுத்தப்படும்படி
  alternative: உங்களை உறுதிப்படுத்துவதற்காக
  rationale: கிரேக்கத்தில் στηριχθῆναι இறைச்செயப்பாட்டில் இருப்பதால், செய்பவரை மொழிபெயர்ப்பு தானாக நிர்ணயிக்காமல் அந்த வடிவம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் கருத்தோட்டம் குலையாமல், வாசிப்புத் தெளிவுக்காக தமிழில் இரண்டு வாக்கியங்களாக வழங்கப்பட்டுள்ளது.
