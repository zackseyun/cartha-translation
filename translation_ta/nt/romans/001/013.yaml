id: ROM.1.13
reference: Romans 1:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: ta
  text: 'சகோதரர்களே[a], நீங்கள் இதை அறியாமல் இருப்பதை நான் விரும்பவில்லை: உங்களிடம் வர நான் பலமுறை திட்டமிட்டேன்; ஆனால் இதுவரை தடுக்கப்பட்டேன்; மற்ற புறஜாதியினரிடையே[c] இருப்பதுபோல உங்களிடையிலும் ஓரளவு பலன்[b] பெறுவதற்காகவே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதர சகோதரிகளே” என்றும் பொருள் கொள்ளலாம்; இங்கு “சகோதரர்கள்” என்பது விசுவாசிகளான ஆண்களையும் பெண்களையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “பலன்” என்பது பவுலின் ஊழியத்தின் விளைவுகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “மற்ற மக்களினங்களிடையே” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: நீங்கள் இதை அறியாமல் இருப்பதை நான் விரும்பவில்லை
  rationale: மூலத்தின் எதிர்மறை அமைப்பைப் பேணியபடியே, நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் பவுலின் வழக்கமான அறிவிப்பு முறையை வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மை அழைப்பை முறையாகப் பிரதிபலிக்கிறது; கலந்த விசுவாசிகள் கூட்டத்தையும் இச்சொல் உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: πολλάκις προεθέμην
  choice: பலமுறை திட்டமிட்டேன்
  rationale: மீண்டும் மீண்டும் கொண்ட முந்தைய நோக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐκωλύθην ἄχρι τοῦ δεῦρο
  choice: இதுவரை தடுக்கப்பட்டேன்
  rationale: வெளிப்புறத் தடையைக் காட்டும் மூலத்தின் இறப்புவினை அமைப்பையும் கால எல்லையையும் பேணுகிறது.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: ஏதாவது பலன் கிடைக்க வேண்டும் என்பதற்காக
  rationale: καρπός என்பதன் ‘கனி/விளைவு’ உருவகத்தை ‘பலன்’ என்ற இயல்பான தமிழ்ச் சொல்லால் தக்கவைக்கிறது; இது ஊழியத்தின் விளைவைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையேயும்
  rationale: ரோம விசுவாசிகள் மத்தியில் உண்டாகும் பலனைச் சுட்டும் குழுசார் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: மற்ற புறஜாதியினரிடையே
  rationale: பவுலின் இச்சூழலில் ἔθνη என்பது அரசியல் நாடுகளைவிட யூதரல்லாத மக்களைக் குறிக்கும் வாய்ப்பு அதிகம்; λοιποί என்பதன் ‘மற்ற’ பொருளும் பேணப்படுகிறது.
theological_decisions:
- issue: ἔθνη என்பது ‘புறஜாதியினர்’ எனுமா, ‘மக்களினங்கள்/நாடுகள்’ எனுமா
  choice: புறஜாதியினர்
  alternative: மற்ற மக்களினங்கள்
  rationale: ரோமர் நிருபத்தின் இச்சூழலும் பவுலின் புறஜாதி ஊழியமும் நபர்களைக் குறிக்கும் ‘புறஜாதியினர்’ என்ற வாசிப்பை ஆதரிக்கின்றன; இருப்பினும் சொல்லின் பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: καρπός என்பதன் உருவகப் பொருள்
  choice: பலன் என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ஊழியத்தின் விளைவு என்று நேரடியாக விரித்துரைத்தல்
  rationale: மூலத்தின் வேளாண்மை உருவகத்தையும் அதன் திறந்த பொருள் நுணுக்கத்தையும் முதன்மை உரையில் பாதுகாத்து, சூழலுக்குரிய விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், திருச்சபை வாசிப்பிற்கேற்ற கண்ணியமான ஆனால் பொதுமக்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத தொடக்கக் காலவினையடை சேர்க்கப்படவில்லை. δέ தனியாக வலுவான இணைப்புச் சொல்லாக மாற்றப்படாமல், தமிழின் இயல்பான உரையோட்டத்தில் விடப்பட்டுள்ளது. இறுதி வாக்கியத்தில் ‘வர விரும்பினேன்’ என்பது தமிழில் நோக்கத் தொடர்பைத் தெளிவாக்குவதற்கான சூழல்சார் மீட்பு; புதிய கருத்தைச் சேர்ப்பதில்லை.
