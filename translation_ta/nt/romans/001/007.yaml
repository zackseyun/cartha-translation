  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: ta
  text: ரோமில் இருக்கும், கடவுளால் அன்புகூரப்பட்டவர்களும் அழைக்கப்பட்ட பரிசுத்தர்களுமான அனைவருக்கும்:[c] நம் தந்தையாகிய கடவுளிடமிருந்தும் ஆண்டவராகிய இயேசு மெசியாவிடமிருந்தும்[b] அருளும் சமாதானமும் உண்டாகட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தர்களாகும்படி அழைக்கப்பட்டவர்கள்”; அல்லது, “அழைக்கப்பட்ட புனிதர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கிறிஸ்து.”
    reason: lexical_alternative
  - marker: c
    text: இந்தத் தொடரை, “கடவுளால் அன்புகூரப்பட்ட, அழைக்கப்பட்ட பரிசுத்தர்கள்” என்றும் அமைக்கலாம்.
    reason: previous_rendering
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: ரோமில் இருக்கிற அனைவருக்கும்
  rationale: இடத்தையும் அனைவரையும் உள்ளடக்கும் முகவரியையும் இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἀγαπητοῖς θεοῦ
  choice: கடவுளால் அன்புகூரப்பட்டவர்கள்
  rationale: ἀγαπητοῖς என்பதன் பெயரடைத் தன்மையையும், அன்பின் செயல்பாட்டாளர் கடவுள் என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: κλητοῖς ἁγίοις
  choice: அழைக்கப்பட்ட பரிசுத்தர்கள்
  rationale: கிரேக்கத்தில் உள்ள இரு பெயரடைகளின் தொடர்பைப் பாதுகாத்து, மூலத்தில் இல்லாத ‘ஆகும்படி’ என்ற நோக்கக் கருத்தை முதன்மை உரையில் சேர்க்காமல் விடுகிறது.
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்தில் χάρις குறிக்கும் இறைத் தயவையும் தமிழ்க் கிறிஸ்தவ மொழிநடையில் அதன் ஆழத்தையும் இயல்பாகத் தருகிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: வாழ்த்துச் செயல்பாட்டையும் ஆழமான நல்வாழ்வு மற்றும் ஒப்புரவு சார்ந்த பொருளையும் தக்கவைக்கிறது.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: நம் தந்தையாகிய கடவுள்
  rationale: கிரேக்க உறவைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் அதிகாரத்தையும் கிறிஸ்துவியல் வலிமையையும் நிலையான தமிழ்ச் சொல்லால் தருகிறது.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: Χριστός இங்கு பட்டப்பெயராக இருப்பதால் அதன் பொருளை மொழிபெயர்க்கிறது; ‘கிறிஸ்து’ என்ற ஒலிபெயர்ப்பை மாற்று வாசிப்பாகக் குறிக்கிறது.
theological_decisions:
- issue: κλητοῖς ἁγίοις என்பதன் தொடர்பு
  choice: அழைக்கப்பட்ட பரிசுத்தர்கள்
  alternative: பரிசுத்தர்களாகும்படி அழைக்கப்பட்டவர்கள்
  rationale: மூலத்தில் ‘ஆகும்படி’ என்பதற்கு இணையான வினையெச்சம் இல்லை. எனவே அழைப்பும் பரிசுத்த அடையாளமும் இடையிலான சுருக்கமான, உண்மையான பதற்றத்தைத் தீர்மானித்து விரிவுபடுத்தாமல் பாதுகாக்கிறது.
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளை வெளிப்படுத்துகிறது; பாரம்பரிய ஒலிபெயர்ப்பையும் அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதும். ‘இருக்கிற’ என்பது இயல்பான நடையைத் தருகிறது; ‘அன்புகூரப்பட்ட’, ‘பரிசுத்தர்கள்’, ‘அருள்’, ‘சமாதானம்’ ஆகியவை வசனத்தின் பவுலிய மற்றும் வழிபாட்டு நிறையைத் தக்கவைக்கின்றன. அடிக்குறிப்பு குறிகள் அனைத்தும் பிரதான உரையில் இடம்பெற்றுள்ளன.
