source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: ta
  text: ஏனெனில், நற்செய்தியைப்[a] பற்றி நான் வெட்கப்படுவதில்லை. ஏனெனில், அது நம்புகிற ஒவ்வொருவருக்கும் மீட்புக்கான கடவுளின் வல்லமையாக இருக்கிறது—முதலில் யூதருக்கும், அதோடு கிரேக்கருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுவிசேஷம்.’
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘கிரேக்கர்’ என்பது விரிவான பொருளில் புறவினத்தாரை, அதாவது யூதரல்லாதவர்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: வெட்கப்படுவதில்லை
  rationale: அவமானமாகக் கருதுவதையோ அதனால் பின்வாங்குவதையோ குறிக்கும் வினைச்சொல்லை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὐαγγέλιον
  choice: நற்செய்தி
  rationale: ‘நல்ல செய்தி’ என்ற மூலப் பொருளைத் தெளிவாகவும் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: δύναμις
  choice: வல்லமை
  rationale: கடவுளின் செயல்திறனுள்ள மீட்புச் சக்தியை கண்ணியமான, பொதுவாகப் புரியும் தமிழில் குறிக்கிறது.
- source_word: εἰς σωτηρίαν
  choice: மீட்பு அளிக்கும்
  rationale: εἰς என்பதன் இலக்கு/விளைவு சார்ந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘மீட்புக்காக’ என்பதைக் காட்டிலும் வாக்கியத்தில் தெளிவாகப் பொருந்துகிறது.
- source_word: παντὶ τῷ πιστεύοντι
  choice: நம்புகிற ஒவ்வொருவருக்கும்
  rationale: παντί என்பதன் ஒவ்வொருவரையும் உள்ளடக்கும் தன்மையையும் πιστεύοντι என்பதன் வினைச்சார்ந்த வடிவத்தையும் காக்கிறது.
- source_word: Ἰουδαίῳ
  choice: யூதருக்கும்
  rationale: Ἕλληνι உடனான பவுலின் இன-சமய வரலாற்று வேறுபாட்டில் ‘யூதர்’ என்பதே பொருத்தமானது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: மூலத்தில் உள்ள சுருக்கமான முன்னுரிமை அல்லது வரலாற்று வரிசையைக் கூடுதல் விளக்கமின்றிக் காக்கிறது.
- source_word: Ἕλληνι
  choice: கிரேக்கருக்கும்
  rationale: மூலத்தின் நேரடி சொல்லை முதன்மை உரையில் காக்கிறது; யூதரல்லாதவர்களை விரிவாகக் குறிக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τε ... καί
  choice: …க்கும், …க்கும்
  rationale: தமிழின் இணைப்புமுறையில் முதலில் யூதரையும் அதோடு கிரேக்கரையும் இயல்பாகச் சேர்த்துக் காட்டுகிறது.
theological_decisions:
- issue: ‘முதலில் யூதருக்கும்’ என்பதில் πρῶτον குறிக்கும் முன்னுரிமை
  choice: ‘முதலில்’ என்பதை விளக்கச் சேர்க்கையின்றிக் காத்தல்
  alternative: ‘யூதருக்கு முதலிடம்’ அல்லது ‘முதலாவதாக யூதருக்கு’ என்று குறிப்பிட்ட வகை முன்னுரிமையாக விளக்குதல்
  rationale: இது கால வரிசையா, மீட்பு வரலாற்று முன்னுரிமையா, வேறு வகை முன்னுரிமையா என்பதை வசனம் தானாக முழுமையாகத் தீர்மானிப்பதில்லை; ஆகவே அதன் இறையியல் பதற்றம் காக்கப்படுகிறது.
- issue: ‘யூதருக்கும் கிரேக்கருக்கும்’ என்பதில் Ἕλληνι என்பதன் பரப்பு
  choice: முதன்மை உரையில் ‘கிரேக்கர்’; விரிவான யூதரல்லாத பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: முதன்மை உரையில் ‘புறவினத்தார்’ அல்லது ‘யூதரல்லாதவர்’
  rationale: கிரேக்க மூலத்தின் சொல் வடிவத்தை வெளிப்படையாகக் காக்கும் அதேவேளையில், பவுலின் பயன்பாட்டில் அது யூதரல்லாத மக்களை விரிவாகக் குறிக்கக்கூடும் என்பதையும் தெரிவிக்கிறது.
- issue: εἰς σωτηρίαν உடன் δύναμις θεοῦ உறவு
  choice: ‘மீட்பு அளிக்கும் கடவுளின் வல்லமை’
  alternative: ‘மீட்புக்கான கடவுளின் வல்லமை’
  rationale: நற்செய்தி கடவுளின் செயல்திறனுள்ள வல்லமை என்று கூறும் வாக்கியத்தின் இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மீட்பின் துல்லியமான கோட்பாட்டு இயங்குமுறையை மேலதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான நடை. ‘நற்செய்தி’ தெளிவுக்காகத் தேர்ந்தெடுக்கப்பட்டு பாரம்பரிய ‘சுவிசேஷம்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் இருமுறை γάρ அமைப்பு ‘ஏனெனில்’ என்பதை இருமுறை பயன்படுத்திக் காக்கப்படுகிறது; தமிழில் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
