revisions:
- from: ஏனெனில், நற்செய்தியைக்[a] குறித்து நான் வெட்கப்படுவதில்லை. ஏனெனில், நம்புகிற ஒவ்வொருவருக்கும்—முதலில் யூதருக்கும், கிரேக்கருக்கும்[b]—மீட்பு அளிக்கும் கடவுளின் வல்லமை அது.
  to: ஏனெனில், நற்செய்தியைப்[a] பற்றி நான் வெட்கப்படுவதில்லை. ஏனெனில், அது நம்புகிற ஒவ்வொருவருக்கும் மீட்புக்கான கடவுளின் வல்லமையாக இருக்கிறது—முதலில் யூதருக்கும், அதோடு கிரேக்கருக்கும்[b].
