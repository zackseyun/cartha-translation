  text: ἐν οἷς ἐστε καὶ ὑμεῖς κλητοὶ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/006.yaml
  text: among whom you also are[a], called of Jesus the Messiah,
translation:
  language: ta
  text: அவர்களுள் நீங்களும் இயேசு மெசியாவுக்குரிய அழைக்கப்பட்டவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு மெசியாவினால் அழைக்கப்பட்டவர்கள்”; இன்னும் சொல்லுக்குச் சொல், “இயேசு மெசியாவின் அழைக்கப்பட்டவர்கள்.”
    reason: κλητοὶ Ἰησοῦ Χριστοῦ என்ற கிரேக்கத் தொடரிலுள்ள உரிமை/உறவு வேற்றுமை, மெசியாவுக்குரியவர்கள் என்ற உறவையோ மெசியாவினால் அழைக்கப்பட்டவர்கள் என்ற செய்பவர் பொருளையோ குறிக்கக்கூடும்.
lexical_decisions:
- source_word: ἐν οἷς
  choice: அவர்களுள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பிற இனத்தாரைச் சுட்டும் பன்மை உறவுப்பெயரின் பொருளை, அந்தக் குழுவினுள் ரோம விசுவாசிகளும் அடங்குகிறார்கள் என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐστε καὶ ὑμεῖς
  choice: நீங்களும் ... அழைக்கப்பட்டவர்கள்
  rationale: ἐστε என்பதன் நிகழ்கால நிலைமையையும் καὶ ὑμεῖς என்பதன் வலியுறுத்தப்பட்ட சேர்க்கையையும் தமிழில் இயல்பான பெயர்ப்பயனிலை வாக்கியமாகத் தருகிறது.
- source_word: κλητοὶ
  choice: அழைக்கப்பட்டவர்கள்
  rationale: κλητός என்பதன் அழைப்பு சார்ந்த அடிப்படைப் பொருளைப் பாதுகாக்கிறது; வெறும் ‘அழைக்கப்பட்டிருக்கிறீர்கள்’ என்பதைவிட, இவர்கள் அழைப்பால் அடையாளப்படுத்தப்பட்ட மக்கள் என்ற பெயரடைத் தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Ἰησοῦ என்பதை இயேசு என்ற பெயராகவும் Χριστοῦ என்பதை ‘மெசியா’ என்ற பட்டமாகவும் வழங்குகிறது.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவுக்குரிய அழைக்கப்பட்டவர்கள்
  rationale: கிரேக்கத்தில் சுருக்கமாக அமைந்துள்ள உரிமை/உறவு வேற்றுமையை ஒரே வகையில் முற்றாகத் தீர்மானிக்காமல், இயேசு மெசியாவுடன் இவர்களுக்குள்ள உறவையும் அவருக்குரியவர்களாக இருப்பதையும் இயல்பான தமிழில் முன்னிறுத்துகிறது.
theological_decisions:
- issue: κλητοὶ Ἰησοῦ Χριστοῦ என்பதில் உள்ள உரிமை/உறவு வேற்றுமையின் பொருள்
  choice: இயேசு மெசியாவுக்குரிய அழைக்கப்பட்டவர்கள்
  alternative: இயேசு மெசியாவினால் அழைக்கப்பட்டவர்கள்; சொல்லுக்குச் சொல், ‘இயேசு மெசியாவின் அழைக்கப்பட்டவர்கள்’
  rationale: முதன்மை வாசகம் இவர்களை மெசியாவுக்குரியவர்களாக அடையாளப்படுத்துகிறது; அதேவேளையில், கிரேக்கத் தொடர் அழைப்பின் செய்பவரைச் சுட்டலாம் என்ற வாய்ப்பையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்களுள்’ என்பது முந்தைய வசனத்துடனான தொடர்பைச் சுருக்கமாக வைத்திருக்கிறது; ‘மெசியா’ பட்டமாகத் தக்கவைக்கப்பட்டுள்ளது.
