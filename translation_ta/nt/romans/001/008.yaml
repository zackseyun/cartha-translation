id: ROM.1.8
reference: Romans 1:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: ta
  text: முதலில், உங்கள் அனைவருக்காகவும் மேசியாவாகிய இயேசுவின்[a] வழியாக என் கடவுளுக்கு நன்றி செலுத்துகிறேன். ஏனெனில், உங்கள் விசுவாசம்[b] உலகம் முழுவதும் பறைசாற்றப்பட்டு வருகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவாகிய இயேசுவின்.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உண்மைப்பற்று”; “நம்பிக்கை” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: முதலில்
  rationale: பவுல் தமது உரையின் தொடக்கக் கருத்தை அறிமுகப்படுத்துகிறார். μὲν தனியாகச் சொல்லாக்கப்படாமல், இயல்பான தமிழ் உரையோட்டத்தில் உள்ளடக்கப்பட்டுள்ளது.
- source_word: εὐχαριστῶ
  choice: நன்றி செலுத்துகிறேன்
  rationale: நன்றியறிதலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்தும் மரியாதையான நவீனத் தமிழ் நடை.
- source_word: τῷ θεῷ μου
  choice: என் கடவுளுக்கு
  rationale: மூலத்தின் தனிப்பட்ட உடைமைத் தொடர்பையும் பவுலின் பக்திநிறைந்த தொனியையும் காக்கிறது.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: மேசியாவாகிய இயேசுவின் வழியாக
  rationale: διά + genitive குறிக்கும் இடைமுகம் அல்லது வழிமுறையை ‘வழியாக’ காக்கிறது; Χριστός ஒரு பட்டமாக இருப்பதை ‘மேசியாவாகிய’ வெளிப்படுத்துகிறது.
- source_word: περὶ πάντων ὑμῶν
  choice: உங்கள் அனைவருக்காகவும்
  rationale: நன்றிசெலுத்தும் சூழலில் περί என்பதன் பொருளை இயல்பான தமிழில் தருகிறது; πάντων என்பதன் முழுமையையும் ‘அனைவருக்காகவும்’ காக்கிறது.
- source_word: ἡ πίστις ὑμῶν
  choice: உங்கள் விசுவாசம்
  rationale: πίστις என்பதற்கான வழக்கமான வேதாகமத் தமிழ்ச் சொல்லைத் தேர்ந்தெடுக்கிறது; நம்பிக்கை, உண்மைப்பற்று ஆகிய சாத்தியமான நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: καταγγέλλεται
  choice: பறைசாற்றப்பட்டு வருகிறது
  rationale: நிகழ்காலச் செயலப்பாட்டு வடிவத்தின் தொடர்ந்து நடைபெறும் பொது அறிவிப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: உலகம் முழுவதும்
  rationale: விரிவான சொல்லாட்சிசார் பரப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: διὰ Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்துவாகிய இயேசு
  rationale: Χριστός என்பதை வெறும் மரபுவழிப் பெயராக அல்லாமல் பட்டமாக உணர்த்துகிறது; தமிழில் இயல்பான இலக்கண அமைப்புக்காக ‘மேசியாவாகிய’ பயன்படுத்தப்பட்டுள்ளது. மரபான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἡ πίστις ὑμῶν என்பதில் πίστις என்ற சொல்லின் பொருள்
  choice: உங்கள் விசுவாசம்
  alternative: உங்கள் உண்மைப்பற்று; உங்கள் நம்பிக்கை
  rationale: இச்சூழலில் ரோம விசுவாசிகளின் பரவலாக அறியப்பட்ட நம்பிக்கையைக் குறிக்க ‘விசுவாசம்’ மிகப் பொருத்தமானது; எனினும் மூலச்சொல்லின் பிற உண்மையான நுணுக்கங்கள் தீர்மானித்து நீக்கப்படாமல் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பறைசாற்றப்பட்டு வருகிறது’ என்பது பொது அறிவிப்பின் வலிமையையும் தொடர்ச்சியையும் காக்கிறது; ‘உலகம் முழுவதும்’ என்பது மூலத்தின் விரிவான சொல்லாட்சியை இயல்பாக வெளிப்படுத்துகிறது.
