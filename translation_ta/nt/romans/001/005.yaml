  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: ta
  text: அவர் மூலமாக, அவருடைய பெயரின் பொருட்டு எல்லா மக்களினங்களிடையிலும்[b] விசுவாசத்தின் கீழ்ப்படிதலுக்காக[a] கிருபையையும் அப்போஸ்தலப் பணியையும் பெற்றோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விசுவாசத்தினால் உண்டாகும் கீழ்ப்படிதல்” அல்லது “விசுவாசமாகிய கீழ்ப்படிதல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “யூதரல்லாத மக்கள் அனைவரிடையிலும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: அவர் மூலமாகவே
  rationale: διά + மரபுவேற்றுமை இடைமுகத்தைக் குறிக்கிறது. முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இயேசு கிறிஸ்துவைச் சார்ந்த உறவுப்பெயரின் தொடர்பைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐλάβομεν
  choice: நாம் ... பெற்றோம்
  rationale: மூலத்தில் உள்ள முதல் நபர் பன்மையை அப்படியே வைத்திருக்கிறது; இது பவுலை மட்டும் குறிக்கும் பன்மையா அல்லது அவருடன் பிறரையும் உள்ளடக்குகிறதா என்பதைத் தீர்மானிக்கவில்லை.
- source_word: χάριν καὶ ἀποστολὴν
  choice: கிருபையையும் அப்போஸ்தலப் பணியையும்
  rationale: καί இணைக்கும் இரண்டு தனித்த பெயர்ச்சொற்களையும் காக்கிறது. ‘அப்போஸ்தலப் பணி’ என்பது பதவியை மட்டுமல்ல, அனுப்பப்பட்ட ஊழியப் பொறுப்பையும் இயல்பான நவீன தமிழில் உணர்த்துகிறது.
- source_word: εἰς ὑπακοὴν πίστεως
  choice: விசுவாசத்தின் கீழ்ப்படிதலுக்கு வரும்படியாக
  rationale: εἰς குறிக்கும் நோக்கத்தைத் தெளிவாக்குகிறது; ‘விசுவாசத்தின் கீழ்ப்படிதல்’ என்ற இறுக்கமான மரபுத்தொடர், விசுவாசத்திலிருந்து வரும் கீழ்ப்படிதலா அல்லது விசுவாசமாகிய கீழ்ப்படிதலா என்ற மூலத்தின் பொருள் நெகிழ்வைக் காக்கிறது.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: எல்லா நாடுகளிலும் உள்ள மக்கள்
  rationale: ἔθνη என்பதன் இன-மக்கள் சார்ந்த பொருளையும் உலகளாவிய பரப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது; ‘யூதரல்லாதவர்கள்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: அவருடைய பெயரின் பொருட்டு
  rationale: ὑπέρ குறிக்கும் நோக்கம்/நலன் மற்றும் ‘பெயர்’ என்பதிலுள்ள கௌரவம், புகழ் ஆகிய வேதாகமச் செறிவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ὑπακοὴν πίστεως என்பதன் உறவு
  choice: விசுவாசத்தின் கீழ்ப்படிதல்
  alternative: விசுவாசத்தினால் உண்டாகும் கீழ்ப்படிதல்; விசுவாசமாகிய கீழ்ப்படிதல்
  rationale: மரபுத்தொடர் இலக்கண ரீதியாகச் சுருக்கமானதும் ஒன்றுக்கு மேற்பட்ட உறவுகளை அனுமதிப்பதுமாக உள்ளது. முதன்மை உரை எந்த ஓர் விளக்கத்தையும் கட்டாயப்படுத்தாமல் அந்த இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் தர்க்க உறவைத் தெளிவாக்க இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; ‘கிருபை’, ‘விசுவாசம்’, ‘அப்போஸ்தலர்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பாதுகாக்கப்பட்டுள்ளன.
