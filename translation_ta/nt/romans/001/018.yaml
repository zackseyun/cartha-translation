source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: ta
  text: ஏனெனில், உண்மையை அநீதியால் அடக்கிவைக்கிற மனிதர்களின் எல்லா இறைப்பற்றின்மைக்கும் அநீதிக்கும் எதிராகக் கடவுளின் கோபம் வானத்திலிருந்து வெளிப்படுத்தப்படுகிறது[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெளிப்படுத்தப்பட்டு வருகிறது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அநீதியில் உண்மையை அடக்கிவைக்கிற” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அடக்கிவைக்கிற” என்பதற்கு இச்சூழலில் “ஒடுக்குகிற” அல்லது “தடுத்துவைக்கிற” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: வெளிப்படுத்தப்பட்டு வருகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வினையின் தொடரும் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘வெளிப்படுத்தப்படுகிறது’ என்பதும் சாத்தியம்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கம் அல்லது அடிப்படையை அறிமுகப்படுத்தும் பவுலின் தர்க்கத் தொடர்பைப் பேணுகிறது.
- source_word: ὀργὴ θεοῦ
  choice: கடவுளின் கோபம்
  rationale: இறைவனுடைய தனிப்பட்ட, நீதித்தீர்ப்பு சார்ந்த எதிர்வினையை மென்மைப்படுத்தாமல் நேரடியாகக் காட்டுகிறது.
- source_word: ἀπ’ οὐρανοῦ
  choice: பரலோகத்திலிருந்து
  rationale: மூலம் அல்லது தோற்றத்தைச் சுட்டும் முன்னிடைச்சொல் தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: πᾶσαν ἀσέβειαν
  choice: எல்லா இறைப்பற்றின்மை
  rationale: ἀσέβεια என்பதன் கடவுளை நோக்கிய மரியாதையின்மை மற்றும் பக்தியின்மை சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀδικίαν
  choice: அநீதி
  rationale: ἀδικία என்பதன் ஒழுக்க மற்றும் உறவுசார் பரப்பைத் தாங்கும் வழக்கமான தமிழ் இணைச்சொல்; வெறும் சமூக அநீதியாக மட்டும் சுருக்கவில்லை.
- source_word: ἀνθρώπων
  choice: மனிதர்கள்
  rationale: ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கும் கிரேக்கச் சொல்லின் பொருளைப் பேணுகிறது.
- source_word: τῶν ... κατεχόντων
  choice: அடக்கிவைக்கிற
  rationale: இச்சூழலில் உண்மையைத் தடுத்து, அதன் செயல்பாட்டை ஒடுக்குதல் என்ற κατέχω என்பதன் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὴν ἀλήθειαν
  choice: உண்மையை
  rationale: கிரேக்கச் சொல்லின் நேரடியான பொருளை தேவையின்றிக் குறுக்கவோ விரிவாக்கவோ செய்யவில்லை.
- source_word: ἐν ἀδικίᾳ
  choice: அநீதியால்
  rationale: அநீதி உண்மையை அடக்குவதற்கான வழிமுறை அல்லது முறைமையாக இருப்பதைத் தெளிவாகக் காட்டுகிறது; ‘அநீதியில்’ என்ற பரப்பைக் குறிக்கும் வாசிப்பும் சாத்தியம்.
theological_decisions:
- issue: ὀργὴ θεοῦ என்பது தனிப்பட்ட இறை நீதிக்கோபமா அல்லது ஆளற்ற ஒழுக்க விளைவா?
  choice: கடவுளின் சொந்த நீதித்தீர்ப்பு சார்ந்த கோபம்
  alternative: தவறான நடத்தையால் தானாக உருவாகும் ஆளற்ற விளைவு
  rationale: இறைவனைக் குறிக்கும் உடைமைத் தொடர்பும் பவுலின் வாதமும் தனிப்பட்ட இறை எதிர்வினையை ஆதரிக்கின்றன; மொழிபெயர்ப்பு அதை மென்மைப்படுத்தவில்லை.
- issue: ἐν ἀδικίᾳ என்பதன் தொடர்பு
  choice: ‘அநீதியால்’—உண்மையை அடக்குவதற்கான வழிமுறை அல்லது முறை
  alternative: ‘அநீதியில்’—அடக்குதல் நிகழும் ஒழுக்கச் சூழல் அல்லது நிலை
  rationale: ἐν வழிமுறையையும் சூழலையும் குறிக்கக்கூடும். முதன்மை உரை இயல்பான வழிமுறைப் பொருளைத் தருகிறது; அடிக்குறிப்பு உண்மையான இலக்கணத் தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகம உரைக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இறைப்பற்றின்மை’ என்பது ἀσέβεια-வின் கடவுளை நோக்கிய பரிமாணத்தையும், ‘அநீதி’ என்பது ἀδικία-வின் பரந்த ஒழுக்கப் பரிமாணத்தையும் வேறுபடுத்துகிறது. கிரேக்கத்தில் ἀδικία இருமுறை வருவதால் தமிழிலும் ‘அநீதி’ இருமுறை விடப்பட்டுள்ளது. ‘மனிதர்களுடைய’ என்பது ἀνθρώπων-ஐ வெளிப்படையாக மொழிபெயர்த்து பாலினப் பொதுமையைப் பேணுகிறது.
