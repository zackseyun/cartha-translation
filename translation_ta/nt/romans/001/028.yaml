source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: ta
  text: அவர்கள் கடவுளைத் தங்கள் அறிவில் வைத்திருக்கத் தகுந்தது என்று கருதாததுபோலவே[a], கடவுள் அவர்களைத் தகுதியற்ற மனநிலைக்கு ஒப்புக்கொடுத்தார்; அவர்கள் செய்யத் தகாதவற்றைச் செய்யும்படி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளை ஏற்றுக்கொள்ளத் தகுந்தது என்று அவர்கள் கருதாததுபோலவே.”
    reason: lexical_alternative
  - marker: b
    text: “தகுந்தது என்று கருதவில்லை” என்பதும் “தகுதியற்ற மனநிலை” என்பதும் மூலமொழியில் தொடர்புடைய சொற்களால் கூறப்படுகின்றன. “தகுதியற்ற மனநிலை” என்பதை “சீர்கெட்ட மனநிலை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: அவர்கள் … கருதாதபடியே
  rationale: καθὼς இங்கு ஒப்புமையையும் அடுத்துவரும் தண்டனைக்கான காரணத் தொடர்பையும் உள்ளடக்குகிறது. ‘…படியே’ என்பது அந்த இரு நுணுக்கங்களையும் திறந்தவையாக வைத்திருக்கிறது.
- source_word: οὐκ ἐδοκίμασαν
  choice: தகுந்தது என்று அவர்கள் கருதவில்லை
  rationale: δοκιμάζω என்பதில் ஆராய்ந்து ஏற்றுக்கொள்ளுதல் அல்லது தகுந்ததாக மதித்தல் என்ற பொருள் உள்ளது. இந்தத் தேர்வு ἀδόκιμον என்பதுடன் பவுல் அமைத்துள்ள சொல் தொடர்பையும் தமிழில் ஓரளவு வெளிப்படுத்துகிறது.
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: கடவுளைத் தங்கள் அறிவில் வைத்திருக்க
  rationale: கிரேக்கச் சொற்றொடரின் ‘அறிவில் கொண்டிருத்தல்’ என்ற வடிவத்தையும், கடவுளைத் தொடர்ந்து அறிந்து ஏற்றுக்கொள்ளுதல் என்ற உட்பொருளையும் இயன்றவரை பாதுகாக்கிறது.
- source_word: παρέδωκεν
  choice: ஒப்புக்கொடுத்தார்
  rationale: சூழலில் மீண்டும் வரும் நீதித்தீர்ப்புச் சார்ந்த ‘கைவிட்டு அதன் விளைவுகளுக்கு ஒப்புக்கொடுத்தல்’ என்ற பொருளை இது தெரிவிக்கிறது.
- source_word: ἀδόκιμον νοῦν
  choice: தகுதியற்ற மனம்
  rationale: ἀδόκιμος என்பது சோதனையில் ஏற்றுக்கொள்ளப்படாதது அல்லது தகுதியற்றது என்பதைக் குறிக்கிறது. ‘சீர்கெட்ட’ அல்லது ‘முற்றிலும் ஒழுக்கங்கெட்ட’ போன்ற அதிக விளக்கமளிக்கும் சொற்களைத் தவிர்த்து, ἐδοκίμασαν உடனான சொல் தொடர்பையும் இது காக்கிறது.
- source_word: ποιεῖν τὰ μὴ καθήκοντα
  choice: செய்யத் தகாதவற்றைச் செய்யும்படி
  rationale: கிரேக்க இறந்திலா வினையின் நோக்கம் அல்லது விளைவு சார்ந்த திறந்த உறவை வைத்துக்கொண்டு, καθήκοντα என்பதன் ‘தகுந்தவை, முறையானவை’ என்ற ஒழுக்கப் பொருளையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ἀδόκιμον νοῦν என்பதை வலுவான பிற்கால இறையியல் சொல்லால் மொழிபெயர்ப்பதா
  choice: தகுதியற்ற மனம்
  alternative: சீர்கெட்ட மனம்; ஒழுக்கங்கெட்ட மனம்
  rationale: இவ்வசனம் கடவுளின் நீதித்தீர்ப்பாகிய ஒப்புக்கொடுத்தலை விவரிக்கிறது. ஆயினும் ἀδόκιμος என்ற அடைமொழிக்குள் தேவையற்ற முறையில் பிற்காலக் கோட்பாட்டுச் சொல்லைச் சேர்க்காமல், அதன் அடிப்படைப் பொருளையும் பவுலின் சொல் தொடர்பையும் காப்பது பொருத்தமானது.
- issue: παρέδωκεν உடன் வரும் ποιεῖν என்பது நோக்கமா விளைவா
  choice: செய்யும்படி
  alternative: அதனால் அவர்கள் … செய்தார்கள்
  rationale: கிரேக்க இறந்திலா வினை நோக்கத்தையும் விளைவையும் இரண்டையும் சுட்டக்கூடும். ‘செய்யும்படி’ மூலத்தின் இலக்கண வடிவத்துக்கு நெருக்கமாக இருந்து அந்த இறையியல் பதற்றத்தைத் தீர்மானமாக முடித்துவிடாமல் வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அறிவில் வைத்திருக்க’ என்பது சற்றே நேரடியான வடிவமாக இருந்தாலும் மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது. ‘தகுந்தது—தகுதியற்ற—தகாதவை’ என்ற தொடர் பவுலின் மதிப்பீடு/தகுதியின்மை சார்ந்த சொல் விளையாட்டை தமிழில் கேட்கச் செய்கிறது.
