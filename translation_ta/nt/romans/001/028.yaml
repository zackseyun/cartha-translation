revisions:
- from: கடவுளைத் தங்கள் அறிவில் வைத்திருக்கத் தகுந்தது என்று அவர்கள் கருதாதபடியே[a], செய்யத் தகாதவற்றைச் செய்யும்படி கடவுள் அவர்களைத் தகுதியற்ற மனதிடம் ஒப்புக்கொடுத்தார்[b].
  to: அவர்கள் கடவுளைத் தங்கள் அறிவில் வைத்திருக்கத் தகுந்தது என்று கருதாததுபோலவே[a], கடவுள் அவர்களைத் தகுதியற்ற மனநிலைக்கு ஒப்புக்கொடுத்தார்; அவர்கள் செய்யத் தகாதவற்றைச் செய்யும்படி[b].
