    text: ‘பரிசுத்தத்தின் ஆவியின்படி’ என்பதற்கு மாற்றாக, ‘பரிசுத்த ஆவியின்படி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
