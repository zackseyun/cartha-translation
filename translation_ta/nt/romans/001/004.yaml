translation:
  language: ta
  text: இறந்தோரிலிருந்து உயிர்த்தெழுதலினால், பரிசுத்தத்தின் ஆவியின்படி, வல்லமையுடன் கடவுளின் மகனாக நியமிக்கப்பட்டவருமான நம் ஆண்டவராகிய இயேசு மெசியா[a][b].
