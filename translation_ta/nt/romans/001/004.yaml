- from: இறந்தோரிலிருந்து உயிர்த்தெழுந்ததின் மூலம், பரிசுத்தத்தின் ஆவியின்படி, வல்லமையுடன் கடவுளின் மகன் என்று நியமிக்கப்பட்டவருமான நம் ஆண்டவராகிய இயேசு மெசியா[a][b].
  to: இறந்தோரிலிருந்து உயிர்த்தெழுதலினால், பரிசுத்தத்தின் ஆவியின்படி, வல்லமையுடன் கடவுளின் மகனாக நியமிக்கப்பட்டவருமான நம் ஆண்டவராகிய இயேசு மெசியா[a][b].
