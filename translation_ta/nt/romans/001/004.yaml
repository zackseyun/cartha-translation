lexical_decisions:
- source_word: ὁρισθέντος
  choice: நியமிக்கப்பட்டவருமான
  rationale: ὁρίζω என்பதன் ‘நியமி/குறித்துவை/தீர்மானி’ என்ற வலிமையைத் தக்கவைக்கிறது. உயிர்த்தெழுதலில்தான் அவர் முதன்முறையாக மகனானார் என்று உரை தானாகத் தீர்மானிக்காமல், ‘வல்லமையுடன்’ என்பதோடு இணைந்த புதிய நிலை அல்லது வெளிப்பாட்டைச் சுட்ட இடமளிக்கிறது; முக்கிய மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: υἱοῦ θεοῦ
  choice: கடவுளின் மகன்
  rationale: கிறிஸ்துவியல் பட்டத்தையும் கிரேக்க மரபுத்தொடரின் நேரடியான பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν δυνάμει
  choice: வல்லமையுடன்
  rationale: தமிழில் இயல்பாக இருந்து, மகனாகிய அவரது நிலை வல்லமையில் வெளிப்படுவதைச் சுட்டுகிறது; இதை வெறும் ‘வல்லமையாக அறிவிக்கப்பட்டார்’ என்ற வினையடைப் பொருளுக்குள் மட்டுப்படுத்தாது.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: பரிசுத்தத்தின் ஆவியின்படி
  rationale: அரிதான கிரேக்க சொற்றொடரை வெளிப்படையாகக் காத்து, இது பரிசுத்த ஆவியாரைக் குறிப்பதா அல்லது வசனம் 3-இன் ‘மாம்சத்தின்படி’ என்பதற்கு எதிரான பரிசுத்த ஆவிக்குரிய தளத்தைக் குறிப்பதா என்பதைத் தீர்த்துவிடாமல் விடுகிறது.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: இறந்தோரிலிருந்து உயிர்த்தெழுந்ததின் மூலம்
  rationale: ἐξ என்பதன் அடிப்படை/வாய்ப்பு சார்ந்த பொருளையும், νεκρῶν என்பதன் பன்மைத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் அதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பொருளைத் தக்கவைக்கிறது; ‘இயேசு மெசியா’ என்பது தமிழில் பெயர்-பட்டத் தொடராக இயல்பாக அமைகிறது.
- source_word: κυρίου ἡμῶν
  choice: நம் ஆண்டவராகிய
  rationale: κύριος என்பதன் கிறிஸ்துவியல் மற்றும் உடன்படிக்கை சார்ந்த ஒலிப்புகளை ‘ஆண்டவர்’ தக்கவைக்கிறது; தமிழ்ச் சொற்றொடரில் இயல்பாக இயேசு மெசியாவுடன் இணைகிறது.
theological_decisions:
- issue: ὁρισθέντος என்பது உயிர்த்தெழுதலின்போதுதான் இயேசு கடவுளின் மகனானார் என்று பொருள்படுகிறதா?
  choice: ‘வல்லமையுடன் கடவுளின் மகன் என்று நியமிக்கப்பட்டவர்’ என்று மொழிபெயர்த்து, மகத்துவமான புதிய வெளிப்பாடு அல்லது நிலையைச் சுட்டும் வாய்ப்பைத் திறந்துவைக்கிறது.
  alternative: ‘வல்லமையுள்ள கடவுளின் மகன் என்று அறிவிக்கப்பட்டவர்’ அல்லது ‘கடவுளின் வல்லமையுள்ள மகனாகக் குறிக்கப்பட்டவர்’.
  rationale: கிரேக்க உரை ‘வல்லமையுடன்’ என்பதன் தொடர்பையும் நியமித்தல்/அறிவித்தல் என்ற நுணுக்கத்தையும் முழுமையாகத் தீர்ப்பதில்லை. ஆகவே அவர் உயிர்த்தெழுதலில்தான் முதன்முறையாக மகனானார் என்றும், இது வெறும் அறிவிப்பு மட்டுமே என்றும் மொழிபெயர்ப்பு வலியுறுத்தவில்லை.
- issue: πνεῦμα ἁγιωσύνης என்பது குறிப்பாகப் பரிசுத்த ஆவியாரைக் குறிக்கிறதா?
  choice: ‘பரிசுத்தத்தின் ஆவி’ என்ற அசாதாரண அமைப்பை முதன்மை உரையில் காக்கிறது.
  alternative: ‘பரிசுத்த ஆவியின்படி’.
  rationale: வசனம் 3-இன் ‘மாம்சத்தின்படி’ என்பதுடன் உள்ள இணை அமைப்பும், இச்சொற்றொடரின் அசாதாரண வடிவமும் கருத்தில் கொண்டு, குறிப்பிட்ட பொருளைத் தேவையற்ற உறுதியுடன் நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. இந்த வசனம் முந்தைய வசனத்திலிருந்து தொடரும் சார்புத்தொடர் என்பதால், ‘வருமான’ என்ற இணைப்பால் அதன் இலக்கணத் தொடர்ச்சி காக்கப்பட்டுள்ளது. ‘இறந்தோர்’, ‘உயிர்த்தெழுதல்’, ‘ஆண்டவர்’ போன்ற பரவலாக அறியப்படும் வேதாகமச் சொற்கள் வாசிப்புத் தெளிவுக்காகப் பேணப்பட்டுள்ளன.
