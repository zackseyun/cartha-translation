  naturalness: ‘அவற்றைச் செய்கிறவர்களையும் அங்கீகரிக்கிறார்கள்’ என்பது தமிழில் நபர்களை அதிகாரபூர்வமாக அங்கீகரிப்பது அல்லது ஏற்றுக்கொள்வது என்ற பொருளையும் தரக்கூடும். ‘அவற்றைச் செய்கிறவர்களுக்கும் ஒப்புதல் அளிக்கிறார்கள்’ என்பது இயல்பாகவும் பொருளில் துல்லியமாகவும் உள்ளது.
