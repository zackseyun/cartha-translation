source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: ta
  text: அப்படிப்பட்டவர்கள், இவற்றைச் செய்கிறவர்கள் மரணத்துக்குத் தகுதியானவர்கள் என்ற கடவுளின் நீதியான தீர்ப்பை[a] அறிந்திருந்தும், அவற்றைச் செய்வதோடு மட்டுமல்லாமல், அவற்றைச் செய்கிறவர்களுக்கும் ஒப்புதல் அளிக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நியமம்,” “கட்டளை,” அல்லது “நியாயத்தீர்ப்பு.”
    reason: δικαίωμα என்பதன் சட்ட, ஒழுக்க, நீதித்துறை சார்ந்த பொருள் பரப்பைச் சுட்டும் சொல் மாற்றுகள்.
lexical_decisions:
- source_word: οἵτινες
  choice: அப்படிப்பட்டவர்கள்
  rationale: முந்தைய சூழலில் விவரிக்கப்பட்ட மக்களை மீண்டும் சுட்டும் தொடர்புச் சொல்லின் விளக்கத்தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δικαίωμα
  choice: நீதியான தீர்ப்பு
  rationale: அடுத்து வரும் மரணத்துக்குத் தகுதியானவர்கள் என்ற கூற்றுக்கு ஏற்றபடி, கடவுளின் நீதி சார்ந்த சட்ட அல்லது நீதித்துறைத் தீர்ப்பு என்ற பொருளைப் பேணுகிறது.
- source_word: ἐπιγνόντες
  choice: அறிந்திருந்தும்
  rationale: அவர்கள் அறிந்த நிலையிலும் அதற்கு முரணாகச் செயல்படுகிறார்கள் என்ற concessive தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: இவற்றைச் செய்கிறவர்கள்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட செயல்களைச் சுட்டுவதோடு, தொடர்ச்சியான நடைமுறையையும் தமிழ் நிகழ்கால வடிவம் வெளிப்படுத்துகிறது.
- source_word: ἄξιοι θανάτου
  choice: மரணத்துக்குத் தகுதியானவர்கள்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான நீதித்துறை வலிமையைத் தக்கவைத்து, மரணத்தின் தன்மையை வசனம் கூறுவதைவிடக் குறுக்கவில்லை.
- source_word: ποιοῦσιν
  choice: செய்வதோடு
  rationale: கிரேக்க வினையின் எளிய பொருளை இயல்பாக வெளிப்படுத்தி, தொடர்ந்து வரும் எதிர்மறை இணைப்பைக் கட்டமைக்கிறது.
- source_word: συνευδοκοῦσιν
  choice: அங்கீகரிக்கிறார்கள்
  rationale: வெறும் உடன்பாட்டைக் காட்டிலும், பிறருடைய செயல்களுக்கு ஒப்புதலும் ஆதரவும் அளிக்கும் வலிமையான பொருளை வெளிப்படுத்துகிறது.
- source_word: τοῖς πράσσουσιν
  choice: அவற்றைச் செய்கிறவர்களையும்
  rationale: முன்னைய செயற்பாட்டு சொற்றொடருடனான இணைப்பையும், செயலை வழக்கமாக மேற்கொள்பவர்களைக் குறிக்கும் தன்மையையும் பேணுகிறது.
theological_decisions:
- issue: “மரணத்துக்குத் தகுதியானவர்கள்” என்பதன் பரப்பு
  choice: இது கடவுளின் நீதித்துறைத் தீர்ப்பாக மொழிபெயர்க்கப்படுகிறது; மரணம் எந்த வகையைச் சேர்ந்தது என்று மேலதிகமாக வரையறுக்கப்படவில்லை.
  alternative: இதை முதன்மையாக உலகியல் மரண தண்டனை என்றோ, குறிப்பாக இறுதிக்கால மரணம் என்றோ விளக்குதல்.
  rationale: வசனம் மரணத்தின் முழுப் பரப்பைத் தெளிவுபடுத்தாததால், அதன் நீதித்துறை மற்றும் இறையியல் வலிமையைப் பேணிக்கொண்டு தெளிவற்ற தன்மையைத் தீர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. நீளமான கிரேக்க வாக்கியத்தின் தர்க்கத் தொடர்பும் ‘மட்டுமல்லாமல்’ என்ற இணை அமைப்பும் பேணப்பட்டுள்ளன.
