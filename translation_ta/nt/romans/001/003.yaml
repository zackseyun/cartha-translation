lexical_decisions:
- source_word: περὶ
  choice: பற்றியது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நற்செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பாகவும் பவுலின் தொடர்வாக்கிய அமைப்புக்கு ஏற்றவாறும் உள்ளது.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: அவருடைய மகனை
  rationale: குறிப்பிடப்படுவது கடவுளுடைய மகன் என்பதை நேரடியாகத் தக்கவைக்கிறது; தமிழில் தேவையற்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: τοῦ γενομένου
  choice: பிறந்தவர்
  rationale: இச்சூழலில் γίνομαι தாவீதின் மனித வழிமரபில் தோன்றிய பிறப்பை அல்லது வருகையைச் சுட்டுகிறது. ‘பிறந்தவர்’ என்பது இயல்பான தமிழில் அதன் தோற்றம் சார்ந்த வினை வலிமையைத் தக்கவைக்கிறது.
- source_word: ἐκ σπέρματος Δαυὶδ
  choice: தாவீதின் சந்ததியில்
  rationale: σπέρμα என்பதன் நேர்ப்பொருள் ‘வித்து’; இங்கு அது வழித்தோன்றல் அல்லது வம்சத்தைச் சுட்டுவதால் ‘சந்ததி’ தெளிவான நவீனத் தமிழ். நேரடி உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατὰ σάρκα
  choice: மாம்சத்தின்படி
  rationale: சர்ச்சைக்குரிய, இறையியல் எடையுள்ள σάρξ என்ற சொல்லை விளக்கமாக மாற்றாமல் நேரடியாகத் தக்கவைக்கிறது; இங்கு அது மனித வழிமரபைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: கடவுளுடைய மகனுக்கும் தாவீதின் வழிமரபுக்கும் உள்ள தொடர்பை எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘அவருடைய மகன்’ என்பதையும், அவர் ‘தாவீதின் சந்ததியில், மாம்சத்தின்படி பிறந்தவர்’ என்பதையும் ஒன்றாக நேரடியாகத் தக்கவைத்தல்
  alternative: ‘மனித இயல்பைப் பொறுத்தவரை’ என்று விளக்கமாக மொழிபெயர்த்தல் அல்லது தாவீதின் வம்சாவளியை மட்டும் கூறும் வகையில் வினையைச் சமப்படுத்துதல்
  rationale: வசனம் தெய்வீக மகத்துவத்தையும் உண்மையான மனித, தாவீதிய வழிமரபையும் ஒன்றாக வைத்திருக்கிறது; அவற்றின் மெய்யியல் தொடர்பை விளக்குவதில்லை. ஆகவே பிற்கால கோட்பாட்டுச் சுருக்கத்தை உரைக்குள் புகுத்தாமல் அந்த இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமான தொடரமைப்பு வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், இது முந்தைய வசனத்துடன் தொடரும் கருத்து என்பது ‘பற்றியது’ என்பதால் தக்கவைக்கப்படுகிறது. ‘மாம்சத்தின்படி’ என்ற இறையியல் எடையுள்ள சொற்றொடர் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
