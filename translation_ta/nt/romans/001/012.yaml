  rationale: இங்கு தேவனில் வைத்துள்ள நம்பிக்கையான விசுவாசமே கருத்து; ‘உண்மைத்தன்மை’ என்ற பொருள் சூழலுக்குப் பொருந்தாது.
- source_word: ὑμῶν τε καὶ ἐμοῦ
