translation:
  language: ta
  text: அதாவது, நாம் பகிர்ந்துகொள்ளும்—உங்களுடையதும் என்னுடையதுமான—விசுவாசத்தின் மூலம், உங்களிடையே உங்களோடு சேர்ந்து நான் ஊக்கமடைவதற்காகவே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதாவது, நாம் பகிர்ந்துகொள்ளும்—உங்களுடையதும் என்னுடையதுமான—விசுவாசத்தின் மூலம், உங்களிடையே நாம் ஒன்றாக ஊக்கமடைவதற்காகவே.” கிரேக்க வினைமுற்றில்லா வடிவத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. சூழல் பவுலின் அனுபவத்தை முன்னிறுத்துகிறது; அதேவேளையில் வினைச்சொல் கூட்டு ஊக்கத்தை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: அதாவது
  rationale: முந்தைய கூற்றை விளக்கித் தெளிவுபடுத்தும் தொடராக இருப்பதால், நவீனத் தமிழில் இயல்பான ‘அதாவது’ பயன்படுத்தப்பட்டது.
- source_word: συμπαρακληθῆναι
  choice: நானும் உங்களோடு சேர்ந்து ஊக்கமடைவதற்காகவே
  rationale: συν-/συμ- முன்னொட்டு கூட்டு அல்லது பரஸ்பர ஊக்கத்தைச் சுட்டுகிறது. சூழலில் பவுலின் முதலாம் நபர் நோக்கைத் தக்கவைத்தபடியே, இது ஒருதலைப்பட்சமான ஊக்கமல்ல என்பதை ‘உங்களோடு சேர்ந்து’ வெளிப்படுத்துகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: இங்கு விசுவாசிகளின் நடுவில் நிகழும் சமூகச் சூழலைக் குறிக்கிறது; ‘உங்களுக்குள்’ என்பதால் ஏற்படக்கூடிய உள்நிலைப் பொருளைத் தவிர்க்கிறது.
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: உங்களுடையதும் என்னுடையதுமான விசுவாசத்தின் மூலம்
  rationale: διά கருவி அல்லது வழிமுறையைக் குறிக்கிறது. ἐν ἀλλήλοις என்பதன் பரஸ்பரத் தன்மை, முடிவிலுள்ள ‘உங்களுடையதும் என்னுடையதுமான’ என்பதாலும் கூட்டு ஊக்கத்தைச் சொல்லும் தொடராலும் இயல்பான தமிழில் வெளிப்படுகிறது.
- source_word: πίστεως
