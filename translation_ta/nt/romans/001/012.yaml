theological_decisions:
- issue: இது பவுல் அவர்களை மட்டும் ஊக்குவிப்பதைக் குறிக்கிறதா, அல்லது இருதரப்பினரும் சேர்ந்து ஊக்கமடைவதைக் குறிக்கிறதா?
  choice: பவுலும் ரோம விசுவாசிகளும் சேர்ந்து பெறும் பரஸ்பர ஊக்கம்
  alternative: பவுல் அவர்களை முதன்மையாக வலுப்படுத்துவது
  rationale: συμπαρακληθῆναι என்ற கூட்டுச் செயற்பாடும், ‘உங்களுடையதும் என்னுடையதுமான’ என்ற இறுதித் தொடரும் பரஸ்பரத் தன்மையை வலியுறுத்துகின்றன. ஆகவே ஒருதலைப்பட்ச ஊழியமாக மொழிபெயர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘நானும் உங்களோடு சேர்ந்து’ என்பது பவுலின் சூழல்சார்ந்த முதலாம் நபர் நோக்கையும் கிரேக்க வினையின் கூட்டு/பரஸ்பர வலியுறுத்தலையும் ஒருங்கே காக்கிறது.
