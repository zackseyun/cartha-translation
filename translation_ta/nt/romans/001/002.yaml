  yaml_path: translation/nt/romans/001/002.yaml
  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: ta
  text: அதை அவர் தமது தீர்க்கதரிசிகள் வழியாகப் பரிசுத்த வேதங்களில்[a] முன்னரே வாக்களித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்த எழுத்துகளில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: அதை
  rationale: இது ரோமர் 1:1-இல் கூறப்பட்ட ‘நற்செய்தி’யைச் சுட்டும் ஒருமை உறவுப்பெயர்; முந்தைய வசனத்துடனான இலக்கணத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: προεπηγγείλατο
  choice: முன்னரே வாக்களித்தார்
  rationale: வினைச்சொல்லிலுள்ள முந்திய காலக் குறிப்பையும் வாக்குறுதியின் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: தமது தீர்க்கதரிசிகள் வழியாக
  rationale: διά உடன் வரும் வழிமுறை அல்லது முகவர் பொருளை ‘வழியாக’ இயல்பாகத் தருகிறது; ‘தமது’ என்பது தீர்க்கதரிசிகள் கடவுளுக்குரியவர்கள் என்பதைக் காட்டுகிறது.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: பரிசுத்த வேதங்களில்
  rationale: பவுலின் சூழலில் γραφαί அங்கீகரிக்கப்பட்ட வேத எழுத்துகளைக் குறிக்கிறது; ‘பரிசுத்த வேதங்கள்’ அந்தப் பொருளைச் சுருக்கமாகவும் மரியாதையான நடையிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: γραφαῖς ἁγίαις என்பது பொதுவாகப் பரிசுத்தமான எழுத்துகளையா, அங்கீகரிக்கப்பட்ட வேதங்களையா குறிக்கிறது?
  choice: பரிசுத்த வேதங்களில்
  alternative: பரிசுத்த எழுத்துகளில்
  rationale: பவுலின் பயன்பாட்டிலும் இச்சூழலிலும் இது பொதுவான மத எழுத்துகளைவிட வேத எழுத்துகளைக் குறிப்பது அதிகம் சாத்தியம். எனினும், கிரேக்கச் சொல்லின் சொற்பொருளை வெளிப்படுத்தும் மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. முந்தைய வசனத்துடனான உறவுப்பெயர் தொடர்பை ‘அதை’ காக்கிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்பொருள் சேர்க்கப்படவில்லை.
