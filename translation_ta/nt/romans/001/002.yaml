  naturalness: வாக்கியம் நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் இயல்பாகவும் உள்ளது. சொல் வரிசை வலியுறுத்தலையும் முந்தைய வசனத் தொடர்பையும் சீராகக் காக்கிறது.
