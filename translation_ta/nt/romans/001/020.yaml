id: ROM.1.20
reference: Romans 1:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: ta
  text: ஏனெனில், கண்ணுக்குப் புலப்படாத அவருடைய தன்மைகள்[a]—அதாவது, அவருடைய என்றுமுள்ள வல்லமையும் தெய்வீகத் தன்மையும்[b]—உலகம் படைக்கப்பட்டதிலிருந்து, படைக்கப்பட்டவற்றின் மூலம் புரிந்துகொள்ளப்பட்டு, தெளிவாகக் காணப்படுகின்றன. இதனால் அவர்கள் எந்தச் சாக்கும் சொல்ல வழியில்லாதவர்களாக இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண்ணுக்குப் புலப்படாத அவரைப் பற்றியவை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இறைத்தன்மை.” இங்குள்ள கிரேக்கச் சொல் θειότης; இது இன்னும் வலுவான θεότης என்ற சொல் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: கண்ணுக்குப் புலப்படாத அவருடைய தன்மைகள்
  rationale: இச்சொற்றொடர் கடவுளைப் பற்றிக் காண முடியாதவற்றை விரிவாகக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘தன்மைகள்’ என்று வெளிப்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பில் சொல்லமைப்புக்கு நெருக்கமான மாற்று தரப்பட்டுள்ளது.
- source_word: ἀπὸ κτίσεως κόσμου
  choice: உலகம் படைக்கப்பட்டதிலிருந்து
  rationale: ἀπό என்பதன் காலத் தொடக்கப் பொருளை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τοῖς ποιήμασιν
  choice: படைக்கப்பட்டவற்றின் மூலம்
  rationale: படைப்புப் பொருட்களே புரிந்துகொள்வதற்கான கருவி அல்லது வழி என்பதை இங்குள்ள வேற்றுமை உருபின் கருவிப்பொருளோடு வெளிப்படுத்துகிறது.
- source_word: νοούμενα
  choice: புரிந்துகொள்ளப்பட்டு
  rationale: கண்ணுக்குப் புலப்படாதவை படைப்பின் வழியாக மனதால் உணரப்படுகின்றன என்ற அறிவுசார் நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: καθορᾶται
  choice: தெளிவாகக் காணப்படுகின்றன
  rationale: வினைச்சொல்லின் வலியுறுத்தும் பொருளையும் நிகழ்காலத் தொடர்ச்சியையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: அவருடைய என்றுமுள்ள வல்லமை
  rationale: ἀΐδιος என்பதன் முடிவில்லாத, நிலைத்திருக்கும் பொருளை ‘என்றுமுள்ள’ இயல்பாகத் தருகிறது; இச்சொற்றொடர் முந்திய ‘தன்மைகள்’ என்பதற்கு விளக்கமாக அமைகிறது.
- source_word: θειότης
  choice: தெய்வீகத் தன்மை
  rationale: இது தெய்வீகப் பண்பு அல்லது தன்மையைக் குறிக்கிறது; θεότης என்ற வலுவான சொல்லோடு உள்ள வேறுபாட்டை மிகைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: இதனால் அவர்கள் எந்தச் சாக்கும் சொல்ல வழியில்லாதவர்களாக இருக்கிறார்கள்
  rationale: இக்கட்டமைப்பின் விளைவுப் பொருளையும் ἀναπολόγητος என்பதன் தற்காப்பு அல்லது சாக்கு கூற இயலாத நிலையையும் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: θειότης என்பதைக் கடவுள்தன்மையை மிகைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: தெய்வீகத் தன்மை
  alternative: இறைத்தன்மை; கடவுள்தன்மை
  rationale: படைப்பின் மூலம் கடவுளைப் பற்றிய உண்மையான தெய்வீகப் பண்பு அறியப்படுகிறது என்பதை இச்சொல் உறுதிப்படுத்துகிறது. அதேவேளை, θεότης என்பதற்குரிய வலுவான மெய்யியல்சார் பொருளை இதன்மேல் சுமத்தாமல் மூலச்சொல் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: εἰς τό கட்டமைப்பின் நோக்கம் அல்லது விளைவு
  choice: 'விளைவு: ‘இதனால்’'
  alternative: 'நோக்கம்: ‘அவர்கள் சாக்குச் சொல்ல முடியாதபடி’'
  rationale: இரு நுட்பங்களும் இலக்கண ரீதியாக அண்மையில் இருந்தாலும், இச்சூழலில் படைப்பின் வழியான வெளிப்பாட்டின் விளைவு மனிதர்கள் தற்காப்புக் கூற முடியாத நிலை என்பதே இயல்பான வாசிப்பு.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கண்ணுக்குப் புலப்படாத’, ‘படைக்கப்பட்டவற்றின் மூலம்’, ‘எந்தச் சாக்கும் சொல்ல வழியில்லாதவர்கள்’ ஆகிய வடிவங்கள் கண்ணியம், தெளிவு, மூலநெருக்கம் ஆகியவற்றைச் சமநிலைப்படுத்துகின்றன. விளக்க apposition-ஐ நீண்ட கோடுகளால் பிரித்து வாசிப்பைத் தெளிவாக்கியுள்ளது.
