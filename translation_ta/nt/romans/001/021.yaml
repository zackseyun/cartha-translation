id: ROM.1.21
reference: Romans 1:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் கடவுளை அறிந்திருந்தும், அவரைக் கடவுளாக மகிமைப்படுத்தவோ அவருக்கு நன்றி செலுத்தவோ இல்லை. மாறாக, தங்கள் சிந்தனைகளில்[a] பயனற்றுப் போனார்கள்; விவேகமற்ற அவர்களுடைய இதயம்[b] இருளடைந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் காரண ஆய்வுகளில்,” “தங்கள் எண்ணங்களில்,” அல்லது “தங்கள் ஊகங்களில்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க மூலத்தில் “இதயம்” ஒருமையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: γνόντες τὸν θεὸν
  choice: அவர்கள் கடவுளை அறிந்திருந்தும்
  rationale: 'சூழலில் வினையெச்சம் விட்டுக்கொடுப்பு பொருளைக் கொண்டுள்ளது: கடவுளை அறிந்திருந்த போதிலும் அவர்கள் தகுந்த விதத்தில் நடந்துகொள்ளவில்லை.'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: அவரைக் கடவுளாக மகிமைப்படுத்தவோ இல்லை
  rationale: கடவுளுக்குரிய நிலையில் அவரை ஏற்று மகிமைப்படுத்தாததைப் பொருள் மாறாமல் எடுத்துரைக்கிறது.
- source_word: ἢ ηὐχαρίστησαν
  choice: அவருக்கு நன்றி செலுத்தவோ இல்லை
  rationale: நன்றியை வெளிப்படுத்துதல் என்ற வினைச்சொல்லின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: தங்கள் சிந்தனைகளில் பயனற்றுப் போனார்கள்
  rationale: ἐματαιώθησαν என்பதிலுள்ள பயனின்மை அல்லது வெறுமைக்குள்ளாதல் என்ற கருத்தையும், διαλογισμοί என்பதிலுள்ள உள்ளார்ந்த சிந்தனை அல்லது காரண ஆய்வு என்ற பரப்பையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐσκοτίσθη
  choice: இருளடைந்தது
  rationale: அறநெறி மற்றும் புரிந்துணர்வு சார்ந்த இருளைச் சுட்டும் உருவகத்தையும் செயல்படுபொருள் வடிவத்தின் உணர்வையும் காக்கிறது.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: விவேகமற்ற அவர்களுடைய இதயம்
  rationale: ἀσύνετος என்பது புரிந்துணர்வு அல்லது விவேகம் இல்லாத நிலையைக் குறிக்கிறது; καρδία ஒருமையைப் பேணி, உள்ளார்ந்த மனிதனைச் சுட்டுகிறது.
theological_decisions:
- issue: γνόντες என்பதன் விட்டுக்கொடுப்பு சார்ந்த பொருள்
  choice: அவர்கள் கடவுளை அறிந்திருந்தும்
  alternative: கடவுளை அறிந்தவர்கள் / கடவுளை அறிந்தபோது
  rationale: சூழலில், கடவுளைப் பற்றிய அறிவு இருந்தபோதிலும் உரிய பதிலை அளிக்காத முரண்பாட்டை பவுல் வலியுறுத்துகிறார். இது இறையியல் முடிவைத் திணிக்காமல் இலக்கணமும் சூழலும் தரும் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “மகிமைப்படுத்துதல்,” “இதயம் இருளடைதல்” ஆகிய மூலத்தின் இறையியல் மற்றும் உருவக மொழிகள் தக்கவைக்கப்பட்டுள்ளன; “சிந்தனைகள்” என்பதன் பொருள் பரப்பு அடிக்குறிப்பில் காட்டப்பட்டுள்ளது.
