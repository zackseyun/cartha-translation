translation_notes:
  register: நவீன செந்தமிழ்ச் சொற்களுடன் பொதுவாசகர்களுக்குப் புரியும் இயல்பான நடை பயன்படுத்தப்பட்டுள்ளது. ஒரே பொருள் வட்டத்திலுள்ள πονηρία, κακία, κακοηθεία ஆகியவை முறையே ‘தீமை’, ‘தீய நோக்கம்’, ‘தீய மனப்பான்மை’ என வேறுபடுத்தப்பட்டுள்ளன. வசனம் முந்தைய வசனத்தின் வாக்கிய அமைப்பைத் தொடர்ந்தாலும், தமிழில் தனியாகவும் வாசிக்க இயலுமாறு ‘அவர்கள்’ மற்றும் நிறைவு வினைகள் சேர்க்கப்பட்டுள்ளன.
