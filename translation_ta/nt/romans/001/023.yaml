source:
  edition: SBLGNT
  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: ta
  text: அழிவில்லாத கடவுளின் மகிமையை[a], அழிவுக்குட்படும் மனிதன்[c], பறவைகள், நான்கு காலுள்ள விலங்குகள், ஊர்ந்து செல்லும் உயிரினங்கள்[d] ஆகியவற்றின் உருவத்தின் சாயலுக்காக[b] மாற்றிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழிவுக்கு உட்படாத கடவுளின் மகிமையை.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “ஒரு உருவத்தின் சாயலில்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “சாகக்கூடிய மனிதன்.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “ஊர்வன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: மாற்றிக்கொண்டார்கள்
  rationale: வேறொன்றுக்குப் பதிலாக ஒன்றைத் தெரிந்தே மாற்றிக்கொள்ளும் செயலைக் குறிக்கிறது; சூழலில் உள்ள சிலைவழிபாட்டு மாற்றீட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δόξαν
  choice: மகிமையை
  rationale: கடவுளின் மேன்மை, மாட்சிமை, கனத்திற்குரிய தன்மை ஆகியவற்றை உள்ளடக்கும் நிலையானதும் சூழலுக்குப் பொருத்தமானதுமான சொல்.
- source_word: ἀφθάρτου
  choice: அழிவில்லாத
  rationale: சிதைவு அல்லது அழிவுக்கு உட்படாத தன்மையை நேரடியாகக் காட்டி, φθαρτοῦ என்பதற்கான எதிர்மறை இணைப்பையும் காக்கிறது.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: உருவத்தை ஒத்த சிலைக்காக
  rationale: ὁμοίωμα மற்றும் εἰκών ஆகிய இரட்டை உருவகச் சொற்களின் கருத்தை இயல்பான தமிழில் காக்கிறது; மூலத்தின் ஒருமை அமைப்பையும் ‘சிலை’ என்ற ஒருமையால் பிரதிபலிக்கிறது.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: அழிவுக்குரிய மனிதன்
  rationale: அழிவில்லாத கடவுளுக்கும் அழிவுக்கு உட்பட்ட மனிதனுக்கும் இடையிலான திட்டமிட்ட எதிர்மறை ஒப்புமையைப் பாதுகாக்கிறது.
- source_word: πετεινῶν
  choice: பறவைகள்
  rationale: சொல்லின் வழக்கமான, தெளிவான தமிழ் இணை.
- source_word: τετραπόδων
  choice: நான்கு காலுள்ள விலங்குகள்
  rationale: மூலச்சொல்லின் நேரடி பொருளை நவீன வாசகர்களுக்குப் புரியும் இயல்பான தமிழில் தருகிறது.
- source_word: ἑρπετῶν
  choice: ஊர்ந்து செல்லும் உயிரினங்கள்
  rationale: நவீன உயிரியல் வகைப்பாட்டில் உள்ள ‘ஊர்வன’ என்பதைக் காட்டிலும் கிரேக்கச் சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
