lexical_decisions:
- source_word: φάσκοντες
  choice: சொல்லிக்கொண்ட
  rationale: நிகழ்காலப் பங்கேற்புவினையான இது, அவர்கள் தங்களைப் பற்றி தொடர்ந்து முன்வைத்த உரிமைக்கூற்றை உணர்த்துகிறது. ‘சொல்லிக்கொண்ட’ என்பது நவீன தமிழில் இயல்பாகவும் பவுலின் நையாண்டித் தொனியைச் சேர்த்தோ குறைத்தோ விடாமலும் உள்ளது.
- source_word: εἶναι
  choice: என்று
  rationale: φάσκοντες என்பதன் கூற்றுப் பொருளைத் தமிழில் இயல்பான மேற்கோள் அமைப்பாக இணைக்கிறது; ‘ஞானிகள் என்று சொல்லிக்கொண்ட’ என்பது ‘ஞானிகளாக இருப்பதாகக் கூறுதல்’ என்ற பொருளைத் தெளிவாகக் கொண்டுள்ளது.
- source_word: σοφοὶ
  choice: ஞானிகள்
  rationale: பண்புச் சொல்லின் மதிப்பீட்டுப் பொருளையும், பின்னரும் வரும் ‘மூடர்கள்’ என்பதுடனான ஆள்சுட்டும் எதிர்மறை இணைப்பையும் காக்கிறது.
- source_word: ἐμωράνθησαν
  choice: மூடர்களானார்கள்
  rationale: வினையின் ஒரு நிலைக்குள் வந்தடைந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது. ‘ஞானிகள்—மூடர்கள்’ என்ற கூர்மையான சொல்லாட்சிசார் எதிரிணையையும் காக்கிறது; வெளிப்புறச் செயற்பாட்டாளரைத் தேவையின்றி சேர்ப்பதில்லை.
theological_decisions:
- issue: ἐμωράνθησαν என்பதை ஒரு பண்புநிலையாகவா (‘மூடத்தனமுள்ளவர்களானார்கள்’) அல்லது வலுவான ஆள்சுட்டுப் பெயராகவா (‘மூடர்களானார்கள்’) மொழிபெயர்ப்பது
  choice: மூடர்களானார்கள்
  alternative: மூடத்தனமுள்ளவர்களானார்கள்; மூடர்களாக்கப்பட்டார்கள்
  rationale: கிரேக்கத்தில் ‘ஞானிகள்’ என்பதற்கு எதிராகப் பவுல் முன்வைக்கும் நையாண்டி கூர்மையானது. ‘மூடர்களானார்கள்’ அந்த எதிரிணையையும் விளைவுநிலையையும் காக்கிறது; அதேவேளை யாரால் அப்படி ஆக்கப்பட்டார்கள் என்று உரை கூறாத இடத்தில் ஒரு செயற்பாட்டாளரைத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘தங்களை’ என்பது கூற்றின் சுயசுட்டுப் பொருளைத் தெளிவாக்குகிறது. மூலத்தின் ஞானிகள்–மூடர்கள் என்ற நையாண்டி எதிரிணை பாதுகாக்கப்பட்டுள்ளது; இறையியல் செயற்பாட்டாளர் உரைக்குள் சேர்க்கப்படவில்லை.
