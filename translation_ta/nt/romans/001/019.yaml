id: ROM.1.19
reference: Romans 1:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: ta
  text: ஏனெனில், கடவுளைப் பற்றி அறியக்கூடியது அவர்களிடையே வெளிப்படையாக உள்ளது[a]; கடவுள் அதை அவர்களுக்கு வெளிப்படுத்தியுள்ளார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குள்” அல்லது “அவர்களில்.”
    reason: ἐν αὐτοῖς என்பது “அவர்களிடையே” என்பதையும், “அவர்களுக்குள்/அவர்களில்” என்பதையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: διότι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τὸ γνωστὸν
  choice: அறியக்கூடியது
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நடுநிலைப் பெயரடையின் பொருளை, மனித அறிவுக்கு எட்டக்கூடியது என்ற வகையில் சுருக்கமாகத் தருகிறது; ‘அறியப்பட்டது’ என்று மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: τοῦ θεοῦ
  choice: கடவுளைப் பற்றி
  rationale: இங்கு இறைவனைப் பற்றிய அறிவே நோக்கமாக இருப்பதை இயல்பான தமிழ் வழக்கில் வெளிப்படுத்துகிறது.
- source_word: φανερόν
  choice: தெளிவாக இருக்கிறது
  rationale: வெளிப்படையாகவும் அறியத்தக்கதாகவும் இருப்பதைக் காட்டுகிறது; தொடர்ந்து வரும் ἐφανέρωσεν என்பதோடு உள்ள சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: ἐν αὐτοῖς
  choice: அவர்களிடையே
  rationale: குழுவினரிடையே வெளிப்படையாக இருப்பது என்ற சாத்தியமான பொருளை முதன்மை உரையில் தருகிறது; உள்ளார்ந்த இடத்தைக் குறிக்கும் மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: கடவுளே அதை அவர்களுக்குத் தெளிவாக்கியுள்ளார்
  rationale: கடவுளே வெளிப்படுத்தியவர் என்ற வலியுறுத்தலைக் காத்து, φανερόν என்பதுடன் உள்ள தொடர்பை ‘தெளிவு’ என்ற ஒரே சொல்லடிப்படையின் மூலம் இயல்பான தமிழில் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ἐν αὐτοῖς என்பதன் இடப்பொருள்
  choice: அவர்களிடையே
  alternative: அவர்களுக்குள்; அவர்களில்
  rationale: கிரேக்கச் சொற்றொடர் பொதுவாக அல்லது குழுவினரிடையே வெளிப்படுவது என்றும், அவர்களுக்குள் உள்ளார்ந்ததாக இருப்பது என்றும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை பொதுவெளிப்பாட்டுச் சூழலுக்கு ஏற்ற ‘அவர்களிடையே’ என்பதைப் பயன்படுத்துகிறது; உண்மையான தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தெளிவாக இருக்கிறது / தெளிவாக்கியுள்ளார்’ என்ற இணைப்பு மூலத்தின் φανερόν / ἐφανέρωσεν சொற்பொருள் எதிரொலியைப் பாதுகாக்கிறது.
