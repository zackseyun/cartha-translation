  text: மேசியாவாகிய இயேசுவின் அடிமையும்[a], அழைக்கப்பட்ட அப்போஸ்தலனும்[b], கடவுளின் நற்செய்திக்கென்று பிரித்துவைக்கப்பட்டவனுமான பவுல்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஊழியன்’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள கிரேக்கச் சொல் ஒருவருக்குச் சொந்தமாகி அவருக்குக் கீழ்ப்பட்டிருப்பதையும் குறிக்கிறது.
