lexical_decisions:
- source_word: Παῦλος
  choice: பவுல்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: δοῦλος
  choice: அடிமை
  rationale: ஒருவருக்குச் சொந்தமானவராகவும் அவருக்குக் கீழ்ப்பட்டவராகவும் இருப்பதைச் சுட்டும் கிரேக்கச் சொல்லின் வலிமையைப் பாதுகாக்கிறது; மென்மைப்படுத்தப்பட்ட ‘ஊழியன்’ என்பதைக் காட்டிலும் மூலத்திற்கு நெருக்கமானது.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவின்
  rationale: Χριστός என்பதன் பட்டப்பெயர்ச் சார்ந்த ‘மேசியா’ பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்தி, இயேசுவுடனான இணைப்பையும் தெளிவாக்குகிறது.
- source_word: κλητὸς ἀπόστολος
  choice: அப்போஸ்தலனாக அழைக்கப்பட்டு
  rationale: ‘அழைக்கப்பட்ட அப்போஸ்தலன்’ என்ற கிரேக்க அமைப்பை இயல்பான தமிழில் தருகிறது; அப்பணிக்கான அழைப்பை வெளிப்படுத்தினாலும் தேவையற்ற விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ἀφωρισμένος
  choice: பிரித்துவைக்கப்பட்டவன்
  rationale: முடிந்த செயலைக் குறிக்கும் செயப்பாட்டு வினையெச்சத்தின் வலிமையையும் ஒரு நோக்கத்திற்கெனத் தனியே வைக்கப்பட்ட கருத்தையும் காக்கிறது.
- source_word: εἰς εὐαγγέλιον θεοῦ
  choice: கடவுளின் நற்செய்திக்காக
  rationale: εἰς குறிக்கும் நோக்கத்தை ‘-க்காக’ இயல்பாகத் தருகிறது; εὐαγγέλιον என்பதன் செய்திப் பொருளை ‘நற்செய்தி’ தெளிவாக எடுத்துரைக்கிறது.
theological_decisions:
- issue: δοῦλος என்பதிலுள்ள கீழ்ப்படிதலும் உடைமை உறவும்
  choice: அடிமை
  alternative: ஊழியன்
  rationale: இந்த இடத்தில் பவுல் தம்மை முழுமையாக மேசியாவுக்குரியவராக அடையாளப்படுத்துகிறார். ‘அடிமை’ மூலச்சொல்லின் கடினமான சமூக மற்றும் உறவுசார் வலிமையை மறைக்காமல் காக்கிறது; மாற்றுச் சொல்லை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: Χριστός பட்டப்பெயரா அல்லது பெயரைப் போன்ற மரபுவடிவமா
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு Χριστός இயேசுவின் மேசியா பட்டத்தைத் தாங்குகிறது. தமிழில் இயல்பிற்காக ‘ஆகிய’ சேர்க்கப்பட்டுள்ளது; மரபுவழி ஒலிபெயர்ப்பு சாத்தியமாக இருந்தாலும் முதன்மை உரையில் பட்டத்தின் பொருள் பாதுகாக்கப்படுகிறது.
- issue: κλητὸς ἀπόστολος என்பதன் சுருக்கமான இலக்கண உறவு
  choice: அப்போஸ்தலனாக அழைக்கப்பட்டு
  alternative: அழைக்கப்பட்ட அப்போஸ்தலன்
  rationale: மூலத்தில் ‘இருக்கும்படி’ என்பதற்கான தனி வினை இல்லை. முதன்மை மொழிபெயர்ப்பு இயல்பான தமிழை வழங்குகிறது; இன்னும் வடிவநெருக்கமான வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடக்க வாழ்த்துரை அடுத்த வசனங்களில் தொடர்வதால், மூலத்தில் உள்ள நிறைவுபெறாத தொடரமைப்பைக் காக்க இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ‘அப்போஸ்தலன்’ என்பது பரவலாக அறியப்பட்ட திருச்சபைச் சொல் என்பதால் தக்கவைக்கப்பட்டது; ‘சுவிசேஷம்’ என்பதற்குப் பதில் பொருள் வெளிப்படையான ‘நற்செய்தி’ தேர்ந்தெடுக்கப்பட்டது.
