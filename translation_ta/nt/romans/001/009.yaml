source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: ta
  text: 'அவருடைய மகனின் நற்செய்தியில் என் ஆவியால் நான் சேவிக்கும் தேவன் எனக்குச் சாட்சி: நான் இடைவிடாமல் உங்களைப் பற்றிக் குறிப்பிடுகிறேன்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς
  choice: சாட்சி
  rationale: பவுல் தமது கூற்றின் உண்மைக்கு தேவனைச் சாட்சியாக அழைக்கும் உறுதிமொழி போன்ற பயன்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λατρεύω
  choice: சேவிக்கிற
  rationale: இந்த வினைச்சொல் தேவனுக்குச் செய்யும் வழிபாட்டுச் சார்ந்த சேவையைக் குறிக்கிறது. ‘சேவிக்கிற’ என்பது வழிபாடு என்று மட்டும் குறுக்காமல், அர்ப்பணிப்பான இறைச்சேவையின் பரப்பையும் தக்கவைக்கிறது.
- source_word: ἐν τῷ πνεύματί μου
  choice: என் ஆவியால்
  rationale: ἐν இங்கு கருவி அல்லது முறையைக் குறிக்கக்கூடும். ‘என் ஆவியால்’ என்பது பவுலின் உள்ளார்ந்த, தனிப்பட்ட சேவையை நவீன தமிழில் சுருக்கமாகத் தெரிவிக்கிறது; இடப்பொருள் வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: அவருடைய மகனின் நற்செய்தியில்
  rationale: εὐαγγέλιον என்பதன் பொதுவாகப் புரியும் பொருளை ‘நற்செய்தி’ என வழங்கி, மகனைச் சார்ந்த பிறப்புவேற்றுமையின் இயல்பான தெளிவின்மையை ‘மகனின்’ என்பதன் மூலம் தக்கவைக்கிறது.
- source_word: ἀδιαλείπτως
  choice: இடைவிடாமல்
  rationale: தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழும் அக்கறையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: உங்களைப் பற்றிக் குறிப்பிடுகிறேன்
  rationale: ‘உங்களை நினைவுகூர்கிறேன்’ என்று பொருளை விரிவாக்காமல், ‘உங்களைப் பற்றிக் குறிப்பிடுதல்’ என்ற கிரேக்க மரபுத்தொடரின் நேரடிப் பொருளை வாசிக்கத்தக்க தமிழில் தருகிறது.
theological_decisions:
- issue: ἐν τῷ πνεύματί μου என்பது கருவியையா அல்லது உள்ளார்ந்த தளத்தையா குறிக்கிறது?
  choice: என் ஆவியால்
  alternative: என் ஆவியில்
  rationale: இரண்டு பொருள்களும் இலக்கண ரீதியாகச் சாத்தியம். முதன்மை உரை இயல்பான தமிழுக்காக கருவி/முறைப் பொருளைத் தேர்ந்தெடுக்கிறது; உள்ளார்ந்த தளப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τοῦ υἱοῦ αὐτοῦ என்பதை உடைமைப் பொருளிலா அல்லது செய்தியின் உள்ளடக்கமாகவா வெளிப்படுத்துவது?
  choice: அவருடைய மகனின் நற்செய்தி
  alternative: அவருடைய மகனைப் பற்றிய நற்செய்தி
  rationale: கிரேக்கப் பிறப்புவேற்றுமையை நேரடியாகத் தக்கவைத்து, நற்செய்தி மகனைப் பற்றியது என்று விளக்கமாக மட்டும் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளது. ‘சுவிசேஷம்’, ‘ஊழியம்’ போன்ற திருச்சபைச் சிறப்புச் சொற்களுக்குப் பதிலாக பொதுவாகப் புரியும் ‘நற்செய்தி’, ‘சேவை’ சார்ந்த மொழி பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் சாட்சி அமைப்பு தெளிவாகத் தோன்ற முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
