  text: ἀσυνέτους, ἀσυνθέτους, ⸀ἀστόργους, ἀνελεήμονας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/031.yaml
  text: senseless[a], faithless, heartless[b], merciless.
translation:
  language: ta
  text: பகுத்தறிவில்லாதவர்கள், வாக்குத் தவறுகிறவர்கள்[a], இயல்பான குடும்பப் பாசமில்லாதவர்கள்[b], இரக்கமற்றவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பத்தகாதவர்கள்” அல்லது “உடன்படிக்கையை மீறுகிறவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: குடும்ப உறுப்பினர்களிடையே இயல்பாக இருக்க வேண்டிய பாசம் இல்லாததையே இச்சொல் குறிப்பாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: பகுத்தறிவில்லாதவர்கள்
  rationale: அறிந்துகொள்ளும் திறன் அல்லது நுண்ணுணர்வு இல்லாமையைச் சுட்டுகிறது. இது வெறும் அறிவுத்திறன் குறைவைக் குறிக்காமல், சூழலில் உள்ள ஒழுக்கம் சார்ந்த பகுத்தறிவின்மையையும் வெளிப்படுத்துகிறது.
- source_word: ἀσυνθέτους
  choice: வாக்குத் தவறுகிறவர்கள்
  rationale: ஒப்புக்கொண்டதையோ உறுதியளித்ததையோ கடைப்பிடிக்காமல், உறவுகளில் நம்பகமற்றவர்களாக இருப்பதைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἀστόργους
  choice: இயல்பான குடும்பப் பாசமில்லாதவர்கள்
  rationale: குறிப்பாகக் குடும்ப உறவினரிடையே இயல்பாக இருக்க வேண்டிய பாசம் இல்லாமையை இச்சொல் குறிக்கிறது. பொதுவான ‘அன்பில்லாதவர்கள்’ என்பதைவிட மூலச்சொல்லின் குடும்பப் பாச நுட்பத்தை இது தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀνελεήμονας
  choice: இரக்கமற்றவர்கள்
  rationale: பிறர்மீது இரக்கமோ கருணையோ காட்டாதவர்களைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், குற்றப்பட்டியலுக்கேற்ற இணையான பெயரெச்சத் தொடர்களுடன், கண்ணியமாகவும் பொதுவாசகர்களுக்கு எளிதில் புரியுமாறும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கச் சொற்களின் ஒழுக்கம், உறவுநிலை, குடும்பப் பாசம் ஆகிய நுட்பங்கள் இயன்றவரை வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
