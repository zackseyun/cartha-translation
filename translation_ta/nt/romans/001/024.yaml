  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: ta
  text: ஆகவே, கடவுள் அவர்களை அவர்களுடைய இதயங்களின் ஆசைகளில் அசுத்தத்துக்கு ஒப்புக்கொடுத்தார்; அவர்களுடைய உடல்கள் தங்களுக்குள் அவமதிக்கப்படுவதற்கு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: παρέδωκεν
  choice: ஒப்புக்கொடுத்தார்
  rationale: ஒரு ஆற்றலின் அல்லது நிலையின் வசத்துக்கு ஒருவரை ஒப்படைக்கும் பொருளையும், இங்கு உள்ள இறைத் தீர்ப்பின் கனத்தையும் கூடுதல் கோட்பாட்டு விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: அவர்களுடைய இதயங்களின் ஆசைகளில்
  rationale: ἐν என்பதன் சூழல் அல்லது செயல்படும் களம் என்ற நுட்பத்தைத் தக்கவைத்து, ‘இதயம்’ என்ற வேதாகம மனிதவியல் சொல்லாட்சியையும் பாதுகாக்கிறது.
- source_word: ἐπιθυμίαις
  choice: ஆசைகளில்
  rationale: சூழல் பின்னர் பாலியல் திசையில் நகர்ந்தாலும், இச்சொல்லை இங்கேயே ‘காம இச்சைகள்’ என்று தேவையின்றிக் குறுக்காமல் அதன் பரந்த பொருளை வைத்திருக்கிறது.
- source_word: ἀκαθαρσίαν
  choice: அசுத்தத்துக்கு
  rationale: ஒழுக்கரீதியான தூய்மையின்மையைச் சுருக்கமாகவும் வழக்கமான வேதாகமத் தமிழிலும் தெரிவிக்கிறது.
- source_word: τοῦ ἀτιμάζεσθαι
  choice: அவமதிக்கப்படுவதற்கு
  rationale: பெயர்ச்சொல் தன்மையுள்ள இறந்தகாலமற்ற வினைவடிவை இயன்றவரை நெருக்கமாகக் காக்கிறது; நோக்கம் அல்லது விளைவு என்ற தொடர்பை மிகையாகத் தீர்மானிப்பதில்லை.
- source_word: τὰ σώματα αὐτῶν
  choice: தங்கள் உடல்கள்
  rationale: பவுலின் உடல்சார்ந்த வலியுறுத்தலை நேரடியாகத் தக்கவைக்கிறது; தமிழில் எழுவாய் ஒருமைப்பாட்டுக்காக ‘தங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐν αὐτοῖς
  choice: தங்களுக்குள்
  rationale: சூழலில் பரஸ்பர அல்லது சமூகத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
theological_decisions:
- issue: παρέδωκεν என்பதை ‘கைவிட்டார்’ அல்லது வெளிப்படையான நீதித்தீர்ப்புக் குறிப்பாக வலுப்படுத்தலாமா?
  choice: ஒப்புக்கொடுத்தார்
  alternative: கைவிட்டார்; தீர்ப்பாக அவர்களை ஒப்புக்கொடுத்தார்
  rationale: மூலவசனம் கடவுள் அவர்களை ஒப்புக்கொடுத்ததாக வலுவாகச் சொல்கிறது; ஆனால் ‘கைவிடுதல்’ அல்லது விரிவான கோட்பாட்டு விளக்கம் அதன் சொற்களைத் தாண்டிச் செல்லும். எனவே இறையியல் கனமும் பதற்றமும் விளக்கச் சேர்க்கையின்றிப் பாதுகாக்கப்படுகின்றன.
- issue: τοῦ ἀτιμάζεσθαι என்பதில் நோக்கமா விளைவா?
  choice: அவமதிக்கப்படுவதற்கு
  alternative: அவமதிக்கப்படும்படி; அதன் விளைவாக அவமதிக்கப்பட்டன
  rationale: கிரேக்க அமைப்பு நோக்கம் அல்லது விளைவு என்ற இரு நுட்பங்களுக்கும் இடமளிக்கக்கூடும். ஒரு finite விளைவு வாக்கியமாக மாற்றாமல் அதன் சுருக்கத்தையும் உண்மையான தெளிவின்மையையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் dignified ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதயம்,’ ‘அசுத்தம்,’ ‘உடல்கள்’ போன்ற மூலத்தின் முக்கிய உருவகங்களும் சொற்களும் பாதுகாக்கப்பட்டுள்ளன. வாக்கிய அமைப்பு கிரேக்கத்தின் தர்க்க ஓட்டத்தையும் பெயர்ச்சொல் தன்மையுள்ள infinitive அமைப்பையும் இயன்றவரைத் தக்கவைக்கிறது.
