source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: ta
  text: அவர்கள் கடவுளின் உண்மையைப் பொய்க்கு மாற்றி, படைத்தவருக்குப் பதிலாகப் படைப்பை வணங்கி, அதற்குப் பணிவிடை செய்தார்கள். படைத்தவரோ என்றென்றும் போற்றப்படத்தக்கவர். ஆமென்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν
  choice: மாற்றிக்கொண்டு
  rationale: ‘ஒன்றுக்குப் பதிலாக மற்றொன்றைத் தேர்ந்தெடுத்து மாற்றுதல்’ என்ற பரிமாற்றக் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: கடவுளைப் பற்றிய உண்மை
  rationale: இங்குள்ள மரபுத்தொடர் சார்பு வேற்றுமையை, சூழலில் கடவுளைப் பற்றிய உண்மை என்று வாசிப்பது இயல்பானது; ‘கடவுளுடைய உண்மை’ என்பதும் இலக்கணரீதியாகச் சாத்தியம்.
- source_word: ἐν τῷ ψεύδει
  choice: பொய்க்கு
  rationale: μετήλλαξαν உடன் ‘உண்மையைப் பொய்க்கு மாற்றுதல்’ என்ற தமிழ்ப் பரிமாற்ற அமைப்பு மூலத்தின் பொருளைத் தெளிவாகத் தருகிறது; குறிப்பிட்ட பொய்யைக் குறிக்கக்கூடிய கிரேக்க definite article-ஐ தமிழில் கட்டாயமாக வெளிப்படுத்தவில்லை.
- source_word: ἐσεβάσθησαν
  choice: போற்றி
  rationale: மதிப்பு, பயபக்தி, வழிபாட்டுணர்வு ஆகியவற்றை உள்ளடக்கும் வினையை ‘போற்றி’ என வழங்குகிறது; அடுத்துள்ள λατρεύω உடன் ஒரே சொல்லாகக் கலக்காமல் வேறுபாட்டைப் பேணுகிறது.
- source_word: ἐλάτρευσαν
  choice: பணிசெய்தார்கள்
  rationale: வழிபாட்டுச் சேவை அல்லது சமயப் பணிவிடை என்ற கருத்தைத் தருகிறது; ἐσεβάσθησαν என்பதிலிருந்து வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: τῇ κτίσει
  choice: படைப்பை … அதற்கு
  rationale: படைக்கப்பட்ட உலகம் அல்லது படைப்பினம் என்ற தொகுப்புப் பொருளை ‘படைப்பு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παρὰ τὸν κτίσαντα
  choice: படைத்தவருக்குப் பதிலாக
  rationale: παρά இங்கு ஒப்பீடு மட்டுமன்றி படைப்பாளரை விட்டுப் படைப்பைத் தேர்ந்தெடுத்த எதிர்மறை மாற்றத்தைக் குறிக்கிறது; ‘படைத்தவர்’ என்ற வினையாலணையும் பெயர் மூலத்துக்கு நெருக்கமானது.
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: என்றென்றும் போற்றுதலுக்குரியவர்
  rationale: கடவுளைக் குறித்த εὐλογητός என்பதன் புகழ்ச்சிக்குரிய நிலையை dignified Tamil-ல் தருகிறது; இது மனிதர் ஆசீர்வதிக்கப்படுதல் என்று தவறாகப் புரிவதைத் தவிர்க்கிறது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ‘படைத்தவரைவிட’ அல்லது ‘படைத்தவருக்குப் பதிலாக’
  choice: படைத்தவருக்குப் பதிலாக
  alternative: படைத்தவரைவிட
  rationale: சூழல் வெறும் உயர்வு-தாழ்வு ஒப்பீட்டைக் காட்டாமல், கடவுளுக்குரிய பக்தியும் சேவையும் படைப்புக்கு மாற்றப்பட்டதைக் கூறுகிறது.
- issue: ἐσεβάσθησαν மற்றும் ἐλάτρευσαν ஆகிய இரு வினைகளின் வேறுபாடு
  choice: போற்றி … பணிசெய்தார்கள்
  alternative: வணங்கி … வழிபட்டார்கள்
  rationale: மூலத்தில் உள்ள இரு தொடர்புடைய ஆனால் வேறுபட்ட செயல்களைப் பேணுகிறது; ஒரே கருத்தை இருமுறை சொல்வதாகச் சுருக்கவில்லை.
- issue: ὅς என்பதன் முன்னிலை
  choice: படைத்தவரே என்றென்றும் போற்றுதலுக்குரியவர்
  alternative: அவரே என்றென்றும் போற்றுதலுக்குரியவர்
  rationale: உறவுப்பெயரின் தெளிவான முன்னிலை ‘படைத்தவர்’; தமிழில் பெயரை மீண்டும் கூறுவது தொடர்பைத் தெளிவாக்கி, இறையியல் வலியுறுத்தலை மாற்றாது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். கிரேக்கத்தின் எதிர்மறை அமைப்பும் இரண்டு வழிபாட்டுச் செயல்களின் வேறுபாடும் பேணப்பட்டுள்ளன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
