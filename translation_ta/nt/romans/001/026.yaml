  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: ta
  text: இதன் காரணமாக, கடவுள் அவர்களை இழிவான வேட்கைகளுக்கு ஒப்புக்கொடுத்தார். ஏனெனில், அவர்களுடைய பெண்களும்கூட[a] இயல்பான பாலுறவை[b] இயற்கைக்கு மாறான பாலுறவாக[c] மாற்றிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “பெண்பாலார்.”'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, சொல்லுக்குச் சொல்: “இயல்பான பயன்பாடு.”'
    reason: lexical_alternative
  - marker: c
    text: 'அல்லது: “இயற்கைக்கு எதிரானதாக.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: இதன் காரணமாக
  rationale: முந்தைய வசனங்களிலுள்ள காரணத்தோடு இவ்வசனத்தை இணைக்கும் கிரேக்கத் தொடரின் காரணவிளைவு வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: παρέδωκεν αὐτοὺς
  choice: அவர்களை ... ஒப்புக்கொடுத்தார்
  rationale: παραδίδωμι என்பதிலுள்ள ஒருவரை வேறொன்றின் ஆளுகைக்கு விட்டுக்கொடுக்கும் கருத்தைக் காக்கிறது; வெறுமனே ‘விட்டுவிட்டார்’ என்பதைவிட மூலத்தின் வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: πάθη ἀτιμίας
  choice: இழிவுக்குரிய உணர்ச்சிகள்
  rationale: πάθη என்பதன் தீவிரமான மனவுணர்வு அல்லது வேட்கை சார்ந்த பொருளையும், ἀτιμία என்பதன் மதிப்பிழந்த அல்லது இழிவுக்குரிய தன்மையையும் தேவையற்ற விளக்கமின்றிக் காக்கிறது.
- source_word: θήλειαι
  choice: பெண்கள்
  rationale: கிரேக்கச் சொல் சொல்லுக்குச் சொல் ‘பெண்பாலார்’ என்றாலும், மனிதர்களைக் குறிக்கும் இச்சூழலில் ‘பெண்கள்’ என்பது இயல்பான நவீனத் தமிழ்; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μετήλλαξαν
  choice: மாற்றிக்கொண்டார்கள்
  rationale: ஒரு நடைமுறையை விட்டு வேறொன்றைத் தேர்ந்தெடுத்த பரிமாற்றக் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: இயல்பான பாலுறவு
  rationale: χρῆσις என்பதன் நேரடிப் பொருள் ‘பயன்பாடு’; ஆனால் இங்கு பாலியல் சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘பாலுறவு’ பயன்படுத்தப்பட்டுள்ளது. நேரடி மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: τὴν παρὰ φύσιν
  choice: இயற்கைக்கு மாறானதாக
  rationale: παρὰ φύσιν என்ற கிரேக்கத் தொடரின் மதிப்பீட்டுத் தன்மையைத் தக்கவைத்து, நவீனத் தமிழில் தெளிவாக ஒலிக்கிறது.
theological_decisions:
- issue: பவுலின் ஒழுக்க மதிப்பீட்டை வலுப்படுத்துவதா அல்லது மென்மையாக்குவதா
  choice: ‘இழிவுக்குரிய’ மற்றும் ‘இயற்கைக்கு மாறான’ என்ற மதிப்பீட்டு மொழியை அப்படியே தக்கவைத்தல்
  alternative: மென்மையான சொற்களைப் பயன்படுத்துதல் அல்லது மூலத்தில் பெயரிடப்படாத நவீன அடையாளங்களையும் வகைப்பாடுகளையும் சேர்த்தல்
  rationale: வசனமே வெளிப்படுத்தும் ஒழுக்க மதிப்பீடு மறைக்கப்படக்கூடாது; அதே நேரத்தில், மூலத்தில் இல்லாத நவீன சமூக அல்லது கோட்பாட்டு வகைப்பாடுகள் மொழிபெயர்ப்பில் புகுத்தப்படக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தின் மதிப்பீட்டு வலிமை காக்கப்பட்டுள்ளது; ஆனால் மூலத்தை மீறிய விளக்கமோ சமகாலப் பிரிவுப்பெயர்களோ சேர்க்கப்படவில்லை.
