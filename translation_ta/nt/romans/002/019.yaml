  yaml_path: translation/nt/romans/002/019.yaml
  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: ta
  text: மேலும், நீ உன்னையே பார்வையற்றவர்களுக்கு வழிகாட்டியாகவும், இருளில் இருப்பவர்களுக்கு ஒளியாகவும் இருப்பதாக உறுதியாக நம்புகிறாய்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: உறுதியாக நம்புகிறாய்
  rationale: நிறைவுக்கால வடிவம் நிலைபெற்ற தன்னம்பிக்கை அல்லது உறுதியான நம்பிக்கையைக் குறிக்கிறது. பவுலின் விமர்சனத் தொனியைத் தீர்மானித்து விடாமல், அந்த நிலைத்த மனநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τε
  choice: மேலும்
  rationale: முந்தைய வசனத்திலுள்ள கூற்றுகளுடன் இதை இணைக்கிறது; தமிழில் பட்டியலைத் தொடரும் இயல்பான இணைப்புச் சொல்.
- source_word: σεαυτὸν
  choice: நீ உன்னையே
  rationale: கிரேக்கத் தற்சுட்டுப் பெயர்ச்சொல்லின் வலியுறுத்தலைக் காக்கிறது; அவர் தம்மைப் பற்றியே கொண்டுள்ள மதிப்பீடு முன்வைக்கப்படுவதைத் தெளிவாக்குகிறது.
- source_word: ὁδηγὸν
  choice: வழிகாட்டியாக
  rationale: பார்வையற்றவரை வழிநடத்துபவர் என்ற உருவகத்தையும் பொதுவான நவீன தமிழ் வழக்கையும் இயல்பாகக் காக்கிறது.
- source_word: τυφλῶν
  choice: பார்வையற்றவர்களுக்கு
  rationale: உடல் குறைபாட்டை இழிவுபடுத்தாத நவீன, மரியாதையான சொல்; வழிகாட்டி யாருக்குரியவர் என்ற கிரேக்க உறவைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: φῶς
  choice: ஒளியாக
  rationale: வழிநடத்துதல் அல்லது அறிவூட்டுதல் என்ற உருவகப் பொருளை நேரடியாகவும் தெளிவாகவும் காக்கிறது.
- source_word: τῶν ἐν σκότει
  choice: இருளில் இருப்பவர்களுக்கு
  rationale: தனிநபர்களைக் குறிக்கும் கிரேக்கச் சொற்றொடரையும் ‘இருள்’ என்ற உருவகத்தின் திட்டமிட்ட தெளிவின்மையையும் காக்கிறது.
theological_decisions:
- issue: கூற்றின் உண்மைத்தன்மை
  choice: பேசப்படுபவர் தம்மைப் பற்றி கொண்டுள்ள உறுதியான நம்பிக்கையாக மட்டும் மொழிபெயர்க்கப்பட்டது
  alternative: அவர் உண்மையிலேயே வழிகாட்டியும் ஒளியும் என்று உறுதிப்படுத்துவது
  rationale: πέποιθάς σεαυτόν என்பது அவருடைய சுயநம்பிக்கையை விவரிக்கிறது; பவுலின் சூழல் விமர்சனத் தொனியுடையது. மொழிபெயர்ப்பு அந்தக் கூற்றை உண்மையென அங்கீகரிக்கவோ வெளிப்படையான கேலியாக மாற்றவோ கூடாது.
- issue: இருள் என்ற உருவகத்தின் பொருள்
  choice: ‘இருள்’ என்ற உருவகம் விளக்கமின்றி காக்கப்பட்டது
  alternative: ஆவிக்குரிய அறியாமை அல்லது பாவம் என்று வெளிப்படையாக விளக்குவது
  rationale: மூலவாக்கியம் உருவகத்தின் சரியான எல்லையை வரையறுக்கவில்லை; விளக்கத்தை முதன்மை உரைக்குள் சேர்ப்பது உண்மையான பொருள் விரிவைச் சுருக்கும்.
translation_notes:
  register: நவீன தரத் தமிழில் மரியாதையான, தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வசனத்திலிருந்து தொடரும் இலக்கணப் பட்டியல் என்பதால் இறுதியில் அரைப்புள்ளி இடப்பட்டுள்ளது. தேவையற்ற சமயவழக்குச் சொற்களும் விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன.
