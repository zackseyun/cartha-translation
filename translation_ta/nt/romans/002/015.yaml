source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: ta
  text: திருச்சட்டத்தின் செயல் அவர்களுடைய இதயங்களில் எழுதப்பட்டிருக்கிறது[a] என்பதை அவர்கள் காட்டுகிறார்கள். அவர்களுடைய மனச்சாட்சியும் அதனுடன் சேர்ந்து சாட்சியளிக்கிறது; அவர்களுடைய எண்ணங்கள் ஒன்றோடொன்று, அவர்கள்மீது குற்றஞ்சாட்டவோ அல்லது ஏன், அவர்களுக்காகத் தற்காப்பாகப் பேசவும்கூடச் செய்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருச்சட்டம் கோருவது” அல்லது “திருச்சட்டம் எதிர்பார்ப்பது.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் இத்தொடர் சுருக்கமாக உள்ளது. சொற்சார்ந்து, எண்ணங்கள் “ஒன்றுக்கொன்று இடையில்” குற்றஞ்சாட்டுகின்றன அல்லது தற்காப்பாகப் பேசுகின்றன என்ற பரஸ்பரப் பொருளும் இதில் உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: காட்டுகிறார்கள்
  rationale: நடுவினை வடிவத்தின் சான்றுகாட்டும் பொருளை மிகைப்படுத்தாமல், இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: திருச்சட்டத்தின் செயல்
  rationale: கிரேக்கத்தில் உள்ள ஒருமை ‘செயல்’ என்பதைத் தக்கவைத்து, ‘கட்டளைகள்’ அல்லது ‘கோரிக்கைகள்’ என்று விளக்கமாக விரிவாக்குவதைத் தவிர்க்கிறது.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: அவர்களுடைய இதயங்களில் எழுதப்பட்டிருக்கிறது
  rationale: உள்ளார்ந்த பதிப்பின் உருவகத்தைத் தெளிவாகவும் தமிழில் இயல்பாகவும் காக்கிறது.
- source_word: συμμαρτυρούσης ... τῆς συνειδήσεως
  choice: அவர்களுடைய மனச்சாட்சியும் அதனுடன் சேர்ந்து சாட்சியளிக்கிறது
  rationale: συν- என்ற கூட்டுச் சாட்சி நுணுக்கத்தையும், தொடரில் வரும் உடனிகழ்வையும் காக்கிறது.
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: அவர்களுக்குள் ஒன்றுக்கொன்று மாறுபடும் எண்ணங்கள்
  rationale: சுருக்கமான கிரேக்கத் தொடரிலுள்ள பரஸ்பரத் தொடர்பை வாசிக்கத்தக்க தமிழில் வெளிப்படுத்துகிறது; அதன் சொற்சார்ந்த அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: குற்றஞ்சாட்டுகின்றன அல்லது அவர்களுக்கு ஆதரவாகவும் பேசுகின்றன
  rationale: ἀπολογέομαι என்பதன் ‘தற்காப்பாக/ஆதரவாகப் பேசுதல்’ என்ற நீதிமன்ற நுணுக்கத்தையும், καὶ தரும் ‘-வும்’ என்ற வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: τὸ ἔργον τοῦ νόμου என்பது பொதுவான உள்ளார்ந்த ஒழுக்க உணர்வையா அல்லது திருச்சட்டம் கோருவதைச் சிறப்பாகக் குறிக்கிறதா?
  choice: முதன்மை உரையில் குறைவாக விளக்கமளிக்கும் ‘திருச்சட்டத்தின் செயல்’ என்பதைக் காத்தல்.
  alternative: ‘திருச்சட்டம் கோருவது’ அல்லது ‘திருச்சட்டத்தின்要求ங்கள்’ என்ற விளக்க வாசிப்பு.
  rationale: கிரேக்க வாசகம் சுருக்கமானதும் விளக்கத்திற்குத் திறந்ததும் ஆகும்; ஒரு குறிப்பிட்ட இறையியல் முடிவை உரைக்குள் சேர்க்காமல் அந்த இழுபறியைப் பாதுகாக்கிறது.
- issue: எண்ணங்கள் ஒன்றையொன்று குற்றஞ்சாட்டி ஆதரிக்கின்றனவா, அல்லது அந்த நபர்களைக் குற்றஞ்சாட்டி ஆதரிக்கின்றனவா?
  choice: எண்ணங்கள் பரஸ்பரம் மாறுபடுகின்றன; அவை அந்த நபர்கள்மீது குற்றஞ்சாட்டுகின்றன அல்லது அவர்களுக்கு ஆதரவாகப் பேசுகின்றன.
  alternative: ‘எண்ணங்கள் ஒன்றையொன்று குற்றஞ்சாட்டுகின்றன அல்லது ஆதரிக்கின்றன’ என்ற சொற்சார்ந்த வாசிப்பு.
  rationale: ἀλλήλων என்பதன் பரஸ்பரத் தன்மையை எண்ணங்களின் உள்மாறுபாட்டில் காத்து, குற்றச்சாட்டு/ஆதரவின் இயல்பான இலக்கை நபர்களாகக் காட்டுகிறது; இலக்கணச் சுருக்கத்தால் உருவாகும் மாற்று வாசிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘திருச்சட்டம்,’ ‘மனச்சாட்சி,’ ‘குற்றஞ்சாட்டு’ போன்ற ரோமர் நிருபத்தின் கருத்துச்சொற்கள் தெளிவாக வைக்கப்பட்டுள்ளன; கிரேக்கத்தின் சுருக்கமும் இறையியல் தெளிவின்மையும் தேவையற்ற விளக்கத்தால் நீக்கப்படவில்லை.
