id: ROM.2.12
reference: Romans 2:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: ta
  text: ஏனெனில், திருச்சட்டம் இல்லாமல் பாவம் செய்த அனைவரும் திருச்சட்டம் இல்லாமலேயே அழிவார்கள்[a]; திருச்சட்டத்திற்கு உட்பட்டுப் பாவம் செய்த அனைவரும் திருச்சட்டத்தின் வாயிலாகத் தீர்ப்பளிக்கப்படுவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திருச்சட்டத்திற்குப் புறம்பாக’ அல்லது ‘சட்டமின்றி’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் ἀνόμως இரு இடங்களிலும் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘திருச்சட்டத்தினால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: திருச்சட்டம் இல்லாமல்
  rationale: இது வெறுமனே ‘சட்டமீறி’ என்ற ஒழுக்கப் பொருளை மட்டும் தராமல், மோசேயின் திருச்சட்டம் இல்லாத நிலையைக் குறிக்கிறது; ἐν νόμῳ என்பதுடனான பவுலின் முரண்பாட்டையும் காக்கிறது.
- source_word: ἥμαρτον
  choice: பாவம் செய்த
  rationale: இறந்தகால வினையின் எளிய பொருளை இயல்பான தமிழில் தருகிறது; வினைநிலையை மிகையாக விளக்கவில்லை.
- source_word: ἀπολοῦνται
  choice: அழிவார்கள்
  rationale: எதிர்கால விளைவைத் தெளிவாகத் தருகிறது; அழிவின் தன்மை அல்லது இறுதித் தண்டனையின் முறை குறித்து வசனம் சொல்லாததை மொழிபெயர்ப்பு நிர்ணயிக்கவில்லை.
- source_word: ἐν νόμῳ
  choice: திருச்சட்டத்திற்கு உட்பட்டு
  rationale: சொல்லுக்குச் சொல் ‘திருச்சட்டத்தில்’ என்பதைக் காட்டிலும், திருச்சட்டத்தின் ஆளுகை அல்லது அதிகார வரம்புக்குள் இருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ νόμου
  choice: திருச்சட்டத்தின் வாயிலாக
  rationale: διά என்பதன் கருவி அல்லது வழிமுறை சார்ந்த வலிமையைப் பேணுகிறது; முன் வரும் ἐν νόμῳ என்பதிலிருந்து வேறுபாட்டையும் காட்டுகிறது.
- source_word: κριθήσονται
  choice: தீர்ப்பளிக்கப்படுவார்கள்
  rationale: ‘தண்டனைத் தீர்ப்பைப் பெறுவார்கள்’ என்று முடிவை முன்கூட்டியே நிர்ணயிக்காமல், நீதித்துறை சார்ந்த மதிப்பீடு மற்றும் தீர்ப்பு என்ற நடுநிலைப் பொருளைப் பேணுகிறது.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: அனைவரும் ... அனைவரும்
  rationale: இரு குழுக்களையும் முழுமையாகக் குறிக்கும் பகிர்வுப் பொருளையும் இணையான வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கு இந்த வசனம் காரண அடித்தளம் அளிப்பதை வெளிப்படுத்துகிறது.
- source_word: νόμος
  choice: திருச்சட்டம்
  rationale: இச்சூழலில் மோசேயின் சட்டத்தைக் குறிக்கும் வாய்ப்பு வலுவாக இருப்பதால், பொதுவான மனிதச் சட்டத்திலிருந்து வேறுபடுத்த நவீன தமிழ் வேதாகம நடையில் இயல்பான ‘திருச்சட்டம்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: νόμος என்பது எதைக் குறிக்கிறது?
  choice: மோசேயின் திருச்சட்டத்தை முதன்மையாகக் குறிக்கும் வகையில் ‘திருச்சட்டம்’
  alternative: பொதுவான ஒழுக்கச் சட்டம் அல்லது வெறுமனே ‘சட்டம்’
  rationale: ரோமர் 2-இன் யூதர்–பிற இனத்தார் ஒப்பீட்டில், திருச்சட்டம் பெறாதவர்களும் அதன் ஆளுகைக்குள் இருப்பவர்களும் எதிரெதிராக வைக்கப்படுகின்றனர். விளக்கச் சொற்களைச் சேர்க்காமல் இந்தச் சூழலைத் தமிழ் சொல் உணர்த்துகிறது.
- issue: ἀπολοῦνται என்பதன் இறையியல் வலிமை
  choice: ‘அழிவார்கள்’ என்று மட்டும் கூறி அழிவின் முறையை வரையறுக்காதது
  alternative: ‘கண்டனத் தீர்ப்படைவார்கள்’ அல்லது ‘முற்றிலும் இல்லாமற்போவார்கள்’
  rationale: வசனம் நீதித்தீர்ப்பின் விளைவைக் கூறினாலும், அதன் இயல்பு அல்லது காலநீளம் பற்றிய முழுக் கோட்பாட்டை இங்கே வரையறுக்கவில்லை; ஆகவே அந்த இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
- issue: κριθήσονται என்பது கண்டனத் தீர்ப்பையே குறிக்கிறதா?
  choice: நடுநிலையாக ‘தீர்ப்பளிக்கப்படுவார்கள்’
  alternative: ‘கண்டிக்கப்படுவார்கள்’ அல்லது ‘தண்டிக்கப்படுவார்கள்’
  rationale: κρίνω நீதித்துறைத் தீர்ப்பைக் குறிக்கிறது; சூழல் எதிர்மறையான முடிவைச் சுட்டினாலும், மொழிபெயர்ப்பில் சொல்லின் பொருளை கண்டனமாக மட்டும் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு குழுக்களுக்கிடையிலான இணை அமைப்பு பேணப்பட்டுள்ளது. ‘திருச்சட்டம்’ என்பது பொதுச் சட்டத்தைவிட மோசேயின் சட்டச் சூழலைத் தெளிவாக உணர்த்துகிறது; எனினும் பிரதான உரையில் ‘மோசேயின்’ என்று விளக்கச் சேர்க்கப்படவில்லை. அனைத்து அடிக்குறிப்பு குறிகளும் தொடர்புடைய பிரதான உரையில் இடம்பெற்றுள்ளன.
