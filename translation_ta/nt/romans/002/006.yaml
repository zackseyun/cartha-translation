  source_fidelity: மூலத்தின் தொடர்புப்பெயரான ὃς, எதிர்கால நீதிசார் வினை ἀποδώσει, பகிர்ந்தளிக்கும் ἑκάστῳ, அளவுகோலைக் குறிக்கும் κατὰ, மற்றும் தனிப்பட்ட செயல்களைக் குறிக்கும் τὰ ἔργα αὐτοῦ ஆகிய அனைத்தையும் மொழிபெயர்ப்பு துல்லியமாகக் காக்கிறது. “கைம்மாறு செய்வார்” என்பது நன்மைக்கான வெகுமதியாக மட்டும் பொருளைக் குறுக்காமல், நீதித்தீர்ப்பு/பதிலளிப்பு என்ற பரந்த பொருளைத் தக்கவைக்கிறது.
  naturalness: “அவர் ஒவ்வொருவருக்கும் அவரவருடைய செயல்களுக்கு ஏற்ப கைம்மாறு செய்வார்” என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. “ஒவ்வொருவருக்கும் … அவரவருடைய” என்ற இணைப்பு இயல்பாக உள்ளது.
  terminology: “செயல்கள்” ἔργα-வுக்கு நேரடியானதும் பவுலின் சொல்லியல் தொடர்ச்சிக்குப் பொருத்தமானதும் ஆகும். “கைம்மாறு செய்வார்” நீதிசார் விளைவு என்ற கருத்தைச் சரியாக வெளிப்படுத்துகிறது. பாலின-பிரதிநிதித்துவம் கொண்ட αὐτοῦ-வை “அவரவருடைய” என வழங்கியிருப்பது தமிழில் இயல்பானது; இணைக்கப்பட்ட குறிப்பு மூல இலக்கண வடிவத்தையும் பொதுப்பொருளையும் விளக்குகிறது.
