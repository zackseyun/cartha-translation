  text: ὃς ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/006.yaml
  text: who will repay each one according to his works[a][b].
translation:
  language: ta
  text: அவர் ஒவ்வொருவருக்கும் அவரவருடைய[b] செயல்களுக்கு[a] ஏற்ப கைம்மாறு செய்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செய்கைகளுக்கு.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ஆண்பால் ஒருமையான “அவனுடைய” என்ற சொல் பொதுவான பிரதிநிதித்துவப் பொருளில் பயன்படுத்தப்பட்டுள்ளது; அதாவது, “ஒவ்வொருவருடைய.”
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: அவர்
  rationale: முந்தைய சூழலில் தேவனைக் குறிக்கும் தொடர்புப்பெயரின் தொடர்ச்சியைத் தமிழில் இயல்பாகவும் மரியாதையுடனும் வெளிப்படுத்துகிறது.
- source_word: ἀποδώσει
  choice: கைம்மாறு செய்வார்
  rationale: நீதித்தீர்ப்பின் சூழலில் ஒருவருடைய செயல்களுக்கு ஏற்றதைத் திருப்பியளிக்கும் பொருளைத் தெளிவாகக் காக்கிறது; வெறும் ‘வெகுமதி அளிப்பார்’ என்று நல்ல பலனுக்கு மட்டும் வரம்பிடுவதில்லை.
- source_word: ἑκάστῳ
  choice: ஒவ்வொருவருக்கும்
  rationale: கிரேக்கச் சொல்லின் பகிர்ந்தளிக்கும் ஒருமை வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: κατὰ
  choice: ஏற்ப
  rationale: செயல்களே கைம்மாற்றின் அளவுகோல் அல்லது தரநிலை என்பதைக் குறிக்கிறது.
- source_word: τὰ ἔργα
  choice: செயல்கள்
  rationale: ἔργα என்பதற்கான நேரடியான, பொதுவாகப் புரியும் சமமான சொல்; பவுலின் பயன்பாட்டுடன் சொல்லியல் தொடர்ச்சியையும் காக்கிறது.
- source_word: αὐτοῦ
  choice: அவரவருடைய
  rationale: கிரேக்கத்தில் உள்ள பிரதிநிதித்துவப் பொதுப்பொருளை பாலின வரம்பின்றி, ‘ஒவ்வொருவருக்கும்’ என்பதோடு இயல்பாக இணைத்து வெளிப்படுத்துகிறது.
theological_decisions:
- issue: செயல்களுக்கு ஏற்ப நடைபெறும் நீதித்தீர்ப்பு
  choice: ‘செயல்களுக்கு ஏற்ப கைம்மாறு செய்வார்’ என்ற நீதிசார் மொழியை அப்படியே தக்கவைத்தல்
  alternative: ‘நடத்துவார்’ அல்லது ‘வெகுமதி அளிப்பார்’ என்று பொதுமைப்படுத்துதல்
  rationale: வசனம் செயல்களுக்கு ஏற்ப கைம்மாறு செய்வதை வெளிப்படையாகக் கூறுகிறது. நீதிமானாக்கப்படுதல் குறித்த பவுலின் பிற உரைகளோடு இதை மொழிபெயர்ப்பிலேயே ஒத்திசைத்து அதன் இறையியல் அழுத்தத்தைத் தணிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘கைம்மாறு’ என்பது நல்லதற்கான வெகுமதியையும் தீமைக்கான தண்டனையையும் உள்ளடக்கக்கூடிய நீதிசார் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
