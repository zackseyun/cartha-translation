source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: ta
  text: மேலும், இப்படிப்பட்ட செயல்களைச் செய்கிறவர்களுக்கு எதிராகக் கடவுளின் தீர்ப்பு உண்மைக்கு ஏற்ப உள்ளது என்பதை நாம் அறிவோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உண்மையின்படி’ என்றும் மொழிபெயர்க்கலாம்; அதாவது, கடவுளின் தீர்ப்பு உண்மை அல்லது மெய்நிலைக்கு ஒத்துப்போகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: நாம் அறிவோம்
  rationale: οἶδα நிறைவுக்கால வடிவில் இருந்தாலும் இங்கு நிகழ்காலப் பொருளில் வருகிறது; ‘நாம் அறிவோம்’ என்பது நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: δὲ
  choice: மேலும்
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் முந்தைய கருத்தைத் தொடர்ந்து அடுத்த கூற்றை இணைக்கிறது; அதனால் ‘மேலும்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: κρίμα
  choice: தீர்ப்பு
  rationale: இங்கு கடவுளின் நீதிசார் நியாயத்தீர்ப்பைக் குறிக்கிறது. ‘தீர்ப்பு’ என்பது இதை ‘தண்டனைத் தீர்ப்பு’ என்று தேவையின்றிக் குறுக்காமலும், மிகத் தொழில்நுட்பமான நீதிமன்றச் சொல்லாக்கமாக்காமலும் தெரிவிக்கிறது.
- source_word: κατὰ ἀλήθειαν
  choice: உண்மைக்கு ஏற்ப
  rationale: இச்சொற்றொடர் உண்மை அல்லது மெய்நிலையோடு ஒத்திசைவதைக் குறிக்கிறது. ‘உண்மைக்கு ஏற்ப’ என்பது கிரேக்கச் சொற்றொடரின் கூறுகளையும் பவுலின் அறநீதி வலியுறுத்தலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐπὶ
  choice: எதிரான
  rationale: பாதகமான தீர்ப்புக்கு உட்படும் நபர்களைக் குறிக்கும் இச்சூழலில் ἐπί என்பதன் நீதிசார் திசையை ‘எதிரான’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ τοιαῦτα
  choice: இப்படிப்பட்ட செயல்களை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட நடத்தைகளைக் குறிக்கும் நடுநிலைப் பன்மைச் சொற்றொடருக்கு இது இயல்பான தமிழ் இணை.
- source_word: πράσσοντας
  choice: செய்துவருகிறவர்களுக்கு
  rationale: நிகழ்காலப் பங்கேற்புவினை தொடர்ச்சியான அல்லது ஒருவரின் வழக்கமான நடத்தையைக் குறிக்கிறது; ‘செய்துவருகிற’ என்பது அந்தத் தொடர்ச்சியைத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: κατὰ ἀλήθειαν என்பதை விளக்கமாக ‘நீதியாக’ என்று மொழிபெயர்ப்பதா, அல்லது அதன் சொற்பொருள் அமைப்பைப் பாதுகாத்து ‘உண்மைக்கு ஏற்ப’ என்று மொழிபெயர்ப்பதா?
  choice: உண்மைக்கு ஏற்ப
  alternative: நீதியாக; உண்மையின்படி
  rationale: ‘உண்மைக்கு ஏற்ப’ என்பது கடவுளின் தீர்ப்பு உண்மை அல்லது மெய்நிலையோடு ஒத்திருக்கிறது என்ற பவுலின் கருத்தை வெளிப்படையாகப் பாதுகாக்கிறது; ‘நீதியாக’ என்பது அந்த இறையியல் நுட்பத்தை ஒரே விளக்கச் சொல்லுக்குள் சுருக்கிவிடக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான நடத்தையை πράσσοντας என்பதற்கு ஏற்ப ‘செய்துவருகிற’ என்று வெளிப்படுத்தி, κατὰ ἀλήθειαν என்பதிலுள்ள உண்மை சார்ந்த இறையியல் அழுத்தம் பாதுகாக்கப்பட்டுள்ளது.
