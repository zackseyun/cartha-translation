id: ROM.2.20
reference: Romans 2:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: ta
  text: மூடர்களைப் பயிற்றுவிப்பவனும், கைக்குழந்தைகளுக்குப் போதிப்பவனும், திருச்சட்டத்தில் அறிவுக்கும் உண்மைக்கும் வடிவத்தை உடையவனுமான நீ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδευτὴν
  choice: பயிற்றுவிப்பவன்
  rationale: இந்தச் சொல் கற்பித்தல், பயிற்சி அளித்தல், நெறிப்படுத்துதல் ஆகிய பொருள்களைக் கொண்டது. தண்டித்தல் என்ற பொருளை அளவுக்கு மீறி வலியுறுத்தாமல், இங்குள்ள கல்விசார் பெருமைப்பேச்சுக்கு ‘பயிற்றுவிப்பவன்’ பொருந்துகிறது.
- source_word: ἀφρόνων
  choice: மூடர்கள்
  rationale: பகுத்தறிவற்றவர் அல்லது ஞானமற்றவர் என்ற இகழ்ச்சித் தொனியை ‘மூடர்கள்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: διδάσκαλον
  choice: போதிப்பவன்
  rationale: ஆசிரியர் என்ற நிலைப்பெயரைக் காட்டிலும், முந்தைய ‘பயிற்றுவிப்பவன்’ என்பதோடு இணைந்து செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: νηπίων
  choice: கைக்குழந்தைகள்
  rationale: இது சொல்லர்த்தத்தில் மிகச் சிறிய குழந்தைகளைக் குறிக்கிறது; முதிர்ச்சியற்றவர்களுக்கான உருவகமாகவும் இருக்கலாம். ‘கைக்குழந்தைகள்’ அந்தக் கூர்மையான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἔχοντα
  choice: பெற்றிருப்பவன்
  rationale: தொடர்ந்து நிலவும் உடைமையைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையின் தொடர்பைத் தக்கவைக்கிறது.
- source_word: μόρφωσιν
  choice: உருவம்பெற்ற வெளிப்பாடு
  rationale: அறிவும் உண்மையும் திருச்சட்டத்தில் தெளிவான வடிவில் வெளிப்படுகின்றன என்ற பொருளை இயல்பான தமிழில் தருகிறது; வெறும் வெளிப்புற வடிவம் என்று சுருக்கவில்லை.
- source_word: γνώσεως
  choice: அறிவு
  rationale: ἀλήθεια என்பதுடன் இணையும் வழக்கமான, நேரடியான பொருள்.
- source_word: ἀληθείας
  choice: உண்மை
  rationale: பவுலின் கருத்திணைப்பை இயல்பாகவும் நேரடியாகவும் தக்கவைக்கிறது.
- source_word: ἐν τῷ νόμῳ
  choice: திருச்சட்டத்தில்
  rationale: இங்கு யூதர்களுக்குக் கொடுக்கப்பட்ட இறைச்சட்டம் குறிக்கப்படுவதால், ‘திருச்சட்டம்’ சூழலைத் தெளிவாக்குகிறது; ‘-த்தில்’ என்பது கிரேக்க முன்னிடைச்சொல்லின் இடம் அல்லது தளப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: μόρφωσις என்பது உள்ளார்ந்த சாரத்தையா அல்லது வெளிப்புற வடிவத்தையா குறிக்கிறது?
  choice: உருவம்பெற்ற வெளிப்பாடு
  alternative: வடிவம்
  rationale: சட்டம் அறிவையும் உண்மையையும் கண்கூடான முறையில் வெளிப்படுத்துகிறது என்ற வலுவான பொருளை முதன்மை உரை தருகிறது. எனினும், ‘வடிவம்’ என்ற குறைவாக விளக்கமளிக்கும் பொருளும் சாத்தியமாதலால் அதை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்வாக்கிய அமைப்பையும் அடுத்துவரும் கண்டனத்துக்கான சொல்லாட்சித் திருப்பத்தையும் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. கிரேக்கத்தில் மறைமுகமாகத் தொடரும் இரண்டாம் நபரைத் தமிழில் தெளிவுக்காக ‘நீ’ என்று வெளிப்படுத்தியுள்ளோம்.
