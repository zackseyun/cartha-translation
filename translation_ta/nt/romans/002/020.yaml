revisions:
- from: மூடர்களைப் பயிற்றுவிப்பவனும், கைக்குழந்தைகளுக்குப் போதிப்பவனும், திருச்சட்டத்தில் அறிவும் உண்மையும் உருவம்பெற்ற வெளிப்பாட்டைப்[a] பெற்றிருப்பவனுமான நீ—
  to: மூடர்களைப் பயிற்றுவிப்பவனும், கைக்குழந்தைகளுக்குப் போதிப்பவனும், திருச்சட்டத்தில் அறிவுக்கும் உண்மைக்கும் வடிவத்தை உடையவனுமான நீ—
  rationale: The revision replaces the interpretive phrase “உருவம்பெற்ற வெளிப்பாடு” with “வடிவம்,” a direct and sufficiently flexible rendering of μόρφωσις. It retains the source’s syntax, rhetorical force, law terminology, and unfinished dash that connects with the following verse.
