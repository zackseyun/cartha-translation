reference: Romans 2:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: ta
  text: அல்லது, கடவுளின் நன்மை உன்னை மனந்திரும்புதலுக்கு வழிநடத்துகிறது என்பதை அறியாமல், அவருடைய நன்மை, பொறுத்துக்கொள்ளுதல், நீடிய பொறுமை ஆகியவற்றின் செல்வத்தை நீ இகழ்கிறாயா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλούτου
  choice: செல்வத்தை
  rationale: பவுல் பயன்படுத்தும் மிகுதியைக் குறிக்கும் செல்வ உருவகத்தைத் தட்டையாக்காமல் அப்படியே காக்கிறது.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: பரிவு
  rationale: இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி மூலத்தின் சொல் ஒற்றுமையைப் பேணுகிறது; பாவியிடம் கடவுள் காட்டும் கனிவான நன்மையையும் உறவுசார் தன்மையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀνοχῆς
  choice: பொறுத்தருளுதல்
  rationale: தீர்ப்பை உடனே நிறைவேற்றாமல் கட்டுப்பாட்டுடன் பொறுத்திருப்பதைத் தெரிவிக்கிறது; நவீன ‘சகிப்புத்தன்மை’ என்ற சொல்லில் தோன்றக்கூடிய ஒழுக்க அக்கறையின்மை என்ற கருத்தைத் தவிர்க்கிறது.
- source_word: μακροθυμίας
  choice: நீடிய பொறுமை
  rationale: நீண்ட காலம் பொறுமையுடன் இருப்பது என்ற மூலச்சொல்லின் வலிமையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: καταφρονεῖς
  choice: இகழ்கிறாயா
  rationale: வினைச்சொல்லின் கூர்மையான கண்டனத் தொனியைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἀγνοῶν
  choice: அறியாமல்
  rationale: வேண்டுமென்றே புறக்கணித்தல் என்று மிகைப்படுத்தாமல், கிரேக்க நிகழ்காலப் பங்கேற்புச் சொல்லின் பொருளைச் சரியாகத் தருகிறது.
- source_word: εἰς μετάνοιάν
  choice: மனந்திரும்புதலுக்கு
  rationale: μετάνοια என்பதன் ஒழுக்கமும் வாழ்வுத் திசையும் மாறும் நிறைந்த பொருளை வழக்கமான வேதாகமத் தமிழில் தருவதோடு, εἰς என்பதன் இலக்கு நோக்கிய தன்மையையும் காக்கிறது.
- source_word: ἄγει
  choice: வழிநடத்துகிறது
  rationale: கடவுளின் பரிவு இப்போது தொடர்ந்து இலக்கை நோக்கி நடத்தும் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: χρηστότης / χρηστόν என்பதை ‘பரிவு’ என்றா ‘நன்மை’ என்றா மொழிபெயர்ப்பது
  choice: இரு இடங்களிலும் ‘பரிவு’
  alternative: இரு இடங்களிலும் ‘நன்மை’
  rationale: இச்சூழலில் பாவியிடம் கடவுள் காட்டும் கனிவும் தீர்ப்பைத் தாமதிக்கும் அருள்சார் அணுகுமுறையும் முன்னிலையாகின்றன. ‘பரிவு’ அந்த உறவுசார் தொனியை நன்றாகத் தருகிறது; ‘நன்மை’ என்பதும் உண்மையான சொற்பொருள் மாற்றாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: கடவுளின் பரிவு மனந்திரும்புதலை உறுதியாக ஏற்படுத்துகிறதா அல்லது அதை நோக்கி நடத்துகிறதா
  choice: ‘மனந்திரும்புதலுக்கு வழிநடத்துகிறது’ என்று திசைநோக்கிய மொழியாக்கம்
  alternative: ‘மனந்திரும்பச் செய்கிறது’
  rationale: εἰς உடன் வரும் ἄγει இலக்கை நோக்கி நடத்துவதைச் சொல்கிறது; மனந்திரும்புதல் தவிர்க்க முடியாமல் நிகழ்கிறது என்று உரையில் இல்லாத முடிவை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபருக்குரிய பவுலின் நேரடியான கண்டனத் தொனி காக்கப்பட்டுள்ளது. தமிழில் இயல்பாகப் புரியும்படி ‘அறியாமல்’ தொடர் முதன்மை வினாவுக்கு முன்னால் வைக்கப்பட்டுள்ளது. ‘பொறுத்தருளுதல்’ என்பது கடவுளைக் குறிக்கும் மரியாதையான, ஆனால் பொதுவாசகருக்குப் புரியும் நடை.
