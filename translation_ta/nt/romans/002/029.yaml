id: ROM.2.29
reference: Romans 2:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: ta
  text: மாறாக, உள்ளார்ந்து யூதராக இருப்பவரே யூதர்; இதயத்தின் விருத்தசேதனம் ஆவியில்[a] உள்ளது; எழுத்தில் அல்ல. அவருடைய பாராட்டு மனிதர்களிடமிருந்து அல்ல, கடவுளிடமிருந்தே வருகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆவியில்’ என்பதை ‘தூய ஆவியினால்’ என்றும், ‘உள்ளார்ந்த ஆவிக்குரிய நிலையில்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: மூலத்தில் ἐν πνεύματι என்பதன் குறிப்பு முழுமையாகத் தெளிவாக இல்லை; தூய ஆவியைக் குறிக்கும் வாசிப்பையும் பொதுவான உள்ளார்ந்த ஆவிக்குரிய உண்மையைக் குறிக்கும் வாசிப்பையும் திறந்தவாறு வைக்கிறது.
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: உள்ளத்தில்
  rationale: வெளிப்படையான அடையாளத்திற்கு மாறாக மறைந்துள்ள உள்ளார்ந்த உண்மையைச் சுட்டுகிறது; ‘இரகசியமாக’ என்ற பொருளைத் தவிர்த்து, தமிழில் இயல்பாக இந்த எதிர்மறை இணையை வெளிப்படுத்துகிறது.
- source_word: Ἰουδαῖος
  choice: யூதர்
  rationale: இங்கு புவியியல் அடையாளத்தைவிட உடன்படிக்கை மற்றும் சமய அடையாளமே கருத்தாக இருப்பதால் ‘யூதர்’ பொருத்தமானது.
- source_word: περιτομὴ καρδίας
  choice: இதயத்தின் விருத்தசேதனம்
  rationale: பவுலின் உருவகத்தைத் தெளிவாகப் பாதுகாத்து, உடல் சார்ந்த வெளிப்புறச் சடங்குக்கும் உள்ளார்ந்த மாற்றத்திற்கும் உள்ள வேறுபாட்டைக் காட்டுகிறது.
- source_word: ἐν πνεύματι
  choice: ஆவியால்
  rationale: செயலின் வழிமுறை அல்லது செயல்படுத்துபவரைக் குறிக்கும் வாசிப்பை இயல்பான தமிழில் தருகிறது. ‘ஆவி’ தூய ஆவியைக் குறிக்கும் வாய்ப்பு முதன்மையாக ஏற்கப்பட்டாலும், மூலத்தின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οὐ γράμματι
  choice: எழுத்தினால் அல்ல
  rationale: γράμμα என்பதன் நேரடியான உருவகத்தைப் பாதுகாத்து, எழுதப்பட்ட சட்டக் குறியீட்டுக்கும் ஆவியின் செயலுக்கும் உள்ள பவுலின் எதிர்மறை இணையைத் தருகிறது.
- source_word: οὗ ὁ ἔπαινος
  choice: இப்படிப்பட்டவருக்குக் கிடைக்கும் பாராட்டு
  rationale: உள்ளார்ந்த யூதராக இருப்பவரையே தொடர்புப்பெயர் சுட்டுவதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐξ ἀνθρώπων
  choice: மனிதர்களிடமிருந்து
  rationale: பாலினம் சாராத பொதுவான மனித ஆதாரத்தைத் துல்லியமாகக் குறிக்கிறது.
- source_word: ἐκ τοῦ θεοῦ
  choice: கடவுளிடமிருந்தே
  rationale: பாராட்டின் ஆதாரம் கடவுள் என்பதையும், οὐ ... ἀλλά என்ற வலியுறுத்தப்பட்ட எதிர்மறை இணைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πνεύματι என்பது தூய ஆவியைக் குறிக்கிறதா, மனித ஆவியையா, அல்லது பொதுவான உள்ளார்ந்த ஆவிக்குரிய உண்மையையா?
  choice: முதன்மை உரையில் ‘ஆவியால்’ என்று கொடுத்து, தூய ஆவியின் செயலை முதன்மையான வாசிப்பாக அனுமதித்தல்
  alternative: ‘ஆவியில்’ அல்லது ‘உள்ளார்ந்த ஆவிக்குரிய நிலையில்’
  rationale: ‘ஆவி—எழுத்து’ என்ற பவுலின் எதிர்மறை இணை தூய ஆவியின் செயலைச் சுட்டக்கூடும்; ஆனால் ἐν என்ற முன்னிடைச்சொல்லும் πνεῦμα என்பதன் பொருள் வரம்பும் வேறு வாசிப்புகளுக்கு இடமளிப்பதால் அவை அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் உருவகத் தொடர்ச்சிக்காக வைக்கப்பட்டுள்ளது. மூல கிரேக்கத்தின் சுருக்கமான, விடுபட்ட வாக்கிய அமைப்பு தமிழில் புரியும்படி சற்றே வெளிப்படுத்தப்பட்டுள்ளது; தேவையற்ற கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
