  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: ta
  text: தீமை செய்கிற ஒவ்வொரு மனிதர்மீதும்[a] துன்பமும் நெருக்கடியும் வரும்—முதலில் யூதர்மீதும், மேலும் கிரேக்கர்மீதும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘ஒவ்வொரு மனித உயிரின்மீதும்’; பொருளில், ‘ஒவ்வொரு மனிதர்மீதும்.’'
    reason: lexical_alternative
  - marker: b
    text: ‘கிரேக்கர்’ என்பது இங்குள்ள யூதர்–கிரேக்கர் எதிரிணையில் யூதரல்லாதவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: துன்பம்
  rationale: கடுமையான வேதனை அல்லது இடுக்கண் என்ற பொருளை இன்றைய பொதுத் தமிழில் இயல்பாகத் தருகிறது; இதனுடன் வரும் στενοχωρία என்பதிலிருந்து வேறுபாடும் காக்கப்படுகிறது.
- source_word: στενοχωρία
  choice: நெருக்கடி
  rationale: சூழ்ந்தழுத்தும் துயரம், தப்பும் வழியற்ற இக்கட்டு ஆகிய சொல்லின் உருவக வலிமையைத் தக்கவைத்து, θλῖψις உடன் இயல்பான இணையாக அமைகிறது.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: ஒவ்வொரு மனிதர்மீதும்
  rationale: இங்கு ψυχή முழு மனிதரைக் குறிக்கும் வழக்கில் வருகிறது. தமிழில் ‘ஒவ்வொரு மனித ஆன்மாவின்மீதும்’ என்பது இயல்பற்றதோடு தேவையற்ற உடல்–ஆன்மா வேறுபாட்டையும் உணர்த்தக்கூடும்; மூலத்தின் சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ κατεργαζομένου
  choice: செய்கிற
  rationale: தொடர்ந்து செயல்படுத்துதல் என்ற participle-இன் கருத்தை மிகைப்படுத்தாமல், அறச்சூழலில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὸ κακόν
  choice: தீமை
  rationale: Articular neuter singular இங்கு பொதுவாகத் தீமையைக் குறிக்கிறது; ‘தீமை’ என்பது சுருக்கமானதும் இயல்பானதும் ஆகும்.
- source_word: Ἰουδαίου
  choice: யூதர்
  rationale: ரோமர் நிருபத்தில் உள்ள இன–மத மக்கள்குழுவைக் குறிக்கும் பயன்பாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: Ἕλληνος
  choice: கிரேக்கர்
  rationale: பவுலின் ‘யூதர்/கிரேக்கர்’ என்ற நேரடி இணைப்பைத் தக்கவைக்கிறது; ‘யூதரல்லாதவர்’ என்பது பொருள் விளக்கமான விரிவாக்கம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: வரிசை அல்லது முன்னுரிமையைத் தெளிவாகக் காட்டுகிறது; அதற்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: τε ... καί
  choice: …மீதும், அதுபோல …மீதும்
  rationale: யூதருக்கும் கிரேக்கருக்கும் தீர்ப்பு பொருந்துகிறது என்ற இணைப்பை இயல்பான தமிழில் தருகிறது; ‘முதலில்’ என்பதால் குறிப்பிடப்படும் முன்னுரிமையையும் அழிக்கவில்லை.
theological_decisions:
- issue: சுருக்கமான கிரேக்க வாக்கியத்தில் வெளிப்படையாக இல்லாத வினைப்பயனைக் தமிழில் நிறைவு செய்தல்
  choice: துன்பமும் நெருக்கடியும் வரும்
  alternative: தீமை செய்கிற ஒவ்வொரு மனிதர்மீதும் துன்பமும் நெருக்கடியும்
  rationale: தமிழில் முழுமையான வாக்கியமாக அமைய ‘வரும்’ சேர்க்கப்பட்டுள்ளது. இது சூழலில் உள்ள நியாயத்தீர்ப்பின் எதிர்கால விளைவை வெளிப்படுத்துகிறதே தவிர புதிய கோட்பாட்டுக் கருத்தைச் சேர்ப்பதில்லை.
- issue: ψυχή என்பதை ‘ஆன்மா’ என்று வடிவியல் முறையில் தருவதா, முழு மனிதரைக் குறிக்கும் சொல்லாகத் தருவதா
  choice: ஒவ்வொரு மனிதர்
  alternative: ஒவ்வொரு மனித ஆன்மா / ஒவ்வொரு மனித உயிர்
  rationale: இச்சூழலில் ψυχή ஒரு மனிதரை முழுமையாகக் குறிக்கிறது. ‘ஆன்மா’ என்ற மொழிபெயர்ப்பு தேவையற்ற மானுடவியல் பிரிவை வாசகனுக்குள் உருவாக்கலாம்; ஆயினும் மூலத்தின் உருவமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
