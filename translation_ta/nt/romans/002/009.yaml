  register: நவீன பொதுத் தமிழில் புரியக்கூடிய, ஆனால் தீர்ப்பின் தீவிரத்தையும் வாக்கியத்தின் கண்ணியத்தையும் காக்கும் நடை. ‘உபத்திரவம்’ போன்ற மரபுச் சொற்களுக்குப் பதிலாக ‘துன்பம்’ பயன்படுத்தப்பட்டது; ‘ஆன்மா’ ஏற்படுத்தக்கூடிய தேவையற்ற கோட்பாட்டுச் சாயலைத் தவிர்த்து மனிதரைக் குறிக்கும் மூலப் பொருள் முன்னிலைப்படுத்தப்பட்டது.
