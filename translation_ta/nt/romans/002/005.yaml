id: ROM.2.5
reference: Romans 2:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: ta
  text: ஆனால், உன் கடினத்தன்மையினாலும் மனந்திரும்பாத இதயத்தினாலும், கோபமும் கடவுளுடைய நீதியான தீர்ப்பின் வெளிப்பாடும் நிகழும் நாளுக்கென்று உனக்கே கோபத்தைக் குவித்துக்கொண்டிருக்கிறாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ δὲ
  choice: ஆனால், ... இனாலும்
  rationale: δέ-யின் மிதமான எதிர்மறைத் தொடர்பை “ஆனால்” காட்டுகிறது; κατά என்பதன் காரண/ஒத்திசைவு நுட்பத்தை இச்சூழலில் தமிழின் காரண வேற்றுமையான “-இனாலும்” இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σκληρότητά σου
  choice: உன் கடினத்தன்மை
  rationale: ஒழுக்க உணர்வின்மையைக் குறிக்கும் “கடினம்” என்ற மூல உருவகத்தைத் தக்கவைக்கிறது; “பிடிவாதம்” என்று விளக்கிப் பொருளைச் சுருக்கவில்லை.
- source_word: ἀμετανόητον καρδίαν
  choice: மனந்திரும்பாத இதயம்
  rationale: μετάνοια சார்ந்த மனந்திரும்புதல் கருத்தையும், καρδία என்பதன் இதய உருவகத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: θησαυρίζεις
  choice: குவித்துக்கொண்டிருக்கிறாய்
  rationale: தொடர்ந்து சேமித்துச் சேர்ப்பதைக் குறிக்கும் நிகழ்காலச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; நேர்மறை ஒலிப்புடைய “பொக்கிஷமாகச் சேர்க்கிறாய்” என்பதைத் தவிர்க்கிறது.
- source_word: σεαυτῷ
  choice: உனக்கே
  rationale: செயலின் விளைவு அந்த நபருக்கே திரும்புகிறது என்ற வலியுறுத்தலுடன் கூடிய தன்மறுப்புப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: ὀργή
  choice: கோபம்
  rationale: தெய்வீக நியாயத்தீர்ப்பின் தீவிரத்தைச் சூழல் தெரிவிக்க அனுமதிக்கும் வகையில், சாதாரண வாசகருக்குப் புரியும் நேரடியான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: கோபமும் ... வெளிப்படுதலும் நிகழும் நாளுக்காக
  rationale: கோபமும் வெளிப்பாடும் ஒரே “நாள்” என்பதுடன் இணைக்கப்பட்டுள்ள கிரேக்க அமைப்பைப் பாதுகாக்கிறது. எதிர்கால நாளுக்குரிய கோபம் இப்போது குவிக்கப்படுகிறது என்பதைத் தமிழில் தவறாகப் புரியாதபடி “நாளுக்காக” என இயல்பாக்கப்பட்டுள்ளது.
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: கடவுளுடைய நீதியான தீர்ப்பு
  rationale: δικαιοκρισία என்பதிலுள்ள தீர்ப்பின் நேர்மை/நீதி என்ற கூறையும், τοῦ θεοῦ என்பதன் உரிமை அல்லது மூலத் தொடர்பையும் வெளிப்படையாகத் தருகிறது.
theological_decisions:
- issue: இறுதி காலச் சொற்றொடரை வினைமுற்றுள்ள விளக்கவாக்கியமாக்குவதா, அல்லது கிரேக்கத்தின் பெயர்ச்சொல் அமைப்பை நெருக்கமாகப் பாதுகாப்பதா?
  choice: “கோபமும் கடவுளுடைய நீதியான தீர்ப்பு வெளிப்படுதலும் நிகழும் நாள்” என்று ஒரே நாளோடு இணைந்த இரண்டு கருத்துகளாக வழங்கப்பட்டது.
  alternative: “கடவுளுடைய நீதியான தீர்ப்பு வெளிப்படும் கோபத்தின் நாள்”
  rationale: மாற்று வாசகம் இயல்பானது; ஆனால் அது “கோபம்” மற்றும் “வெளிப்பாடு” என்ற இணையான பெயர்ச்சொற்களுக்கிடையிலான உறவை அடைமொழி அமைப்பாக மாற்றிவிடும். தேர்ந்த வாசகம் மூலத்தின் இணைப்பை அதிகமாகப் பாதுகாக்கிறது.
- issue: ἐν ἡμέρᾳ என்பதைக் கண்டிப்பாக “நாளில்” என்று தருவதா?
  choice: “நாளுக்காக”
  alternative: “நாளில்”
  rationale: தமிழில் “அந்த நாளில் ... குவித்துக்கொண்டிருக்கிறாய்” என்பது குவிக்கும் செயல் எதிர்கால நாளில்தான் நடைபெறும் என்று தவறாக உணர்த்தக்கூடும். இப்போது சேர்க்கப்படும் கோபம் அந்தத் தீர்ப்பு நாளுக்குரியது என்ற சூழல்பொருளை “நாளுக்காக” தெளிவாகக் காட்டுகிறது; தீர்ப்பின் தன்மை குறித்து கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. “இதயம்,” “குவித்துக்கொண்டிருக்கிறாய்” போன்ற மூல உருவகங்களும் செயற்பாங்கும் பாதுகாக்கப்பட்டுள்ளன; மிகப் பழமையான அல்லது தனிப்பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
