id: ROM.2.13
reference: Romans 2:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: ta
  text: ஏனெனில், திருச்சட்டத்தைக் கேட்பவர்கள் கடவுளின் முன்னிலையில் நீதிமான்கள் அல்ல; திருச்சட்டத்தைக் கடைப்பிடிப்பவர்களே நீதிமான்கள் என்று அறிவிக்கப்படுவார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிமான்களாகத் தீர்ப்பிடப்படுவார்கள்”; வேறொரு பொருளில், “நீதியுள்ளவர்கள் என்று மெய்ப்பிக்கப்படுவார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: கேட்பவர்கள்
  rationale: வெறுமனே திருச்சட்டத்தைக் கேட்பவர்களுக்கும் அதன்படி செய்பவர்களுக்கும் இடையிலான பவுலின் நேரடியான முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: νόμου
  choice: திருச்சட்டத்தை / திருச்சட்டத்தின்படி
  rationale: இச்சூழலில் விவாதிக்கப்படும் கடவுளுடைய சட்டத்தை இயல்பான நவீன தமிழில் சுட்டுகிறது; கிரேக்கத்தில் சுட்டிடைச்சொல் இல்லாததைக் கொண்டு தேவையற்ற தெளிவின்மையை உருவாக்கவில்லை.
- source_word: δίκαιοι
  choice: நீதிமான்கள்
  rationale: கடவுளின் மதிப்பீட்டில் நீதியுள்ளவர்களாக இருப்பதைக் குறிக்கும் பவுலின் சொல்லாட்சியுடன் தொடர்ச்சியைப் பேணுகிறது.
- source_word: παρὰ τῷ θεῷ
  choice: கடவுளின் முன்னிலையில்
  rationale: கடவுளுடைய மதிப்பீடு அல்லது தீர்ப்பில் ஒருவரின் நிலையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ποιηταὶ
  choice: செய்பவர்கள்
  rationale: ‘கேட்பவர்கள்’ என்பதற்கு எதிரான கிரேக்கச் சொல்லமைப்பைப் பாதுகாத்து, திருச்சட்டத்தின்படி செயல்படுவோரைக் குறிக்கிறது.
- source_word: δικαιωθήσονται
  choice: நீதிமான்களாக்கப்படுவார்கள்
  rationale: δικαιόω என்ற முக்கியமான பவுலின் சொல்லின் இறையியல் நிறையையும் செயப்பாட்டு வடிவத்தையும் பேணுகிறது; அறிவிக்கப்படுதல் அல்லது மெய்ப்பிக்கப்படுதல் என்ற நுட்பங்களை அடிக்குறிப்பில் திறந்துவைக்கிறது.
theological_decisions:
- issue: δικαιωθήσονται என்பதன் நீதித்தீர்ப்பு சார்ந்த மற்றும் மெய்ப்பித்தல் சார்ந்த நுட்பங்களைத் தேவையின்றி ஒன்றாகச் சுருக்காமல் மொழிபெயர்த்தல்
  choice: நீதிமான்களாக்கப்படுவார்கள்
  alternative: நீதிமான்கள் என்று அறிவிக்கப்படுவார்கள்; நீதியுள்ளவர்கள் என்று மெய்ப்பிக்கப்படுவார்கள்
  rationale: முதன்மை உரை பவுலின் முக்கியச் சொல்லுடன் சொற்களஞ்சியத் தொடர்ச்சியைப் பேணுகிறது; மாற்று மொழிபெயர்ப்புகள் அதன் சாத்தியமான நீதித்தீர்ப்பு மற்றும் மெய்ப்பித்தல் நுட்பங்களை வெளிப்படையாகக் காட்டுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கேட்பவர்கள்—செய்பவர்கள்’ என்ற சொல்லிணைவு மூலமொழியின் நேரடி வாத முரண்பாட்டைப் பேணுகிறது.
