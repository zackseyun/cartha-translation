revisions:
- from: ஏனெனில், திருச்சட்டத்தைக் கேட்பவர்கள் கடவுளின் முன்னிலையில் நீதிமான்கள் அல்ல; திருச்சட்டத்தின்படி செய்பவர்களே நீதிமான்களாக்கப்படுவார்கள்[a].
  to: ஏனெனில், திருச்சட்டத்தைக் கேட்பவர்கள் கடவுளின் முன்னிலையில் நீதிமான்கள் அல்ல; திருச்சட்டத்தைக் கடைப்பிடிப்பவர்களே நீதிமான்கள் என்று அறிவிக்கப்படுவார்கள்[a].
  rationale: The revised wording preserves Paul’s hearers/doers antithesis and the future passive force. It removes an avoidable transformative implication from the rendering of δικαιόω, while the footnote retains the possible judicial and vindicatory nuances without imposing a doctrinal interpretation.
