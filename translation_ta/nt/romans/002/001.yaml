review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential force of Διὸ, the universal address to those who judge, the stronger condemnatory force of κατακρίνεις, and the charge that the judge does the same things. A revision better retains the instrumental/self-incriminating nuance of ἐν ᾧ by rendering it as ‘in the very act of judging.’
  naturalness: “சாக்குப்போக்கு இல்லை” is understandable but somewhat colloquial and can imply a flimsy pretext rather than the lack of a defensible answer. “உனக்குத் தற்காப்பாகச் சொல்ல எதுவும் இல்லை” is natural modern Tamil and better fits the forensic setting. The original parenthetical “நீ யாராயிருந்தாலும்” is also less direct than the source’s universal vocative.
  terminology: “குற்றவாளியாகத் தீர்க்கிறாய்” appropriately distinguishes κατακρίνεις from κρίνεις. “தீர்ப்பிடுகிற” consistently renders the judging motif. A footnote should preserve that “மனிதனே” renders a grammatically masculine singular Greek address with representative force.
  issues:
  - severity: medium
    issue: “சாக்குப்போக்கு இல்லை” is too colloquial and slightly narrows ἀναπολόγητος.
    rationale: The Greek denotes being without a defense or excuse in a judicial sense, not merely having no evasive pretext.
  - severity: low
    issue: “மற்றொருவரை நீ தீர்ப்பிடும்போது” primarily expresses time, while ἐν ᾧ also presents the act of judging as the basis/means of self-condemnation.
    rationale: “மற்றொருவரைத் தீர்ப்பிடுவதிலேயே” naturally preserves the rhetorical point that the judging act itself condemns the judge.
  - severity: low
    issue: The representative force of the masculine singular address is explained within metadata but not supplied as a reader-facing footnote.
    rationale: A concise footnote preserves the Greek grammatical form and its inclusive referent without altering the direct rhetorical address.
  revised_text: ஆகையால், தீர்ப்பிடுகிற ஒவ்வொரு மனிதனே,[a] உனக்குத் தற்காப்பாகச் சொல்ல எதுவும் இல்லை. ஏனெனில், மற்றொருவரைத் தீர்ப்பிடுவதிலேயே உன்னையே குற்றவாளியாகத் தீர்க்கிறாய்; தீர்ப்பிடுகிற நீ அதே செயல்களைச் செய்கிறாய்.
