id: ROM.2.1
reference: Romans 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: ta
  text: ஆகையால், தீர்ப்பிடுகிற ஒவ்வொரு மனிதனே,[a] உனக்குத் தற்காப்பாகச் சொல்ல எதுவும் இல்லை. ஏனெனில், மற்றொருவரைத் தீர்ப்பிடுவதிலேயே உன்னையே குற்றவாளியாகத் தீர்க்கிறாய்; தீர்ப்பிடுகிற நீ அதே செயல்களைச் செய்கிறாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு நபரே” அல்லது “ஒவ்வொரு மனிதரே.” கிரேக்கத்தில் ஆண்பால் ஒருமை வடிவம் உள்ளது; ஆனால் இது பொதுவாகத் தீர்ப்பிடுகிற எவரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: ஆகையால்
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἀναπολόγητος
  choice: சாக்குப்போக்கு இல்லை
  rationale: நியாயத்தீர்ப்பின் முன் ஏற்கத்தக்க தற்காப்போ காரணமோ இல்லாத நிலையைச் சாதாரண வாசகருக்குப் புரியும் தமிழில் தெரிவிக்கிறது.
- source_word: ὦ ἄνθρωπε πᾶς ὁ κρίνων
  choice: தீர்ப்பிடுகிற மனிதனே—நீ யாராயிருந்தாலும்
  rationale: ἄνθρωπε என்பதன் ஒருமை நேரடி அழைப்பையும் πᾶς ὁ κρίνων என்பதன் அனைவரையும் உள்ளடக்கும் வலிமையையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον
  choice: மற்றொருவரை நீ தீர்ப்பிடும்போது
  rationale: ἐν ᾧ என்பதில் காலமும் செயல்வழியும் கலந்துள்ளன; தமிழ் வாக்கியத்தில் இயல்பாக இருக்கும்படி காலநிலையை முன்னிறுத்தி, தீர்ப்பிடும் செயலே தன்னைத் தண்டிக்கும் சூழல் என்பதைக் காக்கிறது.
- source_word: κατακρίνεις
  choice: குற்றவாளியாகத் தீர்க்கிறாய்
  rationale: κρίνεις என்பதைவிட வலுவான கண்டனத் தீர்ப்பைத் தெளிவாக வேறுபடுத்திக் காட்டுகிறது.
- source_word: τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων
  choice: தீர்ப்பிடுகிற நீயே அதே செயல்களைச் செய்துவருகிறாய்
  rationale: நிகழ்கால πράσσεις குறிக்கும் தொடர்ச்சியான நடைமுறையையும் ὁ κρίνων என்ற வலியுறுத்தப்பட்ட அடையாளத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுலின் கண்டனத்தில் வரும் பிரதிநிதித்துவ ஆண்பால் ஒருமை அழைப்பு
  choice: முதன்மை உரையில் “மனிதனே” என்று வைத்து, “நீ யாராயிருந்தாலும்” என்பதால் அதன் அனைவரையும் உள்ளடக்கும் பொருளை வெளிப்படுத்துதல்
  alternative: “மனிதரே” அல்லது “ஒருவரே”
  rationale: ὦ ἄνθρωπε என்ற ஒருமை நேரடி அழைப்பின் சொல்லாட்சியைப் பாதுகாத்தபடியே πᾶς ὁ κρίνων குறிக்கும் உலகளாவிய பொருந்துதலைத் தெளிவாக்குகிறது; இதை ஒரு பாலினத்தவருக்கு மட்டும் கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான நேரடி கண்டனத் தொனி. “தீர்ப்பிடுதல்” மற்றும் “குற்றவாளியாகத் தீர்த்தல்” மூலம் κρίνω/κατακρίνω வேறுபாடு காக்கப்பட்டுள்ளது. இயல்பான தமிழுக்காக நீளமான கிரேக்க வாக்கியம் இரண்டு வாக்கியங்களாகப் பிரிக்கப்படவில்லை; நிறுத்தக்குறிகளால் அதன் வாத ஓட்டம் தெளிவாக்கப்பட்டுள்ளது.
