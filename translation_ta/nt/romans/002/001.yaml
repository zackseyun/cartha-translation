revisions:
- from: ஆகையால், தீர்ப்பிடுகிற மனிதனே—நீ யாராயிருந்தாலும்—உனக்குச் சாக்குப்போக்கு இல்லை. ஏனெனில், மற்றொருவரை நீ தீர்ப்பிடும்போது உன்னையே குற்றவாளியாகத் தீர்க்கிறாய்; தீர்ப்பிடுகிற நீயே அதே செயல்களைச் செய்துவருகிறாய்.
  to: ஆகையால், தீர்ப்பிடுகிற ஒவ்வொரு மனிதனே,[a] உனக்குத் தற்காப்பாகச் சொல்ல எதுவும் இல்லை. ஏனெனில், மற்றொருவரைத் தீர்ப்பிடுவதிலேயே உன்னையே குற்றவாளியாகத் தீர்க்கிறாய்; தீர்ப்பிடுகிற நீ அதே செயல்களைச் செய்கிறாய்.
  rationale: The revision replaces a colloquial expression for ‘without excuse’ with a judicially appropriate modern Tamil expression, makes the universal vocative more direct, and restores the source’s implication that judging another is itself the ground of self-condemnation. It retains the distinction between judging and condemning, and provides a reader-facing note for the representative masculine singular address.
  reviewer_model: gpt-5.6-terra
