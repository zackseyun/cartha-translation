source:
  edition: SBLGNT
  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: ta
  text: நன்மை செய்வதில் நிலைத்திருந்து, மகிமையையும் மரியாதையையும் அழியாமையையும் தேடுகிறவர்களுக்கு நித்திய வாழ்வை அளிப்பார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: நன்மை செய்வதில் விடாமுயற்சியோடு நிலைத்திருந்து
  rationale: ὑπομονή குறிக்கும் தொடர்ந்த பொறுமையையும் நிலைத்திருப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது; ἔργου ἀγαθοῦ என்பதை சூழலுக்கேற்ற செயற்பாட்டு பொருளில் ‘நன்மை செய்வதில்’ என வழங்குகிறது.
- source_word: δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν
  choice: மகிமையையும் கனத்தையும் அழியாமையையும்
  rationale: மூன்று தனித்த இலக்குகளையும் இணை அமைப்பில் காக்கிறது; ἀφθαρσία என்பது அழிவுக்கும் சிதைவுக்கும் உட்படாத நிலையைக் குறிக்கும்.
- source_word: ζητοῦσιν
  choice: தேடுகிறவர்களுக்கு
  rationale: தொடர்ச்சியான நோக்கமுள்ள தேடலைக் காட்டும் நிகழ்காலப் பங்கேற்பு வடிவத்தின் பொருளைப் பாதுகாக்கிறது.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வை
  rationale: கால அளவையும் வரவிருக்கும் யுக வாழ்வின் கருத்தையும் சுருக்கமாகவும் மரபாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: நன்மை செய்வதற்கும் நித்திய வாழ்விற்கும் உள்ள தொடர்பு
  choice: மூலவாக்கியத்தின் நேரடியான நிபந்தனைச் சார்பை அப்படியே வைத்தல்
  alternative: இதை விசுவாசத்தின் சான்று அல்லது வெறும் கருதுகோள் என விளக்கிச் சேர்த்தல்
  rationale: இந்த வசனம் தானாக வழங்காத முறையியல் விளக்கத்தை மொழிபெயர்ப்பில் புகுத்தாமல், பவுலின் வாதத்தில் உள்ள இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: வினைச்சொல் வெளிப்படையாக இல்லாமை
  choice: தமிழில் முழுமையான வாக்கியத்திற்காக ‘அளிப்பார்’ எனச் சேர்த்தல்
  alternative: ‘நித்திய வாழ்வு’ என்று வினையில்லாத துண்டுவாக்கியமாக விடுதல்
  rationale: கிரேக்கத்தில் 2:6-இன் ‘அளிப்பார்’ என்ற வினை இவ்வசனத்திலும் தொடர்கிறது; தமிழில் அதை வெளிப்படுத்துவது பொருளைத் தீர்மானித்து மாற்றாமல் இலக்கணத் தெளிவை வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘விடாமுயற்சியோடு நிலைத்திருந்து’ என்பது ὑπομονήயின் பொறுமை மற்றும் தொடர்ச்சி ஆகிய இரு நுணுக்கங்களையும் எடுத்துரைக்கிறது.
