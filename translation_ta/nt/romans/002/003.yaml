id: ROM.2.3
reference: Romans 2:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: ta
  text: ஆனால், மனிதனே,[a] இப்படிப்பட்டவற்றைச் செய்கிறவர்களைத் தீர்ப்பிடுகிறவனும் அவற்றையே செய்கிறவனுமான நீ, கடவுளின் தீர்ப்பிலிருந்து தப்பிவிடுவாய் என்று எண்ணுகிறாயா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனிதனே’ என்பது கிரேக்கத்தில் ஆண்பால் ஒருமை விளி வடிவம்; இங்கு ஒரு பிரதிநிதி மனிதரை நேரடியாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: எண்ணுகிறாயா
  rationale: மனத்தில் கணித்தல் அல்லது கருதுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; கேள்வி வடிவம் தவறான நம்பிக்கையைச் சவாலிடும் சொல்லாட்சியையும் காக்கிறது.
- source_word: ἄνθρωπε
  choice: மனிதனே
  rationale: ஒரு பிரதிநிதி மனிதரை நேரடியாக அழைக்கும் ஒருமை விளியைப் பாதுகாக்கிறது; நவீனத் தமிழில் இயல்பாகவும் பாலினத்தைத் தேவையின்றி குறுக்காமலும் உள்ளது.
- source_word: κρίνων
  choice: தீர்ப்பிடுகிற
  rationale: இங்கு பிறருடைய நடத்தையை நியாயத் தீர்ப்புக்கு உட்படுத்தும் செயலை நேரடியாகக் குறிக்கிறது; ‘கண்டனம் செய்கிற’ என்பது மூலத்தைவிட வலிமையானதாக இருக்கலாம்.
- source_word: πράσσοντας
  choice: செய்கிறவர்களை
  rationale: தொடர்ச்சியான நடத்தையைக் குறிக்க நிகழ்கால உறவெச்சம் பயன்படுத்தப்படுகிறது. தமிழில் ποιῶν உடனான நுண்ணிய சொல்வேறுபாட்டை வற்புறுத்துவது இயல்பற்றதாக இருக்கும்.
- source_word: ποιῶν αὐτά
  choice: அவற்றைச் செய்துகொண்டிருக்கும்போது
  rationale: முன் கூறிய ‘இப்படிப்பட்டவற்றை’ தெளிவாகச் சுட்டுகிறது; நிகழ்ந்துகொண்டிருக்கும் முரண்பாடான நடத்தையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκφεύξῃ
  choice: தப்பிவிடுவாய்
  rationale: வரவிருக்கும் தெய்வீகத் தீர்ப்பிலிருந்து தப்புதல் என்ற எதிர்கால நோக்கையும் வினாவையும் தெளிவாகக் காக்கிறது.
- source_word: κρίμα τοῦ θεοῦ
  choice: கடவுளின் தீர்ப்பு
  rationale: தீர்ப்பு, தீர்ப்புரை, தண்டனை ஆகிய சட்டவியல் நிழற்பொருள்களை முன்கூட்டியே ஒன்றாகக் குறுக்காமல், பரந்த நீதித்துறைப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: κρίμα என்பது தீர்ப்புச் செயலைக் குறிக்கிறதா, தீர்ப்புரையையா, தண்டனையையா?
  choice: தீர்ப்பு
  alternative: தீர்ப்புரை / தண்டனை
  rationale: சூழல் கடவுளுடைய நீதித்தீர்ப்பை பரந்த வகையில் குறிக்கிறது; குறிப்பாக தீர்ப்புரை அல்லது தண்டனை என்று மொழிபெயர்ப்பது மூலத்தின் பொருள் எல்லையைத் தேவையின்றி சுருக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான வினாவாக வடிவமைக்கப்பட்டுள்ளது. பவுலின் உரையாடல்-வாத பாணியையும் ‘நீயே’ என்பதன் குற்றஞ்சாட்டும் வலியுறுத்தலையும் காக்கிறது; மூலத்தில் இல்லாத சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
