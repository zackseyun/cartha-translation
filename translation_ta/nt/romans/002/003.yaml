- from: ஆனால் மனிதனே,[a] இப்படிப்பட்டவற்றைச் செய்கிறவர்களைத் தீர்ப்பிடுகிற நீயே அவற்றைச் செய்துகொண்டிருக்கும்போது, கடவுளின் தீர்ப்பிலிருந்து நீ தப்பிவிடுவாய் என்று எண்ணுகிறாயா?
  to: ஆனால், மனிதனே,[a] இப்படிப்பட்டவற்றைச் செய்கிறவர்களைத் தீர்ப்பிடுகிறவனும் அவற்றையே செய்கிறவனுமான நீ, கடவுளின் தீர்ப்பிலிருந்து தப்பிவிடுவாய் என்று எண்ணுகிறாயா?
  rationale: The revision replaces the temporal expression with coordinated descriptions (‘தீர்ப்பிடுகிறவனும் … செய்கிறவனுமான நீ’), reflecting the two Greek present participles without adding a temporal relation. It retains the direct singular address, the rhetorical question, the reference to doing the same things, and the broad judicial sense of God’s judgment.
