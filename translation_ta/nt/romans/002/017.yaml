- from: ஆனால், நீ உன்னை யூதன் என்று அழைத்துக்கொண்டு,[a] திருச்சட்டத்தைச் சார்ந்திருந்து,[b] கடவுளைக் குறித்து பெருமைபாராட்டுகிறாய் என்றால்—
  to: ஆனால், நீ உன்னை யூதன் என்று அழைத்துக்கொண்டு,[a] திருச்சட்டத்தைச் சார்ந்திருந்து,[b] கடவுளில் பெருமை கொள்கிறாய் என்றால்—
