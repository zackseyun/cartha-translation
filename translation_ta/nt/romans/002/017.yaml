  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: ta
  text: ஆனால், நீ உன்னை யூதன் என்று அழைத்துக்கொண்டு,[a] திருச்சட்டத்தைச் சார்ந்திருந்து,[b] கடவுளில் பெருமை கொள்கிறாய் என்றால்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதன் என்ற பெயரைத் தாங்கிக்கொண்டு” அல்லது “யூதன் என்று அழைக்கப்பட்டு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “திருச்சட்டத்தில் இளைப்பாறி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: ஆனால் … என்றால்
  rationale: εἰ என்பதன் நிபந்தனைப் பொருளையும் δέ என்பதன் மிதமான எதிர்மறைத் தொடர்ச்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἰουδαῖος
  choice: யூதன்
  rationale: இங்கு புவியியல் அடையாளத்தைவிட இன-சமய அடையாளமே முதன்மை; ஆகவே ‘யூதன்’ பொருத்தமானது.
- source_word: ἐπονομάζῃ
  choice: உன்னை … என்று அழைத்துக்கொண்டு
  rationale: மத்திய வினை வடிவத்தின் தற்சுட்டுப் பொருளையும், அந்தப் பெயரைத் தனக்கென உரிமைகோருவதில் உள்ள பவுலின் சொற்பொழிவு அழுத்தத்தையும் வெளிப்படுத்துகிறது.
- source_word: ἐπαναπαύῃ
  choice: சார்ந்திருந்து
  rationale: உடல்சார்ந்த ஓய்வைக் காட்டாமல், திருச்சட்டத்தின் மீது நம்பிக்கை வைத்திருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: νόμῳ
  choice: திருச்சட்டத்தை
  rationale: இங்கு மோசேயின் சட்டம் எனும் உடன்படிக்கைச் சட்டத் தொகுப்பைக் குறிக்கிறது; ‘திருச்சட்டம்’ அதைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: καυχᾶσαι
  choice: பெருமைபாராட்டுகிறாய்
  rationale: καυχάομαι என்பதிலுள்ள வலுவான பெருமைகொள்ளுதல்/பெருமை பேசுதல் என்ற பவுலிய நயத்தைத் தக்கவைக்கிறது.
- source_word: ἐν θεῷ
  choice: கடவுளைக் குறித்து
  rationale: ἐν இங்கு பெருமைபாராட்டுதலின் அடிப்படை அல்லது பொருளைக் குறிக்கலாம்; தமிழில் இயல்பாக இருக்க ‘கடவுளைக் குறித்து’ என வழங்கப்பட்டுள்ளது, ‘கடவுளில்’ என்ற நேரடி வடிவத்தின் சாத்தியம் குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ἐν θεῷ என்பதன் தொடர்பு
  choice: கடவுளைக் குறித்து பெருமைபாராட்டுகிறாய்
  alternative: கடவுளில் பெருமைபாராட்டுகிறாய்
  rationale: இரு வடிவங்களும் சாத்தியம். முதன்மை உரை இயல்பான தமிழில் பெருமையின் பொருளை வெளிப்படுத்துகிறது; அதேவேளை கிரேக்க முன்னிடைச்சொல்லின் நேரடி வடிவம் இறையியல் ரீதியாக விலக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இந்த வசனம் 2:18–20 வரை நீளும் நிபந்தனை வாக்கியத்தின் தொடக்கம் என்பதால் முடிவில் நீள்கோடு வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை சார்ந்த சொற்றொடர்களுக்குப் பின் வரிசையாக இடப்பட்டுள்ளன.
