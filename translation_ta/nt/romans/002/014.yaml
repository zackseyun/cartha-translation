id: ROM.2.14
reference: Romans 2:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: ta
  text: ஏனெனில், சட்டம் இல்லாத பிற இனத்தார்[a] இயல்பாக[b] சட்டத்திற்குரியவற்றை[c] செய்யும்போதெல்லாம், சட்டம் இல்லாத அவர்களே தங்களுக்கே சட்டமாக இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உள்ளுணர்வால்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “சட்டம் கோருவதைச் செய்யும்போதெல்லாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: பிற இனத்தார்
  rationale: இங்கு யூதர்களுக்கும் மோசேயின் சட்டத்தைப் பெற்றிராத பிற மக்களுக்கும் இடையிலான வேறுபாடு கருத்தில் உள்ளது. ‘பிற இனத்தார்’ என்பது அந்த இன-சமயப் பொருளை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது; அதேவேளையில் ‘நாடுகள்’ என்ற விரிவான பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: νόμον / νόμου / νόμος
  choice: சட்டம்
  rationale: மூன்று இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது பவுலின் சொல் மீளுருவாக்கத்தையும், இறுதியில் வரும் ‘தங்களுக்குத் தாங்களே சட்டம்’ என்ற உருவகத் தொடர்ச்சியையும் பாதுகாக்கிறது. சூழல் மோசேயின் சட்டத்தைச் சுட்டினாலும், மூலத்தில் இல்லாத விளக்கத்தைச் சொல்லுக்குள் சேர்க்காமல் ‘சட்டம்’ என வைக்கப்பட்டுள்ளது.
- source_word: φύσει
  choice: இயல்பாக
  rationale: இந்தச் சொல் உள்ளார்ந்த ஒழுக்க அறிவையா, இயற்கையான நிலையையா, அல்லது இயல்பான செயல்பாட்டையா குறிக்கிறது என்பதைத் தீர்மானிக்காமல் கிரேக்கத்தின் பொருள் திறப்பைப் பாதுகாக்கிறது.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: சட்டத்திற்குரியவற்றைச் செய்யும்போதெல்லாம்
  rationale: ‘சட்டத்திற்குரியவை’ என்பது மூலத்தின் சொற்றொடர் அமைப்பைத் தென்படச் செய்கிறது. ‘சட்டம் கோருவதைச் செய்கிறார்கள்’ என்ற தெளிவான, ஆனால் சற்றே விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: தங்களுக்குத் தாங்களே சட்டமாக இருக்கிறார்கள்
  rationale: பிறர் கொடுத்த சட்டம் இல்லாத நிலையிலும் அவர்கள் தாமே சட்டத்தின் பங்கை வகிக்கிறார்கள் என்ற உருவகத்தைப் பாதுகாக்கிறது; தாங்களே சட்டங்களை இயற்றிக்கொள்கிறார்கள் என்ற தேவையற்ற வலியுறுத்தலைத் தவிர்க்கிறது.
theological_decisions:
- issue: φύσει என்பது ஒழுக்க அறிவும் மனச்சாட்சியும் தொடர்பாக எதைத் தெளிவாகக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘இயல்பாக’ என்று வைத்து அதன் பரந்த பொருள் வாய்ப்பைப் பாதுகாத்தல்.
  alternative: ‘உள்ளுணர்வால்’ அல்லது ‘தங்கள் இயல்புணர்வின்படி’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: φύσει என்ற ஒரு சொல் மட்டுமே பிற இனத்தாரின் செயலை உள்ளார்ந்த மனச்சாட்சி, இயற்கை நிலை, அல்லது இயல்பான நடத்தை ஆகியவற்றுள் ஒன்றாகக் குறுக்கிவிடவில்லை. ஆகவே பவுலின் வாதத்தில் உள்ள இறையியல் பதற்றம் தீர்க்கப்படாமல் விடப்படுகிறது.
- issue: νόμος என்பதை வெளிப்படையாக ‘மோசேயின் திருச்சட்டம்’ என அடையாளப்படுத்த வேண்டுமா?
  choice: சூழல் மோசேயின் சட்டத்தை நோக்கினாலும், முதன்மை உரையில் ‘சட்டம்’ என்றே மொழிபெயர்த்து மூலத்தின் சொல் விளையாட்டைப் பாதுகாத்தல்.
  alternative: முதல் குறிப்புகளில் ‘மோசேயின் திருச்சட்டம்’ என்றும் இறுதியில் ‘சட்டம்’ என்றும் வேறுபடுத்தல்.
  rationale: ஒரே கிரேக்கச் சொல் மீண்டும் மீண்டும் வந்து இறுதியில் உருவகமாகப் பயன்படுத்தப்படுகிறது. வெவ்வேறு தமிழ்ச் சொற்களைப் பயன்படுத்துவது அந்தச் சொல்லியல் மற்றும் கருத்தியல் தொடர்ச்சியை மறைத்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாக வாசிக்கக்கூடிய, ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எப்போதெல்லாம்’ என்ற பொதுநிலைப் பொருளை ‘செய்யும்போதெல்லாம்’ எடுத்துரைக்கிறது. கிரேக்கத்தில் மீளும் νόμος தமிழிலும் ‘சட்டம்’ எனத் தொடர்ந்து வைக்கப்பட்டுள்ளது.
