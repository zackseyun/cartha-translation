lexical_decisions:
- source_word: γινώσκεις
  choice: அறிந்து
  rationale: நிகழ்காலத்தில் உண்மையான அறிவைப் பெற்றிருப்பதை இயல்பான தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: τὸ θέλημα
  choice: கடவுளின் சித்தத்தை
  rationale: கிரேக்கத்தில் உடைமைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய சூழலில் கடவுளே குறிக்கப்படுகிறார். ‘கடவுளின்’ என்பது தமிழில் அந்த மறைமுகக் குறிப்பைத் தெளிவாக்குகிறது; மூலத்தின் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δοκιμάζεις
  choice: ஆராய்ந்து ஏற்றுக்கொள்கிறாய்
  rationale: சோதித்து மதிப்பிட்டு, தகுந்தது என்று ஏற்றுக்கொள்ளும் வினையின் செயற்பாட்டையும் முடிவையும் இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: τὰ διαφέροντα
  choice: சிறந்தவை எவை என்பதை
  rationale: இச்சொற்றொடர் சொல்லுக்குச் சொல் ‘வேறுபடுகிறவை’ என்றும், சூழலுக்கேற்ற வழக்கில் ‘சிறந்தவை’ என்றும் பொருள்படலாம். முதன்மை உரையில் இயல்பான சூழற்பொருள் தரப்பட்டு, உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κατηχούμενος
  choice: போதிக்கப்பட்டிருப்பதால்
  rationale: செயப்பாட்டு வினையெச்சத்தின் கற்பித்தல் சார்ந்த பொருளையும், இந்த அறிவுக்கும் பகுத்தறிவுக்கும் அது காரணம் அல்லது அடிப்படை என்பதையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐκ τοῦ νόμου
  choice: திருச்சட்டத்திலிருந்து
  rationale: ἐκ என்பதன் மூலாதாரப் பொருளை ‘இலிருந்து’ காக்கிறது. இச்சூழலில் கடவுள் கொடுத்த சட்டத்தைக் குறிக்க நவீன வாசகருக்குப் புரியும் ‘திருச்சட்டம்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: τὸ θέλημα என்பதில் உடைமையாளர் வெளிப்படையாகக் கூறப்படாதது
  choice: கடவுளின் சித்தம்
  alternative: சித்தம்
  rationale: ரோமர் 2:17-இன் உடனடி சூழலில் கடவுளே இயல்பான குறிப்பு. இருப்பினும் கிரேக்கத்தில் ‘அவருடைய’ என்ற சொல் இல்லாதது அடிக்குறிப்பில் வெளிப்படையாகத் தெரிவிக்கப்படுகிறது.
- issue: τὰ διαφέροντα என்பதன் இருபொருள் வாய்ப்பு
  choice: சிறந்தவை எவை என்பதை ஆராய்ந்து ஏற்றுக்கொள்கிறாய்
  alternative: வேறுபடுகிறவற்றைச் சோதித்து ஏற்றுக்கொள்கிறாய்
  rationale: நெறிசார் மதிப்பீட்டுச் சூழலில் ‘சிறந்தவை’ என்பது இயல்பான பொருள்; ஆனால் ‘வேறுபடுகிறவை’ என்ற நேரடி பொருளை அடிக்குறிப்பில் வைப்பதால் மூலத்தின் தெளிவின்மை மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. வசனம் முந்தைய நிபந்தனைத் தொடரின் ஒரு பகுதியாக இருப்பதால் இரண்டாம் நபர் ஒருமை வடிவமும் தொடக்க இணைப்பான ‘மேலும்’ என்பதும் காக்கப்பட்டுள்ளன. ‘நியாயப்பிரமாணம்’ போன்ற பழைய வழக்குக்குப் பதிலாக ‘திருச்சட்டம்’ பயன்படுத்தப்பட்டுள்ளது.
