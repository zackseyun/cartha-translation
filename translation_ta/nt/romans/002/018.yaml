  text: மேலும், திருச்சட்டத்திலிருந்து போதனை பெற்று, கடவுளின் சித்தத்தை[a] அறிந்து, சிறந்தவை எவை என்பதை ஆராய்ந்து ஏற்றுக்கொள்கிறாய்[b].
