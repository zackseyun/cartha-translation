  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: ta
  text: திருச்சட்டத்தில் பெருமை கொள்கிற நீ, திருச்சட்டத்தை மீறுவதன் மூலம்[a] கடவுளை அவமதிக்கிறாயா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருச்சட்டத்தை மீறுவதால்.”
    reason: διά உடன் வரும் παράβασις என்ற பெயர்ச்சொல் அமைப்பைத் தமிழில் காரணமாகவோ வழிமுறையாகவோ இயல்பாக வெளிப்படுத்தக்கூடிய மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: திருச்சட்டத்தில்
  rationale: ἐν என்பதன் இடவுருவை இயன்றவரைத் தக்கவைத்து, சூழலில் νόμος என்பது யூதருக்குக் கொடுக்கப்பட்ட சட்டத்தைக் குறிப்பதைத் தெளிவாக்குகிறது. ‘திருச்சட்டம்’ என்பது சாதாரண அரசுச் சட்டத்திலிருந்து இதை வேறுபடுத்தும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: καυχᾶσαι
  choice: பெருமை கொள்கிற
  rationale: பவுலின் குற்றஞ்சாட்டும் தொனியையும், ஒருவர் தமக்குள்ள சிறப்பாக ஒன்றைக் கருதிப் பெருமைப்படும் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: திருச்சட்டத்தை மீறுவதன் மூலம்
  rationale: παράβασις என்ற பெயர்ச்சொல்லைச் சொற்சொல்லாகக் கட்டுப்படுத்தாமல், சட்டத்தின் எல்லையை மீறும் செயலைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது; διά இன் கருவி அல்லது வழிமுறைப் பொருள் ‘மூலம்’ என்பதால் காக்கப்படுகிறது.
- source_word: τὸν θεὸν
  choice: கடவுளை
  rationale: குறிப்பிட்ட ஒரே கடவுளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἀτιμάζεις
  choice: அவமதிக்கிறாயா
  rationale: τιμήக்கு எதிரான மரியாதைக்கேட்டைத் துல்லியமாக வெளிப்படுத்தி, பெருமை கொள்வதற்கும் கடவுளை அவமதிப்பதற்கும் இடையிலான கூர்மையான முரண்பாட்டைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பவுலின் வாதத்தில் νόμος என்பதன் குறிப்பு
  choice: திருச்சட்டம்
  alternative: சட்டம்; மோசேயின் சட்டம்
  rationale: உடனடியான சூழலில் இது யூதருக்குக் கொடுக்கப்பட்ட சட்டத்தைக் குறிக்கிறது. ‘மோசேயின் சட்டம்’ என்று வெளிப்படையாகச் சேர்ப்பது மூலத்தில் இல்லாத விளக்கத்தை உரைக்குள் கொண்டுவரும்; வெறும் ‘சட்டம்’ தமிழில் பொதுவான குடிமைச் சட்டமாகத் தவறாகப் புரியலாம். ‘திருச்சட்டம்’ குறிப்பு தெளிவாக இருக்கச் செய்கிறது, ஆனால் குறிப்பிட்ட சமயப் பிரிவின் விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: வசனத்தின் வினா வடிவமும் குற்றஞ்சாட்டும் தொனியும்
  choice: கேள்வி வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘நீ கடவுளை அவமதிக்கிறாய்’ என்ற நேரடிக் கூற்று
  rationale: கிரேக்கத்தில் இது வினாவாக அமைந்த சொல்லாட்சிக் கேள்வி. அதனை கூற்றாக மாற்றாமல் வைத்திருப்பது பவுலின் நேரடியான எதிர்கொள்ளலையும் உண்மையான இலக்கண வடிவத்தையும் காக்கிறது.
translation_notes:
  register: மரியாதைமிக்கதாயினும் சாதாரண வாசகர்களுக்குப் புரியும் நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவங்கள் காக்கப்பட்டுள்ளன. பழமையான ‘நியாயப்பிரமாணம்’ தவிர்க்கப்பட்டு, சூழலுக்கேற்ற ‘திருச்சட்டம்’ பயன்படுத்தப்பட்டுள்ளது.
