source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: ta
  text: நீ திருச்சட்டத்தின்படி செயல்பட்டால், விருத்தசேதனம் உண்மையிலேயே பயனுள்ளது[a]. ஆனால் நீ திருச்சட்டத்தை மீறுகிறவனாக இருந்தால்[b], உன் விருத்தசேதனம் விருத்தசேதனமின்மையாகிவிட்டது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மதிப்புள்ளது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, “திருச்சட்டத்தை மீறுபவனாக” அல்லது “சட்டமீறியாக” இருந்தால்.
    reason: lexical_alternative
  - marker: c
    text: நேரடியாக, “உன் விருத்தசேதனம் விருத்தசேதனமின்மையாகிவிட்டது.” அதாவது, திருச்சட்டம் மீறப்படும்போது உடன்படிக்கையின் அடையாளமான விருத்தசேதனம் அதன் பயனை இழக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: விருத்தசேதனம்
  rationale: பவுல் பயன்படுத்தும் உடன்படிக்கை சார்ந்த கருத்தையும், வசனத்தின் இறுதியில் வரும் எதிர்ச்சொல்லுடனான இணை அமைப்பையும் காக்கும் நிலையான தமிழ்ச் சொல்.
- source_word: μὲν γὰρ
  choice: உண்மையிலேயே
  rationale: பின்வரும் முரண்பாட்டுக்கு முன், விருத்தசேதனத்துக்கு நிபந்தனைக்குட்பட்ட உண்மையான பயன் உண்டு என்பதை உறுதிப்படுத்தும் உரையாடல் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὠφελεῖ
  choice: பயனுள்ளது
  rationale: பயன் அல்லது மதிப்பு அளிக்கிறது என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐὰν νόμον πράσσῃς
  choice: நீ திருச்சட்டத்தின்படி செயல்பட்டால்
  rationale: πράσσω என்பதின் ‘செய்தல்/நடைமுறைப்படுத்துதல்’ என்ற செயற்பாட்டு நுணுக்கத்தை காக்கிறது; வெறும் அறிவையோ ஒப்புதலையோ குறிக்கவில்லை.
- source_word: παραβάτης νόμου
  choice: திருச்சட்டத்தை மீறுகிறவன்
  rationale: சட்டத்தின் எல்லையை மீறுபவன் என்ற நீதிமுறை மற்றும் உடன்படிக்கை சார்ந்த கருத்தை, இன்றைய வாசகருக்குப் புரியும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡ περιτομή σου
  choice: உன் விருத்தசேதனம்
  rationale: இரண்டாம் நபர் நேரடி அழைப்பையும் பவுலின் சொல்லாட்சியையும் அப்படியே காக்கிறது.
- source_word: ἀκροβυστία
  choice: விருத்தசேதனமின்மை
  rationale: இங்கு உடலுறுப்பை மட்டும் குறிக்காமல், விருத்தசேதனத்திற்கு எதிரான உடன்படிக்கை நிலையைச் சுட்டுவதால், எதிரிணை அமைப்பைக் காக்கும் பெயர்ச்சொல் பயன்படுத்தப்பட்டது.
- source_word: γέγονεν
  choice: ஆகிவிட்டது
  rationale: ஒரு மாற்றம் நிகழ்ந்து அதன் விளைவு இப்போது தொடர்கிறது என்ற கிரேக்க நிறைவுக்கால வினையின் வலிமையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதி கூற்று உடல்சார்ந்த மாற்றமா அல்லது உடன்படிக்கை சார்ந்த நிலைமாற்றமா?
  choice: “உன் விருத்தசேதனம் விருத்தசேதனமின்மையாகிவிட்டது” என்ற மூலத்தின் தீவிரமான எதிர்மாற்றுச் சொல்லாட்சியை முதன்மை உரையில் காத்தல்.
  alternative: “உன் விருத்தசேதனம் விருத்தசேதனமின்மையாகக் கருதப்படுகிறது” அல்லது “விருத்தசேதனத்தின் மதிப்பை இழந்துவிடுகிறது.”
  rationale: γέγονεν என்பது வெறும் ‘கருதப்படுகிறது’ என்பதைவிட வலிமையான சொல்லாட்சி. சட்டமீறலால் உடன்படிக்கை அடையாளத்தின் பயன் தலைகீழாகிறது என்று பவுல் கூறும் பதற்றத்தை விளக்கவுரை மூலம் மென்மையாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மதிப்பும் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டது. பழமையான “நியாயப்பிரமாணம்” என்பதற்குப் பதிலாக, இச்சூழலில் தேவன் அளித்த சட்டத்தைக் குறிக்கத் தெளிவான “திருச்சட்டம்” தேர்ந்தெடுக்கப்பட்டது. “விருத்தசேதனம்” தொழில்நுட்பச் சொல்லாக இருந்தாலும், வேதாகம மற்றும் உடன்படிக்கைச் சூழலைத் துல்லியமாகக் காக்கிறது.
