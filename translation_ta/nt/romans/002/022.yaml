id: ROM.2.22
reference: Romans 2:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: ta
  text: “விபசாரம் செய்யாதே” என்று சொல்கிற நீ, விபசாரம் செய்கிறாயா? விக்கிரகங்களை அருவருக்கிற நீ, கோவில்களைக் கொள்ளையடிக்கிறாயா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, விரிவான பொருளில், “புனிதமானவற்றுக்கு எதிராகக் குற்றம் செய்கிறாயா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: என்று சொல்லுகிற நீயே
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்புவினை, பவுலின் நேரடியான வினாவை இயல்பான தமிழில் காட்டுகிறது; ‘நீயே’ என்பது சொல்லுக்கும் செயலுக்கும் இடையிலான முரண்பாட்டை வலியுறுத்துகிறது.
- source_word: μὴ μοιχεύειν
  choice: விபசாரம் செய்யாதே
  rationale: μή உடன் வரும் வினையெச்சம், கூறப்படும் தடையின் உள்ளடக்கத்தைத் தருகிறது; இது தமிழில் தெளிவான நேரடித் தடை வடிவம்.
- source_word: μοιχεύεις
  choice: விபசாரம் செய்கிறாயா
  rationale: நிகழ்கால வினைமுற்றின் பொதுவான குற்றஞ்சாட்டும் வினாத்தன்மையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὁ βδελυσσόμενος
  choice: அருவருக்கிற நீயே
  rationale: βδελύσσομαι குறிக்கும் கடும் வெறுப்பையும் அருவருப்பையும் ‘அருவருக்கிற’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: τὰ εἴδωλα
  choice: சிலைகளை
  rationale: சூழலில் வழிபாட்டுக்குரிய உருவங்களைக் குறிக்கிறது; ‘சிலைகள்’ என்பது இயல்பான நவீனத் தமிழ், மேலும் கோவில்கள் பற்றிய அடுத்த சொற்றொடர் அதன் வழிபாட்டுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: ἱεροσυλεῖς
  choice: கோவில்களைக் கொள்ளையடிக்கிறாயா
  rationale: ἱεροσυλέω என்பதன் உறுதியான, குறிப்பான பொருள் கோவிலையோ அதன் உடைமைகளையோ கொள்ளையிடுதல். இது சிலைகள் குறித்த முந்தைய சொற்றொடருடன் உள்ள கூர்மையான முரண்பாட்டைப் பாதுகாக்கிறது; விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ἱεροσυλεῖς என்பதன் குறிப்பான அல்லது விரிவான பொருள்
  choice: முதன்மை உரையில் ‘கோவில்களைக் கொள்ளையடிக்கிறாயா?’
  alternative: ‘புனிதத்தை அவமதிக்கிறாயா?’
  rationale: கிரேக்கச் சொல்லின் குறிப்பான வரலாற்றுப் பொருளை முதன்மை உரை பாதுகாக்கிறது; ‘புனிதத்துக்கு எதிரான குற்றம் செய்தல்’ என்ற விரிவான பொருளைத் தீர்மானமாக நிராகரிக்காமல் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன, மரியாதையான, நேரடியான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பவுலின் இரு இணையான சொல்லாட்சி வினாக்களும் குற்றஞ்சாட்டும் தொனியும் பாதுகாக்கப்பட்டுள்ளன. ‘நீயே’ என்பது தமிழில் இயல்பாக எதிர்முரணை வலியுறுத்துகிறது.
