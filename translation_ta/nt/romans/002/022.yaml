  verdict: revise
  source_fidelity: The two parallel rhetorical questions and the concrete primary sense of ἱεροσυλεῖς (“rob temples/temple property”) are retained. However, εἴδωλα specifically denotes idols or cult images; “சிலைகள்” can refer to statues generally and is therefore less precise in this context.
  naturalness: The revised wording is direct, idiomatic modern standard Tamil. Removing the added emphatic “-யே” avoids introducing a degree of explicit emphasis not marked in the Greek while retaining the rhetorical contrast through the parallel construction.
  terminology: “விக்கிரகங்கள்” accurately identifies εἴδωλα as idols in established Tamil biblical usage. “கோவில்களைக் கொள்ளையடிக்கிறாயா?” preserves the concrete lexical sense of ἱεροσυλεῖς. The footnote gives the broader sense without treating it as the primary meaning.
  issues:
  - severity: medium
    issue: “சிலைகளை” is broader than εἴδωλα.
    rationale: While idols are statues/images, “சிலைகள்” may denote any statues and does not itself convey their idolatrous or cultic status. “விக்கிரகங்களை” is more source-specific here.
  - severity: low
    issue: The repeated “நீயே” adds explicit emphatic force.
    rationale: The substantival participles directly address the representative interlocutor, but the Greek does not include an independent emphatic pronoun. Plain “நீ” preserves the address and parallelism without adding emphasis.
  - severity: low
    issue: The footnote’s “புனிதத்தை அவமதிக்கிறாயா?” is somewhat less precise for the broader alternative.
    rationale: The broader sense concerns committing an offense against sacred things, not merely expressing disrespect. The revised note states this more clearly.
  revised_text: “விபசாரம் செய்யாதே” என்று சொல்கிற நீ, விபசாரம் செய்கிறாயா? விக்கிரகங்களை அருவருக்கிற நீ, கோவில்களைக் கொள்ளையடிக்கிறாயா?[a]
