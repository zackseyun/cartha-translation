- from: ஏனெனில், “உங்களால் கடவுளுடைய பெயர் பிற இனத்தாரிடையே பழிக்கப்படுகிறது”[a] என்று எழுதப்பட்டிருக்கிறது.[b]
  to: ஏனெனில், எழுதப்பட்டுள்ளபடியே, உங்களால் கடவுளுடைய பெயர் பிற இனத்தாரிடையே தூஷிக்கப்படுகிறது.[a][b]
  rationale: The revision restores the comparative scriptural formula in καθὼς γέγραπται with “எழுதப்பட்டுள்ளபடியே,” retains the causal accusation “உங்களால்,” and uses “தூஷிக்கப்படுகிறது” to represent the strength of βλασφημεῖται. The alternative “நாடுகளிடையே” remains footnoted without displacing the contextually apt main rendering “பிற இனத்தாரிடையே.”
