source:
  edition: SBLGNT
  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: ta
  text: ஏனெனில், எழுதப்பட்டுள்ளபடியே, உங்களால் கடவுளுடைய பெயர் பிற இனத்தாரிடையே தூஷிக்கப்படுகிறது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உங்களால் கடவுளுடைய பெயர் நாடுகளிடையே தூஷிக்கப்படுகிறது.”'
    reason: lexical_alternative
  - marker: b
    text: இங்கு பவுல் வேதவாக்கை எதிரொலிக்கிறார்; குறிப்பாக ஏசாயா 52:5-ஐயும், எசேக்கியேல் 36:20–23-இல் காணப்படும் தொடர்புடைய கருத்துகளையும் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கண்டனத்திற்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் உரையோட்டத்தை இயல்பாக இணைக்கிறது.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: கடவுளுடைய பெயர்
  rationale: கிரேக்கத்தின் நேரடியான வடிவத்தைப் பேணுகிறது; ‘பெயர்’ என்பதில் புகழ் அல்லது மதிப்பு என்ற உட்பொருள் இருக்கலாம் என்றாலும் அதை விளக்கமாக மாற்றவில்லை.
- source_word: δι’ ὑμᾶς
  choice: உங்களால்
  rationale: διά + accusative இங்கு காரணத்தைக் குறிக்கிறது. ‘உங்கள் நிமித்தம்’ என்பதைக் காட்டிலும் நவீன தமிழில் இயல்பாகவும் குற்றச்சாட்டைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: βλασφημεῖται
  choice: பழிக்கப்படுகிறது
  rationale: இறைவனுடைய பெயருக்கு எதிராக இழிவாகப் பேசப்படுவதைத் தெரிவிக்கும் வலுவான passive சொல்லாக்கம்; தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: பிற இனத்தாரிடையே
  rationale: பவுலின் யூதர்–புறவினத்தார் சூழலில் ἔθνη என்பது யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ என்பது நவீன வாசகருக்கு அந்த வேறுபாட்டைத் தெளிவாகக் கூறுகிறது.
- source_word: καθὼς γέγραπται
  choice: என்று எழுதப்பட்டிருக்கிறது
  rationale: வேதாகம மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சூத்திரத்தை இயல்பான தமிழில் தருகிறது; καθώς இன் ஒப்புமைத் தொடர்பு மேற்கோள் அமைப்பில் வெளிப்படுகிறது.
theological_decisions:
- issue: ἔθνη என்பதன் சமூக-இறையியல் குறிப்பு
  choice: பிற இனத்தார்
  alternative: நாடுகள்
  rationale: இங்கு யூதர்களுக்கு மாறான மக்களைச் சுட்டுவது சூழலுக்கு ஏற்றது; அரசியல் நாடுகள் என்ற பொருளைத் தவிர்க்கிறது, ஆனால் மூலச்சொல்லின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பவுலின் வேதாகம எதிரொலி
  choice: முக்கிய எதிரொலிகளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ஒரே பழைய ஏற்பாட்டு வசனத்தின் நேரடி மேற்கோள் எனக் குறிப்பிடுதல்
  rationale: சொற்றொடர் ஏசாயா 52:5-ஐச் சிறப்பாக எதிரொலிக்கிறது; எசேக்கியேல் 36:20–23-இலும் தொடர்புடைய கருப்பொருள் உள்ளது. ஒரே மூலத்துக்கு மட்டும் கடுமையாகச் சுருக்காமல் உரையிடைத் தொடர்பை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு விளங்கும் கண்ணியமான நடை. மேற்கோள் குறிகள் ‘என்று எழுதப்பட்டிருக்கிறது’ என்பதுடன் இயல்பாக இணைக்கப்பட்டுள்ளன. ‘தேவதூஷணம் செய்யப்படுகிறது’ என்ற சமயத் தொழில்நுட்பச் சொல்லுக்குப் பதிலாக, βλασφημεῖται இன் வலிமையைப் பேணும் தெளிவான ‘பழிக்கப்படுகிறது’ தேர்ந்தெடுக்கப்பட்டது.
