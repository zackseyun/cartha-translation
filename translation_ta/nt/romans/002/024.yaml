review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the causal force of δι’ ὑμᾶς and understands ἐν τοῖς ἔθνεσιν in its Jewish–Gentile setting. However, it recasts καθὼς γέγραπται as a quotation followed by “என்று எழுதப்பட்டிருக்கிறது,” which does not clearly express “just/as it is written” and alters the Greek clause order. “பழிக்கப்படுகிறது” can mean being blamed or reproached and is weaker than βλασφημεῖται in this context.
  naturalness: The wording is generally clear and modern, but placing the whole assertion in quotation marks before “என்று எழுதப்பட்டிருக்கிறது” is less natural for the Greek’s scriptural formula. “எழுதப்பட்டுள்ளபடியே” is a clear, idiomatic Tamil equivalent for καθὼς γέγραπται. “தூஷிக்கப்படுகிறது” is a recognized, suitably strong biblical-register term here.
  terminology: “கடவுளுடைய பெயர்” and “பிற இனத்தாரிடையே” are appropriate. “தூஷிக்கப்படுகிறது” more accurately preserves the religiously weighty passive βλασφημεῖται than “பழிக்கப்படுகிறது.”
  issues:
  - severity: medium
    issue: The rendering of καθὼς γέγραπται is incomplete/structurally shifted.
    rationale: The source says that the preceding assertion is so “just as it is written.” The draft’s quotation construction merely says that the assertion “has been written,” without clearly conveying καθώς (“just as”).
  - severity: medium
    issue: “பழிக்கப்படுகிறது” weakens βλασφημεῖται.
    rationale: In this context the verb denotes blasphemous or impious disparagement of God’s name, not simply blame. “தூஷிக்கப்படுகிறது” retains the required force in standard biblical Tamil.
  revised_text: ஏனெனில், எழுதப்பட்டுள்ளபடியே, உங்களால் கடவுளுடைய பெயர் பிற இனத்தாரிடையே தூஷிக்கப்படுகிறது.[a][b]
  revised_footnotes:
