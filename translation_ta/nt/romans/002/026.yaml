source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: ta
  text: ஆகவே, விருத்தசேதனம் செய்யப்படாதவன்[a] திருச்சட்டத்தின் விதிமுறைகளைக் கடைப்பிடித்தால், அவனுடைய விருத்தசேதனம் செய்யப்படாத நிலை விருத்தசேதனமாக எண்ணப்படாதா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “விருத்தசேதனம் செய்யப்படாத நிலை திருச்சட்டத்தின் விதிமுறைகளைக் கடைப்பிடித்தால், அவனுடைய விருத்தசேதனம் செய்யப்படாத நிலை விருத்தசேதனமாக எண்ணப்படாதா?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: விருத்தசேதனம் செய்யப்படாதவன் / விருத்தசேதனம் செய்யப்படாத நிலை
  rationale: இந்தப் பெயர்ச்சொல் நேரடியாக ‘விருத்தசேதனம் செய்யப்படாத நிலை’ என்பதைக் குறித்தாலும், முதல் இடத்தில் ஒருவரைக் குறிக்கிறது; αὐτοῦ (‘அவனுடைய’) என்பதும் இதை உறுதிப்படுத்துகிறது. எனவே முதல் இடத்தில் இயல்பான ஆள்சுட்டு வடிவமும், இரண்டாம் இடத்தில் பவுலின் சொல்லாட்சியைப் பாதுகாக்க நிலைச்சுட்டு வடிவமும் பயன்படுத்தப்பட்டன.
- source_word: δικαιώματα
  choice: திருச்சட்டம் கோருவன
  rationale: திருச்சட்டம் விதிக்கும் கட்டளைகள் அல்லது தேவைகள் என்ற பன்மைப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத கூடுதல் வலியுறுத்தலைத் தவிர்க்கிறது.
- source_word: νόμου
  choice: திருச்சட்டம்
  rationale: சூழலில் இது மோசேயின் திருச்சட்டத்தைக் குறிக்கிறது. ‘திருச்சட்டம்’ என்பது தெளிவான, வழக்கிலுள்ள வேதாகமத் தமிழ்ச் சொல்.
- source_word: φυλάσσῃ
  choice: கடைப்பிடித்தால்
  rationale: கட்டளைகளுக்குக் கீழ்ப்படிந்து அவற்றைச் செயல்படுத்துதல் என்ற சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
- source_word: λογισθήσεται
  choice: எண்ணப்படாதா
  rationale: கணக்கிடுதல் அல்லது ஒரே வகையைச் சேர்ந்ததாகக் கருதுதல் என்ற பவுலின் உருவக மொழியைப் பாதுகாக்கிறது; எதிர்மறை வினா நேர்மறையான பதிலை எதிர்பார்ப்பதையும் வெளிப்படுத்துகிறது.
- source_word: εἰς περιτομήν
  choice: விருத்தசேதனமாக
  rationale: அந்த நிலை விருத்தசேதனத்திற்குச் சமமானதாகக் கணிக்கப்படும் முடிவு அல்லது தகுநிலையைத் தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: திருச்சட்டத்தைக் கடைப்பிடிப்பதும் விருத்தசேதனமாக எண்ணப்படுவதும் இடையிலான உறவு
  choice: வசனத்தின் நிபந்தனை மற்றும் சொல்லாட்சியை அப்படியே வைத்தல்
  alternative: இதை இரட்சிப்பு, நீதிமானாக்கப்படுதல் அல்லது சடங்கு உறுப்பினர் தகுதி பற்றிய ஒரு குறிப்பிட்ட கோட்பாடாக விளக்கிச் சேர்த்தல்
  rationale: இந்த வசனம் ஒரு சொல்லாட்சிசார் வினாவை முன்வைக்கிறது; அதன் விரிவான இறையியல் விளைவை மொழிபெயர்ப்பிலேயே தீர்மானிப்பது மூலத்தின் பதற்றத்தையும் சூழல்சார் வாதத்தையும் குறைத்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடையில் அமைக்கப்பட்டது. ‘விருத்தசேதனம்’ மற்றும் ‘திருச்சட்டம்’ ஆகியவை சூழலுக்கேற்ற நிலைபெற்ற வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன; நீளமான கிரேக்கப் பெயர்ச்சொல் அமைப்பு முதலில் இயல்பான ஆள்சுட்டு வடிவமாக மாற்றப்பட்டு, அதன் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
