id: ROM.2.11
reference: Romans 2:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: ta
  text: ஏனெனில், கடவுளிடம் பாரபட்சம் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருதலைச்சார்பு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: προσωπολημψία
  choice: பாரபட்சம்
  rationale: ஒருவரின் நிலை அல்லது வெளிப்புறக் காரணிகளின் அடிப்படையில் பாகுபாடாகச் சலுகை காட்டுவதைக் குறிக்கிறது; அறநெறி மற்றும் நீதிசார் பொருளை நவீனத் தமிழில் துல்லியமாகத் தருகிறது.
- source_word: παρὰ τῷ θεῷ
  choice: கடவுளிடம்
  rationale: παρά இங்கு கடவுளோடு தொடர்புடைய நிலையில் அத்தகைய பாரபட்சம் இல்லை என்பதைக் குறிக்கிறது; ‘கடவுளிடம்’ என்பது கிரேக்க அமைப்புக்கு நெருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: οὐ γάρ ἐστιν ... παρὰ τῷ θεῷ
  choice: ஏனெனில், கடவுளிடம் பாரபட்சம் இல்லை.
  rationale: கிரேக்கத்தின் இருப்புநிலைக் கூற்று அமைப்பைச் செயல்வினைப் பொழிப்புரையாக மாற்றாமல் காத்து, வாசிக்க எளிதான தமிழில் தருகிறது.
theological_decisions:
- issue: கடவுளின் பாரபட்சமின்மையை வெளிப்படுத்துதல்
  choice: ‘கடவுளிடம் பாரபட்சம் இல்லை’ என்று கடவுளோடு தொடர்புடைய ஒரு பொதுவான உண்மையாகக் கூறுதல்.
  alternative: ‘கடவுள் பாரபட்சம் காட்டுவதில்லை’ என்று செயல்வினை வடிவில் மொழிபெயர்த்தல்.
  rationale: இரண்டும் அடிப்படை உண்மையைத் தெரிவிக்கின்றன; தேர்ந்த வடிவம் கிரேக்கத்தின் இருப்புநிலை இலக்கண அமைப்பை நெருக்கமாகக் காத்து, மூலத்தில் வெளிப்படையாக இல்லாத செயலைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பாரபட்சம்’ பொதுவாகப் புரிந்துகொள்ளக்கூடியதுடன், வசனத்தின் நீதிசார் கருத்தையும் தெளிவாகக் காக்கிறது.
