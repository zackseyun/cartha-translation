  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: ta
  text: ஏனெனில், வெளிப்புறமாக[a] யூதராக[c] இருப்பவர் யூதர் அல்ல; உடலில்[b] காணப்படும் வெளிப்புற விருத்தசேதனமும் விருத்தசேதனம் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெளிப்புறமாக” என்பதை “வெளிப்படையாக” அல்லது “கண்ணுக்குப் புலப்படும் நிலையில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உடலில்” என்பது இங்கு நேரடிப் பொருளில் வந்து, உடல் சார்ந்த விருத்தசேதனத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சில சூழல்களில் இச்சொல்லை “யூதேயர்” என்றும் மொழிபெயர்க்கலாம்; இங்கு உடன்படிக்கை சார்ந்த யூத அடையாளமே அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: யூதர்
  rationale: ரோமர் நிருபத்தின் இச்சூழலில் இது வெறும் யூதேயப் பிரதேசத்தைச் சேர்ந்தவரைக் குறிக்காமல், இஸ்ரவேலின் உடன்படிக்கை அடையாளத்தோடு தொடர்புடைய யூத அடையாளத்தைக் குறிக்கிறது.
- source_word: ἐν τῷ φανερῷ
  choice: வெளிப்புறமாக
  rationale: அடுத்த வசனத்தில் வரும் உள்ளார்ந்த நிலைக்கு எதிராக, கண்ணுக்குப் புலப்படும் வெளிப்புற நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: περιτομή
  choice: விருத்தசேதனம்
  rationale: இங்கு பேசப்படும் உடன்படிக்கை அடையாளத்திற்கான துல்லியமான, நிலைபெற்ற தமிழ் சொல்.
- source_word: ἐν σαρκί
  choice: உடலில்
  rationale: இங்கு σάρξ உருவகப் பொருளில் அல்லாமல் உடல் சார்ந்த நேரடிப் பொருளில் வருகிறது; நவீன தமிழில் ‘உடலில்’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή
  choice: உடலில் வெளிப்புறமாகச் செய்யப்படும் விருத்தசேதனமும் விருத்தசேதனம் அல்ல
  rationale: கிரேக்கத்தின் நீக்கப்பட்ட பயனிலையைத் தமிழில் நிறைவு செய்து, முதல் கூற்றின் இணையான மறுப்பு அமைப்பையும் வெறும் உடல் சார்ந்த சடங்கின் போதாமையையும் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் வாதத்திற்கான விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘யூதர்’ மற்றும் ‘விருத்தசேதனம்’ என்பவற்றில் உடன்படிக்கை அடையாளத்தின் பொருள்
  choice: வெளிப்புற அடையாளம் மட்டுமே யூத அடையாளத்தையோ விருத்தசேதனத்தின் முழுப் பொருளையோ நிர்ணயிப்பதில்லை என்ற முரண்பாட்டை நேரடியாகப் பாதுகாத்தல்
  alternative: யூத அடையாளமே மறுக்கப்படுகிறது என்று மொழிபெயர்த்தல்; அல்லது அதை முற்றிலும் உடல்சாராத ஆன்மிக வகையாக மாற்றுதல்
  rationale: வசனம் வெளிப்புறத்தையும் அடுத்த வசனத்தில் வரும் உள்ளார்ந்த நிலையையும் எதிரெதிராக வைக்கிறது; யூத அடையாளம் என்ற வகையையே ஒழிப்பதாகவோ அதன் பதற்றத்தை முன்கூட்டியே தீர்ப்பதாகவோ மொழிபெயர்க்கக் கூடாது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முதல் மற்றும் இரண்டாம் மறுப்புகளில் நோக்கமுள்ள மீளுரைத்தல் வைக்கப்பட்டு, கிரேக்கத்தின் இணை அமைப்பும் இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
