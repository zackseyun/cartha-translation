  revision_rationale: The revision makes the selfish-ambition motive and the Greek adversative contrast clearer in natural modern Tamil. It preserves the source’s dative-plural grouping, its implied-result ellipsis after the colon, the distinction between the two judgment terms, and the existing alternative for ἀδικία.
