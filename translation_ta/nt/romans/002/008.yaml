id: ROM.2.8
reference: Romans 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: ta
  text: 'ஆனால், சுயநலத்தால் உந்தப்பட்டு, உண்மைக்குக் கீழ்ப்படியாமல், மாறாக அநீதிக்குக்[a] கீழ்ப்படிகிறவர்களுக்கோ: கோபமும் சீற்றமும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அநியாயத்திற்குக்’.
    reason: ἀδικία என்பது ஒழுக்கரீதியான அநீதியையும் செயல்சார் அநியாயத்தையும் குறிக்கக்கூடும் என்பதால் மாற்று வழங்கப்படுகிறது.
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: சுயநல நோக்கத்தால் செயல்பட்டு
  rationale: ἐξ என்பதன் மூலத்தையோ உந்துதலையோ குறிக்கும் வலிமையையும், ἐριθεία என்பதன் சுயநலமும் தன்நல முன்னேற்றமும் சார்ந்த கருத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: உண்மைக்குக் கீழ்ப்படியாமல்
  rationale: ἀπειθέω என்பது வெறுமனே நம்பாமையைவிடக் கீழ்ப்படிய மறுக்கும் ஒழுக்கத் தீர்மானத்தைக் குறிக்கிறது; தமிழில் இந்த வடிவம் அந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: அநீதிக்குக் கீழ்ப்படிகிறவர்களுக்கோ
  rationale: முந்தைய ‘உண்மைக்குக் கீழ்ப்படியாமல்’ என்பதற்கு எதிரிணையாக, அநீதிக்கு இணங்கி நடக்கும் பற்றுறுதியைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀδικίᾳ
  choice: அநீதி
  rationale: ஒழுக்கக்கேட்டையும் நீதிக்கு எதிரான நிலையையும் உள்ளடக்கும் பவுலின் விரிவான பயன்பாட்டைத் தக்கவைக்கிறது; ‘அநியாயம்’ சாத்தியமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὀργὴ
  choice: கோபம்
  rationale: இச்சூழலில் உள்ள கடுமையான நியாயத்தீர்ப்புச் சார்ந்த உணர்வை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: θυμός
  choice: சீற்றம்
  rationale: ὀργή உடன் இணைந்து தீவிரத்தை உயர்த்தும் இரண்டாவது சொல்லாக, ‘சீற்றம்’ வலிமையையும் சொல்லிணையின் வேறுபாட்டையும் காக்கிறது.
- source_word: implicit verbal ellipsis
  choice: ‘அவர்களுக்கோ’ என்பதற்குப் பின் முக்காற்புள்ளி
  rationale: கிரேக்கத்தில் முடிவை அறிவிக்கும் வெளிப்படையான வினைச்சொல் இல்லை; முக்காற்புள்ளி அந்தச் சுருக்கத்தையும் வாக்கியத் தீவிரத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: தெய்வீக நியாயத்தீர்ப்புச் சூழலில் ἀδικία என்பதன் மொழிபெயர்ப்பு
  choice: அநீதி
  alternative: அநியாயம்
  rationale: ‘அநீதி’ என்பது கடவுளுக்கு முன்பான ஒழுக்கச் சீர்கேட்டையும் நீதிக்கு எதிரான நிலையையும் உள்ளடக்குகிறது; ‘அநியாயம்’ சமூக அல்லது செயல்சார் தவறைச் சற்றுக் குறுகலாக வலியுறுத்தலாம்.
- issue: ὀργὴ καὶ θυμός என்ற இணைச்சொல்லின் தீவிரம்
  choice: கோபமும் சீற்றமும்
  alternative: கடுங்கோபமும் சினமும்
  rationale: இரு பெயர்ச்சொற்களின் தனித்தன்மையை வைத்துக்கொண்டே தீவிரத்தை வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘கடவுளுடைய’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையில் இருந்தாலும், நியாயத்தீர்ப்புச் சூழலின் கண்ணியமும் கடுமையும் காக்கப்பட்டுள்ளன. கிரேக்கத்தின் வினையற்ற இறுதித் தொடரை நிரப்பாமல் முக்காற்புள்ளியால் தக்கவைத்துள்ளது.
