  revision_rationale: The unsupported completion «இது நிகழும்» has been removed. The verse remains a temporal clause, as in Greek and as appropriate to its syntactic connection with the preceding context. Word order has been adjusted for natural modern Tamil, «மறைவான காரியங்கள்» renders the broad sense of τὰ κρυπτά, and the footnote now gives a complete alternative for the anchored phrase.
