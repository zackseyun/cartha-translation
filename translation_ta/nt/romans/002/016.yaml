revisions:
- from: கடவுள் மெசியாவாகிய இயேசுவின்[a] மூலம் மனிதர்களின் மறைவானவற்றை நியாயந்தீர்க்கும் நாளில், என் நற்செய்தியின்படி இது நிகழும்.
  to: என் நற்செய்தியின்படி, கடவுள் மனிதர்களுடைய மறைவான காரியங்களை மெசியாவாகிய இயேசுவின் மூலம்[a] நியாயந்தீர்க்கும் நாளில்.
  rationale: The unsupported completion «இது நிகழும்» has been removed. The verse remains a temporal clause, as in Greek and as appropriate to its syntactic connection with the preceding context. Word order has been adjusted for natural modern Tamil, «மறைவான காரியங்கள்» renders the broad sense of τὰ κρυπτά, and the footnote now gives a complete alternative for the anchored phrase.
