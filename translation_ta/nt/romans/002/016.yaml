id: ROM.2.16
reference: Romans 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: ta
  text: என் நற்செய்தியின்படி, கடவுள் மனிதர்களுடைய மறைவான காரியங்களை மெசியாவாகிய இயேசுவின் மூலம்[a] நியாயந்தீர்க்கும் நாளில்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கிறிஸ்து இயேசுவின் மூலம்.”'
    reason: Χριστός என்பதற்கான மரபுவழி மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: …நாளில்
  rationale: குறிப்பிட்ட நியாயத்தீர்ப்பு நாளைக் குறிக்கும் காலத் தொடரை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: κρίνει
  choice: நியாயந்தீர்க்கும்
  rationale: கிரேக்கத்தில் நிகழ்கால வினையாக இருந்தாலும், எதிர்கால நியாயத்தீர்ப்பு நாளைக் குறிக்கும் தமிழ்ச் சார்பு தொடரில் இந்த வடிவம் இயல்பாக உள்ளது.
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: மனிதர்களின் மறைவானவற்றை
  rationale: பாலின வேறுபாடின்றி மனிதர்களுக்குரிய மறைக்கப்பட்ட காரியங்களைச் சுட்டுகிறது; உள்ளார்ந்த எண்ணங்கள் மட்டுமே என்று பொருளைச் சுருக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: என் நற்செய்தியின்படி
  rationale: பவுலின் தனிப்பட்ட உரிமைச் சொல்லையும் κατὰ என்பதன் ‘அதன்படி’ என்ற உறவையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவின் மூலம்
  rationale: διά + உரிய வேற்றுமை இங்கு செயலாற்றும் இடைமுகத்தைக் குறிக்கிறது; Χριστός என்பதன் பட்டப்பெயர் வலிமையை ‘மெசியா’ தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστοῦ என்பது பட்டப்பெயராகவா, பெயர்போன்ற வடிவமாகவா மொழிபெயர்க்கப்பட வேண்டும்
  choice: மெசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இச்சூழலில் Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பெயர் வலிமையை முதன்மை உரை வெளிப்படுத்துகிறது; திருச்சபை வழக்கிலுள்ள வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: தீர்ப்பைச் செய்பவர் மற்றும் அதன் இடைமுகம்
  choice: கடவுள் நியாயந்தீர்க்கிறார்; மெசியாவாகிய இயேசுவின் மூலம் அது நடைபெறுகிறது
  alternative: இயேசுவே நேரடியாக எழுவாயாக நியாயந்தீர்க்கிறார்
  rationale: ὁ θεός என்பது κρίνει என்பதன் வெளிப்படையான எழுவாய்; διὰ Χριστοῦ Ἰησοῦ என்பது இடைமுகம் அல்லது முகமையைச் சுட்டுகிறது. இவ்விரண்டின் வேறுபாடு மாற்றப்படவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. இந்த வசனம் முந்தைய வாக்கியத்துடன் இலக்கண ரீதியாக இணைந்திருப்பதால், தனியாக வாசிக்கும்போதும் நிறைவாக இருக்க ‘இது நிகழும்’ சேர்க்கப்பட்டுள்ளது; அது புதிய நிகழ்வை அறிமுகப்படுத்தாது, முன்சூழலில் கூறப்பட்ட கருத்தை மீண்டும் சுட்டுகிறது.
