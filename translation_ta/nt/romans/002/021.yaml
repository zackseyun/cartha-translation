id: ROM.2.21
reference: Romans 2:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: ta
  text: ஆகவே, மற்றொருவருக்குப் போதிக்கிற நீ உனக்கே போதிப்பதில்லையா? “திருடாதே” என்று அறிவிக்கிற நீ திருடுகிறாயா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவைச் சுட்டும் இணைப்புச் சொல்லின் தர்க்க வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: διδάσκων
  choice: போதிக்கிற
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்பை, தொடர்ச்சியான பண்பை உணர்த்தும் இயல்பான தமிழ் தொடர்பெச்சமாக வழங்குகிறது.
- source_word: ἕτερον
  choice: மற்றொருவருக்கு
  rationale: கிரேக்க மூலத்திலுள்ள ஒருமையைப் பாதுகாத்து, கற்பித்தலின் பெறுநரைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: σεαυτὸν
  choice: உனக்கே
  rationale: பிறருக்குப் போதிப்பதற்கும் தன்னையே போதிப்பதற்கும் இடையிலான கூர்மையான முரண்பாட்டை வலியுறுத்துகிறது.
- source_word: οὐ διδάσκεις;
  choice: போதிப்பதில்லையா?
  rationale: கண்டிக்கும் தொனியுள்ள எதிர்மறை வினாவையும் அதன் சொல்லாட்சிசார் நையாண்டியையும் காக்கிறது.
- source_word: κηρύσσων
  choice: அறிவிக்கிற
  rationale: பொதுவாக வெளிப்படையாகப் பிரகடனம் செய்வதைச் சுட்டுகிறது; தேவையற்ற சமயவழக்குச் சிறப்புப் பொருளைத் தவிர்க்கிறது.
- source_word: μὴ κλέπτειν
  choice: “திருடாதே”
  rationale: அறிவிக்கப்படும் தடையை நேரடி கட்டளையாக இயல்பான தமிழில் வழங்குகிறது.
- source_word: κλέπτεις;
  choice: திருடுகிறாயா?
  rationale: பவுலின் நேரடியான, குற்றஞ்சாட்டும் சொல்லாட்சியை எளிய நிகழ்கால வினாவாகப் பாதுகாக்கிறது.
