id: ROM.2.27
reference: Romans 2:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: ta
  text: இயல்பாகவே விருத்தசேதனம் செய்யப்படாதவன்[a] சட்டத்தை நிறைவேற்றினால், எழுத்தையும் விருத்தசேதனத்தையும் உடையவனாயிருந்தும்[b] சட்டத்தை மீறுகிற உன்னைத் தீர்ப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘இயல்பிலேயே உள்ள விருத்தசேதனமின்மை’; அதாவது, இயல்பாகவே விருத்தசேதனம் செய்யப்படாத ஒருவர்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘எழுத்து மற்றும் விருத்தசேதனத்தின் வழியாக.’ இங்கு ‘எழுத்து’ என்பது எழுதப்பட்ட சட்டத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: விருத்தசேதனம் செய்யப்படாதவன்
  rationale: இந்தப் பெயர்ச்சொல்லின் நேரடிப் பொருள் ‘விருத்தசேதனம் இல்லாமை’ என்றாலும், இங்கு அது விருத்தசேதனம் செய்யப்படாத ஒருவரைக் குறிக்கும் ஆகுபெயராகப் பயன்படுத்தப்பட்டுள்ளது. ‘புறவினத்தான்’ என்று மொழிபெயர்த்து மூலத்தில் இல்லாத இன அடையாளத்தை வெளிப்படையாகச் சேர்க்காமல், தனிநபர் குறிப்பு தெளிவாக வைக்கப்படுகிறது.
- source_word: ἐκ φύσεως
  choice: இயல்பாகவே
  rationale: விருத்தசேதனம் செய்யப்படாத இயல்பான நிலையையும் விருத்தசேதனம் பெற்ற நிலையையும் பவுல் வேறுபடுத்துகிறார். ‘இயல்பாகவே’ என்பது ‘பிறப்பிலிருந்தே’ என்று தேவையின்றிக் குறுக்காமல் கிரேக்கச் சொற்றொடரின் பரப்பைத் தக்கவைக்கிறது.
- source_word: τελοῦσα
  choice: நிறைவேற்றினால்
  rationale: இப்பெயரெச்சம் சட்டத்திற்குக் கீழ்ப்படிவதைச் சுட்டுகிறது; சூழலில் உள்ள நிபந்தனைப் பொருளை இயல்பான தமிழில் ‘நிறைவேற்றினால்’ என வழங்குகிறது. ‘கடைப்பிடித்தால்’ என்பதும் சாத்தியம்; ஆனால் ‘நிறைவேற்றுதல்’ τελέω என்பதன் வினைவலிமையை நெருக்கமாகக் காக்கிறது.
- source_word: νόμον
  choice: சட்டத்தை
  rationale: சூழலில் இது மோசேயின் சட்டத்தைக் குறிக்கும் அறியப்பட்ட வகைப்பாடு. ‘நியாயப்பிரமாணம்’ என்பதைக் காட்டிலும் ‘சட்டம்’ இன்றைய வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: διὰ γράμματος
  choice: எழுத்தும் … உனக்கு இருந்தும்
  rationale: γράμμα எழுதப்பட்ட சட்ட வடிவத்தைக் குறிக்கிறது. διὰ இங்கு அந்த எழுத்து கிடைத்திருப்பதைக் குறிக்கும் வகையில் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது; கிரேக்கத்தின் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: περιτομῆς
  choice: விருத்தசேதனம்
  rationale: உடன்படிக்கையின் அடையாளத்தைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ்ச் சொல் பயன்படுத்தப்படுகிறது.
- source_word: παραβάτην νόμου
  choice: சட்டத்தை மீறுகிறவன்
  rationale: சட்டத்துடனான வெளிப்படையான தொடர்பைக் காத்து, இன்றைய தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: ἀκροβυστία என்பதை இன அடையாளமாக ‘புறவினத்தான்’ என்று வெளிப்படையாக மொழிபெயர்க்க வேண்டுமா?
  choice: ‘விருத்தசேதனம் செய்யப்படாதவன்’ என்ற குறுகிய, மூலச்சொல்லுக்கு நெருக்கமான குறிப்பைத் தக்கவைத்தல்.
  alternative: புறவினத்தான்
  rationale: வாதத்தின் விரிந்த சூழல் யூதர்களையும் பிற இனத்தவரையும் பற்றியதாக இருந்தாலும், இவ்வசனத்தின் சொல் எதிர்நிலை விருத்தசேதனத்துக்கும் விருத்தசேதனம் இல்லாமைக்கும் இடையே உள்ளது. ஆகவே மூலத்தில் வெளிப்படையாகக் கூறப்படாத இன அடையாளத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. பழமையான ‘நியாயப்பிரமாணம்’ என்பதற்குப் பதிலாக ‘சட்டம்’ என்றும், ஆகுபெயரான ‘விருத்தசேதனமின்மை’ என்பதற்குப் பதிலாக நபரைக் குறிக்கும் இயல்பான தொடரும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் நீண்ட எதிர்மறைக் கட்டமைப்பு தமிழில் தெளிவாக இருக்க ‘உனக்கு இருந்தும்’ என்ற இணைப்பு பயன்படுத்தப்பட்டுள்ளது.
