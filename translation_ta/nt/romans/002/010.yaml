  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: ta
  text: ஆனால், நல்லதைச் செய்கிற ஒவ்வொருவருக்கும்[a]—முதலில் யூதருக்கும், கிரேக்கருக்கும் கூட[b]—மகிமையும் மரியாதையும் சமாதானமும் கிடைக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்மையானதைச் செய்கிற ஒவ்வொருவருக்கும்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “கிரேக்கர்” என்பது யூதரல்லாதவர்களைப் பொதுவாக, அதாவது பிற இனத்தவரைக் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: மகிமை
  rationale: இறுதிக்கால வெகுமதியையும் ஒருவருக்கு அளிக்கப்படும் உயர்வையும் குறிக்கும் சொல்லின் வேதாகமச் செறிவை இயல்பாகப் பாதுகாக்கிறது.
- source_word: τιμή
  choice: மரியாதை
  rationale: δόξα என்பதுடன் இணைந்து வரும் கௌரவப்படுத்துதலைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: உள்ளார்ந்த அமைதி, நல்வாழ்வு, உறவுசார் முழுமை ஆகியவற்றில் ஒன்றாக மட்டும் பொருளைக் குறுக்காமல், சொல்லின் பரந்த வேதாகமப் பொருளைப் பாதுகாக்கிறது.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: செய்கிற ஒவ்வொருவருக்கும்
  rationale: தொடர்ந்து அல்லது இயல்பாக ஒரு செயலைச் செய்பவரைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையின் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ ἀγαθόν
  choice: நன்மையானதை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள உருபுடனான பெயரடையின் ‘நன்மையானது/நல்லது’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: Ἰουδαίῳ
  choice: யூதருக்கும்
  rationale: ஒரு சமூகத்தைப் பிரதிநிதித்துவப்படுத்தும் ஒருமையைத் தமிழில் இயல்பான பொதுப்பொருளுடன் தருகிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: பவுல் குறிப்பிடும் வரிசையை விளக்கிச் சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: Ἕλληνι
  choice: கிரேக்கருக்கும்
  rationale: மூலத்தின் நேரடிச் சொல்லையும் ‘யூதர்–கிரேக்கர்’ என்ற பவுலின் இணைச்சொற்றொடரையும் பாதுகாக்கிறது; அதன் பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கோபம் மற்றும் துன்பத்திற்கு எதிரான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: καὶ … καὶ … καὶ / τε … καὶ
  choice: …வும் …வும் …வும் / அதேபோல்
  rationale: வெகுமதிகளின் இணைப்பையும் யூதருடன் கிரேக்கரையும் சேர்த்துக் கூறுவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Ἕλληνι என்பது யாரைக் குறிக்கிறது?
  choice: முதன்மை உரையில் “கிரேக்கர்” என்று வைத்து, யூதரல்லாதவர்களைப் பரந்த வகையில் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் தெரிவித்தல்.
  alternative: “பிற இனத்தவர்” என்று முதன்மை உரையிலேயே மொழிபெயர்த்தல்.
  rationale: சொல்லின் நேரடிப் பொருள் ‘கிரேக்கர்’; ஆனால் ரோமர் கடிதத்தின் ‘யூதர்–கிரேக்கர்’ எதிரிணையில் அது யூதரல்லாதவர்களைப் பொதுவாகக் குறிக்கிறது. முதன்மை உரை மூலச் சொல்லைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் சூழல்சார் பரப்பைத் தெரிவிக்கிறது.
- issue: πρῶτον குறிக்கும் முன்னுரிமையின் தன்மை
  choice: “முதலில்” என்று மட்டும் மொழிபெயர்த்து அதன் தன்மையை விளக்காமல் விடுதல்.
  alternative: இரட்சிப்பு வரலாற்றில் முதலில் / முன்னுரிமையுடன் என்று விளக்கிச் சேர்த்தல்.
  rationale: வசனம் வரிசையைக் கூறுகிறது; அந்த வரிசையின் துல்லியமான இறையியல் தன்மையை இங்கே வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே மூலத்தின் சுருக்கமும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. “மகிமை, மரியாதை, சமாதானம்” என்ற மூன்று இணைச் சொற்களும் மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கின்றன; கோடுகள் யாருக்கு இவை அளிக்கப்படுகின்றன என்ற இடைச்சொற்றொடரைத் தெளிவாக்குகின்றன.
