  revision_rationale: The revision restores πῶς through ‘எப்படி,’ while retaining the affirmative-expected rhetorical force of οὐχί, the comparative ‘இன்னும் அதிக,’ and the future-oriented sense of ἔσται. ‘ஊழியம்’ more consistently represents Paul’s διακονία in this immediate contrast, and the footnote continues to preserve the viable ‘மகிமையில்’ alternative for ἐν δόξῃ.
