reference: 2 Corinthians 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πῶς οὐχὶ μᾶλλον ἡ διακονία τοῦ πνεύματος ἔσται ἐν δόξῃ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/008.yaml
  text: how will the ministry of the Spirit not be even more in glory?[a]
translation:
  language: ta
  text: அப்படியானால், ஆவியானவருடைய ஊழியம் இன்னும் அதிக மகிமையோடு இருக்காமல் எப்படி இருக்கும்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகிமையில் இருக்காமல் எப்படி இருக்கும்?”
    reason: ἐν δόξῃ என்பதிலுள்ள ἐν-ஐ ‘மகிமையில்’ என்ற நிலை/இடநிலை வடிவிலும் எடுத்துரைக்கலாம்.
lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: இருக்காதா?
  rationale: ஆம் என்ற பதிலை எதிர்பார்க்கும் கிரேக்க வினாவின் வலிமையை இயல்பான தமிழ் எதிர்மறை வினாவாகக் காக்கிறது; πῶς என்பதன் சொல்லுக்குச் சொல் வடிவத்தைத் திணிக்காமல் அதன் வாதத் தாக்கத்தை வெளிப்படுத்துகிறது.
- source_word: μᾶλλον
  choice: இன்னும் அதிக
  rationale: முந்தைய வசனத்திலிருந்து குறைந்ததைக் காட்டிலும் உயர்ந்ததற்குச் செல்லும் ஒப்பீட்டு ஏற்றத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἡ διακονία
  choice: பணி
  rationale: இங்கு ஒப்படைக்கப்பட்ட உடன்படிக்கைச் சேவையைக் குறிக்கிறது. நவீனத் தமிழில் பொதுவாகப் புரியும் ‘பணி’ என்பதைக் கொண்டு, குறிப்பிட்ட திருச்சபைப் பதவியை உரையில் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: τοῦ πνεύματος
  choice: ஆவியானவரின்
  rationale: உடனடியான சூழலில் உயிரளிக்கும் பரிசுத்த ஆவியே குறிப்பாக இருப்பதை மரியாதையான ஆள்சுட்டு வடிவில் தெரிவிக்கிறது.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: εἰμί என்பதன் எளிய எதிர்காலப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐν δόξῃ
  choice: மகிமையோடு
  rationale: தமிழில் இயல்பாக ஒலிக்கும் வகையில் மகிமையுடன் தொடர்புடைய நிலையைத் தெரிவிக்கிறது; ‘மகிமையில்’ என்ற இடநிலைச் சாயலை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: πνεύματος என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: ஆவி அல்லது ஆவிக்குரிய தன்மை என்ற பொதுவான பொருள்
  rationale: 2 கொரிந்தியர் 3:6 மற்றும் பழைய-புதிய உடன்படிக்கைப் பணிகளுக்கிடையிலான உடனடிச் சூழல், உயிரளிக்கும் பரிசுத்த ஆவியைக் குறிப்பதாக வலுவாகச் சுட்டுகிறது; இதற்கு மேற்பட்ட கோட்பாட்டுச் சிறப்புகளை உரையில் சேர்க்கவில்லை.
- issue: ἐν δόξῃ என்பதன் உறவு
  choice: மகிமையோடு
  alternative: மகிமையில்
  rationale: உடனிருப்பு அல்லது நிலை என்ற இரண்டு சாயல்களும் கிரேக்கச் சொற்றொடரில் சாத்தியம். இயல்பான தமிழுக்காக ‘மகிமையோடு’ முதன்மை உரையில் வைக்கப்பட்டு, அமைப்புக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அப்படியானால்’ முந்தைய வசனத்தின் குறைந்ததிலிருந்து அதிகத்திற்குச் செல்லும் வாதத் தொடரை வெளிப்படுத்துகிறது; எதிர்மறை வினா கிரேக்கத்தின் உறுதியான நேர்மறை எதிர்பார்ப்பைப் பாதுகாக்கிறது.
