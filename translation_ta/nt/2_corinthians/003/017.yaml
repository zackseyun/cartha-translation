id: 2CO.3.17
reference: 2 Corinthians 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν· οὗ δὲ τὸ πνεῦμα ⸀κυρίου, ἐλευθερία.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: ta
  text: கர்த்தரே ஆவியானவர்[a]; கர்த்தருடைய ஆவியானவர் எங்கே இருக்கிறாரோ, அங்கே விடுதலை உண்டு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கர்த்தரே ஆவியானவர்” என்பது, இவர்களுக்கிடையிலான உறவை இறையியல்ரீதியாக எவ்வாறு வரையறுக்க வேண்டும் என்று குறிப்பாகச் சொல்லாமல், இச்சூழலில் அவர்களை நெருக்கமாக அடையாளப்படுத்தும் கூற்றாகப் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: கர்த்தர்
  rationale: பவுலின் இறையியல் சூழலுக்கும் தமிழ் வேதாகம வழக்குக்கும் ஏற்ற மரியாதைமிக்க இயல்பான இணையாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: πνεῦμα
  choice: ஆவியானவர்
  rationale: இரு இடங்களிலும் தூய ஆவியானவரே குறிக்கப்படுவதால், வெறும் மனித ஆவி அல்லது உயிர்மூச்சு என்ற பொருள் வராதவாறு ஆள்தன்மையை வெளிப்படுத்தும் வழக்கமான தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: δὲ
  choice: முதல் இடத்தில் தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை; இரண்டாம் இடத்தில் வாக்கியத் தொடரால் உணர்த்தப்பட்டது
  rationale: δέ இங்கே உரையாடல் முன்னேற்றத்தைச் சுட்டுகிறது; ‘இப்போது’ என்று மொழிபெயர்த்தால் மூலத்தில் இல்லாத காலப்பொருள் தோன்றலாம். தமிழில் அரைப்புள்ளியும் அடுத்த கூறின் இயல்பான தொடரும் அதன் இணைப்புப் பணியைத் தாங்குகின்றன.
- source_word: οὗ
  choice: எங்கே ... அங்கே
  rationale: பொதுவான இடப்பொருளை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது; ‘எங்கெல்லாம்’ என்பது மூலத்தைவிட விரிவாக்கமாக இருக்கலாம்.
- source_word: ἐλευθερία
  choice: விடுதலை
  rationale: கட்டுப்பாடு மற்றும் மறைப்பிலிருந்து விடுபடும் இச்சூழலின் கருத்தைத் தற்காலத் தமிழில் இயல்பாகவும் இறையியல் நிறையுடனும் தெரிவிக்கிறது.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: கர்த்தரே ஆவியானவர்
  rationale: கிரேக்கத்தின் நேரடியான சமன்பாட்டு வாக்கியத்தை மெலிதாக்காமல் தமிழில் வலியுறுத்தல் உடைய இயல்பான வடிவில் வைத்திருக்கிறது.
- source_word: τὸ πνεῦμα κυρίου
  choice: கர்த்தருடைய ஆவியானவர்
  rationale: உடைமை வேற்றுமையை வெளிப்படையாகப் பாதுகாத்து, வேதாகம மொழிநடையின் எதிரொலியையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘கர்த்தர் ஆவியானவர்’ என்ற அடையாளக் கூற்றின் இறையியல் பொருள் பலவாறு விளக்கப்படுகிறது.
  choice: ‘கர்த்தரே ஆவியானவர்’ என்ற நேரடியான சமன்பாட்டு கூற்று தக்கவைக்கப்பட்டது.
  alternative: இதை முழுமையான ஆளடையாளச் சமன்பாடாக அல்லாமல், சூழல்சார்ந்த நெருங்கிய செயல்பாட்டு அல்லது புதிய உடன்படிக்கை அடையாளமாகப் புரிந்துகொள்ளலாம்; ‘கர்த்தர்’ என்பது குறிப்பாக கிறிஸ்துவைக் குறிக்கிறதா என்பதிலும் கருத்து வேறுபாடு உண்டு.
  rationale: மூல கிரேக்கம் அடையாளத்தை நேரடியாகக் கூறுகிறது. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்க வேண்டும்; அடிக்குறிப்பு உறவின் துல்லியமான இறையியல் வரையறையைத் திணிக்காமல் வாசகருக்கு எச்சரிக்கை அளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘இப்போது’ என்ற காலச்சொல் சேர்க்கப்படவில்லை; மூலத்தின் δέ தரும் உரைத்தொடர்ச்சி அரைப்புள்ளி மற்றும் வாக்கிய அமைப்பால் உணர்த்தப்படுகிறது. நேரடியான அடையாளக் கூற்றின் நோக்கமுள்ள தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
