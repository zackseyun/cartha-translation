id: 2CO.3.6
reference: 2 Corinthians 3:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: ta
  text: அவரே எங்களைப் புதிய உடன்படிக்கையின் பணியாளர்களாக[b]த் தகுதிப்படுத்தினார்—எழுத்தின் பணியாளர்களாக அல்ல[c], ஆவியின் பணியாளர்களாக[a]. ஏனெனில், எழுத்து கொல்கிறது; ஆவியோ வாழ்வளிக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆவி’ என்பது தூய ஆவியைக் குறிக்கலாம்; அல்லது பொதுவாக ‘ஆவி’ என்றும் புரிந்துகொள்ளலாம். கிரேக்க எழுத்துமுறை இவ்விரண்டையும் பெரிய அல்லது சிறிய எழுத்துகளால் வேறுபடுத்துவதில்லை.
    reason: alternative_reading
  - marker: b
    text: ‘பணியாளர்கள்’ என்பதற்கு ‘ஊழியர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘எழுத்து’ என்பதை ‘எழுதப்பட்ட சட்டத்தொகுப்பு’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: தகுதியுள்ளவர்களாக்கினார்
  rationale: ஊழியத்திற்குத் தேவையான தகுதியையும் திறனையும் கடவுள் அளித்தார் என்ற செயற்பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; வெறும் அதிகாரப்பூர்வச் சான்றளிப்பை மட்டும் குறிப்பதில்லை.
- source_word: διακόνους
  choice: பணியாளர்கள்
  rationale: சேவை செய்வோர் என்ற அடிப்படைப் பொருளைத் தக்கவைக்கிறது; பிற்காலத் திருச்சபைப் பதவியைத் தேவையின்றி உரைக்குள் கொண்டுவரும் வாய்ப்பைத் தவிர்க்கிறது.
- source_word: καινῆς διαθήκης
  choice: ஒரு புதிய உடன்படிக்கையின்
  rationale: கிரேக்க மொழியின் எண்ணியல் வரையறையற்ற தொடரை இயல்பாகக் காட்டுவதோடு, பவுலின் உடன்படிக்கைச் சூழலையும் தெளிவாக வைத்திருக்கிறது.
- source_word: γράμματος / γράμμα
  choice: எழுத்து
  rationale: பவுலின் சுருக்கமான உருவகத்தையும் ‘ஆவி’ என்பதுடனான நேரடியான முரணையும் பாதுகாக்கிறது; ‘எழுதப்பட்ட சட்டத்தொகுப்பு’ என்பது சாத்தியமானாலும் அதிக விளக்கமளிக்கும் மொழிபெயர்ப்பு.
- source_word: πνεύματος / πνεῦμα
  choice: ஆவி
  rationale: புதிய உடன்படிக்கைச் சூழலில் தூய ஆவியைக் குறிக்கும் வாய்ப்பு மிகுந்தது. அதேவேளை, கிரேக்க மூலத்தின் எழுத்துமுறை பெரிய/சிறிய எழுத்தால் இந்த வேறுபாட்டைச் சுட்டாததால், தமிழ் உரையின் இயல்பான ‘ஆவி’ வடிவம் உண்மையான தெளிவின்மையையும் காக்கிறது.
- source_word: ἀποκτέννει
  choice: கொல்கிறது
  rationale: மூலத்தின் வலிமையான, நேரடியான நிகழ்காலச் சொல்லைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: ζῳοποιεῖ
  choice: வாழ்வளிக்கிறது
  rationale: உயிரடையச் செய்யும் செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்தி, ‘கொல்கிறது’ என்பதுடனான எதிர்மறை இணைப்பையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: πνεῦμα என்பது ‘தூய ஆவி’யையா அல்லது பொதுவாக ‘ஆவி’யையா குறிக்கிறது?
  choice: முதன்மையாகத் தூய ஆவியைக் குறிப்பதாகப் புரிந்துகொள்ளப்பட்டாலும், முதன்மை உரையில் ‘ஆவி’ என வழங்கப்பட்டது.
  alternative: மனித ஆவி அல்லது ஆவிக்குரிய இயல்பு எனப் பொதுவாகப் புரிந்துகொள்ளலாம்.
  rationale: புதிய உடன்படிக்கையும் வாழ்வளித்தலும் இடம்பெறும் பவுலின் சூழல் தூய ஆவியை வலுவாகச் சுட்டுகிறது. எனினும், கிரேக்க எழுத்துமுறை இந்த வேறுபாட்டை வெளிப்படையாகத் தீர்மானிக்காததால் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ஒரே வாக்கிய அமைப்பும் ‘எழுத்து—ஆவி’, ‘கொல்கிறது—வாழ்வளிக்கிறது’ என்ற இணை முரண்களும் பாதுகாக்கப்பட்டுள்ளன. ‘ஊழியர்கள்’ என்ற திருச்சபை வழக்குச் சொல்லுக்குப் பதிலாகச் சேவைப் பொருளை முன்னிறுத்தும் ‘பணியாளர்கள்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
