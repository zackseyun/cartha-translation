revisions:
- from: ஆனால், கற்களின்மேல் எழுத்துகளாகப் பொறிக்கப்பட்ட மரணத்தின் பணி மகிமையுடன் வந்தது. மறைந்துபோகும்[a] அந்த மகிமை மோசேயின் முகத்தில் இருந்ததால், இஸ்ரவேலின் மகன்களால்[b] அவரது முகத்தை உற்றுப் பார்க்க முடியவில்லை என்றால்,
  to: ஆனால், கற்களின்மேல் எழுத்துகளாகப் பொறிக்கப்பட்ட மரணத்தின் பணி மகிமையுடன் வந்தது என்றால், ஒழிந்துகொண்டிருந்த மோசேயின் முக மகிமையினிமித்தம் இஸ்ரவேலின் மகன்களால்[b] அவரது முகத்தை உற்றுப் பார்க்க முடியவில்லை என்றால்,
  rationale: 'The revision restores the single conditional construction and makes the source’s syntax explicit: the ministry came with glory, with the result that Israel’s sons could not gaze at Moses’ face because of the glory of his face. The a footnote anchor is placed on “ஒழிந்துகொண்டிருந்த,” the term to which its alternatives belong. The final comma is retained because this protasis continues into verse 8.'
