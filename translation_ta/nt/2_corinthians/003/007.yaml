  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: ta
  text: ஆனால், கற்களின்மேல் எழுத்துகளாகப் பொறிக்கப்பட்ட மரணத்தின் பணி மகிமையுடன் வந்தது என்றால், ஒழிந்துகொண்டிருந்த மோசேயின் முக மகிமையினிமித்தம் இஸ்ரவேலின் மகன்களால்[b] அவரது முகத்தை உற்றுப் பார்க்க முடியவில்லை என்றால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “இஸ்ரவேலின் மகன்கள்” என்பதை “இஸ்ரவேலர்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல்லாட்சியை இன்னும் நெருக்கமாகப் பிரதிபலிக்க ஆண்பால் தொடர் இங்கே தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: பணி
  rationale: சேவை மற்றும் ஒப்படைக்கப்பட்ட பொறுப்பு ஆகிய இரு நிழற்பொருள்களையும் எளிய, நவீன தமிழில் தருகிறது; குறிப்பிட்ட திருச்சபைச் சொல்லாட்சியைத் திணிப்பதையும் தவிர்க்கிறது.
- source_word: τοῦ θανάτου
  choice: மரணத்தின்
  rationale: கிரேக்க மொழியின் செறிவான உடைமை வேற்றுமைத் தொடர்பை விளக்க விரிவாக்கமின்றிப் பாதுகாக்கிறது.
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: கற்களின்மேல் எழுத்துகளாகப் பொறிக்கப்பட்ட
  rationale: எழுத்துகள், பொறித்தல், கற்கள் ஆகிய மூன்று கூறுகளையும் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கற்பலகைகள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἐγενήθη ἐν δόξῃ
  choice: மகிமையுடன் வந்தது
  rationale: ἐγενήθη என்பதன் நிகழ்வு சார்ந்த வலிமையையும், மகிமை அதனுடன் இருந்ததையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: உற்றுப் பார்க்க முடியவில்லை
  rationale: வெறுமனே பார்ப்பதைவிட நிலையாகவும் கூர்ந்தும் பார்ப்பதைக் குறிக்கும் ἀτενίζω என்பதன் வலிமையையும் விளைவு வாக்கியத்தையும் காக்கிறது.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: ‘இஸ்ரவேலர்’ என்று பொதுமைப்படுத்தாமல், கிரேக்கத்தின் ஆண்பால் சார்ந்த நேரடி சொல்லாட்சியைப் பிரதிபலிக்கிறது.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: மோசேயின் முகத்தை
  rationale: முகம் என்ற தெளிவான உடல் சார்ந்த குறிப்பைக் காத்து, தமிழ் வினைத் தொடருக்கு இயல்பாக அமைக்கிறது.
- source_word: καταργουμένην
  choice: மறைந்துபோகும்
  rationale: மோசேயின் முகத்தில் காணப்பட்ட மகிமை தற்காலிகமானது என்பதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது; ‘முடிவுக்குக் கொண்டுவரப்படுதல்’ என்ற பரந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: καταργουμένην என்பது காணக்கூடிய மகிமை மங்குவதைச் சொல்கிறதா, அல்லது அது முடிவுக்குக் கொண்டுவரப்படுவதைச் சொல்கிறதா?
  choice: மறைந்துபோகும்
  alternative: முடிவுக்குக் கொண்டுவரப்பட்டுக்கொண்டிருந்த; ஒழிந்துபோகும்
  rationale: உடனடிச் சூழல் மோசேயின் முகத்தில் காணப்பட்ட மகிமையைப் பற்றியது என்பதால் ‘மறைந்துபோகும்’ என்பது இயல்பாகப் பொருந்துகிறது. இருப்பினும், பழைய உடன்படிக்கையின் தற்காலிகத் தன்மையைப் பற்றிய பவுலின் பரந்த கருத்தை ஒரே விளக்கமாக நிர்ணயிக்காமல் மாற்றுச் சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. வசனம் அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனைத் தொடராக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘ஊழியம்’ என்பதற்குப் பதில் குறைவான சமயத் தொழில்நுட்பத் தன்மை கொண்ட ‘பணி’ பயன்படுத்தப்பட்டுள்ளது.
