source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: ta
  text: நாமோ அனைவரும், திரை நீக்கப்பட்ட முகத்துடன், கண்ணாடியில் ஆண்டவரின் மகிமையைக் கண்டு[a], அதே சாயலாக மகிமையிலிருந்து மகிமைக்கு உருமாற்றப்பட்டுக்கொண்டிருக்கிறோம்; இது ஆண்டவராகிய ஆவியிடமிருந்து வருவதுபோலவே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண்ணாடியைப்போல் ஆண்டவரின் மகிமையைப் பிரதிபலித்து.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “ஆண்டவரிடமிருந்து, ஆவியிடமிருந்து”; வேறொரு வாசிப்பு, “ஆண்டவரின் ஆவியிடமிருந்து.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: திரை நீக்கப்பட்ட முகத்துடன்
  rationale: நீக்கப்பட்ட திரையின் விளைவாகத் தொடரும் தற்போதைய நிலையையும், கிரேக்கத்தின் ஒருமைச் சொல்லாட்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: δόξαν κυρίου
  choice: ஆண்டவரின் மகிமை
  rationale: உடைமைத் தொடர்பை நேரடியாகவும் இயல்பாகவும் தருகிறது; κύριος என்பதற்கு ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது.
- source_word: κατοπτριζόμενοι
  choice: கண்ணாடியில் காண்பதுபோல் ... கண்டு
  rationale: கண்ணாடியின் வழியாக அல்லது கண்ணாடியில் பார்ப்பது என்ற பொருளை முதன்மைப்படுத்துகிறது. ‘கண்ணாடியைப்போல் பிரதிபலித்தல்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: அதே சாயலாக
  rationale: ஆண்டவரின் மகிமைக்கும் விசுவாசிகள் மாற்றப்படும் சாயலுக்கும் உள்ள தொடர்பைக் காக்கிறது; இங்கு ‘சாயல்’ என்பது உருவ ஒற்றுமையை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: μεταμορφούμεθα
  choice: உருமாற்றப்பட்டுக்கொண்டிருக்கிறோம்
  rationale: நிகழ்காலச் செயலின் தொடர்ச்சியையும் இறைப்பாட்டு வினையின் passive தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: மகிமையிலிருந்து மகிமைக்கு
  rationale: கிரேக்கத்தின் சுருக்கமான, திறந்த சொல்லாட்சியை விளக்கவுரை சேர்க்காமல் அப்படியே காக்கிறது.
- source_word: καθάπερ
  choice: வருகிறபடியே
  rationale: இறுதித் தொடரை முந்தைய உருமாற்றத்தோடு ஒப்பிட்டு இணைக்கும் கிரேக்கச் சொல்லின் இயல்பைத் தமிழில் தருகிறது.
- source_word: ἀπὸ κυρίου πνεύματος
  choice: ஆண்டவரிடமிருந்து—ஆவியிடமிருந்து—
  rationale: சுருக்கமான கிரேக்கத் தொடரிலுள்ள பொருத்தப்பாட்டு வாய்ப்பைக் கோடுகளால் காட்டி, ‘ஆண்டவராகிய ஆவி’ அல்லது ‘ஆண்டவரின் ஆவி’ என்று ஒரே விளக்கத்தைத் திணிக்காமல் விடுகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: நவீன வேதாகமத் தமிழில் இயல்பான, மரியாதைக்குரிய இணைச்சொல்.
theological_decisions:
- issue: κατοπτριζόμενοι என்பதன் பொருள்
  choice: கண்ணாடியில் காண்பதுபோல் ஆண்டவரின் மகிமையைக் கண்டு
  alternative: கண்ணாடியைப்போல் ஆண்டவரின் மகிமையைப் பிரதிபலித்து
  rationale: ஆண்டவரின் மகிமையைக் காண்பதிலிருந்து உருமாற்றம் நிகழும் கருத்தோட்டத்துக்கு முதன்மை வாசிப்பு பொருந்துகிறது. ஆயினும், பிரதிபலித்தல் என்பதும் கிரேக்க வினையின் உண்மையான சாத்தியப் பொருள் என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: κυρίου என்பதற்கும் πνεύματος என்பதற்கும் இடையிலான தொடர்பு
  choice: ஆண்டவரிடமிருந்து—ஆவியிடமிருந்து—
  alternative: ‘ஆவியாகிய ஆண்டவரிடமிருந்து’; அல்லது, ‘ஆண்டவரின் ஆவியிடமிருந்து’
  rationale: கிரேக்கத் தொடர் மிகச் சுருக்கமானது; சொற்களின் இலக்கணத் தொடர்பை ஒன்றாக முடிவுசெய்ய இயலாது. முதன்மை உரை அதன் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் காக்கிறது; தெளிவாக்கப்பட்ட வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கமும் இறையியல் தெளிவின்மையும் தேவையற்ற விளக்கவுரையின்றி காக்கப்பட்டுள்ளன.
