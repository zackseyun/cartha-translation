source:
  edition: SBLGNT
  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: ta
  text: நீங்களே எங்கள் கடிதம்; அது எங்கள் இதயங்களில் எழுதப்பட்டு, எல்லா மக்களாலும் அறியப்பட்டும் வாசிக்கப்பட்டும் இருக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: எங்கள் கடிதம்
  rationale: ἐπιστολή என்பது எழுதப்பட்ட தகவல் தொடர்பைக் குறிக்கிறது; நவீன தமிழில் ‘கடிதம்’ இயல்பானதும் உருவகத்தைத் தெளிவாகத் தக்கவைப்பதும் ஆகும். ἡμῶν உடைமையைக் குறிக்கிறது.
- source_word: ὑμεῖς ἐστε
  choice: நீங்களே
  rationale: தனியே வெளிப்படையாக வரும் ὑμεῖς என்பதன் வலியுறுத்தலை இயல்பான தமிழில் ‘நீங்களே’ வெளிப்படுத்துகிறது.
- source_word: ἐγγεγραμμένη
  choice: எழுதப்பட்டு
  rationale: நிலைத்த விளைவைக் கொண்ட நிறைவேற்றப்பட்ட எழுத்துச் செயலைக் குறிக்கும் perfect passive participle; ‘எழுதப்பட்டு’ கடித உருவகத்தைக் காக்கிறது.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: எங்கள் இதயங்களில்
  rationale: ἐν என்பதன் இடப்பொருளை ‘இதயங்களில்’ நேரடியாகவும் இயல்பாகவும் தருகிறது; பன்மை καρδίαις என்பதும் காக்கப்படுகிறது.
- source_word: γινωσκομένη
  choice: அறியப்பட்டும்
  rationale: γινώσκω இங்கு ‘அறியப்படுதல்’ அல்லது ‘அடையாளம் காணப்படுதல்’ என்ற பொருளளிக்கலாம்; முதன்மைப் பொருளாக இயல்பான ‘அறியப்பட்டும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀναγινωσκομένη
  choice: வாசிக்கப்பட்டும்
  rationale: கடிதத்தை வாசிப்பதைக் குறிக்கும் சொற்பொருளைத் தக்கவைத்து, முன் வரும் passive participle உடன் இணையான அமைப்பை உருவாக்குகிறது.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: எல்லா மக்களாலும்
  rationale: ἀνθρώπων பொதுவாக மனிதர்களைக் குறிக்கிறது; பாலின வரம்பில்லாத நவீனத் தமிழாக ‘எல்லா மக்களாலும்’ பொருந்துகிறது.
