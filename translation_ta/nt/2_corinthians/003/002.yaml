translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான நடை. கிரேக்கத்தின் கடித உருவகமும், இரு passive participles-இன் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
