  source_fidelity: 'The Tamil accurately conveys the metaphor and all principal Greek elements: the emphatic second-person subject, “our letter,” its being written in the reviewers’/apostolic team’s hearts, and its being known and read by all people. The passive sense and the broad scope of ὑπὸ πάντων ἀνθρώπων are retained. The added Tamil anaphoric pronoun “அது” is idiomatic and does not alter the meaning.'
