id: 2CO.3.10
reference: 2 Corinthians 3:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: ta
  text: ஏனெனில், மகிமைப்படுத்தப்பட்டிருந்தது, மிஞ்சும் மகிமையின் காரணமாக, இந்த வகையில் மகிமைப்படுத்தப்பட்டதாக இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேன்மையான மகிமையின் காரணமாக.”
    reason: ὑπερβαλλούσης δόξης என்பதை ஒப்பீட்டின் இலக்கை வெளிப்படையாகக் குறிப்பிடாமல், பெயரடைத் தன்மையுடன் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: உண்மையில்
  rationale: இச்சூழலில் தொடரை விளக்கி வலியுறுத்தும் இணைப்பின் இயல்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐ δεδόξασται
  choice: மகிமைப்படுத்தப்பட்டதாகவே இல்லை
  rationale: நிறைவேற்றப்பட்ட செயப்பாட்டு வினையின் வடிவத்தையும், ஒப்பீட்டால் உருவாகும் பவுலின் முரண்பாட்டுத் தோற்றத்தையும் காக்கிறது; முற்றிலும் மகிமை இல்லை என்று தனியே கூறுவதில்லை.
- source_word: τὸ δεδοξασμένον
  choice: மகிமைப்படுத்தப்பட்டிருந்தது
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகால நிறைவேற்றப்பட்ட பங்கேற்பு வடிவத்தை, மூலத்தில் இல்லாத ‘ஊழியம்’ அல்லது ‘உடன்படிக்கை’ போன்ற பெயர்களைச் சேர்க்காமல் தருகிறது.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: இந்த வகையில்
  rationale: மறுப்பு ஒரு குறிப்பிட்ட ஒப்பீட்டு நோக்கிற்குள் மட்டுப்படுத்தப்படுவதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: εἵνεκεν
  choice: காரணமாக
  rationale: சொற்றொடரின் காரண உறவைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: அதை மிஞ்சும் மகிமை
  rationale: ὑπερβαλλούσης என்பதன் ஒப்பீட்டு இயக்கத்தை வினைத் தன்மையுடன் காக்கிறது; ‘அதை’ என்பது சூழலில் முன் கூறப்பட்ட மகிமைப்படுத்தப்பட்டதைச் சுட்டும் விளக்கச் சேர்க்கை.
- source_word: δόξα / δεδοξασμένον
  choice: மகிமைப்படுத்தப்பட்டிருந்தது ... மகிமை ... மகிமைப்படுத்தப்பட்டதாக
  rationale: δοξ- என்ற ஒரே சொல் குடும்பத்தின் சொல்லாடலைத் தமிழிலும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: முந்தைய உடன்படிக்கை சார்ந்த ஊழியத்திற்கு மகிமை இருந்ததைப் பவுல் முற்றிலும் மறுக்கிறாரா, அல்லது ஒப்பீட்டு முறையில் பேசுகிறாரா?
  choice: '‘இந்த வகையில்’ என்ற வரம்பிற்குள் ஒப்பீட்டு மறுப்பு: மிஞ்சும் மகிமையோடு ஒப்பிடும்போது முந்தையது மகிமைப்படுத்தப்பட்டதாக இல்லை.'
  alternative: முந்தைய ஊழியத்திற்கு உண்மையான மகிமை எதுவும் இருந்ததில்லை என்ற முழுமையான மறுப்பு.
  rationale: ἐν τούτῳ τῷ μέρει மறுப்பை வரையறுக்கிறது; மேலும் 2 கொரிந்தியர் 3-ன் பரந்த சூழல் முந்தைய ஊழியத்திற்கும் மகிமை இருந்ததாகக் கூறி, அதை மேம்பட்ட மகிமை மங்கச் செய்வதாக விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மகிமை/மகிமைப்படுத்துதல் சொல்லாடலும் ஒப்பீட்டால் எழும் இறையியல் அழுத்தமும் காக்கப்பட்டுள்ளன.
