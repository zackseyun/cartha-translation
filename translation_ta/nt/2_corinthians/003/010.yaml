  revision_rationale: The revision represents γάρ with “ஏனெனில்,” retains the perfect-passive wordplay, preserves the qualified comparative denial expressed by “இந்த வகையில்,” and avoids supplying an object that the Greek leaves implicit. The footnote now gives a natural lexical alternative without shifting the participle into a past sense.
