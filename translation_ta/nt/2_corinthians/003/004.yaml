  yaml_path: translation/nt/2_corinthians/003/004.yaml
  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: ta
  text: மேசியா வழியாகக் கடவுளிடம் எங்களுக்கு இப்படிப்பட்ட நம்பிக்கை இருக்கிறது[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து வழியாக.”
    reason: alternative_reading
  - marker: b
    text: நேரடிப் பொருள், “கடவுளை நோக்கி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεποίθησιν
  choice: நம்பிக்கை
  rationale: சூழலில் இது நிலையான உறுதியையும் நம்பிக்கையையும் குறிக்கிறது; பொதுவான நவீன தமிழில் “நம்பிக்கை” இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: δὲ τοιαύτην
  choice: இப்படிப்பட்ட
  rationale: δὲ முந்தைய கருத்துடன் மென்மையான தொடர்பை ஏற்படுத்துகிறது; தமிழில் தனிக் கூட்டுச்சொல்லை வலிந்து சேர்க்காமல், τοιαύτην என்பதன் முந்தைய சூழலைச் சுட்டும் பண்பை “இப்படிப்பட்ட” இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔχομεν
  choice: எங்களுக்கு ... இருக்கிறது
  rationale: கிரேக்கத்தின் “நாம் கொண்டிருக்கிறோம்” என்ற பொருளை இயல்பான தமிழ் உடைமை அமைப்பில் நேரடியாகத் தருகிறது.
- source_word: διὰ τοῦ Χριστοῦ
  choice: மேசியா வழியாக
  rationale: διά + genitive இடைமுகம் அல்லது வழிமுறையைக் குறிப்பதால் “வழியாக” பொருத்தமானது. Χριστός இங்கு பட்டப்பெயராகப் புரிந்துகொள்ளப்படுவதால் “மேசியா” பயன்படுத்தப்பட்டுள்ளது.
- source_word: πρὸς τὸν θεόν
  choice: கடவுளிடம்
  rationale: πρός என்பதன் கடவுளை நோக்கிய உறவுசார் திசையை இயல்பான தமிழில் “கடவுளிடம்” தெரிவிக்கிறது; அதன் சொற்சார்ந்த திசைப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் Χριστός பட்டப்பெயரின் வலிமையைக் கொண்டிருப்பதால் முதன்மை உரையில் “மேசியா” என்று தரப்பட்டுள்ளது; பாரம்பரிய வடிவமான “கிறிஸ்து” மாற்றாக அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: πρὸς τὸν θεόν என்பதன் உறவுசார் திசை
  choice: கடவுளிடம்
  alternative: கடவுளை நோக்கி
  rationale: “கடவுளிடம்” என்பது தமிழில் உறவுசார் நோக்கை இயல்பாக வெளிப்படுத்துகிறது; “கடவுளை நோக்கி” என்பது கிரேக்க முன்னிடைச்சொல்லின் சொற்சார்ந்த திசையைத் தெளிவாகக் காட்டினாலும் இங்கு சற்றுக் கடினமாக ஒலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. கிரேக்கச் சொல்வரிசையை அப்படியே பின்பற்றாமல், இயல்பான தமிழ் வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது; அதேவேளையில் இடைமுகம், நம்பிக்கை, கடவுளை நோக்கிய உறவு ஆகிய கருத்துகள் பாதுகாக்கப்பட்டுள்ளன.
