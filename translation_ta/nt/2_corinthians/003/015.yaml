source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: ta
  text: ஆனால், இன்றுவரை, மோசே[a] வாசிக்கப்படும்போதெல்லாம், அவர்களுடைய இதயத்தின்மேல்[b] ஒரு திரை இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “மோசே” என்பது மோசேயின் எழுத்துகளை, குறிப்பாகச் சட்டத்தை, குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: கிரேக்கத்தில் “அவர்களுடைய இதயம்” என்று ‘இதயம்’ ஒருமையில் உள்ளது; இது ஒரு குழுவை ஒருமையாகக் குறிக்கும் பயன்பாடாக இருக்கலாம். “அவர்களுடைய இதயங்களின்மேல்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள முரண்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἕως σήμερον
  choice: இன்றுவரை
  rationale: அந்த நிலை நிகழ்காலம்வரை தொடர்வதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: வாசிக்கப்படும்போதெல்லாம்
  rationale: ἡνίκα, ἄν, நிகழ்கால துணைவினை ஆகியவற்றின் சேர்க்கை திரும்பத் திரும்ப நிகழும் வரையறையற்ற சூழலைக் குறிக்கிறது; ‘போதெல்லாம்’ அந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: கிரேக்க மூலத்தில் உள்ள ஆகுபெயர்ப் பயன்பாட்டை அப்படியே வைத்திருக்கிறது; மோசேயின் எழுத்துகள் என்பது அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: κάλυμμα
  choice: ஒரு திரை
  rationale: இவ்வதிகாரம் முழுவதும் தொடரும் திரை உருவகத்துடன் பொருந்தும் தெளிவான சொல்.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: அவர்களுடைய இதயத்தின்மேல்
  rationale: பன்மை உடைமைப்பெயருடன் வரும் ஒருமை ‘இதயம்’ என்ற மூல வடிவத்தைப் பாதுகாக்கிறது; இது கூட்டொருமையாக இருக்கலாம்.
- source_word: κεῖται
  choice: இருக்கிறது
  rationale: திரை இதயத்தின்மேல் தொடர்ந்து நிலைத்திருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘கிடக்கிறது’ என்பதைவிட இச்சூழலில் இயல்பாக உள்ளது.
theological_decisions:
- issue: ‘மோசே’ என்பது மோசேயின் சட்டத்தையா எழுத்துகளையா குறிக்கிறது என்பதை முதன்மை உரையிலேயே வெளிப்படுத்துவதா
  choice: மூலத்தில் உள்ளபடி ‘மோசே’ என்ற ஆகுபெயரை முதன்மை உரையில் வைத்தல்
  alternative: ‘மோசேயின் சட்டம்’ அல்லது ‘மோசேயின் எழுத்துகள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: மூல உரை ‘மோசே’ என்றே கூறுவதால், அதன் ஆகுபெய்ச் சுருக்கத்தையும் உண்மையான விளக்கத் திறப்பையும் பாதுகாக்கிறது; தேவையான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மோசே வாசிக்கப்படும்போதெல்லாம்’ என்ற மூலத்தின் ஆகுபெய் அமைப்பு திட்டமிட்டே பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; ‘இதயம்’ ஒருமையும் மூலத்தின் கூட்டொருமைத் தெளிவின்மையைத் தக்கவைக்கிறது.
