id: 2CO.3.16
reference: 2 Corinthians 3:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡνίκα ⸂δὲ ἐὰν⸃ ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: ta
  text: ஆனால், ஆண்டவரிடம் திரும்பும்போதெல்லாம்[a], முக்காடு அகற்றப்படுகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருவர் ஆண்டவரிடம் திரும்பும்போது.’ மூலமொழியில் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: syntactic_ambiguity
  - marker: b
    text: அல்லது, ‘முக்காடு நீக்கப்படுகிறது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: ஆனால், … திரும்பும்போதெல்லாம்
  rationale: δέ என்பதன் மாறுபாட்டைக் காட்டும் இணைப்பை ‘ஆனால்’ தக்கவைக்கிறது; ἡνίκα உடன் ἐὰν மற்றும் துணைவினை வடிவம் தரும் வரையறுக்கப்படாத அல்லது ஒவ்வொரு முறையும் நிகழும் காலப் பொருளை ‘போதெல்லாம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπιστρέψῃ
  choice: திரும்பும்
  rationale: திசைமாற்றித் திரும்புதல் என்ற உருவகத்தைத் தக்கவைக்கிறது; ‘மனந்திரும்புதல்’ அல்லது ‘மதம் மாறுதல்’ என்று பொருளை முன்கூட்டியே குறுக்கவில்லை.
- source_word: πρὸς κύριον
  choice: ஆண்டவரிடம்
  rationale: πρός குறிக்கும் ஒருவரை நோக்கிய இயக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான மரியாதைத் தலைப்பு; இவ்வசனம் கூறாத ‘கிறிஸ்து’ அல்லது ‘ஆவியானவர்’ என்ற அடையாளத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: περιαιρεῖται
  choice: அகற்றப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, செய்பவரை வெளிப்படையாகச் சேர்க்காமல் முக்காட்டுக்கு நிகழ்வதைத் தெளிவாகக் கூறுகிறது.
- source_word: τὸ κάλυμμα
  choice: முக்காடு
  rationale: மோசேயின் முகத்தை மூடிய முக்காட்டைப் பற்றிய உடனடி பின்னணிக்கு ஏற்ற, தமிழில் அறியப்பட்ட சொல்; பொதுவான ‘மூடி’ என்பதைவிட இச்சூழலில் துல்லியமானது.
theological_decisions:
- issue: ἐπιστρέψῃ என்ற வினைக்குரிய எழுவாய் மூலத்தில் வெளிப்படையாகக் கூறப்படாதது
  choice: தமிழின் இயல்பான எழுவாய் விடுபாட்டைப் பயன்படுத்தி, ‘ஒருவர்’ போன்ற வெளிப்படையான எழுவாயை முதன்மை உரையில் சேர்க்காமல் விடுதல்
  alternative: ‘ஒருவர் ஆண்டவரிடம் திரும்பும்போதெல்லாம்’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் எழுவாய் இல்லை. தமிழ் எழுவாயைச் சேர்க்காமலேயே முழுமையான வாக்கியத்தை வழங்குவதால், தனிநபரா, இஸ்ரவேலரா, அல்லது முன்சூழலில் குறிப்பிட்ட வேறு எழுவாயா என்ற விளக்கத் திறப்பைத் தேவையின்றி முடிவுசெய்யவில்லை.
- issue: ‘ஆண்டவர்’ யார் என்பதன் அடையாளம்
  choice: ‘ஆண்டவர்’ என்றே மொழிபெயர்த்தல்
  alternative: ‘ஆண்டவராகிய கிறிஸ்து’ அல்லது ‘ஆண்டவர், அதாவது ஆவியானவர்’ என்று வெளிப்படுத்துதல்
  rationale: இந்த வசனத்தில் κύριον மட்டுமே உள்ளது. சுற்றியுள்ள வசனங்களில் ஆண்டவருக்கும் ஆவியானவருக்கும் உள்ள தொடர்பு விளக்கச் சிக்கலை ஏற்படுத்தினாலும், மொழிபெயர்ப்பு அதைத் தனக்கே உரிய விதத்தில் தீர்மானிக்காமல் மூலத்தின் இறையியல் அழுத்தத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘முக்காடு’ மோசேயைப் பற்றிய சூழலுடன் தொடர்பைத் தெளிவாக வைத்திருக்கிறது; வாக்கியத்தின் செயப்பாட்டு அமைப்பும் மூலத்தில் விடப்பட்டுள்ள எழுவாயும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
