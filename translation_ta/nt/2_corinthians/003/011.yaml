id: 2CO.3.11
reference: 2 Corinthians 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ καταργούμενον διὰ δόξης, πολλῷ μᾶλλον τὸ μένον ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: ta
  text: ஏனெனில், முடிவுக்குக் கொண்டுவரப்படுவது[a] மகிமையுடன் இருந்ததென்றால்[b], நிலைத்திருப்பது[c] இன்னும் எவ்வளவோ அதிகமாக மகிமையில் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செயலற்றதாக்கப்படுவது,’ ‘ஒதுக்கிவைக்கப்படுவது’ அல்லது ‘ஒழிக்கப்படுவது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படி, ‘மகிமையின் வழியாக.’
    reason: lexical_alternative
  - marker: c
    text: ‘தொடர்ந்து இருப்பது’ அல்லது ‘எஞ்சியிருப்பது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: முடிவுக்குக் கொண்டுவரப்படுவது
  rationale: καταργέω என்பதன் ‘செயலற்றதாக்கு, முடிவுக்குக் கொண்டுவா, ஒழித்துவிடு’ என்ற அடிப்படைப் பொருளை நேரடியாகக் காட்டுகிறது. சூழலில் உள்ள தற்காலிகத் தன்மையை உணர்த்தினாலும், ‘மங்கிப்போவது’ என்ற விளக்கப் பொருளை முதன்மை உரைக்குள் கொண்டு வரவில்லை.
- source_word: διὰ δόξης
  choice: மகிமையுடன் இருந்தது
  rationale: διά + genitive என்பதன் சொற்படியான வடிவம் ‘மகிமையின் வழியாக’ என்றாலும், இங்கு மறைந்திருக்கும் வினையை நிரப்பி, அந்தத் தற்காலிகமானது மகிமையால் சூழப்பட்டிருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μένον
  choice: நிலைத்திருப்பது
  rationale: μένω என்பதன் ‘நிலைத்திரு, தொடர்ந்து இரு’ என்ற பொருளையும், கிரேக்கத்தின் பெயர்ச்சொல் தன்மையுள்ள நடுநிலைப் பங்கேற்பெச்ச வடிவத்தையும் காக்கிறது.
- source_word: ἐν δόξῃ
  choice: மகிமையில் இருக்கிறது
  rationale: முன்னிடைச்சொல் தொடரை நேரடியாகக் காத்து, மகிமை ஒரு நிலை அல்லது சூழல் என்பதைக் காட்டுகிறது.
- source_word: πολλῷ μᾶλλον
  choice: இன்னும் எவ்வளவோ அதிகமாக
  rationale: ஒப்பீட்டின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தற்காலிகமானதற்கும் நிலைத்திருப்பதற்கும் இடையிலான வேறுபாடு
  choice: வசனம் குறிப்பிடாத ‘பழைய உடன்படிக்கை’, ‘புதிய உடன்படிக்கை’ போன்ற பெயர்களைச் சேர்க்காமல், முடிவுக்குக் கொண்டுவரப்படுவதையும் நிலைத்திருப்பதையும் மட்டும் கூறுதல்
  alternative: வசனத்தின் சூழலை விளக்குவதற்காக இரு உடன்படிக்கைகளையும் உரையிலேயே வெளிப்படையாகப் பெயரிடுதல்
  rationale: கிரேக்கத்தில் நடுநிலைப் பெயர்ச்சொல் தன்மையுள்ள பங்கேற்பெச்சங்களே உள்ளன; இவ்வசனத்தில் உடன்படிக்கைகள் நேரடியாகப் பெயரிடப்படவில்லை. ஆகவே பவுலின் சொல்லாட்சியிலுள்ள திறந்த தன்மையும் இறையியல் அழுத்தமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் சுருக்கமான எதிர்மறை இணைப்பைத் தமிழில் தெளிவாக்க மறைந்திருக்கும் ‘இரு’ வினை சேர்க்கப்பட்டுள்ளது; ஆனால் சூழலிலிருந்து வரும் உடன்படிக்கை அடையாளங்கள் உரைக்குள் சேர்க்கப்படவில்லை.
