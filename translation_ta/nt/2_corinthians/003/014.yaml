source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: ta
  text: ஆனால் அவர்களுடைய மனங்கள் மழுங்கிப்போயின. ஏனெனில் இன்றுவரை, பழைய உடன்படிக்கை[a] வாசிக்கப்படும்போது, அதே முக்காடு அகற்றப்படாமல் அப்படியே இருக்கிறது; ஏனெனில் அது மெசியாவில் நீக்கப்படுகிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பழைய ஏற்பாடு.” கிரேக்கத்தில், “பழைய உடன்படிக்கை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏனெனில் பழைய உடன்படிக்கை மெசியாவில் ஒழிக்கப்படுகிறது / விலக்கப்படுகிறது.” ‘நீக்கப்படுகிறது’ என்பதன் எழுவாய் முக்காடா, பழைய உடன்படிக்கையா என்பதில் கிரேக்கச் சொற்றொடர் ஓரளவு தெளிவற்றதாக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: மழுங்கிப்போயின
  rationale: உணரவும் புரிந்துகொள்ளவும் இயலாதபடி கடினமடைந்த நிலையைக் குறிக்கிறது; வேண்டுமென்றே பிடிவாதம் செய்தார்கள் என்று மிகைப்படுத்தாமல், இறந்தகாலச் செயப்பாட்டு உணர்வையும் தருகிறது.
- source_word: τὰ νοήματα αὐτῶν
  choice: அவர்களுடைய மனங்கள்
  rationale: இங்கு அவர்களுடைய சிந்தனை மற்றும் புரிந்துகொள்ளும் ஆற்றலைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் பவுலின் கருத்தோட்டத்துக்கு ஏற்றவாறும் உள்ளது.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: ஏனெனில் இன்றுவரை
  rationale: மூலத்தின் காரணத் தொடர்பையும் கால அழுத்தத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: κάλυμμα
  choice: முக்காடு
  rationale: சுற்றியுள்ள மோசேயின் நிகழ்வோடு உள்ள உருவகத் தொடர்பைப் பாதுகாக்கும் தெளிவான தமிழ்ச் சொல்.
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: வாசிக்கப்படும்போது
  rationale: வாசிப்பு நிகழும் நேரத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: παλαιᾶς διαθήκης
  choice: பழைய உடன்படிக்கை
  rationale: διαθήκη என்பதன் அடிப்படைப் பொருளான ‘உடன்படிக்கை’ என்பதைப் பாதுகாக்கிறது; மரபுவழி ‘பழைய ஏற்பாடு’ என்ற நூற்பகுதிப் பெயரை இங்கு திணிக்கவில்லை.
- source_word: μένει μὴ ἀνακαλυπτόμενον
  choice: அகற்றப்படாமல் அப்படியே இருக்கிறது
  rationale: முக்காடு தொடர்ந்து இருப்பதையும் அது விலக்கப்படாத நிலையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν Χριστῷ
  choice: மெசியாவில்
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: καταργεῖται
  choice: நீக்கப்படுகிறது
  rationale: அருகிலுள்ள ‘முக்காடு’ என்பதைக் குறிக்கும் வாசிப்பில் இயல்பாக அமைகிறது; செயப்பாட்டு வடிவத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: καταργεῖται என்பதன் மறைமுக எழுவாய்
  choice: ‘முக்காடு’ நீக்கப்படுகிறது
  alternative: ‘பழைய உடன்படிக்கை’ ஒழிக்கப்படுகிறது அல்லது விலக்கப்படுகிறது
  rationale: இலக்கணப்படி மிக அருகிலுள்ள எழுவாய் ‘முக்காடு’; மேலும் ‘அகற்றப்படாமல்’ என்ற முக்காட்டு உருவகத்தோடும் இது தொடர்ச்சியாக அமைகிறது. இருப்பினும் பழைய உடன்படிக்கையைக் குறிக்கும் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ὅτι என்பதன் தொடர்பு
  choice: ‘ஏனெனில்’ என்ற காரணத் தொடர்பு
  alternative: ‘என்பது’ என்ற உள்ளடக்கத் தொடர்பாக வாசித்தல்
  rationale: ὅτι-யின் வழக்கமான காரணப் பொருளை முதன்மை உரையில் வைத்துள்ளோம்; கிரேக்கத் தொடரின் சுருக்கத்தால் உருவாகும் விளக்கத் தளர்வை தேவையற்ற சொற்களால் தீர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘முக்காடு’ உருவகம் தொடர்ச்சியாகப் பாதுகாக்கப்பட்டுள்ளது. ‘பழைய உடன்படிக்கை’ என்பது மூலச்சொல்லை முன்னிறுத்துகிறது; மரபுவழி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
