source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: ta
  text: நீங்கள் மேசியாவிடமிருந்து வந்த கடிதம்[a][b] என்பது வெளிப்படையாகத் தெரிகிறது. அது எங்கள் பணியால் உருவாக்கப்பட்டு, மையால் அல்ல, வாழும் கடவுளின் ஆவியால் எழுதப்பட்ட கடிதம்; கற்பலகைகளில் அல்ல, சதையாலான இதயங்கள் என்னும் பலகைகளில்[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியாவின் கடிதம்.” கிரேக்க உடைமை வேற்றுமை இவ்வாறு நேரடியாகவும் மொழிபெயர்க்கப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “மேசியா” என்பது Χριστός என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு; பாரம்பரியமாக, “கிறிஸ்து.”
    reason: lexical_alternative
  - marker: c
    text: “சதையாலான இதயங்கள்” என்ற சொற்றொடர் புதிய உடன்படிக்கையைப் பற்றிய பழைய ஏற்பாட்டு உருவகத்தை, குறிப்பாக எசேக்கியேல் 11:19; 36:26 ஆகியவற்றை, எதிரொலிக்கிறது.
    reason: cross_reference
  - marker: d
    text: இதை இன்னும் சொல் நெருக்கமாக, “சதையாலான இதயங்களின் பலகைகளில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: literal_rendering
lexical_decisions:
- source_word: φανερούμενοι
  choice: வெளிப்படையாகத் தெரிகிறது
  rationale: இந்தப் பங்கேற்புவினை, கொரிந்தியர்கள் மேசியாவின் கடிதம் என்பது வெளிப்பட்டிருப்பதைத் தெரிவிக்கிறது. தமிழில் இயல்பாகவும் சூழலின் தொடர்ச்சியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது.
- source_word: ἐπιστολὴ
  choice: கடிதம்
  rationale: உருவகத்தைத் தெளிவாகத் தக்கவைக்கும் எளிய, நவீனத் தமிழ்ச் சொல்.
- source_word: Χριστοῦ
  choice: மேசியாவிடமிருந்து வந்த
  rationale: Χριστός இங்கு பட்டப்பெயராக இருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டது. உடைமை வேற்றுமை கடிதத்தின் மூலத்தையோ ஆசிரியரையோ குறிக்கக்கூடும் என்பதால் முதன்மை உரையில் ‘மேசியாவிடமிருந்து வந்த’ எனக் கொடுக்கப்பட்டது; நேரடியான மாற்று அடிக்குறிப்பில் உள்ளது.
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: எங்கள் பணியின் மூலம் அளிக்கப்பட்டது
  rationale: பவுலும் அவருடைய உடன்பணியாளர்களும் அந்தக் கடிதத்தின் ஆசிரியர்கள் அல்ல, அது வெளிப்படுவதற்குப் பணியாற்றியவர்கள் என்ற உருவக உறவை இயல்பான தமிழில் காட்டுகிறது. ‘ஊழியம் செய்யப்பட்டது’ என்ற இயல்பற்ற சொற்றொடர் தவிர்க்கப்பட்டது.
- source_word: ἐγγεγραμμένη
  choice: எழுதப்பட்டது
  rationale: மை/ஆவி என்ற எதிரிணைக்கும் பலகை உருவகத்துக்கும் ஏற்ற நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: μέλανι
  choice: மையால்
  rationale: எழுதும் உருவகத்தில் கிரேக்கச் சொல்லின் நேரடியான தமிழ் இணை.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: வாழும் கடவுளின் ஆவியால்
  rationale: வெளிப்புற மைக்கு எதிராகச் செயல்படும் கடவுளின் ஆவியைக் குறிக்கும் சொற்றொடரை முழுமையாகத் தக்கவைக்கிறது.
- source_word: πλαξὶν λιθίναις
  choice: கற்பலகைகளில்
  rationale: சீனாய் உடன்படிக்கையின் கற்பலகைகளை நினைவூட்டும் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: சதையான இதயங்கள் என்னும் பலகைகளில்
  rationale: பலகைகளே சதையான இதயங்கள் என்ற அண்மைநிலை உறவைத் தெளிவாக்கி, கிரேக்க உருவகத்தையும் எசேக்கியேல் நூலின் புதிய உடன்படிக்கை எதிரொலியையும் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் உறவு
  choice: மேசியாவிடமிருந்து வந்த கடிதம்
  alternative: மேசியாவின் கடிதம்
  rationale: கிரேக்க உடைமை வேற்றுமை மூலத்தையோ ஆசிரியரையோ அல்லது பொதுவான உடைமை உறவையோ குறிக்கலாம். சூழலில் மேசியா கடிதத்தின் மூலமாகவும் பவுலின் குழு அதற்குப் பணியாற்றியவர்களாகவும் தோன்றுவதால் முதன்மை உரை மூலத்தைக் காட்டுகிறது; உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πνεύματι என்பதன் குறிப்பு
  choice: வாழும் கடவுளின் ஆவி
  alternative: வாழும் கடவுளின் ஆற்றல் அல்லது உயிர்மூச்சு
  rationale: மைக்கு எதிராக இதயங்களில் எழுதும் தெய்வீக செயற்பாட்டாளராக வருவதாலும் உடன்படிக்கைச் சூழலாலும் கடவுளின் ஆவியே குறிக்கப்படுவது வலுவாக ஆதரிக்கப்படுகிறது.
- issue: καρδίαις σαρκίναις என்ற உருவகம்
  choice: சதையான இதயங்கள் என்னும் பலகைகள்
  alternative: சதையான இதயங்களின் பலகைகள்
  rationale: கிரேக்கச் சொற்றொடர் பலகைகளும் இதயங்களும் ஒரே உருவகப் பொருளைக் குறிப்பதாகப் புரிந்துகொள்ள இடமளிக்கிறது. தமிழில் தவறான உடைமைத் தொடர்பை ஏற்படுத்தாமல் அந்த அண்மைநிலை விளக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும், அதே நேரத்தில் வேதாகம உருவகத்தின் மாண்பையும் இறையியல் இறுக்கத்தையும் காக்கும் நடை பயன்படுத்தப்பட்டது. ‘ஊழியம்’ போன்ற சமயக் குழுவுக்கே உரிய சொல்லாட்சிக்குப் பதிலாக ‘பணி’ பயன்படுத்தப்பட்டது. ‘சதையான’ என்பது அன்றாட வழக்கில் அரிதானதாயினும், கல் இதயம்/சதை இதயம் என்ற வேதாகம எதிரிணையையும் மூல உருவகத்தையும் காக்கத் தேர்ந்தெடுக்கப்பட்டது.
