  source_fidelity: முதன்மையான உருவகங்கள்—மேசியாவிடமிருந்து வந்த கடிதம், மை/வாழும் கடவுளின் ஆவி, கல் பலகைகள்/இதயங்கள்—பெரும்பாலும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் διακονηθεῖσα ὑφ’ ἡμῶν என்பதற்கு “எங்கள் பணியின் மூலம் அளிக்கப்பட்டது” என்பது கடிதம் அளிக்கப்படுதல் என்ற கூடுதல் கருத்தைத் தருகிறது; பவுலும் உடன்பணியாளர்களும் அந்தக் கடிதத்திற்குப் பணியாற்றியவர்கள் என்ற மூலத்தின் செயற்பாட்டு உருவகத்தைத் துல்லியமாகக் காட்டவில்லை. மேலும் ஒரே ἐγγεγραμμένη-க்கு தமிழில் இருமுறை “எழுதப்பட்டது” என்று கூறுவது தேவையற்றது.
  naturalness: “சதையான இதயங்கள்” என்பது புரிந்துகொள்ளத்தக்கதாயினும் நவீன பொதுத்தமிழில் சற்றே இயல்பற்றது. “சதையாலான இதயங்கள்” மூல உருவகத்தைத் தக்கவைத்துக்கொண்டு இயல்பாக ஒலிக்கிறது. இறுதி எதிரிணையில் ஒரு முறை மட்டுமே “எழுதப்பட்ட” என்று கூறி வாக்கியத்தைச் செம்மையாக்கலாம்.
  terminology: “மேசியா,” “கடவுளின் ஆவி,” “கற்பலகைகள்” ஆகியவை பொருத்தமானவை. Χριστοῦ-வின் உறவுக்கான மாற்று வாசிப்பும், இதயங்கள் பலகைகளாக இருக்கும் உருவகத்துக்கான அடிக்குறிப்பும் பொருத்தமாக உள்ளன. διακονηθεῖσα-விற்கு “எங்கள் மூலம் பணியாற்றப்பட்ட” எனும் உருவக மொழி தமிழில் முழுமையாக வழக்கமல்ல; “எங்கள் பணியால் உருவாக்கப்பட்ட” என்பது இங்கு கடித உருவகத்தில் பவுலின் நடுநிலைச் சேவையை இயல்பாகக் காட்டுகிறது; இருப்பினும் மேசியாவே மூலமாக இருப்பதைத் தெளிவாக வைத்திருக்கிறது.
