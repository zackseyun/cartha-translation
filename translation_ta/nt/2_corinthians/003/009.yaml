id: 2CO.3.9
reference: 2 Corinthians 3:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: ta
  text: ஏனெனில், கண்டனத் தீர்ப்பின் ஊழியம் மகிமையோடு வந்ததென்றால், நீதியின்[a] ஊழியம் மகிமையில் எவ்வளவோ அதிகமாகப் பெருகுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயத்தின்.”
    reason: δικαιοσύνη என்பதற்கு இச்சூழலில் ‘நியாயம்’ என்ற பொருளும் சாத்தியம்.
lexical_decisions:
- source_word: διακονία
  choice: ஊழியம்
  rationale: பவுல் தனிப்பட்ட சேவைச் செயல்களை அல்ல, ஒன்றுக்கொன்று மாறுபடும் இரண்டு உடன்படிக்கை சார்ந்த பணிகளைப் பற்றிப் பேசுவதால், ‘ஊழியம்’ என்பது சூழலுக்கு ஏற்றதாகும்.
- source_word: κατάκρισις
  choice: தண்டனைத் தீர்ப்பு
  rationale: குற்றவாளி எனத் தீர்த்து தண்டனை விதிக்கும் சட்டவியல் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; பொதுவான ‘தீர்ப்பு’ என்பதைக் காட்டிலும் மூலச்சொல்லின் எதிர்மறை வலிமையைப் பாதுகாக்கிறது.
- source_word: δόξα
  choice: மகிமை
  rationale: இப்பகுதி முழுவதும் தொடரும் பவுலின் ஒப்பீட்டைத் தக்கவைக்கும் இயல்பான இறையியல் சொல்.
- source_word: πολλῷ μᾶλλον
  choice: எவ்வளவோ அதிகமாக
  rationale: இரண்டாவது ஊழியத்தின் மேன்மையை வலியுறுத்தும் கிரேக்க ஒப்பீட்டுத் தீவிரத்தை இயல்பான தமிழில் தருகிறது.
- source_word: περισσεύω
  choice: பெருகுகிறது
  rationale: அளவுக்கு மிகுதியாக இருப்பது அல்லது நிரம்பி வழிவது என்ற கருத்தை, ‘மகிமையில்’ என்பதுடன் இயல்பாக இணைக்கிறது.
- source_word: δικαιοσύνη
  choice: நீதி
  rationale: பவுலின் பயன்பாட்டிலுள்ள நீதிநிலை, சரியான உறவு, நீதி ஆகிய பரப்பை ஓரளவு திறந்தவாறே வைத்திருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰ γὰρ τῇ διακονίᾳ … δόξα
  choice: ஏனெனில் … ஊழியம் மகிமையோடு வந்ததென்றால்
  rationale: கிரேக்க முதல் உட்பிரிவில் வெளிப்படையான வினைச்சொல் இல்லை. ‘மகிமையோடு வந்தது’ என்பது தேவையான வினையை இயல்பாக நிரப்பி, முதல் ஊழியத்துடன் மகிமை இணைந்திருந்ததைச் சொல்கிறது; இரண்டாவது ஊழியம் மகிமையில் பெருகுகிறது என்ற சமச்சீரற்ற ஒப்பீட்டையும் காக்கிறது.
theological_decisions:
- issue: δικαιοσύνη என்ற சொல்லை இரண்டு ஊழியங்களின் பவுலிய ஒப்பீட்டில் மொழிபெயர்த்தல்
  choice: நீதி
  alternative: நியாயம்
  rationale: ‘நீதி’ என்பது பவுலின் இறையியல் பயன்பாட்டைக் குறுக்காமல் பரந்த பொருளைத் தக்கவைக்கிறது. சமூக அல்லது நியாயவியல் வலியுறுத்தலுடைய ‘நியாயம்’ என்ற சாத்தியமான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: வினையில்லாத முதல் கிரேக்க உட்பிரிவின் பொருள்
  choice: மகிமையோடு வந்தது
  alternative: மகிமை உடையதாக இருந்தது
  rationale: மூலத்தில் வினை வெளிப்படையாக இல்லாததால் தமிழில் ஒன்று நிரப்பப்பட வேண்டும். இயக்கமுள்ள இத்தொடர், கண்டனத் தீர்ப்பின் ஊழியத்துடன் மகிமை வந்ததை இயல்பாகக் கூறுகிறது; அதேவேளையில் ‘மகிமையில் பெருகுகிறது’ என்ற அடுத்த கூற்றின் உயர்த்தப்பட்ட வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பின்பற்றுகிறது. ‘ஊழியம்,’ ‘மகிமை,’ ‘நீதி’ ஆகிய பரிச்சயமான சொற்கள் வைக்கப்பட்டுள்ளன; ‘தண்டனைத் தீர்ப்பு’ சட்டவியல் எதிர்மறைப் பொருளைத் தெளிவாக்குகிறது. இறுதி வியப்புக்குறி கிரேக்கத்தில் இல்லாவிட்டாலும், தீவிரமான எவ்வளவோ-அதிகம் ஒப்பீட்டைத் தமிழில் இயல்பாக உணர்த்துகிறது.
