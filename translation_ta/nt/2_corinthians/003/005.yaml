  text: நாங்கள் எங்களாலேயே எதையும் எங்களிடமிருந்து வந்ததாகக் கருதுவதற்குத் தகுதியுள்ளவர்கள் என்பதல்ல; மாறாக, எங்களுடைய தகுதி கடவுளிடமிருந்து வருகிறது.
