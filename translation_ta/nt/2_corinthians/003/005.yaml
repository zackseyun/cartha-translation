lexical_decisions:
- source_word: οὐχ ὅτι
  choice: என்பதல்ல
  rationale: பவுல் முன் கூறியதை மறுப்பதல்லாமல், அதற்கு ஒரு தெளிவுபடுத்தும் வரம்பை இச்சொற்றொடர் அறிமுகப்படுத்துகிறது; தமிழில் ‘என்பதல்ல’ அந்தச் சொல்லாட்சித் திருப்பை இயல்பாகக் காட்டுகிறது.
- source_word: ἀφ’ ἑαυτῶν
  choice: எங்களிலேயே
  rationale: தேவையான போதுமான தன்மை அவர்களுக்குள்ளேயே இயல்பாக இருப்பதில்லை என்ற கருத்தை இது காட்டுகிறது; பின்னர் வரும் ἐξ αὑτῶν என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: ἱκανοί
  choice: போதுமானவர்கள்
  rationale: தேவையான அளவுக்குத் தகுதியுடையவர்களாக இருப்பது என்ற பரந்த பொருளை இது தருகிறது; ஊழியத் திறமை என்ற குறுகிய பொருளைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: λογίσασθαί
  choice: கருதுவதற்கு
  rationale: மனத்தில் கணித்தல், மதிப்பிடுதல் என்ற கருத்தை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τι
  choice: எதையும்
  rationale: மறுப்பு அமைப்பில் உள்ள வரம்பற்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὡς ἐξ αὑτῶν
  choice: எங்களிடமிருந்து வந்ததாக
  rationale: ஒரு காரியத்தின் மூலம் அல்லது தோற்றுவாய் நாங்களே என்று கருதுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἡ ἱκανότης ἡμῶν
  choice: எங்களுடைய போதுமான தகுதி
  rationale: ἱκανοί என்பதுடனான சொற்பொருள் தொடர்பைக் காக்க ‘போதுமான’ என்பதையும், தமிழில் பெயர்ச்சொல்லாக இயல்பாக அமைய ‘தகுதி’ என்பதையும் இணைக்கிறது.
- source_word: ἐκ τοῦ θεοῦ
  choice: கடவுளிடமிருந்தே வருகிறது
  rationale: அந்தத் தகுதியின் மூலம் கடவுளே என்பதை ‘-ஏ’ வலியுறுத்தலுடன் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: மனிதத் திறனைப் பற்றிய பவுலின் கூற்றின் பரப்பு
  choice: தாமாகவே உண்டாகும் போதுமான தகுதி இல்லை என்ற பரந்த கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: அப்போஸ்தல ஊழியத்திற்கான திறமை மட்டுமே இங்கு குறிக்கப்படுகிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: உடனடிச் சூழல் ஊழியத்தைப் பற்றியது என்றாலும், கிரேக்க வசனத்தின் சொற்கள் அதைவிடப் பரந்தவை; எனவே மொழிபெயர்ப்பு அதைத் தேவையின்றி குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ἀφ’ ἑαυτῶν (‘எங்களிலேயே’) மற்றும் ἐξ αὑτῶν (‘எங்களிடமிருந்து’) ஆகிய இரு தொடர்களின் நுண்ணிய வேறுபாடு காக்கப்பட்டுள்ளது.
