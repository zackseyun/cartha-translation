source:
  edition: SBLGNT
  text: Ἀρχόμεθα πάλιν ἑαυτοὺς ⸀συνιστάνειν; ⸀ἢ μὴ χρῄζομεν ὥς τινες συστατικῶν ἐπιστολῶν πρὸς ὑμᾶς ἢ ἐξ ⸀ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: ta
  text: நாங்கள் மீண்டும் எங்களையே பரிந்துரைத்துக்கொள்ளத் தொடங்குகிறோமா? அல்லது சிலரைப் போல, உங்களுக்குக் கொடுக்கவோ உங்களிடமிருந்து பெறவோ வேண்டிய பரிந்துரைக் கடிதங்கள்[a] எங்களுக்குத் தேவையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நற்சான்றுக் கடிதங்கள்.’
    reason: συστατικῶν ἐπιστολῶν என்பது ஒருவரை அறிமுகப்படுத்தி ஆதரிக்கும் கடிதங்களைக் குறிக்கும்; ‘நற்சான்றுக் கடிதங்கள்’ அதன் அங்கீகார நுணுக்கத்தை எடுத்துக்காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Ἀρχόμεθα πάλιν
  choice: மீண்டும் ... தொடங்குகிறோமா?
  rationale: நிகழ்கால வினையின் தொடக்க/தொடர்நிலை நுணுக்கத்தையும் πάλιν குறிக்கும் மீளச்செயலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἑαυτοὺς συνιστάνειν
  choice: எங்களையே பரிந்துரைக்க
  rationale: தங்களைச் சாதகமாக அறிமுகப்படுத்தி அங்கீகாரம் பெறச் செய்வது என்ற சூழல்சார் பொருளைத் தருகிறது; ἑαυτούς என்பதன் வலியுறுத்தலை ‘எங்களையே’ காக்கிறது.
- source_word: χρῄζομεν
  choice: எங்களுக்குத் தேவையா?
  rationale: தேவைப்படுதல் என்ற நேரடியான பொருளை இயல்பான கேள்வி வடிவில் தருகிறது; μή சுட்டும் எதிர்மறை விடை எதிர்பார்ப்பை வெளிப்படையாகச் சேர்க்காமல் சொல்லாட்சியே உணர்த்துகிறது.
- source_word: ὥς τινες
  choice: சிலரைப் போல
  rationale: குறிப்பிடப்படாத சிலருடனான ஒப்பீட்டைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: συστατικῶν ἐπιστολῶν
  choice: பரிந்துரைக் கடிதங்கள்
  rationale: ஒருவரை அறிமுகப்படுத்தி அவருக்காக நற்சான்று அளிக்கும் கடிதங்களைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொற்றொடர்.
- source_word: πρὸς ὑμᾶς ἢ ἐξ ὑμῶν
  choice: உங்களிடம் கொடுப்பதற்கோ உங்களிடமிருந்து பெறுவதற்கோ
  rationale: πρός குறிக்கும் இலக்கையும் ἐξ குறிக்கும் மூலத்தையும் தமிழில் தெளிவுபடுத்துகிறது. ‘கொடுப்பதற்கு/பெறுவதற்கு’ என்பது மூலத்தில் உள்ளுறையாக இருக்கும் உறவுகளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: μή உடைய சொல்லாட்சிக் கேள்வி
  choice: எதிர்பார்க்கப்படும் ‘இல்லை’ என்ற விடையை உரையில் வெளிப்படையாகச் சேர்க்காமல் கேள்வி வடிவையே வைத்தல்
  alternative: ‘எங்களுக்கு அவை தேவையில்லையே?’ என்று மொழிபெயர்த்தல்
  rationale: மூலத்தின் சொல்லாட்சிக் கேள்வியையும் அதன் மறைமுக எதிர்பார்ப்பையும் காக்கிறது; விளக்கத்தை உரைக்குள் திணிக்கவில்லை.
- issue: συνιστάνειν என்பதன் பொருள்
  choice: பரிந்துரைக்க
  alternative: புகழ்ந்துகொள்ள
  rationale: இங்கு தம்மைச் சாதகமாக முன்வைத்தல் என்ற பொருள் உள்ளது; அடுத்துள்ள பரிந்துரைக் கடிதங்களோடும் சொல் தொடர்பை இது காக்கிறது. ‘புகழ்ந்துகொள்ள’ என்பது சுயபுகழ்ச்சி என்ற பொருளை மிகத் தீர்மானமாக்கிவிடலாம்.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் சொல்லாட்சிக் கேள்வியின் கூர்மையும் காக்கப்பட்டுள்ளன. ‘உங்களிடம் கொடுப்பதற்கோ ... பெறுவதற்கோ’ என்பது திசை மற்றும் மூல உறவுகளை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
