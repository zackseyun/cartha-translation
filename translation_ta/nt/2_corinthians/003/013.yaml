reference: 2 Corinthians 3:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: ta
  text: மேலும், மறைந்துகொண்டிருந்ததன் முடிவை[b] இஸ்ரவேலர்[a] உற்றுப் பார்க்காதபடி, மோசே தன் முகத்தின்மேல் முக்காடு போடுவதைப் போல நாங்கள் செய்வதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்’; பொருளில், ‘இஸ்ரவேலர்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘முடிவுக்குக் கொண்டுவரப்பட்டுக்கொண்டிருந்ததின் இலக்கை/விளைவை.’
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: போல
  rationale: முந்தைய கூற்றுடன் ஒப்பிடும் பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐτίθει
  choice: போட்டுக்கொண்டிருந்ததை
  rationale: இறந்தகாலத்தில் வழக்கமாக அல்லது மீண்டும் மீண்டும் செய்த செயலைக் குறிக்கும் கிரேக்க முற்றுப்பெறா வினையின் நுணுக்கத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: κάλυμμα
  choice: முக்காடு
  rationale: முகத்தை மறைக்கும் துணியையும் பவுலின் தொடரும் உருவகத்தையும் இயல்பாகக் குறிக்கும் துல்லியமான தமிழ் சொல்.
- source_word: πρόσωπον αὐτοῦ
  choice: தன் முகத்தின்மேல்
  rationale: மோசேயின் சொந்த முகத்தைக் குறிக்கத் தமிழில் இயல்பான தற்சுட்டுப் பயன்பாடு.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: உற்றுப் பார்க்காதபடி
  rationale: நோக்கத்தைக் காட்டும் தொடரையும் ἀτενίζω என்பதிலுள்ள கூர்ந்து நிலைத்துப் பார்க்கும் வலிமையையும் காக்கிறது.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: இஸ்ரவேலர்[a]
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு மக்களைக் குறிக்கும் எபிரேய வழக்கை இயல்பான தமிழில் ‘இஸ்ரவேலர்’ என வழங்கி, மூல வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: εἰς τὸ τέλος
  choice: முடிவை[b]
  rationale: τέλος என்பதன் ‘முடிவு’ என்ற பொருள் உடனடிச் சூழலில் தற்காலிகமானதற்கும் நிலைத்திருப்பதற்கும் இடையிலான வேறுபாட்டோடு நன்றாகப் பொருந்துகிறது; ‘இலக்கு/விளைவு’ என்ற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: τοῦ καταργουμένου
  choice: மறைந்துபோய்க்கொண்டிருந்ததின்
  rationale: குறைந்து நீங்கிக்கொண்டிருப்பதை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; ‘முடிவுக்குக் கொண்டுவரப்பட்டுக்கொண்டிருந்தது’ என்ற அதிகச் சொற்பிறழ்வற்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: τέλος τοῦ καταργουμένου என்பதன் பொருள்
  choice: மறைந்துபோய்க்கொண்டிருந்ததின் முடிவு
  alternative: முடிவுக்குக் கொண்டுவரப்பட்டுக்கொண்டிருந்ததின் இலக்கு அல்லது விளைவு
  rationale: உடனடிச் சூழல் தற்காலிகமான மகிமையையும் நிலைத்திருப்பதையும் வேறுபடுத்துகிறது. முதன்மை உரை அதன் நீங்குதலைக் காட்டுகிறது; ஆயினும் τέλος மற்றும் καταργουμένου ஆகியவற்றின் உண்மையான பொருள் விரிவை அடிக்குறிப்பு மூலம் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் ஒப்பீட்டு அமைப்பு காக்கப்பட்டாலும், தமிழில் எழுவாய் தெளிவதற்காக ‘நாங்கள் செய்வதில்லை’ என வெளிப்படுத்தப்பட்டுள்ளது. மூலத்தின் பாலினச் சொல்வடிவமும் τέλος/καταργέω தொடரின் பொருள் தெளிவின்மையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
