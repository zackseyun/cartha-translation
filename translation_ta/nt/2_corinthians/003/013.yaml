revisions:
- from: மேலும், மறைந்துபோய்க்கொண்டிருந்ததின் முடிவை[b] இஸ்ரவேலர்[a] உற்றுப் பார்க்காதபடி, மோசே தன் முகத்தின்மேல் முக்காடு போட்டுக்கொண்டிருந்ததைப் போல நாங்கள் செய்வதில்லை.
  to: மேலும், மறைந்துகொண்டிருந்ததன் முடிவை[b] இஸ்ரவேலர்[a] உற்றுப் பார்க்காதபடி, மோசே தன் முகத்தின்மேல் முக்காடு போடுவதைப் போல நாங்கள் செய்வதில்லை.
