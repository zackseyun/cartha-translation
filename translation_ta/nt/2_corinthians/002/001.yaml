  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: ta
  text: ஏனெனில், மீண்டும் உங்களிடம் துயரத்தோடு[a] வர வேண்டாம் என்று நான் எனக்குள்ளே தீர்மானித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘துயரத்தில்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: தீர்மானித்தேன்
  rationale: இங்கு κρίνω என்பதன் இறந்தகால வடிவம், பவுல் சிந்தித்து எடுத்த உறுதியான தனிப்பட்ட முடிவைக் குறிக்கிறது; ‘தீர்மானித்தேன்’ என்பது இயல்பான நவீனத் தமிழில் அந்த வலிமையைத் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: γάρ முந்தைய கருத்துக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதன் காரணவிளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐμαυτῷ
  choice: எனக்குள்
  rationale: இந்தத் தற்சுட்டுப் பெயர்ச்சொல்லின் வேற்றுமை வடிவம் உள்ளார்ந்த தனிப்பட்ட முடிவைக் குறிக்கிறது; ‘எனக்குள்’ என்பது அந்த நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῦτο
  choice: … என்று
  rationale: τοῦτο முன்னோக்கி வரும் வினையெச்சத் தொடரைச் சுட்டுகிறது. தமிழில் தனியாக ‘இதை’ என்று வைத்தால் வாக்கியம் இறுக்கமாகத் தோன்றுவதால், அதன் முன்னோக்கிச் சுட்டும் செயல்பாடு ‘என்று’ அமைப்பில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: வரக் கூடாது என்று
  rationale: பெயர்ச்சொல் தன்மையுடைய வினையெச்சத் தொடர் தீர்மானத்தின் உள்ளடக்கத்தைத் தருகிறது. ‘வரக் கூடாது என்று’ என்பது தனக்குத்தானே வகுத்த முடிவை இயல்பான தமிழில் தெரிவிக்கிறது; இது வெளிப்புறத் தடையை அல்ல, முடிவின் எதிர்மறை உள்ளடக்கத்தைக் குறிக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: πάλιν மீள்நிகழ்வைக் குறிக்கிறது; ‘மீண்டும்’ நேரடியான, பொதுவான தமிழ் இணைச்சொல்.
- source_word: ἐν λύπῃ
  choice: துயரத்தோடு
  rationale: λύπη துயரம், வருத்தம், மனவேதனை ஆகிய பரப்பைக் கொண்டது. ‘துயரத்தோடு’ இயல்பான தமிழாக இருந்து, வருகை துயரச் சூழலில் நிகழ்வதா அல்லது துயரத்தை உடன் கொண்டுவருவதா என்ற சாத்திய நுணுக்கத்தைத் திறந்தவாறு வைக்கிறது.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம்
  rationale: வருதல் என்னும் வினையுடன் πρός + வேற்றுமை உருபு நபர்களை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘உங்களிடம் வருதல்’ என்பது இயல்பான பயன்பாடு.
