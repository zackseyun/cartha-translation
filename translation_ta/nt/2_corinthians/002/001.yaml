translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் விளக்க இணைப்பு ‘ஏனெனில்’ எனப் பாதுகாக்கப்பட்டுள்ளது; தமிழ் இயல்புக்காக முடிவின் உள்ளடக்கம் முதலில் வந்து, ‘எனக்குள் தீர்மானித்தேன்’ இறுதியில் அமைக்கப்பட்டுள்ளது.
