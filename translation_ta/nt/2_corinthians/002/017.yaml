id: 2CO.2.17
reference: 2 Corinthians 2:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: ta
  text: ஏனெனில், கடவுளுடைய வார்த்தையை வியாபாரப் பொருளாக்குகிற அந்தப் பலரைப் போல நாங்கள் இல்லை. மாறாக, கபடமற்ற தன்மையோடு, கடவுளிடமிருந்து வந்தவர்களாக, கடவுளின் முன்னிலையில், மேசியாவுக்குள் நாங்கள் பேசுகிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πολλοί
  choice: அந்தப் பலர்
  rationale: குறிப்பிட்ட ஒரு பெரிய குழுவைச் சுட்டும் கிரேக்க உருபைத் தக்கவைத்து, அதை புள்ளிவிவர ரீதியாக ‘பெரும்பாலோர்’ என்று மிகையாக விளக்காமல் இருக்கிறது.
- source_word: καπηλεύοντες
  choice: வியாபாரப் பொருளாக்குகிற
  rationale: கடவுளுடைய வார்த்தையைத் தன்னலமான வணிகத்திற்குப் பயன்படுத்தும் வியாபார உருவகத்தையும் எதிர்மறை நுண்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: மூலத்தின் இறைமொழிச் சொற்றொடரை நேரடியாகவும் மரியாதையான நடையிலும் வழங்குகிறது.
- source_word: ἐξ εἰλικρινείας
  choice: கபடமற்ற உள்ளத்திலிருந்து
  rationale: ἐξ என்பதன் மூலாதார நுண்பொருளைத் தக்கவைத்து, εἰλικρίνεια குறிக்கும் நேர்மையையும் தூய நோக்கையும் தெளிவான நவீன தமிழில் சொல்கிறது.
- source_word: ἐκ θεοῦ
  choice: கடவுளிடமிருந்து வந்தவர்களாக
  rationale: பேசுகிறவர்களின் அதிகாரமும் அனுப்புதலும் கடவுளை மூலமாகக் கொண்டவை என்பதை இயல்பான தமிழில் காட்டுகிறது; ‘இருந்து’ என்ற மூலாதார இணைப்பையும் காக்கிறது.
- source_word: κατέναντι θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: கடவுளின் பிரசன்னத்திலும் அவருக்குப் பொறுப்புடையவர்களாகவும் பேசும் கருத்தை விளக்கச் சேர்க்கையின்றி வழங்குகிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவுக்குள்
  rationale: ἐν என்பதன் உறவு/வட்டார நுண்பொருளைத் திறந்தவாறு வைத்துக் கொண்டு, Χριστός என்பதன் பட்டப்பெயர்ப் பொருளை ‘மேசியா’ என மொழிபெயர்க்கிறது.
- source_word: λαλοῦμεν
  choice: நாங்கள் பேசுகிறோம்
  rationale: பொதுவான கிரேக்க வினையின் நிகழ்காலத்தை நேரடியாக வழங்குகிறது; ‘அறிவிக்கிறோம்’ போன்ற வலுவான விளக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: ἐν Χριστῷ என்பதிலுள்ள Χριστός-ஐ எவ்வாறு வழங்குவது
  choice: மேசியாவுக்குள்
  alternative: கிறிஸ்துவுக்குள் / கிறிஸ்துவில்
  rationale: இங்கு பட்டப்பெயரின் பொருள் உயிரோடு இருப்பதால் Χριστός-ஐ வெறும் ஒலிபெயர்ப்பாக அல்லாமல் ‘மேசியா’ என்று மொழிபெயர்க்கிறது; அதேவேளை ἐν குறிக்கும் ஒன்றிப்பையும் செயல்பாட்டு வட்டாரத்தையும் ஒரே விளக்கமாகச் சுருக்கவில்லை.
- issue: ἐξ εἰλικρινείας மற்றும் ἐκ θεοῦ ஆகிய இணை அமைப்புகள்
  choice: கபடமற்ற உள்ளத்திலிருந்து பேசுகிறவர்களாகவும், கடவுளிடமிருந்து வந்தவர்களாகவும்
  alternative: கபடமற்ற உள்ளத்தோடும், கடவுளிடமிருந்தும்
  rationale: இரண்டு மூலாதாரக் கூறுகளையும் வேறுபடுத்திக் காட்டுகிறது; ஆனால் தமிழில் தவறாகப் புரியக்கூடிய ‘கடவுளிலிருந்து பேசுதல்’ என்ற அமைப்பை இயல்பாக்குகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், மரியாதையும் பவுலின் எதிர்மறை–நேர்மறை மாறுபாடும் காக்கப்பட்டுள்ளன. ‘வியாபாரப் பொருளாக்குகிற’ என்பது சாதாரண வாசகருக்குப் புரியும் வகையில் வணிக உருவகத்தைத் தக்கவைக்கிறது. ‘மேசியாவுக்குள்’ சற்றே இறையியல் சார்ந்த சொற்றொடராக இருந்தாலும், மூலத்தின் ἐν Χριστῷ அமைப்பிலுள்ள திட்டமிட்ட உறவுப் பொருளை விளக்கி முடிக்காமல் பாதுகாக்கிறது.
