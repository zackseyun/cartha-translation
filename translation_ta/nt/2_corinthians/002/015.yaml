lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பாக இருப்பதால், கிரேக்கத்தின் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைத் தக்கவைத்திருப்பதால், 'மெசியா' என்று மொழிபெயர்க்கப்பட்டது; உருபுடைமை வடிவம் அந்த நறுமணம் மெசியாவுக்குரியது அல்லது அவரால் பண்புபெற்றது என்பதைக் காட்டுகிறது.
- source_word: εὐωδία
  choice: நறுமணம்
  rationale: கிரேக்கச் சொல் இனிய அல்லது ஏற்புடைய மணத்தைக் குறிக்கிறது. பலியைக் குறித்த பின்னணிக்கும் உணர்வுப்புல உருவகத்திற்கும் ஏற்ற இயல்பான தமிழ் சொல் இது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: திசை அல்லது உறவை உணர்த்தும் கிரேக்க நான்காம் வேற்றுமையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐν τοῖς σῳζομένοις
  choice: மீட்கப்பட்டு வருகிறவர்களிடையிலும்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான செயல்முறையை 'மீட்கப்பட்டு வருகிறவர்கள்' என்பதன் மூலம் தக்கவைக்கிறது; ἐν இச்சூழலில் 'இடையில்' என்ற சமூக உறவைக் குறிக்கிறது.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: அழிந்துகொண்டிருக்கிறவர்களிடையிலும்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான நிலை அல்லது செயல்முறையைத் தக்கவைத்து, அழிவின் விதத்தைத் தேவையின்றி குறிப்பாக்காமல் விடுகிறது.
theological_decisions:
- issue: σῳζομένοις மற்றும் ἀπολλυμένοις ஆகியவற்றின் தொடர்ச்சியான அம்சம்
  choice: “மீட்கப்பட்டு வருகிறவர்கள்” என்றும் “அழிந்துகொண்டிருக்கிறவர்கள்” என்றும் செயல்முறையாக மொழிபெயர்த்தல்
  alternative: “மீட்கப்பட்டவர்கள்” மற்றும் “அழிந்தவர்கள்” என்ற நிறைவுற்ற நிலைகளாக மொழிபெயர்த்தல்
  rationale: இரண்டு நிகழ்காலப் பங்கேற்புவினைகளும் தொடரும் செயல்முறை அல்லது நிலையைச் சுட்டுகின்றன. அவற்றை முடிவுற்ற அடையாளங்களாக மாற்றாமல், பவுலின் இறையியல் இழுவிசை தக்கவைக்கப்படுகிறது.
- issue: Χριστός என்பதன் பட்டப்பெயர் தன்மை
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இவ்வுருபுடைமைக் கட்டமைப்பிலும் பட்டப்பெயரின் பொருள் உணரப்படுவதால் 'மெசியா' முதன்மை உரையாக வைக்கப்படுகிறது; தமிழ்க் கிறிஸ்தவ வழக்கிலுள்ள இணையான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. இணையான இரு ἐν தொடர்களையும் காட்ட “வருகிறவர்களிடையிலும் … இருக்கிறவர்களிடையிலும்” என்ற சமச்சீர் அமைப்பு பயன்படுத்தப்பட்டது; தமிழின் இயல்பான கவனமுன்னிலைக்காக அந்த இரு தொடர்களும் முதலில் வைக்கப்பட்டன.
