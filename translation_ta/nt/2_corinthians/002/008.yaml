revisions:
- from: ஆகவே, அவர்மீது உங்களுக்கு அன்பு இருப்பதை உறுதிப்படுத்தும்படி உங்களை வேண்டிக்கொள்கிறேன்.
  to: ஆகவே, அவர்மீதுள்ள உங்கள் அன்பை உறுதிப்படுத்தும்படி உங்களை வேண்டிக்கொள்கிறேன்.
  rationale: The revision retains the draft’s accurate consequential and pastoral wording while directly rendering ‘confirm your love for him.’ It neither adds ‘again’ nor specifies the manner of confirmation, both of which remain unstated in the Greek.
