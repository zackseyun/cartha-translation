  text: διὸ παρακαλῶ ὑμᾶς κυρῶσαι εἰς αὐτὸν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/008.yaml
  text: Therefore I urge you to confirm your love for him.
translation:
  language: ta
  text: ஆகவே, அவர்மீதுள்ள உங்கள் அன்பை உறுதிப்படுத்தும்படி உங்களை வேண்டிக்கொள்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய அறிவுறுத்தலிலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: παρακαλῶ ὑμᾶς
  choice: உங்களை வேண்டிக்கொள்கிறேன்
  rationale: இங்கு உள்ள அன்பான, தீவிரமான வேண்டுகோளின் தொனியைப் பேணுகிறது; வெறும் கட்டளையாக மாற்றவில்லை.
- source_word: κυρῶσαι
  choice: உறுதிப்படுத்தும்படி
  rationale: κυρόω என்பதன் ‘செல்லுபடியாக்குதல், உறுதிசெய்தல்’ என்ற பொருளை வெளிப்படுத்துகிறது; சபை தன் அன்பைத் தெளிவான செயலால் உறுதிப்படுத்த வேண்டும் என்பதையும் திறந்தவாறு வைத்திருக்கிறது.
- source_word: εἰς αὐτὸν ἀγάπην
  choice: அவர்மீது உங்களுக்கு அன்பு இருப்பதை
  rationale: அந்த நபரை நோக்கிய அன்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; αὐτόν ஆண்பால் ஒருமை என்பதால் ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: அன்பை ‘உறுதிப்படுத்துதல்’ என்பது முந்தைய அன்பை மீண்டும் அறிவிப்பதா அல்லது சபைத் தீர்மானமாகச் செயல்படுத்துவதா
  choice: உறுதிப்படுத்தும்படி
  alternative: மீண்டும் உறுதிப்படுத்தும்படி / வெளிப்படுத்தும்படி
  rationale: மூலத்தில் ‘மீண்டும்’ என்பதற்கான தனிப்பட்ட கூறு இல்லை; அதேவேளை அன்பு நடைமுறையில் தெளிவாக அங்கீகரிக்கப்பட வேண்டும் என்ற வலிமையை ‘உறுதிப்படுத்துதல்’ பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் பவுலின் மேய்ப்புப் பணிசார்ந்த வேண்டுகோள் தொனியும் பேணப்பட்டுள்ளன. வாசிப்பை கனமாக்கும் சட்டவியல் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
