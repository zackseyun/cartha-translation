id: 2CO.2.9
reference: 2 Corinthians 2:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: ta
  text: 'இதற்காகவே நானும் எழுதினேன்: நீங்கள் எல்லாவற்றிலும் கீழ்ப்படிகிறவர்களாய் இருக்கிறீர்களா என்று, உங்கள் உண்மைத்தன்மையை அறிந்துகொள்வதற்காக.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: இதற்காகத்தான் நான் எழுதினேன்
  rationale: எழுதியதன் நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; καὶ இங்கு வலியுறுத்தல்/இணைப்பு நிழலைத் தருவதால் தனியே இயந்திரமாக மொழிபெயர்க்கப்படவில்லை.
- source_word: ἵνα γνῶ
  choice: அறிந்துகொள்வதற்காக
  rationale: நோக்கக் கூறையும், சோதனையின் மூலம் தெரிந்துகொள்ளும் பொருளையும் காக்கிறது.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: உங்கள் சோதிக்கப்பட்ட தன்மையை
  rationale: δοκιμή என்பதிலுள்ள சோதனை மற்றும் அதனால் வெளிப்படும் நிரூபிக்கப்பட்ட குணம் ஆகிய இரு நிழல்களையும் முடிந்தவரை காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: நீங்கள் எல்லாவற்றிலும் கீழ்ப்படிகிறவர்களா என்பதை
  rationale: εἰ என்பதை மறைமுக வினாவாகவும், εἰς πάντα என்பதை விரிவான கீழ்ப்படிதலாகவும் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: δοκιμή என்பது சோதனையையா அல்லது சோதனையில் நிரூபிக்கப்படும் தன்மையையா குறிக்கிறது
  choice: சோதிக்கப்பட்ட தன்மை
  alternative: சோதனை; நிரூபணம்
  rationale: சூழலில் கீழ்ப்படிதலால் வெளிப்படும் குணத்தைக் குறிக்க வாய்ப்புள்ளது; ஆயினும் மூலச்சொல்லின் உண்மையான பொருள் விரிவை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. மூலத்தின் நோக்கக் கூறும் δοκιμή என்ற சொல்லின் பொருள் நெகிழ்வும் பாதுகாக்கப்பட்டுள்ளன.
