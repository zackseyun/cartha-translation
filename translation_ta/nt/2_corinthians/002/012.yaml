id: 2CO.2.12
reference: 2 Corinthians 2:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: ta
  text: நான் மேசியாவின் நற்செய்திக்காகத்[a] துரோவாவுக்கு வந்தபோது, ஆண்டவருக்குள் எனக்காக ஒரு கதவு திறக்கப்பட்டிருந்த நிலையில்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கிறிஸ்துவின் நற்செய்திக்காக.”'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “ஆண்டவருக்குள் எனக்காக ஒரு கதவு திறந்திருந்தபோது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: நான் ... வந்தபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை இங்கு காலச் சூழலைக் குறிக்கிறது. δέ ஒரு மென்மையான உரைமாற்றத்தைச் சுட்டுகிறது; தமிழில் தேவையற்ற தனிச் சொல்லைச் சேர்க்காமல் வாக்கிய ஓட்டத்திலேயே அது வெளிப்படுகிறது.
- source_word: εἰς τὴν Τρῳάδα
  choice: துரோவாவுக்கு
  rationale: இடத்தை நோக்கிய இயக்கத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: மேசியாவின் நற்செய்திக்காக
  rationale: இரண்டாவது εἰς நோக்கத்தைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘பிரசங்கிக்க’ என்பதைச் சேர்க்கவில்லை. Χριστός இங்கு பட்டப்பெயராக இருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது; உருபுச் சார்பின் உண்மையான பொருள் வரம்பைச் சுருக்காமல் ‘மேசியாவின்’ என வைக்கப்பட்டுள்ளது.
- source_word: θύρας
  choice: ஒரு கதவு
  rationale: சூழலில் இது வாய்ப்பைக் குறிக்கும் உருவகம் என்றாலும், பவுலின் கதவு உருவகத்தை நேரடியாகப் பேணுகிறது.
- source_word: ἀνεῳγμένης
  choice: திறக்கப்பட்டிருந்த
  rationale: நிறைவேற்றப்பட்ட செயலும் அதன் தொடரும் நிலையும் சேர்ந்துள்ள நிறைவு செயப்பாட்டு வடிவத்தின் வலிமையைப் பேணுகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: ἐν என்பதைக் கருவிப்பொருளாக ‘ஆண்டவரால்’ என்று தீர்மானித்துவிடாமல், பவுலின் தனிச்சிறப்பான ‘ஆண்டவருக்குள்’ என்ற உறவுசார் மொழியைப் பேணுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு Χριστός தனிப்பெயரைப் போல அல்லாமல் அபிஷேகம் செய்யப்பட்ட அரசரைக் குறிக்கும் பட்டப்பெயராக இயங்குகிறது. ஆகவே ‘மேசியா’ அந்தப் பட்டத்தின் பொருளைத் தெளிவாகப் பேணுகிறது.
- issue: ἐν κυρίῳ என்பதன் தொடர்பு
  choice: ஆண்டவருக்குள்
  alternative: ஆண்டவரால்
  rationale: கதவைத் திறந்தவர் ஆண்டவர் என்ற கருவிப்பொருள் வாசிப்பு சூழலுக்கு ஏற்றதாக இருந்தாலும், ἐν என்பதை அதற்கு மட்டும் கட்டுப்படுத்தாமல் மூலத்தின் உறவுசார் தெளிவின்மையைப் பேணுகிறது.
- issue: Genitive absolute தொடரின் சூழ்நிலைத் தொடர்பு
  choice: திறக்கப்பட்டிருந்த நிலையில்
  alternative: திறக்கப்பட்டிருந்தபோதிலும்
  rationale: அடுத்த வசனம் ஒரு எதிர்மறைத் திருப்பத்தை உருவாக்கினாலும், இவ்வசனத்தின் καί மற்றும் பங்கேற்புவினை அமைப்பு தாமாகவே எதிர்மறை இணைப்பை வெளிப்படையாகக் குறிக்கவில்லை. எனவே நடுநிலையான சூழ்நிலைத் தொடர்பு பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இது அடுத்த வசனத்தில் நிறைவுபெறும் வாக்கியத்தின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘நற்செய்தி,’ ‘மேசியா,’ ‘ஆண்டவர்,’ ‘கதவு’ ஆகிய வேதாகமச் சொற்களும் உருவகமும் பொதுவாசகருக்கு எளிதாக இருக்கும் வகையில் பேணப்பட்டுள்ளன.
