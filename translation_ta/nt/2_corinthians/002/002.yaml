source:
  edition: SBLGNT
  text: εἰ γὰρ ἐγὼ λυπῶ ὑμᾶς, καὶ ⸀τίς ὁ εὐφραίνων με εἰ μὴ ὁ λυπούμενος ἐξ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: ta
  text: ஏனெனில், நான் உங்களைத் துயரப்படுத்தினால், என்னால் துயரப்படுகிறவரைத் தவிர வேறு யார் என்னை மகிழ்விப்பார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னால் துயரமடைந்தவரைத் தவிர”; ἐξ ἐμοῦ என்பது “என்னால்” அல்லது “என் காரணமாக” என்ற மூலத்தையோ காரணத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: துயரப்படுத்தினால்
  rationale: ஒருவருக்குத் துயரத்தை உண்டாக்குதல் என்ற causative பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: εὐφραίνων
  choice: மகிழ்விப்பார்
  rationale: பவுலுக்கு மகிழ்ச்சியை உண்டாக்குகிற நபரைக் குறிக்கும் causative கருத்தையும், λυπῶ என்பதுடனான முரண்பாட்டையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τίς ὁ εὐφραίνων με
  choice: வேறு யார் என்னை மகிழ்விப்பார்?
  rationale: பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினையின் கருத்தை இயல்பான தமிழ்க் கேள்வியாகவும் அதன் rhetorical force உடனும் வழங்குகிறது.
- source_word: ὁ λυπούμενος
  choice: துயரப்படுகிறவர்
  rationale: கிரேக்க நிகழ்கால passive participle-இன் தொடரும் நிலையைப் பாதுகாக்கும் வகையில் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: ἐξ ἐμοῦ
  choice: என்னால்
  rationale: இங்கு மூலத்தையோ காரணத்தையோ குறிக்கக்கூடிய சொற்றொடரை ‘என்னால்’ என்று வழங்குவது, பவுலே அந்தத் துயரத்திற்குக் காரணம் என்பதைக் கூறுவதுடன் கிரேக்கத்தின் சுருக்கத்தையும் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துடன் இவ்வசனத்திற்குள்ள விளக்கத் தொடர்பைத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: ὁ λυπούμενος ἐξ ἐμοῦ என்பதின் செயப்படுபொருள் தன்மையும் காரணத் தொடர்பும்
  choice: என்னால் துயரப்படுகிறவர்
  alternative: நான் துயரப்படுத்தியவர்
  rationale: மாற்று வாசகம் தமிழில் இயல்பாக இருந்தாலும், அது நிகழ்கால passive participle-ஐ நிறைவுற்ற செயல் போல மாற்றிவிடலாம். தேர்ந்த வாசகம் நிகழும்/தொடரும் துயர்நிலையையும் ἐξ ἐμοῦ-இன் காரண அல்லது மூல உறவையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘துயரப்படுத்துதல் / துயரப்படுதல்’ என்ற சொல் மீள்கூறல் கிரேக்க λυπέω வேர்ச்சொல்லின் திட்டமிட்ட ஒலியியல்-கருத்தியல் தொடர்பைப் பாதுகாக்கிறது; ‘வேறு யார்’ என்பது εἰ μὴ (‘தவிர’) அமைப்பின் rhetorical கேள்வியை இயல்பாக்குகிறது.
