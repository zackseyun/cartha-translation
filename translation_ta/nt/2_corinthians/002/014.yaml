language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: ta
  text: ஆனால், மேசியாவுக்குள் எப்போதும் எங்களை வெற்றிப் பவனியில் வழிநடத்தி[a], அவரைப் பற்றிய அறிவின் நறுமணத்தை[b] எங்கள் வழியாக எல்லா இடங்களிலும் வெளிப்படுத்துகிற கடவுளுக்கு நன்றி!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியாவுக்குள் எங்கள்மேல் எப்போதும் வெற்றிபெறுகிறார்.”
    reason: alternative_reading
  - marker: b
    text: “நறுமணம்” என்பதற்கு மாற்றாக, “மணம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: நன்றி
  rationale: Τῷ δὲ θεῷ χάρις என்ற நன்றியறிவிப்புத் தொடரின் இயல்பான, துதிசார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: θριαμβεύοντι
  choice: வெற்றிப் பவனியில் நடத்தி
  rationale: பொதுவான வெற்றியை மட்டும் அல்லாமல், வெற்றிப் பவனியின் தெளிவான உருவகத்தையும் காக்கிறது; ἡμᾶς என்பதை நேரடி செயப்படுபொருளாக வைத்திருக்கிறது.
- source_word: ἐν τῷ Χριστῷ
  choice: மேசியாவுக்குள்
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதையும், மேசியாவோடு ஒன்றுபட்டிருக்கும் உறவு அல்லது செயல்களத்தையும் வெளிப்படுத்துகிறது.
- source_word: ὀσμὴν
  choice: நறுமணம்
  rationale: சூழலிலுள்ள நேர்மறையான உருவகப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: γνώσεως
  choice: அறிவு
  rationale: கடவுளைப் பற்றிய அறிவு அப்போஸ்தலப் பணியின் வழியாகப் பரவுவதை நேரடியாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: φανεροῦντι
  choice: வெளிப்படுத்துகிற
  rationale: அறிவின் நறுமணத்தைக் கடவுள் புலப்படச் செய்கிறார் என்ற காரணவினைப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: δι’ ἡμῶν
  choice: எங்கள் வழியாக
  rationale: διά உடன் வரும் பிறப்புவேற்றுமை இங்கு கருவி அல்லது முகமையைக் குறிப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν παντὶ τόπῳ
  choice: எல்லா இடங்களிலும்
  rationale: கிரேக்கத்தின் பரவலான இடவலியுறுத்தலைக் காத்து, நவீன தமிழில் இயல்பாக ஒலிக்கிறது.
theological_decisions:
- issue: θριαμβεύω என்பதுடன் ἡμᾶς செயப்படுபொருளாக வருவதன் பொருள்
  choice: கடவுள் மேசியாவுக்குள் எங்களை வெற்றிப் பவனியில் நடத்துகிறார்.
  alternative: கடவுள் மேசியாவுக்குள் எங்களை வெற்றிகொள்கிறார்.
  rationale: முதன்மை வாசகம் வெற்றிப் பவனியின் தெளிவான உருவகத்தையும் அடுத்து வரும் நறுமண உருவகத்துடனான தொடர்பையும் காக்கிறது. ஆயினும், வெற்றிகொண்ட கைதிகளாக எங்களை நடத்துகிறார் அல்லது எங்களை வெற்றிகொள்கிறார் என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழாகவும், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. வெற்றிப் பவனி என்ற வரலாற்று உருவகம் வெளிப்படையாக வைக்கப்பட்டுள்ளது; αὐτοῦ என்பதன் சுட்டுதலைப் பெயரால் நிரப்பாமல் “அவரைப் பற்றிய” என்று வழங்கி மூலத்தின் சுட்டுப்பெயர் வடிவம் காக்கப்பட்டுள்ளது.
