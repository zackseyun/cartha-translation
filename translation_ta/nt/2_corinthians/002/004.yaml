reference: 2 Corinthians 2:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: ta
  text: ஏனெனில், மிகுந்த துயரமும் உள்ளத்தின் நெருக்கடியும் நிறைந்த நிலையில், பல கண்ணீர் சிந்தியபடி உங்களுக்கு எழுதினேன். நீங்கள் துயரப்பட வேண்டும் என்பதற்காக அல்ல; உங்கள்மீது நான் மிகுதியாகக் கொண்டிருக்கும் அன்பை நீங்கள் அறிந்துகொள்ள வேண்டும் என்பதற்காகவே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ γὰρ πολλῆς θλίψεως
  choice: ஏனெனில், மிகுந்த துயரத்தாலும்
  rationale: ἐκ எழுதியதற்கான உள்நிலையையும் தோற்றுவாயையும் சுட்டுகிறது. தமிழில் இயல்பாக அமைய ‘-ஆலும்’ பயன்படுத்தப்பட்டு, θλῖψις என்பதன் அழுத்தமும் துன்பமும் ‘துயரம்’ மூலம் தெரிவிக்கப்படுகிறது.
- source_word: συνοχῆς καρδίας
  choice: உள்ளத்தின் கடும் வேதனையாலும்
  rationale: συνοχή குறிக்கும் உள்ளார்ந்த நெருக்கடி மற்றும் வேதனையின் தீவிரத்தை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔγραψα ὑμῖν
  choice: உங்களுக்கு எழுதினேன்
  rationale: அறியப்படாத முந்தைய கடிதத்தை வினைச்சொல்லுக்குள் சேர்க்காமல், எளிய இறந்தகாலமாக மொழிபெயர்க்கப்படுகிறது.
- source_word: διὰ πολλῶν δακρύων
  choice: மிகுந்த கண்ணீரோடு
  rationale: கண்ணீர் சிந்தியபடியே எழுதிய சூழலை இயல்பான தமிழில் தெரிவிக்கிறது; πολλῶν என்பதன் தீவிரமும் காக்கப்படுகிறது.
- source_word: οὐχ ἵνα λυπηθῆτε
  choice: நீங்கள் துயரப்பட வேண்டும் என்பதற்காக அல்ல
  rationale: ἵνα நோக்கத்தையும் λυπηθῆτε என்பதன் துயரமடையும் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τὴν ἀγάπην ἵνα γνῶτε
  choice: அன்பை நீங்கள் அறிந்துகொள்ள வேண்டும் என்பதற்காக
  rationale: ἀγάπη வழக்கமான ‘அன்பு’ எனவும், γινώσκω இங்கு உணர்ந்து அறிதலை உள்ளடக்கக்கூடிய ‘அறிந்துகொள்ள’ எனவும் வழங்கப்படுகிறது.
- source_word: ἣν ἔχω περισσοτέρως εἰς ὑμᾶς
  choice: உங்கள்மீது நான் கொண்டிருக்கும் மிகுதியான அன்பை
  rationale: εἰς ὑμᾶς என்பதன் திசைநோக்கை ‘உங்கள்மீது’ என்பதும், περισσοτέρως என்பதன் மிகுதி அல்லது சிறப்பான அளவை ‘மிகுதியான’ என்பதும் காக்கின்றன.
theological_decisions:
- issue: περισσοτέρως என்பதன் ஒப்பீட்டு அல்லது தீவிரப்படுத்தும் நுணுக்கம்
  choice: மிகுதியான அன்பை
  alternative: குறிப்பாக உங்கள்மீது கொண்டிருக்கும் அன்பை / உங்கள்மீது இன்னும் மிகுதியாகக் கொண்டிருக்கும் அன்பை
  rationale: சூழலில் வெளிப்படையான ஒப்பீட்டுப் பொருள் குறிப்பிடப்படாததால் யாரைவிட அதிகம் என்று சேர்க்கப்படவில்லை. அதே நேரத்தில் அன்பின் விசேஷமான மிகுதியை முதன்மை உரை காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு புரியும் வகையிலும் உரையின் உணர்ச்சித் தீவிரம் குறையாத வகையிலும் அமைக்கப்பட்டுள்ளது. ‘இருதயம்’ என்பதற்குப் பதில் இயல்பான ‘உள்ளம்’ பயன்படுத்தப்பட்டுள்ளது; வாக்கியத்தின் நீளத்தை கட்டுப்படுத்த இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
