lexical_decisions:
- source_word: ἱκανὸν
  choice: போதும்
  rationale: வாக்கியத்தின் பயனிலைக் கருத்தாக இருந்து, விதிக்கப்பட்ட ஒழுங்கு நடவடிக்கை தேவையான அளவை எட்டிவிட்டது என்பதைக் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τῷ τοιούτῳ
  choice: இப்படிப்பட்டவனுக்கு
  rationale: சூழலில் குறிப்பிடப்படும் ஒரு குறிப்பிட்ட ஆண் குற்றவாளியைச் சுட்டுகிறது; கிரேக்கத்தின் ஆண்பால் ஒருமையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ἐπιτιμία
  choice: தண்டனை
  rationale: சமூகம் விதித்த உறுதியான திருத்த நடவடிக்கையைக் குறிக்கிறது. ‘கண்டிப்பு’ என்பது வெறும் வாய்மொழிக் கடிந்துகொள்ளுதலாகப் புரிந்துகொள்ளப்படலாம்; ‘தண்டனை’ இங்கு பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: பெரும்பான்மையினரால் கொடுக்கப்பட்ட
  rationale: οἱ πλείονες என்பதன் ‘பெரும்பாலோர்/பெரும்பான்மையினர்’ என்ற பொருளையும், நடவடிக்கையை அவர்கள் விதித்தார்கள் என்ற செயப்பாட்டு உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
