lexical_decisions:
- source_word: ἵνα μὴ
  choice: …பயன்படுத்திக்கொள்ளாதபடி
  rationale: நோக்கத்தைச் சுட்டும் கிரேக்கத் தொடரை இயல்பான நவீனத் தமிழில் எதிர்மறை நோக்க வினையெச்சமாக வழங்குகிறது.
- source_word: πλεονεκτηθῶμεν
  choice: நம்மைத் தனக்குச் சாதகமாகப் பயன்படுத்திக்கொள்ள
  rationale: ஒருவரை மிஞ்சி ஆதாயம் அடைதல், அவரைச் சுரண்டுதல் அல்லது அவரிடமிருந்து அனுகூலம் பெறுதல் என்ற பரந்த பொருளைத் தக்கவைக்கிறது; இதை அறிவுத்திறனால் ஏமாற்றுதல் என்ற பொருளுக்கு மட்டும் குறுக்கவில்லை.
- source_word: Σατανᾶ
  choice: சாத்தான்
  rationale: தனிப்பட்ட பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய நோக்கக் கூற்றுக்கான விளக்கக் காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: νοήματα
  choice: சூழ்ச்சிகள்
  rationale: இச்சூழலில் வெறும் எண்ணங்களை அல்லாமல் பகைமையான திட்டங்களையும் உத்திகளையும் குறிக்கும் நயத்தை வெளிப்படுத்துகிறது.
- source_word: οὐ … ἀγνοοῦμεν
  choice: நாம் அறியாதவர்கள் அல்ல
  rationale: கிரேக்கத்தின் மறுப்பு வடிவத்தையும் அதன் வலியுறுத்தலையும் தக்கவைக்கிறது.
theological_decisions:
- issue: சாத்தானின் νοήματα என்பதன் தன்மை
  choice: சூழ்ச்சிகள்
  alternative: எண்ணங்கள் / நோக்கங்கள்
  rationale: சூழல் அவற்றைத் தீங்கிழைக்கும் திட்டங்களாகக் காட்டுவதால் ‘சூழ்ச்சிகள்’ பொருத்தமானது; ஆயினும் மூலச்சொல்லின் பிற சாத்தியமான பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ἵνα சார்ந்திருக்கும் முந்தைய சூழலைத் தமிழில் தெளிவாக்க ‘நாம் இப்படிச் செய்கிறோம்’ என்று குறைந்த அளவில் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. இரட்டை மறுப்பு போன்ற ‘அறியாதவர்கள் அல்ல’ என்ற அமைப்பு கிரேக்கத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
