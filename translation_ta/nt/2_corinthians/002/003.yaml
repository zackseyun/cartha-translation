source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: ta
  text: என் மகிழ்ச்சி உங்கள் அனைவரின் மகிழ்ச்சியே என்று உங்கள் அனைவர்மீதும் நம்பிக்கை வைத்து, நான் வரும்போது எனக்கு மகிழ்ச்சி தரவேண்டியவர்களிடமிருந்து எனக்குத் துயரம் ஏற்படாதபடி, இதையே எழுதினேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்பொருளுக்கு நெருக்கமாக: “நான் மகிழவேண்டியவர்களிடமிருந்து எனக்குத் துயரம் ஏற்படாதபடி.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: எழுதினேன்
  rationale: இறந்தகால வினை வடிவம் இச்சூழலில் பவுல் முன்பு எழுதியதைக் குறிக்கிறது; எளிய இறந்தகாலம் இயல்பாக உள்ளது.
- source_word: τοῦτο αὐτὸ
  choice: இதையே
  rationale: αὐτό தரும் வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பான தமிழிலும் காக்கிறது.
- source_word: ἵνα μὴ ... λύπην σχῶ
  choice: துயரம் ஏற்படாதபடி
  rationale: நோக்கத்தையும் எதிர்மறைப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; λύπη என்பதன் உணர்ச்சிசார் வேதனையை ‘துயரம்’ காக்கிறது.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: எனக்கு மகிழ்ச்சி தரவேண்டியவர்களிடமிருந்தே
  rationale: சொல்லுக்குச் சொல் அமைப்பின் பொருளை வாசிக்கத்தக்க தமிழில் தருகிறது; ἀπό குறிக்கும் மூலத்தையும் ‘இடமிருந்தே’ காக்கிறது.
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: உங்கள் அனைவரைக் குறித்தும் நம்பிக்கையுடன் இருந்தேன்
  rationale: முற்றுப்பெற்ற பங்கேற்பு வடிவம் குறிக்கும் நிலையான நம்பிக்கையை வெளிப்படுத்துகிறது; பங்கேற்பின் தொடர்பைத் தேவையற்ற விதத்தில் உறுதியான காரணவாக்கியமாக மாற்றாமல் தனி வாக்கியமாக இயல்பாக்குகிறது.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: என் மகிழ்ச்சி உங்கள் அனைவரின் மகிழ்ச்சியாகவும் இருக்கும்
  rationale: பவுலின் மகிழ்ச்சியும் கொரிந்தியரின் மகிழ்ச்சியும் பகிரப்பட்டவை என்ற தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது. சூழலின் எதிர்நோக்குப் பொருளால் ‘இருக்கும்’ பயன்படுத்தப்பட்டுள்ளது; கிரேக்கத்தில் நிகழ்கால வினை உள்ளது என்பதை அடிக்குறிப்பு பதிவு செய்கிறது.
theological_decisions:
- issue: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν என்பதில் உடைமை அல்லது பகிர்வு
  choice: என் மகிழ்ச்சி உங்கள் அனைவரின் மகிழ்ச்சியாகவும் இருக்கும்
  alternative: என் மகிழ்ச்சி உங்கள் அனைவருக்கும் உரியது
  rationale: மகிழ்ச்சி அனைவராலும் பகிரப்படுகிறது என்ற தொடர்பைத் தெரிவிக்கிறது; அதை சட்டபூர்வ உடைமை அல்லது ஒருதலைப்பட்ச உரிமை எனக் குறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘எனக்கு மகிழ்ச்சி தரவேண்டியவர்கள்’ என்பது கிரேக்கத்தின் சற்று செறிவான உறவுப்பொருளை இயல்பாக்குகிறது; அதிகப்படியான சமயவியல் விளக்கம் சேர்க்கப்படவில்லை.
