id: 2CO.2.13
reference: 2 Corinthians 2:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: ta
  text: என் சகோதரனாகிய தீத்து[a]வை நான் காணாததால், என் ஆவிக்கு நிம்மதி இல்லை; ஆனால், அவர்களிடம் விடைபெற்றுக்கொண்டு மக்கெதோனியாவுக்குப் புறப்பட்டுச் சென்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “சகோதரன்” என்பது பவுலுடன் விசுவாசத்திலும் பணியிலும் இணைந்திருந்த தீத்துவைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔσχηκα ἄνεσιν
  choice: எனக்கு அமைதி இருக்கவில்லை
  rationale: கிரேக்க நிறைவுக்கால வினை இக்கதைச் சூழலில் கடந்தகால நிலையைச் சுட்டுகிறது. ἄνεσις என்பதன் ஓய்வு, நிம்மதி, தளர்வு ஆகிய நிழற்பொருள்களில், உள்ளார்ந்த கலக்கத்திற்கு எதிரான இயல்பான நவீனத் தமிழ் சொல்லாக ‘அமைதி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τῷ πνεύματί μου
  choice: என் ஆவியில்
  rationale: வேற்றுமை உருபு குறிப்பு அல்லது நிகழும் தளத்தைக் குறிக்கலாம். ‘என் ஆவியில்’ என்பது பவுலின் உள்ளார்ந்த நிலையைப் பாதுகாக்கிறது; அதை வெறும் உணர்ச்சி அல்லது பரிசுத்த ஆவியைப் பற்றிய குறிப்பாகத் தீர்மானிக்கவில்லை.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: தீத்துவை நான் காணாததால்
  rationale: μή உடனான பெயர்ச்சொல் தன்மையுடைய வினையெச்ச அமைப்பு காரணத்தைத் தெரிவிக்கிறது. ‘காணாததால்’ என்பது இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது; ‘காண முடியாததால்’ என்று திறனின்மையைச் சேர்க்கவில்லை.
- source_word: Τίτον τὸν ἀδελφόν μου
  choice: என் சகோதரனாகிய தீத்துவை
  rationale: கிரேக்க உறவுமுறை உருவகத்தையும் அதன் அன்பான தொனியையும் காக்கிறது. இங்கு ‘சகோதரன்’ என்பது உடன்பிறந்தவர் என்று தவறாகப் புரியக்கூடியதால் விளக்கக் குறிப்பு சேர்க்கப்பட்டது.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: அவர்களிடம் விடைபெற்றுக்கொண்டு
  rationale: இது அங்கிருந்தவர்களிடம் பிரியாவிடை பெற்று நீங்கிய செயலைக் குறிக்கிறது. நவீனத் தமிழில் ‘விடைபெற்றுக்கொண்டு’ தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: மக்கெதோனியாவுக்குப் புறப்பட்டுச் சென்றேன்
  rationale: ἐξῆλθον என்பதிலுள்ள புறப்படுதல் கருத்தையும் இலக்கை நோக்கிய பயணத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘என் ஆவி’ என்பதன் அடையாளம்
  choice: பவுலின் உள்ளார்ந்த ஆவியைக் குறிக்கும் வகையில் ‘என் ஆவியில்’ என்று மொழிபெயர்த்தல்
  alternative: ‘என் உள்ளத்தில்’ அல்லது பரிசுத்த ஆவியைக் குறிக்கும் வகையில் மொழிபெயர்த்தல்
  rationale: μου என்ற உரிமைச்சொல் பவுலுடைய ஆவியை இயல்பாகச் சுட்டுகிறது. ‘உள்ளம்’ என்று மாற்றுவது மூலத்தின் πνεῦμα சொல்லை மறைக்கும்; பரிசுத்த ஆவி என்று குறிப்பிடுவது உரையில் இல்லாத இறையியல் தீர்மானத்தைச் சேர்க்கும்.
- issue: ἀδελφός என்ற உறவுமுறை மொழி
  choice: ‘என் சகோதரனாகிய தீத்து’ என்று உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘என் உடன் விசுவாசியும் உடன் பணியாளருமான தீத்து’ என்று விளக்கமாக மாற்றுதல்
  rationale: பவுலின் குடும்ப உறவுமுறை மொழியும் relational warmth-உம் நேரடி உரையில் காக்கப்படுகின்றன; அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டது. கிரேக்க வாக்கியத்தின் காரணம்–பிரிவு–பயணம் என்ற ஓட்டம் இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘ஆவி’, ‘சகோதரன்’ ஆகிய மூலத்தின் முக்கிய உருவகச் சொற்கள் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
