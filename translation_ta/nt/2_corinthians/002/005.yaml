source:
  edition: SBLGNT
  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: ta
  text: ஆனால் யாராவது துயரப்படுத்தியிருந்தால், அவர் துயரப்படுத்தியது என்னை அல்ல; மாறாக, ஓரளவுக்கு உங்கள் அனைவரையும் துயரப்படுத்தியிருக்கிறார்—உங்கள் அனைவர்மீதும் அதிகப் பாரம் சுமத்த விரும்பாமல் இவ்வாறு சொல்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் அனைவரையும் அதிகமாகச் சுமைப்படுத்தாதபடிக்கு.” ‘அதிகப் பாரம் சுமத்துதல்’ என்ற சொற்றொடர், பவுல் இக்கூற்றை மென்மையாகக் கூறுவதை உணர்த்தலாம்.
    reason: lexical_and_contextual_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: துயரப்படுத்தியிருந்தால் / துயரப்படுத்தியது
  rationale: λυπέω என்பதன் ‘துயரம் உண்டாக்குதல்’ என்ற பொருளையும், இரு இடங்களிலும் உள்ள சொல் தொடர்பையும் காக்கிறது. நிறைவேற்றுக் காலத்தின் தொடரும் விளைவை ‘-யிருந்தால்’ என்ற வடிவம் இயல்பாக உணர்த்துகிறது.
- source_word: οὐκ ἐμὲ
  choice: என்னை அல்ல
  rationale: கிரேக்கத்தில் உள்ள நேரடியான முரண்பாட்டை, இல்லாத தனிப்பட்ட வலியுறுத்தலைச் சேர்க்காமல் காக்கிறது.
- source_word: ἀπὸ μέρους
  choice: ஓரளவுக்கு
  rationale: இந்த இடத்தில் முழுமையல்லாத அளவைக் குறிக்கும் வினையடைத் தொடராக இயல்பான நவீனத் தமிழில் தரப்பட்டுள்ளது.
- source_word: ἐπιβαρῶ
  choice: மிகைப்படுத்திச் சொல்ல
  rationale: சொல்லால் ‘சுமத்துதல்’ என்று பொருள்பட்டாலும், இங்கு பவுல் தன் கூற்றின் கடுமையை மட்டுப்படுத்தும் இடைச்சொல்லாகப் பயன்படுத்தியிருக்கலாம். முதன்மை உரை அந்தச் சூழல் பொருளைத் தருகிறது; நேரடியான மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: πάντας ὑμᾶς
  choice: உங்கள் அனைவரையுமே
  rationale: πάντας என்பதன் முழுமையான குழுக் குறிப்பைத் தெளிவாகக் காக்கிறது; ‘-யுமே’ என்பது ‘என்னை அல்ல’ என்பதோடு உள்ள முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀπὸ μέρους மற்றும் ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς ஆகியவற்றின் தொடரியல் தொடர்பு
  choice: ‘ஓரளவுக்கு உங்கள் அனைவரையுமே—நான் இதை மிகைப்படுத்திச் சொல்லாதபடி கூறுகிறேன்’
  alternative: ‘உங்கள் அனைவருக்கும் ஓரளவே துயரம் உண்டாக்கியிருக்கிறார்—உங்கள் அனைவர்மீதும் நான் பாரம் சுமத்தாதபடி கூறுகிறேன்’
  rationale: கிரேக்கச் சொற்றொடர் ‘ஓரளவுக்கு’ என்பதை துயரத்தின் அளவோடு இணைக்கவும், இறுதிக் கூற்றை பவுலின் மென்மைப்படுத்தும் குறிப்பாகப் புரிந்துகொள்ளவும் இடமளிக்கிறது. அதேவேளை, ἐπιβαρῶ என்பதன் நேரடியான ‘பாரம் சுமத்துதல்’ பொருளும் தொடரியல் மாற்றும் உண்மையான மாற்றுகளாக இருப்பதால் அவை அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘துயரப்படுத்துதல்’ என்ற ஒரே வேர்ச்சொல் இருமுறையும் பயன்படுத்தப்பட்டு மூலத்தின் சொல் தொடர்பு காக்கப்பட்டுள்ளது; மூலத்தின் தொடரியல் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
