id: 2CO.2.10
reference: 2 Corinthians 2:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: ta
  text: நீங்கள் யாருக்கு எதையாவது மன்னிக்கிறீர்களோ, நானும் அவருக்கு மன்னிக்கிறேன். ஏனெனில், நான் மன்னித்திருப்பது எதுவாயினும்—நான் எதையாவது மன்னித்திருக்கிறேன் என்றால்—அதை உங்களுக்காகவே மேசியாவின் முன்னிலையில்[a] மன்னித்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியாவின் சார்பில்.”
    reason: ἐν προσώπῳ என்ற சொற்றொடர் ஒருவரின் முன்னிலையில் என்பதோடு, அவரின் நபராக அல்லது பிரதிநிதியாகச் செயல்படுவதையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: மன்னிக்கிறீர்கள் / மன்னித்திருக்கிறேன்
  rationale: χαρίζομαι என்பதற்கு அருளாகக் கொடுத்தல் அல்லது தயவு காட்டுதல் என்ற பரந்த பொருள் இருக்கலாம். ஆனால் இங்கு சபை ஒழுங்கு மற்றும் மீள்சேர்த்தல் பற்றிய சூழலில் குற்றத்தை விடுவிப்பதைக் குறிப்பதால், ‘மன்னித்தல்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: ᾧ
  choice: யாருக்கு ... அவருக்கு
  rationale: வேற்றுமை உருபுடைய தொடர்புப்பெயர் மன்னிப்பைப் பெறும் நபரைக் குறிக்கிறது. தமிழில் தொடர்பு–சுட்டு அமைப்பான ‘யாருக்கு ... அவருக்கு’ வாக்கிய உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τι
  choice: எதையாவது
  rationale: வரையறையற்ற τι என்பதன் திறந்த எல்லையை இயல்பான தமிழில் காக்கிறது.
- source_word: κἀγώ
  choice: நானும் ... மன்னிக்கிறேன்
  rationale: ‘நானும்’ என்ற சுருக்கமான கிரேக்கப் பதிலுரையைத் தமிழில் முழு வினையுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: நான் மன்னித்திருப்பது எதுவாயினும்—நான் எதையாவது மன்னித்திருக்கிறேன் என்றால்—
  rationale: பவுலின் சற்றே தன்னடக்கமான நிபந்தனைச் சொல்லைத் தீர்த்துவிடாமல் காக்கிறது; இடைக்கோடுகள் இடைச்செருகல் தன்மையைத் தெளிவாக்குகின்றன.
- source_word: δι’ ὑμᾶς
  choice: உங்கள் நிமித்தமே
  rationale: διά + accusative இங்கு கொரிந்தியர்களின் நன்மையை நோக்கிய செயலைக் குறிக்கிறது. ‘நிமித்தமே’ பயன்நோக்கையும் வலியுறுத்தலையும் தருகிறது.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: மேசியாவின் முன்னிலையில்
  rationale: πρόσωπον என்பது முகம், முன்னிலை, அல்லது நபர்/பிரதிநிதித்துவம் எனப் பொருள்படலாம். முதன்மை உரை மேசியாவின் பார்வைக்கு முன் நிகழும் செயல் என்ற இயல்பான பொருளைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைத் தக்கவைத்திருப்பதால், மரபான ஒலிபெயர்ப்புக்குப் பதிலாக அதன் பட்டப்பொருளான ‘மேசியா’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதை பட்டப்பெயராக மொழிபெயர்ப்பதா அல்லது மரபான பெயர்போன்ற ‘கிறிஸ்து’ வடிவில் வைப்பதா
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்வசனத்தில் Χριστός என்பதை வெறும் பெயராகவே கொள்ள வேண்டிய கட்டாயம் இல்லை; அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளைக் காக்க ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: ἐν προσώπῳ Χριστοῦ என்பதில் முன்னிலை அல்லது பிரதிநிதித்துவம் எது
  choice: மேசியாவின் முன்னிலையில்
  alternative: மேசியாவின் சார்பில்
  rationale: கிரேக்கச் சொற்றொடர் இரு நுணுக்கங்களையும் அனுமதிக்கிறது. பிரதான உரையில் மேசியாவின் பார்வைக்கு முன் என்ற பொருள் வைக்கப்பட்டு, பிரதிநிதித்துவப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது; இவ்வாறு உண்மையான தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டது. கிரேக்கத்தில் மீண்டும் வரும் ‘மன்னித்தல்’ வினையும் நிபந்தனை இடைச்செருகலும் கருத்தின் இறுக்கத்தைக் காக்கும் வகையில் விடப்படவில்லை.
