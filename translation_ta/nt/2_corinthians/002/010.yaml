  terminology: “மன்னிக்கிறீர்கள் / மன்னித்திருக்கிறேன்” suits the restorative context of χαρίζομαι. “மேசியா” consistently preserves Χριστός as a title. “மேசியாவின் முன்னிலையில்” is a sound main-text rendering, while the footnote preserves the viable representative/person sense.
