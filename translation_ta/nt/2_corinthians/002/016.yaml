source:
  edition: SBLGNT
  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: ta
  text: சிலருக்கு, மரணத்திலிருந்து மரணத்திற்கு வாசனை[a]; மற்றவர்களுக்கோ, வாழ்விலிருந்து வாழ்விற்கு வாசனை[b]. இவற்றுக்கு ஈடானவர் யார்[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வாசனை’ என்பதற்கு ‘மணம்’ என்றும் மொழிபெயர்க்கலாம். ὀσμή வரும் இரண்டு இடங்களுக்கும் இது பொருந்தும்.
    reason: lexical_alternative
  - marker: b
    text: ‘மரணத்திலிருந்து மரணத்திற்கு’ மற்றும் ‘வாழ்விலிருந்து வாழ்விற்கு’ என்ற சொற்றொடர்கள் தொடக்கத்தையும் விளைவையும் (‘மரணத்திலிருந்து புறப்பட்டு மரணத்திற்கு இட்டுச்செல்லும்’ / ‘வாழ்விலிருந்து புறப்பட்டு வாழ்விற்கு இட்டுச்செல்லும்’) குறிக்கலாம்; அல்லது மரணம் மற்றும் வாழ்வு என்ற பண்பைத் தீவிரமாகக் கூறலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது ‘போதுமானவர்’ அல்லது ‘திறனுள்ளவர்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: வாசனை
  rationale: உணர்வுப் புலன்சார்ந்த உருவகத்தை இயல்பான நவீன தமிழில் தக்கவைக்கிறது. ‘நறுமணம்’ என்பது தேவையில்லாமல் இனிமையான மணத்தை மட்டும் குறிக்கக்கூடும்; ‘வாசனை’ இரு எதிர்மறை விளைவுகளுக்கும் ஏற்ற அளவில் நடுநிலையாக உள்ளது.
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: மரணத்திலிருந்து மரணத்திற்கு
  rationale: மூலத்தின் சுருக்கமான இணை அமைப்பையும் சொல்லாட்சியின் வலிமையையும் காக்கிறது; தொடக்கம்-விளைவு அல்லது தீவிரப்படுத்தப்பட்ட பண்பு என்ற இரு வாய்ப்புகளில் ஒன்றை மட்டும் தீர்மானிக்கவில்லை.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: வாழ்விலிருந்து வாழ்விற்கு
  rationale: மரணத்தைப் பற்றிய இணையான சொற்றொடருடன் உள்ள சமச்சீரைக் காக்கிறது; அதன் பொருளை விளக்கவுரையாகக் குறுக்கவில்லை.
- source_word: πρὸς ταῦτα
  choice: இவற்றுக்கு
  rationale: ταῦτα என்பதன் பன்மையைப் பிரதிபலித்து, முன் விவரிக்கப்பட்ட காரியங்களுக்கு ஏற்றவராக இருப்பதைக் குறிக்கிறது.
- source_word: ἱκανός
  choice: தகுதியானவர்
  rationale: ஒரு பொறுப்புக்கு ஈடாக அல்லது போதுமானவராக இருப்பது என்ற கருத்தை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘மரணத்திலிருந்து மரணத்திற்கு’ மற்றும் ‘வாழ்விலிருந்து வாழ்விற்கு’ என்ற இணைச் சொற்றொடர்களின் விளக்க வலிமை
  choice: மூல கிரேக்கத்தின் சுருக்கத்தையும் பொருள் தெளிவின்மையையும் முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘மரணத்திலிருந்து புறப்பட்டு மரணத்திற்கு இட்டுச்செல்லும்’ / ‘வாழ்விலிருந்து புறப்பட்டு வாழ்விற்கு இட்டுச்செல்லும்’ அல்லது ‘மரணத்துக்குரிய’ / ‘வாழ்வுக்குரிய’
  rationale: இவை தொடக்கம் மற்றும் விளைவைச் சுட்டுகின்றனவா, அல்லது மரணம்/வாழ்வு என்ற பண்பைத் தீவிரமாகக் கூறுகின்றனவா என்பதை வசனம் வெளிப்படையாகத் தீர்மானிக்கவில்லை. எனவே எந்த ஒரு விளக்கத்தையும் முதன்மை உரையில் திணிக்காமல் இணை அமைப்பைப் பேணுவது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. முதல் இரண்டு கூறுகளின் வினையற்ற, சுருக்கமான சொல்லமைப்பு பவுலின் சமச்சீரான எதிர்மறை அமைப்பையும் திறந்த பொருளையும் காக்கிறது.
