  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: ta
  text: ஏனெனில், நீங்கள் வாசிப்பதையோ மேலும் புரிந்துகொள்வதையோ தவிர வேறு எதையும் நாங்கள் உங்களுக்கு எழுதுவதில்லை; நீங்கள் முழுமையாகப் புரிந்துகொள்வீர்கள் என்று நம்புகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “நீங்கள் முடிவுவரை புரிந்துகொள்வீர்கள் என்று நம்புகிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: வேறு எதையும்
  rationale: எழுதுதல் என்ற வினையுடன் வரும் மறுக்கப்பட்ட நடுநிலைப் பன்மையை, தமிழில் இயல்பாகவும் மறைவான வேறொரு செய்தி இல்லை என்ற வலியுறுத்தலைக் காக்கவும் இவ்வாறு மொழிபெயர்க்கிறது.
- source_word: ἀναγινώσκετε
  choice: நீங்கள் வாசிப்பதை
  rationale: கடிதத்தில் எழுதப்பட்டிருப்பதை அவர்கள் வாசிப்பதை எளிய நிகழ்காலத்தில் நேரடியாகக் குறிக்கிறது.
- source_word: ἐπιγινώσκετε
  choice: உண்மையில் புரிந்துகொள்வதை
  rationale: இச்சூழலில் வெறுமனே வாசிப்பதற்கு அப்பால் பொருளைப் புரிந்துகொள்வதைக் குறிக்கிறது; καί இன் வலியுறுத்தலை ‘உண்மையில்’ வெளிப்படுத்துகிறது.
- source_word: ἐπιγνώσεσθε
  choice: புரிந்துகொள்வீர்கள்
  rationale: முன்பு வந்த அதே வினையின் எதிர்கால வடிவத்தைத் தக்கவைத்து, புரிதல் தொடரும் என்ற பவுலின் நம்பிக்கையை இயல்பான தமிழில் தருகிறது.
- source_word: ἕως τέλους
  choice: முழுமையாக
  rationale: இந்தத் தொடருக்குள்ள நிறைவு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; ‘முடிவுவரை’ என்ற காலவியல் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: தவிர வேறு எதையும் ... எழுதுவதில்லை
  rationale: வேறுபட்ட அல்லது மறைபொருளுள்ள எதையும் எழுதவில்லை என்ற கிரேக்க வாக்கியத்தின் விலக்குக் கட்டமைப்பைத் தெளிவான தமிழில் காக்கிறது.
theological_decisions:
- issue: ἕως τέλους என்பது நிறைவைக் குறிக்கிறதா அல்லது காலத்தின் முடிவுவரையைக் குறிக்கிறதா
  choice: முழுமையாக
  alternative: முடிவுவரை
  rationale: இரண்டு பொருள்களும் மொழியியல் ரீதியாகச் சாத்தியமானவை. முதன்மை உரை சூழலுக்கேற்ற நிறைவு சார்ந்த பொருளைத் தருகிறது; காலவியல் பொருள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘வாசிப்பது—புரிந்துகொள்வது’ என்ற சொல்லிணைவும், அதன்பின் வரும் எதிர்காலப் புரிதலும் மூலத்தின் முன்னேற்றத்தைத் தக்கவைக்கின்றன.
