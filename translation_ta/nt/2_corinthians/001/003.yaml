id: 2CO.1.3
reference: 2 Corinthians 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: ta
  text: நம் ஆண்டவராகிய இயேசு மெசியாவின்[a] கடவுளும் தந்தையுமானவர் போற்றப்படுவாராக! அவரே இரக்கங்களின்[b] தந்தையும் எல்லா ஆறுதலின்[c] கடவுளுமாய் இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இயேசு கிறிஸ்துவின்.’
    reason: Χριστός என்பதை மரபான ஒலிபெயர்ப்பாகவும் வழங்கலாம்.
  - marker: b
    text: அல்லது, ‘கருணைகளின்’; இப்பன்மை இரக்கச் செயல்களையும் குறிக்கலாம்.
    reason: οἰκτιρμῶν என்பதன் பன்மையையும் பொருள் வரம்பையும் காட்டுகிறது.
  - marker: c
    text: ‘ஆறுதல்’ என்பதற்கான கிரேக்கச் சொல் ‘ஊக்கமளித்தல்’ அல்லது ‘தேற்றுதல்’ என்றும் பொருள்படலாம்.
    reason: παράκλησις என்பதன் பரந்த பொருள் வரம்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: போற்றப்படுவாராக
  rationale: இது கடவுளைப் போற்றும் வாழ்த்துரை வடிவம். கிரேக்கப் பெயரடை கூறும் புகழ்ச்சியின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: கடவுளும் தந்தையுமானவர்
  rationale: ஒரே சுட்டுப்பெயர்ச்சொல் இணைக்கப்பட்ட இரு உறவுச் சொற்களையும் ஒரே நபரைக் குறிக்கும் வகையில் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டின் கிறிஸ்துவியல் சூழலுக்கு ஏற்ற κύριος என்பதன் இயல்பான, கண்ணியமான தமிழ் மொழிபெயர்ப்பு.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: Χριστός இங்கு இயேசுவின் பட்டப்பெயராக இருப்பதால் அதன் பொருளைத் தெரிவிக்கும் ‘மெசியா’ பயன்படுத்தப்படுகிறது.
- source_word: οἰκτιρμῶν
  choice: இரக்கங்கள்
  rationale: கிரேக்கப் பன்மையைத் தக்கவைத்து, கடவுளிடமிருந்து வரும் நிறைவான இரக்கத்தையும் இரக்கச் செயல்களையும் உணர்த்துகிறது.
- source_word: πάσης παρακλήσεως
  choice: எல்லா ஆறுதல்
  rationale: துன்பத்தின் நடுவே கடவுள் அளிக்கும் தேற்றுதல் என்ற சூழலுக்குப் பொருத்தமாகவும் வாசிக்க இயல்பாகவும் உள்ளது; πάσης என்பதன் முழுமையையும் ‘எல்லா’ தக்கவைக்கிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστός என்ற பட்டப்பெயரை மொழிபெயர்த்தல்
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός என்பதை வெறும் பெயரின் பகுதியாக மாற்றாமல், ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற அதன் பட்டப்பெயர்ச் சாரத்தை ‘மெசியா’ வெளிப்படுத்துகிறது.
- issue: ‘கடவுளும் தந்தையும்’ என்ற சொற்றொடரின் ஒருமைச் சுட்டு
  choice: ஒரே நபரைக் குறிக்கும் ‘கடவுளும் தந்தையுமானவர்’
  alternative: ‘கடவுள் மற்றும் தந்தை’ எனத் தனித்தனியாகத் தோன்றும் அமைப்பு
  rationale: ὁ என்ற ஒரே உருபு θεὸς καὶ πατήρ ஆகிய இரண்டையும் ஆளுவதால், இரண்டும் ஒரே நபரைக் குறிக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான புகழ்ச்சியுரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிதா’, ‘தேவன்’, ‘கர்த்தர்’ போன்ற உயர்வழக்குச் சமயச் சொற்களுக்குப் பதிலாக இயல்பான ‘தந்தை’, ‘கடவுள்’, ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ‘இரக்கங்கள்’ என்ற பன்மையும் ‘எல்லா ஆறுதல்’ என்ற முழுமையும் தக்கவைக்கப்பட்டுள்ளன.
