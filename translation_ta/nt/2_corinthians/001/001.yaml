revisions:
- from: 'கடவுளின் சித்தத்தினால் மேசியாவாகிய இயேசுவின்[a] அப்போஸ்தலனான பவுலும், நம் சகோதரர் தீமோத்தேயுவும், கொரிந்துவில் உள்ள கடவுளின் சபைக்கும், அதனுடன் அகாயா பகுதி முழுவதிலும் உள்ள தூய மக்கள் அனைவருக்கும் எழுதுவது:'
  to: 'கடவுளின் சித்தத்தினால் மேசியாவாகிய இயேசுவின் அப்போஸ்தலனான பவுலும், சகோதரரான தீமோத்தேயுவும், கொரிந்துவில் உள்ள கடவுளின் சபைக்கும், அதனுடன் அகாயா முழுவதிலும் உள்ள எல்லாப் பரிசுத்த மக்களுக்கும் எழுதுவது:'
  rationale: The revision removes the unexpressed possessive “நம்,” replaces “தூய மக்கள்” with the more contextually precise “பரிசுத்த மக்கள்,” and retains the source’s inclusive σὺν relationship and the project-required rendering of Χριστός as “மேசியா.”
