reference: 2 Corinthians 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: ta
  text: 'கடவுளின் சித்தத்தினால் மேசியாவாகிய இயேசுவின் அப்போஸ்தலனான பவுலும், சகோதரரான தீமோத்தேயுவும், கொரிந்துவில் உள்ள கடவுளின் சபைக்கும், அதனுடன் அகாயா முழுவதிலும் உள்ள எல்லாப் பரிசுத்த மக்களுக்கும் எழுதுவது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: பவுலின் அதிகாரப்பூர்வமாக அனுப்பப்பட்ட பணியையும் பதவியையும் குறிக்கும் நிலைபெற்ற தமிழ்ச் சொல்; வெறும் ‘தூதர்’ என்பது இங்கு பொருளைத் தளர்த்தக்கூடும்.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός இங்கு இயேசுவின் மேசியா பட்டத்தைத் தெளிவாகக் காட்டுகிறது; இயல்பான தமிழுக்காக ‘ஆகிய’ சேர்க்கப்பட்டுள்ளது.
- source_word: διὰ θελήματος θεοῦ
  choice: கடவுளின் சித்தத்தினால்
  rationale: διά உடன் வரும் இறைத்திட்டம் அல்லது இறைச்சித்தத்தின் செயலாற்றும் காரணத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁ ἀδελφὸς
  choice: நம் சகோதரர்
  rationale: கிரேக்கத்தில் உடைமைச் சுட்டுப்பெயர் இல்லாவிட்டாலும், சமூக உறவைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘நம்’ பயன்படுத்தப்படுகிறது; குறிப்பிட்ட சகோதரர் என்ற கட்டுரையின் கருத்தும் சூழலில் காக்கப்படுகிறது.
- source_word: ἐκκλησίᾳ
  choice: சபை
  rationale: பவுலின் வாழ்த்துரையில் கடவுளுக்குரிய விசுவாசிகளின் கூடுகையைச் சுட்டும், தமிழில் பரவலாகப் புரியப்படும் சொல்.
- source_word: ἁγίοις
  choice: தூய மக்கள்
  rationale: கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட மக்களைக் குறிக்கும் ἅγιος என்பதன் கருத்தை, பாலின வரம்பில்லாத இயல்பான நவீன தமிழில் தருகிறது.
- source_word: σὺν
  choice: அதனுடன்
  rationale: கொரிந்து சபையோடு அகாயா முழுவதிலுமுள்ள தூய மக்களையும் பெறுநர்களாக இணைக்கும் σύν என்பதன் உள்ளடக்கும் வலிமையை வெளிப்படுத்துகிறது.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: அகாயா பகுதி முழுவதிலும்
  rationale: முழு அகாயா மாகாணத்தையும் குறிக்கும் புவியியல் பரப்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: Χριστός என்பதைப் பட்டமாக மொழிபெயர்த்தல்
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இச்சூழலில் Χριστός என்பதன் அபிஷேகம் செய்யப்பட்ட அரசர்/மேசியா என்ற பட்டப் பொருள் தெளிவாக இருப்பதால் முதன்மை உரையில் ‘மேசியா’ வைக்கப்படுகிறது; மரபான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ἅγιοι என்பதன் சமூக அடையாளம்
  choice: தூய மக்கள்
  alternative: பரிசுத்தவான்கள்
  rationale: இது சிறப்பான ஒரு சிறு ஆன்மிக வகுப்பை அல்ல, கடவுளுக்குரிய விசுவாசிகள் அனைவரையும் குறிக்கிறது; ஆகவே நவீன தமிழில் உள்ளடக்கமான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கடிதத் தொடக்க நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தில் வெளிப்படையாக இல்லாதிருந்தாலும் தமிழில் வாக்கியத்தை நிறைவு செய்ய ‘எழுதுவது’ சேர்க்கப்பட்டுள்ளது. ‘நம் சகோதரர்’ என்பது சொற்சொல்லான ‘அந்தச் சகோதரர்’ என்பதைக் காட்டிலும் தமிழில் இயல்பான சமூக உறவுமுறையைத் தருகிறது.
