reference: 2 Corinthians 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: ta
  text: ஆனால், நாங்களே எங்களுக்குள் மரணத் தீர்ப்பைக் கொண்டிருந்தோம்; அது நாங்கள் எங்களைச் சார்ந்திருக்காமல், இறந்தவர்களை எழுப்புகிற கடவுளைச் சார்ந்திருக்கும்படியாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மரணம் என்ற முடிவு.’
    reason: ‘மரணத் தீர்ப்பு’ என்பதற்கு மாற்றான சொல்லியல் வாய்ப்பு; ἀπόκριμα இங்கு தீர்ப்பையோ முடிவான அறிவிப்பையோ குறிக்கலாம்.
lexical_decisions:
- source_word: ἀλλὰ
  choice: உண்மையில்
  rationale: முந்தைய கூற்றுடன் உள்ள வலுவான மாறுபாட்டையும் இங்கு வரும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: நாங்களே எங்களுக்குள்
  rationale: αὐτοί என்பதன் வலியுறுத்தலையும் ἐν ἑαυτοῖς என்பதன் உள்ளார்ந்த, தனிப்பட்ட அனுபவத்தையும் காக்கிறது.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: மரணத் தீர்ப்பு
  rationale: ἀπόκριμα இச்சூழலில் ஒரு முடிவான அல்லது நீதித்துறை சார்ந்த தீர்ப்பைக் குறிக்கிறது; மரணம் உறுதியாகிவிட்டதுபோன்ற நிலையைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: ἐσχήκαμεν
  choice: பெற்றிருந்தோம்
  rationale: முன்னர் நிகழ்ந்த அனுபவத்தால் உருவான நிலைத்த நிலையை இறந்தகால நிறைவுத் தன்மையோடு இயல்பான தமிழில் வெளிப்படுத்துகிறது; வினைச்சொல் தனியாக ‘வழங்கப்பட்டது’ என்று கூறாததால் அந்தக் கருத்து சேர்க்கப்படவில்லை.
- source_word: ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς
  choice: நாங்கள் எங்களையே சார்ந்திராமல்
  rationale: நோக்கத்தைக் காட்டும் கட்டமைப்பையும் தன்னம்பிக்கை அல்லது தற்சார்பை விடுவிக்கும் கருத்தையும் இயல்பாகக் கூறுகிறது.
- source_word: ἀλλ’ ἐπὶ τῷ θεῷ
  choice: கடவுளைச் சார்ந்திருக்கும்படி
  rationale: தங்களைச் சார்தல் மற்றும் கடவுளைச் சார்தல் ஆகியவற்றுக்கிடையிலான தெளிவான எதிர்மறையைப் பாதுகாக்கிறது.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: இறந்தவர்களை எழுப்புகிற
  rationale: கடவுளை இறந்தவர்களுக்கு உயிரளித்து எழுப்புகிறவராக நேரடியாக விவரிக்கிறது; மூலத்தின் நிகழ்காலப் பெயரெச்சத் தன்மையையும் காக்கிறது.
theological_decisions:
- issue: τοὺς νεκρούς என்பதை மரபுவழிப் பொதுப்பெயராகவா அல்லது தெளிவான நபர்சுட்டாகவா மொழிபெயர்ப்பது
  choice: இறந்தவர்கள்
  alternative: மரித்தோர்
  rationale: ‘இறந்தவர்கள்’ என்பது நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் இருந்து, உயிர்த்தெழுப்பும் கடவுளின் வல்லமையை எந்தக் கூடுதல் கோட்பாட்டு விளக்கமும் இன்றி தெரிவிக்கிறது.
- issue: ἀπόκριμα τοῦ θανάτου என்பதன் நீதித்துறை சார்ந்த நுணுக்கம்
  choice: மரணத் தீர்ப்பு
  alternative: மரணம் என்ற முடிவு
  rationale: மரணம் தவிர்க்க முடியாத முடிவாகிவிட்டது என்ற பவுலின் அனுபவத்தை ‘மரணத் தீர்ப்பு’ வலுவாகக் காக்கிறது; அரிய சொல்லின் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நாங்களே’ என்ற வலியுறுத்தலும், தங்களைச் சார்வதற்கும் கடவுளைச் சார்வதற்கும் இடையிலான மாறுபாடும் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
