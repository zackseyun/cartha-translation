source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: ta
  text: கடவுளுடைய வாக்குறுதிகள் எத்தனை இருந்தாலும், அவற்றுக்கான “ஆம்” அவரில் இருக்கிறது.[a] ஆகவே, நம் மூலமாக மகிமை உண்டாகும்படி, அவர் மூலமாகவும் கடவுளுக்கு “ஆமென்” என்று சொல்லப்படுகிறது.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல், “அவரில் ‘ஆம்’ இருக்கிறது.” “அவரில் அவை தங்கள் ‘ஆம்’ என்பதைப் பெறுகின்றன” என்றும் பொருளை வெளிப்படையாகக் கூறலாம்.
    reason: alternative_reading
  - marker: b
    text: “ஆமென்” என்பது “உண்மையாகவே” அல்லது “அப்படியே ஆகட்டும்” போன்ற உறுதிப்பாட்டைக் குறிக்கும் எபிரெயச் சொல்லின் ஒலிபெயர்ப்பு.
    reason: cultural_note
  - marker: c
    text: “நம் மூலமாகக் கடவுளுக்கு மகிமை உண்டாகும்படி” என்றும் இத்தொடரை இன்னும் வெளிப்படையாகப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: எத்தனை இருந்தாலும்
  rationale: எண்ணிக்கையை வரையறுக்காமல், கடவுளுடைய வாக்குறுதிகள் அனைத்தையும் உள்ளடக்கும் கிரேக்கச் சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπαγγελίαι θεοῦ
  choice: கடவுளுடைய வாக்குறுதிகள்
  rationale: வாக்குறுதிகள் கடவுளுக்குரியவை, அதாவது அவர் அளித்தவை என்பதைக் கிரேக்க மரபுத்தொடருக்கு நெருக்கமாகக் காட்டுகிறது.
- source_word: ἐν αὐτῷ τὸ Ναί
  choice: அவற்றுக்கான “ஆம்” அவரில் இருக்கிறது
  rationale: கிறிஸ்துவில் வாக்குறுதிகள் நிறைவேறுகின்றன என்று விரித்துரைக்காமல், பவுலின் சுருக்கமானதும் வலியுறுத்தல் கொண்டதுமான உருவக மொழியைத் தக்கவைக்கிறது. “அவற்றுக்கான” என்பது தமிழில் தொடர்பைத் தெளிவாக்கும் குறைந்தபட்சச் சேர்ப்பு.
- source_word: διὸ καὶ δι’ αὐτοῦ
  choice: ஆகவே ... அவர் மூலமாகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவையும், கிறிஸ்துவின் வழியாக நிகழும் இடைநிலையையும் காட்டுகிறது; “வே” என்பது καί தரும் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ Ἀμὴν
  choice: “ஆமென்”
  rationale: வழிபாட்டிலும் பொதுவான கிறிஸ்தவப் பயன்பாட்டிலும் நிலைபெற்ற ஒலிபெயர்ப்பைத் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: “ஆமென்” யாரை நோக்கிச் செலுத்தப்படுகிறது என்பதைத் தெரிவிக்கும் கிரேக்க நான்காம் வேற்றுமையை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: πρὸς δόξαν
  choice: மகிமை உண்டாகும்படி
  rationale: மகிமையை நோக்கமாகக் காட்டும் சொற்றொடரை இயல்பான தமிழில் தருகிறது; அது யாருடைய மகிமை என்பதிலுள்ள இலக்கணச் சுருக்கத்தை முதன்மை உரையில் முழுமையாக விரித்துரைக்கவில்லை.
- source_word: δι’ ἡμῶν
  choice: நம் மூலமாக
  rationale: பவுலையும் உடன் பணியாளர்களையும் குறிக்கும் முதல் நபர் பன்மையை உள்ளடக்கிய தமிழில் தருவதோடு, “ஊழியம்” போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் கிரேக்கத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: வாக்குறுதிகளுக்கும் கிறிஸ்துவுக்கும் உள்ள தொடர்பை நிறைவேற்றுதல் என்ற வெளிப்படையான கூற்றாக விரிக்க வேண்டுமா
  choice: “அவற்றுக்கான ‘ஆம்’ அவரில் இருக்கிறது” என்ற சுருக்கமான வடிவத்தைப் பேணுதல்
  alternative: “அவை அனைத்தும் அவரில் நிறைவேறுகின்றன”
  rationale: கிறிஸ்துவில் நிறைவேற்றுதல் உட்பொருளாக இருந்தாலும், கிரேக்க உரை அதை அந்தச் சொற்களால் வெளிப்படையாகக் கூறவில்லை. பவுலின் இறுக்கமான உருவகத்தையும் அதன் இறையியல் ஆழத்தையும் பாதுகாக்கிறது.
- issue: πρὸς δόξαν என்பதில் மகிமை குறிப்பாகக் கடவுளுக்குரியது என்று வெளிப்படையாக இணைக்க வேண்டுமா
  choice: முதன்மை உரையில் “மகிமை உண்டாகும்படி” என்று சுருக்கத்தைப் பேணுதல்
  alternative: “கடவுளுக்கு மகிமை உண்டாகும்படி” அல்லது “கடவுளுடைய மகிமைக்காக”
  rationale: சூழல் கடவுளின் மகிமையை வலுவாகச் சுட்டினாலும், கிரேக்கச் சொற்றொடரின் இணைப்பு சுருக்கமாக உள்ளது. வெளிப்படையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் வேதாகம உரைக்குரிய செறிவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. “ஆம்” மற்றும் “ஆமென்” என்ற இணையான வலியுறுத்தலை மேற்கோள் குறிகள் தெளிவாக்குகின்றன. கிரேக்கத்தில் விடுபட்டுள்ள வினையைத் தமிழில் புரியும் வகையில் “என்று சொல்லப்படுகிறது” எனப் பொதுவான செயப்பாட்டு வடிவில் நிரப்பி, யார் சொல்கிறார் என்பதைத் தேவையின்றி வரையறுக்கவில்லை.
