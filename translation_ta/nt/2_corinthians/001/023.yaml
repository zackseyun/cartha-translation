source:
  edition: SBLGNT
  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: ta
  text: 'ஆனால் நான் என் உயிரையே பணயம் வைத்து[a] கடவுளைச் சாட்சியாக அழைக்கிறேன்: உங்களைத் தப்பவிடுவதற்காகவே நான் கொரிந்துவுக்கு மீண்டும் வரவில்லை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச்சொல், “என் உயிரின்மேல்”; அல்லது, “எனக்கு எதிராக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் இனி கொரிந்துவுக்கு வரவில்லை.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: ஆனால் நான்
  rationale: δέ குறிக்கும் மென்மையான மாறுபாட்டையும் ἐγώ தரும் தன்வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: கடவுளைச் சாட்சியாக அழைக்கிறேன்
  rationale: பவுல் தாம் சொல்வது உண்மை என்பதற்குக் கடவுளைச் சாட்சியாக அழைக்கும் ஆணைமொழியின் தீவிரத்தைத் தெளிவாகத் தருகிறது.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: என் உயிரையே பணயம் வைத்து
  rationale: சொல்-சொல்லான ‘என் உயிரின்மேல்’ என்பது நவீன தமிழில் தெளிவற்றதாக இருக்கலாம்; பொய்யாக இருந்தால் அதன் பொறுப்பு தம்மீதே விழும் ஆணைமொழியின் பொருளை இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது. நேரடி வடிவமும் மற்றொரு சாத்தியமும் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι அறிமுகப்படுத்தும் ஆணைமொழியின் உள்ளடக்கத்தைத் தமிழில் இரட்டைப்புள்ளி இயல்பாக இணைக்கிறது; இதனை காரணவாக்கியமாக மாற்றவில்லை.
- source_word: φειδόμενος ὑμῶν
  choice: உங்களை விட்டுவைக்கவே
  rationale: φείδομαι என்பதன் ‘கடுமையான நடவடிக்கை அல்லது வேதனையிலிருந்து ஒருவரைத் தப்பவைத்தல்’ என்ற பொருளையும், வராததற்கான நோக்கத்தையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: οὐκέτι ἦλθον
  choice: மீண்டும் வரவில்லை
  rationale: சூழலில் ஒத்திவைக்கப்பட்ட மறுவருகையைக் குறிக்கும் இயல்பான தமிழ்; οὐκέτι என்பதில் இருக்கக்கூடிய ‘இனி/அதற்குமேல் இல்லை’ என்ற நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: εἰς Κόρινθον
  choice: கொரிந்துவுக்கு
  rationale: ஒரு நகரத்தை நோக்கிய இயக்கத்தை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: ஆணைமொழியில் ἐπὶ τὴν ἐμὴν ψυχήν என்பதன் வலிமை
  choice: என் உயிரையே பணயம் வைத்து
  alternative: என் உயிரின்மேல் / எனக்கு எதிராக
  rationale: இது மனித உயிரின் இயல்பைப் பற்றிய கோட்பாட்டுச் சொல்லாக மட்டும் அல்லாமல், பொய்யானால் தம்மீது தீர்ப்பு வரட்டும் என்ற பொறுப்புடன் கடவுளைச் சாட்சியாக அழைக்கும் ஆணைமொழியாக உள்ளது. முதன்மை உரை அதன் செயல்பாட்டைத் தருகிறது; சொற்றொடரின் திறந்த நிழற்பொருட்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘விட்டுவைக்கவே’ என்பது தண்டனையோ கடுமையான நேர்காணலோ அளிக்காமல் காப்பதைக் குறிக்கிறது; ‘மீண்டும் வரவில்லை’ என்பது சூழலுக்கேற்ற இயல்பான வடிவம். எல்லா அடிக்குறிப்பு குறிகளும் உரையில் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் இடப்பட்டுள்ளன.
