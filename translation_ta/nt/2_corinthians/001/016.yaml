id: 2CO.1.16
reference: 2 Corinthians 1:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: ta
  text: உங்கள் வழியாக மக்கெதோனியாவுக்குச் சென்று, மறுபடியும் மக்கெதோனியாவிலிருந்து உங்களிடம் வந்து, யூதேயாவுக்குச் செல்ல உங்களால் வழியனுப்பப்படவும் விரும்பினேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயாவுக்குச் செல்லும் என் பயணத்திற்கு உங்களிடமிருந்து உதவி பெறவும் விரும்பினேன்.”
    reason: προπεμφθῆναι என்பது வெறுமனே வழியனுப்புவதை மட்டுமல்லாமல், பயணத்திற்குத் தேவையான உதவிகளை வழங்குவதையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: உங்கள் வழியாக
  rationale: διά + ஆறாம் வேற்றுமை இங்கு கொரிந்துவை வழித்தடமாகக் கொண்டு பயணிப்பதைக் குறிக்கிறது; ‘உங்கள் வழியாக’ என்பது இந்தத் திசைசார் பொருளை இயல்பாகத் தருகிறது.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: மக்கெதோனியாவுக்குச் சென்று
  rationale: διέρχομαι என்பதன் வழியாகச் செல்/கடந்து செல் என்ற கருத்தைத் தமிழில் இயல்பான பயண மொழியில் தருகிறது. முந்தைய ‘உங்கள் வழியாக’ என்பதால் வழித்தடக் கருத்து ஏற்கெனவே தெளிவாகிறது.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: மறுபடியும் மக்கெதோனியாவிலிருந்து உங்களிடம் வந்து
  rationale: πάλιν திரும்பும் அடுத்த பயணத்தைச் சுட்டுகிறது; ‘மறுபடியும்’ என்பதை வைத்திருப்பது மீள்வருகையை வெளிப்படுத்துகிறது, ஆனால் கிரேக்கத்தில் இல்லாத ‘திரும்பி’ என்பதைச் சேர்க்கவில்லை.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: உங்களால் வழியனுப்பப்படவும்
  rationale: ὑπό + ஆறாம் வேற்றுமை கொரிந்தியர்களின் செயற்பாட்டைக் குறிக்கிறது. προπέμπω பயணச் சூழலில் தேவையான உதவிகளுடன் ஒருவரை அடுத்த கட்டப் பயணத்திற்கு அனுப்புவதைச் சுட்டலாம்; ‘வழியனுப்பப்பட’ என்பது பொருளை மிகையாக விரிக்காமல் இயல்பாகத் தருகிறது.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: யூதேயாவுக்குச் செல்ல
  rationale: εἰς இலக்கைச் சுட்டுகிறது; தமிழில் ‘யூதேயாவுக்குச் செல்ல’ என்பது இயல்பான இலக்குக் கட்டமைப்பு.
