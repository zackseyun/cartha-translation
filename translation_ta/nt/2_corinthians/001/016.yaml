translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, மரியாதைக்குரிய நடை பயன்படுத்தப்பட்டுள்ளது. இந்த வசனம் முந்தைய வசனத்தில் தொடங்கிய வாக்கியத்தின் தொடராக இருப்பதால், சூழலிலிருந்து வரும் ‘விரும்பினேன்’ சேர்க்கப்பட்டு தமிழில் முழுமையான வாக்கியமாக அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
