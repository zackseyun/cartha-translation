  terminology: ‘வழியனுப்பப்பட’ என்பது προπεμφθῆναι-யின் பயணச்சூழல் பொருளுக்கு ஏற்ற முதன்மைச் சொல்லாகும். அது பயண உதவியையும் உள்ளடக்கலாம் என்ற நுணுக்கத்தை அடிக்குறிப்பு சரியாகக் காக்கிறது. ‘மக்கெதோனியா’, ‘யூதேயா’ ஆகியவை பொருத்தமான வரலாற்றுப் புவியியல் பெயர்கள்.
