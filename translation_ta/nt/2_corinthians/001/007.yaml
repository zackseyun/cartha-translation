revisions:
- from: உங்களைக்குறித்த எங்கள் நம்பிக்கை உறுதியானது. ஏனெனில், பாடுகளில் நீங்கள் பங்குபெறுவதுபோலவே, ஆறுதலிலும் பங்குபெறுகிறீர்கள் என்பதை நாங்கள் அறிந்திருக்கிறோம்.[a]
  to: உங்களைக் குறித்த எங்கள் நம்பிக்கையும் உறுதியானது. ஏனெனில், துன்பங்களில் நீங்கள் பங்குபெறுவதுபோலவே, ஆறுதலிலும்[a] பங்குபெறுகிறீர்கள் என்பதை நாங்கள் அறிந்திருக்கிறோம்.
  rationale: The revision preserves the Greek correlative structure and causal relationship, adds the connective force of καί through ‘நம்பிக்கையும்,’ uses ‘துன்பங்கள்’ for παθήματα, and places the lexical-alternative footnote directly at its anchor. No theological interpretation has been added.
