reference: 2 Corinthians 1:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: ta
  text: உங்களைக் குறித்த எங்கள் நம்பிக்கையும் உறுதியானது. ஏனெனில், துன்பங்களில் நீங்கள் பங்குபெறுவதுபோலவே, ஆறுதலிலும்[a] பங்குபெறுகிறீர்கள் என்பதை நாங்கள் அறிந்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆறுதல்” என்பதற்குப் பதிலாக “ஊக்கமளித்தல்” என்றும் மொழிபெயர்க்கலாம் (παράκλησις).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: நம்பிக்கை
  rationale: எதிர்பார்ப்பையும் உறுதியான நம்புதலையும் உள்ளடக்கும் இயல்பான தமிழ் சொல்.
- source_word: βεβαία
  choice: உறுதியானது
  rationale: பவுலின் நம்பிக்கை நிலையானதும் நம்பத்தக்கதுமாக இருப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களைக்குறித்த
  rationale: இங்கு ὑπέρ கொரிந்தியர்களைப் பற்றிய தொடர்பைக் குறிக்கிறது; ‘உங்களைக்குறித்த’ என்பது பொருளை இயல்பாகத் தருகிறது.
- source_word: εἰδότες
  choice: ஏனெனில் ... அறிந்திருக்கிறோம்
  rationale: இப்பெயரெச்சம் முந்தைய கூற்றுக்கான காரணத்தைத் தருவதால், தமிழில் காரணத் தொடர்பு வெளிப்படையாகக் கூறப்பட்டுள்ளது.
- source_word: ὡς ... οὕτως καί
  choice: '... போலவே, ... உம்'
  rationale: கிரேக்கத்தின் ஒப்புமை இணைப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: κοινωνοί
  choice: பங்குபெறுகிறீர்கள்
  rationale: துன்பங்களிலும் ஆறுதலிலும் உடனான பங்கேற்பைக் குறிக்கும் பெயர்ச்சொல் கருத்தை இயல்பான தமிழ் வினையாக வழங்குகிறது.
- source_word: παθημάτων
  choice: பாடுகள்
  rationale: இச்சூழலில் அனுபவிக்கப்படும் துன்பங்களைச் சுருக்கமாகவும் பரந்த பொருளுடனும் குறிக்கிறது.
- source_word: παρακλήσεως
  choice: ஆறுதல்
  rationale: 2 கொரிந்தியர் 1-ஆம் அதிகாரத்தில் மீண்டும் வரும் παράκλησις என்ற சொல்லின் துன்பச் சூழலிலான ஆறுதல் என்னும் மையப் பொருளைப் பாதுகாக்கிறது.
- source_word: '[elliptical second clause]'
  choice: ஆறுதலிலும் பங்குபெறுகிறீர்கள்
  rationale: கிரேக்கத்தில் இரண்டாம் பகுதியில் விடுபட்டுள்ள பகிர்தல் கருத்தைத் தமிழில் தெளிவுக்காக மீண்டும் வழங்குகிறது.
theological_decisions:
- issue: παράκλησις என்பதன் பொருள் வரம்பு
  choice: ஆறுதல்
  alternative: ஊக்கமளித்தல்
  rationale: உடனடிச் சூழலில் துன்பங்களுக்கு நடுவே கிடைக்கும் ஆறுதல் முதன்மையாக உள்ளது; எனினும் ஊக்கமளித்தல் என்ற நிழற்பொருளும் சொல்லில் அடங்குவதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. கிரேக்கத்தின் ‘எப்படியோ அப்படியே’ ஒப்புமைக் கட்டமைப்பும் இரண்டாம் கூறிலுள்ள மறைநிலை வினையும் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளன.
