source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: ta
  text: நாங்கள் துன்பத்துக்கு உள்ளானால், அது உங்கள் ஆறுதலுக்காகவும் இரட்சிப்புக்காகவும் இருக்கிறது; நாங்கள் ஆறுதல் பெற்றால், அது உங்கள் ஆறுதலுக்காக[b] இருக்கிறது[a]. நாங்களும் அனுபவிக்கிற அதே பாடுகளை நீங்கள் பொறுமையோடு தாங்குவதில் அந்த ஆறுதல் செயல்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “நாங்கள் ஆறுதல் பெற்றால், அது உங்கள் ஆறுதலுக்காக இருக்கிறது” என்ற சொற்கள் இல்லை.
    reason: textual_variant
  - marker: b
    text: இந்த வசனம் முழுவதிலும் “ஆறுதல்” என்பதற்கு “ஊக்கம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: நாங்கள் துன்பத்துக்கு உள்ளானால்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவம் தொடர்ந்து அழுத்தத்திற்கும் துன்பத்திற்கும் உள்ளாகும் அனுபவத்தைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: ஆறுதல் / ஆறுதல் பெற்றால்
  rationale: இச்சொல் ஆறுதலளித்தல், ஊக்கப்படுத்துதல் ஆகிய இரு நிழற்பொருள்களையும் கொண்டது. 2 கொரிந்தியர் 1:3–7 பகுதியில் மீண்டும் மீண்டும் வரும் சொல்லிணைப்பைத் தக்கவைக்க ஒரே சொல்வேரைக் கொண்ட நடை பயன்படுத்தப்பட்டது.
- source_word: σωτηρίας
  choice: இரட்சிப்பு
  rationale: விடுவிப்பு என்ற பொருள் சாத்தியமானாலும், σωτηρία என்பதன் பரந்த மீட்புப் பொருளைத் தெளிவாகக் காட்டும் வழக்கமான தமிழ் வேதாகமச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: τῆς ἐνεργουμένης
  choice: அந்த ஆறுதல் செயல்படுகிறது
  rationale: ஆறுதல் வெறுமனே இருப்பதல்ல, பொறுமையான தாங்குதலில் செயலாற்றுகிறது என்ற வினைத்திறனை இது காக்கிறது.
- source_word: ἐν ὑπομονῇ
  choice: பொறுமையோடு தாங்குவதில்
  rationale: ὑπομονή குறிக்கும் நிலைத்த பொறுமையையும் துன்பத்தைத் தொடர்ந்து தாங்கும் செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῶν αὐτῶν παθημάτων
  choice: அதே பாடுகளை
  rationale: பவுலும் உடனிருந்தவர்களும் அனுபவிக்கும் துன்பங்களில் கொரிந்தியரும் பங்குபெறும் கருத்தை நேரடியாகக் காக்கிறது.
- source_word: ὑπὲρ
  choice: உங்கள் ... காக
  rationale: கொரிந்தியருக்குக் கிடைக்கும் நன்மையைச் சுட்டும் பயன்நோக்குப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: σωτηρία என்பதன் பொருள்
  choice: இரட்சிப்பு
  alternative: விடுவிப்பு
  rationale: உடனடியான துன்பத்திலிருந்து விடுதலை மட்டும் என்று பொருளைக் குறுக்காமல், பவுலின் பயன்பாட்டிலுள்ள பரந்த மீட்புப் பொருளைத் திறந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இணை அமைப்பும் ‘ஆறுதல்’ என்ற சொல்லின் மீளுரையும் காக்கப்பட்டுள்ளன; கடினமான இறுதித் தொடர்பு இயல்பான தமிழ் வாக்கியமாகப் பிரிக்கப்பட்டுள்ளது.
