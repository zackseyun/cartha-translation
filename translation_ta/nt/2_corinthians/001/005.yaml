  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: ta
  text: ஏனெனில், கிறிஸ்துவின் பாடுகள் எங்களுக்குள் எவ்வாறு பெருகி வழிகின்றனவோ[a][b], அவ்வாறே கிறிஸ்துவின் வழியாக எங்களுடைய ஆறுதலும் பெருகி வழிகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவுக்காக அனுபவிக்கும் பாடுகள்.” கிரேக்கத் தொடர் கிறிஸ்துவுக்குரிய பாடுகளையோ, அவர் காரணமாக அனுபவிக்கப்படும் பாடுகளையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “கிறிஸ்து” என்பதை, பட்டப்பெயரின் பொருள் வலியுறுத்தப்படும் இடத்தில் “மேசியா” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பாகக் காரணத் தொடர்பைக் காட்டுகிறது.
- source_word: καθὼς ... οὕτως
  choice: எவ்வாறு ... அவ்வாறே
  rationale: மூலத்தின் ஒப்புமை இணை அமைப்பைத் தெளிவாகப் பேணுகிறது.
- source_word: περισσεύει
  choice: பெருகி வழிகின்றன / பெருகி வழிகிறது
  rationale: அளவுக்கு மிகுதியாக இருப்பதையும் நிரம்பி வழியும் உருவகத்தையும் வெளிப்படுத்துகிறது; இரு இடங்களிலும் ஒரே சொல்லுருவை இயன்றவரை பேணுகிறது.
- source_word: τὰ παθήματα
  choice: பாடுகள்
  rationale: πάθημα என்பதன் நேரடியான பொருளை dignified, பொதுவாகப் புரியும் நவீனத் தமிழில் தருகிறது.
- source_word: τοῦ Χριστοῦ
  choice: கிறிஸ்துவின்
  rationale: மூலத்தின் உரிமைவேற்றுமைத் தொடர்பைத் தீர்மானிக்காமல் அப்படியே பேணுகிறது; அதன் பொருள் நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: εἰς ἡμᾶς
  choice: எங்களிடம்
  rationale: பவுலையும் அவருடைய உடன் ஊழியர்களையும் நோக்கிப் பாடுகள் வந்து அவர்களால் அனுபவிக்கப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: διὰ τοῦ Χριστοῦ
  choice: கிறிஸ்துவின் வழியாக
  rationale: διά + உரிமைவேற்றுமை காட்டும் இடைமுகச் செயல்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: παράκλησις
  choice: ஆறுதல்
  rationale: இச்சூழலில் துன்பத்துக்கு எதிரிணையாக வரும் மேய்ப்புப் பராமரிப்பு சார்ந்த ஆறுதல் பொருளைச் சிறப்பாகக் காட்டுகிறது.
- source_word: ἡ παράκλησις ἡμῶν
  choice: எங்களுடைய ஆறுதல்
  rationale: மூலத்தின் உடைமைத் தொடரை விரிவாக்காமல் நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: “கிறிஸ்துவின் பாடுகள்” என்பதன் பொருள்
  choice: கிறிஸ்துவுக்குரிய பாடுகளில் அவரோடு இணைந்தவர்கள் பங்குகொள்வது என்ற பொருளை அனுமதிக்கும் தெளிவுபடுத்தப்படாத உரிமைவேற்றுமைத் தொடர்
  alternative: கிறிஸ்துவுக்காக அனுபவிக்கப்படும் பாடுகள்; அல்லது கிறிஸ்து தாமே அனுபவித்த பாடுகள் அவருடைய மக்களிடம் பெருகுவது
  rationale: τοῦ Χριστοῦ என்ற உரிமைவேற்றுமை ஒன்றுக்கு மேற்பட்ட தொடர்பு நுணுக்கங்களை அனுமதிக்கிறது. முதன்மை உரை “கிறிஸ்துவின்” என்று அமைப்பைத் திறந்த நிலையில் வைத்திருக்கிறது; சாத்தியமான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. “பெருகி வழிகிறது” என்ற தொடர் περισσεύει என்பதிலுள்ள மிகுதியையும் நிரம்பி வழிதலையும் தக்கவைக்கிறது. “எங்கள்” என்பது பவுலையும் அவரது உடன் ஊழியர்களையும் குறிக்கும் பன்மையை இயல்பாகக் காட்டுகிறது.
