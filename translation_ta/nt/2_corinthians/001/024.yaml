source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: ta
  text: நாங்கள் உங்கள் விசுவாசத்தின்மேல்[a] ஆதிக்கம் செலுத்துகிறோம் என்பதல்ல; மாறாக, உங்கள் மகிழ்ச்சிக்காக நாங்கள் சக ஊழியர்களாக இருக்கிறோம்[b]. ஏனெனில், விசுவாசத்தினால்[c] நீங்கள் நிலைத்திருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் நம்பிக்கையின்மேல்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் மகிழ்ச்சிக்காகச் சேர்ந்து உழைப்பவர்களாக இருக்கிறோம்.” கிரேக்கத்தில் யாருடன் சேர்ந்து உழைக்கிறோம் என்பது வெளிப்படையாகக் கூறப்படவில்லை.
    reason: translation_clarity
  - marker: c
    text: அல்லது, “விசுவாசத்தில்.”
    reason: grammatical_alternative
lexical_decisions:
- source_word: κυριεύομεν
  choice: ஆதிக்கம் செலுத்துகிறோம்
  rationale: ஆளுகையையும் மேலாதிக்கத்தையும் செலுத்துவதை இந்த வினை குறிக்கிறது. எதிர்மறைச் சூழலில் அதிகாரத்தால் கட்டுப்படுத்தும் நிழற்பொருளை இயல்பான தமிழில் இது தெளிவாகக் காட்டுகிறது.
- source_word: ὑμῶν τῆς πίστεως
  choice: உங்கள் விசுவாசத்தின்மேல்
  rationale: இரட்டை வேற்றுமைத் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; πίστις என்பதன் முதன்மைத் தேர்வாக ‘விசுவாசம்’ வைக்கப்பட்டுள்ளது.
- source_word: συνεργοί
  choice: உங்களுடன் சேர்ந்து உழைப்பவர்கள்
  rationale: கொரிந்தியர்மேல் அதிகாரம் செலுத்துவோருக்கு மாறாக, அவர்களோடு இணைந்து செயல்படுவோர் என்ற முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: உங்கள் மகிழ்ச்சிக்காக
  rationale: இங்குள்ள மரபுவேற்றுமை வடிவம் அவர்கள் மகிழ்ச்சியை நோக்கமாகக் கொண்ட உழைப்பைக் குறிப்பதாகச் சூழல் காட்டுகிறது; தமிழில் நோக்கத்தை இயல்பாகச் சொல்கிறது.
- source_word: τῇ γὰρ πίστει
  choice: ஏனெனில், விசுவாசத்தினால்தான்
  rationale: வேற்றுமை வடிவத்தை வழி அல்லது அடிப்படை எனப் புரிந்து, γάρ தரும் விளக்கத் தொடர்பையும் வலியுறுத்தலையும் தமிழில் காட்டுகிறது.
- source_word: ἑστήκατε
  choice: நீங்கள் நிலைத்து நிற்கிறீர்கள்
  rationale: நிறைவேற்றுக் கால வடிவத்தின் தற்போதைய நிலைபெற்ற விளைவை ‘நிலைத்து நிற்கிறீர்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இரு இடங்களிலும் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; விசுவாசத்தில்
  rationale: இவ்வசனம் கொரிந்தியரின் நம்பும் நிலைப்பாட்டைப் பற்றிப் பேசுகிறது. ‘விசுவாசம்’ முதன்மைப் பொருளைப் பாதுகாக்கிறது; இறுதி தொடரிலுள்ள கருவிப்பொருள் மற்றும் நிலைப்பொருள் ஆகிய இலக்கண வாய்ப்புகள் அடிக்குறிப்பில் திறந்தவையாக வைக்கப்பட்டுள்ளன.
- issue: சக உழைப்பின் தொடர்பு
  choice: உங்கள் மகிழ்ச்சிக்காக உங்களுடன் சேர்ந்து உழைப்பவர்கள்
  alternative: உங்கள் மகிழ்ச்சிக்காகச் சேர்ந்து உழைப்பவர்கள்
  rationale: ஆதிக்கம் செலுத்துவதற்கு எதிரான கூட்டுப்பணியைத் தெளிவாகவும் இயல்பாகவும் சொல்கிறது. ஆயினும் σύν என்ற வெளிப்படையான சொல் மூலத்தில் இல்லாததால், குறைவாக விளக்கமளிக்கும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் பவுலின் நேரடியான எதிர்மறை–நேர்மறை முரண்பாடும் காக்கப்பட்டுள்ளன. ‘ஆதிக்கம் செலுத்துதல்,’ ‘விசுவாசம்,’ ‘நிலைத்து நிற்றல்’ ஆகியவை சபைச் சூழலுக்கு ஏற்றவையாக இருந்தாலும் சாதாரண வாசகருக்கும் புரியும் சொற்கள்.
