revisions:
- from: நாங்கள் உங்கள் விசுவாசத்தின்மேல்[a] ஆதிக்கம் செலுத்துகிறோம் என்பதல்ல; மாறாக, உங்கள் மகிழ்ச்சிக்காக உங்களுடன் சேர்ந்து உழைப்பவர்கள்[b]. ஏனெனில், விசுவாசத்தினால்தான்[c] நீங்கள் நிலைத்து நிற்கிறீர்கள்.
  to: நாங்கள் உங்கள் விசுவாசத்தின்மேல்[a] ஆதிக்கம் செலுத்துகிறோம் என்பதல்ல; மாறாக, உங்கள் மகிழ்ச்சிக்காக நாங்கள் சக ஊழியர்களாக இருக்கிறோம்[b]. ஏனெனில், விசுவாசத்தினால்[c] நீங்கள் நிலைத்திருக்கிறீர்கள்.
  rationale: The revision removes the unsupported specification that Paul and his companions work “with you,” supplies a natural Tamil predicate for συνεργοί ἐσμεν, and removes the added emphasis of தான். It retains the source’s contrast, the project’s rendering of πίστις as “விசுவாசம்,” and the grammatical alternative for the final dative.
  reviewer_model: gpt-5.6-terra
