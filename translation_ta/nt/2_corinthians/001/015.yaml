source:
  edition: SBLGNT
  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: ta
  text: இந்த நம்பிக்கையுடன், நீங்கள் இரண்டாவது நன்மையை[b] பெறும்படி, முதலில்[a] உங்களிடம் வர எண்ணியிருந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்னதாக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இரண்டாவது அருளை” அல்லது “இரண்டாவது தயவை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: உறுதியுடன்
  rationale: πεποίθησις என்பது நம்பிக்கையால் உருவாகும் உறுதி அல்லது திடநம்பிக்கையைக் குறிக்கிறது. சூழலில் பவுல் தன் பயண எண்ணத்தின் அடிப்படையைச் சொல்வதால், இயல்பான தமிழில் “உறுதியுடன்” பொருத்தமாக உள்ளது.
- source_word: ἐβουλόμην
  choice: வர எண்ணியிருந்தேன்
  rationale: βούλομαι விருப்பத்தையோ நோக்கத்தையோ குறிக்கிறது. “எண்ணியிருந்தேன்” என்பது வெறும் ஆசையைவிடத் தெளிவான நோக்கத்தையும், முறைப்படுத்தப்பட்ட உறுதியான திட்டம் என்று மிகைப்படுத்தாத தன்மையையும் காக்கிறது.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: முதலில் உங்களிடம் வர
  rationale: πρότερον இங்கு பயண வரிசையில் முதன்மையைக் குறிக்க வாய்ப்பு அதிகம். அடுத்த வசனத்தில் விவரிக்கப்படும் பயணத் திட்டத்தோடு “முதலில்” இயல்பாகப் பொருந்துகிறது; “முன்னதாக” என்ற காலப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: δευτέραν χάριν
  choice: இரண்டாவது நன்மையை
  rationale: χάρις என்பதற்கு அருள், தயவு, நன்மை ஆகிய பொருட்கள் உண்டு. இங்கு பவுலின் வருகையால் கொரிந்தியர்கள் பெறும் பயனைக் குறிப்பதால் “நன்மை” தெளிவாக உள்ளது; ஆயினும் மூலச்சொல்லின் “அருள்/தயவு” நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: σχῆτε
  choice: பெறும்படி
  rationale: ἔχω என்பதன் இறந்தகாலத் துணைவினை வடிவமான σχῆτε இச்சூழலில் ஒன்றைப் பெற்றிருக்க அல்லது அடையக் குறிக்கிறது. தமிழில் நோக்கவாக்கியத்துடன் “பெறும்படி” இயல்பாக அமைகிறது.
theological_decisions:
- issue: χάρις என்பதை இரட்சிப்புக்குரிய ‘அருள்’ எனத் தெளிவுபடுத்தலாமா, வருகையால் கிடைக்கும் ‘நன்மை’ என மொழிபெயர்க்கலாமா
  choice: முதன்மை உரையில் “நன்மை”
  alternative: “அருள்” அல்லது “தயவு”
  rationale: பயணச் சூழல் நடைமுறைப் பயனை முன்னிறுத்துகிறது. எனினும் χάρις சொல்லின் அருள் சார்ந்த ஒலிப்பை முற்றிலும் நீக்காமல் மாற்று மொழிபெயர்ப்பாக அடிக்குறிப்பில் வழங்குவது மூலத்தின் பொருள் விரிவைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. “எண்ணியிருந்தேன்” என்பது பவுலின் நோக்கத்தை இயல்பாகச் சொல்கிறது; “முதலில்” மற்றும் “இரண்டாவது நன்மை” ஆகியவற்றிலுள்ள உண்மையான பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
