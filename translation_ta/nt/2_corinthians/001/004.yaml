source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: ta
  text: நம்முடைய எல்லா உபத்திரவங்களிலும் நமக்கு ஆறுதல் அளிக்கிற கடவுள், எந்த உபத்திரவத்திலும் இருப்பவர்களுக்கு, கடவுளால் நாமே பெறும் ஆறுதலின் மூலம் ஆறுதல் அளிக்க நம்மால் முடியும் என்பதற்காக அவ்வாறு செய்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆறுதல் அளிக்கிறார் … ஆறுதல்’ என்பதற்குப் பதிலாக, ‘ஊக்கமளிக்கிறார் … ஊக்கம்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் வசனம் முழுவதும் ஒரே சொற்குடும்பம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: ஆறுதல் அளிக்கிறவர் / ஆறுதல் அளிக்க / ஆறுதலை / ஆறுதல் பெறுகிற
  rationale: உபத்திரவத்தின் சூழலில் இந்தச் சொற்குடும்பம் ஆறுதலையும் உள்ளார்ந்த வலிமையூட்டுதலையும் குறிக்கிறது. தமிழில் ஒரே சொற்குடும்பத்தை இயன்றவரை மீண்டும் பயன்படுத்துவது கிரேக்க மூலத்தின் வலியுறுத்தலைக் காக்கிறது.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: நமது எல்லா உபத்திரவங்களிலும்
  rationale: θλῖψις என்பது நெருக்கடி, துன்பம், ஒடுக்குதல் ஆகிய பரப்பைக் கொண்டது. ‘உபத்திரவம்’ அதன் கனத்த தன்மையைத் தக்கவைக்கிறது; பன்மை வடிவம் இயல்பான நவீன தமிழில் ‘எல்லா’ என்பதோடு பொருந்துகிறது.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: இவ்வாறு ... நம்மால் முடிகிறது
  rationale: இந்த அமைப்பு நோக்கம் அல்லது விளைவு என்ற இரண்டிற்கும் இடமளிக்கக்கூடும். ‘இவ்வாறு’ என்பது அந்தத் தொடர்பை இயல்பாகக் காட்டி, ஒன்றை மட்டும் கடுமையாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: எந்த உபத்திரவத்திலும் இருப்பவர்களுக்கு
  rationale: இங்கு πᾶς பரந்த பகிர்வு உணர்வைக் கொண்டுள்ளது—எவ்வகை உபத்திரவத்தில் இருப்பவர்களாயினும். ‘எந்த ... இருந்தாலும்’ என்ற பொருளை இந்த வடிவம் சுருக்கமாகத் தருகிறது.
- source_word: αὐτοὶ
  choice: நாமே
  rationale: αὐτοί தரும் அழுத்தத்தை இயல்பான தமிழில் ‘நாமே’ காக்கிறது.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து
  rationale: ὑπό செய்பவரைக் குறித்தாலும், தமிழில் ஆறுதலை ‘கடவுளிடமிருந்து பெறுகிறோம்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; தெய்வீக மூலத்தையும் செயற்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: παρακαλέω / παράκλησις என்பவற்றின் பொருள் பரப்பு
  choice: ஆறுதல் அளி / ஆறுதல்
  alternative: ஊக்கமளி / ஊக்கம்; தேற்றுதல் / தேற்றுதல்
  rationale: θλῖψις என்ற உபத்திரவச் சூழலில் துயரத்தின் நடுவே தேற்றியும் வலிமைப்படுத்தியும் உதவும் பொருள் முதன்மையாகிறது. ‘ஆறுதல்’ பொதுவான நவீன தமிழில் இயல்பாக இருப்பதோடு, வசனம் முழுவதும் வரும் சொல் மீளுருவாக்கத்தையும் காக்கிறது.
- issue: εἰς τό அமைப்பின் நோக்கம்–விளைவு நுணுக்கம்
  choice: ‘இவ்வாறு ... முடிகிறது’ எனத் தொடர்பைத் திறந்தவாறு வைத்தல்
  alternative: ‘அதனால் நாம் ... அளிக்கும்படி’ எனத் தெளிவான நோக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்க அமைப்பு நோக்கத்தையும் விளைவையும் தாங்கக்கூடும். தமிழ் உரை இரண்டிற்கும் இடமளிக்கிறது; கடவுளின் ஆறுதல் மற்றவர்களை ஆற்றுப்படுத்த நம்மைத் திறனுள்ளவர்களாக்குகிறது என்பதே மையம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு தெளிவாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் நீண்ட வாக்கியத்தை வாசிப்புத் தெளிவுக்காக இரு வாக்கியங்களாகப் பிரித்தாலும், காரண–நோக்கம்/விளைவு தொடர்பும் மீளும் ‘ஆறுதல்’ சொற்குடும்பமும் காக்கப்பட்டுள்ளன.
