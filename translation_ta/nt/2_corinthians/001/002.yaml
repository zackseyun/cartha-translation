id: 2CO.1.2
reference: 2 Corinthians 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ta
  text: நம் தந்தையாகிய கடவுளிடமிருந்தும், ஆண்டவராகிய இயேசு மேசியாவிடமிருந்தும்[a][b] உங்களுக்கு அருளும் சமாதானமும் உண்டாவதாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வழக்கமாக, “இயேசு கிறிஸ்து” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சில சூழல்களில் “ஆண்டவர்” என்பதற்கு “எஜமான்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்துச் சூத்திரத்தில் உள்ள வாழ்த்துப் பொருளையும் இறையியல் செறிவையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: பெறுநரைக் குறிக்கும் கிரேக்க வேற்றுமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: வேதாகமப் பின்னணியுள்ள அமைதி, நல்வாழ்வு ஆகிய விரிந்த பொருளைத் தக்கவைக்கும் நிலையான தமிழ் சொல்.
- source_word: ἀπὸ
  choice: இடமிருந்தும்
  rationale: அருளும் சமாதானமும் வரும் மூலத்தைத் தெளிவாகக் குறிக்கிறது; இரு மூலங்களுடனும் ‘-உம்’ இணைப்பு இயல்பான தமிழை அளிக்கிறது.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: நம் தந்தையாகிய கடவுள்
  rationale: ‘கடவுள்’ மற்றும் ‘நம் தந்தை’ என்பவை ஒரே நபரைச் சுட்டும் இணைப்பைத் தெளிவாகவும் நவீனத் தமிழிலும் தருகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: இயேசுவுக்குரிய உயர்ந்த பட்டமாக புதிய ஏற்பாட்டுச் சூழலுக்கு ஏற்ற நிலையான தமிழ் மொழிபெயர்ப்பு.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மேசியா
  rationale: Ἰησοῦ என்பதைப் பெயராகவும் Χριστοῦ என்பதை ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டத்தைக் குறிக்கும் ‘மேசியா’வாகவும் வழங்கி, அதன் பட்டப்பொருளை மறைக்காமல் காக்கிறது.
theological_decisions:
- issue: பவுலின் வாழ்த்தில் Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இயேசுவுக்குரிய பட்டப்பொருள் இன்னும் பொருத்தமாக இருப்பதால் அதை ‘மேசியா’ என்று வெளிப்படையாக வழங்குகிறது; வழக்கமான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: κυρίου என்பதன் கிறிஸ்துவியல் பயன்பாடு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: கடவுளாகிய தந்தையுடன் பகிரப்பட்ட வாழ்த்துச் சூத்திரத்தில் இயேசுவுக்குரிய பட்டமாக வருவதால், ‘ஆண்டவர்’ உயர்ந்த வேதாகம நடையையும் மூலத்தின் இறையியல் அழுத்தத்தையும் காக்கிறது.
- issue: வினையற்ற கிரேக்க வாழ்த்துச் சொற்றொடரைத் தமிழில் நிறைவு செய்தல்
  choice: உண்டாவதாக
  alternative: வினையின்றி ‘உங்களுக்கு அருளும் சமாதானமும்’ என்று விடுதல்
  rationale: கிரேக்கத்தில் வாழ்த்தாகப் புரிந்துகொள்ளப்படும் விடுபட்ட வினையை, கூடுதல் கோட்பாட்டுப் பொருள் சேர்க்காமல் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified வேதாகம நடையைப் பயன்படுத்துகிறது. ‘பிதா’ என்பதற்குப் பதிலாக இயல்பான ‘தந்தை’, ‘கிருபை’ என்பதற்குப் பதிலாக தெளிவான ‘அருள்’ பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் சுருக்கமான ஆசீர்வாத வடிவம் காக்கப்பட்டுள்ளது.
