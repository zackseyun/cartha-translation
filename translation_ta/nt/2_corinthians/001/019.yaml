source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: ta
  text: ஏனெனில், எங்கள் மூலமாக—அதாவது, என் மூலமாகவும் சில்வானு மற்றும் தீமோத்தேயு மூலமாகவும்—உங்களிடையே அறிவிக்கப்பட்ட இறைவனுடைய மகனாகிய இயேசு மெசியா, “ஆம்” என்றும் “இல்லை” என்றும் ஆகவில்லை; மாறாக, அவரில் “ஆம்” என்பது ஆகியிருக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவர் ‘ஆம்’ என்றும் ‘இல்லை’ என்றும் இருக்கவில்லை; மாறாக, அவரில் ‘ஆம்’ என்பது நிலைபெற்றிருக்கிறது.”'
    reason: ‘ஆகுதல்’ வினைகளும் இறுதிப் பிரிவின் சுருக்கமான சொல்லமைப்பும் தமிழில் பலவாறு புரிந்துகொள்ளப்படக்கூடியதால், மூலத்தின் உருவகத் தன்மையைத் தக்கவைக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: υἱὸς τοῦ θεοῦ
  choice: இறைவனுடைய மகன்
  rationale: கிறிஸ்துவுக்குரிய பட்டப்பெயரின் முழு பொருளையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: Ἰησοῦς Χριστός
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு இயேசுவை அடையாளப்படுத்தும் பட்டமாக இருப்பதால், அதன் மெசியா சார்ந்த பொருளை வெளிப்படையாகக் காக்கிறது.
- source_word: κηρυχθείς
  choice: அறிவிக்கப்பட்ட
  rationale: κηρύσσω என்பதன் பொதுமக்கள் முன்னிலையிலான பிரகடனப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: δι’ ἡμῶν ... δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: எங்கள் மூலமாக—அதாவது, என் மூலமாகவும் சில்வானு, தீமோத்தேயு ஆகியோரின் மூலமாகவும்
  rationale: διά குறிக்கும் ஊடகம் அல்லது செயற்பாட்டாளரைப் பாதுகாப்பதுடன், பொதுக் குறிப்பைத் தொடர்ந்து பெயர்கள் வருகிற கிரேக்க அமைப்பையும் தெளிவாக்குகிறது.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: “ஆம்” என்றும் “இல்லை” என்றும் ஆகவில்லை
  rationale: ἐγένετο என்பதன் ‘ஆகுதல்’ நுணுக்கத்தையும் பவுலின் முரண்பாட்டுச் சொற்றொடரையும் விளக்கவுரையாக்காமல் காக்கிறது.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: மாறாக, அவரில் அது “ஆம்” என்று ஆகியிருக்கிறது
  rationale: γέγονεν என்ற நிறைவுநிலை வினையின் நிகழ்ந்து நிலைத்திருக்கும் நுணுக்கத்தையும், ἐν αὐτῷ என்ற தெளிவாகத் தீர்க்கப்படாத தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: Χριστός என்பதைப் பட்டமாகவா, பெயரின் பகுதியாகவா மொழிபெயர்ப்பது
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இங்கு ‘இறைவனுடைய மகன்’ என்பதற்கு இணையாக வரும் Χριστός, மெசியாவைக் குறிக்கும் பட்டத்தின் பொருளைத் தக்கவைக்கிறது; தமிழில் கட்டாயமில்லாத வரையறைச் சொல்லைச் சேர்க்கவில்லை.
- issue: ‘ஆம்/இல்லை’ என்ற சொல்லாட்சியை விளக்கிப் பொருளுரைப்பதா
  choice: “ஆம்” என்றும் “இல்லை” என்றும் ஆகவில்லை; ... “ஆம்” என்று ஆகியிருக்கிறது
  alternative: நிலையற்றவராக இருக்கவில்லை; நம்பத்தக்கவராக இருந்தார்
  rationale: தெய்வீக உண்மைத்தன்மையைச் சுட்டும் பவுலின் இறையியல் அழுத்தத்தை விளக்கவுரையால் முன்கூட்டியே தீர்க்காமல், மூலத்தின் சொல்லாட்சியையும் பதற்றத்தையும் காக்கிறது.
- issue: γέγονεν என்பதன் கால-நிலை நுணுக்கம்
  choice: ஆகியிருக்கிறது
  alternative: ஆயிற்று / இருக்கிறது
  rationale: ஒரு மாற்றம் நிகழ்ந்து அதன் விளைவு தொடர்வதைச் சுட்டும் நிறைவுநிலையை இயன்றவரை பிரதிபலிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை. கிரேக்கத்தில் மீண்டும் வரும் διά அமைப்பை ‘மூலமாக’ என்று காத்து, நீண்ட வாக்கியத்தை இடைக்கோட்டால் வாசிக்க எளிதாக்கியுள்ளது. ‘ஆம்/இல்லை’ என்பவை பவுலின் வலியுறுத்தப்பட்ட சொல்லாட்சியாக மேற்கோள் குறிகளுடன் தரப்பட்டுள்ளன.
