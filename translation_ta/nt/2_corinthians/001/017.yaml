source:
  edition: SBLGNT
  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: ta
  text: ஆகவே, இதை நான் நோக்கமாகக் கொண்டபோது, நிலையற்ற மனத்துடன்[a] நடந்துகொண்டேனா? அல்லது நான் திட்டமிடுகிறவற்றை மாம்சத்தின்படி[b] திட்டமிடுகிறேனா? அப்படியானால், என்னிடம் “ஆம், ஆம்” என்பதும் “இல்லை, இல்லை” என்பதும் இருக்கிறதா?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேசான மனத்துடன்” அல்லது “மனமாறும் தன்மையுடன்.”
    reason: lexical_alternative
  - marker: b
    text: “மாம்சத்தின்படி” என்பது வெறும் மனித அல்லது உலகப்போக்கான அளவுகோல்களின்படி என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, “ஆம்” என்பதும் “இல்லை” என்பதும் ஒரே நேரத்தில் கூறப்படுவதாக இருப்பது போன்ற இரட்டைநிலையை இது குறிக்கலாம். இதை, “அப்படியானால், என்னிடம் ‘ஆம், ஆம்’ என்பதும் ‘இல்லை, இல்லை’ என்பதும் இருக்கிறதா?” என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: நோக்கமாகக் கொண்டபோது
  rationale: முந்தைய பயண எண்ணத்தைக் குறிக்கும் பங்கேற்புவினையின் நோக்கம்/திட்டம் சார்ந்த நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: நிலையற்ற மனத்துடன் நடந்துகொண்டேனா
  rationale: இச்சொற்றொடர் நோக்கத்தில் லேசுத்தன்மை அல்லது நிலையின்மையுடன் நடந்துகொள்வதைக் குறிக்கிறது; வெறும் கவனக்குறைவு என்பதைக் காட்டிலும் சூழலிலுள்ள மனமாற்றக் குற்றச்சாட்டைத் தெளிவாக்குகிறது.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: நான் திட்டமிடுகிறவற்றை ... திட்டமிடுகிறேனா
  rationale: கிரேக்க மூலத்தின் வலியுறுத்தும் மீளுரையைத் தமிழிலும் இயன்றவரை காக்கிறது.
- source_word: κατὰ σάρκα
  choice: மாம்சத்தின்படி
  rationale: பவுலின் பொருள் செறிந்த உருவகச் சொல்லை விளக்கமாகச் சுருக்காமல் காக்கிறது; அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παρ’ ἐμοὶ ... ᾖ
  choice: என்னிடத்தில் ... இருக்க வேண்டுமா
  rationale: பவுலின் நடத்தை அல்லது சொல்லில் இத்தகைய இரட்டை நிலை காணப்படுவதாகிய குற்றச்சாட்டை, ᾖ என்பதன் நோக்கம்/விளைவு சார்ந்த சாத்திய நுணுக்கத்துடன் வெளிப்படுத்துகிறது.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: “ஆம், ஆம்” என்பதும் “இல்லை, இல்லை” என்பதும்
  rationale: மூலத்தில் உள்ள இரு சொற்களின் மீளுரையையும் எதிர்மறை இணைப்பையும் அப்படியே காக்கிறது.
theological_decisions:
- issue: κατὰ σάρκα என்பதில் σάρξ சொல்லின் மொழிபெயர்ப்பு
  choice: மாம்சத்தின்படி
  alternative: வெறும் மனித அளவுகோல்களின்படி / உலகப்போக்கின்படி
  rationale: இங்கு உருவகப் பொருள் இருந்தாலும், பவுலின் சொற்பயன்பாட்டிலுள்ள திட்டமிட்ட தெளிவின்மையையும் இறையியல் செறிவையும் காக்க முதன்மை உரையில் ‘மாம்சம்’ நிலைநிறுத்தப்படுகிறது; சாத்தியமான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: “ஆம், ஆம்” மற்றும் “இல்லை, இல்லை” ஆகியவற்றின் உறவு
  choice: இரண்டும் என்னிடத்தில் ஒன்றாக இருப்பதாகக் கேட்கும் வடிவம்
  alternative: நான் ஒரே நேரத்தில் ‘ஆம்’ என்றும் ‘இல்லை’ என்றும் சொல்வதாக விளக்குதல்
  rationale: மூலத்தின் சுருக்கமான, சற்றே தெளிவற்ற சொல்லமைப்பை முதன்மை உரையில் காத்து, இரட்டைநிலைப் பேச்சைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் மட்டும் விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் இயல்பும் கொண்ட கேள்வி நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சத்தின்படி’ என்ற பவுலிய சொற்றொடரும், ‘ஆம், ஆம் / இல்லை, இல்லை’ என்ற மூல மீளுரையும் பாதுகாக்கப்பட்டுள்ளன; கடினமான நுணுக்கங்கள் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
