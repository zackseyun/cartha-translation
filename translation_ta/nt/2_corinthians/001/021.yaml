id: 2CO.1.21
reference: 2 Corinthians 1:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: ta
  text: ஆனால், எங்களை உங்களுடன் மெசியாவில் உறுதியாக நிலைநிறுத்துகிறவரும், எங்களை அபிஷேகம் செய்தவரும் கடவுளே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βεβαιῶν
  choice: உறுதியாக நிலைநிறுத்துகிறவர்
  rationale: ஒருவரை உறுதியானவராக அல்லது நிலையானவராக ஆக்குதல் என்ற பொருளையும், நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σὺν ὑμῖν
  choice: உங்களுடன் சேர்த்து
  rationale: பவுலையும் அவருடைய உடன் பணியாளர்களையும் கொரிந்திய விசுவாசிகளோடு இணைக்கும் பகிர்ந்த பங்கேற்பைத் தெளிவாகக் காட்டுகிறது; ‘எங்களை’ மற்றும் ‘உங்களை’ ஒன்றாக்காமல், கிரேக்கத்தின் இலக்கண உறவைப் பாதுகாக்கிறது.
- source_word: εἰς Χριστόν
  choice: மெசியாவில்
  rationale: εἰς என்பதன் அடிப்படை திசைநோக்கிய நிழலைத் தமிழில் இயல்பற்ற முறையில் திணிக்காமல், இங்கு காணப்படும் மெசியாவுடனான உறவு அல்லது அவருக்குள் இணைக்கப்பட்ட நிலையை வெளிப்படுத்துகிறது. மாற்று பாரம்பரிய சொல்லாக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: χρίσας
  choice: அபிஷேகம் செய்தவர்
  rationale: χρίω என்பதன் ‘அபிஷேகம் செய்தல்’ என்ற நேரடி பொருளையும், மெசியா/அபிஷேக மொழியுடனான சொல் தொடர்பையும் பாதுகாக்கிறது; குறிப்பிட்ட ஒரு சடங்கை மட்டும் குறிக்குமாறு சுருக்கவில்லை.
- source_word: θεός
  choice: கடவுளே
  rationale: கிரேக்கத்தில் இறுதியில் வந்து வலியுறுத்தப்படும் θεός என்பதைக் தமிழின் ஏகார வலியுறுத்தலுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Χριστόν
  choice: மெசியா
  rationale: Χριστός இங்கு பட்டமாக இருப்பதால், அதன் எபிரேயப் பின்னணியையும் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப் பொருளையும் காக்க ‘மெசியா’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: εἰς Χριστόν என்பதன் பொருள் வலிமை
  choice: உறவு/இணைப்பு சார்ந்த பொருளில் ‘மெசியாவில்’
  alternative: மேலும் சொற்சொல்லான ‘மெசியாவுக்குள்’; பாரம்பரியமான ‘கிறிஸ்துவில்’
  rationale: εἰς என்பதன் திசைநோக்கிய வலிமையை ‘மெசியாவுக்குள்’ காட்டக்கூடும்; ஆனால் இப்பவுலியச் சூழலில் மெசியாவுடனான உறுதி செய்யப்பட்ட உறவு அல்லது அவருக்குள் இணைப்பு முதன்மையாகத் தெரிகிறது. ‘மெசியாவில்’ இதை வாசிக்கத்தக்க தமிழில் தருகிறது; பட்டத்திற்கான மாற்றுச் சொல்லாக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் இரு பங்கேற்புவினைகளும் ஒரே செய்பவராகிய கடவுளைக் குறிக்கும் அமைப்பு காக்கப்பட்டுள்ளது; ‘கடவுளே’ இறுதி வலியுறுத்தலை வெளிப்படுத்துகிறது.
