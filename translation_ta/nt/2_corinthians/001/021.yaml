    issue: Word order and phrasing of σὺν ὑμῖν
    rationale: “உங்களுடன் சேர்த்து எங்களையும்” can sound as though “us also” are being appended to an unstated group. Reordering to “எங்களை உங்களுடன்” is more idiomatic and keeps the Greek relation clear.
  revised_text: ஆனால், எங்களை உங்களுடன் மெசியாவில் உறுதியாக நிலைநிறுத்துகிறவரும், எங்களை அபிஷேகம் செய்தவரும் கடவுளே.
