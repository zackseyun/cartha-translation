source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: ta
  text: சகோதரர்களே,[a] ஆசியாவில்[b] எங்களுக்கு ஏற்பட்ட உபத்திரவத்தை நீங்கள் அறியாதிருக்க நாங்கள் விரும்பவில்லை. அளவுக்கதிகமாக, எங்கள் வலிமைக்கு மிஞ்சி நாங்கள் பாரத்தால் அழுத்தப்பட்டோம்; அதனால் வாழ்வதற்கான நம்பிக்கையைக்கூட இழந்துவிட்டோம்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பது ஆண்பால் பன்மையான ἀδελφοί என்பதன் மொழிபெயர்ப்பு; இச்சூழலில் பவுல் விசுவாசக் குழுவிலுள்ள ஆண்களையும் பெண்களையும் உள்ளடக்கி அழைத்திருக்கலாம்.
    reason: cultural_note
  - marker: b
    text: “ஆசியா” என்பது இன்றைய ஆசியக் கண்டத்தைக் குறிக்காமல், ஆசியா மைனரின் மேற்குப் பகுதியில் இருந்த ரோம மாகாணத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “வாழ்வது குறித்தும் நாங்கள் முற்றிலும் நம்பிக்கையிழந்தோம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλομεν ... ἀγνοεῖν
  choice: நீங்கள் அறியாதிருக்க நாங்கள் விரும்பவில்லை
  rationale: கிரேக்கத்தின் விருப்பத்தையும் அறியாமையையும் குறிக்கும் அமைப்பை இயல்பான நவீனத் தமிழில் எதிர்மறை வடிவத்துடன் பாதுகாக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை அழைப்பைத் தக்கவைக்கிறது; முழு விசுவாசக் குழுவையும் உள்ளடக்கும் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν
  choice: எங்களுக்கு ஏற்பட்ட உபத்திரவத்தை
  rationale: θλῖψις குறிக்கும் கடும் நெருக்கடியையும் துன்பத்தையும் dignified biblical Tamil-இல் தெரிவிக்கிறது.
- source_word: τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: ஆசியாவில் எங்களுக்கு ஏற்பட்ட
  rationale: இடத்தையும் நிகழ்ந்த துன்பத்தையும் தமிழில் இயல்பான தொடர்புச் சொற்றொடராக வழங்குகிறது.
- source_word: καθ’ ὑπερβολὴν
  choice: அளவுக்கதிகமாக
  rationale: சாதாரண அளவைக் கடக்கும் தீவிரத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὑπὲρ δύναμιν
  choice: எங்கள் வலிமைக்கு மிஞ்சி
  rationale: δύναμις இங்கு தாங்கும் திறன் அல்லது சக்தியைக் குறிக்கிறது; அந்த எல்லை மீறப்பட்டதை நேரடியாகக் காட்டுகிறது.
- source_word: ἐβαρήθημεν
  choice: நாங்கள் பாரஞ்சுமத்தப்பட்டோம்
  rationale: செயப்பாட்டு வடிவத்தையும் பாரத்தால் அழுத்தப்படுதல் என்ற மூல உருவகத்தையும் காக்கிறது.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: அதனால் உயிர்வாழ்வோம் என்ற நம்பிக்கையையே இழந்துவிட்டோம்
  rationale: ὥστε காட்டும் விளைவையும், வாழ்வைப் பற்றியே முற்றிலும் நம்பிக்கையற்ற நிலைக்குச் சென்ற தீவிரத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀδελφοί என்ற அழைப்பின் பாலின வடிவமும் உள்ளடக்கும் பரப்பும்
  choice: முதன்மை உரையில் “சகோதரர்களே”
  alternative: “சகோதர சகோதரிகளே”
  rationale: கிரேக்கச் சொல்லின் இலக்கண ஆண்பால் பன்மையை முதன்மை உரையில் காக்கிறது; கலந்த விசுவாசக் குழுவை உள்ளடக்கியிருக்கக்கூடிய சூழல்சார் பொருளை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: καὶ τοῦ ζῆν என்பதன் தொடர்பு
  choice: உயிர்வாழ்வோம் என்ற நம்பிக்கையையே இழந்துவிட்டோம்
  alternative: வாழ்வது குறித்தும் முற்றிலும் வழியறியாது போனோம்
  rationale: ἐξαπορέομαι என்பதன் நம்பிக்கையிழக்கும் தீவிரத்தையும் ‘வாழ்தல்’ என்பதன் எல்லையையும் தெளிவாக வழங்குகிறது; மாற்று வடிவம் ‘முற்றிலும் வழியறியாமை’ என்ற சொற்பொருள் நிழலை அதிகம் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், பவுலின் உரையின் கனத்தையும் பாரம் என்ற உருவகத்தையும் காக்கும் வகையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. வசனத்துக்கு இல்லாத சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
