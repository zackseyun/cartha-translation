source:
  edition: SBLGNT
  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: ta
  text: நீங்களும் உங்கள் வேண்டுதலால் எங்களுக்காக இணைந்து உதவி செய்யும்போது, எங்களுக்குக் கிடைத்த அருள்கொடைக்காக[a] பலரிடமிருந்து[b] பலர் வழியாக எங்கள் நிமித்தமாக நன்றி செலுத்தப்படும்படி இது நிகழ்கிறது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அருள்கொடை” என்பதை “ஆசீர்வாதம்” அல்லது “எங்களுக்குக் காட்டப்பட்ட அருள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “பல முகங்களிலிருந்து.” இங்கு “முகங்கள்” என்பது மனிதர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “பலரிடமிருந்து” மற்றும் “பலர் வழியாக” என்ற இரு தொடர்களின் தொடர்பு கிரேக்கத்தில் சிக்கலானது. இதை, “எங்களுக்குக் கிடைத்த அருள்கொடைக்காக, பலர் மூலம் எங்கள் நிமித்தமாக பலரால் நன்றி செலுத்தப்படும்படி” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: συνυπουργούντων
  choice: எங்களோடு சேர்ந்து உதவுகிறீர்கள்
  rationale: συν- என்பதன் கூட்டுப்பங்கேற்பையும் ὑπουργέω என்பதன் உதவி புரியும் கருத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῇ δεήσει
  choice: வேண்டுதல் செய்வதன் மூலம்
  rationale: δέησις பொதுவான ஜெபத்தைவிட குறிப்பாக உருக்கமான விண்ணப்பம் அல்லது வேண்டுதலைக் குறிக்கிறது; தத்தி வேற்றுமையின் கருவிப்பொருளையும் ‘மூலம்’ காட்டுகிறது.
- source_word: ἵνα
  choice: இவ்வாறு
  rationale: முன்னுள்ள வேண்டுதல் சார்ந்த உதவிக்கும் பின்னுள்ள நன்றிசெலுத்தலுக்கும் இடையிலான நோக்கம்/விளைவு உறவை தமிழில் இயல்பாக இணைக்கிறது.
- source_word: ἐκ πολλῶν προσώπων
  choice: பலரால்
  rationale: சொல்லர்த்தமாக ‘பல முகங்களிலிருந்து’; இங்கு πρόσωπα மனிதர்களைக் குறிக்கும் மொழிவழக்காக இருப்பதால் ‘பலரால்’ எனத் தரப்பட்டது.
- source_word: τὸ εἰς ἡμᾶς χάρισμα
  choice: எங்களுக்குக் கிடைத்த அருள்கொடை
  rationale: χάρισμα என்பது அருளால் வழங்கப்பட்ட கொடை/நன்மை என்ற கருத்தைக் கொண்டது. εἰς ἡμᾶς அதன் பயனாளிகள் ‘நாங்கள்’ என்பதைச் சுட்டுகிறது.
- source_word: διὰ πολλῶν
  choice: முதன்மை உரையில் தனியாக வெளிப்படுத்தப்படவில்லை
  rationale: இந்தச் சொற்றொடரின் தொடர்பும் பொருளும் சிக்கலானவை; ‘பலர் மூலமாக’ எனத் தனியே சேர்த்தால் ἐκ πολλῶν προσώπων உடன் இயல்பற்ற இரட்டிப்பு உண்டாகும். சாத்தியமான முழுமையான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: εὐχαριστηθῇ
  choice: நன்றி செலுத்தப்படும்
  rationale: செயப்பாட்டு வினையின் நன்றிசெலுத்தும் நிகழ்வை இயல்பான தமிழில் காக்கிறது.
- source_word: ὑπὲρ ἡμῶν
  choice: எங்கள் சார்பாக
  rationale: இங்கு ὑπέρ நாங்கள் தொடர்பாக அல்லது எங்கள் நிமித்தம் நடைபெறும் நன்றிசெலுத்தலைக் குறிக்கிறது.
theological_decisions:
- issue: χάρισμα இங்கு குறிப்பாக எதைக் குறிக்கிறது
  choice: அருள்கொடை என்ற பொதுவான சொல்லை வைத்தல்
  alternative: தேவன் அளித்த விடுதலை அல்லது ஆசீர்வாதம் என்று விளக்கமாக்குதல்
  rationale: சூழல் பவுலுக்குக் கிடைத்த இரக்கமுள்ள விடுதலையை நினைவூட்டினாலும், வசனம் தானே அதைக் குறிப்பாகப் பெயரிடவில்லை. ஆகவே மூலத்தின் பரந்த அர்த்தமும் இறையியல் திறந்தநிலையும் காக்கப்பட்டன.
- issue: ἐκ πολλῶν προσώπων ... διὰ πολλῶν என்ற இரு ‘பலர்’ சொற்றொடர்களின் தொடர்பு
  choice: முதன்மை உரையில் ‘பலரால்’ என்று தெளிவாகத் தருதல்; மாற்று அமைப்பை அடிக்குறிப்பில் காத்தல்
  alternative: ‘பலர் மூலமாக, பலரிடமிருந்து’ என்ற இரட்டிப்பை நேரடியாகத் தருதல்
  rationale: கிரேக்கத் தொடரின் உண்மையான இலக்கணச் சிக்கலை மறைக்காமல், வாசிக்கத்தக்க தமிழையும் மாற்று புரிதலையும் இரண்டையும் பாதுகாக்கிறது.
translation_notes:
  register: மரியாதையும் தெளிவும் கொண்ட நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபம்’ என்பதற்குப் பதிலாக δέησις-இன் விண்ணப்பத் தன்மையை வெளிப்படுத்த ‘வேண்டுதல்’ தேர்ந்தெடுக்கப்பட்டது. கிரேக்கத்தின் நீண்ட வாக்கிய அமைப்பு தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கருத்துத் தொடர்பு ‘இவ்வாறு’ மூலம் காக்கப்படுகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
