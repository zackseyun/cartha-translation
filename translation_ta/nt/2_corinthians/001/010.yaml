id: 2CO.1.10
reference: 2 Corinthians 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: ta
  text: இவ்வளவு பெரும் மரணத்திலிருந்து[a] அவர் எங்களை மீட்டார்; மீட்பார். அவர் இனியும் மீட்பார் என்று அவர்மீது நாங்கள் நம்பிக்கை வைத்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இவ்வளவு கொடிய உயிராபத்திலிருந்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τηλικούτου
  choice: இவ்வளவு பெரும்
  rationale: இந்தச் சுட்டுப் பெயரடை ஆபத்தின் மிகுதியை வலியுறுத்துகிறது. ‘இவ்வளவு பெரும்’ என்பது அந்த வலியுறுத்தலை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: θανάτου
  choice: மரணத்திலிருந்து
  rationale: மூலச்சொல்லின் நேரடிப் பொருள் ‘மரணம்.’ இங்கு அது உயிராபத்தைக் குறிக்கக்கூடும் என்றாலும், மூல உருவகத்தை முதன்மை உரையில் தக்கவைத்து, இயல்புப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐρρύσατο
  choice: மீட்டார்
  rationale: ஆபத்திலிருந்து விடுவித்தலைக் குறிக்கும் வினை. ‘மீட்டார்’ என்பது நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: ῥύσεται
  choice: மீட்பார்
  rationale: அதே கிரேக்க வினையின் எதிர்கால வடிவம் என்பதால் ‘மீட்பார்’ என்று மொழிபெயர்ப்பது சொல் ஒற்றுமையையும் எதிர்காலப் பொருளையும் காக்கிறது.
- source_word: εἰς ὃν
  choice: அவர்மீது
  rationale: இக்கட்டமைப்பில் முன்னிடைச்சொல் நம்பிக்கையின் இலக்கைச் சுட்டுகிறது. ‘அவர்மீது’ என்பது தனிப்பட்ட நம்பிக்கையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἠλπίκαμεν
  choice: நாங்கள் நம்பிக்கை வைத்திருக்கிறோம்
  rationale: நிறைவுக்கால வடிவம் கடந்த காலத்தில் நிலைநிறுத்தப்பட்டு தொடர்ந்து இருக்கும் நம்பிக்கையைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் அந்தத் தொடர்நிலையை வெளிப்படுத்துகிறது.
- source_word: καὶ ἔτι
  choice: மீண்டும்
  rationale: முன்னர் நிகழ்ந்த மீட்பைத் தொடர்ந்து வரவிருக்கும் மேலும் ஒரு மீட்பை இச்சொல் இணைவு சுட்டுகிறது. ‘மீண்டும்’ என்பது சூழலில் அந்தத் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘மரணம்’ என்பதை நேரடியாக வைத்திருக்க வேண்டுமா, ‘உயிராபத்து’ என்று பொருள்வழி மொழிபெயர்க்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘மரணம்’ என்பதைத் தக்கவைத்தல்
  alternative: ‘இவ்வளவு கொடிய உயிராபத்திலிருந்து’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை வெளிப்படையாக ‘மரணம்’ என்கிறது. பவுலின் தீவிரமான சொற்படிமத்தைத் தக்கவைக்க இது முதன்மை உரையில் வைக்கப்படுகிறது; சாத்தியமான இயல்புப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘மீட்டார்/மீட்பார்’ என்ற சொல் ஒற்றுமை மூலத்தின் ஒரே வினைச்சொல் தொடரைத் தக்கவைக்கிறது; வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்க மறுவரிசைப்படுத்தப்பட்டுள்ளது.
