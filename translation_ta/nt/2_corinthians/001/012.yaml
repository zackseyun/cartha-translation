reference: 2 Corinthians 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: ta
  text: 'நாங்கள் பெருமைப்படுவதற்கான காரணம் இதுவே: நாங்கள் மாம்சத்துக்குரிய ஞானத்தின்படி[c] அல்ல, கடவுளின் அருளால், பரிசுத்தத்தோடும்[a] கடவுளிடமிருந்து வரும் கபடமற்ற தன்மையோடும்[b] உலகத்தில் நடந்துகொண்டோம்; குறிப்பாக உங்களிடம் அப்படியே நடந்துகொண்டோம் என்று எங்கள் மனச்சாட்சி சான்றளிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “பரிசுத்தம்” என்பதற்குப் பதிலாக “எளிமை” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “கடவுளுக்குரிய கபடமற்ற தன்மையோடு.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மனித ஞானத்தின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: பெருமைப்படுவதற்கான காரணம்
  rationale: பவுலின் நேர்மறையான நம்பிக்கையையும் அதற்கான அடிப்படையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் தற்பெருமை என்ற எதிர்மறைப் பொருளைத் தவிர்க்கிறது.
- source_word: μαρτύριον τῆς συνειδήσεως ἡμῶν
  choice: எங்கள் மனச்சாட்சி சான்றளிக்கிறது
  rationale: உள்ளார்ந்த அறநெறிச் சாட்சி என்ற கருத்தைத் தெளிவான நவீன தமிழில் வினை வடிவில் அளிக்கிறது.
- source_word: ἁγιότητι
  choice: பரிசுத்தத்தோடு
  rationale: SBLGNT மூலப்பாடத்தின் அறநெறி மற்றும் இறைசார்ந்த வலிமையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து வரும் கபடமற்ற நேர்மையோடு
  rationale: εἰλικρίνεια என்பதன் மாசற்ற, கபடமற்ற உண்மைத்தன்மையையும், τοῦ θεοῦ என்பதை மூலத்தைக் குறிக்கும் உறவாகவும் தெளிவாக வெளிப்படுத்துகிறது; வேறு இலக்கண வாய்ப்பை அடிக்குறிப்பில் வைத்திருக்கிறது.
- source_word: σοφίᾳ σαρκικῇ
  choice: மாம்சத்துக்குரிய ஞானத்தின்படி
  rationale: σαρκ- சொற்குடும்பத்தை தமிழில் காணக்கூடியவாறு பாதுகாத்து, கடவுளின் அருளுக்கு எதிராக நிறுத்தப்பட்ட மனித இயல்பை வெளிப்படுத்துகிறது.
- source_word: χάριτι θεοῦ
  choice: கடவுளின் அருளின்படி
  rationale: பவுலின் χάρις கருத்தின் இறையியல் எடையைப் பாதுகாக்கும் இயல்பான தமிழ்.
- source_word: ἀνεστράφημεν
  choice: நடந்துகொண்டோம்
  rationale: இங்கு குறிக்கப்படும் வாழ்க்கை முறை மற்றும் நடத்தையை சாதாரண வாசகருக்குப் புரியும் மதிப்புமிக்க நடையில் தருகிறது.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: குறிப்பாக உங்களிடம் அப்படி நடந்துகொண்டோம்
  rationale: περισσοτέρως என்பதன் வலியுறுத்தலையும் πρὸς ὑμᾶς என்பதன் உறவுசார் நோக்கையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: εἰλικρινείᾳ τοῦ θεοῦ என்பதில் τοῦ θεοῦ-வின் பொருள்
  choice: மூலம் எனக் கொண்டு, “கடவுளிடமிருந்து வரும் கபடமற்ற நேர்மை” என்று மொழிபெயர்க்கப்பட்டது.
  alternative: “கடவுளுக்குரிய கபடமற்ற நேர்மை” அல்லது “இறைசார்ந்த கபடமற்ற நேர்மை.”
  rationale: இச்சூழலில் நேர்மை கடவுளிடமிருந்து வருவது என்பது பொருத்தமாக இருந்தாலும், உடைமை அல்லது பண்புத்தன்மையைக் குறிக்கும் வாய்ப்பை முற்றிலும் நீக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: σοφίᾳ σαρκικῇ என்பதன் இறையியல் வலிமை
  choice: “மாம்சத்துக்குரிய ஞானம்” என்று மூல உருவகத்தைப் பாதுகாத்தது.
  alternative: “மனித ஞானம்.”
  rationale: “மனித ஞானம்” எளிதானது என்றாலும், பவுலின் σάρξ சொற்குடும்பத்திலுள்ள அறநெறி மற்றும் இறையியல் முரண்பாட்டை பலவீனப்படுத்தக்கூடும்.
translation_notes:
  register: நவீன தரநிலைத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. வாக்கியத்தின் நீளம் வாசிப்புக்கு ஏற்றவாறு மறுசீரமைக்கப்பட்டாலும், காரணவுரை, மனச்சாட்சியின் சாட்சி, எதிர்மறை–நேர்மறை முரண்பாடு, உலகளாவிய நடத்தை மற்றும் கொரிந்தியரிடத்திலான சிறப்பு வலியுறுத்தல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. “மாம்சம்,” “அருள்,” “பரிசுத்தம்” போன்ற பவுலின் முக்கிய இறையியல் சொற்கள் மறைக்கப்படவில்லை.
