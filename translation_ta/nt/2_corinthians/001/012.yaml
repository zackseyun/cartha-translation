  to: 'நாங்கள் பெருமைப்படுவதற்கான காரணம் இதுவே: நாங்கள் மாம்சத்துக்குரிய ஞானத்தின்படி[c] அல்ல, கடவுளின் அருளால், பரிசுத்தத்தோடும்[a] கடவுளிடமிருந்து வரும் கபடமற்ற தன்மையோடும்[b] உலகத்தில் நடந்துகொண்டோம்; குறிப்பாக உங்களிடம் அப்படியே நடந்துகொண்டோம் என்று எங்கள் மனச்சாட்சி சான்றளிக்கிறது.'
  rationale: The revision preserves the source’s syntax and contrasts while improving Tamil idiom. It makes the ‘grace of God’ phrase closer to the Greek’s parallel ἐν-construction, uses a more idiomatic equivalent for εἰλικρίνεια, and corrects the variant footnote to reflect ἁπλότης accurately. The genitive ambiguity in εἰλικρινείᾳ τοῦ θεοῦ remains appropriately represented by the main rendering and alternative footnote.
