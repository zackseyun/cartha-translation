    text: அல்லது, ‘ஆவியின் வைப்புத்தொகையை’ அல்லது ‘ஆவியின் உத்தரவாதத்தை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφραγισάμενος
  choice: நம்மீது முத்திரையைப் பதித்ததோடு
  rationale: முத்திரையிடுதல் என்ற உருவகத்தை இயல்பான நவீன தமிழில் காத்து, உரிமை, உறுதிப்படுத்துதல், பாதுகாப்பு ஆகிய சாத்தியமான நுண்பொருள்களில் ஒன்றை மட்டும் தீர்மானமாக்காமல் விடுகிறது.
- source_word: δοὺς
  choice: கொடுத்தார்
  rationale: δίδωμι என்பதன் இறந்தகாலப் பங்கேற்புவினையை, இணையான இரண்டு செயல்களையும் இயல்பான தமிழில் கூறும் வகையில் முற்றுவினையாக மொழிபெயர்க்கிறது.
- source_word: ἀρραβῶνα
  choice: முன்பணம்
  rationale: பின்னர் முழுமையாகக் கொடுக்கப்படவிருப்பதற்கு உத்தரவாதமாக இப்போது கொடுக்கப்படும் முதல் தொகை என்ற வணிக உருவகத்தைத் தெளிவாகவும் சுருக்கமாகவும் காக்கிறது.
- source_word: τοῦ πνεύματος
  choice: ஆவியின்
  rationale: கிரேக்க உரையின் சுருக்கமான உடைமை வேற்றுமை அமைப்பைக் காத்து, முன்பணம் ஆவியானவரே என்பதையோ ஆவியிடமிருந்து வருவது என்பதையோ முதன்மை உரையில் விளக்கித் தீர்மானிக்கவில்லை.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: நம் இதயங்களில்
  rationale: ἐν என்பதன் இடப்பொருளையும், உள்ளார்ந்த தனிப்பட்ட தளத்தைக் குறிக்கும் இதயம் என்ற உருவகத்தையும் நேரடியாகக் காக்கிறது.
- source_word: ὁ καὶ ... καὶ
  choice: அவரே ... பதித்ததோடு ... கொடுத்தார்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கடவுளைச் சுட்டும் தொடர்ச்சியை ‘அவரே’ என்பதாலும், இரு இணைச் செயல்களை ‘-தோடு’ மற்றும் ‘-யும்’ என்பவற்றாலும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆவி ἀρραβών எனப்படுவதன் பொருள்
  choice: ‘ஆவியின் முன்பணம்’ என்று வணிக உருவகத்துடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆவியின் உத்தரவாதம்’ அல்லது ‘ஆவியின் வைப்புத்தொகை’
  rationale: ‘உத்தரவாதம்’ பொருளை விளக்கினாலும் மூலத்தின் தெளிவான வணிகப் படிமத்தை மங்கச் செய்கிறது. ‘முன்பணம்’ இப்போது வழங்கப்பட்ட ஒன்று பின்னர் வரவிருக்கும் நிறைவை உறுதிப்படுத்துகிறது என்ற உருவகத்தைக் காக்கிறது.
- issue: τοῦ πνεύματος என்ற உடைமை வேற்றுமையின் தொடர்பு
  choice: ‘ஆவியின்’ என்ற சுருக்கமான அமைப்பு காக்கப்பட்டது.
  alternative: ‘ஆவியானவரையே முன்பணமாக’ அல்லது ‘ஆவி அளிக்கும் முன்பணத்தை’
  rationale: மூலத்தில் உள்ள தொடர்பின் சுருக்கத்தையும் உண்மையான பொருள் விரிவையும் காக்க, ஆவியானவர் முன்பணத்தின் உள்ளடக்கமா அல்லது மூலமா என்பதை முதன்மை உரையில் வெளிப்படையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பாரம்பரியமான ஆனால் இன்றைய வாசகர்களுக்கு குறைவாகத் தெளிவாக இருக்கக்கூடிய ‘அச்சாரம்’ என்பதற்குப் பதிலாக, மூலத்தின் வணிக உருவகத்தை வெளிப்படையாகக் காட்டும் ‘முன்பணம்’ பயன்படுத்தப்பட்டுள்ளது.
