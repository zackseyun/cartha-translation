translation:
  language: ta
  text: நம்மேல் தம் முத்திரையிட்டு, நம் இதயங்களில் ஆவியின் முன்பணத்தையும் கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
