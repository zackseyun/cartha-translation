source:
  edition: SBLGNT
  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: ta
  text: நீங்கள் எங்களை ஓரளவு புரிந்துகொண்டதுபோலவே[a], அதாவது, நம்முடைய ஆண்டவர் இயேசுவின் நாளில் நாங்கள் உங்களுக்குப் பெருமையாக இருக்கிறோம்; அதுபோலவே நீங்களும் எங்களுக்குப் பெருமையாக இருப்பீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பகுதியளவு” அல்லது “ஒரு குறிப்பிட்ட அளவுக்கு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாங்கள் பெருமைப்படுவதற்கான காரணமாக இருப்பீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: புரிந்துகொண்டீர்கள்
  rationale: கொரிந்தியர்கள் பவுலையும் அவருடன் இருந்தவர்களையும் உண்மையாக அறிந்து புரிந்துகொண்டதை இது தெரிவிக்கிறது; முழுமையாகப் புரிந்துகொண்டார்கள் என்று மிகைப்படுத்தவில்லை.
- source_word: ἀπὸ μέρους
  choice: ஓரளவே
  rationale: அவர்களுடைய புரிதல் பகுதியளவானது அல்லது முழுமையற்றது என்பதைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: καύχημα
  choice: பெருமை
  rationale: ஒருவரைக் குறித்து மகிழ்ச்சியோடு பெருமைப்படுவதற்கான ஆதாரம் என்ற பவுலின் பரஸ்பர மொழிநடையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: καθάπερ
  choice: இருப்பதுபோல்
  rationale: பவுலின் குழுவுக்கும் கொரிந்தியர்களுக்கும் இடையிலான வெளிப்படையான பரஸ்பர ஒப்பீட்டைத் தக்கவைக்கிறது.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: நம்முடைய ஆண்டவர் இயேசுவின் நாளில்
  rationale: நிறைவுக்காலத்தைச் சுட்டும் நிலைபெற்ற சொற்றொடரையும் கிரேக்க உரையின் உரிமைத் தொடர்பையும் காக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இச்சூழலில் இயேசுவுக்குரிய கிறிஸ்துவியல் பட்டத்திற்குப் பொருத்தமான, நிலைபெற்ற தமிழ் மொழிபெயர்ப்பு.
- source_word: καθὼς καὶ
  choice: நீங்கள் ... போல
  rationale: முந்தைய கருத்துடன் இணைக்கும் ஒப்பீட்டையும் καί தரும் சேர்க்கைப் பொருளையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் பரஸ்பர καύχημα மொழிநடை
  choice: நாங்கள் உங்களுக்குப் பெருமையாக இருப்பதுபோல் ... நீங்களும் எங்களுக்குப் பெருமையாக இருப்பீர்கள்
  alternative: நாங்கள் நீங்கள் பெருமைப்படுவதற்கான காரணமாக இருப்பதுபோல் ... நீங்களும் நாங்கள் பெருமைப்படுவதற்கான காரணமாக இருப்பீர்கள்
  rationale: அப்போஸ்தலரும் திருச்சபையும் ஆண்டவரின் நாளில் ஒருவரைக் குறித்து ஒருவர் பெருமைப்படும் பரஸ்பர உறவை இது தெரிவிக்கிறது. ‘பெருமை’ என்பது தன்னல உயர்வாக விளக்காமல், மூலத்தின் சுருக்கத்தையும் இறையியல் இழுவிசையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட ஒப்பீட்டு அமைப்பு தமிழில் தெளிவாக இருக்க, எதிர்கால நிறைவைச் சுட்டும் பிரதான வினை இறுதியில் வெளிப்படையாக வழங்கப்பட்டுள்ளது; ‘பெருமை’ என்ற சொல் பரஸ்பர உறவின் நேர்மறையான பவுலிய நயத்தைத் தக்கவைக்கிறது.
