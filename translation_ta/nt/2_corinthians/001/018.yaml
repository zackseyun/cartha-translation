base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: ta
  text: கடவுள் உண்மையுள்ளவர் என்பதில் எவ்வளவு உறுதி இருக்கிறதோ, அவ்வளவு உறுதியாக, உங்களுக்கான எங்கள் செய்தி “ஆம்” என்றும் “இல்லை” என்றும் அல்ல.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மேலும் சொற்சொல்லாக: “ஆனால் கடவுள் உண்மையுள்ளவர்; உங்களுக்கான எங்கள் வார்த்தை ‘ஆம்’ என்றும் ‘இல்லை’ என்றும் அல்ல.” “செய்தி” என்பதை “வார்த்தை” அல்லது “பேச்சு” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: உண்மையுள்ளவர்
  rationale: கடவுளின் நம்பகத்தன்மையையும் மாறாத உறுதியையும் இயல்பான, மரியாதையான தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: தனி எதிரிடைச் சொல்லாக மொழிபெயர்க்காமல் உறுதிமொழிக் கட்டமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: இங்கு δέ வெறும் ‘ஆனால்’ என்ற எதிரிடையை விட, πιστὸς ὁ θεός என்பதுடன் சேர்ந்த உறுதியான வலியுறுத்தலின் பகுதியாகச் செயல்படுகிறது.
- source_word: ὅτι
  choice: என்பது எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாக
  rationale: ὅτι இணைக்கும் உறுதிமொழிச் சார்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; காரணம் அல்லது உள்ளடக்கம் என்ற ஒரே பொருளை வற்புறுத்தவில்லை.
- source_word: ὁ λόγος ἡμῶν ὁ πρὸς ὑμᾶς
  choice: உங்களிடம் நாங்கள் சொன்ன செய்தி
  rationale: λόγος என்பதன் தொடர்பாடல் பொருளை ‘செய்தி’ தெளிவாகக் காட்டுகிறது; πρὸς ὑμᾶς என்பதையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: οὐκ ἔστιν
  choice: இருவிதமானதல்ல
  rationale: கிரேக்க நிகழ்கால மறுப்பையும், தொடர்ந்து நிலைக்கும் கூற்றையும் தமிழில் இயல்பாகத் தருகிறது.
- source_word: Ναὶ καὶ Οὔ
  choice: “ஆம், இல்லை” என்று
  rationale: பவுலின் கூர்மையான இரட்டைக் கூற்றை மேற்கோள் வடிவில் காக்கிறது; முரண்பாடு அல்லது நிலையின்மையை சூழல் உணர்த்த அனுமதிக்கிறது.
theological_decisions:
- issue: πιστὸς δὲ ὁ θεὸς ὅτι என்ற உறுதிமொழிக் கட்டமைப்பு
  choice: கடவுள் உண்மையுள்ளவர் என்பது எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாக
  alternative: ஆனால் கடவுள் உண்மையுள்ளவர்; உங்களிடம் நாங்கள் சொன்ன வார்த்தை ‘ஆம், இல்லை’ என்பதாக இல்லை
  rationale: கடவுளின் உண்மைத்தன்மையை பவுலின் கூற்றுக்கான ஆணைபோன்ற உறுதியான அடிப்படையாக வெளிப்படுத்துகிறது; அதேவேளை awkward-ஆன சொற்சொல் அமைப்பைத் தவிர்க்கிறது.
- issue: “ஆம், இல்லை” என்பதன் விளக்கம்
  choice: விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் அப்படியே வைத்தல்
  alternative: முரண்பாடானது அல்ல / நிலையற்றது அல்ல
  rationale: மூலத்தின் சுருக்கமான இறையியல் மற்றும் சொற்பொழிவுத் திணிப்பை காக்கிறது; அதன் பொருளை ஒரே விளக்கத்துக்குள் அடைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்கு தெளிவாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. உறுதிமொழிக் கட்டமைப்பு தமிழில் இயல்பாக விரிக்கப்பட்டுள்ளது; மூலத்தின் ‘ஆம், இல்லை’ என்ற நோக்கமுள்ள இருமை பாதுகாக்கப்பட்டுள்ளது.
