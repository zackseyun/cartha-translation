source:
  edition: SBLGNT
  text: ἔπεμψα δὲ τοὺς ἀδελφούς, ἵνα μὴ τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν κενωθῇ ἐν τῷ μέρει τούτῳ, ἵνα καθὼς ἔλεγον παρεσκευασμένοι ἦτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: ta
  text: ஆனால், இந்த விஷயத்தில்[b] உங்களைக் குறித்து நாங்கள் பெருமையாகப் பேசியது வெறுமையாகிவிடாதபடியும்[a], நான் சொல்லிவந்தபடியே நீங்கள் ஆயத்தமாக இருக்கும்படியும், அந்தச் சகோதரர்களை அனுப்பினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொய்த்துப்போகாதபடி” அல்லது “பயனற்றதாகிவிடாதபடி.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்த வகையில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψα
  choice: அனுப்பினேன்
  rationale: இறந்தகாலத்தில் நிறைவேறிய செயலைக் குறிக்கும் கிரேக்க இறந்தகால வினையை, இச்சூழலில் இயல்பான தமிழ் எளிய இறந்தகாலமாக மொழிபெயர்க்கிறது.
- source_word: τοὺς ἀδελφούς
  choice: அந்தச் சகோதரர்களை
  rationale: கிரேக்க ஆண்பால் பன்மை, சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட ஆண் பிரதிநிதிகளைக் குறிக்கிறது; சுட்டுப்பொருளையும் தமிழில் இயல்பாகத் தெளிவாக்குகிறது.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: உங்களைக் குறித்து நாங்கள் பெருமையாகப் பேசியது
  rationale: καύχημα என்பது பெருமைப்படுதல் அல்லது பெருமைப்படுவதற்கான அடிப்படையைக் குறிக்கலாம். இங்கு கொரிந்தியரைப் பற்றிப் பவுல் பெருமையாகச் சொல்லிவந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κενωθῇ
  choice: வெறுமையாகிவிடாதபடி
  rationale: செயப்பாட்டு இறந்தகால வாய்ப்பாட்டு வடிவம் தடுக்க வேண்டிய விளைவைச் சுட்டுகிறது. இந்தத் தேர்வு ‘வெறுமையாக்குதல்’ என்ற மூல உருவகத்தைத் தக்கவைக்கிறது.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: இந்த விஷயத்தில்
  rationale: μέρος இங்கு உடல் சார்ந்த ‘பகுதி’ அல்ல; ஒரு குறிப்பிட்ட விஷயம் அல்லது வகையைக் குறிக்கும் மரபுத்தொடர்.
- source_word: καθὼς ἔλεγον
  choice: நான் சொல்லிவந்தபடியே
  rationale: கிரேக்க முற்றுப்பெறா இறந்தகாலம் முன்பு தொடர்ந்து அல்லது மீண்டும் கூறியதைக் காட்டுகிறது; ‘சொல்லிவந்தபடியே’ அந்த நுணுக்கத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: παρεσκευασμένοι ἦτε
  choice: நீங்கள் ஆயத்தமாக இருக்கும்படி
  rationale: சுற்றுவழிப் பூரணகால அமைப்பு ஆயத்தப்படுத்தப்பட்ட நிலையில் இருப்பதை வலியுறுத்துகிறது; நோக்கவாக்கியத்துக்கேற்ற இயல்பான தமிழாக இது அமைகிறது.
