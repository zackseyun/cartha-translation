  rationale: 'The revision corrects the semantic relationship expressed by ἐν τῇ ὑποστάσει ταύτῃ: the prospective shame concerns Paul’s confidence, rather than being caused by it. It also slightly smooths the Tamil while preserving the conditional warning, indefinite Macedonian visitors, emphatic “we,” and parenthetical reference to the Corinthians.'
