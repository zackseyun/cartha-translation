source:
  edition: SBLGNT
  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: ta
  text: ஒருவேளை மக்கெதோனியர்களில் யாராவது என்னுடன் வந்து, நீங்கள் ஆயத்தமில்லாமல் இருப்பதைக் கண்டால், நாங்கள்—உங்களைக் குறிப்பிடவே வேண்டாம்[b]—இந்த நம்பிக்கையின் விஷயத்தில்[a] அவமானப்பட நேரிடுமே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த நம்பிக்கையில்.” இங்குள்ள கிரேக்கச் சொல் சூழலுக்கேற்ப “மேற்கொண்ட பொறுப்பு” அல்லது “நிலைமை” என்றும் பொருள்படலாம்; ஆனால் கொரிந்தியர்களைப் பற்றி பவுல் கொண்டிருந்த நம்பிக்கையையே இங்கு பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களைக் குறிப்பிடவே வேண்டாம்.” கொரிந்தியர்கள் ஆயத்தமில்லாமல் காணப்பட்டால், அவர்களும் அந்த அவமானத்தைப் பகிர்ந்துகொள்வார்கள் என்பதைப் பவுல் இடைச்செருகலாக உணர்த்துகிறார்.
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: ஒருவேளை … கண்டால் … நேரிடுமே
  rationale: எதிர்காலத்தில் நிகழக்கூடிய ஒரு சூழலைப் பற்றிய பவுலின் அச்சத்தையும், ἐάν குறிக்கும் நிபந்தனையையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: மக்கெதோனியர்களில் சிலர் என்னுடன் வந்து
  rationale: குறிப்பிட்ட நபர்களைக் குறிக்காமல், மக்கெதோனியர்களில் யாராவது உடன் வரக்கூடிய சாத்தியத்தை உணர்த்துகிறது.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: நீங்கள் ஆயத்தமில்லாமல் இருப்பதைக் கண்டால்
  rationale: ἀπαρασκευάστους என்பதன் ‘தயாராக இல்லாத’ பொருளை, காணிக்கை ஆயத்தமாக இருக்கவேண்டிய உடனடிச் சூழலில் தெளிவாகச் சொல்கிறது.
- source_word: καταισχυνθῶμεν
  choice: வெட்கத்திற்குள்ளாக நேரிடுமே
  rationale: வினையின் செயப்பாட்டு வடிவத்தையும், பிறர் முன்னிலையில் அவமானமடையும் சமூகப் பொருளையும் காக்கிறது.
- source_word: ἡμεῖς
  choice: நாங்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் அழுத்தமாகவும் வரும் பிரதிப்பெயரை தமிழிலும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: உங்களைப் பற்றிச் சொல்லவே வேண்டாம்
  rationale: கொரிந்தியர்களும் அவமானத்தில் பங்குபெறுவார்கள் என்பதை நேரடியாகக் கடுமையாகச் சொல்லாமல் உணர்த்தும் இடைச்செருகல் தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: நாங்கள் கொண்டிருக்கும் இந்த நம்பிக்கையின் காரணமாக
  rationale: இங்கு ὑπόστασις என்பது தத்துவார்த்தமான ‘சாரம்’ அல்ல; கொரிந்தியர்களின் ஆயத்தத்தைப் பற்றி பவுல் கொண்ட நம்பிக்கை அல்லது அதற்கான அடிப்படையைக் குறிக்கிறது. ‘காரணமாக’ என்பது அவமானம் அந்த நம்பிக்கையோடு தொடர்புடையது என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இத்தொழில்நுட்பமற்ற பவுலின் பயன்பாட்டில் ὑπόστασις என்பதன் பொருள்
  choice: கொரிந்தியர்களைப் பற்றி பவுல் கொண்ட நம்பிக்கை
  alternative: முயற்சி / பொறுப்பேற்ற செயல் / சூழ்நிலை
  rationale: உடனடிச் சூழல், கொரிந்தியர்கள் ஆயத்தமாக இருப்பார்கள் என்ற பவுலின் நம்பிக்கையைப் பற்றியது. ஆகவே ‘நம்பிக்கை’ பொருத்தமானது; அதேவேளையில் சொல்லின் பிற சூழல்சார் சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆயத்தம்,’ ‘வெட்கத்திற்குள்ளாகுதல்,’ ‘நம்பிக்கை’ ஆகியவை மூலத்தின் கருத்து மற்றும் சொல்லாட்சித் தீவிரத்தைப் பாதுகாக்கின்றன; கோடுகளுக்கிடையிலான சொற்றொடர் பவுலின் இடைச்செருகலைக் காட்டுகிறது.
