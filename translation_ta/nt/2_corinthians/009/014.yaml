id: 2CO.9.14
reference: 2 Corinthians 9:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: ta
  text: மேலும், உங்களுக்காக அவர்கள் ஏறெடுக்கும் வேண்டுதலில்[a], உங்கள்மேல் இருக்கும் கடவுளின் அளவுகடந்த அருளின் காரணமாக அவர்கள் உங்கள்மீது ஏக்கம் கொள்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்காக மன்றாடி, உங்கள்மீது ஏக்கம் கொண்டிருக்கிற அவர்கள்.”
    reason: வேண்டுதலையும் ஏக்கத்தையும் இணைக்கும் கிரேக்கத் தொடரியல் சுருக்கமாக இருப்பதால், அதற்கு இன்னொரு இயல்பான அமைப்பு சாத்தியம்.
lexical_decisions:
- source_word: δέησις
  choice: வேண்டுதல்
  rationale: இச்சொல் ஊக்கமான விண்ணப்பத்தையும் பரிந்துபேசும் ஜெபத்தையும் குறிக்கிறது. ‘வேண்டுதல்’ என்பது நவீன தமிழில் இயல்பாகவும், மூலத்தின் தீவிரத்தை ஓரளவு தக்கவைத்தும் உள்ளது.
- source_word: αὐτῶν
  choice: அவர்கள்
  rationale: முந்தைய சூழலில் உதவியைப் பெறுகிற விசுவாசிகளை இது சுட்டுகிறது; தமிழில் வேண்டுதலின் செய்பவர்களாகத் தெளிவாக அமைக்கப்பட்டுள்ளது.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களுக்காக
  rationale: ὑπέρ + மரபுவேற்றுமை இங்கு ‘சார்பாக/நலனுக்காக’ என்ற பொருளில் வருகிறது; வேண்டுதலின் சூழலில் ‘உங்களுக்காக’ இயல்பானது.
- source_word: ἐπιποθούντων
  choice: உங்கள்மீது ஏக்கம் கொள்கிறார்கள்
  rationale: தொடர்ந்து நிலவும் ஆழ்ந்த அன்பார்ந்த ஏக்கத்தைத் தெரிவிக்கிறது. கிரேக்கப் பங்கேற்புவினையின் சுருக்கமான அமைப்பு தமிழில் தெளிவான வினைமுற்றாக விரிக்கப்பட்டுள்ளது.
- source_word: διὰ
  choice: காரணமாக
  rationale: குற்றுவேற்றுமையுடன் வரும் διά இங்கு காரணத்தைக் குறிக்கிறது.
- source_word: ὑπερβάλλουσαν
  choice: அளவுகடந்த
  rationale: சாதாரண அளவை விஞ்சும் தன்மையை மிகைப்படுத்தாமல் நேரடியாகத் தெரிவிக்கிறது.
- source_word: χάριν
  choice: அருள்
  rationale: பவுலின் பயன்பாட்டில் கடவுளின் இலவசமான தயவையும் செயல்படுத்தும் நன்மையையும் தாங்கும் வழக்கமான, இறையியல் எடையுள்ள தமிழ்ச் சொல்.
- source_word: ἐφ’ ὑμῖν
  choice: உங்கள்மேல் இருக்கும்
  rationale: ἐπί + இடவேற்றுமையின் ‘மேல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; ‘உங்களிடையே’ அல்லது ‘உங்களுக்குக் கொடுக்கப்பட்ட’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய வசனத்தின் கருத்தோட்டத்தோடு இக்கூற்றை இணைக்கும் தொடர்ச்சிச் சொல்லாக இயல்பாக உள்ளது.
theological_decisions:
- issue: வேண்டுதலுக்கும் ஏக்கத்துக்கும் இடையிலான தொடரியல் உறவு
  choice: அவர்கள் உங்களுக்காக வேண்டுதல் ஏறெடுக்கும் நிலையில், கடவுளின் அருளின் காரணமாக உங்கள்மீது ஏக்கம் கொள்கிறார்கள் என்று இரு செயல்களையும் இணைத்துக் காட்டுதல்
  alternative: ‘உங்களுக்காக மன்றாடி, உங்கள்மீது ஏக்கம் கொண்டிருக்கிற அவர்கள்’ என்று கிரேக்கத்தின் பங்கேற்புவினை அமைப்புக்கு இன்னும் நெருக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்கத் தொடர் சுருக்கமானது; வேண்டுதல் ஏக்கத்தை வெளிப்படுத்தும் வழிமுறையா அல்லது அதன் சூழலா என்பதை முழுமையாகத் தீர்மானிக்கவில்லை. பிரதான உரை இரண்டையும் காத்து, அடிக்குறிப்பு மாற்று தொடரியலைக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அளவுகடந்த அருள்’ பவுலின் இறையியல் செறிவைத் தக்கவைக்கிறது; ‘ஏக்கம் கொள்கிறார்கள்’ ஆழ்ந்த பாசத்தைச் சேர்த்துப் பொருளுரைக்காமல் வெளிப்படுத்துகிறது.
