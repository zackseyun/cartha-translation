  source_fidelity: மூலத்தின் பகிர்வொருமை (ἕκαστος), உள்ளார்ந்த முன்தீர்மானம் (προῄρηται τῇ καρδίᾳ), வருத்தம்/துயரம் மற்றும் கட்டாயம் ஆகிய இரட்டை மறுப்பு, மேலும் மகிழ்ச்சியான கொடுப்பவர்மீது கடவுளின் நேசம் ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. “கொடுக்கட்டும்; ... கொடுக்க வேண்டாம்” என்பது கிரேக்கக் கட்டளை அமைப்பை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
  naturalness: உரை தெளிவாகவும் கண்ணியமான நவீனத் தரத் தமிழிலும் உள்ளது. “தன் உள்ளத்தில் தீர்மானித்தபடியே,” “மனவருத்தத்தினாலோ கட்டாயத்தினாலோ,” “மகிழ்ச்சியோடு கொடுப்பவரை” ஆகியவை சூழலுக்கு இயல்பானவை.
  terminology: “உள்ளம்” καρδίαவின் உள்ளார்ந்த தீர்மானப் பொருளைத் தக்கவைக்கிறது; “மனவருத்தம்” λύπηயின் அடிப்படைச் சோக/வருத்தப் பொருளைத் தக்கவைக்கிறது; “கட்டாயம்” ἀνάγκηயின் நிர்ப்பந்தப் பொருளைச் சரியாகத் தருகிறது. “கடவுள் நேசிக்கிறார்” என்பது ἀγαπᾷக்கு நேர்மையான மொழிபெயர்ப்பு.
