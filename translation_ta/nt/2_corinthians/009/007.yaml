id: 2CO.9.7
reference: 2 Corinthians 9:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: ta
  text: ஒவ்வொருவரும் தன் உள்ளத்தில் தீர்மானித்தபடியே கொடுக்கட்டும்; மனவருத்தத்தினாலோ[a] கட்டாயத்தினாலோ கொடுக்க வேண்டாம். ஏனெனில் மகிழ்ச்சியோடு கொடுப்பவரைக் கடவுள் நேசிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனமின்றியோ” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் நேரடியாக “வருத்தத்தினால்” அல்லது “துயரத்தினால்” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: பகிர்ந்தளிக்கும் ஒருமைப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; இது ஆண்களை மட்டும் குறிப்பதில்லை.
- source_word: καθὼς προῄρηται τῇ καρδίᾳ
  choice: தன் உள்ளத்தில் தீர்மானித்தபடியே
  rationale: உள்ளார்ந்த, சிந்தித்தெடுத்த தனிப்பட்ட தீர்மானத்தைப் பாதுகாக்கிறது. ‘உள்ளம்’ என்பது இங்கு καρδία குறிக்கும் அகநிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: μὴ ἐκ λύπης
  choice: மனவருத்தத்தினாலோ ... கொடுக்க வேண்டாம்
  rationale: λύπη என்பதன் அடிப்படைப் பொருளான வருத்தம் அல்லது துயரத்தைப் பாதுகாக்கிறது; கொடுப்பதில் மனமின்மையையும் சூழலில் உணர்த்துகிறது.
- source_word: ἢ ἐξ ἀνάγκης
  choice: கட்டாயத்தினாலோ
  rationale: வெளிப்புற அழுத்தம் அல்லது தவிர்க்க முடியாத நிர்ப்பந்தம் காரணமாகக் கொடுப்பதைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἱλαρὸν δότην
  choice: மகிழ்ச்சியோடு கொடுப்பவரை
  rationale: கொடுப்பவரின் மகிழ்ச்சியான மனநிலையை இயல்பான தமிழில் தெரிவிக்கிறது; பாலின வரம்பைத் தேவையின்றி உருவாக்குவதில்லை.
- source_word: ἀγαπᾷ ὁ θεός
  choice: கடவுள் நேசிக்கிறார்
  rationale: வினையின் நேரடியான ‘நேசித்தல்’ பொருளையும் கடவுளை எழுவாயாகவும் பாதுகாக்கிறது.
theological_decisions:
- issue: மூலத்தின் பிரதிநிதித்துவ ஒருமையும் பாலினக் குறிப்பும்
  choice: ஒவ்வொருவரும் தன் உள்ளத்தில்
  alternative: ஒவ்வொரு மனிதனும் தனது இதயத்தில்
  rationale: கிரேக்கத்தில் ἕκαστος இலக்கண ஒருமையாக இருந்தாலும் ஆண்களை மட்டும் குறிக்கவில்லை. தமிழ் வடிவம் தனிநபர் கவனத்தைத் தக்கவைத்தபடி தேவையற்ற ஆண்பால் குறிப்பைத் தவிர்க்கிறது.
- issue: λύπη என்பதைக் கொடுக்கும் சூழலில் மொழிபெயர்த்தல்
  choice: மனவருத்தத்தினாலோ
  alternative: மனமின்றியோ / தயக்கத்தோடோ
  rationale: மூலச்சொல்லின் வருத்தம் அல்லது துயரம் என்ற பொருளை முதன்மை உரையில் வைத்திருக்கிறது; சூழலுக்கேற்ற ‘மனமின்றி’ என்ற உட்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக இல்லாத ஆனால் சூழலால் தேவைப்படும் ‘கொடுக்கட்டும்’ முதன்மை வாக்கியத்தில் சேர்க்கப்பட்டுள்ளது; இரண்டாம் எதிர்மறைக் கூறில் இயல்பான தமிழுக்காக ‘கொடுக்க வேண்டாம்’ பயன்படுத்தப்பட்டுள்ளது.
