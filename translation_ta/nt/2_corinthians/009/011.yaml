reference: 2 Corinthians 9:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: ta
  text: எல்லா வகையிலும் நீங்கள் வளமாக்கப்படுகிறீர்கள்; முழு தாராளத்துடன் கொடுப்பதற்காக, அந்தத் தாராளம் எங்கள் மூலமாகக் கடவுளுக்கு நன்றி செலுத்துதலை உண்டாக்குகிறது—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παντὶ
  choice: எல்லா வகையிலும்
  rationale: இது இடத்தைக் குறிக்கும் சொற்றொடராக அல்லாமல், கடவுள் அளிக்கும் வளத்தின் விரிவையும் முழுமையையும் குறிக்கிறது. ‘எல்லா வகையிலும்’ என்பது நவீன தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: πλουτιζόμενοι
  choice: வளமாக்கப்படுகிறீர்கள்
  rationale: நிகழ்காலச் செயலப்பாட்டு வினையெச்சத்தின் செயப்பாட்டு பொருளைப் பேணுகிறது; வளமாக்குகிறவர் கடவுள் என்பது மறைமுகமாகவே விடப்படுகிறது. இது வெறும் பொருளாதாரச் செல்வவாக்குறுதியாக ஒலிப்பதையும் தவிர்க்கிறது.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: எல்லாவிதமான தாராளத்தையும் காட்டுவதற்காக
  rationale: εἰς நோக்கம் அல்லது விளைவைக் குறிக்கிறது. காணிக்கை பற்றிய உடனடிச் சூழலில் ἁπλότης என்பது உள்ளார்ந்த எளிமையைவிட நடைமுறையான தாராளத்தைக் குறிக்கிறது. தமிழில் இயல்பாக அமைய ‘காட்டுவதற்காக’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἥτις
  choice: அந்தத் தாராளம்
  rationale: உறவுப்பெயர் முன்னர் கூறப்பட்ட தாராளத்தையே சுட்டுகிறது. தமிழில் தெளிவாகவும் இயல்பாகவும் இருக்க பெயர்ச்சொல் மீண்டும் கூறப்படுகிறது.
- source_word: κατεργάζεται
  choice: உண்டாக்குகிறது
  rationale: ஒரு விளைவை ஏற்படுத்துதல் என்ற வினையின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: δι’ ἡμῶν
  choice: எங்கள் மூலமாக
  rationale: διά உடன் வரும் மரபுவேற்றுமை பவுலும் அவருடைய உடன் ஊழியர்களும் காணிக்கையைச் சென்றடையச் செய்யும் இடைமுகமாக இருப்பதைக் குறிக்கிறது; ‘எங்கள் மூலமாக’ அந்தக் கருவித்தன்மையைப் பேணுகிறது.
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: கடவுளுக்கு நன்றி செலுத்துதலை
  rationale: கடவுளை நோக்கிய நன்றியறிதலின் செயலைப் பெயர்ச்சொல் வடிவில் பேணி, தாராளம் உருவாக்கும் விளைவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: காணிக்கைச் சூழலில் ἁπλότης என்பதன் பொருள்
  choice: தாராளம்
  alternative: எளிமை; நேர்மை; ஒருமனப்பான்மை
  rationale: இந்தச் சொல்லுக்கு வேறு சூழல்களில் எளிமை அல்லது நேர்மை என்ற பொருள் இருக்கலாம். ஆனால் இங்கு பொருளுதவி, கொடுத்தல், அதனால் கடவுளுக்கு எழும் நன்றி ஆகியவை பேசப்படுவதால், வெளிப்படையான தாராளம் என்பதே பொருத்தமானது. உள்ளார்ந்த பண்பை மட்டும் வலியுறுத்தும் வாசிப்பைத் திணிக்காமல், காணிக்கைச் சூழலை முன்னிலைப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான வாக்கிய அமைப்பைக் காட்ட இறுதிக் கோடு பேணப்பட்டுள்ளது; செயப்பாட்டு வடிவம் கடவுளை மறைமுகச் செயற்பாட்டாளராக வைத்திருக்கிறது.
