revisions:
- from: எல்லாவிதமான தாராளத்தையும் காட்டுவதற்காக[a] நீங்கள் எல்லா வகையிலும் வளமாக்கப்படுகிறீர்கள்; அந்தத் தாராளம் எங்கள் மூலமாகக் கடவுளுக்கு நன்றி செலுத்துதலை உண்டாக்குகிறது—
  to: எல்லா வகையிலும் நீங்கள் வளமாக்கப்படுகிறீர்கள்; முழு தாராளத்துடன் கொடுப்பதற்காக, அந்தத் தாராளம் எங்கள் மூலமாகக் கடவுளுக்கு நன்றி செலுத்துதலை உண்டாக்குகிறது—
  rationale: The revision retains the source’s passive enrichment and its purpose/result in generous giving, while replacing ‘showing’ with language that naturally expresses generosity in the immediate context. The explanatory footnote remains anchored to ἁπλότης and gives a more precise Tamil alternative for ‘liberality.’
