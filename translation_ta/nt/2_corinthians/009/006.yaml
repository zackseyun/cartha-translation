reference: 2 Corinthians 9:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: ta
  text: 'இதோ: குறைவாக விதைக்கிறவர் குறைவாகவே அறுவடை செய்வார்; ஆசீர்வாதங்களோடு விதைக்கிறவர் ஆசீர்வாதங்களோடே அறுவடை செய்வார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆசீர்வாதங்களோடு’ என்பதற்கு ‘தாராளமாக’ அல்லது ‘மிகுதியாக’ என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் ‘ஆசீர்வாதங்கள்’ என்ற பெயர்ச்சொல் பயன்படுத்தப்பட்டுள்ளது; இச்சூழலில் அது தாராளமான அளவைக் குறிக்கும் மரபுத்தொடராகவும் அமைகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'இதோ:'
  rationale: ஒரு முக்கியமான கோட்பாட்டைச் சுட்டிக்காட்டி அறிமுகப்படுத்தும் சுருக்கமான தொடர். ‘இப்போது’ என்ற காலப்பொருளைச் சேர்க்காமலும், δέ-யை தேவையின்றி வலுவான எதிர்மறை இணைப்பாக மாற்றாமலும் தமிழில் இயல்பாக அமைகிறது.
- source_word: ὁ σπείρων
  choice: விதைக்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினையின் பொதுவான, பழமொழித்தன்மையுள்ள குறிப்பைத் தக்கவைக்கிறது.
- source_word: φειδομένως
  choice: குறைவாக
  rationale: இங்கு அளவைக் கட்டுப்படுத்தி, சொற்பமாக விதைப்பதைக் குறிக்கிறது. ‘சிக்கனமாக’ என்பது நல்ல நிர்வாகம் என்ற நேர்மறை நிழற்பொருளைத் தரக்கூடும்; ‘கஞ்சத்தனமாக’ என்பது மூலச்சொல்லைவிடக் கடுமையான அறத்தீர்ப்பைச் சேர்க்கும்.
- source_word: καὶ θερίσει
  choice: அறுவடை செய்வார்
  rationale: விதைத்தல்–அறுவடை செய்தல் என்ற உருவக இணையைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது; ‘வே’ என்பது விதைக்கும் விதத்துக்கும் அறுவடைக்கும் உள்ள ஒத்திசைவை வெளிப்படுத்துகிறது.
- source_word: ἐπ’ εὐλογίαις
  choice: ஆசீர்வாதங்களாக
  rationale: εὐλογία என்ற ‘ஆசீர்வாதம்’ என்னும் பெயர்ச்சொல்லைத் தக்கவைத்து, விதைப்பதிலும் அறுவடை செய்வதிலும் உள்ள பவுலின் சொல்விளையாட்டைப் பாதுகாக்கிறது. இச்சூழலில் அது தாராளமான அளவையும் மரபுத்தொடராகக் குறிக்கலாம்; அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: ἐπ’ εὐλογίαις என்பதன் பொருள்
  choice: ‘ஆசீர்வாதங்களாக’ என்று பெயர்ச்சொல் சார்ந்த மொழிபெயர்ப்பை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘தாராளமாக’ அல்லது ‘மிகுதியாக’
  rationale: நிதி உதவியைப் பற்றிய சூழலில் தாராளமான அளவு நிச்சயமாக உட்பொருளாக உள்ளது. எனினும், கிரேக்கத்தின் ‘ஆசீர்வாதங்கள்’ என்ற சொல்லைத் தக்கவைப்பது கொடையும் ஆசீர்வாதமும் இடையிலான மொழிசார் மற்றும் இறையியல் தொடர்பைப் பாதுகாக்கிறது; அதேவேளை இதை பொருளாதார வளத்துக்கான இயந்திரமயமான உத்தரவாதமாக மாற்றுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான பழமொழி நடையைப் பயன்படுத்துகிறது. ‘குறைவாகவே / ஆசீர்வாதங்களாகவே’ என்ற இணை அமைப்பு கிரேக்கத்தின் விதைத்தல்–அறுவடை செய்தல் ஒத்திசைவையும் இருமுறை வரும் வினையடைத் தொடர்பையும் காக்கிறது.
