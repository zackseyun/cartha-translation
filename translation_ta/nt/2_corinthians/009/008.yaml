reference: 2 Corinthians 9:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: ta
  text: மேலும், கடவுள் எல்லா அருளையும் உங்களுக்குப் பெருகச் செய்ய வல்லவர்; அதனால், நீங்கள் எல்லாவற்றிலும் எப்போதும் தேவையான அனைத்தையும் கொண்டிருந்து, ஒவ்வொரு நற்செயலிலும் பெருகும்படி அவர் செய்வார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυνατεῖ
  choice: வல்லவர்
  rationale: நிகழ்கால வினை கடவுளின் ஆற்றலையும் திறனையும் வலியுறுத்துகிறது. ‘வல்லவர்’ என்பது இயல்பான, கண்ணியமான தமிழில் அந்த வலியுறுத்தலைக் காக்கிறது.
- source_word: δὲ
  choice: மேலும்
  rationale: இங்கு δέ வலுவான எதிர்மறை இணைப்பாக அல்லாமல், முந்தைய கருத்தைத் தொடர்ந்து இணைக்கும் சொல்லாக உள்ளது.
- source_word: πᾶσαν χάριν
  choice: எல்லா அருளையும்
  rationale: χάρις இச்சூழலில் கொடையளிக்கக் கடவுள் வழங்கும் உதவி உட்பட அவரது அருளான ஏற்பாட்டை விரிவாகக் குறிக்கிறது; அதை வெறும் பண உதவியாகக் குறுக்காமல் ‘அருள்’ என்ற பரந்த பொருள் காக்கப்படுகிறது.
- source_word: περισσεῦσαι
  choice: பெருகச் செய்ய
  rationale: கடவுள் தமது அருளை அவர்களிடம் மிகுதியாக இருக்கச் செய்வதை வெளிப்படுத்தும் காரணவினைப் பொருளை இது காக்கிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களிடம்
  rationale: கொரிந்தியரை நோக்கிய அருளின் திசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: படி
  rationale: ‘பெருகும்படி’ என்ற அமைப்பு கிரேக்கத்தின் நோக்கம் அல்லது விளைவு சார்ந்த தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν παντὶ πάντοτε
  choice: எல்லாவற்றிலும் எப்போதும்
  rationale: பவுல் தொடர்ந்து பயன்படுத்தும் முழுமையைக் குறிக்கும் சொற்களின் வலியுறுத்தலை வெளிப்படையாகக் காக்கிறது.
- source_word: πᾶσαν αὐτάρκειαν
  choice: தேவையான அனைத்தையும்
  rationale: இங்கு αὐτάρκεια தனிநபரின் சுயசார்பைக் காட்டாமல், நற்செயல்களுக்காகக் கடவுள் அளிக்கும் போதுமான ஏற்பாட்டைக் குறிக்கிறது. ‘தேவையான அனைத்தையும்’ என்பது சாதாரண வாசகருக்கு இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது; சொல்லின் பிற நிழற்பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἔχοντες
  choice: பெற்றிருந்து
  rationale: முதன்மை வினையுடன் ஒரே காலத்தில் நிலவும் சூழ்நிலையைத் தமிழ் வினையெச்ச அமைப்பில் தருகிறது; இங்கு கிடைப்பது கடவுளின் வழங்குதலால் என்பதையும் சூழலுக்கேற்ப உணர்த்துகிறது.
- source_word: περισσεύητε
  choice: பெருகும்படி
  rationale: முந்தைய περισσεῦσαι உடன் உள்ள சொல் மறுபயன்பாட்டையும் மிகுதி என்ற கருத்தையும் ‘பெருக’ என்பதன் மூலம் காக்கிறது.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: ஒவ்வொரு நற்செயலிலும்
  rationale: அவர்கள் எல்லா வகையான நல்ல செயல்களிலும் மிகுதியாக ஈடுபடுவதே நோக்கம் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: கொடையளிக்கும் சூழலில் χάρις என்பதன் பொருள்
  choice: பொருளாதார உதவியையும் உள்ளடக்கிய கடவுளின் பரந்த அருளான ஏற்பாடு
  alternative: அருளான தயவு மட்டும்; தனிப்பட்ட வரம்
  rationale: உடனடிச் சூழல் கொடையளித்தலைப் பற்றியது என்றாலும், χάρις என்பதை வெறும் பண வழங்குதலாகக் குறுக்க முடியாது. ‘எல்லா அருள்’ அதன் பரந்த இறையியல் பொருளையும் நடைமுறை உதவியையும் ஒன்றாகக் காக்கிறது.
- issue: αὐτάρκεια என்பதன் பொருள்
  choice: தேவைக்குப் போதுமான ஏற்பாடு
  alternative: மனநிறைவு; தன்னிறைவு அல்லது சுயசார்பு
  rationale: விசுவாசிகள் தங்களால் தாங்களே போதுமானவர்கள் என்பது இங்கு கருத்தல்ல; அவர்கள் தாராளமாக நற்செயல் செய்யக் கடவுள் போதுமானதை அளிப்பதே சூழலுக்குப் பொருந்துகிறது. தத்துவ மரபின் சுயசார்பு எண்ணத்தை மொழிபெயர்ப்பில் புகுத்தாமல் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவான வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் மீண்டும் மீண்டும் வரும் முழுமையைக் குறிக்கும் πᾶς சொற்களும், περισσεύω வேரின் இருமுறை பயன்பாடும் இயன்றவரை ‘எல்லா/அனைத்தும்/ஒவ்வொரு’ மற்றும் ‘பெருக’ என்பவற்றால் காக்கப்பட்டுள்ளன. αὐτάρκεια என்பதற்கான சொற்சொல் சார்ந்த ஆனால் இயல்பற்ற பெயர்ச்சொல் வடிவத்தை விட, சூழலுக்கேற்ற ‘தேவையான அனைத்தையும்’ பயன்படுத்தி அதன் நிழற்பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
