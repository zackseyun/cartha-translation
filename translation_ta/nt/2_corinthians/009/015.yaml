id: 2CO.9.15
reference: 2 Corinthians 9:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: ta
  text: வார்த்தைகளால் விவரிக்க முடியாத அவருடைய கொடைக்காகக் கடவுளுக்கு நன்றி! [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எடுத்துரைக்க முடியாத கொடை.’ இந்தக் கிரேக்கப் பெயரடை முழுமையாக விவரிக்கவோ எடுத்துரைக்கவோ இயலாத ஒன்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: நன்றி
  rationale: τῷ θεῷ என்ற வேற்றுமை வடிவத்துடன் வரும் இந்த வியப்புரைக் கட்டமைப்பில் χάρις என்பது ‘கிருபை’ என்பதைக் காட்டிலும் கடவுளுக்கு நன்றி செலுத்தும் பொருளைக் கொண்டுள்ளது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: நன்றியைப் பெறுபவராகக் கடவுளைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐπὶ
  choice: -க்காக
  rationale: இங்கு நன்றிக்கான அடிப்படை அல்லது காரணத்தைக் குறிக்கிறது; தமிழில் ‘கொடைக்காக’ என்று இயல்பாக வெளிப்படுகிறது.
- source_word: ἀνεκδιηγήτῳ
  choice: வார்த்தைகளால் விவரிக்க முடியாத
  rationale: முழுமையாக எடுத்துரைக்கவோ விவரிக்கவோ இயலாத ஒன்றைக் குறிக்கும் கிரேக்கச் சொல்லின் பொருளைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: முன்னர் குறிப்பிடப்பட்ட கடவுளையே இயல்பாகச் சுட்டுகிறது; கிரேக்கத்தின் பதிலிடுபெயர் வடிவத்தையும் காக்கிறது.
- source_word: δωρεᾷ
  choice: கொடை
  rationale: இலவசமாக அளிக்கப்படும் பரிசு என்ற பொருளுடைய δωρεά என்பதற்கு ‘கொடை’ சுருக்கமானதும் கண்ணியமானதும் ஆகும்; ‘இலவசக் கொடை’ என்பது தேவையற்ற மிகைப்பாக இருக்கும்.
theological_decisions:
- issue: ‘அவருடைய கொடை’ எதைக் குறிக்கிறது?
  choice: அது கடவுளுடைய கொடை என்று மட்டும் மொழிபெயர்த்து, அதன் குறிப்பிட்ட பொருளை வெளிப்படையாக வரையறுக்காமல் விடப்பட்டுள்ளது.
  alternative: அது குறிப்பாகக் கிறிஸ்துவையோ, கிறிஸ்துவில் உள்ள இரட்சிப்பையோ, அல்லது கொரிந்தியரின் தாராளத்தன்மையையும் உள்ளடக்கிய கடவுளின் கிருபையான செயலையோ குறிக்கிறது என்று விளக்குதல்.
  rationale: வசனம் கொடையின் தனிப்பட்ட அடையாளத்தைக் கூறவில்லை. உடனடிச் சூழல் கடவுளின் கிருபையால் விளையும் தாராளத்தன்மையைப் பற்றியதாக இருந்தாலும், கிறிஸ்தவ விளக்க மரபில் கிறிஸ்துவும் மையமாகக் காணப்படுகிறார். ஆகவே மூலத்தின் இறையியல் விரிவும் பதற்றமும் தீர்மானிக்கப்படாமல் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வியப்பும் நன்றியும் கலந்த புகழுரையின் வலிமையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. அடிக்குறி குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
