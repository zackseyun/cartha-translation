  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: ta
  text: ஆகவே, சகோதரர்கள்[a] எங்களுக்கு முன்னதாக உங்களிடம் சென்று, நீங்கள் முன்பு வாக்களித்திருந்த தாராளமான காணிக்கையை[b] முன்கூட்டியே ஒழுங்குசெய்யும்படி அவர்களை வலியுறுத்துவது அவசியம் என்று கருதினேன். இவ்வாறு அது தாராளமான காணிக்கையாக ஆயத்தமாயிருக்குமேயன்றி, பிழிந்து பெறப்பட்ட ஒன்றாக[c] இருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இந்தக் குழு ஆண்களையும் பெண்களையும் உள்ளடக்கியதாகப் புரிந்துகொள்ளப்பட்டால், “சகோதர சகோதரிகள்.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “ஆசீர்வாதம்.” இங்கே அது கொரிந்தியர்கள் வாக்களித்திருந்த தாராளமான காணிக்கையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: πλεονεξία என்ற கிரேக்கச் சொல் பொதுவாக “பேராசை” அல்லது “பொருளாசை” என்று பொருள்படும். இங்கே, தாராளமாக அளிக்கப்படும் காணிக்கைக்கு மாறாக, பிழிந்து பெறப்பட்ட காணிக்கையைப் போல அந்தச் சேகரிப்பு தோன்றுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: ஆகவே ... அவசியம் என்று கருதினேன்
  rationale: பவுலின் நடைமுறைத் தீர்மானத்தையும் οὖν காட்டும் தொடர்ச்சியையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: παρακαλέσαι
  choice: வலியுறுத்துவது
  rationale: இச்சூழலில் உடனடியாகச் செயல்படும்படி கேட்டுக்கொள்ளும் வலிமையைத் தருகிறது; அளவுக்கு மீறிய கட்டளைத்தொனி இல்லை.
- source_word: τοὺς ἀδελφοὺς
  choice: சகோதரர்கள்
  rationale: இலக்கண ரீதியான ஆண்பால் பன்மையைத் தக்கவைக்கிறது; உள்ளடக்கப் பொருள் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: எங்களுக்கு முன்னதாக உங்களிடம் சென்று
  rationale: προέρχομαι குறிக்கும் முன்னதாகச் செல்வதைப் பயணச் சூழலிலுள்ள ஒப்பீட்டுடன் தெளிவாக்குகிறது.
- source_word: προκαταρτίσωσι
  choice: முன்கூட்டியே ஒழுங்குசெய்யும்படி
  rationale: பவுல் வருவதற்கு முன் காணிக்கையை ஏற்பாடு செய்து ஆயத்தப்படுத்தும் செயலை இயல்பாகக் குறிக்கிறது.
- source_word: τὴν προεπηγγελμένην εὐλογίαν ὑμῶν
  choice: நீங்கள் முன்பு வாக்களித்திருந்த தாராளமான காணிக்கையை
  rationale: முன் வாக்குறுதியையும் εὐλογία இங்கு குறிக்கும் தாராளப் பங்களிப்பையும் தெளிவாகக் கூறுகிறது; சொற்பொருளான ‘ஆசீர்வாதம்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἑτοίμην εἶναι
  choice: ஆயத்தமாயிருக்கும்
  rationale: முன்கூட்டிய ஏற்பாட்டின் நோக்கமாகிய ஆயத்தநிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὕτως ὡς εὐλογίαν
  choice: தாராளமான காணிக்கையாக
  rationale: εὐλογία என்பதன் மறுபயன்பாட்டை அதே தமிழ்ச் சொற்றொடரை மீண்டும் பயன்படுத்திப் பாதுகாக்கிறது; οὕτως-இன் விளைவு அடுத்துள்ள ‘அப்போது’ மூலம் இயல்பாகக் காட்டப்படுகிறது.
- source_word: καὶ μὴ ὡς πλεονεξίαν
  choice: வற்புறுத்திப் பெறப்பட்ட ஒன்றாக அல்ல
  rationale: πλεονεξίαவின் பேராசை/ஆதாயம் பறிக்கும் அடிப்படை நிழலை, இச்சேகரிப்பு சூழலில் கொரிந்தியரிடமிருந்து பிழிந்து பெறப்பட்ட காணிக்கை என்ற பொருளில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀδελφοὺς என்பதன் பாலினக் குறிப்பு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்
  rationale: கிரேக்க ஆண்பால் பன்மையை முதன்மை உரையில் தக்கவைக்கிறது; குழுவை உள்ளடக்கமாகப் புரிந்துகொள்ளும் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: εὐλογία என்பதன் காணிக்கைச் சூழல் பொருள்
  choice: தாராளமான காணிக்கை
  alternative: ஆசீர்வாதம்
  rationale: வாக்குறுதியளிக்கப்பட்ட நிதிப் பங்களிப்பை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது; பவுலின் ‘ஆசீர்வாதம்’ என்ற சொற்படிமம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: πλεονεξία என்பதன் சூழல்சார் பொருள்
  choice: வற்புறுத்திப் பெறப்பட்ட ஒன்று
  alternative: பேராசை / பொருளாசை
  rationale: தாராள மனத்துடன் அளிக்கப்படும் காணிக்கைக்கும் பிழிந்து பெறப்படும் ஒன்றுக்கும் இடையிலான எதிர்மறையை வெளிப்படுத்துகிறது; வழக்கமான அகராதிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய அதேவேளையில் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. நீளமான கிரேக்க வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் கருத்துத் தொடர்பும் εὐλογίαவின் மறுபயன்பாடும் காக்கப்பட்டுள்ளன.
