  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: ta
  text: விதைப்பவருக்கு விதையையும் உண்பதற்கு அப்பத்தையும் வழங்குகிறவர், உங்கள் விதையை வழங்குவார், அதைப் பெருகச் செய்வார், உங்கள் நீதியின் விளைச்சலை அதிகரிப்பார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் நீதியின் கனிகளையோ விளைபொருள்களையோ அதிகரிப்பார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் நியாயத்தின் விளைச்சலை அதிகரிப்பார்.” கிரேக்கச் சொல் δικαιοσύνη என்பது ‘நீதி’ என்றும், சில சூழல்களில் ‘நியாயம்’ என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: வழங்குகிறவர்
  rationale: ὁ என்பதுடன் வரும் பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினையை இயல்பான தமிழில் ‘வழங்குகிறவர்’ என்று மொழிபெயர்க்கிறது; தாராளமாக அளிக்கும் நுண்பொருளைச் சூழல் உணர்த்துகிறது.
- source_word: σπόρον
  choice: விதை
  rationale: விதைத்தல் என்ற உடனடிச் சூழலையும் வேளாண்மை உருவகத்தையும் நேரடியாகப் பேணுகிறது.
- source_word: τῷ σπείροντι
  choice: விதைப்பவருக்கு
  rationale: பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἄρτον εἰς βρῶσιν
  choice: உண்பதற்கு அப்பம்
  rationale: விதைப்பதற்கான விதைக்கும் உண்பதற்கான அப்பத்திற்கும் இடையிலான வேறுபாட்டைப் பேணுகிறது.
- source_word: χορηγήσει
  choice: வழங்கி
  rationale: முன்னுள்ள ἐπιχορηγῶν உடனான சொற்பொருள் தொடர்பைப் பேணுகிறது; தமிழில் தொடர்வினை அமைப்பாக இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: πληθυνεῖ
  choice: பெருகச் செய்து
  rationale: விதையை எண்ணிக்கையிலும் அளவிலும் மிகுதியாக்கும் பொருளையும் வேளாண்மை உருவகத்தையும் வெளிப்படுத்துகிறது.
- source_word: τὸν σπόρον ὑμῶν
  choice: உங்கள் விதை
  rationale: பொருளாதார வளத்தையும் கொடுக்கும் திறனையும் ஒருசேர சுட்டக்கூடிய உருவகத்தின் திறந்த தன்மையைப் பேணுகிறது.
- source_word: αὐξήσει
  choice: அதிகரிப்பார்
  rationale: வளரச் செய்தல் அல்லது மிகுதியாக்குதல் என்ற எதிர்காலச் செயலைத் தெளிவாகத் தருகிறது.
- source_word: τὰ γενήματα
  choice: விளைச்சல்
  rationale: பலன்கள் அல்லது விளைபொருள்கள் என்ற கூட்டுப் பொருளை இயல்பான வேளாண்மைச் சொல்லால் தருகிறது.
- source_word: δικαιοσύνης
  choice: நீதி
  rationale: δικαιοσύνη என்பதன் அறநெறிசார் ‘righteousness’ பொருளை முதன்மையாகப் பேணுகிறது; ‘நியாயம்/justice’ என்ற சாத்தியத்தையும் அடிக்குறிப்பில் விடுகிறது.
theological_decisions:
- issue: ‘உங்கள் நீதியின் விளைச்சல்’ என்பதன் பொருள்
  choice: கொரிந்தியர்களின் நீதியான தாராள மனப்பான்மையிலிருந்து விளையும் பலன்களைக் குறிக்கும் விரிந்த வேளாண்மை உருவகமாக வைக்கப்பட்டுள்ளது.
  alternative: பொருளாதார ஆசீர்வாதம், உடன்படிக்கை உண்மைத்தன்மை அல்லது நியாயத்தின் பலன், நீதியான நடத்தையின் சான்று என்று தனித்தனியாகக் குறுக்கிப் புரிந்துகொள்ளலாம்.
  rationale: தாராளமாகக் கொடுப்பதைப் பற்றிய சூழல் இந்த உருவகத்தை வழிநடத்தினாலும், இதை வெறும் பொருளாதாரப் பலனாகவோ, சமூக நியாயமாக மட்டுமோ, நீதிமானாக்கப்பட்ட நிலையாக மட்டுமோ மொழிபெயர்ப்பு வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டுள்ளது. வேளாண்மை உருவகமும் ‘நீதி’ என்பதன் இறையியல் விரிவும் பாதுகாக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத தொடக்கக் கால அல்லது உரையாடல் குறியீடு சேர்க்கப்படவில்லை.
