source:
  edition: SBLGNT
  text: (καθὼς γέγραπται· Ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: ta
  text: 'எழுதியிருக்கிறபடி:


    “அவர் வாரி வழங்கினார்; ஏழைகளுக்குக் கொடுத்தார்;


    அவருடைய நீதி[a] என்றென்றும் நிலைத்திருக்கும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய நேர்மை என்றென்றும் நிலைத்திருக்கும்.” கிரேக்கச் சொல் நீதி, நேர்மை ஆகிய இரு பொருள் நிழல்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: எழுதப்பட்டிருக்கிறபடி
  rationale: வேதவசன மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சூத்திரத்தை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: Ἐσκόρπισεν
  choice: வாரி வழங்கினார்
  rationale: மூல வினையின் ‘சிதறவிடுதல்/பரவலாகப் பகிர்தல்’ என்ற படிமத்தையும், இச்சூழலில் உள்ள தாராள ஈகையையும் இயல்பான தமிழில் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: ἔδωκεν
  choice: கொடுத்தார்
  rationale: கிரேக்க இறந்தகால வினையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: τοῖς πένησιν
  choice: ஏழைகளுக்கு
  rationale: குறைந்த பொருளாதார வசதியுள்ளவர்களைக் குறிக்கும் சொல்லுக்கு நேரடியும் பொதுவாகப் புரியக்கூடியதுமான இணை.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: அவருடைய நீதி
  rationale: δικαιοσύνη என்பதன் ஒழுக்க நேர்மை மற்றும் நீதியான செயல் ஆகிய இரு நிழற்பொருள்களையும் இச்சங்கீத மேற்கோளின் சூழலில் ‘நீதி’ இயல்பாகத் தாங்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: μένει
  choice: நிலைத்திருக்கும்
  rationale: தொடர்ந்து நீடித்திருத்தலைக் குறிக்கும் μένω என்பதன் எதிர்காலத் தாக்கமுள்ள நிகழ்காலப் பொருளை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: முடிவில்லாத நீடிப்பைக் குறிக்கும் சொற்றொடரின் இயல்பான தமிழ் இணை.
theological_decisions:
- issue: δικαιοσύνη என்பதன் பொருள்
  choice: நீதி
  alternative: நேர்மை
  rationale: இங்கு சொல்லப்படுவது தாராளமாகக் கொடுப்பவரின் நீதியான செயல் அல்லது ஒழுக்க நேர்மை என இருவிதமாக உணரப்படலாம். ‘நீதி’ மூலச்சொல்லின் பரந்த ஒழுக்க மற்றும் நீதிசார் பரப்பை வைத்திருக்கிறது; ‘நேர்மை’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேத மேற்கோளுக்குரிய கண்ணியத்தையும் கவித்துவ இணைநடையையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘வாரி வழங்கினார்’ என்பது பரவலாகப் பகிர்ந்தளித்தல் என்ற மூலப் படிமத்தை இயல்பாகக் கொண்டுவருகிறது.
