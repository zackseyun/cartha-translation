source:
  edition: SBLGNT
  text: Περὶ μὲν γὰρ τῆς διακονίας τῆς εἰς τοὺς ἁγίους περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: ta
  text: பரிசுத்த மக்களுக்கான சேவையைப் பற்றி[a] உங்களுக்கு எழுதுவது எனக்கு தேவையற்றதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த மக்களுக்குச் செய்யப்படும் சேவையைப் பற்றி.” இங்குள்ள கிரேக்க முன்னிடைச்சொல் சேவையின் திசையையோ அதன் பயனாளிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: …பற்றி
  rationale: Περὶ அறிமுகப்படுத்தும் தலைப்புமாற்றத்தை இயல்பான தமிழில் ‘பற்றி’ எனத் தருகிறது. μὲν γὰρ முந்தைய உரையோடு இணைக்கும் உரையாடல் துகள்களாக இங்கு செயல்படுவதால், பொருளைத் தவறாகக் காரணவாக்கியமாக மாற்றக்கூடிய ‘ஏனெனில்’ சேர்க்கப்படவில்லை; ‘தான்’ சொல்லாட்சி வலியுறுத்தலை இயல்பாகத் தாங்குகிறது.
- source_word: διακονίας
  choice: சேவை
  rationale: இச்சொல் இங்கு தேவையிலுள்ள விசுவாசிகளுக்கான நடைமுறை உதவியையும் அதற்கான காணிக்கை முயற்சியையும் குறிக்கிறது. ‘சேவை’ பவுல் இப்பணிக்குத் தரும் மதிப்பைத் தக்கவைத்துக்கொண்டு, நவீன தமிழிலும் இயல்பாக உள்ளது.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: பரிசுத்த மக்களுக்குச் செய்யும்
  rationale: εἰς இங்கு சேவையின் திசையையோ பயனாளிகளையோ குறிக்கலாம். ‘மக்களுக்குச் செய்யும்’ என்பது இரண்டையும் இயல்பாக உள்ளடக்குகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἁγίους
  choice: பரிசுத்த மக்கள்
  rationale: ἅγιοι என்பது தேவனுக்கென்று பிரித்தெடுக்கப்பட்ட விசுவாசிகளைக் குறிக்கும் பவுலின் வழக்கமான சொல். ‘பரிசுத்த மக்கள்’ அதன் பொருளைத் தெளிவாகவும் எந்தச் சிறப்புப் பதவியையும் குறிக்காமலும் தருகிறது.
- source_word: περισσόν
  choice: தேவையற்றதுதான்
  rationale: இச்சூழலில் περισσόν என்பது மிகையானது அல்லது அவசியமற்றது என்பதைக் குறிக்கிறது. ‘தேவையற்றது’ எளிய நவீன தமிழ்; ‘தான்’ பவுலின் சொல்லாட்சிசார் வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: உங்களுக்கு எழுதுவது தேவையற்றதுதான்
  rationale: கிரேக்க மொழியின் பெயர்ச்சொல் தன்மையுள்ள வினையெச்ச அமைப்பை, எழுவாயும் மதிப்பீடும் தெளிவாக இருக்கும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
theological_decisions:
- issue: ἅγιοι என்பதன் அடையாளம்
  choice: பரிசுத்த மக்கள்
  alternative: புனிதர்கள்
  rationale: இங்கு ஒரு தனிப்பட்ட புனிதர் வகுப்பை அல்ல, விசுவாசிகள் அனைவரையும் குறிக்கும் பவுலின் பொதுப்பெயர் என்பதால் ‘பரிசுத்த மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத்தமிழில், சபைச் சூழலுக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. ‘ஊழியம்’ என்ற பரந்த அல்லது பதவிசார் நிழற்பொருளுக்குப் பதிலாக இச்சூழலின் நடைமுறை உதவியை வெளிப்படுத்த ‘சேவை’ பயன்படுத்தப்பட்டுள்ளது.
