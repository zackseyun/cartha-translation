source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: ta
  text: இந்த உதவிப்பணியால் கிடைத்த சான்றின் காரணமாக, மெசியாவின் நற்செய்தியைப் பற்றிய உங்கள் அறிக்கையில் வெளிப்படும் கீழ்ப்படிதலுக்காகவும்[a], அவர்களுக்கும் அனைவருக்கும் நீங்கள் தாராளமாகப் பகிர்ந்தளிப்பதற்காகவும்[b], அவர்கள் கடவுளை மகிமைப்படுத்துகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “மெசியாவின் நற்செய்தியைப் பற்றிய உங்கள் அறிக்கையின் கீழ்ப்படிதலுக்காக.” கிரேக்கத் தொடரில், அறிக்கையோடு இணைந்த கீழ்ப்படிதலையோ அறிக்கையில் வெளிப்படும் கீழ்ப்படிதலையோ குறிக்கலாம். “மெசியா” என்பதற்கு “கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பகிர்ந்தளித்தல்” என்பது இங்கு பொதுவான ஐக்கியத்தை மட்டும் குறிக்காமல், நன்கொடையின் வாயிலாக அவர்களுக்கும் மற்ற அனைவருக்கும் செய்யப்படும் தாராளமான பொருளுதவிப் பங்கேற்பைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς
  choice: வெளிப்பட்ட நம்பகத்தன்மை
  rationale: இச்சூழலில் இது சோதிக்கும் செயல்முறையைவிட, இந்தச் சேவையின் மூலம் நிரூபிக்கப்பட்ட உண்மைத்தன்மையைக் குறிக்கிறது. ‘வெளிப்பட்ட நம்பகத்தன்மை’ அந்த விளைவை இயல்பான தமிழில் தருகிறது.
- source_word: διακονίας
  choice: திருப்பணி
  rationale: எருசலேமிலுள்ள இறைமக்களுக்கான பொருளுதவிச் சேவையைச் சுட்டுகிறது; நடைமுறைச் சேவையையும் இறைசார்ந்த பணியையும் ‘திருப்பணி’ தக்கவைக்கிறது.
- source_word: δοξάζοντες τὸν θεὸν
  choice: அவர்கள் கடவுளை மகிமைப்படுத்துகிறார்கள்
  rationale: நீண்ட கிரேக்க வாக்கியத்தின் வினையெச்சத்தைத் தெளிவுக்காக எழுவாயுடன் கூடிய முற்றுவினையாக வழங்குகிறது; δοξάζω என்பதன் வலிமையையும் காக்கிறது.
- source_word: ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: நீங்கள் ... அறிக்கையிடுவதற்கு ஏற்றவாறு கீழ்ப்படிவது
  rationale: ὑποταγή என்பதன் கீழ்ப்படிதல்/பணிதல் கருத்தையும், ὁμολογία என்பதன் வெளிப்படையான விசுவாச அறிக்கையையும் காக்கிறது; தமிழில் அறிக்கையே கீழ்ப்படிகிறது என்ற இயல்பற்ற பொருளைத் தவிர்க்கிறது.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: மெசியாவின் நற்செய்தியை அறிக்கையிடுவதற்கு ஏற்றவாறு
  rationale: εἰς குறிக்கும் தொடர்பு அல்லது நோக்குநிலையைத் தமிழில் இயல்பாக இணைக்கிறது. Χριστός இங்கு பட்டமாக இருப்பதால் ‘மெசியா’ என வழங்கப்படுகிறது.
- source_word: ἁπλότητι
  choice: தாராளமாக
  rationale: இந்த நன்கொடைச் சூழலில் ἁπλότης எளிமையைவிட திறந்தகையுள்ள தாராளத்தைக் குறிக்கிறது.
- source_word: κοινωνίας
  choice: பகிர்ந்துகொள்வது
  rationale: பொதுவான ஐக்கியத்தை மட்டும் அல்லாமல், பொருளுதவியில் பங்கேற்பதையும் குறிக்கும் சமூகப் பகிர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: அவர்களோடும் எல்லாரோடும்
  rationale: κοινωνία என்பதுடன் வரும் திசைநோக்கிய εἰς-ஐ, ‘பகிர்ந்துகொள்வது’ என்ற தமிழ் வினையுடன் இயல்பாக ‘-ஓடும்’ என வழங்குகிறது.
theological_decisions:
- issue: εὐαγγέλιον τοῦ Χριστοῦ என்பதில் Χριστοῦ-ஐ வழங்குதல்
  choice: மெசியாவின் நற்செய்தி
  alternative: கிறிஸ்துவின் நற்செய்தி
  rationale: Χριστός இங்கு பெயர்போல அல்லாமல் பட்டமாகச் செயல்படுகிறது. ‘மெசியா’ அதன் அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருளைக் காக்கிறது; கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
- issue: τῇ ὑποταγῇ τῆς ὁμολογίας என்பதன் உறவு
  choice: அறிக்கையிடுவதற்கு ஏற்றவாறு கீழ்ப்படிதல்
  alternative: உங்கள் அறிக்கையின் கீழ்ப்படிதல்
  rationale: கிரேக்கப் பிறப்புவேற்றுமைத் தொடர்பு பலவாறு புரிந்துகொள்ளப்படலாம். முதன்மை உரை தமிழில் தெளிவாக இருக்க, அறிக்கைக்கு ஒத்த கீழ்ப்படிதலைக் காட்டுகிறது; அதிக முறையான மாற்றை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் காரண-விளைவு அமைப்பும் வாக்கியத்தின் தொடர்ச்சியும் காக்கப்பட்டுள்ளன; கிரேக்கத்தில் உள்ள சுருக்கமான ஆனால் தெளிவற்ற பிறப்புவேற்றுமைத் தொடர்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
