  source_fidelity: திருத்தம் தேவை. «இந்தத் திருப்பணியால் வெளிப்பட்ட நம்பகத்தன்மை» என்பது δοκιμὴ τῆς διακονίας-இன் ‘இந்த உதவிப்பணி அளிக்கும் சான்று/நிரூபணம்’ என்ற பொருளிலிருந்து சற்றே விலகுகிறது. மேலும், «அவர்களோடும் எல்லாரோடும்» என்பது εἰς αὐτοὺς καὶ εἰς πάντας காட்டும் பெறுநர்-நோக்கைத் தெளிவாகக் காட்டாது. திருத்தப்பட்ட உரை இவ்விரண்டையும் காக்கிறது; ὑποταγῇ τῆς ὁμολογίας என்ற சுருக்கத் தொடரின் உறவை முதன்மை உரையில் இயல்பாகவும் அடிக்குறிப்பில் முறையான மாற்றாகவும் வழங்குகிறது.
