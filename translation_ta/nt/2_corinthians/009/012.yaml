source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: ta
  text: ஏனெனில், இந்தச் சேவைப் பணியின் ஊழியம் பரிசுத்தவான்களின் தேவைக் குறைகளை ஈடுசெய்வதோடு மட்டுமல்லாமல், கடவுளுக்குச் செலுத்தப்படும் பல நன்றியறிதல்களால் பெருகிவழிகிறது—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணவிளக்க வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: இந்தத் திருப்பணியின் சேவை
  rationale: διακονία மற்றும் λειτουργία என்ற தொடர்புடைய இரு பெயர்ச்சொற்களையும் முற்றிலும் ஒன்றாக்காமல், முறையே ‘சேவை’ மற்றும் பொதுநல/புனிதப் பணியைக் குறிக்கும் ‘திருப்பணி’ மூலம் வேறுபடுத்துகிறது; கிரேக்கச் சொற்றொடரின் உடைமை உறவையும் காக்கிறது.
- source_word: προσαναπληροῦσα
  choice: நிறைவுசெய்வது
  rationale: இல்லாததையோ குறைவாக இருப்பதையோ ஈடுசெய்து நிரப்புதல் என்ற வினையின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τὰ ὑστερήματα
  choice: குறைவுகள்
  rationale: தேவைகள் எனச் சூழலுக்கேற்ப விளக்கிச் சொல்லாமல், பற்றாக்குறைகள் அல்லது இல்லாமைகள் என்ற மூலச்சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: τῶν ἁγίων
  choice: பரிசுத்தவான்களின்
  rationale: பவுல் விசுவாசிகளைக் குறிக்க வழக்கமாகப் பயன்படுத்தும் ‘பரிசுத்தமானவர்கள்’ என்ற திருச்சபைச் சொல்லாட்சியைப் பாதுகாக்கிறது; பின்னாளைய புனிதர் பட்டக் கருத்தை மொழிபெயர்ப்பில் புகுத்தவில்லை.
- source_word: περισσεύουσα
  choice: பெருகிவழிகிறது
  rationale: போதுமான அளவைத் தாண்டிப் பெருகுதல் என்ற உருவகத்தையும் தொடரும் செயற்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ πολλῶν εὐχαριστιῶν
  choice: பல நன்றிகளால்
  rationale: διά + genitive இன் வழிமுறை அல்லது ஊடகம் சார்ந்த பொருளைத் தக்கவைக்கிறது; ‘நன்றிகள்’ என்ற பன்மை கிரேக்கப் பன்மையையும் பிரதிபலிக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு ஏறெடுக்கப்படும்
  rationale: நன்றிகளின் பெறுநர் கடவுள் என்பதைத் தெளிவுபடுத்துகிறது; தமிழில் ‘கடவுளுக்கு நன்றிகள்’ என்ற தொடர்பை இயல்பாக இணைக்க ‘ஏறெடுக்கப்படும்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἅγιοι என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்தவான்கள்
  alternative: கடவுளுடைய மக்கள்
  rationale: இங்கு உதவியைப் பெறும் சக விசுவாசிகளைப் பவுலின் வழக்கமான திருச்சபைச் சொல்லால் குறிக்கிறது. ‘கடவுளுடைய மக்கள்’ பொருளை விளக்கினாலும், மூலத்தின் முக்கியச் சொல்லை மங்கச் செய்யும்.
- issue: நன்றிகளுக்கும் சேவைக்கும் இடையிலான உறவு
  choice: பல நன்றிகளால் பெருகிவழிகிறது
  alternative: பல நன்றிகளை விளைவிக்கிறது
  rationale: διά என்பதைக் காரணவிளைவு என மட்டும் தீர்மானிக்காமல், வழிமுறை/ஊடகம் என்ற உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. வாக்கியத்தின் முடிவிலுள்ள நீண்ட கோடு, அடுத்த வசனத்திற்குத் தொடரும் கிரேக்க வாக்கிய ஓட்டத்தைச் சுட்டுகிறது. அடிக்குறிப்புகள் இல்லாததால் உரையில் குறியீடுகள் சேர்க்கப்படவில்லை.
