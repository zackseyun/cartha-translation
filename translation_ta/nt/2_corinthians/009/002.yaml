revisions:
- from: ஏனெனில், உங்கள் ஆர்வத்தை[a] நான் அறிவேன். அதைக் குறித்து மக்கெதோனியர்களிடம் உங்கள் சார்பாக, “அகாயா[b] கடந்த ஆண்டு முதலே ஆயத்தமாக இருக்கிறது” என்று பெருமையாகப் பேசுகிறேன்; உங்கள் வைராக்கியம் அவர்களில் பெரும்பாலோரை[c] தூண்டியிருக்கிறது.
  to: ஏனெனில், உங்கள் ஆர்வத்தை[a] நான் அறிவேன். அதைக் குறித்து மக்கெதோனியர்களிடம் உங்கள் சார்பாக, “அகாயா[b] கடந்த ஆண்டிலிருந்தே ஆயத்தமாக உள்ளது” என்று பெருமையாகப் பேசுகிறேன்; உங்கள் தீவிரம் அவர்களில் பெரும்பாலோரை[c] தூண்டியது.
  rationale: The revision changes only the misleading Tamil term ‘வைராக்கியம்’ to ‘தீவிரம்,’ preserving ζῆλος as positive active zeal. It also makes a minor idiomatic adjustment to the continuing state denoted by παρεσκεύασται. The place-name metonymy, Paul’s direct boast, and the implied Macedonian referent of ‘most’ remain intact; all footnote anchors are retained and correctly placed.
  reviewer_model: gpt-5.6-terra
