source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: ta
  text: ஏனெனில், உங்கள் ஆர்வத்தை[a] நான் அறிவேன். அதைக் குறித்து மக்கெதோனியர்களிடம் உங்கள் சார்பாக, “அகாயா[b] கடந்த ஆண்டிலிருந்தே ஆயத்தமாக உள்ளது” என்று பெருமையாகப் பேசுகிறேன்; உங்கள் தீவிரம் அவர்களில் பெரும்பாலோரை[c] தூண்டியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆயத்த மனத்தை.”
    reason: lexical_alternative
  - marker: b
    text: அகாயா என்பது கொரிந்துவையும் உள்ளடக்கிய ரோம மாகாணம்; இங்கு அந்தப் பகுதியிலுள்ள விசுவாசிகளை இடப்பெயரால் பவுல் குறிப்பிடுகிறார்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “பெரும்பான்மையினரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: ஆர்வம்
  rationale: மனப்பூர்வமான முனைப்பையும் செயல்படத் தயாராக இருக்கும் விருப்பத்தையும் குறிக்கிறது; இங்கு பாராட்டும் தொனியில் இயல்பாக அமைகிறது.
- source_word: καυχῶμαι
  choice: பெருமையாகப் பேசுகிறேன்
  rationale: பவுலின் வலுவான சொல்லாட்சியை மென்மைப்படுத்தாமல், நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்கள் சார்பாக
  rationale: கொரிந்தியர்களுக்கு ஆதரவாகவும் அவர்களைப் பாராட்டியும் பவுல் பேசுவதைப் பிரதிபலிக்கிறது; வெறுமனே ‘உங்களைப் பற்றி’ என்று சுருக்கவில்லை.
- source_word: Μακεδόσιν
  choice: மக்கெதோனியர்களிடம்
  rationale: மக்கெதோனியா பகுதியைச் சேர்ந்த மக்களை நேரடியாகக் குறிக்கும் தத்திவ வேற்றுமையின் இயல்பான தமிழ் வடிவம்.
- source_word: Ἀχαΐα
  choice: அகாயா
  rationale: மூலத்தில் உள்ள மாகாணப் பெயரைத் தக்கவைக்கிறது; இங்கு அந்தப் பகுதியிலுள்ள விசுவாசிகளை இடப்பெயரால் குறிப்பது சூழலில் விளங்குகிறது.
- source_word: παρεσκεύασται
  choice: ஆயத்தமாக இருக்கிறது
  rationale: முன்பே செய்யப்பட்ட ஆயத்தத்தின் விளைவாகத் தொடரும் தற்போதைய நிலையை கிரேக்க நிறைவுக்கால வினை உணர்த்துகிறது.
- source_word: ἀπὸ πέρυσι
  choice: கடந்த ஆண்டு முதலே
  rationale: முந்தைய ஆண்டிலிருந்து இப்போதுவரை நீடிக்கும் நிலையைக் காட்டும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: τὸ ὑμῶν ζῆλος
  choice: உங்கள் வைராக்கியம்
  rationale: ζῆλος என்பதன் வலுவான, நேர்மறையான முனைப்பைத் தக்கவைக்கிறது; முன் வரும் προθυμίαν என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: ἠρέθισε
  choice: தூண்டியிருக்கிறது
  rationale: இச்சூழலில் பிறரைச் செயல்பட ஊக்குவித்த நேர்மறையான விளைவைத் தெரிவிக்கிறது; எதிர்மறையான ‘சினமூட்டியது’ என்ற பொருளைத் தவிர்க்கிறது.
- source_word: τοὺς πλείονας
  choice: அவர்களில் பெரும்பாலோரை
  rationale: முன்னர் குறிப்பிடப்பட்ட மக்கெதோனியர்களில் பெரும்பான்மையினரைச் சுட்டுவதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அகாயா’ என்பதன் குறிப்பு
  choice: மாகாணத்தின் பெயரான ‘அகாயா’ தக்கவைக்கப்பட்டு, அங்குள்ள விசுவாசிகளை இடப்பெயரால் குறிக்கும் சொல்லாட்சியாக விடப்பட்டுள்ளது.
  alternative: ‘நீங்கள்’ அல்லது ‘அகாயாவிலுள்ள விசுவாசிகள்’ என்று வெளிப்படையாக விரித்துரைத்தல்.
  rationale: கிரேக்கம் Ἀχαΐα என்ற இடப்பெயரையே பயன்படுத்துகிறது. அதைத் தக்கவைப்பது பவுலின் சொற்களையும் கொரிந்துவைத் தாண்டிய மாகாண அளவிலான குறிப்பையும் பாதுகாக்கிறது.
- issue: பவுலின் பெருமைப்பேச்சின் வலிமை
  choice: ‘பெருமையாகப் பேசுகிறேன்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘பாராட்டிப் பேசுகிறேன்’ அல்லது ‘மதிப்புடன் பேசுகிறேன்’ என்று மென்மைப்படுத்துதல்.
  rationale: καυχῶμαι என்பது வலுவான சொல்லாட்சி. அதைத் தேவையின்றி மென்மைப்படுத்தாமல், தமிழில் ஏற்படக்கூடிய அகந்தை உணர்வை அளவுக்கு மீறிச் சேர்க்காத இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதவாக்கியத்திற்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘ஆர்வம்’ மற்றும் ‘வைராக்கியம்’ என்பவை தொடர்புடைய இரு கிரேக்கச் சொற்களின் நுண்ணிய வேறுபாட்டைக் காட்டுகின்றன. மேற்கோள் குறிகள், மக்கெதோனியர்களிடம் பவுல் கூறிவந்த பெருமைப்பேச்சின் உள்ளடக்கத்தைத் தெளிவுபடுத்துகின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் பொருத்தமான சொற்களுடன் இணைக்கப்பட்டுள்ளன.
