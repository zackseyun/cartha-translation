    reason: χάρις என்பதை ‘அரிய வாய்ப்பு/சலுகை’ என்றும், κοινωνία என்பதை அந்த ஊழியத்தில் ‘பங்கேற்பு’ என்றும், சூழலுக்கேற்ற ஒருங்கிணைந்த கருத்தாகப் புரிந்துகொள்ளலாம்.
