source:
  edition: SBLGNT
  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: ta
  text: மிகுந்த வற்புறுத்தலுடன், பரிசுத்தவான்களுக்கான ஊழியத்தின் அருளையும் அதில் பங்கேற்பையும் தங்களுக்குத் தருமாறு எங்களிடம் மன்றாடினார்கள்—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தவான்களுக்கான ஊழியத்தில் பங்கேற்கும் அரிய வாய்ப்பைத் தங்களுக்குத் தருமாறு.”
    reason: χάρις என்பதை ‘அரிய வாய்ப்பு/சலுகை’ என்றும், κοινωνία என்பதை அந்த ஊழியத்தில் ‘பங்கேற்பு’ என்றும், சூழலுக்கேற்ற ஒருங்கிணைந்த கருத்தாகப் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: மிகுந்த வற்புறுத்தலுடன்
  rationale: παράκλησις இங்கு ஆறுதல் என்ற பொருளில் அல்ல; δεόμενοι என்பதுடன் சேர்ந்து தீவிரமான வேண்டுகோளையும் வலியுறுத்தலையும் குறிக்கிறது.
- source_word: δεόμενοι ἡμῶν
  choice: எங்களிடம் மன்றாடி ... கேட்டுக்கொண்டார்கள்
  rationale: δέομαι என்பது தாழ்மையுடனும் தீவிரத்துடனும் வேண்டுவதைச் சுட்டுகிறது; ἡμῶν வேண்டுகோள் விடுக்கப்பட்ட நபர்களைக் குறிக்கிறது. தமிழில் வாக்கியத் தொடர்பைத் தெளிவாக்க ‘கேட்டுக்கொண்டார்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: τὴν χάριν
  choice: அருளை
  rationale: χάρις என்பதன் பவுலுக்குரிய முக்கியச் சொல்லாட்சியையும், இந்தத் தர்ம உதவியில் பங்கேற்பது அருளாகக் கிடைத்த வாய்ப்பு என்ற சூழல்சார் நுண்பொருளையும் ‘அருள்’ காக்கிறது.
- source_word: τὴν κοινωνίαν
  choice: அதில் பங்கேற்பதை
  rationale: κοινωνία இங்கு உதவிப் பணியில் உண்மையாகப் பங்குகொள்வதைக் குறிக்கிறது. ‘பங்கேற்பது’ நவீனத் தமிழில் இயல்பாகவும் சூழலுக்கு நேராகவும் உள்ளது; ‘ஐக்கியம்’ நடைமுறைப் பங்கேற்பைத் தெளிவாகக் காட்டாது.
- source_word: τῆς διακονίας
  choice: இந்த ஊழியத்தின்
  rationale: διακονία தேவையில் உள்ள விசுவாசிகளுக்கான நடைமுறைச் சேவையைக் குறித்தாலும், பவுல் அதற்கு அளிக்கும் கண்ணியத்தை ‘ஊழியம்’ தக்கவைக்கிறது. ‘இந்த’ என்பது சூழலில் குறிப்பிடப்பட்ட உதவிப் பணியை இயல்பான தமிழில் சுட்டுகிறது.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: பரிசுத்தவான்களுக்குச் செய்யும்
  rationale: εἰς பெறுநர்களை நோக்கிய சேவையைக் குறிக்கிறது. ‘பரிசுத்தவான்கள்’ என்பது பவுல் விசுவாசிகளைக் குறிப்பிடும் ἅγιοι என்ற சொல்லின் தொடர்ச்சியைப் பாதுகாக்கிறது; பின்னாளின் சிறப்புப் பட்டம் என்ற பொருளை இங்கு கொள்ளக்கூடாது.
theological_decisions:
- issue: ἅγιοι என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்தவான்கள்
  alternative: தேவனுடைய பரிசுத்த மக்கள்
  rationale: பவுலின் வழக்கமான விசுவாசி அடையாளச் சொல்லைத் தக்கவைத்து, ஒரு தனிச்சிறப்புப் பெற்ற சிறு குழுவாகப் பொருளைக் குறுக்காமல் விடுகிறது.
- issue: χάρις καὶ κοινωνίαν ஆகியவற்றின் தொடர்பு
  choice: அருளையும் அதில் பங்கேற்பதையும்
  alternative: இந்த ஊழியத்தில் பங்கேற்கும் அரிய வாய்ப்பை
  rationale: καί இணைக்கும் இரண்டு பெயர்ச்சொற்களையும் முதன்மை உரை தனித்தனியாகக் காக்கிறது; அவற்றை ஒரே கருத்தாக முழுமையாகச் சுருக்கி, கிரேக்கத்தில் உள்ள அமைப்புச் சிக்கலைத் தீர்மானித்துவிடவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்துடன் இலக்கண ரீதியாக இணைந்திருப்பதையும் அடுத்த கருத்துக்குத் தொடர்வதையும் இறுதி நீண்ட கோடு காட்டுகிறது. ‘மன்றாடி ... கேட்டுக்கொண்டார்கள்’ என்ற அமைப்பு மூலத்தின் தீவிரத்தையும் தமிழின் இயல்பான வாக்கிய ஓட்டத்தையும் ஒருங்கிணைக்கிறது.
