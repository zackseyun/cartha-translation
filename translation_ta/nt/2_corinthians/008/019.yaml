revisions:
- from: அது மட்டுமல்லாமல், சபைகளால் தேர்ந்தெடுக்கப்பட்டு[a], நாங்கள் நிர்வகித்துவரும் இந்த அருள்நன்கொடையுடன்[b] எங்களோடு பயணம் செய்பவராகவும் அவர் இருக்கிறார். இது ஆண்டவருடைய மகிமைக்காக[c]வும் எங்கள் ஆர்வத்தை வெளிப்படுத்துவதற்காகவும் செய்யப்படுகிறது—
  to: அதுமட்டுமல்லாமல், நாங்கள் நிர்வகித்து வரும் இந்த அருள்நன்கொடையுடன் எங்களோடு பயணம் செய்யும் துணைவராகவும் அவர் சபைகளால் தேர்ந்தெடுக்கப்பட்டார்[a]. இந்த நன்கொடை ஆண்டவருடைய மகிமைக்காகவும் எங்கள் ஆர்வத்திற்காகவும் நிர்வகிக்கப்படுகிறது—
  rationale: The revision preserves the source's appointment-and-travel-companion construction, explicitly links administration to the gift, and renders the two πρὸς-goals without adding ‘to express.’ The alternative possibilities in αὐτοῦ τοῦ κυρίου are retained in a clearer footnote. Footnote markers b and c are supplied at their relevant wording in the complete text.
