  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: ta
  text: அதுமட்டுமல்லாமல், நாங்கள் நிர்வகித்து வரும் இந்த அருள்நன்கொடையுடன் எங்களோடு பயணம் செய்யும் துணைவராகவும் அவர் சபைகளால் தேர்ந்தெடுக்கப்பட்டார்[a]. இந்த நன்கொடை ஆண்டவருடைய மகிமைக்காகவும் எங்கள் ஆர்வத்திற்காகவும் நிர்வகிக்கப்படுகிறது—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நியமிக்கப்பட்டார்’ அல்லது ‘தெரிவுசெய்யப்பட்டார்’; χειροτονηθεὶς என்பது சபைகள் அவரை நியமித்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: தேர்ந்தெடுக்கப்பட்டு
  rationale: சபைகள் அவரை இந்தப் பணிக்காகத் தெரிவுசெய்ததை இயல்பான தமிழில் கூறுகிறது; நவீன வாக்கெடுப்பு முறையைத் தேவையின்றி குறிப்பதில்லை.
- source_word: ἐκκλησιῶν
  choice: சபைகளால்
  rationale: பவுலின் பயன்பாட்டில் கிறிஸ்தவ விசுவாசிகளின் உள்ளூர் சபைகளைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: συνέκδημος
  choice: எங்களோடு பயணம் செய்பவர்
  rationale: கூடப் பயணம் செய்யும் துணைவர் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: χάριτι
  choice: அருள்நன்கொடை
  rationale: எருசலேமுக்கான நன்கொடை என்ற உறுதியான சூழலையும் χάρις சொல்லின் அருள் தன்மையையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: διακονουμένῃ
  choice: நாங்கள் நிர்வகித்துவரும்
  rationale: நன்கொடையைப் பொறுப்புடன் கையாளும் பணியைச் சூழலுக்கேற்ற தமிழில் குறிக்கிறது.
- source_word: πρὸς
  choice: -க்காக
  rationale: இங்கு நோக்கம் அல்லது இலக்கை வெளிப்படுத்துகிறது.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: ஆண்டவருடைய
  rationale: சொற்றொடரின் முதன்மையான உடைமைப் பொருளை இயல்பாகத் தருகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: δόξαν
  choice: மகிமை
  rationale: δόξα என்பதற்கான நிலையான, இறையியல் நிறை கொண்ட தமிழ் மொழிபெயர்ப்பு.
- source_word: προθυμίαν
  choice: ஆர்வம்
  rationale: மனமுவந்த ஆயத்தத்தையும் ஊக்கத்தையும் சுருக்கமாகப் பிரதிபலிக்கிறது; ‘உதவ’ போன்ற வெளிப்படையாக இல்லாத கருத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν என்பதில் αὐτοῦ என்பதன் தொடர்பும் வலியுறுத்தலும்
  choice: ஆண்டவருடைய மகிமைக்காக
  alternative: ஆண்டவராகிய அவருடைய மகிமைக்காக / அவருடைய ஆண்டவரின் மகிமைக்காக
  rationale: கிரேக்கச் சொற்றொடர் சுருக்கமானதும் ஒன்றுக்கு மேற்பட்ட இலக்கணப் புரிதல்களுக்கு இடமளிப்பதும் ஆகும். முதன்மை உரையில் இயல்பான உடைமைத் தொடர்பு தரப்பட்டு, உண்மையான மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: προθυμίαν ἡμῶν என்பது நோக்கமா அல்லது வெளிப்படும் விளைவா
  choice: எங்கள் ஆர்வத்தை வெளிப்படுத்துவதற்காக
  alternative: எங்கள் ஆர்வத்திற்காக
  rationale: ‘மகிமை’ என்பதுடன் இணைந்த நோக்கக் கட்டமைப்பைத் தக்கவைத்தபடி, தமிழில் பொருள் தெளிவாக இருக்க ‘வெளிப்படுத்த’ சேர்க்கப்பட்டுள்ளது; இது நன்கொடையை நிர்வகிப்பதன் மூலம் அவர்களின் ஆர்வம் காணப்படுவதைச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது; இறுதி நீண்ட கோடு அடுத்த வசனத்துடன் தொடரும் சிந்தனையைப் பாதுகாக்கிறது.
