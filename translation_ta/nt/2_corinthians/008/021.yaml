source:
  edition: SBLGNT
  text: ⸂προνοοῦμεν γὰρ⸃ καλὰ οὐ μόνον ἐνώπιον κυρίου ἀλλὰ καὶ ἐνώπιον ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: ta
  text: ஏனெனில், ஆண்டவரின் முன்னிலையில் மட்டுமல்ல, மனிதர்களின் முன்னிலையிலும் நல்லவற்றைக் குறித்து[a] நாங்கள் முன்கூட்டியே அக்கறை கொள்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கண்ணியமானவற்றைக் குறித்து’ அல்லது ‘சரியானவற்றைக் குறித்து.’
    reason: καλά என்பதற்கு நெறிசார் நன்மையுடன், பொதுப் பார்வையில் மதிப்புக்குரிய அல்லது சரியான நடத்தை என்ற பொருளும் இருக்கலாம்.
lexical_decisions:
- source_word: προνοοῦμεν
  choice: நாங்கள் முன்கூட்டியே அக்கறை கொள்கிறோம்
  rationale: இந்த வினைச்சொல் முன்கூட்டியே சிந்தித்தல், கவனம் செலுத்துதல், தேவையான ஏற்பாட்டைக் கவனித்தல் ஆகிய நுணுக்கங்களை உடையது. காணிக்கைப் பணத்தைக் குற்றச்சாட்டுக்கு இடமில்லாமல் கையாளும் சூழலில், திட்டமிட்ட கவனத்தையும் பொறுப்புணர்வையும் இந்த மொழிபெயர்ப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க இணைப்பாக γάρ இங்கு செயல்படுகிறது.
- source_word: καλὰ
  choice: நல்லவற்றை
  rationale: நடுநிலைப் பன்மையான καλὰ என்பது நல்லவை, கண்ணியமானவை, சரியானவை ஆகிய பொருள்களைத் தரலாம். கிரேக்கத்தின் பரந்த நெறிசார் பொருளை முதன்மை உரையில் காக்க ‘நல்லவற்றை’ பயன்படுத்தப்பட்டுள்ளது; பொதுமக்கள் பார்வையில் மதிப்புக்குரிய நடத்தை என்ற சூழல்சார் நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: மட்டுமல்ல ... இலும்
  rationale: ‘மட்டுமல்ல ... இலும்’ என்ற இயல்பான தமிழ்க் கட்டமைப்பு, ஆண்டவருக்கும் மனிதர்களுக்கும் முன்பாக உள்ள பொறுப்பைச் சமநிலையுடன் வலியுறுத்துகிறது.
- source_word: ἐνώπιον
  choice: முன்னிலையில்
  rationale: ‘பார்வையில்’ அல்லது ‘சந்நிதியில்’ என்ற பொருளையும் தரக்கூடிய இந்தச் சொல், இரு இடங்களிலும் ஒரே வடிவில் இயல்பாக அமைய ‘முன்னிலையில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κυρίου
  choice: ஆண்டவரின்
  rationale: κύριος என்பதற்கான மரியாதைமிக்க, வழக்கமான தமிழ் இணையாக ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀνθρώπων
  choice: மனிதர்களின்
  rationale: இது ஆண்களை மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிக்கிறது; ஆகவே பாலினத்தைத் தவறாகக் குறுக்காத ‘மனிதர்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: நிதிப் பொறுப்புணர்வு சூழலில் καλὰ என்பதன் நெறிசார் நுணுக்கம்
  choice: முதன்மை உரையில் பரந்த பொருளுடைய ‘நல்லவற்றை’
  alternative: ‘கண்ணியமானவற்றை’ அல்லது ‘சரியானவற்றை’
  rationale: இவ்வசனம் கடவுளுக்கு முன்பாக மட்டுமல்ல, மனிதர்கள் காணும் விதத்திலும் குற்றச்சாட்டுக்கு இடமில்லாத நடத்தையை வலியுறுத்துகிறது. ஆயினும் καλὰ என்பதை வெளிப்புற மதிப்புக்குரிய தன்மைக்கு மட்டும் குறுக்காமல், அதன் பரந்த ‘நல்லது’ என்ற பொருளை முதன்மை உரை காக்கிறது; மற்ற நியாயமான வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘முன்கூட்டியே அக்கறை கொள்கிறோம்’ என்பது வெறும் எண்ணத்தைவிட திட்டமிட்ட பொறுப்புணர்வைக் காட்டுகிறது; அதே நேரத்தில் குறிப்பிட்ட செயல்முறையை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
