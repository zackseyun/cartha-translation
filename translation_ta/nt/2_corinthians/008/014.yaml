    text: அல்லது, “சமத்துவம்,” “நியாயநிலை,” அல்லது “சமச்சீர் நிலை.” இங்குள்ள கிரேக்கச் சொல், அனைவரிடமும் முற்றிலும் ஒரே அளவு உடைமைகள் இருப்பதை அவசியமாகக் குறிக்காமல், ஒருவர் மற்றவரின் குறைவை நிறைவேற்றும் சமநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
