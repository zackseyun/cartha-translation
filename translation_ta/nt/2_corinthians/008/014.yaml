source:
  edition: SBLGNT
  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: ta
  text: தற்போதைய காலத்தில், உங்களுடைய மிகுதி அவர்களுடைய குறைவை ஈடுசெய்வதற்காக இருக்கிறது; அதுபோல, அவர்களுடைய மிகுதியும் உங்கள் குறைவை ஈடுசெய்வதற்காக அமையும்படி, சமநிலை ஏற்பட வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: இப்போதைய சூழலில்
  rationale: καιρός என்பது வெறும் காலப்புள்ளியை மட்டுமல்லாமல் தற்போதைய குறிப்பிட்ட சூழ்நிலையையும் குறிக்கிறது; இந்தத் தேர்வு அந்தச் சூழ்நிலை சார்ந்த நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: உங்களிடம் மிகுதியாக இருப்பது
  rationale: περίσσευμα தேவைக்கு மேலாக இருப்பதைக் குறிக்கிறது. பொருள் சார்ந்த சூழலைத் தக்கவைத்தபடியே, அதை பணம் என்று மட்டும் வரையறுக்காமல் இந்தச் சொற்றொடர் மொழிபெயர்க்கிறது.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: அவர்களுடைய குறைவை ஈடுசெய்வதற்காக
  rationale: ὑστέρημα என்பது இல்லாமை அல்லது பற்றாக்குறையைக் குறிக்கிறது; εἰς அமைப்பு அந்தக் குறைவை நோக்கிய பயன் அல்லது நோக்கத்தை வெளிப்படுத்துகிறது. ‘ஈடுசெய்வதற்காக’ என்பது இதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: ἵνα καὶ
  choice: அதுபோல ... அமையட்டும்
  rationale: ἵνα நோக்கத்தையும் καί பரஸ்பரத் தன்மையையும் காட்டுகின்றன. தமிழ் அமைப்பு, அவர்களுடைய மிகுதியும் எதிர்மறைத் திசையில் அதே பணியைச் செய்யும் என்ற பரஸ்பர உறவைப் பாதுகாக்கிறது.
- source_word: τὸ ἐκείνων περίσσευμα
  choice: அவர்களிடம் மிகுதியாக இருப்பது
  rationale: இரு தரப்புகளையும் பற்றிய περίσσευμα ஒரே விதமாக மொழிபெயர்க்கப்பட்டதால் பவுலின் இணையான, பரஸ்பர அமைப்பு தெளிவாகிறது.
- source_word: γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: உங்கள் குறைவை ஈடுசெய்வதற்காக அமையட்டும்
  rationale: γένηται என்பதன் நோக்கவாக்கிய இறந்தகாலமற்ற சாத்திய/நோக்க நுணுக்கத்தை ‘அமையட்டும்’ தக்கவைக்கிறது; ‘உங்கள் குறைவை’ என்ற மறுபதிப்பு மூலத்தின் பரஸ்பர அமைப்பைப் பாதுகாக்கிறது.
- source_word: ὅπως γένηται ἰσότης
  choice: இவ்வாறு சமநிலை ஏற்படும்
  rationale: ἰσότης என்பதற்கு ‘சமநிலை’ நேர்த்தியான தமிழ் இணை; இச்சூழலில் அது எல்லாருக்கும் முற்றிலும் ஒரே அளவு உடைமை என்பதைக் காட்டிலும், குறைகள் பரஸ்பரம் ஈடுசெய்யப்படும் நிலையைச் சுட்டுகிறது.
theological_decisions:
- issue: பவுலின் கொடை வேண்டுகோளில் ἰσότης என்பதன் பொருள்
  choice: பரஸ்பரத் தேவைகளை நிறைவேற்றுவதால் ஏற்படும் சமநிலை
  alternative: சமத்துவம்; நியாயநிலை; சமச்சீர் நிலை
  rationale: உடனடிச் சூழல் விசுவாசிகளிடையே ஒருவருடைய குறைவை மற்றவருடைய மிகுதி ஈடுசெய்வதைப் பற்றியது. ஆகவே ‘சமநிலை’ கிரேக்கச் சொல்லின் அடிப்படைப் பொருளைத் தக்கவைத்தபடியே, சூழலுக்குப் புறம்பான ஒரு குறிப்பிட்ட சமூகக் கோட்பாட்டை உரைக்குள் புகுத்தாமல் இருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் பரஸ்பர இணை அமைப்பு ‘உங்களிடம்/அவர்களிடம் மிகுதியாக இருப்பது’ மற்றும் ‘அவர்களுடைய/உங்கள் குறைவு’ என்ற எதிரிணைகளால் பாதுகாக்கப்பட்டுள்ளது.
