source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: ta
  text: மேலும், நற்செய்தியில் எல்லாத் திருச்சபைகளிலும் பாராட்டப்படுகிற அந்தச் சகோதரரை அவருடன் அனுப்பினோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நற்செய்தியைப் பொறுத்தவரை எல்லாத் திருச்சபைகளிடையேயும் நற்பெயர் பெற்றவர்.”
    reason: ἔπαινος என்பதற்கு ‘பாராட்டு’ என்பதற்குப் பதிலாக ‘நற்பெயர்/நற்பரிந்துரை’ என்றும், διά + genitive என்பதற்கு ‘திருச்சபைகளிடையே’ என்றும் கொள்ளக்கூடிய சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: அனுப்பினோம்
  rationale: இறந்தகால வினை முடிவுற்ற செயலைக் குறிக்கிறது; உடன்செல்லும் பொருள் μετ’ αὐτοῦ என்பதில் இயல்பாக வெளிப்படுவதால் தமிழில் வினைக்குள் அதை மீண்டும் சேர்க்கவில்லை.
- source_word: δὲ
  choice: -உம்
  rationale: வலுவான முரண்பாடு அல்லாமல் உரையை முன்னெடுக்கும் மென்மையான இணைப்பை, ‘சகோதரரையும்’ என்ற சேர்க்கை உருபு இயல்பாகக் காட்டுகிறது.
- source_word: μετ’ αὐτοῦ
  choice: அவருடன்
  rationale: μετά + பிறப்புவேற்றுமை உடன்செல்லுதலைக் குறிக்கிறது.
- source_word: τὸν ἀδελφόν
  choice: சகோதரரை
  rationale: குறிப்பிட்ட, அறியப்பட்ட ஆண் கிறிஸ்தவ உடன்பணியாளரைக் குறிக்கும் சொல்லைச் சொந்த உறவைக் கூடுதலாகச் சேர்க்காமல் மொழிபெயர்க்கிறது.
- source_word: οὗ ὁ ἔπαινος
  choice: பாராட்டுப் பெற்ற
  rationale: தமிழில் இயல்பான தொடர்பெச்ச அமைப்பு; அவர் பாராட்டப்படுகிறார் என்ற பொருளைத் தருகிறது, ஆனால் பாராட்டின் துல்லிய அடிப்படையை விரிவுபடுத்தவில்லை.
- source_word: ἔπαινος
  choice: பாராட்டு
  rationale: புகழ்ச்சி அல்லது நற்பரிந்துரை என்ற பொருள் கொண்ட சொல்லுக்கு நடுநிலையான, இயல்பான தமிழ் இணை.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: நற்செய்தி தொடர்பாக
  rationale: ‘நற்செய்தியில்’ என்பதன் தெளிவற்ற தொடர்பை இயல்பான தமிழில் காக்கிறது; பிரசங்கம் அல்லது குறிப்பிட்ட ஊழியப் பதவி என்று குறுக்கவில்லை.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: எல்லாத் திருச்சபைகளிலும்
  rationale: அனைத்துச் சபைகளிலும் பரவலாக அறியப்பட்ட பாராட்டைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐκκλησιῶν
  choice: திருச்சபைகள்
  rationale: பவுலின் சூழலில் உள்ளூர் கிறிஸ்தவ சபைகளைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க சொல்.
theological_decisions:
- issue: ἀδελφός என்பவரின் அடையாளமும் நிலையும்
  choice: கொரிந்தியருக்கு அறிமுகமான ஒரு குறிப்பிட்ட ஆண் கிறிஸ்தவ உடன்பணியாளராக ‘சகோதரர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: பொதுவான பொருளில் ‘சக விசுவாசி’
  rationale: ஆண்பால் ஒருமையும் குறிப்புச் சுட்டும் பயணச் சூழலும் ஒரு குறிப்பிட்ட ஆணைக் காட்டுகின்றன; ‘நமது’ என்று மூலத்தில் இல்லாததைச் சேர்க்கவில்லை.
- issue: ἐν τῷ εὐαγγελίῳ என்பதன் நுணுக்கம்
  choice: ‘நற்செய்தி தொடர்பாக’ என்று, குறிப்பிட்ட ஊழியப் பணியை நிர்ணயிக்காமல் வைக்கப்பட்டது.
  alternative: ‘நற்செய்தியைப் பிரசங்கிப்பதில்’ / ‘நற்செய்திப் பணிக்காக’
  rationale: கிரேக்கம் பிரசங்கத்தையோ ஓர் ஊழியப் பதவியையோ வெளிப்படையாகக் கூறவில்லை; நற்செய்தியோடு உள்ள தொடர்பை மட்டும் திறந்த நிலையில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. ‘நற்செய்தி தொடர்பாக’ என்பது மூலத்தின் பொருள் திறப்பைத் தக்கவைக்கிறது; ‘திருச்சபைகள்’ பவுலின் உள்ளூர் கிறிஸ்தவக் கூட்டங்களைக் குறிக்கும் நிலையான சொல்.
