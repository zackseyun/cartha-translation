revisions:
- from: அவருடன், நற்செய்தி தொடர்பாக எல்லாத் திருச்சபைகளிலும் பாராட்டுப் பெற்ற சகோதரரையும் அனுப்பினோம்.[a]
  to: மேலும், நற்செய்தியில் எல்லாத் திருச்சபைகளிலும் பாராட்டப்படுகிற அந்தச் சகோதரரை அவருடன் அனுப்பினோம்.[a]
  rationale: திருத்தம் δέ-யின் மென்மையான தொடர்ச்சியை “மேலும்” மூலம் தெளிவுபடுத்துகிறது; ἐν τῷ εὐαγγελίῳ என்பதன் விரிவான தொடர்பை “நற்செய்தியில்” எனத் திறந்த நிலையில் காக்கிறது; மேலும், ὁ ἔπαινος என்ற நிகழ்காலப் பண்பை “பாராட்டப்படுகிற” என்று இயல்பாக வெளிப்படுத்துகிறது. பெயரிடப்படாத சகோதரரின் அடையாளம் அல்லது அவருடைய ஊழியத்தின் வகை எதுவும் சேர்க்கப்படவில்லை.
