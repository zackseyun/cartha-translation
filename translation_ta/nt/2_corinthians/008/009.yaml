source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: ta
  text: 'நம்முடைய ஆண்டவராகிய இயேசு கிறிஸ்துவின் அருளை நீங்கள் அறிந்திருக்கிறீர்கள்: அவர் செல்வந்தராக இருந்தும், உங்களுக்காக ஏழையானார்; நீங்கள் அவருடைய ஏழ்மையினால் செல்வந்தர்களாகும்படியாக.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γινώσκετε
  choice: நீங்கள் அறிந்திருக்கிறீர்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு வினை; கொரிந்தியர்கள் ஏற்கெனவே அறிந்திருக்கும் உண்மையைப் பவுல் சுட்டுகிறார்.
- source_word: χάριν
  choice: அருளை
  rationale: கிறிஸ்துவின் அருள்செயலையும், சுற்றியுள்ள பகுதியில் வலியுறுத்தப்படும் தாராள மனப்பான்மையையும் தாங்கக்கூடிய இயல்பான இறையியல் சொல்.
- source_word: κυρίου
  choice: ஆண்டவராகிய
  rationale: κύριος என்பதன் அதிகாரத்தையும் கிறிஸ்துவியல் முக்கியத்துவத்தையும் காக்கும் வழக்கமான தமிழ் பட்டப்பெயர்.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு கிறிஸ்து
  rationale: நவீனத் தமிழ் வேதாகம வழக்கில் தெளிவாகவும் இயல்பாகவும் அறியப்படும் வடிவம்; கிறிஸ்து என்பது பட்டப்பெயர் என்ற பொருளை இழக்கவில்லை.
- source_word: δι’ ὑμᾶς
  choice: உங்களுக்காக
  rationale: διά + குற்றுவேற்றுமையின் பயன்நோக்குப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πλούσιος ὤν
  choice: செல்வந்தராக இருந்தும்
  rationale: பங்கேற்புவினையின் விட்டுக்கொடுக்கும் எதிர்மறை உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπτώχευσεν
  choice: ஏழையானார்
  rationale: செல்வநிலையிலிருந்து ஏழ்மைக்குச் சென்ற மாற்றத்தை நேரடியாகக் காட்டுகிறது; அதன் தன்மையை தேவையின்றி வரையறுக்கவில்லை.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: அவருடைய ஏழ்மையினால்
  rationale: கருவி அல்லது வழிமுறையைக் குறிக்கும் வேற்றுமையைப் பாதுகாக்கிறது.
- source_word: πλουτήσητε
  choice: செல்வந்தர்களாகும்படி
  rationale: ἵνα கூறும் நோக்கம்/விளைவை வெளிப்படுத்தி, ஏழையானார்–செல்வந்தர்களாகுதல் என்ற சொல்லெதிர்மையைப் பேணுகிறது.
theological_decisions:
- issue: கிறிஸ்து ‘செல்வந்தராக’ இருந்ததும் விசுவாசிகள் ‘செல்வந்தர்களாவது’ என்பதன் பொருள்
  choice: பொருளாதாரச் சொற்படிமத்தை மூலவசனம்போலவே வைத்திருந்து, அதன் குறிப்பிட்ட இறையியல் பொருளைத் தீர்மானிக்காமல் விடுதல்
  alternative: அதை கிறிஸ்துவின் முன்-மனிதாவதார மகிமை அல்லது விசுவாசிகளின் ஆவிக்குரிய இரட்சிப்பு ஆசீர்வாதங்கள் என்று வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க உரை செல்வம், ஏழ்மை ஆகியவற்றின் உருவகப் பொருளைத் துல்லியமாக வரையறுப்பதில்லை; கிறிஸ்துவின் தன்னளிப்பையும் கொடையைக் குறித்த பவுலின் அழைப்பையும் ஒன்றாக ஒலிக்கச் செய்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. கிரேக்கத்தின் செல்வம்–ஏழ்மை சொல்லெதிர்மையும் இறையியல் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
