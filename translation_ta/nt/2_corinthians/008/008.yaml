id: 2CO.8.8
reference: 2 Corinthians 8:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: ta
  text: இதை நான் ஒரு கட்டளையாகச் சொல்லவில்லை. மாறாக, மற்றவர்கள் காட்டும் ஆர்வத்தைக் கொண்டு[a], உங்கள் அன்பு உண்மையானதா என்பதையும் சோதித்தறியவே[b] சொல்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மற்றவர்கள் காட்டும் தீவிர அக்கறையைக் கொண்டு’; σπουδή என்பது ஆர்வம், தீவிர அக்கறை, அல்லது முனைப்பு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் அன்பின் உண்மைத்தன்மையை நிரூபிக்கவே’; δοκιμάζω என்பது சோதித்தல், சோதித்து உறுதிப்படுத்துதல், அல்லது நிரூபித்தல் ஆகிய பொருள்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: கட்டளை
  rationale: அதிகாரபூர்வமாக இடப்படும் கட்டளை என்ற பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது; கொடை மனமுவந்து அளிக்கப்பட வேண்டும் என்ற சூழலிலுள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: மற்றவர்கள் காட்டும் ஆர்வத்தைக் கொண்டு
  rationale: διά உடன் வரும் இத்தொடரின் வழிமுறை அல்லது கருவிப் பொருளை ‘கொண்டு’ வெளிப்படுத்துகிறது. ἑτέρων என்பதைக் குறிப்பிட்ட ஒரு குழுவாக விளக்காமல் ‘மற்றவர்கள்’ என்றே வைத்திருக்கிறது.
- source_word: σπουδή
  choice: ஆர்வம்
  rationale: இச்சூழலில் தீவிரமான முனைப்பையும் மனமுவந்த ஈடுபாட்டையும் குறிக்கிறது. ‘ஆர்வம்’ என்பது பொதுவாசகருக்கு இயல்பாக இருந்து, வெறும் அவசரம் என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: ἀγάπη
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான நேரடியும் வழக்கமானதுமான தமிழ் இணை; இங்கு கொடுப்பதில் வெளிப்படும் அன்பைக் குறிக்கிறது.
- source_word: γνήσιον
  choice: உண்மையானதா
  rationale: பெயர்ச்சொல் தன்மையுடன் வந்துள்ள ‘உண்மைத்தன்மை’ என்ற கருத்தை, தமிழில் இயல்பாக ‘உங்கள் அன்பு உண்மையானதா’ என்ற உட்பொதிந்த வினாவாக வெளிப்படுத்துகிறது.
- source_word: δοκιμάζων
  choice: சோதித்தறியவே
  rationale: சோதித்து அதன் தன்மையை அறிதல் அல்லது உறுதிப்படுத்துதல் என்ற δοκιμάζω-வின் பொருளைப் பாதுகாக்கிறது. நிகழ்காலப் பங்கேற்பு முக்கிய வினையோடு தொடர்புடைய நோக்கமாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: καί
  choice: என்பதையும்
  rationale: '‘-யும்’ விகுதி மூலம் καί-யின் சேர்க்கைப் பொருள் வெளிப்படுகிறது: மற்றவர்களின் ஆர்வத்தைச் சுட்டுவதோடு, கொரிந்தியரின் அன்பையும் பவுல் சோதிக்கிறார்.'
- source_word: ὑμετέρας
  choice: உங்கள்
  rationale: கொரிந்திய சபையாரை ஒரு குழுவாகக் குறிக்கும் பன்மை உடைமைப் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: கொடை அளிப்பதைப் பற்றிய பவுலின் சொல்லாட்சி
  choice: தாம் அதிகாரபூர்வமான கட்டளை இடவில்லை என்று பவுல் வெளிப்படையாகக் கூறுகிறார்; மற்றவர்களின் ஆர்வத்தைக் கொண்டு கொரிந்தியரின் அன்பு உண்மையானதா என்பதைச் சோதிப்பதாகத் தம் நோக்கத்தை விளக்குகிறார்.
  alternative: கட்டளையின் கடுமையை மட்டும் சொல்லாட்சியால் மென்மையாக்குகிறார்; ஆனால் அது நடைமுறையில் ஒரு கட்டளையே.
  rationale: οὐ κατ’ ἐπιταγὴν λέγω என்பது கட்டளையாகச் சொல்வதை நேரடியாக மறுக்கிறது. இதை மறைமுகக் கட்டளையாக மாற்றாமல், அப்போஸ்தல அதிகாரத்துக்கும் அன்பினால் மனமுவந்து செயல்படுவதற்கும் இடையிலுள்ள பதற்றம் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘ஒரு கட்டளையாக’ என்பது அதிகாரபூர்வக் கட்டளையைத் தெளிவாக்குகிறது; ‘சோதித்தறியவே’ என்பது வெறும் சந்தேகிப்பதைவிட சோதித்து உண்மையை அறியும் நுணுக்கத்தைத் தருகிறது. மூலத்தின் நீண்ட வாக்கிய அமைப்பு தமிழில் தெளிவிற்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், எதிர்மறை–மாறாக என்ற தர்க்கத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
