source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: ta
  text: அவர்களோடு நம்முடைய சகோதரரையும் அனுப்பியிருக்கிறோம். அவரைப் பல காரியங்களில் பலமுறை சோதித்து, முனைப்புள்ளவர் என்று கண்டிருக்கிறோம். இப்போதோ, உங்கள்மேல் அவர் கொண்டுள்ள மிகுந்த நம்பிக்கையால் இன்னும் அதிக முனைப்புடன் இருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிகுந்த நம்பிக்கையால்” என்பதை “மிகுந்த நம்பிக்கையின் மூலம்” என்றும் மொழிபெயர்க்கலாம். இந்த நம்பிக்கை அந்தச் சகோதரருடையது என்பதே இத்தொடரின் இயல்பான பொருள்; எனினும், அது பவுலுடைய நம்பிக்கையைக் குறிப்பதாகவும் கிரேக்கத் தொடரைப் புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: கிரேக்க வேற்றுமை உருபு காரணம் அல்லது கருவியைக் குறிக்கலாம்; மேலும் நம்பிக்கை கொண்டவரின் அடையாளத்தில் சிறிய இலக்கணத் தெளிவின்மை உள்ளது.
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: அவர்களோடு … அனுப்பியிருக்கிறோம்
  rationale: இறந்தகால வினை குறிக்கும் நிறைவேற்றப்பட்ட செயலும், σύν- முன்னொட்டு குறிக்கும் ‘அவர்களோடு’ என்ற உடன்செல்லும் பொருளும் இயல்பான நவீனத் தமிழில் காக்கப்படுகின்றன.
- source_word: ἀδελφὸν ἡμῶν
  choice: நம்முடைய சகோதரர்
  rationale: கிறிஸ்தவக் குடும்ப உறவுமுறையைக் குறிக்கும் மூலமொழியின் உருவகத்தை அப்படியே காக்கிறது; பெயர் குறிப்பிடப்படாத ஆண் உடன்பணியாளரையும் தெளிவாகச் சுட்டுகிறது.
- source_word: ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις
  choice: பல காரியங்களில் பலமுறை சோதித்து
  rationale: ἐν πολλοῖς என்பதன் பரப்பையும் πολλάκις என்பதன் மீள்நிகழ்வையும் தனித்தனியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: σπουδαῖον ὄντα
  choice: முனைப்புள்ளவர் என்று கண்டிருக்கிறோம்
  rationale: சோதனையின் விளைவாக வெளிப்பட்ட ஊக்கம், அக்கறை, செயல்துடிப்பு ஆகியவற்றை ‘முனைப்பு’ இயல்பாகத் தருகிறது; ‘கண்டிருக்கிறோம்’ என்பது சோதித்து உறுதிப்படுத்திய முடிவை வெளிப்படுத்துகிறது.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: இப்போதோ … இன்னும் அதிக முனைப்புடன் இருக்கிறார்
  rationale: δὲ குறிக்கும் மாறுபாட்டையும், πολὺ வலுப்படுத்தும் ஒப்பீட்டையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: உங்கள்மேல் அவர் கொண்டுள்ள மிகுந்த நம்பிக்கையால்
  rationale: நம்பிக்கையின் திசை கொரிந்தியரை நோக்கியது என்பதையும், அது அதிகரித்த முனைப்புக்குக் காரணம் அல்லது வழிமுறை என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς என்பதில் நம்பிக்கை கொண்டவர் யார், அதன் தொடர்பு என்ன?
  choice: பெயர் குறிப்பிடப்படாத சகோதரரின் அதிகரித்த முனைப்புக்கு, கொரிந்தியர்மேல் அவர் கொண்டுள்ள மிகுந்த நம்பிக்கை காரணமாகிறது
  alternative: அது பவுல் கொரிந்தியர்மேல் கொண்டுள்ள நம்பிக்கையைக் குறிக்கலாம்; அல்லது ‘உங்களிடம் துணிவுடன் இருப்பது’ என்ற நுண்பொருளைக் கொண்டிருக்கலாம்
  rationale: உடனடி இலக்கணத் தொடர்பு அந்தச் சகோதரரையே இயல்பாகச் சுட்டுகிறது. எனினும், வேற்றுமை உருபின் காரண/கருவிப் பொருளையும் நம்பிக்கையின் உரிமையாளரைப் பற்றிய சிறிய தெளிவின்மையையும் அடிக்குறிப்பில் திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முனைப்பு’ என்ற சொல் ஒரே கிரேக்கச் சொல்லின் அடிப்படை மற்றும் ஒப்பீட்டு வடிவங்களுக்கு ஒரேநிலையாகப் பயன்படுத்தப்பட்டதால், வசனத்தின் உள் ஒப்பீடு தெளிவாகத் தங்குகிறது.
