id: 2CO.8.15
reference: 2 Corinthians 8:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: ta
  text: 'எழுதியிருக்கிறபடி: “அதிகம் கொண்டவரிடம் மிகுதி இல்லை; குறைவு கொண்டவரிடம் பற்றாக்குறை இல்லை.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: எழுதப்பட்டிருக்கிறபடி
  rationale: வேதவசன மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடர். கிரேக்க நிறைவுக்கால வினை உணர்த்தும், தொடர்ந்து நிலைத்திருக்கும் எழுத்துச் சாட்சியை இந்தத் தமிழ் வடிவம் இயல்பாகக் காட்டுகிறது.
- source_word: Ὁ τὸ πολὺ
  choice: அதிகமாக வைத்திருந்தவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இத்தொடர் ‘அதிகம் உடையவர்’ என்ற பொருளைத் தருகிறது. பவுலின் கிரேக்க மேற்கோளில் ‘சேகரித்தார்’ என்ற வினை வெளிப்படையாக இல்லாததால், அதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ἐπλεόνασεν
  choice: மிகுதியாக இருக்கவில்லை
  rationale: இவ்வினை ‘பெருகுதல்’ அல்லது ‘தேவைக்கு அதிகமாக இருத்தல்’ என்று பொருள்படலாம். இங்கு பகிர்ந்தளிப்பின் முடிவில் எவரிடமும் மிகுதி இல்லை என்ற கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὁ τὸ ὀλίγον
  choice: குறைவாக வைத்திருந்தவர்
  rationale: ‘அதிகமாக வைத்திருந்தவர்’ என்பதற்கு இணையான எதிர்நிலை அமைப்பைத் தக்கவைத்து, மூலத்தில் இல்லாத ‘சேகரித்தார்’ என்ற வினையைப் புகுத்தாமல் மொழிபெயர்க்கிறது.
- source_word: ἠλαττόνησεν
  choice: பற்றாக்குறையாக இருக்கவில்லை
  rationale: குறைவுபடுதல் அல்லது தேவைக்குக் குறைவாக இருத்தல் என்ற பொருளைத் தருகிறது. ‘மிகுதி—பற்றாக்குறை’ என்ற சமநிலை எதிரிணையைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: யாத்திராகமம் 16:18 மேற்கோளைத் தாராளக் கொடை மற்றும் சமநிறைவு பற்றிய சூழலில் பவுல் பயன்படுத்துவது
  choice: சேகரிக்கும் செயலை வெளிப்படையாகச் சேர்க்காமல், இறுதியில் ஒருவரிடம் மிகுதியும் மற்றொருவரிடம் பற்றாக்குறையும் இல்லாத நிலையாக மொழிபெயர்த்தல்
  alternative: “அதிகமாகச் சேகரித்தவரிடம் எதுவும் மிஞ்சவில்லை; குறைவாகச் சேகரித்தவருக்குப் பற்றாக்குறை ஏற்படவில்லை”
  rationale: பவுலின் மேற்கோள் வடிவத்தில் ‘சேகரித்தல்’ என்ற வினை இல்லை; உடனடி சூழலில் நியாயமான பொருள் வழங்கலே வலியுறுத்தப்படுகிறது. ஆகவே முதன்மை உரை பவுலின் சொல்லமைப்பையும் அதன் பயன்பாட்டையும் காக்கிறது; யாத்திராகமத்தின் விரிவான சொல்வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேத மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘மிகுதி—பற்றாக்குறை’ என்ற எதிரிணை மூலத்தின் சமநிலையான அமைப்பைப் பாதுகாக்கிறது.
