id: 2CO.8.1
reference: 2 Corinthians 8:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: ta
  text: சகோதரர்களே[a], மக்கெதோனியாவிலுள்ள திருச்சபைகளிடையே அளிக்கப்பட்டுள்ள கடவுளின் அருளை[b] உங்களுக்குத் தெரியப்படுத்துகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; கிரேக்க மொழியில் ‘சகோதரர்களே’ என்ற ஆண்பால் வடிவம் உள்ளது. அது பல இடங்களில் சபையிலுள்ள அனைவரையும் அழைக்கப் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கடவுளின் அருள்’ என்பது கடவுளின் தயவையும், அந்த அருள் மக்கெதோனியத் திருச்சபைகளில் உருவாக்கிய அருள்நிறைந்த தாராள மனப்பான்மையையும் ஒருசேரக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: உங்களுக்குத் தெரியப்படுத்துகிறோம்
  rationale: ‘தெரியப்படுத்துதல்’ என்பது γνωρίζω என்பதன் ‘அறியச் செய்தல்’ என்ற பொருளையும் நிகழ்காலச் செயப்பாட்டு வினையையும் இயல்பான நவீனத் தமிழில் தருகிறது; ‘நீங்கள் அறிந்துகொள்ள விரும்புகிறோம்’ போன்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் மென்மையான உரைமாற்றத்தைக் குறிக்கிறது. தமிழில் வசனத்தின் அமைப்பே அந்த மாற்றத்தை இயல்பாக வெளிப்படுத்துவதால் ‘ஆனால்’ அல்லது ‘இப்போது’ என்று தேவையற்ற வலிமை சேர்க்கப்படவில்லை.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவத்தை மூலத்துக்கு நெருக்கமாகப் பாதுகாக்கிறது. பவுலின் பயன்பாட்டில் இது முழுச் சபையினரையும் குறிக்கக்கூடும் என்பதால் அந்த உள்ளடக்கும் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: χάριν τοῦ θεοῦ
  choice: கடவுளின் அருளை
  rationale: χάρις என்பதன் பவுலிய இறையியல் பரப்பை ‘அருள்’ பாதுகாக்கிறது; அதை ‘கொடை’ அல்லது ‘தாராளம்’ என்று மட்டும் குறுக்கவில்லை. τοῦ θεοῦ என்பதன் உறவையும் இயல்பாகக் காட்டுகிறது.
- source_word: τὴν δεδομένην
  choice: அளிக்கப்பட்டுள்ள
  rationale: நிறைவுற்ற செயப்பாட்டு எச்சத்தின் முடிந்த செயலும் தொடரும் விளைவும் தமிழின் ‘அளிக்கப்பட்டுள்ள’ என்ற வடிவில் வெளிப்படுகின்றன.
- source_word: ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας
  choice: மக்கெதோனியாவிலுள்ள திருச்சபைகளிடையே
  rationale: ἐν குறிக்கும் செயல்பாட்டு வட்டத்தை ‘இடையே’ இயல்பாக வெளிப்படுத்துகிறது; மக்கெதோனியாவின் திருச்சபைகள் என்ற பெயருறவையும் ‘மக்கெதோனியாவிலுள்ள’ எனத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘கடவுளின் அருள்’ என்பதன் சூழல்சார் பொருள்
  choice: மக்கெதோனியத் திருச்சபைகளில் செயல்பட்ட கடவுளின் அருள்; அவர்களுடைய தாராள மனப்பான்மையும் அதன் வெளிப்பாடாக உள்ளடங்கலாம்
  alternative: அவர்களுடைய நன்கொடை மட்டுமே; அல்லது அவர்களுக்குக் கிடைத்த பொதுவான இறைதயவு மட்டுமே
  rationale: மூலத்தின் விரிவான χάρις சொல்லை ‘அருள்’ என்று வைத்திருப்பதால் கடவுளின் தயவையும் அது உருவாக்கிய தாராளக் கொடையையும் ஒரே நேரத்தில் சுட்டும் நோக்கமுள்ள பொருள் நெகிழ்வு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் திருமுகத்தின் கண்ணியமான தொனியைப் பேணும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சகோதரர்களே’, ‘திருச்சபைகள்’, ‘அருள்’ ஆகிய பரவலாக அறியப்பட்ட கிறிஸ்தவச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
