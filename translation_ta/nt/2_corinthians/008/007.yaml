id: 2CO.8.7
reference: 2 Corinthians 8:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: ta
  text: ஆனால், விசுவாசத்திலும் பேச்சிலும் அறிவிலும் முழு ஆர்வத்திலும், எங்களிடமிருந்து உங்களுக்குள் இருக்கும் அன்பிலும்—எல்லாவற்றிலும் நீங்கள் மிகுதியாய் இருக்கிறதுபோல, இந்தக் கிருபையிலும் மிகுதியாய் இருங்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள்மீது உங்களுக்குள்ள அன்பிலும்” எனப் பொருள்கொள்ளலாம். கிரேக்கச் சொற்றொடர் புரிந்துகொள்வதற்குக் கடினமானது; சில கையெழுத்துப் பிரதிகளில் “உங்களிடமிருந்து எங்களுக்குள் இருக்கும் அன்பு” என்று வாசிக்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: அதாவது, மனமுவந்து கொடுக்கும் இந்தக் கிருபையான செயலில்.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: நிறைந்திருப்பதுபோல / நிறைந்திருங்கள்
  rationale: இரு இடங்களிலும் வரும் ஒரே கிரேக்க வினையின் மிகுதி, நிறைவு ஆகிய கருத்துகளைத் தக்கவைத்து, கொரிந்தியரிடம் ஏற்கெனவே காணப்படும் நற்பண்புகளையும் கொடுக்கும் கிருபையில் வளர வேண்டிய அழைப்பையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: ἐν παντί
  choice: எல்லாவற்றிலும்
  rationale: பின்வரும் பண்புகள் அனைத்தையும் தொகுத்துக் காட்டும் கிரேக்கச் சொற்றொடரின் விரிவான பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: πίστει
  choice: விசுவாசத்திலும்
  rationale: இங்கு கிறிஸ்தவ நற்பண்புகளின் பட்டியலில் πίστις என்பதற்கான இயல்பான, நிலையான தமிழ் இணைச்சொல்.
- source_word: λόγῳ
  choice: பேச்சிலும்
  rationale: இச்சூழலில் λόγος என்பது பேசும் திறன் அல்லது வெளிப்பாட்டைக் குறிக்க வாய்ப்புள்ளதால், ‘வார்த்தை’ என்பதைவிட ‘பேச்சு’ இயல்பாக உள்ளது.
- source_word: γνώσει
  choice: அறிவிலும்
  rationale: பட்டியலின் சூழலுக்கு ஏற்ற நேரடியான மொழிபெயர்ப்பு.
- source_word: πάσῃ σπουδῇ
  choice: முழு ஆர்வத்திலும்
  rationale: σπουδή என்பதிலுள்ள ஊக்கம், முனைப்பு, தீவிர அக்கறை ஆகிய நுண்ணுணர்வுகளை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: எங்களிடமிருந்து உங்களுக்குள் இருக்கும் அன்பிலும்
  rationale: ஏற்றுக்கொள்ளப்பட்ட கிரேக்க வாசகத்திலுள்ள ἐξ ἡμῶν மற்றும் ἐν ὑμῖν ஆகிய இரு முன்னிடைச் சொற்றொடர்களையும் அழித்துவிடாமல் பாதுகாக்கிறது; வாசகத்தின் கடினத்தன்மையைத் தீர்மானமாக ஒரே பொருளுக்குள் சுருக்கவில்லை.
- source_word: χάριτι
  choice: கிருபையிலும்
  rationale: எருசலேம் பரிசுத்தவான்களுக்காகக் கொடுக்கும் செயலைச் சூழல் குறிப்பிட்டாலும், பவுலின் χάρις என்ற இறையியல் ஆழமுள்ள சொல்லை முதன்மை உரையில் பாதுகாக்கிறது.
theological_decisions:
- issue: எருசலேம் திரட்டின் சூழலில் χάρις என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘கிருபை’ என்று மொழிபெயர்த்து, அது கொடுக்கும் அருள்செயலைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் விளக்குதல்
  alternative: கொடுக்கும் அருள்செயல் / கொடை
  rationale: பவுல் பண உதவியை மட்டும் குறிப்பிடாமல், கொடுக்கும் செயலைக் கிருபையோடு இணைக்கிறார்; ‘கிருபை’ இந்த இறையியல் ஒலிப்பைத் தக்கவைக்கிறது.
- issue: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ என்ற கடினமான சொற்றொடரின் விளக்கம்
  choice: ‘எங்களிடமிருந்து உங்களுக்குள் இருக்கும் அன்பு’ என்ற வடிவில் முன்னிடைச் சொற்களைப் பாதுகாத்தல்
  alternative: எங்கள்மீது உங்களுக்குள்ள அன்பு
  rationale: தொடரியல் மற்றும் கையெழுத்துப் பிரதி வேறுபாடுகள் உள்ளதால், முதன்மை உரை ஓர் விளக்கத்தை மட்டுமே உறுதியாக்காமல் மூல வாசகத்தின் பதற்றத்தைத் தக்கவைக்கிறது; இயல்பான மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. கிரேக்கப் பட்டியல் அமைப்பைத் தக்கவைத்தபோதும் தமிழ் ஓட்டத்திற்காக கோடு பயன்படுத்தப்பட்டுள்ளது. ‘கிருபை’ என்ற திருச்சபைச் சொல்லின் இறையியல் ஆழம் பாதுகாக்கப்பட்டு, அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
