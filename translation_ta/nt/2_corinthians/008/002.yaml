- from: மிகுந்த உபத்திரவத்தால் சோதிக்கப்பட்டபோதும், அவர்களுடைய நிறைவான மகிழ்ச்சியும் கடும் வறுமையும் சேர்ந்து, அவர்களுடைய தாராள மனப்பான்மையின் செல்வமாகப் பெருக்கெடுத்தன.[a][b]
  to: கடும் உபத்திரவத்தின் பெரும் சோதனையில், அவர்களுடைய மகிழ்ச்சியின் மிகுதியும் அவர்களுடைய ஆழ்ந்த வறுமையும்[a], அவர்களுடைய தாராளத்தின் செல்வமாக[b] பொங்கிப் பெருகின.
  rationale: திருத்தம் மூலத்தின் சூழல் தொடரை concessive ஆக்காமல் காக்கிறது; κατὰ βάθους என்பதன் ஆழ உருவகத்தை முதன்மை உரலில் மீட்டெடுக்கிறது; இரண்டு காரண எழுவாய்களும் தாராளத்தின் செல்வமாகப் பொங்கிப் பெருகிய விளைவைத் தெளிவாக இணைக்கிறது. ἁπλότης-க்கு சூழலுக்கு ஏற்ற ‘தாராளம்’ தக்கவைக்கப்பட்டு, மாற்றுப்பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன. குறிகள் தொடர்புடைய சொற்களுக்கருகே நகர்த்தப்பட்டுள்ளன.
