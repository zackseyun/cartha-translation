reference: 2 Corinthians 8:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἐν πολλῇ δοκιμῇ θλίψεως ἡ περισσεία τῆς χαρᾶς αὐτῶν καὶ ἡ κατὰ βάθους πτωχεία αὐτῶν ἐπερίσσευσεν εἰς ⸂τὸ πλοῦτος⸃ τῆς ἁπλότητος αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: ta
  text: கடும் உபத்திரவத்தின் பெரும் சோதனையில், அவர்களுடைய மகிழ்ச்சியின் மிகுதியும் அவர்களுடைய ஆழ்ந்த வறுமையும்[a], அவர்களுடைய தாராளத்தின் செல்வமாக[b] பொங்கிப் பெருகின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேராக: ‘ஆழம் வரையிலான வறுமை’; அல்லது, ‘மிகக் கடுமையான வறுமை.’'
    reason: lexical_alternative
  - marker: b
    text: ‘தாராளம்’ என்பதற்குப் பதிலாக, ‘எளிமை’ அல்லது ‘ஒருமுக மனப்பான்மை’ என்றும் மொழிபெயர்க்கலாம். இங்கு பொருளுதவி வழங்குவது பற்றிய சூழல் இருப்பதால், இச்சொல் தாராளத்தைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: மிகுந்த உபத்திரவத்தால் சோதிக்கப்பட்டபோதும்
  rationale: δοκιμή என்பது சோதனையையும், θλίψις என்பது நெருக்கடி அல்லது உபத்திரவத்தையும் குறிக்கிறது. தமிழில் இயல்பாக அமைய, கிரேக்கப் பெயர்ச்சொல் அமைப்பு வினையெச்சத் தொடராக மாற்றப்பட்டுள்ளது; சூழலில் எதிர்மறையான நிலையிலும் ஏற்பட்ட விளைவை ‘போதும்’ வெளிப்படுத்துகிறது.
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: அவர்களுடைய நிறைவான மகிழ்ச்சி
  rationale: περισσεία குறிக்கும் மிகுதியை ‘நிறைவான’ இயல்பாகத் தெரிவிக்கிறது; பின்னுள்ள ἐπερίσσευσεν உடன் உள்ள சொல் விளையாட்டு ‘பெருக்கெடுத்தன’ என்பதால் ஓரளவு தக்கவைக்கப்படுகிறது.
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: கடும் வறுமை
  rationale: κατὰ βάθους என்பது வறுமையின் தீவிரத்தை வலியுறுத்தும் மொழிவழக்கு. ‘கடும் வறுமை’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; ஆழம் என்ற உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐπερίσσευσεν
  choice: பெருக்கெடுத்தன
  rationale: περισσεύω குறிக்கும் மிகுதியாகுதல் அல்லது பொங்கிப் பெருகுதல் என்ற இயக்கமுள்ள கருத்தை இது தருகிறது. கூட்டு எழுவாய்க்கு இயல்பான தமிழ்ப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἰς τὸ πλοῦτος
  choice: செல்வமாக
  rationale: εἰς இங்கு விளைவைச் சுட்டுகிறது. ‘செல்வமாக’ என்பது அந்த விளைவுறும் உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τῆς ἁπλότητος αὐτῶν
  choice: அவர்களுடைய தாராள மனப்பான்மை
  rationale: நன்கொடை வழங்கும் உடனடிச் சூழலில் ἁπλότης தாராளத்தைக் குறிக்கிறது. அதேவேளை அதன் அடிப்படையான எளிமை அல்லது ஒருமுகமான நேர்மை என்ற பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: பொருளுதவி வழங்கும் சூழலில் ἁπλότης என்பதன் பொருள்
  choice: தாராள மனப்பான்மை
  alternative: எளிமை; கபடமற்ற ஒருமுக மனம்; நேர்மை
  rationale: அத்தியாயத்தின் உடனடிச் சூழல் பரிசுத்தவான்களுக்கான பொருளுதவியைப் பற்றியது. எனவே தாராளமாகக் கொடுத்தல் முதன்மைப் பொருளாகத் தெரிகிறது; இருப்பினும் கிரேக்கச் சொல்லின் நேர்மை மற்றும் எளிமை சார்ந்த நிழற்பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் மிகுதி சார்ந்த மீளொலி ‘நிறைவான’ மற்றும் ‘பெருக்கெடுத்தன’ மூலம் ஓரளவு பிரதிபலிக்கப்படுகிறது. [a], [b] குறிகள் அவை விளக்கும் சொற்றொடர்களின் பின்னர் அல்லாமல் வசன முடிவில் இடப்பட்டுள்ளன; இரு குறிப்புகளும் மைய உரையில் தெளிவாகக் குறிக்கப்பட்டுள்ளன.
