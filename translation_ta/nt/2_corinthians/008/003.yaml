  text: ὅτι κατὰ δύναμιν, μαρτυρῶ, καὶ ⸀παρὰ δύναμιν, αὐθαίρετοι
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/003.yaml
  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: ta
  text: ஏனெனில், அவர்கள் தங்கள் ஆற்றலுக்கு ஏற்பவும், தங்கள் ஆற்றலுக்கு மீறியும்[a], தாங்களாகவே[b] கொடுத்தார்கள் என்று நான் சான்றளிக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் வசதிக்கு ஏற்பவும், தங்கள் வசதிக்கு மீறியும்.’
    reason: δύναμις இங்கு பொதுவான ஆற்றலையோ பொருளாதார வசதியையோ குறிக்கக்கூடும்.
  - marker: b
    text: அல்லது, ‘தங்கள் சொந்த விருப்பத்தின்படி’ அல்லது ‘மனமுவந்து.’
    reason: αὐθαίρετοι என்பது கட்டாயமின்றித் தாமாக முன்வந்து செயல்படுவதைக் குறிக்கிறது.
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்டதை இந்தச் சொல் விளக்கி ஆதரிக்கிறது; எனவே காரணத் தொடர்பை இயல்பாகக் காட்டும் ‘ஏனெனில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: κατὰ δύναμιν
  choice: தங்கள் ஆற்றலுக்கு ஏற்ப
  rationale: κατά இங்கு அளவு அல்லது வரம்பைக் குறிக்கிறது. ‘ஆற்றலுக்கு ஏற்ப’ என்பது அவர்களால் இயன்ற அளவைக் காட்டுவதோடு, அடுத்த சொற்றொடருடனான சொல்லாட்சிச் சமநிலையையும் காக்கிறது.
- source_word: μαρτυρῶ
  choice: நான் சான்றளிக்கிறேன்
  rationale: நிகழ்கால வினைச்சொல்லின் தனிப்பட்ட, வலியுறுத்தலான சாட்சியத்தை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: καὶ παρὰ δύναμιν
  choice: தங்கள் ஆற்றலுக்கு மீறியும்
  rationale: παρά இங்கு வழக்கமான வரம்பைத் தாண்டுவதைக் குறிக்கிறது. முந்தைய ‘ஆற்றலுக்கு ஏற்ப’ என்பதுடன் உள்ள கருத்து முரணும் சொல்லாட்சித் தொடர்பும் பாதுகாக்கப்படுகின்றன.
- source_word: αὐθαίρετοι
  choice: தாங்களாகவே
  rationale: கட்டாயத்தினால் அல்லாமல், தங்கள் சொந்த முனைப்பில் செயல்பட்டார்கள் என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: αὐθαίρετοι என்பதுடன் வெளிப்படையாக இல்லாத வினைச்சொல்
  choice: சூழலிலிருந்து ‘கொடுத்தார்கள்’ என்பதைச் சேர்த்தல்
  alternative: ‘தாங்களாகவே இருந்தார்கள்’ என்று சொற்சொல்லாக, ஆனால் தெளிவின்றி மொழிபெயர்த்தல்
  rationale: கிரேக்க வாக்கியம் சுருக்கமாக அமைந்துள்ளது; 2–4ஆம் வசனங்களின் சூழலில் பேசப்படுவது கொடுப்பதைப் பற்றியே. தமிழில் முழுமையான, இயல்பான வாக்கியமாக இருக்க ‘கொடுத்தார்கள்’ என்பதைச் சேர்ப்பது புதிய கருத்தை புகுத்தாமல் உட்கிடையான செயலை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘ஆற்றலுக்கு ஏற்பவும்—ஆற்றலுக்கு மீறியும்’ என்ற இணை அமைப்பு மூலத்தின் வலுவான எதிர்மறை ஒப்புமையைப் பாதுகாக்கிறது; ‘தாங்களாகவே’ என்பது தன்னார்வத்தையும் சொந்த முனைப்பையும் சுருக்கமாகத் தெரிவிக்கிறது.
