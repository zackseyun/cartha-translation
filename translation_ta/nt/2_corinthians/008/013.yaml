id: 2CO.8.13
reference: 2 Corinthians 8:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ἵνα ἄλλοις ἄνεσις, ⸀ὑμῖν θλῖψις· ἀλλ’ ἐξ ἰσότητος
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/013.yaml
  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: ta
  text: ஏனெனில், மற்றவர்களுக்கு நிவாரணமும் உங்களுக்குத் துன்பமும் உண்டாக வேண்டும் என்பது என் நோக்கம் அல்ல; மாறாக, சமநிலை[a] இருக்க வேண்டும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சமத்துவம்’ அல்லது ‘நியாயம்’; கிரேக்கச் சொல் நியாயமான சமப்படுத்தலைக் குறிக்கிறது; அனைவரிடமும் உடைமைகள் கண்டிப்பாக ஒரே அளவில் இருக்க வேண்டும் என்பதை அவசியமாகக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ ... ἵνα
  choice: '... வேண்டும் என்பது என் நோக்கம் அல்ல'
  rationale: γάρ தரும் முந்தைய கருத்தை விளக்கும் தொடர்பைத் தமிழில் வாக்கிய ஓட்டம் இயல்பாக வெளிப்படுத்துகிறது; ἵνα இங்கு நோக்கத்தைக் குறிக்கும் என்பதால், கிரேக்கத்தில் மறைந்துள்ள எண்ண வினையை ‘என் நோக்கம்’ என்று வெளிப்படையாக வழங்குகிறது.
- source_word: ἄλλοις ἄνεσις
  choice: மற்றவர்களுக்கு நிவாரணம்
  rationale: ἄνεσις இச்சூழலில் சுமை அல்லது நெருக்கடியிலிருந்து கிடைக்கும் தளர்வைக் குறிக்கிறது; பொருளாதார உதவியின் சூழலை ‘நிவாரணம்’ தெளிவாகக் காக்கிறது.
- source_word: ὑμῖν θλῖψις
  choice: உங்களுக்குத் துன்பம்
  rationale: θλῖψις அழுத்தம், நெருக்கடி, துன்பம் ஆகிய பொருள்களைக் கொண்டது. கொடையால் கொரிந்தியர்கள் துன்பநிலைக்குத் தள்ளப்படுவதைப் பவுல் நோக்கவில்லை என்ற நடைமுறைப் பொருளை ‘துன்பம்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: மாறாக, சமநிலை இருக்க வேண்டும்
  rationale: ἰσότης சமத்துவம் அல்லது நியாயமான சமநிலையைக் குறிக்கலாம். அடுத்த வசனங்களில் வரும் பரஸ்பரக் குறைநிறைவை முன்னிட்டு ‘சமநிலை’ என்பது கடுமையான ஒரேமாதிரித்தன்மையைத் திணிக்காமல் கருத்தை இயல்பாக வெளிப்படுத்துகிறது; ἐξ என்பதன் அடிப்படை/நெறி சார்ந்த உறவு தமிழில் இந்த அமைப்பில் உட்பொதிக்கப்படுகிறது.
theological_decisions:
- issue: பொருள் பகிர்வின் சூழலில் ἰσότης என்பதன் பொருள்
  choice: சமநிலை
  alternative: சமத்துவம்; நியாயம்
  rationale: இச்சொல் அனைவரும் ஒரே அளவு சொத்துகளை வைத்திருக்க வேண்டும் என்ற கட்டாயமான பொருளைத் தரவேண்டியதில்லை; நியாயமான சமப்படுத்தலையும் குறிக்கலாம். ‘சமநிலை’ இந்தத் திறந்த தன்மையையும் அடுத்த வசனங்களின் பரஸ்பர உதவி நோக்கையும் காக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை. கிரேக்கத்தின் சுருக்கமான எதிர்மறை–நேர்மறை அமைப்பை இயல்பான தமிழாக்கமாக வழங்கி, தொடரும் வசனத்துடனான இணைப்பைக் காட்ட இறுதி நீள்கோடு காக்கப்பட்டுள்ளது.
