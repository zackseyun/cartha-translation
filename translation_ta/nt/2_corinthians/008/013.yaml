    issue: The explanatory conjunction γάρ is not represented.
    rationale: The verse begins οὐ γὰρ, explaining and qualifying the preceding appeal. Tamil should retain this connection with ‘ஏனெனில்’ (or an equivalent) rather than beginning abruptly with the negative statement.
