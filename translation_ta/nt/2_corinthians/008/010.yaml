  to: இந்த விஷயத்தில் என் கருத்தைத் தெரிவிக்கிறேன்[a]. கடந்த ஆண்டிலேயே இதைச் செய்ய மட்டுமல்ல, செய்ய விரும்பவும்[b] தொடங்கிய உங்களுக்கு இது பயனுள்ளதாகும்.
