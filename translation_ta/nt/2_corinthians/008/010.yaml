source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: ta
  text: இந்த விஷயத்தில் என் கருத்தைத் தெரிவிக்கிறேன்[a]. கடந்த ஆண்டிலேயே இதைச் செய்ய மட்டுமல்ல, செய்ய விரும்பவும்[b] தொடங்கிய உங்களுக்கு இது பயனுள்ளதாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கருத்து’ என்பதற்கு ‘ஆலோசனை’ அல்லது ‘அபிப்பிராயம்’ என்றும் மொழிபெயர்க்கலாம். பவுல் இதைக் கட்டளையாகச் சொல்லாமல், சிந்தித்த பரிந்துரையாக முன்வைக்கிறார்.
    reason: lexical_alternative
  - marker: b
    text: ‘செய்ய மனமுள்ளவர்களாகவும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் மனவிருப்பத்தையும் நடைமுறைச் செயலையும் வேறுபடுத்திக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: கருத்தை
  rationale: இச்சொல் சிந்தித்துத் தெரிவிக்கப்படும் கருத்தையோ பரிந்துரையையோ குறிக்கிறது. சூழலில் பவுல் இதைக் கட்டளையாக அல்லாமல் தனது கருத்தாக முன்வைப்பதால், ‘கருத்து’ என்பது அதன் தீவிரத்தைக் குறைக்காமலும் கட்டளை என்ற பொருளைச் சேர்க்காமலும் உள்ளது.
- source_word: ἐν τούτῳ
  choice: இந்த விஷயத்தில்
  rationale: விவாதிக்கப்படும் குறிப்பிட்ட காரியமாகிய நிதித் திரட்டலைச் சுட்டுகிறது; இயல்பான தமிழில் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: δίδωμι
  choice: தெரிவிக்கிறேன்
  rationale: γνώμην என்பதுடன் சேர்ந்து ‘கருத்தைத் தெரிவிக்கிறேன்’ என்பது இயல்பான நவீனத் தமிழ்; மூலத்தின் நிகழ்கால வினையையும் காக்கிறது.
- source_word: συμφέρει
  choice: நன்மையானது
  rationale: ஒருவருக்குப் பயனாக அல்லது சாதகமாக இருப்பதைத் தெளிவாகக் கூறுகிறது; வணிக இலாபம் என்ற தேவையற்ற நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: οἵτινες
  choice: ஏனெனில் … நீங்கள்
  rationale: கொரிந்தியர்கள் முன்பே தொடங்கியிருந்ததே இது அவர்களுக்கு நன்மையானது என்பதற்கான விளக்கமாக அமைகிறது. தமிழில் இயல்புக்காக காரணவிளக்கத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: τὸ ποιῆσαι
  choice: இதைச் செய்ய
  rationale: நிதித் திரட்டும் முயற்சியை நடைமுறையில் செய்தலைக் குறிக்கிறது; சூழலிலிருந்து ‘இதை’ என்பதன் குறிப்பு தெளிவாகிறது.
- source_word: τὸ θέλειν
  choice: செய்ய விரும்பவும்
  rationale: வெளிப்புறச் செயலிலிருந்து உள்ளார்ந்த மனவிருப்பத்தை வேறுபடுத்துகிறது; ‘செய்ய’ என்பதைக் கூட்டுவது தமிழில் நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: προενήρξασθε
  choice: தொடங்கினீர்கள்
  rationale: முன்னரே தொடங்கிய செயலைக் குறிக்கிறது. ἀπὸ πέρυσι காலத்தை வெளிப்படையாகக் கூறுவதால், தமிழில் கூடுதலாக ‘முன்னரே’ என்று மீண்டும் கூறத் தேவையில்லை.
- source_word: ἀπὸ πέρυσι
  choice: கடந்த ஆண்டே
  rationale: முந்தைய ஆண்டில் தொடங்கியதைக் குறிக்கிறது. ‘-ஏ’ முன்னதாகவே தொடங்கியிருந்ததை இயல்பாக வலியுறுத்துகிறது; இடைவிடாத தொடர்ச்சியை அவசியமாகச் சுமத்துவதில்லை.
theological_decisions:
- issue: பவுலின் கூற்றுக்கும் அப்போஸ்தல அதிகாரத்திற்கும் உள்ள தொடர்பு
  choice: பவுல் நேரடிக் கட்டளை இடாமல், சிந்தித்துத் தீர்மானித்த தனது கருத்தை அல்லது பரிந்துரையைத் தெரிவிக்கிறார்.
  alternative: பவுல் அதிகாரபூர்வமான கட்டளையை வழங்குகிறார்.
  rationale: உடனடியான சூழல் கட்டளையையும் கருத்தையும் வேறுபடுத்துகிறது (2 கொரிந்தியர் 8:8, 10). ‘என் கருத்தைத் தெரிவிக்கிறேன்’ என்பது அவரது மேய்ப்புப் பரிந்துரையின் முக்கியத்துவத்தைத் தாழ்த்தாமலும் அதை வெளிப்படையான கட்டளையாக மிகைப்படுத்தாமலும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் உள்ள ‘செய்தல் / விரும்புதல்’ என்ற எதிர்பாராத வரிசை மாற்றப்படாமல் காக்கப்பட்டுள்ளது. கட்டளை என்ற பொருளைச் சேர்க்காமல் பவுலின் கருத்தின் தீவிரம் தக்கவைக்கப்பட்டுள்ளது.
