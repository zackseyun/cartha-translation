source:
  edition: SBLGNT
  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: ta
  text: ஆனால் இப்போது அதைச் செய்து முடிக்கவும்[a]. அதைச் செய்ய விரும்பிய ஆர்வம் இருந்ததுபோலவே, உங்களிடம் இருப்பதற்கேற்ப அதைச் செய்து முடிப்பதும் இருக்கட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதை நிறைவேற்றுங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘உங்களிடம் இருப்பதிலிருந்து’; அதாவது, இப்போது உங்களிடம் உள்ள வசதிக்கேற்ப.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: ஆனால் இப்போது
  rationale: முந்தைய விருப்பத்திலிருந்து தற்போதைய செயலுக்கு மாறுவதைச் சுட்டும் கால மற்றும் மென்மையான எதிர்மறைத் தொடர்பை இயல்பாகப் பாதுகாக்கிறது.
- source_word: τὸ ποιῆσαι
  choice: அதைச் செய்து முடிப்பது
  rationale: முன்னரே திட்டமிட்ட நன்கொடைச் செயலைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள வினையெச்சத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐπιτελέσατε
  choice: நிறைவேற்றுங்கள்
  rationale: தொடங்கிய செயலை முழுமைக்கு கொண்டுவரும் பொருளை dignified modern Tamil-இல் தருகிறது; பின்னர் வரும் ἐπιτελέσαι உடனான சொல்லிணைப்பையும் காக்கிறது.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: விரும்புவதில் இருந்த ஆர்வம்
  rationale: செய்ய வேண்டும் என்ற மனவிருப்பத்தோடு கூடிய முனைப்பை வெளிப்படுத்துகிறது; வெறும் சம்மதம் என்ற அளவுக்குக் குறைக்கவில்லை.
- source_word: οὕτως καὶ τὸ ἐπιτελέσαι
  choice: அதை நிறைவேற்றுவதும் இருக்கட்டும்
  rationale: விருப்பத்துக்கும் நிறைவேற்றத்துக்கும் இடையிலான ஒப்புமை மற்றும் சமச்சீரை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐκ τοῦ ἔχειν
  choice: உங்களிடம் இருப்பதிலிருந்து
  rationale: கிடைக்கிற வளமே கொடையின் ஆதாரமும் அளவும் என்பதைச் சொல்கிறது; 'வசதிக்கேற்ப' என்று விளக்கமாக மாற்றி மூலத்தின் அமைப்பை மறைக்கவில்லை.
theological_decisions:
- issue: கிடைக்கிற வசதியிலிருந்து கொடுப்பதன் உட்கருத்து
  choice: தற்போது அவர்களிடம் இருப்பதிலிருந்து வாக்குறுதியளித்த நன்கொடையை நிறைவேற்றுமாறு வசனம் அறிவுறுத்துகிறது.
  alternative: ஒருவரின் வசதியைப் பொருட்படுத்தாமல் எந்த நல்ல நோக்கத்தையும் நிறைவேற்ற வேண்டும் என்ற பொதுவான கட்டளை.
  rationale: உடனடிச் சூழல் கொரிந்தியரின் நன்கொடையைப் பற்றியது; ἐκ τοῦ ἔχειν அவர்கள் கொண்டிருப்பதிலிருந்து நிறைவேற்றுவதைத் தெளிவாக வரையறுக்கிறது. ஆகவே அவர்களின் வசதிக்கு அப்பாற்பட்ட கொடையை இவ்வசனம் கோருவதாக மொழிபெயர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதவாக்கியத்திற்குரிய செறிவும் காக்கப்பட்டுள்ளன. ‘ஆர்வம்—நிறைவேற்றுதல்’ என்ற மூல ஒப்புமையும், ‘உங்களிடம் இருப்பதிலிருந்து’ என்ற அளவுக் கட்டுப்பாடும் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
