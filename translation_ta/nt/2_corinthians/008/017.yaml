id: 2CO.8.17
reference: 2 Corinthians 8:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι τὴν μὲν παράκλησιν ἐδέξατο, σπουδαιότερος δὲ ὑπάρχων αὐθαίρετος ἐξῆλθεν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: ta
  text: ஏனெனில், அவர் வேண்டுகோளை[a] ஏற்றுக்கொண்டார்; மேலும், இன்னும் அதிக ஆர்வமுள்ளவராக இருந்த அவர்[b], தாமாகவே[c] உங்களிடம் வரப் புறப்பட்டார்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வேண்டுகோள்” என்பதற்குப் பதிலாக “வலியுறுத்தல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இன்னும் அதிக ஆவலுள்ளவராக” அல்லது “இன்னும் அதிக அக்கறையுள்ளவராக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “தன் சொந்த முனைப்பினால்.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது “உங்களிடம் வந்தார்.” கடிதம் பெறுபவர்களின் நோக்குநிலையிலிருந்து கடந்தகாலச் செயலை இவ்வாறு கூறியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நன்றிக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க/காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: παράκλησιν
  choice: வேண்டுகோளை
  rationale: இங்கு ஆறுதல் என்பதைக் காட்டிலும், தீத்துவிடம் விடுக்கப்பட்ட வலியுறுத்தலுடனான வேண்டுகோளையே சூழல் குறிக்கிறது.
- source_word: ἐδέξατο
  choice: ஏற்றுக்கொண்டார்
  rationale: வேண்டுகோளை மனமுவந்து ஏற்று அதற்கு இணங்கியதைக் குறிக்கும் இயல்பான தமிழ் சொல்லாக்கம்.
- source_word: σπουδαιότερος
  choice: இன்னும் அதிக ஆர்வமுள்ளவராக
  rationale: ஒப்பீட்டு வடிவத்தின் ‘அதிகமான/மேலான ஆர்வம்’ என்ற பொருளை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: ὑπάρχων
  choice: இருந்த அவர்
  rationale: கிரேக்க நிகழ்காலப் பெயரெச்சத்தின் நிலையைக் கூடுதல் விளக்கமின்றி இயல்பான தமிழில் தருகிறது.
- source_word: αὐθαίρετος
  choice: தாமாகவே
  rationale: வெளிப்புறக் கட்டாயத்தால் அல்லாமல், சொந்த விருப்பத்திலும் முனைப்பிலும் செயல்பட்டதைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: உங்களிடம் வரப் புறப்பட்டார்
  rationale: ἐξῆλθεν என்பதன் புறப்படுதல் அம்சத்தையும் πρὸς ὑμᾶς என்பதன் இலக்கு நோக்கிய இயக்கத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: தீத்து பவுலின் வேண்டுகோளுக்குப் பதிலாக மட்டுமே சென்றாரா, அல்லது சொந்த முனைப்பாலும் சென்றாரா?
  choice: வேண்டுகோளை ஏற்றுக்கொண்டார்; மேலும்… தாமாகவே… புறப்பட்டார்
  alternative: வேண்டுகோளை ஏற்றுக்கொண்டதால் தாமாகவே புறப்பட்டார்
  rationale: மூலத்தில் அவரது ஏற்றுக்கொள்ளுதலும் அதைவிட மிகுந்த சொந்த ஆர்வமும் அருகருகே வைக்கப்படுகின்றன; ஒன்றை மற்றொன்றுக்குள் கரைத்துவிடாமல் அந்தத் tension-ஐப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இன்னும் அதிக’ என்பது கிரேக்க ஒப்பீட்டு வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது; ‘வரப் புறப்பட்டார்’ என்பது புறப்பட்டுச் செல்வதையும் பெறுபவர்களை நோக்கிய இயக்கத்தையும் ஒன்றாக இயல்பாக வெளிப்படுத்துகிறது.
