reference: 2 Corinthians 8:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: στελλόμενοι τοῦτο μή τις ἡμᾶς μωμήσηται ἐν τῇ ἁδρότητι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/020.yaml
  text: taking this precaution, so that no one may blame us in regard to this generous gift being administered by us,
translation:
  language: ta
  text: நாங்கள் நிர்வகித்துவரும் இந்தத் தாராளமான நன்கொடையைக்[a] குறித்து எவரும் எங்களைக் குறைகூறாதபடி, இந்த முன்னெச்சரிக்கையை மேற்கொள்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தப் பெருந்தொகையான நன்கொடையைக்”; கிரேக்கச் சொல் தாராளமான அல்லது மிகுதியான பங்களிப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: இந்த முன்னெச்சரிக்கையை எடுத்துக்கொள்கிறோம்
  rationale: இடைநிலைப் பங்கேற்புவினை இங்கு ஏற்படக்கூடிய குற்றச்சாட்டைத் தவிர்க்க முன்கூட்டியே நடவடிக்கை எடுப்பதைக் குறிக்கிறது. தமிழ் வாக்கிய ஓட்டத்திற்காக இது முதன்மை வினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: எவரும் எங்கள்மீது குற்றம் சுமத்தாதபடி
  rationale: μή உடன் வரும் துணைவினை எதிர்பார்க்கப்படும் குற்றச்சாட்டைத் தடுக்கும் நோக்கத்தை வெளிப்படுத்துகிறது; μωμάομαι என்பதன் பழிசுமத்துதல் அல்லது குறைகாணுதல் என்ற பொருளை இது இயல்பாகத் தருகிறது.
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: இந்தத் தாராளமான நன்கொடையைக் குறித்து
  rationale: ἐν இங்கு குற்றச்சாட்டு எழக்கூடிய பொருள் அல்லது துறையைக் குறிக்கிறது. ἁδρότης மிகுதி அல்லது தாராளத்தைச் சுட்டுகிறது; காணிக்கைத் திரட்டின் சூழலில் ‘தாராளமான நன்கொடை’ அதன் பொருளையும் தன்மையையும் தெளிவாக்குகிறது.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: நாங்கள் நிர்வகித்துவரும்
  rationale: நிவாரண நிதியின் சூழலில் διακονέω சேவை செய்வதோடு அதை பொறுப்பாகக் கையாளுதல் அல்லது நிர்வகித்தலையும் குறிக்கிறது. நிகழ்ந்துவரும் செயலை ‘நிர்வகித்துவரும்’ காக்கிறது.
theological_decisions:
- issue: நன்கொடை கையாளுதலில் பவுலின் அக்கறையின் தன்மை
  choice: நிதி நிர்வாகத்தில் பழிச்சொல் எழாதபடி மேற்கொள்ளும் நடைமுறை முன்னெச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை வெறும் பயண ஏற்பாடு அல்லது பொதுவான தவிர்ப்பு நடவடிக்கையாக மட்டும் மொழிபெயர்த்தல்.
  rationale: கிரேக்க வாக்கியம் பவுலையும் அவருடைய உடனுழைப்பாளர்களையும் குறித்து குற்றச்சாட்டு எழுவதைத் தடுப்பதை நேரடியாக வலியுறுத்துகிறது; இதற்கு மேலான கோட்பாட்டுக் கருத்துகள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட பங்கேற்புவினை அமைப்பு தமிழில் தெளிவான முதன்மை வினை அமைப்பாக மாற்றப்பட்டாலும், முன்னெச்சரிக்கை, குற்றச்சாட்டு, பொறுப்பான நிர்வாகம் ஆகிய மையக் கருத்துகள் காக்கப்பட்டுள்ளன.
