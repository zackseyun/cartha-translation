revisions:
- from: நாங்கள் நிர்வகித்துவரும் இந்தத் தாராளமான நன்கொடையைக்[a] குறித்து எவரும் எங்கள்மீது குற்றம் சுமத்தாதபடி, இந்த முன்னெச்சரிக்கையை எடுத்துக்கொள்கிறோம்.
  to: நாங்கள் நிர்வகித்துவரும் இந்தத் தாராளமான நன்கொடையைக்[a] குறித்து எவரும் எங்களைக் குறைகூறாதபடி, இந்த முன்னெச்சரிக்கையை மேற்கொள்கிறோம்.
