id: 2CO.8.23
reference: 2 Corinthians 8:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: ta
  text: தீத்துவைப் பொறுத்தவரை, அவர் என் பங்காளியும் உங்களுக்காகப் பணியாற்றும் என் உடன் பணியாளரும் ஆவார்; எங்கள் சகோதரர்களைப் பொறுத்தவரை, அவர்கள் திருச்சபைகளின் தூதுவர்கள்[a], மேசியாவின் மகிமை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திருச்சபைகளின் அப்போஸ்தலர்கள்.’ கிரேக்கச் சொல் அனுப்பப்பட்ட தூதுவர்கள் அல்லது பிரதிநிதிகள் என்றும், பரந்த பொருளில் அப்போஸ்தலர்கள் என்றும் பொருள்படலாம்; இங்கு திருச்சபைகளின் பிரதிநிதிகள் என்பது சூழலுக்கு மிகவும் பொருந்துகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘கிறிஸ்துவின் மகிமை.’ Χριστός இங்கு பட்டப்பெயராக இருப்பதால் முதன்மை உரையில் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: தீத்துவைப் பொறுத்தவரை
  rationale: இணையான இரு தரப்புகளை அறிமுகப்படுத்தும் சுருக்கமான கிரேக்க அமைப்பை, இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κοινωνὸς ἐμὸς
  choice: என் பங்காளி
  rationale: பணி மற்றும் பங்கேற்பில் உடனிருப்பவரைக் குறிக்கும் κοινωνός என்பதன் உறவுசார் பொருளைப் பாதுகாக்கிறது.
- source_word: εἰς ὑμᾶς συνεργός
  choice: உங்களுக்காகப் பணியாற்றும் என் உடன் பணியாளர்
  rationale: εἰς ὑμᾶς என்பதன் கொரிந்தியரை நோக்கிய பணியைத் தெரிவிக்கிறது; ‘உங்கள் நன்மைக்காக’ என்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἀδελφοὶ ἡμῶν
  choice: நம் சகோதரர்கள்
  rationale: இச்சூழலில் குறிப்பிடப்படும் ஆண் பிரதிநிதிகளுக்கு ஏற்றவாறு கிரேக்க ஆண்பால் பன்மையைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: திருச்சபைகளின் தூதுவர்கள்
  rationale: இங்கு காணிக்கைப் பணிக்காகத் திருச்சபைகளால் அனுப்பப்பட்ட பிரதிநிதிகள் என்ற பரந்த பொருள் சூழலுக்குப் பொருந்துகிறது; குறிப்பிட்ட திருத்தூதர் பதவியைத் தேவையின்றி முன்வைப்பதில்லை.
- source_word: δόξα Χριστοῦ
  choice: மேசியாவின் மகிமை
  rationale: வினையற்ற, விளக்க இணைப்பாக உள்ள கிரேக்கச் சொற்றொடரை நேரடியாகப் பாதுகாக்கிறது; Χριστός இங்கு பட்டப்பெயராக இருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: பெயரிடப்படாத சகோதரர்களைக் குறிக்கும் ἀπόστολοι என்பதன் பொருள்
  choice: திருச்சபைகளின் தூதுவர்கள்
  alternative: திருச்சபைகளின் அப்போஸ்தலர்கள்
  rationale: காணிக்கை தொடர்பான பணியில் திருச்சபைகளைப் பிரதிநிதித்துவப்படுத்தும் அனுப்பப்பட்டவர்களைச் சூழல் சுட்டுகிறது. எனினும் கிரேக்கச் சொல்லின் பரந்த ‘அப்போஸ்தலர்கள்’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுகிறது. எனவே அதன் பொருளை மொழிபெயர்க்கும் ‘மேசியா’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது; தமிழில் மரபான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: δόξα Χριστοῦ என்ற வினையற்ற சொற்றொடரின் தொடர்பு
  choice: மேசியாவின் மகிமை
  alternative: மேசியாவுக்கு மகிமை சேர்ப்பவர்கள்
  rationale: மூலத்தின் சுருக்கத்தையும் உருவகத் தீவிரத்தையும் பாதுகாக்க நேரடியான பெயர்ச்சொல் அமைப்பு வைக்கப்படுகிறது; அவர்களே மேசியாவின் மகிமையை வெளிப்படுத்துகிறார்கள் என்ற விளக்கம் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரு இணையான அறிமுகங்களும் வினையற்ற இறுதி விளக்கமும் பாதுகாக்கப்பட்டுள்ளன; இறுதி ‘மேசியாவின் மகிமை’ என்பதன் இறையியல் நிறைவும் சுருக்கமும் விளக்கவுரையால் மெலிதாக்கப்படவில்லை.
