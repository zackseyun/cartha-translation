  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: ta
  text: ஏனெனில், மனவிருப்பம் இருந்தால்[a], ஒருவரிடம் எது இருக்கிறதோ அதற்கு ஏற்ப அது ஏற்றுக்கொள்ளத்தக்கது[b]; அவரிடம் இல்லாததற்கு ஏற்ப அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனவிருப்பம்’ என்பதற்கு ‘ஆர்வம்’ அல்லது ‘முன்வரும் விருப்பம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘ஒருவரிடம் எது இருக்குமோ அதற்கு ஏற்ப ... அவரிடம் இல்லாததற்கு ஏற்ப அல்ல.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: கொடுக்க மனவிருப்பம்
  rationale: இந்தச் சொல் விருப்பத்தோடும் ஆர்வத்தோடும் முன்வரும் மனநிலையைக் குறிக்கிறது. சூழலில் கொடுப்பதைப் பற்றிய விருப்பமே பேசப்படுவதால், இயல்பான தமிழுக்காக ‘கொடுக்க’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டது; அளவுக்கு மீறிய உளவியல் விளக்கம் தவிர்க்கப்பட்டது.
- source_word: πρόκειται
  choice: இருந்தால்
  rationale: இந்த இடத்தில் இச்சொல் ‘முன்வைக்கப்பட்டிருந்தால்’ என்ற சொல்லாட்சியைவிட, அந்த மனவிருப்பம் உண்மையில் இருக்கிறது என்ற பொருளைக் கொடுக்கிறது.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: ஒருவரிடம் இருப்பதற்கு ஏற்ப
  rationale: ஒருவரிடம் உண்மையில் உள்ள வசதியே அளவுகோல் என்பதை இது இயல்பான தமிழில் தெரிவிக்கிறது. கிரேக்கத்தின் பொதுமையான ஒருமை பாலினச் சுட்டில்லாமல் பாதுகாக்கப்படுகிறது.
- source_word: εὐπρόσδεκτος
  choice: ஏற்றுக்கொள்ளத்தக்கது
  rationale: இது வரவேற்கத்தக்கது அல்லது அங்கீகரிக்கத்தக்கது என்ற மதிப்பீட்டுப் பொருளைத் தருகிறது. யாரால் ஏற்றுக்கொள்ளப்படுகிறது என்பதை மொழிபெயர்ப்பு கூடுதலாகத் தீர்மானிக்கவில்லை.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: அவரிடம் இல்லாததற்கு ஏற்ப அல்ல
  rationale: ஒருவரிடம் இருப்பதும் இல்லாததும் என்ற பவுலின் நேரடியான எதிர்மறை இணைப்பைப் பாதுகாக்கிறது; இல்லாத வசதியின் அடிப்படையில் மதிப்பிடப்படுவதில்லை என்ற கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: εἰ γὰρ
  choice: ஏனெனில் ... இருந்தால்
  rationale: γὰρ என்பதன் விளக்கத் தொடர்பையும் εἰ என்பதன் நிபந்தனைத் தன்மையையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஏற்றுக்கொள்ளப்படுவதற்கான மறைமுக அளவுகோலும் அதை ஏற்றுக்கொள்பவரும்
  choice: கொடுக்க மனவிருப்பம் இருக்கும்போது, ஒருவரிடம் உண்மையில் உள்ளதற்கு ஏற்ப கொடுப்பது ஏற்றுக்கொள்ளத்தக்கது என்று மட்டும் கூறப்பட்டுள்ளது; அதை ஏற்றுக்கொள்பவர் யார் என்பது குறிப்பிடப்படவில்லை.
  alternative: இது கடவுளால் ஏற்றுக்கொள்ளப்படுகிறது அல்லது திருச்சபையால் ஏற்றுக்கொள்ளப்படுகிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: εὐπρόσδεκτος ஏற்றுக்கொள்ளப்படுதலைக் குறித்தாலும், அந்த ஏற்றுக்கொள்ளுதலின் செய்பவரை வசனம் வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே கடவுள் அல்லது சமூகம் என்று மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொடுக்க மனவிருப்பம்’ என்பது உடனடி காணிக்கைச் சூழலைத் தெளிவுபடுத்துகிறது. ஏற்றுக்கொள்பவர் கடவுளா அல்லது சமுதாயமா என்ற மூலத்தின் தெளிவின்மை அப்படியே வைக்கப்பட்டுள்ளது.
