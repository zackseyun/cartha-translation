source:
  edition: SBLGNT
  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: ta
  text: ஆகவே, தீத்து முன்பே தொடங்கியிருந்தபடியே, உங்களிடையே இந்த அருள்செயலையும்[a] நிறைவேற்றும்படி நாங்கள் அவரை வலியுறுத்தினோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த அருள்நிறைந்த பணியையும்”; சொல்லுக்குச் சொல், “இந்த அருளையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: வலியுறுத்திக் கேட்டுக்கொண்டோம்
  rationale: தீத்து ஒரு செயலை மேற்கொள்ளும்படி பவுலும் அவருடைய உடன் ஊழியர்களும் தீவிரமாக வேண்டியதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; வெறும் ‘ஊக்கப்படுத்தினோம்’ என்பதைவிட இச்சூழலின் வலிமையைச் சிறப்பாகக் காக்கிறது.
- source_word: Τίτον
  choice: தீத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: καθὼς προενήρξατο
  choice: முன்பு தொடங்கியிருந்தபடியே
  rationale: προενήρξατο என்பதில் உள்ள முன்னரே தொடங்கிய செயல் என்ற கால நுணுக்கத்தைத் தெளிவாகக் காக்கிறது.
- source_word: ἐπιτελέσῃ
  choice: நிறைவேற்றி முடிக்கும்படி
  rationale: தொடங்கப்பட்ட பணியை அதன் நோக்கமுள்ள முடிவுக்குக் கொண்டுவருதல் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது; ἵνα கூறும் நோக்கத்தையும் ‘-ம்படி’ அமைப்பு காக்கிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களிடையே
  rationale: கொரிந்திய விசுவாசிகளின் நடுவில் இந்தப் பணி நிறைவேற்றப்படுவதைச் சுட்டுகிறது; ‘உங்களுக்காக’ என்று மட்டும் மொழிபெயர்த்து திசை அல்லது சமூகச் சூழலைக் குறுக்கவில்லை.
- source_word: καὶ τὴν χάριν ταύτην
  choice: இந்த அருள்செயலையும்
  rationale: καί என்பதன் ‘-யும்’ நுணுக்கத்தையும், χάρις என்பதன் அருள் மொழியையும் காத்துக்கொண்டு, இங்கு காணிக்கை தொடர்பான ஒரு நடைமுறைப் பணி குறிக்கப்படுவதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: காணிக்கைச் சூழலில் χάρις என்பதன் பொருள்
  choice: இந்த அருள்செயலையும்
  alternative: இந்த அருளையும்; இந்த அருள்நிறைந்த பணியையும்; இந்தக் கொடையையும்
  rationale: உடனடிச் சூழல் பரிசுத்தவான்களுக்கான காணிக்கையையும் அதை நிறைவேற்றுவதில் தீத்துவின் பங்கையும் பற்றியது. ‘அருள்செயல்’ என்பது அதை வெறும் பொருளாதாரக் ‘கொடை’யாகச் சுருக்காமல், பவுல் அதனை அருளின் வெளிப்பாடாகக் காணும் இறையியல் அழுத்தத்தையும் நடைமுறைச் செயலையும் ஒன்றாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வலியுறுத்திக் கேட்டுக்கொண்டோம்’ என்பது கட்டளையிடும் தொனியின்றி வேண்டுகோளின் வலிமையைக் காட்டுகிறது; ‘அருள்செயல்’ என்பது பொதுவாசகருக்குப் புரியும் வகையில் χάρις என்பதன் கருத்தியல் மற்றும் நடைமுறை இரு பரிமாணங்களையும் இணைக்கிறது.
