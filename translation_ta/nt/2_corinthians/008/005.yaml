revisions:
- from: நாங்கள் எதிர்பார்த்தபடி மட்டும் அல்ல[a]; அவர்கள் முதலில் தங்களையே ஆண்டவருக்கும், பின்பு கடவுளுடைய விருப்பத்தின்படி எங்களுக்கும் ஒப்புக்கொடுத்தார்கள்[b].
  to: நாங்கள் எதிர்பார்த்தபடியல்ல[a]; மாறாக, கடவுளுடைய விருப்பத்தினால்[b], அவர்கள் தங்களையே முதலில் ஆண்டவருக்கும், பின்னர் எங்களுக்கும் ஒப்புக்கொடுத்தார்கள்.
  rationale: The revision corrects the central adversative construction so that Tamil expresses ‘not as we expected, but’ rather than ‘not only as we expected.’ It preserves the Macedonians’ self-giving, the Lord’s priority, and their subsequent commitment to Paul and his coworkers. The divine-will expression is retained in a form that does not settle the semantic range of διά with the genitive.
  reviewer_model: gpt-5.6-terra
