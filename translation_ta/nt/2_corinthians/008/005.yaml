lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: நாங்கள் எதிர்பார்த்தபடி
  rationale: ἐλπίζω என்பதற்கு ‘நம்பிக்கைகொள்’ என்ற அடிப்படைப் பொருள் இருந்தாலும், இங்கே மக்கெதோனியர்களின் செயல் அப்போஸ்தலர்களின் எதிர்பார்ப்பை விஞ்சியதைச் சூழல் காட்டுகிறது. ‘எதிர்பார்த்தபடி’ என்பது இயல்பான தமிழில் அந்தப் பொருளைத் தருகிறது; ‘நாங்கள் நம்பியபடி’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: தங்களையே ... ஒப்புக்கொடுத்தார்கள்
  rationale: தற்சுட்டுப் பெயர்ச்சொல்லின் வலியுறுத்தலை ‘தங்களையே’ காக்கிறது. தமிழில் நபர்கள் தங்களை ஆண்டவருக்கும் ஊழியத்திற்கும் அர்ப்பணித்தனர் என்ற பொருளை ‘ஒப்புக்கொடுத்தார்கள்’ இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது; இதை வெறும் பணக்கொடையாகச் சுருக்கவில்லை.
- source_word: πρῶτον
  choice: முதலில்
  rationale: கால மற்றும் முன்னுரிமை ஆகிய இரு சாத்தியங்களையும் மிகைப்படுத்தாமல் காக்கும் நேரடியான தமிழ் இணை.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவருக்கு
  rationale: κύριος என்பதற்கான மரியாதைமிக்க, வழக்கமான தமிழ் வேதாகமச் சொல்; இச்சூழலில் கிறிஸ்துவைக் குறிக்கிறது.
- source_word: καὶ ἡμῖν
  choice: எங்களுக்கும்
  rationale: இணையான வேற்றுமை அமைப்பைக் காத்து, பவுலும் உடன் ஊழியர்களும் மேற்கொண்ட பணிக்கு அவர்கள் தங்களை ஒப்புக்கொடுத்ததைக் காட்டுகிறது.
- source_word: διὰ θελήματος θεοῦ
  choice: கடவுளுடைய விருப்பத்தின்படி
  rationale: διά + genitive இங்கே கடவுளின் விருப்பத்தோடு இயைந்த செயலை இயல்பான தமிழில் குறிக்கிறது. காரணம், வழிமுறை அல்லது இசைவு ஆகிய நுணுக்கங்களை முழுமையாகத் தீர்மானிக்காமல் மாற்று வடிவங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
theological_decisions:
- issue: ஆண்டவருக்கும் எங்களுக்கும் தங்களைக் கொடுத்ததன் உறவு
  choice: ‘முதலில்’ என்பதையும் தொடர்வரிசையையும் காத்து, ஆண்டவருக்கான ஒப்புக்கொடுத்தலுக்கு முன்னுரிமை தரப்படுகிறது; ‘பின்பு’ என்பது தமிழில் அந்த வரிசையைத் தெளிவாக்குகிறது.
  alternative: இதை வெளிப்படையான படிநிலை இல்லாத இருவகை அர்ப்பணிப்பாகவும் புரிந்துகொள்ளலாம்.
  rationale: πρῶτον மற்றும் இரண்டு dative கூறுகளின் வரிசை ஆண்டவருக்கான முன்னுரிமையைச் சுட்டுகின்றன. இருப்பினும், ஆண்டவரையும் அப்போஸ்தலர்களையும் சம நிலையில் வைப்பதாகவோ, வலுவான திருச்சபை அதிகாரக் கோட்பாடாகவோ மொழிபெயர்ப்பு விரிவுபடுத்தவில்லை.
- issue: διὰ θελήματος θεοῦ என்பதன் வலிமை
  choice: ‘கடவுளுடைய விருப்பத்தின்படி’ என்று மொழிபெயர்த்து, அவர்களின் செயல் கடவுளின் விருப்பத்தோடு ஒத்திருந்தது என்பதைத் தெரிவிக்கிறது.
  alternative: ‘கடவுளுடைய விருப்பத்தின் மூலம்’ அல்லது ‘கடவுளுடைய விருப்பத்தால்’ என்று மொழிபெயர்த்து தெய்வீகச் செயற்பாடு அல்லது காரணத்தை அதிகமாக முன்னிறுத்தலாம்.
  rationale: கிரேக்கச் சொற்றொடர் வழிமுறை, காரணம், அனுமதி அல்லது இசைவு போன்ற நுணுக்கங்களுக்கு இடமளிக்கிறது. பிரதான உரை இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையைக் கையாளுகிறது. ‘தங்களையே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது. பிரதான வாக்கியத்தில் கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘மட்டும் அல்ல’ மற்றும் ‘பின்பு’ ஆகியவை தமிழில் எதிர்மறை ஒப்பீட்டையும் வரிசையையும் இயல்பாகத் தெளிவாக்குகின்றன; புதிய இறையியல் கோரிக்கையைச் சேர்ப்பதில்லை.
