source:
  edition: SBLGNT
  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: ta
  text: ஆகவே, உங்கள் அன்புக்கும் உங்களைப் பற்றி நாங்கள் பெருமை பேசியது உண்மை என்பதற்கும் சான்றை[a], திருச்சபைகளின் முன்னிலையில்[b] அவர்களுக்குக் காட்டுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெளிக்காட்டுதலை’ அல்லது ‘ஆதாரத்தை’.
    reason: lexical_alternative
  - marker: b
    text: இது திருச்சபைகளின் பிரதிநிதிகள் முன்னிலையில் செய்யப்படும் வெளிப்படையான செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειξιν
  choice: சான்றை
  rationale: ἔνδειξις என்பது ஒன்றை வெளிப்படையாகத் தெளிவாக்கும் சான்று அல்லது நிரூபணம். இங்கு கொரிந்தியர்களின் அன்பு செயலில் புலப்பட வேண்டும் என்பதால் ‘சான்றை’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀγάπης
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான இயல்பான தமிழ் இணை. சூழலில் இது செயலால் வெளிப்படும் உறவுசார் அன்பைக் குறிக்கிறது.
- source_word: καυχήσεως
  choice: பெருமைபாராட்டியதற்கு
  rationale: καύχησις என்பதிலுள்ள ‘பெருமை பேசுதல்/பாராட்டுதல்’ என்ற பவுலின் வலுவான சொல்லாட்சியைத் தக்கவைக்கிறது; ‘நம்பிக்கை’ போன்ற மென்மையான சொல் அதன் வலிமையைக் குறைக்கும்.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களைக் குறித்து
  rationale: καύχησις உடன் வரும் ὑπέρ இங்கு கொரிந்தியர்களைப் பற்றிய பவுலின் பெருமைபாராட்டுதலைக் குறிக்கிறது.
- source_word: εἰς αὐτοὺς
  choice: அவர்களுக்கு
  rationale: முந்தைய சூழலில் கூறப்பட்ட சகோதரர்கள் அல்லது திருச்சபைகளின் பிரதிநிதிகளைக் குறிக்கிறது. தமிழில் ‘அவர்களுக்குக் காட்டுங்கள்’ என்பது இயல்பான அமைப்பு.
- source_word: ἐνδεικνύμενοι
  choice: காட்டுங்கள்
  rationale: இப்பங்கேற்பு வடிவம் சூழலில் கட்டளைப் பொருளுடன் பவுலின் வேண்டுகோளைத் தொடர்கிறது. ‘காட்டுங்கள்’ என்பது ஒன்றை வெளிப்படச் செய்வதைக் தெளிவாகக் கூறுகிறது.
- source_word: εἰς πρόσωπον
  choice: முன்னிலையில்
  rationale: இச்சொற்றொடர் இங்கு திருச்சபைகளுக்கு முன்பாக, பொதுவாக வெளிப்படுத்தப்படுவதைக் குறிக்கிறது; சொற்சொல்லான ‘முகத்திற்கு’ என்பதைவிட ‘முன்னிலையில்’ இயல்பானது.
- source_word: τῶν ἐκκλησιῶν
  choice: திருச்சபைகளின்
  rationale: பவுலின் பயன்பாட்டில் ἐκκλησίαι பொதுவாக உள்ளூர் விசுவாசக் குழுமங்களைக் குறிக்கிறது; ‘திருச்சபைகள்’ நிலையான, தெளிவான தமிழ் மொழிபெயர்ப்பு.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களிலிருந்து வரும் முடிவையோ விளைவையோ குறிக்கும் இணைப்பைத் தெளிவாகத் தக்கவைக்கிறது.
