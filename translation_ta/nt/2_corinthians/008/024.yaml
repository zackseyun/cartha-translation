translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பெருமைபாராட்டுதல்’ என்பது καύχησις என்ற சொல்லின் சொல்லாட்சிசார் வலிமையைத் தக்கவைக்கிறது; ஒரே ἔνδειξις இரு தொடர்புடைய கூறுகளுக்கும் உரியதாக இருப்பதால் ‘அன்புக்கும் ... பெருமைபாராட்டியதற்கும் சான்றை’ என்ற ஒருமை அமைப்பு பேணப்பட்டது.
