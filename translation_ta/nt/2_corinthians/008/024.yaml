- from: ஆகவே, உங்கள் அன்புக்கும் உங்களைக் குறித்து நாங்கள் பெருமைபாராட்டியதற்கும் சான்றை[a], திருச்சபைகளின் முன்னிலையில்[b] அவர்களுக்குக் காட்டுங்கள்.
  to: ஆகவே, உங்கள் அன்புக்கும் உங்களைப் பற்றி நாங்கள் பெருமை பேசியது உண்மை என்பதற்கும் சான்றை[a], திருச்சபைகளின் முன்னிலையில்[b] அவர்களுக்குக் காட்டுங்கள்.
