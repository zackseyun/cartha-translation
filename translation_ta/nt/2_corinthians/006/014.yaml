- from: நம்பாதவர்களோடு பொருந்தாத நுகத்தில் பிணைக்கப்படாதீர்கள்.[a] ஏனெனில், நீதிநெறிக்கும்[b] சட்டமீறலுக்கும் என்ன பங்குடைமை இருக்கிறது? ஒளிக்கும் இருளுக்கும் என்ன ஐக்கியம் இருக்கிறது?
  to: நம்பாதவர்களோடு பொருந்தாத நுகத்தடியில் இணைக்கப்பட்டவர்களாக ஆகாதீர்கள்.[a] ஏனெனில், நீதிக்கும்[b] சட்டமீறலுக்கும் என்ன பங்கு உண்டு? அல்லது, ஒளிக்கும் இருளுக்கும் என்ன ஐக்கியம் உண்டு?
