source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: ta
  text: நம்பாதவர்களோடு பொருந்தாத நுகத்தடியில் இணைக்கப்பட்டவர்களாக ஆகாதீர்கள்.[a] ஏனெனில், நீதிக்கும்[b] சட்டமீறலுக்கும் என்ன பங்கு உண்டு? அல்லது, ஒளிக்கும் இருளுக்கும் என்ன ஐக்கியம் உண்டு?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொருந்தாத நுகத்தடி’ என்பது ஒன்றுக்கொன்று பொருந்தாத விலங்குகளை ஒரே நுகத்தடியில் பூட்டும் காட்சியை நினைவூட்டுகிறது; உபாகமம் 22:10-ஐ ஒப்பிடுக.
    reason: cross_reference
  - marker: b
    text: ‘நீதி’ என்பதைச் சூழலுக்கு ஏற்ப ‘நேர்மை’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: பிணைக்கப்படாதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளைத் தொடர் தடைப் பொருளைத் தருகிறது. தமிழில் இயல்பாக அமைய, γίνεσθε என்பதன் ‘ஆகாதீர்கள்’ என்ற கூறு அடுத்த நுக உருவகத்துடன் ஒன்றிணைக்கப்பட்டுள்ளது.
- source_word: ἑτεροζυγοῦντες
  choice: பொருந்தாத நுகத்தில்
  rationale: வேறுபட்ட வகை விலங்குகளை ஒரே நுகத்தில் பூட்டும் உருவகத்தைத் தக்கவைத்து, தமிழில் புரியத்தக்கவாறு ‘பொருந்தாத நுகம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀπίστοις
  choice: நம்பாதவர்களோடு
  rationale: இங்கு சொல் விசுவாசிக்காதவர்களைக் குறிக்கிறது; நுக உருவகத்தின் கூட்டிணைப்பை ‘-ஓடு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μετοχὴ
  choice: பங்குடைமை
  rationale: ஒன்றில் சேர்ந்து பங்குபெறுதல் அல்லது பொதுப் பங்கு கொண்டிருத்தல் என்ற பொருளை வெளிப்படுத்துகிறது; அடுத்துள்ள ‘ஐக்கியம்’ என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: δικαιοσύνῃ
  choice: நீதிநெறி
  rationale: ἀνομία என்பதற்கு எதிரான ஒழுக்கநிலை அல்லது நேரிய வாழ்வைக் குறிக்கிறது. ‘நீதி’ என்ற பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἀνομίᾳ
  choice: சட்டமீறல்
  rationale: சட்டத்தையோ ஒழுங்கையோ மீறும் நிலையை நேரடியாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: κοινωνία
  choice: ஐக்கியம்
  rationale: நெருங்கிய பகிர்வு, தொடர்பு, ஒன்றிப்பு ஆகியவற்றை இச்சூழலில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: φωτὶ
  choice: ஒளி
  rationale: பவுலின் உருவக எதிர்மறை இணையை நேரடியாகத் தக்கவைக்கிறது.
- source_word: πρὸς σκότος
  choice: இருளுக்கும்
  rationale: πρός இங்கு தொடர்பு அல்லது இணைப்பைக் குறிக்கிறது; இணை அமைப்பில் ‘ஒளிக்கும் இருளுக்கும்’ என்பது இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: பவுலின் எதிர்மறை ஒப்பீட்டில் δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதிநெறி
  alternative: நீதி
  rationale: ἀνομία என்ற ‘சட்டமீறல்’ நிலைக்கு எதிராக நேரிய ஒழுக்கநிலையை ‘நீதிநெறி’ தெளிவாகக் காட்டுகிறது. அதேவேளையில், சமூக அல்லது நியாயத் தளத்தையும் உள்ளடக்கக்கூடிய ‘நீதி’ என்ற பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. நுக உருவகம் விளக்கமாக மாற்றப்படாமல் மூல வடிவிலேயே வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; ‘பங்குடைமை’ மற்றும் ‘ஐக்கியம்’ மூலம் μετοχή/κοινωνία வேறுபாடு முடிந்தவரை பாதுகாக்கப்பட்டுள்ளது.
