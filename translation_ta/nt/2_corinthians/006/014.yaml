review_pass:
  verdict: revise
  source_fidelity: The draft preserves the three rhetorical questions, the contrasts, and the yoke metaphor. However, «பிணைக்கப்படாதீர்கள்» makes the opening chiefly passive ('do not be tied') and does not adequately represent γίνεσθε ('become'). «நீதிநெறி» is a narrower explanatory interpretation of δικαιοσύνῃ than the direct term «நீதி».
  naturalness: Most of the Tamil is clear, but «பொருந்தாத நுகத்தில் பிணைக்கப்படாதீர்கள்» is somewhat stiff and syntactically obscures who is mismatched. «நுகத்தடியில் இணைக்கப்பட்டவர்களாக ஆகாதீர்கள்» states the metaphor and the prohibitive becoming more clearly. «என்ன பங்கு உண்டு?» is more idiomatic than «என்ன பங்குடைமை இருக்கிறது?» in this rhetorical construction.
  terminology: «நம்பாதவர்கள்», «சட்டமீறல்», «ஒளி», «இருள்», and «ஐக்கியம்» are suitable. «நீதி» directly renders δικαιοσύνη while retaining the semantic breadth that can include righteousness and justice; the footnote records «நேர்மை» as an interpretive lexical alternative without imposing a doctrinal reading.
  issues:
  - severity: medium
    issue: Opening imperative is rendered as a passive prohibition rather than a prohibition against becoming unequally yoked.
    rationale: Μὴ γίνεσθε ἑτεροζυγοῦντες calls readers not to become persons joined in a mismatched yoke. The revision explicitly retains «ஆகாதீர்கள்» and identifies the yoke as mismatched.
  - severity: low
    issue: «நீதிநெறி» narrows δικαιοσύνη.
    rationale: The Greek permits the broader, key Pauline term 'righteousness/justice.' «நீதி» is the more direct Tamil equivalent and preserves that breadth.
  - severity: low
    issue: The first rhetorical question uses an unnecessarily abstract noun.
    rationale: «என்ன பங்கு உண்டு?» naturally expresses μετοχή ('share/participation') and preserves its distinction from κοινωνία, rendered «ஐக்கியம்».
