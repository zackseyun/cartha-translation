source:
  edition: SBLGNT
  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: ta
  text: 'இணைந்து பணியாற்றும் நாங்களும் உங்களை வலியுறுத்திக் கேட்டுக்கொள்கிறோம்: கடவுளுடைய அருளை வீணாகப் பெற்றுக்கொள்ளாதீர்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடன் பணியாளர்களாகிய நாங்களும் உங்களை வலியுறுத்திக் கேட்டுக்கொள்கிறோம்.” பவுல் யாரோடு இணைந்து பணியாற்றுகிறார் என்பதை கிரேக்கம் வெளிப்படையாகக் குறிப்பிடவில்லை; முந்தைய சூழல் கடவுளை வலுவாகச் சுட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: அவரோடு இணைந்து செயல்படுகிற
  rationale: வினையெச்சத்தின் செயல்சார்ந்த பொருளைப் பாதுகாக்கிறது. உடன்செயல்படுபவர் கிரேக்கத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; முந்தைய சூழலில் கடவுளே பெரிதும் சுட்டப்படுவதால் ‘அவரோடு’ என்று உரையில் தெளிவாக்கப்பட்டுள்ளது, மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δὲ καὶ
  choice: நாங்களும்
  rationale: δέ இங்குப் பலமான எதிர்மறை இணைப்பல்ல; மென்மையான தொடர்ச்சியாகத் தமிழின் ஓட்டத்தில் உட்கொள்ளப்பட்டுள்ளது. καί என்பதன் சேர்க்கைப் பொருளை ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: παρακαλοῦμεν
  choice: வலியுறுத்திக் கேட்டுக்கொள்கிறோம்
  rationale: அன்போடும் தீவிரத்தோடும் செய்யப்படும் வேண்டுகோள் அல்லது அறிவுறுத்தல் என்ற பவுலின் பயன்பாட்டை இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: μὴ εἰς κενὸν
  choice: வீணாக ... -ஆதீர்கள்
  rationale: ‘பயனற்றதாக, நோக்கம் நிறைவேறாமல்’ என்ற கிரேக்க மரபுத்தொடரின் வலிமையைச் சுருக்கமாகக் காக்கிறது.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: கடவுளுடைய அருளை
  rationale: χάρις என்பதன் பவுலுக்குரிய இறையியல் நிறையையும், τοῦ θεοῦ என்பதன் நேரடியான உரிமைத் தொடர்பையும் காக்கிறது.
- source_word: δέξασθαι ὑμᾶς
  choice: பெற்றுக்கொள்ளாதீர்கள்
  rationale: δέχομαι என்பதன் ‘பெறுதல்/ஏற்றுக்கொள்ளுதல்’ பொருளைத் தருகிறது; தமிழில் நேரடி அறிவுறுத்தலாக மாற்றுவது παρακαλοῦμεν உடனான கட்டமைப்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘இணைந்து செயல்படுகிற’ என்பதன் மறைந்துள்ள உடன் செயல்படுபவர்
  choice: ‘அவரோடு’ என்பது சூழலின் அடிப்படையில் கடவுளைக் குறிக்கிறது.
  alternative: ‘உடன் பணியாளர்களாகிய நாங்கள்’ அல்லது உடன் செயல்படுபவரை வெளிப்படையாகக் குறிப்பிடாத ‘இணைந்து செயல்படும் நாங்கள்’.
  rationale: 2 கொரிந்தியர் 5:18–20-இல் கடவுளின் ஒப்புரவாக்கும் செயலும் பவுலின் தூதுப்பணியும் முன்னிலையில் உள்ளன. ஆகவே கடவுள் மிகச் சாத்தியமான மறைமுகக் குறிப்பு; எனினும் கிரேக்க இலக்கணம் அவரை வெளிப்படையாகப் பெயரிடாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அருள்’ என்ற பரவலாக அறியப்பட்ட இறையியல் சொல் தக்கவைக்கப்பட்டுள்ளது; கிரேக்கத்தில் உள்ள உண்மையான தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
