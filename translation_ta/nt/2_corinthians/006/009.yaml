source:
  edition: SBLGNT
  text: ὡς ἀγνοούμενοι καὶ ἐπιγινωσκόμενοι, ὡς ἀποθνῄσκοντες καὶ ἰδοὺ ζῶμεν, ὡς παιδευόμενοι καὶ μὴ θανατούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/009.yaml
  text: as unknown and yet well known[a], as dying and behold, we live, as disciplined and not put to death[b],
translation:
  language: ta
  text: அறியப்படாதவர்களைப் போலவும், ஆனாலும் நன்கு அறியப்பட்டவர்களாகவும்[a]; சாகிறவர்களைப் போலவும், இதோ, உயிரோடு இருக்கிறோம்; சீர்படுத்தப்படுகிறவர்களைப் போலவும்[b], கொல்லப்படாதவர்களாகவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடையாளம் கண்டுகொள்ளப்படுகிறவர்களாகவும்.” கிரேக்கச் சொல் வெறுமனே புகழ்பெற்றிருப்பதைவிட, தெளிவாக அல்லது முழுமையாக அறிந்துகொள்ளப்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தண்டிக்கப்படுகிறவர்களைப் போலவும்” அல்லது “பயிற்றுவிக்கப்படுகிறவர்களைப் போலவும்.” கிரேக்கச் சொல் திருத்தும் ஒழுக்கத்தையோ உருவாக்கும் பயிற்சியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: போலவும்
  rationale: பவுலின் முரண்பாடுகள் நிறைந்த பட்டியலில் மீண்டும் மீண்டும் வரும் ஒப்புமை அமைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἀγνοούμενοι
  choice: அறியப்படாதவர்கள்
  rationale: பிறரால் அறியப்படாமை அல்லது அடையாளம் காணப்படாமை என்ற செயப்பாட்டு பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: ἐπιγινωσκόμενοι
  choice: நன்கு அறியப்பட்டவர்கள்
  rationale: ἀγνοούμενοι என்பதற்கான நேரடியான முரண்பாட்டைத் தக்கவைத்து, முழுமையாக அறிந்துகொள்ளப்படுதல் அல்லது அடையாளம் காணப்படுதல் என்ற வலிமையையும் சுட்டுகிறது.
- source_word: ἀποθνῄσκοντες
  choice: சாகிறவர்கள்
  rationale: மரணத்தின் விளிம்பில் இருப்பதுபோன்ற தொடர்ச்சியான நிலையை இயல்பாகக் காட்டி, பின்னர் வரும் ‘கொல்லப்படாதவர்கள்’ என்பதுடன் தேவையற்ற சொற்பொருள் ஒட்டுதலைத் தவிர்க்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: வியப்பையும் கவன ஈர்ப்பையும் ஏற்படுத்தும் மூலமொழியின் திடீர் அழைப்பைத் தக்கவைக்கிறது.
- source_word: ζῶμεν
  choice: உயிரோடு இருக்கிறோம்
  rationale: முதல் நபர் பன்மையைத் தெளிவாகக் காட்டி, ‘சாகிறவர்கள்’ என்பதுடனான கூர்மையான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παιδευόμενοι
  choice: ஒழுக்கப்படுத்தப்படுகிறவர்கள்
  rationale: திருத்தும் கண்டிப்பு மற்றும் உருவாக்கும் பயிற்சி ஆகிய இரண்டுக்கும் இடமளிக்கும் சொல்லாகும்; தண்டனை என்ற ஒரே பொருளை வற்புறுத்துவதில்லை.
- source_word: μὴ θανατούμενοι
  choice: கொல்லப்படாதவர்கள்
  rationale: செயப்பாட்டு அமைப்பையும், கடுமையான துன்பம் மரணத்தில் முடிவதில்லை என்ற முரண்பாட்டையும் தெளிவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: பாடுகளோடு தொடர்புடைய παιδευόμενοι என்பதன் பொருள்
  choice: ஒழுக்கப்படுத்தப்படுகிறவர்கள்
  alternative: கண்டிக்கப்படுகிறவர்கள் / பயிற்றுவிக்கப்படுகிறவர்கள்
  rationale: இச்சொல் திருத்தும் கண்டிப்பையோ உருவாக்கும் பயிற்சியையோ குறிக்கலாம். தேர்ந்தெடுக்கப்பட்ட சொல், இதைத் தெய்வீகத் தண்டனை என்று உறுதிப்படுத்தாமல், மூலத்தின் இறையியல் பதற்றத்தையும் பொருள் பரப்பையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான ‘ὡς’ அமைப்பு ‘போலவும்’ என மீட்டுரைக்கப்பட்டு, மூன்று முரண்பாடுகளின் சொல்லாட்சித் தாளம் காக்கப்பட்டுள்ளது.
