source:
  edition: SBLGNT
  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: ta
  text: ஆகவே, அவர்களிடையிலிருந்து வெளியே வாருங்கள்; தனித்திருங்கள்[a] என்று ஆண்டவர் சொல்கிறார். அசுத்தமானதைத் தொடாதிருங்கள்[b][c]; நானும் உங்களை ஏற்றுக்கொள்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிரித்து வைக்கப்படுங்கள்” அல்லது “உங்களைப் பிரித்துக்கொள்ளுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அசுத்தமான எதையும் தொடாதிருங்கள்.”
    reason: lexical_alternative
  - marker: c
    text: இங்கு பவுல் பழைய ஏற்பாட்டின் தீர்க்கதரிசன மொழியை, குறிப்பாக ஏசாயா 52:11-ஐ, எதிரொலிக்கிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἐξέλθατε
  choice: வெளியே வாருங்கள்
  rationale: பன்மை இறந்தகால ஏவல் வடிவத்தின் தீர்மானமான அழைப்பைத் தக்கவைக்கிறது; மேற்கோள் சார்ந்த அழைப்பிலும் இயல்பாக ஒலிக்கிறது.
- source_word: ἐκ μέσου αὐτῶν
  choice: அவர்களிடையிலிருந்து
  rationale: இடம் மற்றும் உறவுசார் பிரிவு ஆகிய இரு சாத்தியங்களையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: ἀφορίσθητε
  choice: தனியே பிரிக்கப்பட்டிருங்கள்
  rationale: செயப்பாட்டு ஏவலின் வடிவத்தையும் பிரித்துவைக்கப்பட்ட நிலை என்ற பொருளையும் காக்கிறது; முழுக்கத் தற்செயல் வினையாக மாற்றவில்லை.
- source_word: λέγει κύριος
  choice: என்று ஆண்டவர் சொல்கிறார்
  rationale: தீர்க்கதரிசன மேற்கோள் சூத்திரத்தை இயல்பான தமிழ்ச் சொல்வரிசையில் தருகிறது.
- source_word: ἀκαθάρτου
  choice: அசுத்தமானதை
  rationale: குறிப்பிட்ட பொருளை வலிந்து நிர்ணயிக்காமல், அசுத்தமானது என்ற பொதுவகையைத் தக்கவைக்கிறது.
- source_word: μὴ ἅπτεσθε
  choice: தொடாதிருங்கள்
  rationale: தூய்மை மற்றும் பிரிவு சார்ந்த மேற்கோள் உருவகத்தில் ἅπτομαι என்பதன் அடிப்படைத் தொடுதல் பொருளைச் சரியாகத் தருகிறது.
- source_word: κἀγὼ
  choice: அப்போது நான்
  rationale: καί + ἐγώ என்பதிலுள்ள தெய்வீகப் பதிலைத் தமிழில் இயல்பாக இணைக்கிறது; ‘அப்போது’ என்பது கட்டளைகளுக்குப் பின் வரும் ஏற்றுக்கொள்ளுதலின் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: εἰσδέξομαι ὑμᾶς
  choice: உங்களை ஏற்றுக்கொள்வேன்
  rationale: சாதகமான வரவேற்பு அல்லது ஏற்றுக்கொள்ளுதல் என்ற பொருளை கண்ணியமான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பழைய ஏற்பாட்டுப் பின்னணியுள்ள தீர்க்கதரிசன மேற்கோளில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர்; யெகோவா
  rationale: கிரேக்கப் புதிய ஏற்பாட்டு உரையில் உள்ள κύριος என்பதையே மொழிபெயர்க்கிறது; பழைய ஏற்பாட்டுப் பின்னணியை முன்னிட்டு தனிப்பட்ட இறைப்பெயரை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: பிரிவுக்கான கட்டளையின் வலிமை
  choice: தனியே பிரிக்கப்பட்டிருங்கள்
  alternative: உங்களைப் பிரித்துக்கொள்ளுங்கள்; தனித்திருங்கள்
  rationale: செயப்பாட்டு வடிவத்தையும் தனியே வைக்கப்பட்ட நிலைக்கான அழைப்பையும் காக்கிறது; உலகிலுள்ள அனைவருடனான தொடர்பையும் முற்றிலும் துண்டிக்க வேண்டும் என்ற பிரிவினைவாதப் பயன்பாட்டைச் சேர்க்கவில்லை.
- issue: καί என்பதன் தொடர்பு
  choice: அப்போது
  alternative: மேலும்; மற்றும்
  rationale: எபிரேய மேற்கோள் பாணியிலுள்ள தொடர்ச்சியை தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கடுமையான காரண-நிபந்தனையை உரை கூறுவதைக் காட்டிலும் அதிகமாக வரையறுக்காமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. கட்டளைகளின் பன்மை வடிவமும் தீர்க்கதரிசன மேற்கோளின் தொனியும் காக்கப்பட்டுள்ளன; செயப்பாட்டு வடிவத்தின் நுணுக்கம் அடிக்குறிப்பில் மாற்று வாசிப்புகளுடன் பதிவு செய்யப்பட்டுள்ளது.
