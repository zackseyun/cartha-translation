  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: ta
  text: 'ஆனால், எல்லாவற்றிலும்[a] கடவுளின் பணியாளர்கள் என நாங்கள் எங்களையே காட்டுகிறோம்: மிகுந்த சகிப்புத்தன்மையிலும்[c], துன்பங்களிலும், நெருக்கடிகளிலும், இடுக்கண்களிலும்,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒவ்வொரு விதத்திலும்.’ கிரேக்கச் சொற்றொடர் ஒவ்வொரு சூழ்நிலையையோ, அவர்கள் தங்களை மெய்ப்பிக்கும் ஒவ்வொரு அம்சத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘மிகுந்த சகிப்புத்தன்மையுடன்.’ தொடர்ந்து வரும் துன்பப் பட்டியலில் கிரேக்கத்தில் ‘ἐν’ (‘இல்/உடன்’) மீண்டும் மீண்டும் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய எதிர்மறைக் கூற்றுக்கு மாறான, ஊழியத்தின் நேர்மறையான செயல்விதத்தை அறிமுகப்படுத்தும் எதிரிடை இணைப்பாக உள்ளது.
- source_word: ἐν παντί
  choice: எல்லாவற்றிலும்
  rationale: ஒவ்வொரு சூழ்நிலையையும் அல்லது ஒவ்வொரு விதத்தையும் குறிக்கக்கூடிய கிரேக்கச் சொற்றொடரின் பரந்த பொருளைச் சுருக்காமல் காக்கிறது.
- source_word: συνιστάνοντες ἑαυτούς
  choice: எங்களை நாங்களே காட்டுகிறோம்
  rationale: συνίστημι என்பது இங்கு தங்களைப் பரிந்துரைப்பதையும், தங்கள் நடத்தையால் தாங்கள் யார் என்பதை மெய்ப்பிப்பதையும் குறிக்கலாம். இயல்பான தமிழில் அதன் செயல்விளைவை இவ்வாறு தெரிவிக்கிறது.
- source_word: ὡς θεοῦ διάκονοι
  choice: கடவுளின் பணியாளர்களாக
  rationale: διάκονοι என்பதில் சேவை செய்வதே மையம். பிற்கால நிறுவனப் பதவியின் பொருளைத் திணிக்காமல், நவீனத் தமிழில் எளிதாகப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: மிகுந்த சகிப்புத்தன்மையிலும்
  rationale: ὑπομονή என்பது சோதனையின் கீழ் உறுதியாகத் தாங்கி நிலைத்திருப்பதைக் குறிக்கிறது. பட்டியலில் மீண்டும் வரும் ἐν அமைப்பை ‘-இலும்’ என்பதன் மூலம் காக்கிறது.
- source_word: θλίψεσιν
  choice: துன்பங்களிலும்
  rationale: அழுத்தம், உபத்திரவம், துன்பம் ஆகிய பொருள்களை உடைய சொல்லுக்கு இயல்பானதும் பொருத்தமான தீவிரம் கொண்டதுமான தமிழ்.
- source_word: ἀνάγκαις
  choice: நெருக்கடிகளிலும்
  rationale: கட்டாயப்படுத்தும் கடினச் சூழ்நிலைகள் அல்லது அழுத்தமான தேவைகளை இச்சூழலில் குறிக்கிறது; ‘நெருக்கடிகள்’ அந்த அனுபவத்தைத் தெளிவாகத் தருகிறது.
- source_word: στενοχωρίαις
  choice: இடுக்கண்களிலும்
  rationale: இடமின்றி நெருக்கப்படுவது போன்ற கடும் அழுத்த நிலையைச் சுட்டுகிறது; முந்தைய சொற்களிலிருந்து வேறுபாட்டையும் தீவிரத்தையும் காக்கிறது.
theological_decisions:
- issue: ஊழியச் சூழலில் διάκονοι என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளின் பணியாளர்கள்
  alternative: கடவுளின் ஊழியர்கள்
  rationale: இச்சொல் ஒரு முறையான திருச்சபைப் பதவியை அவசியமாகக் குறிக்காமல், கடவுளுக்குச் சேவை செய்பவர்களை அடையாளப்படுத்துகிறது. ‘பணியாளர்கள்’ சேவையின் அடிப்படைப் பொருளை நிறுவனத் தன்மை சேர்க்காமல் தெரிவிக்கிறது.
- issue: συνιστάνοντες என்பதில் தங்களைப் பரிந்துரைத்தல் அல்லது மெய்ப்பித்தல்
  choice: எங்களை நாங்களே காட்டுகிறோம்
  alternative: எங்களை நாங்களே பரிந்துரைக்கிறோம்
  rationale: கிரேக்கச் சொல் இரு நிழற்பொருள்களையும் தாங்கக்கூடும். இங்கு தொடர்ந்து வரும் சகிப்பும் துன்பங்களும் அவர்களின் உண்மைத்தன்மையை நடத்தையால் வெளிப்படுத்துவதால், ‘காட்டுகிறோம்’ சூழலுக்கு இயல்பாக உள்ளது; தங்களைப் புகழ்வதாக மட்டும் பொருள் சுருங்குவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified ஆன, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பட்டியல் அமைப்பையும் மீளவரும் ἐν என்பதையும் ‘-இலும்’ வடிவங்களால் இயன்றவரை காத்துள்ளோம். வசனம் அடுத்த வசனத்துக்குத் தொடரும் பட்டியலின் பகுதியாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
