base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: ta
  text: கொரிந்தியர்களே, உங்களிடம் எங்கள் வாய் திறந்திருக்கிறது[a]; எங்கள் இதயம் விரிவடைந்திருக்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருளை வெளிப்படையாகச் சொன்னால், “நாங்கள் உங்களிடம் வெளிப்படையாகப் பேசியிருக்கிறோம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எங்கள் இதயம் அகன்றிருக்கிறது” அல்லது “எங்கள் இதயம் முழுமையாகத் திறந்திருக்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: வாய்
  rationale: பவுல் பயன்படுத்தும் உடல் சார்ந்த உருவகத்தையும், அடுத்துள்ள ‘இதயம்’ என்ற உருவகத்துடனான இணைப்பையும் காக்கிறது.
- source_word: ἀνέῳγεν
  choice: திறந்திருக்கிறது
  rationale: முன்னர் நிகழ்ந்த செயலால் தொடரும் தற்போதைய நிலையை இறந்தகால நிறைவுவினை உணர்த்துவதால், அந்தக் காலநிலைத் தன்மையையும் ‘வாய் திறத்தல்’ என்ற உருவகத்தையும் காக்கிறது.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம்
  rationale: பேச்சு யாரை நோக்கிச் செலுத்தப்படுகிறது என்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: Κορίνθιοι
  choice: கொரிந்தியர்களே
  rationale: நேரடி விளிப்பை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: καρδία
  choice: இதயம்
  rationale: அன்பு, பாசம், உள்ளார்ந்த மனநிலை ஆகியவற்றின் மையத்தைக் குறிக்கும் மூலமொழி உருவகத்தை அப்படியே காக்கிறது.
- source_word: πεπλάτυνται
  choice: விரிவடைந்திருக்கிறது
  rationale: ‘அகலப்படுத்துதல்/விரிவாக்குதல்’ என்ற வினையின் உருவகப் படிமத்தையும், அதன் நிறைவுவினைத் தன்மையையும் காக்கிறது.
theological_decisions:
- issue: பவுலின் வெளிப்படையான பேச்சையும் பரந்த அன்பையும் குறிக்கும் உடல் சார்ந்த உருவகங்கள்
  choice: ‘வாய் திறந்திருக்கிறது; இதயம் விரிவடைந்திருக்கிறது’ என்று உருவகங்களை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘நாங்கள் உங்களிடம் வெளிப்படையாகப் பேசியிருக்கிறோம்; எங்கள் உள்ளம் உங்களுக்காக முழுமையாகத் திறந்திருக்கிறது’ என்று பொருளை நேரடியாக விளக்குதல்
  rationale: மூலமொழியின் சொல்லாட்சியும் இரண்டு உடல் உறுப்புகளுக்கிடையிலான சொல்லணியும் காக்கப்படுகின்றன; உருவகம் தெரிவிக்கும் பொருள் அடிக்குறிப்புகளில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் கொண்ட நடை. மூலத்தின் ‘வாய்—இதயம்’ இணை உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன. தமிழில் நேரடி விளிப்பு இயல்பாக அமைய ‘கொரிந்தியர்களே’ வாக்கியத்தின் தொடக்கத்தில் வைக்கப்பட்டுள்ளது; [b] குறியீடு அது விளக்கும் ‘இதயம் விரிவடைந்திருக்கிறது’ என்பதற்குப் பின் இடப்பட்டுள்ளது.
