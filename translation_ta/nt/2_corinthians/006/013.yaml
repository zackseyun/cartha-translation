  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: ta
  text: அதே கைம்மாறாக[a]—பிள்ளைகளுக்குச் சொல்வதுபோல் நான் சொல்கிறேன்—நீங்களும் உங்கள் உள்ளத்தை விரிவாக்குங்கள்[b].
  philosophy: optimal-equivalence
