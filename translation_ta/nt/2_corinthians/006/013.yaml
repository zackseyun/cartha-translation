  - marker: a
    text: அல்லது “அதே பதிலீடாக,” “அதே ஈடாக,” அல்லது “அதே பரிமாற்றமாக.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக “நீங்களும் விரிவடையுங்கள்.” சூழலில், அன்போடும் ஏற்றுக்கொள்ளும் மனப்பான்மையோடும் தங்களைத் திறப்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιμισθίαν
  choice: கைம்மாறாக
  rationale: இச்சொல் பதிலாக அளிக்கப்படும் ஈடு அல்லது ஒத்த மறுமொழியைக் குறிக்கிறது. இங்கு பணம் செலுத்துதல் அல்ல, பவுல் காட்டிய திறந்த அன்புக்கு ஏற்ற பரஸ்பர மறுமொழியே கருத்து; ‘கைம்மாறாக’ அந்தப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: τὴν αὐτὴν
  choice: அதே
  rationale: பவுலும் அவருடைய உடன் ஊழியர்களும் காட்டிய அதே வகையான திறந்த மனப்பான்மையை கொரிந்தியர்களும் காட்ட வேண்டும் என்ற ஒத்த தன்மையை இது காக்கிறது.
- source_word: ὡς τέκνοις λέγω
  choice: பிள்ளைகளிடம் பேசுவதுபோல் பேசுகிறேன்
  rationale: τέκνοις என்பதற்கு ‘பிள்ளைகள்’ என்று நேரடியாக மொழிபெயர்க்கப்படுகிறது. கிரேக்கத்தில் இல்லாத ‘என்’ என்ற உடைமைச்சொல் சேர்க்கப்படவில்லை; அதேவேளையில் தந்தைக்குரிய அன்பான தொனி இயல்பாக வெளிப்படுகிறது.
- source_word: πλατύνθητε
  choice: உங்கள் உள்ளத்தை விரிவாக்குங்கள்
  rationale: சொல்லர்த்தமாக ‘விரிவடையுங்கள்’ அல்லது ‘அகலமாக்கப்படுங்கள்’ என்பதாகும். முந்தைய வசனங்களின் சூழலில் இது அன்பிலும் ஏற்றுக்கொள்ளுதலிலும் உள்ளத்தைத் திறப்பதைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘உள்ளத்தை’ வெளிப்படையாகச் சேர்த்து உருவகத்தைத் தக்கவைத்துள்ளோம்.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: பவுலின் திறந்த மனப்பான்மைக்கு ஒத்த மறுமொழியை கொரிந்தியர்களும் அளிக்க வேண்டும் என்ற வலியுறுத்தலையும் பரஸ்பரத் தன்மையையும் காக்கிறது.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான தொடர்ச்சி அல்லது மாற்றத்தைக் குறிக்கிறது. தமிழில் வாக்கிய அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாகத் தருவதால், ஆதாரத்தில் இல்லாத காலப் பொருளுடைய ‘இப்போது’ என்பதோ, தேவையற்ற வலுவான முரண்பாட்டைக் காட்டும் ‘ஆனால்’ என்பதோ சேர்க்கப்படவில்லை.
theological_decisions:
- issue: பவுலின் குடும்ப உறவைக் காட்ட ‘என் பிள்ளைகள்’ என்று வெளிப்படையாகச் சேர்க்கலாமா?
  choice: ‘பிள்ளைகளிடம்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘என் பிள்ளைகளிடம்’
  rationale: சூழல் பவுலின் தந்தைக்குரிய அன்பை உணர்த்தினாலும், கிரேக்கத்தில் உடைமைச்சொல் இல்லை. ஆகவே உறவின் நெருக்கத்தை வாசகர் சூழலிலிருந்து உணரும்படி விட்டு, ஆதாரத்தில் இல்லாத ‘என்’ சேர்க்கப்படவில்லை.
- issue: πλατύνθητε என்பதில் மறைந்துள்ள கருத்தை வெளிப்படையாகச் சொல்லலாமா?
  choice: ‘உங்கள் உள்ளத்தை விரிவாக்குங்கள்’ என்று உருவகத்தைத் தெளிவுபடுத்தல்
  alternative: ‘நீங்களும் விரிவடையுங்கள்’
  rationale: தனியாக ‘விரிவடையுங்கள்’ என்பது நவீன தமிழில் எதைச் சுட்டுகிறது என்பது தெளிவற்றதாக இருக்கும். 6:11–12 சூழல் உள்ளார்ந்த அன்பும் ஏற்றுக்கொள்ளுதலும் பற்றியது என்பதால் ‘உள்ளத்தை’ சேர்ப்பது கருத்தை விளக்குகிறது; ஆனால் உருவகத்தை முற்றிலும் வேறு கருத்தாக மாற்றவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கைம்மாறு’ பரஸ்பர மறுமொழியைச் சுட்டுகிறது; வணிகப் பணப்பரிவர்த்தனையை முன்னிறுத்தவில்லை. இடைக்கோடுகள் பவுலின் அன்பான பெற்றோர் தொனியிலான இடைச்சொல்லைத் தெளிவாகப் பிரிக்கின்றன.
