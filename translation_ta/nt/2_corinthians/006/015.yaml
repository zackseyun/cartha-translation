- from: மேசியாவுக்கும் பெலியாருக்கும் என்ன இசைவு இருக்கிறது? அல்லது விசுவாசிக்கும் அவிசுவாசிக்கும் பொதுவான பங்கு என்ன இருக்கிறது?[a]
  to: மேசியாவுக்கும் பெலியாருக்கும் இடையே என்ன இசைவு இருக்கிறது? அல்லது விசுவாசிக்கு அவிசுவாசியுடன் என்ன பங்கு இருக்கிறது?[a]
