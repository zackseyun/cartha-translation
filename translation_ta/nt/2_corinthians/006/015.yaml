id: 2CO.6.15
reference: 2 Corinthians 6:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: ta
  text: மேசியாவுக்கும் பெலியாருக்கும் இடையே என்ன இசைவு இருக்கிறது? அல்லது விசுவாசிக்கு அவிசுவாசியுடன் என்ன பங்கு இருக்கிறது?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'பெலியார்: கிரேக்கத்தில் Βελιάρ; இந்தப் பெயர் “பெலியால்” என்றும் வழங்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: συμφώνησις
  choice: இசைவு
  rationale: ஒத்திசைவு, இணக்கம், பொருந்துதல் ஆகிய உறவுசார் அர்த்தங்களைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: இங்கு Χριστός பெயர்போல அல்லாமல் பட்டமாகவும் பெலியாருக்கு எதிர்நிலையில் கருத்துரீதியாகவும் வருகிறது; ஆகவே ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: Βελιάρ
  choice: பெலியார்
  rationale: கிரேக்க வடிவத்தை அடிப்படையாகக் கொண்டு பெயர் ஒலிபெயர்க்கப்படுகிறது; வேறொரு பரவலான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μερίς
  choice: பொதுவான பங்கு
  rationale: இருவரும் பகிர்ந்துகொள்ளும் பங்கு அல்லது பங்கேற்பு என்ற கருத்தை வினாவின் சூழலில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πιστῷ
  choice: விசுவாசி
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெயரடை; விசுவாசம் கொண்ட ஒருவரை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἀπίστου
  choice: அவிசுவாசி
  rationale: πιστός என்பதற்கு நேரான எதிர்மறையாக, விசுவாசிக்காத ஒருவரைக் குறிக்கிறது; ‘நம்பகமற்றவர்’ என்ற வேறு பொருளைத் தவிர்க்கிறது.
- source_word: πρὸς
  choice: -க்கும் ... -க்கும்
  rationale: συμφώνησις உடன் வரும் பரஸ்பர உறவைத் தமிழில் இயல்பான இணை வேற்றுமை உருபுகள் மூலம் காட்டுகிறது.
- source_word: μετὰ
  choice: -க்கும் ... -க்கும்
  rationale: இங்கு கூட்டுறவு அல்லது பகிர்வு சார்ந்த தொடர்பைக் காட்டுகிறது; ‘பொதுவான பங்கு’ என்ற தொடருடன் தமிழில் இந்த அமைப்பு இயல்பாகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல் இன்றி தொடர்ச்சி
  rationale: முந்தைய சொல்லாட்சியின் தொடர் வினாவாக இது அமைவதால், தமிழில் ‘மேலும்’ அல்லது ‘ஆனால்’ என்று வெளிப்படையாகச் சேர்க்காமல் விடுவது இயல்பான தொடர்ச்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: பெலியாருடன் அமைந்த கருத்துரீதியான எதிர்நிலை இதன் பட்டத்தன்மையை முன்னிறுத்துகிறது; எனவே பெயர்போன்ற ‘கிறிஸ்து’ என்பதற்குப் பதிலாக ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: Βελιάρ என்பவரின் அடையாளம்
  choice: விளக்கமின்றி ‘பெலியார்’ என்ற பெயர்
  alternative: பெலியல்
  rationale: மூலத்தில் உள்ள பெயரை மட்டும் ஒலிபெயர்த்து, தீய எதிரணி என்பதற்கு மேலான அடையாள விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை; மாற்று வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, வாசிக்க எளிய சொல்லாட்சி. இரண்டு சொல்லாட்சிக் கேள்விகளின் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது; ‘பொதுவான பங்கு’ என்பது μερίς குறிக்கும் பகிரப்பட்ட பங்கேற்பைத் தெளிவாக்குகிறது.
