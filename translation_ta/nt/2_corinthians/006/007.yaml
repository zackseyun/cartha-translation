  - marker: c
    text: கிரேக்கத்தில் ‘வலது’ மற்றும் ‘இடது’ என்ற சொற்கள், கை அல்லது பக்கத்தைக் குறிக்கும் பெயர்ச்சொல் விடுபட்ட நிலையில் உள்ளன. இது இரு கைகளிலும் ஆயுதம் ஏந்திய முழு ஆயத்த நிலையை நினைவூட்டலாம்.
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: சத்தியத்தின் வார்த்தை
  rationale: λόγος என்பது வார்த்தை, செய்தி, பேச்சு ஆகிய பொருள்களைத் தரக்கூடும். ‘சத்தியத்தின் வார்த்தை’ கிரேக்க வடிவத்தைப் பேணுவதோடு உண்மையான அறிவிப்பையும் சத்தியச் செய்தியையும் உள்ளடக்க இடமளிக்கிறது.
- source_word: δυνάμει θεοῦ
  choice: கடவுளின் வல்லமை
  rationale: இறைவனிடமிருந்து வரும் செயலாற்றலை இயல்பாகவும் நேரடியாகவும் குறிக்கிறது; மீண்டும் வரும் ἐν அமைப்பின் ஓசையையும் பேணுகிறது.
- source_word: διὰ
  choice: மூலமாக
  rationale: Genitive உடன் வரும் διά இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது. ‘மூலமாக’ என்பது அந்த உறவைத் தெளிவாகத் தருகிறது.
- source_word: ὅπλων
  choice: ஆயுதங்கள்
  rationale: ὅπλον தாக்குதலுக்கோ தற்காப்புக்கோ பயன்படும் போர்க்கருவிகளைக் குறிக்கலாம். ‘ஆயுதங்கள்’ அந்தப் பரந்த பொருளை இயல்பாகக் காக்கிறது.
- source_word: δικαιοσύνης
  choice: நீதி
  rationale: δικαιοσύνη இங்கு நேர்மையான அல்லது சரியான நடத்தை, அல்லது கடவுள் அளிக்கும் நீதியான போர்க்கருவிகள் என்ற திறந்த பொருளைக் கொண்டிருக்கலாம். நியாயம் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: வலக்கையிலும் இடக்கையிலும் உள்ள
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இவ்விரு பெயரடைகளும் வலது மற்றும் இடது கை அல்லது பக்கத்தைச் சுட்டுகின்றன. தமிழ் வாசிப்பில் இயல்புக்காக ‘கை’ வெளிப்படையாகச் சேர்க்கப்படுகிறது; தாக்குதல்/தற்காப்பு என்ற குறிப்பிட்ட விளக்கம் முதன்மை உரையில் திணிக்கப்படவில்லை.
theological_decisions:
- issue: Pauline phrase-இல் δικαιοσύνη என்பதன் பொருள்
  choice: நீதி
  alternative: நியாயம்
  rationale: ‘நீதி’ என்பது ஒழுக்கச் செம்மையையும் நீதியான நிலையையும் தாங்கக்கூடிய பரந்த தமிழ் சொல். சமூக அல்லது தீர்ப்புசார் ‘நியாயம்’ என்ற பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: வலது மற்றும் இடது குறித்த போர்ப்படிமம்
  choice: வலக்கையிலும் இடக்கையிலும் உள்ள ஆயுதங்கள்
  alternative: வலப்புறத்திற்கும் இடப்புறத்திற்கும் உரிய ஆயுதங்கள்
  rationale: கிரேக்கம் எந்த ஆயுதம் தாக்குதலுக்கானது, எது தற்காப்புக்கானது என்று கூறவில்லை. ஆகவே இரு கைகளிலும் முழுமையாக ஆயத்தமாக இருப்பது என்ற படிமம் காக்கப்படுகிறது; குறிப்பிட்ட இராணுவச் சின்னவியல் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைக் கொண்டுள்ளது. இது தொடரும் பட்டியலின் ஒரு பகுதியாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘வார்த்தை’, ‘வல்லமை’, ‘நீதி’, ‘ஆயுதங்கள்’ ஆகியவை பரிச்சயமான வேதாகமச் சொற்களாக இருந்தாலும் பொதுவாசகருக்கும் புரியக்கூடியவை.
