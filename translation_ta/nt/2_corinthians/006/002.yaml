id: 2CO.6.2
reference: 2 Corinthians 6:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: ta
  text: 'ஏனெனில், அவர் கூறுகிறார்: “ஏற்றுக்கொள்ளத்தக்க வேளையில் நான் உனக்குச் செவிகொடுத்தேன்[a]; மீட்பின் நாளில் உனக்கு உதவினேன்.” இதோ, இப்பொழுதே மிகவும் ஏற்றுக்கொள்ளத்தக்க வேளை; இதோ, இப்பொழுதே மீட்பின் நாள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உனக்குச் சாதகமாகச் செவிகொடுத்தேன்.” இங்கு வரும் வினைச்சொல், ஏற்றுக்கொண்டு கேட்பதையோ கேட்டதற்கு மறுமொழி அளிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இப்பொழுதே ஏற்றுக்கொள்ளத்தக்க வேளை … இப்பொழுதே மீட்பின் நாள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இவ்விரு சொற்றொடர்களுக்கும் திட்டவட்டச் சுட்டுச்சொல் இல்லை; தமிழில் ‘அந்த’ அல்லது ‘ஒரு’ என்று சேர்க்காமல் இருப்பதும் இயல்பானது.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: ஏனெனில், அவர் கூறுகிறார்
  rationale: γάρ முந்தைய வேண்டுகோளுக்கான விளக்கத் தொடர்பை அளிக்கிறது; நிகழ்கால λέγει வேதவாக்கில் பேசும் இறைவனைத் தனிப்பட்ட எழுவாயாக வைத்திருக்கிறது.
- source_word: Καιρῷ δεκτῷ
  choice: ஏற்றுக்கொள்ளத்தக்க வேளையில்
  rationale: καιρός வெறும் கால ஓட்டத்தைவிடத் தகுந்த அல்லது குறிக்கப்பட்ட சந்தர்ப்பத்தைக் குறிக்கிறது; δεκτός ஏற்றுக்கொள்ளப்படுதல் அல்லது சாதகமாயிருத்தல் என்ற பொருளைத் தருகிறது.
- source_word: ἐπήκουσά σου
  choice: நான் உனக்குச் செவிகொடுத்தேன்
  rationale: ἐπακούω கேட்டல் மட்டுமல்லாமல் சாதகமாகக் கேட்டு மறுமொழி அளிக்கும் நிழற்பொருளையும் கொள்ளலாம்; ‘செவிகொடுத்தேன்’ அதை மிகையாக ‘பதிலளித்தேன்’ என்று தீர்மானிக்காமல் காக்கிறது.
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: மீட்பின் நாளில்
  rationale: தமிழில் இயல்பான சொற்றொடராகவும் σωτηρία என்பதன் விடுவித்தல்/காப்பாற்றுதல் பொருளைத் தெளிவாகவும் தருகிறது; கிரேக்கத்தில் சுட்டுச்சொல் இல்லாததால் கட்டாயமான ஒருமைத் தனித்தன்மையை உரை மீது சுமத்தவில்லை.
- source_word: ἐβοήθησά σοι
  choice: உனக்கு உதவினேன்
  rationale: βοηθέω என்பதன் நேரான, இயல்பான தமிழ் இணை; உதவிக்கு வந்த செயலைத் தெளிவாகச் சொல்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் சொல்லின் வலிமையையும் வேதவாக்கியத்திற்கேற்ற கண்ணியத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: νῦν
  choice: இப்பொழுதே
  rationale: νῦν என்பதன் நிகழ்கால அவசரத்தை ‘-ஏ’ வலியுறுத்தல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: மிகவும் ஏற்றுக்கொள்ளத்தக்க வேளை
  rationale: εὐπρόσδεκτος என்பது δεκτός-ஐவிட வலுவாக ‘மிகவும் வரவேற்கத்தக்க/ஏற்றுக்கொள்ளத்தக்க’ என்ற பொருளைக் கொண்டுள்ளது; ‘மிகவும்’ அந்த வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: ἡμέρα σωτηρίας
  choice: மீட்பின் நாள்
  rationale: சொற்றொடரின் செறிவையும் பவுலின் உடனடி பயன்பாட்டையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: முடிவுப் பகுதியில் காலத்தையும் மீட்பின் நாளையும் திட்டவட்டமாகவா அல்லது திட்டவட்டமற்றதாகவா மொழிபெயர்ப்பது
  choice: தமிழில் இயல்பான ‘வேளை’ மற்றும் ‘மீட்பின் நாள்’ வடிவங்களைப் பயன்படுத்தி, கிரேக்கத்தின் சுட்டுச்சொல் இல்லாமையை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘அந்த ஏற்றுக்கொள்ளத்தக்க வேளை’ / ‘அந்த மீட்பின் நாள்’ அல்லது ‘ஓர் ஏற்றுக்கொள்ளத்தக்க வேளை’ / ‘ஒரு மீட்பின் நாள்’
  rationale: கிரேக்கச் சொற்றொடர்கள் சுட்டுச்சொல் அற்றவை; ஆனால் தமிழில் ஆங்கில article வேறுபாட்டை இயந்திரமாகப் பிரதிபலிப்பது இயல்பில்லாதது. ‘அந்த’ என்பதைச் சேர்க்காமல் இருப்பது தேவையற்ற திட்டவட்டத்தைத் தவிர்க்கிறது; ‘ஒரு’ என்பதைச் சேர்க்காமல் இருப்பது பவுலின் வலியுறுத்தலைச் சிதைக்காது.
- issue: λέγει என்பதின் எழுவாய் வேதமா அல்லது வேதவாக்கில் பேசும் இறைவனா
  choice: ‘அவர் கூறுகிறார்’ என்று தனிப்பட்ட எழுவாயுடன் மொழிபெயர்த்தல்
  alternative: ‘வேதவாக்கு கூறுகிறது’
  rationale: மேற்கோளில் இறைவனே பேசுபவராக இருப்பதைக் கிரேக்கத்தின் மறைமுக எழுவாய் இயல்பாக அனுமதிக்கிறது; ‘அவர்’ அந்தத் தன்மையை விளக்கச் சொற்கள் சேர்க்காமல் காக்கிறது.
- issue: σωτηρία என்பதற்கு ‘இரட்சிப்பு’ அல்லது ‘மீட்பு’
  choice: மீட்பு
  alternative: இரட்சிப்பு
  rationale: ‘மீட்பு’ நவீன பொதுத் தமிழில் புரிந்துகொள்ளத்தக்கது; காப்பாற்றுதல் மற்றும் விடுவித்தல் ஆகிய மூலப் பொருள் பரப்பை ஒரு குறிப்பிட்ட சமய வழக்குச் சொல்லுக்குள் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. மேற்கோளின் ஒருமை ‘உன்/உனக்கு’ காக்கப்பட்டுள்ளது. ‘இதோ’ என்ற இருமுறை அழைப்பும் ‘இப்பொழுதே’ என்ற அவசர வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
