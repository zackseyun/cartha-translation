id: 2CO.6.12
reference: 2 Corinthians 6:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ στενοχωρεῖσθε ἐν ἡμῖν, στενοχωρεῖσθε δὲ ἐν τοῖς σπλάγχνοις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: ta
  text: எங்களால் நீங்கள் நெருக்கப்படவில்லை[a]; ஆனால், உங்கள் உள்ளார்ந்த பாசத்தில்தான் நீங்கள் நெருக்கப்படுகிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எங்களுக்குள் நீங்கள் இடநெருக்கத்தில் இல்லை; உங்கள் சொந்த இதயங்களில்தான் இடநெருக்கத்தில் இருக்கிறீர்கள்.’
    reason: ἐν மற்றும் στενοχωρέομαι ஆகியவற்றின் இடவியல் உருவகத்தை மேலும் நேரடியாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: οὐ στενοχωρεῖσθε
  choice: நீங்கள் நெருக்கப்படவில்லை
  rationale: στενοχωρέομαι என்பது அடிப்படையில் குறுகிய இடத்தில் நெருக்கப்படுவதையும், உருவகமாகக் கட்டுப்படுத்தப்படுவதையும் குறிக்கிறது. ‘நெருக்கப்படவில்லை’ என்பது அந்த உருவகத்தையும் உறவுசார் சூழலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐν ἡμῖν
  choice: எங்களால்
  rationale: ἐν என்பதன் நேரடிப் பொருள் ‘எங்களில்’ என்றாலும், இங்கு கொரிந்தியர்களின் நெருக்கத்திற்குப் பவுலும் அவருடைய உடன் ஊழியர்களும் காரணம் அல்ல என்பதே கருத்து. ஆகவே காரணத்தைக் குறிக்கும் இயல்பான தமிழாக ‘எங்களால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: δὲ
  choice: ஆனால் என்பதற்குப் பதிலாக அரைப்புள்ளி அமைப்பில் மறைமுக எதிர்மறை இணைப்பு
  rationale: δέ இரண்டு கூறுகளையும் எதிர்மறையாக இணைக்கிறது. தமிழில் ‘ஆனால்’ என்றும் தரலாம்; எனினும் சுருக்கமான சொல்லாட்சியில் அரைப்புள்ளிக்குப் பிந்தைய மாறுபாடு தெளிவாக இருப்பதால் இணைப்புச்சொல் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: உங்கள் சொந்த உள்ளன்பில்தான்
  rationale: σπλάγχνα என்பது நேரடியாக உள்ளுறுப்புகளையும், உருவகமாக ஆழ்ந்த உணர்வுகள் மற்றும் அன்பின் இருப்பிடத்தையும் குறிக்கிறது. ‘உள்ளன்பு’ இந்த உணர்ச்சிசார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘சொந்த’ என்பது கட்டுப்பாடு அவர்களுக்குள்ளேயே இருப்பதை வலியுறுத்துகிறது.
theological_decisions:
- issue: σπλάγχνα என்பதன் உருவகப் பொருள்
  choice: கொரிந்தியர்களின் உள்ளார்ந்த அன்பு அல்லது பாசத் திறன்
  alternative: ‘உள்ளுறுப்புகள்’ என்ற நேரடிப் பொருள்; அல்லது ‘இதயங்கள்’ என்ற பரந்த உருவகம்
  rationale: சூழல் பவுலின் திறந்த உள்ளத்திற்கும் கொரிந்தியர்களின் குறுகிய மறுமொழிக்கும் இடையிலான உறவுசார் வேறுபாட்டைப் பற்றியது. எனவே உடல் உறுப்புகளைக் குறிக்கும் நேரடி மொழிபெயர்ப்பைவிட உணர்ச்சிசார் உருவகப் பொருள் பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இரண்டு முறை வரும் στενοχωρεῖσθε என்பதற்கு ஒரே ‘நெருக்கப்படுதல்’ சொல்லைத் தொடர்ந்து பயன்படுத்தி பவுலின் சொல்லாட்சி எதிர்மறை ஒப்புமை பாதுகாக்கப்பட்டுள்ளது.
