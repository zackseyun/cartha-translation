id: 2CO.6.6
reference: 2 Corinthians 6:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: ta
  text: தூய்மையில், அறிவில், பொறுமையில், கனிவில், பரிசுத்த ஆவியில்[a], பாசாங்கற்ற அன்பில்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மனிதனின் பரிசுத்தமான மனப்பாங்கைக் குறிப்பதாக எடுத்துக்கொண்டால், ‘பரிசுத்தமான ஆவியில்.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: தூய்மையில்
  rationale: ἁγνότης என்பது பரந்த பொருளில் ஒழுக்கத் தூய்மையையும் மாசற்ற தன்மையையும் குறிக்கிறது; இதை பாலியல் கற்பு என்ற பொருளுக்கு மட்டும் சுருக்காமல் ‘தூய்மை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γνώσει
  choice: அறிவில்
  rationale: γνῶσις இங்கு அறிவைக் குறிக்கிறது; ஊழியச் சூழலில் நடைமுறை மற்றும் ஆன்மீகப் புரிதலையும் உள்ளடக்கக்கூடிய பரந்த சொல்லாக ‘அறிவு’ உள்ளது.
- source_word: μακροθυμίᾳ
  choice: பொறுமையில்
  rationale: μακροθυμία என்பது மனிதர்களையோ கடின நிலைகளையோ நீடிய பொறுமையுடன் சகித்திருப்பதைக் குறிக்கிறது; ‘பொறுமை’ நவீன தமிழில் தெளிவான, இயல்பான இணைச்சொல்.
- source_word: χρηστότητι
  choice: கனிவில்
  rationale: χρηστότης என்பது பிறரிடம் காட்டப்படும் அன்பான நன்மை, இரக்கம், இனிய அணுகுமுறை ஆகியவற்றைக் குறிக்கிறது; உறவுசார் பண்பை ‘கனிவு’ இயல்பாகப் பிடிக்கிறது.
- source_word: πνεύματι ἁγίῳ
  choice: பரிசுத்த ஆவியில்
  rationale: பவுலின் வழக்கிலும் இச்சூழலிலும் இந்தச் சொற்றொடர் பெரும்பாலும் இறை ஆவியான பரிசுத்த ஆவியைக் குறிக்கிறது; எனினும் மனிதனின் பரிசுத்தமான மனப்பாங்கு என்ற இலக்கண வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: பாசாங்கற்ற அன்பில்
  rationale: ἀνυπόκριτος என்பது போலித்தனமோ நடிப்போ இல்லாததைக் குறிக்கிறது; ‘பாசாங்கற்ற அன்பு’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν
  choice: -இல்
  rationale: மீண்டும் மீண்டும் வரும் ἐν வழி, சூழல், அல்லது நடைமுறையைச் சுட்டலாம். தமிழில் ‘-இல்’ என்னும் வேற்றுமை உருபைத் தொடர்ந்து பயன்படுத்துவது கிரேக்கப் பட்டியலின் சொல்லாட்சித் தாளத்தையும் அதன் நெகிழ்வான பொருளையும் காக்கிறது.
theological_decisions:
- issue: πνεύματι ἁγίῳ என்பதன் குறிப்பு
  choice: இறை ஆவியான பரிசுத்த ஆவி
  alternative: பரிசுத்தமான மனப்பாங்கு அல்லது ஆவி
  rationale: பவுலின் மொழிப்பயன்பாடும் சுற்றியுள்ள ஊழியச் சூழலும் பரிசுத்த ஆவியையே முதன்மையாகச் சுட்டுகின்றன. ஆனாலும் கிரேக்கத்தில் சுட்டுப்பெயர்ச்சொல் இல்லாததால் மனிதனின் பரிசுத்த மனப்பாங்கு என்ற சாத்தியத்தை முற்றிலும் நீக்காமல் அடிக்குறிப்பில் தருவது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமானதும் கண்ணியமானதுமான பட்டியல் நடையைப் பயன்படுத்தியுள்ளது. கிரேக்கத்தில் திரும்பத் திரும்ப வரும் ἐν என்பதற்கு ஒவ்வொரு கூறிலும் ‘-இல்’ பயன்படுத்தப்பட்டு சொல்லாட்சித் தாளம் காக்கப்பட்டுள்ளது. ‘பாசாங்கற்ற’ என்பது ἀνυπόκριτος என்பதன் மறுப்புப் பொருளை நேரடியாகத் தக்கவைக்கிறது.
