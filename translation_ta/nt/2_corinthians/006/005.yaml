source:
  edition: SBLGNT
  text: ἐν πληγαῖς, ἐν φυλακαῖς, ἐν ἀκαταστασίαις, ἐν κόποις, ἐν ἀγρυπνίαις, ἐν νηστείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: ta
  text: அடிகளிலும், சிறைவாசங்களிலும், கலவரங்களிலும், கடுமையான உழைப்புகளிலும், தூக்கமில்லா இரவுகளிலும், உண்ணாநோன்புகளிலும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: அடிகளிலும்
  rationale: உடலில் அடிக்கப்படுதல் அல்லது தாக்கப்படுதல் என்ற பன்மைச் சொல்லின் பொருளை இயல்பாகத் தருகிறது.
- source_word: φυλακαῖς
  choice: சிறைவாசங்களிலும்
  rationale: பல முறை சிறையில் வைக்கப்பட்ட அனுபவங்களைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது.
- source_word: ἀκαταστασίαις
  choice: கலவரங்களிலும்
  rationale: இச்சூழலில் பொதுக் குழப்பம், ஒழுங்கின்மை, கிளர்ச்சி ஆகிய பொருள்களைக் கொண்ட சொல்லை இயல்பான தமிழில் தருகிறது; கலவரத்தை யார் ஏற்படுத்தினர் என்பதைத் தீர்மானிக்கவில்லை.
- source_word: κόποις
  choice: கடுமையான உழைப்புகளிலும்
  rationale: சாதாரண வேலை மட்டுமல்லாமல் களைப்பூட்டும் உழைப்பையும் துன்பத்தையும் குறிக்கும் சொல்லின் வலிமையை வெளிப்படுத்துகிறது.
- source_word: ἀγρυπνίαις
  choice: தூக்கமில்லா இரவுகளிலும்
  rationale: விழித்திருத்தல் அல்லது உறக்கமின்மையின் அனுபவத்தை வாசகருக்கு இயல்பாகப் புரியச் செய்கிறது.
- source_word: νηστείαις
  choice: உண்ணாநோன்புகளிலும்
  rationale: உணவு உண்ணாமல் இருப்பதைக் குறிக்கிறது; இவை விருப்பமான சமய நோன்புகளா அல்லது பற்றாக்குறையால் ஏற்பட்ட பட்டினியா என்ற மூலத்தின் சாத்தியமான நுண்பொருள் இங்கு முழுமையாகத் தீர்மானிக்கப்படவில்லை.
theological_decisions:
- issue: νηστείαις என்பது விருப்ப நோன்புகளையா அல்லது கட்டாய உணவின்மையையா குறிக்கிறது
  choice: உண்ணாநோன்புகளிலும்
  alternative: பட்டினிகளிலும் / உணவின்றி இருந்ததிலும்
  rationale: பவுலின் பட்டியலில் இந்தச் சொல் இரு விதமாகப் புரிந்துகொள்ளப்படலாம். தமிழில் ‘உண்ணாநோன்பு’ நோன்பை முதன்மையாகக் காட்டினாலும், மூலத்தின் ‘உண்ணாமல் இருத்தல்’ என்ற அடிப்படையைத் தக்கவைக்கிறது; குறிப்பிட்ட துறவியல் நடைமுறையைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியலின் ஒரேபோன்ற ‘-இலும்’ அமைப்பைப் பாதுகாத்து, கண்ணியமானதும் வாய்வழி வாசிப்பிற்கு ஏற்றதுமான நடையில் வடிவமைக்கப்பட்டது. வசனம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது.
