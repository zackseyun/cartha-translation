revisions:
- from: எந்த வகையிலும் யாரும் இடறுவதற்கு நாங்கள் காரணம் கொடுப்பதில்லை[a]; இதனால் எங்கள் ஊழியம் குற்றஞ்சாட்டப்படாதிருக்கும்[b].
  to: ஊழியம் குற்றஞ்சாட்டப்படாதபடிக்கு, நாங்கள் எந்த வகையிலும் இடறலுக்குக் காரணம் கொடுப்பதில்லை[a].
  rationale: The revision removes the unsupported possessive ‘எங்கள்’ and renders the Greek ἵνα μὴ clause with the Tamil purpose expression ‘...படாதபடிக்கு.’ The wording retains the comprehensive scope of ἐν μηδενί and the stumbling metaphor of προσκοπή. Footnote b is retained as a valid lexical alternative for μωμηθῇ, but its anchor is not placed in the revised main text because the purpose clause has been fronted; it should be anchored to ‘குற்றஞ்சாட்டப்படாதபடிக்கு’ when the publishing system supports a footnote marker there.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:08:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft appropriately renders the comprehensive negation and preserves προσκοπή as an ‘occasion/cause for stumbling.’ However, ‘எங்கள்’ adds an explicit possessive not present in ἡ διακονία, and ‘இதனால்’ presents the final clause chiefly as a result rather than preserving its purpose force.
  naturalness: The current Tamil is generally clear, but ‘ஊழியம் குற்றஞ்சாட்டப்படாதிருக்கும்’ after ‘இதனால்’ is less precise for the Greek purpose clause. Fronting ‘ஊழியம் குற்றஞ்சாட்டப்படாதபடிக்கு’ gives a natural, explicit purpose construction in modern standard Tamil.
  terminology: ‘இடறலுக்குக் காரணம்’ is a faithful and natural rendering of προσκοπή. ‘ஊழியம்’ suitably renders διακονία in this Pauline context without imposing an ecclesiastical office. ‘குற்றஞ்சாட்டப்படுதல்’ accurately represents the passive sense of μωμηθῇ.
  issues:
  - severity: medium
    issue: The main text adds ‘எங்கள்’ (“our”) to ‘ஊழியம்.’
    rationale: The Greek has the article ἡ (‘the’) but no possessive pronoun. Although the context identifies the ministry with Paul and coworkers, the possessive is not necessary in Tamil and slightly narrows the wording beyond the source.
  - severity: medium
    issue: ‘இதனால்’ does not clearly retain the ἵνα μὴ purpose relation.
    rationale: ἵνα μὴ means ‘so that/in order that ... not.’ ‘ஊழியம் குற்றஞ்சாட்டப்படாதபடிக்கு’ explicitly and naturally preserves that purpose.
  revised_text: ஊழியம் குற்றஞ்சாட்டப்படாதபடிக்கு, நாங்கள் எந்த வகையிலும் இடறலுக்குக் காரணம் கொடுப்பதில்லை[a].
