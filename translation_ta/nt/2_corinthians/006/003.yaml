lexical_decisions:
- source_word: μηδεμίαν ... προσκοπήν
  choice: யாரும் இடறுவதற்கு ... காரணம் கொடுப்பதில்லை
  rationale: προσκοπή என்பது இடறலுக்கான காரணம் அல்லது புண்படுத்தும் தடையைச் சுட்டலாம். ‘இடறுவதற்கு காரணம்’ என்பது கிரேக்க உருவகத்தை இயல்பான தமிழில் காக்கிறது; μηδεμίαν என்பதன் முழுமையான மறுப்பையும் வெளிப்படுத்துகிறது.
- source_word: ἐν μηδενί
  choice: எந்த வகையிலும்
  rationale: இச்சொற்றொடர் எந்தச் சூழலிலும் அல்லது எந்த அம்சத்திலும் என்பதான விரிவான பொருளைக் கொண்டது. ‘எந்த வகையிலும்’ என்பது நவீன தமிழில் இயல்பாகவும் முழுமையான பரப்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: διδόντες
  choice: காரணம் கொடுப்பதில்லை
  rationale: διδόντες என்பதன் அடிப்படைப் பொருளான ‘கொடுத்தல்’ காக்கப்படுகிறது; தமிழில் ‘காரணம் கொடுத்தல்’ இயல்பான சொல்லிணைவு.
- source_word: ἵνα μὴ
  choice: இதனால் ... படாதிருக்கும்
  rationale: இது நோக்கம் அல்லது விளைவை அறிமுகப்படுத்துகிறது. ‘இதனால் ... படாதிருக்கும்’ இரண்டிற்கும் இடையிலான தொடர்பை இயல்பாகக் காக்கிறது.
- source_word: μωμηθῇ
  choice: குற்றஞ்சாட்டப்படாதிருக்கும்
  rationale: இந்தச் செயல்சொல் குற்றம் காணுதல், பழிசுமத்துதல் அல்லது மதிப்பிழக்கச் செய்தல் எனப் பொருள்படலாம். ‘குற்றஞ்சாட்டப்படுதல்’ செயப்பாட்டு வடிவையும் முதன்மைப் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἡ διακονία
  choice: எங்கள் ஊழியம்
  rationale: சூழலில் இது பவுலும் அவருடைய உடன் ஊழியர்களும் மேற்கொள்ளும் திருத்தூதுப் பணியைக் குறிக்கிறது. கிரேக்கத்தில் உடைமைச் சொல் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் குறிப்பு தெளிவாக இருக்க ‘எங்கள்’ சேர்க்கப்பட்டுள்ளது; இது பின்னாளைய பதவி அமைப்பை இறக்குமதி செய்யாது.
theological_decisions:
- issue: διακονία என்பது பொதுவான சேவையா அல்லது பவுலின் திருத்தூதுப் பணியா
  choice: ‘எங்கள் ஊழியம்’ என்று, பவுலும் அவருடைய உடன் ஊழியர்களும் செய்யும் பணியைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அந்தச் சேவை’ அல்லது ‘ஊழியம்’ என்று மட்டும் மொழிபெயர்த்தல்.
  rationale: உடனடிச் சூழல் தேவனுடைய ஊழியர்களாக அவர்கள் நடந்துகொள்வதைப் பற்றியது. ‘ஊழியம்’ பவுலின் பணியைப் பொருத்தமாகக் காட்டுகிறது; ‘எங்கள்’ என்பது தமிழில் குறிப்பைத் தெளிவாக்குகிறது, ஆனால் குறிப்பிட்ட திருச்சபைப் பதவியைச் சுமத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. கிரேக்கப் பங்கேற்புச் சொல்லைத் தமிழில் முதன்மை வாக்கியமாக மாற்றி இயல்பாக்கப்பட்டுள்ளது. இடறல் உருவகம் முதன்மை உரையில் காக்கப்பட்டு, ‘புண்படுதல்’ அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
