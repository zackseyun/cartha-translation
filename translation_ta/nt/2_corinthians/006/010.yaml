revisions:
- from: துயருறுகிறவர்களைப் போல் இருந்தாலும், எப்போதும் மகிழ்கிறவர்கள்; ஏழைகளைப் போல் இருந்தாலும், பலரைச் செல்வந்தர்களாக்குகிறவர்கள்[a]; ஒன்றும் இல்லாதவர்களைப் போல் இருந்தாலும், அனைத்தையும் உடைமையாகக் கொண்டிருக்கிறவர்கள்[b].
  to: துயருறுபவர்கள்போல், ஆயினும் எப்போதும் மகிழ்கிறவர்களாக; ஏழைகள்போல், ஆயினும் பலரைச் செல்வந்தர்களாக்குகிறவர்களாக[a]; ஒன்றும் இல்லாதவர்கள்போல், ஆயினும் அனைத்தையும் உடையவர்களாக[b].
  rationale: The revision preserves the Greek’s repeated ὡς comparative framing and δέ-driven paradox in a more concise Tamil parallelism. It avoids suggesting that the comparison is to distinct groups of people, retains the open-ended character of wealth and possession, and keeps both footnotes attached to the clauses they explain.
