base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: ta
  text: துயருறுபவர்கள்போல், ஆயினும் எப்போதும் மகிழ்கிறவர்களாக; ஏழைகள்போல், ஆயினும் பலரைச் செல்வந்தர்களாக்குகிறவர்களாக[a]; ஒன்றும் இல்லாதவர்கள்போல், ஆயினும் அனைத்தையும் உடையவர்களாக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பலரை வளப்படுத்துகிறவர்கள்” என்றும் மொழிபெயர்க்கலாம். இங்கு எந்த வகையான செல்வம் என்பது கிரேக்க உரையில் வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் இது பொருள் செல்வத்தைவிட ஆவிக்குரிய வளத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க உரை, “ஒன்றும் இல்லாதவர்கள்” என்பதையும் “அனைத்தையும் உடையவர்கள்” என்பதையும் விளக்கம் சேர்க்காமல் முரண்பாடாக நிறுத்துகிறது.
    reason: theological_tension
lexical_decisions:
- source_word: ὡς
  choice: …போல் இருந்தாலும்
  rationale: மூன்று முரண்பாட்டு இணைகளிலும் வரும் ஒப்புமைச் சட்டகத்தை இயல்பான தமிழில் காக்கிறது; வெளித்தோற்றத்துக்கும் அதற்கு மாறான உண்மைக்கும் இடையிலான அழுத்தத்தையும் வெளிப்படுத்துகிறது.
- source_word: λυπούμενοι
  choice: துயருறுகிறவர்கள்
  rationale: செயலின் காரணத்தையோ செய்பவரையோ தேவையின்றிக் குறிப்பிடாமல், தொடரும் துயரநிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀεὶ δὲ χαίροντες
  choice: எப்போதும் மகிழ்கிறவர்கள்
  rationale: ἀεί என்பதன் காலத் தொடர்ச்சியையும் δέ உருவாக்கும் முரண்பாட்டையும் முந்திய ‘இருந்தாலும்’ என்ற அமைப்புடன் தெளிவாகக் கொண்டுவருகிறது.
- source_word: πτωχοὶ
  choice: ஏழைகள்
  rationale: பொருளாதார வறுமையையும் தாழ்ந்த வெளிநிலையையும் அனுமதிக்கும் நேரான, மிகைப்படுத்தாத சொல்.
- source_word: πλουτίζοντες
  choice: செல்வந்தர்களாக்குகிறவர்கள்
  rationale: ‘செல்வமுள்ளவர்களாக ஆக்குதல்’ என்ற வினைச்சொல்லின் செயப்படுபொருள் சார்ந்த வலிமையைத் தக்கவைக்கிறது; செல்வம் எந்த வகையானது என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: μηδὲν ἔχοντες
  choice: ஒன்றும் இல்லாதவர்கள்
  rationale: வெளிப்படையான முழுமையான இல்லாமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πάντα κατέχοντες
  choice: அனைத்தையும் உடைமையாகக் கொண்டிருக்கிறவர்கள்
  rationale: κατέχω இங்கு ‘பற்றிக்கொள்/வைத்திரு/உடைமையாகக் கொள்’ என்ற பொருள்களில், ‘ஒன்றும் இல்லாதவர்கள்’ என்பதற்கு நேரான முரண்பாடாக உண்மையான உடைமையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பலரைச் செல்வந்தர்களாக்குதல் மற்றும் அனைத்தையும் உடைமையாகக் கொண்டிருத்தல் ஆகியவற்றின் தன்மை
  choice: இவை ஆவிக்குரியவை என்று முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல், கிரேக்க உரையின் முரண்பாட்டு மொழியை அப்படியே திறந்த நிலையில் வைத்தல்.
  alternative: ‘ஆவிக்குரிய செல்வந்தர்களாக்குகிறவர்கள்’ என்றும் ‘கிறிஸ்துவில் அனைத்தையும் உடையவர்கள்’ என்றும் விளக்கமாக மொழிபெயர்த்தல்.
  rationale: சூழலும் பவுலின் விரிந்த இறையியலும் ஆவிக்குரிய செல்வத்தைச் சுட்டலாம்; ஆனால் இவ்வசனத்தின் கிரேக்க உரை அத்தகைய அடைமொழியைச் சேர்க்கவில்லை. ஆகவே அதன் இறையியல் அழுத்தத்தையும் பரந்த பொருள் வாய்ப்பையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று இணைகளின் ஒரேவிதமான ஓசையையும் ‘…போல் இருந்தாலும்’ என்ற திரும்பவரும் அமைப்பையும் காத்து, பவுலின் முரண்பாட்டு பட்டியல் தெளிவாகத் தரப்பட்டுள்ளது.
