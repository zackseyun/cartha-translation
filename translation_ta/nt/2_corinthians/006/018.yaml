source:
  edition: SBLGNT
  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: ta
  text: “நான் உங்களுக்குத் தந்தையாக இருப்பேன்[a]; நீங்கள் எனக்கு மகன்களாகவும் மகள்களாகவும் இருப்பீர்கள்” என்று எல்லாம் வல்ல ஆண்டவர் கூறுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியான சொல்லாக்கத்தில், “நான் உங்களுக்கு ஒரு தந்தையாக இருப்பேன்; நீங்கள் எனக்கு மகன்களாகவும் மகள்களாகவும் இருப்பீர்கள்.” கிரேக்கத்தில் இந்தச் சொல்லமைப்பு உடன்படிக்கை உறவை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: நான் உங்களுக்குத் தந்தையாக இருப்பேன்
  rationale: ‘இருப்பேன்’ என்பது எதிர்காலத்தை இயல்பாகக் காட்டுகிறது; ‘உங்களுக்குத் தந்தையாக’ என்பது εἶναι + dative + εἰς என்ற உடன்படிக்கை உறவைச் சுட்டும் கிரேக்க மரபுத்தொடரைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: நீங்கள் எனக்கு ... இருப்பீர்கள்
  rationale: வெளிப்படையாக வரும் ὑμεῖς என்பதன் வலியுறுத்தலை ‘நீங்கள்’ தக்கவைக்கிறது; ‘எனக்கு ... இருப்பீர்கள்’ என்பது முதல் கூற்றுடன் உள்ள பரஸ்பர உறவையும் அமைப்பியல் ஒற்றுமையையும் காக்கிறது.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: மகன்களாகவும் மகள்களாகவும்
  rationale: கிரேக்கம் ஆண், பெண் இருபாலரையும் தனித்தனியாகக் குறிப்பிடுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக அந்தத் தெளிவான உள்ளடக்கம் தக்கவைக்கப்படுகிறது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: நிகழ்கால மேற்கோள் சூத்திரத்தை நிகழ்கால மரியாதை வினையாக வழங்குவது நவீனத் தமிழில் இயல்பாகவும், இறைவாக்கின் தொடர்ந்த அதிகாரத்தை உணர்த்துவதாகவும் உள்ளது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இங்கு இது இறைவனைக் குறிக்கும் பட்டப்பெயர்; ‘ஆண்டவர்’ என்பது நவீன வேதாகமத் தமிழில் இயல்பானதும் κύριος என்பதற்கு நேரானதுமான இணை.
- source_word: παντοκράτωρ
  choice: எல்லாம் வல்ல
  rationale: அனைத்தின்மேலும் வல்லமையும் ஆட்சியுரிமையும் கொண்டவர் என்ற தெய்வீகப் பட்டத்தின் செறிவை இயல்பான தமிழில் தருகிறது; வேறொரு எபிரேயப் பட்டத்தை இங்கு இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: மகன்–மகள் உறவை உள்ளடக்கத் துல்லியமாக வழங்குதல்
  choice: மகன்களாகவும் மகள்களாகவும்
  alternative: பிள்ளைகளாக
  rationale: υἱοὺς மற்றும் θυγατέρας என இரண்டையும் மூல உரை வெளிப்படையாகக் குறிப்பிடுகிறது. ‘பிள்ளைகள்’ எனப் பொதுமைப்படுத்தினால் மகள்கள் தனியாகச் சேர்க்கப்பட்டுள்ள வலியுறுத்தல் மறைந்துவிடும்.
- issue: κύριος παντοκράτωρ என்ற தெய்வீகப் பட்டத்தை மொழிபெயர்த்தல்
  choice: எல்லாம் வல்ல ஆண்டவர்
  alternative: ஆண்டவர், சர்வவல்லவர்; சேனைகளின் ஆண்டவர்
  rationale: இது κύριος மற்றும் παντοκράτωρ ஆகிய இரு கிரேக்கச் சொற்களையும் இயல்பான தமிழில் நேரடியாக வழங்குகிறது. ‘சேனைகளின் ஆண்டவர்’ என்பது இவ்வசனத்தின் கிரேக்கச் சொல்லாக்கத்தில் இல்லாத வேறொரு பழைய ஏற்பாட்டுப் பட்டத்தை இறக்குமதி செய்யும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மேற்கோளின் பரஸ்பர உறவு அமைப்பும் ‘மகன்கள் மற்றும் மகள்கள்’ என்ற வெளிப்படையான பாலினச் சேர்க்கையும் பாதுகாக்கப்பட்டுள்ளன.
