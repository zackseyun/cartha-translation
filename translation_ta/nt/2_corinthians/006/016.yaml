review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys the rhetorical question, the corporate identification of believers as God's temple, and the covenant quotation. However, ‘சிலைகள்’ can denote sculptures or images neutrally in modern Tamil, whereas εἰδώλων specifically denotes objects of idolatrous worship in this polemical contrast. ‘விக்கிரகங்கள்’ states the intended referent more precisely.
  naturalness: The wording is generally clear and idiomatic modern standard Tamil. ‘உயிருள்ள கடவுள்’ is more natural and established than ‘வாழும் கடவுள்’ in this contrast with idols.
  terminology: ‘ஆலயம்,’ ‘குடியிருப்பேன்,’ ‘நடமாடுவேன்,’ and the covenant formula are suitable. Replacing ‘சிலைகள்’ with ‘விக்கிரகங்கள்’ preserves the religious sense of εἴδωλα without ambiguity.
  issues:
  - severity: medium
    issue: ‘சிலைகள்’ is semantically too broad for εἰδώλων.
    rationale: In modern Tamil it may refer to nonreligious statues or images. The Greek context contrasts God's temple with pagan objects of worship; ‘விக்கிரகங்கள்’ communicates this explicitly.
  - severity: low
    issue: ‘வாழும் கடவுள்’ is less idiomatic than ‘உயிருள்ள கடவுள்.’
    rationale: ‘உயிருள்ள கடவுள்’ is natural modern Tamil for the conventional biblical expression ζῶντος θεοῦ and clearly maintains the contrast with lifeless idols.
