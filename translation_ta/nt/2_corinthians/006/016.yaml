reference: 2 Corinthians 6:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: ta
  text: 'விக்கிரகங்களுக்கும் கடவுளின் ஆலயத்துக்கும் என்ன உடன்பாடு[a] இருக்கிறது? ஏனெனில், நாம் உயிருள்ள கடவுளின் ஆலயமாக இருக்கிறோம். கடவுள் சொன்னபடியே: “நான் அவர்கள் நடுவில் குடியிருப்பேன்[b], அவர்கள் நடுவில் நடமாடுவேன்; நான் அவர்களுடைய கடவுளாக இருப்பேன், அவர்கள் என் மக்களாக இருப்பார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இணக்கம்” அல்லது “ஒத்துப்போதல்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் அவர்களுக்குள் குடியிருப்பேன்.” கிரேக்க முன்னிடைச்சொல் “உள்ளில்” என்றும் “நடுவில்” என்றும் பொருள்படலாம்; இங்கே சமூக உடன்படிக்கைச் சூழல் “அவர்கள் நடுவில்” என்பதற்கு ஆதரவாக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: உடன்பாடு
  rationale: ஒப்புதல், இணக்கம், உடன்பாடு ஆகிய பொருள்களைக் கொண்ட இச்சொல்லுக்கு ‘உடன்பாடு’ என்பது தெளிவான நவீனத் தமிழ்; சுற்றியுள்ள பொருந்தாத இணைகளைப் பற்றிய வினாவுக்கும் ஏற்றது.
- source_word: ναῷ / ναὸς
  choice: ஆலயம்
  rationale: ναός என்பது பொதுவான ஆலய வளாகத்தைவிட கடவுள் வாசம்செய்யும் திருக்கோயில் அல்லது பரிசுத்த இடத்தைக் குறிக்கிறது. ‘ஆலயம்’ வழிபாட்டுச் சார்ந்த உருவகத்தை இயல்பாகக் காக்கிறது.
- source_word: εἰδώλων
  choice: சிலைகள்
  rationale: இச்சூழலில் இச்சொல் வழிபடப்படும் தெய்வச் சிலைகளைக் குறிக்கிறது; நடுநிலையான உருவங்களை அல்ல. ‘சிலைகள்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ζῶντος
  choice: வாழும்
  rationale: இது θεοῦ என்பதைக் குறிப்பிட்டு, உயிரற்ற சிலைகளுக்கு மாறாக கடவுள் உயிரோடிருந்து செயல்படுகிறவர் என்பதைத் தெரிவிக்கிறது.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: கடவுள் சொன்னபடியே
  rationale: καθώς என்பதன் ஒப்புமை வலிமையையும் εἶπεν என்பதன் இறந்தகாலச் சொல்லையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: நான் அவர்கள் நடுவில் குடியிருப்பேன்
  rationale: ἐν என்பது ‘உள்ளில்’ அல்லது ‘நடுவில்’ எனப் பொருள்படலாம். பன்மையில் உள்ள சமூகத்தையும் அடுத்துவரும் ‘அவர்கள் நடுவில் நடமாடுவேன்’ என்ற உடன்படிக்கைச் சூழலையும் முன்னிட்டு ‘நடுவில்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἐμπεριπατήσω
  choice: அவர்கள் நடுவில் நடமாடுவேன்
  rationale: கடவுள் தம் மக்களிடையே உடனிருப்பதை நடை உருவகத்தால் காட்டும் சொல்லை, இயல்பான தமிழில் ‘நடமாடுவேன்’ என வழங்குகிறது.
- source_word: ἔσομαι αὐτῶν θεός
  choice: நான் அவர்களுடைய கடவுளாக இருப்பேன்
  rationale: உறவையும் சொந்தத்தையும் வெளிப்படுத்தும் உடன்படிக்கை வாய்பாட்டை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: λαός
  choice: மக்கள்
  rationale: உடன்படிக்கைச் சூழலில் கடவுளுக்குரிய சமூகத்தை ஒருமித்த தொகுதியாகக் குறிக்கிறது.
theological_decisions:
- issue: சமூகமாகிய ஆலய உருவகம்
  choice: நாம் வாழும் கடவுளின் ஆலயமாக இருக்கிறோம்
  alternative: நாம் வாழும் கடவுளின் ஓர் ஆலயமாக இருக்கிறோம்
  rationale: வினைச்சொல்லுடன் வரும் பெயர்ப் பயனிலையில் ναὸς சுட்டுப்பெயரின்றி இருந்தாலும், இங்கே தரத்தையும் அடையாளத்தையும் குறிக்கும் உறுதியான பொருளைக் கொண்டுள்ளது. ‘ஆலயமாக’ என்பது விசுவாசச் சமூகத்தை ஒருமையான கடவுளுடைய ஆலயமாகக் காட்டும் பவுலின் உருவகத்தைப் பாதுகாக்கிறது.
- issue: கடவுள் குடியிருப்பதைக் கூறும் மேற்கோள்
  choice: நான் அவர்கள் நடுவில் குடியிருப்பேன்
  alternative: நான் அவர்களுக்குள் குடியிருப்பேன்
  rationale: ἐν αὐτοῖς இருவகையிலும் மொழிபெயர்க்கப்படலாம். மேற்கோள் சமூகத்தைக் கூட்டாக நோக்குவதாலும், அடுத்து கடவுள் அவர்கள் நடுவில் நடமாடுவார் என்பதாலும் ‘நடுவில்’ முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டது; தனிநபருக்குள் மட்டுமே குடியிருப்பதாகக் குறுக்காமல் மூலத்தின் மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம மேற்கோளின் உயர்ந்த தொனியும் காக்கப்பட்டுள்ளன. கேள்வி இயல்பான தமிழ்ச் சொல்வரிசையில் அமைக்கப்பட்டுள்ளது. ‘ஆலயம்,’ ‘குடியிருப்பேன்,’ ‘நடமாடுவேன்’ ஆகியவை வழிபாட்டு மற்றும் உடன்படிக்கை உருவகங்களை எளிதில் புரியும் வகையில் காக்கின்றன.
