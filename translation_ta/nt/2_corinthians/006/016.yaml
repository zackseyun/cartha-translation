  to: 'விக்கிரகங்களுக்கும் கடவுளின் ஆலயத்துக்கும் என்ன உடன்பாடு[a] இருக்கிறது? ஏனெனில், நாம் உயிருள்ள கடவுளின் ஆலயமாக இருக்கிறோம். கடவுள் சொன்னபடியே: “நான் அவர்கள் நடுவில் குடியிருப்பேன்[b], அவர்கள் நடுவில் நடமாடுவேன்; நான் அவர்களுடைய கடவுளாக இருப்பேன், அவர்கள் என் மக்களாக இருப்பார்கள்.”'
  rationale: Two limited lexical refinements improve source precision and modern Tamil idiom. ‘விக்கிரகங்கள்’ identifies εἴδωλα as idols rather than neutral statues, and ‘உயிருள்ள கடவுள்’ naturally renders ‘the living God.’ The corporate temple metaphor, the ‘among/in them’ ambiguity with its footnote, and the covenant language are retained.
