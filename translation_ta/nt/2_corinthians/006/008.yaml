lexical_decisions:
- source_word: διὰ
  choice: -இலும் / -இலும்
  rationale: இணையான சூழ்நிலைகளைக் குறிக்கும் διά + உரிமை வேற்றுமையின் பொருளை இயல்பான தமிழில் சூழ்நிலைப் பொருளுடைய ‘-இலும்’ எனத் தந்துள்ளது; மீண்டும் வரும் அமைப்பும் காக்கப்படுகிறது.
- source_word: δόξης
  choice: மதிப்பு
  rationale: ἀτιμία என்பதற்கு எதிராக இங்கு சமூகத்தினர் அளிக்கும் பொதுமதிப்பைக் குறிக்கிறது. ‘மகிமை’ என்ற சமயச்சாயல் கொண்ட சொல்லைவிட ‘மதிப்பு’ இச்சூழலுக்குப் பொருத்தமானது.
- source_word: ἀτιμίας
  choice: அவமதிப்பு
  rationale: δόξα என்பதற்கு இயல்பான எதிர்ச்சொல்லாக இருந்து, பொதுவெளியில் ஏற்படும் மதிப்பின்மையையும் இழிவையும் தெரிவிக்கிறது.
- source_word: δυσφημίας
  choice: பழிச்சொல்
  rationale: ஒருவருக்கு எதிரான தீய பேச்சு அல்லது கெட்ட பெயர் என்ற பொருளை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: εὐφημίας
  choice: பாராட்டு
  rationale: சாதகமான பேச்சு அல்லது நற்பெயரைக் குறிக்கும் இச்சொல், δυσφημία என்பதுடன் உள்ள எதிரிணையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὡς
  choice: எனக் கருதப்பட்டாலும்
  rationale: பவுலும் அவருடைய உடன் ஊழியர்களும் பிறரால் எவ்வாறு மதிப்பிடப்பட்டார்கள் என்பதையும், அவர்கள் உண்மையில் எப்படிப்பட்டவர்கள் என்பதையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: πλάνοι
  choice: ஏமாற்றுகிறவர்கள்
  rationale: மற்றவர்களைத் தவறாக வழிநடத்துவோர் என்ற குற்றச்சாட்டைத் தெளிவாகக் காட்டுகிறது; அந்தக் குற்றச்சாட்டை மொழிபெயர்ப்பு உண்மையென ஏற்றுக்கொள்ளவில்லை.
- source_word: ἀληθεῖς
  choice: உண்மையானவர்கள்
  rationale: πλάνοι என்பதற்கு நேரெதிராகச் சுருக்கமாக நின்று, அவர்களுடைய உண்மைத்தன்மை அல்லது நம்பகத்தன்மையைத் தெரிவிக்கிறது; ‘உண்மை பேசுகிறவர்கள்’ என்று பொருளைக் குறுக்கவில்லை.
theological_decisions:
- issue: இறுதி எதிரிணை பிறருடைய மதிப்பீட்டையும் உண்மை நிலையையும் வேறுபடுத்துகிறதா?
  choice: ‘ஏமாற்றுகிறவர்கள் எனக் கருதப்பட்டாலும், உண்மையானவர்கள்’
  alternative: ‘ஏமாற்றுகிறவர்களைப்போல், ஆனால் உண்மையானவர்கள்’
  rationale: ὡς என்பதில் மறைந்துள்ள பார்வைக் கோணத்தை இயல்பான தமிழில் வெளிப்படுத்தி, ‘ஏமாற்றுகிறவர்கள்’ என்பது பிறரின் குற்றச்சாட்டு என்றும் ‘உண்மையானவர்கள்’ என்பது அதற்கு எதிரான நிலை என்றும் காட்டுகிறது. இவ்வாறு அப்போஸ்தல ஊழியத்தின் தவறான மதிப்பீடும் அதன் உண்மைத்தன்மையும் இடையிலான பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் இணையான மூன்று எதிரிணைகளும் சுருக்கமாகக் காக்கப்பட்டுள்ளன; முதல் இரண்டு இணைகளில் ‘-இலும்’ மீட்சி ஓசைநயத்தைத் தருகிறது. இறுதி இணையில் ‘கருதப்பட்டாலும்’ என்பது குற்றச்சாட்டுக்கும் உண்மை நிலைக்கும் உள்ள வேறுபாட்டைத் தெளிவாக்குகிறது.
