    text: ‘மகிமையிலும் அவமதிப்பிலும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ‘மகிமை’ என்று பொருள்படலாம்; இங்கு பொதுமக்கள் அளிக்கும் மதிப்பு என்ற சமூகப் பொருளே அதிகம் பொருந்துகிறது.
