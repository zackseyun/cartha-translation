  text: மதிப்பிலும் அவமதிப்பிலும்[a], பழிச்சொல்லிலும் பாராட்டிலும்[b]; ஏமாற்றுகிறவர்கள் எனக் கருதப்பட்டாலும், உண்மையானவர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
