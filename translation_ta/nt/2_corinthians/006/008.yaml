    text: 'சொல்லுக்குச் சொல்: ‘ஏமாற்றுபவர்கள் எனவும் உண்மையானவர்கள் எனவும்.’ பவுலையும் அவருடைய உடன் ஊழியர்களையும் பிறர் எவ்வாறு கருதினார்கள் என்பதையும் அவர்கள் உண்மையில் எப்படிப்பட்டவர்கள் என்பதையும் இச்சொற்றொடர் எதிரெதிராக நிறுத்துகிறது.'
