id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: ta
  text: காணப்படுகிறவற்றை அல்ல, காணப்படாதவற்றையே நாம் நோக்கிக்கொண்டிருக்கிறோம். ஏனெனில், காணப்படுகிறவை தற்காலிகமானவை[a]; காணப்படாதவையோ நித்தியமானவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காணப்படுவது … காணப்படாதது’ என்றும் மொழிபெயர்க்கலாம்; ‘புலப்படுகிறவை … புலப்படாதவை’ என்பதும் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπούντων
  choice: நோக்கிக்கொண்டிருக்கிறோம்
  rationale: கவனத்தை ஒரு பொருளின்மேல் செலுத்துதல் அல்லது அதையே இலக்காகக் கொண்டு நோக்குதல் என்ற தொடர்ச்சியான செயலை நிகழ்காலப் பங்கேற்புவினை உணர்த்துகிறது. முந்தைய கூற்றைச் சார்ந்த சூழ்நிலைப் பொருளை இயல்பான தமிழ் வாக்கியமாக அளிக்கிறது.
- source_word: μὴ
  choice: அல்ல
  rationale: கால மாற்றத்தைச் சுட்டாமல் எளிய மறுப்பைத் தருகிறது; ‘இனி அல்ல’ என்ற மூலத்தில் இல்லாத கால நுட்பத்தைச் சேர்க்கவில்லை.
- source_word: τὰ βλεπόμενα
  choice: காணப்படுகிறவை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பன்மைப் பங்கேற்புவினையின் வடிவத்தையும், காணப்படாதவற்றுடன் உள்ள இணையான அமைப்பையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
- source_word: ἀλλὰ
  choice: அல்ல ... -ஏ
  rationale: ‘காணப்படுகிறவற்றை அல்ல, காணப்படாதவற்றையே’ என்ற தமிழ் எதிர்மறை இணை அமைப்பு கிரேக்கத்தின் வலுவான முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ μὴ βλεπόμενα
  choice: காணப்படாதவை
  rationale: ‘காணப்படுகிறவை’ என்பதோடு வேண்டுமென்றே அமைக்கப்பட்டுள்ள இணைநிலையையும், காண இயலாதவை என்று விளக்கி விடாமல் ‘காணப்படாதவை’ என்ற உண்மையான தெளிவின்மையையும் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணவிளக்கத்தைத் தெளிவாக இணைக்கிறது.
- source_word: πρόσκαιρα
  choice: தற்காலிகமானவை
  rationale: வரையறுக்கப்பட்ட காலத்திற்கு மட்டுமே நீடிப்பவை என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; ‘கணநேரமானவை’ என்று பொருளை மிகைப்படுத்தவில்லை.
- source_word: δὲ
  choice: -ஓ
  rationale: ‘காணப்படாதவையோ’ என்ற வடிவம் இரண்டாம் உறுப்பை முதல் உறுப்புடன் முரண்படுத்தும் இயல்பான தமிழ் அமைப்பாகும்.
- source_word: αἰώνια
  choice: நித்தியமானவை
  rationale: தற்காலிகமானவற்றுக்கு எதிராக முடிவின்றி நிலைப்பவற்றைக் குறிக்கும் நிலைபெற்ற, கண்ணியமான தமிழ் சொல்.
- source_word: ἡμῶν
  choice: நாம்
  rationale: மரபுத்தொடரின் எழுவாயைத் தமிழில் வெளிப்படையாகக் காட்டி, முந்தைய வாக்கியத்தைச் சார்ந்த பங்கேற்புவினை அமைப்பை இயல்பான வினைமுற்றாக வழங்குகிறது.
theological_decisions:
- issue: காணப்படுகிறவை / காணப்படாதவை என்ற முரண்பாட்டை மொழிபெயர்த்தல்
  choice: காணப்படுகிறவை ... காணப்படாதவை
  alternative: புலப்படும் பொருட்கள் ... புலப்படாத பொருட்கள்; பொருள்சார்ந்தவை ... ஆவிக்குரியவை
  rationale: பவுல் காணப்படுவதையும் காணப்படாததையும் எதிரெதிராக வைக்கிறார்; அவற்றை வெளிப்படையாக ‘பொருள்சார்ந்தவை’ மற்றும் ‘ஆவிக்குரியவை’ என்று வரையறுக்கவில்லை. ஆகவே மூலத்தின் தெளிவின்மையும் இறையியல் அழுத்தமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நோக்கிக்கொண்டிருக்கிறோம்’ கவனத்தைச் செலுத்தும் தொடர்ச்சியான செயலையும் காட்சிசார் உருவகத்தையும் காக்கிறது. ‘காணப்படுகிறவை / காணப்படாதவை’ என்ற மீளமைப்பு மூலத்தின் சொல்லாட்சிச் சமச்சீரைத் தக்கவைக்கிறது.
