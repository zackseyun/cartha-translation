base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: ta
  text: அவர்களைப் பொறுத்தவரை[a], இந்த யுகத்தின் கடவுள்[b], கடவுளின் உருவமாகிய மெசியாவின்[c] மகிமையைப் பற்றிய நற்செய்தியின் ஒளி அவர்கள்மேல் பிரகாசிக்காதபடி[d], நம்பாதவர்களின் மனங்களைக் குருடாக்கியிருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களிடையே’ அல்லது ‘அவர்களில்’ என்றும் மொழிபெயர்க்கலாம். இத்தொடர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அழிவுக்குச் செல்கிறவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இந்த உலகத்தின் கடவுள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க αἰών பொதுவாக ‘யுகம்’ அல்லது ‘காலம்’ என்று பொருள்பட்டு, தற்போதைய வீழ்ச்சியுற்ற கால ஒழுங்கை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் Χριστός (கிறிஸ்தோஸ்); இங்கு அது பட்டப்பெயராகச் செயல்படுவதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: d
    text: ‘மெசியாவின் மகிமையைப் பற்றிய நற்செய்தியின் ஒளியை அவர்கள் காணாதபடி’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள அரிய கிரேக்க வினை, ஒளி பிரகாசிப்பதையோ அவர்கள் அதைக் காண்பதையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
