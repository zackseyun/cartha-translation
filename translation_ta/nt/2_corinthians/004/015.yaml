    issue: The main text adds ‘நிகழ்கின்றன’ to τὰ πάντα.
    rationale: The Greek says literally that all things are ‘because of/for’ the readers, with an implied form of ‘are’; it does not state that all these things are occurring. This addition can narrow or alter Paul’s comprehensive expression.
