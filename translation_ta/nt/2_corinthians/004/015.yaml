  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: ta
  text: ஏனெனில், அனைத்தும் உங்கள் நன்மைக்காகவே இருக்கின்றன. இதனால், அருள் மென்மேலும் பலரின் வழியாகப் பெருகி[a], நன்றி செலுத்துதல் கடவுளின் மகிமைக்காக நிரம்பிப் பெருகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பலரின் வழியாக’ அல்லது ‘அதிக எண்ணிக்கையிலானவர்களின் வழியாக.’ கிரேக்கத் தொடர் பொதுவாகப் பலரையோ, எண்ணிக்கையில் அதிகரித்துவரும் மக்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: ஏனெனில், இவை அனைத்தும்
  rationale: γὰρ முந்தைய கூற்றிற்கான விளக்கக் காரணத்தைச் சுட்டுகிறது; τὰ πάντα என்பதன் விரிவான பொருளை ‘இவை அனைத்தும்’ இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: δι’ ὑμᾶς
  choice: உங்கள் நன்மைக்காகவே
  rationale: διά + accusative இங்கு பயன் அல்லது நன்மையைச் சுட்டுவதால், வெறும் ‘உங்களுக்காக’ என்பதைவிட இது கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: இதனால்
  rationale: நோக்கம் அல்லது விளைவை அறிமுகப்படுத்தும் இணைப்பாக இங்கு வருகிறது; தமிழில் இரண்டிற்கும் இடமளிக்கும் இயல்பான தொடராக ‘இதனால்’ அமைந்துள்ளது.
- source_word: ἡ χάρις πλεονάσασα
  choice: அருள் பெருகி
  rationale: χάρις என்பதன் இறையியல் அகலத்தை ‘அருள்’ தக்கவைக்கிறது; participle-ஐ இயல்பான தமிழ் வினையெச்சத் தொடராக மொழிபெயர்த்துள்ளது.
- source_word: διὰ τῶν πλειόνων
  choice: மென்மேலும் பலரின் வழியாக
  rationale: ஒப்பீட்டு வடிவம் பலரைப் பொதுவாகவோ எண்ணிக்கையில் அதிகரித்துவரும் மக்களையோ குறிக்கக்கூடியதால், விரிவடைதலை முதன்மை உரை வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὴν εὐχαριστίαν περισσεύσῃ
  choice: நன்றி செலுத்துதல் ... நிரம்பிப் பெருகும்
  rationale: εὐχαριστία என்பது கடவுளை நோக்கிய நன்றி செலுத்துதலைக் குறிக்கிறது; περισσεύω-வின் மிகுதியான பெருக்கத்தை ‘நிரம்பிப் பெருகும்’ இயல்பாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: கடவுளின் மகிமைக்காக
  rationale: εἰς சுட்டும் இலக்கு அல்லது விளைவை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நோக்கக் கூற்றில் ‘அருள்’ என்பதன் குறிப்பான பொருள்
  choice: அப்போஸ்தலப் பணியிலும் அதன் பரவலிலும் செயல்படும் கடவுளின் அருள் என்ற அகன்ற பொருள் தக்கவைக்கப்பட்டுள்ளது.
  alternative: அதிகமானோர் பெறும் இரட்சிப்பின் அருள்; அல்லது பல மடங்கு நன்றியை உருவாக்கும் கடவுளின் அருள்மிகு செயல்.
  rationale: χάρις இவற்றில் ஒன்றை மட்டும் கட்டாயமாகக் குறுக்கிக் குறிப்பிடவில்லை; ஆகவே இறையியல் இழுபறியும் பொருள் அகலமும் தீர்த்துவைக்கப்படவில்லை.
- issue: ἵνα கூறும் நோக்கமா விளைவா
  choice: ‘இதனால்’ என்று மொழிபெயர்த்து நோக்கம் மற்றும் விளைவு ஆகிய இரு நிழல்களுக்கும் இடமளிக்கப்பட்டுள்ளது.
  alternative: ‘...வேண்டும் என்பதற்காக’ என்று வெளிப்படையான நோக்கமாக மட்டும் மொழிபெயர்த்தல்.
  rationale: இச்சூழலில் ἵνα நோக்கத்தையும் எதிர்பார்க்கப்படும் விளைவையும் நெருக்கமாக இணைக்கிறது; தமிழ் உரை ஒன்றை மட்டும் தேவையின்றி உறுதிப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அருள்,’ ‘நன்றி செலுத்துதல்,’ ‘மகிமை’ ஆகியவை திருச்சபைச் சூழலுக்கு மட்டும் கட்டுப்படாமல் பொதுவாகப் புரியக்கூடிய சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
