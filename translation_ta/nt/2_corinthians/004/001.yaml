base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: ta
  text: ஆகையால், நாம் இரக்கம் பெற்றதுபோல, இந்த ஊழியம் நமக்கு இருப்பதால், நாம் மனந்தளருவதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவுத் தொடர்பை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: τὴν διακονίαν ταύτην
  choice: இந்த ஊழியத்தை
  rationale: διακονία என்பது இங்கு பவுலுக்கு ஒப்படைக்கப்பட்ட சேவை அல்லது பணியைக் குறிக்கிறது; தமிழ் கிறிஸ்தவப் பயன்பாட்டில் ‘ஊழியம்’ இயல்பானதும் பரவலாகப் புரியக்கூடியதும் ஆகும்.
- source_word: καθὼς ἠλεήθημεν
  choice: நாம் இரக்கம் பெற்றபடியே
  rationale: καθὼς என்பதன் ஒப்புமை/ஒத்திசைவு நுணுக்கத்தையும், ἠλεήθημεν என்பதன் இறை இரக்கத்தைப் பெற்ற செயப்பாட்டு பொருளையும் காக்கிறது.
- source_word: οὐκ ἐγκακοῦμεν
  choice: நாம் மனந்தளருவதில்லை
  rationale: ἐγκακέω இங்கு சோர்ந்து கைவிடுதல் அல்லது தளர்ந்துபோதலைக் குறிக்கிறது; ‘மனந்தளருவதில்லை’ இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தருகிறது.
theological_decisions:
- issue: ஊழியத்திற்கும் இரக்கம் பெற்றதற்கும் உள்ள தொடர்பு
  choice: ‘நாம் இரக்கம் பெற்றபடியே இந்த ஊழியத்தைப் பெற்றிருப்பதால்’ என்று இரண்டையும் தொடர்புபடுத்துதல்
  alternative: ‘இந்த ஊழியம் நமக்கு இருப்பதால், நாம் இரக்கம் பெற்றதுபோல’ என்று தனித்தனி கூற்றுகளாக அமைத்தல்
  rationale: கிரேக்கச் சொற்றொடர் ஊழியம் கிடைத்திருப்பதையும் இரக்கம் பெற்றதையும் நெருக்கமாக இணைக்கிறது; அந்தத் தொடர்பை வைத்திருக்கிறது, ஆனால் இரக்கம் ஊழியத்திற்குத் தகுதி பெற்றதற்கான வெகுமதி என்று விளக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையான, வாசிக்க எளிய நடை. மூலத்தின் காரணவியல் ஓட்டமும் ‘καθὼς’ என்பதன் நுணுக்கமும் காக்கப்பட்டுள்ளன.
