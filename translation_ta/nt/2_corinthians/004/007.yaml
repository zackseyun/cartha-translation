  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: ta
  text: ஆனால், இந்தப் பொக்கிஷம் நம்மிடம் மண்பாண்டங்களில் இருக்கிறது[a]; வல்லமையின் அளவுகடந்த மேன்மை[b] கடவுளுடையதாகவே இருக்கவும், நம்மிடமிருந்து வந்ததாக இல்லாமலும் இருக்கும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மண்ணால் செய்யப்பட்ட பாத்திரங்களில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அசாதாரணமான வல்லமை” அல்லது “அளவுகடந்த வல்லமை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν
  choice: நம்மிடம் இருக்கிறது
  rationale: முதல் நபர் பன்மையில் நிகழ்கால உடைமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; பொக்கிஷத்தை நாமே உள்ளே வைத்தோம் என்ற தேவையற்ற கருத்தையும் தவிர்க்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள வேறுபாட்டையும் தொடர்ச்சியையும் எதிர்மறை இணைப்பாகப் பாதுகாக்கிறது.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: இந்தப் பொக்கிஷம்
  rationale: θησαυρός என்பதன் நேரடியான உருவகப் பொருளையும், முந்தைய சூழலைச் சுட்டும் τοῦτον என்பதையும் தக்கவைக்கிறது.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: மண்பாண்டங்களில்
  rationale: சுட்ட களிமண்ணால் செய்யப்பட்ட எளிய, உடையக்கூடிய கொள்கலன்கள் என்ற உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἵνα
  choice: இதனால் ... இருக்குமே
  rationale: நோக்கம் மற்றும் விளைவு ஆகிய இரண்டின் நிழலும் இருக்கக்கூடிய கிரேக்கத் தொடரை, ஒன்றை மட்டும் மிகையாகத் தீர்மானிக்காமல் தமிழில் இணைக்கிறது.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: வல்லமையின் அளவுகடந்த மேன்மை
  rationale: ὑπερβολή என்ற பெயர்ச்சொல்லின் மிகுதி அல்லது ஒப்பற்ற தன்மையையும், τῆς δυνάμεως என்ற உரிமை வேற்றுமை அமைப்பையும் பாதுகாக்கிறது.
- source_word: τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: கடவுளுடையதாக இருக்குமே தவிர, நம்மிடமிருந்து வந்ததாக இருக்காது
  rationale: வல்லமை கடவுளுக்குரியது என்பதையும் அது மனிதர்களிடமிருந்து தோன்றவில்லை என்பதையும் காட்டும் உரிமை–மூலம் சார்ந்த சுருக்கமான வேறுபாட்டைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘பொக்கிஷம்’ மற்றும் ‘மண்பாண்டங்கள்’ என்ற உருவகங்களின் பொருள்
  choice: உருவகங்களை விளக்கி விரிவாக்காமல் அப்படியே வைத்தல்
  alternative: ‘நற்செய்தி என்னும் பொக்கிஷம்’ அல்லது ‘பலவீனமான நமது உடல்கள்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: சுற்றியுள்ள வசனங்கள் உருவகத்தைப் புரிந்துகொள்ள உதவினாலும், இவ்வசனத்தின் கிரேக்க உரை அந்த விளக்கங்களை நேரடியாகச் சேர்ப்பதில்லை.
- issue: ἵνα தொடரின் நோக்கம் அல்லது விளைவு
  choice: ‘இதனால் ... இருக்குமே’ என நோக்கம்–விளைவு இரண்டுக்கும் இடமளித்தல்
  alternative: முழுக்க நோக்கமாக ‘இருக்கும்படியாக’ அல்லது முழுக்க விளைவாக ‘எனவே ... இருக்கிறது’ என்று மொழிபெயர்த்தல்
  rationale: இங்கு ἵνα நோக்கத்தையும் அதனால் உண்டாகும் விளைவையும் சுட்டக்கூடும்; தமிழாக்கம் அந்த நுண்ணிய தெளிவின்மையை தேவையின்றித் தீர்ப்பதில்லை.
- issue: வல்லமை கடவுளுடையது என்பதற்கும் கடவுளிடமிருந்து வருகிறது என்பதற்கும் உள்ள வேறுபாடு
  choice: τοῦ θεοῦ என்பதை ‘கடவுளுடையதாக’ என்றும் ἐξ ἡμῶν என்பதை ‘நம்மிடமிருந்து வந்ததாக’ என்றும் வேறுபடுத்திக் காட்டுதல்
  alternative: இரண்டையும் ஒரே மாதிரியாக ‘கடவுளிடமிருந்து, நம்மிடமிருந்து அல்ல’ என்று அமைத்தல்
  rationale: கிரேக்கத்தில் உள்ள உரிமை வேற்றுமைக்கும் மூலத்தைக் குறிக்கும் ἐξ என்பதற்கும் இடையிலான சொற்றொடர் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘மண்பாண்டங்கள்’ என்ற சொல் உருவகத்தின் எளிமை மற்றும் உடையக்கூடிய தன்மையை இயல்பாகக் காக்கிறது. கிரேக்கத்தின் இறுக்கமான அமைப்பை முற்றிலும் செயற்கையாகப் பின்பற்றாமல், அதன் உரிமை, மூலம், நோக்கம்–விளைவு நுணுக்கங்கள் பாதுகாக்கப்பட்டுள்ளன.
