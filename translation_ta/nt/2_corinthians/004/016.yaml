  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: ta
  text: ஆகவே, நாங்கள் மனந்தளருவதில்லை. ஆனால், எங்கள் வெளிப்புற மனிதன் தேய்ந்துகொண்டிருந்தாலும், எங்கள் உள்ளார்ந்த மனிதன் நாளுக்கு நாள் புதுப்பிக்கப்படுகிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எங்கள் வெளிப்புற ஆள்’ என்றும் ‘எங்கள் உள்ளார்ந்த ஆள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘மனிதன்’ என்பது இங்கு பொதுவாக மனித ஆளைக் குறிக்கிறது; வெளிப்புற மற்றும் உள்ளார்ந்த மனித வாழ்வுக்கு இடையேயான திட்டமிட்ட முரணை இது அமைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: οὐκ ἐγκακοῦμεν
  choice: நாங்கள் மனந்தளருவதில்லை
  rationale: தைரியத்தை இழக்காமை அல்லது உள்ளத்தில் சோர்ந்துவிடாமை என்ற பவுலின் சொல்லாட்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀλλ’ εἰ καὶ
  choice: ஆனால், ... இருந்தாலும்
  rationale: ஏற்றுக்கொள்ளப்பட்ட ஓர் உண்மை நிலையைக் concessive முறையில் அறிமுகப்படுத்தி, அதற்கு அடுத்த முரண்பாட்டையும் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: எங்கள் புற மனிதன்
  rationale: ἄνθρωπος என்ற ஒருமையையும், அடுத்துள்ள ‘அக மனிதன்’ என்பதுடனான திட்டமிட்ட இணைமுரணையும் காக்கிறது.
- source_word: διαφθείρεται
  choice: சிதைந்துகொண்டிருந்தாலும்
  rationale: முற்றான அழிவை அல்லாமல், தொடர்ந்து நிகழும் தேய்வையும் சிதைவையும் தெரிவிக்கிறது.
- source_word: ὁ ἔσω ἡμῶν
  choice: எங்கள் அக மனிதன்
  rationale: மூலத்தில் விடுபட்டிருந்தாலும் முன்னைய ἄνθρωπος சொல்லை உணர்த்தும் அமைப்பையும், ‘புற மனிதன்’ என்பதுடனான நேரடியான முரணையும் காக்கிறது.
- source_word: ἀνακαινοῦται
  choice: புதுப்பிக்கப்படுகிறான்
  rationale: தொடர்ந்து நிகழும் புதுப்பித்தலையும், பொருள்மீது செய்யப்படும் செயலைக் குறிக்கும் வினைப்பாட்டையும் வெளிப்படுத்துகிறது.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: நாளுக்கு நாள்
  rationale: தொடர்ச்சியான தினசரி நிகழ்வைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்.
theological_decisions:
- issue: ‘புற மனிதன்’ மற்றும் ‘அக மனிதன்’ ஆகியவற்றுக்கிடையிலான மானுடவியல் முரண்
  choice: ‘புற மனிதன்’ / ‘அக மனிதன்’ என்று நேரடி இணைமுரணுடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வெளிப்புற ஆளுமை’ / ‘உள்ளார்ந்த ஆளுமை’ அல்லது ‘உடல்’ / ‘ஆவி’
  rationale: வசனம் கூறுவதைத் தாண்டி முழுமையான உடல்–ஆத்தும இருமைக் கோட்பாட்டைச் சேர்க்காமல், வெளிப்புறச் சிதைவுக்கும் உள்ளார்ந்த புதுப்பித்தலுக்கும் இடையிலான பவுலின் திட்டமிட்ட முரணைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘புற மனிதன் / அக மனிதன்’ என்ற சற்றே இலக்கியமான இணைச்சொற்கள், மூலத்தின் ஒருமையையும் சொல்லிணை முரணையும் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டன; அடிக்குறிப்பு அவற்றின் பொதுமனிதப் பொருளை விளக்குகிறது.
