revisions:
- from: ஆகவே, நாங்கள் மனந்தளருவதில்லை. ஆனால், எங்கள் புற மனிதன் சிதைந்துகொண்டிருந்தாலும், எங்கள் அக மனிதன்[a] நாளுக்கு நாள் புதுப்பிக்கப்படுகிறான்.
  to: ஆகவே, நாங்கள் மனந்தளருவதில்லை. ஆனால், எங்கள் வெளிப்புற மனிதன் தேய்ந்துகொண்டிருந்தாலும், எங்கள் உள்ளார்ந்த மனிதன் நாளுக்கு நாள் புதுப்பிக்கப்படுகிறான்.[a]
  rationale: Gradual bodily deterioration is rendered more accurately with ‘தேய்ந்துகொண்டிருந்தாலும்’. The outer/inner contrast is retained in more natural modern Tamil, and the footnote now supplies a genuine lexical alternative and a precise explanation of the representative sense of ‘man.’
