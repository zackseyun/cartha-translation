revisions:
- from: இயேசுவின் வாழ்வும் எங்கள் உடலில் வெளிப்படும்படி, இயேசுவின் மரணத்தை[a] எப்போதும் உடலில் சுமந்து திரிகிறோம்.
  to: இயேசுவின் வாழ்வும் எங்கள் உடலில் வெளிப்படும்படி, இயேசுவின் மரணத்தை[a] எப்போதும் உடலில் சுமந்துகொண்டிருக்கிறோம்.
