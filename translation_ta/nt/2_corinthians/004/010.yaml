    text: அல்லது, ‘இயேசுவின் மரணநிலையை.’ கிரேக்கப் பெயர்ச்சொல், உடலில் சுமக்கப்படும் மரணநிலையையோ மரண அனுபவத்தையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  revision_rationale: The revision preserves the draft’s accurate clause order, singular ‘உடல்,’ and theological restraint, while using an idiomatic continuous expression for the present participle and a more accurate Tamil lexical alternative in the footnote.
