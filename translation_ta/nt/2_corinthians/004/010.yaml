source:
  edition: SBLGNT
  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: ta
  text: இயேசுவின் வாழ்வும் எங்கள் உடலில் வெளிப்படும்படி, இயேசுவின் மரணத்தை[a] எப்போதும் உடலில் சுமந்துகொண்டிருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இயேசுவின் மரணநிலையை.’ கிரேக்கப் பெயர்ச்சொல், உடலில் சுமக்கப்படும் மரணநிலையையோ மரண அனுபவத்தையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ந்து நிலவும் சூழ்நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: νέκρωσιν
  choice: மரணத்தை
  rationale: மரணநிலை அல்லது மரண அனுபவம் என்ற பெயர்ச்சொல்லின் பொருளைப் பாதுகாப்பதோடு, ‘இயேசுவின் வாழ்வு’ என்பதுடனான இணைமுரணையும் தெளிவாக வைத்திருக்கிறது.
- source_word: τοῦ Ἰησοῦ
  choice: இயேசுவின்
  rationale: உருபுத்தொடரின் உறவை மேலதிகமாக விளக்காமல், மூலத்தின் உண்மையான பொருள் விரிவைத் தக்கவைக்கிறது.
- source_word: ἐν τῷ σώματι
  choice: உடலில்
  rationale: முதல் இடத்தில் உடைமைச் சுட்டு இல்லாததால் ‘எங்கள்’ என்பதைச் சேர்க்காமல் மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: περιφέροντες
  choice: சுமந்து திரிகிறோம்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான, உடல்சார்ந்த சுமத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: வெளிப்படும்படி
  rationale: நோக்கம் அல்லது விளைவு ஆகிய இரண்டுக்கும் இடமளிக்கும் வகையில் சார்புத்தொடரின் உறவை இயல்பாகக் காட்டுகிறது.
- source_word: καὶ
  choice: வாழ்வும்
  rationale: இயேசுவின் மரணத்திற்கும் வாழ்விற்கும் இடையிலான ஒத்திசைவான கூடுதலை ‘உம்’ விகுதி தெரிவிக்கிறது.
- source_word: ζωὴ
  choice: வாழ்வு
  rationale: உயிர்த்தெழுந்த இயேசுவின் வெளிப்படும் வாழ்வைக் குறிக்கும் நேரடியான, dignified நவீனத் தமிழ்ச் சொல்.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: எங்கள் உடலில்
  rationale: கிரேக்கத்தில் உள்ள ஒருமை ‘உடல்’ என்பதையும் பன்மை உடைமையையும் காத்து, குழும அல்லது பிரதிநிதித்துவ உணர்வைத் திறந்தவாறே வைக்கிறது.
- source_word: φανερωθῇ
  choice: வெளிப்படும்படி
  rationale: செயப்பாட்டு நுணுக்கத்தைக் காத்து, ‘தெரியும்படி’ என்பதைவிட வெளிப்படுத்தப்படுதல்/புலப்படுதல் என்ற பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: νέκρωσις என்பதற்கும் இயேசுவுக்கும் உள்ள உறவு
  choice: ‘இயேசுவின் மரணம்’ என்று மொழிபெயர்த்தல்
  alternative: ‘இயேசுவின் மரணத்துக்குள்ளாதல்’ அல்லது ‘இயேசுவின் சாகுதல்’
  rationale: ‘மரணம்’ என்பது பெயர்ச்சொல்லின் பொருளையும் ‘இயேசுவின் வாழ்வு’ என்பதுடனான இணைமுரணையும் நன்றாகக் காக்கிறது; அதேவேளை இயேசுவோடு ஒன்றிப்பது குறித்த ஒரு குறுகிய விளக்கத்தை வசனத்துக்குள் புகுத்துவதில்லை.
- issue: σῶμα என்பதன் எண்ணிக்கை
  choice: இரு இடங்களிலும் ஒருமையான ‘உடல்’ என்பதைத் தக்கவைத்தல்
  alternative: இரண்டாம் இடத்தில் ‘எங்கள் உடல்களில்’ என்று பன்மைப்படுத்தல்
  rationale: மூலத்தில் இரு இடங்களிலும் ஒருமை உள்ளது. இதைக் காப்பது பவுலின் சொல்லாட்சியையும், அவரது பணியின் உடல்சார்ந்த குழும உணர்வையும் பாதுகாக்கிறது.
- issue: ἵνα தொடர் குறிக்கும் உறவு
  choice: ‘வெளிப்படும்படி’ என்று நோக்கம்/விளைவு இரண்டுக்கும் இடமளித்தல்
  alternative: ‘வெளிப்பட வேண்டும் என்பதற்காக’ என்று நோக்கத்தை மட்டும் வெளிப்படையாகக் கூறுதல்
  rationale: மூலத்திலுள்ள நோக்கம்-விளைவு நுணுக்கத்தைத் தீர்மானமாக ஒருபக்கம் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக ἵνα சார்புத்தொடர் முன்வைக்கப்பட்டுள்ளது; கருத்துறவும் முக்கிய இணைமுரணும் காக்கப்பட்டுள்ளன.
