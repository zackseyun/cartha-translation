source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: ta
  text: ஏனெனில், “இருளிலிருந்து ஒளி பிரகாசிக்கும்” என்று சொன்ன கடவுளே, மேசியாவின்[b] முகத்தில்[a] வெளிப்படும் கடவுளுடைய மகிமையை அறியும் அறிவின் ஒளியூட்டுதலுக்காக எங்கள் இதயங்களில் பிரகாசித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின் ஆளுமையில்.” கிரேக்கத் தொடரை இன்னும் நேரடியாக “மேசியாவின் முகத்தில்” என்று புரிந்துகொள்ளலாம்; இது கண்களுக்குப் புலப்படும் தெய்வீக மகிமையின் படிமத்தைப் பாதுகாக்கிறது.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் Χριστοῦ (கிறிஸ்தூ); மரபாக “கிறிஸ்து” என்று வழங்கப்படுகிறது. இங்கு அது ஒரு பட்டப்பெயராகச் செயல்படுவதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக இருப்பதால், தமிழில் வாதத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: என்று சொன்ன கடவுளே
  rationale: உருபுடன் கூடிய பங்கேற்பு வடிவத்தை இயல்பான தமிழ் உறவுநிலைத் தொடராக மாற்றுகிறது; ‘கடவுளே’ என்பது பின்னர் வரும் ‘பிரகாசித்தார்’ என்பதன் எழுவாயைத் தெளிவுபடுத்துகிறது.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: இருளிலிருந்து ஒளி பிரகாசிக்கும்
  rationale: ἐκ என்பதன் ‘இருளிலிருந்து’ என்ற மூலப்பொருளையும், எதிர்கால வினை வடிவத்தையும், படைப்பின் ஒளி உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν
  choice: எங்கள் இதயங்களில் பிரகாசித்தார்
  rationale: வினையை காரணவினையாக மாற்றாமல் நேரடியாக வழங்குகிறது; ‘இதயங்கள்’ என்பது உள்ளான மனிதரைச் சுட்டும் வேதாகம உருவகத்தைத் தக்கவைக்கிறது.
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: அறிகிற அறிவின் ஒளியை அளிப்பதற்காக
  rationale: அடர்த்தியான கிரேக்கப் பெயர்ச்சொல் தொடரை புரிந்துகொள்ளத்தக்க தமிழில் வெளிப்படுத்துகிறது; அதேவேளையில் ஒளியூட்டுதல் மற்றும் அறிவு ஆகிய இரு கருத்துகளையும் தக்கவைக்கிறது.
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: கடவுளுடைய மகிமையை
  rationale: மூலத்தின் உரிமைத் தொடர்பையும் ‘மகிமை’ என்ற முக்கிய இறையியல் சொல்லையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: மேசியாவின் முகத்தில்
  rationale: πρόσωπον என்பதன் நேரடியான ‘முகம்’ என்ற படிமத்தையும், Χριστός என்பதன் பட்டப்பெயர் இயல்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்; அபிஷேகம் பெற்றவரின்
  rationale: இங்கு Χριστός ஒரு பட்டப்பெயராகச் செயல்படுவதால் ‘மேசியா’ என வழங்கப்படுகிறது; பழக்கமான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐν προσώπῳ Χριστοῦ என்பதன் பொருள்
  choice: மேசியாவின் முகத்தில்
  alternative: கிறிஸ்துவின் ஆளுமையில்; கிறிஸ்துவில்
  rationale: ஒளி மற்றும் மகிமை பற்றிய உடனடிச் சூழலில் ‘முகம்’ என்ற நேரடியான படிமம் வலுவாக உள்ளது. இருப்பினும் ‘ஆளுமையில்’ என்ற விரிவான பொருளும் சாத்தியமாதலால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: πρὸς φωτισμὸν தொடரின் நோக்கப்பொருள்
  choice: அறிவின் ஒளியை அளிப்பதற்காக
  alternative: அறிவை ஒளிரச் செய்வதற்காக; அறிவின் ஒளியூட்டுதலுக்காக
  rationale: πρός உடன் வரும் இத்தொடரின் நோக்க உணர்வை வெளிப்படுத்தி, φωτισμός என்பதிலுள்ள ஒளி உருவகத்தைத் தக்கவைக்கிறது; அறிவை வெறும் தகவலாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘இதயம்,’ ‘மகிமை,’ ‘முகம்,’ ‘பிரகாசித்தார்’ ஆகிய சொற்கள் மூலத்தின் உருவகப் பின்னலைத் தக்கவைக்கின்றன. சிக்கலான கிரேக்க உரிமைத் தொடரை தமிழில் புரிந்துகொள்ளும் வகையில் சிறிது விரித்தாலும், அறிவு–மகிமை–மேசியாவின் முகம் ஆகிய தொடர்புகள் தீர்மானமாக மறுவிளக்கப்படவில்லை.
