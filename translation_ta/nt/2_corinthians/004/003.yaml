revisions:
- from: எங்கள் நற்செய்தி மறைக்கப்பட்டிருந்தாலும், அது அழிந்துகொண்டிருப்பவர்களிடையே[a] மறைக்கப்பட்டிருக்கிறது.
  to: எங்கள் நற்செய்தி மறைக்கப்பட்டதாக இருந்தாலும்கூட, அது அழிந்துகொண்டிருப்பவர்களிடம்[a] மறைக்கப்பட்டிருக்கிறது.
  rationale: The revision retains every major source feature while making the Tamil relation expressed by ἐν more idiomatic. It also keeps “perishing” as an ongoing condition and preserves the repeated ‘veiled’ predicate. The revised footnote offers only alternatives supported by the Greek and retains the ambiguity without endorsing a theological conclusion.
