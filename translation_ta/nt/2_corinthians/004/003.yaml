  rationale: ἡμῶν என்ற உடைமைச் சொல்லை நேரடியாக வைத்தும், εὐαγγέλιον என்பதற்கான நிலையான தமிழ் வேதாகமச் சொல்லைப் பயன்படுத்தியும் உள்ளது.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: அழிந்துகொண்டிருப்பவர்களிடையே
  rationale: ἐν என்பதன் சூழல் அல்லது வட்டப் பொருளை ‘இடையே’ காக்கிறது. நிகழ்காலப் பங்கேற்பு வடிவமான ἀπολλυμένοις குறிக்கும் தொடரும் நிலை அல்லது செயல்முறையை ‘அழிந்துகொண்டிருப்பவர்கள்’ வெளிப்படுத்துகிறது.
- source_word: ἐστὶν κεκαλυμμένον
  choice: மறைக்கப்பட்டிருக்கிறது
  rationale: கிரேக்கத்தில் மீண்டும் வரும் பயனிலையைத் தமிழிலும் மீண்டும் வைத்து வலியுறுத்தலைக் காக்கிறது; ‘தொடர்ந்து மறைக்கப்பட்டிருக்கிறது’ என்று மூலத்தைவிட அதிகமாக விளக்கவில்லை.
theological_decisions:
- issue: பவுலின் இரட்சிப்பியல் சூழலில் ἀπολλυμένοις என்பதன் இயல்பு
  choice: அழிந்துகொண்டிருப்பவர்கள்
  alternative: அழிந்துபோனவர்கள்
  rationale: நிகழ்காலப் பங்கேற்பு வடிவம் தொடரும் நிலை அல்லது செயல்முறையைக் குறிக்கிறது. ‘அழிந்துபோனவர்கள்’ என்பது அதை முடிவுற்ற, நிலையான அடையாளமாக மாற்றக்கூடும்; தேர்ந்த வாசகம் மூலத்திலுள்ள இறையியல் பதற்றத்தைக் காக்கிறது.
- issue: ἐν என்பதன் உறவுப் பொருள்
  choice: அழிந்துகொண்டிருப்பவர்களிடையே
  alternative: அழிந்துகொண்டிருப்பவர்களுக்கு
  rationale: ἐν + வேற்றுமை உருபு இங்கு வட்டம் அல்லது தொடர்புடைய குழுவைக் குறிக்கலாம்; திசையை மட்டும் குறிக்கும் ‘அவர்களுக்கு’ என்பதைக் காட்டிலும் ‘அவர்களிடையே’ மூல அமைப்புக்கு அண்மையானது. மாற்று சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘நற்செய்தி’ என்ற நிலையான சொல்லும், மூலத்தின் மீளுரையும் இறையியல் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
