    reason: ἐν τοῖς ἀπολλυμένοις என்பதில் ἐν-ன் தொடர்பு அல்லது வட்டப் பொருளைத் தமிழில் “அவர்களிடம்,” “அவர்களிடையே,” அல்லது “அவர்களுக்கு” என வெளிப்படுத்தலாம். ἀπολλυμένοις என்பது தொடரும் நிலை அல்லது செயல்முறையைக் குறிக்கிறது.
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: …இருந்தாலும்
  rationale: εἰ…καὶ என்பதன் விட்டுக்கொடுப்பு நிபந்தனைப் பொருளை இயல்பான தமிழில் தருகிறது. δέ இங்கு தொடர்ச்சி அல்லது மென்மையான மாறுபாட்டைக் குறிக்கிறது; தனியாக ‘ஆனால்’ சேர்ப்பது தமிழில் தேவையற்றதாக இருக்கும்.
- source_word: κεκαλυμμένον
  choice: மறைக்கப்பட்டு
  rationale: καλύπτω என்பதன் நிறைவேற்றப்பட்ட செயப்பாட்டு வடிவம். முந்தைய பகுதியில் வரும் திரை உருவகத்தை முற்றிலும் இழக்காமல், நற்செய்தி புலப்படாமல் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὸ εὐαγγέλιον ἡμῶν
