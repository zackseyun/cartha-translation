source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: ta
  text: மாறாக, வெட்கத்திற்குரிய மறைவான செயல்களை நாங்கள் துறந்துவிட்டோம். தந்திரமாக நடக்காமலும், கடவுளுடைய வார்த்தையை[b] வஞ்சகமாகத் திரிக்காமலும், உண்மையை வெளிப்படுத்துவதன் மூலம்[a] கடவுளுக்கு முன்பாக ஒவ்வொருவருடைய மனச்சாட்சிக்கும் எங்களைப் பரிந்துரைக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையை வெளிப்படையாகக் காட்டுவதன் மூலம்.” கிரேக்கச் சொல், உண்மையை வாயால் அறிவிப்பதை மட்டும் அல்லாமல், அதை வெளிப்படையாகத் தெரியச்செய்வதையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வஞ்சகமாகத் திரித்தல்” என்பதற்கு, “கலப்படம் செய்தல்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல், வஞ்சனையுடன் ஒன்றைக் கெடுக்கும் வகையில் மாற்றுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: துறந்துவிட்டோம்
  rationale: முடிவான மறுதலிப்பைக் குறிக்கும் இறந்தகால நடுவினை வடிவத்தின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: வெட்கத்திற்குரிய மறைவான செயல்கள்
  rationale: சொல்லுக்குச் சொல் ‘வெட்கத்தின் மறைவானவை’ என்பது தமிழில் தெளிவற்றிருக்கும்; சூழலில் குறிக்கப்படும் மறைவான நடைமுறைகளை ‘செயல்கள்’ என வெளிப்படுத்துவது இயல்பாகவும் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: περιπατοῦντες ἐν πανουργίᾳ
  choice: தந்திரமாக நடக்காமல்
  rationale: ‘நடத்தல்’ என்ற பவுலின் வாழ்க்கைமுறை உருவகத்தைத் தக்கவைத்தபடி, πανουργία குறிக்கும் நேர்மையற்ற சூழ்ச்சியையும் தெரிவிக்கிறது.
- source_word: δολοῦντες
  choice: வஞ்சகமாகத் திரித்துவிடாமல்
  rationale: இந்த வினைச்சொல் வஞ்சனையுடன் கலப்படம் செய்தல் அல்லது மாற்றுதல் என்ற நுண்ணுணர்வைக் கொண்டது; ‘திரித்தல்’ நவீன வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: λόγος என்பதன் பரந்த பொருளைச் சுருக்காமல், தமிழ்க் கிறிஸ்தவ மொழிநடையில் நன்கு புரியும் மரியாதையான வடிவம்.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: உண்மையை வெளிப்படையாகக் காட்டுவதன் மூலம்
  rationale: φανέρωσις என்பது வெறும் வாய்மொழிப் பிரசங்கத்தைவிட வெளிப்படுத்துதல் அல்லது தெளிவாகக் காட்டுதல் என்பதைக் குறிக்கும்; மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: συνιστάνοντες ἑαυτούς
  choice: எங்களைப் பரிந்துரைக்கிறோம்
  rationale: தற்புகழ்ச்சியை அவசியமாகக் குறிக்காமல், தங்களை ஏற்றுக்கொள்ளத்தக்கவர்களாக முன்வைப்பது என்ற சூழல்சார் பொருளை வழங்குகிறது.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: ஒவ்வொரு மனிதருடைய மனச்சாட்சிக்கும்
  rationale: πᾶσαν என்பதன் பகிர்ந்தளிக்கும் வலிமையையும் ἀνθρώπων என்பதன் பொதுமனிதக் குறிப்பையும் இயல்பாகக் காக்கிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: கடவுளின் சாட்சியும் மதிப்பீடும் முன்னிலையில் நிகழ்வதை நேரடியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: வஞ்சகமான ஊழியத்திற்கும் உண்மையை வெளிப்படுத்தும் ஊழியத்திற்கும் இடையிலான வேறுபாடு
  choice: வசனத்தை அப்போஸ்தல ஊழியத்தின் நேர்மையும் வெளிப்படைத்தன்மையும் பற்றியதாக மொழிபெயர்த்தல்
  alternative: இதனை சொற்பொழிவு உத்திகளை மட்டும் கண்டிப்பதாகவோ, வேதாகமக் கையாளுதலைப் பற்றிய முழுமையான தொழில்நுட்பக் கோட்பாடாகவோ குறுக்குதல் அல்லது விரிவாக்குதல்
  rationale: உடனடி சூழல் பவுலின் ஊழிய நடத்தையையும் அறிவிப்பையும் பற்றியது; குறிப்பிட்ட சமயப் பிரிவின் கோட்பாட்டைச் சேர்க்காமல் அந்த வரம்பை மொழிபெயர்ப்பு காக்கிறது.
- issue: φανέρωσις என்பது அறிவிப்பா அல்லது வெளிப்பாடா
  choice: ‘உண்மையை வெளிப்படையாகக் காட்டுவதன் மூலம்’
  alternative: ‘உண்மையை வெளிப்படையாக அறிவிப்பதன் மூலம்’
  rationale: மூலச்சொல் வாய்மொழி அறிவிப்பை உள்ளடக்கலாம்; ஆனால் அதற்கு மட்டும் கட்டுப்படுத்தாது. செயல் மற்றும் சொல் இரண்டின் வழியுமான வெளிப்படுத்தலை அனுமதிக்கும் வகையில் மூலத்தின் உண்மையான பரப்பும் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘நடக்காமல்’ என்ற உருவகம் பவுலின் சொல்வழக்கைத் தக்கவைக்கிறது; ‘மனச்சாட்சி’, ‘கடவுளுடைய வார்த்தை’ போன்ற வழக்கமான சொற்கள் தேவையற்ற தொழில்நுட்பத்தைக் தவிர்க்கின்றன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
