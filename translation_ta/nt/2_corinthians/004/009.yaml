translation:
  language: ta
  text: துன்புறுத்தப்பட்டாலும் கைவிடப்படுவதில்லை; வீழ்த்தப்பட்டாலும் அழிக்கப்படுவதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωκόμενοι
  choice: துன்புறுத்தப்பட்டாலும்
  rationale: பவுலின் பயன்பாட்டில் இது வெறும் பின்தொடர்தலை அல்ல, பகைமையுடன் துரத்தித் துன்புறுத்துவதைச் சுட்டுகிறது. தமிழ் இணை வாக்கிய அமைப்பில் சுருக்கமாகவும் இயல்பாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: ἐγκαταλειπόμενοι
  choice: கைவிடப்படுவதில்லை
  rationale: தனியாக விட்டுவிடப்படுதல் அல்லது ஆதரவின்றிக் கைவிடப்படுதல் என்ற பொருளை நவீன, இயல்பான தமிழில் தருகிறது; தேவையற்ற பழமைநடையையோ கூடுதல் இறையியல் விளக்கத்தையோ புகுத்தவில்லை.
- source_word: καταβαλλόμενοι
  choice: வீழ்த்தப்பட்டாலும்
  rationale: கீழே தள்ளப்படுதல் அல்லது தாக்கி வீழ்த்தப்படுதல் என்ற உருவக வலிமையைத் தக்கவைக்கிறது. அடுத்துள்ள ‘அழிக்கப்படுவதில்லை’ என்பதுடன் தெளிவான எதிர்மறை இணையை உருவாக்குகிறது.
- source_word: ἀπολλύμενοι
  choice: அழிக்கப்படுவதில்லை
  rationale: வீழ்த்தப்படுவது இறுதியான அழிவாக முடிவதில்லை என்ற வலுவான முரணை வெளிப்படுத்துகிறது; இச்சூழலில் ‘அழிந்துபோவதில்லை’ என்பதைக் காட்டிலும் செயப்படுபொருள் அமைப்பை நெருக்கமாகக் காக்கிறது.
- source_word: ἀλλ’ οὐκ
  choice: ஆனாலும் … இல்லை
  rationale: கிரேக்கத்தின் இரு சமநிலை முரண்களையும் தமிழில் ‘-ப்பட்டாலும் … இல்லை’ என்ற இயல்பான அமைப்பால் தெளிவாகவும் ஓசைநயத்துடனும் மீட்டளிக்கிறது.
theological_decisions:
- issue: ἐγκαταλειπόμενοι என்பதை இறையியல் ஒலியுள்ள பாரம்பரியச் சொல்லால் மொழிபெயர்ப்பதா அல்லது இயல்பான நவீன சொல்லால் மொழிபெயர்ப்பதா
  choice: கைவிடப்படுவதில்லை
  alternative: தனியே விடப்படுவதில்லை
  rationale: கடவுள் பவுலையும் அவருடைய உடன் ஊழியர்களையும் கைவிடுவதில்லை என்ற உரையின் பொருளை இது இயல்பாகக் காக்கிறது; வெளிப்படையாக இல்லாத மேற்கோள் தொடர்பையோ தனிப்பட்ட கோட்பாட்டு விளக்கத்தையோ சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. கிரேக்க மூலத்தின் இணையான இரண்டு முரண் அமைப்புகளும் தக்கவைக்கப்பட்டுள்ளன.
