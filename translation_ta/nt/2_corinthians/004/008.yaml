lexical_decisions:
- source_word: ἐν παντί
  choice: எல்லா வகையிலும்
  rationale: இந்தச் சொற்றொடர் இடத்தை மட்டுமல்லாமல் துன்பத்தின் விரிவான அளவையும் விதங்களையும் குறிக்கிறது. நவீனத் தமிழில் இயல்பாக அந்த முழுமையான பரப்பைத் தெரிவிக்கிறது.
- source_word: θλιβόμενοι
  choice: நெருக்கடிக்கு ஆளாகிறோம்
  rationale: θλίβω அழுத்தப்படுதல் அல்லது துன்பத்துக்கு உட்படுதல் என்ற பொருளைக் கொண்டது. அடுத்த வினையுடன் உள்ள வேறுபாட்டைக் காக்கும் வகையில், வெளிப்புறத் துன்பத்தையும் அழுத்தத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: στενοχωρούμενοι
  choice: ஒடுக்கப்படுவதில்லை
  rationale: இந்தச் சொல் குறுகிய இடத்தில் நெருக்கப்படுதல், கட்டுப்படுத்தப்படுதல் என்ற உருவகத்தைக் கொண்டது. இங்கு நெருக்கடிக்கு ஆளானாலும் செயலிழக்குமளவு அடக்கப்படவில்லை என்ற மறுப்பைத் தெரிவிக்கிறது.
- source_word: ἀπορούμενοι
  choice: என்ன செய்வதென்று தெரியாமல் திகைக்கிறோம்
  rationale: ἀπορέω என்ன செய்வது அல்லது எந்த வழியில் செல்வது என்று அறியாமல் இருப்பதைக் குறிக்கிறது. ‘திகைக்கிறோம்’ என்பதன் பொருளைத் தெளிவாக்கும் இயல்பான விரிவாக்கம் இது.
- source_word: ἐξαπορούμενοι
  choice: முற்றிலும் வழியற்றுப் போவதில்லை
  rationale: ἐξαπορέω முந்தைய ἀπορέω-வை வலுப்படுத்தி, எந்த வழியும் வளமும் இல்லாத நிலையைச் சுட்டுகிறது. ‘முற்றிலும்’ அந்த தீவிரத்தை வெளிப்படுத்துகிறது; ‘வழியற்றுப் போதல்’ சொல்லிணையின் பொருள் தொடர்பையும் காக்கிறது.
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: ஆனாலும் ... இல்லை; ஆனாலும் ... இல்லை
  rationale: மீண்டும் வரும் எதிர்மறை அமைப்பு பவுலின் தாளத்தையும், துன்பத்துக்கும் அதன் இறுதி விளைவு மறுக்கப்படுவதற்கும் இடையிலான முரண்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: ἐξαπορούμενοι என்பதிலுள்ள தீவிரப்படுத்தலின் அளவு
  choice: முற்றிலும் வழியற்றுப் போவதில்லை
  alternative: நம்பிக்கையிழப்பதில்லை
  rationale: கிரேக்கச் சொல் முந்தைய ‘திகைத்தல்/வழி தெரியாமை’ என்பதையே தீவிரப்படுத்துகிறது. ‘நம்பிக்கையிழத்தல்’ சாத்தியமான விளைபொருளைச் சொன்னாலும், மனநிலை அல்லது விசுவாசம் குறித்த தனிப்பட்ட கோட்பாட்டை உரைக்குள் கொண்டு வரக்கூடும். தேர்ந்த வடிவம் மூலத்தின் வழி தெரியாமை என்ற உருவகத்தையும் தீவிரத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதானதும் மரியாதைமிக்கதுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் நபர் பன்மை, சுற்றியுள்ள வாக்கிய அமைப்பிலிருந்து இயல்பாக வழங்கப்பட்டுள்ளது. இரண்டு எதிர்மறை இணைகளின் சமச்சீரும் தீவிர உயர்வும் பாதுகாக்கப்பட்டுள்ளன.
