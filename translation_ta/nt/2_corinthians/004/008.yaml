  language: ta
  text: எல்லா வகையிலும்[a] அழுத்தப்படுகிறோம்; ஆனாலும் திணறிப்போவதில்லை[b]. என்ன செய்வதென்று தெரியாமல் திகைக்கிறோம்; ஆனாலும் முற்றிலும் வழியற்றுப்போவதில்லை[c].
