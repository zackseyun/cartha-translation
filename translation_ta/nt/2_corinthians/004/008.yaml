revisions:
- from: எல்லா வகையிலும்[a] நெருக்கடிக்கு ஆளாகிறோம்; ஆனாலும் ஒடுக்கப்படுவதில்லை[b]. என்ன செய்வதென்று தெரியாமல் திகைக்கிறோம்; ஆனாலும் முற்றிலும் வழியற்றுப் போவதில்லை[c].
  to: எல்லா வகையிலும்[a] அழுத்தப்படுகிறோம்; ஆனாலும் திணறிப்போவதில்லை[b]. என்ன செய்வதென்று தெரியாமல் திகைக்கிறோம்; ஆனாலும் முற்றிலும் வழியற்றுப்போவதில்லை[c].
  rationale: The revision corrects the principal semantic mismatch in the first antithesis. It distinguishes being externally pressured (θλιβόμενοι) from being reduced to straits or overwhelmed (στενοχωρούμενοι), while preserving the repeated “ஆனாலும் ... இல்லை” structure. The second antithesis and its non-doctrinal rendering of the intensified ἐξαπορούμενοι are retained.
