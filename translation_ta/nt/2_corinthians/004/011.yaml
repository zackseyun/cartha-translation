revisions:
- from: ஏனெனில், உயிரோடிருக்கிற நாங்கள் இயேசுவின் நிமித்தம்[a] எப்போதும் மரணத்திற்கு ஒப்புக்கொடுக்கப்படுகிறோம்; இயேசுவின் உயிரும் மரணத்திற்குரிய எங்கள் மாம்சத்தில் வெளிப்படுவதற்காகவே இப்படியாகிறது.[b]
