reference: 2 Corinthians 4:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: ta
  text: ஏனெனில், உயிரோடிருக்கும் நாங்கள் இயேசுவின் நிமித்தம்[a] எப்போதும் மரணத்திற்கு ஒப்புக்கொடுக்கப்படுகிறோம்; இயேசுவின் உயிரும் எங்கள் மரணத்திற்குட்பட்ட மாம்சத்தில்[b] வெளிப்படும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசுவின் காரணமாக” அல்லது “இயேசுவுக்காக.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “மாம்சம்” என்பது மரணத்திற்குட்பட்ட உடல்சார்ந்த இருப்பைக் குறிக்கிறது; “பாவ இயல்பை” அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεί
  choice: எப்போதும்
  rationale: தொடர்ந்து அல்லது மீண்டும் மீண்டும் நிகழும் சூழலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் கருத்தை இது விளக்குகிறது என்பதைக் காட்டுகிறது.
- source_word: ἡμεῖς οἱ ζῶντες
  choice: உயிரோடிருக்கிற நாங்கள்
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடரும் நிலையைப் பேணுவதோடு, மரணத்துடனான முரண்பாட்டையும் தெளிவாக்குகிறது.
- source_word: εἰς θάνατον παραδιδόμεθα
  choice: மரணத்திற்கு ஒப்புக்கொடுக்கப்படுகிறோம்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் தொடர்ச்சியையும், மரணத்தை எதிர்கொள்ளும்படி பிறரிடம் ஒப்படைக்கப்படும் கருத்தையும் பேணுகிறது.
- source_word: διὰ Ἰησοῦν
  choice: இயேசுவின் நிமித்தம்
  rationale: διά + குற்றுவேற்றுமை இங்கு காரணம் அல்லது இயேசுவுக்கான பற்றுறுதியால் வரும் துன்பத்தைச் சுட்டுகிறது; மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἵνα
  choice: வெளிப்படுவதற்காகவே இப்படியாகிறது
  rationale: நோக்கம் அல்லது விளைவு என்ற இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது; தமிழில் வாக்கியத் தொடர்பை இயல்பாக்குகிறது.
- source_word: καί
  choice: உம்
  rationale: முந்தைய இயேசுவைப் பற்றிய குறிப்போடு இணையாக, அவரது உயிரும் வெளிப்படுகிறது என்ற சேர்க்கைப் பொருளைப் பேணுகிறது.
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: இயேசுவின் உயிர்
  rationale: மரணத்துக்கு எதிரான உயிர் என்ற கருத்தைத் தெளிவாகப் பேணுகிறது; 'வாழ்க்கை' என்பதைக் காட்டிலும் இச்சூழலில் 'உயிர்' இயல்பானது.
- source_word: φανερωθῇ
  choice: வெளிப்படுவதற்காக
  rationale: செயப்பாட்டு வடிவத்தைப் பேணி, வெளிப்படுத்துபவர் யார் என்பதை உரை கூறாதபடியே விடுகிறது.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: மரணத்திற்குரிய எங்கள் மாம்சத்தில்
  rationale: σάρξ என்பதன் உடல்சார்ந்த சொல்லைத் தக்கவைத்து, θνητός குறிக்கும் இறப்புக்குட்பட்ட தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் பயன்பாட்டில் σάρξ என்பதன் பொருள்
  choice: மாம்சம்—இங்கு மரணத்திற்குட்பட்ட உடல்சார்ந்த இருப்பு
  alternative: உடல்; பாவ இயல்பு
  rationale: '''மரணத்திற்குரிய மாம்சம்'' என்ற சூழல், பாவ ஒழுக்க இயல்பை அல்லாமல் உடலின் பலவீனத்தையும் இறப்புக்குட்பட்ட நிலையையும் குறிக்கிறது. ''மாம்சம்'' மூலச்சொல்லைத் தக்கவைக்கிறது; அடிக்குறிப்பு தவறான புரிதலைத் தவிர்க்கிறது.'
- issue: διὰ Ἰησοῦν குறிக்கும் காரணம் அல்லது நிமித்தம்
  choice: இயேசுவின் நிமித்தம்
  alternative: இயேசுவினால்; இயேசுவின் காரணமாக
  rationale: இயேசுவோடு கொண்ட பற்றுறுதியால் வரும் துன்பம் என்ற காரணப்பொருளை இயல்பாகத் தருகிறது; கிரேக்கத்தின் மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: ἵνα குறிக்கும் நோக்கம் அல்லது விளைவு
  choice: நோக்கை முதன்மைப்படுத்தி, விளைவுக்கும் இடமளிக்கும் அமைப்பு
  alternative: அதனால் ... வெளிப்படுகிறது
  rationale: ἵνα பொதுவாக நோக்கைக் குறித்தாலும் இச்சூழலில் விளைவு நுணுக்கமும் இருக்கலாம்; உரை அதை முற்றிலும் முடிவுசெய்யாதபடி மொழியாக்கம் அமைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. 'ஒப்புக்கொடுக்கப்படுகிறோம்' செயப்பாட்டு வடிவத்தையும் துன்புறுத்தலின் சூழலையும் பேணுகிறது. 'மரணத்திற்குரிய' என்பது 'சாகக்கூடிய' என்பதைக் காட்டிலும் வேதாகமப் பதிப்புக்கு ஏற்ற கண்ணியமான இயல்புநடை.
