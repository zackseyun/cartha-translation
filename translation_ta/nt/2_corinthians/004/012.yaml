reference: 2 Corinthians 4:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: ta
  text: ஆகவே[a], மரணம் எங்களில் செயல்படுகிறது; வாழ்வோ உங்களில் செயல்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதன் விளைவாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: ὥστε என்ற சொல்லின் விளைவு அல்லது முடிவைக் குறிக்கும் நுணுக்கத்தைக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் கூறப்பட்டவற்றின் விளைவையோ முடிவையோ அறிமுகப்படுத்தும் இணைப்பாக இங்கு வருகிறது. “ஆகவே” அதன் அனுமானத் தொடர்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὁ θάνατος
  choice: மரணம்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லுடன் வரும் சுட்டுறுப்பைத் தமிழில் தனியே மொழிபெயர்க்க வேண்டியதில்லை. “மரணம்” என்பது அப்போஸ்தலரின் துன்பத்தில் இயங்கும் மரண நிஜத்தை விளக்கம் சேர்க்காமல் காக்கிறது.
- source_word: ἐν ἡμῖν
  choice: எங்களில்
  rationale: பவுலையும் அவருடைய உடன் ஊழியர்களையும் கொரிந்தியர்களிலிருந்து வேறுபடுத்தும் பன்மை இது. “எங்களில்” என்பது அந்த உட்பட்ட, அனுபவரீதியான பொருளையும் எதிர்மறை இணைப்பையும் காக்கிறது.
- source_word: ἐνεργεῖται
  choice: செயல்படுகிறது
  rationale: தொடர்ந்து விளைவு உண்டாக்கும் செயற்பாட்டை இயல்பான தமிழில் குறிக்கிறது; செயப்பாட்டு அல்லது இடைநிலை வடிவத்தின் நுணுக்கத்தை அளவுக்கு மீறித் தீர்மானிப்பதில்லை.
- source_word: ἡ δὲ ζωὴ
  choice: வாழ்வோ
  rationale: δέ குறிக்கும் முரண்பாட்டை தமிழின் “-ஓ” எதிரிணை அமைப்பு சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது. “வாழ்வு” என்ற சொல் உடல் அல்லது ஆவிக்குரிய பொருள் ஒன்றுக்குள் மட்டும் கருத்தைச் சுருக்குவதில்லை.
- source_word: ἐν ὑμῖν
  choice: உங்களில்
  rationale: “எங்களில்” என்பதற்கு நேரான இணையாக இருந்து, தனிநபர் மற்றும் சமூகப் பொருள் இரண்டுக்கும் இடமளிக்கிறது.
theological_decisions:
- issue: மரணம்–வாழ்வு எதிரிணையின் பொருள்
  choice: அப்போஸ்தலர்களில் மரண நிஜம் செயல்படுவதையும், கொரிந்தியர்களில் வாழ்வு செயல்படுவதையும் நேரடியான சொற்களால் கூறுதல்
  alternative: அப்போஸ்தலர்களின் உடல் துன்பம் மற்றும் கொரிந்தியர்களின் ஆவிக்குரிய வாழ்வு என்று பிரதான உரையிலேயே விளக்கிவிடுதல்
  rationale: உடனடியான சூழல் இயேசுவின் மரணமும் வாழ்வும் அப்போஸ்தலரின் உடலில் வெளிப்படுவதைப் பேசுகிறது; அதேவேளை அவர்களின் ஊழியம் பிறருக்கு வாழ்வைக் கொண்டுவருவதையும் உள்ளடக்குகிறது. ஆகவே, மூலத்தின் இறுக்கத்தையும் இறையியல் பதற்றத்தையும் காக்க “மரணம்,” “வாழ்வு” என்ற சொற்கள் விளக்கமின்றி வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவாசிப்புக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. “எங்களில் / உங்களில்” மற்றும் “மரணம் / வாழ்வு” என்ற இணைகள் கிரேக்கத்தின் சுருக்கமான எதிரிணையைப் பேணுகின்றன.
