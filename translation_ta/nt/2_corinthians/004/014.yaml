id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: ta
  text: ஏனெனில், இயேசுவை[a] உயிர்த்தெழச் செய்தவர், இயேசுவுடன் எங்களையும் உயிர்த்தெழச் செய்து, உங்களுடன் சேர்த்து எங்களையும் தம்முன் நிறுத்துவார் என்பதை நாங்கள் அறிந்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “இயேசு” என்பதற்குப் பதிலாக “ஆண்டவராகிய இயேசு” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: ஏனெனில், ... என்பதை நாங்கள் அறிந்திருக்கிறோம்
  rationale: இது இலக்கண வடிவில் வினையெச்சமாக இருந்தாலும், முந்தைய வசனத்தில் கூறப்பட்ட துன்பத்தைத் தாங்குவதற்கான காரணத்தை இங்கு தருகிறது. ஆகவே காரணப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ ἐγείρας
  choice: உயிர்த்தெழச் செய்தவர்
  rationale: கடந்தகால வினையெச்சத்துடன் கூடிய சுட்டுப்பெயர்ச் சொல்லின் பொருளைப் பாதுகாத்து, இயேசுவை உயிரோடு எழுப்பிய கடவுளைக் குறிக்கிறது.
- source_word: τὸν Ἰησοῦν
  choice: இயேசுவை
  rationale: SBLGNT மூலபாடத்தில் உள்ள ‘இயேசு’ என்ற குறுகிய வாசகத்தையே முதன்மைப் பாடத்தில் பின்பற்றுகிறது; நீண்ட வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καὶ ἡμᾶς
  choice: எங்களையும்
  rationale: καί என்பதன் சேர்க்கைப் பொருளைப் பாதுகாத்து, இயேசுவின் உயிர்த்தெழுதலுக்கும் விசுவாசிகளின் வருங்கால உயிர்த்தெழுதலுக்கும் உள்ள தொடர்பைத் தெளிவாக்குகிறது.
- source_word: σὺν Ἰησοῦ
  choice: இயேசுவுடன்
  rationale: σύν என்பதன் உடனிருப்பு அல்லது இணைவு சார்ந்த பொருளை நேரடியாகத் தருகிறது; ஆதாரமில்லாத கருவிப் பொருளைச் சேர்க்கவில்லை.
- source_word: παραστήσει
  choice: தம்முன் நிறுத்துவார்
  rationale: ஒருவரை முன்னிலையில் கொண்டுவந்து நிறுத்துதல் அல்லது சமர்ப்பித்தல் என்ற வினையின் பொருளை இயல்பான தமிழில் தருகிறது; இறுதிக்காலச் சூழலை அதற்கு மேல் குறிப்பிட்டுச் சுருக்கவில்லை.
- source_word: σὺν ὑμῖν
  choice: உங்களுடன் சேர்த்து
  rationale: பவுலும் கொரிந்தியர்களும் பகிர்ந்துகொள்ளும் கூட்டு நம்பிக்கையைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐγείρας என்பதற்குப் பின் காணப்படும் பாடவேறுபாடு
  choice: முதன்மைப் பாடத்தில் ‘இயேசு’; அடிக்குறிப்பில் ‘ஆண்டவராகிய இயேசு’
  alternative: முதன்மைப் பாடத்திலேயே ‘ஆண்டவராகிய இயேசு’
  rationale: SBLGNT மூலபாடம் ‘இயேசு’ என்று வாசிப்பதால் அதைப் பின்பற்றுகிறது. பரவலாகச் சான்றுபெற்ற நீண்ட வாசகத்தை வெளிப்படைத்தன்மைக்காக அடிக்குறிப்பில் பாதுகாக்கிறது; இது கோட்பாட்டு வேறுபாடு அல்ல, பாடவேறுபாடு.
- issue: παραστήσει என்பதன் இறுதிக்காலப் பொருள்
  choice: உயிர்த்தெழுதலுக்குப் பின் பவுலையும் கொரிந்தியர்களையும் கடவுள் ஒன்றாகத் தம்முன் நிறுத்துவார்
  alternative: பொதுவான நியாயப்படுத்தல் அல்லது கிறிஸ்துவின் நியாயத்தீர்ப்பு முன்னிலையில் குறிப்பாக நிறுத்துதல்
  rationale: சூழல் இறந்தோரின் வருங்கால உயிர்த்தெழுதலையும் அதனுடன் தொடர்புடைய தெய்வீக முன்னிலைப்படுத்துதலையும் ஆதரிக்கிறது. ஆனால் அது நிகழும் துல்லியமான அமைப்பை கிரேக்கம் கூறுவதைக் கடந்து மொழிபெயர்ப்பு வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிர்த்தெழச் செய்தவர்’ மற்றும் ‘தம்முன் நிறுத்துவார்’ ஆகியவை மூலத்தின் செயற்பாட்டு மற்றும் இறுதிக்கால நுணுக்கங்களை இயல்பாகப் பாதுகாக்கின்றன.
