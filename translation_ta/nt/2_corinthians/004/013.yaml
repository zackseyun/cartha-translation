source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: ta
  text: ஆனால், அதே விசுவாசத்தின் ஆவியைக் கொண்டிருக்கிற நாங்களும், “நான் நம்பினேன்; ஆகவே பேசினேன்” என்று எழுதப்பட்டிருக்கிறபடியே, நம்புகிறோம்; ஆகவே நாமும் பேசுகிறோம்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதே விசுவாசத்தின் ஆவி” என்பது விசுவாசம் நிறைந்த ஒரே மனப்பாங்கைக் குறிக்கலாம்; அல்லது “விசுவாசத்தை அருளும் அதே ஆவியானவர்” என்று பரிசுத்த ஆவியைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: பவுல் சங்கீதம் 116:10-ஐ மேற்கோள் காட்டுகிறார் (கிரேக்கப் பழைய ஏற்பாட்டில் சங்கீதம் 115:1); சங்கீதக்காரனைப் போலவே தானும் நம்புவதால் பேசுவதாகக் கூறுகிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: ஆனால் ... பெற்றிருக்கிற
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியைத் தமிழில் இயல்பாகப் பெயரெச்சத் தொடரால் காக்கிறது; δέ முந்தைய கருத்துடன் மென்மையான முரண்பாட்டைக் குறிக்கிறது.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: அதே விசுவாசத்தின் ஆவி
  rationale: கிரேக்கத்தின் உருவகத்தையும் 'விசுவாசம்' என்ற பெயர்ச்சொல்லையும் காக்கிறது; πνεῦμα பரிசுத்த ஆவியையா அல்லது விசுவாசம் நிறைந்த உள்ளார்ந்த மனப்பாங்கையா குறிக்கிறது என்ற தெளிவின்மையைத் தீர்க்காமல் விடுகிறது.
- source_word: κατὰ τὸ γεγραμμένον
  choice: என்று எழுதப்பட்டிருப்பதற்கு ஏற்ப
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் வழக்குச் சொல்லின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: நான் நம்பினேன்; ஆகவே பேசினேன்
  rationale: வினைச்சொற்களையும் διό குறிக்கும் விளைவு அல்லது முடிவுறுத்தல் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν
  choice: நாங்களும் நம்புகிறோம்; ஆகவே பேசவும் செய்கிறோம்
  rationale: வலியுறுத்தப்பட்ட ἡμεῖς மற்றும் இரண்டாவது καί ஆகியவற்றின் 'நாங்களும்/பேசவும்' என்ற இணைநிலையைத் தமிழில் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: πνεῦμα என்பது பரிசுத்த ஆவியைக் குறிக்கிறதா அல்லது பகிரப்பட்ட விசுவாச மனப்பாங்கைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் 'விசுவாசத்தின் ஆவி' என்று தெளிவின்மையைப் பாதுகாத்தல்
  alternative: '''விசுவாசத்தை அருளும் அதே பரிசுத்த ஆவி'' அல்லது ''அதே விசுவாச மனப்பாங்கு'' என்று விளக்கமாக மொழிபெயர்த்தல்'
  rationale: உடனடிச் சூழலும் சங்கீத மேற்கோளும் விசுவாசத்தால் பேசும் ஒரே மனப்பாங்கை ஆதரிக்கின்றன; ஆயினும் கிரேக்கச் சொல் பரிசுத்த ஆவியைக் குறிக்கும் வாய்ப்பை முற்றிலும் விலக்கவில்லை.
- issue: πιστεύω சொற்குடும்பத்தின் மொழிபெயர்ப்பு
  choice: நம்பினேன் / நம்புகிறோம்
  alternative: விசுவாசித்தேன் / விசுவாசிக்கிறோம்
  rationale: மேற்கோளிலும் பவுலின் பயன்பாட்டிலும் ஒரே வினைச்சொல் இணைநிலையைப் பேணுவதோடு, சாதாரண நவீனத் தமிழில் இயல்பாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் சுருக்கமான தர்க்க இணைநிலையும், பவுலின் பயன்பாட்டுடனான ஒற்றுமையும் காக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
