  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: ta
  text: ஏனெனில், தற்காலிகமான நமது இலேசான துன்பம், நமக்காக ஒப்பிட முடியாத அளவுக்கு மிகுதியான நித்திய மகிமையின் கனத்தை உருவாக்குகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகுதிக்கு மேல் மிகுதியாக.” கிரேக்கத்தில் சொற்சொறாக, “மிகுதியின்படி மிகுதிக்குள்”; இது அளவுக்கு அப்பாற்பட்ட பெருமையை வலியுறுத்தும் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: சிறிது காலமே நீடிக்கும்
  rationale: இப்போதைக்கு உரியது, தற்காலிகமானது என்ற பொருளை இயல்பான தமிழில் தருகிறது; பின்னர் வரும் ‘நித்தியமான’ என்பதுடனான கால முரண்பாட்டையும் தெளிவாக வைத்திருக்கிறது.
- source_word: ἐλαφρὸν
  choice: இலேசான
  rationale: பின்னர் வரும் βάρος (‘கனம்’) என்பதுடனான பவுலின் திட்டமிட்ட உருவக முரண்பாட்டைப் பாதுகாக்கிறது; துன்பம் அற்பமானது என்று மறுப்பதில்லை, நித்திய மகிமையோடு ஒப்பிட்டுப் பேசுகிறது.
- source_word: θλίψεως
  choice: துன்பம்
  rationale: அழுத்தம், நெருக்கடி, வேதனை ஆகியவற்றை உள்ளடக்கும் தெளிவான நவீனத் தமிழ்ச் சொல்; தேவையற்ற இறுதிக்காலச் சிறப்புப் பொருளைச் சேர்ப்பதில்லை.
- source_word: ἡμῶν
  choice: நமது
  rationale: துன்பம் பவுலுக்கும் அவருடைய உடன் ஊழியர்களுக்கும் உரியது என்பதைக் காட்டும் உடைமைப் பொருளைப் பாதுகாக்கிறது.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: ஒப்பிட முடியாத அளவுக்கு மிகுதியாக
  rationale: ‘மிகுதியின்படி மிகுதிக்குள்’ என்ற சொற்சொறான கிரேக்கத் தொடரின் தீவிரப்படுத்தும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αἰώνιον
  choice: நித்தியமான
  rationale: தற்காலிகத் துன்பத்துக்கு எதிராக முடிவில்லாமல் நிலைத்திருக்கும் மகிமையைச் சுட்டும் வழக்கமான, கண்ணியமான தமிழ் இணைச்சொல்.
- source_word: βάρος
  choice: கனம்
  rationale: ἐλαφρόν (‘இலேசான’) என்பதுடனான உருவக எதிர்மறையைப் பாதுகாக்கிறது; ‘சுமை’ என்று மொழிபெயர்த்து மகிமையை ஒடுக்குகிற ஒன்றாகக் காட்டுவதைத் தவிர்க்கிறது.
- source_word: δόξης
  choice: மகிமையின்
  rationale: ‘மகிமையின் கனம்’ என்ற பெயர்ச்சொல் அமைப்பைத் தக்கவைத்து, அதை வெறும் ‘மகிமையான’ என்ற பெயரடையாகத் தட்டையாக்காமல் பாதுகாக்கிறது.
- source_word: κατεργάζεται
  choice: உருவாக்குகிறது
  rationale: தற்போதைய துன்பம் நமக்கான வருங்கால விளைவைக் கொண்டுவருகிறது என்ற வினையின் செயற்பாட்டு, தொடர்நிலைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἡμῖν
  choice: நமக்காக
  rationale: இங்கு வேற்றுமை உருபு பயன் அல்லது நன்மைப் பொருளைக் குறிப்பதாக எடுத்துக்கொள்ளப்படுகிறது; ‘நமக்குள்’ என்று மொழிபெயர்த்து உள்ளார்ந்த ஒழுக்க மாற்றத்தை மட்டும் குறிப்பதாகச் சுருக்கவில்லை.
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: சிறிது காலமே நீடிக்கும் நமது இலேசான துன்பம்
  rationale: காலக் குறைவு, இலேசுத்தன்மை, உடைமை உறவு ஆகிய அனைத்தையும் இயல்பான தமிழ் சொல் வரிசையில் ஒருங்கிணைக்கிறது.
theological_decisions:
- issue: துன்பம் உருவாக்கும் மகிமையின் இயல்பு
  choice: இப்போதைய துன்பம் விசுவாசிகளுக்கான வருங்கால, நித்திய மகிமையை விளைவிக்கிறது என்று வசனம் கூறுகிறது; துன்பம் இரட்சிப்பைச் சம்பாதிக்கிறது என்று மொழிபெயர்ப்பு கூறவில்லை.
  alternative: துன்பம் மனிதத் தகுதியால் மகிமையைச் சம்பாதிக்கிறது; அல்லது அது இப்போதைய ஆன்மிக முதிர்ச்சியை மட்டுமே உருவாக்குகிறது.
  rationale: ‘சிறிது காலம்’ மற்றும் ‘நித்தியம்’ என்ற எதிரிணை வருங்கால நிறைவை நோக்குகிறது. ‘உருவாக்குகிறது’ என்பது மூலத்தின் காரண–விளைவு பதற்றத்தை வைத்திருக்கிறது; அதற்கு அப்பால் தகுதி அல்லது சம்பாத்தியம் பற்றிய கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு வாசிப்புக்கும் தனிப்பட்ட வாசிப்புக்கும் ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இலேசான—கனம்’ மற்றும் ‘சிறிது காலம்—நித்தியம்’ என்ற இரு முக்கிய எதிரிணைகளும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
