- from: நாங்கள் எங்களையே அறிவிப்பதில்லை; மாறாக, மெசியாவாகிய இயேசுவை ஆண்டவராக அறிவிக்கிறோம்[a]. எங்களையோ இயேசுவின் பொருட்டு[c] உங்கள் அடிமைகளாக[b] அறிவிக்கிறோம்.
