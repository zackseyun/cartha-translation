  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: ta
  text: நாங்கள் எங்களையே அறிவிப்பதில்லை; மாறாக, மெசியாவாகிய இயேசுவை ஆண்டவராக அறிவிக்கிறோம்[a]; ஆனால் நாங்கள் இயேசுவின் பொருட்டு[c] உங்கள் அடிமைகளாக[b] இருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து இயேசுவை ஆண்டவராக.” கிரேக்க மொழியின் Χριστός இங்கு பட்டமாகப் புரிந்துகொள்ளப்பட்டதால், முதன்மை உரையில் “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் ஊழியர்களாக.” கிரேக்க மொழியின் δοῦλοι என்பது ஊழியர்களையோ அடிமைகளையோ குறிக்கலாம்; இங்கு இயேசு “ஆண்டவர்” என்பதோடு காணப்படும் வலுவான முரண்பாட்டைக் காக்க முதன்மை உரையில் “அடிமைகள்” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “இயேசுவின் காரணமாக.”
    reason: translation_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: அறிவிக்கிறோம்
  rationale: பொதுவாகவும் வெளிப்படையாகவும் பிரகடனம் செய்வதைக் குறிக்கும் கிரேக்கச் சொல்லின் பொருளை, பிரசங்க மேடைக்கு மட்டும் வரையறுக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἑαυτοὺς
  choice: எங்களையே / எங்களையோ
  rationale: பவுலும் அவருடைய உடன் ஊழியர்களும் தங்களைச் செய்தியின் மையமாக அறிவிப்பதில்லை என்ற முரண்பாட்டையும், பின்னர் தங்களை கொரிந்தியரின் அடிமைகளாகக் குறிப்பிடுவதையும் பிரதிபலிக்கிறது.
- source_word: Χριστὸν Ἰησοῦν
  choice: மெசியாவாகிய இயேசுவை
  rationale: Χριστός என்பதை இங்கு பெயராக மட்டும் அல்லாமல் பட்டமாகப் புரிந்துகொண்டு ‘மெசியா’ என மொழிபெயர்க்கிறது; தமிழில் இயல்பாக இருக்க ‘மெசியாவாகிய இயேசு’ என்ற அமைப்பு பயன்படுத்தப்படுகிறது.
- source_word: κύριον
  choice: ஆண்டவராக
  rationale: இயேசுவைப் பற்றிய அறிவிப்பின் விதிப்பயனாக κύριον வருவதால், அவர் ஆண்டவர் என்பதைக் ‘ஆண்டவராக’ என்ற அமைப்பு தெளிவாகவும் விரிவாக்கமின்றியும் தருகிறது.
- source_word: δούλους
  choice: அடிமைகளாக
  rationale: ஆண்டவராகிய இயேசுவுக்கும் அவருக்காகத் தங்களைத் தாழ்த்திக்கொள்ளும் தூதர்களுக்கும் இடையிலான வலுவான கீழ்ப்படிதல் முரண்பாட்டை ‘அடிமைகள்’ காக்கிறது.
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: δοῦλοι என்பதோடு வரும் உரிமை/உறவு சார்ந்த கிரேக்க வேற்றுமையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: διὰ Ἰησοῦν
  choice: இயேசுவின் பொருட்டு
  rationale: διά + குற்றுவேற்றுமை இங்கு காரணம் அல்லது நோக்கத்தைக் குறிப்பதால், அவர்களுடைய அடிமைத்தனமான சேவை இயேசுவை முன்னிட்டு இருப்பதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστός என்பதைப் பட்டமாகவா, பெயரின் பகுதியாகவா மொழிபெயர்ப்பது
  choice: மெசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இந்த வசனத்தில் இயேசுவைப் பற்றிய அறிவிப்பின் உள்ளடக்கம் முன்வைக்கப்படுவதால், Χριστός என்பதன் பட்டத்தன்மை இன்னும் தெளிவாக உள்ளது; ஆகவே ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: Χριστὸν Ἰησοῦν κύριον என்ற தொடரின் அமைப்பு
  choice: மெசியாவாகிய இயேசுவை ஆண்டவராக அறிவிக்கிறோம்
  alternative: ஆண்டவராகிய கிறிஸ்து இயேசுவை அறிவிக்கிறோம்
  rationale: κύριον என்பதை இயேசுவைப் பற்றிய விதிப்பயனாகப் பேணுகிறது; மூலத்தில் இல்லாத தனி வினைச்சொல்லைச் சேர்க்காமல் இயேசுவின் ஆண்டவர்தன்மையை அறிக்கையிடுகிறது.
- issue: δοῦλοι என்பதன் வலிமை
  choice: அடிமைகள்
  alternative: ஊழியர்கள் / பணியாளர்கள்
  rationale: ‘ஆண்டவர்’ என்பதற்கு எதிராக நிறுத்தப்பட்டுள்ள வலுவான கீழ்ப்படிதல் மற்றும் தாழ்த்துதல் உணர்வை மென்மையாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முதல் மற்றும் இரண்டாம் ἑαυτούς இடையிலான சொல்லாட்சிசார் முரண்பாடு காக்கப்பட்டுள்ளது. அரைப்புள்ளிக்குப் பதிலாக இரண்டு வாக்கியங்கள் பயன்படுத்தப்பட்டாலும், ‘எங்களையே / எங்களையோ’ என்ற இணை அமைப்பு கருத்துத் தொடர்ச்சியைத் தெளிவாக்குகிறது.
