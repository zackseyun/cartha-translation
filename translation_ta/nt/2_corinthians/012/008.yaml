  yaml_path: translation/nt/2_corinthians/012/008.yaml
  text: Concerning this[d][c][b][a], three times I pleaded with the Lord that it might depart from me.
translation:
  language: ta
  text: இதைக் குறித்து[a], என்னைவிட்டு நீங்கும்படி[d] நான் ஆண்டவரிடம்[c] மூன்றுமுறை மன்றாடினேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இதைப் பற்றி’ அல்லது ‘இதற்காக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வேண்டிக்கொண்டேன்’ அல்லது ‘கெஞ்சினேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்க மூலம் ‘ஆண்டவர்’ என்று மட்டுமே கூறுகிறது; பவுல் இங்கு இயேசுவின் பெயரை வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
  - marker: d
    text: ‘என்னைவிட்டு அகலும்படி’ அல்லது ‘என்னைவிட்டுப் போகும்படி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் வினையின் எழுவாய் வெளிப்படையாக இல்லை; முந்தைய வசனத்தில் வரும் முள் அல்லது தூதன் உருவகங்களில் எதைக் குறிக்கிறது என்பதை அது தெளிவுபடுத்தவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: இதைக் குறித்து
  rationale: ὑπέρ என்பதுடன் ஆறாம் வேற்றுமை வடிவம் இங்கு ‘சார்பாக’ என்பதைக் காட்டாமல், முந்தைய வசனத்தில் கூறப்பட்ட துன்பத்தையே பேச்சுப் பொருளாகச் சுட்டுகிறது. ‘இதைக் குறித்து’ என்பது அந்தத் தொடர்பை இயல்பாகப் பாதுகாக்கிறது.
- source_word: τρὶς
  choice: மூன்றுமுறை
  rationale: இந்த வினையடை மூன்று தனித்த நிகழ்வுகளையோ வேண்டுதல்களையோ குறிக்கிறது. ‘மூன்றுமுறை’ தெளிவான நவீனத் தமிழ்.
- source_word: τὸν κύριον
  choice: ஆண்டவரிடம்
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என்பது மரியாதையும் வழக்குமுடைய தமிழ் இணை. கிரேக்கத்தில் பெயர் குறிப்பிடப்படாததால் ‘இயேசு’ என்று விரிவாக்கப்படவில்லை; παρεκάλεσα வினையின் வேண்டுதல் சென்றவரைத் தமிழில் இயல்பாகக் காட்ட ‘-இடம்’ பயன்படுத்தப்பட்டது.
- source_word: παρεκάλεσα
  choice: மன்றாடினேன்
  rationale: παρακαλέω என்பதன் பொருள் வேண்டுதல், விண்ணப்பம், வலியுறுத்தல் என விரிகிறது. இங்கு துன்பம் நீங்க வேண்டி ஆண்டவரிடம் செய்யும் தீவிர வேண்டுதலை ‘மன்றாடினேன்’ இயல்பாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: ἵνα
  choice: -படி
  rationale: ἵνα வேண்டுதலின் நோக்கத்தையோ உள்ளடக்கத்தையோ அறிமுகப்படுத்துகிறது. தமிழில் வினையெச்ச அமைப்பான ‘நீங்கும்படி’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀποστῇ
  choice: நீங்கும்படி
  rationale: ἀφίστημι/ἀφίσταμαι என்பதன் இங்குள்ள பொருள் விலகுதல் அல்லது அகலுதல். எழுவாய் கிரேக்கத்தில் மறைமுகமாக இருப்பதால், தமிழிலும் வெளிப்படையான ‘அது’ அல்லது ‘அவன்’ சேர்க்காமல் ‘நீங்கும்படி’ என அமைத்து முந்தைய வசனத்துடனான இருபொருள் வாய்ப்பைப் பாதுகாக்கிறது.
- source_word: ἀπ’ ἐμοῦ
  choice: என்னைவிட்டு
  rationale: பவுலிடமிருந்து பிரிந்து அகல்வதைக் குறிக்கிறது. ‘என்னைவிட்டு’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பதன் குறிப்பு
  choice: ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆண்டவராகிய இயேசு’
  rationale: இச்சூழலில் பவுல் இயேசுவைக் குறிப்பதாக இருக்கலாம்; எனினும் கிரேக்க மூலத்தில் κύριον (‘ஆண்டவர்’) என்று மட்டுமே உள்ளது. மூலத்தில் இல்லாத பெயரைச் சேர்க்காமல் அதன் திறந்த குறிப்பைப் பாதுகாக்கிறது.
- issue: ἀποστῇ என்பதன் மறைமுக எழுவாய்
  choice: தமிழிலும் எழுவாய் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
  alternative: ‘அது நீங்கும்படி’; ‘அவன் அகலும்படி’; ‘முள் நீங்கும்படி’; ‘சாத்தானின் தூதன் அகலும்படி’
  rationale: முந்தைய வசனத்தில் ‘மாம்சத்தில் ஒரு முள்’ என்றும் ‘சாத்தானின் தூதன்’ என்றும் வரும் உருவகங்கள் இரண்டும் சாத்தியமான முன்னோடிகளாக உள்ளன. தமிழ் எழுவாயை விட அனுமதிப்பதால், ‘அது’ அல்லது ‘அவன்’ எனத் தீர்மானிக்காமல் கிரேக்கத்தின் உண்மையான இருபொருள் வாய்ப்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டது. ‘மன்றாடினேன்’ வேண்டுதலின் தீவிரத்தைத் தக்கவைக்கிறது; ‘நீங்கும்படி’ இயல்பான தமிழையும் மூலத்தின் மறைமுக எழுவாயையும் பாதுகாக்கிறது. ‘ஆண்டவர்’ என்ற சொல்லை பெயரால் விரிவாக்காமல் மூலத்தின் அளவிலேயே வைத்துள்ளது.
