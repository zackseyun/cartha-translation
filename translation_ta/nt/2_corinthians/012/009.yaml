id: 2CO.12.9
reference: 2 Corinthians 12:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: ta
  text: அவர் என்னிடம், “என் அருள் உனக்குப் போதும்; ஏனெனில் வல்லமை[a] பலவீனத்தில் நிறைவை அடைகிறது[b]” என்று சொல்லியிருக்கிறார். ஆகவே, மெசியாவின்[d] வல்லமை என்மேல் தங்கியிருக்கும்படியாக[c], என் பலவீனங்களைக் குறித்து மிகுந்த மகிழ்ச்சியோடு இன்னும் அதிகமாகப் பெருமை பேசுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “என் வல்லமை” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “பலவீனத்தில் பூரணமாகிறது.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “என்மேல் தங்கும்படியாக”; சொல்லுக்கு நெருக்கமாக, “என்மேல் கூடாரமிட்டுத் தங்கும்படியாக.”
    reason: lexical_alternative
  - marker: d
    text: பாரம்பரிய மொழிபெயர்ப்புகளில், “கிறிஸ்துவின்.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἴρηκέν
  choice: சொல்லியிருக்கிறார்
  rationale: நிகழ்ந்து முடிந்த கூற்றின் தொடரும் பொருத்தத்தை உணர்த்தும் கிரேக்க நிறைவுக்கால வினையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἀρκεῖ
  choice: போதும்
  rationale: தேவையான அளவு முழுமையாக இருப்பதைக் குறிக்கும் இயல்பான, தெளிவான நவீனத் தமிழ்.
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் பயன்பாட்டில் உள்ள இறையியல் செறிவையும் கடவுளின் ஈவையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: δύναμις
  choice: வல்லமை
  rationale: வசனத்தில் இருமுறை வரும் சொல்லின் தொடர்பைக் காத்து, இறை ஆற்றலைக் கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: பலவீனம் / பலவீனங்கள்
  rationale: ஒருமையிலுள்ள பொதுக் கொள்கையையும் பன்மையிலுள்ள பவுலின் அனுபவங்களையும் வேறுபடுத்திக் காக்கிறது.
- source_word: τελεῖται
  choice: நிறைவை அடைகிறது
  rationale: வல்லமையில் முன்பு குறை இருந்தது என்று தேவையின்றி உணர்த்தாமல், அதன் நோக்கம் பலவீனத்தில் முழுமையாக வெளிப்படுகிறது என்ற τελέω சொல்லின் நிறைவுறும் பொருளைக் காக்கிறது.
- source_word: ἥδιστα ... μᾶλλον
  choice: இன்னும் அதிக மகிழ்ச்சியோடு
  rationale: இரு வலியுறுத்தும் சொற்களையும் செயற்கையான மீளுரையின்றி இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: καυχήσομαι
  choice: பெருமைபாராட்டுவேன்
  rationale: பலவீனங்களைக் குறித்துப் பெருமைபாராட்டும் பவுலின் நோக்கமுள்ள முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: என்மேல் குடிகொள்ளும்படி
  rationale: என்மேல் கூடாரமிட்டு வாசம்பண்ணுதல் என்ற படிமத்தின் குடியிருப்பு மற்றும் மேலிருந்து சூழும் நுணுக்கங்களை வாசிக்கத்தக்க தமிழில் காக்கிறது.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: இங்கு Χριστός ஒரு பட்டமாகச் செயல்படுவதால், அதன் ‘அபிஷேகம் பெற்றவர்’ என்ற மெசியா சார்ந்த பொருளைக் காக்கிறது.
theological_decisions:
- issue: δύναμις என்பதற்கு முன் முதலாம் நபர் உடைமைச்சொல் உள்ளதா
  choice: வல்லமை
  alternative: என் வல்லமை
  rationale: கொடுக்கப்பட்ட SBLGNT முதன்மை உரையில் δύναμις என்பதோடு μου இல்லை; ஆகவே முதன்மை உரையில் ‘என்’ என்று சேர்க்கப்படவில்லை. கையெழுத்துப் பிரதிகளின் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τελεῖται என்ற சொல்லின் இறையியல் நுணுக்கம்
  choice: நிறைவை அடைகிறது
  alternative: பூரணமாகிறது
  rationale: இறைவல்லமையில் ஒழுக்க அல்லது இயல்புக் குறை இருந்ததாகத் தீர்மானிக்காமல், பலவீனத்தில் அது தன் முழு விளைவை அடைகிறது என்ற பதற்றத்தைப் பாதுகாக்கிறது.
- issue: Χριστοῦ என்ற பட்டப்பெயர்
  choice: மெசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இச்சூழலில் பட்டப்பெயரின் பொருள் தெளிவாக இருப்பதால் ‘மெசியா’ பயன்படுத்தப்படுகிறது; தமிழ்க் கிறிஸ்தவ மரபில் பரவலான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சொல்லியிருக்கிறார்’ என்பது கிரேக்க நிறைவுக்காலத்தின் தொடரும் பொருத்தத்தைக் காக்கிறது. மேற்கோளில் மூல உரில் இல்லாத உடைமைச்சொல் சேர்க்கப்படவில்லை; முக்கியமான மாற்று வாசிப்புகள் மற்றும் படிமங்கள் மட்டும் அடிக்குறிப்புகளாக வழங்கப்பட்டுள்ளன.
