  yaml_path: translation/nt/2_corinthians/012/017.yaml
  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: ta
  text: நான் உங்களிடம் அனுப்பியவர்களில் எவர் மூலமாகவாவது உங்களைச் சுரண்டினேனா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களை எனக்குச் சாதகமாகப் பயன்படுத்திக்கொண்டேனா?” அல்லது, “உங்களை மோசடி செய்தேனா?” பிறருடைய இழப்பில் ஆதாயம் அடைவது என்ற பொருளை கிரேக்க வினைச்சொல் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: …சுரண்டினேனா?
  rationale: μή எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான சொல்லாட்சியுடன் கூடிய இந்த வினா வடிவம் பவுலின் மறுப்புணர்வைச் சூழலில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τινα ὧν
  choice: அனுப்பியவர்களில் எவர்…வாவது
  rationale: பவுல் அனுப்பியவர்களின் குழுவிலிருந்து எந்த ஒருவரையும் குறிக்கக்கூடிய பகுதிப்பொருளை இந்தத் தமிழ் அமைப்பு இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀπέσταλκα πρὸς ὑμᾶς
  choice: உங்களிடம் அனுப்பிய
  rationale: மூலத்தில் உள்ள அனுப்புதல் மற்றும் அதன் இலக்கு ஆகிய இரண்டையும் நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: δι’ αὐτοῦ
  choice: எவர் மூலமாகவாவது
  rationale: மூலத்தின் ஒருமைச் சுட்டை, முன்வரும் வரையறையற்ற குழுக் குறிப்புடன் இணைத்து விநியோகப் பொருளில் இயல்பான தமிழாக வழங்குகிறது.
- source_word: ἐπλεονέκτησα
  choice: சுரண்டினேனா
  rationale: பிறருடைய இழப்பில் தமக்கான ஆதாயத்தைத் தேடுதல் அல்லது அநியாயமாகப் பயன்படுத்திக்கொள்ளுதல் என்ற வினைச்சொல்லின் கூர்மையான பொருளை ‘சுரண்டு’ சுருக்கமாகவும் தற்போதைய வழக்கிலும் தெரிவிக்கிறது.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: கொரிந்துச் சபையாரை மொத்தமாகக் குறிக்கும் நேரடிச் செயப்படுபொருளைத் துல்லியமாக வழங்குகிறது.
