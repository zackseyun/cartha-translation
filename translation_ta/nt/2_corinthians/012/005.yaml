id: 2CO.12.5
reference: 2 Corinthians 12:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: ta
  text: அப்படிப்பட்ட ஒருவரைக் குறித்து நான் பெருமை பேசுவேன்[a]. ஆனால் என்னைக் குறித்து நான் பெருமை பேசமாட்டேன்; என் பலவீனங்களில் மட்டுமே பெருமை பேசுவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்படிப்பட்ட ஒருவருக்காக.” கிரேக்க முன்னிடைச்சொல் ஒருவருக்காக அல்லது ஒருவரைக் குறித்து பெருமை பேசுதல் என்ற இரு நுணுக்கங்களையும் ஏற்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “பலவீனங்கள்” என்பது மனித வலுவின்மை, இயலாமை, துன்பம் போன்றவற்றைக் குறிக்கக்கூடும். “என்” என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லை; சூழலிலிருந்து தெளிவாக இருப்பதால் தமிழில் சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ τοῦ τοιούτου
  choice: அப்படிப்பட்ட ஒருவரைக் குறித்து
  rationale: ὑπέρ உடன் வரும் இத்தொடர், யாரை முன்னிறுத்திப் பெருமை பேசப்படுகிறது என்பதைச் சுட்டுகிறது. ‘குறித்து’ என்பது இயல்பான நவீனத் தமிழில் அந்தத் தொடர்பைத் தெரிவிப்பதோடு, பவுல் தம்மை அந்த அனுபவத்திலிருந்து சொல்லாட்சியால் விலக்கி நிறுத்துவதையும் காக்கிறது.
- source_word: καυχήσομαι / καυχήσομαι
  choice: பெருமை பேசுவேன் / பெருமை பேசமாட்டேன்
  rationale: καυχάομαι என்பதன் தற்பெருமை அல்லது பெருமிதமான உரிமைகோரல் சார்ந்த பொருளை ‘பெருமை பேசுதல்’ தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐμαυτοῦ
  choice: என்னைக் குறித்து
  rationale: முற்சொல்லான ὑπὲρ τοῦ τοιούτου என்பதுடன் உள்ள வெளிப்படையான முரணைத் தமிழிலும் காக்கிறது.
- source_word: εἰ μὴ
  choice: மட்டுமே
  rationale: இங்கு εἰ μή நிபந்தனையைக் காட்டாமல் விதிவிலக்கைக் காட்டுகிறது. தமிழில் வாக்கியத்தை நேர்மறை வடிவில் மீளமைத்து ‘மட்டுமே’ என வழங்குவது அந்த விதிவிலக்கை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: என் பலவீனங்களில்
  rationale: ἀσθένεια உடல் அல்லது மனித வலுவின்மை, துன்பம், இயலாமை போன்ற பரந்த பொருளைக் கொள்ளக்கூடும். ‘பலவீனங்கள்’ அந்தப் பரப்பைத் திறந்தே வைக்கிறது. கிரேக்கத்தில் உடைமைச்சொல் இல்லாவிட்டாலும், ἐμαυτοῦ உடனான முரணும் சூழலும் இவை பவுலின் பலவீனங்கள் என்பதைக் காட்டுவதால் தமிழில் ‘என்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: பவுல் அனுமதிக்கும் பெருமை பேசுதலின் தன்மை
  choice: அசாதாரண அனுபவத்துக்குரிய நபரைத் தம்மிடமிருந்து சொல்லாட்சியால் விலக்கிக் குறிப்பிட்டு அவரைக் குறித்துப் பெருமை பேசும் பவுல், தம்மைக் குறித்தோ தம் பலவீனங்களில் மட்டுமே பெருமை பேசுவதாகக் கூறுகிறார்.
  alternative: அவர் தம்மிலிருந்து உண்மையிலேயே வேறான இன்னொரு நபரைப் பற்றிப் பேசுகிறார்; அல்லது தனிப்பட்ட குறிப்பின்றி பலவீனத்தைப் பற்றிய பொதுவான இறையியல் கொள்கையை மட்டும் கூறுகிறார்.
  rationale: τοῦ τοιούτου என்ற மறைமுகச் சுட்டு உருவாக்கும் திட்டமிட்ட இடைவெளியையும், பலவீனத்தை நோக்கிய திருப்பத்தையும் மொழிபெயர்ப்பு காக்கிறது; முந்தைய தரிசன அனுபவத்தில் குறிப்பிடப்பட்ட நபர் பவுல்தானா என்ற கேள்வியை முதன்மை உரை தீர்மானித்துவிடவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருக்க ‘பெருமை பேசுதல்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் விதிவிலக்குக் கட்டமைப்பு தமிழில் தெளிவுக்காக இரண்டாம் கூறில் நேர்மறையாக மீளமைக்கப்பட்டுள்ளது. ‘அப்படிப்பட்ட ஒருவர்’ என்ற மறைமுகச் சொல்லாட்சி திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
