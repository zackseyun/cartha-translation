  source_fidelity: 'மூலக் கிரேக்கத்தின் எதிர்நிலையையும் விதிவிலக்குக் கட்டமைப்பையும் மொழிபெயர்ப்பு உண்மையாகக் காக்கிறது: ‘அப்படிப்பட்ட ஒருவர்’ (τοῦ τοιούτου), ‘என்னைக் குறித்து’ (ἐμαυτοῦ உடனான ὑπέρ), மற்றும் பலவீனங்களில் மட்டுமே பெருமை பேசுதல் (εἰ μὴ ἐν ταῖς ἀσθενείαις) ஆகியவை சரியாக வெளிப்படுகின்றன. ‘என்’ என்பது வெளிப்படையாக மூலத்தில் இல்லாவிட்டாலும், சூழலால் நியாயப்படுத்தப்படும் இயல்பான தமிழ் நிரப்பாகும்; குறிப்பு இதைத் தெளிவாகச் சொல்கிறது.'
  naturalness: ‘அப்படிப்பட்ட ஒருவரைக் குறித்து நான் பெருமை பேசுவேன்’ மற்றும் ‘ஆனால் என்னைக் குறித்து நான் பெருமை பேசமாட்டேன்’ ஆகியவை நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளன. விதிவிலக்கை ‘என் பலவீனங்களில் மட்டுமே பெருமை பேசுவேன்’ என்று நேர்மறை வடிவில் அமைத்தது இயல்பானது; பொருளில் மாற்றமில்லை.
  terminology: ‘பெருமை பேசுதல்’ καυχάομαι என்பதற்குப் பொருத்தமான, நடுநிலையான நவீனத் தமிழ் இணையாகும். ‘பலவீனங்கள்’ ἀσθενείαις என்பதன் உடல் வலுவின்மை, துன்பம், இயலாமை போன்ற திறந்த பொருள்வளத்தைத் தேவையற்ற இறையியல் விளக்கமின்றிக் காக்கிறது. அடிக்குறிப்புகள் ὑπέρ-இன் மாற்று நுணுக்கத்தையும், ‘என்’ என்ற சூழல்சார் நிரப்பையும் போதுமானவாறு விளக்குகின்றன.
