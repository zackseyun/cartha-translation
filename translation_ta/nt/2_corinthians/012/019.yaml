reference: 2 Corinthians 12:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: ta
  text: நாங்கள் உங்களிடம் எங்களைத் தற்காத்துப் பேசுகிறோம் என்று இத்தனை காலமும் நினைத்துக்கொண்டிருக்கிறீர்களா? கடவுளுக்கு முன்பாக, மேசியாவில், நாங்கள் பேசுகிறோம். அன்புக்குரியவர்களே, இவை அனைத்தும் உங்களை கட்டியெழுப்புவதற்காகவே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλαι
  choice: இத்தனை காலமும்
  rationale: வாசகர்கள் தொடர்ந்து கொண்டிருந்த எண்ணத்தைக் குறிக்கும் சூழல்சார் வினையடைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தொலைந்த காலத்தை மட்டும் சுட்டுவதில்லை.
- source_word: δοκεῖτε
  choice: நினைத்துக்கொண்டிருக்கிறீர்களா?
  rationale: தற்போதுவரை நீடித்துவரும் எண்ணத்தை வினாவும் கிரேக்க நிகழ்காலத்தின் சூழல்சார் வலிமையைத் தமிழில் தருகிறது.
- source_word: ἀπολογούμεθα
  choice: எங்களுக்காகத் தற்காப்பு வாதம் செய்கிறோம்
  rationale: தன்னிலை விளக்குதல் அல்லது தன்னை நியாயப்படுத்துதல் என்ற சட்டவாத நிழற்பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: κατέναντι θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: கடவுளின் முன்னிலையில், அவருக்குப் பொறுப்புடையவர்களாகப் பேசுதல் என்ற கருத்தைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவுக்குள் இருந்து
  rationale: Χριστός என்பதன் பட்டப்பெயர் பொருளை ‘மேசியா’ எனக் காத்து, ἐν என்பதன் ஒன்றிப்பும் உறவுச் சூழலும் தமிழில் வெறும் கருவிப்பொருளாக மாறாதபடி வெளிப்படுத்துகிறது.
- source_word: λαλοῦμεν
  choice: நாங்கள் பேசுகிறோம்
  rationale: நிகழ்காலச் செயலை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὰ δὲ πάντα
  choice: இவை அனைத்தும்
  rationale: முன்னர் விவாதிக்கப்பட்ட பவுலின் சொற்களும் செயல்களும் முழுவதையும் சூழலோடு சுட்டுகிறது; δέ-யை தமிழில் கட்டாய இணைப்புச்சொல்லால் மிகைப்படுத்தவில்லை.
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்பான விளிப்பையும் ἀγάπη சார்ந்த சொற்பிணைப்பையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: உங்களைக் கட்டியெழுப்புவதற்காகவே
  rationale: ஆவிக்குரிய வளர்ச்சி மற்றும் உறுதிப்படுத்துதல் ஆகியவற்றைக் குறிக்கும் கட்டிட உருவகத்தைப் புரிந்துகொள்ளத்தக்க தமிழில் பாதுகாக்கிறது; ‘வே’ நோக்கத்தின் வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு ἐν Χριστῷ என்ற நிலையான பவுலிய சொற்றொடரிலிருந்தாலும், பட்டப்பெயரின் பொருள் இன்னும் செயல்படுகிறது; ஆகவே பெயர்போன்ற ஒலிபெயர்ப்பை விட ‘மேசியா’ பயன்படுத்தப்பட்டது.
- issue: ἐν Χριστῷ என்பதன் உறவுப் பொருள்
  choice: மேசியாவுக்குள் இருந்து
  alternative: மேசியாவில் / மேசியாவோடு ஒன்றுபட்டு
  rationale: ஒன்றிப்பு, உறவுச் சூழல், பிரதிநிதித்துவம் ஆகியவற்றில் எதையுமே அளவுக்கு மீறித் தீர்மானிக்காமல் ‘in Christ’ என்ற பவுலிய இறையியல் பதற்றத்தை முடிந்தவரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை. கிரேக்கத்தின் மூன்று கருத்து அலகுகளும் தனித்தனி வாக்கியங்களாக வைக்கப்பட்டுள்ளன. ‘கட்டியெழுப்புதல்’ என்ற உருவகம் காக்கப்பட்டுள்ளது; சமயக் குழுவுக்கே உரிய தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
