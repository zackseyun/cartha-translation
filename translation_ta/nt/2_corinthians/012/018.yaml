id: 2CO.12.18
reference: 2 Corinthians 12:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: ta
  text: தீத்துவிடம் செல்லும்படி நான் கேட்டேன்; அந்தச் சகோதரரையும் அவருடன் அனுப்பினேன். தீத்து உங்களைத் தனக்குச் சாதகமாகப் பயன்படுத்திக்கொள்ளவில்லை, அல்லவா? நாங்கள் ஒரே மனப்பான்மையுடன்[a] நடந்தோமல்லவா? ஒரே அடிச்சுவடுகளைப் பின்பற்றினோமல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதே ஆவியால்”; இது தூய ஆவியைக் குறிக்கக்கூடும்.
    reason: τῷ αὐτῷ πνεύματι என்பது உடனடிச் சூழலில் ஒரே மனநிலை அல்லது அணுகுமுறையைக் குறிக்க வாய்ப்புள்ளது; எனினும் ‘ஆவி’ என்பது தூய ஆவியையும் குறிக்கக்கூடியதால் அந்த மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: தீத்துவை நான் கேட்டுக்கொண்டு
  rationale: παρακαλέω இங்கு தீத்துவிடம் ஒரு பணியை மேற்கொள்ளும்படி பவுல் விடுத்த earnest request-ஐக் குறிக்கிறது. மூலத்தில் இல்லாத ‘போகும்படி’ என்பதைச் சேர்க்காமல், இயல்பான தமிழில் கோரிக்கையின் பொருளைத் தருகிறது.
- source_word: συναπέστειλα τὸν ἀδελφόν
  choice: அவருடன் அந்தச் சகோதரரையும் அனுப்பினேன்
  rationale: συναποστέλλω, தீத்துவுடன் மற்றொருவரையும் அனுப்பியதைக் குறிக்கிறது. τὸν ἀδελφόν என்பதில் உடைமைப் பெயர் இல்லாததால் ‘நமது சகோதரர்’ என்று விரிவாக்காமல் ‘அந்தச் சகோதரர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος
  choice: தீத்து உங்களைத் தனக்குச் சாதகமாகப் பயன்படுத்திக்கொள்ளவில்லை, அல்லவா?
  rationale: μήτι எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. πλεονεκτέω என்பது ஒருவரின் இழப்பில் தனக்கு ஆதாயம் தேடுதல் அல்லது அவரைச் சுரண்டுதல் என்ற பரந்த பொருளைக் கொண்டதால், நிதி மோசடி என்ற குறுகிய பொருளுக்குள் அடக்கப்படவில்லை.
- source_word: τῷ αὐτῷ πνεύματι
  choice: ஒரே ஆவியின்படி
  rationale: πνεῦμα இங்கு ஒரே உள்ளார்ந்த மனநிலை அல்லது தூண்டுதலைக் குறிக்கலாம்; அதே வேளையில் தூய ஆவியையும் குறிக்கக்கூடும். ‘ஆவியின்படி’ என்ற சொற்றொடர் இரு சாத்தியங்களையும் முற்றிலும் மூடிவிடாமல் தக்கவைக்கிறது.
- source_word: περιεπατήσαμεν
  choice: நடக்கவில்லையா?
  rationale: περιπατέω என்ற ‘நடத்தையை/வாழ்க்கையை நடத்துதல்’ என்னும் உருவகத்தைத் தமிழிலும் ‘நடத்தல்’ மூலம் தக்கவைக்கிறது.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: ஒரே அடிச்சுவடுகளைப் பின்பற்றவில்லையா?
  rationale: ἴχνος என்பது அடிச்சுவடு அல்லது தடம். நடத்தையில் ஒரே பாதையைப் பின்பற்றுதல் என்ற உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது; மூலத்தில் விடுபட்டுள்ள வினைச்சொல் தமிழில் தெளிவுக்காக நிரப்பப்பட்டுள்ளது.
theological_decisions:
- issue: τῷ αὐτῷ πνεύματι என்பதன் குறிப்பு
  choice: ‘ஒரே ஆவியின்படி’ என்று மொழிபெயர்த்து மனநிலை/உள்ளார்ந்த தூண்டுதல் என்ற வாசிப்பை முன்வைத்தபோதும் தெளிவற்ற தன்மையைத் தக்கவைத்தல்
  alternative: ‘அதே தூய ஆவியால்’ என்று தூய ஆவியை நேரடியாகக் குறிப்பதாக மொழிபெயர்த்தல்; அல்லது ‘ஒரே மனப்பான்மையுடன்’ என்று மனித மனநிலையை மட்டும் குறிப்பதாக மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழல் பவுலும் தீத்துவும் காட்டிய நேர்மையான, ஒருமித்த நடத்தையைப் பற்றியது. எனினும் πνεῦμα தூய ஆவியைக் குறிக்கும் சாத்தியத்தை இலக்கணம் மறுக்கவில்லை. ஆகவே முதன்மை உரை எந்த ஓர் விளக்கத்தையும் முழுமையாகத் தீர்மானிக்கவில்லை; அடிக்குறிப்பு இரு வாசிப்புகளையும் வெளிப்படையாகக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதையும் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் ‘நடத்தல்’ மற்றும் ‘அடிச்சுவடு’ உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. கேள்விகள் எதிர்மறைப் பதிலை எதிர்பார்க்கும் கிரேக்க வாக்கியத் தன்மையை ‘அல்லவா?’ மற்றும் எதிர்மறை வினா வடிவங்கள் மூலம் வெளிப்படுத்துகின்றன.
