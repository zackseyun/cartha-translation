  naturalness: ‘கேட்டுக்கொண்டு’ இங்கு தொடர்ச்சிச் செயலைப் போலவும், ‘தீத்துவை கேட்டுக்கொண்டு’ என்பது இயல்பற்றதாகவும் உள்ளது. ‘தீத்துவிடம் செல்லும்படி நான் கேட்டேன்’ என்பது நவீனத் தரத் தமிழில் தெளிவானது. ‘நடக்கவில்லையா?’ என்பதற்குப் பதிலாக இறந்தகால வினாவான ‘நடந்தோமல்லவா?’ கிரேக்க aorist-க்கும் உரையாடல் நடைக்கும் ஏற்றது.
