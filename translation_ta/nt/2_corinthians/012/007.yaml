reference: 2 Corinthians 12:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: ta
  text: வெளிப்பாடுகளின் அளவுகடந்த மகத்துவத்தின் காரணமாக—நான் என்னை உயர்த்திக்கொள்ளாதபடி—என் மாம்சத்தில் ஒரு முள் எனக்குக் கொடுக்கப்பட்டது[a], அதாவது சாத்தானின் ஒரு தூதன்[b], என்னை அடித்துத் துன்புறுத்துவதற்காக[c], நான் என்னை உயர்த்திக்கொள்ளாதபடி[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் மாம்சத்தில் ஒரு கழு.’ σκόλοψ என்ற கிரேக்கச் சொல் கூர்மையான கழு, சிராய், அல்லது முள் ஆகியவற்றைக் குறிக்கலாம்; இங்குள்ள துல்லியமான படிமம் உறுதியானதல்ல.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சாத்தானின் ஒரு வானதூதன்.’ ἄγγελος என்ற கிரேக்கச் சொல் ‘தூதன்’ என்றும் ‘வானதூதன்’ என்றும் பொருள்படலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘அடித்துத் துன்புறுத்துவதற்காக’ என்பதற்கான கிரேக்க வினை சொல்லளவில் குத்துகளால் அடிப்பதையோ தொடர்ந்து தாக்குவதையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: ‘நான் என்னை உயர்த்திக்கொள்ளாதபடி’ என்ற நோக்கச் சொற்றொடர் கிரேக்க உரையில் இருமுறை வருகிறது; அந்த மறுபடிச் சொல் இங்கும் தக்கவைக்கப்பட்டுள்ளது.
    reason: source_transparency
lexical_decisions:
- source_word: ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: வெளிப்பாடுகளின் அளவுகடந்த மேன்மை
  rationale: ὑπερβολή என்பதன் மிகுதியையும் சிறப்பையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ἀποκαλύψεις என்பதற்கு பவுலின் சூழலில் வழக்கமான ‘வெளிப்பாடுகள்’ பயன்படுத்தப்படுகிறது.
- source_word: ὑπεραίρωμαι
  choice: நான் என்னை உயர்த்திக்கொள்ளாதபடி
  rationale: தன்னை அளவுக்கு மீறி உயர்த்துதல் அல்லது செருக்கடைதல் என்ற பொருளை, மூலத்தின் உருவகத்துக்கும் தன்னிலை நுணுக்கத்துக்கும் நெருக்கமாகக் காக்கிறது. கிரேக்கத்தில் இருமுறை வரும் சொற்றொடர் இருமுறையும் வைக்கப்பட்டுள்ளது.
- source_word: ἐδόθη μοι
  choice: எனக்குக் கொடுக்கப்பட்டது
  rationale: செயப்படுவினை வடிவைத் தக்கவைத்து, கொடுத்தவர் யார் என்பதை மொழிபெயர்ப்பு வெளிப்படையாக நிர்ணயிக்காமல் விடுகிறது.
- source_word: σκόλοψ τῇ σαρκί
  choice: என் மாம்சத்தில் ஒரு முள்
  rationale: σκόλοψ குறிக்கும் கூர்மையான முள் அல்லது கழு போன்ற உருவகத்தின் உறுதியற்ற தன்மையை முதன்மை உரையில் ‘முள்’ காக்கிறது; τῇ σαρκί என்பதற்கு பவுலின் நெறிசார் ‘பாவ இயல்பு’ என்ற பொருளைத் திணிக்காமல் ‘மாம்சத்தில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἄγγελος Σατανᾶ
  choice: சாத்தானின் தூதன்
  rationale: ἄγγελος என்பது தூதன் அல்லது வானதூதன் என இருவகையில் புரியக்கூடியதால், உயிரினத்தின் இயல்பை முடிவுசெய்யாத பரந்த சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: κολαφίζῃ
  choice: அடித்துத் துன்புறுத்தும்படி
  rationale: கையால் அல்லது குத்துகளால் தொடர்ந்து தாக்குதல் என்ற வினையின் தெளிவான படிமத்தையும், அதன் விளைவான துன்பத்தையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
theological_decisions:
- issue: ‘மாம்சத்தில் ஒரு முள்’ என்பதன் இயல்பு
  choice: உருவகத்தை விளக்காமல் அப்படியே தக்கவைத்தல்
  alternative: உடல் நோய், துன்புறுத்தும் எதிரிகள், அல்லது பேய்சார் ஒடுக்குதல் என்று குறிப்பாக்குதல்
  rationale: இந்தத் துன்பம் என்னவென்று கிரேக்க உரை தெளிவாக அடையாளப்படுத்தவில்லை; எனவே எந்த ஒரு விளக்கத்தையும் உரைக்குள் திணிக்கவில்லை.
- issue: ‘எனக்குக் கொடுக்கப்பட்டது’ என்பதில் செயலாற்றியவர்
  choice: செயப்படுவினையாகவே வைத்தல்
  alternative: ‘கடவுள் எனக்குக் கொடுத்தார்’ அல்லது ‘அனுமதிக்கப்பட்டது’
  rationale: இறை அனுமதி உட்குறிக்கப்பட்டிருக்கலாம்; ஆனால் கொடுத்தவர் உரையில் வெளிப்படையாகச் சொல்லப்படாததால் அந்த இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
- issue: ἄγγελος Σατανᾶ என்பதன் அடையாளம்
  choice: சாத்தானின் தூதன்
  alternative: சாத்தானின் வானதூதன் அல்லது சாத்தானின் மனித ஏவலன்
  rationale: இது ஆவிக்குரிய உயிரா மனித முகவரா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மாம்சம்,’ ‘வெளிப்பாடுகள்,’ ‘சாத்தான்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; தெளிவுக்காக நிறுத்தக்குறிகள் பயன்படுத்தப்பட்டாலும், மூலத்தின் மறுபடிச் சொல்லும் இறையியல் தெளிவின்மைகளும் நீக்கப்படவில்லை.
