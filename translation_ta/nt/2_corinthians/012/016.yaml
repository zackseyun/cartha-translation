source:
  edition: SBLGNT
  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: ta
  text: 'ஆனால், அப்படியே இருக்கட்டும்: நான் உங்களுக்குச் சுமையாக இருக்கவில்லை.[a] ஆனால், சூழ்ச்சிக்காரனாய் இருந்து, வஞ்சகத்தால் உங்களைப் பிடித்தேன்.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்படியானால், அவ்வாறே இருக்கட்டும்” அல்லது “எப்படியாயினும்”; வாதத்திற்காக அந்தக் கருத்தை பவுல் ஏற்றுக்கொள்வதுபோல் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: “சூழ்ச்சிக்காரனாய் இருந்து, வஞ்சகத்தால் உங்களைப் பிடித்தேன்” என்பது பவுலின் உண்மையான ஒப்புதல் அல்லாமல், அவர்மேல் சுமத்தப்பட்ட குற்றச்சாட்டை அவர் நையாண்டியாகத் திரும்பச் சொல்வதாக இருக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “சூழ்ச்சியால் உங்களை அகப்படுத்தினேன்” அல்லது “வஞ்சகமாக உங்களைப் பயன்படுத்திக்கொண்டேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: ஆனால், அப்படியே இருக்கட்டும்
  rationale: வாதத்திற்காக ஒரு கருத்தை ஏற்றுக்கொள்ளும் சொல்லாட்சியை இயல்பான தமிழில் தருகிறது; கிரேக்கச் சொற்றொடரின் விட்டுக்கொடுக்கும் தொனியையும் காக்கிறது.
- source_word: κατεβάρησα
  choice: சுமையாக இருக்கவில்லை
  rationale: கொரிந்தியர்மேல் பொருளாதார அல்லது நடைமுறைச் சுமையைச் சுமத்தவில்லை என்ற சூழல்சார் பொருளை இயல்பாகத் தெரிவிக்கிறது; சுமை என்ற உருவகத்தையும் காக்கிறது.
- source_word: ὑπάρχων
  choice: ஆக இருந்து
  rationale: பங்கேற்புவினையின் எளிய சூழ்நிலைத் தொடர்பைக் காக்கிறது; காரணம் அல்லது விட்டுக்கொடுப்பு என்ற நுணுக்கத்தை மொழிபெயர்ப்பில் கட்டாயப்படுத்தவில்லை.
- source_word: πανοῦργος
  choice: தந்திரக்காரன்
  rationale: இச்சூழலில் உள்ள நேர்மையற்ற கூர்மதி என்ற எதிர்மறைத் தொனியை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: δόλῳ
  choice: வஞ்சகத்தால்
  rationale: கருவிப்பொருளில் வரும் தத்திவைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
- source_word: ἔλαβον
  choice: பிடித்தேன்
  rationale: ‘எடுத்தேன்/பெற்றேன்’ என்ற அடிப்படைப் பொருளைக் காட்டிலும் இச்சூழலில் சூழ்ச்சியால் ஒருவரை அகப்படுத்துதல் என்ற பொருள் பொருத்தமானது; ‘ஆதாயம் அடைந்தேன்’ என்று மிகையாக விளக்குவதையும் தவிர்க்கிறது.
theological_decisions:
- issue: ἀλλὰ என்பதற்குப் பிந்தைய சொற்கள் பவுலின் உண்மையான ஒப்புதலா, அல்லது அவர்மேல் சுமத்தப்பட்ட குற்றச்சாட்டை அவர் நையாண்டியாகத் திரும்பச் சொல்வதா?
  choice: முதன்மை உரையில் கூற்றை நேரடியாகவே மொழிபெயர்த்து, நையாண்டியான குற்றச்சாட்டு என்ற சாத்தியத்தை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ‘தந்திரக்காரனான நான் உங்களைச் சூழ்ச்சியால் ஏமாற்றியதாகச் சொல்கிறீர்கள்’ என்று நையாண்டியை வெளிப்படையாகப் பரிமாற்றுதல்.
  rationale: பரந்த சூழலில் பவுல் தாம் அவர்களைச் சுரண்டவில்லை என்று மறுக்கிறார். எனினும் கிரேக்க வாக்கியம் இங்கு குற்றச்சாட்டை வெளிப்படையாக மேற்கோள் குறியிடவில்லை. ஆகவே முதன்மை உரை அதன் பதற்றத்தையும் இருபொருள் வாய்ப்பையும் காக்கிறது; அடிக்குறிப்பு சூழல்சார் நையாண்டியைச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சுமை’, ‘தந்திரக்காரன்’, ‘வஞ்சகம்’ ஆகிய சொற்கள் சாதாரண வாசகர்களுக்குப் புரியும் வகையில் உள்ளன; அதேவேளை பவுலின் கூர்மையான நையாண்டி முதன்மை உரையில் விளக்கிப் போக்கப்படாமல் காக்கப்பட்டுள்ளது.
