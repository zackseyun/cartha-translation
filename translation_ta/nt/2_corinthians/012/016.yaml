  source_fidelity: 'மையப் பொருள் சரியாக உள்ளது: ἔστω δέ-யின் வாதத்திற்காக ஏற்றுக்கொள்ளும் தொனி, κατεβάρησα-வின் ‘சுமை’ உருவகம், மற்றும் பவுல் எதிரொலிக்கும் குற்றச்சாட்டின் கூர்மையான தொனி ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘தந்திரக்காரனாக இருந்து’ என்பது இங்கு பங்கேற்புவினைக்குச் சற்றே கனமாகவும் இயல்பற்றதாகவும் உள்ளது; ‘சூழ்ச்சிக்காரனாய் இருந்து’ எதிர்மறையான πανοῦργος-ன் நுணுக்கத்தைத் துல்லியமாகத் தருகிறது.'
  naturalness: ‘சுமையாக இருக்கவில்லை’ இயல்பானது. ‘சூழ்ச்சிக்காரனாய் இருந்து’ என்பது நவீன நிலையான தமிழில் ‘தந்திரக்காரனாக இருந்து’ என்பதைக் காட்டிலும் செறிவாகவும் வசனத் தொடருக்கு இயல்பாகவும் அமைகிறது. ‘உங்களைப் பிடித்தேன்’ என்பதன் நோக்கமுள்ள கடுமை, பின்வரும் ‘வஞ்சகத்தால்’ என்பதால் தெளிவாகிறது; அதை ‘பயன்படுத்திக்கொண்டேன்’ என முதன்மை உரையில் மாற்றுவது அளவுக்கு மீறிய விளக்கமாகிவிடும்.
  terminology: πανοῦργος என்பதற்கு ‘சூழ்ச்சிக்காரன்’ பொருத்தமான எதிர்மறைச் சொல்லாகும். δόλῳ என்பதற்கு ‘வஞ்சகத்தால்’ துல்லியமானது. அடிக்குறிப்பு மாற்றுகளில் ‘அகப்படுத்தினேன்’ மற்றும் ‘பயன்படுத்திக்கொண்டேன்’ முறையே ‘caught/tricked’ மற்றும் விளக்கமான ‘took advantage’ என்ற சாத்தியங்களைத் தெளிவாகக் காக்கின்றன.
  issues:
