  rationale: முதன்மை உரையின் பொருளை மாற்றாமல், இயல்பற்ற ‘தந்திரக்காரனாக’ என்பதற்குப் பதிலாக πανοῦργος-ன் எதிர்மறையான, குற்றச்சாட்டுத் தொனியை நன்றாக வெளிப்படுத்தும் ‘சூழ்ச்சிக்காரனாய்’ பயன்படுத்தப்பட்டுள்ளது. ἀλλά-வின் எதிர்நிலைத் தொடரும், பவுலின் நையாண்டியை முதன்மை உரையில் தீர்மானித்து விளக்காமல் அடிக்குறிப்பில் மட்டும் சுட்டும் முறையும் காக்கப்பட்டுள்ளன. அனைத்து அடிக்குறிப்பு அடையாளங்களும் உரையில் உள்ளன.
