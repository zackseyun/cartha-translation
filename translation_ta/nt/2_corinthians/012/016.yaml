- from: 'ஆனால், அப்படியே இருக்கட்டும்: நான் உங்களுக்குச் சுமையாக இருக்கவில்லை.[a] இருந்தாலும், தந்திரக்காரனாக இருந்து, வஞ்சகத்தால் உங்களைப் பிடித்தேன்.[b][c]'
