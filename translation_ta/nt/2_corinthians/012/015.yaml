reference: 2 Corinthians 12:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: ta
  text: நான் மிகுந்த மகிழ்ச்சியுடன் உங்கள் உயிர்களுக்காக[a] செலவிடுவேன்; நானே செலவழிக்கப்படுவேன். நான் உங்களை மேலும் அதிகமாக அன்புகூர்ந்தால், குறைவாக அன்புகூரப்படுகிறேனா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் வாழ்வுக்காக” அல்லது “உங்களுக்காகவே.”
    reason: ψυχή இச்சூழலில் ‘உயிர்,’ ‘வாழ்வு,’ அல்லது முழு நபர் என்ற பொருள்களைக் குறிக்கலாம்.
lexical_decisions:
- source_word: ἥδιστα
  choice: மிகவும் மகிழ்ச்சியோடு
  rationale: வெறும் சம்மதத்தை அல்ல, பவுலின் ஆழ்ந்த மகிழ்ச்சியையும் ஆர்வமுள்ள மனவிருப்பத்தையும் வெளிப்படுத்தும் உயர்நிலை வினையடையின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: δαπανήσω
  choice: செலவிடுவேன்
  rationale: வளங்களைச் செலவிடுதல் என்ற அடிப்படை உருவகத்தைக் காக்கிறது; அடுத்து வரும் ἐκδαπανηθήσομαι என்பதுடனான சொல் இணைப்பையும் தெளிவாக்குகிறது.
- source_word: ἐκδαπανηθήσομαι
  choice: நானே முழுமையாகச் செலவிடப்படவும் செய்வேன்
  rationale: தன்னிடமுள்ளவற்றை மட்டுமல்ல, தன்னையே முற்றிலும் அர்ப்பணிக்கும் தீவிரத்தைப் passive வடிவத்தோடும் செலவிடுதல் உருவகத்தோடும் காக்கிறது.
- source_word: ὑπὲρ
  choice: உங்களுக்காக
  rationale: இச்சூழலில் நன்மை அல்லது ஒருவரின் பொருட்டு செய்யப்படுவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: உங்கள் உயிர்களுக்காக
  rationale: ψυχή என்பதன் உயிர், வாழ்வு, ஆள் ஆகிய பொருள் பரப்பைத் தமிழில் ஓரளவு திறந்தவாறு வைத்திருக்கிறது; தொழில்நுட்பமான மனித இயல்பியல் கருத்தைத் திணிப்பதையும் தவிர்க்கிறது.
- source_word: εἰ
  choice: என்றால்
  rationale: கிரேக்கத்தின் நிபந்தனை வடிவத்தையும் அதைத் தொடர்ந்து வரும் வினாவுக்குரிய சொல்லாட்சியையும் தீர்மானித்து விடாமல் காக்கிறது.
- source_word: περισσοτέρως
  choice: மிகுதியாக
  rationale: வெறும் ‘அதிகமாக’ என்பதைக் காட்டிலும் உயர்ந்த அளவு அல்லது பெருக்கத்தைச் சுருக்கமான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀγαπῶν
  choice: நான் ... அன்புகூர்ந்தால்
  rationale: கிரேக்கத்தில் பங்கேற்புவினையாக இருந்தாலும், நிபந்தனை வாக்கியத்தில் தமிழுக்கு இயல்பான வரையறை வினை வடிவமாக்கப்பட்டு அதன் பொருள் காக்கப்படுகிறது.
- source_word: ἧσσον
  choice: குறைவாக
  rationale: περισσοτέρως என்பதற்கு எதிராக நிற்கும் ஒப்பீட்டு அளவை நேரடியாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἀγαπῶμαι
  choice: அன்புகூரப்படுகிறேனா
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் பவுலின் சொல்லாட்சியான வருத்த வினாவையும் காக்கிறது.
theological_decisions:
- issue: மேய்ப்புப் பராமரிப்புச் சூழலில் ψυχαί என்பதன் பொருள்
  choice: உங்கள் உயிர்கள்
  alternative: உங்கள் வாழ்வு; நீங்களே
  rationale: இங்கு ψυχή என்பது பிரிக்கக்கூடிய ‘ஆத்துமா’ குறித்த தொழில்நுட்பக் கோட்பாட்டை அவசியமாகக் குறிக்காது. ‘உயிர்கள்’ என்பது பவுலின் ஆழ்ந்த தனிப்பட்ட அக்கறையைத் தக்கவைத்தபடி, வாழ்வு அல்லது முழு நபர் என்ற உண்மையான பொருள் வாய்ப்புகளையும் திறந்தவாறு வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. ‘செலவிடுவேன் / செலவிடப்படுவேன்’ என்ற நோக்கமுள்ள மீளுரைத்தல், மூலத்தின் செலவு உருவகத்தையும் அதன் தீவிரப்படுத்தலையும் காக்கிறது.
