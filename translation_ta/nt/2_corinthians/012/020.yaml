id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: ta
  text: ஏனெனில், நான் வரும்போது, நான் விரும்புகிறவாறு இல்லாதவர்களாக உங்களைக் காண்பேனோ, நீங்கள் விரும்பாதவனாக நான் உங்களுக்குக் காணப்படுவேனோ, ஒருவேளை பூசல், பொறாமை, கோப வெடிப்புகள், சுயநலப் போட்டிகள், அவதூறுப் பேச்சுகள், கிசுகிசுப் பேச்சுகள்[a], இறுமாப்பு, ஒழுங்கின்மை ஆகியவை இருக்குமோ என்று அஞ்சுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புறங்கூறல்கள்.”
    reason: ψιθυρισμοί என்பது கிசுகிசுத்துப் பேசுதலையும், பிறரைப் பற்றிய மறைவான தீங்கான பேச்சையும் குறிக்கலாம்.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: அஞ்சுகிறேன்
  rationale: நிகழ்கால வினைச்சொல் பவுலின் தொடரும் அச்சத்தையும் கவலையையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: μή πως
  choice: ஒருவேளை ... இருக்குமோ என்றும்
  rationale: அஞ்சப்படும் சாத்தியத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வசனத்தில் இருமுறை வரும் கருத்தும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: ἐλθὼν
  choice: நான் வரும்போது
  rationale: இச்சூழலில் காலத்தைக் குறிக்கும் பங்கேற்பு வினையின் பொருளை இயல்பாகத் தருகிறது.
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: நான் விரும்புகிறபடி நீங்கள் இல்லாதிருக்கக் காண்பேனோ
  rationale: கொரிந்தியரின் நிலை அல்லது நடத்தையைத் தான் எதிர்பார்ப்பதற்கு மாறாகக் காணக்கூடும் என்ற பவுலின் அச்சத்தைப் பாதுகாக்கிறது.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: நீங்கள் விரும்பாதபடி நான் உங்களால் காணப்படுவேனோ
  rationale: முந்தைய கூறுடன் உள்ள பரஸ்பர அமைப்பையும் மூலத்தின் செயப்பாட்டு வடிவத்தையும் பாதுகாக்கிறது; பவுல் எவ்விதமாக இருப்பார் என்பதை மேலதிகமாக விளக்கவில்லை.
- source_word: ἔρις
  choice: பூசல்
  rationale: சமூகத்துக்குள் நிலவும் சண்டை, முரண்பாடு ஆகியவற்றை உள்ளடக்கும் சுருக்கமான, கண்ணியமான சொல்.
- source_word: ζῆλος
  choice: பொறாமை
  rationale: இத்தீய குணங்களின் பட்டியலில் நேர்மறையான ஆர்வத்தை அல்ல, உறவுகளைச் சிதைக்கும் பொறாமையைச் சுட்டுகிறது.
- source_word: θυμοί
  choice: கோப வெடிப்புகள்
  rationale: பன்மை வடிவம் மீண்டும் மீண்டும் திடீரென வெளிப்படும் கோப நிகழ்வுகளைச் சுட்டுவதால், வெறும் ‘கோபம்’ என்பதைவிட இத்தேர்வு நுணுக்கமானது.
- source_word: ἐριθεῖαι
  choice: சுயநலப் போட்டிகள்
  rationale: தன் நலனை முன்னிறுத்தும் போட்டி மற்றும் பிரிவினை மனப்பான்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: καταλαλιαί
  choice: அவதூறுப் பேச்சுகள்
  rationale: பிறரை இழிவுபடுத்தும் அல்லது அவர்களுக்கு எதிராகத் தீங்காகப் பேசும் கருத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ψιθυρισμοί
  choice: கிசுகிசுப் பேச்சுகள்
  rationale: மறைவாக அல்லது காதோடு காதாகப் பேசப்படும் தீங்கான பேச்சைக் குறிக்கிறது; சொல்லின் இரகசியமான பேச்சு நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: φυσιώσεις
  choice: இறுமாப்பு
  rationale: தன்னைப் பெரிதாக எண்ணும் வீங்கிய மனநிலையை இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: ἀκαταστασίαι
  choice: ஒழுங்கின்மை
  rationale: சமூகக் குழப்பம் மற்றும் கட்டுப்பாடின்மையை உள்ளடக்கும் பரந்த பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பவுல் அஞ்சும் சந்திப்பின் தன்மை
  choice: பவுல் தாமும் கொரிந்தியரும் ஒருவரையொருவர் விரும்பாத நிலையில் காணக்கூடும் என்றும், சமூகத் தீமைகள் நிலவக்கூடும் என்றும் அஞ்சுகிறார்.
  alternative: அவர் அப்போஸ்தல அதிகாரத்துடன் கடுமையாகத் தண்டிக்க வேண்டியிருப்பதையே முதன்மையாக அஞ்சுகிறார்.
  rationale: வசனம் பரஸ்பர ஏமாற்றத்தையும் சமூகப் பாவங்களின் பட்டியலையும் மட்டுமே வெளிப்படையாகக் கூறுகிறது. பவுலின் எதிர்பாராத தோற்றம் அல்லது நடவடிக்கை என்னவாக இருக்கும் என்பதை மொழிபெயர்ப்பு தீர்மானித்து சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. முதல் வாக்கியத்தில் மூலத்தின் பரஸ்பர ‘காணுதல்/காணப்படுதல்’ அமைப்பு பாதுகாக்கப்பட்டுள்ளது; பட்டியலில் தெளிவுக்காக ‘உங்களிடையே’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
