source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: ta
  text: நான் மீண்டும் வரும்போது, என் கடவுள் உங்கள் முன் என்னைத் தாழ்த்திவிடுவாரோ என்றும், முன்பே பாவம் செய்து, அவர்கள் செய்த அசுத்தம், பாலியல் ஒழுக்கக்கேடு, வெட்கங்கெட்ட நடத்தை ஆகியவற்றைவிட்டு மனம் திரும்பாத பலரைக் குறித்து நான் துக்கப்பட நேரிடுமோ என்றும் அஞ்சுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் முன்” என்பதை “உங்களிடையே” என்றும், “என்னைத் தாழ்த்திவிடுவார்” என்பதை “என்னை அவமானப்படுத்துவார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: நான் மீண்டும் வரும்போது ... அஞ்சுகிறேன்
  rationale: இது முந்தைய வசனத்திலுள்ள அச்சத்தின் தொடர்ச்சி. தமிழில் பொருள் தெளிவாக இருக்க, மறைந்துள்ள ‘அஞ்சுகிறேன்’ வாக்கியத்தின் முடிவில் வெளிப்படுத்தப்பட்டது; πάλιν என்பது மீண்டும் வருவதைக் குறிக்கிறது.
- source_word: ταπεινώσῃ με ὁ θεός μου πρὸς ὑμᾶς
  choice: என் கடவுள் உங்கள் முன் என்னைத் தாழ்த்திவிடுவாரோ
  rationale: ταπεινόω என்பதன் ‘தாழ்த்துதல்/தாழ்ந்த நிலைக்குக் கொண்டுவருதல்’ என்ற பொருள் பாதுகாக்கப்படுகிறது. πρὸς ὑμᾶς இங்கு கொரிந்தியரின் முன்னிலையில் அல்லது அவர்களிடையே நிகழ்வதைக் குறிக்கக்கூடும்.
- source_word: πενθήσω
  choice: நான் துக்கப்பட நேரிடுமோ
  rationale: πενθέω ஆழ்ந்த துயரம் அல்லது புலம்பலைக் குறிக்கிறது. அச்ச வாக்கியத்தின் இணையான இரண்டாம் கூறாக இருப்பதால் ‘நேரிடுமோ’ இயல்பான தமிழைத் தருகிறது.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: முன்பே பாவம் செய்த ... பலரை
  rationale: προημαρτηκότων முந்தைய பாவச்செயலையும் அதன் தற்போதைய பொருத்தத்தையும் சுட்டுகிறது; ‘முன்பே பாவம் செய்த’ இதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μὴ μετανοησάντων
  choice: மனம் திரும்பாத
  rationale: μετανοέω என்பது எண்ணமும் வாழ்வின் திசையும் மாறுவதைச் சுட்டுகிறது. இவர்கள் இன்னும் மனம் திரும்பாதவர்களாக இருப்பதைத் தமிழ் வடிவம் தெரிவிக்கிறது.
- source_word: ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ
  choice: அசுத்தம், பாலியல் ஒழுக்கக்கேடு, வெட்கங்கெட்ட நடத்தை ஆகியவற்றைவிட்டு
  rationale: மனம் திரும்புதல் தொடர்பில் ἐπί மனந்திரும்ப வேண்டிய காரியங்களைச் சுட்டுகிறது. மூன்று வேறுபட்டாலும் ஒன்றோடொன்று தொடர்புடைய தீய நடத்தைகள் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: ἀκαθαρσίᾳ
  choice: அசுத்தம்
  rationale: அறநெறி சார்ந்த தூய்மையின்மையைக் குறிக்கும் பரந்த சொல்லாக உள்ளது; சூழலில் பாலியல் நிறமும் இருக்கலாம், ஆனால் அதற்குள் மட்டும் சுருக்கப்படவில்லை.
- source_word: πορνείᾳ
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: πορνεία குறிக்கும் பாலியல் அறக்கேட்டைப் புரிந்துகொள்ளத்தக்க நவீன தமிழில் தெரிவிக்கிறது; ஒரு குறிப்பிட்ட வகைச் செயலுக்குள் சொல்லைச் சுருக்கவில்லை.
- source_word: ἀσελγείᾳ
  choice: வெட்கங்கெட்ட நடத்தை
  rationale: ἀσέλγεια வெட்கமின்றி கட்டுப்பாடற்று நடப்பதைக் குறிக்கிறது; சூழலில் பாலியல் தொடர்பு வலுவாக இருந்தாலும் சொல்லின் பரந்த நடத்தைக் கூறு பாதுகாக்கப்படுகிறது.
- source_word: ᾗ ἔπραξαν
  choice: தாங்கள் செய்த
  rationale: உறவுப்பெயர் முன் சொல்லப்பட்ட மூன்று தீய நடத்தைகளையும் கூட்டாகக் குறிக்கிறது. πράσσω நடைமுறையில் செய்த நடத்தையைச் சுட்டுகிறது.
theological_decisions:
- issue: முந்தைய வசனத்திலிருந்து தொடரும் μή கூறின் வாக்கிய வலிமை
  choice: இரண்டு அச்சங்களையும் இணைத்து, வாக்கிய முடிவில் ‘அஞ்சுகிறேன்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘நான் மீண்டும் வரும்போது என் கடவுள்... தாழ்த்தாதபடிக்கும், நான்... துக்கப்படாதபடிக்கும்’
  rationale: கிரேக்கம் 12:20-இல் உள்ள φοβοῦμαι என்பதன் ஆட்சிக்குள் தொடர்கிறது. தமிழில் தனி வசனமாக வாசிக்கும்போதும் புரியுமாறு அச்சம் வெளிப்படுத்தப்படுகிறது; இது கோட்பாட்டுச் சேர்க்கை அல்ல.
- issue: ταπεινόω என்பதின் இச்சூழல் பொருள்
  choice: தாழ்த்திவிடுவார்
  alternative: அவமானப்படுத்துவார்
  rationale: தேவன் பவுலைத் தாழ்ந்த அல்லது வேதனையான நிலைக்குக் கொண்டுவரும் கருத்தை முன்னிலைப்படுத்துகிறது; பொதுவில் அவமானப்படுத்துதல் என்ற சாத்திய நுண்ணுணர்வை கட்டாயப்படுத்தவில்லை.
- issue: மூன்று அறக்கேட்டுச் சொற்களின் வேறுபாடு
  choice: ‘அசுத்தம், பாலியல் ஒழுக்கக்கேடு, வெட்கங்கெட்ட நடத்தை’ என்று தனித்தனியாக வைத்தல்
  alternative: அவற்றை ஒரே பொதுவான பாலியல் பாவச் சொல்லில் ஒன்றிணைத்தல்
  rationale: கிரேக்கப் பட்டியலிலுள்ள தொடர்புடைய ஆனால் வேறுபட்ட மூன்று சொற்களும் பாதுகாக்கப்படுகின்றன; எந்த ஒரு திருச்சபை மரபின் குறுகிய வரையறையும் இறக்குமதி செய்யப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மனம் திரும்புதல்’ வேதாகமப் பயன்பாட்டில் இயல்பானதாகவும் தெளிவானதாகவும் உள்ளது. வசனத்தின் நீண்ட கிரேக்க வாக்கிய அமைப்பு தமிழில் இரண்டு இணையான அச்சக் கூறுகளாகத் தக்கவைக்கப்பட்டது; குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
