id: 2CO.12.1
reference: 2 Corinthians 12:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: ta
  text: பெருமை பேசுவது அவசியம்; அது பயனளிப்பதில்லை என்றாலும், ஆண்டவரின் தரிசனங்களையும் வெளிப்பாடுகளையும் பற்றி தொடர்ந்து பேசுவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆண்டவரிடமிருந்து வந்த தரிசனங்களையும் வெளிப்பாடுகளையும்’ என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தின் உடைமை உருபு அமைப்பு இந்த உறவைத் திட்டவட்டமாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: பெருமை பேசுவது
  rationale: நிகழ்கால இடைநிலை வினையெச்சம் இங்கு பெயர்ச்சொல் போலச் செயல்படுகிறது. ‘பெருமை பேசுவது’ என்பது தற்புகழ்ச்சியைக் குறிக்கும் கிரேக்க வினையின் கருத்தை இயல்பான நவீனத் தமிழில் தருகிறது; யாரைக் குறித்து பெருமை பேசப்படுகிறது என்பதை மூலத்தைவிடத் தெளிவுபடுத்தவில்லை.
- source_word: δεῖ
  choice: அவசியமாகிறது
  rationale: கட்டாயம் அல்லது தவிர்க்க முடியாத தேவையைத் தெரிவிக்கிறது. சூழலில் பவுலின் தயக்கத்தையும் தொடர வேண்டிய நிலைமையையும் இயல்பாக வெளிப்படுத்த ‘அவசியமாகிறது’ பயன்படுத்தப்பட்டது.
- source_word: οὐ συμφέρον μέν
  choice: அது பயனளிப்பதில்லை என்றாலும்
  rationale: συμφέρον என்பது பயனுள்ளதையோ நன்மை தருவதையோ குறிக்கிறது. μέν தொடங்கும் விட்டுக்கொடுக்கும் எதிர்மறை அமைப்பை ‘என்றாலும்’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: ἐλεύσομαι δὲ εἰς
  choice: இப்போது … பற்றிப் பேசப்போகிறேன்
  rationale: இச்சூழலில் அடுத்த பொருளுக்குச் செல்லும் உரையாடல் நகர்வைச் சுட்டுகிறது. சொற்சொல்லான ‘வருவேன்’ தமிழில் இயல்பற்றதால், கருத்து மாறுதலை ‘இப்போது … பற்றிப் பேசப்போகிறேன்’ என வழங்குகிறது; δέ குறிக்கும் நகர்வு வாக்கிய அமைப்பில் வெளிப்படுகிறது.
- source_word: ὀπτασίας
  choice: தரிசனங்கள்
  rationale: இயற்கைக்கு அப்பாற்பட்ட காட்சி அனுபவங்களைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: ἀποκαλύψεις
  choice: வெளிப்பாடுகள்
  rationale: மறைந்திருந்தது வெளிப்படுத்தப்படுதல் அல்லது இறை வெளிப்படுத்துதலைக் குறிக்கும் நிலைபெற்ற தமிழ் இணைச்சொல்; பன்மையும் காக்கப்பட்டுள்ளது.
- source_word: κυρίου
  choice: ஆண்டவரின்
  rationale: கிரேக்க உருபுத்தொடரின் சுருக்கத்தையும் அதன் உறவுசார் தெளிவின்மையையும் ஓரளவு காக்கிறது. ‘ஆண்டவரிடமிருந்து வந்த’ என மூலத்திலேயே இல்லாத வகையில் மூலாதார உறவைத் திட்டவட்டமாக்கவில்லை.
theological_decisions:
- issue: κυρίου என்பதற்கும் ‘தரிசனங்கள் மற்றும் வெளிப்பாடுகள்’ என்பவற்றுக்கும் உள்ள உறவு
  choice: ஆண்டவரின்
  alternative: ஆண்டவரிடமிருந்து வந்த
  rationale: கிரேக்க உருபு உடைமை, தொடர்பு அல்லது மூலாதாரம் ஆகிய உறவுகளைச் சுட்டக்கூடும். ‘ஆண்டவரின்’ என்பது அந்தத் திறந்த தன்மையை அதிகம் காக்கிறது; மூலாதாரம் என்ற புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. சொற்சொல்லான ஆனால் தமிழில் இயல்பற்ற ‘தரிசனங்களுக்கு வருவேன்’ என்பதற்குப் பதிலாக உரையாடலின் பொருள் மாறுதலைத் தெளிவாகக் காட்டும் ‘பற்றிப் பேசப்போகிறேன்’ பயன்படுத்தப்பட்டது. மூலத்தில் இல்லாத ‘என்னைப் பற்றி’ போன்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டன.
