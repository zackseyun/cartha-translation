revisions:
- from: ஓர் அப்போஸ்தலருக்குரிய அடையாளங்கள் உண்மையாகவே[a] உங்களிடையே முழு மனவுறுதியோடு செயலாக்கப்பட்டன—அடையாளங்களாலும் அதிசயங்களாலும் வல்ல செயல்களாலும்[b].
  to: ஓர் அப்போஸ்தலருக்குரிய அடையாளங்கள்[a] உங்களிடையே முழு சகிப்புத்தன்மையுடனும் நிகழ்த்தப்பட்டன; அடையாளங்களாலும் அதிசயங்களாலும் வல்லமைகளாலும்[b].
  rationale: The revision replaces an unnatural technical passive with idiomatic Tamil, renders ὑπομονή as endurance rather than mere determination, and uses ‘வல்லமைகள்’ to preserve the lexical breadth of δυνάμεις. It keeps the generic ‘an apostle’ reading while preserving the Paul-specific alternative in a correctly placed footnote. The punctuation avoids implying a stronger explanatory relation than the Greek requires.
  reviewer_model: gpt-5.6-terra
