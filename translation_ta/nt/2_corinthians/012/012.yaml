source:
  edition: SBLGNT
  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: ta
  text: ஓர் அப்போஸ்தலருக்குரிய அடையாளங்கள்[a] உங்களிடையே முழு சகிப்புத்தன்மையுடனும் நிகழ்த்தப்பட்டன; அடையாளங்களாலும் அதிசயங்களாலும் வல்லமைகளாலும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பவுலைத் தனிப்பட்ட முறையில் குறிப்பதாக எடுத்துக்கொண்டால், “அந்த அப்போஸ்தலருக்குரிய அடையாளங்கள்.”
    reason: alternative_reading
  - marker: b
    text: “வல்லமைகள்” என்பதை “அற்புதச் செயல்கள்” அல்லது “வல்ல செயல்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் வல்லமையை வெளிப்படுத்தும் செயல்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: அடையாளங்கள் உண்மையாகவே
  rationale: μέν-இன் உறுதிப்படுத்தும் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் ‘உண்மையாகவே’ வெளிப்படுத்துகிறது; σημεῖα என்பதற்கு ‘அடையாளங்கள்’ எனத் தொடர்ச்சியாக மொழிபெயர்க்கப்படுகிறது.
- source_word: τοῦ ἀποστόλου
  choice: ஓர் அப்போஸ்தலருக்குரிய
  rationale: இது பொதுவாக அப்போஸ்தலரை அடையாளப்படுத்தும் சான்றுகள் என்ற பண்புசார் பொருளை இயல்பாகத் தருகிறது; குறிப்பாக பவுலை மட்டும் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κατειργάσθη
  choice: செயலாக்கப்பட்டன
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும், இவை நிகழ்த்தப்பட்டு விளைவிக்கப்பட்டன என்ற பொருளையும் காக்கிறது; செயலாற்றியவர் யார் என்பதை மொழிபெயர்ப்பு கூடுதலாக நிர்ணயிக்கவில்லை.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: கொரிந்தியச் சமூகத்தின் நடுவில் நிகழ்ந்த செயலைக் குறிக்கும் சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: முழு மனவுறுதியோடு
  rationale: ὑπομονή குறிக்கும் துன்பத்தின்கீழும் நிலைத்திருக்கும் சகிப்புத் தன்மையை, சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழில் தருகிறது.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: அடையாளங்களாலும் அதிசயங்களாலும் வல்ல செயல்களாலும்
  rationale: மூன்று கிரேக்கச் சொற்களின் தனித்துவத்தைத் தக்கவைத்து, இவை முன்னுள்ள ‘அடையாளங்கள்’ என்பதற்கான வெளிப்பாடுகள் அல்லது வழிமுறைகள் என்பதை ‘-ஆலும்’ வடிவம் காட்டுகிறது.
theological_decisions:
- issue: ‘ஓர் அப்போஸ்தலருக்குரிய அடையாளங்கள்’ என்பதன் பொருள்
  choice: அப்போஸ்தலப் பணியை மெய்ப்பிக்கும் சான்றுகள் அல்லது தன்மைகள்; இவ்வசனத்தில் மனவுறுதியும் அற்புதச் செயல்களும் அவற்றோடு தொடர்புபடுத்தப்படுகின்றன.
  alternative: அற்புதங்கள் மட்டுமே அப்போஸ்தலத்துவத்தை வரையறுக்கும் அடையாளங்கள்; அல்லது ‘அந்த அப்போஸ்தலரின் அடையாளங்கள்’ என்பது பவுலை மட்டும் குறிப்பது.
  rationale: முதன்மைச் சொற்றொடரைத் தொடர்ந்து மனவுறுதியும் அற்புத நிகழ்வுகளும் வருகின்றன. அவற்றுக்கிடையேயான துல்லியமான தர்க்க உறவை அளவுக்கு மீறி முடிவுசெய்யாமல் மொழிபெயர்ப்பு பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அப்போஸ்தலர்’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்பட்ட சொல். கிரேக்கத்தின் செயப்பாட்டு அமைப்பும் மும்மைச் சொற்றொடரும் இயன்றவரை காக்கப்பட்டுள்ளன.
