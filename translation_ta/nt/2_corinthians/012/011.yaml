id: 2CO.12.11
reference: 2 Corinthians 12:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: ta
  text: நான் மூடனாகிவிட்டேன்; நீங்கள்தான் என்னை அதற்குக் கட்டாயப்படுத்தினீர்கள். ஏனெனில், நீங்கள்தான் என்னைப் பாராட்டியிருக்க வேண்டும். ஏனெனில், நான் ஒன்றுமில்லாதவனாக இருந்தாலும், அந்த மிகப் பெரிய அப்போஸ்தலர்களைவிட[a] எதிலும் பின்தங்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மிகச் சிறந்த அப்போஸ்தலர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர் மிகவும் வலியுறுத்தப்பட்டதாகும்; இச்சூழலில் அது நையாண்டியாகவும் இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα
  choice: ஆகிவிட்டேன்
  rationale: நிகழ்ந்து முடிந்த ஒன்றின் தற்போதைய விளைவை உணர்த்தும் நிறைவேற்றுக் காலத்தின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἄφρων
  choice: மூடன்
  rationale: பவுலின் தன்னைக் குறித்த நையாண்டியான வருணனையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: நீங்கள்தான் என்னை அதற்குக் கட்டாயப்படுத்தினீர்கள்
  rationale: வலியுறுத்தப்பட்ட ὑμεῖς என்பதை ‘நீங்கள்தான்’ எனத் தக்கவைத்து, சூழலில் குறிக்கப்பட்டுள்ள மூடத்தனமான பெருமைப்பேச்சை ‘அதற்கு’ என்று சுருக்கமாகச் சுட்டுகிறது.
- source_word: ὑφ’ ὑμῶν συνίστασθαι
  choice: என்னைப் பாராட்டியிருக்க வேண்டியவர்கள் நீங்களே
  rationale: கொரிந்தியர்கள் பவுலுக்கு ஆதரவாக நற்சான்று கூறியிருக்க வேண்டும் என்ற செயப்பாட்டு பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐδὲν ... ὑστέρησα
  choice: எதிலும் குறைந்தவனாக இருக்கவில்லை
  rationale: ஒப்பீட்டில் பின்தங்குதல் அல்லது தாழ்ந்திருத்தல் என்ற கிரேக்கச் சொல்லின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: அந்த மிகப் பெரிய அப்போஸ்தலர்கள்
  rationale: ὑπερλίαν என்பதன் மிக வலுவான உயர்த்திப் பேசும் தன்மையைத் தக்கவைக்கிறது; அதேவேளை, இது நேர்மையான பாராட்டா நையாண்டியா என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: நான் ஒன்றுமில்லாதவனாக இருந்தாலும்
  rationale: பவுலின் தன்னடக்கமான விட்டுக்கொடுப்பையும் concessive அமைப்பையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλων என்பதன் தொனி
  choice: ‘அந்த மிகப் பெரிய அப்போஸ்தலர்கள்’ என்று மொழிபெயர்த்து, சாத்தியமான நையாண்டியை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல் விடுதல்
  alternative: ‘மிகச் சிறந்த அப்போஸ்தலர்கள்’ என்ற நேர்மையான குறிப்பு அல்லது ‘தங்களைப் பெரிய அப்போஸ்தலர்கள் என்று சொல்லிக்கொள்கிறவர்கள்’ என்ற வெளிப்படையான நையாண்டி
  rationale: சூழல் நையாண்டியைக் காட்டக்கூடும்; ஆனால் கிரேக்கத் தொடர் தானாகவே ‘என்று சொல்லிக்கொள்கிற’ போன்ற விளக்கத்தைச் சொல்லவில்லை. எனவே சொல்லின் மிகைப்பைத் தக்கவைத்து, இறையியல் மற்றும் சொல்லாட்சித் தளர்வை வாசகருக்காகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலர்கள்’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
