source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: ta
  text: ஏனெனில், நான் பெருமைபாராட்ட விரும்பினால், மூடனாக இருக்கமாட்டேன்; உண்மையைச் சொல்வேன். ஆனால், யாரும் என்னில் காண்பதையோ என்னிடமிருந்து எதையாவது கேட்பதையோ விட அதிகமாக என்னைக் குறித்து எண்ணாதபடி, நான் தவிர்க்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்னிடமிருந்து கேட்பதையோ’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘எதையாவது’ என்ற குறிப்பற்ற கூறு வெளிப்படையாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήσω
  choice: விரும்பினாலும்
  rationale: ἐὰν உடனான இறந்தகாலத் தோற்ற வினைமுற்று எதிர்காலத்தில் நிகழக்கூடிய ஒரு கற்பனை நிபந்தனையைச் சுட்டுகிறது; தமிழில் ‘விரும்பினாலும்’ இயல்பாக அந்த நிபந்தனை நுணுக்கத்தைத் தருகிறது.
- source_word: καυχήσασθαι
  choice: பெருமைபாராட்ட
  rationale: பவுலின் தயக்கத்துடனான சுயப் புகழ்ச்சியையும் சூழலிலுள்ள மெல்லிய பரிகாசத் தொனியையும் ‘பெருமைபாராட்ட’ தெளிவாகக் காட்டுகிறது.
- source_word: ἄφρων
  choice: மூடனாக
  rationale: பயனிலைப் பெயரடையின் பொருளை இயல்பான தமிழில் தருவதோடு, இவ்வதிகாரத்தின் ‘மூடன்’ மொழியுடனான தொடர்பையும் காக்கிறது.
- source_word: ἀλήθειαν ... ἐρῶ
  choice: உண்மையையே சொல்வேன்
  rationale: நிபந்தனைக்குள் உள்ள எதிர்கால வினையின் பொருளையும், பவுலின் கூற்று உண்மையானதாக இருக்கும் என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: φείδομαι
  choice: நான் அடக்கிக்கொள்கிறேன்
  rationale: மேலும் பெருமைபாராட்டாமல் தன்னைக் கட்டுப்படுத்திக்கொள்வதே இங்கு பொருள்; ‘அடக்கிக்கொள்கிறேன்’ நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: λογίσηται
  choice: மதிப்பிட்டுவிடாதபடி
  rationale: ஒருவரைப் பற்றிக் கணித்து ஒரு மதிப்பை நிர்ணயிக்கும் λογίζομαι என்பதன் மதிப்பீட்டு வலிமையை வெளிப்படுத்துகிறது; ‘விடு’ துணைவினை அளவுக்கு மீறிய முடிவை எடுக்கும் அபாயத்தை உணர்த்துகிறது.
- source_word: ὑπὲρ ὃ
  choice: அதற்கும் மேலாக
  rationale: காண்பதும் கேட்பதும் வழங்கும் ஆதார அளவை மீறிய மதிப்பீடு என்பதைக் குறிக்கிறது.
- source_word: βλέπει με
  choice: என்னிடம் காண்பதை
  rationale: பவுலில் நேரடியாகக் காணக்கூடியவற்றின் அடிப்படையில் மதிப்பிடுதல் என்ற பொருளைத் தருகிறது.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: என்னிடமிருந்து கேட்பது எதையோ
  rationale: ἐξ ἐμοῦ என்பதன் ‘என்னிடமிருந்து’ என்ற திசையையும், τι என்ற குறிப்பற்ற கூறையும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: பவுலின் சுயவிளக்கமும் பெருமைபாராட்டுவதிலான கட்டுப்பாடும்
  choice: பவுல் பெருமைபாராட்டினால் உண்மையே பேசுவார்; இருந்தும் பிறர் அவரை அளவுக்கு மீறி மதிக்காதபடி அதைத் தவிர்க்கிறார் என்ற பதற்றம் காக்கப்பட்டது.
  alternative: பவுல் பெருமைபாராட்டுவது தார்மிகமாகச் சரியானது என்று வலுப்படுத்துதல், அல்லது இங்குள்ள எல்லாப் பெருமைபாராட்டுதலும் பொய்யானது அல்லது பாவமானது என்று கூறுதல்.
  rationale: கிரேக்கம் அவரது கூற்று உண்மையாக இருக்கும் எனச் சொன்னபோதும், அவர் பிறருடைய மிகைப்படுத்தப்பட்ட மதிப்பீட்டைத் தவிர்க்கத் தன்னைக் கட்டுப்படுத்துகிறார்; இதை விரிவான கோட்பாட்டுத் தீர்ப்பாக மாற்றாமல் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, மரியாதையும் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டது. ‘பெருமைபாராட்ட’, ‘மதிப்பிட்டுவிடாதபடி’, ‘அடக்கிக்கொள்கிறேன்’ ஆகிய சொற்கள் பொதுவாசகருக்குப் புரியும்படி மூலத்தின் கருத்துத் துல்லியத்தை காக்கின்றன; [a] குறி பிரதான உரையில் இடம்பெற்றுள்ளது.
