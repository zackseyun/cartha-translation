source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: ta
  text: மேசியாவில் இருக்கும் ஒரு மனிதனை நான் அறிவேன். பதினான்கு ஆண்டுகளுக்கு முன்பு அந்த மனிதர்—உடலிலா என்பது எனக்குத் தெரியாது, உடலுக்கு வெளியிலா என்பதும் எனக்குத் தெரியாது; கடவுளுக்குத் தெரியும்[b]—மூன்றாம் வானம்வரை கவர்ந்து எடுத்துக்கொள்ளப்பட்டார்[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேசியாவில்’ என்பதற்கு மரபுவழியாக ‘கிறிஸ்துவில்’ என்றும் மொழிபெயர்க்கப்படுகிறது. கிரேக்க Χριστός என்பது ‘மேசியா’ என்ற பட்டப்பெயர்.
    reason: alternative_reading
  - marker: b
    text: இந்த அனுபவம் உடலில் நிகழ்ந்ததா அல்லது உடலுக்கு வெளியே நிகழ்ந்ததா என்று பவுல் தீர்மானிக்கவில்லை; அது எவ்வாறு நிகழ்ந்தது என்பதை உரை திறந்த நிலையிலேயே விடுகிறது.
    reason: theological_ambiguity
  - marker: c
    text: ‘மூன்றாம் வானம்’ என்பது பண்டைய யூத விண்ணியல் மொழிநடையைப் பிரதிபலிக்கிறது. மொழிபெயர்ப்பு அதை ‘உயர்ந்த வானம்’ அல்லது ‘பரதீசு’ என்று உரையிலேயே விளக்காமல், மூல வெளிப்பாட்டைக் காக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: நான் அறிவேன்
  rationale: οἶδα வடிவத்தில் நிறைவுக்காலமாக இருந்தாலும், கொய்னே கிரேக்கத்தில் நிகழ்காலப் பொருளில் வருகிறது; ஆகவே ‘நான் அறிவேன்’ என்பது இயல்பான நேரடி மொழிபெயர்ப்பு.
- source_word: ἄνθρωπον
  choice: ஒரு மனிதனை
  rationale: இங்கு ஒரு குறிப்பிட்ட ஆண் நபர் குறிக்கப்படுகிறார்; தமிழில் ‘ஒரு மனிதனை’ என்பது இயல்பாகவும் மூலத்தின் ஒருமையையும் காக்கும் வகையிலும் உள்ளது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவுக்குள் இருக்கும்
  rationale: Χριστός இங்கு பட்டப்பெயராகப் பொருள்படுகிறது. ‘மேசியா’ அதன் பட்டப்பெயர் தன்மையை வெளிப்படுத்துகிறது; ‘-க்குள்’ பவுலின் ஒன்றிப்பைக் குறிக்கும் மொழியை விளக்கிப் பரப்பாமல் காக்கிறது.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: பதினான்கு ஆண்டுகளுக்கு முன்பு
  rationale: πρό உடன் வரும் காலக் குறிப்புக்கு இது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: εἴτε ἐν σώματι
  choice: உடலிலா
  rationale: சுருக்கமான இந்த வடிவம் ‘உடலில்’ என்ற மூலச் சொல்லாட்சியைக் காத்து, அடுத்த எதிர்மறைக் கூறுடன் தெளிவான இணைப்பை உருவாக்குகிறது.
- source_word: εἴτε ἐκτὸς τοῦ σώματος
  choice: உடலுக்கு வெளியிலா
  rationale: ἐκτὸς τοῦ σώματος என்பதன் நேரடியான பொருளைத் தருவதோடு, ‘உடலிலா’ என்பதற்கு எதிரான அமைப்பையும் காக்கிறது.
- source_word: ὁ θεὸς οἶδεν
  choice: கடவுளுக்குத் தெரியும்
  rationale: மூலத்தில் ‘மட்டுமே’ இல்லை; எனவே கூடுதல் வலியுறுத்தலைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἁρπαγέντα
  choice: எடுத்துக்கொள்ளப்பட்டார்
  rationale: இறந்தகாலச் செயலற்ற வினையெச்சத்தைத் தமிழில் இயல்பான செயலற்ற வினையாகத் தருகிறது. திடீரென மேலே கொண்டுசெல்லப்பட்ட பொருள் சூழலால் தெளிவாகிறது; தேவையற்ற வன்முறைச் சாயல் தவிர்க்கப்படுகிறது.
- source_word: τὸν τοιοῦτον
  choice: அந்த மனிதர்
  rationale: சொல்லுக்குச் சொல் ‘அத்தகைய ஒருவர்’ என்பதைக் காட்டிலும், முன்பு குறிப்பிடப்பட்ட நபரை மீண்டும் சுட்டும் ‘அந்த மனிதர்’ தமிழில் தெளிவாக உள்ளது.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: மூன்றாம் வானம்வரை
  rationale: ἕως என்பதன் எல்லை அல்லது சென்றடைந்த இடம் என்ற நுட்பத்தை ‘-வரை’ காக்கிறது; ‘மூன்றாம் வானம்’ என்ற மூல உருவகமும் அப்படியே வைக்கப்படுகிறது.
theological_decisions:
- issue: ἐν Χριστῷ என்பதில் Χριστῷ என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: மேசியாவுக்குள்
  alternative: கிறிஸ்துவுக்குள்
  rationale: Χριστός என்பதன் பட்டப்பெயர் பொருளை ‘மேசியா’ வெளிப்படுத்துகிறது. அதேவேளை, ‘-க்குள்’ என்ற அமைப்பு பவுலின் ஒன்றிப்பு மொழியை விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- issue: பவுலின் அனுபவம் உடலுடன் நிகழ்ந்ததா, உடலுக்கு வெளியே நிகழ்ந்ததா
  choice: இரு சாத்தியங்களையும் தீர்மானிக்காமல், பவுலின் இருமுறை கூறப்படும் அறியாமையைப் பாதுகாத்தல்
  alternative: உடலோடு ஏறிச்சென்ற அனுபவம் அல்லது உடலற்ற தரிசனம் என்று தீர்மானித்தல்
  rationale: கிரேக்க உரை நிகழ்வு எவ்வாறு நடந்தது என்பதை பவுல் அறியவில்லை என்று இரு முறை வெளிப்படையாகச் சொல்கிறது; கடவுளுக்குத் தெரியும் என்றும் கூறுகிறது. எனவே மொழிபெயர்ப்பு இந்தத் தீர்க்கப்படாத பதற்றத்தைப் பாதுகாக்கிறது.
- issue: ‘மூன்றாம் வானம்’ என்ற சொல்லாட்சியின் விளக்கம்
  choice: மூலச் சொல்லாட்சியை உரையிலேயே காத்தல்
  alternative: உயர்ந்த வானம் அல்லது பரதீசு என்று உரையிலேயே விளக்குதல்
  rationale: τρίτου οὐρανοῦ என்பது பண்பாட்டு-விண்ணியல் சொல்லாட்சி. அதை ஒரே விளக்கமாக மாற்றாமல், வாசகர் காணும் விதத்தில் அப்படியே வைத்துப் பின்னணியை அடிக்குறிப்பில் தருவது ambiguity-ஐ காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தின் இடைச்செருகல் கோடுகளால் காக்கப்பட்டுள்ளது; அதேசமயம் தமிழில் வாசிப்புத் தெளிவுக்காக முதல் அறிமுகம் தனி வாக்கியமாக அமைக்கப்பட்டுள்ளது. ‘உடலிலா / உடலுக்கு வெளியிலா’ என்ற இணை அமைப்பு மூலத்தின் எதிர்மறையையும் தீர்க்கப்படாத தன்மையையும் பாதுகாக்கிறது.
