reference: 2 Corinthians 12:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: ta
  text: இதோ, மூன்றாவது முறையாக உங்களிடம் வர நான் ஆயத்தமாக இருக்கிறேன்[a]; நான் உங்களுக்குச் சுமையாக இருக்கமாட்டேன்[b]. ஏனெனில், உங்களுடையவற்றை அல்ல, உங்களையே நாடுகிறேன். பிள்ளைகள் பெற்றோருக்காகச் சேர்த்துவைக்கக் கடமைப்பட்டவர்கள் அல்ல; பெற்றோர்களே பிள்ளைகளுக்காகச் சேர்த்துவைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக: “இந்த மூன்றாவது முறையாக உங்களிடம் வர நான் ஆயத்தமாக இருக்கிறேன்.”'
    reason: lexical_alternative
  - marker: b
    text: “சுமையாக இரு” என்று மொழிபெயர்க்கப்பட்டுள்ள வினைச்சொல், ஒருவர்மீது பொருளாதாரச் சுமையைச் சுமத்துதல் என்ற பொருளையும் இங்கு கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் எடுத்துரைக்கிறது.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: மூன்றாவது முறையாக உங்களிடம் வர நான் ஆயத்தமாக இருக்கிறேன்
  rationale: இப்போது வருவதற்கான ஆயத்தத்தையே முன்னிறுத்துகிறது; இரண்டு முந்தைய வருகைகள் நிச்சயமாக நிகழ்ந்தன என்று வசனத்தைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: καταναρκήσω
  choice: உங்களுக்குச் சுமையாக இருக்கமாட்டேன்
  rationale: ஒருவர்மீது, குறிப்பாகப் பொருளாதார ரீதியில், பாரம் சுமத்தும் சூழல்சார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: உங்களுடையவற்றை அல்ல, உங்களையே நாடுகிறேன்
  rationale: உடைமைகளுக்கும் மனிதர்களுக்கும் இடையிலான கூர்மையான முரண்பாட்டைப் பாதுகாக்கிறது; ὑμᾶς என்பதன் வலியுறுத்தலை ‘உங்களையே’ காட்டுகிறது.
- source_word: ὀφείλει
  choice: கடமைப்பட்டவர்கள் அல்ல
  rationale: கிரேக்க வினைச்சொல்லிலுள்ள கடமை அல்லது பொறுப்பு என்ற நெறிசார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: θησαυρίζειν
  choice: சேர்த்துவைக்க
  rationale: எதிர்காலத் தேவைக்காகச் சேமித்து வைக்கும் பொருளை இயல்பாகத் தருகிறது; சூழலில் பணம் அல்லது பொருளாதார ஆதரவு உள்ளடங்கலாம் என்றாலும் அதற்கு மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: γονεῦσιν / γονεῖς; τέκνα / τέκνοις
  choice: பெற்றோர் / பிள்ளைகள்
  rationale: இரு கிரேக்கச் சொற்களின் பாலினம் உள்ளடக்கிய பொதுப் பொருளைத் துல்லியமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘மூன்றாவது’ என்பதன் பயண வரலாற்றுப் பொருள்
  choice: பவுலின் மூன்றாவது ஆயத்தமான அல்லது திட்டமிட்ட வருகை என்ற அளவில் மொழிபெயர்க்கப்பட்டது.
  alternative: இரண்டு முந்தைய வருகைகள் நிச்சயமாக நடந்தன என்று நேரடியாகக் கூறுதல்.
  rationale: கிரேக்க அமைப்பு மூன்றாவது முறையாக வர ஆயத்தமாயிருப்பதைச் சொல்கிறது; கொரிந்துக்கான பயண வரலாற்றை இந்த வசனம் மட்டும் கொண்டு முடிவுசெய்யாமல் அதன் இயல்பான தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: பெற்றோர் பிள்ளைகளுக்காகச் ‘சேர்த்துவைப்பது’
  choice: பொதுவான பெற்றோர் பொறுப்பை விளக்கும் ஒப்புமையாக வைத்திருக்கிறது.
  alternative: இதை ஒரு முழுமையான பொருளாதாரக் கட்டளையாக அல்லது திருச்சபை நிதி விதியாக விரிவாக்குதல்.
  rationale: பவுல் தாம் கொரிந்தியருக்கு நிதிச்சுமையாக இருக்காததை விளக்க குடும்ப ஒப்புமையைப் பயன்படுத்துகிறார்; வசனம் கூறுவதைவிட அதிகமான கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘இதோ’, ‘ஆயத்தமாக’, ‘உங்களையே’ போன்ற சொற்கள் மூலத்தின் உரையாடல் வலிமையையும் எதிர்மறை ஒப்புமையையும் காக்கின்றன; தேவையற்ற சமயக்குழு சார்ந்த சொற்பயன்பாடு தவிர்க்கப்பட்டது.
