id: 2CO.12.10
reference: 2 Corinthians 12:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: ta
  text: ஆகவே, மேசியாவுக்காக[a] பலவீனங்களிலும் அவமதிப்புகளிலும் இடர்ப்பாடுகளிலும் துன்புறுத்தல்களிலும் இக்கட்டுகளிலும் நான் மகிழ்கிறேன். ஏனெனில், நான் பலவீனமாக இருக்கும்போதுதான் வலிமையுள்ளவனாக இருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பாரம்பரியமாக, “கிறிஸ்துவுக்காக.”
    reason: Χριστός என்பதற்கான வழக்கமான பாரம்பரியத் தமிழ் வடிவத்தை வழங்குகிறது.
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து பவுல் எடுக்கும் முடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: εὐδοκῶ
  choice: நான் மகிழ்கிறேன்
  rationale: வெறும் சகிப்புத்தன்மையையோ மனநிறைவையோ அல்லாமல், விருப்பத்துடன் ஏற்றுக்கொள்ளும் மகிழ்ச்சியை வெளிப்படுத்தி வசனத்தின் முரண்பாட்டுத் தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐν ἀσθενείαις
  choice: பலவீனங்களில்
  rationale: உடல்நோய்களுக்கு மட்டும் வரையறுக்காமல், பலவகையான பலவீனங்களையும் உள்ளடக்கும் பன்மை வடிவத்தைப் பாதுகாக்கிறது.
- source_word: ἐν ὕβρεσιν
  choice: அவமதிப்புகளில்
  rationale: இழிவுபடுத்தும் பேச்சையும் நடத்தையையும் உள்ளடக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἐν ἀνάγκαις
  choice: இடர்ப்பாடுகளில்
  rationale: கட்டுப்படுத்தும் சூழ்நிலைகளால் ஏற்படும் கடின அனுபவங்களை இயல்பாகக் குறிக்கிறது; அடுத்துள்ள στενοχωρίαις என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: ἐν διωγμοῖς
  choice: துன்புறுத்தல்களில்
  rationale: மேசியாவைப் பற்றிய பற்றுறுதியால் நேரும் persecution என்ற பொருளை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: καὶ στενοχωρίαις
  choice: இக்கட்டுகளிலும்
  rationale: நெருக்கப்பட்ட, வெளியேறும் வழியற்ற கடும் துயர்நிலையின் படிமத்தையும் தீவிரத்தையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: ὑπὲρ Χριστοῦ
  choice: மேசியாவுக்காக
  rationale: ὑπέρ இங்கு காரணம் அல்லது பொருட்டு என்ற உறவைச் சுட்டுகிறது; Χριστός என்பதன் பட்டப்பெயர் சார்ந்த அர்த்தத்தை ‘மேசியா’ பாதுகாக்கிறது.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: ஏனெனில், நான் பலவீனமாக இருக்கும்போதுதான்
  rationale: ὅταν உடன் வரும் பொதுவான காலப்பொருளை இயல்பாகத் தருகிறது; ‘தான்’ இறுதி முரண்பாட்டின் வலியுறுத்தலைத் தெளிவாக்குகிறது.
- source_word: τότε δυνατός εἰμι
  choice: வலிமையுள்ளவனாக இருக்கிறேன்
  rationale: ‘பலவீனமாக’ என்பதற்கு இயல்பான எதிர்ச்சொல்லைப் பயன்படுத்தி பவுலின் முரண்பாட்டுக் கூற்றைப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பட்டப்பெயரின் பின்னணியைத் தக்கவைக்கும் வகையில் ‘மேசியா’ என வழங்கப்பட்டுள்ளது; தமிழில் வழக்கமான பாரம்பரிய வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பலவீனத்திலுள்ள வலிமை
  choice: ‘நான் பலவீனமாக இருக்கும்போதுதான் வலிமையுள்ளவனாக இருக்கிறேன்’ என்ற முரண்பாட்டுக் கூற்றை விளக்கமின்றி அப்படியே வைத்தல்
  alternative: வலிமை கடவுளிடமிருந்து வருகிறது என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: சுற்றியுள்ள வசனங்கள் வலிமையின் மூலத்தை விளக்கினாலும், இவ்வசனத்தின் கிரேக்க உரை அதை நேரடியாக மீண்டும் சொல்லவில்லை; ஆகவே உள்ளார்ந்த இறையியல் அழுத்தத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ஒரே ἐν அமைப்பில் வரும் ஐந்து பன்மைச் சொற்களுக்கும் ‘-இலும்’ வடிவம் பயன்படுத்தப்பட்டு பட்டியலின் ஓசையும் இணை அமைப்பும் தக்கவைக்கப்பட்டுள்ளன; இறுதி முரண்பாட்டைத் தெளிவாக ஒலிக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
