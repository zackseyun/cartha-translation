id: 2CO.12.4
reference: 2 Corinthians 12:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: ta
  text: அவர் பரதீசுக்குள் எடுத்துக்கொள்ளப்பட்டார்; அங்கே மனிதன் பேச அனுமதிக்கப்படாத, சொல்லுக்கெட்டாத வார்த்தைகளைக் கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: எடுத்துக்கொள்ளப்பட்டார்
  rationale: திடீரெனவும் ஒருவரது சொந்தச் செயலின்றியும் மேலான இடத்திற்குக் கொண்டுசெல்லப்படுவதை உணர்த்தும் இறந்தகாலச் செயப்பாட்டு வடிவம்.
- source_word: παράδεισον
  choice: பரதீசு
  rationale: இங்கு வரும் மறுமைசார் இடத்தைக் குறிக்கும் மரபான தமிழ் வேதாகமச் சொல்; மூலத்தின் தனித்துவமான கருத்தைத் தக்கவைக்கிறது.
- source_word: ἄρρητα ῥήματα
  choice: சொல்லுக்கெட்டாத வார்த்தைகள்
  rationale: ἄρρητα என்பது வெளிப்படுத்த இயலாதது அல்லது சொல்லத் தகாதது என்ற நுண்பொருள் கொண்டது; தொடரும் தடைச்சொற்றொடரின் ஒலிப்பை முன்னரே மிகையாகத் தீர்மானிக்காமல் இவ்விரு சாத்தியங்களையும் ஓரளவு திறந்துவைக்கிறது.
- source_word: οὐκ ἐξὸν
  choice: அனுமதிக்கப்படாத
  rationale: இது இயலாமையை மட்டும் அல்லாமல் அனுமதி அல்லது உரிமை இல்லாமையைக் குறிக்கிறது.
- source_word: ἀνθρώπῳ
  choice: மனிதன்
  rationale: பாலினத்தைச் சிறப்பாக வலியுறுத்தாமல் மனிதரைக் குறிக்கும் பொதுப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: λαλῆσαι
  choice: பேச
  rationale: கேட்ட வார்த்தைகளை வாயால் உரைப்பதைச் சுட்டும் எளிய, நேரடியான தமிழ் வினை.
theological_decisions:
- issue: ἄρρητα ῥήματα என்பதன் இயலாமை/தடை நுண்பொருள்
  choice: சொல்லுக்கெட்டாத வார்த்தைகள்; பின்னர் ‘பேச அனுமதிக்கப்படாத’
  alternative: விவரிக்க முடியாத வார்த்தைகள் / உச்சரிக்கக்கூடாத வார்த்தைகள்
  rationale: முதல் சொற்றொடரின் பொருளை ஒரே திசையில் உறுதிப்படுத்தாமல், அடுத்துள்ள οὐκ ἐξὸν என்ற தெளிவான அனுமதித் தடையைத் தனியே வெளிப்படுத்துகிறது.
- issue: παράδεισος குறிக்கும் இடம்
  choice: பரதீசு
  alternative: சொர்க்கம்
  rationale: முந்தைய வசனத்தின் ‘மூன்றாம் வானம்’ என்பதுடன் இதை முற்றிலும் ஒன்றாக்கவோ வேறுபடுத்தவோ செய்யாமல், மூலத்தின் தனிச் சொல்லைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிப்புக்கு இயல்பாகவும் பவுலின் மறைமுக மூன்றாம் நபர் குறிப்பையும் ஆண் ஒருமை வினைமுற்றையும் தக்கவைத்தும் அமைக்கப்பட்டுள்ளது. ‘அங்கே’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும் கேட்ட நிகழ்வு பரதீசில் நடந்தது என்பதைத் தமிழில் தெளிவாக இணைக்கும் இயல்பான சொல்.
