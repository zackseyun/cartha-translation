  source_fidelity: மூலத்தின் ἡρπάγη εἰς τὸν παράδεισον என்பதற்கு “பரதீசுக்குள் எடுத்துக்கொள்ளப்பட்டார்” துல்லியமான செயப்பாட்டு வடிவிலும் திசை உணர்வுடனும் அமைந்துள்ளது. ἄρρητα ῥήματα மற்றும் ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι ஆகிய இரு வேறுபட்ட நுணுக்கங்களும் முறையே “சொல்லுக்கெட்டாத” மற்றும் “மனிதன் பேச அனுமதிக்கப்படாத” என்று தனித்தனியாகக் காக்கப்பட்டுள்ளன. இது ஆங்கில POB-யின் “inexpressible words ... not permitted to speak” என்பதுடனும் ஒத்திருக்கிறது.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் வாசிக்க இயல்பாகவும் உள்ளது. “அங்கே” மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், பரதீசில் கேட்டதைத் தமிழில் இயல்பாக இணைக்கும் குறைந்தளவான விளக்கச் சொல்; பொருளில் தேவையற்ற விரிவாக்கம் இல்லை.
  terminology: “பரதீசு” என்பது παράδεισος என்பதன் தனித்துவத்தைப் பாதுகாக்கும் நிலையான வேதாகமத் தமிழ்ச் சொல். “மனிதன்” இங்கு ἀνθρώπῳ-ன் பொதுமனிதர் பொருளை இயல்பாகத் தருகிறது; பாலினக் குறிப்பைச் சுமத்தவில்லை.
