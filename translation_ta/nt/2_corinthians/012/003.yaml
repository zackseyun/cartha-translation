- from: அப்படிப்பட்ட ஒரு மனிதனை நான் அறிவேன்—அது உடலில் நடந்ததா அல்லது உடலுக்கு வெளியே நடந்ததா என்பது எனக்குத் தெரியாது[a]; கடவுளுக்குத் தெரியும்—
  to: அப்படிப்பட்ட ஒரு மனிதனை நான் அறிவேன்—அவர் உடலில் இருந்தாரா அல்லது உடலைவிட்டுப் பிரிந்திருந்தாரா என்பது எனக்குத் தெரியாது[a]; கடவுளுக்குத் தெரியும்—
