source:
  edition: SBLGNT
  text: καὶ οἶδα τὸν τοιοῦτον ἄνθρωπον— εἴτε ἐν σώματι εἴτε ⸀χωρὶς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: ta
  text: அப்படிப்பட்ட ஒரு மனிதனை நான் அறிவேன்—அவர் உடலில் இருந்தாரா அல்லது உடலைவிட்டுப் பிரிந்திருந்தாரா என்பது எனக்குத் தெரியாது[a]; கடவுளுக்குத் தெரியும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உடலைவிட்டுப் பிரிந்திருந்தாரா’ என்பதற்கு ‘உடலுக்கு வெளியே இருந்தாரா’ என்றும் மொழிபெயர்க்கலாம். அந்த அனுபவம் உடலோடு நிகழ்ந்ததா இல்லையா என்பதைப் பவுல் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα / οἶδεν
  choice: அறிவேன் / தெரியாது / தெரியும்
  rationale: அறிதலைக் குறிக்கும் வினைச்சொல்லைத் தமிழின் இயல்புக்கேற்ப நேர்மறை முதலாம் இடத்தில் ‘அறிவேன்’ என்றும், ‘எனக்குத் தெரியாது; கடவுளுக்குத் தெரியும்’ என்ற முரண்பாட்டில் இயல்பான ‘தெரியும்’ வடிவங்களாலும் வழங்குகிறது; அறிவின் எதிர்மறை-நேர்மறை வலியுறுத்தல் காக்கப்படுகிறது.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: அப்படிப்பட்ட ஒரு மனிதனை
  rationale: முந்தைய சூழலில் விவரிக்கப்பட்ட குறிப்பிட்ட ஆணைச் சுட்டும் மறைமுகமான மூன்றாம் நபர் குறிப்பையும் ஆண்பால் ஒருமையையும் காக்கிறது.
- source_word: εἴτε ... εἴτε
  choice: …ஆ அல்லது …ஆ
  rationale: இரண்டு மாற்றுச் சாத்தியங்களை இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν σώματι
  choice: உடலில்
  rationale: சொற்றொடரின் சுருக்கத்தையும், χωρὶς τοῦ σώματος என்பதுடனான நேரடியான முரண்பாட்டையும் காக்கிறது.
- source_word: χωρὶς τοῦ σώματος
  choice: உடலுக்கு வெளியே
  rationale: χωρίς குறிக்கும் பிரிவுநிலையை இயல்பான தமிழில் தெரிவிக்கிறது; அனுபவம் உடலற்றதா என்பதைத் தீர்மானிப்பதில்லை.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: எனக்குத் தெரியாது; கடவுளுக்குத் தெரியும்
  rationale: பவுலின் அறியாமைக்கும் கடவுளின் அறிவுக்கும் இடையிலான வெளிப்படையான முரண்பாட்டை அரைப்புள்ளியுடன் காக்கிறது.
- source_word: θεὸς
  choice: கடவுள்
  rationale: நவீன பொதுத்தமிழில் θεός என்பதற்கான தெளிவான, சமயப்பிரிவு சாராத வழக்கமான சொல்.
theological_decisions:
- issue: பவுலின் மறைமுகத் தற்குறிப்பும் அனுபவத்தின் தன்மையும்
  choice: ‘அப்படிப்பட்ட ஒரு மனிதனை’ என்ற மூன்றாம் நபர் குறிப்பைத் தக்கவைத்து, அனுபவம் உடலில் நடந்ததா அல்லது உடலுக்கு வெளியே நடந்ததா என்பதைத் திறந்த நிலையிலேயே விடுதல்.
  alternative: அந்த மனிதன் பவுலே என்று மொழிபெயர்ப்பில் வெளிப்படையாக அடையாளப்படுத்துதல், அல்லது இதை உறுதியான உடலுக்கு வெளியேயான அனுபவமாகக் கூறுதல்.
  rationale: கிரேக்க உரை சொல்லாட்சியில் இடைவெளியைப் பேணுவதோடு அனுபவத்தின் உடல்சார்ந்த தன்மையையும் தீர்மானிக்காமல் விடுகிறது; மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தீர்க்கக்கூடாது.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீன பொதுத்தமிழ். மூலத்தின் இடைச்செருகல் போன்ற ஓட்டத்தையும் முடிவுறாத கோடுகளையும் நீள்கோடுகள் காக்கின்றன; தெளிவுக்காக ‘அது … நடந்ததா’ சேர்க்கப்பட்டுள்ளது, ஆனால் மூலத்தின் ஐயப்பாடு தீர்க்கப்படவில்லை.
