  rationale: 'விதிவிலக்குக் கூறை முதன்மைக் கேள்விக்குள் இணைத்து, கிரேக்கத்தின் சொல்லாட்சிக் கேள்வி மற்றும் ‘தவிர’ தொடர்பைத் தெளிவாகவும் இயல்பாகவும் மீட்டமைத்துள்ளேன். [b] அடிக்குறிப்பு உள்ளடக்கத்தில் பொருத்தமானதே; ஆனால் திருத்தப்பட்ட முதன்மை உரையில் அதற்கான அடிக்குறிப்பு அடையாளம் தவறுதலாக விடுபட்டுள்ளது என்பதால், கட்டமைப்பு முழுமைக்காக கீழுள்ள திருத்தப்பட்ட உரையில் [b] ஐச் சேர்க்க வேண்டும்: ‘ஏனெனில், நானே உங்களுக்குச் சுமையாக இருக்கவில்லை[b] என்பதைத்தவிர, மற்ற சபைகளைவிட நீங்கள் எந்த வகையில் தாழ்வாக நடத்தப்பட்டீர்கள்[a]? இந்த அநியாயத்தை எனக்கு மன்னித்துவிடுங்கள்[c].’ மற்ற மாற்றங்கள் பொருளை மாற்றுவதில்லை.'
