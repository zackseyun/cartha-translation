source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: ta
  text: ஏனெனில், நானே உங்களுக்குச் சுமையாக இருக்கவில்லை என்பதைத்தவிர, மற்ற சபைகளைவிட நீங்கள் எந்த வகையில் தாழ்வாக நடத்தப்பட்டீர்கள்[a]? இந்த அநியாயத்தை எனக்கு மன்னித்துவிடுங்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மற்ற சபைகளைவிடத் தாழ்ந்த நிலைக்கு ஆக்கப்பட்டீர்கள்.” கிரேக்க வினைச்சொல், ஒருவரைப் பாதகமான நிலையில் வைப்பதையோ குறைவானவராக நடத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'பவுல் இங்கு முரண்நகையுடன் பேசுகிறார்: அவர் செய்ததாகக் கூறப்படும் “அநியாயம்,” அவர்களுக்குச் சுமையாக இருக்காததே.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: தாழ்வாக நடத்தப்பட்டீர்கள்
  rationale: இந்தச் செயப்பாட்டு வினை, மற்றவர்களுடன் ஒப்பிடும்போது குறைவான அல்லது பாதகமான நிலையில் வைக்கப்படுவதைக் குறிக்கலாம். ‘தாழ்வாக நடத்தப்பட்டீர்கள்’ என்பது கொரிந்தியர்கள் இயல்பிலேயே தாழ்ந்தவர்கள் என்று கூறாமல், அவர்களுக்கு நேர்ந்ததாகக் கருதப்படும் ஒப்பீட்டுக் குறையைத் தெரிவிக்கிறது.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: மற்ற சபைகளைவிட
  rationale: இங்கு ὑπέρ ஒப்பீட்டுப் பொருளில் வருகிறது. நவீன தமிழில் ‘மற்ற சபைகளைவிட’ என்பது அந்த ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: αὐτὸς ἐγώ
  choice: நானே
  rationale: இரட்டித்த தனிப்பட்ட வலியுறுத்தலைத் தமிழில் ‘நானே’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: உங்களுக்குச் சுமையாக இருக்கவில்லை
  rationale: சூழலில் இது பொருளாதார அல்லது பொருள் சார்ந்த ஆதரவைப் பெற்று அவர்கள்மீது பாரம் சுமத்தாததைக் குறிக்கிறது. நேரடிப் பொருளை வைத்துக்கொண்டு, நிதி சார்ந்த சூழலை அடிக்குறிப்பு விளக்குகிறது.
- source_word: χαρίσασθέ μοι
  choice: எனக்கு மன்னித்துவிடுங்கள்
  rationale: χαρίζομαι என்பதற்கு அருளுதல் அல்லது மன்னித்தல் என்ற பொருள்கள் உண்டு. இங்கு பவுலின் முரண்நகை கலந்த போலி மன்னிப்புக் கோரிக்கைக்கு ‘மன்னித்துவிடுங்கள்’ பொருத்தமானது.
- source_word: τὴν ἀδικίαν ταύτην
  choice: இந்த அநியாயத்தை
  rationale: ἀδικία என்பது அநியாயம், தவறு எனப் பொருள்படும். ‘இந்த அநியாயம்’ மூலத்தின் வலுவான நீதிசார் சொல்லையும், சூழலில் உள்ள முரண்நகையையும் பாதுகாக்கிறது.
- source_word: τί γάρ ἐστιν ὃ … εἰ μὴ ὅτι
  choice: ஏனெனில் … எந்த வகையில் …? … என்பதைத் தவிர வேறு எதில்?
  rationale: கிரேக்க வாக்கியத்தின் வாதத் தொடர்பையும் சொல்லாட்சிக் கேள்வியையும் இயல்பான தமிழில் வெளிப்படுத்துவதற்காக இரண்டு தொடர்புடைய கேள்விகளாக அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பொருளாதார ஆதரவைப் பற்றிய பவுலின் முரண்நகை கலந்த தற்காப்பு
  choice: முரண்நகையை விளக்கிச் சேர்க்காமல், ‘இந்த அநியாயத்தை எனக்கு மன்னித்துவிடுங்கள்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘இந்தப் பெரிய அநியாயத்தை மன்னியுங்கள்’ என்று முரண்நகையை விரிவுபடுத்துதல்
  rationale: மூலத்தில் இல்லாத மிகைப்படுத்தலைச் சேர்க்காமல், சூழலும் சொற்களும் பவுலின் கூர்மையான முரண்நகையை உணர்த்த அனுமதிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சபை,’ ‘அநியாயம்,’ ‘மன்னித்துவிடுங்கள்’ போன்ற பரவலாக அறியப்பட்ட சொற்கள் மூலத்தின் திருச்சபைச் சூழல், நீதிசார் வலிமை, முரண்நகை ஆகியவற்றைப் பாதுகாக்கின்றன.
