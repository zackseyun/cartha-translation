revisions:
- from: ஏனெனில், அந்த ‘மிகப்பெரிய அப்போஸ்தலர்களைவிட’[a] நான் எவ்வகையிலும் தாழ்ந்தவன் அல்ல என்று கருதுகிறேன்.
  to: ஏனெனில், அந்த மிக உயர்ந்த அப்போஸ்தலர்களைவிட நான் சிறிதளவும் குறைந்தவன் அல்ல என்று கருதுகிறேன்.
  rationale: The revision preserves the Greek emphasis and comparative sense while avoiding quotation marks that resolve the disputed rhetorical force in the main text. The alternative interpretive possibilities remain available in the footnote.
