reference: 2 Corinthians 11:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λογίζομαι γὰρ μηδὲν ὑστερηκέναι τῶν ὑπερλίαν ἀποστόλων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: ta
  text: ஏனெனில், அந்த மிக உயர்ந்த அப்போஸ்தலர்களைவிட நான் சிறிதளவும் குறைந்தவன் அல்ல என்று கருதுகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογίζομαι
  choice: கருதுகிறேன்
  rationale: ஆராய்ந்து மதிப்பிடுதல் அல்லது ஒரு முடிவுக்கு வருதல் என்ற கருத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கம் அல்லது ஆதாரத்தை அறிமுகப்படுத்தும் பவுலின் வாதத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: μηδὲν
  choice: எவ்வகையிலும் ... அல்ல
  rationale: இங்கு வினையெச்சத்துடன் வலியுறுத்தும் வினையடைப் பொருளில் வந்து, ‘சிறிதளவுகூட அல்ல’ என்ற அழுத்தத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ὑστερηκέναι
  choice: தாழ்ந்தவன்
  rationale: மற்றவர்களுடன் ஒப்பிடுகையில் குறைவானவனாக அல்லது கீழானவனாக இருத்தல் என்ற பொருளைத் தெளிவாகத் தருகிறது; கிரேக்க நிறைவுக்கால வடிவத்தின் தொடர்நிலை விளைவும் ‘தாழ்ந்தவன்’ என்பதில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: அந்த ‘மிகப்பெரிய அப்போஸ்தலர்கள்’
  rationale: ὑπερλίαν என்பதன் ‘மிகவும்/அளவுக்கு மீறிய’ வலிமையையும், சூழலில் சாத்தியமான கிண்டல் தொனியையும் மேற்கோள் குறிகள் மூலம் உணர்த்துகிறது; அதேவேளையில் சொற்றொடரின் நேர்மையான வாசிப்பையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλων என்பது பவுலின் எதிரிகளை கிண்டலாகக் குறிக்கிறதா, அல்லது உயர்வாக மதிக்கப்பட்ட அப்போஸ்தலர்களை நேர்மையாகக் குறிக்கிறதா?
  choice: ‘அந்த “மிகப்பெரிய அப்போஸ்தலர்கள்”’ என்று சாத்தியமான கிண்டல் தொனியுடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மிகவும் சிறந்த அப்போஸ்தலர்கள்’ என்று உயர்வாக மதிக்கப்பட்ட முன்னணி அப்போஸ்தலர்களைக் குறிக்கும் நேர்மையான வாசிப்பு.
  rationale: 2 கொரிந்தியர் 11-ன் உடனடிச் சூழல் பவுலுடன் போட்டியிட்ட ஊழியர்களுக்கு எதிரான விவாதத்தை வலுவாகச் சுட்டுகிறது. எனினும், கிரேக்கச் சொற்றொடர் முன்னணி அப்போஸ்தலர்களைப் பற்றிய நேர்மையான குறிப்பாகவும் வாசிக்கப்பட முடிவதால், அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பான, கண்ணியமான வாதநடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலர்’ என்பது திருச்சபைப் பயன்பாட்டில் பரவலாக அறியப்படும் சொல்லாக இருப்பதால் வைக்கப்பட்டுள்ளது. மேற்கோள் குறிகள் சாத்தியமான கிண்டலைக் காட்டுகின்றன; அதை உறுதியான ஒரே விளக்கமாகத் திணிக்கவில்லை.
