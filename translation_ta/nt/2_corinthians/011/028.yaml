lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: இத்தகைய வெளிப்புறக் காரியங்களைத் தவிர
  rationale: χωρίς உடன் வரும் மரபுத்தொடர், முன்பு பட்டியலிடப்பட்ட துன்பங்களுக்கு அப்பாற்பட்ட அல்லது வெளிப்புறமான காரியங்களைக் குறிக்கிறது. “இத்தகைய” என்பது முந்தைய பட்டியலுடன் இயல்பாக இணைக்கிறது; அடிக்குறிப்பு மற்ற சாத்தியமான பொருள்களையும் பாதுகாக்கிறது.
- source_word: ἐπίστασίς μοι
  choice: என்மேல் அழுத்தம் உண்டு
  rationale: ἐπίστασις என்பது அழுத்தம், நெருக்குதல் அல்லது தாக்குதல் எனப் பொருள்படலாம். இங்கு திருச்சபைகளைக் குறித்த அக்கறையுடன் விளக்கவுரையாக இணைவதால், உருவகமான மனப்பளுவைக் காட்ட “என்மேல் அழுத்தம்” என மொழிபெயர்க்கப்பட்டது. μοι என்பதன் அனுபவ வலிமையும் “என்மேல்” என்பதில் தக்கவைக்கப்படுகிறது.
- source_word: ἡ καθ’ ἡμέραν
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் மீண்டும் மீண்டும் ஏற்படுவதைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: ἡ μέριμνα
  choice: அக்கறை
  rationale: μέριμνα என்பதில் கவலை, அக்கறை, மனக்கலக்கம் ஆகிய நிழற்பொருள்கள் உள்ளன. பவுலின் உண்மையான மேய்ப்புப் பொறுப்பையும் உணர்ச்சி பளுவையும் காட்டி, அதை ஒழுக்கரீதியாகத் தவறான கவலையாக முன்கூட்டியே தீர்மானிக்காமல் இருக்க “அக்கறை” தேர்ந்தெடுக்கப்பட்டது.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: எல்லாத் திருச்சபைகளைக் குறித்த
  rationale: பவுலின் பயன்பாட்டில் ἐκκλησία பொதுவாக கிறிஸ்தவ விசுவாசிகளின் திருச்சபையைக் குறிக்கிறது. μέριμνα உடனான உரிமைவேற்றுமைத் தொடர்பை நவீன தமிழில் இயல்பாக வெளிப்படுத்த “குறித்த” பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: μέριμνα என்பதில் பவுலின் மேய்ப்புப் பளுவின் நுட்பம்
  choice: எல்லாத் திருச்சபைகளைக் குறித்த அக்கறை
  alternative: எல்லாத் திருச்சபைகளுக்காகவும் ஏற்படும் மனக்கலக்கம்
  rationale: இந்த வசனம் பவுலின் அப்போஸ்தலப் பொறுப்பின் பளுவை விவரிக்கிறது; தவறான கவலையைப் பற்றிய கோட்பாட்டுத் தீர்ப்பை வழங்கவில்லை. “அக்கறை” உணர்ச்சி பளுவையும் மேய்ப்புப் பரிவையும் தக்கவைத்து, எதிர்மறையான ஒழுக்கத் தீர்ப்பைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் பெயர்ச்சொல் அமைப்பையும் இரண்டாம் கூறு முதல் கூறை விளக்கும் தொடர்பையும் நீண்ட கோடால் வெளிப்படுத்துகிறது. உண்மையான சொற்பொருள் ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
