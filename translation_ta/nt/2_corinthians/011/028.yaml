  text: இத்தகைய வெளிப்புறக் காரியங்களைத் தவிர[a], நாள்தோறும் என்மேல் அழுத்தம் உண்டு[b]—எல்லாத் திருச்சபைகளைக் குறித்த அக்கறை[c].
