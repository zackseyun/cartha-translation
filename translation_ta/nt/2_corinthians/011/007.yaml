source:
  edition: SBLGNT
  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: ta
  text: அல்லது, நான் என்னைத் தாழ்த்திக்கொண்டு, நீங்கள் உயர்த்தப்படும்படி, கடவுளுடைய நற்செய்தியை உங்களுக்குக் கட்டணம் எதுவும் பெறாமல் அறிவித்ததால் பாவம் செய்தேனா?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் பாவம் செய்தேனா?” கிரேக்க மரபுத்தொடரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “நான் பாவத்தைச் செய்தேனா?” என்று வரும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இலவசமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: அல்லது
  rationale: முந்தைய வாதத்துடன் இணைந்த கூர்மையான மாற்று வினாவை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: ἁμαρτίαν ἐποίησα
  choice: நான் பாவம் செய்தேனா
  rationale: சொல்லுக்குச் சொல் எனில் ‘பாவத்தைச் செய்தேனா’ என்ற கிரேக்க மரபுத்தொடர்; இயல்பான நவீனத் தமிழில் அதன் ஒழுக்கவியல் வலிமையை ‘பாவம் செய்தேனா’ தெளிவாகத் தக்கவைக்கிறது.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: என்னைத் தாழ்த்திக்கொண்டு
  rationale: தற்சுட்டுப் பொருளையும், பவுலின் செயலை விளக்கும் பங்கேற்பு வினையின் தொடர்ச்சியையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: நீங்கள் உயர்த்தப்படும்படி
  rationale: நோக்கத்தைக் குறிக்கும் அமைப்பையும், பவுல் தன்னைத் தாழ்த்துவதற்கு எதிர்மாறான மரியாதை அல்லது நிலை உயர்வையும் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: அறிவித்ததால்
  rationale: தான் பாவம் செய்ததாகக் கருதப்படக்கூடிய செயலுக்கான காரணம் அல்லது அடிப்படையைத் தமிழின் காரண வினையெச்சம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δωρεὰν
  choice: கட்டணம் எதுவும் பெறாமல்
  rationale: இந்தச் சூழலில் ஊதியமோ கட்டணமோ பெறாமல் அறிவித்ததைத் தெளிவாகவும் கண்ணியமான நடையிலும் கூறுகிறது.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: கடவுளுடைய நற்செய்தி
  rationale: இறைவனுடன் உள்ள உரிய தொடர்பைக் காட்டும் கிரேக்க உருபுத் தொடரை வெளிப்படையாகத் தக்கவைத்து, εὐαγγέλιον என்பதன் பொருளை இன்றைய தமிழில் புரியும்படி தருகிறது.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: உங்களுக்கு ... அறிவித்ததால்
  rationale: நற்செய்தியை அவர்களிடம் அறிவித்த செயலைக் குறுகிய சமயச் சடங்கு சார்ந்த பொருளுக்குள் அடைக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நிதி ஆதரவு பெறாமையும் பவுல் தன்னைத் தாழ்த்தியதும் பற்றிய சொல்லாட்சிக் கேள்வி
  choice: பவுலின் கேள்வியை அதன் நகைமுரண் வலிமையுடன் நேரடியாகத் தருவது
  alternative: ஊழியத்திற்கான ஊதியம் குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டை வாக்கியத்துக்குள் விளக்கமாகச் சேர்ப்பது அல்லது நகைமுரணை வெறும் வருத்தமாக மென்மைப்படுத்துவது
  rationale: கிரேக்க உரை, தன்னைத் தாழ்த்தி இலவசமாக நற்செய்தி அறிவித்தது ‘பாவமா’ என்று கேட்கிறது; ஊழியர்களின் ஊதியம் பற்றிய விரிவான கோட்பாட்டுத் தீர்ப்பை இவ்வசனம் தனியாக வழங்குவதில்லை. ஆகவே அதன் பதற்றமும் நகைமுரணும் தீர்க்கப்படாமல் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என்னைத் தாழ்த்திக்கொண்டு—நீங்கள் உயர்த்தப்படும்படி’ என்ற எதிர்மறை இணைவும், கேள்வியின் நகைமுரண் தன்மையும் காக்கப்பட்டுள்ளன.
