id: 2CO.11.12
reference: 2 Corinthians 11:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: ta
  text: ஆனால், நான் செய்து வருவதைத் தொடர்ந்து செய்வேன்; வாய்ப்பை நாடுகிறவர்களிடமிருந்து வாய்ப்பைப் பறித்துக்கொள்வதற்காகவும், அவர்கள் பெருமைபாராட்டும் காரியத்தில் அவர்களும் எங்களைப் போலவே காணப்படும்படியாகவும் செய்வேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘வாய்ப்பு’ என்பதற்குப் பதிலாக, இரு இடங்களிலும் ‘சந்தர்ப்பம்’ அல்லது ‘சாக்கு’ என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: ἀφορμή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: ஆனால் நான் இப்போது செய்வதைத் தொடர்ந்து செய்வேன்
  rationale: நிகழ்கால ποιῶ மற்றும் எதிர்கால ποιήσω ஆகியவை பவுலின் தற்போதைய நடைமுறையையும் அதைத் தொடரும் உறுதியையும் குறிக்கின்றன. நவீன தமிழில் இயல்பாக இருக்க ‘தொடர்ந்து செய்வேன்’ எனத் தரப்பட்டது.
- source_word: ἐκκόψω
  choice: துண்டித்துவிடுவதற்காக
  rationale: ἐκκόπτω என்பதிலுள்ள ‘வெட்டித் துண்டித்தல்/முற்றிலும் அகற்றுதல்’ என்ற வலுவான உருவகத்தைத் தமிழிலும் காக்கிறது.
- source_word: ἀφορμή
  choice: வாய்ப்பு
  rationale: இந்தச் சொல் வாய்ப்பு, சந்தர்ப்பம், சாக்கு போன்ற பொருள்களைக் கொள்ளலாம். எதிரிகளின் நோக்கத்தை அளவுக்கு மீறி விளக்காமல், பரந்ததும் நடுநிலையானதுமான ‘வாய்ப்பு’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
- source_word: τῶν θελόντων ἀφορμήν
  choice: வாய்ப்பைத் தேடுகிறவர்களிடமிருந்து
  rationale: θελόντων என்பது விரும்புதல் அல்லது நாடுதலைக் குறிக்கிறது. இச்சூழலில் இயல்பான தமிழுக்காக ‘தேடுகிறவர்கள்’ எனத் தரப்பட்டுள்ளது; ἀφορμήயின் மீளுரைத்தல் உரையிலும் காக்கப்பட்டுள்ளது.
- source_word: ἐν ᾧ καυχῶνται
  choice: அவர்கள் பெருமைபாராட்டும் காரியத்தில்
  rationale: அவர்கள் பெருமை கொள்கிற துறை அல்லது விவகாரத்தைச் சுட்டும் கிரேக்கத் தொடர்புத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: எங்களைப் போலவே இருப்பவர்களாகக் காணப்படுவார்கள்
  rationale: εὑρεθῶσιν என்பதின் செயப்பாட்டு வடிவமும், பவுலையும் உடன் ஊழியர்களையும் ஒப்பிடும் καθὼς καὶ ἡμεῖς என்பதின் வலிமையும் காக்கப்படுகின்றன.
theological_decisions:
- issue: எதிரிகள் நாடிய ἀφορμή என்பதன் தன்மை
  choice: முதன்மை உரையில் நடுநிலையாக ‘வாய்ப்பு’
  alternative: ‘சாக்கு’ அல்லது ‘சந்தர்ப்பம்’
  rationale: வசனத்தின் விவாதத் தொனி எதிர்மறையானதாக இருந்தாலும், ἀφορμή என்ற பெயர்ச்சொல் தன்னிலேயே ‘சாக்கு’ என்ற ஒழுக்கத் தீர்ப்பைக் கட்டாயப்படுத்துவதில்லை. ஆகவே தெளிவின்மையைப் பாதுகாக்க ‘வாய்ப்பு’ பயன்படுத்தப்பட்டு, பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: ἵνα ... εὑρεθῶσιν என்பதன் நோக்க அல்லது விளைவு நுணுக்கம்
  choice: ‘அப்போது ... காணப்படுவார்கள்’ என்று இயல்பாக வெளிப்படுத்தல்
  alternative: ‘அவர்கள் ... காணப்படும்படியாக’
  rationale: கிரேக்க ἵνα நோக்கத்தையும் எதிர்பார்க்கப்படும் விளைவையும் சுட்ட முடியும். தமிழில் நோக்கத் தொடர்களை மீண்டும் மீண்டும் அடுக்காமல் வாசிப்பை இயல்பாக்க இவ்வாறு தரப்பட்டுள்ளது; எதிரிகளின் கூற்று சோதிக்கப்படும் கருத்து மாறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. ‘வாய்ப்பு’ என்ற மீளுரை கிரேக்க மூலத்தின் சொல்விளையாட்டையும் வாதத்தின் கூர்மையையும் காக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய முழுக் கருத்துக்குப் பின் வைக்கப்பட்டுள்ளது.
