  text: Ὄφελον ἀνείχεσθέ μου μικρόν ⸀τι ⸀ἀφροσύνης· ἀλλὰ καὶ ἀνέχεσθέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: ta
  text: என்னுடைய சிறிதளவு மதியீனத்தை[a] நீங்கள் பொறுத்துக்கொண்டால் நன்றாயிருக்கும்! ஆனால், உண்மையிலேயே என்னைப் பொறுத்துக்கொள்ளுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “சிறிதளவு மதியீனத்தை”; “சிறிதளவு மடமையை” என்றும் மொழிபெயர்க்கலாம்.
    reason: மூலத்தின் பெயர்ச்சொல் வடிவத்தையும் அதற்கான இயல்பான சொல்லியல் மாற்றையும் காட்டுகிறது.
  - marker: b
    text: “ஆனால், உண்மையிலேயே நீங்கள் என்னைப் பொறுத்துக்கொண்டிருக்கிறீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: ἀνέχεσθε என்ற கிரேக்க வடிவம் கட்டளையாகவோ நிகழ்காலக் கூற்றாகவோ புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: Ὄφελον
  choice: நீங்கள் … பொறுத்துக்கொண்டால் நலமாயிருக்கும்
  rationale: நிறைவேற வேண்டும் என்ற விருப்பத்தை வெளிப்படுத்தும் இச்சொல்லின் வலிமையை, நவீனத் தமிழில் இயல்பான விருப்ப வாக்கியமாகத் தருகிறது.
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: பொறுத்துக்கொண்டால் / பொறுத்துக்கொள்ளுங்கள்
  rationale: ἀνέχομαι என்பதன் ஒருவரை அல்லது அவரது நடத்தையைச் சகித்துக்கொள்ளும் பொருளைத் தெளிவாகத் தருகிறது; இருமுறை வருவதும் மொழிபெயர்ப்பில் தக்கவைக்கப்பட்டுள்ளது.
- source_word: μικρόν τι ἀφροσύνης
  choice: சிறிது மதியீனமாகப் பேசுவதை
  rationale: ‘சிறிதளவு மதியீனம்’ என்ற அடிப்படைப் பொருளை, பவுல் தொடர்ந்து பேசப்போகும் சூழலோடு இயல்பாக இணைக்கிறது; அவரது சுயதாழ்வு கலந்த சொல்லாட்சியை மென்மைப்படுத்தவில்லை.
- source_word: ἀλλὰ καὶ
  choice: ஆம்
  rationale: முந்தைய வேண்டுகோளை வலுப்படுத்தி மீண்டும் முன்வைக்கும் தொடர்ச்சியைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: μου
  choice: என்னை
  rationale: ἀνέχομαι என்பதுடன் வரும் உறவுநிலைப் பொருளைத் தமிழில் நேரடி செயப்படுபொருளாக இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: பவுல் தனது பேச்சை ‘மதியீனம்’ என்று குறிப்பிடுவது
  choice: மதியீனம் என்ற பதம் தக்கவைக்கப்பட்டது
  alternative: அபத்தம் அல்லது அறிவற்ற பேச்சு என்று மென்மைப்படுத்துதல்
  rationale: அடுத்து வரும் பெருமைபாராட்டும் பகுதியில் உள்ள பவுலின் நகைமுரண் கலந்த சுயதாழ்வையும் இறையியல் பதற்றத்தையும் விளக்கிப் போக்காமல் தக்கவைக்கிறது.
- issue: இறுதி ἀνέχεσθέ என்பதன் இலக்கணப் பொருள்
  choice: கட்டளையாக ‘பொறுத்துக்கொள்ளுங்கள்’
  alternative: கூற்றாக ‘நீங்கள் என்னைப் பொறுத்துக்கொண்டுதான் இருக்கிறீர்கள்’
  rationale: இந்த வடிவம் கட்டளையாகவும் நிகழ்காலக் கூற்றாகவும் அமையக்கூடியது. வேண்டுகோளை மீண்டும் வலியுறுத்துவது சூழலுக்கு நன்கு பொருந்துவதால் கட்டளை முதன்மை உரையில் வைக்கப்பட்டு, மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகருக்குப் புரியும் நடையில் வடிவமைக்கப்பட்டது. வியப்புக்குறி விருப்ப வேண்டுகோளின் உணர்ச்சி வலிமையை வெளிப்படுத்துகிறது; ‘மதியீனம்’ பவுலின் நகைமுரண் கலந்த சொல்லாட்சியைத் தக்கவைக்கிறது.
