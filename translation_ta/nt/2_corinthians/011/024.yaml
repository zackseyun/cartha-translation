  text: யூதர்களிடமிருந்து ஐந்து முறை, நாற்பதிலிருந்து ஒன்று குறைவான அடிகளைப் பெற்றேன்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘நாற்பதிலிருந்து ஒன்று குறைவு’; அதாவது முப்பத்தொன்பது அடிகள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யூதர்களால்.’ கிரேக்கம் தண்டனையைச் செய்தவர்களாக அல்லது அதன் மூலமாக யூதர்களைக் குறிப்பிடுகிறது; ஆனால் குறிப்பிட்ட ஓர் ஆளும் அமைப்பைச் சுட்டிக்காட்டவில்லை.
