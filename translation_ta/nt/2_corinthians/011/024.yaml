lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: யூதர்களிடமிருந்து
  rationale: ὑπό என்பதுடன் வரும் வேற்றுமை வடிவம் தண்டனையைச் செய்தவர்களையோ அதன் மூலத்தையோ குறிக்கிறது. ‘யூதர்களிடமிருந்து’ என்பது இதை இயல்பாகத் தெரிவிக்கிறது; குறிப்பிட்ட ஆளும் அமைப்பையோ அதிகாரக் குழுவையோ மூலத்தில் இல்லாதபடி சேர்ப்பதில்லை.
- source_word: πεντάκις
  choice: ஐந்து முறை
  rationale: இந்த வினையடை நேரடியாக ‘ஐந்து முறை’ என்று பொருள்படுகிறது; பவுல் ஒரே தண்டனையை மீண்டும் மீண்டும் அனுபவித்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: நாற்பதுக்கு ஒன்று குறைவாக
  rationale: கிரேக்கச் சொற்றொடரின் ‘நாற்பதிலிருந்து ஒன்று குறைவு’ என்ற வடிவத்தைப் பாதுகாத்து, அதன் எண்ணிக்கையான முப்பத்தொன்பதையும் வாசகர் புரிந்துகொள்ள வழிசெய்கிறது.
- source_word: ἔλαβον
  choice: பெற்றேன்
  rationale: λαμβάνω இங்கு தண்டனையைப் பெறுதல் என்ற பொருளில் வருகிறது. ‘பெற்றேன்’ என்பது மூல வினையின் உருவகத்தைத் தக்கவைக்கிறது; ‘சகித்தேன்’ என்று மொழிபெயர்ப்பது கூடுதல் விளக்கத்தைச் சேர்க்கும்.
- source_word: implied object of ἔλαβον
  choice: சவுக்கடிகளை
  rationale: கிரேக்கத்தில் பொருள் வெளிப்படையாகக் குறிப்பிடப்படாவிட்டாலும், தண்டனைச் சூழலில் பெறப்பட்ட அடிகளே குறிக்கப்படுகின்றன. தமிழில் வாக்கியம் தெளிவாகவும் இயல்பாகவும் அமைய ‘சவுக்கடிகளை’ சேர்க்கப்பட்டுள்ளது.
