source:
  edition: SBLGNT
  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: ta
  text: நான் சொல்வதை ஆண்டவருக்கு ஏற்பச் சொல்லவில்லை[a]; மாறாக, மதியீனமாகப் பேசுவதுபோல்[b], பெருமைபாராட்டுவதில் இந்தத் துணிவோடு[c] சொல்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் இதை ஆண்டவரிடமிருந்து வந்ததாகச் சொல்லவில்லை,” அல்லது “ஆண்டவரின் அளவுகோலின்படி சொல்லவில்லை.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “மதியீனத்தில் இருப்பதுபோல்”; இன்னும் இயல்பாக, “ஒரு மதியீனனைப்போல்.”
    reason: lexical_alternative
  - marker: c
    text: “துணிவு” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் இச்சூழலில் “விவகாரம்,” “அடிப்படை,” அல்லது “முயற்சி” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: நான் சொல்வதை
  rationale: நடப்பில் பவுல் கூறிக்கொண்டிருக்கும் கருத்தை இயல்பான நவீனத் தமிழில் எடுத்துரைக்கிறது; நிகழ்காலத் தொடர்ச்சியையும் சூழல் தெளிவுபடுத்துகிறது.
- source_word: κατὰ κύριον
  choice: ஆண்டவருக்கு ஏற்ப
  rationale: κατά என்பதன் நெறி அல்லது அளவுகோல் சார்ந்த பொருளைப் பாதுகாக்கிறது; ‘ஆண்டவரிடமிருந்து வந்ததாக’ அல்லது ‘ஆண்டவரின் அதிகாரத்தால்’ என்று ஒரே விதமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: இச்சூழலில் இயேசுவைக் குறிக்கும் κύριος என்பதற்கான இயல்பான, மரியாதைக்குரிய தமிழ் வடிவம்.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: மாறாக, மதியீனத்தில் இருப்பதுபோல்
  rationale: பவுல் தன்னை நேரடியாக மதியீனன் என்று அழைக்காமல், தமது பேச்சின் தோற்றம் அல்லது முறையை ஒப்புமையாகக் குறிப்பிடும் கிரேக்க நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: இந்தத் துணிவோடு
  rationale: ὑπόστασις இங்கு குறிக்கக்கூடிய தன்னம்பிக்கையான நிலைப்பாட்டை இயல்பான தமிழில் தருகிறது; அதன் ‘அடிப்படை,’ ‘விவகாரம்,’ ‘முயற்சி’ ஆகிய சாத்தியமான பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: τῆς καυχήσεως
  choice: பெருமைபாராட்டும்
  rationale: καύχησις என்பதன் செயற்பொருளைத் தக்கவைத்து, அந்தத் துணிவு பெருமைபாராட்டுதலுடன் தொடர்புடையது என்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘ஆண்டவருக்கு ஏற்ப’ என்பதன் பொருளும் வலிமையும்
  choice: தாம் மேற்கொள்ளவிருக்கும் பெருமைபாராட்டும் பேச்சு ஆண்டவரின் நெறி அல்லது முறைக்கு ஏற்ப அமைந்ததல்ல என்று பவுல் கூறுகிறார்.
  alternative: இங்கு ஆண்டவரின் நேரடியான வார்த்தையையோ கட்டளையையோ மேற்கோள் காட்டவில்லை என்று பவுல் கூறலாம்; அல்லது இப்பேச்சு ஆண்டவரிடமிருந்து வந்ததல்ல என்று கூறலாம்.
  rationale: முதன்மை உரை ஆண்டவரின் நெறி, முறை, அல்லது அதிகாரம் ஆகியவற்றில் ஒன்றை மட்டும் இறுதியாகத் தேர்ந்தெடுக்காமல் பதற்றத்தைக் காக்கிறது. இது வேதத்தூண்டுதல் அல்லது பவுலின் உண்மைத்தன்மை குறித்து உரையில் இல்லாத முடிவைச் சேர்ப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் மரியாதையான வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் மீளுரையைத் தமிழில் தெளிவாக வைத்திருக்க இறுதியில் ‘சொல்கிறேன்’ சேர்க்கப்பட்டது. எல்லா மாற்றுப் பொருள் குறிப்புகளும் உரிய [a], [b], [c] குறிகளுடன் முதன்மை உரையில் இணைக்கப்பட்டுள்ளன.
