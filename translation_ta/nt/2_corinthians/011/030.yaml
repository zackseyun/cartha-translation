  text: Εἰ καυχᾶσθαι δεῖ, τὰ τῆς ἀσθενείας μου καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: ta
  text: பெருமைபாராட்ட வேண்டுமென்றால், என் பலவீனத்தைச் சார்ந்த காரியங்களைக் குறித்துப் பெருமைபாராட்டுவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இயல்பான தமிழில், “என் பலவீனங்களைப் பற்றிப் பெருமைபாராட்டுவேன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இன்னும் சொற்சார்பாக, “என் பலவீனத்தைச் சார்ந்த காரியங்களைக் குறித்துப் பெருமைபாராட்டுவேன்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: வேண்டியிருந்தால்
  rationale: εἰ அறிமுகப்படுத்தும் நிபந்தனைத் தன்மையை, δεῖ என்பதன் அவசியத்துடன் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது; அதை காரணப்பொருளாக மாற்றவில்லை.
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: பெருமைபாராட்ட / பெருமைபாராட்டுவேன்
  rationale: பவுலின் சொல்லாட்சியில் உள்ள ஒரே வினையின் மறுபயன்பாட்டையும், சூழலின் முரண்பாடான பெருமைப்பேச்சையும் காக்கிறது.
- source_word: δεῖ
  choice: வேண்டியிருந்தால்
  rationale: அவசியம் அல்லது கட்டாயம் என்ற வலிமையைத் தருகிறது; εἰ உடன் சேர்ந்து தமிழில் இயல்பான நிபந்தனை அமைப்பை உருவாக்குகிறது.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: என் பலவீனத்துக்குரியவற்றைக் குறித்து
  rationale: τὰ என்ற பன்மையையும், ‘என் பலவீனத்துக்குரிய காரியங்கள்’ என்ற அசாதாரணமான கிரேக்க அமைப்பையும் இயன்றவரை காக்கிறது; வெறுமனே ‘என் பலவீனங்கள்’ என்று சுருக்கவில்லை.
- source_word: ἀσθενείας
  choice: பலவீனம்
  rationale: உடல் நோயை மட்டும் குறிக்காமல், பவுல் சந்தித்த தாழ்வான மற்றும் இயலாமையை வெளிப்படுத்தும் நிலைகளையும் உள்ளடக்கும் பரந்த பொருளைத் தருகிறது.
theological_decisions:
- issue: பவுலின் பெருமைபாராட்டுதலின் தன்மை
  choice: பலவீனத்துக்குரியவற்றைக் குறித்து பெருமைபாராட்டுவதாக உள்ள முரண்பாட்டை நேரடியாக வைத்திருத்தல்
  alternative: ‘என் பலவீனங்களைப் பற்றியே பெருமைபாராட்டுவேன்’ என்று எளிமைப்படுத்துதல்
  rationale: வழக்கமான பெருமைப்பேச்சுக்கும் பலவீனத்தை மையப்படுத்தும் பவுலின் பெருமைப்பேச்சுக்கும் இடையிலான இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு விளக்கிவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கத்தின் அசாதாரணமான பன்மை அமைப்பை முதன்மை உரையில் அளவோடு காத்து, எளிய மாற்றை அடிக்குறிப்பில் வழங்குகிறது.
