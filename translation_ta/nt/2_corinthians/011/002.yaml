source:
  edition: SBLGNT
  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: ta
  text: நான் உங்கள்மேல் தேவனுடைய பொறாமையோடு பொறாமை கொள்கிறேன்; ஏனெனில், உங்களைத் தூய கன்னியாக மெசியாவுக்கு முன் நிறுத்துவதற்காக, ஒரே கணவருக்கு உங்களை மணநிச்சயம் செய்து வைத்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλῶ
  choice: வைராக்கியம் கொண்டிருக்கிறேன்
  rationale: இந்த வினைச்சொல் தீவிர அக்கறையையும் பாதுகாக்கும் பொறாமையையும் குறிக்கலாம். திருமண உருவகத்தின் உடன்படிக்கை சார்ந்த அக்கறையைத் தக்கவைத்து, சிறுமையான பொறாமை என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘வைராக்கியம்’ பயன்படுத்தப்பட்டது.
- source_word: θεοῦ ζήλῳ
  choice: தேவனுடைய வைராக்கியத்தால்
  rationale: θεοῦ என்ற மரபுவேற்றுமையை நேரடியாகத் தக்கவைக்கிறது; இது தேவனுக்குரிய வைராக்கியம் அல்லது தேவனுடைய தன்மைக்கு ஏற்ற வைராக்கியம் என இருவிதமாகப் புரியக்கூடியதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἡρμοσάμην
  choice: மணநிச்சயம் செய்துவைத்தேன்
  rationale: திருமணத்திற்காக ஒருவரை ஒருவரோடு நிச்சயித்து இணைக்கும் செயலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; திருமண உருவகமும் தக்கவைக்கப்படுகிறது.
- source_word: ἑνὶ ἀνδρὶ
  choice: ஒரே கணவருக்கு
  rationale: ἀνήρ என்பதற்கு ‘ஆண்’ என்றும் ‘கணவர்’ என்றும் பொருள் இருக்கலாம்; இங்குள்ள மணநிச்சய உருவகம் ‘கணவர்’ என்ற சூழல்சார் பொருளைத் தெளிவாக்குகிறது.
- source_word: παρθένον ἁγνὴν
  choice: தூய கன்னியாக
  rationale: கன்னித்தன்மை மற்றும் தூய்மை ஆகிய இரு கூறுகளையும் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: παραστῆσαι
  choice: முன்னிறுத்துவதற்காக
  rationale: ஒருவரை இன்னொருவரின் முன்னிலையில் கொண்டுவந்து நிறுத்துதல் அல்லது சமர்ப்பித்தல் என்ற சடங்கு சார்ந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: τῷ Χριστῷ
  choice: மெசியாவிடம்
  rationale: இங்கு Χριστός மணமகன் உருவகத்தில் பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டது; வழக்கமான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: பவுலின் வைராக்கியத்தின் இயல்பு
  choice: அது தேவனுடைய உடன்படிக்கை சார்ந்த, பாதுகாக்கும் வைராக்கியத்தைப் பிரதிபலிப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது தேவனைச் சுட்டாத பவுலின் தனிப்பட்ட தீவிர அக்கறை மட்டுமே எனப் புரிந்துகொள்ளலாம்.
  rationale: θεοῦ ζήλῳ என்ற சொற்றொடரும் பிரத்தியேக மணஉறவு உருவகமும் தேவனுடைய உடன்படிக்கை சார்ந்த வைராக்கியத்தை இயல்பாக நினைவூட்டுகின்றன; இருப்பினும் மரபுவேற்றுமையின் பொருள் முழுமையாகத் தீர்மானிக்கப்படவில்லை.
- issue: Χριστός என்பதன் செயல்பாடு
  choice: பட்டமாக ‘மெசியா’ என்று வழங்கப்பட்டது.
  alternative: பெயர்போல் ‘கிறிஸ்து’ என்று வழங்கலாம்.
  rationale: குறிப்பிட்ட மணமகனாகிய τῷ Χριστῷ என்ற அமைப்பில் பட்டத்தன்மை தெளிவாக இருப்பதால் ‘மெசியா’ முதன்மை உரையில் வைக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘வைராக்கியம்’ என்ற சொல் மீளுருவாக்கப்படுவது கிரேக்கத்தில் ζηλῶ/ζήλῳ உள்ள சொல் மீள்வை காக்கிறது. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் காரணத் தொடர்பும் திருமண உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
