source:
  edition: SBLGNT
  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: ta
  text: 'மீண்டும் சொல்கிறேன்: யாரும் என்னை அறிவற்றவன் என்று எண்ண வேண்டாம். ஆனால் அப்படி இல்லையென்றால், அறிவற்றவன் என்றே என்னை ஏற்றுக்கொள்ளுங்கள்; நானும் சற்றுப் பெருமை பேசுவதற்காக.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: மீண்டும் சொல்கிறேன்
  rationale: பவுல் முன்பு கூறிய வேண்டுகோளை மறுபடியும் வலியுறுத்துவதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: யாரும் என்னை அறிவற்றவன் என்று எண்ண வேண்டாம்
  rationale: μή உடன் வரும் துணைவினையின் தடுப்பு அல்லது எதிர்மறை வேண்டுகோள் வலிமையைத் தக்கவைக்கிறது; ἄφρων இங்கு பெயர்ச்சொல் போல் புரிந்துகொள்ளப்படலாம்.
- source_word: εἰ δὲ μή γε
  choice: அப்படி எண்ணாமல் இருக்க முடியாவிட்டால்
  rationale: முந்தைய வேண்டுகோளை ஏற்காவிட்டால் குறைந்தபட்சம் அடுத்த வேண்டுகோளை ஏற்குமாறு பவுல் வைக்கும் மாற்று வாய்ப்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: அறிவற்றவனைப் போலவாவது என்னை ஏற்றுக்கொள்ளுங்கள்
  rationale: κἂν என்பதன் விட்டுக்கொடுக்கும் வலிமையை ‘போலவாவது’ எடுத்துரைக்கிறது; δέχομαι என்பதற்கு சூழலுக்கேற்ற நேரடியான ‘ஏற்றுக்கொள்ளுங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: அப்போது நானும் சற்றுப் பெருமை பேசலாம்
  rationale: κἀγώ என்பதிலுள்ள ‘நானும்’ என்ற வலியுறுத்தலையும் μικρόν τι என்பதிலுள்ள அளவுக் குறைப்பையும் தக்கவைக்கிறது; καυχάομαι என்பதன் தற்பெருமை சார்ந்த, இங்கு நையாண்டியான மொழியை மென்மைப்படுத்தாமல் வழங்குகிறது.
theological_decisions:
- issue: ἄφρων என்ற சொல்லில் பவுலின் நையாண்டியான சுயவிவரிப்பு
  choice: ‘அறிவற்றவன்’ என்ற பெயர்ச்சொல் வடிவத்தை இரு இடங்களிலும் தக்கவைத்தல்
  alternative: ‘அறிவில்லாதவனாக’ அல்லது ‘முட்டாள்தனமாக நடப்பவனாக’ என்று பெயரடை/விளக்க வடிவில் மொழிபெயர்த்தல்
  rationale: பவுல் தன்னை உண்மையில் அறிவற்றவன் என ஒப்புக்கொள்வதில்லை; அப்படித் தோன்றினாலும் தனது வாதத்திற்காகத் தன்னை ஏற்றுக்கொள்ளுமாறு நையாண்டியாகக் கேட்கிறார். இதை விளக்கிச் சமன் செய்யாமல் அப்படியே விடுகிறது.
- issue: καυχήσωμαι என்பதன் பெருமைபேசும் மொழி
  choice: ‘பெருமை பேசலாம்’ என்று நேரடியாக வழங்குதல்
  alternative: ‘என்னைப் பற்றிச் சிறிது பேசலாம்’ என்று மென்மைப்படுத்துதல்
  rationale: சுற்றியுள்ள பகுதியில் உள்ள தயக்கத்துடனான பெருமைபேச்சு என்ற இறையியல் மற்றும் சொற்பொழிவு இழுபறியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நேரடி நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பவுலின் வேண்டுகோள், விட்டுக்கொடுக்கும் திருப்பம், நையாண்டியான ‘அறிவற்றவன்/பெருமை பேசுதல்’ மொழி ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி முதன்மை உரையில் இடம்பெற்றுள்ளது.
