  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: ta
  text: ஆண்டவர் இயேசுவின் தேவனும் தந்தையுமானவர், என்றென்றும் போற்றுதலுக்குரியவராகியவர், நான் பொய் சொல்வதில்லை என்பதை அறிகிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: தேவனும் தந்தையுமானவர்
  rationale: ஒரே சுட்டுச் சொல் இரு பெயர்ச்சொற்களையும் இணைப்பதால், ‘தேவனும் தந்தையுமானவர்’ என்ற ஒருங்கிணைந்த சொற்றொடர் மூலத்தின் அமைப்பையும் பவுலின் ஆணையுறுதி போன்ற கூற்றையும் காக்கிறது.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ஆண்டவர் இயேசுவின்
  rationale: κύριος என்ற பட்டப்பெயர் ‘ஆண்டவர்’ என மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தில் இல்லாத ‘நமது’ என்பது சேர்க்கப்படவில்லை.
- source_word: οἶδεν
  choice: அறிந்திருக்கிறார்
  rationale: வினையின் நேரடியான பொருளான ‘அறிகிறார்/அறிந்திருக்கிறார்’ என்பதே வைக்கப்பட்டுள்ளது; ஆணையுறுதியின் செயல்பாட்டை விளக்க ‘சாட்சி’ என விரிவாக்கவில்லை.
- source_word: ὁ ὢν εὐλογητὸς
  choice: போற்றப்படுகிற அவர்
  rationale: இது தேவனை விவரிக்கும் புகழுரைக் கிளவியாக உள்ளது. ‘போற்றப்படுகிற’ என்பது εὐλογητός என்பதன் இச்சூழலிலான துதிக்குரிய பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: εἰς τοὺς αἰῶνας
  choice: என்றென்றும்
  rationale: நீடித்த புகழுரைப் பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது; சொற்சொல்லான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὅτι
  choice: என்பதை
  rationale: இங்கு ὅτι, தேவன் அறிந்திருப்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணத்தைக் குறிக்கவில்லை.
- source_word: οὐ ψεύδομαι
  choice: நான் பொய் சொல்லவில்லை
  rationale: நிகழ்காலக் கூற்றின் உடனடியான, ஆணையுறுதி போன்ற தன்மையை இயல்பான நவீன தமிழில் காக்கிறது.
theological_decisions:
- issue: ‘தேவனும் தந்தையும்’ என்பவருக்கும் ‘ஆண்டவர் இயேசு’வுக்கும் உள்ள தொடர்பு
  choice: ‘ஆண்டவர் இயேசுவின் தேவனும் தந்தையுமானவர்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: நபர்களுக்கிடையிலான வேறுபாட்டால் எழும் இறையியல் அழுத்தத்தைத் தவிர்க்கும் வகையில் பொழிப்புரை செய்தல்.
  rationale: வசனம் தேவனாகிய தந்தையையும் ஆண்டவர் இயேசுவையும் தொடர்புபடுத்தியபடியே வேறுபடுத்துகிறது. மூலத்தின் இந்த மொழியை மென்மைப்படுத்தாமலும் கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் காக்க வேண்டும்.
- issue: புகழுரைக் கிளவியின் இணைப்பு
  choice: ‘என்றென்றும் போற்றப்படுகிற அவர்’ என்பதை தேவனைக் குறிக்கும் இடைச்செருகல் போன்ற விளக்கமாகக் காற்புள்ளிகளுக்குள் வைத்தல்.
  alternative: அதை இன்றியமையாத வரையறைக் கிளவியாக நெருக்கமாக இணைத்தல்.
  rationale: இக்கிளவி பவுலின் ஆணையுறுதி போன்ற கூற்றில் தேவனைப் போற்றும் இடைச்சொல்லாக இயல்பாகச் செயல்படுகிறது; காற்புள்ளிகள் வாசிப்பைத் தெளிவாக்குகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. ‘தேவன்’, ‘ஆண்டவர்’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்ற பரவலான சொற்களாக வைக்கப்பட்டுள்ளன; தேவையற்ற பழந்தமிழ் மற்றும் சமயப்பிரிவு சார்ந்த விரிவாக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
