  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: ta
  text: கடும் உழைப்பிலும் கடினப் பாடுகளிலும், பலமுறை தூக்கமின்றி இருந்ததிலும், பசியிலும் தாகத்திலும், பலமுறை உண்ணாமல் இருந்ததிலும்[a], குளிரிலும் போதிய உடையின்றி இருந்ததிலும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பலமுறை நோன்பிருந்ததிலும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் திரும்பத் திரும்ப நோன்பிருந்ததைக் குறிக்கிறது; அவை விருப்பத்துடன் மேற்கொண்ட நோன்புகளா அல்லது சூழ்நிலையால் ஏற்பட்ட உணவின்மையா என்பதை இவ்வுரை குறிப்பிடவில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘நிர்வாணத்திலும்.’ இங்கு போதிய உடையில்லாமல் குளிருக்கும் இயற்கையின் தாக்கத்துக்கும் ஆளான நிலையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: கடும் உழைப்பு
  rationale: κόπος கடினமான, களைப்பூட்டும் உழைப்பைக் குறிக்கிறது. நவீன தமிழில் அதன் தீவிரத்தை இயல்பாக வெளிப்படுத்த ‘கடும் உழைப்பு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μόχθῳ
  choice: கடினப் பாடுகள்
  rationale: μόχθος என்பது உழைப்போடு வரும் துன்பத்தையும் கடின நிலையையும் குறிக்கிறது. κόπος என்பதுடன் உள்ள நெருங்கிய பொருள் இணைப்பைத் தட்டையாக்காமல், இரண்டாவது சொல்லின் துன்ப அம்சத்தை ‘கடினப் பாடுகள்’ வெளிப்படுத்துகிறது.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: பலமுறை தூக்கமின்றி இருந்ததிலும்
  rationale: ἀγρυπνία விழித்திருத்தல் அல்லது தூக்கமின்மையைக் குறிக்கிறது. இங்கு அதன் பன்மையும் πολλάκις என்பதும் மீண்டும் மீண்டும் நேர்ந்த தூக்கமற்ற நிலைகளைக் காட்டுகின்றன.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: பசியிலும் தாகத்திலும்
  rationale: பசியும் தாகமும் அனுபவிக்கப்பட்ட பற்றாக்குறை நிலைகளாக இங்கு கூறப்படுகின்றன. கிரேக்கத்தின் இணை அமைப்பையும் சுருக்கத்தையும் தமிழ் சொற்றொடர் காக்கிறது.
- source_word: ἐν νηστείαις πολλάκις
  choice: பலமுறை உண்ணாமல் இருந்ததிலும்
  rationale: νηστεία நோன்பு அல்லது உணவு உண்ணாதிருத்தலைக் குறிக்கலாம். அது விருப்பத்துடன் மேற்கொள்ளப்பட்டதா அல்லது சூழ்நிலையால் ஏற்பட்டதா என்பதை இவ்வசனம் குறிப்பிடாததால், ‘உண்ணாமல் இருந்தது’ என்ற நடுநிலையான தொடர் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ἐν ψύχει
  choice: குளிரிலும்
  rationale: ψῦχος அனுபவிக்கப்பட்ட குளிர் நிலையைக் குறிக்கிறது. பட்டியல் நடைக்கு ஏற்ற சுருக்கமான இயல்பான தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: γυμνότητι
  choice: போதிய உடையின்றி இருந்ததிலும்
  rationale: γυμνότης சொல்லுக்குச் சொல் ‘நிர்வாணம்’ என்று பொருள்படலாம்; ஆனால் இத்துன்பப் பட்டியலில் குளிருடன் இணைக்கப்பட்டிருப்பதால், போதிய உடையின்மை மற்றும் இயற்கையின் தாக்கத்துக்கு ஆளான நிலை முக்கியமாகத் தெரிகிறது. நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: νηστείαις என்பதன் பொருள்
  choice: பலமுறை உண்ணாமல் இருந்தது
  alternative: பலமுறை நோன்பிருந்தது; சூழ்நிலையால் உணவின்றி இருந்தது
  rationale: மூலச்சொல் நோன்பைக் குறிக்க வல்லது; ஆனால் அது தன்னார்வமான சமய நோன்பா அல்லது கட்டாய உணவின்மையா என்பதை உரை தீர்மானிக்கவில்லை. ‘பசி’ ஏற்கெனவே தனியாகக் குறிப்பிடப்பட்டிருப்பதையும் மதித்து, செயல் அல்லது நிலையின் காரணத்தை மொழிபெயர்ப்பு நிர்ணயிக்கவில்லை.
- issue: γυμνότητι என்பதன் பொருள்
  choice: போதிய உடையின்றி இருந்தது
  alternative: நிர்வாணம்
  rationale: குளிருடன் சேர்ந்துள்ள துன்பச் சூழலில் போதிய உடையின்மையே கருத்தாக இருக்கலாம். இருப்பினும் நேரடியான ‘நிர்வாணம்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் மீண்டும் வரும் ἐν அமைப்பைத் தமிழின் ‘-இலும்’ தொடர் பிரதிபலிக்கிறது. νηστείαις குறித்த காரணத் தெளிவின்மையும் γυμνότητι என்பதன் நேரடி மற்றும் சூழல்சார் பொருள் வேறுபாடும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன.
