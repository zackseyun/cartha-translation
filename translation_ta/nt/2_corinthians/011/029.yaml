    issue: The first rhetorical question has an inverted negation.
    rationale: ‘நானும் பலவீனமாகாமல் இருக்கிறேன்?’ communicates ‘and I am not weak,’ whereas Greek καὶ οὐκ ἀσθενῶ asks rhetorically, ‘and am I not weak?’ In context, Paul asserts empathetic participation in others’ weakness.
