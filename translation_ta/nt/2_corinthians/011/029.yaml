id: 2CO.11.29
reference: 2 Corinthians 11:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς ἀσθενεῖ, καὶ οὐκ ἀσθενῶ; τίς σκανδαλίζεται καὶ οὐκ ἐγὼ πυροῦμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: ta
  text: யார் பலவீனமாக இருக்கிறார், நானும் பலவீனமாக இருக்காமல் இருப்பேனா? யார் இடறச் செய்யப்படுகிறார், நான் பற்றி எரியாமல் இருப்பேனா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பற்றி எரிகிறேன்’ என்பது இங்கு உருவகமாக வருகிறது; அது கடும் துயரம், தீவிர அக்கறை அல்லது சினத்தால் உள்ளம் எரிவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: பலவீனமாக இருக்கிறார் / பலவீனமாகாமல் இருக்கிறேன்
  rationale: ἀσθενέω என்பது உடல், சமூக அல்லது ஆன்மிகப் பலவீனத்தைக் குறிக்கக்கூடிய பரந்த சொல். ‘நோயுற்றவர்’ போன்ற குறுகிய பொருளைத் தவிர்த்து, பவுல் பிறருடைய பலவீனத்தில் பங்குகொள்வதையும் இந்தத் தேர்வு வெளிப்படுத்துகிறது.
- source_word: σκανδαλίζεται
  choice: இடறச் செய்யப்படுகிறார்
  rationale: செயப்பாட்டு வடிவம் ஒருவர் தடுமாறவோ, பாவத்திற்கோ ஆன்மிக வீழ்ச்சிக்கோ இட்டுச் செல்லப்படுவதைக் குறிக்கிறது. ‘இடறச் செய்யப்படுகிறார்’ என்பது மூல உருவகத்தையும் விளைவின் தெளிவின்மையையும் காக்கிறது.
- source_word: πυροῦμαι
  choice: பற்றி எரிகிறேன்
  rationale: πυρόομαι என்பதன் நெருப்பு உருவகத்தை நேரடியாகக் காக்கிறது; அது கடும் துயரம், தீவிர அக்கறை அல்லது சினம் ஆகியவற்றில் எதைக் குறிப்பாகச் சுட்டுகிறது என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
- source_word: τίς
  choice: யார்
  rationale: ஆட்களைப் பற்றிய சொல்லாட்சிக் கேள்விகளுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: καὶ οὐκ ἐγὼ
  choice: நான் ... இல்லாமல் இருக்கிறேன்?
  rationale: ἐγώ தரும் வலியுறுத்தலை ‘நான்’ என்று வெளிப்படையாகக் கூறுவதன் மூலம் காத்து, தமிழில் சொல்லாட்சிக் கேள்வியாக இயல்பாக அமைக்கிறது.
theological_decisions:
- issue: πυροῦμαι என்பதில் பவுலின் உள்ளார்ந்த எதிர்வினையின் தன்மை
  choice: ‘பற்றி எரிகிறேன்’ என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘சினத்தால் கொதிக்கிறேன்’, ‘துயரத்தால் எரிகிறேன்’, அல்லது ‘உள்ளத்தில் தீவிரமாகக் கலங்குகிறேன்’
  rationale: பவுலின் ஆழ்ந்த ஒற்றுமை உணர்வையும் தீவிர உள்ளார்ந்த எதிர்வினையையும் வசனம் காட்டுகிறது; ஆனால் கிரேக்கச் சொல் அந்த உணர்ச்சியைச் சினம், துயரம் அல்லது வைராக்கியம் என்று ஒன்றாக மட்டும் வரையறுக்கவில்லை. ஆகவே அந்த இறையியல் மற்றும் மேய்ப்புப் பணிசார் பதற்றம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரு சொல்லாட்சிக் கேள்விகளின் இணையான அமைப்பு காக்கப்பட்டுள்ளது; ‘இடறச் செய்யப்படுகிறார்’ சற்றே முறையான சொற்றொடராக இருந்தாலும் கிரேக்கச் செயப்பாட்டையும் இடறல் உருவகத்தையும் தெளிவாகப் பாதுகாக்கிறது.
