id: 2CO.11.25
reference: 2 Corinthians 11:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: ta
  text: மும்முறை கோல்களால் அடிக்கப்பட்டேன்; ஒருமுறை கல்லெறியப்பட்டேன்; மும்முறை கப்பல் விபத்துக்குள்ளானேன்; ஓர் இரவும் ஒரு பகலும் ஆழ்கடலில்[a] கழித்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திறந்த கடலில்.”
    reason: βυθός என்பது இங்கு ஆழ்கடலை அல்லது கரையிலிருந்து விலகிய திறந்த கடலைக் குறிக்கலாம்; பவுல் எதில் அல்லது எவ்வாறு தங்கியிருந்தார் என்பதை மூலவாக்கியம் குறிப்பிடவில்லை.
lexical_decisions:
- source_word: τρὶς
  choice: மும்முறை
  rationale: இரு இடங்களிலும் மீண்டும் மீண்டும் நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἐραβδίσθην
  choice: கோல்களால் அடிக்கப்பட்டேன்
  rationale: ῥαβδίζω என்பதிலுள்ள கோலால் அடித்தல் என்ற குறிப்பிட்ட கருவிசார் பொருளை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: ἅπαξ
  choice: ஒருமுறை
  rationale: ஒரே தடவை நிகழ்ந்ததைத் தெளிவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐλιθάσθην
  choice: கல்லெறியப்பட்டேன்
  rationale: λιθάζω என்பதன் வன்முறைச் செயலைத் துல்லியமாகக் காட்டும் சுருக்கமான செயப்பாட்டு வடிவம்.
- source_word: ἐναυάγησα
  choice: கப்பல் விபத்துக்குள்ளானேன்
  rationale: ναυαγέω குறிக்கும் கப்பல் சிதைவு அல்லது கடற்பயணப் பேரிடரை இயல்பான தமிழில் தெரிவிக்கிறது; கப்பல் மூழ்கியது என்று தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: νυχθήμερον
  choice: ஓர் இரவும் ஒரு பகலும்
  rationale: இரவு-பகல் காலப்பகுதியை மூலத்தின் வரிசையோடு பாதுகாக்கிறது; ‘இருபத்து நான்கு மணி நேரம்’ என்ற மிகத் துல்லியமான நவீனமாக்கலைத் தவிர்க்கிறது.
- source_word: ἐν τῷ βυθῷ
  choice: ஆழ்கடலில்
  rationale: βυθός குறிக்கும் ஆழமான கடல் அல்லது திறந்த கடல் சூழலைச் சுருக்கமாகத் தருகிறது; சரியான நிலைமை பற்றிய தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: πεποίηκα
  choice: கழித்திருக்கிறேன்
  rationale: காலத்தைக் ‘கழித்தல்’ என்ற ποιέω-வின் இடியம்சார்ந்த பொருளையும் நிறைவேற்றுக் காலத்தின் பின்னோக்குப் பார்வையையும் இயல்பாக வெளிப்படுத்துகிறது.
