id: 2CO.11.22
reference: 2 Corinthians 11:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: ta
  text: அவர்கள் எபிரெயர்களா? நானும்தான். அவர்கள் இஸ்ரயேலர்களா? நானும்தான். அவர்கள் ஆபிரகாமின் சந்ததியா[a]? நானும்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆபிரகாமின் வித்து.” கிரேக்கத்தில் ஒருமை வடிவிலான கூட்டுப்பொருள் சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: எபிரெயர்கள்
  rationale: யூத மரபையும் பண்பாட்டு அடையாளத்தையும் குறிக்கும் நிறுவப்பட்ட பெயராக இருப்பதுடன், மற்ற இரு அடையாளச் சொற்களிலிருந்தும் வேறுபாட்டைக் காக்கிறது.
- source_word: κἀγώ
  choice: நானும்தான்
  rationale: καί + ἐγώ என்ற சுருக்கமான, வலியுறுத்தலுள்ள பதிலை இயல்பான தமிழில் தருகிறது; மூன்று முறை வரும் இறுக்கமான சொல்லாட்சியையும் காக்கிறது.
- source_word: Ἰσραηλῖται
  choice: இஸ்ரயேலர்கள்
  rationale: இஸ்ரயேல் மக்களைச் சேர்ந்தவர்கள் என்ற உடன்படிக்கை-மக்கள் அடையாளத்தைத் துல்லியமாகக் குறிக்கிறது; ‘எபிரெயர்கள்’ என்பதுடன் ஒன்றாக்கப்படவில்லை.
- source_word: σπέρμα Ἀβραάμ
  choice: ஆபிரகாமின் சந்ததி
  rationale: σπέρμα என்ற ஒருமை வடிவிலுள்ள கூட்டுப் பொருளை ‘சந்ததி’ இயல்பாகத் தாங்குகிறது. ‘வித்து’ மூல உருவகத்தை இன்னும் நேரடியாகக் காட்டுவதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰσιν
  choice: அவர்கள் … ஆ?
  rationale: திரும்பத் திரும்ப வரும் வினாவையும் அதற்கான சுருக்கமான பதிலையும் இயல்பான தமிழ் வினா அமைப்பில் காக்கிறது.
theological_decisions:
- issue: யூத அடையாளத்தைக் குறிக்கும் மூன்று சொற்களின் நுண்ணிய வேறுபாடு
  choice: ‘எபிரெயர்கள்,’ ‘இஸ்ரயேலர்கள்,’ ‘ஆபிரகாமின் சந்ததி’ என்ற மூன்று தனித்த அடையாளங்களையும் காத்தல்
  alternative: மூன்றையும் ‘யூதர்கள்’ அல்லது ‘ஆபிரகாமின் வழிவந்தவர்கள்’ போன்ற ஒரே பொதுப்பெயராக மாற்றுதல்
  rationale: பவுலின் வாதத்தில் மரபு, இஸ்ரயேல் மக்களுக்குரிய அடையாளம், ஆபிரகாமுடனான வம்சத் தொடர்பு ஆகிய ஒன்றோடொன்று தொடர்புடைய ஆனால் தனித்த உரிமைக் கூற்றுகள் அடுக்கப்படுகின்றன; அவற்றை ஒன்றாக்குவது சொல்லாட்சியின் வலிமையைக் குறைக்கும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, வலியுறுத்தலுள்ள வினா–பதில் நடையைப் பயன்படுத்துகிறது. ‘நானும்தான்’ என்ற மீளுரை மூலத்தின் கூர்மையான ஒத்திசைவை இயல்பாகக் காக்கிறது.
