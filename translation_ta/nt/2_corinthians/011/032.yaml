source:
  edition: SBLGNT
  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: ta
  text: தமஸ்குவில், அரேத்தா அரசனின் இன ஆட்சியாளர், என்னைப் பிடிப்பதற்காகத் தமஸ்குவாசிகளின் நகரத்தைக்[a] காவல் காத்துக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தமஸ்கு நகரத்தை.’ கிரேக்கத்தில் சொல்லுக்குச்சொல், ‘தமஸ்குவாசிகளின் நகரம்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: தமஸ்குவில்
  rationale: ἐν உடன் வரும் வேற்றுமை உருபு இடத்தைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான இடவுருவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐθνάρχης
  choice: இன ஆளுநர்
  rationale: ஒரு மக்கள் இனத்தையோ பிரதேசத்தையோ ஆளும் குறிப்பிட்ட வரலாற்றுப் பதவியைக் குறிக்கும் சொல்லின் தனித்துவத்தைப் பொதுவான ‘ஆளுநர்’ என்று மட்டும் சமப்படுத்தாமல் காக்கிறது.
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: அரேத்தா அரசனின்
  rationale: இன ஆளுநர் அரேத்தா அரசனுக்குரியவர் அல்லது அவரின் கீழ் பணியாற்றியவர் என்பதைக் காட்டும் கிரேக்க உடைமை வேற்றுமையை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: ἐφρούρει
  choice: காவல் காத்துக்கொண்டிருந்தார்
  rationale: இறந்த காலத்தில் தொடர்ந்த செயலைக் காட்டும் imperfect வினையின் கூறையும் கண்காணித்துப் பாதுகாக்கும் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: தமஸ்கு மக்களின் நகரத்தை
  rationale: ‘தமஸ்கு மக்களின் நகரம்’ என்ற கிரேக்கத்தின் பன்மை உடைமை அமைப்பைத் தக்கவைக்கிறது; இயல்பான ‘தமஸ்கு நகரம்’ என்ற வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πιάσαι με
  choice: என்னைப் பிடிப்பதற்காக
  rationale: காவல் காத்ததன் நோக்கத்தை infinitive தெரிவிக்கிறது; ‘கைது செய்ய’ என்பதைக் காட்டிலும் குறைவாக விளக்கமளிக்கும் பரந்த ‘பிடிக்க’ பயன்படுத்தப்பட்டுள்ளது.
