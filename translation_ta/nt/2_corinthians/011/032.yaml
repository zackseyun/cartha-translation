revisions:
- from: தமஸ்குவில், அரேத்தா அரசனின் இன ஆளுநர் என்னைப் பிடிப்பதற்காகத் தமஸ்கு மக்களின் நகரத்தைக்[a] காவல் காத்துக்கொண்டிருந்தார்.
  to: தமஸ்குவில், அரேத்தா அரசனின் இன ஆட்சியாளர், என்னைப் பிடிப்பதற்காகத் தமஸ்குவாசிகளின் நகரத்தைக்[a] காவல் காத்துக்கொண்டிருந்தார்.
  rationale: The revision retains every element of the Greek while improving the precision of the historical title and making the literal city expression and its explanatory footnote more natural in modern standard Tamil. The footnote continues to preserve the alternative conventional rendering, “the city of Damascus.”
