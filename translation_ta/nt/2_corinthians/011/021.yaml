  text: κατὰ ἀτιμίαν λέγω, ὡς ὅτι ἡμεῖς ⸀ἠσθενήκαμεν· ἐν ᾧ δ’ ἄν τις τολμᾷ, ἐν ἀφροσύνῃ λέγω, τολμῶ κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: ta
  text: 'எங்களுக்கு அவமானமாக இதைச் சொல்கிறேன்[a]: நாங்கள் பலவீனர்களாக இருந்ததுபோல்! ஆனால், எதில் யாராவது ஒருவர் துணிந்து பெருமைபாராட்டுகிறாரோ[b]—நான் மடமையாகப் பேசுகிறேன்—அதில் நானும் துணிகிறேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவமானப்படுத்தும் வகையில் இதைச் சொல்கிறேன்.” கிரேக்கச் சொற்றொடர் வழக்குச்சொற்றொடராக இருப்பதால், “அவமானமாக இதைச் சொல்கிறேன்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “எதில் யாராவது ஒருவர் துணிகிறாரோ.” சுற்றியுள்ள சூழலிலிருந்து “பெருமைபாராட்ட” என்பது வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: எங்களுக்கு அவமானம் உண்டாகும் விதமாகவே
  rationale: இந்த இடைச்சொற்றொடரின் கடினமான, சூழல்சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; பவுலையும் அவருடைய உடன் ஊழியர்களையும் பலவீனர்கள் எனக் கருதுவதிலுள்ள அவமானத்தைச் சுட்டுகிறது.
- source_word: ὡς ὅτι ἡμεῖς ἠσθενήκαμεν
  choice: நாங்கள் பலவீனர்களாக இருந்ததுபோல்
  rationale: ὡς ὅτι என்பதன் தோற்றம் அல்லது நையாண்டியான ஒப்புதலைக் காக்கிறது; ἠσθενήκαμεν இங்கு உடல்நோயை அல்ல, வலிமை அல்லது செல்வாக்குக் குறைவைச் சுட்டுகிறது.
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: எதில் ஒருவன் துணிந்து பெருமைபாராட்டுகிறானோ
  rationale: ἐν ᾧ என்பதன் ‘எந்த விஷயத்தில்’ என்ற பரப்பைத் தருவதோடு, முந்தைய வசனங்களின் பெருமைபாராட்டும் சூழலிலிருந்து விடுபட்ட செயப்படுபொருளைத் தெளிவுபடுத்துகிறது.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: நான் அறிவில்லாமல் பேசுகிறேன்
  rationale: பவுலின் சுயவிழிப்புள்ள சொல்லாட்சிசார் மறுப்புரையை நவீன, இயல்பான தமிழில் காக்கிறது; அவர் உண்மையில் அறிவற்றவர் என்ற நிலையான மதிப்பீடாக மாற்றவில்லை.
- source_word: τολμῶ κἀγώ
  choice: அதில் நானும் துணிகிறேன்
  rationale: முந்தைய τολμᾷ உடனான வினைச்சொல் மீளுருவை காக்கிறது; ‘அதில்’ என்பது தமிழ் மொழியில் தேவையான தொடர்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: பவுலின் ‘பலவீனம்’ குறித்த சொல்லாட்சிசார் நையாண்டி
  choice: ‘நாங்கள் பலவீனர்களாக இருந்ததுபோல்!’ என்று நையாண்டியான ஒப்புதலாக மொழிபெயர்த்தல்
  alternative: ‘நாங்கள் பலவீனர்களாக இருந்தோம்’ என்ற நேரடியான ஒப்புதலாக மொழிபெயர்த்தல்
  rationale: சுற்றியுள்ள ‘அறிவில்லாதவனின் பேச்சு’ மற்றும் எதிரிகளின் பெருமைபாராட்டல் ஆகிய சூழல்கள் இதை நையாண்டியான கூற்றாகக் காட்டுகின்றன. மொழிபெயர்ப்பு அந்த அழுத்தத்தைக் காக்கிறது; அதேவேளை கூடுதல் கோட்பாட்டு விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் வடிவமைக்கப்பட்டது. பவுலின் நையாண்டி, இடைச்செருகிய மறுப்புரை, மேலும் τολμᾷ / τολμῶ என்ற வினைச்சொல் ஒத்திசைவு இயன்றவரை காக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
