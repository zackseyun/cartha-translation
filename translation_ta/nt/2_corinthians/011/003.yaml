id: 2CO.11.3
reference: 2 Corinthians 11:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: ta
  text: ஆனால், பாம்பு தன் தந்திரத்தால் ஏவாளை ஏமாற்றியதுபோல, ஏதோ ஒரு விதத்தில் மேசியாவை நோக்கிய கபடமற்ற தன்மையிலிருந்தும், மேசியாவை நோக்கிய தூய்மையிலிருந்தும் உங்கள் சிந்தனைகள் சீர்கெடுக்கப்படுமோ என்று அஞ்சுகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: ஆனால், ... ஏதோ ஒரு விதத்தில் ... சீர்கெடுக்கப்படுமோ என்று அஞ்சுகிறேன்
  rationale: நிகழ்காலத்தில் தொடரும் பவுலின் அச்சத்தையும், μή πως குறிக்கும் நிகழக்கூடிய அபாயத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν
  choice: பாம்பு ... ஏவாளை ஏமாற்றியதுபோல
  rationale: ஆதியாகம நிகழ்வுக்கான குறிப்பைத் தெளிவாகப் பாதுகாத்து, ὡς குறிக்கும் ஒப்புமையையும் நேரடியாகத் தருகிறது.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: தன் தந்திரத்தால்
  rationale: πανουργία குறிக்கும் வஞ்சகமான சூழ்ச்சியையும், ἐν இங்கு குறிக்கும் கருவி அல்லது வழிமுறையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: உங்கள் சிந்தனைகள் ... சீர்கெடுக்கப்படுமோ
  rationale: φθαρῇ என்பதன் செயலப்பாட்டு வடிவத்தையும், மனம் அல்லது எண்ணப்போக்கு சேதமடையும் கருத்தையும் பாதுகாக்கிறது; νοήματα என்பதற்கு ‘சிந்தனைகள்’ இயல்பான பொருத்தம்.
- source_word: τῆς ἁπλότητος
  choice: கபடமற்ற தன்மை
  rationale: ἁπλότης இங்கு குறிக்கும் நேர்மை, எளிமை, இருமனமற்ற பற்றுறுதி ஆகிய பொருள் நிழல்களில், ‘கபடமற்ற தன்மை’ நவீனத் தமிழில் தெளிவாகவும் தேவையற்ற மடமைப் பொருளைத் தவிர்த்தும் உள்ளது.
- source_word: καὶ τῆς ἁγνότητος
  choice: தூய்மை
  rationale: ἁγνότης குறிக்கும் ஒழுக்க மற்றும் பற்றுறவுத் தூய்மையை அளவுக்கு மீறிக் குறுக்காமல் பொதுவாகப் பாதுகாக்கிறது.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: மேசியாவை நோக்கிய
  rationale: பெயர்ச்சொற்களை விளக்கும் கிரேக்க முன்னிடைச்சொல் தொடரின் திசை அல்லது பற்றுறவு உணர்வைப் பாதுகாக்கிறது; Χριστός இங்கு பட்டமாகப் புரிந்துகொள்ளப்படுகிறது.
theological_decisions:
- issue: Χριστόν என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός இயேசுவின் பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என்று வழங்கப்பட்டது; பெயர்போல மட்டும் ஒலிபெயர்ப்பதைத் தவிர்க்கிறது.
- issue: ἁπλότης என்பதன் பொருள்
  choice: கபடமற்ற தன்மை
  alternative: எளிமை; ஒருமனப்பட்ட பற்றுறுதி
  rationale: மூலச்சொல்லின் நேர்மை மற்றும் பிளவுபடாத பற்றுறவு ஆகிய நிழல்களைச் சூழலில் இயல்பாகத் தருகிறது; பிற உண்மையான பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: καὶ τῆς ἁγνότητος சேர்க்கப்பட வேண்டுமா
  choice: ‘தூய்மை’ என்பதை முதன்மை உரையில் சேர்த்தல்
  alternative: அதை விடுதல்
  rationale: SBLGNT முதன்மை உரையில் இச்சொற்றொடர் இருப்பதால் மொழிபெயர்க்கப்படுகிறது; அதை விடும் கையெழுத்துப் பிரதிகளின் வாசகம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: εἰς τὸν Χριστόν தொடரின் தொடர்பு
  choice: கபடமற்ற தன்மை மற்றும் தூய்மை இரண்டையும் ‘மேசியாவை நோக்கிய’ என விளக்குதல்
  alternative: பொதுவாக மேசியாவிடமிருந்து விலகுதல் என விரிவாகப் பொருள்கொள்ளுதல்
  rationale: கிரேக்கத்தில் இத்தொடர் முன்வரும் பண்புப் பெயர்ச்சொற்களின் தொகுதியை விளக்குகிறது; தமிழிலும் அந்தத் தொடர்பு வெளிப்படையாக வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ஆதியாகமக் குறிப்பும், பவுலின் அச்ச உணர்வும், மனச்சீர்கேட்டின் செயலப்பாட்டு வடிவமும் பாதுகாக்கப்பட்டுள்ளன.
