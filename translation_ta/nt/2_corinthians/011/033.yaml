  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: ta
  text: மதிலில் உள்ள ஒரு சாளரத்தின் வழியாக, ஒரு கூடையில் நான் கீழே இறக்கப்பட்டேன்; அவனுடைய கைகளிலிருந்து தப்பினேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கயிற்றால் பின்னப்பட்ட ஒரு கூடையில் நான் மதிலின் வழியாகக் கீழே இறக்கப்பட்டேன்.’
    reason: σαργάνη என்பது கயிறு அல்லது வேறு பின்னல் பொருளால் செய்யப்பட்ட கூடையைக் குறிப்பதாக இருக்கலாம்; இந்தச் சாத்தியமான பொருட்சார்ந்த நுணுக்கத்தை மாற்று மொழிபெயர்ப்பு பாதுகாக்கிறது.
lexical_decisions:
- source_word: θυρίδος
  choice: சாளரம்
  rationale: இந்தச் சொல் சாளரத்தையோ சிறிய திறப்பையோ குறிக்கலாம். இச்சூழலில் ‘சாளரம்’ என்பது இயல்பானதும் குறிப்பானதுமான தமிழ் இணைச்சொல்.
- source_word: σαργάνῃ
  choice: கூடை
  rationale: பின்னப்பட்ட கயிறு அல்லது பிரம்பு போன்ற பொருளால் செய்யப்பட்ட கொள்கலனை இச்சொல் குறிக்கிறது. பொருள் தெளிவாக இருக்க ‘கூடை’ என மொழிபெயர்க்கப்பட்டு, அதன் பொருட்சார்ந்த நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐχαλάσθην
  choice: நான் கீழே இறக்கப்பட்டேன்
  rationale: χαλάω என்பதன் இறப்புவினை வடிவம் இங்கு கயிறு போன்ற ஒன்றின் உதவியால் ஒருவரைக் கீழே இறக்குவதைக் குறிக்கிறது. ‘கீழே இறக்கப்பட்டேன்’ என்பது செயப்படுபொருள் நிலையையும் திசையையும் தெளிவாகக் காட்டுகிறது.
- source_word: διὰ τοῦ τείχους
  choice: மதிலின் வழியே
  rationale: மதிலிலிருந்த திறப்பின் வழியாகச் சென்றதையே இச்சொற்றொடர் குறிக்கிறது; மதிலின் பக்கமாகச் சென்றதாக அல்ல. மூலத்தில் ‘நகர மதில்’ என்று வெளிப்படையாக இல்லாததால் ‘மதில்’ மட்டுமே பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: அவனுடைய கைகளிலிருந்து தப்பினேன்
  rationale: ஒருவரின் பிடியிலிருந்து அல்லது அதிகாரத்திலிருந்து தப்புவதைச் சித்தரிக்கும் கிரேக்க மரபுத்தொடரின் உயிரோட்டத்தை இந்தத் தமிழ் வடிவம் காக்கிறது.
