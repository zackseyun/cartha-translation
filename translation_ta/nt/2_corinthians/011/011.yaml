  text: Why? Because I do not love you? God knows I do.
translation:
  language: ta
  text: ஏன்? நான் உங்களை நேசிக்கவில்லை என்பதாலா? கடவுளுக்குத் தெரியும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “கடவுள் அறிவார்.” முந்தைய வினாவுக்கான மறைந்துள்ள பதிலை கிரேக்க வாசகம் வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: ஏன்?
  rationale: காரணத்தை வினவும் சுருக்கமான சொல்லாட்சி; கிரேக்கத்தின் வினாவியல் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ὅτι
  choice: என்பதாலா?
  rationale: முந்தைய ‘ஏன்?’ என்பதற்கான சாத்தியமான காரணத்தை வினாவாக அறிமுகப்படுத்துகிறது; தமிழில் ‘என்பதாலா?’ என்பது உரையோட்டத்துக்கு இயல்பானது.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: நான் உங்களை நேசிக்கவில்லை
  rationale: மறுப்பையும் நேரடி செயப்படுபொருளையும் வெளிப்படையாகப் பாதுகாக்கிறது; ἀγαπάω என்பதற்கு பொதுவான ‘நேசிக்க’ பயன்படுத்தப்படுகிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: θεός என்பதற்கான இயல்பான, பொதுவான நவீனத் தமிழ் மொழிபெயர்ப்பு.
- source_word: οἶδεν
  choice: தெரியும்
  rationale: கிரேக்கத்தில் மறைபொருளை விரித்துச் சொல்லாமல் உள்ளபடியே ‘கடவுளுக்குத் தெரியும்’ என்று முடிக்கிறது.
theological_decisions:
- issue: இறுதி கூற்றில் மறைந்துள்ள நேர்மறையான பதிலை வெளிப்படையாகச் சேர்ப்பதா
  choice: கடவுளுக்குத் தெரியும்.
  alternative: நான் உங்களை நேசிக்கிறேன் என்பது கடவுளுக்குத் தெரியும்.
  rationale: கிரேக்கம் ‘கடவுள் அறிவார்’ என்று மட்டும் கூறி, சொல்லப்படாத பதிலை வாசகர் உணரும்படி விடுகிறது. அந்த உண்மையான மறைபொருளையும் சொல்லாட்சித் தீவிரத்தையும் பாதுகாப்பதற்காக தமிழிலும் அதை விரித்துச் சொல்லவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான சொல்லாட்சி. ‘நேசிக்க’ என்பது பொதுமக்களுக்கு இயல்பாகப் புரியும்; இறுதிக் கூற்றின் கிரேக்கச் சுருக்கமும் திட்டமிட்ட தெளிவின்மையும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளன.
