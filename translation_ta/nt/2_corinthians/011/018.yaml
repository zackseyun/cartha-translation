id: 2CO.11.18
reference: 2 Corinthians 11:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπεὶ πολλοὶ καυχῶνται ⸀κατὰ σάρκα, κἀγὼ καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/018.yaml
  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: ta
  text: பலர் மாம்சத்தின்படி[a] பெருமை பேசுவதால், நானும் பெருமை பேசுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனித அளவுகோல்களின்படி’ அல்லது ‘வெறும் மனித முறையில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: …வதால்
  rationale: இந்த இணைப்பு, பவுல் அடுத்ததாகக் கூறும் தீர்மானத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்த வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: πολλοὶ
  choice: பலர்
  rationale: எண்ணிக்கையைக் குறிக்கும் பெயரடை தமிழில் நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: καυχῶνται
  choice: பெருமை பேசுகிறார்கள்
  rationale: சூழலிலுள்ள முரண்பாடும் பவுலின் நையாண்டித் தொனியும் வெளிப்படும்படி, பொதுவாகப் புரியும் ‘பெருமை பேசு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: κατὰ σάρκα
  choice: மாம்சத்தின்படி
  rationale: இந்தச் சொற்றொடரின் பவுலுக்குரிய மொழிநடையையும் அதன் பொருள் சார்ந்த தெளிவின்மையையும் காக்கும் வகையில் ‘மாம்சம்’ முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது; சூழலுக்கேற்ற வழக்குச் சொல் மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: κἀγὼ
  choice: நானும்
  rationale: καί + ἐγώ என்பதிலுள்ள ஒப்புமையையும் வலியுறுத்தலையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: καυχήσομαι
  choice: பெருமை பேசுவேன்
  rationale: முந்தைய καυχῶνται என்பதோடு உள்ள சொல் மறுபயன்பாட்டைக் காத்து, பவுல் அறிவிக்கும் எதிர்காலச் செயலைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: κατὰ σάρκα என்பதில் σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: மாம்சத்தின்படி
  alternative: மனித அளவுகோல்களின்படி; வெறும் மனித முறையில்
  rationale: இங்கு உடலை மட்டும் குறிக்காமல், மனித அல்லது உலகியலான அடிப்படையில் பெருமை பேசுவதைக் குறிக்கலாம். இருப்பினும், அதை ஒரே விளக்கமாக முடிவுசெய்யாமல் பவுலின் ‘மாம்சம்’ என்ற சொல்லையும் அதன் இறையியல் பதற்றத்தையும் முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சத்தின்படி’ என்ற சற்றே செறிவான பவுலியச் சொற்றொடர் திட்டமிட்டு தக்கவைக்கப்பட்டு, அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
