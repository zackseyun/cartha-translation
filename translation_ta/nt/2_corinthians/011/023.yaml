  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: ta
  text: 'அவர்கள் மெசியாவின் ஊழியர்களா? பைத்தியக்காரனைப்போல் பேசுகிறேன்: நான் இன்னும் அதிகமாக மெசியாவின் ஊழியன்—உழைப்புகளில் மிகுதியாகவும், சிறைவாசங்களில் மிகுதியாகவும், அடிகளில் அளவுக்கு மிஞ்சியும், மரண ஆபத்துகளில் அடிக்கடியும் இருந்திருக்கிறேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “மரணங்களில் அடிக்கடி”; அதாவது, பலமுறை மரணத்தை நெருங்கிய அல்லது உயிருக்கு ஆபத்தான சூழ்நிலைகளில் இருந்தார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάκονοι
  choice: ஊழியர்கள்
  rationale: இச்சொல் சேவை செய்பவர்களைக் குறிக்கிறது. இங்கு போட்டி அப்போஸ்தலப் பணியாளர்களைப் பற்றிய ஒப்பீடு என்பதால், இயல்பான தமிழில் ‘ஊழியர்கள்’ பொருத்தமாக உள்ளது; பதவிப்பெயராகக் குறுக்கிவிடவில்லை.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: இவ்விடத்தில் Χριστός பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: παραφρονῶν λαλῶ
  choice: புத்தி மயங்கியவனைப்போல் பேசுகிறேன்
  rationale: பவுலின் தற்புகழ்ச்சி அறிவுக்குப் புறம்பான பேச்சைப் போல ஒலிப்பதை அவர் தாமே ஒப்புக்கொள்ளும் நயத்தையும், செயப்பெயரெச்சத்தின் ஒப்புமைத் தன்மையையும் இது காக்கிறது.
- source_word: ὑπὲρ ἐγώ
  choice: நான் அதற்கும் மேலானவன்
  rationale: கிரேக்கத்தின் சுருக்கமான ஒப்பீட்டை தமிழில் புரியும்படி வெளிப்படுத்துகிறது; ‘மெசியாவின் ஊழியன்’ என்ற முன் கருத்தே விடுபட்ட கூறாகப் புரிகிறது.
- source_word: ἐν κόποις περισσοτέρως
  choice: உழைப்புகளில் மிகுதியாகவும்
  rationale: κόπος கடினமான, களைப்பூட்டும் உழைப்பைக் குறிக்கிறது; περισσοτέρως ஒப்பீட்டு மிகுதியைத் தருகிறது.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: சிறைவாசங்களில் மிகுதியாகவும்
  rationale: பன்மை வடிவம் பலமுறை அனுபவித்த சிறையடைப்புகளைக் குறிக்கிறது; ‘சிறைவாசங்கள்’ அந்த நிகழ்வுத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: அடிகளில் அளவுக்கு மிஞ்சியும்
  rationale: πληγαῖς உடலில் விழுந்த அடிகள் அல்லது அடித்தல்களைக் குறிக்கிறது; ὑπερβαλλόντως சாதாரண அளவைத் தாண்டிய தீவிரத்தைச் சொல்கிறது.
- source_word: ἐν θανάτοις πολλάκις
  choice: மரண ஆபத்துகளில் அடிக்கடியும்
  rationale: சொற்சொல்லாக ‘மரணங்களில் அடிக்கடி’ என்ற விசித்திரமான பன்மை, பலமுறை மரணத்தை எதிர்கொண்ட நிலைகளையோ உயிருக்கு ஆபத்தான அனுபவங்களையோ குறிக்கிறது. இயல்பான தமிழுக்காக பொருள் வெளிப்படுத்தப்பட்டு, சொற்சொல் வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு Χριστός ஒரு பட்டமாகச் செயல்படுகிறது. ஆகவே அதன் பொருளைத் தெளிவாகக் காட்ட ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது; மரபான ‘கிறிஸ்து’ வாசிப்பை முதன்மைப்படுத்தவில்லை.
- issue: ἐν θανάτοις πολλάκις என்பதன் பொருள்
  choice: மரண ஆபத்துகளில் அடிக்கடியும்
  alternative: மரணங்களில் அடிக்கடியும்
  rationale: பன்மை வடிவத்தின் வலிமையை மறைக்காமல், தமிழில் இயல்பாக உயிருக்கு ஆபத்தான பல சந்தர்ப்பங்களை வெளிப்படுத்துகிறது. சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. பவுலின் கூர்மையான கேள்வி, தன்னைப் பற்றிய திடீர் ஒப்பீடு, துன்பங்களின் ஏறுமுகப் பட்டியல் ஆகியவை காக்கப்பட்டுள்ளன. பிரதான உரையில் உள்ள ஒரே அடிக்குறிப்பு குறியீடு [a] உரிய இடத்தில் இடம்பெற்றுள்ளது.
