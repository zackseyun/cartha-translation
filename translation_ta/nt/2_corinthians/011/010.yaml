reference: 2 Corinthians 11:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: ta
  text: மேசியாவின் உண்மை என்னில் இருக்கிறது என்பது எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாக, எனக்குரிய இந்தப் பெருமைபேச்சு அகாயாவின் பகுதிகளில் தடுத்து நிறுத்தப்படாது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின் உண்மை என்னில் இருக்கிறது.”
    reason: Χριστός என்பதற்கான மரபுவழி மொழிபெயர்ப்பையும், தொடக்கச் சொற்றொடரின் நேரடியான வடிவத்தையும் காட்டுகிறது.
  - marker: b
    text: “எனக்குரிய இந்தப் பெருமைபேச்சு தடுத்து நிறுத்தப்படாது” என்பதற்குப் பதிலாக, “என்னைப் பொறுத்தவரை இந்தப் பெருமைபேச்சு அடைக்கப்படாது” என்றும் மொழிபெயர்க்கலாம். கிரேக்க மரபுத்தொடர் கடினமானது.
    reason: εἰς ἐμὲ மற்றும் φραγήσεται ஆகியவற்றின் சொல்லியல் தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: மேசியாவின் உண்மை
  rationale: இறுதிநிலைத் தொடர் உறவு அல்லது உடைமையைச் சுட்டுவதாக இயல்பாகப் புரிந்துகொள்ளப்படுகிறது. Χριστός இங்கு பட்டப்பெயரின் வலிமையைக் கொண்டிருப்பதால் ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐν ἐμοὶ
  choice: என்னில் இருப்பது
  rationale: பவுலின் உறுதியான, ஆணையுறுதி போன்ற கூற்றை மேலதிக விளக்கமின்றி நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாக
  rationale: ὅτι இங்கு அறிக்கையின் உள்ளடக்கத்தை அறிமுகப்படுத்தினாலும், முழுத் தொடர் ஆணையுறுதி போன்ற அமைப்பாகச் செயல்படுகிறது. தமிழில் அதன் வலிமையை இயல்பாக வெளிப்படுத்த இவ்வமைப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: καύχησις
  choice: பெருமைபேச்சு
  rationale: பெருமை பேசும் செயல் அல்லது அதன் உள்ளடக்கம் ஆகிய இரண்டையும் குறிக்கக்கூடிய பெயர்ச்சொல் வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: φραγήσεται
  choice: தடுத்து நிறுத்தப்படாது
  rationale: φράσσω என்பதன் அடிப்படைப் பொருளான அடைத்தல் அல்லது தடுப்பதைப் பாதுகாக்கும் அதேவேளையில், இச்சூழலில் இயல்பான தமிழாக உள்ளது; செயப்பாட்டு வடிவமும் காக்கப்படுகிறது.
- source_word: εἰς ἐμὲ
  choice: எனக்குரிய
  rationale: சொல்லுக்குச் சொல் ‘என்னை நோக்கி’ என்பது இங்கு இயல்பற்றது. கடினமான கிரேக்க மரபுத்தொடரை, பவுலைச் சார்ந்த இந்தப் பெருமைபேச்சு என்ற பொருளில் சுருக்கமாக வழங்குகிறது.
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: அகாயாவின் பகுதிகளில்
  rationale: κλίμασι என்பதிலுள்ள பன்மை நுணுக்கத்தைப் பாதுகாத்து, மாகாணத்தின் பல பகுதிகளைக் குறிக்கிறது.
- source_word: Ἀχαΐας
  choice: அகாயா
  rationale: ரோம மாகாணத்தின் பெயருக்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு Χριστός பட்டமாகச் செயல்படுவதால் ‘மேசியா’ முதன்மைப்படுத்தப்பட்டது; தமிழில் மரபாகப் பயன்படும் ‘கிறிஸ்து’ மாற்றாகக் குறிப்பில் தரப்பட்டுள்ளது.
- issue: ἀλήθεια Χριστοῦ என்ற இறுதிநிலைத் தொடரின் உறவு
  choice: மேசியாவின் உண்மை
  alternative: மேசியாவைப் பற்றிய உண்மை
  rationale: மூலத்தில் உள்ள உடைமை/உறவு சார்ந்த தெளிவின்மையைத் தீர்மானமாக விரித்துரைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஆணையுறுதி போன்ற தொடக்க அமைப்பு இயல்பான தமிழ் ஒப்புமை வடிவில் தரப்பட்டுள்ளது; ‘பெருமைபேச்சு’ பவுலின் கருத்திலுள்ள இறையியல் நெருக்கடியை மென்மைப்படுத்தாமல் காக்கிறது.
