  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: ta
  text: நான் உங்களோடு இருந்தபோது எனக்குத் தேவை ஏற்பட்டிருந்தும், யாருக்கும் பாரமாக இருக்கவில்லை. ஏனெனில், மக்கெதோனியாவிலிருந்து வந்த சகோதரர்கள்[a] எனக்குக் குறைவாக இருந்ததை நிறைவு செய்தார்கள். எல்லா வகையிலும் நான் உங்களுக்குப் பாரமாகாமல் என்னைக் காத்துக்கொண்டேன்; இனியும் அவ்வாறே காத்துக்கொள்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பது கிரேக்கத்தில் ஆண்பால் பன்மைச் சொல். பவுல் இச்சொல்லைச் சில சூழல்களில் சக விசுவாசிகளைப் பொதுவாகக் குறிக்கவும் பயன்படுத்துகிறார்; ஆனால் இங்கு மக்கெதோனியாவிலிருந்து வந்த குறிப்பிட்ட உடனுழைப்பாளர்களைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: நான் உங்களோடு இருந்தபோது
  rationale: இப்பெயரெச்சத் தொடரின் காலச் சூழலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; பவுல் நேரில் அவர்களோடு இருந்ததையும் காக்கிறது.
- source_word: ὑστερηθεὶς
  choice: பற்றாக்குறையில் இருந்தும்
  rationale: சூழலில் இது பொருளாதார அல்லது வாழ்க்கைத் தேவையின் குறைவைச் சுட்டுகிறது. ‘இருந்தும்’ என்பது அந்த நிலையிலும் அவர் யாரையும் சார்ந்து பாரமாகவில்லை என்ற முரணை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: யாருக்கும் பாரமாக இருக்கவில்லை
  rationale: καταναρκάω இங்கு ஒருவர்மீது, குறிப்பாகப் பொருளாதார ரீதியில், பாரம் சுமத்துவதைக் குறிக்கிறது. தமிழ் வழக்கில் இத்தொடர் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τὸ γὰρ ὑστέρημά μου
  choice: என் பற்றாக்குறையை
  rationale: ὑστερηθεὶς என்பதோடு உள்ள சொற்பொருள் தொடர்பைக் காக்க அதே ‘பற்றாக்குறை’ என்ற சொல்லைப் பயன்படுத்துகிறது.
- source_word: προσανεπλήρωσαν
  choice: நிறைவுசெய்தார்கள்
  rationale: குறைவாயிருந்ததை நிரப்புதல் அல்லது தேவையானதை வழங்குதல் என்ற கூட்டுவினையின் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: οἱ ἀδελφοὶ
  choice: சகோதரர்கள்
  rationale: மூலத்தில் ஆண்பால் பன்மை உள்ளது. இச்சூழலில் மக்கெதோனியாவிலிருந்து வந்த குறிப்பிட்ட உடனுழைப்பாளர்களைக் குறிக்க வாய்ப்புள்ளதால் ஆண்பால் வடிவம் முதன்மை உரையில் காக்கப்படுகிறது.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: மக்கெதோனியாவிலிருந்து வந்த
  rationale: வருகையையும் அவர்கள் வந்த புவியியல் இடத்தையும் இயல்பான பெயரெச்சத் தொடராகத் தருகிறது.
- source_word: ἐν παντί
  choice: எல்லாவற்றிலும்
  rationale: செயலின் விரிவான, முழுமையான பரப்பை விளக்கத்தைச் சேர்க்காமல் காக்கிறது.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: நான் உங்களுக்குப் பாரமாகாதபடி என்னைக்
  rationale: ‘பாரமற்றவனாக’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட நவீனத் தமிழில் இயல்பாக உள்ளது; பொருளாதாரப் பாரம் என்ற சூழல்சார் கருத்தையும் காக்கிறது.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: காத்துக்கொண்டேன்; இனியும் அப்படியே காத்துக்கொள்வேன்
  rationale: கடந்த காலத்தில் நிலைநிறுத்திய நடைமுறையையும் எதிர்காலத்திலும் அதைத் தொடரும் உறுதியையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ἀδελφοὶ என்பதன் பாலினக் குறிப்பு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள் / சக விசுவாசிகள்
  rationale: பவுலின் பயன்பாட்டில் இச்சொல் சில இடங்களில் விசுவாசிகள் அனைவரையும் உள்ளடக்கலாம். ஆனால் இங்கு மக்கெதோனியாவிலிருந்து உதவியுடன் வந்த குறிப்பிட்ட நபர்களைக் குறிக்கிறது; மூல வடிவமும் ஆண்பால் பன்மையாக இருப்பதால் அதைப் பிரதான உரையில் காப்பது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. ‘பற்றாக்குறை’ என்ற சொல்லை இருமுறை பயன்படுத்தி ὑστερηθεὶς / ὑστέρημα ஆகிய மூலச் சொற்களின் தொடர்பு காக்கப்பட்டது; ‘பாரம்’ என்ற உருவகம் இரு இடங்களிலும் ஒரேபடியாகத் தொடரப்பட்டது.
