review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Paul's presence, material need, refusal to burden anyone, Macedonian assistance, and his past-and-future commitment. A small revision makes the supply of his lack more idiomatic and explicit in Tamil.
  naturalness: Most wording is clear modern Tamil. ‘என் பற்றாக்குறையை நிறைவுசெய்தார்கள்’ is understandable but less natural than expressing that the brothers supplied what was lacking to him. ‘எல்லா வகையிலும்’ is a more idiomatic comprehensive adverbial expression here.
  terminology: ‘பாரம்’ consistently and appropriately conveys the financial-burden sense of καταναρκάω / ἀβαρής. ‘சகோதரர்கள்’ correctly retains the masculine plural without asserting more than the context supports.
