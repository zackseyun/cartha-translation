lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: அடிக்கடி பயணங்களில்
  rationale: பயணங்கள் மீண்டும் மீண்டும் நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; கிரேக்கத்தின் பட்டியல் வடிவத்தையும் காக்கிறது.
- source_word: κινδύνοις
  choice: ஏற்பட்ட ஆபத்துகளில்
  rationale: மீண்டும் வரும் பன்மை இடவேற்றுமையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது. ஒவ்வொரு முறையும் இதைத் திரும்பச் சொல்வது கிரேக்கத்தின் திரட்டும் சொல்நயத்தைப் பாதுகாக்கிறது.
- source_word: ποταμῶν
  choice: ஆறுகளால்
  rationale: ஆபத்தின் மூலத்தை மட்டும் குறிப்பிடுகிறது; வெள்ளமா அல்லது ஆற்றைக் கடத்தலா என்பதை கிரேக்கத்தைப் போலவே தீர்மானிக்காமல் விடுகிறது.
- source_word: λῃστῶν
  choice: கொள்ளையர்களால்
  rationale: பயணச் சூழலில் λῃσταί குறிக்கும் கொள்ளையர்கள் அல்லது வழிப்பறிக்காரர்கள் என்ற பொருளை பொதுவாகப் புரியும் சொல்லில் தருகிறது.
- source_word: ἐκ γένους
  choice: என் சொந்த இனத்தாரால்
  rationale: பவுலின் சொந்த இன மக்களைக் குறிக்கும் γένος என்பதையும், அதைத் தொடர்ந்து வரும் பிற இனத்தாருடனான வேறுபாட்டையும் வெளிப்படுத்துகிறது; கிரேக்கத்தில் இல்லாத ‘யூதர்கள்’ என்ற பெயரை நேரடியாகச் சேர்ப்பதில்லை.
- source_word: ἐξ ἐθνῶν
  choice: பிற இனத்தாரால்
  rationale: பவுலின் சொந்த இனத்தாருக்கு எதிர்மறையாக நிறுத்தப்படும் யூதரல்லாத இன மக்களை, தமிழில் வழக்கமான வேதாகமச் சொல்லாட்சியில் குறிக்கிறது.
- source_word: ἐν πόλει
  choice: நகரத்தில்
  rationale: கிரேக்க ஒருமையையும் நகர்ப்புறச் சூழலையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐν ἐρημίᾳ
  choice: வனாந்தரத்தில்
  rationale: ἐρημία குறிக்கக்கூடிய வனாந்தரம், பாழ்நிலம், மனித நடமாட்டமற்ற பகுதி ஆகிய பரந்த கருத்தைத் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: ἐν θαλάσσῃ
  choice: கடலில்
  rationale: கடற்பயணத்திலோ கடலிலோ நேரிட்ட ஆபத்தை இயல்பாகக் குறிக்கிறது; அதன் துல்லிய இயல்பை நிர்ணயிக்கவில்லை.
- source_word: ἐν ψευδαδέλφοις
  choice: பொய்ச் சகோதரர்களிடையே
  rationale: ψευδάδελφοι என்பதன் சொற்பொருளையும் ஆண்பால் பன்மையையும் காக்கிறது; அவர்கள் உண்மையான விசுவாசிகளா என்பது பற்றிய விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்ப்பதில்லை.
theological_decisions:
- issue: ψευδαδέλφοις என்பதிலுள்ள பாலினத்தையும் சமய அடையாளத்தையும் மொழிபெயர்த்தல்
  choice: பொய்ச் சகோதரர்களிடையே
  alternative: பொய் விசுவாசிகளிடையே
  rationale: கிரேக்கம் இலக்கணரீதியாக ஆண்பால் பன்மையில் ‘பொய்ச் சகோதரர்கள்’ என்று கூறுகிறது. ‘விசுவாசிகள்’ என்பது சாத்தியமான விளக்கம் என்றாலும், மூலத்தில் உள்ள உறவுமுறைச் சொல்லை மாற்றிவிடும்.
- issue: ἐκ γένους மற்றும் ἐξ ἐθνῶν இடையிலான இன வேறுபாடு
  choice: என் சொந்த இனத்தார் / பிற இனத்தார்
  alternative: என் சொந்த மக்கள் / யூதரல்லாதவர்கள்
  rationale: இந்த இணைச்சொற்கள் மூலத்தின் இனக்குழு வேறுபாட்டைத் தெளிவாகக் காட்டுகின்றன; அதேவேளை முதல் சொற்றொடரில் மூலத்தில் வெளிப்படையாக இல்லாத ‘யூதர்கள்’ என்பதைக் கட்டாயமாகச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆபத்துகளில்’ என்ற மீளுரைத்தல் கிரேக்கத்தின் தீவிரமான பட்டியல் ஓசையைத் தக்கவைக்கிறது. வசனம் முந்தைய சூழலில் தொடரும் பட்டியலாக இருந்தாலும், தமிழில் வாக்கியம் நிறைவாக வாசிக்க ‘இருந்தேன்’ இறுதியில் வழங்கப்பட்டுள்ளது.
