revisions:
- from: அடிக்கடி பயணங்களில், ஆறுகளால் ஏற்பட்ட ஆபத்துகளில், கொள்ளையர்களால் ஏற்பட்ட ஆபத்துகளில், என் சொந்த இனத்தாரால்[a] ஏற்பட்ட ஆபத்துகளில், பிற இனத்தாரால் ஏற்பட்ட ஆபத்துகளில், நகரத்தில் ஏற்பட்ட ஆபத்துகளில், வனாந்தரத்தில் ஏற்பட்ட ஆபத்துகளில், கடலில் ஏற்பட்ட ஆபத்துகளில், பொய்ச் சகோதரர்களிடையே[b] ஏற்பட்ட ஆபத்துகளில் இருந்தேன்.
  to: அடிக்கடி பயணம் செய்தபோது, ஆறுகளால் ஏற்பட்ட ஆபத்துகளில், கொள்ளையர்களால் ஏற்பட்ட ஆபத்துகளில், என் சொந்த இனத்தாரால்[a] ஏற்பட்ட ஆபத்துகளில், புறஜாதியாரால் ஏற்பட்ட ஆபத்துகளில், நகரத்தில் ஏற்பட்ட ஆபத்துகளில், வனாந்தரத்தில் ஏற்பட்ட ஆபத்துகளில், கடலில் ஏற்பட்ட ஆபத்துகளில், பொய்ச் சகோதரர்களிடையே[b] ஏற்பட்ட ஆபத்துகளில் இருந்தேன்.
