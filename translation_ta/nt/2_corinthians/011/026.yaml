translation:
  language: ta
  text: அடிக்கடி பயணம் செய்தபோது, ஆறுகளால் ஏற்பட்ட ஆபத்துகளில், கொள்ளையர்களால் ஏற்பட்ட ஆபத்துகளில், என் சொந்த இனத்தாரால்[a] ஏற்பட்ட ஆபத்துகளில், புறஜாதியாரால் ஏற்பட்ட ஆபத்துகளில், நகரத்தில் ஏற்பட்ட ஆபத்துகளில், வனாந்தரத்தில் ஏற்பட்ட ஆபத்துகளில், கடலில் ஏற்பட்ட ஆபத்துகளில், பொய்ச் சகோதரர்களிடையே[b] ஏற்பட்ட ஆபத்துகளில் இருந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘என் சொந்த மக்களால்’ அல்லது ‘என் சொந்த நாட்டினரால்.’ கிரேக்கத்தில் சொல்லர்த்தமாக ‘[என்] இனத்தாரால்/மக்களால்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
