id: 2CO.11.13
reference: 2 Corinthians 11:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: ta
  text: ஏனெனில், இப்படிப்பட்டவர்கள் போலி அப்போஸ்தலர்கள், வஞ்சகப் பணியாளர்கள்; தங்களை மேசியாவின்[a] அப்போஸ்தலர்களாக வேடமிட்டுக்கொள்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின்.” Χριστός என்ற கிரேக்கப் பட்டப்பெயரை, பெயரைப் போலப் பயன்படுத்தப்படும் இடங்களில் “கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம்; இங்கு அதன் பட்டப்பெயர்ப் பொருளைப் பாதுகாக்க “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்தை விளக்கும் தொடர்பை இயல்பான தமிழில் குறிக்கிறது.
- source_word: τοιοῦτοι
  choice: இப்படிப்பட்டவர்கள்
  rationale: முன்னர் விவரிக்கப்பட்ட அதே வகையைச் சேர்ந்தவர்களைச் சுட்டுகிறது; பாலினத்தைத் தேவையின்றி வலியுறுத்தாமல் பன்மையைத் தெளிவாகத் தருகிறது.
- source_word: ψευδαπόστολοι
  choice: போலி அப்போஸ்தலர்கள்
  rationale: அப்போஸ்தலர்கள் என்று பொய்யாகத் தங்களைக் காட்டிக்கொள்பவர்கள் என்ற கூட்டுச்சொல்லின் பொருளை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐργάται δόλιοι
  choice: வஞ்சகமான வேலையாட்கள்
  rationale: அவர்களின் பணியே வஞ்சகத் தன்மையுடையது என்பதைக் காட்டும் பெயர்–பெயரடை அமைப்பைப் பாதுகாக்கிறது.
- source_word: μετασχηματιζόμενοι
  choice: வேடமிட்டுக்கொள்கிறார்கள்
  rationale: உள்ளார்ந்த மாற்றத்தைவிட, ஏமாற்றும் நோக்கில் வெளித்தோற்றத்தையோ அடையாளத்தையோ மாற்றிக் காட்டுவதைச் சூழலுக்கேற்ப தெரிவிக்கிறது.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: தங்களை மேசியாவின் அப்போஸ்தலர்களாக
  rationale: εἰς இங்கு ஏற்றுக்கொள்ளப்பட்ட தோற்றம் அல்லது பங்கைக் குறிக்கிறது; தமிழில் ‘தங்களை … ஆக’ என்பது இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός என்பதன் பட்டப்பெயர்ப் பொருளைத் தமிழில் பாதுகாக்கிறது; வேற்றுமை உறவை ‘மேசியாவின்’ என இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு அது அவருக்குரிய அல்லது அவரால் அனுப்பப்பட்ட அப்போஸ்தலர்கள் என்ற உறவைக் காட்டும் பட்டப்பெயராகச் செயல்படுகிறது. ‘மேசியா’ அதன் பொருளைப் பாதுகாக்கிறது; ‘கிறிஸ்து’ என்பதும் மரபான மாற்று.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க நடையைப் பயன்படுத்துகிறது. ‘அப்போஸ்தலர்’ என்ற பரவலாக அறியப்பட்ட திருச்சபைச் சொல்லைத் தக்கவைத்து, ‘வேடமிட்டுக்கொள்கிறார்கள்’ மூலம் வெளிப்புறமான ஏமாற்றுத் தோற்றத்தை இயல்பாகச் சொல்கிறது.
