  text: ἄλλας ἐκκλησίας ἐσύλησα λαβὼν ὀψώνιον πρὸς τὴν ὑμῶν διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/008.yaml
  text: I robbed other churches by accepting support for serving you,[a]
translation:
  language: ta
  text: உங்களுக்குப் பணிசெய்வதற்காக மற்ற திருச்சபைகளிடமிருந்து ஊதியம்[a] பெற்று, அவற்றைக் கொள்ளையடித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கூலி’ அல்லது ‘பொருளாதார உதவி.’
    reason: ὀψώνιον என்பது அடிப்படையில் ஊதியம் அல்லது கூலியைக் குறித்தாலும், இங்கு பணிக்காக வழங்கப்பட்ட பொருளாதார ஆதரவைக் குறிக்கிறது.
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: மற்ற திருச்சபைகள்
  rationale: பவுலின் பயன்பாட்டில் ἐκκλησία பொதுவாக உள்ளூர் கிறிஸ்தவ விசுவாசக் குழுக்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘திருச்சபைகள்’ இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் சொல்.
- source_word: ἐσύλησα
  choice: கொள்ளையடித்தேன்
  rationale: இந்த வலுவான வினைச்சொல் பறித்தல் அல்லது கொள்ளையிடுதல் என்ற பொருளைத் தருகிறது. மற்ற திருச்சபைகளின் உதவியைப் பெற்றதைப் பற்றி பவுல் பயன்படுத்தும் கூர்மையான மிகைப்படுத்தலையும் நையாண்டித் தொனியையும் இது காக்கிறது.
- source_word: λαβὼν
  choice: பெற்று
  rationale: இறந்தகாலப் பெயரெச்சம், அவர் எவ்வாறு மற்ற திருச்சபைகளைக் ‘கொள்ளையடித்தார்’ என்பதை விளக்குகிறது; ‘பெற்று’ என்பது அந்த உறவைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὀψώνιον
  choice: ஊதியம்
  rationale: ὀψώνιον என்பதன் நேரடிப் பொருள் ஊதியம் அல்லது கூலி; முதன்மை உரையிலேயே இதைத் தக்கவைப்பது கிரேக்கச் சொல்லின் பொருளையும் பவுலின் கூர்மையான சொல்லாட்சியையும் பாதுகாக்கிறது.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: உங்களுக்குப் பணிசெய்வதற்காக
  rationale: πρός உடன் வரும் இத்தொடர் நோக்கத்தைக் குறிக்கிறது; பவுல் கொரிந்தியருக்குச் செய்த பணிக்காக அந்த ஊதியத்தைப் பெற்றார் என்பதைக் குழப்பமின்றி இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மற்ற திருச்சபைகளிடமிருந்து பணம் பெற்றதைப் பற்றிய பவுலின் சொல்லாட்சியின் வலிமை
  choice: ‘அவற்றைக் கொள்ளையடித்தேன்’ என்ற தூண்டுதலான உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘அவற்றிடமிருந்து உதவி பெற்றேன்’ அல்லது ‘அவற்றுக்கு இழப்பு ஏற்படுத்தினேன்’ என்று மென்மையாக்குதல்
  rationale: சூழல் உண்மையான திருட்டைப் பற்றியது அல்ல; கொரிந்தியருக்குப் பணிசெய்யும்போது மற்ற திருச்சபைகளிடமிருந்து ஆதரவு பெற்றதைப் பவுல் மிகைப்படுத்தலுடனும் நையாண்டியாகவும் கூறுகிறார். வினைச்சொல்லை மென்மையாக்குவது அவரது வாதத்தின் கூர்மையை இழக்கச் செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கொள்ளையடித்தேன்’ என்ற வலுவான உருவகம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது; ‘பணிசெய்வதற்காக’ என்பது διακονία-வின் சேவைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
