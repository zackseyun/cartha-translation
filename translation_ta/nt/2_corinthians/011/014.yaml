source:
  edition: SBLGNT
  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: ta
  text: இதில் வியப்பொன்றுமில்லை; ஏனெனில் சாத்தானே ஒளியின் தூதனாக வேடமிட்டுக்கொள்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒளியின் தூதனாகத் தன் உருவத்தை மாற்றிக்கொள்கிறான்.” கிரேக்க வினை இன்னும் நேரடியாக “வடிவத்தை மாற்றிக்கொள்கிறான்” என மொழிபெயர்க்கப்படலாம்; இங்கு அது ஏமாற்றும் தோற்றத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐ θαῦμα
  choice: இதில் வியப்பொன்றுமில்லை
  rationale: முந்தைய வசனத்துடன் உள்ள தொடர்ச்சியையும், ‘இது வியப்புக்குரியதல்ல’ என்ற கிரேக்க மரபுத்தொடரின் இயல்பான பொருளையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: αὐτὸς γὰρ ὁ Σατανᾶς
  choice: ஏனெனில் சாத்தானே
  rationale: γὰρ தரும் காரணவிளக்கத்தை ‘ஏனெனில்’ காட்டுகிறது; αὐτός தரும் வலியுறுத்தலை ‘சாத்தானே’ இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: μετασχηματίζεται
  choice: வேடமிட்டுக்கொள்கிறான்
  rationale: சூழலில் இது உண்மையான இயல்பு மாற்றத்தைவிட ஏமாற்றும் வெளித்தோற்றத்தைச் சுட்டுகிறது. தமிழ் வாசகருக்கு ‘வேடமிட்டுக்கொள்கிறான்’ அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; சொல்லுக்குச் சொல் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰς ἄγγελον φωτός
  choice: ஒளியின் தூதனாக
  rationale: εἰς இங்கு ஏற்றுக்கொள்ளப்படும் தோற்றம் அல்லது வேடத்தைக் குறிக்கிறது; ‘-ஆக’ என்பது இயல்பான தமிழ் வடிவம். ἄγγελος இச்சூழலில் விண்ணுலகத் தூதனைக் குறிப்பதால் ‘தூதன்’ பொருத்தமானது; φωτός என்பதன் உருவகத்தை ‘ஒளியின்’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: சாத்தானின் தோற்ற மாற்றத்தின் தன்மை
  choice: ஏமாற்றும் வெளித்தோற்றத்தைக் குறிக்கும் வகையில் ‘வேடமிட்டுக்கொள்கிறான்’
  alternative: ‘ஒளியின் தூதனாகத் தன் உருவத்தை மாற்றிக்கொள்கிறான்’
  rationale: உடனடி சூழல் போலி அப்போஸ்தலர்களின் ஏமாற்றத்தைப் பற்றியது. ஆகவே முதன்மை உரை வெளித்தோற்ற வேடத்தை முன்னிறுத்துகிறது; ஆயினும் கிரேக்க வினையின் ‘வடிவத்தை மாற்றுதல்’ என்ற நேரடியான சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது; இயல்பிலேயே உண்மையான மாற்றம் நிகழ்கிறது என்ற மேலதிக மெய்யியல் முடிவை உரை திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘சாத்தானே’ வலியுறுத்தலை இயல்பாகத் தருகிறது; ‘ஒளியின் தூதன்’ மூலத்தின் உருவகத்தையும் சமயச் சூழலையும் காக்கிறது.
