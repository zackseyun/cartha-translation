  edition: SBLGNT
  text: ἡδέως γὰρ ἀνέχεσθε τῶν ἀφρόνων φρόνιμοι ὄντες·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/019.yaml
  text: For you gladly put up with fools[b][a], being wise yourselves.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் ஞானமுள்ளவர்களாய் இருந்து, மூடர்களை மகிழ்ச்சியுடன் சகித்துக்கொள்கிறீர்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மூடர்களைப் பொறுத்துக்கொள்கிறீர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'பவுல் இங்கே கிண்டலாகப் பேசுகிறார்: கொரிந்தியர் தங்களை ஞானமுள்ளவர்களாகக் கருதினாலும், மூடர்களை மகிழ்ச்சியுடன் சகித்துக்கொள்கிறார்கள்.'
    reason: cultural_note
lexical_decisions:
- source_word: ἡδέως
  choice: மகிழ்ச்சியுடன்
  rationale: ஒருவரை விருப்பத்தோடும் மனமுவந்தும் பொறுத்துக்கொள்வதைக் குறிக்கிறது; இங்கு பவுலின் கிண்டல் தொனியையும் தக்கவைக்கிறது.
- source_word: γὰρ
  choice: -ஏ
  rationale: முந்தைய கூற்றுக்கான விளக்கத் தொடர்பைத் தமிழில் இயல்பாகக் காட்ட வாக்கிய இறுதியிலுள்ள வலியுறுத்தும் ஏகாரம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀνέχεσθε
  choice: சகித்துக்கொள்கிறீர்கள்
  rationale: ஒருவரைத் தாங்கிக்கொள்வது அல்லது பொறுத்துக்கொள்வது என்ற பொருளை இயல்பான, சற்றுக் கூர்மையான நவீன தமிழில் தருகிறது.
- source_word: τῶν ἀφρόνων
  choice: மூடர்களை
  rationale: ஞானமுள்ளவர்கள் என்பதற்கு எதிர்மறையான நேரடி சொல்லாக இருந்து, கிரேக்கத்திலுள்ள சொல்லாட்சிசார் முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: φρόνιμοι
  choice: ஞானமுள்ளவர்களாய்
  rationale: விவேகமுள்ளவர் அல்லது புத்தியுள்ளவர் என்ற பொருள் சாத்தியமானாலும், ‘மூடர்கள்’ என்பதுடனான நேரடி முரண்பாட்டையும் கிண்டலையும் ‘ஞானமுள்ளவர்கள்’ தெளிவாகத் தக்கவைக்கிறது.
- source_word: ὄντες
  choice: இருந்து
  rationale: கிரேக்கப் பங்கேற்புவினையின் அமைப்பை இயல்பான தமிழில் தக்கவைத்து, அது காரணத்தையா விட்டுக்கொடுப்பையா குறிக்கிறது என்பதை மொழிபெயர்ப்பில் தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: கொரிந்தியரை நோக்கிய பவுலின் கிண்டல்
  choice: ‘மூடர்கள்’ மற்றும் ‘ஞானமுள்ளவர்கள்’ என்ற முரண்பாட்டாலும் ‘மகிழ்ச்சியுடன்’ என்ற சொல்லாலும் கிண்டலை மறைமுகமாகத் தக்கவைத்தல்
  alternative: ‘நீங்கள் அவ்வளவு ஞானமுள்ளவர்கள் அல்லவா!’ எனக் கிண்டலை வெளிப்படையாக விரித்துரைத்தல்
  rationale: கிரேக்க மூலத்தில் கிண்டல் வெளிப்படையான விளக்கமாக அல்ல, சொற்களின் முரண்பாட்டின் வழியே தெரிவிக்கப்படுகிறது; எனவே கூடுதல் விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அதன் இறுக்கத்தைப் பாதுகாப்பது சிறந்தது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பவுலின் கூர்மையான கிண்டல் தொனி மங்காத வகையிலும் அமைக்கப்பட்டது. ‘நீங்களோ’ மற்றும் இறுதி ஏகாரம் உரையின் வலியுறுத்தலையும் முந்தைய சூழலுடனான விளக்கத் தொடர்பையும் இயல்பாக வெளிப்படுத்துகின்றன.
