revisions:
- from: நீங்களோ ஞானமுள்ளவர்களாய் இருந்து, மூடர்களை மகிழ்ச்சியுடன் சகித்துக்கொள்கிறீர்களே![a][b]
  to: ஏனெனில், நீங்கள் ஞானமுள்ளவர்களாய் இருந்து, மூடர்களை மகிழ்ச்சியுடன் சகித்துக்கொள்கிறீர்கள்.[a][b]
  rationale: The revision explicitly renders γάρ as «ஏனெனில்», removes the unsupported contrast implied by «நீங்களோ», and retains the Greek participial wording without deciding whether it is causal or concessive. The cultural note has been narrowed to the irony present in the verse and no longer adds that the fools are leaders or describes their behavior.
  reviewer_model: gpt-5.6-terra
