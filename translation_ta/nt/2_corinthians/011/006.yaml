- from: நான் பேச்சில் பயிற்சியற்றவனாக இருந்தாலும்[a], அறிவில் அப்படியல்ல. மாறாக, எல்லா வகையிலும், எல்லாவற்றிலும், இதை உங்களுக்குத் தெளிவுபடுத்தியிருக்கிறோம்[b][c].
  to: நான் பேச்சில் பயிற்சியற்றவனாக இருந்தாலும்[a], அறிவில் அப்படியல்ல. உண்மையில், எல்லா வகையிலும், எல்லாவற்றிலும், நாங்கள் இதை உங்களிடம் வெளிப்படுத்தியிருக்கிறோம்[b][c].
  rationale: ‘மாறாக’ என்பதற்குப் பதிலாக ‘உண்மையில்’ பயன்படுத்தப்பட்டுள்ளது; இது இரண்டாவது ἀλλ’ என்பதன் வலியுறுத்தும், எதிர்மறையல்லாத பயன்பாட்டைத் தக்கவைக்கிறது. இறுதி வினைச்சொல் φανερώσαντες-இன் வெளிப்படுத்தும் பொருளை மேலும் நேரடியாகத் தர ‘வெளிப்படுத்தியிருக்கிறோம்’ என மாற்றப்பட்டுள்ளது. இரு பரந்த சொற்றொடர்களும் (‘எல்லா வகையிலும், எல்லாவற்றிலும்’) மற்றும் மூலத்தின் தீர்மானிக்கப்படாத தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
