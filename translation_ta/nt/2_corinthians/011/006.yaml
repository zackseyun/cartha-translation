id: 2CO.11.6
reference: 2 Corinthians 11:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: ta
  text: நான் பேச்சில் பயிற்சியற்றவனாக இருந்தாலும்[a], அறிவில் அப்படியல்ல. உண்மையில், எல்லா வகையிலும், எல்லாவற்றிலும், நாங்கள் இதை உங்களிடம் வெளிப்படுத்தியிருக்கிறோம்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேசுவதில் முறையான பயிற்சி பெறாதவனாக இருந்தாலும்.’ அதாவது, செம்மையான சொற்பொழிவுத் திறன் இல்லாதவனாக இருந்தாலும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எல்லா வகையிலும், எல்லாரிடையிலும் இதை உங்களிடம் வெளிப்படுத்தியிருக்கிறோம்.’ கிரேக்கச் சொற்றொடர் சுருக்கமாக இருப்பதால், ‘எல்லாவற்றிலும்’ என்பது எல்லா காரியங்களையோ, சூழ்நிலைகளையோ, மக்களையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘எல்லாவற்றிலும் நாங்கள் உங்களிடம் எல்லா வகையிலும் வெளிப்படையாக நடந்துகொண்டிருக்கிறோம்.’
    reason: previous_rendering
lexical_decisions:
- source_word: ἰδιώτης
  choice: பயிற்சியற்றவன்
  rationale: இங்கு பொதுவான அறியாமையை அல்ல, செம்மையான சொற்பொழிவுப் பயிற்சி இல்லாமையை இது குறிக்கிறது; அறிவுடன் வரும் எதிர்மறை ஒப்பீடும் இதை உறுதிப்படுத்துகிறது.
- source_word: τῷ λόγῳ
  choice: பேச்சில்
  rationale: λόγος இங்கு பேசும் திறன் அல்லது சொற்பொழிவு வழங்கும் முறை என்ற தளத்தைக் குறிக்கிறது. ‘பேச்சில்’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: γνώσει
  choice: அறிவில்
  rationale: பேச்சுத் திறனுடன் வேறுபடுத்தப்படும் கருத்தறிவை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: φανερώσαντες
  choice: தெளிவுபடுத்தியிருக்கிறோம்
  rationale: இறந்தகாலப் பங்கேற்பு வடிவிலுள்ள சொல் இங்கு பவுலும் அவருடைய உடன் ஊழியர்களும் இதை வெளிப்படையாகக் காட்டியுள்ளனர் என்ற உறுதிப்பாட்டைத் தருகிறது.
- source_word: ἐν παντί
  choice: எல்லா வகையிலும்
  rationale: செயல் எவ்வளவு முழுமையாக வெளிப்படுத்தப்பட்டது என்பதைக் காட்டும் வினையடைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν πᾶσιν
  choice: எல்லாவற்றிலும்
  rationale: மூலத்தின் பரந்த, சுருக்கமான சொல்லாட்சியை மனிதர்கள் அல்லது சூழ்நிலைகள் என்று ஒருபக்கமாகக் கட்டுப்படுத்தாமல் காக்கிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்கு
  rationale: வெளிப்படுத்தப்பட்டதன் பெறுநர்களாக கொரிந்தியர்களைச் சுட்டும் திசைப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பேச்சுத் திறனைப் பற்றிய பவுலின் சுயவிவரிப்பின் பொருள்
  choice: பவுல் செம்மையான சொற்பொழிவுப் பயிற்சி தமக்கு இல்லாமலிருக்கலாம் என்பதை ஏற்கிறார்; ஆனால் அறிவு தமக்கு இல்லை என்பதை மறுக்கிறார்.
  alternative: பவுல் பொதுவாகக் கல்வியறிவற்றவர்; அல்லது எந்தக் குறையையும் ஏற்காமல் முழுக்க நையாண்டியாக மட்டுமே பேசுகிறார்.
  rationale: ‘பேச்சில்’ என்பதற்கும் ‘அறிவில்’ என்பதற்கும் இடையிலான நேரடி வேறுபாடு, விவாதம் அதிகாரம் அல்லது உண்மையைவிடப் பேச்சின் செம்மையைப் பற்றியது என்பதைக் காட்டுகிறது.
- issue: ἐν παντί ... ἐν πᾶσιν என்ற இரட்டைச் சொற்றொடரின் தொடர்பு
  choice: ‘எல்லா வகையிலும், எல்லாவற்றிலும்’ என்று இரண்டையும் தனித்தனியாக வைத்துப் பரந்த வலியுறுத்தலைக் காக்கிறது.
  alternative: ‘எல்லாரிடையிலும்’ அல்லது ‘எல்லாச் சூழ்நிலைகளிலும்’ என்று இரண்டாவது சொற்றொடரை குறிப்பிட்ட ஒரு பொருளுக்குள் வரையறுப்பது.
  rationale: கிரேக்கச் சொற்றொடர் சுருக்கமாகவும் ஒன்றுக்கு மேற்பட்ட நெருங்கிய விளக்கங்களுக்கு இடமளிப்பதாகவும் உள்ளது; ஆகவே முதன்மை உரை அதைத் தேவையின்றித் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பயிற்சியற்றவன்’ என்பது இழிவான ‘அறிவில்லாதவன்’ என்ற எண்ணத்தைத் தவிர்த்து, சொற்பொழிவுப் பயிற்சி குறித்த சூழலைத் தெளிவாக்குகிறது. இறுதிப் பகுதியின் கிரேக்கச் சுருக்கமும் பொருள் இரட்டுறலும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
