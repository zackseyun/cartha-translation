source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: ta
  text: ஆகவே, அவனுடைய பணியாளர்களும் நீதிமையின்[a] பணியாளர்களாக வேடமிட்டுக்கொள்வது வியப்புக்குரியதல்ல. அவர்களுடைய முடிவு அவர்களுடைய செயல்களுக்கு ஏற்றபடி இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதியின் பணியாளர்கள்’ என்றும் மொழிபெயர்க்கலாம். δικαιοσύνη என்ற கிரேக்கச் சொல் ‘நீதிமை’ அல்லது ‘நீதி’ எனப் பொருள்படலாம்; இங்கு சரியானதோடு இணைந்திருப்பவர்கள்போல் அவர்கள் தோன்றுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: அது வியப்புக்குரியதல்ல
  rationale: இந்தச் சொற்றொடர், ஒன்று பெரியதோ குறிப்பிடத்தக்கதோ அல்ல என்பதைவிட, முந்தைய வசனத்தின் பின்னணியில் அது ஆச்சரியமல்ல என்பதைக் குறிக்கிறது. இத்தமிழாக்கம் அந்த இடைச்சொல் பொருளை இயல்பாகத் தருகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்திலிருந்து வரும் முடிவுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: διάκονοι
  choice: பணியாளர்கள்
  rationale: இங்கு சாத்தானுக்குச் சேவை செய்யும் முகவர்களைக் குறிக்கிறது. ‘ஊழியர்கள்’ என்பது திருச்சபைப் பதவியைத் தவறாக நினைவூட்டக்கூடும்; ‘பணியாளர்கள்’ சேவை உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μετασχηματίζονται
  choice: வேடமிட்டுக்கொண்டால்
  rationale: உள்ளார்ந்த மாற்றத்தையல்ல, ஏமாற்றும் நோக்கில் வெளித்தோற்றத்தையும் அடையாளத்தையும் மாற்றிக் காட்டுவதை இவ்வினைச்சொல் குறிக்கிறது.
- source_word: ὡς
  choice: ஆக
  rationale: அவர்கள் ஏற்றுக்கொள்வதாகக் காட்டும் போலியான பங்கையோ அடையாளத்தையோ நேரடியாகக் குறிக்கிறது.
- source_word: δικαιοσύνης
  choice: நீதியின்
  rationale: δικαιοσύνη என்பதன் பவுலிய பயன்பாட்டில் நேர்மை, சரியான நிலை, நீதி ஆகிய பொருள் நிழல்கள் உள்ளன. ‘நீதி’ இங்கு நெறிசார்ந்த சரித்தன்மையின் தோற்றத்தைச் சுருக்கமாகக் காட்டுகிறது; ‘நியாயம்’ அடிக்குறிப்பில் மாற்றாகப் பாதுகாக்கப்படுகிறது.
- source_word: τὸ τέλος
  choice: அவர்களுடைய முடிவு
  rationale: அவர்களுக்கு இறுதியில் நேரவிருக்கும் விளைவையோ கதியையோ தீர்ப்புப் பின்னணியில் குறிக்கிறது.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: அவர்களுடைய செயல்களுக்கு ஏற்றபடி
  rationale: இறுதி விளைவு அவர்களுடைய செயல்களோடு பொருந்தும் என்ற தீர்ப்புச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பவுலின் δικαιοσύνη என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: இங்கு அவர்கள் உண்மையில் நீதிமான்கள் என்று உரை கூறவில்லை; சரியானதோடு இணைந்தவர்கள்போல் தங்களைக் காட்டிக்கொள்கிறார்கள். ‘நீதி’ அந்த நெறிசார்ந்த பொருளைத் தக்கவைக்கிறது; நீதித்துறை அல்லது சமநியாயப் பொருள் சாத்தியத்தை ‘நியாயம்’ என்ற மாற்று வாசகம் பாதுகாக்கிறது.
- issue: κατὰ τὰ ἔργα αὐτῶν என்பதில் தீர்ப்பின் அடிப்படை அல்லது ஒப்புமை
  choice: அவர்களுடைய செயல்களுக்கு ஏற்றபடி
  alternative: அவர்களுடைய செயல்களின்படி
  rationale: கிரேக்கம் முடிவுக்கும் செயல்களுக்கும் உள்ள பொருத்தத்தைச் சொல்கிறது. அதற்கு அப்பால் இரட்சிப்பு அல்லது தகுதி குறித்த ஒரு முறையியலை இந்த மொழிபெயர்ப்பு சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணியாளர்கள்’ என்பது தேவையற்ற திருச்சபைப் பதவிப் பொருளைத் தவிர்க்கிறது; ‘வேடமிட்டுக்கொண்டால்’ என்பது வெளிப்புற ஏமாற்றுத் தோற்றத்தைத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
