revisions:
- from: ஆகவே, அவனுடைய பணியாளர்களும் நீதியின்[a] பணியாளர்களாக வேடமிட்டுக்கொண்டால், அது வியப்புக்குரியதல்ல. அவர்களுடைய முடிவு அவர்களுடைய செயல்களுக்கு ஏற்றபடி இருக்கும்.
  to: ஆகவே, அவனுடைய பணியாளர்களும் நீதிமையின்[a] பணியாளர்களாக வேடமிட்டுக்கொள்வது வியப்புக்குரியதல்ல. அவர்களுடைய முடிவு அவர்களுடைய செயல்களுக்கு ஏற்றபடி இருக்கும்.
  rationale: The revision distinguishes righteousness (‘நீதிமை’) from the possible justice sense (‘நீதி’) while retaining the latter in an anchored lexical footnote. It also improves the idiomatic rendering of οὐ μέγα οὖν εἰ without adding interpretation. The outcome remains expressed as corresponding to their works.
