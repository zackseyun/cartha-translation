source:
  edition: SBLGNT
  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: ta
  text: ஏனெனில், ஒருவன் உங்களை அடிமைப்படுத்தினால், ஒருவன் உங்களை விழுங்கினால், ஒருவன் உங்களிடமிருந்து எடுத்துக்கொண்டால்[a], ஒருவன் தன்னை உயர்த்திக்கொண்டால், ஒருவன் உங்கள் முகத்தில் அடித்தால், நீங்கள் பொறுத்துக்கொள்கிறீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “ஒருவன் உங்களைச் சுரண்டினால்” அல்லது “ஒருவன் உங்களிடமிருந்து பறித்துக்கொண்டால்.” கிரேக்கச் சொல் நேரடியாக “எடுக்கிறான்” என்று பொருள்படும்; இங்கு அது சுரண்டலைக் குறிப்பதாக இருக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்புகள்: “நீங்கள் சகித்துக்கொள்கிறீர்கள்” அல்லது “நீங்கள் தாங்கிக்கொள்கிறீர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: நீங்கள் பொறுத்துக்கொள்கிறீர்கள்
  rationale: நிகழ்காலத்தில் கொரிந்தியர்கள் உண்மையாகவே காட்டும் சகிப்புத்தன்மையைச் சுட்டுகிறது; கண்டனமும் ஏளனமும் கலந்த தொனியையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துடன் உள்ள விளக்கத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: καταδουλοῖ
  choice: அடிமைப்படுத்தினாலும்
  rationale: ஒருவரை அடிமைத்தனத்திற்கோ முழுக் கீழ்ப்படிதலுக்கோ கொண்டுவரும் வலுவான பொருளை மென்மைப்படுத்தாமல் தருகிறது.
- source_word: κατεσθίει
  choice: விழுங்கினாலும்
  rationale: சுரண்டலைக் குறிக்கும் உயிர்ப்புள்ள வேட்டையாடும் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: λαμβάνει
  choice: உங்களிடமிருந்து பறித்துக்கொண்டாலும்
  rationale: வெறும் ‘எடுக்கிறான்’ என்பதைவிட சூழலில் உள்ள சுரண்டல் நிழற்பொருளை இயல்பாக வெளிப்படுத்துகிறது; குறிப்பாகப் பணம் என்று வரையறுக்கவில்லை.
- source_word: ἐπαίρεται
  choice: தன்னையே உயர்த்திக்கொண்டாலும்
  rationale: தற்பெருமையுடன் தன்னை உயர்த்தும் இடை/செயப்பாட்டு வடிவின் தன்னிலை நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: உங்கள் முகத்தில் அடித்தாலும்
  rationale: முகத்தில் தாக்கும் அவமானகரமான நேரடி செயலைக் காட்டுகிறது; ‘அறைதல்’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: εἴ τις
  choice: ஒருவன் … ஆனாலும்
  rationale: மீண்டும் மீண்டும் வரும் நிபந்தனை அமைப்பையும் அதன் சொல்லாட்சிசார் வலிமையையும் தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: பவுலின் கூற்றிலுள்ள ஏளனக் கண்டனம்
  choice: கொரிந்தியர்கள் தங்களைத் துன்புறுத்துவோரைக் பொறுத்துக்கொள்வதைச் சுட்டும் ஏளனக் கண்டனமாக மொழிபெயர்க்கப்பட்டது; துன்புறுத்துவோரை முதன்மை உரையில் பெயரிட்டு விளக்கவில்லை.
  alternative: ‘பொய்யப்போஸ்தலர்கள்’ அல்லது ‘பொய்ப் போதகர்கள்’ என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: சூழல் அந்த அடையாளத்தை ஆதரித்தாலும், இவ்வசனத்தின் கிரேக்க உரை அவர்களுடைய செயல்களை மட்டுமே பட்டியலிடுகிறது. எனவே விளக்கத்தை உரைக்குள் இறக்காமல் இறையியல் பதற்றமும் சொல்லாட்சியும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் அமைக்கப்பட்டது. ஐந்து முறை வரும் εἴ τις அமைப்பு ‘ஒருவன் … ஆனாலும்’ என மீட்டுரைக்கப்பட்டு சொற்பொழிவின் படிப்படியான அழுத்தம் காக்கப்பட்டது; இறுதி பிரதான வினை இயல்பான தமிழ் வாக்கிய அமைப்புக்கேற்ப முடிவில் வைக்கப்பட்டது.
