  source_fidelity: திருத்தம் தேவை. கிரேக்கத்தில் வரும் εἴ τις என்பது ஒவ்வொரு முறையும் நிபந்தனைப் பொருளான “ஒருவன் … செய்தால்” என்பதாகும்; வரைவில் உள்ள “...ஆனாலும்” சலுகை/முரண்பாட்டுப் பொருளைச் சேர்க்கிறது. மேலும் λαμβάνει என்பதன் வெளிப்படையான பொருள் “எடுக்கிறான்”; “பறித்துக்கொள்கிறான்” என்பது சூழலுக்குப் பொருந்தக்கூடிய சுரண்டல் நிழற்பொருளை முதன்மை உரையில் அதிகமாக உறுதிப்படுத்துகிறது.
  naturalness: திருத்திய உரை நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ஐந்து நிபந்தனைத் தொடர்களுக்குப் பின் வரும் பிரதான வினை இறுதியில் இருப்பது தமிழ்நடைக்கு ஏற்றது; மீளுரையும் மூலத்தின் சொல்லாட்சிசார் அழுத்தத்தைத் தக்கவைக்கிறது.
