id: 2CO.11.4
reference: 2 Corinthians 11:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: ta
  text: ஏனெனில், யாராவது வந்து, நாங்கள் அறிவிக்காத வேறொரு இயேசுவை அறிவிக்கிறார் என்றால், அல்லது நீங்கள் பெறாத வேறொரு ஆவியைப் பெறுகிறீர்கள் என்றால், அல்லது நீங்கள் ஏற்றுக்கொள்ளாத வேறொரு நற்செய்தியை ஏற்றுக்கொள்கிறீர்கள் என்றால், அவரை நீங்கள் நன்றாகவே சகித்துக்கொள்கிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நன்றாகவே சகித்துக்கொள்கிறீர்கள்” என்பது இங்கு நையாண்டியாக இருக்கலாம்; இத்தகைய அறிவிப்பாளர்களை கொரிந்தியர்கள் மிக எளிதாகச் சகித்துக்கொண்டதைப் பவுல் கடிந்துகொள்கிறார்.
    reason: tone_and_ambiguity
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: யாராவது வந்து
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை இங்கு பொதுவாக வருகிற ஒருவரைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் அதன் குறிப்பிடப்படாத தன்மையை இவ்வாறு காக்கலாம்.
- source_word: ἄλλον Ἰησοῦν
  choice: வேறொரு இயேசுவை
  rationale: அதே ‘இயேசு’ என்ற பெயரில் மாறுபட்ட ஒருவரைப் பற்றிய போட்டிப் பிரசங்கத்தைப் பவுல் எச்சரிக்கிறார்; ‘வேறொரு’ என்பது அந்தத் தொடர்பையும் வேறுபாட்டையும் காக்கிறது.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: அறிவித்தால் / அறிவிக்காத
  rationale: κηρύσσω பொதுவெளியில் பிரகடனம் செய்வதைக் குறிக்கிறது. ‘அறிவி’ என்பது நவீனத் தமிழில் இயல்பாகவும், வெறும் போதித்தலைவிட விரிவாகவும் உள்ளது.
- source_word: πνεῦμα ἕτερον
  choice: வேறொரு ஆவி
  rationale: ἕτερος இங்கு முன்பு பெற்ற ஆவியிலிருந்து மாறுபட்டதைக் காட்டுகிறது. அது எந்த வகையான ஆவி என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
- source_word: λαμβάνετε / ἐλάβετε
  choice: பெற்றால் / முன்பு பெற்றிராத
  rationale: λαμβάνω வழங்கப்பட்டதையோ அருளப்பட்டதையோ பெறுவதைக் குறிக்கிறது. அடுத்துள்ள δέχομαι என்பதிலிருந்து தமிழிலும் சொல்வேறுபாடு காக்கப்படுகிறது; ‘முன்பு’ என்பது இறந்தகால எதிர்மறையின் காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὐαγγέλιον ἕτερον
  choice: வேறொரு நற்செய்தி
  rationale: εὐαγγέλιον என்பதற்கான தெளிவான, வழக்கமான தமிழ்ச் சொல் ‘நற்செய்தி’; ἕτερον காட்டும் வேறுபாட்டை ‘வேறொரு’ வெளிப்படுத்துகிறது.
- source_word: ἐδέξασθε
  choice: ஏற்றுக்கொள்ளாத
  rationale: δέχομαι வரவேற்று ஏற்றுக்கொள்வதைக் குறிக்கலாம். ‘ஏற்றுக்கொள்’ என்பது முந்தைய λαμβάνω-வுக்கான ‘பெறு’ என்பதிலிருந்து பொருத்தமான வேறுபாட்டைக் காக்கிறது.
- source_word: καλῶς ἀνέχεσθε
  choice: நீங்கள் அதை நன்றாகவே பொறுத்துக்கொள்கிறீர்கள்!
  rationale: ἀνέχομαι என்பது சகித்துக்கொள்வது அல்லது அனுமதித்துப் பொறுத்துக்கொள்வது. καλῶς உடன் இது சூழலில் கடிந்துகொள்ளும் நையாண்டியாக உள்ளது; ‘நன்றாகவே’ மற்றும் வியப்புக்குறி அந்தத் தொனியை உணர்த்துகின்றன.
- source_word: εἰ μὲν γὰρ
  choice: ஏனெனில், ... என்றால்
  rationale: γάρ முந்தைய வாதத்திற்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; εἰ நிபந்தனையை அமைக்கிறது. தமிழில் இயல்பான வாத ஓட்டத்தோடு இரண்டும் வெளிப்படுகின்றன.
theological_decisions:
- issue: ‘வேறொரு ஆவி’ என்பதன் குறிப்பு
  choice: எந்த வகையான ஆவி என்று வரையறுக்காமல் பொதுவாக ‘வேறொரு ஆவி’ என மொழிபெயர்க்கப்பட்டது.
  alternative: தவறாகச் சித்தரிக்கப்பட்ட பரிசுத்த ஆவி; தீய ஆவி; வேறுபட்ட ஆன்மிக மனப்பான்மை அல்லது அனுபவம்
  rationale: πνεῦμα ἕτερον என்ற கிரேக்கச் சொற்றொடர் பரந்த பொருளுடையது; உடனடிச் சூழல் அதன் குறிப்பைத் தீர்மானிக்கவில்லை. ஆகவே மூலத்தின் இறையியல் தெளிவின்மை காக்கப்படுகிறது.
- issue: καλῶς ἀνέχεσθε என்பதன் தொனி
  choice: கொரிந்தியரின் அளவுகடந்த சகிப்பைச் சுட்டும் நையாண்டிக் கடிந்துகொள்ளலாக மொழிபெயர்க்கப்பட்டது.
  alternative: நேரடியான பாராட்டு; நடுநிலையான கவனிப்பு
  rationale: சூழலில் பவுல் போட்டிப் போதகர்களை ஏற்றுக்கொண்டதற்காக அவர்களைப் பாராட்டவில்லை; அவர்களின் ஆயத்தமான சகிப்பை விமர்சிக்கிறார்.
- issue: ἀνέχεσθε என்பதன் வெளிப்படாத செயப்படுபொருள்
  choice: முந்தைய மூன்று மாற்றுப் பிரசங்கங்களையும் மொத்தமாகக் குறிக்கும் ‘அதை’ பயன்படுத்தப்பட்டது.
  alternative: அந்த வருகிற நபரைப் பொறுத்துக்கொள்கிறீர்கள்; செயப்படுபொருளைக் குறிப்பிடாமல் விடுதல்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை. தமிழில் வாக்கியம் இயல்பாக இருக்க ‘அதை’ சேர்க்கப்பட்டது; அது ஒரே ஒரு குறிப்பைத் தேவையின்றி நிர்ணயிக்காமல் முன்கூறிய நிலைமையை மொத்தமாகச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பெறு’ மற்றும் ‘ஏற்றுக்கொள்’ மூலம் λαμβάνω/δέχομαι வேறுபாடு காக்கப்பட்டுள்ளது. ‘வேறொரு’ என்ற ஒரே இயல்பான தமிழ்ச் சொல் ἄλλος மற்றும் ἕτερος இரண்டிற்கும் பயன்படுத்தப்பட்டாலும், சூழலிலுள்ள மாறுபாட்டு வலிமை தெளிவாக உள்ளது.
