  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: ta
  text: கடிதங்கள் மூலம் உங்களைப் பயமுறுத்துவதாக நான் தோன்றாதபடி—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μὴ
  choice: தோன்றாதபடி
  rationale: ἵνα உடன் வரும் μὴ நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை மறுப்பாக அறிமுகப்படுத்துகிறது. தமிழில் ‘-ஆதபடி’ அந்தச் சார்புத்தன்மையை இயல்பாகத் தக்கவைக்கிறது.
- source_word: δόξω
  choice: நான் தோன்றாதபடி
  rationale: இங்கு δοκέω என்பதற்கு ‘நினைத்தல்’ என்பதல்ல, ‘தோன்றுதல்/காணப்படுதல்’ என்பதே பொருள். இறந்தகாலமற்ற நோக்கச் சார்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὡς ἂν
  choice: …முயல்வதாக
  rationale: ஒருவர் உண்மையில் அப்படிச் செய்கிறார் என்று உறுதிப்படுத்தாமல், அவர் அப்படிச் செய்வதாகத் தோன்றும் ஒப்புமை அல்லது தோற்றத்தை இவ்வடிவம் வெளிப்படுத்துகிறது.
- source_word: ἐκφοβεῖν
  choice: அச்சுறுத்த முயல்வதாக
  rationale: வலுவாகப் பயமுறுத்துதல் அல்லது மிரட்டுதல் என்ற பொருளைத் தருகிறது. ‘முயல்வதாக’ என்பது δόξω ὡς ἂν உடன் உள்ள தோற்றக் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; செயல் உண்மையில் நடந்ததாக உறுதிப்படுத்தாது.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: ἐκφοβεῖν என்பதன் நேரடிச் செயப்படுபொருளாக உள்ள இரண்டாம் நபர் பன்மையைத் தக்கவைக்கிறது.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: கடிதங்களின் மூலம்
  rationale: διά + பிறப்புவேற்றுமை கருவி அல்லது வழிமுறையைக் குறிக்கிறது. கிரேக்கத்தில் உடைமைச் சொல் இல்லை என்பதால் முதன்மை உரையில் ‘என் கடிதங்கள்’ என்று வெளிப்படையாகச் சேர்க்காமல், ‘கடிதங்களின் மூலம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἵνα சார்ந்திருக்கும் முதன்மை வாக்கியம் இவ்வசனத்தில் வெளிப்படையாக இல்லாதது
  choice: இயல்பான முழு தமிழ் வாக்கியத்திற்காக ‘இதைச் சொல்கிறேன்’ என்று மறைமுக முதன்மை வினை வெளிப்படுத்தப்பட்டது; அதன் விளக்கத்தன்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
  alternative: ‘கடிதங்களின் மூலம் உங்களை அச்சுறுத்த முயல்வதாக நான் தோன்றாதபடி—’ என்று வாக்கியத் துண்டாகவே விடுதல்.
  rationale: கிரேக்க வசனம் முந்தைய சூழலுடன் இணைந்த நோக்கச் சார்பாக உள்ளது. தனி வசனமாக வாசிக்க இயல்பாக்க குறைந்தபட்ச இணைப்பு சேர்க்கப்பட்டது; அதையே மூலத்தில் வெளிப்படையாக இருப்பதாகக் காட்டாமல் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அச்சுறுத்த’ என்பது ‘பயமுறுத்த’ என்பதைக் காட்டிலும் கடிதங்களால் செலுத்தப்படும் அழுத்தத்தை இயல்பாகச் சொல்கிறது; ‘மிரட்ட’ என்ற சற்றுக் கூர்மையான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
