revisions:
- from: கடிதங்களின் மூலம் உங்களை அச்சுறுத்த முயல்வதாக நான் தோன்றாதபடி இதைச் சொல்கிறேன்[a].
  to: கடிதங்கள் மூலம் உங்களைப் பயமுறுத்துவதாக நான் தோன்றாதபடி—
  rationale: மூலத்தில் இல்லாத ‘இதைச் சொல்கிறேன்’ என்பதையும் முயற்சியைக் குறிக்கும் கூடுதல் நுணுக்கத்தையும் நீக்கியுள்ளேன். இறுதிக் கோடு, இந்த நோக்கச் சார்பு முந்தைய வாக்கியத்துடன் தொடர்வதைத் தெளிவாகக் காட்டுகிறது. மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பு ἐκφοβεῖν-ன் சாத்தியமான சூழல்சார் வலிமையைப் பாதுகாக்கிறது.
