reference: 2 Corinthians 10:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: ta
  text: ஏனெனில், உங்களைக் கட்டியெழுப்புவதற்காக, உங்களை இடித்துத் தள்ளுவதற்காக அல்ல[b], ஆண்டவர் எங்களுக்குக் கொடுத்த அதிகாரத்தைப் பற்றி நான் சற்று அதிகமாகப் பெருமை பேசினாலும்கூட, நான் அவமானத்துக்கு உள்ளாகமாட்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் வெட்கப்படமாட்டேன்.” கிரேக்க வினைச்சொல்லை இவ்வாறும் மொழிபெயர்க்கலாம்; ஆனால் அதன் செயப்பாட்டு வடிவத்தை “அவமானத்துக்கு உள்ளாகமாட்டேன்” என்பது தெளிவாகக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களை அழிப்பதற்காக அல்ல.” கிரேக்கத்தில் ‘கட்டியெழுப்புதல்’ என்பதற்கு எதிராக ‘இடித்தல்/அழித்தல்’ நிறுத்தப்படுகிறது; முதன்மை உரை கட்டுமான உருவகத்தைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: ஏனெனில் … பெருமை பேசினாலும்கூட
  rationale: γάρ என்பதன் விளக்கமளிக்கும் தொடர்பை ‘ஏனெனில்’ என்றும், ἐάν உடன் வரும் நிபந்தனைத் தன்மையையும் τε தரும் வலியுறுத்தலையும் ‘-ஆலும்கூட’ என்றும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: περισσότερόν τι
  choice: சற்று அதிகமாக
  rationale: ஒப்பீட்டு அளவான ‘அதிகமாக’ என்பதோடு τι தரும் திட்டவட்டமற்ற மென்மையை ‘சற்று’ பாதுகாக்கிறது.
- source_word: καυχήσωμαι
  choice: நான் … பெருமை பேசினால்
  rationale: நிபந்தனை வாக்கியத்தில் வரும் aorist middle subjunctive வடிவை இயல்பான தமிழ் நிபந்தனை வினையாகத் தருகிறது; καυχάομαι என்பதன் ‘boast’ பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: எங்களுக்குக் கொடுத்த அதிகாரத்தைப் பற்றி
  rationale: ἐξουσία என்பது வெறும் வல்லமையல்ல, வழங்கப்பட்ட அதிகாரம் அல்லது உரிமை. ‘அதிகாரம்’ அந்த வேறுபாட்டைத் தெளிவாகக் காக்கிறது.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: ஆண்டவர் எங்களுக்குக் கொடுத்த
  rationale: உறவுப்பெயர் முன் குறிப்பிடப்பட்ட அதிகாரத்தையே சுட்டுகிறது. ἔδωκεν இறந்தகாலமாகவும் κύριος வழக்கமான மரியாதைத் தலைப்பான ‘ஆண்டவர்’ என்றும் மொழிபெயர்க்கப்படுகிறது.
- source_word: εἰς οἰκοδομὴν
  choice: உங்களைக் கட்டியெழுப்புவதற்காக
  rationale: οἰκοδομήயின் கட்டுமான உருவகத்தையும், சூழலில் உள்ள மறைமுகச் செயப்படுபொருளான கொரிந்தியர்களையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: உங்களை இடித்துத் தள்ளுவதற்காக அல்ல
  rationale: καθαίρεσις என்பதன் இடித்தல்/அழித்தல் பொருளைத் தருவதோடு, οἰκοδομήக்கு எதிரான கட்டுமான உருவகத்தையும் காக்கிறது.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: நான் அவமானத்துக்கு உள்ளாகமாட்டேன்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவை வெளிப்படையாகப் பிரதிபலித்து, பவுலின் பெருமைபேச்சு பொய்யென நிரூபிக்கப்பட்டு அவமானம் விளைவிக்காது என்ற நுணுக்கத்தைக் காக்கிறது.
theological_decisions:
- issue: அப்போஸ்தல அதிகாரத்தின் இயல்பும் நோக்கமும்
  choice: இந்த அதிகாரம் ஆண்டவரால் வழங்கப்பட்டது; அது கொரிந்தியர்களைக் கட்டியெழுப்புவதற்கானது, அவர்களை இடித்துத் தள்ளுவதற்கானது அல்ல.
  alternative: இந்த அதிகாரம் அழிவுண்டாக்கும் வகையில் சபை ஒழுங்கை அமல்படுத்துவதற்கானது.
  rationale: οἰκοδομή மற்றும் καθαίρεσις ஆகியவற்றின் நேரடி எதிர்மறை இணைப்பு, அதிகாரத்தின் அடிப்படை நோக்கத்தைக் கட்டியெழுப்புவதாகக் காட்டுகிறது. அதே சமயம், அதிகாரத்தின் உண்மையையோ அதன் உறுதியான பயன்பாட்டையோ மொழிபெயர்ப்பு மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்பை ஒரே தமிழ் வாக்கியத்தில் காக்க, ஆண்டவர் கொடுத்த அதிகாரத்தின் நோக்கத்தை முன்வைத்து அமைக்கப்பட்டுள்ளது. ‘கட்டியெழுப்புதல்—இடித்துத் தள்ளுதல்’ என்ற உருவக எதிர்மறை இணைப்பு பாதுகாக்கப்பட்டுள்ளது.
