id: 2CO.10.1
reference: 2 Corinthians 10:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: ta
  text: பவுலாகிய நானே, மெசியாவின் சாந்தத்தையும் கனிவையும் முன்னிட்டு உங்களிடம் வேண்டிக்கொள்கிறேன்—உங்களிடையே நேரில் இருக்கும்போது தாழ்மையானவனாகவும், இல்லாதபோது உங்களை நோக்கித் துணிவாகவும் இருப்பவன் நான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: பவுலாகிய நானே
  rationale: Αὐτός மற்றும் ἐγώ தரும் தனிப்பட்ட வலியுறுத்தலை ‘நானே’ இயல்பாகத் தக்கவைக்கிறது. δέ இங்கு புதிய உரைப்பகுதிக்கான மென்மையான இணைப்பாக இருப்பதால் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: παρακαλῶ ὑμᾶς
  choice: உங்களிடம் வேண்டிக்கொள்கிறேன்
  rationale: இங்கு கட்டளையைக் காட்டிலும் தனிப்பட்ட, தீவிரமான வேண்டுகோளே முன்னிலையில் உள்ளது.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: சாந்தத்தையும் கனிவையும் முன்னிட்டு
  rationale: διά + genitive வேண்டுகோளின் அடிப்படை அல்லது ஆதாரத்தைச் சுட்டுகிறது. πραΰτης என்பதற்கு ‘சாந்தம்’, ἐπιείκεια என்பதற்கு கருணையோடு விட்டுக்கொடுக்கும் தன்மையை வெளிப்படுத்தும் ‘கனிவு’ தேர்ந்தெடுக்கப்பட்டன.
- source_word: τοῦ Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்பட்டது.
- source_word: κατὰ πρόσωπον ... ἐν ὑμῖν
  choice: உங்களோடு நேருக்கு நேர் இருக்கும்போது
  rationale: சொல்லளவில் ‘முகத்தின்படி’ என்றாலும், இச்சூழலில் நேரில் உடனிருப்பதைக் குறிக்கிறது; பின்னுள்ள ἀπών உடனான எதிர்மறை இணைப்பும் தக்கவைக்கப்படுகிறது.
- source_word: ταπεινὸς
  choice: தாழ்மையானவன்
  rationale: சொல்லின் அடிப்படைப் பொருளைத் தக்கவைத்து, இது பவுலின் உண்மையான தன்னுணர்வா அல்லது அவரைக் குறித்த பிறரின் ஏளனமான மதிப்பீடா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: தொலைவில் இருக்கும்போதோ உங்களிடம் துணிவாகப் பேசுகிறவன்
  rationale: ἀπών என்பது உடலளவில் இல்லாத நிலையையும், θαρρῶ துணிவான அணுகுமுறையையும் குறிக்கிறது. ‘பேசுகிறவன்’ என்பது தமிழில் இயல்புக்காகச் சேர்க்கப்பட்டாலும், எதிர்த்து அல்லது பகையாக என்ற கூடுதல் பொருள் புகுத்தப்படவில்லை.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு சொல் பட்டமாகச் செயல்படுகிறது; ஆகவே அதன் மெசியா சார்ந்த பொருளை வெளிப்படுத்தும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: பவுலின் ‘தாழ்மையானவன்’ என்ற தன்னுரை
  choice: சாத்தியமான ஏளனத்தையும் குற்றச்சாட்டின் எதிரொலியையும் தீர்மானிக்காமல் ‘தாழ்மையானவன்’ என வைத்தல்
  alternative: ‘கூச்சமுள்ளவன்’ அல்லது ‘அற்பமானவன்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை இதை நேரடி மேற்கோளாகக் குறிக்கவில்லை. எனவே பவுல் தன்னை விவரிக்கிறாரா அல்லது எதிரிகளின் மதிப்பீட்டை எதிரொலிக்கிறாரா என்ற பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘நேருக்கு நேர்’ என்பது மூலத்தின் முகம் சார்ந்த உருவகத்தையும் நேரில் இருப்பது என்ற பொருளையும் தக்கவைக்கிறது; வாக்கியத்தின் சுயவிளக்கமான ஏளனத் தொனி தீர்மானிக்கப்படாமல் விடப்பட்டுள்ளது.
