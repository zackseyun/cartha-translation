id: 2CO.10.10
reference: 2 Corinthians 10:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: ta
  text: ஏனெனில், “அவருடைய கடிதங்கள் கனத்தவையும் வலிமையானவையும்; ஆனால் அவர் நேரில் இருப்பது பலவீனமானது; அவருடைய பேச்சு இகழப்படுகிறது[b]” என்று அவர்கள் சொல்கிறார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர் சொல்கிறார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் “சொல்கிறார்” என்பது ஒருமையில் உள்ளது; இங்கு அது பவுலை விமர்சிப்போரின் கருத்தை மேற்கோளாக அறிமுகப்படுத்தும் சொற்றொடராக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவருடைய பேச்சு மதிப்பற்றதாகக் கருதப்படுகிறது” அல்லது “அவருடைய பேச்சு ஒன்றுமில்லாததாக எண்ணப்படுகிறது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்டதற்கான காரணமாக விமர்சகர்களின் கூற்றை இது அறிமுகப்படுத்துகிறது.
- source_word: ἐπιστολαὶ
  choice: கடிதங்கள்
  rationale: திருச்சபைச் சிறப்புச் சொல்லைத் தேவையின்றி பயன்படுத்தாமல், எழுதப்பட்ட தகவல்தொடர்பைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: μέν ... δὲ
  choice: …; ஆனால் …ஓ
  rationale: கடிதங்களுக்கும் பவுலின் நேரடி வருகைக்கும் இடையிலான முரண்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φησίν
  choice: அவர்கள் சொல்கிறார்கள்
  rationale: கிரேக்கத்தில் ஒருமையாக இருந்தாலும், சூழலில் பவுலை விமர்சிப்போரின் கருத்தை மேற்கோளாக அறிமுகப்படுத்தும் சொல்லாக இது செயல்படுகிறது; மூலத்தின் ஒருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: βαρεῖαι
  choice: கனமுள்ளவை
  rationale: ‘கனம்’ என்ற உருவகத்தைப் பாதுகாத்து, கடிதங்களின் தீவிரத்தையும் தாக்கத்தையும் உணர்த்துகிறது.
- source_word: ἰσχυραί
  choice: வலிமைமிக்கவை
  rationale: கடிதங்களின் ஆற்றலை நேரடியாகக் குறிக்கிறது; ‘கனமுள்ளவை’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: παρουσία τοῦ σώματος
  choice: அவர் நேரில் இருக்கும்போது
  rationale: கடிதங்களுடன் முரண்படுத்தப்படும் பவுலின் உடல்சார்ந்த நேரடி முன்னிலையை, சொல்லுக்குச் சொல் மொழிபெயர்ப்பின் செயற்கைத்தன்மையின்றி இயல்பான தமிழில் தருகிறது.
- source_word: ἀσθενής
  choice: பலவீனமாகத் தோன்றுகிறார்
  rationale: விமர்சகர்கள் பவுலின் நேரடி முன்னிலையை மதிப்பிட்ட விதத்தை இயல்பான தமிழில் தருகிறது; அது உண்மையென உரையாளர் உறுதிப்படுத்துவதாகக் காட்டவில்லை.
- source_word: λόγος
  choice: பேச்சு
  rationale: கடிதங்களுக்கு எதிராக இங்கு பவுலின் வாய்மொழிப் பேச்சையோ பேசும் முறையையோ குறிக்கிறது.
- source_word: ἐξουθενημένος
  choice: இகழப்படுகிறது
  rationale: பேச்சு மதிப்பற்றதாகக் கருதப்பட்டு அவமதிக்கப்படுவதைச் செயப்பாட்டு வடிவில் காட்டுகிறது; அது இயல்பாகவே மதிப்பற்றது என்று தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: பவுலைப் பற்றிய விமர்சனம் உரையாளரின் சொந்த மதிப்பீடாகத் தோன்றக்கூடாது
  choice: மேற்கோளைப் பவுலின் விமர்சகர்கள் கூறுவதாக, “அவர்கள் சொல்கிறார்கள்” என்று மொழிபெயர்த்தல்
  alternative: “அவன் சொல்கிறான்” அல்லது “சொல்லப்படுகிறது”
  rationale: இந்த வசனம் பவுலின் பலவீனத்தை உறுதிப்படுத்தவில்லை; அவருக்கு எதிராக முன்வைக்கப்பட்ட மதிப்பீட்டை எடுத்துரைக்கிறது. பன்மை வடிவம் சூழலைத் தெளிவாக்குகிறது; கிரேக்க ஒருமை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: ἐξουθενημένος என்பது உள்ளார்ந்த மதிப்பின்மையா அல்லது பிறர் அளிக்கும் இகழ்ச்சியா
  choice: “இகழப்படுகிறது”
  alternative: “மதிப்பற்றது” அல்லது “இகழத்தக்கது”
  rationale: செயப்பாட்டு வடிவம் பிறர் பவுலின் பேச்சை எவ்வாறு மதிப்பிட்டனர் என்பதைப் பாதுகாக்கிறது; அவருடைய பேச்சு உண்மையிலேயே மதிப்பற்றது என்ற பொருளைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “கனமுள்ளவை” என்பது மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; “நேரில் இருக்கும்போது” என்பது παρουσία τοῦ σώματος என்பதன் பொருளை இயல்பாகத் தருகிறது. மேற்கோளின் கடுமையான விமர்சனத் தன்மை மென்மைப்படுத்தப்படவில்லை; அதே நேரத்தில் அது உரையாளரின் ஒப்புதலாகவும் காட்டப்படவில்லை.
