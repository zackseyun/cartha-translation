base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: ta
  text: ஆனால், நாங்கள் மாம்சத்தின்படி நடக்கிறவர்கள் என்று கருதுகிற சிலருக்கு எதிராகத் துணிந்து செயல்பட நான் எண்ணுகிற அந்த உறுதியுடன், நான் உங்களோடு இருக்கும்போது துணிவாக நடந்துகொள்ள வேண்டிய நிலை எனக்கு வராதபடி மன்றாடுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் மனித அளவுகோல்களின்படி வாழ்கிறவர்கள்.”
    reason: சொல்-மாற்று வாசகம்; κατὰ σάρκα என்பதற்கான விளக்கமான மாற்று.
lexical_decisions:
- source_word: δέομαι
  choice: மன்றாடுகிறேன்
  rationale: எளிய வேண்டுகோளைவிட வலுவான, மனமார்ந்த வேண்டுதலை இச்சொல் வெளிப்படுத்துகிறது.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: நான் உங்களிடம் இருக்கும்போது துணிவாக நடந்துகொள்ள வேண்டிய நிலை எனக்கு வராதபடி
  rationale: μή உடன் வரும் பெயர்ச்சொல் தன்மையுள்ள வினையெச்சத் தொடரை பவுலின் வேண்டுகோளின் உள்ளடக்கமாக இயல்பான தமிழில் தருகிறது; விரும்பத்தகாத கட்டாயநிலையையும் சூழலிலிருந்து தெளிவாக்குகிறது.
- source_word: παρὼν
  choice: நான் உங்களிடம் இருக்கும்போது
  rationale: சுற்றியுள்ள வசனங்களில் காணப்படும் இல்லாமை–இருத்தல் வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: θαρρῆσαι
  choice: துணிவாக நடந்துகொள்ள
  rationale: எதிர்ப்பாளர்களிடம் பவுல் காட்டக்கூடிய உறுதியான நடவடிக்கையைச் சுட்டுகிறது.
- source_word: τῇ πεποιθήσει
  choice: அந்த உறுதியுடன்
  rationale: πεποίθησις குறிக்கும் நம்பிக்கையுடனான உறுதியை, கருவி அல்லது உடனிகழ்ச்சி சார்ந்த வேற்றுமைப் பொருளுடன் தருகிறது.
- source_word: ᾗ λογίζομαι
  choice: என நான் எண்ணுகிற
  rationale: λογίζομαι இங்கு ஆலோசித்த முடிவு அல்லது நோக்கத்தைக் குறிக்கிறது; மிகை விளக்கமின்றி இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τολμῆσαι
  choice: துணிந்து செயல்பட வேண்டும்
  rationale: சிலரை நோக்கி பவுல் மேற்கொள்ள நினைக்கும் தீர்மானமான நடவடிக்கையைச் சுட்டுகிறது; வெறும் மனத் துணிவாக மட்டும் சுருக்கவில்லை.
- source_word: ἐπί τινας
  choice: சிலருக்கு எதிராக
  rationale: நபர்களை நோக்கி வரும் ἐπί என்பதன் எதிர்நிலைத் திசையைப் பாதுகாக்கிறது; ‘எதிர்கொள்ள’ என்ற கூடுதல் விளக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: τοὺς λογιζομένους
  choice: என்று கருதும்
  rationale: பவுலையும் அவருடைய உடனுழைப்பாளர்களையும் பற்றிய எதிர்ப்பாளர்களின் மதிப்பீட்டை வெளிப்படுத்துகிறது.
- source_word: κατὰ σάρκα
  choice: மாம்சத்தின்படி
  rationale: பவுலின் இறையியல் முக்கியத்துவமுள்ள σάρξ சொல்லையும் இங்குள்ள உண்மையான பொருள் அகலத்தையும் பாதுகாக்கிறது.
- source_word: περιπατοῦντας
  choice: நடக்கிறவர்கள்
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் பவுலின் வழக்கமான நடை உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: κατὰ σάρκα என்பதில் σάρξ சொல்லின் மொழிபெயர்ப்பு
  choice: மாம்சத்தின்படி
  alternative: மனித அளவுகோல்களின்படி வாழ்கிறவர்கள்
  rationale: இங்கு குற்றச்சாட்டு உலகியலான அல்லது வெறும் மனித முறையில் நடப்பதைச் சுட்டக்கூடும்; எனினும் ‘பாவ இயல்பின்படி’ என்று மொழிபெயர்ப்பது கருத்தை அளவுக்கு மீறி நிர்ணயிக்கும். ‘மாம்சத்தின்படி’ என்பது பவுலின் சொல் வளத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது; விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. நீளமான கிரேக்க வாக்கியத்தின் தர்க்க உறவுகள் காக்கப்பட்டுள்ளன. ‘மாம்சம்’ மற்றும் ‘நடத்தல்’ என்ற பவுலின் முக்கிய உருவகச் சொற்கள் முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளன.
