id: 2CO.10.11
reference: 2 Corinthians 10:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: ta
  text: 'அப்படிப்பட்டவர் இதை எண்ணிப்பார்க்கட்டும்: நாங்கள் இல்லாதபோது கடிதங்கள் வழியாகச் சொல்லில் எப்படிப்பட்டவர்களாக இருக்கிறோமோ, நேரில் இருக்கும்போது செயலிலும் அப்படிப்பட்டவர்களாகவே இருக்கிறோம்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சொல்லில் ... செயலில்” என்பவற்றை “பேச்சில் ... நடத்தையில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζέσθω
  choice: எண்ணிப்பார்க்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தின் சிந்தித்து உணரும்படி அழைக்கும் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ὁ τοιοῦτος
  choice: அப்படிப்பட்டவர்
  rationale: முன்பு குறிப்பிடப்பட்ட வகையான விமர்சகரைச் சுட்டும் ஒருமை குறிப்பைச் சுருக்கமாகவும் மரியாதையான பொதுப்பாலிலும் தருகிறது.
- source_word: οἷοί ἐσμεν ... τοιοῦτοι
  choice: எப்படிப்பட்டவர்களாக இருக்கிறோமோ ... அப்படிப்பட்டவர்களாகவே இருப்போம்
  rationale: இரு தொடர்புச் சொற்களுக்கிடையிலான பண்பு சார்ந்த ஒப்புமையையும் அதன் வலியுறுத்தலையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τῷ λόγῳ
  choice: சொல்லில்
  rationale: மரியாதைக்குரிய சுருக்கமான நடையில் சொல்லுக்கும் செயலுக்கும் இடையிலான கிரேக்க முரணைத் தக்கவைக்கிறது; இங்கு கடிதங்களில் கூறப்படுவதைக் குறிக்கிறது.
- source_word: δι’ ἐπιστολῶν
  choice: கடிதங்கள் வாயிலாக
  rationale: διά + genitive குறிக்கும் ஊடகம் அல்லது கருவி என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπόντες ... παρόντες
  choice: உங்களோடு இல்லாதபோது ... உங்களோடு இருக்கும்போது
  rationale: இல்லாமை–உடனிருப்பு என்ற சூழ்நிலை முரணை இலக்கு வாசகருடன் தொடர்புபடுத்தி இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: τῷ ἔργῳ
  choice: செயலில்
  rationale: τῷ λόγῳ என்பதற்கு இணையான தத்துவேற்றுமைச் சொல்லாக இருந்து, ‘சொல்லில் ... செயலில்’ என்ற இறுக்கமான முரணைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுலின் கடிதச் சொற்களுக்கும் அவர் நேரில் இருக்கும்போதான செயலுக்கும் உள்ள தொடர்பு
  choice: அவர் தொலைவில் இருந்து கடிதங்களில் எப்படித் தோன்றுகிறாரோ, நேரில் வந்தபோது அவரது செயலும் அதற்கு ஒத்ததாக இருக்கும் என்ற நேரடி எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: எதிர்காலத் தண்டனை குறித்த வெளிப்படையான மிரட்டலாக விரிவாக்குதல், அல்லது சொல்லையும் செயலையும் வெறும் பாணி–வல்லமை வேறுபாடாகக் காட்டுதல்.
  rationale: கிரேக்க உரை சொல்லிலும் செயலிலும் ஒரே தன்மை இருப்பதை ஒப்பிடுகிறது; அது கொண்டுள்ள எச்சரிக்கைத் தொனியைப் பாதுகாக்க வேண்டும், ஆனால் உரையில் வெளிப்படையாக இல்லாத தனிப்பட்ட கோட்பாட்டைச் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், அதேவேளை வேதாகம வாசிப்பிற்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘சொல்லில் ... செயலில்’ என்ற மூல உரையின் இணைமுரண் பாதுகாக்கப்பட்டுள்ளது.
