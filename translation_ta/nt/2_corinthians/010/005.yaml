  rationale: கிரேக்க உருவகம் அகந்தையான கூற்று அல்லது மனப்பாங்கு ஒன்றுக்கு மட்டும் வரையறுக்கப்படவில்லை. ‘உயர்ந்த தடை’ என்பது உயர்த்தப்பட்ட எதிர்ப்பு என்ற பரந்த உருவகத்தையும் சுற்றியுள்ள போராட்டச் சூழலையும் தக்கவைக்கிறது.
- issue: τοῦ Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவுக்கு
  alternative: கிறிஸ்துவுக்கு
  rationale: Χριστός என்பதை இங்கு பெயரைப் போன்ற ஒலிபெயர்ப்பாக அல்லாமல் பட்டப்பெயரின் பொருளோடு வழங்குகிறது. பாரம்பரிய ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ὑπακοὴ τοῦ Χριστοῦ என்பதிலுள்ள உருபுத் தொடர்பு
  choice: மெசியாவுக்குக் கீழ்ப்படிதல்
  alternative: மெசியாவின் கீழ்ப்படிதல்
  rationale: சூழலில் எண்ணங்கள் மெசியாவுக்குக் கீழ்ப்படிதலுக்குக் கொண்டுவரப்படுகின்றன என்பது மிக இயல்பான வாசிப்பு. எனினும் கிரேக்க மரபுத்தொடரின் சொற்படியான வடிவம் ‘மெசியாவின் கீழ்ப்படிதல்’ எனப் புரியக்கூடிய இலக்கண வாய்ப்பை முற்றிலும் மறைக்காதபடி அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. இது முழு வாக்கியத்தின் நடுப்பகுதியாக இருப்பதால், மூலத்தின் καί மற்றும் பெயரெச்சத் தொடரை உணர்த்தும் வகையில் இறுதியில் தொடர்ச்சிக் காற்புள்ளி வைக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இணைக்கப்பட்டுள்ளன.
