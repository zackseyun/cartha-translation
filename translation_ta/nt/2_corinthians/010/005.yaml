- source_word: πᾶν ὕψωμα
  choice: ஒவ்வோர் உயர்ந்த தடையையும்
  rationale: ὕψωμα என்பதன் ‘உயர்ந்த ஒன்று’ என்ற உருவகத்தைத் தக்கவைத்தபடியே, முந்தைய வசனத்தின் போராட்டச் சூழலில் எதிர்த்து நிற்கும் ஒன்றை இயல்பான தமிழில் ‘தடை’ என வெளிப்படுத்துகிறது. ‘ஒவ்வோர்’ என்பது πᾶν என்பதன் பகிர்வுப் பொருளைப் பிரதிபலிக்கிறது.
- source_word: ἐπαιρόμενον
  choice: உயர்த்தப்படும்
  rationale: இறந்தகாலப் பெயரெச்சத்தின் உயர்த்தப்படுதல் அல்லது மேலெழுப்பப்படுதல் என்ற பொருளை வைத்திருக்கிறது; ‘தன்னையே உயர்த்திக்கொள்ளும்’ என்று தற்செயல்/தற்பொருள் நுணுக்கத்தைத் தேவையின்றிச் சேர்க்கவில்லை.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: கடவுளைப் பற்றிய அறிவுக்கு எதிராக
  rationale: γνῶσις என்பதற்கு ‘அறிவு’ என்றும், τοῦ θεοῦ என்பதன் தொடர்பை இயல்பான தமிழில் ‘கடவுளைப் பற்றிய’ என்றும் வழங்குகிறது. இது கடவுளை அறிதல் மற்றும் கடவுளைப் பற்றிய உண்மையறிவு ஆகிய தொடர்புடைய நுணுக்கங்களை முற்றிலும் சுருக்கிவிடாது.
- source_word: αἰχμαλωτίζοντες
  choice: சிறைபிடித்துக்கொண்டும்
  rationale: போரில் கைதியாகப் பிடித்தல் என்ற வலுவான இராணுவ உருவகத்தைப் பாதுகாக்கிறது. வாக்கியம் முந்தைய சூழலோடு தொடரும் பெயரெச்சத் தொடராக இருப்பதால் ‘-க்கொண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: πᾶν νόημα
  choice: ஒவ்வோர் எண்ணத்தையும்
  rationale: νόημα என்பதன் சிந்தனை, எண்ணம், நோக்கம் ஆகிய பொருட்களில் இச்சூழலுக்கு ஏற்ற பரந்த மற்றும் இயல்பான தமிழ் ‘எண்ணம்’; ‘சதி’ போன்ற எதிர்மறையான குறுகிய பொருளைச் சேர்க்கவில்லை.
- source_word: εἰς τὴν ὑπακοὴν
  choice: கீழ்ப்படியும் நிலைக்கு
  rationale: εἰς குறிக்கும் இலக்கு அல்லது விளைவுநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘கீழ்ப்படிதலுக்கு’ என்பதைவிட இயக்கமும் முடிவுநிலையும் தெளிவாகின்றன.
- source_word: τοῦ Χριστοῦ
  choice: மெசியாவுக்கு
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்படுகிறது. ‘மெசியாவுக்கு’ என்பது கீழ்ப்படிதலின் இலக்கு அவரே என்ற சூழல்சார்ந்த வாசிப்பை இயல்பாக அளிக்கிறது.
