  edition: SBLGNT
  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: ta
  text: உங்களுடைய கீழ்ப்படிதல் முழுமை அடையும்போது[b], ஒவ்வொரு கீழ்ப்படியாமையையும் தண்டிக்க நாங்கள் ஆயத்தமாயிருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “உங்களுடைய கீழ்ப்படிதல் நிறைவேற்றப்படும்போது” அல்லது “நிறைவுபெறும்போது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: ஆயத்தமாகவும் இருக்கிறோம்
  rationale: ‘ஆயத்த நிலையில் இருத்தல்’ என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது. καί என்பதன் தொடர்ச்சிப் பொருளை ‘-வும்’ காக்கிறது; பன்மை எழுவாய் முந்தைய சூழலிலிருந்து வெளிப்படுகிறது.
- source_word: ἐκδικῆσαι
  choice: தண்டிக்க
  rationale: எதிர்ப்பையும் கீழ்ப்படியாமையையும் எதிர்கொள்ளும் அப்போஸ்தல அதிகாரம் பற்றிய உடனடிச் சூழலில், தனிப்பட்ட பழிவாங்குதலைவிட ஒழுங்கு நடவடிக்கையான தண்டனையை இது இயல்பாகக் குறிக்கிறது. ‘நீதி செலுத்துதல்/பழிதீர்த்தல்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: πᾶσαν παρακοήν
  choice: ஒவ்வொரு கீழ்ப்படியாமையையும்
  rationale: πᾶσαν என்பதன் பகிர்ந்தளிக்கும் வலிமையையும், παρακοή என்பதன் கீழ்ப்படிய மறுக்கும் பொருளையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὅταν
  choice: -போது
  rationale: எதிர்காலத்தில் நிறைவேற வேண்டிய ஒரு சூழ்நிலையைச் சார்ந்த காலத் தொடர்பை தமிழில் இயல்பாகக் காட்டுகிறது; அது நிகழ்வது நிச்சயமாக ஏற்கெனவே முடிந்தது என்று சொல்லாமல், ‘when/whenever’ என்ற நுணுக்கத்தைத் திறந்தே வைக்கிறது.
- source_word: πληρωθῇ
  choice: முழுமை அடையும்போது
  rationale: செயப்பாட்டு இறந்தகால வாய்பாட்டு வடிவம் குறிக்கும் ‘நிறைவுக்குக் கொண்டுவரப்படுதல்/முழு அளவை அடைதல்’ என்ற கருத்தை தெளிவாகத் தருகிறது.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: உங்களுடைய கீழ்ப்படிதல்
  rationale: கொரிந்தியர்களைக் குறிக்கும் பன்மை உடைமைத் தொடர்பையும் ὑπακοή என்பதன் நேரடிப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: எதிர்ப்புக்கு பவுல் அளிக்கவிருந்த பதிலின் தன்மை
  choice: திருச்சபைச் சூழலில் கீழ்ப்படியாமைக்கான ஒழுங்கு நடவடிக்கையான தண்டனை
  alternative: எதிரிகளுக்கு எதிரான தனிப்பட்ட பழிவாங்குதல் அல்லது இறுதிக்காலத் தெய்வீகத் தீர்ப்பு
  rationale: உடனடிச் சூழல் அப்போஸ்தல அதிகாரத்தையும் கலகமான எதிர்ப்பைச் சீர்செய்வதையும் பற்றியது. ஆகவே ‘தண்டிக்க’ என்பது தனிப்பட்ட பழிவாங்குதலை உரைக்காமல் சூழலுக்கு ஏற்ற பொருளைக் காட்டுகிறது; இருப்பினும் கிரேக்க வினையின் விரிவான நீதிசெலுத்தும் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்ச்சியான பங்கேற்பு அமைப்பை தமிழில் ‘ஆயத்தமாகவும் இருக்கிறோம்’ எனத் தெளிவுபடுத்தி, நிபந்தனை கலந்த கால நுணுக்கத்தையும் மாற்றுப் பொருள்களையும் அடிக்குறிப்புகளில் பாதுகாத்துள்ளது.
