id: 2CO.10.18
reference: 2 Corinthians 10:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: ta
  text: ஏனெனில், தன்னைப் பரிந்துரைக்கிறவன் அங்கீகரிக்கப்பட்டவன் அல்ல; ஆண்டவர் யாரைப் பரிந்துரைக்கிறாரோ, அவனே அங்கீகரிக்கப்பட்டவன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன்னை முன்வைக்கிறவன்’ ... ‘ஆண்டவர் யாரை முன்வைக்கிறாரோ’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இரு இடங்களிலும் ஒரே வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: பரிந்துரைக்கிறவன் / பரிந்துரைக்கிறார்
  rationale: இச்சூழலில் ஒருவர் மதிப்பீட்டுக்காகத் தம்மை முன்வைத்துப் புகழ்வதையோ பரிந்துரைப்பதையோ குறிக்கிறது. கிரேக்கத்தில் இரு இடங்களிலும் ஒரே வினைச்சொல் வருவதால், தமிழிலும் ‘பரிந்துரை’ என்ற ஒரே சொல்லை மீண்டும் பயன்படுத்தி எதிர்மறை ஒப்புமையைப் பாதுகாக்கிறது.
- source_word: δόκιμος
  choice: அங்கீகரிக்கப்பட்டவன்
  rationale: சோதனை அல்லது மதிப்பீட்டுக்குப் பின் தகுதியானவர் என்று ஏற்றுக்கொள்ளப்படுவதை இச்சொல் குறிக்கிறது. ‘அங்கீகரிக்கப்பட்டவன்’ என்பது சுயப் பரிந்துரைக்கும் ஆண்டவரின் பரிந்துரைக்கும் இடையிலான வேறுபாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: தமிழ் வேதாகம நடையில் κύριος என்பதற்கான இயல்பான, மரியாதைக்குரிய பட்டப்பெயர். மூலத்தில் உள்ளதைக் காட்டிலும் அதன் குறிக்கப்படுபவரை மேலும் குறிப்பாக்கவில்லை.
- source_word: ἑαυτὸν
  choice: தன்னைத்தானே
  rationale: தன்மைச் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ὃν
  choice: யாரை ... அவனே
  rationale: கிரேக்கத்தின் ‘யாரை ஆண்டவர் பரிந்துரைக்கிறாரோ, அவனே’ என்ற எதிர்மறை ஒப்புமையைத் தெளிவான தமிழ் தொடர்பியல் அமைப்பில் வழங்குகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கமாக இவ்வசனம் வருவதைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ὁ κύριος (‘ஆண்டவர்’) என்பவர் யார்?
  choice: முதன்மை உரையில் ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ஆண்டவராகிய இயேசு; கடவுள்
  rationale: பவுலின் பயன்பாட்டில் இது இயேசுவைக் குறிக்க வாய்ப்புள்ளது; எனினும் இவ்வசனம் κύριος என்ற பட்டத்தை மட்டுமே பயன்படுத்துவதால், மூலத்தின் குறிப்பின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், அதேவேளையில் வேதாகமத்திற்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பரிந்துரைக்கிறவன்’ மற்றும் ‘அங்கீகரிக்கப்பட்டவன்’ ஆகிய வடிவங்கள் பொதுவான ஆண்பால் ஒருமையைப் பிரதிபலிக்கின்றன; கிரேக்கத்தின் ஒருமை இலக்கண வடிவத்தையும் தனிநபர் மதிப்பீட்டையும் பாதுகாக்கின்றன.
