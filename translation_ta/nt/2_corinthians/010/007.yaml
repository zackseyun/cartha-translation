id: 2CO.10.7
reference: 2 Corinthians 10:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: ta
  text: 'நீங்கள் வெளித்தோற்றங்களையே பார்க்கிறீர்கள்.[a] தான் மெசியாவுக்குரியவன் என்பதில் ஒருவன் உறுதியாயிருந்தால், அவன் இதைத் தனக்குள் மீண்டும் சிந்தித்துப் பார்க்கட்டும்: அவன் மெசியாவுக்குரியவனாக இருப்பதுபோலவே, நாங்களும் மெசியாவுக்குரியவர்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்சார்பாக, “தோற்றத்தின்படி உள்ளவற்றைப் பார்க்கிறீர்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வடிவத்தை “உங்கள் கண்முன் இருப்பதைப் பாருங்கள்” என்ற கட்டளையாகவும் புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “மெசியாவினுடையவன்”; இது மெசியாவுக்குச் சொந்தமானவன் அல்லது அவரைச் சார்ந்தவன் என்ற பொருளைத் தருகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: வெளித்தோற்றத்தையே
  rationale: சொற்றொடர் வெளிப்புறமாகத் தென்படுவதையோ மேலோட்டமான தோற்றத்தையோ குறிக்கிறது. இயல்பான நவீன தமிழில் ‘வெளித்தோற்றம்’ இந்தப் பொருளைத் தெளிவாகத் தருகிறது; ‘-ஐயே’ என்பது கண்டனத்தின் சூழலில் வெளித்தோற்றத்துக்கு அளிக்கப்படும் ஒருதலைப்பட்ச கவனத்தை வெளிப்படுத்துகிறது.
- source_word: βλέπετε
  choice: பார்த்துக்கொண்டிருக்கிறீர்கள்
  rationale: வடிவம் நிகழ்காலக் குறிப்பாகவோ கட்டளையாகவோ புரிந்துகொள்ளப்படலாம். சூழலிலுள்ள கண்டனத்துக்கு ஏற்றவாறு இது குறிப்புவாக்கியமாக மொழிபெயர்க்கப்பட்டது; தொடரும் அணுகுமுறையை ‘பார்த்துக்கொண்டிருக்கிறீர்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πέποιθεν ἑαυτῷ
  choice: தன்னைக் குறித்து உறுதியாக இருந்தால்
  rationale: πέποιθεν நிலைபெற்ற நம்பிக்கையையோ உறுதியையோ குறிக்கிறது; ἑαυτῷ அந்த உறுதி தன்னைப் பற்றியது என்பதைக் காட்டுகிறது. தமிழில் ‘தன்னைக் குறித்து உறுதியாக’ என்பது தவறாகத் தன்னம்பிக்கை மட்டுமே எனச் சுருக்காமல் பொருளை வழங்குகிறது.
- source_word: Χριστοῦ εἶναι
  choice: மெசியாவுக்குரியவன்
  rationale: உடைமை வேற்றுமையுடன் εἶναι வருவது சொந்தம், சார்பு அல்லது பற்றுறுதியைக் குறிக்கிறது. Χριστός இங்கு பட்டப்பெயராக இருப்பதால் ‘மெசியா’ என்றும், உறவை இயல்பாகக் காட்ட ‘-க்குரியவன்’ என்றும் தரப்பட்டது.
- source_word: λογιζέσθω πάλιν
  choice: மீண்டும் சிந்தித்துப் பார்க்கட்டும்
  rationale: λογίζομαι இங்கு கவனமாக எண்ணிப் பரிசீலிப்பதைக் குறிக்கிறது; கட்டளை வலிமையை ‘பார்க்கட்டும்’ காக்கிறது. πάλιν ‘மீண்டும்’ என நேரடியாக வழங்கப்பட்டது.
- source_word: ἐφ’ ἑαυτοῦ
  choice: தனக்குள்
  rationale: இச்சூழலில் இது தன் உள்ளத்தில் அல்லது தன் மனத்தில் பரிசீலிப்பதைக் குறிக்கும். ‘தனக்குள்’ சுருக்கமாகவும் இயல்பாகவும் அந்த அகச்சிந்தனையைத் தருகிறது.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: அவன் மெசியாவுக்குரியவனாக இருப்பதுபோலவே, நாங்களும் மெசியாவுக்குரியவர்கள்
  rationale: கிரேக்கத்தில் இரண்டாம் பகுதியில் விடுபட்டுள்ள ‘இருக்கிறோம்’ என்னும் கருத்து தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டது. ஒப்புமை சமமான சார்பை வலியுறுத்தும் வகையில் ‘போலவே ... நாங்களும்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός இங்கு அபிஷேகம் செய்யப்பட்டவர் என்னும் பட்டப்பெயரின் வலிமையைக் கொண்டுள்ளது. அதனால் மரபான ஒலிபெயர்ப்பான ‘கிறிஸ்து’ என்பதற்குப் பதிலாக பட்டப்பொருளைக் காக்கும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: Χριστοῦ εἶναι குறிக்கும் உறவு
  choice: மெசியாவுக்குரியவன்
  alternative: மெசியாவைச் சேர்ந்தவன்
  rationale: மூலத்தின் உடைமை/சார்பு உறவை ‘-க்குரியவன்’ சுருக்கமாகக் காக்கிறது; இது இரட்சிப்பு நிலை, கட்சிசார் உரிமை, அல்லது ஊழிய அதிகாரம் ஆகியவற்றில் ஒன்றாக மட்டும் பொருளைச் சுருக்கித் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. பவுலின் கண்டனத் தொனியைப் பேணியபோதும் மூலத்திலுள்ள குறிப்புவாக்கியம்/கட்டளை என்ற இலக்கண இரட்டுறவை அடிக்குறிப்பில் பாதுகாக்கிறது. ஆண்பால் ஒருமை கிரேக்கத்தின் τις/αὐτός வடிவத்தைப் பின்பற்றுகிறது; ‘நாங்கள்’ பவுலையும் அவருடைய உடனுழைப்பாளர்களையும் குறிக்கும் இயல்பான தன்மை விலக்குப் பன்மை.
