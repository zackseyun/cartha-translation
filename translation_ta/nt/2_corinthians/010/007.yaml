revisions:
- from: 'நீங்கள் வெளித்தோற்றத்தையே பார்த்துக்கொண்டிருக்கிறீர்கள்.[a] தான் மெசியாவுக்குரியவன் என்று ஒருவன் தன்னைக் குறித்து உறுதியாக இருந்தால், அவன் இதைத் தனக்குள் மீண்டும் சிந்தித்துப் பார்க்கட்டும்: அவன் மெசியாவுக்குரியவனாக இருப்பதுபோலவே, நாங்களும் மெசியாவுக்குரியவர்கள்.[b]'
  to: 'நீங்கள் வெளித்தோற்றங்களையே பார்க்கிறீர்கள்.[a] தான் மெசியாவுக்குரியவன் என்பதில் ஒருவன் உறுதியாயிருந்தால், அவன் இதைத் தனக்குள் மீண்டும் சிந்தித்துப் பார்க்கட்டும்: அவன் மெசியாவுக்குரியவனாக இருப்பதுபோலவே, நாங்களும் மெசியாவுக்குரியவர்கள்.[b]'
  rationale: சிறிய நடை மற்றும் தெளிவுத் திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. மூலத்தின் குறிப்புவாக்கியமாகவும் கட்டளையாகவும் அமையக்கூடிய முதல் வினைச்சொல்லின் இரட்டுறவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; மெசியாவுடனான உறவின் பொருளும் மாற்றப்படவில்லை.
