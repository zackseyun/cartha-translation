  source_fidelity: மூலத்தின் வாத அமைப்பும், வெளிப்புற அளவுகோலால் மதிப்பிடுதல் என்ற Τὰ κατὰ πρόσωπον-இன் பொருளும், Χριστοῦ εἶναι-யின் மெசியாவுக்குரிய சார்பு/உடைமை உறவும் சரியாகக் காக்கப்பட்டுள்ளன. ஆனால் “தன்னைக் குறித்து உறுதியாக” என்பது πέποιθεν ἑαυτῷ என்பதன் தன்னம்பிக்கை என்ற நுணுக்கத்தை, பின்வரும் உள்ளடக்கக் கூற்றுடன் இணைக்கும்போது சற்றே தெளிவிழக்கச் செய்கிறது. “தான் … என்பதில் உறுதியாயிருந்தால்” என்பது தமிழில் மூலத்தின் கருத்தைத் துல்லியமாகவும் நேரடியாகவும் தருகிறது.
  naturalness: “வெளித்தோற்றங்களையே பார்க்கிறீர்கள்” என்பது பன்மைச் சுட்டலையும் கண்டனத் தொனியையும் இயல்பாக வெளிப்படுத்துகிறது. “தான் மெசியாவுக்குரியவன் என்பதில் ஒருவன் உறுதியாயிருந்தால்” என்ற மாற்றம் தற்போதைய தமிழில் அதிகச் சீராக ஒலிக்கிறது. மற்ற வாக்கிய அமைப்பும் கட்டளைத் தொனியும் நன்றாக உள்ளன.
