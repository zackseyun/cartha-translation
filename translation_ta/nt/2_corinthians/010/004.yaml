base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: ta
  text: ஏனெனில், நாங்கள் நடத்தும் போரின் ஆயுதங்கள் மாம்சத்திற்குரியவை அல்ல[a]; மாறாக, அரண்களைத் தகர்த்தழிப்பதற்குக் கடவுளின் பார்வையில் வல்லமையுள்ளவை[b]—வாதங்களையும்[c] தகர்த்தழிக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாம்சத்தைச் சார்ந்தவை அல்ல”; சூழலில், “வெறும் மனித ஆற்றலைச் சார்ந்தவை அல்ல” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுளால் வல்லமை பெற்றவை” அல்லது “தெய்வீக வல்லமை கொண்டவை.”
    reason: alternative_reading
  - marker: c
    text: “வாதங்கள்” என்பதற்கு “தர்க்கங்கள்,” “சிந்தனைகள்,” அல்லது “ஊகக் கருத்துகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: ஆயுதங்கள்
  rationale: இராணுவ உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: στρατείας
  choice: நாங்கள் நடத்தும் போர்
  rationale: தொடர்ந்து நடைபெறும் இராணுவப் போராட்டத்தின் உருவகத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σαρκικὰ
  choice: மாம்சத்துக்குரியவை
  rationale: வெறும் மனித வழிமுறைகளைக் குறிக்கும் சூழலை ஏற்றுக்கொண்டபோதும், பவுலின் ‘மாம்சம்’ என்ற சொல்லாட்சியையும் அதன் இறையியல் இழுவையையும் முன்கூட்டியே குறுக்காமல் காக்கிறது.
- source_word: δυνατὰ τῷ θεῷ
  choice: கடவுளுக்கு முன்பாக வல்லமை மிக்கவை
  rationale: τῷ θεῷ என்பதைக் கருவிப்பொருளாக மட்டும் முடிவுசெய்யாமல், கிரேக்கத் தொடரின் சுருக்கத்தையும் உண்மையான பொருள் தெளிவின்மையையும் தக்கவைக்கிறது.
- source_word: καθαίρεσιν
  choice: தகர்த்தழிக்க
  rationale: அரணை வீழ்த்தும் முற்றுகைப் போர் உருவகத்தை உயிரோட்டமாகப் பாதுகாக்கிறது.
- source_word: ὀχυρωμάτων
  choice: அரண்கள்
  rationale: பாதுகாப்பாகக் கட்டப்பட்ட வலிமையான நிலைகளைச் சுட்டும் இராணுவ உருவகத்துக்கு இயல்பான தமிழ் இணை.
- source_word: λογισμοὺς
  choice: வாதங்கள்
  rationale: அடுத்த வசனச் சூழலில் கடவுளை அறிதலுக்கு எதிராக நிற்கும் சிந்தனை முறைகளைச் சுட்டுவதால், நடுநிலையான ‘எண்ணங்கள்’ என்பதைக் காட்டிலும் ‘வாதங்கள்’ பொருத்தமானது.
- source_word: καθαιροῦντες
  choice: தகர்த்தழிக்கிறோம்
  rationale: καθαίρεσιν உடனான சொல் தொடர்பையும் மீளுரையின் வலிமையையும் தக்கவைக்கிறது; தமிழில் செய்பவரைத் தெளிவாக்க ‘அவற்றால்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: σαρκικὰ என்பதிலுள்ள மனித–தெய்வீக வழிமுறைகளின் எதிர்மறை ஒப்பீடு
  choice: மாம்சத்துக்குரியவை
  alternative: வெறும் மனித ஆற்றலைச் சார்ந்தவை
  rationale: இதனை ‘பாவமானவை’ அல்லது ‘உலகத்துக்குரியவை’ என்று குறுக்காமல், பவுலின் மாம்சம் சார்ந்த சொல் அமைப்பையும் இங்கு உள்ள வெறும் மனித வளங்களின் கருத்தையும் ஒன்றாகக் காக்கிறது.
- issue: δυνατὰ τῷ θεῷ என்பதில் τῷ θεῷ-ன் பங்கு
  choice: கடவுளுக்கு முன்பாக வல்லமை மிக்கவை
  alternative: கடவுளால் வல்லமை பெற்றவை; தெய்வீக வல்லமை கொண்டவை
  rationale: கிரேக்க வேற்றுமை உருபு உறவை நேரடியாக ‘கடவுளால்’ என்ற கருவிப்பொருளாகத் தீர்மானிக்காமல் அதன் சுருக்கத்தையும் மாற்று வாசிப்புகளையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சம்,’ ‘ஆயுதங்கள்,’ ‘அரண்கள்,’ ‘தகர்த்தழித்தல்’ ஆகிய சொற்கள் பவுலின் இறையியல் மொழியையும் தொடர்ச்சியான இராணுவ உருவகத்தையும் காக்கின்றன. கிரேக்க மூலத்தில் வழங்கப்பட்டுள்ள λογισμοὺς καθαιροῦντες தொடரும் மொழிபெயர்ப்பில் சேர்க்கப்பட்டுள்ளது.
