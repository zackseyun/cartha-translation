source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: ta
  text: நாங்களோ அளவுக்கு மீறிப் பெருமை பேசமாட்டோம். மாறாக, கடவுள் எங்களுக்குக் ஒதுக்கிய பணிப்பரப்பின்[a] அளவுக்கேற்பவே பெருமை பேசுவோம்—அந்த அளவு உங்கள்வரை எட்டுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணிப்பரப்பு’ என்பதற்கான கிரேக்கச் சொல் ‘அளவுகோல்,’ ‘நெறி,’ ‘தரநிலை’ அல்லது ‘ஒதுக்கப்பட்ட எல்லை’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: அளவுக்கு மீறி
  rationale: உரிய எல்லைகளைத் தாண்டுதல் என்ற இடைச்சொல் சார்ந்த பொருளையும், மூலத்தில் தொடரும் ‘அளவு’ உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: καυχησόμεθα
  choice: பெருமை பேசுவோம்
  rationale: பவுல் தமக்குரிய அதிகாரத்தையும் பணிக்கான உரிமையையும் முன்வைக்கும் விவாதச் சூழலில் உள்ள ‘boast/claim credit’ பொருளை எளிய, நேரடியான தமிழில் தருகிறது.
- source_word: κατὰ τὸ μέτρον
  choice: அளவுக்கேற்பவே
  rationale: ஒதுக்கப்பட்ட அளவோடு ஒத்திருக்க வேண்டும் என்ற கருத்தைத் தருவதோடு, μέτρον என்ற சொல்லின் அளவு உருவகத்தையும் காக்கிறது.
- source_word: κανόνος
  choice: பணிப்பரப்பு
  rationale: இங்கு இச்சொல் வெறும் நெறியையோ ஒழுக்க விதியையோ குறிக்காமல், கடவுள் ஒதுக்கிய பணியின் எல்லை அல்லது செயல்படும் பரப்பைக் குறிக்கிறது. அடுத்துவரும் ‘உங்கள்வரைக்கும் எட்டுகிறது’ என்ற இடவிரிவு மொழியோடும் இது பொருந்துகிறது.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: கடவுள் எங்களுக்கு ஒதுக்கிய
  rationale: μερίζω இங்கு ஒரு பங்கை அல்லது பணிப்பரப்பைப் பகுத்து வழங்குதல் என்ற பொருளில் உள்ளது; ‘ஒதுக்கிய’ என்பது இயல்பான தமிழில் அதைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: μέτρου
  choice: அந்த அளவு
  rationale: இரண்டாவது μέτρον, முன் கூறிய பணிப்பரப்பின் அளவை விளக்கும் வகையில் வருகிறது. ‘அந்த அளவு’ என மொழிபெயர்ப்பது மூலத்தின் சொல்லுருவ மீளுரைப்பை இயல்பாகக் காக்கிறது.
- source_word: ἐφικέσθαι
  choice: எட்டுகிறது
  rationale: ஒதுக்கப்பட்ட அளவு அல்லது பணிப்பரப்பு எவ்வளவு தூரம் விரிகிறது என்பதைக் குறிக்கும் வினையை இயல்பாகத் தருகிறது.
- source_word: ἄχρι καὶ ὑμῶν
  choice: உங்கள்வரைக்கும்
  rationale: ἄχρι குறிக்கும் எல்லையையும் καί வலியுறுத்தும் கொரிந்தியர்களின் உட்படுத்தலையும் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் பணியைக் குறிக்கும் κανών என்பதன் பொருள்
  choice: கொரிந்தியர்களையும் உள்ளடக்கும், கடவுள் ஒதுக்கிய பணிப்பரப்பு
  alternative: பவுல் தமது பெருமைப் பேச்சை அளக்கப் பயன்படுத்தும் நெறி அல்லது தரநிலை
  rationale: உடனடியான சூழலில் அளவு, எல்லை, ‘உங்கள்வரைக்கும் எட்டுகிறது’ ஆகியவை இடவிரிவையும் ஒதுக்கப்பட்ட பணியையும் வலியுறுத்துகின்றன. எனினும் κανών என்பதிலுள்ள அளவுகோல்/நெறி என்ற சாத்தியத்தை அடிக்குறிப்பு வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் ‘பெருமை பேசுதல்,’ ‘ஒதுக்கிய,’ ‘எட்டுகிறது’ போன்ற இயல்பான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் அளவு உருவகம் ‘அளவுக்கு மீறி / அளவுக்கேற்ப / அந்த அளவு’ என்ற தொடர் வழியாகக் காக்கப்பட்டுள்ளது; வசனத்தின் தொடர்ச்சியைக் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
