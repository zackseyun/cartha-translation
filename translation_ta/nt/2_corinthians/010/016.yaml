id: 2CO.10.16
reference: 2 Corinthians 10:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: ta
  text: உங்களுக்கு அப்பாலுள்ள பகுதிகளில் நற்செய்தியை அறிவிக்கவும்[a], வேறொருவருடைய பணிப்பரப்பில்[b] ஏற்கெனவே ஆயத்தமாக உள்ளவற்றைக் குறித்து பெருமைபாராட்டாமல் இருக்கவும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு அப்பாலுள்ள நாடுகளில் நற்செய்தியைப் பிரசங்கிக்கவும்.”
    reason: lexical_alternative
  - marker: b
    text: “பணிப்பரப்பு” என்பது இங்கு கிரேக்க κανών என்ற சொல்லை மொழிபெயர்க்கிறது. அது ஒழுக்க நெறியையோ பிற்காலத்தில் கூறப்படும் வேதாகமத் தொகுப்பையோ அல்ல; ஒருவருக்கு ஒதுக்கப்பட்ட பணிக் களத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “வேறொருவருடைய பணிக்களத்தில் ஏற்கெனவே செய்து முடிக்கப்பட்டவற்றைக் குறித்து பெருமைபாராட்டாமல் இருக்கவும்.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: உங்களுக்கு அப்பாலுள்ள பகுதிகளில்
  rationale: ὑπερέκεινα என்பது ஒரு குறிப்பிட்ட இடத்திற்கு அப்பால் அமைந்த பகுதிகளைக் குறிக்கிறது; ὑμῶν கொரிந்தியர்களை ஒப்பீட்டுப் புள்ளியாகக் காட்டுகிறது. தமிழில் இந்த இடவியல் உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὐαγγελίσασθαι
  choice: நற்செய்தியை அறிவிக்கவும்
  rationale: பவுலின் நற்செய்திப் பணியைத் தெளிவாகவும், திருச்சபைச் சிறப்புச் சொல்லாடலைத் தேவையின்றி சுமத்தாமலும் தெரிவிக்கிறது.
- source_word: ἐν ἀλλοτρίῳ κανόνι
  choice: வேறொருவருக்குரிய பணிவரம்பில்
  rationale: ἀλλοτρίῳ என்பது வேறொருவருக்குச் சொந்தமான அல்லது அவருக்குரிய ஒன்றைக் குறிக்கிறது; இச்சூழலில் κανών ஒரு நெறிமுறையையோ வேதாகமத் தொகுப்பையோ அல்ல, ஒதுக்கப்பட்ட பணிப்பரப்பின் வரம்பைக் குறிக்கிறது.
- source_word: εἰς τὰ ἕτοιμα
  choice: ஏற்கெனவே ஆயத்தமாக உள்ளவற்றைக் குறித்து
  rationale: ἕτοιμα இங்கு பெயர்ச்சொல் மதிப்பில் வரும் பன்மை நடுநிலை வடிவம். ‘உள்ளவை’ என்று மொழிபெயர்ப்பது மூலத்தின் பொதுமையைப் பாதுகாக்கிறது; அவை பிறர் செய்து முடித்த பணிகள் என்பதைக் கருத்துரையாக முதன்மை உரையில் சேர்ப்பதில்லை.
- source_word: καυχήσασθαι
  choice: பெருமைபாராட்டாமல் இருக்கவுமே
  rationale: சுற்றியுள்ள பகுதியில் திரும்பத் திரும்ப வரும் ‘பெருமைபாராட்டுதல்’ என்ற கருத்தின் சொற்தொடர்பைப் பேணுகிறது. οὐκ உடன் வரும் எதிர்மறை நோக்கத்தையும், இறுதியில் வரும் infinitive அமைப்பையும் தமிழில் இயல்பாக்குகிறது.
theological_decisions:
- issue: κανών என்பதன் பொருள்
  choice: ஒதுக்கப்பட்ட பணியின் வரம்பு அல்லது பணிப்பரப்பு
  alternative: நெறி, அளவுகோல், வேதாகமத் தொகுப்பு
  rationale: 2 கொரிந்தியர் 10:13–15 இன் உடனடிச் சூழல் அளிக்கப்பட்ட பணிவரம்புகளையும் உழைப்புப் பகுதிகளையும் பற்றியது. ஆகவே பிற்கால ‘கானன்’ என்ற பொருளையோ ஒழுக்க நெறி என்ற பொருளையோ இங்கு புகுத்தவில்லை.
- issue: τὰ ἕτοιμα எதைக் குறிக்கிறது
  choice: ஏற்கெனவே ஆயத்தமாக உள்ளவை
  alternative: பிறரால் ஏற்கெனவே செய்து முடிக்கப்பட்ட ஊழியப்பணி
  rationale: சூழல் பிறர் உழைத்த பணியைக் குறிப்பதாக வலுவாக உணர்த்தினாலும், கிரேக்கச் சொற்றொடர் சுருக்கமாகவும் பொதுவாகவும் உள்ளது. அந்தப் பொருள்விரிவை முதன்மை உரையில் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் விளக்குகிறது.
- issue: வசனத்தின் infinitive தொடரின் தொடர்பு
  choice: ‘அறிவிக்கவும் … பெருமைபாராட்டாமல் இருக்கவுமே’ என நோக்கத் தொடராக அமைத்தல்
  alternative: தனி கட்டளை வாக்கியமாக மொழிபெயர்த்தல்
  rationale: இரு aorist infinitive வடிவங்களும் முந்தைய வசனத்தின் நம்பிக்கை அல்லது நோக்கத்தோடு இலக்கண ரீதியாகத் தொடர்கின்றன. ஆகவே இவற்றை கட்டளைகளாக மாற்றாமல் தொடர்ச்சியைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நற்செய்தி’, ‘பணிவரம்பு’, ‘பெருமைபாராட்டுதல்’ ஆகியவை சூழலின் கருத்துத் தொடர்புகளைத் தெளிவாகப் பேணுகின்றன. மூலத்தின் சுருக்கமும் τὰ ἕτοιμα என்பதிலுள்ள பொருள் திறப்பும் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளன.
