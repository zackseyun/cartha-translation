  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: ta
  text: மற்றவர்களின் உழைப்பில் அளவுக்கு மீறிப் பெருமை பாராட்டாமல், உங்கள் விசுவாசம் வளரும்போது, எங்களுக்கு வரையறுக்கப்பட்ட பணிக்களத்தின்படி[a] உங்களிடையே எங்கள் பணி மிகுதியாக[c] விரிவடையும்[b] என்ற நம்பிக்கையுடன் இருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுக்கு அளிக்கப்பட்ட அளவின்படி” அல்லது “எங்கள் வரம்பின்படி.” இங்கு கிரேக்கச் சொல் அளந்து வரையறுக்கப்பட்ட பணிப்பரப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாங்கள் உங்களிடையே பெரிதாக்கப்படுவோம்” அல்லது “நாங்கள் உங்களிடையே உயர்வாக மதிக்கப்படுவோம்.” சூழலில் இது பவுலின் தனிப்பட்ட பெருமையைவிட அவரது அப்போஸ்தலப் பணி விரிவடைவதைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: “மிகுதியாக” என்பதற்கு, “இன்னும் அதிக அளவுக்கு” அல்லது “மேலும் விரிவடையும்படி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: அளவுக்கு மீறிப் பெருமைபாராட்டாமல்
  rationale: அளவு அல்லது எல்லை என்ற உருவகத்தை இயல்பான தமிழில் காத்து, தமக்கு உரிய வரம்புக்கு அப்பால் பெருமை கூறாததைக் குறிக்கிறது.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: மற்றவர்களின் உழைப்பைக் குறித்து
  rationale: பிறர் செய்த கடின உழைப்புக்குத் தாம் உரிமை கோரிப் பெருமை கூறவில்லை என்ற சூழல்சார் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: உங்கள் விசுவாசம் வளர வளர
  rationale: நடந்துகொண்டிருக்கும் வளர்ச்சியை இயல்பான தமிழில் தெரிவித்து, πίστις என்பதற்கு வழக்கமான ‘விசுவாசம்’ என்பதைப் பயன்படுத்துகிறது.
- source_word: ἐν ὑμῖν μεγαλυνθῆναι
  choice: எங்கள் பணி உங்களிடையே மிகுதியாக விரிவடையும்
  rationale: ἐν ὑμῖν என்பதை ‘உங்களிடையே’ என μεγαλυνθῆναι உடன் இணைக்கிறது; சூழலில் பவுலின் தனிப்பட்ட மகிமையை அல்ல, அவரது பணி விரிவடைவதைக் குறிக்கிறது. ‘எங்கள் பணி’ என்பது தமிழில் தேவையான சூழல்சார் வெளிப்படுத்தல்.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: எங்களுக்கு வரையறுக்கப்பட்ட பணிக்களத்தின்படி
  rationale: κανών இங்கு பிற்கால ‘திருமுறை’ அல்லது வெறும் விதியைக் குறிக்காமல், அளந்து ஒதுக்கப்பட்ட ஊழியப் பரப்பைக் குறிக்கிறது.
- source_word: εἰς περισσείαν
  choice: மிகுதியாக
  rationale: மேலும் பெருகுதல் அல்லது விரிவடைதல் என்ற திசைநோக்கிய பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: μεγαλυνθῆναι என்பதன் பொருள்
  choice: பவுலின் பணி உங்களிடையே மிகுதியாக விரிவடைவது
  alternative: பவுல் கொரிந்தியர்களிடையே அதிகமாக மதிக்கப்படுவது அல்லது மகிமைப்படுத்தப்படுவது
  rationale: சுற்றியுள்ள வசனங்கள் பிறருடைய உழைப்பில் பெருமை கூறாமையையும், கடவுள் அளித்த பணிக்களத்தையும் பற்றியவை. ஆகவே பணி விரிவடைவதே முதன்மையான சூழல்சார் பொருள்; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: κανών என்பதன் சூழல்சார் பொருள்
  choice: வரையறுக்கப்பட்ட பணிக்களம்
  alternative: அளவு, வரம்பு, விதி
  rationale: 10:13–16 இல் அப்போஸ்தலப் பணிக்கென அளிக்கப்பட்ட எல்லை அல்லது பரப்பே கருத்து. ‘பணிக்களம்’ இதைத் தெளிவாக்கினாலும், கிரேக்கச் சொல்லின் உருவக மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்பு காக்கப்பட்டு, தமிழில் பொருள் தெளிவாக இருக்க ‘எங்கள் பணி’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. ‘ஊழியம்’ என்ற சமயக்குழு சார்ந்த ஒலியைவிட ‘பணி/பணிக்களம்’ பயன்படுத்தப்பட்டுள்ளது.
