- from: ஆனால் பெருமை கொள்கிறவர், ஆண்டவரிலேயே பெருமை கொள்ளட்டும்[a].
  to: ஆனால் பெருமை கொள்கிறவர், ஆண்டவரில் பெருமை கொள்ளட்டும்[a].
  rationale: -ஏ என்ற மூலத்தில் இல்லாத வலியுறுத்தல் நீக்கப்பட்டுள்ளது; இதனால் ἐν κυρίῳ என்பதன் திறந்த, குறியீடற்ற தொடர்பு தக்கவைக்கப்படுகிறது. அடிக்குறிப்பில் ஒரு சிறிய நடையியல் திருத்தம் மட்டும் செய்யப்பட்டுள்ளது; அதன் மேற்கோள்-எதிரொலி தகவல் மாற்றப்படவில்லை.
