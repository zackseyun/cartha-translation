  yaml_path: translation/nt/2_corinthians/010/017.yaml
  text: But the one who boasts must boast in the Lord[a].
translation:
  language: ta
  text: ஆனால் பெருமை கொள்கிறவர், ஆண்டவரில் பெருமை கொள்ளட்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்சொல்லாக: “பெருமை கொள்கிறவர் ஆண்டவரில் பெருமை கொள்ளட்டும்.” பவுல் எரேமியா 9:24-ஐ (செப்துவஜிந்தில் 9:23) எதிரொலிப்பதாகத் தெரிகிறது.'
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: பெருமை கொள்கிறவர்
  rationale: கட்டுருபுடன் வரும் நிகழ்காலப் பங்கேற்புவினை பொதுவாக இப்படிச் செய்கிற ஒருவரைக் குறிக்கிறது. பாலினத்தை முன்னிறுத்தாத இயல்பான நவீனத் தமிழில் இது பிரதிநிதித்துவ ஒருமையைத் தக்கவைக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வாதத்துடன் உள்ள மிதமான முரண்பாட்டைக் காட்டுகிறது; தவறான பெருமைக்கு எதிராகத் தகுந்த பெருமையைப் பவுல் முன்வைக்கும் சூழலுக்கு இது பொருந்துகிறது.
- source_word: καυχώμενος / καυχάσθω
  choice: பெருமை கொள்கிறவர் / பெருமை கொள்ளட்டும்
  rationale: ஒரே கிரேக்க வேர்ச்சொல்லின் மறுபயன்பாட்டைத் தமிழிலும் தக்கவைக்கிறது. ‘பெருமை கொள்ளட்டும்’ என்பது மூன்றாம் நபர் கட்டளையின் அறிவுறுத்தும் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν
  choice: -இலேயே
  rationale: ἐν κυρίῳ என்பதன் உரைக்கோலையும், பெருமையின் அடிப்படை அல்லது வட்டம் ஆண்டவரே என்பதையும் ‘ஆண்டவரிலேயே’ இயல்பாக வெளிப்படுத்துகிறது; ‘-ஏ’ வலியுறுத்தலைத் தருகிறது.
- source_word: κυρίῳ
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கு நவீன, கண்ணியமான தமிழ்ச் சொல். இங்கு அது தேவனையா ஆண்டவர் இயேசுவையா குறிப்பதாகத் தனியே விளக்காமல், மூலத்தின் இறையியல் திறந்தநிலையைப் பேணுகிறது.
theological_decisions:
- issue: வேதாகம எதிரொலியுள்ள சூழலில் ‘ஆண்டவர்’ என்பதன் குறிப்பு
  choice: ஆண்டவர்
  alternative: ஆண்டவர் இயேசு / தேவன்
  rationale: எரேமியாவின் சொற்களைப் பவுல் எதிரொலிக்கச் செய்வதாகத் தெரிந்தாலும், கிரேக்கம் κυρίῳ என்று மட்டுமே கூறுகிறது. ஆகவே குறிப்பை விளக்கிச் சுருக்காமல் இறையியல் ஒலிப்பையும் சாத்தியமான இருபொருள் தொடர்பையும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பெருமை கொள்’ என்ற தொடரின் இருமுறை பயன்பாடு கிரேக்கச் சொல்லாட்சியின் வலிமையைத் தக்கவைக்கிறது; ‘கொள்ளட்டும்’ கட்டளையை அருவருப்பற்ற அறிவுறுத்தலாக வெளிப்படுத்துகிறது.
