revisions:
- from: நாங்கள் உங்கள்வரை எட்டாதவர்கள்போல, அளவுக்கு மீறி எங்களை நீட்டிக்கொள்வதில்லை. ஏனெனில் மேசியாவின்[a] நற்செய்தியுடன் உங்கள்வரைக்கும்கூட நாங்கள் வந்தடைந்தோம்—
