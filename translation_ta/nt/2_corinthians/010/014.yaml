id: 2CO.10.14
reference: 2 Corinthians 10:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: ta
  text: நாங்கள் உங்களை எட்டாதவர்களைப்போல, எங்கள் எல்லையை அளவுக்கு மீறி விரிவுபடுத்திக்கொள்வதில்லை. ஏனெனில் மேசியாவின்[a] நற்செய்தியுடன் உங்கள்வரைக்கும்கூட நாங்கள் வந்தடைந்தோம்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: அளவுக்கு மீறி எங்களை நீட்டிக்கொள்வதில்லை
  rationale: வரையறுக்கப்பட்ட எல்லைக்கு அப்பால் தன்னை நீட்டுதல் என்ற கிரேக்க உருவகத்தைத் தக்கவைத்து, நவீனத் தமிழில் புரியும்படி கூறுகிறது.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: உங்கள்வரை எட்டாதவர்கள்போல
  rationale: பவுலும் அவருடைய உடன் ஊழியர்களும் கொரிந்தியரை எட்டவில்லை என்ற கற்பனையான நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: ஏனெனில் ... உங்கள்வரைக்கும்கூட நாங்கள் வந்தடைந்தோம்
  rationale: ἐφθάσαμεν என்பதன் நிறைவுற்ற வருகையையும் καί தரும் வலியுறுத்தலையும் ‘கூட’ என்பதன்மூலம் காக்கிறது.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: நற்செய்தியுடன்
  rationale: ἐν என்பதில் இங்கு காணப்படும் உடனிணைவு அல்லது ஊழியச் சூழல் சார்ந்த பொருளை தேவையின்றி ஒரே இலக்கண விளக்கமாகக் கட்டுப்படுத்தாமல் இயல்பாகத் தருகிறது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு நற்செய்தியை வரையறுக்கும் பட்டமாகப் பயன்படுவதால், அதன் அபிஷேகம் செய்யப்பட்ட அரசர் என்ற பட்டப்பொருளைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இந்த இடத்தில் Χριστός வெறும் பெயர்போல இல்லாமல் பட்டப்பொருளுடன் செயல்படுகிறது. ஆயினும் தமிழ்க் கிறிஸ்தவ வழக்கில் நிலைபெற்ற ‘கிறிஸ்து’ என்ற வடிவமும் பொருத்தமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν τῷ εὐαγγελίῳ என்பதன் உறவு
  choice: நற்செய்தியுடன்
  alternative: நற்செய்தியில் / நற்செய்தியின் மூலம்
  rationale: கிரேக்க ἐν இங்கு உடனிணைவு, செயல்படும் தளம், அல்லது கருவி ஆகிய நெருங்கிய நுணுக்கங்களைத் தாங்கலாம்; முதன்மை உரை அவற்றில் ஒன்றை மட்டும் இறுதியாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீட்டிக்கொள்வது’ என்ற உருவகம் மூலத்தின் சொல்விளையாட்டைத் தக்கவைக்கிறது; ‘உங்கள்வரைக்கும்கூட’ என்பது καί-இன் வலியுறுத்தலை இயல்பான தமிழில் காட்டுகிறது. இறுதிக் கோடு அடுத்த வசனத்துடன் தொடரும் வாக்கிய ஓட்டத்தைச் சுட்டுகிறது.
