  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: ta
  text: ஏனெனில், நாம் மாம்சத்தில்[a] வாழ்ந்தாலும், மாம்சத்தின்படி போர் செய்வதில்லை—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: ‘நாம் உடலில் வாழ்ந்தாலும், வெறும் மனித அளவுகோல்களின்படி போர் செய்வதில்லை.’'
    reason: ἐν σαρκὶ மற்றும் κατὰ σάρκα ஆகியவற்றின் சூழல்சார்ந்த, விளக்கமான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: மாம்சத்தில்
  rationale: முதல் σάρξ உடலோடு கூடிய மனித வாழ்வைக் குறிக்கிறது. ‘மாம்சத்தில்’ என்பது பவுலின் சொல் மீளுருவாக்கத்தையும் அடுத்த சொற்றொடருடனான முரணையும் காக்கிறது; இதை ‘பாவ இயல்பு’ என்று குறுக்கிப் பொருள்கொள்ளவில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: περιπατοῦντες
  choice: வாழ்ந்தாலும்
  rationale: சொல்லடியாக ‘நடந்தாலும்’ எனலாம்; இங்கு περιπατέω மனித வாழ்க்கை நடத்துதலைக் குறிக்கிறது. பின்வரும் மறுப்புடன் உள்ள concessive உறவை இயல்பான தமிழில் ‘வாழ்ந்தாலும்’ வெளிப்படுத்துகிறது.
- source_word: οὐ κατὰ σάρκα
  choice: மாம்சத்தின்படி ... இல்லை
  rationale: κατά இங்கு அளவுகோல் அல்லது வழிமுறையைக் குறிக்கிறது. ‘மாம்சத்தின்படி’ என்பது மனித, உலகியலான, அல்லது மாம்சத்துக்குரிய வழி என்ற நுண்பொருள்களை ஒன்றாகச் சுருக்காமல், இரு σάρξ பயன்பாடுகளின் சொல் ஒற்றுமையைக் காக்கிறது.
- source_word: στρατευόμεθα
  choice: போர் செய்வதில்லை
  rationale: அப்போஸ்தலப் பணியின் மோதலை விளக்கும் இராணுவ உருவகத்தை இயல்பான நவீன தமிழில் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: இரு இடங்களிலும் σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் இரண்டையும் ‘மாம்சம்’ என்ற ஒரே சொல்லால் மொழிபெயர்த்தல்
  alternative: ‘உடலில் வாழ்ந்தாலும், வெறும் மனித அளவுகோல்களின்படி போர் செய்வதில்லை’
  rationale: முதல் பயன்பாடு உடல்சார்ந்த மனித இருப்பையும், இரண்டாவது மனித அல்லது மாம்சத்துக்குரிய வழிமுறைகளையும் சுட்டுகிறது. ஒரே சொல்லை வைத்திருப்பது பவுலின் சொல்லாட்சித் திருப்பத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது; ‘பாவ இயல்பு’ போன்ற குறுகிய விளக்கத்தை உரைக்குள் புகுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சம்’ வேதாகமச் சொல்லாட்சியையும் மூலத்தின் மீளுருவாக்கத்தையும் காக்கிறது; அதன் பொருள் அடிக்குறிப்பில் இயல்பான தமிழில் விளக்கப்படுகிறது. வசன முடிவிலுள்ள கோடு அடுத்த வசனத்துடன் தொடரும் வாக்கிய ஓட்டத்தைக் குறிக்கிறது.
