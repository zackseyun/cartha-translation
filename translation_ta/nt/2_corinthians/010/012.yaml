source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: ta
  text: ஏனெனில், தங்களைத் தாங்களே பாராட்டிக்கொள்ளும் சிலருடன் எங்களை ஒரே வகையில் சேர்த்துக்கொள்ளவோ, அவர்களுடன் எங்களை ஒப்பிட்டுப் பார்க்கவோ நாங்கள் துணிவதில்லை.[a] ஆனால் அவர்கள் தங்களுக்குள்ளே தங்களை அளந்து, தங்களோடு தங்களையே ஒப்பிட்டுப் பார்க்கிறார்கள்; அவர்கள் புரிந்துகொள்வதில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுள் எங்களையும் சேர்த்துக்கொள்ளவோ” அல்லது “அவர்களுடன் எங்களையும் ஒரே தரத்தில் வைக்கவோ.” கிரேக்க வினைச்சொல், பிறரோடு தன்னையும் ஒரே வகையில் வைப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “தங்களுக்குள் தங்களை அளந்து, தங்களோடு தங்களையே ஒப்பிட்டுப் பார்த்து.” அவர்கள் தங்களையே தங்கள் மதிப்பீட்டின் அளவுகோலாகப் பயன்படுத்துகிறார்கள் என்பதே கருத்து.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: நாங்கள் துணிவதில்லை
  rationale: ஒரு செயலைச் செய்யத் துணிதல் அல்லது அதற்கு முனைதல் என்ற பொருளைத் தருகிறது; பவுலின் ஏளனத் தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐγκρῖναι
  choice: எங்களை ஒரே வகையில் சேர்த்துக்கொள்ள
  rationale: இங்கு ஒழுக்கத் தீர்ப்பைக் குறிக்காமல், பிறரோடு தன்னை ஒரே பிரிவில் அல்லது தரவரிசையில் வைப்பதைக் குறிக்கிறது.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: ஒப்பிட்டுப் பார்க்க / ஒப்பிட்டுப் பார்ப்பதால்
  rationale: இரண்டு இடங்களிலும் ஒப்பீடு என்ற அடிப்படைப் பொருளையும் கிரேக்கத்தின் சொல்லாட்சித் திருப்பத்தையும் காக்கிறது.
- source_word: ἑαυτοὺς συνιστανόντων
  choice: தங்களைத் தாங்களே பாராட்டிக்கொள்ளும்
  rationale: இந்தப் பகுதியில் முக்கியமான தன்னைத் தானே பரிந்துரைத்தல் அல்லது புகழ்ந்து முன்வைத்தல் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μετροῦντες
  choice: அளவிட்டு
  rationale: மதிப்பிடுதல் என்ற உருவகப் பொருள் இருந்தாலும், மூலத்தின் ‘அளத்தல்’ உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: ἐν ἑαυτοῖς
  choice: தங்களையே அளவுகோலாகக் கொண்டு
  rationale: கிரேக்கச் சொற்றொடரின் சூழல்சார் கருத்தான, தங்களையே தங்கள் மதிப்பீட்டின் தரநிலையாக்குவதைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐ συνιᾶσιν
  choice: புரிந்துகொள்ளாமல் இருக்கிறார்கள்
  rationale: அவர்களின் தற்சார்பு ஒப்பீட்டின் மடமையை அவர்கள் உணரவில்லை என்ற உட்பொருளை, கூடுதல் பொருளைத் திணிக்காமல் தெரிவிக்கிறது.
theological_decisions:
- issue: οὐ συνιᾶσιν என்பதன் மறைமுகச் செயப்படுபொருள்
  choice: எதைப் புரிந்துகொள்ளவில்லை என்று வசனத்தில் நிரப்பாமல் விடப்பட்டது
  alternative: தங்கள் செயல் எவ்வளவு அறிவற்றது என்பதை அவர்கள் புரிந்துகொள்வதில்லை
  rationale: கிரேக்கத்தில் புரிந்துகொள்ளப்படுவது என்ன என்பது வெளிப்படையாகக் கூறப்படவில்லை; அந்த உண்மையான மறைபொருள் தன்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் இயல்பும் காக்கப்பட்டுள்ளன. ‘அளவிட்டு’ என்ற உருவகம் மற்றும் திரும்பத் திரும்ப வரும் தற்சுட்டுச் சொற்களின் வலிமை முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன.
