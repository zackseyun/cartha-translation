revisions:
- from: தங்களைத் தாங்களே பாராட்டிக்கொள்ளும் சிலரோடு எங்களை ஒரே வகையில் சேர்த்துக்கொள்ளவோ, அவர்களோடு எங்களை ஒப்பிட்டுப் பார்க்கவோ நாங்கள் துணிவதில்லை.[a] ஆனால் அவர்களோ, தங்களையே அளவுகோலாகக் கொண்டு தங்களை அளவிட்டு, தங்களோடு தங்களையே ஒப்பிட்டுப் பார்ப்பதால்,[b] புரிந்துகொள்ளாமல் இருக்கிறார்கள்.
  to: ஏனெனில், தங்களைத் தாங்களே பாராட்டிக்கொள்ளும் சிலருடன் எங்களை ஒரே வகையில் சேர்த்துக்கொள்ளவோ, அவர்களுடன் எங்களை ஒப்பிட்டுப் பார்க்கவோ நாங்கள் துணிவதில்லை.[a] ஆனால் அவர்கள் தங்களுக்குள்ளே தங்களை அளந்து, தங்களோடு தங்களையே ஒப்பிட்டுப் பார்க்கிறார்கள்; அவர்கள் புரிந்துகொள்வதில்லை.[b]
  rationale: The revision preserves the source's emphatic reflexive repetition and avoids presenting an inferred causal relationship or explanatory expansion as though it were explicit in the Greek. It also renders the final verb as a direct present-tense assertion without supplying an object for “understand.”
