  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: ta
  text: ஏனெனில், நாங்கள் தன்னிலை மறந்தவர்களாக இருந்தால்[a], அது கடவுளுக்காக; நாங்கள் தெளிந்த மனதுடன் இருந்தால்[b], அது உங்களுக்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புத்தி பேதலித்தவர்களாக இருக்கிறோம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நிதானமான மனநிலையில் இருக்கிறோம்”; “சுயகட்டுப்பாட்டுடன் இருக்கிறோம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: '... என்றால் ... என்றால்'
  rationale: இரு மாற்று நிலைகளை எதிரெதிராக நிறுத்தும் அமைப்பை இயல்பான நவீன தமிழில் மீண்டும் வரும் ‘என்றால்’ வடிவம் தெளிவாகக் காட்டுகிறது; ‘ஒன்று... அல்லது...’ என்ற பொருள்சாயலும் தொடர்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்திய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἐξέστημεν
  choice: சுயநினைவை இழந்தவர்களாக இருக்கிறோம்
  rationale: இங்கு வினைச்சொல் ‘தன்னிலை பிறழ்ந்திருத்தல் / புத்தி பேதலித்தவர்போல் இருத்தல்’ என்ற பொருளைக் கொள்ள முடியும். இந்தத் தேர்வு உண்மையான பைத்தியத்தை உறுதிப்படுத்தாமல், பிறருக்குத் தோன்றும் பகுத்தறிவற்ற அல்லது பரவசமான நிலையையும் உள்ளடக்குகிறது.
- source_word: θεῷ
  choice: கடவுளுக்காக
  rationale: சுருக்கமாக விடப்பட்டுள்ள தரவுவேற்றுமை வடிவத்தை, கடவுளை நோக்கிய அல்லது அவருக்குரிய நலன்/சார்பைக் குறிக்கும் இயல்பான தமிழாக வழங்குகிறது.
- source_word: σωφρονοῦμεν
  choice: தெளிந்த சிந்தையுடன் இருக்கிறோம்
  rationale: சீரான புத்தி, நிதானம், தன்னடக்கம் ஆகிய பொருள் எல்லையைத் தக்கவைத்தபடி, எதிர்மறையான ἐξέστημεν என்பதோடு தெளிவான முரணை உருவாக்குகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்காக
  rationale: கொரிந்தியரின் நன்மைக்காக அல்லது அவர்களை முன்னிட்டு பவுலின் நிதானமான நடத்தை இருப்பதைத் தெரிவிக்கும் தரவுவேற்றுமைப் பொருளை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: பவுலின் முரண்பட்ட சுயவிவரிப்பை எவ்வாறு புரிந்துகொள்வது
  choice: பகுத்தறிவற்றவர் அல்லது பரவசமடைந்தவர் எனத் தோன்றும் நடத்தையையும், நிதானமான நடத்தையையும் பவுல் எதிரெதிராக வைக்கிறார்; அவர் உண்மையிலேயே மனநோயுற்றவர் என்று மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
  alternative: இது உண்மையான மதப் பரவச அனுபவத்தைக் குறிக்கிறது; அல்லது எதிரிகளின் குற்றச்சாட்டை மட்டும் மிகைப்படுத்திக் கூறுகிறது.
  rationale: கிரேக்க வாக்கியம் சுருக்கமானதும் சொல்லாட்சித் தன்மை கொண்டதும் ஆகும். ஆகவே பரவச அனுபவம் என்ற தொழில்நுட்ப விளக்கத்தையோ, வெறும் அவமதிப்பு என்ற குறுகிய விளக்கத்தையோ திணிக்காமல் அதன் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘சுயநினைவை இழந்தவர்கள்’ மற்றும் ‘தெளிந்த சிந்தை’ என்ற எதிரிணை, மூலத்தின் கூர்மையான முரணைப் பாதுகாக்கிறது; அடிக்குறிப்புகள் முக்கிய சொற்பொருள் மாற்றுகளைத் தருகின்றன.
