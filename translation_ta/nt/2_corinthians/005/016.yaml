id: 2CO.5.16
reference: 2 Corinthians 5:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: ta
  text: ஆகவே, இனிமேல் நாங்கள் யாரையும் மாம்சத்தின்படி[a] கருதுவதில்லை. நாங்கள் மெசியாவை[b] மாம்சத்தின்படி அறிந்திருந்தாலும்கூட, இப்போது அவரை இனி அவ்வாறு அறியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனிதக் கண்ணோட்டத்தின்படி’ அல்லது ‘உலக அளவுகோல்களின்படி.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் கிறிஸ்தோன் (Christon); இதற்கு ‘அபிஷேகம் செய்யப்பட்டவர்,’ அதாவது ‘மெசியா’ என்று பொருள். மரபாக ‘கிறிஸ்து’ என மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து பெறப்படும் முடிவைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: ἀπὸ τοῦ νῦν
  choice: இனிமேல்
  rationale: இப்போதிலிருந்து தொடரும் தீர்மானமான மாற்றத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οὐδένα
  choice: யாரையும் ... இல்லை
  rationale: எவரும் விதிவிலக்கல்ல என்ற கிரேக்க எதிர்மறைப் பொருளைத் தமிழின் இயல்பான எதிர்மறை அமைப்பில் தருகிறது.
- source_word: οἴδαμεν
  choice: மதிப்பிடுவதில்லை
  rationale: κατὰ σάρκα என்பதுடன் சேர்ந்துள்ள சூழலில், வெறுமனே ஒருவரை அறிதலைவிட அவரைப் பற்றிய பார்வை அல்லது மதிப்பீட்டைக் குறிக்கிறது.
- source_word: κατὰ σάρκα
  choice: மாம்சத்தின்படி
  rationale: பவுலின் முக்கியமான σάρξ சொல்லாட்சியை முதன்மை உரையில் காக்கிறது; இங்கு அது பாவ இயல்பை மட்டும் குறிக்காமல், மனித அல்லது உலக அளவுகோல்களின்படி பார்ப்பதைக் குறிக்கலாம்.
- source_word: εἰ καὶ
  choice: அறிந்திருந்தாலும்கூட
  rationale: கிரேக்கத்தின் concessive தன்மையைக் காத்து, ‘அப்படியிருந்தாலும்’ என்ற வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: ἐγνώκαμεν
  choice: அறிந்திருந்தோம்
  rationale: கடந்தகால அறிதலையும் அதன் தற்போதைய தொடர்பையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Χριστόν
  choice: மெசியாவை
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுவதால், அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀλλὰ νῦν οὐκέτι
  choice: இப்போது ... இனி ... இல்லை
  rationale: முந்தைய அறிதல் முறைக்கும் தற்போதைய நிலைக்கும் இடையிலான வலுவான மாற்றத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: γινώσκομεν
  choice: அவரை ... அறிந்துகொள்வதில்லை
  rationale: முந்தைய வாக்கியத் துண்டிலுள்ள மெசியாவையே பொருளாகத் தெளிவுபடுத்தி, மாறியது அவரைப் பற்றிய அறிதலின் முறை என்பதை ‘அவ்வாறு’ என்பதன் மூலம் காட்டுகிறது.
theological_decisions:
- issue: κατὰ σάρκα என்பது மனிதர்களுக்கும் மெசியாவுக்கும் தொடர்பாக என்ன பொருள் தருகிறது?
  choice: முதன்மை உரையில் ‘மாம்சத்தின்படி’ என்று வைத்து, வெறும் மனித அல்லது உலக அளவுகோல்களின் அடிப்படையிலான மதிப்பீடு என்ற பொருளைத் திறந்தவையாக வைத்தல்.
  alternative: ‘மனிதக் கண்ணோட்டத்தின்படி’ அல்லது ‘உலக அளவுகோல்களின்படி’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: பவுலின் ‘மாம்சம்’ சொல்லாட்சியையும் அதன் இறையியல் அழுத்தத்தையும் காக்கிறது. அதேவேளை, மெசியாவின் உண்மையான மனிதத்தன்மையை மறுப்பதாக வசனத்தை மாற்றாமல், அவரை மதிப்பிடும் முந்தைய, போதாமையான முறையையே மறுக்கிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அது பெயராக மட்டும் அல்லாமல் பட்டமாகவும் செயல்படுகிறது; ‘மெசியா’ என்பது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டத்தின் பொருளை வாசகருக்குத் தெளிவாக வைத்திருக்கிறது.
- issue: εἰ καὶ என்பதிலுள்ள நிபந்தனை அல்லது ஒப்புக்கொள்ளும் நுணுக்கம்
  choice: ‘அறிந்திருந்தாலும்கூட’ என்று மொழிபெயர்த்து இரு நுணுக்கங்களுக்கும் இடமளித்தல்.
  alternative: ‘அறிந்திருந்தபோதிலும்’ என்று உண்மையான கடந்த நிகழ்வாகத் தெளிவுபடுத்தல்.
  rationale: கிரேக்க வடிவத்தின் ‘even if/even though’ என்ற உண்மையான விளக்க வாய்ப்பைத் தேவையின்றி முடிவுசெய்யாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதைமிக்க நடையைக் கடைப்பிடிக்கிறது. ‘மாம்சத்தின்படி’ என்ற சற்று மரபார்ந்த சொற்றொடர் மூலத்தின் இறையியல் சொல்லாட்சியைப் பாதுகாக்கத் திட்டமிட்டு வைக்கப்பட்டுள்ளது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
