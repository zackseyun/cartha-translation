- from: ஆகவே, இனிமேல் நாங்கள் யாரையும் மாம்சத்தின்படி[a] மதிப்பிடுவதில்லை. நாங்கள் மெசியாவை[b] மாம்சத்தின்படி அறிந்திருந்தாலும்கூட, இப்போது அவரை இனி அவ்வாறு அறிந்துகொள்வதில்லை.
