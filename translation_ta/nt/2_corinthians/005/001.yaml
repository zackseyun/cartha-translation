source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: ta
  text: ஏனெனில், நமது பூமிக்குரிய கூடார வீடு[a] கலைக்கப்பட்டால்[b], கடவுளிடமிருந்து வரும் ஒரு கட்டடம் நமக்கு உண்டு[c] என்பதை நாம் அறிவோம்; அது மனிதக் கைகளால் உருவாக்கப்படாத[d], பரலோகங்களில் உள்ள நித்திய வீடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, ‘கூடாரமாகிய பூமிக்குரிய நமது வீடு.’ கிரேக்க வாசகம் இப்போதைய சாவுக்குரிய உறைவிடத்தைச் சித்தரிக்க ‘வீடு’, ‘கூடாரம்’ ஆகிய இரு உருவகங்களையும் தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: மாற்றாக, ‘அழிக்கப்பட்டால்’ அல்லது ‘பிரித்து அகற்றப்பட்டால்.’ இவ்வினைச்சொல் ஒரு கட்டமைப்பைக் கலைப்பதைக் குறிக்கலாம்; இது கூடார உருவகத்திற்குப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்க உரை ‘நமக்கு உண்டாகும்’ என்று அல்ல, ‘நமக்கு உண்டு’ என்று நிகழ்காலத்தில் கூறுகிறது. தற்போதைய உடைமைக்கும் வருங்கால நிறைவேற்றத்திற்கும் இடையிலான அழுத்தம் இதனால் தக்கவைக்கப்படுகிறது.
    reason: alternative_reading
  - marker: d
    text: சொல்லர்த்தமாக, ‘கைகளால் செய்யப்படாத.’ இது மனித முயற்சியால் அல்ல, கடவுளிடமிருந்து தோன்றியதைக் குறிக்கும் வேதாகமச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν γὰρ
  choice: ஏனெனில் ... நமக்குத் தெரியும்
  rationale: οἴδαμεν உறுதியான அறிவைக் குறிக்கிறது; γάρ முந்தைய கருத்துக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக ‘ஏனெனில்’ தொடக்கத்திலும் ‘நமக்குத் தெரியும்’ இறுதியிலும் வைக்கப்பட்டுள்ளன.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: பூமிக்குரிய நமது கூடார வீடு
  rationale: οἰκία என்பதன் ‘வீடு’ உருவகத்தையும் σκῆνος என்பதன் ‘கூடாரம்’ உருவகத்தையும் ஒன்றையும் நீக்காமல் தக்கவைக்கிறது; அதை நேரடியாக ‘உடல்’ என்று விளக்கவில்லை.
- source_word: ἐὰν ... καταλυθῇ
  choice: '... கலைக்கப்பட்டால்'
  rationale: எதிர்கால நிபந்தனையை ‘-ப்பட்டால்’ காட்டுகிறது. καταλύω ஒரு கட்டமைப்பை, குறிப்பாகக் கூடாரத்தை, பிரித்துக் கலைப்பதையும் அழிப்பதையும் குறிக்கக்கூடும்; ‘கலைக்கப்படுதல்’ கூடார உருவகத்துடன் இயல்பாகப் பொருந்துகிறது.
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: கடவுளிடமிருந்து வரும் ஒரு கட்டடம்
  rationale: οἰκοδομή இங்கு கட்டமைப்பைக் குறிக்கும் பெயர்ச்சொல்லாகவும், ἐκ θεοῦ அதன் தெய்வீக மூலத்தைக் குறிக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἔχομεν
  choice: நமக்கு உண்டு
  rationale: கிரேக்க நிகழ்காலத்தை எதிர்காலமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: οἰκίαν ἀχειροποίητον
  choice: மனிதக் கைகளால் உருவாக்கப்படாத ... வீடு
  rationale: ἀχειροποίητος என்பதன் மனிதரால் செய்யப்படாத தெய்வீகத் தோற்றம் என்ற வேதாகம ஒலிப்பை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: αἰώνιον ἐν τοῖς οὐρανοῖς
  choice: பரலோகங்களில் உள்ள நித்திய
  rationale: αἰώνιος என்பதற்கு ‘நித்திய’ என்றும், οὐρανοῖς என்ற பன்மை வடிவத்துக்குப் ‘பரலோகங்களில்’ என்றும் மொழிபெயர்த்து, நிலையற்ற பூமிக்குரிய உறைவிடத்துடனான மாறுபாட்டைக் காக்கிறது.
theological_decisions:
- issue: உறைவிட உருவகத்தின் குறிப்பு
  choice: ‘வீடு’, ‘கூடாரம்’, ‘கட்டடம்’ ஆகிய உருவகங்களை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘நமது பூமிக்குரிய உடல் அழிக்கப்பட்டால்’ என்று நேரடியாக விளக்குதல்
  rationale: உடலே இவ்வுருவகத்தின் சூழல்சார் குறிப்பு என்றாலும், கிரேக்க உரை பல அடுக்குகளைக் கொண்ட கட்டட மற்றும் கூடார உருவகங்களைப் பயன்படுத்துகிறது. ‘உடல்’ என்று மாற்றுவது மொழிபெயர்ப்பிலேயே விளக்கத்தைத் தீர்மானித்துவிடும்.
- issue: ἔχομεν என்பதன் காலப் பொருள்
  choice: நிகழ்காலமான ‘நமக்கு உண்டு’ என்பதைப் பயன்படுத்துதல்
  alternative: ‘நமக்குக் கிடைக்கும்’ அல்லது ‘நமக்கு இருக்கும்’ என்ற எதிர்கால மொழிபெயர்ப்பு
  rationale: சிலர் இதை வருங்கால உயிர்த்தெழுதல் உறுதியாக இருப்பதை நிகழ்காலத்தில் கூறுவதாகப் புரிந்துகொள்கிறார்கள்; வேறு சிலர் ஒரு வகையான தற்போதைய உடைமையாகப் புரிந்துகொள்கிறார்கள். கிரேக்க நிகழ்காலத்தை அப்படியே வைத்திருப்பது அந்த இறையியல் அழுத்தத்தைத் தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், இரண்டாவது வாக்கியம் முதல் வாக்கியத்திலுள்ள ‘கட்டடம்’ என்பதையே ‘வீடு’ என விளக்கும் இணைப்பைத் தக்கவைக்கிறது.
