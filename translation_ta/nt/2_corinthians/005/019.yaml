source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: ta
  text: அதாவது[a], கடவுள் மெசியாவில்[b] உலகத்தைத் தம்மோடு ஒப்புரவாக்கிக்கொண்டிருந்தார்; அவர்களுடைய மீறுதல்களை அவர்கள்மீது கணக்கிடாமல், ஒப்புரவின் செய்தியை[c] எங்களிடம் ஒப்படைத்தார்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் மெசியாவில் உலகத்தைத் தம்மோடு ஒப்புரவாக்கிக்கொண்டிருந்தார்.”
    reason: ὡς ὅτι முந்தைய கூற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் விளக்கத் தொடராகப் புரிந்துகொள்ளப்படலாம்; தமிழில் தொடக்க இணைப்புச் சொல்லை விடுத்தும் வாக்கியம் அமைக்கலாம்.
  - marker: b
    text: அல்லது, “மெசியாவின் மூலம்.” கிரேக்கத்தில் நேரடியாக, “மெசியாவில்.”
    reason: ἐν என்பது இங்கு ஒன்றிப்பு/இருப்பிட அல்லது கருவி சார்ந்த பொருளில் புரிந்துகொள்ளப்படலாம்.
  - marker: c
    text: நேரடியாக, “ஒப்புரவின் வார்த்தையை.”
    reason: λόγος என்பதற்கு ‘வார்த்தை’ என்றும் ‘செய்தி’ என்றும் பொருள் கொள்ளலாம்.
  - marker: d
    text: நேரடியாக, “எங்களுக்குள் வைத்தார்”; அல்லது, “எங்கள் நடுவில் வைத்தார்.”
    reason: θέμενος ἐν ἡμῖν என்ற கிரேக்கச் சொற்றொடரின் நேரடி வடிவத்தையும் அதன் இடவியல்/கூட்டுப்பொருள் சாத்தியத்தையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ὡς ὅτι
  choice: அதாவது
  rationale: முந்தைய கூற்றின் உள்ளடக்கத்தை விளக்கும் கிரேக்கத் தொடரின் விளக்கவுரைப் பங்கை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: கடவுள் மெசியாவில் இருந்து
  rationale: ἦν மற்றும் ἐν ஆகியவற்றின் நேரடியான பொருளைத் தக்கவைத்து, கடவுள் மெசியாவில் செயல்பட்டார் என்ற இறையியல் செறிவை கருவிப்பொருளாக மட்டும் சுருக்காமல் விடுகிறது.
- source_word: Χριστῷ
  choice: மெசியாவில்
  rationale: Χριστός இங்கு பெயரைவிட பட்டமாகச் செயல்படுவதால், அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்படுகிறது.
- source_word: κόσμον
  choice: உலகத்தை
  rationale: சூழலில் மனித உலகை உள்ளடக்கும் பரந்த, இயல்பான தமிழ் இணைச்சொல்.
- source_word: καταλλάσσων / καταλλαγῆς
  choice: ஒப்புரவாக்கிக்கொண்டிருந்தார் / ஒப்புரவு
  rationale: வினை மற்றும் பெயர்ச்சொல்லுக்கிடையிலான சொற்பொருள் தொடர்பைத் தக்கவைக்கிறது; பகைமை அல்லது பிரிவுக்குப் பின் உறவைச் சீர்செய்வதைத் தெளிவாகக் குறிக்கிறது.
- source_word: μὴ λογιζόμενος
  choice: கணக்கிடாமல்
  rationale: கணக்குப் பதிவின் உருவகத்தை நவீன தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: παραπτώματα
  choice: மீறுதல்கள்
  rationale: தவறான செயல்கள் மற்றும் வரம்புமீறல்களைச் சுட்டும் παράπτωμα என்பதன் குறிப்பான நுண்ணிய பொருளைத் தருகிறது.
- source_word: θέμενος ἐν ἡμῖν
  choice: எங்களிடம் ஒப்படைத்தார்
  rationale: தமிழில் செய்தி அல்லது பொறுப்பு ஒருவரிடம் வைக்கப்படுவதை இயல்பாகச் சொல்லும் மரபுத்தொடர்; ἐν ἡμῖν என்பதன் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: ஒப்புரவின் செய்தி
  rationale: λόγος இங்கு அறிவிக்கப்படும் உள்ளடக்கத்தைக் குறிப்பதால் ‘செய்தி’ இயல்பானது; ‘வார்த்தை’ என்ற நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: θεὸς ἦν ἐν Χριστῷ என்பதன் தொடர்பு
  choice: கடவுள் மெசியாவில் இருந்து
  alternative: மெசியாவின் மூலம் கடவுள் உலகத்தைத் தம்மோடு ஒப்புரவாக்கிக்கொண்டிருந்தார்
  rationale: ἐν என்பதை கருவிப்பொருளாக மட்டும் தீர்மானிக்காமல், கடவுள் ‘மெசியாவில் இருந்தார்’ என்ற மூலத்தின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அபிஷேகம் செய்யப்பட்ட அரசர்/மீட்பர் என்ற பட்டப்பொருளை வெளிப்படுத்துகிறது; குறிப்பிட்ட பிரிவின் விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: ἐν ἡμῖν என்பதன் பொருள்
  choice: எங்களிடம் ஒப்படைத்தார்
  alternative: எங்களுக்குள் வைத்தார் / எங்கள் நடுவில் வைத்தார்
  rationale: தமிழில் இயல்பான ஊழியப் பொறுப்பு சார்ந்த பொருளை முதன்மை உரையில் தருகிறது; ‘எங்களுக்குள்’ அல்லது ‘எங்கள் நடுவில்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒப்புரவு’, ‘மீறுதல்கள்’, ‘கணக்கிடாமல்’ ஆகியவை மூலத்தின் உறவு மற்றும் கணக்குப் பதிவு உருவகங்களைத் தக்கவைக்கின்றன. முதன்மை வாக்கியம் வாசிக்க எளிதாக அமைக்கப்பட்டாலும், ἐν Χριστῷ மற்றும் ἐν ἡμῖν ஆகியவற்றின் உண்மையான தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
