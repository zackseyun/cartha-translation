  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: ta
  text: ஆகவே, வீட்டில் இருந்தாலும் வெளியே இருந்தாலும்,[a] அவருக்குப் பிரியமானவர்களாய் இருப்பதையே நாங்களும் எங்கள் இலட்சியமாகக் கொள்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சூழலின்படி இன்னும் வெளிப்படையாக: “உடலில் இருக்கும்போதும் அல்லது உடலைவிட்டு பிரிந்திருக்கும்போதும்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட உடலில் வாழ்தல், ஆண்டவரோடு வாழ்தல் ஆகியவற்றிலிருந்து வரும் முடிவை இயல்பாகக் குறிக்கிறது.
- source_word: καὶ
  choice: குறிக்கோளாகக் கொள்கிறோம் என்ற தொடரில் இயல்பாக உட்பொதிந்த தொடர்ச்சி
  rationale: கிரேக்கத்தில் இது முந்தைய சிந்தனையுடன் இணைப்பை வலுப்படுத்துகிறது. தமிழில் தனியாக ‘மேலும்’ சேர்ப்பது இங்கு சற்றுச் செயற்கையாக இருப்பதால், வாக்கிய ஓட்டத்தில் அதன் இணைப்புப் பொருள் வெளிப்படுகிறது.
- source_word: φιλοτιμούμεθα
  choice: நமது குறிக்கோளாகக் கொள்கிறோம்
  rationale: ஆர்வத்துடன் ஒன்றைத் தமது நோக்கமாகக் கொண்டு நாடுதல் என்ற பொருளை நவீன, dignified தமிழில் தெரிவிக்கிறது.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: வீட்டில் இருந்தாலும் வெளியே இருந்தாலும்
  rationale: ‘சொந்த இடத்தில் இருத்தல் / சொந்த இடத்திலிருந்து வெளியே இருத்தல்’ என்ற உருவகமான இணையைப் பாதுகாக்கிறது; கிரேக்க மூலத்தில் விடப்பட்டுள்ள ‘உடலில்’ என்ற நிரப்பியை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: εὐάρεστοι
  choice: உகந்தவர்களாய்
  rationale: அவருக்கு ஏற்றவர்களாகவும் மகிழ்ச்சியளிப்பவர்களாகவும் இருப்பதைச் சுருக்கமாகத் தெரிவிக்கிறது; வெறும் செயலை அல்ல, மனிதர்களின் நிலையைச் சுட்டும் பெயரடை வடிவத்தையும் காக்கிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: மூலத்தின் பிரதிப்பெயரை நேரடியாகப் பாதுகாக்கிறது; சூழலில் அது ஆண்டவரைக் குறிக்கிறது.
- source_word: εἶναι
  choice: இருக்க வேண்டும்
  rationale: ‘உகந்தவர்களாய் இருத்தல்’ என்பதே அவர்களின் ஆவலான குறிக்கோள் என்பதை இயல்பான தமிழில் நிறைவு செய்கிறது.
theological_decisions:
- issue: ‘வீட்டில்’ / ‘வெளியே’ என்பவற்றின் விடுபட்ட நிரப்பியை வெளிப்படையாகச் சேர்க்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘வீட்டில் இருந்தாலும் வெளியே இருந்தாலும்’ என்று சுருக்கமாகவே வைத்தல்
  alternative: ‘உடலாகிய வீட்டில் இருந்தாலும் உடலைவிட்டு வெளியே இருந்தாலும்’
  rationale: 5:6–8 சூழல் உடலில் குடியிருப்பதையும் உடலைவிட்டு ஆண்டவரோடு இருப்பதையும் தெளிவாகச் சுட்டுகிறது. எனினும் இவ்வசனத்தின் கிரேக்க உரை அந்த நிரப்பிகளைச் சொல்லாமல் விடுவதால், அதன் சுருக்கத்தையும் உண்மையான உட்குறிப்பையும் முதன்மை உரையில் பாதுகாத்து, விளக்கத்தை அடிக்குறிப்பில் தருவது சிறந்தது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘வீட்டில் / வெளியே’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டு, அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
