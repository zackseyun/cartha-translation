- from: இவை அனைத்தும் கடவுளிடமிருந்தே வருகின்றன[a]. அவர் மெசியாவின் வழியாக நம்மைத் தம்மோடு ஒப்புரவாக்கி, ஒப்புரவாக்கும் பணியை நமக்குக் கொடுத்தார்[b].
  to: இவை அனைத்தும் கடவுளிடமிருந்தே வந்தவை[a]. அவர் மெசியா[b] வழியாக நம்மைத் தம்மோடு ஒப்புரவாக்கி, ஒப்புரவுப் பணியை நமக்குக் கொடுத்தார்[c].
  rationale: மூலத்தின் தோற்றப் பொருளைத் தெளிவாக்க “வருகின்றன” என்பதற்குப் பதில் “வந்தவை” இடப்பட்டுள்ளது. καταλλαγῆς என்பதன் திறந்த பெயர்ச்சொல் உறவைப் பாதுகாக்க “ஒப்புரவாக்கும் பணி” “ஒப்புரவுப் பணி” என மாற்றப்பட்டுள்ளது. மேலும், ஆங்கில audit trail-இல் பாதுகாக்கப்பட்ட இரண்டு விளக்கக் குறிப்புகளையும் உரிய தனித்த அடிக்குறிப்பு நங்கூரங்களுடன் சேர்த்துள்ளோம்.
