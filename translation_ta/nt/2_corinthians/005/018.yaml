reference: 2 Corinthians 5:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: ta
  text: இவை அனைத்தும் கடவுளிடமிருந்தே வந்தவை[a]. அவர் மெசியா[b] வழியாக நம்மைத் தம்மோடு ஒப்புரவாக்கி, ஒப்புரவுப் பணியை நமக்குக் கொடுத்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அனைத்தும்” என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் இந்தப் புதிய நிலைமையின் எல்லாவற்றையும் விரிவாகக் குறிக்கலாம்; அல்லது சூழலில் சற்றுமுன் கூறப்பட்டவற்றைச் சிறப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “கிறிஸ்து”; Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் “மெசியா” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: c
    text: “நம்மை,” “நமக்கு” என்பவை விசுவாசிகளை விரிவாகக் குறிக்கலாம். எனினும் சுற்றியுள்ள பகுதியில் பவுலுக்கும் அவருடைய உடன்பணியாளர்களுக்கும் ஒப்படைக்கப்பட்ட அப்போஸ்தலப் பணி குறிப்பாக வலியுறுத்தப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: இவை அனைத்தும்
  rationale: τὰ πάντα என்பதை முந்தைய சூழலில் கூறப்பட்ட புதிய படைப்பும் மாற்றமடைந்த வாழ்வும் உள்ளிட்ட உண்மைகளைச் சுட்டுவதாக இயல்பாக மொழிபெயர்க்கிறது; δέ இங்குள்ள மென்மையான தொடர்ச்சியைத் தமிழ் வாக்கிய ஓட்டமே வெளிப்படுத்துவதால் தனிச்சொல் சேர்க்கப்படவில்லை.
- source_word: ἐκ τοῦ θεοῦ
  choice: கடவுளிடமிருந்தே வருகின்றன
  rationale: ἐκ குறிக்கும் மூலத்தையும் தோற்றத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘-ஏ’ கடவுளே மூலம் என்ற வலியுறுத்தலைக் காக்கிறது.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: அவர் ... நம்மைத் தம்மோடு ஒப்புரவாக்கி
  rationale: கடவுளைச் சார்ந்த இறந்தகாலப் பங்கேற்பு வினையைத் தமிழில் இயல்பான தொடர்வினையாக அளிக்கிறது; செயலைத் தொடங்குபவர் கடவுள் என்பதையும் தம்முடனான உறவு சீராக்கப்படுவதையும் காக்கிறது.
- source_word: διὰ Χριστοῦ
  choice: மெசியாவின் வழியாக
  rationale: διά + பிறப்புவேற்றுமை வழிமுறை அல்லது இடைமுகச் செயற்பாட்டைக் குறிக்கிறது. Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: δόντος ἡμῖν
  choice: நமக்குக் கொடுத்தார்
  rationale: முதல் பங்கேற்பு வினையுடன் இணைந்த இரண்டாவது இறந்தகாலப் பங்கேற்பு வினையைத் தெளிவான தமிழ் முற்றுவினையாக அளிக்கிறது.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: ஒப்புரவாக்கும் பணி
  rationale: διακονία இங்கு ஒப்படைக்கப்பட்ட சேவை அல்லது பொறுப்பைக் குறிக்கிறது. ‘பணி’ சாதாரண வாசகருக்குத் தெளிவாகவும் அப்போஸ்தலப் பொறுப்பின் நுணுக்கத்தை இழக்காமலும் உள்ளது; தகைமை/உள்ளடக்க உறவுடைய genitive-ஐ இயல்பான வினையெச்சத் தொடரால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இயேசுவின் ஒப்புரவாக்கும் இடைமுகப் பொறுப்பைக் குறிக்கும் பட்டப்பெயர்ச் செயல்பாடு தெளிவாக இருப்பதால் பொருளை மொழிபெயர்த்த ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: ἡμᾶς / ἡμῖν என்பவற்றின் வரம்பு
  choice: நம்மை / நமக்கு
  alternative: எல்லா விசுவாசிகளையும் / அப்போஸ்தலர்களை மட்டும் எனத் தெளிவுபடுத்துதல்
  rationale: சுற்றியுள்ள பகுதியில் பவுலும் அவருடைய உடன்பணியாளர்களும் பெற்ற ஒப்படைப்பு முன்னிலைப்படுத்தப்பட்டாலும், கிரேக்கப் பிரதிப்பெயர்கள் விசுவாசிகளை விரிவாக உள்ளடக்கவும் இடமளிக்கின்றன. முதன்மை உரை அந்தத் தெளிவின்மையைத் தீர்மானிக்காமல் காக்கிறது.
- issue: καταλλαγή என்பதன் கருத்து
  choice: ஒப்புரவு / ஒப்புரவாக்குதல்
  alternative: சமாதானம் செய்தல்
  rationale: இது வெறும் மோதல் நிறுத்தத்தைக் காட்டிலும் உறவு மீளமைக்கப்படுவதைச் சுட்டுகிறது; மேலும் கடவுள் செயற்படும் கர்த்தர் என்ற வாக்கியத்தின் வலியுறுத்தலைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘ஒப்புரவாக்குதல்’ உறவை மீளச் சீராக்கும் கருத்தைத் துல்லியமாகத் தாங்குகிறது. நீண்ட கிரேக்கப் பங்கேற்பு அமைப்பு தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; மூலத்தின் காரண-செயல் தொடர்பு காக்கப்பட்டுள்ளது.
