revisions:
- from: அவர் எல்லாருக்காகவும்[a] இறந்தார். இனி வாழ்கிறவர்கள் தங்களுக்காக வாழாமல், தங்களுக்காக இறந்து உயிருடன் எழுப்பப்பட்டவருக்காக வாழவே அவர் இறந்தார்.[b]
  to: அவர் எல்லாருக்காகவும்[a] இறந்தார்; வாழ்பவர்கள் இனிமேல் தங்களுக்காக வாழாமல், அவர்களுக்காக இறந்து எழுப்பப்பட்டவருக்காக[b] வாழும்படியாகவே அவர் இறந்தார்.
  rationale: 'The revision preserves the Greek sequence and purpose clause: he died for all, so that those who live would no longer live for themselves but for the one who died and was raised for them. It replaces an unnatural, expanded resurrection phrase with the direct passive ‘எழுப்பப்பட்டவர்,’ clarifies the pronoun reference, and moves the footnote anchor to the expression it documents. No theological scope is narrowed or otherwise interpreted.'
