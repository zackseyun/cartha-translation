  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட ஒரே வாக்கியம் தமிழின் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், இரண்டாவது வாக்கியத்தின் முடிவில் ‘அவர் இறந்தார்’ என்பதை மீண்டும் கூறி ἵνα குறிக்கும் நோக்கத் தொடர்பு காக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
