base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: ta
  text: அவர் எல்லாருக்காகவும்[a] இறந்தார்; வாழ்பவர்கள் இனிமேல் தங்களுக்காக வாழாமல், அவர்களுக்காக இறந்து எழுப்பப்பட்டவருக்காக[b] வாழும்படியாகவே அவர் இறந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எல்லாரின் சார்பாகவும்’ என்றும் மொழிபெயர்க்கலாம். இவ்வசனத்தில் இருமுறை வரும் ὑπέρ, ஒருவருக்கான பயன் அல்லது அவர் சார்பான செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘எழுப்பப்பட்டவர்’ என்பது செயலேற்ற (passive) வடிவில் உள்ளது; ‘உயிர்த்தெழுந்தவர்’ என்றும் தமிழில் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: எல்லாருக்காகவும்
  rationale: ὑπέρ + genitive என்பது பயன் அல்லது பிரதிநிதித்துவத்தைச் சுட்டுகிறது. ‘எல்லாருக்காகவும்’ என்பது இயல்பான தமிழில் அந்தப் பொருளைத் தக்கவைக்கிறது; குறிப்பிட்ட பாவநிவாரணக் கோட்பாட்டைச் சேர்ப்பதில்லை.
- source_word: ἀπέθανεν
  choice: அவர் இறந்தார்
  rationale: Aorist indicative கடந்தகாலத்தில் நிகழ்ந்த சம்பவத்தை நேரடியாகக் கூறுகிறது; சூழலிலிருந்து கிறிஸ்துவைக் குறிக்கும் எழுவாய் தமிழில் வெளிப்படையாகத் தரப்படுகிறது.
- source_word: ἵνα
  choice: வாழவே
  rationale: ἵνα குறிக்கும் நோக்கத்தை இயல்பான தமிழில் வலியுறுத்தும் நோக்கவினை அமைப்பாக ‘வாழவே’ வெளிப்படுத்துகிறது.
- source_word: οἱ ζῶντες
  choice: வாழ்கிறவர்கள்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பெயரெச்சத்தை ‘வாழ்கிறவர்கள்’ எனத் தருவது, ‘உயிரோடிருப்பவர்கள்’ என்ற வெறும் உடல்சார் பொருளுக்குள் அதைச் சுருக்காமல் வாசிக்க உதவுகிறது.
- source_word: μηκέτι
  choice: இனி ... வாழாமல்
  rationale: முந்தைய வாழ்க்கை நோக்கம் தொடராமல் நிறுத்தப்படுவதை ‘இனி ... வாழாமல்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἑαυτοῖς ζῶσιν
  choice: தங்களுக்காக வாழாமல்
  rationale: Reflexive dative இங்கு வாழ்க்கையின் நோக்கம் அல்லது சார்பைச் சுட்டுகிறது. ‘தங்களுக்காக’ என்பது தன்னையே மையமாகக் கொண்ட வாழ்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: இறந்து உயிருடன் எழுப்பப்பட்டவருக்காக
  rationale: மறைந்திருக்கும் ‘வாழ’ என்ற வினையோடு இணையும் dative எதிர்மறை ஒப்புமையைத் தொடர்கிறது. ஒரே நபரைச் சுட்டும் இரண்டு பெயரெச்சங்களையும் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: ἐγερθέντι
  choice: உயிருடன் எழுப்பப்பட்டவருக்கு
  rationale: கிரேக்கத்தின் passive வடிவத்தை ‘எழுப்பப்பட்ட’ எனத் தக்கவைக்கிறது. ‘உயிருடன்’ என்பது தமிழில் மரணத்திலிருந்து எழுப்பப்படுதலைத் தெளிவுபடுத்துகிறது; ‘தாமே உயிர்த்தெழுந்தார்’ என voice-ஐ மாற்றவில்லை.
- source_word: ὑπὲρ αὐτῶν
  choice: தங்களுக்காக
  rationale: முன்னர் வந்த ὑπέρ என்பதன் பயன்/பிரதிநிதித்துவப் பொருளைத் தொடர்ந்து தக்கவைக்கிறது. αὐτῶν என்பது ‘வாழ்கிறவர்கள்’ என்போரையே மீண்டும் சுட்டுவதால் தமிழின் இயல்புக்கேற்ப ‘தங்களுக்காக’ எனத் தரப்படுகிறது.
theological_decisions:
- issue: πάντων / αὐτῶν என்பவற்றின் வரம்பும் தொடர்பும்
  choice: πάντων என்பதை ‘எல்லாரும்’ எனக் குறுக்காமல் மொழிபெயர்த்து, αὐτῶν என்பதை வாழ்கிறவர்களை மீண்டும் சுட்டும் ‘தங்களுக்காக’ என வழங்குதல்
  alternative: ‘எல்லா மனிதர்களும்’ என்று வெளிப்படையாக விரிவுபடுத்துதல் அல்லது ‘விசுவாசிகள் எல்லாரும்’ என்று வரம்பிடுதல்
  rationale: வசனத்தின் பரந்த மொழியை அப்படியே வைத்திருந்து, பாவநிவாரணத்தின் வரம்பைப் பற்றிய பிற்கால இறையியல் விவாதத்தை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- issue: ἐγερθέντι என்பதின் passive voice
  choice: ‘உயிருடன் எழுப்பப்பட்டவர்’
  alternative: ‘உயிர்த்தெழுந்தவர்’
  rationale: Passive வடிவத்தைத் தக்கவைத்து, உயிர்த்தெழுதலில் இறைவனின் செயலை இலக்கண ரீதியாக மறைக்காமல் வழங்குகிறது; மாற்று வடிவத்தின் உண்மைத்தன்மையை மறுப்பதில்லை.
- issue: ἵνα என்பதின் நோக்கம்/விளைவு நுணுக்கம்
  choice: ‘வாழவே அவர் இறந்தார்’ என நோக்கத்தை முன்னிறுத்துதல்
  alternative: ‘அதனால் அவர்கள் ... வாழ்கிறார்கள்’ என வெறும் விளைவாக வழங்குதல்
  rationale: ἵνα-வின் முதன்மையான நோக்கத் தன்மையைப் பாதுகாக்கிறது; நோக்கத்தின் நிறைவேற்றம் பற்றிய கூடுதல் இறையியல் முடிவைச் சேர்ப்பதில்லை.
