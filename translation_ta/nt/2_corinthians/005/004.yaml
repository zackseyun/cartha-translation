reference: 2 Corinthians 5:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: ta
  text: ஏனெனில், இந்தக் கூடாரத்தில் இருக்கும் நாம் சுமையால் அழுத்தப்பட்டுக் குமுறுகிறோம்; காரணம், ஆடையைக் களைந்துகொள்ள நாம் விரும்பவில்லை. மாறாக, ஆடையின்மேல் ஆடை அணிந்துகொள்ளவே[a] விரும்புகிறோம்—மரணத்துக்குட்பட்டது[b] வாழ்வால் விழுங்கப்படும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேலாக ஆடை அணிந்துகொள்ள.’ கிரேக்க வினை, ஏற்கெனவே அணிந்திருக்கும் ஆடையின்மேல் இன்னோர் ஆடையை அணிவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மரணத்துக்கு உட்பட்ட அனைத்தும்’ அல்லது ‘மரணத்தன்மை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது. வசனத்தின் முழு வாக்கிய அமைப்பே வலியுறுத்தலைத் தாங்குவதால் தனியாக ‘உண்மையாகவே’ என்று சேர்க்கப்படவில்லை.
- source_word: σκήνει
  choice: கூடாரத்தில்
  rationale: தற்போதைய உடல்சார் வாழ்வைக் குறிக்கும் பவுலின் உருவகத்தைச் சுருக்காமல் காக்கிறது; சுற்றியுள்ள வசனங்களுடனான தொடர்பையும் நிலைநிறுத்துகிறது.
- source_word: στενάζομεν
  choice: குமுறுகிறோம்
  rationale: வெறும் பெருமூச்சைவிட, சுமையையும் வருங்கால மாற்றத்திற்கான ஆழ்ந்த ஏக்கத்தையும் வலுவாக உணர்த்துகிறது.
- source_word: βαρούμενοι
  choice: சுமையால் அழுத்தப்பட்டு
  rationale: வினையெச்சத்தின் செயல்படுபொருள் நிலையைப் பாதுகாத்து, குமுறலுடன் சேர்ந்துள்ள காரணநிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐφ’ ᾧ
  choice: காரணம்
  rationale: பின்வரும் விருப்பத்தை குமுறலுக்கான காரணமாக அறிமுகப்படுத்தும் சாத்தியமான பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: ἐκδύσασθαι
  choice: ஆடையைக் களைந்துகொள்ள
  rationale: கிரேக்க மூலத்தின் ஆடை உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே காக்கிறது.
- source_word: ἐπενδύσασθαι
  choice: ஆடையின்மேல் ஆடை அணிந்துகொள்ள
  rationale: ஏற்கெனவே அணிந்திருப்பதன்மேல் இன்னோர் ஆடையை அணியும் கூட்டுவினையின் தனிப்பட்ட நுணுக்கத்தைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καταποθῇ
  choice: விழுங்கப்படும்படி
  rationale: முழுமையாக மேற்கொள்ளப்பட்டு ஒழிக்கப்படுதல் என்ற உயிரோட்டமான உருவகத்தையும் ἵνα கூறும் நோக்கத்தையும் காக்கிறது.
- source_word: τὸ θνητόν
  choice: சாவுக்குரியது
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இடைநிலைப் பெயரடையை, வெறும் கருத்தாக்கமான ‘மரணத்தன்மை’ என்று சுருக்காமல் பரந்த குறிப்புடன் தருகிறது.
- source_word: ζωῆς
  choice: வாழ்வால்
  rationale: மரணத்துக்குரியதுடன் உள்ள நேரடி எதிர்மறை ஒப்புமையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ஆடை உருவகமும் இடைநிலை நிலையும்
  choice: ‘ஆடையைக் களைந்துகொள்ளுதல்’, ‘ஆடையின்மேல் ஆடை அணிந்துகொள்ளுதல்’ என்ற உருவகங்களையே தக்கவைத்து, அவை குறிக்கும் நிலையைத் தனிக் கோட்பாடாக விளக்கவில்லை.
  alternative: ‘ஆடையைக் களைந்துகொள்ளுதல்’ என்பதை உடலற்ற நிலை என்றும், ‘ஆடையின்மேல் ஆடை அணிந்துகொள்ளுதல்’ என்பதை உயிர்த்தெழுந்த உடல் மட்டுமே என்றும் வெளிப்படையாக விளக்குதல்.
  rationale: கிரேக்க வசனம் உருவக மொழியில் தற்போதைய மரணத்துக்குரிய வாழ்வையும் எதிர்கால மாற்றத்தையும் இணைக்கிறது. விவாதத்திற்குரிய இடைநிலை நிலையை மொழிபெயர்ப்பு தானாகத் தீர்மானிக்காமல் அதன் இறையியல் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கூடாரம்’, ‘ஆடையைக் களைதல்’, ‘ஆடையின்மேல் ஆடை அணிதல்’, ‘விழுங்கப்படுதல்’ ஆகிய பவுலின் தொடர்ச்சியான உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன; கோட்பாட்டு விளக்கங்கள் முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
