id: 2CO.5.14
reference: 2 Corinthians 5:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: ta
  text: ஒருவர் அனைவரின் சார்பாக இறந்தார்; ஆகவே அனைவரும் இறந்தார்கள் என்று நாங்கள் முடிவுசெய்ததால், மேசியாவின் அன்பு எங்களை ஆட்கொள்கிறது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேசியா நம்மீது வைத்திருக்கும் அன்பு’ அல்லது ‘மேசியாவிடம் நாம் கொண்டிருக்கும் அன்பு’; கிரேக்க உடைமை வேற்றுமையை இரு விதமாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான இயல்பான, நவீனத் தமிழ்ச் சொல்; பழமையான அல்லது தேவையற்ற சிறப்புப் பொருளைச் சேர்க்காது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு பட்டமாக இருப்பதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்படுகிறது. உடைமை வேற்றுமை வடிவம் கிரேக்கத் தொகைநிலையின் சுருக்கத்தை முதன்மை உரையில் இயன்றவரை காக்கிறது; அதன் இரு சாத்தியமான தொடர்புகளும் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: συνέχει
  choice: ஆட்கொள்கிறது
  rationale: வலுவாகக் கட்டுப்படுத்தி இயக்கும் அல்லது உந்தும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் உணர்ச்சித் தூண்டுதலாகவும் வெளிப்புற வற்புறுத்தலாகவும் மிகைப்படுத்தாது.
- source_word: κρίναντας
  choice: நாங்கள் முடிவுக்கு வந்திருக்கிறோம்
  rationale: ஆராய்ந்து தீர்மானித்தல் என்ற சூழல்சார் பொருளைத் தருகிறது. முடிவின் தற்போதைய விளைவைத் தமிழில் இயல்பாகக் காட்ட நிறைவு வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: அவர்கள் வந்த முடிவின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ்க் குறியீடு.
- source_word: εἷς
  choice: ஒருவர்
  rationale: கிரேக்கம் கூறும் ‘ஒருவர்’ என்ற சுருக்கமான சொல்லாட்சியைப் பாதுகாக்கிறது; பெயரை விளக்கமாகச் சேர்ப்பதில்லை.
- source_word: ὑπὲρ πάντων
  choice: அனைவரின் சார்பாக
  rationale: ὑπέρ என்பதிலுள்ள பிரதிநிதித்துவ அல்லது நலன் சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது; ‘அனைவருக்குப் பதிலாக’ என்று குறிப்பிட்ட பரிகாரக் கோட்பாட்டைத் திணிப்பதில்லை.
- source_word: ἄρα
  choice: ஆகவே
  rationale: முன்னுள்ள கூற்றிலிருந்து பவுல் எடுத்துரைக்கும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: οἱ πάντες
  choice: அனைவரும்
  rationale: கூடுதல் விளக்கமின்றி கிரேக்கத்தின் பொதுமையான சொல்லாட்சியை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀπέθανον
  choice: இறந்தார்கள்
  rationale: இறந்த நிகழ்வை நேரடியான இறந்தகாலத்தில் தருகிறது; மேசியாவின் மரணத்தில் பங்குபெறுதல் குறித்த விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ Χριστοῦ என்பதில் தொகைநிலையின் தொடர்பு
  choice: முதன்மை உரையில் ‘மேசியாவின் அன்பு’ என்று சுருக்கமாக வைக்கப்பட்டுள்ளது.
  alternative: ‘மேசியா நம்மீது வைத்திருக்கும் அன்பு’ அல்லது ‘மேசியாவிடம் நாம் கொண்டிருக்கும் அன்பு’
  rationale: கிரேக்கத் தொகைநிலை எழுவாய்சார் அல்லது செயப்படுபொருள்சார் பொருளை ஏற்கக்கூடும். சூழல் ஒன்றை முற்றிலும் கட்டாயப்படுத்தாததால், முதன்மை உரை சுருக்கத்தைப் பாதுகாத்து மாற்றுப் புரிதல்களை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: ‘அனைவரும் இறந்தார்கள்’ என்பதன் பொருள்
  choice: விளக்க விரிவாக்கமின்றி ‘அனைவரும் இறந்தார்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: அனைவரும் மேசியாவில் பிரதிநிதித்துவமாக இறந்தார்கள்; அல்லது விசுவாசிகள் அனைவரும் அவரோடு இறந்தார்கள்
  rationale: இவ்வசனம் பவுலின் தர்க்கத்தைச் சுருக்கமாகவே கூறுகிறது. ‘அனைவரும்’ என்பதன் எல்லையையோ பங்கேற்பின் முறையையோ மொழிபெயர்ப்பு தனியாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆட்கொள்கிறது’ என்பது συνέχει-யின் வலுவான இயக்கும் பொருளை வாசிக்க எளிதான முறையில் தருகிறது. காரணத்தை அறிமுகப்படுத்தும் γάρ ‘ஏனெனில்’ என்றும், κρίναντας கூறும் சிந்தித்து வந்த முடிவு தனி வாக்கியமாகவும் அமைக்கப்பட்டுள்ளது.
