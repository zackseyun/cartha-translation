revisions:
- from: ஏனெனில், மேசியாவின் அன்பு எங்களை ஆட்கொள்கிறது[a]. ஒருவர் அனைவரின் சார்பாக இறந்தார்; ஆகவே அனைவரும் இறந்தார்கள் என்று நாங்கள் முடிவுக்கு வந்திருக்கிறோம்.
  to: ஒருவர் அனைவரின் சார்பாக இறந்தார்; ஆகவே அனைவரும் இறந்தார்கள் என்று நாங்கள் முடிவுசெய்ததால், மேசியாவின் அன்பு எங்களை ஆட்கொள்கிறது[a].
  rationale: The revision retains the source's ambiguity concerning the genitive in ‘மேசியாவின் அன்பு’ and does not interpret ‘அனைவரும்.’ It restructures the Tamil sentence so that the believers' conclusion—that one died on behalf of all and therefore all died—is explicitly the reason for the Messiah's love constraining them, as indicated by the Greek participle κρίναντας. The footnote is retained with clearer modern Tamil grammatical terminology.
