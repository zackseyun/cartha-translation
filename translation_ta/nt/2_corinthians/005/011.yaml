id: 2CO.5.11
reference: 2 Corinthians 5:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: ta
  text: எனவே, ஆண்டவருக்குப் பயப்படுதலை அறிந்தவர்களாய்[a], மக்களை இணங்கவைக்கிறோம். கடவுளுக்கோ நாங்கள் அறியப்பட்டிருக்கிறோம்[b]; உங்கள் மனச்சாட்சிகளிலும் நாங்கள் அறியப்பட்டிருக்கிறோம் என்றும் நம்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆண்டவருக்குப் பயப்படுதல்’ என்பது ஆண்டவருக்கு முன்பான பயபக்தியையும் ஆழ்ந்த அச்சவுணர்வையும் குறிக்கலாம்; முந்தைய வசனத்தின் நியாயாசனச் சூழல் இதற்கு வலு சேர்க்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அறியப்பட்டிருக்கிறோம்’ என்பதை ‘வெளிப்பட்டிருக்கிறோம்’ அல்லது ‘வெளிப்படுத்தப்பட்டிருக்கிறோம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες
  choice: அறிந்தவர்களாய்
  rationale: οἶδα என்பதன் நிறைவுற்ற பங்கேற்புவினை இங்கு நிகழ்காலப் பொருளில் வருகிறது. முதன்மை வினையோடு உள்ள பங்கேற்புத் தொடர்பைத் தக்கவைக்க இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கிறிஸ்துவின் நியாயாசனத்திலிருந்து வரும் முடிவுறு தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: φόβον τοῦ κυρίου
  choice: ஆண்டவருக்குப் பயப்படுவது என்ன என்பதை
  rationale: ‘பயம்’ என்ற வலிமையை ‘பக்தி’ என்று மட்டும் மென்மைப்படுத்தாமல் தக்கவைக்கிறது; அதேவேளையில், இந்தச் சொற்றொடரை இயல்பான நவீன தமிழில் கூறுகிறது.
- source_word: ἀνθρώπους πείθομεν
  choice: மக்களை இணங்கவைக்கிறோம்
  rationale: ἀνθρώπους என்பது பொதுவாக மனிதர்களைக் குறிக்கிறது. πείθομεν என்பதன் செயற்பாட்டு வலிமையை ‘முயல்கிறோம்’ என்று குறைக்காமல், சம்மதிக்கச் செய்தல் அல்லது இணங்கச் செய்தல் என்ற பொருளில் மொழிபெயர்க்கிறது.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: கடவுளுக்கோ நாங்கள் வெளிப்பட்டிருக்கிறோம்
  rationale: நிறைவுற்ற செயலின் தற்போதைய விளைவைத் தக்கவைத்து, பவுலும் அவரது உடன் ஊழியர்களும் கடவுளுக்கு முழுமையாக வெளிப்படையாக இருப்பதைக் காட்டுகிறது.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: உங்கள் மனச்சாட்சிகளிலும்
  rationale: கிரேக்க மூலத்தின் பன்மையையும், கொரிந்தியர் ஒவ்வொருவரின் உள்ளார்ந்த ஒழுக்க உணர்வையும் தக்கவைக்கிறது.
- source_word: ἐλπίζω
  choice: நம்புகிறேன்
  rationale: இங்கு பவுலின் தனிப்பட்ட எதிர்பார்ப்பை இயல்பான தமிழில் தெரிவிக்கிறது; உறுதியான கூற்றாக மாற்றவில்லை.
- source_word: πεφανερῶσθαι
  choice: வெளிப்பட்டிருக்கிறோம்
  rationale: நிறைவுற்ற செயப்பாட்டு infinitive-இன் விளைவுநிலையைத் தமிழில் இயல்பாகத் தொடர்கிறது.
theological_decisions:
- issue: ‘ஆண்டவருக்குப் பயப்படுதல்’ என்பதன் சூழல்சார் பொருள்
  choice: ‘பயம்’ என்ற சொல்லைத் தக்கவைத்தல்
  alternative: ‘ஆண்டவரிடம் பயபக்தி கொள்வது’ அல்லது ‘ஆண்டவரை reverence செய்வது’ என்ற மென்மையான பொருள்
  rationale: முந்தைய வசனத்தின் நியாயாசனச் சூழல் அச்சம், பயபக்தி, பொறுப்புணர்வு ஆகியவற்றை உள்ளடக்கிய வலிமையான சொல்லாட்சியை ஆதரிக்கிறது. ‘பக்தி’ என்று மட்டும் மொழிபெயர்ப்பது அதன் வலிமையைக் குறைக்கலாம்.
- issue: φανερόω கடவுளிடமும் கொரிந்தியரின் மனச்சாட்சிகளிலும் கொண்டுள்ள வலிமை
  choice: ‘வெளிப்பட்டிருக்கிறோம்’
  alternative: ‘அறியப்பட்டிருக்கிறோம்’ அல்லது ‘வெளிப்படுத்தப்பட்டிருக்கிறோம்’
  rationale: பவுலின் உண்மையான தன்மையும் ஊழியமும் மறைவின்றி திறந்தவையாக இருப்பதைச் சொல்கிறது; அதற்கு மேலான எந்தக் கோட்பாட்டு விளக்கத்தையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனச்சாட்சிகள்’ என்ற பன்மை மூலத்தின் துல்லியத்திற்காகத் தக்கவைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் நீண்ட அமைப்பு தமிழின் வாசிப்புத் தெளிவுக்காக இரண்டு முதன்மைப் பகுதிகளாகப் பிரிக்கப்பட்டாலும், தர்க்க மற்றும் எதிர்மறைத் தொடர்புகள் பாதுகாக்கப்பட்டுள்ளன.
