source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: ta
  text: ஆகவே[a], ஒருவர் மேசியாவுக்குள் இருந்தால், புதிய படைப்பு உண்டு; பழையவை கடந்துபோயின; இதோ[b], புதியவை வந்துள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் ஒரு புதிய படைப்பு.” கிரேக்கத்தில் இத்தொடர் வினைச்சொல் இல்லாமல் சுருக்கமாக, “ஒருவர் மேசியாவுக்குள் இருந்தால்—புதிய படைப்பு” என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: பல மொழிபெயர்ப்புகள், “எல்லாம் புதிதாயின” என்று வாசிக்கின்றன. ஆனால் இங்குள்ள SBLGNT உரையில் “எல்லாம்” என்பதற்கான தனிச் சொல் இல்லை; “புதியவை வந்துள்ளன” என்றே உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: εἴ τις
  choice: ஒருவர் ... இருந்தால்
  rationale: பாலின வரையறையற்ற பொதுவான நிபந்தனையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவுக்குள்
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளையும், பவுலின் ஒன்றிப்பைக் குறிக்கும் ‘ἐν’ மொழிநடையையும் காக்கிறது.
- source_word: καινὴ κτίσις
  choice: புதிய படைப்பு உண்டு
  rationale: வினைச்சொல் இல்லாத கிரேக்கத் தொடரைத் தேவையின்றி தனிநபருக்கு மட்டும் கட்டுப்படுத்தாமல், அதன் சுருக்கத்தையும் பரந்த பொருள் வாய்ப்பையும் காக்கிறது.
- source_word: τὰ ἀρχαῖα
  choice: பழையவை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலைப் பன்மையைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: παρῆλθεν
  choice: கடந்துபோயின
  rationale: பழையவற்றின் முடிவை இயல்பான தமிழில் தெரிவித்து, அடுத்துள்ள புதுமையுடன் உள்ள முரண்பாட்டைக் காக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: விளைவின் மீது கவனத்தை ஈர்க்கும் கிரேக்க இடைச்சொல்லின் நேரடியான, கண்ணியமான தமிழ் இணை.
- source_word: γέγονεν καινά
  choice: புதியவை வந்துள்ளன
  rationale: καινά என்பதன் பன்மையையும், நிகழ்ந்த மாற்றத்தின் தற்போதைய விளைவைக் காட்டும் perfect வினையின் நுணுக்கத்தையும் வெளிப்படுத்துகிறது; மூல உரையில் இல்லாத ‘எல்லாம்’ என்பதைக் கூட்டவில்லை.
theological_decisions:
- issue: Χριστῷ என்பதைப் பட்டப்பெயராக மொழிபெயர்ப்பதா அல்லது பெயர்போல் ஒலிபெயர்ப்பதா
  choice: மேசியாவுக்குள்
  alternative: கிறிஸ்துவுக்குள்
  rationale: இங்கு மேசியா என்ற பட்டப்பெயரின் பொருள் உயிரோடு உள்ளது; அதேவேளை ‘-க்குள்’ என்பது பவுலின் ஒன்றிப்பு மொழியைப் பாதுகாக்கிறது.
- issue: καινὴ κτίσις என்ற வினையற்ற தொடரை எவ்வாறு நிறைவு செய்வது
  choice: புதிய படைப்பு உண்டு
  alternative: அவர் ஒரு புதிய படைப்பு
  rationale: கிரேக்கம் ‘ஒருவர் மேசியாவுக்குள் இருந்தால்—புதிய படைப்பு’ என்று சுருக்கமாக உள்ளது. முதன்மை உரை இதைத் தனிநபருக்கு மட்டும் வரையறுக்காமல் வைக்கிறது; தனிநபரைப் பற்றிய சாத்தியமான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமும் இறையியல் சார்ந்த இருபொருள் வாய்ப்பும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளன.
