  text: ⸂εἴ γε⸃ καὶ ⸀ἐνδυσάμενοι οὐ γυμνοὶ εὑρεθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/003.yaml
  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: ta
  text: உண்மையிலேயே[a], அணிந்துகொண்ட பின்பு நாம் ஆடையற்றவர்களாகக் காணப்படமாட்டோம் என்றால்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையிலேயே, அணிந்துகொண்டவர்களாக நாம் நிர்வாணமாகக் காணப்படமாட்டோம் என்றால்.”
    reason: சொற்பொருள் மற்றும் இலக்கண மாற்றுவாசிப்பு
lexical_decisions:
- source_word: εἴ γε
  choice: உண்மையிலேயே … என்றால்
  rationale: εἰ என்பதன் நிபந்தனைப் பொருளை வாக்கிய இறுதியிலுள்ள ‘என்றால்’ என்பதும், γε தரும் வலியுறுத்தலை ‘உண்மையிலேயே’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: καὶ
  choice: பின்
  rationale: இங்கு καί, ἐνδυσάμενοι என்ற பங்கேற்புவினையுடன் தொடர்புகொண்டு அதன் செயலை முதன்மை வினைக்கு முந்தியதாகக் காட்டுகிறது; தமிழில் ‘பின்’ என்பது அந்தத் தொடர்பை இயல்பாகத் தருகிறது.
- source_word: ἐνδυσάμενοι
  choice: அதை அணிந்துகொண்ட பின்
  rationale: இறந்தகால இடைநிலைப் பங்கேற்புவினையின் அடிப்படை உருவகமான ‘அணிந்துகொள்ளுதல்’ காக்கப்படுகிறது. சூழலில் குறிக்கப்படும் வாசஸ்தலத்தைத் தமிழில் இயல்பாக இணைக்க ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: οὐ
  choice: மாட்டோம்
  rationale: எதிர்கால வினையின் மறுப்பைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: γυμνοὶ
  choice: நிர்வாணமாக
  rationale: γυμνός என்பதன் நேரடிப் பொருளையும் பவுலின் ஆடை உருவகத்தையும் காக்கிறது; ‘ஆடையற்றவர்களாய்’ என்பது அடிக்குறிப்பில் மாற்றாகத் தரப்படுகிறது.
- source_word: εὑρεθησόμεθα
  choice: காணப்படமாட்டோம்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தை நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ஆடை அணிதல் மற்றும் நிர்வாணம் என்ற உருவகத்தின் பொருள்
  choice: உருவகத்தை விளக்கித் தீர்மானிக்காமல் அப்படியே வைத்தல்
  alternative: ‘நிர்வாணம்’ என்பது உடலற்ற இடைநிலையையோ, பரலோக உடல் இல்லாமையையோ, கடவுள்முன் வெட்கம் அல்லது வெளிப்படுத்தப்படுதலையையோ குறிப்பதாகத் தெளிவுபடுத்துதல்
  rationale: இந்த வசனம் உருவகத்தின் முழுத் தெய்வீகப் பொருளைத் தெளிவாக வரையறுக்கவில்லை. எனவே குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்தாமல் மூலத்தின் தெளிவின்மையும் இறையியல் இழுவிசையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்துடன் தொடரும் நிபந்தனைத் துணைவாக்கிய அமைப்பு காக்கப்பட்டுள்ளது; ‘அணிதல்/நிர்வாணம்’ உருவகம் விளக்கமின்றி நிலைநிறுத்தப்பட்டுள்ளது.
