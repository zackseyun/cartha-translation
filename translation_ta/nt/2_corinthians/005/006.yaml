  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: ta
  text: ஆகவே, நாம் எப்போதும் மனத்துணிவுடன் இருக்கிறோம்; உடலில் வீட்டில் இருப்பதுபோல் இருக்கும்போது, ஆண்டவரிடமிருந்து தொலைவில் இருக்கிறோம்[a] என்பதையும் அறிந்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரிடமிருந்து பிரிந்து இருக்கிறோம்.” கிரேக்க வினைச்சொல் ἐκδημοῦμεν, “வீட்டில் இருப்பதுபோல் இருக்கும்போது” என்பதற்கு எதிரான உருவகமாகும்; இதை “தொலைவில் இருக்கிறோம்” அல்லது “பிரிந்து இருக்கிறோம்” என மொழிபெயர்க்கலாம்.
