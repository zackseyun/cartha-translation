revisions:
- from: ஆகவே, நாம் எப்போதும் மனத்துணிவுடன் இருக்கிறோம்; உடலில் குடியிருக்கும் காலத்தில் ஆண்டவரைவிட்டுத் தொலைவில் இருக்கிறோம்[a] என்பதையும் அறிந்திருக்கிறோம்.
  to: ஆகவே, நாம் எப்போதும் மனத்துணிவுடன் இருக்கிறோம்; உடலில் வீட்டில் இருப்பதுபோல் இருக்கும்போது, ஆண்டவரிடமிருந்து தொலைவில் இருக்கிறோம்[a] என்பதையும் அறிந்திருக்கிறோம்.
  rationale: திருத்தம் ἐνδημέω/ἐκδημέω ஆகியவற்றின் ‘வீட்டில் இருத்தல்/வெளியே அல்லது தொலைவில் இருத்தல்’ என்ற உருவக எதிர்மறையைத் தெளிவாகக் காக்கிறது. இது உடலில் உள்ள வாழ்வு ஆண்டவரின் முழுமையான உடனிருப்பிலிருந்து முற்றிலுமாகத் துண்டிப்பு எனப் பொருள்படுமாறு கூடுதலாக விளக்கவில்லை.
