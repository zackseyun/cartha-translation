lexical_decisions:
- source_word: Θαρροῦντες
  choice: மனத்துணிவுடன் இருக்கிறோம்
  rationale: நிகழ்காலப் பங்கேற்புவினை தொடர்ந்து நிலவும் துணிவைக் குறிக்கிறது. தமிழில் இயல்பாக வாசிக்க முற்றுவினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்துகளிலிருந்து வரும் முடிவை அல்லது தொடரும் தர்க்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ச்சியாக, எல்லாக் காலங்களிலும் என்ற நேரடியான பொருளைத் தருகிறது.
- source_word: εἰδότες
  choice: அறிந்திருக்கிறோம்
  rationale: οἶδα என்பதன் நிறைவுப் பங்கேற்புவினை இங்கு நிகழ்காலப் பொருளுடன் நிலையான அறிவைச் சுட்டுகிறது; ‘அறிந்திருக்கிறோம்’ அந்த நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐνδημοῦντες
  choice: குடியிருக்கும் காலத்தில்
  rationale: ஒருவரது சொந்த இடத்தில் அல்லது வீட்டில் வாழ்வதைக் குறிக்கும் உருவகத்தை ‘குடியிருக்கும்’ என்பது ஓரளவு காத்து, தமிழில் இயல்பான காலத் தொடர்பையும் தருகிறது.
- source_word: ἐν τῷ σώματι
  choice: உடலில்
  rationale: உடலோடு கூடிய தற்போதைய வாழ்வைக் குறிக்கும் இடப்பொருள் சொற்றொடரை விளக்கச் சேர்க்கைகள் இன்றி நேரடியாக வழங்குகிறது.
- source_word: ἐκδημοῦμεν
  choice: தொலைவில் இருக்கிறோம்
  rationale: ἐνδημοῦντες என்பதற்கு எதிரான, தன் இல்லத்திலிருந்து வெளியே அல்லது அப்பால் இருப்பதைக் குறிக்கும் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἀπὸ τοῦ κυρίου
  choice: ஆண்டவரைவிட்டு
  rationale: ἀπό குறிக்கும் பிரிவை அல்லது இடைவெளியைச் சுருக்கமாகத் தருகிறது; κύριος வழக்கப்படி ‘ஆண்டவர்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: உடலில் வாழ்வதற்கும் ஆண்டவரோடு இருப்பதற்கும் இடையிலான உருவக எதிர்மறை
  choice: தற்போது உடலில் குடியிருப்பதை ஆண்டவரைவிட்டுத் தொலைவில் இருப்பதாகப் பவுல் கூறும் பதற்றம் அப்படியே காக்கப்படுகிறது.
  alternative: உடலில் வாழும் விசுவாசிகள் கிறிஸ்துவின் பிரசன்னத்திலிருந்து முற்றிலும் துண்டிக்கப்பட்டுள்ளனர் என்று வலுப்படுத்துவது; அல்லது அடுத்த வசனத்தின் ‘உடலைவிட்டு... ஆண்டவரோடு’ என்ற கருத்தை இவ்வசனத்திற்குள் கொண்டுவருவது.
  rationale: இவ்வசனம் உடலோடு கூடிய தற்போதைய வாழ்வையும் ஆண்டவரோடு இன்னும் அடையப்படாத முழுமையான உடனிருப்பையும் எதிரெதிராக வைக்கிறது. அந்தப் பிரிவின் தன்மையை மொழிபெயர்ப்பு கூடுதலாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருக்கும்’—‘தொலைவில் இருக்கிறோம்’ என்ற சொற்கள் கிரேக்கத்தின் வீடு/வெளியிடம் உருவக எதிர்மறையை தமிழில் இயன்ற அளவு இயல்பாகக் காக்கின்றன.
