id: 2CO.5.7
reference: 2 Corinthians 5:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ πίστεως γὰρ περιπατοῦμεν, οὐ διὰ εἴδους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/007.yaml
  text: For we walk by faith[a], not by sight—
translation:
  language: ta
  text: ஏனெனில், நாம் விசுவாசத்தினாலே நடக்கிறோம்; பார்வையினால்[a] அல்ல—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோற்றத்தினால் அல்ல” அல்லது “காணப்படுவதைக் கொண்டு அல்ல.” கிரேக்கச் சொல் காணக்கூடிய வடிவம் அல்லது தோற்றத்தைக் குறிக்கலாம்; விசுவாசத்துடனான எதிர்மறை ஒப்புமையைத் தக்கவைக்க “பார்வை” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: விசுவாசத்தினாலே
  rationale: διά + பிறப்புவேற்றுமை இங்கு வழிமுறை அல்லது வாழும் முறையைக் குறிக்கிறது. πίστις என்பதற்கு இச்சூழலில் ‘விசுவாசம்’ என்பது இயல்பானதும் பவுலின் சுருக்கமான எதிர்மறை ஒப்புமையைத் தக்கவைத்துக்கொள்வதும் ஆகும்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: γάρ முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதன் இணைப்புச் சக்தியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: περιπατοῦμεν
  choice: நாம் ... நடக்கிறோம்
  rationale: περιπατέω என்பதன் நடை உருவகத்தை ‘நடக்கிறோம்’ தக்கவைக்கிறது; இங்கு அது ஒருவர் தமது வாழ்க்கையை நடத்தும் முறையைக் குறிக்கிறது.
- source_word: οὐ διὰ εἴδους
  choice: பார்வையினால் அல்ல
  rationale: εἶδος காணப்படும் வடிவம், தோற்றம் அல்லது காண்பதைக் குறிக்கக்கூடும். விசுவாசத்துடனான எதிர்மறை ஒப்புமையில் ‘பார்வை’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது; பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: பவுலின் இச்சூழலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை / உண்மைத்தன்மை
  rationale: இவ்வசனத்தில் πίστις என்பது கிறிஸ்துவின் உண்மைத்தன்மையைச் சார்ந்த இலக்கண விவாதத்தின் பகுதியாக இல்லை. εἶδος உடனான எதிர்மறை ஒப்புமை, இப்போது காணப்படாததன்மீது சார்ந்திருக்கும் ‘விசுவாசம்’ என்ற பொருளையே ஆதரிக்கிறது; ‘உண்மைத்தன்மை’ இங்கு குறைவாகப் பொருந்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சுருக்கமானதும் கண்ணியமானதும் ஆன நடை. மூலத்தின் ‘நடத்தல்’ உருவகமும் வசன முடிவிலுள்ள தொடர்ச்சிக் கோடும் பாதுகாக்கப்பட்டுள்ளன.
