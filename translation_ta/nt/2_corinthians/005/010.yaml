id: 2CO.5.10
reference: 2 Corinthians 5:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: ta
  text: ஏனெனில், நாம் அனைவரும் மேசியாவின்[b] நீதித்தீர்ப்பு இருக்கையின் முன் வெளிப்படுத்தப்பட வேண்டும்[a]; ஒவ்வொருவரும் உடலின் மூலம் தாம் செய்ததற்கு ஏற்ப[c]—நல்லதாயினும் கெட்டதாயினும்—தமக்குரியதைப் பெறுவதற்காகவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முன்பாகத் தோன்ற வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் வெறுமனே தோன்றுவதையும், ஒருவருடைய நிலை வெளிப்படையாக வெளிக்கொணரப்படுவதையும் குறிக்கக்கூடும்; முதன்மை உரை இரண்டாவது, வலிமையான பொருளைக் காக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘கிறிஸ்து’; Χριστός இங்கு ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டமாக இருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: c
    text: ‘உடலில் வாழ்ந்தபோது செய்ததற்கு ஏற்ப’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் உடலைக் கருவியாகக் கொண்டு செய்த செயல்களையோ, உடலோடு வாழும் காலத்தில் செய்த செயல்களையோ சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: வெளிப்படுத்தப்பட வேண்டும்
  rationale: சாதாரணமாக முன்னிலையில் தோன்றுவதை மட்டும் அல்லாமல், ஒருவருடைய உண்மை நிலை வெளிப்படையாக அறியப்படுவதையும் செயலற்ற வினைவடிவம் உணர்த்துகிறது. நீதித்தீர்ப்புச் சூழலிலுள்ள அந்த வலிமையை இச்சொல் காக்கிறது.
- source_word: βήματος
  choice: நீதியிருக்கை
  rationale: βῆμα என்பது இங்கு தீர்ப்பு வழங்கும் நீதித்துறை இருக்கையையோ மேடையையோ குறிக்கிறது. ‘நீதியிருக்கை’ சட்டரீதியான மதிப்பீட்டுச் சூழலைச் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு தனிப்பெயராக அல்லாமல் பட்டமாகச் செயல்படுகிறது; ஆகவே அதன் பொருளான ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: κομίσηται
  choice: தமக்குரியதைப் பெறுவார்கள்
  rationale: ஒருவர் செய்தவற்றுக்கு ஒத்த பலனைத் திரும்பப் பெறும் ஈடுசெய்யும் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; பலன் வெகுமதி மட்டுமே என்று முன்கூட்டியே வரையறுக்கவில்லை.
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: உடலின் மூலம் தாம் செய்தவற்றுக்கு ஏற்ப
  rationale: διά + genitive தரும் கருவிப்பொருளை ‘உடலின் மூலம்’ எனக் காத்து, πρός தரும் ஒத்திசைவு அல்லது அளவுப்பொருளை ‘ஏற்ப’ என வெளிப்படுத்துகிறது. ‘தாம்’ என்பது ஒவ்வொருவரின் தனிப்பட்ட பொறுப்பைத் தெளிவாக்குகிறது.
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: ஒவ்வொரு நபருக்கும் தனித்தனியான பொறுப்பு உண்டு என்ற பகிர்ந்தளிக்கும் ஒருமை வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀγαθὸν ... φαῦλον
  choice: நல்லதானாலும் கெட்டதானாலும்
  rationale: பரந்த அறநெறி எதிர்மறையை நேரடியாகப் பாதுகாக்கிறது. φαῦλον என்பதை எப்போதும் ‘தீமை’ என மிகைப்படுத்தாமல் ‘கெட்டது’ என வழங்குகிறது.
theological_decisions:
- issue: மேசியாவின் நீதியிருக்கைக்கு முன்பான மதிப்பீட்டின் இயல்பும் வரம்பும்
  choice: அனைவரும் வெளிப்படுத்தப்படுவதையும் ஒவ்வொருவரும் தாம் செய்தவற்றுக்கு ஏற்ப பெறுவதையும் அப்படியே காத்து, இது நீதித்தீர்ப்பு என்பதை மட்டும் உரை தெரிவிக்கிறது.
  alternative: இது விசுவாசிகளின் வெகுமதிகளை மட்டும் குறிக்கும் மதிப்பீடு என்று வரையறுத்தல்; அல்லது எல்லா மனிதர்களின் இறுதி நியாயத்தீர்ப்பு என்று வெளிப்படையாக வரையறுத்தல்.
  rationale: வசனம் உலகளாவிய பொறுப்பையும் தனிநபர் சார்ந்த ஈடுசெய்தலையும் தெளிவாகக் கூறுகிறது; ஆனால் இந்த ஒரே வசனம் தீர்ப்பின் மக்கள் வரம்பையோ இறுதி விளைவுகளையோ முறையாகத் தீர்மானிக்கவில்லை. ஆகவே இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீதியிருக்கை’ நீதித்துறைச் சூழலைக் காக்கிறது; ‘வெளிப்படுத்தப்பட’ என்பது மூலத்தின் செயலற்ற வடிவத்தையும் ஒழுக்கநிலை வெளிக்கொணரப்படுவதையும் பாதுகாக்கிறது. ஒருமையில் உள்ள கிரேக்கப் பொதுப்படையான ‘அவன்’ என்பதற்குப் பதிலாக பாலினப் பாகுபாடற்ற ‘தாம்’ பயன்படுத்தப்பட்டுள்ளது.
