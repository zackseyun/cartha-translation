revisions:
- from: ஏனெனில், நாம் அனைவரும் மேசியாவின்[b] நீதியிருக்கைக்கு முன்பாக வெளிப்படுத்தப்பட வேண்டும்[a]. அப்போது ஒவ்வொருவரும் உடலின் மூலம் தாம் செய்தவற்றுக்கு ஏற்ப[c]—அது நல்லதானாலும் கெட்டதானாலும்—தமக்குரியதைப் பெறுவார்கள்.
  to: ஏனெனில், நாம் அனைவரும் மேசியாவின்[b] நீதித்தீர்ப்பு இருக்கையின் முன் வெளிப்படுத்தப்பட வேண்டும்[a]; ஒவ்வொருவரும் உடலின் மூலம் தாம் செய்ததற்கு ஏற்ப[c]—நல்லதாயினும் கெட்டதாயினும்—தமக்குரியதைப் பெறுவதற்காகவே.
  rationale: முற்றுப்புள்ளியை அரைப்புள்ளியாக மாற்றி, ‘பெறுவதற்காகவே’ என வழங்குவதன் மூலம் ἵνα-வின் நோக்க உறவு காக்கப்பட்டுள்ளது. நன்மை அல்லது தீமை என்பது செய்ததன் தன்மையைக் குறிக்கிறது என்பதை இயல்பான இடைச்செருகல் மூலம் தெளிவுபடுத்தியுள்ளோம். ‘நீதித்தீர்ப்பு இருக்கை’ βῆμα-வின் சட்டரீதியான மதிப்பீட்டுச் சூழலை நவீன தரத் தமிழில் தெளிவாக வழங்குகிறது. அடிக்குறிப்பு c-யும் முக்கிய உரையின் ஒருமை ‘செய்ததற்கு’ உடன் ஒத்திசைக்கச் சிறிது சீரமைக்கப்பட்டுள்ளது.
