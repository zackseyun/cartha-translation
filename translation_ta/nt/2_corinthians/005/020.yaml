- from: 'ஆகவே, மேசியாவின்[a] சார்பில் நாம் தூதர்களாகச் செயல்படுகிறோம்; கடவுள் எங்கள் வழியாக வேண்டுகோள் விடுப்பதுபோல் இருக்கிறது. மேசியாவின் சார்பில் உங்களைக் கெஞ்சிக் கேட்கிறோம்: கடவுளுடன் ஒப்புரவாக்கப்படுங்கள்.[b]'
  to: 'ஆகவே, கடவுள் எங்கள் வழியாக வேண்டிக்கொள்வதுபோல, மேசியாவின்[a] சார்பில் நாம் தூதர்களாக இருக்கிறோம். மேசியாவின் சார்பில் உங்களிடம் கெஞ்சிக் கேட்கிறோம்: கடவுளோடு ஒப்புரவுபெறுங்கள்.[b]'
  rationale: வாக்கிய அமைப்பு ὡς-உடன் வரும் கடவுளின் வேண்டுகோளைத் தூதர் பணியின் விளக்கமாகத் தெளிவுபடுத்துகிறது. “ஒப்புரவுபெறுங்கள்” என்பது கட்டளையின் அவசரத்தையும், ஒப்புரவு மனிதர் தாமே உண்டாக்கும் ஒன்றாகச் சொல்லப்படாத செயலேற்பு நுணுக்கத்தையும், நவீன தமிழின் இயல்பையும் ஒருங்கே காக்கிறது. அடிக்குறிப்பு குறியீடுகள் இரண்டும் உரையில் துல்லியமாக நங்கூரமிடப்பட்டுள்ளன.
