id: 2CO.5.20
reference: 2 Corinthians 5:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: ta
  text: 'ஆகவே, கடவுள் எங்கள் வழியாக வேண்டிக்கொள்வதுபோல, மேசியாவின்[a] சார்பில் நாம் தூதர்களாக இருக்கிறோம். மேசியாவின் சார்பில் உங்களிடம் கெஞ்சிக் கேட்கிறோம்: கடவுளோடு ஒப்புரவுபெறுங்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்துவின்.’ கிரேக்கத்தில் Χριστός என்பது ‘மேசியா’ என்ற பட்டம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘கடவுளிடம் ஒப்புரவுபெறுங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: மேசியாவின் சார்பில்
  rationale: ὑπέρ + பிறப்புவேற்றுமை இங்கு பிரதிநிதித்துவத்தைச் சுட்டுவதால், இயல்பான தமிழில் ‘சார்பில்’ என்று மொழிபெயர்க்கப்பட்டது. Χριστός ஒரு பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என வழங்கப்பட்டு, மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய ஒப்புரவு பற்றிய வாதத்திலிருந்து வரும் முடிவைத் தெளிவாகச் சுட்டுகிறது.
- source_word: πρεσβεύομεν
  choice: நாம் தூதர்களாகச் செயல்படுகிறோம்
  rationale: πρεσβεύω என்பது தூதராக அல்லது பிரதிநிதியாகச் செயல்படுவதைக் குறிக்கிறது; நிகழ்காலத்தின் தொடர்ச்சியையும் இச்சொற்றொடர் இயல்பாகக் காட்டுகிறது.
- source_word: ὡς
  choice: …போல்
  rationale: கடவுளே அவர்கள் வழியாக வேண்டுகோள் விடுப்பது போன்ற முறையைச் சுட்டும் ஒப்புமைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: παρακαλοῦντος
  choice: வேண்டுகோள் விடுப்பது
  rationale: ஒப்புரவுக்கான சூழலில் παρακαλέω என்பதன் ஊக்கமான, அழைப்புத் தொனியை இது இயல்பான தமிழில் தருகிறது.
- source_word: δι’ ἡμῶν
  choice: எங்கள் வழியாக
  rationale: διά + பிறப்புவேற்றுமை கருவி அல்லது முகவர் வழியைக் குறிக்கிறது; கடவுள் அப்போஸ்தல ஊழியத்தின் வழியாகச் செயல்படுவதைத் தெளிவாக்குகிறது.
- source_word: δεόμεθα
  choice: உங்களைக் கெஞ்சிக் கேட்கிறோம்
  rationale: δέομαι சொல்லிலுள்ள ஆழ்ந்த வேண்டுதலையும் அவசரத்தையும் பொதுவாகப் புரியும் தற்போதைய தமிழில் வெளிப்படுத்துகிறது.
- source_word: καταλλάγητε
  choice: ஒப்புரவாக்கப்படுங்கள்
  rationale: இறந்தகால நோக்குடைய கட்டளை வடிவத்தின் வலிமையையும் கிரேக்கச் செயலப்பாட்டு வடிவத்தையும் பாதுகாத்து, மனிதரே ஒப்புரவை உண்டாக்குகிறார் என்று மாற்றாமல் விடுகிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுடன்
  rationale: καταλλάσσω என்பதுடன் வரும் கொடைவேற்றுமை உறவுசார் ஒப்புரவைச் சுட்டுகிறது; தமிழில் ‘கடவுளுடன்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘கடவுளிடம்’ என்ற திசைநோக்குச் சாயல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அது வெறும் பெயர்போல் அல்லாமல் பட்டமாகச் செயல்படுகிறது. தமிழில் அறியப்பட்ட பட்டச் சொல்லான ‘மேசியா’ முதன்மை உரையில் வைக்கப்பட்டு, திருச்சபை மரபில் பரவலான ‘கிறிஸ்து’ மாற்றாகக் குறிப்பிடப்படுகிறது.
- issue: ஒப்புரவில் குரலும் செயலாற்றும் முகவரும்
  choice: கடவுளுடன் ஒப்புரவாக்கப்படுங்கள்
  alternative: கடவுளிடம் ஒப்புரவாக்கப்படுங்கள்
  rationale: கடவுள் தூதர்கள் வழியாக வேண்டுகிறார்; அதேவேளை கேட்போருக்கு ஒரு கட்டளை வழங்கப்படுகிறது. செயலப்பாட்டு வடிவத்தை வைத்திருப்பது தெய்வீகச் செயலுக்கும் மனிதப் பதிலுக்கும் இடையிலான பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தூதர்களாகச் செயல்படுகிறோம்’ என்பது அரசியல் தூதரக உருவகத்தைத் தெளிவாக வைத்திருக்கிறது. ‘ஒப்புரவாக்கப்படுங்கள்’ அன்றாடப் பேச்சில் சற்றே உயர்நடையாக இருந்தாலும், மூலத்தின் செயலப்பாட்டு வடிவத்தையும் இறையியல் பதற்றத்தையும் காக்கத் தேர்ந்தெடுக்கப்பட்டது.
