  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: ta
  text: இந்தக் காரியத்திற்காகவே நம்மை ஆயத்தப்படுத்தியவர் கடவுள்; அவர் நமக்கு ஆவியின் முன்பணத்தை[a][b] அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முன்பணம்’ என்பதற்கு ‘உத்தரவாதம்,’ ‘வைப்புத்தொகை,’ அல்லது ‘முதல் தவணை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இச்சொற்றொடர் ஆவியே முன்பணம் என்று பொருள்படலாம்; அல்லது ஆவி நிறைவேற்றப்போகிறவற்றை உறுதிசெய்யும் ஒரு முன்பணத்தைக் கடவுள் கொடுத்தார் என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: ஆயத்தப்படுத்தியவர்
  rationale: வரவிருக்கும் உடல்சார்ந்த வாழ்வுக்காகக் கடவுள் விசுவாசிகளை நோக்கத்துடன் உருவாக்கி ஆயத்தப்படுத்துகிறார் என்ற சூழல்சார்ந்த பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: εἰς αὐτὸ τοῦτο
  choice: இந்த ஒன்றுக்காகவே
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட குறிப்பிட்ட எதிர்கால நிலையைச் சுட்டும் வலியுறுத்தலைக் காக்கிறது.
- source_word: θεός
  choice: கடவுள்
  rationale: கிரேக்கத்தில் ஆயத்தப்படுத்தியவர் கடவுளே என்று தெளிவாக அடையாளப்படுத்தப்படுகிறது.
- source_word: δοὺς
  choice: அவரே ... கொடுத்தார்
  rationale: இறந்தகால வினையெச்சத்தைத் தமிழில் இயல்பான தொடர்புடைய வாக்கியமாக மாற்றுகிறது; ‘அவரே’ என்பது ஒரே செய்பவரான கடவுளைத் தெளிவுபடுத்துகிறது.
- source_word: ἀρραβῶνα
  choice: முன்பணம்
  rationale: மீதியெல்லாம் பின்னர் வழங்கப்படும் என்பதற்கு உத்தரவாதமாக இப்போது தரப்படும் முதல் பகுதி என்ற வணிக உருவகத்தையும் எதிர்கால நிறைவேற்றத்தையும் தக்கவைக்கிறது.
- source_word: τοῦ πνεύματος
  choice: ஆவியின்
  rationale: கிரேக்க இனவேற்றுமை அமைப்பைத் தக்கவைத்து, ஆவியே முன்பணமா அல்லது ஆவியுடன் தொடர்புடைய முன்பணமா என்பதை முதன்மை உரையில் கட்டாயமாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல் இல்லாமல்
  rationale: இங்கு δέ மென்மையான உரை நகர்வைக் குறிக்கிறது; தமிழில் முன்னிலைச் சூழலோடு இயல்பாக இணைவதால் ‘இப்போது’ அல்லது ‘ஆனால்’ என்று வெளிப்படையாகச் சேர்ப்பது தேவையில்லை.
theological_decisions:
- issue: ‘ஆவியின் முன்பணம்’ என்பதன் பொருள்
  choice: கிரேக்கத்தின் இனவேற்றுமைத் தொடரை ‘ஆவியின் முன்பணம்’ என்று வைத்திருந்து, பரிசுத்த ஆவியே எதிர்கால நிறைவேற்றத்தின் தற்போதைய முதல் பங்கும் உத்தரவாதமும் என்ற வாசிப்புக்கு இடமளித்தல்
  alternative: ஆவி நிறைவேற்றப்போகிறவற்றுக்கு உத்தரவாதமாகக் கடவுள் வேறொரு முன்பணத்தைக் கொடுத்தார் என்று புரிந்துகொள்ளுதல்
  rationale: பவுலின் ஒத்த பயன்பாடுகள் ஆவியே கொடுக்கப்பட்ட முன்பணம் என்பதை வலுவாகச் சுட்டினாலும், கிரேக்க இலக்கணத் தொடர்பை முதன்மை உரையில் மிகையாகத் தீர்மானிக்காமல் அதன் உண்மையான பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘ஆயத்தப்படுத்தியவர்’ நோக்கமுள்ள தெய்வீகச் செயலைத் தெரிவிக்கிறது; ‘முன்பணம்’ மூலத்தின் தெளிவான வணிக உருவகத்தைப் பாதுகாக்கிறது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் ‘முன்பணம்’ தொடருக்குப் பின் வைக்கப்பட்டுள்ளன.
