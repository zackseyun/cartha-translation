source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: ta
  text: நாங்கள் மீண்டும் எங்களை உங்களிடம் பரிந்துரைத்துக்கொள்ளவில்லை; மாறாக, எங்களைப்பற்றி நீங்கள் பெருமை கொள்ளுவதற்கான ஒரு வாய்ப்பை உங்களுக்குக் கொடுக்கிறோம்[a]. அதனால், வெளித்தோற்றத்தை முன்னிட்டு பெருமை கொள்கிறவர்களுக்கும் உள்ளத்தில் பெருமை கொள்ளாதவர்களுக்கும் பதிலளிக்க உங்களிடம் ஏதாவது இருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களைப்பற்றி நீங்கள் பெருமை கொள்ளுவதற்கான ஓர் அடிப்படையை உங்களுக்குக் கொடுக்கிறோம்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “முகத்தில் பெருமை கொள்கிறவர்கள்; உள்ளத்தில் அல்ல.” அதாவது, உள்ளார்ந்த உண்மையைவிட வெளிப்புறத் தோற்றத்தை முன்னிட்டு பெருமை கொள்கிறவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: நற்சான்று பெற்றவர்களாகக் காட்டிக்கொள்ளவில்லை
  rationale: இச்சூழலில் தம்மையே பரிந்துரைத்தல் அல்லது தமது தகுதியை நிலைநாட்டுதல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘அறிமுகப்படுத்துதல்’ என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: ἀφορμὴν
  choice: ஒரு வாய்ப்பை
  rationale: தொடக்கப்புள்ளி, சந்தர்ப்பம், அடிப்படை ஆகிய பொருட்களில், கொரிந்தியர்கள் பேசுவதற்குப் பவுல் ஏற்படுத்தித் தரும் சந்தர்ப்பத்தை இங்கு இயல்பாகக் குறிக்கிறது.
- source_word: καυχήματος
  choice: பெருமைபாராட்டுவதற்கு
  rationale: καυχάομαι என்ற தொடர்புடைய வினையுடன் சொல் இணைப்பைப் பேணுகிறது; இங்கு தன்னடக்கமற்ற தற்பெருமை மட்டுமல்லாமல் ஒருவரைக் குறித்து பெருமையுடன் பேசுவதையும் குறிக்க முடியும்.
- source_word: ὑπὲρ ἡμῶν
  choice: எங்களைக் குறித்து
  rationale: பவுலையும் அவரது உடன் ஊழியர்களையும் குறித்து சாதகமாகப் பேசுதல் என்ற உடனடிப் பொருளைத் தெளிவாகத் தருகிறது; ‘எங்கள் சார்பாக’ என்பதும் சாத்தியமான நிழற்பொருள்.
- source_word: ἵνα ἔχητε πρὸς
  choice: பதில் சொல்ல உங்களுக்கு ஏதாவது இருக்கும்
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத ‘பதில்’ என்பதைக் குறைந்த அளவில் விளக்கி, எதிர்வாதிகளிடம் சொல்ல வேண்டியது உண்டாகும் என்ற கிரேக்க மரபுத்தொடரின் பொருளைப் பேணுகிறது.
- source_word: ἐν προσώπῳ
  choice: வெளித்தோற்றத்தைக் குறித்து
  rationale: சொல்லுக்குச் சொல் ‘முகத்தில்’ என்றாலும், ‘உள்ளத்தில்’ என்பதற்கு எதிராக வெளிப்புறத் தோற்றம் அல்லது வெளிப்படையான அம்சங்களைக் குறிக்கிறது.
- source_word: καυχωμένους
  choice: பெருமைபாராட்டுகிறவர்கள்
  rationale: முந்தைய καύχημα என்பதுடனான சொல்லிணைப்பைப் பேணி, ‘பெருமை பேசுதல்/பாராட்டுதல்’ என்ற பொருளை வழங்குகிறது.
- source_word: καρδίᾳ
  choice: உள்ளத்தில் இருப்பதைக் குறித்து
  rationale: ‘இதயம்’ என்ற நேரடி உருவகத்தின் உள்ளார்ந்த மனிதநிலை அல்லது உண்மை என்ற பொருளை இன்றைய தமிழில் தெளிவாக்குகிறது; அடிக்குறிப்பில் நேரடி வடிவம் தரப்படுகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: செயல் திரும்ப நிகழ்வதாகக் கருதப்படுவதைப் பவுல் மறுக்கும் நுணுக்கத்தை நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: ἐν προσώπῳ ... καὶ μὴ ἐν καρδίᾳ என்ற முரண்பாட்டின் பொருள்
  choice: வெளித்தோற்றத்துக்கும் உள்ளார்ந்த உண்மைக்கும் இடையிலான முரண்பாடு
  alternative: பொது மதிப்புக்கும் மனநேர்மைக்கும் இடையிலான முரண்பாடு; அல்லது நேருக்கு நேர் காணப்படும் நிலையுக்கும் உள்ளார்ந்த மனப்பாங்குக்கும் இடையிலான முரண்பாடு
  rationale: ‘முகம்’ மற்றும் ‘இதயம்’ என்ற மூல உருவகங்கள் வெளிப்புறம்–உள்புறம் என்ற பதற்றத்தை உருவாக்குகின்றன. முதன்மை உரை இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடிக்குறிப்பு மூலத்தின் சொற்படிவத்தைப் பாதுகாக்கிறது.
- issue: ὑπὲρ ἡμῶν என்பதன் உறவு
  choice: எங்களைக் குறித்து பெருமைபாராட்டுதல்
  alternative: எங்கள் சார்பாக அல்லது எங்களை ஆதரித்துப் பெருமைபாராட்டுதல்
  rationale: ὑπέρ இங்கு தலைப்பையும் ஆதரவான பிரதிநிதித்துவத்தையும் குறிக்கலாம். முதன்மை உரை பரந்த ‘எங்களைக் குறித்து’ என்பதைப் பயன்படுத்தி, ஆதரித்துப் பேசும் சாத்தியத்தைக் குறிப்பில் விடுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதைமிக்க மொழி பயன்படுத்தப்பட்டுள்ளது. ‘நற்சான்று பெற்றவர்களாகக் காட்டிக்கொள்ளுதல்’ என்பது சுயப் பரிந்துரையின் சூழலைத் தெளிவாக்குகிறது. ‘பெருமைபாராட்டுதல்’ என்ற ஒரே வேர் சார்ந்த சொல்லாட்சி καύχημα/καυχάομαι இணைப்பைப் பேணுகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
