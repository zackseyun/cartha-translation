revisions:
- from: நாங்கள் மீண்டும் எங்களை உங்களிடம் நற்சான்று பெற்றவர்களாகக் காட்டிக்கொள்ளவில்லை. மாறாக, எங்களைக் குறித்து நீங்கள் பெருமைபாராட்டுவதற்கு ஒரு வாய்ப்பை உங்களுக்குக் கொடுக்கிறோம்[a]. இதனால், உள்ளத்தில் இருப்பதைக் குறித்து அல்லாமல் வெளித்தோற்றத்தைக் குறித்துப் பெருமைபாராட்டுகிறவர்களுக்குப் பதில் சொல்ல உங்களுக்கு ஏதாவது இருக்கும்[b].
  to: நாங்கள் மீண்டும் எங்களை உங்களிடம் பரிந்துரைத்துக்கொள்ளவில்லை; மாறாக, எங்களைப்பற்றி நீங்கள் பெருமை கொள்ளுவதற்கான ஒரு வாய்ப்பை உங்களுக்குக் கொடுக்கிறோம்[a]. அதனால், வெளித்தோற்றத்தை முன்னிட்டு பெருமை கொள்கிறவர்களுக்கும் உள்ளத்தில் பெருமை கொள்ளாதவர்களுக்கும் பதிலளிக்க உங்களிடம் ஏதாவது இருக்கும்[b].
  rationale: The revision corrects the self-commendation verb, retains the purpose of furnishing the Corinthians with a response, and renders the disputed outward/heart contrast without converting it into a contrast between two objects of boasting. The footnotes retain both the lexical alternative for ἀφορμή and the literal “face/heart” imagery.
