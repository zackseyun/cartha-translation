  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: ta
  text: எனவே, நாம் துணிவுடன் இருக்கிறோம்; உடலிலிருந்து வெளியே இருந்து, ஆண்டவரோடு வீட்டில் இருப்பதை அதிகம் விரும்புகிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடலிலிருந்து தொலைவில் இருந்து, ஆண்டவரோடு வீட்டில் இருக்க.”
    reason: ἐκδημέω/ἐνδημέω என்ற இணை வினைகள் ‘வீட்டிலிருந்து வெளியே இருத்தல்/வீட்டில் இருத்தல்’ என்ற உருவகத்தைச் சுமக்கின்றன. ‘தொலைவில்’ என்பது ἐκδημέω-வின் சொற்சார்ந்த மாற்றாகும்.
lexical_decisions:
- source_word: θαρροῦμεν
  choice: நாம் துணிவுடன் இருக்கிறோம்
  rationale: நிகழ்கால வினை நிலையான துணிவையும் நம்பிக்கையையும் குறிக்கிறது. ‘துணிவுடன் இருக்கிறோம்’ என்பது இயல்பான நவீனத் தமிழில் அந்தத் தொடரும் மனநிலையை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆகவே
  rationale: முந்தைய வசனங்களின் கருத்திலிருந்து தொடரும் முடிவை இங்கு δέ குறிக்கிறது; வலுவான எதிர்மறையை அல்ல.
- source_word: καὶ
  choice: ;
  rationale: இரு வினைக்கூற்றுகளின் நெருங்கிய இணைப்பைத் தமிழில் அரைப்புள்ளியால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது; தனியே ‘மேலும்’ சேர்ப்பது தேவையற்றதாகும்.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: அதிகம் விரும்புகிறோம்
  rationale: εὐδοκέω உடன் μᾶλλον சேர்ந்து விருப்பத் தேர்வைக் காட்டுகிறது. ‘அதிகம் விரும்புகிறோம்’ ஒப்பீட்டுணர்வைப் பேணுகிறது.
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: உடலைவிட்டு அயலிடத்தில் இருந்து
  rationale: ἐκδημέω என்பதன் சொந்த இடத்திலிருந்து அகன்று இருப்பது என்ற உருவகத்தையும், ἐκ τοῦ σώματος என்பதன் உடலைவிட்டு என்ற நேரடியான பொருளையும் பேணுகிறது.
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: ஆண்டவரிடம் சொந்த இடத்தில் இருக்க
  rationale: ἐνδημέω என்பதிலுள்ள சொந்த இடத்தில் இருப்பது என்ற உருவகத்தைப் பேணி, πρός உடனான ஆண்டவரின் அருகாமை/உடனிருப்பு எண்ணத்தையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இவ்வசனத்தை இடைநிலை நிலை பற்றிய வெளிப்படையான கோட்பாட்டுக் கூற்றாக விரித்துரைப்பதா
  choice: ‘உடலைவிட்டு’ மற்றும் ‘ஆண்டவரிடம் சொந்த இடத்தில் இருக்க’ என்ற பவுலின் உருவகத்தையே வைத்திருத்தல்
  alternative: ‘இறந்து பரலோகத்தில் ஆண்டவரோடு இருக்க’ என்று விளக்கிச் சொல்வது
  rationale: வசனம் மரணத்திற்குப் பிந்தைய ஆண்டவருடனான இருப்பை வலுவாக உணர்த்தினாலும், கிரேக்கத்தில் இல்லாத ‘இறப்பு’ அல்லது ‘பரலோகம்’ போன்ற சொற்களைச் சேர்க்காமல் அதன் உருவகத்தையும் இறையியல் நெருக்கடியையும் பேண வேண்டும்.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத் தமிழ். ‘ஆண்டவர்’ என்பது κύριος என்பதற்கான வழக்கமான வேதாகமத் தமிழ். மூலத்திலுள்ள அயலிடம்–சொந்த இடம் உருவகம் பிரதான உரையில் தெளிவாகப் பேணப்பட்டுள்ளது; அதிகம் பரிச்சயமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
