  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: ta
  text: ஏனெனில், உண்மையாகவே இதில் நாம் பெருமூச்சுவிடுகிறோம்; பரலோகத்திலிருந்து வரும் நமது உறைவிடத்தை[a] அணிந்துகொள்ள[b] ஏங்குகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நமது பரலோக உறைவிடம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இன்னும் சொற்படியாக ‘பரலோகத்திலிருந்து வரும் நமது உறைவிடம்’ என்று கூறி, அதன் தோற்றமூலத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த வினை, ஓர் ஆடையின்மேல் இன்னோர் ஆடையை அணிவதுபோல, ‘மேலாக அணிந்துகொள்ளுதல்’ என்ற பொருளைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில், உண்மையாகவே
  rationale: முந்தைய கருத்துடன் உள்ள விளக்கத் தொடர்பையும், இச்சொற்றொடரின் மிதமான வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν τούτῳ
  choice: இதில்
  rationale: இது தற்போதைய உடல்நிலையையோ முன்பு கூறப்பட்ட கூடாரத்தையோ சுட்டலாம்; கிரேக்கம் அதை வெளிப்படையாகத் திரும்பக் கூறாததால் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: στενάζομεν
  choice: நாம் பெருமூச்சுவிடுகிறோம்
  rationale: சுமையினால் எழும் உள்ளார்ந்த வேதனையையும் ஏக்கத்தையும் குறிக்கும் வினையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: பரலோகத்திலிருந்து வரும் நமது உறைவிடம்
  rationale: οἰκητήριον என்பதன் குடியிருப்பு உருவகத்தையும், ἐξ οὐρανοῦ என்பதன் தோற்றமூலக் கருத்தையும் காக்கிறது.
- source_word: ἐπενδύσασθαι
  choice: மேலாடையாக அணிந்துகொள்ள
  rationale: ஏற்கெனவே அணிந்திருப்பதன்மேல் வேறொன்றை அணிவது என்ற வினையின் தனிப்பட்ட நுண்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐπιποθοῦντες
  choice: ஏங்குகிறோம்
  rationale: வலுவான, தொடர்ந்த விருப்பத்தை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கப் பங்கேற்புவினையின் பொருள் முதன்மை வினையுடன் இணைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பரலோக உறைவிடமும் ஆடை அணிதலும் குறிக்கும் உருவகம்
  choice: உறைவிடம் மற்றும் மேலாடையாக அணிதல் ஆகிய இரு உருவகங்களையும் அப்படியே வைத்தல்
  alternative: இதனை வெளிப்படையாக ‘உயிர்த்தெழுந்த உடல்’ அல்லது ‘பரலோக வீடு’ என்று விளக்குதல்
  rationale: இவ்வசனம் உயிர்த்தெழுந்த உடல், இடைநிலை, அல்லது இறுதிக்காலப் பரலோக உறைவிடம் ஆகியவற்றில் ஒன்றை மட்டும் வெளிப்படையாக நிர்ணயிப்பதில்லை. ஆகவே அதன் இறையியல் பதற்றமும் திறந்த தன்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதில்’ என்ற சுட்டுச் சொல்லின் தெளிவின்மையும், உறைவிடம்–ஆடை என்ற கலப்பு உருவகமும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு [a] அது விளக்கும் ‘உறைவிடம்’ என்பதற்குப் பின்னரும், [b] ‘அணிந்துகொள்ள’ என்பதற்குப் பின்னரும் வைக்கப்பட்டுள்ளது.
