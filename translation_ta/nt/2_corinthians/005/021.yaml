reference: 2 Corinthians 5:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: ta
  text: அவரில் நாம் கடவுளின் நீதியாக[b] ஆகும்படி, பாவத்தை அறியாதவரை அவர் நமக்காகப் பாவமாக்கினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவப்பலியாக்கினார்.” கிரேக்கத்தில் இரு இடங்களிலும் “பாவம்” என்ற ஒரே சொல்தான் வருகிறது; இரண்டாவது இடத்தைச் சிலர் பலிசார் பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “கடவுளிடமிருந்து வரும் நீதியாக.” “கடவுளின் நீதி” என்பது கடவுளுக்குரிய நீதியையோ, அவர் வழங்கும் நீதிநிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντα
  choice: அறியாதவரை
  rationale: γινώσκω என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதைக் காக்கிறது. இங்கு பாவத்தில் தனிப்பட்ட பங்கேற்பு இல்லாததைக் குறிக்கும் கிரேக்கச் சொல்லாட்சியை, ‘பாவம் செய்யாதவர்’ என்று விளக்கமாக மாற்றாமல் அப்படியே வைத்திருக்கிறது.
- source_word: ἁμαρτίαν (முதல் இடம்)
  choice: பாவத்தை
  rationale: γνόντα என்பதன் நேரடியான செயப்படுபொருள். பவுலின் சுருக்கமான சொல்லாட்சியை விரித்து விளக்காமல் ‘பாவம்’ என்ற கருத்துப்பெயராகவே தருகிறது.
- source_word: ὑπὲρ ἡμῶν
  choice: நமக்காக
  rationale: பிரதிநிதித்துவம் மற்றும் நன்மைசார் பொருள் இரண்டையும் தாங்கக்கூடிய இயல்பான தமிழ்; குறிப்பிட்ட ஒரு பாவநிவாரணக் கோட்பாட்டுக்குள் பொருளைச் சுருக்கவில்லை.
- source_word: ἁμαρτίαν (இரண்டாம் இடம்)
  choice: பாவமாக
  rationale: கிரேக்கத்தில் இரு இடங்களிலும் ஒரே சொல் வருவதால் அதே ‘பாவம்’ என்ற சொல்லைத் தொடர்ந்து பயன்படுத்துகிறது. ‘பாவப்பலி’ என்ற சாத்தியமான பலிசார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐποίησεν
  choice: பாவமாக்கினார்
  rationale: ποιέω-வின் ‘ஆக்கினார்’ என்ற செயற்பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது; அந்த ஆக்கத்தின் துல்லியமான இயல்பைப் பற்றிய மேலதிக மெய்யியல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: γενώμεθα
  choice: ஆகும்படி
  rationale: γίνομαι என்பதன் ‘ஆகுதல்’ என்ற இயக்கமுள்ள பொருளையும் ἵνα நோக்க வாக்கியத்தின் வலிமையையும் காக்கிறது; நிலையான ‘இருத்தல்’ என்று தட்டையாக்கவில்லை.
- source_word: δικαιοσύνη
  choice: நீதி
  rationale: δικαιοσύνη-க்கு இயல்பான, விரிவான தமிழ் இணை. நீதித்தன்மை, சரியான நிலை, நியாயம் ஆகிய தொடர்புடைய நுணுக்கங்களை முன்கூட்டியே ஒரே கோட்பாட்டு விளக்கமாகக் குறுக்கவில்லை.
- source_word: θεοῦ
  choice: கடவுளின்
  rationale: மூலம், உடைமை, உறவு ஆகிய பல்வேறு வேற்றுமைத் தொடர்புகளுக்கும் இடமளிக்கும் வகையில் கிரேக்க உருபுத்தொடரின் சுருக்கத்தைப் பேணுகிறது.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: பவுலின் முக்கியமான ‘அவரில்’ என்ற உறவுசார் சொல்லாட்சியைச் சுருக்கமாகப் பேணுகிறது; ‘அவரோடு ஒன்றிணைந்து’ என்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘பாவத்தை அறியாதவரை ... பாவமாக்கினார்’ என்பதன் பொருள்
  choice: பாவமற்றவரைக் கடவுள் நமக்காகப் பாவத்துடன் தொடர்புடைய பிரதிநிதித்துவ நிலையில் வைத்தார் என்ற அழுத்தத்தை உரை தாங்குகிறது; அவர் ஒழுக்கரீதியாகப் பாவியானார் என்று கூறுவதில்லை.
  alternative: அவர் பாவப்பலியாக்கப்பட்டார்; அல்லது அவர் நேரடியாக ஒழுக்கரீதியில் பாவியானார்.
  rationale: முதல் சொற்றொடரே அவருடைய பாவமின்மையை வெளிப்படையாகக் கூறுகிறது. ஆகவே பவுலின் அதிர்வூட்டும் ‘பாவமாக்கினார்’ என்ற சொல்லாட்சியை முதன்மை உரை காக்கிறது; ‘பாவப்பலி’ என்ற பலிசார் புரிதலை அடிக்குறிப்பில் தருகிறது; ஆனால் அவர் பாவியானார் என்ற வாசிப்பு உடனடிச் சூழலுக்கு முரணானது.
- issue: δικαιοσύνη θεοῦ என்பதன் வலிமை
  choice: ‘கடவுளின் நீதி’ என்று திறந்த நிலையில் வைக்கப்படுகிறது.
  alternative: கடவுளிடமிருந்து வரும் நீதி; கடவுளுக்குரிய நீதி; கடவுள் வழங்கும் நீதிநிலை.
  rationale: இந்த உருபுத்தொடர் மூலம், உடைமை, உறவு ஆகிய நுணுக்கங்களைத் தாங்கக்கூடியது. ஒரு குறிப்பிட்ட கோட்பாட்டைத் தேர்ந்தெடுத்து மற்ற சாத்தியங்களை நீக்காமல், முதன்மை உரை அதன் செறிவையும் தெளிவின்மையையும் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடியதாய் இருந்தும் பவுலின் செறிவான இறையியல் சொல்லாட்சியை மென்மையாக்காத கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயல்பான தமிழ் வாக்கிய ஓட்டத்திற்காக நோக்க வாக்கியம் முன்னிலைப்படுத்தப்பட்டுள்ளது. ‘தேவன்’ என்பதற்குப் பதில் பரந்த நவீனப் பயன்பாட்டிலுள்ள ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது; ‘அவரில்’ என்ற பவுலியச் சொற்றொடர் விளக்கவுரையாக விரிக்கப்படவில்லை.
