source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: ta
  text: இப்பொழுது நான் மகிழ்கிறேன்; நீங்கள் துயரப்பட்டதற்காக அல்ல, நீங்கள் மனந்திரும்புதலுக்கு வழிவகுக்கும் வகையில் துயரப்பட்டதற்காகவே[a] மகிழ்கிறேன். ஏனெனில், நீங்கள் கடவுளுக்கு ஏற்றவாறு[b] துயரப்பட்டீர்கள்; எங்களிடமிருந்து நீங்கள் எந்த இழப்பும் அடையாதபடிக்கு[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் மனமாற்றத்திற்கு வழிவகுக்கும் வகையில் துயரப்பட்டதற்காகவே.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “கடவுளின்படி”; அல்லது, “கடவுள் விரும்பியபடி.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எங்கள் காரணமாக நீங்கள் எந்தத் தீங்கும் அடையாதபடிக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: இப்பொழுது
  rationale: முந்தைய துயரமான நிலையிலிருந்து பவுலின் தற்போதைய மகிழ்ச்சியை வேறுபடுத்திக் காட்டும் இயல்பான காலவினையடை.
- source_word: χαίρω
  choice: நான் மகிழ்கிறேன்
  rationale: வினைச்சொல்லின் நிகழ்காலத் தன்மையையும் பவுலின் நேரடியான உணர்வையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐλυπήθητε
  choice: நீங்கள் துயரப்பட்டீர்கள்
  rationale: மூலத்தில் மீண்டும் மீண்டும் வரும் வினை வடிவத்தைத் தக்கவைத்து, துயரத்தின் காரணத்தை மிகையாக விளக்காமல் விடுகிறது.
- source_word: εἰς μετάνοιαν
  choice: உங்கள் துயரம் மனந்திரும்புதலுக்கு வழிவகுத்தது
  rationale: εἰς குறிக்கும் திசையையும் விளைவையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; μετάνοια என்பதன் ஒழுக்க மற்றும் ஆன்மிக வலிமையை ‘மனந்திரும்புதல்’ தக்கவைக்கிறது.
- source_word: κατὰ θεόν
  choice: கடவுளுக்கு ஏற்றவாறு
  rationale: மொழிக்குமொழியான ‘கடவுளின்படி’ என்பதைவிட இயல்பான தமிழாக இருந்து, அந்தத் துயரம் கடவுளின் அளவுகோல் அல்லது சித்தத்துடன் ஒத்திருந்தது என்ற திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: ζημιωθῆτε
  choice: நீங்கள் எந்த வகையிலும் இழப்படையாதபடிக்கு
  rationale: ἵνα உடன் வரும் நோக்கம் அல்லது விளைவையும் ζημιόω என்பதன் ‘இழப்பு அடைதல்’ என்ற பொருளையும், உடல்சார்ந்த தீங்கு என்று குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: ἐξ ἡμῶν
  choice: எங்களால்
  rationale: அப்போஸ்தலர்களை மூலமாகவோ காரணமாகவோ கொண்ட இழப்பு என்ற ἐξ-இன் மூல/காரண நுணுக்கத்தைச் சுருக்கமாகக் காட்டுகிறது.
theological_decisions:
- issue: μετάνοια என்பதன் பொருள்
  choice: மனந்திரும்புதல்
  alternative: மனமாற்றம்
  rationale: இச்சூழலில் இது வெறும் கருத்துமாற்றத்தைவிட ஒழுக்க மற்றும் ஆன்மிகத் திருப்பத்தைக் குறிக்கிறது; இருப்பினும் சொல்லின் அடிப்படை மனமாற்ற நுணுக்கம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: κατὰ θεόν என்பதிலுள்ள துயரத்தின் இயல்பு
  choice: கடவுளுக்கு ஏற்றவாறு
  alternative: கடவுளின்படி; கடவுள் விரும்பியபடி
  rationale: துயரம் கடவுளின் அளவுகோலின்படியோ சித்தத்தின்படியோ இருந்தது என்ற தொடர்பைத் தக்கவைத்து, அதை ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாகக் குறுக்கவில்லை.
- issue: ἵνα கூறும் தொடர்பு
  choice: இழப்படையாதபடிக்கே
  alternative: அதனால் இழப்பு அடையவில்லை
  rationale: இறுதி உட்பிரிவு நோக்கத்தையோ எதிர்பார்க்கப்பட்ட விளைவையோ குறிக்கலாம்; பிரதான உரை அதன் நோக்கத் தொனியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் ‘துயரம்’ என்ற சொல்லின் மீளுருவாக்கம் இயன்றவரை காக்கப்பட்டுள்ளது; கடினமான கிரேக்கத் தொடர்புகள் இயல்பான தமிழ் வாக்கிய அமைப்பில் தரப்பட்டுள்ளன.
