    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: இடமளியுங்கள்
  rationale: χωρέω என்பதன் இறந்தகாலக் கட்டளை வடிவம். இங்கு உடல்ரீதியாக இடம் கொடுப்பதைவிட, பவுலையும் அவருடைய உடன் ஊழியர்களையும் உறவுரீதியாக ஏற்றுக்கொள்ளுமாறு வேண்டுவது பொருள். ‘இடமளியுங்கள்’ என்பது உருவகத்தைப் பாதுகாப்பதுடன் தமிழிலும் இயல்பாக உள்ளது.
- source_word: ἡμᾶς
  choice: எங்களுக்கு
  rationale: கிரேக்கத்தில் கட்டளை வினையின் நேரடிச் செயப்படுபொருளாக ‘எங்களை’ உள்ளது. ஆனால் ‘இடமளி’ என்ற தமிழ் வினையுடன் ‘எங்களுக்கு’ என்பது இயல்பான வேற்றுமை வடிவம்.
- source_word: οὐδένα
  choice: யாருக்கும் / யாரையும்
  rationale: மூன்று மறுப்புகளிலும் ‘ஒருவரும் இல்லை’ என்ற வலியுறுத்தலைப் பாதுகாக்க, தமிழ் வாக்கிய அமைப்புக்கு ஏற்ப ‘யாருக்கும்’ என்றும் ‘யாரையும்’ என்றும் மீண்டும் வழங்கப்பட்டுள்ளது.
- source_word: ἠδικήσαμεν
  choice: அநியாயம் செய்யவில்லை
  rationale: ἀδικέω என்பது ஒருவரிடம் அநீதியாக நடப்பதை அல்லது அவருக்குத் தீங்கு செய்வதைக் குறிக்கிறது. ‘அநியாயம் செய்யவில்லை’ என்பது அதன் பரந்த பொருளை தேவையின்றிக் குறுக்காமல் தருகிறது.
- source_word: ἐφθείραμεν
  choice: சீரழிக்கவில்லை
  rationale: φθείρω என்பதற்கு கெடுத்தல், சீரழித்தல், அழித்தல் ஆகிய பொருள்கள் உண்டு. இச்சூழலில் ‘சீரழிக்கவில்லை’ என்பது ஒழுக்க அல்லது ஆவிக்குரிய கேட்டை மட்டும் கட்டாயப்படுத்தாமல், ஒருவரைக் கேடுறச் செய்தல் என்ற பரந்த கருத்தைத் தருகிறது.
- source_word: ἐπλεονεκτήσαμεν
  choice: சுரண்டவில்லை
  rationale: πλεονεκτέω என்பது ஆதாயத்திற்காக ஒருவரைப் பயன்படுத்திக்கொள்ளுதல், மோசடி செய்தல் அல்லது சுரண்டுதல் என்ற பொருளைக் கொண்டது. ‘சுரண்டவில்லை’ என்பது பொருளாதாரத்திற்கும் உறவுரீதியான தவறான பயன்பாட்டிற்கும் இடமளிக்கும் சுருக்கமான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: Χωρήσατε ἡμᾶς என்ற வேண்டுகோளின் தன்மை
  choice: பவுலுக்கும் அவருடைய உடன் ஊழியர்களுக்கும் கொரிந்தியர்கள் தங்கள் உறவிலும் அன்பிலும் இடமளிக்க வேண்டுமென்ற வேண்டுகோள்
  alternative: பவுலையும் அவருடைய உடன் ஊழியர்களையும் பொதுவாக ஏற்றுக்கொள்ள அல்லது வரவேற்க வேண்டுமென்ற அழைப்பு
  rationale: 6:11–13-ல் விரிவடைந்த உள்ளமும் அன்பின் இடமும் பற்றிய மொழி இருப்பதால், இங்கு உறவுரீதியான வேண்டுகோள் முதன்மையாகத் தெரிகிறது. எனினும் கிரேக்க மூலத்தில் ‘இதயம்’ என்று நேரடியாக இல்லாததால், முதன்மை உரை அந்தச் சொல்லைச் சேர்க்காமல் உருவகத்தையும் அதன் இயல்பான தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று முறை வரும் οὐδένα என்ற வலியுறுத்தல், தமிழின் இயல்பான வேற்றுமை அமைப்போடு ‘யாருக்கும் / யாரையும் / யாரையும்’ எனப் பாதுகாக்கப்பட்டுள்ளது. மூலத்தின் சுருக்கமான, உறுதியான மறுப்புத் தொனியைத் தக்கவைக்க ஒரே வாக்கியத்தில் அரைப்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன.
