base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: ta
  text: எங்களுக்கு இடமளியுங்கள்[a]. நாங்கள் யாருக்கும் அநியாயம் செய்யவில்லை; யாரையும் சீரழிக்கவில்லை[b]; யாரையும் சுரண்டவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களை ஏற்றுக்கொள்ளுங்கள்,” “எங்களுக்கு உங்கள் உள்ளத்தில் இடம் கொடுங்கள்.” கிரேக்கச் சொற்றொடர் நேரடியாக “எங்களுக்கு இடமளியுங்கள்” என்று கூறுகிறது; இது 6:11–13-ல் வரும் உறவுரீதியான உருவகத்தைத் தொடரக்கூடும்.
    reason: lexical_alternative
  - marker: b
