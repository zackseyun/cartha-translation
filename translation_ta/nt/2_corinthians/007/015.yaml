  source_fidelity: 'மூலத்தின் முக்கிய உறவுகள் சரியாக உள்ளன: தீத்துவின் பாசம், கொரிந்தியர் அனைவரின் கீழ்ப்படிதல், பயத்தோடும் நடுக்கத்தோடும் அவரை ஏற்றுக்கொண்டமை. இருப்பினும், ‘நீங்கள் அனைவரும் கீழ்ப்படிந்ததையும்’ என்பது ὑπακοήν என்ற பெயர்ச்சொல்லைச் செயல்வினையாக மாற்றுவதால் சற்றே தளர்வாகவும் இயல்பற்றதாகவும் உள்ளது. ‘உங்கள் அனைவருடைய கீழ்ப்படிதலை’ என்பது மூலத்தின் பெயர்ச்சொல் அமைப்பையும் πάντων ὑμῶν-இன் முழுமை வலியுறுத்தலையும் நன்றாகக் காக்கிறது.'
