source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: ta
  text: உங்கள் அனைவருடைய கீழ்ப்படிதலையும், பயத்தோடும் நடுக்கத்தோடும்[a] நீங்கள் அவனை ஏற்றுக்கொண்டதையும் அவன் நினைவுகூரும்போது, உங்கள்மேல் அவனுக்குள்ள ஆழ்ந்த பாசம் மேலும் பெருகுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயபக்தியோடும் நடுக்கத்தோடும்.” “பயமும் நடுக்கமும்” என்பது தீவிரமான, தாழ்மையான இணக்கத்தைக் குறிக்கும் பவுலின் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: ஆழ்ந்த பாசம்
  rationale: இச்சொல் நேரடியாக உடலின் உள்ளுறுப்புகளைக் குறித்தாலும், இங்கு மரபுத்தொடராக ஆழமான அன்பையும் கனிவான உணர்வையும் குறிக்கிறது. ‘ஆழ்ந்த பாசம்’ என்பது நவீன தமிழில் இயல்பாகவும் உணர்வின் வலிமையைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: περισσοτέρως
  choice: இன்னும் அதிகமாகிறது
  rationale: தீத்துவின் பாசம் முன்பைவிட அதிகரிப்பதை ஒப்பீட்டு வலிமையுடன் காட்டுகிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்கள்மீது
  rationale: பாசம் கொரிந்தியர்களை நோக்கியது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀναμιμνῃσκομένου
  choice: அவன் நினைவுகூரும்போது
  rationale: தீத்து நினைவுகூரும் சூழலில் அவனுடைய பாசம் அதிகரிக்கிறது என்ற தொடர்ச்சியான உறவைப் பாதுகாக்கிறது.
- source_word: ὑπακοήν
  choice: கீழ்ப்படிந்ததை
  rationale: அப்போஸ்தல அறிவுறுத்தலுக்குக் கொரிந்தியர்கள் இணங்கி நடந்ததை நேரடியாகக் காட்டுகிறது; ‘பதிலளித்தல்’ போன்ற மென்மைப்படுத்தப்பட்ட சொல்லைவிட மூலச்சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: πάντων ὑμῶν
  choice: நீங்கள் அனைவரும்
  rationale: சமூகத்தின் எல்லாரையும் உள்ளடக்கும் கிரேக்கச் சொற்றொடரின் வலியுறுத்தலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: பயத்தோடும் நடுக்கத்தோடும்
  rationale: பவுலின் அடையாளமிக்க சொற்றொடரை விளக்கத்தில் கரைத்துவிடாமல் அப்படியே பாதுகாக்கிறது; அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐδέξασθε
  choice: ஏற்றுக்கொண்டதை
  rationale: தீத்துவை வரவேற்று ஏற்றுக்கொண்ட செயலைப் பரந்த பொருளுடன் இயல்பான தமிழில் குறிக்கிறது.
- source_word: αὐτόν
  choice: அவனை
  rationale: கிரேக்க மூலத்திலுள்ள சுட்டுப்பெயரைப் பாதுகாக்கிறது; உடனடிச் சூழலில் அது தீத்துவைக் குறிக்கிறது.
theological_decisions:
- issue: தீத்துவை ஏற்றுக்கொண்ட விதத்தை விளக்கும் ‘பயமும் நடுக்கமும்’ என்ற சொற்றொடரின் பொருள்
  choice: மூலத்தின் ‘பயத்தோடும் நடுக்கத்தோடும்’ என்ற சொற்றொடரை முதன்மை உரையில் பாதுகாத்து, பயபக்தியுடனான தீவிரத்தையும் தாழ்மையான இணக்கத்தையும் அடிக்குறிப்பில் சுட்டிக்காட்டுதல்
  alternative: ‘பயபக்தியோடும் நடுக்கத்தோடும்’ என்று முதன்மை உரையிலேயே பொருள் விளக்கி மொழிபெயர்த்தல்
  rationale: இது வெறும் பீதியைக் குறிக்காமல், பவுலின் பயன்பாட்டில் தீவிரமான, தாழ்மையான பொறுப்புணர்வைக் குறிக்கக்கூடும். எனினும் ‘பயம்’ என்ற உண்மையான சொற்பொருளையும் சொற்றொடரின் இறையியல் அழுத்தத்தையும் நீக்காமல் பாதுகாப்பது சிறந்தது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. கிரேக்க வாக்கியத்தின் காரண-சூழல் உறவைத் தமிழில் தெளிவாக்க வாக்கிய உறுப்புகள் மறுவரிசைப்படுத்தப்பட்டுள்ளன; ஆனால் பொருளும் உணர்ச்சி வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
