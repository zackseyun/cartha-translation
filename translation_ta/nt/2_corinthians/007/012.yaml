source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: ta
  text: ஆகவே, நான் உங்களுக்கு எழுதியிருந்தபோதிலும், அநியாயம் செய்தவருக்காகவோ அநியாயம் இழைக்கப்பட்டவருக்காகவோ நான் எழுதவில்லை. மாறாக, எங்கள்மீது உங்களுக்கு இருக்கும் தீவிர அக்கறை[b] கடவுளுக்கு முன்பாக உங்களிடையே வெளிப்பட வேண்டும் என்பதற்காகவே எழுதினேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் இவ்வசனத்தின் இறுதிப்பகுதி, “உங்களுக்காக எங்களுக்கு இருக்கும் தீவிர அக்கறை கடவுளுக்கு முன்பாக உங்களிடையே வெளிப்பட வேண்டும்” என்று வாசிக்கிறது.
    reason: textual_variant
  - marker: b
    text: “தீவிர அக்கறை” என்பதை “முனைப்பு,” “ஆர்வம்,” அல்லது “ஆழ்ந்த கரிசனை” என்றும் மொழிபெயர்க்கலாம். “உங்களிடையே” என்பதை “உங்களிடம்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: ஆகவே, ... எழுதியிருந்தாலும்
  rationale: ἄρα என்பதன் முடிவுரைத்தொடர்பை ‘ஆகவே’ என்றும், εἰ καὶ என்பதன் விட்டுக்கொடுக்கும் பொருளை ‘எழுதியிருந்தாலும்’ என்றும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἔγραψα
  choice: நான் ... எழுதினேன்
  rationale: முந்தைய கடிதத்தைச் சுட்டும் இறந்தகால வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: οὐχ ἕνεκεν τοῦ ἀδικήσαντος
  choice: தவறு செய்தவருக்காக ... எழுதவில்லை
  rationale: ἕνεκεν என்பதன் காரணம் அல்லது நோக்கம் சார்ந்த பொருளை ‘-க்காக’ தெரிவிக்கிறது; பெயர்ச்சொல்லாக வந்த வினையெச்சம் செயற்பாட்டு வடிவில் காக்கப்படுகிறது.
- source_word: οὐδὲ ἕνεκεν τοῦ ἀδικηθέντος
  choice: தவறுக்கு ஆளானவருக்காகவோ
  rationale: செயப்பாட்டு வினையெச்சத்தை இயல்பான தமிழில் அளித்து, முந்தைய தொடருடனான இணை அமைப்பைப் பேணுகிறது.
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: மாறாக, ... வெளிப்பட வேண்டும் என்பதற்காகவே
  rationale: நோக்கத்தையும் φανερωθῆναι என்பதன் செயப்பாட்டு/தானாக வெளிப்படும் நுணுக்கத்தையும் மிகையாக விளக்காமல் தருகிறது.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: உங்களுக்கு இருக்கும் தீவிர அக்கறை
  rationale: σπουδή குறிக்கும் ஊக்கம், அக்கறை, முனைப்பு ஆகியவற்றை இச்சூழலில் இயல்பாக ஒருங்கிணைக்கிறது.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: எங்கள்மீது
  rationale: பவுலையும் அவருடைய உடன் ஊழியர்களையும் நோக்கிய அக்கறையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πρὸς ὑμᾶς
  choice: உங்கள் நடுவில்
  rationale: சிக்கலான தொடரில் πρὸς ὑμᾶς என்பதை கொரிந்தியர் மத்தியில் வெளிப்படுதல் என எடுத்துக்கொள்கிறது; வேற்றுப் பொருள் சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: தெய்வீக முன்னிலை அல்லது சாட்சியின் கருத்தை கண்ணியமான பொதுத் தமிழில் காக்கிறது.
theological_decisions:
- issue: τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς என்ற தொடரின் உரை மற்றும் தொடரியல் சிக்கல்
  choice: ‘எங்கள்மீது உங்களுக்கு இருக்கும் தீவிர அக்கறை ... உங்கள் நடுவில் வெளிப்பட வேண்டும்’
  alternative: ‘உங்களுக்காக எங்களுக்கு இருக்கும் தீவிர அக்கறை உங்கள் நடுவில் வெளிப்பட வேண்டும்’ அல்லது ‘உங்களிடம் வெளிப்பட வேண்டும்’
  rationale: SBLGNT அச்சிட்டுள்ள உரையில் ὑμῶν என்பதை ‘உங்கள்’, ὑπὲρ ἡμῶν என்பதை ‘எங்களுக்காக/எங்கள்மீது’, πρὸς ὑμᾶς என்பதை ‘உங்கள் நடுவில்’ என எடுத்துக்கொள்கிறது. முக்கிய கையெழுத்துப் பிரதி வேறுபாடு அடிக்குறிப்பில் தரப்பட்டு, சிக்கல் அமைதியாகத் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இணை அமைப்பையும் இறுதித் தொடரின் உண்மையான உரை/தொடரியல் தெளிவின்மையையும் அடிக்குறிப்புகள் வழியாகப் பேணுகிறது.
