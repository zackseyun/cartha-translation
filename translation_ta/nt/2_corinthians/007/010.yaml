  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: ta
  text: ஏனெனில், கடவுளுக்கு ஏற்ற துயரம் மீட்புக்கு வழிநடத்தும் மனந்திரும்புதலை உண்டாக்குகிறது; அதற்காகப் பின்னர் வருந்த வேண்டியதில்லை[a][b]. ஆனால் உலகத்துக்குரிய துயரம் மரணத்தை உண்டாக்குகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின்படியான துயரம்.” கிரேக்கத் தொடர் சொல்லுக்கு சொல் “கடவுளின்படியான துயரம்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மீட்புக்கு வழிநடத்தும், வருந்த வேண்டியதில்லாத மனந்திரும்புதலை உண்டாக்குகிறது.” “வருந்த வேண்டியதில்லாத” என்பது மனந்திரும்புதலை நேரடியாக விவரிப்பதாகப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
