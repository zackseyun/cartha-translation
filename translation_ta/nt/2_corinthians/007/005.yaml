revisions:
- from: ஏனெனில், நாங்கள் மக்கெதோனியாவுக்கு வந்தபோதும், எங்கள் மாம்சத்துக்கு ஓய்வே கிடைக்கவில்லை[a]. மாறாக, எல்லா வகையிலும் நெருக்கப்பட்டோம்—வெளியே மோதல்கள், உள்ளே அச்சங்கள்.
  to: ஏனெனில், நாங்கள் மக்கெதோனியாவுக்கு வந்தபோதுகூட, எங்கள் மாம்சத்திற்கு ஓய்வு கிடைக்கவில்லை; மாறாக, எல்லா வகையிலும் நெருக்கப்பட்டோம்—வெளியே மோதல்கள், உள்ளே அச்சங்கள்.
  rationale: The revision clarifies the temporal force of the Greek genitive absolute and preserves its mild emphasis. It also joins the contrast into one continuous Tamil sentence, reflecting the source syntax and rhetorical movement. The footnote is adjusted only to match the revised case form in the main text.
