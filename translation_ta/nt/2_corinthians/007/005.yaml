id: 2CO.7.5
reference: 2 Corinthians 7:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: ta
  text: ஏனெனில், நாங்கள் மக்கெதோனியாவுக்கு வந்தபோதுகூட, எங்கள் மாம்சத்திற்கு ஓய்வு கிடைக்கவில்லை; மாறாக, எல்லா வகையிலும் நெருக்கப்பட்டோம்—வெளியே மோதல்கள், உள்ளே அச்சங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது. γάρ தரும் காரணவிளக்கத்தையும் καί தரும் வலியுறுத்தலையும் தொடர்ந்து வரும் ‘வந்தபோதும்’ என்ற அமைப்பு சேர்ந்து வெளிப்படுத்துகின்றன.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: நாங்கள் மக்கெதோனியாவுக்கு வந்தபோதும்
  rationale: Genitive absolute அமைப்பை காலத்தைக் குறிக்கும் உட்பிரிவாக மொழிபெயர்க்கிறது; ‘-போதும்’ என்பது அந்த வருகைக்குப் பிறகும் ஓய்வு கிடைக்காத எதிர்பாராத நிலையை இயல்பாக உணர்த்துகிறது.
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: ஓய்வே கிடைக்கவில்லை
  rationale: ἄνεσις குறிக்கும் அழுத்தத்திலிருந்து கிடைக்கும் ஓய்வு அல்லது நிவாரணத்தைத் தெளிவாகச் சொல்கிறது; ‘-வே’ முழுமையான மறுப்பை வலியுறுத்துகிறது.
- source_word: ἡ σὰρξ ἡμῶν
  choice: எங்கள் மாம்சத்துக்கு
  rationale: σάρξ என்பதன் உருவகமற்ற உடல்சார்ந்த மனித பலவீனம் மற்றும் துயரைக் குறிக்கும் மூலப்படிமத்தைப் பாதுகாக்கிறது. தமிழில் ஓய்வு ‘கிடைப்பது’ என்பதற்கேற்ப நான்காம் வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: மாறாக, எல்லா வகையிலும் நெருக்கப்பட்டோம்
  rationale: θλίβω குறிக்கும் அழுத்தப்படுதல், துன்புறுத்தப்படுதல் என்ற பரந்த பொருளை ‘நெருக்கப்பட்டோம்’ தக்கவைக்கிறது; ἐν παντί என்பதை ‘எல்லா வகையிலும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔξωθεν μάχαι
  choice: வெளியே மோதல்கள்
  rationale: μάχαι என்பது இங்கு நேரடியான ஆயுதப் போரை மட்டும் அல்லாமல் வெளிப்புற எதிர்ப்பு மற்றும் சச்சரவுகளையும் குறிக்கக்கூடும்; ‘மோதல்கள்’ அந்தப் பரப்பைத் திறந்துவைக்கிறது.
- source_word: ἔσωθεν φόβοι
  choice: உள்ளே அச்சங்கள்
  rationale: வெளிப்புற மோதல்களுக்கு எதிராக உள்ளார்ந்த பலவகை அச்சங்களைச் சுருக்கமாகவும் இணையான வடிவிலும் காட்டுகிறது.
theological_decisions:
- issue: σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: எங்கள் மாம்சத்துக்கு
  alternative: எங்களுக்கே / எங்கள் உடலுக்கு
  rationale: இங்கு σάρξ பாவ இயல்பைக் குறிக்கும் தொழில்நுட்பச் சொல்லாக இல்லாமல், உடலோடு வாழும் மனிதர்களின் பலவீனத்தையும் துயரையும் குறிக்கிறது. ஆகவே மூலத்தின் ‘மாம்சம்’ என்ற வெளிப்பாடு முதன்மை உரையில் வைக்கப்பட்டு, இயல்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘மாம்சம்’ என்ற மூலப்படிமம் இறையியல் சார்ந்த தவறான விரிவாக்கமின்றிப் பாதுகாக்கப்பட்டு, அதன் இயல்பான பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. இறுதி இரு சொற்றொடர்களில் ‘வெளியே/உள்ளே’ என்ற இணை அமைப்பு கிரேக்கத்தின் கூர்மையான எதிர்மறை ஒப்புமையைப் பேணுகிறது.
