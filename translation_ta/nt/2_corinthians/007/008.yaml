id: 2CO.7.8
reference: 2 Corinthians 7:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι εἰ καὶ ἐλύπησα ὑμᾶς ἐν τῇ ἐπιστολῇ, οὐ μεταμέλομαι· εἰ καὶ μετεμελόμην (⸀βλέπω ὅτι ἡ ἐπιστολὴ ἐκείνη εἰ καὶ πρὸς ὥραν ἐλύπησεν ὑμᾶς),
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/008.yaml
  text: For even if I grieved you with the letter[a], I do not regret it—though I did regret it, for I see that that letter grieved you[b], though only for a time.
translation:
  language: ta
  text: ஏனெனில், அந்தக் கடிதத்தால் நான் உங்களைத் துயரப்படுத்தினேன் என்றாலும், அதற்காக நான் வருந்தவில்லை; முன்பு நான் வருந்தினேன்[a] என்றாலும், அந்தக் கடிதம் உங்களைச் சிறிது காலத்திற்கே[b] துயரப்படுத்தியது என்பதை நான் காண்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வருந்திக்கொண்டிருந்தேன்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம், கடந்த காலத்தில் நீடித்த வருத்த நிலையைக் குறிப்பாக வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘ஒரு மணிநேரத்திற்கு’; இது ‘சிறிது காலத்திற்கு’ என்று பொருள்படும் ஒரு மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύπησα / ἐλύπησεν
  choice: துயரப்படுத்தினேன் / துயரப்படுத்தியது
  rationale: λυπέω என்பது துயரம் அல்லது மனவேதனை உண்டாக்குவதைக் குறிக்கிறது. ‘துயரப்படுத்து’ என்பது உணர்ச்சிசார் வலிமையைத் தக்கவைக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: அந்தக் கடிதத்தால்
  rationale: இங்கு ἐν கருவிப்பொருளில் வருகிறது; கடிதமே துயரத்தை உண்டாக்கிய வழிமுறை என்பதை ‘கடிதத்தால்’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μεταμέλομαι
  choice: அதற்காக வருந்தவில்லை
  rationale: இச்சூழலில் μεταμέλομαι அறநெறிசார் மனந்திரும்புதலை அல்ல, செய்த காரியத்தின் விளைவைக் குறித்த வருத்தத்தைக் குறிக்கிறது.
- source_word: μετεμελόμην
  choice: முன்பு அதற்காக வருந்தினேன்
  rationale: இறந்தகாலத் தொடர்நிலையைச் சுட்டக்கூடிய கிரேக்க imperfect வடிவத்தின் அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது; கால வேறுபாட்டைத் தெளிவாக்க ‘முன்பு’ சேர்க்கப்பட்டுள்ளது.
- source_word: βλέπω
  choice: நான் காண்கிறேன்
  rationale: பவுல் கடிதத்தின் விளைவை உணர்ந்து அறிந்ததைக் குறிக்கும் மூலச் சொல்லின் நேரடியான உருவகத்தைத் தக்கவைக்கிறது.
- source_word: ἡ ἐπιστολὴ ἐκείνη
  choice: அந்தக் கடிதம்
  rationale: ἐκείνη என்பதன் சுட்டுப்பொருளையும் குறிப்பிட்ட கடிதத்தைக் குறிக்கும் தன்மையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: πρὸς ὥραν
  choice: சிறிது காலத்திற்கே
  rationale: சொல்லுக்குச் சொல் ‘ஒரு மணிநேரத்திற்கு’ என்றாலும், இது குறுகிய காலத்தைக் குறிக்கும் மரபுத்தொடர். ‘-க்கே’ அதன் தற்காலிகத் தன்மையை வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பைத் தக்கவைக்கிறது.
- source_word: εἰ καὶ
  choice: …இருந்தாலும் / …என்றாலும்
  rationale: மீண்டும் வரும் concessive அமைப்பை இயல்பான தமிழில் வேறுபட்ட இலக்கண வடிவங்களால் தக்கவைக்கிறது.
theological_decisions:
- issue: பவுலின் உணர்ச்சிசார் சுயவிவரிப்பில் μεταμέλομαι என்பதன் பொருள்
  choice: ‘வருந்து’ என்று மொழிபெயர்த்தல்
  alternative: ‘மனந்திரும்பு’ அல்லது ‘மன்னிப்பு கேட்கும் அளவு மனம் வருந்து’
  rationale: சூழல், முந்தைய கடிதம் ஏற்படுத்திய வேதனையைக் குறித்த பவுலின் உணர்ச்சியைப் பற்றியது; தேவனுக்கு முன்பான அறநெறிசார் மனந்திரும்புதலைப் பற்றியது அல்ல. ஆகவே உரை கூறாத இறையியல் பொருளைச் சேர்க்காமல் ‘வருந்து’ என வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சலுகைநிலைத் தொடர்களும் நிகழ்கால வருத்தம் மற்றும் முந்தைய வருத்தம் ஆகியவற்றுக்கிடையிலான பதற்றமும் முடிந்தவரை தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
