id: 2CO.7.13
reference: 2 Corinthians 7:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: ta
  text: இதனால் நாங்கள் ஆறுதல் அடைந்திருக்கிறோம்.[a] எங்களுக்குக் கிடைத்த ஆறுதலுக்கு மேலாக, தீத்துவின் மகிழ்ச்சியைக் கண்டு இன்னும் மிக அதிகமாக மகிழ்ந்தோம். ஏனெனில் உங்கள் அனைவராலும் அவருடைய உள்ளம் புத்துணர்வு பெற்றிருக்கிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆறுதல் அடைந்திருக்கிறோம்’ என்பதற்கு ‘ஊக்கம் பெற்றிருக்கிறோம்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் இச்சூழலில் இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘புத்துணர்வு பெற்றிருக்கிறது’ என்பதற்கு ‘ஓய்வு பெற்றிருக்கிறது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்
  rationale: முந்தைய கருத்திலிருந்து வரும் காரணத்தையும் விளைவையும் இயல்பான தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: παρακεκλήμεθα
  choice: நாங்கள் ஆறுதல் அடைந்திருக்கிறோம்
  rationale: முன்பு கிடைத்த ஆறுதலின் தற்போதைய விளைவை கிரேக்க நிறைவேற்றுக்காலம் காட்டுவதால், ‘அடைந்திருக்கிறோம்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: எங்களுக்குக் கிடைத்த ஆறுதலுக்கு மேலாக
  rationale: அவர்கள் பெற்ற ஆறுதலோடு மேலும் சேர்ந்த பெருமகிழ்ச்சியை ἐπί இங்கு குறிப்பதால், தமிழில் இயல்பாக இவ்வாறு தரப்பட்டது.
- source_word: περισσοτέρως μᾶλλον
  choice: இன்னும் மிக அதிகமாக
  rationale: அடுத்தடுத்து வரும் இரு வலியுறுத்தும் ஒப்பீட்டுச் சொற்களின் தீவிரத்தை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου
  choice: தீத்துவின் மகிழ்ச்சியைக் கண்டு ... மகிழ்ந்தோம்
  rationale: தீத்துவின் மகிழ்ச்சியே அவர்களுடைய கூடுதல் மகிழ்ச்சிக்கான அடிப்படை என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀναπέπαυται
  choice: புத்துணர்வு பெற்றிருக்கிறது
  rationale: முன்னர் ஏற்பட்ட ஓய்வும் நிம்மதியும் இப்போது நீடிக்கும் நிலையை நிறைவேற்றுக்காலத்துடன் உணர்த்துகிறது; ‘ஓய்வு பெற்றது’ என்ற பொருளும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: அவருடைய உள்ளம்
  rationale: இங்கு தீத்துவின் மனித ஆவி அல்லது உள்ளார்ந்த மனநிலையே குறிக்கப்படுகிறது. ‘உள்ளம்’ என்பது சாதாரண தமிழில் இயல்பாக இருந்து, பரிசுத்த ஆவியைக் குறிக்கிறது என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: உங்கள் அனைவராலும்
  rationale: தீத்துவுக்குப் புத்துணர்வு கிடைத்ததற்கான மனித மூலத்தையோ செயலாற்றுவோரையோ தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: τὸ πνεῦμα αὐτοῦ என்பதன் குறிப்பு
  choice: தீத்துவின் உள்ளம் / மனித ஆவி
  alternative: பரிசுத்த ஆவி
  rationale: αὐτοῦ என்ற உடைமைச் சுட்டும், கொரிந்தியர்களால் தீத்து பெற்ற நிம்மதியைப் பற்றிய சூழலும், இது தீத்துவின் சொந்த உள்ளார்ந்த நிலையைச் சுட்டுவதை உறுதிப்படுத்துகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் உணர்ச்சிசார் வலியுறுத்தலும் நிறைவேற்றுக்கால விளைவும் இயன்றவரை காக்கப்பட்டுள்ளன.
