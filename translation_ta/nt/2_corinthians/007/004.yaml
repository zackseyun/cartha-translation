source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: ta
  text: உங்களிடம் எனக்கு மிகுந்த துணிவு உண்டு[a]; உங்களைக் குறித்து நான் மிகுந்த பெருமை பேசுகிறேன். தேற்றுதலால் நான் நிறைந்திருக்கிறேன்[b]; நாம் அனுபவிக்கும் எல்லாத் துன்பங்களின் நடுவிலும்[c] மகிழ்ச்சியில் நான் அளவுகடந்து பொங்குகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களிடம் எனக்கு மிகுந்த நம்பிக்கை உண்டு.’ கிரேக்கச் சொல் வெளிப்படையாகப் பேசும் உரிமையுணர்வையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆறுதலால்’ அல்லது ‘ஊக்கத்தால்.’ கிரேக்கச் சொல் தேற்றுதல், மனவலிமையூட்டுதல் ஆகிய இரு நுண்பொருள்களையும் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நமது எல்லாத் துன்பங்களையும் மீறி.’ இங்கு துன்பம் தொடரும் நிலையிலேயே மகிழ்ச்சி பொங்குவதாகவும் கிரேக்கத்தைப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: துணிவு
  rationale: இச்சொல் துணிவையும், நம்பிக்கையுடன் வெளிப்படையாகப் பேசுவதையும் குறிக்கலாம். ‘உங்களிடம் எனக்கு மிகுந்த துணிவு உண்டு’ என்பது அதன் வலிமையையும் உறவுசார் நோக்கையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம்
  rationale: πρός இங்கு கொரிந்தியரை நோக்கிய பவுலின் உறவுசார் மனநிலையைக் காட்டுகிறது; ‘உங்களிடம்’ என்பது நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: καύχησις
  choice: பெருமை பேசுகிறேன்
  rationale: பவுலின் நேர்மறையான ‘பெருமைபாராட்டுதல்/பெருமை பேசுதல்’ சொல்லாட்சியை மென்மையாக்காமல் காக்கிறது; சூழல் இது கொரிந்தியரைப் பற்றிய பெருமை என்பதைத் தெளிவாக்குகிறது.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களைக் குறித்து
  rationale: ὑπέρ இங்கு அவர்களைப் பற்றிய அல்லது அவர்களுக்குச் சாதகமான பெருமைப் பேச்சைக் குறிக்கிறது; ‘உங்களைக் குறித்து’ தேவையற்ற மேலதிக விளக்கமின்றி அந்தப் பொருளைக் காக்கிறது.
- source_word: πεπλήρωμαι
  choice: நான் நிறைந்திருக்கிறேன்
  rationale: நிறைவு பெற்றதன் விளைவாகத் தொடரும் தற்போதைய நிலையைக் கிரேக்க நிறைவுற்ற கால வடிவம் காட்டுகிறது; தமிழ் வினை வடிவம் அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παρακλήσει
  choice: தேற்றுதல்
  rationale: παράκλησις ஆறுதல், ஊக்கம், மனவலிமையூட்டுதல் ஆகிய பொருள்களை உள்ளடக்குகிறது. துன்பச் சூழலில் ‘தேற்றுதல்’ ஆறுதலையும் வலுப்படுத்துதலையும் இணைத்துக் காட்டுகிறது.
- source_word: ὑπερπερισσεύομαι
  choice: அளவுகடந்து பொங்குகிறேன்
  rationale: இந்த வலியுறுத்தப்பட்ட வினை மிகுதியையும் நிரம்பி வழியும் படிமத்தையும் தருகிறது; தமிழ் மொழிபெயர்ப்பு இரண்டையும் தெளிவாகக் காக்கிறது.
- source_word: χαρᾷ
  choice: மகிழ்ச்சியால்
  rationale: χαρά என்பதன் நேரான பொருள் ‘மகிழ்ச்சி’; இங்கு பொங்கிநிறையும் உணர்வை இயல்பாக இணைக்க ‘மகிழ்ச்சியால்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: நாம் அனுபவிக்கும் எல்லாத் துன்பங்களின் நடுவிலும்
  rationale: ἐπί உடன் வரும் இத்தொடர் துன்பம் நீங்கிய பின்னர் அல்ல, அதன் மத்தியிலேயே மகிழ்ச்சி பொங்குவதைச் சுட்டுகிறது. ‘நடுவிலும்’ அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- source_word: πολλή ... πολλή
  choice: மிகுந்த ... மிகவும்
  rationale: மீண்டும் வரும் πολλή மிகுதியை வலியுறுத்துகிறது. ஒரே தமிழ்ச் சொல்லை இயந்திரமாகத் திரும்பச் சொல்லாமல், இரு கூற்றுகளிலும் அந்த வலிமை இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: நேர்மறையான பவுலின் καύχησις சொல்லாட்சியைப் பாவமான தற்பெருமையாக மாற்றாமல் மொழிபெயர்த்தல்
  choice: ‘உங்களைக் குறித்து நான் மிகவும் பெருமை பேசுகிறேன்’
  alternative: ‘உங்களைக் குறித்து எனக்கு மிகுந்த பெருமிதம் உண்டு’
  rationale: ‘பெருமை பேசுகிறேன்’ என்பது பவுலின் துணிவான சொல்லாட்சியைக் காக்கிறது; ‘உங்களைக் குறித்து’ என்பது இது சுயமேன்மைப்படுத்தல் அல்ல என்பதைச் சூழலிலேயே தெளிவாக்குகிறது.
- issue: மகிழ்ச்சியும் துன்பமும் ஒரே நேரத்தில் நிலவும் பதற்றத்தைக் காத்தல்
  choice: ‘எல்லாத் துன்பங்களின் நடுவிலும்’
  alternative: ‘எல்லாத் துன்பங்களையும் பொருட்படுத்தாமல்’
  rationale: கிரேக்கம் துன்பத்துக்கு மத்தியிலேயே மகிழ்ச்சி பொங்குவதை அனுமதிக்கிறது. எதிர்மறையை முழுமையாகக் குறிக்கும் மாற்று, மூலத்தில் உள்ள உறவை அளவுக்கு மீறித் தீர்மானித்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘துணிவு,’ ‘தேற்றுதல்,’ ‘அளவுகடந்து பொங்குகிறேன்’ ஆகிய சொற்கள் மூலத்தின் வலிமையையும் உணர்ச்சி மிகுதியையும் காக்கின்றன; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
