  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் துல்லியமாகக் காக்கப்பட்டுள்ளது: பவுலின் கொரிந்தியரிடமான தைரியமான திறந்தநிலை, அவர்களைக்குறித்த பெருமைபேச்சு, தேற்றுதலின் நிறைவு, துன்பத்தின் மத்தியிலுள்ள மிகுதியான மகிழ்ச்சி ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. ஆனால் χαρᾷ-க்கு ‘மகிழ்ச்சியால்’ என்பது காரணப்பொருளைச் சற்றே முன்னிறுத்தலாம்; ‘மகிழ்ச்சியில்’ என்பது மூலத்தின் ‘மகிழ்ச்சியால்/மகிழ்ச்சியில் நிரம்பி வழிதல்’ என்ற இணைப்பைத் தமிழில் இயல்பாகவும் நெருக்கமாகவும் தருகிறது.'
