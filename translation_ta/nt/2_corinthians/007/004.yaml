  terminology: ‘துணிவு,’ ‘பெருமை பேசுகிறேன்,’ ‘தேற்றுதல்,’ ‘அளவுகடந்து பொங்குகிறேன்’ ஆகியவை பொருத்தமானவை. παρρησία-வின் திறந்த பேச்சு நுணுக்கம் அடிக்குறிப்பில் சரியாகக் கொடுக்கப்பட்டுள்ளது. παράκλησις-க்கு ‘தேற்றுதல்’ சூழலுக்கு ஏற்றது; அடிக்குறிப்பிலுள்ள ‘ஆறுதல்’ மற்றும் ‘ஊக்கம்’ மாற்றுகளும் உதவுகின்றன.
