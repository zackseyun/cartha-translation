source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: ta
  text: ஆகவே, அன்புக்குரியவர்களே, இந்த வாக்குறுதிகளைப் பெற்றுள்ள நாம், மாம்சத்தினதும் ஆவியினதும்[a] எல்லாத் தீட்டிலிருந்தும் நம்மைத் தூய்மைப்படுத்துவோமாக; கடவுளுக்குப் பயந்து[c] பரிசுத்தத்தை முழுநிறைவுக்குக் கொண்டுவருவோமாக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாம்சத்தினதும் ஆவியினதும்’ என்பதை ‘உடலினதும் ஆவியினதும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பரிசுத்தத்தை முழுமையாக்கிக்கொண்டு.’
    reason: lexical_alternative
  - marker: c
    text: இங்குள்ள ‘பயம்’ என்பது வெறும் திகிலை அல்ல, கடவுள்முன் கொள்ளும் ஆழ்ந்த பயபக்தியையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: இந்த வாக்குறுதிகளை
  rationale: ταύτας முன் கூறப்பட்ட வாக்குறுதிகளைச் சுட்டுகிறது; ἐπαγγελία என்பதற்கு பவுலின் பயன்பாட்டில் இயல்பான தமிழ் இணை ‘வாக்குறுதி’.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களிலுள்ள வாக்குறுதிகளிலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்பும் மேன்மையான கடிதநடையும் கொண்ட நேரடி அழைப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: நம்மைத் தூய்மைப்படுத்திக்கொண்டு ... கொண்டுவருவோமாக
  rationale: முதல் நபர் பன்மை ஊக்கவுரை பவுலையும் வாசகர்களையும் உள்ளடக்குகிறது. தொடரும் எச்சவினையுடன் இயல்பான தமிழில் இணைக்கப்பட்டது.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: எல்லாத் தீட்டிலிருந்தும்
  rationale: μολυσμός என்பதிலுள்ள ஒழுக்க மற்றும் சமயத் தூய்மைக்கேட்டு சார்ந்த ‘கறை/தீட்டு’ நிழற்பொருளை ‘தீட்டு’ சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: σαρκὸς καὶ πνεύματος
  choice: மாம்சத்திலும் ஆவியிலும்
  rationale: உடல் சார்ந்த மற்றும் உள்ளார்ந்த பரிமாணங்களைக் குறிக்கும் இணைப்பைத் திறந்த நிலையில் வைக்கிறது; σάρξ என்பதை ‘பாவ இயல்பு’ என்று விளக்கி முடிவுசெய்யவில்லை.
- source_word: ἐπιτελοῦντες
  choice: முழுநிறைவுக்குக் கொண்டுவருவோமாக
  rationale: தொடங்கியதை அதன் இலக்குவரை நிறைவேற்றும் ἐπιτελέω என்பதன் இயக்கத்தையும் நிறைவு உணர்வையும் வெளிப்படுத்துகிறது.
- source_word: ἁγιωσύνην
  choice: பரிசுத்தத்தை
  rationale: ஒரு நிலை அல்லது பண்பாகிய holiness என்பதற்கான நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: ἐν φόβῳ θεοῦ
  choice: கடவுளுக்குப் பயந்து
  rationale: ‘பயம்’ என்ற வேதாகமச் சொல்லின் வலிமையை மெலிதாக்காமல் காக்கிறது; சூழலில் அது வெறும் திகில் அல்ல, பயபக்தியையும் உள்ளடக்குகிறது.
theological_decisions:
- issue: σαρκὸς என்பதன் பொருள்
  choice: ‘மாம்சம்’ என்ற சொல்லால் உடல் சார்ந்த பரிமாணத்தை நேரடியாகக் காத்தல்
  alternative: உடல்; பாவ இயல்பு
  rationale: πνεύματος உடன் இணைக்கப்பட்டிருப்பதால் முழு மனிதரின் வெளிப்புற/உடல் மற்றும் உள்ளார்ந்த பரிமாணங்கள் முன்னிலைப்படுகின்றன. ‘பாவ இயல்பு’ என்பது இங்கு தேவையற்ற கோட்பாட்டு விளக்கமாகிவிடும்.
- issue: καθαρίσωμεν என்ற ஊக்கவுரையின் வலிமை
  choice: பவுலையும் வாசகர்களையும் உள்ளடக்கும் ‘நாம் ... வோமாக’
  alternative: நாம் தூய்மைப்படுத்திக்கொள்ள வேண்டும்
  rationale: கிரேக்க முதல் நபர் பன்மை subjunctive நேரடியான கூட்டான அழைப்பாக உள்ளது; வெறும் கடமைக் கூற்றாக மாற்றப்படவில்லை.
- issue: φόβος θεοῦ என்பதன் நிழற்பொருள்
  choice: ‘கடவுளுக்குப் பயந்து’ என்று வலிமையான மூல உருவகத்தைப் பாதுகாத்தல்
  alternative: கடவுளிடம் பயபக்தியுடன்
  rationale: இது பயபக்தியுள்ள அச்சத்தைச் சுட்டினாலும் ‘பயம்’ என்ற கூறை முற்றிலும் நீக்குவது மூலத்தின் இறையியல் அழுத்தத்தை மெலிதாக்கும்.
- issue: ἐπιτελοῦντες மற்றும் பிரதான ஊக்கவுரையின் உறவு
  choice: தூய்மைப்படுத்துதலோடு இணைந்து பரிசுத்தத்தை நிறைவுக்குக் கொண்டுவரும் தொடர்ச்சியான செயல்
  alternative: பரிசுத்தத்தை முழுமையாக்கிக்கொண்டு
  rationale: எச்சவினை பிரதான அழைப்போடு இணைந்த முறை/முன்னேற்றத்தைச் சுட்டுகிறது; தமிழில் இயல்புக்காக கூட்டு ஊக்கவுரை வடிவில் தரப்பட்டாலும் நிறைவு நோக்கம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கடிதநடை பயன்படுத்தப்பட்டுள்ளது. ‘அன்புக்குரியவர்களே’, ‘தீட்டு’, ‘தூய்மைப்படுத்துதல்’ ஆகியவை அன்பு, தூய்மை, பரிசுத்தம் என்ற மூலத்தின் சொற்பிணைப்பை காக்கின்றன. ‘மாம்சம்’ மற்றும் ‘பயம்’ ஆகிய வலிமையான வேதாகமச் சொற்கள் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
