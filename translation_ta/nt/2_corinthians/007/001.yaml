revisions:
- from: ஆகவே, அன்புக்குரியவர்களே, இந்த வாக்குறுதிகளைப் பெற்றுள்ள நாம், மாம்சத்திலும் ஆவியிலும்[a] உள்ள எல்லாத் தீட்டிலிருந்தும் நம்மைத் தூய்மைப்படுத்திக்கொண்டு, கடவுளுக்குப் பயந்து[c] பரிசுத்தத்தை முழுநிறைவுக்குக் கொண்டுவருவோமாக[b].
  to: ஆகவே, அன்புக்குரியவர்களே, இந்த வாக்குறுதிகளைப் பெற்றுள்ள நாம், மாம்சத்தினதும் ஆவியினதும்[a] எல்லாத் தீட்டிலிருந்தும் நம்மைத் தூய்மைப்படுத்துவோமாக; கடவுளுக்குப் பயந்து[c] பரிசுத்தத்தை முழுநிறைவுக்குக் கொண்டுவருவோமாக[b].
  rationale: The revision corrects the genitive relationship between ‘defilement’ and ‘flesh and spirit’ and gives the Greek main hortatory verb, ‘let us cleanse ourselves,’ an unambiguous Tamil hortatory form. The flesh/spirit ambiguity and the full force of fear of God are retained.
