  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: ta
  text: எல்லா வகையிலும் உங்கள்மீது எனக்கு நம்பிக்கை இருக்கிறது என்பதில் மகிழ்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா வகையிலும் உங்கள்மீது எனக்கு நம்பிக்கை இருப்பதால் மகிழ்கிறேன்.”
    reason: ὅτι என்பதை மகிழ்ச்சியின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாக அல்லாமல் காரணத்தைக் குறிக்கிறதாகவும் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: χαίρω
  choice: மகிழ்கிறேன்
  rationale: நிகழ்கால வினையின் நேரடியான வலிமையையும் கண்ணியமான தொனியையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ὅτι
  choice: இருப்பதால்
  rationale: இங்கு ὅτι மகிழ்ச்சிக்கான காரணமாகவும் அதன் உள்ளடக்கமாகவும் புரிந்துகொள்ளப்படலாம். தமிழில் இயல்பான முதன்மை வாசிப்பாக காரணத் தொடர்பு தரப்பட்டுள்ளது; மாற்று அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐν παντί
  choice: எல்லாவற்றிலும்
  rationale: கிரேக்கத்தின் விரிவான, முழுமையான எல்லையைப் பாதுகாக்கிறது; ‘எல்லா வகையிலும்’ என்பதும் சூழலுக்கேற்ற சாத்தியமான மொழிபெயர்ப்பு.
- source_word: θαρρῶ
  choice: நம்பிக்கையுடன் இருக்கிறேன்
  rationale: இச்சூழலில் கொரிந்தியர்களைக் குறித்த பவுலின் உறுதியான நம்பிக்கையை இயல்பாக வெளிப்படுத்துகிறது; ‘துணிவுகொள்கிறேன்’ என்ற சாத்திய பொருள் இங்கு குறைவாகப் பொருந்துகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்கள்மேல்
  rationale: நபர்களிடத்தில் வைக்கப்படும் நம்பிக்கையைத் தமிழில் இயல்பாகக் குறிக்கிறது; கிரேக்க ἐν என்பதன் உறவுசார் வலிமையையும் தக்கவைக்கிறது.
