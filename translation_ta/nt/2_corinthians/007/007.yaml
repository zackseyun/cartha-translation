source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: ta
  text: அவனுடைய வருகையினால்[a] மட்டுமல்ல, உங்களால் அவன் பெற்ற ஆறுதலினாலும்[b] நாங்கள் ஆறுதலடைந்தோம். என்மீது உங்களுக்கு இருந்த ஏக்கத்தையும், உங்கள் துயரத்தையும்[c], எனக்காக நீங்கள் கொண்டிருந்த ஆர்வத்தையும் அவன் எங்களுக்குத் தெரிவித்ததால், நான் இன்னும் அதிகமாக மகிழ்ந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய உடனிருப்பினால்.’
    reason: lexical_alternative
  - marker: b
    text: ‘ஆறுதல்’ என்பதற்குப் பதிலாக இங்கும் தொடர்புடைய வினைச்சொல்லிலும் ‘ஊக்கம்’ என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உங்கள் புலம்பலையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: வருகை
  rationale: தீத்துவின் பயணச் சூழலில் இச்சொல் அவரது வந்து சேர்ந்த நிகழ்வைக் குறிக்கிறது; ‘வருகை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: παρακλήσει / παρεκλήθη
  choice: ஆறுதல் / ஆறுதல் பெற்ற
  rationale: பெயர்ச்சொல்–வினைச்சொல் உறவைத் தமிழில் இயன்றவரை தக்கவைத்து, துன்பத்திற்குப் பிந்தைய மனத்தேற்றத்தை வெளிப்படுத்துகிறது.
- source_word: ἐφ’ ὑμῖν
  choice: உங்களால்
  rationale: கொரிந்தியர்களின் நிலையும் பதிலும் தீத்துவுக்கு ஆறுதல் அளித்ததைச் சுருக்கமாக வெளிப்படுத்துகிறது; ‘உங்களைக் குறித்து’ என்பதும் சாத்தியம்.
- source_word: ἀναγγέλλων
  choice: தெரிவித்ததால்
  rationale: தீத்து அவர்களுடைய மனநிலையைப் பவுலுக்கு அறிவித்ததையும், அதனால் பவுல் மேலும் மகிழ்ந்த விளைவையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: ἐπιπόθησιν
  choice: ஏக்கம்
  rationale: வலுவான ஆவலையும் காண விரும்பும் உள்ளுணர்வையும் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: ὀδυρμόν
  choice: துயரம்
  rationale: வருத்தத்தையும் அதன் வெளிப்பாட்டையும் வாசிக்க எளிய நவீன தமிழில் தெரிவிக்கிறது; ‘புலம்பல்’ மூலச்சொல்லின் வெளிப்படையான புலம்பல் நுணுக்கத்தை அதிகமாகக் காட்டும்.
- source_word: ζῆλον
  choice: ஆர்வம்
  rationale: இங்கு பவுலுக்காக அவர்கள் கொண்டிருந்த தீவிர அக்கறையை இயல்பான தமிழில் காட்டுகிறது; ‘வைராக்கியம்’ பொதுவாசகருக்கு வேறு பொருளைத் தூண்டக்கூடும்.
- source_word: ὑπὲρ ἐμοῦ
  choice: எனக்காக
  rationale: பவுலை நோக்கிய ஆதரவும் அக்கறையும் என்ற பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: நான் இன்னும் அதிகமாக மகிழ்ந்தேன்
  rationale: விளைவையும் μᾶλλον என்பதன் ஒப்பீட்டு வலிமையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐφ’ ὑμῖν என்பதன் தொடர்பு
  choice: உங்களால்
  alternative: உங்களைக் குறித்து / உங்களினால் ஏற்பட்ட
  rationale: இலக்கணத்தில் காரணம், சந்தர்ப்பம், அல்லது தொடர்பு என்ற நுணுக்கங்கள் சாத்தியம். முதன்மை உரை கொரிந்தியர்களிடமிருந்து தீத்து பெற்ற ஆறுதலைக் காட்டுகிறது; குறிப்பில் மாற்றுப் பொருள் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிய நடையில் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் நீளத்தை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம். முதல் வாக்கியத்தில் சூழலால் தெளிவாக உள்ள ‘நாங்கள் ஆறுதலடைந்தோம்’ என்பது முந்தைய வசனத்திலிருந்து நிரப்பப்பட்டுள்ளது.
