base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: ta
  text: ஆனால் தாழ்ந்தவர்களுக்கு[a] ஆறுதல் அளிக்கிற கடவுள், தீத்தின் வருகையினால்[b] எங்களுக்கு ஆறுதல் அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனம் தளர்ந்தவர்களுக்கு” அல்லது “தாழ்நிலையில் இருப்பவர்களுக்கு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தீத்தின் உடனிருப்பின் மூலம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட துன்பங்களுக்கும் இங்கு கடவுள் அளித்த ஆறுதலுக்கும் இடையிலான முரண்பாட்டைக் குறிக்கும் இயல்பான இணைப்புச்சொல்.
- source_word: ὁ παρακαλῶν
  choice: ஆறுதல் அளிக்கிற
  rationale: கடவுளின் வழக்கமான செயலைக் குறிப்பிடும் நிகழ்காலப் பெயரெச்சத்தின் பொருளைத் தருகிறது; பின்னர் வரும் παρεκάλεσεν என்பதுடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: τοὺς ταπεινοὺς
  choice: தாழ்ந்தவர்களுக்கு
  rationale: சூழ்நிலையால் தாழ்த்தப்பட்டவர்கள், தாழ்நிலையில் இருப்பவர்கள், அல்லது மனம் தளர்ந்தவர்கள் ஆகிய பொருள் நிழல்களை முற்றிலும் ஒன்றாகக் குறுக்காமல் காக்கும் சுருக்கமான தமிழ் நடை.
- source_word: παρεκάλεσεν
  choice: ஆறுதல் அளித்தார்
  rationale: துன்பத்தின் நடுவில் கிடைத்த தேற்றத்தை இயல்பாக வெளிப்படுத்துவதோடு, ὁ παρακαλῶν என்பதுடனான மீளுரைப்பையும் காக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: செயலைச் செய்தவர் கடவுளே என்பதைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் காட்டுகிறது.
- source_word: ἐν τῇ παρουσίᾳ Τίτου
  choice: தீத்து வந்ததால்
  rationale: παρουσία இங்கு தீத்தின் வருகையையோ அவர் வந்து சேர்ந்திருப்பதையோ குறிக்கலாம். நிகழ்வுச் சார்ந்த பொருளை இயல்பான தமிழில் முதன்மைப்படுத்துகிறது; ‘உடனிருப்பு’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: τοὺς ταπεινοὺς என்பதன் சூழல்சார் பொருள்
  choice: தாழ்ந்தவர்கள்
  alternative: மனம் தளர்ந்தவர்கள்; தாழ்நிலையில் இருப்பவர்கள்
  rationale: இச்சொல் உள்ளார்ந்த தாழ்மையை மட்டும் அல்லாமல், துன்பத்தால் தாழ்த்தப்பட்ட நிலையையும் குறிக்கக்கூடும். பிரதான உரை இந்தப் பரந்த பொருளை வைத்திருக்கிறது; அடிக்குறிப்பு சூழலுக்கு ஏற்ற மாற்றுப் பொருள்களைத் தருகிறது.
- issue: ἐν τῇ παρουσίᾳ என்பதன் பொருள்
  choice: வந்ததால்
  alternative: உடனிருந்ததன் மூலம்
  rationale: சூழலில் தீத்து வந்து சேர்ந்த நிகழ்வு ஆறுதலுக்கான வழியாக உள்ளது. ஆயினும் παρουσία என்பது ‘உடனிருப்பு’ என்றும் பொருள்படக்கூடும் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. παρακαλέω என்ற ஒரே வேர்ச்சொல்லின் மீளுரைப்பை ‘ஆறுதல் அளிக்கிற / ஆறுதல் அளித்தார்’ என்று வெளிப்படையாகக் காத்துள்ளோம். எல்லா அடிக்குறிப்பு குறிகளும் உரிய சொற்றொடர்களுக்குப் பின் பிரதான உரையில் இடம்பெற்றுள்ளன.
