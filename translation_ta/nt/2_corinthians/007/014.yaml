source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: ta
  text: ஏனெனில், உங்களைப் பற்றி நான் அவனிடம் ஏதேனும் பெருமைபாராட்டியிருந்தால், நான் வெட்கத்துக்கு ஆளாகவில்லை. மாறாக, நாங்கள் உங்களிடம் எல்லாவற்றையும் உண்மையோடு பேசியதுபோலவே, தீத்துவிடம் நாங்கள் பெருமைபாராட்டியதும்[a] உண்மையெனத் தெரியவந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீத்துவின் முன்னிலையில் நாங்கள் பெருமைபாராட்டியதும்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொற்றொடர் ‘தீத்துவிடம்’ அல்லது ‘தீத்துவின் முன்னிலையில்’ எனப் பொருள்படலாம்; சூழலில், கொரிந்தியரைப் பற்றி பவுல் தீத்துவிடம் கூறியதையே இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκαύχημαι
  choice: பெருமையாகப் பேசியிருந்தாலும்
  rationale: καυχάομαι என்பதன் ‘பெருமைபாராட்டுதல்/பெருமையாகப் பேசுதல்’ என்ற வலிமையைத் தக்கவைத்தபடியே, நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது; சூழல் இதைத் தீய அகந்தையாக அல்ல, கொரிந்தியரைப் பற்றிய நம்பிக்கையான பாராட்டாகக் காட்டுகிறது.
- source_word: οὐ κατῃσχύνθην
  choice: நான் வெட்கத்துக்கு ஆளாகவில்லை
  rationale: 'செயப்பாட்டு வடிவத்தின் வெளிப்புற விளைவைத் தக்கவைக்கிறது: பவுலின் பெருமையான பேச்சு பொய்யென்று வெளிப்பட்டு அவரை வெட்கப்படுத்தவில்லை.'
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν
  choice: நாங்கள் உங்களிடம் எல்லாவற்றையும் உண்மையோடு பேசியது
  rationale: πάντα என்பதன் விரிவான பொருளையும், ἐν ἀληθείᾳ என்பதன் முறையைக் குறிக்கும் பொருளையும் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἡ καύχησις ἡμῶν
  choice: நாங்கள் பெருமையாகப் பேசியது
  rationale: முன்னுள்ள καυχάομαι என்ற வினையோடு சொற்பொருள் தொடர்பைத் தக்கவைக்கிறது; தமிழில் கடினமான பெயர்ச்சொல் அமைப்பைத் தவிர்த்து இயல்பான வினைச்சொல் சார்ந்த அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἡ ἐπὶ Τίτου
  choice: தீத்துவிடம்
  rationale: சூழலில், கொரிந்தியரைப் பற்றி பவுல் தீத்துவிடம் கூறியதையே குறிக்கிறது. ἐπί + genitive அமைப்பிலுள்ள சிறு தெளிவின்மையை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: ἀλήθεια ἐγενήθη
  choice: உண்மையென நிரூபணமானது
  rationale: ‘உண்மையாக ஆனது’ என்ற சொற்சொல் வடிவத்தைவிட, பவுல் கூறியது நிகழ்வுகளால் உண்மையென்று தெரியவந்தது என்ற இடியோமிய பொருளை இயல்பாகத் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துக்கான விளக்கத்தை அறிமுகப்படுத்தும் உரையோட்டத்தைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: பவுலின் ‘பெருமையாகப் பேசுதல்’ என்பதன் தன்மை
  choice: சொல்லின் வலிமையைத் தக்கவைத்து ‘பெருமையாகப் பேசுதல்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: எதிர்மறைத் தொனியைத் தவிர்க்க ‘நம்பிக்கை தெரிவித்தல்’ அல்லது ‘பாராட்டிப் பேசுதல்’ என்று மென்மையாக்குதல்.
  rationale: பவுலின் பயன்பாட்டில் καυχάομαι/καύχησις என்பது அகந்தையை மட்டுமல்ல, ஒருவரைப் பற்றிய நியாயமான பெருமையையும் நம்பிக்கையான பாராட்டையும் குறிக்கலாம். எந்த மதப்பிரிவுச் சார்ந்த விளக்கத்தையும் சேர்க்காமல், சூழலே அதன் நேர்மையான தன்மையைத் தீர்மானிக்க விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவன்’ என்பது முந்தைய சூழலில் குறிப்பிடப்பட்ட தீத்துவைக் குறிக்கிறது; மூலத்தின் பிரதிப்பெயர் அமைப்பு தக்கவைக்கப்பட்டுள்ளது. ‘எப்படியோ… அப்படியே’ என்ற ஒப்புமை ‘போலவே’ மூலம் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்தப்பட்டுள்ளது.
