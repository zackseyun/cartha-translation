revisions:
- from: ஏனெனில், உங்களைப் பற்றி நான் அவனிடம் ஏதாவது பெருமையாகப் பேசியிருந்தாலும், நான் வெட்கத்துக்கு ஆளாகவில்லை. மாறாக, நாங்கள் உங்களிடம் எல்லாவற்றையும் உண்மையோடு பேசியதுபோலவே, தீத்துவிடம் நாங்கள் பெருமையாகப் பேசியதும்[a] உண்மையென நிரூபணமானது.
  to: ஏனெனில், உங்களைப் பற்றி நான் அவனிடம் ஏதேனும் பெருமைபாராட்டியிருந்தால், நான் வெட்கத்துக்கு ஆளாகவில்லை. மாறாக, நாங்கள் உங்களிடம் எல்லாவற்றையும் உண்மையோடு பேசியதுபோலவே, தீத்துவிடம் நாங்கள் பெருமைபாராட்டியதும்[a] உண்மையெனத் தெரியவந்தது.
  rationale: The revision retains the meaning and ambiguity of the Greek while using a direct Tamil conditional, a consistent rendering for the boast word group, and an idiomatic expression for the boast being shown true. The footnote continues to preserve the possible nuance of ἐπὶ Τίτου.
