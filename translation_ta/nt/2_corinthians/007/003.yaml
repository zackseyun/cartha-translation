source:
  edition: SBLGNT
  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: ta
  text: உங்களைக் குற்றவாளிகளாகத் தீர்ப்பதற்காக நான் இதைச் சொல்லவில்லை[a]. ஏனெனில், ஒன்றாகச் சாகவும் ஒன்றாக வாழவும் நீங்கள் எங்கள் இதயங்களில் இருக்கிறீர்கள் என்று நான் முன்பே சொல்லியிருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தண்டனைத் தீர்ப்புக்காக’ அல்லது ‘குற்றம் சாட்டித் தீர்ப்பளிக்கும் நோக்கத்துடன்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒன்றாகச் சாகவும் ஒன்றாக வாழவும் நீங்கள் எங்கள் இதயங்களில் இருக்கிறீர்கள்.’ கிரேக்க மொழி மரணத்திலும் வாழ்விலும் பகிர்ந்த ஆழ்ந்த ஒற்றுமையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: கண்டனம் செய்வதற்காக
  rationale: πρός + இறந்தகால வேற்றுமை இங்கு நோக்கம் அல்லது இலக்கை உணர்த்துகிறது. ‘கண்டனம் செய்வதற்காக’ என்பது பவுலின் சொற்கள் கொரிந்தியரைத் தீர்ப்புக்குள்ளாக்கும் நோக்கமுடையவை அல்ல என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: λέγω
  choice: நான் இதைச் சொல்லவில்லை
  rationale: நிகழ்கால λέγω என்பதற்கு ‘நான் சொல்லவில்லை’ இயல்பான மொழிபெயர்ப்பு; முந்தைய கூற்றைக் குறிக்கச் சூழலிலிருந்து ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: προείρηκα
  choice: முன்பே சொல்லியிருக்கிறேன்
  rationale: முன்னர் கூறப்பட்டதும் இப்போதும் பொருந்துவதுமான நிறைவேற்றுக் காலத்தின் வலிமையை ‘சொல்லியிருக்கிறேன்’ தக்கவைக்கிறது.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: நீங்கள் எங்கள் இதயங்களில் இருக்கிறீர்கள்
  rationale: கிரேக்கத்தின் பன்மையான ‘இதயங்கள்’ தக்கவைக்கப்படுகிறது; இது பவுலும் அவருடைய உடன் ஊழியர்களும் கொண்ட ஆழ்ந்த அன்பையும் உள்ளார்ந்த பற்றையும் குறிக்கிறது.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: சாவிலும் வாழ்விலும் ஒன்றாயிருக்கும்படி
  rationale: εἰς + பெயராக்கப்பட்ட வினையெச்சத் தொடர் நோக்கம்/விளைவு சார்ந்த உறவைத் தருகிறது. συν- முன்னொட்டின் பகிர்ந்த ஒற்றுமையை ‘ஒன்றாயிருக்கும்படி’ வெளிப்படுத்துகிறது; மரணம்–வாழ்வு இணை அமைப்பும் தக்கவைக்கப்படுகிறது.
- source_word: συναποθανεῖν
  choice: சாவிலும் ஒன்றாயிருக்க
  rationale: συν- முன்னொட்டு மரணத்திலும் பகிர்ந்துகொள்ளும் ஆழ்ந்த ஒற்றுமையை வலியுறுத்துகிறது.
- source_word: συζῆν
  choice: வாழ்விலும் ஒன்றாயிருக்க
  rationale: συναποθανεῖν என்பதுடன் இணையான அமைப்பில், வாழ்விலும் தொடரும் பகிர்ந்த ஒற்றுமையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘ஒன்றாகச் சாகவும் ஒன்றாக வாழவும்’ என்ற மொழியை உடன்படிக்கை, திருமணம் அல்லது கிறிஸ்துவுடனான ஒன்றிப்பு எனத் திட்டவட்டமாக விளக்க வேண்டுமா?
  choice: குறுகிய இறையியல் வகைப்பாட்டைச் சேர்க்காமல், மரணத்திலும் வாழ்விலும் பகிர்ந்த ஆழ்ந்த உறுதியையும் ஒற்றுமையையும் தக்கவைத்தல்
  alternative: இதை உடன்படிக்கை விசுவாசம் அல்லது கிறிஸ்துவில் பங்குபெறுதல் குறித்த குறிப்பாக வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: இவ்வசனம் பவுலுக்கும் கொரிந்தியருக்கும் இடையிலான ஆழ்ந்த அன்பையும் நிலையான ஒற்றுமையையும் தெளிவாகக் காட்டுகிறது; ஆனால் அதற்கு ஒரு தொழில்நுட்ப இறையியல் வகையை மூலவசனம் குறிப்பிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘கண்டனம்’ நீதித்தீர்ப்புச் சார்ந்த κατάκρισις என்பதன் வலிமையைத் தக்கவைக்கிறது. ‘இதயங்களில்’ என்ற பன்மை மூலத்தின் இலக்கணத்தையும் பவுல் மற்றும் அவருடைய உடன் ஊழியர்களின் கூட்டுக் குரலையும் காக்கிறது. முதன்மை உரையில் இயல்பான தமிழ் ஓட்டத்திற்காக ‘சாவிலும் வாழ்விலும் ஒன்றாயிருக்கும்படி’ பயன்படுத்தப்பட்டு, அதிக வடிவநெருக்கமுள்ள மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
