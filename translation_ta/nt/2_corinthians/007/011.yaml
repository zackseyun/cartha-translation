revisions:
- from: ஏனெனில் பாருங்கள், கடவுளுக்கு ஏற்றபடி நீங்கள் அடைந்த இந்தத் துயரமே[a] உங்களில் எவ்வளவு அக்கறையை உருவாக்கியது! அதுமட்டுமல்ல, தன்னிலை விளக்கத்தையும்[b], மனக்கொதிப்பையும், அச்சத்தையும், ஏக்கத்தையும், ஆர்வத்தையும், நீதியை நிலைநாட்டும் நடவடிக்கையையும்[c] உருவாக்கியது. இந்த விவகாரத்தில் நீங்கள் எல்லா வகையிலும் தூயவர்களாக இருப்பதை நிரூபித்தீர்கள்.
  to: ஏனெனில் பாருங்கள், கடவுளுக்கு ஏற்றபடி நீங்கள் அடைந்த இந்தத் துயரமே[a] உங்களில் எவ்வளவு தீவிர அக்கறையை உருவாக்கியது! மேலும், தங்கள் தரப்பை விளக்கிக்கொள்ளுதலையும்[b], மேலும் மனக்கொதிப்பையும், மேலும் அச்சத்தையும், மேலும் ஏக்கத்தையும், மேலும் ஆர்வத்தையும், மேலும் நீதி வழங்குதலையும்[c] உருவாக்கியது. இந்த விவகாரத்தில் நீங்கள் குற்றமற்றவர்கள் என்பதை எல்லா வகையிலும் நிரூபித்தீர்கள்.
  rationale: The revision removes an interpretive expansion of ἐκδίκησις, more consistently represents the source’s repeated list markers, and renders the final matter-specific claim as freedom from blame. It otherwise retains the draft’s sound treatment of the grammatical and theological openness of the verse.
