id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: ta
  text: ஏனெனில் பாருங்கள், கடவுளுக்கு ஏற்றபடி நீங்கள் அடைந்த இந்தத் துயரமே[a] உங்களில் எவ்வளவு தீவிர அக்கறையை உருவாக்கியது! மேலும், தங்கள் தரப்பை விளக்கிக்கொள்ளுதலையும்[b], மேலும் மனக்கொதிப்பையும், மேலும் அச்சத்தையும், மேலும் ஏக்கத்தையும், மேலும் ஆர்வத்தையும், மேலும் நீதி வழங்குதலையும்[c] உருவாக்கியது. இந்த விவகாரத்தில் நீங்கள் குற்றமற்றவர்கள் என்பதை எல்லா வகையிலும் நிரூபித்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுக்கேற்ற இந்தத் துயரம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களை நீங்கள் குற்றச்சாட்டிலிருந்து விடுவித்துக்கொண்டதையும்.”
    reason: lexical_alternative
  - marker: c
    text: இச்சொல் “தண்டனை,” “நீதி,” அல்லது “பழிதீர்த்தல்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: ஏனெனில் பாருங்கள்
  rationale: γάρ என்பதன் காரணவிளக்கத் தொடர்பையும் ἰδού என்பதன் கவன ஈர்ப்பையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: கடவுளுக்கு ஏற்றபடி நீங்கள் அடைந்த இந்தத் துயரம்
  rationale: λυπηθῆναι என்பதைக் பெயர்ச்சொல் வடிவில் இயல்பாகத் தருகிறது; κατὰ θεόν என்பதை வெறும் ‘தெய்வீகத் துயரம்’ என்று விளக்கிவிடாமல், கடவுளோடு ஒத்திசைவைக் குறிக்கும் திறந்த சொற்றொடராகப் பாதுகாக்கிறது.
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: உங்களில் எவ்வளவு அக்கறையை உருவாக்கியது
  rationale: κατεργάζομαι என்பதன் விளைவை உண்டாக்குதல் என்ற பொருளையும் σπουδή என்பதன் தீவிரமான பொறுப்புணர்வையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀλλὰ
  choice: அதுமட்டுமல்ல
  rationale: மீண்டும் மீண்டும் வரும் ἀλλά இங்கு எதிர்மறை முரண்பாட்டைவிடச் சேர்த்துக் குவிக்கும் வலியுறுத்தலைக் கொண்டுள்ளது; தமிழில் இந்தச் சொல் அந்தச் சொல்லாட்சியைச் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: ἀπολογίαν
  choice: தன்னிலை விளக்கம்
  rationale: தங்கள் நிலைப்பாட்டையும் குற்றத்தில் தங்கள் பங்கின்மையையும் விளக்கும் பதிலைச் சுட்டுகிறது; சட்டத்துறைச் சொல்லாடலைத் தவிர்த்து பொதுவாசகருக்குப் புரியும் வகையில் தரப்பட்டுள்ளது.
- source_word: ἀγανάκτησιν
  choice: மனக்கொதிப்பு
  rationale: தவறைக் குறித்த வலுவான ஒழுக்கக் கோபத்தை இயல்பான தமிழில் தெரிவிக்கிறது; அதன் இலக்கை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: φόβον
  choice: அச்சம்
  rationale: அச்சத்தின் காரணமோ இலக்கோ கிரேக்கத்தில் கூறப்படாததால், அதைத் திறந்த நிலையிலேயே வைத்திருக்கிறது.
- source_word: ἐπιπόθησιν
  choice: ஏக்கம்
  rationale: மீண்டும் உறவை நாடும் தீவிர விருப்பமாக இருக்கக்கூடிய ஆழ்ந்த வாஞ்சையை, அதன் இலக்கைத் தீர்மானிக்காமல் தருகிறது.
- source_word: ζῆλον
  choice: ஆர்வம்
  rationale: σπουδή என்பதற்குப் பயன்படுத்திய ‘அக்கறை’யிலிருந்து வேறுபடுத்தி, தீவிர முனைப்பைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: ἐκδίκησιν
  choice: நீதியை நிலைநாட்டும் நடவடிக்கை
  rationale: தனிப்பட்ட பழிவாங்கல் என்று குறுக்கிவிடாமல், தவறை எதிர்கொண்டு நீதியைச் செயல்படுத்தும் தீர்மானமான பதிலை வெளிப்படுத்துகிறது.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς
  choice: நீங்கள் எல்லா வகையிலும் ... இருப்பதை நிரூபித்தீர்கள்
  rationale: συνίστημι என்பதன் இங்குள்ள சான்றுகாட்டும் பொருளையும் ἐν παντί என்பதன் முழுமையான சுருக்கத்தையும் இயல்பாகத் தருகிறது.
- source_word: ἁγνοὺς εἶναι τῷ πράγματι
  choice: இந்த விவகாரத்தில் ... தூயவர்களாக இருப்பதை
  rationale: ἁγνός என்பதன் தூய்மை/குற்றத்தில் பங்கின்மை என்ற ஒழுக்கப் பொருளை வைத்துக்கொண்டு, τῷ πράγματι என்பதை குறிப்பிட்ட விவகாரத்துடனான தொடர்பாகத் தருகிறது.
theological_decisions:
- issue: κατὰ θεόν என்பதன் பொருள்
  choice: கடவுளுக்கு ஏற்றபடி
  alternative: கடவுளுக்கேற்ற / தெய்வபக்திக்குரிய
  rationale: துயரம் கடவுளின் அளவுகோலுக்கு அல்லது நோக்கத்துக்கு ஏற்ப இருப்பதைக் காட்டுகிறது; ‘தெய்வீகமானது’ என்று அதன் தன்மையை மட்டும் நிர்ணயிக்காமல் மூலத்தின் உறவுசார் சொல்லாட்சியைப் பாதுகாக்கிறது.
- issue: ἐκδίκησις என்பதன் மனந்திரும்புதல் சூழலிலான நுட்பம்
  choice: நீதியை நிலைநாட்டும் நடவடிக்கை
  alternative: தண்டனை / பழிவாங்குதல் / நீதி வழங்குதல்
  rationale: கொரிந்தியர்கள் தவறைத் தீவிரமாக எதிர்கொண்டதைக் குறிக்கிறது; தனிப்பட்ட பழிவாங்கலை ஆதரிப்பதாக ஆக்காமல், தண்டனைக்குரிய நுட்பத்தையும் முற்றிலும் அழிக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: ἁγνούς என்பதன் பொருள்
  choice: தூயவர்கள்
  alternative: குற்றமற்றவர்கள்
  rationale: சொல்லின் ஒழுக்கத் தூய்மை சார்ந்த பரப்பைத் தக்கவைக்கிறது; இவ்விவகாரத்தில் உடந்தையல்லாதவர்கள் என்ற சூழல்சார் பொருள் வாசகத்தால் தெளிவாகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதேவேளையில் பவுலின் தீவிரமான பட்டியல் நடையையும் கண்ணியத்தையும் காக்கும் பதிவு பயன்படுத்தப்பட்டுள்ளது. மீள்மீளும் ἀλλά-வின் குவிப்பு ஒரே ‘அதுமட்டுமல்ல’ மூலம் தொடங்கப்பட்டு, தொடர்ச்சியான ‘-ஐயும்’ அமைப்பால் தமிழில் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
