reference: 2 Corinthians 13:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: ta
  text: 'ஆண்டவராகிய இயேசு மெசியாவின்[a] அருளும், கடவுளின் அன்பும், தூய ஆவியின் ஐக்கியமும்[b] உங்கள் அனைவரோடும் இருப்பதாக.


    [a] அல்லது, மரபுவழக்கில், “ஆண்டவராகிய இயேசு கிறிஸ்துவின்.”


    [b] அல்லது, “தூய ஆவியுடனான ஒன்றிப்பு” அல்லது “தூய ஆவியில் பங்கேற்பு.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபுவழக்கில், “ஆண்டவராகிய இயேசு கிறிஸ்துவின்.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தூய ஆவியுடனான ஒன்றிப்பு” அல்லது “தூய ஆவியில் பங்கேற்பு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்துரைகளில் வரும் இச்சொல்லின் இறையியல் செறிவையும், இயல்பான நவீனத் தமிழ் வழக்கையும் ‘அருள்’ காக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: இங்கு இயேசுவுக்குரிய பட்டமாக வரும் κύριος என்பதற்கு இயல்பான, மரியாதைமிக்க தமிழ் இணைச்சொல்.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு பெயரின் ஒரு பகுதியாக மட்டும் அல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பட்டமாகச் செயல்படுகிறது; ஆகவே அதன் பட்டப்பொருள் முதன்மை உரையில் வெளிப்படுத்தப்படுகிறது.
- source_word: ἀγάπη
  choice: அன்பு
  rationale: சொல்லின் பரந்த உறவுசார் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: θεοῦ
  choice: கடவுளின்
  rationale: மூலத்தின் உடைமை வேற்றுமையைப் பேணி, இது ‘கடவுள் காட்டும் அன்பு’ என்று விளக்கி விரிவுபடுத்தாமல் அதன் இயல்பான தெளிவின்மையை நிலைநிறுத்துகிறது.
- source_word: κοινωνία
  choice: ஐக்கியம்
  rationale: உறவு, பகிர்வு, பங்கேற்பு ஆகிய ஒன்றோடொன்று தொடர்புடைய பொருள்களை முற்றிலும் ஒன்றாகக் குறுக்காமல் தாங்கக்கூடிய பரந்த தமிழ்ச் சொல்.
- source_word: ἁγίου πνεύματος
  choice: தூய ஆவி
  rationale: நவீனத் தமிழில் இயல்பாகவும் மரியாதையுடனும் தெய்வீக ஆவியைக் குறிக்கிறது.
- source_word: μετὰ πάντων ὑμῶν
  choice: உங்கள் அனைவரோடும் இருப்பதாக
  rationale: μετά என்பதன் உடனிருப்புப் பொருளையும் πάντων என்பதன் அனைவரையும் உள்ளடக்கும் வலியுறுத்தலையும் தெளிவாகப் பேணுகிறது; கிரேக்கத்தில் விடுபட்டுள்ள வாழ்த்துரை வினை தமிழில் இயல்பாக நிரப்பப்படுகிறது.
theological_decisions:
- issue: Χριστοῦ என்ற கிறிஸ்தியல் பட்டத்தை மொழிபெயர்த்தல்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός என்பதன் பட்டப்பொருளை ‘மெசியா’ வெளிப்படுத்துகிறது. பரவலாக நிலைபெற்ற மரபுவழி வடிவமான ‘கிறிஸ்து’ அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: κοινωνία τοῦ ἁγίου πνεύματος என்பதன் பொருள்
  choice: தூய ஆவியின் ஐக்கியம்
  alternative: தூய ஆவியுடனான ஒன்றிப்பு; தூய ஆவியில் பங்கேற்பு
  rationale: மூலத்தின் மரபுத்தொடர், ஆவியால் உண்டாகும் ஐக்கியம், ஆவியுடனான ஒன்றிப்பு, ஆவியில் பங்கேற்பு ஆகிய நெருங்கிய சாத்தியங்களை உடையது. ‘ஐக்கியம்’ அவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் இறையியல் பதற்றத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க வாழ்த்துரை நடை. ‘இருப்பதாக’ என்பது கிரேக்க வாழ்த்துரையில் உள்ள மறைமுக வினையை இயல்பாக வெளிப்படுத்துகிறது; ‘அனைவரோடும்’ என்பது πάντων என்பதன் வெளிப்படையான உள்ளடக்கத்தைப் பேணுகிறது.
