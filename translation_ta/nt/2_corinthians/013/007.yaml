source:
  edition: SBLGNT
  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: ta
  text: நீங்கள் எந்தத் தீமையும் செய்யாதிருக்கும்படி கடவுளிடம் வேண்டிக்கொள்கிறோம். நாங்கள் சோதனையில் தேறியவர்கள் என்று தோன்றுவதற்காக அல்ல; நீங்கள் நல்லதைச் செய்யும்படியாகவே, நாங்கள் சோதனையில் தேறாதவர்கள்போல் இருந்தாலும், வேண்டிக்கொள்கிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சோதனையில் தேறியவர்கள் / சோதனையில் தேறாதவர்கள்போல்” என்பதற்கு “ஏற்றுக்கொள்ளப்பட்டவர்கள் / ஏற்றுக்கொள்ளப்படாதவர்கள்போல்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ஒன்றுக்கொன்று எதிரான தொடர்புடைய சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கடைசிப் பகுதியை “நாங்கள் சோதனையில் தேறாதவர்கள் என்று தோன்றினாலும்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεὸν
  choice: கடவுளிடம் வேண்டிக்கொள்கிறோம்
  rationale: εὔχομαι இங்கு கடவுளை நோக்கிய வேண்டுதலைக் குறிக்கிறது; πρός + accusative அதன் திசையை வெளிப்படுத்துகிறது. δέ-யின் மென்மையான தொடர்ச்சி தமிழில் தனிச் சொல்லாகக் கட்டாயப்படுத்தப்படவில்லை.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: நீங்கள் எந்தத் தீமையும் செய்யாதிருக்க வேண்டும்
  rationale: κακὸν μηδέν வலியுறுத்தப்பட்ட முழுமையான எதிர்மறை; ‘எந்தத் தீமையும்’ என்பது அதன் ஒழுக்கநெறிசார் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν
  choice: நாங்கள் தகுதியுள்ளவர்கள் என்று தோன்ற வேண்டும் என்பதற்காக அல்ல
  rationale: οὐχ ἵνα மறுக்கப்படும் நோக்கத்தை அறிமுகப்படுத்துகிறது. δόκιμοι என்பது சோதிக்கப்பட்டு ஏற்றுக்கொள்ளப்பட்ட நிலையைச் சுட்டினாலும், φανῶμεν உடன் ‘தகுதியுள்ளவர்கள் என்று தோன்ற’ என்பது வெளிப்பார்வை சார்ந்த கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: ἵνα ὑμεῖς τὸ καλὸν ποιῆτε
  choice: நீங்கள் நல்லதைச் செய்ய வேண்டும் என்பதற்காகவே
  rationale: τὸ καλόν இங்கு ஒழுக்க ரீதியான நல்லதை அல்லது சரியானதைச் சுட்டுகிறது; ‘நல்லதைச் செய்ய’ என்பது இயல்பாகவும் விரிவைச் சுருக்காமலும் உள்ளது.
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: நாங்கள் தகுதியற்றவர்கள்போல் இருந்தாலும்
  rationale: ἀδόκιμοι என்பது δόκιμοι-க்கு நேரெதிரான, சோதனையில் ஏற்றுக்கொள்ளப்படாத நிலை. ὡς உருவாக்கும் ‘போல்’ என்ற நிழலையும், concessive சூழலையும் இந்த மொழிபெயர்ப்பு காக்கிறது; வெறும் தோற்றமா அல்லது உண்மையான மதிப்பீடா என்பதை முற்றிலும் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: ὡς ἀδόκιμοι என்பதில் பவுலின் சுயவிவரிப்பு
  choice: ‘நாங்கள் தகுதியற்றவர்கள்போல் இருந்தாலும்’ என்று மொழிபெயர்த்து, தோற்றம் அல்லது பிறரின் மதிப்பீடு என்ற வாய்ப்பைத் திறந்துவைத்தல்
  alternative: ‘நாங்கள் தகுதியற்றவர்கள் என்று தோன்றினாலும்’ அல்லது ‘நாங்கள் சோதனையில் தேறாதவர்களாக இருந்தாலும்’
  rationale: உடனடி சூழலில் δόκιμοι / ἀδόκιμοι என்ற எதிரிணை சோதனை மற்றும் அங்கீகாரத்தைச் சார்ந்தது. இறுதி ஆக்கினை அல்லது ஆன்மீக நிராகரிப்பு என்ற கோட்பாட்டை வசனத்துக்குள் இறக்குமதி செய்யாமல், மூலத்தின் உண்மையான பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடை. நீண்ட கிரேக்க வாக்கியத்தின் கருத்துத் தொடர்பைக் காத்தபடி தமிழில் இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. ‘அங்கீகரிக்கப்பட்டவர்கள்’ என்பதைக் காட்டிலும் இயல்பான ‘தகுதியுள்ளவர்கள்’ தேர்ந்தெடுக்கப்பட்டது; சோதனை சார்ந்த சொல் விளையாட்டு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
