review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal contrast and correctly preserves the qualified force of ὡς ἀδόκιμοι. However, “செய்யாதிருக்க வேண்டும்” reads primarily as an obligation (‘must not do’) rather than the content of Paul’s prayer. The paired terms δόκιμοι / ἀδόκιμοι are more specifically terms of testing and approval than general personal worthiness.
  naturalness: The current text is generally clear, but it repeats “வேண்டுகிறோம்” and makes the final purpose clause somewhat cumbersome. A single, naturally ordered Tamil sentence better retains the Greek rhetorical progression.
  terminology: “தகுதியுள்ளவர்கள் / தகுதியற்றவர்கள்” is understandable but weakens the tested-approved contrast. “சோதனையில் தேறியவர்கள் / சோதனையில் தேறாதவர்கள்போல்” preserves the related Greek terminology without importing doctrinal conclusions.
  issues:
  - severity: medium
    issue: “செய்யாதிருக்க வேண்டும்” can express obligation rather than the prayed-for outcome.
    rationale: 'The infinitive after εὐχόμεθα states what Paul prays God will bring about: that they do no evil. “செய்யாதிருக்கும்படி” more naturally expresses this in Tamil.'
  - severity: medium
    issue: The translation of δόκιμοι / ἀδόκιμοι as “தகுதியுள்ளவர்கள் / தகுதியற்றவர்கள்” underrepresents the testing-and-approval contrast.
    rationale: These related terms denote being approved after testing and not approved/failing the test. Using a matched Tamil pair preserves Paul’s wordplay and evaluative sense.
  - severity: low
    issue: The prayer verb is repeated unnecessarily.
    rationale: The Greek has one governing “we pray”; Tamil can retain all the purposive relationships more smoothly without repeating it.
  revised_text: நீங்கள் எந்தத் தீமையும் செய்யாதிருக்கும்படி கடவுளிடம் வேண்டிக்கொள்கிறோம். நாங்கள் சோதனையில் தேறியவர்கள் என்று தோன்றுவதற்காக அல்ல; நீங்கள் நல்லதைச் செய்யும்படியாகவே, நாங்கள் சோதனையில் தேறாதவர்கள்போல் இருந்தாலும், வேண்டிக்கொள்கிறோம்.[a]
