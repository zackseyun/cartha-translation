revisions:
- from: நீங்கள் எந்தத் தீமையும் செய்யாதிருக்க வேண்டும் என்று கடவுளிடம் வேண்டிக்கொள்கிறோம். நாங்கள் தகுதியுள்ளவர்கள் என்று தோன்ற வேண்டும் என்பதற்காக அல்ல; நாங்கள் தகுதியற்றவர்கள்போல் இருந்தாலும், நீங்கள் நல்லதைச் செய்ய வேண்டும் என்பதற்காகவே வேண்டுகிறோம்.[a]
  to: நீங்கள் எந்தத் தீமையும் செய்யாதிருக்கும்படி கடவுளிடம் வேண்டிக்கொள்கிறோம். நாங்கள் சோதனையில் தேறியவர்கள் என்று தோன்றுவதற்காக அல்ல; நீங்கள் நல்லதைச் செய்யும்படியாகவே, நாங்கள் சோதனையில் தேறாதவர்கள்போல் இருந்தாலும், வேண்டிக்கொள்கிறோம்.[a]
  rationale: The revision renders the prayer content without introducing an imperative-like obligation, restores the lexical relationship between δόκιμοι and ἀδόκιμοι, and retains the ambiguity of ὡς ἀδόκιμοι as characterization or appearance. The footnote continues to supply both the lexical alternative and the syntactical alternative.
