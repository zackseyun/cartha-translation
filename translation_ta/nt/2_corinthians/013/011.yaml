source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: ta
  text: இறுதியாக[a], சகோதரர்களே[b], மகிழுங்கள்; சீர்பெறுங்கள்[c]; ஊக்கம் பெறுங்கள்[d]; ஒரே எண்ணமுடையவர்களாய் இருங்கள்[e]; சமாதானமாக வாழுங்கள். அன்பின் தேவனும் சமாதானத்தின் தேவனும் உங்களோடு இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விடைபெறுங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் முடிவு வாழ்த்தாகப் பயன்படலாம்; ஆனால் இங்கு தொடர்ந்து வரும் அறிவுறுத்தல்களில் ஒன்றாக, ‘மகிழுங்கள்’ என்று பொருள்படுவது அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள ‘சகோதரர்களே’ என்பது சபை முழுவதையும் அழைப்பதால், ஆண்களையும் பெண்களையும் உள்ளடக்கியிருக்கலாம்.
    reason: cultural_note
  - marker: c
    text: ‘நிறைவாக்கப்படுங்கள்,’ ‘மீண்டும் சரியான நிலைக்குக் கொண்டுவரப்படுங்கள்,’ அல்லது ‘உங்களை ஒழுங்குபடுத்திக்கொள்ளுங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘ஊக்கத்தையோ அறிவுரையையோ ஏற்றுக்கொள்ளுங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: e
    text: சொல்லுக்குச் சொல், ‘ஒரே காரியத்தை எண்ணுங்கள்’; அதாவது, ‘ஒரே மனமுடையவர்களாய் இருங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: இறுதியாக
  rationale: கடிதம் முடிவை நோக்கிச் செல்வதைக் குறிக்கும் உரையாடல் இணைப்பாக இங்கு வருகிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கச் சொல்லின் ஆண்பால் பன்மை வடிவத்தைப் பேணுகிறது; அது முழுச் சபையையும் நோக்கிய அழைப்பு என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: χαίρετε
  choice: மகிழுங்கள்
  rationale: இது விடைபெறும் வாழ்த்தாகவும் அமையலாம்; ஆனால் தொடர்ச்சியான கட்டளைகளின் நடுவில் வருவதால் மகிழும்படியான அறிவுறுத்தலாக மொழிபெயர்க்கப்பட்டது.
- source_word: καταρτίζεσθε
  choice: சீர்ப்படுத்தப்படுங்கள்
  rationale: பழுதுபார்த்தல், சரியான நிலைக்குக் கொண்டுவருதல், நிறைவாக்குதல் ஆகிய பொருள் பரப்பை இது கொண்டுள்ளது; சபையின் குறைகள் திருத்தப்பட்டு உரிய நிலைக்கு வருவதை, பாவமற்ற பரிபூரணத்தை வலியுறுத்தாமல், இச்சொல் தெரிவிக்கிறது.
- source_word: παρακαλεῖσθε
  choice: ஊக்கம்பெறுங்கள்
  rationale: செயப்பாட்டு அல்லது தன்வினை நுணுக்கத்தோடு ஊக்கம், ஆறுதல், அறிவுரை ஆகியவற்றைப் பெற்றுக்கொள்ளுதல் என்று பொருள்படலாம்; இங்கு இயல்பான தமிழில் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: ஒரே எண்ணமுடையவர்களாய் இருங்கள்
  rationale: சொல்லுக்குச் சொல் ‘ஒரே காரியத்தை எண்ணுங்கள்’; தமிழில் சபையின் மனஒற்றுமையை இயல்பாக வெளிப்படுத்தும் அதேவேளையில் கட்டாயமான முழு கருத்தொற்றுமையை மிகைப்படுத்தவில்லை.
- source_word: εἰρηνεύετε
  choice: சமாதானமாக வாழுங்கள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ந்து நிலவும் சமாதானமான சமூக வாழ்வை வலியுறுத்துகிறது.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: அன்பு மற்றும் சமாதானத்தின் தேவன்
  rationale: இரு பெயர்ச்சொற்களையும் இணைக்கும் கிரேக்க உரிமைத் தொடர்பை நேரடியாகப் பேணுகிறது; தேவனை அன்பும் சமாதானமும் சார்ந்தவராகச் சித்தரிக்கிறது.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: உங்களோடு இருப்பார்
  rationale: எளிய எதிர்கால வாக்குறுதியை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: சபையை நோக்கிய ἀδελφοί என்பதன் உள்ளடக்கும் பொருள்
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று ஆண்பால் பன்மை வடிவத்தைப் பேணுதல்
  alternative: ‘சகோதர சகோதரிகளே’ அல்லது ‘உடன்பிறப்புகளே’
  rationale: மூலத்தின் இலக்கண வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது; அதேவேளையில் பவுல் ஆண்களையும் பெண்களையும் உள்ளடக்கிய முழுச் சபையையும் அழைக்கிறார் என்பதைக் குறிப்பு தெளிவுபடுத்துகிறது.
- issue: χαίρετε என்பது வாழ்த்தா அல்லது அறிவுறுத்தலா
  choice: ‘மகிழுங்கள்’ என்ற அறிவுறுத்தல்
  alternative: ‘விடைபெறுகிறேன்’ என்ற முடிவு வாழ்த்து
  rationale: இச்சொல் விடைபெறும் வாழ்த்தாக அமையக்கூடியதாக இருந்தாலும், இங்கு பல கட்டளைகளின் தொடரில் இருப்பதால் மகிழும்படியான அறிவுறுத்தல் என்ற வாசிப்பு அமைப்புக்கு நன்றாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: καταρτίζεσθε என்பதில் நிறைவாக்கமா அல்லது மீட்டுச் சீராக்கமா
  choice: ‘சீர்ப்படுத்தப்படுங்கள்’
  alternative: ‘நிறைவாக்கப்படுங்கள்’ அல்லது ‘சரியான நிலைக்குக் கொண்டுவரப்படுங்கள்’
  rationale: கொரிந்துச் சபையின் உறவுகளும் ஒழுங்கும் திருத்தப்பட வேண்டிய சூழலுக்கு சீராக்குதல் பொருந்துகிறது; இறையியல் ரீதியாகப் பாவமற்ற பரிபூரண நிலையை தேவையின்றி புகுத்துவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சபையில் வாசிக்க ஏற்ற கண்ணியமான கட்டளை நடையைப் பயன்படுத்துகிறது. தொடர்ச்சியான அறிவுறுத்தல்கள் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன. மூலத்தின் செயப்பாட்டு/தன்வினைத் தெளிவின்மையும் முக்கிய மாற்றுப் பொருள்களும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
