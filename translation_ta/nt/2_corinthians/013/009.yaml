reference: 2 Corinthians 13:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: ta
  text: 'ஏனெனில், நாங்கள் பலவீனமாகவும் நீங்கள் வலிமையுள்ளவர்களாகவும் இருக்கும்போது நாங்கள் மகிழ்கிறோம். இதுவும் நாங்கள் ஜெபிப்பது: உங்கள் சீரமைப்பு[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் முதிர்ச்சி” அல்லது “நீங்கள் முழுமையாக்கப்படுதல்.” கிரேக்கச் சொல் சீரமைத்தல், தகுதிப்படுத்தல், அல்லது உரிய நிலைக்குக் கொண்டுவருதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: மகிழ்கிறோம்
  rationale: நிகழ்கால வினையின் வலுவான நேர்மறை உணர்வை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்தை விளக்கும் இணைப்பைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: ὅταν
  choice: இருக்கும்போது
  rationale: இங்கு பொதுவான காலச்சூழலைக் குறிக்கிறது; ‘எப்போதெல்லாம்’ என்பதைவிட தமிழில் இயல்பாக உள்ளது.
- source_word: ἀσθενῶμεν
  choice: நாங்கள் பலவீனமாக
  rationale: உடல், சமூக நிலை, அல்லது வெளிப்படையான ஆற்றலின்மை ஆகியவற்றில் ஒன்றை மட்டும் குறிப்பதாகச் சுருக்காமல் மூலச்சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: δυνατοὶ
  choice: வலிமையுள்ளவர்களாக
  rationale: ‘பலவீனம்’ என்பதற்கு இயல்பான நேரெதிர்ச் சொல்லாக இருந்து பவுலின் முரணமைப்பைப் பாதுகாக்கிறது.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: என்பதற்காகவும் மன்றாடுகிறோம்
  rationale: εὔχομαι என்பதன் ஜெப வேண்டுதலை ‘மன்றாடுகிறோம்’ எனத் தருகிறது; καί-யின் ‘மேலும்/வும்’ வலியுறுத்தலும் தக்கவைக்கப்படுகிறது.
- source_word: κατάρτισιν
  choice: நீங்கள் சீர்ப்படுத்தப்பட வேண்டும்
  rationale: சரியான நிலைக்குக் கொண்டுவருதல், சீரமைத்தல், முழுமைப்படுத்துதல் ஆகிய பொருள் வாய்ப்புகளை உள்ளடக்கும் இயல்பான தமிழ்; பெயர்ச்சொல் அமைப்பு தமிழில் வினையெச்ச வேண்டுதலாக இயல்பாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: κατάρτισις குறிக்கும் பவுலின் மேய்ப்புப் பணிசார் நோக்கம்
  choice: நீங்கள் சீர்ப்படுத்தப்பட வேண்டும்
  alternative: நீங்கள் முதிர்ச்சி அடைய வேண்டும்; நீங்கள் முழுமைப்படுத்தப்பட வேண்டும்
  rationale: கொரிந்தியர்கள் சரியான நிலைக்குக் கொண்டுவரப்பட வேண்டும் என்ற சூழல்சார் பொருளை இது நன்றாகத் தருகிறது; அதேவேளையில் பாவமற்ற பரிபூரணத்தைக் குறித்த தொழில்நுட்பக் கோட்பாட்டை இறக்குமதி செய்யாது. பிற சாத்தியமான பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பலவீனம்—வலிமை’ என்ற சொல்லியல் முரண் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது; κατάρτισις என்பதன் உண்மையான பொருள் அகலம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
