  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: ta
  text: நீங்கள் விசுவாசத்தில் இருக்கிறீர்களா என்று உங்களையே சோதித்துப் பாருங்கள்[a]; உங்களையே ஆராய்ந்து பாருங்கள். இயேசு மெசியா உங்களுக்குள்[b] இருக்கிறார் என்பதை நீங்கள் உணரவில்லையா?—ஒருவேளை நீங்கள் சோதனையில் தேறாதவர்களாய் இருந்தால் தவிர.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விசுவாசத்தில்” என்பது கிறிஸ்தவ விசுவாசத்தில் நிலைத்திருப்பதையோ உண்மையான விசுவாசம் கொண்டிருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் நடுவில்.”
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: சோதித்துப் பாருங்கள்
  rationale: இங்கு சோதனை என்பது சோதித்தறிதலைக் குறிக்கிறது; சோதனைக்கு உள்ளாக்குதல் அல்லது தூண்டுதல் அல்ல. தம்முடைய நிலையை மதிப்பிடும் கட்டளையின் வலிமையை இது இயல்பாகத் தருகிறது.
- source_word: ἐν τῇ πίστει
  choice: விசுவாசத்தில்
  rationale: கிறிஸ்தவ விசுவாசத்தின் வட்டத்திற்குள் இருப்பதையும் உண்மையான தனிப்பட்ட விசுவாசம் கொண்டிருப்பதையும் குறிக்கக்கூடிய கிரேக்கத் தெளிவின்மையைத் தமிழ் சொற்றொடர் திறந்தே வைக்கிறது.
- source_word: δοκιμάζετε
  choice: ஆராய்ந்து பாருங்கள்
  rationale: πειράζετε என்பதற்கு அருகிய பொருள் இருந்தாலும், உண்மைத்தன்மை அல்லது ஏற்றுக்கொள்ளத்தக்க நிலையைத் தீர்மானிக்கக் கவனமாக ஆராயும் நுணுக்கத்தை வேறுபடுத்திக் காட்டுகிறது.
- source_word: ἐπιγινώσκετε
  choice: உணரவில்லையா
  rationale: வெறும் தகவலறிவை விடத் தெளிவாக அறிந்து உணர்வதைக் குறிக்கும் வினையை இயல்பான தமிழ் வினாவாக வழங்குகிறது.
- source_word: Ἰησοῦς Χριστός
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு பெயரைப் போன்ற நிலையான வடிவத்தைவிட பட்டமாக ஒலிப்பதால், அதன் மெசியத் தன்மையைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களுக்குள்
  rationale: தன்னாய்வு என்ற உடனடிச் சூழலில் கிறிஸ்துவின் உள்ளுறைதலை முதன்மையாகக் காட்டுகிறது; ‘உங்கள் நடுவில்’ என்ற கூட்டுத்தன்மையுள்ள சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰ μήτι
  choice: ஒருவேளை … இருந்தால் தவிர
  rationale: விதிவிலக்கைச் சற்று மென்மையான அல்லது மறைமுகமான வினாவுரையுடன் அறிமுகப்படுத்தும் கிரேக்கத் தொடரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἀδόκιμοί
  choice: சோதனையில் தேறாதவர்கள்
  rationale: முந்தைய சோதித்தல் மற்றும் ஆராய்தல் மொழியோடு நேரடியான தொடர்பை வைத்துக்கொண்டு, பிற்கால இறையியல் பாரம் கொண்ட சொல்லைத் தவிர்க்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அது இயேசுவின் பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என்று தரப்படுகிறது; ஒரு தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ἐν τῇ πίστει என்பதன் பொருள்
  choice: விசுவாசத்தில்
  alternative: உண்மையான தனிப்பட்ட விசுவாசத்தில் / கிறிஸ்தவ விசுவாசத்திற்குள்
  rationale: கிறிஸ்தவ விசுவாசத்தில் நிலைத்திருத்தல் மற்றும் உண்மையான விசுவாசம் கொண்டிருத்தல் ஆகிய இரு நுணுக்கங்களையும் மொழிபெயர்ப்பு முடிவு செய்யாமல் திறந்தே வைக்கிறது.
- issue: ἐν ὑμῖν என்பதன் பொருள்
  choice: உங்களுக்குள்
  alternative: உங்கள் நடுவில்
  rationale: தன்னாய்வு சூழல் உள்ளுறைதலை ஆதரிக்கிறது; எனினும் பன்மை ‘நீங்கள்’ காரணமாகக் கூட்டுத்தன்மையுள்ள வாசிப்பும் உண்மையான சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀδόκιμοί என்பதன் இறையியல் நுணுக்கம்
  choice: சோதனையில் தேறாதவர்கள்
  alternative: தகுதியற்றவர்கள் / நிராகரிக்கப்பட்டவர்கள்
  rationale: நித்திய நிராகரிப்பு போன்ற ஒரு குறிப்பிட்ட கோட்பாட்டு முடிவைச் சொற்றொடருக்குள் இறக்காமல், சோதனையில் நிலைக்காத நிலையைத் துல்லியமாகத் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பன்மை மரியாதையற்ற பொதுக் குழுவை நோக்கிய வேதாகம உரைநடைக்கு ஏற்ற கண்ணியமான கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘சோதித்துப் பாருங்கள் / ஆராய்ந்து பாருங்கள்’ என்ற இணைச்சொற்கள் கிரேக்கத்தின் இரு அருகிய வினைகளையும் இயல்பான தமிழில் வேறுபடுத்துகின்றன. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
