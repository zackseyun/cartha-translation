id: 2CO.13.10
reference: 2 Corinthians 13:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: ta
  text: இதனால்தான் நான் உங்களைவிட்டு தொலைவில் இருக்கும்போதே இவற்றை எழுதுகிறேன்; நான் உங்களோடு இருக்கும்போது, ஆண்டவர் எனக்குக் கட்டியெழுப்புவதற்காகவே, இடித்துத் தள்ளுவதற்காக அல்ல[b], கொடுத்த அதிகாரத்தின்படி கடுமையாகச் செயல்பட வேண்டியிராதபடி[a] எழுதுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடுமையைக் கையாள வேண்டியிராதபடி” அல்லது “கண்டிப்புடன் செயல்பட வேண்டியிராதபடி.”
    reason: ἀποτόμως χρήσωμαι என்பதற்கு ‘கடுமையைப் பயன்படுத்துதல்,’ ‘கூர்மையாக அல்லது கண்டிப்புடன் செயல்படுதல்’ என்ற பொருள்களும் சாத்தியம்.
  - marker: b
    text: 'அல்லது, “அழிப்பதற்காக அல்ல, வளர்த்தெடுப்பதற்காக.” கிரேக்க மூலத்தில் கட்டிட உருவகம் பயன்படுத்தப்பட்டுள்ளது: “கட்டியெழுப்புவதற்காக, இடித்துத் தள்ளுவதற்காக அல்ல.”'
    reason: οἰκοδομή மற்றும் καθαίρεσις என்ற சொற்களின் கட்டிட உருவகத்தையும் அவற்றின் கருத்துப் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்தான்
  rationale: முந்தைய சூழலுடன் பவுல் காட்டும் காரண-விளைவுத் தொடர்பை இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: கிரேக்க மூலத்தின் பன்மையைப் பாதுகாத்து, கடிதத்தில் எழுதப்பட்டுள்ள எச்சரிக்கைகள் அல்லது கருத்துகளைக் குறிக்கிறது.
- source_word: ἀπὼν
  choice: நான் உங்களைவிட்டு தொலைவில் இருக்கும்போதே
  rationale: παρὼν என்பதுடனான எதிரிணையைத் தெளிவாக்கும் காலப் பொருள் கொண்ட இயல்பான தமிழ் வடிவம்.
- source_word: γράφω
  choice: எழுதுகிறேன்
  rationale: கடிதம் எழுதும் நிகழ்காலச் செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἵνα
  choice: வேண்டியிராதபடி
  rationale: பவுல் இப்போது எழுதுவதன் நோக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παρὼν
  choice: நான் உங்களிடம் வந்திருக்கும்போது
  rationale: வெறும் ‘உடனிருக்கும்போது’ என்பதைக் காட்டிலும், பவுல் கொரிந்தியரிடம் நேரில் இருப்பதை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: கடுமையாக நடந்துகொள்ள வேண்டியிராதபடி
  rationale: ἀποτόμως என்பதிலுள்ள கடுமை அல்லது கூர்மையான நடவடிக்கையின் பொருளையும், சூழலில் உள்ள விரும்பத்தகாத அவசியத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: அதிகாரத்தின்படி
  rationale: κατά இங்கு அதிகாரத்துக்கு இசைவாக அல்லது அதன் அடிப்படையில் செயல்படுவதைக் குறிக்கிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்ற பட்டத்தை அதன் குறிப்பிட்ட நபரை மொழிபெயர்ப்பில் மேலதிகமாக விளக்காமல் வழக்கமான மரியாதைமிக்க தமிழில் தருகிறது.
- source_word: ἔδωκέν μοι
  choice: எனக்குக் கொடுத்த
  rationale: பவுலுக்குக் கடந்தகாலத்தில் அளிக்கப்பட்ட அதிகாரத்தை எளிய இறந்தகாலப் பொருளில் தெரிவிக்கிறது.
- source_word: εἰς οἰκοδομὴν
  choice: கட்டியெழுப்புவதற்காக
  rationale: கட்டிட உருவகத்தைப் பாதுகாப்பதோடு, மக்களை ஆவிக்குரிய வகையில் வளர்ப்பதைக் குறிக்கும் பவுலின் பயன்பாட்டையும் இயல்பாகத் தருகிறது.
- source_word: καθαίρεσιν
  choice: இடித்துத் தள்ளுவதற்காக
  rationale: οἰκοδομή என்பதற்கு எதிரான கட்டிட உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: அதிகாரத்தைக் கொடுத்த ‘ஆண்டவர்’ யாரைக் குறிக்கிறார்
  choice: மூலத்தில் உள்ளபடியே ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: குறிப்பாக ‘ஆண்டவர் இயேசு’ என்று அடையாளப்படுத்துதல் அல்லது பொதுவாக இறைவனைக் குறிக்கும் சொல்லாக விளக்குதல்.
  rationale: ὁ κύριος என்ற கிரேக்க வாசகம் இவ்வசனத்தில் அதற்கு மேல் வெளிப்படையாக அடையாளப்படுத்தவில்லை; ஆகவே மொழிபெயர்ப்பு அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
- issue: அப்போஸ்தல அதிகாரத்தின் நோக்கம்
  choice: ‘இடித்துத் தள்ளுவதற்காக அல்ல, கட்டியெழுப்புவதற்காக’ என்ற கட்டிட உருவக எதிரிணை பாதுகாக்கப்பட்டது.
  alternative: ‘அழிப்பதற்காக அல்ல, பக்திவிருத்திக்காக’ என்று கருத்துருவாக மொழிபெயர்த்தல்.
  rationale: மூலத்தில் உள்ள οἰκοδομή–καθαίρεσις உருவக எதிரிணையைப் பாதுகாப்பது, அதிகாரத்தின் நோக்கத்தைத் தெளிவாகக் காட்டுகிறது; அதே நேரத்தில் அதன் நடைமுறை அல்லது கோட்பாட்டு எல்லைகளை மொழிபெயர்ப்பு கூடுதலாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்கவும் சாதாரண வாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடியதாகவும் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; ஆனால் காரணம், நோக்கம், அதிகாரம், கட்டியெழுப்புதல்–இடித்தல் என்ற தர்க்கத் தொடர் முழுமையாகப் பாதுகாக்கப்பட்டது. முதன்மை உரையில் [a], [b] குறியீடுகள் தொடர்புடைய இடங்களில் இடம்பெற்றுள்ளன.
