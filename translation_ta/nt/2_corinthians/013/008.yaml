  yaml_path: translation/nt/2_corinthians/013/008.yaml
  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: ta
  text: ஏனெனில், உண்மைக்கு எதிராக எதையும் செய்ய எங்களால் முடியாது; ஆனால் உண்மைக்கு ஆதரவாகச் செய்ய முடியும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: “ஆனால் உண்மைக்காக.” கிரேக்கத்தில் இரண்டாம் கூறின் வினை முதல் கூறிலிருந்து புரிந்துகொள்ளப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ஏனெனில் ... முடியாது
  rationale: γάρ முந்தைய கருத்துக்கான காரணத்தை அறிமுகப்படுத்துகிறது; οὐ மறுப்பைக் குறிக்கிறது. இவை இரண்டும் இயல்பான நவீனத் தமிழில் இவ்வாறு வெளிப்படுகின்றன.
- source_word: δυνάμεθά
  choice: எங்களால் ... முடியும் / முடியாது
  rationale: δύναμαι திறன் அல்லது ஆற்றலைக் குறிக்கிறது. ‘எங்களால் முடியாது’ என்பது கிரேக்க வினையின் பொருளையும் பவுல் பேசும் ‘நாங்கள்’ என்பதையும் தெளிவாகக் காக்கிறது.
- source_word: τι
  choice: எதையும்
  rationale: மறுப்பு வாக்கியத்தில் வரும் τι-க்கு ‘எதையும்’ என்பது இயல்பான தமிழ் இணை; கூற்றின் விரிவான எல்லையையும் இது காக்கிறது.
- source_word: κατὰ τῆς ἀληθείας
  choice: உண்மைக்கு எதிராக
  rationale: ஆறாம் வேற்றுமையுடன் வரும் κατά இங்கே எதிர்ப்பு என்ற பொருளுடையது. ‘உண்மை’ என்பதை ஒரு குறிப்பிட்ட கோட்பாட்டு வாய்பாட்டுக்குள் சுருக்காமல் வைத்திருக்கிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: ἀλλά வலுவான முரண்பாட்டைச் சுட்டுகிறது. அரைப்புள்ளிக்குப் பின் ‘மாறாக’ என்பது தமிழில் அந்த எதிர்மறை–நேர்மறை மாறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: உண்மைக்கு ஆதரவாக
  rationale: ὑπέρ இங்கே ஆதரவு அல்லது சார்பாகச் செயல்படுதல் என்ற பொருளைத் தருகிறது. ‘உண்மைக்காக’ என்பதைக் காட்டிலும் ‘உண்மைக்கு ஆதரவாக’ என்பது ‘எதிராக’ என்பதுடனான எதிர்மறை இணைப்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘உண்மை’ என்பதன் பொருள்
  choice: ‘உண்மை’ என்ற பரந்த சொல்லையே தக்கவைத்தல்
  alternative: ‘நற்செய்தியின் உண்மை’ அல்லது ‘உண்மையானது’ என்று குறிப்பாக்குதல்
  rationale: சூழலில் நற்செய்தியின் உண்மை உட்பட்டிருந்தாலும், பவுலின் சொல் அதைவிடப் பரந்தது. உரை குறிப்பிடாத ஒரு குறுகிய கோட்பாட்டுப் பொருளைச் சேர்க்காமல் அதன் இறையியல் பரப்பையும் அழுத்தத்தையும் தக்கவைக்கிறது.
- issue: இரண்டாம் கூறில் விடுபட்டுள்ள வினை
  choice: தமிழின் தெளிவுக்காக ‘செயல்பட முடியும்’ என்று நிறைவு செய்தல்
  alternative: ‘ஆனால் உண்மைக்காக’ என்று கிரேக்கத்தின் சுருக்கத்தை அப்படியே வைத்தல்
  rationale: கிரேக்கத்தில் இரண்டாம் கூறின் வினை முதல் கூறிலிருந்து புரிந்துகொள்ளப்படுகிறது. தமிழில் வெறும் பெயர்ச்சொல் தொடராக விட்டால் வாக்கியம் முழுமையற்றதாக ஒலிக்கும்; சேர்க்கப்பட்ட வினை புதிய இறையியல் கருத்தை அறிமுகப்படுத்தாமல் மறைந்துள்ள பொருளை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘எதிராக / ஆதரவாக’ என்ற இணை கிரேக்கத்தின் சுருக்கமான முரண்பாட்டை இயல்பான தமிழில் தக்கவைக்கிறது; தேவையற்ற ‘மட்டுமே’ சேர்க்கப்படவில்லை.
