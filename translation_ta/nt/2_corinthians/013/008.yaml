revisions:
- from: ஏனெனில், உண்மைக்கு எதிராக எதையும் செய்ய எங்களால் முடியாது; மாறாக, உண்மைக்கு ஆதரவாகவே செயல்பட முடியும்.[a]
  to: ஏனெனில், உண்மைக்கு எதிராக எதையும் செய்ய எங்களால் முடியாது; ஆனால் உண்மைக்கு ஆதரவாகச் செய்ய முடியும்.[a]
  rationale: The revision removes the potentially exclusive emphasis of -வே and replaces ‘செயல்பட’ with ‘செய்ய,’ preserving the source’s broad verbal sense and the balanced contrast without adding meaning. The footnote remains structurally valid and accurately explains the Greek ellipsis.
