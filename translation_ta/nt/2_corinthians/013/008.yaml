review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents γάρ, the first-person plural incapacity, the broad negative scope of τι, and the antithesis of κατά/ὑπέρ with ‘the truth.’ However, the emphatic suffix -வே in ‘ஆதரவாகவே’ can naturally communicate ‘only,’ which the Greek does not explicitly state and which the English audit trail deliberately removed. ‘செயல்பட’ also narrows the repeated implied action slightly compared with the Greek’s broad ‘do anything.’
  naturalness: The Tamil is clear, dignified, and natural in modern standard usage. Repeating ‘செய்ய’ in the second clause provides a closer and equally natural expression of the Greek’s ellipsis.
  terminology: ‘உண்மை’ appropriately preserves the breadth of ἀλήθεια without imposing a doctrinally narrowed referent. ‘உண்மைக்கு எதிராக / உண்மைக்கு ஆதரவாக’ effectively conveys the adversative parallel.
  issues:
  - severity: low
    issue: The suffix -வே in ‘உண்மைக்கு ஆதரவாகவே’ may add an explicit ‘only.’
    rationale: Although the contrast may pragmatically imply exclusivity, the Greek text has no μόνον, and the audit trail specifically avoids adding ‘only.’
  - severity: low
    issue: ‘செயல்பட’ is somewhat narrower than the broad repeated sense of ποιεῖν/‘do’ implied in the second clause.
    rationale: Using ‘செய்ய முடியும்’ retains the lexical and rhetorical parallel with ‘எதையும் செய்ய ... முடியாது’ while naturally supplying the ellipted verb.
  revised_text: ஏனெனில், உண்மைக்கு எதிராக எதையும் செய்ய எங்களால் முடியாது; ஆனால் உண்மைக்கு ஆதரவாகச் செய்ய முடியும்.[a]
