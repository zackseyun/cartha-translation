  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பலவீனத்திலிருந்து’ மற்றும் ‘வல்லமையிலிருந்து’ ஆகிய சற்றே குறைவான வழக்குத் தொடர்கள், மூலத்தில் மீளும் ἐξ/ἐκ அமைப்பையும் அதன் முரணையும் பாதுகாப்பதற்காகத் தேர்ந்தெடுக்கப்பட்டன; இயல்பான மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
