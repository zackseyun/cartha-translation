  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: ta
  text: ஏனெனில், அவர் பலவீனத்தால்[a] சிலுவையில் அறையப்பட்டார்; ஆனாலும் கடவுளின் வல்லமையால் அவர் வாழ்கிறார். ஏனெனில், நாங்களும் அவரில் பலவீனமாயிருக்கிறோம்; ஆனாலும் உங்களைப் பொறுத்தவரை[d], கடவுளின் வல்லமையால்[b] அவரோடு வாழ்வோம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பலவீனத்தில்’ அல்லது, இன்னும் சொற்படியாக, ‘பலவீனத்திலிருந்து’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க ἐξ இங்கு ஊற்று, அடிப்படை, அல்லது சூழலைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் சொற்படியாக, ‘கடவுளின் வல்லமையிலிருந்து’ என்றும் மொழிபெயர்க்கலாம்; பலவீனத்தோடு திட்டமிட்ட முரணை அமைக்க கிரேக்கம் ἐκ என்ற முன்னிடைச்சொல்லை மீண்டும் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘அவரோடு வாழ்வோம்’ என்பது கொரிந்தியர்களுடன் தொடர்புடைய பவுலும் அவருடன் இருப்பவர்களும் கிறிஸ்துவின் வல்லமையால் எதிர்காலத்தில் வாழ்வதைக் குறிக்கலாம்; மேலும், விரிவான உயிர்த்தெழுதல் வாழ்வின் கருப்பொருளையும் எதிரொலிக்கலாம்.
    reason: alternative_reading
  - marker: d
    text: ‘உங்களுக்காக,’ ‘உங்களிடையே,’ அல்லது ‘உங்களை நோக்கி’ என்றும் மொழிபெயர்க்கலாம்; εἰς ὑμᾶς என்ற கிரேக்கத் தொடர் சுருக்கமானது; அது திசை, உறவு, அல்லது விளைவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: சிலுவையில் அறையப்பட்டார்
  rationale: σταυρόω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தைத் துல்லியமாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: ἐξ ἀσθενείας
  choice: பலவீனத்திலிருந்து
  rationale: ἐξ என்பதன் ஊற்று அல்லது அடிப்படை சார்ந்த பொருளைத் தக்கவைத்து, பின்னர் மீண்டும் வரும் ἐκ δυνάμεως θεοῦ என்பதோடு உள்ள திட்டமிட்ட முரணையும் வெளிப்படுத்துகிறது.
- source_word: ζῇ
  choice: உயிர்வாழ்கிறார்
  rationale: ζάω என்பதன் நிகழ்கால வினை வலிமையையும் தொடர்ந்து வாழும் நிலையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: கடவுளின் வல்லமையிலிருந்து
  rationale: மீண்டும் வரும் ἐκ என்பதையும், பலவீனத்திலிருந்து—கடவுளின் வல்லமையிலிருந்து என்ற இணையான முரணையும் பாதுகாக்கிறது.
- source_word: ἀσθενοῦμεν
  choice: பலவீனமாக இருக்கிறோம்
  rationale: ἀσθένεια என்பதோடு உள்ள சொல்லியல் தொடர்பைத் தக்கவைத்து, ἀσθενέω என்பதன் நிகழ்காலப் பொருளை இயல்பாக வழங்குகிறது.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள்
  rationale: கிறிஸ்துவோடு ஒன்றிப்பைச் சுருக்கமாகக் குறிக்கும் பவுலின் ἐν மொழிநடையை மிகையாக விளக்காமல் காக்கிறது.
- source_word: ζήσομεν
  choice: வாழ்வோம்
  rationale: எதிர்கால வினை வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது; இதை நிகழ்கால ஊழியத்திற்கோ இறுதி உயிர்த்தெழுதலுக்கோ மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: σὺν αὐτῷ
  choice: அவரோடு
  rationale: σύν குறிக்கும் உடனிருப்பு மற்றும் பங்குபெறுதலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களைப் பொறுத்தவரை
  rationale: கொரிந்தியர்களை நோக்கிய திசை, உறவு, அல்லது விளைவு ஆகியவற்றை உள்ளடக்கக்கூடிய சுருக்கமான கிரேக்கத் தொடரை அளவுக்கு மீறித் தீர்மானிக்காமல் வழங்குகிறது.
theological_decisions:
- issue: சிலுவையில் கிறிஸ்துவின் ‘பலவீனம்’ என்பதன் பொருள்
  choice: அவர் பலவீனத்திலிருந்து சிலுவையில் அறையப்பட்டார் என்ற மூலத்தின் முரண்பாட்டான மொழியைத் தக்கவைத்தல்
  alternative: ‘பலவீன நிலையில்’ அல்லது ‘மனித பார்வையில் பலவீனராக’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனம் சிலுவையின் பலவீனத்தையும் கடவுளின் வல்லமையால் அவர் வாழ்வதையும் எதிரெதிராக வைக்கிறது. மொழிபெயர்ப்பு கிறிஸ்துவின் தெய்வீகத்தையோ பாவமின்மையையோ பற்றிய மறுப்பைச் சேர்க்காமல், மூலத்தின் இறையியல் பதற்றத்தை அப்படியே விடுகிறது.
- issue: ‘அவரோடு வாழ்வோம்’ என்பதன் குறிப்பு
  choice: கொரிந்தியர்களுடன் தொடர்புடைய பவுலின் எதிர்கால கிறிஸ்து-வல்லமையுள்ள செயலையும் விரிவான உயிர்த்தெழுதல் வாழ்வின் எதிரொலியையும் உள்ளடக்கக்கூடியவாறு திறந்துவைத்தல்
  alternative: இதை இறுதி உயிர்த்தெழுதலுக்கு மட்டும் அல்லது தற்போதைய அப்போஸ்தல ஊழியத்திற்கு மட்டும் வரையறுத்தல்
  rationale: உடனடியான சூழல் கொரிந்தியர்களை நோக்கிய அப்போஸ்தல செயல்பாட்டைக் காட்டுகிறது; அதே நேரத்தில் கிறிஸ்துவோடு வாழ்தல் என்ற மொழி விரிவான உயிர்த்தெழுதல் கருப்பொருளையும் எதிரொலிக்கிறது.
