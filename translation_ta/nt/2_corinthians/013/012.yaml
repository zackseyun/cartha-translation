  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: ta
  text: பரிசுத்த முத்தத்துடன் ஒருவரையொருவர் வாழ்த்துங்கள். பரிசுத்தவான்கள்[a] அனைவரும் உங்களுக்கு வாழ்த்துச் சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசுத்தவான்கள்’ என்பது விசுவாசிகளாகிய கடவுளின் பரிசுத்த மக்களைக் குறிக்கிறது; சிறப்பாகப் புனிதர் பட்டம் அளிக்கப்பட்ட ஒரு சிலரை மட்டும் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துங்கள்
  rationale: இது பன்மை முன்னிலையில் கொடுக்கப்பட்ட நேரடியான கட்டளை. தமிழில் ‘வாழ்த்துங்கள்’ என்பது கடித நிறைவுச் சூழலுக்கும் பரஸ்பர வணக்கத்திற்கும் இயல்பான இணைச்சொல்.
- source_word: ἀλλήλους
  choice: ஒருவரையொருவர்
  rationale: சமூகத்தினரிடையே பரஸ்பரமாகச் செய்யப்படும் செயலைக் குறிக்கும் பதிலிடுபெயரின் பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: பரிசுத்த முத்தத்துடன்
  rationale: ἐν இங்கு வாழ்த்தும் முறையைக் குறிப்பதால் தமிழில் ‘-உடன்’ இயல்பானது. ἁγίῳ என்பதன் அர்ப்பணிக்கப்பட்ட, சமூகத்துக்குரிய தன்மையை ‘பரிசுத்த’ காக்கிறது; φίλημα என்பதன் நேரடிப் பொருளான ‘முத்தம்’ மறைமுகமாக்கப்படவில்லை.
- source_word: ἀσπάζονται
  choice: வாழ்த்துச் சொல்கிறார்கள்
  rationale: கடிதச் சூழலில் பிறர் பெறுநர்களுக்குத் தங்கள் வாழ்த்தைத் தெரிவிப்பதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑμᾶς
  choice: உங்களுக்கு
  rationale: கிரேக்கத்தில் இது பன்மை இரண்டாம் நபரைக் குறிக்கிறது; ‘வாழ்த்துச் சொல்கிறார்கள்’ என்ற தமிழ் தொடரில் ‘உங்களுக்கு’ இயல்பான வேற்றுமை வடிவம்.
- source_word: οἱ ἅγιοι πάντες
  choice: பரிசுத்தவான்கள் அனைவரும்
  rationale: பவுலின் பயன்பாட்டில் ἅγιοι என்பது விசுவாசிகளாகிய கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட மக்களைக் குறிக்கிறது. ‘அனைவரும்’ πάντες என்பதன் முழுமையைக் காக்கிறது.
theological_decisions:
- issue: பவுலின் சமூக அழைப்பில் ἅγιοι என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்தவான்கள்
  alternative: பரிசுத்த மக்கள் / இறைவனுடைய பரிசுத்த மக்கள்
  rationale: இச்சொல் ஒரு சிறப்புப் பட்டம் பெற்ற சிலரை மட்டும் அல்லாமல், விசுவாசிகள் அனைவரையும் குறிக்கும் பவுலின் வழக்கமான சமூகப் பெயராகவே வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு பிற்காலத் தனிப்பட்ட பொருள் வாசிக்கப்படுவதைத் தவிர்க்கிறது.
- issue: ἅγιος என்ற சொல்லை முத்தத்திற்கும் மக்களுக்கும் தொடர்புபடுத்துதல்
  choice: இரு இடங்களிலும் ‘பரிசுத்த’ என்ற சொல்வேரைக் காத்தல்
  alternative: முத்தத்திற்கு ‘புனித’, மக்களுக்கு ‘பரிசுத்த மக்கள்’
  rationale: மூலத்தில் ஒரே ἅγιος சொற்குடும்பம் பயன்படுத்தப்பட்டுள்ளதால் அதன் ஒலிப்பொருள் தொடர்பைத் தமிழிலும் இயன்றவரை பாதுகாக்கிறது; அதே நேரம் இரு பயன்பாடுகளின் சூழல் வேறுபாட்டை மறுப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சுருக்கமான கடித நிறைவு நடையில் மொழிபெயர்க்கப்பட்டது. ‘பரிசுத்த முத்தம்’ என்ற பண்பாட்டுச் சைகை விளக்கவுரையால் மாற்றப்படாமல் நேரடியாக வைக்கப்பட்டுள்ளது. கிரேக்க மூலத்தில் அடிக்குறிப்பு தேவைப்படும் உரைமாற்று இல்லை; ἅγιοι தவறாகக் குறுகிய பொருளில் புரிந்துகொள்ளப்படாதபடி மட்டும் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
