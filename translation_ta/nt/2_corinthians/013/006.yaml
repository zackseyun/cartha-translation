  text: ἐλπίζω δὲ ὅτι γνώσεσθε ὅτι ἡμεῖς οὐκ ἐσμὲν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/006.yaml
  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: ta
  text: ஆனால், நாங்கள் சோதனையில் தகுதி பெறாதவர்கள் அல்ல என்பதை நீங்கள் அறிந்துகொள்வீர்கள் என்று நம்புகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கீகரிக்கப்படாதவர்கள் அல்ல” அல்லது “சோதனையில் தோல்வியடைந்தவர்கள் அல்ல.” கிரேக்கப் பெயரடை, சோதிக்கப்பட்ட பின் அங்கீகாரம் பெறத் தவறுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: நம்புகிறேன்
  rationale: நிகழ்கால முதலாம் நபர் ஒருமையை இயல்பாகக் காட்டுகிறது; இங்கு பவுலின் எதிர்நோக்கும் நம்பிக்கையையும் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட சோதனையில் தகுதியற்றவர்களாகக் காணப்படும் சாத்தியத்துடன் உள்ள மிதமான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: γνώσεσθε
  choice: நீங்கள் அறிந்துகொள்வீர்கள்
  rationale: எதிர்காலத்தில் கொரிந்தியர்கள் உணர்ந்து அறியப்போவதை எதிர்கால வினையாக இயல்பாகக் காட்டுகிறது.
- source_word: ὅτι
  choice: என்பதை
  rationale: உள்ளடக்க வாக்கியத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: ἡμεῖς
  choice: நாங்கள்
  rationale: பவுலையும் அவருடைய உடனுழைப்பாளர்களையும் குறிக்கும் வெளிப்படையான பன்மைப் பெயர்ச்சொல்லைப் பாதுகாக்கிறது.
- source_word: οὐκ ἐσμὲν
  choice: அல்ல
  rationale: எளிய மறுப்பை வலுப்படுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: ἀδόκιμοι
  choice: தகுதியற்றவர்கள்
  rationale: சோதிக்கப்பட்ட பின் அங்கீகாரத்திற்குத் தகுதியில்லாதவர்களாகக் காணப்படுதல் என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; பிற்காலக் கோட்பாட்டுச் சுமையுள்ள சொற்களைத் தவிர்க்கிறது.
theological_decisions:
- issue: சோதனை மற்றும் அப்போஸ்தலப் பணியின் நம்பகத்தன்மைச் சூழலில் ἀδόκιμοι என்பதன் மொழிபெயர்ப்பு
  choice: தகுதியற்றவர்கள் அல்ல
  alternative: அங்கீகரிக்கப்படாதவர்கள் அல்ல / சோதனையில் தோற்றவர்கள் அல்ல
  rationale: உடனடிச் சூழலிலுள்ள சோதித்தறிதல் என்ற உருவகத்தையும் மதிப்பீட்டுச் சாரத்தையும் இது காக்கிறது; அதேவேளையில் ‘நிராகரிக்கப்பட்டவர்கள்’ போன்ற தேவையற்ற கோட்பாட்டுப் பொருளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான நடை. ‘அறிந்துகொள்வீர்கள்’ என்பது எதிர்கால உணர்தலைக் காட்டுகிறது. ‘தகுதியற்றவர்கள்’ என்பது சோதனைச் சூழலை வாசிக்கத்தக்க முறையில் தருகிறது; அதன் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
