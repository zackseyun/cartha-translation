source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: ta
  text: நான் உங்களிடம் வருவது இது மூன்றாவது முறை. “இரண்டு அல்லது மூன்று சாட்சிகளின் வாக்குமூலத்தின் பேரில் ஒவ்வொரு காரியமும் உறுதிப்படுத்தப்படும்.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டு அல்லது மூன்று சாட்சிகளின் வாயினால் ஒவ்வொரு சொல்லும் உறுதிப்படுத்தப்படும்.” கிரேக்க வாசகம் உபாகமம் 19:15-ன் சொல் அமைப்பை நெருக்கமாகப் பின்பற்றி, ஒரு சட்டவழக்குச் சொற்றொடரைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இது உபாகமம் 19:15-ஐச் சுட்டுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: இது மூன்றாவது முறை
  rationale: இந்த நடுநிலை வேற்றுமைத் தொடர் ἔρχομαι என்பதுடன் வினையடைபோல் செயல்பட்டு, பவுல் வருவது மூன்றாவது நிகழ்வு என்பதைக் குறிக்கிறது. நவீன தமிழில் இவ்வடிவம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: நான் உங்களிடம் வருவது
  rationale: நிகழ்கால வடிவம் சூழலில் நெருங்கிய எதிர்கால வருகையை அறிவிக்கிறது. ‘வருவது’ என்பது அறிவிக்கப்பட்ட வருகையின் உடனடித் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐπὶ στόματος
  choice: சாட்சியத்தின் அடிப்படையில்
  rationale: இது உபாகமம் 19:15-ஐ எதிரொலிக்கும் சட்டவழக்குச் சொற்றொடர். ‘வாயின்மேல்’ என்ற சொற்சொறான மொழிபெயர்ப்பு நவீன தமிழில் தெளிவற்றதாக இருப்பதால், அதன் நீதிசார் பொருள் வெளிப்படுமாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: இரண்டு சாட்சிகளுடைய அல்லது மூன்று சாட்சிகளுடைய
  rationale: கிரேக்கத்தில் καί இருந்தாலும், மேற்கோளின் வழக்குச் சூத்திரத்தில் அது எண்ணிக்கைகளைச் சேர்த்து ஐந்து சாட்சிகள் என்று கூறாமல், ‘இரண்டு அல்லது மூன்று’ என்ற பகிர்நிலைப் பொருளைத் தருகிறது. கிரேக்கச் சொல் அமைப்பையும் உண்மையான பொருளையும் இத்தேர்வு காக்கிறது.
- source_word: σταθήσεται
  choice: உறுதிசெய்யப்படும்
  rationale: ἵστημι என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம் சட்டச் சூழலில் ஒரு காரியம் நிறுவப்படுதல் அல்லது உறுதிப்படுத்தப்படுதல் என்பதைக் குறிக்கிறது.
- source_word: πᾶν ῥῆμα
  choice: ஒவ்வொரு காரியமும்
  rationale: ῥῆμα என்பதற்கு ‘சொல்’ அல்லது ‘கூற்று’ என்ற பொருள் இருக்கலாம்; ஆனால் இந்தச் சட்ட மேற்கோளில் விசாரணைக்குரிய காரியம் என்ற விரிவான பொருள் பொருத்தமானது. குறிப்பிட்ட ‘குற்றச்சாட்டு’ என்று தேவையின்றி குறுக்காமல் உள்ளது.
theological_decisions:
- issue: பவுலின் ஒழுங்கு நடவடிக்கைச் சூழலில் உபாகமச் சட்டக் கோட்பாட்டின் பயன்பாடு
  choice: மேற்கோளை எந்தக் காரியத்தையும் சாட்சியால் உறுதிசெய்யும் பொதுவான சட்டக் கோட்பாடாக மொழிபெயர்த்தல்
  alternative: ‘ஒவ்வொரு சொல்லும்’ என்று சொற்சொறாகவோ, ‘ஒவ்வொரு குற்றச்சாட்டும்’ என்று குறிப்பாகவோ மொழிபெயர்த்தல்
  rationale: பவுல் வேதாகமத்தின் சட்டக் கோட்பாட்டை மேற்கோள் காட்டுகிறார். கிரேக்கம் வெளிப்படையாகக் கூறாத திருச்சபை ஒழுங்கு சார்ந்த குறுகிய விளக்கத்தை மொழிபெயர்ப்பில் புகுத்தாமல், அதன் விரிவான நீதிசார் வலிமை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் பொதுவாசகர்களுக்கான தெளிவும் பேணப்பட்டுள்ளது. மேற்கோளின் சட்டத் தொனியை வெளிப்படுத்த ‘சாட்சியத்தின் அடிப்படையில்’ பயன்படுத்தப்பட்டது; சொற்சொறான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
