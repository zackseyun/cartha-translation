  source_fidelity: 'The draft accurately represents the causal ἐπεὶ, the ongoing request for δοκιμήν, and the content that Messiah speaks ἐν ἐμοί. It retains the intended contrast: he is not weak εἰς ὑμᾶς but exercises power ἐν ὑμῖν. “உங்களுக்குள்” is a direct, suitably noncommittal rendering of ἐν ὑμῖν, with the corporate alternative preserved in a note.'
