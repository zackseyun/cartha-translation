id: 2CO.13.3
reference: 2 Corinthians 13:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: ta
  text: என்னில் மேசியா பேசுகிறார்[a] என்பதற்கான சான்றை நீங்கள் தேடுகிறீர்களே; அவர் உங்களிடம் பலவீனமானவர் அல்ல, மாறாக உங்களுக்குள்[b] வல்லமையுடன் செயல்படுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மூலமாக மேசியா பேசுகிறார்.” கிரேக்கத்தில் இன்னும் நேரடியாக, “என்னில் பேசுகிற மேசியா” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் நடுவில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: தேடுகிறீர்களே
  rationale: ἐπεὶ தரும் காரணத் தொடர்பைத் தமிழில் இயல்பாக உணர்த்தும் வகையில் ஏகாரத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது; இது முந்தைய மற்றும் அடுத்த சூழலோடு வாக்கியத்தை இணைக்கிறது.
- source_word: δοκιμήν
  choice: சான்று
  rationale: இங்கு சோதிக்கும் செயலைவிட, ஒரு கூற்றை மெய்ப்பிக்கும் ஆதாரம் அல்லது நிரூபணம் என்ற பொருளே முன்னிலையில் உள்ளது.
- source_word: ζητεῖτε
  choice: தேடுகிறீர்கள்
  rationale: நிகழ்கால வடிவம் கொரிந்தியர்கள் தொடர்ந்து கோரிவரும் சான்றைக் குறிக்கிறது.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: என்னில் மேசியா பேசுகிறார் என்பதற்கான
  rationale: δοκιμήν என்பதுடன் வரும் இறைமைப் பங்கேற்புச் சொற்றொடர் தமிழில் இயல்பான உள்ளடக்கக் கிளவியாக மாற்றப்பட்டுள்ளது. ἐν ἐμοί என்பதன் வெளிப்படையான ‘என்னில்’ வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: Χριστός இங்கு அபிஷேகம் பெற்ற அரசர் என்ற பட்டப் பொருளுடன் பயன்படுத்தப்படுவதால் ‘மேசியா’ என வழங்கப்பட்டுள்ளது.
- source_word: εἰς ὑμᾶς
  choice: உங்களிடம்
  rationale: கொரிந்தியர்களை நோக்கிய அல்லது அவர்களுடன் தொடர்புடைய விதத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οὐκ ἀσθενεῖ
  choice: பலவீனமானவர் அல்ல
  rationale: ἀσθενέω என்பதன் பலவீனம் அல்லது வல்லமையின்மை என்ற பொருளை நேரடியாகக் காத்து, அடுத்துள்ள வல்லமைச் சொல்லுடன் உள்ள முரண்பாட்டையும் தெளிவாக்குகிறது.
- source_word: ἀλλὰ δυνατεῖ
  choice: மாறாக ... வல்லமையுடன் செயல்படுகிறார்
  rationale: அரிதான δυνατέω வினை வெறும் தன்மையை மட்டுமல்லாமல் செயல்படும் வல்லமையையும் சுட்டலாம்; தமிழ் நடைமுறையில் இயல்பாக இருக்கும் இந்த வடிவம் எதிர்மறை முரண்பாட்டைக் காக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களுக்குள்
  rationale: பன்மைச் சுட்டுப்பெயருடன் வந்துள்ள ἐν என்பதற்கு நேரடியான இணையாக இது உள்ளது; தனிநபர்களின் உள்ளத்திலோ சபையினரின் நடுவிலோ என்ற சாத்தியமான நுணுக்கத்தை முற்றிலும் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: Χριστοῦ என்பதன் பட்டப்பெயர் சார்ந்த பொருள்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு பேசுகிறவரை அடையாளப்படுத்தும் அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருளை வெளிப்படையாகக் காக்க ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: ἐν ἐμοί என்பதன் கருவி அல்லது இருப்பிட நுணுக்கம்
  choice: என்னில் பேசுகிறார்
  alternative: என் மூலமாகப் பேசுகிறார்
  rationale: மூலத்தின் ἐν என்ற முன்னிடைச்சொல்லை நேரடியாகப் பாதுகாக்கிறது; மேசியா பவுலின் மூலமாகப் பேசுகிறார் என்ற கருவிப் பொருளும் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: ἐν ὑμῖν என்பதன் உள்நிலை அல்லது சமூக நுணுக்கம்
  choice: உங்களுக்குள்
  alternative: உங்கள் நடுவில்
  rationale: ‘உங்களுக்குள்’ என்பது கிரேக்க வடிவுக்கு நெருக்கமானது; அது விசுவாசிகளுக்குள் உள்ளார்ந்த செயல்பாட்டையோ அவர்களுடைய சமூகத்தின் நடுவிலான செயல்பாட்டையோ குறிக்கலாம். மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தேடுகிறீர்களே’ என்பது முந்தைய சூழலுடனான காரணத் தொடர்பைக் காட்டுகிறது. பலவீனம்–வல்லமை என்ற பவுலின் எதிரிணை தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
