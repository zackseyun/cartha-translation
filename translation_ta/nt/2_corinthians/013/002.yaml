id: 2CO.13.2
reference: 2 Corinthians 13:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: ta
  text: 'முன்பே கூறியிருக்கிறேன்; இரண்டாம் முறை உங்களோடு இருந்தபோது கூறியதுபோல, இப்போது இல்லாதிருந்தும், முன்பு பாவம் செய்தவர்களுக்கும் மற்ற அனைவருக்கும் முன்கூட்டியே கூறுகிறேன்: நான் மீண்டும் வந்தால்[a], அவர்களுக்கு இரக்கம் காட்ட மாட்டேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சூழலை வெளிப்படையாகக் கூறினால், “நான் மூன்றாம் முறையாக வந்தால்.” கிரேக்கத்தில் சொற்சொல்லாக “நான் மீண்டும் வந்தால்” என்று உள்ளது; பவுலின் வருகைகளைப் பற்றிய சூழல், இரண்டாம் வருகைக்குப் பிந்தைய இன்னொரு வருகையைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα
  choice: முன்பே சொல்லியிருக்கிறேன்
  rationale: நிறைவேற்றுக் காலம், முன்பு கூறப்பட்டது இப்போதும் செல்லுபடியாக இருப்பதைக் காட்டுகிறது; மூலச்சொல்லில் இல்லாத ‘எச்சரித்தேன்’ என்ற கருத்தை நேரடியாகச் சேர்க்கவில்லை.
- source_word: προλέγω
  choice: முன்னதாகச் சொல்கிறேன்
  rationale: ‘முன்கூட்டியே சொல்லுதல்’ என்ற அடிப்படைப் பொருளைப் பேணி, προείρηκα என்பதுடனான சொல் தொடர்பையும் இயன்றவரை நிலைநிறுத்துகிறது.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: இப்போது நான் தூரத்தில் இருந்தாலும், இரண்டாம் முறை உங்களோடு இருந்தபோது சொன்னதுபோலவே
  rationale: சுருக்கமான கிரேக்கத் தொடரில் உள்ள, பவுலின் தற்போதைய இல்லாமைக்கும் இரண்டாம் வருகையின்போதைய நேரடி இருப்புக்கும் இடையிலான ஒப்பீட்டை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: τοῖς προημαρτηκόσιν
  choice: முன்பு பாவம் செய்தவர்களுக்கு
  rationale: முந்தைய பாவத்தைச் சுட்டுகிறது; அவர்கள் மனந்திரும்பினார்களா இல்லையா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: மற்ற அனைவருக்கும்
  rationale: முன்பு பாவம் செய்தவர்கள் என்ற குழுவுக்கு அப்பாற்பட்ட அனைவரையும் உள்ளடக்கும் விரிவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: நான் மீண்டும் வந்தால்
  rationale: கிரேக்கத்தில் நேரடியாக உள்ள ‘மீண்டும் வருதல்’ என்ற கருத்தைப் பேணுகிறது; ‘மூன்றாம் முறை’ என்பது சூழலிலிருந்து பெறப்படும் விளக்கம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐ φείσομαι
  choice: அவர்களை விட்டுவைக்க மாட்டேன்
  rationale: கடுமையான நடவடிக்கையிலிருந்து விலகாமையை இயல்பான தமிழில் தெரிவிக்கிறது; குறிப்பிட்ட திருச்சபை ஒழுங்கு முறையைத் திணிக்கவில்லை.
theological_decisions:
- issue: பவுல் அறிவிக்கும் கடுமையின் வரம்பு
  choice: முன்பு பாவம் செய்தவர்களுக்கும் மற்ற அனைவருக்கும் எச்சரிக்கை உரைக்கப்படுகிறது; அவர் வந்தால் உரியவர்களை விட்டுவைக்க மாட்டார்.
  alternative: இந்தக் கடுமை முன்பு பாவம் செய்தவர்களுக்கு மட்டுமே உரியது; அல்லது எந்த நடவடிக்கை என்பது குறிப்பிடப்படாத பொதுவான அப்போஸ்தல அதிகாரக் கூற்று.
  rationale: இலக்கணம் இரு குழுக்களையும் நேரடியாகச் சுட்டுகிறது. அதேவேளை, பவுல் எத்தகைய ஒழுங்கு நடவடிக்கையை மேற்கொள்வார் என்பதை வசனம் விவரிக்காததால் மொழிபெயர்ப்பு அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘விட்டுவைக்க மாட்டேன்’ என்பது கடுமையைத் தக்கவைத்தாலும் குறிப்பிட்ட தண்டனை அல்லது சபை ஆட்சிமுறையைச் சேர்க்காது.
