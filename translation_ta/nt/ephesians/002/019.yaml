  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: ta
  text: ஆகவே, நீங்கள் இனி அந்நியர்களும் குடியுரிமையற்ற அயல்நாட்டுக் குடியிருப்பாளர்களும்[a] அல்ல; மாறாக, பரிசுத்த மக்களுடன்[b] சக குடிமக்களாகவும் கடவுளுடைய வீட்டாராகவும்[c] இருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ஓர் இடத்தில் வாழ்ந்தாலும் அங்குள்ள முழுக் குடியுரிமை இல்லாத அயல்நாட்டவர்கள். ‘தற்காலிகமாகத் தங்கியிருப்பவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பரிசுத்த மக்கள்’ என்பது கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட அவருடைய மக்களைக் குறிக்கிறது; பிற்காலத்தில் அதிகாரப்பூர்வமாகப் புனிதர் என அறிவிக்கப்பட்ட ஒரு சிறப்புப் பிரிவை மட்டும் அல்ல. ‘பரிசுத்த மக்களின் சக குடிமக்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
  - marker: c
    text: அதாவது, கடவுளுடைய வீட்டை அல்லது குடும்பத்தைச் சேர்ந்தவர்கள்.
    reason: metaphor_clarification
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது; இரண்டு கிரேக்க இடைச்சொற்களின் கூட்டு வலிமையை தேவையற்ற சொற்பெருக்கமின்றி எடுத்துரைக்கிறது.
- source_word: οὐκέτι
  choice: இனி ... அல்ல
  rationale: முன்பு இருந்த நிலை இப்போது மாறிவிட்டது என்னும் காலநிலை மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ξένοι
  choice: அந்நியர்கள்
  rationale: சேர்ந்திராதவர்கள் அல்லது வெளியார் என்ற பொருளைக் காக்கிறது; தொடர்ந்து வரும் குடியிருப்பு மற்றும் குடியுரிமை உருவகங்களுடனும் பொருந்துகிறது.
- source_word: πάροικοι
  choice: குடியுரிமையற்ற அயல்நாட்டுக் குடியிருப்பாளர்கள்
  rationale: ஒரு நாட்டில் வசித்தாலும் அதன் முழுக் குடிமக்கள் உரிமையைப் பெறாதவர்களைக் குறிக்கும் சமூக-சட்ட நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: συμπολῖται
  choice: சக குடிமக்கள்
  rationale: மற்றவர்களுடன் பகிர்ந்துகொள்ளும் ஒரே குடியுரிமையைச் சுருக்கமாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: τῶν ἁγίων
  choice: பரிசுத்த மக்களுடன்
  rationale: இங்கு ἅγιοι என்பது தனிப்பட்ட சிறப்புப் பிரிவை அல்ல, கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட மக்களைக் குறிக்கிறது. உடனிருப்பு அல்லது பங்குபெறுதல் உறவைத் தமிழில் இயல்பாகக் காட்ட ‘மக்களுடன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: οἰκεῖοι τοῦ θεοῦ
  choice: கடவுளுடைய வீட்டார்
  rationale: கடவுளின் வீட்டைச் சேர்ந்தவர்கள் என்ற குடும்ப உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது; ‘வீட்டார்’ என்பது வீட்டின் உறுப்பினர்கள் என்ற பொருளைக் கொண்டது.
theological_decisions:
- issue: τῶν ἁγίων என்பதன் குறிப்பு
  choice: ‘பரிசுத்த மக்கள்’ என்ற பரந்த சொல்லை வைத்திருத்தல்
  alternative: தேவதூதர்கள்; குறிப்பாக யூத விசுவாசிகள்; எல்லா விசுவாசிகளும்
  rationale: சூழலில் புறவினத்தார் கடவுளுடைய மக்களோடு இணைக்கப்படுவதைப் பவுல் விளக்குகிறார். குறிப்பு யாரை மட்டும் உள்ளடக்குகிறது என்பதை மொழிபெயர்ப்பிலேயே குறுக்காமல், மூலத்தின் பரந்த சொல்லும் அதன் இறையியல் இழுவையும் காக்கப்படுகின்றன.
- issue: οἰκεῖοι τοῦ θεοῦ என்ற குடும்ப உருவகம்
  choice: கடவுளுடைய வீட்டார்
  alternative: கடவுளின் குடும்பத்தைச் சேர்ந்தவர்கள்
  rationale: ‘வீடு/வீட்டார்’ என்ற உருவகத்தை நேரடியாகக் காக்கிறது; அதேவேளையில் வெறும் கட்டடத்தை அல்ல, கடவுளுக்குச் சொந்தமான குடும்பச் சமூகத்தின் உறுப்பினர்களைச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்நியர்கள்—குடியுரிமையற்ற குடியிருப்பாளர்கள்—சக குடிமக்கள்—வீட்டார்’ என்ற மூல வசனத்தின் சமூக நிலையிலிருந்து நெருக்கமான குடும்ப உறவுக்குச் செல்லும் முன்னேற்றம் காக்கப்பட்டுள்ளது.
