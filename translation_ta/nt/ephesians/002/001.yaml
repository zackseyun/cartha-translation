  text: Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: ta
  text: மேலும், உங்கள் மீறுதல்களிலும் பாவங்களிலும் இறந்தவர்களாக இருந்த உங்களையும்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπτώμασιν
  choice: மீறுதல்கள்
  rationale: தவறான அடியெடுப்பு அல்லது வரம்புமீறல் என்ற சொல்லின் நுணுக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἁμαρτίαις
  choice: பாவங்கள்
  rationale: ἁμαρτία என்பதற்கான நிலையான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் வேதாகமச் சொல்.
- source_word: νεκρούς
  choice: இறந்தவர்களாக
  rationale: உருவகத்தின் வலிமையைத் தணிக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὄντας
  choice: இருந்த
  rationale: இது இறந்த நிலையைச் சுட்டும் நிகழ்காலப் பங்கேற்புவினை; தொடரும் வாக்கிய அமைப்பில் தமிழுக்கு இயல்பாக இறந்தகாலத் தொடர்பெச்சமாக வருகிறது.
- source_word: τοῖς ... καὶ ταῖς ...
  choice: '...இனாலும் ...இனாலும்'
  rationale: இங்கே உள்ள dative வடிவம் காரணம் அல்லது தொடர்புடைய துறையைக் குறிக்கலாம்; சூழலில் காரணப்பொருள் இயல்பாகத் தோன்றுவதால் இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: ‘இறந்தவர்கள்’ என்பதன் தன்மை
  choice: உருவகத்தை விளக்கமின்றி ‘இறந்தவர்களாக’ என்று வைத்தல்
  alternative: ‘ஆவிக்குரிய விதத்தில் இறந்தவர்கள்’ என்று விளக்குதல்
  rationale: மூல உரை ‘ஆவிக்குரிய’ என்று வெளிப்படையாகச் சொல்லவில்லை; விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் பவுலின் தீவிரமான உருவகத்தையும் அதன் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
- issue: வசனத்தின் இலக்கண நிறைவு
  choice: முடிவில் நீண்ட கோடு வைத்து அடுத்த வசனங்களோடு தொடரும் அமைப்பைப் பாதுகாத்தல்
  alternative: ‘நீங்கள் இறந்திருந்தீர்கள்’ என்று தனி முழு வாக்கியமாக்குதல்
  rationale: கிரேக்கத்தில் ὑμᾶς என்பது பின்வரும் பிரதான வினையால் நிறைவு பெறும் வேற்றுமை வடிவம்; 2:1 மட்டும் முழுமையான வாக்கியம் அல்ல. ஆங்கில ஆலோசனை உரையின் சீராக்கத்தை விட மூல இலக்கணத்தை முன்னிறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதும். மூலத்தில் வசனம் 2:5 வரை நீளும் வாக்கியத்தின் தொடக்கமாக இருப்பதால், செயற்கையாக முழு வாக்கியமாக மாற்றாமல் நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது.
