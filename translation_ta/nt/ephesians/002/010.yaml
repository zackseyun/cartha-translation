id: EPH.2.10
reference: Ephesians 2:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: ta
  text: ஏனெனில், நாம் அவருடைய படைப்பு; நல்ல செயல்களைச் செய்வதற்காக மெசியாவாகிய இயேசுவுக்குள்[a] படைக்கப்பட்டோம். நாம் அவற்றில் நடக்கும்படி[b] அந்தச் செயல்களைக் கடவுள் முன்கூட்டியே ஆயத்தப்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்து இயேசுவுக்குள்.’ Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்,’ அதாவது ‘மெசியா’ என்னும் பட்டம்.
    reason: alternative_reading
  - marker: b
    text: ‘நடத்தல்’ என்பது இங்கு ஒருவரின் வாழ்க்கை முறையையோ நடத்தையையோ குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίημα
  choice: படைப்பு
  rationale: கடவுளால் உருவாக்கப்பட்ட ஒன்று என்ற திடமான பொருளை இயல்பான தமிழில் தருகிறது; இயந்திரத்தனமான சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: κτισθέντες
  choice: படைக்கப்பட்டோம்
  rationale: κτίζω என்பதன் இறந்தகாலச் செயப்பாட்டு எச்சப் பொருளைப் பாதுகாத்து, தமிழில் முதன்மை வாக்கியத்துடன் இயல்பாக இணைக்கிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவுக்குள்
  rationale: Χριστός என்பதை பெயராக ஒலிபெயர்க்காமல், ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பட்டப்பொருளுடன் மொழிபெயர்க்கிறது; ἐν என்பதற்குரிய இணைவு அல்லது உறவின் பொருளை ‘உக்குள்’ தக்கவைக்கிறது.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: நல்ல செயல்களைச் செய்வதற்காக
  rationale: ἐπί + வேற்றுமை இங்கு காட்டும் நோக்கத்தைத் தெளிவாக்குகிறது; ἔργα என்பதன் நடைமுறை ஒழுக்கச் செயல்பாட்டையும் பாதுகாக்கிறது.
- source_word: προητοίμασεν
  choice: முன்கூட்டியே ஆயத்தப்படுத்தினார்
  rationale: προ- முன்னொட்டின் காலப் பொருளை வெளிப்படையாகக் காட்டுகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்க்கவில்லை.
- source_word: ἐν αὐτοῖς περιπατήσωμεν
  choice: நாம் அவற்றில் நடக்கும்படி
  rationale: περιπατέω என்பதன் பவுலுக்குரிய ‘நடத்தையாக வாழ்தல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; ‘அவற்றில்’ என்பது நல்ல செயல்களைக் குறிக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துடன் உள்ள விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: இங்கு கடவுளைக் குறிக்கும் உரிமைப் பொருளை மரியாதையான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: Χριστῷ என்பதை பட்டமாகவா, பெயர்போன்ற வடிவமாகவா வழங்குவது
  choice: மெசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இவ்விடத்தில் Χριστός அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளைக் கொண்டிருப்பதால் அதை மொழிபெயர்க்கிறது; வழக்கமான மாற்று வடிவத்தை அடிக்குறிப்பில் தருகிறது.
- issue: கடவுளின் முன் ஆயத்தத்திற்கும் மனித நடத்தைக்கும் உள்ள உறவு
  choice: நாம் அவற்றில் நடக்கும்படி அந்தச் செயல்களைக் கடவுள் முன்கூட்டியே ஆயத்தப்படுத்தினார்
  alternative: நாம் அவற்றைச் செய்யும்படி கடவுள் அவற்றை முன்கூட்டியே ஆயத்தப்படுத்தினார்
  rationale: தெய்வீக முன்முயற்சியையும் மனிதர் அவற்றின்படி வாழ வேண்டிய நோக்கத்தையும் உரை கூறும் அளவிலேயே தக்கவைத்து, முன்நியமனம் அல்லது மனித ஒத்துழைப்பு பற்றிய விரிவான கோட்பாட்டு முடிவைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவற்றில் நடக்கும்படி’ என்ற சற்றே அடையாளமிக்க சொற்றொடர் பவுலின் உருவகத்தைப் பாதுகாக்கத் திட்டமிட்டு வைக்கப்பட்டுள்ளது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
