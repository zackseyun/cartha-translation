source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: ta
  text: வரவிருக்கும் யுகங்களில்[a], மேசியாவாகிய இயேசுவில் நம்மீது கனிவுடன் தமது அருளின் எல்லைகளைக் கடந்த செல்வத்தை[b] வெளிப்படுத்துவதற்காகவே இப்படிச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இனிவரும் காலங்களில்.”
    reason: αἰῶνες என்பது ‘யுகங்கள்’ அல்லது நீண்ட ‘காலங்கள்’ என்று மொழிபெயர்க்கப்படலாம்.
  - marker: b
    text: அல்லது, “தமது அருளின் அளவிட முடியாத செல்வத்தை.”
    reason: ὑπερβάλλον என்பது ‘எல்லைகளைக் கடந்த,’ ‘மிகுந்த,’ அல்லது ‘அளவிட முடியாத’ என்ற நெருங்கிய பொருட்களைத் தரக்கூடும்.
lexical_decisions:
- source_word: ἵνα
  choice: வெளிப்படுத்துவதற்காகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கடவுளின் செயலுக்கான நோக்கத்தை உணர்த்துகிறது. ‘-வதற்காகவே’ என்பது ἵνα என்பதன் நோக்கப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐνδείξηται
  choice: வெளிப்படுத்த
  rationale: ἐνδείκνυμι என்பது வெறுமனே தெரியப்படுத்துவது மட்டுமல்லாமல், தெளிவாகவும் காணத்தக்க விதத்திலும் வெளிக்காட்டுவதைக் குறிக்கிறது.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: வரவிருக்கும் யுகங்களில்
  rationale: αἰῶνες என்பதன் பன்மையையும், எதிர்வரும் நீண்ட காலப் பகுதிகள் என்ற கருத்தையும் ‘யுகங்கள்’ காக்கிறது.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: எல்லை கடந்த செல்வம்
  rationale: ὑπερβάλλον என்பதன் ‘மிஞ்சிச் செல்லும், அளவிட முடியாத’ வலிமையையும் πλοῦτος என்பதன் செல்வ உருவகத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: τῆς χάριτος αὐτοῦ
  choice: தமது அருளின்
  rationale: பவுலின் பயன்பாட்டில் χάρις குறிக்கும் கடவுளின் தகுதியற்றவர்களுக்கான அருளை ‘அருள்’ தெளிவாக எடுத்துரைக்கிறது; எழுவாய் கடவுள் என்பதால் ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐν χρηστότητι
  choice: கனிவின் மூலம்
  rationale: χρηστότης குறிக்கும் அன்பான நன்மைச் செயல் மற்றும் இரக்கமுள்ள மனப்பான்மையை ‘கனிவு’ தெரிவிக்கிறது. இங்கு ἐν அந்த அருள் வெளிப்படும் வழி அல்லது முறையாகப் புரிந்துகொள்ளப்பட்டுள்ளது.
- source_word: ἐφ’ ἡμᾶς
  choice: நம்மீது
  rationale: ἐπί + எதிர்மறை வேற்றுமை இங்கு நம்மை நோக்கிய நன்மைமிக்க திசையைச் சுட்டுகிறது; ‘நம்மீது’ அதைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவில்
  rationale: Χριστός இங்கு இன்னும் பட்டப்பெயரின் பொருளைக் கொண்டிருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது. ‘-வாகிய’ என்பது தமிழில் அதை இயேசுவுக்குரிய பட்டமாக இயல்பாக இணைக்கிறது; ‘இயேசுவில்’ என்பது அவருடனான ஒன்றிப்பைச் சுட்டும் பவுலின் சொல்லமைப்பைக் காக்கிறது.
theological_decisions:
- issue: Χριστῷ என்பதைப் பட்டமாகவா, பெயர்போன்ற வடிவமாகவா வழங்குவது
  choice: மேசியாவாகிய இயேசுவில்
  alternative: கிறிஸ்து இயேசுவில்
  rationale: Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மேசியா’ என்ற பட்டப்பொருள் இங்கு செயல்படுகிறது. ஆகவே அதை வெறும் பெயர்போல் ஒலிபெயர்க்காமல், தமிழில் இயல்பாகப் பட்டமாக வழங்கப்பட்டுள்ளது.
- issue: ἐν Χριστῷ Ἰησοῦ என்பதிலுள்ள ἐν-ன் பொருள்
  choice: இயேசுவில்
  alternative: இயேசுவின் மூலம்
  rationale: ‘மூலம்’ என்று மட்டும் மாற்றினால் கருவிப் பொருள் முன்னிலையாகி, மேசியாவுடனான ஒன்றிப்பு அல்லது அவருக்குள் இருப்பது என்ற பவுலின் கருத்து மங்கக்கூடும். எனவே மூலத்தின் இடவுருவகம் பாதுகாக்கப்பட்டுள்ளது.
- issue: ἐν χρηστότητι என்பதன் தொடர்பு
  choice: கனிவின் மூலம் அருளின் செல்வத்தை வெளிப்படுத்துதல்
  alternative: அருளின் கனிவான செல்வம்
  rationale: இலக்கணப்படி ἐν χρηστότητι என்பது வெளிப்படுத்தும் செயல் நிகழும் முறை அல்லது வெளிப்பாட்டைச் சுட்ட வாய்ப்பு அதிகம். அதை ‘அருள்’ என்பதற்கான பெயரடையாகச் சுருக்காமல் தனித்துவமாக வைத்துள்ளது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையை இழக்காமல் அமைக்கப்பட்டுள்ளது. முந்தைய வசனத்தைச் சார்ந்த ἵνα நோக்கவாக்கியம் தமிழில் தனியாகத் தொங்காமல் இருக்க ‘இப்படிச் செய்தார்’ சேர்க்கப்பட்டுள்ளது; இது புதிய செயலை அறிமுகப்படுத்தாமல் முன்சூழலிலுள்ள கடவுளின் உயிர்ப்பித்தல் மற்றும் அமரச்செய்தலைச் சுட்டுகிறது. ‘கனிவு,’ ‘அருள்,’ ‘யுகங்கள்’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மூலத்தின் கருத்து அடர்த்தியைத் தக்கவைக்கும் வகையிலும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
