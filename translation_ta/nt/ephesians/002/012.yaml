id: EPH.2.12
reference: Ephesians 2:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: ta
  text: அந்தக் காலத்தில் நீங்கள் மேசியாவின்றி[a], இஸ்ரவேலின் குடியுரிமையிலிருந்து விலக்கப்பட்டவர்களாகவும், வாக்குத்தத்தத்தின் உடன்படிக்கைகளுக்கு[b] அந்நியர்களாகவும், நம்பிக்கை இல்லாதவர்களாகவும், உலகத்தில் கடவுளின்றி[c] இருந்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்துவின்றி.’ கிரேக்கத்தில் Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பொருளுடைய பட்டம்; இதை ‘மேசியா’ என்றும் ‘கிறிஸ்து’ என்றும் வழங்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘வாக்குத்தத்தத்தோடு தொடர்புடைய உடன்படிக்கைகளுக்கு.’ மூலமொழியில் ‘உடன்படிக்கைகள்’ பன்மையிலும் ‘வாக்குத்தத்தம்’ ஒருமையிலும் உள்ளன.
    reason: lexical_alternative
  - marker: c
    text: ‘கடவுளற்றவர்களாக’ என்றும் பொருள்கொள்ளலாம். இங்கு நவீன தத்துவார்த்த நாத்திகத்தைவிட, உண்மைக் கடவுளுடனான உறவின்றி இருந்த நிலை கருத்தில் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: மேசியாவின்றி
  rationale: Χριστός இங்கு இஸ்ரவேலின் உடன்படிக்கைச் சூழலில் அபிஷேகம் செய்யப்பட்ட மீட்பரைக் குறிக்கும் பட்டமாக உள்ளது. ‘மேசியா’ அந்தப் பட்டத்தின் பொருளைத் தக்கவைக்கிறது; χωρὶς என்பதன் பிரிவுநிலையை ‘இன்றி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπηλλοτριωμένοι
  choice: அந்நியப்படுத்தப்பட்டவர்களாக
  rationale: நிறைவேற்றப்பட்ட செயப்பாட்டு வினையெச்சம், விலக்கப்பட்டு அந்நிய நிலையில் இருந்ததைக் குறிக்கிறது. இந்தத் தேர்வு உறவு மற்றும் குடிமை ஆகிய இரு நுணுக்கங்களையும் தக்கவைக்கிறது.
- source_word: πολιτείας τοῦ Ἰσραήλ
  choice: இஸ்ரவேலின் குடிமைச் சமூகம்
  rationale: πολιτεία என்பது தனிநபரின் சட்டப்பூர்வக் குடியுரிமையை மட்டும் அல்லாமல், இஸ்ரவேலின் ஒழுங்குபடுத்தப்பட்ட குடிமைச் சமூகத்தையும் குறிக்கலாம். ‘குடிமைச் சமூகம்’ அதன் கூட்டு இயல்பை நவீனத் தமிழில் எடுத்துரைக்கிறது.
- source_word: ξένοι
  choice: அந்நியர்கள்
  rationale: உடன்படிக்கைகளின் சமூக மற்றும் உறவுச் சுற்றத்திற்கு வெளியே இருந்தவர்களைச் சுருக்கமாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: διαθηκῶν τῆς ἐπαγγελίας
  choice: வாக்குத்தத்தத்தின் உடன்படிக்கைகள்
  rationale: διαθηκῶν என்பதன் பன்மையையும் ἐπαγγελίας என்பதன் ஒருமையையும் பாதுகாத்து, கிரேக்கச் சொற்றொடரின் இணைப்பை தேவையின்றி விளக்கித் தீர்மானிக்காமல் விடுகிறது.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: நம்பிக்கை இல்லாதவர்களாக
  rationale: அவர்களுடைய முந்தைய நிலையை விவரிக்கும் வினையெச்சத் தொடரை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: ἄθεοι
  choice: கடவுளின்றி
  rationale: நவீன தத்துவார்த்த ‘நாத்திகர்’ என்ற கருத்தைத் திணிக்காமல், உண்மைக் கடவுளுடன் உறவில்லாத இழப்புநிலையை முதன்மையாக வெளிப்படுத்துகிறது; சொல்லின் ‘கடவுளற்ற’ நுணுக்கமும் முற்றிலும் நீக்கப்படவில்லை.
- source_word: ἐν τῷ κόσμῳ
  choice: உலகத்தில்
  rationale: மனித வாழ்வின் களமாகிய உலகைக் குறிக்கும் எளிய, நேரடியான மொழிபெயர்ப்பு.
theological_decisions:
- issue: பவுலின் உரையில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இஸ்ரவேல், உடன்படிக்கைகள், வாக்குத்தத்தம் ஆகிய யூத உடன்படிக்கைச் சூழல் தெளிவாக இருப்பதால், Χριστός ஒரு பட்டமாகிய ‘மேசியா’ என வழங்கப்படுகிறது. மாற்று மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἄθεοι என்பதன் பொருள்
  choice: கடவுளின்றி
  alternative: கடவுளற்றவர்கள்; நாத்திகர்கள்
  rationale: இந்தச் சூழலில் பவுல் முதன்மையாக நவீன தத்துவ நாத்திகத்தை அல்ல, உண்மைக் கடவுளுடனான உறவுக்கு வெளியே இருந்த நிலையைக் குறிப்பிடுகிறார். இருப்பினும் சொல்லின் கடுமையான ‘கடவுளற்ற’ நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: διαθηκῶν τῆς ἐπαγγελίας என்பதிலுள்ள உருபுத் தொடர்பு
  choice: வாக்குத்தத்தத்தின் உடன்படிக்கைகள்
  alternative: வாக்குத்தத்தத்தோடு தொடர்புடைய உடன்படிக்கைகள்
  rationale: மூலத்தில் ‘உடன்படிக்கைகள்’ பன்மையிலும் ‘வாக்குத்தத்தம்’ ஒருமையிலும் உள்ளன. அவற்றின் துல்லியமான தொடர்பை விளக்கவுரை மூலம் ஒரே விதமாக முடிவுசெய்யாமல், நெருக்கமான அமைப்பு தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் நீண்ட இணை அமைப்பும் முந்தைய வசனத்துடன் தொடரும் நினைவூட்டல் ஓட்டமும் பாதுகாக்கப்பட்டுள்ளன. ‘குடிமைச் சமூகம்’ என்பது அரசியல் கட்சி சார்ந்த ‘மக்களாட்சி’ போன்ற தவறான பொருள்களைத் தவிர்த்து πολιτεία என்பதன் கூட்டு-குடிமை நுணுக்கத்தை எடுத்துரைக்கிறது.
