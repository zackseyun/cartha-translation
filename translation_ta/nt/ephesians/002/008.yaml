source:
  edition: SBLGNT
  text: τῇ γὰρ χάριτί ἐστε σεσῳσμένοι ⸀διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: ta
  text: ஏனெனில், அருளினாலே விசுவாசத்தின் வழியாக[b] நீங்கள் காப்பாற்றப்பட்டிருக்கிறீர்கள். இது[a] உங்களிடமிருந்து வந்ததல்ல; கடவுளின் கொடை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இது’ என்பது விசுவாசத்தை மட்டும் அல்லாமல், அருளினாலே விசுவாசத்தின் வழியாக நீங்கள் காப்பாற்றப்பட்டிருக்கிறீர்கள் என்ற முன்னர் கூறப்பட்ட முழுக் கருத்தையும் விரிவாகச் சுட்டுவதாக இருக்கலாம். கிரேக்கத்தில் உள்ள நடுநிலைச் சுட்டுப்பெயர் முந்தைய முழுக் கூற்றைச் சுட்டுவது அதிகம் இயல்பானது.
    reason: alternative_reading
  - marker: b
    text: ‘விசுவாசம்’ என்பதை ‘நம்பிக்கை’ என்றும் புரிந்துகொள்ளலாம்; கிரேக்கச் சொல் சில சூழல்களில் ‘உண்மைத்தன்மை’ என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτί
  choice: அருளினாலே
  rationale: பவுலின் பயன்பாட்டில் χάρις என்பது கடவுளின் தகுதியற்றவர்களுக்குக் காட்டப்படும் தயவையும் அருளையும் குறிக்கிறது. ‘அருள்’ அதன் இறையியல் நிறையையும் இயல்பான தமிழையும் காக்கிறது; வேற்றுமை உருபு இதை வழிமுறையாகக் காட்டுகிறது.
- source_word: ἐστε σεσῳσμένοι
  choice: நீங்கள் காப்பாற்றப்பட்டிருக்கிறீர்கள்
  rationale: நிகழ்கால εἰμί உடன் வரும் நிறைவுற்ற வினையெச்ச அமைப்பு, முடிந்த செயலும் அதன் தொடரும் விளைவும் ஆகிய இரண்டையும் உணர்த்துகிறது. ‘காப்பாற்றப்பட்டிருக்கிறீர்கள்’ இவ்விரண்டையும் நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ πίστεως
  choice: விசுவாசத்தின் வழியாக
  rationale: διά + பிறப்புவேற்றுமை வழிமுறை அல்லது கருவியைக் குறிக்கிறது. πίστις என்பதற்கு இங்கு ‘விசுவாசம்’ என்பது நிலைபெற்ற, சூழலுக்கேற்ற தெரிவாகும்; ‘வழியாக’ கிரேக்கத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: τοῦτο
  choice: இது
  rationale: நடுநிலைச் சுட்டுப்பெயரான τοῦτο, தனியாக அருளையோ விசுவாசத்தையோ விட முந்தைய முழுக் கருத்தையும் சுட்டுவது இயல்பானது. ‘இது’ கிரேக்கத்தின் சுருக்கத்தையும் சுட்டுப்பொருளின் திறந்த தன்மையையும் காக்கிறது.
- source_word: οὐκ ἐξ ὑμῶν
  choice: உங்களிடமிருந்து வந்ததல்ல
  rationale: ἐκ தோற்றுவாயைக் குறிக்கிறது. இந்தத் தமிழாக்கம், காப்பாற்றும் இந்த முழு நிகழ்வு வாசகர்களிடமிருந்து தோன்றவில்லை என்பதை இயல்பாகச் சொல்கிறது.
- source_word: θεοῦ τὸ δῶρον
  choice: கடவுளின் கொடை
  rationale: இந்தப் பெயர்ச்சொல் தொடர் முந்தைய கருத்தைக் கடவுள் அளிக்கும் கொடையாக அடையாளப்படுத்துகிறது. ‘கொடை’ என்பது δῶρον என்பதன் பொருளைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
theological_decisions:
- issue: τοῦτο (‘இது’) என்பது அருள், விசுவாசம், காப்பாற்றப்படுதல் ஆகியவற்றில் எதைச் சுட்டுகிறது?
  choice: ‘இது’ என்பது அருளினால் விசுவாசத்தின் வழியாகக் காப்பாற்றப்படும் முந்தைய முழு நிகழ்வையும் சுட்டுகிறது.
  alternative: ‘இது’ விசுவாசத்தை மட்டும் கடவுளின் கொடையாகச் சுட்டுகிறது; அல்லது அருளை மட்டும் சுட்டுகிறது.
  rationale: τοῦτο என்பது நடுநிலை; χάρις மற்றும் πίστις இரண்டும் பெண்பால் சொற்கள். ஆகவே அது ஒரு தனிச் சொல்லை விட முந்தைய முழுக் கருத்தைச் சுட்டுவதாகப் புரிவது இலக்கண ரீதியாக இயல்பானது. இருப்பினும் முதன்மை உரையில் ‘இது’ என்றே வைத்து கிரேக்கத்தின் சுருக்கத்தையும் இறையியல் இழுபறியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘இரட்சிக்கப்பட்டிருக்கிறீர்கள்’ என்ற திருச்சபைச் சார்ந்த வழக்கை விட, பரந்த வாசகர்களுக்கு உடனடியாகப் புரியும் ‘காப்பாற்றப்பட்டிருக்கிறீர்கள்’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
