source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: ta
  text: அவர்களிடையே நாம் அனைவரும் ஒருகாலத்தில் நமது மாம்சத்தின்[b] ஆசைகளின்படி வாழ்ந்து, மாம்சத்தின் மற்றும் சிந்தனைகளின் விருப்பங்களை நிறைவேற்றி வந்தோம்; மற்றவர்களைப் போலவே நாமும் இயல்பாகக் கோபத்தின் பிள்ளைகளாக[c] இருந்தோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றில்”; கிரேக்கச் சொற்றொடர் கீழ்ப்படியாமையால் அடையாளப்படுத்தப்படும் மக்களையோ, பாவங்களின் வட்டாரத்தையோ சுட்டக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: “மாம்சம்” என்பதை இங்கு “பாவ இயல்பு” என்றும் மொழிபெயர்க்கலாம். முதன்மை உரை பவுலின் சொல்லையும் அதன் முழு இறையியல் நுட்பத்தையும் விளக்கித் தீர்க்காமல் தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “கோபத்தின் பிள்ளைகள்” என்பது கிரேக்க மரபுத்தொடரின் நேரடி வடிவம்; பொருளடிப்படையில் “கோபத்திற்குரியவர்கள்” என்றும் கூறலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: அவர்களிடையே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கீழ்ப்படியாமையின் மக்களை மனிதர்களாகக் குறிக்கும் இயல்பான தமிழ் வடிவம்; ‘அவற்றில்’ என்ற நிகழ்வுநிலை சார்ந்த பொருளும் இலக்கண ரீதியாக சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀνεστράφημέν ποτε
  choice: ஒருகாலத்தில் ... வாழ்ந்து
  rationale: முன்னைய வாழ்க்கை முறையைக் குறிக்கும் ἀναστρέφω என்பதையும் கடந்த நிலையைக் குறிக்கும் ποτε என்பதையும் இயல்பாக எடுத்துரைக்கிறது.
- source_word: ἐπιθυμίαις
  choice: ஆசைகளின்படி
  rationale: பாலியல் இச்சைக்கு மட்டும் குறுக்காமல், ஒழுக்கக்கேடான ஏக்கங்கள் உட்பட பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: σάρξ
  choice: மாம்சம்
  rationale: பவுலின் முக்கியமான சொல்லை விளக்கவுரையாக ‘பாவ இயல்பு’ என்று சுருக்காமல், அதன் மனிதவியல் மற்றும் ஒழுக்கவியல் பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: ποιοῦντες τὰ θελήματα
  choice: விரும்பியவற்றைச் செய்தோம்
  rationale: சொல்லுக்கு சொல் ‘சித்தங்களைச் செய்து’ என்பது தமிழில் கடினமாக இருப்பதால், θέλημα குறிக்கும் விருப்பம் அல்லது நோக்கத்தையும் ποιοῦντες குறிக்கும் நடைமுறைச் செயலையும் இயல்பாக இணைக்கிறது.
- source_word: τῶν διανοιῶν
  choice: சிந்தனைகள்
  rationale: பன்மையில் உள்ள மன எண்ணங்கள் அல்லது சிந்தனைப் போக்குகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: τέκνα ὀργῆς
  choice: கோபத்தின் பிள்ளைகள்
  rationale: செமித்தியத் தன்மையுள்ள கிரேக்க மரபுத்தொடரைப் பாதுகாத்து, அதை உடனடியாக ‘கோபத்திற்குரியவர்கள்’ என்று விளக்கித் தீர்ப்பதைத் தவிர்க்கிறது.
- source_word: φύσει
  choice: இயல்பாகவே
  rationale: ‘இயற்கையால்’ என்பதைக் காட்டிலும் தற்போதைய தமிழில் இயல்பானது; பிறப்பு மட்டுமே என்று பொருளைக் குறுக்காமல் உள்ளார்ந்த நிலை என்ற விவாதத்திற்குரிய வலிமையைத் தக்கவைக்கிறது.
- source_word: οἱ λοιποί
  choice: மற்றவர்கள்
  rationale: கிறிஸ்துவுக்கு வெளியே உள்ள மீதியான மனிதர்களை ஒப்பீட்டில் குறிக்கும் எளிய, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: ஒழுக்கவியல் சூழலில் σάρξ என்பதன் பொருள்
  choice: மாம்சம்
  alternative: பாவ இயல்பு
  rationale: இங்கு பாவத்துடன் தொடர்புடைய ஒழுக்கவியல் வலிமை இருந்தாலும், ‘பாவ இயல்பு’ என்பது பவுலின் மனிதவியலை ஒரு குறிப்பிட்ட விளக்கமாக முடிவுசெய்யும். ‘மாம்சம்’ மூலச் சொல்லையும் அதன் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
- issue: τέκνα φύσει ὀργῆς என்பதன் வலிமை
  choice: இயல்பாகவே கோபத்தின் பிள்ளைகள்
  alternative: பிறப்பிலேயே கோபத்திற்குரியவர்கள்
  rationale: மூலத்தின் மரபுத்தொடரையும் ‘இயல்பாக’ என்பதன் விவாதத்திற்குரிய பொருளையும் தக்கவைக்கிறது; மூலபாவம் அல்லது தீர்ப்புக்குரிய நிலை குறித்த ஒரு முறைப்படுத்தப்பட்ட கோட்பாட்டை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- issue: ἐν οἷς என்பதன் முன்னிலைச் சுட்டு
  choice: அவர்களிடையே
  alternative: அவற்றில்
  rationale: உடனடி சூழலில் ‘கீழ்ப்படியாமையின் மக்கள்’ என்பவர்களைச் சுட்டுவது பொருத்தமானது; இருப்பினும் பாவங்களின் வட்டாரத்தைச் சுட்டும் வாசிப்பும் இலக்கண ரீதியாக சாத்தியமுள்ளதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் வாசிக்க எளிதான, ஆனால் வேதாகம உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சம்’, ‘கோபத்தின் பிள்ளைகள்’ போன்ற மூலத்தின் இறையியல் நிறை கொண்ட சொற்கள் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன; கடினமான ‘சித்தங்களைச் செய்து’ என்பதற்குப் பதில் ‘விரும்பியவற்றைச் செய்தோம்’ என இயல்பாக்கப்பட்டுள்ளது.
